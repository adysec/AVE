[basic]
description = "Windows Telephony Service（TAPI）存在堆缓冲区溢出漏洞（CWE-122），远程攻击者可通过向目标系统发送特制请求触发该漏洞，成功利用可在目标系统上以服务权限执行任意代码。攻击需用户交互（如点击恶意链接或打开特制文件），影响机密性、完整性和可用性。该漏洞影响多个 Windows 版本，Microsoft 已在 2025 年 1 月安全更新中修复。"
published = "2025-01-14T18:15:49Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新（对应 KB5049984/KB5049983/KB5050004/KB5050021/KB5049981，具体版本见 Windows Update），或通过 Windows Update 自动获取更新。受影响版本包括 Windows 10/11 多版本及 Windows Server 2008~2025。无法立即打补丁时，建议限制对 TAPI 服务的网络访问作为临时缓解。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:42:59Z"

