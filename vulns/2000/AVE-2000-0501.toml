[basic]
description = "Microsoft IIS 2.0/3.0/4.0/5.0/5.1 存在安全配置漏洞，当网站启用基本身份验证但未设置身份验证区域时，攻击者可通过简单的 HTTP 1.0 协议请求直接获取服务器的内部IP地址。该漏洞影响广泛版本的IIS服务，攻击者无需任何身份验证即可获得服务器的网络位置信息，为进一步攻击提供重要线索。该漏洞由请求逻辑缺陷引起，由于身份验证流程在未定义区域时返回敏感的网络配置信息，导致CWE-200信息泄露风险。攻击者通过发送特定HTTP头部构造的请求包即可触发该漏洞，对企业网络安全构成严重威胁。"
published = "2000-07-13T04:00:00Z"
remediation = '立即安装 Microsoft IIS 4.0/5.0 对应安全补丁（2000 年 8 月发布）或升级至 IIS 6.0 及更高版本。在 IIS 管理器中为所有启用基本认证的目录配置认证 Realm 值，或禁用基本认证改用 Windows 集成认证（NTLM/Kerberos）。IIS 7.0 及以上版本需执行 appcmd set config -section:system.webServer/serverRuntime /alternateHostName:"服务器名" /commit:apphost 命令设置 alternateHostName。此外，在防火墙或反向代理层面对外隐藏内部 IP 地址，禁止直接响应未携带 Host 头的 HTTP 1.0 请求。'
score = 2.6
severity = "LOW"
sources = ["avd"]
title = "微软 IIS 内部IP地址泄露漏洞"
updated = "2026-06-16T21:52:11Z"

