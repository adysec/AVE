[basic]
description = "bslist.cgi 是 Brian Stanback 开发的邮件列表脚本，该脚本存在远程命令执行漏洞。攻击原理在于脚本未对用户提交的邮件地址参数进行充分过滤，攻击者可在邮件地址字段中嵌入 shell 元字符（如分号、管道符、反引号等），从而注入并执行任意系统命令。该漏洞影响使用 bslist.cgi 1.0 版本的 Web 服务器，无需身份认证即可远程触发。攻击者仅需通过网络向目标服务器发送包含恶意构造邮件地址的请求，即可在服务器上执行任意命令，完全控制目标系统。CVSS 评分 10.0，危害等级严重。"
published = "2001-02-12T05:00:00.000"
remediation = "立即从 Web 服务器中删除 bslist.cgi 1.0 脚本，该软件已停止维护且存在未修复的远程命令执行漏洞。若短期内无法移除，应在 Web 服务器层面（如 Apache 的 mod_rewrite 或 Nginx 的 location 指令）拦截对 bslist.cgi 的所有访问请求。长期建议替换为受持续维护的邮件列表管理工具（如 GNU Mailman、Sympa 或 phpList），并确保 Web 服务器以低权限账户运行，配置严格的输入过滤规则禁止邮件地址字段中出现分号等 shell 元字符。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Brian Stanback bslist.cgi 远程命令执行漏洞"
updated = "2026-06-16T21:53:39.317"

