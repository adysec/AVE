[basic]
description = "WordPress的Hero Maps Premium插件2.2.1及更早版本存在跨站脚本（XSS）漏洞，该漏洞源于插件未能对views/dashboard/index.php页面中p参数的用户输入进行充分过滤和转义。攻击者无需身份验证即可通过构造恶意URL诱导管理员访问，当管理员浏览器加载该页面时，注入的HTML或JavaScript代码将在站点上下文中执行。攻击者可借此窃取用户基于Cookie的身份验证令牌，或在受影响站点中执行任意脚本操作。该漏洞影响所有使用Hero Maps Premium插件2.2.1及以下版本的WordPress站点，CVSS评分为6.1，危害等级为中等。"
published = "2020-02-26T15:15:11.617"
remediation = "立即将 Hero Maps Premium 插件升级至 2.2.2 或更高版本（可在 WordPress 后台「插件」页面点击「立即更新」或从官方下载最新版）。临时缓解：在 Web 应用防火墙（WAF）中拦截包含 `<script>`、`onerror=`、`javascript:` 等 XSS 特征的 `p` 参数请求；或通过 `.htaccess` 限制 `wp-content/plugins/hero-maps-premium/views/dashboard/index.php` 的直接访问。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Hero Maps Premium 插件 跨站脚本漏洞"
updated = "2026-06-17T02:26:12.730"

