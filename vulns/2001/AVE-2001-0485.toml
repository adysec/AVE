[basic]
description = "Agora.CGI 3.x/4.0 的 Debug 调试模式中存在跨站脚本（XSS）漏洞。远程攻击者可通过向 `agora.cgi` 脚本的特定参数注入恶意脚本代码，当管理员或用户访问包含恶意载荷的页面时，脚本将在浏览器中执行，导致敏感信息泄露、会话劫持或钓鱼攻击。该漏洞影响 Agora.CGI 3.x 及 4.0 版本，攻击条件为服务器启用了 Debug 调试模式，无需身份认证即可触发。"
published = "2001-12-17T00:00:00Z"
remediation = "升级到 Agora 4.0g 及以上版本，该漏洞已在后续版本修复。同时在生产环境中务必关闭 Debug Mode（设置 debug=0），避免攻击者通过 cart_id 参数注入恶意脚本。如无法升级，可在 Web 服务器层面对 cart_id 参数进行 HTML 编码过滤，或限制只有受信 IP 可访问 agora.cgi。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Steve Kneizys Agora.CGI 调试模式跨站脚本漏洞"
updated = "2001-12-17T00:00:00Z"

