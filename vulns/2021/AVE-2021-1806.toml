[basic]
description = '大华IPC设备存在身份认证绕过漏洞（CVE-2021-33044），CVSS评分9.8，危害等级严重。该漏洞源于设备在处理DHIP和HTTP登录请求时对clientType参数校验不当，攻击者通过在登录请求中将clientType设置为"NetKeyboard"即可构造恶意数据包，使设备错误地跳过密码验证逻辑，无需任何用户名和密码即可直接获取有效的会话ID。此漏洞影响大华多款IPC网络摄像机、视频对讲门禁（VTH/VTO）、PTZ球型摄像机（SD）及热成像摄像机（TPC）等产品，受影响固件版本为2021年6月至7月修复版本之前的所有型号。攻击者只要能够通过网络访问目标设备的5000（DHIP）、80（HTTP）或443（HTTPS）端口，即可在无需用户交互的情况下远程利用该漏洞完全接管设备，获取最高管理员权限，进而查看实时监控视频、下载录像文件、修改设备配置甚至控制门禁系统，造成严重的隐私泄露和物理安全威胁。'
published = "2021-09-15T22:15:10Z"
remediation = "建议立即将大华设备固件升级至厂商发布的最新安全版本以修复认证绕过漏洞。如无法立即更新，应通过防火墙或 ACL 限制设备管理接口（如 80, 443, 8080 端口）的外部访问，禁止将设备直接暴露在公网中。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "大华 IPC 身份认证绕过漏洞"
updated = "2026-06-17T03:54:03Z"

