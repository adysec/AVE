[basic]
description = "Linux 内核 USB 集线器驱动中存在空指针解引用漏洞（CWE-476）。当 USB 设备不符合 USB 规范，具有过多配置或接口时，hub 驱动可能绑定到错误的接口，导致 usb_hub_to_struct_hub() 函数访问空指针或无效指针，引发一般保护错误（General Protection Fault），造成系统崩溃或拒绝服务。攻击者需具有本地访问权限，并通过向系统插入特制的非合规 USB 设备来触发此漏洞，最终导致内核空指针解引用，影响系统可用性。"
published = "2025-02-27T03:15:18.263"
remediation = "建议将 Linux 内核升级至修复版本：5.4.291、5.10.235、5.15.179、6.1.129、6.6.79、6.12.16 或更高版本，以修复 drivers/usb/core/hub.c 中 USB 集线器驱动对违规设备的空指针解引用漏洞。Debian/Ubuntu 用户应安装对应内核安全更新包，RHEL/CentOS 用户应更新至厂商发布的最新内核 errata。如暂无法立即升级，建议通过 udev 规则或防火墙策略限制非授权 USB 集线器设备的接入，仅允许受信任设备连接，以缓解本地攻击者利用此漏洞导致系统崩溃的风险。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel USB 集线器驱动空指针解引用漏洞"
updated = "2026-06-17T08:44:15.133"

