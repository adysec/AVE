[basic]
description = "Slurp NNTP 客户端 1.1.0 版本的 log_doit 函数存在格式字符串漏洞，恶意新闻服务器可通过在响应中构造特制的格式字符串参数，触发客户端日志记录函数中的格式化输出缺陷，导致远程攻击者可在客户端系统上执行任意代码。攻击者无需身份认证即可通过网络远程利用该漏洞，CVSS 评分 7.5，危害等级高。目前已有公开的利用代码。"
published = "2002-10-04T04:00:00Z"
remediation = "升级 Slurp NNTP 客户端至 1.1.0 以上版本（如已停止维护，建议迁移至 Leafnode 或 tin 等替代客户端）。临时缓解措施：仅连接受信任的新闻服务器，或在网络层面限制客户端仅允许访问指定的可信 NNTP 服务器（端口 119），避免连接恶意服务器触发格式串漏洞。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Slurp NNTP 客户端 SysLog 远程格式字符串漏洞"
updated = "2026-06-16T21:58:22Z"

