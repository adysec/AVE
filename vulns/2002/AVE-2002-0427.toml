[basic]
description = "IGMP（Internet组管理协议）存在拒绝服务漏洞，本地攻击者可通过向目标的以太网地址而非组播组地址发送IGMP成员报告报文，导致目标系统停止向路由器发送成员报告，从而将目标从组播组中断开连接。该漏洞影响Mandrake Linux等系统，攻击者需具备本地访问权限，利用方式简单，可造成目标网络组播通信中断，CVSS评分4.9，危害等级中等。"
published = "2002-12-31T05:00:00Z"
remediation = "建议更新 Linux 内核至 Red Hat 提供的 RHSA-2006-0101/RHSA-2006-0140/RHSA-2006-0190/RHSA-2006-0191 等安全公告中修复该漏洞的内核版本，或安装 SGI 补丁 20020901-01-A。如无法立即更新，可在不需要组播功能的系统上禁用 IGMP 协议（如通过 iptables 过滤 IGMP 报文），并严格限制本地用户访问权限作为临时缓解措施。"
score = 4.9
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux IGMP 协议本地拒绝服务漏洞"
updated = "2026-06-16T22:00:48Z"

