[basic]
description = "CVE-2001-0181是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-03-26T05:00:00.000"
remediation = "由于Caldera Linux已停止维护，建议立即迁移至当前受支持的Linux发行版（如Debian、Ubuntu、RHEL等）并安装官方更新。如短期无法迁移，应将ISC DHCP客户端及服务器升级至3.0.1或更高版本以修复错误日志代码中的格式字符串漏洞。同时临时禁用不必要的DHCP服务，并在防火墙中限制UDP 67/68端口的访问来源，仅允许可信内部网络访问，以此作为临时缓解措施。"
score = 10
