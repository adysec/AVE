[basic]
description = "Apple QuickTime 7.7.2 之前版本在处理 RLE 编码的影片文件时存在缓冲区溢出漏洞。远程攻击者可构造特制的恶意影片文件，通过诱导用户打开该文件触发漏洞，成功利用可导致任意代码执行或应用程序崩溃。该漏洞影响所有 QuickTime 7.7.2 之前版本，攻击复杂度中等，无需身份认证，危害严重。"
published = "2012-05-16T10:12:57Z"
remediation = "立即升级 Apple QuickTime 至 7.7.2 或更高版本（该版本修复了此缓冲区溢出漏洞）。对于 Windows 系统，Apple 已于 2016 年停止支持 QuickTime，建议彻底卸载 QuickTime 并改用其他媒体播放器（如 VLC），同时移除浏览器中的 QuickTime 插件以防止通过网页触发的远程利用。如必须保留使用，应禁用浏览器 QuickTime 插件并将受信任站点列表限制到最小范围。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime RLE编码文件缓冲区溢出漏洞"
updated = "2026-06-16T23:38:02Z"

