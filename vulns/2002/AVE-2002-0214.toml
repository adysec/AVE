[basic]
description = "RealNetworks RealPlayer 8.0 及更早版本存在缓冲区溢出漏洞。当处理特制媒体文件时，攻击者可通过构造一个头部长度值超过实际头部长度的恶意媒体文件，触发缓冲区溢出，从而在目标系统上执行任意代码。攻击者只需诱使用户打开恶意媒体文件即可完成利用，无需其他权限。该漏洞影响 RealPlayer 7.0 和 8.0 版本，CVSS 评分 7.5，危害等级高。"
published = "2002-05-16T04:00:00Z"
remediation = "升级 RealPlayer 至 8.0.5 及以上版本（build 6.0.9.584+），或升级至 RealOne Player。RealNetworks 已在 2002 年发布安全更新修复此缓冲区溢出漏洞。如无法升级，建议禁用 RealPlayer 对媒体文件的自动播放功能，并在网络边界过滤可疑的 .ra/.rm 文件传输。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "RealNetworks RealPlayer 缓冲区溢出漏洞"
updated = "2026-06-16T21:56:59Z"

