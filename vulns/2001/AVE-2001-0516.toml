[basic]
description = "Linux 内核 2.2.19 之前版本的 sockfilter（套接字过滤器）存在边界条件处理缺陷，本地攻击者可利用该漏洞绕过内核安全限制，导致部分敏感信息泄露或数据被篡改。该漏洞影响 Linux 内核 2.2.19 之前的所有版本，攻击者需拥有本地系统访问权限，无需额外认证即可触发，CVSS 评分 3.6，危害等级低。Linux 社区已在 2.2.19 版本中修复此漏洞。"
published = "2001-04-17T04:00:00Z"
remediation = "升级 Linux 内核至 2.2.19 或更高版本，该版本修复了 sockfilter 在处理边界情况时的未知漏洞。如无法升级内核，可通过内核模块或 seccomp 策略限制 sockfilter 的调用权限作为临时缓解措施。"
score = 3.6
severity = "LOW"
sources = ["redhat"]
title = "Linux Linux内核套接字过滤器边界条件漏洞"
updated = "2026-06-16T21:56:11Z"

