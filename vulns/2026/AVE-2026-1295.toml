[basic]
description = "Unraid Web Server 的 ToggleState.php 组件存在命令注入漏洞，由于未对用户提供的字符串进行充分验证便将其用于执行系统调用，导致已通过身份认证的远程攻击者可利用该漏洞在受影响安装上执行任意代码。该漏洞影响 Unraid 7.3.0 之前的所有版本，攻击者需具备 WebGUI 低权限账户并能够访问内部网络，成功利用后将以 www-data 用户身份执行代码，CVSS 评分 8.8，危害等级高。Unraid 已在 7.3.0 稳定版中修复此漏洞。"
published = "2026-06-24T22:16:49Z"
remediation = "立即将 Unraid OS 升级至 7.3.0 或更高稳定版本（当前最新为 7.3.2），升级方法为登录 Web 管理界面，进入 Settings → Update 下载安装。如短期内无法升级，应在防火墙或路由器上限制 Web GUI 仅允许可信内网 IP 访问，或临时禁用外部 80/443 端口映射，以缓解未授权命令注入风险。"
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "Unraid Web Server 命令注入远程代码执行漏洞"
updated = "2026-06-26T20:15:52Z"

