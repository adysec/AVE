[basic]
description = "Easy!Appointments 是一款自托管的预约调度系统，其预约重排页面 `/index.php/booking/reschedule/{appointment_hash}` 在未经验证的情况下将完整的客户记录以内联 JavaScript 形式嵌入响应中，且未对字段进行白名单过滤。攻击者仅需获取 12 字符的 `appointment_hash`（该哈希以明文形式出现在重排邮件、确认页面 URL 及操作员日历链接中），即可通过一次匿名 GET 请求获取该客户在 `ea_users` 表中的全部字段，包括邮箱、电话、地址、自定义字段、时区、语言及 LDAP DN 等敏感个人信息。该漏洞影响 v1.5.2 及之前所有版本，v1.6.0 已修复。"
published = "2026-07-14T15:17:04Z"
remediation = "立即升级至 Easy!Appointments v1.6.0 或更高版本，该版本已对 Booking.php 中 script_vars() 传入的 customer_data 做字段白名单处理，仅保留 id/first_name/last_name。如无法立即升级，可临时关闭确认邮件中的重排链接（修改 Email_settings 模板），或在配置中启用 disable_booking 关闭公开预约页面以降低暴露面。"
score = 6.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "Easy!Appointments 客户敏感信息未授权泄露漏洞"
updated = "2026-07-29T17:16:52Z"

