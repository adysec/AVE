[basic]
description = "Linux 内核 NFS 守护进程（nfsd）子系统中存在一处未正确处理返回值的漏洞。nfsd_proc_stat_init() 函数在调用 svc_proc_register() 创建 proc 文件系统统计条目时未检查返回值，若因 dentry 内存分配失败或存在同名 dentry 导致注册失败，函数仍会返回成功。当内核随后尝试清理或移除该无效条目时，会触发内核警告（WARN），可能导致系统稳定性受损、拒绝服务或内核信息泄露。该漏洞影响运行受影响版本 Linux 内核的系统，攻击者需具备本地低权限访问权限，无需用户交互即可在特定条件下利用，从而造成可用性影响。"
published = "2025-04-16T15:15:55Z"
remediation = "升级 Linux 内核至修复版本：5.10.259、5.15.210、6.1.164、6.6.125、6.9、6.12.24、6.13.12 或 6.14.2 及以上版本。使用发行版包管理器（apt/yum/dnf）安装对应内核安全更新，或从 https://www.kernel.org 下载源码编译安装。如暂无法升级，可通过 systemctl stop nfs-server 禁用 NFS 服务作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 NFSD 错误处理不当漏洞"
updated = "2026-06-19T13:16:20Z"

