[basic]
description = "IRIX 操作系统的 crontab 命令在编辑计划任务时，会在 /tmp 目录下创建临时文件，且文件名可预测（如使用固定模式命名），同时临时文件权限继承当前用户的 umask 设置而非采用安全默认权限。本地攻击者可通过符号链接攻击或直接读写这些可预测的临时文件，在目标用户编辑 crontab 的过程中篡改其内容，从而植入恶意计划任务实现权限提升或执行任意命令。该漏洞影响 SGI IRIX 系统，攻击者需具备本地访问权限，利用条件较为苛刻（需等待目标用户编辑 crontab），但成功利用后可导致机密性、完整性和可用性部分受损。"
published = "2000-06-21T04:00:00Z"
remediation = "该漏洞影响已停止维护的 SGI IRIX 操作系统，官方不再提供安全补丁。建议立即将受影响的 IRIX 系统迁移至受支持的操作平台；若无法迁移，可采取以下缓解措施：(1) 严格限制本地用户登录权限，仅允许受信任的管理员账户访问系统；(2) 将 /tmp 目录挂载为 noexec 并设置粘滞位 (chmod 1777 /tmp)；(3) 在系统全局 umask 设置中强制使用 077，防止临时文件权限过低被其他用户篡改；(4) 使用 auditd 监控 /usr/bin/crontab 的异常调用行为。"
score = 3.7
severity = "LOW"
sources = ["avd"]
title = "SGI IRIX crontab 临时文件权限提升漏洞"
updated = "2026-06-16T21:52:02Z"

