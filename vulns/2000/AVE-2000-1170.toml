[basic]
description = "Novell NetWare 5.1 SP3 的 FTP 服务器组件 NWFTPD.nlm 在 5.01o 之前版本中存在缓冲区错误漏洞（CWE-119）。远程认证用户可通过先发送失败的 RNFR（重命名自）命令，随后发送 RNTO（重命名为）命令触发异常处理错误，导致 FTP 服务进程异常终止（abend），造成拒绝服务。该漏洞无需特殊权限，攻击者仅需拥有合法 FTP 账号即可利用，影响 Novell NetWare 5.1 及 5.01i 等版本。"
published = "2010-04-05T15:30:00Z"
remediation = "将 Novell NetWare 5.1 的 NWFTPD.NLM 升级至 5.01o 或更高版本（如 5.10.02）。如无法立即升级，可在 FTP 服务器配置中限制受信用户对 RNTO/RNFR 命令的使用权限，或通过防火墙限制 FTP 管理端口的访问来源 IP。"
score = 3.5
severity = "LOW"
sources = ["cve"]
title = "Novell NetWare 5.1 FTP 服务器 RNFR/RNTO 命令拒绝服务漏洞"
updated = "2026-06-16T21:53:27Z"

