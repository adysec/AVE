[basic]
description = "HP Tru64 UNIX 4.0g 的 /usr/bin/at 程序存在缓冲区溢出漏洞。该程序在处理本地用户传入的超长命令行参数时，未对输入长度进行有效边界检查，导致栈上缓冲区被覆盖，攻击者可借此覆写返回地址并执行任意代码。该漏洞影响 Tru64 UNIX 4.0g 等版本，CVSS 评分为 7.2（高危），攻击向量为本地，利用复杂度低，无需身份认证即可触发。攻击条件为攻击者需拥有目标系统的本地用户权限；利用方式为构造超长参数调用 /usr/bin/at，配合环境变量中预置的 Alpha 架构 shellcode，实现本地权限提升至 root。该漏洞已在公开渠道披露利用代码，危害等级较高。"
published = "2002-09-09T04:00:00.000"
remediation = '应用 HP（原 Compaq）安全公告 SRB0039W 发布的补丁，修复 Tru64 UNIX 4.0g 中 /usr/bin/at 命令的缓冲区溢出漏洞。受影响版本包括 Tru64 UNIX 4.0g，请通过 Compaq/HP 官方支持渠道获取对应补丁并安装。如无法立即打补丁，可暂时以 root 身份执行 "chmod u-s /usr/bin/at" 移除 /usr/bin/at 的 SUID 位，限制普通用户对该程序的执行权限，作为临时缓解措施，待补丁就绪后恢复并完成升级。'
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "HP Tru64 UNIX /usr/bin/at 本地缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:59:39.543"

