[basic]
description = "vqSoft vqServer 1.4.49 存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向服务器发送超长的 HTTP GET 请求触发该漏洞，导致服务进程崩溃引发拒绝服务，在特定条件下还可利用该漏洞实现权限提升。该漏洞影响 vqServer 1.4.49 版本，CVSS 评分 7.5，危害等级高。"
published = "2000-10-20T04:00:00.000"
remediation = "vqSoft 已停止运营，vqServer 1.4.49 无官方补丁。建议立即迁移至受支持的 Web 服务器（如 Apache HTTP Server 或 Nginx）。如无法迁移，可在网络边界防火墙配置规则，限制仅允许可信 IP 访问该服务器的 80 端口，并部署入侵检测系统（IDS）监控超长 HTTP GET 请求（超过 65535 字节）以阻断利用尝试。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "vqSoft vqServer 1.4.49 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:26.197"

