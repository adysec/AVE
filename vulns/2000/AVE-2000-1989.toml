[basic]
description = "iPlanet Web Server 4.x 的 SHTML 日志记录功能存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向服务器发送包含超长文件名的 .shtml 扩展请求，触发日志记录缓冲区溢出，从而在目标系统上执行任意命令。该漏洞影响 iPlanet Web Server 4.x 系列版本，CVSS 评分为 10.0，危害等级极高，攻击者无需任何认证即可远程利用。"
published = "2000-12-11T05:00:00.000"
remediation = "建议立即迁移至现代受支持的 Web 服务器（如 Nginx、Apache httpd 2.4+ 或 OpenResty），iPlanet Web Server 4.x 已于 2000 年代停止维护无官方补丁。若必须短期继续使用，可在服务器配置中禁用 SHTML 解析功能（移除 .shtml 映射的 MIME 类型与处理器），并在网络层面限制仅受信 IP 访问 80/443 端口，同时部署 WAF 规则拦截超长文件名请求（>255 字节）作为临时缓解。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "iPlanet iPlanet Web Server 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:06.163"

