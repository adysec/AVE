[basic]
description = "BSDi 3.0/4.0 系统中的 rcvtty 程序在执行脚本前未正确丢弃特权（即未执行有效的权限降级），导致本地攻击者可通过在命令行中指定特洛伊木马脚本的方式，以提升后的权限执行任意代码。该漏洞影响 BSDi 3.0 和 4.0 版本，攻击者需拥有本地系统访问权限，无需身份认证即可利用，成功利用后可完全控制目标系统，获取最高权限。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 BSD/OS 至 4.1 或更高版本，该版本已修复 rcvtty 在执行脚本前未正确丢弃特权的问题。如无法升级，可执行 `chmod u-s /usr/bin/rcvtty` 移除 rcvtty 的 setuid 位作为临时缓解，或限制本地非授权用户登录系统。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "BSDi rcvtty 本地权限提升漏洞"
updated = "2026-06-16T21:53:09Z"

