[basic]
description = "MacOS Runtime Java (MRJ) 2.1 及更早版本以及 MacOS 版 Microsoft 虚拟机中的 URLConnection 函数存在安全绕过漏洞。恶意网站运营者可通过构造特制的 HTTP 重定向响应，诱使 Java 应用程序建立到任意主机的网络连接，从而违反 Java 安全模型中的同源策略。攻击者无需身份认证即可远程利用该漏洞，CVSS 评分 10.0，危害等级严重。成功利用此漏洞可导致敏感信息泄露、中间人攻击或进一步的内网渗透。受影响的平台包括 MacOS 上的 Apple MRJ 和 Microsoft Java VM。"
published = "2000-10-20T04:00:00Z"
remediation = "升级 MacOS Runtime Java (MRJ) 至 2.2 或更高版本，该版本修复了 URLConnection 重定向绕过安全模型的问题。如无法升级，在浏览器中禁用 Java applet 支持，或通过系统偏好设置关闭 Java 运行时环境。对于使用 Microsoft VM 的场景，卸载旧版 Microsoft VM for MacOS 并改用 Apple 官方提供的 MRJ 2.2+。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Apple MacOS Runtime Java 及 Microsoft VM HTTP 重定向绕过安全限制漏洞"
updated = "2026-06-16T21:52:00Z"

