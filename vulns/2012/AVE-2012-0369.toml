[basic]
description = "Apple Safari 6.0 之前版本的 WebKit 引擎存在黑名单不完整漏洞。远程攻击者可利用国际化域名（IDN）支持和 Unicode 字体构造同形异义字符（homoglyphs），伪造 URL 中显示的域名，使用户误认为正在访问合法网站而实际被引导至恶意站点。该漏洞影响 Safari 浏览器用户，攻击者无需身份认证即可在网络可达的情况下实施钓鱼攻击，窃取用户敏感信息。Apple 已在 Safari 6.0 中修复此问题。"
published = "2012-07-25T19:55:06.133"
remediation = '升级 Apple Safari 至 6.0 或更高版本以修复该漏洞，受影响用户可前往 Mac App Store 或通过"软件更新"安装最新版 Safari。如暂无法升级，建议暂时禁用 Safari 的 IDN（国际化域名）功能或使用不支持 Unicode 同形字的纯 ASCII 字体作为临时缓解措施，并避免点击来源不明的 URL 链接。'
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari WebKit 域名欺骗漏洞"
updated = "2026-06-16T23:43:44.963"

