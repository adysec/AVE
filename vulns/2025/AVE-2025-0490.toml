[basic]
description = "wolfSSL 5.8.2 及更早版本在解析 TLS 1.3 CKS（Certificate Key Status）扩展时存在输入验证不当漏洞。远程未认证攻击者可通过向目标服务发送特制的包含重复 CKS 扩展的 ClientHello 消息，触发解析逻辑异常，导致服务进程崩溃或进入不可用状态，造成拒绝服务。该漏洞影响运行 wolfSSL 库的多平台系统，攻击者无需任何身份认证即可发起攻击，攻击复杂度较低。"
published = "2025-11-21T23:15:44Z"
remediation = "升级到 wolfSSL 5.8.4 或更高版本。该漏洞已在 PR #9132 中修复，补丁于 2025 年 8 月 26 日合并到 master 分支，并随 5.8.4 版本（2025 年 11 月 20 日发布）正式发布。建议用户立即更新到最新稳定版本。"
score = 2.3
severity = "LOW"
sources = ["msrc"]
title = "wolfSSL TLS 1.3 CKS扩展输入验证不当拒绝服务漏洞"
updated = "2026-06-17T08:31:26Z"

