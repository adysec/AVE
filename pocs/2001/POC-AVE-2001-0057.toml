[info]
author = "ave"
description = "检测 Windows Script Host 5.1/5.5 及 Internet Explorer 5.5 及更早版本中的 GetObject() 文件信息泄露漏洞。远程攻击者可通过构造包含恶意 JavaScript 的 HTML 页面，利用 GetObject 函数配合 htmlfile ActiveX 对象读取目标系统上的任意文件内容。此 PoC 通过尝试读取系统配置文件验证漏洞存在性。"
id = "POC-AVE-2001-0057"
name = "CVE-2001-0149 GetObject File Disclosure PoC"
severity = "medium"
tags = ["ave-2001-0057"]
vuln_id = [
    "CVE-2001-0149",
    "AVE-2001-0057",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["[boot loader]"]
