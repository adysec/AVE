[info]
author = "ave"
description = "检测WatchGuard SOHO防火墙HTTP管理接口未授权访问漏洞。通过直接访问管理接口页面，验证是否无需认证即可获取管理功能页面内容，确认是否存在密码重置、系统重启等管理操作可被未授权执行的风险。"
id = "POC-AVE-2000-1688"
name = "WatchGuard SOHO Firewall HTTP管理接口未授权访问 PoC"
severity = "critical"
tags = ["ave-2000-1688"]
vuln_id = [
    "CVE-2000-0894",
    "AVE-2000-1688",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "WatchGuard",
    "SOHO",
]
