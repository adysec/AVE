[basic]
description = '该漏洞存在于 Zyxel VMG1312-B10D 无线网关设备（版本低于 5.13(AAXA.8)C0）。攻击者可通过向设备发送包含 ".." 目录遍历字符的特制 HTTP 请求，绕过路径限制访问受保护文件，例如读取 /etc/passwd 等敏感系统文件。该漏洞利用无需身份验证，攻击复杂性低，可远程触发，对设备保密性造成高风险影响，已识别为 CWE-22 目录遍历类漏洞。攻击者只需构造简单的 HTTP 请求即可利用此漏洞，危害设备数据安全。'
published = "2018-11-17T14:29:00Z"
remediation = "建议立即将 Zyxel VMG1312-B10D 设备固件升级至 5.13(AAXA.8)C0 或更高版本，可通过 Zyxel 官网下载库 (https://www.zyxel.com/global/en/support/download) 获取最新固件。升级前请备份配置，升级后重启设备验证版本。若无法立即升级，可在防火墙层面限制设备管理界面仅允许受信任 IP 访问，并禁用不必要的 Web 管理端口作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Zyxel VMG1312-B10D 目录遍历漏洞"
updated = "2026-06-17T01:49:08Z"

