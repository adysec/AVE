[basic]
description = "SuSE Linux 6.3/6.4 系统中 Apache HTTP 服务器的默认配置文件（httpd.conf）包含了对 /usr/doc 目录的别名映射，导致远程攻击者无需认证即可通过 HTTP 请求访问 /doc/packages URL，读取系统已安装软件包的文档信息，从而获取系统配置信息，为进一步攻击提供情报支持。"
published = "2000-12-11T05:00:00Z"
remediation = """
[id]
ave_id = "AVE-2000-01016"
aliases = ["CVE-2000-1016"]

[basic]
title = "SuSE Linux Apache /usr/doc 目录信息泄露漏洞"
description = "SuSE Linux 6.3/6.4 中 Apache 默认配置文件（httpd.conf）为 /usr/doc 目录设置了别名，远程攻击者无需认证即可通过 HTTP 请求 /doc/packages URL 读取已安装软件包的文档和系统配置信息，导致敏感信息泄露，为后续攻击提供情报支撑。"
severity = "MEDIUM"
score = 5.0
sources = ["cve", "exploitdb"]
published = "2000-12-11"
updated = "2000-12-11"
remediation = "编辑 Apache 配置文件 httpd.conf，移除或注释掉 /usr/doc 目录的 Alias 配置项，或使用 <Directory> 指令限制对该目录的访问权限，仅允许本地或授权 IP 访问。"

[references]
urls = ["https://nvd.nist.gov/vuln/detail/CVE-2000-1016", "https://www.exploit-db.com/exploits/20236"]

[exploit]
poc_urls = ["https://www.exploit-db.com/exploits/20236"]
