[basic]
description = "Allaire JRun 2.3 服务器存在信息泄露漏洞，未经身份认证的远程攻击者可通过直接访问 SSIFilter servlet 获取可执行内容的源代码。该漏洞利用条件简单，攻击者无需凭据即可在网络上远程触发，导致服务器端敏感源代码被泄露，可能暴露数据库连接信息、业务逻辑或其他敏感数据，进而为后续进一步渗透攻击提供信息支撑。受影响版本为 Allaire JRun 2.3，CVSS v2 评分 5.0，危害等级中危，建议升级至最新版本修复。"
published = "2000-12-11T05:00:00.000"
remediation = "由于 Allaire JRun 2.3.x 早已停止官方支持且无可用补丁，建议立即将应用迁移至受支持的 Java EE 应用服务器（如 Apache Tomcat 9/10 或 Jetty 11+）。若短期内无法迁移，应在防火墙或反向代理层拦截对 /servlet/com.livesoftware.jrun.plugins.ssi.SSIFilter 及 /servlet/ssifilter 路径的访问，禁止外部直接调用 SSIFilter servlet，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Allaire JRun 2.3 源代码信息泄露漏洞"
updated = "2026-06-16T21:53:03.470"

