[basic]
description = "Check Point VPN-1/FireWall-1 4.1 及更早版本存在 FTP 连接重定向漏洞（FTP Bounce）。该漏洞源于 FireWall-1 对无效 FTP 命令的处理不当，未能正确执行 FTP 连接强制检查。未经身份验证的远程攻击者可利用此缺陷，通过发送特制的无效 FTP 命令，绕过防火墙的访问控制机制，将 FTP 连接重定向至其他服务器，从而实现未授权的网络资源访问。攻击条件简单（网络可达、低复杂度、无需认证），可导致敏感数据泄露（机密性影响）。该漏洞于 2000 年 11 月公开，CVSS 评分 5.0（中等），建议升级至修复版本或禁用 FTP 协议以降低风险。"
published = "2000-11-14T05:00:00.000"
remediation = "升级到 Check Point VPN-1/FireWall-1 4.1 以上版本，该漏洞已在后续版本中修复。如无法升级，在防火墙上禁用 FTP 协议检测或限制 FTP 出站连接的目标地址范围，防止 FTP 反弹攻击。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Check Point VPN-1/FireWall-1 FTP重定向漏洞"
updated = "2026-06-16T21:52:32.053"

