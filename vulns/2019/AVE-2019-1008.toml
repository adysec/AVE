[basic]
description = "Sangoma FreePBX 存在不正确的访问控制漏洞，未经身份认证的远程攻击者可利用该漏洞绕过权限检查，直接访问系统管理接口或执行敏感操作，导致机密性、完整性和可用性全面受损。该漏洞影响 FreePBX 13.0.197.13 及更早版本、14.0.13.11 及更早版本、15.0.16.26 及更早版本，CVSS 评分 9.8，危害等级严重。攻击无需用户交互，利用复杂度低，建议用户立即升级至修复版本。"
published = "2019-11-21T18:15:11Z"
remediation = "立即将 FreePBX 升级至 13.0.197.14 及以上、14.0.13.12 及以上或 15.0.16.27 及以上版本，该漏洞已在 GitHub 提交 4e4675d 中修复（重排认证流程顺序并对 password 参数做强制类型转换）。如无法立即升级，可在反向代理层（Nginx/Apache）添加规则拦截 password[] 数组参数传递，并限制 FreePBX 管理后台仅允许可信 IP 访问。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Sangoma FreePBX 访问控制不当漏洞"
updated = "2026-06-17T15:45:04Z"

