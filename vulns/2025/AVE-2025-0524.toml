[basic]
description = "Google Chrome 142.0.7444.59之前版本中的扩展程序存在策略绕过漏洞（CWE-288）。攻击者通过诱骗用户安装恶意扩展程序，利用该扩展程序绕过同源策略，从而泄露跨源数据。该漏洞影响Windows/Linux/macOS平台上的Chrome浏览器，攻击者无需身份认证即可通过网络远程触发，CVSS评分6.5，危害等级中危。Google已在2025年10月发布的稳定版更新中修复此漏洞，建议用户升级至142.0.7444.59及以上版本。"
published = "2025-11-10T20:15:39Z"
remediation = "立即将 Google Chrome 升级至 142.0.7444.59 或更高版本（通过 Chrome 设置 > 关于 Chrome > 自动检查更新）；Fedora 42 用户执行 `sudo dnf update chromium` 升级至 142.0.7444.162。如无法立即更新，可在浏览器设置中禁用所有未经验证的第三方扩展作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome 扩展程序策略绕过漏洞"
updated = "2026-06-17T08:32:23Z"

