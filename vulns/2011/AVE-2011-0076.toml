[basic]
description = "Adobe Flash Player 及 Adobe AIR 存在缓冲区溢出漏洞（CWE-119）。远程攻击者无需身份认证即可通过诱导用户访问特制的网页或打开恶意文件触发该漏洞，成功利用后可导致任意代码执行，完全控制受影响系统。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上的 Flash Player 10.3.183.5 之前版本及 Adobe AIR 2.7.1 之前版本，CVSS 评分 10.0，危害等级严重。Adobe 已于 2011 年 8 月发布安全更新修复此漏洞。"
published = "2011-08-10T21:55:02Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.5 及以上版本（Windows/Mac/Linux/Solaris）或 10.3.186.3 及以上版本（Android），同时升级 Adobe AIR 至 2.7.1 及以上版本。由于 Adobe Flash Player 已于 2020 年底停止支持并停止分发，建议彻底卸载 Flash Player，改用 HTML5 替代方案，从根本上消除风险。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 缓冲区溢出漏洞"
updated = "2026-06-16T23:30:45Z"

