[basic]
description = "tags.<value>NullLogic Null HTTP Server 0.5.0 及更早版本存在跨站脚本（XSS）漏洞。远程攻击者无需身份认证即可通过构造恶意请求触发服务器返回包含任意 HTML 的 404 错误页面，从而在受害者浏览器中执行注入脚本。该漏洞影响使用 Null HTTP Server 的所有用户，攻击条件宽松，只需诱使目标用户访问特制链接即可触发。CVSS 评分为 4.3，危害等级为中等。"
published = "2003-04-02T05:00:00.000"
remediation = "升级到 Null HTTP Server 0.5.1 及以上版本，此版本修复了 404 页面 HTML 渲染漏洞并移除了可攻击的错误页面模板。升级步骤：1）下载最新版本的 installer.exe 安装包；2）备份原有 nullhttpd.conf 配置文件；3）执行安装并更新配置文件，将原始 404 错误页面替换为安全的 HTML 模板；4）重启服务验证修复效果。如无法立即升级，可通过防火墙规则限制访问端口 80/8080，禁止非信任 IP 访问此服务；同时通过防火墙插入的安全头标签实现 basic XSS 过滤，阻止恶意 HTML 注入攻击。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "NullLogic Null HTTP Server 跨站脚本漏洞"
