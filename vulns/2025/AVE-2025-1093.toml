[basic]
description = "Linux内核RDMA hns驱动在分配bt页并映射缓冲区页时运行for循环，当处理超过100GB的大缓冲区内存注册（MR）时，循环迭代次数过多导致CPU无法被调度而触发watchdog软锁定。该漏洞影响搭载华为RoCE V2网卡（hns_roce_hw_v2）的Linux系统，具有本地低权限的攻击者可通过注册超大内存区域调用ib_uverbs_reg_mr接口，触发hem_list_alloc_mid_bt或hns_roce_hem_list_find_mtt等函数中的深度循环，造成CPU持续卡死超过22秒，最终导致系统拒绝服务。"
published = "2025-04-08T09:15:24Z"
remediation = "升级Linux内核至包含修复 commit 25655580136de59ec89f09089dd28008ea440fc9 的稳定版本，具体为：5.10.236 及以上、5.15.180 及以上、6.1.132 及以上、6.6.85 及以上、6.12.21 及以上、6.13.9 及以上。如使用发行版，请安装对应内核安全更新包（Debian/Ubuntu 安装 linux-image 最新安全版本，RHEL/CentOS 安装相应内核 errata）。如暂时无法升级内核，临时缓解措施是避免在 RDMA/hns 驱动上分配超过 100GB 的大内存区域（MR），或通过内核启动参数禁用 hns_roce 驱动以消除攻击面，待维护窗口期完成内核升级。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 RDMA HNS 驱动软锁定漏洞"
updated = "2026-06-17T08:44:50Z"

