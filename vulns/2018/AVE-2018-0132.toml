[basic]
description = "CentOS Web Panel（CWP）0.9.8.480 版本 admin/index.php 存在路径遍历漏洞，远程攻击者无需身份认证即可通过构造包含 `../` 的 `file` 参数（如 `admin/index.php?module=file_editor&file=/../../../etc/passwd`）读取服务器上任意文件，导致敏感信息泄露。该漏洞利用难度低，无需用户交互，影响所有运行 CWP 0.9.8.480 的服务器。"
published = "2018-10-15T07:29:00Z"
remediation = "立即将 CentOS Web Panel (CWP) 升级至最新版本（当前为 0.9.8.1235 以上），可通过官方更新脚本 `/scripts/update_cwp` 一键升级。如无法立即升级，在 Nginx/Apache 反向代理或 WAF 层面添加规则，拦截 `admin/index.php` 中 `file` 参数包含 `../` 的请求，并限制 `module=file_editor` 仅允许白名单 IP 访问。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "CentOS Web Panel 本地文件包含漏洞"
updated = "2026-06-17T01:46:59Z"

