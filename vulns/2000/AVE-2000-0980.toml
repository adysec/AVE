[basic]
description = "这是一个针对 Allaire Spectra 1.0.1 管理界面工具的漏洞，攻击者可以绕过身份验证读取和修改系统中的敏感配置信息。该漏洞源于该管理界面在访问控制方面的缺陷，允许远程无认证攻击者直接访问系统中的配置文件，窃取和篡改数据库凭证、应用设置等重要机密信息。该漏洞直接威胁系统的保密性和完整性，虽然不影响可用性，但可能导致更大范围的安全问题。攻击者可以完全控制应用配置，实现窃取数据或进一步攻击系统的目的。该漏洞 CVSS 向量为 AV:N/AC:L/Au:N/C:P/I:P/A:N（中危），攻击者无需任何权限即可远程利用该漏洞进行攻击。"
published = "2000-11-14T05:00:00.000"
remediation = "建议立即升级 Allaire Spectra 至 1.0.2 或更高版本（Macromedia 已发布补丁修复此漏洞）。若暂时无法升级，请立即在 Web 服务器层面（如 IIS/Apache）配置访问控制，限制 Spectra 管理界面（/spectra/admin/ 等路径）仅允许受信任 IP 访问，或在 Web 服务器层面配置 IP 白名单/基本认证保护管理接口；同时在防火层面封锁非受信来源对管理端口（默认 80/443）的访问，作为临时缓解措施。"
score = 6.4
severity = "MEDIUM"
sources = ["epss"]
title = "Allaire Spectra 管理界面敏感配置信息读取修改漏洞"
updated = "2026-06-16T21:52:37.423"

