[basic]
description = "Snort 1.6 网络入侵检测系统在以纯 ASCII 数据包日志模式或 IDS 模式（并启用纯解码 ASCII 数据包日志）运行时，存在拒绝服务漏洞。未经身份认证的远程攻击者可通过向目标系统发送 Snort 无法识别的非 IP 协议数据包（例如 nmap 协议扫描产生的数据包）触发该漏洞，导致 Snort 进程崩溃，从而无法继续检测网络攻击行为。该漏洞影响所有开启 ASCII 日志记录的 Snort 1.6 版本。"
published = "2000-12-31T05:00:00Z"
remediation = "升级至 Snort 1.7 或更高版本（1.7 于 2000 年 6 月发布已修复该问题）。临时缓解：在 snort.conf 中禁用 ASCII 封包日志模式，改用 -A fast 或 -A full 模式启动 Snort，避免使用 -A ascii 参数。若必须使用 ASCII 日志，请在防火墙层面过滤非标准 IP 协议（如 nmap 协议扫描使用的原始协议包）。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Snort 1.6 ASCII 数据包记录拒绝服务漏洞"
updated = "2026-06-16T21:53:25Z"

