[basic]
description = "Easy Guestbook 1.0 的 CGI 程序未对管理员操作进行身份认证，未经身份验证的远程攻击者可通过直接访问 admin.cgi 删除留言板条目，或通过直接访问 config.cgi 重新配置留言板设置。该漏洞影响 Ben Chivers Easy Guestbook 1.0 版本，攻击者无需任何凭据即可在远程获取对留言板管理功能的未授权访问权限，可能导致数据被篡改、删除或配置被恶意修改，CVSS 评分 7.5，危害等级高。"
published = "2003-04-11T04:00:00Z"
remediation = "该软件为 Ben Chivers Easy Guestbook 1.0，已停止维护且无官方补丁。建议立即升级到现代化的留言板系统（如 PHP Guestbook、Drupal 留言模块等），或彻底删除 Easy Guestbook 的 admin.cgi 与 config.cgi 文件。若短期内无法替换，应在 Web 服务器配置中通过 .htaccess 或防火墙规则限制对 admin.cgi 和 config.cgi 的访问来源 IP，仅允许可信地址访问，并重启 Web 服务使配置生效。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Ben Chivers Easy Guestbook 未授权管理访问漏洞"
updated = "2026-06-16T21:59:16Z"

