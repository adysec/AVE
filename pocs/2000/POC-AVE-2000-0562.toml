[info]
author = "AVE"
description = "检测 Multisoft FlagShip 4.4 安装目录下 FSserial、FlagShip_c、FlagShip_p 文件是否为全局可写权限。本地攻击者可替换这些文件植入木马，实现权限提升。"
id = "POC-AVE-2000-0562"
name = "CVE-2000-0721 PoC"
severity = "medium"
tags = [
    "cve-2000-0721",
    "flagship",
    "permission",
    "local",
]
vuln_id = [
    "CVE-2000-0721",
    "AVE-2000-0562",
]

[poc]
logic = "any"

[[poc.requests]]
path = "/usr/bin/FSserial"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = ".+"
type = "regex"

[[poc.requests]]
path = "/usr/bin/FlagShip_c"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = ".+"
type = "regex"

[[poc.requests]]
path = "/usr/bin/FlagShip_p"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = ".+"
type = "regex"
