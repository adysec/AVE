[basic]
description = "STunnel 3.22 之前版本在客户端模式下处理 SMTP、POP、NNTP 协议协商时存在格式化字符串漏洞。远程恶意服务器可通过精心构造的格式化字符串参数，利用 printf 族函数未正确验证格式化字符串的缺陷，实现任意代码执行。该漏洞影响所有使用 stunnel 3.22 之前版本作为客户端连接 SMTP、POP3 或 NNTP 服务的场景，攻击者只需控制恶意服务器诱导客户端连接即可触发，无需认证且攻击复杂度低，CVSS 7.5 分（HIGH）。攻击者可通过发送包含格式化字符串（如 %n、%s、%x）的服务器响应，控制程序执行流实现远程代码执行。官方已在 stunnel 3.22 版本中修复该漏洞，建议升级至 3.22 或更高版本。"
published = "2002-01-31T05:00:00.000"
remediation = "立即升级 stunnel 至 3.22 或更高版本（官方已在 3.22 修复该格式化字符串漏洞）。若无法立即升级，建议：1) 避免在 SMTP/POP/NNTP 客户端模式下使用 stunnel 连接不可信服务器；2) 在防火墙层面限制 stunnel 客户端仅允许连接受信任的邮件/新闻服务器 IP；3) 若必须使用旧版本，建议通过 stunnel 配置文件禁用 client 模式下的 SMTP/POP/NNTP 协议支持，改用 TLS 原生支持的邮件客户端。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "stunnel stunnel 格式字符串漏洞"
updated = "2026-06-16T21:56:34.180"

