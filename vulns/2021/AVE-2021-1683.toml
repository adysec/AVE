[basic]
description = "Apple 旗下 iOS、iPadOS、macOS、tvOS 及 watchOS 系统存在越界写入漏洞（CWE-787），由于内存处理不当导致内存损坏。本地攻击者可通过引导用户在受影响的设备上打开恶意应用程序触发该漏洞，进而以内核权限执行任意代码，完全控制目标系统。该漏洞影响 iOS 15.0.2 及更早版本、iPadOS 15.0.2 及更早版本、macOS Monterey 12.0.1 及更早版本、iOS 14.8.1 及更早版本、iPadOS 14.8.1 及更早版本、tvOS 15.1 及更早版本、watchOS 8.1 及更早版本以及 macOS Big Sur 11.6.1 及更早版本。Apple 已确认该漏洞可能已在野被积极利用，并在 iOS 15.0.2、iPadOS 15.0.2、macOS Monterey 12.0.1、iOS 14.8.1、iPadOS 14.8.1、tvOS 15.1、watchOS 8.1 及 macOS Big Sur 11.6.1 中通过改进内存管理完成修复。"
published = "2021-08-24T19:15:16Z"
remediation = '立即将设备升级到 iOS 15.0.2 或 iPadOS 15.0.2（iPhone 6s 及更新机型、iPad 第 5 代及更新机型），或升级到 iOS 14.8.1 和 iPadOS 14.8.1；Mac 用户升级到 macOS Monterey 12.0.1 或 macOS Big Sur 11.6.1；Apple TV 升级到 tvOS 15.1；Apple Watch 升级到 watchOS 8.1。如暂无法升级，应避免从非可信来源安装恶意应用，限制应用程序对内核的访问权限，并关闭不必要的后台应用刷新以降低被利用风险。打开"设置">"通用">"软件更新"检查并安装最新系统版本。'
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Apple iPadOS 内存越界写入漏洞"
updated = "2026-06-17T03:51:04Z"

