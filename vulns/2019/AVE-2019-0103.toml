[basic]
description = "WordPress 的 api-bearer-auth 插件在 2019 年 9 月 7 日之前的版本中，swagger-config.yaml.php 文件对 server 参数缺乏有效过滤，未经身份验证的远程攻击者可通过构造包含恶意 JavaScript 代码的请求参数实施跨站脚本（XSS）攻击。该漏洞影响使用该插件的 WordPress 网站，攻击者成功利用后可在受害者浏览器中执行任意脚本代码，窃取敏感信息或劫持用户会话。攻击者需诱使用户点击特制链接或访问恶意页面才能触发漏洞。"
published = "2019-09-15T22:15:10.370"
remediation = "将 api-bearer-auth 插件升级至 20190907 或更高版本，该版本已对 swagger-config.yaml.php 文件中的 server 参数进行输入过滤，修复了 XSS 漏洞。如暂时无法升级，可临时禁用该插件的 Swagger 功能或通过 Web 服务器配置限制对 swagger-config.yaml.php 的直接访问。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress api-bearer-auth 插件跨站脚本漏洞"
updated = "2026-06-17T02:22:08.397"

