[basic]
description = "ManageEngine ServiceDesk 9.3.9328 版本存在任意文件下载漏洞，由于 download-snapshot URL 中 name 参数对路径名限制不当，未经身份认证的远程攻击者可通过构造包含路径遍历序列的特制请求，利用该漏洞下载服务器上的任意敏感文件，如配置文件、数据库凭证等。该漏洞影响范围广泛，攻击复杂度低，无需任何权限即可利用，CVSS 评分 7.5，危害等级高。"
published = "2017-11-08T22:29:00.403"
remediation = '立即升级至 ServiceDesk Plus 9.3.9333 或更高版本（推荐升级至当时最新版 9400）。升级步骤：1) 停止 ManageEngine ServiceDesk 服务；2) 进入安装目录 \\bin 执行 backUpData.bat 备份数据；3) 从官方下载对应版本的 .ppm 补丁文件；4) 运行 UpdateManager.bat，选择下载的补丁文件并安装。如无法立即升级，可在 Web 服务器或 WAF 层面添加规则，拦截对 /fosagent/repl/download-snapshot 路径的未授权访问请求作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "ManageEngine ServiceDesk 任意文件下载漏洞"
updated = "2026-06-17T01:01:55.380"

