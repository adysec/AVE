[basic]
description = "Windows 远程桌面服务（Remote Desktop Services）存在释放后使用（Use-After-Free）漏洞，未经身份认证的远程攻击者可通过向目标系统发送特制请求触发该漏洞，成功利用可在目标系统上以系统权限执行任意代码。该漏洞攻击复杂度较高（需在特定时间窗口内发送构造的数据包），但无需用户交互或任何权限，CVSS评分8.1，危害等级高。影响包括 Windows 10/11 及 Windows Server 2019/2022 等多个版本。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:51Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新（KB5050004），通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。受影响版本包括 Windows Server 2008 R2 至 2025，更新后版本号分别为 6.1.7601.27520、6.2.9200.25273、6.3.9600.22371、10.0.14393.7699、10.0.17763.6775、10.0.20348.3091、10.0.25398.1369、10.0.26100.2894。如无法立即打补丁，建议限制 RDP 服务的公网暴露，启用网络级认证（NLA）并配置防火墙规则仅允许受信 IP 连接。"
score = 8.1
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 远程桌面服务远程代码执行漏洞"
updated = "2026-06-17T08:43:01Z"

