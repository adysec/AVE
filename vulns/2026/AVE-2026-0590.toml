[basic]
description = 'Coder OIDC 认证回调处理中存在类型断言缺陷，直接使用 Go `bool` 类型断言检查 `email_verified` 声明。当身份提供商（IdP）返回非布尔类型（如字符串 `"false"`）或省略该声明时，断言失败却采取了开放策略，导致未验证的邮箱被视为已验证。结合无条件的邮箱回退关联机制，攻击者可在兼容的 IdP 注册受害者邮箱但不验证，随后通过 OIDC 登录并匹配到受害者现有的 Coder 账户，实现无需前置认证的完整账户接管。该漏洞影响 Coder 2.29.7、2.32.7、2.33.8、2.34.2 之前的所有版本，CVSS 评分 7.4（HIGH）。官方已在上述版本中修复，强制对 `email_verified` 进行跨类型强制转换（fail-closed）并阻止已关联不同 IdP 主体用户的邮箱回退。'
published = "2026-07-07T23:16:55Z"
remediation = '建议立即升级 Coder 到对应修复版本：2.34.x 升级至 v2.34.2，2.33.x 升级至 v2.33.8，2.32.x 升级至 v2.32.7，2.29.x (ESR) 升级至 v2.29.17。作为临时缓解，确保 IdP 返回的 email_verified 为原生 JSON 布尔类型（非字符串 "false"），但邮箱回退关联问题无配置层面缓解方案，必须升级修复。参考修复 PR：#25712、#25713。升级地址：https://github.com/coder/coder/releases'
score = 7.4
severity = "HIGH"
sources = ["ghsa"]
title = "Coder OIDC 邮箱验证类型强制跳过认证触发账户接管漏洞"
updated = "2026-07-08T19:46:04Z"

