[basic]
description = "Admidio 的 modules/plugins.php 端点在对插件执行安装、卸载和更新操作时使用 GET 请求且未进行 CSRF Token 验证。由于浏览器在顶层 GET 导航时会自动携带 SameSite=Lax 会话 Cookie，未经身份认证的攻击者可构造恶意页面诱导已登录的管理员访问，从而触发任意插件操作。其中卸载操作会执行插件目录下的 DROP TABLE SQL 脚本，导致数据库表被删除、数据永久丢失；安装操作可激活存在已知漏洞的插件；更新操作可能破坏插件功能。攻击者仅需通过钓鱼链接或嵌入内容诱导管理员访问单个页面即可完成攻击。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级至 Admidio 5.0.11 或更高版本，该版本已修复 plugins.php 中插件安装/卸载/更新操作缺少 CSRF 令牌校验的问题。如无法立即升级，在 `modules/plugins.php` 中所有 `mode=install`、`mode=uninstall`、`mode=update` 的 GET 请求处理分支前添加 `SecurityUtils::validateCsrfToken()` 调用，并将相关操作改为 POST 方法接收参数。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Admidio 插件管理模块跨站请求伪造漏洞"
updated = "2026-01-01T00:00:00Z"

