[basic]
description = "dotCMS 5.0.2之前版本存在开放重定向漏洞，攻击者可通过向 `html/common/forward_js.jsp` 页面的 `FORWARD_URL` 参数或 `html/portlet/ext/common/page_preview_popup.jsp` 页面的 `hostname` 参数传入恶意URL，诱导用户点击后将其重定向至任意外部站点。该漏洞无需认证即可利用，但需要用户交互（点击链接），可被用于钓鱼攻击或绕过URL白名单检查。CVSS评分6.1，危害等级中危。"
published = "2019-03-07T23:29:01Z"
remediation = "升级 dotCMS 至 5.0.2 或更高版本，该版本已修复 `forward_js.jsp` 和 `page_preview_popup.jsp` 中的开放重定向问题。如无法立即升级，可在反向代理层（如 Nginx）添加规则，对 `FORWARD_URL` 和 `hostname` 参数进行白名单校验，仅允许跳转到可信域名，或直接拦截包含外部域名的重定向请求。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "dotCMS 开放重定向漏洞"
updated = "2026-06-17T01:45:48Z"

