[basic]
description = "Flyto2 Core 是自动化与 AI 代理工作流的执行内核。在 2.26.6 版本之前，其 llm.chat 函数会从环境变量中读取 OPENAI_API_KEY、ANTHROPIC_API_KEY 等提供商密钥，并将其通过 Authorization: Bearer 请求头发送到调用者可控的 base_url 参数指向的端点。由于 SSRF 防护仅阻止内网地址而允许任意公网主机，攻击者可通过控制 base_url 参数将请求重定向至自己控制的服务器，从而窃取运营者的 API 密钥。该漏洞影响 Flyto2 Core 所有低于 2.26.6 的版本，攻击者无需认证即可远程利用，危害严重。"
published = "2026-07-29T19:16:51Z"
remediation = "升级 Flyto2 Core 至 v2.26.6 或更高版本，该版本修复了 llm.chat 将环境变量中的 API 密钥发送至攻击者可控 base_url 的问题。如无法立即升级，应避免在 llm.chat、ai.model、llm.agent 及 vector.connector 中向不可信来源传递自定义 base_url 参数，并审查所有调用方对 base_url 的控制权限。"
score = 8.6
severity = "HIGH"
sources = ["ghsa"]
title = "Flyto2 Core LLM/API密钥泄露漏洞"
updated = "2026-07-30T16:41:25Z"

