[basic]
description = "mopd（Maintenance Operations Protocol loader daemon，维护操作协议加载守护进程）存在格式化字符串漏洞，该程序未能正确过滤用户输入的格式化字符串参数，导致远程攻击者可通过向目标系统的 mopd 服务发送特制的格式化字符串载荷触发漏洞，从而执行任意命令。该漏洞影响运行 mopd 服务的 Unix/Linux 系统，攻击者无需身份认证即可远程利用，CVSS 评分 7.5，危害等级高。目前厂商已发布相关安全更新修复此漏洞。"
published = "2000-10-20T04:00:00.000"
remediation = "立即升级 mopd 至已修复版本：OpenBSD 用户安装对应补丁（参见 errata#mopd），NetBSD 用户更新 process.c 至 r1.8 版本，Red Hat Linux 用户安装 RHSA-2000-050 提供的更新包。如无法升级，在防火墙禁用 mopd 服务端口（默认 782/TCP）或停止 mopd 守护进程作为临时缓解。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "多款Unix系统 mopd 远程格式化字符串漏洞"
updated = "2026-06-16T21:52:24.320"

