[basic]
description = "Linux 内核 5.1.17 之前版本中的 ptrace_link 函数（kernel/ptrace.c）存在权限管理缺陷，在处理进程间 ptrace 关系建立时未正确记录凭证信息。本地低权限用户可利用父子进程关系中的特定场景，通过父进程降权后调用 execve 的时机，结合 Polkit 的 pkexec 辅助程序与 PTRACE_TRACEME 机制，绕过内核权限检查实现提权至 root。该漏洞影响所有使用受影响内核版本的 Linux 发行版，CVSS 评分 7.8，危害等级高。此外，对象生命周期问题也可能导致内核崩溃。SELinux deny_ptrace 策略可在部分环境中作为临时缓解措施。"
published = "2019-07-17T13:15:10Z"
remediation = "立即升级 Linux 内核至 5.1.17 或更高版本（如 5.2.x 系列），各发行版对应：Ubuntu 安装 5.1.17+ 内核包，CentOS/RHEL 7 升级至 kernel-3.10.0-1062.el7，Debian 升级至 4.19.67-1。如无法立即升级，可启用 SELinux 并设置 deny_ptrace=1 作为临时缓解，或通过 grub 内核参数添加 `ptrace=off` 禁用 ptrace 系统调用。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Linux Linux内核 ptrace本地提权漏洞"
updated = "2026-06-17T02:16:26Z"

