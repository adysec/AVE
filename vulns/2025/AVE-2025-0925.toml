[basic]
description = "Linux内核的eBPF模块中，bpf_sk_select_reuseport()函数在处理sockmap查找结果时存在引用计数错误，未能正确释放socket对象的引用计数，导致内存泄漏。当sockmap查找返回一个已处于TCP ESTABLISHED状态的socket时，该socket可能在连接建立前已通过setsockopt设置了SO_ATTACH_REUSEPORT_EBPF选项，此时sk_reuseport_cb非空但socket并未增加引用计数，函数在错误处理路径中直接返回而未释放引用，造成内核内存泄漏。该漏洞影响Linux内核，攻击者需要本地低权限用户权限，通过触发特定的BPF程序或socket操作即可复现该漏洞，长期运行可导致系统内存耗尽。CVSS 3.1评分为5.5，危害等级为中等。"
published = "2025-01-31T12:15:29Z"
remediation = "建议将 Linux 内核升级至以下修复版本之一：5.15.177、6.1.127、6.6.74、6.12.11 或更新版本。可通过发行版包管理器执行升级，例如 Debian/Ubuntu 使用 apt，RHEL/CentOS 使用 dnf/yum。如暂无法升级，可通过 sysctl 临时禁用 bpf_sk_select_reuseport() 相关 BPF 程序加载，或限制本地用户对 SO_ATTACH_REUSEPORT_EBPF setsockopt 的访问权限作为缓解措施。升级后请重启系统使新内核生效。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 BPF 模块内存泄漏漏洞"
updated = "2026-06-17T08:44:00Z"

