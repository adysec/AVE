[basic]
description = "Gitea 存在身份验证令牌权限限制绕过漏洞。公有权限的个人访问令牌可以访问私有组织的信息和权限，导致权限控制失效。攻击者可以利用 /api/v1/user/orgs 和 /api/v1/users/{username}/orgs/{org}/permissions 等端点，获取用户所属私有组织的用户名称、所有权状态、管理权限、读写权限及创建仓库能力等敏感信息。这种漏洞源于安全检查逻辑不一致，导致公有令牌实际获得了访问私有组织数据的能力，破坏了最小权限原则，可能导致组织权限和内部结构泄露的风险。"
published = "2026-01-01T00:00:00Z"
remediation = "建议立即升级到 Gitea 1.22.4 或更高版本，该版本修复了组织列表和权限端点的认证强制机制；如无法立即升级，可暂时撤销 `public-only` 令牌的 `read:organization` 权限，或通过防火墙限制对 `gitea.com` 特定 API 端点的访问，作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Gitea 代码托管平台 权限绕过漏洞"
updated = "2026-01-01T00:00:00Z"

