[basic]
description = "Apple iTunes before 10.7 使用的 WebKit 组件存在内存破坏漏洞。远程攻击者可通过向用户推送包含特制网页内容的恶意网站，利用该漏洞在目标系统上执行任意代码或导致应用程序崩溃拒绝服务。该漏洞影响未及时安装安全更新的 iTunes 用户，攻击无需身份认证，用户只需访问恶意网页即可触发漏洞。Apple 已在后续安全更新中修复此问题。"
published = "2012-09-13T10:30:19.183"
remediation = "立即将 Apple iTunes 升级至 10.7 或更高版本，iOS 设备升级至 6.0 或更高版本，Mac OS X 系统安装 Security Update 2012-005 或更高版本。如无法立即升级，请避免点击陌生链接或打开不可信网页，临时禁用 iTunes 中的网页浏览器功能以降低被远程攻击的风险。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:34.643"

