[info]
author = "AVE"
description = "WatchGuard SOHO防火墙IP分片拒绝服务漏洞检测 - 通过发送分片HTTP请求检测防火墙响应状态"
id = "POC-AVE-2000-0998"
name = "CVE-2000-0896 PoC"
severity = "medium"
tags = [
    "cve-2000-0896",
    "watchguard",
    "soho",
    "firewall",
    "dos",
    "ip-fragmentation",
]
vuln_id = [
    "CVE-2000-0896",
    "AVE-2000-0998",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    200,
    301,
    302,
    401,
    403,
]
type = "status"
