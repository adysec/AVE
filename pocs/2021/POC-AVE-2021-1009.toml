[info]
author = "ave"
description = "检测 Microsoft Exchange Server 是否存在 CVE-2021-26855 漏洞，通过构造特殊的请求路径验证"
id = "POC-AVE-2021-1009"
name = "Microsoft Exchange Server CVE-2021-26855 PoC"
severity = "critical"
tags = [
    "cve-2021-26855",
    "ave-2021-1009",
]
vuln_id = [
    "CVE-2021-26855",
    "AVE-2021-1009",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/autodiscover/autodiscover.json"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
