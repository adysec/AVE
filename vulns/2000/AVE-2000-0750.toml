[basic]
description = "tcpdump 3.4 及 3.5 版本中的 AFS ACL 数据包解析模块存在多个缓冲区溢出漏洞。远程攻击者可向目标系统发送特制的 AFS ACL 数据包，触发缓冲区溢出，导致任意代码执行。该漏洞影响 tcpdump 3.4 和 3.5 版本，CVSS 评分 10.0，危害等级严重。攻击者无需身份认证即可远程利用，且已有公开的 PoC 利用代码。"
published = "2000-12-11T05:00:00Z"
remediation = "升级 tcpdump 至 3.6.2 或更高版本，该版本已修复 AFS ACL 数据包解析中的缓冲区溢出问题。FreeBSD 用户应安装 FreeBSD-SA-00:61 安全公告提供的补丁；Linux 用户通过包管理器更新至最新可用版本。如无法立即升级，可在防火墙上限制对 tcpdump 监听端口的访问，并避免在不可信网络上使用 tcpdump 捕获数据包。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "LBNL tcpdump 3.4/3.5 AFS ACL 数据包处理缓冲区溢出漏洞"
updated = "2026-06-16T21:52:59Z"

