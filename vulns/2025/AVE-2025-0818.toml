[basic]
description = "Microsoft Outlook 存在远程代码执行漏洞，源于对特制文件对象的不当处理（CWE-908：使用未初始化资源）。本地攻击者需获取低权限账户并诱导目标用户打开恶意构造的 Outlook 文件，利用高复杂度攻击步骤触发未初始化内存访问，从而在目标系统上以当前用户上下文执行任意代码。该漏洞影响 Microsoft Outlook 多个受支持版本，CVSS 评分 6.7，危害等级中危。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:16:01Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新。Outlook 2016 用户应升级至 16.0.5483.1000 及以上版本；Microsoft 365 企业版、Office 2019、Office LTSC 2021/2024 用户请通过 https://aka.ms/OfficeSecurityReleases 获取并安装最新安全更新，或通过 Microsoft Update 自动更新。由于该漏洞需本地访问且利用条件复杂（CWE-908 未初始化资源使用），无法立即打补丁时可限制受影响用户登录权限、启用 Windows Defender 攻击面减少规则（ASR）阻止 Office 创建子进程作为临时缓解措施。"
score = 6.7
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Outlook 远程代码执行漏洞"
updated = "2026-06-17T08:43:11Z"

