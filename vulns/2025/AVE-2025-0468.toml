[basic]
description = "Google Chrome 的 Storage 组件中存在释放后使用（Use After Free）漏洞，远程攻击者可通过诱导用户访问包含特制视频文件的恶意页面触发该漏洞，成功利用可在目标系统上执行任意代码。该漏洞影响 Chrome 141.0.7390.65 之前版本，CVSS 评分 8.8，危害等级高危。攻击需要用户交互，但无需身份认证，攻击复杂度低。Google 已在 Chrome 141.0.7390.65 版本中修复此漏洞。"
published = "2025-11-06T23:15:35Z"
remediation = "建议立即将 Google Chrome 升级至 141.0.7390.65 或更高版本以修复该漏洞。对于企业环境，可通过 Chrome 企业策略强制推送更新或设置浏览器自动更新。如暂时无法升级，应避免打开来自不可信来源的视频文件，并在 Chrome 设置中禁用不必要的网站媒体自动播放权限作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome Storage 释放后使用远程代码执行漏洞"
updated = "2026-06-17T08:30:30Z"

