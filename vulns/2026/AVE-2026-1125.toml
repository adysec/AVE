[basic]
description = "Adobe Acrobat Reader 存在越界读取漏洞（CWE-125），受影响版本包括 24.001.30365、26.001.21651 及更早版本。漏洞源于程序在处理恶意构造的 PDF 文件时，未对内存边界进行充分校验，导致攻击者可通过越界读取敏感内存数据，造成信息泄露。该漏洞影响 Windows 系统上安装 Adobe Acrobat Reader 的用户，攻击者需诱骗用户打开特制恶意 PDF 文件方可利用。成功利用后，攻击者可获取内存中的敏感信息，但不会直接影响系统完整性或可用性。此外，Tenable 报告指出同一范围内还存在基于栈的缓冲区溢出漏洞。Adobe 已在后续版本 24.001.30383 和 26.001.21662 中修复该漏洞，CVSS 评分 5.5，危害等级为中危。"
published = "2026-06-09T21:17:22Z"
remediation = "建议将 Adobe Acrobat Reader DC 升级至 24.001.30383（Classic 版本）或 26.001.21662（连续版本）以修复该越界读取漏洞。可通过 Adobe Acrobat 的「帮助」→「检查更新」功能自动获取补丁，或访问 Adobe 官网手动下载安装。如暂时无法升级，应避免打开来源不明的 PDF 文件，并限制 Acrobat Reader 的访问权限以降低敏感内存泄露风险。"
score = 5.5
severity = "MEDIUM"
sources = ["zdi"]
title = "Adobe Acrobat Reader 越界读取信息泄露漏洞"
updated = "2026-07-23T09:10:00Z"

