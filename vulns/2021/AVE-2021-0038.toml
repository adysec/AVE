[basic]
description = "Accellion FTA（文件传输设备）存在操作系统命令注入漏洞，受影响版本为 9_12_411 及更早版本。该漏洞源于软件在本地 Web 服务调用过程中对用户输入的特殊元素转义处理不恰当，攻击者可通过构造恶意请求参数注入并执行任意操作系统命令。成功利用后，具有本地访问权限和基础用户权限的低权限攻击者即可完全控制设备，导致数据泄露、服务中断或横向移动。该漏洞 CVSS 评分为 7.8，攻击复杂度低，无需用户交互即可利用。Accellion 已在 FTA_9_12_416 及后续版本中修复此漏洞。"
published = "2021-02-16T21:15:13Z"
remediation = "将 Accellion FTA 升级至 FTA_9_12_416 或更高版本，以修复本地 Web 服务调用中存在的 OS 命令注入漏洞。升级前请务必备份配置及数据，升级后验证所有 Web 服务接口正常运行。如暂无法升级，应在防火墙层限制对 FTA 本地 Web 服务端口的访问，仅允许可信管理 IP 连接，降低被利用风险。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Accellion FTA 操作系统命令注入漏洞"
updated = "2026-06-17T03:44:17Z"

