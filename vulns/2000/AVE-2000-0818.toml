[basic]
description = "HP-UX 10.20 资源监控服务中的 registrar 组件存在本地任意文件读取漏洞。漏洞原理是 registrar 服务在记录日志时，会追加日志信息到 registrar.log 并将文件权限设置为全局可读。本地攻击者可通过重命名原 registrar.log 文件，并创建指向目标文件的符号链接，诱导 registrar 将日志追加写入目标文件并将其权限修改为全局可读，从而实现任意文件读取和修改。该漏洞影响 HP-UX 10.20 版本，CVSS 评分 3.6 (AV:L/AC:L/Au:N/C:P/I:P/A:N)，攻击条件为本地访问权限且无需认证，攻击者可利用符号链接竞争条件读取或修改任意系统文件（如 /etc/passwd、/etc/shadow 等敏感文件），导致权限提升或敏感信息泄露。ExploitDB 已公开利用代码 (EDB-20386)。HP 已发布补丁修复此漏洞，建议升级至修复版本或限制 registrar 服务权限。"
published = "2001-01-09T05:00:00.000"
remediation = "建议立即升级 HP-UX 10.20 到 11.00 或更高版本，并安装 HP 发布的 PHNE_20265 补丁补丁包。临时缓解措施：修改 /var/adm/registrar.log 文件权限为 640（chmod 640 /var/adm/registrar.log），限制本地用户对日志文件的写入权限，或暂时停用 resource monitor 服务（/sbin/init.d/rmonitor stop）作为临时缓解措施。"
score = 3.6
severity = "LOW"
sources = ["cve"]
title = "HP HP-UX 10.20 registrar 本地任意文件读取漏洞"
updated = "2026-06-16T21:53:12.403"

