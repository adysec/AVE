[basic]
description = "Microsoft Excel 97 及 2000 版本中的 REGISTER.ID 函数存在代码执行漏洞。攻击者可通过诱使用户打开特制的 Excel 文件，利用该函数加载恶意的 .dll 动态链接库文件，从而在目标系统上执行任意命令。该漏洞需要用户交互（打开恶意文件）才能触发，属于本地攻击向量，成功利用后可导致机密性、完整性和可用性部分受损。受影响版本包括 Excel 97 和 Excel 2000。"
published = "2000-07-26T04:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS00-051 提供的补丁：Excel 2000 用户安装 KB269252 更新，Excel 97 用户安装 KB269263 更新。该补丁会禁用工作表中的 REGISTER.ID 函数，阻止恶意 DLL 被调用。如无法安装补丁，可考虑禁用 Excel 中的 XLM 宏功能作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Excel 97/2000 Register.ID 函数任意代码执行漏洞"
updated = "2026-06-16T21:52:09Z"

