[basic]
description = "Linux内核btrfs文件系统在尝试加入已中止的事务时存在释放后使用（use-after-free）漏洞。当并发任务中止事务时，其他任务在释放fs_info->trans_lock锁后、未持有额外引用计数的情况下读取事务的'aborted'字段，导致可能在读取前事务已被释放。攻击者需具备本地访问权限，通过触发btrfs文件系统的事务操作（如文件创建、写入等）来利用此漏洞，可导致内核崩溃或权限提升。该漏洞影响使用受影响btrfs模块的Linux内核版本，CVSS评分为7.8，危害等级高。"
published = "2025-02-27T03:15:15.950"
remediation = "升级 Linux 内核至以下修复版本或更新版本：5.4.291、5.10.235、5.15.179、6.1.129、6.6.78、6.12.14、6.13.3。Debian 用户执行 apt update && apt install linux-image-6.1.129-1~deb11u1；SUSE 用户运行 zypper patch 安装 SUSE-SU-2025:1177-1 更新；Ubuntu 用户通过 apt install linux-image-generic 更新。升级后重启系统使补丁生效。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 btrfs 文件系统 use-after-free 漏洞"
updated = "2026-06-17T08:44:11.563"

