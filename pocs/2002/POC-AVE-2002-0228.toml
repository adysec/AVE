[info]
author = "ave"
description = '验证 AtheOS 0.3.7 chroot 函数目录遍历漏洞，攻击者可通过 chdir("..") 逃逸 chroot 监狱访问文件系统任意目录'
id = "POC-AVE-2002-0228"
name = "AtheOS 0.3.7 chroot 逃逸漏洞 PoC"
severity = "high"
tags = ["ave-2002-0228"]
vuln_id = [
    "CVE-2002-0244",
    "AVE-2002-0228",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]

[[poc.requests]]
path = "/etc/shadow"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
