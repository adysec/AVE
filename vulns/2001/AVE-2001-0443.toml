[basic]
description = "Basilix Webmail 0.9.7beta 及可能其他版本存在不正确的文件权限漏洞，将 .class 和 .inc 文件存放在 Web 文档根目录下且未限制访问权限，远程攻击者无需身份认证即可直接通过 HTTP 请求访问 mysql.class 等敏感文件，从中窃取 MySQL 数据库的用户名和密码等配置信息，导致敏感数据泄露。该漏洞 CVSS 评分 7.5，危害等级高。"
published = "2001-01-11T05:00:00Z"
remediation = '将 `mysql.class` 等敏感文件移出 Web 根目录（document root），或配置 Web 服务器（如 Apache）通过 `.htaccess` 或虚拟主机规则禁止访问 `*.class` 和 `*.inc` 文件，例如添加 `<FilesMatch "\.(class|inc)$"> Require all denied </FilesMatch>`。同时升级到 Basilix Webmail 最新版本或迁移至其他受支持的邮件客户端。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Basilix Webmail 0.9.7 文件权限配置不当漏洞"
updated = "2026-06-16T21:55:28Z"

