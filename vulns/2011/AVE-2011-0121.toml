[basic]
description = 'Mozilla Firefox 3.6.18之前版本及4.x至4.0.1版本、Thunderbird 3.1.11之前版本的nsCookieService::SetCookieStringInternal函数中存在CRLF注入漏洞。远程攻击者可通过在JavaScript的document.cookie表达式中注入包含换行符（\n）的恶意字符串，绕过预期的访问限制，向Cookie中注入任意内容，进而可能配合其他攻击手段实现会话劫持或信息篡改。该漏洞利用需要用户交互（如访问恶意网站），CVSS评分4.3，危害等级中危。'
published = "2011-06-30T16:55:05Z"
remediation = "升级 Mozilla Firefox 至 3.6.18 或 4.0.2 及以上版本，Thunderbird 升级至 3.1.11 及以上版本。如无法立即升级，可在浏览器中禁用 JavaScript 作为临时缓解措施，降低 CRLF 注入攻击风险。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox和Thunderbird CRLF注入漏洞"
updated = "2026-06-16T23:31:38Z"

