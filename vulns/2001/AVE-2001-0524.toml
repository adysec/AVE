[basic]
description = "Microsoft Internet Explorer 5.0/5.5 及 Outlook Express 5.0/5.5 存在脚本执行绕过漏洞。远程攻击者可通过在 XML 样式表（XSL）中嵌入恶意脚本，并利用 IFRAME 标签引用该样式表，从而在用户已禁用 Active Scripting 安全设置的情况下仍能执行任意脚本代码。该漏洞源于 Windows Scripting Host（WSH）对 XSL 样式表中脚本的处理缺陷，攻击者只需诱导用户访问特制网页即可触发，导致信息泄露、会话劫持或进一步恶意操作。"
published = "2001-04-20T04:00:00Z"
remediation = '立即安装 Microsoft 安全公告 MS02-005 提供的累积补丁（知识库编号 Q316059），该补丁适用于 Internet Explorer 5.01 SP2、5.5 SP1/SP2 及 6.0 Gold。安装后重启系统，并在 IE 的"关于"对话框中确认 Update Versions 字段显示 Q316059。如无法安装补丁，可将所有不受信任的网站加入受限站点区域，并在该区域中禁用"运行 ActiveX 控件和插件"及"活动脚本"；使用 Outlook 2002 或 Outlook Express 6 的用户应将 HTML 邮件设置为以纯文本格式打开以阻断邮件攻击向量。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer/Outlook Express XML 样式表脚本执行漏洞"
updated = "2026-06-16T21:56:02Z"

