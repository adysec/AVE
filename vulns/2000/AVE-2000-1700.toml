[basic]
description = "FreeBSD 4.1.1 及更早版本以及部分 BSD 衍生操作系统在生成 TCP 初始序列号（ISN）时，使用的随机数生成算法强度不足，导致生成的序列号具有可预测性。远程攻击者可以通过分析目标系统的 TCP 序列号生成规律，在无需通过三次握手验证的情况下伪造 TCP 连接。该漏洞允许攻击者实施 TCP 会话劫持或发送伪造的数据包，从而在无需身份验证的情况下影响目标系统的通信安全，导致数据被篡改或非法访问。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 FreeBSD 操作系统至 4.2 或更高版本以使用增强的随机数生成算法。若无法立即升级，建议在防火墙层限制不可信源的 TCP 连接，或部署 IDS 监控并拦截异常的 TCP 序列号欺骗攻击。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "FreeBSD 内核 TCP 初始序列号可预测漏洞"
updated = "2026-06-16T21:52:45.587"

