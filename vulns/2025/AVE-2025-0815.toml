[basic]
description = "Microsoft Excel 存在远程代码执行漏洞，由于程序在处理特制 Office 文件时未能正确验证指针引用（CWE-822），攻击者可通过诱导用户打开恶意构造的 Excel 文档触发该漏洞，导致在目标系统上以当前用户权限执行任意代码。该漏洞影响多个 Microsoft Excel 版本，CVSS 评分 8.4，危害等级高危，可导致敏感数据泄露、数据篡改或系统完全受控。Microsoft 已在 2025 年 1 月安全更新中发布补丁修复此漏洞。"
published = "2025-01-14T18:16:00.947"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新。各通道最低修复版本：Current Channel 2501 Build 18429.20158、Monthly Enterprise Channel 2412 Build 18324.20240、Semi-Annual Enterprise Channel 2408 Build 17928.20440、Office LTSC 2024 2408 Build 17932.20252、Office LTSC 2021 2108 Build 14332.20857、Office 2019 1808 Build 10416.20058。可通过 Windows Update 或访问 https://aka.ms/OfficeSecurityReleases 获取更新。Office Online Server 需升级至 16.0.10416.20047 及以上版本。如无法立即更新，建议禁用从不受信任来源打开 Excel 文件的功能，并在组织中启用受保护视图和文件阻止策略作为临时缓解措施。"
score = 8.4
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Excel 远程代码执行漏洞"
updated = "2026-06-17T08:43:10.767"

