[basic]
description = "Microsoft Index Server 2.0 的 SQLQHit.asp 示例文件存在信息泄露漏洞，远程攻击者无需身份认证即可通过向该文件发送特制的 CiScope 参数（如 webinfo、extended_fileinfo、extended_webinfo 或 fileinfo）直接获取服务器物理路径、文件属性及部分源代码等敏感信息。该漏洞影响 Microsoft Index Server 2.0 版本，攻击复杂度低，仅需构造 HTTP 请求即可利用。"
published = "2001-09-14T04:00:00Z"
remediation = '删除 IIS 网站目录下的 sqlqhit.asp 示例文件（通常位于 C:\Inetpub\wwwroot 或 IIS 脚本映射目录），或通过 IIS 管理器对该文件设置 IP 地址限制和 NTFS 权限拒绝匿名访问。Microsoft Index Server 2.0 已停止支持，建议将服务器升级到受支持的操作系统版本并使用 Windows Search 替代。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Index Server 2.0 文件信息与完整路径泄露漏洞"
updated = "2026-06-16T21:55:21Z"

