[basic]
description = "标签中输出这个描述。<value>Flowise 是一款用于构建自定义大语言模型流程的拖放式用户界面工具。在 3.1.3 及之前版本中，其组织账单相关接口（organization.route.ts 和 organization.controller.ts）存在越权访问控制漏洞。服务器在处理 /update-additional-seats 和 /update-subscription-plan 等端点请求时，未对用户提交的 Stripe subscriptionId 进行归属验证，直接信任客户端提供的订阅标识符并转发至 Stripe 集成层。已认证的远程攻击者可通过读取组织信息或其他暴露途径获取受害组织的 subscriptionId，随后利用该标识符向目标系统发送特制请求，从而在其他租户的 Stripe 订阅上执行未授权操作，包括变更订阅计划、修改付费座位数量等，可能导致财务损失、服务中断及未授权升级等严重后果。"
published = "2026-08-04T20:16:54Z"
remediation = "立即将 Flowise 升级至 3.1.3 或更高版本，该版本已修复组织计费端点未验证 Stripe subscriptionId 归属的访问控制漏洞。升级前请通过 npm 或 Docker 拉取最新镜像并重启服务。如暂时无法升级，可在反向代理层配置规则，拦截对 /api/v1/organization/update-subscription-plan 和 /api/v1/organization/update-additional-seats 端点的未授权 POST 请求，或通过防火墙仅允许可信 IP 访问管理接口。"
score = 8.3
severity = "HIGH"
sources = ["ghsa"]
title = "Flowise 订阅端点越权访问漏洞"
updated = "2026-08-05T16:17:02Z"

