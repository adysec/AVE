[basic]
description = "Google Chrome 的 Tracing 组件存在栈缓冲区溢出漏洞（CWE-121），远程攻击者可通过构造特制的 HTML 页面诱导用户访问，触发栈内存越界写入，导致程序崩溃或任意代码执行。该漏洞影响 Chrome 132.0.6834.83 之前版本，CVSS 评分 8.8，危害等级高危，攻击复杂度低且无需身份认证，但需要用户交互配合。"
published = "2025-01-15T11:15:09Z"
remediation = "立即将 Google Chrome 升级至 132.0.6834.83 或更高版本，该版本已修复 Tracing 组件中的栈缓冲区溢出漏洞。基于 Chromium 的浏览器（如 Microsoft Edge、Brave、Opera）应同步更新至对应修复版本。无法立即升级时，可禁用 JavaScript 或使用 Web 过滤网关阻止不可信 HTML 页面作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome Tracing 栈缓冲区溢出漏洞"
updated = "2026-06-17T08:26:28Z"

