[basic]
description = "ISC BIND 8.1 的 host 命令存在缓冲区溢出漏洞。当远程攻击者向 BIND 域名服务器发起 AXFR（区域传输）查询时，服务器返回的过长响应数据可触发 host 命令中的缓冲区溢出，导致攻击者能够执行任意系统命令。该漏洞影响所有使用 ISC BIND 8.1 版本的 DNS 服务器，攻击者无需身份认证即可远程利用，CVSS 评分为 10.0，危害等级严重。攻击者可通过构造恶意的 DNS 响应数据包，在受影响的服务器上获得完全控制权限。"
published = "2000-12-11T05:00:00Z"
remediation = "建议将 ISC BIND 8.1 升级至 BIND 8.2.2 或更高版本，该版本修复了 host 命令处理 AXFR 查询响应时的缓冲区溢出问题。如条件允许，强烈建议直接迁移至 BIND 9.x 稳定版，因 BIND 8 系列已停止安全更新。作为临时缓解措施，可在 named.conf 中通过 allow-transfer 访问控制列表限制 zone transfer 仅对可信服务器开放，或禁用不必要的 AXFR 查询功能，同时在防火墙层过滤 53 端口的 TCP zone transfer 请求，以降低远程攻击面。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "ISC BIND 8.1 host 命令远程缓冲区溢出漏洞"
updated = "2026-06-16T21:53:00Z"

