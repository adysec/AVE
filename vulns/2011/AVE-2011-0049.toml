[basic]
description = "Adobe Flash Player在处理SWF文件时存在内存破坏漏洞，该漏洞源于程序对用户输入的内存边界检查不严。远程攻击者可通过诱导用户访问恶意网页或打开特制的Flash文件触发内存破坏，导致任意代码执行或拒绝服务。该漏洞影响Windows、Mac OS X、Linux、Solaris及Android平台上的Flash Player 10.3.181.14之前版本（Android为10.3.185.21之前版本），CVSS评分9.3，危害等级严重。Adobe已在安全公告中发布修复更新。"
published = "2011-05-13T22:55:01Z"
remediation = "立即将 Adobe Flash Player 升级至 10.3.181.14 或更高版本（Windows/Mac/Linux/Solaris）或 10.3.185.21 或更高版本（Android）。由于 Flash Player 已终止支持，建议彻底卸载 Flash Player 并迁移至 HTML5 技术栈；如业务必须使用，可在浏览器中启用 click-to-play 插件策略并禁用 Adobe Flash 的自动加载。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏漏洞"
updated = "2026-06-16T23:27:45Z"

