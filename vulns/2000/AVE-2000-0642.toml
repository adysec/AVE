[basic]
description = "Nathan Purciful PHP PhotoAlbum 0.9.9 版本的 explorer.php 存在目录遍历漏洞，远程攻击者可通过构造包含 ../ 序列的恶意请求参数，突破目录限制读取服务器上任意文件内容。该漏洞源于程序未对用户输入的文件路径参数进行有效过滤和规范化处理，攻击者无需身份认证即可远程利用，攻击复杂度低，可导致服务器敏感文件泄露（如配置文件、源代码、系统文件等），CVSS 评分 5.0（中危），影响 PHP PhotoAlbum 0.9.9 版本，攻击者只需构造包含 ../ 序列的恶意请求即可实现任意文件读取。"
published = "2000-11-14T05:00:00.000"
remediation = "建议立即停止使用 nathan purciful phpphotoalbum 0.9.9 并迁移至现代维护的相册系统（如 Piwigo、Lychee 或 PhotoPrism）。若必须继续使用，请在 explorer.php 中添加路径规范化验证：使用 realpath() 解析路径后验证是否在允许目录内，并拒绝包含 ../ 的请求参数；同时在 Web 服务器层面（Apache .htaccess 或 Nginx 配置）添加规则拦截包含 ../ 的请求路径，禁止访问上级目录文件。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Nathan Purciful PhotoAlbum 0.9.9 目录遍历漏洞"
updated = "2026-06-16T21:52:38.740"

