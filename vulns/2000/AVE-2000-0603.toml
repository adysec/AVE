[basic]
description = "Red Hat Linux 6.2/7.0 系统中 tmpwatch 工具的 --fuser 选项存在任意命令执行漏洞。tmpwatch 用于清理临时文件，其 --fuser 选项在处理文件名时未对 shell 元字符（如反引号、$() 等）进行正确过滤或转义。本地攻击者可通过创建包含 shell 元字符的特殊文件名，当系统管理员或定时任务调用 tmpwatch --fuser 扫描目录时，这些文件名中的恶意命令会被 shell 解析执行，从而导致攻击者以运行 tmpwatch 进程的权限执行任意命令。该漏洞影响 Red Hat Linux 6.2 和 7.0 版本，攻击者需要拥有本地文件创建权限，CVSS 评分 2.1，危害等级低。"
published = "2000-10-06T04:00:00Z"
remediation = "升级 tmpwatch 至修复版本（Red Hat 已通过 RHSA-2000-060 发布补丁），该补丁修复了 --fuser 选项将文件名直接传入 system() 调用导致的 shell 元字符注入问题。对于 Red Hat 6.2/7.0 等已停止维护的版本，建议升级至受支持的 Red Hat Enterprise Linux 版本（如 RHEL 7/8/9），或禁用 tmpwatch 的 --fuser 功能作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "RedHat Tmpwatch 任意命令执行漏洞"
updated = "2026-06-16T21:52:32Z"

