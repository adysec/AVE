[basic]
description = "Cisco Identity Services Engine（ISE）及 Cisco ISE Passive Identity Connector（ISE-PIC）存在路径遍历漏洞（CWE-22）。该漏洞源于系统对用户提供的输入验证不充分，具有有效管理凭据的远程认证攻击者可通过向受影响系统发送特制 HTTP 请求，利用路径遍历攻击在底层操作系统上读取或删除任意文件。成功利用该漏洞可导致敏感文件泄露或系统文件被恶意删除，影响系统完整性与机密性。攻击者需具备管理员权限方可利用，CVSS 评分 5.5，危害等级中危。"
published = "2026-07-15T17:16:46Z"
remediation = "升级 Cisco ISE/ISE-PIC 至修复版本：3.3 升级至 3.3 Patch 12，3.4 升级至 3.4 Patch 7，3.5 升级至 3.5 Patch 4（均于 2026 年 9 月发布）。低于 3.3 的版本需迁移至受支持的修复版本。可通过 Cisco TAC 或 Cisco.com 软件下载页面获取补丁。该漏洞无临时缓解措施，必须升级修复。"
score = 5.5
severity = "MEDIUM"
sources = ["zdi"]
title = "Cisco Identity Services Engine 路径遍历漏洞"
updated = "2026-07-16T14:03:27Z"

