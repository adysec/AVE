[basic]
description = "PHPix Photo Album 1.0.2 及更早版本存在目录遍历漏洞。远程攻击者无需身份认证即可通过在 URL 中构造包含 `..`（点点）序列的恶意请求，绕过路径限制访问服务器上的任意文件。该漏洞源于程序未对用户输入的文件路径进行充分过滤和校验，攻击者利用此漏洞可读取系统敏感文件（如配置文件、密码文件等），导致敏感信息泄露。攻击条件简单，仅需目标系统运行受影响版本的 PHPix Photo Album 且 Web 服务可访问即可实施。"
published = "2000-12-19T05:00:00Z"
remediation = "立即停用 PHPix Photo Album，改用仍受维护的相册系统（如 Lychee、Piwigo）。如无法立即替换，在 Web 服务器（Apache/Nginx）层面配置 URL 重写规则，拦截包含 `../` 或 `..%2F` 的请求；同时在 PHP 层面修改 `Album/index.php`，对 `album` 参数做路径规范化检查，拒绝包含 `..` 的输入，并使用 `realpath()` 限定文件访问范围在相册目录内。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "PHPix Photo Album 目录遍历漏洞"
updated = "2026-06-16T21:52:46Z"

