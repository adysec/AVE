[basic]
description = "Pragma Systems TelnetServer 2000 4.0 版本的 rexec 服务存在缓冲区溢出漏洞。远程攻击者无需身份认证，可通过向 rexec 端口发送大量空字符（null characters）触发缓冲区溢出，导致目标服务崩溃，造成拒绝服务。该漏洞影响 TelnetServer 2000 4.0 版本，攻击条件简单，仅需网络可达即可利用，CVSS 评分 5.0，危害等级中等。"
published = "2000-10-20T04:00:00.000"
remediation = "建议立即升级 Pragma TelnetServer 至最新版本（当前最新版已支持 Windows Server 2025/2022/2019/2016/2012R2 及 Windows 11/10/8/7），旧版 4.0 已不再受支持。如无法升级，可在防火墙层面限制对 rexec 端口（默认 2380/TCP）的访问，仅允许可信 IP 连接，以降低被远程利用的风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Pragma Systems TelnetServer 2000 rexec 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:18.880"

