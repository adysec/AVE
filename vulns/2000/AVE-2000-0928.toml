[basic]
description = "OpenSSH SSH 客户端在 2.3.0 版本之前未正确禁用 X11 转发和 ssh-agent 转发功能。攻击者可通过构造恶意 SSH 服务器，在受害者客户端上触发该漏洞，从而获取目标系统的 X11 显示访问权限并嗅探 X11 事件，或获取 ssh-agent 的访问权限以窃取密钥。该漏洞影响 OpenSSH 客户端版本 2.3.0 之前的所有版本，攻击条件为攻击者能够控制或冒充 SSH 服务器，危害等级为高危。"
published = "2001-01-09T05:00:00Z"
remediation = "立即将 OpenSSH 客户端升级至 2.3.0 或更高版本，该版本已修复 X11 和 ssh-agent 转发未正确禁用的问题。如暂无法升级，可在 SSH 客户端配置文件（~/.ssh/config 或 /etc/ssh/ssh_config）中全局添加 `ForwardX11 no` 和 `ForwardAgent no` 以禁用转发，或对特定主机使用 `Host *` 块配置。同时检查并移除 authorized_keys 中不可信主机的免密登录条目，降低被恶意服务器利用的风险。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "OpenSSH SSH客户端X11转发与ssh-agent访问权限漏洞"
updated = "2026-06-16T21:53:18Z"

