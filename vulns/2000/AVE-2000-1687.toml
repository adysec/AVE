[basic]
description = "Microsoft Network Monitor (Netmon) 存在多个缓冲区溢出漏洞。远程攻击者可通过向目标系统发送特制的 CIFS 浏览帧（包含超长浏览器名称）、超长的 SNMP 团体名称，或 SMB 会话中超长的用户名/文件名，触发 Netmon 协议解析模块的缓冲区溢出，导致任意代码执行。该漏洞影响 Windows 2000 及 Windows NT 系统，CVSS 评分 7.5，危害等级高。Microsoft 已在后续安全更新中修复此漏洞。"
published = "2000-12-19T05:00:00Z"
remediation = "安装 Microsoft 2000 年 12 月发布的安全更新 (MS00-097)，该更新修复了 Netmon 协议解析中的缓冲区溢出漏洞。如无法立即安装补丁，可在防火墙层面禁用不必要的 NetBIOS 和 SNMP 端口（137-139、445、161/162），并限制对网络监视器的访问权限。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Microsoft Network Monitor 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:40Z"

