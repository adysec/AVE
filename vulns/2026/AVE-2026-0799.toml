[basic]
description = "Nx 的 `nx graph` 开发服务器在 HTTP 响应中设置了通配符 CORS 头 `Access-Control-Allow-Origin: *`，导致任意恶意网站可跨域读取服务器返回的完整项目依赖图及 `/help` 端点输出。`/help` 端点通过 `execSync` 执行目标配置的命令，在极少数情况下可导致任意命令注入。攻击者需诱使正在运行 `nx graph` 的开发者访问恶意页面，利用条件较高。影响版本为 `17.0.4` 至 `22.7.2` 之前及 `23.0.0-beta.0` 至 `23.0.0-beta.2` 之前，已在 `22.7.2` 和 `23.0.0-beta.2` 中修复。"
published = "2026-06-26T19:16:43Z"
remediation = "立即将 nx 升级到 22.7.2 或更高版本（npm install nx@latest），或升级到 23.0.0-beta.2 及以上版本。21.x 用户应直接升级到 22.7.2+。如无法升级，避免在开发时运行 nx graph 命令，或在使用时确保不同时访问不可信网站。"
score = 5.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "Nx nx graph 开发服务器跨源信息泄露漏洞"
updated = "2026-06-26T20:20:22Z"

