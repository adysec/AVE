[basic]
description = "Appium Java Client 在 8.2.1 至 10.1.1 版本中存在输入验证漏洞。当客户端开启 `directConnect(true)` 模式时，`AppiumCommandExecutor.setDirectConnect()` 方法会无条件接受服务器在 `NEW_SESSION` 响应中返回的 `directConnectHost`、`directConnectPort` 及 `directConnectPath` 字段，且仅验证协议为 https，缺乏对主机名或 IP 的白名单校验。攻击者可通过构建恶意 Appium 服务器，在响应中注入伪造的重定向地址，诱导客户端将后续所有会话流量静默重定向至攻击者控制的端点。该漏洞可导致会话流量被完全拦截，或被利用进行服务器端请求伪造（SSRF）以探测内网主机，甚至窃取云平台实例元数据服务（IMDS）的凭据。"
published = "2026-07-28T16:18:12Z"
remediation = "建议立即将 appium/java-client 升级至 v10.1.1 或更高版本。如果暂时无法升级，请在配置中将 directConnect 设置为 false，以禁用不安全的直接连接重定向功能，防止会话流量被劫持或触发内网请求伪造。"
score = 8.2
severity = "HIGH"
sources = ["ghsa"]
title = "Appium java-client directConnect 未验证重定向导致网络枢轴漏洞"
updated = "2026-07-28T18:17:20Z"

