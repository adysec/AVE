[basic]
description = "Microsoft IIS 的 Phone Book 服务（rasphone.exe）存在缓冲区溢出漏洞。远程攻击者可通过向目标系统发送特制请求触发该漏洞，导致缓冲区溢出，从而在目标系统上以系统权限执行任意代码。该漏洞影响 Windows NT 4.0 及安装了 IIS 的相关系统，CVSS v2 评分为 10.0，危害等级严重。Microsoft 已在安全公告 MS00-094 中发布补丁修复此漏洞。"
published = "2001-01-09T05:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS00-094 提供的补丁：Windows NT 4.0 Server 需先升级至 Service Pack 6a，然后安装补丁（https://www.microsoft.com/download/details.aspx?FamilyId=37B1473A-33E6-446A-BD16-39B85548CCC6）；Windows 2000 Server 需升级至 Service Pack 1 后安装补丁（https://www.microsoft.com/download/details.aspx?FamilyId=C2EFB014-BC57-4CAF-AD28-4E3E735E1934）。如无法立即打补丁，可在 IIS 管理器中卸载 Phone Book Service（该服务默认未安装，仅当通过 NT 4 Option Pack 或 Windows 2000 可选网络组件安装后才存在风险），或通过防火墙限制对 IIS 服务器的 80 端口访问以降低攻击面。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Microsoft Windows NT 4.0 Phone Book 服务缓冲区溢出漏洞"
updated = "2026-06-16T21:53:07Z"

