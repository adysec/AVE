[basic]
description = "Netscape Communicator 4.73 及之前版本存在证书验证欺骗漏洞。如果用户此前已接受某个网站的证书，当该网站的 DNS 信息被攻击者篡改后，攻击者可将流量重定向至恶意服务器，而浏览器不会对无效证书发出警告，从而绕过证书信任机制实现网站身份欺骗。攻击者需具备 DNS 投毒或域名劫持能力，利用受害用户已建立的证书信任关系实施欺骗攻击。该漏洞影响所有运行 Netscape Communicator 4.73 及更早版本的系统和用户。"
published = "2000-05-26T04:00:00Z"
remediation = "建议立即升级至 Netscape 4.74 或更高版本，该版本修复了证书站点绑定校验缺失的问题。在无法升级的旧系统中，可禁用 JavaScript 和 ActiveX 控件以降低攻击面，并严格管控 DNS 解析环境（如使用 DNSSEC）防止 DNS 劫持。鉴于 Netscape 已停止维护，建议迁移至 Firefox、Chrome 等现代浏览器以确保获得持续安全更新。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Netscape Communicator 证书验证欺骗漏洞"
updated = "2026-06-16T21:51:54Z"

