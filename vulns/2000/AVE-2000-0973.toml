[basic]
description = "SunFTP 是由 Rasmus J.P. Allenheim 开发的一款 FTP 服务器软件。该漏洞存在于 SunFTP build 9(1) 版本中，攻击者无需身份验证即可远程连接到服务器，并在连接建立后主动断开连接且未发送换行符（newline），导致服务器无法正确处理异常断连而崩溃或停止响应，从而引发拒绝服务攻击。受影响版本为 SunFTP 1.0 Build 9，攻击者仅需具备网络可达性即可发起攻击，无需任何凭据或权限，利用方式简单便捷，攻击成本极低，可导致合法用户无法正常使用 FTP 服务。"
published = "2000-11-14T05:00:00.000"
remediation = "立即将 SunFTP 从 build 9 升级至 build 10 或更高版本，该版本已修复连接未发送换行符即断开导致的拒绝服务问题。若无法获取升级包，可在 FTP 服务器前端部署 TCP wrappers 或防火墙规则，仅允许可信 IP 地址访问 FTP 服务（默认端口 21），并禁用匿名登录以缩小攻击面。同时考虑将 SunFTP 替换为当前仍受维护的 FTP 服务器软件（如 vsftpd 或 ProFTPD），以获得持续的安全更新支持。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Rasmus J.P. Allenheim SunFTP 1.0 Build 9 连接拒绝服务漏洞"
updated = "2026-06-16T21:52:36.523"

