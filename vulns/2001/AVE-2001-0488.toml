[basic]
description = "TCL/TK 套件中的 expect 工具（版本低于 5.32）存在不安全的库搜索路径漏洞。expect 在搜索动态库时优先查找 /var/tmp 目录而非系统标准库路径，本地攻击者可通过在 /var/tmp 目录中放置恶意的特洛伊木马库文件，当特权用户（如 root）运行 mkpasswd 等 expect 脚本时，程序会优先加载恶意库，从而导致攻击者获取 root 权限。该漏洞影响 expect 5.32 之前的所有版本，CVSS 评分 7.2，危害等级高。"
published = "2001-07-19T04:00:00Z"
remediation = "升级 expect 至 5.32 或更高版本。Debian 用户应安装 DSA-200 提供的更新包，Mandrake 用户安装 MDKSA-2002:060 更新。如无法立即升级，可删除 /var/tmp 目录中不受信任的共享库文件，或限制本地用户对 /var/tmp 的写入权限作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "TCL/TK expect 不安全的库搜索路径本地权限提升漏洞"
updated = "2026-06-16T21:56:08Z"

