[basic]
description = "这是一个Directory Traversal 类型的安全漏洞，存在于 NAI Net Tools PKI Server 1.0 版本的 strong.exe 程序中。该漏洞允许攻击者在访问注册服务器的 HTTPS 请求中嵌入 ../（点dot）序列，从而绕过目录访问限制，读取目标系统上的任意文件，包括敏感配置文件、认证凭证和系统关键文件。漏洞影响Windows操作系统平台，攻击者无需身份验证即可远程触发，攻击媒介为网络请求，攻击复杂度较低。该漏洞的CVSS评分约为5.0，危害等级为中危，可导致部分机密信息泄露和系统完整性受损。攻击者主要通过构造恶意 HTTPS 请求进行利用，请求中包含目录遍历载荷，成功后可以访问服务器文件系统之外的任意文件位置。微软已经发布了安全补丁HotFix 3以修复此漏洞，建议受影响用户尽快安装最新补丁获取保护。"
published = "2000-10-20T04:00:00.000"
remediation = "建议升级 NAI Net Tools PKI Server 至 HotFix 3 或更高版本以修复目录遍历漏洞。若无法升级，建议在防火墙层面限制对注册服务器 HTTPS 端口的访问，仅允许受信任 IP 访问，或禁用不必要的 HTTPS 注册功能作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "NAI Net Tools PKI Server 目录遍历漏洞"
updated = "2026-06-16T21:52:22.920"

