[basic]
description = "CGIscript.net 的 csMailto.cgi 脚本存在远程命令执行漏洞，由于程序未对用户通过 form-attachment 字段提交的输入进行充分过滤，远程攻击者可通过在表单附件字段中注入 shell 元字符（如管道符、分号等）来执行任意系统命令。该漏洞影响使用 csMailto 组件的 Web 应用，攻击者无需身份认证即可利用，可能导致服务器被完全控制、敏感信息泄露或进一步横向移动。CVSS 评分 7.5，危害等级高。"
published = "2002-08-12T04:00:00Z"
remediation = "立即卸载或禁用 csMailto.cgi 脚本，该脚本已不再维护。如必须使用，需在脚本中对 form-attachment 字段做严格的输入过滤，禁止 shell 元字符（如 `;` `|` `` ` `` `$` 等）传入系统命令执行函数。建议迁移至现代邮件发送方案（如 PHP mail() 配合安全库）。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "CGIScript.net csMailto 远程命令执行漏洞"
updated = "2026-06-16T21:58:03Z"

