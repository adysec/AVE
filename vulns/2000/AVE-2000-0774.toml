[basic]
description = "MiniVend 购物车程序的 view_page.html 示例页面存在命令注入漏洞，远程攻击者可通过在 URL 参数中注入 shell 元字符（如分号、管道符等）执行任意系统命令。该漏洞影响 MiniVend 全版本，攻击者无需身份认证即可利用，危害等级高。成功利用后攻击者可完全控制目标服务器，获取敏感数据或植入后门。"
published = "2000-07-10T04:00:00.000"
remediation = "立即删除或限制访问 MiniVend 安装目录中的 `view_page.html` 示例页面文件，该文件未对用户输入做任何过滤直接传递给 shell 执行。升级到 MiniVend 4.0.14 或更高版本（该版本已修复此问题），或迁移至其继任者 Interchange（http://www.icdevgroup.org/）。如无法升级，在 Web 服务器（Apache/Nginx）层面配置访问控制规则，禁止外部访问 `*/view_page.html` 路径，并在应用层对所有用户输入过滤 shell 元字符（`;` `|` `` ` `` `$` `()` 等）。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "MiniVend 购物车程序 view_page.html 远程代码执行漏洞"
updated = "2026-06-16T21:52:09.450"

