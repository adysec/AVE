[basic]
description = "brace-expansion 库的 expand() 函数存在拒绝服务漏洞，由于版本 5.0.8 中针对 CVE-2026-14257 的 maxLength 缓解措施不完整，攻击者可通过构造包含大量逗号分隔替代方案或长填充序列的特制输入，绕过内存限制导致进程内存耗尽崩溃或事件循环长时间阻塞。该漏洞影响 1.1.18、2.1.4、3.0.6 和 5.0.9 之前的所有版本，CVSS 评分 7.5。任何将攻击者控制的输入传递给 expand() 函数的 Node.js 应用程序均可能受到拒绝服务攻击，且内存耗尽导致的进程终止无法通过 try/catch 捕获。攻击者仅需发送约 25 KB 的特制输入即可触发内存耗尽，或发送约 400 KB 输入导致事件循环阻塞超过两分钟。"
published = "2026-08-03T17:16:45Z"
remediation = "升级 brace-expansion 到 1.1.18、2.1.4、3.0.6 或 5.0.9 版本（对应各主版本线的修复版本），并运行 npm update 确认依赖树无残留旧版本。如无法立即升级，应在调用 expand() 时显式设置较小的 max 和 maxLength 参数，且禁止将不受信任的用户输入直接传入 brace 模式展开或 glob 匹配功能，以缓解内存耗尽和事件循环阻塞风险。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "juliangruber brace-expansion 内存耗尽拒绝服务漏洞"
updated = "2026-08-05T14:58:28Z"

