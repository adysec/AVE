[basic]
description = "GAMSoft TelSrv 是一款轻量级 Telnet 服务器软件，其 1.5 及更早版本在处理用户名字段时存在缓冲区溢出漏洞。远程攻击者无需身份认证即可通过向目标服务器的 23 端口发送超长用户名字符串触发该漏洞，导致服务器进程崩溃，造成拒绝服务。该漏洞 CVSS 评分 5.0，影响范围广泛，且已有公开的 Metasploit 利用模块，攻击门槛较低。"
published = "2000-07-17T04:00:00.000"
remediation = "GAMSoft 公司已停止运营，官方不再提供补丁。建议立即卸载 TelSrv 1.5 及更早版本，迁移至维护中的 SSH 服务（如 OpenSSH for Windows）替代 Telnet。如因兼容性必须保留，应在防火墙层面将 TCP 端口 23 的访问来源限制为可信 IP 段，并启用网络入侵检测规则拦截超长用户名请求。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "GAMSoft TelSrv Telnet服务器 拒绝服务漏洞"
updated = "2026-06-16T21:52:13.277"

