[basic]
description = "mod_python 2.7.6及更早版本存在模块访问控制漏洞。该漏洞源于 Apache mod_python 的 publisher 机制设计缺陷：当某个 Python 模块被发布（published）后，该模块间接导入的其他模块也会暴露给 publisher，导致攻击者可绕过访问控制直接调用这些模块中的危险函数。攻击者只需能够访问已配置为发布的 URL 端点，即可远程调用可能具有危害性的函数，无需任何身份认证。该漏洞影响 Apache HTTP Server 使用 mod_python 模块的所有部署环境，CVSS 评分 7.5，危害等级高。建议升级至 mod_python 2.7.8 或更高版本以修复此安全问题。"
published = "2002-05-16T04:00:00Z"
remediation = "立即升级 mod_python 至 2.7.7 或更高版本，该版本已修复发布者模块对间接导入模块的非法访问限制。若无法升级，可通过 Apache 配置将 PythonHandler 指令限制为仅暴露必要的模块路径，避免使用 PythonPublisher handler。鉴于 mod_python 已停止维护，强烈建议迁移至 mod_wsgi（Apache 官方推荐的 Python WSGI 模块）或使用 mod_proxy 配合独立 WSGI 服务器（如 Gunicorn/uWSGI）运行 Python 应用，从根本上消除该攻击面。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Gregory Trubetskoy mod_python 间接导入模块未授权访问漏洞"
updated = "2026-06-16T21:56:57Z"

