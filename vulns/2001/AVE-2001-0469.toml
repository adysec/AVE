[basic]
description = "D-Link DI-704 互联网网关固件 V2.56b6 之前版本存在 IP 分片处理缺陷，远程攻击者无需认证即可通过网络向目标设备发送特制的畸形 IP 数据包分片，触发设备内核处理异常导致设备重启，造成拒绝服务。该漏洞利用难度低，攻击者只需发送少量恶意分片数据包即可生效，影响所有运行受影响固件版本的 DI-704 设备。"
published = "2001-09-06T04:00:00Z"
remediation = "升级 D-Link DI-704 固件至 V2.56b6 或更高版本。如无法升级，可在网络边界防火墙配置规则过滤畸形 IP 分片报文，或禁用受影响设备的公网访问以降低攻击面。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "D-Link DI-704 网关 IP 分片拒绝服务漏洞"
updated = "2026-06-16T21:55:39Z"

