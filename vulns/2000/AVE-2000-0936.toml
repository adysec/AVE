[basic]
description = "Red Hat Linux 的 usermode 软件包中 userhelper 程序存在权限提升漏洞，该程序以 root 权限执行非 setuid 程序而未激活 glibc 的安全检查机制。攻击者可通过设置 LANG 或 LC_ALL 环境变量，利用 glibc 格式化字符串漏洞（CVE-2000-0844）以 root 权限执行任意代码。该漏洞影响 Red Hat Linux 系统，攻击条件为攻击者能够控制环境变量，利用方式为构造包含格式化字符串 specifier 的恶意环境变量触发漏洞。"
published = "2000-09-30T04:00:00Z"
remediation = "立即安装 Red Hat 安全更新 RHSA-2000-075，升级 usermode 包至修复版本（rpm -Uvh usermode-*.rpm）。若无法立即更新，可临时将 LANG 和 LC_ALL 环境变量置空或设为 C，以阻止通过格式字符串漏洞利用 userhelper 的攻击路径。更新后验证 userhelper 不再以 root 权限执行非 setuid 程序。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Red Hat Linux userhelper 格式字符串漏洞"
updated = "2026-06-16T21:53:22Z"

