[basic]
description = "Quagga 0.96.4 之前版本及 Zebra 0.93b 及更早版本的 vty 虚拟终端层在处理 telnet SE（子协商结束）标记时未正确验证子协商状态，远程攻击者可通过向目标设备的 telnet CLI 端口发送特制畸形 telnet 命令触发空指针解引用，导致路由守护进程崩溃退出，造成拒绝服务。该漏洞影响运行上述版本的路由器及网络设备，攻击者无需身份认证，在网络可达且低复杂度攻击条件下即可远程利用，CVSS 评分 5.0，危害等级中等。"
published = "2003-12-15T05:00:00Z"
remediation = "建议将 Quagga 升级至 0.96.4 或更高版本以修复该漏洞。对于仍在使用 Zebra 的用户，由于 Zebra 已停止维护，建议迁移至 Quagga 并升级到最新稳定版本。如暂无法立即升级，可通过防火墙限制对 telnet CLI 端口（默认 2601/tcp）的访问，仅允许受信任的管理员 IP 连接，或禁用 telnet 管理接口改用 SSH 作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Quagga Zebra vty层远程拒绝服务漏洞"
updated = "2026-06-16T22:02:51Z"

