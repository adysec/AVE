[basic]
description = "Gallery 1.3.1 版本及之前的相册管理软件存在远程文件包含漏洞。攻击者通过修改 GALLERY_BASEDIR 环境变量，使其指向包含特洛伊木马 init.php 脚本的目录或远程 URL，即可在目标服务器上执行任意代码。该漏洞影响所有部署了受影响版本 Gallery 的网站，攻击者无需身份认证即可远程利用，攻击条件为目标系统运行 Gallery 1.3.1 以下版本且允许攻击者控制 GALLERY_BASEDIR 参数。"
published = "2003-04-11T04:00:00Z"
remediation = "建议立即将 Gallery 升级到 1.3.1 或更高版本，以彻底修复 GALLERY_BASEDIR 远程文件包含漏洞。Debian woody 用户应升级至 1.2.5-7，unstable 用户应升级至 1.3-3，具体可通过 Debian 安全公告 DSA-138 获取补丁。如无法立即升级，可临时修改配置文件将 GALLERY_BASEDIR 限制为本地绝对路径，并禁止其指向远程 URL 或外部目录。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Gallery 1.x 远程文件包含漏洞"
updated = "2026-06-16T21:59:16Z"

