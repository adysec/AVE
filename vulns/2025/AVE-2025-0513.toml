[basic]
description = "Google Chrome（及基于Chromium的Microsoft Edge等浏览器）的V8 JavaScript引擎中存在不恰当实现漏洞。远程攻击者可通过诱使用户访问特制的HTML页面，触发V8引擎的越界内存访问，导致敏感信息泄露。该漏洞影响Chrome 142.0.7444.59之前版本，攻击需要用户交互（点击链接），CVSS评分4.3，危害等级中危。Google已在Chrome 142.0.7444.59版本中修复此漏洞。"
published = "2025-11-10T20:15:37Z"
remediation = "升级 Google Chrome 至 142.0.7444.59 及以上版本，Microsoft Edge 升级至 142.0.3595.53 及以上版本。Fedora 42 用户执行 sudo dnf update 更新至 142.0.7444.162。启用浏览器自动更新功能，确保及时接收安全补丁。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome V8 不恰当实现越界内存访问漏洞"
updated = "2026-06-17T08:32:22Z"

