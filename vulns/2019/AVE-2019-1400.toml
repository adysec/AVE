[basic]
description = "Google Chrome 73.0.3683.86 之前版本的 JavaScript 引擎中存在越界写入漏洞，具体位于 Array.map 方法实现中。远程攻击者可通过构造特制的 HTML 页面，诱使受害者访问，从而触发堆内存损坏，导致浏览器崩溃或拒绝服务。该漏洞影响 Chrome 72 及 73 版本，CVSS 评分 6.5，危害等级中危。Google 已在 73.0.3683.86 版本中修复此漏洞。"
published = "2019-11-25T20:15:11Z"
remediation = "升级 Google Chrome 至 73.0.3683.86 或更高版本。可通过 Chrome 设置 > 关于 Chrome > 自动检查更新完成升级。如无法立即更新，建议启用 Chrome 安全浏览功能并避免访问不可信网页，同时关注 Chrome 自动更新推送及时安装。该漏洞已有公开 Metasploit 利用模块，应优先处理。"
score = 6.5
severity = "MEDIUM"
sources = ["kev"]
title = "Google Chrome JavaScript 越界写入漏洞"
updated = "2026-06-17T02:38:16Z"

