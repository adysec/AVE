[basic]
description = "联发科（MediaTek）Command Queue 驱动中存在缓冲区越界写入漏洞，由于对用户空间传入的 ioctl 命令参数缺乏充分的输入校验，且缺少 SELinux 安全策略限制，导致攻击者可通过构造特制的 ioctl 调用在内核态触发越界写入。本地攻击者只需具备普通用户权限即可利用该漏洞实现权限提升，获取系统最高控制权，无需用户交互。该漏洞影响 Android 内核中的 Mediatek Command Queue 驱动组件，CVSS 评分 7.8，危害等级高。Google 和联发科已在 2020 年 3 月安全公告中修复此漏洞。"
published = "2020-03-10T20:15:21.947"
remediation = "立即安装 Android 2020 年 3 月安全更新（安全补丁级别 2020-03-01），该更新修复了联发科 Command Queue 驱动中的越界写入漏洞。华为设备用户应升级至对应修复版本，如 Honor 20 Pro 升级至 10.0.0.194(C636E3R3P1) 及以上、Nova 4 升级至 10.0.0.160(C01E32R2P4) 及以上。如无法立即打补丁，建议通过 SELinux 策略限制对 /dev/mtk_cq 设备的非授权访问作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Android Mediatek Command Queue 驱动越界写入漏洞"
updated = "2026-06-17T02:45:11.200"

