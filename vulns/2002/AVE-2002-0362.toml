[basic]
description = "MySQL 3.23.53 及之前版本的 COM_TABLE_DUMP 数据包处理中存在有符号整数漏洞，远程攻击者可通过向 mysqld 服务发送特制请求，传入大负数整数触发 memcpy 调用时的符号整数溢出，导致服务崩溃或挂起，造成拒绝服务。该漏洞影响 MySQL 3.23.x 系列所有低于 3.23.54 的版本，攻击无需身份认证，危害等级中危。"
published = "2002-12-23T05:00:00Z"
remediation = "升级 MySQL 至 3.23.54 或更高版本，该版本修复了 COM_TABLE_DUMP 包中有符号整数溢出导致的拒绝服务漏洞。各发行版用户可参考 Debian DSA-212、RedHat RHSA-2002-288/289 或 Mandrake MDKSA-2002:087 等安全公告安装对应补丁。如无法立即升级，可在网络层通过 iptables 限制仅允许可信 IP 访问 MySQL 3306 端口作为临时缓解。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "MySQL COM_TABLE_DUMP 有符号整数溢出拒绝服务漏洞"
updated = "2026-06-16T21:59:12Z"

