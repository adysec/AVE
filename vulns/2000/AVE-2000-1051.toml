[basic]
description = "Webteachers Webdata 是一款基于 Web 的数据库管理工具，存在任意文件读取漏洞。具有有效账户的远程攻击者可通过向 import 功能发送特制 POST 请求，利用路径遍历漏洞将服务器上的任意文件（如 /etc/passwd）导入数据库并读取，导致敏感信息泄露。攻击条件为拥有有效 Webdata 账户，无需其他特殊权限。"
published = "2000-12-11T05:00:00Z"
remediation = "该软件已停止维护且无官方补丁，建议立即停止使用 Webteachers Webdata，迁移至其他受支持的数据库管理工具。如无法立即替换，应对 import 功能实施严格的路径白名单验证，限制只能导入 Webdata 数据库目录内的文件，并配置 Web 服务器访问控制仅允许可信 IP 访问管理接口。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Webteachers Webdata 任意文件读取漏洞"
updated = "2026-06-16T21:52:58Z"

