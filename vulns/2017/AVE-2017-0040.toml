[basic]
description = "OpenText Documentum Administrator 7.2.0180.0055 存在多个开放重定向漏洞（CWE-601）。远程攻击者可通过以下两种方式将用户重定向至任意恶意网站并实施钓鱼攻击：1) 在 xda/help/en/default.htm 页面的 startat 参数中构造恶意 URL；2) 在 xda/component/virtuallinkconnect 页面的 redirectUrl 参数中插入 /%09/（斜杠编码水平制表符后跟斜杠）后接恶意域名。攻击者无需认证即可利用，但需要诱导用户点击特制链接，CVSS 评分 6.1，危害等级中危。"
published = "2017-09-28T01:29:01Z"
remediation = "升级 OpenText Documentum Administrator 至 7.2.0180.0055 以上版本，Documentum Webtop 升级至 6.8.0160.0073 以上版本（补丁编号 68982774，需登录 OpenText 知识库获取）。如无法立即升级，在反向代理或 WAF 层面拦截 `startat` 和 `redirectUrl` 参数中的外部域名及 `/%09/` 编码序列，并对用户输入的重定向目标进行白名单校验，仅允许跳转到受信内部域名。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "OpenText Documentum Administrator 开放重定向漏洞"
updated = "2026-06-17T01:06:19Z"

