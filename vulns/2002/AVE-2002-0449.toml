[basic]
description = "VMware GSX Server 2.0.0 build-2050 的授权服务（Authorization Service）存在缓冲区溢出漏洞。未经充分身份验证的远程攻击者可向目标系统的认证服务发送包含超长 GLOBAL 参数的特制请求，触发栈缓冲区溢出，进而执行任意系统指令。该漏洞影响运行 VMware GSX Server 2.0 的 Windows 服务器平台，攻击者成功利用后可完全控制宿主机操作系统及其中运行的全部虚拟机实例。由于 VMware 安装时可能创建默认账户，攻击者只需获取默认账户凭据即可完成利用，ExploitDB 已公开相关利用代码。VMware 已在官方安全公告中发布补丁修复该问题。"
published = "2002-08-12T04:00:00Z"
remediation = "建议立即升级 VMware GSX Server 至 2.0.1 或更高版本，或从 VMware 官方安全页面 http://www.vmware.com/download/gsx_security.html 下载并安装对应补丁。若无法立即升级，可在防火墙层面限制对认证服务端口的访问，仅允许受信任管理 IP 连接，并禁用默认/弱口令账户以减少攻击面。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "VMware GSX Server 2.0 认证服务缓冲区溢出漏洞"
updated = "2026-06-16T21:58:11Z"

