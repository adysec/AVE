[basic]
description = "Apple Safari 浏览器在 6.0 版本之前的 WebKit 引擎中对 file:// URL 的处理存在缺陷，未经身份认证的远程攻击者可利用该缺陷绕过沙盒安全限制，读取目标系统上的任意本地文件。该漏洞影响 Safari 5.x 及更早版本运行在 Mac OS X 和 Windows 平台上的浏览器，攻击者需先通过其他手段（如恶意网页或脚本执行）获取 WebProcess 的执行权限，再通过构造恶意的 file:// 协议链接触发本地文件泄露，可能导致敏感配置文件、密码或其他隐私数据被窃取。"
published = "2012-07-25T19:55:06.290"
remediation = '将 Safari 升级至 6.0 或更高版本（随 OS X Lion v10.7.4 或更高版本提供），或通过 Apple 菜单中的"软件更新"安装最新安全更新。该漏洞因 WebKit 处理 file:// URL 不当导致沙盒绕过，Apple 已在 Safari 6.0 中改进文件 URL 处理机制以修复此问题。如暂无法升级，可考虑临时改用其他浏览器访问不可信网站。'
score = 7.1
severity = "HIGH"
sources = ["tenable"]
title = "Apple Safari 沙盒绕过漏洞"
updated = "2026-06-16T23:43:45.450"

