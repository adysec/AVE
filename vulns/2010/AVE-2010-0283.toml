[basic]
description = "PHP Zend 引擎存在释放后重用（Use-after-free）漏洞，当通过引用访问的对象调用 __set、__get、__isset 或 __unset 魔术方法时，引擎未能正确管理对象的内存生命周期，导致已释放的堆内存被再次使用，造成堆内存损坏。攻击者可通过构造特制的 PHP 脚本触发该漏洞，导致目标系统拒绝服务，在特定条件下可能实现任意代码执行。该漏洞影响 PHP 5.2.15 之前版本及 5.3.4 之前版本，CVSS 评分 6.8，危害等级中危。"
published = "2011-01-18T20:00:10Z"
remediation = "立即将 PHP 升级至 5.2.15 及以上版本（5.2.x 分支）或 5.3.4 及以上版本（5.3.x 分支）。如无法立即升级，可在 php.ini 中禁用 __set、__get、__isset、__unset 魔术方法的重载功能，或限制用户传入的引用类型对象参数以降低攻击面。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "PHP Zend Engine 释放后重用堆损坏漏洞"
updated = "2026-06-16T23:25:22Z"

