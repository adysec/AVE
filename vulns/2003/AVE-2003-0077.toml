[basic]
description = "Samba 2.2.x 及更早版本的 trans2.c 文件中的 call_trans2open 函数存在缓冲区溢出漏洞。远程攻击者无需身份认证即可通过向 Samba 服务发送特制的 trans2open 请求，触发栈缓冲区溢出，从而在目标系统上以 Samba 进程权限执行任意代码。该漏洞影响 Samba 2.2.8a 之前的所有 2.2.x 版本、2.0.10 及更早的 2.0.x 版本以及 Samba-TNG 0.3.2 之前版本，CVSS 评分 10.0，危害等级严重。已有公开的利用工具，攻击者可通过暴力枚举方式实现远程利用。"
published = "2003-05-05T04:00:00Z"
remediation = "立即升级 Samba 至 2.2.8a 及以上版本（2.2.x 分支）或 Samba-TNG 0.3.2 及以上版本。如无法立即升级，可在 smb.conf 中设置 `bind interfaces only = yes` 并限制 SMB 服务仅监听内网接口，同时在防火墙层面封禁 TCP 端口 139 和 445 的外部访问作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "Samba call_trans2open 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T22:01:44Z"

