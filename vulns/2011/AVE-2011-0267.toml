[basic]
description = "Apple QuickTime 在处理电影文件中的 URL data handlers 时存在未初始化内存访问漏洞。远程攻击者可通过构造特制的电影文件并诱使目标用户使用 QuickTime 打开，触发该漏洞导致程序访问未初始化的内存区域，从而泄露敏感信息。该漏洞影响 Mac OS X 10.7.2 之前版本中搭载的 QuickTime，攻击者无需身份认证即可在受害者不知情的情况下获取内存中的机密数据，造成信息泄露风险。"
published = "2011-10-14T10:55:08Z"
remediation = "Mac OS X Lion 用户升级到 10.7.2 或安装 Security Update 2011-006；Mac OS X v10.6 用户安装 Security Update 2011-006；Windows 用户升级 QuickTime 到 7.7.1。如无法立即更新，应避免打开来源不明的电影文件。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple QuickTime 电影文件 URL 数据处理未初始化内存信息泄露漏洞"
updated = "2026-06-16T23:32:54Z"

