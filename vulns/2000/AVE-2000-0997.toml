[basic]
description = "SGI IRIX 系统中 Distributed GL Daemon（dgld）服务默认监听在 5232 端口，该服务未对远程访问请求进行有效身份验证或访问控制。未经身份认证的远程攻击者可通过向目标系统的 5232 端口发送探测请求，利用该服务响应特征识别目标主机为 SGI IRIX 系统，导致系统信息泄露。该漏洞影响 SGI IRIX 多个版本，攻击者无需任何认证即可远程触发，CVSS 评分 5.0，危害等级中危。建议禁用不必要的 dgld 服务或通过防火墙限制对 5232 端口的访问。"
published = "2001-02-16T05:00:00Z"
remediation = "建议立即禁用 IRIX 系统上不需要的 dgld 服务：以 root 身份执行 `/etc/init.d/dgld stop` 停止服务，并编辑 `/etc/inetd.conf` 注释掉 dgld 相关行后重启 inetd。如业务需要保留该服务，应在网络边界防火墙封禁 TCP/UDP 5232 端口的入站流量，防止外部攻击者通过扫描该端口识别 IRIX 系统并针对其他已知漏洞（如 ObjectServer VU#16642、df VU#20851）发起后续攻击。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "SGI IRIX Distributed GL Daemon 信息泄露漏洞"
updated = "2026-06-16T21:52:41Z"

