[basic]
description = "Adobe Experience Manager 的 Dispatcher 组件（版本低于 4.1.5）存在 URL 过滤器绕过漏洞。由于 Dispatcher 未正确实现 URL 过滤机制，远程未经身份认证的攻击者可通过构造特制的 HTTP 请求绕过 Dispatcher 的安全规则，直接访问受保护的资源或后端管理接口，进而可能导致认证绕过甚至命令执行。该漏洞影响 AEM 5.6.1、6.0.0 及 6.1.0 版本，CVSS 评分 7.5，危害等级高。攻击无需任何权限，利用复杂度低，建议用户尽快升级 Dispatcher 至 4.1.5 及以上版本修复。"
published = "2016-02-10T20:59:09Z"
remediation = "升级 Adobe Experience Manager Dispatcher 模块至 4.1.5 或更高版本。对应 AEM 版本：5.6.1 升级至 4.1.5+，6.0.0 升级至 4.1.5+，6.1.0 升级至 4.1.5+。该漏洞已在 Adobe 安全公告 APSB16-05 中修复，可通过 Adobe Package Manager 安装最新 Dispatcher 模块。如无法立即升级，可在反向代理层对 /libs/ 和 /content/ 路径实施严格的 URL 白名单过滤规则，阻止未授权的路径遍历请求。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Adobe Experience Manager Dispatcher URL过滤规则绕过漏洞"
updated = "2026-06-17T00:38:32Z"

