[info]
author = "ave"
description = "检测目标系统是否存在Netscape Communicator HTML解析器缓冲区溢出漏洞（CVE-2000-1187）。该漏洞存在于Netscape Communicator 4.75及更早版本中，攻击者可通过表单密码字段超长字符串触发缓冲区溢出，需在受影响浏览器环境下验证。"
id = "POC-AVE-2000-0930"
name = "CVE-2000-1187 PoC"
severity = "high"
tags = ["ave-2000-0930"]
vuln_id = [
    "CVE-2000-1187",
    "AVE-2000-0930",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["root:"]
