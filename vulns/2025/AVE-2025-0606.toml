[basic]
description = "GNU C 标准库（glibc）版本 2.0 至 2.42 中的 wordexp 函数存在未初始化内存访问漏洞。当应用程序同时使用 WRDE_REUSE 和 WRDE_APPEND 标志调用 wordexp 时，内部内存分配机制未能正确初始化返回的 we_wordv 数组，导致该数组包含未初始化的内存值。随后调用 wordfree 释放内存时，可能触发进程异常中止。该漏洞影响广泛部署于 Linux 发行版及类 Unix 系统的核心标准库，CVSS 评分 7.5（高危）。攻击者无需身份认证即可通过网络远程触发，攻击复杂度低，主要造成可用性影响（进程崩溃），具体利用方式取决于应用层对 wordexp 的调用场景（如 Shell 风格单词展开、环境变量解析等文本处理功能）。"
published = "2026-01-20T14:16:07Z"
remediation = "升级 glibc 到 2.43 或更高版本以获取完整修复。立即重新构建并部署所有容器和系统。临时缓解措施是禁用对 wordexp 函数的调用，或使用编译时选项 -D_XOPEN_SOURCE=700 以禁用 WRDE_REUSE 和 WRDE_APPEND 标志。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "GNU glibc wordexp 未初始化内存漏洞"
updated = "2026-06-17T08:37:31Z"

