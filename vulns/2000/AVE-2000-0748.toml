[basic]
description = "libX11 X 库在处理资源掩码时存在拒绝服务漏洞，当资源掩码被设置为 0 时，libX11 会进入无限循环，导致服务不可用。远程攻击者无需身份认证即可通过向目标系统发送特制的 X11 协议请求触发该漏洞，造成拒绝服务。该漏洞影响 Open Group X11r6 3.3.3 至 4.0 版本，CVSS 评分 5.0，危害等级中危。"
published = "2000-06-19T04:00:00Z"
remediation = "升级至 X11R6 4.0.1 及以上版本，该版本修复了资源掩码为 0 时 libX11 进入死循环的缺陷。对于无法升级的旧系统，可在应用层对 X11 连接请求中的资源掩码参数进行校验，拒绝掩码为 0 的请求以缓解拒绝服务风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Open Group X11r6 libX11 资源掩码拒绝服务漏洞"
updated = "2026-06-16T21:52:07Z"

