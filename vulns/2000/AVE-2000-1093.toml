[basic]
description = "Lotus Notes Client R5 中 Java 虚拟机（JVM）的扩展控制列表（ECL）功能存在文件存在性验证漏洞。恶意网站运营商可在用户访问其网页时，触发客户端 JVM 执行 getSystemResource 方法，并通过测量该方法对不同文件路径的响应执行时间差异，推断客户端本地文件系统中特定文件是否存在。该漏洞无需身份认证，攻击者只需诱导用户使用受影响版本的 Lotus Notes Client R5 访问恶意网页即可实施探测，可能导致用户敏感文件被枚举。"
published = "2001-01-09T05:00:00.000"
remediation = "立即将 Lotus Notes Client 从 R5 升级至 R5.0.1a 或更高版本（推荐升级至 Notes 6.5 及以上），以修复 JVM 中 Extended Control List（ECL）功能存在的信息泄露漏洞。如暂时无法升级，可在 Notes 客户端配置文件中禁用 ECL 功能：编辑 notes.ini，添加 ECLEnabled=0 参数以关闭 Java 虚拟机扩展控制列表，阻止恶意网站通过测量 getSystemResource 方法执行延迟来探测客户端文件系统。同时建议在客户端防火墙中出站规则中限制 Notes 对非必要网站的连接，并在浏览器中禁用 Java 小程序自动运行，以缓解远程攻击面。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Lotus Notes Client R5 文件存在信息泄露漏洞"
updated = "2026-06-16T21:53:11.013"

