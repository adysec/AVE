[basic]
description = "Apple iOS 5.1 之前版本及 iTunes 10.6 之前版本中使用的 WebKit 存在内存破坏漏洞。远程攻击者可通过诱导用户访问特制的恶意网站触发该漏洞，导致内存损坏和应用程序崩溃，成功利用可实现在目标系统上执行任意代码。该漏洞属于 WebKit 内存处理缺陷，攻击复杂度较高，需要用户交互配合。"
published = "2012-03-08T22:55:02Z"
remediation = "建议立即将 iOS 设备升级至 iOS 5.1 或更高版本（设置→通用→软件更新），将 iTunes 升级至 10.6 或更高版本，将 Safari 升级至 5.1.4 或更高版本。对于无法升级的旧设备，建议避免访问不可信网站，并启用内容拦截功能作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:55Z"

