[basic]
description = "libpcap 中的 utf_16le_to_utf_8_truncated() 函数存在越界写入漏洞。仅在 Windows 平台上，当 libpcap 将 Windows 错误信息转换为 UTF-8 编码时，若错误信息中包含需用 4 字节 UTF-8 表示的字符，该函数会向缓冲区末尾之外写入数据，导致越界写入。攻击者需具备本地高权限且攻击复杂度较高，成功利用可造成有限的机密性与完整性影响。该漏洞影响使用 libpcap 的 Windows 系统。"
published = "2025-12-31T01:15:54Z"
remediation = "将 libpcap 升级至 1.10.6 或更高版本。Windows 用户应更新 Npcap 至包含该修复的最新版本（Npcap 1.80 及以上），或重新编译依赖 libpcap 的应用程序时链接 libpcap ≥1.10.6。如无法立即升级，可在 Windows 防火墙中限制受影响应用程序的出站流量，并避免在捕获工具中触发含 4 字节 UTF-8 字符的错误消息场景作为临时缓解。"
score = 1.9
severity = "LOW"
sources = ["msrc"]
title = "libpcap utf_16le_to_utf_8_truncated 越界写入漏洞"
updated = "2026-06-17T08:31:29Z"

