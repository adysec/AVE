[basic]
description = "PHP Streams HTTP 包装器在处理来自 HTTP 服务器的响应头时存在输入验证缺陷。当响应头缺少冒号分隔符时，包装器未将其识别为无效头，而是当作合法头传递给应用程序处理，导致应用程序可能接受不符合 HTTP 协议规范的非法头。该漏洞影响 PHP 8.1.32 之前、8.2.28 之前、8.3.19 之前及 8.4.5 之前的所有版本。攻击条件要求攻击者能够控制或劫持 PHP 应用所连接的 HTTP 服务器返回的响应头，例如通过中间人攻击或恶意后端服务返回包含无效头的响应。由于 PHP 应用通常依赖响应头进行业务逻辑判断（如重定向、认证、缓存控制等），攻击者可构造缺少冒号的畸形头绕过某些安全校验或干扰应用正常流程。利用方式无需身份认证，攻击者通过中间人位置或代理后端返回畸形 HTTP 响应头即可触发，造成低级别的数据完整性问题。PHP 官方已在 8.1.32、8.2.28、8.3.19 及 8.4.5 版本中修复此问题，建议受影响用户及时升级至安全版本。"
published = "2025-03-30T06:15:14Z"
remediation = "立即将 PHP 升级至以下修复版本：PHP 8.1 系列升级到 8.1.32，PHP 8.2 系列升级到 8.2.28，PHP 8.3 系列升级到 8.3.19，PHP 8.4 系列升级到 8.4.5。在升级前，可在 Web 服务器（如 Nginx/Apache）层面配置请求头过滤规则，拒绝缺少冒号的无效 HTTP 请求头，以临时降低被利用风险。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "PHP HTTP Streams 包装器输入验证不当漏洞"
updated = "2026-06-17T08:39:41Z"

