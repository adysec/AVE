[basic]
description = "Google Chrome在18.0.1025.142版本之前未能正确处理EUC-JP编码系统，存在跨站脚本（XSS）漏洞（属于CWE-79类型）。远程攻击者可通过未指定的向量利用该漏洞，在受害者的浏览器上下文中执行恶意JavaScript代码。该漏洞影响所有使用受影响版本的Chrome浏览器用户，CVSS评分为4.3，危害等级为中等。攻击无需身份认证即可触发。"
published = "2012-03-30T22:55:01Z"
remediation = "立即将 Google Chrome 升级至 18.0.1025.142 或更高版本，该版本已修复 EUC-JP 编码处理缺陷，可阻止远程攻击者利用跨站脚本（XSS）漏洞执行恶意脚本。若无法立即升级，可在浏览器中禁用 JavaScript 作为临时缓解措施，或在企业环境中通过组策略强制所有客户端升级至受影响版本之后的 Chrome 发布版本。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 跨站脚本漏洞"
updated = "2026-06-16T23:32:32Z"

