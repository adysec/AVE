[basic]
description = "Microsoft Data Access Component (MDAC) 中的 Internet Publishing Provider 组件存在安全绕过漏洞。该组件在 8.103.2519.0 及更早版本中，未正确验证 WebDAV 请求的来源，远程攻击者可通过构造特制的 WebDAV 请求绕过 Internet Explorer 的安全区域限制，从而访问或操作受保护区域的资源。该漏洞影响 Windows 95/98/98SE/ME/NT/2000 等多个版本，攻击者无需身份认证即可在网络中远程发起利用，造成信息泄露或权限提升。攻击者通常通过恶意网页或电子邮件中的 WebDAV 链接诱导用户访问，即可触发安全区域绕过，访问本地文件系统或网络共享中的敏感数据。CVSS 评分 7.5，危害等级为高危。"
published = "2001-07-02T04:00:00Z"
remediation = "安装微软 MS01-022 安全补丁，将系统目录中的 msdaipp.dll 升级至 8.103.2519.0 之后的修正版本；Windows 2000 应升级至 Service Pack 4，Windows XP 已内置该修复。如无法立即安装补丁，可在 Internet Explorer 的 Internet 区域与本地 Intranet 区域中禁用 Active Scripting，并禁用 WebDAV 重定向器作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Windows Data Access Components WebDAV 安全绕过漏洞"
updated = "2026-06-16T21:53:56Z"

