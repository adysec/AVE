[basic]
description = "X.Org X Server 和 Xwayland 的 GLX 模块存在堆释放后使用漏洞（CWE-416）。当 CommonMakeCurrent() 函数处理 GLX commit 时，指针指向的内存可能已被重新分配，导致释放后使用。该漏洞影响 xorg-server 21.2.24 之前版本及 xwayland 24.1.13 之前版本。具有 X 连接权限的本地低权限攻击者可通过提供特制 GLX commit 触发此漏洞，可能导致内存损坏、本地权限提升或拒绝服务，无需额外认证。"
published = "2026-01-01"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "X.Org xorg-x11-server 和 xwayland 堆释放后使用漏洞"
updated = "2026-01-01"

