[basic]
description = "SourceBans 2.0 pre-alpha 版本中存在跨站脚本漏洞，攻击者可通过向 index.php 页面的 advSearch 参数注入恶意 Web 脚本或 HTML 代码触发该漏洞。当管理员或其他用户访问被注入恶意脚本的页面时，脚本将在浏览器中执行，可能导致会话劫持、敏感信息泄露等危害。攻击无需身份认证，但需要用户交互（点击恶意链接），CVSS 评分 6.1，危害等级中危。"
published = "2017-09-11T20:29:00Z"
remediation = "SourceBans 2.0 pre-alpha 及之前版本（含 1.4.11）的 index.php 中 advSearch 参数未对用户输入做任何过滤，导致反射型 XSS。由于该项目已停止维护，官方未发布修复补丁。建议：1）修改 sourcebans/index.php，对 advSearch 参数使用 htmlspecialchars($input, ENT_QUOTES, 'UTF-8') 进行输出编码；2）在 Web 服务器（Nginx/Apache）层面添加 WAF 规则，拦截包含 `<script>`、`onerror=`、`onload=` 等 XSS 载荷的 advSearch 请求参数；3）考虑迁移至 SourceBans++（社区维护分支）等仍在维护的替代方案。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "SourceBans 2.0 pre-alpha 跨站点脚本漏洞"
updated = "2026-06-17T00:34:21Z"

