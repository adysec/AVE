[basic]
description = "Flowise 是一个用于构建大语言模型流程的拖放式用户界面。在 3.1.3 版本之前，该软件存在 CSV Agent 节点提示词注入漏洞。攻击者可通过向使用 CSV Agent 节点的 chatflow 发送特制提示词，诱导 LLM 生成恶意 Python 脚本。该脚本可绕过静态正则表达式黑名单验证器（validatePythonCodeForDataFrame）的检查，并在未启用沙箱隔离的 Pyodide 环境中执行任意代码。攻击者无需身份认证即可远程利用此漏洞，最终以运行服务器进程的账户权限执行任意操作。攻击者还可通过多种技术绕过代码验证，包括字符串拼接重构禁止标识符、chr() 编码、装饰器语法间接调用 exec、MRO 遍历以及 __builtins__ 字典访问等。Flowise 已在 3.1.3 版本中修复此漏洞。"
published = "2026-08-04T20:16:54Z"
remediation = '''
..."""
```

This looks like the remediation field got corrupted with some prompt leakage. I need to fix this.

The user says "只输出 <value>...
'''
