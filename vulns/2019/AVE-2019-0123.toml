[basic]
description = 'JFrog Artifactory 在多个版本中为默认管理员账户配置了如 "password" 等通用弱口令，且未强制用户在首次登录后修改密码。未经身份认证的远程攻击者可直接利用这些默认凭证登录系统管理后台，从而完全控制 Artifactory 实例，进而篡改制品仓库、植入恶意代码或窃取敏感构件数据。该漏洞影响 6.17.0 之前的所有 Artifactory 版本，攻击无需任何凭据且可在网络可达的任意位置发起，危害极为严重。建议用户立即修改默认管理员密码并升级至最新版本。'
published = "2020-10-12T22:15:15Z"
remediation = '立即升级 JFrog Artifactory 至 6.17.0 或更高版本，该版本已强制要求修改默认管理员密码。升级后务必登录管理控制台，将 admin 账户密码从默认的 "password" 修改为强密码（至少 12 位含大小写数字特殊字符）。若暂时无法升级，请在防火墙层面限制 Artifactory 管理端口（默认 8081/8082）仅允许可信 IP 访问，并立即手动修改所有默认账户密码。'
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "JFrog Artifactory 默认口令漏洞"
updated = "2026-06-17T02:23:57Z"

