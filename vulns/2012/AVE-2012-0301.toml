[basic]
description = "Apple WebKit 是 Safari 及 iTunes 等产品所使用的网页渲染引擎，CVE-2012-3625 是其中存在的内存破坏漏洞，源于 WebKit 在处理网页内容时存在内存安全缺陷，可能导致堆溢出或内存地址被错误改写。该漏洞影响 Apple Safari 6.0 之前的版本以及依赖 WebKit 组件的相关产品，攻击者可远程利用此漏洞。攻击条件方面，攻击者仅需诱导用户使用受影响的浏览器访问包含恶意构造网页内容的网站，无需任何身份认证，攻击复杂度中等，但成功利用后可在目标系统上执行任意代码或导致应用程序崩溃。利用方式为攻击者精心设计恶意网页，当用户用存在漏洞的 Safari 浏览器打开该页面时，WebKit 渲染引擎在处理页面内容时触发内存破坏，从而实现远程代码执行或拒绝服务攻击。Apple 已在后续安全更新中修复此漏洞，CVSS 评分为 9.3，危害等级严重。"
published = "2012-07-25T20:55:02.930"
remediation = "立即将 Apple Safari 升级至 6.0 或更高版本，Apple iTunes 升级至 10.6.3 或更高版本，以修复 WebKit 内存破坏漏洞。对于 Linux 发行版，请升级 webkit 包至 1.8.3-0ubuntu0.12.04.1 或更高版本。如暂时无法升级，应避免使用浏览器访问不受信任的网站。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:36.313"

