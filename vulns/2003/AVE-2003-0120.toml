[basic]
description = "Linux 内核 2.4.x 版本中实现的生成树协议（STP, Spanning Tree Protocol）存在设计层面的安全缺陷，未经身份认证的远程攻击者可直接接入目标网络，发送伪造的 STP 协议报文来修改网桥拓扑结构。由于 STP 在默认配置下缺乏必要的身份验证和消息完整性校验机制，攻击者能够通过注入恶意拓扑变更通知（TCN）或模拟根桥宣告，导致网络流量被重定向至攻击者控制的网桥节点，从而实施中间人攻击、网络嗅探或流量拦截。该漏洞影响所有启用 STP 功能的 Linux 2.4.x 网桥设备，攻击者仅需具备目标网络二层可达性即可利用，无需任何凭据。该漏洞的完整性影响为部分，可能导致网络通信被窃听或篡改。"
published = "2003-08-27T04:00:00Z"
remediation = "升级至 Linux 内核 2.4.21 或更高版本，该版本默认禁用 STP 协议并包含回移植的安全补丁。如业务确需启用 STP，应在 bridge 接口配置中添加 net.bridge.bridge-nf-call-iptables=0 及端口安全限制，并通过交换机端口防护（port-security）限制 MAC 地址泛洪，防止攻击者篡改网桥拓扑。临时缓解措施可在 /etc/sysconfig/network-scripts/ifcfg-br* 中设置 TYPE=Bridge 并注释掉 STP 相关配置，重启网络服务后验证桥接拓扑不再被外部 BPDU 报文修改。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux 内核 STP 协议 网桥拓扑修改漏洞"
updated = "2026-06-16T22:02:25Z"

