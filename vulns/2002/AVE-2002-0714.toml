[basic]
description = 'Py-Membres 3.1 的 index.php 存在未授权访问漏洞，由于应用程序在处理登录请求时未对 pymembs 参数进行有效的身份验证和权限校验，导致远程攻击者可通过将 pymembs 参数设置为 "admin" 绕过身份验证机制，直接以管理员身份登录系统。该漏洞影响所有部署了 Py-Membres 3.1 的站点，CVSS 评分为 7.5，危害等级为高。攻击者无需任何凭据，只需向目标站点发送包含恶意参数的 HTTP 请求即可触发漏洞，进而获得管理员权限，对用户数据、会员信息及应用配置造成严重威胁，可导致信息泄露、数据篡改及网站被完全接管。Exploit-DB 已公开该漏洞的利用代码。'
published = "2002-12-31T05:00:00Z"
remediation = "Py-Membres 3.1 已停止维护，官方未发布补丁版本，建议尽快将系统迁移至活跃维护的会员管理方案。若短期内无法替换，可对 index.php 中 pymembs 参数的处理逻辑进行修改，禁止直接通过 URL 参数传递用户身份，改为通过会话（session）验证已登录用户身份后再授予管理员权限。同时建议在 Web 服务器或前端 WAF 层面添加规则，拦截包含 pymembs=admin 的请求，并在防火墙中限制后台管理页面的访问来源 IP。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Py-Membres 3.1 未授权访问漏洞"
updated = "2026-06-16T22:00:14Z"

