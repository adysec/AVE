[basic]
description = "Google Chrome 15.0.874.120 之前版本中的 Theora 解码器存在双重释放（double free）漏洞（CWE-415）。远程攻击者可通过构造特制的媒体流文件，诱使用户在受影响浏览器中打开，触发解码器对已释放内存的二次释放操作，导致浏览器崩溃或可能执行任意代码。该漏洞影响所有低于 15.0.874.120 版本的 Google Chrome 浏览器，CVSS 评分 7.5，危害等级高。用户需升级至最新版本以修复此漏洞。"
published = "2011-11-11T11:55:02Z"
remediation = "升级 Google Chrome 至 15.0.874.120 或更高版本。Chrome 浏览器默认启用自动更新，用户也可通过「关于 Google Chrome」菜单手动检查并安装更新。对于无法升级的旧版环境，建议禁用 Theora 解码支持或更换为其他浏览器作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome Theora解码器两次释放漏洞"
updated = "2026-06-16T23:34:06Z"

