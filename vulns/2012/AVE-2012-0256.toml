[basic]
description = "Google Chrome 20.0.1132.57 之前版本中的 WebKit 组件存在释放后使用漏洞，该漏洞源于布局高度跟踪过程中对已释放内存的引用。远程攻击者可构造特制网页，诱使用户访问，触发释放后使用，导致浏览器崩溃拒绝服务，或可能实现任意代码执行。该漏洞影响 Chrome 及使用 WebKit 的 Apple Safari 等产品，CVSS 评分 7.5，危害等级高。Google 已在 Chrome 20.0.1132.57 版本中修复此漏洞。"
published = "2012-07-12T21:55:06Z"
remediation = "立即将 Google Chrome 升级至 20.0.1132.57 或更高版本（2012 年 7 月稳定版更新已修复此漏洞）。Apple Safari 用户应升级至 6.0.1 或更高版本（参考 HT5485/HT5502）。openSUSE 用户安装 2012 年 8 月安全更新。由于该漏洞可通过 WebKit 影响其他嵌入应用，建议统一更新系统 WebKit 库至修复版本。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome 释放后使用漏洞"
updated = "2026-06-16T23:42:12Z"

