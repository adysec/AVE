[basic]
description = "Google Chrome 134.0.6998.35 之前版本中的权限提示功能存在不当实现漏洞（CWE-1021）。攻击者通过诱使用户安装恶意 Chrome 扩展程序，可利用该扩展对浏览器权限对话框进行 UI 欺骗，使用户在不知情的情况下授予敏感权限。该漏洞攻击复杂度低，无需特殊权限，但需要用户交互配合。影响范围包括 Google Chrome 及基于 Chromium 的 Microsoft Edge 等浏览器。Chrome 团队已在 134.0.6998.35 版本中修复此问题。"
published = "2025-03-05T04:15:12Z"
remediation = "升级 Google Chrome 至 134.0.6998.35 及以上版本，或升级 Microsoft Edge (Chromium 内核) 至 134.0.3124.51 及以上版本。可通过浏览器内置「关于」页面检查更新并自动安装。如无法立即升级，可在 Chrome 扩展管理页面审查并禁用非必要扩展，同时启用「增强安全保护」模式以降低恶意扩展利用权限提示界面欺骗的风险。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome 权限提示不当实现漏洞"
updated = "2026-06-17T08:40:21Z"

