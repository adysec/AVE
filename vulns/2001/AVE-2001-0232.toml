[basic]
description = "Apache HTTP Server 附带的 htpasswd 和 htdigest 工具存在符号链接攻击漏洞（CWE-59），本地未授权攻击者可通过创建指向敏感系统文件的符号链接，诱使 htpasswd 或 htdigest 在写入密码文件时跟随该链接，从而覆盖目标系统上的任意文件，造成文件完整性破坏。该漏洞影响 Apache 2.0a9、1.3.14 等多个版本，波及 Debian Linux 2.2、Red Hat Linux 7.0 等操作系统。攻击者需要具备目标主机的本地访问权限，攻击复杂度为中等。成功利用后可篡改关键系统文件，进而可能获得提升的权限或导致服务中断。Debian 已在安全公告 DSA-021 中发布对应修复补丁。"
published = "2001-03-12T05:00:00.000"
remediation = "立即升级 Apache HTTP Server 至 1.3.42（1.3.x 系列最终版）或 2.4.x 最新稳定版；若短期内无法升级，请将受影响版本的 htpasswd 与 htdigest 程序所在目录（通常为 /usr/bin/ 或安装目录）的权限设置为仅 root 可写（chmod 755），并移除目录的组写与其他写权限，防止本地用户创建符号链接覆盖敏感文件。同时检查 /etc/passwd、/etc/shadow 及 Web 根目录下是否存在被恶意创建或修改的文件，必要时从已知良好备份恢复。"
score = 3.3
severity = "LOW"
sources = ["cve"]
title = "Apache HTTP Server 本地用户任意文件覆盖漏洞"
updated = "2026-06-16T21:53:43.830"

