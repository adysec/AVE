[basic]
description = "Apple WebKit 存在内存处理漏洞（CWE-119/CWE-120），由于对恶意构造的网页内容内存处理不当，导致缓冲区边界检查不充分。远程攻击者可诱导用户访问特制网页触发该漏洞，造成目标进程意外崩溃或内存破坏。该漏洞影响 Safari 26.5 之前版本、iOS 18.7.9/iPadOS 18.7.9 之前版本、macOS Tahoe 26.5 之前版本、tvOS 26.5、visionOS 26.5 及 watchOS 26.5 之前版本，CVSS 评分 8.8，危害等级高。攻击者需要用户交互（如点击恶意链接），无需身份认证，攻击复杂度低。Apple 已在 2026 年 5 月安全更新中修复此漏洞。"
published = "2026-05-11T21:18:56Z"
remediation = "立即将 Safari 升级至 26.5 版本，iOS/iPadOS 升级至 18.7.9 或 26.5，macOS Tahoe 升级至 26.5，tvOS/visionOS/watchOS 升级至 26.5。Linux 系统用户将 webkit2gtk3 升级至 2.52.4 或更高版本。如无法立即升级，可配置 Web 内容过滤器或禁用 WebKit 渲染引擎作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "Apple WebKit 内存处理漏洞"
updated = "2026-07-15T02:19:20Z"

