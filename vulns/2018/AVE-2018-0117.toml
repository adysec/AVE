[basic]
description = "Eventum 是一款开源问题跟踪系统，其 3.4.0 之前版本存在开放重定向漏洞（CWE-601）。攻击者可构造恶意 URL 链接，诱使用户点击后将其重定向至任意外部站点，导致用户被钓鱼攻击或敏感信息泄露。该漏洞无需身份认证即可利用，但需要用户交互配合，CVSS 评分 6.1，危害等级中危。建议升级至 Eventum 3.4.0 或更高版本修复此漏洞。"
published = "2018-09-09T21:29:00Z"
remediation = "升级 Eventum 至 v3.4.0 或更高版本，该版本已修复开放重定向漏洞。如无法立即升级，可在 Web 服务器（Nginx/Apache）层面配置 URL 白名单规则，限制外部重定向目标域名，或禁用 `redirect.php` 等存在重定向功能的页面。同时建议对用户输入的重定向参数进行严格校验，仅允许跳转到可信域名。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Eventum Eventum 开放重定向漏洞"
updated = "2026-06-17T01:44:46Z"

