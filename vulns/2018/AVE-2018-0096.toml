[basic]
description = "Jorani 0.6.5 考勤管理系统存在持久型跨站点脚本（XSS）漏洞，远程攻击者可通过向 `session/language` 接口的 `language` 参数注入恶意的 Web 脚本或 HTML 代码，当管理员或其他用户访问受影响页面时脚本自动执行，导致敏感信息泄露、会话劫持或页面内容篡改。攻击者需拥有低权限用户身份登录系统，利用难度较低。该漏洞影响 Jorani 0.6.5 版本，CVSS 评分 5.4，危害等级中危。建议升级至最新版本修复。"
published = "2018-09-05T21:29:02Z"
remediation = "升级 Jorani 至最新版本 v1.0.4（从 https://github.com/jorani/jorani/releases/tag/v1.0.4 下载），该版本已修复多项安全漏洞并支持 PHP 8.5。如无法立即升级，在 application/config/config.php 中对 language 参数做 HTML 实体编码过滤，或部署 WAF 规则拦截包含 `<script>` 标签的 language 参数请求。"
score = 5.4
severity = "MEDIUM"
sources = ["nuclei"]
title = "Jorani 0.6.5 持久型跨站脚本漏洞"
updated = "2026-06-17T01:43:19Z"

