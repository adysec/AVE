[basic]
description = "施耐德电气 U.Motion Builder 1.3.4 版本中存在 SQL 注入漏洞（CWE-89），攻击者无需认证即可通过向 `track_import_export.php` 的 `object_id` 参数传入特制字符触发该漏洞，导致未授权命令执行。该漏洞可被远程利用，攻击复杂度低，无需用户交互，成功利用后可完全控制目标系统，造成机密性、完整性和可用性全部丧失。CVSS 评分 9.8，危害等级严重。目前已有公开的 ExploitDB 利用代码和 Nuclei 检测模板。"
published = "2019-05-22T20:29:01.480"
remediation = "该产品（U.motion Builder 1.3.4）已停产（end-of-life），施耐德电气未发布安全补丁。CISA 在已知被利用漏洞目录（KEV）中明确要求立即断开该产品的网络连接并停止使用。如因业务需要暂时无法下线，应在网络边界防火墙设置规则，仅允许受信 IP 访问 U.motion Builder 的管理端口（默认 80/443），并在反向代理层对 `track_import_export.php` 等接口的 `object_id` 参数实施严格的输入过滤和参数化查询，同时持续监控异常 SQL 语句和命令执行行为。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Schneider Electric U.Motion Builder 操作系统命令注入漏洞"
updated = "2026-06-17T02:03:50.500"

