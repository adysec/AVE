[basic]
description = "Tarantella Enterprise 的 ttawebtop.cgi 脚本存在信息泄露漏洞，远程攻击者可通过向该 CGI 脚本发送包含空 pg 参数的特制 HTTP 请求，诱使服务器返回受保护目录的内容列表。该漏洞影响 Tarantella Enterprise 3.20（SPARC Solaris 及 Linux 平台）以及 3.1x、3.0x 系列版本（含 3.11.903），攻击者无需身份认证即可利用，CVSS 评分 5.0，危害等级为中等。"
published = "2002-05-16T04:00:00Z"
remediation = "立即安装 Tarantella Security Bulletin-03 发布的官方补丁，修复 ttawebtop.cgi 中空 pg 参数导致的目录遍历漏洞。受影响版本包括 Tarantella Enterprise 3.0x、3.1x（含 3.11.903）及 3.20。如无法立即打补丁，可在 Apache 或前端反向代理中添加规则，拒绝包含空 pg 参数对 /cgi-bin/ttawebtop.cgi 的请求，或在防火墙层面限制该 CGI 脚本的远程访问作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Tarantella Enterprise 目录索引信息泄露漏洞"
updated = "2026-06-16T21:56:59Z"

