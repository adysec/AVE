[basic]
description = "Gaim 客户端 0.58 之前版本中的 Jabber 插件存在缓冲区溢出漏洞，远程攻击者可通过向目标用户发送特制的 Jabber 消息触发该漏洞，导致任意代码执行。攻击者无需身份认证即可利用此漏洞，成功利用后可完全控制受影响的 Gaim 客户端系统，危害严重。用户需升级至 Gaim 0.58 或更高版本以修复此漏洞。"
published = "2002-10-04T04:00:00Z"
remediation = "升级Gaim客户端至0.58或更高版本。Red Hat已发布RHSA-2002:098、RHSA-2002:107、RHSA-2002:122等安全公告提供修复补丁，建议用户及时更新。Mandrake用户可参考MDKSA-2002:054获取对应补丁。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Gaim Jabber 插件缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:57:19Z"

