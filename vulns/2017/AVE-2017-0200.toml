[basic]
description = "Oracle WebLogic Server 的 WLS Security 子组件中存在 XMLDecoder 反序列化漏洞，攻击者可通过 T3 协议向 wls-wsat 组件发送精心构造的恶意 XML 数据，触发服务器对 XML 数据的反序列化处理，从而在未经身份认证的情况下实现远程代码执行。该漏洞影响 WebLogic Server 10.3.6.0.0、12.1.3.0.0、12.2.1.1.0 及 12.2.1.2.0 版本，攻击无需任何权限，仅需网络可达即可利用。由于该漏洞利用难度低、影响范围广，已被广泛用于挖矿木马植入、勒索软件部署等攻击活动，属于高危漏洞。"
published = "2017-10-19T17:29:01.747"
remediation = "立即安装 Oracle 2017 年 10 月关键补丁更新（CPU Oct 2017），将 WebLogic Server 升级至 10.3.6.0.0、12.1.3.0.0、12.2.1.1.0 或 12.2.1.2.0 的对应补丁版本。如无法立即打补丁，可删除 wls-wsat 组件或通过访问控制策略禁止非信任 IP 访问 T3 协议端口（默认 7001），并删除 wls-wsat.war 应用程序以阻断攻击路径。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Oracle WebLogic Server XMLDecoder反序列化远程代码执行漏洞"
updated = "2026-06-17T01:00:00.610"

