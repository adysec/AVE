[basic]
description = "AudioCodes 400HD/420HD IP 电话在固件版本 2.2.12.126 中存在命令注入漏洞。攻击者可通过向设备发送包含恶意命令的构造网络请求，绕过身份认证机制在目标系统上执行任意操作系统命令，从而实现远程代码执行。该漏洞影响使用受影响固件版本的 AudioCodes 400HD 系列 IP 电话设备，CVSS 评分 8.8，危害等级为高。攻击者无需用户交互即可通过网络远程利用此漏洞，成功利用后可完全控制设备，导致敏感信息泄露或进一步对内网发起渗透攻击。"
published = "2019-03-21T16:00:06Z"
remediation = "联系 AudioCodes 官方技术支持获取修复此漏洞的固件更新版本并升级固件至最新版本。如暂无法获取补丁，请立即将设备管理 Web 界面的管理员默认密码修改为高强度密码，防止攻击者利用 command.cgi 页面进行未授权命令注入。同时建议在防火墙或网络层面限制对 420HD 设备 Web 管理端口的访问，仅允许可信 IP 地址连接；若业务不需要 Web 管理功能，应直接禁用 Web 界面以彻底消除攻击面。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "AudioCodes 400HD 命令注入漏洞"
updated = "2026-06-17T01:33:29Z"

