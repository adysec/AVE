[basic]
description = "Faq-O-Matic 2.712 版本的 fom.cgi 脚本存在跨站脚本（XSS）漏洞。未经身份验证的远程攻击者可通过向 fom.cgi 的 cmd 参数提交特制的 JavaScript 代码，当目标系统向用户返回包含该参数的出错信息页面时，恶意脚本将在其他访问者的浏览器中执行。该漏洞影响运行 Faq-O-Matic 2.712 的 Web 服务器，攻击者无需认证且攻击复杂度低，可导致其他客户端会话劫持、敏感信息窃取或网页内容篡改等危害。"
published = "2002-05-16T04:00:00Z"
remediation = """立即升级到 Faq-O-Matic 2.721 或更高版本，该版本已修复 fom.cgi 对 cmd 参数未过滤导致的跨站脚本漏洞。如暂时无法升级，可手动修改 fom.cgi 源码，在输出 cmd 参数内容前使用 HTML 实体编码（将 <、>、"、' 分别转换为 &lt;、&gt;、&quot;、&#x27;），或在 Apache 配置中使用 mod_security 过滤包含 <script> 的请求。同时建议在 Web 服务器层面为 fom.cgi 设置 Content-Security-Policy: script-src 'self' 响应头，并在客户端临时禁用不必要站点的 JavaScript 执行。"""
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Faq-O-Matic fom.cgi 跨站脚本攻击漏洞"
updated = "2026-06-16T21:57:02Z"

