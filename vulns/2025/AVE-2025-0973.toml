[basic]
description = "Linux 内核网络子系统的邻居发现（NDISC）功能中存在释放后使用漏洞。ndisc_alloc_skb() 函数在分配网络数据包缓冲区时，未正确获取 RCU（Read-Copy-Update）读锁保护，攻击者可在未持有 RTNL 或 RCU 锁的情况下调用该函数，导致内核内存被重复释放或访问已释放的内存区域。该漏洞影响包含受缺陷代码的 Linux 内核版本，具有本地登录权限的低权限恶意用户可利用此漏洞触发内核空间释放后使用，进而实现本地特权提升，获取系统 root 权限并完全控制受影响主机。攻击者需要具备目标系统的本地访问权限才能成功利用此漏洞。"
published = "2025-02-27T03:15:17.063"
remediation = "升级 Linux 内核至已修复版本：5.4.291、5.10.235、5.15.179、6.1.129、6.6.79、6.12.16 或 6.13.4 及以上版本，具体修复提交为 https://git.kernel.org/stable/c/96fc896d0e5b37c12808df797397fb16f3080879。若运行受影响的稳定分支内核（如 5.4.x、5.10.x、5.15.x、6.1.x、6.6.x、6.12.x、6.13.x），请及时应用各发行版安全更新（如 Ubuntu USN、Debian DLA、RHEL RHSA 等）。如暂无法升级内核，可通过 sysctl 限制本地低权限用户对 IPv6 邻居发现子系统的访问权限作为临时缓解措施。受影响版本范围：3.9 至 6.13.3 的 Linux 内核。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 ndisc_alloc_skb 函数释放后使用漏洞"
updated = "2026-07-14T13:17:22.967"

