[basic]
description = "WordPress 的 rating-bws 插件（版本 0.2 之前）存在多个跨站脚本（XSS）漏洞。该漏洞源于插件未对用户输入进行充分的过滤与转义处理，攻击者可通过向受影响页面提交特制的恶意脚本载荷，当管理员或其他用户访问该页面时，脚本将在浏览器中自动执行，导致敏感信息泄露、会话劫持或页面内容篡改。攻击条件为需要用户交互（点击链接或访问特定页面），无需身份认证，攻击复杂度低。CVSS 评分 6.1，危害等级中危。"
published = "2019-08-20T16:15:12Z"
remediation = "升级 WordPress rating-bws 插件至 0.2 或更高版本。在 WordPress 后台插件管理页面检查更新并安装最新版本。如无法立即更新，可暂时禁用该插件，或通过 Web 应用防火墙（WAF）规则拦截包含恶意脚本的请求作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress rating-bws插件跨站脚本漏洞"
updated = "2026-06-17T01:13:02Z"

