[basic]
description = "PostgreSQL 数据库在处理特定输入数据时存在缓冲区溢出漏洞。攻击者可以通过向目标数据库发送特制的恶意请求，触发内存越界写入，从而导致服务异常崩溃（拒绝服务）或在特定环境下执行任意代码。该漏洞主要影响较早版本的 PostgreSQL，攻击者无需高权限即可通过网络连接触发。利用此漏洞可导致数据库服务中断或系统权限被接管，建议用户升级至修复后的版本。"
published = "2002-09-24T00:00:00Z"
remediation = "建议立即将 PostgreSQL 数据库升级到 7.2.3 或更高版本。如果无法立即升级，应通过配置防火墙限制数据库端口（默认 5432）的访问权限，仅允许受信 IP 访问，以降低远程攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "PostgreSQL 缓冲区溢出拒绝服务及代码执行漏洞"
updated = "2002-09-24T00:00:00Z"

