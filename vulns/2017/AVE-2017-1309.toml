[basic]
description = """PHPUnit 框架核心组件 eval-stdin.php 存在远程代码执行漏洞（CVE-2017-9841），该文件包含 eval('?>'.file_get_contents('php://input')) 代码，攻击者可通过向暴露在 Web 目录下的 /vendor/phpunit/phpunit/src/Util/PHP/eval-stdin.php 路径发送以 "<?php " 开头的 HTTP POST 数据，直接执行任意 PHP 代码。受影响版本为 PHPUnit 4.8.19-4.8.27 及 5.0.10-5.6.2，攻击条件为：远程无需认证、目标服务器 vendor 目录对外可访问。漏洞利用门槛极低，攻击者可直接获取服务器 Shell 权限，CVSS 9.8 严重级别。受影响产品包括使用 Composer 安装 PHPUnit 且未正确配置 Web 服务器屏蔽 vendor 目录的 PHP 项目（如 Laravel、PrestaShop 等框架及其扩展模块）。修复建议：立即升级至 PHPUnit 4.8.28 或 5.6.3 及以上版本，或通过 Web 服务器配置禁止访问 /vendor 目录，并执行 composer update --no-dev 移除开发依赖。"""
published = "2017-06-27T17:29:00Z"
remediation = "立即升级 PHPUnit 至 4.8.28 或 5.6.3 及以上版本（composer update phpunit/phpunit）。若无法立即升级，请立即删除或重命名 vendor/phpunit/phpunit/src/Util/PHP/eval-stdin.php 文件，或在 Web 服务器配置中禁止访问 /vendor 目录（如 Nginx: location ~ /vendor/ { deny all; }）。同时建议执行 composer update --no-dev 移除开发依赖，并限制 Web 根目录不暴露 vendor 目录。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "PHPUnit PHPUnit 远程代码执行漏洞"
updated = "2026-06-17T01:29:01Z"

