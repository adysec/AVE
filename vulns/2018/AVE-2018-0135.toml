[basic]
description = "Microstrategy Web 7 版本存在跨站脚本（XSS）漏洞，由于 Login.asp 页面的 Msg 参数未对用户输入进行充分编码过滤，导致攻击者可在登录页面注入恶意脚本代码。当管理员或其他用户访问该页面时，注入的脚本会在浏览器中执行，造成敏感信息窃取或会话劫持。攻击者无需身份认证，但需诱使用户点击特制链接。该漏洞影响已停止维护的 Microstrategy Web 7 产品，CVSS 评分 6.1，危害等级中危。"
published = "2018-11-01T17:29:00Z"
remediation = """该产品（Microstrategy Web 7）已停止维护，官方不再发布安全补丁。建议立即升级到 Microstrategy 仍在支持的最新版本（如 Microstrategy 2021 及以上）；如无法升级，应迁移至受支持的替代产品。临时缓解措施：在 Login.asp 的 Msg 参数输出位置实施严格的 HTML 实体编码（将 < > " ' & 转义为 &lt; &gt; &quot; &#x27; &amp;），并部署 WAF 规则拦截包含 <script> 等恶意标签的请求。"""
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Microstrategy Web 7 Login.asp 参数跨站脚本漏洞"
updated = "2026-06-17T01:47:52Z"

