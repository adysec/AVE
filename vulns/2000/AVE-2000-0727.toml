[basic]
title = "OpenSSH 1.2 scp 目录遍历漏洞"
description = "OpenSSH 1.2.x 系列中 scp 客户端存在目录遍历漏洞。当客户端从恶意的 scp 服务器下载文件时，服务器可返回包含 ..（点点）的构造文件名，导致客户端将文件写入任意目录，覆盖任意文件。攻击者只需搭建恶意 SCP 服务器并诱骗受害者使用 scp 下载文件即可触发，无需认证。"
severity = "MEDIUM"
score = 5.0
sources = ["cve", "exploitdb"]
published = "2000-12-19"
updated = "2000-12-19"
remediation = "升级至 OpenSSH 2.1 或更高版本，该版本已修复 scp 对服务器返回文件名的路径校验问题。临时缓解措施：仅从可信来源使用 scp 下载文件，或改用 sftp 替代 scp。"

