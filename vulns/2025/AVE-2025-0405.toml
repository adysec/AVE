[basic]
description = "GRUB2 的 UFS 文件系统模块在处理符号链接查找时存在整数溢出漏洞。当解析符号链接时，该模块根据 inode 数据大小分配内部缓冲区，但未检查符号链接数据大小是否发生整数溢出，导致 grub_malloc() 分配的内存小于实际所需。后续从磁盘读取数据到缓冲区时，grub_ufs_lookup_symlink() 函数会越界写入堆内存，破坏堆中存储的数据。本地攻击者可通过挂载特制的恶意文件系统触发此漏洞，实现任意代码执行，从而绕过安全启动（Secure Boot）机制。该漏洞影响所有使用受影响版本 GRUB2 的系统，CVSS 评分 6.4，危害等级中危。"
published = "2025-02-19T19:15:15Z"
remediation = "升级 grub2 至修复版本：RHEL 9 升级至 grub2-2.06-104.el9_6 及以上，RHEL 10 升级至 grub2-2.12-15.el10_0 及以上，其他发行版升级至包含 commit c4bc55da 的版本。运行 `grub2-mkconfig -o /boot/grub2/grub.cfg` 重建引导配置并重启系统。如无法立即升级，启用 Secure Boot 的 lockdown 模式可阻止加载存在漏洞的文件系统模块作为临时缓解。"
score = 6.4
severity = "MEDIUM"
sources = ["msrc"]
title = "GNU GRUB2 UFS 符号链接处理整数溢出致堆越界写入漏洞"
updated = "2026-06-30T00:16:50Z"

