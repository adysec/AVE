[basic]
description = "Linux 内核 TCP 协议栈中存在安全路径（secpath）引用泄漏漏洞。当系统使用 IPcomp6 进行 TCP 通信时，若创建一对网络命名空间并运行基本 TCP 测试后删除该命名空间对，secpath 结构体会因未被及时释放而 lingering 在 skb 上，导致 xfrm_state 引用计数无法清零，从而在删除 netns 时触发内核 WARN 或 NULL 指针引用，造成本地拒绝服务。该漏洞影响配置 IPsec/IPcomp 的 Linux 内核系统，CVSS 评分 7.8（高危）。攻击者需具备本地访问权限并创建/删除网络命名空间才能触发，利用过程中向目标发送特制的 IPv6 数据包可延迟释放 secpath，最终导致内核崩溃或拒绝服务。Linux 内核已在后续补丁中修复此问题，建议升级至最新稳定版本。"
published = "2025-03-12T10:15:19Z"
remediation = "立即升级 Linux 内核至修复版本：5.19 系列用户升级至 6.1.130，6.2-6.5 系列升级至 6.6.80，6.7-6.12 系列升级至 6.12.17，6.13 系列升级至 6.13.5，6.14 用户升级至稳定正式版。Debian 用户执行 apt upgrade linux-image 安装 DSA-5900 安全更新，RHEL/CentOS 用户安装 RHSA-2025:20518 内核补丁，SUSE 用户安装 SUSE-SU-2025:1177-1 或 SUSE-SU-2025:01951-1 内核更新。如无法立即升级，应通过 sysctl 或 systemd 限制非特权用户创建和删除网络命名空间，减少本地攻击面，并持续监控内核日志中 xfrm6_tunnel_net_exit 的 WARN 信息。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux kernel TCP 协议栈 secpath 引用计数错误漏洞"
updated = "2026-07-30T06:21:41Z"

