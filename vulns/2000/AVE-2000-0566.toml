[basic]
description = "eEye Digital Security IRIS 1.01 beta 版本存在 UDP 连接拒绝服务漏洞，攻击者可通过发送大量 UDP 连接请求耗尽系统资源，导致服务拒绝。该漏洞影响 IRIS 1.01 beta 版本，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），属于网络可利用、低攻击复杂度、无需认证的可用性影响漏洞。远程未授权攻击者可通过发送大量 UDP 连接请求耗尽目标系统资源，导致拒绝服务。ExploitDB 记录显示 IRIS 1.0.1 及 SpyNet CaptureNet 3.0.12 还存在远程缓冲区溢出漏洞，可能允许远程代码执行。建议升级至修复版本或限制 UDP 连接数量缓解风险。"
published = "2000-10-20T04:00:00Z"
remediation = "立即升级到 BeyondTrust Privileged Remote Access (PRA) 3.0 或更高版本，替代已过时的eEye IRIS产品服务；如无法立即升级，可在防火墙上添加UDP 135/137/138端口访问控制列表ACL限制，并严格限制源IP数量以缓解大流量UDP洪水攻击。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "eEye Digital Security IRIS 1.01 拒绝服务漏洞"
updated = "2026-06-16T21:52:22Z"

