[basic]
description = "Linux 内核 2.2.19 之前版本的 IP 伪装（masquerading）代码在处理特定数据包时未充分检查报文长度，存在安全漏洞。远程攻击者可利用特制数据包绕过长度检查，导致系统内存越界访问，可能造成信息泄露、权限提升或拒绝服务。攻击无需认证，仅需通过网络发送精心构造的数据包即可触发，影响范围广泛。"
published = "2001-04-17T04:00:00Z"
remediation = "升级 Linux 内核至 2.2.19 或更高版本，该版本修复了 IP 伪装模块中数据包长度检查不完整的问题。如无法升级内核，可在防火墙上禁用 IP 伪装（MASQUERADE）功能，或限制伪装规则仅对可信源 IP 生效，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Linux Kernel IP伪装代码数据包长度检查不完整漏洞"
updated = "2026-06-16T21:56:11Z"

