[basic]
description = "Flowise 是一个用于构建 AI 应用的低代码平台。该漏洞存在于 SQLite Record Manager 节点中，节点代码将用户可控的 additionalConfig 参数展开并放置在默认数据库路径之后，导致攻击者可通过 additionalConfig.database 覆盖 SQLite 数据库写入路径。在发布的 Docker 镜像以 root 身份运行的条件下，经过身份验证的攻击者可利用此漏洞将 SQLite 数据库写入 /etc/chromium/exploit.conf 等系统路径；同时通过精心构造 tableName 和 namespace 参数，将 shell 语法注入到数据库文件中。当 Flowise 通过 Puppeteer 启动 Chromium 浏览器时，Chromium 会加载 /etc/chromium/*.conf 配置文件，进而执行其中嵌入的命令，导致远程代码执行。此漏洞影响 Flowise 3.1.2 及之前版本，CVSS 评分 9.4（严重），已在新版本 3.1.3 中修复。"
published = "2026-08-04T17:17:01Z"
remediation = "立即升级到 Flowise 3.1.3 或更高版本，该版本修复了 SQLite Record Manager 节点的 additionalConfig 可覆盖数据库路径导致任意文件写入的问题。如暂时无法升级，应限制使用 SQLite Record Manager 节点的 Chatflow 仅对可信用户开放，同时在容器运行时配置非 root 用户运行 Flowise 服务，避免攻击者将恶意 SQLite 数据库写入系统目录并通过 Puppeteer 启动的 Chromium 触发代码执行。"
score = 9.4
severity = "CRITICAL"
sources = ["ghsa"]
title = "Flowise 低代码平台 SQLite Record Manager 远程代码执行漏洞"
updated = "2026-08-04T19:16:53Z"

