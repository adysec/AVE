[basic]
description = "Microsoft Windows 安全启动（Secure Boot）功能存在安全功能绕过漏洞（CWE-125 越界读取）。由于 Secure Boot 组件在处理启动策略时存在越界读取缺陷，具有物理访问权限的攻击者可在系统启动过程中绕过 Secure Boot 安全验证机制，从而读取受保护内存中的敏感信息，导致机密性泄露。该漏洞攻击复杂度低，无需用户交互，但需要攻击者能够物理接触目标设备。影响范围涵盖 Windows 10/11 多个版本及 Windows Server 2008 至 2025 系列。Microsoft 已在 2025 年 1 月安全更新中发布补丁修复此漏洞。"
published = "2025-01-14T18:15:32Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 (KB5050061)。各受影响版本对应的修复版本号：Windows 10 1507 升级至 10.0.10240.20890，Windows 10 1607/Server 2016 升级至 10.0.14393.7699，Windows 10 1809/Server 2019 升级至 10.0.17763.6775，Windows 10 21H2 升级至 10.0.19044.5371，Windows 10 22H2 升级至 10.0.19045.5371，Windows 11 22H2 升级至 10.0.22621.4751，Windows 11 23H2 升级至 10.0.22631.4751，Windows 11 24H2/Server 2025 升级至 10.0.26100.2894，Server 2022 升级至 10.0.20348.3091，Server 2022 23H2 升级至 10.0.25398.1369。可通过 Windows Update 自动获取更新，或从 Microsoft Update Catalog 手动下载安装。如无法立即打补丁，建议在 UEFI 固件设置中启用 Secure Boot 并确保 DBX 证书吊销列表为最新版本，同时限制物理接触系统的人员权限作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows Secure Boot 安全功能绕过漏洞"
updated = "2026-06-17T08:42:47Z"

