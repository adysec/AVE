[basic]
description = "Zope 2.2.4 及更早版本存在安全绕过漏洞，其 DTML 模板引擎中的 dtml-var 标签 fmt 属性可被部分可信用户利用，通过访问该属性绕过安全控制并调用原本受限的方法。攻击者需具备一定权限以注入或修改 DTML 模板，进而执行未授权操作。该漏洞影响基于 Zope 框架构建的 Web 应用，可能导致敏感数据泄露或权限提升。"
published = "2001-10-10T04:00:00Z"
remediation = "升级到 Zope 2.2.4 或更高版本，该版本已修复 dtml-var 标签 fmt 属性导致的权限绕过问题。如无法立即升级，可在 Zope 配置中禁用 dtml-var 标签的 fmt 属性访问，或通过反向代理限制对受影响方法的访问，仅允许完全受信任的用户调用相关方法。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Zope Web 应用服务器安全绕过漏洞"
updated = "2026-06-16T21:55:57Z"

