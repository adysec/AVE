[basic]
description = "Squid 代理服务器 2.4 STABLE3 及更早版本中存在缓冲区溢出漏洞，远程攻击者可通过向目标 Squid 服务器发送包含大量特殊字符的 ftp:// 格式 URL 触发该漏洞。当 Squid 对 URL 中的特殊字符进行转义处理时，由于未正确校验输入长度，导致缓冲区溢出，造成服务进程崩溃（核心转储），在特定条件下可导致任意代码执行。攻击者无需身份认证即可通过网络远程利用，影响范围广泛。"
published = "2002-03-08T05:00:00.000"
remediation = "升级 Squid 至 2.4.STABLE7 或更高版本，该版本已修复 FTP URI 处理中的缓冲区溢出问题。如无法立即升级，可在 Squid 配置中禁用或限制 FTP 协议转发（在 squid.conf 中将 http_access deny 规则应用于 FTP 端口），并配置 ACL 限制来源 IP 以降低攻击面。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Squid Proxy FTP URI 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:56:42.200"

