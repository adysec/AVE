[basic]
description = "Microsoft Windows 2000 SP2之前版本在非Windows 2000域环境中使用NTLM认证时存在账户锁定绕过漏洞。当用户凭据被本地缓存后，本地攻击者可利用该漏洞绕过账户锁定策略限制，对目标账户进行无限次登录尝试，直至暴力破解出密码。该漏洞影响系统的身份认证机制，可能导致未授权访问，CVSS评分4.6，危害等级中危。"
published = "2000-11-21T05:00:00Z"
remediation = "安装 Windows 2000 Service Pack 2 (SP2) 或更高版本服务包，该补丁修复了本地缓存凭据绕过账户锁定策略的问题。如无法立即升级，可配置组策略限制本地登录权限，并启用审核日志监控异常登录尝试。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows 2000 域账户锁定安全绕过漏洞"
updated = "2026-06-16T21:53:24Z"

