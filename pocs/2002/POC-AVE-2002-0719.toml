[info]
author = "ave"
description = "通过发送超长 HTTP GET 请求（约 994 字节以上）触发 MyWebServer 1.0.1/1.0.2 缓冲区溢出，导致服务崩溃停止响应，验证目标是否存在该拒绝服务漏洞。"
id = "POC-AVE-2002-0719"
name = "MyWebServer HTTP GET 请求缓冲区溢出拒绝服务漏洞 PoC"
severity = "medium"
tags = ["ave-2002-0719"]
vuln_id = [
    "CVE-2002-1897",
    "AVE-2002-0719",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
