[basic]
description = "Coder 的 `config-ssh` 命令在将服务端提供的 SSH 配置项（`HostnameSuffix`、`SSHConfigOptions`）写入用户 `~/.ssh/config` 文件时，未对嵌入的换行符进行过滤，也未限制可写入的 SSH 指令，导致恶意或已被攻陷的 Coder 服务器可向用户 SSH 配置中注入任意指令（如 `ProxyCommand`）。攻击者利用此漏洞可在开发者执行 `coder config-ssh` 的工作站上以当前用户权限执行任意命令，影响所有通过 Coder 管理远程开发环境的组织。利用条件包括控制服务端配置或中间人攻击，CVSS 评分 8.3，危害等级高。"
published = "2026-07-08T00:16:33Z"
remediation = "立即升级 Coder 至以下对应版本：v2.34.2（主线）、v2.33.8、v2.32.7 或 v2.29.17（ESR）。升级后 `HostnameSuffix` 和 `SSHConfigOptions` 将受到严格字符集校验，拒绝换行符等控制字符。如无法立即升级，每次执行 `coder config-ssh` 前先用 `--dry-run` 参数预览输出，确认无异常 SSH 指令后再应用。"
score = 8.3
severity = "HIGH"
sources = ["ghsa"]
title = "Coder Coder SSH 配置注入漏洞"
updated = "2026-07-08T19:44:24Z"

