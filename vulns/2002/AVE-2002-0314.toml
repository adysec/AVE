[basic]
description = "KDE 3.0.1 至 3.0.3a 版本的 kpf 组件中存在目录遍历漏洞，攻击者可通过构造包含目录遍历序列的 icon 参数 URL，以 kpf 用户权限读取服务器上任意文件。该漏洞源于 kpf 组件对 icon 参数缺乏路径遍历过滤，远程未认证攻击者可利用 ../ 序列遍历目录结构，读取敏感系统文件或应用配置文件。影响范围为 KDE 3.0.1 至 3.0.3a 版本，CVSS 评分 5.0（中等），攻击向量为网络、低复杂度、无需认证、部分机密性影响。攻击者只需发送包含恶意 icon 参数的 HTTP 请求即可触发漏洞，获取敏感文件内容。KDE 官方已在后续版本修复该路径遍历缺陷，建议升级至修复版本。"
published = "2002-10-28T05:00:00Z"
remediation = "建议立即升级 KDE 至 3.0.4 或更高版本（修复了 kpf 目录遍历漏洞）。若无法立即升级，可暂时停用 kpf 打印服务（systemctl stop kpf 或在 KDE 控制中心禁用打印服务），或在防火墙层面限制对 kpf 服务端口（通常为 631/tcp）的访问仅限本地回环地址，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "KDE KPF 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:58:57Z"

