[basic]
description = "D-Link 多款路由器（DIR-880L、DIR-868L、DIR-865L、DIR-860L）的 soap.cgi 接口存在操作系统命令注入漏洞，该漏洞位于 cgibin 二进制文件的 soapcgi_main 函数中。远程攻击者无需任何身份认证即可通过网络向目标设备的 service 参数注入恶意操作系统命令，成功利用后可完全控制受影响设备，实现信息窃取、恶意软件植入或发起后续攻击。攻击者只需向目标路由器的 Web 管理接口发送特制 HTTP 请求即可触发该漏洞，攻击复杂度低。受影响的固件版本包括 DIR-880L REVA FIRMWARE PATCH 1.08B04 及之前版本、DIR-868L FW112b04 及之前版本、DIR-865L REVA FIRMWARE PATCH 1.08.B01 及之前版本、DIR-860L FW110b04 及之前版本。"
published = "2018-03-06T20:29:00Z"
remediation = "立即将 DIR-880L 升级至 1.08B04 之后版本，DIR-868L 升级至 FW112b04 之后版本，DIR-865L 升级至 1.08.B01 之后版本，DIR-860L 升级至 FW110b04 之后版本。如无法升级，在路由器管理界面禁用远程管理功能，并在防火墙上限制对 TCP 端口 80/443 的访问来源 IP。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "D-Link 多款路由器操作系统命令注入漏洞"
updated = "2026-06-17T02:01:58Z"

