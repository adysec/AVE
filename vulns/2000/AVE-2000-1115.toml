[basic]
description = "BeOS 平台上的 Felix IRC 客户端（版本 2.3 及更早版本）存在拒绝服务漏洞。该漏洞的原理是程序在解析接收到的消息时，未能对其中包含的 URL 长度进行严格校验。远程攻击者可通过向目标用户发送一条包含超长 URL 的恶意消息，触发程序异常导致客户端崩溃。该漏洞影响所有使用受影响版本的 BeOS 用户，攻击条件简单，无需身份认证即可通过 IRC 协议远程触发，从而导致用户无法正常使用通信软件。"
published = "2001-01-09T05:00:00.000"
remediation = "由于 Felix 2.3 及其运行的 BeOS 平台已停止维护，建议用户停止使用该过时 IRC 客户端，迁移至现代安全客户端（如 HexChat 或 WeeChat）。若必须使用，可通过配置 IRC 客户端的过滤规则或在网络边界部署协议检查防火墙，拦截包含异常超长字符串的 URL 消息以缓解攻击。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Felix IRC 客户端 BeOS 拒绝服务漏洞"
updated = "2026-06-16T21:53:15.877"

