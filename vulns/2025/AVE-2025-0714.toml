[basic]
description = "Windows 数字媒体组件存在越界读取漏洞（CWE-125），攻击者需具备物理访问权限且低权限即可利用。该漏洞源于数字媒体组件在处理特定媒体文件时未正确验证输入边界，导致越界读取内存数据。攻击者可通过诱导用户插入包含恶意构造内容的存储介质，或在已获得物理访问权限的情况下直接操作目标设备，触发越界读取导致敏感信息泄露、系统完整性破坏或拒绝服务。该漏洞影响运行受影响版本 Windows 的设备，CVSS 评分 6.6（中危），攻击向量为物理接触，攻击复杂度低，需低权限且无需用户交互，可导致机密性、完整性和可用性均受到高度影响。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:43Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新 (KB5050061)，通过 Windows Update 自动更新或从 Microsoft Update Catalog 手动下载安装。如无法立即打补丁，可禁用 Windows Digital Media 相关服务（如 Windows Media Player Network Sharing Service）作为临时缓解措施，并限制本地用户权限防止提权利用。"
score = 6.6
severity = "MEDIUM"
sources = ["msrc"]
title = "微软 数字媒体 特权提升漏洞"
updated = "2026-06-17T08:42:54Z"

