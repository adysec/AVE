[basic]
description = 'Mistune Python Markdown 解析器的 toc 插件和 TableOfContents 指令在生成标题锚点 ID 时存在可预测标识符漏洞。默认情况下，标题 ID 采用 `toc_1`、`toc_2` 等纯序号格式，未使用标题文本内容进行 slug 化处理。攻击者若能在文档中注入带有 `id="toc_N"` 属性的 HTML 元素（例如通过 `escape=False` 模式或 include 指令的 HTML 分支），即可与合法标题产生 ID 冲突，导致同页导航链接被劫持、CSS 选择器误匹配至攻击者控制的内容、JavaScript 的 `getElementById` 操作指向错误元素。该漏洞影响所有使用默认 `heading_id` 回调的 Mistune 版本（<3.3.0），攻击前提是应用启用了 TOC 功能且攻击者能向文档中植入任意 HTML 元素。'
published = "2026-07-09"
remediation = "立即升级 mistune 至 3.3.0 或更高版本（`pip install --upgrade mistune`），该版本已将标题 ID 改为基于文本内容的 slug 生成方式。如无法升级，可在调用 `add_toc_hook` 或 `TableOfContents` 时传入自定义 `heading_id` 回调函数，使用 slugified 标题文本替代默认的 `toc_N` 序号方案，并避免在文档中允许用户注入原始 HTML 的 `id` 属性。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Mistune toc/TableOfContents 可预测标题ID生成漏洞"
updated = "2026-07-09"

