[basic]
description = "Harbor 容器镜像仓库在 core/api/user.go 中存在权限校验缺失漏洞。当 Harbor 以数据库认证后端（DB auth）运行且开放用户自注册时，低权限非管理员用户可通过向 POST /api/users API 发送请求创建管理员账户，实现未授权权限提升。该漏洞影响 Harbor 1.7.0 至 1.8.2 版本，攻击者仅需具备普通注册用户身份即可在无需交互的情况下完成利用，成功后可完全接管 Harbor 管理控制台，窃取镜像仓库数据、删除仓库或实施供应链攻击。修复方案为升级至 v1.7.6、v1.8.3 或 v1.9.0 版本；临时缓解措施可将认证后端切换为 LDAP 等非数据库认证方式。"
published = "2019-09-08T16:15:11.820"
remediation = "立即将 Harbor 升级至修复版本：运行 1.7.x 的用户升级到 v1.7.6，运行 1.8.x 的用户升级到 v1.8.3 或更高版本（v1.9.0+ 不受影响）。如暂时无法升级，可将认证后端从 DB 切换为 LDAP 等非数据库认证方式，并禁用用户自注册功能作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Harbor 镜像仓库未授权创建管理员账户漏洞"
updated = "2026-06-17T02:21:39.683"

