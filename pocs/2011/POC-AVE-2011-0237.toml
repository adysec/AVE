[info]
author = "ave"
description = "检测 Android 浏览器 < 4.4 及 Google Chrome < 15.0.874.102 中 WebKit 引擎的 HTMLPlugInImageElement::allowedToLoadFrameURL 函数同源策略绕过漏洞。通过构造包含 object 元素的恶意 HTML 页面，加载跨域资源后将 data 属性切换为 javascript: URL，可在目标域上下文中执行任意 JavaScript，实现 Universal XSS。"
id = "POC-AVE-2011-0237"
name = "CVE-2011-3881 PoC"
severity = "medium"
tags = ["ave-2011-0237"]
vuln_id = [
    "CVE-2011-3881",
    "AVE-2011-0237",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["CVE-2011-3881"]
