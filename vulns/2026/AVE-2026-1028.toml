[basic]
description = "Apple 多款操作系统存在整数溢出漏洞（CWE-190），由于对纹理数据的输入验证不足，攻击者可构造恶意纹理文件诱导目标应用处理，触发整数溢出导致应用程序异常终止。该漏洞影响 iOS、iPadOS、macOS（Sequoia、Sonoma、Tahoe）、tvOS、visionOS 及 watchOS 等多个平台版本。攻击者需诱使用户打开或处理包含恶意构造纹理的文件，才能成功触发漏洞，造成拒绝服务。Apple 已在 iOS 26.6、iPadOS 26.6、macOS Sequoia 15.7.8、macOS Sonoma 14.8.8、macOS Tahoe 26.6、tvOS 26.6、visionOS 26.6 及 watchOS 26.6 中修复该问题，建议用户及时更新至安全版本。"
published = "2026-07-27T21:17:02Z"
remediation = '建议立即将 iOS/iPadOS 升级至 26.6，macOS Sequoia 升级至 15.7.8，macOS Sonoma 升级至 14.8.8，macOS Tahoe 升级至 26.6，tvOS 升级至 26.6，visionOS 升级至 26.6，watchOS 升级至 26.6。可通过"设置">"通用">"软件更新"路径或 App Store 自动安装系统更新。如暂时无法升级，应避免打开来源不明的图片或纹理文件，并限制 untrusted 应用访问 ImageIO 框架。'
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Apple iOS 整数溢出漏洞"
updated = "2026-07-28T19:44:50Z"

