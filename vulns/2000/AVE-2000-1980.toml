[basic]
description = "ypbind 3.3 存在缓冲区溢出漏洞，运行于本地 root 权限下的 ypbind 服务在处理畸形或恶意输入数据时，未对缓冲区写入内容长度进行充分校验，触发越界写入（缓冲区溢出）。攻击者无需预先认证，可构造特制输入数据发送给目标，利用溢出覆盖内存中的关键数据和返回地址，劫持程序执行流程，最终可能获得目标系统的 root 权限。该漏洞影响 NIS 绑定服务的完整性与可用性，CVSS 评分为 10.0，危害等级严重。系统管理员应尽快升级至修复该漏洞的 ypbind 版本或禁用不必要的 NIS 服务以降低风险。"
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 ypbind 至 3.3 之后已修复该漏洞的版本；若无法升级，建议将该服务部署于内部可信网络，并在边界防火墙上限制对 834 端口（portmapper）及 ypbind 相关 RPC 服务的来源访问，仅允许受信任主机通过。同时按最小权限原则运行 ypbind 进程，避免其以 root 权限监听，并定期检查系统日志中与该服务相关的异常连接与异常请求，及时阻断可疑流量。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "ypbind ypbind 3.3 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:01.910"

