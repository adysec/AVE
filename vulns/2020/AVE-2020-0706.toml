[basic]
description = "Google Chrome 86.0.4240.183之前版本的V8 JavaScript引擎中存在不当实现漏洞，远程攻击者可通过构造特制的HTML页面触发堆破坏，进而实现远程代码执行。该漏洞影响Chrome浏览器及基于Chromium的浏览器，CVSS评分8.8，危害等级高。攻击者需要诱使用户访问恶意构造的网页才能利用此漏洞。Google已在2020年10月发布的Chrome 86.0.4240.183版本中修复该漏洞，该漏洞曾被发现在野利用。"
published = "2020-11-03T03:15:15Z"
remediation = "请立即升级 Google Chrome 至 86.0.4240.183 或更高版本：依次点击浏览器右上角「设置」→「关于 Chrome」，浏览器将自动检查并下载更新，更新完成后重启浏览器生效；也可通过 Chrome 菜单中的「帮助 → 关于 Google Chrome」触发手动更新。对于企业环境，建议通过 Google Update / GPO 统一推送并强制安装最新稳定版。该漏洞已在野外被积极利用，务必尽快完成升级，在补丁完成前避免点击来历不明的网页链接、不访问不受信任的站点，并建议启用 Chrome 自动更新功能以确保后续安全补丁及时生效。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome V8 堆缓冲区错误远程代码执行漏洞"
updated = "2026-06-17T02:57:37Z"

