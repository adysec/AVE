[basic]
description = "该漏洞影响 Windows 95/98 操作系统中的 IPX（Internetwork Packet Exchange）协议实现。攻击者无需身份验证即可向目标系统发送包含广播地址的源 IP 地址的恶意 IPX 协议数据包，利用协议处理逻辑中的缺陷引发系统崩溃或服务不可用。IPX 协议栈的缺陷导致系统在处理这些畸形数据包时出现异常进而导致拒绝服务。攻击可通过简单的网络请求实现，对攻击者技术要求较低，影响范围仅限于配置了 IPX 协议的旧版 Windows 系统（Windows 95/98）。由于该版本操作系统已 discontinued，此漏洞现已基本不会影响现代系统，但仍可作为学习协议安全性的案例分析。"
published = "2000-10-20T04:00:00.000"
remediation = "升级到 Windows NT 4.0 SP6a 或更新版本（Windows 98 SE/Windows 2000），这修复了 malformed IPX ping packet 处理漏洞；如无法立即升级，可在网络边界禁用 IPX 协议并过滤包含广播源地址的 IPX 数据包。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows 95/98 IPX 协议拒绝服务漏洞"
updated = "2026-06-16T21:52:23.300"

