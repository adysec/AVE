[basic]
description = "Flowise 是一款用于构建自定义大语言模型流程的拖放式用户界面。在 3.1.3 版本之前，其 PUT /api/v1/executions/:id 端点缺少对其他执行端点（如 GET、DELETE）提供保护的 checkAnyPermission() 中间件，导致任何已通过身份验证的用户——无论其被分配了何种权限——均可修改其工作区中任意执行记录的状态、数据与元信息。攻击者仅需持有任意有效的 API 密钥，即可通过向该端点发送特制请求篡改工作流执行结果或注入恶意数据，进而实现权限提升。该漏洞影响所有部署了受影响版本 Flowise 的实例，已在 3.1.3 版本中得到修复。"
published = "2026-08-04T20:16:54Z"
remediation = "立即升级 Flowise 至 3.1.3 或更高版本，该版本已在 PUT /api/v1/executions/:id 端点补全 checkAnyPermission() 中间件，修复权限校验缺失问题。如暂无法升级，可在反向代理层对 /api/v1/executions/* 的 PUT 请求实施 ACL 限制，仅允许管理员角色访问，或临时禁用该端点以阻止未授权修改。"
score = 7.1
severity = "HIGH"
sources = ["ghsa"]
title = "Flowise 执行记录越权修改漏洞"
updated = "2026-08-04T20:16:54Z"

