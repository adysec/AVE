[basic]
description = "OSSP mm 共享内存库（libmm）1.2.0 之前版本在处理临时文件时存在权限提升漏洞。本地 Apache 用户可利用符号链接攻击（symlink attack）在临时文件创建过程中劫持文件操作，从而获取更高权限。攻击者需具有本地系统访问权限，通过创建恶意的符号链接指向目标文件，诱使 libmm 库以提升的权限写入或覆盖系统文件，最终实现权限提升。该漏洞影响 OSSP mm 1.2.0 之前所有版本，CVSS 评分 6.2，危害等级中等。"
published = "2002-08-12T04:00:00.000"
remediation = "升级 OSSP mm 库至 1.2.0 或更高版本。各发行版对应：Red Hat 安装 RHSA-2002:153/154/156/163/164 更新，Debian 安装 DSA-137 更新，Mandrake 安装 MDKSA-2002:045 更新，Caldera OpenLinux 安装 CSSA-2002-032.0 更新。如无法立即升级，确保 Apache 用户对临时文件目录的写入权限受到严格限制。"
score = 6.2
severity = "MEDIUM"
sources = ["redhat"]
title = "OSSP mm 共享内存库临时文件权限提升漏洞"
updated = "2026-06-16T21:57:53.087"

