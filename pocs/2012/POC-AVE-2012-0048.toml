[info]
author = "AVE"
description = "通过设置 window.fullScreen=true 触发无用户交互的全屏模式，实现 UI 欺骗攻击。PoC 页面加载后自动进入全屏，覆盖浏览器地址栏和通知栏，诱骗用户点击伪造内容。"
id = "POC-AVE-2012-0048"
name = "Mozilla Firefox window.fullScreen 用户界面欺骗漏洞 PoC"
severity = "medium"
tags = [
    "cve-2012-0460",
    "firefox",
    "fullscreen",
    "ui-spoofing",
]
vuln_id = [
    "CVE-2012-0460",
    "AVE-2012-0048",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["fullScreen"]
