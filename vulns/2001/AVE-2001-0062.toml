[basic]
description = "AT&T WinVNC（Virtual Network Computing）3.3.3r7 及更早版本的 Windows 平台服务器存在栈缓冲区溢出漏洞。当注册表键 DebugLevel 的值大于 0 时，服务器在处理 HTTP GET 请求的过程中，通过无边界检查的 vsprintf() 函数将超长请求数据写入固定大小的缓冲区，导致栈上的返回地址被覆盖。未经身份认证的远程攻击者只需向目标服务器发送一条特制的超长 HTTP GET 请求，即可在 VNC 服务进程上下文中执行任意代码，完全控制远程主机。该漏洞影响 WinVNC 3.3.3r7 及以下所有版本，CVSS v2.0 评分 10.0，危害等级严重。官方修复方案为将 Log.cpp 中的 vsprintf() 替换为带长度限制的 _vsnprintf()，或临时将 DebugLevel 注册表值设为 0 以禁用调试日志输出，阻止漏洞触发路径。"
published = "2001-05-03T04:00:00Z"
remediation = "升级到 AT&T WinVNC 3.3.3r7 之后版本，或手动应用官方补丁修改 Log.cpp 中的 vsprintf 调用为 _vsnprintf 以修复缓冲区溢出。如无法立即升级，可通过注册表将 WinVNC 的 DebugLevel 键值设为 0 禁用 Web 服务端的调试日志功能，或在防火墙层面限制 5800/5900 端口仅允许可信网络访问作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "AT&T WinVNC 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:47Z"

