[basic]
description = "KDE 1.1.2 版本中的 kvt（KDE 虚拟终端）存在格式化字符串漏洞，本地攻击者可通过构造包含格式化字符的 DISPLAY 环境变量触发该漏洞，从而在目标系统上执行任意命令。该漏洞影响 KDE 1.1.2 及可能受影响的早期版本，攻击者需要具备本地用户权限才能利用，CVSS 评分为 7.2，危害等级较高。攻击者可利用此漏洞完全控制受影响系统，造成严重的安全风险。"
published = "2000-12-19T05:00:00.000"
remediation = "升级到 KDE 1.1.3 或更高版本以修复 kvt 程序中的格式字符串漏洞；作为临时缓解措施，可在登录环境中清除或过滤 DISPLAY 环境变量中的格式化字符（如 %n、%s、%x），或禁止本地用户设置 DISPLAY 变量。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "KDE kvt 格式化字符串代码执行漏洞"
updated = "2026-06-16T21:52:45.863"

