[basic]
description = "WordPress 4.8.2 之前版本中的 wp-admin/edit-tag-form.php 和 wp-admin/user-edit.php 存在开放重定向漏洞（CWE-601）。该漏洞允许已登录的低权限用户通过特制的 URL 参数将用户重定向到任意外部恶意网站，结合社会工程学可诱导用户访问钓鱼页面。攻击者无需认证即可利用该漏洞的前提是诱使具有登录状态的管理员或用户点击恶意链接，从而实现钓鱼攻击或绕过 URL 验证机制。WordPress 官方已在 4.8.2 版本中修复此问题。"
published = "2017-09-23T20:29:00Z"
remediation = "立即升级 WordPress 至 4.8.2 或更高版本，该版本已修复 wp-admin/edit-tag-form.php 和 wp-admin/user-edit.php 中的开放重定向漏洞。如无法立即升级，可在 Web 服务器（Nginx/Apache）层面配置规则拦截包含非本站域名的 redirect_to 参数请求，或通过 WordPress 安全插件限制重定向目标域名白名单。"
score = 5.4
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress 用户和术语编辑屏幕开放重定向漏洞"
updated = "2026-06-17T01:06:40Z"

