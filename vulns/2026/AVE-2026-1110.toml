[basic]
description = "Adobe Acrobat Reader 存在释放后使用 (Use After Free) 漏洞，受影响版本包括 24.001.30365、26.001.21651 及更早版本。该漏洞位于软件的内存管理机制中，当程序错误地在释放内存后继续使用该内存区域时，攻击者可构造特制的恶意 PDF 文件触发此条件。成功利用后，攻击者能够在当前用户上下文中执行任意代码，实现远程代码执行。该漏洞的利用需要用户交互，即受害者必须主动打开攻击者发送的恶意文件。受影响平台主要为 Windows 系统，CVSS 评分为 7.8，危害等级高。Adobe 已发布修复版本 24.001.30383 和 26.001.21662，建议用户及时升级。"
published = "2026-06-09T21:17:21.117"
remediation = 'Adobe 已发布安全更新修复此漏洞，受影响用户应立即升级 Acrobat Reader 至 24.001.30383（连续体验版）或 26.001.21662（经典体验版），可通过"帮助"→"检查更新"自动安装或从官网下载完整安装包覆盖安装。如无法立即更新，建议暂时避免打开来源不明的 PDF 文件，并在邮件网关或终端防护中拦截可疑 PDF 附件作为临时缓解措施。'
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Adobe Acrobat Reader 释放后使用任意代码执行漏洞"
updated = "2026-07-23T09:10:00.113"

