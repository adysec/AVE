[basic]
description = "Google Chrome（Chromium）Fenced Frames 组件存在不恰当实现漏洞（CWE-200），远程攻击者可通过构造特制的 HTML 页面诱导用户访问，利用 Fenced Frames 的权限隔离缺陷绕过同源策略限制，从而窃取目标系统中的敏感信息。该漏洞影响 132.0.6834.83 之前版本的 Chrome 浏览器，攻击复杂度低，无需身份认证，但需要用户交互配合。Google 已在 2025 年 1 月发布的 Chrome 132.0.6834.83 版本中修复此漏洞。"
published = "2025-01-15T11:15:10Z"
remediation = "升级 Google Chrome 至 132.0.6834.83 或更高版本，可通过 Chrome 设置 > 关于 Chrome 自动检查更新。使用 Chromium 内核的应用程序（如 Electron、Qt WebEngine）需同步更新至对应修复版本。Fedora 用户执行 `sudo dnf update chromium` 更新至 132.0.6834.83。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome Fenced Frames 实现不当信息泄露漏洞"
updated = "2026-06-17T08:26:29Z"

