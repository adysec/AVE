[basic]
description = "Faq-O-Matic 是由 Jon Howell 开发的一个在线常见问题（FAQ）管理系统。该系统的 fom.cgi 脚本在处理用户通过 file 参数提交的数据时，未对输入进行充分的过滤和转义，导致远程攻击者能够向页面注入任意 Web 脚本代码或 HTML 内容。当其他用户访问包含恶意脚本的页面时，脚本将在受害者的浏览器中执行，从而窃取会话令牌、重定向用户至恶意网站或篡改页面内容。此漏洞影响 Faq-O-Matic 2.711 和 2.712 版本，攻击者无需身份认证即可远程发起攻击，利用方式简单，只需构造包含恶意脚本的 file 参数请求即可触发。"
published = "2002-12-31T05:00:00Z"
remediation = "升级到 Faq-O-Matic 2.713 或更高版本（推荐最新稳定版 2.721），该版本已修复 fom.cgi 中 file 参数的跨站脚本漏洞。如无法立即升级，可在 Web 服务器或反向代理层配置 URL 过滤规则，阻断对 fom.cgi 的 file 参数中包含 &lt;script&gt;、javascript:、onload= 等 XSS 特征字符串的请求，或启用 Web 应用防火墙（WAF）拦截恶意脚本注入。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Jon Howell Faq-O-Matic 跨站脚本漏洞"
updated = "2026-06-16T22:00:29Z"

