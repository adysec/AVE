[basic]
description = "phpMyAdmin 5.0.2 登录页面存在 CRLF 注入漏洞（CWE-74），由于登录表单对用户输入的换行符序列未做充分过滤与转义，攻击者可通过在用户名、密码或隐藏字段中注入 URL 编码的换行序列（%0D%0A）构造恶意载荷。当认证失败时，服务端将用户输入原样回显至错误页面，导致 CRLF 序列被反射到 HTTP 响应头或页面内容中，从而可能引发 HTTP 响应拆分、HTML 实体注入，甚至在特定条件下触发反射型跨站脚本攻击。该漏洞影响 phpMyAdmin 5.0.2 版本，攻击者无需事先认证即可在远程发起利用，但需诱导用户点击恶意链接或访问 crafted 页面（UI:R）。CVSS v3.1 评分为 6.1（MEDIUM），向量为 AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N。phpMyAdmin 官方对此漏洞的严重性存在争议，但建议用户升级至后续安全版本以彻底消除风险。"
published = "2020-03-31T17:15:26Z"
remediation = "立即升级 phpMyAdmin 至 5.0.3 或更高版本，该版本对登录表单错误页面输出使用 sanitizeMessage() 进行 HTML 实体转义，将尖括号编码为 &amp;lt; 和 &amp;gt;，可阻断 CRLF 注入攻击链。如暂无法升级，可在 Web 服务器或反向代理层通过 WAF 规则过滤请求中的 %0D%0A 换行序列作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "phpMyAdmin 5.0.2 CRLF注入反射型跨站脚本漏洞"
updated = "2026-06-17T02:50:11Z"

