[basic]
description = "RealPlayer 多媒体播放器程序 [CVE-2010-4397] 存在整数溢出漏洞。攻击者可通过精心 crafting 的恶意 AAC 文件，嵌入特殊 TIT2 原子，在 RealPlayer 的 pnen3260.dll 模块中触发整数溢出。该漏洞影响 RealPlayer 11.0-11.1 版本、RealPlayer SP 1.0-1.1.1 版本、Mac RealPlayer 11.0-11.1 版本及 Linux RealPlayer 11.0.2.1744 版本，允许远程攻击者通过上述文件实现任意代码执行，危及系统的保密性、完整性和可用性。整数溢出导致攻击者可写入越界内存或控制程序执行流程，利用了 RealPlayer 中 AAC TIT2 原子解析代码的边界检查不足的缺陷。"
published = "2010-12-14T16:00:05Z"
remediation = "立即升级 RealPlayer 至 12.0.1.609 或更高版本（Windows/Mac/Linux 均需更新）。若无法立即升级，请卸载 RealPlayer 并改用其他播放器，或在防火墙层面禁止实体从不可信来源加载 AAC 文件作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer 整数溢出漏洞"
updated = "2026-06-16T23:24:42Z"

