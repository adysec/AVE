[basic]
description = "tags.<value>Apache Tomcat 4.0至4.1以及3.0至3.3.1版本的默认安装中自带了SnoopServlet和TroubleShooter两个示例servlet。未经身份认证的远程攻击者可以通过直接访问这两个示例servlet获取Tomcat服务器的安装路径及其他敏感系统信息，造成路径信息泄露。该漏洞影响所有使用受影响版本Apache Tomcat的应用程序服务器，攻击者无需任何凭据即可在远程触发，利用方式简单直接，仅需发送HTTP请求即可获取敏感信息。"
published = "2002-12-31T05:00:00Z"
remediation = "Apache Tomcat 4.x 和 3.x 版本已停止支持，建议立即升级至 Apache Tomcat 9.0.x 或更高版本以彻底消除漏洞。如暂时无法升级，可删除或禁用 examples Web 应用中的 SnoopServlet 和 TroubleShooter 示例 servlet，具体操作为移除 $CATALINA_HOME/webapps/examples 目录，或在 web.xml 中注释掉相关 servlet 映射，同时确保生产环境不部署 examples 应用。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Apache Tomcat 4.0/4.1 Servlet 路径信息泄露漏洞"
updated = "2026-06-16T22:00:28Z"

