[basic]
description = "Bytes Interactive Web Shopper 购物车程序（shopper.cgi）2.0 及更早版本中存在目录遍历漏洞。该漏洞源于程序在处理 newpage 参数时未能对用户输入进行有效过滤，导致远程攻击者可以通过在请求中构造包含“..”的特制路径，绕过预设的目录限制，从而读取服务器上的任意敏感文件。该漏洞影响所有部署了相关漏洞版本的 Web 服务器，攻击者无需身份验证即可通过网络发起攻击，导致系统机密信息泄露。"
published = "2000-12-19T05:00:00.000"
remediation = '由于该软件已停止维护，建议立即停止使用 Bytes Interactive Web Shopper 1.0/2.0。如必须维持运行，应在 Web 服务器（如 Apache/IIS）层面配置访问控制策略，禁止在 URL 中出现 ".." 等遍历字符，或部署 WAF 拦截包含路径遍历特征的请求。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Bytes Interactive Web Shopper 目录遍历漏洞"
updated = "2026-06-16T21:52:46.397"

