[basic]
description = "KTH Kerberos IV 的 kdc_reply_cipher 函数存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标 Kerberos IV 密钥分发中心（KDC）发送超长的认证请求数据包触发该缓冲区溢出，导致服务拒绝或可能执行任意命令。该漏洞影响运行 KTH Kerberos IV 的服务器系统，攻击者无需任何凭据即可利用此漏洞，造成系统服务中断或在特定条件下获取系统控制权限。管理员应及时升级至修复版本以消除安全风险。"
published = "2001-02-16T05:00:00.000"
remediation = "立即停止使用 KTH Kerberos IV 并升级到支持的 Kerberos 实现。直接迁移到 MIT Kerberos 5 或更新版本，通过应用安全更新来修补漏洞。如果迁移不立即可能，那么部署强化认证机制并严格限制对 Kerberos 服务的网络访问以减少攻击面。考虑部署网络入侵检测系统来监控对 Kerberos 的异常认证流量行为。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "KTH Kerberos IV 缓冲区溢出远程拒绝服务漏洞"
updated = "2026-06-16T21:53:31.917"

