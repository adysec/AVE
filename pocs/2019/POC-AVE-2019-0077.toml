[info]
author = "ave"
description = "检测目标系统是否存在 Windows Graphics Device Interface (GDI) 远程代码执行漏洞（CVE-2019-0903）。该漏洞源于 GDI 处理内存对象时存在缺陷，攻击者可构造恶意数据诱使目标用户执行特定操作后触发远程代码执行。影响 Windows 7/8.1/10 及 Windows Server 2008-2019 等多个版本。CVSS 评分 8.8，CISA KEV 已收录，确认野外已遭利用。本 PoC 仅做安全检测，不执行实际利用代码。"
id = "POC-AVE-2019-0077"
name = "Microsoft Windows GDI Remote Code Execution Vulnerability PoC"
severity = "high"
tags = ["ave-2019-0077"]
vuln_id = [
    "CVE-2019-0903",
    "AVE-2019-0077",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
