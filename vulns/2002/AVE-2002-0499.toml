[basic]
description = "Microsoft SQL Server 2000 SP2 在配置为分发服务器时，其 sp_MScopyscript 存储过程存在 SQL 注入漏洞。远程攻击者可通过向 @scriptfile 参数传递特制的恶意脚本，利用该存储过程执行任意代码，从而完全控制目标数据库服务器。攻击无需身份认证，仅需网络可达即可触发。该漏洞影响 Microsoft SQL Server 2000 SP2 分发服务器配置，CVSS 评分 7.5，危害等级高。官方已发布安全更新修复此漏洞。"
published = "2002-09-24T04:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS02-043 提供的累积补丁 (Q316333)，该补丁要求先安装 SQL Server 2000 Service Pack 2。如无法立即打补丁，可通过 Query Analyzer 执行 `REVOKE EXECUTE ON [dbo].[sp_MScopyscriptfile] FROM [public] CASCADE` 撤销 public 角色对该存储过程的执行权限作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft SQL Server 2000 sp_MScopyscript SQL注入漏洞"
updated = "2026-06-16T21:58:30Z"

