[basic]
description = "Midnight Commander（mc）的 cons.saver 组件在 4.5.42 及更早版本中未正确验证输出文件描述符是否为 TTY 设备。本地攻击者可利用此缺陷，通过创建指向目标文件的符号链接，再调用 mc 并将该符号链接指定为 TTY 参数，从而篡改或破坏目标文件内容。该漏洞影响 Midnight Commander 4.5.42 及之前所有版本，攻击条件为本地访问，无需身份认证，利用复杂度低，可能导致文件数据损坏或丢失。"
published = "2001-01-09T05:00:00.000"
remediation = "升级到 Midnight Commander 4.6.0 或更高版本，其中 cons.saver 函数已修复 TTY 验证逻辑；立即通过引入文件路径校验和原子重命名操作来防止符号链接劫持；如无法立即升级，可通过修改系统 TTY 设备文件权限和禁止在世界可写目录下使用符号链接作为临时缓解措施"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Midnight Commander (mc) cons.saver 符号链接文件损坏漏洞"
updated = "2026-06-16T21:53:09.850"

