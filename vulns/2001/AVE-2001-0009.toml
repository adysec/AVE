[basic]
description = "Leif M. Wright 开发的 simplestguest.cgi 2.0 版本存在远程命令执行漏洞。该 CGI 程序作为 guestbook 留言板脚本使用时，未对用户提交的 guestbook 参数进行充分过滤和验证，攻击者可以通过注入 Shell 元字符（如分号、管道符等）在服务器端执行任意系统命令。由于该脚本通常以 Web 服务器权限运行，攻击者无需身份认证即可通过构造恶意请求获取服务器控制权，进而窃取敏感数据、篡改网页内容或进一步渗透内网。该漏洞影响部署了 simplestguest.cgi 的所有 Web 服务器，CVSS 评分 10.0，危害等级严重。"
published = "2001-02-12T05:00:00Z"
remediation = "立即从网站删除 simplestguest.cgi 脚本，替换为受支持的安全留言本程序（如 PHP Guestbook 或 WordPress 评论组件）。如暂时无法替换，应在 Web 服务器配置中禁用该 CGI 脚本的执行权限，或对 guestbook 参数严格过滤管道符、分号、反引号等 shell 元字符，阻止命令注入。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Leif M. Wright simplestguest.cgi 远程命令执行漏洞"
updated = "2026-06-16T21:53:30Z"

