[basic]
description = "Linux Kanji on Console（KON）软件包中的 kon 程序存在缓冲区溢出漏洞。本地攻击者可通过向 kon 程序传递超长的 -StartupMessage 参数触发缓冲区溢出，成功利用此漏洞可获取 root 权限。该漏洞影响使用 KON 软件包的 Linux 发行版，攻击者需拥有本地系统访问权限才能利用，危害等级高。"
published = "2000-06-21T04:00:00Z"
remediation = "立即卸载 KON (Kanji on Console) 软件包，该软件包已停止维护且不再被任何主流 Linux 发行版支持。如因特殊需求必须使用，请限制本地用户对 kon 程序的执行权限，通过 chmod 750 /usr/bin/kon 移除其他用户的执行权限，并确保非授权用户无法传递 -StartupMessage 参数。建议迁移至现代终端模拟器（如 GNOME Terminal、Konsole 或 xterm）替代 KON 功能。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Mandrake Linux kon 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:05Z"

