[basic]
description = "Mitel Networks MiCollab AWV 是一款企业级音视频会议和网络会议协作平台。该漏洞存在于其 Web 会议组件中，由于对用户请求的访问验证不足，未经身份认证的远程攻击者可通过构造包含路径遍历序列（如 ../）的特制 URL，访问服务器受限目录中的任意文件。成功利用此漏洞可导致攻击者窃取服务器上的敏感信息，包括配置文件、凭据或其他机密数据。该漏洞影响 MiCollab AWV 8.1.2.4 之前版本以及 9.x 系列 9.1.3 之前版本。攻击者无需身份验证，只需向目标服务器发送恶意构造的 HTTP 请求即可触发漏洞，利用门槛较低。"
published = "2020-06-10T18:15:10Z"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "Mitel Networks MiCollab AWV 路径遍历漏洞"
updated = "2026-06-17T02:50:49Z"

