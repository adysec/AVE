[basic]
description = "Windows BranchCache 组件存在释放后使用（Use-After-Free）漏洞。BranchCache 是 Windows 中用于优化广域网带宽的分支机构缓存技术。由于 BranchCache 服务在处理特定网络请求时对内存对象生命周期管理不当，攻击者可通过向目标系统发送特制的网络数据包触发释放后使用条件，导致远程代码执行。该漏洞影响 Windows 10/11 多个版本及 Windows Server 2008 R2 至 2025 系列操作系统。攻击者需与目标处于同一相邻网络（AV:A），无需身份认证和用户交互，成功利用后可获取系统的完全控制权限。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:51Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新（KB5050004）。Windows 10/11 用户通过 Windows Update 自动获取更新即可；Windows Server 2012 需先安装 SSU KB5050116 再安装 KB5050004；其他 Windows Server 版本对应更新见 MSRC 公告。如无法立即打补丁，建议在防火墙上限制对 BranchCache 服务的相邻网络访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows BranchCache 远程代码执行漏洞"
updated = "2026-06-17T08:43:01Z"

