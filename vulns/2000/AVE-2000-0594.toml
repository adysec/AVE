[basic]
description = "SGI IRIX 系统中 /usr/bin/lpstat 命令存在缓冲区溢出漏洞，攻击者通过向 -n 参数传递超长字符串触发栈溢出，覆盖返回地址实现任意代码执行。该漏洞影响 IRIX 6.2、6.3 等版本，CVSS 评分 7.2（本地攻击、低复杂度、无需认证、完全影响机密性/完整性/可用性）。攻击条件为拥有本地系统访问权限的普通用户，利用方式为构造恶意 -n 参数调用 lpstat 程序，成功利用可提升至 root 权限完全控制系统。SGI 已发布补丁修复此漏洞，建议升级至修复版本或限制 lpstat 程序的执行权限。"
published = "2000-10-20T04:00:00.000"
remediation = "升级至 IRIX 6.5.12 或更高版本（SGI 已发布补丁修复 lpstat 缓冲区溢出）。若无法升级，立即移除 /usr/bin/lpstat 的 setuid 位：chmod -s /usr/bin/lpstat，并限制本地用户登录权限，禁用不必要的打印服务作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Silicon Graphics IRIX 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:52:29.807"

