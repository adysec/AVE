[basic]
description = "OpenSSL 0.9.6d及之前版本、0.9.7-beta2及之前版本存在缓冲区溢出漏洞。远程攻击者可通过(1)向SSL2协议发送特制的超大客户端主密钥(Client Master Key)或(2)向SSL3协议发送超大会话ID(Session ID)触发缓冲区溢出，导致远程代码执行。该漏洞影响广泛部署OpenSSL的Web服务器、邮件服务器等系统，攻击者无需身份认证即可利用，危害严重。厂商已发布更新版本修复此漏洞。"
published = "2002-08-12T04:00:00.000"
remediation = "升级 OpenSSL 至 0.9.6e 或 0.9.7 正式版（含以上版本），该漏洞已在 0.9.6e 中修复。如无法升级，可在 OpenSSL 配置中禁用 SSLv2 协议（设置 SSLProtocol -SSLv2），并限制客户端密钥长度以缓解缓冲区溢出风险。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "OpenSSL SSL2/SSL3 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:57:52.810"

