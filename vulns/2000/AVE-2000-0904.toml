[basic]
description = "IBM OS/2 Warp 4.5（及 4.0/4.2/4.3 版本）的 FTP 服务器存在拒绝服务漏洞。其原理是服务器在处理用户登录请求时，未能对输入用户名的长度进行有效校验，导致远程攻击者可以通过发送一个超长的用户名字符串触发缓冲区溢出或系统异常。该漏洞影响所有运行相关版本 FTP 服务的系统，攻击者无需任何身份认证，仅需在网络可达条件下发送特制请求即可导致 FTP 服务崩溃并停止响应，造成远程拒绝服务。"
published = "2000-10-20T04:00:00Z"
remediation = "建议停止使用受影响的 OS/2 Warp 内置 FTP 服务器，迁移至更安全的第三方 FTP 软件。若必须保留，请在防火墙上限制 FTP 访问权限，仅允许可信 IP 连接，或通过入侵检测系统（IDS）拦截超长用户名的恶意请求以防止拒绝服务攻击。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "IBM OS/2 FTP Server 拒绝服务漏洞"
updated = "2026-06-16T21:52:25Z"

