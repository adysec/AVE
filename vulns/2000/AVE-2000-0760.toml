[basic]
description = "Apache::ASP 模块 1.93 及更早版本中自带的 source.asp 示例脚本存在文件非法写入漏洞。远程攻击者无需身份认证即可通过向该脚本发送特制 HTTP 请求，利用脚本中的安全缺陷在目标服务器上任意修改文件，导致系统完整性受损。该漏洞影响 Apache::ASP 1.93 及之前版本，CVSS 评分 7.5，危害等级高。目前官方已建议移除或限制 source.asp 脚本的访问权限。"
published = "2000-07-11T04:00:00.000"
remediation = "升级 Apache::ASP 至 2.0 或更高版本，或直接删除 web 根目录下的 `source.asp` 示例脚本。如无法立即升级，在 Apache 配置中将该文件所在目录添加 `Deny from all` 访问限制作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Apache Apache::ASP source.asp 任意文件写入漏洞"
updated = "2026-06-16T21:52:08.580"

