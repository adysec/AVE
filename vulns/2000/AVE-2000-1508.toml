[basic]
description = "该漏洞存在于 Microsoft IIS 4.0 和 5.0 的 shtml.dll 组件中。其原理是服务器在处理错误消息时，未能对用户输入的参数进行适当的过滤或转义，导致恶意脚本可以直接被回显至客户端浏览器。攻击者可以通过诱导受害者访问一个包含特制脚本的恶意链接，使脚本在受信任站点的上下文中执行。该漏洞影响所有运行受影响 IIS 版本的服务器，可导致会话劫持、敏感信息泄露或页面内容篡改。"
published = "2000-10-20T04:00:00Z"
remediation = "建议将 IIS 服务器升级至 5.0 以上版本或安装微软发布的相应安全更新补丁。由于 IIS 4.0/5.0 已极其陈旧且不再受支持，强烈建议迁移至更新的 Windows Server 操作系统及现代 IIS 版本，以从根本上消除此类跨站脚本漏洞。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Microsoft IIS 4.0/5.0 跨站脚本攻击漏洞"
updated = "2026-06-16T21:52:23Z"

