[basic]
description = 'Linux 内核 BPF 子系统在启用 PREEMPT_RT 实时补丁时存在锁顺序违规漏洞。当对预分配哈希表（htab）执行覆盖更新时，旧元素的释放操作持有 bucket 锁（raw-spin-lock），但释放过程中 check_and_free_fields() 会尝试获取 spin-lock，违反锁依赖规则，触发 "scheduling while atomic" 警告，可能导致系统崩溃或挂起。该漏洞影响 Linux 内核 6.12 及以上启用 PREEMPT_RT 的版本。本地低权限攻击者可通过加载特定的 BPF 程序触发竞态条件，利用该漏洞造成拒绝服务或潜在内存破坏。修复方案通过 kworker 异步取消正在运行的 bpf_timer 来解决锁冲突问题。'
published = "2025-03-06T16:15:54Z"
remediation = "升级 Linux 内核至已包含修复的稳定版本。对于 Ubuntu 24.04 LTS 应安装 6.8.0-64.67 或更高版本的内核包；对于 Ubuntu 24.10 应安装 6.11.0-26.26 或更高版本。SUSE Linux Enterprise 15 SP6 用户应安装 SUSE-SU-2025:1177-1 安全更新中的内核补丁。如当前系统启用了 PREEMPT_RT 且无法立即升级内核，可暂时禁用 PREEMPT_RT 配置并重新编译内核作为临时缓解措施，或避免在启用 PREEMPT_RT 的系统上运行使用 BPF 定时器的程序。执行 apt update && apt upgrade linux-image-generic 或使用对应发行版的内核更新命令进行升级，升级后重启系统使新内核生效。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 BPF 双重释放漏洞"
updated = "2026-07-30T06:21:39Z"

