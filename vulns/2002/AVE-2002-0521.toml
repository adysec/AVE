[basic]
description = 'iPlanet Web Server 6.0 SP2、4.1 SP9 及 Netscape Enterprise Server 3.6 在 Windows 平台上的搜索引擎组件存在目录遍历漏洞。攻击者无需身份认证，向搜索组件发送包含 ..\（点-反斜杠）序列的 NS-query-pat 参数请求，即可利用该漏洞绕过服务器目录访问限制，遍历读取服务器操作系统上的任意文件，导致敏感信息泄露。攻击条件为可远程访问目标服务器的搜索接口，且目标运行于 Windows 平台。该漏洞已存在公开利用方法，攻击者可据此读取配置文件、口令文件等敏感数据，危害较为严重。'
published = "2002-10-04T04:00:00.000"
remediation = '该漏洞存在于已停止支持的旧版 iPlanet/Netscape 服务器中，官方已不再发布补丁。建议立即迁移至受支持的 Web 服务器（如 Oracle iPlanet Web Server 7.0+ 或替代产品），并在迁移前通过 WAF 规则拦截包含 `..\` 及 `NS-query-pat` 参数的请求作为临时缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Sun Microsystems iPlanet Web Server 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:58:37.143"

