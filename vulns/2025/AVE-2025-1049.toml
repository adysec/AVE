[basic]
description = "CVE-2025-21927是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2025-04-01T16:15:23Z"
remediation = '升级 Linux 内核至修复版本：主流发行版应更新至包含以下提交补丁的内核版本——上游稳定版 6.12.19、6.13.7 或 6.14 及以上；Ubuntu 24.04 LTS 用户可升级至 linux-gke 6.8.0-1036.40 或对应云内核 FIPS 版本 6.8.0-1040.42；RHEL 用户请等待 Red Hat 发布对应内核安全更新。如暂无法升级，可在不支持 NVMe over TCP 的系统上通过编辑 /etc/modprobe.d/blacklist-nvme.conf 添加 "blacklist nvme_tcp" 来阻止该模块自动加载，但请注意此缓解措施会使 NVMe over TCP 功能不可用，不适合依赖该存储方案的生产环境。'
score = 9.8
severity = "CRITICAL"
