[basic]
description = "SGI IRIX 6.2 系统中的 libgl.so 动态链接库存在缓冲区溢出漏洞。本地攻击者可通过设置超长的 HOME 环境变量，在调用 gmemusage 或 gr_osview 等程序时触发该漏洞，导致缓冲区溢出，从而获得 root 权限。该漏洞影响 SGI IRIX 6.2 版本，攻击者需要拥有本地系统访问权限，无需身份认证即可利用，危害等级高。"
published = "2000-10-20T04:00:00.000"
remediation = "SGI IRIX 6.2 已停止维护，官方不再提供安全更新。建议立即升级到 SGI 官方发布补丁的 IRIX 6.5 或更高版本；如无法升级，可通过限制本地用户登录、移除 setuid 权限的 gmemusage 和 gr_osview 程序（执行 chmod u-s /usr/sbin/gmemusage /usr/sbin/gr_osview）作为临时缓解措施，或迁移至受支持的现代操作系统。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "SGI IRIX libgl.so 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:52:29.680"

