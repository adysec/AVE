[basic]
description = "cgiCentral WebStore 400/400CS 4.14 的 ws_mail.cgi 脚本中存在任意命令执行漏洞。远程已认证的 WebStore 管理员可通过在 kill 参数中注入 shell 元字符（如分号、管道符等）绕过输入过滤，导致系统执行攻击者指定的任意命令。攻击者利用该漏洞可完全控制目标服务器，获取敏感数据或进行横向移动。该漏洞影响 WebStore 400 及 400CS 版本，CVSS 评分 7.5，危害等级高。目前官方已发布修复建议，建议用户升级至最新版本或对 kill 参数进行严格过滤。"
published = "2001-06-12T04:00:00Z"
remediation = "该漏洞影响已停止维护的 cgiCentral WebStore 400/400CS 4.14，厂商未发布安全补丁。建议立即停用 ws_mail.cgi 脚本或移除该 CGI 文件；将 WebStore 迁移至受支持的替代购物车系统；在 Web 服务器层面限制对 /cgi-bin/ 目录的访问权限，仅允许受信 IP 访问管理后台。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "cgiCentral WebStore 400 任意命令执行漏洞"
updated = "2026-06-16T21:56:05Z"

