[info]
author = "AVE"
description = "检测目标是否使用存在CVE-2017-9248漏洞的Telerik UI for ASP.NET AJAX版本。通过检查Telerik.Web.UI.WebResource.axd路径及响应中的版本号判断是否存在漏洞版本（2007.1423至2017.1.118）。"
id = "POC-AVE-2017-1209"
name = "Progress Telerik UI for ASP.NET AJAX 加密密钥泄露检测"
severity = "critical"
tags = [
    "cve-2017-9248",
    "telerik",
    "encryption-key-disclosure",
]
vuln_id = [
    "CVE-2017-9248",
    "AVE-2017-1209",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/Telerik.Web.UI.WebResource.axd"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Telerik.Web.UI, Version=2007.",
    "Telerik.Web.UI, Version=2008.",
    "Telerik.Web.UI, Version=2009.",
    "Telerik.Web.UI, Version=2010.",
    "Telerik.Web.UI, Version=2011.",
    "Telerik.Web.UI, Version=2012.",
    "Telerik.Web.UI, Version=2013.",
    "Telerik.Web.UI, Version=2014.",
    "Telerik.Web.UI, Version=2015.",
    "Telerik.Web.UI, Version=2016.",
    "Telerik.Web.UI, Version=2017.1",
]
