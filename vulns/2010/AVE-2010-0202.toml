[basic]
description = "PHP 5.3.0至5.3.3版本中的fopen_wrappers.c文件存在安全绕过漏洞，远程攻击者可通过构造特制长度的文件名参数，绕过open_basedir配置限制访问受限文件。该漏洞源于对文件名长度校验不充分，导致攻击者能够读取本应被禁止访问的目录外的文件内容。影响所有使用受影响PHP版本构建的Web应用，攻击者无需身份认证即可利用，CVSS评分5.0，危害等级中危。建议升级至PHP 5.3.4或更高版本修复此漏洞。"
published = "2010-11-09T01:00:02Z"
remediation = "升级 PHP 至 5.3.4 或更高版本，该版本修复了 fopen_wrappers.c 中文件名长度处理不当导致的 open_basedir 绕过问题。如无法立即升级，可在 php.ini 中严格配置 open_basedir 路径白名单，并禁用不必要的文件包装器（如 phar、zip）以降低风险。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "PHP 5.3.x fopen_wrappers 安全绕过漏洞"
updated = "2026-06-16T23:22:46Z"

