[basic]
description = "tags.<value>VMware ESXi 及 Horizon DaaS 设备中使用的 OpenSLP 服务存在堆内存覆写漏洞（CWE-787）。未经身份认证的远程攻击者若能够网络访问目标系统 427 端口（SLP 服务），即可通过发送特制的 SLP 请求触发堆溢出，进而实现远程代码执行。该漏洞影响 VMware ESXi 6.0/6.5/6.7 以及 Horizon DaaS 8.x 等多个版本，CVSS v3 评分为 9.8（严重等级）。攻击者无需交互即可利用此漏洞获取宿主机完全控制权限，目前已发现野外利用。VMware 已发布对应安全补丁（如 ESXi670-201912001）并提供了禁用 SLP 服务的临时缓解措施。"
published = "2019-12-06T16:15:11Z"
remediation = "立即为 VMware ESXi 6.0/6.5/6.7 应用对应补丁：ESXi 6.7 安装补丁 ESXi670-201912001，ESXi 6.5 安装补丁 ESXi650-201912001，ESXi 6.0 安装补丁 ESXi600-201912001；补丁可通过 VMware Patch Portal 下载或通过 vSphere Update Manager 推送安装。如暂时无法打补丁，可通过 SSH 登录 ESXi 主机，依次执行以下命令禁用 SLP 服务作为临时缓解措施：执行 /etc/init.d/slpd stop 停止服务，执行 esxcli network firewall ruleset set -r CIMSLP -e 0 关闭防火墙规则，执行 chkconfig slpd off 禁止服务开机自启。对于 VMware Horizon DaaS 8.x，应升级至 Horizon DaaS 9.0.0.0 或更高版本，升级包可从 VMware 官网下载。所有修复措施实施后需重启相关服务并验证 SLP 端口 427 已关闭。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "VMware ESXi 远程代码执行漏洞"
updated = "2026-06-17T02:37:52Z"

