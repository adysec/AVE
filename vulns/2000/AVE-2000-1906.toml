[basic]
description = "OpenBSD talkd 存在格式化字符串漏洞，远程攻击者可通过向 talkd 服务发送包含格式化字符（如 %n、%s）的恶意用户名，触发格式化字符串漏洞，导致任意代码执行。攻击者无需身份认证即可远程利用，完全控制目标系统。该漏洞影响 OpenBSD 及其他基于 BSD 的操作系统，CVSS 评分 10.0，危害等级严重。"
published = "2000-12-11T05:00:00Z"
remediation = "立即应用 OpenBSD 2.7 errata #026 提供的 talkd 源码补丁（https://ftp.openbsd.org/pub/OpenBSD/patches/2.7/common/026_talkd.patch），或升级至 OpenBSD 2.8 及以上版本。如无法立即打补丁，可临时禁用 talkd 服务：编辑 /etc/inetd.conf，注释掉 talk 行后重启 inetd，或执行 `chmod 0 /usr/libexec/talkd` 移除执行权限。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "OpenBSD talkd 格式化字符串远程代码执行漏洞"
updated = "2026-06-16T21:52:57Z"

