[basic]
description = "tags.<value>多款 Apple 产品（包括 macOS、iOS、iPadOS 及 watchOS 等）存在类型混淆漏洞。该漏洞源于内核对对象类型处理不当，攻击者可通过改进的状态管理机制触发类型混淆，绕过内存安全保护。当用户在受影响的系统上运行恶意应用程序时，该应用可利用此漏洞在内核权限下执行任意代码，从而完全控制设备。该漏洞影响 macOS Big Sur 11.0.1 之前、macOS Catalina 10.15.7 之前、iOS 14.2 及 iPadOS 14.2 之前、watchOS 7.1 之前等多个版本，CVSS 评分 7.8（HIGH）。"
published = "2020-12-08T21:15:13.903"
remediation = '立即将设备升级至以下修复版本：iOS 升级至 14.2 或更高版本（iPhone 6s 及更新机型），或安装 iOS 12.4.9 安全更新（iPhone 5s 等旧机型）；iPadOS 升级至 14.2；macOS 升级至 Big Sur 11.0.1 或更高版本，Catalina 用户安装 10.15.7 Supplemental Update，High Sierra 和 Mojave 用户安装 Security Update 2020-006；watchOS 升级至 7.1（Series 3 及更新机型）或 6.2.9、5.3.9（旧机型）。所有设备建议在"系统设置"→"通用"→"软件更新"中开启自动更新。如无法立即更新，应避免安装来源不明的应用程序，并在防火墙中限制不必要的入站连接作为临时缓解措施。'
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Apple 多款产品 类型混淆漏洞"
updated = "2026-06-17T03:09:53.783"

