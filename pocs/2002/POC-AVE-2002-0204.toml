[info]
author = "AVE"
description = "通过构造包含恶意CSS的网页，利用styleSheet对象的cssText属性读取目标系统上包含{字符的任意文件内容"
id = "POC-AVE-2002-0204"
name = "Microsoft Internet Explorer 5 CSS File Disclosure PoC"
severity = "medium"
tags = ["cve-2002-0191"]
vuln_id = [
    "CVE-2002-0191",
    "AVE-2002-0204",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc-css-disclosure.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["cssText"]
