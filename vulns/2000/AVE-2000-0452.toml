[basic]
description = "Centrinity FirstClass Intranet Server 6.1 之前版本（含 5.770）的邮件服务组件存在拒绝服务漏洞。远程攻击者无需身份认证，只需向目标服务器发送一封包含超长 To 邮件头部的特制邮件，即可触发该漏洞，导致邮件服务进程崩溃或停止响应，造成拒绝服务。攻击者可通过简单的网络连接完成利用，无需任何权限。该漏洞 CVSS 评分 5.0，危害等级中等，已有公开 PoC 利用代码。"
published = "2000-06-27T04:00:00Z"
remediation = "升级 FirstClass Internet Services 服务器至 6.1 或更高版本，该版本已修复对超长 To 邮件头处理不当导致的拒绝服务问题。由于该产品已停止维护，建议迁移至受支持的邮件服务方案，并在网络边界防火墙配置规则限制对 FirstClass 服务端口（默认 80/443）的不可信来源访问作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Centrinity FirstClass Intranet Server 邮件长标头拒绝服务漏洞"
updated = "2026-06-16T21:52:01Z"

