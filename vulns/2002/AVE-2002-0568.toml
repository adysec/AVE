[basic]
description = "XFree86 X11R6 3.3.x 的 XFS 字体服务器（fs.auto）中的 Dispatch() 例程存在缓冲区溢出漏洞。远程攻击者无需身份认证即可通过发送特制的 XFS 查询请求触发该漏洞，导致目标系统上的字体服务进程崩溃（拒绝服务），或进一步利用该漏洞执行任意代码。该漏洞影响 Solaris 2.5.1 至 9 等多个版本，CVSS 评分 7.5，危害等级高。目前已存在公开的利用代码，攻击者可通过 ExploitDB 获取 PoC 实施攻击。"
published = "2002-12-11T05:00:00.000"
remediation = "升级到不受影响的 XFree86 版本或安装 Sun 官方安全补丁（参考 Sun 公告 48879）。对于 Solaris 系统，建议安装 SunSolve 提供的补丁程序。如无法立即升级，可在防火墙层面限制对 XFS 字体服务端口（默认 7100/tcp）的访问，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "XFree86 X11R6 3.3.x - Font Server Remote Buffer Overrun 漏洞"
updated = "2026-06-16T21:59:06.210"

