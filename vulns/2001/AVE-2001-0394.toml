[basic]
description = "MySQL数据库在3.23.31版本之前存在特权提升漏洞，已有MySQL账户的用户可通过执行SHOW GRANTS命令，从mysql.user表中获取加密的管理员密码，随后通过密码破解手段获取更高权限。该漏洞影响MySQL 3.23.31之前的所有版本，攻击条件为攻击者需先拥有MySQL账户登录权限，利用方式为通过SHOW GRANTS命令提取密码哈希并进行破解以提升权限。"
published = "2001-01-19T05:00:00Z"
remediation = "将 MySQL 升级至 3.23.31 或更高版本，该版本已修复 SHOW GRANTS 命令泄露 mysql.user 表中加密管理员密码的问题。同时建议限制普通用户对 mysql.user 表的直接访问权限，移除不必要用户的 SHOW GRANTS 授权，并定期轮换数据库管理员密码以降低密码被破解的风险。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "MySQL 数据库 特权提升漏洞"
updated = "2026-06-16T21:55:56Z"

