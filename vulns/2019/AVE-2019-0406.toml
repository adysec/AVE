[basic]
description = "Microsoft Excel 在处理内存对象时存在远程代码执行漏洞，当软件未能正确验证内存中的对象时，攻击者可利用特制的 Excel 文件触发该漏洞。攻击者需通过社会工程手段诱导用户打开恶意文件，成功利用后可获取与当前用户相同的系统权限，实现任意代码执行。该漏洞影响 Microsoft Office 2010/2013/2016 及 Office 365 等多个版本，CVSS 评分 8.8，危害等级高。Microsoft 已在 2019 年 9 月安全更新中修复此漏洞。"
published = "2019-09-11T22:15:18Z"
remediation = "立即安装 Microsoft 2019 年 9 月安全更新：Excel 2010 安装 KB4475579，Excel 2013 安装 KB4475578，Excel 2016 安装 KB4475577，Office 2019 及 Office 365 ProPlus 通过 Microsoft Update 自动更新至最新版本。Mac 版 Office 2016/2019 通过 AutoUpdate 检查更新。如无法立即打补丁，可配置组策略禁用从不受信任来源打开 Excel 文件，并启用受保护视图和文件阻止功能作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Excel 远程代码执行漏洞"
updated = "2026-06-17T02:28:19Z"

