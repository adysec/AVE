[basic]
description = "Adobe Flash Player 存在内存破坏漏洞，远程攻击者可通过诱使用户访问包含特制 SWF 文件的网页触发内存损坏，导致应用程序崩溃或执行任意代码。该漏洞影响 Flash Player 9.0.289 之前版本及 10.1.102.64 之前版本，攻击无需用户交互以外的额外认证条件，危害严重。Adobe 已发布安全更新修复此漏洞。"
published = "2010-11-08T00:00:00Z"
remediation = "将 Adobe Flash Player 升级至 9.0.289 及以上版本（9.x 系列）或 10.1.102.64 及以上版本（10.x 系列）。Adobe 已于 2010 年 11 月发布安全公告 APSB10-26 修复此漏洞。鉴于 Flash Player 已于 2020 年底停止支持并弃用，建议彻底卸载 Flash Player 并改用 HTML5 技术，同时在浏览器中禁用 Flash 插件加载。"
score = 9.8
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏远程代码执行漏洞"
updated = "2010-11-08T00:00:00Z"

