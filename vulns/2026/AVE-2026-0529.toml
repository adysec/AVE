[basic]
description = "Samsung MagicINFO 9 Server 存在不安全的默认权限配置漏洞（CWE-276），安装目录的访问控制列表（ACL）设置过于宽松，导致低权限本地用户可替换或修改 MagicINFO 安装目录中的应用程序二进制文件。攻击者只需拥有本地低权限账户即可利用该漏洞，通过替换恶意文件触发服务重启或系统调用，实现权限提升至 SYSTEM。该漏洞影响 MagicINFO 9 Server 21.1091.1 以下版本，CVSS 评分 7.8，危害等级高。Samsung 已发布安全更新建议用户升级至 21.1091.1 及以上版本并限制安装目录文件系统权限。"
published = "2026-04-10T02:16:02Z"
remediation = '立即将 Samsung MagicINFO 9 Server 升级至 21.1091.1 或更高版本。同时手动收紧 MagicINFO 安装目录（默认 C:\Program Files\Samsung MagicINFO\）的 NTFS 权限，移除普通用户（Users/Everyone）的写入和修改权限，仅保留 SYSTEM 和管理员完全控制权。如无法立即升级，可通过 Windows 安全策略限制本地非授权用户登录服务器作为临时缓解。'
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Samsung MagicINFO 9 Server 默认权限配置不当本地提权漏洞"
updated = "2026-06-17T10:24:18Z"

