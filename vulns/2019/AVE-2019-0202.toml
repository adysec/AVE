[basic]
description = "Atlassian Jira 在 8.4.0 版本之前的 `/rest/api/latest/groupuserpicker` 接口存在信息泄露漏洞。未经身份认证的远程攻击者可直接访问该 REST API 接口，通过构造特定请求枚举系统用户名列表，造成敏感信息泄露。该漏洞影响所有 Jira 8.4.0 之前版本，攻击者无需凭据即可获取有效用户名，为后续暴力破解或定向攻击提供基础，CVSS v3.1 评分 5.3，危害等级中危。"
published = "2019-09-11T14:15:12Z"
remediation = "将 Jira 升级至 8.4.0 或更高版本以彻底修复该漏洞。如暂时无法升级，可编辑 Jira 安装目录下 atlassian-jira/WEB-INF/urlrewrite.xml 文件，添加一条 URL 重写规则，对未认证用户访问 /rest/api/*/groupuserpicker 端点返回 403 Forbidden，阻止未授权用户枚举用户名，然后重启 Jira 生效。同时建议通过反向代理或防火墙限制对 /rest/api/ 路径的外部访问，减少攻击面。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "Atlassian Jira 敏感信息泄漏漏洞"
updated = "2026-06-17T02:42:01Z"

