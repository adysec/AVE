[basic]
description = "Microsoft IIS 4.0/5.0 Web服务器存在文件片段解析漏洞，攻击者可通过向目标服务器发送包含+.htr参数的HTTP请求，诱使服务器错误地将该参数视为文件扩展名并解析返回内部源代码的HTML片段，导致敏感应用源代码信息泄露。该漏洞影响Windows平台上的广泛Web服务系统，包括企业内部网站、在线门户等关键Web应用。攻击者无需认证即可发起攻击，构造恶意URL利用IIS的正常文件读取机制，将+.htr参数解析为有效的文件路径，逐步揭示Web应用的源代码实现细节，获取应用程序的内部逻辑、技术架构和业务流程等敏感信息，从而为进一步攻击提供重要情报支持，最终可能导致更严重的系统安全事件。Microsoft已于2000年7月发布安全更新修复此漏洞。相关安全通告显示，此漏洞对机密信息的读取存在严重风险，但对数据完整性和可用性影响有限。Microsoft已发布安全更新修复此漏洞。相关安全通告显示，此漏洞对机密信息的读取存在严重风险，但对数据完整性和可用性影响有限。Microsoft已发布安全更新修复此漏洞。相关安全通告显示，此漏洞对机密信息的读取存在严重风险，但对数据完整性和可用性影响有限。"
published = "2000-07-17T04:00:00Z"
remediation = '建议立即升级至 Microsoft IIS 6.0 或更高版本，或安装 Microsoft 安全公告 MS00-058 (KB269862) 提供的补丁。若暂时无法升级，请在 IIS 管理器中禁用 .htr ISAPI 映射：打开 IIS 管理器 -> 网站属性 -> 主目录 -> 配置 -> 应用程序映射，删除 .htr 扩展名的映射条目，或在注册表 HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\W3SVC\Parameters\Script Map 中删除 .htr 映射项，随后重启 IIS 服务生效。作为临时缓解，也可在防火墙层面拦截包含 +.htr 的 URL 请求。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "微软 IIS 4.0/5.0 源码碎片泄露漏洞"
updated = "2026-06-16T21:52:08Z"

