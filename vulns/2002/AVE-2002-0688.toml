[basic]
description = "Belkin F5D6130 无线网络访问点在运行固件版本 AP14G8 时存在拒绝服务漏洞。远程攻击者无需身份认证即可通过向目标设备连续发送多个 SNMP GetNextRequest 请求，耗尽设备资源导致连接断开和服务中断。该漏洞影响所有使用受影响固件版本的 F5D6130 设备，攻击者只需在网络可达的情况下即可发起攻击，无需任何凭据或权限，利用方式简单直接。由于 SNMP 服务通常默认开放，攻击者可使用标准 SNMP 工具批量发送恶意请求，造成设备无法正常响应客户端，严重影响无线网络的可用性。"
published = "2002-12-31T05:00:00Z"
remediation = "Belkin 官方已停止对该设备的支持，未发布修复固件。建议立即在设备管理界面禁用 SNMP 服务以消除攻击面；如业务必需 SNMP，应通过上游交换机或防火墙对设备 IP 的 161/UDP 端口实施严格 ACL，仅允许受信任的网管服务器访问；同时将设备部署于隔离 VLAN 并限制其上行访问范围。对于核心业务场景，建议直接替换为仍在支持周期内的现代无线接入点。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "贝尔金 F5D6130 无线网络接入点 SNMP 请求拒绝服务漏洞"
updated = "2026-06-16T22:00:05Z"

