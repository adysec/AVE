[basic]
description = "OpenSSL 0.9.6 和 0.9.7 版本的 ASN.1 解析代码存在整数溢出漏洞。由于 OpenSSL 在解析客户端证书时对异常 ASN.1 标签值处理不当，远程攻击者可构造包含畸形 ASN.1 标签字段的 SSL 客户端证书，触发 ASN.1 解析过程中的整数溢出，导致 OpenSSL 库崩溃或进入死循环，进而造成拒绝服务。该漏洞影响所有使用受影响版本 OpenSSL 的 SSL/TLS 服务器及相关应用程序，包括 Apache+mod_ssl、stunnel 等。攻击者无需事先认证，只需向目标服务器的 SSL 端口发送特制客户端证书即可触发漏洞。公开的利用工具可通过暴力修改证书数据并循环发送，在数秒内使服务器进程崩溃或异常高CPU占用。OpenSSL 官方已在 0.9.6k 和 0.9.7c 中修复此问题，建议受影响用户升级并重新编译静态链接的应用程序。"
published = "2003-11-17T05:00:00Z"
remediation = "立即升级 OpenSSL 至 0.9.6k 或 0.9.7c 版本，并重新编译所有静态链接 OpenSSL 库的应用程序。如无法立即升级，可在防火墙或反向代理层面过滤携带异常 ASN.1 标签值的 SSL 客户端证书请求，并临时禁用不必要的客户端证书验证功能作为缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "OpenSSL 0.9.6/0.9.7 ASN.1标签值整数溢出拒绝服务漏洞"
updated = "2026-06-16T22:02:24Z"

