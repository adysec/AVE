[basic]
description = "Docker Desktop for Windows 扩展管理器（extension-manager）存在暴露危险函数漏洞，属于本地权限提升类漏洞。攻击者需先获得在容器内执行高权限代码的能力，随后利用 Docker Extensions 功能实现中暴露的危险函数，实现权限提升并在当前用户上下文执行任意代码。该漏洞影响 Docker Desktop for Windows 产品，CVSS 评分 5.0（中危），攻击向量为本地、攻击复杂度低、需高权限、无需用户交互、范围改变、机密性/完整性/可用性影响均为高。ZDI 于 2025 年 5 月 28 日向厂商报告，因厂商认为利用前提超出威胁模型而拒绝修复，最终于 2026 年 4 月 15 日作为 0-day 公开披露。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
