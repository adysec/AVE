[basic]
description = "Windows 更新通知管理器（Update Notification Manager）在处理文件时存在权限提升漏洞，源于其对文件路径的解析验证不充分，攻击者可通过符号链接（symlink）劫持等方式操纵文件操作。该漏洞允许已获得目标系统低权限执行环境的本地攻击者将权限提升至 SYSTEM 级别，从而实现完全控制受感染系统。此漏洞影响 Windows 10/11 及 Windows Server 2019/2022 等多个版本，CVSS 评分 7.8，属于高危等级。攻击者需先在目标系统上获得用户级代码执行权限方可利用。"
published = "2020-01-14T23:15:32Z"
remediation = '建议立即安装 Microsoft 2020 年 1 月安全更新 (KB4534273 for Windows 10 1909/1903, KB4534271 for Windows Server 2019/2016, KB4534310 for Windows 8.1/Server 2012 R2)，或通过 Windows Update 自动更新。如无法立即打补丁，可通过组策略禁用 "Windows Update Notification Manager" 服务 (wuauserv 相关触发器) 作为临时缓解措施，并限制本地低权限用户的文件写入权限。'
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "微软 Windows 更新通知管理器特权提升漏洞"
updated = "2026-06-17T02:46:13Z"

