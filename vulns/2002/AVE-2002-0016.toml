[basic]
description = "glibc 2.2.5 及早期版本中移植的 BIND 4.9.8 DNS 解析器函数（如 getnetbyname、getnetbyaddr）存在缓冲区溢出漏洞。远程恶意 DNS 服务器可通过构造恶意 DNS 响应，触发这些函数中的子例程缓冲区溢出，实现远程任意代码执行。该漏洞影响使用受影响 glibc 版本的 Linux 系统及 BIND 4.9.8，攻击者需控制或欺骗受害者查询的 DNS 服务器，通过恶意网络名称/地址查询响应触发溢出，CVSS 7.5 分（高危），影响机密性、完整性和可用性。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 glibc 到 2.2.6 或以上版本，并升级 BIND 到 8.x 或 9.x 系列。具体修复措施包括：应用 glibc 的安全补丁以修复 DNS 解析器缓冲区溢出漏洞，更新 BIND 配置文件以正确验证 DNS 响应，禁用对不可信 DNS 服务器的递归查询，对于遗留系统请考虑使用 hardening 技术如文本化缓冲区处理和地址随机化作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "GNU glibc DNS解析器缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:57:56Z"

