[basic]
description = "mongo-express 0.54.0 之前版本中存在远程代码执行漏洞，漏洞位于 lib/bson.js 的 toBSON() 函数中，/checkValid 路由从外部接收输入并调用该函数，由于对 vm 依赖的不安全使用，攻击者可通过构造恶意 document 参数执行任意 Node.js 代码。攻击者需拥有有效凭据（默认账号密码 admin:pass）或已通过身份认证，在成功登录后即可利用该漏洞在目标服务器上执行任意命令，完全控制受影响系统。该漏洞影响 mongo-express 所有低于 0.54.0 的版本，CVSS 评分 9.9，危害等级严重。"
published = "2019-12-24T22:15:11Z"
remediation = "立即将 mongo-express 升级至 0.54.0 或更高版本：通过 npm 执行 `npm install mongo-express@0.54.0`，或在 package.json 中将依赖版本更新为 ^0.54.0 后执行 `npm update mongo-express`，然后重启服务使其生效；0.54.0 版本修复了 toBSON 方法在非安全环境下执行 exec 命令的问题。如无法立即升级，可采取以下缓解措施：1) 修改默认账号密码 admin:pass，通过环境变量 ME_CONFIG_BASICAUTH_USERNAME/ME_CONFIG_BASICAUTH_PASSWORD 配置强身份认证；2) 将服务仅绑定至内网或可信网段，禁止将 8081 管理端口暴露于公网；3) 在防火墙或安全组中限制仅允许可信来源 IP 访问该端口。该漏洞已列入 CISA KEV 目录，存在在野利用，应优先尽快修复。"
score = 9.9
severity = "CRITICAL"
sources = ["nuclei"]
title = "mongo-express 远程代码执行漏洞"
updated = "2026-06-17T02:11:36Z"

