[basic]
description = "tags.<value>iPlanet Web Server Enterprise Edition 4.1及更早版本存在信息泄露及拒绝服务漏洞。未经身份认证的远程攻击者可通过向目标服务器发送包含URL编码Host头的HTTP请求，触发服务器在Location响应头中泄露内存分配池内的敏感数据，或导致服务器崩溃拒绝服务。该漏洞影响所有部署受影响版本iPlanet Web Server的系统，攻击者无需任何凭据即可远程利用。Sun Microsystems已在后续版本中修复此安全问题，建议用户升级至更新版本。"
published = "2001-07-02T04:00:00Z"
remediation = "建议将 iPlanet Web Server Enterprise Edition 升级至 4.1 SP7 或更高版本，该补丁已发布在 iPlanet 官方网站并附有实施说明。如无法立即升级，可部署 iPlanet 提供的 NSAPI 模块以屏蔽该漏洞。作为临时缓解措施，可在防火墙或反向代理层面过滤包含超长 URL 编码 Host 头的 HTTP 请求，或部署入侵检测系统监控并阻断此类恶意请求。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "iPlanet Web Server 信息泄露漏洞"
updated = "2026-06-16T21:54:06Z"

