[basic]
description = "veraPDF PDF 解析器的 CMap 解析器复用 PostScript 解释器，在处理 PDF 中 Type 0 字体的 /Encoding 或 /ToUnicode CMap 流时，未对 PostScript 的 array 分配操作和 for 循环增量进行限制。远程攻击者可通过提交特制 PDF 文件，触发 Integer.MAX_VALUE 大小的数组分配（约 16GB 内存）或零增量无限循环，导致验证器内存耗尽或 CPU 100% 占用，造成拒绝服务。该漏洞影响 veraPDF-parser 1.30.2 及 1.31.23 之前的所有版本，攻击无需身份认证，仅需目标解析恶意 PDF 即可触发。"
published = "2026-07-29T16:17:53Z"
remediation = "升级 veraPDF-parser 至 1.30.2 或 1.31.23 及以上版本，该版本已限制 CMap 解析器中 array 分配上限并禁止 for 循环零增量。如无法立即升级，可在 PDF 处理入口处拦截包含 PostScript 运算符的 CMap 流，或限制验证任务的 CPU 时间和内存配额作为临时缓解措施。"
score = 6.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "veraPDF veraPDF-parser PostScript CMap 流拒绝服务漏洞"
updated = "2026-07-30T19:23:14Z"

