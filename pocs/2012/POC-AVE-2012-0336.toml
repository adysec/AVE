[info]
author = "ave"
description = "验证Apple iTunes WebKit内存破坏漏洞，远程攻击者可通过构造恶意网页触发内存损坏，导致任意代码执行或拒绝服务"
id = "POC-AVE-2012-0336"
name = "CVE-2012-3659 PoC"
severity = "medium"
tags = ["ave-2012-0336"]
vuln_id = [
    "CVE-2012-3659",
    "AVE-2012-0336",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["WebKit"]
