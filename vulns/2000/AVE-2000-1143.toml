[basic]
description = "Check Point Firewall-1 防火墙存在拒绝服务漏洞。远程攻击者无需身份认证，通过向目标系统的 264 端口发送大量数据包洪泛攻击，可耗尽防火墙 CPU 资源，导致防火墙性能严重下降甚至服务停止响应，影响网络访问控制和流量监控功能。该漏洞利用条件简单，仅需网络可达且无需授权，攻击成本极低，危及部署在关键网络边界的 Firewall-1 系统及其所保护的所有内网资产。用户应升级至存在安全补丁的版本或通过访问控制策略限制对 264 端口的访问。"
published = "2001-08-31T04:00:00Z"
remediation = "建议立即升级 Check Point FireWall-1 至 4.1 SP2 或更高版本（官方已发布修复程序），并在防火墙规则中对 264 端口实施速率限制 (rate-limit)，限制单一源 IP 对该端口的连接速率不超过 10 个包/秒，同时在上游路由器/交换机层面启用 ACL 过滤非授权访问者流向 264 端口的通信流量，必要时关闭 FW1 的连接测试服务以减轻 DoS 攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Check Point Firewall-1 拒绝服务漏洞"
updated = "2026-06-16T21:53:22Z"

