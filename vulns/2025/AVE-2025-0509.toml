[basic]
description = "Google Chrome 的 V8 JavaScript 引擎存在不恰当实现漏洞，远程攻击者可通过构造特制的 HTML 页面触发该漏洞，实现任意内存读写操作。攻击者无需身份认证，仅需诱导用户访问恶意网页即可完成利用，可导致敏感信息泄露、数据篡改或进一步代码执行。该漏洞影响 Google Chrome 142.0.7444.59 之前版本及基于 Chromium 的 Microsoft Edge 等浏览器，CVSS 评分 8.8，危害等级高。Google 已在 142.0.7444.59 版本中修复此漏洞。"
published = "2025-11-10T20:15:36Z"
remediation = "立即升级 Google Chrome 至 142.0.7444.59 及以上版本，Microsoft Edge 升级至 142.0.3595.53 及以上版本，Fedora 用户执行 `dnf update` 更新至 142.0.7444.162。无法立即升级时，可禁用 V8 JIT 编译或限制用户访问不可信 HTML 页面作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 引擎实现不当漏洞"
updated = "2026-06-17T08:32:21Z"

