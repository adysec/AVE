[basic]
description = "Sun Solaris 8 系统的 LDAP 命名服务库（libsldap）存在缓冲区溢出漏洞。本地攻击者可通过向使用 libsldap 的特权程序传递超长的 LDAP_OPTIONS 环境变量触发栈缓冲区溢出，从而以该程序权限执行任意代码。该漏洞影响 Solaris 8 系统，CVSS 评分 7.2，危害等级高。攻击者需拥有本地系统访问权限，无需身份认证即可利用，成功利用后可完全控制受影响的系统。"
published = "2001-12-31T05:00:00Z"
remediation = "安装 Sun 针对 Solaris 8 libsldap 缓冲区溢出漏洞的官方补丁：SPARC 平台安装补丁 108993-xx 或更高版本，x86 平台安装补丁 108994-xx 或更高版本。如无法立即打补丁，可临时移除受影响 setuid 程序的 setuid 位（chmod 755 /usr/bin/passwd /usr/bin/nispasswd /usr/bin/yppasswd /usr/bin/chkey），或将 /usr/lib/libsldap.so.1 替换为哑元库以禁用 LDAP 功能作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Sun Solaris 8 libsldap 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:56:33Z"

