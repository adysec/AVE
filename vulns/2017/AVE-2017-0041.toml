[basic]
description = "trixbox 2.8.0.4（一款开源的 VoIP PBX 电话系统）的 `/maint/modules/home/index.php` 页面中，`lang` 参数未对用户输入进行有效过滤，直接拼接至操作系统命令执行，存在 OS 命令注入漏洞（CWE-78）。已认证的远程攻击者可通过在 `lang` 参数中注入 shell 元字符（如分号、管道符等）执行任意系统命令，进而完全控制目标服务器。该漏洞 CVSS 评分 8.8，危害等级高，攻击复杂度低，无需用户交互，成功利用可导致敏感信息泄露、系统被篡改或沦为僵尸网络节点。公开的 ExploitDB 条目（ID 49913）及多个 GitHub PoC 已证实该漏洞可被未认证方式触发，风险极高。"
published = "2018-02-16T04:29:00Z"
remediation = "trixbox 2.8.0.4 已停止维护，官方不再发布安全更新。建议立即迁移至 FreePBX 或 3CX 等活跃维护的 PBX 系统。临时缓解措施：在 Web 服务器（Apache/Nginx）层面配置 WAF 规则，过滤 /maint/modules/home/index.php 的 lang 参数中的 shell 元字符（; | & ` $ 等）；限制 /maint/ 目录仅允许内网 IP 访问；移除或禁用未使用的 maint 管理模块。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "Trixbox 2.8.0.4 操作系统命令注入漏洞"
updated = "2026-06-17T01:06:20Z"

