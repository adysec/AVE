[basic]
description = "OpenSSH 1.2 版本中的 scp 组件存在目录遍历漏洞。当客户端使用 scp 命令从恶意的远程 scp 服务器下载文件时，攻击者可在返回的文件名中注入 ..（点点）序列，绕过路径检查，导致客户端将文件写入任意目录或覆盖任意文件。攻击者无需身份认证即可远程触发，危害等级中等。该漏洞影响 OpenSSH 1.2.x 系列版本，用户应升级至更新版本以修复此问题。"
published = "2000-12-19T05:00:00Z"
remediation = "升级 OpenSSH 至 2.1.0 或更高版本（1.2.3 及以上版本已修复 scp 路径遍历漏洞），该漏洞允许恶意 scp 服务器通过 `..` 目录遍历覆盖客户端任意文件。如无法立即升级，应避免使用不可信 scp 服务器，并在客户端侧对 scp 传输的文件路径进行合法性校验，拒绝包含 `..` 的路径。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "OpenSSH scp 目录遍历漏洞"
updated = "2026-06-16T21:52:55Z"

