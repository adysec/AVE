[basic]
description = "SAP NetWeaver 7.4 中的 SAP Manufacturing Integration and Intelligence (xMII) 组件 15.0 版本存在目录遍历漏洞。该漏洞源于 GetFileList 函数对用户传入的 Path 参数缺乏充分的过滤验证，未经身份认证的远程攻击者可通过向 /Catalog 接口发送包含 ..（点点）序列的特制 HTTP 请求，利用路径遍历技术突破目录限制，实现读取服务器上任意文件，包括敏感配置文件、系统文件等。该漏洞 CVSS 评分 7.5，危害等级高，攻击复杂度低，无需用户交互，且攻击者可直接通过网络远程利用，无需任何权限。SAP 已在安全公告 2230978 中发布修复补丁。"
published = "2016-02-16T15:59:03Z"
remediation = "立即应用 SAP Security Note 2230978 提供的补丁，将 SAP xMII 组件升级至 15.0 的修复版本。如无法立即打补丁，在反向代理或 Web 应用防火墙（WAF）层面添加规则，对 /Catalog 接口的 Path 参数进行过滤，拦截包含 `..` 或 `%2e%2e` 等目录遍历序列的请求，并限制 Path 参数仅允许访问白名单目录。同时建议禁用不必要的 /Catalog 接口对外暴露。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "SAP xMII 任意文件读取漏洞"
updated = "2026-06-17T00:43:57Z"

