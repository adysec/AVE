[basic]
description = "mgetty 1.1.29 之前版本中的 faxspool 组件将传出传真使用的缓冲目录权限设置为全局可写，本地攻击者可利用该目录篡改其他用户的传真传输任务，导致传真内容被拦截、伪造或拒绝服务。攻击者只需拥有本地系统访问权限即可利用，无需身份认证，攻击复杂度低。该漏洞影响 mgetty 全系列低于 1.1.29 的版本。"
published = "2003-01-17T05:00:00Z"
remediation = "升级 mgetty 至 1.1.29 或更高版本，该版本将传出传真假脱机目录权限修正为仅允许授权用户写入。如无法立即升级，可手动执行 `chmod 755 /var/spool/fax` 限制目录权限，并确保 faxspool 以非 root 的专用系统用户运行，降低本地提权风险。Red Hat 用户可安装 RHSA-2003-008 或 RHSA-2003-036 提供的更新包。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "mgetty faxspool 传真缓冲目录全局可写权限漏洞"
updated = "2026-06-16T21:59:14Z"

