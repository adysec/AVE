[basic]
description = "DedeCMS 5.7 版本存在路径信息泄露漏洞，远程攻击者无需身份认证即可通过直接访问 `include/downmix.inc.php` 或 `inc/inc_archives_functions.php` 等文件，触发 PHP 错误信息回显，从而获取服务器网站绝对路径等敏感信息。该漏洞利用条件极低，攻击者仅需发送 HTTP 请求即可完成探测，危害等级高，可能导致后续更深层次的攻击。"
published = "2018-02-13T21:29:00.267"
remediation = '建议立即停止使用已停止维护的 DedeCMS 5.7，迁移至其他受支持的 CMS 系统。如无法迁移，可采取以下缓解措施：1) 在 Nginx 中添加 `location ~ ^/(include|inc)/ { deny all; }` 或在 Apache 中添加 `<DirectoryMatch "^/(include|inc)"> Order Deny,Allow Deny from all </DirectoryMatch>` 禁止直接访问这两个目录下的 PHP 文件；2) 在 php.ini 中设置 `display_errors = Off` 和 `error_reporting = E_ALL & ~E_NOTICE & ~E_WARNING`，防止 PHP 错误信息泄露服务器路径；3) 将 `include/` 和 `inc/` 目录移出 Web 根目录，仅通过入口文件间接引用内部资源。'
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "DedeCMS 5.7 路径信息泄露漏洞"
updated = "2026-06-17T02:02:26.697"

