[basic]
description = "DriveLock Web 服务在处理用户提交的路径参数时未进行充分的路径遍历验证，导致攻击者可通过构造恶意路径请求访问受限文件。该漏洞存在于默认监听 TCP 4568 端口的服务中，无需身份认证即可远程利用。攻击者利用此漏洞可获取服务账户上下文中的敏感信息，影响 DriveLock 产品的机密性。CVSS 评分为 7.5（高危），CWE 编号为 CWE-22（路径遍历）。"
published = "2026-07-29T20:17:05.653"
remediation = '立即将 DriveLock 升级至 25.2.4 或更高版本，该版本已修复目录遍历漏洞。若无法立即升级，可在 Web 服务前端部署 WAF 规则，拦截包含 ".." 路径遍历序列的请求，作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["zdi"]
title = "DriveLock 目录遍历信息泄露漏洞"
updated = "2026-07-30T14:18:46.477"

