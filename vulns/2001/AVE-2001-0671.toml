[basic]
description = "News Desk 1.2 的 `newsdesk.cgi` 脚本存在输入验证缺陷，未对用户提交的参数进行充分的 shell 元字符过滤。未经身份认证的远程攻击者可通过在 HTTP 请求中注入管道符、分号或反引号等 shell 元字符，构造包含任意读取命令的恶意请求。该漏洞影响所有对外暴露该 CGI 脚本的 Web 服务器部署实例，攻击者无需任何账号凭据即可发起利用。通过结合错误信息回显或响应输出，攻击者可成功读取服务器上的任意敏感文件，导致机密信息泄露。"
published = "2001-03-26T05:00:00Z"
remediation = "立即升级 News Desk 至更高版本或替换为受支持的内容管理系统；如无法升级，应彻底删除或禁用 newsdesk.cgi 脚本，并在 Web 服务器配置中拒绝对该 CGI 脚本的所有外部访问。同时检查 Web 服务器运行用户权限，限制其只能访问必要目录，避免敏感系统文件（如 /etc/passwd）被读取。建议在防火墙或反向代理层拦截包含 ../ 和 shell 元字符的请求，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "News Desk 1.2 任意文件读取漏洞"
updated = "2026-06-16T21:53:55Z"

