[basic]
description = "Microsoft IIS 5.0 和 Exchange 2000 在处理特制 URL 时存在内存分配缺陷，远程攻击者无需身份认证即可通过反复发送一系列精心构造的 URL 请求触发该漏洞，导致服务器内存耗尽，造成拒绝服务。该漏洞影响 IIS 5.0 及 Exchange 2000 等版本，攻击者只需能够向目标服务器发送 HTTP 请求即可利用，攻击复杂度低，但仅影响系统可用性。"
published = "2001-06-02T04:00:00.000"
remediation = "安装 Microsoft 安全公告 MS01-026 对应补丁（Q300466），或升级 IIS 5.0 至 Service Pack 2 以上版本。对于已停止支持的 Windows 2000/Exchange 2000 系统，建议迁移至受支持的 Windows Server 版本并部署最新安全更新；同时可在 IIS 中启用 URLScan 工具过滤畸形请求作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft IIS 5.0 和 Exchange 2000 URL 内存拒绝服务漏洞"
updated = "2026-06-16T21:53:45.570"

