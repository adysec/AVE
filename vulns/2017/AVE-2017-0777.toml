[basic]
description = "Intel AMT/ISM/SBT 版本 11.6 及之前版本存在访问控制漏洞，未经身份认证的远程网络攻击者可绕过认证机制直接获取已配置 Intel 管理 SKU 的系统最高权限；本地未授权攻击者亦可通过配置管理功能获取网络或本地系统权限。该漏洞影响 Intel Active Management Technology (AMT)、Intel Standard Manageability (ISM) 及 Intel Small Business Technology (SBT)，CVSS 3.1 评分 9.8（严重级别），攻击向量为网络、攻击复杂度低、无需权限、无需用户交互，可导致机密性、完整性、可用性全部高度受损。攻击者可通过网络直接访问 AMT/ISM 管理接口绕过认证实现远程代码执行或权限提升。"
published = "2017-05-02T14:59:00.520"
remediation = "建议立即升级 Intel AMT/ISM/SBT 固件至 11.7 或更高版本（参考 Intel SA-00075 安全公告）。若无法立即升级固件，请在 BIOS 中彻底禁用 Intel AMT/ME 功能，并在防火墙层面封锁 TCP 16992-16993 端口（AMT Web 管理端口）作为临时缓解措施。同时建议在企业防火墙层面封锁来自非信任网段对管理端口的访问。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Intel AMT/ISM/SBT 访问控制漏洞"
updated = "2026-06-17T01:21:02.563"

