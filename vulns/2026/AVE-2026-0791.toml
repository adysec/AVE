[basic]
description = "OnionShare 是一款基于 Tor 网络的安全匿名文件共享工具，其 2.6.3 及之前版本存在授权验证绕过漏洞。当接收方将服务配置为仅文本消息模式（启用 --disable-files 参数）时，远程攻击者仍可通过构造包含 file[] 字段的 multipart 表单请求绕过限制，将任意文件写入服务端接收目录。漏洞根源在于 ReceiveModeRequest._get_file_stream() 方法在底层流处理阶段未检查 disable_files 设置，导致文件在路由层跳过处理前已被写入磁盘。攻击者需知晓 OnionShare 服务地址，利用难度较低，可导致非预期文件写入和磁盘空间消耗，影响服务可用性。该漏洞 CVSS 评分 5.4，已在 2.6.4 版本中修复。"
published = "2026-07-31T17:16:33Z"
remediation = "立即将 OnionShare 升级至 2.6.4 或更高版本（https://github.com/onionshare/onionshare/releases/tag/v2.6.4），该版本在 ReceiveModeRequest._get_file_stream() 中增加了 disable_files 前置检查，阻止文件流写入磁盘。如无法升级，可在反向代理层（如 Nginx）添加规则拦截含 file[] 字段的 multipart POST 请求到 /upload 和 /upload-ajax 路径，作为临时缓解措施。"
score = 5.4
severity = "MEDIUM"
sources = ["ghsa"]
title = "OnionShare OnionShare 文件上传限制绕过漏洞"
updated = "2026-08-01T00:17:16Z"

