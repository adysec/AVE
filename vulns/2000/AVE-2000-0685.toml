[basic]
description = "Samba 2.0.7 中的 SWAT（Samba Web 管理工具）在处理用户登录时存在日志记录缺陷，当攻击者使用正确的用户名但错误的密码进行登录尝试时，SWAT 不会记录此类失败登录事件。远程攻击者可利用此缺陷对系统进行无痕的暴力密码猜测攻击，通过绕过日志监控持续尝试破解用户密码，从而获取未授权访问权限。该漏洞影响 Samba 2.0.7 版本，攻击者无需身份认证即可通过网络远程利用，显著增加了系统被入侵的风险。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 Samba 至 2.0.8 或更高版本。若无法立即升级，在 smb.conf 中设置 `syslog = 3` 和 `syslog only = no` 启用详细日志，并通过 iptables 限制 SWAT（TCP 901 端口）仅允许受信 IP 访问。同时部署 Fail2ban 监控 SWAT 日志以阻断暴力破解。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Samba SWAT 登录失败日志缺失致密码暴力破解漏洞"
updated = "2026-06-16T21:52:48.497"

