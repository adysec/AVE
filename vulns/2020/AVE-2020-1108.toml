[basic]
description = "Oracle WebLogic Server 的 WLS 核心组件中存在 IIOP 协议反序列化漏洞，未经身份认证的远程攻击者可通过 IIOP 协议向目标服务器发送特制的序列化数据触发反序列化操作，导致远程代码执行。该漏洞影响 WebLogic Server 10.3.6.0.0、12.1.3.0.0、12.2.1.3.0 及 12.2.1.4.0 版本，CVSS 评分 9.8，危害等级严重。攻击无需任何权限和用户交互，仅需网络访问即可完全接管目标服务器。Oracle 已在 2020 年 1 月关键补丁更新中修复此漏洞。"
published = "2020-01-15T17:15:17.190"
remediation = "立即登录 My Oracle Support 下载并安装 Oracle 2020 年 1 月关键补丁更新（Critical Patch Update）中针对 WebLogic Server 的安全补丁。受影响版本包括 10.3.6.0.0、12.1.3.0.0、12.2.1.3.0 和 12.2.1.4.0。如无法立即打补丁，可在 WebLogic 管理控制台中禁用 IIOP 协议（将 weblogic.iiop.enabled 设为 false），或在网络防火墙层面阻止对 IIOP 默认端口（7001）的入站访问作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Oracle WebLogic Server IIOP协议反序列化远程代码执行漏洞"
updated = "2026-06-17T03:12:20.303"

