[basic]
description = 'WordPress 99 Robots WP Background Takeover Advertisements 插件 4.1.5 之前版本的 exports/download.php 存在目录遍历漏洞，攻击者可通过 filename 参数传入 ".." 序列绕过路径限制，读取服务器任意文件。该漏洞无需身份认证即可远程利用，影响所有安装该插件的 WordPress 站点，CVSS 评分 7.5（高危），可导致敏感文件泄露如配置文件、数据库凭证等。'
published = "2018-04-12T15:29:00.600"
remediation = '立即将 WordPress 插件 "99 Robots WP Background Takeover Advertisements" 升级至 4.1.5 或更高版本。如无法立即升级，可临时禁用该插件，或在 Web 服务器层面配置规则拦截包含 `../` 路径遍历特征的请求。'
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "99 Robots WordPress WP Background Takeover Advertisements 插件目录遍历漏洞"
