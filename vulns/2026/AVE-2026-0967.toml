[basic]
description = "OliveTin 的 OAuth2 登录处理器在 `/oauth/login` 请求时将每次登录状态存储到内存中的 `registeredStates` 映射中，该映射无限制增长且从未设置过期时间、删除机制或大小上限。未经身份认证的远程攻击者可向目标 OliveTin 实例发送大量 `/oauth/login` 请求，持续创建新的状态条目，导致服务器内存被逐渐耗尽，最终引发拒绝服务。该漏洞影响所有启用了 OAuth2 的 OliveTin 版本（3000.0.0 至 3000.17.0 之前），与 CVE-2026-28789（并发 map 写入崩溃）不同，即使应用了互斥锁修复后该内存耗尽问题仍然存在，需重启服务才能恢复。"
published = "2026-07-29T21:17:47Z"
remediation = "立即升级 OliveTin 至 3000.17.0 或以上版本（https://github.com/OliveTin/OliveTin/releases/tag/3000.17.0），该版本已修复 OAuth2 状态表无限制增长问题。如无法立即升级，可临时禁用 OAuth2 认证方式，改用本地认证或 IP 白名单限制 /oauth/login 端点的外部访问。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "OliveTin OAuth2 状态内存耗尽拒绝服务漏洞"
updated = "2026-07-30T19:21:23Z"

