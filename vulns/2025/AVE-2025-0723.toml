[basic]
description = "Visual Studio Code 存在安全功能绕过漏洞（CWE-552），由于对文件或目录的访问控制不当，导致外部方可访问本应受保护的文件。本地攻击者可利用该漏洞，在无需特权的情况下通过诱导用户执行特定操作，绕过 VS Code 的安全机制，从而越权读取敏感文件内容（机密性影响为高），并可能对部分文件进行篡改（完整性影响为低）。该漏洞影响 Visual Studio Code 多个版本，攻击复杂度低，需用户交互配合。Microsoft 已在 2025 年 5 月安全更新中修复此漏洞。"
published = "2025-05-13T17:15:51Z"
remediation = '立即将 Visual Studio Code 升级至 1.100.1 或更高版本，并将 Copilot Chat 扩展升级至 0.27.2 或更高版本。可在 VS Code 菜单栏选择"帮助"→"检查更新"自动安装，或从 code.visualstudio.com 下载最新版覆盖安装。临时缓解措施：限制本地非授权用户对 VS Code 工作区目录的读取权限。'
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Visual Studio Code 安全功能绕过漏洞"
updated = "2026-06-17T08:42:56Z"

