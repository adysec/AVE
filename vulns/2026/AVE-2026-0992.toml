[basic]
description = "Micronaut 框架基于 Netty 的 HTTP 客户端未对 HTTP 重定向次数设置上限，攻击者可构造恶意服务器返回无限重定向响应，导致客户端陷入无限循环，最终引发拒绝服务（DoS）。该漏洞影响 Micronaut 3.x 系列（低于 3.10.7）、4.x 系列（低于 4.10.24）及 5.x 系列（低于 5.0.1）版本，攻击者无需认证即可远程触发，危害较大。"
published = "2026-01-01T00:00:00Z"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Micronaut HTTP Client 重定向循环拒绝服务漏洞"
