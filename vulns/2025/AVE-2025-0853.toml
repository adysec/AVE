[basic]
description = "Windows Storage 组件存在权限提升漏洞（CWE-59 链接跟随），具有低权限的本地攻击者可通过创建恶意符号链接并诱导系统服务访问，利用 Windows Storage 对文件路径解析不正确的缺陷，以更高权限写入或删除受保护文件系统中的文件，导致系统完整性受损或服务不可用。该漏洞影响 Windows 10/11 及 Windows Server 各版本，CVSS 评分 7.1，危害等级高。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞，且 CISA KEV 已确认该漏洞被积极利用。"
published = "2025-02-11T18:15:37Z"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新 KB5051974，该补丁修复了 Windows Storage 中的符号链接跟踪漏洞。可通过 Windows Update 自动更新或从 Microsoft 更新目录手动下载安装。由于该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），且存在在野利用，建议在 2025 年 3 月 4 日前完成修补。如无法立即打补丁，可限制低权限用户对存储卷的写入权限作为临时缓解措施。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Storage 权限提升漏洞"
updated = "2026-06-17T08:43:15Z"

