[basic]
description = 'Check Point VPN-1/FireWall-1 4.1 及更早版本存在安全绕过漏洞。远程攻击者可通过发送分片 TCP 连接请求或重新打开已关闭的 TCP 连接请求，绕过防火墙的方向性检查机制（即"单向连接强制绕过"），从而非法穿透防火墙规则。该漏洞无需身份认证即可远程利用，可能导致攻击者绕过访问控制策略，对目标网络进行未授权访问。'
published = "2000-11-14T05:00:00.000"
remediation = "升级 Check Point VPN-1/FireWall-1 至 4.1 SP1 及以上版本，该版本修复了 TCP 分片连接请求绕过方向性检查的问题。如无法升级，建议在防火墙上配置 TCP 分段重组规则，并启用严格的状态检测模式以阻止异常连接请求。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Check Point VPN-1/FireWall-1 安全绕过漏洞"
updated = "2026-06-16T21:52:30.933"

