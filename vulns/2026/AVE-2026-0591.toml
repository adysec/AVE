[basic]
description = "Coder 远程开发环境平台存在权限提升漏洞（CVE-2026-55077）。漏洞存在于 `PUT /api/v2/users/{user}/password` 端点，该端点仅授权 `ActionUpdatePersonal` 权限，未阻止 `user-admin` 角色重置 `owner` 账户密码，且管理员重置他人密码时无需验证当前密码。攻击者需拥有 `user-admin` 权限，可利用此漏洞重置任意 `owner` 账户密码，进而以所有者身份登录并完全控制部署环境，包括模板、工作区、许可证、组织设置及自行提升为 `owner` 角色，实现从 `user-admin` 到 `owner` 的权限提升。影响 Coder 2.29.7、2.32.7、2.33.8、2.34.2 之前的所有版本，CVSS 3.1 评分 7.2（HIGH），攻击向量网络、低复杂度、高权限、无需用户交互、机密性/完整性/可用性均高影响。官方已在 v2.29.17、v2.32.7、v2.33.8、v2.34.2 修复，建议升级至修复版本或限制 `user-admin` 角色仅授予可信管理员。CVE 编号：CVE-2026-55077，CWE-285（不当授权）。"
published = "2026-07-07T23:16:55Z"
remediation = "建议立即升级 Coder 到对应受支持版本：2.34 系列升级至 v2.34.2，2.33 系列升级至 v2.33.8，2.32 系列升级至 v2.32.7，2.29 ESR 系列升级至 v2.29.17。升级前可暂时将 user-admin 角色限制为仅受信任管理员分配，防止低权限管理员越权重置 owner 账户密码。升级后该漏洞将被修复，非 owner 用户无法再重置 owner 角色账户的密码。"
score = 7.2
severity = "HIGH"
sources = ["ghsa"]
title = "Coder Coder 身份验证绕过漏洞"
updated = "2026-07-09T16:16:44Z"

