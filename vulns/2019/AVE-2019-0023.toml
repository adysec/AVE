[basic]
description = "Apple WebKit 存在内存损坏漏洞，当用户使用受影响版本的 Safari 浏览器或其他基于 WebKit 的应用程序处理恶意构造的网页内容时，攻击者可利用该漏洞触发内存损坏，导致任意代码执行。该漏洞影响 iOS、iPadOS、macOS 等使用 WebKit 引擎的 Apple 操作系统及应用程序。攻击需要用户交互（如点击恶意链接），但无需身份认证，CVSS 评分 8.8，危害等级高。Apple 已在 2019 年 8 月安全更新中修复此漏洞。"
published = "2023-03-06T23:15:10.287"
remediation = "升级 Apple Safari 至 13.0 及以上版本，或升级 iOS 至 12.4 及以上版本，或升级 tvOS 至 12.4 及以上版本，或升级 watchOS 至 5.3 及以上版本。Apple 已通过改进内存处理修复了 WebKit 中的多个内存损坏问题。如无法立即升级，可禁用 JavaScript 作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Apple WebKit 内存损坏远程代码执行漏洞"
updated = "2026-06-17T02:42:26.303"

