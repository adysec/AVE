[basic]
description = "t1lib 库的 AFM 字体解析器（parseAFM 函数）中存在基于堆的缓冲区溢出漏洞。当 Evince 文档查看器（2.32 及更早版本）、teTeX 3.0 或 t1lib 5.1.2 处理特制 DVI 文件中的恶意 AFM 字体时，由于对写入堆分配内存缓冲区的数据缺乏充分的边界检查，攻击者可通过构造包含畸形 AFM 字体的 DVI 文件，诱使目标用户通过缩略图预览或打开该文件，触发堆缓冲区溢出，导致任意内存覆盖，最终实现任意代码执行或造成拒绝服务。远程攻击者利用此漏洞需用户交互（打开恶意文件），CVSS 评分 7.6，危害等级高。"
published = "2011-01-07T19:00:17Z"
remediation = "升级 t1lib 至 5.1.2-2 及以上修补版本（Debian/Ubuntu 已提供补丁包），或应用各发行版提供的 CVE-2010-2642 补丁（修复 parseAFM 函数堆缓冲区边界检查）。Evince 用户应升级至 2.32.1 以上版本。如无法升级，可卸载 t1lib 或禁用 DVI 缩略图预览功能作为临时缓解措施。"
score = 7.6
severity = "HIGH"
sources = ["tenable"]
title = "t1lib AFM字体解析器堆缓冲区溢出漏洞"
updated = "2026-06-16T23:21:08Z"

