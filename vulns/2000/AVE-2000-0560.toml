[basic]
description = "BEA WebLogic 3.1.8 至 4.5.1 默认配置存在大小写敏感性处理缺陷（CWE-178），远程未授权攻击者可通过请求大写 .JSP 扩展名的 URL（如 /page.JSP 而非 /page.jsp），绕过 JSP 编译引擎直接获取 JSP 源代码，导致敏感业务逻辑、数据库连接信息等核心代码泄露。该漏洞影响 WebLogic 3.1.8 至 4.5.1 所有版本，CVSS 3.1 评分 7.5（HIGH），攻击向量为网络（AV:N），攻击复杂度低（AC:L），无需权限（PR:N）和用户交互（UI:N），仅影响机密性（C:H）。攻击者只需发送包含大写 .JSP 后缀的 HTTP GET 请求即可无损获取源代码，无需认证交互。BEA 已在后续版本修复该配置缺陷，建议升级至修复版本并配置 Web 服务器强制小写扩展名映射。"
published = "2000-06-08T04:00:00Z"
remediation = "建议立即升级 BEA WebLogic 至 4.5.2 或更高版本（已修复该漏洞）。无法升级时，在 WebLogic 管理控制台中禁用 JSP 大小写不敏感映射，或在 Web 服务器/防火墙层拦截所有包含大写 .JSP/.Jsp 等扩展名的请求，同时配置 Web 服务器拒绝直接访问 .jsp 源文件。建议同时部署 WAF 规则拦截包含大写 JSP 扩展名的请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "BEA WebLogic JSP源代码泄露漏洞"
updated = "2026-06-16T21:51:51Z"

