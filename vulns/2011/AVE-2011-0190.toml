[basic]
description = "Google Chrome 在 17.0.963.83 版本前的 CSS 实现中存在使用后释放漏洞，源于对 CSS :first-letter 伪元素处理不当导致内存引用错误。远程攻击者可通过构造包含特制 :first-letter 伪元素的恶意网页，诱导用户访问触发使用后释放漏洞，导致浏览器崩溃拒绝服务，甚至可能实现任意代码执行。该漏洞影响 Google Chrome 17.0.963.83 之前的所有版本，CVSS 评分 6.8（中等危害），攻击向量为网络，攻击复杂度中等，无需认证即可利用，影响机密性、完整性和可用性。Google 已在 Chrome 17.0.963.83 版本中修复此漏洞，用户应升级至该版本或更高版本修复漏洞。"
published = "2012-03-22T16:55:01Z"
remediation = '建议立即将 Google Chrome 升级至 17.0.963.83 或更高版本，可通过 Chrome 菜单选择"关于 Google Chrome"自动更新，或访问 google.com/chrome 下载最新版本。若无法立即升级，可暂时禁用 CSS :first-letter 伪元素渲染或使用浏览器扩展禁用 CSS 样式作为临时缓解措施。建议启用 Chrome 自动更新功能以确保及时获取安全补丁。定期检查 chrome://settings/help 确认版本号不低于 17.0.963.83。企业环境可通过组策略配置 AutoUpdateEnabled 策略强制自动更新。如需临时缓解，可在企业策略中配置 ExtensionInstallBlocklist 禁用所有扩展以降低攻击面。建议部署端点防护软件监控浏览器进程异常行为。定期检查 chrome.google.com/webstore 确保安装的扩展来自可信来源。启用站点隔离功能以进一步降低渲染进程漏洞利用风险。配置企业策略 RendererCodeIntegrityEnabled 提升渲染进程安全性。'
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome CSS 使用后释放漏洞"
updated = "2026-06-16T23:32:31Z"

