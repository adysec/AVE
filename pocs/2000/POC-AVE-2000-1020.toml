[info]
author = "ave"
description = "通过向 SWAT 管理界面发送 HTTP 请求，对比有效用户名和无效用户名的响应差异，验证是否存在用户枚举漏洞。"
id = "POC-AVE-2000-1020"
name = "Samba SWAT User Enumeration PoC"
severity = "medium"
tags = [
    "cve-2000-0938",
    "samba",
    "swat",
    "user-enumeration",
]
vuln_id = [
    "CVE-2000-0938",
    "AVE-2000-1020",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "SWAT",
    "Samba Web Administration Tool",
]
