[basic]
description = "此漏洞涉及FAM（文件属性管理器）的一个权限提升漏洞，影响SGI IRIX 6.5.x和Linux系统上2.6.6、2.6.8及更高版本的FAM服务。该漏洞允许未授权的本地用户通过向FAM服务发送特定请求，获取访问权限被限制为root组的文件名称和目录信息，从而导致信息泄露。尽管攻击者无需身份验证即可触发此漏洞，但由于其主要为信息披露且攻击面有限，整体危害等级较低，但仍可能被不法分子用作收集系统信息的手段，为后续更严重的攻击提供情报支持。微软、SGI和Red Hat随后发布了安全补丁以修复此漏洞。"
published = "2002-09-05T04:00:00.000"
remediation = "升级 SGI IRIX 到 6.5.x 的补丁版本或更高版本，应用最新的 FAM 安全补丁更新，并验证 root group 的文件访问权限限制配置已正确生效。如无法立即更新，可临时修改 PAM 配置或应用身份验证模块以强化用户权限验证机制，并限制 unprivileged 用户对受保护文件的访问能力"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "SGI IRIX 6.5.x FAM 任意根目录文件信息泄露漏洞"
updated = "2026-06-16T21:58:18.583"

