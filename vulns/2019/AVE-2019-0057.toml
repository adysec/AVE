[basic]
description = "LiveZilla Server 8.0.1.1 之前版本存在反射型跨站脚本漏洞，位于 mobile/index.php 页面。未经身份认证的远程攻击者可通过构造恶意的 Accept-Language HTTP 请求头，当服务器解析并回显该头部内容时，导致恶意脚本在受害者浏览器中执行。攻击者需诱使用户访问特制链接，成功利用后可窃取会话 Cookie、劫持用户会话或实施钓鱼攻击。该漏洞影响 LiveZilla Server 全系列版本，CVSS 评分 6.1，危害等级中危。"
published = "2019-06-25T13:15:09Z"
remediation = """立即升级 LiveZilla Server 至 8.0.1.1 或更高版本，该版本已修复 mobile/index.php 页面中 Accept-Language HTTP 请求头导致的反射型 XSS 漏洞。如无法立即升级，可在反向代理或 Web 应用防火墙（WAF）中添加规则，过滤或转义 Accept-Language 请求头中的 HTML 特殊字符（如 < > " ' &），并限制对 mobile/index.php 的外部直接访问。"""
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "LiveZilla Server Accept-Language 反射型跨站脚本漏洞"
updated = "2026-06-17T02:15:48Z"

