[basic]
description = "Linux内核vsock虚拟套接字子系统存在释放后使用（use-after-free）漏洞。内核在处理vsock套接字绑定时未正确维护引用计数：当传输层释放套接字时，vsock_remove_bound()在未检查套接字是否已绑定到绑定列表的情况下直接递减引用计数，导致引用计数提前归零并释放内存。随后vsock_bind()函数在操作已释放的内存时触发KASAN告警。攻击者可在本地利用此漏洞，通过创建vsock套接字并触发特定的绑定与释放流程，导致内核崩溃或权限提升。该漏洞影响Linux内核相关版本，CVSS评分为7.8（高危）。"
published = "2025-02-27T03:15:16.250"
remediation = '建议立即将 Linux 内核升级到已修复该漏洞的稳定版本：6.6.79、6.12.16、6.13.4 或 6.14-rc1 及以上版本，或应用补丁 commit fcdd2242c0231032fc84e1404315c245ae56322a。如当前系统内核版本在 5.5-rc1 至 6.13.3 之间且无法立即升级，可执行以下临时缓解措施：运行命令 modprobe -r vsock 卸载 vsock 内核模块，或在 /etc/modprobe.d/disable-vsock.conf 文件中添加 "install vsock /bin/true" 和 "blacklist vsock" 配置以阻止模块加载，同时使用 sysctl 或 iptables 限制本地进程对 AF_VSOCK 套接字的创建。完成内核升级后需重启系统以确保新内核生效。'
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux vsock 虚拟套接字 Use-After-Free 漏洞"
updated = "2026-06-17T08:44:11.970"

