[basic]
description = "Oracle GlassFish Server Open Source Edition 3.0.1 (build 22) 存在本地文件包含漏洞，未经身份认证的远程攻击者可通过特制请求读取服务器上的任意文件，导致敏感信息泄露。该漏洞无需任何认证即可利用，攻击者可通过构造包含路径遍历的 URL 访问受限文件，如配置文件、密码文件等。CVSS 评分 7.5，危害等级高，影响 GlassFish Server 3.0.1 版本。建议用户升级至最新版本或应用厂商提供的安全补丁。"
published = "2017-07-17T13:18:16Z"
remediation = "升级到 Eclipse GlassFish 7.0.0 及以上版本（原 Oracle GlassFish 已移交 Eclipse 基金会），该漏洞已在后续版本中修复。如无法升级，可在反向代理或 WAF 层面拦截包含 `file%3a///` 或 `file:///` 的请求路径，或删除 `resource` 目录下对文件协议的处理逻辑作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Oracle GlassFish Server Open Source Edition 本地文件包含漏洞"
updated = "2026-06-17T00:58:36Z"

