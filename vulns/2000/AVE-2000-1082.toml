[basic]
description = "tags.<value>SonicWALL SOHO 防火墙的 Web 服务器存在拒绝服务漏洞。远程攻击者无需身份认证即可通过在认证页面提交超长用户名的方式触发该漏洞，导致 Web 服务崩溃或不可用，从而阻止合法用户访问防火墙管理界面。该漏洞影响 SonicWALL SOHO Firewall 4.0 和 5.0 版本，CVSS 评分为 5.0，危害等级中等。"
published = "2001-01-09T05:00:00.000"
remediation = "升级 SonicWALL SOHO Firewall 5.0 至最新可用固件版本，或更换为 Gen8 TZ 80 型号防火墙。临时缓解措施：在防火墙上限制对认证页面的访问，仅允许受信任的 IP 地址访问。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
