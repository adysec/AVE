[basic]
description = "QNAP HBS 3 Hybrid Backup Sync 存在错误信息泄露敏感信息漏洞（CWE-209）。该漏洞源于软件在生成错误信息时未正确过滤敏感数据，将应用程序数据包含在错误消息中。已获得本地网络访问权限的攻击者可利用该漏洞读取应用程序中的敏感数据，包括配置信息、用户凭证等。该漏洞影响 HBS 3 Hybrid Backup Sync 26.2.0.938 之前的所有版本，CVSS 评分 7.0，危害等级高。QNAP 已在 26.2.0.938 及后续版本中修复此漏洞。"
published = "2026-01-02T16:17:00.573"
remediation = "立即将 HBS 3 Hybrid Backup Sync 升级至 26.2.0.938 或更高版本。可通过 QNAP App Center 检查并安装更新，或前往 QNAP 官网下载中心获取最新版本。如无法立即升级，建议限制受影响设备的本地网络访问权限，仅允许可信主机连接。同时禁用不必要的错误信息输出，避免敏感数据泄露。"
score = 7
severity = "HIGH"
sources = ["zdi"]
title = "QNAP HBS 3 Hybrid Backup Sync 敏感信息泄露漏洞"
updated = "2026-06-17T09:52:30.800"

