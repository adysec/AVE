[basic]
description = "标签之间。<value>Ghost 是一款基于 Node.js 的开源内容管理系统。其管理后台的 Universal Import（通用导入）功能存在跨站脚本漏洞，该功能在导入内容时未能对数据进行充分的 XSS 过滤与净化，导致攻击者可通过构造包含恶意脚本的导入文件，在 Ghost Admin 的文章内容中注入并执行任意 JavaScript 代码。此漏洞影响从 v5.26.0 到 v6.54.0 的所有 Ghost 版本，CVSS v3.1 评分为 5.0（中危）。要成功利用此漏洞，攻击者需具备高权限账户并完成复杂的操作流程，利用后可在管理员浏览器端执行脚本，窃取会话令牌或篡改内容。官方已在 v6.54.1 版本中修复此问题。"
published = "2026-08-04T21:16:38Z"
remediation = "建议立即将 Ghost 升级至 v6.54.1 或更高版本。Docker 自托管用户请更新官方 Ghost 镜像（docker pull ghost:latest 后重启容器），Ghost-CLI 用户请执行 ghost update。如暂时无法升级，可临时禁用 Ghost Admin 中的 Universal Import 功能作为缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Ghost 内容管理系统 跨站脚本漏洞"
updated = "2026-08-05T19:17:37Z"

