[info]
author = "AVE"
description = "通过访问 JRun 默认安装的 viewsource.jsp 示例文件，利用 source 参数进行路径遍历，读取服务器上的任意文件。默认监听端口 8000。"
id = "POC-AVE-2000-0619"
name = "Allaire JRun 2.3.x viewsource.jsp 任意文件读取 PoC"
severity = "medium"
tags = ["ave-2000-0619"]
vuln_id = [
    "CVE-2000-0540",
    "AVE-2000-0619",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/jsp/jspsamp/jspexamples/viewsource.jsp"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
