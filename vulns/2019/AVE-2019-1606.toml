[basic]
description = "Apple iOS 内核 IOKit 驱动中的 ProvInfoIOKitUserClient 用户客户端存在堆缓冲区溢出漏洞。该漏洞位于 ucEncryptSUInfo 外部方法中，攻击者可控的 struct_in 缓冲区偏移 0x7d4 处的值被直接作为 memmove 函数的大小参数使用，未经任何边界检查，导致内核堆内存越界写入。本地攻击者可通过诱导用户打开恶意应用程序触发该漏洞，实现以内核权限执行任意代码，完全控制目标设备。该漏洞影响 iOS 10 至 12.1.3 版本，已在 iOS 12.1.4 中修复。此漏洞由 Google 威胁分析小组（TAG）和 Project Zero 团队在野外攻击链中发现并报告，已被 CISA 列入已知被利用漏洞目录（KEV），属于在野活跃利用的 0-day 漏洞。"
published = "2019-12-18T18:15:22Z"
remediation = "立即将 iOS 升级至 12.1.4 或更高版本（适用于 iPhone 5s 及更新机型、iPad Air 及更新机型、iPod touch 第 6 代）。该版本修复了 IOKit 内核内存损坏漏洞。如无法立即升级，建议限制不可信应用安装权限，并启用 MDM 策略强制推送安全更新。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Apple iOS 内核内存损坏任意代码执行漏洞"
updated = "2026-06-17T02:40:23Z"

