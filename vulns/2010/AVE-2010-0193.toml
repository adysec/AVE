[basic]
description = "RealNetworks RealPlayer 及 HelixPlayer 在处理 SMIL 文件格式时存在释放后重用漏洞。当解析 ICY SHOUTcast 流中特制的 StreamTitle 标签时，程序错误地访问已释放的内存，导致堆内存破坏。远程攻击者可构造恶意媒体流诱导用户播放，成功利用可实现任意代码执行或导致拒绝服务。该漏洞影响 RealPlayer 11.0 至 11.1、RealPlayer SP 1.0 至 1.0.1、Mac RealPlayer 11.0 至 11.1、Linux RealPlayer 11.0.2.1744 及 HelixPlayer 1.0.6 等版本，CVSS 评分 9.3，危害严重。"
published = "2010-12-14T16:00:02Z"
remediation = "立即升级 RealPlayer 至 12.0.1.609 或更高版本。Linux 平台 HelixPlayer 用户请安装 Red Hat 安全公告 RHSA-2010:0981 提供的更新包。如无法升级，建议在浏览器中禁用 RealPlayer 插件，并避免打开来自不可信来源的 SMIL/ICY 流媒体文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer SMIL文件格式StreamTitle释放后重用远程代码执行漏洞"
updated = "2026-06-16T23:21:56Z"

