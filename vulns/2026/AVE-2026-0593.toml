[basic]
description = "Coder 的 provisionersdk/proto/dataupload.go 中的 NewDataBuilder 函数在分配字节切片时未对客户端提供的 FileSize 参数进行上限校验。已认证的攻击者可通过向 provisioner 守护进程服务端点发送一个约 50 字节的 DataUpload 消息，声明极大的 FileSize（如 1 TiB），触发 Go 运行时内存耗尽导致 coderd 进程崩溃，造成整个部署服务拒绝服务。该漏洞影响 Coder v2.24.0 至 v2.29.7、v2.32.7、v2.33.8、v2.34.2 版本，CVSS 评分 4.9，危害等级中危。官方已在 v2.29.17、v2.32.7、v2.33.8、v2.34.2 版本中通过限制 FileSize 上限为 100 MiB 修复此漏洞。"
published = "2026-07-08T00:16:33Z"
remediation = "立即升级 Coder 至以下已修复版本：v2.34.2、v2.33.8、v2.32.7 或 v2.29.17（ESR）。升级后 `FileSize` 将被限制在 100 MiB 以内，防止无界内存分配导致的 OOM 崩溃。如无法立即升级，可将 provisioner daemon serve 端点的访问权限限制为受信任的 provisioner daemon 服务账户，作为临时缓解措施。"
score = 4.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "Coder provisioner 文件上传无界内存分配拒绝服务漏洞"
updated = "2026-07-08T19:44:45Z"

