[basic]
description = "AOLserver 3.0 存在缓冲区溢出漏洞，远程攻击者可通过向目标服务器发送包含超长 Authorization 头的特制 HTTP 请求触发该漏洞，导致服务拒绝响应，甚至可能执行任意代码。该漏洞影响 AOLserver 3.0 版本，CVSS 评分 10.0，危害等级严重。攻击者无需身份认证即可远程利用，Exploit-DB 上已有公开利用代码。"
published = "2001-08-31T04:00:00Z"
remediation = "立即升级 AOLserver 至 4.0 或更高版本（3.4+ 已修复该漏洞），或迁移至 Apache/Nginx 等仍在维护的 Web 服务器。如无法立即升级，可在反向代理或 WAF 层面限制 HTTP Authorization 头长度不超过 1024 字节，并监控 80 端口异常超长请求作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "AOL AOLserver 3.0 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:55:31Z"

