[basic]
description = "MDaemon 邮件服务器 3.1.1 及更早版本的 Worldclient 组件中存在堆溢出漏洞。远程攻击者无需身份认证即可通过向目标系统发送特制的超长 URL 请求触发该漏洞，导致堆内存越界写入，造成服务拒绝（DoS），在特定条件下还可执行任意命令。攻击复杂度低，仅需网络访问即可利用，影响系统的机密性、完整性和可用性。"
published = "2000-12-11T05:00:00.000"
remediation = "建议立即升级到 Mdaemon 3.1.12 或更高版本，可从 Alt-N 官方 FTP（ftp://ftp.altn.com/MDaemon/Release/md312.exe）下载补丁程序安装。升级前请停止 Worldclient 服务（TCP 3000 端口）和 Webconfig 服务（TCP 3001 端口），安装完成后重启服务并确认版本号已更新。如无法立即升级，可在防火墙层面对 3000 和 3001 端口实施访问控制，限制仅可信 IP 可访问 Mdaemon 的 Web 服务，以降低被远程攻击利用的风险。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Alt-N Mdaemon Worldclient 堆溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:59.143"

