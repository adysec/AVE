[basic]
description = "FileSeek.cgi 脚本存在目录遍历漏洞，由于 head 和 foot 参数未对用户输入进行严格过滤，远程攻击者可通过在参数中插入修改后的点号序列（....//）绕过路径检查，从而读取服务器上的任意文件内容。该漏洞影响运行 FileSeek 程序的 Web 服务器，攻击者无需身份认证即可通过网络直接发送构造好的 HTTP 请求发起攻击，造成敏感信息泄露，CVSS v2 评分 5.0，危害等级中等。"
published = "2002-06-18T04:00:00Z"
remediation = "建议立即从 Web 服务器 cgi-bin 目录中删除或禁用 FileSeek.cgi 与 FileSeek2.cgi 脚本，阻止未经授权的目录遍历访问。如确需保留该脚本功能，应在代码中对 head 和 foot 参数进行输入过滤，拒绝包含 ....// 或 ../ 等路径遍历序列的请求，并将脚本运行目录严格限制在 Web 根目录以内。同时建议在 Web 服务器配置中限制 cgi-bin 目录的访问权限，或替换为经安全审计的现代文件搜索方案。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "FileSeek CGI 脚本目录遍历文件读取漏洞"
updated = "2026-06-16T21:57:46Z"

