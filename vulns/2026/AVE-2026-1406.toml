[basic]
description = "Electron 应用框架存在跨域信息泄露漏洞，源于自定义协议注册时启用 `supportFetchAPI` 但未开启 `corsEnabled`，导致自定义协议不受 CORS 策略约束。攻击者可构造恶意网页，利用 fetch() 或 XMLHttpRequest 跨域访问目标应用的自定义协议接口并读取完整响应内容，从而窃取敏感数据。该漏洞影响在自定义协议中提供敏感数据且在渲染器中加载远程或不受信任内容的 Electron 应用。用户仅需访问攻击者控制的网页即可触发攻击，无需交互，利用门槛低。Electron 已在 39.8.10、40.9.3、41.4.0 和 42.0.0 版本中修复此问题。"
published = "2026-08-05T16:17:04Z"
remediation = "立即将 Electron 升级至 39.8.10、40.9.3、41.4.0 或 42.0.0 版本。对于无法立即升级的应用，在注册自定义协议时设置 corsEnabled: true，并在协议处理器中校验请求的 Origin 头，仅向已验证来源返回敏感数据，以防止跨域读取攻击。"
score = 7.4
severity = "HIGH"
sources = ["ghsa"]
title = "Electron 自定义协议跨域读取漏洞"
updated = "2026-08-05T19:17:39Z"

