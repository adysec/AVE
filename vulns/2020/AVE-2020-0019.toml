[basic]
description = "Cisco IOS XR Software 的距离向量组播路由协议（DVMRP）功能在处理 IGMP 数据包时存在多个资源耗尽漏洞。由于对 IGMP 数据包处理不当，未经身份验证的远程攻击者可通过向受影响设备发送特制的 IGMP 流量立即导致 IGMP 进程崩溃，或持续消耗设备可用内存最终引发进程崩溃。内存耗尽还可能影响设备上运行的其他进程，包括但不限于内部和外部路由协议，从而导致整个设备不稳定。该漏洞影响 Cisco IOS XR 软件多个版本，攻击者无需任何认证即可在远程发起利用。"
published = "2020-09-23T01:15:15.503"
remediation = "立即升级 Cisco IOS XR Software 至修复版本并安装对应平台的安全补丁（SMU）：ASR9K-PX 平台升级至 6.1.4/6.2.3/6.3.3/6.4.2/6.5.3/6.6.2/6.6.3，ASR9K-X64 平台升级至 6.1.4/6.2.3/6.4.2/6.6.2/6.6.3/7.0.2/7.1.2/7.1.15，CRS 平台升级至 6.1.4/6.4.2/6.4.3，NCS5500 平台升级至 6.5.2，同时安装对应的 CSCvv60110 或 CSCvv54838 SMU 补丁。如无法立即升级，可临时在接口上配置速率限制器（lpts pifib hardware police flow igmp rate）降低 IGMP 流量速率，或创建 ACL 拒绝 DVMRP 流量（ipv4 access-list deny igmp any any dvmrp）以阻断攻击向量。若已遭受内存耗尽攻击，可通过 process restart igmp 命令重启 IGMP 进程恢复内存。"
score = 8.6
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS XR Software IGMP 协议处理内存耗尽漏洞"
updated = "2026-06-17T03:18:37.407"

