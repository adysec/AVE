[basic]
description = "WordPress 的 PDF & Print 插件（由 BestWebSoft 开发）1.9.4 之前版本存在跨站脚本漏洞（CWE-79）。该漏洞源于插件对 admin.php 页面中 category 参数过滤不严，经过身份认证的攻击者可在参数中注入恶意 JavaScript 脚本，当管理员访问受影响页面时脚本即被执行，导致攻击者能够窃取会话 Cookie、执行恶意操作或篡改页面内容。攻击者需拥有 WordPress 后台登录权限，且需诱使用户访问特制链接方可触发，CVSS 评分 6.1，危害等级中危。"
published = "2019-08-20T16:15:12Z"
remediation = "升级 WordPress pdf-print 插件至 1.9.4 或更高版本。在 WordPress 后台插件页面搜索 pdf-print 并点击更新，或手动从 WordPress 插件目录下载最新版覆盖安装。如无法立即升级，可暂时禁用该插件作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress pdf-print插件跨站脚本漏洞"
updated = "2026-06-17T01:13:02Z"

