[basic]
description = "Google Chrome 的 V8 JavaScript 引擎存在释放后使用（Use After Free）漏洞，远程攻击者可通过构造特制的 HTML 页面诱导用户访问，触发已释放内存的访问，导致堆破坏，进而实现远程代码执行或信息泄露。该漏洞影响 Google Chrome 133.0.6943.98 之前版本及基于 Chromium 的 Microsoft Edge 133.0.3065.69 之前版本，CVSS 评分 8.8，危害等级高。用户需升级浏览器至最新版本以修复此漏洞。"
published = "2025-02-15T02:15:09Z"
remediation = "立即升级 Google Chrome 至 133.0.6943.98 及以上版本，可通过 Chrome 设置 > 关于 Chrome > 自动检查更新完成升级。使用 Microsoft Edge 的用户应升级至 133.0.3065.69 及以上版本。Debian 12 用户请执行 `apt update && apt upgrade chromium` 应用 DSA-5866 安全更新。无法立即升级时，可配置浏览器禁用 JavaScript 作为临时缓解措施（V8 引擎通过 JS 触发）。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 释放后使用漏洞"
updated = "2026-06-17T08:27:29Z"

