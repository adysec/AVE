[basic]
description = "标签之间。<value>Quest NetVault Backup 的 NVBUDashboard 组件在处理 JSON-RPC 消息时，未对用户提供的字符串进行充分验证即用于构造 SQL 查询，导致存在 SQL 注入漏洞。该漏洞影响 Quest NetVault Backup 的受影响安装版本，攻击者虽需通过身份验证，但现有认证机制可被绕过。成功利用后，攻击者可在 NETWORK SERVICE 权限上下文中执行任意代码，从而完全控制目标系统。"
published = "2026-06-25T00:17:48Z"
remediation = "立即将 Quest NetVault Backup 升级至 14.0.2 或更高版本，以修复 NVBUDashboard JSON-RPC 消息处理中的 SQL 注入漏洞。如暂无法立即升级，建议在防火墙或网络安全组中限制 NVBUDashboard 组件的访问权限，仅允许受信任的管理员 IP 地址访问该服务端口，同时启用多因素认证以弥补认证绕过风险。此外，建议密切监控 NETWORK SERVICE 账户的异常进程创建和出站网络连接行为。"
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "Quest NetVault Backup NVBUDashboard SQL注入远程代码执行漏洞"
updated = "2026-06-26T05:16:32Z"

