[basic]
description = "Ruby oauth 库在 1.1.6 之前版本中存在跨源重定向信息泄露漏洞。当应用使用 OAuth::Consumer 请求 OAuth 1.0 请求令牌或访问令牌时，token_request 方法会递归跟随 OAuth 服务器返回的 300..399 重定向。若重定向目标为不同主机但路径相同，该方法会解析原始 Location 头，修改消费者配置的 site 并重建 HTTP 客户端，随后继续向攻击者控制的主机发送已签名的令牌请求。攻击者因此可获取 OAuth 1.0 签名元数据，包括 oauth_consumer_key、oauth_signature_method、oauth_timestamp、oauth_nonce、oauth_version 及 oauth_signature 等敏感信息。此外，由于应用服务器以自身网络位置发起重定向后的请求，该漏洞还可被利用进行 SSRF（服务器端请求伪造）和混淆代理攻击。影响范围包括 oauth gem v0.5.5 至 v1.1.5 所有版本。修复方案为升级至 v1.1.6，该版本默认拒绝跨源令牌端点重定向，仅允许同源重定向并设置最大重定向次数限制。"
published = "2026-07-28T17:16:52Z"
remediation = "升级到 oauth v1.1.6，该版本默认拒绝跨源令牌端点重定向。如无法立即升级，请确保 OAuth 令牌端点 URL 为固定绝对路径且不受租户控制，同时在网络层阻止应用服务器向外部元数据服务的出站访问，或在 OAuth 提供商前部署可信代理以拦截跨源重定向。"
score = 7.2
severity = "HIGH"
sources = ["ghsa"]
title = "Ruby OAuth 跨域重定向签名请求元信息泄露漏洞"
updated = "2026-07-28T18:17:22Z"

