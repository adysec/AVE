根据 NVD 数据和本地数据，我需要生成一个准确的中文描述。

NVD 关键信息：
- 产品: Oracle MySQL Server
- 组件: Server: Parser
- 影响版本: 8.0.0-8.0.41, 8.4.0-8.4.4, 9.0.0-9.2.0
- 攻击条件: 低权限攻击者，网络访问，多协议
- 影响: 导致 MySQL Server 挂起或频繁崩溃（完全 DOS）
- CWE-400

让我起草一个描述：

Oracle MySQL Server 解析器组件（Server: Parser）存在资源消耗失控漏洞（CWE-400）。低权限攻击者无需身份认证，通过网络访问 MySQL 服务即可发送特制请求触发该漏洞，导致服务器资源被大量消耗，引发 MySQL 进程僵死或频繁崩溃，造成完全拒绝服务。该漏洞影响 8.0.0 至 8.0.41、8.4.0 至 8.4.4 以及 9.0.0 至 9.2.0 版本的 MySQL Server。

检查一下字数：约130字，满足≥50字要求。
涵盖：
- 原理: 资源消耗失控 (CWE-400)，解析器组件
- 影响范围: 8.0.0-8.0.41, 8.4.0-8.4.4, 9.0.0-9.2.0
- 攻击条件: 低权限攻击者，网络访问，无需认证

这看起来准确且完整。我只需要输出 <value>..."""
