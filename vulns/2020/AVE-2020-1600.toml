Let me write a clean Chinese description ≥50 chars covering principle, impact scope, attack conditions.<value>VMware ESXi 中集成的 OpenSLP 服务存在释放后使用（use-after-free）漏洞，影响 ESXi 7.0（低于 ESXi_7.0.1-0.0.16850804）、6.7（低于 ESXi670-202010401-SG）及 6.5（低于 ESXi650-202010401-SG）等多个版本，也为 CVE-2019-5544 堆覆写问题的后续利用提供了基础。漏洞原理在于 OpenSLP 在解析网络请求时对已释放的内存对象继续执行引用操作，导致内存破坏（CWE-416），攻击者无需身份认证，仅需处于管理网络并能访问 ESXi 主机上开放的 427 端口（SLP 服务），向该服务发送特制的数据包即可触发释放后使用，从而实现远程代码执行，进而完全控制受影响的虚拟化宿主机，危害极大。该漏洞 CVSS 评分为 9.8，危害等级严重（CRITICAL），且已被纳入 CISA 已知被利用漏洞目录（KEV），属于在野利用的高危漏洞，管理员应尽快应用 VMware 官方提供的对应版本安全补丁进行修复。"""
published = "2020-10-20T17:15:12Z"
remediation = "建议尽快将 VMware ESXi 升级至修复版本：ESXi 7.0 升级到 ESXi_7.0.1-0.0.16850804 及以上，ESXi 6.7 升级到 ESXi670-202010401-SG 及以上，ESXi 6.5 升级到 ESXi650-202010401-SG 及以上。该漏洞因 OpenSLP 服务存在 use-after-free 缺陷，攻击者需通过网络访问 427 端口（SLP 服务）才能触发，故在无法及时打补丁时将受影响设备置于隔离网段，限制非授权访问以降低利用风险。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "VMware ESXi OpenSLP 服务释放后使用远程代码执行漏洞"
