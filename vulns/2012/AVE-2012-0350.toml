[basic]
description = "Apple Safari 6.0之前版本中的WebKit引擎存在内存破坏漏洞。远程攻击者可通过构造恶意网页，利用WebKit在处理图像（如TIFF、PNG、JPEG）及ImageIO组件时的多个内存错误，触发内存损坏并导致应用崩溃，或执行任意代码。该漏洞影响Safari浏览器及基于WebKit的iOS设备，攻击条件为用户访问恶意网站即可触发，无需身份认证。CVSS评分9.3，危害等级严重。Apple已于2012年7月发布安全更新修复此漏洞。"
published = "2012-07-25T20:55:04.523"
remediation = "立即将 Apple Safari 升级至 6.0 或更高版本（通过 macOS 系统更新或 App Store 手动更新）。若无法立即升级，可在 Safari 设置中禁用 JavaScript 作为临时缓解措施，或在防火墙层面阻止可疑域名访问。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit内存破坏漏洞"
updated = "2026-06-16T23:43:42.520"

