[basic]
description = "技嘉多款产品的 GPCIDrv 和 GDrv 低级驱动程序存在权限许可和访问控制缺陷，暴露了读写任意物理内存的功能接口。本地攻击者可利用该漏洞通过调用驱动程序提供的 IOCTL 接口，实现对内核内存的任意读写，从而绕过安全机制提升权限至 SYSTEM 级别。受影响产品包括 GIGABYTE APP Center v1.05.21 及更早版本、AORUS GRAPHICS ENGINE 1.57 之前版本、XTREME GAMING ENGINE 1.26 之前版本以及 OC GURU II v2.08。攻击条件为本地访问权限且无需用户交互，CVSS 3.1 评分 7.8（HIGH），向量为 CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H。"
published = "2018-12-21T23:29:00Z"
remediation = "立即将 GIGABYTE APP Center 升级至 19.0422.1 或更高版本，AORUS GRAPHICS ENGINE 升级至 1.57 或更高版本，XTREME GAMING ENGINE 升级至 1.26 或更高版本。上述驱动驱动程序存在任意物理内存读写漏洞，本地攻击者可利用其提升至 SYSTEM 权限。如无法立即更新，建议卸载受影响驱动程序或通过组策略限制非管理员用户加载 GPCIDrv.sys 和 GDrv.sys 驱动。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "技嘉 多款产品 权限提升漏洞"
updated = "2026-06-17T01:49:06Z"

