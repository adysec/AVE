[basic]
description = "mIRC 5.7 的锁定功能存在安全绕过漏洞，攻击者可通过修改 Windows 注册表中的 LockOptions 键值绕过密码保护机制。该漏洞影响使用密码锁定功能的 mIRC 客户端，本地或远程攻击者无需身份验证即可解锁受保护的 mIRC 会话，从而访问聊天记录、联系人列表等敏感信息。攻击者只需具备对目标系统注册表的写入权限，即可通过修改相关注册表项禁用锁定功能，导致保密性、完整性和可用性均受到部分影响。"
published = "2001-06-02T04:00:00Z"
remediation = '建议将 mIRC 升级至最新版本（当前为 v7.84 或更高），新版本已修复密码保护机制绕过漏洞。临时缓解措施：限制系统其他用户对 HKEY_CURRENT_USER\Software\mIRC\LockOptions 注册表项的写入权限，或在组策略中禁用受影响的注册表编辑功能，防止本地恶意用户修改该键值绕过密码锁定。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "mIRC 密码机制安全绕过漏洞"
updated = "2026-06-16T21:54:05Z"

