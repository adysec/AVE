[basic]
description = "Apple iTunes 10.7之前版本所使用的WebKit存在内存破坏漏洞，远程攻击者可构造包含恶意代码的网页并诱导用户访问，触发内存损坏从而执行任意代码或导致应用程序崩溃拒绝服务。该漏洞攻击复杂度中等，无需身份认证即可远程利用，影响范围涵盖所有使用受影响WebKit版本的iTunes用户。"
published = "2012-09-13T10:30:20.807"
remediation = "立即升级 iTunes 至 10.7 或更高版本，Safari 升级至 6.0.1 或更高版本。Windows 用户通过 Apple Software Update 或 iTunes 内置更新功能安装 iTunes 10.7；Mac 用户安装 OS X Mountain Lion v10.8.2 或通过 Mac App Store 更新 Safari 至 6.0.1。如暂时无法升级，避免访问恶意网站及点击不明链接，可在防火墙或代理层面过滤可疑 Web 内容作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes 远程代码执行漏洞"
updated = "2026-06-16T23:43:44.333"

