[basic]
description = "pyasn1 是 Python 生态中通用的 ASN.1 编解码库。在 0.6.4 之前版本中，其 univ.Real 类型在将 (尾数, 基数, 指数) 值转换为 Python float 时使用了精确的大整数幂运算。攻击者可以构造一个仅数字节长的 BER/CER/DER 编码 REAL 值，其中包含极大的指数，触发 float 转换（如 prettyPrint()、str()、比较运算、算术运算、int() 或显式 float() 调用）时会导致 CPU 和内存被过度消耗，造成进程挂起，形成拒绝服务。解码操作本身不会触发该问题，但任何对解码后的 Real 对象进行打印、日志记录或比较的操作均会受影响。该漏洞 CVSS 评分 7.5，危害等级高，远程攻击者无需身份认证即可通过网络触发。修复版本为 pyasn1 0.6.4。"
published = "2026-07-14T17:17:15Z"
remediation = "立即将 pyasn1 升级至 0.6.4 或更高版本（`pip install --upgrade pyasn1`）。如无法升级，避免对不可信来源解码后的 Real 对象执行 prettyPrint()、str()、比较、算术运算或 float() 转换，改用原始 (mantissa, base, exponent) 元组处理数据。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "pyasn1 ASN.1库不受控制的资源消耗漏洞"
updated = "2026-07-21T14:38:13Z"

