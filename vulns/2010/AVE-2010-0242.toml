[basic]
description = "Apple QuickTime 在处理畸形 AVI 文件时存在内存破坏漏洞，由于对 AVI 文件格式的解析逻辑存在缺陷，远程攻击者可诱导用户打开特制的 AVI 文件，触发内存损坏导致应用程序崩溃，成功利用可在目标系统上执行任意代码。该漏洞影响 Mac OS X 10.6.x 至 10.6.5 版本及 QuickTime 7.6.9 之前版本，攻击者无需身份认证，但需要用户交互（如访问恶意网站或打开恶意文件）。Apple 已在 Mac OS X 10.6.5 安全更新中修复此漏洞。"
published = "2010-11-16T22:00:16Z"
remediation = "立即将 QuickTime 升级至 7.6.9 或更高版本（Windows 系统），Mac OS X 10.6.x 用户升级至 10.6.5。如无法升级，在浏览器中禁用 QuickTime 插件，并避免打开来源不明的 AVI 文件。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple QuickTime AVI文件解析内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:23:32Z"

