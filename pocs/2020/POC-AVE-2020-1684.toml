[info]
author = "ave"
description = "检测目标是否存在 Plex Media Server 反序列化远程代码执行漏洞（CVE-2020-5741），该漏洞存在于 Windows 平台 Plex Media Server 的插件框架中，Data.py 的 __unpickle() 函数使用 pickle.load() 对 Dict 文件执行反序列化时未做任何验证，导致已认证攻击者可通过相机上传功能上传恶意 Dict 文件并触发任意代码执行。"
id = "POC-AVE-2020-1684"
name = "Plex Media Server Authenticated Remote Python Deserialization PoC"
severity = "high"
tags = ["ave-2020-1684"]
vuln_id = [
    "CVE-2020-5741",
    "AVE-2020-1684",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}:32400/web/index.html"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    200,
    301,
    302,
    401,
    403,
]
type = "status"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}:32400/"
protocol = "http"

[poc.requests.headers]
Accept = "text/html,application/xhtml+xml"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Plex"]
