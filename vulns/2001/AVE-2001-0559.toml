[basic]
description = 'EasyNews 1.5 及更早版本中存在目录遍历漏洞，位于 comments 操作的 cid 参数中。远程攻击者无需身份认证即可通过向 cid 参数传入包含 ".." 的恶意路径，利用目录遍历技术越权访问服务器文件系统，进而修改 news.dat、template.dat 等关键配置文件。该漏洞影响 EasyNews 1.5 及之前所有版本，CVSS 评分 5.0，危害等级中等，攻击复杂度低，可导致系统配置被篡改，影响网站正常运行。'
published = "2001-12-31T05:00:00Z"
remediation = "立即升级 easyNews 至 1.5 以上版本（如官方已停止维护，建议迁移至其他活跃维护的新闻管理系统）。若无法升级，在 index.php 的 comments 动作处理 cid 参数时，过滤 `../` 及空字节等目录遍历字符，仅允许纯数字或字母输入；同时将 news.dat、template.dat 等关键文件的权限设为 0444（只读），并确保 Web 服务器运行用户对这些文件无写入权限。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "EasyNews 1.5 目录遍历漏洞"
updated = "2026-06-16T21:56:26Z"

