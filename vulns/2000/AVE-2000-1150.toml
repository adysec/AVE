[basic]
description = "Lotus Domino 服务器 5.0.8 版本的默认配置会在 HTTP 响应头中包含系统信息（版本号、操作系统类型和构建日期），导致敏感信息泄露。远程攻击者无需身份认证即可通过发送 HTTP 请求并检查响应头获取这些信息，为进一步攻击收集目标环境情报。该漏洞影响 Lotus Domino 5.0.8 及可能的相关版本，CVSS 评分 5.0，危害等级中危。建议升级至更高版本或修改配置以移除响应头中的系统信息。"
published = "2001-09-19T04:00:00Z"
remediation = "升级至 Lotus Domino 5.0.2 或更高版本，该版本已修复 HTTP 响应头信息泄露问题。如无法立即升级，可在前端部署反向代理服务器过滤响应头中的 Server/X-Powered-By 等敏感信息字段。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Lotus Domino 服务器 HTTP 响应头信息泄露漏洞"
updated = "2026-06-16T21:53:23Z"

