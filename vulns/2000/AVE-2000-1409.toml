[basic]
description = "BEA WebLogic Server 代理插件存在缓冲区溢出漏洞，远程攻击者可通过向目标服务器发送包含超长 .JSP 扩展名的特制 URL 请求触发该漏洞，导致缓冲区溢出，进而实现任意代码执行。该漏洞影响 BEA WebLogic Server 相关版本，无需身份认证即可远程利用，CVSS 评分 10.0，危害等级严重。攻击者可完全控制受影响的服务器，窃取敏感数据、植入后门或发起进一步攻击。"
published = "2000-10-20T04:00:00Z"
remediation = "升级 BEA WebLogic Server 至 5.1.0 Service Pack 11 或更高版本。如无法立即升级，在反向代理或 Web 服务器层面配置规则，拦截包含超长 .JSP 后缀的 URL 请求，限制 URL 长度不超过 2048 字节作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "BEA WebLogic Server 代理插件缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:15Z"

