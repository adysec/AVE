[basic]
description = "Adobe Acrobat Reader 存在释放后使用漏洞（CWE-416），受影响版本包括 24.001.30365、26.001.21651 及更早版本。该漏洞的成因是程序在释放内存后仍使用该内存区域的引用，导致使用已释放内存时发生内存访问违规。攻击者可构造恶意 PDF 文件，当用户使用受影响版本的 Acrobat Reader 打开该文件时，程序在解析文档过程中触发释放后使用条件，导致在当前用户上下文中执行任意代码。该漏洞利用需要用户交互，攻击者必须诱骗受害者打开特制文件才能触发漏洞。成功利用可导致攻击者在目标系统上获得与当前用户相同的权限，进而执行任意代码、窃取敏感数据或进一步控制系统。Adobe 已在后续版本中修复此漏洞，受影响用户应升级至 24.001.30383 或 26.001.21662 及以上版本。"
published = "2026-06-09T21:17:20Z"
remediation = "建议立即将 Adobe Acrobat Reader 升级至 24.001.30383（经典版）或 26.001.21662（连续版）及更高版本。可通过 Acrobat 的「帮助」→「检查更新」或 Adobe Updater 自动完成更新。如暂无法升级，应避免打开来源不明的 PDF 文件，并在浏览器及邮件客户端中禁用 PDF 插件自动预览功能，以降低攻击面。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Adobe Acrobat Reader 释放后使用远程代码执行漏洞"
updated = "2026-07-23T09:10:00Z"

