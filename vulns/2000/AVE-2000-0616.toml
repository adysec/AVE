[basic]
description = "Jack De Winter WinSMTP 1.06f 及 2.X 版本存在缓冲区溢出漏洞。远程攻击者无需身份认证即可通过向 SMTP 服务发送超长的 USER 或 HELO 命令触发缓冲区溢出，导致服务进程崩溃，造成拒绝服务。由于 CVSS v2 评分为 10.0（攻击复杂度低、无需认证、完全机密性/完整性/可用性影响），该漏洞在特定条件下可能被利用实现远程代码执行。受影响版本包括 WinSMTP 1.06f 和 2.X 系列。"
published = "2000-11-14T05:00:00Z"
remediation = "该漏洞存在于 WinSMTP 1.06f 及 2.x 版本中，该软件已停止维护，建议立即迁移至受支持的 SMTP 服务器软件（如 hMailServer、MailEnable 等）。若无法立即迁移，可在防火墙层面限制仅允许可信 IP 访问 TCP 端口 25，并对 SMTP 命令长度进行限制：HELO/EHLO 命令不超过 64 字节，USER 命令不超过 128 字节，超出则直接断开连接。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Jack De Winter WinSMTP 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:52:33Z"

