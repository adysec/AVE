[basic]
description = 'Windows 证书对话框（Certificate Dialog）存在权限提升漏洞，由于该组件在处理用户权限时未能正确实施强制策略，导致低权限用户可通过诱导系统以高权限（SYSTEM）执行任意程序。攻击者需具备本地访问权限，通过右键点击证书文件并选择"以管理员身份运行"，在 UAC 弹窗中点击"显示更多详细信息"并查看证书，随后点击证书链接打开浏览器，利用浏览器以 SYSTEM 权限执行命令。该漏洞影响 Windows Server 2008/2012/2016/2019 及 Windows 7/8.1/10 等多个版本，CVSS 评分 7.8，危害等级高。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），Microsoft 已在 2019 年 11 月安全更新中修复。'
published = "2019-11-12T19:15:12Z"
remediation = "安装 Microsoft 2019 年 11 月安全更新。各版本对应补丁：Windows 7 SP1 (KB4525235)、Windows 8.1 (KB4525243)、Windows 10 v1809 (KB4525232)、Windows Server 2019 (KB4525232)。可通过 Windows Update 自动获取，或从 Microsoft Update Catalog 手动下载安装。无临时缓解措施，必须打补丁修复。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows 证书对话框特权提升漏洞"
updated = "2026-06-17T02:28:30Z"

