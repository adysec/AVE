[basic]
description = "PHP 5.3.4 之前版本中的 utf8_decode（xml_utf8_decode）函数存在输入验证漏洞。该函数未能正确处理非最短形式 UTF-8 编码及格式错误的子序列，远程攻击者可通过向目标系统提交特制的 UTF-8 字符串，绕过应用程序的跨站脚本（XSS）和 SQL 注入防护机制，进而实施注入攻击。攻击者无需身份认证即可利用此漏洞，影响范围广泛。"
published = "2010-11-12T21:00:02Z"
remediation = "升级 PHP 至 5.3.4 或更高版本，该版本修复了 utf8_decode 函数对非最短形式 UTF-8 编码及畸形子序列处理不当的问题。如无法立即升级，可在应用层对用户输入进行严格的 UTF-8 合法性校验，过滤非最短形式编码序列，并启用 htmlspecialchars 等输出转义函数防御 XSS。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "PHP utf8_decode 函数输入验证漏洞"
updated = "2026-06-16T23:23:43Z"

