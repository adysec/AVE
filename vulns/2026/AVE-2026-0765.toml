[basic]
description = "Thumbor 是一款开源图片缩略图服务，其 ALLOWED_SOURCES 配置项用于限制 HTTP 加载器可获取图片的域名白名单。由于该配置将纯字符串模式直接传递给 re.match() 而未对点号进行转义，导致域名中的点号被解释为正则通配符，攻击者可通过构造仅在点号位置存在差异的恶意域名绕过白名单限制，实现 SSRF 攻击，从任意主机获取图片资源。该漏洞影响 Thumbor 7.8.0 之前所有版本，攻击者无需认证即可远程利用，CVSS 评分 8.2，危害等级高。官方已在 7.8.0 版本中通过引入 re.escape() 修复此问题。"
published = "2026-07-31T19:17:09Z"
remediation = '立即升级 Thumbor 至 7.8.0 或更高版本（`pip install --upgrade thumbor`），该版本已对 ALLOWED_SOURCES 中的纯字符串模式自动应用 re.escape()。如无法立即升级，将所有 ALLOWED_SOURCES 条目替换为预编译的正则表达式对象（如 `re.compile(r"s\.glbimg\.com")`），并设置 ALLOW_UNSAFE_URL=False 以限制用户直接传入图片 URL。'
score = 8.2
severity = "HIGH"
sources = ["ghsa"]
title = "Thumbor ALLOWED_SOURCES 正则表达式未转义导致 SSRF 防护绕过漏洞"
updated = "2026-08-01T00:17:16Z"

