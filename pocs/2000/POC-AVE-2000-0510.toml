[info]
author = "AVE"
description = "检测Netscape Communicator 4.x处理特制JPEG图片注释字段时的堆溢出漏洞。通过构造包含非法长度字段(值为1)的JPEG注释块，触发堆内存越界写入，导致拒绝服务或任意代码执行。"
id = "POC-AVE-2000-0510"
name = "Netscape Communicator JPEG-Comment Heap Overwrite PoC"
severity = "high"
tags = ["cve-2000-0655"]
vuln_id = [
    "CVE-2000-0655",
    "AVE-2000-0510",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/20098.jpg"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["JFIF"]
