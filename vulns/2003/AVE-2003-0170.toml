[basic]
description = "PHP 4.3.x 版本中 php_check_safe_mode_include_dir 函数在 fopen_wrappers.c 内存在逻辑缺陷，当 php.ini 中未显式配置 safe_mode_include_dir 变量时，该函数返回成功值（0）而非预期的失败值，导致安全模式限制被意外绕过。未经身份认证的远程攻击者可利用这一行为差异，绕过 PHP 安全模式对文件包含路径的限制，进而利用 PHP 应用程序中已有的文件包含漏洞，通过构造特制的包含请求读取敏感系统文件或执行任意代码。该漏洞影响所有启用 safe_mode 但未设置 safe_mode_include_dir 的 PHP 4.3.x 版本，CVSS 评分 7.5，危害等级为高危。"
published = "2003-11-17T05:00:00Z"
remediation = "立即将 PHP 升级至 4.3.3 或更高版本，该版本修复了 php_check_safe_mode_include_dir 函数在未配置 safe_mode_include_dir 时错误返回成功值导致的安全模式绕过问题。如暂时无法升级，应在 php.ini 中显式设置 safe_mode_include_dir 指令为一个有效的目录路径，确保包含目录检查正常工作，同时建议在 Web 应用层对文件包含参数进行严格白名单过滤。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "PHP 4.3.x 安全模式绕过漏洞"
updated = "2026-06-16T22:03:06Z"

