[basic]
description = "BTT Software SNMP Trap Watcher 1.16 版本存在缓冲区溢出漏洞，该漏洞源于程序在处理 SNMP trap 消息时未对输入字符串长度进行严格边界校验。未经身份认证的远程攻击者可通过向目标系统发送包含超长字符串的特制 SNMP trap 数据包来触发此漏洞，成功利用后可导致服务拒绝（DoS），并可能进一步在目标系统上执行任意命令。该漏洞影响所有使用该软件进行 SNMP 监控管理的网络设备和服务。"
published = "2001-08-31T04:00:00Z"
remediation = "建议立即停止使用过时的 BTT Software SNMP Trap Watcher 1.16，并迁移至现代 SNMP 监控方案。若无法立即迁移，应在网络防火墙上配置严格的访问控制列表 (ACL)，仅允许可信管理节点的 IP 地址访问 UDP 162 端口，以防止远程攻击者发送恶意长字符串 Trap 包导致服务崩溃。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "BTT Software SNMP Trap Watcher 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:21Z"

