[basic]
description = "Internet Explorer 5.5及更早版本中的HTML电子邮件功能存在安全漏洞。当攻击者通过设置异常的MIME类型来标记邮件附件时，Internet Explorer未能正确处理该MIME类型，导致附件在未经用户充分确认的情况下被执行。攻击者可通过发送包含恶意附件的HTML格式电子邮件，诱使目标用户打开或预览该邮件，从而在受害者系统上执行任意代码。该漏洞影响所有使用受影响版本Internet Explorer的用户，远程攻击者无需身份认证即可利用此漏洞，对系统机密性、完整性和可用性造成严重影响。"
published = "2001-05-03T04:00:00.000"
remediation = "建议立即安装微软 MS01-020 安全更新补丁 Q290108，或将 Internet Explorer 升级至 5.01 Service Pack 2 及以上版本。Windows 95/98/98SE/ME 用户升级至 IE 6 时需选择 Typical Install 或 Full Install 安装方式。如无法立即升级，可在 IE 安全区域设置中临时禁用文件下载功能以降低风险。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Internet Explorer 电子邮件功能远程代码执行漏洞"
updated = "2026-06-16T21:53:46.457"

