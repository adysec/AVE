[basic]
description = 'Qualcomm qpopper POP 服务器及 RedHat imap、UoW imap 等 POP3 守护进程在创建邮件锁文件时使用可预测的文件名，导致 Improper Locking（不当锁定）。攻击者作为本地用户，可通过在邮件目录下创建以目标用户名加前缀"."和后缀".pop"命名的锁文件（如 /var/mail/.username.pop），或在 /tmp 目录下创建对应锁文件，导致系统无法为目标用户建立邮件连接，从而造成拒绝服务。该漏洞影响 Qualcomm qpopper 2.53/3.0、RedHat imap 4.5-4 中附带的 popd、UoW imap 4.5 popd 以及 FreeBSD imap-uw 端口，可导致合法用户无法正常收取邮件。'
published = "2001-08-31T04:00:00Z"
remediation = "升级 Qualcomm qpopper 至 4.0 或更高版本，该版本已修复锁文件命名可预测问题，采用不可预测的随机文件名防止本地用户恶意创建锁文件。RedHat 用户应升级 imap RPM 包至包含补丁的版本（高于 4.5-4），或应用官方发布的补丁程序修改 popd 使用随机锁文件名。UoW imap 4.5 用户应从官方源代码重新编译已修复该问题的版本。临时缓解措施：限制本地用户对邮件队列目录的写权限，仅允许 pop3 服务用户创建锁文件；监控 /var/mail 和 /tmp 目录下可疑的 .pop 及临时锁文件，发现异常立即删除并追溯来源。"
score = 5.5
severity = "MEDIUM"
sources = ["avd"]
title = "Qualcomm qpopper、RedHat imap、UoW imap 锁文件可预测本地拒绝服务漏洞"
updated = "2026-06-16T21:53:21Z"

