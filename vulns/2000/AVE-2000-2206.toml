[basic]
description = "American Power Conversion (APC) PowerChute 的 HTTP 服务存在默认凭据配置漏洞，允许未经身份认证的远程攻击者使用默认用户名和密码登录系统界面并获取完整访问权限。该漏洞影响 APC PowerChute UPS 管理软件，攻击者可通过浏览器或命令行工具直接访问管理控制台，导致完全的信息泄露、权限劫持及系统配置篡改，CVSS 评分 9.8，危害等级严重。"
published = "2000-12-31T05:00:00Z"
remediation = "立即修改 APC PowerChute Web 界面的默认用户名和密码，使用高强度且唯一的凭据替换出厂默认配置。将 PowerChute 升级至当前最新受支持版本，并确认升级包包含对默认凭据漏洞的修复。若暂时无法升级，通过在防火墙上限制仅允许可信管理网段访问 PowerChute HTTP 管理端口，阻断外部未授权访问。同时启用登录失败锁定与审计日志功能，监控异常登录尝试。"
score = 9
severity = "CRITICAL"
sources = ["avd"]
title = "美国电力转换公司 PowerChute 默认凭据未授权访问漏洞"
updated = "2026-06-16T21:53:27Z"

