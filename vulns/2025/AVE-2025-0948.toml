[basic]
description = "Linux内核rtw89无线网卡驱动存在竞态条件漏洞，原rtwdev->scanning标志位未被互斥锁保护。当cancel_hw_scan与hw_scan完成同时执行时，扫描完成会释放local->hw_scan_req，随后cancel_hw_scan触发空指针解引用与释放后使用漏洞。攻击者需具备本地访问权限，通过构造特定无线扫描操作触发该竞态，可导致内核崩溃或权限提升。该漏洞影响搭载rtw89驱动的Realtek WiFi设备，Linux内核受影响版本需升级至已修复版本。"
published = "2025-02-27T02:15:16.637"
remediation = "立即将 Linux 内核升级至 6.12.12 或 6.13.1 及以上版本，上述版本已通过互斥锁保护 rtwdev->scanning 标志位修复竞态条件。RHEL 用户参考 RHSA-2025:20518  advisories 更新 kernel 包；SUSE 用户参考 SUSE-SU-2025:01964-1、SUSE-SU-2025:01614-1、SUSE-SU-2025:01967-1、SUSE-SU-2025:01951-1 更新 SLES15 SP6/SP7 或 SLED15 内核。若无法立即升级，可临时禁用 rtw89 驱动的硬件扫描功能（echo 0 > /sys/module/rtw89_core/parameters/enable_scan）作为缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 rtw89 竞态条件漏洞"
updated = "2026-06-17T08:44:08.390"

