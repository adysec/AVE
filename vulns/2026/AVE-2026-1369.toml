[basic]
description = "Flowise 是一款用于构建大语言模型流程的拖放式用户界面。在 3.1.3 版本之前，其三个 OAuth2 凭据端点（authorize、callback、refresh）仅凭凭据 ID 查询凭据数据，未执行 workspaceId 工作区隔离过滤，且 callback 与 refresh 端点被列入认证白名单而跳过身份验证。此缺陷导致：已认证用户可通过 authorize 端点访问其他工作区的凭据元数据（包括 client_id、scope、redirect_uri），未认证攻击者可通过 callback 端点伪造 OAuth2 回调写入任意令牌，以及通过 refresh 端点无认证刷新并窃取任意凭据的有效访问令牌。攻击者只需获取目标凭据的 UUID，即可在无需 Flowise 实例认证的情况下，获取 Microsoft 365、Google Workspace 等外部服务的有效 OAuth2 令牌。该漏洞影响 Flowise 3.1.3 之前的所有版本，已于 3.1.3 版本修复。"
published = "2026-08-04T19:16:54Z"
remediation = "立即升级至 Flowise 3.1.3 或更高版本，该版本已为 OAuth2 凭证路由（/api/v1/oauth2-credential/authorize、/callback、/refresh）添加 workspaceId 作用域过滤，修复跨工作区凭证访问漏洞。如暂无法升级，可暂时移除 /callback 与 /refresh 端点免认证白名单，或通过反向代理限制仅内部网络访问这两个接口，阻止未授权调用。同时检查现有 OAuth2 凭证配置，确认无异常 token 注入或泄露迹象，并启用 API 密钥或 JWT 认证强制校验所有请求来源。"
score = 7.6
severity = "HIGH"
sources = ["ghsa"]
title = "Flowise OAuth2 凭证身份验证绕过漏洞"
updated = "2026-08-05T15:17:08Z"

