[basic]
description = "Cisco Catalyst 4500 系列和 Catalyst 4500-X 系列交换机的双向转发检测（BFD）卸载实现存在安全漏洞。该漏洞源于对不完整 BFD 报文的错误处理不足，未经身份认证的远程攻击者可通过向受影响交换机发送特制的 BFD 消息，触发 iosd 进程崩溃，导致拒绝服务（DoS）条件。成功利用该漏洞可导致系统重载。受影响设备包括 Catalyst 4500 Supervisor Engine 6-E/6L-E/7-E/7L-E/8-E/8L-E/9-E 系列引擎、Catalyst 4500-X 系列交换机、Catalyst 4900M 及 Catalyst 4948E 以太网交换机。CVSS 评分 8.6，危害等级高。"
published = "2018-03-28T22:29:00Z"
remediation = "升级至 Cisco 官方修复版本：Catalyst 4500 系列升级至 IOS 15.2(1)E 或更高版本，Catalyst 4500-X 系列升级至 IOS XE 3.5.0E 或更高版本。如不使用 BFD 功能，可在全局配置模式下执行 `feature bfd disable` 命令禁用 BFD 以消除风险；如必须使用 BFD，可通过 Control Plane Policing (CoPP) 仅允许已知 BFD 对等体的报文，丢弃其他 BFD 流量作为临时缓解措施。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），需在 2022 年 3 月 17 日前完成修复。"
score = 8.6
severity = "HIGH"
sources = ["kev"]
title = "Cisco Catalyst 4500/Catalyst 4500-X 双向转发检测卸载实现拒绝服务漏洞"
updated = "2026-06-17T01:29:57Z"

