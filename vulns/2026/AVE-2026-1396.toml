[basic]
description = "Ghost 是一款基于 Node.js 开发的内容管理系统（CMS）。在 v2.2.0 至 v6.54.0 版本中，Ghost Admin 管理后台在用户登录时未作废已存在的会话，导致攻击者可通过会话固定（Session Fixation）攻击劫持目标管理员会话。攻击者需先获取一个预设会话标识，诱骗目标管理员使用该标识登录，从而在登录后接管该会话以执行管理操作。成功利用此漏洞的前提是目标站点所在域名存在其他漏洞，可供攻击者利用来预设或注入会话标识。该漏洞影响所有使用受影响版本 Ghost 的站点，CVSS 评分 6.7（中等）。Ghost 已在 v6.54.1 中修复此问题，用户应尽快升级至最新版本。"
published = "2026-08-04T22:17:17Z"
remediation = "立即将 Ghost 升级至 v6.54.1 或更高版本以修复会话固定漏洞。Docker 自托管用户请执行 docker pull ghost:latest 后重启容器；Ghost-CLI 安装用户请运行 ghost update。如暂时无法升级，可在反向代理层添加配置，强制 Ghost Admin 登录后使所有旧 session 失效，并缩短 session 有效期至最低值作为临时缓解措施。"
score = 6.7
severity = "MEDIUM"
sources = ["ghsa"]
title = "Ghost Ghost Admin 会话固定漏洞"
updated = "2026-08-05T15:17:16Z"

