[basic]
description = "Flowise 是一款拖拽式大语言模型流程构建工具，其 3.1.0 之前版本中的 CSVAgent 功能允许用户提供自定义 Pandas CSV 读取代码，由于缺乏对输入内容的有效过滤与消毒，攻击者可通过构造包含命令注入载荷的恶意 CSV 读取代码，该载荷会被服务器插值执行，导致远程代码执行。攻击者只需低权限即可利用，无需用户交互，CVSS 评分 9.4，危害等级严重。官方已在 3.1.0 版本中修复此漏洞。"
published = "2026-04-23T20:16:14Z"
remediation = "立即升级 Flowise 至 3.1.0 或更高版本，该版本已修复 CSVAgent 中 Pandas CSV 读取代码的命令注入漏洞。如无法立即升级，可暂时禁用 CSVAgent 功能，或在部署层面限制 API 访问权限，仅允许受信用户调用 CSVAgent 接口。"
score = 9.4
severity = "CRITICAL"
sources = ["zdi"]
title = "Flowise Flowise CSVAgent命令注入漏洞"
updated = "2026-06-17T10:46:13Z"

