[basic]
description = "Mozilla Firefox/Thunderbird/SeaMonkey 的 JavaScript 沙箱工具实现存在权限提升漏洞。远程攻击者可通过构造特制的 javascript: URL，在沙箱外以提升的权限执行任意 JavaScript 代码，完全绕过安全沙箱限制。该漏洞影响 Firefox 4.x 至 13.0、Firefox ESR 10.x 至 10.0.5、Thunderbird 5.0 至 13.0、Thunderbird ESR 10.x 至 10.0.5 及 SeaMonkey 2.11 之前版本，CVSS 评分 10.0，危害等级严重。攻击无需身份认证，利用复杂度低，可导致机密性、完整性和可用性完全丧失。"
published = "2012-07-18T10:26:49.250"
remediation = "升级 Firefox 至 14.0 及以上版本，Firefox ESR 升级至 10.0.6 及以上版本；Thunderbird 升级至 14.0 及以上版本或 ESR 10.0.6；SeaMonkey 升级至 2.11 及以上版本。无法立即升级时，禁用 JavaScript（about:config 中设置 javascript.enabled=false）作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey JavaScript沙箱绕过权限提升漏洞"
updated = "2026-06-16T23:40:41.860"

