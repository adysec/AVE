[basic]
description = "RealNetworks RealPlayer 存在堆缓冲区溢出漏洞（CVE-2010-4380），该漏洞源于程序在处理特制 SOUND 文件时未正确验证输入边界，导致堆内存被覆盖。攻击者可通过诱导用户打开恶意构造的 SOUND 媒体文件触发漏洞，实现远程代码执行，完全控制受害系统。受影响版本包括 RealPlayer 11.0-11.1、RealPlayer SP 1.0-1.1.4 及 RealPlayer Enterprise 2.1.2。CVSS 评分 9.3（AV:N/AC:M/Au:N/C:C/I:C/A:C），属高危漏洞，需升级至 12.0.1.609 或更高版本修复。"
published = "2010-12-14T16:00:04Z"
remediation = "建议立即升级 RealPlayer 至 12.0.1.609 或更高版本（RealPlayer 12 及以上版本已修复该漏洞）。若暂时无法升级，请卸载 RealPlayer 或在受信任环境中禁用 SOUND 文件关联，避免打开不可信的 .snd/.au 等音频文件。企业环境可通过组策略禁用 RealPlayer ActiveX 控件（CLSID: CFCDAA03-8BE4-11CF-B84B-0020AFBBCCFA）作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer 堆缓冲区溢出漏洞"
updated = "2026-06-16T23:24:40Z"

