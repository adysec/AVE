[basic]
description = "Apache 2.0.47 之前版本及 Apache 1.3 的 mod_ssl 模块存在弱密码套件降级漏洞。当服务器配置了 per-directory 重新协商机制，并使用 SSLCipherSuite 指令将加密套件从弱密码升级为强密码时，由于重新协商过程中密码套件状态处理不当，Apache 仍可能继续使用原有的弱密码套件进行通信。远程攻击者可通过中间人攻击或劫持已建立的 TLS 连接，利用该漏洞迫使服务器使用较弱的加密算法，从而降低通信安全性，可能导致敏感信息泄露或会话劫持。该漏洞无需身份认证即可远程触发，影响运行 Apache 2.0.47 之前版本及使用 mod_ssl 的 Apache 1.3 版本的系统。"
published = "2003-08-18T04:00:00.000"
remediation = "升级至 Apache 2.0.47 或更高版本（Apache 1.3 用户升级 mod_ssl 至修复版本）。如无法立即升级，在 httpd.conf 中设置 SSLInsecureRenegotiation off 并显式配置 SSLCipherSuite HIGH:!aNULL:!eNULL:!EXP:!LOW:!MEDIUM 以禁用弱密码套件，同时移除所有依赖 per-directory renegotiation 的配置指令。"
score = 6.4
severity = "MEDIUM"
sources = ["redhat"]
title = "Apache HTTP Server SSL/TLS 弱密码漏洞"
updated = "2026-06-16T22:01:43.400"

