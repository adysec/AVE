[basic]
description = "Mantis Bug Tracker 0.15.x、0.16 及 0.17.x 版本中 summary_graph_functions.php 存在远程文件包含漏洞，远程攻击者可通过修改 g_jpgraph_path 参数指向包含恶意 PHP 代码的远程服务器，从而在目标服务器上执行任意 PHP 代码。该漏洞无需身份认证即可利用，CVSS 评分 7.5，影响所有受影响版本的 Mantis Bug Tracker 部署。"
published = "2002-10-04T04:00:00Z"
remediation = "建议立即升级到 Mantis Bug Tracker 0.17.4 或更高版本，该版本已修复 summary_graph_functions.php 中 g_jpgraph_path 参数未正确过滤导致的远程文件包含问题。Debian 用户可参考 DSA-153 安全公告通过 apt-get update && apt-get upgrade 更新。如无法立即升级，建议删除或重命名 summary_graph_functions.php 文件，或在 Web 服务器层面配置规则拦截包含 g_jpgraph_path 参数的请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Mantis 漏洞跟踪系统 JPGraph 远程文件包含漏洞"
updated = "2026-06-16T21:58:45Z"

