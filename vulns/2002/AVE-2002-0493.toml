[basic]
description = "Half-Life Server 1.1.1.0 及更早版本存在资源耗尽型拒绝服务漏洞。远程攻击者无需认证即可向服务器发送大量带有不同 cd_key 值的初始挑战响应数据包，迅速耗尽服务器允许的最大玩家连接数，导致正常玩家无法连接游戏，直至超时后连接槽位释放。该漏洞利用门槛低，仅需发送精心构造的网络数据包即可实施攻击，严重影响游戏服务器的可用性。"
published = "2002-10-04T04:00:00.000"
remediation = "升级 Half-Life 专用服务器至 1.1.1.1 或更高版本（可通过 SteamCMD 获取最新版 Half-Life Dedicated Server）。如无法升级，可在服务器配置中设置 `sv_maxrate` 和 `sv_minrate` 限制单 IP 连接速率，并启用 `sv_logblocks 1` 记录异常连接请求以辅助监控。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Valve Software Half-Life Server 拒绝服务漏洞"
updated = "2026-06-16T21:58:28.330"

