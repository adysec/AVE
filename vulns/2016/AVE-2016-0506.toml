[basic]
description = "Trihedral VTScada（原 VTS）的 WAP 接口存在越界读取漏洞，远程攻击者无需认证即可通过发送特制请求触发该漏洞，导致应用程序崩溃，造成拒绝服务。该漏洞影响 VTScada 8.x 至 11.2.01 版本，CVSS 评分 7.5，危害等级高。厂商已在 11.2.02 版本中修复此漏洞。"
published = "2016-06-09T10:59:04Z"
remediation = "立即将 Trihedral VTScada 升级至 11.2.02 或更高版本。如无法立即升级，可在网络边界防火墙配置访问控制规则，限制仅信任 IP 段可访问 WAP 接口（默认端口 80/443），并禁用不必要的公网暴露面以降低被攻击风险。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Trihedral VTScada WAP接口越界读取拒绝服务漏洞"
updated = "2026-06-17T00:47:42Z"

