[basic]
description = "CoffeeCup Direct和Free FTP客户端使用弱加密算法将用户密码存储在FTPServers.ini配置文件中。攻击者若能本地访问该配置文件，可轻易解密其中存储的FTP服务器密码，进而获取未授权的FTP访问权限。该漏洞利用条件为攻击者需具有本地文件读取权限，属于本地低复杂度攻击，无需用户交互。"
published = "2001-02-12T05:00:00.000"
remediation = "建议立即停止使用CoffeeCup Direct和Free FTP客户端，改用FileZilla、WinSCP等支持强加密存储密码的现代FTP客户端。如无法立即替换，应删除FTPServers.ini文件中存储的密码，并限制该文件的访问权限仅允许当前用户读取。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "CoffeeCup FTP客户端过弱密码加密漏洞"
updated = "2026-06-16T21:53:39.683"

