[basic]
description = "Google Chrome 70.0.3538.64 之前版本中的 V8 JavaScript 引擎存在不正确的副作用注释（Incorrect side effect annotation）漏洞，导致 Object.create 类型混淆（Type Confusion）。远程攻击者可通过构造特制的 HTML 页面，诱使用户访问后触发该漏洞，从而在沙箱内执行任意代码。该漏洞影响所有 Chrome 70.0.3538.64 之前版本，CVSS 评分 8.8，危害等级高，且已被 CISA 列入已知被利用漏洞目录。"
published = "2018-11-14T15:29:00Z"
remediation = "升级 Google Chrome 至 70.0.3538.64 及以上版本，可通过 Chrome 设置 > 关于 Chrome > 自动检查更新完成升级。如无法立即更新，可在浏览器中禁用 V8 JIT 编译（通过 --jitless 启动参数）作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome V8 类型混淆远程代码执行漏洞"
updated = "2026-06-17T01:45:53Z"

