[basic]
description = "CacheFlow CacheOS 3.1/4.0 的 Web 管理界面存在信息泄露漏洞。远程攻击者可通过发送一系列不以 HTTP/1.0 或其他版本字符串结尾的 GET 请求，触发错误消息泄露敏感信息（如缓存页面代码）。该漏洞影响 CacheFlow CacheOS 4.0.13 及更早版本，CVSS 评分 5.0，危害等级中等。攻击无需身份认证，利用难度较低，可导致敏感配置或缓存数据暴露。"
published = "2002-03-25T05:00:00Z"
remediation = "升级CacheOS至4.0.13之后的版本以修复该漏洞；如无法立即升级，在防火墙或反向代理层面限制对Web管理端口（默认8081）的访问，仅允许受信IP地址连接，并配置Web服务器过滤不完整HTTP请求。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "CacheFlow CacheOS Web管理界面敏感信息泄漏漏洞"
updated = "2026-06-16T21:56:48Z"

