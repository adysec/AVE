[basic]
description = "etcd的tlsListener.acceptLoop存在资源未限制分配漏洞（CWE-770）。能够访问etcd TLS监听器的网络攻击者可以建立大量TCP连接但不发送ClientHello，每个连接会在etcd服务器进程中生成一个goroutine并无限期阻塞在tls.Conn.Handshake()中，导致goroutine和pending map无限制增长，最终耗尽etcd进程内存，造成etcd集群不可用。当etcd作为Kubernetes的后端存储时，该漏洞还会影响Kubernetes控制平面的可用性。受影响版本包括etcd 3.7.0-alpha.0至3.7.1之前、3.6.0至3.6.14之前以及3.5.33之前的所有版本。攻击者无需身份认证，攻击复杂度低，仅需网络可达即可发起利用。"
published = "2026-01-01T00:00:00Z"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["ghsa"]
title = "etcd TLS 握手 goroutine 内存耗尽拒绝服务漏洞"
updated = "2026-01-01T00:00:00Z"

