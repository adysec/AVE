[basic]
description = "fcheck 文件完整性检查工具在 2.57.59 及更早版本中存在命令注入漏洞，该工具在调用文件签名检查程序时未对用户提供的文件名进行安全的参数转义处理。当具有本地访问权限的攻击者在受监控目录中创建包含 shell 元字符（如分号、管道符或反引号）的文件时，fcheck 在处理该文件签名时会触发任意命令执行。该漏洞影响所有部署了受影响版本 fcheck 的 Unix/Linux 系统，成功利用可导致攻击者以 fcheck 运行用户权限执行任意系统指令，进而窃取敏感数据或获取系统控制权。此漏洞 CVSS 评分为 4.6，危害等级为中等。"
published = "2001-06-27T04:00:00Z"
remediation = "建议立即升级 fcheck 至 2.07.59 或更高版本，该版本将不安全的 open() 管道调用改为多参数 exec() 形式，避免 shell 解释文件名中的元字符。如暂无法升级，临时缓解措施为：仅以 root 身份运行 fcheck 并限制其检查 root 拥有的目录，同时避免使用 -s 开关，防止普通用户写入的文件名被恶意构造执行命令。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Michael A. Gumienny fcheck 命令注入漏洞"
updated = "2026-06-16T21:54:10Z"

