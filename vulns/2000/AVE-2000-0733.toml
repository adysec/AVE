[basic]
description = "NetWin dMailWeb 和 cwMail 2.6g 及更早版本存在身份认证绕过漏洞。远程攻击者可通过在用户名中插入回车符（carriage return）绕过认证机制，利用该服务器进行邮件中继（mail relay），发送垃圾邮件或恶意邮件。该漏洞攻击复杂度低，无需身份认证即可远程利用，影响邮件服务器的正常使用和网络安全。"
published = "2000-06-23T04:00:00Z"
remediation = "建议立即停止使用 NetWin dMailWeb/cwMail 2.6g 及更早版本，迁移至受支持的邮件服务器（如 Postfix、Exim）。若无法立即替换，应在防火墙层面限制对 SMTP 端口（25/TCP）的访问，仅允许受信任 IP 连接，并禁用邮件中继功能。该软件已停止维护，无官方补丁可用，长期使用存在严重安全风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "NetWin dMailWeb 和 cwMail 安全绕过漏洞"
updated = "2026-06-16T21:52:06Z"

