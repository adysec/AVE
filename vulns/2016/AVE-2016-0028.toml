[basic]
description = "WordPress 插件 new-year-firework 1.1.9 版本中存在反射型跨站脚本（XSS）漏洞，该漏洞源于程序未对用户输入进行充分的过滤与转义处理。攻击者可利用该漏洞向目标用户发送特制的恶意链接，当用户点击链接后，恶意脚本将在用户浏览器中执行，导致攻击者能够窃取会话凭证、劫持用户会话或篡改页面内容。攻击条件要求用户交互（点击链接），影响范围涉及机密性与完整性，CVSS 评分 6.1，危害等级中危。"
published = "2016-10-10T20:59:17Z"
remediation = "立即在 WordPress 后台插件管理页面删除并卸载 new-year-firework 插件（该插件已从官方仓库下架且不再维护）。如暂时无法删除，可在 Nginx/Apache 或 WAF 中添加规则，拦截 URL 查询参数中包含 `<script>`、`onerror`、`alert(` 等 XSS 载荷的请求，并启用 Content-Security-Policy 头限制内联脚本执行。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress new-year-firework 插件反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:45Z"

