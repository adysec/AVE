[basic]
description = 'Flowise 的 `executeJavaScriptCode()` 函数存在沙箱逃逸漏洞，位于 `packages/components/src/utils.ts` 第 1755 行。该函数使用 JavaScript 展开运算符合并默认安全配置与用户传入的 `nodeVMOptions`，导致认证用户可覆盖 `require.builtin` 为 `["*"]`，重新启用被禁止的 `child_process`、`fs` 等内置模块。攻击者通过自定义函数节点引入 `flowise-components/dist/src/utils.js`，再次调用 `executeJavaScriptCode()` 并传入恶意配置，在嵌套 VM 中调用 `require("child_process")` 执行任意系统命令，获取 root 权限。漏洞影响 Flowise 3.0.5 至 3.1.1 所有版本，CVSS 4.0 评分 9.4（严重），已在 3.1.3 版本修复。任意持有有效 API Key 的认证用户均可远程利用，可读取加密密钥、JWT 签名密钥并建立持久化访问。'
published = "2026-08-04T16:16:29Z"
remediation = "立即升级 Flowise 至 3.1.3 或更高版本（修复版本），通过 docker pull flowiseai/flowise:latest 更新容器镜像并重新部署。若暂时无法升级，可在反向代理层面限制 /api/v1/node-custom-function 接口仅允许可信 IP 访问，并撤销非必要的 API 密钥以降低攻击面。"
score = 9.4
severity = "CRITICAL"
sources = ["ghsa"]
title = "Flowise Flowise NodeVM 沙箱逃逸远程代码执行漏洞"
updated = "2026-08-04T19:16:53Z"

