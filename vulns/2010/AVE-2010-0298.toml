[basic]
description = "Apple Safari 浏览器所基于的 WebKit 引擎在处理 JavaScript 数组索引时存在整数符号错误（CWE-189），攻击者可通过构造包含特制数组索引的恶意网页利用该漏洞。成功利用后可导致远程代码执行或应用程序崩溃拒绝服务。受影响版本包括：Mac OS X 10.5 至 10.6 和 Windows 系统上的 Safari 5.0.1 之前版本，以及 Mac OS X 10.4 上的 Safari 4.1.1 之前版本。该漏洞可通过远程方式触发，攻击者无需预先认证，受害者仅需访问恶意网站即可被攻击。CVSS v3 评分 9.3，危害等级严重。"
published = "2010-07-30T20:30:02Z"
remediation = "立即将 Safari 浏览器升级至 5.0.1 版本（Mac OS X 10.5/10.6 及 Windows 系统）或 4.1.1 版本（Mac OS X 10.4），或通过 Mac App Store 和 Apple 软件更新获取最新安全补丁。临时缓解措施：在 Safari 偏好设置中禁用 JavaScript 执行，并避免访问未知或恶意网站。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 整数符号错误远程代码执行漏洞"
updated = "2026-06-16T23:19:20Z"

