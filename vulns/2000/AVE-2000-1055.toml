[basic]
description = "CS&T CorporateTime for the Web 存在用户名枚举漏洞。该 Web 应用在用户登录时，对无效用户名和无效密码返回不同的错误提示信息，导致远程攻击者无需身份认证即可通过暴力枚举方式逐个尝试用户名，根据服务器返回的差异判断哪些用户名真实存在。攻击者可利用此漏洞收集有效账户信息，为后续密码爆破或针对性攻击提供前提条件。该漏洞影响 CS&T CorporateTime for the Web 相关版本，CVSS 评分 5.0，危害等级中危。"
published = "2000-12-11T05:00:00Z"
remediation = '该产品已停止维护，无官方补丁。建议立即将 CorporateTime 登录页面改为统一错误提示（如仅返回"用户名或密码错误"），避免区分无效用户名和无效密码。同时部署 WAF 规则限制单 IP 登录尝试频率（如 5 次/分钟），并监控异常登录请求日志。长期建议迁移至仍在维护的日历系统。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "CS&T CorporateTime Web 用户名枚举漏洞"
updated = "2026-06-16T21:53:00Z"

