[basic]
description = "Ultraseek（又名 Inktomi Search）3.1 及 3.1.10 版本的搜索引擎存在输入验证缺陷，远程攻击者无需身份认证即可通过向目标服务器发送特制的畸形 URL 请求触发该漏洞，导致搜索引擎服务进程崩溃，造成拒绝服务。该漏洞仅影响可用性，不影响机密性和完整性，攻击复杂度低，但需要攻击者构造特定的 URL 格式才能触发。"
published = "2000-12-11T05:00:00Z"
remediation = "升级至 Inktomi Search 4.0 或更高版本。Solaris 平台从 ftp://ftp.ultraseek.com/pub/InktomiSearch/4.0.0/ 下载对应安装包；Windows NT 下载 InktomiSearch-winnt-4.0.0.exe 安装；Linux 使用 rpm -Uvh InktomiSearch-linux-4.0.0.i386.rpm 升级；HP-UX 解压 InktomiSearch-hpux-4.0.0.tar.gz 后执行安装脚本。如无法升级，可在防火墙或主机层面限制对搜索引擎默认端口 8765 的访问，仅允许可信 IP 连接。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Inktomi Ultraseek 搜索软件畸形URL拒绝服务漏洞"
updated = "2026-06-16T21:52:59Z"

