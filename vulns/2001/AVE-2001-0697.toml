[basic]
description = "HP MPE/iX 6.5 及更早版本中的 linkeditor 工具存在安全漏洞，本地用户可利用该漏洞提升系统权限。攻击者需先获得目标系统的本地访问权限，通过构造特定输入或利用 linkeditor 的权限检查缺陷，可绕过原有权限限制获取更高权限，进而对系统进行未授权操作。该漏洞影响 HP MPE/iX 6.5 及更早版本系统，CVSS 评分 4.6，危害等级为中危。"
published = "2001-05-03T04:00:00Z"
remediation = "立即安装对应版本的 HP 安全补丁：若运行 MPE/iX 6.5，安装补丁 LNKLXG1A；若运行 MPE/iX 6.0，安装 LNKLXG1B；若运行 MPE/iX 5.5，安装 LNKLXG1C。如系统为 MPE/iX 4.5 或 5.0，HP 未提供补丁，建议升级至受支持版本。补丁安装前，可通过文件权限设置限制非授权用户对 linkeditor 程序的访问权限，作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "HP MPE/iX 本地用户权限提升漏洞"
updated = "2026-06-16T21:54:00Z"

