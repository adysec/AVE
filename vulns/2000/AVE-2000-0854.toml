[basic]
description = "Auction Weaver CGI 脚本 1.03 及更早版本中存在路径遍历漏洞，远程攻击者无需身份认证即可通过向 fromfile 参数传入 `../` 等目录跳转序列，绕过路径限制读取服务器上的任意文件，导致敏感信息泄露。该漏洞利用难度低，仅需构造特制 HTTP 请求即可触发，影响运行 Auction Weaver CGI 脚本的 Web 服务器。"
published = "2000-10-20T04:00:00.000"
remediation = "建议升级 Auction Weaver CGI 脚本至 1.03 以上版本（如厂商已发布修复版本），或在 CGI 脚本中对 fromfile 参数进行严格的路径规范化过滤，拒绝包含 `../` 等目录遍历序列的输入。若无法升级，建议移除该 CGI 脚本或通过 Web 服务器访问控制限制其访问来源。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Auction Weaver CGI脚本 任意文件读取漏洞"
updated = "2026-06-16T21:52:16.047"

