[basic]
description = "Oracle WebLogic Server 的 wls9_async_response.war 和 wls-wsat.war 组件存在 Java 对象不安全反序列化漏洞，远程未认证攻击者可通过 HTTP 协议向目标服务器发送特制的 Java 序列化对象，触发反序列化缺陷从而在 Web 服务器上下文中执行任意 Java 代码，进而完全接管 Oracle WebLogic Server。该漏洞影响 WebLogic Server 10.3.6.0.0、12.1.3.0.0 和 12.2.1.3.0 等版本，CVSS 评分 9.8（严重等级）。攻击者无需任何身份认证即可在网络可达的情况下利用此漏洞，成功利用可导致服务器被完全控制。"
published = "2019-06-19T23:15:10.003"
remediation = "立即安装 Oracle 2019 年 7 月关键补丁更新（CPU）中针对 WebLogic Server 的安全补丁，受影响版本 10.3.6.0.0、12.1.3.0.0、12.2.1.3.0 需分别下载对应补丁并通过 OPatch 工具进行安装，补丁下载地址见 Oracle My Oracle Support Note 2555019.1。如无法立即安装补丁，可采取临时缓解措施：将 WebLogic 域中 %WL_HOME%/server/lib/wls9_async_response.war 和 %WL_HOME%/server/lib/wls-wsat.war 文件删除或移出部署目录，并重启 WebLogic Server，同时通过防火墙限制对 WebLogic HTTP 端口（默认 7001/443）的外部访问。完成补丁安装后需验证 WebLogic Server 版本已更新，并通过 Nuclei 或 ExploitDB 中的 PoC 验证漏洞已修复。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Oracle WebLogic Server 反序列化远程代码执行漏洞"
updated = "2026-06-17T02:34:27.240"

