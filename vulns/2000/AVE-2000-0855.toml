[basic]
description = "OpenSSL 在 0.9.6 及之前版本中，crypto/rsa/rsa_gen.c 文件对 C 语言位运算移位操作的处理存在缺陷，当移位长度超过表达式大小时未能正确处理，导致生成的 RSA 密钥可能不符合预期强度。该漏洞影响运行在 64 位 HP-UX 平台上的 OpenSSL，未经身份认证的远程攻击者可利用此缺陷绕过加密保护机制，通过触发不正确的 RSA 密钥生成来削弱系统加密强度，从而更容易破解加密通信或伪造数字签名。"
published = "2016-05-05T01:59:00Z"
remediation = "升级 OpenSSL 至 0.9.6 或更高版本，以修复 crypto/rsa/rsa_gen.c 在 64 位 HP-UX 平台上处理位运算移位时导致的 RSA 密钥生成缺陷。如暂无法升级，可临时在防火墙层禁用相关 SSL/TLS 服务，或避免在 64 位 HP-UX 系统上运行受影响版本。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "OpenSSL RSA密钥生成弱加密漏洞"
updated = "2026-06-16T21:53:27Z"

