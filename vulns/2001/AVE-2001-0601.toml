[basic]
description = "tags.<value>Sun Cluster 2.x 中的 clustmon 服务未对远程访问进行身份认证，攻击者无需任何凭据即可通过发送特制网络请求直接获取系统日志与集群配置等敏感信息。该漏洞影响所有运行 clustmon 服务的 Sun Cluster 2.x 版本，攻击者只需在网络可达的前提下发送简单查询请求即可实现信息泄露，进而为后续针对性攻击提供关键情报。"
published = "2001-02-12T05:00:00.000"
remediation = "升级到 Sun Cluster 3.0 或更高版本，该版本已修复 clustmon 服务无需认证即可访问的安全问题。如暂时无法升级，应立即联系 Sun 技术支持获取适用于 Sun Cluster 2.x 的安全补丁并安装。对于无需 clustmon 监控功能的系统，可直接停止 clustmon 服务并在 `/etc/inetd.conf` 中注释掉 clustmon 相关条目，防止远程未授权访问系统日志和集群配置信息。同时应在防火墙层限制对 clustmon 服务端口的访问。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Sun Cluster clustmon 服务未认证信息泄露漏洞"
updated = "2026-06-16T21:53:36.787"

