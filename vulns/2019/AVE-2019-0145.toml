[basic]
description = "Cisco Small Business 200、300和500系列交换机的Web界面存在输入验证错误漏洞。未经身份认证的远程攻击者可利用该漏洞，通过拦截并篡改用户的HTTP请求参数，诱导Web界面将用户重定向至恶意URL。该漏洞属于开放重定向攻击类型，攻击者可借此发起钓鱼攻击，诱使用户在不知情的情况下访问恶意网站，从而窃取凭据或传播恶意软件。该漏洞影响上述交换机系列的所有受影响固件版本，CVSS评分为4.7（中等），利用条件较为苛刻但危害不容忽视。"
published = "2019-07-17T21:15:12.453"
remediation = "升级到最新的 Cisco Small Business 系列交换机固件版本（具体版本为 TM_v1.2.0.0 及以上），以获取官方发布的输入验证修复补丁。配置上，在 web 管理界面中禁用 Open Redirect 功能：进入系统配置→Web 界面→安全设置→取消勾选“允许重定向功能”并应用设置。如无法立即升级固件，可通过 ACL 策略阻止非法 HTTP 请求流量到交换机管理端口，作为临时缓解措施。"
score = 4.7
severity = "MEDIUM"
sources = ["nuclei"]
title = "Cisco Small Business 200、300和500交换机 开放重定向漏洞"
updated = "2026-06-17T02:29:39.587"

