[info]
author = "ave"
description = "验证目标系统是否为 Recourse ManTrap 蜜罐。ManTrap 通过内核模块阻止 /proc 文件系统为隐藏进程创建条目。本 PoC 通过检查 /proc/.. 目录条目是否存在，以及对比 kill() 系统调用返回的进程列表与 /proc 中的实际条目，检测隐藏进程从而识别蜜罐环境。"
id = "POC-AVE-2000-0822"
name = "ManTrap 1.6.1 隐藏进程信息泄露 PoC"
severity = "low"
tags = ["ave-2000-0822"]
vuln_id = [
    "CVE-2000-1140",
    "AVE-2000-0822",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/proc/.."
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [".."]

[[poc.requests]]
path = "/proc/1"
protocol = "file"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
