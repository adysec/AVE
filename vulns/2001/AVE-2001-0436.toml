[basic]
description = "Merit AAA RADIUS Server 3.8M、5.01 及可能其他版本中的 rlmadmin RADIUS 管理工具存在符号链接漏洞。本地攻击者可通过在 rlmadmin.help 文件上创建符号链接，诱使程序读取任意系统文件，导致敏感信息泄露。该漏洞利用条件为拥有本地访问权限，攻击复杂度低，但仅影响本地用户权限范围内的文件读取。厂商 Merit 至今未发布官方补丁，建议限制本地用户对 rlmadmin 工具的访问权限。"
published = "2001-09-07T04:00:00Z"
remediation = "该漏洞源于 rlmadmin 管理工具以 setuid root 运行且未校验帮助文件是否为符号链接，导致本地用户可读取任意系统文件（如 /etc/shadow）。建议立即移除 rlmadmin 的 setuid 权限：chmod u-s /usr/private/etc/rlmadmin；同时限制可执行目录权限为仅 root 可访问：chmod 700 /usr/private/etc。如业务允许，建议迁移至 FreeRADIUS 等仍在维护的 RADIUS 服务器替代 Merit AAA Server。"
score = 2.1
severity = "LOW"
sources = ["exploitdb"]
title = "Merit AAA RADIUS Server rlmadmin 符号链接漏洞"
updated = "2026-06-16T21:55:23Z"

