[basic]
description = '三星部分设备在 UICC 智能卡上集成了 SIMalliance Toolbox Browser（即 S@T Browser），该组件在解析通过 SMS 短信发送的 SIM Toolkit（STK）指令时存在安全缺陷，即"Simjacker"漏洞。远程攻击者可向目标设备发送包含恶意 STK 指令的短信，在无需用户交互的前提下触发该缺陷，从而检索设备的地理位置信息和 IMEI 标识，甚至可读取其他敏感数据或执行特定指令。该漏洞 CVSS 评分 9.8，危害等级为严重，主要影响使用三星 UICC 相关组件并通过运营商短信通道传播攻击场景的移动设备。厂商建议用户及时安装系统更新并警惕来自未知号码的短信。'
published = "2019-09-12T13:15:10Z"
