[basic]
description = "veraPDF PDF 解析器在处理 Type 1 字体的 /FontFile 字体程序时存在拒绝服务漏洞。该漏洞源于 veraPDF-parser 的 PostScript 解释器对 array N 分配操作、for 循环的零增量以及用户字典递归查找均未做限制，远程攻击者只需向目标系统提交一个包含恶意 Type 1 字体程序的 PDF 文件，即可触发无限内存分配、无限循环或栈溢出，导致验证器内存耗尽、CPU 耗尽或进程崩溃。该漏洞影响 veraPDF-parser 1.30.2 之前及 1.31.23 之前的所有版本，CVSS 评分 6.9，危害等级中危。官方已在 1.30.2 和 1.31.23 版本中修复此漏洞。"
published = "2026-07-29T16:17:53Z"
remediation = "立即升级 veraPDF-parser 至 1.30.2 或 1.31.23 及以上版本，这两个版本已修复 Type1 字体程序中 PostScript 数组分配、零增量循环和递归查找导致的拒绝服务漏洞。如无法立即升级，可在 PDF 解析入口处增加超时机制和内存上限限制，并过滤包含 Type1 字体的 PDF 文件作为临时缓解措施。"
score = 6.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "veraPDF veraPDF-parser PostScript Type 1 字体程序解析拒绝服务漏洞"
updated = "2026-07-30T19:23:14Z"

