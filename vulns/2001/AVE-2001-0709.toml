[basic]
description = "tags only.<value>Olivier Debon Flash 插件（非 Macromedia 官方插件）在处理 SWF 动画文件中的 DefineSound 标签时，未对标签数据长度进行充分校验，攻击者构造包含超长 DefineSound 标签的恶意 SWF 文件并诱导用户通过浏览器打开，即可触发缓冲区溢出，导致浏览器或插件进程崩溃造成拒绝服务，在特定环境下还可借溢出改写内存数据进而执行任意代码。该漏洞影响 Olivier Debon Flash 插件 0.4.9 及更早版本，利用方式为被动诱导用户访问恶意 Flash 内容，需用户交互配合，无法远程自动触发。漏洞 CVSS 评分 7.6，危害等级为高。"
published = "2001-03-12T00:00:00Z"
remediation = "请立即将 Macromedia Flash Player 升级到 5.0.41（r41）及以上版本，该版本修复了读取畸形 SWF 文件头部时发生的缓冲区溢出问题。由于该版本已停止支持且影响范围广，建议在不需要 Flash 的场景下彻底卸载 Flash Player 插件，并在 IE 浏览器中禁用或删除相关 ActiveX 控件（通过 Internet 选项→程序→管理加载项禁用）。对于必须保留 Flash 的客户端，通过防火墙/组策略仅允许访问受信任站点，且不要在浏览器中打开来源不明的 .swf/.exe 文件，降低被利用风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Macromedia Flash 缓冲区溢出拒绝服务与任意代码执行漏洞"
updated = "2001-03-12T00:00:00Z"

