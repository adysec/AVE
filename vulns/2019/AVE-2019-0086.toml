[basic]
description = "L-Soft LISTSERV 在 16.5-2018a 之前版本存在反射型跨站脚本（XSS）漏洞，攻击者可构造包含恶意 JavaScript 代码的特制 URL，通过 /scripts/wa.exe 脚本的 OK 参数注入脚本。当用户点击该链接后，脚本会在其浏览器中执行，可导致会话劫持、敏感信息窃取或页面内容篡改。该漏洞影响所有使用受影响版本 LISTSERV 的站点，攻击条件为远程网络访问、攻击复杂度低且无需权限，但需要用户交互（点击链接）才能触发利用。由于 XSS 脚本在用户浏览器上下文中执行，攻击者可窃取管理员凭证或冒充用户执行未授权操作。"
published = "2019-08-26T14:15:10.907"
remediation = "建议立即升级 L-Soft LISTSERV 至 16.5-2018a 或更高版本，可从官方网站 lsoft.com 下载最新安装包并按升级指南操作。若暂时无法升级，可在 Web 应用防火墙（WAF）层面配置规则过滤 /scripts/wa.exe 路径下 OK 参数中的脚本载荷（如 <script>、onerror 等），或通过反向代理拦截包含恶意 XSS 载荷的请求作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "L-Soft LISTSERV 跨站脚本漏洞"
updated = "2026-06-17T02:20:29.757"

