[basic]
description = "Netscape Directory Server 4.12 及 iPlanet Certificate Management System 4.2 存在目录遍历漏洞。由于服务器在处理 Agent、End Entity 和 Administrator 服务的路径请求时未对 `..`（点点）序列进行充分过滤，远程攻击者可通过在 URL 中注入目录遍历序列来读取服务器上的任意文件，导致敏感信息泄露。攻击无需身份认证，仅需向受影响服务发送特制 HTTP 请求即可触发。"
published = "2000-12-11T05:00:00Z"
remediation = "升级到 Netscape Directory Server 4.13 或更高版本，或迁移至 Red Hat Directory Server / 389 Directory Server。如无法升级，在反向代理层限制 URL 路径中禁止包含 `..` 序列，并限制 Agent/End Entity/Administrator 服务的访问来源 IP。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Netscape iPlanet Directory Server 和 Certificate Management System 目录遍历漏洞"
updated = "2026-06-16T21:53:05Z"

