[basic]
description = "Linux 内核 Open vSwitch（OVS）子系统中存在无限循环漏洞。当网络设备正在注销（unregistering）过程中，其发送队列数归零，而 OVS 数据路径在发送数据包时未正确检查设备状态，导致 `skb_tx_hash` 函数中的哈希校验循环陷入无限循环，引发内核核心锁定。该漏洞影响使用 OVS 的 Linux 系统，攻击者无需身份认证，只要在目标设备处于注销状态时向其发送特制数据包即可触发内核死锁，系统将完全失去响应，唯一恢复方式为重启机器。"
published = "2025-01-31T12:15:29Z"
remediation = "立即升级 Linux 内核至包含修复的稳定版本。该漏洞位于 Open vSwitch 数据路径，当向正在注销的网络设备发送数据包时，因未同时检查设备运行状态导致内核无限循环锁死。上游修复已回移植至 6.1.127、6.6.74 及 6.12.11。主流发行版修复版本：Ubuntu 22.04 LTS HWE 内核升级至 6.8.0-64.67~22.04.1（执行 apt update && apt upgrade linux-image-hwe-6.8）；Ubuntu 24.04 LTS 升级至 6.8.0-62.65（执行 apt update && apt upgrade linux-image）；SUSE Linux Enterprise 15 应用 SUSE-SU-2025:0847-1（执行 zypper patch）。升级后必须重启系统。如暂时无法升级，可通过固定 Open vSwitch 端口配置、避免动态注销网络设备来降低触发概率。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel Open vSwitch 无限循环拒绝服务漏洞"
updated = "2026-06-17T08:44:00Z"

