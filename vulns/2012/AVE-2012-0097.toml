[basic]
description = "Apple WebKit 存在内存破坏漏洞，远程攻击者可通过诱导用户访问特制网站触发内存损坏，导致任意代码执行或应用程序崩溃。该漏洞影响 iOS 5.1 之前版本、iTunes 10.6 之前版本及 Safari 5.1.4 之前版本，属于典型的 WebKit 内存处理缺陷，攻击无需身份认证，用户交互仅需访问恶意网页即可触发，CVSS 评分 9.3，危害等级严重。"
published = "2012-03-08T22:55:03Z"
remediation = "将 Apple Safari 升级至 5.1.4 或更高版本，将 Apple iOS 升级至 5.1 或更高版本，将 Apple iTunes 升级至 10.6 或更高版本。无法立即升级时，可配置 Web 内容过滤或禁用 JavaScript 作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:55Z"

