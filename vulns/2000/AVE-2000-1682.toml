[basic]
description = "Mobius DocumentDirect for the Internet 1.2 的 ddicgi.exe 程序中存在缓冲区溢出漏洞。远程攻击者无需任何身份认证，通过向目标系统发送超长 GET 请求即可触发缓冲区溢出，导致任意命令执行。该漏洞 CVSS 评分 10.0，攻击复杂度低，可完全控制目标系统的机密性、完整性和可用性，危害极为严重。受影响版本为 Mobius DocumentDirect for the Internet 1.2。"
published = "2000-11-14T05:00:00Z"
remediation = "立即停用或升级 Mobius DocumentDirect for the Internet 至不受此漏洞影响的版本。该产品已停止维护，建议彻底移除 ddicgi.exe 组件并迁移至替代方案。如无法立即下线，在 Web 服务器（IIS/Apache）层面限制对 ddicgi.exe 的 GET 请求 URL 长度不超过 256 字节，并在防火墙或反向代理处限制仅允许可信 IP 访问该 CGI 路径。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Mobius DocumentDirect for the Internet 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:32Z"

