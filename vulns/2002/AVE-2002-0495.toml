[basic]
description = "AnalogX SimpleServer:WWW 1.16 及更早版本存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向目标 Web 服务器发送超长的 HTTP 请求方法名（method name）触发该漏洞，导致服务崩溃（拒绝服务）或执行任意代码。该漏洞影响 AnalogX SimpleServer:WWW 全系列早期版本，CVSS 评分 7.5，危害等级高。厂商已发布更新版本修复此漏洞，建议用户升级至 1.17 或更高版本。"
published = "2002-10-04T04:00:00Z"
remediation = "立即升级到 AnalogX SimpleServer:WWW 1.23 或更高版本（最新版为 1.24），该版本已修复大字符串命令导致的缓冲区溢出问题。从官网 http://www.analogx.com/contents/download/network/sswww.htm 下载更新。如无法升级，可在防火墙或网络边界限制对服务端口（默认 80）的访问，仅允许可信 IP 连接，以降低远程利用风险。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "AnalogX SimpleServer:WWW 缓冲区溢出漏洞"
updated = "2026-06-16T21:58:28Z"

