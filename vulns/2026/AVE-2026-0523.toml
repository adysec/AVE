[basic]
description = "NVIDIA NeMo Framework 在检查点加载功能中存在反序列化漏洞（CWE-502），由于未对用户提供的检查点数据进行充分验证，攻击者可通过构造恶意的模型检查点文件诱导用户加载，触发反序列化过程中的远程代码执行。成功利用该漏洞可导致代码执行、权限提升、信息泄露及数据篡改。攻击者需具备本地访问权限且需用户交互，CVSS 评分 7.8，危害等级高。"
published = "2026-03-24T21:16:27Z"
remediation = "立即将 NVIDIA NeMo Framework 升级至 2.6.2 或更高版本，可通过 `pip install --upgrade nemo-toolkit>=2.6.2` 或从 https://github.com/NVIDIA/NeMo 拉取最新代码更新。如无法立即升级，应禁止加载来源不可信的 checkpoint 文件，并在加载外部模型检查点时实施严格的输入验证与反序列化白名单机制。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "NVIDIA NeMo Framework 检查点加载远程代码执行漏洞"
updated = "2026-06-17T10:22:43Z"

