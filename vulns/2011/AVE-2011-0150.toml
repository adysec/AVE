[basic]
description = "Google Chrome 14.0.835.163 之前版本的焦点控制器存在使用后释放（Use-after-free）内存错误引用漏洞，攻击者可通过构造与焦点控制器相关的恶意向量，诱导用户访问恶意网页触发该漏洞，导致浏览器崩溃造成拒绝服务，甚至可能实现任意代码执行。该漏洞影响 Chrome 14.0.835.163 之前的所有版本，属于典型的客户端浏览器内存损坏漏洞，攻击者需诱导受害者访问精心构造的恶意页面即可触发，攻击复杂度中等，无需认证即可远程利用，CVSS 评分 6.8（中等偏高危害）。Google 已在 Chrome 14.0.835.163 版本中修复该漏洞，建议用户及时升级浏览器至最新版本以规避风险。"
published = "2011-09-19T12:02:56Z"
remediation = "建议立即升级 Google Chrome 至 14.0.835.163 或更高版本（通过 Chrome 菜单 → 关于 Google Chrome 自动更新）。若无法立即升级，可暂时禁用 JavaScript 或使用浏览器沙箱隔离功能作为临时缓解措施，并避免访问不可信网站。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 内存错误引用漏洞"
updated = "2026-06-16T23:32:07Z"

