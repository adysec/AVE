[basic]
description = 'Oracle Solaris 8/9/10 的 TCP/IP 协议栈实现中存在 ICMP 路径最大传输单元（PMTU）发现机制的安全缺陷。未经身份认证的远程攻击者可通过向两台正在通信的目标主机之间发送伪造的"需要分片但设置了不分片位（DF）"的 ICMP 数据包，诱骗其中一台主机降低至对端发送数据时的 MTU 值，从而导致网络传输性能急剧下降甚至完全中断，造成拒绝服务。该漏洞影响 Solaris 8、9 和 10 版本，攻击复杂度低，无需认证即可远程利用。Oracle 已在后续安全更新中修复此问题，建议用户升级至最新补丁版本。'
published = "2001-06-02T04:00:00Z"
remediation = "建议升级到 Oracle Solaris 10 8/11 或更高版本（已修复该漏洞），或应用 Oracle 发布的补丁 111712-01 (Solaris 8)、113575-01 (Solaris 9)、147440-01 (Solaris 10)。无法立即打补丁时，可执行 `ndd -set /dev/ip ip_path_mtu_discovery 0` 禁用 PMTU 发现功能作为临时缓解措施，重启后需重新设置或写入 /etc/system 持久化。"
score = 6.4
severity = "MEDIUM"
sources = ["cve"]
title = "Oracle Solaris TCP/IP 拒绝服务漏洞"
updated = "2026-06-16T21:54:05Z"

