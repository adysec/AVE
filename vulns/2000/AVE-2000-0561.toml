[basic]
description = "GWScripts News Publisher 1.0 的 news.cgi 程序在处理作者添加请求时存在身份验证缺失漏洞。远程攻击者无需任何认证，只需直接向 new.cgi 程序发送包含 addAuthor 参数的 HTTP POST 请求，并将 Referer 头设置为 news.cgi，即可在作者索引中任意添加新作者，从而获得对新闻发布系统的未授权管理权限。该漏洞攻击复杂度低，利用方式简单，影响系统的完整性和访问控制机制。"
published = "2000-10-20T04:00:00.000"
remediation = "升级 GWScripts News Publisher 至最新版本，或迁移至其他受支持的新闻发布系统。如无法升级，在 Web 服务器层面（如 .htaccess 或 Nginx 配置）限制 `new.cgi` 的访问来源 IP，仅允许管理后台 IP 访问，并添加 HTTP 基本认证保护该脚本。同时检查并清理 `author.file` 中已存在的未授权条目。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "GWScripts News Publisher 未授权添加作者漏洞"
updated = "2026-06-16T21:52:20.387"

