[basic]
description = "Citrix ADC 与 Gateway 存在目录遍历漏洞，未经身份认证的远程攻击者可通过向目标设备的 /vpns/ 目录发送特制的 HTTP 请求，利用路径遍历绕过权限检查，将恶意文件写入服务器任意目录，进而触发 Perl 脚本解析实现远程代码执行。该漏洞影响 Citrix ADC 和 Gateway 10.5、11.1、12.0、12.1 及 13.0 版本，CVSS 评分 9.8，危害等级严重。攻击无需认证，利用复杂度低，已出现大量在野利用和 Metasploit 模块，CISA 已将其列入已知被利用漏洞目录。"
published = "2019-12-27T14:15:12Z"
remediation = "立即升级 Citrix ADC/Gateway 至以下安全版本：ADC 12.1 build 55.18 及以上、ADC 13.0 build 47.24 及以上、ADC 11.1 build 63.9 及以上。如无法立即升级，可在 Citrix ADC 管理界面中禁用 HTTP 到 HTTPS 的重定向功能，并在 NetScaler 上配置响应式规则阻止对 `/vpns/` 目录的异常访问请求作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Citrix ADC 和 Gateway 远程代码执行漏洞"
updated = "2026-06-17T02:27:14Z"

