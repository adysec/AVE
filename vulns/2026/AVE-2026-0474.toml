[basic]
description = "ArcadeDB 数据库引擎在修复 CVE-2026-44221 时仅对 `LocalDocumentType.createProperty` 方法添加了 `UPDATE_SCHEMA` 权限检查，但遗漏了 `DROP PROPERTY`、`ALTER TYPE`（修改继承层级、重命名类型）、`ALTER PROPERTY`（修改字段属性）等多个公开的 Schema 变更方法。已认证的身份（包括只读 API 令牌）即使不具备 `UPDATE_SCHEMA` 权限，仍可通过数据库命令/查询的 HTTP 端点发送 SQL DDL 语句来篡改数据库 Schema，破坏已存储记录的数据语义，并违反 ArcadeDB 文档中声明的权限模型。该漏洞不影响嵌入式模式及系统上下文（如启动时 Schema 加载、HA 复制应用）中的内部路径和管理员操作。"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 ArcadeDB 依赖 com.arcadedb:arcadedb-engine 升级至 26.6.1 或更高版本，该版本已对 LocalDocumentType 和 LocalProperty 所有公开的 schema 变更方法强制执行 UPDATE_SCHEMA 权限检查。Maven 项目修改 pom.xml 中版本号为 26.6.1 后重新构建即可。若暂时无法升级，应在应用层将所有 schema DDL 操作（DROP PROPERTY、ALTER TYPE、ALTER PROPERTY 等）限制为管理员身份执行，并对非可信用户和 API Token 仅授予读取权限，禁止授予写入访问。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "ArcadeDB 数据库模式授权绕过漏洞"
updated = "2026-01-01T00:00:00Z"

