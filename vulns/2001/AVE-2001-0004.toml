[basic]
description = "NetScreen 防火墙 WebUI 存在缓冲区溢出漏洞，远程攻击者可通过向 Web 管理界面发送超长 URL 请求触发该漏洞，导致目标设备拒绝服务。该漏洞影响运行 ScreenOS 1.73 及 2.x 版本的 NetScreen 防火墙设备，攻击无需身份认证，攻击复杂度低，CVSS 评分 5.0。厂商已发布安全更新修复此漏洞。"
published = "2001-02-12T05:00:00Z"
remediation = "建议将 NetScreen ScreenOS 升级至 2.5 及以上版本（该漏洞在 ScreenOS 2.5 中修复）。同时，应将 WebUI 管理接口（默认端口 80/TCP）绑定到内部管理网络，通过 ACL 限制仅允许受信任的管理 IP 地址访问，避免将 WebUI 暴露在公网。如无法升级，可在网络边界防火墙策略中阻断对管理端口 80 的外部访问作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "NetScreen Firewall WebUI 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:53:28Z"

