[basic]
description = "Microsoft 本地数据网关（On-Premises Data Gateway）存在授权不当漏洞（CWE-863），由于对用户权限的验证机制不完善，导致经过身份认证的低权限攻击者可通过网络远程利用该漏洞，结合社会工程手段诱导高权限用户交互，从而越权访问网关连接的后端数据源中的敏感信息，造成信息泄露。该漏洞影响 Microsoft 本地数据网关产品，CVSS 评分 6.4，危害等级中危。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞，建议用户及时升级至最新版本。"
published = "2025-01-14T18:16:04.350"
remediation = "升级 Microsoft On-Premises Data Gateway 至 3000.246 或更高版本。可通过 Microsoft 更新目录或 MSRC 安全更新指南下载安装。如无法立即升级，限制网关管理 API 的访问来源 IP，仅允许受信管理员网络段访问，并启用详细审计日志监控异常数据访问行为。"
score = 6.4
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft On-Premises Data Gateway 信息泄露漏洞"
updated = "2026-06-17T08:43:17.117"

