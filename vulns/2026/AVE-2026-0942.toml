[basic]
description = "goshs 文件服务器的 sendFile 处理函数在解析请求时，从原始 URL 路径提取文件名用于权限校验，但实际打开文件时使用了经过清理的路径。攻击者通过在请求路径末尾添加斜杠，可使权限校验使用的文件名为空字符串，从而绕过 .goshs ACL 文件保护规则和黑名单限制，未授权访问被禁止的文件甚至获取包含管理员 bcrypt 密码哈希的 ACL 配置文件。该漏洞影响 goshs 2.1.5 之前版本，CVSS 评分 5.3，危害等级中危。"
published = "2026-07-28T23:17:10.490"
remediation = "立即将 goshs 升级至 v2.1.5 或更高版本，该版本已修复 sendFile 函数中原始请求路径与清理后路径不一致导致的 ACL 绕过问题。可通过 `go install github.com/goshs-labs/goshs@v2.1.5` 或从 GitHub Releases 下载对应二进制包更新。如无法立即升级，可在反向代理层（如 Nginx）添加规则拦截以斜杠结尾的敏感路径请求作为临时缓解措施。"
score = 5.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "goshs-labs goshs ACL 绕过与路径遍历漏洞"
updated = "2026-07-30T19:19:45.637"

