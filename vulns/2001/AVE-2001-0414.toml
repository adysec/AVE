[basic]
description = "Namazu 2.0.8及更早版本的索引文件命中数显示功能存在跨站脚本漏洞。远程攻击者可通过构造恶意的索引文件名，在显示命中数时注入任意JavaScript代码，导致其他Web用户浏览时执行恶意脚本。该漏洞影响Namazu 2.0.8及更早版本，CVSS评分7.5（高危），攻击向量为网络、攻击复杂度低、无需认证，可导致机密性、完整性、可用性部分受损。攻击者无需认证即可通过构造恶意索引文件名诱导用户访问，触发跨站脚本攻击，窃取用户会话、窃取敏感信息或执行其他恶意操作。建议升级至Namazu 2.0.9及以上版本修复该漏洞。"
published = "2001-12-25T05:00:00Z"
remediation = "建议立即升级到 Namazu 2.0.9 或更高版本（当前最新稳定版为 2.0.21），可从 http://www.namazu.org/stable/ 下载源码重新编译安装。如无法立即升级，可在 Web 服务器层面对搜索结果页的索引文件名输出进行 HTML 实体编码，防止 index 文件名称中的 JavaScript 代码在浏览器中执行，或在防火墙/反向代理层对包含 script、onerror 等关键字的搜索请求参数进行过滤拦截。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Namazu 2.0.8 跨站脚本攻击"
updated = "2026-06-16T21:56:05Z"

