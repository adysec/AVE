[info]
author = "ave"
description = "Apple iTunes 10.7 之前版本使用的 WebKit 引擎存在内存破坏漏洞，未经身份认证的远程攻击者可通过诱导用户访问恶意网页触发该漏洞，导致任意代码执行或拒绝服务（内存损坏与应用崩溃）。该漏洞影响 iTunes 10.7 之前的版本，CVSS 评分 6.8，危害等级中等。攻击条件为受害者需访问攻击者构造的恶意网站，利用 WebKit 引擎在处理网页内容时的内存错误实现代码执行或导致应用崩溃。"
id = "POC-AVE-2012-0351"
name = "CVE-2012-3675 PoC"
severity = "medium"
tags = ["ave-2012-0351"]
vuln_id = [
    "CVE-2012-3675",
    "AVE-2012-0351",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["WebKit"]
