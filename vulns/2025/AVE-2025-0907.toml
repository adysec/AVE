[basic]
description = "Linux 内核 hns3 网络驱动中的 hclge_fetch_pf_reg 函数存在越界读取漏洞。该函数在读取 TQP BAR 空间信息时未区分 TQP 的段地址划分，而 TQP 0-1023 与 1024-1279 位于不同的 BAR 空间地址段。当系统配置的 TQP 数量超过 1024 时，函数会错误地访问超出当前 BAR 空间范围的内存地址，导致内核出现页面错误异常。攻击者若能在拥有本地低权限访问的系统上触发网卡寄存器读取操作（如通过 ethtool -d 等命令），即可导致内核崩溃或信息泄露，影响运行 Linux 内核的华为 hns3 网卡设备。"
published = "2025-01-19T11:15:10Z"
remediation = "建议升级至包含 hns3 驱动修复的 Linux 内核版本。对于华为网络控制器（HNS3）设备，请确保内核版本 ≥ 6.12-rc6 或更高。修复已合并在 2025-01-08 的 hclge_fetch_pf_reg 函数修正中，请更新内核到最新长期支持（LTS）分支，如 Ubuntu 24.04 的 6.11 内核版本或直接应用内核补丁。升级后重启网络服务可恢复设备功能。未能立即更新时，可通过 ethtool 禁用受影响的网卡端口以临时缓解风险。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux kernel hns3 网络驱动 BAR 空间越界访问漏洞"
updated = "2026-07-30T06:17:25Z"

