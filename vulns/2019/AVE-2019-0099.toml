[basic]
description = "CloudBees Jenkins Pipeline:Groovy 插件 2.63 及更早版本中存在沙箱绕过漏洞，攻击者可通过控制 Jenkins 流水线脚本，绕过 Groovy 沙箱安全限制，在 Jenkins 主节点 JVM 上执行任意代码。该漏洞影响使用受影响插件版本的 Jenkins 服务器，攻击者需具备控制流水线脚本的权限（如通过 Jenkinsfile 或 Pipeline 脚本注入），利用后可获得 Jenkins 主节点的完全控制权，进而执行系统级命令、访问敏感凭证或横向移动至其他内部系统。CVSS 评分为 9.9，危害等级严重。"
published = "2019-03-08T21:29:00Z"
remediation = "立即将 Jenkins Pipeline: Groovy Plugin（workflow-cps）从 2.63 及以下版本升级至 2.64，同时将 Script Security Plugin 从 1.53 及以下版本升级至 1.54，以修复沙箱绕过漏洞。若无法立即升级，可在 Jenkins 前端网关或反向代理层限制对 `/pipeline` 相关端点的访问来源，仅允许受信任的 CI IP 段访问，作为临时缓解措施。"
score = 9.9
severity = "CRITICAL"
sources = ["kev"]
title = "CloudBees Jenkins Pipeline Groovy 插件沙箱绕过漏洞"
updated = "2026-06-17T02:09:34Z"

