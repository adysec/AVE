[basic]
description = "LPPlus 的 dccscan setuid 程序未正确验证用户是否具有打印指定文件的权限，导致本地用户可以读取任意文件内容。该漏洞允许低权限的本地攻击者通过调用 dccscan 并指定目标文件路径来读取系统上任意文件，可能导致敏感信息泄露。攻击条件为攻击者需具备本地用户身份并能执行 dccscan 程序，利用方式简单直接，无需特殊权限或复杂配置。"
published = "2000-11-14T05:00:00.000"
remediation = "移除dccscan的setuid-root权限（执行chmod u-s $LPHOME/bin/dccscan），或升级到LPPlus 3.3.1及以上版本以修复权限检查缺陷。同时在LPPlus安全配置中限制dccscan仅允许授权用户调用，并对敏感文件设置严格的访问控制列表（ACL），禁止非授权用户通过dccscan读取任意文件。"
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "LPPlus dccscan 本地任意文件读取漏洞"
updated = "2026-06-16T21:52:39.873"

