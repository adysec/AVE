[basic]
description = "jaZip 0.32-2 版本的 Zip/Jaz 驱动器管理工具存在缓冲区溢出漏洞。攻击者可通过设置超长的 DISPLAY 环境变量触发栈缓冲区溢出，利用该漏洞本地用户可获取系统 root 权限。该漏洞影响运行 jaZip 0.32-2 版本的 Unix/Linux 系统，需要本地登录权限才能利用，攻击条件为攻击者拥有目标系统的本地用户访问权限。攻击者可通过向 jaZip 程序传递构造的超长 DISPLAY 环境变量值，覆盖栈返回地址从而执行任意代码，最终提升至 root 权限。CVSS 评分 7.2，危害等级高。"
published = "2001-03-12T05:00:00.000"
remediation = "立即将 jaZip 升级至 0.33-2 或更高版本（Debian stable 安全更新），或通过 `apt-get install --only-upgrade jazip` 安装 DSA-017 修复补丁。如暂无法升级，可在执行 jazip 前通过 `unset DISPLAY` 清除环境变量作为临时缓解，并限制 jazip 二进制文件的执行权限（`chmod 750 /usr/X11R6/bin/jazip`），仅允许可信用户运行。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "jaZip Zip/Jaz驱动器管理器 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:53:40.473"

