[basic]
description = "FreeBSD 系统中 ipfw 和 ip6fw 防火墙规则引擎存在过滤逃避漏洞，其 TCP 连接状态跟踪机制错误地将设置了 ECE（ECN Echo）标志的 TCP 数据包识别为已建立连接的一部分，而无需经过正常的握手流程。未经身份认证的远程攻击者可通过发送带有 ECE 标志的特制 TCP 数据包，使恶意流量绕过基于连接状态的访问控制列表（ACL），从而访问本应被防火墙规则阻止的网络服务或主机。该漏洞影响 FreeBSD 3.x 和 4.x（含 4.2 及更早版本），攻击者无需持有有效账户或经过身份验证即可在远程发起利用，可能导致敏感信息泄露、服务横向移动或未授权访问，CVSS v2 评分 7.5，危害等级较高。"
published = "2001-03-26T05:00:00Z"
remediation = "立即升级 FreeBSD 系统到 4.3 或更高版本，该版本已修复 ipfw/ip6fw 对 TCP ECE 标志的错误处理逻辑。如无法立即升级，可从 ftp://ftp.FreeBSD.org/pub/FreeBSD/CERT/patches/SA-01:08/ 下载对应补丁，以 root 身份执行 patch 命令后重新编译安装 ipfw/ip6fw 内核模块或内核，最后重启系统使修复生效。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "FreeBSD ipfw 访问控制绕过漏洞"
updated = "2026-06-16T21:53:49Z"

