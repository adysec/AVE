[basic]
description = "Allegra 的 exportReport 方法存在路径遍历漏洞，由于未对用户提供的路径进行充分验证便直接用于文件操作，导致经过身份认证的远程攻击者能够读取服务器上的任意文件，泄露敏感信息。该漏洞影响 Allegra 软件，攻击者可在服务账户权限下获取系统配置文件、数据库凭证等敏感数据，CVSS 评分 6.5，危害等级中等。目前官方尚未发布修复补丁，建议限制受影响组件的访问权限。"
published = "2026-06-13T00:16:23Z"
remediation = "立即升级到 Allegra 9.0 或更高版本（需联系 sales@alltena.com 获取新许可证密钥）。由于从 8.x 升级到 9.0 涉及架构变更，需执行全新安装并参考迁移指南完成数据迁移。如无法立即升级，可在应用服务器层面限制 exportReport 接口的路径参数，仅允许白名单内的模板目录路径，并确保服务账户对敏感文件（如配置文件、密码文件）具有最小读取权限。"
score = 6.5
severity = "MEDIUM"
sources = ["zdi"]
title = "Allegra exportReport 路径遍历信息泄露漏洞"
updated = "2026-07-23T09:10:00Z"

