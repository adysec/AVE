[info]
author = "ave"
description = "检测 Easy Homepage Creator 1.0 的 edit.cgi 脚本是否存在未授权访问漏洞，该脚本的 print_html_to_file 函数未验证用户凭据，远程攻击者可利用其修改其他用户主页"
id = "POC-AVE-2002-0582"
name = "CVE-2002-1427 Easy Homepage Creator 未授权文件修改漏洞检测"
severity = "high"
tags = ["ave-2002-0582"]
vuln_id = [
    "CVE-2002-1427",
    "AVE-2002-0582",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/edit.cgi"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["homepage_edit"]
