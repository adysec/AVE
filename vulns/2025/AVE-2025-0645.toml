[basic]
description = "Windows 复原文件系统（ReFS）重复数据删除服务存在双重释放（Double Free）内存损坏漏洞，属于权限提升漏洞。本地攻击者无需任何权限即可在满足特定条件的情况下触发该漏洞，成功利用后可获取系统最高权限（SYSTEM），从而完全控制目标主机，窃取敏感数据、安装恶意程序或创建管理员账户。该漏洞影响多个 Windows Server 及桌面版本，CVSS 评分 7.4，危害等级高危。Microsoft 已在 2025 年 2 月安全更新（KB5051987）中修复此漏洞。"
published = "2025-02-11T18:15:29Z"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新 KB5051987（Windows 11 24H2 升级至 OS Build 26100.3194，Windows Server 2025 升级至 10.0.26100.3194），或通过 Windows Update 自动获取更新。Server Core 安装版本同样适用此补丁。如无法立即打补丁，可考虑禁用 ReFS 重复数据删除服务（Dedup 服务）作为临时缓解措施，但需评估对存储效率的影响。"
score = 7.4
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows ReFS 重复数据删除服务特权提升漏洞"
updated = "2026-06-17T08:42:43Z"

