[basic]
description = "WordPress bws-pinterest插件（版本低于1.0.5）存在多个跨站脚本（XSS）漏洞。该漏洞源于插件对用户输入数据未进行充分的过滤与转义处理，攻击者可通过向受影响页面注入恶意JavaScript代码，当管理员或其他用户访问特制链接时，恶意脚本将在浏览器中执行，导致敏感信息泄露（如会话Cookie、登录凭证）或页面内容篡改。攻击无需身份认证，但需要用户交互（点击链接），CVSS评分6.1，危害等级中危。"
published = "2019-08-20T15:15:11Z"
remediation = "立即将 bws-pinterest 插件升级到 1.0.5 或更高版本。在 WordPress 后台插件页面搜索 bws-pinterest 并点击更新，或手动从 WordPress 插件目录下载替换。如无法立即升级，可在 WordPress 后台 → 用户 → 个人资料中，将可视化编辑器设置为禁用，降低 XSS 利用风险。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress bws-pinterest插件跨站脚本漏洞"
updated = "2026-06-17T01:13:01Z"

