[basic]
description = "Windows 事件跟踪（Event Tracing）组件存在安全漏洞，由于对路径名链接的不当解析（CWE-59），具有低权限的本地攻击者可利用该漏洞触发系统拒绝服务。攻击者需先获得本地访问权限，通过创建特制符号链接等方式操纵事件跟踪会话，导致目标系统服务崩溃或停止响应。该漏洞影响 Windows 10/11 及 Windows Server 各版本，CVSS 评分 5.5，危害等级中危。Microsoft 已在 2025 年 1 月安全更新中修复。"
published = "2025-01-14T18:15:47Z"
remediation = "安装 Microsoft 2025 年 1 月安全更新 KB5049981，可通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。如无法立即安装补丁，可限制本地用户对事件跟踪组件的访问权限作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 事件跟踪拒绝服务漏洞"
updated = "2026-06-17T08:42:57Z"

