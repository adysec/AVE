[basic]
description = "该漏洞源于多种浏览器（如 Internet Explorer 5.01 至 6、Mozilla 0.8/0.9.x 及 Opera 5/6）的 JavaScript 解释器在处理特定脚本时存在逻辑缺陷。远程攻击者可通过诱导用户访问包含特制 JavaScript 代码的网页，利用 `location.replace` 方法在页面自身上循环调用，从而触发无限递归循环。这种机制会导致浏览器资源耗尽或解释器崩溃，最终导致应用程序拒绝服务（DoS），使受害者无法正常浏览网页。"
published = "2002-08-12T04:00:00Z"
remediation = "建议将 Internet Explorer 5/6、Mozilla 0.8/0.9.x 以及 Opera 5/6 升级到厂商发布的最新版本以修复 JavaScript 解释器逻辑缺陷。对于无法立即升级的受影响系统，可以通过在浏览器设置中禁用 JavaScript 执行来临时缓解该拒绝服务漏洞。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer / Mozilla / Opera 浏览器 JavaScript 解释器拒绝服务漏洞"
updated = "2026-06-16T21:57:29Z"

