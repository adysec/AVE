[basic]
description = "Lotus Domino Mail Server 5.0.5 及更早版本存在缓冲区溢出漏洞，攻击者可通过向 SMTP 服务发送超长的 RCPT TO 命令触发溢出，导致服务器拒绝服务或执行任意代码。该漏洞无需身份认证即可远程利用，影响部署了受影响版本 Domino 邮件服务器的组织，攻击者可利用此漏洞获取服务器控制权。"
published = "2001-06-02T00:00:00Z"
remediation = "建议将 Lotus Domino Mail Server 升级至 5.0.6 或更高版本，IBM 在该版本中已修复 RCPT TO 命令的缓冲区溢出漏洞。升级前请备份 Domino 数据目录和 notes.ini 配置文件，下载 IBM 官方 5.0.6 或后续版本安装包覆盖安装，升级后验证 SMTP 服务正常运行。如短期内无法升级，可在 Domino 服务器配置文档（Configuration document）的 Router/SMTP → Advanced → Restrictions 中设置最大收件人数量上限，并启用 SMTP 命令长度限制以缩减攻击面，同时通过防火墙或路由器对外部 SMTP 连接来源 IP 进行访问控制，仅允许可信邮件网关连接 25 端口。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Lotus Domino 邮件服务器缓冲区溢出漏洞"
updated = "2001-06-02T00:00:00Z"

