[basic]
description = 'Internet Explorer 5.x 存在代码执行漏洞，被称为 "IE Script" 漏洞。漏洞原理是 IE 在解析 HTML 文档中的 ActiveX OBJECT 标签引用 Microsoft Access 数据库文件时，未提示用户确认直接自动打开，导致远程攻击者可构造恶意网页嵌入恶意 Access 文件，诱导用户访问即可在用户系统上下文下执行任意命令。影响范围为 Internet Explorer 5.x 版本，CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），属高危漏洞。攻击条件为远程攻击者构造恶意网页并诱导用户访问，利用方式为通过 ActiveX OBJECT 标签引用恶意 Access 数据库文件实现远程代码执行。Microsoft 已发布补丁修复此漏洞。'
published = "2000-06-27T04:00:00.000"
remediation = "升级 Internet Explorer 到支持安全更新的版本（IE 6 及以上），并安装 2000 年 6 月发布的累积安全补丁包；同时通过系统设置禁用不信任 ActiveX 控件，启用增强安全配置（ESC 模式），并在应用程序信任区启用“提示下载前检查”功能以防止自动执行包含 Access 文件的 HTML 对象标签，如需临时缓解可在防火墙策略中阻止 IE 读取 Access 文件扩展"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Internet Explorer 5.x ActiveX 远程代码执行漏洞"
updated = "2026-06-16T21:52:04.603"

