[basic]
description = 'McAfee VirusScan 4.5 默认配置未对 ImagePath 变量值加引号处理，导致系统搜索路径设置异常。本地用户可利用此漏洞，在 C:\Program Files 目录下放置名为 common.exe 的特洛伊木马程序，当系统搜索可执行文件时可能优先加载该恶意程序，从而执行任意代码。该漏洞影响 McAfee VirusScan 4.5 的默认安装，攻击者需具备本地访问权限方可利用。'
published = "2001-01-09"
remediation = '''
tags, and the existing TOML uses single quotes... wait, the existing TOML uses single quotes for the remediation field. Let me check.

The existing TOML has:
remediation = '建议升级 McAfee VirusScan 至最新版本...'

So it's using single-quoted TOML strings. In single-quoted TOML strings, backslashes are literal, but single quotes cannot appear inside. The current text has `HKEY_LOCAL_MACHINE\SYSTEM\...` with backslashes. In single-quoted TOML strings, backslashes are treated literally, so `\S` is fine. But I should not include single quotes inside.

Wait, in single-quoted TOML strings, the only thing you can't have is a single quote character itself. Backslashes are literal. So `\SYSTEM` is fine.

Let me check my text for single quotes - I don't have any.

Also, the existing text mentions `xxx.exe` which is the placeholder. I need to remove that.

Let me draft the final version:

升级 McAfee VirusScan 至官方发布的后续修复版本，以获取 ImagePath 注册表值引号包裹的官方修复。如暂时无法升级，请手动打开注册表编辑器，定位到 HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\McAfeeFramework，修改 ImagePath 字符串值，确保整个路径被英文双引号括起来，并移除 C:\Program Files 目录对普通用户的写入权限，防止投放恶意 common.exe 文件。修复后重启 McAfee Framework 服务使配置生效，并使用 McAfee 官方工具扫描清除系统中已有的木马程序。http://archives.neohapsis.com/archives/ntbugtraq/2000-q4/0073.html 提供了原始漏洞公告与修复方案。

Wait, I need to make sure this is ≥20 characters. It definitely is.

Actually, let me reconsider whether I should include the URL directly in the text or not. The requirement says "如果 presearch 数据中有补丁链接或修复版本信息，请引用". The URL is a vendor advisory/patch reference. So I should reference it.

But I want to make sure the text doesn't look like "请参考". Let me make it a factual statement.

One more thing: the error says "修复建议包含占位符". The only placeholder I see is `xxx.exe`. Let me make sure I remove it entirely.

Let me check the character count and quality:

"升级 McAfee VirusScan 至官方发布的后续修复版本，以获取 ImagePath 注册表值引号包裹的官方修复。如暂时无法升级，请手动打开注册表编辑器，定位到 HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\McAfeeFramework，修改 ImagePath 字符串值，确保整个路径被英文双引号括起来，并移除 C:\Program Files 目录对普通用户的写入权限，防止投放恶意 common.exe 文件。修复后重启 McAfee Framework 服务使配置生效，并使用 McAfee 官方工具扫描清除系统中已有的木马程序。http://archives.neohapsis.com/archives/ntbugtraq/2000-q4/0073.html 提供了原始漏洞公告与修复方案。"

This looks good. It's concrete, actionable, references the presearch data, and has no placeholders.

Actually, I want to be more careful about the backslashes in TOML single-quoted strings. In TOML, single-quoted strings are literal strings - backslash has no special meaning. So `\SYSTEM` is fine. But wait, the current text in the TOML already has backslashes and it's in single quotes. So that's the convention being used.

Let me verify: in TOML, single-quoted strings are exactly like their contents, except that a single quote cannot appear. So backslashes are literal. This means `\S` stays as `\S`. Good.

One final check: the requirement says "不要写「请参考官方公告」这类套话". My text says "http://archives.neohapsis.com/archives/ntbugtraq/2000-q4/0073.html 提供了原始漏洞公告与修复方案" which is a factual statement about what the URL contains, not a "please refer" instruction. This should be fine.

Actually, I realize I should probably include the BID reference too? No, that's just an identifier. The neohapsis link is the actual vendor advisory.

Let me finalize the text.<value>升级 McAfee VirusScan 至官方发布的后续修复版本，以获取 ImagePath 注册表值引号包裹的官方修复。如暂时无法升级，请手动打开注册表编辑器，定位到 HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\McAfeeFramework，修改 ImagePath 字符串值，确保整个路径被英文双引号括起来，并移除 C:\Program Files 目录对普通用户的写入权限，防止投放恶意 common.exe 文件。修复后重启 McAfee Framework 服务使配置生效，并使用 McAfee 官方工具扫描清除系统中已有的木马程序。http://archives.neohapsis.com/archives/ntbugtraq/2000-q4/0073.html 提供了原始漏洞公告与修复方案。
'''
