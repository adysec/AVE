[basic]
description = "Microsoft Internet Explorer 9至11及Microsoft Edge浏览器存在信息泄漏漏洞。当用户访问攻击者精心构造的恶意网站时，浏览器可能错误地泄露内存中的敏感信息，导致攻击者能够获取本应受到保护的数据。该漏洞无需身份认证，但需要用户交互（点击链接或浏览恶意页面），CVSS评分6.5，危害等级中危。Microsoft已在2016年9月安全更新（MS16-096）中修复此漏洞。"
published = "2016-09-14T10:59:24Z"
remediation = "立即安装 Microsoft 2016 年 9 月安全更新 MS16-104（KB3185319），该更新通过 Windows Update 自动获取，或从 Microsoft 更新目录手动下载。Windows 10 用户需安装对应的累积更新 KB3185611/KB3185614/KB3189866。对于无法立即打补丁的系统，可启用 Internet Explorer 增强安全配置（ESC）并部署 EMET 工具作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["kev"]
title = "Microsoft Internet Explorer 和 Edge 信息泄露漏洞"
updated = "2026-06-17T00:45:32Z"

