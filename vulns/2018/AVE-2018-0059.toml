[basic]
description = "标签包裹最终输出。<value>wpForo Forum 插件是 WordPress 的一款论坛插件。在 1.4.12 版本之前，该插件的 wpf-includes/functions.php 文件中的 wpforo_get_request_uri 函数未对用户提交的 URI 进行充分的输出编码与转义处理，导致存在未认证的反射型跨站脚本（XSS）漏洞。攻击者无需身份验证即可构造包含恶意 JavaScript 代码的 URL，诱使网站管理员或普通用户点击访问。一旦受害者打开该链接，恶意脚本将在其浏览器中执行，可导致用户会话劫持、网站后台凭据窃取、页面内容篡改或进一步发起钓鱼攻击等危害。该漏洞影响所有使用受影响版本 wpForo Forum 插件的 WordPress 网站。"
published = "2018-06-04T13:29:00Z"
remediation = "立即将 WordPress 的 wpForo Forum 插件升级至 1.4.12 或更高版本，升级后删除所有缓存并刷新 CDN。如暂时无法升级，可在 .htaccess 或防火墙规则中过滤包含 script、alert、onerror 等 XSS 特征的 URI 请求作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress wpForo Forum 插件 反射型跨站脚本(XSS)漏洞"
updated = "2026-06-17T01:36:24Z"

