[basic]
description = "Opera Web Browser 11.50及更早版本在处理表单布局及多种Web内容时存在多个未指定的拒绝服务漏洞，包括JavaScript执行、Array.prototype.join方法处理、绘图路径、表单布局以及其他Web元素处理等多个子系统中的缺陷。未经身份认证的远程攻击者可通过构造包含特制恶意内容（如精心设计的表单布局、JavaScript代码或大量无效URL请求）的网页诱骗用户访问，触发浏览器应用崩溃，导致拒绝服务和服务中断。该漏洞影响 Opera 11.50 之前的所有版本，攻击无需任何用户交互即可在网络可达的情况下完成利用，CVSS评分5.0，危害等级中等。"
published = "2011-07-01T10:55:02Z"
remediation = "建议立即将 Opera 浏览器升级至 11.50 或更高正式版本，以彻底修复表单布局相关的拒绝服务漏洞。如短期内无法完成升级，可临时禁用 JavaScript 执行或改用其他浏览器访问不可信网页，作为过渡缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera Web Browser 远程拒绝服务漏洞"
updated = "2026-06-16T23:31:40Z"

