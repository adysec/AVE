[basic]
description = """Progress ADC 系列产品（包括 LoadMaster、ECS 连接管理器、Object Scale 连接管理器及 MOVEit WAF）的 API 接口中存在操作系统命令注入漏洞。具有"Geo Administration"权限的认证攻击者可通过向 'addcountry' 命令提交特制的恶意输入，利用程序对用户输入未进行充分过滤的缺陷，在 LoadMaster 设备上执行任意系统命令，实现远程代码执行。该漏洞 CVSS 评分 8.4，危害等级高，攻击者需具备认证权限且位于相邻网络，但成功利用后可完全控制目标系统。"""
published = "2026-04-20T14:16:19.330"
remediation = "立即将 Progress LoadMaster 升级至 7.2.63.1 或更高版本（LTSF 分支升级至 7.2.54.17），ECS Connection Manager、Object Scale Connection Manager 及 MOVEit WAF 同步升级至 7.2.63.1。如无法立即升级，在管理界面中严格限制 Geo Administration 角色的用户数量，并审计所有 addcountry 命令的调用日志，同时通过防火墙限制对 LoadMaster 管理 API 的访问来源 IP。"
score = 8.4
severity = "HIGH"
sources = ["zdi"]
title = "Progress ADC Products 操作系统命令注入远程代码执行漏洞"
updated = "2026-06-17T10:43:42.390"

