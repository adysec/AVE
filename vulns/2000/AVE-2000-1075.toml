[basic]
description = "Id Software Quake 1.0/1.9 及更早版本在处理 UDP 数据包时存在缺陷，未经验证的远程攻击者可发送特制的空 UDP 数据包触发拒绝服务，导致目标服务器崩溃或失去响应。该漏洞影响运行 Quake 1 和 ProQuake 1.01 的服务器，攻击无需身份认证，通过网络即可利用。"
published = "2000-11-01T05:00:00.000"
remediation = "升级到 Quake 1.09 或更高版本，以及 ProQuake 1.02 或更高版本，该版本已修复对空 UDP 数据包的异常处理。若无法升级，可在防火墙层面禁止外部访问 UDP 26000 端口，或在服务器端配置防火墙规则丢弃来源端口为 26000 的空 UDP 报文，仅允许合法客户端查询。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Id Software Quake 畸形UDP包拒绝服务漏洞"
updated = "2026-06-16T21:53:06.547"

