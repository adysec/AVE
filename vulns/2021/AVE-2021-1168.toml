[basic]
description = "Accellion FTA 文件传输设备存在操作系统命令注入漏洞，影响 9.12.370 及更早版本。漏洞原理在于管理端接口未对用户输入进行充分过滤，攻击者可通过发送特制 POST 请求在无需身份验证的情况下执行任意操作系统命令。该漏洞攻击条件极低，仅需网络可达即可利用，无需任何凭据或用户交互。利用方式为向管理端点构造恶意 POST 请求注入系统命令，成功利用可导致攻击者完全控制目标设备，窃取敏感文件、获取管理员凭据或横向移动至内网。该漏洞已被发现用于勒索软件攻击活动，CVSS 评分 9.8，危害等级严重。Accellion 已在 FTA_9_12_380 及更高版本中修复此漏洞。"
published = "2021-02-16T21:15:13Z"
remediation = "立即将 Accellion FTA 升级至 FTA_9_12_380 或更高版本以修复该漏洞。在升级完成前，建议通过防火墙或反向代理限制对 Admin 管理端口的访问，仅允许可信 IP 地址访问，并密切监控 `/css,/sftp,/gadgets,/ajax` 等管理端点的异常 POST 请求，如发现疑似命令注入流量应立即阻断。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Accellion FTA 操作系统命令注入漏洞"
updated = "2026-06-17T03:44:18Z"

