[basic]
description = "Teekai Tracking Online 1.0 的 userlog.php 页面存在跨站脚本攻击（XSS）漏洞。该应用程序未对 URL 参数中的输入进行充分的过滤和转义处理，远程攻击者可通过在请求参数中注入任意 HTML 或 JavaScript 代码来利用此漏洞。具体而言，攻击者向 userlog.php 的 id 参数提交包含恶意脚本的输入，当用户访问包含该恶意链接的页面时，脚本将在其浏览器上下文中执行，从而窃取会话 cookie、会话令牌或其他敏感信息，或在受害者浏览器中执行任意操作。该漏洞影响 Teekai Tracking Online 1.0 版本，攻击向量为网络，攻击复杂度为中等，无需身份认证即可发起攻击。利用方式为构造包含恶意脚本的 URL 链接并诱使用户点击访问，即可在受害者浏览器中执行任意 JavaScript 代码。CVSS 评分为 4.3，危害等级为中危。"
published = "2002-12-31T05:00:00Z"
remediation = "由于TeeKai Tracking Online 1.0的原始厂商已停止运营且未发布官方补丁，建议立即停用该软件并迁移至 actively maintained 的网站统计替代方案（如Matomo或Google Analytics）。如因业务需要必须继续使用，需手动修改userlog.php文件中对id参数的处理代码：在输出id参数值到HTML页面前，使用PHP的htmlspecialchars()函数进行转义，例如将echo $id改为echo htmlspecialchars($id, ENT_QUOTES, 'UTF-8')，同时审查page.php中action=view分支对id参数的所有输出点，确保所有用户可控数据均经过适当编码后再写入HTML响应。此外，在Web服务器层面部署ModSecurity规则，过滤请求URL和参数中的<script>、javascript:等XSS攻击特征作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Teekai Tracking Online 1.0 跨站脚本漏洞"
