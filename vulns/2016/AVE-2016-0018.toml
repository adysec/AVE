[basic]
description = "WordPress 插件 e-search 1.0 版本中存在反射型跨站脚本（XSS）漏洞，攻击者通过构造特制的 URL 参数注入恶意脚本，当用户点击该链接时脚本在浏览器中执行，导致敏感信息泄露或页面内容篡改。攻击条件为无需身份认证，但需诱使用户交互。该漏洞影响 e-search 插件 1.0 版本，CVSS 评分 6.1，危害等级中危。"
published = "2016-10-10T20:59:06Z"
remediation = "立即停用并删除 e-search 插件 1.0 版本，该插件已停止维护无安全更新。改用其他受支持的 WordPress 搜索插件（如 Relevanssi 或 SearchWP）。同时配置 Web 应用防火墙（WAF）规则过滤反射型 XSS 攻击载荷，对用户输入参数实施严格的 HTML 编码输出。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress e-search 插件 1.0 反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:44Z"

