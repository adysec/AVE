[basic]
description = 'DCForum 论坛软件的 cgforum.cgi CGI 脚本存在路径遍历与任意文件删除漏洞。远程攻击者无需身份认证，仅需向目标服务器发送包含恶意构造的 "forum" 变量的 HTTP 请求，即可利用该变量中的路径遍历序列读取服务器上的任意敏感文件（如配置文件、密码文件等），同时还可删除 cgforum.cgi 脚本本身，导致论坛功能瘫痪。该漏洞影响 DCForum 1 至 6 版本，攻击复杂度低，利用条件仅需目标服务器运行存在漏洞的 DCForum 论坛程序，且攻击者可完全通过网络远程发起，无需任何凭据或交互。'
published = "2001-01-09T05:00:00Z"
remediation = '建议立即升级 DCForum 至 7.0 或更高版本，或迁移至受支持的论坛软件（如 phpBB、Discuz!）以彻底消除漏洞。如暂时无法升级，应立即在 Web 服务器配置中删除或禁用 cgforum.cgi 脚本，并通过 .htaccess 或防火墙规则限制对 DCForum 目录的访问权限，同时监控服务器日志中是否存在包含异常 "forum" 参数的恶意请求。'
score = 6.4
severity = "MEDIUM"
sources = ["tenable"]
title = "DCForum cgforum.cgi 任意文件读取漏洞"
updated = "2026-06-16T21:53:13Z"

