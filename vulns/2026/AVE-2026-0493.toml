[basic]
description = '''secure_headers Ruby 库在构建 Content-Security-Policy 响应头时，将各指令通过 `; ` 拼接，但 `build_sandbox_list_directive`、`build_media_type_list_directive` 和 `build_report_to_directive` 三个构建器未对用户输入中的 `;`、`\r`、`\n` 进行过滤。当应用程序将不可信输入传递给 `override_content_security_policy_directives` 或 `append_content_security_policy_directives` 的 `:sandbox`、`:plugin_types` 或 `:report_to` 参数时，攻击者可注入 `script-src 'unsafe-inline' *` 等恶意 CSP 指令。由于 CSP 解析器遵循首次出现规则，注入的 `script-src` 会覆盖应用配置的严格策略，导致内联脚本可被执行，造成跨站脚本攻击（XSS）。此外，攻击者还可通过注入 `report-uri` 将 CSP 违规报告重定向到攻击者服务器，窃取包含 URL、源码位置等敏感信息的报告。该漏洞影响 secure_headers ≤7.2.0 版本，7.3.0 版本已修复。'''
published = "2026-07-17T21:17:08Z"
remediation = '立即将 `secure_headers` gem 升级至 7.3.0 或以上版本（`bundle update secure_headers`）。如无法立即升级，对所有传入 `SecureHeaders.override_content_security_policy_directives`、`append_content_security_policy_directives` 及 `use_content_security_policy_named_append` 中 `:sandbox`、`:plugin_types`、`:report_to` 三个参数的输入值，在传入前过滤掉 `;`、`\r`、`\n` 字符。'
score = 4.7
severity = "MEDIUM"
sources = ["ghsa"]
title = "GitHub secure_headers Content-Security-Policy 指令注入漏洞"
updated = "2026-07-23T18:04:31Z"

