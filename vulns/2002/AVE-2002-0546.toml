[basic]
description = "HP Procurve 4000M 交换机 HTTP 管理接口存在未授权设备重置漏洞。该交换机在启用堆叠功能与远程管理的情况下，其 HTTP 管理界面未对设备重置请求进行身份认证，远程攻击者无需任何凭证即可直接向 device_reset CGI 程序发送特制请求，导致目标设备被重置，造成拒绝服务。该漏洞影响固件版本低于 C.09.16 的 HP Procurve 4000M 交换机，攻击复杂度较低，且已有公开利用代码。"
published = "2002-10-11T04:00:00Z"
remediation = "将 HP Procurve 4000M 交换机固件升级至 C.09.16 或更高版本。如无法立即升级，建议禁用远程管理功能或通过访问控制列表（ACL）限制对 HTTP 管理接口的访问，仅允许可信 IP 地址连接。"
score = 7.1
severity = "HIGH"
sources = ["exploitdb"]
title = "HP Procurve 4000M Switch HTTP管理接口拒绝服务漏洞"
updated = "2026-06-16T21:58:48Z"

