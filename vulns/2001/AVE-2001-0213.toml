[basic]
description = "ISC BIND 4 的 nslookupComplain() 函数存在格式串溢出漏洞，远程攻击者无需身份认证即可向目标 DNS 服务器发送特制的格式字符串请求，触发该函数中的格式化字符串处理缺陷，导致任意代码执行。攻击者可利用此漏洞完全控制目标系统，获取 root 权限。该漏洞影响 BIND 4 系列版本，CVSS 评分 10.0，危害等级严重。"
published = "2001-02-12T05:00:00Z"
remediation = "立即升级 BIND 至 4.9.7 及以上版本（该版本修复了 nslookupComplain 格式串漏洞）。由于 BIND 4 系列已停止维护，强烈建议迁移至 BIND 9.x 最新稳定版。如无法立即升级，可在网络边界防火墙限制对 DNS 服务器的非信任来源访问，并禁用递归查询以降低攻击面。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "ISC BIND 4 nslookupComplain 格式串溢出漏洞"
updated = "2026-06-16T21:53:29Z"

