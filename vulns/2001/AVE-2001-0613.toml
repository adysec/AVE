[basic]
description = "Internet Explorer 5.5 的打印模板（Print Templates）功能存在安全漏洞，当用户浏览恶意网页时，攻击者可利用该功能在未经用户提示的情况下执行任意自定义打印模板，进而调用任意 ActiveX 控件。攻击者需诱导用户访问特制网页，利用该漏洞可在用户浏览器上下文中执行任意代码，导致信息泄露、系统篡改或进一步攻击。该漏洞影响 Internet Explorer 5.5 版本，CVSS 评分 5.1，危害等级中危。"
published = "2001-02-16T05:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS00-093 提供的补丁，该补丁适用于 Internet Explorer 5.5。如无法安装补丁，可将 IE 升级至 5.5 SP1 或 5.01 SP2 版本。临时缓解措施：在 Internet 安全区域中将 ActiveX 控件和脚本设置为禁用，或使用组策略限制打印模板功能的执行。"
score = 5.1
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Internet Explorer 5.5 浏览器打印模板远程代码执行漏洞"
updated = "2026-06-16T21:53:38Z"

