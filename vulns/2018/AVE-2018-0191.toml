[basic]
description = 'Enhancesoft osTicket 1.10.1 及之前版本中的 /scp/directory.php 存在反射型跨站脚本（XSS）漏洞。远程攻击者可通过向 "order" 参数注入恶意 Web 脚本或 HTML 代码，当管理员或用户访问特制链接时，脚本将在浏览器中执行，导致敏感信息泄露或会话劫持。攻击无需身份认证，但需用户交互（点击链接），影响系统机密性与完整性。'
published = "2018-03-27T17:29:00Z"
remediation = "升级 osTicket 至 1.10.2 或更高版本，该版本已修复 /scp/directory.php 中 order 参数的 XSS 问题。如无法立即升级，可在 Web 应用防火墙 (WAF) 层面添加规则对 order 参数进行 HTML 编码过滤，或限制对 /scp/directory.php 的访问权限作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Enhancesoft osTicket 跨站脚本攻击漏洞"
updated = "2026-07-10T18:20:35Z"

