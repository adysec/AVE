[basic]
description = "WatchGuard Firebox II 防火墙设备 4.1 及 4.5 版本中的 FTP 和 SMTP 代理服务存在拒绝服务漏洞。远程攻击者无需身份认证即可通过向目标设备发送大量 FTP 或 SMTP 请求，导致代理处理功能被禁用，从而使防火墙无法正常转发相关协议流量，造成服务中断。该漏洞 CVSS 评分 5.0，危害等级中等，攻击复杂度低，仅影响可用性。"
published = "2001-01-09T05:00:00.000"
remediation = "建议升级到 WatchGuard Firebox 后续受支持版本（如 Firebox X 系列）或迁移至 WatchGuard Fireware 最新版本。如无法升级，可在网络边界防火墙配置访问控制规则，限制外部对 Firebox II 的 FTP（TCP 21）和 SMTP（TCP 25）端口的连接速率，并启用 SYN flood 防护和连接数限制作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "WatchGuard Firebox II FTP/SMTP 服务泛洪拒绝服务漏洞"
updated = "2026-06-16T21:53:19.860"

