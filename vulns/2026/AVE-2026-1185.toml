[basic]
description = "GStreamer qtdemux 组件在解析 UncompressedFrameConfigBox 结构时存在基于栈的缓冲区溢出漏洞。该漏洞源于程序在将用户提供的未压缩帧配置数据复制到固定长度的栈缓冲区之前，未对数据长度进行充分验证。攻击者可通过构造特制的媒体文件触发该漏洞，在当前进程上下文中执行任意代码。该漏洞影响使用 GStreamer qtdemux 解析 QTVR/QuickTime 格式媒体的应用程序，CVSS 评分为 7.8（高危），需要用户交互（如打开恶意文件）才能触发利用。"
published = "2026-07-29T20:17:05.337"
remediation = "升级 GStreamer 到最新稳定版本（2.0.23或更高），并确保应用安全补丁。立即更新到支持安全修复的版本，如 2.0.24，如果可用。临时缓解措施：限制传入媒体文件的大小，避免使用不可信的媒体文件，并考虑在网络边界实现媒体处理的中转验证。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "GStreamer qtdemux 栈溢出远程代码执行漏洞"
updated = "2026-07-30T14:19:24.857"

