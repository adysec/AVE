[basic]
description = "RedHat Linux 6.2/7.0 系统中的 tmpwatch 工具的 --fuser 选项存在任意命令执行漏洞。本地攻击者可通过创建包含 shell 元字符（如反引号、$() 等）的文件名，当 tmpwatch --fuser 处理这些文件时，文件名中的恶意命令会被 shell 解析执行，导致攻击者以 tmpwatch 进程权限执行任意命令。该漏洞利用条件要求攻击者拥有本地文件创建权限，CVSS 评分 2.1，危害等级低。"
published = "2000-10-06T04:00:00.000"
remediation = "升级 tmpwatch 至修复版本（Red Hat 已通过 RHSA-2000:055 发布补丁），或移除 --fuser 选项的使用。对于仍在运行 Red Hat 6.2/7.0 的系统，建议升级至受支持的 RHEL 版本，或直接卸载 tmpwatch 改用 systemd-tmpfiles 替代。"
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "Red Hat Tmpwatch 本地任意命令执行漏洞"
updated = "2026-06-16T21:52:32.177"

