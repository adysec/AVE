[basic]
description = "J-Pilot 是一款用于 Linux 系统的 PalmOS 掌上电脑数据管理软件。其安装过程中创建的 .jpilot 目录权限直接继承自用户当前的 umask 设置，而未显式设置为安全权限。如果用户 umask 配置不当（如过于宽松），该目录可能被其他本地用户读取。本地攻击者可利用此漏洞访问其他用户的 PalmOS 备份数据，导致敏感信息泄漏。该漏洞影响 J-Pilot 所有版本，攻击者需具有本地系统访问权限，CVSS 评分 2.1，危害等级低。"
published = "2001-02-12T05:00:00Z"
remediation = "升级 J-Pilot 至修复版本（Mandrake Linux MDKSA-2000-081 对应更新包），或手动将 ~/.jpilot 目录权限设为 700（仅所有者可读写执行）：`chmod 700 ~/.jpilot`。同时建议在 shell 配置文件（~/.bashrc）中设置 umask 077 以确保新建目录默认仅所有者可访问。如无法升级，可创建 cron 任务定期检查并修正 .jpilot 目录权限。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "J-Pilot PalmOS 备份信息泄漏漏洞"
updated = "2026-06-16T21:53:35Z"

