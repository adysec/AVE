[basic]
description = "HP Intelligent Management Center（IMC）5.0 E0101L02之前版本的tftpserver.exe组件中存在多处基于栈的缓冲区溢出漏洞。远程攻击者无需身份认证即可通过发送特制的TFTP数据包（包含DATA或ERROR操作码）触发该漏洞，成功利用可导致在目标服务器上执行任意代码。CVSS评分为10.0，危害等级为严重。"
published = "2011-05-13T17:05:45Z"
remediation = "升级 HP Intelligent Management Center 至 5.0 E0101L02 或更高版本。如无法立即升级，在防火墙上限制对 tftp 服务端口（默认 UDP 69）的访问，仅允许可信 IP 连接，并禁用不必要的 IMC 组件以缩小攻击面。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "HP Intelligent Management Center tftpserver.exe 栈缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T23:30:14Z"

