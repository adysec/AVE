[basic]
description = "WFTPD 及 WFTPD Pro 是 Texas Imperial Software 开发的 FTP 服务器软件，版本 2.41 RC12 及更早版本存在拒绝服务漏洞。漏洞原理在于服务器对客户端发送的命令参数缺少充分验证，当远程攻击者向 FTP 服务发送包含大量不可打印字符的请求时，服务器处理逻辑出现异常，导致服务崩溃或无法响应正常请求。该漏洞影响范围包括运行 WFTPD/WFTPD Pro 2.41 RC12 及以下版本的所有 Windows 平台 FTP 服务器实例。攻击条件方面，漏洞无需身份认证即可远程触发，攻击复杂度低，攻击者仅需建立到 FTP 端口（默认 21 端口）的网络连接并发送特制数据即可实施攻击。利用方式为远程发送包含连续不可打印字符的 FTP 命令序列，造成服务器资源耗尽或进程异常终止，进而拒绝为合法用户提供服务。该漏洞主要危害系统可用性，CVSS 评分为 5.0，危害等级为中等。"
published = "2000-11-14T05:00:00.000"
remediation = "建议将 WFTPD 和 WFTPD Pro 升级至厂商发布的安全补丁版本（高于 2.41 RC12，可访问 https://www.wftpd.com/bug_gpf.htm 获取补丁）。若软件已停止维护且无可用补丁，建议迁移至仍在持续维护的 FTP 服务器（如 ProFTPD 或 vsftPD）。迁移前可在网络边界部署防火墙规则或访问控制列表，仅允许可信来源连接 FTP 端口作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Texas Imperial Software WFTPD 拒绝服务漏洞"
updated = "2026-06-16T21:52:39.110"

