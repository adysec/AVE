[basic]
description = "Ikonboard 2.1.7b 及更早版本的 register.cgi 存在命令注入漏洞，攻击者可通过 SEND_MAIL 参数覆盖内部程序变量，从而执行任意系统命令。该漏洞无需身份认证即可远程利用，影响 Ikonboard 2.1.7b 及之前所有版本，CVSS 评分 10，危害等级严重。"
published = "2001-02-12T05:00:00.000"
remediation = "立即升级到 Ikonboard 2.1.8 或更高版本，该版本修复了 register.cgi 中的命令注入漏洞；禁用服务器上所有未使用的 CGI 脚本；通过替换 sendmail 参数验证或使用命令参数 sanitizing 的方式实现输入过滤；如无法立即升级，请通过防火墙规则阻止对 register.cgi 的 HTTP POST 请求，作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Ikonboard 代码执行漏洞"
updated = "2026-06-16T21:53:36.673"

