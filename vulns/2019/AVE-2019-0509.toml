[basic]
description = "Internet Explorer 脚本引擎（JScript.dll）在处理内存对象时存在释放后重用漏洞，攻击者可构造特制网站诱导用户访问，触发内存损坏导致远程代码执行。成功利用后攻击者可获取与当前用户相同的系统权限，安装程序、查看/更改/删除数据或创建新账户。该漏洞影响 Windows 7/8.1/10 及 Windows Server 2008/2012/2016/2019 等平台上的 IE 9/10/11 版本，CVSS 评分 7.5，危害等级高。此漏洞已被在野利用，Microsoft 已于 2019 年 9 月安全更新中修复。"
published = "2019-09-23T20:15:13Z"
remediation = "立即安装 Microsoft 2019 年 9 月安全更新 KB4522007（Internet Explorer 累积安全更新），可通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载。该更新覆盖 Windows 7/8.1/10、Windows Server 2008/2012/2012 R2 及嵌入式版本上的 IE 9/10/11。如无法立即打补丁，可启用 Microsoft EMET 或 Windows Defender Application Guard 作为临时缓解措施，并限制用户仅访问受信任网站以降低攻击面。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Internet Explorer 脚本引擎内存损坏远程代码执行漏洞"
updated = "2026-06-17T02:28:28Z"

