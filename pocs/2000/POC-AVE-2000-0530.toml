[info]
author = "ave"
description = "检测目标是否运行恶意Java小程序服务，该小程序利用Netscape Communicator 4.04-4.74中netscape.net.URLConnection类未正确调用SecurityManager.checkRead/checkConnect的漏洞，通过file://协议读取目标系统任意文件"
id = "POC-AVE-2000-0530"
name = "Netscape Communicator 4.x Java Applet URL Read PoC"
severity = "medium"
tags = [
    "cve-2000-0676",
    "netscape",
    "java-applet",
    "arbitrary-file-read",
]
vuln_id = [
    "CVE-2000-0676",
    "AVE-2000-0530",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/BrownOrifice.class"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "java",
    "class",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/applet.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "applet",
    "APPLET",
]
