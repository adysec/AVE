[basic]
description = "Mozilla Firefox/Thunderbird/SeaMonkey 的 DOM 节点操作中存在释放后使用（Use-After-Free）漏洞，位于 nsINode::ReplaceOrInsertBefore 函数中。当文档中替换或插入节点时，程序未能正确管理内存引用，导致已释放的内存对象被继续使用。远程攻击者可通过构造特制的网页内容触发该漏洞，成功利用可在目标系统上执行任意代码。该漏洞影响 Firefox 4.x 至 12.0、Firefox ESR 10.x 低于 10.0.5、Thunderbird 5.0 至 12.0、Thunderbird ESR 10.x 低于 10.0.5 及 SeaMonkey 低于 2.10 版本，CVSS 评分 9.3，危害等级严重。"
published = "2012-06-05T23:55:01.840"
remediation = "升级 Mozilla Firefox 至 13.0 及以上版本，Firefox ESR 升级至 10.0.5 及以上版本；Thunderbird 升级至 13.0 及以上版本，Thunderbird ESR 升级至 10.0.5 及以上版本；SeaMonkey 升级至 2.10 及以上版本。无法立即升级时，禁用 JavaScript 作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 释放后使用远程代码执行漏洞"
updated = "2026-06-16T23:40:37.467"

