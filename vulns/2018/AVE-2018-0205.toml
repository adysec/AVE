[basic]
description = "施耐德电气 U.motion Builder 软件 1.3.4 之前版本中的 track_import_export.php 文件存在 SQL 注入漏洞。由于程序未对 object_id 输入参数进行充分的过滤和转义，导致攻击者可构造恶意 SQL 查询语句注入底层 SQLite 数据库。远程攻击者可通过诱使用户访问特制链接触发该漏洞，从而实现对数据库的未授权读取、修改或删除操作，造成敏感信息泄露或数据完整性破坏。该漏洞 CVSS 评分 8.8，危害等级高。"
published = "2018-07-03T14:29:00.617"
remediation = "升级至 U.motion Builder v1.3.4 或更高版本，该版本修复了 track_import_export.php 中 object_id 参数的 SQL 注入问题。注意该产品已退役，建议迁移至替代方案。临时缓解措施：在防火墙或反向代理层面限制对 /smartdomuspad/modules/reporting/track_import_export.php 路径的访问，仅允许受信 IP 访问管理界面。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "Schneider Electric U.motion Builder SQL注入漏洞"
updated = "2026-06-17T02:03:41.030"

