[basic]
description = "tags.<value>Intel Express 500系列交换机存在ICMP数据包处理缺陷，未经身份认证的远程攻击者可发送特制的畸形ICMP数据包触发该漏洞，导致交换机CPU崩溃并造成服务中断。该漏洞影响Intel Express Switch 2.63/2.64版本，CVSS评分为5.0，危害等级为中等。攻击无需身份认证，利用条件宽松，通过网络即可触发拒绝服务。"
published = "2000-11-14T05:00:00.000"
remediation = "建议将Intel Express 500系列交换机固件升级至2.65及以上版本以修复ICMP数据包处理缺陷。同时在交换机端口上配置ACL规则，丢弃来源异常的ICMP Echo请求报文，或在非必要管理端口上禁用ICMP Echo应答功能，以降低远程拒绝服务攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Intel Express 500 系列交换机 ICMP 数据包 拒绝服务漏洞"
updated = "2026-06-16T21:52:39.990"

