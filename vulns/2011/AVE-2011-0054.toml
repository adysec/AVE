[basic]
description = "Adobe Flash Player 在 Windows、Mac OS X、Linux、Solaris 及 Android 平台上存在边界检查漏洞（CWE-20）。由于 Flash Player 在处理特定 SWF 文件时未能正确进行边界检查，攻击者可通过诱导用户访问恶意构造的网页或打开特制 Flash 文件，触发内存破坏，导致任意代码执行。该漏洞影响 Flash Player 10.3.181.14 之前版本（Windows/Mac/Linux/Solaris）及 10.3.185.21 之前版本（Android），CVSS 评分 9.3，危害等级严重。攻击者无需身份认证，仅需用户交互（如点击链接或打开文件）即可完成利用，可完全控制受影响系统。Adobe 已在安全公告 APSB11-12 中发布修复版本。"
published = "2011-05-13T22:55:01Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.181.14（桌面版）或 10.3.185.21（Android 版）以上版本。由于 Adobe 已于 2020 年 12 月 31 日停止支持 Flash Player，建议彻底卸载 Flash Player 并移除浏览器插件，同时使用 Adobe Flash Player EOL Uninstaller 进行清理，改用 HTML5 替代方案。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 边界检查远程代码执行漏洞"
updated = "2026-06-16T23:27:46Z"

