[basic]
description = "rclone 在 SFTP 后端将远程文件路径插入 PowerShell hash 命令时，其转义函数仅对 ASCII 单引号（U+0027）进行转义，但 PowerShell 会将 U+2018、U+2019、U+201A、U+201B 四种 Unicode smart quotes 也视为单引号分隔符。攻击者若能在 SFTP 服务端创建或重命名包含此类 smart quote 的文件名，即可在路径字面量中注入并闭合引号，附加任意 PowerShell 语句，以受害 SSH 账户的权限执行命令。该漏洞影响 rclone 1.75.0 之前版本，成功利用可导致任意代码执行、文件窃取或篡改、凭据访问及横向移动等后果。攻击者无需获取 SSH 凭据或交互式 shell，仅需具备远程文件命名权限，并在触发服务端哈希计算（如 rclone hash 操作）时即可完成利用。建议升级至 rclone v1.75.0 修复。"
published = "2026-08-05T21:16:58Z"
remediation = "立即升级 rclone 到 v1.75.0 或更高版本，该版本修复了 PowerShell 智能引号转义绕过漏洞。如无法立即升级，临时将 SFTP 远程配置中的命令 shell 从 PowerShell 切换为 cmd，或禁用 server-side hashing 功能，并避免从不可信来源同步或创建文件。"
score = 8
severity = "HIGH"
sources = ["ghsa"]
title = "rclone SFTP 服务器端 PowerShell 智能引号注入远程代码执行漏洞"
updated = "2026-08-07T05:17:03Z"

