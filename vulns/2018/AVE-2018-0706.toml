[basic]
description = "Oracle WebLogic Server WLS核心组件存在反序列化漏洞（CWE-502），未经身份认证的远程攻击者可通过T3协议向目标服务器发送精心构造的序列化Java对象，触发不安全的反序列化操作，导致远程代码执行。该漏洞影响WebLogic Server 10.3.6.0、12.1.3.0、12.2.1.2及12.2.1.3版本，CVSS评分9.8，危害等级严重。攻击无需认证，仅需网络可达即可利用，成功利用可完全控制目标服务器。Oracle已在2018年4月关键补丁更新中修复此漏洞。"
published = "2018-04-19T02:29:00.457"
remediation = "立即升级 Oracle WebLogic Server 至 2018 年 4 月关键补丁更新（CPU）对应版本：10.3.6.0 升级至 10.3.6.0.180417，12.1.3.0 升级至 12.1.3.0.180417，12.2.1.2 升级至 12.2.1.2.180417，12.2.1.3 升级至 12.2.1.3.180417。如无法立即升级，可在 WebLogic 控制台中将 T3 协议访问限制为仅受信任 IP 段，或在网络防火墙/安全组中封禁 T3 默认端口 7001 的入站连接作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Oracle WebLogic Server WLS核心组件反序列化远程代码执行漏洞"
updated = "2026-06-17T01:55:57.647"

