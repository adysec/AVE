[basic]
description = "tags.<value>GNU C 库（glibc）2.2.4 及更早版本中的 getgrouplist 函数存在缓冲区溢出漏洞。该函数在将用户所属的用户组列表复制到输出缓冲区时，未对组数量进行充分的边界检查，当用户所属的用户组过多时会导致缓冲区溢出。未经身份认证的远程攻击者可通过使目标用户加入大量用户组的方式触发该漏洞，从而造成进程段错误导致拒绝服务，或在特定条件下执行任意代码。该漏洞影响所有使用受影响 glibc 版本的 Linux 发行版及应用程序，CVSS v2 评分为 7.5。"
published = "2003-10-20T04:00:00Z"
remediation = "升级 glibc 到 2.2.5 或更高版本。对于 Red Hat Enterprise Linux 2.1 系统，应安装 Red Hat 发布的 errata 补丁（rhsa-2003:304）。对于 Debian 系统，升级至 glibc 2.2.5-1 或更高版本。如暂时无法升级，可通过 PAM 配置限制用户可加入的组数量（nsswitch.conf 中设置合理的 group 搜索顺序），减少攻击面。建议验证系统中所有用户所属的组数量是否在合理范围内。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "GNU glibc getgrouplist 缓冲区溢出拒绝服务代码执行漏洞"
updated = "2026-06-16T22:02:38Z"

