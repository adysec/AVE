[basic]
description = "Adobe Acrobat 4.05、Reader、Business Tools 及 Fill In 等处理 PDF 文件的产品中存在缓冲区溢出漏洞，攻击者可通过构造包含超长 /Registry 或 /Ordering 说明符的恶意 PDF 文件，诱导用户打开后触发栈缓冲区溢出，进而在用户权限上下文中执行任意代码。该漏洞影响 Adobe Acrobat 4.05 及相关产品，CVSS 评分 7.6（AV:N/AC:H/Au:N/C:C/I:C/A:C），攻击需用户交互打开恶意文件，利用方式为构造畸形 PDF 触发栈溢出实现任意代码执行。Adobe 已发布补丁修复此漏洞。"
published = "2000-10-20T04:00:00Z"
remediation = "建议立即升级到 Adobe Acrobat 5.0 或更高版本（Acrobat 5.0 于 2001 年发布已修复该缓冲区溢出漏洞）。若无法立即升级，建议：1）禁止打开不可信来源的 PDF 文件；2）在邮件网关/防火墙层面拦截携带超长 /Registry 或 /Ordering 字段的 PDF 附件；3）在终端部署应用程序控制策略，禁止 Acrobat 4.x 打开外部 PDF 文件，作为临时缓解措施。"
score = 7.6
severity = "HIGH"
sources = ["avd"]
title = "Adobe Acrobat 缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:52:19Z"

