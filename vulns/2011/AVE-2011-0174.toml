[basic]
description = "该漏洞存在于 Google Chrome 浏览器 17.0.963.56 之前的版本中。其原理是在处理表格列（columns）相关操作时，未能正确对某个未指定变量进行类型转换（Bad Cast），导致内存错误引用。远程攻击者可以通过诱导用户访问一个精心构建的恶意 HTML 文档来触发此漏洞。攻击成功后，可能导致浏览器崩溃并造成拒绝服务（DoS）状态，或者产生其他未知的潜在影响。"
published = "2012-02-16T20:55:04Z"
remediation = "建议立即将 Google Chrome 浏览器升级至 17.0.963.56 或更高版本。用户可通过浏览器菜单的“关于 Google Chrome”界面触发自动更新，或前往官方网站下载最新安装包以消除该内存错误引用漏洞。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 浏览器类型转换错误导致拒绝服务漏洞"
updated = "2026-06-16T23:32:27Z"

