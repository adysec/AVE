[basic]
description = "Linux kernel 2.2.x 与 2.4.x 的 sysctl() 系统调用存在内存越界读取漏洞，本地用户可向 sysctl 调用传入负数参数作为 name 长度或索引值，导致内核从非预期内存地址读取数据，从而泄露内核内存内容，并可能借此进一步提权获取系统更高权限。该漏洞攻击条件为需要本地用户权限（无法远程利用），无需认证即可触发，属于本地提权与信息泄露类漏洞。攻击者只需以普通用户身份调用 sysctl() 并构造恶意负数值即可触发越界读取，存在公开的 PoC 利用代码。"
published = "2001-05-03T04:00:00Z"
remediation = "tags.<value>建议立即升级 Linux 内核至修复版本：2.2 系列升级至 2.2.19 及以上，2.4 系列升级至 2.4.1 及以上。对应发行版用户可安装官方安全补丁，Red Hat 用户安装 RHSA-2001-013 提供的内核补丁包，Caldera 用户安装 CSSA-2001-009 公告对应补丁。该补丁修复了 sysctl() 调用对 name 参数负数校验缺失的问题，阻止利用负参数越界读取内核内存。如无法立即升级，可采取临时缓解措施：严格限制本地用户与 shell 登录权限，仅向可信用户开放系统访问；禁止非特权用户加载内核模块；并结合系统加固（如启用 SELinux、收紧 /proc/sys 读写权限）降低本地提权风险。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Linux Kernel sysctl() 内核内存读取漏洞"
updated = "2026-06-16T21:54:05Z"

