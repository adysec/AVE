[basic]
description = "博登数据系统 WinU 5.x 及更早版本在存储配置密码时采用弱加密算法，本地攻击者可通过逆向分析或暴力破解还原加密后的密码，从而获取配置凭据并提升本地系统权限。该漏洞位于 WinU 的密码存储模块，攻击者无需远程访问权限，只需具备本地系统的普通用户或物理访问权限即可触发漏洞。由于加密强度不足，口令 easily 被还原，可能导致配置泄露、权限提升以及后续横向移动。CVSS 评分为 4.6，危害等级中等，建议用户升级至支持更安全加密算法的版本并重新设置口令。"
published = "2000-10-20T04:00:00Z"
remediation = "该漏洞存在于 Bardon Data Systems WinU 5.x 及更早版本中，因使用弱加密算法存储配置密码，本地攻击者可解密密码并提升权限。建议立即升级到 WinU 5.5 或更高版本（如有可用补丁请务必安装），若无法升级，可通过以下措施降低风险：1）限制非授权用户访问安装 WinU 的系统，移除本地用户对 WinU 配置文件的读取权限；2）定期更换配置密码，并避免在配置文件中存储敏感凭据；3）在注册表中加密存储密码或使用更安全的密码管理方案替代内置弱加密机制。由于该软件已停维护，建议考虑迁移到其他安全性更高的替代软件。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Bardon Data Systems WinU 密码弱加密漏洞"
updated = "2026-06-16T21:52:29Z"

