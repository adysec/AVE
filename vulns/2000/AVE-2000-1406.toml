[basic]
description = "O'Reilly WebSite Professional 是一款 Web 服务器软件，该软件在 2.4 及更早版本中存在缓冲区溢出漏洞。远程攻击者无需身份验证，即可通过向目标服务器发送超长的 GET 请求或构造超长的 Referrer 头字段触发溢出，进而执行任意系统命令，完全控制服务器。该漏洞影响所有运行受影响版本 WebSite Professional 的站点，攻击者仅需具备网络可达性即可发起利用。O'Reilly 公司已发布修复补丁，建议用户升级至安全版本以消除风险。"
published = "2000-07-17T04:00:00.000"
remediation = "立即升级 O'Reilly WebSite Professional 至 2.4 之后已修复版本。若厂商不再提供安全补丁，请在 Web 服务器配置中限制 HTTP 请求头最大长度和 GET 请求 URI 长度，丢弃超长的 Referrer 头字段，并部署 WAF 规则拦截异常长请求，以缓解缓冲区溢出风险。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "O'Reilly WebSite Professional 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:07.947"

