[basic]
description = "Apple Safari 6.0 之前的版本中，WebKit 引擎在渲染 SVG 图像时存在内存访问错误，会访问未初始化的内存位置。远程攻击者可利用此缺陷，通过诱导用户访问恶意网页，获取进程内存中的敏感信息。该漏洞无需身份认证即可触发，影响使用旧版 Safari 的 macOS 与 iOS 设备。Apple 已在 Safari 6.0 中修复此问题，用户应及时升级浏览器版本以消除风险。"
published = "2012-07-25T19:55:05.710"
remediation = "升级到 Safari 6.0（OS X Lion v10.7.4 或 OS X Lion Server v10.7.4）或 iOS 6（iPhone 3GS 及后续机型、iPod touch 第4代及后续机型、iPad 2 及后续机型）。Apple 已在 Safari 6 和 iOS 6 中通过改进 SVG 图像的内存初始化修复了该问题。如无法立即升级，可临时禁用浏览器中的 JavaScript 或避免访问不可信网站以降低风险。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari WebKit SVG渲染内存信息泄露漏洞"
updated = "2026-06-16T23:43:39.497"

