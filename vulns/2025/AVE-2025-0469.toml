[basic]
description = "GNU Binutils 2.43 版本的 nm 工具中存在缓冲区溢出漏洞。该漏洞位于 binutils/nm.c 文件的 __sanitizer::internal_strlen 函数中，攻击者通过操控 const 参数可触发缓冲区溢出，导致程序异常行为。由于攻击复杂度较高且利用难度较大，实际利用较为困难。该漏洞影响 GNU Binutils 2.43 版本，CVSS 评分 2.3，危害等级低。建议用户升级至最新版本以修复此漏洞。"
published = "2025-02-10T14:15:29Z"
remediation = "升级 GNU Binutils 至 2.44 或更高版本。对于 SUSE 系统，安装 SUSE-SU-2025:4096-1 安全更新。如无法立即升级，避免对不可信二进制文件使用 nm 工具的 --debug 或 -w 选项，并限制 nm 命令的执行权限以降低攻击面。"
score = 2.3
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils nm 缓冲区溢出漏洞"
updated = "2026-06-17T08:38:27Z"

