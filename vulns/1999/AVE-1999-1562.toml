[basic]
description = "Microsoft Windows 2000 系统中 Internet Printing ISAPI 扩展（.printer）存在缓冲区溢出漏洞。该扩展运行于 IIS 5.0 Web 服务器上，用于处理客户端打印请求。由于扩展在处理超长的打印请求时未能对输入长度进行有效校验，攻击者可通过向目标服务器的 .printer 扩展发送精心构造的超长 HTTP GET 请求，触发缓冲区溢出，进而覆盖栈上的异常处理帧结构以劫持程序执行流程，最终在系统上下文中执行任意代码，获得最高权限。该漏洞影响安装有 SP1 和 SP2 的 Windows 2000 Server 系统，CVSS 评分为 10.0，危害等级为严重。攻击者无需事先认证即可远程利用此漏洞，Exploit-DB 上已有公开利用代码（EDB-ID: 268），利用成功后可在目标服务器上获得 root 级别访问权限。Microsoft 已通过安全补丁修复此漏洞，建议受影响用户尽快升级至更高版本或安装安全更新。"
published = "2001-06-27T04:00:00.000"
remediation = "安装 Microsoft 安全公告 MS01-023 发布的补丁程序（KB Q296576），或升级到 Windows 2000 Service Pack 2，补丁可通过 Microsoft Download Center 或 Windows Update 获取。如无法立即安装补丁，请通过组策略（Computer Configuration → Administrative Templates → Printers）禁用 Web-based Printing 功能作为临时缓解措施，注意若服务器加入域，需同时在域组策略中禁用该设置，并移除 IIS 中 .printer ISAPI 扩展映射。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Microsoft Windows Server 2000 打印ISAPI扩展缓冲区溢出漏洞"
updated = "2026-06-16T21:53:56.810"

