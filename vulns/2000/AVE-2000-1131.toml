[basic]
description = "Netopia ISDN Router 650-ST 4.3.5 及之前版本的登录界面存在认证绕过漏洞，远程未授权攻击者可直接连接设备登录界面并输入特定控制字符，绕过身份验证直接读取系统日志文件。该漏洞源于登录界面对特殊控制字符处理不当，导致认证机制被绕过。攻击者无需任何认证凭证，仅需网络层面可达设备登录界面即可发起攻击，成功利用可导致敏感系统日志信息泄露，CVSS 评分 5.0（中等严重度），影响 Netopia ISDN Router 650-ST 4.3.5 之前所有版本，厂商已在 4.3.5 版本中修复该漏洞。"
published = "2001-01-09T05:00:00Z"
remediation = "建议立即升级 Netopia ISDN Router 650-ST 固件至 4.3.5 或更高版本（厂商已修复该认证绕过漏洞）。若无法立即升级，建议采取以下缓解措施：1) 在路由器配置访问控制列表(ACL)，仅允许受信任管理网段 IP 访问登录界面；2) 修改默认管理员账号密码并启用强密码策略；3) 禁止路由器管理界面直接暴露在公网，仅允许内网跳板机访问；4) 定期审计系统日志，重点监控异常的登录界面访问尝试及控制字符输入行为。参考厂商公告：http://marc.info/?l=bugtraq&m=97440068130051&w=2"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Netopia ISDN Router 650-ST 认证绕过/日志信息泄露漏洞"
updated = "2026-06-16T21:53:19Z"

