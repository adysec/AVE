[basic]
description = "Nagios XI 在 5.4.13 版本之前存在 SQL 注入漏洞。该漏洞位于 `admin/commandline.php` 接口的 `cname` 参数中，由于程序未能对用户输入的参数进行充分的过滤与转义，导致攻击者可以通过构造特制的 HTTP 请求，在 `cname` 参数中注入恶意 SQL 语句。攻击者在拥有高权限账户（PR:H）的情况下，可利用此漏洞非法查询数据库敏感信息，甚至在特定配置下实现对系统的进一步控制。"
published = "2018-05-16T13:29:00Z"
remediation = "建议立即将 Nagios XI 升级至 5.4.13 或更高版本以修复该 SQL 注入漏洞。在升级完成前，建议通过 Web 应用防火墙（WAF）拦截针对 admin/commandline.php 接口中 cname 参数的异常 SQL 字符请求，或限制该管理接口的访问源 IP。"
score = 7.2
severity = "HIGH"
sources = ["nuclei"]
title = "Nagios Nagios XI SQL注入漏洞"
updated = "2026-06-17T01:34:35Z"

