[basic]
description = "NoMachine 在处理环境变量时存在路径验证缺陷，未对用户提供的文件路径进行充分校验即执行文件操作，导致攻击者可删除目标系统上的任意文件。该漏洞影响 NoMachine 9.4.14 之前的版本。攻击者需先在目标系统上获取低权限代码执行能力，随后利用环境变量注入恶意路径，以 root 权限删除关键系统文件。CVSS 评分为 7.1，危害等级为高危。NoMachine 已在后续版本中修复此漏洞。"
published = "2026-04-11T01:16:17.757"
remediation = "立即升级 NoMachine 至 8.22.1 版本（8.x 系列）或 9.4.14 版本（9.x 系列），该版本修复了 Kerberos 缓存路径环境变量未经验证即用于文件操作的问题。升级后重启 NoMachine 服务以使补丁生效。如暂时无法升级，可临时删除或重命名 NoMachine 配置文件中的 KERBEROS_CCACHE 环境变量引用，限制攻击者利用该变量注入恶意路径进行任意文件删除。"
score = 7.1
severity = "HIGH"
sources = ["zdi"]
title = "NoMachine 环境变量处理任意文件删除漏洞"
updated = "2026-06-17T10:58:20.700"

