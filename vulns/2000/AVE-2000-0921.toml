[basic]
description = "nss_ldap 版本低于 121 时，在与 nscd（名称服务缓存守护进程）配合运行的情况下存在拒绝服务漏洞。远程攻击者可通过向目标系统发送大量 LDAP 请求，导致 nscd 服务资源耗尽或崩溃，造成名称解析服务不可用。该漏洞攻击条件简单，无需认证即可触发，影响使用 nss_ldap 进行 LDAP 认证的 Linux/Unix 系统。"
published = "2000-12-11T05:00:00Z"
remediation = "升级 nss_ldap 至 121 或更高版本。Red Hat 用户可参考 RHSA-2000-024 安装更新，Mandrake 用户可参考 MDKSA-2000-066-1 获取补丁。如无法升级，可停止 nscd 服务（`service nscd stop`）或通过防火墙限制 LDAP 请求速率作为临时缓解措施。"
score = 1.2
severity = "LOW"
sources = ["cve"]
title = "nss_ldap LDAP 请求洪泛拒绝服务漏洞"
updated = "2026-06-16T21:53:02Z"

