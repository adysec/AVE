[basic]
description = "Fission 在 HTTPTrigger 的验证机制中存在路径验证绕过漏洞。由于 `HTTPTriggerSpec.Validate()` 函数及 API-server 的 CEL 规则均未对 `RelativeURL` 和 `Prefix` 字段进行有效校验，仅在 CLI 层实现了初步检查，导致攻击者可以通过 `kubectl apply` 或直接调用 Kubernetes REST API 绕过所有 URL 级别的安全检查。具备创建 HTTPTrigger 权限的攻击者可配置恶意的路径，例如使用 `..` 进行路径遍历、抢占路由根目录 `/` 或碰撞路由器内部保留路径（如 `/router-healthz`、`/auth/login` 等），从而实现路由劫持或非法访问内部资源。该漏洞影响 v1.25.0 之前的所有版本。"
published = "2026-06-10T18:17:13Z"
remediation = "建议立即将 Fission 升级到 v1.25.0 或更高版本。该版本通过在 API 服务器端引入 CEL 校验规则，强制要求 RelativeURL 和 Prefix 字段必须非空、以 / 开头且不包含 .. 遍历片段，从而修复了 kubectl apply 绕过校验的问题。"
score = 4.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Fission HTTPTrigger 路径验证绕过漏洞"
updated = "2026-06-17T10:57:43Z"

