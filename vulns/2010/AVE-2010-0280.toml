[basic]
description = "PHP NumberFormatter::getSymbol 函数存在整数溢出漏洞，攻击者可通过向 numfmt_get_symbol 传入无效参数触发整数溢出，导致应用程序崩溃造成拒绝服务。该漏洞影响 PHP 5.3.3 及更早版本，利用条件为本地或远程调用 NumberFormatter 相关功能且可控制输入参数，攻击方式为构造恶意参数触发整数溢出导致进程崩溃，CVSS 评分 5.0 属中危级别。"
published = "2010-12-06T20:13:00Z"
remediation = "建议立即升级 PHP 至 5.3.4 或更高版本（如 5.3.29、5.4.x、5.5.x 等长期支持版本），通过包管理器执行：apt-get update && apt-get install php5=5.3.4+ 或 yum update php。如暂时无法升级，可临时禁用 intl 扩展：编辑 php.ini 注释掉 extension=intl.so 并重启 PHP-FPM/Apache，或在代码层面避免调用 NumberFormatter::getSymbol() 且避免传入异常参数作为临时缓解。建议尽快完成版本升级并重启服务生效。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "PHP NumberFormatter::getSymbol 整数溢出漏洞"
updated = "2026-06-16T23:24:44Z"

