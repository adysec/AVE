[basic]
description = "htDig 的 htsearch 程序在 3.2 beta、3.1.6、3.1.5 及更早版本中存在信息泄露漏洞。远程攻击者可通过向 config 参数传递一个不存在的配置文件路径，触发程序返回包含服务器物理路径详细信息的错误消息，从而获取目标系统的目录结构信息。该漏洞利用条件简单，无需身份认证，攻击者仅需构造特制 HTTP 请求即可实施探测，为后续攻击提供信息收集基础。CWE-209 归类为通过错误消息导致的信息暴露。"
published = "2001-08-31T04:00:00Z"
remediation = '升级 ht://Dig 至 3.2.0b6 或更新版本（SourceForge 可下载），该版本修复了 config 参数错误消息泄露物理路径的问题。如无法升级，修改 htsearch 程序源码，在错误处理函数中将真实路径替换为占位符（如 "/var/www/html" 替换为 "[REDACTED]"），并确保 Web 服务器配置中 display_errors 为 Off，禁止向远程客户端输出详细错误信息。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "htdig htsearch 错误消息泄露物理路径漏洞"
updated = "2026-06-16T21:53:20Z"

