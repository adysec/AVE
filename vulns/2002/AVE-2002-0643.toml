[basic]
description = "HP Tru64 UNIX 4.0/5.0/5.1 版本的 dxpause、dxconsole 及 dtsession 等应用程序在处理 _XKB_CHARSET 环境变量时存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标系统传递特制的超长 _XKB_CHARSET 环境变量触发该溢出，从而在受影响系统上执行任意代码。该漏洞影响 HP Tru64 UNIX 4.0g、4.0f、5.0a、5.1 及 5.1a 等多个版本，CVSS 评分为 7.5，危害等级高。攻击者无需事先获取系统凭据，只需通过网络访问运行上述易受攻击程序的 Tru64 系统即可实施利用，成功利用可导致攻击者完全控制受影响主机。"
published = "2002-09-02T04:00:00.000"
remediation = "应用 HP 安全公告 SRB0039W 发布的补丁修复该漏洞，受影响版本 Tru64 UNIX 4.0f/g、5.0a、5.1、5.1a 中 dxpause、dxconsole、dtsession 三个程序需同步更新至公告所列补丁版本。如暂时无法打补丁，可临时移除 dxpause、dxconsole、dtsession 的 SUID 位（chmod u-s /usr/bin/X11/dxconsole /usr/bin/X11/dxpause /usr/dt/bin/dtsession）以阻止本地提权，并限制非授权本地用户对系统的交互式访问。由于 Tru64 UNIX 已停止支持，建议评估迁移至受支持的操作系统以彻底消除风险。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "HP Tru64 UNIX _XKB_CHARSET 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:59:38.557"

