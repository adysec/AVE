[basic]
description = 'Kootenay Web KW Whois 1.0 CGI 程序存在远程命令执行漏洞，由于 "whois" 参数未对 Shell 元字符进行有效过滤，未经身份认证的远程攻击者可通过向该参数提交包含 Shell 元字符的恶意载荷，在服务器上以 CGI 进程权限执行任意系统命令。该漏洞影响 Kootenay Web KW Whois 1.0 版本，攻击向量为网络远程、无需认证、攻击复杂度低，CVSS 评分 10.0（严重），可导致服务器完全失陷（机密性、完整性、可用性均完全丧失）。攻击者仅需构造包含 Shell 元字符（如分号、反引号、管道符等）的 whois 参数提交至 CGI 程序即可触发命令注入，实现远程代码执行。ExploitDB 已公开 PoC（EDB-ID: 20370），攻击者可直接利用。厂商已停止维护，建议立即停用该组件或升级至安全版本。'
published = "2000-12-19T05:00:00.000"
remediation = '建议立即移除或替换 Kootenay Web KW Whois 1.0 CGI 程序，改用现代维护的 WHOIS 查询工具（如 whois 命令行工具或成熟的 Web WHOIS 接口）。若必须保留该 CGI，请在 Web 服务器层面（如 Apache mod_security 或 Nginx WAF）配置规则拦截包含 shell 元字符（; | & $ ` \n 等）的 whois 参数，并在 Web 服务器配置中限制该 CGI 脚本的执行权限（如禁用 Shell 执行权限、限制执行用户权限）。建议升级至现代维护的 WHOIS 服务或使用成熟的 WHOIS 库替代该老旧 CGI 程序。由于厂商 Kootenay Web Inc. 已停止维护且无官方补丁，建议彻底替换为成熟维护的 WHOIS 解决方案。'
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Kootenay Web Inc whois 1.0 远程命令执行漏洞"
updated = "2026-06-16T21:52:49.050"

