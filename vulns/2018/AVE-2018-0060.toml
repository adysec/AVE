[basic]
description = "Apache HTTPD 的 mod_jk 反向代理组件在对请求路径进行 URI-worker 映射匹配前的规范化处理过程中存在路径规范化漏洞，影响 Apache Tomcat JK Connector 1.2.0 至 1.2.44 版本。当通过 httpd 仅暴露部分 Tomcat 支持的 URL 时，未经身份认证的远程攻击者可通过构造特制请求绕过 httpd 层配置的访问控制，直接访问到原本不应暴露的反向代理后的应用功能或资源，导致敏感信息泄露。该漏洞原理属于路径规范化不完整导致的访问控制绕过（CWE-22），攻击者无需登录凭据，仅需向目标服务器发送精心构造的 HTTP 请求即可触发。此漏洞与 CVE-2018-1323 存在一定重叠但并非同一问题，Red Hat 已将其评级为重要（important）安全漏洞，受影响版本用户应升级至修复版本。"
published = "2018-10-31T20:29:00Z"
remediation = "升级 Apache Tomcat Connectors (mod_jk) 至 1.2.45 或更高版本。该版本修复了请求路径规范化处理中的边界情况错误，防止通过构造特殊请求绕过 httpd 访问控制或暴露未授权的 Tomcat 应用路径。操作步骤：从 https://archive.apache.org/dist/tomcat/tomcat-connectors/jk/ 下载对应平台的最新版源码包或二进制包，重新编译安装 mod_jk 模块并替换 httpd 的 modules/ 目录中原有文件，重启 httpd 服务使新模块生效。如短期内无法完成升级，可在 httpd 配置中通过 JkMount 指令精确限制反向代理暴露的 URL 路径范围，同时在防火墙层面禁止外部直接访问 Tomcat 端口，仅允许 httpd 后端访问，以降低访问控制绕过风险。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Apache HTTPD mod_jk 访问控制权限绕过漏洞"
updated = "2026-06-17T01:36:31Z"

