[basic]
description = "AdCycle 横幅广告管理系统在安装过程中，将 build.cgi 程序遗留在可通过 Web 直接访问的目录中。未经身份认证的远程攻击者无需任何凭据，即可通过浏览器直接访问并执行该 CGI 程序，从而读取系统管理员密码或删除数据库。该漏洞影响部署了 AdCycle 横幅管理系统的网站，攻击者可利用此缺陷泄露敏感配置信息并进一步控制服务器，CVSS 评分 7.5，危害等级高。"
published = "2001-01-09T05:00:00Z"
remediation = "从 web 可访问目录中删除或移动 build.cgi 程序至非 web 目录，并修改文件权限为 700 仅允许 root 用户执行。若 AdCycle 官方提供修复版本，应升级到最新补丁版本。同时检查 web 服务器配置文件，通过 .htaccess 或目录配置禁止执行 cgi-bin 目录外的 CGI 程序。临时缓解措施可在防火墙或 web 服务器层面直接拦截对 build.cgi 的访问请求。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "AdCycle 广告管理系统 敏感信息泄露漏洞"
updated = "2026-06-16T21:53:17Z"

