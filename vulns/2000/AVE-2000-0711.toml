[basic]
description = "XFree86 3.3.5/3.3.6 版本的 Xlib 库存在缓冲区溢出漏洞，本地攻击者可通过设置过长的 DISPLAY 环境变量或传递超长的 -display 命令行参数触发溢出，进而在目标系统上执行任意代码。该漏洞影响使用上述版本 XFree86 的 Unix/Linux 系统，CVSS 评分 4.6（本地攻击、低复杂度、无需认证、部分机密性/完整性/可用性影响），属于本地权限提升类漏洞。"
published = "2000-12-19T05:00:00Z"
remediation = "升级 XFree86 至 4.0.1 或更高版本（已修复该缓冲区溢出），或迁移至 X.Org Server 6.7 以上版本。若无法立即升级，可通过限制本地用户设置过长的 DISPLAY 环境变量、禁用不必要的 X 服务监听端口（如 TCP 6000）作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "XFree86 Xlib 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:53Z"

