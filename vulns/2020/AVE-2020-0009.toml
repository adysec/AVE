[basic]
description = "Internet Explorer 的脚本引擎 JScript.dll 在处理内存对象时存在释放后使用（Use-After-Free）漏洞。远程攻击者可构造特制网站，诱使用户通过 IE 浏览器访问，触发脚本引擎对已释放内存的非法访问，从而在当前用户权限下执行任意代码。该漏洞影响 Internet Explorer 11 及 Windows 系统的 WPAD 服务，已发现在野利用，CVSS 评分 7.5，危害等级高。Microsoft 已于 2020 年 2 月安全更新中修复此漏洞。"
published = "2020-02-11T22:15:14.883"
remediation = '立即安装 Microsoft 2020 年 2 月安全更新（对应 Windows 10 版本 1909/1903 为 KB4537767，Windows Server 2019/Windows 10 1809 为 KB4537776，Windows 8.1/Server 2012 R2 为 KB4537789，Windows 7 SP1/Server 2008 R2 为 KB4537820），可通过 Windows Update 自动获取。如无法立即打补丁，可配置 IE 增强安全配置（ESC）限制 ActiveX 脚本执行，或在组策略中将 Internet Explorer 的"允许运行脚本"设置为"禁用"作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Internet Explorer JScript 引擎远程代码执行漏洞"
updated = "2026-06-17T02:46:19.067"

