[basic]
description = 'Pillow（Python 图像处理库）的 WindowsViewer.get_command() 方法在构造 cmd.exe 命令时，直接将文件路径嵌入 f-string 而未进行转义处理，随后通过 subprocess.Popen(..., shell=True) 执行。攻击者可通过构造包含双引号（"）和连接符（&）等 shell 元字符的恶意文件路径，突破路径引号限制注入任意 cmd.exe 命令。该漏洞仅影响 Windows 平台（macOS/Linux 版本已正确使用 shlex.quote() 转义），需要攻击者能够控制文件路径且用户交互触发图像显示操作。CVSS 评分 4.5，危害等级中危。Pillow 12.3.0 版本已修复此问题。'
published = "2026-07-06T19:17:08Z"
remediation = "升级 Pillow 至 12.3.0 或更高版本，该版本在 WindowsViewer.get_command() 中对文件路径参数使用了 shlex.quote() 转义。如无法立即升级，避免在 Windows 系统上使用 WindowsViewer 处理不可信文件路径，或设置环境变量限制 shell 特殊字符传入。"
score = 4.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Pillow WindowsViewer 操作系统命令注入漏洞"
updated = "2026-07-07T18:58:33Z"

