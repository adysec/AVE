[basic]
description = "Digital Unix 4.0F 系统中的 kdebug 调试守护进程（kdebugd）存在任意文件读取漏洞。远程攻击者无需身份认证，通过在初始化数据包中直接指定目标文件的完整路径名，即可利用该服务读取系统上的任意文件，包括敏感配置文件、密码文件等。该漏洞源于 kdebugd 未对客户端请求的文件路径进行充分的访问控制检查，导致攻击者可越权访问系统任意文件，造成敏感信息泄露。CVSS 评分 6.4，危害等级中危。"
published = "2000-11-14T05:00:00.000"
remediation = "升级 Digital Unix 至 4.0F 之后的安全更新版本，或安装 Compaq 官方发布的 kdebugd 安全补丁。如无法升级，可在 inetd.conf 中禁用 kdebugd 服务（注释掉 kdebugd 行）并重启 inetd 进程，或在防火墙层面阻止外部对 kdebugd 端口（默认 9999/UDP）的访问作为临时缓解措施。"
score = 6.4
severity = "MEDIUM"
sources = ["epss"]
title = "Digital Unix kdebugd 任意文件读取漏洞"
updated = "2026-06-16T21:52:35.270"

