[basic]
description = "SGI IRIX 系统中的 MIPSPro 编译器（C、C++、F77 和 F90）在编译过程中会在 /tmp 目录下生成临时文件，且文件名可被预测。本地攻击者可在其他用户编译时，通过创建同名符号链接或写入恶意内容到这些临时文件中，实现权限提升或数据篡改。该漏洞影响 SGI IRIX 系统，攻击条件为本地用户权限，CVSS 评分 3.7，危害等级低。"
published = "2000-06-21T04:00:00Z"
remediation = "由于 SGI IRIX 系统已停止维护，官方不再提供补丁。建议将编译器临时文件目录通过环境变量 TMPDIR 指向用户私有目录（如 `export TMPDIR=$HOME/tmp`），避免使用共享的 /tmp 目录；或在编译前设置严格的 umask（如 `umask 077`）限制临时文件权限；最彻底的方案是迁移至受支持的编译器或操作系统。"
score = 3.7
severity = "LOW"
sources = ["avd"]
title = "SGI IRIX MIPSPro 编译器 /tmp 可预测文件名漏洞"
updated = "2026-06-16T21:52:02Z"

