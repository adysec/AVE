[basic]
description = "Apple Safari 6.0 之前版本所使用的 WebKit 渲染引擎存在内存破坏漏洞。未经身份认证的远程攻击者可构造包含恶意代码的网页，当用户使用受影响版本的 Safari 浏览器访问该恶意网页时，WebKit 在处理网页内容过程中触发内存损坏，导致远程代码执行或应用程序拒绝服务崩溃。该漏洞影响 Safari 5.x 及更早版本、iOS 5.x 及更早版本的 Mac 及 iOS 设备，CVSS 评分 9.3，危害等级严重，攻击复杂度较低，无需用户交互即可在目标系统上执行任意代码。Apple 已在 2012 年 7 月发布的安全更新 Safari 6.0 和 iOS 6.0 中修复此漏洞。"
published = "2012-07-25T20:55:02Z"
remediation = "建议将 Mac 系统升级至 OS X Lion v10.7.4 或更高版本（内置 Safari 6.0），Apple 已通过改进 WebKit 内存处理机制修复该漏洞；iOS 设备需升级至 iOS 6.0 或更高版本。如暂无法升级，应避免访问不受信任的网站，并考虑在防火墙或代理层面过滤恶意 URL 作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:33Z"

