[basic]
description = "Formie 是 Craft CMS 的表单管理插件，存在缺失授权漏洞。该插件的管理设置相关路由未在服务端一致执行权限校验，导致已认证但权限受限的非管理员 Craft CMS 控制面板用户可直接访问 Formie 设置页面，修改全局插件配置，以及访问导入/导出设置功能。漏洞利用需要目标系统运行受影响版本的 Formie 插件，且攻击者拥有 Craft CMS 控制面板的已认证账户，可能导致表单配置被篡改和工作流中断。"
published = "2026-01-01T00:00:00Z"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Craft CMS Formie 后台设置权限绕过漏洞"
updated = "2026-01-01T00:00:00Z"

