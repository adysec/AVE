[basic]
description = "FreeBSD 4.2 及更早版本中的 ipfw 和 ip6fw 防火墙存在过滤规则逃避漏洞。远程攻击者可通过在 TCP 数据包中设置 ECE（ECN Echo）标志，使该数据包被防火墙误认为是已建立连接的一部分，从而绕过基于连接状态的访问控制限制。该漏洞影响 FreeBSD 3.x 和 4.x 系列版本，攻击者无需身份认证即可远程利用此漏洞绕过防火墙规则，可能导致未经授权的网络访问。"
published = "2001-01-01T00:00:00Z"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "FreeBSD 3.x / 4.x  -  ipfw过滤逃避漏洞"
updated = "2001-01-01T00:00:00Z"

