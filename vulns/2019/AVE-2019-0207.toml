[basic]
description = "WordPress 5.0.3 及之前版本中的 wp_crop_image() 函数存在路径遍历漏洞（CWE-22）。具有图像裁剪权限的已认证攻击者（通常为作者角色及以上）可通过构造包含两个图像扩展名和 ../ 序列的恶意文件名（如以 .jpg?/../../file.jpg 结尾），将裁剪后的输出图片写入服务器上的任意目录。攻击者可利用该漏洞将包含恶意代码的图片文件写入 Web 可访问目录，进而实现远程代码执行。该漏洞影响 WordPress 5.0.3 及之前所有版本，CVSSv3 评分为 6.5，危害等级为中危。"
published = "2019-02-20T03:29:00Z"
remediation = "建议立即升级 WordPress 至 5.0.4 或更高版本。WordPress 5.0.4 安全版本已修复 wp_crop_image() 函数中的路径遍历漏洞，防止攻击者通过构造包含双扩展名和 ../ 序列的文件名将输出写入任意目录。如暂时无法升级，可临时限制具有图片裁剪权限的用户角色，或通过 Web 应用防火墙拦截包含 ../ 序列和双扩展名的请求参数，并在服务器层面配置 open_basedir 限制，限制 PHP 进程的文件访问范围。"
score = 6.5
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress WordPress 路径遍历漏洞"
updated = "2026-06-17T02:42:49Z"

