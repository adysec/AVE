[basic]
description = "tags.<value>Allaire JRun 2.3 服务器中的 SSIFilter servlet 存在目录遍历漏洞，未经身份认证的远程攻击者可通过构造包含目录遍历序列（如 ../）的特殊请求，利用 SSIFilter servlet 绕过路径限制读取服务器上的任意文件。该漏洞影响运行 Allaire JRun 2.3 版本的服务器，攻击者无需凭据即可在远程执行任意文件读取操作，可能导致敏感配置文件、源代码或其他机密信息泄露，CVSS 评分 5.0，危害等级中等。"
published = "2000-12-11T05:00:00.000"
remediation = "升级 Allaire JRun Server 至 3.0 或更高版本，或安装 Allaire Security Bulletin ASB00-28 提供的安全补丁。如暂时无法升级，可在 servlets.properties 配置文件中禁用或删除 SSIFilter servlet 的映射，阻止攻击者通过 /servlet/com.livesoftware.jrun.plugins.ssi.SSIFilter/ 路径访问该组件。同时可在防火墙或反向代理层拦截包含 ../ 序列的恶意请求路径，防止目录遍历攻击。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Allaire JRun SSIFilter 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:53:03.347"

