[basic]
description = "Linux 内核 fs/proc 子系统的 __read_vmcore 函数在处理 vmcore 文件读取时存在软锁漏洞。在 kdump 崩溃转储的内存受限环境中，该函数第二个循环缺少足够的调度点，导致 CPU 长时间被占用而无法被抢占，触发内核软锁告警。此软锁会干扰 RCU 机制的内存释放操作，进而导致 kdump 崩溃转储过程卡住，无法完成系统崩溃后的内存采集工作。攻击者需要具备本地低权限访问权限，在系统执行 kdump 操作时无需额外用户交互即可触发此漏洞，造成系统可用性受损。"
published = "2025-02-12T14:15:32.463"
remediation = "升级 Linux 内核至已修复的稳定版本。上游修复提交为 649b266606bc，已合入内核 4.20、5.4.290、5.10.234、5.15.177、6.1.127、6.6.74、6.12.11。Debian 用户应安装 bullseye 安全更新（DLA-4075）；Ubuntu 22.04 LTS 用户需将内核升级至 5.15.0-1077.83 或更高版本，Ubuntu 20.04 LTS 标准支持已结束，建议升级至 22.04 LTS 或应用 FIPS 更新 5.4.0-1142.153+fips1。执行 apt update && apt upgrade linux-image，然后重启系统。若短期内无法升级，可在 kdump 配置中禁用 vmcore 读取作为临时缓解措施，或限制本地用户对 /proc/vmcore 的访问权限。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel fs/proc 软锁死拒绝服务漏洞"
updated = "2026-06-17T08:44:02.650"

