[basic]
description = 'AOL Instant Messenger（AIM）4.3.2229 之前版本存在缓冲区溢出漏洞。当程序处理 "buddyicon" 命令中过长的 "src" 参数时，未正确校验输入长度，导致堆栈缓冲区溢出。远程攻击者可向目标用户发送特制的畸形 BuddyIcon 数据包触发该漏洞，成功利用后可导致目标系统执行任意代码。该漏洞影响 AIM 4.0、4.1.2010、4.2.1193 等版本，CVSS 评分 7.5，危害等级高。厂商已发布 AIM 4.3.2229 版本修复此问题。'
published = "2001-01-09T05:00:00.000"
remediation = "升级 AOL Instant Messenger 至 4.3.2229 或更高版本，该版本已修复 buddyicon 命令处理中 src 参数长度校验不足导致的缓冲区溢出问题。由于 AOL 已于 2017 年 12 月 15 日停止 AIM 服务，建议立即迁移至其他即时通讯软件（如 Slack、Telegram 等）以消除安全风险。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "AOL Instant Messenger BuddyIcon 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:08.013"

