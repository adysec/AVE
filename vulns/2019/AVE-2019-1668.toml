[basic]
description = "ZOHO ManageEngine ServiceDesk Plus（SDP）10.0 build 10012之前版本存在任意文件上传漏洞。具有低权限的远程攻击者可通过登录页面自定义功能上传恶意文件，利用该漏洞可在服务器上写入任意文件，可能导致服务器被完全控制。攻击无需用户交互，攻击复杂度低，仅需低权限即可触发。"
published = "2019-02-17T04:29:00Z"
remediation = "立即升级 ZOHO ManageEngine ServiceDesk Plus 至 10.0 build 10012 或更高版本，该版本已修复登录页面自定义功能中的任意文件上传漏洞。如无法立即升级，可在 Web 服务器（如 IIS/Apache）层面限制 /custom 目录仅允许上传图片类型文件（如 .jpg/.png/.gif），并禁用该目录的脚本执行权限作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["kev"]
title = "ZOHO ManageEngine ServiceDesk Plus 任意文件上传漏洞"
updated = "2026-06-17T02:41:56Z"

