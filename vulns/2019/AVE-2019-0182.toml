[basic]
description = "NTPsec 是一款 NTP（网络时间协议）的开源安全增强实现。该漏洞（CVE-2019-6443）存在于 NTPsec 1.1.2 及更早版本的 ntpd 守护进程中，具体由 ntp_control.c 文件内 `read_sysvars` 函数中的 `ctl_getitem` 实现缺陷所导致。由于边界检查不完善，攻击者可通过发送特制的控制协议请求触发基于栈的缓冲区越界读取（stack-based buffer over-read，CWE-125）。该漏洞的 CVSSv3 评分为 9.1（严重等级），攻击向量为网络（AV:N），攻击复杂度低（AC:L），无需特权（PR:N）且无需用户交互（UI:N），成功利用后可能导致敏感内存信息泄露（C:H）及系统可用性受影响（A:H），但对完整性影响有限（I:N）。此漏洞影响部署了 NTPsec 的服务器和网络设备，攻击者无需身份认证即可在远程直接触发，公开 PoC 已存在于 ExploitDB（exploit-db.com/exploits/46175）及多个 GitHub 仓库中。NTPsec 项目在 1.1.3 版本中修复了此缺陷，受影响用户应尽快升级至安全版本。"
published = "2019-01-16T05:29:01Z"
remediation = "立即升级 NTPsec 到 1.1.3 或更高版本，修复 ctl_getitem 中的栈缓冲区越界读取漏洞。如暂时无法升级，可在防火墙或网络 ACL 中限制对 UDP 123 端口的访问，仅允许可信时间源 IP 通信，以减少暴露面。"
score = 9.1
severity = "CRITICAL"
sources = ["nuclei"]
title = "NTPsec ntpd 缓冲区越界读取漏洞"
updated = "2026-06-17T02:39:03Z"

