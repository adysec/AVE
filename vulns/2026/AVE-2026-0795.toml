[basic]
description = "proot-distro 是一款用于管理 proot 容器的 Termux 工具，其 restore 命令在处理用户提供的恶意备份归档文件时存在容器隔离绕过漏洞。由于恢复过程中未验证硬链接条目的源容器是否与目标容器一致，攻击者可通过构造包含跨容器硬链接的恶意 tar 归档文件，诱骗用户执行 restore 操作，从而在不同容器之间复制文件。该漏洞可导致攻击者读取其他容器中的敏感文件（如 SSH 私钥、API 凭证、数据库文件）或向其他容器注入恶意文件，破坏容器间的隔离边界。攻击条件为受害者使用 proot-distro restore 恢复攻击者提供的特制备份文件，无需 root 权限。该漏洞影响 proot-distro 5.1.5 及之前版本，已在 5.1.6 版本中修复。"
published = "2026-07-29T17:16:53Z"
remediation = "立即将 proot-distro 升级至 v5.1.6 或更高版本（`pkg upgrade proot-distro`）。如无法升级，避免使用 `proot-distro restore` 命令恢复来自不可信来源的备份归档文件，并手动检查归档中是否存在跨容器硬链接条目（`linkname` 指向其他容器路径）。"
score = 8.2
severity = "HIGH"
sources = ["ghsa"]
title = "Termux proot-distro 容器隔离绕过漏洞"
updated = "2026-07-30T20:07:01Z"

