[basic]
description = "Linux 内核 2.4.x 版本的 STP（生成树协议）实现中存在长度验证不当漏洞。攻击者无需身份认证，通过网络向目标系统发送特制的 STP 协议报文（BPDU 包），由于内核代码未对报文长度进行严格校验，可触发内核 panic 或系统崩溃，导致拒绝服务。该漏洞影响所有使用 Linux 2.4.x 内核的系统，攻击者只需在网络二层可达条件下即可发起攻击，无需任何权限，可直接中断网络设备的转发服务。该漏洞已在后续内核版本中得到修复，受影响用户应升级至更新的稳定内核版本。"
published = "2003-08-27T00:00:00Z"
remediation = "建议将 Linux 内核升级至 2.4.21 或更高版本，以修复 STP 协议处理中的漏洞；对于无法立即升级的系统，可通过配置防火墙拦截未经授权的 STP 控制报文，或在不需要生成树协议的网段禁用 STP 功能以缓解风险。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux Kernel 2.4.x STP 协议拒绝服务漏洞"
updated = "2003-08-27T00:00:00Z"

