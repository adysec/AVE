[basic]
description = "WordPress 的 BestWebSoft Google Analytics 插件（bws-google-analytics）1.7.1 之前版本的后台管理页面中存在跨站脚本漏洞（CWE-79）。该漏洞源于插件在渲染 `bws_panel` 页面时，未对 `category` GET 参数进行充分的输入过滤与输出转义处理，导致攻击者可注入任意 HTML 和 JavaScript 代码。已认证的攻击者可通过构造特制的 URL，诱使具有管理员权限的用户点击，从而在目标浏览器中执行恶意脚本，窃取会话 Cookie、篡改页面内容或执行其他恶意操作。CVSS 评分 6.1，危害等级中危。建议升级至 1.7.1 或更高版本修复。"
published = "2019-08-21T13:15:11Z"
remediation = "立即升级 bws-google-analytics 插件至 1.7.1 或更高版本：登录 WordPress 后台 → 插件 → 已安装插件 → 找到 BWS Google Analytics → 点击「更新」。如该插件已停更，建议停用并删除，替换为其他活跃维护的 Google Analytics 集成插件（如 Site Kit by Google）。临时缓解：启用 WordPress 内置的 Web 应用防火墙（如 Wordfence）对 XSS 攻击向量进行拦截。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress bws-google-analytics插件跨站脚本漏洞"
updated = "2026-06-17T01:13:05Z"

