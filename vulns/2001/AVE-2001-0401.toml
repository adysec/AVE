[basic]
description = "CVE-2001-1279是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-07-17T04:00:00Z"
remediation = "立即将 tcpdump 升级至 3.6_rel3 或更高版本（3.6.2 及更早版本受影响）；发行版用户可安装对应安全更新（如 Red Hat RHSA-2001:089、FreeBSD-SA-01:48、Mandrake MDKSA-2002:032、Caldera CSSA-2002-025）。临时缓解：在防火墙或抓包过滤中屏蔽 AFS Rx 相关 UDP 端口（7000–7009 等），或以 `tcpdump not udp port 7000 or 7001 or 7002 or 7003 or 7004 or 7005 or 7006 or 7007 or 7008 or 7009` 方式启动，避免解码恶意 AFS RPC 包。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
