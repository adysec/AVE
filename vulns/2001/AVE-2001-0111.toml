[basic]
description = "ncompress 4.2.4 及更早版本中的 comprexx 函数存在栈缓冲区溢出漏洞。当该库被用于跨越安全边界的场景（如 FTP 服务器处理文件名参数）时，远程攻击者可通过向目标服务提交超长文件名参数触发栈缓冲区溢出，导致任意代码执行。该漏洞影响广泛使用 ncompress 压缩库的各类服务和应用，CVSS 评分 7.5，危害等级高。"
published = "2004-12-23T05:00:00Z"
remediation = '升级 ncompress 至 4.2.4-r1 及以上版本。Gentoo 系统执行 `emerge ">=app-arch/ncompress-4.2.4-r1"`；Red Hat 系统安装 RHSA-2004-536 提供的更新包。如无法升级，避免在 FTP 等跨安全边界场景中使用 ncompress 处理不可信文件名参数。'
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "ncompress comprexx 函数栈缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:56:13Z"

