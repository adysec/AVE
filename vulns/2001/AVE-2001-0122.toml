[basic]
description = "SunFTP 1.0 Build 9 存在目录遍历漏洞，未经身份认证的远程攻击者可通过在多种 FTP 命令中插入 .. (点号) 字符绕过目录限制，从而读取服务器上的任意文件。受影响的命令包括 GET（下载文件）、MKDIR（创建目录）、RMDIR（删除目录）、RENAME（重命名文件）以及 PUT（上传文件）。攻击者仅需连接到目标 FTP 服务即可利用此漏洞，无需提供有效凭证或进行复杂交互，攻击复杂度低。该漏洞可导致敏感配置文件、系统文件等敏感信息泄露，CVSS 评分 6.4，危害等级为中等。攻击者成功利用后可获取服务器的文件系统结构信息和敏感数据内容，为后续进一步攻击提供依据。"
published = "2001-05-03T04:00:00Z"
remediation = "立即停用 SunFTP 1.0 Build 9 并迁移至受支持的 FTP 服务器（如 FileZilla Server、vsftpd 或 Microsoft IIS FTP）。如短期内无法替换，应在防火墙层面限制 FTP 服务仅对可信 IP 开放，并在服务器上启用 NTFS 权限最小化原则，禁止 FTP 服务账户对系统根目录外的敏感路径具有读写权限，同时部署入侵检测系统监控包含 ../ 或 %2e%2e%2f 的 FTP 命令以发现遍历攻击行为。"
score = 6.4
severity = "MEDIUM"
sources = ["cve"]
title = "Sun SunFTP 目录遍历漏洞"
updated = "2026-06-16T21:54:01Z"

