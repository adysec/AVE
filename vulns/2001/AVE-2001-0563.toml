[basic]
description = "OpenBSD 2.9 和 3.0 版本的 uipc 系统调用（uipc_syscalls.c）在向 fdrelease 函数传递返回值时错误地使用了用户模式返回值而非内核模式 rval 值，导致空指针解引用漏洞。本地攻击者只需拥有低权限账户即可利用该漏洞触发系统拒绝服务，造成目标系统崩溃。该漏洞影响 OpenBSD 2.9 及 3.0 版本，攻击复杂度低，无需用户交互。"
published = "2001-12-31T05:00:00Z"
remediation = "升级 OpenBSD 至 3.1 或更高版本，该漏洞已在后续版本的内核中修复。如无法升级，可下载 OpenBSD 3.0 的 013_pipe.patch 内核补丁（位于 ftp.openbsd.org/pub/OpenBSD/patches/3.0/common/），以 root 权限执行 `patch -p0 < 013_pipe.patch` 后重新编译内核并重启。作为临时缓解措施，可限制不可信用户的本地登录权限，减少攻击面。"
score = 5.5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "OpenBSD 2.9/3.0 uipc系统调用用户态返回值空指针解引用拒绝服务漏洞"
updated = "2026-06-16T21:56:30Z"

