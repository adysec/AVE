[basic]
description = "这是一个 Windows AppX 部署服务 (AppXSVC) 硬链接处理不当导致的特权提升漏洞。攻击者通过在本地系统上构造恶意硬链接文件，使其覆盖或重定向到敏感系统文件或注册表项，从而获取更高的系统权限。该漏洞影响 Windows 10/11 及 Windows Server 版本，攻击者需要低权限用户权限进行本地攻击，攻击复杂性低，无需用户交互，CVSS 评分 7.8 评级为高危。成功利用此漏洞可导致系统完全被控制，攻击者能够获取对关键系统资源的完全访问权限，包括读取、修改和删除所有数据。微软已在后续安全更新中修复此漏洞，用户应及时安装补丁以确保系统安全。"
published = "2019-07-15T19:15:20Z"
remediation = "建议立即安装 Microsoft 2019 年 7 月安全更新：Windows 10 1809/Server 2019 安装 KB4507469，Windows 10 1903 安装 KB4507453，Windows 8.1/Server 2012 R2 安装 KB4507448（月度汇总）或 KB4507457（仅安全），Windows 7/Server 2008 R2 安装 KB4507449（月度汇总）或 KB4507456（仅安全）。如无法立即打补丁，可通过组策略禁用 AppX Deployment Service (AppXSVC) 作为临时缓解措施，路径：计算机配置→管理模板→Windows 组件→应用包部署→关闭 AppX 部署服务。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "微软 Windows 特权提升漏洞"
updated = "2026-06-17T02:27:53Z"

