[basic]
description = "Ipswitch IMail 6.0 Web 服务存在拒绝服务漏洞，远程攻击者可通过发送大量包含超长 Host 头的连接请求，导致服务线程崩溃，造成拒绝服务。该漏洞影响 Ipswitch IMail 6.00 版本，攻击者无需身份认证即可利用，CVSS 评分 5.0，危害等级中危。目前厂商已发布更新修复此漏洞。"
published = "2000-11-14T05:00:00Z"
remediation = "升级 Ipswitch IMail 至 6.01 或更高版本（该漏洞已在后续版本修复）。如无法升级，可在 IIS 或反向代理层配置请求头长度限制，将 Host 字段长度限制在 255 字节以内；同时配置连接速率限制，防止单 IP 大量并发连接耗尽线程池。也可在防火墙或 WAF 上添加规则，过滤包含超长 Host 头的 HTTP 请求。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Ipswitch IMail 6.0 Web Service 拒绝服务漏洞"
updated = "2026-06-16T21:52:32Z"

