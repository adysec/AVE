[basic]
description = "DomainMOD 4.11.01 及之前版本中的 assets/edit/host.php 页面存在跨站脚本（XSS）漏洞。具有管理员权限的认证攻击者可通过向 Web Host Name 或 Web Host URL 字段提交特制的恶意脚本，当其他管理员用户访问该编辑页面时，恶意脚本将在浏览器中执行，导致敏感信息泄露或会话劫持。该漏洞需攻击者具备高权限且需用户交互，CVSS 评分 4.8，危害等级中危。"
published = "2018-12-06T19:29:00Z"
remediation = "升级 DomainMOD 至 4.11.02 或更高版本，该版本已修复 assets/edit/host.php 中 Web Host Name 和 Web Host URL 字段的输入过滤缺陷。如无法立即升级，可在 Web 服务器（如 Apache/Nginx）层面添加 WAF 规则，对 /assets/edit/host.php 的 whid 参数进行输入校验，过滤 <script> 等危险字符。"
score = 4.8
severity = "MEDIUM"
sources = ["nuclei"]
title = "DomainMOD 跨站脚本攻击"
updated = "2026-06-17T01:50:06Z"

