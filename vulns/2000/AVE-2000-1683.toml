[basic]
description = "Mobius DocumentDirect for the Internet 1.2 的 Web 授权表单存在缓冲区溢出漏洞，远程攻击者可通过向登录页面提交超长用户名参数触发该漏洞，导致目标系统拒绝服务或以系统权限执行任意命令。该漏洞影响 Mobius DocumentDirect for the Internet 1.2 版本，CVSS 评分 10.0，危害等级严重。攻击无需身份认证，利用难度低，可造成完全的信息机密性、完整性和可用性丧失。"
published = "2000-11-14T05:00:00.000"
remediation = "Mobius DocumentDirect for the Internet 1.2 已于 2000 年停止维护，厂商未提供安全补丁。建议立即将该产品从生产环境彻底下线或迁移至替代方案。如无法立即下线，应在网络防火墙层面限制对 Web 授权表单端口（通常为 80/443）的访问，仅允许受信任的内部 IP 地址连接，并在 Web 服务器或反向代理层对用户名输入字段实施长度限制（建议不超过 64 字符），同时启用入侵检测系统监控针对该服务的异常请求。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Mobius DocumentDirect for the Internet 1.2 Web授权表单缓冲区溢出漏洞"
updated = "2026-06-16T21:52:32.987"

