[info]
author = "AVE"
description = "通过检查 /proc/self/mem 接口存在性验证 Linux 内核 2.2.x mmap 本地拒绝服务漏洞。实际利用需编译 C 程序使用 mmap(PROT_READ) 访问不可读内存页触发内核崩溃。"
id = "POC-AVE-2002-0373"
name = "CVE-2002-1380 PoC"
severity = "low"
tags = ["cve-2002-1380"]
vuln_id = [
    "CVE-2002-1380",
    "AVE-2002-0373",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/proc/self/mem"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [""]
