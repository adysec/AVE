[basic]
description = 'OReilly WebSite Professional Web 服务器的 webfind.exe CGI 程序存在缓冲区溢出漏洞。远程攻击者无需身份认证即可通过构造包含超长 "keywords" 参数的 URL 触发缓冲区溢出，从而在目标服务器上执行任意命令。该漏洞影响 WebSite Professional 2.3.18、2.4 及 2.4.9 版本，CVSS 评分为 10，危害等级严重，攻击条件宽松，利用方式简单，仅需发送特制的 HTTP 请求即可完成远程代码执行。'
published = "2000-07-19T04:00:00.000"
remediation = "立即将 O'Reilly WebSite Professional 升级到 2.5 或更高版本以修复 webfind.exe 缓冲区溢出。若无法升级，删除或重命名服务器上的 webfind.exe（通常位于 cgi-shl 目录），并在 Web 服务器配置中禁用搜索 CGI；同时在防火墙或访问控制中拦截对 /cgi-shl/webfind.exe 及含超长 keywords 参数请求的访问。该产品已停更，长期应迁移至受支持的 Web 服务器。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "O'Reilly WebSite Professional webfind.exe 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:52:07.803"

