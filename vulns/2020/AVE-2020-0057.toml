[basic]
description = "Apache Airflow 1.10.10及更早版本在使用CeleryExecutor作为执行器时，Celery任务消息未经过身份验证即被处理。当攻击者能够直接连接到消息中间件（如Redis或RabbitMQ）时，可向Celery任务队列中注入恶意的任务消息（如airflow.executors.celery_executor.execute_command），导致Celery worker进程在接收并处理该消息时执行攻击者构造的任意操作系统命令，从而实现远程代码执行。该漏洞影响所有使用CeleryExecutor并暴露Redis或RabbitMQ消息中间件的Airflow部署，攻击者无需身份认证即可利用。Apache Software Foundation已于2020年7月发布安全公告，并在Airflow 1.10.11版本中修复了此问题。"
published = "2020-07-17T00:15:10Z"
remediation = "立即升级 Apache Airflow 至 1.10.11 或更高版本，官方在该版本中已修复 CeleryExecutor 的命令注入漏洞。如暂时无法升级，应在防火墙或安全组层面严格限制 Redis/RabbitMQ 消息队列代理的访问权限，仅允许 Airflow Scheduler 与 Worker 所在主机连接，阻断外部直接连接 Broker 的路径。同时建议评估将 CeleryExecutor 迁移至 KubernetesExecutor 或 LocalExecutor，以消除该攻击面。升级完成后请重启所有 Airflow 服务组件使补丁生效。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Apache Airflow 操作系统命令注入漏洞"
updated = "2026-06-17T02:51:11Z"

