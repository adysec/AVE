[basic]
description = "Bugzilla 批量修改功能存在权限绕过漏洞。当管理员执行批量修改（mass change）操作时，Bugzilla 会将第一个选中缺陷的 groupset（分组权限）错误地应用到所有选中缺陷上，而非保留每个缺陷原有的 groupset 设置。未经身份认证的远程攻击者可通过向目标系统提交特制批量修改请求，利用该逻辑缺陷将某些敏感缺陷的权限组设置为不安全的访问控制配置，导致原本仅限特定用户组查看的机密缺陷信息被泄露给未授权用户。该漏洞影响 Bugzilla 2.14 至 2.14.2 之前版本以及 2.16 至 2.16rc2 之前版本，CVSS 评分 7.5，危害等级高。攻击者只需具备网络访问权限即可利用，无需身份认证，成功利用可导致机密缺陷信息泄露及完整性破坏。"
published = "2002-08-12T04:00:00Z"
remediation = "建议立即升级到 Bugzilla 2.14.2 或 2.16rc2 及更高版本。如暂不支持直接升级，可从 https://ftp.mozilla.org/pub/webtools/ 下载对应版本的补丁包（bugzilla-2.14.1-to-2.14.2.diff.gz）手动应用。临时缓解措施：在 Apache 配置的 httpd.conf 中禁用 HostnameLookups 选项（设为 Off），并在 Bugzilla 参数设置（params）中确认未启用反向 DNS 验证，以防止 mass change 操作过程中自定义的 groupset 权限被错误地覆盖到所有缺陷记录。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Mozilla Bugzilla 批量修改功能权限分配不当漏洞"
updated = "2026-06-16T21:58:10Z"

