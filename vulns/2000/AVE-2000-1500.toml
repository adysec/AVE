[basic]
description = "Auction Weaver CGI 脚本 1.03 及更早版本中存在路径遍历漏洞，远程攻击者可通过向 catdir 参数提交包含 `..`（点点）序列的特制请求，突破目录限制读取服务器上的任意文件。该漏洞无需身份认证即可远程利用，攻击复杂度低，可导致敏感信息泄露（如配置文件、密码文件等），CVSS 评分 10.0，危害等级严重。受影响系统未提供有效输入过滤机制，建议升级至最新版本或禁用该 CGI 脚本。"
published = "2000-10-20T04:00:00Z"
remediation = "立即升级 Auction Weaver CGI 脚本至 1.04 或更高版本（如厂商已停止维护，则彻底移除该 CGI 脚本）。临时缓解措施：在 Web 服务器层面（如 Apache mod_rewrite 或 Nginx 访问控制规则）对 catdir 参数进行输入过滤，拦截包含 `../` 或 `..` 的请求，防止目录遍历攻击。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Auction Weaver CGI 脚本任意文件读取漏洞"
updated = "2026-06-16T21:52:16Z"

