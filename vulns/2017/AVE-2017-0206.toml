[basic]
description = "Adobe Flash Player 27.0.0.159 及更早版本存在字节码验证缺陷，导致不可信值被用于数组索引计算，进而引发类型混淆（Type Confusion）漏洞。攻击者可构造特制的 Flash 文件，通过诱导用户访问恶意网页或打开恶意文档触发该漏洞，成功利用可在当前用户上下文中执行任意代码。该漏洞已被俄罗斯 APT28 组织在野利用，影响所有安装受影响 Flash Player 版本的 Windows、macOS 及 Linux 系统。Adobe 已发布安全更新修复此漏洞，建议用户立即升级或禁用 Flash Player。"
published = "2017-10-22T19:29:00Z"
remediation = "立即升级 Adobe Flash Player 至 27.0.0.170 或更高版本。由于 Adobe Flash Player 已于 2020 年 12 月 31 日停止支持，建议彻底卸载 Flash Player 并移除浏览器插件，改用 HTML5 替代方案。对于必须使用 Flash 的内部系统，启用 click-to-play 机制并限制仅访问受信任站点。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），APT28 等攻击团伙已在实际攻击中利用，应优先处置。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Adobe Flash Player 任意代码执行漏洞"
updated = "2026-06-17T01:01:33Z"

