[basic]
description = "Webmin 1.920 及之前版本中的 rpc.cgi 脚本存在远程代码执行漏洞。由于 unserialise_variable 函数在处理用户提交的对象名时未做充分过滤，直接调用 eval 执行恶意代码，导致已通过身份认证的远程攻击者可构造特制对象名称触发代码执行，从而完全控制服务器。该漏洞影响所有启用 RPC 功能的 Webmin 实例，CVSS 评分 8.8，危害等级为高。Webmin 官方已发布安全修复，建议用户立即升级至最新版本以消除风险。"
published = "2019-08-26T18:15:12Z"
remediation = "建议立即升级 Webmin 到 1.921 或更高版本（修复提交 df8a43fb4bdc9c858874f72773bcba597ae9432c）。临时缓解：限制 RPC 接口访问权限，仅允许受信任管理员 IP 访问 /rpc.cgi，或在 Webmin 访问控制中禁用 RPC 模块功能。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "Webmin rpc.cgi 远程代码执行漏洞"
updated = "2026-06-17T02:20:47Z"

