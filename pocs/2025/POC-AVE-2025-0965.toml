[info]
author = "ave"
description = "验证Linux内核btrfs文件系统在RAID配置下因btrfs_set_item_key_safe()误用导致B树损坏并触发内核BUG的漏洞。通过在目标系统上运行fsstress等压力测试工具，触发btrfs_sync_file路径下的btrfs_partially_delete_raid_extent函数，导致内核panic。需目标系统运行受影响的内核版本并配置btrfs RAID。"
id = "POC-AVE-2025-0965"
name = "CVE-2025-21752 PoC"
severity = "medium"
tags = ["ave-2025-0965"]
vuln_id = [
    "CVE-2025-21752",
    "AVE-2025-0965",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/sys/fs/btrfs"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["btrfs"]
