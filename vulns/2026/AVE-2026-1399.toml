[basic]
description = "Electron 框架在 macOS 平台上用于验证应用是否由同签名父进程启动的检查机制存在竞态条件漏洞，本地进程可绕过该验证。启用 fuse 加固机制（限制 ELECTRON_RUN_AS_NODE 和 NODE_OPTIONS 仅允许同签名父进程使用）的 Electron 应用依赖此检查，攻击者可在目标设备上利用该漏洞在已签名的应用内执行任意代码，进而继承该应用的 TCC（隐私权限控制）和钥匙串访问权限。该漏洞影响 Electron 39.8.8、40.9.0、41.2.1 及 42.0.0-beta.3 之前的所有版本，仅当应用启用相关 fuse 加固选项时才受影响，攻击者需要具备本地访问权限才能利用。建议用户立即升级至已修复版本以消除风险。"
published = "2026-08-05T16:17:03Z"
remediation = "标签中输出最终答案。<value>立即将 Electron 升级至 39.8.8、40.9.0、41.2.1 或 42.0.0-beta.3 及更高版本（取决于当前使用的分支）。若使用 npm，请运行 npm update electron；若使用 yarn，请运行 yarn upgrade electron；若为 macOS 应用分发，请重新打包并签名。该漏洞无应用侧缓解措施，升级为唯一修复手段。"
score = 6.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Electron macOS 父进程代码签名校验绕过漏洞"
updated = "2026-08-06T05:17:07Z"

