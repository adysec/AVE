[basic]
description = "Gitea 自托管 Git 服务中存在两处服务端请求伪造（SSRF）漏洞。第一处：hostmatcher 模块的 external 内置规则使用 IsGlobalUnicast() && !IsPrivate() 判断外部地址，遗漏了 CGNAT（100.64.0.0/10）及多个 IPv6 过渡前缀（NAT64/6to4/Teredo 等），导致任意登录用户可通过创建 Webhook 或仓库迁移功能向内部 CGNAT 地址发起 HTTP 请求，完整响应（含状态码、头部、正文，最大 1MB）被记录并展示给 Webhook 所有者。第二处：OpenID 登录端点 /user/login/openid 在服务端使用 http.DefaultClient 获取用户提供的 Provider URL，未经过任何 IP 过滤或 CSRF 保护，当 OpenID 登录启用时，任何互联网用户可驱动 Gitea 向任意内部 IP 发起 GET 请求。两处漏洞均影响 Gitea 1.26.2 及以下版本。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级 Gitea 至 v1.26.3 或更高版本（官方已修复 hostmatcher 模块中 CGNAT 及 IPv6 过渡地址的 SSRF 防护缺失）。如无法升级，在 app.ini 的 [openid] 下设置 ENABLE_OPENID_SIGNIN=false 禁用 OpenID 登录，并在反向代理或防火墙层面添加规则阻止 Gitea 出站访问 100.64.0.0/10 等非公网地址段。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Gitea Gitea 服务端请求伪造漏洞"
updated = "2026-01-01T00:00:00Z"

