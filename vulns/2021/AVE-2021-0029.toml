[basic]
description = "三星移动设备 DSP（数字信号处理器）驱动存在隐藏功能漏洞，在 SMR Mar-2021 Release 1 之前的版本中，攻击者可通过物理接触目标设备并利用高权限条件，向 DSP 内部加载任意 ELF 格式的动态链接库文件。该漏洞影响搭载 Exynos 980、Exynos 2100 及 Exynos 9830 芯片的三星 Android 10（Q）和 Android 11（R）移动设备。DSP 是负责音频编解码、图像处理和信号运算的专用处理器，攻击者利用此漏洞可在 DSP 上下文中执行恶意代码，从而获取设备敏感信息、篡改系统数据或造成服务不可用。CVSS 评分为 6.1（中危），三星已在 2021 年 3 月 Security Maintenance Release 1 中发布安全补丁修复此问题，CISA 亦于 2023 年 6 月将其列入已知被利用漏洞目录。"
published = "2021-03-26T19:15:12Z"
remediation = "将设备安全软件版本升级至 SMR Mar-2021 Release 1 或更高版本。受影响设备包括搭载 Exynos 980、Exynos 2100 或 Exynos 9830 处理器的 Android 10.0/11.0 设备，可通过「设置」→「软件更新」下载并安装最新安全维护版本。若无法立即升级，建议暂时禁用 DSP 相关多媒体功能作为临时缓解措施，并避免安装来源不明的应用程序。"
score = 6.1
severity = "MEDIUM"
sources = ["kev"]
title = "三星 SMR DSP 驱动任意 ELF 库加载漏洞"
updated = "2026-06-17T03:41:57Z"

