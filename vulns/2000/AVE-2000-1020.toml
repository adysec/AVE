[basic]
description = "Samba Web Administration Tool（SWAT）是 Samba 2.0.7 自带的 Web 管理界面，存在用户枚举漏洞。当远程攻击者向 SWAT 登录接口提交用户名时，系统对有效用户名和无效用户名返回不同的错误提示信息，攻击者可利用此差异逐一遍历用户名，从而快速识别服务器上的有效系统用户。该漏洞无需身份认证即可远程利用，攻击条件简单，为后续暴力破解或定向攻击提供了用户信息基础。虽然该漏洞本身仅造成信息泄露，但会显著降低其他攻击的难度。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 Samba 至 2.2.0 或更高版本以修复 SWAT 用户名枚举问题；若无法升级，在 smb.conf 中将 SWAT 绑定到 127.0.0.1（设置 hosts allow = 127.0.0.1），限制远程访问入口；如业务不需要 Web 管理界面，可直接禁用 SWAT 组件（移除 swat 包或注释掉 inetd 中 swat 服务行）。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Samba Samba Web Administration Tool 用户枚举漏洞"
updated = "2026-06-16T21:52:48.630"

