[basic]
description = "NetWin DNews 5.3 服务器所包含的 DNEWSWEB CGI 程序存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标服务器发送包含超长参数（例如 group、cmd、utag 等）的特制 HTTP 请求来利用该漏洞，触发缓冲区溢出后可在服务器上执行任意命令，进而完全控制受影响的系统。该漏洞影响所有运行 NetWin DNews 5.3 版本的服务器。"
published = "2000-05-05T04:00:00Z"
remediation = "将 NetWin DNewsWeb CGI 程序升级至 5.4c3 或更高版本，补丁可从 Netwin FTP 服务器 ftp://ftp.netwinsite.com/pub/dnewsweb/beta/ 获取。若无法立即升级，应暂时从 Web 服务器中移除或禁用 dnewsweb/dnewsweb.exe CGI 脚本，以阻止远程攻击者利用 group、utag 等参数触发缓冲区溢出执行任意代码。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "NetWin DNews 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:51:42Z"

