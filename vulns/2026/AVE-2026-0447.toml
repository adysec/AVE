[basic]
description = "Rattler 是一款 conda 包管理工具，其 rattler_cache 和 py-rattler 组件在处理 conda 频道元数据时存在路径遍历漏洞。攻击者可通过恶意或不可信的 conda 频道发布包含路径分隔符或遍历组件的 build 字符串，在缓存物化过程中，该字符串被拼接为文件系统路径的一部分，导致包内容被写入配置的包缓存目录之外。该漏洞影响使用 rattler 处理不可信 conda 频道的用户，可能导致任意文件写入。建议用户升级至修复版本并避免使用不可信 conda 频道。"
published = "2026-01-01T00:00:00Z"
remediation = "将 rattler_cache 升级至 0.9.0 及以上版本，将 py-rattler 升级至 0.24.0 及以上版本。同时仅使用经过审核的官方 conda 频道（如 conda-forge、defaults），避免添加不可信或来源不明的第三方频道，并在 conda 配置中限制频道白名单。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Rattler conda 包缓存路径遍历漏洞"
updated = "2026-01-01T00:00:00Z"

