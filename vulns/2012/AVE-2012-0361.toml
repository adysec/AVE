[basic]
description = "WebKit 是 Apple iTunes 浏览器渲染引擎的核心组件，iTunes 10.7 之前版本所使用的 WebKit 存在内存破坏漏洞。未经身份认证的远程攻击者可构造恶意网站，当用户通过 iTunes 的内置浏览器访问该网站时，即可触发内存损坏，导致应用程序崩溃（拒绝服务）或在特定条件下执行任意代码。该漏洞影响运行在 Windows 和 Mac 平台上的 iTunes 10.7 之前版本，攻击条件为受害者通过 iTunes 打开攻击者控制的恶意网页链接，攻击复杂度中等，无需用户交互即可利用。Apple 已在 iTunes 10.7 安全更新中修复此漏洞，建议用户及时升级至最新版本以消除风险。"
published = "2012-09-13T10:30:20.697"
remediation = "建议将 Apple iTunes 升级至 10.7 或更高版本以修复 WebKit 引擎中的内存破坏漏洞。如无法立即升级，可暂时改用其他浏览器访问不可信网站，并避免打开来历不明的链接。Windows 用户也可通过 Apple Software Update 自动获取安全更新。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes 远程代码执行漏洞"
updated = "2026-06-16T23:43:43.930"

