[basic]
description = "GNOME Eye Of Gnome（EOG）图像查看器存在格式字符串漏洞，由于程序在处理命令行参数中的文件名时未对格式字符串说明符进行安全过滤，本地攻击者可通过向 eog 命令传递特制的包含 %n、%s 等格式说明符的文件名参数触发该漏洞，导致以当前用户权限执行任意代码。该漏洞影响 Eye Of Gnome 1.0.x、1.1.x 及 2.2 版本，攻击者需具有本地访问权限才能利用。"
published = "2003-04-02T05:00:00Z"
remediation = "升级 Eye of GNOME (EOG) 至修复版本：Red Hat Linux 用户安装 RHSA-2003-128 提供的更新包；Debian 用户应用 DSA-271 安全更新；Mandriva 用户安装 MDKSA-2003:048 更新。如无法升级，避免通过命令行参数直接传递不可信文件名给 eog 命令，改用文件选择器打开文件，并确保不以 root 权限运行 EOG 以限制利用影响。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "GNOME Eye Of Gnome 格式字符串漏洞"
updated = "2026-06-16T22:01:40Z"

