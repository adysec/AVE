[basic]
description = "re2 是 Google RE2 正则表达式引擎的 Node.js 绑定库。1.25.2 之前版本中，`lastIndex` 属性在校验时使用目标字符串的 UTF-8 字节长度，但在 `exec`、`test`、`match`、`replace` 和 `split` 方法中却将其作为 UTF-16 码元偏移量使用。当目标字符串包含非 ASCII 字符时，UTF-8 字节长度大于实际字符数，攻击者可通过设置一个介于两者之间的 `lastIndex` 值绕过校验，导致堆缓冲区越界读取，进而触发不可捕获的原生进程崩溃（SIGABRT/SIGSEGV），造成拒绝服务。在部分场景下，越界读取的堆内存数据可能被复制到返回值中，导致有限的信息泄露。攻击者需具备对 `lastIndex` 的控制能力，且正则表达式须使用 `global` 或 `sticky` 标志。该漏洞已在 re2 1.25.2 版本中修复。"
published = "2026-07-30T20:18:15.030"
remediation = "升级 re2 至 1.25.2 或更高版本（`npm install re2@^1.25.2`），该版本已将 lastIndex 校验改为基于 UTF-16 长度而非 UTF-8 字节长度，并增加了缓冲区边界检查。如无法升级，在调用 exec/test/match 前将 lastIndex 钳制为 `subject.length`（字符串长度），且勿将 lastIndex 设置为来自不可信输入的值。"
score = 5.7
severity = "MEDIUM"
sources = ["ghsa"]
title = "Google re2 越界堆读取拒绝服务漏洞"
updated = "2026-07-31T23:17:26.660"

