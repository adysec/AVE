[basic]
description = "Pillow 图像处理库的 ImageCmsTransform.apply() 接口存在堆越界写入漏洞。当调用者提供的输出图像色彩模式与变换声明的输出模式不匹配时（例如将 RGBA→RGBA 变换应用于 L 模式图像），底层 LittleCMS 会按每像素 4 字节写入，而 L 模式图像每行仅分配每像素 1 字节的缓冲区，导致受控的堆内存越界写入。攻击者可通过构造特制的变换参数和输出图像对象触发该漏洞，造成堆元数据损坏或任意地址写入，最终导致拒绝服务或潜在代码执行。该漏洞影响 Pillow 12.3.0 之前版本，CVSS 评分 7.5，危害等级高。"
published = "2026-07-14T16:17:02Z"
remediation = "立即升级 Pillow 至 12.3.0 或更高版本（对应 commit a9ffc42）。如无法立即升级，可在调用 ImageCmsTransform.apply() 前手动校验 im.mode 与 self.input_mode、imOut.mode 与 self.output_mode 是否一致，拒绝不匹配的输入输出图像模式。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Python Pillow ImageCmsTransform 输出模式不匹配导致堆越界写入漏洞"
updated = "2026-07-14T20:09:27Z"

