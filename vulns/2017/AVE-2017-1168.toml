[basic]
description = 'Windows Shell 在处理 .LNK 快捷方式文件图标显示时存在远程代码执行漏洞。攻击者可将特制的恶意 .LNK 文件放置在 USB 驱动器或网络共享中，当用户通过 Windows 资源管理器或任何解析快捷方式图标的应用程序浏览该文件时，系统自动解析图标触发漏洞，导致攻击者在目标系统上以当前用户权限执行任意代码。该漏洞影响 Windows 7 SP1、Windows 8/8.1、Windows 10（含 1511/1607/1703 版本）、Windows Server 2008 SP2/R2 SP1、Windows Server 2012/R2 及 Windows RT 8.1 等多个版本，CVSS 评分 8.8，危害等级高。该漏洞在安全社区中被称为"震网三代"，已被实际用于定向攻击活动，用户仅需通过 USB 设备或网络共享浏览恶意目录即可触发，无需额外交互。'
published = "2017-06-15T01:29:02Z"
remediation = '立即安装 Microsoft 2017 年 6 月安全更新（MS17-010 同期月度更新），该更新已修复 Windows Shell 对 .LNK 文件图标解析时的远程代码执行漏洞。受影响系统包括 Windows 7 SP1、Windows 8.1、Windows 10（1511/1607/1703）、Windows Server 2008 SP2/R2 SP1、Windows Server 2012/R2 及 Windows RT 8.1，请通过 Windows Update 或 Microsoft Update Catalog 获取对应版本补丁。如无法立即打补丁，建议禁用 USB 自动播放功能，并在组策略中设置"关闭自动播放"为"已启用"，同时限制用户对不受信任的 USB 设备和网络共享的访问权限作为临时缓解措施。'
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows LNK 远程代码执行漏洞"
updated = "2026-06-17T01:26:24Z"

