[basic]
description = "CGIscript.net csMailto.cgi 程序存在任意文件读取漏洞，由于对用户输入缺乏有效过滤，远程攻击者可在 form-attachment 字段中指定目标文件名，从而读取服务器上的任意文件内容。该漏洞影响部署了该 CGI 脚本的 Web 服务器，攻击者无需身份认证即可在低复杂度下完成利用，主要导致敏感信息泄露。攻击条件为目标服务器可通过网络访问且运行存在漏洞的 csMailto.cgi 版本，攻击者仅需发送包含恶意文件路径的请求即可获取服务器文件系统中的任意文件。"
published = "2002-08-12T04:00:00Z"
remediation = "由于 CGIscript.net 厂商已停止运营且未发布补丁，建议立即从 Web 服务器中删除 csMailto.cgi 脚本及其关联文件，或通过 Web 服务器配置（如 Apache 的 mod_rewrite 规则或 Nginx 的 location 拒绝规则）禁止对该脚本的访问。若业务必须保留类似功能，应迁移至目前仍在维护的邮件发送 CGI 替代方案（如 FormMail 或 NMS FormMail），并确保对用户输入进行严格的白名单过滤，禁止在 form-attachment 字段中使用路径遍历字符（如 ../ 或绝对路径）。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "CGIscript.net csMailto.cgi 任意文件读取漏洞"
updated = "2026-06-16T21:58:03Z"

