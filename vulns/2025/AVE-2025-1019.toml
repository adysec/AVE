[basic]
description = "Linux内核的io_uring子系统在处理异步I/O请求时，使用sqe->opcode字段作为不同操作表的索引。由于该字段未经过正确的推测执行防护处理，本地低权限攻击者可能利用CPU的推测执行机制（如Spectre类漏洞）来推断内核内存内容或绕过边界检查，从而导致敏感信息泄露或权限提升。该漏洞影响Linux内核5.6版本至修复版本前的多个稳定分支（包括5.10.x、5.15.x、6.1.x、6.6.x、6.12.x、6.13.x），攻击者需要具备本地访问权限和低级别用户权限，无需用户交互即可触发。成功利用该漏洞可能导致内核内存信息泄露、完整性破坏或可用性影响。"
published = "2025-03-12T10:15:19Z"
remediation = "建议立即升级 Linux 内核至修复版本：5.10.259、5.15.209、6.1.175、6.6.80、6.12.17、6.13.5 或 6.14 及以上版本。RHEL 9 系统应安装 RHSA-2025:20518 公告中的内核更新包，SUSE Linux Enterprise 15 SP6/SP7 系统应安装 SUSE-SU-2025:01964-1 或 SUSE-SU-2025:01614-1 公告中的内核更新包。升级后必须重启系统才能生效。若短期内无法升级，可通过 sysctl 设置 kernel.io_uring.disabled=1 临时禁用 io_uring，或使用 seccomp 过滤限制进程对该子系统的访问，以降低本地提权风险。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 io_uring 权限提升漏洞"
updated = "2026-06-19T13:16:20Z"

