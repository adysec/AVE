[basic]
description = "Pillow 是 Python 流行的图像处理库，其 ImageCms 模块存在可控堆越界写入漏洞。`ImageCms.ImageCmsTransform.apply()` 接口在调用者传入的输出图像模式与转换器声明的输出模式不一致时，仅检查图像尺寸随后就直接调用 LittleCMS 进行颜色空间转换。以 RGBA 转 RGBA 的转换器应用于 L 模式（单字节灰度）输出图像为例，LittleCMS 会按每个像素 4 字节写入行数据，但目标行仅分配了每像素 1 字节的缓冲区，导致堆内存被越界覆盖。攻击者可利用 source image 像素值控制写入内容，进而实现任意代码执行或进程崩溃。该漏洞影响 Pillow 12.3.0 之前的所有版本，攻击者无需身份验证即可通过构造恶意图像数据触发漏洞。Pillow 12.3.0 已通过在调用原生转换前校验输入/输出图像模式修复此问题。"
published = "2026-07-14T16:17:02.370"
remediation = "立即将 Pillow 升级至 12.3.0 或更高版本，该版本已在 ImageCmsTransform.apply() 的 Python 层和 _imagingcms.c 的 C 扩展层增加输入/输出图像模式合法性校验，可阻止因模式不匹配引发的受控堆溢出。如暂时无法升级，建议在应用层对用户传入的 ImageCms 转换参数及输出图像对象实施严格白名单过滤，仅允许预期的图像模式通过，以降低被利用风险。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Pillow 图像处理库 ImageCmsTransform 堆越界写入漏洞"
updated = "2026-07-14T20:09:27.770"

