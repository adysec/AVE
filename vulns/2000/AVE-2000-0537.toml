[basic]
description = "BEA WebLogic 5.1.x 中的 PageCompileServlet 未正确限制访问权限，远程攻击者无需身份认证即可直接调用该 Servlet 编译并执行任意 Java JHTML 源代码文件，导致远程命令执行。攻击者只需向目标服务器发送特制 HTTP 请求即可触发漏洞，获取服务器完全控制权。该漏洞影响 WebLogic 5.1.x 系列版本，CVSS 评分 10.0，危害等级严重。"
published = "2000-10-20T04:00:00.000"
remediation = "立即升级 BEA WebLogic 至 5.1 SP1 或更高版本，该漏洞已在后续版本中修复。如无法升级，在 web.xml 中删除 PageCompileServlet 的 servlet-mapping 配置项，或通过反向代理/Web 服务器访问控制规则限制对 /servlet/pagecompile 路径的访问，仅允许受信任的管理员 IP 地址调用该 Servlet。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "BEA WebLogic PageCompileServlet 远程代码执行漏洞"
updated = "2026-06-16T21:52:15.920"

