[basic]
description = "Angular 的 HttpTransferCache 在服务端渲染（SSR）过程中存在缓存键歧义漏洞。当客户端请求使用重复参数键（如 `role=user` 与 `role=admin`）时，HttpTransferCache 在生成缓存键时会将这些重复值错误地用逗号连接，导致不同语义的请求产生相同的缓存键。攻击者可构造包含特定重复参数的恶意请求，使其响应被缓存后，被误用于后续具有相同 URL 但不同参数的安全敏感请求（如授权请求）。由此导致状态污染与跨请求响应复用，服务端渲染输出可能基于错误的缓存响应，而非实际向后端发起的请求。该漏洞影响 Angular 的服务端渲染应用，CVSS 评分 7.5（高危）。受影响版本为 Angular 20、21、22 的特定版本，已在 22.0.2、21.2.19、20.3.27 版本中修复。临时缓解措施包括对敏感端点禁用 HTTP 传输缓存，或在应用引导时全局禁用 HttpTransferCache。"
published = "2026-01-01T00:00:00Z"
remediation = "升级 Angular 到修复版本 22.0.2、21.2.19 或 20.3.27。如无法立即升级，可对敏感端点的 HttpClient 请求添加 `transferCache: false` 选项跳过传输缓存，或在应用引导配置中通过 `provideClientHydration(withNoHttpTransferCache())` 全局禁用 HTTP 传输缓存。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Angular HttpTransferCache 缓存键歧义漏洞"
updated = "2026-01-01T00:00:00Z"

