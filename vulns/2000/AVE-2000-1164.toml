[basic]
description = "FTGate 邮件服务器的 POP3 服务存在用户枚举漏洞。当远程攻击者向 POP3 端口发送带有无效用户名的 USER 请求时，服务器会返回 -ERR 错误响应码，而发送有效用户名时则返回不同响应，攻击者可利用响应差异来判断哪些用户名在系统中是有效的。该漏洞影响使用 FTGate 作为邮件服务器的组织，攻击者无需身份认证即可在网络可达的条件下远程枚举有效账户，进而对已识别的账号实施暴力密码猜测攻击，最终可能导致邮件账户被非法入侵、敏感邮件数据泄露。由于该漏洞可通过网络远程利用且无需任何凭证，在 2000 年左右的互联网环境下，配备自动化脚本的攻击者可大规模枚举并破解大量邮件账户，对组织内部通信安全和用户隐私构成直接威胁。"
published = "2000-12-31T05:00:00Z"
remediation = "建议升级 FTGate 邮件服务器至最新版本（若厂商仍提供更新），或迁移至现代邮件服务器软件。若无法升级，可在防火墙层面限制 POP3 端口(110/995)仅允许受信 IP 访问，同时启用账户锁定策略（如 5 次失败锁定 30 分钟）并强制使用强密码，部署.fail2ban 等工具监控并自动封禁暴力破解 IP。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "FTGate POP3 服务器用户名枚举漏洞"
updated = "2026-06-16T21:53:26Z"

