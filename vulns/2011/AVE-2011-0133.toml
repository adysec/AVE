[basic]
description = "Opera 浏览器 11.50 及之前版本在处理 SVG 动画时存在未指定漏洞，远程攻击者无需身份认证即可通过构造恶意的 SVG 动画内容诱导用户访问，触发浏览器应用程序崩溃导致拒绝服务。该漏洞影响 Opera 11.50 之前的所有版本，攻击复杂度低，无需用户交互即可远程触发，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），主要影响可用性导致浏览器崩溃。Opera 已在 11.50 版本中修复此漏洞，用户升级至 11.50 或更高版本可防范攻击。"
published = "2011-07-01T10:55:02Z"
remediation = "建议立即升级 Opera 浏览器至 11.50 或更高版本（官网下载地址：https://www.opera.com/download），彻底修复 SVG 动画导致的拒绝服务漏洞。若暂时无法升级，可在设置中禁用 SVG 动画播放或禁止访问不可信的 SVG 内容作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera Opera 浏览器 SVG 动画拒绝服务漏洞"
updated = "2026-06-16T23:31:40Z"

