[basic]
description = "SNMPv1 协议在处理 GetRequest、GetNextRequest 和 SetRequest 消息时存在多个安全漏洞，影响 Cisco IOS 11/12 及大量其他厂商的 SNMP 实现。远程攻击者无需身份认证即可发送特制的 SNMP 数据包，利用 PROTOS c06-SNMPv1 测试套件所揭示的协议解析缺陷，可导致目标系统拒绝服务或获取最高权限。该漏洞 CVSS 评分 10.0，危害等级严重，影响范围极广。"
published = "2002-02-13T05:00:00.000"
remediation = "立即在所有受影响设备上禁用 SNMPv1 或升级至 SNMPv3；如必须使用 SNMPv1，在防火墙层面限制 UDP 端口 161/162 仅允许受信管理 IP 访问，并将默认 public/private 团体字串替换为强随机字符串。各厂商补丁：Windows 系统安装 MS02-006 安全更新；Red Hat 系统应用 RHSA-2001-163 更新；Solaris 安装补丁 57404；SGI 应用 20020201-01-A 公告补丁。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "Cisco IOS SNMPv1 请求处理拒绝服务与权限提升漏洞"
updated = "2026-06-16T21:56:35.677"

