[basic]
description = "Pi3Web 1.0.1 web server 的 tstisapi.dll 组件存在路径信息泄露漏洞。远程攻击者无需身份认证，只需向目标服务器发送请求不存在文件的特殊 URL，即可触发该漏洞获取服务器的物理路径。该漏洞影响所有运行 Pi3Web 1.0.1 版本的 web 服务器，攻击者只需能够访问服务器的 HTTP 服务端口即可实施攻击。攻击者利用泄露的物理路径信息可进一步探测服务器文件系统结构，为后续的文件包含、路径遍历等攻击提供关键辅助信息，但无法直接获取文件内容或执行代码。"
published = "2001-05-03T04:00:00Z"
remediation = "建议立即将 Pi3Web 升级至 2.0.3 pl4 版本以修复 tstisapi.dll 路径泄露缺陷，或直接迁移至受支持的现代 Web 服务器（如 Apache、Nginx 或 IIS）。如短期内无法升级，可在防火墙或反向代理层拦截对 /tstisapi.dll 的访问请求，并在 Pi3Web 配置中禁用该模块，同时配置自定义 404 错误页面以隐藏服务器物理路径信息。鉴于 Pi3Web 已于 2013 年后停止维护，强烈建议替换为仍在积极维护的 Web 服务器软件，并定期应用安全补丁。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "John Roy Pi3Web 信息泄露漏洞"
updated = "2026-06-16T21:54:03Z"

