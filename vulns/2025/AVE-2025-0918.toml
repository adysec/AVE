[basic]
description = "Linux内核CIFS网络文件系统客户端存在双重释放漏洞。在关闭TCP会话时，若cifsd工作线程仍在尝试重新连接到多个DFS目标，则TCP_Server_Info结构体中的hostname字段指针可能被重复释放，导致内核slab分配器崩溃。未经身份认证的远程攻击者可利用此漏洞，通过向目标发送特制的SMB/DFS响应触发双重释放，造成系统内核崩溃或潜在的远程代码执行。该漏洞影响使用受影响Linux内核版本的系统，CVSS评分为9.8，危害等级严重。"
published = "2025-01-31T12:15:28Z"
remediation = "建议立即升级 Linux 内核至包含修复 commit fa2f9906a7b333ba757a7dbae0713d8a5396186e 的稳定版本。对于 Ubuntu 22.04 LTS，请升级至 linux-image-6.8.0-64-generic 版本 6.8.0-64.67~22.04.1（USN-7653-1）；对于 Ubuntu 24.04 LTS GKE，请升级至 6.8.0-1026.30；对于 SUSE Linux Enterprise 15 SP6，请安装 SUSE-SU-2025:0847-1 安全更新。如无法立即升级内核，可在防火墙层面禁用 SMB 客户端对外连接（关闭 cifs mount 及自动挂载）作为临时缓解措施，并重启系统使新内核生效。"
score = 9.8
severity = "CRITICAL"
sources = ["msrc"]
title = "Linux 内核 CIFS 客户端双重释放漏洞"
updated = "2026-07-30T06:18:22Z"

