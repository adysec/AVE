[basic]
description = "Solaris AnswerBook2 的 dwhttpd Web 服务器管理接口存在命令注入漏洞，由于未对用户输入中的 shell 元字符进行有效过滤，远程攻击者无需身份认证即可通过向管理接口发送特制 HTTP 请求，在服务器上以 dwhttpd 进程权限执行任意系统命令。该漏洞可导致攻击者完全控制目标系统，实现信息窃取、权限提升或后续横向移动。攻击条件简单，仅需目标系统开放 AnswerBook2 服务端口且可网络访问，CVSS 评分 10.0，危害等级严重。"
published = "2000-10-20T04:00:00Z"
remediation = "立即停止使用并移除 Solaris AnswerBook2 服务，该产品已停止维护多年，不再有安全补丁支持。如业务仍需使用，应彻底禁用 dwhttpd Web 服务管理接口，在防火墙上限制对 AnswerBook2 端口（通常为 8888/TCP）的访问，仅允许受信任的管理 IP 连接，并对管理接口实施强身份认证和访问控制列表。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Sun Solaris AnswerBook2 远程命令执行漏洞"
updated = "2026-06-16T21:52:17Z"

