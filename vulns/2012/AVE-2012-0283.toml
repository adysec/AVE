[basic]
description = "Apple iTunes 使用的 WebKit 组件存在内存损坏漏洞（CWE-119），远程攻击者可通过构造恶意网页内容触发该漏洞。受影响版本为 10.7 之前的 Apple iTunes，攻击者无需身份认证，仅需诱使受害者访问包含特制 Web 内容的网站即可利用。成功利用可导致远程代码执行或在目标系统上造成拒绝服务（应用程序崩溃），CVSS v2 评分 9.3，危害等级为高。Apple 已在后续版本中修复此漏洞。"
published = "2012-09-13T10:30:19Z"
remediation = "立即将 Apple iTunes 升级至 10.7 或更高版本，该版本已修复 WebKit 内存破坏漏洞（参考 APPLE-SA-2012-09-12-1）。对于 Windows 用户，可通过 Apple Software Update 自动获取补丁；macOS 用户可通过 App Store 或访问 https://support.apple.com/zh-cn/HT5485 下载安装。如暂时无法升级，应避免在 iTunes 内打开未知网站或点击可疑链接，同时在防火墙或代理层面限制 iTunes 对非必要域名的出站连接，以降低被 crafted web site 攻击的风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple iTunes 远程代码执行漏洞"
updated = "2026-06-16T23:43:34Z"

