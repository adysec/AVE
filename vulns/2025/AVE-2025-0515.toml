[basic]
description = "Google Chrome Android版Omnibox（地址栏）存在安全UI不正确显示漏洞（CWE-285：授权机制不当）。远程攻击者可通过构造特制的HTML页面，在用户访问时利用该漏洞进行UI欺骗（UI Spoofing），使用户误认为当前页面为合法可信站点，进而诱导用户输入敏感信息或执行非预期操作。攻击需要用户交互（点击链接），无需身份认证，攻击复杂度低。该漏洞影响Android平台上Google Chrome 142.0.7444.59之前版本，CVSS评分5.4，危害等级中危。Google已在Chrome 142.0.7444.59版本中修复此漏洞。"
published = "2025-11-10T20:15:38Z"
remediation = "立即将 Google Chrome 更新至 142.0.7444.59 或更高版本。Android 用户打开 Google Play 商店，搜索 Chrome 并点击更新；若 Play 商店尚未推送更新，可前往 chrome://flags 或 Chrome 官网下载最新 APK 手动安装。Fedora 42 用户可通过 `sudo dnf update chromium` 升级至修复版本。更新前建议清除浏览器缓存并重启设备以确保补丁生效。"
score = 5.4
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome Android Omnibox 安全UI欺骗漏洞"
updated = "2026-06-17T08:32:22Z"

