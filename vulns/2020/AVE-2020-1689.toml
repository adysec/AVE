[basic]
description = "SAP NetWeaver AS JAVA 的 LM Configuration Wizard 组件存在身份认证缺失漏洞，未对配置任务执行请求进行身份验证。未经身份认证的远程攻击者可通过向目标系统发送特制请求，直接执行配置任务并创建管理员账户，从而完全接管 SAP Java 系统，导致系统机密性、完整性和可用性遭到严重破坏。该漏洞影响 SAP NetWeaver AS JAVA 7.30、7.31、7.40 及 7.50 版本，攻击者可利用此漏洞在无需事先认证的情况下获得系统管理员权限，进而执行任意操作。CVSS v3.1 评分 10.0，危害等级严重。"
published = "2020-07-14T13:15:13Z"
remediation = "立即应用 SAP Note 2934135 发布的官方安全补丁，将 LM Configuration Wizard 升级到以下补丁级别或更高版本：7.30 SP020 Patch 0001、7.31 SP026 Patch 0001、7.40 SP021 Patch 0001、7.50 SP018 Patch 0001。补丁可从 SAP 支持门户下载并手动安装，安装后重启 SAP NetWeaver AS JAVA 服务使修复生效。如无法立即打补丁，可在网络层面限制对 /CTCWebService/ 端点的访问，或使用防火墙拦截外部对该端口的请求作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["kev"]
title = "SAP NetWeaver AS JAVA 身份认证绕过漏洞"
updated = "2026-06-17T03:23:00Z"

