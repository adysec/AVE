[basic]
description = "Linux kernel ath12k WiFi 驱动中的 selfgen 统计信息处理函数 `print_array_to_buf_index()` 传入的数组长度参数过大，导致越界内存访问（CWE-125）。本地低权限攻击者可利用此漏洞读取越界内存中的敏感信息或造成系统崩溃，影响机密性和可用性。该漏洞由 Coverity 扫描发现（CID 1600742/1600758），影响使用 ath12k 驱动的 Linux 内核系统。"
published = "2025-02-27T03:15:12Z"
remediation = "立即升级 Linux 内核至 6.13.3 或更高版本，或合入补丁 commit 8700c4bf8b7ed98037d2acf1eaf770ad6dd431d4（主线）及 eb8c0534713865d190856f10bfc97cf0b88475b1（稳定分支）。对于无法立即升级的系统，可通过禁用受影响硬件上的 ath12k 内核模块（modprobe -r ath12k）作为临时缓解措施。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux kernel ath12k WiFi驱动越界访问漏洞"
updated = "2026-06-17T08:14:28Z"

