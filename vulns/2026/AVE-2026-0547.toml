[basic]
description = "Apple Model I/O 组件在处理恶意构造的图像文件时存在内存损坏漏洞。由于对图像数据的内存管理不当，攻击者可通过诱导用户打开特制图像文件触发内存越界写入，导致进程内存损坏。成功利用此漏洞可实现任意代码执行，获取目标设备的敏感信息或完全控制权。该漏洞影响 iOS、iPadOS、macOS、tvOS 及 visionOS 等多个 Apple 平台，CVSS 评分 8.8，危害等级高。攻击需用户交互，但无需身份认证，攻击复杂度低。"
published = "2026-05-11T21:18:55Z"
remediation = "立即将受影响的 Apple 设备更新至以下修复版本：iOS 18.7.9 / iPadOS 18.7.9、iOS 26.5 / iPadOS 26.5、macOS Sequoia 15.7.7、macOS Tahoe 26.5、tvOS 26.5、visionOS 26.5。可通过「设置」→「通用」→「软件更新」执行升级。在无法立即更新的设备上，避免打开来源不明的图片文件。"
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "Apple Model I/O 图像处理内存损坏漏洞"
updated = "2026-06-17T10:29:22Z"

