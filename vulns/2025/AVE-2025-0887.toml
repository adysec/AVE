[basic]
description = "Oracle MySQL Server 的 Server: Options 组件中存在权限分配不当漏洞（CWE-732）。受影响版本包括 MySQL 8.0.0-8.0.41、8.4.0-8.4.4 及 9.0.0-9.2.0。具有高权限的网络攻击者可通过多种网络协议向 MySQL Server 发送特制请求，利用该漏洞触发服务异常，导致数据库服务挂起或频繁重复崩溃，造成完全拒绝服务（DoS）。CVSS 3.1 评分 4.9，仅影响系统可用性，攻击无需用户交互且攻击复杂度低。"
published = "2025-04-15T21:15:53Z"
remediation = "建议立即升级 MySQL Server 到修复版本：8.0.42 或更高版本、8.4.5 或更高版本、9.2.1 或更高版本。可通过官方下载页面获取最新安装包并按文档升级。如暂时无法升级，可配置防火墙限制 MySQL 端口(默认3306)仅允许可信 IP 访问，并禁用不必要的网络协议(如命名管道、共享内存)以降低攻击面。同时建议监控数据库异常崩溃日志，及时发现潜在利用尝试。"
score = 4.9
severity = "MEDIUM"
sources = ["msrc"]
title = "Oracle MySQL Server 关键资源权限分配不当拒绝服务漏洞"
updated = "2026-06-17T08:43:46Z"

