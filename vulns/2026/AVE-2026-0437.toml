[basic]
description = "brace-expansion 是 Node.js 生态中广泛使用的花括号展开库，其 expand() 函数通过 max 参数（默认 100,000）限制了结果数量，但未对每个结果字符串的长度进行限制。攻击者可通过构造大量嵌套花括号组（如 '{a,b}'.repeat(1500)），使结果数量保持在 max 阈值以下的同时，每个结果字符串长度随组数线性增长，导致总内存消耗呈乘积式膨胀，最终触发 V8 引擎的致命内存溢出错误，进程崩溃且无法被 try/catch 捕获。仅需约 7.5 KB 的输入即可导致默认配置的 Node.js 进程因内存耗尽而拒绝服务。任何直接或通过 minimatch/glob 间接将用户可控输入传递给 brace-expansion.expand() 的应用程序均受影响。该漏洞 CVSS 评分 7.5，危害等级高，已在 5.0.8 版本中通过新增 maxLength 选项（默认 4,000,000）限制累积输出长度和中间数组大小予以修复。"
published = "2026-07-23T14:17:00.250"
remediation = "升级 brace-expansion 至 5.0.8 或更高版本，该版本新增 maxLength 选项（默认 4,000,000）限制单次 expand() 调用累积的字符总数，防止内存耗尽。如无法立即升级，避免将不可信用户输入传递给 expand() 或 glob 花括号模式，或显式设置较小的 max 和 maxLength 参数作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "brace-expansion 内存耗尽拒绝服务漏洞"
updated = "2026-07-23T15:48:25.133"

