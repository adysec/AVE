[basic]
description = "NetcPlus BrowseGate 2.80 存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向 HTTP 请求中发送超长的 Authorization 或 Referer MIME 头部字段，触发服务端缓冲区溢出，导致 BrowseGate 服务崩溃拒绝服务，在特定条件下可能执行任意命令。该漏洞影响 BrowseGate 2.80 版本，攻击复杂度低，CVSS 评分 5.0，危害等级中危。目前已有公开的 PoC 利用代码。"
published = "2000-12-19T05:00:00Z"
remediation = "建议升级至 BrowseGate 2.81 或更高版本，该版本已修复对 HTTP 请求头长度未做验证的问题。如无法立即升级，应在防火墙或反向代理中限制 Authorization 与 Referer 头的最大长度不超过 8KB，并过滤包含超长 MIME 头的异常请求。若软件已停止维护，建议迁移至其他经安全审计的代理服务器产品。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "NetcPlus BrowseGate 2.80 拒绝服务漏洞"
updated = "2026-06-16T21:52:44Z"

