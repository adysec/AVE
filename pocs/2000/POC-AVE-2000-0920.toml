[info]
author = "ave"
description = "通过HTTP GET请求检测IIS 4.0/5.0服务器是否存在文件权限规范化绕过漏洞(MS00-057)。当父目录权限较宽松时，IIS未能正确规范化文件路径并检查NTFS权限层级，可能错误地允许访问本应受限制的文件。发送请求到目标IIS服务器上的已知文件路径，检查是否返回文件内容。"
id = "POC-AVE-2000-0920"
name = "Microsoft IIS File Permission Canonicalization Bypass PoC"
severity = "medium"
tags = ["ave-2000-0920"]
vuln_id = [
    "CVE-2000-0770",
    "AVE-2000-0920",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/iisstart.asp"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
