[basic]
description = 'KDE 3.1.3及更早版本中的Konqueror浏览器（kdelibs组件）存在安全绕过漏洞。远程攻击者可通过在URL中使用"%2e%2e"（编码后的点号）目录遍历序列，绕过Web应用程序对Cookie的访问限制。该漏洞导致Konqueror将Cookie发送至指定URL子集之外的地址，例如发送给与目标应用运行在同一服务器上的其他易受攻击应用程序。攻击者无需身份验证即可远程利用此漏洞，可能窃取敏感Cookie信息或进行会话劫持，影响范围涵盖使用该版本Konqueror的所有用户。'
published = "2004-04-15T04:00:00Z"
remediation = "建议立即升级 KDE 至 3.1.4 或更高版本（kdelibs 包已修复 kcookiejar 对编码点点的路径遍历处理）。如无法立即升级，可临时在 Konqueror 中禁用 JavaScript 和 Cookie 支持，或避免访问不受信任的网站，以降低攻击者利用该漏洞窃取 Cookie 的风险。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "KDE Konqueror Cookie 访问限制绕过漏洞"
updated = "2026-06-16T22:02:29Z"

