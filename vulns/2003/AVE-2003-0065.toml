[basic]
description = "Linux 2.4 内核的路由缓存实现及 Netfilter IP 连接跟踪模块存在哈希表碰撞漏洞，远程未经身份认证的攻击者可通过发送大量伪造源地址的恶意数据包，导致路由缓存哈希表发生严重碰撞，消耗目标系统大量 CPU 资源，造成拒绝服务。该漏洞影响 Linux 2.4 内核系列版本，攻击者无需任何认证即可远程触发，危害等级重要。"
published = "2003-05-27T04:00:00.000"
remediation = "升级 Linux 内核至 2.4.21 及以上版本，该版本已修复路由缓存哈希碰撞问题。如无法升级内核，可在边界防火墙上配置源地址验证（如 uRPF 反向路径过滤），丢弃源地址不合法的数据包；同时可调整 net.ipv4.conf.all.rp_filter=1 启用反向路径过滤作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux 内核 Netfilter 远程拒绝服务漏洞"
updated = "2026-06-16T22:01:49.233"

