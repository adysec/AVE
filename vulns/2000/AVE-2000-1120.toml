[basic]
description = "tags.<value>StarOffice 5.2 办公套件在处理临时文件时，会跟随 /tmp/soffice.tmp 目录的符号链接，并将该目录权限设置为全局可读（world-readable）。未经身份认证的本地攻击者可通过创建符号链接，将 soffice.tmp 指向目标用户的敏感文件，当 StarOffice 进程尝试访问临时目录时，即可读取其他用户的数据文件，导致敏感信息泄露。该漏洞影响 StarOffice 5.2 版本，攻击者需要具备本地系统访问权限，利用条件较低，可造成信息泄露。"
published = "2001-01-09T05:00:00Z"
remediation = "建议立即升级至 StarOffice 6.0 或更高版本，或迁移至 OpenOffice/LibreOffice 等不受影响的办公套件。临时缓解措施包括：将环境变量 TMPDIR 设置为用户私有目录（如 $HOME/tmp）以替代默认 /tmp，确保该目录权限为 700；或通过 umask 设置默认文件权限为 077，防止临时文件被其他用户读取；同时在 /tmp 目录下定期清理并检查 soffice.tmp 符号链接，避免攻击者利用。"
score = 3.6
severity = "LOW"
sources = ["cve"]
title = "StarOffice 临时目录符号链接本地文件读取漏洞"
updated = "2026-06-16T21:53:16Z"

