[basic]
description = "Bugzilla 2.14 之前版本存在安全绕过漏洞，普通用户可通过将自身提交的 Bug 标记为受限 Bug 的重复（duplicate）来绕过群组安全限制。当标记为重复时，系统会自动将当前用户添加到受限 Bug 的 CC 列表中，从而获得查看该受限 Bug 详情的权限。攻击者无需身份认证即可利用此漏洞获取本应受限的敏感信息，影响 Bugzilla 的访问控制机制。该漏洞 CVSS 评分 7.5，危害等级高，建议升级至 Bugzilla 2.14 或更高版本修复。"
published = "2001-09-10T04:00:00Z"
remediation = '升级 Bugzilla 至 2.14 或更高版本，该版本修复了通过标记重复 bug 绕过群组权限检查的安全漏洞。如无法立即升级，可临时禁用非管理员用户的"标记为重复"权限，或限制用户对 CC 列表的自动添加功能以降低风险。'
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Mozilla Bugzilla 安全绕过漏洞"
updated = "2026-06-16T21:56:12Z"

