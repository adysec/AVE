[basic]
description = "Blackboard CourseInfo 4.0 存在敏感信息明文存储漏洞，系统将本地管理员和 SQL 数据库管理员的用户名及密码以明文形式保存在注册表项中，且该注册表项的访问控制权限设置不当，允许普通用户读取其中的敏感凭据信息。本地攻击者可通过登录系统后直接访问该注册表项获取管理员密码，进而提升权限或访问后端数据库，对系统安全构成严重威胁。"
published = "2000-07-10T04:00:00Z"
remediation = '立即限制注册表项 HKEY_LOCAL_MACHINE\SOFTWARE\Blackboard\CourseInfo 的访问权限，仅允许 SYSTEM 和管理员读取；升级到 Blackboard 后续版本（5.0 及以上），该版本已改用加密方式存储凭据；如无法升级，使用 regedit 将相关注册表项的权限设置为仅 Administrators 可读。'
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "Blackboard CourseInfo 4.0 明文管理员密码漏洞"
updated = "2026-06-16T21:52:05Z"

