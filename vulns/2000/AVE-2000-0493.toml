[basic]
description = "Guild FTPd 0.9.7 存在目录遍历漏洞，远程攻击者可通过向 FTP 服务发送包含 `..`（点点）序列的特制路径请求，绕过根目录限制访问 FTP 根目录之外的文件。由于服务器对存在与不存在的文件返回不同的错误信息，攻击者可利用此差异逐一遍历确认目标系统上的任意文件是否存在。该漏洞无需身份认证即可远程利用，攻击复杂度低，可导致敏感信息泄露（如配置文件、密码文件等），为后续攻击提供情报支撑。目前已有公开 PoC 代码，建议升级至不受影响版本。"
published = "2000-07-08T04:00:00.000"
remediation = "建议立即停止使用已停止维护的 Guild FTPD 0.9.7，迁移至仍受支持的 FTP 服务器软件（如 FileZilla Server 或 vsftpd）。如无法立即迁移，可在 FTP 服务器配置中禁用匿名访问、启用严格的 chroot 隔离机制，并在防火墙层面限制对 TCP 21 端口的访问来源 IP，仅允许可信网络段连接。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Guild FTPD 0.9.7 目录遍历文件存在泄露漏洞"
updated = "2026-06-16T21:52:10.107"

