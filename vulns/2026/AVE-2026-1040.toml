[basic]
description = 'tags.<value>未经身份认证的远程攻击者可强制目标系统回退到包含不安全配置的固件分区，该分区内保留有默认凭据。利用此漏洞，攻击者能够以未授权用户 "user-app" 的身份通过 SSH 远程登录系统，并可能中断设备的充电进程。该漏洞源于固件分区切换时的设计缺陷（CWE-636），攻击者无需任何凭据即可远程触发，影响运行受影响固件版本的 Phoenix Contact CHARX 充电控制器。'
published = "2026-07-30T07:16:57Z"
remediation = "建议将受影响的 Phoenix Contact CHARX SEC-3000、SEC-3050、SEC-3100、SEC-3150 充电控制器固件升级至 1.9.1 或更高版本，该补丁计划于 2026 年 8 月 12 日前在 Phoenix Contact 产品网页下载区发布。将设备部署在封闭工业网络内，并通过防火墙阻止外部对 SSH（22 端口）、Modbus TCP 及管理端口的访问，仅允许授权后端 IP 进行 OCPP 通信。若无法立即升级，应在网络边界禁用 SSH 访问并修改默认凭据作为临时缓解措施。"
score = 8.3
severity = "HIGH"
sources = ["zdi"]
title = "Phoenix Contact CHARX SEC-3000/3050/3100/3150 充电控制器固件分区回退默认凭据绕过漏洞"
updated = "2026-07-30T15:16:33Z"

