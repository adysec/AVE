[basic]
description = 'Check Point Firewall-1 的 session agent 组件（3.0 至 4.1 版本）在用户名验证与密码验证时返回不同的错误提示信息，存在信息泄露与暴力破解风险。该漏洞源于其对"用户名不存在"和"密码错误"两种失败场景给出了可区分的响应，导致远程攻击者无需任何认证即可借此探测系统上存在的有效用户名，进而针对确认存在的账号发起字典或暴力猜测攻击。攻击条件为攻击者可远程访问登录界面且目标用户未设置足够强度的密码。该漏洞影响 Firewall-1 3.0、4.0、4.1 等版本，攻击者可据此获得非法访问权限，CVSS 评分为 7.5，危害等级为高。结合 CWE-Other 分类，建议厂商限制错误提示信息的一致性并启用登录失败策略以防止未授权访问。'
published = "2000-12-11T05:00:00Z"
remediation = "升级 Check Point Firewall-1 至 4.1 以上版本，或迁移至 Check Point 当前支持的 Security Gateway 版本（R75 及以上）。Session Agent 协议本身存在设计缺陷，建议改用 SecurID、证书认证或 LDAP 集成等强认证方式替代 Session Authentication。如无法升级，在防火墙上限制对 TCP 端口 261 的访问来源，仅允许受信任管理 IP 连接，并启用登录失败锁定策略（如连续 3 次失败后临时封禁源 IP 30 分钟）。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Check Point Firewall-1 Session Agent 用户枚举与暴力破解漏洞"
updated = "2026-06-16T21:53:01Z"

