[basic]
description = "Novell NetWare 5.1 SP3 的 FTP 服务器组件 NWFTPD.nlm 5.01o 之前版本存在多个未指定的访问控制漏洞。远程攻击者可通过未知向量绕过匿名访问限制，获取未授权的文件系统访问权限，导致敏感信息泄露或文件被篡改。该漏洞影响 Novell NetWare 5.1 及 5.01i 版本，攻击者无需身份认证即可通过网络远程利用，CVSS 评分 7.5，危害等级高。"
published = "2010-04-05T15:30:00Z"
remediation = "将 NWFTPD.nlm 升级至 5.01o 或更高版本（如 5.10.02）。对于 Novell NetWare 5.1 SP3 系统，从 Novell 支持站点下载并安装最新的 NWFTPD 补丁。如无法立即升级，可在 FTP 服务器配置中禁用匿名访问功能，或在网络边界防火墙限制对 FTP 端口（21/TCP）的访问，仅允许可信 IP 连接。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Novell NetWare FTP 服务器匿名访问绕过漏洞"
updated = "2026-06-16T21:53:27Z"

