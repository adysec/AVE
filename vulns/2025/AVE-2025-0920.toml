[basic]
description = "Linux 内核 mlx5 网络驱动程序中，mlx5_lag_port_sel_create() 函数在创建端口选择结构失败时未清除残留数据，导致后续 mlx5_lag_destroy_definers() 重复销毁同一 lag definer 结构，触发内核空指针解引用崩溃。该漏洞影响使用 Mellanox mlx5 网卡并启用 LAG 链路聚合功能的 Linux 系统，本地低权限攻击者可通过触发端口选择结构创建失败的操作路径，造成内核空指针引用异常，导致系统崩溃或拒绝服务。CVSS 评分 5.5，危害等级中等。"
published = "2025-01-31T12:15:28Z"
remediation = "建议升级 Linux 内核至修复版本 6.1.127、6.6.74、6.12.11 或更高版本。主流发行版（如 Ubuntu 22.04 LTS、SUSE Linux Enterprise 15 SP6 等）已通过 USN-7653-1、SUSE-SU-2025:0847-1 等安全公告发布补丁，请使用发行版包管理器安装对应内核更新。如无法立即升级且系统未使用 Mellanox mlx5 网卡或链路聚合（bonding/LAG）功能，可在内核启动参数中添加 blacklist=mlx5_core 以临时禁用该驱动模块，避免触发漏洞代码路径。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 mlx5 网络驱动空指针解引用拒绝服务漏洞"
updated = "2026-06-17T08:43:59Z"

