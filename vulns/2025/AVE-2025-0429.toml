[basic]
description = "Google Chrome 的 WebRTC 组件中存在释放后使用（Use-After-Free）漏洞，CWE-416。远程攻击者可通过构造特制的 HTML 页面诱导用户访问，触发 WebRTC 对已释放内存对象的访问，导致堆破坏，进而可能实现远程代码执行。该漏洞影响 Google Chrome 140.0.7339.185 之前版本，CVSS 评分 8.8，危害等级高，攻击复杂度低，无需身份认证，但需要用户交互。Google 已在 Chrome 140.0.7339.185 版本中修复此漏洞。"
published = "2025-09-24T17:15:39Z"
remediation = "立即将 Google Chrome 升级至 140.0.7339.185 或更高版本（Chrome 菜单 > 帮助 > 关于 Google Chrome 自动检查更新）；基于 Chromium 的浏览器（如 Edge、Opera）同步更新至对应版本。Linux 发行版用户通过包管理器更新：Fedora 升级至 chromium-140.0.7339.207，Debian/Ubuntu 升级至包含该修复的 chromium 版本。如无法立即更新，可在浏览器设置中禁用 WebRTC（chrome://flags/#disable-webrtc）或通过企业策略阻止不可信来源的 WebRTC 连接作为临时缓解。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome WebRTC 释放后使用漏洞"
updated = "2026-06-17T08:28:26Z"

