[basic]
description = "Dasan GPON 家庭路由器存在操作系统命令注入漏洞，攻击者无需身份认证即可通过向 GponForm/diag_Form 接口发送特制的 diag_action=ping 请求，在 dest_host 参数中注入任意系统命令。路由器会将 ping 执行结果保存至 /tmp 目录，当攻击者再次访问 /diag.html 页面时即可获取命令执行输出。该漏洞影响多款 Dasan GPON 路由器，CVSS 评分 9.8，攻击复杂度低，可导致设备完全受控，进而被用于发起 DDoS 攻击或窃取网络流量。"
published = "2018-05-04T03:29:00.287"
remediation = "该产品已停止维护（End-of-Life），厂商不再提供安全更新，建议立即停止使用并更换为受支持的替代产品。如无法立即替换，须在防火墙层面限制对 GPON 路由器 80/443 端口的公网访问，仅允许受信任的内部 IP 管理设备，同时禁用 WAN 侧 ping 诊断功能（diag_Form）以阻断攻击路径。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Dasan GPON路由器远程命令执行漏洞"
updated = "2026-06-17T01:34:10.407"

