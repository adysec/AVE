[basic]
description = "tags.<value>Windows 2000 的事件查看器管理单元存在缓冲区溢出漏洞。当用户通过 Microsoft 管理控制台查看事件记录的详细视图时，系统对事件记录中某个字段的处理存在缺陷，远程攻击者可以构造恶意的格式化事件记录数据并发送至目标系统，诱使目标用户在事件查看器中打开该记录，从而触发缓冲区溢出并在系统上下文中执行任意代码。该漏洞影响 Windows 2000 操作系统，攻击者无需身份认证即可通过网络远程利用，CVSS 评分 10.0，危害等级为严重。"
published = "2001-05-03T04:00:00.000"
remediation = '立即安装 Microsoft 安全公告 MS01-013 发布的安全补丁 KB285156，或升级至 Windows 2000 Service Pack 3（SP3）即可彻底修复该漏洞。补丁下载地址为 Microsoft Download Center（FamilyId=2BA6B2F3-9BB7-4ECF-8B46-47DB89BA86CE），可在运行 Windows 2000 Service Pack 1 或 Service Pack 2 的系统上直接安装。安装后可通过检查注册表路径 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Updates\Windows 2000\SP3\Q285156 确认补丁已生效。如受环境限制无法立即打补丁，建议在防火墙层面限制对 Windows 2000 系统事件日志服务的远程写入访问，并避免以管理员身份打开来源不可信的事件记录详细信息页面，以降低被利用风险。'
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Microsoft Windows 2000 事件查看器远程代码执行漏洞"
updated = "2026-06-16T21:53:45.680"

