[basic]
description = "Alt-N MDaemon 邮件服务器 3.1.1 及更早版本的 WebConfig 组件中存在堆溢出漏洞，未经身份认证的远程攻击者可通过向目标系统发送包含超长 URL 的特制 HTTP 请求触发该漏洞，导致服务器进程崩溃、拒绝服务，并可能在特定条件下执行任意系统命令。该漏洞影响所有启用 WebConfig 远程管理界面的 MDaemon 实例，攻击者无需任何凭据即可在局域网或互联网范围内发起利用，攻击复杂度低、无需交互即可完成。ExploitDB 已公开相关利用代码，攻击者可据此批量扫描并攻击受影响的邮件服务器。"
published = "2000-12-11T05:00:00Z"
remediation = "建议立即升级 MDaemon 至 3.1.2 或更高版本以修复堆溢出漏洞。若暂时无法升级，可在 WebConfig 服务前部署 WAF 规则限制 URL 长度（如拦截超过 2048 字符的请求），或临时禁用 WebConfig 管理界面对外访问，仅允许受信任内网 IP 访问 1000 端口。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Alt-N MDaemon WebConfig 远程堆溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:59Z"

