[basic]
description = "Linux 入侵检测系统 (LIDS) 0.9.7 版本存在权限提升漏洞，当系统通过 security=0 启动参数禁用 LIDS 保护机制时，本地用户可利用该配置缺陷将权限提升至 root。该漏洞属于本地权限提升类型，攻击者需具备本地系统访问权限且无需身份认证，即可通过修改内核启动参数绕过 LIDS 安全防护，完全破坏系统的机密性、完整性和可用性。受影响版本为 LIDS 0.9.7，CVSS 评分 7.2（高危），攻击向量为本地、攻击复杂度低、无需认证、影响完全。"
published = "2000-10-20T04:00:00Z"
remediation = "立即升级到LIDS 1.0以上版本，并重新启用LIDS安全机制。升级时请确保彻底删除旧的security=0启动参数，重新构建并启动全新内核引导系统。如果无法立即升级，建议禁用Anonymous Unix socket权限并应用最新的安全补丁包（如漏洞公开时的LIDS安全修复版），同时确保系统中未存在任何配置将其强制禁用。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "LIDS Linux 入侵检测系统 权限提升漏洞"
updated = "2026-06-16T21:52:19Z"

