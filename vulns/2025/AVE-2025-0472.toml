[basic]
description = "GNU Binutils 2.45 版本的链接器组件中存在越界读取漏洞，位于 bfd/elfxx-x86.c 文件的 _bfd_x86_elf_late_size_sections 函数中。本地攻击者可通过构造特制的 ELF 文件触发该漏洞，导致链接器在处理过程中读取越界内存，可能造成敏感信息泄露或程序崩溃。该漏洞需本地低权限访问才能利用，CVSS 评分 1.9，危害等级低。补丁已提交至上游仓库，用户应更新至修复版本。"
published = "2025-10-08T20:15:34Z"
remediation = "应用补丁 b6ac5a8a5b82f0ae6a4642c8d7149b325f4cc60a，升级 GNU Binutils 至包含该修复的版本（高于 2.45）。SUSE 用户可参考 SUSE-SU-2025:4096-1 安全公告更新 binutils 包。如无法立即升级，避免在不可信 ELF 文件上使用链接器作为临时缓解措施。"
score = 1.9
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils 链接器越界读取漏洞"
updated = "2026-06-17T08:30:34Z"

