[basic]
description = "Windows Narrator Braille（讲述人盲文辅助功能）存在非受信搜索路径漏洞（CWE-426）。该功能在加载盲文显示驱动及相关动态链接库时，未对搜索路径进行严格验证，导致系统可能从非预期目录加载恶意 DLL。具有本地访问权限的已授权攻击者可将恶意 DLL 文件放置于搜索路径中，当 Narrator Braille 组件启动并加载相关模块时执行恶意代码，从而实现本地特权提升。成功利用后可导致机密性、完整性和可用性全面受损，CVSS 评分为 7.8（高危）。"
published = "2026-06-09T17:17:45Z"
remediation = "通过 Windows 设置安装最新的 BRLTTY 功能更新：依次进入 设置→辅助功能→讲述人→使用盲文显示器→下载 BRLTTY，安装完成后重启系统并确保已应用最新可用更新以修复该不受信任搜索路径漏洞。如无需使用盲文显示器功能，可通过关闭 Narrator Braille 作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Microsoft Windows Narrator Braille 特权提升漏洞"
updated = "2026-07-23T08:10:00Z"

