[basic]
description = "Windows NTLM 哈希泄露欺骗漏洞（CVE-2025-21377）存在于 Windows NTLM 身份认证协议中，攻击者可通过构造恶意的认证请求或中间人攻击方式，诱使用户与攻击者控制的服务器进行 NTLM 认证交互，从而窃取用户的 NTLM 哈希值。获取的 NTLM 哈希可被攻击者离线破解或用于 NTLM 中继攻击，进而冒充用户身份访问受保护资源。该漏洞攻击复杂度低，无需身份认证，但需要用户交互（如点击链接或访问恶意服务器），影响所有受支持的 Windows 版本。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:36Z"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新 KB5051974。可通过 Windows Update 自动获取更新，或从 Microsoft Update Catalog 手动下载安装。受影响版本包括 Windows 10/11 及 Windows Server 多个版本，更新后系统版本号需达到：Windows 10 1507 ≥ 10.0.10240.20915、Windows 10 1607 ≥ 10.0.14393.7785、Windows 10 1809 ≥ 10.0.17763.6893、Windows 11 24H2 ≥ 10.0.26100.3194 等。如无法立即打补丁，建议限制用户点击不可信链接，并启用受保护视图。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows NTLM 哈希泄露欺骗漏洞"
updated = "2026-06-17T08:43:14Z"

