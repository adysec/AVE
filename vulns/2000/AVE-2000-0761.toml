[basic]
description = "CVE-2000-1046是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2000-12-11T05:00:00Z"
remediation = "立即将 Lotus Domino 服务器升级至 5.0.4 或更高版本（5.0.4a、6.x、7.x 等），该版本已修复 ESMTP 服务在处理 RCPT TO、SAML FROM 及 SOML FROM 命令时的缓冲区溢出漏洞。如暂无法升级，应在边界防火墙或路由器上配置访问控制列表，仅允许可信来源 IP 访问 25 端口（SMTP），并启用 IDS/IPS 检测超长 SMTP 命令参数的攻击特征作为临时缓解措施。"
