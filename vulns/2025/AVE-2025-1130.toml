[basic]
description = 'Linux 内核 rtnetlink 子系统存在缓冲区分配错误漏洞。在分配 netlink 消息的 vfinfo 空间时，未将 VF（虚拟功能）GUID（全局唯一标识符）的大小纳入计算，当系统配置大量 SR-IOV VF 并查询包含端口和节点 GUID 的链路信息时，会导致分配的空间不足。攻击者需具有本地或容器内权限，通过发送 netlink 消息请求获取 VF GUID 信息即可触发 "Message too long" 错误，导致内核产生警告并拒绝正常响应，影响网络管理工具的可用性。该漏洞影响支持 VF GUIDs 功能的 Linux 内核版本。'
published = "2025-04-16T15:16:01Z"
remediation = "升级 Linux kernel 至修复版本：上游 5.10.236、5.15.180、6.1.134、6.6.87、6.12.23、6.13.11 或 6.14.2 及以上；Debian 12 (bookworm) 升级至 6.1.135-1，Debian 11 (bullseye) 升级至 5.10.237-1，Ubuntu 22.04 LTS 升级至 5.15.0-142.152，Ubuntu 24.04 LTS 升级至 6.8.0-86.87。如无法立即升级，可临时将 SR-IOV VF 数量限制至 32 个以下（写入 /sys/bus/pci/devices/0000:XX:XX.X/sriov_numvfs），或避免在启用 VF GUID 功能的网卡上执行 ip link show 等 netlink 查询命令，直至完成内核升级。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 rtnetlink 模块 VF GUID 缓冲区大小分配不当漏洞"
updated = "2026-06-17T08:44:59Z"

