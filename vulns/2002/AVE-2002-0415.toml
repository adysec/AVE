[basic]
description = "IBM AIX 4.3.3 及 4.3.x/5.1 版本中的 lsmcode 工具存在本地缓冲区溢出漏洞。攻击者可通过设置超长 LSMCODE 环境变量触发缓冲区溢出，覆盖内存中的关键数据，从而以 root 权限执行任意代码。该漏洞需要攻击者拥有本地系统访问权限，CVSS 评分 10.0，危害等级严重。IBM 已发布安全补丁修复此漏洞。"
published = "2002-08-12T04:00:00Z"
remediation = "建议立即安装 IBM APAR IY27708 补丁，或升级至 AIX 5.2 及以上版本。如无法打补丁，可执行 `chmod 500 /usr/sbin/lsmcode` 移除 setuid 位，或通过 `rm /usr/sbin/lsmcode` 删除该非必要工具作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "IBM AIX lsmcode 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:58:03Z"

