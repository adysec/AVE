[basic]
description = "UltraEdit 8.2 的 FTP 客户端在将 FTP 密码保存至配置文件 uedit32.ini 时，采用了强度极低的自定义加密算法对密码进行保护，而非使用操作系统提供的安全凭据存储机制。本地攻击者只需具备对 uedit32.ini 文件的读取权限，即可通过逆向分析该弱加密算法轻松还原出明文 FTP 密码，进而利用获取的合法凭据登录目标 FTP 服务器，导致用户隐私泄露、未授权文件访问及权限提升。该漏洞影响 UltraEdit 8.2 版本，CVSS 评分 4.6，属于本地攻击场景下的中危安全缺陷。"
published = "2001-08-31T04:00:00Z"
remediation = '立即将 UltraEdit 升级至最新版本（当前为 v21.x 或更高），新版已采用安全加密存储 FTP 凭据。若暂时无法升级，应在 UltraEdit 的 FTP 菜单中取消勾选"Save Password"（保存密码）选项，防止弱加密密码写入 uedit32.ini 文件。同时，在文件系统层面收紧 uedit32.ini 的访问权限，仅允许当前用户读写（Windows 右键属性→安全→移除其他用户的读取权限），阻止同机其他用户读取并解密存储的 FTP 密码。'
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "UltraEdit 8.2 FTP客户端弱密码加密漏洞"
updated = "2026-06-16T21:55:21Z"

