[basic]
description = 'Twig webmail 系统存在变量设置漏洞，当站点未配置 "vhosts" 变量时，系统未能正确设置该变量，导致远程攻击者可通过向 index.php3 程序传递特制的 vhosts 参数，插入任意 PHP 代码并执行。攻击者无需身份认证即可利用此漏洞，可能导致敏感信息泄露、系统数据篡改或服务中断。该漏洞影响 Twig webmail 系统，CVSS 评分 7.5，危害等级高。'
published = "2001-01-09T05:00:00.000"
remediation = '立即升级 Twig webmail 到修复此漏洞的版本（查看 CHANGELOG 确认修复版本号），或在 index.php3 中显式初始化 \$vhosts 变量为默认空数组后再使用，防止未初始化变量被外部参数注入。如产品已停止维护，建议迁移至其他活跃维护的 Webmail 系统（如 Roundcube、SquirrelMail 等），并在迁移前于 Web 服务器层面过滤 index.php3 的 vhosts 参数输入。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Twig webmail system 变量设置不当导致任意 PHP 代码注入漏洞"
updated = "2026-06-16T21:53:17.910"

