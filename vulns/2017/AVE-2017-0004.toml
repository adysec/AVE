[basic]
description = "Windows 图形设备接口（GDI）存在本地权限提升漏洞。本地攻击者可通过运行特制的应用程序利用该漏洞，在内核模式下执行任意代码，从而获取系统最高权限。该漏洞影响 Windows Vista SP2、Windows Server 2008 SP2/R2 SP1、Windows 7 SP1、Windows 8.1、Windows Server 2012 Gold/R2、Windows RT 8.1 及 Windows 10 等多个版本。攻击者需具备本地登录能力，无法远程利用。Microsoft 已在 2017 年 3 月安全更新中修复此漏洞。"
published = "2017-03-17T00:59:00Z"
remediation = "立即安装 Microsoft 2017 年 3 月安全更新 (MS17-012)，对应知识库文章 KB4013075（Windows 10）或 KB4012598（Windows 7/8.1/Server），可通过 Windows Update 自动获取。由于该漏洞已被 CISA KEV 收录且存在在野利用，无法立即打补丁的系统应限制非管理员用户登录并启用 AppLocker 阻止可疑 GDI 调用。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows GDI 特权提升漏洞"
updated = "2026-06-17T00:56:54Z"

