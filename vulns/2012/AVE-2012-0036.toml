[basic]
description = "Mozilla Firefox 4.x至9.0、Thunderbird 5.0至9.0及SeaMonkey 2.7之前版本中存在跨站脚本（XSS）漏洞。漏洞源于XPConnect安全机制未能正确强制实施对框架脚本调用不可信对象的安全限制，远程攻击者可通过特制网页或Firefox扩展注入任意Web脚本或HTML代码，在用户浏览器上下文中执行恶意操作。攻击者需诱使用户访问恶意页面，成功利用后可窃取Cookie、会话令牌或篡改页面内容。该漏洞CVSS评分4.3，危害等级中危。"
published = "2012-02-01T16:55:01Z"
remediation = "将 Firefox 升级至 10.0 及以上版本，SeaMonkey 升级至 2.7 及以上版本，Thunderbird 升级至 10.0 及以上版本。该漏洞通过启用 Script Security Manager (SSM) 对所有 frame script 强制安全检查来修复。Firefox 3.6 和 Thunderbird 3.1 不受影响，无需升级。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox/SeaMonkey/Thunderbird XPConnect安全限制绕过跨站脚本漏洞"
updated = "2026-06-16T23:37:17Z"

