[basic]
description = "Opera 浏览器 11.50 之前版本的打印功能存在未明确的漏洞，远程攻击者可诱导用户访问精心构造的恶意网页，触发打印功能处理逻辑缺陷导致浏览器崩溃，造成拒绝服务（应用程序崩溃）。该漏洞影响 Opera 11.50 之前所有版本，涉及打印功能、JavaScript 处理、数组操作、SVG/Canvas 渲染、iframe 处理等多个组件。攻击需要用户交互（访问恶意页面），攻击向量为网络，攻击复杂度中等，无需认证，仅影响可用性（CVSS 4.3，AV:N/AC:M/Au:N/C:N/I:N/A:P）。Opera 11.50 版本已修复此漏洞，用户升级至 11.50 或更高版本即可修复。"
published = "2011-07-01T10:55:02Z"
remediation = "建议立即升级 Opera 浏览器至 11.50 或更高版本，官方已在 11.50 版本修复此打印功能拒绝服务漏洞。升级方式：访问 Opera 官网下载最新版本覆盖安装，或通过浏览器菜单「帮助」→「检查更新」自动升级。若暂时无法升级，建议避免打印不可信网页内容，或在打印前预览确认页面内容安全，临时禁用打印功能可作为临时缓解措施。建议尽快完成版本升级以彻底修复该漏洞。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera Opera浏览器 打印功能拒绝服务漏洞"
updated = "2026-06-16T23:31:38Z"

