[basic]
description = "Network Associates PGP Keyserver 7.0 的 LDAP 服务组件在处理异常 BER 编码数据时存在缓冲区溢出漏洞，远程攻击者无需身份认证即可向目标服务器的 LDAP 端口发送特制请求触发该漏洞，导致服务崩溃拒绝服务，甚至可能执行任意代码。Metasploit 框架已集成该漏洞的利用模块，降低了攻击门槛。该漏洞影响 PGP Keyserver 7.0 版本，CVSS 评分 7.5，危害等级高。"
published = "2001-07-16T04:00:00Z"
remediation = "立即升级 PGP Keyserver 至 Hotfix 2 版本（适用于 Solaris 和 Windows NT），可从 PGP 官方下载页面获取。如无法立即升级，在网络边界防火墙阻断 LDAP 端口（389/tcp、389/udp、636/tcp、636/udp）的入站流量作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Network Associates PGP KeyServer 7 LDAP缓冲区溢出漏洞"
updated = "2026-06-16T21:56:02Z"

