[basic]
description = "Matu FTP Server 1.1.3.0 存在缓冲区溢出漏洞，远程攻击者可通过向 FTP 服务的 PASS（密码）命令发送超长字符串触发缓冲区溢出，导致服务拒绝响应，甚至可能执行任意代码。该漏洞影响 MatuFtpServer 1.1.3.0 版本，攻击无需身份认证，CVSS 评分 7.5，危害等级高。"
published = "2002-10-04T04:00:00Z"
remediation = "Matu FTP Server 已停止维护且无官方补丁。建议立即停止使用该软件，迁移至 FileZilla Server 或 vsftpd 等仍在维护的 FTP 服务器。若无法立即替换，在防火墙层面限制 FTP 端口（21/TCP）仅允许可信 IP 段访问，并禁用匿名登录功能。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Matu FTP Server 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:58:20Z"

