[basic]
description = "KDE 3.1.3 及更早版本中的 KDM（KDE 显示管理器）使用了熵值不足的弱会话 Cookie 生成算法，无法提供128位安全熵值，导致攻击者可以通过暴力破解方式猜测会话 Cookie，进而未授权访问目标用户的图形会话。该漏洞影响 KDE 2.2.2、3.0.x 及 3.1.x 系列版本，远程攻击者无需身份认证即可发起攻击。KDE 官方已发布修复补丁，将 Cookie 生成算法改为使用 /dev/urandom 作为熵源，受影响用户应升级至 KDE 3.1.4 或应用对应版本的安全补丁。"
published = "2003-10-06T04:00:00Z"
remediation = "升级到 KDE 3.1.4 或更高版本，以修复 KDM 会话 Cookie 生成算法熵值不足的问题。具体操作：1) 通过系统包管理器（如 apt、yum、zypper）升级 KDE 至最新版本；2) 从 ftp://ftp.kde.org/pub/kde/security_patches 下载对应版本的 kdm 安全补丁（post-3.1.3-kdebase-kdm.patch）并应用；3) 升级后重启 KDM 服务使补丁生效。如无法立即升级，可临时禁用 KDM 远程会话功能，或改用其他显示管理器（如 GDM、XDM）作为过渡缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "KDE KDM 会话Cookie弱随机数生成漏洞"
updated = "2026-06-16T22:02:39Z"

