[basic]
description = "WordPress 的 WP Security Audit Log 插件 3.1.1 版本存在敏感信息泄露漏洞。该插件将安全审计日志文件存储在 `wp-content/uploads/wp-security-audit-log/` 目录下，但未对目录访问权限进行限制，导致任何未经身份认证的远程攻击者均可直接通过浏览器访问该目录下的日志文件。此外，这些日志文件会被 Google 等搜索引擎收录索引，进一步扩大了信息暴露面。攻击者可通过访问日志文件获取网站敏感操作记录、IP 地址等，为后续攻击提供情报支撑。"
published = "2018-04-04T19:29:00Z"
remediation = "升级 WP Security Audit Log 插件到最新版本（建议 ≥4.0），并确保将其配置为不记录或隐藏敏感文件路径。立即更新 `wp-content/plugins/wp-security-audit-log/` 文件夹的权限，禁止目录列出。使用 `.htaccess` 或 Web 服务器配置禁止对 `/wp-content/uploads/wp-security-audit-log/*` 文件的直接访问。必要时可采取 WAF 规则阻止对这些目录的请求作为临时缓解措施。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress WP Security Audit Log 插件敏感信息泄露漏洞"
updated = "2026-06-17T02:05:17Z"

