[basic]
description = "Adobe Flash Player 及 Adobe AIR 存在本地沙箱信息泄露漏洞，影响 Adobe Flash Player 9.0.246.0 之前版本、10.x 10.0.32.18 之前版本以及 Adobe AIR 1.5.2 之前版本。该漏洞源于本地沙箱安全机制存在缺陷，当 SWF 文件被保存到硬盘时，攻击者可利用此机制绕过沙箱限制获取敏感信息。攻击者需在目标系统上具有本地访问权限，攻击复杂度低且无需身份认证即可触发漏洞，导致目标系统敏感信息泄露。该漏洞 CVSS 评分为 4.9，危害等级为中等。"
published = "2009-07-31T19:30:00Z"
remediation = "Adobe Flash Player 9.x 用户应升级至 9.0.246.0，10.x 用户升级至 10.0.32.18；Adobe AIR 升级至 1.5.2；Adobe Flex SDK 升级至 3.4.1。所有平台（Windows/Mac OS X/Linux/Solaris）均受影响，建议启用浏览器自动更新或通过 Adobe 官网下载补丁。临时缓解措施：避免将不可信 SWF 文件保存到本地磁盘，并在浏览器中禁用或限制 Flash Player 的执行权限。"
score = 4.9
severity = "MEDIUM"
sources = ["tenable"]
title = "Adobe Flash Player 本地沙箱信息泄露漏洞"
updated = "2026-06-16T23:08:15Z"

