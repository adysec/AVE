[basic]
description = "Windows Hyper-V NT Kernel Integration 虚拟服务提供程序（VSP）驱动（vkrnlintvsp.sys）存在释放后使用（Use-After-Free，CWE-416）漏洞。该驱动在处理 VMBus 通信时未能正确管理对象内存生命周期，释放对象后仍保留悬垂指针，后续代码路径访问已释放内存时可被利用。已获得 Hyper-V 主机本地低权限的攻击者可通过触发特定操作导致内核内存损坏，实现权限提升至 SYSTEM。该漏洞 CVSS 评分 7.8，危害等级高，已被检测到在野利用，CISA 已将其列入已知被利用漏洞目录。Microsoft 已于 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:58.960"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 (KB5050021)，可通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。该更新修复了 Hyper-V NT Kernel Integration VSP 中的 Use-After-Free 漏洞。如无法立即打补丁，建议限制本地用户对 Hyper-V 组件的访问权限，并遵循最小权限原则管理虚拟机操作。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Hyper-V NT Kernel Integration VSP 权限提升漏洞"
updated = "2026-06-17T08:43:07.913"

