[basic]
description = "WatchGuard Firebox II 4.1 和 4.5 版本的 FTP 代理及 SMTP 代理服务存在拒绝服务漏洞。远程攻击者无需身份验证即可通过向目标设备发送大量 FTP 或 SMTP 请求，导致设备资源耗尽并禁用代理处理功能，从而影响正常网络流量转发。该漏洞攻击复杂度低、利用方式简单，仅需基本的网络连接即可完成攻击，造成部分可用性丧失，CVSS 评分 5.0，危害等级为中危。"
published = "2001-01-09T05:00:00Z"
remediation = "建议将 WatchGuard Firebox II 的固件升级至 4.5 版本之后或更高版本以修复资源处理缺陷。若无法升级，建议在外部防火墙上配置速率限制（Rate Limiting），严格限制对 FTP (21) 和 SMTP (25) 端口的并发连接数，以缓解大规模洪水攻击导致的拒绝服务。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "WatchGuard Firebox II 拒绝服务漏洞"
updated = "2026-06-16T21:53:19Z"

