[basic]
description = 'Recourse ManTrap 1.6 蜜罐系统存在内核修改漏洞，攻击者通过查看 /proc 目录列表中缺少 ".." 父目录项这一特征，即可识别出目标系统为 ManTrap 蜜罐环境。该漏洞影响 Recourse ManTrap 1.6 版本，攻击者需具备本地访问权限（本地访问 AV:L）且无需认证即可通过查看 /proc 目录列表识别蜜罐环境，属于信息泄露类漏洞（CVSS 2.1，C:P/I:N/A:N）。攻击者利用内核修改导致 /proc 目录结构异常这一特征，通过简单的目录遍历操作即可识别蜜罐环境，从而规避蜜罐监控并调整攻击策略。Recourse 公司已停止维护该产品，建议迁移至现代蜜罐解决方案。'
published = "2001-01-09T05:00:00Z"
remediation = '建议立即停止使用 Recourse ManTrap 1.6 并迁移至现代蜜罐解决方案（如 Cowrie、Dionaea、Conpot 等）。若必须继续使用，可通过重新编译内核恢复 /proc 目录中 ".." 条目的显示，或在内核参数中启用 procfs 完整显示（如启用 hidepid=0），但需注意这会降低蜜罐隐蔽性。建议尽快部署现代主动防御蜜罐系统替代已停止维护的 ManTrap 产品。'
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Recourse ManTrap 信息泄露漏洞"
updated = "2026-06-16T21:53:14Z"

