[info]
author = "AVE"
description = "检测 Jakarta Tomcat 3.1 的 /admin 上下文是否未做访问限制。远程攻击者无需认证即可访问管理 Servlet，通过添加根目录上下文实现读取服务器上任意文件。"
id = "POC-AVE-2000-0825"
name = "Apache Jakarta Tomcat 默认配置权限不当导致任意文件读取漏洞 PoC"
severity = "medium"
tags = [
    "cve-2000-0672",
    "tomcat",
    "admin",
    "unauthorized-access",
]
vuln_id = [
    "CVE-2000-0672",
    "AVE-2000-0825",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/admin"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Administration",
    "Tomcat Administration",
    "admin",
]
