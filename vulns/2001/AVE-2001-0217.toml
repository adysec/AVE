[basic]
description = "stunnel 3.8 及更早版本存在格式化字符串漏洞，攻击者可通过发送构造的恶意 ident 用户名触发该漏洞，在目标系统上执行任意命令。该漏洞影响运行 stunnel 的所有服务器系统，攻击无需身份认证且复杂度低，可导致完全的机密性、完整性与可用性丧失。CVSS 评分 10，危害等级极高。"
published = "2001-02-12T05:00:00.000"
remediation = "tags, Chinese, ≥20 characters, actionable.<value>立即将 stunnel 升级至 3.81 或更高版本，该版本已修复格式字符串漏洞。若无法立即升级，可临时禁用 ident 认证（在 stunnel 配置中移除或注释 ident 相关配置项），并在网络层面限制外部对 stunnel 服务的访问，仅允许可信 IP 连接，以降低被利用的风险。"
score = 10
severity = "CRITICAL"
