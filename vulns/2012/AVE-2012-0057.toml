[basic]
description = "Mozilla Firefox/Thunderbird/SeaMonkey 的 SVG 渲染引擎中 nsSVGFEDiffuseLightingElement::LightPixel 函数存在堆缓冲区溢出漏洞。远程攻击者可通过构造特制的 SVG 图像，利用不同数制系统间的处理差异触发堆缓冲区溢出，导致无效的 gfxImageSurface 释放操作，造成拒绝服务或可能执行任意代码。该漏洞影响 Firefox 4.x 至 11.0、Firefox ESR 10.x 低于 10.0.4、Thunderbird 5.0 至 11.0、Thunderbird ESR 10.x 低于 10.0.4 及 SeaMonkey 低于 2.9 版本，CVSS 评分 10.0，危害等级严重。攻击无需认证，用户只需访问恶意页面或打开恶意邮件即可触发。"
published = "2012-04-25T10:10:17Z"
remediation = "升级 Mozilla Firefox 至 12.0 及以上版本（ESR 分支升级至 10.0.4），Thunderbird 升级至 12.0（ESR 分支升级至 10.0.4），SeaMonkey 升级至 2.9 及以上版本。无法立即升级时，可禁用 JavaScript（在 about:config 中将 javascript.enabled 设为 false）作为临时缓解措施，但会严重影响正常功能。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 堆缓冲区溢出漏洞"
updated = "2026-06-16T23:37:21Z"

