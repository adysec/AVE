[basic]
description = "PostgreSQL 7.2 及更早版本中的 cash_words() 函数存在整数符号错误漏洞，本地攻击者可通过向该函数传递一个极大的负值参数触发缓冲区溢出，导致拒绝服务甚至可能执行任意代码。该漏洞影响 PostgreSQL 7.2 及之前所有版本，CVSS 评分 7.5，危害等级高。攻击者需拥有本地数据库访问权限，利用难度较低。"
published = "2003-01-17T05:00:00Z"
remediation = "升级 PostgreSQL 至 7.2.1 或更高版本。Red Hat Linux 用户应安装 RHSA-2003:001 提供的更新包。如无法立即升级，可限制 cash_words() 函数的调用权限，仅授予受信任用户使用该函数，并在应用层对传入 cash_words() 的参数进行负数值校验过滤。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "PostgreSQL cash_words 函数缓冲区溢出漏洞"
updated = "2026-06-16T21:59:15Z"

