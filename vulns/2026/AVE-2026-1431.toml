[basic]
description = "rclone 在通过 WebDAV TUS 协议向 Infinite Scale 端点发起可恢复上传时，若 HTTP 传输在返回响应前失败（如连接被重置、超时、DNS 或 TLS 错误），`getTusLocationOrRetry` 函数会在未检查响应是否为 nil 的情况下直接访问 `resp.StatusCode`，触发空指针解引用 panic。该漏洞影响所有使用 Infinite Scale WebDAV TUS 上传功能的 rclone 1.74.0 及以下版本。攻击者需控制用户已配置的目标端点，并在用户发起上传时主动重置连接才能触发；攻击需要用户交互且复杂度较高，但远程利用无需认证。在 VFS 长期挂载或多远程并发 CLI 场景下，未恢复的 goroutine panic 可导致 rclone 进程及其中运行的无关工作被终止，造成拒绝服务。rclone 1.75.0 已修复该问题。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
