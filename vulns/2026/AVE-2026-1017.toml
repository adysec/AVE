[basic]
description = "KeePassXC 存在本地权限提升漏洞，其 OpenSSL 配置中存在不受控制的搜索路径元素安全问题。该产品会从不受保护的位置加载配置文件，攻击者需首先在目标系统上获得执行低权限代码的能力，随后可利用此漏洞加载恶意配置文件，将权限提升至 KeePassXC 运行用户的上下文级别并执行任意代码。该漏洞影响 KeePassXC 低于 2.7.9 版本的安装，CVSS 评分为 7.3，危害等级为高。成功利用此漏洞可导致攻击者完全控制目标用户的密码库数据。"
published = "2026-04-11T01:16:17Z"
remediation = '升级到 KeePassXC 2.7.12 或更高版本。如无法立即升级，Windows 系统管理员应通过 NTFS 权限阻止低权限用户在 C:\Tools\vcpkg\packages\openssl_x64-windows 路径创建文件，或临时禁用自动更新功能作为缓解措施。'
score = 7.3
severity = "HIGH"
sources = ["zdi"]
title = "KeePassXC 本地权限提升漏洞"
updated = "2026-06-17T10:56:04Z"

