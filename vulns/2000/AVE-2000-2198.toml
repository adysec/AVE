[basic]
description = "IBM Tivoli Management Framework 3.7.1 中的 Tivoli Lightweight Client Framework（LCF）HTTP 接口在安装时默认将 http_disable 设置为零，导致远程已认证攻击者可通过操纵日志文件的方式，绕过 Tivoli Endpoint Configuration 数据文件的访问权限限制，从而实现对敏感配置数据的未授权读取或篡改。该漏洞影响运行 Tivoli Management Framework 3.7.1 的服务器及终端设备，攻击者只需拥有有效账户凭据并具备网络访问权限，即可通过 HTTP 接口发送特制请求利用日志文件操作绕过文件权限校验，造成机密性、完整性和可用性完全受损。"
published = "2000-12-31T05:00:00Z"
remediation = "升级至 IBM Tivoli Management Framework 3.7.1 修复包或更高版本（3.7.2 及以上），修复包会将 LCF 的 http_disable 参数在安装时默认设为 1，从而禁用 HTTP 接口并消除文件权限绕过风险。若暂时无法打补丁，可在所有受影响的 Tivoli 节点上手动编辑 lcf.conf 配置文件，将 http_disable 设置为 1，然后重启 Tivoli Lightweight Client Framework (LCF) 服务，以关闭 HTTP 接口作为临时缓解措施。"
score = 9
severity = "CRITICAL"
sources = ["avd"]
title = "IBM Tivoli Management Framework 文件权限绕过漏洞"
updated = "2026-06-16T21:53:26Z"

