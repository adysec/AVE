[basic]
description = "SGI IRIX 6.5.x 系统中 FAM（File Alteration Monitor）服务存在文件信息泄露漏洞。FAM 用于监控文件系统变更，但其默认配置未对文件列表操作进行充分的权限检查，导致低权限用户能够列举本应仅允许 root 用户访问的目录中的文件名称。攻击者需拥有本地系统访问权限，无需特殊认证即可利用该漏洞获取受限目录的文件名信息，为后续攻击（如定位敏感文件）提供情报。该漏洞影响 FAM 2.6.6、2.6.8 及更早版本，CVSS 评分 2.1，危害等级低。"
published = "2002-09-05T04:00:00Z"
remediation = "升级 FAM 至 2.6.10 及以上版本。Debian 用户安装 DSA-154 对应安全更新包；Red Hat 用户应用 RHSA-2005-005 提供的补丁；FreeBSD 用户参照 FreeBSD-SN-02:05 更新 ports 中的 fam 包；SGI IRIX 用户安装 advisory 20000301-03-I 提供的补丁。如无需文件变更通知功能，可停止 famd 服务并禁用自启动作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["exploitdb"]
title = "SGI IRIX 6.5.x FAM 任意根目录文件列表信息泄露漏洞"
updated = "2026-06-16T21:58:18Z"

