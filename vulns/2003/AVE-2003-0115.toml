[basic]
description = "OpenSSL 0.9.7 存在双重释放（Double Free）内存管理漏洞（CWE-415）。漏洞原理在于 OpenSSL 处理 SSL 客户端证书解析时，当收到带有特定畸形 ASN.1 编码的客户端证书，其内部的证书解析与验证流程会对同一内存块执行两次释放操作，从而破坏堆内存结构。远程攻击者在未经过身份认证的情况下，只需向使用受影响版本 OpenSSL 0.9.7 作为 SSL/TLS 服务器的目标系统发起 TLS 握手并提交精心构造的恶意客户端证书，即可触发该漏洞。利用该漏洞可导致目标进程崩溃，造成拒绝服务（DoS）；在特定条件下攻击者还可进一步操纵堆布局实现任意代码执行，进而完全控制受影响服务。该漏洞影响所有使用 OpenSSL 0.9.7 版本的服务端应用，危害等级严重。"
published = "2003-11-17T05:00:00Z"
remediation = """
` tags embedded and "tags.CVE-2003-0545" prefix which is invalid. I need to output only the clean field content.

Let me write concise but complete remediation.<value>立即升级 OpenSSL 到修复版本：该漏洞已在 OpenSSL 0.9.7b 及 0.9.6m 中修复（对应 Red Hat 公告 RHSA-2003-292、Debian 公告 DSA-394）。由于 0.9.7 系列早已停止维护，强烈建议升级到仍受官方支持的 OpenSSL 3.x 系列并安装最新补丁版本，同时移除系统中残留的旧版 libssl 库。如暂时无法升级，可在临时缓解期内关闭双向 TLS 的客户端证书校验，仅允许受信任 CA 签发的证书发起 TLS 握手，并通过防火墙或访问控制列表限制 SSL 服务的访问来源，以降低远程利用风险。升级完成后重启依赖 OpenSSL 的守护进程并验证证书链与握手功能正常。"""
score = 9.8
severity = "CRITICAL"
sources = ["redhat"]
title = "OpenSSL SSL 客户端证书双重释放远程代码执行漏洞"
