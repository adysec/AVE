[basic]
description = "Linux 系统上的 SOCKS5 代理服务器存在缓冲区溢出漏洞。攻击者通过向目标服务器发送超长连接请求，可触发服务端缓冲区溢出，从而在服务器上执行任意系统命令。该漏洞影响运行 SOCKS5 服务的 Linux 主机，攻击者需具备本地访问权限并向 SOCKS5 端口发送特制请求。成功利用后，攻击者可完全控制受影响的系统，危及数据机密性、完整性和可用性。"
published = "2001-01-09T05:00:00Z"
remediation = "立即升级 Linux 系统上运行的 socks5 服务器软件至最新稳定版本，以修复缓冲区溢出漏洞。若无法立即升级，应在防火墙或 iptables 中限制 socks5 服务仅监听本地回环接口（127.0.0.1），或临时禁用该服务，防止本地攻击者通过构造超长连接请求执行任意命令。同时建议审查系统日志中来自本地主机的异常连接行为。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Linux SOCKS5 Server 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:19Z"

