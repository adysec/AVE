[basic]
description = "Linux内核2.4.22之前版本中的C-Media PCI声卡驱动程序存在安全缺陷，在特定条件下未使用get_user函数安全访问用户空间数据，导致内核空间与用户空间的安全边界被跨越。该漏洞影响搭载C-Media PCI声卡并运行受影响内核版本的Linux系统。攻击者无需身份认证，可通过本地或远程方式利用此缺陷，在用户空间与内核空间之间非法传递数据，进而提升系统权限或执行任意代码，威胁系统的机密性、完整性和可用性。该漏洞与CVE-2003-0699为不同漏洞。"
published = "2004-02-17T05:00:00Z"
remediation = "升级 Linux 内核至 2.4.22 或更高版本，该版本已修复 C-Media PCI 声卡驱动（cmpci）中未使用 get_user 函数访问用户空间的安全边界跨越问题。对于 Red Hat Enterprise Linux 用户，应安装 Red Hat 安全公告 RHSA-2003-238 或 RHSA-2004-044 提供的内核更新补丁。如暂时无法升级内核，可通过移除或禁用 cmpci 声卡驱动模块作为临时缓解措施，执行 rmmod cmpci 并阻止模块自动加载。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Linux C-Media PCI声卡驱动 内核权限提升漏洞"
updated = "2026-06-16T22:02:40Z"

