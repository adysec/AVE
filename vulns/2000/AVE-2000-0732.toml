[basic]
description = "Stalker CommuniGatePro 3.3.2 的 POP3 守护进程在处理用户认证时存在信息泄露漏洞。当用户输入无效用户名和无效密码时，服务器返回不同的错误提示信息，远程攻击者无需认证即可通过枚举用户名的方式，根据错误信息的差异区分出目标服务器上存在的有效邮箱地址。攻击者可利用收集到的有效邮箱地址发起垃圾邮件攻击，导致服务器被滥用。该漏洞攻击复杂度低，仅需网络访问即可利用，影响机密性。厂商已发布更新版本修复此问题。"
published = "2000-12-11T05:00:00.000"
remediation = "建议立即将 Stalker CommuniGate Pro 升级至 3.3.3 或更高版本，该版本已修复 POP3 服务对不同用户名和密码返回不同错误信息的问题。如无法升级，可在 POP3 服务前端部署反向代理统一错误返回信息，或配置防火墙限制 POP3 端口（110）的访问来源 IP，仅允许可信邮件客户端连接。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Stalker CommuniGate Pro POP3 信息泄露漏洞"
updated = "2026-06-16T21:52:56.930"

