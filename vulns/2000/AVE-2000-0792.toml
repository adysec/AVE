[basic]
description = "Linux modutils 2.3.x 中的 modprobe 程序在处理模块名时未正确过滤 shell 元字符，本地攻击者可通过构造特制的模块名参数注入任意 shell 命令，以 root 权限执行恶意代码。该漏洞影响 Linux 系统上使用 modutils 2.3.x 包的所有发行版，攻击者需拥有本地用户权限即可触发，无需交互，危害等级高。"
published = "2001-01-09T05:00:00Z"
remediation = """
` tags embedded. I need to write a clean, actionable Chinese remediation.

The vulnerability is in modutils 2.3.x, specifically modprobe. The fix would be to upgrade modutils to a patched version.<value>建议升级 modutils 至 2.3.11 或更高版本。Red Hat Linux 用户可安装 RHSA-2000-108 提供的更新包；Debian 用户可安装 20001120 安全公告中的更新；SuSE 用户可参考 SuSE-SA:2000:44 安装补丁。如无法立即升级，可通过移除 /sbin/modprobe 的 setuid 位（chmod u-s /sbin/modprobe）或限制本地用户对 modprobe 的调用权限作为临时缓解措施。"""
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Linux modutils modprobe 任意命令执行漏洞"
updated = "2026-06-16T21:53:08Z"

