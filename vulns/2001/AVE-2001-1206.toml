[basic]
description = "Solaris 8 系统的 pam_ldap 认证模块存在安全绕过漏洞，攻击者可在远程无需身份认证的情况下，通过发送空密码（NULL password）绕过 LDAP 身份验证机制，直接以任意用户身份登录系统。该漏洞影响 Solaris 8 操作系统上使用 pam_ldap 模块进行 LDAP 集中认证的配置，攻击条件要求目标系统启用并配置了 pam_ldap 认证模块且允许空密码通过认证。利用方式简单，攻击者仅需在登录时提交空密码字段即可成功绕过身份验证，获得未授权访问权限，可能导致敏感数据泄露、系统被完全控制等严重后果，CVSS 评分 10.0，危害等级极为严重。"
published = "2001-05-03T04:00:00Z"
remediation = "安装 Sun Security Bulletin #50234 发布的补丁 108528-01（适用于 Solaris 8 SPARC 及 x86 平台），该补丁修复 pam_ldap 模块允许空密码绕过认证的问题，补丁将确保 pam_ldap 拒绝空密码后进行后续认证验证。以 root 身份执行 patchadd 命令应用补丁，并重启系统使更新生效。如暂无法安装补丁，可在 /etc/pam.conf 中临时注释掉使用 pam_ldap.so.1 的认证行，改为使用本地文件系统认证作为缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Sun Solaris PAM LDAP 空密码认证绕过漏洞"
updated = "2026-06-16T21:53:59Z"

