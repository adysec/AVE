[basic]
description = "NVIDIA Transformers4Rec for Linux 存在不安全的反序列化漏洞（CWE-502），攻击者通过向目标系统提交特制的恶意序列化数据，触发 Transformers4Rec 组件在反序列化过程中执行未预期的代码。该漏洞可能导致远程代码执行、数据篡改及敏感信息泄露。攻击需要用户交互（如诱导用户加载恶意文件），且攻击者需具备本地访问能力，CVSS 评分 7.8，危害等级高。建议用户升级至 NVIDIA 官方发布的安全修复版本。"
published = "2026-05-26T17:16:29Z"
remediation = "建议立即升级 NVIDIA Transformers4Rec 至最新修复版本，具体更新包请访问 NVIDIA 官方安全公告页面（PSIRT Bulletin 5838: https://nvidia.custhelp.com/app/answers/detail/a_id/5838）下载。如无法立即升级，应避免加载不可信来源的模型文件，并在应用层面对序列化数据进行严格的输入验证和反序列化白名单过滤，以降低利用风险。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "NVIDIA Transformers4Rec 不安全反序列化漏洞"
updated = "2026-07-24T11:10:00Z"

