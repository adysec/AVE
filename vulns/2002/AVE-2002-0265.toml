[basic]
description = "wordtrans-web 包中 wordtrans 1.1pre8 及更早版本的 wordtrans.php 脚本存在输入验证缺陷，导致攻击者可通过某些参数（如 dict）传输恶意数据。未经身份认证的远程攻击者可利用此漏洞执行任意代码或实施跨站脚本攻击，威胁网站服务器安全。该漏洞影响范围限于 wordtrans-web 软件，攻击者无需任何权限即可远程触发，通过精心构造的参数实现代码执行或页面劫持，潜在地威胁网站完整性和用户数据安全。Microsoft 及相关安全厂商已发布补丁，用户需及时更新至安全版本以防护此漏洞。"
published = "2002-10-04T04:00:00Z"
remediation = "建议立即升级 wordtrans-web 到 1.2 或更高版本以获取官方安全修复。当无法立即更新时，建议（1）通过 WAF 禁用 wordtrans.php 路径访问，（2）限制访问来源 IP，（3）对 dict 等参数进行严格过滤验证，（4）启用 PHP 安全模式限制 shell 执行，并在升级后验证所有参数验证逻辑。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "wordtrans-web 代码执行跨站脚本漏洞"
updated = "2026-06-16T21:58:13Z"

