[info]
author = "ave"
description = "检测 Microsoft Exchange Server 是否存在 CVE-2021-27065 漏洞。该漏洞是 ProxyLogon 利用链的关键组件，存在于 Exchange Control Panel (ECP) 中，允许攻击者在绕过认证后写入任意文件，结合 CVE-2021-26855 SSRF 可实现完全远程代码执行，影响 Exchange Server 2013/2016/2019，无需预先身份认证即可利用。"
id = "POC-AVE-2021-1108"
name = "Microsoft Exchange Server CVE-2021-27065 PoC"
severity = "high"
tags = ["ave-2021-1108"]
vuln_id = [
    "CVE-2021-27065",
    "AVE-2021-1108",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/ecp/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Exchange"]
