[basic]
description = "Apple Safari 和 Google Chrome 使用的 WebKit 引擎在处理包含 IBM1147 字符集的文本节点转换时存在类型检查缺陷，远程攻击者可通过构造包含特殊 BR 元素的 HTML 文档触发内存破坏，导致任意代码执行或拒绝服务。该漏洞影响 Mac OS X 10.4~10.6 及 Windows 平台上的 Safari 5.0 以下版本以及 Chrome 5.0.375.70 以下版本，CVSS 评分 9.3，危害等级严重。用户需升级至 Safari 5.0/4.1 或 Chrome 5.0.375.70 以上版本修复。"
published = "2010-06-11T19:30:20Z"
remediation = "Mac OS X 10.5/10.6 及 Windows 用户将 Safari 升级至 5.0 或更高版本，Mac OS X 10.4 用户升级至 Safari 4.1；Google Chrome 用户升级至 5.0.375.70 或更高版本；Ubuntu 用户运行 apt-get update && apt-get upgrade libwebkit 安装 USN-1006-1 安全更新；openSUSE 用户安装 2011 年 1 月发布的 webkit-gtk 安全补丁。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari 和 Google Chrome WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:19:17Z"

