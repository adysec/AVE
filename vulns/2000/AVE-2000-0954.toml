[basic]
description = "Check Point FireWall-1/VPN-1 4.1 及更早版本中的模块间认证机制（fwa1）存在设计缺陷，未经身份认证的远程攻击者可通过发送特制的网络数据包绕过该认证机制，干扰防火墙各内部模块之间的正常通信，从而触发拒绝服务（Denial of Service）攻击，使防火墙服务崩溃或无法正常处理网络流量。该漏洞影响 Check Point FireWall-1 3.0、4.0、4.1 及同系列的 VPN-1 产品，CVSS v2 评分为 5.0（Medium），CVSS v3 评分为 7.5（High）。攻击者无需任何身份凭据，仅需在目标网络可达的情况下发送恶意数据包即可利用该漏洞，攻击复杂度低，成功后可导致防火墙功能中断，影响企业网络边界的安全防护能力。Check Point 已在安全公告中说明修复方案，建议受影响用户升级至最新版本并应用安全补丁。"
published = "2000-11-14T05:00:00Z"
remediation = "升级 Check Point FireWall-1/VPN-1 至 4.1 SP4 或更高版本，包括 FireWall-1 NG 及后续版本，以修复 fwa1 模块间身份验证绕过漏洞。如无法立即升级，应在防火墙上过滤外部对 fwa1 服务端口的访问，限制 fwa1 仅接受来自受信任管理服务器的通信，并在边界设备上部署 IDS/IPS 规则检测针对 fwa1 的异常数据包。临时缓解期间应持续监控防火墙日志中是否存在 fwa1 相关异常连接。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Check Point FireWall-1 跨模块认证机制拒绝服务漏洞"
updated = "2026-06-16T21:52:31Z"

