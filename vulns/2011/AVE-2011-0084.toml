[basic]
description = "Mozilla Firefox、Thunderbird及SeaMonkey存在Cookie跨域信息泄露漏洞。该漏洞的根本原因在于浏览器Cookie处理机制中未能正确区分仅在尾部点号上存在差异的域名（例如example.com与example.com.），攻击者可利用此缺陷通过Set-Cookie响应头设置携带尾部点号的Cookie，从而绕过同源策略（Same Origin Policy）的限制，实现跨域Cookie信息的非法访问与窃取。该漏洞影响Firefox 3.6.18之前版本、Thunderbird 3.1.11之前版本及SeaMonkey 2.0.14之前版本，攻击条件为攻击者需控制目标用户访问的远程服务器并向其发送恶意构造的Cookie响应头，最终导致用户敏感信息泄露。"
published = "2011-06-30T16:55:05Z"
remediation = "将 Firefox 升级至 3.6.18 或更高版本，Thunderbird 升级至 3.1.11 或更高版本，SeaMonkey 升级至 2.1 或更高版本。如仍在使用上述旧版本，立即通过各产品内置更新功能或从 Mozilla 官网下载最新版本。对于无法立即升级的环境，可在浏览器 about:config 中禁用第三方 Cookie 作为临时缓解措施，或配置代理层对 Set-Cookie 响应头中的域名进行规范化校验。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey Cookie跨域信息泄露漏洞"
updated = "2026-06-16T23:31:10Z"

