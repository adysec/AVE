[basic]
description = "Linux 内核 overlayfs 子系统中存在释放后使用漏洞。由于 ovl_link_up 函数在调用 ovl_dentry_update_reval() 之前过早调用了 dput(upper)，而后续 ovl_dentry_remote() 仍访问已释放 upper dentry 的 d_flags 字段，导致释放后使用（UAF）。该漏洞影响启用 overlayfs 的 Linux 内核系统，攻击者需在本地具有低权限访问权限，通过触发 rename 或 copy_up 等文件操作即可利用此漏洞，成功利用可能导致权限提升、任意代码执行或系统崩溃。CVSS 评分 7.8，危害等级高。"
published = "2025-03-27T15:15:56Z"
remediation = "立即升级 Linux 内核至修复版本：5.10.247、5.15.179、6.1.130、6.5、6.6.81、6.12.18、6.13.6 或更高版本。Ubuntu 22.04 LTS 用户应执行 apt upgrade linux-image-generic 安装最新安全内核，Debian 12 用户应安装 DSA-5900-1 安全更新，Debian 11 用户应安装 DLA-4404-1 安全更新，SUSE 用户应安装 SUSE-SU-2025:01964-1 安全更新。升级后必须重启系统以加载新内核。如无法立即重启，可联系发行商获取内核热补丁作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux Linux内核 OverlayFS 释放后使用漏洞"
updated = "2026-07-14T13:17:26Z"

