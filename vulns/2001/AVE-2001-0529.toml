[basic]
description = "PHPSlash 0.6.1 的 Block_render_url.class 组件存在任意文件读取漏洞。具有 PHPSlash 管理员权限的远程攻击者可通过创建 block 并将目标文件路径指定为 source URL，从而读取服务器上的任意敏感文件（如配置文件、密码文件等），导致敏感信息泄露。该漏洞利用条件要求攻击者已获取管理员权限，CVSS 评分 5.0，危害等级中危。"
published = "2002-05-19T04:00:00Z"
remediation = "升级 PHPSlash 至最新版本 0.8.1.1（2006 年发布），该版本修复了 URL Block 模块中任意文件读取漏洞。如无法升级，立即限制 blockAdmin.php3 页面的访问权限，仅允许超级管理员（GOD 权限）访问；同时移除所有非管理员用户的 URL Block 编辑权限，防止攻击者通过创建 URL 类型区块并指定任意文件路径（如 ./config.php3）读取 Web 服务器可访问的敏感文件。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "PHPSlash 0.5.3/0.6.1 URL Block 任意文件读取漏洞"
updated = "2026-06-16T21:56:03Z"

