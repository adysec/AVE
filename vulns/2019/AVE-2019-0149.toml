[basic]
description = 'TOTOLINK 基于 Realtek SDK 的路由器存在认证机制缺陷，攻击者可通过向 boafrm/formLogin URI 发送包含 {"topicurl":"setting/getSanvas"} 的 POST 请求获取 CAPTCHA 文本，从而绕过验证码保护机制。在获取有效凭据后，攻击者无需 CAPTCHA 即可通过 HTTP 基本认证执行路由器管理操作。该漏洞影响 A3002RU（2.0.0 及之前）、A702R（2.1.3 及之前）、N301RT（2.1.6 及之前）、N302R（3.4.0 及之前）、N300RT（3.4.0 及之前）、N200RE（4.0.0 及之前）、N150RT（3.4.0 及之前）和 N100RE（3.4.0 及之前）多个型号。CVSS 评分 9.8，危害等级严重，攻击条件为网络可达且目标设备运行受影响固件版本。'
published = "2020-01-27T17:15:12.167"
remediation = "立即升级路由器固件至以下版本以上：A3002RU 升级到 2.0.1 及更高版本，A702R 升级到 2.1.4 及更高版本，N301RT 升级到 2.1.7 及更高版本，N302R/N300RT/N150RT/N100RE 升级到 3.4.1 及更高版本，N200RE 升级到 4.0.1 及更高版本。登录路由器管理界面（通常为 192.168.0.1 或 192.168.1.1），在系统设置中找到固件升级选项，从 TOTOLINK 官方支持网站 https://www.totolink.net/support 下载对应型号的最新固件后执行升级。若官方已不再提供受影响型号的固件更新，建议更换为已修复该漏洞的新型号路由器，并在升级前备份当前配置。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "TOTOLINK 路由器 认证绕过漏洞"
updated = "2026-06-17T02:27:18.410"

