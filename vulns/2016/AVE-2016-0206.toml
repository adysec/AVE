[basic]
description = "Apache ActiveMQ 5.x 版本（5.14.0 之前）的 Fileserver Web 应用存在未授权文件上传漏洞。攻击者无需身份认证即可通过 HTTP PUT 请求将任意恶意文件（如 JSP 木马）上传至服务器可写目录，随后通过 HTTP MOVE 请求将文件移动到可执行目录，从而触发远程代码执行。该漏洞影响所有未升级的 ActiveMQ 5.x 版本，CVSS 评分 9.8，危害等级严重。官方已在 5.14.0 版本中通过禁用 Fileserver 的 PUT 方法修复此漏洞。"
published = "2016-06-01T20:59:04.123"
remediation = "立即升级 Apache ActiveMQ 至 5.14.0 或更高版本。如无法升级，可删除 `conf/jetty.xml` 中 Fileserver 的 Web 上下文配置，或通过防火墙限制对 8161 端口的访问并禁用 PUT/MOVE HTTP 方法。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Apache ActiveMQ Fileserver 任意文件上传漏洞"
updated = "2026-06-17T00:44:56.753"

