[basic]
description = "HP-UX VVOS 10.24 及 11.04 版本中 TGA 和 Java Servlet 代理的 NSAPI 插件存在拒绝服务漏洞。远程攻击者无需身份认证即可通过发送特制请求触发该漏洞，导致目标系统 CPU 资源被大量消耗，造成服务不可用。攻击条件简单（网络可达即可），无需任何权限，影响系统可用性。该漏洞 CVSS 评分 5.0，危害等级中危。"
published = "2000-12-19T05:00:00.000"
remediation = "建议立即应用 HP 官方安全补丁（参考 HP 安全公告 HPSBUX0012-001），升级 HP-UX VVOS 至 11.04 以上已修复版本。如无法升级，可在 NSAPI 配置中禁用 TGA 和 Java Servlet proxy 插件，或在网络层面限制对受影响服务的访问来源 IP。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "HP HP-UX VVOS NSAPI Plugin 拒绝服务漏洞"
updated = "2026-06-16T21:52:52.230"

