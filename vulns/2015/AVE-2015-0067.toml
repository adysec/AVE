[basic]
description = "WordPress mTheme-Unus 主题 2.3 版本之前存在目录遍历漏洞，远程攻击者无需身份认证即可通过向 css/css.php 文件的 files 参数传入 `..`（点点）序列进行路径遍历，从而读取服务器上的任意文件。该漏洞影响机密性，攻击复杂度低，无需用户交互，CVSS 评分 7.5，危害等级高。建议用户升级至 mTheme-Unus 主题 2.3 或更高版本以修复此漏洞。"
published = "2019-09-20T20:15:10Z"
remediation = "将 WordPress mTheme-Unus 主题升级至 2.3 或更高版本。如无法立即升级，可删除或重命名 css/css.php 文件中的 files 参数处理逻辑，或在 Web 服务器层面（如 Nginx/Apache）添加规则阻止包含 .. 的路径请求。同时建议检查服务器上是否已有被读取的敏感文件泄露。该主题已停止官方维护，建议迁移至其他受支持的主题。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress mTheme-Unus theme 路径遍历漏洞"
updated = "2026-06-17T00:36:27Z"

