[info]
author = "ave"
description = "检测 Mac OS X 10.2 系统上 Terminal.app 是否存在 telnet:// 协议命令注入漏洞（CVE-2002-1898）。该漏洞源于 Terminal 1.3 在处理 telnet:// 链接时未过滤 Shell 元字符，攻击者可构造包含管道符、分号或反引号的恶意 telnet:// URI，诱导用户点击后执行任意本地命令。本 PoC 引用 ExploitDB EDB-ID 21815 的公开利用代码进行验证，Payload 格式为 telnet://|<command>，需人工交互点击链接触发。"
id = "POC-AVE-2002-0720"
name = "Apple Mac OS X Terminal.app telnet:// 命令注入 PoC"
severity = "high"
tags = [
    "ave-2002-0720",
    "cve-2002-1898",
    "command-injection",
    "terminal-app",
]
vuln_id = [
    "CVE-2002-1898",
    "AVE-2002-0720",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["21815"]
