[basic]
description = "Compaq WL310 及以其为基础的 Orinoco Residential Gateway 接入点存在敏感信息泄露漏洞。该设备使用系统标识字符串（system identification string）作为默认的 SNMP 读写团体字符串（read/write community string），且此默认值可预测、无需身份认证。远程攻击者只要能够访问目标设备的 SNMP 服务端口，通过 SNMP 查询该默认标识字符串即可读取并篡改设备敏感的配置信息，例如修改网络配置、管理员设置等，从而完全控制网关。该漏洞风险等级中等（CVSS 评分 6.4），利用难度较低，攻击条件仅为网络可达并对 161 端口进行 SNMP 探测，无需任何有效凭据。"
published = "2002-08-12T04:00:00Z"
remediation = "建议立即修改受影响设备（Compaq WL310 及采用同一固件的 Orinoco  Residential Gateway）的 SNMP 默认读写团体字（community string），不要沿用出厂自带的系统标识字符串作为团体字，改为设置强随机口令并区分只读（read-only）与读写（read-write）权限。同时在其管理界面中禁用 SNMP 远程写入能力，若设备支持访问控制列表（ACL/VLAN）则将 SNMP 的 161/162 端口访问限制于可信任的内网管理网段，禁止对该端口暴露到互联网。若无法升级固件，应在防火墙上拦截外网对该设备 161/UDP 等 SNMP 端口的访问，作为临时缓解措施，防止被远程查询到系统标识并借此读取或篡改敏感配置信息。"
score = 6.4
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Compaq WL310 Orinoco Residential Gateway 默认 SNMP 团体字符串信息泄露漏洞"
updated = "2026-06-16T21:58:10Z"

