[basic]
description = "Apache for Win32 1.3.x（低于1.3.24）及2.0.x（低于2.0.34-beta）版本存在远程命令执行漏洞。该漏洞源于Web服务器在处理对.bat或.cmd批处理脚本的请求时，未对用户提供的参数进行充分的shell元字符过滤，攻击者可通过在脚本参数中注入管道符（|）等shell元字符，将恶意命令拼接到原始命令后一并传递给cmd.exe等shell解释器执行。由于Apache以SYSTEM权限运行，成功利用可导致攻击者在目标Windows系统上执行任意系统命令，进而完全控制服务器。该漏洞影响范围涵盖Apache HTTP Server for Win32的1.3.x和2.0.x早期版本，利用条件简单，无需身份验证，攻击者只需构造包含特殊字符的HTTP请求即可远程触发，CVSS评分7.5，危害等级高。Apache官方已在1.3.24和2.0.34-beta版本中修复此漏洞，建议用户升级至安全版本。"
published = "2002-03-21T05:00:00.000"
remediation = "建议立即升级 Apache HTTP Server：1.3.x 版本升级至 1.3.24 或更高版本，2.0.x 版本升级至 2.0.34-beta 或更高版本。补丁修复了 Win32 平台下 .bat 和 .cmd CGI 脚本未过滤管道符等 shell 元字符的问题，阻止远程攻击者通过 URL 参数执行任意系统命令。如短期内无法升级，建议避免将批处理文件作为 CGI 脚本使用，改用 Perl、Python 等解释器编写 CGI 程序，或在防火墙层面限制对 CGI 目录的远程访问。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Apache Win32 批处理文件远程命令执行漏洞"
updated = "2026-06-16T21:56:41.263"

