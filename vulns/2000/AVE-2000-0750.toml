[basic]
description = "tcpdump 3.4/3.5 版本在解析 AFS ACL（访问控制列表）数据包时存在多个缓冲区溢出漏洞。攻击者无需身份认证，只需向运行 tcpdump 的目标主机发送特制的 AFS ACL 数据包，即可触发缓冲区溢出。由于 tcpdump 通常以 root 权限运行（需要 root 权限打开网络接口进行数据包捕获），溢出成功后可导致栈上变量被覆盖，进而实现远程代码执行，完全获取目标主机的 root 权限。该漏洞影响运行 tcpdump 3.4 和 3.5 的 Unix/Linux 系统，CVSS 评分 10.0，危害等级严重。"
published = "2000-12-11T05:00:00.000"
remediation = "建议升级 tcpdump 到 3.6 或更高版本（如 4.99.1+），可通过包管理器安装：apt-get update && apt-get install tcpdump（Debian/Ubuntu）或 yum update tcpdump（RHEL/CentOS）。若暂时无法升级，可在防火墙层面阻断非受信网络的 AFS 协议流量（UDP 7000-7007），并限制 tcpdump 仅在受信网络接口上运行（使用 -i 参数指定接口），禁用 AFS 解析功能（-A 参数避免解析 AFS 包）。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "tcpdump 远程代码执行漏洞"
updated = "2026-06-16T21:52:59.913"

