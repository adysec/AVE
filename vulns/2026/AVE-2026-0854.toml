[basic]
description = "linkify-it 是一个支持完整 Unicode 的链接识别库，其 `mailto:` 模式验证器存在二次复杂度拒绝服务漏洞。当 `.test()` 或 `.match()` 方法处理用户输入时，每遇到一个 `mailto:` 就会执行 `text.slice(pos)`（O(n) 复制）并通过贪婪正则 `src_email_name` 扫描整个剩余文本（O(n)），导致 N 次 `mailto:` 触发 N × O(n) = O(n²) 的 CPU 消耗。未经身份认证的远程攻击者可通过提交特制的短文本（如约 336KB 的 `mailto:` 重复字符串）阻塞单线程事件循环数秒，影响基于 markdown-it 并启用 linkify 的评论系统、聊天、论坛、Wiki 等应用。该漏洞影响 linkify-it 5.0.2 之前的所有版本，已在 5.0.2 中修复。"
published = "2026-07-08T17:17:26.883"
remediation = "立即将 linkify-it 升级至 5.0.2 或以上版本（npm install linkify-it@^5.0.2），该版本已限制 email 本地部分长度并改用 sticky 正则避免全尾扫描。如无法升级，可在调用 .test()/.match() 前对输入文本做长度限制（建议 ≤50KB），或在 markdown-it 中关闭 linkify 功能（{linkify:false}）作为临时缓解。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "linkify-it mailto验证器二次复杂度拒绝服务漏洞"
updated = "2026-07-10T19:13:03.283"

