[basic]
description = 'Windows NT 和 Windows 2000 系统中，Shell 可执行文件 Explorer.exe 的注册表项使用了相对路径而非绝对路径，导致系统启动时会在 %Systemdrive% 目录下搜索 Explorer.exe。本地攻击者可将特洛伊木马程序命名为 Explorer.exe 放置于该目录，当系统重启或用户登录时，木马会以当前用户权限自动执行，从而实现任意命令执行。该漏洞被命名为"相对 Shell 路径"漏洞，影响 Windows NT 及 Windows 2000 系统，攻击者需具备本地访问权限。'
published = "2000-07-25T04:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS00-052 提供的补丁。Windows NT 4.0 用户下载 https://www.microsoft.com/download/details.aspx?FamilyId=2055A234-6CFD-46ED-879B-F8A742EE1345，Windows 2000 用户下载 https://www.microsoft.com/download/details.aspx?FamilyId=C9CB67CD-E52E-4937-A82A-9C8FC0B2D581。如无法安装补丁，作为临时缓解措施，限制交互式登录用户对 %Systemdrive% 根目录的写入权限，移除 Everyone 组的写入权限。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Windows NT/2000 Shell 相对路径劫持本地权限提升漏洞"
updated = "2026-06-16T21:52:13Z"

