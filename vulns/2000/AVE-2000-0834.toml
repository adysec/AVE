[basic]
description = "Oracle 8.x Connection Manager Control 组件中的 cmctl 程序存在栈缓冲区溢出漏洞，源于对命令行参数长度缺乏边界检查。本地攻击者可通过传递超长命令行参数触发栈溢出，覆盖返回地址并执行任意代码，从而提升至 Oracle 服务账户权限（通常为 oracle 用户或 dba 组权限）。该漏洞影响 Oracle 8.1.5 及早期版本的 Connection Manager Control 组件，攻击条件要求攻击者已具备本地系统访问权限且能执行 cmctl 二进制文件。利用方式为构造超长参数配合 Shellcode 实现本地提权，ExploitDB 已公开对应利用代码（EDB-ID: 20411）。Oracle 已在后续版本中修复该漏洞，建议升级至修复版本或限制 cmctl 执行权限。"
published = "2001-01-09T05:00:00Z"
remediation = "立即将 Oracle 8.x 升级至 19c/21c/23c 等受支持版本；或采取严格的命令行参数长度限制，配置参数强化输入验证，禁用危险的 cmctl 工具，确保其运行在受限制的用户上下文中，并部署网络防护设备限制对连接管理器的访问。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Oracle Oracle 8.x cmctl 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:19Z"

