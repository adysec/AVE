[basic]
description = "TightVNC 3.3.3r2-21 之前版本的 vncserver 包装脚本在生成认证 Cookie 时调用 rand() 函数前未调用 srand() 进行种子初始化，导致每次生成的随机数序列完全可预测。远程攻击者无需身份认证即可通过多次连接观察或直接计算预测 VNC 会话的认证 Cookie，从而绕过 VNC 服务器的身份验证机制，获得对目标系统的未授权访问权限。该漏洞影响所有使用该版本 vncserver 包装脚本的 VNC 部署，攻击复杂度低，无需特殊权限。"
published = "2003-03-03T05:00:00Z"
remediation = "升级 VNC 至 3.3.3r2-21 或更高版本。Red Hat 用户安装 RHSA-2003:041 或 RHSA-2003:068 提供的更新包；Debian 用户升级至 3.3.6-3；Gentoo 用户应用 GLSA 200302-15；Mandrake 用户安装 MDKSA-2003:022。临时缓解措施可在 VNC 服务端配置中限制仅允许本地回环地址连接，或使用 SSH 隧道封装 VNC 流量。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "TightVNC vncserver Cookie可预测认证绕过漏洞"
updated = "2026-06-16T21:59:27Z"

