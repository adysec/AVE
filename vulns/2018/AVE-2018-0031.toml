[basic]
description = "Windows Win32k 内核组件在处理特定调用时存在缺陷，导致 Win32k.sys 驱动程序无法正确处理请求，从而产生特权提升漏洞。攻击者可通过在受影响的 Windows 系统（如 Windows 7, Windows Server 2008, Windows Server 2008 R2）上运行特制的恶意代码，在获得低权限用户访问权限的条件下，利用该漏洞非法提升权限至 SYSTEM 级别。该漏洞影响范围涵盖多个早期 Windows 版本，一旦被成功利用，攻击者将能够完全控制目标受害系统。"
published = "2018-11-14T01:29:02Z"
remediation = "立即安装微软 2018 年 11 月发布的累积安全更新（对应 KB4042240 或后续更高版本补丁）。对于已停止支持的 Windows 7 或 Server 2008 及其 R2 版本，建议升级至更新的操作系统版本以根除 Win32k 内核漏洞。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Win32k 特权提升漏洞"
updated = "2026-06-17T02:05:09Z"

