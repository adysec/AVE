[basic]
description = "WordPress ebook-download 插件（版本 < 1.2）存在目录遍历漏洞（CWE-22）。未经身份认证的远程攻击者可通过构造包含 `../` 等路径穿越序列的特制 URL 请求，绕过文件访问限制，读取服务器上任意文件（如 wp-config.php 等敏感配置文件），导致敏感信息泄露。该漏洞攻击复杂度低，无需任何权限或用户交互，仅需目标站点安装并启用受影响版本的插件即可利用。CVSS 评分 7.5，危害等级高。建议升级至 1.2 或更高版本以修复此漏洞。"
published = "2019-08-22T14:15:11Z"
remediation = "立即将 WordPress ebook-download 插件升级至 1.2 或更高版本。该漏洞在 1.2 版本中已修复，升级后可消除目录遍历风险，防止攻击者通过构造恶意路径读取服务器上任意文件。如无法升级，可暂时禁用该插件并替换为其他电子书下载插件作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress ebook-download插件路径遍历漏洞"
updated = "2026-06-17T00:40:37Z"

