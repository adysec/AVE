[basic]
description = "OpenBSD 2.7 操作系统的 IPsec 实现（AH/ESP 协议处理模块）未能正确处理空的 AH/ESP 数据包，存在逻辑处理缺陷。远程攻击者无需任何身份认证，只需向目标主机构造并发送特制的空认证头（AH）或封装安全载荷（ESP）数据包，即可触发该漏洞，导致目标系统 IPsec 处理流程异常，进而造成系统崩溃或网络服务中断的拒绝服务（DoS）后果。该漏洞影响运行 OpenBSD 2.7 且启用了 IPsec 功能的系统，攻击条件仅为目标可达且网络访问开放，攻击门槛较低，可能被用于破坏关键网络基础设施的可用性。OpenBSD 官方已发布相应补丁修复该问题。"
published = "2000-12-19T05:00:00Z"
remediation = "建议立即升级 OpenBSD 至 2.8 或更高版本（该版本已修复 IPsec 实现处理空 AH/ESP 数据包时崩溃的问题）；若暂时无法升级，请安装官方 2.7 errata 补丁或禁用不必要的 IPsec/ISAKMP 服务。作为临时缓解措施，可在防火墙（pf/ipf）上仅允许来自可信 IP 的 AH(协议号 50)、ESP(协议号 51) 及 UDP 500/4500 端口的流量，阻断来自不可信网络的 IPsec 报文，避免攻击者发送空 AH/ESP 数据包触发内核拒绝服务。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "OpenBSD 2.7 IPsec AH/ESP 空数据包拒绝服务漏洞"
updated = "2026-06-16T21:52:51Z"

