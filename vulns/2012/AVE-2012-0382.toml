[basic]
description = "Apple iTunes 10.7之前版本使用的WebKit渲染引擎存在内存破坏漏洞。未经身份认证的远程攻击者可通过构造特制的恶意网页，诱骗使用受影响版本iTunes的用户访问该网页，触发WebKit引擎在处理网页内容时发生内存损坏，进而导致远程代码执行或应用程序崩溃拒绝服务。该漏洞影响Windows和Mac平台上的Apple iTunes 10.7之前所有版本，攻击条件为用户通过iTunes内置浏览器访问攻击者控制的恶意网站，利用方式为通过精心构造的网页内容触发内存破坏，实现任意代码执行或造成服务中断。"
published = "2012-09-13T10:30:21Z"
remediation = "建议立即将 Apple iTunes 升级至 10.7 或更高版本，该版本已修复 WebKit 中的多个内存损坏问题。Windows 用户可通过 iTunes 自动更新功能或访问 Apple 官网下载最新安装包；macOS 用户应通过 Mac App Store 更新。如因业务需要暂无法升级，建议在防火墙或代理层面拦截恶意网站的访问，并避免在 iTunes 中打开未知来源的链接。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:46Z"

