[basic]
description = "Google Chrome 16.0.912.77 之前版本中存在释放后使用（Use-after-free）漏洞，该漏洞源于 DOM 处理过程中对已释放内存的引用。远程攻击者可通过诱使用户访问特制网页触发此漏洞，成功利用可导致浏览器崩溃拒绝服务，甚至可能实现任意代码执行。该漏洞影响 Chrome 及基于 WebKit 的浏览器（如 Safari），攻击无需用户交互即可远程触发。"
published = "2012-01-24T04:03:36Z"
remediation = "升级 Google Chrome 至 16.0.912.77 或更高版本，该版本修复了 DOM 处理中的释放后重用漏洞。对于无法立即升级的 Safari 用户（该漏洞也影响 Apple Safari 5.1.4 之前版本），应升级 Safari 至 5.1.4 或更高版本。临时缓解措施可禁用 JavaScript 或使用内容安全策略（CSP）限制不可信脚本执行。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome DOM处理释放后使用漏洞"
updated = "2026-06-16T23:34:10Z"

