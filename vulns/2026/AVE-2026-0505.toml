[basic]
description = "GIMP 在处理 HDR 格式文件时存在堆缓冲区溢出漏洞，由于对用户提供的数据长度缺乏充分验证便复制到堆缓冲区，导致缓冲区溢出。远程攻击者可诱导用户打开特制的 HDR 文件或访问恶意页面触发该漏洞，实现当前进程上下文中的任意代码执行。该漏洞影响 GIMP 各版本，CVSS 评分 7.8，危害等级高，需用户交互方可利用。"
published = "2026-06-10T22:16:56Z"
remediation = "立即升级 GIMP 至最新稳定版 3.2.4（2026-04-19 发布），该版本包含多项安全修复。漏洞位于 GEGL 库的 rgbe.c 中 rgbe_read_new_rle 函数，对 HDR 文件中 RLE 压缩数据的 length 字段缺乏边界校验，导致堆缓冲区越界写入。在官方补丁发布前，切勿打开来源不明的 HDR 文件，并关注 GNOME/GEGL 仓库 issue #450 的修复进展。Linux 发行版用户可等待 Red Hat 等厂商推送更新包。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "GIMP HDR 文件解析堆缓冲区溢出远程代码执行漏洞"
updated = "2026-07-23T09:10:00Z"

