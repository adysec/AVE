[info]
author = "ave"
description = "检查目标系统是否存在ppp daemon符号链接竞争条件漏洞，利用pppd在打开终端设备时可能存在的竞态窗口来检测潜在的权限提升风险"
id = "POC-AVE-2002-0451"
name = "CVE-2002-0824 BSD pppd 任意文件权限修改漏洞"
severity = "medium"
tags = ["ave-2002-0451"]
vuln_id = [
    "CVE-2002-0824",
    "AVE-2002-0451",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
