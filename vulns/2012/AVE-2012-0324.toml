[basic]
description = "Apple iTunes 在 10.7 之前版本所使用的 WebKit 引擎存在内存破坏漏洞。远程攻击者可通过构造恶意网页向目标系统发送特制内容，触发内存损坏，进而执行任意代码或导致应用程序崩溃及拒绝服务。该漏洞影响运行旧版本 iTunes 的系统，攻击者无需身份认证即可在用户访问恶意网站时发起攻击。Apple 已在后续安全更新中修复此问题。"
published = "2012-09-13T10:30:19.603"
remediation = '立即将 Apple iTunes 升级至 10.7 或更高版本。在 Windows 系统上，依次点击 iTunes 菜单栏的"帮助"→"检查更新"，或前往 Apple 官网下载 iTunes 10.7 安装包直接覆盖安装；在 macOS 上，打开 Mac App Store 更新至最新版本。如短期内无法升级，建议暂时停用 iTunes 内置浏览器功能，改用系统自带浏览器访问网页，并启用操作系统防火墙限制 iTunes 对不可信域名的出站连接，以降低被远程利用的风险。'
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:39.083"

