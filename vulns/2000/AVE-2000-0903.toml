[basic]
description = "Lyris List Manager 3 和 4 版本的 Web 界面存在权限校验漏洞。由于程序未能对隐藏表单字段进行有效的服务器端验证，攻击者（订阅用户）可以通过修改 HTTP 请求中 `list_admin` 隐藏字段的值，绕过身份验证直接获取管理级访问权限。该漏洞影响 Lyris List Manager 3 及 4 版本，攻击者无需管理员凭据，仅需通过篡改表单参数即可实现越权管理，导致系统配置被非法修改或敏感数据泄露。"
published = "2000-10-20T04:00:00Z"
remediation = "建议将 Lyris List Manager 升级至 4.0 版本以上。若无法立即升级，应在 Web 服务器端部署 WAF 规则，拦截并过滤包含非法修改 list_admin 字段的 POST 请求，或通过自定义脚本在服务端强制校验用户订阅权限与管理员权限的对应关系。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Lyris List Manager 权限提升漏洞"
updated = "2026-06-16T21:52:25Z"

