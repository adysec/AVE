[info]
author = "AVE"
description = "检测 Recourse ManTrap 1.6.1 蜜罐系统 chroot 环境：通过检查根目录 inode 编号是否异常偏高来判断是否处于 chroot 环境中"
id = "POC-AVE-2000-0823"
name = "CVE-2000-1144 PoC"
severity = "low"
tags = ["ave-2000-0823"]
vuln_id = [
    "CVE-2000-1144",
    "AVE-2000-0823",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
