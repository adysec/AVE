[basic]
description = "标签内输出纯文本。<value>python-cryptography 在解析包含重复自签名证书的无效证书链时，由于 `build_chain_inner` 函数未对已分析的候选证书进行去重，递归处理同一候选证书导致指数级性能开销，造成资源耗尽拒绝服务。该漏洞影响 49.0.0 之前的所有版本，攻击者可通过构造包含重复自签名中间证书的恶意证书链触发漏洞，使证书验证耗时超过 5 秒，进而导致服务不可用。CVSS 评分 8.7，危害等级高。"
published = "2026-08-03T22:16:52Z"
remediation = "将 python-cryptography 升级至 49.0.0 或更高版本。执行 pip install --upgrade cryptography>=49.0.0，或通过 conda、系统包管理器安装对应补丁版本。升级后验证当前版本为 49.0.0 及以上，并重启依赖该库的服务。若暂时无法升级，可在应用层限制证书链深度并过滤包含重复自签名证书的异常链作为临时缓解措施。"
score = 8.7
severity = "HIGH"
sources = ["ghsa"]
title = "python-cryptography 重复自签名中间证书路径构建 拒绝服务漏洞"
updated = "2026-08-04T15:16:43Z"

