[basic]
description = "Novell Groupwise 5.5 及 6.0 版本的 Servlet Gateway 组件在安装时使用默认的用户名和密码配置 Servlet Manager 管理接口，远程攻击者无需身份认证即可通过该默认凭据直接登录管理后台，获取系统控制权限。攻击者可进一步利用管理接口上传恶意 Servlet 或修改配置，实现完全接管目标服务器。该漏洞影响范围广泛，利用门槛极低，CVSS 评分 7.5，危害等级高。"
published = "2001-12-15T05:00:00Z"
remediation = "立即修改 Servlet Manager 的默认用户名和密码，默认凭据为 servlet/manager，可通过访问 /servlet/ServletManager 路径进行更改。同时配置 Web 服务器访问控制，限制仅允许受信任 IP 访问 Servlet Manager 管理界面。由于 Novell Groupwise 5.5/6.0 已停止支持，建议升级到受支持的 Groupwise 版本或迁移至替代产品。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Novell GroupWise 5.5/6.0 Servlet Gateway 默认身份认证漏洞"
updated = "2026-06-16T21:55:47Z"

