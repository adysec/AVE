[basic]
description = "Red Hat Linux 6.2 至 7J 及其他操作系统中分发的 iputils 工具包（20001010 版本之前）的 ping 命令存在权限管理缺陷。ping 在获取原始套接字（raw socket）后未能正确释放特权级别，导致后续代码执行仍以高权限运行。远程攻击者可利用此漏洞，通过发送特制网络请求触发 ping 中的其他潜在缺陷，从而获取目标系统的机密信息、篡改数据或造成服务不可用。该漏洞影响范围广泛，CVSS 评分 7.5，危害等级高。"
published = "2000-10-18T04:00:00.000"
remediation = "立即升级 iputils 至 20001010 或更高版本（该版本已修复获取 raw socket 后未释放特权的问题）。Red Hat Linux 用户可通过 RHN 或官方渠道获取更新包。如无法升级，可移除 ping 的 SUID 位（chmod u-s /bin/ping），仅允许 root 用户执行，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Red Hat Linux iputils 未正确释放特权漏洞"
updated = "2026-06-16T21:53:23.697"

