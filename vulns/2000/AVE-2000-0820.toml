[basic]
description = 'DCForum 的 cgforum.cgi CGI 脚本存在任意文件读取漏洞。攻击者可通过向该脚本发送畸形构造的 "forum" 变量，利用脚本对用户输入处理与路径校验的缺陷，读取 Web 服务器上的任意文件（如系统配置、敏感数据等），甚至在特定条件下删除脚本程序自身。该漏洞影响 DCForum 1-6 版本，攻击者无需认证即可远程发起利用，仅需能够访问目标 Web 服务。CVSS 评分 6.4，危害等级中危，属于经典的 CGI 脚本参数过滤缺失问题。建议删除或加固该脚本，并对 "forum" 参数进行严格的输入校验与路径规范化，防止路径穿越与任意文件暴露。'
published = "2001-01-09T05:00:00Z"
remediation = "立即从 Web 服务器删除或停用存在漏洞的 cgforum.cgi CGI 脚本，并禁用 DCForum 相关 CGI 的执行权限（chmod 移除执行位），避免攻击者通过畸形 forum 变量读取任意文件。同时限制 Web 进程以最低权限运行，确保其无法读取敏感系统文件。鉴于该软件年代久远且可能不再维护，建议彻底更换为仍在维护的论坛系统，并在防火墙层面仅允许可信 IP 访问管理接口作为临时缓解措施。"
score = 6.4
severity = "MEDIUM"
sources = ["avd"]
title = "DCForum cgforum.cgi 任意文件读取漏洞"
