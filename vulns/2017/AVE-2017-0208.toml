[basic]
description = "Progress Telerik UI for ASP.NET AJAX 框架中的 RadAsyncUpload 组件使用了弱加密算法，攻击者可在无需身份认证的情况下远程解密加密参数，绕过文件类型限制上传任意文件（如 ASPX 木马），进而实现远程代码执行。该漏洞影响 R1 2017 之前版本及 R2 2017 SP2 之前版本，CVSS 评分 9.8，危害等级严重。公开的 PoC 已广泛流传，攻击者仅需发送特制 HTTP 请求即可完成利用。"
published = "2017-08-23T17:29:00Z"
remediation = "立即升级 Telerik UI for ASP.NET AJAX 至 R2 2017 SP2（版本 2017.2.711）或更高版本。如无法立即升级，可在 web.config 中禁用 RadAsyncUpload 上传功能，或限制仅允许认证用户访问 Telerik.Web.UI.WebResource.axd 处理程序，并在 IIS 中配置请求过滤规则阻止对 /Telerik.RadUploadHandler.ashx 的未授权访问。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Progress Telerik UI for ASP.NET AJAX 加密漏洞致任意文件上传与远程代码执行"
updated = "2026-06-17T01:01:36Z"

