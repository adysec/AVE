[basic]
description = "Magento 电子商务平台存在 SQL 注入漏洞（CWE-89），未经身份认证的远程攻击者可通过构造恶意请求执行任意 SQL 语句，实现对底层数据库的无限制读取访问，导致敏感数据泄露。该漏洞影响 Magento 2.1 早于 2.1.18 版本、Magento 2.2 早于 2.2.9 版本以及 Magento 2.3 早于 2.3.2 版本。攻击者无需任何凭据即可在网络可达的 Magento 实例上利用此漏洞，通过注入 SQL 语句绕过应用程序的访问控制，直接读取数据库中的客户信息、订单数据、管理员凭据等敏感内容。CVSS v3 评分为 9.8，危害等级严重，Adobe 已在后续版本中发布安全更新修复此问题。"
published = "2019-04-10T18:29:01Z"
remediation = "对于 Magento Open Source 1.x 用户，请升级至 1.9.4.1 版本，或应用 SUPEE-11086 安全补丁；对于 Magento Commerce 1.x 用户，升级至 1.14.4.1 版本。Magento 2.1 用户升级至 2.1.18，2.2 用户升级至 2.2.9，2.3 用户升级至 2.3.2。如暂无法升级，可通过 Web 服务器配置限制对 /rest/V1/guest-carts/* 等敏感接口的未授权访问，或部署 ModSecurity WAF 规则拦截 SQL 注入攻击向量作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Magento SQL注入漏洞"
updated = "2026-06-17T02:40:09Z"

