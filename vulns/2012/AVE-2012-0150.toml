[basic]
description = "Adobe Flash Player 的 ActiveX 控件存在内存破坏漏洞，该漏洞源于程序在处理未指定的向量时存在内存破坏问题。远程攻击者可通过诱导用户访问特制网页触发该漏洞，成功利用可导致任意代码执行或拒绝服务。该漏洞影响 Windows 平台上 10.3.183.15 之前及 11.1.102.62 之前的 Flash Player 版本，CVSS 评分 10.0，无需身份认证即可远程利用，危害严重。Adobe 已发布安全更新修复此漏洞。"
published = "2012-02-16T19:55:00Z"
remediation = "立即将 Adobe Flash Player 升级至 10.3.183.15 或 11.1.102.62 及以上版本。由于 Flash Player 已于 2020 年底停止支持并终止分发，建议彻底卸载 Flash Player 组件，并禁用浏览器中残留的 ActiveX 控件加载项，同时使用组策略阻止 Flash 内容加载以消除风险。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player ActiveX内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:38:11Z"

