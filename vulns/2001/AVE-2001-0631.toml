[basic]
description = "Oracle 8.1.7 数据库中的 XSQL Servlet 组件（1.0.3.0 及更早版本）存在服务器端请求伪造与远程代码执行漏洞。攻击者可通过构造特制的 HTTP 请求，利用 xml-stylesheet 参数将 XSQL 服务器重定向至攻击者控制的恶意服务器，从而在目标系统上执行任意 Java 代码。该漏洞无需身份认证即可远程利用，CVSS 评分 7.5，影响 Oracle 8.1.7 及使用相关 XSQL Servlet 组件的应用系统，可导致敏感信息泄露、数据篡改或服务中断。"
published = "2001-03-12T05:00:00Z"
remediation = '升级 Oracle XSQL Servlet 至 1.0.4.0 或更高版本，可从 Oracle Technology Network (otn.oracle.com) 获取。如无法立即升级，在所有 .xsql 页面文档元素中添加 allow-client-style="no" 属性以禁用外部样式表加载。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Oracle 8.1.7 XSQL Servlet 远程代码执行漏洞"
updated = "2026-06-16T21:53:42Z"

