[basic]
description = "Devaldi FlexPaper（后更名为 FlowPaper）2.3.6 版本的 Publish Service 组件中 setup.php 和 change_config.php 存在输入验证不当漏洞（CWE-20），未经身份认证的远程攻击者可直接向这两个文件发送恶意构造的请求参数，实现远程代码执行。该漏洞影响 FlexPaper/FlowPaper 2.3.6 版本，CVSS 3.0 评分 9.8（CRITICAL），攻击向量为网络、攻击复杂度低、无需权限与用户交互，机密性、完整性、可用性均受高危影响。攻击者可直接构造恶意请求利用 setup.php 或 change_config.php 执行任意代码，完全控制目标服务器。"
published = "2019-07-03T17:15:09Z"
remediation = '建议立即升级 FlexPaper/FlowPaper 至 2.3.7 或更高版本（官方已修复该漏洞），下载地址：https://flowpaper.com/download/。若暂时无法升级，请立即删除或重命名 Web 目录下的 setup.php 和 change_config.php 文件，或在 Web 服务器配置中禁止访问这两个文件（如 Nginx: location ~* (setup|change_config)\.php$ { deny all; }），同时限制 Web 目录写入权限，防止攻击者通过 setup.php 写入恶意配置文件实现 RCE。'
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Devaldi FlexPaper 远程代码执行漏洞"
updated = "2026-06-17T01:36:21Z"

