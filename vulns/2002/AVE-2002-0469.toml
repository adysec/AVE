[basic]
description = "IBM Informix SE 7.25 的 sqlexec 组件存在本地缓冲区溢出漏洞，由于未对 INFORMIXDIR 环境变量长度进行有效边界检查，本地攻击者可通过设置超长 INFORMIXDIR 环境变量触发缓冲区溢出，导致以 root 权限执行任意代码。该漏洞影响 Informix SE-7.25 版本，攻击者需拥有本地系统访问权限，无需身份认证即可利用，CVSS 评分 7.2，危害等级高。"
published = "2002-10-04T04:00:00Z"
remediation = "IBM 已针对 Informix SE 7.25 发布安全补丁修复 sqlexec 缓冲区溢出漏洞。由于该版本已停止技术支持，建议升级至 IBM Informix 14.10 或更新版本。如无法升级，应立即限制本地用户对 sqlexec 二进制文件的执行权限（chmod 750 sqlexec），并通过系统审计机制监控 INFORMIXDIR 环境变量的异常长度设置，同时限制可登录系统的用户范围作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "IBM Informix SE 7.25 sqlexec 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:58:21Z"

