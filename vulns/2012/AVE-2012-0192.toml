[basic]
description = "Oracle MySQL Server 5.1.62及之前版本、5.5.23及之前版本中的Server Optimizer组件存在未明漏洞。远程认证用户可通过向数据库服务器发送特制的查询请求，触发优化器在处理查询计划时的异常，导致MySQL服务进程崩溃或拒绝服务。该漏洞无需特殊权限即可通过网络远程触发，影响范围广泛，CVSS评分4.0，危害等级中低。Oracle在2012年7月的关键补丁更新中修复了此漏洞。"
published = "2012-07-17T22:55:01Z"
remediation = "将 MySQL 5.1 系列升级至 5.1.63 及以上版本，MySQL 5.5 系列升级至 5.5.24 及以上版本。如无法立即升级，可在 MySQL 配置文件 my.cnf 中限制 optimizer_search_depth 参数降低优化器复杂度，并限制可登录数据库的用户权限以减小攻击面。"
score = 4
severity = "MEDIUM"
sources = ["tenable"]
title = "Oracle MySQL Server Server Optimizer 拒绝服务漏洞"
updated = "2026-06-16T23:40:12Z"

