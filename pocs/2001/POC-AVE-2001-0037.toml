[info]
author = "ave"
description = '通过发送GET请求获取漏洞检测页面，页面中包含VBScript脚本，该脚本通过onKeyPress事件拦截用户键盘输入并修改keyCode，将预定义的字符（文件路径c:\winnt\repair\sam._的ASCII码）注入到INPUT TYPE=FILE字段中。若浏览器为IE 5.0-5.5且VBScript可用，则页面标记为VULNERABLE，否则标记为NOT_VULNERABLE。'
id = "POC-AVE-2001-0037"
name = "CVE-2001-0089 Microsoft IE5 INPUT TYPE=FILE Remote File Upload PoC"
severity = "low"
tags = ["ave-2001-0037"]
vuln_id = [
    "CVE-2001-0089",
    "AVE-2001-0037",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc/cve-2001-0089-detection.html"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["VULNERABLE"]
