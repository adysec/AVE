[basic]
description = 'Soft Lite ServerWorx 3.0 存在目录遍历漏洞。远程攻击者可通过在 HTTP GET 请求的路径中插入".."（两个点）或"..."（三个点）等目录遍历序列，绕过服务器文件访问限制，从而读取目标系统上的任意文件内容。该漏洞影响 Soft Lite ServerWorx 3.00 版本，攻击者无需身份认证即可在网络上远程发起利用，可导致服务器敏感配置文件、密码文件等机密信息泄露。攻击条件为攻击者能够向运行该软件的目标服务器发送特制 HTTP 请求。'
published = "2001-06-02T04:00:00Z"
remediation = '立即升级 Soft Lite ServerWorx 至厂商发布的最新修复版本，或替换为仍在维护的 Web 服务器软件。若无法立即升级，应在服务器配置中禁用目录浏览功能，并在应用层对 HTTP 请求的 URL 路径进行过滤，拒绝包含 ".." 或 "..." 等路径穿越序列的请求；同时通过 Web 服务器配置将文档根目录严格限制在指定范围内，禁止访问根目录之外的任意文件。临时缓解措施可在前端防火墙或 WAF 中部署规则，拦截所有包含 "/../"、"/.../" 或编码变体的请求路径。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Soft Lite ServerWorx 3.0 目录遍历漏洞"
updated = "2026-06-16T21:53:52Z"

