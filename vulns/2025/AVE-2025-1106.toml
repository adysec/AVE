[basic]
description = "tags. The vulnerability involves ksmbd in the Linux kernel accessing a sub_auth array without properly validating that num_subauth is non-zero, causing an out-of-bounds read that leaks sensitive memory. An attacker with low privileges can exploit this remotely over the network by sending a specially crafted SMB request, leading to information disclosure with a CVSSv3.1 score of 8.3.<value>Linux 内核 ksmbd 模块中存在越界读取漏洞。由于代码在访问 psid->sub_auth[psid->num_subauth - 1] 之前未检查 num_subauth 是否为零，当 num_subauth 值为零时会导致越界读取内存，造成敏感内核信息泄露。该漏洞影响运行 ksmbd（内核 SMB 服务器）的 Linux 系统，具有低权限远程攻击能力的攻击者可通过网络发送特制 SMB 请求在无需认证的情况下触发该漏洞，成功利用可能导致内核敏感数据泄漏。CVSS v3.1 评分 8.3（HIGH），攻击向量为网络、攻击复杂度低、所需权限低、无需用户交互，影响机密性（高）、完整性（低）和可用性（高）。"
published = "2025-04-16T15:15:56Z"
remediation = "建议立即升级 Linux 内核到以下已修复版本：6.1.134+（6.1 LTS）、6.6.87+（6.6 LTS）、6.12.23+、6.13.11+、6.14.2+ 或 6.15+。Debian 12 (bookworm) 请升级至 linux-image-6.1.180-1 或更高（DSA-5907-1）；Debian 13 (trixie) 升级至 linux-image-6.12.101-1 或更高。Ubuntu 24.04/22.04/20.04 请应用 USN-7594-1 提供的内核更新（如 6.14.0-22.22、6.8.0-*-generic 等对应版本）。临时缓解：若不使用 ksmbd（内核 SMB 服务器），可执行 `modprobe -r ksmbd` 卸载模块，或在内核启动参数添加 `module_blacklist=ksmbd` 禁用自动加载；亦可在防火墙层面封禁 TCP 445 端口防止远程攻击面暴露。Red Hat 系列请关注 RHSA 公告应用对应内核更新。"
score = 8.3
severity = "HIGH"
sources = ["msrc"]
title = "Linux内核 ksmbd 越界读取漏洞"
updated = "2026-07-30T06:22:05Z"

