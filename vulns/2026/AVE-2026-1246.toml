[basic]
description = "ASDA-Soft 是 Delta（台达电）开发的 Windows 平台工业自动化配置软件，用于 ASDA 系列伺服驱动器的参数设定与监控调试。该软件存在栈缓冲区溢出漏洞（CWE-121），源于程序在处理用户输入数据时未对数据边界进行有效校验，攻击者可在本地环境中构造特制的输入数据触发该溢出，进而可能执行任意代码或导致应用程序崩溃。该漏洞影响 ASDA-Soft 0 至 7.2.2.0 版本（Windows 平台），CVSS v3.1 评分为 7.8（HIGH），攻击向量为本地（AV:L），攻击复杂度低（AC:L），无需特权（PR:N），但需要用户交互（UI:R），成功利用后可导致机密性、完整性和可用性均完全受损。此漏洞由 Zero Day Initiative（ZDI）外部发现，CISA 参与协调，Delta 已在安全公告 PCSA-2026-00007 中发布修复方案，建议用户立即升级至 ASDA-Soft v7.2.6.0 或更高版本。"
published = "2026-04-08T03:16:07.700"
remediation = "立即将 ASDA-Soft 升级至 v7.2.6.0 或更高版本，可从 Delta Download Center（https://filecenter.deltaww.com）获取最新安装程序。如暂无法升级，应避免打开来源不明的 ASDA-Soft 项目文件，并在防火墙或 EDR 层面限制 ASDA-Soft 进程对异常文件路径的访问，以降低栈溢出被触发的风险。升级后请验证版本号不低于 7.2.6.0。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "ASDA-Soft 基于栈的缓冲区溢出漏洞"
updated = "2026-07-24T09:10:00.153"

