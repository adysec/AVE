[basic]
description = "Gafware CFXImage 1.6.4 及 1.6.6 版本的 showtemp.cfm 脚本存在路径遍历漏洞，远程攻击者无需身份认证即可通过 FILE 参数传入 `..` 跨目录序列或 `C:` 风格绝对路径读取服务器上的任意文件，导致敏感信息泄露。该漏洞攻击复杂度低，仅需构造特制 HTTP 请求即可利用。"
published = "2002-10-04T04:00:00Z"
remediation = '立即删除或重命名 `showtemp.cfm` 文件，该文件仅为演示用途，非 CFXImage 核心组件。如业务需要类似功能，在 ColdFusion 应用层对 `FILE` 参数做严格路径白名单过滤，禁止包含 `..`、`../` 及盘符绝对路径（如 `C:\`）。建议将 CFXImage 升级至 1.6.6 以上版本（如存在），或迁移至其他受维护的 ColdFusion 图像处理组件替代。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Gafware CFXImage ShowTemp 文件泄漏漏洞"
updated = "2026-06-16T21:58:19Z"

