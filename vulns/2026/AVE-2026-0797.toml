[basic]
description = "Prebid Server 是一个开源实时广告竞价平台，其部分竞价适配器（bidder adapters）在将用户提供的参数拼接至出站请求 URL 时，未对主机名和子域名进行充分校验，导致存在服务端请求伪造（SSRF）漏洞（CWE-918）。未经身份认证的远程攻击者可通过构造恶意的竞价请求参数，诱使服务器向非预期的内部或外部目标发起 HTTP 请求，从而探测内部网络服务、访问敏感端点或进一步实施横向攻击。该漏洞影响 v4.4.0 之前的所有版本，CVSS 评分 10.0，危害等级严重。官方已在 v4.4.0 版本中修复此漏洞。"
published = "2026-07-29T16:17:54Z"
remediation = "立即升级 Prebid Server 至 v4.4.0 或更高版本（https://github.com/prebid/prebid-server/releases/tag/v4.4.0）。如无法立即升级，在配置中禁用受影响的 bidder adapter，并在网络层面限制服务器出站请求目标地址白名单，阻止对内部网络的访问。"
score = 10
severity = "CRITICAL"
sources = ["ghsa"]
title = "Prebid Prebid Server 服务端请求伪造漏洞"
updated = "2026-07-30T20:06:04Z"

