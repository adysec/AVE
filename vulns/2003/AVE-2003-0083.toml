[basic]
description = "Linux Kernel 2.4 的 TCP/IP 分片重组处理模块中的哈希表存在漏洞，远程攻击者可通过向目标系统发送特制的 IP 分片数据包，引发大量哈希表碰撞，导致目标系统 CPU 资源被大量消耗，造成拒绝服务。该漏洞影响 Linux Kernel 2.4 系列版本，攻击无需身份认证，通过网络即可远程触发，危害等级中等。"
published = "2003-06-16T04:00:00.000"
remediation = "升级 Linux 内核至 2.4.21 及以上版本，该版本修复了 IP 碎片重组哈希表碰撞导致的 CPU 耗尽问题。如无法升级内核，可在边界防火墙上限制分片数据包进入，或使用 iptables 规则丢弃异常分片：iptables -A FORWARD -f -m limit --limit 100/s --limit-burst 200 -j DROP。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux Linux Kernel 2.4 TCP/IP 分片重组哈希表碰撞拒绝服务漏洞"
updated = "2026-06-16T22:02:04.447"

