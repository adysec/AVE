[basic]
description = "Tumbleweed Messaging Management System（MMS，原 Worldtalk Worldsecure）4.6 及更早版本在安装时会自动创建默认账户“sa”且未设置密码。该漏洞属于默认凭据配置缺陷，攻击者无需身份认证即可通过网络访问管理接口，使用空密码登录“sa”账户，进而读取或篡改消息与系统配置，造成机密性、完整性与可用性受损。影响范围为 MMS 4.6 及更早版本部署环境，利用条件为远程可达且默认账户未修改，CVSS 评分为 7.5，危害等级高。"
published = "2000-10-20T04:00:00.000"
remediation = "立即为 Tumbleweed MMS（含原 Worldtalk Worldsecure）中的默认账户 sa 设置强密码，或直接禁用/删除该账户；将产品升级到 4.6 之后已修复默认空密码问题的版本。部署前检查安装配置，禁止保留空口令管理账户，并将管理接口限制在受信网络或防火墙白名单内，避免 sa 账户可被远程未授权访问。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Tumbleweed Messaging Management System (MMS) 默认账户空密码漏洞"
updated = "2026-06-16T21:52:26.950"

