[basic]
description = "GitList 0.6 及之前版本在 `searchTree` 函数中存在输入过滤不当漏洞（CWE-20），攻击者可利用该漏洞向 `searchTree` 函数传入未经过充分清洗的参数，触发系统命令执行。此漏洞无需身份认证即可利用，攻击者通过向 GitList 搜索表单发送恶意 POST 请求即可触发远程代码执行，获取 Web 服务器 PHP 进程权限。该漏洞影响所有使用 GitList 0.6 及以下版本的系统，可用于搭建挖矿蠕虫或横向渗透服务器。开发者已在 0.7 版本中修复此问题，建议管理员立即升级。"
published = "2018-06-26T16:29:01Z"
remediation = "tags.<value>立即将 GitList 升级至 0.7 及以上版本，该版本已通过提交 87b8c26b 修复 searchTree 函数中的命令注入漏洞。升级前可临时禁用 GitList 的搜索功能以降低被利用风险。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "GitList ≤0.6 searchTree 函数远程代码执行漏洞"
updated = "2026-06-17T01:32:51Z"

