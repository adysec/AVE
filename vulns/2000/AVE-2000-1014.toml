[basic]
description = "Aplio PRO 设备的 authenticate.cgi CGI 程序存在命令注入漏洞，远程攻击者无需身份认证即可通过向 password 参数中注入 shell 元字符（如分号、管道符等）执行任意系统命令。该漏洞影响 Aplio PRO 系列设备，CVSS 评分 7.5，危害等级高。攻击者只需向目标设备的 authenticate.cgi 接口发送特制 HTTP 请求即可触发，可能导致设备被完全控制、敏感信息泄露或作为跳板攻击内网其他系统。"
published = "2000-12-19T05:00:00.000"
remediation = '立即停止使用 Aplio PRO 设备，该产品已停止维护且无安全补丁可用。如无法下线，在 Web 服务器（如 Apache）配置中禁止外部访问 authenticate.cgi 脚本，添加 `<Files "authenticate.cgi"> Order Deny,Allow Deny from all </Files>` 规则；同时在防火墙层面将 Aplio PRO 管理端口（默认 80/443）的访问源限制为可信管理 IP 段，禁止互联网直接访问。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Aplio PRO authenticate.cgi 远程代码执行漏洞"
updated = "2026-06-16T21:52:46.530"

