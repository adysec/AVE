[basic]
description = "Linux 内核内存故障处理子系统存在缺陷，在迁移包含硬件错误（poisoned）的内存页时，`unmap_poisoned_folio()` 函数未能正确设置 `TTU_HWPOISON` 标志。此前提交将 `TTU_IGNORE_HWPOISON` 替换为 `TTU_HWPOISON` 以防止访问错误页时发送 SIGBUS 信号，但在匿名页迁移过程中，取消映射操作需要设置该标志以正确处理 poisoned folio，而原有策略位于 `hwpoison_user_mappings` 中位置不当。攻击者需具备本地低权限，通过触发内存页迁移操作（如热插拔内存或迁移页面）即可在内核日志中触发警告，导致系统可用性受影响。该漏洞影响 Linux 内核 6.13.0-rc1 及相关版本，CVSS 评分 5.5，危害等级中危。上游已通过补丁将标志更新策略移至 `unmap_poisoned_folio` 函数内以修复此问题。"
published = "2025-04-01T16:15:21Z"
remediation = "建议升级 Linux 内核至修复版本 6.12.19、6.13.7 或 6.14 及以后版本，可通过各发行版官方包管理器获取对应内核更新包并重启系统生效。如短期内无法升级，可临时禁用内存热插拔功能，避免在存在内存错误页时执行页面迁移操作，以降低内核 try_to_unmap_one 警告触发概率。使用 Ubuntu 24.04 LTS 的系统需特别关注 linux 及 linux-aws 等内核子包的版本更新。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel 内存管理 中毒页面迁移拒绝服务漏洞"
updated = "2026-06-17T08:44:34Z"

