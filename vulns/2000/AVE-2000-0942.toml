[basic]
description = "标签中。<value>iputils 工具包中的 ping 程序在获取原始网络套接字后未能及时释放已获取的特权权限。该漏洞影响 Red Hat Linux 6.2 至 7J 等多个操作系统发行版中 20001010 版本之前的 iputils。由于 ping 以 root 权限运行且未在套接字获取后降权，攻击者可通过触发 ping 程序内部的缓冲区溢出等缺陷，以较高权限执行任意代码，从而完全控制受影响系统。该漏洞无需身份认证即可被远程利用。"
published = "2000-10-18T04:00:00Z"
remediation = "建议升级 iputils 至 20001010 或更高版本，可通过安装 Red Hat 安全更新 RHSA-2000:087 修复。受影响系统包括 Red Hat Linux 6.2、7.0 及 7.0j，应执行 up2date iputils 或手动下载更新包安装。如暂时无法升级，可通过内核参数 net.ipv4.ping_group_range 限制 ping 的源端口范围，或使用 iptables 仅允许受信任主机发送 ICMP 回显请求，以降低特权暴露风险。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Red Hat Linux iputils 特权未释放漏洞"
updated = "2026-06-16T21:53:23Z"

