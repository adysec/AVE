[basic]
description = "Ultraseek（原名 Inktomi Search）3.1 及 3.1.10 版本的搜索引擎组件在处理畸形 URL 时存在拒绝服务漏洞。远程攻击者无需身份认证，通过向目标服务器发送特制的畸形 URL 请求（如包含路径遍历序列的 URL），可导致搜索引擎进程崩溃或停止响应合法查询请求，造成服务不可用。攻击复杂度低，影响 Solaris、Windows NT、Linux、HP-UX 等多平台部署的搜索服务。"
published = "2000-12-11T05:00:00Z"
remediation = """
[id]
ave_id = "AVE-2000-01019"
aliases = ["CVE-2000-1019"]

[basic]
title = "Ultraseek（Inktomi Search）3.1/3.1.10 搜索引擎畸形URL拒绝服务漏洞"
description = "Ultraseek（原名 Inktomi Search）3.1 及 3.1.10 版本的搜索引擎在处理畸形 URL 时存在缺陷。远程攻击者无需认证即可向默认监听在 8765 端口的搜索服务发送特制 URL（包含路径遍历如 ../../../index），导致搜索引擎进程崩溃或停止响应合法请求，造成拒绝服务。该漏洞影响 Solaris、Windows NT、Linux、HP-UX 等多平台。"
severity = "MEDIUM"
score = 5.0
sources = ["cve"]
published = "2000-12-11"
updated = "2000-12-11"
remediation = "升级至 Inktomi Search 4.0 版本。厂商已发布各平台（Solaris/Windows NT/Linux/HP-UX）的升级包，可从 ftp://ftp.ultraseek.com/pub/InktomiSearch/4.0.0/ 获取对应平台的安装包进行升级。"

