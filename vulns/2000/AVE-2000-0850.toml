[basic]
description = "Phorum 3.0.7 论坛软件的 violation.php3 脚本存在任意邮件中继漏洞，该脚本未对用户提交的 Mod 和 ForumName 参数进行严格过滤和验证，导致未经身份认证的远程攻击者可通过构造特制 HTTP 请求，向任意电子邮件地址发送邮件并滥用 Phorum 服务器作为垃圾邮件转发代理。该漏洞影响所有部署 Phorum 3.0.7 版本的站点，攻击者无需登录凭据即可在网络可达条件下发起利用，从而大规模发送钓鱼邮件或垃圾邮件，严重损害邮件服务信誉并增加被邮件服务商封锁的风险。"
published = "2000-12-31T05:00:00.000"
remediation = '立即将 Phorum 升级到最新稳定版本以修复 violation.php3 的邮件中继漏洞。如暂时无法升级，请删除服务器上的 violation.php3 文件，或在 Apache 配置中添加 RewriteRule ^/violation\.php3 - [F,L] 禁止外部访问该文件，并在 Nginx 配置中使用 location = /violation.php3 { deny all; } 拒绝访问，同时在 MTA 层面限制 Web 服务器发送邮件的权限以缓解风险。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Phorum 3.0.7 邮件中继漏洞"
updated = "2026-06-16T21:53:26.140"

