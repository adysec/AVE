[basic]
description = "Red Hat Linux 7.0 中 Apache HTTP Server 在启用 UserDir 指令时存在用户名枚举漏洞。当远程攻击者请求 ~username 路径时，若用户名存在但无 public_html 目录与用户名不存在时，Apache 返回不同的错误状态码，攻击者可通过对比响应差异枚举服务器上的有效用户名。该漏洞无需身份认证即可远程利用，攻击条件低，可能导致进一步的社会工程攻击或暴力破解。建议禁用 UserDir 指令或限制访问。"
published = "2001-09-12T04:00:00Z"
remediation = "禁用 Apache UserDir 指令或在 httpd.conf 中设置 `UserDir disabled`，同时使用 `ErrorDocument 404` 和 `ErrorDocument 403` 返回相同错误页面，防止通过不同状态码枚举有效用户名。升级至 Apache 2.0 及以上版本或迁移至受支持的 Red Hat Linux 发行版。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Red Hat Apache 远程用户名枚举漏洞"
updated = "2026-06-16T21:55:24Z"

