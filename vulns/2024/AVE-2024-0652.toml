[basic]
description = "Linux 内核高精度定时器（hrtimers）子系统在 CPU 热插拔场景下存在状态处理缺陷。当 CPU 从在线状态经热卸载降至 CPUHP_HRTIMERS_PREPARE 阶段再恢复在线时，hrtimers_prepare_cpu() 回调未执行，导致 cpu_base.hres_active 标志位持续置位，而 tick 和 clockevents 已在卸载过程中关闭。恢复后 CFS 调度器错误认为 hrtick 已激活，clockevent 设备永久失去切换为 oneshot 模式的时机，同时 cpu_base.online 未正确置位触发内核警告，且部分 per-CPU 状态未重置可能遗留悬空指针。本地攻击者需具备低权限即可利用此漏洞触发系统崩溃或潜在权限提升，CVSS 评分 7.8，危害等级高。"
published = "2025-02-12T14:15:31Z"
remediation = "立即将 Linux 内核升级至以下修复版本：4.20+、5.4.290+、5.10.234+、5.15.177+、6.1.127+、6.6.74+ 或 6.12.11+。对应发行版请安装相应安全更新：Debian 11 安装 DLA-4075-1 更新，Ubuntu 安装 USN-7459-1 更新。Siemens 设备（SCALANCE/SIMATIC S7-1500 等）升级固件至 V3.2 或更高版本。如无法立即升级，可通过限制本地用户登录和禁用 CPU 热插拔功能作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 hrtimers 热插拔 CPU 状态处理不当释放后使用漏洞"
updated = "2026-06-17T08:14:18Z"

