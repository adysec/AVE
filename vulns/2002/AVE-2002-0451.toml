[basic]
description = "tags.<value>BSD系统的pppd程序存在符号链接竞争条件漏洞，本地用户可通过将tty设备文件替换为指向目标文件的符号链接，利用pppd在打开tty设备时的竞态窗口，修改任意文件的权限。该漏洞影响FreeBSD 4.x、NetBSD 1.4.x/1.5.x/1.6及OpenBSD 3.x等版本，攻击条件为攻击者需具备本地用户权限并能访问pppd进程。CVSS评分为6.9，危害等级中等。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 FreeBSD 系统中的 pppd 至 4.4.2-RELEASE 或更高版本，或通过 ports 树执行 `cd /usr/ports/net/ppp && make install clean` 重新编译安装。NetBSD 用户应升级至 NetBSD-SA2002-010 公告中修复后的 pppd 版本。OpenBSD 用户需升级至 OpenBSD 3.1 或更新版本以消除该竞争条件漏洞。修复完成后，通过 `pppd --version` 确认版本已更新，并检查 `/etc/ppp/options` 中是否包含 `noauth` 或 `require-pap` 等安全配置项。"
score = 6.9
severity = "MEDIUM"
sources = ["exploitdb"]
title = "FreeBSD/NetBSD/OpenBSD pppd 任意文件权限修改竞争条件漏洞"
updated = "2026-06-16T21:58:12Z"

