[basic]
description = "Adobe Flash Player 存在未指定的内存破坏漏洞，远程攻击者可通过诱使用户访问包含恶意 SWF 文件的网页或打开特制文件，触发内存损坏，导致任意代码执行或拒绝服务。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上的 Flash Player 9.0.289 之前版本及 10.1.102.64 之前版本，CVSS 评分 9.3，危害严重。Adobe 已在 2010 年 11 月安全更新中修复此漏洞，建议用户升级至最新版本。"
published = "2010-11-07T22:00:02Z"
remediation = "立即升级 Adobe Flash Player 至 9.0.289.0（9.x 系列）或 10.1.102.64（10.x 系列）及以上版本，Android 平台升级至 10.1.95.1 及以上版本。由于 Adobe 已于 2020 年底停止对 Flash Player 的支持，建议彻底卸载 Flash Player 并迁移至 HTML5 技术栈，同时在浏览器中禁用 Flash 插件加载以防止漏洞利用。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:23:15Z"

