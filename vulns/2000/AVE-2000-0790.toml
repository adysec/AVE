[basic]
description = "AOL Instant Messenger（AIM）4.3.2229之前版本存在缓冲区溢出漏洞，处理BuddyIcon功能时未对输入的src参数长度进行有效检查。远程攻击者无需身份认证即可通过发送包含超长src参数的buddyicon命令，触发缓冲区溢出，从而在目标系统上执行任意命令。该漏洞影响AIM 4.0、4.1.2010、4.2.1193等多个版本，CVSS评分为7.5，危害等级为高危。"
published = "2001-01-09T05:00:00.000"
remediation = "立即升级AOL Instant Messenger至4.3.2229或更高版本，该版本修复了buddyicon命令src参数缓冲区溢出问题。在未升级前，可在AIM设置中禁用buddyicon功能以降低攻击面，避免点击来源不明的aim://链接。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "AOL AIM 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:08.013"

