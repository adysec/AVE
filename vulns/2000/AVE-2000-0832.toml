[basic]
description = 'YaBB 论坛软件中的 search.pl CGI 脚本存在目录遍历漏洞，未经身份认证的远程攻击者可通过在 "catsearch" 表单字段中注入 ".."（点号）路径遍历序列，绕过 Web 服务器访问限制，从而读取目标系统上的任意敏感文件。该漏洞影响 YaBB SE 1.5.1 及更早版本，CVSS v2 评分为 7.5（高危），攻击向量为网络可达（AV:N），攻击复杂度低（AC:L），无需身份验证（Au:N），可对机密性、完整性和可用性均造成部分影响（C:P/I:P/A:P）。攻击条件为：目标系统运行存在漏洞的 YaBB 论坛程序且允许外部访问 search.pl 脚本。利用方式为攻击者向目标 Web 服务器发送包含特制 "catsearch" 参数的 HTTP 请求，通过目录遍历序列访问如 /etc/passwd 等系统敏感文件，造成信息泄露。该漏洞于 2000 年 11 月被公开披露，ExploitDB 上已有相关利用代码。'
published = "2001-01-09T05:00:00Z"
remediation = '建议立即升级至 YaBB 2.6.11 或更高版本（官方最新稳定版），该版本已修复 search.pl 中的目录遍历漏洞。若无法升级，请在 search.pl 中对 catsearch 参数实施严格输入验证：过滤 ../、..\\ 等路径遍历字符，限制输入仅允许字母数字字符，并配置 Web 应用防火墙（WAF）拦截包含目录遍历载荷的请求。同时建议迁移至现代维护中的论坛系统（如 Discourse、phpBB 3.3+）以获得长期安全支持。'
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "YaBB search.pl 目录遍历漏洞"
