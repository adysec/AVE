[basic]
description = "Azure Network Watcher VM 扩展存在权限提升漏洞（CWE-59：链接解析不当），具有高权限的本地攻击者可通过创建恶意符号链接诱导扩展组件错误地解析文件路径，从而以更高权限覆盖或删除系统文件，导致系统完整性和可用性受损。该漏洞需攻击者已获得目标虚拟机的高权限访问权限方可利用，攻击复杂度低，无需用户交互。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:30Z"
remediation = "立即将 Azure Network Watcher VM Extension 升级到 1.4.3563.1 或更高版本。可通过 Azure 门户中虚拟机扩展管理或使用 Azure CLI 命令 `az vm extension set --vm-name <VM名称> --resource-group <资源组> --name AzureNetworkWatcherExtension --publisher Microsoft.Azure.NetworkWatcher --version 1.4.3563.1` 完成更新。如无法立即升级，可限制对 VM 扩展具有高权限（Contributor 及以上）的账户数量，并审计扩展操作日志以降低被利用风险。"
score = 6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Azure Network Watcher VM 扩展特权提升漏洞"
updated = "2026-06-17T08:42:43Z"

