[basic]
description = "Cybrotech CyBroHttpServer 1.0.3 存在目录遍历漏洞，该漏洞源于程序对用户请求 URI 中的 ../ 序列过滤不严。未经身份认证的远程攻击者可通过向目标服务器发送特制的包含 ../ 路径穿越序列的 HTTP 请求，突破目录限制读取服务器上的任意文件，导致敏感信息泄露。攻击无需任何权限或用户交互，利用方式简单，已有公开 PoC 可用。"
published = "2018-08-29T22:29:00Z"
remediation = '升级 CyBroHttpServer 至官方修复版本（如存在），或在 Web 服务器配置中拦截包含 `../` 的 URI 请求。如无法升级，可在反向代理层（如 Nginx）添加规则：`if ($uri ~* "\.\.") { return 403; }`，并限制 Web 服务运行账户对敏感系统目录的读取权限。建议迁移至仍在维护的替代 HTTP 服务器软件。'
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "Cybrotech CyBroHttpServer 目录遍历漏洞"
updated = "2026-06-17T01:43:44Z"

