[info]
author = "ave"
description = "检测 Opera 浏览器 11.50 之前的 DOM 实现拒绝服务漏洞。远程攻击者可通过构造包含恶意内容的网页触发浏览器 DOM 处理异常，导致应用程序崩溃。该 PoC 通过提供测试页面检测目标浏览器是否受影响。"
id = "POC-AVE-2011-0140"
name = "CVE-2011-2627 Opera DOM 拒绝服务漏洞 PoC"
severity = "medium"
tags = ["ave-2011-0140"]
vuln_id = [
    "CVE-2011-2627",
    "AVE-2011-0140",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Opera/11.50"]
