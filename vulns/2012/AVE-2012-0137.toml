[basic]
description = "Apple QuickTime 7.7.2 之前版本在 Windows 平台上处理电影文件中的文本轨道时存在堆缓冲区溢出漏洞。远程攻击者可向目标用户发送特制的 .mov 电影文件，诱导用户使用 QuickTime 打开后触发该漏洞，导致任意代码执行或应用程序崩溃。该漏洞无需身份认证即可利用，CVSS 评分 9.3，危害等级严重。"
published = "2012-05-16T10:12:57Z"
remediation = "立即升级 Apple QuickTime 至 7.7.2 或更高版本（该版本修复了此堆缓冲区溢出漏洞）。由于 Apple 已停止对 Windows 版 QuickTime 的支持，建议在完成数据迁移后彻底卸载 QuickTime for Windows，改用 VLC 等替代播放器。如必须保留，在防火墙中阻止 QuickTime 对外部网络的访问，并避免打开来源不明的媒体文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime 文本轨道堆缓冲区溢出漏洞"
updated = "2026-06-16T23:38:02Z"

