[info]
author = "ave"
description = "检测目标 Chrome 浏览器版本是否受 Google Chrome V8 类型混淆漏洞影响，验证浏览器版本 ≤ 142.0.7444.59 时是否存在类型混淆导致的潜在堆损坏风险"
id = "POC-AVE-2025-0552"
name = "Google Chrome V8 类型混淆漏洞 PoC"
severity = "high"
tags = ["ave-2025-0552"]
vuln_id = [
    "CVE-2025-13226",
    "AVE-2025-0552",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/test_v8_type_confusion"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
