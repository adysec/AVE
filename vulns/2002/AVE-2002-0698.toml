[basic]
description = "Zeroo HTTP Server 1.5 的 HttpGetRequest 函数存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标服务器发送超长的 HTTP 请求触发该溢出，进而在服务器上执行任意代码。该漏洞影响运行 Zeroo HTTP Server 1.5 版本的所有系统，攻击者只需构造包含超长数据的 HTTP 请求报文并发送至服务器的监听端口即可利用此漏洞，最终获得与 Web 服务进程同等权限的远程命令执行能力。ExploitDB 已公开该漏洞的利用代码，CVSS 评分为 7.5，危害等级为高。"
published = "2002-12-31T05:00:00Z"
remediation = "Zeroo HTTP Server 1.5 为已停止维护的过时产品，官方未发布针对 CVE-2002-1823 的补丁。建议立即将 Zeroo HTTP Server 替换为仍在维护的 Web 服务器（如 Nginx、Apache HTTP Server 或 lighttpd），并在迁移前通过防火墙限制 80/443 端口的访问源 IP，以临时缓解远程攻击风险。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Lonerunner Zeroo HTTP Server 远程缓冲区溢出漏洞"
updated = "2026-06-16T22:00:07Z"

