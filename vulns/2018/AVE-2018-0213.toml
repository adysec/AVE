[basic]
description = "Embedthis AppWeb 及其 HTTP 库在 7.0.3 版本前存在认证绕过漏洞，根因是 http/httpLib.c 中 authCondition 函数的逻辑缺陷。未经身份认证的远程攻击者可构造特制 HTTP 请求，绕过表单认证和摘要认证机制，直接访问受保护资源。该漏洞影响所有使用 Embedthis HTTP 库且版本低于 7.0.3 的 AppWeb 服务器，CVSS 评分 8.1（高危），攻击复杂度高但无需权限和用户交互。攻击者仅需发送伪造的 HTTP 请求即可利用，成功利用可导致敏感信息泄露、权限提升及后续攻击。官方已在 7.0.3 版本修复该缺陷，建议受影响用户立即升级。"
published = "2018-03-15T01:29:04.447"
remediation = "升级 Embedthis Appweb 至 7.0.3 或更高版本。如使用 Palo Alto Networks PAN-OS，请升级至 PAN-OS 6.1.21+、7.1.17+、8.0.10+ 或 8.1.1+。临时缓解措施：限制管理接口仅允许可信 IP 访问，并在网络层面过滤对管理接口的 HTTP POST 请求。"
score = 8.1
severity = "HIGH"
sources = ["nuclei"]
title = "Embedthis Appweb 认证绕过漏洞"
updated = "2026-06-17T02:05:16.837"

