[basic]
description = 'Microsoft IIS 4.0/5.0 存在源代码片段泄露漏洞，远程攻击者可通过在 URL 后追加 "+.htr" 后缀，绕过服务器解析逻辑直接读取 .htr 处理程序的源代码片段，属于 ".HTR 文件片段读取" 变种漏洞。该漏洞影响 IIS 4.0 和 5.0 版本，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:P/I:N/A:N），仅导致机密性部分丧失。攻击条件为目标服务器运行易受影响的 IIS 版本且开启 .htr 映射，无需身份认证即可远程利用，攻击者可获取服务端脚本逻辑、数据库连接串等敏感信息，进而辅助后续渗透攻击。微软已发布安全公告修复此漏洞，建议升级至 IIS 6.0 或应用相应补丁。'
published = "2000-07-17T04:00:00.000"
remediation = '立即升级 IIS 5.0 至 Service Pack 2 或更高版本，IIS 4.0 应用微软安全公告 MS00-057 提供的补丁（KB271627）。若暂时无法升级，可在 IIS 管理器中移除 .htr 扩展名映射（ISAPI 筛选器中删除 htr 处理程序），或在 URLScan/防火墙层面拦截包含 "+.htr" 的请求作为临时缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "微软 IIS 4.0/5.0 .HTR 文件片段读取漏洞"
updated = "2026-06-16T21:52:08.837"

