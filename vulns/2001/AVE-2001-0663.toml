[basic]
description = "HP-UX 11.11 及更早版本中的支持工具管理器（xstm、cstm、stm）存在拒绝服务漏洞。本地用户可通过向相关服务发送特制请求触发该漏洞，导致系统服务中断或崩溃。攻击条件为需本地访问权限，无需身份认证即可利用。该漏洞影响 HP-UX 11.11 及之前所有版本，主要危害为可用性受损，系统可能无法正常响应服务请求。"
published = "2001-03-26T05:00:00.000"
remediation = "建议立即安装 HP-UX 11.11 官方安全补丁 HPSBUX0101-137，通过 HP-UX 软件安装管理器运行 swinstall 命令应用补丁。如果无法及时打补丁，可临时禁用或移除 Support Tools Manager（xstm、cstm、stm）相关可执行文件以缓解风险，并限制对 /opt/stm 等敏感目录的本地访问权限。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "HP-UX Support Tools Manager 拒绝服务漏洞"
updated = "2026-06-16T21:53:54.333"

