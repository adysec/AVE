[basic]
description = "ISC BIND 8 的 TSIG（事务签名）处理代码中存在堆缓冲区溢出漏洞。远程攻击者无需身份认证即可通过向目标 DNS 服务器发送特制的 TSIG 签名数据包触发该溢出，进而执行任意代码获取 root 权限。该漏洞影响运行 BIND 8.2.x 版本的 DNS 服务器，攻击条件宽松，仅需目标服务器启用 TSIG 功能且暴露于网络即可发起攻击。由于 BIND 是互联网上广泛使用的 DNS 服务器软件，此漏洞潜在影响范围极广，CVSS 评分高达 10.0，危害等级为严重。攻击者成功利用后可完全控制 DNS 服务器，对互联网域名解析服务造成重大威胁。ISC 已在后续版本中修复此漏洞。"
published = "2001-02-12T05:00:00Z"
remediation = '建议立即将 BIND 8.2.x 升级至 BIND 9.16.x 或更高受支持的稳定版本（BIND 8.x 已停止维护，无法获得官方安全补丁）。如需临时缓解，可在 named.conf 配置文件中注释或删除所有 "keys" 及 "allow-transfer" 相关的 TSIG 密钥配置项，并重新加载配置（rndc reconfig），以禁用 TSIG 功能阻止远程利用；同时通过防火墙限制 UDP/TCP 53 端口仅对授权的辅助 DNS 服务器开放，禁止外部主机的区域传输请求，直至完成版本升级。'
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "ISC BIND 8.2.x TSIG 远程堆缓冲区溢出漏洞"
updated = "2026-06-16T21:53:29Z"

