[basic]
description = "RobinHood 1.1 web server for BeOS r5 pro 及更早版本中的 RHConsole 组件存在缓冲区溢出漏洞。远程攻击者无需身份认证，通过网络向目标服务器发送超长的 HTTP 请求即可触发该漏洞，导致缓冲区溢出并引发拒绝服务，使 Web 服务无法正常响应。该漏洞影响运行 BeOS 操作系统的 RobinHood 1.1 Web 服务器，攻击门槛低且无需交互。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 RobinHood Web 服务器至修复该漏洞的新版本，或在防火墙层面限制对 RHConsole 服务的远程访问，仅允许受信任的 IP 地址连接，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Joe Kloss Robinhood HTTP 请求远程拒绝服务漏洞"
updated = "2026-06-16T21:53:16Z"

