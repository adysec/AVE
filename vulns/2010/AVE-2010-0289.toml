[basic]
description = "WebKit 渲染引擎在处理内联元素时存在内存破坏漏洞。远程攻击者可通过构造特制的网页内容，诱使用户使用受影响版本的 Safari 浏览器访问恶意页面，触发内存破坏，导致应用程序崩溃（拒绝服务）或在目标系统上执行任意代码。该漏洞影响 Mac OS X 10.4 至 10.6 平台上 Safari 4.1.1/5.0.1 之前版本、Windows 平台 Safari 5.0.1 之前版本以及 webkitgtk 1.2.6 之前版本。攻击者无需身份认证即可通过网络远程发起攻击，利用复杂度为中等，用户仅需正常浏览网页即可遭受攻击，危害极为严重。Apple 已发布 Safari 5.0.1 及 4.1.1 版本修复此漏洞。"
published = "2010-07-30T20:30:01Z"
remediation = "将 Safari 升级至 5.0.1（Mac OS X 10.5/10.6 及 Windows）或 4.1.1（Mac OS X 10.4），WebKitGTK 升级至 1.2.6。Apple 已通过改进边界检查修复了 WebKit 渲染内联元素时的内存破坏问题。如无法立即升级，应避免访问不受信任的网站，并考虑在防火墙或代理层面过滤恶意网页内容。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:19:19Z"

