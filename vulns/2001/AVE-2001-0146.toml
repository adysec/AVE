[basic]
description = '标签之间。<value>IIS 5.0及更早版本存在目录遍历漏洞，远程攻击者通过对"."（点号）和"\"（反斜杠）字符进行双重URL编码，可绕过IIS的安全过滤机制，实现目录穿越并执行任意系统命令。该漏洞影响Microsoft Internet Information Services 5.0及更早版本以及Personal Web Server（PWS）。攻击者无需身份认证，只要目标系统运行存在漏洞的IIS版本并开放HTTP服务，即可向服务器发送包含双重编码路径的特制请求，从而获取服务器的控制权限。Microsoft已在2001年6月的安全更新MS01-026中修复此漏洞。'
published = "2001-06-27T04:00:00Z"
remediation = '对于受影响系统，IIS 4.0 应安装微软安全补丁 MS01-026（KB Q295534），IIS 5.0 应安装对应补丁（KB Q293826），补丁可在 Windows Update 或微软下载中心获取并安装。补丁安装后通过检查注册表键值 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Updates\Windows 2000\SP2\Q293826（IIS 5.0）或 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Hotfix\Q295534（IIS 4.0）验证安装成功。如无法立即安装补丁，可临时缓解：删除 IIS 虚拟目录中 scripts 文件夹对 CGI 程序的执行权限，限制 IUSR_计算机名 匿名账户的本地登录及文件写入权限，并关闭不必要的 WebDAV 和 FTP 服务以减少攻击面。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft IIS/PWS CGI文件名双解码命令执行漏洞"
updated = "2026-06-16T21:54:07Z"

