[basic]
description = 'IBM Net.Data 7.0 的 db2www 软件包中 document.d2w CGI 程序存在路径信息泄露漏洞。未经身份认证的远程攻击者可通过向该 CGI 程序发送一个不存在的命令参数，触发程序返回包含服务器物理文件路径的错误信息，从而泄露 Web 服务器的真实文件系统路径。利用方式为构造类似 http://target/cgi-bin/db2www/library/document.d2w/show 的请求并附加无效命令，服务器响应中将出现类似 "DTWP029E: Net.Data is unable to locate the HTML block SHOW in file /projects/www/netdata/macro/software/library/document.d2w" 的错误消息，完整暴露了服务器磁盘上的目录结构。该漏洞攻击条件简单，攻击者无需任何认证凭据即可利用，成功泄露的文件系统路径可被攻击者用于进一步构造路径遍历攻击或定向利用其他漏洞。CVSS 评分 5.0，危害等级为中危。'
published = "2001-01-09T05:00:00.000"
remediation = "建议升级至 IBM Net.Data 7.1.3 或更高版本（含修复补丁），或通过 WebSphere 管理控制台禁用 db2www/document.d2w CGI 程序。若无法升级，可在 Web 服务器（Apache/IIS）配置中添加访问控制规则拦截对 /cgi-bin/db2www/ 的请求，或部署 WAF 规则过滤触发路径泄露的异常命令参数。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "IBM Net.Data 7.0 物理路径信息泄露漏洞"
updated = "2026-06-16T21:53:10.103"

