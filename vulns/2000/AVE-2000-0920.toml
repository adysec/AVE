[basic]
description = "互联网信息服务（IIS）4.0 和 5.0 存在文件权限规范化漏洞，该漏洞源于服务器在处理文件路径时未能正确应用权限验证规则。攻击者无需认证即可向目标IIS服务器发送特制的文件请求，通过利用不同路径表示方式（如相对路径、绝对路径和符号链接）绕过正常的权限检查机制，从而访问原本受限制的文件资源。该漏洞影响广泛，支持IIS 4.0和5.0的Web服务器，其中关键配置文件、应用程序数据和敏感系统文件容易受到威胁。攻击者通过构造特殊的HTTP请求或文件操作，直接获取或修改服务器上的机密文件，窃取网站配置信息和用户数据。漏洞CVSS评分6.4，表明其安全性等级为中等级，需立即修复以确保Web应用的安全性和可用性。微软已在后续版本中修复了该漏洞，建议用户升级到支持微软安全更新的IIS版本或应用最新的安全补丁。"
published = "2000-10-20T04:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS00-057 发布的补丁，IIS 4.0 用户从 https://www.microsoft.com/download/details.aspx?FamilyId=344BFA19-F565-410E-8A9A-8BCBF3AAAABD 下载，IIS 5.0 用户从 https://www.microsoft.com/download/details.aspx?FamilyId=4BF55FCC-F417-41D4-8E91-AE0832A0BC8E 下载。安装前请先备份 IIS 配置文件和网站数据。安装后重启 IIS 服务使补丁生效，并通过 KB 文章 Q269862（https://support.microsoft.com/default.aspx?scid=kb;en-us;269862）验证补丁是否已正确应用。同时检查所有虚拟目录配置，确保 Web 文件夹结构不直接镜像服务器物理文件系统路径，以降低被利用的风险。"
score = 6.4
severity = "MEDIUM"
sources = ["avd"]
title = "微软 IIS 文件权限绕过漏洞"
updated = "2026-06-16T21:52:26Z"

