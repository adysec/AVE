[basic]
description = "ntop 在 Web 模式下存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向目标 ntop Web 服务发送特制的 HTTP 请求触发缓冲区溢出，导致任意代码执行。该漏洞影响 ntop 1.2 a7-9 及 1.3.1 版本，CVSS 评分 10.0，危害等级严重。攻击者利用该漏洞可完全控制目标系统，获取系统最高权限。目前已有公开的远程缓冲区溢出利用代码，攻击门槛较低。"
published = "2000-10-20T04:00:00.000"
remediation = "升级 ntop 至 1.3.2 或更高版本，该版本修复了 Web 模式下的缓冲区溢出漏洞。FreeBSD 用户应安装 FreeBSD-SA-00:36 安全公告中提供的补丁；Debian 用户应更新至 2000-08-30 发布的修复版本。如无法立即升级，可在防火墙上限制对 ntop Web 管理端口（默认 3000/TCP）的访问，仅允许受信任 IP 连接。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Luca Deri ntop Web模式远程缓冲区溢出漏洞"
updated = "2026-06-16T21:52:18.627"

