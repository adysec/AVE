[basic]
description = "Spring Cloud Config Server 存在目录遍历漏洞，攻击者可通过构造特殊的 URL 路径向服务端发送恶意请求，利用 `spring-cloud-config-server` 模块的缺陷绕过路径限制，从而读取服务器上的任意配置文件。该漏洞影响 2.1.x（低于 2.1.2）、2.0.x（低于 2.0.4）、1.4.x（低于 1.4.6）及更早不受支持的版本。攻击者无需身份认证，仅需诱使目标用户访问特制链接即可触发，导致敏感配置信息泄露，CVSS 评分 6.5，危害等级为中等。"
published = "2019-05-06T16:29:01.567"
remediation = "将 Spring Cloud Config Server 升级至 2.1.2、2.0.4 或 1.4.6 及更高版本，以修复目录遍历漏洞。升级方式为修改 pom.xml 中 spring-cloud-config-server 的版本号后重新构建部署。如暂时无法升级，可暂时禁用 Config Server 的 git/svn 后端，或通过反向代理限制对 /application/ 路径的访问，并监控异常请求日志。"
score = 6.5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Spring Cloud Config Server 目录遍历漏洞"
updated = "2026-06-17T02:35:36.867"

