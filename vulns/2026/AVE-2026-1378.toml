[basic]
description = "Open WebUI 的 DELETE /api/v1/chats/{id} 接口存在权限校验缺失漏洞（CWE-862）。该接口在处理删除请求时，会先取消聊天中正在运行的任务（如模型响应生成、标题生成或标签生成），随后才检查调用者是否拥有删除该聊天的权限。因此，任何持有默认 user 角色的已认证用户，只要获知其他用户的聊天 ID，即可通过发送特制的 DELETE 请求中止该用户的正在进行的生成任务。受影响版本为 0.9.6 至 0.10.2。虽然删除操作本身会被拒绝，且不会删除、修改或泄露任何聊天数据，但攻击者可持续中断受害者的生成任务，影响服务的可用性。该漏洞已在 0.11.0 版本中修复。"
published = "2026-08-04T20:16:55Z"
remediation = "建议将 Open WebUI 升级至 0.11.0 或更高版本，该版本已修复 `DELETE /api/v1/chats/{id}` 端点未授权即可取消任务的问题。如暂时无法升级，可在反向代理层限制或监控对 `/api/v1/chats/{id}` 的 DELETE 请求，并禁用不必要的聊天共享功能以减少 chat_id 泄露面，从而降低攻击者可利用的有效目标数量。"
score = 3.1
severity = "LOW"
sources = ["ghsa"]
title = "Open WebUI 认证绕过可中断其他用户对话生成漏洞"
updated = "2026-08-05T20:17:16Z"

