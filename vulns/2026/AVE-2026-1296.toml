[basic]
description = "tags.<value>Angular SSR 中，@angular/platform-server 的 DOM 模拟依赖 domino 在对 fallback raw-content 元素（<iframe>、<noembed>、<noframes>、<noscript>）进行序列化时，未对动态绑定文本中的闭合标签进行转义。攻击者可将包含闭合标签的用户可控数据注入模板绑定，导致浏览器解析时提前关闭元素并执行注入脚本，造成同源跨站脚本攻击。该漏洞影响使用 Angular SSR 且在这些元素内绑定用户控制数据的应用，攻击者无需身份认证即可利用，危害包括会话劫持、凭据窃取及代表用户执行未授权操作。修复版本为 20.3.27、21.2.19 和 22.0.7。"
published = "2026-08-03T17:16:45Z"
remediation = "升级 @angular/platform-server 至 22.0.7、21.2.19 或 20.3.27 版本，具体选择对应所使用的 Angular 主版本。临时缓解措施：在 angular.json 中设置 optimization.styles.inlineCritical 为 false 以禁用关键 CSS 内联，防止 domino 重新解析 HTML；避免在 &lt;iframe&gt;、&lt;noembed&gt;、&lt;noframes&gt;、&lt;noscript&gt; 等回退原始内容元素中通过模板绑定注入用户可控数据，并对所有输入进行转义以剥离 HTML 闭合标签。"
score = 8.6
severity = "HIGH"
sources = ["ghsa"]
title = "Angular 服务器端渲染 跨站脚本攻击漏洞"
updated = "2026-08-03T21:16:41Z"

