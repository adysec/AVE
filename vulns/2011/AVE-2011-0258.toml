[basic]
description = "Opera 浏览器 11.10 及更早版本存在输入验证漏洞（CWE-20），未经身份认证的远程攻击者可通过第三方应用程序触发该漏洞，劫持用户的搜索查询和浏览器自定义设置。该漏洞影响运行 Opera 11.10 以下版本的用户，攻击条件为攻击者能够在目标系统上执行或控制第三方应用程序，并通过 Opera 的应用程序接口或扩展机制向浏览器发送特制请求，从而在用户不知情的情况下篡改搜索内容和个性化配置，危害用户隐私和浏览安全。"
published = "2011-07-01T10:55:03Z"
remediation = "将 Opera 浏览器升级至 11.10 或更高版本，该版本已修复输入验证缺陷。如暂无法升级，应限制第三方应用程序对 Opera 搜索栏及自定义设置的访问权限，并禁用不必要的浏览器扩展以减少攻击面。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera 浏览器 输入验证不当漏洞"
updated = "2026-06-16T23:31:41Z"

