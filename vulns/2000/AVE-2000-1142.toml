[basic]
description = "Microsoft Windows NT系统中存在安全漏洞，攻击者可通过建立空会话连接并调用LsaQueryInformationPolicy策略函数获取目标域的SID标识，然后利用该SID进行用户枚举操作。该漏洞导致攻击者能够远程获取整个域中的所有用户信息，包括用户名和SID，严重威胁用户隐私安全。该漏洞影响所有支持网络登录的Windows NT版本，攻击者无需任何权限即可远程执行此操作，且攻击过程相对简单，直接攻击者可迅速掌握目标域的完整用户列表。该漏洞因其影响范围广、易于利用且可能为后续攻击提供关键信息而被评定为中等风险。该漏洞是Windows NT系统中一个典型的身份验证绕过漏洞，攻击者可通过合法的API函数获取敏感身份信息，进而为进一步攻击奠定基础。"
published = "2001-08-31T04:00:00Z"
remediation = '建议升级至 Windows 2000 SP4 或更高版本（Windows NT 已停止支持）。若必须保留 NT，请在注册表 HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Lsa 中将 RestrictAnonymous 设为 1（仅允许显式匿名访问）或 2（完全禁止匿名访问），并通过防火墙封锁 139/445 端口防止空会话连接。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows NT 用户枚举漏洞"
updated = "2026-06-16T21:53:21Z"

