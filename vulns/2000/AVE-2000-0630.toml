[basic]
description = "Kerberos 4 KDC 程序中的 process_v4 函数在处理 localrealm 变量时存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向 KDC 服务发送特制的请求触发该漏洞，导致目标系统拒绝服务。该漏洞影响使用 Kerberos 4 协议认证的系统，CVSS 评分 5.0，危害等级中等。建议升级至已修复版本或禁用 Kerberos 4 协议支持。"
published = "2000-06-09T04:00:00Z"
remediation = "建议立即升级 MIT Kerberos 至 krb5-1.2 及以上版本，或应用 MIT 官方发布的 krb5-1.0.x/krb5-1.1.1 补丁（参见 http://web.mit.edu/kerberos/www/advisories/krb4kdc.txt）。对于 KTH-krb4 用户，升级至 0.10 及以上版本。如无法立即打补丁，可在网络层面限制对 KDC 端口（TCP/UDP 88）的访问，仅允许可信客户端连接作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "MIT Kerberos 4 KDC 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:51:58Z"

