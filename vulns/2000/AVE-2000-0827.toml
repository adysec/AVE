[basic]
description = 'CGIForum 1.0 中的 cgiforum.pl 脚本存在目录遍历漏洞。远程攻击者无需身份认证，可通过在 "thesection" 参数中注入 ".." 路径遍历序列，构造包含路径穿越字符的 HTTP 请求，从而读取服务器上的任意敏感文件。该漏洞影响所有使用 CGIForum 1.0 搭建的论坛站点，攻击者可借此获取服务器上的配置文件、源代码等敏感信息，造成信息泄露。'
published = "2001-01-09T05:00:00Z"
remediation = "立即删除或禁用 cgiforum.pl 脚本，该软件已停止维护且无官方补丁。如需继续使用，应在 Web 服务器层（如 Apache 的 mod_security 或 Nginx 的 rewrite 规则）拦截包含 `../` 的请求参数，并对 `thesection` 参数进行白名单验证，禁止其包含路径遍历字符。建议迁移至现代论坛系统。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Markus Triska CGIForum 目录遍历漏洞"
updated = "2026-06-16T21:53:18Z"

