[basic]
description = "Umbraco CMS 7.4.0 之前版本的 FeedProxy.aspx.cs 页面中 Page_Load 函数存在服务端请求伪造（SSRF）漏洞。远程攻击者可通过向 url 参数传入特制的恶意 URL，诱使服务器端发起未授权的内部请求，从而访问内网资源或执行端口扫描。攻击者需诱导用户访问恶意链接，无需身份认证即可利用。该漏洞影响 Umbraco CMS 7.4.0 以下所有版本，CVSS 评分 8.2，危害等级高。官方已在 7.4.0 版本中通过提交 924a016 修复此漏洞。"
published = "2017-03-03T16:59:00Z"
remediation = "立即升级 Umbraco CMS 至 7.4.0 或更高版本，该版本已修复 FeedProxy.aspx.cs 中 url 参数未做白名单校验导致的 SSRF 漏洞。如无法升级，可在 Web 应用防火墙 (WAF) 层面拦截对 /umbraco/dashboard/FeedProxy.aspx 的异常外联请求，或删除该文件以消除攻击面。"
score = 8.2
severity = "HIGH"
sources = ["nuclei"]
title = "Umbraco CMS 服务端请求伪造漏洞"
updated = "2026-06-17T00:35:18Z"

