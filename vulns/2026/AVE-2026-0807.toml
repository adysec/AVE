[basic]
description = "hashi-vault-js 库因未对标识符进行 URI 编码，导致路径遍历和查询参数注入漏洞。Vault.js 中所有标识符（名称、用户名、组、角色、版本等）直接拼接进 HTTP URL 而未调用 encodeURIComponent。攻击者可传入 `../../sys/seal` 作为密钥名实现路径遍历，访问管理接口；或传入 `1&list=true` 作为版本值注入额外查询参数。当应用将不可信用户输入作为 Vault 标识符传入库函数时，未经身份认证的远程攻击者可重定向请求至非预期端点（含 sys/ 管理路径）或篡改查询逻辑，在应用使用的 Vault 令牌权限下执行操作。影响版本为 0.5.2 之前，建议升级至 0.5.2 或手动对输入进行 encodeURIComponent 编码缓解。"
published = "2026-07-31T18:17:17Z"
remediation = "建议立即升级 hashi-vault-js 到 0.5.2 或更高版本（npm install hashi-vault-js@latest）。若暂时无法升级，必须在传入库函数前对所有用户输入（如 secret name、version、username 等）使用 encodeURIComponent() 进行严格编码，并增加输入校验禁止包含 ../、&、= 等特殊字符。"
score = 8.7
severity = "HIGH"
sources = ["ghsa"]
title = "Kyndryl hashi-vault-js 路径遍历与查询参数注入漏洞"
updated = "2026-07-31T20:16:51Z"

