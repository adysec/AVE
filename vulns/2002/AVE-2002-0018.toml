[basic]
description = "Squid 2.4.STABLE6 之前版本存在多个缓冲区溢出漏洞，远程未认证攻击者可通过三种攻击向量触发：(1) MSNT 认证助手在使用 denyusers 或 allowusers 文件时；(2) Gopher 客户端处理；(3) FTP 服务器目录列表解析器生成 HTML 输出时。成功利用可导致服务拒绝（进程崩溃）甚至远程任意代码执行，影响 Squid 2.4.STABLE6 之前所有版本，CVSS 7.5 高危，攻击无需认证且可远程利用。官方已在 2.4.STABLE6 版本修复，建议升级修复。"
published = "2002-07-26T04:00:00Z"
remediation = "tags.<value>建议立即升级 Squid 到 2.4.STABLE6 或更高版本（可从官网 http://www.squid-cache.org/ 下载）。若暂时无法升级，可通过以下配置缓解：1) 禁用 MSNT 认证助手（注释掉 squid.conf 中 auth_param ntlm program 相关行）；2) 禁用 Gopher 支持（在 squid.conf 中设置 gopher_enabled off）；3) 禁用 FTP 目录列表的 HTML 输出（设置 ftp_list_width 0 或注释 ftp 相关配置）。同时在防火墙层面限制仅信任 IP 访问 Squid 代理端口（默认 3128）。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Squid 代理服务器缓冲区溢出漏洞"
updated = "2026-06-16T21:57:59Z"

