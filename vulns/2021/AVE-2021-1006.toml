[basic]
description = "OpenPLC ScadaBR 存在任意文件上传漏洞，攻击者可在通过身份认证后，利用 `view_edit.shtm` 页面上传并执行任意 JSP 文件，从而在目标服务器上获得远程代码执行权限。该漏洞影响 Linux 平台 0.9.1 及之前版本、Windows 平台 1.12.4 及之前版本，攻击者无需额外交互，仅需通过网络即可完成利用，CVSS 评分 8.8，危害等级高。攻击成功后，攻击者可完全控制受影响系统，窃取数据或进一步横向移动。"
published = "2021-06-11T12:15:12Z"
remediation = "建议立即将 ScadaBR 升级至最新安全版本（Linux 版本应高于 0.9.1，Windows 版本应高于 1.12.4）。在无法立即升级的情况下，应限制 view_edit.shtm 接口的访问权限，并禁用或严格审计具有上传权限的低权限用户账号，防止攻击者利用认证漏洞上传 JSP 恶意文件。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "OpenPLC ScadaBR 任意文件上传漏洞"
updated = "2026-06-17T03:43:49Z"

