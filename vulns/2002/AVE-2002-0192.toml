[basic]
description = 'Apple Mac OS 上的 Internet Explorer 3/4/5 版本存在本地应用脚本调用漏洞（Local Applescript Invocation）。该漏洞源于 IE 浏览器未对 HTML 中的 file:// 协议 URL 进行充分的安全检查，远程攻击者可构造包含本地文件路径的恶意网页或 HTML 邮件，利用 `<META>` 标签中的 HTTP-EQUIV refresh 机制自动重定向至本地文件系统，从而在用户不知情的情况下执行本地 AppleScript 脚本或系统程序。攻击者需预先知道目标用户的硬盘卷名及文件路径（如 "Macintosh HD"），即可通过 file:// URL 调用 Mac OS 8/9 系统中 "Speakable Items" 等本地自动化功能，实现任意程序执行。该漏洞影响 Mac OS 8 和 9 系统上的 IE 5.1 及更早版本，Mac OS X 不受影响。CVSS 评分 7.5，危害等级为高。'
published = "2002-04-22T04:00:00Z"
remediation = '立即停止使用 Internet Explorer 5.1 for Macintosh，该产品已被微软永久终止支持，不再提供安全补丁。升级至 macOS 平台并使用 Safari、Firefox 或 Chrome 等现代浏览器替代。若仍在运行 Mac OS 8/9，需在系统偏好设置中禁用"语音控制"（Speakable Items）功能，或通过 Sherlock/控制面板卸载该组件，以消除攻击者通过 file:// 协议远程触发 AppleScript 执行的风险。同时在防火墙或网络层阻止包含 file:// URI 的 HTML 邮件和网页内容。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Apple Mac OS Internet Explorer 本地脚本执行漏洞"
updated = "2026-06-16T21:56:54Z"

