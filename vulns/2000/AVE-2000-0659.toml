[basic]
description = "QSSL Voyager 2.0 1B Web 服务器（包含在 QNX 4.05 演示盘中）存在目录遍历/信息泄露漏洞。由于服务器将敏感的 Web 客户端信息存储在 Web 文档根目录下的 `.photon` 目录中，且缺乏有效的访问控制限制，远程攻击者无需身份验证，通过直接请求该特定目录即可获取敏感信息。该漏洞影响使用 Voyager 2.0 1B 版本的 QNX 4.05 系统，攻击者可利用此缺陷获取服务器内部敏感数据，造成信息泄露风险。"
published = "2000-12-19T05:00:00.000"
remediation = "建议管理员立即在 Web 文档根目录下删除 .photon 目录，或在 Web 服务器配置中设置访问控制规则，禁止外部远程访问所有以点（.）开头的隐藏目录和文件，以防止敏感客户端信息泄露。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "QSSL Voyager 2.01B 目录信息泄露漏洞"
updated = "2026-06-16T21:52:43.850"

