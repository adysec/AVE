[basic]
description = "tags.<value>SmartMail Server 1.0 Beta 10 在 SMTP 和 POP3 服务处理用户输入时存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标服务器的 TCP 25 端口（SMTP）或 TCP 110 端口（POP3）发送超长特制请求触发溢出，导致服务崩溃并造成拒绝服务。该漏洞攻击复杂度低，无需交互即可利用，影响所有运行受影响版本的系统。攻击者成功利用后将导致邮件服务中断，但不影响系统机密性和完整性。"
published = "2002-12-31T05:00:00Z"
remediation = "SmartMail Server 1.0 Beta 10 已停止维护且存在缓冲区溢出漏洞。建议立即停止使用该版本，迁移至经过安全加固的现代邮件服务器软件（如 Microsoft Exchange、Postfix、hMailServer 或 Microsoft IIS SMTP 服务）。如短期内无法完成迁移，应在边界防火墙和入侵防御系统（IPS）上对 TCP 25 和 110 端口的入站请求实施严格的大小限制，将单次请求有效载荷限制在 1024 字节以内，并启用会话超时与异常断开机制，防止攻击者发送超长数据包导致服务崩溃。同时，建议在操作系统层面启用 DEP（数据执行预防）和 ASLR（地址空间布局随机化）等缓解技术。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "SmartMail Server 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T22:00:21Z"

