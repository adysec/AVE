[info]
author = "ave"
description = "验证 Apple Safari 6.0 之前版本的 WebKit file:// URL 沙盒绕过漏洞，攻击者可通过构造恶意 file:// 链接读取目标系统任意本地文件"
id = "POC-AVE-2012-0373"
name = "CVE-2012-3697 PoC"
severity = "high"
tags = ["ave-2012-0373"]
vuln_id = [
    "CVE-2012-3697",
    "AVE-2012-0373",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[poc.requests.headers]
User-Agent = "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_7_5) AppleWebKit/534.57.2 (KHTML, like Gecko) Version/5.1.7 Safari/534.57.2"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Safari/5.1.7"]
