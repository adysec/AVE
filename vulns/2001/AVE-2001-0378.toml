[basic]
description = "Icecast 1.3.9 之前版本及 libshout 1.0.4 之前版本存在缓冲区溢出漏洞，远程未认证攻击者可通过发送特制的恶意数据流触发缓冲区溢出，导致服务拒绝（进程崩溃）乃至远程任意代码执行。该漏洞影响 Icecast 流媒体服务器及 libshout 客户端库的早期版本，CVSS 评分 7.5（高危），攻击向量为网络、攻击复杂度低、无需认证、可导致机密性/完整性/可用性均受影响。攻击者可通过向 Icecast 服务器发送畸形流媒体数据或诱导客户端连接恶意服务器触发漏洞，最终在目标系统上以服务进程权限执行任意代码。官方已在 Icecast 1.3.9 和 libshout 1.0.4 中修复该漏洞，建议升级至修复版本。"
published = "2001-03-12T05:00:00Z"
remediation = "建议立即升级 Icecast 到 1.3.9 或更高版本，并将 libshout 升级到 1.0.4 或更高版本。可从官方站点 icecast.org 下载最新版本并替换原有二进制文件。若暂时无法升级，可在防火墙层面限制 Icecast 服务端口（默认 8000）仅允许受信任 IP 访问，或暂时停用 Icecast 服务作为临时缓解措施。建议同时升级依赖 libshout 的客户端应用至 1.0.4 以上版本。升级后重启服务并验证版本号确认修复生效。务必从官方源下载以防供应链投毒。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Xiph.org Icecast libshout 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:55:51Z"

