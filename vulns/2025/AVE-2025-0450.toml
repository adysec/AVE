[basic]
description = "Google Chrome 141.0.7390.54 之前版本的 Storage 组件存在侧信道信息泄露漏洞，攻击者可通过构造特制的 HTML 页面触发该漏洞，实现对浏览器存储数据的任意读写操作。该漏洞源于存储模块对敏感数据的访问控制不足，导致攻击者能够利用侧信道攻击技术窃取或篡改用户存储信息。攻击无需用户交互且无需认证，仅需诱导用户访问恶意页面即可完成利用。CVSS 评分 6.5，危害等级中危，影响所有使用 Chromium 内核的浏览器。"
published = "2025-11-06T22:15:38Z"
remediation = "建议立即将 Google Chrome 升级至 141.0.7390.54 或更高版本，该版本已修复 Storage 组件中的侧信道信息泄漏漏洞。对于 Fedora 等 Linux 发行版用户，请更新至 141.0.7390.122 及以上版本。使用 Chromium 内核的浏览器（如 Microsoft Edge、Brave 等）也应同步更新至对应修复版本。如无法立即更新，可限制不可信来源的 HTML 页面加载以降低攻击风险。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "谷歌 Google Chrome 存储侧信道信息泄露漏洞"
updated = "2026-06-17T08:29:51Z"

