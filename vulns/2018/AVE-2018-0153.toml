[basic]
description = "DomainMOD 至 4.11.01 版本中存在跨站脚本（XSS）漏洞，位于 assets/add/registrar.php 页面的 notes 字段。具有管理员权限的认证攻击者可通过向该字段注入恶意脚本代码，当其他管理员用户访问受影响页面时脚本自动执行，导致敏感信息泄露或会话劫持。攻击需高权限且需用户交互，CVSS 评分 4.8，危害等级中危。"
published = "2018-11-29T22:29:00Z"
remediation = "升级 DomainMOD 至 v4.12.0 或更高版本，该版本已添加 Sanitize 类对用户输入进行过滤，并增加了 XSS 验证防护。如无法立即升级，可在 Web 应用防火墙（WAF）层面添加规则，对 assets/add/registrar.php 的 notes 参数进行输入过滤和输出编码，阻止未转义的 HTML/JavaScript 提交。"
score = 4.8
severity = "MEDIUM"
sources = ["nuclei"]
title = "DomainMOD 跨站脚本漏洞"
updated = "2026-06-17T01:49:47Z"

