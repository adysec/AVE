[basic]
description = "wwwwais.25.c 存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过发送包含超长 QUERY_STRING 的 HTTP GET 请求触发该漏洞，从而在目标服务器上执行任意命令。该漏洞影响运行 wwwwais.25.c 服务的系统，攻击者无需任何认证即可利用，CVSS 评分为 10，危害等级极高。攻击条件仅为向目标发送构造的超长查询字符串，利用方式简单直接，可导致服务器被完全控制。"
published = "2001-03-26T05:00:00.000"
remediation = "立即删除或禁用 wwwwais 程序（rm -f wwwwais*），该软件无官方补丁且已无人维护。若因业务需要必须保留，须在 Web 服务器（如 Apache）层面限制 QUERY_STRING 长度，例如在 Apache 配置中添加 LimitRequestLine 指令并将值设为 1024 以下，同时通过 WAF 规则拦截超长 QUERY_STRING 的 GET 请求，并替换为其他已维护的 WAIS 查询前端。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "wwwwais 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:54.787"

