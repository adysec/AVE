[basic]
description = "Linux kernel 的 net/packet/af_packet.c 文件中 packet_set_ring() 函数存在双重释放（Double Free）漏洞，本地低权限用户可通过构造特定的系统调用序列触发该漏洞，利用内存管理错误实现本地权限提升或导致系统拒绝服务。该漏洞影响多个 Linux 内核版本，攻击者需具备本地登录权限且需一定用户交互才能成功利用，CVSS 评分 6.6。CISA 已将其列入已知被利用漏洞目录，建议用户升级至已修复该问题的内核版本或应用官方补丁进行防护。"
published = "2022-01-26T14:15:08Z"
remediation = "建议立即将 Linux 内核升级至 5.4.168、5.10.88、5.15.11 或更高版本（含 5.16-rc6），或应用补丁提交 ec6af094ea28f0f2dda1a6a33b14cd57e36a9755 重新编译内核。对于 Ubuntu 20.04 LTS 用户应安装 linux-image 5.4.0-100.113 及以上版本，Debian 用户应升级至 DSA-5096 修复版本。如暂时无法升级内核，可通过 sysctl 限制非特权用户创建 AF_PACKET 套接字，或配置 SELinux/AppArmor 规则限制本地提权攻击面作为临时缓解措施。"
score = 6.6
severity = "MEDIUM"
sources = ["kev"]
title = "Linux kernel 双重释放权限提升漏洞"
updated = "2026-06-17T03:37:27Z"

