[basic]
description = "tags.<value>Kentico CMS 的 staging service（暂存服务）存在不安全的 .NET 反序列化漏洞（CWE-502）。由于系统未能正确校验安全头，攻击者可向该服务发送特制的 HTTP 请求以绕过初始认证，进而反序列化用户可控的 .NET 对象输入，最终在服务器上实现未认证的远程代码执行。该漏洞影响 Kentico 12.0.x（低于 12.0.15）、11.0.x（低于 11.0.48）、10.0.x（低于 10.0.52）及 9.x 系列版本。攻击条件为远程且无需任何认证，攻击者仅需构造携带恶意序列化载荷的请求即可在目标服务器上执行任意代码，危害严重。"
published = "2019-03-27T00:00:00Z"
remediation = "立即将 Kentico CMS 升级至官方修复版本：12.0.15、11.0.48、10.0.52 或更高版本（可通过 https://devnet.kentico.com/download/hotfixes 获取安全热修复补丁），彻底封堵 staging 服务对 .NET 反序列化的认证绕过问题。如暂时无法升级，请采取以下临时缓解措施：1) 在 Web 应用防火墙(WAF)配置规则，拦截请求头或请求体中包含 BinaryFormatter/SoapFormatter 反序列化特征（如 __type 标记）的载荷；2) 限制对 Kentico 管理后台及 staging 服务端点的访问，仅允许可信管理网段 IP，并对公网隐藏该服务；3) 关闭匿名用户的文件上传及附件处理功能，仅允许经过认证的管理员操作；4) 升级后在服务器上排查 IIS 日志及反序列化异常记录，确认是否存在利用痕迹。"
score = 5
severity = "MEDIUM"
sources = ["kev"]
title = "Kentico CMS SQL 注入漏洞"
