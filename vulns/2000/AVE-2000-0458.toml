[basic]
description = "wu-ftpd 2.6.0 及更早版本中的 lreply 函数存在格式化字符串漏洞，该函数未能正确清理不可信格式化字符串参数，导致远程攻击者可通过 SITE EXEC 命令向目标 FTP 服务器发送特制的格式化字符串载荷触发该漏洞。攻击者无需身份认证即可利用此漏洞实现远程代码执行，获取服务器的完全控制权。该漏洞影响所有运行 wu-ftpd 2.6.0 及之前版本的系统，CVSS 评分 10.0，危害等级严重。目前已存在公开的利用代码，通过构造包含格式化字符串的 SITE EXEC 参数即可触发栈覆盖，实现任意代码执行。"
published = "2000-07-07T04:00:00Z"
remediation = "立即升级 wu-ftpd 至 2.6.1 或更高版本，该版本修复了 lreply 函数中格式字符串处理不当的问题。如无法升级，在 ftpaccess 配置文件中禁用 SITE EXEC 命令（添加 `deny-uid %siteexec%` 规则），并在防火墙层面限制对 FTP 21 端口的访问来源。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "WU-FTPD wu-ftpd 远程格式字符串漏洞"
updated = "2026-06-16T21:52:01Z"

