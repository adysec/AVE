[basic]
description = "Quest NetVault Backup 的 NVBURASDevice 组件在处理 JSON-RPC 消息时存在 SQL 注入漏洞。由于系统未能对用户提供的字符串进行适当验证就直接将其用于构造 SQL 查询，攻击者可通过发送特制的 JSON-RPC 请求注入恶意 SQL 代码，进而在 NETWORK SERVICE 权限上下文下执行任意代码。该漏洞的认证机制可被绕过，使得未经身份验证的远程攻击者也能成功利用。受影响版本为 Quest NetVault Backup 的相关版本，攻击者只需能够通过网络访问目标系统的 JSON-RPC 接口即可实施攻击，无需用户交互，利用难度较低。"
published = "2026-06-25T00:17:48Z"
remediation = "建议立即升级 Quest NetVault Backup 至 14.0.2 或更高版本（当前最新为 14.1.1），升级前请查阅 Quest 官方发行说明并备份配置数据。如无法立即升级，请在防火墙或网络边界限制对 NetVault Backup 服务器 NVBURASDevice JSON-RPC 端口的远程访问，仅允许可信管理 IP 连接，以降低 SQL 注入远程代码执行风险。"
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "Quest NetVault Backup SQL注入远程代码执行漏洞"
updated = "2026-06-26T02:04:23Z"

