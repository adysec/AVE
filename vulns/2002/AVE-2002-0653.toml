[basic]
description = "Working Resources 公司的 BadBlue Personal Edition 1.7.3 存在跨站脚本（XSS）漏洞，其 cleanSearchString() 函数未能对用户输入进行充分过滤与净化。未经身份认证的远程攻击者可通过向目标系统发送包含恶意脚本的特制请求，利用该漏洞在浏览该页面的其他用户浏览器中执行任意脚本代码，从而窃取用户会话 Cookie、敏感页面信息或实施进一步的攻击行为。该漏洞影响 BadBlue Personal Edition 1.7.3 版本，CVSS 评分为 4.3。"
published = "2002-12-31T05:00:00.000"
remediation = """升级 BadBlue Personal Edition 至最新可用版本，或安装 Working Resources 发布的安全补丁。若厂商已停止支持，应修改 EXT.DLL 中 cleanSearchString() 函数的实现，对用户输入进行 HTML 实体编码（将 <、>、"、'、& 等字符转义为对应实体），并在服务器端对搜索参数进行输入验证与过滤。如无法立即修复，可临时禁用 BadBlue Web 管理界面或在前端添加 CSP 响应头限制脚本执行来源，以缓解跨站脚本攻击风险。"""
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Working Resources BadBlue 跨站脚本漏洞"
