[basic]
description = "Bugzilla 的 buglist.cgi 脚本在处理 bug 列表的 sort order 排序参数时存在 SQL 注入漏洞。受影响版本包括 Bugzilla 2.14、2.14.1 及 2.16 至 2.16rc2。未经身份认证的远程攻击者可通过构造包含恶意 SQL 语句的 sort order 参数，向目标 Bugzilla 系统的 buglist.cgi 发送特制 HTTP 请求，触发 SQL 注入，进而执行未授权查询或造成拒绝服务。攻击无需预先获取凭据，仅需向目标系统发送携带注入载荷的 Web 请求即可利用该漏洞。"
published = "2002-08-12T04:00:00Z"
remediation = "立即将 Bugzilla 升级至 2.14.2 或 2.16rc2 及以上版本以修复 buglist.cgi 中 sort order 参数的 SQL 注入漏洞。升级前可临时在 Web 服务器层面对 /buglist.cgi 的 sort 参数进行输入过滤，仅允许字母数字字符，拒绝包含 SQL 关键字的请求。同时在数据库层面限制 Bugzilla 服务账户的权限，避免攻击者通过 SQL 注入执行任意查询或造成拒绝服务。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Mozilla Bugzilla SQL注入漏洞"
updated = "2026-06-16T21:58:10Z"

