[basic]
description = 'Computer Associates InoculateIT Agent for Microsoft Exchange Server 存在邮件病毒防护绕过漏洞。该代理在扫描邮件附件时，若 SMTP 邮件头中缺少"From"字段，则无法正确识别附件中的病毒内容，导致病毒防护机制被完全绕过。攻击者作为未经身份认证的远程攻击者，可通过发送缺少发件人字段的特制恶意邮件，携带病毒或恶意代码附件绕过服务器端杀毒软件的检测，从而感染内部用户并传播至整个邮件系统。该漏洞影响 InoculateIT 4.53 与 Microsoft Exchange Server 的集成部署环境，CVSS v2 评分为 7.5，危害等级高，可造成保密性、完整性和可用性的部分损失。'
published = "2000-12-31T05:00:00.000"
remediation = '立即将 InoculateIT Agent for Microsoft Exchange 升级到 Computer Associates（现 Broadcom）发布的修复版本，可联系 Broadcom 技术支持获取适用于 InoculateIT 4.53 的安全补丁包。如短期内无法升级，应在邮件网关层面实施 SMTP 头字段强制校验策略，拒绝或剥离缺少 "From" 字段的入站邮件，同时确保病毒特征库持续更新，并考虑在 Exchange 传输代理层增加额外邮件内容扫描规则作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Computer Associates InoculateIT Exchange 服务器病毒防护绕过漏洞"
updated = "2026-06-16T21:53:27.297"

