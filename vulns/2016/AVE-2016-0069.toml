[basic]
description = "ZOHO WebNMS Framework 5.2及5.2 SP1版本的文件下载功能存在目录遍历漏洞。远程攻击者无需身份认证即可通过向servlets/FetchFile接口的fileName参数传递../序列，绕过路径限制读取服务器上的任意文件，包括配置文件、密码文件等敏感信息。该漏洞源于程序未对用户输入的文件名进行充分的路径过滤和校验，攻击者利用难度低，无需特殊权限即可触发。CVSS评分7.5，危害等级高。"
published = "2017-01-23T21:59:02Z"
remediation = "升级 ZOHO WebNMS Framework 至 5.2 SP2 或更高版本，官方已在后续版本中修复了 FetchFile servlet 的路径遍历问题。如无法立即升级，可在 Web 服务器或反向代理层面限制对 `/servlets/FetchFile` 路径的访问，仅允许可信 IP 范围访问 WebNMS 管理界面，并禁用 fileName 参数中的 `../` 序列。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "ZOHO WebNMS Framework 目录遍历漏洞"
updated = "2026-06-17T00:51:26Z"

