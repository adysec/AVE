[basic]
description = "WordPress W3 Total Cache 插件在 0.9.4 版本之前的 pub/sns.php 文件存在未经授权的文件读取漏洞。远程攻击者可通过向目标站点发送包含恶意 SubscribeURL 字段的 JSON 格式 SubscriptionConfirmation 请求，利用该缺陷读取服务器上的任意敏感文件。该漏洞影响所有运行受影响版本插件的 WordPress 网站，攻击者无需身份认证即可在低复杂度条件下远程触发，可能导致 wp-config.php、.env 等包含数据库凭据或密钥的敏感文件泄露，进而引发更严重的安全事件。"
published = "2019-04-01T20:29:00Z"
remediation = "立即将 WordPress 的 W3 Total Cache 插件升级到 0.9.4 或更高版本，以修复 pub/sns.php 中的文件读取漏洞。具体操作：登录 WordPress 后台，进入「插件」页面，找到 W3 Total Cache，点击「更新」；若后台更新失败，可访问 WordPress 插件目录手动下载最新版本覆盖安装。如短期内无法升级，建议暂时停用该插件，或在 Web 服务器配置中禁止外部访问 wp-content/plugins/w3-total-cache/pub/sns.php 文件，例如在 Nginx 配置中添加 location 块返回 403 拒绝访问。升级完成后请清除插件缓存并检查网站功能是否正常。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress W3 Total Cache插件 文件读取致信息泄漏漏洞"
updated = "2026-06-17T02:39:33Z"

