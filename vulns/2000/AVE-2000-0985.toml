[basic]
description = "EFTP 2.0.4.281 版本存在缓冲区溢出漏洞。远程攻击者无需身份认证即可向 EFTP 服务器发送不含换行符的字符串后断开连接，触发服务端缓冲区溢出，导致拒绝服务。该漏洞影响运行 EFTP 2.0.4.281 版本的系统，攻击者仅需建立 TCP 连接并向服务端发送畸形数据即可利用，无需复杂交互或权限，攻击成本低。成功利用可使 EFTP 服务崩溃或不可用，影响服务的可用性但不涉及数据泄露或权限提升。建议升级到修复该漏洞的安全版本。"
published = "2000-11-14T05:00:00.000"
remediation = "升级 EFTP 服务器至 2.0.4.281 以上版本（建议升级至最新稳定版），或联系厂商 Khamil Landross/Zack Jones 获取官方补丁。临时缓解措施：在防火墙层面限制 EFTP 服务端口（默认 21 端口）仅允许可信 IP 访问，或部署应用层防火墙过滤异常 FTP 命令（如无换行符的异常字符串），或暂时停用 EFTP 服务改用其他成熟 FTP 服务器（如 vsftpd、FileZilla Server）。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Khamil Landross And Zack Jones EFTP 2.0.4.281 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:38.617"

