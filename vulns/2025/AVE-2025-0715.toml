[basic]
description = "Windows 数字媒体组件存在堆缓冲区溢出漏洞，本地攻击者可通过构造恶意媒体文件或特制输入，利用数字媒体处理逻辑中的边界检查缺陷触发堆溢出，进而实现权限提升至 SYSTEM 级别。该漏洞影响 Windows 10/11 及对应 Server 版本，CVSS 评分 6.6（中危），攻击向量为物理接触（AV:P），需低权限用户交互，无需用户干预即可利用。成功利用可导致机密性、完整性、可用性全面受损。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:43Z"
remediation = "请立即安装 Windows 安全更新程序 KB5050061（适用于所有受影响 Windows 版本，包括 Windows 10 1507-22H2、Windows 11 22H2-24H2 以及 Windows Server 2008-2025），此更新修复数字媒体组件中的权限提升漏洞。确保更新到 2025 年最新的累积更新包。如无法立即更新，可临时禁用不必要的数字媒体服务并限制低权限用户对相关注册表项的访问权限，以降低攻击风险。"
score = 6.6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 数字媒体 特权提升漏洞"
updated = "2026-06-17T08:42:54Z"

