[basic]
description = "Windows Core Messaging 组件存在堆缓冲区溢出漏洞，该漏洞源于对内存对象处理不当。已获得低权限的本地攻击者可通过精心构造的应用程序调用受影响组件接口触发堆缓冲区溢出，从而将权限提升至 SYSTEM 级别，实现完全控制目标系统。该漏洞攻击复杂度较高，但无需用户交互即可利用。Microsoft 已在 2025 年 2 月安全更新（5051974）中修复此漏洞，影响多个 Windows 版本。"
published = "2025-02-11T18:15:30Z"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新。Windows 10 22H2/21H2 升级至 OS Build 19045.5487/19044.5487（KB5051974）；Windows 11 22H2/23H2 升级至 OS Build 22621.4890/22631.4890；Windows 11 24H2 升级至 OS Build 26100.3194；Windows Server 2025 升级至 OS Build 26100.3194。可通过 Windows Update 自动更新或访问 Microsoft 更新目录手动下载。该漏洞需本地低权限用户交互且攻击复杂度高，如无法立即打补丁，建议限制非授权用户对系统的本地访问权限作为临时缓解措施。"
score = 7
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Core Messaging 特权提升漏洞"
updated = "2026-06-17T08:42:43Z"

