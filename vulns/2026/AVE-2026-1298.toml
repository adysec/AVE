[basic]
description = "标签之间。<value>ATEN Unizon 的 uploadSSL 方法存在路径遍历漏洞，由于未对用户提交的路径参数进行充分验证，远程攻击者在通过身份认证后可构造恶意路径遍历至任意目录，删除服务器上的敏感文件或系统关键文件，从而造成数据丢失或拒绝服务。该漏洞影响 ATEN Unizon 的多个版本，CVSS 评分为 6.5，危害等级为中等。攻击者仅需网络访问权限即可利用此漏洞，且无需用户交互。"
published = "2026-06-24T22:16:50Z"
remediation = "建议立即升级 ATEN Unizon 固件至 V2.7.264.001 或更高版本以修复 uploadSSL 路径遍历漏洞。升级前请备份系统配置并下载对应型号固件包，通过 Web 管理界面上传固件完成升级。如暂时无法升级，建议临时禁用不需要的 SSL 证书上传功能或限制 /rest/system/ssl 端点的访问权限，仅允许受信任的管理员 IP 地址访问。"
score = 6.5
severity = "MEDIUM"
sources = ["zdi"]
title = "ATEN Unizon uploadSSL路径遍历任意文件删除漏洞"
updated = "2026-06-27T18:59:54Z"

