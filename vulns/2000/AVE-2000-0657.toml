[basic]
description = 'QSSL Voyager 2.0 1B Web 服务器（QNX 405 演示磁盘中包含的 Voyager 2.01B 版本）存在目录遍历漏洞。远程未经身份验证的攻击者可通过构造包含 ".." (点点) 序列的 HTTP 请求路径，绕过 Web 根目录限制，遍历服务器文件系统并读取任意文件内容。该漏洞源于 Web 服务器对用户提交的路径参数缺乏规范化校验，未对 ".." 序列进行过滤或规范化处理。攻击者无需身份认证即可远程利用，仅需发送包含目录遍历序列的 HTTP GET 请求即可读取服务器上任意可读文件（如系统配置文件、源代码、敏感数据等），CVSS 评分 5.0 (MEDIUM)，影响机密性。QSSL (QSSL Inc.) 已停止对该版本的支持，受影响版本为 Voyager 2.01B (QNX 405 Demo disks 版本)。攻击者可通过构造类似 `GET /../../etc/passwd HTTP/1.0` 的请求实现任意文件读取。'
published = "2000-12-19T05:00:00.000"
remediation = '建议立即升级 QSSL Voyager Web 服务器至 2.01B 之后的修复版本（建议升级至 QNX 4.25 后续补丁版本或迁移至 QNX 6.x 以上版本）。若无法立即升级，请立即删除或禁用 Voyager 演示磁盘中的 Web 服务组件，并在 Web 服务器配置中启用路径规范化检查以阻止 ../ 路径遍历攻击。临时缓解措施：在 Web 服务器前端部署 WAF 规则拦截包含 ../ 或 ..\\ 的请求路径，并在防火墙层面限制 Web 服务端口（默认 80/8080）仅对可信 IP 开放。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "QSSL Voyager 2.0 1B 目录遍历漏洞"
updated = "2026-06-16T21:52:43.710"

