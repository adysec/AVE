[basic]
description = "Windows NT 4.0 的 RAS 管理注册表项默认权限设置不当，本地攻击者可修改该注册表项的值指向恶意 DLL，从而在系统上下文中执行任意命令。该漏洞属于注册表权限类漏洞，影响 Windows NT 4.0 系统，CVSS 评分 10.0，危害等级严重。攻击者需具备本地访问权限，无需用户交互即可利用。"
published = "2001-02-16T05:00:00Z"
remediation = '立即下载并运行 Microsoft 提供的 regacl40.exe 工具（下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=8E7C68EE-98BC-440E-A99D-6A97308FDCB0），该工具会自动将 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\RAS 等注册表项的权限重置为仅 Administrators 和 System 拥有完全控制权。运行命令：regacl40.exe -v。同时确保已安装 Windows NT 4.0 Service Pack 6a，并通过注册表限制远程注册表访问（将 Winreg 项权限设为仅 Administrators 完全控制）。如无法立即打补丁，可卸载 RAS 服务作为临时缓解措施。'
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Microsoft Windows NT 4.0 RAS 管理注册表权限提升漏洞"
updated = "2026-06-16T21:53:33Z"

