[basic]
description = "WebKit 在处理网页中的正则表达式时存在内存破坏漏洞。攻击者可通过向目标系统发送包含特制正则表达式的恶意网页，触发 WebKit 引擎中的内存破坏或堆缓冲区溢出，导致 Safari 浏览器崩溃（拒绝服务）或在某些条件下执行任意代码。该漏洞影响 Safari 4.1.1 及 5.0.1 之前版本（涵盖 Mac OS X 10.4 至 10.6 及 Windows 平台）以及 webkitgtk 1.2.6 之前的版本。攻击者无需身份认证，只需引导用户使用受影响版本的 Safari 浏览器访问恶意网页即可触发漏洞。CVSS 评分 9.3，危害等级严重。"
published = "2010-07-30T20:30:02Z"
remediation = "建议立即将 Safari 升级至 5.0.1 版本（Mac OS X 10.5 至 10.6 及 Windows 平台）或 4.1.1 版本（Mac OS X 10.4），并将 webkitgtk 升级至 1.2.6。如无法立即升级，应避免使用 Safari 访问不受信任的网站，临时改用其他浏览器以降低风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 正则表达式处理内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:19:20Z"

