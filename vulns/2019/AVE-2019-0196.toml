[basic]
description = "Adobe Experience Manager（AEM）6.5、6.4、6.3 及 6.2 版本存在 XML 外部实体注入（XXE）漏洞。该漏洞源于 AEM 在解析 XML 输入时未对外部实体引用进行充分验证，未经身份认证的远程攻击者可构造包含恶意 DTD 或外部实体引用的 XML 请求发送至目标服务器，诱使应用解析并加载本地或远程外部资源，从而导致服务器上的敏感信息泄露，例如读取配置文件、凭据或其他内部数据。该漏洞影响范围涵盖上述所有受影响版本的 AEM 部署实例，攻击者只需通过网络即可发起利用，无需登录凭据或用户交互，利用条件低且影响面广。Adobe 已在后续版本中修复此漏洞，建议受影响用户升级至安全版本。"
published = "2019-10-25T16:15:11Z"
remediation = "建议将 Adobe Experience Manager 升级到 6.5, 6.4, 6.3 或 6.2 的最新安全补丁版本。若无法立即升级，可通过配置 AEM 的 XML 解析器禁用外部实体解析（DTD）来缓解 XXE 攻击风险。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Adobe Experience Manager XML外部实体注入漏洞"
updated = "2026-06-17T02:41:28Z"

