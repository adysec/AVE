[info]
author = "AVE"
description = "检测 Apple Safari WebKit 是否受 UTF-7 跨站脚本漏洞影响，通过构造包含 UTF-7 编码的恶意 HTML 页面，验证目标浏览器是否解析并执行 UTF-7 编码的脚本内容"
id = "POC-AVE-2010-0132"
name = "CVE-2010-1390 PoC"
severity = "medium"
tags = ["cve-2010-1390"]
vuln_id = [
    "CVE-2010-1390",
    "AVE-2010-0132",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cve-2010-1390-poc.html"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["CVE-2010-1390"]
