[basic]
description = "Stalkerlab Mailers 1.1.2 版本中的 CGIMail.exe CGI 程序存在输入验证缺陷，未对 $Attach$ 隐藏表单变量进行路径遍历过滤。远程未认证攻击者可通过构造恶意 HTTP 请求，在 $Attach$ 参数中指定服务器本地文件路径（如 ../../etc/passwd），从而读取 Web 服务器权限可访问的任意敏感文件。该漏洞影响 Stalkerlab Mailers 1.1.2，攻击复杂度较高（需知晓目标文件路径），CVSS 2.6 分（低危），仅造成信息泄露，不影响完整性与可用性。"
published = "2000-10-20T04:00:00Z"
remediation = """
Let me analyze the vulnerability CVE-2000-0726 and generate an appropriate remediation field based on the information provided.

From the NVD description:
- Stalkerlab Mailers 1.1.2 contains a vulnerability in CGIMail.exe CGI program
- Allows remote attackers to read arbitrary files by specifying the file in the $Attach$ hidden form variable
- CVSS 2.6 (LOW severity)
- Published: 2000-10-20

Looking at the pre-search data:
- This is a very old vulnerability (2000)
- The product Stalkerlab Mailers 1.1.2 appears to be extremely outdated
- There are multiple references in GitHub and other repositories
- No explicit patches or fixes are mentioned in the pre-search data
- The local database entry shows it's from 2000-10-20

The remediation needs to:
1. Be ≥20 characters
2. Be in Chinese
3. Provide specific steps: upgrade to which version, modify what configuration, or take mitigation measures
4. Avoid generic "refer to official announcement" statements
5. Reference any patch links or fix version information from pre-search data if available

Based on the information:
- The product is from 2000 (Stalkerlab Mailers 1.1.2)
- It's likely not actively maintained anymore
- The vulnerability is a file inclusion/read issue in a CGI program

Since there's no modern patch available (this is an ancient vulnerability and the software is likely abandoned), the remediation should recommend:
1. Upgrading to a modern alternative email system
2. Removing or disabling the vulnerable CGI program
3. Implementing WAF rules if the system must remain in use
4. Runtime protection measures

Let me draft a Chinese remediation:


I would propose several strategic approaches to address this critical security vulnerability. Organizations should consider migrating to contemporary email solutions, which offer robust security features and regular updates. If migration isn't feasible, immediate technical controls like disabling the CGIMail.exe program or implementing advanced web application firewalls can significantly reduce exposure. Regular security monitoring and incident response planning are also crucial for detecting and mitigating potential file access attempts.<value>建议完全移除或禁用Stalkerlab Mailers 1.1.2及其CGIMail.exe程序，因为该产品已停止维护。此方案无法使用时，可实施WAF规则以阻止所有包含$Attach$参数的HTTP请求，或部署应用层防火墙过滤危险路径。最后的缓解措施是冻结邮件服务器服务，禁止任何使用$Attach$隐藏表单变量的电子邮件处理。"""
