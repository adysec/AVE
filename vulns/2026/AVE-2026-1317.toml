[basic]
description = "AIOHTTP 是一款 Python 异步 HTTP 客户端/服务器框架。在 3.14.3 版本之前，其 C 语言实现的 HTTP 响应解析器在处理畸形分块传输（chunked transfer）响应时存在越界堆读取漏洞。当解析器在构造错误信息过程中，使用 llhttp 的错误位置指针读取缓冲区外的堆内存时，若目标客户端连接到恶意服务器并收到精心构造的畸形响应，将触发越界读操作，导致客户端进程崩溃或拒绝服务。该漏洞影响所有使用 AIOHTTP C 扩展进行 HTTP 请求的客户端应用，攻击者需控制 HTTP 服务器并向客户端发送畸形响应，客户端发起请求即可能触发漏洞。临时缓解方案可设置环境变量 AIOHTTP_NO_EXTENSIONS=1 以切换至不受影响的 Python 解析器。官方已发布 3.14.3 版本修复此问题。"
published = "2026-08-03T21:16:42Z"
remediation = "立即升级 aiohttp 至 3.14.3 或更高版本（pip install --upgrade aiohttp>=3.14.3）。如无法立即升级，可临时设置环境变量 AIOHTTP_NO_EXTENSIONS=1 禁用 C 扩展以改用 Python 解析器作为缓解措施。"
score = 7.1
severity = "HIGH"
sources = ["ghsa"]
title = "aio-libs aiohttp C HTTP响应解析器越界堆读取漏洞"
updated = "2026-08-04T15:16:42Z"

