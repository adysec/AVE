[basic]
description = "标签包裹的内容。<value>glibc 2.1.9x 及更早版本在运行 setuid/setgid 程序时，未能正确清理 RESOLV_HOST_CONF、HOSTALIASES 或 RES_OPTIONS 环境变量。本地攻击者可利用此漏洞，通过设置这些环境变量指向恶意解析配置文件，使特权程序加载攻击者控制的内容，进而读取系统任意文件。该漏洞影响使用旧版 glibc 的 Linux 系统，攻击者需具备本地登录权限，利用过程简单且无需交互，可能导致敏感信息泄露。"
published = "2001-03-26T05:00:00Z"
remediation = "建议立即升级 glibc 至 2.2 或更高版本（如 glibc 2.2.1/2.2.2/2.2.3 等），Red Hat 用户可应用 RHSA-2001:001 安全更新（glibc-2.2.2-10 等版本）。如暂时无法升级，可通过设置 LD_BIND_NOW=1 强制立即绑定符号、或在 setuid 程序入口显式清除 RESOLV_HOST_CONF/HOSTALIASES/RES_OPTIONS 环境变量作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "GNU glibc 本地环境变量信息泄露漏洞"
updated = "2026-06-16T21:53:48Z"

