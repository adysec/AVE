[basic]
description = "Google Chrome 71.0.3578.80 之前版本的 V8 JavaScript 引擎在数组反序列化过程中存在越界写入漏洞。远程攻击者可通过构造特制的 HTML 页面，诱使用户访问后触发该漏洞，导致在沙箱环境下执行任意代码。该漏洞影响所有使用 Chrome 71 之前版本的用户，CVSS 评分 8.8，危害等级高。Google 已在 Chrome 71.0.3578.80 版本中修复此漏洞。"
published = "2018-12-11T16:29:00Z"
remediation = "立即将 Google Chrome 升级至 71.0.3578.80 或更高版本，可通过 Chrome 设置 > 关于 Chrome > 自动检查更新完成。基于 Chromium 的浏览器（如 Microsoft Edge、Opera）也需更新至对应修复版本。Debian/Ubuntu 用户执行 `apt update && apt upgrade chromium` 应用 DSA-4352；Red Hat/CentOS 用户应用 RHSA-2018:3803 更新 chromium 包。Gentoo 用户参照 GLSA 201908-18 升级。该漏洞已被 CISA 列入已知被利用漏洞目录，应优先修复。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome V8 越界写入远程代码执行漏洞"
updated = "2026-06-17T01:45:56Z"

