[basic]
description = "Zoho ManageEngine Desktop Central 10.0.474 之前版本中存在 Java 反序列化远程代码执行漏洞。该漏洞源于 FileStorage 类中的 getChartImage 方法在处理用户提交的序列化数据时未进行充分的安全校验，攻击者可通过 CewolfServlet 或 MDMLogUploaderServlet 接口向目标服务器发送精心构造的恶意序列化对象触发反序列化操作，从而在服务器端执行任意代码。攻击者无需身份认证即可远程利用，CVSS 评分 9.8，危害等级严重。该漏洞影响所有运行 ManageEngine Desktop Central 10.0.474 之前版本的系统，可能导致服务器被完全控制、数据泄露或勒索软件部署等严重后果。"
published = "2020-03-06T17:15:12.383"
remediation = "立即升级 Zoho ManageEngine Desktop Central 至 10.0.474 或更高版本，该版本修复了 FileStorage 类中 getChartImage 方法对不可信数据反序列化的问题。如无法立即升级，可在 Web 服务器层面配置访问控制，限制对 CewolfServlet 和 MDMLogUploaderServlet 的未授权访问，并部署 WAF 规则拦截反序列化攻击载荷。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Zoho ManageEngine Desktop Central 反序列化远程代码执行漏洞"
updated = "2026-06-17T02:47:27.960"

