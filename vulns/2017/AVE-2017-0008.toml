[basic]
description = "Windows 事务管理器（Transaction Manager）的内核模式驱动程序中存在内存破坏漏洞。本地攻击者可通过运行特制的应用程序，利用内核模式驱动对内存对象处理不当的问题，触发缓冲区溢出，从而以 SYSTEM 权限执行任意代码。该漏洞影响 Windows Vista SP2 至 Windows 10 1607 及 Server 2016 等多个版本，CVSS 评分 7.8，危害等级高。攻击者需具备本地系统访问权限并诱使用户运行恶意程序方可利用。Microsoft 已在 MS17-017 安全更新中修复此漏洞。"
published = "2017-03-17T00:59:02Z"
remediation = "立即安装 Microsoft 2017 年 3 月安全更新 MS17-017 (KB4013083)，该更新修复了 Windows 内核模式驱动中的特权提升漏洞。Windows 10 用户可通过 Windows Update 自动获取更新；Windows 7/8.1/Server 等系统可前往 Microsoft 更新目录手动下载安装。由于该漏洞已有公开利用代码，建议优先完成补丁安装，无法立即打补丁时可限制本地用户登录权限作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows 事务管理器本地权限提升漏洞"
updated = "2026-06-17T00:57:04Z"

