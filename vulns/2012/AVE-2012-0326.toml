[basic]
description = "Apple iTunes 10.7 版本之前所采用的 WebKit 渲染引擎存在内存破坏漏洞，远程攻击者可通过诱导用户访问特制恶意网站触发该漏洞，导致应用程序内存损坏并崩溃，进而可能执行任意代码。该漏洞影响使用旧版 iTunes 的 Windows 及 macOS 系统用户，攻击者无需身份认证即可在用户浏览恶意网页内容时实施攻击，造成机密性、完整性和可用性三重损害。Apple 已在 iTunes 10.7 中修复此问题，建议用户及时升级至安全版本。"
published = "2012-09-13T10:30:19Z"
remediation = '立即升级 Apple iTunes 至 10.7 或更高版本，可通过 iTunes 菜单栏"帮助"→"检查更新"自动下载安装，或前往 Apple 官网手动下载安装包。如暂无法升级，建议在防火墙或代理层面过滤恶意网站访问，并避免使用 iTunes 浏览器功能打开不可信链接，临时改用系统自带浏览器访问网页以降低风险。'
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes 远程代码执行漏洞"
updated = "2026-06-16T23:43:39Z"

