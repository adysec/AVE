[basic]
description = "这是一个位于 Adobe Flash Player 软件中的内存破坏漏洞。受影响版本为 10.2.152.26 之前的 Flash Player 版本。攻击者可通过特定手段向受害者系统发送精心构造的数据包触发该漏洞。这种漏洞的原理是 Adobe Flash Player 在处理特定输入数据时未能正确管理内存，导致整数溢出和多种内存破坏情况的产生。因此，攻击者可以利用这些内存损坏问题在远程执行任意代码或导致服务终止。攻击条件包括目标系统安装了受影响版本的 Flash Player以及攻击者能够向目标发送恶意数据包。利用该漏洞可以实现远程代码执行，因此危害等级极高，CVSS 评分达到 9.3，属于严重的网络安全威胁。"
published = "2011-02-10T16:00:32Z"
remediation = "立即升级 Adobe Flash Player 到 10.2.152.26 或更高版本，并确保启用自动更新功能。如需立即缓解，请通过浏览器安全设置禁用 Flash 插件，或在系统策略中禁止 Flash 内容执行。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏漏洞"
updated = "2026-06-16T23:27:38Z"

