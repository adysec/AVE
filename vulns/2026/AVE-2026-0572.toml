[basic]
description = "Python sh 库的 `_uid` 选项在 Linux/Unix 系统上存在权限降级不完整漏洞。当从高权限进程（如 root）通过 `_uid=<低权限用户>` 启动子进程时，虽然子进程的 UID 和主 GID 被正确修改，但辅助组（supplementary groups）未被重置，导致子进程可能继承父进程的 root、docker、disk、shadow 等特权辅助组。本地攻击者利用此漏洞可实现权限提升，访问本应受限的文件和系统资源。该漏洞影响所有使用 sh 库 `_uid` 功能的 Python 应用，建议升级至 2.2.4 及以上版本修复。"
published = "2026-01-01T00:00:00Z"
remediation = "升级 Python `sh` 库至 2.2.4 或更高版本（`pip install --upgrade sh`），该版本已修复 `_uid` 未清除辅助组的问题。如无法立即升级，避免在特权进程中使用 `_uid` 选项作为权限隔离边界，改用容器化或 `sudo -u` 等完整权限降级方案。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Python sh 库 _uid 选项辅助组未清除致权限提升漏洞"
updated = "2026-01-01T00:00:00Z"

