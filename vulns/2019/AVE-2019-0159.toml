[basic]
description = "WordPress 的 Easy WP SMTP 插件存在授权绕过漏洞，该插件用于配置 SMTP 邮件发送功能。在 1.3.9 及更早版本中，由于 admin_init() 函数缺少权限校验，同时输入验证不足，未经身份认证的远程攻击者可以绕过权限检查，直接修改插件的配置设置以及站点上的任意选项。攻击者利用此漏洞可以在目标 WordPress 站点上注入新的管理员账户，从而完全接管网站后台，进而执行任意代码、窃取敏感数据或进一步横向渗透。该漏洞影响范围广泛，任何使用受影响版本 Easy WP SMTP 插件的 WordPress 站点均面临风险，CVSS 评分为 9.8，危害等级为严重。"
published = "2023-06-07T02:15:10.180"
remediation = '将 WordPress 的 Easy WP SMTP 插件升级到 1.3.9.1 或更高版本。升级方式为在 WordPress 管理后台进入"插件"页面，找到 Easy WP SMTP 并点击"更新"，或直接访问 WordPress 插件目录手动上传新版本覆盖安装。升级完成后确认插件版本号不低于 1.3.9.1。如短期内无法升级，可临时禁用该插件以阻止未授权修改站点选项和创建管理员账户的风险。'
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress Easy WP SMTP 插件未授权访问漏洞"
updated = "2026-06-17T02:31:41.160"

