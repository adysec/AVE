[info]
author = "ave"
description = "检测 Adobe Flash Player ActiveX 控件版本是否在受影响范围内（Windows 平台 Flash Player 9.x < 9.0.289.0 或 10.x < 10.1.102.64）。通过检查 Flash10h.ocx 文件版本号判断是否存在 CVE-2010-3637 内存破坏漏洞。"
id = "POC-AVE-2010-0212"
name = "Adobe Flash Player ActiveX Memory Corruption PoC"
severity = "critical"
tags = ["ave-2010-0212"]
vuln_id = [
    "CVE-2010-3637",
    "AVE-2010-0212",
]

[poc]
logic = "any"

[[poc.requests]]
path = 'C:\Windows\System32\Macromed\Flash\Flash10h.ocx'
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["10.1.102.64"]

[[poc.requests]]
path = 'C:\Windows\System32\Macromed\Flash\Flash10h.ocx'
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["9.0.289.0"]

[[poc.requests]]
path = 'C:\Windows\SysWOW64\Macromed\Flash\Flash10h.ocx'
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["10.1.102.64"]

[[poc.requests]]
path = 'C:\Windows\SysWOW64\Macromed\Flash\Flash10h.ocx'
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["9.0.289.0"]
