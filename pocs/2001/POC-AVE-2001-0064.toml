[info]
author = "ave"
description = "验证 glibc 2.1.9x 及更早版本是否在执行 setuid/setgid 程序时，通过 RESOLV_HOST_CONF 环境变量泄露任意文件内容。该漏洞允许本地低权限用户设置 RESOLV_HOST_CONF 指向敏感文件（如 /etc/shadow），当 setuid 程序调用 glibc 解析器时会读取该文件，导致信息泄露。"
id = "POC-AVE-2001-0064"
name = "CVE-2001-0170 PoC - glibc RESOLV_HOST_CONF Environment Variable Info Disclosure"
severity = "low"
tags = ["ave-2001-0064"]
vuln_id = [
    "CVE-2001-0170",
    "AVE-2001-0064",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/host.conf"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "hosts",
    "resolv",
]
