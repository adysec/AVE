[basic]
description = "Xitami 2.5b Web 服务器在安装时默认将 testcgi.exe 程序放置在 cgi-bin 目录下，该程序未进行适当的访问控制，导致远程攻击者无需身份认证即可通过 HTTP 请求直接访问该 CGI 程序，从而获取 Web 服务器的敏感配置信息（如系统路径、环境变量等）。攻击者利用此信息可进一步探测目标系统，为后续攻击提供情报支撑。该漏洞影响 Xitami 2.5b 版本，攻击复杂度低，仅需网络可达即可触发。"
published = "2000-12-31T05:00:00Z"
remediation = "立即删除 Xitami 安装目录下 `cgi-bin` 文件夹中的 `testcgi.exe` 文件，或通过 Web 服务器配置禁止对该文件的访问（如添加 URL 重写规则拒绝 `/cgi-bin/testcgi.exe` 的请求）。由于 Xitami 已停止维护多年，建议迁移至活跃维护的 Web 服务器（如 Apache HTTP Server 或 Nginx）以彻底消除风险。如无法立即迁移，可在防火墙或反向代理层面限制对 `/cgi-bin/` 路径的外部访问。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Xitami Web服务器 testcgi.exe 敏感信息泄露漏洞"
updated = "2026-06-16T21:53:25Z"

