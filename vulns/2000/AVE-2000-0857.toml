[basic]
description = "ISS RealSecure 3.2.1 及 3.2.2 版本存在拒绝服务漏洞，远程攻击者可通过向目标系统发送大量设置了 SYN 标志的分片数据包，导致系统资源耗尽，造成拒绝服务。该漏洞利用方式简单，无需身份认证，攻击者仅需构造特制的 SYN 分片洪水包即可触发，影响运行上述版本 ISS RealSecure 的服务器系统。目前官方已发布安全更新修复此漏洞。"
published = "2000-10-20T04:00:00Z"
remediation = "升级 ISS RealSecure 至 3.2.3 或更高版本，该漏洞已在后续版本中修复。如无法升级，可在网络边界防火墙或路由器上配置访问控制规则，丢弃异常 SYN 分片包，并限制单位时间内新建连接数以缓解 DoS 攻击。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "ISS RealSecure 分片SYN报文洪泛拒绝服务漏洞"
updated = "2026-06-16T21:52:16Z"

