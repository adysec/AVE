[info]
author = "ave"
description = "AVE-2025-0597 verification"
id = "POC-AVE-2025-0597"
name = "PoC for AVE-2025-0597"
severity = "medium"
tags = ["ave-2025-0597"]
vuln_id = [
    "CVE-2025-14524",
    "AVE-2025-0597",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/vuln/path"
protocol = "http"

[poc.requests.body]
content = '{"key":"value"}'
type = "json"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["vulnerable"]
