[basic]
description = "PALS Library System WebPALS 1.0 的 pals-cgi 程序存在命令注入漏洞。远程攻击者无需身份认证即可通过在 documentName 参数中注入 shell 元字符，向目标服务器发送特制的 HTTP 请求来执行任意系统命令。该漏洞影响 WebPALS 1.0 及之前版本，攻击者可借此获取服务器控制权，导致数据泄露或系统被完全接管。CVSS 评分为 7.5（高危），CVSS 向量为 AV:N/AC:L/Au:N/C:P/I:P/A:P。"
published = "2001-06-02T04:00:00.000"
remediation = "建议升级到WebPALS当前支持的最新稳定版本（2.0或更高），并确保已应用针对CVE-2001-0216的安全补丁。通常需要更新pals-cgi程序到支持安全输入验证的版本。此外，建议在Apache/Nginx配置文件中限制对pals-cgi脚本的访问权限，仅允许来自内部网段的请求，并禁用shell元字符在documentName参数中的解析。通过上述分层修复，可有效防止攻击者利用shell元字符在该参数中执行任意命令。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "PALS Library System WebPALS 1.0 pals-cgi 任意命令执行漏洞"
updated = "2026-06-16T21:53:53.993"

