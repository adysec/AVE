[basic]
description = "Adobe ColdFusion 的 upload.cfm 组件存在不受限制的文件上传漏洞（CWE-434）。攻击者可在无需任何身份认证的情况下，通过 HTTP 请求直接向目标服务器的任意目录上传恶意 JSP 或 CFM 文件，进而获得远程代码执行权限。该漏洞影响 ColdFusion 2018.0.0.310739 版本、Update 6 及更早版本、Update 14 及更早版本，CVSS 评分 9.8，危害等级严重。Adobe 已在 2018 年 9 月安全公告 APSB18-33 中发布修复版本。"
published = "2018-09-25T13:29:01Z"
remediation = "立即升级 Adobe ColdFusion 至以下安全版本：ColdFusion 2018 升级至 Update 1 及以上、ColdFusion 2016 升级至 Update 7 及以上、ColdFusion 11 升级至 Update 15 及以上。如无法立即升级，可在 Web 服务器层面对 /cfide/scripts/ajax/FCKeditor/editor/filemanager/upload.cfm 路径配置访问控制，限制非授权 IP 上传，并禁用不必要的文件上传功能作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Adobe ColdFusion 任意文件上传漏洞"
updated = "2026-06-17T01:43:25Z"

