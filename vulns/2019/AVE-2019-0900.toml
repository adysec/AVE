[basic]
description = "Mozilla Firefox 的 IonMonkey JIT 编译器在设置数组元素时存在类型混淆漏洞。由于 JIT 编译器对数组元素类型别名信息处理错误，导致类型推断出现混淆，攻击者可通过构造特制的 JavaScript 代码诱导用户访问恶意页面，触发类型混淆后实现任意内存读写，最终在受害者系统上执行任意代码。该漏洞已在野外被积极利用，影响 Firefox 72.0.1 之前版本、Firefox ESR 68.4.1 之前版本及 Thunderbird 68.4.1 之前版本。攻击无需身份认证，仅需用户通过浏览器访问恶意页面即可触发。"
published = "2020-03-02T05:15:12Z"
remediation = "立即升级 Firefox 至 72.0.1 及以上版本，或 Firefox ESR 至 68.4.1 及以上版本；Thunderbird 用户升级至 68.4.1 及以上版本。该漏洞已被发现在野利用，属于主动攻击漏洞，建议在补丁安装前禁用 Firefox/Thunderbird 的 JavaScript 引擎（设置 javascript.enabled=false）作为临时缓解措施，并关注 Mozilla 安全公告 MFSA2020-03/MFSA2020-04 获取最新补丁信息。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Mozilla Firefox IonMonkey JIT 类型混淆远程代码执行漏洞"
updated = "2026-06-17T02:23:11Z"

