[basic]
description = "LabKey Server 社区通过存在跨站反射（XSS）漏洞，影响 18.3.0-61806.763 之前的版本。漏洞根因在于 `/__r2/query` 端点在处理查询参数时，未能对用户可控的 `onerror` 参数进行充分的过滤与输出编码。由于该端点无需认证即可访问，远程攻击者可在未认证的情况下构造携带恶意 JavaScript 的专用链接，并诱导已登录用户点击，导致恶意脚本在受害者浏览器上下文中执行。成功利用后，攻击者能够窃取会话凭据、篡改页面内容或发起钓鱼等攻击，危害用户数据安全。该漏洞属于反射型 XSS，需要用户交互配合，CVSS 评分 6.1，危害等级为中等。厂商建议升级到 18.3.0-61806.779 及更高版本来加以修复。"
published = "2019-01-30T20:29:00Z"
remediation = "建议将 LabKey Server 升级至 18.3.0-61806.763 或更高版本，官方已在该版本中修复 /__r2/query 接口 onerror 参数的反射型 XSS 问题。若无法立即升级，可采取以下临时缓解措施：1) 在 Web 应用防火墙（WAF）或反向代理层配置规则，过滤请求中的 onerror 等 on* 事件属性及 <script>、javascript: 等危险关键字；2) 限制 /__r2/query 接口的访问来源，仅允许受信任内网 IP 访问；3) 对管理员及所有用户实施内容安全策略（CSP），禁止执行内联脚本。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "LabKey Server 反射式跨站脚本漏洞"
updated = "2026-06-17T02:35:51Z"

