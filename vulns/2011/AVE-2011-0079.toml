[basic]
description = "Adobe Flash Player 在处理特定数据时存在整数溢出漏洞，远程攻击者可通过诱导用户访问恶意网页或打开特制文件触发该漏洞，导致堆内存破坏，最终实现任意代码执行。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上 10.3.183.5 之前版本的 Flash Player，CVSS 评分 10.0，危害等级严重。Adobe 已在安全公告 APSB11-21 中发布修复版本。"
published = "2011-08-10T22:55:00Z"
remediation = "由于 Adobe Flash Player 已于 2020 年 12 月 31 日正式终止支持（EOL），不再提供任何安全更新，唯一的修复方式是彻底卸载。Windows 用户通过控制面板 → 程序和功能 → 卸载 Adobe Flash Player；Mac 用户使用应用程序文件夹中的 Adobe Flash Player 卸载程序；Linux 用户执行 sudo apt purge adobe-flashplugin（Debian/Ubuntu）或对应包管理器卸载命令。卸载后使用 Adobe 官方 Flash Player Uninstaller 清理残留文件，并在浏览器中禁用或移除 Flash 插件，迁移至 HTML5 等现代 Web 技术替代方案。如业务仍依赖 Flash 内容，建议在完全隔离的网络环境中运行，禁止访问外部网站。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 整数溢出远程代码执行漏洞"
updated = "2026-06-16T23:30:45Z"

