[basic]
description = "Windows 电话服务（Telephony Service）中存在堆缓冲区溢出漏洞（CWE-122），攻击者可通过网络向受影响系统发送特制请求触发该漏洞，导致远程代码执行。该漏洞无需身份认证即可利用，但需要用户交互（如点击恶意链接或打开恶意文件），攻击成功后攻击者可获取系统控制权，执行任意代码。影响范围包括多个 Windows 版本，Microsoft 已在 2025 年 4 月安全更新中修复。"
published = "2025-04-08T18:15:45Z"
remediation = "安装 Microsoft 2025 年 4 月安全更新。受影响版本对应修复版本：Windows 10 1507 升级至 10.0.10240.20978，Windows 10 1607/Server 2016 升级至 10.0.14393.7969，Windows 10 1809/Server 2019 升级至 10.0.17763.7136，Windows 10 21H2 升级至 10.0.19044.5737，Windows 10 22H2 升级至 10.0.19045.5737，Windows 11 22H2 升级至 10.0.22621.5189，Windows 11 23H2 升级至 10.0.22631.5189，Windows 11 24H2 升级至 10.0.26100.3775，Server 2022 升级至 10.0.20348.3453，Server 2025 升级至 10.0.26100.3775。可通过 Windows Update 自动获取更新，或在 Microsoft 更新目录网站手动下载对应补丁。如无法立即修补，建议限制对 TAPI 服务的网络访问，仅允许受信任 IP 连接。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:42:48Z"

