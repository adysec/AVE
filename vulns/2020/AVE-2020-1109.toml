[basic]
description = "Oracle WebLogic Server 中的 Oracle Coherence 组件（Caching、CacheStore、Invocation）存在反序列化远程代码执行漏洞。攻击者可通过 T3 协议向目标发送特制的序列化数据，利用 ReflectionExtractor 类在反序列化过程中调用任意方法，实现未经身份认证的远程代码执行。该漏洞影响 WebLogic Server 12.1.3.0.0、12.2.1.3.0、12.2.1.4.0 及 Coherence 3.7.1.0 版本，CVSS 评分 9.8，危害严重。Oracle 已在 2020 年第一季度安全更新中发布补丁修复。"
published = "2020-01-15T17:15:17.347"
remediation = "立即安装 Oracle 2020 年 1 月关键补丁更新（CPUJan2020）中针对 Coherence 组件的补丁，具体补丁编号请登录 My Oracle Support 查询对应版本。若无法立即打补丁，可在 WebLogic 控制台或通过配置文件禁用 T3 协议：在 `setDomainEnv.sh` 中添加 `-Dweblogic.rjvm.enableprotocols=false` 启动参数，或在防火墙层面阻止 T3 默认端口 7001 的入站连接作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Oracle WebLogic Server T3反序列化远程代码执行漏洞"
updated = "2026-06-17T03:12:20.697"

