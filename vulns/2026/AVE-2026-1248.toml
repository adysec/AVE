[basic]
description = "Foxit PDF 编辑器与阅读器存在释放后使用（Use-After-Free）远程代码执行漏洞，编号 CVE-2026-5940（ZDI-26-301）。该漏洞由 TrendAI Zero Day Initiative 匿名研究员发现并通过 ZDI 渠道提交。漏洞原理为：应用程序在处理嵌入式 JavaScript 的 PDF 文档时，若脚本先删除注释再调用触发界面刷新的函数，系统可能访问已被释放的对象，导致释放后使用内存访问违规，引发程序崩溃，攻击者可借此实现远程代码执行。影响范围为 Windows 平台上的 Foxit PDF Editor 2026.1 及更早版本、14.0.3 及更早版本、13.2.3 及更早版本，以及 Foxit PDF Reader 2026.1 及更早版本。攻击条件要求攻击者诱骗用户在受影响的 Foxit 产品中打开包含恶意 JavaScript 代码的 PDF 文件，用户交互为必需条件，攻击复杂度低，无需任何权限。利用方式为构造包含嵌入式 JavaScript 的特制 PDF 文档，通过脚本删除注释后立即触发界面刷新函数，造成内存中已释放的注释对象被重新访问，进而可能被利用执行任意代码或造成信息泄露，CVSS 评分为 7.8，危害等级为高。Foxit 公司已于 2026 年 7 月 8 日发布安全更新，受影响用户应升级至 Foxit PDF Editor 2026.1.2/14.0.5/13.2.5 或更高版本，以及 Foxit PDF Reader 2026.1.2 或更高版本以修复此漏洞。"
published = "2026-04-27T12:16:24.377"
remediation = "立即升级 Foxit PDF Editor 至 13.2.4 或更高版本。具体操作：打开 Foxit PDF Editor，依次点击 Help > About Foxit PDF Editor > Check for Update 进行在线更新，或前往官网下载 13.2.4 安装包覆盖安装。如暂时无法升级，应避免打开未知来源的 PDF 文件，并在 Editor 中通过 File > Preferences > JavaScript 禁用 JavaScript 执行以降低被利用风险。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Foxit PDF编辑器/阅读器 注释释放后使用远程代码执行漏洞"
updated = "2026-06-17T10:59:55.580"

