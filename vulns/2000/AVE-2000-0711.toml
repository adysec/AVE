[basic]
description = "XFree86 3.3.5 及 3.3.6 版本中 Xlib 库的 Display 名称处理存在缓冲区溢出漏洞。当应用程序调用 Xlib 库时，用户通过 DISPLAY 环境变量或 -display 命令行参数提供的值被复制到固定长度的栈缓冲区中，未进行长度检查，导致可覆盖栈上的返回地址和局部变量。本地攻击者可利用此漏洞执行任意代码，获取目标系统的控制权限。虽然仅允许数字字符写入栈，但通过部分地址覆盖仍可实现利用。该漏洞影响所有使用 XFree86 3.3.x 的 Unix 系统。"
published = "2000-12-19T05:00:00.000"
remediation = "升级到 XFree86 4.0 及以上版本，该版本已修复 xlib 缓冲区溢出问题。如使用 SGI IRIX 系统，请安装 SGI 安全公告 20020502-01-I 提供的补丁。对于无法升级的旧系统，建议限制本地用户对 DISPLAY 环境变量的设置权限，并避免在命令行中使用过长的 -display 参数作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "XFree86 Xlib Display 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:53.677"

