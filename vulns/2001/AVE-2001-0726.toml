[basic]
description = "Internet Explorer 5.5 及更早版本在启用证书吊销列表（CRL）检查时，未能正确验证数字证书的有效性。远程攻击者可通过中间人攻击方式向用户发送经过篡改或伪造的服务器证书，由于浏览器未严格校验证书链和吊销状态，导致攻击者可伪装成受信任的网站，欺骗用户与之建立看似安全的加密连接，从而窃取敏感信息。该漏洞影响 Windows 9x/NT/2000/XP 等系统上安装的 IE 5.5 及更早版本浏览器，攻击者需在网络中实施中间人劫持，诱骗用户访问恶意网站即可触发利用。Microsoft 已在后续安全更新中修复此证书验证缺陷。"
published = "2001-06-27T04:00:00Z"
remediation = '安装 Microsoft 2001 年 5 月安全更新 MS01-027 以修复该漏洞：Internet Explorer 5.01 用户应安装 KB295106 补丁，Internet Explorer 5.5 用户应安装 KB299618 补丁。更可靠的方案是直接升级到 Internet Explorer 6.0 或更高版本，该版本不受此漏洞影响。如使用 Windows 95、98、98SE 或 ME 系统升级 IE 6，务必选择 Typical Install 或 Full Install 安装模式，不得选择 Minimal Install 或 Custom Install，否则漏洞文件可能未被覆盖。如暂无法升级或打补丁，可临时打开 IE 浏览器，进入工具→Internet 选项→高级选项卡，在安全区域中取消勾选"Check for server certificate revocation"（检查服务器的证书吊销状态），但此方式仅作为临时缓解措施，并不能完全消除风险。'
score = 5.1
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Internet Explorer 服务器证书验证漏洞"
updated = "2026-06-16T21:54:07Z"

