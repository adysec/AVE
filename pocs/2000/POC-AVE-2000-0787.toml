[info]
author = "AVE"
description = "通过 HTTP 页面嵌入恶意 aim:goim? 链接，当用户点击时触发 AIM 客户端缓冲区溢出。screenname 参数超长字符串导致栈溢出，可劫持 EIP 执行任意代码。影响 AIM 4.3.2229 之前版本。"
id = "POC-AVE-2000-0787"
name = "AOL Instant Messenger aim:// Remote Buffer Overflow PoC"
severity = "high"
tags = ["ave-2000-0787"]
vuln_id = [
    "CVE-2000-1093",
    "AVE-2000-0787",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/aim-poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["aim:goim"]
