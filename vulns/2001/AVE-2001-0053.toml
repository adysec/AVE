[basic]
description = "ProFTPD 1.2.0rc2 版本存在内存泄漏漏洞，远程攻击者无需身份认证即可通过发送大量 USER 命令消耗服务器内存资源，导致服务响应缓慢甚至崩溃，造成拒绝服务。若服务器安装配置不当，攻击者还可利用 SIZE 命令触发同样的内存泄漏问题。该漏洞影响 ProFTPD 1.2.0rc2 版本，CVSS 评分 5.0，危害等级中危。建议升级至 1.2.0rc3 或更高版本以修复此漏洞。"
published = "2001-03-12T05:00:00Z"
remediation = "升级 ProFTPD 至 1.2.1 或更高版本，该漏洞已在 1.2.0 正式版及后续版本中修复。如无法立即升级，可在配置文件中限制单个 IP 的连接速率和最大 USER 命令次数，或通过防火墙限制对 FTP 端口的访问以降低攻击面。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "ProFTPD 1.2.0rc2 内存泄漏拒绝服务漏洞"
updated = "2026-06-16T21:53:44Z"

