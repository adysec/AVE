[basic]
description = "RealNetworks RealPlayer 的 RTSPProtocol::HandleSetParameterRequest 函数（client/core/rtspprotocol.cpp）存在缓冲区溢出漏洞。远程未认证攻击者可通过发送精心构造的 RTSP SET_PARAMETER 请求触发堆缓冲区溢出，导致应用程序崩溃拒绝服务，甚至可能实现远程任意代码执行。该漏洞影响 RealPlayer 10、RealPlayer 10.5（6.0.12.1040-6.0.12.1741）、RealPlayer 11（11.0.0-11.0.4）、RealPlayer Enterprise、Mac RealPlayer 10/10.1、Linux RealPlayer 10 以及 Helix Player 10.x 等多平台多版本，攻击者无需认证即可通过网络远程利用，CVSS 评分 9.3（CRITICAL），危害等级极高。"
published = "2010-01-25T19:30:01Z"
remediation = "立即升级 RealPlayer 至 SP 1.0.5 或更高版本（RealPlayer 10/10.5/11/Enterprise/Mac/Linux 及 Helix Player 10.x 均需升级）。官方下载地址：https://www.real.com/realplayer/download。若暂时无法升级，建议在防火墙层面封锁 RTSP 端口（默认 554/TCP）并禁止播放不可信的 RTSP 流媒体链接，或临时卸载 RealPlayer 组件以防 RTSP SET_PARAMETER 缓冲区溢出被远程利用执行任意代码。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer RTSP SET_PARAMETER 缓冲区溢出漏洞"
updated = "2026-06-16T23:13:19Z"

