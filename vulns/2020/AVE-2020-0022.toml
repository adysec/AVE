[basic]
description = "Microsoft Exchange Server 在处理内存对象时存在验证密钥远程代码执行漏洞（CWE-287）。由于 Exchange 在安装时生成的验证密钥（ValidationKey）和脱敏密钥（DecryptionKey）在所有同版本服务器中相同，已认证的攻击者可利用该固定密钥构造恶意 ViewState 数据，通过 Exchange 控制面板（ECP）发送特制请求触发.NET反序列化，从而在目标服务器上以 SYSTEM 权限执行任意代码。攻击者只需拥有 Exchange 有效用户凭据即可远程利用，无需用户交互。该漏洞影响 Microsoft Exchange Server 2010/2013/2016/2019 等多个版本，CVSS 评分 8.8，危害等级高。Microsoft 已在 2020 年 2 月安全更新中修复此漏洞，建议用户立即安装补丁或按官方指南更换唯一验证密钥。"
published = "2020-02-11T22:15:15Z"
remediation = "立即安装 Microsoft 2020 年 2 月安全更新 KB4536987：Exchange Server 2016 CU14/CU15 和 Exchange Server 2019 CU3/CU4 均需更新至对应补丁版本。建议以管理员身份运行命令提示符后执行 .msp 安装包，或通过 Windows Update 自动更新。如无法立即打补丁，可在 ECP 虚拟目录上配置 IP 地址和域名访问限制，仅允许受信任的管理员网络段访问 /ecp 路径，同时启用多因素认证（MFA）降低凭据泄露后的利用风险。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Exchange 验证密钥远程代码执行漏洞"
updated = "2026-06-17T02:46:21Z"

