[basic]
description = "Red Hat Linux 6.2 中的 restore 0.4b15 及早期版本存在本地权限提升漏洞，该漏洞源于 restore 程序信任 RSH 环境变量指定的路径名。本地攻击者可通过修改 RSH 环境变量指向恶意程序（木马程序），诱导 restore 以 root 权限执行任意代码，从而获取完整的 root 权限。该漏洞影响 Red Hat Linux 6.2 及使用受影响 restore 版本的系统，CVSS 评分 7.2（高危），攻击向量为本地、攻击复杂度低、无需认证、机密性/完整性/可用性均完全受影响。攻击者需拥有本地账户权限，通过设置恶意 RSH 环境变量并诱导 restore 执行即可实现提权。Red Hat 已发布补丁修复该漏洞，建议升级至修复版本。"
published = "2001-01-09T05:00:00.000"
remediation = "建议立即升级 Red Hat Linux 至 6.2 及以上版本并安装官方发布的 restore 软件包更新（如 restore-0.4b15-5 或更高版本）。临时缓解措施：1) 移除 restore 程序的 setuid 位（chmod u-s /sbin/restore）；2) 在 /etc/profile 和 /etc/csh.cshrc 中添加 unset RSH 防止环境变量注入；3) 限制普通用户对 restore 程序的执行权限（chmod 700 /sbin/restore）。建议尽快升级至 Red Hat Linux 7.0 或更高版本以彻底修复此本地提权漏洞。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Red Hat Linux 6.2 restore/dump 本地权限提升漏洞"
updated = "2026-06-16T21:53:12.120"

