[info]
author = "ave"
description = "验证Linux内核fastrpc驱动是否存在越界写入漏洞。通过构造特制的ioctl输入数据触发fastrpc驱动的缓冲区复制操作，检查是否可导致内存越界写入并实现本地权限提升。"
id = "POC-AVE-2025-0951"
name = "CVE-2025-21734 PoC"
severity = "high"
tags = ["ave-2025-0951"]
vuln_id = [
    "CVE-2025-21734",
    "AVE-2025-0951",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/dev/fastrpc"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = ".+"
type = "regex"
