[basic]
description = 'GNOME Display Manager (GDM) 2.4.1.6 之前版本在使用"检查会话错误"功能时，存在符号链接攻击漏洞。本地攻击者可通过在 ~/.xsession-errors 文件上创建指向任意敏感文件的符号链接，诱导 GDM 以特权读取该链接指向的文件内容，实现任意文件读取。该漏洞影响 GDM 2.4.1.6 及更早版本，CVSS 评分 2.1（本地攻击、低复杂度、无需认证、部分机密性影响），危害等级较低。攻击条件要求攻击者具备本地系统访问权限并能创建符号链接。利用方式为：攻击者创建 ~/.xsession-errors 到目标文件（如 /etc/shadow）的符号链接，随后触发 GDM 的"检查会话错误"功能，即可读取目标文件内容。升级至 GDM 2.4.1.6 或更高版本可修复此漏洞。'
published = "2003-08-27T04:00:00Z"
remediation = "建议将 GDM 升级至 2.4.1.6 或更高版本。Red Hat 用户请安装 RHSA-2003:258 安全更新，Conectiva 用户请安装 CLA-2003:729 更新。如暂无法升级，应在所有用户目录中删除 ~/.xsession-errors 符号链接并创建权限为 600 的普通文件，同时在 gdm.conf 中将 UserAuthDir 设为 /tmp/gdm-XXXXXX 以阻止符号链接攻击。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "GNOME GDM 任意文件读取漏洞"
updated = "2026-06-16T22:02:24Z"

