[basic]
description = "WordPress 的 wp-google-maps 插件在 7.10.43 及更早版本中存在跨站脚本（XSS）漏洞。该漏洞源于 wp-admin/admin.php 文件未对 PATH_INFO 参数进行充分的输入过滤和输出转义，攻击者可通过构造包含恶意 JavaScript 代码的 PATH_INFO 路径，将脚本注入到网页响应中。当管理员或用户访问该恶意链接时，脚本将在其浏览器中执行。由于该漏洞通过网络即可利用、攻击复杂度低且无需事先认证，只需诱导目标用户点击 crafted URL 即可触发，影响范围涵盖所有使用该插件的 WordPress 网站，可能导致管理员会话劫持、凭据窃取或后台被植入后门，进而造成网站被完全控制。"
published = "2019-03-22T00:29:00Z"
remediation = "将 WordPress 的 wp-google-maps 插件升级到 7.10.43 或更高版本，以修复 wp-admin/admin.php 路径下存在的跨站脚本漏洞。如暂时无法升级，可临时禁用该插件或限制 wp-admin 目录的访问权限作为缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress wp-google-maps 插件跨站脚本漏洞"
updated = "2026-06-17T02:44:50Z"

