[basic]
description = "Bugzilla 2.14 之前版本存在多个跨站脚本（XSS）和 SQL 注入漏洞。由于程序未正确转义不受信任的参数，远程攻击者可通过向 reports.cgi 的 product/output 变量、showvotes.cgi 的 voteon/bug_id/user 变量、createaccount.cgi 的无效邮箱地址、showdependencytree.cgi 的无效 ID、process_bug.cgi 的无效用户名等字段以及 buglist.cgi 的错误消息中注入恶意脚本或 SQL 语句，实现任意 Web 脚本执行或数据库操作。该漏洞影响所有使用 Bugzilla 2.14 之前版本的服务器，攻击者无需身份认证即可远程利用，CVSS 评分 7.5，危害等级高。"
published = "2001-09-10T04:00:00Z"
remediation = "立即升级 Bugzilla 至 2.14 或更高版本，该版本已修复对不可信参数的正确转义处理。Red Hat 用户可安装 RHSA-2001-107 提供的补丁包。临时缓解措施包括在 Web 应用防火墙中过滤 reports.cgi、showvotes.cgi、createaccount.cgi、process_bug.cgi 等页面的特殊字符输入，并对所有用户输入进行 HTML 编码输出。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Bugzilla Bugzilla 跨站脚本和SQL注入漏洞"
updated = "2026-06-16T21:56:12Z"

