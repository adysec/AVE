[basic]
description = "1st Up Mail Server 4.1 的 MAIL FROM 命令处理存在缓冲区溢出漏洞，远程攻击者无需身份认证即可向目标邮件服务器发送超长的 MAIL FROM 命令，触发缓冲区溢出，导致服务崩溃拒绝服务，甚至可能执行任意代码。该漏洞影响 1st Up Mail Server 4.1 版本，CVSS 评分 10.0，危害等级严重。目前官方已停止维护，建议用户迁移至其他受支持的邮件服务器软件。"
published = "2001-02-12T05:00:00Z"
remediation = "该产品（1st Up Mail Server 4.1）已停止维护，厂商不再提供安全更新，建议立即迁移至受支持的邮件服务器软件（如 Exchange Server、Postfix 等）。在迁移完成前，可在网络边界防火墙配置规则，仅允许受信任源 IP 访问 TCP 端口 25（SMTP），并部署 IPS/IDS 设备检测过长的 MAIL FROM 命令（正常 MAIL FROM 命令长度通常不超过 256 字节），对超过 512 字节的 SMTP 命令直接拦截。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "1st Up Mail Server 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:35Z"

