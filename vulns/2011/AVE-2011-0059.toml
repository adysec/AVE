[basic]
description = "PHP 5.3.4 之前版本的 PCNTL 扩展中存在条件竞争漏洞。当应用程序注册了用户自定义信号处理函数时，攻击者可通过发送大量并发信号触发该竞态条件，导致内存损坏，最终造成拒绝服务。攻击者需要具备向目标 PHP 进程发送信号的能力，攻击复杂度较高。"
published = "2011-02-02T22:00:02Z"
remediation = "升级 PHP 至 5.3.4 或更高版本。PHP 5.3.4 已修复 PCNTL 扩展中的条件竞争漏洞，可通过官方源码编译升级或使用系统包管理器（如 yum update php、apt-get upgrade php5）安装最新安全更新。如无法立即升级，可在 php.ini 中禁用 pcntl 扩展（extension=pcntl.so 前加分号注释）作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "PHP PCNTL扩展条件竞争拒绝服务漏洞"
updated = "2026-06-16T23:28:00Z"

