[basic]
description = "grsecurity 1.9.4 补丁在 Linux 内核 2.4.18 上存在内存保护绕过漏洞。未经身份认证的本地用户可利用 mmap 系统调用直接映射 /dev/mem 或 /dev/kmem 到内核内存空间，从而绕过 grsecurity 设置的只读内存保护机制。该漏洞影响安装了 grsecurity 1.9.4 补丁的 Linux 2.4.18 内核系统，攻击者成功利用后可读取或修改内核敏感数据，可能导致本地权限提升或系统稳定性破坏。利用方式为本地用户通过 mmap 映射物理内存设备，直接访问受保护的只读内存区域。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 grsecurity 补丁至 1.9.5 或更高版本，该版本已修复 mmap 映射 /dev/mem 和 /dev/kmem 的内核内存绕过漏洞。同时建议将 Linux 内核升级至受支持的稳定版本并应用对应 grsecurity 补丁。如暂时无法升级，可通过以下措施缓解：在 /etc/udev/rules.d/ 中添加规则移除或限制普通用户对 /dev/mem 和 /dev/kmem 的访问权限，或通过 sysctl 设置 kernel.yama.ptrace_scope=2 限制 ptrace  Scope，并启用内核的 CONFIG_STRICT_DEVMEM 配置选项禁止用户空间直接映射物理内存。"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Linux Kernel grsecurity 补丁内存保护绕过漏洞"
updated = "2026-06-16T22:00:07Z"

