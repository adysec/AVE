[basic]
description = "tags.<value>Bugzilla 2.14 至 2.14.1 及 2.16 早期版本中的 editusers.cgi 脚本存在跨站脚本漏洞。该脚本在处理用户真实姓名（full name）字段时未对输入进行充分的引号转义处理，导致未经身份认证的远程攻击者可以在真实姓名字段中注入恶意脚本代码。当管理员或其他用户通过浏览器访问编辑用户页面时，注入的脚本将在其浏览器上下文中执行，从而窃取会话令牌、执行未授权操作或篡改数据。该漏洞影响 Bugzilla 2.14 至 2.14.1 以及 2.16rc2 之前的版本，攻击者无需任何凭据即可远程发起攻击，CVSS 评分为 7.5，危害等级为高危。"
published = "2002-08-12T04:00:00Z"
remediation = """立即将 Bugzilla 升级至 2.14.2 或 2.16rc2 版本，这两个版本已修复 editusers.cgi 中对 real name 字段未正确转义的问题。如无法立即升级，可临时在 Web 服务器层面配置 HTML 实体编码，对所有用户提交的 real name 字段中的 `<`、`>`、`&`、`"`、`'` 等特殊字符进行转义处理，以阻止脚本注入。"""
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Mozilla Bugzilla editusers.cgi 跨站脚本攻击漏洞"
updated = "2026-06-16T21:58:10Z"

