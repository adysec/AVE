[basic]
description = "Geddy 是基于 Node.js 的 Web 框架，其 `lib/app/index.js` 组件存在目录遍历漏洞。远程攻击者可通过向默认 URI 的 `PATH_INFO` 中注入 `..%2f`（URL 编码的路径穿越序列）绕过路径限制，读取服务器上的任意文件，导致敏感信息泄露。该漏洞影响 Geddy 13.0.8 之前的所有版本，攻击无需身份认证，利用复杂度低。厂商已在 v13.0.8 版本中修复此问题。"
published = "2015-09-04T15:59:02Z"
remediation = "立即将 Geddy 框架升级至 v13.0.8 或更高版本。该版本修复了 lib/app/index.js 中对路径遍历序列（如 ..%2f）的未正确过滤问题。如暂时无法升级，可在反向代理（如 Nginx）层对请求 URI 中的编码路径遍历序列（%2f、%2e%2e 等）进行拦截过滤，或通过 Web 应用防火墙 (WAF) 部署针对性规则阻断含 URL 编码双点号的请求。"
score = 5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Joyent Node.js Geddy框架目录遍历漏洞"
updated = "2026-06-17T00:29:35Z"

