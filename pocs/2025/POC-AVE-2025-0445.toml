[info]
author = "ave"
description = "通过构造特制的 ELF 文件，触发 GNU Binutils 2.45 链接器在处理 .eh_frame 段时的堆缓冲区溢出漏洞。PoC 文件来自 Bugzilla 附件 16358，使用 ld 处理该文件可触发崩溃。"
id = "POC-AVE-2025-0445"
name = "GNU Binutils 链接器 .eh_frame 堆缓冲区溢出 PoC"
severity = "medium"
tags = ["ave-2025-0445"]
vuln_id = [
    "CVE-2025-11082",
    "AVE-2025-0445",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/tmp/CVE-2025-11082-poc.elf"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["ELF"]
