[basic]
description = "Microsoft SQL Server 的数据转换服务（DTS）包属性对话框存在密码明文存储缺陷，本地用户可通过查看该对话框直接读取数据库连接密码，从而获取对数据库的未授权访问权限。该漏洞利用条件低，攻击者只需具备目标系统的本地访问权限即可触发，无需网络攻击或特殊身份认证。影响范围涵盖使用 DTS 包存储数据库连接信息的所有 SQL Server 版本。"
published = "2000-05-30T04:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS00-041 修补程序（KB Q264880），该补丁会消除 DTS 包属性对话框和 Enterprise Manager 中密码以明文方式暴露的漏洞。若暂时无法安装补丁，可采取以下缓解措施：禁用 MSDB 数据库的 Guest 访问权限，限制 DTS 包的编辑权限仅授予所有者，使用 Windows 身份验证代替 SQL Server 身份验证来运行 DTS 包，并定期检查已注册的服务器配置。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "Microsoft SQL Server DTS 密码泄露漏洞"
updated = "2026-06-16T21:51:50Z"

