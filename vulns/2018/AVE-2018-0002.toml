[basic]
description = "Cisco Secure Access Control System（ACS）5.8 patch 9之前版本中存在Java反序列化安全漏洞。该漏洞源于受影响软件对用户提交的内容进行了不安全的反序列化处理，未经身份认证的远程攻击者可通过向目标系统发送特制的序列化Java对象触发该漏洞，成功利用可在目标设备上以root权限执行任意命令。该漏洞影响范围广泛，CVSS评分9.8，危害等级严重，无需用户交互即可远程利用。"
published = "2018-03-08T07:29:00Z"
remediation = "立即将 Cisco Secure ACS 升级至 5.8.0.32.9 Cumulative Patch 版本，可从 Cisco.com Software Center（产品路径：Security > Network Visibility and Enforcement > Secure Access Control System > Secure Access Control System 5.8）下载安装。该漏洞已在野被积极利用（CISA KEV 收录），无临时缓解措施，必须通过版本升级彻底修复。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Cisco Secure Access Control System Java反序列化漏洞"
updated = "2026-06-17T01:29:56Z"

