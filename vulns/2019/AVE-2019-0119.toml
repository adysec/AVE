[basic]
description = "WordPress ultimate-faqs 插件 1.8.24 及以下版本的 Functions/EWD_UFAQ_Import.php 文件存在 HTML 内容注入漏洞（CWE-79）。未经身份认证的远程攻击者可通过构造恶意 HTML 载荷，利用该漏洞在用户浏览器中执行任意脚本代码。该漏洞影响使用受影响版本插件的 WordPress 网站，攻击复杂度低且无需权限，但需要用户点击恶意链接或访问注入页面方可触发成功，可导致会话劫持、网页篡改或钓鱼攻击等危害。"
published = "2019-10-07T23:15:10Z"
remediation = "建议立即将 WordPress ultimate-faqs 插件升级至 1.8.25 或更高版本（该版本已修复 HTML 注入漏洞）。如暂时无法升级，可在 WordPress 后台禁用该插件作为临时缓解措施，或在 WAF 层面配置规则拦截包含恶意 HTML/脚本内容的 FAQ 导入请求。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress ultimate-faqs 插件 HTML 内容注入漏洞"
updated = "2026-06-17T02:23:31Z"

