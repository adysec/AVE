[basic]
description = "VMware NSX SD-WAN Edge 3.1.0 之前版本的本地 Web UI 组件存在命令注入漏洞，该组件默认禁用且不应在不受信网络启用。未经身份认证的远程攻击者可通过向启用了该组件的目标发送特制恶意请求，注入任意系统命令并实现远程代码执行，完全控制受影响设备。该漏洞影响 VMware NSX SD-WAN Edge by VeloCloud 3.1.0 之前版本，CVSS 3.1 评分 8.1（高危），攻击向量为网络、攻击复杂度高、无需权限和用户交互，机密性/完整性/可用性影响均为高。VMware 已在 3.1.0 版本中修复并计划在未来版本移除该服务，官方建议禁用本地 Web UI 并升级到 3.1.0 或更高版本。"
published = "2018-06-11T22:29:00.230"
remediation = "立即升级 VMware NSX SD-WAN Edge 至 3.1.0 或更高版本（建议升级至 3.1.2 及以上版本），该版本已修复命令注入漏洞。确保本地 Web UI 组件保持禁用状态（默认已禁用），切勿在不受信网络上启用该服务。VMware 计划在未来版本中移除该服务，建议尽快规划升级。若无法立即升级，请在防火墙层面限制管理接口仅允许受信任管理网段访问，并禁用对公网或不可信网络的管理端口暴露。同时启用网络分段，限制管理平面与数据平面的横向访问。参考 VMware 安全公告 VMSA-2018-0012 获取完整升级指南和补丁下载链接。"
score = 8.1
severity = "HIGH"
sources = ["kev"]
title = "VMware SD-WAN Edge 命令注入漏洞"
updated = "2026-06-17T02:02:31.090"

