[basic]
description = "Microsoft Office 2000 的 HTML 解释器存在缓冲区溢出漏洞，远程攻击者可通过向用户发送包含超长嵌入式对象标签（Embedded Object Tag）的特制 HTML 文档，诱使用户在 Office 应用程序中打开该文档，从而触发缓冲区溢出，导致任意代码执行。该漏洞影响 Microsoft Office 2000 套件（包括 PowerPoint、Excel、Word 等组件），攻击者成功利用后可获取与当前用户相同的系统权限。由于需要用户交互打开恶意文档，攻击复杂度较高，CVSS 评分为 5.1，危害等级中危。"
published = "2000-10-20T04:00:00.000"
remediation = '建议立即升级至 Microsoft Office 2000 Service Pack 3 (SP3) 或更高版本，并安装 Microsoft 安全公告 MS00-073 提供的补丁程序。若无法立即升级，可在 Word/Excel/PowerPoint 中禁用"在 Web 中打开"功能并限制嵌入式 HTML 对象解析作为临时缓解措施。'
score = 5.1
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Office 2000 HTML解释器缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:26.080"

