[basic]
description = "Gallery 1.1 和 1.2 版本的 modules.php 文件存在目录遍历漏洞，远程攻击者可通过在 include 参数中注入 ../ 路径序列，突破 Web 根目录限制，读取服务器上的任意敏感文件（如配置文件或系统文件）。该漏洞无需身份认证即可利用，攻击条件宽松，只要目标运行受影响版本的 Gallery 并暴露 HTTP 服务即可触发。攻击者仅需发送包含恶意路径的 HTTP 请求，即可实现任意文件读取，造成敏感信息泄露。"
published = "2001-11-18T05:00:00Z"
remediation = "立即将 Gallery 升级至 1.2.3 或更高版本，该版本已修复 modules.php 中 include 参数未过滤目录遍历序列的问题。如暂时无法升级，可在 Web 服务器（如 Apache）配置中添加 rewrite 规则或 PHP 配置 open_basedir 限制，禁止通过 URL 访问 /etc/passwd 等系统敏感文件，并手动审查 modules.php 中对 include 参数的处理逻辑，确保不接受 ../../ 类路径序列。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Menalto Gallery modules.php 目录遍历漏洞"
updated = "2026-06-16T21:55:11Z"

