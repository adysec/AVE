[basic]
description = """Summit Computer Networks Lil' HTTP Server 2.1/2.2 中的 PowerBASIC pbcgi.cgi 脚本存在跨站脚本（XSS）漏洞。远程攻击者可通过向 "Name" 或 "E-mail" 参数注入恶意 Web 脚本代码，当其他用户访问受影响的页面时，注入的脚本将在其浏览器中执行，导致敏感信息泄露或会话劫持。攻击无需认证，利用方式简单，影响 Lil' HTTP Server 2.1 及 2.2 版本。"""
published = "2002-10-04T04:00:00Z"
remediation = """建议立即升级 Lil' HTTP Server 至最新版本（如已停止维护，应替换为其他受支持的 Web 服务器，如 Apache HTTP Server 或 Nginx）。若无法立即替换，可在 pbcgi.cgi 中对 "Name" 和 "E-mail" 参数进行 HTML 实体编码过滤，禁止传入 `<script>` 等 HTML 标签字符，同时在 Web 服务器层面配置输出编码（如 Content-Type: text/html; charset=utf-8）以缓解 XSS 风险。"""
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Summit Computer Networks Lil' HTTP Server 跨站脚本漏洞"
updated = "2026-06-16T21:58:33Z"

