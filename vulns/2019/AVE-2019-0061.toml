[basic]
description = "Citrix SD-WAN Center 和 NetScaler SD-WAN Center 存在命令注入漏洞（CWE-78），由于对用户输入验证不严格，未经身份认证的远程攻击者可通过特制请求向受影响设备注入任意操作系统命令，从而完全控制目标系统。该漏洞影响 Citrix SD-WAN 10.2.3 之前版本及 NetScaler SD-WAN 10.0.8 之前版本，无需任何权限即可远程利用，CVSS 评分 9.8，危害等级严重。厂商已发布安全更新修复此漏洞。"
published = "2019-07-16T18:15:12Z"
remediation = "将 Citrix SD-WAN 升级到 10.2.3 或更高版本，将 NetScaler SD-WAN 升级到 10.0.8 或更高版本。登录设备管理界面，进入 System > Administration > Software Updates 检查并安装更新。如无法立即升级，可在管理界面禁用 WAN 虚拟 IP 的未授权访问，并在网络边界防火墙限制对 SD-WAN 管理端口（如 443/8443）的访问来源 IP。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Citrix SD-WAN Center 命令注入漏洞"
updated = "2026-06-17T02:15:51Z"

