[basic]
description = "Linux man 软件包中的 makewhatis 工具存在不安全的临时文件处理漏洞，本地攻击者可通过符号链接攻击（symlink attack）在目标系统上覆盖任意文件。该漏洞源于 makewhatis 在创建临时文件时未进行充分的路径安全检查，攻击者利用此缺陷可提升权限至 root 级别，实现完全控制目标系统。CVSS 评分 7.2，危害等级高，攻击复杂度低，但需要本地访问权限。"
published = "2000-07-03T04:00:00Z"
remediation = "立即升级 man 软件包至修复版本：Red Hat Linux 升级至 man-1.5h1-2 及以上，Caldera OpenLinux 安装 CSSA-2000-021 安全补丁，Mandrake Linux 安装 MDKSA-2000:015 更新。临时缓解措施：限制本地用户登录，使用 umask 077 并监控 /tmp 目录的符号链接创建行为。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Linux man makewhatis 不安全临时文件本地提权漏洞"
updated = "2026-06-16T21:52:00Z"

