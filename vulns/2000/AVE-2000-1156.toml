[basic]
description = "Snort 1.6在启用纯ASCII数据包记录模式或IDS模式下选择解码后的ASCII数据包记录时，远程攻击者可通过发送Snort无法识别的非IP协议数据包（如nmap协议扫描）导致服务进程崩溃，造成拒绝服务。攻击无需任何认证即可通过网络远程触发，影响Snort 1.6版本的正常运行。"
published = "2000-12-31T05:00:00Z"
remediation = """
[id]
ave_id = "AVE-2000-01226"
aliases = ["CVE-2000-1226"]

[basic]
title = "Snort 1.6 ASCII数据包记录模式拒绝服务漏洞"
description = "Snort 1.6在启用纯ASCII数据包记录模式或IDS模式下选择解码后的ASCII数据包记录时，远程攻击者可通过发送Snort无法识别的非IP协议数据包（如nmap协议扫描）导致服务崩溃，造成拒绝服务。攻击无需认证，通过网络即可远程触发，影响服务可用性。"
severity = "MEDIUM"
score = 5.0
sources = ["cve", "nvd"]
published = "2000-12-31"
updated = "2000-12-31"
remediation = "升级至Snort 2.0及以上版本，该版本修复了非IP协议处理异常导致崩溃的问题。如无法升级，应避免在生产环境中使用ASCII数据包记录模式，或配置防火墙过滤非IP协议流量作为临时缓解措施。"

