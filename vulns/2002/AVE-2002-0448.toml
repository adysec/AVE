[basic]
description = "Cisco IOS 11.1、11.2、11.3 版本的 TFTP 服务器功能存在基于堆的缓冲区溢出漏洞（CWE-119）。该漏洞源于 TFTP 服务器在处理超长文件名字符串时，未对输入长度进行充分校验，导致数据写入堆缓冲区时发生越界。远程攻击者无需认证即可触发该漏洞，通过向目标设备发送包含极长文件名的特制 TFTP 请求，可导致 TFTP 服务崩溃致使设备重置，引发拒绝服务；甚至可能修改设备配置，进而影响网络的正常运行。该漏洞危害等级较高，CVSS 评分 7.1，利用时需具备一定的攻击条件，建议受影响版本及时升级修复。"
published = "2002-08-12T04:00:00Z"
remediation = "建议尽快将存在漏洞的 Cisco IOS 设备升级到 12.x 或更高修复版本（Cisco 官方于 2002 年发布安全公告，TFTP 服务器长文件名堆溢出漏洞仅在 IOS 11.1、11.2、11.3 中存在，后续版本已修复）。若无法立即升级，应在网络边界防火墙或接入访问控制列表（ACL）中限制对 TFTP 服务（UDP 69 端口）的访问，仅允许受信任的管理主机连接；同时关闭不必要的 TFTP 服务（使用 no tftp-server 命令），或改用带访问控制的 TFTP over SSH 等安全传输方式，以阻止远程攻击者发送超长文件名请求造成系统重置或配置被篡改。"
score = 7.1
severity = "HIGH"
sources = ["exploitdb"]
title = "Cisco IOS TFTP服务器长文件名缓冲区溢出漏洞"
updated = "2026-06-16T21:58:11Z"

