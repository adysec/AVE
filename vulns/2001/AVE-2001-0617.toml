[basic]
description = "Microsoft IIS 4.0 和 5.0 所搭载的 FrontPage Server Extensions（FPSE）组件存在输入验证缺陷，远程攻击者无需身份认证即可通过向 FPSE 处理接口提交特制的畸形 Web 表单数据触发该漏洞，导致 IIS 服务异常终止或无法正常响应，形成拒绝服务攻击。该漏洞影响运行上述版本 IIS 及 FPSE 的 Windows 系统，攻击者仅需通过网络向目标站点发送构造不当的表单提交请求即可实施利用，无需交互账户或权限，危害面广且利用门槛极低。Microsoft 已在安全公告 MS00-100 中发布修复补丁，建议受影响用户尽快升级 FPSE 至安全版本。"
published = "2001-02-12T05:00:00.000"
remediation = '安装 Microsoft 安全更新补丁 Q280322（MS00-100）以彻底修复此漏洞，补丁可应用于 Windows 2000 Gold/Service Pack 1 及 Windows NT 4.0 Service Pack 6a/5 系统，修复后的版本将包含在 Windows 2000 Service Pack 2 和 Windows NT 4.0 Service Pack 7 中。如暂无法安装补丁且服务器不需要 FrontPage Server Extensions 功能，可在命令行执行 cd \Program Files\Common Files\Microsoft Shared\Web Server Extensions\40\bin 后运行 fpsrvadm -o uninstall -p all 卸载全部 FPSE 实例作为临时缓解措施；若仍需使用 FPSE，应在组策略中禁用 Web-based Printing 以防止利用。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft IIS 4.0/5.0 FrontPage Server Extensions 拒绝服务漏洞"
updated = "2026-06-16T21:53:38.877"

