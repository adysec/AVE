[basic]
description = "Squid 在 HTTP 加速模式（httpd_accel_host 配置）下，当 httpd_accel_host 与 http_accel_with_proxy 参数设为 off 时，未正确启用访问控制列表（ACL），导致攻击者可绕过 ACL 限制，对目标代理服务器执行未授权操作，如端口扫描等恶意活动。该漏洞影响 Squid 2.3STABLE5 之前的所有版本，CVSS 评分为 7.5，危害等级为高危。攻击条件为攻击者需能访问目标 Squid 代理服务器的 HTTP 加速端口，无需身份认证即可触发。利用方式为向目标发送特制的 HTTP 请求，绕过 ACL 访问控制机制，实施未授权的网络探测或端口扫描活动。"
published = "2001-07-18T04:00:00Z"
remediation = "将 Squid 升级至 2.3STABLE5 或更高版本，该版本已修复 HTTP 加速器模式下 ACL 被绕过的问题。如暂无法升级，可在 squid.conf 中禁用 httpd_accel_host 和 http_accel_with_proxy off 组合配置，或直接关闭 HTTP 加速器模式，并手动确保 access control lists 始终生效作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Squid HTTP 加速器模式 访问控制绕过漏洞"
updated = "2026-06-16T21:55:26Z"

