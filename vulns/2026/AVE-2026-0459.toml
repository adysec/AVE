[basic]
description = "MosaicML Composer 在解析检查点（checkpoint）文件时存在反序列化不可信数据漏洞（CWE-502）。由于对用户提供的数据缺乏充分验证，攻击者可构造恶意的检查点文件，诱导用户访问恶意页面或打开恶意文件触发反序列化，从而在当前进程上下文中执行任意代码。该漏洞影响 MosaicML Composer 相关版本，CVSS 评分 7.8，危害等级高。用户交互是成功利用该漏洞的必要条件。"
published = "2026-06-24T22:16:46Z"
remediation = '立即升级 MosaicML Composer 至包含 PR #3937 修复的版本（≥v0.32.2 或后续发布版），该版本在 `composer/checkpoint/load.py` 中引入 `_RestrictedUnpickler` 白名单机制，仅允许反序列化已知安全类型（datetime.timedelta、numpy.ndarray、torch.Tensor 等），并强制 `_torch_load_with_validation` 使用 `weights_only=True`。如无法立即升级，切勿加载来源不可信的 checkpoint 文件，并在加载任何第三方 checkpoint 前使用 `load_ignore_keys = ["state/train_metrics/*", "state/eval_metrics/*"]` 跳过可能包含恶意载荷的状态条目。'
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "MosaicML Composer 反序列化远程代码执行漏洞"
updated = "2026-06-25T19:10:00Z"

