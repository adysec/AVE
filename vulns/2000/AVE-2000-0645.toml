[basic]
description = "Cmail 2.4.7 的 Web 界面中存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向运行在 8002 端口的用户对话框发送超长用户名，触发缓冲区溢出，导致目标服务崩溃并造成拒绝服务。该漏洞影响 Cmail 2.4.7 版本，攻击复杂度低，仅需网络访问即可利用，但无法实现代码执行或信息泄露。"
published = "2000-06-05T04:00:00Z"
remediation = "建议升级 Cmail 至 2.4.7 以上版本（如厂商已停止维护，应替换为其他受支持的邮件服务软件）；在防火墙层面限制对 TCP 8002 端口的访问，仅允许受信任 IP 连接，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Cmail Web接口缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:51:59Z"

