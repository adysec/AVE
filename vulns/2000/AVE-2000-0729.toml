[basic]
description = "OpenBSD 2.x 系统中的 fstat 程序存在格式字符串漏洞，由于程序在处理 PWD 环境变量时未正确进行格式化输出，将用户可控的字符串直接作为 printf 系列函数的格式化参数使用。本地攻击者可通过设置恶意的 PWD 环境变量并执行 fstat 程序触发该漏洞，利用格式字符串 %n 等写入操作覆盖任意内存地址，从而提升至 root 权限。该漏洞影响 OpenBSD 2.x 及可能其他基于 BSD 的操作系统，攻击者需拥有本地账户即可利用，无需交互，危害严重。"
published = "2000-12-19T05:00:00Z"
remediation = "升级 OpenBSD 至 2.8 或更高版本，该版本已修复 fstat 格式字符串漏洞。如无法立即升级，可移除 fstat 的 setuid 位（chmod u-s /usr/bin/fstat）以消除本地提权风险。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "OpenBSD fstat 格式字符串本地权限提升漏洞"
updated = "2026-06-16T21:52:55Z"

