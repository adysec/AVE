[basic]
description = "Microsoft Edge（基于 Chromium）存在用户界面关键信息错误表示漏洞（CWE-451），未经授权的远程攻击者可通过网络诱导用户访问特制网页，利用浏览器地址栏或安全指示器的 UI 渲染缺陷实施欺骗攻击，导致用户误判当前访问页面的真实来源。该漏洞攻击复杂度低，无需提前认证，但需要用户交互配合。成功利用可导致低度的机密性和完整性影响。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-24T22:15:38Z"
remediation = "建议立即将 Microsoft Edge (Chromium-based) 升级至 132.0.2957.127 或更高版本，可通过 Edge 浏览器内置更新（设置 > 关于 Microsoft Edge > 检查更新）或从官网 https://www.microsoft.com/edge 下载最新版。该漏洞为 UI 欺骗漏洞，攻击者需诱使用户点击恶意链接，建议同时启用 Edge 的增强安全模式（设置 > 隐私、搜索和服务 > 增强你的在线安全）作为纵深防御措施。"
score = 5.4
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Edge (Chromium-based) 欺骗漏洞"
updated = "2026-06-17T08:42:55Z"

