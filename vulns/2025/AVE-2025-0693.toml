[basic]
description = "Windows PrintWorkflowUserSvc 服务存在输入验证不当漏洞，由于该服务对用户提供的输入缺乏充分验证，导致存在权限提升风险。已获得低权限的本地攻击者可通过向 PrintWorkflowUserSvc 服务发送特制请求触发此漏洞，成功利用后可获取 SYSTEM 权限，实现完全控制受影响系统。该漏洞影响多个 Windows 版本，CVSS 评分 7.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:36Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新 (KB5049981)，可通过 Windows Update 自动获取。各受影响版本的最低修复版本号：Windows 10 21H2/22H2 需升级至 10.0.19044.5371/10.0.19045.5371，Windows 11 22H2/23H2/24H2 需升级至 10.0.22621.4751/10.0.22631.4751/10.0.26100.2894，Windows Server 2022/2025 需升级至 10.0.20348.3091/10.0.26100.2894。如无法立即打补丁，建议限制本地用户登录权限，仅允许受信任用户交互式登录。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows PrintWorkflowUserSvc 特权提升漏洞"
updated = "2026-06-17T08:42:51Z"

