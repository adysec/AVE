[info]
author = "AVE"
description = "检测目标是否运行存在释放后使用漏洞的 Adobe Flash Player 版本（31.0.0.153 及更早版本），通过加载特制 SWF 文件触发漏洞"
id = "POC-AVE-2018-0409"
name = "Adobe Flash Player Use-After-Free Remote Code Execution PoC"
severity = "high"
tags = ["cve-2018-15982"]
vuln_id = [
    "CVE-2018-15982",
    "AVE-2018-0409",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/CVE-2018-15982.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Flash",
    "Shockwave Flash",
]
