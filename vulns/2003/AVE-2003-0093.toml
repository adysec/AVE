[basic]
description = "Ethereal（现更名为 Wireshark）是一款开源的网络协议分析软件，其 `tvb_get_nstringz0` 函数在 0.9.12 及更早版本中未正确处理零长度缓冲区大小，存在内存处理漏洞。未经身份认证的远程攻击者可通过向运行 Ethereal 的监控系统发送特制网络数据包触发该函数，导致缓冲区处理异常，可能引发内存损坏、信息泄露或任意代码执行。该漏洞影响所有使用受影响版本分析网络流量或打开恶意数据包捕获文件的用户，攻击条件简单，无需认证且攻击复杂度低。Ethereal 官方已发布安全公告 ENPA-SA-00010 修复此问题，Debian、RedHat 等发行版也同步发布了安全更新，用户应及时升级至修复版本。"
published = "2003-07-24T04:00:00Z"
remediation = "立即将 Ethereal 升级至 0.9.13 或更高版本，或迁移至后续 renamed 的 Wireshark 发行版，新版本已修复 tvb_get_nstringz0 函数对零长度缓冲区大小的错误处理。对于 Debian woody 用户，应安装 ethereal 0.9.4-1woody5 或更高版本的安全更新。如暂无法升级，可临时限制仅用受信数据源打开嗅探文件，避免解析来自不可信网络的恶意构造数据包，从而降低远程代码执行风险。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "Ethereal tvb_get_nstringz0 内存处理漏洞"
updated = "2026-06-16T22:02:11Z"

