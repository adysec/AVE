[basic]
description = "VMware Workspace ONE UEM 管理控制台中的 BlobHandler.ashx 接口存在服务端请求伪造（SSRF）漏洞。攻击者在获得对 UEM 控制台的网络访问权限后，可无需身份认证即可向该接口发送特制请求，诱使服务器向内部或外部网络发起任意 HTTP 请求，从而获取敏感信息或扫描内网资产。该漏洞影响 Workspace ONE UEM 20.0.8 至 20.0.8.37 之前、20.11.0 至 20.11.0.40 之前、21.2.0 至 21.2.0.27 之前以及 21.5.0 至 21.5.0.37 之前的版本，CVSS v3.1 评分 7.5，危害等级为高。VMware 已在后续版本中修复此漏洞，建议用户尽快升级至修复版本。"
published = "2021-12-17T17:15:12Z"
remediation = "tags as requested.<value>请立即将 VMware Workspace ONE UEM console 升级至安全版本：20.0.8 升级至 20.0.8.37、20.11.0 升级至 20.11.0.40、21.2.0 升级至 21.2.0.27、21.5.0 升级至 21.5.0.37。如暂无法立即升级，应在边界防火墙或网络访问控制层面限制对 UEM 控制台管理接口的访问，仅允许可信管理网段访问，以阻断未认证的 SSRF 攻击向量。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "VMware Workspace ONE UEM 服务端请求伪造漏洞"
updated = "2026-06-17T03:36:36Z"

