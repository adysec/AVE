[basic]
description = "Google Chrome 132.0.6834.83 之前版本的 Frames 组件中存在条件竞争漏洞。远程攻击者可通过构造特制的 HTML 页面并诱使用户执行特定的 UI 手势，利用该竞争条件绕过安全限制，实现 UI 界面欺骗。该漏洞影响用户界面完整性，攻击者可在用户不知情的情况下伪造页面内容或诱导用户执行非预期操作。攻击复杂度低，无需特权，但需要用户交互。Chromium 官方评定该漏洞危害等级为中危，CVSS 评分 6.5。Google 已在 Chrome 132.0.6834.83 版本中修复此漏洞。"
published = "2025-01-15T11:15:10Z"
remediation = "升级 Google Chrome 至 132.0.6834.83 或更高版本（通过 Chrome 设置 > 关于 Chrome 自动更新），Fedora 用户执行 `dnf update chromium`。该漏洞通过竞态条件实现 UI 欺骗，无临时缓解措施，建议尽快更新。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome 框架竞争条件导致界面欺骗漏洞"
updated = "2026-06-17T08:26:28Z"

