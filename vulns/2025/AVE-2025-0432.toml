[basic]
description = "Qt SVG模块存在不受控制的递归漏洞（CWE-674），当模块渲染包含<pattern>元素的SVG文件时，可能陷入递归渲染循环导致栈溢出，引发拒绝服务（DoS）。该漏洞影响Qt 6 SVG模块及依赖其渲染SVG的Linux/Unix应用程序，CVSS 4.0评分9.4（CRITICAL），攻击向量为本地（AV:L），攻击复杂度低（AC:L），无需权限（PR:N）和用户交互（UI:N）。攻击者可构造恶意SVG文件，诱导受害应用渲染或通过自动化SVG处理服务触发递归调用，耗尽栈空间导致进程崩溃拒绝服务。目前厂商尚未提供补丁，受影响系统需限制不可信SVG文件处理或升级修复版本。"
published = "2025-10-03T16:16:16Z"
remediation = "更新 Qt 版本到 6.6.4 或更高版本，其中包含对 CVE-2025-10728 的修复。请从 The Qt Company 官方网站下载并安装最新安全更新。如需立即缓解，请在配置文件中添加 <pattern> 元素的最大深度限制，或在图形处理服务中禁用 SVG 文件处理。"
score = 9.4
severity = "CRITICAL"
sources = ["msrc"]
title = "Qt SVG 模块 不受控制的递归导致栈溢出拒绝服务漏洞"
updated = "2026-06-17T08:28:51Z"

