[basic]
description = "Drupal 8.5.x 低于 8.5.11 及 8.6.x 低于 8.6.10 版本存在远程代码执行漏洞，其部分字段类型未对来自非表单来源的数据进行充分过滤，攻击者可通过发送特制请求触发反序列化，在服务器上执行任意 PHP 代码。受影响站点需同时满足以下条件之一：启用 Drupal 8 核心 RESTful Web Services 模块并允许 PATCH 或 POST 请求，或启用了其他 Web 服务模块（如 Drupal 8 的 JSON:API、Drupal 7 的 Services 或 RESTful Web Services）。该漏洞利用网络可达、无需身份认证、无需用户交互，成功利用后可完全控制目标服务器，危害等级为 HIGH，CVSS 评分为 8.1。"
published = "2019-02-21T21:29:00Z"
remediation = "立即将 Drupal 8.5.x 升级至 8.5.11 版本，或将 Drupal 8.6.x 升级至 8.6.10 版本。如暂时无法升级，可暂时禁用核心 RESTful Web Services（rest）模块，或在系统设置中禁用 JSON:API、Services 等 Web 服务模块，并限制对 PATCH 和 POST 请求的访问权限作为临时缓解措施。Drupal 7 的 Services 模块本身无需更新，但需安装关联的贡献模块安全补丁。"
score = 8.1
severity = "HIGH"
sources = ["nuclei"]
title = "Drupal Core 远程代码执行漏洞"
updated = "2026-06-17T02:39:02Z"

