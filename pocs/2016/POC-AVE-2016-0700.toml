[info]
author = "AVE"
description = "Microsoft Edge Chakra 引擎 Array.filter 类型混淆漏洞 PoC。通过重写 Array 子类的 Symbol.species 属性，使 filter 方法返回一个超大数组对象，导致类型混淆和内存越界读取，可泄露内存信息或触发拒绝服务。"
id = "POC-AVE-2016-0700"
name = "CVE-2016-7200 PoC"
severity = "high"
tags = [
    "cve-2016-7200",
    "chakra",
    "edge",
    "type-confusion",
]
vuln_id = [
    "CVE-2016-7200",
    "AVE-2016-0700",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Array.filter",
    "type confusion",
    "chakra",
]
