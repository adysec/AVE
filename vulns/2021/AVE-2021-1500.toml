[basic]
description = "Chromium V8 JavaScript 引擎存在类型混淆漏洞。V8 在处理 HTMLEmbedElement 属性拦截器时存在逻辑缺陷，当 JavaScript 对象正在执行属性赋值操作期间，拦截器可能触发同步子帧加载并执行用户 JavaScript 代码，导致对象原型链和属性描述符处于损坏状态。攻击者可构造特制的 HTML 页面，利用 JIT 编译器的类型推断机制将普通 JavaScript 对象误当作数组处理，从而实现越界读写内存。该漏洞影响 Google Chrome 91.0.4472.101 之前的所有版本，以及基于 Chromium 的 Microsoft Edge、Opera 等浏览器。未经身份认证的远程攻击者只需诱导用户访问恶意网页即可触发漏洞，CVSS 评分 8.8，危害等级高。攻击者可利用该漏洞在浏览器进程中实现远程代码执行，Google 已在 2021 年 6 月安全更新中修复此漏洞。"
published = "2021-06-15T22:15:09Z"
remediation = '立即将 Google Chrome 升级至 91.0.4472.101 或更高版本。在 Windows 上依次点击"菜单→帮助→关于 Google Chrome"检查并安装最新稳定版更新；在 macOS 上通过 App Store 更新 Chrome；Linux 发行版用户请使用各发行版的软件包管理器更新 chromium 包。对于企业环境，可通过 Chrome Enterprise 的 AutoUpdateCheckPeriod 策略强制自动更新，或在防火墙/代理层面拦截对 V8 引擎相关漏洞页面的访问作为临时缓解。Chrome 内核的 Chromium 项目用户亦须升级至对应版本。更新后建议重启浏览器确认版本号已升至安全版本。'
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome V8 类型混淆漏洞"
updated = "2026-06-17T03:50:26Z"

