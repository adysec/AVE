[basic]
description = "Adobe Flash Player 10.3.183.5之前版本存在整数溢出漏洞，攻击者可通过向受影响的Flash Player发送特制的SWF文件触发该漏洞，导致远程代码执行。该漏洞影响Windows、Mac OS X、Linux、Solaris及Android平台，CVSS评分10.0，危害等级严重。Adobe已在2011年8月发布安全更新修复此漏洞，建议用户升级至10.3.183.5及以上版本。"
published = "2011-08-10T22:55:00Z"
remediation = "将 Adobe Flash Player 升级至 10.3.183.5 及以上版本（Windows/Mac/Linux/Solaris）或 10.3.186.3 及以上版本（Android），将 Adobe AIR 升级至 2.7.1 及以上版本。由于 Adobe Flash Player 已停止维护，建议彻底卸载 Flash Player 并在浏览器中禁用 Flash 插件以根除风险。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 整数溢出远程代码执行漏洞"
updated = "2026-06-16T23:30:46Z"

