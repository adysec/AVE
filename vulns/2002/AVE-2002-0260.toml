[basic]
description = "Powie PForum 1.14 及更早版本的 edituser.php 存在跨站脚本攻击（XSS）漏洞。该漏洞源于对用户名字段输入过滤不严，远程攻击者可构造包含恶意 JavaScript 代码的用户名，当管理员或其他用户查看该用户信息时脚本自动执行，从而窃取目标用户的 Cookie 或会话令牌。攻击者无需认证即可发起攻击，成功利用可导致用户身份被劫持、敏感信息泄露。该漏洞危害等级高，CVSS 评分 7.5。"
published = "2002-06-25T04:00:00Z"
remediation = "建议将 PForum 升级到最新可用版本。如厂商已停止维护，可在 edituser.php 中对 username 参数进行 HTML 实体编码输出，并过滤用户输入中的 <script>、<img> 等 HTML 标签。作为临时缓解措施，可在 Web 应用防火墙（WAF）层面添加规则拦截包含 JavaScript 事件处理器（如 onerror、onclick）的 username 请求。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Powie PForum 1.1x edituser.php 跨站脚本漏洞"
updated = "2026-06-16T21:57:12Z"

