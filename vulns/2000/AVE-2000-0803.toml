[basic]
description = "WircSrv IRC Server 5.07s 存在拒绝服务漏洞，远程攻击者可通过向服务器端口发送超长字符串，导致服务进程崩溃或资源耗尽，造成拒绝服务。该漏洞源于程序对输入长度缺乏有效校验，攻击者无需身份认证即可利用，攻击复杂度低。受影响版本为 WircSrv IRC Server 5.07s，CVSS 评分 5.0，危害等级中等。目前暂无官方补丁发布，建议限制对服务器端口的访问或升级至更高版本。"
published = "2000-07-10T04:00:00.000"
remediation = "WircSrv IRC Server 5.07s 已停止维护，官方未发布安全补丁。建议立即迁移至活跃维护的 IRC 服务器软件（如 UnrealIRCd 或 InspIRCd）。在迁移完成前，可在网络防火墙或服务器上配置规则，限制对 IRC 端口的访问来源 IP，并部署入侵检测系统拦截超长字符串请求作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "WircSrv IRC Server 5.07s 拒绝服务漏洞"
updated = "2026-06-16T21:52:12.800"

