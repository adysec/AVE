[basic]
description = "tags.<value>Hono 框架内置 CORS 中间件（hono/cors）在处理跨域预检请求（OPTIONS）时，使用存在回溯缺陷的正则表达式解析攻击者可控制的 Access-Control-Request-Headers 请求头。在默认配置（未设置 allowHeaders）下，当该请求头包含连续空白字符时，正则匹配的时间复杂度呈平方级增长，导致单个请求即可消耗大量 CPU 时间。未经身份认证的远程攻击者可通过发送携带超长空白序列的特制预检请求，使目标服务长时间无响应，造成拒绝服务。该漏洞影响所有使用默认 CORS 配置的 Hono 应用程序，但不会泄露或篡改数据。"
published = "2026-01-01T00:00:00Z"
remediation = '升级 Hono 到 4.12.34 或更高版本。如无法立即升级，可在 cors() 中间件中显式配置 allowHeaders 选项为具体允许的请求头列表（如 ["content-type", "authorization"]），避免使用默认空配置，从而绕过受影响的代码路径。同时建议在反向代理或网关层限制 Access-Control-Request-Headers 头的最大长度作为临时缓解。'
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Hono CORS 中间件正则表达式拒绝服务漏洞"
updated = "2026-01-01T00:00:00Z"

