[basic]
description = "Opera浏览器在11.50之前版本中存在拒绝服务漏洞。原理上，当用户访问大量无效URL时，浏览器会为每个无效URL生成错误页面并写入磁盘，导致磁盘空间被迅速耗尽，最终造成浏览器崩溃。攻击条件为远程攻击者诱导用户访问大量精心构造的无效URL即可触发该漏洞，无需身份认证。该漏洞影响Opera 11.50之前的所有版本，CVSS评分4.3，危害等级中危。"
published = "2011-07-01T10:55:01Z"
remediation = "升级 Opera 浏览器至 11.50 或更高版本。访问 https://www.opera.com 下载最新版本安装。如无法立即升级，可在防火墙或代理层面限制对不可信 URL 的访问，并定期清理浏览器错误页面缓存目录以缓解磁盘空间耗尽风险。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera Opera浏览器拒绝服务漏洞"
updated = "2026-06-16T23:29:10Z"

