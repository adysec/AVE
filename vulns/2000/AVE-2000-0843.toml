[basic]
description = "PostgreSQL 6.3.2/6.5.3 版本存在明文存储密码漏洞，数据库系统将用户名和密码以明文形式分别存储在 pg_shadow 和 pg_pwd 系统表中。拥有足够数据库权限的本地攻击者可直接查询这两张系统表，获取所有用户的明文凭据，进而冒充合法用户访问数据库、窃取敏感数据或提升权限。该漏洞属于本地信息泄露类型，CVSS 评分 4.6（AV:L/AC:L/Au:N/C:P/I:P/A:P），攻击需要本地访问权限且无需认证，影响机密性、完整性和可用性均为部分级别。PostgreSQL 后续版本已修复此问题，建议升级至修复版本并重置所有数据库账户密码。"
published = "2001-08-31T04:00:00Z"
remediation = "建议立即升级PostgreSQL到至少8.0版本（推荐10.x或更高版本），并确保使用至少128位的加密方式存储密码；编辑pg_hba.conf配置文件，修改密码存储方式，从plaintext改为md5或SHA-256加密；同时调整数据库访问权限，仅授权最小必要用户访问pg_shadow和pg_pwd等系统表；如无法立即升级，可通过修改PostgreSQL源代码禁用pg_pwd表并启用密码加密模块作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "PostgreSQL PostgreSQL 明文密码存储漏洞"
updated = "2026-06-16T21:53:21Z"

