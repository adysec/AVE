[basic]
description = "Samba 2.0.x 及 2.2 版本中存在任意文件创建漏洞。攻击者可通过 SMB/CIFS 协议向目标服务器发送特制的文件操作请求，利用 Samba 在处理文件路径时对用户输入过滤不严的缺陷，突破文件系统权限限制，在服务器上任意位置创建文件。成功利用此漏洞可导致攻击者在系统上创建恶意文件（如动态共享库、计划任务脚本或替代系统文件），为进一步权限提升或远程代码执行创造条件。该漏洞影响所有运行受影响 Samba 版本的 Linux/Unix 系统，无需身份认证即可远程触发，危害严重。"
published = "2001-06-23"
remediation = "立即升级 Samba 至 2.2.0a 或更高版本。各 Linux 发行版用户请安装对应安全补丁：Red Hat 更新至 RHSA-2001-086、Debian 应用 DSA-065、Mandrake 安装 MDKSA-2001-062。如无法升级，在 smb.conf 中移除 %m 宏的日志路径引用，并在防火墙阻断 137-139 及 445 端口的非可信访问作为临时缓解。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Samba 任意文件创建漏洞"
updated = "2001-06-23"

