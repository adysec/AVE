[basic]
description = "Windows 本地安全机构 (LSA) 存在检查时间与使用时间 (TOCTOU) 条件竞争漏洞，CWE-367。已获得本地低权限访问的授权攻击者可通过精心构造的操作触发条件竞争，在 LSA 处理安全凭据的过程中绕过权限检查，实现本地权限提升。成功利用该漏洞可获得系统最高权限，进而安装程序、查看/修改/删除数据或创建新账户。攻击复杂度较高，需精确控制竞争窗口时序。Microsoft 已在 2025 年 4 月安全更新中修复此漏洞。"
published = "2025-04-08T18:15:44Z"
remediation = "立即安装 Microsoft 2025 年 4 月安全更新。受影响版本对应修复版本号：Windows 10 1507 升级到 10.0.10240.20978，Windows 10 1607/Server 2016 升级到 10.0.14393.7969，Windows 10 1809/Server 2019 升级到 10.0.17763.7136，Windows 10 21H2 升级到 10.0.19044.5737，Windows 10 22H2 升级到 10.0.19045.5737，Windows 11 22H2 升级到 10.0.22621.5189，Windows 11 23H2 升级到 10.0.22631.5189，Windows 11 24H2 升级到 10.0.26100.3775，Server 2022 升级到 10.0.20348.3453。可通过 Windows Update 自动获取更新，或从 Microsoft 更新目录网站手动下载安装。临时缓解措施：限制本地用户对 LSA 子系统的交互式登录权限，并启用 Windows Defender Credential Guard 以降低 LSA 进程被利用的风险。"
score = 7
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 本地安全机构 (LSA) 特权提升漏洞"
updated = "2026-06-17T08:42:44Z"

