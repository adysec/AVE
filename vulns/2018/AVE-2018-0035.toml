[basic]
description = "Palo Alto Networks PAN-OS 的 GlobalProtect Portal 登录页面存在跨站脚本（XSS）漏洞。由于该页面未对用户输入的参数进行严格过滤和转义，未经身份认证的远程攻击者可以通过构造包含恶意 JavaScript 或 HTML 代码的特制 URL 链接，诱导目标用户访问。一旦用户点击该链接，恶意脚本将在其浏览器会话中执行，从而导致敏感 Cookie 泄露、会话劫持或页面内容篡改。该漏洞影响 PAN-OS 8.1.3 及之前版本。"
published = "2018-10-12T22:29:00Z"
remediation = "建议立即将 Palo Alto Networks PAN-OS 升级至 8.1.4 或更新版本，以修复 GlobalProtect Portal 登录页面的跨站脚本（XSS）漏洞。在无法立即升级的环境中，建议通过 Web 应用防火墙（WAF）拦截包含恶意 JavaScript 脚本的异常请求。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Palo Alto Networks PAN-OS GlobalProtect Portal 跨站脚本漏洞"
updated = "2026-06-17T01:33:35Z"

