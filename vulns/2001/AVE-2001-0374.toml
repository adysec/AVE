[basic]
description = "tags.<value>util-linux 软件包中的 vipw 工具在 2.10 版本之前存在权限配置缺陷，导致 /etc/shadow 密码哈希文件在部分场景下被设置为全局可读。此漏洞使本地攻击者无需额外权限即可读取密码哈希数据，进而通过暴力破解手段尝试获取用户密码。攻击条件为攻击者需具备本地账户访问权限，影响范围涵盖使用 util-linux 2.10 之前版本的 Linux 发行版系统。"
published = "2002-04-01T05:00:00Z"
remediation = "升级 util-linux 到 ≥2.10 版本以修复 /etc/shadow 权限漏洞，然后验证 root 所有文件权限已正确设置，不再 world-readable。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "util-linux vipw 影子文件权限配置错误漏洞"
updated = "2026-06-16T21:55:43Z"

