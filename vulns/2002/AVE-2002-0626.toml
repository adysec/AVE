[basic]
description = "标签之间。<value>Emu Webmail 5.0 的 emumail.cgi 脚本存在跨站脚本漏洞，由于对邮件地址字段未进行充分的输入验证和输出编码，远程攻击者可在该字段中注入任意 HTML 或 JavaScript 代码。当管理员或其他用户查看包含恶意内容的邮件或页面时，注入的脚本将在其浏览器中执行，可能导致会话劫持、Cookie 信息窃取或页面篡改等风险。该漏洞影响所有使用 Emu Webmail 5.0 版本的系统，攻击者无需身份认证即可远程利用，利用条件为受害者访问包含恶意脚本的页面。"
published = "2003-04-02T05:00:00Z"
remediation = "EMU Webmail 5.0 已停止维护且长期存在未修复漏洞，强烈建议迁移至当前受支持的 Webmail 系统（如 Roundcube、SquirrelMail 或 RainLoop）。如暂时无法替换，应在 emumail.cgi 中对 email 地址字段增加严格的输入过滤，禁止输入包含 &lt;script&gt;、javascript: 等 HTML/JavaScript 标签与协议的字符串，并在 Web 服务器层面部署 ModSecurity 等 WAF 规则拦截此类 XSS 注入请求。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Emumail EMU Webmail 跨站脚本漏洞"
updated = "2026-06-16T21:59:29Z"

