[basic]
description = "Cisco 340-series Aironet 无线接入点固件 11.01 存在 WEP 加密实现缺陷，其在 WEP 加密过程中未使用 24 个可用 IV（初始化向量）位中的 6 个，导致 IV 密钥空间被大幅缩小，攻击者无需身份认证即可通过被动捕获或主动注入数据包的方式进行暴力破解，大幅降低破解 WEP 密钥的计算成本。该漏洞影响 Cisco 340-series Aironet 系列接入点，远程攻击者成功利用后可窃取无线网络中的敏感传输数据。CVSS v2 评分 5.0，危害等级中等。"
published = "2001-01-01T05:00:00Z"
remediation = "将 Cisco 340-series Aironet 接入点固件从存在漏洞的 11.01 版本升级至 Cisco 发布的安全修复版本，升级后的固件将完整使用全部 24 位 IV（初始化向量）进行 WEP 加密，消除因仅使用 18 位 IV 导致的密钥空间缩减问题，使暴力破解攻击无法有效实施。升级前请先从 Cisco 官方支持站点下载对应硬件型号的补丁固件，按照 Cisco 文档完成固件刷新操作。如因业务原因暂无法升级固件，建议临时将接入点配置为仅接受已注册 MAC 地址的客户端关联，并通过 VLAN 隔离无线接入段，以限制未授权攻击者的接入范围。鉴于 WEP 协议本身存在已知设计缺陷，长期最佳实践是逐步将无线网络迁移至 WPA2-Enterprise 或 WPA3 加密方案，彻底消除 WEP 相关的安全风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Cisco 340系列 Aironet WEP加密弱随机数漏洞"
updated = "2026-06-16T21:53:47Z"

