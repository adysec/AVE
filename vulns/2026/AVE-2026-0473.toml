[basic]
description = "WatchGuard Fireware OS 的 IKEv2 协议处理逻辑中存在空指针解引用漏洞（CWE-476）。当设备配置了使用 IKEv2 的移动用户 VPN 或配置了动态网关对等体的分支办公室 VPN 时，未经身份认证的远程攻击者可通过向目标设备发送特制的 IKEv2 消息触发空指针解引用，导致 VPN 服务进程崩溃，造成拒绝服务（DoS）状态。该漏洞影响 Fireware OS 11.10.2 至 11.12.4_Update1、12.0 至 12.12 以及 2025.1 至 2026.2 版本，CVSS 评分 8.7，危害等级高。攻击者无需任何认证，仅需网络可达即可发起攻击，利用门槛极低。"
published = "2026-07-03T00:16:50Z"
remediation = "建议立即升级 Fireware OS 至修复版本：2026.x 分支升级到 2026.2.1，12.x 分支升级到 12.12.1，12.5.x（T15/T35 型号）升级到 12.5.19。11.x 版本已停止支持，须升级到受支持版本。该漏洞无临时缓解措施，升级是唯一修复方案。"
score = 8.7
severity = "HIGH"
sources = ["zdi"]
title = "WatchGuard Fireware OS IKEv2 空指针解引用漏洞"
updated = "2026-07-06T18:41:14Z"

