[info]
author = "ave"
description = "检测 GNU Emacs 对自定义 man URI 方案处理不当导致的命令注入漏洞。通过构造恶意 man: URI 链接，诱使用户在 Emacs 中打开，可执行任意 shell 命令。"
id = "POC-AVE-2025-0520"
name = "GNU Emacs man URI 命令注入 PoC"
severity = "high"
tags = ["cve-2025-1244"]
vuln_id = [
    "CVE-2025-1244",
    "AVE-2025-0520",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Emacs"]
