[basic]
description = "WebKit 浏览器引擎存在内存破坏漏洞，远程攻击者可通过构造恶意网页向目标系统发送特制内容，触发内存错误导致应用程序崩溃或远程代码执行。该漏洞影响 Apple Safari 6.0 之前版本及 iOS 6.0 之前版本，攻击者只需诱导用户访问恶意网页即可利用，无需身份认证。成功利用可造成远程代码执行，CVSS 评分高达 9.3，危害等级严重。Apple 已在 iOS 6 和 Safari 6 中修复此漏洞。"
published = "2012-07-25T20:55:03.353"
remediation = '对于 macOS 系统：升级到 Safari 6.0 或更高版本，可通过 App Store 的软件更新功能直接安装，或升级到 OS X Lion v10.7.4 及以上版本获取 Safari 6.0。对于 iOS 设备：升级到 iOS 6 或更高版本，连接设备至电脑后通过 iTunes 下载并安装系统更新，或将设备连接 Wi-Fi 后在"设置"→"通用"→"软件更新"中进行 OTA 升级。苹果已在 iOS 6 和 Safari 6.0 的 WebKit 引擎中改进了内存处理机制，修复了该内存破坏漏洞。无法立即升级的用户应避免点击未知来源链接或访问不可信网站，以降低遭受远程攻击的风险。'
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:37.447"

