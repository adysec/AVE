[basic]
description = 'Rust 的 shlex crate（<1.2.1）在处理命令行参数分割时，未正确转义未加引号的 `{` 字符和 `\xa0`（不间断空格）字符，导致生成的 shell 命令字符串可能被注入额外参数。本地攻击者可通过构造包含恶意载荷的输入，在目标系统上执行非预期的命令操作。该漏洞影响所有使用 shlex crate 解析 shell 命令的 Rust 应用，CVSS 评分 3.2，危害等级低，利用条件较为苛刻（需本地访问且攻击复杂度高）。'
published = "2025-07-27T22:15:25Z"
remediation = '立即将 Rust 项目依赖中的 shlex crate 升级至 1.2.1 或更高版本（`cargo update -p shlex`），该版本已修复未引号包裹的 `{` 和 `\xa0` 字符处理问题。如无法立即升级，在调用 shlex::split 或 shlex::try_split 前对所有输入进行严格的白名单过滤，禁止包含 `{` 和 `\xa0` 字符的字符串传入。'
score = 3.2
severity = "LOW"
sources = ["msrc"]
title = "Rust shlex crate 命令注入漏洞"
updated = "2026-06-17T08:14:44Z"

