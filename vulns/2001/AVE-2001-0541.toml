[basic]
description = "Apache Web 服务器在记录客户端请求日志时，未对用户提交的 HTTP 请求中的控制字符进行过滤或转义处理，导致日志文件中包含可直接由客户端注入的原始控制字符。远程攻击者可通过在 HTTP 请求中插入特殊控制字符（如退格符、换行符等），在使用 cat、tail、grep 等 UNIX 标准工具查看日志时隐藏恶意请求记录或伪造源 IP 地址，从而绕过日志审计。该漏洞影响 Apache HTTP Server 多个版本，攻击条件低（无需认证），危害表现为日志完整性破坏与审计绕过。"
published = "2001-12-31T05:00:00Z"
remediation = "升级 Apache HTTP Server 至 1.3.31 及以上版本，或 2.0.49 及以上版本，这些版本已对日志中的控制字符进行转义处理。如无法立即升级，应避免直接使用 cat、tail、grep 等 UNIX 工具查看原始日志，改用支持控制字符过滤的日志分析工具，并在日志查看前通过管道对控制字符进行转义清洗。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Apache HTTP Server 日志文件信息泄露漏洞"
updated = "2026-06-16T21:56:30Z"

