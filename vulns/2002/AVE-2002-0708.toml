[basic]
description = "Microsoft Windows Media Player 6.3 至 7.1 版本的 mplay32.exe 组件存在缓冲区溢出漏洞。远程攻击者可通过向 Windows Media Player 传递包含超长文件名的 MP3 文件作为命令行参数来触发该溢出，进而执行任意系统命令。该漏洞影响 Windows Media Player 6/7 用户，但由于已知攻击向量需要获得目标系统的命令行访问权限，实际可利用性可能受限。攻击者需诱导用户在受影响的播放器中打开恶意的 MP3 文件，成功利用后可获得与用户同等权限，导致系统被完全控制。"
published = "2002-12-31T05:00:00Z"
remediation = "立即升级 Windows Media Player 至 9.0 或更高版本，该版本已修复 mplay32.exe 的文件名缓冲区溢出问题。如暂无法升级，应卸载 Windows Media Player 6.x/7.x 或通过组策略禁用 mplay32.exe 的执行权限，并避免打开来自不可信来源的 MP3 文件或通过命令行参数调用 mplay32.exe。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft Windows Media Player 文件名缓冲区溢出漏洞"
updated = "2026-06-16T22:00:10Z"

