description = "NetScreen 防火墙 WebUI 存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向 Web 管理界面发送超长 URL 请求触发溢出，导致防火墙拒绝服务。该漏洞影响 ScreenOS 1.73 及 2.x 版本的 Web 管理接口，攻击者仅需通过网络向目标设备的管理端口发送特制长 URL 即可造成服务中断。CVSS 评分 5.0，危害等级为中危。"
