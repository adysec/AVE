[basic]
description = "Windows 2000 简体中文版输入法编辑器（IME）存在权限提升漏洞，由于系统未正确限制对特权功能的访问，导致本地用户可通过调用 IME 中本应受限的敏感功能来获取更高系统权限。攻击者需拥有本地登录权限，利用该漏洞可实现权限提升，获取对系统资源的完全控制。该漏洞影响 Windows 2000 简体中文版系统，CVSS 评分 4.6，危害等级中危。"
published = "2000-12-19T05:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-069 提供的补丁（KB270676），下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=6CD4A747-9DE4-4F2F-817F-92BB597B8F5B。如无法安装补丁，可在控制面板中卸载简体中文输入法编辑器（IME），或限制本地物理键盘访问和终端服务器会话权限作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows 2000 简体中文版输入法权限提升漏洞"
updated = "2026-06-16T21:52:47.940"

