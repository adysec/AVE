[basic]
description = "websocket-driver 库在与 permessage-deflate 扩展配合使用时存在资源限制绕过漏洞。该库在检查 WebSocket 消息大小时仅校验压缩帧的长度头，而非解压后的实际数据大小，导致攻击者可通过发送精心构造的压缩消息绕过最大消息大小限制，使服务端或客户端接受超出预期大小的消息，从而耗尽系统资源（CPU/内存），造成拒绝服务。该漏洞影响所有使用 websocket-driver 且启用 permessage-deflate 扩展的 Ruby 应用，攻击者无需身份认证即可远程触发。官方已在 0.8.1 版本中修复，在扩展处理完成后重新校验消息长度。"
published = "2026-07-17T20:17:26Z"
remediation = "立即将 websocket-driver 升级至 0.8.1 或更高版本，该版本在扩展处理完成后检查消息长度以修复压缩绕过问题。如无法升级，可在应用层对 WebSocket 消息解压后的大小进行二次校验，拒绝超过配置最大值的消息。同时建议禁用 `permessage-deflate` 扩展作为临时缓解措施。"
score = 6.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Faye websocket-driver 消息压缩资源限制绕过漏洞"
updated = "2026-07-23T18:14:09Z"

