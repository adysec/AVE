[basic]
description = "fetchmail 5.5.0-2及更早版本在处理AUTHENTICATE GSSAPI认证命令时存在严重安全漏洞，未经身份认证的远程攻击者可通过向客户端发送特制的GSSAPI认证响应数据触发该漏洞，实现远程代码执行。该漏洞影响fetchmail 4.5.1至5.5.0-2在内的全部历史版本，CVSS评分高达10.0分。攻击者无需任何凭据，只需控制邮件服务器或在中间人攻击场景下发送畸形认证数据即可利用此漏洞，完全获取受影响系统的机密性、完整性和可用性。"
published = "2001-02-12T05:00:00.000"
remediation = "立即升级 fetchmail 到 6.0 或更高版本，该版本修复了 GSSAPI 认证命令的处理漏洞。安装 Red Hat 发布的安全补丁包（RHBA-2000-106），并确保已应用对 AUTHENTICATE GSSAPI 命令的完整验证修正。如无法立即升级，可通过防火墙限制对邮件服务器的 GSSAPI 认证访问，并禁用旧版的认证方法作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Fetchmail AUTHENTICATE GSSAPI 远程代码执行漏洞"
updated = "2026-06-16T21:53:39.420"

