[basic]
description = "WordPress的Abandoned Cart Lite for WooCommerce和Abandoned Cart Pro for WooCommerce插件存在存储型跨站脚本漏洞，影响版本分别低于等于5.1.3和7.12.0。该漏洞源于插件对用户输入缺乏充分的过滤及输出转义，未经身份认证的远程攻击者可通过多个参数注入任意Web脚本，当管理员访问后台仪表板时，恶意脚本将在其浏览器中执行，从而导致会话劫持、权限提升或数据窃取等风险。"
published = "2023-06-22T02:15:47.730"
remediation = "立即将 Abandoned Cart Lite for WooCommerce 升级至 5.2.0 或更高版本，将 Abandoned Cart Pro for WooCommerce 升级至 7.12.1 或更高版本。升级方式为进入 WordPress 后台的「插件」页面，点击对应插件的「立即更新」按钮，或手动下载最新安装包覆盖上传至 /wp-content/plugins/ 目录。如暂时无法升级，可在网站防火墙（WAF）中配置规则拦截包含 script、iframe、onerror 等关键词的请求体，作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["nuclei"]
title = "WooCommerce Abandoned Cart Lite和Pro插件存储型跨站脚本漏洞"
updated = "2026-06-17T02:31:42.907"

