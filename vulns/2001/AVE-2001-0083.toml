[basic]
description = 'carey internets services 开发的 commerce.cgi 脚本 2.0.1 版本存在目录遍历（Directory Traversal）漏洞。由于该 CGI 脚本在处理用户提交的查询参数时，未对包含路径分隔符与"../"之类的特殊字符进行充分的过滤与规范化处理，远程攻击者无需身份认证，仅需通过 Web 请求在 URL 参数中构造包含多个"../"的相对路径，即可突破脚本所在目录的访问限制，从而越权读取目标服务器上任意位置的敏感文件，例如系统配置文件、密码文件或应用源码等。此类漏洞通常配合同路径下的其他 CGI 功能或脚本（如该产品套件中的其他脚本）进一步被利用，扩大攻击影响面。该漏洞影响所有部署了 carey.cgi 2.0.1 版本的网站服务器，CVSS 综合评分较低，危害级别属于中低危，攻击者获取到的任意文件读取能力在特定环境下可进一步演变为信息泄露甚至代码执行，需通过升级到已修复该问题的版本或对参数输入进行严格过滤来加以防范。'
published = "2001-06-02T00:00:00Z"
remediation = '立即停用并升级 commerce.cgi 至官方最新版本（若厂商已停止维护，建议停用该脚本并迁移至现代替代方案）。若无法立即升级，应在 Web 服务器层面对该脚本目录配置访问控制，仅允许受信任来源访问，并通过反向代理对其请求的路径参数进行过滤，阻断包含 "../"、"\.." 及空字节编码（如 %2e%2e%2f）的输入；同时升级 CGI 脚本网关（mod_cgi 等）并加固防火墙策略，防止任意目录文件被读取。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Carey Internet Services Commerce.cgi 2.0.1 目录遍历漏洞"
updated = "2001-06-02T00:00:00Z"

