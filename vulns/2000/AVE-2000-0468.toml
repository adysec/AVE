[basic]
description = "Flowerfire SawMill 5.0.21 在存储用户密码时采用了弱加密机制，攻击者获取到存储的密码密文后可以轻易解密还原出明文密码。获得明文密码的攻击者能够登录 SawMill 管理界面并任意修改软件的审计配置，导致日志分析结果的可信度受损及审计完整性遭到破坏。此漏洞要求攻击者具备读取 SawMill 配置文件或数据库的权限，利用弱加密实现密码窃取与配置篡改。"
published = "2000-01-01"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Flowerfire Sawmill 5.0.21 弱密码加密漏洞"
