[basic]
description = "Microsoft 基础类库（MFC）中存在不安全库加载漏洞（CWE-426），源于 MFC 在加载 dwmapi.dll 等库文件时使用了固定路径而非安全搜索路径。本地攻击者可将恶意构造的 dwmapi.dll 放置在包含特制 TRC、cur、rs、rct 或 res 文件的当前工作目录中，当用户使用 AtlTraceTool8.exe（ATL MFC 跟踪工具）等 MFC 应用程序打开这些文件时，系统会优先加载当前目录下的恶意 DLL 而非系统目录中的合法版本，从而导致任意代码执行。该漏洞影响 Microsoft Visual Studio .NET 2003 SP1、Visual Studio 2005/2008/2010、Visual C++ 2005/2008/2010 以及 Exchange Server 2010/2013 等多个产品，CVSS 评分 7.8，危害等级高。攻击者需要诱导用户打开位于包含恶意 DLL 目录中的特制文件，利用条件需要用户交互。"
published = "2010-08-31T20:00:02Z"
remediation = "安装 Microsoft 2011 年 4 月安全公告 MS11-025（KB2500212）提供的更新，包括 Visual Studio .NET 2003 SP1 (KB2465373)、Visual Studio 2005 SP1 (KB2538218)、Visual Studio 2008 SP1 (KB2538241)、Visual Studio 2010 (KB2542054) 及 Visual C++ 可再发行组件包对应更新。可通过 Microsoft Update 自动获取。临时缓解措施：禁用 WebClient 服务，或在防火墙层面阻止 TCP 139/445 端口以阻断 SMB/WebDAV 远程攻击向量。"
score = 7.8
severity = "HIGH"
sources = ["tenable"]
title = "Microsoft MFC 库不安全库加载漏洞"
updated = "2026-06-16T23:22:20Z"

