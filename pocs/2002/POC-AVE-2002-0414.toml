[info]
author = "AVE"
description = "SquirrelMail 1.2.3 之前版本的拼写检查插件 check_me.mod.php 未正确过滤 sqspell_command 参数，攻击者可通过构造 SQSPELL_APP 和 sqspell_use_app 参数注入任意系统命令。发送特制 GET 请求后，若服务器返回命令执行结果则存在漏洞。"
id = "POC-AVE-2002-0414"
name = "SquirrelMail 拼写检查插件远程命令执行 PoC"
severity = "high"
tags = [
    "cve-2002-1650",
    "squirrelmail",
    "rce",
    "command-injection",
]
vuln_id = [
    "CVE-2002-1650",
    "AVE-2002-0414",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/plugins/squirrelspell/modules/check_me.mod.php"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
