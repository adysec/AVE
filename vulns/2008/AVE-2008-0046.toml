[basic]
description = "标签中。<value>Adobe Flash Player 9.0.124.0及更早版本存在跨站脚本（XSS）漏洞。该漏洞的原理是攻击者可通过构造包含恶意脚本的特殊HTTP响应头，利用Flash Player对响应头数据的处理不当，将任意JavaScript代码或HTML内容注入到目标网页中。受影响的范围包括安装了上述版本Flash Player的所有Windows、Mac OS X及Linux系统用户。攻击条件为受害者使用受影响的Flash Player访问攻击者控制的恶意网页或嵌入了恶意内容的正常网页。利用方式为远程攻击者通过特制的HTTP响应头向浏览器注入脚本，在用户浏览时执行，从而窃取会话Cookie、重定向用户至钓鱼网站或进行其他恶意操作。"
published = "2008-11-10T14:12:55Z"
remediation = "建议立即卸载已停止支持的 Adobe Flash Player 插件。若必须在旧环境下运行，请将 Adobe Flash Player 升级至 9.0.125.0 或更高版本，以修复通过 HTTP 响应头注入恶意脚本的跨站脚本漏洞。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Adobe Flash Player 跨站脚本漏洞"
updated = "2026-06-16T22:58:36Z"

