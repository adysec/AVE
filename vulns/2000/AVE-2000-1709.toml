[basic]
description = "Evolvable Shambala Server 4.5 以明文形式存储用户密码，本地攻击者可通过直接读取服务器配置文件或数据库获取所有用户的明文凭据。由于密码未经过任何哈希或加密处理，攻击者获得这些凭据后可冒充合法用户登录服务器，进而完全控制服务器系统。该漏洞攻击复杂度低，无需特殊权限即可利用，CVSS 评分 10.0，危害严重。厂商至今未发布安全更新修复此问题。"
published = "2000-12-19T05:00:00.000"
remediation = "立即停止使用已停止维护的 Shambala Server 4.5，迁移至支持密码加密存储的现代 FTP/HTTP 服务器软件（如 vsftpd、Apache 等）。如无法立即替换，应严格限制本地用户对服务器配置文件和密码存储目录的访问权限，确保仅授权管理员可读取相关文件，并定期审计所有本地用户账户。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Evolvable Shambala Server 4.5 明文密码存储漏洞"
updated = "2026-06-16T21:52:50.810"

