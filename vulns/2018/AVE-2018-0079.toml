[basic]
description = "Apache Tika-server 在 1.7 至 1.17 版本中存在命令注入漏洞。该漏洞源于服务器对客户端发送的特定 HTTP 请求头缺乏严格校验，攻击者可以通过构造恶意的请求头，将指令注入到服务器执行的命令行参数中。当 tika-server 部署在面向不可信客户端的公网环境时，远程未经身份验证的攻击者可利用此漏洞在目标服务器上执行任意系统命令，从而导致服务器完全被接管。建议升级至 Tika 1.18 或更高版本以修复此漏洞。"
published = "2018-04-25T21:29:00Z"
remediation = "建议立即将 Apache Tika 升级到 1.18 或更高版本。如果无法立即升级，应通过防火墙限制 tika-server 的访问权限，确保其不对不受信任的外部客户端开放，以防止远程命令注入攻击。"
score = 8.1
severity = "HIGH"
sources = ["nuclei"]
title = "Apache Tika-server 远程命令执行漏洞"
updated = "2026-06-17T01:51:02Z"

