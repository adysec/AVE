[basic]
description = "WordPress my-calendar 插件在 3.1.10 之前版本中存在反射型跨站脚本（XSS）漏洞。攻击者可通过构造包含恶意 JavaScript 脚本的特制 URL（如 rsd 参数），当用户点击该链接访问目标网站时，未经过滤的 URL 参数被直接回显到页面中，导致恶意脚本在受害者的浏览器中执行。该漏洞影响所有使用受影响版本 my-calendar 插件的 WordPress 站点，CVSS 评分 6.1。成功利用该漏洞可导致攻击者在站点上下文中执行任意脚本，进而窃取用户会话 Cookie、获取敏感信息或对网站进行篡改。my-calendar 插件维护者已在 3.1.10 版本中修复此问题，建议用户尽快升级至最新版本。"
published = "2019-08-28T12:15:12.810"
remediation = "将 WordPress 的 my-calendar 插件升级至 3.1.10 或更高版本以修复 XSS 漏洞。进入 WordPress 后台，导航至「插件」→「已安装插件」，找到 My Calendar 插件并点击「立即更新」。如后台更新失败，可手动下载 3.1.10 或更高版本安装包，通过「上传插件」方式覆盖安装。升级完成后清除站点缓存，并建议在 Web 应用防火墙（WAF）中配置针对 URL 参数的 XSS 过滤规则作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress my-calendar 插件跨站脚本漏洞"
updated = "2026-06-17T02:20:55.543"

