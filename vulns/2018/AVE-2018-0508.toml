[basic]
description = "DNN（DotNetNuke）9.2至9.2.2版本使用弱加密算法保护输入参数，攻击者可通过分析加密参数实现信息泄露。该漏洞源于对CVE-2018-15811的不完整修复，攻击者无需身份认证即可远程利用，攻击复杂度低，且无需用户交互。成功利用可导致敏感信息泄露，影响系统机密性。CVSS评分7.5，危害等级高。"
published = "2019-07-03T17:15:10Z"
remediation = "升级 DNN (DotNetNuke) 至 9.2.3 或更高版本，该版本已修复输入参数加密算法强度不足的问题。如无法立即升级，可在 Web.config 中启用 customErrors 并配置 HTTPS 强制重定向，同时在应用层对敏感输入参数增加额外的 HMAC 签名校验作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "DNN (DotNetNuke) 弱加密算法漏洞"
updated = "2026-06-17T01:47:00Z"

