[basic]
description = "CGIWrap 2.x及3.7之前版本存在跨站脚本(XSS)漏洞。远程攻击者可通过向CGIWrap发送特制请求，将恶意JavaScript代码注入到CGIWrap生成的错误消息中，当其他用户访问包含恶意内容的错误页面时，脚本将在用户浏览器中执行，导致敏感信息泄露、会话劫持等危害。攻击无需认证，利用难度低，影响所有使用受影响CGIWrap版本的Web服务器。"
published = "2001-07-22T04:00:00Z"
remediation = '升级到 CGIWrap 3.7 或更高版本（最新为 4.2），3.7 版本已对错误消息中的用户输入进行 HTML 编码以修复 XSS 漏洞。如使用 4.1+ 版本，建议在编译时通过 `--with-charset=iso-8859-1` 选项指定字符集，防止 IE 浏览器因未指定字符集而触发 XSS。无法升级时，可在 Web 服务器（如 Apache）层面配置 `Header set X-Content-Type-Options "nosniff"` 并启用 WAF 规则过滤错误页面中的恶意脚本。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Nathan Neulinger CGIWrap 跨站脚本攻击漏洞"
updated = "2026-06-16T21:55:21Z"

