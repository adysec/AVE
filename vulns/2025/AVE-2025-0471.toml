[basic]
description = "GNU Binutils 2.43 版本的链接器组件（ld）中 libiberty/xmalloc.c 文件的 xstrdup 函数存在内存泄漏漏洞（CWE-401）。该漏洞源于程序在内存分配后未能正确释放已分配的内存，导致资源耗尽。攻击者需要较高的攻击复杂度且利用难度较大，但理论上可通过远程方式触发该漏洞，造成目标系统内存资源逐渐耗尽，影响链接器正常功能。该漏洞影响 GNU Binutils 2.43 版本，CVSS 评分 2.3，危害等级低。官方已在 binutils master 分支中修复此问题，建议用户更新至修复版本。"
published = "2025-02-10T15:15:13Z"
remediation = "升级 GNU Binutils 至 master 分支最新提交（所有内存泄漏已在 master 修复），或安装发行版厂商补丁（如 SUSE 已发布 SUSE-SU-2025:4096-1 更新至 binutils 2.4 版本）。如无法立即更新，可在编译时禁用 ld 的 -z gcs=implicit 选项作为临时缓解措施。"
score = 2.3
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils ld 组件 xstrdup 函数内存泄漏漏洞"
updated = "2026-06-17T08:38:28Z"

