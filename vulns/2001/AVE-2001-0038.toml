[basic]
description = "FreeBSD 1.5 系统中的 telnetd 守护进程存在环境变量处理不当的安全漏洞。本地攻击者可通过修改影响 telnetd 行为的关键环境变量（如 TERM、PATH 等），在 telnetd 以 root 权限执行时触发该漏洞，从而获得系统的 root 完全控制权限。该漏洞影响 FreeBSD 1.5 版本，CVSS 评分 7.2，危害等级高。攻击者需要具备本地系统访问权限方可利用。"
published = "2001-02-12T05:00:00Z"
remediation = "立即升级 FreeBSD 至 2.0 及以上版本，该漏洞已在后续版本中修复。如无法升级，建议禁用 telnetd 服务，改用 SSH 替代远程登录，并在 /etc/inetd.conf 中注释 telnet 行后重启 inetd 服务。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "FreeBSD Telnetd 本地权限提升漏洞"
updated = "2026-06-16T21:53:38Z"

