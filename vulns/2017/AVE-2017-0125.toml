[basic]
description = "IceWarp Server 11.3.1.5 的 Webmail 组件中的 language 参数存在跨站脚本（XSS）漏洞（CWE-79），未经身份认证的远程攻击者可通过构造包含恶意 JavaScript 代码的特制 URL，利用该参数将脚本注入到用户浏览器中执行。当用户点击攻击者发送的恶意链接并访问 IceWarp Webmail 页面时，注入的脚本将在用户会话上下文中运行，导致攻击者可窃取会话 Cookie、劫持用户账户或进一步实施钓鱼攻击。该漏洞影响所有访问 IceWarp Webmail 界面的用户，攻击向量为网络，攻击复杂度低，且需要用户交互才能触发。IceWarp 作为企业级邮件与协作平台，被众多组织部署用于邮件服务和团队协作，因此该漏洞潜在影响面较广，危害等级中等。"
published = "2017-08-31T21:29:00Z"
remediation = "立即升级 IceWarp Server 至最新稳定版本（当前为 14.x 系列），或在 Web 服务器前端部署 WAF 规则过滤 webmail 组件 language 参数中的尖括号与脚本标签。如无法立即升级，可临时在 Web 服务器层面对 /webmail/ 路径启用 XSS 过滤规则，拦截包含 <script>、onerror、javascript: 等关键词的请求。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "IceWarp Webmail 跨站脚本漏洞"
updated = "2026-06-17T01:25:20Z"

