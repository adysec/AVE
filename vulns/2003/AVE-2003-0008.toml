[basic]
description = "ISC DHCPD 3.0 至 3.0.1RC10 版本的 minires 库在错误处理例程中存在多处堆栈缓冲区溢出漏洞。该漏洞源于 NSUPDATE 功能处理 DHCP 消息时，未对过长的主机名字段进行边界检查。远程未认证攻击者可通过发送包含超长主机名的特制 DHCP 数据包触发溢出，在目标系统上以 dhcpd 进程权限执行任意代码。攻击无需任何前置条件，仅需目标运行受影响版本的 DHCP 服务并监听 67/68 端口。成功利用将导致服务器完全沦陷，攻击者可获取系统控制权、窃取敏感数据或进一步横向渗透。CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），属高危漏洞，对网络基础设施构成严重威胁。"
published = "2003-01-17T05:00:00Z"
remediation = "升级 ISC DHCPD 至 3.0.1RC11 或更高版本（如 3.0.1 正式版、3.0.2 等），该版本已修复 minires 库中的栈缓冲区溢出漏洞。若暂时无法升级，可在 DHCP 服务器前部署防火墙规则，限制仅允许可信网段访问 67/68 端口，或在 dhcpd.conf 中禁用 NSUPDATE 功能（移除 allow updates 或 ddns-updates 配置）作为临时缓解措施。建议从 ISC 官网 (https://www.isc.org/downloads/dhcp/) 下载最新稳定版本并重新编译安装。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "ISC DHCPD 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T22:01:22Z"

