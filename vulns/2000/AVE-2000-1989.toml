[basic]
description = "iPlanet Web Server 4.x 的 SHTML 日志记录功能存在缓冲区溢出漏洞。远程攻击者可通过向服务器发送包含超长文件名的 .shtml 扩展名请求，触发缓冲区溢出，导致任意代码执行。该漏洞无需身份认证，攻击复杂度低，CVSS 评分 10.0，危害等级严重。成功利用此漏洞的攻击者可完全控制受影响服务器，窃取敏感数据、植入后门或发起进一步攻击。受影响的版本包括 iPlanet Web Server 4.x 系列。"
published = "2000-12-11T05:00:00.000"
remediation = "iPlanet Web Server 4.x 已停止维护，建议立即升级至 Oracle iPlanet Web Server 7.0 或更高版本。如无法升级，可在配置中禁用 SHTML 日志记录功能，并在前端部署 WAF 对请求文件名长度进行严格限制（如限制 .shtml 文件名不超过 255 字符），同时限制仅允许可信 IP 访问管理接口。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "iPlanet Web Server SHTML 日志功能缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:06.163"

