[basic]
description = "Mozilla Firefox/Thunderbird/SeaMonkey 的 IndexedDB 组件中存在一处释放后重用（Use-After-Free）漏洞，位于 IDBKeyRange::cycleCollection::Trace 函数中。当处理特制的 IndexedDB 数据时，程序未能正确管理内存对象的生命周期，导致已释放的内存指针被再次引用。远程攻击者可通过诱导用户访问包含恶意 IndexedDB 数据的网页，触发该内存错误，进而实现任意代码执行。受影响的版本包括 Firefox 4.x 至 11.0、Firefox ESR 10.x 至 10.0.4、Thunderbird 5.0 至 11.0、Thunderbird ESR 10.x 至 10.0.4 以及 SeaMonkey 2.9 之前版本。该漏洞 CVSS 评分为 10.0，危害等级为严重。"
published = "2012-04-25T10:10:17Z"
remediation = "升级 Firefox 至 12.0 及以上版本（ESR 通道升级至 10.0.4），升级 Thunderbird 至 12.0 及以上版本（ESR 通道升级至 10.0.4），升级 SeaMonkey 至 2.9 及以上版本。如无法立即升级，可在浏览器中禁用 JavaScript（设置 about:config 中 dom.indexedDB.enabled 为 false）作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey IndexedDB 释放后使用远程代码执行漏洞"
updated = "2026-06-16T23:37:21Z"

