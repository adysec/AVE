[basic]
description = "Jenkins 使用的 Stapler Web 框架在 MetaClass.java 中存在 URL 处理缺陷，允许攻击者通过访问精心构造的 URL 来调用 Java 对象的非预期方法。远程未经身份验证的攻击者可以通过向目标发送特制请求触发该漏洞，从而在服务器上执行任意代码，导致系统被完全接管。该漏洞影响 Jenkins 2.153 及其之前的版本，以及 LTS 2.138.3 及其之前的版本。"
published = "2018-12-10T14:29:01Z"
remediation = "建议立即将 Jenkins 升级至 2.154 或 LTS 2.138.4 及更高版本。如果无法立即升级，可通过配置严格的访问控制列表（ACL）限制对敏感 URL 的访问，或在 Web 应用防火墙（WAF）中拦截包含异常 Java 方法调用特征的请求作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Jenkins Stapler Web Framework 远程代码执行漏洞"
updated = "2026-06-17T01:33:11Z"

