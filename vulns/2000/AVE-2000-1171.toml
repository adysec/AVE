[basic]
description = 'Apache JServ 1.1.2 的 jserv.conf 配置文件中，jserv-status 处理器的默认配置包含 "allow from 127.0.0.1" 行，导致本地用户可通过直接向 jserv/ URI 发送请求来获取 JDBC 密码或其他敏感信息。该漏洞源于不安全的默认访问控制配置，攻击者只需拥有本地访问权限即可利用，无需认证。CVSS 评分 2.1，危害等级低，但可能导致数据库凭据泄露，进而引发更严重的安全问题。'
published = "2011-10-05T02:56:24Z"
remediation = '修改 jserv.conf 中 jserv-status 处理器配置，移除或注释掉 "allow from 127.0.0.1" 行，或将其替换为 "deny from all" 以完全禁用远程访问。建议升级至 Apache Tomcat（Apache JServ 已停止维护），并限制对 /jserv/ 路径的访问，仅允许受信任的管理员 IP 访问状态页面。'
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Apache JServ jserv-status处理器配置错误漏洞"
updated = "2026-06-16T21:53:27Z"

