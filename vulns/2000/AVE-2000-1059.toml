[basic]
description = """
tags.

The validator says "description: description 字段为空" — but actually the current TOML has the description content inside a multi-line string after "tags. Must be Chinese...". This looks like malformed content where the AI's scaffolding text ("tags. Must be Chinese, ≥50 chars...") got prepended into the description.

My task: output the fixed description value between <value> tags. I need to provide a clean Chinese description ≥50 chars covering principle, scope, attack conditions.

Let me just provide a clean description.<value>CVE-2000-1039 属于被统称为"NAPTHA"的拒绝服务漏洞类别，涉及多种 TCP/IP 协议栈及网络应用程序。漏洞原理是：远程攻击者向目标主机持续发送大量 TCP 连接尝试请求，并顺利完成 TCP/IP 三次握手建立连接，但在攻击者一方不维护连接状态、不发后续数据也不释放资源，导致目标主机被迫为海量已建立的悬空连接保留内核资源（内存、套接字、文件描述符等），最终因资源耗尽无法处理正常请求，造成拒绝服务。该漏洞影响未打补丁的 Windows 95/98/98SE/NT 4.0 等操作系统，以及各类存在连接管理缺陷的网络应用。攻击条件为无需任何认证，远程即可实施，仅需目标主机可达，利用门槛较低，可严重破坏受害主机的可用性。"""
published = "2001-01-09T05:00:00.000"
remediation = "建议尽快安装微软针对该漏洞发布的最新补丁。对于 Windows NT 4.0，需升级至包含 TCP/IP 栈补丁的服务包（如 Service Pack 6a 后续的累积更新）并同步更新系统文件；对于 Windows 95/98/98SE，请安装微软官方提供的网络组件修复更新包。由于攻击本质是攻击者以海量 TCP 半连接耗尽目标系统资源（NAPTHA 攻击族），在无法及时打补丁时，可在边界防火墙/路由器上配置连接速率限制与超时阈值，并启用 SYN Cookie 防护以缓解 TCP 半开放连接洪泛；同时对内网主机部署入侵检测系统，检测异常的 TCP 半连接流量并进行告警与限流。"
score = 5
severity = "MEDIUM"
