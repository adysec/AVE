[basic]
description = "kon2 是一款在日本广泛使用的日语终端仿真器，运行于 Unix/Linux 等操作系统上。该软件在 0.3.9b 及更早版本中存在本地缓冲区溢出漏洞，当用户通过命令行启动 kon2 并使用 -Coding 参数指定编码方式时，若传入超长的参数值，将触发缓冲区溢出。由于这是一个本地可执行程序的命令行参数处理缺陷，攻击者需要能够直接在目标系统上执行命令，溢出成功后可导致任意代码执行，从而完全控制受影响的主机。该漏洞仅影响本地用户层面，但鉴于攻击者一旦获得本地 shell 权限即可轻松利用此漏洞提权，CVSS 评分为 7.2，危害等级为重要。受影响的系统包括安装了旧版本 kon2 的各类 Unix 与 Linux 发行版，建议用户立即升级到最新版本以消除该安全风险。"
published = "2003-06-16T04:00:00Z"
remediation = "如无需使用 kon2，从系统中彻底移除该软件包。若必须保留，需限制本地用户对 /usr/bin/kon 的执行权限，并严格限制对终端环境的访问；同时建议替换为 kterm 或 mlterm 等仍在维护的日文终端模拟器，从根本上消除该本地缓冲区溢出风险。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "KON kon2 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:58:49Z"

