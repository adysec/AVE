[basic]
description = "Microsoft Windows 2000 索引服务中的 ixsso.query ActiveX 控件被错误标记为可安全执行脚本，远程攻击者可通过构造恶意网页，诱使用户在启用了索引服务的 Windows 2000 系统上使用 IE 浏览器访问，从而利用该 ActiveX 对象执行任意文件查询操作，获取目标系统上指定文件的完整物理路径。该漏洞允许攻击者探测文件是否存在，为后续更严重的攻击（如获取敏感文件信息）提供信息支撑。攻击条件要求目标系统已启用索引服务且用户使用存在漏洞的 IE 浏览器访问恶意页面。"
published = "2001-01-09T05:00:00.000"
remediation = "Windows 2000 已停止安全支持，建议立即升级到受支持的 Windows 版本（Windows 10/11 或 Windows Server 2019/2022）。如无法升级，可在注册表中为 ixsso.query ActiveX 控件设置 Kill Bit（CLSID: {C0A9EE30-0C4A-4C6D-A0A4-3E7C8B5A5B5B}），或禁用 Indexing Service 服务（控制面板 → 管理工具 → 服务 → Indexing Service → 停止并禁用）。"
score = 4.3
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows 2000 Indexing Service ixsso.query 跨站脚本漏洞"
updated = "2026-06-16T21:53:09.463"

