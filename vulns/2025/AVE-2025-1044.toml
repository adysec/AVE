[basic]
description = "Linux 内核 USB Type-C UCSI（USB Type-C Connector System Software Interface）驱动中存在空指针解引用漏洞。该漏洞源于系统在相关 workqueue 工作队列仍在运行时即提前释放了底层资源，导致持有这些资源的线程访问已被释放的内存时触发空指针异常。攻击者需在目标系统上具备本地低权限访问权限，通过特制操作触发 workqueue 与资源释放之间的竞争条件，可导致内核崩溃或系统拒绝服务。该漏洞影响运行受影响内核版本的 Linux 发行版，CVSS 评分为 5.5，危害等级为中等。受影响厂商已在后续内核版本中通过确保 workqueue 完全退出后再释放资源的补丁修复此问题。"
published = "2025-04-01T16:15:22Z"
remediation = "升级 Linux 内核至修复版本：标准上游稳定分支建议升级至 6.1.133、6.6.83、6.12.19、6.13.7 或 6.14 及以上版本。Debian/Ubuntu 用户可通过 `apt update && apt upgrade linux-image-generic` 安装厂商发布的内核安全补丁（如 Debian DSA-5900-1），RHEL/CentOS/Fedora 用户执行 `yum update kernel` 或 `dnf upgrade kernel`。如暂时无法升级，可在 GRUB 内核参数中添加 `modprobe.blacklist=ucsi_acpi` 临时禁用 UCSI 驱动模块，或通过 `chmod 700 /dev/bus/usb` 等权限配置限制本地低权限用户访问 USB Type-C 接口，以降低本地攻击面。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 USB Type-C UCSI NULL指针访问漏洞"
updated = "2026-06-17T08:44:36Z"

