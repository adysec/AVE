[basic]
description = "标签之间。<value>Shoutcast Distributed Network Audio Server（DNAS）1.7.1 版本存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过向服务器发送超长 description 字段的特制请求触发该漏洞，导致拒绝服务，并可能进一步执行任意命令。该漏洞影响部署 DNAS 1.7.1 的音频流媒体服务器，攻击者可利用此漏洞完全控制目标系统。"
published = "2001-03-26T05:00:00.000"
remediation = "立即升级 Shoutcast DNAS 至 1.7.2 或更高版本以修复缓冲区溢出漏洞。如厂商不再提供旧版更新，建议通过防火墙规则限制对 DNAS 管理端口（默认 8000/tcp）的访问，仅允许可信来源 IP 连接，并部署入侵检测系统监控包含异常长 description 字段的恶意请求。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Nullsoft Shoutcast DNAS 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:53.217"

