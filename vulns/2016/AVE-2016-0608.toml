[basic]
description = "Cisco Adaptive Security Appliance (ASA) 软件中存在缓冲区溢出漏洞，远程认证用户可通过向目标设备发送特制的 IPv4 SNMP 数据包触发该漏洞，导致任意代码执行。该漏洞影响 ASA 5500、ASA 5500-X、ASA Services Module、ASA 1000V、ASAv、Firepower 9300 ASA Security Module、PIX 及 FWSM 等多款设备，CVSS 评分 8.8，危害等级高。攻击者需具备有效认证凭据，利用难度较低。该漏洞又名 EXTRABACON，Cisco 已发布安全更新修复。"
published = "2016-08-18T18:59:00Z"
remediation = "升级 Cisco ASA 至 9.1(7)+、9.2(4)+、9.3(3.8)+ 或 9.4(2)+ 版本，通过 Cisco.com 下载对应镜像后使用 `copy tftp flash` 上传并 `boot system` 指定新版本重启。临时缓解措施：在受影响设备上限制 SNMP 访问，使用 `access-list` 仅允许受信管理 IP 访问 UDP 161 端口，并禁用 SNMPv1/v2c 只读社区字符串。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Cisco ASA 软件缓冲区溢出远程代码执行漏洞"
updated = "2026-06-17T00:50:54Z"

