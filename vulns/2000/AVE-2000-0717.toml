[basic]
description = "tags.<value>Microsoft SQL Server 7.0 存在存储过程权限绕过漏洞，本地攻击者可通过创建临时存储过程引用受保护的存储过程，绕过权限检查执行其逻辑，导致权限提升或数据泄露。该漏洞影响 Microsoft SQL Server 7.0，攻击者需具备本地数据库访问权限并能创建临时存储过程，CVSS 评分 4.6（本地攻击、低复杂度、无需认证、部分机密性/完整性/可用性影响），微软已发布补丁修复。"
published = "2000-07-07T04:00:00.000"
remediation = "建议立即升级 Microsoft SQL Server 7.0 至 SQL Server 2000 SP4 或更高版本（如 SQL Server 2005/2008/2012/2014/2016/2017/2019/2022），或安装微软发布的 MS00-048 安全补丁（KB265669）。若暂无法升级，可采取临时缓解措施：1）撤销普通用户创建临时存储过程的权限（REVOKE CREATE PROCEDURE TO PUBLIC）；2）限制数据库用户仅拥有必要的最小权限，移除不必要的 db_owner/db_ddladmin 角色；3）启用 SQL Server 审核功能监控临时存储过程创建与执行行为；4）在网络层面限制数据库端口（默认 1433）仅允许受信任 IP 访问。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft SQL Server 7.0 存储过程权限绕过漏洞"
updated = "2026-06-16T21:52:05.487"

