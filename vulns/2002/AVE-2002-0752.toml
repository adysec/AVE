[basic]
description = "Internet Explorer 5.0、5.0.1 及 5.5 版本在启用 JavaScript 执行功能时存在本地文件枚举漏洞。攻击者可在网页中嵌入 script 标签，将其 src 参数指向目标系统上的任意文件（如 file:// URL 指向的本地文件），随后通过 onError 事件处理程序监控加载结果来判断文件是否存在。若文件存在，则不会触发 onError 事件；若文件不存在，则会触发该事件。通过反复探测不同文件路径，攻击者能够枚举本地文件系统上的文件存在性，进而泄露敏感信息。该漏洞影响所有使用受影响 IE 版本并启用 JavaScript 的用户，攻击者只需诱导用户访问恶意网页即可完成探测，无需身份认证。"
published = "2002-12-31T05:00:00Z"
remediation = "建议立即停止使用 Internet Explorer 5.0/5.0.1/5.5，升级至 Microsoft Edge 或其他受支持的现代浏览器并安装最新安全更新。如因兼容性原因必须使用 IE，请升级至 Internet Explorer 6.0 Service Pack 1 或更高版本，安装微软 2002 年 2 月 11 日发布的累积安全补丁 Q316059（MS02-005），并在 IE 安全选项中禁用 Active Scripting 作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer 5 JavaScript 本地文件枚举漏洞"
updated = "2026-06-16T22:00:31Z"

