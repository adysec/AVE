[basic]
description = "Opera浏览器11.10之前版本存在未明确指定的拒绝服务漏洞，远程攻击者可通过构造包含恶意内容的网页，在用户使用浏览器访问该页面时触发应用程序崩溃。该漏洞源于浏览器在处理特定网页内容（包括CSS伪类与变换组合、嵌入式Java小程序空参数等场景）时存在多处错误，攻击者无需身份认证即可利用，成功利用将导致浏览器进程异常终止，影响用户正常使用。Opera官方已在11.10版本中修复此问题。"
published = "2011-07-01T10:55:03Z"
remediation = "立即将 Opera 浏览器升级至 11.10 或更高正式版本，官方已通过该版本更新修复此拒绝服务漏洞。如暂时无法升级，应避免访问包含嵌入式 Java 小程序或复杂 CSS 变换的未知网页，并启用浏览器的安全模式以限制网页内容自动执行作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera 浏览器 嵌入式 Java Applet 空参数拒绝服务漏洞"
updated = "2026-06-16T23:31:42Z"

