[basic]
description = "标签中。<value>Open WebUI 0.10.2 及更早版本存在信息泄露漏洞，攻击者可通过工具列表和获取接口读取只读用户的工具源代码。具体而言，GET /api/v1/tools/、GET /api/v1/tools/list 和 GET /api/v1/tools/id/{id} 端点未正确过滤敏感字段，向已认证的非管理员只读用户返回完整的 Python 工具源代码。该漏洞影响启用了插件功能且向非管理员用户共享工具的 Open WebUI 实例。攻击者只需拥有普通用户账户并被授予工具的读取权限，即可通过上述接口获取其他用户的服务器端工具源码。工具源代码通常包含硬编码的 API 密钥、凭据和内部服务 URL，可能导致敏感信息泄露。该漏洞仅影响机密性，攻击者无法创建、修改或执行工具。CVSS 评分为 6.5，危害等级为中危。Open WebUI 已在 0.11.0 版本中修复此问题。"
published = "2026-08-04T21:16:38Z"
remediation = "将 Open WebUI 升级至 0.11.0 或更高版本。可通过 git pull 合并提交 c05de13b4 与 310ae9130，或直接访问 https://github.com/open-webui/open-webui/releases/tag/v0.11.0 下载覆盖安装，升级后无需修改任何配置即可完全修复。如无法立即升级，建议取消对只读用户的工具共享权限，或临时将 ENABLE_PLUGINS 设为 false 以禁用插件作为缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Open WebUI 工具源代码信息泄露漏洞"
updated = "2026-08-05T16:17:02Z"

