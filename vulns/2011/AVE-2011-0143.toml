[basic]
description = "Apple iOS 5.1 之前版本及 iTunes 10.6 之前版本中使用的 WebKit 引擎存在未明内存破坏漏洞（CWE-119），远程攻击者可通过诱导用户访问精心构造的恶意网站触发内存损坏，成功利用此漏洞可在目标系统上执行任意代码或导致应用程序崩溃拒绝服务。该漏洞也影响 Safari 5.1.4 之前版本，CVSS 评分 9.3，危害等级严重，无需认证即可远程利用。"
published = "2012-03-08T22:55:01Z"
remediation = "升级 Apple iOS 至 5.1 及以上版本，升级 iTunes 至 10.6 及以上版本，升级 Safari 至 5.1.4 及以上版本。如无法立即升级，建议禁用 JavaScript 解析或限制访问不可信网站作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:32:04Z"

