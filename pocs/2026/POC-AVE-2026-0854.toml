[info]
author = "ave"
description = "检测 linkify-it mailto: 模式验证器的二次复杂度拒绝服务漏洞。发送包含大量 mailto: 重复字符串的请求，触发 text.slice(pos) O(n) 复制与贪婪正则 O(n) 扫描导致的 O(n²) CPU 消耗，阻塞单线程事件循环。影响 linkify-it < 5.0.2。"
id = "POC-AVE-2026-0854"
name = "CVE-2026-59887 PoC"
severity = "high"
tags = ["ave-2026-0854"]
vuln_id = [
    "CVE-2026-59887",
    "AVE-2026-0854",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}"
protocol = "http"

