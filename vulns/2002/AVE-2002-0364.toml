[basic]
description = "MySQL 3.23.54之前版本及4.0.6之前版本的COM_CHANGE_USER命令存在认证绕过漏洞。远程攻击者可通过暴力破解方式使用单字符密码进行登录尝试，由于MySQL仅将提供的密码与真实密码的第一个字符进行比较，导致攻击者能够绕过认证获取数据库操作权限。该漏洞影响MySQL 3.x和4.x系列版本，CVSS评分7.5，危害等级高，攻击者无需身份认证即可远程利用。"
published = "2002-12-23T05:00:00Z"
remediation = "升级 MySQL 至 3.23.54 及以上版本（3.x 分支）或 4.0.6 及以上版本（4.x 分支），该漏洞在后续版本中已修复密码比较逻辑。如无法立即升级，可在 MySQL 配置中禁用远程 root 登录（设置 `skip-networking` 或绑定 `bind-address=127.0.0.1`），并限制 COM_CHANGE_USER 命令的访问来源 IP。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "MySQL COM_CHANGE_USER 命令权限提升漏洞"
updated = "2026-06-16T21:59:12Z"

