[basic]
description = "Microsoft Windows SMBv1 服务器存在远程代码执行漏洞（EternalBlue/MS17-010），攻击者可通过向目标系统的 SMBv1 服务发送特制数据包，在无需用户交互的情况下触发漏洞，实现远程代码执行。该漏洞影响 Windows Vista SP2、Windows 7 SP1、Windows 8.1、Windows 10、Windows Server 2008/2012/2016 等多个版本。由于 SMB 协议在处理畸形请求时存在内存损坏问题，攻击者可利用该漏洞完全控制目标系统，安装程序、查看/更改/删除数据或创建新账户。该漏洞曾被 WannaCry 勒索软件大规模利用，造成全球性危害。Microsoft 已在 2017 年 3 月安全更新（MS17-010）中修复此漏洞。"
published = "2017-03-17T00:59:03Z"
remediation = '立即安装微软 2017 年 3 月安全更新 MS17-010（KB4012212/4012213/4012214/4012215/4012216/4012606），对应各 Windows 版本。如无法打补丁，在组策略或注册表中禁用 SMBv1 协议（设置 `HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\SMB1` 为 0），并在防火墙阻断 445/TCP 端口的入站流量。'
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows SMBv1 远程代码执行漏洞"
updated = "2026-06-17T00:57:09Z"

