[basic]
description = "标签中。<value>GNU elfutils 0.192 版本的 eu-strip 组件在 /libelf/elf_strptr.c 文件的 elf_strptr 函数中存在拒绝服务漏洞。攻击者需在本地主机上具备一定权限，通过向该函数发送特制输入即可触发漏洞，导致服务中断。该漏洞攻击复杂度较高，利用难度较大，但公开利用代码已披露。建议用户应用补丁 b16f441cca0a4841050e3215a9f120a6d8aea918 进行修复。"
published = "2025-02-17T05:15:09Z"
remediation = "升级 GNU elfutils 至官方已发布的最新修复版本（包含提交 b16f441cca0a4841050e3215a9f120a6d8aea918）；若暂无法升级，可从 GNU 官方 Git 仓库手动应用该补丁后重新编译安装。临时缓解措施为避免使用 eu-strip 处理来源不明的 ELF 文件，限制本地攻击面。"
score = 2
severity = "LOW"
sources = ["msrc"]
title = "GNU elfutils eu-strip 拒绝服务漏洞"
updated = "2026-06-17T08:39:00Z"

