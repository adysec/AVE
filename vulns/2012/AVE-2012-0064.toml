[basic]
description = "Mozilla Firefox/Thunderbird/SeaMonkey 的 WebGL 子系统中 texImage2D 实现存在类型转换漏洞，未正确限制 JSVAL_TO_OBJECT 的强制类型转换操作。远程攻击者可通过构造特制网页诱导用户访问，触发内存破坏，导致应用程序崩溃或任意代码执行。该漏洞影响 Firefox 4.x 至 11.0、Firefox ESR 10.x 低于 10.0.4、Thunderbird 5.0 至 11.0、Thunderbird ESR 10.x 低于 10.0.4 及 SeaMonkey 低于 2.9 版本，CVSS 评分 9.3，危害等级严重。"
published = "2012-04-25T10:10:17Z"
remediation = "升级 Firefox 至 12.0 及以上版本（ESR 分支升级至 10.0.4+），Thunderbird 升级至 12.0 及以上版本（ESR 分支升级至 10.0.4+），SeaMonkey 升级至 2.9 及以上版本。如无法升级，可在浏览器中禁用 WebGL（设置 about:config 中 webgl.disabled 为 true）作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey WebGL texImage2D 远程代码执行漏洞"
updated = "2026-06-16T23:37:22Z"

