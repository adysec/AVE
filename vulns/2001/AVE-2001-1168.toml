[basic]
description = "Microsoft Index Server 2.0 存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过向目标服务器发送超长的搜索参数触发溢出，进而执行任意系统命令。该漏洞影响运行 Microsoft Index Server 2.0 的 Windows NT/2000 等服务器系统，攻击者无需登录即可在目标主机上执行恶意代码，造成敏感数据泄露或服务器被完全控制。Microsoft 已在后续安全更新中修复此漏洞，建议受影响用户尽快安装补丁。"
published = "2001-06-27T04:00:00.000"
remediation = '安装 Microsoft 安全公告 MS01-025 提供的补丁（对应 KB 文章 Q294472），补丁会修复 Index Server 2.0 对搜索参数长度缺乏校验的缓冲区溢出问题。建议立即通过 Microsoft Download Center 或 Windows Update 下载并安装该补丁，补丁要求系统为 Windows NT 4.0 Service Pack 6a 且已安装 NT 4.0 Option Pack。安装后可通过检查注册表项 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Hotfix\Q294472 确认补丁已生效。如暂无法打补丁，应在防火墙层面禁用 NetBIOS（TCP 139、445 端口）以阻止攻击者建立命名管道连接，并限制 Index Server 仅在内网访问，避免暴露于互联网。该补丁后续将包含在 Windows NT 4.0 Service Pack 7 中。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Index Server 缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:53:57.157"

