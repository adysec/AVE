[basic]
description = "Internet Explorer 5.5 之前版本存在缓存凭据转发漏洞，当用户访问同一网站的 HTTPS 安全页面后，浏览器会将缓存的用户凭据自动转发给该网站上的 HTTP 不安全页面。远程攻击者可通过监控网络连接或中间人攻击截获这些明文传输的凭据信息，导致用户账号密码泄露。该漏洞影响 Windows 平台上所有 IE 5.5 以下版本，CVSS 评分 7.5，危害等级高。"
published = "2000-12-19T05:00:00Z"
remediation = "升级 Internet Explorer 至 5.5 或更高版本（IE 5.5 不受此漏洞影响）；若无法升级，为 IE 5.01 安装 SP1 并应用 MS00-076 补丁（KB Q273868）；IE 4.x 用户应升级至 IE 5.01 SP1 或 IE 5.5。临时缓解措施：关闭浏览器结束会话后重新启动，清除缓存的凭据。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Microsoft Internet Explorer 缓存凭据泄露漏洞"
updated = "2026-06-16T21:52:54Z"

