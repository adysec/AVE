[basic]
description = "Windows AppX 部署服务 (AppXSVC) 存在特权提升漏洞，源于该服务在处理硬链接时存在缺陷。攻击者需先登录系统，随后运行特制应用程序利用该漏洞，可在提升的上下文中执行进程，进而安装程序、查看、更改或删除数据。该漏洞影响 Windows 系统，CVSS 评分 7.8（高危），攻击向量为本地、攻击复杂度低、权限要求低、无需用户交互，机密性/完整性/可用性影响均为高。"
published = "2019-06-12T14:29:04Z"
remediation = '立即安装 Windows 10/11 版本 1809 及更高版本中的2019年10月或11月累积更新 (KB5031400 等)，或通过Windows Update启用安全更新。如无法立即打补丁，可通过注册表永久禁用AppXSVC服务 (reg add "HKLM\SYSTEM\CurrentControlSet\Services\AppXSVC" /v "Start" /t REG_DWORD /d 4 /f)，或暂时停止服务 (net stop AppXSVC)，以临时缓解权限提升风险。'
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows AppX Deployment Service 特权提升漏洞"
updated = "2026-06-17T02:27:44Z"

