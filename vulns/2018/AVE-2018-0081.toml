[basic]
description = "Zeta Producer Desktop CMS 14.2.1 之前版本中内置的 filebrowser 插件存在目录遍历漏洞，位于 assets/php/filebrowser/filebrowser.main.php 文件。攻击者可通过在 file 参数中注入 ../ 序列实现路径穿越，在无需身份认证的情况下读取服务器上的任意文件，导致敏感信息泄露。该漏洞需目标站点已安装并启用 filebrowser 插件方可利用，CVSS 评分 5.5，危害等级中危。"
published = "2018-07-16T14:29:00Z"
remediation = "升级 Zeta Producer Desktop CMS 至 14.2.1 或更高版本，该版本已修复 assets/php/filebrowser/filebrowser.main.php 中的目录遍历漏洞。如无法立即升级，可删除或重命名 filebrowser 插件目录（assets/php/filebrowser/）作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Zeta Producer Desktop CMS 本地文件泄露漏洞"
updated = "2026-06-17T01:40:25Z"

