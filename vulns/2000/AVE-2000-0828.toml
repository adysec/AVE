[basic]
description = "Microsys CyberPatrol 4.0 注册过程中存在敏感信息泄露漏洞。该软件对信用卡号仅使用弱加密（简单编码）进行保护，而对其余注册信息完全未加密传输，导致攻击者可通过嗅探网络流量获取用户提交的信用卡号及其他敏感个人信息。攻击条件简单，无需认证即可远程利用，影响用户隐私安全。"
published = "2001-01-09T05:00:00.000"
remediation = "建议立即停止使用 Microsys CyberPatrol 4.0.4.003/4.0.4.005 版本，该产品已停止安全支持。如必须使用，应在客户端与服务器之间部署 TLS/SSL 加密隧道（如 Stunnel），确保所有注册信息（含信用卡号）通过加密通道传输。同时，在网络边界部署入侵检测系统，监控对 cybercentral.microsys.com 的明文 HTTP POST 请求。推荐迁移至支持强制 HTTPS 通信的现代 Web 内容过滤方案。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsys CyberPatrol 注册信息加密不足致敏感信息泄露漏洞"
updated = "2026-06-16T21:53:18.767"

