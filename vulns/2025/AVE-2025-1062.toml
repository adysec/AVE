[basic]
description = "Linux 内核在 LoongArch 架构上存在 huge page 内存管理缺陷，hugetlbfs 分配 huge page 时的 mmap 基础地址未与 pmd 大小对齐，导致在调用 `__unmap_hugepage_range` 释放 huge page 时触发内核 BUG（mm/hugetlb.c:5550），引发系统崩溃。影响搭载 LoongArch 处理器的 Linux 内核版本，本地低权限用户可通过执行包含 hugefork02 的 LTP 测试用例或构造特定的 huge page 映射与解除映射操作触发该漏洞，造成拒绝服务或潜在的本地权限提升。CVSS 评分 7.8（HIGH）。"
published = "2025-04-01T16:15:26Z"
remediation = "建议将 Linux 内核升级至 6.13.7 或更高稳定版本，该补丁已合并至主线内核。如无法立即升级，可回滚至 5.18 及更早的未受影响版本。若当前运行 6.14-rc 系列内核，建议更新至最新的 6.14 稳定候选版本。对于 LoongArch 架构的系统，请确保内核配置中 CONFIG_HUGETLBFS 选项启用，并验证 arch/loongarch/mm/mmap.c 中已包含 hugetlb 地址对齐修复逻辑。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux Linux kernel 内存管理错误漏洞"
updated = "2026-07-30T06:21:58Z"

