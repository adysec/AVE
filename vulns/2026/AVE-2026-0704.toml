[basic]
description = "NocoBase 在 2.0.59 及更早版本中，`@nocobase/plugin-collection-sql` 插件的 `checkSQL()` 函数采用了不完整的关键字黑名单机制，未能限制对 PostgreSQL 系统目录表（如 `pg_shadow`、`pg_roles` 和 `pg_stat_activity`）的访问。具有 admin 权限的攻击者可通过调用 `/api/sqlCollection:execute` 接口发送特制的 SQL 查询，绕过黑名单校验，从而直接读取数据库用户密码哈希、系统角色信息及数据库架构等敏感数据。该漏洞导致应用层权限越权访问数据库系统底层信息，攻击者可进一步通过破解密码哈希实现对数据库的完全控制。"
published = "2026-07-15T21:16:54Z"
remediation = "建议立即将 NocoBase 升级至 v2.1.0-alpha.46 或更高版本。若无法立即升级，可通过配置 PostgreSQL 数据库权限，限制应用程序连接用户对 pg_shadow、pg_authid 等系统目录表的 SELECT 访问权限，以实现深度防御缓解。"
score = 6.8
severity = "MEDIUM"
sources = ["ghsa"]
title = "NocoBase NocoBase 敏感信息泄露漏洞"
updated = "2026-07-16T16:19:12Z"

