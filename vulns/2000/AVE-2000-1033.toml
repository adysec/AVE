[basic]
description = "Microsoft NWLink 协议栈中的 NMPI（IPX 名称管理协议）监听器存在数据包过滤缺陷，未能正确过滤来自广播地址的数据包。远程攻击者无需身份认证即可向目标系统发送特制的 IPX 广播数据包，触发广播风暴，导致网络带宽被大量无效流量耗尽，造成拒绝服务。该漏洞影响 Microsoft Windows 系列系统中启用了 NWLink IPX/SPX 协议组件的版本，CVSS 评分 5.0，危害等级中等。"
published = "2000-12-19T05:00:00Z"
remediation = '建议立即禁用 NWLink IPX/SPX 协议（若业务不需要），通过控制面板 → 网络连接 → 属性 → 卸载 "NWLink IPX/SPX/NetBIOS Compatible Transport Protocol" 组件。若必须使用 NWLink，则安装 Microsoft 2000 年 12 月发布的安全更新（MS00-097），并在路由器/防火墙上过滤 IPX 广播包（目标地址 FF:FF:FF:FF:FF:FF），限制 NMPI 监听端口 137-138 的广播流量。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft NWLink NMPI监听器广播风暴漏洞"
updated = "2026-06-16T21:52:54Z"

