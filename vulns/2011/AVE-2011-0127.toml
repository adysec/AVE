[basic]
description = "Opera 浏览器存在 SVG 渲染漏洞，其处理特定大量字符路径时出现异常，导致浏览器崩溃和拒绝服务。该漏洞影响 Opera 11.50 及更早版本，通过向目标发送特制的 SVG 文件即可触发。攻击者无需身份验证即可远程利用此漏洞，触发浏览器崩溃，破坏系统的可用性。NVD 报告的 CVSS 评分显示这一漏洞的严重性，攻击向量为网络，攻击复杂性低，对可用性的影响为完全。该漏洞存在于 Opera 浏览器的核心渲染引擎中，对用户体验和系统稳定性造成严重影响。攻击者可以通过构造复杂的 SVG 文件来触发这一漏洞，导致浏览器崩溃和拒绝服务攻击，影响网络应用的正常运行。攻击者可以在网络中诱使用户访问恶意网站，触发浏览器漏洞，导致浏览器崩溃和拒绝服务攻击，最终影响网络应用的正常运行。"
published = "2011-07-01T10:55:02Z"
remediation = "立即升级Opera浏览器至11.50或更高版本，获取包含所有已知安全修复的正式发布版。如无法立即更新，可临时禁用Opera对大量无效URL的自动错误页面生成功能，并限制一次请求路径字符数量，避免磁盘空间耗尽导致浏览器崩溃。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera Web Browser SVG 渲染远程拒绝服务漏洞"
updated = "2026-06-16T23:31:39Z"

