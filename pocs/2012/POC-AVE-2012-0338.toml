[info]
author = "ave"
description = "Apple Safari 6.0 之前版本使用存在内存破坏漏洞的 WebKit 引擎，未认证远程攻击者可通过构造恶意网页触发该漏洞，导致任意代码执行或拒绝服务（内存损坏与应用崩溃）。该漏洞影响 macOS 与 iOS 平台，攻击者只需诱导用户访问特制网页即可触发，无需用户额外交互或身份验证。Apple 已在 Safari 6.0 中修复此问题。"
id = "POC-AVE-2012-0338"
name = "CVE-2012-3661 PoC"
severity = "high"
tags = ["ave-2012-0338"]
vuln_id = [
    "CVE-2012-3661",
    "AVE-2012-0338",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc/index.html"
protocol = "http"

[poc.requests.headers]
User-Agent = "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_9_5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/38.0.2125.122 Safari/537.36"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
