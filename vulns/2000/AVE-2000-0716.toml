[basic]
description = "Microsoft NetMeeting 3.0.1 的远程桌面共享功能存在拒绝服务漏洞。当该功能启用时，远程攻击者无需身份认证即可向 NetMeeting 端口发送特制的空字节序列，导致目标系统 CPU 资源被大量占用，造成拒绝服务。该漏洞影响 Microsoft NetMeeting 3.0.1 及 4.4.3385 等版本，攻击条件简单，仅需网络可达即可触发。"
published = "2000-12-19T05:00:00.000"
remediation = "Microsoft NetMeeting 已停止维护，建议立即卸载 NetMeeting 或禁用远程桌面共享功能。在防火墙层面阻止外部对 NetMeeting 默认端口（1720/TCP）的访问。如仍需远程协作，请升级至 Microsoft Teams 或 Skype for Business 等受支持产品。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft NetMeeting 远程桌面共享拒绝服务漏洞"
updated = "2026-06-16T21:52:54.540"

