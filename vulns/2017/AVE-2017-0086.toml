[basic]
description = "WordPress realty插件（版本低于1.1.0）存在多个跨站脚本（XSS）漏洞。该漏洞源于程序未对用户输入进行充分的过滤和转义处理，攻击者可通过向受影响页面注入恶意脚本代码，当管理员或其他用户访问特制链接时，脚本将在浏览器中执行，导致敏感信息泄露或会话劫持。攻击者无需身份认证，但需要用户交互（点击链接），影响范围包括所有使用该插件的WordPress站点。"
published = "2019-08-20T16:15:12Z"
remediation = "将 WordPress realty 插件升级至 1.1.0 或更高版本，该版本已修复多处跨站脚本漏洞。如无法立即升级，可在 WordPress 后台禁用 realty 插件，或通过 Web 应用防火墙（WAF）添加针对 XSS 的规则进行临时防护。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress realty插件跨站脚本漏洞"
updated = "2026-06-17T01:13:02Z"

