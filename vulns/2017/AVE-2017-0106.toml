[basic]
description = "Microsoft Office 在处理内存对象时存在释放后使用（Use-After-Free）漏洞，攻击者可通过构造特制的 Office 文档并诱使用户打开来触发该漏洞。成功利用此漏洞的攻击者可获取与当前用户相同的权限，进而在目标系统上执行任意代码，安装程序、查看/更改/删除数据或创建新账户。该漏洞影响 Office 2010 SP2、Office 2013 SP1 及 Office 2016 等多个版本，已被 Sednit/APT28 等高级持续性威胁组织在野利用。用户交互是唯一攻击条件，预览窗格亦可触发。"
published = "2017-05-12T14:29:04Z"
remediation = "立即安装 Microsoft 2017 年 5 月发布的 Office 安全更新：Office 2010 SP2 安装 KB3199167，Office 2013 SP1 安装 KB3199158，Office 2016 安装 KB3199166。也可通过 Microsoft Update 或 Windows Update 自动检测并安装。该漏洞已被 CISA 列入已知被利用漏洞目录，建议优先修复。如无法立即打补丁，可配置 Office 在受保护视图下打开来自互联网的文档，并禁用 OLE 对象嵌入功能作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Office 远程代码执行漏洞"
updated = "2026-06-17T00:57:21Z"

