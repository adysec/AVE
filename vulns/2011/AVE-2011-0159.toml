[basic]
description = "WebKit 引擎在处理特定网页内容时存在内存破坏漏洞。该漏洞影响 Apple iOS 5.1 之前版本以及 iTunes 10.6 之前版本的 WebKit 组件。远程攻击者可通过诱导用户访问一个精心构造的恶意网站，触发内存损坏缺陷，从而导致应用程序崩溃（拒绝服务）或在目标设备上以当前用户权限执行任意代码。该漏洞的攻击条件为用户使用受影响的浏览器访问恶意页面，利用方式为通过特制 HTML/JS 触发内存非法访问。"
published = "2012-03-08T22:55:01Z"
remediation = "建议将 Safari 浏览器升级至 5.1.4 或更高版本，iOS 系统升级至 5.1 或更高版本，以及将 iTunes 升级至 10.6 或更高版本，以修复 WebKit 引擎中的内存破坏漏洞。对于无法立即更新的设备，建议通过限制访问不可信的第三方网站来降低被恶意构造页面触发攻击的风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:32:09Z"

