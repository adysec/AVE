[basic]
description = "Small HTTP Server 2.01 在处理包含空值的服务器端包含（SSI）标签时存在安全缺陷，未能正确解析此类特殊构造的标签内容。本地用户或远程攻击者可通过向服务器提交嵌入了恶意 SSI 标签的 HTML 文件触发该漏洞，导致服务器进程崩溃，造成拒绝服务。该漏洞攻击复杂度低，无需身份认证即可利用，影响 Small HTTP Server 2.01 版本。"
published = "2001-01-09T05:00:00Z"
remediation = "将 Small HTTP Server 升级至 2.03 或更高版本，此版本已修复 SSI 标签对空值的异常处理问题。如业务无需 SSI 功能，可在配置文件中关闭 SSI 支持以彻底消除风险。若暂无法升级，应确保所有含 SSI 指令的文件仅使用 .shtm 或 .shtml 扩展名，并对用户输入中的空字符进行过滤校验，防止恶意构造的 SSI 标签被注入 HTML 文件导致服务器崩溃。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Small HTTP Server 空值SSI标签处理拒绝服务漏洞"
updated = "2026-06-16T21:52:43Z"

