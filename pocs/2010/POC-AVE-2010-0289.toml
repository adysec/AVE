[info]
author = "ave"
description = "通过构造包含特制内联元素的网页，验证 WebKit 渲染引擎是否存在内存破坏漏洞，可导致 Safari 浏览器崩溃或远程代码执行。"
id = "POC-AVE-2010-0289"
name = "CVE-2010-1782 PoC"
severity = "high"
tags = ["ave-2010-0289"]
vuln_id = [
    "CVE-2010-1782",
    "AVE-2010-0289",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cve-2010-1782-poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = [
    "CRASH",
    "crash",
    "EXPLOIT",
]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
