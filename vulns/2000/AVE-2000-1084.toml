[basic]
description = "JDK 1.2.2_05 及更早版本中的 Java 运行时环境存在沙箱逃逸漏洞，由于未对不可信 Java 类的类加载调用进行充分限制，导致攻击者可通过诱导用户运行恶意 Java 小程序或应用程序，使不可信 Java 类调用被禁止的内部类，从而突破 Java 沙箱安全机制，在目标系统上执行未授权操作，造成机密性、完整性和可用性受影响。攻击条件要求用户交互且利用复杂度较高，CVSS 评分 5.1，危害等级中危。"
published = "2001-01-09T05:00:00.000"
remediation = "升级到 JDK 1.2.2_06 或更高版本，该版本修复了不受信任 Java 类调用被禁止类的问题。如无法升级，可在安全策略文件中限制不可信代码的权限，或使用 SecurityManager 严格限制类加载范围。"
score = 5.1
severity = "MEDIUM"
sources = ["epss"]
title = "Sun Java Development Kit (JDK) Java沙箱逃逸漏洞"
updated = "2026-06-16T21:53:08.667"

