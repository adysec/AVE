[basic]
description = "Docker Desktop 增强型容器隔离（ECI）机制存在绕过漏洞。当 ECI 启用时，Docker Desktop API 代理仅通过检查 HostConfig.Binds 字段来限制容器对 Docker socket 的挂载，但使用 --use-api-socket CLI 标志时，Docker socket 挂载会通过 HostConfig.Mounts 字段添加，绕过 ECI 检查机制。具备在目标系统上执行 Docker CLI 命令权限的本地攻击者可利用此漏洞绕过 ECI 限制，获取对 Docker Engine socket 的完全访问权限。若主机用户已登录容器注册表，攻击者还能窃取其身份验证凭据，进而实现容器逃逸和权限提升。该漏洞影响启用 ECI 的 Docker Desktop 环境，CVSS 评分 8.8。"
published = "2026-05-22T19:17:04.827"
remediation = "升级 Docker Desktop 至 4.59.0 或更高版本，Docker 官方在该版本中修复了 ECI 强制检查仅审查 HostConfig.Binds 字段而未检查 HostConfig.Mounts 字段导致的绕过问题。如无法立即升级，可在 Docker Desktop 的 admin-settings 配置中显式允许所需的 Docker socket 挂载，并严格限制本地用户在容器内执行 Docker CLI 命令的权限，以减小攻击面。"
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "Docker Desktop 增强型容器隔离机制绕过漏洞"
updated = "2026-07-23T16:10:00.137"

