[basic]
description = "Google Chrome 的 Safe Browsing 功能中存在释放后使用（Use After Free）漏洞，CWE-416。攻击者首先需要攻陷渲染器进程，然后通过构造恶意的 HTML 页面触发已释放内存的访问，导致越界内存读取，进而可能实现信息泄露或代码执行。该漏洞影响 Chrome 141.0.7390.107 之前版本，攻击复杂度低，无需认证，但需要用户交互（访问恶意页面），CVSS 评分 8.8，危害等级高。"
published = "2025-11-06T23:15:35Z"
remediation = "立即将 Google Chrome 升级至 141.0.7390.107 或更高版本。Chrome 用户可通过「设置」→「关于 Chrome」→「检查更新」自动获取修复。基于 Chromium 的浏览器（如 Microsoft Edge、Brave）请同步更新至对应版本。如无法立即升级，可暂时禁用 JavaScript 或使用站点隔离功能（chrome://flags/#enable-site-isolation）作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome Safe Browsing 释放后使用漏洞"
updated = "2026-06-17T08:31:07Z"

