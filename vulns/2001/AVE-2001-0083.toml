[basic]
description = 'Carey Internet Services Commerce.cgi 2.0.1 存在目录遍历漏洞。攻击者无需身份认证，通过向 commerce.cgi 发送包含 ".."（点号穿越）序列的 page 参数，即可绕过目录限制读取服务器上的任意文件。该漏洞影响运行 commerce.cgi 2.0.1 的 Web 服务器，攻击条件宽松，仅需构造恶意 HTTP 请求即可触发。CVSS 评分为 5.0，危害等级为中等。'
published = "2001-06-02T04:00:00Z"
remediation = "建议立即升级 commerce.cgi 至 2.0.2 或更高版本（修复了目录遍历漏洞）。若无法升级，需在 CGI 代码中对 page 参数实施严格输入验证：过滤 ../ 等路径遍历字符，限制访问仅限于 Web 根目录下的合法文件。同时配置 Web 服务器（如 Apache）启用 mod_security 或类似 WAF 规则拦截包含 .. 的请求，并将 CGI 脚本运行用户权限降至最低，禁止访问敏感系统目录。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Carey Internet Services commerce.cgi 目录遍历漏洞"
updated = "2026-06-16T21:53:53Z"

