[basic]
description = "Citrix SD-WAN Center 和 NetScaler SD-WAN Center 存在命令注入漏洞，由于对用户输入验证不严格，未经身份认证的远程攻击者可通过向管理界面发送特制请求注入系统命令，导致远程代码执行。该漏洞影响 Citrix SD-WAN 10.2.3 之前版本及 NetScaler SD-WAN 10.0.8 之前版本，CVSS 评分 9.8，危害等级严重。攻击无需认证，利用复杂度低，可完全控制目标系统。厂商已发布安全更新修复此漏洞。"
published = "2019-07-16T18:15:12Z"
remediation = "立即将 Citrix SD-WAN 升级至 10.2.3 或更高版本，将 NetScaler SD-WAN 升级至 10.0.8 或更高版本。补丁及详细说明请参考 Citrix 安全公告 CTX251987。如无法立即升级，建议在管理界面中限制可访问 SD-WAN Center 管理端口的源 IP 地址，仅允许受信任的管理网段访问，并禁用不必要的远程管理接口作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Citrix SD-WAN Center 和 NetScaler SD-WAN Center 命令注入漏洞"
updated = "2026-06-17T02:15:51Z"

