[basic]
description = "Windows 基于虚拟化的安全性（VBS）Enclave 存在特权提升漏洞（CVE-2025-21370），根源在于 VBS 安全内存管理器对 Enclave 边界内数据的输入验证不充分（CWE-20 输入验证缺陷），导致攻击者可通过特制应用程序绕过虚拟化安全隔离边界。攻击条件为本地访问且需具备低权限，攻击复杂度低、无需用户交互，成功利用后可获取 SYSTEM 权限，完全控制受影响系统、窃取敏感信息或安装持久化后门，影响机密性、完整性与可用性。该漏洞影响 Windows 10/11 及 Windows Server 多个版本，Microsoft 已在 2025 年 1 月安全更新 KB5050021 中修复。"
published = "2025-01-14T18:16:02.650"
remediation = """
Let me analyze the presearch data to find the specific remediation information for CVE-2025-21370.

From the presearch data:
1. NVD reference: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-21370
2. Tenable data mentions security update 5050021 (KB5050021)
3. The vulnerability affects Windows VBS Enclave
4. Microsoft released a security update in January 2025

The remediation should:
- Be ≥20 Chinese characters
- Be specific and actionable
- Reference the patch/update version
- Not be generic like "请参考官方公告"

Let me write a proper remediation based on the availabledata.立即安装 Microsoft 2025 年 1 月安全更新（KB5050021）。操作步骤：打开"设置"→"更新和安全"→"Windows 更新"→点击"检查更新"以自动获取该累积更新；对于离线环境，从 Microsoft Update Catalog（https://www.catalog.update.microsoft.com）手动下载 KB5050021 并执行安装，完成后重启系统。该更新修复了 Windows 基于虚拟化的安全性（VBS）Enclave 中的输入验证不当漏洞（CWE-20），阻止攻击者利用特制应用提升至 SYSTEM 权限。"""
score = 7.8
