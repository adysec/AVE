[basic]
description = "Google Chrome 132.0.6834.83 之前版本中的 Payments 组件存在不当实现漏洞，远程攻击者可通过构造特制的 HTML 页面并诱骗用户执行特定的 UI 手势（如点击或拖拽操作），成功利用该漏洞可导致 UI 界面欺骗（UI Spoofing），使用户误认为正在与合法界面交互，从而在不知情的情况下授权恶意操作。该漏洞仅影响用户界面完整性（CVSS 完整性影响为高），攻击需用户交互，CVSS 评分 6.5，危害等级中危。Google 已在 Chrome 132.0.6834.83 版本中修复此漏洞。"
published = "2025-01-15T11:15:10Z"
remediation = "立即将 Google Chrome 升级至 132.0.6834.83 或更高版本（Chromium 用户同步更新至对应版本），该版本已修复 Payments 模块中的不当实现导致的 UI 欺骗漏洞。无法立即升级时，可配置浏览器策略禁用第三方支付请求或提醒用户谨慎交互，降低被诱导风险。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome Payments 界面欺骗漏洞"
updated = "2026-06-17T08:26:29Z"

