[basic]
description = "Oracle Listener 默认安装配置存在远程命令执行漏洞。攻击者可在未授权的情况下，通过 TNS 协议向 Oracle Listener 发送特制的 SET TRC_FILE 或 SET_LOG_FILE 命令，将日志信息追加到服务器任意文件中，进而实现任意命令执行。该漏洞影响 Oracle 7.3.4、8.0.6 及 8.1.6 版本，CVSS 评分 10.0，攻击复杂度低，无需身份认证即可远程利用，可完全控制目标系统。"
published = "2000-12-19T05:00:00Z"
remediation = "建议立即升级 Oracle 数据库至 8.1.7 或更高版本，该版本已修复 Listener 的 SET TRC_FILE/SET LOG_FILE 命令执行漏洞。如无法升级，可在 listener.ora 中设置 ADMIN_RESTRICTIONS_LISTENER=ON 以限制远程管理操作，并为 Listener 设置强密码（通过 `lsnrctl set password` 命令），同时在防火墙层面限制对 1521 端口的非授权访问。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Oracle Listener 远程命令执行漏洞"
updated = "2026-06-16T21:52:32Z"

