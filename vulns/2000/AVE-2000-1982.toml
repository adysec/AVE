[basic]
description = "Mandrake Linux 7.1 及更早版本中的 ypserv（网络信息服务守护进程）存在格式化字符串漏洞。当 ypserv 在未链接 vsyslog() 函数的情况下编译时，未经身份认证的远程攻击者可通过向该服务发送包含格式化字符串特数的恶意输入，触发内存写入操作，从而以 root 权限执行任意代码。该漏洞影响 Mandrake Linux 7.1 及更早版本，以及可能其他未正确编译 ypserv 的 Linux 发行版。由于 ypserv 通常以 root 权限运行，攻击者可借此完全控制目标系统。攻击者无需任何凭据即可远程利用此漏洞，攻击复杂度低，危害极为严重。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级 Mandrake Linux 7.1 的 ypserv 软件包至 Mandrake Security Advisory MDKSA-2000-064 发布的修复版本，或升级至 Mandrake Linux 7.2 及更高版本。临时缓解措施：通过 /etc/rc.d/init.d/ypserv stop 或 chkconfig ypserv off 禁用 ypserv 服务，并关闭防火墙对 TCP 111 端口和 ypserv 相关端口的入站访问。同时确认 ypserv 在编译时已启用 vsyslog() 函数支持，避免格式化字符串被攻击者利用提权至 root。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Mandrake Linux ypserv 格式化字符串漏洞"
updated = "2026-06-16T21:53:02Z"

