[basic]
description = "Oracle Internet Application Server（IAS）3.0.7 及更早版本中的 mod_sql 组件存在 SQL 注入漏洞。未经身份认证的远程攻击者可通过在 URL 查询字符串中嵌入恶意 SQL 语句，向后台数据库提交任意 SQL 命令。由于该组件将用户输入直接拼接进 SQL 查询而未做任何过滤或参数化处理，攻击者可借此绕过应用程序逻辑，直接操纵数据库。该漏洞影响运行 Oracle IAS 的 Web 服务器，攻击者可利用其读取、修改或删除数据库中的敏感信息，严重时可能导致整个数据库被接管。此漏洞利用条件宽松，攻击者仅需向目标发送包含恶意查询参数的 HTTP 请求即可触发，无需任何身份凭据，攻击复杂度低，潜在危害大。"
published = "2000-12-31T05:00:00.000"
remediation = "建议立即升级到 Oracle Internet Application Server 10g Release 2 (10.2) 或更高版本，该版本修复了 mod_sql SQL 注入漏洞。升级前，请执行以下配置变更：1）在 httpd.conf 中禁用未验证的URL解析，2）配置mod_security模块以过滤恶意SQL语句，3）使用Oracle数据库自带的PL/SQL绑定参数机制替代动态SQL拼接。如无法立即升级，可临时通过防火墙规则阻止对 IAS服务器的直接SQL查询访问，并将默认监听端口从80/8080更改为非标准端口以降低暴露风险。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Oracle Internet Application Server mod_sql SQL注入漏洞"
updated = "2026-06-16T21:53:26.393"

