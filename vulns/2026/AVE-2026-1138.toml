[basic]
description = "标签之间。<value>Adobe Creative Cloud Desktop 存在时间检查与时间使用（TOCTOU）竞争条件漏洞（CWE-367）。该漏洞源于程序在检查文件状态与实际使用文件之间存在时间差，攻击者可利用此窗口期通过竞争条件实现任意代码执行，代码将以当前登录用户的权限运行。该漏洞影响本地安装的 Creative Cloud Desktop 应用程序，利用过程依赖攻击者无法完全控制的系统条件（如文件系统时序），但无需任何用户交互即可触发。由于漏洞导致权限范围改变（Scope Changed），成功利用可能使攻击者在当前用户上下文中获得完全控制权。"
published = "2026-07-14T21:17:00Z"
remediation = "立即升级到Adobe Creative Cloud Desktop最新稳定版本（2026.8.120及以上），确保已安装所有7月补丁包。临时缓解措施：运行软件时使用有限用户权限，避免管理员账户；停用桌面所有自动重启功能，防止攻击者重新加载恶意DLL；可配置应用信任名单，仅允许签署的执行文件运行，阻止未经验证的未经检测进程。参考Adobe安全公告ADV26-01，建议在72小时内完成补丁安装。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Adobe Creative Cloud Desktop 时间检查与时间使用竞态条件漏洞"
updated = "2026-07-17T03:23:06Z"

