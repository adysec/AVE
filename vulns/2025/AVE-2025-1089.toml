[basic]
description = "Linux 内核 net/atm 子系统的 `lec_send()` 函数存在释放后使用（use-after-free）漏洞。该函数在调用 `->send()` 操作之前未保存套接字缓冲区（skb）的长度，而 `->send()` 会释放 skb 内存，导致后续仍对已释放的内存进行访问。攻击者无需身份认证即可通过网络发送特制 ATM 数据包远程触发此漏洞，成功利用可能导致敏感信息泄露或系统崩溃，在特定条件下甚至可能实现代码执行。CVSS v3.1 评分为 8.6，危害等级为高。"
published = "2025-04-03T08:15:15Z"
remediation = "升级 Linux 内核至已修复版本：5.4.292、5.10.236、5.15.180、6.1.132 或更新版本。Debian 用户可通过 DSA-5900-1（bookworm 6.1.133-1）或 DLA-4178-1（bullseye 5.10.237-1）安全更新安装修复包，Ubuntu 用户应更新至 5.4.0-218.238（focal）、5.15.0-142.152（jammy）或 6.8.0-84.84（noble）及以上版本内核。也可直接从 https://git.kernel.org 获取修复此漏洞的提交 f3009d0d6ab78053117f8857b921a8237f4d17b3 对应的补丁并编译进内核。如短期内无法立即升级内核，建议通过系统级防火墙或网络访问控制列表限制对 ATM 子系统的本地访问，降低攻击者利用此 use-after-free 漏洞的风险。"
score = 8.6
severity = "HIGH"
sources = ["msrc"]
title = "Linux kernel ATM 网络模块释放后使用漏洞"
updated = "2026-07-30T06:22:02Z"

