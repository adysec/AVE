[basic]
description = 'X25519 密钥交换算法的"恒定时间"实现在基于 Xtensa 架构的 ESP32 芯片上存在时间侧信道漏洞（CWE-203）。由于编译器优化与 CPU 架构限制，Xtensa 编译器可能生成非常量时间执行的汇编代码，导致加密运算的执行时间随密钥位模式产生可观测差异。攻击者若能在物理接触或本地环境条件下对目标设备进行高精度的计时测量，并具备一定的访问权限，则可能通过分析 X25519 密钥协商过程中的时间差异逐步推导或重现私钥，进而伪造签名或解密通信内容。该漏洞影响使用 wolfSSL 5.8.4 之前版本且面向 Xtensa/ESP32 平台的 X25519 实现。wolfSSL 已在 5.8.4 版本中默认启用 Xtensa 平台的低内存 X25519 实现并引入盲化（blinding）措施以缓解此侧信道风险。'
published = "2025-11-21T23:15:44Z"
remediation = "将 wolfSSL 升级到 5.8.4 或更高版本。根据 wolfSSL 于 2025 年 11 月 20 日发布的 5.8.4 版本公告，该版本默认在 Xtensa 架构（ESP32 芯片）上启用小型代码尺寸实现（CURVE25519_SMALL/ED25519_SMALL/CURVE448_SMALL/ED448_SMALL），以修复 X25519 恒定时间实现中的时序侧信道问题。对于无法立即升级的环境，可在编译配置中手动启用上述 SMALL 宏，或通过 NO_CURVE25519_BLINDING 等编译选项禁用易受攻击的实现路径。建议同时关注 Espressif 官方 ESP-IDF 安全更新，确保 SDK 中的 wolfSSL 组件版本不低于 5.8.4。"
score = 1
severity = "LOW"
sources = ["msrc"]
title = "wolfSSL X25519 恒定时间实现时序侧信道漏洞"
updated = "2026-06-17T08:33:09Z"

