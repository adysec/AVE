[basic]
description = '''Astro 框架的 @astrojs/node 独立服务器在配置 trailingSlash: 'always' 时，静态文件处理器对以 /\（斜杠+反斜杠）开头的路径未正确识别为内部路径，导致 301 重定向时将原始路径直接回显到 Location 响应头中。由于浏览器遵循 WHATWG URL 规范将反斜杠视为正斜杠处理，攻击者可构造特制链接诱导用户点击，实现开放重定向至外部恶意站点。该漏洞影响 Astro 8.1.0 至 11.0.1 版本，需满足非默认配置 trailingSlash: 'always' 且请求路径末段无文件扩展名。Astro 11.0.2 版本已修复此问题。'''
published = "2026-07-27T21:17:05Z"
remediation = "立即升级 @astrojs/node 至 11.0.2 或以上版本，该版本已修复反斜杠路径的内部路径识别问题。如无法升级，将 `trailingSlash` 配置改为默认值 `'ignore'`，避免静态文件处理器发出尾部斜杠重定向。同时可在反向代理层对 `Location` 响应头进行校验，过滤包含反斜杠或指向外部域名的重定向。"
score = 2.1
severity = "LOW"
sources = ["ghsa"]
title = "Astro @astrojs/node 开放重定向漏洞"
updated = "2026-07-28T16:17:16Z"

