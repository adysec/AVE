[basic]
description = "Netopia R9100 路由器 4.6 版本存在拒绝服务漏洞。该漏洞的触发原理是：当已通过身份认证的用户使用路由器内置的 Telnet 客户端程序连接到路由器自身的 IP 地址时，会触发程序异常处理不当，导致路由器崩溃重启。该漏洞影响运行 4.6 固件版本的 Netopia R9100 路由器设备，攻击者需要事先获得路由器的 Telnet 认证凭据才能利用此漏洞。攻击者首先通过正常的 Telnet 登录流程获取认证权限，随后在已建立的 Telnet 会话中再次使用 Telnet 客户端向路由器本机 IP 发起连接请求，即可触发服务崩溃，造成网络服务中断，影响网络的可用性。"
published = "2001-03-26T05:00:00Z"
remediation = "立即通过 Netopia 官方渠道或后续持有方 Motorola/ARRIS 获取并安装 R9100 路由器最新固件版本以修复该 telnet 客户端崩溃缺陷。如暂无补丁，应在防火墙或访问控制列表中限制仅受信任的管理 IP 可访问路由器管理接口，并禁用不必要的 telnet 客户端功能，避免内部用户直接通过 telnet 连接设备自身 IP。如设备已停止维护且无法缓解，建议更换为当前受支持的硬件型号。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Netopia R9100 路由器 Telnet 客户端拒绝服务漏洞"
updated = "2026-06-16T21:53:50Z"

