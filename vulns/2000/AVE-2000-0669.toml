[basic]
description = "PHPix Photo Album 1.0.2 及更早版本存在目录遍历漏洞。远程攻击者无需身份认证即可通过在 URL 中构造包含 `..`（点点斜杠）序列的恶意请求，绕过目录限制读取服务器上的任意文件，如配置文件、密码文件等敏感信息。该漏洞源于程序对用户输入的文件路径参数缺乏充分的过滤与校验，攻击条件简单，危害较大，可导致敏感信息泄露。"
published = "2000-12-19T05:00:00.000"
remediation = "PHPix Photo Album 1.0.2 及更早版本已停止维护，建议立即替换为其他仍在维护的相册程序（如 Piwigo）。若无法替换，在 PHP 入口文件中添加输入过滤：`if (strpos($_GET['file'], '..') !== false) { die('Invalid request'); }`，同时在 Web 服务器（Apache/Nginx）配置中禁止 URL 中包含 `../` 的请求。将 `open_basedir` 限制为仅允许 Web 目录访问。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "PHPix Photo Album 目录遍历漏洞"
updated = "2026-06-16T21:52:46.000"

