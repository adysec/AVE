[basic]
description = "SAMSUNG SmartTouchCall 存在通信信道来源验证不当漏洞，远程攻击者可通过特制的通信请求绕过来源验证机制，在用户交互（如点击恶意链接或接受恶意呼叫请求）的情况下，获取目标设备中的敏感信息。该漏洞影响 SmartTouchCall 1.0.1.1 之前版本，攻击者需具备高权限且需用户配合，CVSS 评分 4.5，危害等级中危。"
published = "2025-12-02T02:15:48Z"
remediation = "建议立即将 SmartTouchCall 升级至 1.0.1.1 或更高版本，该版本修复了通信信道来源验证缺陷。如无法立即升级，可在 SmartTouchCall 设置中禁用自动接收远程呼叫请求功能作为临时缓解措施。"
score = 4.5
severity = "MEDIUM"
sources = ["zdi"]
title = "SAMSUNG SmartTouchCall 信息泄露漏洞"
updated = "2026-06-17T09:44:33Z"

