[basic]
description = 'NoneCms 1.3 及之前版本基于 ThinkPHP 框架开发，其 App.php 文件中 filter 参数未经过滤直接传入，导致远程攻击者可通过构造恶意查询字符串（如 s=index/\think\Request/input&filter=phpinfo&data=1）将任意 PHP 代码注入并执行。该漏洞无需身份认证即可利用，攻击者可借此获取服务器敏感信息或完全控制受影响系统，影响部署了 NoneCms 的网站管理员和运维环境。'
published = "2018-12-11T18:29:00.197"
remediation = "建议立即升级 NoneCms 到 1.3.1 及以上版本（已修复 ThinkPHP 核心漏洞），或手动升级底层 ThinkPHP 框架至 5.0.24 / 5.1.31 及以上版本。若暂无法升级，可在 thinkphp/library/think/Request.php 中的 input() 方法中禁用 filter 参数调用危险函数（如 system、exec、phpinfo 等），或在入口文件入口处强制过滤 $_GET/$_POST 中的 filter 参数，作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "NoneCms ThinkPHP App.php 远程命令执行漏洞"
updated = "2026-06-17T01:52:14.323"

