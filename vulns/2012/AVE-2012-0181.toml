[basic]
description = "FreeType 字型渲染引擎在 2.4.9 之前版本中存在除零错误漏洞。该漏洞源于程序在处理特制字型文件时未对相关数值进行有效校验，导致除法运算中出现除数为零的情况，进而引发程序崩溃。远程攻击者可利用此漏洞，通过向目标系统提交包含恶意构造字型数据的文件或网页链接，触发除零异常，造成拒绝服务。该漏洞影响 FreeType 2.4.9 之前版本，以及使用该库的 Mozilla Firefox Mobile 10.0.4 之前版本、Apple iOS 6.0 之前版本等产品。攻击者需要诱使用户打开特制字型文件或访问恶意网页方可利用，CVSS 评分 4.3，危害等级中危。"
published = "2012-04-25T10:10:18Z"
remediation = "将 FreeType 升级至 2.4.9 及以上版本（官方于 2012-03-08 发布修复版本）。Mozilla Firefox Mobile 用户应升级至 10.0.4 或更高版本。如无法立即升级，建议禁用不受信任字体的解析功能，或通过 Web 应用防火墙过滤包含畸形字体文件的请求。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "FreeType 字体解析拒绝服务漏洞"
updated = "2026-06-16T23:39:07Z"

