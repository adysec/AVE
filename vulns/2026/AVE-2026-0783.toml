[basic]
description = "veraPDF-validation 组件的 PDF 解析模块中存在 XML 外部实体注入（XXE）漏洞。该漏洞源于 `PDFAValidator.validate()` 和 `GFPDAcroForm.getdynamicRender()` 两个 API 在处理不可信 PDF 文件时，使用了默认配置的 `DocumentBuilderFactory` 解析富文本注释、表单字段值及 XFA 配置，未禁用 DTD 和外部实体解析。攻击者可构造包含恶意 XML 外部实体的 PDF 文件，诱导受害者使用受影响版本解析后，导致本地文件泄露和出站网络请求。该漏洞影响 veraPDF-validation 1.25.73 至 1.30.2 及 1.31.71 版本，已在 1.30.2 和 1.31.71 中修复。"
published = "2026-07-29T16:17:53Z"
remediation = "建议立即升级 veraPDF-validation 至修复版本 1.30.2 或 1.31.71（Maven 坐标 org.verapdf:validation-model 及 validation-model-jakarta），在 pom.xml/build.gradle 中更新依赖版本并重新构建部署。如暂无法升级，在调用 PDFAValidator.validate(...) 或 GFPDAcroForm.getdynamicRender() 前对输入 PDF 进行来源校验，仅处理可信来源文件；同时可在 JVM 启动参数中添加 -Dorg.apache.xerces...（如 -Djavax.xml.accessExternalDTD=all 改为限制）并部署防火墙/出站网络控制，阻止服务端发起的出站请求，作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "veraPDF veraPDF-validation XML外部实体注入漏洞"
updated = "2026-07-30T19:23:14Z"

