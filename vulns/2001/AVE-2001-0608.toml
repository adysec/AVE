[basic]
description = "phpGroupWare 0.9.7 之前版本中存在远程文件包含漏洞，攻击者可通过向 phpgw.inc.php 程序的 phpgw_info 参数指定恶意包含文件，从而远程执行任意 PHP 代码。该漏洞无需身份认证即可远程利用，CVSS 评分 10.0，危害等级严重。受影响版本为 phpGroupWare 0.9.7 之前的所有版本，建议用户升级至 0.9.7 或更高版本以修复此漏洞。"
published = "2001-02-16T05:00:00Z"
remediation = """
The user wants me to generate a remediation field for CVE-2001-0043. Based on the NVD data, phpGroupWare before 0.9.7 is vulnerable. The fix is to upgrade to 0.9.7 or later. The sourceforge release notes link confirms version 0.9.7 as the fix.

Let me craft a specific, actionable remediation in Chinese.<value>立即升级 phpGroupWare 至 0.9.7 或更高版本（SourceForge 发布说明：http://sourceforge.net/project/shownotes.php?release_id=17604），该版本修复了 phpgw.inc.php 中 phpgw_info 参数未正确过滤导致的远程文件包含问题。如无法升级，在 Web 服务器配置中禁用 allow_url_fopen 和 allow_url_include，并对 phpgw_info 参数实施严格白名单校验，仅允许预期的 PHP 文件路径。"""
score = 10
severity = "CRITICAL"
