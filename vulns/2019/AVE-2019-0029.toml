[basic]
description = "Apache HTTP Server 2.4.0 至 2.4.39 版本中 mod_proxy 模块的错误页面存在跨站脚本（XSS）漏洞。当服务器配置了代理功能且存在错误配置时，远程攻击者可通过构造特制的请求，使代理错误页面中的链接指向攻击者控制的恶意页面，从而在用户浏览器中执行任意 JavaScript 代码。该漏洞利用需要用户交互（点击恶意链接），影响范围限于启用了代理功能的 Apache HTTP Server 部署环境。"
published = "2019-09-26T16:15:10.613"
remediation = "升级 Apache HTTP Server 至 2.4.41 或更高版本，该版本已修复 mod_proxy 错误页面的 XSS 问题。如无法立即升级，可临时禁用 mod_proxy 模块或修改配置移除 ProxyErrorOverride 指令，并在反向代理后端对用户输入进行 HTML 编码过滤。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Apache HTTP Server mod_proxy 跨站点脚本漏洞"
updated = "2026-06-17T02:10:12.827"

