[basic]
description = "fetchmail 5.7.4 之前版本中的 fetchmailconf 配置工具在创建临时文件时存在不安全的符号链接处理漏洞（CWE-59）。本地攻击者可通过在临时文件目录中创建恶意符号链接，利用 fetchmailconf 对临时文件的操作权限，将文件写入或覆盖其他用户的任意文件。该漏洞源于程序使用可预测的临时文件名且未进行安全校验，攻击者无需认证即可在本地系统上实施攻击，导致受影响用户的文件完整性被破坏。由于攻击需要本地访问权限且仅影响文件完整性，CVSS 评分 2.1，危害等级低。"
published = "2001-09-06T04:00:00Z"
remediation = "升级 fetchmail 至 5.7.4 或更高版本，该版本已修复 fetchmailconf 临时文件创建时的竞态条件问题。如无法立即升级，可移除 fetchmailconf 的 setuid 权限或限制其可执行用户范围作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "fetchmail fetchmailconf 符号链接漏洞"
updated = "2026-06-16T21:56:09Z"

