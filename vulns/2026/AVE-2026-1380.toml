[basic]
description = "Open WebUI 是一款功能丰富的自托管 AI 平台。从 0.9.0 到 0.11.0 版本，其服务器端在获取用户提交的 URL 进行 RAG 内容摄取、URL 转 Markdown 及网页搜索时，仅对原始 IPv6 地址执行全局路由检查，未识别 IPv6 转换编码中嵌入的 IPv4 地址。在启用 NAT64 网关的网络环境中，任何已通过身份验证的低权限用户均可将内部服务或云元数据服务的 IPv4 地址包裹在 NAT64 知名前缀 `64:ff9b::/96` 中，绕过服务器端的目标地址过滤，使服务器代为发起请求并读取响应内容。攻击者可借此获取云实例元数据（含 IAM 角色凭据）、回环接口管理页面及 VPC/集群内部 API 等敏感信息，造成完整信息泄露。该漏洞利用高度依赖部署网络存在 NAT64 转换设施，因此攻击复杂度较高。此问题已在 v0.11.0 版本中修复。"
published = "2026-08-04T20:16:55Z"
remediation = "立即将 Open WebUI 升级至 v0.11.0 或更高版本，该版本通过在地址分类前解析 IPv4-in-IPv6 转换编码来修复此问题。如无法立即升级，可设置环境变量 ENABLE_LOCAL_WEB_FETCH=false 禁用 URL 获取功能，或在防火墙中阻止服务器访问内部网络及云元数据端点（169.254.169.254）。升级后无需额外配置变更即可完全缓解该漏洞。"
score = 7.1
severity = "HIGH"
sources = ["ghsa"]
title = "Open WebUI NAT64 编码 URL 服务器端请求伪造漏洞"
updated = "2026-08-05T16:17:02Z"

