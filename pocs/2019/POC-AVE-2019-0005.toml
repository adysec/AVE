[info]
author = "ave"
description = "检测目标是否受MSHTML引擎远程代码执行漏洞影响，通过发送包含HTAFILE标记的HTTP请求到/edit.html路径进行验证"
id = "POC-AVE-2019-0005"
name = "CVE-2019-0541 PoC"
severity = "high"
tags = ["ave-2019-0005"]
vuln_id = [
    "CVE-2019-0541",
    "AVE-2019-0005",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/edit.html"
protocol = "http"

[poc.requests.headers]
User-Agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["HTAFILE"]
