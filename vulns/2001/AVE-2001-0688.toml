[basic]
description = "Windows 2000 加密文件系统（EFS）在对文件进行加密后，未能正确销毁过程中产生的临时备份文件。具有本地访问权限的攻击者可通过访问系统临时目录，恢复这些未被彻底清除的加密文件备份，从而绕过 EFS 加密保护，直接获取敏感文件的原始明文内容。该漏洞影响 Windows 2000 操作系统中所有启用 EFS 功能加密的文件，攻击者仅需具备目标系统的本地登录权限，无需网络访问即可完成利用，可能导致机要信息泄露。"
published = "2001-06-02T04:00:00Z"
remediation = "安装 Microsoft 针对 CVE-2001-0261 发布的安全更新补丁，修复 EFS 临时文件未安全删除的问题。如暂时无法打补丁，使用 cipher /w 命令安全擦除磁盘空闲空间以覆盖 efs0.tmp 残留数据，或对敏感文件所在分区执行完全格式化后重新加密。建议升级至 Windows XP 或更高版本以获得完整的 EFS 安全保护。"
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "微软 Windows 2000 加密文件系统信息泄露漏洞"
updated = "2026-06-16T21:53:59Z"

