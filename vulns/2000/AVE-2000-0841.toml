[basic]
description = "BEA WebLogic 5.1.x 存在源代码泄露漏洞，远程攻击者无需身份认证即可通过在 URL 中插入 /ConsoleHelp/ 路径来触发 FileServlet 解析，从而读取 JSP、Servlet 等解析页面的原始源代码。该漏洞影响 BEA WebLogic 5.1.x 系列版本，攻击者只需能够访问目标 Web 管理控制台即可利用，可能导致敏感业务逻辑、数据库配置等关键信息泄露，为后续攻击提供情报支撑。"
published = "2000-10-20T04:00:00.000"
remediation = "升级 BEA WebLogic Server 至 5.1.x 的最新 Service Pack（SP10 或更高版本），或迁移至 Oracle WebLogic Server 12c/14c 等受支持版本。如无法升级，在 Web 服务器或反向代理层配置 URL 访问控制规则，阻止包含 `/ConsoleHelp/` 路径的请求到达 WebLogic 后端。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "BEA WebLogic 源代码泄露漏洞"
updated = "2026-06-16T21:52:15.503"

