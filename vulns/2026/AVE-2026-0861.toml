[basic]
description = "Hono 框架的 JSX 服务端渲染组件（hono/jsx）存在上下文隔离缺陷（CWE-362），在异步组件执行 `await` 挂起期间，上下文值存储于进程级全局结构而非请求级作用域，导致并发请求可相互读取或覆盖 `createContext`/`useContext`/`jsxRenderer`/`useRequestContext` 提供的上下文数据。攻击者无需认证即可利用该竞态条件漏洞，在并发请求场景下获取其他用户的渲染输出或绕过基于上下文的授权检查，造成敏感信息泄露与权限验证错乱。该漏洞影响 Hono 4.11.8 至 4.12.27 版本，已在 4.12.27 版本中修复。"
published = "2026-07-08T17:17:27.493"
remediation = "立即将 hono 升级至 v4.12.27 或以上版本（npm install hono@4.12.27）。如无法立即升级，避免在异步组件中在 await 之后读取 useContext() 或 useRequestContext() 的值，或将所有上下文读取操作移至 await 之前执行以降低风险。"
score = 6.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Hono JSX 服务端渲染跨请求上下文数据泄露漏洞"
updated = "2026-07-10T19:50:53.477"

