[basic]
description = "CVE-2011-3040 是一款影响 Apple iOS 5.1.1 及更早版本的 WebKit 浏览器资源管理漏洞。该漏洞源于 Safari 浏览器在处理网页资源时存在的安全缺陷，攻击者可通过精心构造的网页触发漏洞，破坏资源访问控制机制。受漏洞影响的用户在访问恶意网页时可能导致本地敏感文件泄露，或允许攻击者执行任意代码 compromising 设备安全。该漏洞影响广大 iOS 用户，攻击者无需身份验证即可远程实施攻击，威胁设备完整性和用户隐私，需及时更新系统补丁以修复该漏洞。"
published = "2012-03-05T19:55:01Z"
remediation = "建议立即升级 Apple iOS 至 6.0 或更高版本（通过 设置 > 通用 > 软件更新），或升级 Google Chrome 至 17.0.963.65 及以上版本。如无法立即升级 iOS，可暂时禁用 Safari 浏览器并使用已修复漏洞的第三方浏览器（如 Chrome 17+）作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 文本处理越界读取拒绝服务漏洞"
updated = "2026-06-16T23:32:29Z"

