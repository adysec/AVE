[info]
author = "ave"
description = "验证 Apple iTunes 10.7 之前版本中 WebKit 组件的内存破坏漏洞。远程攻击者可通过构造恶意网页触发内存错误，导致任意代码执行或应用程序崩溃。该漏洞无需身份认证即可利用，影响使用旧版 iTunes 的 macOS 系统用户。"
id = "POC-AVE-2012-0337"
name = "CVE-2012-3660 PoC"
severity = "medium"
tags = ["ave-2012-0337"]
vuln_id = [
    "CVE-2012-3660",
    "AVE-2012-0337",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/crafted_page.html"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
