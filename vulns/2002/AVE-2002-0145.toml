[basic]
description = "Microsoft Internet Explorer 5.01、5.5 及 6.0 版本中存在文件泄露漏洞。远程攻击者可通过向 GetObject 函数发送特制的畸形请求，绕过该函数的安全检查机制，从而读取目标系统上的任意文件内容。攻击者无需身份认证，仅需诱导用户访问恶意网页即可触发该漏洞，导致敏感信息泄露。该漏洞 CVSS 评分 5.0，危害等级中等。"
published = "2002-03-08T05:00:00Z"
remediation = '立即安装 Microsoft 安全公告 MS02-005 (Q316059) 提供的 Internet Explorer 累积安全更新。IE 5.01 用户需升级至 Windows 2000 SP2 并安装补丁；IE 5.5 用户安装 SP1/SP2 后打补丁；IE 6.0 用户直接安装。也可通过 Windows Update 自动更新。如无法打补丁，将不受信任站点加入受限站点区域，禁用"运行 ActiveX 控件和插件"作为临时缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer GetObject 文件泄露漏洞"
updated = "2026-06-16T21:56:36Z"

