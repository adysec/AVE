[basic]
description = "tags.<value>Linux系统中的Tnef程序存在任意文件写入漏洞，该程序在解压TNEF编码的压缩附件时未对解压输出路径进行合法性校验，允许远程攻击者通过在附件中指定绝对路径名，将解压后的文件写入到目标系统的任意位置。攻击者可利用此漏洞覆盖系统关键配置文件或可执行文件，从而提升权限或植入后门。该漏洞影响SUSE Linux等使用tnef工具的Linux发行版，无需身份认证即可触发，CVSS评分为10.0，危害等级极高。"
published = "2000-07-10T04:00:00.000"
remediation = "立即将 tnef 包升级至 0.124 及以上版本。在 SUSE Linux 上可通过运行 `zypper update tnef` 或使用 YaST 安全更新模块安装厂商补丁。升级前可临时禁用 tnef 服务以降低攻击面，确认更新完成后重新启用。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Tnef 程序 任意文件写入漏洞"
updated = "2026-06-16T21:52:06.793"

