[basic]
description = "多款索尼（SONY）网络摄像机存在信息泄露漏洞，源于设备未对敏感信息进行充分保护。同一局域网内的未经身份认证的攻击者可通过网络访问目标设备，利用该漏洞获取管理员权限并登录设备，进而执行任意操作，包括修改配置、查看视频流等。该漏洞影响 SNC-CH、SNC-DH、SNC-EB、SNC-EM、SNC-ZB、SNC-ZM、SNC-ZP、SNC-ZR、SNC-EP、SNC-ER、SNC-CX、SNC-VB、SNC-VM、SNC-WR、SNC-XM 等多个系列数百款型号的网络摄像机，固件版本低于 1.86.00 或 2.7.2 的均受影响。攻击者只需与目标处于同一局域网段即可发起攻击，无需任何身份凭证，危害严重。"
published = "2017-04-13T17:59:00Z"
remediation = "将受影响 SNC 系列网络摄像机固件升级至 Ver.1.86.00（CH/DH/EB/EM/ZB/ZM/EP/ER/ZP/ZR 系列）或 Ver.2.7.2（CX/EB/EM/VB/VM/WR/XM 系列）及以上版本。同时建议在交换机层面启用 802.1X 端口认证，限制同一局域网内未授权设备的网络访问，并禁用摄像机 Web 管理界面的默认管理员账户或修改默认密码。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "SONY network cameras 信息泄露漏洞"
updated = "2026-06-17T00:53:34Z"

