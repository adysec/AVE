[basic]
description = "eTrust Access Control（原名 SeOS）默认安装使用了固定的默认加密密钥，远程攻击者无需身份认证即可利用该密钥伪造 eTrust 管理员身份，从而获取系统完全控制权限。该漏洞影响 eTrust Access Control 默认安装版本，CVSS 评分 10.0，危害等级严重。厂商已发布安全更新，建议用户修改默认加密密钥或升级至修复版本。"
published = "2000-10-20T04:00:00.000"
remediation = "立即修改 eTrust Access Control 的默认加密密钥，在管理控制台中找到加密设置选项，将默认密钥替换为随机生成的强密钥（至少 32 位字符）。同时升级到 Broadcom 提供的最新安全版本，并在防火墙中限制对 eTrust 管理端口的访问，仅允许受信任的管理 IP 地址连接。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "CA eTrust Access Control 默认加密密钥远程欺骗权限提升漏洞"
updated = "2026-06-16T21:52:25.690"

