[basic]
description = "PHP 4.0.6 及更早版本、4.1.0/4.1.1 中的 php_mime_split 函数以及 PHP 3.0.x 中的 php3_mime_split 函数存在缓冲区溢出漏洞。当 file_uploads 选项启用时，远程攻击者可通过向目标服务器发送特制的 multipart/form-data HTTP POST 请求触发该漏洞，导致任意代码执行。该漏洞影响 PHP 3.0.x 至 4.1.1 版本，CVSS 评分 7.5，危害等级高，攻击者无需身份认证即可远程利用。"
published = "2002-03-08T05:00:00Z"
remediation = "立即升级 PHP 至 4.1.2 或更高版本（PHP 4.0.x 用户升级至 4.0.7 以上，PHP 3.0.x 用户升级至 4.x 系列）。各发行版用户请安装对应安全更新：Red Hat 安装 RHSA-2002:035/RHSA-2002:040、Debian 安装 DSA-115、Mandrake 安装 MDKSA-2002:017。如无法立即升级，可在 php.ini 中将 `file_uploads = Off` 作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "PHP 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:56:43Z"

