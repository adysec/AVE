[basic]
description = "CVE-2001-0157是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-06-02T04:00:00Z"
remediation = "建议立即将 Palm OS 升级至 3.5.3 或更高版本（推荐升级至 Palm OS 4.0 或 5.x），该版本已修复调试后门模式的安全绕过漏洞。若设备无法升级系统，可采取物理安全措施：启用设备密码锁定、禁止非授权人员接触设备、在企业环境部署设备管理策略限制调试接口访问。Palm OS 3.5.3 发布于 2001 年 6 月，可通过 Palm Desktop 软件或厂商官网获取对应设备的 ROM 更新包进行刷机升级。"
score = 4.6
