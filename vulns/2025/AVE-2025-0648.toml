[basic]
description = "Microsoft Access 存在堆缓冲区溢出漏洞（CWE-122），攻击者可通过诱导用户打开特制的 Access 数据库文件触发该漏洞。由于 Access 在处理文件时对输入数据长度校验不严，导致堆内存越界写入，成功利用此漏洞的攻击者可在当前用户上下文中执行任意代码。该漏洞无需攻击者拥有特权，但需要用户交互（如点击恶意文件），CVSS 评分 7.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:31Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新，通过 Windows Update 自动获取或访问 https://aka.ms/OfficeSecurityReleases 手动下载。Access 2016 用户应升级至 16.0.5483.1001 及以上版本。Microsoft 365 Apps for Enterprise 及 Office LTSC 2021/2024 用户需安装对应 Office 安全更新。临时缓解措施：不要打开来自不可信来源的 Access 数据库文件（.accdb/.mdb）。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Access 远程代码执行漏洞"
updated = "2026-06-17T08:42:43Z"

