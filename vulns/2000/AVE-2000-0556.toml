[basic]
description = "Luca Deri ntop 1.2 a7-9 及 1.3.1 版本在 Web 模式下运行时存在缓冲区溢出漏洞，远程未认证攻击者可通过向 Web 服务发送特制恶意数据触发缓冲区溢出，进而在目标系统上以 ntop 进程权限执行任意系统命令。该漏洞影响 ntop 1.2 a7-9 及 1.3.1 版本的 Web 管理界面，CVSS 评分 10.0（CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H），属于严重级别远程代码执行漏洞。攻击者无需认证即可通过网络远程利用，攻击复杂度低，可完全破坏系统机密性、完整性和可用性。攻击者可利用公开的 Exploit（如 ExploitDB-20150）发送精心构造的 HTTP 请求触发缓冲区溢出，获取服务器控制权。建议升级至修复版本或禁用 Web 管理模式。"
published = "2000-10-20T04:00:00Z"
remediation = "立即将 ntop 升级至支持版本 3.x 或以上，切换使用现代的 ntopng 监控工具，旧版 ntop  vulnerabilities 已废弃，建议直接迁移或更新至 ≥2020 版以获取完整的安全补丁"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Luca Deri ntop 1.2 a7-9/1.3.1 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:18Z"

