[basic]
description = "Linux 内核网络子系统的套接字缓冲区（skb）内存分配逻辑存在缺陷。当内核配置较大的 MAX_SKB_FRAGS 值时，small head cache 的大小无法适配 GRO（Generic Receive Offload）和 TCP 分配需求，导致 napi_alloc_skb() 和 __netdev_alloc_skb() 函数在分配内存时触发内核警告（splat）。该漏洞影响使用大页缓存配置的 Linux 内核，远程未经身份认证的攻击者可通过向目标系统发送网络流量触发该分配路径，导致内核出现拒绝服务（DoS）。受影响系统包括配置了 MAX_SKB_FRAGS=45 及类似较大值的 Linux 内核版本。攻击者无需交互即可利用此漏洞。官方补丁已修复此问题，通过确保 small head cache 能够适配 TCP 和 GRO 分配大小，并相应调整 kmalloc() 分配策略。"
published = "2025-03-27T14:15:47Z"
remediation = "建议立即升级 Linux 内核至 6.14 正式版或各发行版修复版本：SUSE Linux Enterprise 15 SP7 应用 SUSE-SU-2025:02307-1 补丁；Ubuntu 22.04/24.04 LTS 应用 USN-7703-1 更新；RHEL 系发行版关注 RHSA 公告升级内核包。若暂时无法升级，可通过设置内核参数 net.core.gro_max_head 调小 GRO 头部缓存限制作为临时缓解。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Linux kernel 网络子系统拒绝服务漏洞"
updated = "2026-07-30T06:21:42Z"

