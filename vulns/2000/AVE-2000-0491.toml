[basic]
description = "Big Brother 监控系统 1.4h2 及更早版本的默认配置中缺少适当的访问控制限制，导致远程攻击者可通过 bbd 组件上传具有可执行扩展名的文件，该文件随后会被 Web 服务器作为 CGI 脚本执行，从而实现任意命令执行。该漏洞影响 Big Brother 1.0/1.3/1.4 等多个版本，CVSS 评分 7.5，危害等级高。攻击者无需身份认证即可远程利用，获取系统控制权。官方已发布更新修复此问题。"
published = "2000-06-11T04:00:00Z"
remediation = "升级 Big Brother 至 1.5 及以上版本（该版本修复了 bbd 默认无访问限制的问题）；如无法升级，在 Web 服务器配置中禁止执行 /bb/logs/ 目录下的 CGI/PHP 脚本（如 Apache 中移除该目录的 ExecCGI 权限），并在防火墙层面限制对 bbd 服务端口（默认 1984/TCP）的访问，仅允许受信 IP 连接。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Sean MacGuire Big Brother CGI 文件上传远程命令执行漏洞"
updated = "2026-06-16T21:52:09Z"

