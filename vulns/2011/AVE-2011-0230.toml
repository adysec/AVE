[basic]
description = "Mozilla Firefox 7.0 及 Thunderbird 7.0 的浏览器引擎中存在多处内存安全漏洞，远程攻击者可通过构造特制的网页内容触发内存破坏，导致目标应用程序崩溃或拒绝服务，在特定条件下还可能实现任意代码执行。攻击无需用户认证，仅需诱导用户访问恶意页面即可触发，CVSS 评分 10.0，危害等级严重。Mozilla 已在后续版本中修复此漏洞。"
published = "2011-11-09T11:55:03Z"
remediation = "升级 Mozilla Firefox 至 8.0 及以上版本，Thunderbird 至 8.0 及以上版本。如无法立即升级，可禁用 JavaScript（在 Firefox 地址栏输入 about:config，将 javascript.enabled 设为 false）作为临时缓解措施，但会严重影响正常浏览功能，建议优先完成版本升级。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird 浏览器引擎内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:33:41Z"

