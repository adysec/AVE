[basic]
description = 'plone.app.textfield 组件中存在存储型跨站脚本（Stored XSS）漏洞。当 RichText 字段的存储 MIME 类型与输出 MIME 类型相同时，RichTextValue.output 方法会直接返回未经过滤的原始存储值。由于 text/x-html-safe 类型被标记为"已安全处理"，导致 safe_html 转换器完全被绕过，恶意 HTML 内容通过 tal:content="structure ..." 直接输出且不进行转义，攻击者可在浏览器中执行任意 JavaScript 代码。该漏洞影响 Plone 6.0/6.1/6.2 版本，攻击者可通过 REST API 或错误配置的 RichText 字段注入恶意载荷。官方已发布修复版本，建议升级 plone.app.textfield 至 2.0.2（Plone 6.0）、3.0.2（Plone 6.1）或 4.0.1（Plone 6.2）。'
published = "2026-01-01T00:00:00Z"
remediation = "升级 plone.app.textfield 至修复版本：Plone 6.0 升级至 2.0.2，Plone 6.1 升级至 3.0.2，Plone 6.2 升级至 4.0.1。同时检查 RichText 字段定义，确保 mimeType 与 outputMimeType 不同，避免绕过安全过滤。该漏洞无已知临时缓解措施，必须通过升级修复。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Plone plone.app.textfield 存储型跨站脚本漏洞"
updated = "2026-01-01T00:00:00Z"

