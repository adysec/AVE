[basic]
description = "System V 衍生操作系统的 `/bin/login` 程序存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过 telnet、rlogin 等远程登录服务，向目标系统传入大量额外参数触发该溢出，进而在目标系统上执行任意命令并完全控制主机。该漏洞影响基于 System V 的多种操作系统版本（包括 Solaris 2.5.1/2.6/7/8 等），攻击者无需任何凭据即可从网络发起利用。CVSS 评分为 10.0，危害等级为严重，Metasploit 等工具已公开相关利用模块。"
published = "2001-12-12T05:00:00Z"
remediation = "对于运行 Solaris 2.5.1/2.6/7/8 的 SPARC 架构系统，立即升级到 Solaris 8 Update 1 或更高版本以修复 /bin/login 中的缓冲区溢出漏洞。若无法立即升级，请在系统上禁用 telnet 和 rlogin 服务（通过 /etc/inetd.conf 注释掉相关行并重启 inetd），仅允许使用 SSH 协议进行远程登录。对于无法停用的服务，可在网络边界防火墙处限制源 IP 地址，仅允许受信任的主机访问 telnet/rlogin 端口（23/513）。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Solaris /bin/login 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:54:58Z"

