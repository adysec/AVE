[basic]
description = "Netscape SmartDownload 1.3 存在缓冲区溢出漏洞，远程攻击者可通过恶意网页向用户发送超长 URL 地址，当 SmartDownload 组件处理该 URL 时触发缓冲区溢出，从而在目标系统上执行任意命令。该漏洞影响使用 Netscape SmartDownload 1.3 的所有用户，攻击者无需身份验证即可通过网络发起低复杂度远程攻击，对目标系统的机密性、完整性和可用性造成部分影响。利用方式为攻击者诱骗用户访问包含恶意超长 URL 的网页，SmartDownload 自动下载时触发溢出并执行任意代码。"
published = "2001-07-02T04:00:00Z"
remediation = 'Netscape SmartDownload 1.3 已停止维护且厂商 Netscape 早已解散，无官方补丁。必须彻底卸载该软件：在 Windows「添加/删除程序」中移除 Netscape SmartDownload，并删除残留的 sdph20.dll 文件（通常位于 C:\Program Files\Netscape\SmartDownload\ 或系统目录）。建议改用现代下载管理器（如 Free Download Manager、JDownloader 2 或浏览器内置下载功能）。若在受控环境必须保留，可在防火墙层面拦截所有来自 SmartDownload 的出站连接，并禁止访问非受信网页以降低触发缓冲区溢出的风险。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Netscape SmartDownload 1.3 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:59Z"

