[basic]
description = "mailform CGI 脚本存在路径遍历漏洞，攻击者可通过构造包含目录遍历序列（如 ../）的参数绕过路径限制，读取服务器上任意文件内容。该漏洞影响使用 mailform 处理表单提交的 Web 应用，攻击者无需身份认证即可远程利用，仅需向目标发送恶意构造的 HTTP 请求即可泄露敏感文件（如 /etc/passwd、配置文件、源代码等），导致信息泄露并可能进一步攻击服务器。"
published = "2000-11-14T00:00:00Z"
remediation = "更新 MailForm 到最新版本（2.1或更高）并应用安全补丁包。禁用 mailform.pl 脚本或修改 XX-attach_file 参数验证规则，限制文件访问路径并实施权限检查。同时部署 WAF 规则过滤恶意参数访问，并定期审核系统文件权限配置。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Mailform mailform 任意文件读取漏洞"
updated = "2000-11-14T00:00:00Z"

