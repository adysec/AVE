[basic]
description = "Debian 2.2 系统自带的 splitvt 终端分屏工具 1.6.5 之前版本存在格式字符串漏洞。本地攻击者可通过向 -rcfile 命令行参数传递特制的格式字符串，利用程序对用户输入处理不当的问题触发该漏洞，成功利用后可导致任意代码执行，获取目标系统的完全控制权限（CIA 影响均为完全）。攻击前提是拥有本地访问权限，无需身份认证。"
published = "2001-03-12T05:00:00.000"
remediation = "升级 splitvt 至 1.6.5 或更高版本：`apt-get install splitvt=1.6.5`（或从源码编译安装最新版）。如无法升级，移除 splitvt 的 setuid 权限：`chmod u-s /usr/bin/splitvt`，并限制仅受信任用户可执行：`chmod 750 /usr/bin/splitvt`。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Debian splitvt 格式字符串本地权限提升漏洞"
updated = "2026-06-16T21:53:40.580"

