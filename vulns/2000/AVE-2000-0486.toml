[basic]
description = "HP JetDirect 打印机的 FTP 服务器组件存在拒绝服务漏洞。远程攻击者无需身份认证即可通过网络向目标设备的 FTP 服务发送特制的畸形 FTP QUOTE 命令，导致打印机 FTP 服务进程崩溃或停止响应，造成拒绝服务。该漏洞影响固件版本 G.08.20、H.08.20 及更早版本的 HP JetDirect 打印服务器设备。攻击者只需具备网络访问能力即可触发，无需任何权限，CVSS 评分 5.0，危害等级中等。"
published = "2000-07-19T04:00:00.000"
remediation = "升级 HP JetDirect 固件至 H.08.20 之后的版本（如 H.08.21 或更高），该漏洞已在后续固件中修复。如无法升级固件，可在网络边界防火墙或交换机 ACL 中限制对 JetDirect 设备 TCP 21 端口的访问，仅允许受信任的管理 IP 连接 FTP 服务，或直接禁用 JetDirect 内置 FTP 服务以消除攻击面。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "HP JetDirect FTP Server 拒绝服务漏洞"
updated = "2026-06-16T21:52:09.580"

