[basic]
description = "Power Up HTML 0.8033 Beta 中的 r.pl（又名 r.cgi）脚本存在目录遍历漏洞，远程攻击者可通过向 FILE 参数传递 `../` 等路径穿越序列，绕过访问限制读取服务器上的任意文件，甚至可能结合文件包含等方式实现远程代码执行。攻击无需身份认证，仅需构造特制 HTTP 请求即可触发，危害较大。"
published = "2001-09-07T04:00:00Z"
remediation = "立即停止使用 Power Up HTML 0.8033 Beta 及更早版本，该软件已停止维护且无官方补丁。彻底解决方案：从 Web 服务器上删除 `/cgi-bin/powerup/` 目录及所有相关 CGI 脚本，迁移至其他受支持的 Web 应用框架。临时缓解措施：在 Web 服务器（Apache/Nginx）配置中对 `r.cgi` 路径添加访问控制，仅允许授权 IP 访问；或在反向代理层过滤包含 `../` 的 `FILE` 参数请求。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Randy Parker Power Up HTML 目录遍历任意文件泄露漏洞"
updated = "2026-06-16T21:55:39Z"

