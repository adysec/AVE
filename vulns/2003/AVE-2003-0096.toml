[basic]
description = "标签中。<value>Adobe Acrobat Reader 5.0 至 5.06 及 Xpdf 0.9x/1.01 等 PDF 查看器在处理嵌入超链接时存在命令注入漏洞，远程攻击者可通过构造包含 Shell 元字符的特制 PDF 文件，诱导用户打开并点击其中的恶意超链接，从而在目标系统上执行任意命令。该漏洞影响 Unix/Linux 系统上的上述版本 PDF 阅读器，攻击者无需身份认证即可利用，CVSS 评分 7.5，危害等级高。用户应升级至修复版本并避免打开来源不明的 PDF 文件。"
published = "2003-07-24T04:00:00Z"
remediation = "建议立即将 Adobe Acrobat Reader 升级至 6.0 或更高版本，并将 Xpdf 升级至 1.02 或更高版本以修复该漏洞。如无法立即升级，可临时禁用 PDF 查看器中的嵌入式超链接功能，或避免打开来自不受信任来源的 PDF 文件。对于 Linux 系统用户，可通过 yum update 安装 Red Hat 提供的安全补丁 RHSA-2003-196 和 RHSA-2003-197。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Adobe Acrobat Reader Xpdf 嵌入式超链接任意命令执行漏洞"
updated = "2026-06-16T22:02:11Z"

