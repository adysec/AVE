[basic]
description = "Texas Imperial Software WFTPD 及 WFTPD Pro 2.41 版本在处理 MLST 命令时存在拒绝服务漏洞。远程攻击者无需身份认证即可在登录服务器之前向目标 FTP 服务发送特制的 MLST 命令，导致服务进程崩溃或停止响应，造成拒绝服务。该漏洞利用方式简单，攻击者仅需建立 TCP 连接并发送恶意 MLST 指令即可触发，影响 WFTPD 2.4.1/2.4.1 Rc11/2.34/2.40 等多个版本。"
published = "2000-07-21T04:00:00Z"
remediation = "升级 WFTPD 至 2.4.1 RC11 或更高版本，该版本修复了未登录状态下执行 MLST 命令导致服务崩溃的问题。如无法立即升级，可在 WFTPD 配置中禁用 MLST 功能（默认未启用），并在防火墙层面限制对 FTP 端口 21 的访问来源，仅允许可信 IP 连接。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Texas Imperial Software WFTPD MLST命令拒绝服务漏洞"
updated = "2026-06-16T21:52:11Z"

