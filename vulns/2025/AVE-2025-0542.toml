[basic]
description = "TLS 1.2 协议在握手过程中存在摘要算法降级漏洞。当客户端与服务器建立 TLS 1.2 连接时，客户端可选择使用比服务器 CertificateRequest 中指定更弱的摘要算法，而非遵循服务器要求的摘要算法列表。该漏洞影响 wolfSSL 等实现了 TLS 1.2 协议的软件库，攻击者需位于同一网络且拥有低权限，无需用户交互即可触发。成功利用可导致连接层面机密性和完整性降低，使通信内容面临被窃听或篡改的风险，wolfSSL 已通过合并上游拉取请求修复该问题。"
published = "2025-11-22T00:15:54Z"
remediation = '升级 wolfSSL 至 5.8.4 或更高版本，该补丁在 https://github.com/wolfSSL/wolfssl/pull/9395 修复了 TLS 1.2 握手过程中客户端可绕过 CertificateRequest 中指定的摘要算法限制、降级使用较弱摘要的问题。如暂无法升级，可临时通过配置禁用 TLS 1.2 并强制使用 TLS 1.3，或通过 WOLFSSL\_NO\_OLD\_TLS 等编译选项阻止旧版 TLS 协议回退。'
score = 2.3
severity = "LOW"
sources = ["msrc"]
title = "wolfSSL TLS 1.2 摘要算法降级漏洞"
updated = "2026-06-17T08:33:09Z"

