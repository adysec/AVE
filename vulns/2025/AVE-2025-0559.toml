[basic]
description = "GLib 库中的 g_escape_uri_string() 函数存在整数溢出漏洞，由于在计算转义后字符串长度时未正确处理大量需要转义的特殊字符，导致缓冲区大小计算错误，可能引发堆溢出。攻击者可构造包含大量需转义字符的恶意 URI 字符串，触发该漏洞导致内存写入越界，进而可能实现远程代码执行。该漏洞影响使用 GLib 库的所有应用程序，尤其影响 SUSE Linux Enterprise Server 15 等发行版中的 glib2 包。CVSS 评分为 7.7（高危），攻击复杂度为低，无需身份认证即可触发。"
published = "2025-11-26T15:15:51Z"
remediation = "升级 GLib 到最新版本：Ubuntu 用户运行 `sudo apt update && sudo apt upgrade libglib2.0-0` 至至少 2.74.6 版本（或 2.80+）；Fedora 用户运行 `sudo dnf upgrade glib2` 至 2.78.5+ 版本；CentOS/RHEL 执行 `sudo yum update glib2` 至 2.71.4+。对于 SUSE 用户使用 `zypper patch SUSE-SU-2025:4442-1` 应用安全补丁。对于 Debian 用户运行 `apt-get install glib2.0` 更新至 ≥2.74.6。此外，建议检查系统中所有依赖 GLib 的应用和服务，运行 `ldd $(which your-application)` 验证实际版本。同时，可以通过向防火墙添加规则阻止对 GLib 服务的高频或特殊字符字符串输入来临时缓解风险。"
score = 7.7
severity = "HIGH"
sources = ["msrc"]
title = "GNOME GLib g_escape_uri_string 整数溢出漏洞"
updated = "2026-06-30T00:16:52Z"

