[basic]
description = "Atlassian Jira Server 与 Data Center 的 ContactAdministrators 和 SendBulkMail 功能中存在服务端模板注入漏洞。未经身份认证的远程攻击者可通过向受影响版本的 Jira 发送特制的邮件模板请求，利用 Velocity 模板引擎解析用户输入，实现远程代码执行。该漏洞影响 Jira Server 和 Data Center 从 4.4.0 到 7.6.14、7.7.0 到 7.13.5、8.0.0 到 8.0.3、8.1.0 到 8.1.2 以及 8.2.0 到 8.2.3 等多个版本，CVSS 评分 9.8，危害等级严重。Atlassian 已在 2019 年 8 月的安全公告中发布修复版本。"
published = "2019-08-09T20:15:11Z"
remediation = "立即升级 Jira Server/Data Center 至以下安全版本：7.6.14+、7.13.5+、8.0.3+、8.1.2+ 或 8.2.3+。如无法立即升级，可在反向代理层限制对 `/secure/ContactAdministrators!default.jspa` 和 `/secure/admin/SendBulkMail!default.jspa` 路径的外部访问，或禁用 SMTP 邮件模板自定义功能作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Atlassian Jira Server and Data Center 服务器端模板注入远程代码执行漏洞"
updated = "2026-06-17T02:13:12Z"

