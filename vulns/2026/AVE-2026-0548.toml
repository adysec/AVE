[basic]
description = "Apple Model I/O 框架在处理恶意构造的文件时存在内存访问越界漏洞（CWE-119）。由于对文件数据边界检查不足，攻击者可通过诱导用户打开特制文件触发越界读取或写入操作，导致应用程序崩溃拒绝服务，或泄露进程内存中的敏感信息。该漏洞影响 iOS 18.7.9/iPadOS 18.7.9、macOS Sequoia 15.7.7 及 macOS Tahoe 26.5 之前版本，攻击需用户交互（如打开恶意文件），CVSS 评分 7.1，危害等级高。Apple 已在 2026 年 5 月安全更新中修复此漏洞。"
published = "2026-05-11T21:18:55Z"
remediation = "立即将 iOS/iPadOS 升级至 18.7.9 或更高版本，macOS Sequoia 升级至 15.7.7 或更高版本，macOS Tahoe 升级至 26.5 或更高版本。可通过系统设置中的软件更新功能或 Apple 官方支持页面下载安装。临时缓解措施：避免在受影响系统上打开来源不明的文件，尤其是模型文件。如无法立即升级，可配置终端安全软件对 Model I/O 相关进程进行监控，限制可疑文件读取行为。"
score = 7.1
severity = "HIGH"
sources = ["zdi"]
title = "Apple Model I/O 文件处理内存越界读取漏洞"
updated = "2026-06-17T10:29:22Z"

