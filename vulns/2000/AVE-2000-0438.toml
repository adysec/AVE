[basic]
description = "3R Soft MailStudio 2000 2.0 及更早版本中的 userreg.cgi CGI 程序存在任意命令执行漏洞。远程攻击者无需身份认证即可通过向 userreg.cgi 提交包含 shell 元字符（如管道符、分号等）的特制请求，利用 CGI 程序对用户输入过滤不严的缺陷，在服务器上以 Web 服务进程权限执行任意系统命令，可导致服务器被完全控制、敏感数据泄露或进一步横向渗透。"
published = "2000-06-09T04:00:00Z"
remediation = "立即删除或禁用服务器上的 userreg.cgi 脚本，或限制其仅允许本地访问。在 Web 服务器（Apache/IIS）层面配置输入过滤规则，拦截 shell 元字符（如 `;` `|` `&` `` ` `` `$`）。由于 3R Soft 已停止维护 MailStudio 2000，建议迁移至其他受支持的邮件服务器软件。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "3R Soft MailStudio 2000 userreg.cgi 远程命令执行漏洞"
updated = "2026-06-16T21:51:55Z"

