[basic]
description = "Google Chrome 浏览器的 Media Stream（媒体流）组件中存在一个释放后使用（Use-After-Free）漏洞。该漏洞源于 WebRTC 模块在处理媒体流时的内存管理实现不当，导致对象在被释放后仍被非法引用。远程攻击者可以通过诱导用户访问一个精心构造的恶意 HTML 页面，触发堆损坏（Heap Corruption），从而在受害者系统中实现任意内存读写，并可能进一步导致远程代码执行。该漏洞影响 Google Chrome 143.0.7499.41 之前的版本，攻击条件为用户通过浏览器加载恶意网页。"
published = "2025-12-02T19:15:48Z"
remediation = "建议立即将 Google Chrome 浏览器升级至 143.0.7499.41 或更高版本。用户可以通过“关于 Google Chrome”页面触发自动更新，或前往 Chrome 官网下载并安装最新稳定版，以修复 Media Stream 模块中的释放后使用漏洞。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome 媒体流释放后使用漏洞"
updated = "2026-06-17T08:34:29Z"

