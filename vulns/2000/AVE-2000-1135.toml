[basic]
description = "ITServ RideWayPN 6.22 版本的 Telnet 代理服务未能正确限制并发连接数且缺乏对畸形请求的有效过滤机制。未经身份验证的远程攻击者可通过向目标服务器持续发送大量包含畸形内容的连接请求，对 Telnet 代理发起连接洪泛攻击，导致代理服务资源耗尽而无法响应合法请求。该漏洞影响运行 ITServ RideWay PN proxy server 6.22 版本的系统，攻击者无需任何凭据即可远程利用此漏洞实施拒绝服务攻击。CVSS v2 评分为 5.0，危害等级中等，建议升级至更高版本或采取访问控制措施限制对 Telnet 代理端口的访问。"
published = "2001-01-09T05:00:00Z"
remediation = "立即将 ITServ RideWayPN 6.22 代理服务升级至厂商最新版本（若厂商仍提供支持），或迁移至现代维护中的代理服务器（如 Squid、HAProxy 或 Nginx）。若无法升级或迁移，请在防火墙层面限制入站 Telnet 连接速率（如 iptables 设置 `--limit` 规则），并在代理配置中启用最大并发连接数限制和请求超时机制，阻断异常高频的畸形连接请求。同时关闭不必要的 Telnet 代理功能以缩小攻击面。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "ITServ RideWayPN Telnet Proxy 拒绝服务漏洞"
updated = "2026-06-16T21:53:20Z"

