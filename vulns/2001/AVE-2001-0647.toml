[basic]
description = "Netscape Directory Server 4.12 及更早版本存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标目录服务器发送包含恶意构造收件人字段的 LDAP 请求包触发该溢出，导致目录服务拒绝服务或在目标系统上执行任意命令。该漏洞影响运行 Netscape Directory Server 4.12 及以下版本的系统，攻击者无需事先获取凭据，仅需网络可达目标 LDAP 服务端口即可发起攻击。成功利用可能导致目录服务崩溃、敏感目录信息泄露或完全接管目标服务器。"
published = "2001-06-02T04:00:00.000"
remediation = "建议升级至 Netscape Directory Server 4.13 或更高版本（已包含该缓冲区溢出修复），若无法升级，可在防火墙层面限制仅信任 IP 访问目录服务端口（默认 389/636），并禁用匿名绑定作为临时缓解措施"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Netscape Directory Server 4.12 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:47.370"

