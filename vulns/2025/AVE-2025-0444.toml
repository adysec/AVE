[basic]
description = "GNU Binutils 2.45 的 binutils/objdump.c 文件中 dump_dwarf_section 函数存在越界读取漏洞。本地攻击者可通过向目标系统提交特制的畸形 DWARF 调试信息文件触发该漏洞，导致 objdump 进程读取越界内存，可能造成敏感信息泄露或程序崩溃。该漏洞仅需本地低权限访问即可利用，无需用户交互。目前已有公开的 PoC 利用代码，建议用户及时安装补丁 f87a66db645caf8cc0e6fc87b0c28c78a38af59b 进行修复。"
published = "2025-09-27T22:15:32Z"
remediation = "立即应用上游补丁 f87a66db645caf8cc0e6fc87b0c28c78a38af59b，升级 GNU Binutils 至 2.45 以上版本（如 2.46 或最新快照）。若无法升级，可手动修补 binutils/objdump.c 中 dump_dwarf_section 和 dump_sframe_section 函数，在访问 elf_section_type 前增加 bfd_get_flavour 检查以规避非 ELF 文件导致的段错误。"
score = 1.9
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils objdump 越界读取漏洞"
updated = "2026-06-17T08:29:36Z"

