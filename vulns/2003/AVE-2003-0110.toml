[basic]
description = 'Postfix 1.1.12及更早版本的地址解析器代码存在拒绝服务漏洞。当邮件地址包含".!"字符串时，地址解析器未能正确校验输入格式，导致邮件队列管理器(nqmgr)或SMTP监听进程发生死锁。未经身份认证的远程攻击者可通过向目标邮件服务器发送特制构造的邮件触发该漏洞：方式一为发送包含畸形信封地址的本地邮件并生成退信，使MAIL FROM或Errors-To头中包含".!"字符串从而锁定nqmgr；方式二为在有效MAIL FROM中使用包含".!"字符串的RCPT TO地址，锁定SMTP监听实例。该漏洞影响运行Postfix 1.1.12及更早版本的邮件服务器，攻击者无需凭据即可利用，成功利用将导致邮件服务拒绝服务。'
published = "2003-08-27T04:00:00Z"
remediation = "Postfix 1.1.9 至 1.1.12 版本应立即升级到 1.1.13 或更高版本（包括 2.0 及后续版本），彻底修复地址解析器漏洞。若暂无法升级，可在 main.cf 中设置 append_dot_mydomain=yes 以阻止该漏洞被触发，并配置 resolve_dequoted_address=no 禁用对带引号地址的递归解析；同时在 main.cf 中添加 header_checks 规则拒绝 Errors-To 头中含多个路由运算符的邮件，并在 smtpd_sender_restrictions 中配置正则表达式规则拒绝 SMTP 发件人地址中的多个路由运算符，以缓解拒绝服务攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Wietse Venema Postfix 地址解析器拒绝服务漏洞"
updated = "2026-06-16T22:02:23Z"

