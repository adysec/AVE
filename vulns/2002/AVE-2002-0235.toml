[basic]
description = "EZNE.NET EasyBoard 2000 1.27 (即 EZboard) 存在远程缓冲区溢出漏洞，攻击者可通过向 ezboard.cgi、ezman.cgi 或 ezadmin.cgi 发送包含超长 boundary 值的 multipart Content-Type 头触发缓冲区溢出，进而实现远程任意代码执行。该漏洞影响 EasyBoard 2000 1.27 版本，攻击者无需身份认证即可远程利用，CVSS 评分 7.5（高危），影响机密性、完整性和可用性。攻击者通过构造畸形的 multipart 请求，在处理 boundary 参数时触发栈缓冲区溢出，劫持程序控制流执行任意代码。ExploitDB 已公开 PoC (EDB-21287)，攻击者可直接利用实现远程代码执行。"
published = "2002-05-29T04:00:00Z"
remediation = "建议立即升级至 EasyBoard 2000 1.28 及以上版本或迁移至现代论坛系统（如 Discuz!、phpBB）。若无法升级，请在 Web 服务器层面配置规则拦截 multipart Content-Type 中超长 boundary 值（限制长度 ≤ 256 字节），或在 Web 服务器配置中禁用/删除 ezboard.cgi、ezman.cgi、ezadmin.cgi 三个易受攻击的 CGI 脚本。同时建议在 WAF 层面添加规则拦截包含异常长 boundary 参数的 multipart 请求。若业务允许，建议彻底下线该组件并迁移至维护中的论坛系统。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "EZNE.NET Ezboard 2000 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:57:06Z"

