[basic]
description = 'Caucho Technology Resin 1.2 及更早版本存在 JSP 源代码信息泄漏漏洞。远程未经身份认证的攻击者可通过向目标服务器发送特制的 HTTP 请求来利用此漏洞，具体方式是在 .jsp 文件名后附加特定字符（如 ".."、"%2e.."、"%81"、"%82" 等），ServletExec 引擎未能正确处理此类请求，反而将 JSP 源文件的原始内容以明文形式返回给攻击者。该漏洞影响运行 Resin 1.2/1.1 并与 Apache/ServletExec 集成的 Win32 平台，攻击条件简单，无需任何身份验证凭据，攻击复杂度极低。成功利用可导致敏感信息泄露，JSP 文件中可能包含数据库连接字符串、业务逻辑代码、内部架构信息等关键内容，为后续攻击提供有利情报。Caucho Technology 在漏洞公开披露时未及时发布修复补丁，建议受影响用户升级至 Resin 后续安全版本并审查 JSP 文件中的敏感信息。'
published = "2000-11-23T05:00:00Z"
remediation = '建议升级至 Caucho Resin 2.0 或更高版本，该版本已修复 JSP 源码泄漏问题。若无法升级，可在 Web 服务器层面配置拦截包含 ".."、"%2e"、"%81"、"%82" 等路径遍历字符的请求，或在 servlet-mapping 中显式禁止直接访问 *.jsp 文件，仅允许通过前端控制器访问。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Caucho Technology Resin JSP源代码泄漏漏洞"
updated = "2026-06-16T21:53:25Z"

