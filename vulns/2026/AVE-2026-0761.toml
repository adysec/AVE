[basic]
description = "Pterodactyl Wings 服务器控制面板的 SFTP 连接握手过程中存在输入验证不当漏洞（CWE-129），未经身份认证的远程攻击者可通过向目标系统开放的 SFTP 端口发送特制的恶意数据包，触发 Go 语言运行时 panic 导致服务进程崩溃，造成拒绝服务。该漏洞影响所有开启了 SFTP 端口的 Wings 用户，CVSS 评分 7.5，危害等级高。官方已在 1.13.0 版本中修复此漏洞，建议用户升级或关闭 SFTP 端口作为临时缓解措施。"
published = "2026-07-31T17:16:33Z"
remediation = "立即将 Pterodactyl Wings 升级至 v1.13.0 或更高版本（https://github.com/pterodactyl/wings/releases/tag/v1.13.0），该版本已修复 SFTP 握手阶段畸形包导致的 Go panic 问题。如无法立即升级，可在防火墙层面关闭 SFTP 端口（默认 22）作为临时缓解措施，或限制可访问 SFTP 端口的源 IP 范围。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Pterodactyl Wings SFTP 握手拒绝服务漏洞"
updated = "2026-07-31T19:17:09Z"

