[basic]
description = "ncurses 库存在缓冲区溢出漏洞，本地攻击者可通过设置超长的环境变量（如 TERM 或 TERMINFO_DIRS）触发该漏洞，导致执行任意命令。该漏洞影响使用 ncurses 库的多个 Linux 发行版（包括 Immunix 等），CVSS 评分 7.2，危害等级高。攻击者需拥有本地系统访问权限，利用方式为向受影响程序传递特制的环境变量数据，溢出缓冲区后劫持控制流执行恶意代码。"
published = "2000-12-19T05:00:00Z"
remediation = "将 ncurses 库升级至 5.6 或更高版本。对于使用 ncurses 的发行版（如 Caldera OpenLinux），安装厂商提供的安全补丁（参考 CSSA-2000-036）。如无法立即升级，可限制本地用户设置过长的 TERM/TERMINFO_DIRS 环境变量，或通过系统级环境变量长度检查脚本拦截超长输入作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "GNU ncurses 库缓冲区溢出本地代码执行漏洞"
updated = "2026-07-23T18:58:25Z"

