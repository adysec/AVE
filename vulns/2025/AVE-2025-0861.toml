[basic]
description = "Microsoft SharePoint Server 存在授权不当漏洞（CWE-285），低权限认证攻击者可通过向受影响版本的 SharePoint 服务器发送特制请求触发远程代码执行。该漏洞源于 SharePoint 对用户权限的校验不充分，导致低权限用户能够以更高权限执行任意代码。攻击者需先获得 SharePoint 的低权限账户，并诱导高权限用户（如管理员）执行特定操作（如点击恶意链接或打开特制文件），从而在目标服务器上实现完全控制，包括读取、修改和删除数据。该漏洞影响 SharePoint Enterprise Server 2016、SharePoint Server 2019 及 SharePoint Server Subscription Edition。Microsoft 已在 2025 年 2 月安全更新中发布补丁修复此漏洞。"
published = "2025-02-11T18:15:38.483"
remediation = "建议立即安装 Microsoft 2025 年 2 月安全更新，将 SharePoint Enterprise Server 2016 升级至 16.0.5487.1000 及以上版本、SharePoint Server 2019 升级至 16.0.10416.20050 及以上版本、SharePoint Server Subscription Edition 升级至 16.0.17928.20396 及以上版本。如无法立即打补丁，建议限制低权限用户对 SharePoint 站点的访问，并审核所有用户上传内容以防止利用授权不当触发远程代码执行。"
score = 8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft SharePoint Server 远程执行代码漏洞"
updated = "2026-06-17T08:43:16.790"

