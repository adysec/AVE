[info]
author = "ave"
description = "Google Chrome 18.0.1025.142 之前版本在处理文本片段时存在越界读漏洞，可导致浏览器崩溃。该漏洞利用向量未公开，无法构建确定性 PoC。"
id = "POC-AVE-2011-0195"
name = "CVE-2011-3060 PoC"
severity = "medium"
tags = ["ave-2011-0195"]
vuln_id = [
    "CVE-2011-3060",
    "AVE-2011-0195",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["no_vuln_proof"]
