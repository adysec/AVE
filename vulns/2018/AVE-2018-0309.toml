[basic]
description = "MikroTik RouterOS 6.42 及之前版本的 WinBox 管理接口存在目录遍历漏洞。未经身份认证的远程攻击者可通过向目标设备的 TCP 8291 端口（WinBox 服务默认端口）发送特制的请求包，利用路径遍历绕过身份验证，实现任意文件读取，包括系统密码文件、配置文件和用户数据库等敏感信息。已认证的远程攻击者还可利用该漏洞写入任意文件，进而实现远程代码执行。该漏洞影响所有运行 RouterOS 6.42 及更早版本的路由器设备，无需任何用户交互即可触发，危害严重。MikroTik 已在 RouterOS 6.43rc3 版本中修复此漏洞。"
published = "2018-08-02T07:29:00Z"
remediation = "升级 MikroTik RouterOS 至 6.43rc3 或更高版本（Long-term 升级至 6.42.1 及以上）。通过 WinBox 或 Web 界面在 System → Software 中检查更新并安装。如无法立即升级，可在防火墙规则中限制对 8291 端口（WinBox 服务）的访问，仅允许可信 IP 连接。"
score = 9.1
severity = "CRITICAL"
sources = ["kev"]
title = "MikroTik RouterOS WinBox 目录遍历漏洞"
updated = "2026-06-17T01:41:44Z"

