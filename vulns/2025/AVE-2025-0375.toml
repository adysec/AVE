[basic]
description = "Linux 内核 net/sched 子系统的 ETS（Enhanced Transmission Selection）调度器存在条件竞争漏洞。`ets_qdisc_change` 函数在释放旧 class 的 Qdisc 对象后未及时将其从活跃链表中移除，导致 `ets_qdisc_dequeue` 可并发访问已释放的 `struct Qdisc` 对象，触发 Use-After-Free。本地攻击者需具备创建用户和网络命名空间的权限，通过并发触发 `tc qdisc change` 与数据包收发操作之间的竞争窗口，可实现权限提升或内核代码执行。该漏洞影响 Linux 内核各发行版版本，CVSS 评分 7.5，危害等级高。"
published = "2026-01-13T16:16:05Z"
remediation = '立即更新 Linux 内核至包含提交 0a8c5f1e2b3c（"net/sched: ets: Always remove class from active list before deleting in ets_qdisc_change"）的版本，该修复已合入主线内核 6.13 及以上版本。各发行版用户：Ubuntu 22.04 LTS 升级至 linux-image-5.15.0-1109-azure-fips 5.15.0-1109.118+fips1 或安装 USN-8163-1 对应更新；SUSE Linux Enterprise 15 SP7 安装 SUSE-SU-2026:0587-1 更新。如无法立即升级内核，可通过限制用户创建新的网络命名空间权限（移除 `cap_net_admin` 能力或使用 seccomp 过滤 `unshare(CLONE_NEWNET)`）作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["zdi"]
title = "Linux 内核 net/sched ETS 调度器竞争条件释放后使用漏洞"
updated = "2026-06-17T10:03:35Z"

