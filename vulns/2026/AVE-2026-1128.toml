[basic]
description = "标签之间。<value>Adobe Acrobat Reader 存在释放后使用（Use After Free）漏洞，该漏洞可导致敏感内存信息泄露。受影响版本包括 24.001.30365、26.001.21651 及更早版本。攻击者需构造恶意 PDF 文件，并诱骗用户使用受影响版本的 Acrobat Reader 打开该文件才能触发漏洞。成功利用后，攻击者可读取敏感内存数据，造成信息泄露。该漏洞需用户交互方可利用，危害等级为中危，CVSS v3.1 评分为 5.5。"
published = "2026-06-09T21:17:22Z"
remediation = '立即将 Adobe Acrobat Reader 升级至 24.001.30383 或 26.001.21662 及更高版本，可通过 Adobe 菜单"帮助→检查更新"或访问 Adobe 官网下载安全补丁。如暂时无法升级，建议不要打开来历不明的 PDF 文件，并配置邮件网关和浏览器插件阻止自动下载 PDF 附件，以降低攻击面。'
score = 5.5
severity = "MEDIUM"
sources = ["zdi"]
title = "Adobe Acrobat Reader 释放后使用信息泄露漏洞"
updated = "2026-07-23T09:10:00Z"

