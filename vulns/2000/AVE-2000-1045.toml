[basic]
description = 'Microsoft Exchange Server 5.5 在处理带有空白字符集（charset=""）的 MIME 邮件头时存在解析缺陷，远程攻击者无需身份认证即可向目标服务器发送特制的包含畸形 MIME 头的邮件，触发服务进程崩溃，导致拒绝服务。该漏洞影响 Exchange 5.5 版本，攻击复杂度低，仅需通过网络发送恶意邮件即可利用，无需用户交互。'
published = "2000-12-11T05:00:00.000"
remediation = "Exchange Server 5.0 用户应立即安装微软安全公告 MS00-082 提供的补丁（累积更新包，同时修复 MS01-041 和 MS03-046）；Exchange Server 5.5 用户应升级至 Service Pack 4 或安装对应安全补丁。安装后重启 Exchange 服务并清除队列中畸形邮件即可恢复正常运行。Exchange 2000 不受此漏洞影响。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Exchange Server 5.5 MIME Header 拒绝服务漏洞"
updated = "2026-06-16T21:52:57.420"

