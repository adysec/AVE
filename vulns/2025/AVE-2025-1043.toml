[basic]
description = "Linux 内核 renesas_usbhs USB 驱动存在空指针解引用漏洞。在 Renesas RZ/G2L SoC 平台上，当连续执行 USB 驱动的解绑与绑定操作时，驱动程序的延迟工作队列 notify_hotplug_work 可能在资源已释放的情况下仍被执行，导致 usbhsc_notify_hotplug() 函数访问空指针引发内核崩溃。该漏洞仅影响本地低权限用户，攻击者需具备目标系统的本地登录权限，并通过反复执行驱动的卸载与重载操作方可触发，最终造成系统拒绝服务。建议升级至修复该问题的 Linux 内核版本。"
published = "2025-04-01T16:15:22Z"
remediation = "升级 Linux 内核至已包含修复的稳定版本。对于 Ubuntu 系统，24.04 LTS 应升级至 6.8.0-84.84 或更高版本，22.04 LTS 应升级至 5.15.0-140.150 或更高版本，20.04 LTS 应升级至 5.4.0-216.236 或更高版本；对于 Debian 系统，bookworm 应升级至 6.1.133-1 或更高版本，bullseye 应升级至 5.10.237-1 或更高版本。可通过 `apt update && apt upgrade linux-image-*` 或各发行版包管理器应用安全更新，或启用自动安全更新以确保及时获取内核补丁。重启系统使新内核生效。如暂无法升级，可临时避免在 Renesas RZ/G2L SoC 上对 USB 驱动执行频繁的 unbind/bind 操作以降低风险。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel renesas_usbhs 空指针解引用漏洞"
updated = "2026-06-17T08:44:36Z"

