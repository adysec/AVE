[basic]
description = "OpenLDAP 2.2.0 及更早版本中的 libldap 库在解析 .ldaprc 配置文件时存在缺陷，当应用程序以提升权限运行时，远程或本地攻击者可通过构造恶意的 .ldaprc 文件触发该漏洞，导致任意代码执行。该漏洞影响 OpenLDAP 2 系列多个版本，CVSS 评分 7.5，危害等级高，攻击者无需认证即可远程利用。"
published = "2003-01-02T05:00:00Z"
remediation = "立即升级 OpenLDAP 至 2.2.0 以上版本（如 2.3.x 或更高），该漏洞在后续版本中已修复。Debian 用户请安装 DSA-227 对应安全更新包。临时缓解措施：确保 .ldaprc 文件权限为 600 且属主为可信用户，避免以 root 等高权限运行调用 libldap 的应用程序。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "OpenLDAP libldap .ldaprc 文件读取远程代码执行漏洞"
updated = "2026-06-16T21:59:13Z"

