[basic]
description = "Apple Safari 6.0 之前版本使用的 WebKit 引擎存在内存破坏漏洞（CWE-119），远程攻击者可通过诱导用户访问特制网站触发内存损坏，导致任意代码执行或拒绝服务（应用程序崩溃）。该漏洞影响 Safari 6.0 之前版本及 iOS 6.0 之前版本，攻击无需身份认证但需用户交互，CVSS 评分 9.3，危害等级严重。Apple 已在 Safari 6.0 及 iOS 6.0 更新中修复此漏洞。"
published = "2012-07-25T20:55:01Z"
remediation = "立即将 Apple Safari 升级至 6.0 或更高版本（Apple 于 2012 年 7 月 25 日发布 Safari 6.0 修复此漏洞），同时确保 iOS 设备升级至 iOS 6.0 及以上。如无法升级，可禁用 JavaScript 并避免访问不可信网站作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏漏洞"
updated = "2026-06-16T23:38:04Z"

