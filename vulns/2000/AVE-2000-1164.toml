[basic]
description = "FTGate 邮件服务器内置的 POP3 服务存在用户名枚举信息泄露漏洞。当远程攻击者向目标服务器的 POP3 端口发送特制的 USER 命令并附带无效用户名时，服务器会返回特定的 -ERR 错误响应；而当用户名在系统中真实存在时，服务器返回的 -ERR 响应内容与无效用户名的响应存在明显差异。攻击者可通过比对响应内容的区别，远程判断出服务器上哪些用户名是真实有效的，从而为后续针对已知有效账户的暴力破解密码猜测攻击提供目标列表。该漏洞无需身份认证即可触发，影响范围涵盖所有运行 FTGate 邮件服务器的系统。攻击者利用该漏洞枚举出有效用户名后，可进一步实施字典攻击或暴力破解手段获取邮箱账户密码，最终读取邮件内容、窃取敏感信息或冒充用户进行进一步攻击。CVSS v3 评分为 9.1（严重等级），攻击向量为网络可达、攻击复杂度低、无需权限、无需用户交互。"
published = "2000-12-31T00:00:00Z"
remediation = "建议将 FTGate POP3 服务器升级至当前受支持的邮件服务器软件（如 Dovecot、Courier 或 Microsoft Exchange），以彻底消除用户名枚举漏洞。如暂无法立即迁移，应在防火墙或访问控制列表中限制 POP3 端口 110 和 995 的访问来源，仅允许可信 IP 段连接。同时在服务器或前端设备上配置账户锁定策略，连续多次认证失败后临时封禁源 IP。此外，建议在邮件服务器前部署入侵检测系统（IDS），监控异常 USER 命令枚举行为并触发告警。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "FTGate POP3 服务器用户名枚举漏洞"
updated = "2000-12-31T00:00:00Z"

