[basic]
description = "Adobe Acrobat Reader DC 2021.001.20150及更早版本、2020.001.30020及更早版本以及2017.011.30194及更早版本存在释放后使用漏洞。未经身份认证的远程攻击者可通过构造恶意PDF文件，诱导用户打开后触发该漏洞，在当前用户上下文中实现任意代码执行。利用此漏洞需要受害者主动交互，攻击者无法在无需用户参与的情况下直接利用。"
published = "2021-09-02T17:15:08Z"
remediation = "立即将 Adobe Acrobat Reader DC 升级至 21.001.20151 或更高版本（连续轨道），Classic 2017 轨道升级至 17.011.30195，Classic 2020 轨道升级至 20.001.30021。如无法立即更新，请暂时避免打开来源不明的 PDF 文件，并在 Adobe Reader 中禁用 JavaScript 执行功能以降低利用风险。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Adobe Acrobat Reader DC 释放后使用代码执行漏洞"
updated = "2026-06-17T03:46:30Z"

