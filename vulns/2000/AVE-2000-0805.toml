[basic]
description = "Microsoft Windows Media Player 7.0 存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向目标用户发送特制的 Active Stream Redirector（.ASX）文件触发该漏洞，导致任意命令执行。该漏洞影响 Windows Media Player 7.0 版本，CVSS 评分 7.5，危害等级高，已被分配编号 MS00-090 并由微软发布安全公告。"
published = "2001-01-09T05:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-090 提供的补丁，升级 Windows Media Player 至 7.0 以上版本。如无法安装补丁，可在浏览器中禁用 Windows Media Player 的 .ASX 文件关联，或通过防火墙阻止来自不可信源的流媒体内容作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Windows Media Player 7.0 ASX 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:10.483"

