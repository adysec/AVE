[basic]
description = "Microsoft Internet Explorer 5.5 及更早版本的 Telnet 客户端存在参数注入漏洞。当用户访问恶意网站时，攻击者可通过 URL 中指定的命令行参数控制 IE 调用的 Telnet 会话行为，结合 Services for Unix (SFU) 2.0 提供的 Telnet 客户端会创建会话记录文件的特点，实现任意文件覆写或任意命令执行。攻击条件要求用户使用 SFU 2.0 的 Telnet 客户端并点击恶意链接，影响范围包括 IE 5.0.1/5.5/6.0 版本。"
published = "2001-06-02T04:00:00Z"
remediation = '升级 Internet Explorer 至 6.0 及以上版本，或卸载 Services for Unix (SFU) 2.0 中的 Telnet 客户端。如无法升级，在 IE 安全设置中将「Internet 区域」的「对标记为可安全执行脚本的 ActiveX 控件执行脚本」设为禁用，并删除注册表 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\TelnetClient 下的关联配置项以阻止命令行参数传递。'
score = 5.1
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Internet Explorer Telnet 客户端任意命令执行漏洞"
updated = "2026-06-16T21:53:46Z"

