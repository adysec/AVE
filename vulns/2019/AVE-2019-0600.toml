[basic]
description = 'Windows UPnP 服务在创建 COM 对象时未正确验证调用者权限，存在权限提升漏洞。本地低权限攻击者可通过向 UPnP 服务发送特制的 COM 对象创建请求，利用该漏洞以 SYSTEM 权限执行任意代码，从而完全控制目标系统。该漏洞影响 Windows 10 1803 至 1903 版本，CVSS 评分 7.8，危害等级高。Microsoft 已在 2019 年 11 月安全更新中修复此漏洞，公开的 PoC 名称为 "COMahawk"。'
published = "2019-11-12T19:15:13Z"
remediation = "建议立即安装 Microsoft 2019 年 11 月安全更新：Windows 10 v1903 安装 KB4525237，v1809/Server 2019 安装 KB4525235，v1803 安装 KB4525237，v1709 安装 KB4525241，v1607/Server 2016 安装 KB4525236，Windows 8.1/Server 2012 R2 安装 KB4525242，Windows 7 SP1/Server 2008 R2 安装 KB4525235，Server 2012 安装 KB4525243，Server 2008 SP2 安装 KB4525234。如无法立即打补丁，可禁用 UPnP 服务（sc stop UPnPHost & sc config UPnPHost start=disabled）作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows UPnP 服务特权提升漏洞"
updated = "2026-06-17T02:28:32Z"

