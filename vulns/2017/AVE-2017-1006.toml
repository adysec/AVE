[basic]
description = "Cisco IOS 和 IOS XE 软件的 SNMP 子系统存在缓冲区溢出漏洞，经身份认证的远程攻击者可通过向目标系统发送特制的 SNMP 数据包（支持 IPv4 和 IPv6）触发该漏洞，导致任意代码执行或设备重载。该漏洞影响所有启用 SNMP 且未排除受影响 MIB 或 OID 的设备，涉及 SNMP v1、v2c 和 v3 版本。利用 SNMP v2c 及更早版本需知道只读 community 字符串，利用 SNMP v3 需拥有用户凭据。成功利用可获取设备完全控制权。CVSS 评分 8.8，危害等级高。"
published = "2017-07-17T21:29:00Z"
remediation = "升级 Cisco IOS/IOS XE 至 Cisco Security Advisory cisco-sa-20170629-snmp 中对应版本（使用 Cisco IOS Software Checker 查询具体修复版本）。临时缓解措施：在全局配置模式下创建 SNMP 视图排除受影响 MIB，执行 `snmp-server view NO_BAD_SNMP iso included` 及后续排除命令禁用 ADSL-LINE-MIB、ALPS-MIB、CISCO-ADSL-DMT-LINE-MIB 等 10 个 MIB，并将该视图绑定到 SNMP community 字符串。同时限制仅允许可信源 IP 访问 SNMP 服务，定期更换 SNMP community 字符串。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS和IOS XE SNMP远程代码执行漏洞"
updated = "2026-06-17T01:22:56Z"

