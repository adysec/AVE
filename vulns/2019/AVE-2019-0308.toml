[basic]
description = "Mozilla Firefox 的 JavaScript 引擎在 Array.pop 方法中存在类型混淆（Type Confusion）漏洞。攻击者可通过构造特制的 JavaScript 对象，利用 JIT 编译过程中的类型推断错误，使引擎错误地将一种类型对象当作另一种类型处理，从而破坏内存布局。成功利用此漏洞可实现任意代码执行，完全控制用户系统。该漏洞已被发现在野利用，攻击者只需诱导用户访问恶意网页即可触发，无需额外权限。影响 Firefox 67.0.3 之前版本、Firefox ESR 60.7.1 之前版本及 Thunderbird 60.7.2 之前版本。"
published = "2019-07-23T14:15:15Z"
remediation = "立即升级 Firefox 至 67.0.3 及以上版本、Firefox ESR 至 60.7.1 及以上版本、Thunderbird 至 60.7.2 及以上版本。该漏洞已遭在野利用，须优先修复。如无法立即升级，可禁用 JavaScript 或使用 NoScript 等扩展限制不可信站点脚本执行作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Mozilla Firefox Array.pop 类型混淆远程代码执行漏洞"
updated = "2026-06-17T02:13:28Z"

