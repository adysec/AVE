[basic]
description = "NAI Net Tools PKI Server 1.0 的 strong.exe 程序在 HotFix 3 之前版本中存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过向 HTTPS 端口发送超长 URL 触发缓冲区溢出，进而在目标系统上执行任意命令。该漏洞影响 NAI Net Tools PKI Server 1.0 HotFix 3 之前版本，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），属可用性影响类漏洞。攻击者无需认证即可远程利用，通过构造超长 HTTPS URL 触发 strong.exe 缓冲区溢出实现任意代码执行。Network Associates 已发布 HotFix 3 修复该漏洞。"
published = "2000-10-20T04:00:00.000"
remediation = "立即终止使用 NAI Net Tools PKI Server 1.0，迁移到支持现代安全性的 PKI 基础设施。由于 strong.exe 中存在危及整个服务器的缓冲区溢漏洞，且该版本已终止支持，因此唯一安全方案是部署新版本的 PKI 服务器（或采用基于云的服务），并确保所有客户端配置更新到最新协议版本。如果迁移不完全可行，可作为紧急缓解措施，将 PKI 服务从公网隔离到内部网络，并实施严格的 WAF 规则监控 HTTPS 流量长度。在服务退役过程中，应永久禁用 strong.exe 文件，并从所有备份中彻底删除旧版本组件。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "NAI Net Tools PKI Server 1.0 strong.exe 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:23.050"

