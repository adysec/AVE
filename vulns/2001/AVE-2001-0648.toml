[basic]
description = "Macromedia Shockwave Flash 插件 8.0 及更早版本在处理 SWF 文件时存在拒绝服务漏洞。漏洞原理在于插件在解析 SWF 文件标签结构时未对标签长度字段进行严格校验，攻击者可通过构造包含异常标签长度字段的特制 SWF 文件，触发解析器处理异常导致进程崩溃。攻击条件要求目标用户访问嵌有恶意 SWF 内容的网页或直接打开恶意 SWF 文件，攻击者无需身份认证即可远程实施。受影响范围包括所有使用 Macromedia Shockwave Flash Plugin 8.0 及以下版本的系统和浏览器，成功利用可导致浏览器或插件进程异常终止，造成服务拒绝。"
published = "2001-03-26T05:00:00Z"
remediation = "立即升级 Macromedia Flash Player 至 9.0 或更高版本以修复该缓冲区溢出漏洞。由于 Flash Player 已于 2020 年 12 月终止支持，建议直接从浏览器和操作系统中卸载或禁用该插件，并避免打开来源不明的 SWF 文件作为临时缓解措施。"
score = 7.6
severity = "HIGH"
sources = ["cve"]
title = "Macromedia Shockwave Flash 插件 SWF 文件拒绝服务漏洞"
updated = "2026-06-16T21:53:47Z"

