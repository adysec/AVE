[basic]
description = "Windows BitLocker 存在信息泄露漏洞（CVE-2025-21210）。攻击者通过物理访问目标设备，利用 BitLocker 加密处理机制中的缺陷，在满足高复杂度攻击条件的情况下可能获取本应受加密保护的敏感数据，造成机密信息泄露。该漏洞无法通过网络远程利用（CVSS 向量 AV:P 要求物理访问，AC:H 利用复杂度高），影响范围涵盖 Windows 10/11 及 Windows Server 各版本。Microsoft 已通过 2025 年 1 月安全更新修复该漏洞，建议用户及时安装补丁并加强 BitLocker 密钥管理与物理安全防护。"
published = "2025-01-14T18:15:32Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新（Windows 11 对应 KB5049984、Windows 10 对应 KB5049981/5049983），可通过「设置→Windows 更新→检查更新」或 Windows Update 自动更新完成安装。如暂时无法打补丁，可限制攻击者对受控设备的物理访问、妥善保管 BitLocker 恢复密钥并启用 TPM 与增强型安全启动（强制完整性保护）作为临时缓解措施，降低本地信息泄露风险。"
score = 4.2
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows BitLocker 信息泄露漏洞"
updated = "2026-06-17T08:42:46Z"

