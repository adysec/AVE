[basic]
description = "Netscape 4.77 的 Composer 组件在解析 HTML 字体标签时存在缓冲区溢出漏洞。当用户在 Composer 编辑器中打开包含超长 face 属性的 font 标签时，程序未能正确校验输入长度，导致栈缓冲区溢出，攻击者可借此覆盖进程内存并执行任意代码。该漏洞影响 Netscape 4.77 版本，攻击者需在本地系统上运行 Composer 并加载恶意构造的 HTML 文档才能触发利用。由于漏洞位于本地组件，攻击条件为本地访问权限，成功利用后可导致完全的系统权限提升。攻击者可通过发送特制的 HTML 文件诱使目标用户在 Composer 中打开，从而触发缓冲区溢出并执行任意指令。"
published = "2002-12-31T05:00:00Z"
remediation = "立即升级 Netscape 浏览器至 4.79 或更高版本，该版本已修复 Composer 组件中 Font Face 字段的缓冲区溢出漏洞。如无法立即升级，可临时禁用 Composer 的 HTML 编辑功能作为缓解措施，或直接迁移到 Mozilla Firefox 1.0 及以上版本等现代浏览器，彻底消除该漏洞风险。对于 Linux 系统用户，建议通过系统包管理器检查并安装所在发行版提供的 Netscape 安全更新补丁。"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Netscape Composer 缓冲区溢出漏洞"
updated = "2026-06-16T21:59:56Z"

