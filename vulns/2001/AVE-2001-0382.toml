[basic]
description = 'Oracle OTRCREP 组件存在缓冲区溢出漏洞，影响 Oracle 8.0.x 至 9.0.1 版本。本地攻击者可通过设置过长的 ORACLE_HOME 环境变量触发缓冲区溢出，导致任意代码执行，完全破坏系统机密性、完整性和可用性（CVSS 7.2，本地攻击、低复杂度、无需认证、完全影响）。该漏洞被称为 "Oracle Trace Collection Security Vulnerability"，攻击者需拥有本地系统访问权限，通过构造超长环境变量实现任意代码执行。Oracle 已发布补丁修复该漏洞。'
published = "2001-12-06T05:00:00Z"
remediation = "建议升级 Oracle 数据库至 9.0.1.4 补丁集或 9.2.0.1 及以上版本，或应用 Oracle 安全补丁 Alert #30 (Oracle Trace Collection Security Vulnerability)。临时缓解措施：限制本地用户对 otrcrep 可执行文件的执行权限（chmod 700 $ORACLE_HOME/bin/otrcrep），并限制 ORACLE_HOME 环境变量长度不超过 256 字符。建议限制非授权用户对 Oracle 安装目录的写入权限。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Oracle OTRCREP Oracle 8/9 缓冲区溢出漏洞"
updated = "2026-06-16T21:55:03Z"

