[basic]
description = "NetWare 5.1 操作系统上的 Netscape Enterprise Server 服务器存在安全漏洞。攻击者无需任何身份验证即可远程向目标服务器发送包含恶意构造的 URL 包，由于服务器解析 URL 时未对输入进行充分验证，可能会导致服务器崩溃或进程异常退出，从而引发服务拒绝（DoS）事故。同时，由于漏洞的存在，攻击者还有可能通过精心构造的恶意外链到达服务器执行任意命令，完全控制服务器的运行权限。该漏洞影响范围主要集中在 NetWare 5.1 操作系统环境下的 Netscape Enterprise Server 产品，攻击条件简单，利用途径直接，攻击者可以在网络中对目标服务器进行主动扫描，定位到漏洞存在的服务器端口后即可实施攻击。漏洞的 CVSS 评分高达 7.5，威胁等级为高危，对用户系统信息安全和服务器的稳定运行构成严重威胁。微软亚太研发中心已针对这一漏洞制定相关的安全补丁方案，建议安装安全更新以全面弥补该安全漏洞。"
published = "2000-06-26T04:00:00.000"
remediation = "建议立即从Netscape/Netscape产品官方网站下载并安装NetWare 5.1 SP2及更高版本的Enterprise Server，获取针对CVE-2000-0600的安全补丁包；或在物理上升级至NetWare 6.5+版本；同时在web服务器配置文件中限制URL长度并验证URL格式，将用户输入的URL参数进行严格校验，避免包含特殊字符和异常长度的URL请求，通过使用ip地址+端口+路径模式替代主机名解析来减少风险。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Netscape Enterprise Server 远程代码执行漏洞"
updated = "2026-06-16T21:52:05.120"

