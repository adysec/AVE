[basic]
description = "RealNetworks RealPlayer 存在整数溢出漏洞，影响 11.0 至 11.1、RealPlayer SP 1.0 至 1.1.4、RealPlayer Enterprise 2.1.2、Linux RealPlayer 11.0.2.1744 等多个版本，部分 HelixPlayer 版本也可能受影响。漏洞原理在于 RealPlayer 解析 SIPR（Sipro Lab）音频流帧尺寸时未对数值进行边界校验，导致整数溢出并可能引发内存破坏。攻击条件为远程攻击者向目标发送包含特制帧尺寸的恶意媒体文件或流数据，受害者使用受影响版本打开或播放该媒体即可触发漏洞。利用方式为无需身份认证的远程攻击，成功利用可导致任意代码执行，危害严重。RealNetworks 已在 RealPlayer 12.0.1.609 及更高版本中修复此漏洞。"
published = "2010-12-14T16:00:04Z"
remediation = '立即升级RealPlayer到12.0.1.609或更高版本，全面修复整数溢出漏洞。从控制面板中选择“程序”和“RealPlayer”，点击“修改”，然后选择“升级到Latest”。如果无法立即升级，建议禁用RealPlayer处理SIPR流的功能，可通过在注册表编辑器中找到HKEY_LOCAL_MACHINE\SOFTWARE\RealNetworks\RealPlayer\6.0\Plugins并删除"sipr"值来实现临时缓解措施。'
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer SIPR流帧尺寸整数溢出漏洞"
updated = "2026-06-16T23:24:41Z"

