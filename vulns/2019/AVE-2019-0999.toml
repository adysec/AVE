[basic]
description = "WhatsApp Desktop 0.3.9309之前版本在与WhatsApp for iPhone 2.20.10之前版本配对使用时存在跨站脚本与本地文件读取漏洞。攻击者可构造包含恶意链接预览的特制文本消息发送给受害者，当受害者点击该链接预览时，漏洞被触发，导致攻击者能够在受害者浏览器上下文中执行任意JavaScript代码，并读取本地文件系统中的敏感信息。该漏洞影响广泛使用的即时通讯软件，CVSS评分8.2，危害等级高。"
published = "2020-01-21T21:15:16Z"
remediation = "将 WhatsApp Desktop 升级至 0.3.9309 或更高版本，同时将 WhatsApp for iPhone 升级至 2.20.10 或更高版本。可在 WhatsApp 设置中关闭链接预览功能作为临时缓解措施，并教育用户不要点击可疑消息中的链接预览。"
score = 8.2
severity = "HIGH"
sources = ["kev"]
title = "WhatsApp Desktop 跨站脚本与本地文件读取漏洞"
updated = "2026-06-17T02:25:01Z"

