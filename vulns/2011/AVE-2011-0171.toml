[basic]
description = "Google Chrome 浏览器存在释放后使用（use-after-free）漏洞，其底层 WebKit 渲染引擎在处理文档计数器节点（counter nodes）时存在内存管理缺陷，已被释放的内存区域仍可被后续操作读取引用，导致释放后使用。未经身份认证的远程攻击者可构造包含恶意特制内容的网页，诱导用户使用受影响版本的 Chrome 浏览器访问该页面，从而触发内存错误，实现任意代码执行或导致浏览器崩溃，CVSS 评分 6.8。该漏洞影响 Google Chrome 17.0.963.56 之前的所有版本，用户无需任何额外操作，仅需正常浏览恶意网页即可遭受攻击。Google 已于 2012 年 2 月发布 Chrome 17.0.963.56 安全更新修复此漏洞，建议用户升级至最新版本。"
published = "2012-02-16T20:55:03Z"
remediation = "立即将 Google Chrome 升级至 17.0.963.56 或更高版本，该版本已修复 counter nodes 相关的 use-after-free 漏洞。如使用 iOS 设备，同时将 Safari 升级至 6.0 或将 iOS 升级至 6.0。临时缓解措施：在 Chrome 地址栏输入 chrome://flags 并禁用相关实验性功能，或在浏览器中禁用 JavaScript 以降低被利用风险。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 释放后使用漏洞"
updated = "2026-06-16T23:32:26Z"

