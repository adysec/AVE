[info]
author = "ave"
description = "CVE-2011-3043 是 WebKit 浏览器引擎中的 use-after-free 内存安全漏洞。攻击者可通过构造包含弹性盒子（flexbox）与浮动元素（floating elements）的特制网页，在页面渲染过程中触发对已释放内存对象的重复引用，导致浏览器崩溃。利用无需身份认证，攻击者只需诱使用户访问恶意网页即可触发。"
id = "POC-AVE-2011-0186"
name = "WebKit use-after-free 漏洞 PoC"
severity = "medium"
tags = ["ave-2011-0186"]
vuln_id = [
    "CVE-2011-3043",
    "AVE-2011-0186",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/test"
protocol = "http"

[poc.requests.headers]
User-Agent = "Mozilla/5.0 (WebKit/537.36)"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["crash"]
