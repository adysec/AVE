[basic]
description = "Docker Desktop for macOS 推理服务器沙箱配置存在过度宽松的允许列表漏洞，本地攻击者若能在沙箱内执行低权限代码，即可利用该缺陷逃逸沙箱、提升权限并在宿主系统以当前用户上下文执行任意代码。该漏洞影响 Docker Desktop for macOS 的模型运行器组件，CVSS 3.1 评分 8.8（AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H），攻击向量为本地、需低权限、无需用户交互。Docker 已发布修复更新，用户应尽快升级至最新版本。"
