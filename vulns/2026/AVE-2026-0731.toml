[basic]
description = "X.Org X 服务器在 XKB 键盘几何（keyboard geometry）处理逻辑中存在越界读取漏洞，具体位于 `CheckSetGeom()` 与 `XkbAddGeomKeyAlias` 函数中。这些函数在解析或设置几何数据时未正确校验缓冲区边界，导致攻击者可读取未初始化或越界的内存内容。攻击者只需能够连接到 X11 服务器（本地或远程），且无需用户交互即可触发该漏洞。成功利用可导致内存内容泄露（机密性影响高），或通过使服务器崩溃造成拒绝服务。该漏洞影响 X.Org X Server 及 Xwayland 等产品，CVSS 评分 6.1，危害等级中危。"
published = "2026-05-05T16:16:11Z"
remediation = "建议升级 X.Org X server 到修复版本：Debian 用户将 xorg-server 升级至 bookworm 2:21.1.7-3+deb12u12、trixie 2:21.1.16-1.3+deb13u3 或 sid 2:21.1.23-1 以上；Xwayland 升级至 2:24.1.12-1 以上（源码修复提交：gitlab.freedesktop.org/xorg/xserver 提交 81b6a34f）。升级前临时缓解：禁用 XKB 几何信息请求，限制仅可信用户访问 X11（通过 xhost 或仅监听本地 unix socket），并以非 root 低权限用户运行 Xwayland；同时通过防火墙阻断对 6000/tcp 及 6001/tcp 的远程 X11 访问。"
score = 6.1
severity = "MEDIUM"
sources = ["zdi"]
title = "X.Org X Server XKB 几何处理越界读取漏洞"
updated = "2026-06-17T10:38:24Z"

