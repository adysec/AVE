[basic]
description = "Apple Safari 6.0 之前版本在处理 feed:// 协议 URL 时存在访问控制错误。远程攻击者可构造包含本地文件路径的恶意 feed:// URL，诱使用户在 Safari 浏览器中点击访问，从而导致用户本地系统上的敏感文件被泄露到远程服务器。该漏洞影响 macOS 和 Windows 平台上的 Safari 浏览器，攻击者无需身份认证，仅需诱骗用户点击恶意链接即可在用户交互条件下读取本地任意文件，可能造成隐私数据或敏感信息泄露。"
published = "2012-07-25T19:55:01Z"
remediation = '将 Apple Safari 浏览器升级至 6.0 或更高版本以修复该漏洞。具体操作：打开 Safari 浏览器，点击菜单栏"Safari"→"关于 Safari"检查当前版本；若低于 6.0，请通过 Mac App Store 或 Apple 官网下载安装 Safari 6.0 或更高版本。升级完成后，建议在 Safari 偏好设置中禁用不必要的 feed:// 协议处理器以减少攻击面。如无法立即升级，可暂时避免访问来源不可信的 feed:// 链接作为缓解措施。'
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari 任意文件读取漏洞"
updated = "2026-06-16T23:38:03Z"

