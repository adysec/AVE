[basic]
description = "Mirasys DVMS Workstation 5.12.6及更早版本的Gateway组件存在路径遍历漏洞（CWE-22）。未经身份认证的远程攻击者可通过Web Client webserver向目标系统发送特制的HTTP请求，利用../序列遍历文件系统目录，从而读取服务器上的任意文件。该漏洞影响Mirasys DVMS Workstation系列监控管理系统，CVSS评分7.5，危害等级高。攻击无需任何权限，仅需网络可达即可利用，可能导致敏感配置信息泄露，为后续攻击提供跳板。厂商已发布安全更新修复此漏洞。"
published = "2018-06-19T19:29:00.470"
remediation = "升级 Mirasys DVMS Workstation 至 5.12.7 或更高版本。如无法立即升级，在 Web 客户端所在服务器上配置 Web 应用防火墙（WAF）规则，拦截包含 `../` 及 `.../` 等路径遍历特征的 HTTP 请求；同时限制 Web 客户端仅允许受信任 IP 访问，并禁用不必要的文件共享功能以降低攻击面。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Mirasys DVMS Workstation Gateway 路径遍历漏洞"
updated = "2026-06-17T02:05:18.193"

