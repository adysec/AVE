[basic]
description = "Apple iPhone OS 的 CoreAudio 组件中 AudioCodecs 库存在堆缓冲区溢出漏洞。当系统解析特制的 AAC 或 MP3 音频文件（如包含畸形采样大小表条目的恶意铃声文件）时，会触发内存越界写入，导致设备上的应用程序崩溃或远程代码执行。该漏洞影响运行 iPhone OS 3.1 之前版本的 iPhone 以及运行 3.1.1 之前版本的 iPod touch，攻击者需诱骗用户打开恶意音频文件即可利用。CVSS 评分 6.8，危害等级中等。Apple 已在后续版本中修复此问题。"
published = "2009-09-10T21:30:01Z"
remediation = "将 iPhone 升级至 iOS 3.1 或更高版本，iPod touch 升级至 iOS 3.1.1 或更高版本。如暂无法升级，应避免打开来源不明的 AAC 或 MP3 文件，并禁用 Safari 对音频文件的自动播放功能以降低被远程利用的风险。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iPhone OS iPod touch 堆缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T23:09:00Z"

