[basic]
description = "Samsung 开源 rlottie 库存在整数溢出或回绕漏洞（CWE-190），在处理特制矢量动画文件时，由于整数运算未正确校验边界，导致堆缓冲区溢出。本地攻击者需诱使用户打开恶意构造的动画文件，利用此漏洞可造成目标应用崩溃（可用性影响为高），或可能泄露少量敏感信息（机密性和完整性影响为低）。该漏洞影响 Samsung rlottie 的所有受影响版本，CVSS 评分 5.5，危害等级中危。"
published = "2026-07-13T01:17:05Z"
remediation = "建议从 Samsung/rlottie GitHub 仓库 master 分支拉取包含 PR #595 修复的最新代码（提交 f487eff2f8086b84ae1c7faa0418abec909e874b，合并于 2026-07-03），重新编译安装 rlottie 库。该修复将 SW_FT_Span.y 坐标的 INT_MAX 限幅改为 short 类型安全上限，防止 16 位截断导致的堆缓冲区溢出。若暂无法升级，建议在应用层限制 Lottie 动画文件的输入来源，仅加载受信任的动画资源，避免解析恶意构造的 Lottie 文件触发整数溢出。"
score = 5.5
severity = "MEDIUM"
sources = ["zdi"]
title = "Samsung rlottie 整数回绕堆缓冲区溢出漏洞"
updated = "2026-07-13T19:28:17Z"

