[basic]
description = "websocket-driver 是一个 Ruby 语言实现的 WebSocket 协议处理器。在 0.8.1 版本之前，其使用的 WebSocket 协议草案版本中，帧格式的长度头部允许将任意大的整数编码为高位设置为 1 的字节序列。攻击者可以通过发送无限序列的 0x80 或更高字节值，使对端将这些字节解析为不断增长的整数。由于 Ruby 整数支持任意精度，这会导致 WebSocket 连接消耗无上限的内存，最终造成目标进程内存耗尽（OOM）。攻击者无需身份认证即可通过网络远程触发此漏洞，影响所有使用受影响版本 websocket-driver 的应用。该漏洞已在 0.8.1 版本中修复。"
published = "2026-07-17T20:17:26Z"
remediation = "立即将 websocket-driver Ruby gem 升级至 0.8.1 或更高版本，执行 `gem update websocket-driver` 或修改 Gemfile 指定 `gem 'websocket-driver', '>= 0.8.1'` 后运行 `bundle update websocket-driver`。该漏洞无已知临时缓解措施，必须通过升级修复。"
score = 6.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "Faye websocket-driver 协议长度头滥用导致内存耗尽漏洞"
updated = "2026-07-23T18:04:42Z"

