[basic]
description = "FTP Serv-U 2.5e 存在空字节拒绝服务漏洞，远程攻击者可通过向目标 FTP 服务器发送大量空字节（null bytes）数据包，导致 Serv-U 服务进程崩溃，造成拒绝服务。该漏洞无需身份认证即可远程触发，攻击门槛低，影响 Deerfield Serv-U 2.5e 版本。由于缺乏对异常输入的有效校验，攻击者只需构造特制的空字节载荷发送至 FTP 服务端口即可完成利用。"
published = "2000-11-14T05:00:00.000"
remediation = "升级 Serv-U FTP 服务器至 2.5f 或更高版本，该版本已修复空字节处理逻辑，避免大量空字节导致服务崩溃。如无法升级，可在防火墙或网络层面限制对 FTP 端口的异常流量，或迁移至其他活跃维护的 FTP 服务器软件（如 vsftpd、ProFTPD）以彻底规避风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Deerfield Serv-U 拒绝服务漏洞"
updated = "2026-06-16T21:52:34.227"

