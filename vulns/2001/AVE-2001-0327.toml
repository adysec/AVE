[basic]
description = "Red Hat TUX HTTP Server 2.1.0-2 存在拒绝服务漏洞，由于 TUX HTTP 服务器未正确处理过长的 Host 头部字段，远程未授权攻击者可发送超长的 Host 头部 HTTP 请求，触发缓冲区溢出或资源耗尽导致服务拒绝。该漏洞影响 Red Hat Linux 中 TUX 2.1.0-2 版本，CVSS 评分 5.0（中危），攻击向量为网络、攻击复杂度低、无需认证，仅影响可用性。攻击者只需发送包含超长 Host 头部的 HTTP 请求即可触发拒绝服务，Red Hat 已将其评级为重要级别并发布补丁修复。"
published = "2001-12-06T05:00:00Z"
remediation = "升级到 Red Hat Linux 7.3 或更高版本，其中包含已修复的 TUX HTTP Server 2.1.0-2 Host 头超长拒绝服务漏洞补丁（具体补丁信息请查阅 Red Hat 官方安全更新）。或者，可禁用 TUX HTTP 服务并改用 Apache 或 Nginx 等支持 Host 头长度限制的 Web 服务器。若无法立即升级，建议在防火墙或负载均衡层添加 HTTP Host 头长度检查（限制在 256 字节以内），并配置 Web 应用防火墙规则阻止超长 Host 头请求。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "红帽 TUX HTTP 服务器 Host 头拒绝服务漏洞"
updated = "2026-06-16T21:55:06Z"

