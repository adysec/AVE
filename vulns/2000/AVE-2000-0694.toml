[basic]
description = "Shambala Server 4.5 是 Evolvable 公司开发的物联网/智能家居通信服务器。该服务器在处理网络连接时存在缺陷，当远程攻击者建立连接后立即关闭时，服务器无法正确处理这种异常断开行为，导致服务崩溃或变得不可用。攻击者无需任何认证即可利用此漏洞，通过反复打开并快速关闭 TCP 连接即可触发拒绝服务。该漏洞影响 Shambala Server 4.5 版本，CVSS 评分为 5.0，属于中等危害等级。攻击条件简单，仅需网络访问权限，无需复杂技术手段，可导致目标服务器停止响应正常服务请求。"
published = "2000-12-19T05:00:00.000"
remediation = "Shambala Server 4.5 厂商已停止支持，无官方补丁可用。建议立即升级或迁移至受支持的替代产品。临时缓解措施：在网络边界防火墙限制对 Shambala Server 端口的非必要外部访问，仅允许可信 IP 连接；部署入侵检测/防御系统（IDS/IPS）监控异常频繁的连接断开行为，并配置连接速率限制以降低 DoS 影响。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Evolvable Shambala Server 4.5 拒绝服务漏洞"
updated = "2026-06-16T21:52:50.670"

