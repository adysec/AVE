[basic]
description = "Coder 工作区代理日志组件 AgentLogLine 存在存储型 HTML 注入漏洞。该组件在实例化 ansi-to-html 库时未启用 escapeXML 参数，且通过 dangerouslySetInnerHTML 将日志内容直接插入 DOM，导致嵌入工作区代理日志中的 HTML 标签被浏览器解析为活跃标记。服务端过滤机制未能对 HTML 元字符进行转义处理。攻击者只需拥有工作区运行权限，即可在代理日志中注入恶意 HTML 内容；当其他用户（包括管理员）在仪表盘查看该工作区日志时，注入的 HTML 将在其浏览器会话中执行。虽然内容安全策略（CSP）可阻止内联脚本执行，但攻击者仍可通过 meta refresh 重定向、CSS 样式篡改界面、外部图片探针等方式实施数据窃取或钓鱼攻击。该漏洞影响 Coder v2.34.2 之前的所有版本，CVSS 评分 5.4，危害等级中危。官方已在 v2.29.17、v2.32.7、v2.33.8 和 v2.34.2 版本中通过启用 escapeXML 参数修复此漏洞。"
published = "2026-07-08T01:16:28Z"
remediation = "立即升级 Coder 至以下对应版本：v2.34.2（2.34 线）、v2.33.8（2.33 线）、v2.32.7（2.32 线）或 v2.29.17（ESR 线）。该漏洞无临时缓解措施，必须通过升级修复。升级后确认 `ansi-to-html` 的 `escapeXML` 参数已设为 `true`，防止代理日志中 HTML 元字符被渲染为活代码。"
score = 5.4
severity = "MEDIUM"
sources = ["ghsa"]
title = "Coder Coder 代理日志 AgentLogLine 组件存储型 HTML 注入漏洞"
updated = "2026-07-08T19:38:48Z"

