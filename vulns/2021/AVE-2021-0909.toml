[basic]
description = "Atlassian Confluence Server 及 Confluence Data Center 的 /s/ 端点存在预授权任意文件读取漏洞（CWE-425）。未经身份认证的远程攻击者可通过向目标服务器的 /s/ 端点发送特制 HTTP 请求，绕过访问控制机制读取服务器文件系统上的受限资源文件，从而可能导致敏感配置信息、密钥凭据等机密数据泄露。该漏洞影响版本为低于 7.4.10 的所有版本，以及从 7.5.0 起至低于 7.12.3 的版本，攻击复杂度低且无需任何用户交互即可远程利用。CISA 已将该漏洞列入已知被利用漏洞目录（KEV），Atlassian 已在 7.4.10、7.12.3、7.13.0 及 7.14.0 版本中修复此漏洞，建议受影响用户尽快升级至安全版本。"
published = "2021-08-03T00:15:08Z"
remediation = "将 Atlassian Confluence Server/Data Center 升级到修复版本：若当前版本低于 7.4.10，请升级至 7.4.10 或更高版本；若当前版本介于 7.5.0 至 7.12.2 之间，请升级至 7.12.3 或更高版本。如暂无法立即升级，可通过反向代理或防火墙规则限制对 /s/ 端点的外部访问，以临时缓解任意文件读取风险，待完成版本升级后移除该限制。"
score = 5.3
severity = "MEDIUM"
sources = ["kev"]
title = "Atlassian Confluence Server 预授权任意文件读取漏洞"
updated = "2026-06-17T03:42:49Z"

