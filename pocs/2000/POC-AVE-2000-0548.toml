[info]
author = "ave"
description = "验证Windows 2000受保护存储(Protected Store)是否使用40位弱加密而非56位DES加密，通过检查系统加密策略确认漏洞存在"
id = "POC-AVE-2000-0548"
name = "CVE-2000-0487 PoC"
severity = "low"
tags = ["ave-2000-0548"]
vuln_id = [
    "CVE-2000-0487",
    "AVE-2000-0548",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
