[basic]
description = "ntop 1.2 a7-9 版本的 Web 管理界面存在目录遍历漏洞，远程攻击者无需身份认证即可通过向 Web 服务发送包含 `..` 序列的特制 HTTP 请求，绕过路径限制读取服务器上的任意文件，如 `/etc/passwd` 等敏感配置文件。该漏洞源于 ntop 在处理文件路径时未对用户输入进行充分的过滤和验证，导致攻击者可利用路径回溯符跳出 Web 根目录。ntop 运行在 Web 模式下时默认监听 3000 端口，攻击者只需能够访问该端口即可实施攻击，攻击复杂度低。Exploit-DB 上已有公开的利用代码，进一步降低了攻击门槛。"
published = "2000-10-20T04:00:00.000"
remediation = "升级 ntop 至 1.2 以上版本，Red Hat 已通过 RHSA-2000-049 安全公告发布补丁。如无法升级，可禁用 ntop 的 web 模式（--no-web 参数启动），或在防火墙层面限制对 ntop web 端口（默认 3000）的访问，仅允许可信 IP 连接。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Luca Deri ntop 目录遍历漏洞"
updated = "2026-06-16T21:52:18.493"

