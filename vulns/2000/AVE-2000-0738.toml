[basic]
description = "Red Hat Linux 6.2 中 dump 工具（版本 0.4b15）存在环境变量信任漏洞。dump 程序信任 RSH 环境变量指定的路径，未对其内容进行任何校验，导致本地攻击者可通过将 RSH 变量修改为指向特洛伊木马程序，当 dump 执行时以 root 权限运行恶意程序，从而获取系统最高权限。该漏洞影响 Red Hat Linux 6.2 及使用该版本 dump 的 Linux 发行版，攻击者需拥有本地用户权限即可利用。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级 dump 至修补后的版本（如 0.4b16 或更高），该版本不再信任 RSH 环境变量路径。如无法升级，可执行 `chmod u-s /sbin/dump` 移除 dump 的 setuid 权限位，或限制仅 root 用户可执行 dump，以阻断本地提权路径。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Red Hat Linux dump 本地权限提升漏洞"
updated = "2026-06-16T21:52:57Z"

