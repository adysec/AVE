[basic]
description = "Borderware Firewall Server 6.1.2 存在拒绝服务漏洞，远程攻击者无需身份认证即可向服务器所在的公共网络广播地址发送特制的 ping 请求，触发防火墙持续向整个网络循环发送 echo 请求，导致网络带宽耗尽、网络设备负载异常升高或相关服务不可用，影响该版本防火墙的稳定运行。"
published = "2001-06-02T04:00:00Z"
remediation = "建议将 Borderware Firewall Server 升级至官方已修复该问题的更高版本（6.2 或后续版本）。如无法立即升级，可通过 Borderware 管理客户端重置网络接口作为临时缓解，并在上游路由器上配置访问控制列表拒绝 directed broadcast 流量（Cisco 设备使用 deny ip any 0.0.0.255 255.255.255.0）。同时在内网主机上禁用 ICMP 响应广播，Linux 系统可通过设置 net.ipv4.icmp_echo_ignore_broadcasts = 1 实现。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Borderware Firewall Server Ping Flooding 拒绝服务漏洞"
updated = "2026-06-16T21:54:04Z"

