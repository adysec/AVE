[basic]
description = "AnalogX proxy server 4.04 及更早版本中存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向 SMTP 协议发送超长的 HELO 命令触发该漏洞，导致目标代理服务崩溃，造成拒绝服务。该漏洞影响 AnalogX proxy server 4.04 及之前所有版本，CVSS 评分 5.0，危害等级中危。"
published = "2000-07-25T04:00:00.000"
remediation = "立即升级 AnalogX Proxy 至 4.05 或更高版本（当前最新为 4.15），该版本已修复 SMTP/POP3/FTP 处理中的缓冲区溢出漏洞。从 analogx.com 下载最新版覆盖安装即可。如无法升级，可在防火墙中限制对代理服务器 SMTP 端口（25）的访问，仅允许受信任 IP 连接。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "AnalogX Proxy Server SMTP HELO 命令缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:12.310"

