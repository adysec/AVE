[basic]
description = "Monstra CMS 3.0.4 注册页面存在反射型跨站脚本漏洞，攻击者可通过构造恶意的 login 参数注入 JavaScript 代码，当受害者访问包含恶意载荷的注册页面时，脚本会在受害者浏览器上下文中执行。该漏洞源于 users/registration 路由对 login 参数缺乏输入验证与输出编码，攻击者无需权限即可发起攻击，但需诱导用户点击恶意链接（UI:R），攻击成功可窃取会话 Cookie、执行钓鱼攻击或篡改页面内容。受影响版本为 Monstra CMS 3.0.4，CVSS 3.0 评分 6.1（中危），攻击向量为网络、攻击复杂度低、无需权限、需用户交互、范围改变、机密性/完整性低影响、可用性无影响。官方已在 GitHub Issue #446 中确认并修复该漏洞。"
published = "2018-05-25T19:29:00Z"
remediation = "建议立即升级至 Monstra CMS 3.0.5 或更高版本（如有维护分支），或手动修补 users/registration 页面的 login 参数输入过滤，使用 htmlspecialchars() 对用户输入进行 HTML 实体编码；若无法升级，请在 WAF 层面拦截包含 <script>、onerror、onload 等 XSS 特征的登录参数，并建议迁移至维护中的 CMS（如 WordPress、Ghost）。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Monstra CMS 3.0.4 跨站脚本攻击漏洞"
updated = "2026-06-17T01:36:00Z"

