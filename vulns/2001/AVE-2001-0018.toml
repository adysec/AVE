[basic]
description = "HomeSeer 1.4.29 之前版本存在目录遍历漏洞，未经身份认证的远程攻击者可通过在 URL 中使用 ..（点号）路径穿越序列构造恶意请求，从而读取服务器上的任意文件。该漏洞利用门槛极低，攻击者无需持有任何凭据即可通过网络远程发起利用，可导致敏感配置文件、用户数据等机密信息泄露。受影响产品为 Keware Technologies 开发的 HomeSeer 家庭自动化服务器软件，攻击条件仅需目标系统对外开放相关 Web 服务端口，攻击者即可通过浏览器或脚本工具发送包含目录穿越路径的特制 HTTP 请求获取文件内容，造成信息泄露风险。建议用户升级至 1.4.29 或更高版本以修复该漏洞。"
published = "2001-02-16T05:00:00Z"
remediation = "建议立即升级 HomeSeer 至 1.4.29 或更高版本以彻底修复此目录遍历漏洞。如暂无法升级，可在 IIS/Apache 等前端 Web 服务器配置 URL 重写规则，拦截包含 '../' 或 URL 编码后的 '%2e%2e' 路径遍历字符的请求，同时限制 Web 服务进程对系统敏感目录（如 system32、etc）的读取权限作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Keware Technologies HomeSeer 1.4 目录遍历漏洞"
updated = "2026-06-16T21:53:32Z"

