[basic]
description = "Mozilla Firefox/Thunderbird/SeaMonkey 的 SVG 元素列表实现中存在释放后使用漏洞，具体位于 nsSVGPointList::AppendElement 函数中。当处理用户提供的回调函数时，程序未能正确管理内存对象的生命周期，导致已释放的内存指针被继续使用。远程攻击者可通过构造特制的 SVG 文档，诱使用户访问恶意页面触发该漏洞，成功利用可导致浏览器崩溃拒绝服务，或在受影响的系统上执行任意代码。该漏洞影响 Firefox 3.6.18 之前版本、Thunderbird 3.1.11 之前版本及 SeaMonkey 2.0.14 及之前版本，CVSS 评分 10.0，危害等级严重。"
published = "2011-06-30T16:55:05Z"
remediation = "升级 Mozilla Firefox 至 3.6.18 或更高版本，升级 Thunderbird 至 3.1.11 或更高版本，升级 SeaMonkey 至 2.1 或更高版本。无法升级的用户可采取禁用 JavaScript 或限制 SVG 渲染作为临时缓解措施。相关补丁已包含在 Mozilla 安全公告 MFSA 2011-23 中。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey SVG 元素列表释放后重用远程代码执行漏洞"
updated = "2026-06-16T23:31:11Z"

