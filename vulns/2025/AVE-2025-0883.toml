[basic]
description = "HDF5 1.14.6 版本的 h5 文件处理器组件中的 H5SM.c 文件存在堆缓冲区溢出漏洞。攻击者可向目标系统发送特制 h5 文件，通过操控 H5SM_delete 函数触发堆溢出，实现远程代码执行或拒绝服务。该漏洞影响 HDF5 库的广泛部署场景，攻击无需身份认证但复杂度较高且需要用户交互打开恶意文件。利用方法已公开披露，建议用户升级至安全版本并避免打开不可信来源的 h5 文件。"
published = "2025-03-10T14:15:26.737"
remediation = "升级HDF5到包含安全修复的版本（HDF5 2.0.0或更高版本），该版本包含CVE-2025-2153修复。具体修复措施是：确保H5O__msg_write_real()函数中对消息共享标志的验证，这可以防止非共享消息被篡改为共享消息。如果无法立即更新，可在生产环境中通过代码审计方式查找所有H5SM_delete调用位置，并验证其输入验证逻辑，临时缓解风险。"
score = 2.3
severity = "LOW"
sources = ["msrc"]
title = "HDF5 H5文件处理器堆缓冲区溢出漏洞"
updated = "2026-06-17T09:06:25.837"

