[basic]
description = 'Apache HTTP Server 1.3.x Windows 版本存在目录遍历漏洞，源于对包含大量 "/" 字符的 URL 请求处理不当。远程未认证攻击者可发送包含大量斜杠（如 /////////////////////////////////////////////////////////////////）的 HTTP GET 请求，绕过路径规范化检查，导致服务器返回 Web 根目录甚至系统根目录的文件列表，泄露敏感文件结构信息。影响版本包括 Apache 1.3.6、1.3.9、1.3.11、1.3.12、1.3.20 Windows 版本。攻击条件为：目标运行受影响版本的 Apache on Windows，攻击者可发送 HTTP 请求。CVSS 5.0（中危），攻击向量网络、低复杂度、无需认证、部分机密性影响。Apache 已在后续版本修复该路径规范化缺陷，建议升级至修复版本或迁移至非 Windows 平台。'
published = "2000-05-31T04:00:00Z"
remediation = "建议立即升级 Apache HTTP Server 至 1.3.21 或更高版本（或升级至 2.x 分支），该版本修复了 Windows 平台上多重斜杠导致的根目录遍历漏洞。若暂无法升级，请在 httpd.conf 中为所有目录配置 `Options -Indexes` 禁用目录列表，并在 `<Directory />` 中设置 `Require all denied` 限制根目录访问，同时在防火墙层面拦截包含过多连续斜杠的异常请求作为临时缓解措施。升级包可从 Apache 官网 httpd.apache.org/download.cgi 获取。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Apache HTTP Server Windows 目录遍历漏洞"
updated = "2026-06-16T21:51:52Z"

