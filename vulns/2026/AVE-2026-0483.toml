[basic]
description = "File Browser 是一款文件管理界面，当配置代理认证模式（auth.method=proxy）时，其 ProxyAuth.Auth() 函数无条件信任 HTTP 请求头中的用户标识字段（如 X-Remote-User），未对请求来源 IP 进行任何校验，也未验证共享密钥或签名。未经身份认证的远程攻击者若可直接访问 FileBrowser 实例（如 Docker 默认将端口暴露至 0.0.0.0），只需发送一个伪造的 HTTP 请求头即可冒充任意用户（包括管理员）获取有效 JWT 令牌，从而完全接管服务器。此外，若指定的用户名不存在，服务器会自动创建新用户账户，提供无授权的账户注册能力。该漏洞影响所有支持 proxy 认证模式的版本，CVSS 评分 9.1，危害严重。"
published = "2026-06-25T19:16:40Z"
remediation = "立即升级 FileBrowser 至包含修复的最新版本；如无法升级，将 `auth.method` 从 `proxy` 改为 `json` 并配置反向代理处理认证。确保 FileBrowser 绑定到 `127.0.0.1` 或通过防火墙限制仅允许反向代理 IP 访问，禁止直接暴露端口到不可信网络。在反向代理层配置规则，强制覆盖或删除 `X-Remote-User` 等认证头，防止客户端伪造。"
score = 9.1
severity = "CRITICAL"
sources = ["ghsa"]
title = "File Browser 代理认证标头伪造身份验证绕过漏洞"
updated = "2026-06-25T19:58:30Z"

