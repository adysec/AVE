[info]
author = "ave"
description = "验证 Samsung Mobile Devices DSP 驱动程序的越界内存访问漏洞（CVE-2021-25372）。该漏洞存在于搭载 Exynos 980/2100/9830 芯片组的 Android Q(10.0)/R(11.0) 设备中，由于 DSP 驱动在 SMR Mar-2021 Release 1 之前存在边界检查不当，攻击者可通过物理接触和高权限利用此漏洞实现越界内存访问。由于该漏洞为内核级驱动漏洞且需物理接触设备，目前无公开可用 PoC。"
id = "POC-AVE-2021-0030"
name = "Samsung Mobile Devices DSP Driver OOB Memory Access PoC"
severity = "medium"
tags = ["ave-2021-0030"]
vuln_id = [
    "CVE-2021-25372",
    "AVE-2021-0030",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/proc/version"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Linux"]
