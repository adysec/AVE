[basic]
description = "PHP 的流 HTTP 包装器（stream HTTP wrapper）在处理 HTTP 重定向响应时存在缓冲区大小计算错误（CWE-131），location 值缓冲区被限制为 1024 字节，而 RFC 9110 建议上限为 8000 字节。远程攻击者可通过构造超长重定向 URL，使 PHP 截断 location 值并跳转到错误地址，导致应用逻辑绕过或非预期重定向。该漏洞影响 PHP 8.1.32 之前、8.2.28 之前、8.3.19 之前及 8.4.5 之前的版本，攻击者无需身份认证即可利用。"
published = "2025-03-30T06:15:14Z"
remediation = "升级 PHP 至 8.1.32、8.2.28、8.3.19 或 8.4.5 及以上版本，这些版本已将 HTTP 重定向 Location 缓冲区从 1024 字节扩展至 8000 字节以符合 RFC 9110 规范。该漏洞无有效临时缓解措施，必须通过版本升级修复。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "PHP HTTP流包装器重定向位置截断漏洞"
updated = "2026-06-17T08:39:55Z"

