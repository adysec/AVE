[basic]
description = "tags.<value>WircSrv IRC Server 5.07s 中存在任意文件读取漏洞。具有 IRC 操作员权限的攻击者可通过 importmotd 命令将服务器上任意文件的内容设置为每日消息（MOTD），从而读取目标系统中的敏感文件。该漏洞源于 importmotd 命令未对文件路径进行有效限制，攻击者无需身份认证即可通过网络远程触发，导致敏感信息泄露。CVSS 评分 5.0，危害等级中危。"
published = "2000-10-20T04:00:00.000"
remediation = "WircSrv IRC Server 5.07s 已停止维护，建议立即迁移至其他活跃维护的 IRC 服务器软件（如 UnrealIRCd、InspIRCd 或 ircd-hybrid）。如无法立即迁移，可采取以下临时缓解措施：1) 严格限制 IRC 操作员权限，仅授予绝对可信的用户；2) 在服务器配置中禁用 importmotd 命令（如支持）；3) 在系统层面通过文件权限控制，限制 IRC 服务进程对敏感文件的读取权限。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "WircSrv IRC Server 任意文件读取漏洞"
updated = "2026-06-16T21:52:28.567"

