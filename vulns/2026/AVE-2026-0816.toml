[basic]
description = "Open WebUI 文件上传功能存在授权检查缺失漏洞。服务端在处理文件上传时直接信任客户端提交的 `metadata.knowledge_id` 字段，在未验证当前用户对目标知识库是否拥有写入权限的情况下，即创建文件与知识库的关联记录。已通过身份验证但仅拥有知识库只读权限的攻击者，可通过在文件上传请求中构造恶意 `metadata` 参数，将任意文件添加至目标知识库，导致知识库文件列表被未授权篡改。该漏洞影响 Open WebUI 0.10.0 之前的所有版本，CVSS 评分 4.3，危害等级中危。官方已在 0.10.0 版本中修复此问题。"
published = "2026-07-09T17:17:02Z"
remediation = "升级 Open WebUI 至 v0.10.0 或更高版本，该版本在文件上传自动关联知识库的路径中增加了写入权限检查。如无法立即升级，可在反向代理层对 `/api/v1/files/` 接口添加额外访问控制，限制只读用户的上传操作，或禁用 `metadata.knowledge_id` 参数传递。"
score = 4.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Open WebUI 知识库文件上传权限绕过漏洞"
updated = "2026-07-14T02:16:57Z"

