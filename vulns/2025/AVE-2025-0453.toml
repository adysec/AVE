[basic]
description = "Google Chrome 141.0.7390.54 之前版本的 Tab 组件存在侧信道信息泄露漏洞。远程攻击者可通过构造特制的 HTML 页面，诱骗用户执行特定的 UI 手势操作，利用侧信道方式窃取页面布局或状态信息，进而实现 UI 欺骗攻击。该漏洞攻击复杂度低，无需特权，但需要用户交互，CVSS 评分 5.4，危害等级中危。Google 已在 Chrome 141.0.7390.54 版本中修复此漏洞。"
published = "2025-11-06T22:15:38Z"
remediation = "立即将 Google Chrome 升级至 141.0.7390.54 或更高版本（最新稳定版为 141.0.7390.122），可通过 Chrome 菜单 > 帮助 > 关于 Google Chrome 自动检查更新。基于 Chromium 的浏览器（如 Microsoft Edge、Brave）用户应同步更新至对应修复版本。Fedora 43 用户执行 sudo dnf update chromium 升级至 141.0.7390.122。作为临时缓解措施，可在浏览器设置中禁用 JavaScript 或安装阻止第三方 UI 覆盖的扩展程序。"
score = 5.4
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome Tab 侧信道信息泄露漏洞"
updated = "2026-06-17T08:29:51Z"

