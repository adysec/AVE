[basic]
description = "HP Tru64/OSF1 操作系统的 DXTerm 终端模拟器存在本地缓冲区溢出漏洞。当用户向 dxterm 程序的 -xrm 参数传递超长字符串时，可触发栈缓冲区溢出，导致攻击者能够以当前用户权限执行任意代码。该漏洞需要攻击者拥有本地系统访问权限，CVSS 评分 7.2，危害等级高。目前已有公开的利用代码，建议用户升级至最新版本或应用厂商提供的安全补丁。"
published = "2002-10-04T04:00:00Z"
remediation = "建议升级 HP Tru64/OSF1 操作系统至厂商发布的最新维护版本，或安装针对 DXTerm 缓冲区溢出漏洞的安全补丁（HP 安全公告相关补丁）。由于该产品已停止维护，建议迁移至受支持的操作系统平台，并在迁移前严格限制本地用户对 dxterm 程序的执行权限，仅授权可信用户使用。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "HP Tru64/OSF1 DXTerm 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:58:46Z"

