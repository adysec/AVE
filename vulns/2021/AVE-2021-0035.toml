[basic]
description = "该漏洞源于 Android 平台调制解调器接口驱动程序中存在输入验证缺失问题。当攻击者已获得 radio 权限的情况下，可通过调制解调器接口发送包含格式化字符串的恶意输入，触发内核层格式化字符串漏洞（CWE-134），导致设备内核崩溃（kernel panic）。此漏洞影响三星 Android 设备中 SMR Oct-2021 Release 1 之前的 modem interface 驱动。由于攻击者需要先在设备上获得 radio 权限，且利用仅造成本地内核拒绝服务，无法实现代码执行或权限提升，因此 CVSS 评分仅为 3.3（低危）。Samsung 已在 2021 年 10 月安全更新中修复该漏洞。"
published = "2021-10-06T18:15:09Z"
remediation = "安装三星 2021 年 10 月安全维护版本（SMR Oct-2021 Release 1）或更高版本以修复此漏洞。用户可通过「设置 > 软件更新 > 下载并安装」在线更新，或通过 Samsung Smart Switch 连接电脑进行固件升级。受影响设备包括搭载 Exynos 芯片组、运行 Android 8.1（O）至 11.0（R）的三星手机。如设备无法升级，建议停止使用该设备或避免授予应用无线电权限以降低风险。更多信息请参考三星安全公告：https://security.samsungmobile.com/securityUpdate.smsb?year=2021&month=10"
score = 3.3
severity = "LOW"
sources = ["kev"]
title = "Google Android 调制解调器接口驱动格式字符串漏洞"
updated = "2026-06-17T03:42:10Z"

