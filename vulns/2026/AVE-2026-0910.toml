[basic]
description = "Cloudreve 是一款自托管的文件管理与分享系统，其 WOPI 集成存在授权验证缺陷。WOPI 访问令牌生成格式为 `<会话ID>.<随机密钥>`，但中间件 `ViewerSessionValidation` 仅验证会话 ID 前缀，未将完整令牌与存储值进行比对，导致任意后缀均可通过验证。同时，创建查看会话时指定的 `preferred_action`（如 view）未被持久化存储或强制执行，查看会话仍可调用 WOPI 写入接口。具有低权限的攻击者若能够获取或猜测有效会话 ID，即可伪造令牌后缀，通过查看会话对目标文件执行写入操作，造成机密性降低与完整性破坏。该漏洞影响 Cloudreve 4.17.0 之前版本，已在 4.17.0 版本中修复。"
published = "2026-07-31T04:17:24.160"
remediation = "立即升级 Cloudreve 至 v4.17.0 或更高版本，该版本已修复 WOPI 中间件未校验完整 access_token 及未限制视图会话写入权限的问题。如无法立即升级，可在反向代理层对 `/api/v4/file/wopi/` 路径添加访问控制，仅允许受信任的 WOPI 客户端 IP 访问，并禁用 WOPI 集成中的写操作路由作为临时缓解措施。"
score = 6.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Cloudreve WOPI 会话鉴权绕过漏洞"
updated = "2026-07-31T20:16:53.080"

