[basic]
description = "Google Chrome Android 版本 142.0.7444.137 之前版本中，Omnibox 地址栏存在不当实现漏洞（CWE-451）。远程攻击者可通过诱导用户执行特定 UI 手势，配合精心构造的 HTML 页面实施 UI 欺骗攻击，伪造地址栏显示内容误导用户。该漏洞影响 Android 版 Chrome 142.0.7444.137 之前版本，CVSS 3.1 评分 4.2（中危），攻击向量为网络，攻击复杂度高，需用户交互，无需权限，影响机密性低和可用性低。攻击者需诱导用户访问恶意页面并执行特定交互手势才能触发 UI 欺骗，Google 已在 Chrome 142.0.7444.137 版本中修复该漏洞。"
published = "2025-11-10T20:15:39Z"
remediation = "立即将 Google Chrome 升级到 142.0.7444.162 及以上版本，作为主要修复措施。若无法立即更新，可在防火墙中配置应用级过滤，阻止执行特定 UI 交互的危险 HTML 页面。访问 chrome://settings/help 检查当前版本，并启用自动更新功能以确保及时获取安全补丁。"
score = 4.2
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome Android Omnibox UI 欺骗漏洞"
updated = "2026-06-17T08:32:51Z"

