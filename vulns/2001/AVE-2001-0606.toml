[basic]
description = 'ProFTPD 的 mod_sqlpw 模块在用户使用 "user" 命令切换 FTP 账户时，未能正确重置已缓存的密码，导致已认证的攻击者能够利用该缓存获取其他用户账户的访问权限，从而实现权限提升。该漏洞影响启用了 mod_sqlpw 模块的 ProFTPD 服务器版本，攻击条件要求攻击者首先获得一个低权限 FTP 账户的认证凭据。攻击者可先以普通用户身份登录，随后发送 "user" 命令切换至其他高权限账户，此时模块未清除的缓存密码会被复用，绕过正确的认证验证流程，最终获得被切换账户的完整访问和操作权限。该漏洞危害等级为高，CVSS 评分 7.5。'
published = "2001-02-12T05:00:00Z"
remediation = '升级 ProFTPD 到包含 mod_sqlpw 模块密码缓存修复的版本（如 1.3.10 或更高版本），并确保在配置文件中正确配置 mod_sqlpw 模块，包括设置合适的密码缓存超时时间和清理机制。如无法立即升级，可通过限制使用"用于"命令的用户权限或在防火墙中禁用与 ProFTPD 相关的服务作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "ProFTPD mod_sqlpw 权限提升漏洞"
updated = "2026-06-16T21:53:30Z"

