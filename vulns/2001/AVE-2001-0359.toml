[basic]
description = "tags.<value>GNU groff 1.16.1 及更早版本中的 pic 工具，以及 jgroff 1.15 之前版本，存在格式字符串漏洞。远程攻击者无需身份认证即可通过向目标发送特制的 plot 命令，利用格式字符串说明符绕过 -S 选项限制，在目标系统上执行任意命令。该漏洞影响使用 groff 处理图形输入的本地与远程环境，攻击者可借此获得系统控制权，危害等级为高危。"
published = "2001-07-26T04:00:00.000"
remediation = "升级 groff 至 1.18 或更高版本以修复格式字符串漏洞。升级 Debian/Ubuntu 系统：运行 sudo apt-get update && sudo apt-get install groff。若无法立即升级，可临时通过 LPD 服务配置禁用远程打印队列访问权限以缓解风险。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "GNU groff pic 工具格式字符串远程命令执行漏洞"
updated = "2026-06-16T21:55:25.770"

