[basic]
description = 'GNU Emacs 文本编辑器中存在命令注入漏洞，源于其对自定义 "man" URI 方案处理不当。远程未认证攻击者可通过诱骗用户访问特制网站或包含重定向的 HTTP URL 触发该漏洞，在目标系统上执行任意 shell 命令。该漏洞影响 Emacs 多个版本，攻击无需身份认证但依赖用户交互，CVSS 评分 8.8，危害等级高。建议用户升级至修复版本以消除风险。'
published = "2025-02-12T15:15:18Z"
remediation = "立即升级至 Emacs 29.4.0 或更高版本。Red Hat 用户请参考 RHSA-2025:1915/RHSA-2025:1917/RHSA-2025:1961 等安全公告安装对应补丁；Debian 用户需更新至 emacs 27.2-4 或更新版本。也可通过禁用 Emacs 中 man:// URI 方案处理或限制不可信来源的文件变量作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "GNU Emacs 自定义 man URI 方案命令注入漏洞"
updated = "2026-06-29T21:16:32Z"

