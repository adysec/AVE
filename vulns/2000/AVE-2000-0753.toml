[basic]
description = "HP-UX 11.0 系统中 /bin/cu 程序存在栈缓冲区溢出漏洞，本地攻击者可通过向 -l 命令行参数传递过长字符串触发栈溢出，覆盖返回地址并执行任意 Shellcode，从而将权限从普通用户提升至 root 权限。该漏洞影响 HP-UX 11.0 操作系统，攻击者需具备本地账户访问权限且无需认证即可利用，攻击复杂度低，成功利用可完全控制系统机密性、完整性和可用性（CVSS 7.2，高危）。HP 官方已发布补丁修复该漏洞，建议尽快升级系统或应用官方补丁 PHNE_2000_1028 进行修复。"
published = "2000-12-11T05:00:00.000"
remediation = "HP-UX 11.0系统请立即应用最新的HP-UX安全更新包，例如升级到HP-UX 11.0与11.0i最新的Patch Cluster或适用版本。如条件不允许立即应用补丁，可通过修改/bin/cu权限配置，将文件权限设置为chmod 750 /bin/cu并添加所有者为root且权限为750，同时禁用网络上的cu服务或限制其网络访问，最后启用系统审计功能，记录cu程序的调用日志以监控异常行为，这是有效的临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "惠普 HP-UX 11.0 /bin/cu 缓冲区溢出本地权限提升漏洞"
updated = "2026-06-16T21:53:00.150"

