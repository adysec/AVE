[basic]
description = 'Windows NT 4.0 系统中 SNMP Parameters 注册表项的默认权限设置不当，导致远程攻击者能够读取甚至修改 SNMP 团体字符串（community strings），从而获取敏感网络信息或篡改网络配置。该漏洞属于"注册表权限"类漏洞，攻击者无需身份认证即可利用，影响范围涵盖 Windows NT 4.0 及 Windows 2000 系统，可导致敏感信息泄露和网络配置被恶意篡改。'
published = "2001-02-16T05:00:00Z"
remediation = '立即下载并运行 Microsoft 提供的 regacl40 工具（MS00-095 安全公告），该工具会自动将 HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\SNMP\Parameters 下 PermittedManagers 和 ValidCommunities 两个注册表值的权限修正为仅 Administrators、System、Creator Owner 拥有完全控制权。运行命令：regacl40 -v。如无法立即部署工具，可手动使用 regedt32 将上述注册表键的权限设置为仅管理员完全控制，并移除 Everyone 和 Users 组的访问权限。同时建议在防火墙层面限制对 UDP 161/162 端口的访问，并禁用不必要的 SNMP 服务。'
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows NT 4.0 SNMP 注册表权限信息泄露漏洞"
updated = "2026-06-16T21:53:33Z"

