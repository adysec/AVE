[basic]
description = 'WordPress 的 mndpsingh287 File Manager 插件 2.9 版本中存在跨站脚本（XSS）漏洞，位于 wp-admin/admin.php?page=wp_file_manager 页面的 lang 参数。由于 file_folder_manager.php 中使用了 set_transient 函数且 lib\wpfilemanager.php 直接对 lang 参数进行 echo 输出，未进行充分的过滤与转义，导致攻击者可向已登录的管理员用户发送特制链接，诱使其点击后在当前页面上下文中执行任意 JavaScript 代码。该漏洞利用条件为攻击者需拥有低权限用户身份且需用户交互，影响范围涉及插件版本 2.9，可导致敏感信息泄露与页面内容篡改。'
published = "2018-09-07T22:29:01Z"
remediation = "立即将 WP File Manager 插件升级至 3.0 或更高版本（3.0 于 2018-09-05 发布，已修复此 XSS 漏洞）。如无法立即升级，可在 WordPress 后台 → 用户 → 所有用户中，将可能访问 wp-admin 的用户角色权限降至最低，避免低权限用户触发 lang 参数注入。"
score = 5.4
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress File Manager 插件跨站脚本漏洞"
updated = "2026-06-17T01:44:09Z"

