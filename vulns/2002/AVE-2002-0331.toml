[basic]
description = "华盛顿大学 Pine 4.44 及早期版本在处理包含大量引号的 From 邮件头时存在堆损坏漏洞。远程攻击者可发送包含大量引号的特制 From 头邮件，触发堆内存损坏导致 Pine 客户端核心转储并重启失败，造成拒绝服务攻击。该漏洞影响 Pine 4.44 及更早版本，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），攻击向量为网络，攻击复杂度低，无需身份认证，仅影响可用性。攻击者只需发送一封包含畸形 From 头的恶意邮件即可触发漏洞，导致邮件客户端崩溃并无法正常重启，造成拒绝服务影响。ExploitDB 已公开 PoC 利用代码（EDB-21985），攻击者可直接利用构造恶意邮件实施攻击。"
published = "2002-12-11T05:00:00Z"
remediation = "立即将 Pine 邮件客户端升级至 4.50 或更高版本，该版本修复了 From 头包含大量引号导致的堆溢出与拒绝服务问题。如暂时无法升级，可在邮件网关层配置过滤规则，拦截 From 头中连续引号超过正常阈值的邮件，并限制外部邮件直接投递至内部用户邮箱，以降低服务中断风险。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "University of Washington Pine 邮件客户端 拒绝服务漏洞"
updated = "2026-06-16T21:59:06Z"

