[basic]
description = "Kaseya VSA 远程监控管理软件存在严重安全漏洞，影响 R9.3 9.3.0.35 之前版本、R9.4 9.4.0.36 之前版本及 R9.5 9.5.0.5 之前版本。未经身份认证的远程攻击者可利用该漏洞在所有受管设备上执行任意 PowerShell 载荷，实现远程代码执行。该漏洞源于 VSA 服务器对管理指令验证不当，攻击者无需认证即可向受管端点推送恶意 PowerShell 命令，实现远程代码执行并完全控制受管设备。该漏洞 CVSS 3.1 评分 9.8（CRITICAL），攻击向量为网络、攻击复杂度低、无需权限、无需用户交互，2018 年 1 月已遭在野活跃利用，影响范围极广，危害极大。Kaseya 已在后续版本中修复该漏洞，建议立即升级至修复版本。"
published = "2019-02-05T06:29:00Z"
remediation = "建议立即将 Kaseya VSA RMM 升级至 R9.3 9.3.0.35 或更高版本、R9.4 9.4.0.36 或更高版本、R9.5 9.5.0.5 或更高版本。通过 Kaseya 官方下载中心下载对应版本补丁包，按官方升级指南停止 VSA 服务、备份数据库、应用补丁包、重启服务并验证版本号。如无法立即升级，可在防火墙层面限制 VSA 服务器仅允许受信管理 IP 访问 5721/443 端口，并禁用非必要的 PowerShell 远程执行策略作为临时缓解措施。建议立即排查所有托管设备是否存在异常 PowerShell 进程执行记录。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Kaseya VSA RMM 远程代码执行漏洞"
updated = "2026-06-17T01:53:24Z"

