[basic]
description = "Google Chrome 浏览器的下载组件在实现上存在缺陷。远程攻击者可以通过诱导用户访问一个精心构造的 HTML 恶意页面，并在用户执行特定 UI 手势（如点击）后，绕过浏览器的下载安全保护机制，从而在用户设备上下载不安全的文件。该漏洞影响 143.0.7499.41 版本之前的 Google Chrome 浏览器，CVSS 评分为 4.3，属于中危漏洞。"
published = "2025-12-02T19:15:48Z"
remediation = "建议立即将 Google Chrome 浏览器升级至 143.0.7499.41 或更高版本。对于 Fedora 42 用户，应更新至 chromium-143.0.7499.146 及 cef-143.0.10+g8aed01b 版本以修复此下载保护绕过漏洞。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome 下载保护绕过漏洞"
updated = "2026-06-17T08:34:29Z"

