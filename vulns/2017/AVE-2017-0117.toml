[basic]
description = "OpenVPN Access Server 2.1.4 版本的 Web 管理界面存在 CRLF 注入漏洞（CWE-93），攻击者可在 __session_start__/ 路径的 PATH_INFO 参数中注入 %0A（换行符），注入任意 HTTP 响应头。攻击者无需认证即可发起攻击，但需诱导受害者点击恶意链接（UI:R），成功后可实施会话固定攻击或 HTTP 响应拆分攻击，窃取会话 Cookie 或污染缓存，影响 OpenVPN Access Server 2.1.4 版本，CVSS 3.0 评分 6.1（中危），攻击向量为网络、低攻击复杂度、需用户交互、权限范围改变、机密性/完整性低影响、无可用性影响。官方已发布修复版本，建议升级至 2.1.4 以上版本并启用 HTTP 头过滤。"
published = "2017-05-26T01:29:00Z"
remediation = '升级到 OpenVPN Access Server 2.1.5 或更高版本以修复漏洞。修改配置文件，禁用不必要的服务端口，并应用安全补丁。临时缓解措施是在 Web 应用防火墙中过滤包含 "%0A" 等特殊字符的 HTTP 请求。'
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "OpenVPN Access Server CRLF注入漏洞"
updated = "2026-06-17T01:21:21Z"

