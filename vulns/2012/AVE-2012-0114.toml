[basic]
description = "Apple iOS 5.1 之前版本及 iTunes 10.6 之前版本中使用的 WebKit 引擎存在未明内存破坏漏洞（CWE-119）。远程攻击者可诱使用户访问特制网站，触发 WebKit 在处理页面内容时发生内存损坏，导致应用程序崩溃或实现任意代码执行。该漏洞影响 Safari 5.1.4 之前版本，CVSS 评分 9.3，危害严重。Apple 已于 2012 年 3 月安全更新中修复此漏洞。"
published = "2012-03-08T22:55:03Z"
remediation = "升级 Apple iOS 至 5.1 及以上版本、iTunes 至 10.6 及以上版本、Safari 至 5.1.4 及以上版本，可通过设备自带软件更新功能或访问 Apple 官网下载安装。对于无法升级的旧设备，建议禁用 JavaScript 并避免访问不可信网站作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:57Z"

