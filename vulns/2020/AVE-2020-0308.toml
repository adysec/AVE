[basic]
description = "Apache Airflow 1.10.10及以下版本中自带的示例DAG（有向无环图）存在命令注入漏洞。攻击者在已认证的情况下，可通过向Airflow Web界面中受影响的示例DAG发送特制的HTTP请求，利用示例DAG中未对用户输入进行充分过滤的缺陷，注入任意系统命令。该漏洞可导致远程代码执行，攻击者能够以Airflow worker或scheduler进程的权限在目标服务器上执行任意命令，进而完全控制服务器。若用户已在配置中设置load_examples=False禁用示例DAG，则不受此漏洞影响。"
published = "2020-07-17T00:15:10.337"
remediation = "立即升级 Apache Airflow 至 1.10.11 或更高版本。如无法升级，在 airflow.cfg 中设置 load_examples=False 禁用示例 DAG，并删除 $AIRFLOW_HOME/dags 目录下所有示例文件。同时限制 Airflow Web UI 的访问来源 IP，仅允许受信任的管理员网络访问。建议对 Airflow 工作节点实施最小权限原则，避免以 root 用户运行 worker/scheduler 进程。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Apache Airflow 默认DAG命令执行漏洞"
updated = "2026-06-17T02:51:10.520"

