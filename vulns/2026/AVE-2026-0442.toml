[basic]
description = "Ruby CSS 解析库 css_parser 在 2.2.0 至 3.0.0 版本中存在服务端请求伪造（SSRF）与本地文件读取漏洞。`CssParser::Parser#read_remote_file` 方法在处理远程 CSS 文件时未对目标主机、IP 地址及 URI 协议进行任何校验，允许攻击者通过 `@import url(...)` 注入任意 HTTP/HTTPS 请求，可访问内网服务、云元数据接口等受限资源。更严重的是，该方法会递归跟随 HTTP 重定向且不检查目标协议，攻击者可构造 `Location: file:///etc/passwd` 将 SSRF 升级为任意本地文件读取。任何将攻击者可控 CSS 与 `base_uri:` 选项传入 css_parser 的应用（如 Premailer 邮件处理管道）均受影响。官方已在 3.0.0 版本中通过引入 ssrf_filter 库、移除 file:// 远程读取路径等方式修复。"
published = "2026-07-17T21:17:07Z"
remediation = "立即将 css_parser 升级至 3.0.0 或更高版本，该版本默认通过 ssrf_filter 拒绝内网地址和 file:// 协议。如无法升级，在调用 Parser.new 时不要传入用户可控的 base_uri 参数，并对所有 @import url() 中的 URL 进行白名单校验，仅允许 http/https 协议且过滤内网 IP 段。"
score = 8.9
severity = "HIGH"
sources = ["ghsa"]
title = "Ruby css_parser 服务器端请求伪造与本地文件读取漏洞"
updated = "2026-07-23T16:15:11Z"

