[basic]
description = "IRIX 操作系统中的打印状态查询工具 lpstat (/usr/bin/lpstat) 在命令行参数处理时存在缓冲区溢出漏洞。漏洞原理是该程序在解析用户输入的命令行参数时，未对“-n”选项所跟随的字符串长度进行有效校验，导致可被攻击者通过输入超长数据覆盖栈帧返回地址，从而劫控程序执行流程。攻击条件要求攻击者已获得目标 IRIX 系统的普通用户访问权限（本地可访问），无需额外网络交互。一旦触发，该漏洞允许本地普通用户通过精心构造的溢出载荷执行任意指令，从而获得 root 权限，实现本地权限提升，最终完整控制受影响主机。受影响范围包括 IRIX 5.3、6.2、6.3、6.4、6.5 及 6.5.11 等多个版本系统。目前 Last Stage of Delirium 已发布针对该漏洞的本地利用代码，证实攻击者可借助栈溢出机制在存在漏洞的 IRIX 系统上执行任意代码。"
published = "2000-10-20T00:00:00Z"
remediation = "建议立即安装 SGI 官方发布的 IRIX 安全补丁：IRIX 6.5 系统应用 Patch 3878（或更新的同类补丁），IRIX 6.4 应用 Patch 3879，IRIX 6.3 应用 Patch 3880，IRIX 6.2 应用 Patch 3881。通过执行 `versions -bR | grep 3878` 验证补丁是否已安装。若无法立即打补丁，可通过移除 lpstat 的 setuid 位作为临时缓解措施：执行 `chmod u-s /usr/bin/lpstat` 及 `chmod u-s /bin/lpstat` 取消 root 权限执行，同时限制普通用户对打印子系统的访问权限。由于 IRIX 已停止维护，强烈建议迁移至受支持的现代操作系统。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "SGI IRIX lpstat 本地缓冲区溢出漏洞"
updated = "2000-10-20T00:00:00Z"

