[basic]
description = "Jolokia Agent 1.3.7 的 HTTP Servlet 存在跨站脚本（XSS）漏洞（CWE-79），攻击者可通过精心构造的恶意请求将 JavaScript 代码注入到受害者的浏览器中。该漏洞允许未经身份认证的攻击者在目标用户浏览 Jolokia 管理控制台时执行任意脚本，窃取会话凭证或执行钓鱼攻击。攻击条件为攻击者需诱导受害者访问包含恶意载荷的特制 URL 或页面，受害者的浏览器在渲染页面时执行注入的 JavaScript 代码。该漏洞影响运行 Jolokia Agent 1.3.7 的 Java Management Extensions（JMX）管理接口，攻击者无需认证即可利用。"
published = "2018-03-14T13:29:00Z"
remediation = "立即将 Jolokia 升级至 1.5.0 或更高版本，该版本已在 AgentServlet.java 中添加回调参数（callback）与 MIME 类型参数的合法性校验，拒绝包含 HTML 标签或 JavaScript 代码片段的恶意回调名称。如暂时无法升级，可在 Jolokia 配置文件中禁用 callback 参数的 JSONP 输出功能或将 mimeType 严格限制为 text/plain 或 application/json，以阻断 XSS 攻击向量。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "红帽 Jolokia Agent 跨站脚本攻击漏洞"
updated = "2026-06-17T01:32:29Z"

