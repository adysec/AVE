[basic]
description = "EFTP（易文件传输协议）在数据处理过程中存在缓冲区溢出漏洞，攻击者可通过向目标系统发送特制的超长字符串触发溢出，导致缓冲区控制流被破坏并引发拒绝服务。该漏洞影响 EFTP 协议实现，远程攻击者无需身份验证即可触发，造成服务不可用。漏洞影响涉及系统可用性，可能导致网络文件传输服务中断，影响用户正常操作。该漏洞利用原始的网络协议通信特点，通过畸形报文引发程序异常，最终使服务进程崩溃或进入无限循环状态，持续消耗系统资源。"
published = "2000-11-14T05:00:00Z"
remediation = "立即升级到最新版本的EFTP软件（如v2.1或更高版本），其中修复了缓冲区溢出漏洞。如果无法更新，建议通过防火墙禁用不必要的端口访问EFTP服务，并限制远程用户权限，防止攻击者提交超长数据导致服务拒绝。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Eftp Eftp 缓冲区溢出远程拒绝服务漏洞"
updated = "2026-06-16T21:52:38Z"

