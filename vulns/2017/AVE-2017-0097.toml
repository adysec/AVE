[basic]
description = "WordPress 的 user-role 插件 1.5.6 之前版本存在多个跨站脚本（XSS）漏洞。该漏洞源于插件未对用户输入进行充分的过滤与转义处理，具有用户交互权限的攻击者可通过向受影响页面注入恶意 JavaScript 代码，当管理员或其他用户访问特制链接时，恶意脚本将在浏览器中执行，导致敏感信息泄露或会话劫持。攻击者需诱使用户点击恶意链接，攻击复杂度较低。"
published = "2019-08-20T16:15:13Z"
remediation = "升级 WordPress user-role 插件至 1.5.6 或更高版本。在 wp-config.php 中添加 `define('DISALLOW_UNFILTERED_HTML', true);` 限制未授权用户的 HTML 输入。如无法立即升级，可通过 Web 应用防火墙（WAF）规则过滤跨站脚本攻击载荷作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress user-role插件跨站脚本漏洞"
updated = "2026-06-17T01:13:06Z"

