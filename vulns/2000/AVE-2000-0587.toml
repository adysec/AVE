[basic]
description = 'Internet Explorer 4.x 和 5.x 存在 SSL 证书验证缺陷，当用户在同一浏览器会话中与同一服务器建立新的 SSL 会话时，浏览器未能正确重新验证服务器的 SSL 证书，属于两种不同"SSL 证书验证"漏洞之一。该漏洞影响 Internet Explorer 4.x 和 5.x 版本，CVSS 评分 2.6（AV:N/AC:H/Au:N/C:P/I:N/A:N），属于低危漏洞。攻击条件要求攻击者诱导用户在同一 IE 会话中与同一服务器建立新的 SSL 连接，利用方式为中间人攻击者可伪造证书欺骗浏览器，导致信息泄露（仅影响机密性），Microsoft 已于 2000 年 6 月发布安全公告修复此漏洞。'
published = "2000-06-05T04:00:00Z"
remediation = "此漏洞影响 Internet Explorer 4.x/5.x（已停止支持）。建议：1) 升级至 Microsoft Edge（内置 IE 模式）或 Chrome/Firefox 等现代浏览器；2) 若必须使用 IE，请在“Internet 选项 → 高级 → 安全”勾选“检查服务器证书吊销”并启用“检查发布者证书吊销”；3) 部署网络层 SSL 检查设备拦截异常证书；4) 禁用 SSLv2/v3 协议，强制 TLS 1.2+。"
score = 2.6
severity = "LOW"
sources = ["avd"]
title = "微软 Internet Explorer SSL 证书验证绕过漏洞"
updated = "2026-06-16T21:51:54Z"

