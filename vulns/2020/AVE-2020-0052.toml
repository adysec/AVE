[basic]
description = "Micro Focus 多款 IT 管理产品存在代码注入漏洞，攻击者可利用该漏洞在受影响服务器上执行任意代码。该漏洞影响 Operation Bridge Manager、Application Performance Management、Data Center Automation、Operations Bridge（容器化）、Universal CMDB、Hybrid Cloud Management 及 Service Management Automation 等多个产品线，其中 Operation Bridge Manager 受影响的版本包括 2020.05、2019.11、2019.05、2018.11、2018.05 以及 10.6x、10.1x 及更早版本。攻击者通过向目标系统发送特制请求即可利用此漏洞，成功利用后可完全控制服务器，CVSS v3.1 评分为 8.8，危害等级为高危。"
published = "2020-10-22T21:15:12Z"
remediation = "建议立即将 Operation Bridge Manager (OBM) 升级至 2020.05 及以上版本，Universal CMDB (uCMDB) 升级至 2020.05 及以上版本。对于其他受影响的 Micro Focus 产品，请安装相应的 2020 年 10 月安全补丁。在无法立即升级的情况下，建议通过网络防火墙限制对管理控制台的访问，仅允许受信任的 IP 地址连接。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "Micro Focus Operation Bridge Manager 远程代码执行漏洞"
updated = "2026-06-17T02:50:55Z"

