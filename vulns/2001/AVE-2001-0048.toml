[basic]
description = "OmniHTTPd 2.07 默认安装的 statsconfig.pl CGI 脚本未对用户输入进行充分过滤，存在任意文件覆盖与命令注入漏洞。未经身份认证的远程攻击者可通过向目标服务器发送特制 POST 请求，利用 cgidir 参数覆盖服务器上的任意文件（包括位于其他驱动器的文件），或通过 mostbrowsers 参数向生成的 Perl 脚本中注入任意代码。当 statsconfig 执行该脚本时，注入的代码将在 Web 服务器权限下运行，导致远程命令执行。该漏洞影响 Windows 平台下的 OmniHTTPd 2.07 及可能更早版本，成功利用可导致完全控制目标主机或拒绝服务。"
published = "2001-03-12T05:00:00.000"
remediation = "立即将 OmniHTTPd 升级至 2.08 或更高版本，该版本已修复 statsconfig.pl 中 cgidir 参数导致的任意文件写入漏洞。如厂商未提供补丁，建议暂时禁用或删除 /cgi-bin/statsconfig.pl 脚本，并在防火墙中限制对 /cgi-bin/statsconfig.pl 的外部访问。作为临时缓解措施，可将 cgi-bin 目录设为仅本地访问，或改用其他受支持的 Web 服务器替代 OmniHTTPd 2.07。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Omnicron OmniHTTPd 任意文件写入漏洞"
updated = "2026-06-16T21:53:40.907"

