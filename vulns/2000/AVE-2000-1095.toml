[basic]
description = "IBM AIX 4.3.x 及更早版本中的 setclock 命令存在缓冲区溢出漏洞，该命令在处理超长参数时未对输入长度进行有效边界校验，导致栈缓冲区溢出。本地已登录用户可通过向 setclock 命令传递超长命令行参数触发此漏洞，进而覆盖栈帧返回地址，实现任意命令执行并获取系统提权。该漏洞影响 IBM AIX 4.3.x 及更早版本，CVSS 评分为 7.2，攻击者需具备本地访问权限方可利用。IBM 已通过官方补丁修复此问题，建议受影响用户升级至安全版本。"
published = "2001-01-09T05:00:00.000"
remediation = "安装 IBM 发布的 APAR IY07790（AIX 4.2.x）或 IY07831（AIX 4.3.x）安全补丁，或将系统升级至 AIX 4.3.3 以后版本以彻底修复此漏洞。临时缓解措施可移除 /usr/bin/setclock 的 setuid 位（执行 chmod u-s /usr/bin/setclock），限制非授权本地用户的执行权限。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "IBM AIX 缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:53:11.717"

