[basic]
description = "Linux 内核 2.4.21 之前的 C-Media PCI 声卡驱动程序在访问用户空间内存时未使用 get_user() 函数，导致内核空间直接越界读写用户空间数据，违反了内核与用户空间之间的安全隔离边界。该漏洞影响所有使用 C-Media PCI 声卡驱动程序的 Linux 系统，本地攻击者可通过向声卡驱动提交特制输入触发该越界访问，进而辅助利用其他内核漏洞实现权限提升或执行任意代码。此漏洞与 CVE-2003-0700 为不同的安全缺陷，Red Hat 已在 RHSA-2003-239 安全公告中发布修复补丁。"
published = "2003-08-27T04:00:00Z"
remediation = "将 Linux 内核升级至 2.4.21 或更高版本，修复 C-Media PCI 声卡驱动未使用 get_user 函数访问用户空间的安全问题。对于 Red Hat Enterprise Linux 2.1 及 Red Hat Linux Advanced Workstation 2.1 系统，可安装 Red Hat 安全更新 RHSA-2003-239 或 RHSA-2003-238 中对应的内核补丁包。如短期内无法升级内核，建议通过黑列表或模块管理禁用 C-Media PCI 声卡驱动（snd-cmipci）作为临时缓解措施，阻止该驱动被加载利用。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Linux C-Media PCI 声卡驱动安全边界绕过漏洞"
updated = "2026-06-16T22:02:40Z"

