[basic]
description = 'MultiHTML 1.5 的 CGI 脚本存在路径遍历文件泄露漏洞。未经身份认证的远程攻击者可通过向"multi"参数传入任意文件路径（如../../etc/passwd），读取目标服务器上的敏感文件内容。该漏洞影响安装了 MultiHTML 1.5 的 Web 服务器，CVSS 评分 5.0，危害等级中等。攻击者无需凭据即可远程利用，在特定配置下还可能通过该漏洞执行任意命令，导致服务器被完全控制。'
published = "2000-12-19T05:00:00.000"
remediation = "立即升级到 MultiHTML 最新可用版本，或替换为维护良好的替代方案（如 thttpd 内置索引功能）。若无法立即升级，应在 Web 服务器配置中禁用该 CGI 脚本的执行权限，或通过.htaccess 限制仅允许特定目录访问。同时修改 multihtml.c 源码，对 multi 参数进行严格过滤，移除 '/'、'..' 等路径分隔符，设定文件访问白名单，并将 Web 服务器运行用户权限降级至最低限度，禁止读取系统敏感文件。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "MultiHTML CGI 脚本文件泄露漏洞"
updated = "2026-06-16T21:52:44.943"

