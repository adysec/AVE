[basic]
description = "Argus Surveillance DVR 4.0.0.0 存在目录遍历漏洞，未经身份认证的远程攻击者可通过向 WEBACCOUNT.CGI 的 RESULTPAGE 参数传入 `..%2F` 路径序列绕过访问限制，遍历服务器文件系统，导致任意文件泄露。该漏洞攻击复杂度低，无需任何权限即可利用，影响所有运行该固件版本的 DVR 设备，可泄露敏感配置文件和录像数据。"
published = "2018-08-30T17:29:01Z"
remediation = "立即将 Argus Surveillance DVR 升级到厂商提供的最新版本（如有）。该产品厂商已停止安全维护，建议迁移至仍在维护的替代监控方案。如无法立即替换，可在防火墙或反向代理层面限制对 TCP 8080 端口的访问，仅允许受信任内网 IP 连接，并禁用 WEBACCOUNT.CGI 脚本的执行权限以阻断目录遍历攻击路径。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Argus Surveillance DVR 4.0.0.0 目录遍历漏洞"
updated = "2026-06-17T01:43:02Z"

