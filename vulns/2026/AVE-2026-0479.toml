[basic]
description = "Autel 电动汽车充电器（MaxiCharger AC Elite Home）软件更新过程中的数字签名验证严重不足，导致未经身份验证的物理访问者可以执行任意代码。攻击者无需密码即可提供恶意软件更新镜像，系统在验证过程中出现漏洞，允许恶意代码注入。该漏洞影响范围广泛，任何普通用户均可通过物理接触充电设备触发攻击，由于无需身份验证，风险尤为严重。攻击者可以利用此漏洞完全接管充电系统，甚至扩展到电动汽车的安全控制层面。微软已发布 V1.40.81 固件版本以修复此安全缺陷，但用户仍需手动升级以确保安全。 CVSS 评分 6.4，危险等级中等（6.4 适用于中等风险），漏洞影响多方面，包含多个高危点，需立即修复"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 Autel MaxiCharger AC Elite Home 固件升级至 V1.40.81 或更高版本，该版本修复了软件更新签名验证缺陷。升级前确保充电器连接至可信网络，避免使用公共充电桩提供的固件更新。若暂时无法升级，应禁止非授权人员物理接触设备，并禁用设备的远程固件更新功能，仅通过 Autel 官方应用程序和受信任的网络进行固件更新操作。建议定期检查 Autel 官网或 Autel Energy 应用中的固件更新通知。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "Microsoft Windows TCP/IP 远程代码执行漏洞"
updated = "2026-01-01T00:00:00Z"

