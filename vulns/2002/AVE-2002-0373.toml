[basic]
description = "Linux 内核 2.2.x 存在本地拒绝服务漏洞，其 mmap() 系统调用在处理 /proc/pid/mem 接口时缺少充分的内存页访问权限检查。本地低权限用户可利用 mmap() 函数以 PROT_READ 参数，通过 /proc/pid/mem 伪文件系统映射目标进程的非可读内存页，触发内核错误导致系统崩溃。该漏洞影响运行 Linux 内核 2.2.x 系列的系统，攻击者需先在目标主机上拥有本地登录权限，再利用 ptrace() 附加到自身进程后打开 /proc/self/mem，通过 mmap() 映射不可读的内存区域即可触发内核崩溃，造成拒绝服务。该问题不影响 2.4 内核版本，因为 2.4 内核中已移除了对 /proc/pid/mem 接口的 mmap() 支持。"
published = "2002-12-23T05:00:00Z"
remediation = "升级 Linux 内核至 2.2.20-5 或更高版本（Debian woody 可通过 apt-get upgrade linux-image-2.2.20-i386 安装 2.2.20-5 修复版本），或迁移至受官方支持的 2.4/2.6 及以上内核。如无法立即升级，可临时通过 sysctl 设置 vm.mmap_min_addr = 65536 限制 mmap() 对低地址内存的映射，并在 /etc/fstab 中对 /proc 挂载选项添加 noexec,nosuid,nodev 以限制本地用户对 /proc/pid/mem 的访问，同时审查本地用户权限避免未授权访问。"
score = 2.1
severity = "LOW"
sources = ["exploitdb"]
title = "Linux Kernel 2.2 mmap() 本地拒绝服务漏洞"
updated = "2026-06-16T21:59:13Z"

