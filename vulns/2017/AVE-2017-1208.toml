[basic]
description = "Microsoft .NET Framework 的 WSDL 解析器在处理 SOAP 请求时存在代码注入漏洞（CWE-94）。攻击者可构造特制的 Office 文档或应用程序，在其中嵌入恶意 SOAP/WSDL 内容，当用户打开该恶意文档时，.NET Framework 的 SoapFormatter 组件未能正确验证输入，导致任意代码以当前用户权限执行。该漏洞影响 .NET Framework 2.0 至 4.7 版本，CVSS 评分 7.8，危害等级高。攻击需要用户交互（如打开邮件附件或点击链接），成功利用可完全控制受影响的系统。Microsoft 已于 2017 年 9 月安全更新中修复，CISA 已将其列入已知被利用漏洞目录。"
published = "2017-09-13T01:29:12Z"
remediation = "升级 Microsoft .NET Framework 至安全版本：安装 Microsoft 2017 年 9 月安全更新（KB4038874/KB4040973/KB4040980 等），将 .NET Framework 更新至 4.7.1 或更高版本。对于无法升级的系统，可限制用户打开来自不可信来源的 Office 文档，并启用 Windows Defender 攻击面减少规则阻止 Office 应用创建子进程。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft .NET Framework 远程代码执行漏洞"
updated = "2026-06-17T01:26:54Z"

