[basic]
description = "Google Chrome 142.0.7444.59 之前版本中的自动填充（Autofill）功能存在不当实现漏洞。远程攻击者可通过诱使用户执行特定的 UI 手势（如拖拽操作），并配合特制的 HTML 页面，利用该漏洞从进程内存中获取潜在的敏感信息。该漏洞影响所有使用 Chromium 内核的浏览器，CVSS 评分 5.3，危害等级中等。由于攻击需要用户交互，利用复杂度较高，但成功利用可能导致用户敏感数据泄露。"
published = "2025-11-10T20:15:38Z"
remediation = "立即将 Google Chrome 升级至 142.0.7444.59 或更高版本，可通过 Chrome 设置 > 关于 Chrome 自动检查更新。Fedora 42 用户请运行 `sudo dnf update` 更新至 142.0.7444.162。如无法立即升级，可在浏览器中禁用自动填充功能（设置 > 自动填充 > 关闭）作为临时缓解措施。"
score = 5.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome 自动填充信息泄露漏洞"
updated = "2026-06-17T08:32:23Z"

