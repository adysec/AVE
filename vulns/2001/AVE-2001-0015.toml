[basic]
description = "Oops! WWW Proxy Server 1.4.6（及其他可能版本）存在堆缓冲区溢出漏洞。该漏洞源于代理服务器在处理反向 DNS 查询返回的主机名或域名时未对长度进行有效校验，远程攻击者可通过向目标代理服务器发送包含超长主机名的特制请求，触发堆缓冲区溢出，从而执行任意命令，完全控制目标系统。攻击无需任何认证，CVSS 评分 10.0，危害等级严重。"
published = "2001-02-12T05:00:00Z"
remediation = "立即升级 oops WWW proxy server 至 1.4.6 以上版本（参考 ChangeLog 确认修复版本）。该软件已停止维护，建议迁移至 Squid、HAProxy 等活跃维护的代理服务器。临时缓解措施：在代理服务器前端防火墙限制来源 IP 访问，并禁用反向 DNS 查询功能以防止触发缓冲区溢出。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Oops! WWW Proxy Server 堆缓冲区溢出漏洞"
updated = "2026-06-16T21:53:31Z"

