[info]
author = "AVE"
description = "检测 eWave ServletExec 的 UploadServlet 是否可被未授权访问。攻击者无需认证即可通过 HTTP GET 访问该 Servlet，上传任意文件导致远程命令执行。"
id = "POC-AVE-2000-1908"
name = "eWave ServletExec UploadServlet 未授权访问 PoC"
severity = "critical"
tags = [
    "cve-2000-1024",
    "servletexec",
    "file-upload",
]
vuln_id = [
    "CVE-2000-1024",
    "AVE-2000-1908",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/servlet/com.unify.ewave.servletexec.UploadServlet"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/servlet/com.unify.servletexec.UploadServlet"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
