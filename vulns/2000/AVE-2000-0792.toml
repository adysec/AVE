[basic]
description = "Linux modutils 2.3.9 中的 modprobe 工具存在任意命令执行漏洞。modprobe 在加载内核模块时使用 popen() 执行 echo 命令，由于 popen() 依赖 /bin/sh 解析命令字符串，未对用户输入中的 shell 元字符进行转义过滤。虽然 modprobe 本身未设置 setuid 位，但内核的 kmod 设施在通过 request_module() 请求模块时会以 root 权限自动执行 modprobe。攻击者可通过 setuid ping 程序向内核传递包含 shell 元字符的设备名参数，触发 modprobe 执行任意命令，从而获取系统 root 权限。该漏洞影响 RedHat Linux 7.0 等使用 modutils 2.3.x 的 Linux 系统，CVSS 评分 7.2，危害等级高。"
published = "2001-01-09T05:00:00.000"
remediation = "升级 modutils 至 2.4.0 以上版本，或迁移至 module-init-tools/kmod 替代 modutils。Red Hat 系统参照 RHSA-2000-108 安装补丁，Debian 系统参照 DSA 20001120 更新。如无法升级，限制不可信用户本地登录权限。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Linux modutils 2.3.x modprobe 任意命令执行漏洞"
updated = "2026-06-16T21:53:08.130"

