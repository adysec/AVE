[basic]
description = "Linux 系统中 Kanji on Console (KON) 软件包的 fld 程序存在缓冲区溢出漏洞。本地攻击者可通过向 fld 程序提供包含超长 CHARSET_REGISTRY 或 CHARSET_ENCODING 设置的输入文件触发缓冲区溢出，成功利用后可获得 root 权限。该漏洞影响 Mandrake 7.0/7.1 及 RedHat Kon2 0.3.9 版本，CVSS 评分 7.2，危害等级高。攻击者需拥有本地系统访问权限，无需身份认证即可实施攻击，可导致目标系统机密性、完整性和可用性完全丧失。"
published = "2000-06-21T04:00:00Z"
remediation = "升级 Kon2 至 0.3.10 或更高版本，或移除 /usr/bin/fld 的 setuid 权限位（chmod u-s /usr/bin/fld）作为临时缓解措施。对于仍在运行的 Mandrake 7.x/RedHat 6.x 等已停止支持的系统，建议升级至受支持的操作系统版本。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Mandrake/RedHat Linux Kon2 fld 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:05Z"

