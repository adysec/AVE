[basic]
description = "Google Chrome 浏览器在 91.0.4472.77 及之前版本中，弹出窗口阻止程序（PopupBlocker）对导航策略的实施存在不足。远程攻击者可构造包含特制 iframe 元素的恶意网页，诱骗用户访问后，通过该 iframe 绕过浏览器内置的导航限制和弹出窗口阻止策略。成功利用后，攻击者可强制用户浏览器跳转至不受信任的站点或执行非预期的导航操作，从而为后续社工攻击、网络钓鱼或恶意内容投放创造条件。该漏洞无需身份认证，攻击复杂度低，用户只需正常浏览即可触发。"
published = "2021-06-07T20:15:08Z"
remediation = '立即将 Google Chrome 升级至 91.0.4472.77 或更高版本。对于企业环境，可通过 Chrome 管理控制台强制推送更新，或配置 PopupBlocked 策略限制第三方 iframe 弹窗。如无法立即升级，可临时启用 Chrome 的严格弹出窗口拦截模式（chrome://settings/content/popups），将弹出窗口策略设置为"不允许网站显示弹出窗口"，以减少被利用风险。'
score = 6.5
severity = "MEDIUM"
sources = ["kev"]
title = "Google Chrome 弹出窗口阻止程序导航限制绕过漏洞"
updated = "2026-06-17T03:50:24Z"

