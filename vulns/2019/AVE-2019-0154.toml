[basic]
description = "tags.<value>Employee Records System 1.0 的 uploadimage.php 存在不安全文件上传漏洞，仅在客户端对文件扩展名进行校验，攻击者可通过修改全局脚本 global.js 绕过限制，上传并执行任意 PHP 代码。攻击者需具备登录权限，通过上传恶意 PHP 文件实现远程代码执行，可获取服务器控制权。该漏洞影响 Employee Records System 1.0 版本，CVSS 评分为 7.2，属于高危级别。CWE 编号为 CWE-434（不受限制的文件类型上传）。"
published = "2020-01-09T22:15:13.223"
remediation = '立即升级至 Employee Records System 最新版本（若厂商已发布补丁），或迁移至经过安全审计的替代人事管理系统。在服务器端强制校验文件扩展名，拒绝上传 .php、.phtml、.php5 等可执行脚本文件，仅允许上传白名单内的安全格式（如 .pdf、.jpg、.png）。在 Web 服务器配置中禁止上传目录（如 /uploads/employees_ids/）执行 PHP 脚本，例如在 nginx 中添加 `location ~ /uploads/.*\.php$ { deny all; }`，或通过 .htaccess 添加 `RemoveHandler .php .phtml .php5`。同时禁用客户端 JavaScript 对文件扩展名的依赖校验，确保服务端为唯一校验入口。'
score = 7.2
severity = "HIGH"
sources = ["nuclei"]
title = "Employee Records System 1.0 不加限制的文件上传漏洞"
updated = "2026-06-17T02:30:10.757"

