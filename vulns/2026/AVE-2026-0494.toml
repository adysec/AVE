[basic]
description = "AnyDesk 屏幕录制文件处理存在链接跟随漏洞（CWE-59），攻击者需先在目标系统上获得低权限代码执行能力，随后通过创建目录 junction 符号链接，利用 AnyDesk 服务在处理屏幕录制文件时对文件路径的验证不足，诱导服务在任意位置创建文件，最终导致系统拒绝服务。该漏洞影响 AnyDesk 多个版本，CVSS 评分 5.5，危害等级中危。"
published = "2026-07-13T22:16:45Z"
remediation = "升级至 AnyDesk 9.7.10 或更高版本（该版本已修复安全漏洞），可通过 AnyDesk 官网下载最新版或使用内置更新功能。由于该漏洞需要攻击者先在目标系统上获得低权限代码执行能力，建议同时限制非授权用户的本地登录权限，并通过组策略或 ACL 控制 AnyDesk 的屏幕录制功能访问。如无法立即升级，可暂时禁用 AnyDesk 的屏幕录制功能作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["zdi"]
title = "AnyDesk 屏幕录制链接追踪拒绝服务漏洞"
updated = "2026-07-14T21:00:36Z"

