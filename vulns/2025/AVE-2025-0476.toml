[basic]
description = "GNU Binutils 的 ld 组件中 xstrdup.c 文件的 xstrdup 函数存在内存泄漏漏洞（CWE-401）。攻击者可通过远程方式利用该漏洞，但攻击复杂度较高且利用难度较大。该漏洞影响 GNU Binutils 2.43 版本，可能导致目标系统内存资源被逐渐耗尽，影响链接器正常运行。目前漏洞细节已公开，厂商建议应用补丁修复，相关泄漏问题已在 binutils master 分支上修复。"
published = "2025-02-10T18:15:34Z"
remediation = "升级 GNU Binutils 至 master 分支最新提交（所有内存泄漏已在 master 修复）。SUSE Linux 用户安装 SUSE-SU-2025:4096-1 更新至 binutils 2.4 版本。如无法立即更新，避免在 ld 链接过程中使用不受信任的输入文件，以降低被利用风险。"
score = 2.3
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils ld 组件 xstrdup 函数内存泄漏漏洞"
updated = "2026-06-17T08:38:28Z"

