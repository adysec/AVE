[basic]
description = "ISC DHCP 客户端 dhclient 在处理 DHCP 服务器返回的响应时，未对选项字段中的 shell 元字符进行正确过滤，存在命令注入漏洞。远程攻击者可通过搭建恶意 DHCP 服务器或在同一广播域中伪造 DHCP 响应，在选项字段（如域名、主机名等）中嵌入 shell 元字符（如反引号、$() 等），当 dhclient 处理这些选项并调用外部脚本时触发命令执行，导致攻击者能够以 root 权限在目标系统上执行任意命令。该漏洞影响 ISC DHCP 客户端全系列版本，CVSS 评分 10.0，危害等级严重。"
published = "2000-06-24T04:00:00Z"
remediation = '立即升级 ISC DHCP 客户端至 2.0pl3 及以上版本（2.x 系列）或 3.0b1pl17 及以上版本（3.x 系列）。FreeBSD 用户应升级至 4.1-RELEASE 或更新版本；NetBSD 用户应应用 2000/07/08 发布的补丁并重新编译 dhcp 组件；Debian 用户应更新至已修复的 dhcp 软件包。如无法立即升级，可在 /etc/rc.conf 中将 ifconfig 配置从 "DHCP" 改为静态 IP 地址，并停止 dhclient 进程以消除攻击面。'
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "ISC DHCP 客户端远程代码执行漏洞"
updated = "2026-06-16T21:52:03Z"

