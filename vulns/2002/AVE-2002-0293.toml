[basic]
description = "ReBB 1.0 版本中存在跨站脚本（XSS）漏洞。该漏洞的原理是程序未能对用户输入的 HTML 标签进行严格过滤，导致攻击者可以通过在 `<img>` 标签的 URL 属性中嵌入恶意 JavaScript 脚本来触发漏洞。远程攻击者只需诱导用户访问包含该恶意标签的页面，即可在用户浏览器中执行任意 JS 代码，从而窃取用户的会话 Cookie 或进行其他恶意操作。该漏洞影响 ReBB 1.0 版本，攻击条件为无需身份认证的远程触发。"
published = "2002-08-12T04:00:00Z"
remediation = "建议停止使用已过时的 ReBB 1.0 版本，迁移至现代安全的论坛系统。如必须维持运行，需修改源代码中处理 IMG 标签的解析函数，对 URL 属性进行严格的白名单过滤或 HTML 实体编码，禁止在 URL 路径中包含脚本执行关键字或特殊字符。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "ReBB 1.0 跨站脚本漏洞"
updated = "2026-06-16T21:57:23Z"

