[basic]
description = "Aplio PRO 设备的 authenticate.cgi CGI 程序存在命令注入漏洞。未经身份认证的远程攻击者可通过在密码参数中注入 shell 元字符（如分号、管道符等），向目标系统发送特制 HTTP 请求，使服务端在解析请求时执行任意系统命令。该漏洞影响运行 Aplio PRO 软件的设备，攻击者利用该漏洞可获取服务器敏感信息、篡改数据或进一步控制目标系统，CVSS 评分 7.5，危害等级高。"
published = "2000-12-19T05:00:00Z"
remediation = "如厂商已发布安全补丁，应立即升级 Aplio PRO 至修复 authenticate.cgi 命令注入漏洞的最新版本。若厂商不再提供更新，应在 Web 服务器配置中禁用或删除 authenticate.cgi 脚本，并通过访问控制列表（ACL）或 Web 应用防火墙（WAF）限制对 CGI 目录的远程访问，临时缓解命令注入风险。建议评估替换为仍在支持周期内的同类产品。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Aplio PRO authenticate.cgi 远程代码执行漏洞"
updated = "2026-06-16T21:52:46Z"

