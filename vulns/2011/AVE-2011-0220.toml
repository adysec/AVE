[basic]
description = "Apple iOS 5.0.1 之前版本的 libinfo 组件在处理 DNS 主机名查询时未能正确构造域名查询请求，远程攻击者可通过向目标设备发送特制的 DNS 主机名触发该漏洞，导致敏感信息泄露。该漏洞影响 Apple iOS 3.0 至 5.0 版本，攻击者无需身份认证即可利用，CVSS 评分 4.3，危害等级中危。Apple 已在 iOS 5.0.1 更新中修复此漏洞。"
published = "2011-11-11T18:55:01Z"
remediation = "升级 Apple iOS 至 5.0.1 或更高版本（参考苹果安全公告 http://support.apple.com/kb/HT5052），该更新修复了 libinfo 组件中 DNS 域名查询处理不当导致的信息泄露漏洞。如无法立即升级，可在受影响的 iOS 设备上限制不可信网络接入，避免连接恶意 DNS 服务器，并禁用自动 DNS 查询功能作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iOS libinfo 信息泄露漏洞"
updated = "2026-06-16T23:33:17Z"

