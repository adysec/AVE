[basic]
description = "tags.<value>mICQ 客户端 0.4.6 及更早版本存在缓冲区溢出漏洞。远程攻击者可通过发送包含超长 Description 字段的特制消息，利用该漏洞造成拒绝服务攻击，并可能执行任意命令。该漏洞影响所有使用 mICQ 0.4.6 及更早版本的用户，攻击无需身份认证，利用门槛低，危害等级严重。"
published = "2001-03-26T05:00:00.000"
remediation = "mICQ 项目已长期停止维护，无官方补丁版本。建议立即停用 mICQ 0.4.6 及更早版本，迁移至现代维护中的即时通讯客户端（如 Pidgin、Gajim 或官方 ICQ 客户端）。若必须暂时保留，请在防火墙层面限制 mICQ 监听端口仅允许受信任 IP 访问，并禁用 Description 字段接收超长数据的解析逻辑。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "mICQ micq客户端 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:53:55.893"

