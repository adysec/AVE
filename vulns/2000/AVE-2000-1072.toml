[basic]
description = "FreeBSD 4.1.1 及更早版本中的 getnameinfo 函数存在缓冲区处理缺陷，当该函数处理超长 DNS 主机名时，会触发内存访问异常，导致服务进程崩溃。远程攻击者无需身份认证即可通过向目标系统发送特制的 DNS 查询响应来触发此漏洞，造成拒绝服务。该漏洞影响 FreeBSD 4.x 系列系统，CVSS 评分 5.0，属于中等危害等级。"
published = "2000-12-11T05:00:00.000"
remediation = """
The user wants me to generate a remediation field for CVE-2000-1066. Let me analyze the available information:

1. CVE-2000-1066: FreeBSD 4.0/4.1/4.1.1 DNS getnameinfo 拒绝服务漏洞
2. The getnameinfo function in FreeBSD 4.1.1 and earlier allows remote attacker to cause DoS via long DNS hostname
3. CVSS 5.0 (MEDIUM)
4. FreeBSD-SA-00:63 is the security advisory
5. Patch available at: ftp://ftp.FreeBSD.org/pub/FreeBSD/CERT/advisories/FreeBSD-SA-00:63.getnameinfo.asc

The remediation should be in Chinese, ≥20 characters, with specific actionable steps. Let me write a good one.升级 FreeBSD 至 4.2 或更高版本，该漏洞已在 FreeBSD-SA-00:63 公告中修复。如无法升级，可从 ftp://ftp.FreeBSD.org/pub/FreeBSD/CERT/advisories/FreeBSD-SA-00:63.getnameinfo.asc 获取补丁，在受影响系统上执行 `patch < /path/to/patch` 后重新编译内核并重启。临时缓解措施可在边界防火墙上限制 DNS 响应包大小，过滤超长主机名响应。"""
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "FreeBSD 4.0/4.1/4.1.1 DNS getnameinfo 拒绝服务漏洞"
updated = "2026-06-16T21:53:05.037"

