[basic]
description = "Leif M. Wright 开发的 simplestguest.cgi 2.0 版本留言板程序存在远程命令执行漏洞。该 CGI 程序在处理 guestbook 参数时未对用户输入进行过滤，未经身份认证的远程攻击者可通过在参数中注入 shell 元字符（如分号、管道符、反引号等）拼接恶意系统命令，进而在服务器端执行任意指令。由于该程序通常部署于 Web 服务器（如 Apache）的 CGI 目录下，攻击者可直接通过 HTTP 请求远程利用，无需认证且攻击复杂度低。该漏洞影响运行 simplestguest.cgi 2.0 的 Web 服务器，成功利用可导致攻击者完全控制目标服务器，包括读取敏感文件、修改网页内容、植入后门等，危害等级为严重。"
published = "2001-02-12T05:00:00Z"
remediation = '升级到 simplerguest.cgi 或已验证修复的 CGI 处理脚本；修改 guestbook 参数验证逻辑，使用 prepared statements 或 parameterized queries 过滤 shell 元字符；限制 CGI 执行用户权限为非 root；部署 WAF 规则过滤包含管道符 "|"、";、"等危险字符的 HTTP 请求；定期应用安全补丁并审计文件权限设置。'
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Leif M. Wright simplestguest.cgi 远程命令执行漏洞"
updated = "2026-06-16T21:53:30Z"

