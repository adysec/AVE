[basic]
description = "FUDforum 论坛软件的 admbrowse.php 脚本存在文件修改漏洞，未经身份认证的远程攻击者可通过在 cur 和 dest 参数中传递 URL 编码的文件路径，在服务器上创建或删除任意文件。该漏洞影响 FUDforum 1.2.8、1.9.8、2.0.2 及更早版本，攻击者仅需向目标系统发送特制的 HTTP 请求即可利用，无需账号凭据或复杂的交互条件，成功利用可导致网站文件被篡改或删除，进而影响论坛正常运行。建议升级至 FUDforum 2.2.0 或更高版本以修复此漏洞。"
published = "2003-04-11T04:00:00Z"
remediation = "立即升级到FUDforum 2.2.0或更高版本，应用官方安全补丁；如无法立即升级，可通过.htaccess文件禁用admbrowse.php功能，并限制用户在web根目录之外的写入权限作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "FUDforum admbrowse.php 任意文件创建删除漏洞"
updated = "2026-06-16T21:59:17Z"

