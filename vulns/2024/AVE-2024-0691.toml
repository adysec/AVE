[basic]
description = "Linux 内核 BPF 子系统在释放 cgroup 存储（cgroup storage）时存在死锁漏洞。由于 `bpf_cgrp_storage_get` 在 map 释放路径中未正确传递繁忙计数器，导致在持有 local_storage 锁的情况下递归获取同一锁，形成死锁。本地低权限攻击者可通过加载特制的 BPF 程序（fentry 挂载到 cgroup_storage_ptr、tp_btf 触发存储访问）触发该条件，造成系统拒绝服务。该漏洞影响 Linux 内核中引入 BPF cgroup storage 的版本，CVSS 评分 5.5，危害等级中危。"
published = "2025-03-12T10:15:16Z"
remediation = "立即升级 Linux 内核至以下已修复版本：6.6.80、6.12.17、6.13.5 或 6.14 及以上。对应修复提交为 c78f4afbd962、fcec95b4ab3e、fac674d2bd68、6ecb9fa14eec。RHEL 9 用户安装 RHSA-2025:20518 更新，SUSE Linux Enterprise 15 用户安装 SUSE-SU-2025:01964-1/01614-1/01951-1 更新。临时缓解措施：限制非特权用户加载 BPF 程序（kernel.unprivileged_bpf_disabled=1）。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Kernel BPF 释放 cgroup 存储时死锁漏洞"
updated = "2026-06-17T08:14:36Z"

