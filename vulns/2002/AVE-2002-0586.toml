[basic]
description = "Kerio MailServer 5.0 和 5.1 的 Web Mail 模块存在多个跨站脚本（XSS）漏洞。未经身份认证的远程攻击者可通过构造包含恶意 HTML/JavaScript 代码的特制 URL，诱使已登录 Web Mail 的用户点击该链接，从而在受害者浏览器中以其他用户身份执行脚本。该漏洞影响 Kerio MailServer 5.0/5.1/5.1.1 的 Web Mail 功能，攻击者利用此漏洞可窃取用户会话 Cookie、劫持账户权限或篡改邮件内容，对邮件系统数据安全构成严重威胁。攻击者无需预先获取账户凭据，仅需发送恶意链接诱导用户点击即可实现攻击，利用门槛较低且影响范围较广。"
published = "2003-04-11T04:00:00Z"
remediation = "将 Kerio MailServer 升级至 6.0 或更高版本（该版本对 Web Mail 模块输入参数进行了 HTML 特殊字符过滤与输出编码修复）。如暂时无法升级，应在 Web Mail 前端部署反向代理（如 Apache 或 Nginx），对 URL 参数中的 script、alert 等关键词进行拦截过滤，同时禁用 Web Mail 模块的 URL 日志功能以防止 XSS 载荷被记录并二次触发。"
score = 6.8
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Kerio MailServer Web Mail 跨站脚本漏洞"
updated = "2026-06-16T21:59:19Z"

