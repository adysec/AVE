[basic]
description = "rsync 2.3.2、2.4.6 及更早版本的 I/O 函数中存在符号错误（有符号数与无符号数混用），远程攻击者无需身份认证即可向目标 rsync 客户端或服务器发送特制数据包触发该漏洞，导致拒绝服务或任意代码执行。该漏洞 CVSS 评分 10.0，危害等级严重，影响所有运行受影响 rsync 版本的系统。"
published = "2002-02-27T05:00:00.000"
remediation = '立即升级 rsync 至 2.5.7 或更高版本，该版本修复了 I/O 函数中的符号数错误导致的堆溢出问题。如运行 rsync daemon 且无法立即升级，可在 rsyncd.conf 中设置 "use chroot = yes" 并限制 daemon 仅允许受信任客户端连接，同时在防火墙层面限制对 873 端口的访问。'
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "rsync I/O函数符号错误远程代码执行漏洞"
updated = "2026-06-16T21:56:39.497"

