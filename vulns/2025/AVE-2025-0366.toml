[basic]
description = "Samsung Account 应用（版本 15.5.01.1 之前）存在授权不当漏洞。本地攻击者无需身份认证即可利用该漏洞，以 Samsung Account 权限启动任意 Activity，可能导致应用功能被非授权调用或服务异常。该漏洞攻击复杂度低，无需用户交互，但需要本地访问权限。CVSS 评分 4.0，危害等级中危。用户应将 Samsung Account 更新至 15.5.01.1 或更高版本以修复此漏洞。"
published = "2025-12-02T02:15:48Z"
remediation = '立即将 Samsung Account 升级至 15.5.01.1 或更高版本，可通过 Galaxy Store 或系统设置中的应用更新模块执行升级。如无法立即更新，可在设置中限制 Samsung Account 的权限，仅授予必要权限，并关闭"允许未知来源活动"选项以降低本地攻击面。'
score = 4
severity = "MEDIUM"
sources = ["zdi"]
title = "Samsung Samsung Account 授权不当漏洞"
updated = "2026-06-17T09:44:33Z"

