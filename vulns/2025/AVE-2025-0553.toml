[basic]
description = "这是 Google Chrome V8 引擎中的类型混淆漏洞，攻击者通过精心构造的 HTML 网页触发类型混淆漏洞，导致堆内存破坏并可能实现远程代码执行。该漏洞影响所有低于 142.0.7444.59 版本的 Chrome 浏览器，任何用户无需身份验证即可访问恶意网页，但需要用户交互。该漏洞可让攻击者完全控制受害者的浏览器进程，实现读取、修改或删除任意内存数据，直接危害用户的数据和隐私安全。CVSS 评分 8.8，属于高危严重漏洞。谷歌已在 2025 年 11 月的安全更新中修复此问题，用户应及时更新至最新版本以获取保护。"
published = "2025-11-18T00:15:47Z"
remediation = "立即升级 Google Chrome 至 142.0.7444.59 或更高版本（通过菜单→帮助→关于 Google Chrome 自动更新）。若暂时无法升级，可在设置→隐私和安全→网站设置→JavaScript 中禁用 JavaScript，或仅允许受信任站点运行脚本作为临时缓解措施，并避免访问不明链接。企业用户可通过组策略强制推送 Chrome 更新策略至所有终端。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 类型混淆漏洞"
updated = "2026-06-17T08:33:43Z"

