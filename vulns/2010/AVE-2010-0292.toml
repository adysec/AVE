[basic]
description = "标签之间。<value>WebKit 在处理 SVG 文本元素的 `:first-letter` 和 `:first-line` 伪元素时存在未初始化内存访问漏洞。该漏洞影响 Apple Safari 5.0.1 之前版本（覆盖 Mac OS X 10.4 至 10.6 及 Windows 平台）以及 WebKitGTK 1.2.6 之前版本。未经身份认证的远程攻击者可通过构造包含恶意 SVG 文档的特制网页，诱骗用户使用受影响浏览器访问，触发未初始化内存读取，进而导致远程代码执行或应用程序崩溃拒绝服务。攻击复杂度中等，无需交互即可造成严重危害。"
published = "2010-07-30T20:30:02Z"
remediation = "将 Safari 浏览器升级至 5.0.1（Mac OS X 10.5/10.6 及 Windows）或 4.1.1（Mac OS X 10.4），该版本已修复 WebKit 在处理 SVG 文本元素的 :first-letter 和 :first-line 伪元素时的未初始化内存访问漏洞。Mac OS X 用户可通过 Apple 官方软件更新或 Safari 浏览器内置更新机制完成升级；Windows 用户可前往 Apple 官网下载最新版 Safari 安装包。如暂时无法升级，建议临时禁用 Safari 的 WebKit 渲染引擎对 SVG 文档的支持，或避免访问不受信任的网站，以降低远程攻击者利用该漏洞执行任意代码或导致应用程序崩溃的风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 未初始化内存访问远程代码执行漏洞"
updated = "2026-06-16T23:19:19Z"

