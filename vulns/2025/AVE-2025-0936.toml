[basic]
description = "Linux 内核网络调度器（net: sched）在处理队列规则（qdisc）替换操作时存在 use-after-free 漏洞。当攻击者使用 tc qdisc replace 命令将子 qdisc 从一个父 qdisc 移动到另一个父 qdisc 时，内核未正确处理引用计数与父子关系，导致同一 qdisc 被两个不同 class 同时引用，且引用计数异常增加。删除相关 class 时会触发对已释放内存的引用，攻击者可利用此漏洞实现本地权限提升。该漏洞影响 Linux 内核，攻击者需要本地低权限访问，通过构造特定的 tc 命令序列即可触发利用。"
published = "2025-02-13T12:15:27Z"
remediation = "升级 Linux 内核至包含补丁 commit 46c59ec33ec9 的稳定版本：5.4.291、5.10.235、5.15.179、6.1.129、6.6.76、6.12.13 或 6.13.2 及以上。Ubuntu 用户可通过 apt 升级到 24.04 的 6.8.0-58.60、22.04 的 5.15.0-138.148 或 20.04 的 5.4.0-214.234 内核包，并重启系统使修改生效。如暂时无法升级内核，可通过取消非必要 tc qdisc replace 操作或限制能执行 tc 命令的本地用户权限作为临时缓解措施，防止本地提权。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核网络调度器 Use-After-Free 漏洞"
updated = "2026-06-17T08:44:03Z"

