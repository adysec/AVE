[basic]
description = "Nautilus 1.0.4 及更早版本的文件管理器中，.nautilus-metafile.xml 元数据文件处理存在符号链接攻击漏洞。本地攻击者可通过创建恶意符号链接，诱使 Nautilus 在处理元数据时覆盖系统任意文件，导致权限提升或敏感数据破坏。攻击条件要求攻击者拥有本地用户权限，无需交互即可触发。"
published = "2002-05-16T04:00:00Z"
remediation = "升级 Nautilus 至 1.0.5 或更高版本。对于现代 GNOME 桌面环境，确保系统已更新至最新版本（GNOME 40+），该漏洞已在后续版本中修复。如无法升级，避免在多用户系统上使用 Nautilus 管理共享目录，并限制本地用户对 .nautilus-metafile.xml 文件的写入权限。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "GNOME Nautilus 符号链接攻击任意文件写入漏洞"
updated = "2026-06-16T21:56:54Z"

