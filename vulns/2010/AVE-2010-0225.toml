[basic]
description = "Adobe Flash Player 9.0.289.0之前版本及10.x系列10.1.102.64之前版本存在未指定的内存破坏漏洞。远程攻击者可通过诱导用户访问特制的SWF文件或网页，触发内存损坏，成功利用后可导致应用程序崩溃（拒绝服务）或实现任意代码执行。该漏洞影响Windows、Mac OS X、Linux、Solaris及Android平台，CVSS评分9.3，危害严重。Adobe已于2010年11月发布安全更新修复此漏洞。"
published = "2010-11-07T22:00:02Z"
remediation = "立即将 Adobe Flash Player 升级至 9.0.289.0 及以上版本（9.x 分支）或 10.1.102.64 及以上版本（10.x 分支）。由于 Adobe Flash Player 已于 2020 年底停止支持并结束生命周期，建议彻底卸载 Flash Player 组件，并在浏览器中禁用 Flash 插件，改用 HTML5 替代方案以彻底消除风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:23:13Z"

