[basic]
description = "Atlassian Jira 的 /rest/api/2/user/picker REST 资源存在授权检查不正确漏洞，未经身份认证的远程攻击者可利用该缺陷枚举系统中的有效用户名。该漏洞影响 Jira 7.13.3 之前版本、8.0.0 至 8.0.4 之前版本以及 8.1.0 至 8.1.1 之前版本。攻击者无需任何凭据即可通过向目标服务器发送特制请求获取用户名列表，为后续暴力破解或定向攻击提供信息基础。该漏洞 CVSS 评分为 5.3，危害等级为中危。"
published = "2019-05-22T18:29:00.833"
remediation = "建议立即升级 Jira 到 7.13.3、8.0.4 或 8.1.1 及以上版本。若无法立即升级，可在反向代理层面拦截 /rest/api/2/user/picker 接口的匿名访问，或在 Jira 全局权限中移除「浏览用户」权限的匿名用户授予，防止用户名枚举。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "Atlassian Jira 用户名枚举漏洞"
updated = "2026-06-17T02:35:06.473"

