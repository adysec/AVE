[basic]
description = "Allaire JRun 2.3 服务器中的 SSIFilter servlet 存在目录遍历漏洞，远程攻击者无需身份认证即可通过构造包含特殊路径序列（如 `../`）的 HTTP 请求，绕过路径限制读取服务器上的任意文件，导致敏感信息泄露。该漏洞攻击复杂度低，仅需网络访问即可利用，影响 JRun 2.3 版本。"
published = "2000-12-11T05:00:00.000"
remediation = "建议立即升级 Allaire JRun 至 2.3.3 版本或更高版本，官方已在该版本修复 SSIFilter 目录遍历漏洞。若暂时无法升级，可在 Web 服务器层面配置访问控制规则，禁止对 SSIFilter servlet 的直接访问路径，或在防火墙层面限制对 JRun 服务端口的非信任来源访问，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Allaire JRun 2.3 SSIFilter Servlet 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:53:03.347"

