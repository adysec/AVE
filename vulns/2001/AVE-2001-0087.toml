[basic]
description = "ROADS 2.3 版本的 search.pl 程序存在文件泄露漏洞。该程序未对表单参数中的文件名输入进行充分过滤，远程攻击者可通过在文件名后附加空字节截断符的方式绕过文件访问验证，从而读取服务器上的任意文件内容。攻击者无需身份认证即可在未授权的情况下获取敏感系统文件，如配置文件、密码文件等，造成信息泄露。该漏洞影响 Martin Hamilton ROADS 2.3 版本，CVSS 评分 5.0，危害等级为中等。攻击者只需向目标系统的 search.pl 程序发送构造的 HTTP 请求即可触发漏洞，实现任意文件读取。"
published = "2001-06-02T04:00:00Z"
remediation = "立即升级 ROADS 至最新稳定版本（2.4 或更高版本），以修复 search.pl 的空字节截断漏洞。如官方未发布补丁，建议临时移除或禁用 search.pl 脚本，并在 Web 服务器配置（如 Apache 的 .htaccess 或 nginx 配置）中添加规则，拒绝包含 %00 或空字节字符的请求。同时限制 search.pl 的目录访问权限，使用 chroot 或 open_basedir 限制其仅能读取 Web 根目录下的文件。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Martin Hamilton ROADS 2.3 任意文件读取漏洞"
updated = "2026-06-16T21:53:53Z"

