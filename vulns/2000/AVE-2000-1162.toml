[basic]
description = "Oracle Internet Application Server (IAS) 3.0.7 及更早版本中，端口监听器与 modplsql 组件的默认配置存在 PL/SQL 注入漏洞。远程攻击者无需身份认证即可通过向目标系统发送特制的 HTTP 请求访问数据库访问描述符文件，从而获取数据库中的敏感信息。该漏洞影响 Oracle IAS 3.0.7 及之前版本，CVSS 评分 5.0，危害等级中危。建议升级至最新版本或修改默认配置以限制对 DAD 文件的访问。"
published = "2000-12-31T05:00:00Z"
remediation = "升级 Oracle IAS 至 3.0.7 之后的安全版本，或安装 Oracle 官方发布的对应补丁（参考 SecurityFocus BID 2150）。如无法升级，在 Apache 配置中禁用 modplsql 模块，或限制 DAD 文件目录的 HTTP 访问权限，仅允许受信 IP 访问 PL/SQL 网关。同时在网络层面配置防火墙，限制对 7778 等默认监听端口的公网访问。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Oracle Internet Application Server PL/SQL注入漏洞"
updated = "2026-06-16T21:53:26Z"

