[basic]
description = "Raptor GFX 配置工具中的 pgxconfig 组件存在符号链接攻击漏洞。本地攻击者可通过创建恶意符号链接，诱使 pgxconfig 以高权限访问并覆写任意系统文件，从而获取 root 权限。该漏洞利用条件为攻击者拥有本地访问权限，无需交互即可触发，CVSS 评分 7.2，危害等级高。受影响系统包括运行 Raptor GFX 配置工具的 Linux 发行版。"
published = "2000-10-20T04:00:00Z"
remediation = "删除 pgxconfig 的 setuid 位：`chmod u-s /usr/bin/pgxconfig`，或限制仅授权用户可执行：`chmod 750 /usr/bin/pgxconfig`。如厂商已发布补丁，升级 Raptor GFX 到最新版本。作为临时缓解，移除该工具的 SUID 权限可阻断提权路径。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Raptor GFX pgxconfig 本地权限提升漏洞"
updated = "2026-06-16T21:52:17Z"

