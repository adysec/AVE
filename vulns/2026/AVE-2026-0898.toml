[basic]
description = "LightRAG 存在跨域资源共享（CORS）配置不当漏洞（CWE-942）。服务器默认将 `CORS_ORIGINS` 设置为通配符 `*`，同时启用了 `allow_credentials=True`，导致 Starlette 的 CORSMiddleware 在预检响应中回显请求来源而非返回 `*`，使得任意来源均可发起携带凭据的跨域请求。已登录 LightRAG 的用户在访问恶意网站时，攻击者可静默执行经过身份认证的 API 请求，窃取文档和知识图谱数据，或执行删除文档库等破坏性操作。该漏洞影响 LightRAG 1.5.4 之前的所有版本，CVSS 评分 9.3，危害等级严重。官方已在 1.5.4 版本中修复此漏洞。"
published = "2026-07-15T15:16:48Z"
remediation = "立即升级 LightRAG 至 v1.5.4 或更高版本（https://github.com/HKUDS/LightRAG/releases/tag/v1.5.4），该版本已修复 CORS 通配符与凭据同时启用的问题。如无法立即升级，在环境变量中将 CORS_ORIGINS 设为具体可信域名列表（如 CORS_ORIGINS=https://yourdomain.com），切勿设为 * 或同时启用 allow_credentials=True。"
score = 9.3
severity = "CRITICAL"
sources = ["ghsa"]
title = "LightRAG CORS 通配符与凭据认证配置不当漏洞"
updated = "2026-07-15T18:15:13Z"

