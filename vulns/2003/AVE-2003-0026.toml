[basic]
description = "MIT Kerberos 5（krb5）密钥分发中心（KDC）组件存在堆内存损坏漏洞，影响 1.2.7 及更早版本。攻击者在获取同一 Kerberos 域内任意有效凭据完成身份认证后，可向 KDC 发送特制协议请求，触发堆缓冲区下溢（buffer underrun），导致 KDC 进程崩溃而拒绝服务，进而影响整个域内用户的身份认证服务。该漏洞利用网络可达性进行攻击，攻击复杂度低，无需额外权限即可造成服务中断。Red Hat 已将该漏洞评级为重要级别，CVSS 评分为 5.0，建议升级至 1.3 或更高版本进行修复。"
published = "2003-04-02T05:00:00Z"
remediation = "升级 MIT Kerberos 5 至 1.3 及以上版本，或应用 MIT 官方补丁（http://web.mit.edu/kerberos/www/advisories/MITKRB5-SA-2003-005-patch.txt）。Red Hat 用户安装 RHSA-2003-051/052/091 提供的更新包；Debian 用户安装 DSA-266 提供的 krb5 更新包。如无法立即升级，在 KDC 上限制仅受信任主机可访问 Kerberos 服务端口 88 作为临时缓解。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "MIT Kerberos 密钥分发中心堆损坏拒绝服务漏洞"
updated = "2026-06-16T22:01:29Z"

