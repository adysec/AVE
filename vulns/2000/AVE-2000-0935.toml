[basic]
description = "Check Point Firewall-1 在启用 RSH/REXEC 服务时存在安全绕过漏洞。由于防火墙未能正确验证 RSH/REXEC 连接请求的格式，远程攻击者可通过发送特制的畸形连接请求绕过访问控制规则，直接与受保护的 RSH/REXEC 客户端建立连接，从而获取未授权的远程 shell 访问权限。该漏洞影响 Check Point Firewall-1 多个版本，攻击者无需身份认证即可远程利用，可能导致敏感信息泄露、系统被远程控制等严重后果。Check Point 已发布安全公告并提供修复方案。"
published = "2000-10-20T04:00:00.000"
remediation = "升级 Check Point Firewall-1 至已修复该漏洞的版本（如 4.1 SP2 及以上），或在防火墙策略中禁用 RSH/REXEC 服务（默认端口 514/tcp、513/tcp），仅允许受信源 IP 访问该服务，同时限制畸形连接请求的传入。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Checkpoint Firewall-1 RSH/REXEC 安全绕过漏洞"
updated = "2026-06-16T21:52:27.823"

