[basic]
description = "Format Plugins 1.1.2 及更早版本存在基于堆的缓冲区溢出漏洞（CWE-122），攻击者可构造特制恶意文件，诱使目标用户打开该文件后触发溢出，在当前用户上下文中执行任意代码。该漏洞影响使用 Format Plugins 解析文件的系统，攻击者需在目标主机上具备本地访问权限并诱导用户打开恶意文件。由于溢出发生在堆内存区域且成功利用后可达完全权限，CVSS v3.1 评分为 7.8（高危），影响保密性、完整性与可用性。ZDI 编号为 ZDI-26-351，厂商应尽快修复此漏洞。"
published = "2026-06-09T21:17:25Z"
remediation = '请立即将 Adobe Format Plugins 升级至 1.1.3 或更高版本，以修复 usdGltf 插件中基于堆的缓冲区溢出漏洞（CVE-2026-48292）。升级方法：打开 Adobe 桌面应用程序或 Creative Cloud，进入"更新"页面检查并安装 Format Plugins 最新版本；或前往 https://helpx.adobe.com/security/products/formatplugins/apsb26-65.html 下载补丁手动安装。临时缓解措施：避免打开来源不明的 USD 或 glTF 格式文件，禁用系统中不必要的 USD 文件关联程序，直至完成升级。'
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Adobe USD-Fileformat-plugins 基于堆的缓冲区溢出漏洞"
updated = "2026-07-23T09:10:00Z"

