[basic]
description = "Solaris SunOS 5.5.1 至 5.8 版本中的 whodo 工具存在本地缓冲区溢出漏洞。攻击者可通过设置超长的 SOR 或 CFIME 环境变量触发该漏洞，导致缓冲区溢出，从而以当前用户权限执行任意代码。该漏洞需要本地访问权限，无法远程利用，但一旦获得低权限本地访问，即可利用此漏洞提升权限至 root。CVSS 评分 7.2，危害等级高。目前已存在公开的利用代码（ExploitDB 20974），建议用户升级到不受影响的 Solaris 版本或应用厂商补丁。"
published = "2001-07-05T04:00:00Z"
remediation = "该漏洞影响已停止支持的 Solaris SunOS 5.5.1~5.8 系统，Oracle 已不再为这些版本发布安全补丁。建议立即升级到受支持的 Solaris 11.4 或更新版本。如无法升级，可移除 whodo 的 setuid 权限（chmod u-s /usr/bin/whodo）以消除提权风险，同时严格限制本地用户登录权限，并通过 SOR 和 CFIME 环境变量长度检查脚本作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Sun Solaris whodo 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:55:32Z"

