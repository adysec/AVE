[basic]
description = "QNX 实时操作系统的 ptrace 系统调用存在权限控制缺陷，普通程序能够附加到具有特权的系统进程。该漏洞影响 QNX RTOS 4.25 和 6.1.0 版本。在本地攻击场景下，低权限用户可利用此缺陷通过 ptrace 附加并修改运行中的特权进程，进而执行任意代码，完全控制系统。由于攻击需本地访问权限，CVSS 评分为 7.2，危害等级较高。"
published = "2002-12-31T05:00:00Z"
remediation = "将 QNX RTOS 6 升级至 6.4.0 或更高版本，该版本已修复 ptrace() 系统调用未限制附加到特权进程的漏洞。如无法立即升级，可通过在系统配置中禁止或限制非特权用户使用 ptrace() 附加到 setuid/setgid 程序作为临时缓解措施，例如修改进程启动策略或禁用不必要的调试接口。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "QNX 实时操作系统 ptrace() 任意代码执行漏洞"
updated = "2026-06-16T22:00:32Z"

