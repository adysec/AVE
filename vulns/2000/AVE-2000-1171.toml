[basic]
description = "Apache JServ 1.1.2 的 jserv.conf 配置文件中，jserv-status 处理器默认仅允许来自 127.0.0.1 的访问请求。由于配置不当，本地用户可直接访问 jserv/ URI 路径， thereby 绕过身份验证并获取敏感信息，如 JDBC 数据库密码、配置参数及其他运行时的关键数据。该漏洞影响 Apache JServ 1.1.2 版本，攻击条件为攻击者已具备本地访问权限，利用方式为直接向目标主机的 jserv-status 接口发送 HTTP 请求以读取敏感配置。CVSS v2 评分为 5.0，危害等级中等，可能导致数据库凭证泄露及后续横向渗透。"
published = "2011-10-05T02:56:24Z"
remediation = '修改 jserv.conf 中 <Location /jserv/> 段的访问控制规则，将 "allow from 127.0.0.1" 替换为仅允许受信任的管理员 IP 地址，例如 "allow from 192.168.1.0/24"，同时将 "order deny,allow" 调整为 "order allow,deny" 配合 "deny from all" 实现默认拒绝策略；如不需要 JServ 状态监控功能，直接在 jserv.conf 中注释或删除整个 <Location /jserv/> 段落以彻底禁用 jserv-status 处理器；升级 Apache JServ 至不含此默认配置缺陷的安全版本，并应用 Apache 官方发布的补丁（参考 http://archive.apache.org/dist/java/java.apache.org-www.tar.gz）；审查 jserv.properties 中的 JDBC 密码及其他初始化参数，确保敏感凭据不在状态页面中暴露，必要时将密码移至外部加密配置文件并限制文件权限为仅 JServ 进程用户可读。'
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "Apache JServ jserv-status 敏感信息泄露漏洞"
updated = "2026-06-16T21:53:27Z"

