[basic]
description = "Oracle 8.1.7 中 oidldapd 2.1.1.1 组件将日志文件记录在 ldaplog 目录下，该目录权限配置不当（world-writable），导致本地攻击者可通过符号链接攻击删除日志文件或覆盖其他文件。该漏洞影响 Oracle 8.1.7 版本，攻击者需具备对服务器的本地访问权限才能利用，成功利用可导致文件完整性破坏，进而影响系统安全审计与正常运行。"
published = "2001-06-02T04:00:00Z"
remediation = "建议升级至 Oracle Internet Directory v2.1.1（包含于 Oracle 8.1.7 8i Release 3 Server Media Pack），并下载 Oracle 官方补丁程序修复 oidldapd 日志目录权限问题。同时执行以下缓解措施：使用 chmod 将 oidldapd 和 oidmon 可执行文件权限设置为 710（仅限特权用户访问）；将 ldaplog 日志目录权限由 world-writable 修改为 750 或 700，移除其他用户的写权限；通过符号链接将日志输出重定向至安全目录，防止本地用户通过软链接覆盖关键系统文件。如无法立即升级，建议临时限制对 Oracle LDAP 服务的本地访问权限。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Oracle oidldapd 符号链接攻击文件覆盖漏洞"
updated = "2026-06-16T21:54:03Z"

