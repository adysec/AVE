[basic]
description = "Alt-N MDaemon 3.1.1 及更早版本的 WebConfig 组件存在堆溢出漏洞。远程攻击者无需身份认证即可通过向 WebConfig 发送特制的超长 URL 请求触发堆缓冲区溢出，导致目标服务崩溃造成拒绝服务，在特定条件下还可执行任意命令。该漏洞影响 MDaemon 3.1.1 及之前所有版本，CVSS 评分 7.5，危害等级高。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级 Alt-N MDaemon 至 3.1.2 或更高版本，该版本已修复 WebConfig 组件的堆溢出漏洞。如无法升级，可在 Web 服务器或反向代理层限制对 /WebConfig 路径的访问，仅允许受信任 IP 访问管理接口，并对 URL 长度进行限制（建议不超过 1024 字节）以缓解利用风险。鉴于该产品版本已停止维护，建议迁移至仍在安全更新周期内的邮件服务器软件。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Alt-N MDaemon WebConfig 堆溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:59Z"

