[basic]
description = 'AngleSharp HTML 解析器存在 mXSS 安全漏洞。由于 `MathAnnotationXmlElement` 未正确设置 `HtmlTip` 标志，导致 `<annotation-xml encoding="text/html">` 内的内容被当作 MathML 而非 HTML 解析，与浏览器实际解析结果产生差异。同时 `HtmlMarkupFormatter.WriteAttributeValue()` 在序列化属性值时未转义 `<` 和 `>` 字符，使得攻击者可通过构造特制的 MathML 载荷（如嵌入 `<title>` 和 `<img onerror>` 标签）绕过基于 AngleSharp 的 HTML 清理器。当清理器信任 AngleSharp 的解析结果时，序列化输出在浏览器中重新解析会触发 XSS 攻击。该漏洞影响 AngleSharp 库的所有版本，CVSS 评分 5.4，危害等级中危。'
published = "2026-01-01T00:00:00Z"
remediation = "立即将 AngleSharp 升级至 1.5.0 或更高版本（该版本已修复 annotation-xml HTML integration point 的解析缺陷及属性值中 `<` `>` 未转义问题）。可通过 NuGet 执行 `Update-Package AngleSharp -Version 1.5.0` 更新。如无法立即升级，作为临时缓解措施，在使用 AngleSharp 序列化 HTML 后，对输出字符串中的 `<` 和 `>` 字符进行额外转义（替换为 `&lt;` 和 `&gt;`），并避免将 AngleSharp 的序列化输出直接喂给浏览器解析。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "AngleSharp HTML解析器 annotation-xml HTML集成点绕过导致mXSS漏洞"
updated = "2026-01-01T00:00:00Z"

