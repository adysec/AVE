[basic]
description = "Tinyproxy HTTP 代理服务器 1.3.3 及更早版本存在缓冲区溢出漏洞。由于程序在处理超长的 CONNECT 请求时未对输入长度进行充分校验，导致数据写入缓冲区造成堆溢出。未经身份认证的远程攻击者只需向目标代理服务器发送特制的超长 CONNECT 请求，即可触发该漏洞，造成服务崩溃引发拒绝服务，在特定条件下甚至可能以代理进程权限执行任意命令，实现远程代码执行。该漏洞影响 Tinyproxy 1.3.3 及之前的所有版本，CVSS 评分为 10.0，危害等级严重，建议用户尽快升级到已修复的版本。"
published = "2001-03-12T05:00:00.000"
remediation = "立即升级 Tinyproxy 至 1.3.4 或更高版本。Debian 用户应执行 apt-get update && apt-get upgrade tinyproxy 安装 DSA-018 安全更新。如无法升级，可在代理配置中限制 CONNECT 请求方法长度，或在防火墙层面限制仅允许可信源访问代理端口。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Tinyproxy HTTP代理缓冲区溢出漏洞"
updated = "2026-06-16T21:53:42.687"

