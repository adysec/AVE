[basic]
description = "Fastream FTP++ 2.0 服务器在处理 FTP 登录认证时存在缓冲区溢出漏洞。由于对用户名字段长度缺乏有效边界检查，远程攻击者可向 FTP 服务端口发送精心构造的超长用户名数据包，触发栈缓冲区溢出，导致服务进程崩溃造成拒绝服务，并可能进一步利用该漏洞执行任意代码。攻击者无需任何身份认证即可通过网络远程触发，影响系统完整性和机密性。"
published = "2000-11-14T05:00:00.000"
remediation = "Fastream FTP++ 2.0 厂商已停止维护，建议立即升级至最新版本或迁移至其他受支持的 FTP 服务器软件（如 FileZilla Server、ProFTPD）。如无法立即迁移，可在网络边界防火墙限制对 FTP 端口的访问来源 IP，仅允许可信网络连接，并监控异常长度的用户名登录尝试作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Fastream FTP++ 2.0 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:33.477"

