[basic]
description = "PostgreSQL 7.2.1 及 7.2.2 版本中存在安全漏洞，本地攻击者可通过执行 VACUUM 命令删除事务日志（pg_clog）数据，导致数据库数据丢失及拒绝服务。该漏洞源于 VACUUM 操作对事务日志文件的权限检查不足，攻击者需拥有本地操作系统访问权限即可触发，CVSS 评分 7.2，危害等级高。建议升级至 PostgreSQL 7.2.3 或更高版本以修复此漏洞。"
published = "2002-10-03T04:00:00Z"
remediation = "升级 PostgreSQL 至 7.2.3 或更高版本，该漏洞已在 7.2.3 中修复。如无法升级，限制不可信用户对数据库服务器的本地登录权限，仅允许受信任的管理员执行 VACUUM 操作，并定期备份 pg_clog 目录数据以防数据丢失。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "PostgreSQL VACUUM 命令本地拒绝服务漏洞"
updated = "2026-06-16T21:59:42Z"

