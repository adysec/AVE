[basic]
description = "Cyberstop Web Server for Windows 0.1 存在缓冲区溢出漏洞，远程攻击者可通过向目标服务器发送超长的 HTTP GET 请求触发该漏洞，导致服务崩溃（拒绝服务），在特定条件下可能实现任意代码执行。该漏洞影响 Cyberstop Web Server 0.1 版本，攻击无需身份认证，通过网络即可远程利用，危害等级中等。"
published = "2002-05-16T04:00:00Z"
remediation = "Cyberstop Web Server 0.1 已停止维护，官方未发布安全补丁。建议立即停止使用该产品，迁移至受支持的 Web 服务器（如 Apache HTTP Server 或 Nginx）。若无法立即替换，可在防火墙或 WAF 中配置规则，拦截长度超过 1024 字节的 HTTP GET 请求作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Cyberstop Web Server 长请求缓冲区溢出导致拒绝服务漏洞"
updated = "2026-06-16T21:56:59Z"

