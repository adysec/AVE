[basic]
description = "Kentico CMS 9.0.51 之前版本及 10.0.48 之前版本的 CMS 管理后台存在访问控制缺陷。未经身份认证的远程攻击者可直接访问 CMSInstall/install.aspx 安装页面，随后导航至 CMS Administration Dashboard，利用该页面缺乏权限校验的漏洞绕过认证机制，从而获取 Global Administrator 全局管理员权限。攻击者可借此完全控制目标 CMS 系统，执行任意管理操作，包括创建用户、修改站点配置、上传恶意文件等。该漏洞无需任何前置权限或用户交互，攻击复杂度低，危害严重。"
published = "2018-03-23T15:29:00Z"
remediation = "立即升级 Kentico CMS 至 9.0.51 或 10.0.48 及以上版本，该漏洞已在上述版本中修复。如无法立即升级，可删除或重命名 CMSInstall 目录下的 install.aspx 文件，或在 Web 服务器（IIS）层面限制对 CMSInstall/install.aspx 的访问权限，仅允许受信 IP 访问该路径。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Kentico CMS 访问控制漏洞"
updated = "2026-06-17T01:11:33Z"

