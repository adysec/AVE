[basic]
description = "Adobe Flash Player 和 Adobe AIR 存在 URI 解析堆缓冲区溢出漏洞（CWE-119）。当 Flash Player 解析超长或特制的 URL 时，因未对 URL 长度进行充分边界检查，导致堆内存缓冲区溢出。受影响版本包括 Adobe Flash Player 9.0.246.0 之前及 10.x 10.0.32.18 之前的所有版本，以及 Adobe AIR 1.5.2 之前的所有版本，覆盖 Windows、Mac OS X 及 Linux 等多平台。攻击者可通过在恶意网页或 SWF 文件中嵌入超长 URL 路径（如 ExploitDB 公开的 PoC 中构造的数百个连续字符的 URL），诱使用户使用受影响版本的 Flash Player 打开该页面，即可触发堆溢出，导致应用程序崩溃（拒绝服务）或在特定条件下实现任意代码执行，完全窃取用户敏感数据。攻击需用户交互（点击恶意链接），攻击复杂度中等，无需身份认证即可远程发起。CVSS v2 评分为 9.3，危害等级严重。Adobe 已在安全公告 APSB09-10 中发布修复版本，用户应升级至 Flash Player 9.0.246.0 或 10.0.32.18 及更高版本，以及 AIR 1.5.2 或更高版本以消除此漏洞。"
published = "2009-07-31T19:30:00Z"
remediation = "将 Adobe Flash Player 升级至 9.0.246.0 或 10.0.32.18 及以上版本，Adobe AIR 升级至 1.5.2 及以上版本。如无法立即升级，可在浏览器中禁用 Flash 插件或通过组策略限制 Flash 内容的加载与执行作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player URI解析堆缓冲区溢出漏洞"
updated = "2026-06-16T23:08:14Z"

