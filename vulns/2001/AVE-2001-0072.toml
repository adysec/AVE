[basic]
description = 'LocalWEB2000 1.1 HTTP服务器存在目录遍历漏洞。未经身份认证的远程攻击者可通过在HTTP GET请求中发送包含".."（点号）序列的特制URL，绕过目录访问限制读取服务器上的任意文件。该漏洞影响所有使用LocalWEB2000 1.1版本的Web服务器部署，攻击者无需预先获取账户凭据即可在目标系统上执行目录遍历攻击，导致敏感信息泄露。'
published = "2001-03-26T05:00:00Z"
remediation = "建议将 LocalWEB2000 替换为仍在维护的 HTTP 服务器软件，如 Nginx、Apache HTTP Server 或 IIS 等。如短期内无法替换，应在防火墙或访问控制层面严格限制来源 IP，并在服务器配置中禁用对外提供文件目录访问，仅允许访问指定 Web 根目录。此外，建议升级操作系统至最新补丁版本，并定期审计 Web 日志以检测异常访问。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "LocalWEB2000 HTTP服务器 目录遍历漏洞"
updated = "2026-06-16T21:53:50Z"

