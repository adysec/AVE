[basic]
description = "goshs 是一款功能丰富的单二进制文件服务器，广泛应用于红队测试和开发场景。其 2.1.5 版本之前存在路径遍历漏洞（CWE-22），位于 httpserver/updown.go 的多部分上传处理函数中。该函数在处理上传文件名时仅按路径分隔符 `/` 进行分割，但未对 `..` 目录跳转序列进行过滤和拒绝。未经身份认证的远程攻击者可通过构造包含 `..` 的文件名进行上传操作，导致文件被写入到服务目录之外的位置，实现目录穿越攻击。该漏洞影响 goshs 所有低于 2.1.5 的版本，攻击无需任何认证，利用复杂度低，可导致受影响系统的机密性和完整性受损。已在 2.1.5 版本中修复。"
published = "2026-07-28T23:17:10Z"
remediation = '立即将 goshs 升级至 2.1.5 或更高版本，该版本已修复 multipart 上传文件名中路径遍历问题。如无法立即升级，可在应用层对上传文件名进行校验，拒绝包含 ".." 或经清理后为空字符串的文件名，并验证最终解析路径是否在允许的上传目录内。'
score = 6.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "goshs 文件服务器路径遍历漏洞"
updated = "2026-07-30T19:23:14Z"

