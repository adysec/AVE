[basic]
description = "Webmin 0.84及更早版本存在符号链接攻击漏洞，本地用户可通过创建恶意符号链接覆盖并创建任意文件。该漏洞影响Webmin 0.84及之前所有版本，攻击条件为攻击者需具备本地访问权限，利用方式为构造指向目标文件的符号链接，诱导系统写入恶意内容。CVSS评分为1.2，危害等级低。"
published = "2001-03-26T05:00:00.000"
remediation = "立即将 Webmin 升级至 0.85 或更高版本，该版本已修复 symlink 攻击漏洞。升级命令：sudo apt-get upgrade webmin（Debian/Ubuntu）或 sudo yum update webmin（RHEL/CentOS）。升级前建议备份 /etc/webmin 目录及配置文件。临时缓解措施：限制对 Webmin 管理界面的本地访问权限，仅允许受信任的管理员账户登录，并启用防火墙规则限制访问源 IP。"
score = 1.2
severity = "LOW"
sources = ["cve"]
title = "Webmin 文件创建漏洞"
updated = "2026-06-16T21:53:54.667"

