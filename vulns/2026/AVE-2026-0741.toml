[basic]
description = "Windows 打印后台处理程序 (Print Spooler) 存在并发执行时共享资源未正确同步的竞态条件漏洞 (CWE-362)。本地已授权攻击者可通过精心构造的竞争条件操作触发该漏洞，在 Windows Print Spooler 组件中提升本地特权。该漏洞要求攻击者具有登录系统的本地访问权限，并依赖特定的竞争时机，因此攻击条件较高 (AV:L/AC:H/PR:L/UI:N)。成功利用后，攻击者可在系统层级获取完全控制权限，影响系统的机密性、完整性和可用性 (C:H/I:H/A:H)。CVSS 评分为 7.0，危害等级为高危 (HIGH)。此类漏洞常用于本地提权场景，建议及时安装 Microsoft 最新安全更新以修复该漏洞。"
published = "2026-05-12T18:17:08Z"
remediation = '立即安装 Windows 2024 年 10 月累积更新 (KB5043391)，或更新到 Windows 11 版本 23H2；更新到 Windows 10 版本 22H2 的 November 2024 更新 (KB5043382)，这两款更新包含针对 Print Spooler  race 条件漏洞的补丁。如果无法立即更新，可通过注册表禁用 Print Spooler 后台支持处理程序服务 (RpcSs)，路径为 HKLM\SYSTEM\CurrentControlSet\Services\Spooler\Parameters，新增 DWORD 键 "DisableDriverDownload" 值为 1，以阻止攻击者通过驱动加载利用 race 条件。'
score = 7
severity = "HIGH"
sources = ["zdi"]
title = "Microsoft Windows Print Spooler 特权提升漏洞"
updated = "2026-06-17T10:38:54Z"

