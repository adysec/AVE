[basic]
description = "Mozilla Firefox 4.x至11.0、Thunderbird 5.0至11.0及SeaMonkey 2.9之前版本在构造Origin和Sec-WebSocket-Origin HTTP头时存在安全绕过漏洞。远程攻击者可通过跨站XMLHttpRequest或WebSocket连接，利用包含特定零字段的IPv6地址和非标准端口号，绕过基于IPv6字面地址的访问控制列表（ACL），导致敏感信息泄露。该漏洞攻击复杂度较高，需要用户交互配合，CVSS评分2.6，危害等级低。"
published = "2012-04-25T10:10:17Z"
remediation = "升级 Mozilla Firefox 至 12.0 或更高版本，Thunderbird 升级至 12.0 或更高版本，SeaMonkey 升级至 2.9 或更高版本。如无法立即升级，可在网络层面配置防火墙规则，阻止来自非标准端口的跨源 WebSocket 和 XHR 请求，并限制 IPv6 地址中零字段压缩格式的 Origin 头传递。"
score = 2.6
severity = "LOW"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 安全绕过漏洞"
updated = "2026-06-16T23:37:22Z"

