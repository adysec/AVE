[basic]
description = "Coder 远程开发环境平台存在权限绕过漏洞，其 `CreateSubAgent` RPC 接口在持久化工作区应用时未验证请求的应用共享级别是否符合模板配置的 `MaxPortSharingLevel` 上限，导致工作区所有者能够绕过管理员设置的端口共享策略。攻击者若拥有其控制工作区的 agent token，可将子代理应用注册为 `PUBLIC` 级别，即使模板策略限制为 `owner` 级别，从而将应用暴露给未认证用户，造成信息泄露风险。该漏洞仅影响启用 Enterprise 端口共享策略并使用通配符应用主机名的部署环境。Coder 公司已在 v2.29.17、v2.32.7、v2.33.8 和 v2.34.2 版本中修复此问题，用户亦可临时禁用通配符应用主机名 (`CODER_WILDCARD_ACCESS_URL`) 作为缓解措施。"
published = "2026-07-08T01:16:27Z"
remediation = "建议立即将 Coder 升级到以下已修复版本：2.29 系列升级至 v2.29.17，2.32 系列升级至 v2.32.7，2.33 系列升级至 v2.33.8，或 2.34 系列升级至 v2.34.2。升级可通过访问 Coder 设置页面或使用安装程序完成。如无法立即升级，作为临时缓解措施，请禁用通配符应用主机名（将环境变量 CODER_WILDCARD_ACCESS_URL 设置为空或不配置），以阻止基于子域的应用路由，防止未经授权的用户通过通配符域名访问工作区应用。"
score = 5.4
severity = "MEDIUM"
sources = ["ghsa"]
title = "Coder 远程开发环境 子代理应用注册绕过端口共享策略授权漏洞"
updated = "2026-07-08T19:40:36Z"

