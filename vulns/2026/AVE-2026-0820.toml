[basic]
description = "Open WebUI 终端代理路径清理函数 `_sanitize_proxy_path()` 存在路径遍历绕过漏洞。该函数仅对用户输入的路径参数执行最多 8 轮 URL 解码，攻击者可构造 9 层百分号编码的 `../` 序列（如 `%25252E%25252E%25252F`），经 8 轮解码后仍残留编码后的遍历字符，绕过 `posixpath.normpath()` 和 `startswith('..')` 检查，最终由上游服务器解码实现目录穿越。已认证用户利用现有终端连接即可将请求转发至预期路径之外的任意路径，可能导致敏感信息泄露。影响 Open WebUI 0.9.6 至 0.10.0 之前版本，CVSS 评分 7.7，危害等级高。"
published = "2026-07-09T18:16:55Z"
remediation = "立即升级 Open WebUI 至 v0.10.0 或更高版本，该版本修复了 `_sanitize_proxy_path()` 解码深度不足导致的路径遍历绕过问题。如无法立即升级，可在反向代理层（如 Nginx）添加规则拦截包含多层 URL 编码的 `../` 路径请求，或暂时禁用终端代理功能作为临时缓解措施。"
score = 7.7
severity = "HIGH"
sources = ["ghsa"]
title = "Open WebUI 终端代理路径遍历漏洞"
updated = "2026-07-10T02:37:15Z"

