[basic]
description = "Microsoft Windows 的 Adobe Type Manager 库在处理特制的多主字体（Adobe Type 1 PostScript 格式）时存在内存越界写入漏洞。攻击者可构造恶意字体文件，通过诱导用户打开特制文档或在预览窗格中查看等方式触发漏洞，在受影响系统上实现远程代码执行。该漏洞已被检测到在野利用，影响所有受支持的 Windows 版本（Windows 10 除外需用户交互，Windows 10 上利用难度更高）。Microsoft 已于 2020 年 4 月安全更新中修复此漏洞。"
published = "2020-04-15T15:15:16.573"
remediation = "立即安装 Microsoft 2020 年 4 月安全更新：Windows 10 v2004 安装 KB4557957，v1909 安装 KB4549951，v1809/Server 2019 安装 KB4549949，v1803 安装 KB4550922，Windows 7/Server 2008 安装 KB4550964。如无法打补丁，可禁用 WebClient 服务（sc config WebClient start= disabled）并重命名 ATMFD.DLL 为 ATMFD.DLL.bak 作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Adobe Font Manager 库远程代码执行漏洞"
updated = "2026-06-17T02:47:01.610"

