[basic]
description = "Microsoft Power Automate for Desktop 存在代码注入漏洞（CWE-94），由于对用户输入验证不严，攻击者可通过构造特制的自动化流文件诱导用户打开，触发远程代码执行。成功利用此漏洞可导致机密性、完整性和可用性均遭完全破坏。攻击需用户交互，无需身份认证，影响 Power Automate for Desktop 多个版本（2.46 至 2.51 系列及更早版本）。Microsoft 已在 2025 年 1 月安全更新中修复。"
published = "2025-01-14T18:15:31Z"
remediation = "立即将 Microsoft Power Automate for Desktop 升级至 2.52.62.25009 及以上版本。各旧分支对应修复版本：2.46.x→2.46.184.25013、2.47.x→2.47.126.25010、2.48.x→2.48.164.25010、2.49.x→2.49.182.25010、2.50.x→2.50.139.25010、2.51.x→2.51.349.24355。可通过 Microsoft Update 目录或 Power Automate 内置更新通道获取。临时缓解措施：限制用户运行不受信任的 Power Automate 流，并启用 Windows Defender Attack Surface Reduction 规则阻止 Office 应用程序创建子进程。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Power Automate 远程代码执行漏洞"
updated = "2026-06-17T08:42:43Z"

