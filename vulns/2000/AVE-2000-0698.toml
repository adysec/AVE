[basic]
description = "PHP 3.0.16 及 4.0.2 版本中存在格式化字符串漏洞，由于 PHP 未能正确过滤用户注入的格式化字符串参数，当触发特定错误时，格式化字符串内容会被错误地写入错误日志，远程攻击者可通过构造特制的 HTTP 请求触发该漏洞，利用格式化字符串写入特性实现任意代码执行。该漏洞影响 PHP 3.x 及 4.x 系列版本，CVSS 评分 10.0，危害等级严重，攻击者无需身份认证即可远程利用。"
published = "2000-12-19T05:00:00Z"
remediation = "升级 PHP 至修复版本：PHP 4.0.2 升级到 4.0.3pl1 及以上，PHP 3.x 升级到 3.0.18 及以上。各发行版补丁：Red Hat 参考 RHSA-2000:088/RHSA-2000:095，Caldera 参考 CSSA-2000-037.0，Mandrake 参考 MDKSA-2000:062，FreeBSD 参考 FreeBSD-SA-00:75。临时缓解措施：关闭 display_errors，禁止用户输入写入 error_log，以最小权限运行 PHP 进程。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "PHP 3.0/4.0 错误日志格式字符串注入远程代码执行漏洞"
updated = "2026-06-16T21:52:52Z"

