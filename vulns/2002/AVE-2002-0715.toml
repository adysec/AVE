[basic]
description = "TightAuction 3.0 存在信息泄露漏洞，因将包含数据库凭据的 config.inc 文件置于 Web 文档根目录下且访问控制不足，未经身份认证的远程攻击者可直接通过浏览器或 HTTP 请求访问该配置文件，从而获取数据库用户名和密码。该漏洞影响 TightAuction 3.0 版本，攻击条件为目标服务器运行该软件且配置文件路径可预测，无需认证即可完成利用，可能导致数据库敏感信息泄露或后续入侵。"
published = "2002-12-31T05:00:00Z"
remediation = '立即将 config.inc 文件移出 Web 文档根目录至不可通过 URL 直接访问的路径，或通过 Web 服务器配置禁止外部访问 .inc 扩展名文件；若暂时无法移动文件，可将其重命名为 config.inc.php 并添加 .htaccess 规则 "Deny from all" 阻止直接访问，同时立即修改数据库用户名和密码以消除泄露风险。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "TightAuction 3.0 信息泄露漏洞"
updated = "2026-06-16T22:00:14Z"

