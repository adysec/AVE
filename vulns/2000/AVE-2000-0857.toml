[basic]
description = "ISS RealSecure 3.2.1 及 3.2.2 版本存在拒绝服务漏洞，远程攻击者可通过向目标系统发送大量设置了 SYN 标志的分片数据包，导致入侵检测系统资源耗尽而崩溃或无法正常处理后续流量。该漏洞利用门槛低，无需身份认证即可通过网络触发，影响运行 RealSecure 的服务器安全监控能力。厂商已发布安全更新修复此问题。"
published = "2000-10-20T04:00:00.000"
remediation = "升级 ISS RealSecure 至 3.2.3 或更高版本，该版本已修复 SYN 分片洪水导致的拒绝服务问题。若无法升级，可在网络边界防火墙或路由器上配置规则，限制入站 SYN 分片数据包的速率，或部署 IPS 设备检测并拦截异常 SYN 分片流量作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "ISS RealSecure 分片SYN报文洪泛拒绝服务漏洞"
updated = "2026-06-16T21:52:16.817"

