[basic]
description = "Gaim 0.10.3 及更早版本在使用 OSCAR 协议处理即时消息时存在缓冲区溢出漏洞。攻击者通过向目标发送包含超长 HTML 标签的特制消息包即可触发溢出，由于该协议在解析消息内容时未对标签长度进行有效边界检查，溢出的数据可覆盖堆栈上的返回地址。该漏洞影响所有使用 Gaim 作为即时通讯客户端的 Linux/Unix 系统，攻击者无需任何身份认证即可通过网络远程发起利用，成功利用后可导致目标进程崩溃拒绝服务，也可能实现任意代码执行，完全控制受害主机。该漏洞 CVSS 评分 10.0，危害等级严重，建议用户及时升级 Gaim 至修复版本。"
published = "2001-01-09T05:00:00Z"
remediation = "建议立即升级 Gaim 至 0.10.4 或更高版本（现称 Pidgin），该版本修复了 OSCAR 协议处理长 HTML 标签的缓冲区溢出漏洞。若暂时无法升级，可在防火墙层面阻断 AIM/ICQ 服务器连接（端口 5190），或在 Gaim 设置中禁用 OSCAR 协议账号作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Gaim 即时通讯客户端缓冲区溢出漏洞"
updated = "2026-06-16T21:53:18Z"

