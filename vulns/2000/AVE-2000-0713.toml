[basic]
description = "MailFile 1.10 软件中的 mailfile.cgi CGI 程序存在安全漏洞，该程序未能对用户输入的 filename 参数进行充分验证，攻击者可以利用路径遍历攻击技术向目标服务器提交包含任意文件路径的 POST 请求。服务器接受并处理该请求后，会将请求指定的文件内容通过电子邮件发送到攻击者控制的邮箱地址，从而导致敏感文件被未经授权的读取。该漏洞影响广泛，攻击者无需任何身份验证即可远程执行攻击，攻击难度较低，可能会导致系统敏感文件（如配置文件、密码文件等）泄露，影响系统的保密性。微软已发布安全更新修复此漏洞。"
published = "2000-12-19T05:00:00Z"
remediation = "建议立即移除或禁用 mailfile.cgi 脚本，或升级至 Mail File 1.11 及以上版本（若存在）。若无法升级，请在 Web 服务器层面限制对该 CGI 的访问（如 Apache 设置 Deny from all），并实施输入验证过滤 filename 参数中的路径遍历字符（../ 等），同时配置邮件服务器拒绝发送包含敏感文件内容的邮件。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "奥小米 邮件文件 1.10 任意文件泄露"
updated = "2026-06-16T21:52:53Z"

