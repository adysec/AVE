[basic]
description = "Microsoft VM（Java 虚拟机）中的 JDBC（Java 数据库连接）类存在 DLL 加载执行漏洞。远程攻击者可通过诱导用户访问包含恶意 Java Applet 的网页，利用 com.ms.jdbc.odbc.JdbcOdbc 类的构造函数传入以空字符结尾的恶意 DLL 路径，从而在目标系统上加载并执行任意动态链接库（DLL），实现远程代码执行。该漏洞影响 Microsoft VM 5.0.3805 及之前所有版本，攻击无需身份认证，危害严重。"
published = "2002-10-11T04:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS02-052 提供的补丁 (Q329077)。若当前 Microsoft VM 版本低于 5.0.3805，须先升级至 build 3805 再打补丁。由于 Microsoft Java Virtual Machine 已停止支持，强烈建议彻底卸载 Microsoft VM 并迁移至现代 Java 运行时环境（如 OpenJDK），同时在 Internet Explorer 安全设置中禁用 Java Applet 以阻断攻击入口。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft VM JDBC 类远程代码执行漏洞"
updated = "2026-06-16T21:58:17Z"

