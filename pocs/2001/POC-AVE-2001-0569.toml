[info]
author = "ave"
description = "验证目标 PHP-Nuke 4.4 实例是否存在 cookiedecode 函数认证绕过漏洞，通过构造或提取合法用户 cookie 中的认证信息，绕过身份验证机制访问其他用户账户。"
id = "POC-AVE-2001-0569"
name = "PHP-Nuke 4.4 认证绕过漏洞 PoC"
severity = "high"
tags = ["ave-2001-0569"]
vuln_id = [
    "CVE-2001-0001",
    "AVE-2001-0569",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["PHP-Nuke"]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
