[basic]
description = "Microsoft Visual Studio RAD Support 是 FrontPage Server Extensions 的一个子组件，其中 fp30reg.dll 在处理注册请求时存在缓冲区溢出漏洞。未经身份认证的远程攻击者可以通过向目标服务器发送包含超长 URL 的特制注册请求（registration request）触发该溢出，进而在服务器上下文中执行任意命令或代码。该漏洞影响安装了 FrontPage Server Extensions 及 Microsoft Visual Studio RAD Support 的 Windows 服务器平台，攻击者无需任何凭据即可在网络上远程利用，CVSS 评分为 7.5，危害等级为高危。Microsoft 已在 MS03-051 安全公告中发布补丁修复此漏洞。"
published = "2001-07-21T04:00:00Z"
remediation = "安装 Microsoft 安全公告 MS03-051 对应的补丁（Windows 2000 SP2/SP3 适用 KB810217，Windows XP 适用 KB810217，Office XP 适用 KB813380），补丁将移除 fp30reg.dll 中不安全的远程注册功能。如无法立即安装补丁，可在 IIS 管理器中卸载 Internet 信息服务下的「Visual InterDev RAD Remote Deployment Support」组件作为临时缓解措施，或直接卸载 FrontPage Server Extensions 以消除攻击面。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft FrontPage Server Extensions 远程代码执行漏洞"
updated = "2026-06-16T21:54:07Z"

