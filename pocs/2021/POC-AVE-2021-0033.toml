[info]
author = "ave"
description = "AVE-2021-0033 verification"
id = "POC-AVE-2021-0033"
name = "PoC for AVE-2021-0033"
severity = "medium"
tags = ["ave-2021-0033"]
vuln_id = ["AVE-2021-0033"]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/vuln/path"
protocol = "http"

[poc.requests.body]
content = '{"key":"value"}'
