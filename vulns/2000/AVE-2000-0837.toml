[basic]
description = "CVE-2000-1186是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-01-09T05:00:00Z"
remediation = "立即从 Web 服务器目录（通常为 /cgi-bin/）中删除 phf 脚本，并在 Apache httpd.conf 配置文件中注释或移除 ScriptAlias /cgi-bin/ 指令以禁用 CGI 目录执行权限。如系统仍在使用包含该脚本的旧版发行版，建议将 Web 服务器升级至 Apache 1.3.26 或更高版本，并同时升级操作系统至当前受支持的稳定版本。如暂时无法立即升级或移除 phf，可在 iptables 防火墙中配置规则拦截对 /cgi-bin/phf 的外部访问请求，或通过 .htaccess 文件设置 Require all denied 以阻止该脚本被远程调用。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Apache HTTP Server phf CGI 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:20Z"

