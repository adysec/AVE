[basic]
description = "PHP 4.x 至 4.2.2 版本的 mail() 函数由于缺乏对 ASCII 控制字符（如 CRLF 换行符）的有效过滤，导致存在 CRLF 注入漏洞。远程攻击者可以通过在 mail() 函数的参数中注入恶意控制字符，从而篡改邮件头或邮件正文内容。攻击者在能够控制邮件参数的条件下，可利用此漏洞将目标服务器用作垃圾邮件代理发送伪造邮件，影响邮件传输的完整性与可信度。"
published = "2002-09-24T04:00:00Z"
remediation = '建议立即升级 PHP 至 4.2.3 或更高版本，该版本已修复 mail() 函数对 ASCII 控制字符的过滤缺陷。若无法升级，应在调用 mail() 函数前，使用代码手动过滤掉输入参数中的 \r 和 \n 等换行字符，以防止 CRLF 注入攻击。'
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "PHP 4.x 邮件函数 CRLF 注入漏洞"
updated = "2026-06-16T21:58:30Z"

