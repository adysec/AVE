[basic]
description = "Linux 内核 arm64 架构的 cacheinfo 子系统存在越界写入漏洞。该漏洞源于缓存信息检测循环中对 cacheinfo 数组的索引递增逻辑存在缺陷：当处理器缓存层级采用分离式数据缓存与指令缓存（separate data/instructions cache）时，循环仅根据缓存层级数量进行索引递增，未考虑每个层级可能对应多个缓存叶节点（leaf），导致向 cacheinfo 数组越界写入内存数据。攻击者需在受影响系统的 ARM64 平台上拥有本地低权限访问权限，可通过触发缓存拓扑信息枚举操作利用此漏洞，造成数组越界写入，进而可能提升权限或导致系统崩溃。该漏洞影响运行受影响 Linux 内核版本的 ARM64 服务器、嵌入式设备及云主机，CVSS 评分为 7.8，危害等级为高。"
published = "2025-02-27T03:15:19.350"
remediation = "建议将 Linux 内核升级至以下已修复版本之一：5.4.291、5.10.235、5.15.179、6.1.129、6.6.79、6.12.16 或 6.13.4 及更高版本。修复补丁提交为 875d742cf5327c93cba1f11e12b08d3cce7a88d2，修改文件 arch/arm64/kernel/cacheinfo.c，修正了缓存信息检测循环中未正确索引分离数据/指令缓存层导致的越界写入问题。Debian 用户可升级至 5.10.262-1（bullseye）、6.1.176-1（bookworm）、6.12.94-1（trixie）或 7.1.3-1（forky）等已修复包版本。如暂无法升级，可通过更新设备树（Device Tree）或 ACPI 固件表确保缓存层级配置与硬件寄存器一致，避免触发该越界写入条件。Ubuntu 用户建议升级至 5.15.0-1081.87（22.04 jammy）或 6.8.0-1032.36（24.04 noble）等已修复的内核版本。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 arm64 cacheinfo 数组越界写入漏洞"
updated = "2026-07-30T06:21:30.523"

