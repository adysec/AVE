[basic]
description = "WebActive HTTP Server 1.00 默认将访问日志文件 active.log 存储在 Web 文档根目录下，远程攻击者无需任何身份认证即可通过直接请求该日志文件路径获取服务器访问记录。该漏洞属于敏感信息泄露，攻击者可利用泄露的日志信息（如用户 IP、请求路径、User-Agent 等）进一步扩大攻击面，为后续渗透提供情报支撑。由于日志文件位于公开可访问的目录且无任何访问限制，攻击条件极低，仅需网络可达即可利用。"
published = "2000-07-12T04:00:00.000"
remediation = "将 WebActive HTTP Server 的日志文件 active.log 移出网站文档根目录（DocumentRoot），存放至非 Web 可访问路径（如 /var/log/webactive/）；同时配置 Web 服务器禁止直接访问 .log 后缀文件。由于该产品已停止维护，建议迁移至受支持的 Web 服务器（如 Apache HTTP Server 或 Nginx）以获取持续安全更新。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "WebActive HTTP Server 日志信息泄露漏洞"
updated = "2026-06-16T21:52:10.350"

