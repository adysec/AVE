[basic]
description = "Adobe Flash Player 10.3.183.10之前版本的ActionScript虚拟机（AVM）组件中存在基于栈的缓冲区溢出漏洞。攻击者可通过构造特制的SWF文件，诱使用户在受影响浏览器中打开，触发栈缓冲区溢出，导致任意代码执行或拒绝服务。该漏洞影响Windows、Mac OS X、Linux、Solaris及Android平台，CVSS评分9.3，危害等级严重。Adobe已在安全更新中修复此漏洞。"
published = "2011-09-22T03:38:38Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.10 或更高版本（Windows/Mac/Linux/Solaris）或 10.3.186.7 或更高版本（Android）。该漏洞在 AVM 组件中存在栈缓冲区溢出，攻击者可通过构造恶意 SWF 文件实现远程代码执行。如无法升级，可在浏览器中禁用 Flash 插件或启用 click-to-play 机制，并避免访问不可信网站上的 Flash 内容。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player ActionScript 虚拟机栈缓冲区溢出漏洞"
updated = "2026-06-16T23:31:18Z"

