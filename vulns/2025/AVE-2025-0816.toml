[basic]
description = "Microsoft Bing 存在关键功能缺少身份认证漏洞（CWE-306），未经身份认证的远程攻击者无需任何权限和用户交互即可通过网络向 Bing 服务发送特制请求，利用缺失认证的接口执行任意代码。该漏洞影响 Microsoft Bing 相关服务，CVSS 评分 8.6，危害等级高，攻击复杂度低，可导致机密性数据泄露。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-19T23:15:12.963"
remediation = "Microsoft 已在 2025 年 2 月安全更新中在服务端修复了 Bing 的身份验证缺失漏洞，用户无需手动安装补丁。建议 Bing API 集成方检查 MSRC 公告 (https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-21355) 确认服务端已更新，并在网络层面限制对 Bing 内部 API 端点的未授权访问作为纵深防御措施。"
score = 8.6
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Bing 远程代码执行漏洞"
updated = "2026-06-17T08:43:10.890"

