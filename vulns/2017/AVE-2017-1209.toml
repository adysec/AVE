[basic]
description = "Progress Telerik UI for ASP.NET AJAX（R2 2017 SP1之前版本）及Sitefinity（10.0.6412.0之前版本）中的Telerik.Web.UI.dll未正确保护DialogParametersEncryptionKey和MachineKey，导致加密机制被绕过。远程未认证攻击者可利用此漏洞泄露MachineKey，进而实现任意文件上传与下载、跨站脚本攻击（XSS）以及ASP.NET ViewState反序列化攻击。该漏洞无需用户交互即可远程利用，影响范围广泛，CVSS评分9.8，危害等级严重。"
published = "2017-07-03T19:29:00Z"
remediation = "升级 Progress Telerik UI for ASP.NET AJAX 至 R2 2017 SP1 及以上版本，或升级 Sitefinity 至 10.0.6412.0 及以上版本。如无法立即升级，可在 web.config 中重新生成并设置 MachineKey 和 DialogParametersEncryptionKey，同时限制对 Telerik.Web.UI.DialogHandler.ashx 的访问。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Progress Telerik UI for ASP.NET AJAX 加密密钥泄露致远程代码执行漏洞"
updated = "2026-06-17T01:27:44Z"

