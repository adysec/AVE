[basic]
description = "Aestiva HTML/OS 2.4 版本存在跨站脚本攻击（XSS）漏洞。远程攻击者可在 URL 末尾追加斜杠字符并插入任意 HTML 或 JavaScript 脚本代码，当用户访问该恶意构造的链接时，应用程序会将未经过滤的脚本内容回显至错误消息页面中，导致脚本在用户浏览器端执行。攻击者借此可窃取用户会话 Cookie、重定向至恶意网站或执行其他恶意操作。该漏洞影响范围覆盖运行 Aestiva HTML/OS 2.4 的 Web 服务器，攻击无需认证即可远程触发，攻击复杂度中等，主要依赖社会工程诱骗用户点击特制链接即可完成利用。"
published = "2003-04-02T05:00:00.000"
remediation = "立即升级 Aestiva HTML/OS 至官方发布的最新版本（高于 2.4），并在应用程序代码中对错误消息页面输出的用户输入内容进行 HTML 实体编码。如暂无法升级，可在 Web 服务器或代理层部署过滤规则，拦截包含 `<script>`、`javascript:` 等特征的请求，同时对 URL 参数实施输入验证，限制斜杠（/）后直接拼接脚本内容的请求。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Aestiva HTML/OS 2.4 跨站脚本漏洞"
updated = "2026-06-16T21:59:25.997"

