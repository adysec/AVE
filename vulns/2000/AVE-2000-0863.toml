[basic]
description = "PCCS MySQLDatabase Admin Tool Manager 1.2.4 及更早版本将数据库连接配置文件 dbconnect.inc 错误地安装在 Web 服务器的根目录下，导致远程未授权攻击者可通过直接 HTTP 请求访问该文件，获取包含管理员数据库密码在内的敏感配置信息。该漏洞影响 PCCS MySQLDatabase Admin Tool Manager 1.2.4 及更早版本，攻击者无需身份验证即可远程利用，仅需通过浏览器或 curl 等工具直接访问 Web 根目录下的 dbconnect.inc 文件即可窃取数据库管理员凭据，进而完全控制数据库服务器。CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），属于高危信息泄露漏洞。建议升级至修复版本或将配置文件移至 Web 根目录之外并限制访问权限。"
published = "2000-10-20T04:00:00Z"
remediation = "立即升级到 PCCS MySQLDatabase Admin Tool Manager 1.2.5 或更高版本，删除安装在 web 根目录下的 dbconnect.inc 文件；同时需要将该配置文件的存储路径从 Web 目录迁移至安全目录之外，并禁止在公开 web 目录中存储任何包含管理员凭据的文件。如无法立即升级，可临时通过 Web 服务器配置禁止对 .inc 文件类型的访问，并限制管理员界面的访问 IP 地址范围。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "PCCS MySQLDatabase Admin Tool Manager 信息泄露漏洞"
updated = "2026-06-16T21:52:18Z"

