[basic]
description = "Apache mod_ssl 模块 2.8.9 及更早版本中存在 off-by-one（差一错误）缓冲区溢出漏洞。该漏洞位于 ssl_compat_directive 函数中，当 Apache 通过 rewrite_command 钩子处理 .htaccess 文件中的超长条目时触发。攻击者可在启用 AllowOverride 指令的站点上，构造包含超过 12288 字节 DATE_LOCALE 环境变量值的 .htaccess 文件，触发缓冲区溢出，导致以 Apache 服务器用户权限执行任意代码。该漏洞影响 Apache + mod_ssl 的多种 Linux 发行版配置，Red Hat、Debian、Mandrake、Caldera 等厂商均已发布安全更新。"
published = "2002-07-11"
remediation = "升级 Apache httpd 至 1.3.26 及以上版本（含 mod_ssl 2.8.10+），或单独升级 mod_ssl 至 2.8.10。如无法升级，在 httpd.conf 中禁用 AllowOverride 指令（设置 AllowOverride None）以阻止 .htaccess 文件解析，可缓解该缓冲区溢出风险。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Apache mod_ssl 2.8.x HTAccess 越界缓冲区溢出漏洞"
updated = "2002-07-11"

