[basic]
description = "Sendmail 8.12.9 的 prescan() 函数中存在一个远程缓冲区溢出漏洞。当系统配置使用非标准规则集（包括 recipient (2)、final 或邮件投递代理特定的信封收件人规则集）进行地址解析时，prescan() 函数在处理输入数据时会发生 off-by-one 溢出：returnnull 调用后未对指针边界进行校验，导致指针越过缓冲区边界一个字节，覆盖堆块相邻的 size 字段，进而篡改 malloc 元数据。未经身份认证的远程攻击者可通过向 Sendmail 发送特制的 SMTP 邮件地址数据触发该溢出，在调用 free() 释放被污染的堆块时实现任意代码执行。该漏洞影响 Linux 平台上的 Sendmail 8.12.9 及更早版本，CVSS 评分为 7.5，攻击复杂度低，无需任何认证即可远程利用，可导致部分数据泄露、完整性破坏和服务中断。Red Hat 已将该漏洞标记为重要安全级别，相关厂商已发布安全公告并建议升级至修复版本。"
published = "2003-10-06T04:00:00Z"
remediation = "升级 Sendmail 至 8.12.10 或更高版本，该版本修复了 ruleset parsing 中的缓冲区溢出漏洞。检查 sendmail.cf 配置，移除或禁用非标准规则集 recipient（规则集 2）、final（规则集 4）及邮件投递代理特定信封收件人规则集。临时缓解措施包括在防火墙限制外部对 SMTP 25 端口的未授权访问，并在邮件网关启用异常 SMTP 命令检测。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Sendmail 8.12.9 远程缓冲区溢出漏洞"
updated = "2026-06-16T22:02:38Z"

