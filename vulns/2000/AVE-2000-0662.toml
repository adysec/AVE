[basic]
description = "Sybergen Secure Desktop 2.1 未能正确防护伪造的路由器通告（ICMP 类型 9）报文，远程攻击者可通过发送特制的虚假 ICMP 路由器通告数据包，诱使目标系统修改默认路由表，导致网络流量被重定向至攻击者控制的路径，造成信息泄露或中间人攻击。该漏洞影响 Sybergen Secure Desktop 2.1 版本，攻击者无需身份认证即可远程触发，CVSS 评分 5.0，危害等级中危。"
published = "2000-06-30T04:00:00Z"
remediation = "Sybergen Secure Desktop 2.1 已停止维护且厂商不再存在，无官方补丁可用。建议在网络边界防火墙上配置 ACL 规则，丢弃入站 ICMP 类型 9（路由器通告）报文，防止未授权路由篡改。同时建议迁移至仍在维护的替代安全桌面产品。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Sybergen Secure Desktop 2.1 ICMP 路由器通告欺骗漏洞"
updated = "2026-06-16T21:52:00Z"

