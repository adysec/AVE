[basic]
description = 'Netscape Communicator 和 Navigator 4.04 至 4.74 版本中存在 Java 小程序权限绕过漏洞。远程攻击者可通过诱使用户访问恶意网页，利用 Java applet 以 "file"、"http"、"https" 和 "ftp" 协议打开任意 URL 连接，从而读取目标系统上的任意文件（如 Brown Orifice 演示所示）。该漏洞无需身份认证即可远程利用，攻击复杂度低，但仅影响文件机密性，不涉及数据篡改或系统控制。'
published = "2000-10-20T04:00:00.000"
remediation = "立即升级 Netscape Communicator/Navigator 至 4.75 或更高版本，该版本已修复 Java applet 跨协议读取本地文件的漏洞。如无法升级，请在浏览器设置中彻底禁用 Java applet 支持（编辑 Preferences → Advanced → 取消勾选 Enable Java），或更换为 Mozilla Firefox 等现代浏览器。作为企业级缓解措施，可在网络边界部署应用层防火墙，过滤包含可疑 Java applet 的 HTTP 响应。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Netscape Communicator Java小程序任意文件读取漏洞"
updated = "2026-06-16T21:52:14.713"

