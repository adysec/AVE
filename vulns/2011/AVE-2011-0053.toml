[basic]
description = "Adobe Flash Player 10.3.181.14之前版本在Windows、Mac OS X、Linux、Solaris平台以及10.3.185.21之前版本在Android平台中存在边界检查漏洞。攻击者可通过诱导用户访问特制网页或打开恶意SWF文件，触发边界检查缺陷，导致内存破坏，进而实现任意代码执行。该漏洞无需身份认证，用户交互仅需正常浏览操作即可触发，CVSS评分9.3，危害等级严重。Adobe已在2011年5月发布安全更新修复此漏洞。"
published = "2011-05-13T22:55:01Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.181.14 及以上版本（Windows/Mac/Linux/Solaris），Android 平台升级至 10.3.185.21 及以上版本。由于 Flash Player 已于 2020 年底停止支持并终止分发，建议彻底卸载 Flash Player 组件，并迁移至 HTML5 等现代 Web 技术标准，以彻底消除风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 边界检查远程代码执行漏洞"
updated = "2026-06-16T23:27:46Z"

