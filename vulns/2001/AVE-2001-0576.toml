[basic]
description = "tags.<value>Windows NT 4.0 的 PPTP 服务器存在内存泄漏漏洞。攻击者可通过向目标系统发送特制的畸形 PPTP 数据包触发该漏洞，导致服务器内存持续泄漏，最终耗尽系统资源并引发拒绝服务。该漏洞影响所有运行 Windows NT 4.0 系统上内建的 PPTP 服务实例，攻击者无需身份认证即可在远程发起攻击。由于攻击条件简单且无需交互，攻击者可轻易利用此漏洞使 PPTP 服务器无法为合法用户提供正常的 VPN 拨入服务，造成业务中断。"
published = "2001-03-12T05:00:00.000"
remediation = '应用 Microsoft 安全公告 MS01-009 发布的补丁（知识库文章 Q283001），该补丁修复 PPTP 服务在处理畸形数据包时的内存泄漏问题。对于运行 Windows NT 4.0 Service Pack 6a 的系统，可从 Microsoft 下载中心获取并安装对应版本补丁，补丁安装后可通过注册表项 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Hotfix\Q283001 验证。若 PPTP 服务并非业务必需，建议直接禁用该服务以消除攻击面。由于 Windows NT 4.0 已终止支持，长期解决方案是升级至受支持的操作系统版本（如 Windows Server 2019/2022），并使用更安全的 VPN 替代方案（如 SSTP 或 IKEv2）。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows NT 4.0 PPTP 服务器拒绝服务漏洞"
updated = "2026-06-16T21:53:29.850"

