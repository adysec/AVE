[basic]
description = "Autel MaxiCharger AC Elite Home 电动汽车充电桩的 OCPP 服务在处理 WebSocket 消息时存在整数下溢漏洞。由于对用户提供的数据缺乏正确验证，在分配缓冲区前发生整数下溢，导致内存破坏。未经身份认证的远程攻击者可通过网络向目标设备发送特制的 WebSocket 消息触发该漏洞，成功利用可在设备上下文中执行任意代码。该漏洞影响 Autel MaxiCharger AC Elite Home 系列产品，CVSS 评分 8.1，危害等级高。该漏洞在 Pwn2Own 黑客大赛中被披露，厂商已在固件版本 V1.40.81 中修复。"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 Autel MaxiCharger AC Elite Home 充电桩固件升级至 V1.40.81 或更高版本，该版本已修复 OCPP WebSocket 消息处理中的整数下溢漏洞。如无法立即升级，建议在防火墙/网关上限制充电桩的 443/80 端口对外访问，仅允许与官方 OCPP 服务器的必要通信，并禁用不必要的远程管理功能。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "Autel MaxiCharger AC Elite Home WebSocket 整数下溢远程代码执行漏洞"
updated = "2026-01-01T00:00:00Z"

