[basic]
description = "WFTPD Pro 3.00 存在远程缓冲区溢出漏洞，攻击者通过向 FTP 服务的 CWD 或 RETR 命令提交超长参数即可触发堆溢出，进而借助 NTDLL.DLL 中 RtlFreeHeap() 函数的行为执行任意命令。未经身份认证的远程攻击者仅需网络可达目标 21 端口，即可在无需凭证的情况下完成利用并获取系统权限，导致服务崩溃或完全控制。该漏洞影响运行 Windows NT 4.0 SP3、SP4 及 SP6 的系统，攻击成功后需重启服务才能恢复正常运行。"
published = "2001-05-03T04:00:00Z"
remediation = "建议立即停止使用已停止维护的 WFTPD Pro 3.00，并迁移至现代且安全的 FTP 服务器（如 FileZilla Server 或 vsftpd）。若必须短期维持运行，应在网络防火墙上严格限制对 21 端口的访问，并部署 IPS 规则拦截包含超长 CWD 或 RETR 指令的异常流量。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "WFTPD Pro 3.0 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:54:02Z"

