[basic]
description = "Linux 内核的 nilfs2 文件系统存在释放后使用（Use-After-Free）漏洞。nilfs_lookup_dirty_data_buffers() 函数在遍历附着于脏数据 folio/页面的缓冲区时，未对相关页/folio 进行加锁保护。当文件系统降级为只读时，nilfs_clear_folio_dirty() 会被异步调用，导致缓冲区在遍历过程中失去脏状态保护，进而可能被 try_to_free_buffers() 意外释放，从而触发释放后使用漏洞。本地攻击者可通过诱导系统进入只读状态并触发相关文件系统操作来利用该漏洞，造成内存数据破坏、系统崩溃（拒绝服务）或潜在的本地权限提升。该漏洞利用条件为需要本地访问权限，CVSS 评分 7.8，危害等级高。"
published = "2025-02-27T20:16:03Z"
remediation = '建议立即升级 Linux 内核至包含修复提交（"nilfs2: protect access to buffers with no active references"）的稳定版本，或安装各发行版安全更新。具体操作：Ubuntu 用户执行 `sudo apt update && sudo apt upgrade linux-image-generic` 并重启（对应 USN-7930-1、USN-7511-1 等公告）；Debian 用户执行 `apt update && apt upgrade` 安装 DLA-4178/DLA-4102 更新；Amazon Linux 用户安装 ALAS2KERNEL-5.10-2025-088 公告对应内核。升级后务必重启系统使新内核生效。若无法立即升级，临时缓解措施：避免在受影响主机上挂载或使用 nilfs2 文件系统，并通过本地账号权限控制与最小权限原则限制本地攻击面，直至完成内核更新。'
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 nilfs2 文件系统释放后使用漏洞"
updated = "2026-06-17T08:44:20Z"

