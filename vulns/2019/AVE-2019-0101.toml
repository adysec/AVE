[basic]
description = "PilusCart 是 Kartatopia 开发的一款基于 PHP 的电子商务软件。该软件在 catalog.php 页面的 filename 参数处理上存在路径遍历漏洞，由于未对用户输入的 filename 参数进行有效过滤，攻击者可通过注入 `../` 等路径穿越序列，绕过目录限制读取服务器上的任意本地文件。该漏洞影响 PilusCart 1.4.1 及以下所有版本，无需身份认证即可远程利用。攻击者只需构造类似 `catalog.php?filename=../../../../../../../../../etc/passwd` 的 GET 请求，即可泄露服务器敏感配置文件或系统文件，严重时可导致信息泄露并为进一步攻击提供数据支撑。"
published = "2019-09-09T02:15:10.267"
remediation = "建议升级到 PilusCart 1.4.2 或更高版本以修复该路径遍历漏洞。若暂无官方补丁版本，可手动修改 catalog.php 代码，对 filename 参数使用 basename() 过滤或正则白名单验证，禁止传入 ../ 等目录遍历字符；同时可在 Web 服务器或 WAF 层配置规则，拦截包含 ../ 的请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Kartatopia PilusCart 路径遍历漏洞"
updated = "2026-06-17T02:21:42.980"

