[basic]
description = "Mozilla Firefox 4.x至13.0、Firefox ESR 10.x至10.0.6、Thunderbird 5.0至13.0、Thunderbird ESR 10.x至10.0.6及SeaMonkey 2.11之前版本中的nsSMILTimeValueSpec::IsEventBased函数存在释放后使用（Use-after-free）漏洞。远程攻击者通过诱使用户访问包含恶意SMIL时序对象的特制网页，可触发堆内存破坏，导致拒绝服务或可能执行任意代码。该漏洞无需身份认证即可远程利用，CVSS评分10.0，危害等级严重。"
published = "2012-07-18T10:26:48.627"
remediation = "升级 Firefox 至 14.0 及以上版本，Firefox ESR 升级至 10.0.6 及以上版本，Thunderbird 升级至 14.0 及以上版本，Thunderbird ESR 升级至 10.0.6 及以上版本，SeaMonkey 升级至 2.11 及以上版本。如无法立即升级，可禁用 JavaScript 和 SMIL 动画功能作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey SMIL Timing 释放后使用漏洞"
updated = "2026-06-16T23:40:38.513"

