[basic]
description = 'BEA WebLogic Server 4.0.x/4.5.x/5.1.x 版本存在双点缓冲区溢出漏洞，远程攻击者可通过向服务器发送以 ".." 开头的超长特制 URL 触发缓冲区溢出，导致任意命令执行。该漏洞影响 BEA WebLogic Server 5.1.0 之前的所有版本，CVSS 评分为 10.0，危害等级严重。攻击者无需身份认证即可远程利用，且已有公开的 ExploitDB 利用代码，实际威胁极高。'
published = "2001-02-12T05:00:00Z"
remediation = '升级 BEA WebLogic Server 至 5.1.0 或更高版本，该漏洞已在 5.1.0 中修复。对于已停止维护的旧版本，建议迁移至 Oracle WebLogic Server 受支持版本（如 12.2.1.4 或 14.1.1.0），并在 Web 服务器或 WAF 层面过滤包含连续双点（".."）的畸形 URL 请求作为临时缓解措施。'
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "BEA Systems Weblogic Server 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:39Z"

