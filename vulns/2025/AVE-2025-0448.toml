[basic]
description = "Google Chrome 的 WebGPU 组件中存在堆缓冲区溢出漏洞（CWE-122/CWE-787），攻击者若已攻陷渲染器进程，可通过构造特制的 HTML 页面触发堆内存损坏，进而实现远程代码执行。该漏洞影响 Chrome 141.0.7390.54 之前的所有版本，攻击需用户交互（访问恶意页面），CVSS 评分 8.8，危害等级高。Google 已在 Chrome 141.0.7390.54 版本中修复此漏洞。"
published = "2025-11-06T22:15:38Z"
remediation = "立即升级 Google Chrome 至 141.0.7390.54 及以上版本，通过 Chrome 菜单「帮助」→「关于 Google Chrome」检查并安装更新。基于 Chromium 的浏览器（如 Edge、Brave）需同步更新至对应版本。Fedora 43 用户执行 `sudo dnf update chromium` 升级至 141.0.7390.122。如无法立即更新，可在浏览器设置中禁用 WebGPU（chrome://flags/#enable-unsafe-webgpu）作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome WebGPU 堆缓冲区溢出漏洞"
updated = "2026-06-17T08:29:51Z"

