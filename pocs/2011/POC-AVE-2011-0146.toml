[info]
author = "ave"
description = "Google Chrome 14.0.835.163 之前版本存在释放后使用漏洞，源于卸载事件处理时对已释放内存的错误引用。远程攻击者可通过构造恶意网页诱导用户访问并触发卸载事件，导致浏览器崩溃拒绝服务或可能执行任意代码。"
id = "POC-AVE-2011-0146"
name = "CVE-2011-2846 PoC"
severity = "medium"
tags = ["ave-2011-0146"]
vuln_id = [
    "CVE-2011-2846",
    "AVE-2011-0146",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "CVE-2011-2846",
    "unload",
    "use-after-free",
]
