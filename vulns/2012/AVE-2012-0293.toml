[basic]
description = "标签之间。<value>Apple iTunes 在 10.7 版本之前使用的 WebKit 组件存在内存破坏漏洞。远程攻击者可通过构造恶意网站向目标系统发送特制网页内容，触发 WebKit 渲染引擎中的内存损坏，导致应用程序崩溃或执行任意代码。该漏洞影响运行旧版 iOS（6.0 之前）和 iTunes（10.7 之前）的设备，攻击者无需身份认证即可在用户访问恶意网页时利用此漏洞，CVSS 评分 6.8，危害等级中等。攻击条件为攻击者控制恶意网站并诱使用户访问，利用方式为通过特制网页触发内存损坏实现代码执行或拒绝服务。"
published = "2012-09-13T10:30:19Z"
remediation = "升级 Apple iTunes 至 10.7 或更高版本：Mac 用户通过 Mac App Store 检查并安装 iTunes 更新，Windows 用户前往 Apple 官网下载最新版安装包覆盖安装。如暂时无法升级，应避免使用 iTunes 访问不可信网页内容，并禁用不必要的 WebKit 浏览器组件以降低攻击面。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:35Z"

