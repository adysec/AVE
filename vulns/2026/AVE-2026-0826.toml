[basic]
description = "Open WebUI 是一款可扩展、功能丰富且用户友好的自托管 AI 平台。在 0.8.11 至 0.10.0 版本中，`POST /api/v1/images/edit` 接口仅验证用户账户是否已认证，未检查全局图像编辑开关（`ENABLE_IMAGE_EDIT`）和每用户图像生成权限（`features.image_generation`），导致已认证的非管理员用户可绕过管理员设置的权限控制，利用管理员配置的提供商凭证调用服务端图像编辑功能。攻击者只需持有有效非管理员令牌即可触发该漏洞，造成权限绕过和提供商资源被滥用（产生计费请求），但不会泄露跨用户数据或提供商凭证。该漏洞影响 Open WebUI >= 0.8.11, < 0.10.0 版本，已在 v0.10.0 中修复。"
published = "2026-07-09T17:17:04Z"
remediation = "升级 Open WebUI 至 v0.10.0 或更高版本。如无法立即升级，可在反向代理层限制对 POST /api/v1/images/edit 接口的访问，仅允许管理员 IP 调用该路由。"
score = 4.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Open WebUI 图片编辑接口授权绕过漏洞"
updated = "2026-07-14T02:16:57Z"

