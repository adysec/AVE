[info]
author = "AVE"
description = "通过构造包含大量图片标签的HTML页面，验证Opera 5.11/IE 6.0/Mozilla 0.9.6浏览器图片数量拒绝服务漏洞。远程攻击者可利用此页面导致目标浏览器CPU飙升、内存泄漏直至崩溃。"
id = "POC-AVE-2001-0553"
name = "CVE-2001-1491 PoC"
severity = "medium"
tags = [
    "cve-2001-1491",
    "dos",
    "browser",
]
vuln_id = [
    "CVE-2001-1491",
    "AVE-2001-0553",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cve-2001-1491-poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<img"]
