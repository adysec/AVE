[basic]
description = "Digilent DASYLab 在加载恶意构造的 .DSB 文件时存在越界写入漏洞，由于程序未对文件数据边界进行充分校验，导致内存损坏。本地攻击者可通过诱导用户打开特制的 .DSB 文件触发该漏洞，成功利用可导致敏感信息泄露或任意代码执行。该漏洞影响所有版本的 Digilent DASYLab，CVSS 评分 8.5，危害等级高。目前官方尚未发布修复补丁，建议用户避免打开来源不明的 .DSB 文件。"
published = "2026-03-13T19:53:57Z"
remediation = "目前 Digilent 尚未发布修复该漏洞的补丁，所有版本的 DASYLab 均受影响。建议用户不要打开来自不可信来源或未知发件人的 .DSB 文件，避免点击可疑链接或下载未经验证的 DASYLab 项目文件。同时关注 Digilent 官方安全更新页面（https://www.ni.com/en/support/security/），待补丁发布后立即升级至最新版本。由于该漏洞需要用户交互（打开恶意文件）才能利用，加强用户安全意识培训可有效降低风险。"
score = 8.5
severity = "HIGH"
sources = ["zdi"]
title = "Digilent DASYLab 越界写入内存损坏漏洞"
updated = "2026-06-17T10:11:40Z"

