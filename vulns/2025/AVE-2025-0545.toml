[basic]
description = "tags as required.<value>Fluent Bit 的 in_http、in_splunk 及 in_elasticsearch 输入插件在接收日志数据时，未能对 tag_key 字段执行充分的输入清理与验证。具备对目标 Fluent Bit 实例网络访问权限，或能够向 Splunk/Elasticsearch 写入日志记录的攻击者，可向 tag_key 中注入包含换行符、../ 等特殊字符的非法值。由于 Fluent Bit 的标签机制直接控制日志的路由分发，且部分输出插件会将标签值用于生成文件名或日志内容，攻击者利用此漏洞可实现换行符注入导致日志伪造、路径遍历写入任意文件、伪造记录注入破坏数据完整性，或将日志错误路由至其他通道，严重影响日志系统的数据完整性与路由可靠性。该漏洞影响 Fluent Bit 4.0.12 及以下版本，CVSSv3.1 评分为 9.1，危害等级严重。"
published = "2025-11-24T15:15:46Z"
remediation = "立即将 Fluent Bit 升级至 v4.1.1 或 v4.0.13 版本，该版本已通过 PR #10967 修复 in_http、in_splunk 和 in_elasticsearch 插件中 tag_key 未做输入校验的问题。在升级前，可临时禁用受影响的输入插件，或在网络层面限制对 Fluent Bit 输入端点的访问，仅允许可信来源发送数据。同时检查现有配置中 tag_key 的使用方式，避免将用户可控数据直接作为标签键传入。"
score = 9.1
severity = "CRITICAL"
sources = ["msrc"]
title = "Fluent Bit 输入插件标签键未过滤导致的日志注入与路径遍历漏洞"
updated = "2026-06-17T08:33:18Z"

