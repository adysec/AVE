[basic]
description = "Shoutcast 分布式网络音频服务器（DNAS）1.7.1 版本存在缓冲区溢出漏洞。该漏洞源于服务器在处理客户端提交的超长 description（描述）字段时缺乏有效的边界检查，未能对输入数据长度进行充分限制，导致数据写入缓冲区时发生溢出。远程攻击者无需任何身份认证，只需通过网络向服务器发送包含超长 description 字段的特制请求，即可触发该漏洞，造成服务进程崩溃从而引发拒绝服务（DoS）；在特定条件下，攻击者还可通过精心构造溢出数据覆盖内存中的返回地址等关键数据，进而可能实现任意命令执行，获取服务器控制权。该漏洞影响 Shoutcast DNAS 1.7.1 及受影响的相关版本，CVSS 评分为 10，危害等级为严重，建议受影响的用户尽快升级到已修复版本或部署相应的防护措施。"
published = "2001-03-26T05:00:00Z"
remediation = "建议立即将 Shoutcast DNAS 升级至 1.8.0 及以上版本，该版本修复了处理超长 description 字段时的缓冲区溢出缺陷；升级前可先下载官方 1.8.x 安装包备份现有配置文件后原地替换。如因历史环境无法升级，请在防火墙/ACL 层仅允许受信任内网 IP 访问 DNAS 的 8000 及 8001 端口，阻断公网匿名连接，并避免将服务直接暴露于公网，同时定期监控异常流量以降低远程利用风险。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Nullsoft Shoutcast DNAS 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:53Z"

