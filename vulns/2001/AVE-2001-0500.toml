[basic]
description = "setserial 2.17-4 及更早版本中的 initscript 初始化脚本使用可预测的临时文件名创建临时文件，本地攻击者可通过符号链接攻击（symlink attack）在临时文件创建前于目标路径放置恶意符号链接，从而劫持临时文件指向系统关键文件，实现覆盖或破坏任意文件。该漏洞攻击复杂度较高（需本地访问权限且依赖文件创建时序），但一旦利用成功可导致目标系统机密性、完整性和可用性完全丧失。受影响的系统包括使用 setserial 2.17-4 及更早版本的 Linux 发行版。"
published = "2001-09-26T04:00:00Z"
remediation = "升级 setserial 至 2.17-5 或更高版本，该版本已修复 initscript 使用不可预测临时文件名的问题。如无法升级，可在 initscript 中手动将临时文件创建方式改为 `mktemp` 替代直接拼接 PID 的方式，或限制本地非信任用户登录系统作为临时缓解措施。"
score = 6.2
severity = "MEDIUM"
sources = ["redhat"]
title = "RedHat setserial Initscript 可预测临时文件漏洞"
updated = "2026-06-16T21:56:09Z"

