[basic]
description = "Mozilla Firefox 3.6.18之前版本、Thunderbird 3.1.11之前版本及SeaMonkey 2.0.14及之前版本的SVG元素列表实现中存在释放后使用漏洞，具体位于nsSVGPathSegList::ReplaceItem函数中。远程攻击者可利用用户提供的回调函数，通过特制的SVG内容触发已释放内存的访问，导致应用程序崩溃或可能执行任意代码。攻击者无需身份认证即可远程利用，CVSS评分10.0，危害等级严重。用户需升级至修复版本以消除风险。"
published = "2011-06-30T16:55:04Z"
remediation = "将 Firefox 升级至 3.6.18 及以上版本，Thunderbird 升级至 3.1.11 及以上版本，SeaMonkey 升级至 2.1 及以上版本。无法立即升级时，可在浏览器中禁用 JavaScript 和 SVG 支持作为临时缓解措施，或使用 Firefox 4+/SeaMonkey 2.1+ 等不受影响版本替代。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey SVG元素列表释放后使用远程代码执行漏洞"
updated = "2026-06-16T23:26:46Z"

