[basic]
description = 'Microsoft Office 2000（Excel 和 PowerPoint）及 PowerPoint 97 中的 ActiveX 控件被错误标记为"对脚本安全"，导致远程攻击者可通过诱导用户访问恶意网页或 HTML 邮件，利用 Visual Basic for Applications（VBA）的 SaveAs 函数，强制 Internet Explorer 或邮件客户端将恶意文件保存到目标系统任意位置，进而执行任意代码。该漏洞影响 Internet Explorer 5.01 及 Office 2000 系列产品，攻击者无需身份认证即可远程利用，CVSS 评分 7.5，危害等级高。'
published = "2000-06-27T04:00:00Z"
remediation = "升级到 Microsoft Office XP 或更高版本（Office 2000 已停止支持），或安装 Microsoft 安全公告 MS00-034 对应的补丁。临时缓解措施：在 Internet Explorer 中将「Internet 区域」的 ActiveX 控件和脚本安全级别设为「高」，并禁用「对标记为可安全执行脚本的 ActiveX 控件执行脚本」选项。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Microsoft Internet Explorer 和 Office 2000 ActiveX 对象任意文件保存漏洞"
updated = "2026-06-16T21:52:04Z"

