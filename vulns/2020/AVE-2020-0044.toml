[basic]
description = "CVE-2020-0796是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2020-03-12T16:15:15Z"
remediation = '安装 Microsoft 2020 年 3 月安全更新（Windows 10 1903/1909 对应 KB4551762，Windows 10 1809 对应 KB4556807，Windows Server 2019/2016 对应 KB4556807/KB4556852），通过 Windows Update 自动更新或前往 Microsoft Update Catalog 手动下载安装。如无法立即打补丁，可执行 PowerShell 命令 Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters" DisableCompression -Type DWORD -Value 1 -Force 禁用 SMBv3 压缩作为临时缓解措施，此操作无需重启。同时在企业网络边界防火墙阻断 TCP 445 端口的入站连接，并遵循 Microsoft 指南（KB3185535）阻止 SMB 横向传输流量，以降低内网被利用的风险。'
score = 10
severity = "CRITICAL"
sources = ["nuclei"]
title = "Microsoft Windows SMBv3 客户端/服务器远程代码执行漏洞"
updated = "2026-06-17T02:46:38Z"

