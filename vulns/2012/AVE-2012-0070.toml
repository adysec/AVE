[basic]
description = "WebKit存在跨站脚本（XSS）漏洞，该漏洞存在于苹果Apple iOS 5.1之前版本及Safari 5.1.4之前版本所捆绑的WebKit渲染引擎中。由于WebKit对某些输入内容缺乏充分的HTML转义与脚本过滤，当用户通过浏览器访问攻击者精心构造的恶意网站时，页面中的恶意参数或数据会被当作脚本执行，从而向用户的浏览器注入任意Web脚本或HTML代码。远程攻击者在无需身份认证的情况下即可利用该漏洞，诱使目标用户点击恶意链接或访问受控页面，进而窃取用户的会话Cookie、篡改页面内容或进行钓鱼攻击。该漏洞原理上依赖用户互动触发，攻击成功需用户主动访问恶意页面，CVSS评分为4.3，危害等级中危。苹果公司已在后续安全更新中修复该漏洞，建议用户及时升级至最新版本。"
published = "2012-03-08T22:55:01Z"
remediation = "建议立即将 Safari 升级到 5.1.4 或更高版本，iOS 设备升级到 5.1 及以上版本，Apple 已于 2012 年发布相关安全更新修复该内存破坏与跨站脚本问题。若暂时无法升级，应避免访问不可信或未知的恶意网站，并可在网络层通过 Web 代理、内容过滤或防火墙规则过滤可疑脚本与第三方 Cookie，同时限制浏览器开启执行脚本和跨源功能的权限作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple WebKit 跨站脚本漏洞"
updated = "2026-06-16T23:37:52Z"

