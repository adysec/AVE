[basic]
description = "QNX RTOS 4.25 和 6.1.0 版本中的 /bin/su 程序存在敏感信息泄露漏洞。当本地用户向 su 进程发送 SIGSERV（无效内存引用）信号时，该进程会生成 core dump 文件，其中包含 su 程序的密码哈希数据。攻击者可通过分析 core dump 文件获取敏感的身份验证凭据，进而用于离线破解或横向渗透。该漏洞影响 QNX 实时操作系统 4.25 及 6.1.0 版本，攻击条件为攻击者已在目标系统上拥有本地用户权限，CVSS v2 评分 5.0，危害等级中等。"
published = "2002-12-31T05:00:00Z"
remediation = "联系 QNX Software Systems 获取并安装针对 /bin/su 的安全补丁，该补丁修复了 su 进程在接收 SIGSEGV 信号时生成 world-readable core dump 导致 root 密码哈希泄露的问题。临时缓解措施：在系统启动脚本中执行 `ulimit -c 0` 禁用 core dump，或在 QNX Neutrino 系统中使用 `on -s core` 命令关闭核心转储功能。长期解决方案为升级到 QNX 官方发布的后续安全版本。"
score = 2.1
severity = "LOW"
sources = ["exploitdb"]
title = "QNX RTOS su 命令密码哈希信息泄露漏洞"
updated = "2026-06-16T22:00:32Z"

