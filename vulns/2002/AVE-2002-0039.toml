[basic]
description = "libesmtp 库在 0.8.11 之前的版本中，其 protocol.c 文件的 read_smtp_response 函数存在缓冲区溢出漏洞。当客户端与远程 SMTP 服务器交互时，若服务器返回精心构造的特制响应或超长响应数据，将导致客户端在处理该响应时发生内存溢出。攻击者可以通过控制 SMTP 服务器，在未经身份认证的情况下，远程触发该漏洞以导致目标客户端程序崩溃（拒绝服务）或执行任意代码，从而完全控制目标系统。"
published = "2002-10-04T04:00:00Z"
remediation = "建议将 libesmtp 库升级到 0.8.11 或更高版本，以修复 protocol.c 中 read_smtp_response 函数存在的缓冲区溢出漏洞，防止远程 SMTP 服务器通过恶意响应执行任意代码或导致服务崩溃。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "libesmtp 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:58:42Z"

