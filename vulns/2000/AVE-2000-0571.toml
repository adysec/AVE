[basic]
description = "NAI Net Tools PKI Server 1.0 的 strong.exe 程序存在格式字符串漏洞，未安装 HotFix 3 补丁的版本均受影响。远程未授权攻击者可通过构造包含格式化字符串的 .XUDA 扩展名 URL 发送恶意请求，触发 strong.exe 程序中的格式字符串漏洞，进而实现远程任意代码执行。该漏洞 CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），影响 NAI Net Tools PKI Server 1.0 早期版本，攻击者无需认证即可远程利用，危害等级为高危。Network Associates 已发布 HotFix 3 补丁修复该漏洞，建议用户尽快升级。"
published = "2000-10-20T04:00:00.000"
remediation = "建议立即安装 NAI Net Tools PKI Server 1.0 HotFix 3 补丁程序，或升级至包含该修复的后续版本。若无法立即打补丁，可在防火墙层面拦截 .XUDA 扩展名的 URL 请求，或暂时禁用 strong.exe 服务作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "NAI Net Tools PKI Server 1.0 格式字符串漏洞"
updated = "2026-06-16T21:52:23.173"

