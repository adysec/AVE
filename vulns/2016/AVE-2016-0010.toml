[basic]
description = 'SolarWinds Virtualization Manager 6.3.1及之前版本存在sudo配置不当漏洞，本地低权限用户可利用sudo配置缺陷，通过执行"sudo cat /etc/passwd"等命令实现权限提升，获取系统最高权限。攻击者需拥有本地访问权限，无需用户交互即可利用该漏洞，成功利用后可完全控制目标系统，窃取敏感数据或安装恶意软件。该漏洞CVE评分7.8，危害等级高，已有公开利用代码。'
published = "2016-06-17T15:59:02Z"
remediation = "立即升级 SolarWinds Virtualization Manager 至 6.3.1 或更高版本，厂商已发布热修复补丁。如无法升级，编辑 /etc/sudoers 文件，移除或限制对 cat 等敏感命令的 sudo 免密权限，仅允许受信任管理员使用 sudo，并审计当前 sudo 规则中所有非必要的高权限条目。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "SolarWinds Virtualization Manager 本地权限提升漏洞"
updated = "2026-06-17T00:46:07Z"

