[basic]
description = "Vim 是一款广泛使用的文本编辑器。在 vim 9.1.1096 及之前版本中，src/main.c 文件存在内存损坏漏洞。当用户通过 --log 参数启动 vim 并处理特制文件时，攻击者可利用该漏洞导致程序内存损坏，造成拒绝服务或潜在的内存数据破坏。该漏洞需要本地访问且依赖用户交互（如打开恶意文件），CVSS 评分 2.4，危害等级低。升级至 vim 9.1.1097 版本即可修复此问题。"
published = "2025-02-12T19:15:10Z"
remediation = "升级 Vim 至 9.1.1097 或更高版本，该版本已修复 src/main.c 中 --log 参数导致的内存损坏问题。补丁提交为 c5654b84480822817bb7b69ebc97c174c91185e9。如无法立即升级，避免在 Vim 中使用 --log 参数作为临时缓解措施。"
score = 2.4
severity = "LOW"
sources = ["msrc"]
title = "Vim main.c 内存损坏漏洞"
updated = "2026-06-17T08:38:37Z"

