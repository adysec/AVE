[basic]
description = "Big Brother 1.4h1 及更早版本中的 bb-hostsvc.sh 脚本存在目录遍历漏洞，远程攻击者可通过向 HOSTSVC 参数传递 `../` 等路径遍历序列，绕过访问限制读取服务器上的任意文件。该漏洞无需身份认证即可远程利用，攻击复杂度低，可导致敏感信息泄露（如 /etc/passwd 等系统文件），CVSS 评分 10.0，危害等级严重。"
published = "2000-07-11T04:00:00.000"
remediation = '立即升级 Big Brother 至 1.4h2 或更高版本，该版本已修复 bb-hostsvc.sh 中 HOSTSVC 参数的路径遍历问题。如无法升级，在 Web 服务器或反向代理层对 HOSTSVC 参数进行输入过滤，拒绝包含 "../" 的请求；同时限制 bb-hostsvc.sh 脚本的访问权限，仅允许受信 IP 调用。'
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Big Brother 1.x 目录遍历漏洞"
updated = "2026-06-16T21:52:09.860"

