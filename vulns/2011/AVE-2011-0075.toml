[basic]
description = "Adobe Flash Player 存在缓冲区溢出漏洞，攻击者可通过向目标系统发送特制的 SWF 文件或嵌入恶意 Flash 内容的网页触发该漏洞，造成缓冲区溢出并执行任意代码。该漏洞影响 Windows、Mac OS X、Linux、Solaris 平台上版本低于 10.3.183.5 的 Adobe Flash Player，以及 Android 平台版本低于 10.3.186.3 的 Adobe Flash Player，同时影响 Windows/Mac OS X 平台版本低于 2.7.1 的 Adobe AIR。由于该漏洞无需认证且攻击复杂度低，攻击者只需诱使用户访问恶意页面即可实现远程代码执行，CVSS 评分 10.0，危害等级严重。"
published = "2011-08-10T21:55:02Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.5 及以上版本（Windows/Mac/Linux/Solaris），Android 平台升级至 10.3.186.3 及以上版本，Adobe AIR 升级至 2.7.1 及以上版本。官方补丁见 APSB11-21 安全公告。鉴于 Adobe Flash Player 已于 2020 年底停止支持并终止生命周期，建议彻底卸载 Flash Player 以消除所有历史漏洞风险。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T23:30:45Z"

