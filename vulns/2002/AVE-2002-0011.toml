[basic]
description = "OpenSSL 0.9.6d 及之前版本、0.9.7-beta2 及之前版本中存在缓冲区溢出漏洞。远程攻击者可通过两种方式触发：一是向 SSL2 发送过大的客户端主密钥（KEY_ARG），二是向 SSL3 发送过大的会话 ID（Session ID），均导致缓冲区溢出，进而实现远程代码执行。该漏洞影响所有使用受影响 OpenSSL 版本的 Web 服务器（如 Apache mod_ssl），攻击者无需身份认证即可通过网络远程利用，CVSS 评分 7.5，危害等级高。厂商已发布 OpenSSL 0.9.6e 及 0.9.7-beta3 修复此漏洞。"
published = "2002-08-12T04:00:00Z"
remediation = "立即升级 OpenSSL 至 0.9.6e 或更高版本（0.9.6d 用户可打补丁 https://www.openssl.org/news/patch_20020730_0_9_6d.txt），0.9.7 预发布版用户升级至 0.9.7-beta3 或更高版本，并重新编译所有依赖 OpenSSL 的应用程序。临时缓解措施：在服务器上禁用 SSLv2 协议，在客户端完全禁用 SSL/TLS 功能直至补丁应用完毕。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "OpenSSL SSL2/SSL3 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:57:52Z"

