[basic]
description = "Internet Explorer 5.5 和 6.0 的 Web Folder 组件在处理错误消息时，会将错误信息写入临时文件夹中的已知位置。远程攻击者可通过构造特制的恶意网页，利用 mhtml: URL 协议处理程序触发该组件，将恶意代码注入错误消息文件中，进而实现任意代码执行。攻击无需身份认证，且利用难度较低，影响范围广泛。"
published = "2002-09-24T04:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS02-047 提供的更新补丁，升级 Internet Explorer 至 6.0 SP1 及以上版本。对于已停止支持的旧系统，建议升级至 Windows 10/11 并使用最新版 Edge 浏览器及邮件客户端，同时禁用 Web Folder 组件（通过注册表将 CLSID {E6CB5FE0-B5B5-11D1-9F4C-00C04FC2F572} 的权限设置为拒绝）。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer Web Folder 组件远程代码执行漏洞"
updated = "2026-06-16T21:58:30Z"

