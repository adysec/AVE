[basic]
description = "mgetty 软件包中的 faxrunq 和 faxrunqd 工具存在符号链接遍历漏洞。本地攻击者可通过在 /var/spool/fax/outgoing/ 目录下创建指向目标文件的符号链接 .last_run，诱使 faxrunq/faxrunqd 在处理传真队列时跟随该符号链接，从而以运行进程的权限创建或修改任意系统文件。该漏洞影响 mgetty 1.1.19 至 1.22.8 版本，攻击者需具备本地用户权限，CVSS 评分 2.1，危害等级低。"
published = "2000-10-20T04:00:00.000"
remediation = "升级 mgetty 至 1.1.22 以上版本，该版本修复了 faxrunq/faxrunqd 对 /var/spool/fax/outgoing/.last_run 符号链接的检查逻辑。如无法升级，可移除 faxrunq 的 setuid 位（chmod u-s /usr/bin/faxrunq）并限制本地非信任用户登录系统。"
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "Gert Doering mgetty 符号链接遍历漏洞"
updated = "2026-06-16T21:52:16.667"

