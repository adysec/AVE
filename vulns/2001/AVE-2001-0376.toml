[basic]
description = "Zope 2.2.4 及之前版本存在安全控制绕过漏洞，部分受信任用户可通过 dtml-var 标签的 fmt 属性访问受保护的方法，绕过安全控制机制。该漏洞影响 Zope 2.2.4 之前的所有版本，攻击者需具备部分受信任用户权限，通过构造特定的 dtml-var 标签并利用 fmt 属性调用受限方法，从而绕过安全控制访问受限资源或执行未授权操作。该漏洞 CVSS 评分 7.5（HIGH），影响机密性、完整性和可用性，Zope 官方已在 2.2.4 版本中修复此漏洞。"
published = "2001-10-10T04:00:00Z"
remediation = "升级Zope到最新稳定版本（如3.0.x或以上），并修改dtml-var配置中禁用fmt属性访问；设置web应用防火墙规则，严格限制对dtml标签的访问权限；实施强制认证和权限控制，阻止部分可信用户执行安全绕过操作。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Zope Zope 安全控制绕过漏洞"
updated = "2026-06-16T21:55:51Z"

