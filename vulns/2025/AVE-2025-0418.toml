[basic]
description = "Google Chrome（Android 版本）浏览器 UI 组件存在不当实现漏洞（CWE-1007），远程攻击者可通过构造特制的 HTML 页面，利用浏览器地址栏（Omnibox）URL 显示逻辑的缺陷，欺骗用户使其误认为正在访问合法网站，从而实现界面欺骗。攻击者无需提前认证，但需要用户通过浏览器访问恶意构造的页面。该漏洞影响 Chrome for Android 133.0.6943.98 之前版本，以及基于 Chromium 的 Microsoft Edge 等浏览器，可能导致用户向攻击者控制的虚假页面提交敏感信息，造成机密性和完整性低度影响。"
published = "2025-02-15T02:15:09Z"
remediation = "立即将 Google Chrome for Android 升级至 133.0.6943.98 或更高版本，可通过 Google Play Store 检查并安装更新。使用 Microsoft Edge (Chromium 内核) 的用户需升级至 133.0.3065.69 或更高版本。Debian 用户应执行 `apt update && apt upgrade` 安装 DSA-5866-1 安全更新。临时缓解措施：避免在 Android 设备上点击可疑链接或访问不可信网页。"
score = 5.4
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome 浏览器界面不当实现漏洞"
updated = "2026-06-17T08:27:29Z"

