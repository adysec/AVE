[basic]
description = "Drummond Miles A1Stats 是一款网站统计和流量分析工具，其 a1disp.cgi CGI 脚本存在远程命令注入漏洞。该程序在 1.6 版本之前未对用户输入的 URL 参数进行充分过滤和转义，未经身份认证的远程攻击者可通过构造包含 shell 元字符（如分号、管道符、反引号等）的特制 URL 向服务器发送请求，从而在服务器上执行任意操作系统命令。由于该漏洞可通过网络远程利用，攻击复杂度低，无需身份认证，任何能够访问目标 Web 服务的攻击者均可发起攻击。该漏洞影响运行旧版 A1Stats 的 Web 服务器，可导致攻击者获取服务器敏感信息、篡改网页内容或进一步控制服务器，CVSS v2 评分为 7.5，危害等级高。"
published = "2001-08-14T04:00:00Z"
remediation = "升级 Drummond Miles A1Stats 至 1.6 或更高版本以修复 a1disp.cgi 远程命令执行漏洞。若无法立即升级，应删除或禁用 Web 根目录下的 a1disp.cgi 脚本，并在 Apache 或 IIS 配置中通过 RewriteRule 或 URLScan 禁止外部访问该文件。同时建议在防火墙或 WAF 层面过滤 URL 中的 shell 元字符（如分号、管道符、反引号等），作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Drummond Miles A1Stats 远程命令执行漏洞"
updated = "2026-06-16T21:54:32Z"

