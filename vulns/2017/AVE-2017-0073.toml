[basic]
description = "WordPress htaccess 插件 1.7.6 之前版本存在多个跨站脚本（XSS）漏洞。该漏洞源于插件未对用户输入进行充分的过滤与转义处理，攻击者可利用特制请求将恶意 JavaScript 代码注入到受影响页面中。当管理员或其他用户访问被注入的页面时，恶意脚本将在其浏览器中执行，导致敏感信息泄露或会话劫持。攻击者需诱使用户点击恶意链接或访问特制页面，无需身份认证即可触发，CVSS 评分 6.1，危害等级中危。"
published = "2019-08-13T17:15:13Z"
remediation = "立即将 WordPress 的 htaccess 插件升级到 1.7.6 或更高版本。登录 WordPress 后台 → 插件 → 已安装插件 → 找到 Htaccess by BestWebSoft → 点击「更新」。如已禁用自动更新，请手动从 wordpress.org/plugins/htaccess/ 下载最新版覆盖安装。作为临时缓解措施，可限制 wp-admin 目录的访问权限或移除未使用的管理员账户。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress htaccess插件跨站脚本漏洞"
updated = "2026-06-17T01:12:58Z"

