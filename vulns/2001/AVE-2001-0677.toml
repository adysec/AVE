[basic]
description = 'Microsoft Index Server 2.0（Windows NT 4.0）及 Indexing Service（Windows 2000）存在路径遍历与信息泄露漏洞。未经身份认证的远程攻击者可通过构造畸形的搜索请求，利用"Malformed Hit-Highlighting"机制读取服务器端的包含文件（.stm/.ida等），从而获取敏感配置信息、数据库连接字符串或其他未授权访问的内部资源。该漏洞攻击条件极低，仅需目标系统开放索引服务端口即可远程触发，无需任何凭据或用户交互。受影响版本包括 Windows NT 4.0 及 Windows 2000 系统上运行索引服务的相关组件。Microsoft 已在后续安全更新中修复此漏洞，建议受影响用户及时升级并审查索引服务的访问权限配置，避免敏感文件暴露。'
published = "2001-06-27T04:00:00.000"
remediation = '立即为 Index Server 2.0 及 Indexing Service 安装微软 MS01-025 安全补丁。Windows NT 4.0 系统请下载并安装 Index Server 2.0 补丁，安装后确认注册表项 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Hotfix\Q296185 已创建。Windows 2000 系统请安装 Indexing Service 补丁，确认注册表项 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Updates\Windows 2000\SP2\Q296185 已创建。如暂无法打补丁，应在防火墙层面禁止外部访问 NetBIOS 及 WebDAV 端口，并限制只有本地访问可触发 Index Server 搜索功能。确保所有服务器端 include 文件中不存放敏感信息如密码或数据库连接字符串。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "微软 Windows Index Server 信息泄露漏洞"
updated = "2026-06-16T21:53:57.267"

