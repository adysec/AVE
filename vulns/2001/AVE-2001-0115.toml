[basic]
description = "标签中。<value>BadBlue 1.02.07 Personal Edition 的 ext.dll 组件存在缓冲区溢出漏洞。远程攻击者无需身份验证即可通过发送超长 HTTP GET 请求触发该漏洞，导致服务拒绝，并在特定条件下可能执行任意系统命令。该漏洞影响 BadBlue 1.02.07 Personal Edition 版本，CVSS v3 评分 10.0，危害等级为严重。攻击者可通过构造包含异常长数据的 HTTP 请求向目标服务器发起利用，造成服务器崩溃或获取远程代码执行权限。"
published = "2001-05-03T04:00:00Z"
remediation = "由于 BadBlue 1.2.7 已停止维护，建议立即卸载该软件并迁移至现代安全的 Web 服务器。若必须运行，请在防火墙或 WAF 中配置请求过滤规则，限制 HTTP GET 请求的长度以防止缓冲区溢出攻击。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Working Resources BadBlue HTTP GET 请求缓冲区溢出漏洞"
updated = "2026-06-16T21:54:00Z"

