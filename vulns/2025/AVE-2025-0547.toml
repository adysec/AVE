[basic]
description = "tags.<value>Google Chrome V8 引擎存在实现不当漏洞（CVE-2025-13042），该漏洞源于 V8 引擎在处理特定 JavaScript 对象时存在越界写入缺陷。未经身份认证的远程攻击者可通过诱导用户访问包含特制 HTML 内容的恶意网页，利用该漏洞触发堆内存损坏，进而实现任意代码执行。该漏洞影响 Google Chrome 142.0.7444.166 之前的版本，CVSS 评分为 8.8（高危），攻击条件为受害者需主动访问恶意页面且浏览器中启用 JavaScript。Google 已在后续版本中修复此漏洞。"
published = "2025-11-12T17:15:36Z"
remediation = "立即升级 Google Chrome 浏览器至版本 142.0.7444.166 或更高版本，可通过 Chrome 菜单「帮助」→「关于 Google Chrome」功能进行自动更新。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 堆损坏远程代码执行漏洞"
updated = "2026-06-17T08:33:24Z"

