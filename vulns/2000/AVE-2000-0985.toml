[basic]
description = "Khamil Landross 和 Zack Jones 开发的 EFTP 2.0.4.281 版本存在缓冲区溢出漏洞，远程攻击者可通过发送不包含换行符的字符串并断开连接，触发服务端缓冲区溢出导致拒绝服务。该漏洞影响 EFTP 2.0.4.281 版本，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），属于中危级别。攻击者无需身份认证即可远程利用，仅需向目标服务发送畸形数据包即可导致服务崩溃，严重影响业务连续性。"
published = "2000-11-14T05:00:00Z"
remediation = "立即停止使用过时的 EFTP 服务，部署现代化的安全文件传输解决方案（如 SFTP 或 FTP over TLS）。如必须保留 EFTP，则将其隔离在内部网络，限制访问权限，并部署额外的缓冲区溢出防护机制。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Khamil Landross And Zack Jones EFTP 缓冲区溢出导致的拒绝服务漏洞"
