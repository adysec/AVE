[basic]
description = "Samba 服务器软件 3.5.0 至 4.6.4、4.5.10、4.4.14 版本中存在远程代码执行漏洞（SambaCry）。该漏洞源于 SMB 协议处理函数 is_known_pipename() 在加载共享库时未正确验证路径，拥有可写共享目录访问权限的远程攻击者可上传恶意构造的共享库文件，并通过特制 RPC 请求触发服务端加载执行，从而实现远程代码执行。攻击无需身份认证，仅需目标 Samba 服务开放可写共享且启用 smb.conf 中的 ntlm auth 选项。该漏洞影响大量 Linux/Unix 系统，CVSS 评分 9.8，危害等级严重。目前已公开 Metasploit 利用模块及独立 Python 利用脚本，建议立即升级至 Samba 4.6.4/4.5.10/4.4.14 及以上版本修复。"
published = "2017-05-30T18:29:00Z"
remediation = "立即升级 Samba 至 4.6.4、4.5.10 或 4.4.14 及以上版本。如无法立即升级，可在 smb.conf 的 [global] 段中添加 `nt pipe support = no` 禁用命名管道支持作为临时缓解措施，但此操作会影响打印机共享等功能。同时建议在防火墙层面限制 SMB 端口（139/TCP、445/TCP）仅对可信来源开放。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Samba 远程代码执行漏洞"
updated = "2026-06-17T01:24:27Z"

