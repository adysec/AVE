[basic]
description = "Veritas Backup Exec 21.2 及之前版本存在身份验证不当漏洞。该软件支持多种身份验证方案，其中包括已弃用的 SHA 身份验证机制。尽管该机制在当前版本中已不再使用，但开发人员未将其禁用，导致未经身份验证的远程攻击者能够利用该遗留认证方案，绕过安全校验直接访问 Backup Exec Agent 服务，并以特权身份执行任意命令，从而完全控制受影响的备份服务器。该漏洞影响 Veritas Backup Exec 的全部历史版本，攻击者可远程利用且无需用户交互，CVSS 评分 9.8，危害等级严重。"
published = "2021-03-01T22:15:14Z"
remediation = '建议将 Veritas Backup Exec 升级至 21.2 或更高版本以彻底修复此漏洞。受影响版本包括 16.x、20.x 和 21.1，所有平台上的 Agent 均受影响。如无法立即升级，可采取临时缓解措施：以管理员身份检查注册表路径 Software\Veritas\Backup Exec For Windows\Backup Exec\Engine\Agents\XBSA\Machine\DBAID，若 DBAID 值为非零则无需操作；若该注册表项不存在，则创建类型为字符串 (REG_SZ) 的 DBAID 值并设置为随机十六进制字符串，这将阻止攻击者利用 SHA 认证方案。'
score = 8.2
severity = "HIGH"
sources = ["kev"]
title = "Veritas Backup Exec 身份验证绕过漏洞"
updated = "2026-06-17T03:45:32Z"

