[basic]
description = "SquirrelMail 1.2.3 之前版本的拼写检查插件（check_me.mod.php）存在命令注入漏洞，远程攻击者无需身份认证即可通过构造特制的 sqspell_command 参数向服务器注入并执行任意系统命令。该漏洞影响所有使用受影响版本 SquirrelMail 的 Web 邮件系统，可导致服务器敏感信息泄露、数据篡改或服务中断，危害严重。攻击者只需向目标发送恶意 HTTP 请求即可触发。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 SquirrelMail 至 1.2.3 或更高版本，该版本修复了 check_me.mod.php 中 sqspell_command 参数未正确过滤导致的命令注入问题。如无法升级，可在 Web 服务器层面禁用 check_me.mod.php 的访问权限，或限制 sqspell_command 参数仅允许预定义的安全值。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "SquirrelMail 拼写检查插件远程代码执行漏洞"
updated = "2026-06-16T21:59:43Z"

