[basic]
description = "Pragma Systems TelnetServer 2000 version 4.0 的 rexec 服务存在缓冲区溢出漏洞。远程未经身份认证的攻击者可向 rexec 端口发送大量空字符（null characters），导致缓冲区溢出触发拒绝服务，使 Telnet 服务崩溃或无响应。该漏洞影响 Pragma Systems TelnetServer 2000 4.0 版本，CVSS 评分 5.0（中等），仅影响可用性，无机密性和完整性影响。攻击者无需认证即可远程发送恶意数据包触发漏洞，导致服务拒绝服务。Pragma Systems 已发布补丁修复此漏洞，建议用户升级到修复版本或禁用 rexec 服务缓解风险。"
published = "2000-10-20T04:00:00Z"
remediation = "建议立即升级 Pragma Systems TelnetServer 2000 至 4.0 之后的修复版本（建议升级至最新版本或迁移至 SSH 服务）。若无法立即升级，请在防火墙层面禁止外部访问 rexec 端口（默认 TCP 514），或在服务配置中禁用 rexec 服务功能。建议尽快迁移至 SSH 协议替代 Telnet/rexec 服务以消除该类缓冲区溢出风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Pragma Systems TelnetServer 2000 rexec 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:18Z"

