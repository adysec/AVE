[basic]
description = "Canna 3.6 及更早版本在处理客户端请求时缺乏有效的校验机制，导致远程攻击者可以通过向目标服务器发送特制的恶意请求，触发拒绝服务（DoS）状态或导致敏感信息泄露。该漏洞的影响范围涵盖 Canna 3.6 及所有更早版本，攻击者无需通过身份认证即可在网络环境下远程触发。利用此漏洞可导致服务器响应异常或泄露内部数据，严重影响服务的可用性与机密性。"
published = "2002-12-18T05:00:00Z"
remediation = "立即将 Canna 升级至 3.6p1 或更高版本（Debian 用户执行 apt install canna=3.6p1-1 或更新版本）。若无需日文输入法功能，可卸载 canna 包或停止相关服务以消除攻击面。在防火墙层面限制对 Canna 服务的网络访问作为临时缓解措施。"
score = 6.4
severity = "MEDIUM"
sources = ["redhat"]
title = "Canna 输入法 远程请求验证不当 拒绝服务与信息泄露漏洞"
updated = "2026-06-16T21:58:51Z"

