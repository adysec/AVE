[basic]
description = "CIRCONTROL CirCarLife（电动汽车充电管理系统）4.3 之前版本中存在信息泄露漏洞。由于 `/html/repository` 接口未进行身份认证，未经身份验证的远程攻击者可直接访问该路径，获取系统内部安装路径等敏感信息，为后续攻击提供线索。该漏洞攻击复杂度低，无需任何权限，CVSS 评分 5.3，危害等级中危。"
published = "2018-09-18T20:29:00Z"
remediation = "升级 CirCarLife 至 4.3.0 或更高版本（厂商已修复该路径泄露问题）。如无法升级，在 Web 服务器（如 Nginx/Apache）层面为 `/html/repository` 路径添加 HTTP 基本认证或 IP 白名单访问控制，仅允许管理网段访问 SCADA Web 管理界面（默认端口 80/8080），同时禁用不必要的目录列表功能。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "CIRCONTROL CirCarLife 内部安装路径泄露漏洞"
updated = "2026-06-17T01:44:39Z"

