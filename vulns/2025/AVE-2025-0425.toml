[basic]
description = "Google Chrome（桌面版）Serviceworker 组件中存在释放后使用（Use After Free）漏洞，远程攻击者可通过构造特制的 HTML 页面诱导用户访问，成功利用该漏洞可触发堆内存破坏，导致在目标系统上实现远程代码执行。该漏洞影响 Chrome 140.0.7339.127 之前的所有桌面版本，CVSS 评分 8.8，危害等级高，无需身份认证但需要用户交互。Google 已在 Chrome 140.0.7339.127 版本中修复此漏洞。"
published = "2025-09-10T19:15:40Z"
remediation = "立即将 Google Chrome 升级至 140.0.7339.127 或更高版本（设置 > 关于 Chrome > 自动检查更新）；基于 Chromium 的浏览器（Edge、Brave、Opera 等）请更新至对应修复版本。Linux 发行版用户通过包管理器更新：Fedora 执行 `sudo dnf update chromium` 至 140.0.7339.207，Debian/Ubuntu 执行 `sudo apt update && sudo apt upgrade chromium-browser`。无法立即升级时，可启用站点隔离（chrome://flags/#enable-site-per-process）并避免访问不可信链接作为临时缓解。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome ServiceWorker 释放后使用漏洞"
updated = "2026-06-17T08:27:53Z"

