[basic]
description = "Novell NetWare 5.01i/5.1 的 FTP 服务器组件 NWFTPD.nlm 在 5.01o 之前版本存在多个未明确说明的访问控制漏洞。未经身份认证的远程攻击者可通过未知攻击向量绕过匿名访问限制，以匿名用户身份执行未授权操作。该漏洞影响运行 NetWare 5.1 SP3 及更早版本的系统，攻击者仅需通过网络连接到目标 FTP 服务即可触发，无需任何凭据或复杂交互，利用门槛极低。成功利用后可能导致敏感信息泄露、数据篡改或服务可用性下降，对企业文件服务器安全构成严重威胁。"
published = "2010-04-05T15:30:00Z"
remediation = "将 NetWare 5.1 的 FTP 服务器组件 NWFTPD.NLM 升级至 5.01o 版本或更高版本，可通过安装 NetWare 5.1 SP3 或应用 NWFTPD2.EXE 补丁实现。如暂时无法升级，建议在 FTPSERV.CFG 配置文件中禁用匿名登录，并在防火墙层面限制 21 端口的访问来源，仅允许可信 IP 地址连接。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Novell NetWare FTP 服务器访问控制绕过漏洞"
updated = "2026-06-16T21:53:27Z"

