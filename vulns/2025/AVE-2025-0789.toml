[basic]
description = "Windows 远程桌面服务存在资源消耗漏洞，该漏洞源于系统对特制网络请求的处理不当。未经身份认证的远程攻击者可通过向目标系统的远程桌面服务发送精心构造的数据包，触发无限循环或资源耗尽，导致目标服务停止响应，造成拒绝服务。该漏洞影响多个 Windows 版本，CVSS 评分 7.5，危害等级高。攻击复杂度低，无需用户交互，仅需网络访问即可利用。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:57.940"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新 KB5050021，可通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。受影响版本包括 Windows 10/11 及 Windows Server 2019/2022/2025，更新后各版本对应最低内部版本号分别为：Win10 1809≥10.0.17763.6775、Win10 21H2≥10.0.19044.5371、Win10 22H2≥10.0.19045.5371、Win11 22H2≥10.0.22621.4751、Win11 23H2≥10.0.22631.4751、Win11 24H2≥10.0.26100.2894、Server 2022≥10.0.20348.3091。如无法立即打补丁，可在防火墙层面限制对 RDP 端口（TCP 3389）的访问，仅允许受信任 IP 连接，并启用网络级身份验证（NLA）作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 远程桌面服务拒绝服务漏洞"
updated = "2026-06-17T08:43:07.120"

