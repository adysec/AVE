[basic]
description = "EFTP 2.0.7.337 存在缓冲区溢出漏洞，远程攻击者可通过上传包含大量字符的特制 .lnk 文件触发该漏洞，导致目标系统执行任意代码或服务拒绝。该漏洞源于 EFTP 在处理 .lnk 文件名时未对输入长度进行有效边界检查，攻击者无需身份认证即可远程利用，CVSS 评分 7.5，危害等级高。受影响版本为 EFTP 2.0.7.337，建议升级至最新版本或限制对 FTP 服务的访问。"
published = "2001-09-12T04:00:00Z"
remediation = "立即升级 EFTP 至 2.0.7.337 之后的安全版本（如已停止维护，建议迁移至 FileZilla Server 或 vsftpd 等活跃维护的 FTP 服务器）。如无法升级，在防火墙层面限制仅受信 IP 可访问 FTP 端口（默认 21），并禁用匿名上传权限以降低攻击面。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "EFTP 2.0.7 远程缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:55:36Z"

