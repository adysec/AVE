[basic]
description = "NETGEAR JGS516PE 智能网管交换机存在功能级访问控制缺失漏洞。未经身份认证的远程攻击者可直接访问设备管理接口中的敏感功能，无需任何授权即可执行配置修改、固件升级、系统重启等特权操作，导致设备完全受控。该漏洞影响固件版本低于 2.6.0.43 的所有 JGS516PE 设备，攻击者通过网络即可发起攻击，无需用户交互。CVSS 评分 9.8，危害等级严重。NETGEAR 已在固件 2.6.0.43 中修复此漏洞。"
published = "2020-10-09T07:15:17.607"
remediation = "升级 NETGEAR JGS516PE 固件至 2.6.0.43 或更高版本，该版本已修复功能级访问控制缺失问题。在无法立即升级时，将设备管理接口限制在可信内网 IP 范围内，并禁用 Web 远程管理功能以降低被攻击风险。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "NETGEAR JGS516PE 交换机功能级访问控制缺失漏洞"
updated = "2026-06-17T03:08:32.480"

