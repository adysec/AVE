[basic]
description = "tags.<value>Netscape Messaging Server 4.15 Patch 2 的 IMAP 服务器组件存在缓冲区溢出漏洞。本地攻击者可发送超长的 IMAP LIST 命令触发缓冲区溢出，从而在目标系统上执行任意代码，获取系统权限。该漏洞影响运行 Netscape Messaging Server 4.15 Patch 2 的服务器，CVSS 评分为 10 分，危害等级严重。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 Netscape Messaging Server 至 4.15 Patch 3 或更高补丁版本以修复该缓冲区溢出漏洞；立即通过网络防火墙限制 IMAP 服务（143/993 端口）仅对受信任的内部网段开放，阻止外部直接访问；安装 Sun ONE Messaging Server 6.0 及以上版本作为长期替代方案；若无法立即升级，可在 IMAP 配置中设置最大 LIST 命令返回条目数上限并关闭未经身份认证的匿名访问功能，直到完成补丁部署。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Netscape Messaging Server IMAP 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:51.743"

