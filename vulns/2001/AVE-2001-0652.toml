[basic]
description = "KDE2 桌面环境中的 kdesu 程序在通过 UNIX socket 传输用户密码时，未对 socket 的所有者身份进行正确验证。攻击者可利用此缺陷在本地窃取其他用户的密码，进而提升自身权限。该漏洞影响 KDE 2.2.0-6 及之前的所有版本，CVSS 评分 2.1。由于漏洞仅能被本地用户利用，因此危害程度有限，KDE 已在后续版本中修复了此问题。"
published = "2001-03-26T05:00:00.000"
remediation = "升级 KDE 至 2.2.0-6 或更高版本以修复 kdesu UNIX Socket 验证缺陷。若暂时无法升级，可通过设置 kdesu 文件权限为 700（仅所有者可执行）或使用 sudo 替代 kdesu 进行提权操作作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "KDE2 kdesu 本地密码泄露和权限提升漏洞"
updated = "2026-06-16T21:53:49.283"

