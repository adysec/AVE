[basic]
description = "VShell SSH 网关 1.0.1 及更早版本存在格式化字符串漏洞。未经身份认证的远程攻击者可通过在登录时发送包含格式化字符串说明符（如 %n、%s 等）的用户名触发该漏洞，进而在目标系统上执行任意命令。该漏洞影响 VShell SSH 网关 1.0.1 及更早版本，攻击者无需事先获取账户凭据，只需能够连接到目标的 SSH 服务即可利用。Vandyke 公司已发布安全公告并建议用户升级至修复版本以消除该风险。"
published = "2001-06-02T04:00:00.000"
remediation = "立即升级 VShell SSH gateway 至 1.0.2 或更高版本，该补丁修复了用户名字段对格式字符串说明符的过滤逻辑。如无法立即升级，应在防火墙或访问控制列表中限制 SSH 服务的来源 IP，仅允许可信网段访问，并在日志中监控包含 %s、%n、%x 等格式字符的异常登录请求。临时缓解措施可将 VShell 配置文件中的用户名验证模式设为仅接受字母数字字符，禁止特殊符号传入日志记录函数。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "VShell SSH 网关格式字符串远程代码执行漏洞"
updated = "2026-06-16T21:53:46.587"

