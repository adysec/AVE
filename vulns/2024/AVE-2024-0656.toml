[basic]
description = "Linux 内核 btrfs 文件系统在 `run_delalloc_nocow()` 函数处理延迟分配写入失败时存在 folio（页缓存）清理缺陷。当预分配区段的 NOCOW 写入成功但后续 COW 写入因空间不足失败时，错误处理路径未正确清除 folio 脏标志并解锁，导致内核触发 VM_BUG_ON_FOLIO 断言崩溃。本地低权限攻击者可通过构造特定 btrfs 文件系统操作（如触发 cow_file_range 返回 -ENOSPC）引发拒绝服务。该漏洞影响 Linux 内核 btrfs 模块，CVSS 评分 5.5，危害等级中等。"
published = "2025-02-27T02:15:10Z"
remediation = "立即将 Linux 内核升级至 6.12.13、6.13.2 或 6.14 及以上版本（对应修复 commit：5ae72abbf91eb、2434533f1c963、c2b47df81c8e2）。Ubuntu 22.04 LTS 用户请安装 USN-7653-1 安全更新：sudo apt update && sudo apt install linux-image-generic。如无法立即升级内核，可临时禁用 btrfs 文件系统的预分配（prealloc）功能作为缓解措施，但建议优先安排内核热重启完成升级。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Kernel Btrfs 内存页清理不当导致拒绝服务漏洞"
updated = "2026-06-17T08:14:21Z"

