[basic]
description = ".NET Framework、SharePoint Server 和 Visual Studio 存在反序列化远程代码执行漏洞。攻击者可通过向目标 SharePoint 服务器发送特制请求，触发 .NET 反序列化机制中的不安全类型解析，从而在服务器上下文中执行任意代码。该漏洞影响 Microsoft SharePoint Server 2019、.NET Framework 4.x 及 Visual Studio 2019 等多个产品。攻击者无需身份认证即可利用，已出现野外在野利用。Microsoft 已在 2020 年 6 月安全更新中修复此漏洞。"
published = "2020-07-14"
remediation = "立即安装 Microsoft 2020 年 7 月安全更新，通过 Windows Update 或 Microsoft Update Catalog 获取补丁。受影响版本包括：.NET Framework 4.6/4.7/4.8、.NET Core 2.1/3.1、SharePoint Server 2010/2013/2016/2019、Visual Studio 2017/2019。对于 SharePoint Server，升级至最新累积更新；对于 .NET Core，升级至 2.1.21 或 3.1.7 及以上版本。如无法立即打补丁，在 SharePoint 中禁用不受信任的 XML 文件上传功能作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Microsoft SharePoint Server 远程代码执行漏洞"
updated = "2020-07-14"

