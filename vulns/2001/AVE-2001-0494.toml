[basic]
description = "多种 RADIUS 实现（包括 Xtradius 1.1 Pre1/Pre2 等版本）在处理 Vendor-Specific 属性时未正确校验 Vendor-Length 字段，当该字段值小于 2 时触发越界读取，导致服务进程崩溃。远程攻击者无需认证即可通过向 RADIUS 服务发送特制的认证或计费请求包触发此漏洞，造成拒绝服务。该漏洞影响大量使用 RADIUS 协议的网络接入设备与认证服务器。"
published = "2002-03-04T05:00:00Z"
remediation = "建议立即升级受影响的 RADIUS 服务端软件：Cistron Radius 升级到 1.6.6 或更高版本，FreeRADIUS 升级到 0.4 或更高版本，GnuRADIUS 升级到 0.96 或更高版本，XTRADIUS 升级到 1.2.1 或更高版本，YARD Radius 升级到 1.0.20 或更高版本，Radiator 升级到 2.6 或更高版本。Red Hat Linux 用户应安装 RHSA-2002-030 安全更新。FreeBSD 用户应升级到 4.5-RELEASE 或更新版本。如无法立即打补丁，可在网络边界防火墙配置规则过滤 Vendor-Length 异常的 RADIUS 数据包（UDP 1812/1813 端口）作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "多款 RADIUS 实现 Vendor-Specific 属性拒绝服务漏洞"
updated = "2026-06-16T21:56:09Z"

