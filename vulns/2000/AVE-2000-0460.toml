[basic]
description = "Netscape Professional Services FTP Server 1.3.6 存在目录遍历漏洞，远程攻击者无需身份认证即可通过向 FTP 服务发送包含 `..`（点点）序列的特制路径请求，突破目录限制读取服务器上的任意文件。该漏洞源于服务器对用户输入的文件路径缺乏充分的过滤与验证，攻击者可利用此漏洞窃取敏感配置文件、密码文件等任意系统文件，导致机密信息泄露。CVSS 评分 10.0，危害等级严重。Exploit-DB 上已有公开利用代码。"
published = "2000-06-21T04:00:00Z"
remediation = "该漏洞影响已停产的 Netscape Professional Services FTP Server 1.3.6，厂商早已不存在，无官方补丁可用。建议立即将该 FTP 服务迁移至受支持的替代方案（如 vsftpd、ProFTPD 等），或在服务端对用户输入路径进行严格的 `../` 过滤和规范化校验，同时限制匿名用户的目录访问权限。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Netscape Professional Services FTP Server 目录遍历漏洞"
updated = "2026-06-16T21:52:02Z"

