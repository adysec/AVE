[info]
author = "AVE"
description = "检测 Kentico CMS 的 /CMSInstall/install.aspx 安装页面是否可被未经认证的远程攻击者直接访问，该页面缺乏权限校验，结合管理后台可导致全局管理员权限提升。"
id = "POC-AVE-2017-0062"
name = "Kentico CMS 安装页面权限提升漏洞 PoC"
severity = "critical"
tags = [
    "cve-2017-17736",
    "kentico",
    "cms",
    "install",
    "unauth",
]
vuln_id = [
    "CVE-2017-17736",
    "AVE-2017-0062",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/CMSInstall/install.aspx"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Kentico",
    "Database Setup",
    "SQLServer",
]

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Database Setup",
    "SQLServer",
]
