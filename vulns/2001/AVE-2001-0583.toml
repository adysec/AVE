[basic]
description = "KTH Kerberos IV 的 kdc_reply_cipher 函数存在缓冲区溢出漏洞，远程攻击者可通过向 Kerberos 服务发送特制的超长认证请求触发该漏洞，导致目标系统拒绝服务，甚至可能执行任意代码。该漏洞影响 KTH Kerberos IV 相关版本，CVSS 评分 7.2，危害等级高。建议升级到最新版本或应用厂商提供的补丁。"
published = "2001-02-16T05:00:00Z"
remediation = "立即升级 KTH Kerberos IV 至已修复版本（如 eBones 1.0.1 或更高版本），或迁移至 MIT Kerberos 5 / Heimdal 等仍在维护的 Kerberos 实现。如无法升级，在 KDC 服务器上配置防火墙限制仅允许可信网络访问 Kerberos 服务端口（TCP/UDP 750 和 88），并监控认证请求中的异常长数据包。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "KTH Kerberos IV kdc_reply_cipher 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:31Z"

