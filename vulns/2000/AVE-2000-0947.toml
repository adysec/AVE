[basic]
description = "Microsoft Internet Explorer 5.5 的 Web 文件夹显示功能存在本地权限提升漏洞。本地用户可通过修改 Folder.htt 文件，并利用 ShellDefView ActiveX 控件中的 InvokeVerb 方法，为文件夹中列出的第一个文件指定默认执行选项，从而插入木马程序。该漏洞影响 Windows 98 系统上的 IE 5.5，攻击者需具有本地访问权限，成功利用后可导致任意代码执行，CVSS 评分 4.6，危害等级中危。"
published = "2000-10-20T04:00:00.000"
remediation = "该漏洞影响已停止支持的 Windows 98 和 Internet Explorer 5.5，微软未发布官方补丁。建议立即升级到受支持的 Windows 版本（如 Windows 10/11），并迁移至现代浏览器（如 Microsoft Edge）。如无法升级，应限制本地用户对 Folder.htt 文件的写入权限，并禁用 ShellDefView ActiveX 控件。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Internet Explorer 5.5 木马程序插入漏洞"
updated = "2026-06-16T21:52:29.193"

