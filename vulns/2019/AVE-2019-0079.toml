[basic]
description = "OpenEMR 是一款广泛使用的开源电子病历管理系统。该漏洞存在于 custom/ajax_download.php 文件中，攻击者通过 fileName 参数构造路径遍历请求，可下载服务器上 www-data 用户可读的任意文件。此外，若目标文件对 www-data 用户可写且 /var/www/openemr/sites/default/documents/cqm_qrda/ 目录存在，该文件将被删除。此漏洞影响 5.0.2 之前的所有 OpenEMR 版本，攻击者需要具备有效的系统账户凭据才能利用。"
published = "2019-08-13T14:15:12Z"
remediation = "升级 OpenEMR 至 5.0.2 或更高版本，该版本已修复 custom/ajax_download.php 中 fileName 参数路径遍历漏洞（补丁见 https://github.com/openemr/openemr/pull/2592）。若暂时无法升级，可通过 Web 服务器配置限制对 custom/ajax_download.php 的访问权限，仅允许可信 IP 访问该文件，或暂时禁用该文件作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "OpenEMR 路径遍历漏洞"
updated = "2026-06-17T02:18:35Z"

