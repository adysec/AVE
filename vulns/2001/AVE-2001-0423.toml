[basic]
description = "Oracle 8.0.6 至 9.0.1 版本中的 DBSNMP 组件存在缓冲区溢出漏洞，由于未对 ORACLE_HOME 环境变量长度进行有效边界检查，本地攻击者可通过设置超长 ORACLE_HOME 环境变量触发缓冲区溢出，导致以 DBSNMP 进程权限执行任意代码，可能造成敏感信息泄露、系统数据篡改或服务中断。攻击者需拥有本地操作系统访问权限，无需身份认证即可利用。"
published = "2001-11-30T05:00:00Z"
remediation = "升级 Oracle 数据库至 9.2.0 及以上版本，该漏洞已在 Oracle Critical Patch Update 中修复。如无法升级，移除 dbsnmp 程序的 setuid 权限（chmod u-s $ORACLE_HOME/bin/dbsnmp），并限制仅授权管理员可本地登录数据库服务器。"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Oracle 8/9i DBSNMP 缓冲区溢出漏洞"
updated = "2026-06-16T21:55:16Z"

