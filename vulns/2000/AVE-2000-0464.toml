[basic]
description = "Canna 输入系统中存在远程缓冲区溢出漏洞，远程攻击者可通过向目标系统发送特制的 SR_INIT 命令，其中包含超长的用户名或组名字段，触发缓冲区溢出，导致任意代码执行。该漏洞影响 Canna 3.5 b2 及更早版本，CVSS 评分 10.0，危害等级严重，且已有公开的利用代码，攻击者无需身份认证即可远程利用。"
published = "2000-07-02T04:00:00Z"
remediation = "升级 Canna 至 3.2.2 或更高版本（FreeBSD 用户通过 ports 更新并重新编译），或直接卸载 Canna 软件包。如无法升级，创建 /etc/hosts.canna 文件限制仅允许本地主机（localhost/unix）访问，或使用 ipfw/ipf 防火墙限制对 Canna 服务端口的远程访问。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Canna Canna 输入系统远程缓冲区溢出漏洞"
updated = "2026-06-16T21:52:03Z"

