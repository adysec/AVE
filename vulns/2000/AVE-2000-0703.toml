[basic]
description = "HP-UX 11.00/10.20 系统中的 crontab 工具存在符号链接跟随漏洞（CWE-59）。本地低权限攻击者可通过 crontab 的 -e 选项编辑定时任务时，在 /tmp 目录下创建指向目标文件（如 /etc/shadow）的符号链接，随后退出编辑会话，crontab 在读取链接文件时产生的错误信息会泄露文件内容，导致任意文件读取。该漏洞影响 HP-UX 10.20 及 11.00 版本，CVSS 评分 5.5，危害等级中危。攻击者需具备本地登录权限，无需用户交互即可利用。"
published = "2000-12-19T05:00:00.000"
remediation = "立即升级到 HP-UX 11.11（11i）或更高版本，该版本已修复 crontab 符号链接竞争条件问题。如无法升级，可移除 crontab 的 setuid 位（chmod u-s /usr/bin/crontab）以消除本地提权读取任意文件的攻击面，同时通过 crontab.allow 严格控制可执行 crontab 的用户白名单，并监控 /tmp 目录下异常符号链接创建行为。"
score = 5.5
severity = "MEDIUM"
sources = ["cve"]
title = "HP HP-UX crontab 任意文件读取漏洞"
updated = "2026-06-16T21:52:53.140"

