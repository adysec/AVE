[basic]
description = 'Phorum 3.0.7 版本的 violation.php3 脚本存在邮件中继漏洞，未经身份认证的远程攻击者可通过构造特制的 HTTP 请求，任意设置 Mod 和 ForumName 参数，使 Phorum 论坛向任意邮件地址发送邮件。攻击者可利用该漏洞将受影响的 Phorum 服务器作为"垃圾邮件代理"，大规模发送未经授权的邮件，造成服务器资源滥用、IP 信誉受损及网络通信干扰。该漏洞影响使用 Phorum 3.0.7 版本部署的在线论坛系统，攻击者无需登录即可利用，攻击条件简单，攻击复杂度低，危害等级中等。'
published = "2000-12-31T05:00:00Z"
remediation = "立即将 Phorum 升级至 5.x 或更高稳定版本，彻底移除或重命名 includes/violation.php3 文件；如暂时无法升级，应在 Apache/Nginx 配置中添加对 violation.php3 的访问 deny 规则，并在 php.ini 中禁用 PHP mail 函数的 SMTP 中继功能或限制邮件发送仅面向本地域。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Phorum 3.0.7 violation.php3 任意邮件转发漏洞"
updated = "2026-06-16T21:53:26Z"

