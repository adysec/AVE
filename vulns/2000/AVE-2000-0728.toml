[basic]
description = "BSD 系统的 libutil 库中 pw_error 函数存在格式化字符串漏洞，本地攻击者可通过在 chpass 或 passwd 等命令中输入特制的畸形密码字符串触发该漏洞，导致 pw_error 函数错误解析用户输入，进而实现权限提升获取 root 权限。该漏洞影响多个 BSD 衍生系统，攻击者需拥有本地账户即可利用，危害等级高。"
published = "2000-12-19T05:00:00Z"
remediation = "立即升级到已修复的 BSD 版本：FreeBSD 升级到 3.5.1 或 4.2 以上（安装 FreeBSD-SA-00:58 补丁），NetBSD 升级到 1.5 以上（安装 NetBSD-SA2000-015 补丁），OpenBSD 升级到 2.8 以上或应用 OpenBSD 2.7 errata 025 补丁。如无法立即升级，可临时移除 chpass 的 setuid 位作为缓解措施：执行 `chmod u-s /usr/bin/chpass` 和 `chmod u-s /usr/bin/passwd`，但这会禁用普通用户的密码修改功能。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "BSD libutil pw_error 格式化字符串本地权限提升漏洞"
updated = "2026-06-16T21:52:55Z"

