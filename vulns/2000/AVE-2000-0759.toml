[basic]
description = "Check Point Firewall-1 会话代理（Session Agent）3.0 至 4.1 版本存在用户名枚举漏洞。该漏洞源于系统对无效用户名和无效密码返回不同的错误提示信息，导致远程攻击者可通过字典攻击方式，首先枚举出系统中存在的有效用户名，再针对有效账户进行密码暴力破解。攻击者无需身份认证即可远程利用该漏洞，成功后可获取目标防火墙的管理访问权限，进而控制整个网络安全策略。Exploit-DB 已公开该漏洞的利用代码（ID: 20216）。"
published = "2000-12-11T05:00:00.000"
remediation = "升级 Check Point Firewall-1 至 4.1 Service Pack 2 或更高版本（官方已修复用户名/密码错误信息差异问题），或升级至 NG (Next Generation) 系列。如无法升级，在 session agent 配置中启用统一错误返回（set unified_error_messages=yes），同时在防火墙上限制 session agent 管理端口的访问来源 IP，并实施账户锁定策略（连续失败 5 次锁定 30 分钟）以缓解暴力破解风险。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Check Point Firewall-1 Session Agent 用户名枚举漏洞"
updated = "2026-06-16T21:53:01.320"

