[info]
author = "ave"
description = '通过恶意 Java Applet 利用 Microsoft VM 中 com.ms.jdbc.odbc.JdbcOdbc 类的构造函数，传入以空字符结尾的 DLL 路径（如 C:\mydll\000），导致 JVM 加载并执行攻击者指定的任意 DLL，验证目标是否存在该远程代码执行漏洞'
id = "POC-AVE-2002-0455"
name = "Microsoft VM JDBC Class DLL Loading PoC"
severity = "high"
tags = ["ave-2002-0455"]
vuln_id = [
    "CVE-2002-0866",
    "AVE-2002-0455",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/JdbcOdbcLoader.class"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["CA FE BA BE"]
