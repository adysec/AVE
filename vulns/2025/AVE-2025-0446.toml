[basic]
description = "GNU Binutils 2.45 版本的链接器组件中，bfd/elfcode.h 文件的 elf_swap_shdr 函数存在基于堆的缓冲区溢出漏洞。本地攻击者可通过构造恶意的 ELF 文件触发该漏洞，导致目标系统上的程序崩溃或潜在的内存数据破坏。该漏洞需要本地访问权限，攻击复杂度较低，CVSS 评分 1.9，危害等级低。厂商已在 commit 9ca499644a21ceb3f946d1c179c38a83be084490 中修复，建议升级至 Binutils 2.46 版本。"
published = "2025-09-27T23:15:32Z"
remediation = "升级 GNU Binutils 至 2.46 或更高版本（官方已确认 2.46 修复此问题）。SUSE Linux 用户请安装 SUSE-SU-2025:4096-1 安全更新。如无法立即升级，可应用补丁 9ca499644a21ceb3f946d1c179c38a83be084490 手动修补 bfd/elfcode.h 中 elf_swap_shdr 函数的堆缓冲区溢出问题，并避免对不可信二进制文件执行链接操作作为临时缓解措施。"
score = 1.9
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils 链接器 elfcode.h 基于堆的缓冲区溢出漏洞"
updated = "2026-06-17T08:29:36Z"

