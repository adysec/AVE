[basic]
description = "Thumbor 是一款开源的图片缩略图服务，其 HMAC-SHA1 签名验证机制存在绕过漏洞。由于在移除 URL 中的签名时使用了 Python 的 `.replace()` 方法，该方法会删除字符串中所有匹配的子串而非仅第一个，攻击者可在 URL 路径中插入多个签名副本。当服务端执行签名移除操作后，实际用于验证的 URL 与原始请求 URL 产生差异，从而绕过 HMAC 验证。未经身份认证的远程攻击者可利用此漏洞加载任意域名的图片资源，将 Thumbor 服务用作开放代理或图片抓取器，绕过域名白名单限制。该漏洞影响 Thumbor 7.8.0 之前的所有版本，CVSS 评分 8.2，危害等级高。官方已在 7.8.0 版本中通过限制仅移除第一个签名出现位置的方式修复此漏洞。"
published = "2026-07-31T19:17:09Z"
remediation = "立即升级 Thumbor 至 7.8.0 或更高版本（commit e3ae3e25005），该版本已将签名移除逻辑改为仅替换首次出现。如无法升级，可临时在反向代理层（如 Nginx）配置规则拦截含重复 hash 片段的请求路径，或限制 Thumbor 实例仅允许白名单域名加载图片。"
score = 8.2
severity = "HIGH"
sources = ["ghsa"]
title = "Globo Thumbor HMAC验证绕过漏洞"
updated = "2026-07-31T20:16:51Z"

