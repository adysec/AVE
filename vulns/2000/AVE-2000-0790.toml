[basic]
description = 'AOL Instant Messenger（AIM）4.3.2229 之前版本存在缓冲区溢出漏洞。远程攻击者无需身份认证即可向目标用户发送特制的 "buddyicon" 命令，其中包含超长 "src" 参数，触发缓冲区溢出，从而在目标系统上执行任意代码。该漏洞影响 AIM 4.0/4.1.2010/4.2.1193 等版本，CVSS 评分 7.5，危害等级高。'
published = "2001-01-09T05:00:00.000"
remediation = "立即升级 AOL Instant Messenger 至 4.3.2229 或更高版本，该版本已修复 buddyicon 命令中长 src 参数导致的缓冲区溢出。由于 AOL 已于 2017 年 12 月 15 日停止 AIM 服务，建议彻底卸载 AIM 并迁移至其他受支持的即时通讯软件，同时在网络层面阻止 AIM 协议流量以防止利用。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "AOL Instant Messenger BuddyIcon 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:08.013"

