[basic]
description = "Stalker CommuniGate Pro 3.3.2 的 POP3 守护进程存在用户名枚举漏洞。该漏洞源于服务器对无效用户名和无效密码返回不同的错误提示信息，导致远程攻击者无需认证即可通过向 POP3 端口发送登录请求，根据服务器返回的差异判断邮箱账号是否存在。攻击者可利用此漏洞批量枚举有效邮件地址，进而用于垃圾邮件攻击或暴力破解密码，威胁用户账户安全。该漏洞影响 CommuniGate Pro 3.3.2 版本，CVSS 评分 5.0，危害等级中危。"
published = "2000-12-11T05:00:00Z"
remediation = "立即将 Stalker CommuniGate Pro 升级至 3.3.3 或更高版本，该版本已修复 POP3 服务对不同错误消息的区分问题。如无法升级，可在 POP3 服务配置中启用统一错误响应（将无效用户名和无效密码返回相同错误信息），并在防火墙层面限制 POP3 端口（110/TCP）仅允许受信任 IP 访问，同时部署 SMTP 发件人验证和反向 DNS 检查以降低 SPAM 风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Stalker CommuniGate Pro POP3 用户名枚举漏洞"
updated = "2026-06-16T21:52:56Z"

