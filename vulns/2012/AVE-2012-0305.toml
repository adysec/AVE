[basic]
description = "Apple Safari 6.0 之前版本所使用的 WebKit 渲染引擎存在内存破坏漏洞，远程攻击者可通过构造恶意网页向目标系统发送特制数据触发该漏洞，导致任意代码执行或应用程序崩溃拒绝服务。该漏洞影响所有使用 WebKit 的 Apple Safari 浏览器早期版本，攻击者仅需诱导用户访问恶意网页即可在无需身份认证的情况下完成利用，CVSS 评分 9.3，危害等级严重，Apple 已在 2012 年 7 月的安全更新中修复此漏洞。"
published = "2012-07-25T20:55:03Z"
remediation = "将 Safari 升级至 6.0 或更高版本，并确保 OS X Lion 已更新至 v10.7.4；iOS 设备升级至 iOS 6.0。WebKit 内存损坏问题已通过改进内存处理得到修复。如无法立即升级，应避免访问不受信任的网站作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:36Z"

