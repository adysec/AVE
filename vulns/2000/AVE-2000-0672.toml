[basic]
description = 'Hassan Consulting Shopping Cart 1.18 版本的 shop.cgi 程序存在目录遍历漏洞，远程攻击者可通过在 page 参数中提交 ".." 路径遍历序列，绕过目录限制读取服务器上任意文件。该漏洞无需身份认证即可远程利用，攻击复杂度低，主要影响文件系统机密性，可导致敏感配置文件、源代码或系统文件泄露。CVSS 评分 5.0（中等危害），属于路径遍历类漏洞（CWE-22）。'
published = "2000-12-19T05:00:00.000"
remediation = "建议升级到 Hassan Consulting Shopping Cart 1.19 或更高版本（已修复目录遍历漏洞）。若无法升级，需在 shop.cgi 中对 page 参数实施严格输入验证：限制仅允许字母数字字符，禁止使用 ../ 等路径遍历序列，并使用 chroot 或安全路径拼接函数将文件访问限制在指定购物车目录内。同时在 Web 服务器层面配置目录访问控制，禁止 CGI 脚本访问应用目录以外的文件系统路径。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "哈桑咨询购物车1.18目录遍历漏洞"
updated = "2026-06-16T21:52:46.263"

