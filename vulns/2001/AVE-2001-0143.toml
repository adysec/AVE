[basic]
description = "标签包裹。<value>MSHTML.DLL 的 HTML 解析器在处理 JavaScript 脚本时存在逻辑缺陷，远程攻击者可通过构造包含恶意脚本的网页，在浏览器窗口中创建并删除与窗口对象关联的特定对象来触发该漏洞，导致 Internet Explorer 4.0 及 Outlook 2000/5.5 等使用 MSHTML 渲染引擎的应用程序发生拒绝服务崩溃。该漏洞无需身份认证即可远程利用，攻击复杂度低，仅影响目标系统的可用性。"
published = "2001-06-02T04:00:00Z"
remediation = '立即升级 Internet Explorer 至 IE 5.5 Service Pack 2 或更高版本（IE 6.0 及以上），该漏洞已在后续服务包中修复。升级方式为通过 Microsoft 官网下载最新 IE 版本安装，或通过 Windows Update 自动更新。如暂无法立即升级，应在 IE 的"Internet 选项→安全→自定义级别"中禁用"活动脚本"（Active Scripting），以阻止恶意网页通过 JavaScript 触发 MSHTML.DLL 栈溢出崩溃，此临时缓解措施会阻止所有网页脚本执行，可能影响部分网页正常功能。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Internet Explorer 4 / Outlook 2000/5.5 MSHTML.dll 拒绝服务漏洞"
updated = "2026-06-16T21:54:05Z"

