[basic]
description = "QSSL Voyager 2.0 1B 网络服务器在演示磁盘版本中存在目录信息泄露漏洞。其 web 文档根目录下的 .photon 文件夹存储了敏感的 Web 客户端信息，包括用户认证凭证和配置细节。未经身份验证的远程攻击者可直接访问该目录，通过普通 HTTP 请求获取敏感信息，导致用户信息泄露和潜在的安全风险。该漏洞影响 Windows、Linux 等平台，CVSS 评分 5.0，危害等级中等，已在 2000 年 12 月的补丁更新中修复。"
published = "2000-12-19T05:00:00.000"
remediation = '建议立即升级至 QNX Neutrino RTOS 6.5 或更高版本（已停止支持 QNX 4.x），并迁移至现代 Web 服务器（如 nginx/Apache）。若必须维持旧系统，请立即删除 Web 文档根目录下的 .photon 目录，并在 Web 服务器配置中添加规则拒绝访问所有以点开头的隐藏目录（如 Apache 配置：<Directory ~ "^\."> Require all denied </Directory>），同时在防火墙层面限制 Web 服务仅允许可信 IP 访问作为临时缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "QSSL Voyager 2.0 1B 目录信息泄露"
updated = "2026-06-16T21:52:43.850"

