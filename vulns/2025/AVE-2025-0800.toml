[basic]
description = "Windows Hyper-V NT Kernel Integration VSP（虚拟化服务提供程序）存在基于堆的缓冲区溢出漏洞（CWE-122）。该漏洞源于对 WNF（Windows Notification Facility）状态数据及 I/O 环 IOP_MC_BUFFER_ENTRY 处理不当，导致在 Hyper-V 主机与虚拟机通信的 VSP 组件中发生堆缓冲区溢出。本地攻击者需先获得目标系统低权限账户，通过精心构造的 I/O 环请求触发溢出，从而将权限提升至 SYSTEM 级别，实现完全控制受影响系统。该漏洞影响 Windows Server 2025 Hyper-V 角色，CVSS 评分 7.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新（KB5050021）中修复此漏洞。"
published = "2025-01-14T18:15:58Z"
remediation = "安装 Microsoft 2025 年 1 月安全更新 (KB5050021)，该更新修复了 Hyper-V NT Kernel Integration VSP 的堆缓冲区溢出漏洞。可通过 Windows Update 自动获取更新，或从 Microsoft 更新目录网站手动下载安装。如无法立即打补丁，建议限制受影响主机的本地登录权限，仅允许受信任管理员账户登录 Hyper-V 宿主机。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Hyper-V NT Kernel Integration VSP 权限提升漏洞"
updated = "2026-06-17T08:43:07Z"

