[basic]
description = "InfluxDB 在其 1.7.6 版本之前使用 JWT 进行 API 认证，但默认配置中 JWT 的共享密钥（shared-secret）为空字符串。services/httpd/handler.go 中的 authenticate 函数在校验 JWT 令牌时未正确验证共享密钥是否存在，导致攻击者无需掌握有效密钥即可伪造任意用户身份（如 admin）的 JWT 令牌。未经身份认证的远程攻击者只需构造一个带有空签名的 HS256 算法 JWT 令牌（Payload 中包含目标用户名及未来过期时间戳），通过 HTTP 请求头 Authorization: Bearer 发送至 InfluxDB 的 /query 接口，即可绕过认证并执行任意 InfluxQL 查询语句，进而读取、篡改或删除数据库中的敏感时序数据。该漏洞影响所有未强制配置 shared-secret 的 InfluxDB 1.x 早期版本，CVSS v3.1 评分为 9.8（严重等级），攻击复杂度低，无需交互，可远程利用。InfluxData 已在 1.7.6 版本中修复此问题，建议用户升级至安全版本并在配置文件中显式设置高强度 JWT 共享密钥。"
published = "2020-11-19T02:15:11.913"
remediation = "立即升级 InfluxDB 至 1.7.6 或更高版本。在配置文件的 [http] 段中设置非空的 shared-secret 以修复 JWT 认证绕过，若当前未使用 JWT 认证，可直接设置 auth-enabled = false 禁用 HTTP 认证。如暂无法升级，建议通过防火墙或安全组限制 8086 端口的访问来源，仅允许可信网络访问。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "InfluxDB JWT Token 认证绕过漏洞"
updated = "2026-06-17T02:31:27.150"

