[basic]
description = "Visual Studio 6.0 企业版中的 VB-TSQL 调试器对象（vbsdicli.exe）存在缓冲区溢出漏洞，攻击者可利用该组件在处理调试会话时的内存边界检查缺失，通过向目标系统发送特制的恶意数据包触发堆栈溢出，进而执行任意系统命令。该漏洞影响 Visual Studio 6.0 企业版用户，攻击者无需身份认证即可通过网络远程发起利用，CVSS 评分 7.5，危害等级高。Microsoft 已在后续安全更新中修复此漏洞，建议受影响用户及时升级至更高版本。"
published = "2001-05-03T04:00:00Z"
remediation = "建议立即安装 Microsoft Visual Studio 6.0 Enterprise Edition 安全补丁（知识库文章 Q281297），或升级到 Visual Studio 6.0 Service Pack 6。如无法立即打补丁，可在防火墙层面阻断 137-139 及 445 端口作为临时缓解措施，并确保 Visual Studio 6.0 Enterprise Edition 未在不信任的网络上暴露 DCOM 服务。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Visual Studio 6.0 VB-TSQL 调试器缓冲区溢出漏洞"
updated = "2026-06-16T21:53:46Z"

