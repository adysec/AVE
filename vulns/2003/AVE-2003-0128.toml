[basic]
description = "tags.<value>Linux kernel 2.4.21 及之前版本中的 NFSv3 XDR 解码函数 decode_fh 存在整数符号错误漏洞。远程攻击者可在未经身份验证的情况下，向开启 NFSv3 服务的目标系统发送包含负值 size 字段的特制 XDR 数据包，触发内核 panic 导致拒绝服务。该漏洞影响运行 2.4.x 系列内核的 Linux 系统，攻击者只需能够访问 NFS 端口即可利用此漏洞，无需任何权限或凭据，利用方式简单且可直接导致系统重启或服务中断，危害中等。"
published = "2003-08-27T04:00:00Z"
remediation = "建议将 Linux 内核升级至 2.4.21 或更高版本，以修复 decode_fh 函数中的整数符号错误。如暂时无法升级，可临时禁用 NFSv3 服务，或在防火墙层面限制 2049/UDP 端口的访问来源，仅允许可信客户端访问 NFS 服务。Red Hat 系统应安装 RHSA-2003-198 安全更新补丁。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux Kernel NFSv3 XDR 解码远程拒绝服务漏洞"
updated = "2026-06-16T22:02:31Z"

