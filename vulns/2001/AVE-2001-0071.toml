[basic]
description = "WU-FTPD 2.6.1 及更早版本在调试模式启用时存在格式字符串漏洞。未经身份认证的远程攻击者可向目标 FTP 服务发送包含特制格式字符串的畸形参数，该参数会被记录于 PASV 端口赋值过程中，攻击者借此执行任意系统命令。该漏洞影响 WU-FTPD 2.4.2、2.5、2.6 等多个版本，攻击条件仅为目标 FTP 服务可达且调试模式开启，无需任何身份凭据即可完成利用。"
published = "2001-03-26T05:00:00Z"
remediation = "建议立即将 WU-FTPD 升级至 2.6.2 或更高版本，该版本已修复此格式字符串漏洞。如无法立即升级，可从 ftp://ftp.wu-ftpd.org/pub/wu-ftpd/patches/apply_to_current/missing_format_strings.patch 下载并应用官方补丁。同时，编辑 /etc/inetd.conf，移除 ftpd 启动参数中的 -v 或 -d 调试选项以禁用调试模式，执行 killall -HUP inetd 重启服务。临时缓解措施还包括在防火墙层面限制 FTP 服务仅允许可信来源 IP 访问。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "WU-FTPD wu-ftp 调试模式格式字符串远程代码执行漏洞"
updated = "2026-06-16T21:53:50Z"

