[basic]
description = "Google Chrome浏览器扩展程序存在数据验证不足漏洞。在132.0.6834.83版本之前，远程攻击者可构造恶意HTML页面，诱骗用户执行特定UI交互操作（如点击扩展图标或页面元素），利用扩展程序对输入数据缺乏充分验证的缺陷，实现权限提升并在浏览器沙箱外执行任意代码。该漏洞影响Windows、macOS、Linux及Android平台上的Chrome浏览器，攻击者需通过社会工程手段诱导用户完成特定手势才能成功利用。"
published = "2025-01-15T11:15:10Z"
remediation = "立即将 Google Chrome 更新至 132.0.6834.83 或更高版本（通过菜单→帮助→关于 Google Chrome 自动检查更新）。若使用 Chromium 内核浏览器（Edge、Brave 等），同步升级至对应修复版本。临时缓解：禁用不必要的扩展程序，避免点击不可信链接触发 UI 交互。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome Extensions 数据验证不足漏洞"
updated = "2026-06-17T08:26:29Z"

