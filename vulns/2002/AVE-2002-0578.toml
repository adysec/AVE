[basic]
description = "qmailadmin 1.0.x 版本存在本地缓冲区溢出漏洞。qmailadmin 在处理 QMAILADMIN_TEMPLATEDIR 环境变量时未对输入长度进行有效边界校验，导致缓冲区溢出。本地攻击者可通过设置一个超长的 QMAILADMIN_TEMPLATEDIR 环境变量并运行 qmailadmin 来利用该漏洞，从而提升系统权限，可能获得对邮件系统的未授权控制并执行任意代码。该漏洞影响所有部署 qmailadmin 1.0.x 版本的 qmail 邮件系统，攻击条件为攻击者已具有目标系统的本地访问权限，利用方式为通过环境变量注入触发缓冲区溢出以提权。"
published = "2003-04-11T04:00:00.000"
remediation = "立即将 qmailadmin 升级至 1.0.6 或更高版本，该版本对 QMAILADMIN_TEMPLATEDIR 环境变量的长度进行了边界检查，修复了缓冲区溢出问题。如暂时无法升级，可执行以下缓解措施：取消 qmailadmin 的 setuid 位（chmod u-s /usr/local/www/cgi-bin.default/qmailadmin/qmailadmin），并在 Web 服务器（如 Apache）的配置中清理或限制 QMAILADMIN_TEMPLATEDIR 环境变量，阻止本地用户通过超长路径触发溢出提权。"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "qmail qmailadmin 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:59:17.093"

