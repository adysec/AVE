[basic]
description = "tags.<value>Microsoft Windows 2000 的 Telnet 服务存在拒绝服务漏洞，本地已登录用户可通过调用特定系统调用强制终止 Telnet 会话连接，导致服务中断。该漏洞影响 Windows 2000 操作系统自带的 Telnet 服务组件，攻击者需要具备本地系统访问权限才能触发利用。成功利用后，Telnet 服务将无法正常响应客户端连接请求，造成服务不可用，影响远程管理功能的正常使用。"
published = "2001-07-21T04:00:00Z"
remediation = '应用 Microsoft 安全公告 MS01-031（KB Q299553）补丁程序，下载地址为 https://www.microsoft.com/download/details.aspx?FamilyId=0D0032E7-259D-4F68-BF08-B0A7CAA1FD1C，补丁适用于已安装 Windows 2000 Service Pack 1 或 Service Pack 2 的系统，安装后无需重启即可生效。若业务场景下无需 Telnet 服务，建议直接将其禁用：依次打开"控制面板→管理工具→服务"，找到"Telnet"服务并将启动类型设为"已禁用"，或通过"添加/删除 Windows 组件"卸载 Telnet 服务作为临时缓解措施。补丁安装后可通过注册表路径 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Updates\Windows 2000\SP3\Q299553 验证补丁是否成功安装。此外，建议在防火墙层限制 Telnet 端口（TCP 23）仅对受信任的内部管理网段开放，Telnet 服务不应部署于域控制器等关键服务器上，并尽快将系统升级至 Windows 2000 Service Pack 3 或更高版本，该版本已包含此漏洞的修复。'
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Microsoft Windows 2000 Telnet 服务拒绝服务漏洞"
updated = "2026-06-16T21:54:08Z"

