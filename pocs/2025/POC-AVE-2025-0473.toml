[info]
author = "AVE"
description = "检测 GNU Binutils 2.45 链接器 elf_x86_64_relocate_section 函数在处理特制 ELF 文件时触发的基于堆的缓冲区溢出漏洞。PoC 文件来自 sourceware Bugzilla 附件 #16393，通过运行 ld 链接器处理该特制 ELF 文件可触发堆溢出导致程序崩溃。"
id = "POC-AVE-2025-0473"
name = "GNU Binutils 链接器基于堆的缓冲区溢出 PoC"
severity = "low"
tags = ["cve-2025-11495"]
vuln_id = [
    "CVE-2025-11495",
    "AVE-2025-0473",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/tmp/CVE-2025-11495-poc.elf"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["ELF"]
