[basic]
description = "Quest KACE K1000系统管理设备的service/krashrpt.php脚本存在命令注入漏洞，该脚本在处理kuid参数时未对用户输入进行充分过滤和验证，远程攻击者可通过在请求参数中嵌入Shell元字符（如反引号、分号、管道符等）构造恶意payload，进而在目标服务器上执行任意操作系统命令。该漏洞影响6.4 SP3（6.4.120822）之前的所有版本，由于利用过程无需身份认证且目标服务默认网络可达，攻击者可利用此漏洞完全控制管理设备，窃取敏感凭据、篡改配置或进一步向内网横向移动，危害等级严重。Quest已在6.4 SP3版本中修复此漏洞。"
published = "2020-03-09T01:15:11.233"
remediation = "升级到 Quest KACE K1000 Systems Management Appliance 6.4 SP3（版本号 6.4.120822）或更高版本，该版本已在 service/krashrpt.php 中对 kuid 和 name 参数添加 escapeshellarg 调用以修复命令注入漏洞。如无法立即升级，建议通过防火墙或访问控制列表限制对管理界面的网络访问，仅允许可信 IP 段访问，或将 appliance 置于内网隔离区，防止未经授权的远程利用。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Quest KACE K1000 远程代码执行漏洞"
updated = "2026-06-17T02:30:35.790"

