[basic]
description = '9Router（AI 路由与令牌管理工具）的 `/api/settings/database` 接口存在敏感信息泄露与未授权数据库导入/导出漏洞。该接口仅依赖 JWT 或 CLI 令牌验证，但攻击者可通过默认密码 "123456" 获取有效令牌后，利用 GET 请求导出完整数据库，其中包含明文 API 密钥、OAuth 令牌、OIDC 客户端密钥等全部凭据；同时可通过 POST 请求导入任意 JSON 数据，触发数据库全表清空与替换操作，包括覆盖密码哈希值，从而实现完全数据库接管。该漏洞影响 0.4.80 之前的所有版本，CVSS 评分 9.9，危害等级严重，可导致全部存储机密泄露、数据库完整性破坏及服务可用性丧失。'
published = "2026-07-10T16:16:33Z"
remediation = '立即升级 9Router 至 v0.4.80 或更高版本（commit `0c7c9de00ae3`），该版本已修复 `/api/settings/database` 端点的认证缺陷。如无法立即升级，建议：1) 在反向代理层限制 `/api/settings/database` 路径仅允许白名单 IP 访问；2) 立即修改默认密码 "123456" 为强密码；3) 审查并轮换所有已暴露的 API Key 和 OAuth Token。'
score = 9.9
severity = "CRITICAL"
sources = ["ghsa"]
title = "decolua 9Router 敏感信息泄露与数据库接管漏洞"
updated = "2026-07-10T17:25:46Z"

