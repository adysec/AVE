[basic]
description = "Google Chrome 浏览器 Inspector 组件存在释放后使用（Use After Free）漏洞，CWE-416。攻击者可通过构造特制的 HTML 页面并诱使目标用户访问，触发已释放内存的非法访问，导致堆破坏，最终实现远程代码执行或信息泄露。该漏洞影响 Chrome 134.0.6998.88 之前版本，CVSS 评分 8.8，危害等级高，需用户交互方可利用。"
published = "2025-03-10T21:15:40.730"
remediation = "立即将 Google Chrome 升级至 134.0.6998.88 或更高版本，可通过 Chrome 菜单 > 帮助 > 关于 Google Chrome 检查更新并自动安装。企业用户可通过 Google Update 策略或 MSI 安装包批量推送更新。基于 Chromium 的浏览器（如 Edge、Brave）需同步更新至对应修复版本。该漏洞在 Chrome 134.0.6998.88 中已修复，无临时缓解措施，必须升级。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome Inspector 释放后使用漏洞"
updated = "2026-06-17T09:06:24.087"

