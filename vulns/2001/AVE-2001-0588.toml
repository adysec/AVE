[basic]
description = "Cisco 600 系列路由器上运行的 CBOS 2.4.1 及更早版本存在拒绝服务漏洞。远程攻击者可通过向目标路由器发送缓慢的 TCP SYN 数据包流，耗尽设备连接表资源，导致路由器无法处理新的合法连接请求，造成拒绝服务。该漏洞攻击复杂度低，无需身份认证即可远程触发，影响 Cisco 600 系列路由器的正常网络服务运行。"
published = "2001-02-16T05:00:00.000"
remediation = "升级 Cisco 600 系列路由器 CBOS 至 2.4.2 或更高版本。如无法升级，可在路由器上配置 TCP 拦截（TCP intercept）功能，限制半开连接数量，或在边界防火墙上设置 SYN 流量速率限制，丢弃异常高频的 SYN 数据包。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Cisco 600系列路由器 CBOS SYN数据包 拒绝服务漏洞"
updated = "2026-06-16T21:53:34.257"

