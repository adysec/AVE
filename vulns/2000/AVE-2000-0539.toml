[basic]
description = "CGI Script Center Account Manager 1.0 LITE 和 PRO 版本存在身份验证绕过漏洞，远程攻击者无需任何认证即可直接调用 amadmin.pl 脚本并传递 setpasswd 参数来修改管理员密码，从而获取系统管理权限。该漏洞利用方式简单，攻击者只需发送特制 HTTP 请求即可完成利用，CVSS 评分 7.5，危害等级高。"
published = "2000-10-20T04:00:00.000"
remediation = "立即升级 CGI Script Center Account Manager 至最新版本，或从服务器移除该软件。如必须继续使用，通过 Web 服务器配置（如 Apache 的 .htaccess 或 Nginx 的 location 规则）限制 amadmin.pl 脚本仅允许受信任 IP 访问，并添加 HTTP 基本认证。同时删除或重命名 amadmin.pl 文件以防止直接调用 setpasswd 参数。该软件已停止维护，建议迁移至其他受支持的账户管理方案。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "CGI Script Center Account Manager 远程认证绕过漏洞"
updated = "2026-06-16T21:52:16.410"

