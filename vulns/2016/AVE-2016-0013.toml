[basic]
description = "WordPress 的 admin-font-editor 插件 1.8 版本中存在反射型跨站脚本（Reflected XSS）漏洞，攻击者可通过构造包含恶意脚本的特制 URL，诱使目标用户点击后，恶意脚本在用户浏览器中执行，导致攻击者能够窃取会话 Cookie、重定向页面或篡改页面内容。该漏洞无需身份认证即可触发，但需要用户交互（点击链接），CVSS 评分 6.1，危害等级中危。建议升级插件至最新版本或移除该插件以修复漏洞。"
published = "2016-10-10T20:59:00Z"
remediation = '立即在 WordPress 后台插件管理中停用并删除 admin-font-editor 插件（版本 1.8 及更早版本均受影响）。由于该插件已永久关闭且不再更新，无可用补丁，彻底删除是唯一修复方案。如仍需管理后台字体，可选用仍在维护的替代插件如 "Use Any Font" 或 "Custom Fonts"。'
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress admin-font-editor Plugin 反射跨站脚本漏洞"
updated = "2026-06-17T00:38:43Z"

