[basic]
description = "Palo Alto Networks PAN-OS 管理接口存在远程命令执行漏洞，攻击者可通过向防火墙的管理界面发送特制请求，利用 readSessionVarsFromFile() 函数中的会话处理缺陷触发命令执行。该漏洞无需身份认证即可远程利用，影响 PAN-OS 6.1.19 之前、7.0.19 之前、7.1.14 之前及 8.0.6 之前版本。攻击者成功利用后可完全控制目标防火墙，获取敏感信息并实施横向移动。CVSS 评分 9.8，危害等级严重。Palo Alto Networks 已发布安全更新修复此漏洞。"
published = "2017-12-11T17:29:00Z"
remediation = "升级 PAN-OS 至 6.1.19、7.0.19、7.1.14 或 8.0.6 及以上版本。如无法立即升级，在管理接口上配置基于 IP 的访问控制列表（ACL），仅允许受信任的管理 IP 访问 443/22 端口，并将管理接口绑定至专用管理网络而非业务接口。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Palo Alto Networks PAN-OS 远程命令执行漏洞"
updated = "2026-06-17T01:08:31Z"

