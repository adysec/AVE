[basic]
description = 'SolarWinds Database Performance Analyzer 11.1.457 版本的 idcStateError 组件存在反射型跨站脚本漏洞（CWE-79），攻击者可通过构造恶意的 page 参数（/iwc/idcStateError.iwc?page=payload），将 JavaScript 代码注入至页面的 "Try Again" 按钮 HREF 属性中。当受害者点击该按钮时，恶意脚本在其浏览器上下文中执行，可窃取会话 Cookie、重定向至钓鱼页面或执行其他客户端攻击。该漏洞 CVSS 3.0 评分 6.1（中危），攻击向量为网络（AV:N），攻击复杂度低（AC:L），无需权限（PR:N）但需用户交互（UI:R），影响范围扩大（S:C），机密性和完整性影响较低（C:L/I:L），可用性无影响（A:N）。受影响版本为 11.1.457，攻击条件为诱导用户访问包含恶意 page 参数的特制链接。'
published = "2019-08-14T20:15:11Z"
remediation = "升级 SolarWinds Database Performance Analyzer 到最新版本（11.1.458或更高版本），官方已发布安全更新修复 idcStateError 组件的 XSS 漏洞。如无法立即更新，建议通过Web应用防火墙禁用对/page参数的反射处理，并添加内容安全策略（CSP）头部以阻止JavaScript执行，实现临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "SolarWinds Database Performance Analyzer idcStateError组件反射型跨站脚本漏洞"
updated = "2026-06-17T01:49:13Z"

