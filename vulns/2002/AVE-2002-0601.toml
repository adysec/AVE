[basic]
description = "phpGB 1.20 之前版本存在跨站脚本攻击（XSS）漏洞，由于对用户输入缺乏严格的过滤和转义，未经身份认证的远程攻击者可以在留言板页面中提交包含恶意 HTML 或 JavaScript 脚本代码的留言。当网站管理员在后台删除该留言条目时，注入的恶意脚本会在管理员的浏览器中执行。该漏洞影响所有使用 phpGB 1.20 及之前版本的网站，攻击者借此可窃取管理员会话 Cookie、执行未授权操作或进一步控制网站后台，CVSS 评分 6.8，危害等级中等。"
published = "2003-04-22T04:00:00Z"
remediation = "立即升级 phpGB 至 1.20 或更高版本，该版本修复了删除条目时的 XSS 漏洞。若暂时无法升级，请在代码层面对留言内容实施 HTML 实体编码转义（如使用 htmlspecialchars()），并在管理员删除操作前严格过滤用户输入的脚本标签，同时建议部署 WAF 拦截恶意脚本注入请求。"
score = 6.8
severity = "MEDIUM"
sources = ["exploitdb"]
title = "phpGB 留言本系统 跨站脚本攻击漏洞"
updated = "2026-06-16T21:59:24Z"

