[basic]
description = "ISC BIND 派生的 DNS 解析器代码（libc、glibc、libbind）中存在缓冲区溢出漏洞。远程恶意 DNS 服务器可通过向使用 stub 解析器的客户端发送特制的 DNS 响应数据触发该溢出，导致目标系统拒绝服务，在特定条件下可实现任意代码执行。攻击者无需身份认证即可远程利用，影响范围广泛，涉及大量使用上述库的 Linux/Unix 系统及网络设备。"
published = "2002-07-03T04:00:00Z"
remediation = "升级 glibc 至 2.2.5 及以上版本（Linux 发行版请使用包管理器更新：`apt-get install libc6` 或 `yum update glibc`），或升级 ISC BIND 至 8.3.3/9.2.1 及以上版本。如无法立即升级，可在 DNS 解析器层面配置可信上游 DNS 服务器（如 `/etc/resolv.conf` 中仅指定内部受控 DNS），并在边界防火墙上限制对外部 DNS 服务器的出站查询，降低被恶意 DNS 服务器攻击的风险。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "ISC BIND 派生 DNS 解析器代码（libc/glibc/libbind）缓冲区溢出漏洞"
updated = "2026-06-16T21:57:51Z"

