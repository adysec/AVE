[basic]
description = "Microsoft Windows Media Player 7.0 在处理自定义皮肤(.wms)文件时存在任意脚本执行漏洞。攻击者可通过构造包含恶意脚本的特制 .wms 皮肤文件，诱使用户在 Windows Media Player 中加载该文件，从而在当前用户权限下执行任意脚本代码。该漏洞影响 Windows Media Player 7.0 版本，攻击成功后可导致系统被控制或敏感信息泄露。Microsoft 已在 MS00-090 安全公告中发布修复补丁。"
published = "2001-01-09T05:00:00.000"
remediation = "立即安装 Microsoft 为 Windows Media Player 7 发布的 MS00-090 安全补丁（下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=BAF62356-D717-4B8F-97E0-299A7697A083），该补丁禁止皮肤文件中执行任意 ActiveX 对象。如无法安装补丁，可在 IE 安全设置中将 Internet 区域 ActiveX 控件和插件设为禁用，并避免打开来源不明的 .wms/.wmz/.wmd 皮肤文件。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows Media Player 7.0 任意脚本执行漏洞"
updated = "2026-06-16T21:53:10.350"

