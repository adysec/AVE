[info]
author = "ave"
description = "Apple iTunes 10.7 之前版本使用的 WebKit 引擎存在内存破坏漏洞，远程攻击者可通过构造恶意网页触发内存 corruption，导致任意代码执行或应用程序崩溃。验证方式：在目标系统上访问包含恶意 JavaScript 的网页，观察 iTunes 进程是否崩溃或出现异常行为。"
id = "POC-AVE-2012-0335"
name = "CVE-2012-3658 PoC"
severity = "medium"
tags = ["ave-2012-0335"]
vuln_id = [
    "CVE-2012-3658",
    "AVE-2012-0335",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
