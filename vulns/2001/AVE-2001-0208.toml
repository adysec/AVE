[basic]
description = "BIND 4 的 nslookupComplain 函数中存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向 DNS 服务器发送特制的查询请求触发该漏洞，导致缓冲区越界写入，最终实现以 root 权限执行任意代码。该漏洞影响所有运行 BIND 4 版本的 DNS 服务器，CVSS 评分 10.0，危害等级严重。由于 BIND 4 已停止维护，建议用户升级至 BIND 9 或更高版本以规避风险。"
published = "2001-02-12T05:00:00Z"
remediation = "立即升级 BIND 至 8.2.3 或更高版本（BIND 4 全系列已停止维护），或应用 ISC 官方补丁。Red Hat 用户安装 RHSA-2001:007 提供的更新包。如无法升级，在防火墙阻断外部对 DNS 53 端口的非授权访问，并限制 named 以非 root 权限运行。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "ISC BIND 4 nslookupComplain 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:29Z"

