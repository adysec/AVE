[basic]
description = "qdPM 9.1 项目管理系统存在跨站脚本（XSS）漏洞，由于 search[keywords] 参数未对用户输入进行充分的过滤和转义处理，攻击者可构造包含恶意 JavaScript 脚本的搜索关键词，当其他用户访问包含该恶意输入的页面时，脚本将在受害者浏览器中执行。该漏洞影响使用 qdPM 9.1 版本的系统，攻击者无需事先认证即可发起攻击，但需要诱使受害者点击恶意链接或访问包含恶意搜索结果的页面。成功利用该漏洞可导致用户会话劫持、敏感信息窃取、页面内容篡改等风险。"
published = "2019-05-14T15:29:00Z"
remediation = "升级到 qdPM 9.3 或更高版本，该版本已修复 search[keywords] 参数的跨站脚本漏洞。如暂无法升级，应对搜索关键词参数进行输入过滤与长度校验，对输出进行 HTML 实体编码，并在 Web 服务器或 WAF 层面过滤 &lt;script&gt;、onerror、javascript: 等危险内容，防止恶意脚本注入。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "qdPM 项目管理系统 跨站脚本漏洞"
updated = "2026-06-17T02:41:56Z"

