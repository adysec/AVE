[basic]
description = "Ollama 的 downloadBlob 函数中存在数组索引验证不当漏洞（CWE-129），远程攻击者无需认证即可向目标系统发送特制请求，触发越界内存访问，导致服务进程崩溃，造成拒绝服务。该漏洞影响 Ollama 部署环境，攻击者利用此漏洞可导致系统不可用，危害等级高危。"
published = "2026-07-13T22:16:46Z"
remediation = "建议立即升级 Ollama 至最新版本（≥0.8.0），该漏洞在 0.7.1 及之前版本的 downloadBlob 函数中存在数组索引验证缺陷，远程未认证攻击者可发送特制请求触发越界内存访问导致拒绝服务。如无法立即升级，可在反向代理层限制 /api/blobs/ 端点的请求速率和载荷大小，或通过防火墙限制对 Ollama API 端口的非信任来源访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["zdi"]
title = "Ollama downloadBlob 数组索引验证不当拒绝服务漏洞"
updated = "2026-07-14T20:59:10Z"

