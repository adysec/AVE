[basic]
description = "PHP-Nuke 4.x 至 5.3.1 及更早版本（可能包括 5.5 之前版本）的 index.php 中存在任意文件包含漏洞。远程攻击者可通过向 file 参数传递恶意 PHP 代码的 URL，利用该漏洞在目标服务器上执行任意 PHP 代码，导致敏感信息泄露、网站篡改或进一步渗透。攻击无需认证，仅需目标系统运行受影响版本的 PHP-Nuke 且 allow_url_fopen 选项开启即可触发。"
published = "2002-05-16T04:00:00Z"
remediation = "立即升级 PHP-Nuke 至 5.5 或更高版本，该版本已修复 index.php 中 file 参数未经验证即可包含远程文件的问题。如无法升级，在 php.ini 中设置 allow_url_include = Off 并禁用 allow_url_fopen，同时在代码层对 file 参数做白名单校验，仅允许包含本地预定义文件。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Francisco Burzi PHP-Nuke 任意文件包含漏洞"
updated = "2026-06-16T21:56:59Z"

