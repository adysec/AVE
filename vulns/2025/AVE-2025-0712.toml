[basic]
description = "Microsoft Edge 在 iOS 与 Android 平台上存在 URL 欺骗（Spoofing）漏洞（CWE-451），源于浏览器在渲染地址栏或页面信息时对内容缺少充分的身份校验，导致远程攻击者可构造特制链接，诱导用户点击后使地址栏显示与真实目标不一致的网址，从而伪装成可信站点。该漏洞归于无需认证与用户交互的网络安全向量，攻击者无需先登录目标系统，仅需诱使用户在受影响的移动版 Edge 中访问恶意页面即可触发，进而实施钓鱼、仿冒或其他社会工程攻击，危害等级为中等。Microsoft 已在 2025 年 2 月安全更新中对受影响的 Edge for iOS/Android 版本进行修复，建议用户及时更新至最新版本。"
published = "2025-02-06T23:15:08Z"
remediation = "建议通过 App Store（iOS）或 Google Play（Android）将 Microsoft Edge 升级至修复该漏洞的版本（Edge 135.0.3170.98 及更新版本），并开启应用自动更新以确保及时获得安全补丁。由于该漏洞为界面欺骗（CWE-451），可在升级完成前注意核对浏览器地址栏显示的网址是否为官方域名，警惕任何诱导访问的链接，避免在可疑页面输入敏感信息；同时在企业环境中可通过 MDM/Intune 策略统一推送并强制更新组织内 Edge，并在行为感知层面启用 Microsoft Entra 登录保护，作为无法立即升级时的临时缓解措施。"
score = 5.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Edge iOS Android 欺骗漏洞"
updated = "2026-06-17T08:42:54Z"

