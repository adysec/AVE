[info]
author = "ave"
description = "AVE-2002-0723 verification"
id = "POC-AVE-2002-0723"
name = "PoC for AVE-2002-0723"
severity = "medium"
tags = ["ave-2002-0723"]
vuln_id = ["AVE-2002-0723"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/"
protocol = "http"

[poc.requests.headers]
Connection = "keep-alive"
Host = "{{BaseURL}}"
User-Agent = "AVE-PoC/1.0"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = [
    "230",
    "Login successful",
]
