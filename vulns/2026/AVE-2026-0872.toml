[basic]
description = "Composer（PHP 依赖管理器）在处理包的 composer.json 中 bin 字段时存在路径遍历漏洞。恶意包可在 bin 条目中插入 .. 路径段，使路径解析到包安装目录之外的主机文件。当执行 composer install、update 或 require 时，Composer 会对该文件执行 chmod 操作，将其权限修改为全局可读可执行（0755）。攻击条件为项目依赖了不可信的恶意包（包括传递依赖），且目标主机上存在依赖权限保护的文件（如 SSH 私钥、.env 文件、AWS 凭证等）。该漏洞影响机密性，可使同一主机上的其他用户读取本应受限的敏感文件。--no-scripts 和 --no-plugins 等配置无法阻止此行为。Composer 2.2.29 和 2.10.2 版本已修复此问题。"
published = "2026-07-08T20:16:59Z"
remediation = "立即将 Composer 升级至 2.2.29（2.2 LTS 分支）或 2.10.2（当前 2.x 分支）及以上版本，升级命令：`composer self-update --update-keys` 后执行 `composer self-update 2.10.2`。Composer 1.x 已停止维护，须迁移至 2.x 分支。该漏洞无配置缓解措施，升级是唯一修复方案。如使用 CI/CD 流水线，请确保基础镜像中 Composer 版本已更新至修复版本。"
score = 6.1
severity = "MEDIUM"
sources = ["ghsa"]
title = "Composer 包 bin 字段路径遍历漏洞"
updated = "2026-07-10T19:14:18Z"

