[basic]
description = "PHProjekt 2.0 至 3.1 版本存在登录绕过漏洞。该应用在身份验证过程中依赖 PHP 的 `$PHP_SELF` 变量，而该变量会包含 URL 中的 PATH_INFO 路径信息。远程攻击者无需身份认证，通过在请求的 URL 中添加额外路径段（如向 `mail_send.php` 后附加 `/sms` 路径），即可使 `$PHP_SELF` 变量包含额外的路径信息，从而绕过认证机制访问受保护的脚本。成功利用后，攻击者可执行未授权操作，包括发送邮件、查看或修改项目数据等。该漏洞影响所有使用受影响版本的 PHProjekt 部署，攻击条件为攻击者能够向目标服务器发送特制的 HTTP 请求，利用门槛低且无需任何凭证。"
published = "2002-12-31T05:00:00Z"
remediation = "立即升级 PHProjekt 至 3.2 或更高版本，该版本已修复对 $PHP_SELF 变量的依赖。如暂无法升级，可在 .htaccess 或 PHP 配置中通过 unregister_globals 关闭全局变量注册，并修改所有包含认证逻辑的 PHP 脚本，将 $PHP_SELF 替换为 $_SERVER['SCRIPT_NAME']，防止 PATH_INFO 被用于绕过认证检查。同时建议在防火墙或 Web 服务器层面限制对 /mail/ 等敏感目录的匿名访问。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "PHProjekt 2.x/3.x 身份验证绕过漏洞"
updated = "2026-06-16T21:59:55Z"

