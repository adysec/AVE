[basic]
description = "HP JetDirect 打印机卡固件 x.08.20 及更早版本的 LPD（行式打印机守护进程）服务存在缓冲区溢出漏洞。远程未经身份认证的攻击者可通过向目标打印机发送特制的恶意 LPD 打印请求，触发缓冲区溢出导致服务崩溃，造成拒绝服务攻击。该漏洞影响 HP JetDirect X.08.04、X.08.05、X.08.20 等多个固件版本，攻击向量为网络远程利用，攻击复杂度低，无需认证即可执行，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），主要影响系统可用性。"
published = "2000-12-11T05:00:00Z"
remediation = "升级 HP Jetdirect 固件到 X.08.21 及以上版本，其中包含修复 LPD 服务缓冲区溢出漏洞的补丁。如果无法立即升级，可通过防火墙禁用端口 9100/515 等 LPD 服务端口，并限制对打印服务器的访问作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "HP JetDirect 打印机卡固件 LPD 服务缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:53:04Z"

