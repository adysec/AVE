[basic]
description = "Ethereal（现 Wireshark）0.8.13 及更早版本的 AFS ACL 解析器中存在多处缓冲区溢出漏洞。远程攻击者可通过向目标系统发送包含超长用户名字段的特制 AFS 数据包触发该漏洞，导致目标 Ethereal 进程崩溃或执行任意代码。攻击无需身份认证，仅需构造恶意网络数据包即可触发，危害较大。该漏洞影响所有运行受影响版本的 Ethereal 用户，建议升级至更新版本修复。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 Ethereal 至 0.8.14 或更高版本（该漏洞在 0.8.14 中修复）。由于 Ethereal 已更名为 Wireshark，建议直接升级至 Wireshark 最新稳定版（当前最新为 4.x 系列）。如无法升级，可在网络边界部署入侵检测规则，拦截包含超长用户名的 AFS 协议流量。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Ethereal AFS ACL解析器缓冲区溢出漏洞"
updated = "2026-06-16T21:53:18Z"

