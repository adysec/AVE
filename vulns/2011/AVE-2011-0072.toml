[basic]
description = "HP Intelligent Management Center（IMC）5.0 E0101L02之前版本的tftpserver.exe组件中存在输入验证漏洞。该漏洞源于程序在处理特制TFTP请求时，未对操作码（opcode）字段进行充分的边界检查，导致攻击者可通过发送包含超大或无效操作码字段的恶意TFTP数据包，触发函数指针表越界访问，进而覆盖内存中的函数指针。远程未经身份认证的攻击者利用此漏洞可向目标服务器发送精心构造的TFTP请求，实现任意代码执行，完全控制受影响系统。该漏洞CVSS评分10.0，危害等级为严重，影响HP IMC 5.0及更早版本。"
published = "2011-05-13T17:05:45Z"
remediation = "立即升级 HP Intelligent Management Center 至 5.0 E0101L02 或更高版本。如无法立即升级，在防火墙上限制对 TFTP 服务端口（默认 UDP 69）的访问，仅允许可信 IP 连接，并监控异常 TFTP 流量。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "HP Intelligent Management Center 5.0 tftpserver.exe 输入验证漏洞"
updated = "2026-06-16T23:30:14Z"

