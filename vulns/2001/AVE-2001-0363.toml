[basic]
description = 'Interactive Story 1.3 的 story.pl 脚本存在目录遍历漏洞。未经身份认证的远程攻击者可通过向 "next" 参数注入 ".." 路径遍历序列，突破 Web 根目录限制读取服务器上的任意文件。该漏洞利用条件简单，仅需网络可达即可，无需任何认证凭据，可能导致敏感配置文件、密码文件等敏感信息泄露，影响系统机密性。Interactive Story 1.3 所有安装版本均受此漏洞影响。'
published = "2001-12-06T05:00:00Z"
remediation = "修改story.pl脚本，对next参数进行输入校验，过滤包含../序列的请求；在Web服务器层面限制CGI脚本对系统文件的访问权限；禁用或移除story.pl直至厂商发布修复版本。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Interactive Story 目录遍历漏洞"
updated = "2026-06-16T21:54:59Z"

