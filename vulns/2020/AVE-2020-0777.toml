[basic]
description = "SaltStack Salt 的 SSH Client Salt API 存在操作系统命令注入漏洞（CWE-78）。攻击者在启用 SSH 客户端的情况下，向 Salt API 发送特制的 HTTP 请求，即可在目标服务器上以 root 权限执行任意系统命令。该漏洞影响 SaltStack Salt 3002 及之前所有版本，无需身份认证即可远程利用，CVSS 评分 9.8，危害等级严重。攻击者可通过构造包含恶意命令的 SSH 登录请求，绕过 API 的输入过滤机制，实现远程代码执行，进而完全控制目标服务器。SaltStack 官方已在 3002 之后的版本中修复此漏洞，建议用户立即升级。"
published = "2020-11-06T08:15:13Z"
remediation = "立即升级 SaltStack Salt 至 3002.1 或更高版本（官方于 2020 年 11 月 3 日发布安全补丁，禁用系统 shell 执行并增加 eauth/token 参数校验）。如无法立即升级，在 /etc/salt/master 中移除或注释 rest_cherrypy 配置项以禁用 Salt API 的 SSH 客户端功能，并在防火墙层面限制对 Salt API 端口（默认 8000/8080）的访问，仅允许可信管理节点连接。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "SaltStack Salt API 命令执行漏洞"
updated = "2026-06-17T02:58:07Z"

