[basic]
description = 'Sendmail 8.12.9 之前版本中的地址解析器（parseaddr.c）的 prescan() 函数存在缓冲区溢出漏洞。该函数在处理 char 和 int 类型转换时存在缺陷，当 Sendmail 将特定输入值错误解释为特殊的 "NOCHAR" 控制值时，会导致长度检查被禁用，从而触发缓冲区溢出。远程攻击者可通过向目标邮件服务器发送特制的邮件消息触发此漏洞，导致服务拒绝，在特定条件下可执行任意代码。该漏洞影响 Sendmail 8.12.9 之前的所有版本，CVSS 评分 10.0，危害等级严重。'
published = "2003-04-02T05:00:00.000"
remediation = "升级 Sendmail 至 8.12.9 或更高版本，该版本修复了 prescan() 函数中 char/int 类型转换处理不当导致的缓冲区溢出漏洞。如无法立即升级，可在邮件服务器上部署入侵检测规则监控异常邮件流量，并限制 SMTP 连接来源以降低攻击面。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "Sendmail prescan() 地址解析器缓冲区溢出漏洞"
updated = "2026-06-16T22:01:40.237"

