[basic]
description = "Apple QuickTime 在 Mac OS X 10.7.2 之前的版本中存在多个内存破坏漏洞，攻击者可通过向目标用户发送特制的电影文件（movie file），诱使用户在 QuickTime 中打开该文件，从而触发内存 corruption，导致应用程序崩溃或远程执行任意代码。该漏洞影响 Mac OS X v10.6.8、v10.7 及 v10.7.1 等版本，CVSS 评分为 6.8，危害等级为中危。攻击者无需身份认证，只要目标用户打开恶意构造的视频文件即可完成攻击。Apple 已在 OS X Lion v10.7.2 及 Security Update 2011-006 中修复此漏洞，建议用户升级至 QuickTime 7.7.1 或更高版本。"
published = "2011-10-14T10:55:09Z"
remediation = '将 QuickTime 升级至 7.7.1 或更高版本。Mac OS X 用户请安装 OS X Lion v10.7.2（Lion 系统）或 Security Update 2011-006（Mac OS X v10.6.8 Snow Leopard 系统），补丁通过系统"软件更新"或 Apple 官网下载安装。Windows 用户请下载 QuickTime 7.7.1 进行安装。若无法立即升级，应避免打开来源不明的电影文件（.mov、.qt 等），并在防火墙或邮件网关中过滤此类文件作为临时缓解措施。'
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple QuickTime 电影文件内存破坏漏洞"
updated = "2026-06-16T23:32:55Z"

