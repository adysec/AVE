[basic]
description = 'Unify eWave ServletExec AS v3.0C 存在 JSP 源代码泄露漏洞。远程攻击者可通过向目标服务器发送以特殊字符（如 ".", "+" 或 "%20"）结尾的恶意 HTTP 请求，绕过 ServletExec 的访问控制机制，导致服务器返回 JSP 文件的原始源代码而非执行后的结果。攻击者无需身份认证即可利用该漏洞，从而获取 Web 应用的后端逻辑、数据库连接信息等敏感数据，为后续攻击提供情报支撑。该漏洞影响 Unify eWave ServletExec 3.0C 版本，CVSS 评分 5.0，危害等级中危。'
published = "2001-01-09T05:00:00.000"
remediation = '立即升级 Unify eWave ServletExec 至 3.0D 或更高版本以修复 JSP 源代码泄露问题。如无法升级，在 Web 服务器（IIS/Apache/Netscape）层面配置 URL 重写规则，拒绝以 `.`、`+`、`%20`、`%00`、`%2E`、`%2B`、`%5C` 结尾的 JSP 请求；同时部署 WAF 规则拦截 `*.jsp[.+%\00]` 模式，并限制对 JSP 目录的访问权限。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Unify eWave ServletExec 3 JSP 源代码泄露漏洞"
updated = "2026-06-16T21:53:10.633"

