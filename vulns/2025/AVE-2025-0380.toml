[basic]
description = "Kubernetes kubelet 组件的只读 HTTP 端点存在未授权访问漏洞，未经身份认证的攻击者可通过向该端点发送大量容器检查点（checkpoint）请求，导致节点磁盘空间被迅速耗尽，从而引发节点拒绝服务。该漏洞影响所有启用 kubelet 只读端口的 Kubernetes 集群，攻击者无需任何权限即可从本地网络触发，CVSS 评分 6.2，危害等级中等。建议升级 Kubernetes 至修复版本或禁用 kubelet 只读端口以缓解风险。"
published = "2025-02-13T16:16:48Z"
remediation = "立即将 kubelet 升级至 v1.30.10、v1.31.6 或 v1.32.2 及以上版本。如无法立即升级，可在 kubelet 启动参数中添加 `--read-only-port=0` 禁用只读端口，或通过网络策略限制对 kubelet 10250/10255 端口的未授权访问，并监控节点磁盘使用量以发现异常写操作。"
score = 6.2
severity = "MEDIUM"
sources = ["msrc"]
title = "Kubernetes kubelet 容器检查点请求导致节点拒绝服务漏洞"
updated = "2026-06-17T08:26:27Z"

