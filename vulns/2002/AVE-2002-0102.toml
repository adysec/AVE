[basic]
description = "OpenSSL 0.9.6e 版本在检测缓冲区溢出攻击时使用了断言（assertion）机制而非更温和的错误处理方式，导致远程攻击者可通过发送特制的 SSLv2 CLIENT_MASTER_KEY 消息触发断言失败，从而使 OpenSSL 进程异常终止，造成拒绝服务。该漏洞位于 s2_srvr.c 文件中，对 CLIENT_MASTER_KEY 消息的处理未进行充分校验。攻击者无需认证即可通过网络远程触发，影响运行 OpenSSL 0.9.6e 的服务端程序。"
published = "2003-11-17T05:00:00Z"
remediation = "升级至 OpenSSL 0.9.7 或更高版本，该版本已将 s2_srvr.c 中的断言式错误处理替换为安全的错误恢复机制，避免因 SSLv2 CLIENT_MASTER_KEY 消息触发断言失败导致服务崩溃。如无法立即升级，可在服务端配置中禁用 SSLv2 协议作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "OpenSSL OpenSSL 0.9.6e 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:59:34Z"

