[basic]
description = "Ghost CMS 公共 API 端点过滤器验证存在绕过漏洞，未经身份认证的远程攻击者可通过 Content API 的 filter 查询参数绕过验证限制，通过暴力枚举方式窃取用户私有字段。若系统使用 SQLite 作为数据库，攻击者可完全获取用户密码哈希；若使用 MySQL 作为数据库，密码哈希的大小写信息可能丢失，但哈希值本身仍可能被暴露。该漏洞影响 Ghost v5.46.1 至 v6.21.1 版本，Ghost 官方已在 v6.21.2 中修复此问题。"
published = "2026-06-24T19:17:12.580"
remediation = "建议立即将 Ghost CMS 升级至 v6.21.2 或更高版本以彻底修复此漏洞。Docker 部署用户可通过 docker pull ghost:6.21.2-alpine 拉取最新镜像后重启容器完成升级；Ghost-CLI 部署用户可依次执行 cd /path/to/ghost 和 ghost update 完成升级。若短期内无法升级，应在反向代理（如 Nginx）或 WAF 中配置规则，拦截 Content API 端点中 filter 查询参数包含 password 或 email 的请求（匹配正则 filter=[^&]*(password|email)），从而在漏洞被利用前阻断攻击路径。升级完成后请重启 Ghost 服务并验证 Content API 过滤器验证逻辑已恢复正常。"
score = 5.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Ghost CMS 公共 API 过滤器验证绕过敏感信息泄露漏洞"
updated = "2026-06-25T16:07:28.730"

