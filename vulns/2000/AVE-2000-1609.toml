[basic]
description = "GNU Groff（GNU 文本格式化工具）存在本地权限提升漏洞。当用户运行 groff 命令时，程序会从当前工作目录查找设备描述文件（device description file）。本地攻击者可在当前目录中构造恶意的描述文件，在其中包含 postpro 指令，当其他用户（如 root）在相同目录下执行 groff 时，该指令会被自动执行，从而导致攻击者获得额外权限。此漏洞利用条件为攻击者需能控制目标用户的工作目录，危害等级严重，CVSS 评分 10.0。"
published = "2000-12-19T05:00:00.000"
remediation = "立即将 GNU Groff 升级至 1.17 或更高版本，该版本已修复设备描述文件路径遍历缺陷。在 Debian/Ubuntu 系统上执行 `apt-get update && apt-get install groff` 升级软件包；在 RHEL/CentOS 系统上执行 `yum update groff`。升级前作为临时缓解措施，可限制设备描述文件所在目录的写入权限（如 `chmod o-w /usr/share/groff`），禁止非特权用户在该目录下放置恶意 postpro 指令文件，从而阻断本地权限提升攻击路径。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "GNU Groff 本地权限提升漏洞"
updated = "2026-06-16T21:52:30.807"

