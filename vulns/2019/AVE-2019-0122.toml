[basic]
description = "MetInfo 7.0 后台语言管理模块中存在 SQL 注入漏洞。攻击者以管理员身份登录后台后，通过 `admin/?n=language&c=language_general&a=doSearchParameter` 接口的 `appno` 参数构造恶意 SQL 语句，可未经授权读取、篡改或删除数据库中的敏感信息。该漏洞与 CVE-2019-16997 为不同漏洞，需要具备高权限账户（PR:H）才能触发利用，影响 MetInfo 7.0 及更早版本，CVSS 评分为 7.2，危害等级高。"
published = "2019-10-10T01:06:09Z"
remediation = '立即将 MetInfo 升级到最新稳定版本（当前最新为 V8.1），或至少升级至 V7.1.0 及以上版本。该漏洞源于后台语言参数搜索功能（admin/?n=language&c=language_general&a=doSearchParameter）对 appno 参数未做输入过滤，导致高权限管理员可执行 SQL 注入。升级完成后，进入后台"语言管理-语言列表"确认语言参数搜索功能正常工作，并删除后台缓存（可视化界面-清空缓存）。如暂无法升级，临时措施为：在网站根目录 .htaccess 或 Nginx 配置中，对后台语言搜索接口增加 WAF 规则拦截包含单引号、UNION、SELECT 等 SQL 关键字特征的请求，限制只有本地 IP 可访问后台管理入口。'
score = 7.2
severity = "HIGH"
sources = ["nuclei"]
title = "MetInfo CMS SQL注入漏洞"
updated = "2026-06-17T02:23:55Z"

