[basic]
description = "Apache HTTP Server 2.4.0至2.4.39版本中mod_rewrite模块存在开放重定向漏洞。当配置了自引用重定向规则时，攻击者可通过在请求URL中插入编码换行符（%0d%0a）绕过限制，将用户重定向到恶意外部站点，导致网络钓鱼、恶意软件分发等攻击。该漏洞需用户交互触发，攻击者可通过社会工程手段诱导用户点击特制链接实现利用。"
published = "2019-09-25T17:15:10.353"
remediation = "升级 Apache HTTP Server 至 2.4.41 或更高版本。如无法立即升级，在 mod_rewrite 配置中避免使用自引用重定向（即 RewriteRule 目标 URL 包含 $1 等反向引用且指向自身），或对重定向目标 URL 进行严格的换行符过滤校验，确保 RewriteRule 的替换字符串中不包含未转义的 %0d%0a 编码序列。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Apache HTTP Server mod_rewrite 输入验证错误漏洞"
updated = "2026-06-17T02:10:13.870"

