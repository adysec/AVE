[basic]
description = "PHP-Nuke 1.0 和 2.5 版本中的 admin.php3 脚本在处理管理员身份验证时存在缺陷，未能正确验证管理员密码。远程攻击者可以通过请求一个不包含 aid 或 pwd 参数的特定 URL，绕过身份验证机制，直接获取管理员特权。该漏洞允许攻击者在无需凭据的情况下完全控制受影响的网站，导致敏感信息泄露及系统被非法篡改。"
published = "2000-10-20T04:00:00Z"
remediation = "建议立即将 PHP-Nuke 升级至 2.6 或更高版本。对于无法立即升级的系统，应在 `admin.php3` 中增加严格的参数校验逻辑，确保在 `aid` 和 `pwd` 参数缺失时强制跳转至登录页面，或在 Web 服务器层面限制对管理后台的访问权限。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "PHP-Nuke 内容管理系统未授权访问权限提升漏洞"
updated = "2026-06-16T21:52:23Z"

