[info]
author = "ave"
description = "验证 Electron 应用中 shell.openPath() 是否会拒绝包含空字节的路径。该漏洞允许攻击者通过嵌入空字节绕过基于字符串的文件路径校验，使应用程序打开与校验通过的不同文件。仅影响将不可信输入传入 shell.openPath() 且依赖字符串校验的应用。"
id = "POC-AVE-2026-1405"
name = "Electron shell.openPath 路径校验绕过漏洞 PoC"
severity = "medium"
tags = ["ave-2026-1405"]
vuln_id = [
    "CVE-2026-70603",
    "AVE-2026-1405",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/tmp/test_file.txt"
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["root:"]
