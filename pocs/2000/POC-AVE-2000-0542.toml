[info]
author = "ave"
description = "检测 mgetty 软件包中 faxrunq/faxrunqd 组件是否存在符号链接遍历漏洞。通过检查 /var/spool/fax/outgoing/ 目录及 .last_run 文件的可写状态，验证本地攻击者能否利用 symlink 攻击创建或修改任意文件。"
id = "POC-AVE-2000-0542"
name = "Gert Doering mgetty 符号链接遍历漏洞 PoC"
severity = "low"
tags = ["ave-2000-0542"]
vuln_id = [
    "CVE-2000-0691",
    "AVE-2000-0542",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/var/spool/fax/outgoing/.last_run"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [""]

[[poc.requests]]
path = "/usr/bin/faxrunq"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [""]

[[poc.requests]]
path = "/usr/bin/faxrunqd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [""]
