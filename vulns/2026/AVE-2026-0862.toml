[basic]
description = "Hono Web 应用框架的 AWS API Gateway v1 适配器存在请求头去重逻辑缺陷，该适配器在去重重复请求头时使用子串比较而非精确匹配，导致同一请求头中一个值为另一个值的子串时（如 `203.0.113.1` 被 `203.0.113.10` 覆盖）会被错误丢弃。攻击者可构造特制的重复请求头值，使中间件或应用逻辑（如基于 `X-Forwarded-For` 链的 IP 限制、速率限制、审计日志或代理链验证）接收到不完整数据，从而绕过安全决策。该漏洞影响 Hono 4.3.3 至 4.12.27 版本，需攻击者具备向目标应用发送 HTTP 请求的能力，攻击复杂度较高。"
published = "2026-07-08T17:17:27.637"
remediation = "立即将 Hono 框架升级至 v4.12.27 或更高版本（npm update hono），该版本已修复 AWS API Gateway v1 适配器中重复请求头值去重时的子串比较问题。如无法立即升级，可在应用层对 X-Forwarded-For 等关键重复头部的值列表做独立校验，避免依赖适配器去重后的结果。"
score = 4.8
severity = "MEDIUM"
sources = ["ghsa"]
title = "Hono AWS API Gateway v1 适配器重复请求头值去重绕过漏洞"
updated = "2026-07-10T19:50:16.717"

