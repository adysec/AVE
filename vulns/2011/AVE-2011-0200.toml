[basic]
description = """
" wrapper that seems to have confused the Rust parser, resulting in "description field empty" errors.

Let me analyze the information:

NVD description: Use-after-free vulnerability in the Cascading Style Sheets (CSS) implementation in Google Chrome before 18.0.1025.151 allows remote attackers to cause a denial of service or possibly have unspecified other impact via vectors related to run-in boxes.

CWE-416, CVSS 6.8 (MEDIUM), published 2012-04-05.

Local data: AVD title: Apple iOS 至 5.1.1 WebKit 资源管理漏洞 (this is a WebKit/CSS issue affecting Apple iOS too). Tenable notes about Chrome before 18.0.1025.151 with various use-after-free issues including "run-in" handling.

The fix needs to be a clean Chinese description, ≥50 characters, covering: principle (use-after-free in CSS run-in box handling), impact scope (Google Chrome before 18.0.1025.151, also affects Apple iOS WebKit up to 5.1.1 per AVD), attack conditions (remote, user must visit a crafted webpage; no authentication needed).

The output must only be inside <value>..."""
published = "2012-04-05T22:02:07Z"
remediation = '''
" wrapper that made the Rust parser think the field is empty (because it's wrapped in the wrong format).

Looking at the current TOML, the remediation field contains:
```
remediation = """
tags.CVE-2011-3068 是 Google Chrome 18.0.1025.151 之前版本 CSS 实现（run-in boxes 相关）的 use-after-free 漏洞，可导致拒绝服务或任意代码执行；同时影响 iOS 6.0 之前 WebKit 内核（AVD 编号对应 Apple iOS）。

<value>升级 Google Chrome 至 18.0.1025.151 或更高版本，可通过「设置-关于」触发自动更新，或从 Google 官网下载最新稳定版覆盖安装；企业环境应通过组策略或 MDM 统一推送 Chrome 及 Apple iOS 6.0 以上系统的安全更新。无法立即升级时，临时缓解措施包括：配置浏览器为高安全级别并禁用 JavaScript/CSS 内联样式渲染，对不可信网站启用沙箱隔离浏览，以及在网络层通过 Web 代理过滤可疑脚本和样式表内容，降低触发 run-in 盒状处理缺陷的利用风险。"""
```

The issue: the field has "tags." prefix and "<value>" wrapper inside a triple-quoted TOML string. The Rust layer extracts only content between <value> and
'''
