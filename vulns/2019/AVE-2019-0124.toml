[basic]
description = "Kirona Dynamic Resource Scheduling（DRS）5.5.3.5 版本存在未授权信息泄露漏洞。由于 `/osm/REGISTER.cmd`（即 `/osm_tiles/REGISTER.cmd`）接口缺少身份认证与访问控制，未经身份验证的远程攻击者可以直接访问该批处理文件，文件内包含的 SQL 查询语句会暴露数据库版本、表名、列名等敏感数据库结构信息。该漏洞影响 Kirona DRS 5.5.3.5 版本，攻击者无需任何凭据即可通过构造 HTTP 请求获取数据库元数据，为后续针对性的 SQL 注入或数据库渗透攻击提供重要依据。"
published = "2019-10-11T17:15:09.977"
remediation = '建议将 /osm/REGISTER.cmd 和 /osm_tiles/REGISTER.cmd 文件从 Web 可访问目录中移除或重命名，并在 Apache 配置中添加拒绝规则禁止直接访问 .cmd 文件：在 httpd.conf 或站点配置中加入 <FilesMatch "\.cmd$"> Require all denied </FilesMatch>；同时删除已暴露的文件副本，检查 Web 服务器日志确认是否存在未授权访问记录，并通过 WAF 规则拦截对该路径的请求。如厂商已发布后续版本，建议联系 Kirona 技术支持获取补丁并升级至修复版本。'
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "Kirona DRS 未授权访问信息泄露漏洞"
updated = "2026-06-17T02:24:01.077"

