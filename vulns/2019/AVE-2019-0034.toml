[basic]
description = 'Teclib GLPI 至 9.3.3 版本中存在 SQL 注入漏洞，位于 /scripts/unlock_tasks.php 文件的 "cycle" 参数。未经身份认证的远程攻击者可通过向该参数注入恶意 SQL 语句，实现数据库信息窃取、数据篡改甚至获取服务器控制权。CVSS 评分 9.8，危害等级严重。建议升级至 9.3.4 及以上版本修复。'
published = "2019-03-27T17:29:02.370"
remediation = "升级 GLPI 至 9.3.4 或更高版本（commit 684d4fc 已修复 /scripts/unlock_tasks.php 中 cycle 参数的 SQL 注入）。如无法立即升级，在 Web 服务器层面限制对 /scripts/unlock_tasks.php 的访问，或禁用该脚本的执行权限作为临时缓解。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Teclib GLPI unlock_tasks.php SQL注入漏洞"
updated = "2026-06-17T02:10:32.630"

