[basic]
description = "Linux 内核日志守护进程 klogd 存在格式字符串漏洞。klogd 在记录内核日志消息时未能正确清理用户注入的格式字符串，当本地攻击者通过触发特定的畸形内核消息，使 klogd 将攻击者可控的数据作为 printf 风格的格式化字符串进行处理时，可利用格式字符串漏洞控制栈/寄存器并进行任意内存读写，从而以 root 权限执行任意代码，实现本地权限提升。该漏洞需本地用户具备触发内核消息的能力方可利用，无需远程访问（CVSS 向量 AV:L），但一旦利用成功即可完全控制系统，危害较大，影响主流 Linux 发行版。修复建议为升级至修复该问题的 klogd 版本并启用相关补丁。"
published = "2000-11-14T05:00:00Z"
remediation = "建议立即升级系统日志守护进程 klogd（syslog 套件）至 1.3 及以后版本，该版本已在日志输出时对 % 等格式化字符进行安全过滤（sanitize），从根源消除格式字符串注入，并同步更新内核至官方修复后版本。若无法立即升级，可临时限制本地普通用户向内核产生畸形消息的途径（如收紧内核模块加载与驱动调试的访问权限）、去除 klogd 的 SUID 权限并以非特权用户运行，降低本地提权风险；同时开启系统审计，监控以 root 运行的 klogd 进程异常行为。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Linux klogd 内核日志守护进程格式化字符串本地权限提升漏洞"
updated = "2026-06-16T21:52:38Z"

