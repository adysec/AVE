[basic]
description = "IBM AS/400 Firewall R440 的 Web 管理接口存在拒绝服务漏洞，远程攻击者无需身份认证即可通过向目标发送空的 HTTP GET 请求触发该漏洞，导致服务停止响应或崩溃。该漏洞影响运行 IBM AS/400 Firewall R440 版本的设备，攻击条件为攻击者能够访问 Web 管理界面的网络环境，利用方式为构造并发送空的 GET 请求，造成合法用户无法正常使用管理功能。"
published = "2000-12-11T05:00:00Z"
remediation = "升级 IBM AS/400 Firewall R440 设备固件到最新版本 (≥ 7.5.0)，并应用最新的安全补丁更新；修改 Web 服务器配置，禁止处理空的 GET 请求，启用输入验证和 HTTP 请求限制；配置防火墙规则限制对管理界面 的访问，禁止直接对管理端口进行 HTTP 请求；部署应用层防护设备，监控异常的空请求流量并自动阻断。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "IBM AS400 防火墙拒绝服务漏洞"
updated = "2026-06-16T21:53:01Z"

