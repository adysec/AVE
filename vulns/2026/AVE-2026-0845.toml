[basic]
description = "protobufjs 的文本格式扩展在解析字符串键映射条目时使用了普通属性赋值方式，当映射键为 `__proto__` 时，会修改返回映射对象的原型而非创建自有条目，导致原型污染。攻击者可通过向使用 `protobufjs/ext/textformat` 解析不可信文本格式输入的应用程序提供特制输入，实现对象级原型篡改。影响范围包括 protobufjs 8.2.0 至 8.6.5 版本，CVSS 评分 4.8，危害等级中危。修复版本为 8.6.5，建议升级或避免解析不可信的文本格式输入。"
published = "2026-07-08T16:16:34.233"
remediation = "立即升级 protobufjs 至 8.6.5 或更高版本：在项目根目录执行 `npm install protobufjs@^8.6.5`。如无法立即升级，禁止解析不可信的 protobuf Text Format 输入，或在解析前过滤掉键名为 `__proto__` 的 map 条目，并在消费解析后的 map 对象时使用 `Object.hasOwnProperty.call(map, key)` 替代直接属性访问。"
score = 4.8
severity = "MEDIUM"
sources = ["ghsa"]
title = "protobufjs protobuf.js 文本格式解析原型污染漏洞"
updated = "2026-07-13T15:02:37.000"

