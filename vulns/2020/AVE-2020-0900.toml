[basic]
description = "Apache Struts2 框架存在远程代码执行漏洞，其根本原因在于OGNL（Object-Graph Navigation Language）表达式在标签属性中对原始用户输入执行强制求值。当攻击者构造包含恶意OGNL表达式的特制HTTP请求参数时，Struts2在解析标签属性中的用户输入时会触发OGNL表达式执行，导致未经身份认证的远程攻击者可在目标服务器上执行任意操作系统命令。该漏洞影响Apache Struts 2.0.0至2.5.25所有版本，攻击条件极为宽松，无需任何认证凭据，仅需向目标应用发送特制请求即可利用。由于Struts2被广泛应用于企业级Web应用开发，此漏洞影响面极广，CVSS v3.1评分为9.8，危害等级为严重，攻击者可借此完全控制受影响服务器，造成数据泄露、服务中断等严重后果。"
published = "2020-12-11T02:15:10.883"
remediation = "建议立即升级到 Apache Struts 2.5.26 或更高版本。如无法立即升级，应检查并移除代码中对不可信用户输入使用的强制 OGNL 求值（%{...}）语法，特别是 s:textarea、s:select 等标签的属性值中基于用户输入的内容，改由服务器端参数传递，避免在标签属性中直接引用未过滤的用户输入。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Apache Struts2 远程代码执行漏洞（S2-061）"
updated = "2026-06-17T02:59:05.640"

