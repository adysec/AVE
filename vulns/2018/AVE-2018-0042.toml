[basic]
description = "Nagios XI 是一款广泛使用的网络监控管理系统。在 5.4.13 及之前的版本中，admin/logbook.php 页面的 txtSearch 参数存在 SQL 注入漏洞，攻击者可通过构造恶意的 SQL 查询语句绕过身份验证并获取数据库敏感信息。该漏洞需要具有管理员权限才能利用，攻击者需登录 Nagios XI 管理界面后向 logbook.php 的搜索功能发送包含 SQL 注入 payload 的请求，从而实现对后端数据库的未授权访问。受影响版本包括 Nagios XI 5.x 系列，CVSS 评分为 7.2，危害等级为高。成功利用该漏洞可能导致攻击者获取配置信息、用户凭据等敏感数据，进而对监控系统造成进一步危害。"
published = "2018-05-16T13:29:00Z"
remediation = "立即将 Nagios XI 升级至 5.4.13 或更高版本，该版本已修复 admin/logbook.php 中 txtSearch 参数的 SQL 注入漏洞。如暂时无法升级，建议通过 Web 服务器配置限制对 admin/logbook.php 的访问权限，或临时禁用 Logbook 功能模块作为缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["nuclei"]
title = "Nagios XI SQL 注入漏洞"
updated = "2026-06-17T01:34:36Z"

