[info]
author = "AVE"
description = "检测 Apple iOS 5 之前版本 Safari 浏览器中 Content-Disposition: attachment 响应头处理不当导致的跨站脚本漏洞。通过 PHP 脚本设置 Content-Disposition: attachment 和 Content-Type: text/plain 头，返回包含 HTML/JavaScript 的内容，验证浏览器是否仍会渲染执行其中的脚本。"
id = "POC-AVE-2011-0217"
name = "Apple iOS Safari Content-Disposition XSS PoC"
severity = "medium"
tags = ["ave-2011-0217"]
vuln_id = [
    "CVE-2011-3426",
    "AVE-2011-0217",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cve-2011-3426-test.php"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<script>alert(1)</script>"]
