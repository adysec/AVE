[basic]
description = "Mozilla Firefox 3.0.x（3.0.18之前）和3.5.x（3.5.8之前）以及 SeaMonkey 2.0.3 之前的版本中，showModalDialog 方法存在安全绕过漏洞。攻击者可通过构造恶意的 dialogArguments 参数，在跨域对话框中读取目标文档的对象属性，从而绕过同源策略限制。该漏洞允许远程攻击者在受害者的浏览器上以目标站点的权限执行跨站脚本（XSS）攻击，窃取用户会话令牌或钓鱼凭证。攻击条件为：受害者需访问包含恶意代码的页面并调用 showModalDialog 打开跨域对话框，受害者浏览器需运行受影响的 Firefox 或 SeaMonkey 版本。漏洞危害等级中等，CVSS 评分为 5.0。"
published = "2010-02-22T13:00:01Z"
remediation = "立即将 Mozilla Firefox 升级至 3.0.18 或 3.5.8 及以上版本，将 SeaMonkey 升级至 2.0.3 及以上版本以修复 showModalDialog 同源策略绕过漏洞。如无法立即升级，可在浏览器配置中禁用 JavaScript 的 dialogArguments 传递功能作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox 与 SeaMonkey showModalDialog 同源策略绕过跨站脚本漏洞"
updated = "2026-06-16T23:12:46Z"

