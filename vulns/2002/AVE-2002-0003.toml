[basic]
description = "tcpdump 3.6.2 及更早版本中存在缓冲区溢出漏洞。远程攻击者可通过向目标系统发送特制的 NFS 网络数据包触发该漏洞，导致 tcpdump 进程崩溃或执行任意代码。攻击无需身份认证，仅需通过网络发送恶意 NFS 数据包即可触发，攻击门槛较低。该漏洞影响 tcpdump 3.6.2 及之前版本，CVSS 评分 7.5，危害等级高。"
published = "2002-06-18T04:00:00Z"
remediation = "升级 tcpdump 至 3.7 或更高版本。Red Hat 用户安装 RHSA-2002-094/RHSA-2002-121 提供的更新包；Debian 用户安装 DSA-255 安全更新；Caldera OpenLinux 用户安装 CSSA-2002-025.0 补丁。如无法升级，可在网络边界过滤畸形 NFS 数据包作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "TCPDump NFS数据包处理缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:57:19Z"

