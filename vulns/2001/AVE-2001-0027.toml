[basic]
description = "基于 BSD 的 ftpd 中的 replydirname 函数存在单字节缓冲区溢出漏洞。远程攻击者无需身份认证即可通过向目标 FTP 服务器发送特制的目录路径请求触发该漏洞，导致缓冲区越界写入，最终可获取目标系统的 root 权限。该漏洞影响 OpenBSD ftpd 2.6/2.7 及 BSD ftpd 0.3.2 等版本，CVSS 评分 10.0，危害等级严重。目前已有公开的利用代码。"
published = "2001-02-12T05:00:00.000"
remediation = "升级 OpenBSD 至 2.8 及以上版本（该漏洞已在 OpenBSD 2.8 中修复），或禁用 ftpd 服务（`/etc/inetd.conf` 中注释掉 ftp 行并重启 inetd）。如必须使用 ftpd，建议替换为 vsftpd 或 ProFTPD 等维护中的替代方案，并在防火墙限制对 21 端口的访问来源。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "OpenBSD ftpd 单字节缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:34.030"

