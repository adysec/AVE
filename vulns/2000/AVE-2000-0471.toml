[basic]
description = "SapporoWorks WinProxy 2.0 及 2.0.1 版本的 POP3 服务存在缓冲区溢出漏洞。远程攻击者无需身份认证，可通过向 POP3 服务发送超长的 USER、PASS、LIST、RETR 或 DELE 命令参数，触发缓冲区溢出，从而在目标系统上执行任意命令。该漏洞影响 WinProxy 2.0 和 2.0.1 版本，攻击者利用此漏洞可完全控制受影响的代理服务器。"
published = "2000-06-27T04:00:00.000"
remediation = "立即升级 WinProxy 至 2.0.2 及以上版本（该漏洞已在 2.0.2 中修复）。如无法升级，在 POP3 服务入口实施严格的输入长度校验，限制 USER、PASS、LIST、RETR、DELE 命令参数不超过 64 字节，并在防火墙层面限制 POP3 端口（110/TCP）仅允许可信源 IP 访问。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "SapporoWorks WinProxy POP3服务缓冲区溢出漏洞"
updated = "2026-06-16T21:52:04.063"

