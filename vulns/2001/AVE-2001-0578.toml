[basic]
description = "Arrowpoint (Cisco 内容服务交换机) 存在参数解析漏洞，本地攻击者通过向“show script”、“clear script”、“show archive”、“clear archive”、“show log”、“clear log”等 CLI 命令发送过长的参数，触发缓冲区溢出或资源耗尽，导致交换机服务崩溃或重新加载。该漏洞影响 Cisco Arrowpoint 内容服务交换机设备，攻击者无需认证即可利用此漏洞，严重影响网络设备的可用性。漏洞 CVSS 评分为 2.1，权限提升等级为低，但可造成可用性部分损失。攻击者可通过构造恶意命令记录触发漏洞，实现拒绝服务攻击，破坏网络服务的稳定性。"
published = "2001-02-12T05:00:00Z"
remediation = "升级 Arrowpoint/Content Services Switch 到支持命令参数长度限制的固件版本，建议使用 7.0.3 及以上版本；同时，在配置文件中添加 'cli command-length-limit 1024' 配置以限制 CLI 命令参数长度；如无法立即升级，可通过防火墙策略限制对设备管理端口的访问，并禁用 HTTP/HTTPS 管理界面，仅保留需要的功能所需的CLI命令访问权限作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Cisco Content Services Switch 拒绝服务漏洞"
updated = "2026-06-16T21:53:30Z"

