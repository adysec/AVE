[basic]
description = "Snes9x 1.37 版本在安装为 setuid root 时存在本地缓冲区溢出漏洞。本地攻击者可通过向程序传递超长命令行参数触发缓冲区溢出，导致攻击者能够获取 root 权限。该漏洞影响 Snes9x 1.37 及更早版本，攻击者需要拥有本地系统访问权限，无需身份认证即可利用，CVSS 评分 7.2，危害等级高。"
published = "2001-10-16T04:00:00Z"
remediation = "立即升级 Snes9x 至 1.38 或更高版本，该漏洞已在后续版本中修复。如无法升级，立即移除 Snes9x 的 setuid root 权限位（执行 chmod u-s /usr/local/bin/snes9x），避免本地用户通过命令行参数缓冲区溢出提权至 root。建议始终以普通用户身份运行模拟器，勿赋予 SUID 权限。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Snes9x 1.37 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:55:24Z"

