[basic]
description = "Cisco VPN 3000 系列集中器存在认证拒绝服务漏洞。该漏洞源于设备对用户名字段长度验证不充分，远程攻击者无需身份认证即可通过提交超长用户名字符串，触发设备认证模块异常，导致 VPN 集中器服务崩溃或无法响应合法请求。受影响版本包括 2.2.x、3.6(Rel) 及 3.5.5 之前的 3.x 版本。攻击者只需向目标设备的认证接口发送特制请求即可实施攻击，无需任何权限，攻击复杂度低，可造成目标设备拒绝服务，影响企业 VPN 服务的可用性。"
published = "2002-10-04T04:00:00.000"
remediation = "升级 Cisco VPN 3000 Concentrator 至 3.5.5 或更高版本，该版本已修复用户名长度未校验导致的缓冲区溢出。如无法升级，在设备 ACL 中限制对 VPN 服务的访问来源 IP，并在认证前端增加用户名长度限制（建议不超过 64 字符）作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Cisco VPN 3000 Series Concentrator 认证拒绝服务漏洞"
updated = "2026-06-16T21:58:43.677"

