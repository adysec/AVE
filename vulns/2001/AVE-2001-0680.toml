[basic]
description = '标签之间。<value>Netscape iPlanet Enterprise Server 4.1 存在拒绝服务漏洞，其原理是服务器在处理包含大量"../"（目录遍历）序列的特制长 HTTP GET 请求时，未对输入进行充分的验证和长度限制，导致服务进程异常终止或资源耗尽。该漏洞影响 iPlanet Enterprise Server 4.1 版本，攻击者无需任何认证即可从网络远程发起攻击，且攻击复杂度低、易于实施，成功利用将造成服务不可用。'
published = "2001-06-02T04:00:00Z"
remediation = '建议立即升级到 iPlanet Enterprise Server 4.1 Service Pack 5 (4.1sp5) 或更高版本。由于 Netscape/iPlanet 系列产品已于 2001 年停止支持，无法获取官方补丁，强烈建议迁移至受支持的 Web 服务器（如 Sun Java System Web Server 6.0+、Apache HTTP Server 2.x 或 Nginx）。临时缓解措施：在前端防火墙或 WAF 配置规则拦截包含过多 "/../" 序列的长 HTTP GET 请求，限制 URL 路径长度（建议 ≤ 2048 字符），并启用请求频率限制防止 DoS 攻击。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Netscape iPlanet Enterprise Server HTTP GET 请求拒绝服务漏洞"
updated = "2026-06-16T21:53:58Z"

