[basic]
description = "MDaemon 邮件服务器中的 WorldClient Web 组件存在堆溢出漏洞，远程攻击者可通过向目标系统发送特制的超长 URL 请求触发该漏洞，导致服务拒绝响应，在特定条件下还可实现任意命令执行。该漏洞影响 MDaemon 3.1.1 及更早版本，CVSS 评分 7.5，危害等级高。厂商已在后续版本中修复此漏洞。"
published = "2000-12-11T05:00:00Z"
remediation = "升级 Mdaemon 至 3.1.12 或更高版本（官方补丁下载地址：ftp://ftp.altn.com/MDaemon/Release/md312.exe）。如无法升级，在防火墙中限制对 Worldclient 端口（TCP 3000）和 Webconfig 端口（TCP 3001）的访问，仅允许可信 IP 连接，以降低被远程利用的风险。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Alt-N Mdaemon Worldclient 堆溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:59Z"

