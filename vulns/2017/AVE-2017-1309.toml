[basic]
description = 'PHPUnit 的 eval-stdin.php 文件（路径：src/Util/PHP/eval-stdin.php）存在远程代码执行漏洞。该文件直接使用 eval() 函数执行用户通过 HTTP POST 方式提交的以 "<?php " 开头的任意 PHP 代码，且未做任何身份验证或权限校验。攻击者只需找到暴露了 /vendor 目录的 Web 应用（常见于未正确配置生产环境的 PHP 项目），直接向 /vendor/phpunit/phpunit/src/Util/PHP/eval-stdin.php 发送包含恶意 PHP 代码的 POST 请求即可实现远程代码执行，进而完全控制目标服务器。该漏洞影响 PHPUnit 4.8.28 之前版本及 5.6.3 之前版本，CVSS 评分 9.8，危害等级严重。'
published = "2017-06-27T17:29:00.177"
remediation = "升级 PHPUnit 至 4.8.28 及以上版本（4.x 分支）或 5.6.3 及以上版本（5.x 分支）；如无法升级，在 Web 服务器层面禁止外部访问 /vendor/phpunit/phpunit/src/Util/PHP/eval-stdin.php 路径，或删除该文件。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "PHPUnit eval-stdin.php 远程代码执行漏洞"
updated = "2026-06-17T01:29:01.517"

