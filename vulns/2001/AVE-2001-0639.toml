[basic]
description = "IIS 5.0（Windows 2000）和 Microsoft Exchange 2000 在处理特定构造且长度落入极窄范围的畸形 URL 时存在内存分配错误缺陷，远程攻击者无需身份认证即可通过 HTTP 反复发送此类特制 URL 触发访问违规（Access Violation），导致 IIS 服务（w3svc.exe）崩溃，造成 Web 服务拒绝服务。该漏洞仅影响 IIS 5.0 Gold/SP1 及 Exchange 2000 Gold，IIS 4.0 及更早版本不受影响；Exchange 2000 配置良好时可先进行用户认证，可降低被攻击风险；攻击不会导致数据泄露或代码执行，且 URL 构造特殊，日常使用中几乎不可能被意外触发。Microsoft 已发布安全公告 MS01-014 及补丁 KB286818（IIS 5.0）和 KB287678（Exchange 2000），升级至 Windows 2000 Service Pack 2 或 Exchange 2000 Service Pack 1 即可修复此漏洞。"
published = "2001-06-02T04:00:00Z"
remediation = "应用 Microsoft 安全公告 MS01-014 提供的补丁：IIS 5.0 需安装补丁 Q286818，Exchange 2000 需额外安装补丁 Q287678。补丁已包含在 Windows 2000 Service Pack 2 和 Exchange 2000 Service Pack 1 中，建议直接升级到对应 Service Pack。临时缓解措施：在防火墙或 ISA Server 中过滤畸形 URL 请求，限制对 Exchange 外部访问的 OWA 虚拟目录，确保 Exchange 服务器上的 ISAPI 扩展仅接受已认证用户的请求，并配置 IIS 5.0 回收应用程序池以缩短服务中断时间。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft IIS/Exchange URL 内存分配拒绝服务漏洞"
updated = "2026-06-16T21:53:45Z"

