[basic]
description = "Internet Explorer 5.5 的打印模板（Print Templates）功能存在安全漏洞，该功能会在不向用户提示的情况下直接执行任意的自定义打印模板。攻击者可构造恶意的打印模板文件，诱使用户打开包含恶意模板的网页或文档，从而在用户不知情的情况下加载并执行其中的任意 ActiveX 控件，实现代码执行。该漏洞影响 Internet Explorer 5.5 版本，需要用户主动访问攻击者控制的恶意页面作为触发条件。成功利用后，攻击者可在用户系统中以当前用户权限执行任意代码，造成敏感信息泄露或系统被进一步控制的风险。"
published = "2001-02-16T05:00:00.000"
remediation = '安装 Microsoft 安全补丁 MS00-093（对应 KB279328/KB279329），或升级 Internet Explorer 5.5 到 5.5 SP2 版本，以修复打印模板无需确认即可执行 ActiveX 控件的漏洞。临时缓解措施可通过组策略禁用"Print Templates"功能，或在 Internet 安全区域中禁止脚本执行并关闭 ActiveX 控件自动运行。'
score = 5.1
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Internet Explorer 打印模板远程代码执行漏洞"
updated = "2026-06-16T21:53:38.230"

