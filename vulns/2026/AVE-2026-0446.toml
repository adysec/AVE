[basic]
description = "Cilium 网络组件中的 CiliumLocalRedirectPolicy 存在授权校验缺陷（CWE-863），具有创建本地重定向策略权限的用户可通过 addressMatcher 指定任意 ClusterIP，从而劫持任意命名空间中 Service 的流量，绕过 serviceMatcher 提供的命名空间隔离保证。此外，删除此类恶意策略会破坏 Cilium 内部服务状态，导致受影响 Service 的服务翻译功能完全失效。该漏洞影响 Cilium v1.19.0 至 v1.19.3、v1.18.2 至 v1.18.9 以及 v1.17.16 之前的所有版本，攻击者需具备相邻网络访问能力及较高权限，CVSS 评分 6.9，危害等级中危。Cilium 社区已在 v1.19.4、v1.18.10 和 v1.17.16 版本中修复。"
published = "2026-07-07T21:17:27Z"
remediation = "立即升级 Cilium 至 v1.17.16、v1.18.10 或 v1.19.4 及以上版本。该漏洞无临时缓解措施，必须通过升级修复。升级前请确认 CiliumLocalRedirectPolicy 配置，升级后重启 Cilium agent 使补丁生效。"
score = 6.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "Cilium CiliumLocalRedirectPolicy 跨命名空间服务流量劫持漏洞"
updated = "2026-07-10T17:56:00Z"

