[basic]
description = "osCommerce Online Merchant 2.3.4.1 版本安装程序存在未经验证的配置文件注入漏洞。由于安装完成后 /install/ 目录默认仍可访问且缺少身份验证，未经身份认证的远程攻击者可直接访问 install_4.php，通过构造特制的 POST 数据向 configure.php 文件中注入任意 PHP 代码。当应用程序后续包含该文件时，注入的恶意代码即被执行，导致服务器端完全沦陷，攻击者可实现远程代码执行、数据窃取或进一步横向移动。该漏洞影响 osCommerce 2.3.4.1 版本，CVSS 评分 9.3，危害等级严重。"
published = "2025-07-23T14:15:32.447"
remediation = '立即删除服务器上 osCommerce 安装目录下的 /install/ 文件夹及其所有内容，这是官方安装指南明确要求的步骤。如使用 osCommerce CE Phoenix 等活跃分支，请升级至最新版本（1.0.8.20 及以上），该版本已移除安装脚本的未授权访问问题。若无法升级，在 Web 服务器（Apache/Nginx）配置中添加访问控制规则，拒绝所有对 /install/ 路径的外部请求，例如 Nginx 配置 `location /install/ { deny all; }` 或 Apache 使用 `<DirectoryMatch "/install/"> Require all denied </DirectoryMatch>`。同时检查 includes/configure.php 文件是否已被篡改，确认其中无异常 PHP 代码。'
score = 9.3
severity = "CRITICAL"
sources = ["nuclei"]
title = "osCommerce Online Merchant 安装程序未授权配置文件注入远程代码执行漏洞"
updated = "2026-06-17T01:54:44.963"

