[basic]
description = "File Browser 文件管理界面在启用 Signup 和 CreateUserDir 功能时，通过 cleanUsername() 函数对注册用户名进行规范化处理（删除 `..`、将非字母数字字符替换为 `-`），但该映射为多对一关系，不同用户名可归一化为相同结果。系统未检查规范化后的作用域（home 目录）是否已被占用，导致攻击者可注册与受害者用户名归一化后相同的用户名（如 `teamone/x` 对应 `teamone-x`），从而获得同一 home 目录的完全读写权限，实现跨用户文件读取、篡改和删除，破坏用户隔离机制。该漏洞影响 File Browser 2.63.17 之前版本，CVSS 评分 8.1，危害等级高。攻击前提是管理员已启用 Signup 和 CreateUserDir 配置。"
published = "2026-07-15T16:16:51Z"
remediation = "升级 File Browser 至 v2.63.17 或更高版本，该版本修复了 cleanUsername() 多对一归一化导致不同用户名映射到同一家目录的缺陷。如无法立即升级，可临时关闭 Signup 和 CreateUserDir 功能以阻止用户自注册，或使用反向代理层对用户名注册实施额外校验，确保归一化后的 scope 唯一。"
score = 8.1
severity = "HIGH"
sources = ["ghsa"]
title = "File Browser 用户名规范化冲突致使用户目录隔离绕过漏洞"
updated = "2026-07-20T16:17:06Z"

