[basic]
description = "Apache Tomcat 4.0.3 的 /servlet/ 映射存在跨站脚本（XSS）漏洞。当 Servlet 抛出异常时，Tomcat 未对 URL 中的脚本代码进行过滤，远程攻击者可通过向目标服务器发送包含恶意脚本的特制 URL，诱使其他用户访问，从而在用户浏览器中执行任意脚本代码，窃取会话 Cookie 或执行其他恶意操作。该漏洞影响 Apache Tomcat 4.0.3 版本，无需认证即可利用，危害较大。"
published = "2002-07-23T04:00:00Z"
remediation = "升级 Apache Tomcat 至 4.0.6 或 4.1.13 及以上版本（该漏洞在此版本中修复）。由于 Tomcat 4.x 已停止维护，建议迁移至 Tomcat 9.0.x 或更高版本。如无法立即升级，可删除或禁用 invoker servlet（在 web.xml 中注释掉 org.apache.catalina.servlets.InvokerServlet 的映射），并移除示例应用（删除 webapps 目录下的 examples 文件夹）以降低攻击面。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Apache Tomcat Servlet Mapping 跨站脚本漏洞"
updated = "2026-06-16T21:57:56Z"

