[basic]
description = "Kaseya VSA 在 9.5.7 及更早版本中存在严重的凭据泄露漏洞。默认情况下，本地部署的 Kaseya VSA 提供下载页面供客户端下载安装程序，攻击者下载并安装客户端后，可在安装目录下生成包含 Agent_Guid 和 AgentPassword 的 KaseyaD.ini 文件。攻击者获取该文件后，可构造 GET 请求通过 dl.asp 页面进行身份验证，获取 sessionId Cookie 以绕过系统认证，进而对 Kaseya 安装环境及其托管客户端实施进一步的半认证攻击。该漏洞已于 2021 年 7 月被发现在野外被积极利用，CVSS 评分为 10.0，危害等级严重。"
published = "2021-07-09T14:15:07Z"
remediation = "立即将 Kaseya VSA 升级至 9.5.7 或更高版本以修复凭据泄露漏洞。同时修改网络访问控制策略，仅允许可信 IP 地址访问 /dl.asp 页面，或在防火墙/反向代理层面禁用该页面的外部访问。如无法立即升级，应删除或重命名安装目录下的 KaseyaD.ini 文件，并定期轮换所有 Agent 的密码。"
score = 10
severity = "CRITICAL"
sources = ["kev"]
title = "Kaseya VSA 凭据泄露漏洞"
updated = "2026-06-17T03:49:41Z"

