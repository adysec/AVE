[basic]
description = "Samba 的 SMB/CIFS 数据包分片重组代码（smbd 守护进程）存在缓冲区溢出漏洞。远程攻击者无需身份认证即可向目标系统发送特制的 SMB 数据包分片，触发 smbd 进程中的缓冲区溢出，导致任意代码执行。该漏洞影响 Samba 2.2.8 之前版本及 Samba-TNG 0.3.1 之前版本，CVSS 评分 10.0，危害等级严重。攻击者成功利用后可完全控制目标系统，实现远程代码执行。"
published = "2003-03-31T05:00:00Z"
remediation = "立即升级 Samba 至 2.2.8 或更高版本（Samba-TNG 升级至 0.3.1 或更高）。如无法立即升级，在 smb.conf 中添加 `hosts allow = 127.0.0.1 192.168.0.0/16` 和 `hosts deny = 0.0.0.0/0` 限制访问来源，并设置 `interfaces = eth* lo` 和 `bind interfaces only = yes` 仅监听内网接口；同时在防火墙层面阻断 TCP 139 和 445 端口的外部入站流量。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "Samba smbd SMB/CIFS 数据包重组缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T22:01:29Z"

