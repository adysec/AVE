[basic]
description = "OpenCart Divido支付插件存在SQL注入漏洞，攻击者无需认证即可向插件的更新接口发送包含恶意SQL代码的特制POST请求，在数据库查询中注入非法语句，绕过数据库权限校验执行任意SQL查询。该漏洞影响所有安装并启用Divido插件的OpenCart电子商务网站，攻击成功后可窃取数据库中存储的敏感信息，包括用户个人信息、订单数据、支付凭证及管理员凭据等，进而可能导致整个系统的完全沦陷。攻击者只需知道目标站点的地址即可远程发起攻击，无需事先获取账号权限或进行复杂的交互操作，利用方式简单直接，危害严重。"
published = "2018-05-23T16:29:00Z"
remediation = "建议立即升级 OpenCart Divido 插件至最新修复版本（建议升级至 2.3.0.2 或更高版本），或直接禁用/卸载 Divido 支付插件。若暂无法升级，请在 Web 应用防火墙（WAF）层面配置 SQL 注入防护规则，拦截包含 SQL 关键字（如 UNION、SELECT、SLEEP、BENCHMARK）的异常请求；同时在 OpenCart 后台启用 SQL 注入防护插件（如 OCMod 的 SQL Injection Protection 扩展）作为临时缓解措施，并限制数据库账号权限为最小权限原则（仅 SELECT/INSERT/UPDATE 必需表），禁止使用 root 账号连接数据库。"
score = 8.1
severity = "HIGH"
sources = ["nuclei"]
title = "OpenCart Divido 插件 SQL 注入漏洞"
updated = "2026-06-17T01:35:32Z"

