[basic]
description = "Internet Explorer 4.x 和 5.x 版本中用于调用脚本小程序（Scriptlet）的 ActiveX 控件存在任意文件读取漏洞。该控件在处理 HTML 渲染时未能正确限制文件类型，导致可读取非 HTML 格式的任意文件内容。攻击者可通过诱使用户访问特制网页，利用该 ActiveX 控件读取目标系统上的任意文件（如本地配置文件、敏感文档等），造成信息泄露。攻击条件要求用户使用受影响版本 IE 并访问恶意构造的页面，利用方式简单，危害中等。"
published = "2000-10-20T04:00:00Z"
remediation = "建议立即安装 Microsoft Security Bulletin MS00-055 对应补丁，升级 Internet Explorer 至 5.01 SP2 或 5.5 SP1 及以上版本。如无法升级，可在 IE 安全设置中将「ActiveX 控件和插件」相关选项禁用，或使用现代浏览器替代。由于 IE 4.x/5.x 已停止支持，推荐升级至受支持的操作系统及浏览器版本。"
score = 2.6
severity = "LOW"
sources = ["avd"]
title = "Microsoft Internet Explorer Scriptlet 渲染任意文件读取漏洞"
updated = "2026-06-16T21:52:26Z"

