[basic]
description = "ADC2000 NG Pro 1.2 版本存在 SQL 注入漏洞。该漏洞源于应用程序在处理用户输入时未能进行严格的过滤与校验，导致攻击者可以通过构造特殊的 SQL 查询语句，在无需身份验证的情况下直接与后台数据库交互。远程攻击者可利用此漏洞非法获取数据库中的敏感数据，或在特定配置下通过数据库权限进一步控制服务器，导致系统完整性和机密性受损。"
published = "2000-10-20T04:00:00Z"
remediation = "建议将 ADC2000 NG Pro 升级至更高版本以修复 SQL 注入缺陷。若无法升级，应在入口处部署 WAF 或修改代码，对所有用户输入参数进行严格的过滤与转义，特别是拦截单引号(')、分号(//)等 SQL 特殊字符，防止恶意指令执行。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "ADC2000 NG Pro 1.2 SQL注入漏洞"
updated = "2026-06-16T21:52:24Z"

