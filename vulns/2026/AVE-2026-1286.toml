[basic]
description = "AIOHTTP 是用于 asyncio 和 Python 的异步 HTTP 客户端/服务器框架。其 WebSocket 客户端存在逻辑处理漏洞：即使在未协商 permessage-deflate 压缩扩展的情况下，客户端仍会接受并尝试解压 RSV1 位被置位的 WebSocket 帧。恶意的 WebSocket 服务器可借此向客户端发送特意构造的压缩帧，由于客户端在未经协商的情况下仍主动解压，将触发非预期的 CPU 与内存额外消耗，在存在 zip bomb 类放大攻击时可能造成拒绝服务（DoS）。该漏洞源于 WebSocket 帧处理逻辑的输入校验不充分（CWE-20），影响 AIOHTTP 3.14.2 之前的版本，CVSS 评分为 6.9，危害等级为中危。攻击者只需伪造一个怀有恶意的 WebSocket 服务器并诱使受影响客户端连接，即可触发该缺陷。官方已在版本 3.14.2 中修复此问题。"
published = "2026-07-30T19:18:33Z"
remediation = "请立即升级至 AIOHTTP 3.14.2 或更高版本以修复此缺陷，可通过 `pip install --upgrade aiohttp>=3.14.2` 完成升级。升级后请务必重启所有依赖 aiohttp 的服务进程，确保新代码加载生效。若无法立即升级，可在客户端侧对 WebSocket 握手主动拒绝并忽略对方未协商的 RSV1 压缩帧扩展，或限制单连接帧大小与解压后缓冲上限，并监控 CPU 与内存异常增长作为临时缓解措施。建议同时检查依赖 aiohttp 的库是否有固定版本声明，避免回退到受影响版本。"
score = 6.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "AIOHTTP WebSocket 客户端未协商压缩扩展时错误解压帧导致资源消耗漏洞"
updated = "2026-07-30T20:03:32Z"

