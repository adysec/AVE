[basic]
description = "MIT Kerberos 4 KDC 程序在处理 AUTH_MSG_KDC_REQUEST 请求时未正确检查字符串的空终止符，远程攻击者可通过向 KDC 服务发送特制的畸形请求报文触发该缺陷，导致 KDC 服务进程崩溃，造成拒绝服务。该漏洞影响 Kerberos 4.0 及 5 系列多个版本，攻击无需身份认证，通过网络即可触发，危害等级中危。"
published = "2000-06-09T04:00:00Z"
remediation = "升级 MIT Kerberos 至 krb5-1.2 或更高版本（已包含此修复）；如无法升级，请从 MIT 安全公告页（http://web.mit.edu/kerberos/www/advisories/index.html）获取针对 krb5-1.0.x 和 krb5-1.1.1 的补丁并手动应用。KTH-krb4 用户应升级至 0.10 或更高版本。Red Hat 用户可安装 RHSA-2000-031 提供的更新包。临时缓解措施可在防火墙上限制对 KDC 端口 88/750 的访问，仅允许可信客户端连接。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "MIT Kerberos KDC 空终止符检查拒绝服务漏洞"
updated = "2026-06-16T21:51:58Z"

