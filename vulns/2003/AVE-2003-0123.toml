[basic]
description = "CVE-2003-0564是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2003-12-01T05:00:00Z"
remediation = "对于使用 Mozilla/Netscape 系列邮件客户端的系统，请升级至 Mozilla 1.4.2 或更高版本，该版本包含修复后的 NSS 3.9 库，消除了 S/MIME 消息中异常 ASN.1 构造导致的内存崩溃与拒绝服务漏洞。Red Hat Enterprise Linux 用户应安装 RHSA-2004:110 安全更新，运行 up2date 或 rpm -Fvh 升级相关 RPM 包。对于 Hitachi Groupmax Mail - Security Option 及 PKI Runtime Library 用户，请联系 Hitachi 获取补丁。作为临时缓解措施，建议在邮件网关或客户端中配置规则，自动隔离或删除包含 S/MIME 附件的未知来源邮件，直至完成补丁部署。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "多厂商 S/MIME 电子邮件 ASN.1 构造 拒绝服务代码执行漏洞"
updated = "2026-06-16T22:02:26Z"

