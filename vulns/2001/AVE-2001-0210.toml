[basic]
description = "ISC BIND 4 和 BIND 8 版本中存在内存信息泄漏漏洞。远程攻击者无需身份认证即可通过网络向目标 DNS 服务器发送特制查询请求，利用该漏洞读取服务器进程内存中的敏感信息，如环境变量、配置文件内容等。该漏洞影响广泛部署的 BIND 域名解析服务，可导致关键信息泄露，进一步辅助攻击者实施更深层次的渗透攻击。攻击条件简单，无需特殊权限，危害较大。"
published = "2001-02-12T05:00:00Z"
remediation = "建议立即升级 BIND 至修复版本：BIND 4 升级至 4.9.7 或更高版本，BIND 8 升级至 8.2.3 或更高版本。Red Hat Linux 用户应安装 RHSA-2001-007 提供的更新包；Debian 用户应应用 DSA-026 安全更新。如无法立即升级，可在防火墙层面限制对 DNS 服务器的非授权访问，并禁用递归查询功能作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "ISC BIND 信息泄漏漏洞"
updated = "2026-06-16T21:53:29Z"

