[basic]
description = "phpMyAdmin 4.8.1 及之前版本的 checkPageValidity 函数存在白名单验证缺陷，导致任意文件包含漏洞。攻击者可通过构造恶意参数绕过页面重定向的白名单检查，在服务器上包含并执行任意文件。该漏洞影响所有启用 phpMyAdmin 的环境，CVSS 评分 8.8（高危）。攻击条件通常需要身份认证，但当配置 $cfg['AllowArbitraryServer'] = true 或 $cfg['ServerDefault'] = 0 时，攻击者可无需认证直接利用，前者允许指定任意受控主机执行代码，后者绕过登录直接运行易受攻击代码。利用方式为发送特制 HTTP 请求操控页面加载参数，实现文件包含进而获取服务器控制权。"
published = "2018-06-21T20:29:00Z"
remediation = "立即升级 phpMyAdmin 至 4.8.2 或更高版本（官网下载 https://www.phpmyadmin.net/downloads/）。若暂时无法升级，请在 config.inc.php 中设置 $cfg['AllowArbitraryServer'] = false 并 $cfg['ServerDefault'] = 1 禁用任意服务器连接与零默认服务器模式，同时在 Web 服务器层面限制 phpMyAdmin 访问来源 IP 或启用强制 HTTPS 与强密码策略作为临时缓解。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "phpMyAdmin phpMyAdmin 本地文件包含漏洞"
updated = "2026-06-17T01:38:03Z"

