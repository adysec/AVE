[basic]
description = "Helix GNOME Updater（helix-update）0.5及更早版本存在权限提升漏洞，本地用户可在root开始安装软件包之前，提前创建/tmp/helix-install安装目录，从而将任意RPM软件包以root权限安装到系统中。该漏洞利用条件为攻击者需具备本地用户权限，且目标系统运行了受影响版本的helix-update。攻击者通过竞态条件篡改安装流程，可实现任意代码以root权限执行，危害等级为低危。Microsoft及上游厂商已发布修复版本，建议用户升级至最新版本以消除风险。"
published = "2000-10-20T04:00:00Z"
remediation = "升级helix-update至0.6及以上版本。升级后重新安装受影响的RPM包。作为临时缓解措施，删除/tmp/helix-install目录或将其权限设置为仅root可写，防止本地用户提前创建该目录。"
score = 6.2
severity = "MEDIUM"
sources = ["avd"]
title = "Helix GNOME Updater 任意 RPM 包安装漏洞"
updated = "2026-06-16T21:52:20Z"

