[basic]
description = "PHP-Nuke 4.4 的 cookiedecode 函数在处理用户认证 cookie 时未对解码后的数据进行严格校验，攻击者可通过提取 cookie 中的认证信息并篡改重放，绕过身份认证机制获得其他用户账户的访问权限。该漏洞影响使用 PHP-Nuke 4.4 版本的网站系统，无需身份认证即可在远程发起攻击，成功利用后可窃取或冒充其他用户身份执行操作，CVSS 评分为 7.5，危害等级为高危。"
published = "2001-06-02T04:00:00.000"
remediation = "建议立即升级 PHP-Nuke 至 5.0 及以上版本（已修复 cookiedecode 认证绕过漏洞），或迁移至 WordPress/Drupal 等维护中的 CMS。若暂无法升级，请在应用层实施 Cookie 安全加固：设置 HttpOnly、Secure 标志，启用 SameSite=Strict，并对用户输入的 Cookie 数据进行严格验证和签名校验，防止认证信息被篡改窃取。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "PHP-Nuke cookie解码 身份认证绕过漏洞"
updated = "2026-06-16T21:53:27.993"

