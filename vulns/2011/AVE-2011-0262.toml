[basic]
description = 'Opera 浏览器 11.10 及更早版本存在多个安全漏洞，其中 CVE-2011-2638 由浏览器对 CSS 伪类 ":hover" 与浮动元素变换的组合处理不当、嵌入式 Java 小程序空参数处理缺陷以及对特定未指定网页内容的解析错误共同导致。未经身份认证的远程攻击者可构造包含恶意内容的网页（如 zylom.com 网站上的游戏页面），诱使用户访问后触发浏览器应用程序崩溃，从而造成拒绝服务。该漏洞攻击复杂度低，攻击者无需任何凭据，仅需通过网络引导用户访问特制网页即可实施攻击。Opera 已在 11.10 版本中修复此漏洞，建议受影响用户升级至安全版本。'
published = "2011-07-01T10:55:03Z"
remediation = "立即将 Opera 浏览器升级至 11.10 或更高版本，该版本已修复空参数的嵌入式 Java 小程序处理不当导致的应用程序崩溃问题。如暂时无法升级，可在 Opera 的设置中禁用 Java 插件作为临时缓解措施，并避免访问来源不明的网页内容。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera 浏览器 拒绝服务漏洞"
