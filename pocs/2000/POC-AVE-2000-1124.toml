[info]
author = "ave"
description = "验证 AdCycle 安装目录中是否遗留 build.cgi 脚本，该脚本可被远程执行以泄露密码或破坏数据库。"
id = "POC-AVE-2000-1124"
name = "AdCycle Banner Management System build.cgi Exposure PoC"
severity = "high"
tags = ["ave-2000-1124"]
vuln_id = [
    "CVE-2000-1161",
    "AVE-2000-1124",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/build.cgi"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
