[basic]
description = "MyWebServer LLC 开发的 My Web Server 1.0.1 和 1.0.2 版本存在拒绝服务漏洞。该 Windows 平台下的简易 Web 服务器在处理超长 HTTP GET 请求时缺乏对请求 URI 长度的有效校验，未对缓冲区边界进行严格检查，导致缓冲区溢出。攻击者无需身份认证，仅需向目标服务器发送包含约 994 字节以上超长字符串的特制 HTTP GET 请求，即可触发服务崩溃并停止响应，需手动重启后方可恢复服务。该漏洞影响范围限于 1.0.1 与 1.0.2 两个版本，攻击条件宽松，任何能访问目标 HTTP 端口的远程用户均可利用，无需特殊工具或权限。"
published = "2002-12-31T05:00:00Z"
remediation = "该软件已停止维护且无官方补丁，建议立即迁移至 Apache/Nginx/IIS 等现代 Web 服务器。若必须继续使用，请在前端部署 WAF 限制 HTTP 请求长度（如 Nginx client_max_body_size 1m），并在防火墙层面仅允许受信任 IP 访问 80/443 端口。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "MyWebServer My Web Server HTTP GET 请求拒绝服务漏洞"
updated = "2026-06-16T22:00:15Z"

