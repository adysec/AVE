[basic]
description = "Pegasus Mail 3.11 版本存在缓冲区溢出漏洞，攻击者可通过发送包含二进制数据的超长电子邮件触发该漏洞，导致远程拒绝服务攻击，甚至可能实现任意代码执行。该漏洞属于经典的栈缓冲区溢出类型，由于程序未对邮件内容长度进行有效边界检查，当处理过长的二进制数据时发生内存越界写入，破坏程序控制流。攻击条件为远程未经身份认证即可利用（AV:N/AC:L/Au:N），只需向目标发送精心构造的恶意邮件即可触发。影响范围限于 Pegasus Mail 3.11 版本，CVSS 评分 7.5（高危），影响机密性、完整性和可用性。厂商已停止维护该版本，建议升级至最新版本或迁移至其他邮件客户端。"
published = "2000-12-19T05:00:00Z"
remediation = "建议立即停止使用 Pegasus Mail 3.11 版本，升级至厂商发布的最新稳定版本。由于该版本过于陈旧且缺乏安全维护，若无法升级，建议更换为现代的安全邮件客户端，或在网络防火墙层面拦截异常长度的二进制邮件载荷以减轻风险。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Pegasus Mail 3.11 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:47Z"

