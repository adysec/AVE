[basic]
description = "DomainMOD 4.11.01 的 assets/add/ssl-provider.php 页面中存在跨站脚本（XSS）漏洞。具有管理员权限的认证攻击者可通过在 SSL Provider Name 或 SSL Provider URL 字段中注入恶意脚本代码，当其他管理员访问受影响页面时，恶意脚本将在浏览器中执行，导致敏感信息泄露或会话劫持。该漏洞需攻击者具备高权限且需用户交互触发，CVSS 评分 4.8，危害等级中危。"
published = "2018-12-10T09:29:00Z"
remediation = "升级 DomainMOD 至 4.12.0 或更高版本，该版本已在 ssl-provider.php 中对 SSL Provider Name 和 SSL Provider URL 字段进行输入转义处理。如无法立即升级，可在 Web 应用防火墙（WAF）层面添加规则过滤包含 `<script>` 等 XSS 载荷的请求参数，同时在 PHP 配置中启用 `session.cookie_httponly` 和 `session.cookie_samesite=Lax` 缓解会话劫持风险。"
score = 4.8
severity = "MEDIUM"
sources = ["nuclei"]
title = "DomainMod 4.11.01 SSL Provider 跨站点脚本漏洞"
updated = "2026-06-17T01:52:09Z"

