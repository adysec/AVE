From the NVD data and pre-search results, I can construct a proper Chinese description:

- CVE-2002-1131: Cross-site scripting vulnerabilities in SquirrelMail 1.2.7 and earlier
- Affected files: addressbook.php, options.php, search.php, help.php
- Remote attackers can execute script as other web users
- CVSS 7.5 (HIGH)
- No authentication required, network-based attack

Let me write a proper description that's ≥50 Chinese characters, covering principle, impact, and attackconditions.<value>SquirrelMail 1.2.7及更早版本的addressbook.php、options.php、search.php、help.php等多个页面存在跨站脚本（XSS）漏洞。远程攻击者无需身份验证即可向这些页面的查询参数注入恶意HTML和JavaScript代码，当其他用户访问特制URL时恶意脚本在浏览器中执行，可导致会话劫持、敏感信息窃取、钓鱼攻击等危害。攻击者通过构造包含恶意载荷的链接诱使用户点击即可触发，攻击条件低、影响范围广。"""
published = "2002-10-04T04:00:00Z"
remediation = "升级 SquirrelMail 至 1.2.8 或更高版本，该版本已修复 addressbook.php、options.php、search.php、help.php 中的跨站脚本漏洞。如无法升级，在 Web 服务器（Apache/Nginx）层面配置 WAF 规则，对上述四个脚本的查询参数进行输入过滤，过滤 `<script>`、`onerror=` 等 XSS 关键字符。"
score = 7.5
severity = "HIGH"
