[basic]
description = "rConfig 至 3.94 版本中存在操作系统命令注入漏洞，位于 lib/ajaxHandlers/ajaxAddTemplate.php 文件中。经过身份认证的远程攻击者可通过向该接口的 fileName POST 参数中注入 shell 元字符（如分号、管道符等），绕过输入过滤限制，在目标服务器上以 Web 服务权限执行任意操作系统命令。该漏洞影响 rConfig 3.94 及更早版本，CVSS 评分 8.8，危害等级高。攻击者无需特殊前置条件，仅需低权限账号即可利用，已有公开的 Exploit-DB 和 GitHub PoC 代码，实际威胁较大。"
published = "2020-03-08T22:15:11Z"
remediation = '立即将 rConfig 升级至 3.95 及以上版本。如无法升级，编辑 `lib/ajaxHandlers/ajaxAddTemplate.php`，对 `fileName` POST 参数使用 `escapeshellarg()` 或正则过滤 `;|&|$|\`` 等 shell 元字符；同时通过 Web 服务器配置限制对该文件的访问（如添加 `.htaccess` 拒绝规则），并在网络层面限制管理后台的访问来源 IP。'
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "rConfig 操作系统命令注入漏洞"
updated = "2026-06-17T02:47:30Z"

