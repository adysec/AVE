[basic]
description = "Microsoft COM 组件存在释放后使用（Use-After-Free）漏洞，低权限攻击者可在本地登录系统后运行特制程序触发该漏洞，利用 COM 对象内存管理缺陷实现权限提升至 SYSTEM 级别。该漏洞影响 Windows 10/11 及 Windows Server 多个版本，CVSS 评分 7.8，危害等级高危。攻击者需具备本地访问权限，无需用户交互即可完成利用。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:48Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新 (KB5050004)，或通过 Windows Update 自动获取更新。各版本修复版本号：Windows 10 1507 升级至 10.0.10240.20890、Windows 10 1809 升级至 10.0.17763.6775、Windows 11 24H2 升级至 10.0.26100.2894、Windows Server 2025 升级至 10.0.26100.2894。如无法立即打补丁，可限制低权限用户登录受影响的系统，并监控 COM 组件异常调用行为作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows COM 特权提升漏洞"
updated = "2026-06-17T08:42:58Z"

