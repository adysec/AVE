[basic]
description = "Respondus for WebCT 1.1.2 存在弱密码加密漏洞。该软件在存储用户凭据时使用弱加密算法对用户名和密码进行编码，本地攻击者若能读取 WEBCT.SVR 配置文件，即可通过逆向弱加密算法解密其中的密码信息，从而获取其他用户的登录凭据并提升权限。攻击者需要具有本地文件读取权限，攻击复杂度较低，影响系统的机密性和完整性。"
published = "2001-08-31T04:00:00Z"
remediation = "建议立即升级 Respondus 至 1.1.2 以上版本（厂商已在后续版本中修复弱加密问题）。如无法升级，应严格限制 WEBCT.SVR 文件的访问权限，仅允许 WebCT 服务进程读取，并定期清理该文件中的缓存凭据。同时建议启用 WebCT 的操作系统级文件审计日志，监控对 WEBCT.SVR 的异常访问。"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Respondus for WebCT 弱密码加密漏洞"
updated = "2026-06-16T21:55:23Z"

