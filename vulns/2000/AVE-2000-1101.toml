[basic]
description = "Authentix Authentix100 存在认证绕过漏洞，未经身份认证的远程攻击者可通过在受保护目录的 URL 中插入点号（.）来绕过身份验证机制，从而访问本应受保护的资源。该漏洞影响 Authentix Authentix100 认证系统，CVSS 评分为 5.0（中危），攻击条件宽松，无需认证即可远程利用。"
published = "2001-01-09T05:00:00.000"
remediation = "立即将 Authentix100 升级至 5.3 或更高版本（该补丁由 Flicks Software 免费提供）。升级前请先从官方网站 http://www.flicks.com/authentix100 下载并安装补丁。如暂无法升级，可在 IIS 站点根目录禁用匿名访问，并将受保护目录的 NTFS 权限设置为仅对授权用户开放，以限制未授权用户通过点号绕过认证访问敏感文件。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Authentix Authentix100 认证绕过漏洞"
updated = "2026-06-16T21:53:13.250"

