[info]
author = "AVE"
description = "Internet Explorer 5.5 及更早版本存在区域绕过漏洞，远程攻击者可通过构造特制网页，获取浏览器缓存内容的物理路径位置，并将缓存内容在本地计算机区域中打开，随后利用已编译的 HTML 帮助文件（.chm）执行任意程序。此 PoC 基于 Georgi Guninski 公开的演示页面，通过检查 User-Agent 判断目标浏览器是否为受影响版本。"
id = "POC-AVE-2001-0600"
name = "Microsoft Internet Explorer CHM 文件远程代码执行漏洞 PoC"
severity = "high"
tags = [
    "cve-2001-0002",
    "ie",
    "rce",
    "chm",
    "ms01-015",
]
vuln_id = [
    "CVE-2001-0002",
    "AVE-2001-0600",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = [
    "MSIE 5.5",
    "MSIE 5.0",
    "MSIE 5.01",
    "MSIE 4",
]
