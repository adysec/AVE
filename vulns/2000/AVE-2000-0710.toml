[basic]
description = "Anaconda Foundation Directory 1.4 至 1.9 版本中的 apexec.pl 脚本存在目录遍历漏洞。远程攻击者无需身份认证即可通过构造包含 `..`（点点）序列的特制 URL 请求，利用该脚本对文件路径过滤不严的缺陷，读取服务器上任意文件，导致敏感信息泄露。攻击者只需发送 HTTP 请求即可利用，无需特殊权限或用户交互，攻击门槛极低。Exploit-DB 已公开该漏洞的利用代码。"
published = "2000-12-19T05:00:00.000"
remediation = '升级至 Anaconda Foundation Directory 1.9 或更高版本，该版本已修复 apexec.pl 对 `..` 序列的过滤缺陷。如无法升级，在 Web 服务器层面对 apexec.pl 的输入参数进行严格校验，拒绝包含 `../` 或 `..\` 的请求，并限制 Web 进程对文件系统的读取权限。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Anaconda Foundation Directory 目录遍历漏洞"
updated = "2026-06-16T21:52:53.547"

