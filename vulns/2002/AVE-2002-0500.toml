[basic]
description = "OpenUNIX 8.0.0 和 UnixWare 7.1.1 中的 Xsco X Server 在调用 xkbcomp 等外部程序时未正确丢弃特权权限，通过 popen 函数以高权限执行外部命令，导致本地用户可利用该漏洞提升至 root 权限。攻击者需拥有本地系统访问权限，通过触发 X Server 调用外部程序即可实现权限提升，完全影响系统机密性、完整性和可用性，CVSS 评分 7.2，危害等级高。"
published = "2002-09-24T04:00:00Z"
remediation = "立即安装 SCO 官方安全公告 CSSA-2002-SCO.38 提供的补丁，该补丁可从 SCO FTP 服务器获取。具体操作为：以 root 身份登录系统，下载补丁包后执行 `pkgadd -d <补丁文件>` 安装。如无法立即打补丁，临时缓解措施为移除 Xsco 的 setuid 位（`chmod u-s /usr/bin/X11/Xsco`），或限制本地用户对 X 服务器的直接访问权限。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Caldera OpenUNIX/UnixWare X Server 本地权限提升漏洞"
updated = "2026-06-16T21:58:31Z"

