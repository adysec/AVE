[basic]
description = "WebKit 渲染引擎在 Apple iTunes 10.7 之前版本中存在内存破坏漏洞（CWE-119），未经身份认证的远程攻击者可通过诱骗用户访问恶意构造的网页来触发该漏洞，导致栈缓冲区溢出，进而可执行任意代码或造成应用程序崩溃，实现拒绝服务。该漏洞影响安装了旧版 WebKit 的 Apple iTunes 用户，攻击者无需事先获取受害者凭据即可在用户浏览恶意网站时完成利用，危害严重。Apple 已在 2012 年 9 月发布的安全更新中修复此漏洞，建议用户升级至 iTunes 10.7 或更高版本。"
published = "2012-09-13"
remediation = "升级 iTunes 至 10.7 或更高版本，升级 Safari 至 6.0.1 或更高版本；对于 OS X 系统，请更新至 OS X Lion v10.7.5 或 OS X Mountain Lion v10.8.2，以修复 WebKit 中的多个内存损坏漏洞。如无法立即更新，建议避免访问不受信任的网站，并限制浏览器和 iTunes 的自动下载功能。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple WebKit 远程代码执行漏洞"
updated = "2012-09-13"

