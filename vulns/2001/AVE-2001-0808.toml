[basic]
description = "Outlook 和 Outlook Express 的 VCard 处理器存在缓冲区溢出漏洞。当用户打开包含恶意构造的生日字段的 vCard 联系人文件时，攻击者可利用该漏洞在目标系统上执行任意命令。该漏洞影响 Microsoft Outlook 98、Outlook 2000 以及 Outlook Express 5.x 版本，攻击者无需身份验证即可通过网络远程发起攻击，CVSS 评分 7.5，危害等级高。Microsoft 已发布 MS01-012 安全公告修复此问题。"
published = "2001-05-03T00:00:00Z"
remediation = "tags.<value>安装 Microsoft 安全公告 MS01-012 对应的补丁 KB283908，将 Internet Explorer 升级至 IE 5.01 SP1/SP2、IE 5.5 SP1 或更高版本（IE 5.5 SP2 及 IE 6 已包含此修复）。如无法立即安装补丁，临时缓解措施为：不要打开来历不明的 vCard 附件，直接删除可疑邮件及其附件，并在 Outlook/Outlook Express 中关闭自动预览功能。建议通过 Windows Update 或 Microsoft 下载中心自动获取并安装最新安全更新。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Outlook 和 Outlook Express 缓冲区溢出远程代码执行漏洞"
updated = "2001-05-03T00:00:00Z"

