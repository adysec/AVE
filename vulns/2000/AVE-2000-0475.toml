[basic]
description = "LeafDigital LeafChat 1.7 存在错误消息处理缺陷导致的拒绝服务漏洞。攻击者可通过发送特制的错误消息或触发异常错误条件，导致客户端崩溃或服务拒绝，影响 LeafChat 1.7 版本客户端用户。攻击者需诱导受害者接收恶意构造的错误消息或连接至恶意服务器触发异常，随后客户端因异常处理不当而崩溃拒绝服务。该漏洞无需认证即可远程触发，影响聊天客户端可用性，攻击者可通过发送畸形数据包或诱导连接恶意服务器实施攻击。"
published = "2000-06-25"
remediation = "立即升级到最新版本的 LeafChat（如果还有的话），建议访问官方网站下载最新版本。如果无法立即升级，可以在防火墙层面阻止意外的 IRC 错误消息流向 LeafChat 客户端，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "LeafDigital LeafChat 1.7 错误消息拒绝服务漏洞"
updated = "2000-06-25"

