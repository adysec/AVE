[basic]
description = "PHF CGI 程序存在缓冲区溢出漏洞，远程攻击者通过向 CGI 程序提交大量参数并包含超长 MIME 头部，可触发缓冲区溢出，从而在目标服务器上执行任意命令。该漏洞影响 Linux/x86 平台上的 PHF 组件，攻击者无需身份认证即可远程利用，CVSS 评分 7.5，危害等级高。"
published = "2001-01-09T05:00:00.000"
remediation = "立即从 Web 服务器 CGI 目录中删除或禁用 phf 程序，该程序存在缓冲区溢出漏洞且已不再维护，建议使用更安全的替代方案或完全移除该 CGI 组件。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "PHF CGI 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:20.317"

