[basic]
description = "Cisco Catalyst 6800 系列交换机运行特定版本 Cisco IOS 软件时，其虚拟专用局域网服务（VPLS）功能存在内存管理缺陷。未经身份认证的相邻攻击者可通过在受影响设备的 MAC 地址表中创建大量 VPLS 生成的 MAC 条目来触发该漏洞，导致 C6800-16P10G 或 C6800-16P10G-XL 类型线卡崩溃，造成拒绝服务。该漏洞影响运行 Cisco IOS 15.0 至 15.4 版本且配置了 VPLS 并使用 Supervisor Engine 6T 的 Catalyst 6800 系列交换机，攻击者需与目标设备处于同一广播域。Cisco 已发布安全公告（CSCva61927）修复此问题。"
published = "2017-09-29T01:34:48Z"
remediation = "登录 Cisco.com 使用 Cisco IOS Software Checker 工具（https://tools.cisco.com/security/center/selectIOSVersion.x）输入当前 IOS 版本号，查询并升级到对应修复版本。受影响设备为 Catalyst 6800 系列交换机（配备 C6800-16P10G 或 C6800-16P10G-XL 线卡且启用 VPLS），升级前确认设备内存和硬件兼容性。无服务合同的用户可联系 Cisco TAC（https://www.cisco.com/c/en/us/support/web/tsd-cisco-worldwide-contacts.html）获取免费升级。该漏洞无临时缓解措施，必须通过升级修复。"
score = 6.5
severity = "MEDIUM"
sources = ["kev"]
title = "Cisco IOS Catalyst 6800系列交换机 VPLS 拒绝服务漏洞"
updated = "2026-06-17T01:02:56Z"

