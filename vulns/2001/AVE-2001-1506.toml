[basic]
description = "标签之间。<value>Microsoft Exchange 2000 Server的Outlook Web Access (OWA)服务与Internet Explorer之间存在交互脚本执行漏洞。攻击者可通过发送包含HTML代码的邮件附件，利用OWA服务与IE浏览器的交互机制，在用户邮箱中自动执行恶意脚本代码。该漏洞影响Exchange 2000 Server版本，攻击者无需身份认证即可远程发起攻击。成功利用后，攻击者可在用户邮箱上下文中执行任意脚本，导致敏感信息泄露、会话劫持或进一步的控制权获取。该漏洞属于CWE-434类型，CVSS评分为7.5，危害等级为高危。"
published = "2001-07-21T04:00:00Z"
remediation = "建议立即安装 Microsoft 安全公告 MS01-030 针对 Exchange 2000 Server 的补丁（补丁 KB299535 将随 Exchange 2000 Service Pack 1 集成），或通过 Windows Update 自动更新。补丁安装后 OWA 将强制 IE 在打开附件前提示用户下载保存，从而阻止 HTML 脚本自动执行。如无法立即打补丁，临时缓解措施包括：在 Exchange 2000 服务器上禁用 OWA 服务，或强制用户在非 IE 浏览器中访问 OWA，并提醒用户不要打开来自未知来源的邮件附件。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Exchange 2000 Server 跨站脚本执行漏洞"
updated = "2026-06-16T21:54:07Z"

