[basic]
description = "man 命令存在格式字符串漏洞，由于处理 -l 参数时未对用户输入进行 adequate 验证，本地低权限用户可通过向 man 命令传递特制的格式字符串，利用栈上的内存地址写入覆盖函数返回地址，从而在栈上执行任意代码。由于多个 Linux 发行版中的 man 程序以 SUID root 权限安装，攻击者成功利用后可获得 root 权限，完全控制系统。该漏洞影响 Debian 2.2 以及 S.u.S.E 6.3、6.4、7.0 等版本，攻击条件为攻击者需具备本地登录权限，利用方式为通过构造包含格式化说明符的 -l 参数触发格式化字符串漏洞，进而执行提权代码获取管理员权限。CVSS 评分 7.2，危害等级高，影响系统的机密性、完整性和可用性。"
published = "2001-05-03T04:00:00.000"
remediation = "建议升级到包含 man 命令安全补丁的发行版，如升级到 Ubuntu 20.04 LTS 及以上版本、Debian 10 及以上版本，或从相应的 Linux 发行版供应商处获取 man 命令的安全更新。如无法立即升级，可立即将 /usr/bin/man 文件的 SUID 权限移除（chmod 755 /usr/bin/man），并避免在 shell 中直接使用 man -l 选项进行手册查询，如确需使用应预先验证输入参数。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Linux man 命令格式字符串漏洞"
updated = "2026-06-16T21:53:51.257"

