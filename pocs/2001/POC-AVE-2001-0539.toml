[info]
author = "ave"
description = "检测 ARCserveIT 6.61/6.63 客户端是否存在临时文件符号链接漏洞。通过检查 asagent.tmp 和 inetd.tmp 文件是否存在并验证是否有符号链接绕过风险，实现对 Local File Overwrite (LFO) 漏洞的无损验证。"
id = "POC-AVE-2001-0539"
name = "ARCserveIT 6.61/6.63 临时文件符号链接覆盖漏洞 PoC"
severity = "low"
tags = ["ave-2001-0539"]
vuln_id = [
    "CVE-2001-1346",
    "AVE-2001-0539",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/tmp/asagent.tmp"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = ".+"
type = "regex"

[[poc.requests]]
path = "/tmp/inetd.tmp"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = ".+"
type = "regex"
