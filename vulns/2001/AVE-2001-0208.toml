[basic]
description = "标签中。<value>BIND 4的nslookupComplain函数存在缓冲区溢出漏洞。当远程攻击者向目标DNS服务器发送特制的DNS查询响应报文时，由于函数未对输入数据进行充分的边界检查，可导致堆栈缓冲区溢出。成功利用此漏洞的攻击者能够获得目标系统的root级特权执行权限。该漏洞影响运行BIND 4.x版本的DNS服务器，攻击者无需身份认证即可在网络中发起远程攻击。攻击者可通过构造包含恶意数据的DNS响应包，触发目标系统的缓冲区溢出，从而完全控制受影响的DNS服务器。"
published = "2001-02-12T05:00:00Z"
remediation = "立即升级到BIND 9.x或更高版本，停止使用已受影响的BIND 4.x版本。如无法立即升级，可通过删除nslookupComplain函数或限制对nslookup服务的访问来临时缓解风险，并及时应用Red Hat安全更新RHSA-2001-007。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "ISC BIND 4 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:29Z"

