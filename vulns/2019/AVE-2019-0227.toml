[basic]
description = "ZyXEL 多款防火墙及 VPN 设备的安全登录页面存在反射型跨站脚本漏洞（CWE-79），由于 mp_idx 参数未经过滤直接回显在页面中，攻击者可构造包含恶意脚本的 URL 诱导管理员点击，受害者浏览器执行攻击者注入的 JavaScript 代码，可窃取会话 Cookie、劫持管理员账号或执行任意操作。受影响设备涵盖 ATP 系列、USG 系列、ZyWALL 系列等十余款网络安全设备，CVSS 3.0 评分 6.1（中危），攻击向量为网络、需用户交互、权限范围扩大。利用条件为：目标设备登录页面可从网络访问，且管理员需点击恶意链接。ZyXEL 官方已发布固件更新修复此漏洞，建议尽快升级至最新版本。"
published = "2019-04-22T20:29:00Z"
remediation = "立即将受影响设备的 ZLD 固件升级至对应 Hotfix 版本：ATP/USG/ZyWALL 系列从 V4.31 升级至 V4.33（Hotfix build 433Axx0ITS-WK12），VPN50/VPN100/VPN300 升级至 V10.02（Hotfix build 10.02(ABxx.0)ITS-WK17）。升级路径：登录设备管理界面 → 系统维护 → 固件升级，上传对应型号的 Hotfix 固件包并重启。升级前请备份配置文件。若暂时无法打补丁，建议通过防火墙规则限制对防火墙登录页面（weblogin.cgi / webauth_relogin.cgi）的外部访问，仅允许可信管理网段访问，以缓解反射型 XSS 攻击风险。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "ZyXEL 多款安全防火墙设备跨站脚本漏洞"
updated = "2026-06-17T02:44:55Z"

