[basic]
description = 'Tumbleweed Messaging Management System (MMS) 4.6 及更早版本（原名 Worldtalk Worldsecure）在安装过程中存在严重的默认口令漏洞：系统安装时会自动创建一个默认管理员账户 "sa" 且密码为空。攻击者无需任何身份认证即可通过网络远程直接使用该空密码账户登录系统管理界面，获得完全的管理员权限。该漏洞影响所有安装了受影响版本 MMS 的系统，攻击条件极低（远程访问、无需认证、低攻击复杂度），CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），属于高危漏洞。攻击者利用该漏洞可完全控制消息管理系统，窃取敏感通信数据、篡改消息路由、植入后门等，严重威胁企业通信安全。建议立即升级至修复版本并修改默认账户密码，或禁用/删除默认 "sa" 账户。'
published = "2000-10-20T04:00:00Z"
remediation = '建议立即升级 Tumbleweed MMS 至 4.6 之后的修复版本（建议升级至最新版本），并立即修改默认 "sa" 账户密码为强密码（至少 12 位含大小写数字特殊字符）。如无法立即升级，请立即禁用或重命名默认 "sa" 账户，并在防火墙层面限制 MMS 管理端口（默认 80/443/8080）仅允许可信 IP 访问。同时配置强密码策略并启用账户锁定策略防止暴力破解。'
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Tumbleweed MMS 默认账号无密码漏洞"
updated = "2026-06-16T21:52:26Z"

