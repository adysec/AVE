[basic]
description = "Windows 内核存在内存信息泄露漏洞，由于内核未能正确清理内存中的敏感数据，具有低权限的本地攻击者可通过调用特定的系统调用接口触发该漏洞，从而读取内核内存中的敏感信息，包括凭据、密钥等机密数据。该漏洞影响多个 Windows 版本，CVSS 评分 5.5，危害等级中危。攻击者需已获得目标系统的本地访问权限方可利用，无法远程触发。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:56Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 (KB5050004)，通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。该漏洞为本地信息泄露，需攻击者已登录系统，建议同时遵循最小权限原则，限制非管理员用户的本地登录权限以降低攻击面。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 内核内存信息泄露漏洞"
updated = "2026-06-17T08:43:05Z"

