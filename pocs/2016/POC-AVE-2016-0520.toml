[info]
author = "AVE"
description = "通过构造包含恶意 JavaScript 的网页，利用 WebKit 在 Object.defineProperties 中对 not_number 类型 toString 触发 GC 后释放数组内存，再通过内存喷射覆盖释放区域实现 use-after-free，验证目标设备是否存在 CVE-2016-4657 漏洞。该漏洞影响 iOS 9.3.5 之前版本及 Nintendo Switch 浏览器，曾被 Pegasus 间谍软件利用。"
id = "POC-AVE-2016-0520"
name = "Apple iOS WebKit not_number defineProperties UAF PoC"
severity = "high"
tags = [
    "cve-2016-4657",
    "webkit",
    "uaf",
    "ios",
    "trident",
]
vuln_id = [
    "CVE-2016-4657",
    "AVE-2016-0520",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["CVE-2016-4657"]
