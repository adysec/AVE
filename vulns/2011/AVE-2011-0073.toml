[basic]
description = "HP Intelligent Management Center（IMC）5.0 E0101L02之前版本中的imcsyslogdm.exe组件存在释放后使用（Use-After-Free）漏洞。远程攻击者可通过向目标系统发送特制的超长syslog数据包触发该漏洞，导致已释放的内存被重新访问，从而执行任意代码。该漏洞与异常处理机制相关，CVSS评分10.0，危害等级严重，攻击无需身份认证，影响范围广泛。HP已发布安全更新修复此漏洞。"
published = "2011-05-13T17:05:45Z"
remediation = "立即升级 HP Intelligent Management Center 至 5.0 E0101L02 及以上版本。该补丁可通过 HP 官方支持文档 c02822750 获取。如无法立即升级，建议在防火墙层面限制对 UDP 514 端口的非授权访问作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "HP Intelligent Management Center 释放后使用远程代码执行漏洞"
updated = "2026-06-16T23:30:14Z"

