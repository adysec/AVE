[basic]
description = "Juniper Networks ScreenOS 固件存在未授权的硬编码后门账户漏洞。未经身份认证的远程攻击者可利用该后门，通过在 SSH 或 TELNET 远程会话中输入特定的后门密码，绕过身份认证机制获得设备的管理员权限。该漏洞影响 ScreenOS 6.2.0r15 至 6.2.0r18 以及 6.3.0r12 至 6.3.0r20 等多个版本，CVSS 评分 9.8，危害等级严重。攻击者可利用该后门完全控制受影响的网络设备，进而读取、修改设备配置并截获网络流量。Juniper 已确认此漏洞并发布安全公告，受影响用户应及时升级至修复版本。"
published = "2015-12-19T14:59:01Z"
remediation = "立即升级 Juniper ScreenOS 至修复版本：6.2 分支升级至 6.2.0r19 或更高版本；6.3 分支升级至 6.3.0r12b、6.3.0r13b、6.3.0r14b、6.3.0r15b、6.3.0r16b、6.3.0r17b、6.3.0r18b、6.3.0r19b 或 6.3.0r21 及以上版本。若无法立即升级，请在防火墙策略中禁用 SSH 和 Telnet 管理访问，或仅允许受信任 IP 访问管理端口作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "瞻博网络 ScreenOS 认证后门漏洞"
updated = "2026-06-17T00:33:04Z"

