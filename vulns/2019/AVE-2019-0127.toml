[basic]
description = "Apache Dubbo 是一个分布式服务框架，当 Provider 端启用 HTTP 协议进行远程通信时，存在不安全的 Java 对象反序列化漏洞。未经身份认证的远程攻击者可通过向目标 Dubbo 服务发送包含恶意 Java 对象的特制 HTTP POST 请求，利用 Apache Dubbo 的反序列化机制触发远程代码执行，从而完全接管 Provider 实例。该漏洞影响 Apache Dubbo 2.7.0 至 2.7.4、2.6.0 至 2.6.7 以及所有 2.5.x 版本，攻击复杂度低，无需身份验证且无需用户交互即可利用，CVSS v3.1 评分 9.8（严重等级），可导致服务器被完全控制，危害极大。"
published = "2020-04-01T22:15:15Z"
remediation = "1. 立即升级 Apache Dubbo 至 2.7.5、2.6.8 或更高版本，官方已修复 HTTP 协议反序列化漏洞。2. 如暂无法升级，临时关闭 Provider 的 HTTP remoting 支持（仅使用 dubbo 协议），并在防火墙或安全组中限制 Dubbo 端口仅允许受信任的 IP 地址访问。3. 在网关或 WAF 层拦截带有 Java 对象序列化数据的异常 POST 请求作为临时缓解。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Apache Dubbo HTTP 协议 Java 反序列化漏洞"
updated = "2026-06-17T02:24:10Z"

