[basic]
description = "REDAXO 媒体池组件中的文件扩展名检查函数 `rex_mediapool::isAllowedExtension` 存在绕过漏洞。该函数仅检查被禁扩展名是否出现在文件名末尾，而未检测多段扩展名链中非末段的被禁扩展名（如 `shell.php.any.jpg`）。具有媒体上传权限的认证后台用户可上传 JPEG/PHP 混合文件，在配置了多扩展名 PHP 处理器的 Apache 服务器上，通过请求该文件即可触发任意 PHP 代码执行，获取 Web 服务器权限。该漏洞影响 REDAXO 5.18.2 至 5.21.0 版本，CVSS 评分 7.5，危害等级高。攻击者需具备后台用户权限且服务器使用 mod_mime 风格的多扩展名处理器。"
published = "2026-07-31T20:16:51Z"
remediation = '立即升级 REDAXO 至 5.21.1 或更高版本（官方已在该版本中修复 isAllowedExtension 的多段扩展名绕过问题）。如无法立即升级，可修改 Apache 配置，将 PHP 处理器的 FilesMatch 正则添加结尾锚点（如 `<FilesMatch ".+\.ph(?:ar|p|tml)$">`），避免 mod_mime 多扩展名处理器执行非末端 .php 段；同时限制 mediapool 上传权限仅授予可信用户。'
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "REDAXO Mediapool 文件扩展名绕过漏洞导致远程代码执行"
updated = "2026-07-31T22:17:03Z"

