[basic]
description = "Technote 2000/2001 的 main.cgi 脚本存在目录遍历漏洞，远程攻击者无需身份认证即可通过向 filename 参数传入 `../` 等路径穿越序列，绕过访问限制读取服务器上的任意文件。该漏洞可导致敏感信息泄露（如配置文件、密码文件等），影响运行 Technote 2000/2001 的 Web 服务器。攻击者只需构造特制 HTTP 请求即可利用，攻击门槛低。"
published = "2001-02-12T05:00:00Z"
remediation = "Technote 产品已停止维护，无官方补丁。建议立即删除或禁用 `main.cgi` 脚本，或从 Web 服务器配置中移除 `/technote/` 路径的 CGI 执行权限。如必须使用该功能，在 Web 服务器（Apache/Nginx）层面添加重写规则，对 `filename` 参数过滤 `../` 等目录遍历序列，并限制只能访问特定目录下的文件。同时建议迁移至其他仍在维护的 Web 公告板产品。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Technote 2000/2001 main.cgi 目录遍历漏洞"
updated = "2026-06-16T21:53:36Z"

