[basic]
description = "Veritas Backup Exec 在 21.2 及之前版本中，客户端与 Agent 之间通过 TLS 安全通信完成身份认证，但 SHA 认证方案存在设计缺陷。未经身份认证的远程攻击者可利用该漏洞绕过 TLS 认证机制，完成未授权身份验证，进而在已认证连接上执行数据管理协议命令。通过构造特制的输入参数，攻击者能够以 System 权限读取系统上的任意文件，造成敏感信息泄露。该漏洞影响使用受影响版本的企业备份环境，攻击条件简单，无需用户交互即可完成利用。"
published = "2021-03-01T22:15:14Z"
remediation = '将 Veritas Backup Exec 升级至 21.2 或更高版本以彻底修复 SHA 认证方案漏洞。如暂无法升级，作为临时缓解措施，在所有受影响主机的注册表路径 Software\Veritas\Backup Exec For Windows\Backup Exec\Engine\Agents\XBSA\Machine 下检查 DBAID 键值，若该键不存在或值为零，则创建类型为 REG_SZ 的字符串键并将 DBAID 值设为随机十六进制字符串，以阻止攻击者利用 SHA 认证方案进行未授权访问。'
score = 8.1
severity = "HIGH"
sources = ["kev"]
title = "Veritas Backup Exec 身份认证绕过漏洞"
updated = "2026-06-17T03:45:32Z"

