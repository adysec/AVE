[basic]
description = "Western Digital My Cloud 网络附加存储设备（固件版本低于 2.30.196）存在身份验证绕过漏洞。该漏洞源于 network_mgr.cgi 模块中的 cgi_get_ipv6 命令在处理请求时未正确验证用户身份，未经身份认证的远程攻击者可通过向目标设备发送带有 flag=1 参数的 HTTP 请求直接创建绑定自身 IP 地址的有效管理员会话，随后在后续请求中设置 Cookie 为 username=admin 即可绕过身份验证，以管理员权限调用所有需要认证的 CGI 模块，从而完全控制目标设备，包括读取、修改或删除存储数据。攻击无需任何用户交互或凭证，CVSS 评分 9.8，危害等级严重。"
published = "2018-09-18T15:29:00Z"
remediation = "立即将 Western Digital My Cloud 固件升级至 2.30.196 或更高版本，该版本已修复 network_mgr.cgi 模块中 cgi_get_ipv6 命令无需认证即可创建管理员会话的问题。如无法立即升级，可在设备管理界面禁用远程管理功能，并在网络防火墙中限制对设备 80/443 端口的访问来源 IP，仅允许受信任的管理员 IP 连接。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Western Digital My Cloud 身份验证绕过漏洞"
updated = "2026-06-17T01:45:26Z"

