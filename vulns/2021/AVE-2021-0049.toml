[basic]
description = "Windows 增强加密服务提供商（Enhanced Cryptographic Provider）存在特权提升漏洞。具有本地低权限访问权限的未经身份认证攻击者可通过向目标系统发送特制请求利用该漏洞，将自身权限提升至更高权限级别，从而执行任意代码、窃取敏感数据或进一步渗透内网。该漏洞影响 Windows 10 Version 1809/1909/2004/21H1 及 Windows Server 2019 等多个版本，CVSSv3 评分为 5.2，攻击复杂度较低且无需用户交互。该漏洞于 2021 年 6 月在 Microsoft 安全更新中被修复，且已被奥地利网络 mercenary 组织 KNOTWEED（又称 DSIRF）作为 0day 漏洞利用，与 Adobe Reader 远程代码执行漏洞 CVE-2021-28550 串联形成完整攻击链，用于投递 Subzero 恶意软件，针对欧洲及中美洲的律所、银行和咨询公司等高价值目标实施定向攻击。CISA 于 2021 年 11 月将该漏洞列入已知被利用漏洞目录（KEV）。"
published = "2021-06-08T23:15:08Z"
remediation = '立即安装 Microsoft 2021 年 6 月安全更新（参考 MSRC 公告 CVE-2021-31201），将 Windows 系统升级至修复版本：Windows 10 21H1/2004/20H2 需达到 OS Build 19043.1052/19041.1052/19042.1052，Windows 10 1909 需达到 18363.1621，Windows 10 1809/Windows Server 2019 需达到 17763.1999，Windows Server 2016 需达到 14393.4467。可通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载对应 KB 补丁安装。如无法立即更新，可临时限制本地低权限账户对 Enhanced Cryptographic Provider 的访问，并监控注册表 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Cryptography 下的异常配置变更。'
score = 5.2
severity = "MEDIUM"
sources = ["kev"]
title = "Microsoft Enhanced Cryptographic Provider 特权提升漏洞"
updated = "2026-06-17T03:51:26Z"

