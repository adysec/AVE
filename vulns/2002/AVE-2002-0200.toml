[basic]
description = "Microsoft SQL Server 2000 的 SQLXML 组件存在跨站脚本攻击（XSS）漏洞。该漏洞源于 SQLXML 在处理 XML SQL 查询时，未对 `root` 参数中的输入内容进行充分过滤与转义，攻击者可通过构造包含恶意脚本代码的 XML 标签，利用 `root` 参数将任意脚本注入到服务器响应中，从而在受害者浏览器上下文中执行任意 JavaScript 代码。未经身份认证的远程攻击者仅需能够访问启用了 SQLXML 功能的 SQL Server 实例即可发起攻击，利用该漏洞可窃取用户会话凭证、篡改页面内容或执行钓鱼攻击。Microsoft SQL Server 2000 全版本受影响，CVSS 评分 7.5，危害等级为高。"
published = "2002-07-03T04:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS02-030 提供的补丁：SQL Server 2000 Gold 版下载 https://www.microsoft.com/download/details.aspx?FamilyID=cf3f644b-f68f-4ec9-8808-34860f9dc31f，SQLXML 2.0 版下载 https://www.microsoft.com/download/details.aspx?FamilyID=b10fdc29-ba8e-4869-98e4-08464b2c8dd3，SQLXML 3.0 版下载 https://www.microsoft.com/download/details.aspx?FamilyID=05f1a309-be6e-49fe-968d-9833fa15cc12。安装后需重启服务器。如无法立即打补丁，应禁用 SQLXML HTTP 组件的虚拟目录，停止 IIS 中 SQLXML ISAPI 扩展的映射，并禁止通过 HTTP 执行即席 URL 查询。升级到 SQL Server 2000 SP3 及以上版本也可彻底修复此漏洞。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft SQL Server 2000 SQLXML 跨站脚本注入漏洞"
updated = "2026-06-16T21:56:57Z"

