[basic]
description = "RealNetworks RealPlayer 及 RealPlayer SP 在处理特制 RealMedia 视频文件时存在堆内存破坏漏洞。由于对畸形媒体文件中的数据结构缺乏正确的边界检查，远程攻击者可诱导用户打开恶意 RM 文件触发堆内存损坏，成功利用可实现任意代码执行或导致拒绝服务。该漏洞影响 RealPlayer 11.0 至 11.1、RealPlayer SP 1.0 至 1.1.4、Linux RealPlayer 11.0.2.1744 及 HelixPlayer 1.0.6 等版本，CVSS 评分 9.3，危害等级严重。"
published = "2010-12-14T16:00:04Z"
remediation = "立即升级 RealPlayer 至 12.0.1.609 或更高版本；Linux 用户将 HelixPlayer 升级至包含 RHSA-2010:0981 补丁的版本。如无法升级，在浏览器中禁用 RealPlayer 浏览器插件（nphelix.so 及相应的 ActiveX 控件），并避免打开来源不明的 RealMedia 视频文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer 堆内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:24:41Z"

