[basic]
description = "RealNetworks RealPlayer 11.0 至 11.1 版本及 RealPlayer SP 1.0 至 1.1.5 版本在解析 RealPix 文件时，对 HTTP 响应中的 Server 头部长度缺乏边界检查，存在基于堆的缓冲区溢出漏洞。远程攻击者可搭建恶意 Web 服务器，诱导用户打开 RealPix 链接，在 HTTP 响应中构造超长 Server 头部，触发堆内存破坏，进而在用户上下文中执行任意代码。该漏洞 CVSS 评分 9.3（AV:N/AC:M/Au:N/C:C/I:C/A:C），影响范围广泛，攻击条件为用户访问恶意链接且使用受影响版本 RealPlayer，利用方式为远程代码执行。"
published = "2010-12-14T16:00:05Z"
remediation = "建议立即升级 RealPlayer 至 12.0.1.609 或更高版本（RealPlayer SP 升级至 1.1.6+），可从 RealNetworks 官网下载最新安装包覆盖安装。若暂时无法升级，建议卸载 RealPlayer 并改用其他播放器，或在防火墙层面拦截来自不可信站点的 HTTP 响应中异常长的 Server 头部作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer RealPix 服务器头堆缓冲区溢出代码执行漏洞"
updated = "2026-06-16T23:24:42Z"

