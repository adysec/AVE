[basic]
description = "WordPress 的 wp-symposium 插件 15.8.1 及之前版本中存在反射型跨站脚本漏洞（CWE-79），该漏洞位于 `get_album_item.php` 文件中，由于对 `size` 参数缺乏充分的过滤与转义处理，攻击者可通过构造特制的 URL 诱使用户点击，从而在目标浏览器中执行任意 HTML 或 JavaScript 代码。攻击无需身份认证，但需要用户交互。成功利用可导致敏感信息泄露、会话劫持或钓鱼攻击。建议升级至最新版本或删除该插件。"
published = "2019-09-26T00:15:10Z"
remediation = "该插件已于 2015 年 9 月 11 日从 WordPress 官方仓库下架关闭，不再维护更新。建议立即卸载并删除 wp-symposium 插件，替换为其他仍在维护的社区/论坛插件。如因业务依赖暂时无法卸载，可手动编辑 get_album_item.php 文件，对 $_GET['size'] 参数添加 htmlspecialchars() 转义处理，并在 Web 应用防火墙（WAF）层面拦截包含恶意脚本的 size 参数请求作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress wp-symposium 插件跨站脚本漏洞"
updated = "2026-06-17T00:36:28Z"

