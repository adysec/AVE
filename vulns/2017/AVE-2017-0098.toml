[basic]
description = "WordPress Shortcodes Ultimate 插件（版本低于 5.0.1）存在远程代码执行漏洞。该漏洞源于插件在处理 meta、post 或 user 短代码中的 filter 参数时，未对用户输入进行充分过滤和验证（CWE-20），导致未经身份认证的攻击者可通过构造特制的短代码过滤器，在目标服务器上执行任意 PHP 代码。攻击者无需任何权限，仅需通过网络发送恶意请求即可触发，CVSS 评分 9.8，危害等级严重。建议用户立即升级至 5.0.1 或更高版本以修复此漏洞。"
published = "2019-08-22T14:15:12Z"
remediation = "立即将 WordPress 插件 Shortcodes Ultimate 升级至 5.0.1 或更高版本（当前最新版为 7.8.4），在 WordPress 后台「插件」页面找到该插件并点击「更新」，或通过 wp-admin/update-core.php 执行批量更新。如无法立即升级，可暂时停用该插件，并检查网站中是否存在通过 meta/post/user shortcode 传入恶意 filter 参数的攻击痕迹。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress shortcodes-ultimate插件 远程代码执行漏洞"
updated = "2026-06-17T01:13:08Z"

