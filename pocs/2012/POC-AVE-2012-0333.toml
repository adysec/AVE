[info]
author = "ave"
description = "验证Apple Safari WebKit内存破坏漏洞(CVE-2012-3656)，通过构造恶意网页触发内存越界写入，导致任意代码执行或拒绝服务"
id = "POC-AVE-2012-0333"
name = "CVE-2012-3656 PoC"
severity = "critical"
tags = ["ave-2012-0333"]
vuln_id = [
    "CVE-2012-3656",
    "AVE-2012-0333",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.headers]
User-Agent = "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_8) AppleWebKit/536.26 (KHTML, like Gecko) Version/6.0 Safari/536.26.1"

[[poc.requests.matchers]]
expect = true
part = "status"
status = [200]
type = "status"
