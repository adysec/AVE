[basic]
description = "KDE 个人防火墙（KPF）3.0.1 至 3.0.3a 版本中存在目录遍历漏洞。远程攻击者无需身份认证，通过向 kpf 服务发送带有特制 icon 参数的 URL，即可利用路径遍历绕过访问限制，以 kpf 进程用户权限读取服务器上的任意文件。该漏洞仅影响文件机密性，不涉及系统完整性或可用性，攻击复杂度较低。"
published = "2002-10-28T05:00:00Z"
remediation = "升级到 KDE 3.1.0 或更高版本（Debian 对应包版本 4:3.1.0-1），该版本已修复 kpf 目录遍历漏洞。如无法立即升级，可停止 kpf 服务（kill kpf 进程）或在防火墙层面限制对 kpf 默认端口 8001 的访问，仅允许可信来源连接。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "KDE KPF Icon Option 目录遍历漏洞"
updated = "2026-06-16T21:58:57Z"

