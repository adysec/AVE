[info]
author = "ave"
description = "验证 Crypt::Sodium::XS 模块是否捆绑了存在 CVE-2025-69277 漏洞的 libsodium 版本。通过检测 crypto_core_ed25519_is_valid_point 函数对非主加密群组的椭圆曲线点的错误接受行为，验证目标是否受影响。"
id = "POC-AVE-2025-0608"
name = "CVE-2025-15444 PoC"
severity = "critical"
tags = ["ave-2025-0608"]
vuln_id = [
    "CVE-2025-15444",
    "AVE-2025-0608",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/vendor/crypt-sodium-xs/lib/Sodium/Crypto/Core/Ed25519.php"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["crypto_core_ed25519_is_valid_point"]
