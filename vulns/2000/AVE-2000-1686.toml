[basic]
description = "pam_smb 和 pam_ntdom 可插拔认证模块（PAM）存在缓冲区溢出漏洞，远程攻击者可通过向目标系统发送特制的超长用户名进行登录认证，触发缓冲区溢出，从而以 root 权限执行任意命令。该漏洞影响使用 SMB 和 NT 域认证的 Linux/Unix 系统，CVSS 评分 10.0，危害等级严重。攻击无需身份认证，利用难度低，可导致目标系统完全失陷。"
published = "2000-11-14T05:00:00Z"
remediation = "升级 pam_smb 至 1.1.7 及以上版本（Debian 已发布 DSA-20000911 安全更新，Mandrake Linux 发布 MDKSA-2000-047 补丁）。如无法立即升级，可在 /etc/pam.d/ 配置中移除 pam_smb.so 和 pam_ntdom.so 模块，或通过 hosts.allow/deny 限制 SMB 认证服务的来源 IP 范围作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Samba pam_smb 和 pam_ntdom PAM 认证模块缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:34Z"

