[basic]
description = "Mozilla Firefox 4.x至13.0、Firefox ESR 10.x至10.0.6、Thunderbird 5.0至13.0、Thunderbird ESR 10.x至10.0.6以及SeaMonkey 2.11之前版本的浏览器引擎中存在多处未指定的内存安全漏洞。远程攻击者可利用特制网页触发内存破坏，导致目标应用程序崩溃或拒绝服务，在特定条件下可进一步实现任意代码执行。攻击者仅需诱使用户访问恶意构造的页面即可触发漏洞，无需任何身份认证。Mozilla已在Firefox 14及后续版本中修复此漏洞。"
published = "2012-07-18T10:26:48.470"
remediation = "升级 Mozilla Firefox 至 14.0 及以上版本、Firefox ESR 至 10.0.6 及以上版本、Thunderbird 至 14.0 及以上版本、Thunderbird ESR 至 10.0.6 及以上版本、SeaMonkey 至 2.11 及以上版本。各 Linux 发行版用户可通过包管理器安装安全更新，如 Red Hat 执行 yum update firefox、Ubuntu/Debian 执行 apt-get install --only-upgrade firefox。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:40:37.813"

