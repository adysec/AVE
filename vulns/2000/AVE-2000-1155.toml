[basic]
description = "Xitami 2.5b 在默认安装时会在 cgi-bin 目录下安装 testcgi.exe 程序，未经身份认证的远程攻击者可以直接访问该程序路径，获取 Web 服务器的敏感配置信息。该漏洞影响运行 Xitami 2.5b 版本的服务器，攻击者无需任何凭据即可在远程环境下通过 HTTP 请求触发信息泄露，从而为进一步渗透攻击提供有价值的服务器环境参数。"
published = "2000-12-31T05:00:00Z"
remediation = "1. 升级 Xitami 至最新版本，移除 cgi-bin 目录下的 testcgi.exe 程序，或在服务器配置中禁止对该程序的 Web 访问。2. 在防火墙或 Web 服务器 ACL 中拦截对 /cgi-bin/testcgi.exe 的外部访问请求。3. 审查 cgi-bin 目录下其他可能泄露敏感信息的脚本，及时删除不必要的测试程序。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Xitami Web Server 敏感信息泄露漏洞"
updated = "2026-06-16T21:53:25Z"

