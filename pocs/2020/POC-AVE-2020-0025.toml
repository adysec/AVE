[info]
author = "ave"
description = "验证Apple iOS/iPadOS/tvOS中AVVideoEncoder组件存在越界写入漏洞，通过构造恶意媒体文件触发内存破坏，以内核权限执行任意代码。需要用户交互播放恶意媒体。"
id = "POC-AVE-2020-0025"
name = "CVE-2020-9907 PoC"
severity = "high"
tags = ["ave-2020-0025"]
vuln_id = [
    "CVE-2020-9907",
    "AVE-2020-0025",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/var/mobile/Media/Payload/MaliciousPayload.m4s"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = ".+"
type = "regex"
