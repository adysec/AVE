[basic]
description = "多种以太网网卡（NIC）设备驱动程序在发送数据包时未使用空字节对帧进行填充，导致未初始化的内核内存或先前数据包中的残留信息被泄露给远程攻击者，即 Etherleak 信息泄露漏洞。攻击者可通过发送特制的畸形数据包，从受影响的系统内存中窃取敏感数据，如加密密钥或认证凭据。该漏洞影响大量使用未正确填充帧的网卡驱动程序的系统，攻击条件简单，无需认证即可远程利用。"
published = "2003-01-17T05:00:00Z"
remediation = "Linux 系统：Red Hat 用户安装 RHSA-2003:025（内核 2.4）或 RHSA-2003:088（内核 2.2）更新内核包，或通过 up2date 工具自动更新；Debian 用户安装 DSA-311/312/332/336 对应内核补丁。HP-UX 用户安装 PHNE_29244（VVOS EISA 100BT）和 PHNE_29267（VVOS LAN）等累积补丁。Windows 用户更新 Intel NDIS2 驱动至 v3.2 或更新网卡厂商驱动。临时缓解措施：对网络流量启用 IPSec/TLS 加密，减少泄露数据可利用性；在防火墙上对短帧进行零填充过滤。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "多厂商以太网网卡设备驱动程序帧填充信息泄露漏洞（Etherleak）"
updated = "2026-06-16T22:01:19Z"

