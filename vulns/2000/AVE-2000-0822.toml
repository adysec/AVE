[basic]
description = "Recourse ManTrap 1.6 蜜罐系统存在隐藏进程泄露漏洞。由于该版本未能正确隐藏系统内运行的进程信息，攻击者可通过对比 kill 命令的输出结果与 /proc 文件系统中的进程列表，发现两者之间存在差异，从而判断自身处于蜜罐环境之中。该漏洞攻击复杂度低，本地攻击者无需身份认证即可利用，导致蜜罐系统被识别而失效。CVSS 评分 2.1，危害等级低。"
published = "2001-01-09T05:00:00Z"
remediation = "Recourse ManTrap 1.6 已于 2000 年代停止维护，官方无补丁可用。建议立即迁移至现代蜜罐方案（如 T-Pot、Cowrie、Honeyd 等），这些方案默认隐藏宿主机进程信息。若必须继续使用 ManTrap，可在系统层通过 LSM（如 SELinux）或自定义内核模块拦截对 /proc 中非蜜罐进程的读取，同时限制攻击者的本地 shell 访问权限以降低暴露风险。"
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "Recourse ManTrap 1.6 隐藏进程泄露漏洞"
updated = "2026-06-16T21:53:14Z"

