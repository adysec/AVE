[basic]
description = "Electron 框架的 contextBridge 对象复制机制存在原型污染漏洞，未经身份认证的远程攻击者可通过渲染进程向主进程传递特制构造的 JavaScript 对象，使该对象携带攻击者控制的 prototype 属性。尽管 context isolation（上下文隔离）已启用，攻击者仍可通过原型链污染的方式对 preload 脚本执行未授权操作，进而影响主进程的安全模型。该漏洞影响所有使用 Electron 39.x 至 41.x 版本的桌面应用程序，具体触发条件为：应用的 preload 代码接收来自不可信内容的对象参数，并在未进行 own-property 检查的情况下直接读取对象属性。CVSS 3.1 评分为 5.4，危害等级为中危，CWE 分类为 CWE-1321。Electron 官方已在 39.8.9、40.9.2、41.2.2 及 42.0.0-beta.4 版本中修复该问题，建议用户升级至安全版本。"
published = "2026-08-05T18:17:15Z"
remediation = "升级 Electron 到修复版本：39.x 用户升级至 39.8.9，40.x 用户升级至 40.9.2，41.x 用户升级至 41.2.2，42.x 测试版升级至 42.0.0-beta.4。如在 preload 脚本中通过 contextBridge 接收来自不可信内容的对象，需使用 Object.hasOwn 进行 own-property 校验，或先将对象复制到 null-prototype 对象上再使用，防止原型污染攻击。"
score = 5.4
severity = "MEDIUM"
sources = ["ghsa"]
title = "Electron contextBridge 对象原型污染漏洞"
updated = "2026-08-06T15:17:27Z"

