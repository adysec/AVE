[basic]
description = "HP Intelligent Management Center（IMC）5.0 E0101L02之前版本的dbman.exe组件日志功能中存在基于栈的缓冲区溢出漏洞。远程攻击者无需身份认证即可通过发送特制的action相关数据包触发该漏洞，导致栈缓冲区溢出，最终实现远程代码执行。该漏洞影响HP IMC 5.0及更早版本，CVSS评分10.0，危害等级严重。HP已发布安全更新修复此漏洞。"
published = "2011-05-13T17:05:44Z"
remediation = "立即升级 HP Intelligent Management Center 至 5.0 E0101L02 或更高版本，该版本已修复 dbman.exe 组件中的栈缓冲区溢出漏洞。如无法立即升级，建议在网络边界防火墙中限制对 IMC 服务器 14345/TCP 等管理端口的访问，仅允许可信 IP 连接，并禁用不必要的 IMC 子服务以缩小攻击面。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "HP Intelligent Management Center dbman.exe 栈缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T23:30:14Z"

