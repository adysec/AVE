[basic]
description = "Microsoft Windows 2000 Telnet 服务在处理包含退格字符（Backspace）的长登录命令时存在输入验证缺陷，攻击者无需身份认证即可通过向目标 Telnet 服务发送特制且包含大量退格字符的登录字符串触发该漏洞，导致 Telnet 服务进程崩溃并拒绝服务。该漏洞影响运行 Windows 2000 操作系统的设备，攻击条件要求目标系统开放 Telnet 服务端口（默认 23 端口）且可被远程访问，攻击者仅需建立 TCP 连接并发送构造的恶意登录数据即可成功利用，造成服务中断。"
published = "2001-07-21T04:00:00Z"
remediation = "安装 Microsoft 安全公告 MS01-031 对应的补丁（KB299553），该补丁可修正 Telnet 服务对包含退格符的长登录命令的输入验证缺陷。补丁适用于 Windows 2000 Service Pack 1 及 Service Pack 2，安装后无需重启系统。如暂无法安装补丁，建议在防火墙中阻断 TCP 23 端口的入站访问，或通过服务管理器禁用 Telnet 服务作为临时缓解措施。补丁将集成至 Windows 2000 Service Pack 3，建议后续升级至该 Service Pack 以获得完整保护。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows 2000 Telnet 服务拒绝服务漏洞"
updated = "2026-06-16T21:54:08Z"

