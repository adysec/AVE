[basic]
description = "Keras 3.11.3 版本的 `keras.utils.get_file()` 函数在处理 tar 归档文件时存在路径遍历漏洞。该函数使用 Python 的 `tarfile.extractall()` 方法解压文件，但未设置安全关键的 `filter='data'` 参数。虽然 Keras 尝试通过 `filter_safe_paths()` 过滤不安全路径，但该过滤发生在解压之前，而解压过程中存在 PATH_MAX 符号链接解析缺陷，导致路径长度限制使符号链接解析失败，从而绕过安全检查，将文件写入预期解压目录之外。攻击者可利用特制的 tar 归档文件，通过诱导用户调用 `get_file()` 处理恶意归档，实现向缓存目录外任意位置写入文件，可能导致系统被入侵或恶意代码执行。该漏洞 CVSS 评分 8.0，危害等级高，影响 Keras 3.11.3 及之前版本。"
published = "2025-11-28T15:16:00Z"
remediation = "升级 Keras 至已修复版本（如官方发布补丁后升级至 3.11.4 或更高版本）。如无法立即升级，在调用 `keras.utils.get_file()` 处理 tar 归档时，手动为 `tarfile.extractall()` 添加 `filter='data'` 参数，或避免从不可信来源下载并解压 tar 文件。作为临时缓解措施，可在应用层对 `get_file()` 的下载路径和文件类型进行白名单校验，限制解压目标目录的写入权限。"
score = 8
severity = "HIGH"
sources = ["msrc"]
title = "Keras keras.utils.get_file() 路径遍历漏洞"
updated = "2026-06-17T08:32:43Z"

