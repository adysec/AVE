[basic]
description = "Windows Shell 在处理文件路径时由于缺乏足够的验证，导致存在远程代码执行漏洞。攻击者可以通过诱导用户打开一个精心构造的恶意文件（如快捷方式或特定路径文件），利用该路径校验缺陷触发漏洞，从而在受害者系统中以当前用户权限执行任意代码。该漏洞主要影响 Windows 10 及其服务器版本，CVSS 评分为 8.8，具有较高的威胁等级。"
published = "2018-08-15T17:29:10Z"
remediation = "建议立即安装微软 2018 年 8 月发布的累积安全更新（如 Windows 10 版本的 KB4035129 或相关补丁），通过 Windows Update 自动更新或从 Microsoft Update Catalog 下载安装，以修复 Windows Shell 的路径验证漏洞。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Shell 远程代码执行漏洞"
updated = "2026-06-17T02:04:48Z"

