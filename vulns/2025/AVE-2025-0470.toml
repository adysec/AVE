[basic]
description = "GNU Binutils 的 ld 链接器组件中 ld/ldelfgen.c 文件的 link_order_scan 函数存在内存泄漏漏洞（CWE-401）。远程攻击者可通过向受影响系统提交特制的链接输入文件触发该漏洞，导致进程内存资源未被正确释放，长期运行可能造成系统资源耗尽。该漏洞攻击复杂度较高，需要用户交互（如诱使用户处理恶意文件），且仅影响可用性，不涉及机密性和完整性。GNU Binutils 2.43 版本受影响，维护者已在 master 分支修复所有已知泄漏，但未合入 2.44 分支以避免稳定性风险。"
published = "2025-02-10T14:15:29Z"
remediation = "升级 GNU Binutils 至 2.44 或更高版本（所有内存泄漏已在 master 分支修复）。SUSE 用户可安装 SUSE-SU-2025:4096-1 安全更新。如无法立即升级，避免在 ld 链接过程中使用受影响的功能模块作为临时缓解措施。"
score = 2.3
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils ld 组件 link_order_scan 内存泄漏漏洞"
updated = "2026-06-17T08:38:27Z"

