[basic]
description = "Libvirt 虚拟化管理工具中存在不安全的默认权限漏洞（CWE-276），当为已关闭的虚拟机创建外部非活动快照时，生成的快照文件被错误地设置为全局可读（world-readable），导致本地低权限用户能够读取这些快照文件，从而获取客户机操作系统的敏感信息。攻击者需拥有本地访问权限，且目标虚拟机已关闭并存在非活动快照文件。此漏洞影响 libvirt 多个版本，CVSS 评分 5.5，危害等级中危。"
published = "2025-11-17T17:15:47Z"
remediation = "tags.<value>升级 libvirt 至 v11.10.0（2025-12-01 发布）或更高版本，该版本在提交 a379327d 中为 qemu-img 设置 umask 077，确保创建的外部非活跃快照文件仅属主可读。对于已存在的快照，执行 `find /var/lib/libvirt/images -name '*.snap' -o -name '*.qcow2' | xargs chmod 600` 收紧权限。Debian 用户参考 #1120119，openSUSE 用户安装 openSUSE-SU-2025-20100-1 安全更新。如无法立即升级，可在 qemu-img 调用前手动设置 umask 077 作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Red Hat libvirt 虚拟机快照信息泄露漏洞"
updated = "2026-06-30T00:16:52Z"

