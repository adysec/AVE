[basic]
description = "PRTG Network Monitor 在 18.2.39 版本之前存在 OS 命令注入漏洞。该漏洞源于传感器或通知管理场景中对用户输入参数的过滤不严，允许拥有系统管理员权限的攻击者通过发送恶意构造的参数，在 PRTG 服务器及其监控的设备上执行任意操作系统命令。攻击者需具备管理员权限才能触发此漏洞，成功利用后可实现远程代码执行（RCE），导致系统被完全控制。"
published = "2018-07-02T16:29:00Z"
remediation = "建议立即将 PRTG Network Monitor 升级至 18.2.39 或更高版本，以修复 OS 命令注入漏洞。在更新完成前，应严格限制 PRTG 系统管理员 Web 控制台的访问权限，仅允许可信的管理员账户登录。"
score = 7.2
severity = "HIGH"
sources = ["kev"]
title = "Paessler PRTG Network Monitor 命令注入漏洞"
updated = "2026-06-17T02:06:20Z"

