[basic]
description = "Hono Web 应用框架的 css 模块中 cx() 函数存在 JSX 转义绕过漏洞。该函数将组合后的类名字符串标记为已转义状态，但未对输入进行 HTML 转义处理。当服务端渲染 JSX 时，攻击者可通过在 className 中注入未转义的特殊字符（如双引号）突破 class 属性边界，插入任意 HTML 标签和脚本，导致跨站脚本攻击。该漏洞影响 Hono 4.0.0 至 4.12.27 版本，攻击者无需认证，远程利用但需用户交互触发。"
published = "2026-07-08T17:17:27Z"
remediation = '立即将 Hono 升级至 v4.12.27 或以上版本（npm install hono@^4.12.27）。升级后，cx() 函数会对输入进行 HTML 转义，防止 className 中的特殊字符突破 class 属性边界。如无法立即升级，避免将用户可控的输入直接传递给 cx() 函数，或在服务端渲染前对 className 参数进行严格的 HTML 实体编码（如将 " 转义为 &quot;）。'
score = 6.1
severity = "MEDIUM"
sources = ["ghsa"]
title = "Hono cx() 服务端跨站脚本漏洞"
updated = "2026-07-10T19:53:22Z"

