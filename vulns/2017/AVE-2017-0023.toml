[basic]
description = "Subrion CMS 4.1.5.9 及之前版本的前端搜索功能（/front/search.php）存在 SQL 注入漏洞，攻击者通过 $_GET 数组传入特制参数即可触发，无需身份认证。成功利用可导致攻击者远程获取数据库敏感信息、篡改数据甚至获取服务器控制权。该漏洞影响范围广泛，CVSS 评分 9.8，危害等级严重。官方已在 4.1.5.10 版本中修复。"
published = "2017-07-19T07:29:00Z"
remediation = "建议立即升级 Subrion CMS 至 4.1.5.10 或更高版本；若暂时无法升级，可在 Web 应用防火墙配置 SQL 注入防护规则拦截 /front/search.php 的恶意 $_GET 参数，或在 PHP 配置中启用预处理语句防护作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Intelliants Subrion CMS SQL注入漏洞"
updated = "2026-06-17T01:01:49Z"

