[basic]
description = "HP JetDirect 打印卡固件 X.08.04、X.08.05 及 X.08.20 及更早版本中的 FTP 服务存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标设备发送特制的 FTP 请求数据包触发该溢出，导致打印卡服务崩溃或重启，从而造成拒绝服务。该漏洞影响运行上述受影响固件版本的 HP JetDirect 打印服务器及网络打印设备，攻击者无需任何凭据即可在网络可达的情况下直接利用，攻击条件简单，利用难度低，主要造成服务可用性中断而非数据泄露。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级 HP Jetdirect 打印服务器固件至厂商发布的最新版本，修复 FTP 服务缓冲区溢出漏洞。升级固件可从 HP 官方支持网站下载对应型号的最新固件包并刷写。如暂无法升级，可在网管设备上通过防火墙或 ACL 规则阻断对 Jetdirect FTP 端口（TCP 21）的访问，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "惠普 Jetdirect FTP 服务缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:53:04Z"

