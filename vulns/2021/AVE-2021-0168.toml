[basic]
description = "SonicWall SMA 100 系列安全远程访问（SRA）设备存在 SQL 注入漏洞，由于对 SQL 命令中特殊元素的转义处理不当，未经身份认证的远程攻击者可通过发送精心构造的恶意请求注入任意 SQL 语句，导致数据库信息泄露、篡改甚至服务器完全接管。该漏洞影响所有 8.x 固件版本及 9.0.0.9-26sv 或更早版本的 SRA 设备，CVSS 评分 9.8（严重），攻击向量为网络、低复杂度、无需权限和用户交互。SonicWall 已确认受影响产品为生命周期结束（EOL）设备，建议用户尽快升级至最新固件或迁移至受支持的替代产品。"
published = "2021-08-04T19:15:08.247"
remediation = "受影响设备包括 SRA 1600/4600/VA 及 SMA 210/410/500v 全系列，其固件 8.x 全版本及 9.0.0.9-26sv 之前均存在 SQL 注入漏洞且已停止支持。由于受影响产品已进入生命周期终止状态，SonicWall 未再发布修复固件，应立即将设备下线停用并替换为 SMA 1000 系列等受支持的新款安全远程访问设备；如短期内无法完成硬件替换，应将旧设备从网络中断开隔离，同时通过防火墙严格限制对管理界面的访问，仅允许可信内部 IP 连接，并加强周边流量监控以检测潜在利用行为。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "SonicWall SRA 210 固件 SQL 注入漏洞"
updated = "2026-06-17T03:33:10.393"

