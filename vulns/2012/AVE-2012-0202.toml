[basic]
description = "Mozilla Firefox/Thunderbird/SeaMonkey 的 nsHTMLReflowState::CalculateHypotheticalBox 函数中存在堆缓冲区溢出漏洞。当用户调整包含嵌套列中绝对定位和相对定位元素的窗口大小时，远程攻击者可利用该漏洞触发堆缓冲区溢出，导致浏览器崩溃或执行任意代码。该漏洞影响 Firefox 4.x 至 12.0、Firefox ESR 10.x 至 10.0.5 之前版本、Thunderbird 5.0 至 12.0、Thunderbird ESR 10.x 至 10.0.5 之前版本以及 SeaMonkey 2.10 之前版本，CVSS 评分 9.3，危害严重。攻击者需诱导用户访问特制网页并执行窗口缩放操作方可利用。"
published = "2012-06-05T23:55:01Z"
remediation = "升级 Firefox 至 13.0 及以上版本（ESR 分支升级至 10.0.5 及以上），Thunderbird 升级至 13.0 及以上版本（ESR 分支升级至 10.0.5 及以上），SeaMonkey 升级至 2.10 及以上版本。无法立即升级时，可在浏览器中禁用 JavaScript（about:config 设置 javascript.enabled=false）并避免访问不可信网站作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 堆缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T23:40:36Z"

