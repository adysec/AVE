[basic]
description = "LogonTracer 1.2.0 及之前版本存在 OS 命令注入漏洞，攻击者可通过向 /upload 接口发送特制请求，在未经身份认证的情况下远程执行任意系统命令。该漏洞源于程序未对用户上传的文件名参数进行有效过滤，导致攻击者可注入恶意命令。CVSS 评分 9.8，攻击复杂度低，无需权限和用户交互，可完全控制目标服务器。JPCERTCC 已在 v1.2.1 中修复。"
published = "2019-01-09T23:29:03Z"
remediation = "立即升级 LogonTracer 至 v1.2.1 或更高版本（https://github.com/JPCERTCC/LogonTracer/releases/tag/v1.2.1）。该版本修复了 upload 功能中未对用户输入做充分过滤导致的 OS 命令注入问题。如无法升级，建议限制对 /upload 路径的外部访问，仅允许受信任内网 IP 访问 Web 服务。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "JPCERTCC LogonTracer upload 远程命令执行漏洞"
updated = "2026-06-17T01:43:48Z"

