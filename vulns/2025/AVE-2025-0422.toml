[basic]
description = "Google Chrome 的 Network 组件存在释放后重用（Use After Free）漏洞。远程攻击者可通过构造特制的 Web 应用诱导用户访问，成功利用该漏洞可触发堆内存破坏，导致信息泄露、任意代码执行或拒绝服务。该漏洞影响 Chrome 133.0.6943.126 之前版本，CVSS 评分 8.8，危害等级高。用户需交互（点击恶意链接或访问恶意页面）方可触发，Google 已在 2025 年 2 月发布安全更新修复。"
published = "2025-02-19T17:15:15Z"
remediation = "升级 Google Chrome 至 133.0.6943.126 或更高版本，可通过「设置→关于 Chrome」自动检查更新。使用 Microsoft Edge 的用户应升级至 133.0.3065.82 或更高版本。基于 Chromium 的第三方浏览器（如 Opera、Brave）请关注厂商对应安全更新。如无法立即更新，可禁用 WebRTC 或限制不可信网页加载作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome Network 释放后使用漏洞"
updated = "2026-06-17T08:38:12Z"

