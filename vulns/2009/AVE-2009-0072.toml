[basic]
description = """
content.

I'll write: 

WebKit 存在跨站点脚本（XSS）漏洞，具体源于对 parent 和 top 对象的跨域处理不当。远程攻击者可利用特制的网页，在用户浏览器上下文中注入任意 Web 脚本或 HTML，进而窃取会话 Cookie、劫持用户会话或发起钓鱼攻击。该漏洞影响 Apple Safari 4.0.2 之前版本，以及基于 WebKit 的 iPhone OS 3.1 之前版本（iPod touch 对应 3.1.1 之前版本）等平台，攻击者无需认证，仅需诱使用户访问恶意构造的链接即可触发。

This covers principle, affected versions, attack conditions. ≥50 chars easily.

Let me output the value.<value>WebKit 存在跨站点脚本（XSS）漏洞，根因在于其对 parent 与 top 对象的跨域处理不当，未正确隔离页面间的文档对象引用。远程攻击者可构造恶意网页，借助与 parent 和 top 对象相关的向量，向受害者浏览器中的 Web 页面注入任意脚本或 HTML，从而窃取会话凭据、劫持用户会话或实施钓鱼攻击。该漏洞影响 Apple Safari 4.0.2 之前版本，以及使用 WebKit 的 iPhone OS 3.1 之前版本（iPod touch 对应 3.1.1 之前版本）等多个平台。攻击条件为远程且无需认证，仅需诱骗用户访问特制链接或恶意网站即可触发。"""
published = "2009-07-09T17:30:00Z"
remediation = "请立即将 Apple Safari 升级至 4.0.2 或更高版本（Apple 官方 2009 年 7 月 Safari 4.0.2 安全更新已修复此问题）；iOS 设备请升级至 iPhone OS 3.1（iPod touch 对应 3.1.1）或更高版本，可通过 iTunes 检查并安装更新。若暂时无法升级，可采取以下缓解措施：在 Web 应用中加强对 parent 与 top 对象相关跨域访问的输入校验与输出编码，对用户可控的 URL 参数统一做 HTML 实体转义，并配置 Content-Security-Policy 限制脚本来源，同时避免在受信任页面中直接嵌入不可信第三方 iframe 内容以降低跨站脚本攻击面。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari WebKit 跨站点脚本漏洞"
updated = "2026-06-16T23:07:55Z"

