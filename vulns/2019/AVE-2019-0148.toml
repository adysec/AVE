[basic]
description = "多款TOTOLINK路由器基于Realtek SDK固件存在操作系统命令注入漏洞。攻击者需先通过身份认证，随后向boafrm/formSysCmd URI的sysCmd参数发送特制请求即可注入并执行任意操作系统命令，从而获取设备的完全控制权。该漏洞影响A3002RU、A702R、N301RT、N302R、N300RT、N200RE、N150RT、N100RE、N302RE等多款型号的特定固件版本，CVSS评分为8.8，危害等级为高危。攻击者无需依赖Web界面(syscmd.htm)即可利用此漏洞。TOTOLINK已发布固件更新修复该问题。"
published = "2020-01-27T18:15:12.960"
remediation = "升级TOTOLINK路由器固件至最新版本（A3002RU需升级至2.0.0以上，A702R需升级至2.1.3以上，N301RT需升级至2.1.6以上，N302R/N300RT/N150RT/N100RE需升级至3.4.0以上，N200RE需升级至4.0.0以上，N302RE需升级至2.0.2以上）。若设备已停止支持，应立即停止使用并更换为其他品牌路由器。在未打补丁前，可临时将路由器管理界面从WAN侧禁用，并通过防火墙限制仅允许内网IP访问管理页面。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "TOTOLINK 多款路由器操作系统命令注入漏洞"
updated = "2026-06-17T02:27:18.267"

