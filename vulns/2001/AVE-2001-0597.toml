[basic]
description = "Mac OS Runtime for Java（MRJ）2.2.3 存在安全漏洞，允许远程攻击者通过恶意 Java 小程序利用 ARCHIVE 标签参数读取超出 CODEBASE 上下文的本地文件。该漏洞影响使用 MRJ 2.2.3 的 Mac OS 系统，攻击者无需身份认证即可触发。攻击条件为受害者浏览器加载包含恶意 ARCHIVE 参数的 Java 小程序，利用该参数可遍历并读取目标系统上的任意文件，可能导致敏感信息泄露。CVSS 评分为 2.6，危害等级较低。"
published = "2001-02-12T05:00:00.000"
remediation = "立即升级Mac OS Runtime for Java (MRJ)至2.2.4或更高版本，或迁移至Apple Java运行时。禁用浏览器中的Java小程序功能以临时缓解风险。"
score = 2.6
severity = "LOW"
sources = ["epss"]
title = "Apple Mac OS Runtime for Java 路径遍历漏洞"
updated = "2026-06-16T21:53:35.767"

