[basic]
description = "Pegasus Mail 4.01 及更早版本在处理邮件消息头（To 和 From 字段）时存在缓冲区溢出漏洞。远程攻击者可向目标用户发送包含超长邮件头部的恶意邮件，触发缓冲区溢出，导致邮件客户端崩溃（拒绝服务），在特定条件下可进一步实现任意代码执行。攻击者无需身份认证，仅需诱使用户在 Pegasus Mail 中打开或预览恶意邮件即可触发。"
published = "2002-10-04T04:00:00.000"
remediation = "立即升级 Pegasus Mail 至 4.02 或更高版本，该版本已修复邮件头缓冲区溢出问题。如无法升级，建议更换为其他受支持的邮件客户端（如 Thunderbird），并配置邮件网关过滤超长 To/From 头字段（超过 259 字符）的邮件作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Pegasus Mail 消息头缓冲区溢出漏洞"
updated = "2026-06-16T21:58:40.780"

