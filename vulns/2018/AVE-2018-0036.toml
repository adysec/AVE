[basic]
description = 'NComputing vSpace Pro 10 和 11 版本的 NC Monitor Server (NcMonitorServer.exe) 存在目录遍历漏洞。由于服务端未能对用户请求的路径参数进行有效校验，远程未经身份验证的攻击者可以通过向 TCP 8667 端口发送包含 "../" 或 "..\" 等遍历序列的特制 URL 请求，绕过 Web 根目录限制，从而读取服务器上的任意敏感文件。该漏洞会导致机密信息泄露，影响 vSpace Pro 10 及 11 系列产品的安全性。'
published = "2018-04-20T08:29:00Z"
remediation = "立即更新 NComputing vSpace Pro 至最新安全版本以修复路径过滤缺陷。若无法立即升级，建议在防火墙层面严格限制 TCP 8667 端口的外部访问，仅允许授权的内部管理 IP 访问，以防止远程攻击者利用目录遍历漏洞读取敏感文件。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "NComputing vSpace Pro NC Monitor Server 目录遍历漏洞"
updated = "2026-06-17T01:33:40Z"

