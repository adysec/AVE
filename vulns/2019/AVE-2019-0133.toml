[basic]
description = 'tags.<value>小米 Mi WiFi R3G 路由器在 2.28.23-stable 版本之前存在目录遍历漏洞（CWE-22）。由于 NGINX 配置中的别名（alias）路径未正确过滤特殊字符，攻击者可通过构造包含 "../" 路径遍历序列的 HTTP 请求，绕过身份认证并读取设备上的任意文件，例如通过访问 api-third-party/download/extdisks../etc/config/account 获取账户配置文件。该漏洞影响未升级固件的 Xiaomi Mi WiFi R3G 设备，攻击者无需任何身份凭证即可远程利用，危害等级为高危。'
published = "2019-10-23T21:15:10.823"
remediation = "升级到小米路由器固件版本 2.28.23-stable 或更高版本，该版本修复了 NGINX 配置中的目录遍历漏洞。如无法立即升级，可通过防火墙规则禁止外部访问 /api-third-party/download/ 路径作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "小米 Mi WiFi R3G 目录遍历漏洞"
updated = "2026-06-17T02:24:55.540"

