[basic]
description = "AOL Instant Messenger (AIM) 4.1.2010 版本存在格式化字符串漏洞，远程攻击者无需身份认证即可通过向目标用户传输包含格式化字符（如 %s、%n 等）的特殊构造文件名，触发客户端对文件名进行格式化字符串解析，导致拒绝服务或可能执行任意命令。该漏洞影响 AIM 4.1.2010 版本，攻击者只需诱使用户接收并处理恶意文件即可触发，利用难度较低。"
published = "2000-12-11T05:00:00.000"
remediation = "AOL Instant Messenger (AIM) 已于 2017 年 12 月正式关闭服务，AOL 不再发布任何安全更新。建议立即卸载 AIM 4.1.2010 及更早版本，迁移至其他受支持的即时通讯软件（如 Signal、Telegram 等）。如因业务兼容性必须使用 AIM，应在传输文件前对文件名进行严格的格式字符串过滤，避免文件名包含 %n、%s 等格式化字符，同时在网络边界防火墙封禁 AIM 使用的 5190 端口以降低攻击面。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "AOL Instant Messenger 格式化字符串远程代码执行漏洞"
updated = "2026-06-16T21:52:56.670"

