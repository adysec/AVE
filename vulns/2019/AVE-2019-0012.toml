[basic]
description = "Windows Win32k 组件在处理内存对象时存在特权提升漏洞，由于内存对象处理逻辑缺陷，本地攻击者可通过构造恶意调用触发内存对象处理逻辑错误，从而将低权限提升至 SYSTEM 权限。该漏洞影响 Windows 7/8.1/10 及 Server 2008/2012/2016/2019 等版本，CVSS 3.1 评分 7.8（HIGH），攻击向量为本地（AV:L），攻击复杂度低（AC:L），需低权限（PR:L）且无需用户交互（UI:N），机密性/完整性/可用性影响均为高（C:H/I:H/A:H）。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），确有在野利用案例，攻击者可结合其他漏洞实现远程代码执行。Microsoft 已于 2019 年 4 月补丁日发布安全更新修复此漏洞。"
published = "2019-04-09T21:29:02Z"
remediation = "立即安装微软 2019 年 4 月补丁日发布的安全更新：Windows 7 SP1/Server 2008 R2 安装 KB4493472，Windows 8.1/Server 2012 R2 安装 KB4493441，Windows 10 1607/Server 2016 安装 KB4493474，Windows 10 1703 安装 KB4493464，Windows 10 1709 安装 KB4493448，Windows 10 1803 安装 KB4493467，Windows 10 1809/Server 2019 安装 KB4493509。若暂无法打补丁，可启用 Windows Defender Exploit Guard 的任意代码执行防护（ACG/CFG）并禁用不受信字体解析作为临时缓解，同时限制本地低权限用户登录权限。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Win32k 特权提升漏洞"
updated = "2026-06-17T02:09:03Z"

