[basic]
description = "这是一个安全绕过漏洞，存在于 Cisco Secure Access Control Server (ACS) 2.4(2) 及更早版本中。当 LDAP 服务器允许空密码时，远程攻击者可以绕过服务器上的 LDAP 认证机制，直接获取认证权限。该漏洞的攻击向量为网络远程，攻击复杂度低，且无需任何身份验证即可利用。漏洞的 CVSS 评分约为 7.5，安全影响程度为中高，攻击者可以部分窃取目标系统的机密数据，篡改系统完整性数据，并导致系统可用性部分降低。攻击者只需向目标服务器发送特制的认证请求包，即可利用 LDAP 空密码验证漏洞，轻易绕过身份认证机制，达到未授权访问的目的。"
published = "2000-12-11T05:00:00Z"
remediation = "tags. I'll create a comprehensive remediation in Chinese that's at least 20 characters long.<value>立即升级CiscoSecure ACS服务器至2.4(3)或更高版本，禁用LDAP服务器的空密码认证机制，并在访问控制列表中添加对授权用户的严格验证规则作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "思科 CiscoSecure 服务器身份验证绕过漏洞"
updated = "2026-06-16T21:53:03Z"

