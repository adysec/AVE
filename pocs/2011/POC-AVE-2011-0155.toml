[info]
author = "ave"
description = "WebKit 内存破坏远程代码执行漏洞验证，通过构造恶意网页触发 Safari/ITunes 中 WebKit 引擎的内存 corruption，导致拒绝服务或任意代码执行"
id = "POC-AVE-2011-0155"
name = "CVE-2011-2869 PoC"
severity = "high"
tags = ["ave-2011-0155"]
vuln_id = [
    "CVE-2011-2869",
    "AVE-2011-0155",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.headers]
User-Agent = "Mozilla/5.0 (iPhone; CPU iPhone OS 5_0 like Mac OS X) AppleWebKit/534.46 (KHTML, like Gecko) Version/5.1 Mobile/9A334 Safari/7534.48.3"

[[poc.requests.matchers]]
expect = true
part = "status"
status = [200]
type = "status"
