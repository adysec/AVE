[basic]
description = "Google Chrome 21.0.1180.89 之前版本的行断行（line-breaking）功能中存在越界读取漏洞。远程攻击者可通过向用户发送特制的 HTML 文档，诱使用户在受影响浏览器中打开，触发越界内存读取，导致浏览器崩溃（拒绝服务）。该漏洞源于对文本换行处理时未正确校验边界，属于 CWE-119 内存缓冲区错误。攻击需用户交互（点击链接），CVSS 评分 4.3，危害等级中危。Google 已在 Chrome 21.0.1180.89 版本中修复此漏洞。"
published = "2012-08-31T19:55:00.763"
remediation = "升级 Google Chrome 至 21.0.1180.89 或更高版本。该版本已修复断行处理中的越界读取漏洞，用户可通过浏览器内置更新功能或访问 google.com/chrome 获取最新版本。如无法立即升级，可考虑使用其他浏览器作为临时替代方案。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 换行处理越界读取漏洞"
updated = "2026-06-16T23:42:14.477"

