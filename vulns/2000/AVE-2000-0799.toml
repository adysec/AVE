[basic]
description = "AnalogX Proxy 代理服务器 4.04 及更早版本存在缓冲区溢出漏洞，远程攻击者可通过向 SOCKS4 CONNECT 请求中发送超长用户名字段触发缓冲区溢出，导致代理服务进程崩溃，造成拒绝服务。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响所有使用受影响版本的 AnalogX Proxy 服务器。"
published = "2000-07-25T04:00:00Z"
remediation = "立即将 AnalogX Proxy 升级至 4.05 或更高版本。如无法升级，在防火墙规则中限制外部 IP 对代理服务器 1080 端口（SOCKS 默认端口）的访问，仅允许可信内网段连接，并监控异常长度的 SOCKS4 CONNECT 请求。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "AnalogX proxy server 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:12Z"

