[basic]
description = "WordPress 的 amtyThumb amty-thumb-recent-post（又名 wp-thumb-post）插件 8.1.3 版本中存在反射型跨站脚本漏洞。攻击者可通过向 `amtyThumbPostsAdminPg.php` 文件传递特制的 query string 参数，在未经认证的情况下将恶意 JavaScript 代码注入页面。当管理员访问包含恶意参数的 URL 时，脚本将在浏览器中执行，导致敏感信息泄露、会话劫持或页面篡改。该漏洞无需身份认证，但需要用户交互（点击链接），影响所有使用该插件的 WordPress 站点。"
published = "2017-11-29T17:29:00Z"
remediation = "立即升级 amtyThumb amty-thumb-recent-post 插件至最新版本（如已停止维护则卸载该插件）。临时缓解措施：在 Web 应用防火墙（WAF）中添加规则，对 amtyThumbPostsAdminPg.php 的 query string 参数进行输入过滤和输出编码，阻止未转义的 HTML/JavaScript 注入。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress amtyThumb amty-thumb-recent-post 插件跨站脚本漏洞"
updated = "2026-06-17T01:10:17Z"

