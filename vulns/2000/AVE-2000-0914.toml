[basic]
description = "ncurses 库存在缓冲区溢出漏洞，本地攻击者可通过设置超长的 TERM 或 TERMINFO_DIRS 等环境变量触发缓冲区溢出，从而以目标进程权限执行任意命令。该漏洞影响使用 ncurses 库的应用程序，攻击者需具有本地系统访问权限，CVSS 评分 7.2，危害等级高。"
published = "2000-12-19T05:00:00Z"
remediation = "升级 ncurses 库至 5.6 或更高版本，该版本修复了环境变量（TERM/TERMINFO_DIRS）处理中的缓冲区溢出问题。如无法立即升级，可通过限制本地用户登录、移除 setuid 二进制文件中对 ncurses 的依赖作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "GNU ncurses 库环境变量缓冲区溢出本地代码执行漏洞"
updated = "2026-07-23T18:58:25Z"

