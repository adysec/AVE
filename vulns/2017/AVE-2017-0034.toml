[basic]
description = "Apache Struts2 的 Freemarker 标签处理中存在远程代码执行漏洞（S2-053），当开发者在 Freemarker 标签中使用表达式而非字符串字面量时，攻击者可构造恶意请求触发 OGNL 表达式注入，导致远程代码执行。该漏洞影响 Struts2 2.0.0 至 2.3.33 以及 2.5 至 2.5.10.1 版本，CVSS 评分 9.8，危害等级严重。攻击者无需身份认证即可通过网络远程利用，获取服务器完全控制权。"
published = "2017-09-20T17:29:00Z"
remediation = '升级 Apache Struts 至 2.3.34（2.3.x 分支）或 2.5.12 及以上版本（2.5.x 分支），该漏洞在 Freemarker 标签中因未正确转义表达式导致 RCE。如无法立即升级，可在 Web 应用防火墙（WAF）层面添加规则拦截包含 `%{` 或 `${\` 等 OGNL 表达式特征的请求参数作为临时缓解。'
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Apache Struts2 远程命令执行漏洞"
updated = "2026-06-17T01:03:37Z"

