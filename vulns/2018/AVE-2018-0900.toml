[basic]
description = "Exim邮件服务器在SMTP监听器的base64d函数中存在缓冲区溢出漏洞，攻击者可通过精心构造的邮件触发漏洞导致远程代码执行。该漏洞影响Exim版本低于4.90.1的系统，攻击者无需身份验证即可远程利用，破坏完整性机密和可用性。漏洞源于对base64解码数据的处理不当，导致内存溢出。"
published = "2018-02-08T23:29:01Z"
remediation = "立即升级 Exim 到 4.90.1 或更高版本，通过以下命令更新：apt-get install --upgrade exim4 或 yum update exim。安装完新版本后，重新加载服务以应用补丁。如无法立即更新，可通过修改 SMTP 配置文件禁用 base64 解码功能，或在防火墙中限制对邮件服务器的访问以降低风险。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Exim Exim 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-17T02:02:17Z"

