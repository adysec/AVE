[basic]
description = "Outlook 2000/98 及 Outlook Express 5.x 的 VCard 处理程序存在缓冲区溢出漏洞。远程攻击者无需身份认证即可向目标用户发送包含恶意生日字段的特制 vCard 文件，当用户使用受影响版本打开该 vCard 时触发缓冲区溢出，导致攻击者能够在目标系统上以当前用户权限执行任意命令。该漏洞影响范围广泛，利用方式简单，CVSS 评分 7.5，危害等级高。Microsoft 已在安全公告 MS01-012 中发布补丁修复此漏洞。"
published = "2001-05-03T04:00:00.000"
remediation = "安装 Microsoft 安全公告 MS01-012 提供的官方补丁，将 Internet Explorer 升级至 5.01 SP1/SP2 或 5.5 SP1 版本以修复 VCard 处理程序中的缓冲区溢出漏洞。如无法立即打补丁，应在邮件客户端中禁用自动预览 vCard 附件功能，并教育用户不要打开来自不可信来源的 .vcf 文件附件。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Outlook 和 Outlook Express VCard 处理程序缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:45.453"

