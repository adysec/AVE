[basic]
description = "Webmin 0.91 的 edit_action.cgi 脚本存在目录遍历漏洞，远程攻击者无需身份认证即可通过在参数中插入 `..`（点点）序列来突破路径限制，访问服务器上任意文件。该漏洞可导致攻击者读取系统敏感文件（如 /etc/passwd）甚至获取服务器完全控制权限，CVSS 评分 10.0，危害等级严重。官方已发布修复版本，建议升级至 Webmin 0.92 或更高版本。"
published = "2001-12-17T05:00:00Z"
remediation = "立即升级 Webmin 至 1.0 或更高版本，该漏洞在后续版本中已修复目录遍历问题。如无法升级，可在 Webmin 配置中禁用 edit_action.cgi 脚本的执行权限，或通过 Web 服务器访问控制限制对 /cgi-bin/edit_action.cgi 路径的访问。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Webmin 0.91 目录遍历漏洞"
updated = "2026-06-16T21:55:47Z"

