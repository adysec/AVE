[basic]
description = "Linux 内核 GPIO 聚合器（gpio-aggregator）驱动存在竞争条件漏洞，其 `new_device_store` 和 `delete_device_store` 回调函数在访问模块全局资源（如 `gpio_aggregator_lock`）时未持有模块引用计数。当内核模块 gpio-aggregator 正在被加载或卸载时，若攻击者通过 sysfs 接口并发写入 `/sys/bus/platform/drivers/gpio-aggregator/new_device` 或 `delete_device`，可能触发模块卸载与设备注册之间的竞态。具体而言，若 ID 已从 `gpio_aggregator_idr` 分配但 `platform_device_register` 尚未完成，并发卸载可能导致设备无法正确注销，从而遗留悬空的 platform device 和 GPIO forwarder，引发链表破坏（list_del corruption）、内核 panic 或系统不稳定。该漏洞影响运行受影响版本 Linux 内核的系统，攻击者需要具备本地权限且在高权限模块卸载窗口期内触发竞态，可导致系统拒绝服务（DoS）。CVSS v3.1 评分为 4.7（MEDIUM）。"
published = "2025-04-01T16:15:25Z"
remediation = "建议将 Linux 内核升级至已修复该漏洞的稳定版本。对于 Ubuntu 用户，请运行 `sudo apt update && sudo apt upgrade` 更新至最新的内核补丁版本（如 USN-7511-1 涉及的版本）；Debian 用户请参考 DSA-5900-1 升级内核软件包。若无法立即升级，可通过 `modprobe -r gpio-aggregator` 卸载该模块或在内核配置中禁用 gpio-aggregator 驱动以消除风险。"
score = 4.7
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 GPIO 聚合器驱动模块卸载竞争条件漏洞"
updated = "2026-06-17T08:44:40Z"

