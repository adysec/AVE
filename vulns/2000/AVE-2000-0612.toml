[basic]
description = "Red Hat Linux 6.1 中的 tmpwatch 工具在处理目录清理时存在拒绝服务漏洞。tmpwatch 会为每个目录层级 fork 一个新的子进程，本地攻击者可在 /tmp 或 /var/tmp 目录下创建深度嵌套的目录结构，导致系统因进程数激增而耗尽资源，造成拒绝服务。该漏洞攻击条件简单，无需特殊权限即可触发，影响系统可用性。"
published = "2000-11-14T05:00:00Z"
remediation = "升级 tmpwatch 至 2.5.2 及以上版本（Red Hat 官方已修复此问题）。如无法升级，避免使用 `--fuser` 或 `-s` 选项运行 tmpwatch，并在 cron 任务中限制 tmpwatch 扫描目录深度，同时监控 /tmp 和 /var/tmp 中是否存在过深目录结构（超过 500 层）以提前发现攻击。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "Red Hat Linux Tmpwatch 本地拒绝服务漏洞"
updated = "2026-06-16T21:52:33Z"

