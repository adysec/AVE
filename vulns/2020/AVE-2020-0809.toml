[basic]
description = "标签之间。<value>vBulletin 5.5.4至5.6.2版本的widget_tabbedcontainer_tab_panel组件在处理ajax/render/widget_tabbedcontainer_tab_panel请求中的subWidgets数据时存在代码注入缺陷，未经身份认证的远程攻击者可通过构造恶意subWidgets参数向目标站点发送特制HTTP请求，从而在服务器上执行任意操作系统命令。该漏洞的产生源于CVE-2019-16759补丁修复不完整，攻击者无需登录即可利用，可导致服务器被完全控制，CVSS评分9.8，危害等级严重。"
published = "2020-08-12T14:15:13Z"
remediation = "立即升级到 vBulletin 5.6.3 或更高版本（或应用特定的补丁更新），关闭受支持的版本升级路径的匿名用户注册，此外应限制 AJAX 请求参数验证，仅接受预定义的 trusted 组件类型以阻止恶意子组件数据的提交。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "vBulletin 5.x widget_tabbedcontainer_tab_panel 远程代码执行漏洞"
updated = "2026-06-17T02:59:01Z"

