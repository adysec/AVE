[basic]
description = "Apple QuickTime 在处理特制影片文件时存在内存破坏漏洞。当解析影片文件中的图像样本变换时，程序未能正确校验精灵缩放操作的缓冲区边界，导致越界内存访问。远程攻击者可构造恶意影片文件，通过诱导用户打开触发该漏洞，成功利用可导致任意代码执行或应用程序崩溃。该漏洞影响 Mac OS X 10.6.0 至 10.6.4 版本，用户需升级至 10.6.5 以修复此问题。"
published = "2010-11-16T22:00:16Z"
remediation = "立即将 QuickTime 升级到 7.6.9 或更高版本（Mac OS X v10.5.8/Windows 系统），或升级到 Mac OS X v10.6.5 或更高版本（Mac OS X v10.6 系统）。如无法立即升级，建议不要打开来源不明的媒体文件，并在浏览器中禁用 QuickTime 插件以降低攻击面。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple QuickTime 图像样本转换越界内存破坏漏洞"
updated = "2026-06-16T23:23:32Z"

