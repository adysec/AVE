[basic]
description = "University of Washington imap server (uw-imapd) 2000.287 及更早版本，以及 2001.315 版本的 imap-2001 和 imap-2001a（启用 RFC 1730 支持时）存在远程缓冲区溢出漏洞。该漏洞源于程序在处理部分邮箱属性时，未能对 BODY 请求的输入长度进行有效验证，导致内存溢出。经身份验证的远程攻击者可通过发送特制的超长 BODY 请求，触发缓冲区溢出并执行任意代码，从而在目标服务器上获取系统级权限。"
published = "2002-06-25T04:00:00Z"
remediation = "建议立即升级 uw-imapd 至 2001.315 之后的安全版本，或迁移至 Dovecot 等现代 IMAP 服务器。若无法升级，请在配置文件中禁用对 legacy RFC 1730 协议的支持，并限制远程访问权限以缓解风险。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "University of Washington uw-imapd 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:57:19Z"

