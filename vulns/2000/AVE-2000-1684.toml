[basic]
description = "XMail POP3 服务器在 0.59 版本之前存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向 POP3 服务发送超长的 USER 命令触发栈溢出，导致任意代码执行。该漏洞 CVSS 评分 10.0，危害等级严重，可完全控制目标系统。受影响版本需升级至 XMail 0.59 或更高版本以修复此漏洞。"
published = "2000-11-14T05:00:00Z"
remediation = "立即将 XMail 升级至 0.59 或更高版本，该版本已修复 POP3 服务中 USER 命令的缓冲区溢出问题。如无法立即升级，可在防火墙上限制对 POP3 端口（默认 110/TCP）的访问，仅允许可信 IP 连接，并监控异常长度的 USER 命令流量作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "XMail POP3 服务器缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:34Z"

