[basic]
description = 'Michael Lamont Savant WebServer 2.1 存在 CGI 源代码泄露漏洞，由于服务器未正确校验 HTTP 请求格式，远程未经认证的攻击者可发送不包含 HTTP 版本号的畸形 GET 请求，绕过正常处理逻辑直接读取 CGI 脚本源代码。该漏洞影响 Savant WebServer 2.1 版本，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:P/I:N/A:N），属于信息泄露类漏洞。攻击条件简单：仅需网络访问权限，无需身份验证，构造缺少 "HTTP/1.0" 或 "HTTP/1.1" 版本标识的 GET 请求即可触发，导致服务端 CGI 程序源代码、业务逻辑及潜在敏感信息（如数据库连接串、密钥等）泄露，为后续攻击提供情报支持。'
published = "2000-06-05T04:00:00Z"
remediation = "建议升级至 Savant WebServer 3.0 或更高版本（已修复该漏洞），或迁移至 Apache/IIS 等现代 Web 服务器。若暂时无法升级，可在 Web 应用防火墙配置规则拦截缺少 HTTP 版本号的 GET 请求，同时禁用不必要的 CGI 脚本目录执行权限作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Michael Lamont Savant WebServer 2.1 CGI源代码泄露漏洞"
updated = "2026-06-16T21:51:54Z"

