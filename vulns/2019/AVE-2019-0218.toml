[basic]
description = "tags.<value>LabKey Server 19.1.0 存在 XML 外部实体注入（XXE）漏洞（CWE-611）。其 visualization-exportImage.view 与 visualization-exportPDF.view 端点在处理 SVG 文件时未对 XML 外部实体进行有效限制，攻击者可通过向该端点发送包含 XXE 载荷的恶意 SVG 文件，触发服务器解析并读取目标主机上的任意本地文件，导致敏感信息泄露。该漏洞可通过网络远程利用，攻击复杂度低，无需身份认证及用户交互，CVSS 3.1 评分 7.5，危害等级为高危。"
published = "2019-10-29T19:15:22Z"
remediation = "tags.<value>建议立即将 LabKey Server 升级至 19.1.1 或更高版本（官方已将此 XXE 修复回带到 17.2、18.2、18.3 系列版本），从源码层面禁用 XML 外部实体解析。若暂无法升级，请在反向代理或防火墙层面对 visualization-exportImage.view 与 visualization-exportPDF.view 两个端点实施访问控制，仅允许受信任用户使用图表导出功能；同时以最小权限账户运行 Tomcat/JVM 进程并限制其可读文件范围，降低攻击者读取服务器本地文件（如 /etc/passwd、配置文件）的风险。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "LabKey LabKey Server XML外部实体注入漏洞"
