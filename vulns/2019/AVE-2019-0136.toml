[basic]
description = "SECUDOS DOMOS 5.6之前的版本中，Log模块存在目录遍历漏洞（CWE-22）。未经身份认证的远程攻击者可通过构造包含路径遍历序列的特制HTTP请求，利用该漏洞读取服务器上的任意本地文件。漏洞影响SECUDOS DOMOS 5.6之前的所有版本，攻击者无需认证即可触发，利用方式简单。CVSS评分为7.5，危害等级为高危。"
published = "2019-11-02T15:15:10.803"
remediation = "立即将 SECUDOS DOMOS 升级至 5.6 版本，该版本已修复 Log 模块中的目录遍历漏洞。升级前若无法立即打补丁，可临时采取以下缓解措施：1) 在防火墙层面限制对 DOMOS Web 管理界面（默认端口 10000）的访问，仅允许受信任的管理 IP 访问；2) 禁用或卸载 Log 模块的日志下载功能（dcfct=DCMlog.download_log），阻断攻击者利用该接口读取 /etc/shadow 等敏感文件的路径；3) 对已认证用户的会话 ID 设置更短的过期时间并启用 HttpOnly、Secure 标志，降低会话劫持风险。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "SECUDOS DOMOS Log模块本地文件包含漏洞"
updated = "2026-06-17T02:25:15.507"

