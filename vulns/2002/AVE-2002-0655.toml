[basic]
description = 'Microsoft Internet Explorer 5.5 至 6.0 的浏览器历史记录功能存在脚本注入漏洞。未经身份验证的远程攻击者可通过在 URL 中注入 JavaScript 代码，当用户点击"后退"按钮访问历史记录时，恶意脚本被当作其他用户的上下文执行，从而窃取认证信息（如 Cookie）。该漏洞影响 IE 5.5 和 6.0 版本，攻击条件为攻击者诱骗用户访问包含恶意脚本的 URL 后用户点击后退按钮，CVSS 评分 5.0，危害等级中危。攻击者可利用此漏洞跨用户执行任意脚本并盗取会话凭据。'
published = "2002-12-31T05:00:00.000"
remediation = "建议立即将 Internet Explorer 升级至 6.0 Service Pack 1 或更高版本，并安装 Microsoft 2003 年 2 月安全更新 KB810847（MS03-004），该补丁修复了浏览器历史记录功能中的脚本注入漏洞。如无法立即升级，可在 Internet Explorer 的 Internet 安全区域中将 Active Scripting 禁用，或通过组策略配置禁用脚本执行作为临时缓解措施。由于 Internet Explorer 已停止支持，建议迁移至受支持的现代浏览器（如 Microsoft Edge）以彻底消除风险。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer 历史记录列表脚本注入漏洞"
updated = "2026-06-16T21:59:47.423"

