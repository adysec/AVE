[basic]
description = "Oracle Fusion Middleware 的 Oracle Business Intelligence Enterprise Edition 产品 Installation 组件中存在目录遍历漏洞（CWE-22）。getPreviewImage 函数在处理 previewFilePath 参数时未对用户输入进行充分过滤和路径校验，导致未经身份认证的远程攻击者可通过 HTTP 请求构造包含路径遍历序列（如 ../）的恶意参数，读取服务器上的任意敏感文件（如 /etc/passwd）。该漏洞影响版本 5.5.0.0.0、12.2.1.3.0 和 12.2.1.4.0，CVSS 评分 7.5，危害等级高。攻击无需任何权限和用户交互，利用复杂度低。Oracle 已在 2020 年 10 月关键补丁更新（CPU）中修复此漏洞。"
published = "2020-10-21T15:15:24Z"
remediation = "立即应用 Oracle 2020 年 10 月关键补丁更新（CPU Oct 2020），将 Oracle Business Intelligence Enterprise Edition 升级至 12.2.1.4.0 及以上版本（需安装对应 CPU 补丁）。对于 5.5.0.0.0 版本，请升级至受支持版本并应用最新 CPU。临时缓解措施：在 Web 应用防火墙或反向代理层面，拦截对 `/analytics/saw.dll?getPreviewImage` 路径中 `previewFilePath` 参数的目录遍历请求（如包含 `../` 或绝对路径），并限制对 `/analytics/` 路径的未授权访问。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Oracle Business Intelligence Enterprise Edition getPreviewImage 目录遍历漏洞"
updated = "2026-06-17T02:55:42Z"

