[basic]
description = "Recourse ManTrap 1.6 蜜罐系统在 Solaris 系统上隐藏前 4 个运行进程的特性，导致本地攻击者可通过枚举进程列表发现前 4 个进程被隐藏，从而识别出自己处于蜜罐环境中。该漏洞影响运行 Recourse ManTrap 1.6 的 Solaris 系统，攻击者需具备本地访问权限（AV:L），通过枚举进程列表观察前 4 个进程被隐藏的异常现象，即可推断当前环境为蜜罐系统，从而规避检测或调整攻击策略。CVSS 评分 2.1（AV:L/AC:L/Au:N/C:P/I:N/A:N），属于低危本地信息泄露漏洞。"
published = "2001-01-09T05:00:00Z"
remediation = "建议升级 PHP-Nuke 到 5.0 及以上版本（建议升级至最新稳定版 8.4.5 或更高版本），或升级到 PHP-Nuke 5.0 及以上版本修复 Reviews 模块的跨站脚本漏洞。若暂无法升级，可临时禁用 Reviews 模块（在 admin.php 中禁用 Reviews 模块），或在 Web 应用防火墙（WAF）配置 XSS 防护规则过滤 <script>、onerror 等恶意脚本标签，同时建议对用户输入进行 HTML 实体编码转义处理。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Recourse ManTrap 1.6 信息泄露漏洞"
updated = "2026-06-16T21:53:14Z"

