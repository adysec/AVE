[info]
author = "AVE"
description = "Compaq Web-Based Management 默认监听 2301 端口，cpqlogin.htm 页面无需认证即可访问。检测目标是否存在该页面以确认 Compaq 管理代理服务运行，该服务存在缓冲区溢出漏洞。"
id = "POC-AVE-2001-0806"
name = "Compaq Insight Manager cpqlogin.htm 缓冲区溢出远程代码执行漏洞 PoC"
severity = "critical"
tags = [
    "cve-2001-0134",
    "buffer-overflow",
    "compaq",
    "rce",
]
vuln_id = [
    "CVE-2001-0134",
    "AVE-2001-0806",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/cpqlogin.htm"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Compaq",
    "cpqlogin",
    "Login",
]
