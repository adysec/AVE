[basic]
description = "Mandrake Linux 7.0/7.1 及 RedHat Kon2 0.3.9 版本中的 Kanji on Console (KON) 包含的 fld 程序（/usr/bin/fld）存在栈缓冲区溢出漏洞。该程序在处理输入文件中的 CHARSET_REGISTRY 和 CHARSET_ENCODING 字段时未进行边界检查，本地攻击者可构造包含超长字符集注册表或编码设置的恶意输入文件，诱使 fld 程序处理时触发栈溢出，覆盖返回地址并执行任意 Shellcode，从而将权限提升至 root。该漏洞为本地提权漏洞（CVSS 7.2，AV:L/AC:L/Au:N/C:C/I:C/A:C），攻击者需具备本地账户访问权限并能执行 fld 程序，通过诱导受害者处理恶意字体文件或直接调用 fld 处理恶意输入文件即可实现提权。ExploitDB 已公开 PoC（EDB-ID: 20024），利用代码公开可用。受影响版本包括 Mandrake Linux 7.0/7.1 及 RedHat 发行版中搭载的 Kon2 0.3.9 版本，厂商已发布补丁修复。"
published = "2000-06-21T04:00:00.000"
remediation = "建议立即升级 Mandrake 至 7.2 或更高版本，或升级 RedHat Kon2 至 0.3.9 以上修复版本；若无法立即升级，可执行 `chmod u-s /usr/bin/fld` 移除 fld 程序的 setuid 权限，或卸载 kon2 软件包（`rpm -e kon2`）作为临时缓解措施，限制本地用户通过 fld 缓冲区溢出提权获取 root 权限。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "马德拉/RedHat Kon2 控制台 fld 程序缓冲区溢出漏洞"
updated = "2026-06-16T21:52:05.970"

