[basic]
description = "Zimbra Collaboration Suite (ZCS) 8.8.15 Patch 7 之前版本存在服务端请求伪造（SSRF）漏洞。当目标系统安装了 WebEx zimlet 且启用了 zimlet JSP 功能时，未经身份认证的远程攻击者可通过构造特制请求，利用该漏洞诱使服务器向任意内部或外部地址发起 HTTP 请求，从而绕过访问控制、读取敏感信息或进一步探测攻击内网服务。该漏洞影响部署了 WebEx 插件的 Zimbra 协作套件，CVSS v3.1 评分 9.8，危害等级为严重。"
published = "2020-02-18T22:15:10Z"
remediation = "立即将 Zimbra Collaboration Suite 升级至 8.8.15 Patch 7 或更高版本。升级前请先完整备份系统数据并按照官方说明执行补丁安装，安装完成后以 zimbra 用户身份执行 zmcontrol restart 重启所有服务使补丁生效。如暂无法升级，若不需要使用 WebEx zimlet，可通过 zmlocalconfig -e zimlet_webex_enabled=false 禁用该 zimlet，或在 zimlet 配置中关闭 JSP 功能以临时缓解 SSRF 风险。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Zimbra Collaboration Suite 服务器端请求伪造漏洞"
updated = "2026-06-17T03:25:27Z"

