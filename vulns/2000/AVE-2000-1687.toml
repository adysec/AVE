[basic]
description = "Microsoft Network Monitor (Netmon) 存在多个缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向受影响的 Netmon 服务发送特制的 CIFS 浏览帧（超长 Browser Name）、超长 SNMP 团体字符串，或 SMB 会话中超长的用户名/文件名，触发协议解析过程中的缓冲区溢出，从而在目标系统上以本地系统权限执行任意代码。该漏洞影响 Windows NT 4.0 及 Windows 2000 等版本，CVSS 评分 7.5，危害等级高。攻击复杂度低，无需用户交互。"
published = "2000-12-19T05:00:00.000"
remediation = "安装 Microsoft 安全公告 MS00-083 提供的补丁。Windows NT 4.0 Server 需先升级至 Service Pack 6a 后安装补丁；Windows 2000 Server/Advanced Server 可直接在 Gold 或 SP1 上安装补丁；若使用 Systems Management Server 1.2 需先安装 SP4 后再安装 SMS 补丁，SMS 2.0 可在 Gold/SP1/SP2 上直接安装。Windows NT 4.0 Terminal Server Edition 需安装 SP6 后通过安全汇总包获取补丁。未运行 SMS 的系统仅安装操作系统对应补丁即可。上述操作系统均已停止支持，建议升级到受支持的 Windows Server 版本以获得持续安全更新。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Network Monitor 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:40.397"

