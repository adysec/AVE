[basic]
description = "Boozt! Standard 0.9.8 的管理界面 index.cgi 存在缓冲区溢出漏洞。攻击者在创建新横幅广告时，通过向 name 字段提交超长字符串，可触发缓冲区溢出，导致任意代码执行。该漏洞 CVSS 评分 7.5，危害等级高，攻击复杂度低，无需身份认证即可远程利用，可完全控制受影响系统。目前官方已停止维护，建议用户升级或迁移至替代产品。"
published = "2002-03-25T05:00:00Z"
remediation = "建议立即升级至 Boozt! Standard 最新版本，或迁移至其他仍在维护的广告管理系统。由于 Boozt! 官方已停止维护该产品（厂商网站已不可访问），无法通过补丁修复此漏洞，最有效的缓解措施是替换为其他安全受支持的替代产品。如无法立即迁移，应限制对 index.cgi 管理接口的网络访问，仅允许受信任 IP 连接，并监控该接口的异常请求。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Boozt Standard 0.9.8 index.cgi 管理接口缓冲区溢出漏洞"
updated = "2026-06-16T21:56:46Z"

