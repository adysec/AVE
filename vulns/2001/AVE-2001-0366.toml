[basic]
description = "ActiveState ActivePerl 5.6.1.629 及更早版本中的 PerlIS.dll 组件存在远程缓冲区溢出漏洞。该组件在处理以 .pl 为扩展名的 HTTP 请求时，未正确校验文件名长度，攻击者可构造包含超长文件名的恶意请求触发溢出。漏洞影响在 IIS 等 Web 服务器上通过 PerlIS 运行 Perl 脚本的 ActivePerl 环境。攻击条件为网络可达且目标站点启用了 .pl 脚本映射，无需身份认证。成功利用可导致远程任意代码执行，CVSS 评分为 7.5，危害等级为高危。"
published = "2001-12-06T05:00:00Z"
remediation = '升级到 ActivePerl 5.6.1 build 630 或更高版本以修复 perlIIS.dll 缓冲区溢出漏洞。在 IIS 管理器中，确保"检查文件是否存在"(Verify that file exists)选项处于启用状态作为临时缓解措施，该选项默认启用但被攻击者利用时需将其关闭。同时限制 IIS 对 .pl 扩展名的 ISAPI 处理权限，仅允许可信目录执行 Perl 脚本。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "ActiveState ActivePerl 缓冲区溢出漏洞"
updated = "2026-06-16T21:55:00Z"

