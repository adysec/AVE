[info]
author = "AVE"
description = "检测目标 Linux 内核版本是否在受影响范围内，通过读取 /proc/version 判断内核版本"
id = "POC-AVE-2003-0036"
name = "CVE-2003-0127 PoC"
severity = "high"
tags = [
    "cve-2003-0127",
    "kernel",
    "privilege-escalation",
]
vuln_id = [
    "CVE-2003-0127",
    "AVE-2003-0036",
]

[poc]
logic = "any"

[[poc.requests]]
path = "/proc/version"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = 'Linux version \d+\.\d+\.\d+'
type = "regex"
