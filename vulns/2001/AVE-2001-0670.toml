[basic]
description = 'News Desk 1.2 版本的 newsdesk.cgi 脚本存在目录遍历漏洞，远程攻击者无需身份认证即可通过构造包含"../"路径穿越序列的请求，利用"t"参数读取服务器上的任意敏感文件（如系统配置文件、密码文件等），导致敏感信息泄露。该漏洞攻击复杂度低、成功率高，对服务器的机密性安全造成严重影响。'
published = "2001-03-26T05:00:00Z"
remediation = '标签之间。<value>由于 ibrow 厂商未针对此漏洞发布正式补丁，建议采取以下修复措施：修改 newsdesk.cgi 对 "t" 参数实施白名单过滤，仅允许字母、数字及安全字符，严格拒绝包含 ".."、"/" 等路径遍历字符的输入；在 newsdesk.cgi 的 Perl shebang 行后启用 taint 模式（添加 -T 标志），阻止外部输入被传递给 open() 及系统命令执行；将不安全的 open() 调用重写为 sysopen() 等安全函数，避免用户输入直接参与文件路径拼接。如条件允许，建议将 News Desk 迁移至其他持续维护的新闻发布系统以彻底消除风险。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "News Desk 1.2 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:53:55Z"

