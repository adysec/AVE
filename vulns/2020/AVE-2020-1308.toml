[basic]
description = "Cisco IOS XR Software 的 Cisco Discovery Protocol (CDP) 实现存在输入验证缺陷。未经身份认证的相邻攻击者可通过向受影响设备发送特制的恶意 CDP 数据包，触发栈溢出并最终以管理权限执行任意代码或导致设备重载。该漏洞影响支持 CDP 的 Cisco IOS XR 设备，CVSS 评分 8.8。由于 CDP 为二层协议，攻击者必须与目标设备处于同一广播域（二层相邻）方可利用此漏洞。"
published = "2020-02-05T18:15:10Z"
remediation = "立即升级至 Cisco IOS XR Software 安全修复版本：Release 6.6.3（非白盒平台）或 Release 6.6.12（白盒平台），以及 Release 7.0.2 或更高版本；受影响的早期版本可安装对应平台的软件维护升级（SMU），如 NCS6K 平台安装 ncs6k-5.2.5.CSCvr78185、ASR9K-PX 平台安装 asr9k-px-6.4.2.CSCvr78185 等。如无法立即升级，可在全局配置模式下执行 no cdp 命令禁用 Cisco Discovery Protocol，或在接口配置模式下执行 no cdp 关闭单个接口的 CDP 功能，以缩小攻击面，并提交更改保存配置。建议同时通过 show running-config | include cdp 命令确认 CDP 已正确禁用。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS XR 发现协议远程代码执行漏洞"
updated = "2026-06-17T03:17:23Z"

