[basic]
description = "` tags.<value>SuSE Linux 6.x 和 7.0 版本中的 in.identd ident 服务存在空指针引用漏洞。未经身份认证的远程攻击者可通过向目标主机发送超长请求触发该漏洞，导致 ident 服务进程因访问空指针而崩溃，从而造成拒绝服务。该漏洞影响所有运行受影响版本 SuSE Linux 的服务器，攻击者无需任何凭据即可在远端发起攻击，攻击复杂度低，成功后可导致服务中断。"
published = "2001-01-09T05:00:00.000"
remediation = "升级到 SuSE Linux 7.1 或更高版本，该版本已修复 in.identd 服务的 NULL 指针访问问题。如无法立即升级，可临时禁用 ident 服务（执行 `rcin.identd stop` 或从 inetd 配置中注释掉 ident 条目），并通过防火墙限制外部对 ident 端口（113）的访问，仅允许可信主机连接。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "SuSE Linux identd 拒绝服务漏洞"
updated = "2026-06-16T21:53:09.733"

