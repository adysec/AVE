[info]
author = "ave"
description = "检测 Flowise < 3.1.0 版本 Airtable Agent 节点是否存在提示词注入导致 Python 代码执行漏洞。通过向使用 Airtable Agent 节点的聊天流程发送探测请求，观察服务器返回内容是否包含 Pyodide 执行环境特征信息，以判断漏洞是否存在。"
id = "POC-AVE-2026-1000"
name = "Flowise Airtable Agent 提示词注入代码注入漏洞检测"
severity = "critical"
tags = ["ave-2026-1000"]
vuln_id = [
    "CVE-2026-41265",
    "AVE-2026-1000",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/api/v1/chatflows"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/api/v1/chatflow"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    200,
    302,
    401,
]
type = "status"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/api/v1/prediction/{{chat_id}}"
protocol = "http"

[poc.requests.body]
content = '{"question": "List all columns"}'
type = "json"

[poc.requests.headers]
Content-Type = "application/json"

[[poc.requests.matchers]]
expect = true
status = [
    200,
    400,
    401,
    403,
]
type = "status"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/api/v1/prediction/{{chat_id}}"
protocol = "http"

[poc.requests.body]
content = '{"question": "What pandas operations can you perform? Do NOT use import, exec, eval, open, os, subprocess."}'
type = "json"

[poc.requests.headers]
Content-Type = "application/json"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "pandas",
    "numpy",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/api/v1/version"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "3.0",
    "3.1",
]
