[basic]
description = "PostgreSQL 6.5.x 在使用 SQL_ASCII 编码的多字节字符支持中，处理无法转换的字符时会多消耗一个字符，导致查询中的转义字符被意外移除，进而绕过输入验证和转义机制，使应用程序暴露于 SQL 注入攻击风险中。该漏洞影响运行 SQL_ASCII 编码的 PostgreSQL 6.5.x 版本，攻击者可通过构造特制的多字节字符序列注入恶意 SQL 语句，造成数据库数据泄露、篡改或删除。攻击前提是应用使用 SQL_ASCII 编码且未妥善处理多字节字符转换，攻击者可通过构造恶意输入触发注入。"
published = "2002-08-12T04:00:00Z"
remediation = "建议立即升级 PostgreSQL 至 7.1.3 或更高版本（建议升级至当前长期支持版本如 16.x/15.x/14.x/13.x/12.x），并将数据库编码从 SQL_ASCII 迁移至 UTF-8。升级前请完整备份数据库，升级后需重建数据库并指定 UTF-8 编码（initdb -E UTF8），再恢复数据。若无法立即升级，临时缓解措施：在应用层严格使用参数化查询/预处理语句，严禁拼接 SQL 字符串；在数据库层面启用 standard_conforming_strings = on 并禁用 escape_string_warning 规避转义字符被吞噬风险；配置防火墙限制数据库端口（默认 5432）仅允许应用服务器 IP 访问。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "PostgreSQL 6.5.x SQL_ASCII编码多字节字符SQL注入漏洞"
updated = "2026-06-16T21:58:09Z"

