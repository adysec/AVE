[basic]
description = "Microsoft Internet Explorer 5.5 在 Windows 98 系统上的基于 Web 的文件夹显示功能存在安全漏洞，本地攻击者可通过修改 Folder.htt 模板文件，并利用 ShellDefView ActiveX 控件的 InvokeVerb 方法指定文件夹中首个文件的默认执行选项，从而植入并执行木马程序。该漏洞影响运行 IE 5.5 的 Windows 98 系统，CVSS 评分 4.6（本地攻击、低复杂度、无需认证、部分机密性/完整性/可用性影响），攻击者需具备本地系统访问权限才能利用。"
published = "2000-10-20T04:00:00Z"
remediation = '由于Windows 98已停止支持，建议立即升级至Windows 2000 SP4或更高版本（如Windows XP SP3），并将Internet Explorer升级至6.0 SP1或更高版本。临时缓解措施：在注册表中禁用ShellDefView ActiveX控制（HKEY_CLASSES_ROOT\CLSID\{...}\Implement Categories\{00021494-0000-0000-C000-000000000046}），或设置Folder.htt文件为只读权限防止篡改。'
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Internet Explorer 任意代码执行漏洞"
updated = "2026-06-16T21:52:29Z"

