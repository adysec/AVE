[basic]
description = "Mozilla Firefox/Thunderbird/SeaMonkey 的 WebGLBuffer::FindMaxUshortElement 函数在调用 FindMaxElementInSubArray 时使用了错误的模板参数，导致越界读取视频内存中的敏感数据。远程攻击者可通过构造特制的 WebGL.drawElements 调用触发该漏洞，从而窃取其他进程或系统在显存中残留的敏感信息。该漏洞影响 Firefox 4.x 至 11.0、Firefox ESR 10.x 至 10.0.4、Thunderbird 5.0 至 11.0、Thunderbird ESR 10.x 至 10.0.4 及 SeaMonkey 2.9 之前版本，攻击者无需身份认证即可远程利用，CVSS 评分 5.0，危害等级中危。"
published = "2012-04-25T10:10:17Z"
remediation = "升级 Firefox 至 12.0 及以上版本，Firefox ESR 升级至 10.0.4 及以上版本；升级 Thunderbird 至 12.0 及以上版本，Thunderbird ESR 升级至 10.0.4 及以上版本；SeaMonkey 升级至 2.9 及以上版本。如无法立即升级，可在浏览器中禁用 WebGL 功能（设置 about:config 中 webgl.disabled 为 true）作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey WebGL 视频内存信息泄露漏洞"
updated = "2026-06-16T23:37:22Z"

