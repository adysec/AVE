[basic]
description = "CUPS（通用Unix打印系统）1.1.14之前版本中的ippRead函数存在缓冲区溢出漏洞，远程攻击者可通过向目标系统发送特制的IPP（互联网打印协议）请求，其中包含超长的属性名称或语言值参数，触发缓冲区溢出，导致服务进程崩溃或执行任意代码。该漏洞影响Linux/Unix系统上运行的CUPS打印服务，攻击无需身份认证，危害严重。"
published = "2002-03-08T05:00:00Z"
remediation = "立即升级 CUPS 至 1.1.14 或更高版本，该版本修复了 ippRead 函数中长属性名或语言值导致的缓冲区溢出问题。如无法升级，可在 CUPS 配置文件 /etc/cups/cupsd.conf 中限制可访问 IP 范围，并禁用不必要的网络打印服务以降低攻击面。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "CUPS ippRead 函数缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:56:41Z"

