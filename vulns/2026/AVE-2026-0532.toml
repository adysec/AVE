[basic]
description = "SINEC NMS（所有 V4.0 SP3 以下版本）在处理密码重置请求时未正确验证用户授权，存在权限绕过漏洞（CWE-639）。已认证的远程攻击者可通过构造特制的密码重置请求绕过授权检查，从而重置任意用户账户的密码，获取高权限访问。该漏洞影响西门子工业网络管理系统，CVSS 评分 8.7，危害等级高。厂商建议升级至 V4.0 SP3 或更高版本以修复此漏洞。"
published = "2026-04-14T09:16:35Z"
remediation = "立即升级 SINEC NMS 至 V4.0 SP3 或更高版本。如无法立即升级，在防火墙层面限制对 SINEC NMS 管理端口的访问，仅允许受信任的管理员 IP 地址连接，并启用多因素认证（MFA）作为临时缓解措施。"
score = 8.7
severity = "HIGH"
sources = ["zdi"]
title = "Siemens SINEC NMS 权限绕过漏洞"
updated = "2026-06-17T10:25:01Z"

