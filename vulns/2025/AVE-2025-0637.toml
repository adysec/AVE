[basic]
description = "Windows 基于标准的存储管理服务（Standards-Based Storage Management Service）存在不受控制的资源消耗漏洞（CWE-400）。未经身份认证的远程攻击者无需用户交互即可通过网络向目标服务发送特制请求，触发服务端资源耗尽，导致系统拒绝服务。该漏洞影响多个 Windows 版本，CVSS 评分 7.5，危害等级高。Microsoft 已在 2025 年 4 月安全更新中修复此漏洞。"
published = "2025-04-08T18:15:44Z"
remediation = "建议立即安装 Microsoft 2025 年 4 月安全更新，各版本对应修复版本号：Windows Server 2012 R2 升级至 6.3.9600.22523 及以上，Windows Server 2016 升级至 10.0.14393.7969 及以上，Windows Server 2019 升级至 10.0.17763.7136 及以上，Windows Server 2022 升级至 10.0.20348.3453 及以上，Windows Server 2025 升级至 10.0.26100.3775 及以上。可通过 Windows Update 自动更新或访问 Microsoft Update Catalog 手动下载。如无法立即打补丁，可在防火墙层面限制对 Windows Standards-Based Storage Management Service（端口 47000/TCP）的未授权网络访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Standards-Based Storage Management Service 拒绝服务漏洞"
updated = "2026-06-17T08:42:42Z"

