[basic]
description = "libcurl 在进行多线程 LDAPS（基于 TLS 的 LDAP）传输时存在 TLS 选项作用域错误漏洞。由于 libcurl 内部对 TLS 选项的处理缺乏线程隔离机制，在一个线程中修改 TLS 配置（如禁用证书验证）会意外地全局生效，从而影响其他线程中并发的 TLS 连接。攻击者可通过诱导用户访问恶意服务器或在多线程场景下利用此漏洞，使特定传输的证书验证被禁用，进而实现中间人攻击，窃取证书验证本应阻止的敏感信息。该漏洞影响使用了 libcurl 并开启多线程 LDAPS 功能的应用程序，CVSS 评分 6.3，危害等级中等。"
published = "2026-01-08T10:15:45Z"
remediation = "建议将 curl/libcurl 升级至 8.18.0 及以上版本，该版本已通过 commit 39d1976b7f709a516e324333 修复此问题，将 ldap_set_option 调用从全局方式（NULL 句柄）改为绑定到具体连接实例，避免多线程 TLS 选项相互污染。无法升级时，可用 OpenLDAP 后端重新编译 libcurl（configure 时使用 --enable-ldap --with-ldap-lib=/path/to/libldap），或尽量避免在多线程场景下使用 LDAPS 协议。基于 WinLDAP 或 OpenLDAP 编译的 curl 不受影响。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "curl libcurl 多线程 LDAPS TLS 证书验证绕过漏洞"
updated = "2026-06-17T08:35:10Z"

