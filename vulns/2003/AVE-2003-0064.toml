[basic]
description = "xinetd 2.1.x 至 2.3.10 版本存在内存泄漏漏洞，远程攻击者可通过大量发送被拒绝的连接请求，导致 xinetd 服务消耗大量系统内存，最终引发拒绝服务。该漏洞源于 xinetd 在处理被拒绝连接时未能正确释放已分配的内存资源，攻击者无需身份认证即可利用，CVSS 评分 5.0，危害等级中危。建议升级至 xinetd 2.3.11 及以上版本修复此漏洞。"
published = "2003-05-05T04:00:00Z"
remediation = "升级 xinetd 至 2.3.11 或更高版本。Red Hat 用户安装 RHSA-2003:078 提供的更新包；Debian 用户应用 DSA-299 安全更新。如无法立即升级，可在 xinetd 配置中限制每个服务的最大连接实例数（如 `instances = 10`）并启用 `per_source` 参数限制单 IP 并发连接数，以降低内存泄漏风险。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Xinetd 拒绝连接内存泄漏拒绝服务漏洞"
updated = "2026-06-16T22:01:45Z"

