[basic]
description = "Snort 1.6 在直接 ASCII 数据包日志模式或使用直接解码 ASCII 数据包日志的 IDS 模式下存在拒绝服务漏洞。远程攻击者可通过发送 Snort 无法识别的非 IP 协议数据包（如 nmap 协议扫描产生的流量）触发该漏洞，导致 Snort 进程崩溃，造成拒绝服务。该漏洞影响 Snort 1.6 版本，攻击者无需认证即可远程利用，危害等级中危。"
published = "2000-12-31T05:00:00Z"
remediation = "升级 Snort 至 1.6.1 或更高版本，该版本已修复对非 IP 协议报文处理不当导致的崩溃问题。如无法立即升级，临时缓解措施为：将 Snort 配置从 straight ASCII packet logging 模式切换为 binary（tcpdump）日志模式，或在 IDS 模式下禁用 straight decoded ASCII packet logging 选项，避免直接解码记录未知协议报文。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Snort 1.6 ASCII数据包日志模式拒绝服务漏洞"
updated = "2026-06-16T21:53:25Z"

