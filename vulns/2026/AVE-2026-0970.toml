[basic]
description = "OliveTin 是一个通过 Web 界面安全访问预定义 shell 命令的开源工具。其同步执行接口 StartActionAndWait 和 StartActionByGetAndWait 在返回执行结果的完整 LogEntry 输出时，未校验用户的 logs 权限。OliveTin 的 ACL 模型将 exec（执行）与 logs（日志查看）权限分离，允许管理员配置用户可执行操作但禁止查看输出。然而上述两个端点直接返回包含命令输出的 LogEntry 对象，导致仅拥有 exec 权限而 logs 权限被设为 false 的用户仍可读取操作输出，造成权限绕过。攻击者可通过发送特制的 API 请求利用此漏洞获取本应受限的敏感信息。该漏洞影响 3000.17.0 之前的所有版本，已在 3000.17.0 版本中修复。"
published = "2026-07-29T21:17:48.253"
remediation = "立即升级 OliveTin 至 3000.17.0 或更高版本（https://github.com/OliveTin/OliveTin/releases/tag/3000.17.0），该版本在 StartActionAndWait 和 StartActionByGetAndWait 端点中强制实施了 logs 权限检查。如无法立即升级，可临时移除低权限用户的 exec 权限，或通过反向代理规则拦截对 /api/StartActionAndWait 和 /api/StartActionByGetAndWait 的访问作为缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "OliveTin OliveTin 同步执行接口日志权限绕过漏洞"
updated = "2026-07-30T19:21:23.297"

