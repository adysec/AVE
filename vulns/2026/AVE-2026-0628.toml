[basic]
description = "Langroid Neo4jChatAgent 存在 Cypher 注入漏洞（CVE-2026-55615），该组件将 LLM 生成的 Cypher 查询语句直接传递给 Neo4j 驱动执行，未进行任何输入验证、语句类型白名单或退出机制检查。攻击者可通过直接提示注入或通过 RAG 检索的间接内容影响 LLM 生成的查询文本，从而控制执行的 Cypher 语句。在最低权限配置下，攻击者可实现未授权读取或删除所有图数据，以及利用 LOAD CSV 远程获取功能进行 SSRF 攻击；当服务器启用 APOC 或 dbms.security 存储过程时，攻击者可进一步实现操作系统命令执行和文件系统访问，达到远程代码执行的危害等级。该漏洞与已在 0.63.0 版本修复的 SQLChatAgent 提示注入漏洞（CVE-2026-25879）属于同一缺陷类型，但修复未覆盖 neo4j 模块。厂商已在 0.65.5 版本中修复此漏洞。"
published = "2026-07-10T00:16:33Z"
remediation = "立即将 langroid 升级至 0.65.5 或以上版本，该版本为 Neo4jChatAgent 添加了 allow_dangerous_operations 配置开关（默认关闭），并对 Cypher 查询执行语句类型白名单和危险操作拦截。同时将 Neo4j 数据库角色权限收窄为最小权限，禁用 APOC 和 dbms.security 存储过程。"
score = 9.2
severity = "CRITICAL"
sources = ["ghsa"]
title = "Langroid Neo4jChatAgent Cypher 注入漏洞"
updated = "2026-07-10T15:49:19Z"

