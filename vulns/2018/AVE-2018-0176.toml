[basic]
description = "Oracle E-Business Suite 的 Application Management Pack 组件中的 lcmServiceController.jsp 存在服务端请求伪造（SSRF）漏洞。未经身份认证的远程攻击者可通过 HTTP 协议向目标系统发送特制请求，利用该漏洞伪造服务端发起内部请求，从而未授权读取 Application Management Pack 中的敏感数据。该漏洞影响 Oracle E-Business Suite 12.1.3、12.2.3、12.2.4、12.2.5、12.2.6 及 12.2.7 版本，CVSS 评分 5.3，危害等级中危。Oracle 已在 2018 年 10 月关键补丁更新中修复此漏洞。"
published = "2018-10-17T01:31:19.197"
remediation = "立即应用 Oracle 2018 年 10 月关键补丁更新（CPU Oct 2018）中针对 Application Management Pack for Oracle E-Business Suite 的安全补丁。登录 My Oracle Support，参考文档 Note 2445688.1 获取对应版本的 E-Business Suite 补丁编号并安装。对于 12.1.3 版本，升级至包含该修复的累积补丁；对于 12.2.3~12.2.7 版本，应用对应 R12.2 系列的 CPU 补丁。如无法立即打补丁，可在网络层面限制对 /lcmServiceController.jsp 的未授权访问，仅允许受信任 IP 访问 EBS 管理页面作为临时缓解措施。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "Oracle E-Business Suite Application Management Pack SSRF漏洞"
updated = "2026-06-17T01:57:08.767"

