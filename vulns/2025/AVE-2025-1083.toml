[basic]
description = "Linux 内核 DRM（直接渲染管理器）调度器（drm/sched）模块中存在 fence 对象参考计数泄漏漏洞。当实体（entity）被终止清理时，若向 last_scheduled 围栏（fence）添加清理回调函数失败，系统未能正确递减前一个 fence 的引用计数，导致该 fence 对象的参考计数持续增长并泄漏内存。该漏洞影响使用 DRM 调度器的 Linux 内核系统，具有本地攻击向量、低攻击复杂度和低权限要求。具备本地低权限的攻击者可通过反复触发实体终止操作并诱使清理回调失败，持续泄漏内核内存资源，最终导致系统可用性下降或内核崩溃。该漏洞不涉及数据保密性或完整性破坏，但会对系统可用性造成严重影响。"
published = "2025-04-03T08:15:14Z"
remediation = "升级 Linux 内核至包含修复 commit a952f1ab696873be124e31ce5ef964d36bce817f 的稳定版本，例如 Ubuntu 22.04 LTS 升级到 6.8.0-84.84 或更高版本，Ubuntu 24.04 LTS 升级到 6.8.0-1039.41 或 6.11.0-1015.16 及更高版本，Ubuntu 24.10 升级到 6.11.0-28.28 或更高版本。如无法立即升级，可通过限制本地用户权限、禁用 DRM 调度器相关功能模块作为临时缓解措施，并尽快安排内核更新。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 DRM/Sched 调度器拒绝服务漏洞"
updated = "2026-06-17T08:44:47Z"

