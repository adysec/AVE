[basic]
description = "Pulse Connect Secure 9.1R11.4 及之前版本存在缓冲区溢出漏洞。该漏洞源于程序在处理会议房间（meeting room）相关功能时未对输入数据进行充分的大小校验，攻击者可通过发送特制的恶意会议房间数据触发缓冲区溢出。成功利用该漏洞需要攻击者首先通过身份认证，且无需用户交互即可在目标系统上以 root 权限执行任意代码，最终完全控制设备。该漏洞影响使用受影响版本 Pulse Connect Secure 的远程访问设备，CVSS 评分为 8.8，危害等级为高。"
published = "2021-05-27T12:15:07Z"
remediation = "立即将 Pulse Connect Secure 升级到 9.1R11.4 或更高版本以修复该缓冲区溢出漏洞。升级前务必备份当前系统配置，升级后验证会议协作功能正常运行并确认版本号已更新。如无法立即升级，可在边界防火墙上限制对会议协作模块的访问作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Pulse Secure Pulse Connect Secure 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-17T03:37:58Z"

