[basic]
description = "Microsoft Digest 身份验证组件存在堆缓冲区溢出漏洞（CWE-122），经过身份认证的低权限攻击者可通过向目标系统发送特制的 HTTP 请求触发该漏洞，导致远程代码执行。该漏洞影响多个 Windows 版本，CVSS 评分 8.8，危害等级高。攻击者利用此漏洞可在目标系统上以 SYSTEM 权限执行任意代码，从而完全控制系统。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞，用户需安装更新 KB5051974 或 KB5051987。"
published = "2025-02-11T18:15:35Z"
remediation = '立即安装 Microsoft 2025 年 2 月安全更新 KB5051987（Windows 10/11 及 Windows Server 对应版本），或通过 Windows Update 自动获取更新。Windows Server 用户可安装热补丁 KB5052105。如无法立即打补丁，可在域控和客户端上禁用 Digest 身份验证（通过组策略关闭 "Digest authentication" 或注册表 HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\SecurityProviders\Digest 中 DisableDigestAuth 设为 1）作为临时缓解措施。'
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Digest 身份验证远程代码执行漏洞"
updated = "2026-06-17T08:43:12Z"

