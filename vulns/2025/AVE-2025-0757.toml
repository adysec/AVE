[basic]
description = "Windows OLE（对象链接与嵌入）组件存在内存释放后使用（Use-After-Free）漏洞，攻击者可通过向受害者发送特制的电子邮件或诱导其打开包含恶意 OLE 对象的文档来触发该漏洞，无需用户交互即可实现远程代码执行。该漏洞影响多个 Windows 版本，CVSS 评分 9.8，危害等级严重。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞，建议用户立即安装更新补丁 5050061。"
published = "2025-01-14T18:15:52Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 (KB5050061)，该补丁修复了 Windows OLE 远程代码执行漏洞 (CVE-2025-21298)。可通过 Windows Update 自动更新或从 Microsoft 更新目录网站手动下载安装。如无法立即打补丁，建议在网络层面限制 OLE 协议通信作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["msrc"]
title = "Microsoft Windows OLE 远程代码执行漏洞"
updated = "2026-06-17T08:43:01Z"

