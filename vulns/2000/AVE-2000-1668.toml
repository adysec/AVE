[basic]
description = "Sun Java Web Server 管理模块存在远程命令执行漏洞，未经身份认证的远程攻击者可通过向管理模块上传恶意 Java 代码，然后通过请求以 /servlet/ 开头的 URL 调用 com.sun.server.http.pagecompile.jsp92.JspServlet 来执行任意系统命令。该漏洞 CVSS 评分 10.0，危害等级严重，攻击者无需认证即可远程利用，可完全控制目标服务器。"
published = "2000-11-14T05:00:00Z"
remediation = "立即安装 Sun 安全公告 #197 提供的补丁，升级 Sun Java Web Server 至修复版本。如无法升级，在管理模块中禁用 /servlet/ 路径的 JspServlet 编译功能，或通过防火墙限制管理端口的访问来源 IP，仅允许受信任的管理员 IP 连接管理接口。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Sun Java Web Server 远程代码执行漏洞"
updated = "2026-06-16T21:52:31Z"

