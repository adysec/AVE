[basic]
description = 'Microsoft Windows Media Player 7 及更早版本存在缓冲区溢出漏洞。未经身份认证的远程攻击者可构造包含超长版本标签（version tag）或横幅标签（banner tag）的特制 .ASX 媒体播放列表文件，诱导用户使用 Windows Media Player 打开该文件，当程序解析标签内容时因边界检查不足触发缓冲区溢出，进而执行任意命令。该漏洞是 MS00-090 公告中 ".ASX Buffer Overrun" 漏洞的一个变体，影响 Windows Media Player 7 及更早版本，攻击者无需认证即可通过网络远程发起攻击，CVSS 评分 7.5，危害等级高。'
published = "2001-06-27T04:00:00Z"
remediation = '安装 Microsoft 安全公告 MS01-029 发布的补丁：Windows Media Player 6.4 用户应下载并安装 KB Q47366 补丁，Windows Media Player 7 用户应升级到 Windows Media Player 7.1（mp71.exe）。如无法立即升级，可在 Internet Explorer 的"安全"选项卡中将"Internet 区域"的安全级别设为"高"，或禁用"允许网站运行脚本"，以阻止恶意 ASX 文件自动调用 Windows Media Player 执行代码。同时建议在"工具 → 选项 → 播放机"中取消勾选"允许 Internet 站点唯一标识播放机"，并在日常使用中避免以管理员身份运行播放器，降低漏洞利用权限。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Windows Media Player 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:56Z"

