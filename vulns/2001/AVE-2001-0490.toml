[basic]
description = "Aktivate 1.03 版本的 catgy.cgi 脚本存在跨站脚本（XSS）漏洞。该脚本在处理 desc 参数时未对用户输入进行充分过滤和输出编码，导致远程攻击者可通过构造包含恶意 JavaScript 代码的 desc 参数向页面中注入任意脚本。当其他用户访问包含恶意脚本的页面时，注入的代码将在受害者浏览器中执行，可导致会话劫持、敏感信息窃取或网页内容篡改等危害。该漏洞影响所有部署了 Aktivate 1.03 的 Web 服务器，攻击者无需身份认证即可通过网络远程发起攻击。"
published = "2001-12-18T05:00:00Z"
remediation = """升级到 Aktivate 1.05 或更高版本，该版本在漏洞公开披露后已发布，应修复了 catgy.cgi 中 desc 参数的跨站脚本漏洞。如暂无法升级，可对 catgy.cgi 脚本中 desc 参数输入进行 HTML 实体编码过滤（将 <、>、"、' 等特殊字符转义为 HTML 实体），或通过 Apache 的 mod_security 等 Web 应用防火墙规则拦截包含 script 标签的 desc 参数请求作为临时缓解措施。条件允许时建议迁移至仍在维护的现代电商系统。"""
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Aktivate Shopping Cart catgy.cgi 跨站脚本漏洞"
updated = "2026-06-16T21:55:49Z"

