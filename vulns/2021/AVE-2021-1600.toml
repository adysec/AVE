[basic]
description = "macOS System Preferences 组件中存在逻辑缺陷，该缺陷导致下载代码缺少完整性检查，恶意应用程序可借此绕过 Gatekeeper 安全机制。Gatekeeper 是 macOS 默认的安全功能，负责验证应用程序的代码签名和公证状态，但该漏洞使其逻辑状态管理出现异常，攻击者可通过特制的恶意应用在未经 Gatekeeper 检查的情况下直接执行。该漏洞影响 macOS Big Sur 11.3 之前版本以及 macOS Catalina Security Update 2021-002 之前版本，攻击需用户交互且仅限本地触发，CVSS v3.1 评分为 5.5（MEDIUM）。Apple 确认该漏洞可能已被积极利用，CISA 于 2021 年 11 月将其列入已知被利用漏洞目录。用户应升级至 macOS Big Sur 11.3 或安装 Catalina Security Update 2021-002 以修复此问题。"
published = "2021-09-08T15:15:13Z"
remediation = '立即将 macOS 升级至 Big Sur 11.3 或更高版本；Catalina 用户请安装 Security Update 2021-002。由于该漏洞可被用于绕过 Gatekeeper 完整性检查且已有在野利用记录，CISA 要求联邦机构于 2021-11-17 前完成修补。如需临时缓解，可将系统偏好设置中"安全性与隐私"的"允许以下来源的应用程序"设为仅限"App Store"，阻止未签名应用运行，并避免从非可信来源下载打开未知软件。'
score = 5.5
severity = "MEDIUM"
sources = ["kev"]
title = "Apple macOS Gatekeeper 代码完整性检查绕过漏洞"
updated = "2026-06-17T03:50:38Z"

