[basic]
description = "OpenBB 论坛 1.0.0 版本（含 Beta1/RC1/RC2）的 codeparse.php 存在跨站脚本漏洞，远程攻击者可通过在 IMG 标签中嵌入 JavaScript 代码，诱导受害者浏览器执行恶意脚本并窃取 Cookie。该漏洞无需身份认证、攻击复杂度低（CVSS 7.5 HIGH），攻击者仅需诱导用户访问包含恶意 IMG 标签的帖子即可触发，影响 OpenBB 1.0.x 系列版本，可导致会话劫持、账号劫持等后果。OpenBB 官方已在后续版本修复该漏洞，建议用户升级至最新版本。"
published = "2002-06-25T04:00:00Z"
remediation = "建议升级 OpenBB 到 1.0.1 或更高版本（官方已在 1.0.1 修复此 XSS 漏洞），或升级到最新稳定版。若无法立即升级，可编辑 codeparse.php 文件，在处理 IMG 标签前添加 HTML 实体编码过滤（如使用 htmlspecialchars() 对用户输入进行转义），或在 Web 应用防火墙（WAF）配置规则拦截包含 javascript: 伪协议的 IMG 标签请求，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "OpenBB codeparse.php 跨站脚本攻击"
updated = "2026-06-16T21:57:13Z"

