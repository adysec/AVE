[info]
author = "ave"
description = "验证Linux内核net/mlx5驱动HWS匹配器断开流程中的使用后释放漏洞。通过本地创建并删除大量mlx5 steering规则触发匹配器断开，利用固件错误导致匹配器被重复释放，最终引发内核崩溃或权限提升。需要CAP_NET_ADMIN权限。"
id = "POC-AVE-2025-0964"
name = "CVE-2025-21751 PoC"
severity = "high"
tags = ["ave-2025-0964"]
vuln_id = [
    "CVE-2025-21751",
    "AVE-2025-0964",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/proc/self/status"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Name:"]
