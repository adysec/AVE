[basic]
description = "Lotus Notes Client R5 中 Java 虚拟机（JVM）的扩展控制列表（ECL）功能存在信息泄露漏洞。远程攻击者可通过恶意网站利用 getSystemResource 方法执行时间的可观测差异，探测客户端本地文件系统中特定文件是否存在。该漏洞利用条件简单，无需认证即可远程触发，影响 Lotus Notes Client R5 系列版本，可能导致敏感文件路径信息泄露，为后续攻击提供情报支撑。"
published = "2001-01-09T05:00:00.000"
remediation = '升级至 HCL Notes 最新版本（14.x 或 12.x），启用严格 ECL 策略，将未签名 Java 小程序权限设为"不允许"。临时缓解措施：在浏览器中禁用 Java 插件，通过防火墙阻止不可信站点的 Java 内容加载。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Lotus Notes Client R5 Java虚拟机文件存在性检测信息泄露漏洞"
updated = "2026-06-16T21:53:11.013"

