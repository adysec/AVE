[basic]
description = "Adobe Flash Player 存在未指定的内存破坏漏洞，远程攻击者可通过诱使用户访问特制的网页或打开恶意文件触发该漏洞，导致任意代码执行或拒绝服务。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上的 Flash Player 9.0.289 之前版本及 10.1.102.64 之前版本，CVSS 评分 9.3，危害严重。攻击无需身份认证，但需要用户交互（如点击链接或打开文件）。Adobe 已发布安全更新修复此漏洞。"
published = "2010-11-07T22:00:02Z"
remediation = "立即将 Adobe Flash Player 升级至 9.0.289.0（9.x 系列）或 10.1.102.64（10.x 系列），Android 版升级至 10.1.95.1。Linux 用户可通过 Red Hat RHSA-2010-0829/0834/0867 安装更新包，macOS 用户安装 Apple 安全更新 2010-006。如无法升级，可在浏览器中禁用 Flash Player 插件或启用 click-to-play 机制作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:23:15Z"

