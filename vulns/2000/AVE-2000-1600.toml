[basic]
description = 'RapidStream 2.1 Beta VPN 设备中的 sshd 服务存在硬编码后门账户漏洞。该设备内置了一个名为 "rsadmin" 的预置管理员账户，且其密码被设置为空字符串。远程攻击者无需任何身份认证，即可通过 SSH 协议直接使用该硬编码账户登录目标设备，从而获取设备的完全控制权限，执行任意系统命令。该漏洞影响 RapidStream 2.1 Beta 版本，CVSS 评分 10.0，危害等级严重。厂商至今未发布官方补丁，建议用户立即停止使用受影响版本或通过防火墙限制 SSH 访问。'
published = "2000-10-20T04:00:00.000"
remediation = "立即禁用或删除 Rapidstream VPN 设备上的硬编码 rsadmin 账户：通过设备管理界面或 SSH 登录后执行 `passwd -l rsadmin` 锁定账户，或从 `/etc/passwd` 中删除该账户条目。如设备固件支持升级，联系厂商获取最新固件版本更新。在网络层面，在防火墙上限制对 SSH 端口（TCP 22）的访问来源 IP，仅允许管理网段连接，并启用 SSH 公钥认证替代密码认证。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Rapidstream Rapidstream 2.1 Beta VPN 硬编码后门远程代码执行漏洞"
updated = "2026-06-16T21:52:28.447"

