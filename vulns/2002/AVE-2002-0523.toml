[basic]
description = "HP JetDirect 打印机存在 SNMP JetAdmin 设备密码泄露漏洞，远程攻击者无需身份认证即可通过向目标设备发送特制的 SNMP 请求，访问 OID 变量 .iso.3.6.1.4.1.11.2.3.9.4.2.1.3.9.1.1.0，从而获取 Web 和 Telnet 服务的管理员密码。该漏洞影响多款 HP JetDirect 打印机型号，攻击者获取密码后可完全控制设备，CVSS 评分 7.5，危害等级高。目前已有公开的 ExploitDB 利用代码。"
published = "2002-10-04T04:00:00Z"
remediation = "立即将 HP JetDirect 打印机固件升级到 X.22.09 或更高版本，该版本已修复 SNMP 变量泄露管理密码的问题。如无法立即升级，可在网络边界防火墙或交换机 ACL 中限制对打印机 UDP 161/162 端口的 SNMP 访问，仅允许受信任的管理主机连接，并禁用打印机上不必要的 Web 和 Telnet 管理服务。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "HP JetDirect 打印机 SNMP JetAdmin 设备密码泄漏漏洞"
updated = "2026-06-16T21:58:37Z"

