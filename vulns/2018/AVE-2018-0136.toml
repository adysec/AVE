[basic]
description = "Microstrategy Web 7 版本中存在目录遍历漏洞，位于 /WebMstr7/servlet/mstrWeb 的 subpage 参数中。经过身份认证的远程攻击者可通过在路径名中使用 /..（斜杠点点）序列绕过 SecurityManager 安全限制，访问父目录中的文件，导致敏感信息泄露。该漏洞影响已废弃的 Microstrategy Web 7 产品，CVSS 评分 4.3，危害等级中危。"
published = "2018-11-01T17:29:00Z"
remediation = '该产品已停止维护，官方不再提供安全补丁。建议立即升级到 MicroStrategy 当前受支持的版本（如 MicroStrategy 2021 及以上），新版本已修复路径遍历问题。如无法升级，可在 Web 服务器或 WAF 层对 `/WebMstr7/servlet/mstrWeb` 路径的 `subpage` 参数实施输入过滤，拒绝包含 `../` 或 `..\` 的请求，并限制该路径仅允许授权管理员 IP 访问作为临时缓解措施。'
score = 4.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "Microstrategy Web 7 目录遍历漏洞"
updated = "2026-06-17T01:47:52Z"

