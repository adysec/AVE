[basic]
description = "Apple多款产品内核存在内存破坏漏洞，攻击者可通过发送特制数据包或利用内核内存处理缺陷，触发内存越界访问从而实现内核代码执行。该漏洞影响iOS 12之前版本、macOS Mojave 10.14之前版本、tvOS 12之前版本及watchOS 5之前版本。攻击者需本地访问目标设备并诱导用户交互方可触发利用，CVSS评分为7.8，属于高危漏洞，可能导致攻击者获取内核级权限并完全控制受影响设备。"
published = "2019-04-03T18:29:09Z"
remediation = "建议立即升级至 Apple 2018 年 9 月发布的修复版本：iOS 12 或更高版本、macOS Mojave 10.14 或更高版本、tvOS 12 或更高版本、watchOS 5 或更高版本。iPhone/iPad 请通过「设置」>「通用」>「软件更新」在线升级；Mac 请通过 App Store 或「系统偏好设置」>「软件更新」安装 macOS Mojave 10.14；Apple TV 请通过「设置」>「系统」>「软件更新」升级；Apple Watch 请通过 iPhone 的 Watch 应用完成升级。如暂时无法升级，应在系统偏好设置中启用 Gatekeeper 并设置为仅允许来自 App Store 和已知开发者的应用，同时关闭不必要服务，以降低利用风险。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Apple 多款产品内核内存破坏代码执行漏洞"
updated = "2026-06-17T01:58:49Z"

