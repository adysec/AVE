[basic]
description = "Mozilla Firefox/Thunderbird/SeaMonkey 的 nsHTMLEditor::CollapseAdjacentTextNodes 函数中存在释放后使用（Use-After-Free）漏洞。远程攻击者可通过构造特制的网页内容触发已释放内存的访问，导致堆内存损坏，成功利用可在目标系统上执行任意代码或造成拒绝服务。攻击无需身份认证且复杂度低，仅需诱导用户访问恶意页面即可触发。该漏洞影响 Firefox 15.0 之前版本、Firefox ESR 10.x 10.0.7 之前版本、Thunderbird 15.0 之前版本、Thunderbird ESR 10.x 10.0.7 之前版本及 SeaMonkey 2.12 之前版本，CVSS 评分 10.0，危害等级严重。"
published = "2012-08-29T10:56:39.910"
remediation = "将 Mozilla Firefox 升级至 15.0 及以上版本，Firefox ESR 升级至 10.0.7 及以上版本；将 Thunderbird 升级至 15.0 及以上版本，Thunderbird ESR 升级至 10.0.7 及以上版本；将 SeaMonkey 升级至 2.12 及以上版本。如无法立即升级，可禁用 JavaScript 并限制用户访问不可信网页作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey nsHTMLEditor 释放后使用远程代码执行漏洞"
updated = "2026-06-16T23:40:42.803"

