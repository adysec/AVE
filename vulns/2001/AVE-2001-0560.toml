[basic]
description = "AmTote International 的 Homebet 在线投注程序存在信息泄露漏洞。由于系统在用户输入无效账号和无效 PIN 码时返回不同的错误提示信息，远程攻击者可通过暴力枚举方式，根据服务器返回的差异区分出有效账号。该漏洞允许攻击者收集有效账户信息，为后续进一步攻击（如密码爆破）创造条件，影响系统账户安全性和用户隐私。官方未提供补丁，建议通过统一错误提示信息进行缓解。"
published = "2001-12-31T05:00:00Z"
remediation = 'AmTote International 已停止维护该产品，无官方补丁。建议修改应用逻辑，对无效账号和无效 PIN 返回相同的通用错误提示（如"账号或 PIN 不正确"），避免通过错误信息差异枚举有效账号；同时在应用层增加登录失败次数限制和临时锁定机制，降低暴力破解效率。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "AmTote International Homebet 账户信息暴力破解漏洞"
updated = "2026-06-16T21:56:26Z"

