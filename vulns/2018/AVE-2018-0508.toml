[basic]
description = "DNN（DotNetNuke）9.2至9.2.2版本存在加密算法强度不足漏洞。由于对CVE-2018-15811的修复不完整，系统使用弱加密算法保护输入参数，未经身份认证的远程攻击者可利用此漏洞解密敏感参数，导致机密信息泄露。该漏洞影响所有使用受影响版本的DNN站点，攻击复杂度低，无需用户交互即可利用。"
published = "2019-07-03T17:15:10.250"
remediation = "升级到 DNN 9.3.0 或更高版本以彻底修复弱加密算法问题。同时建议在 Web 服务器层面配置 WAF 规则，拦截包含恶意 DNNPersonalization Cookie 的请求，并监控反序列化攻击行为。该漏洞已被 CISA KEV 收录，建议优先修复。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "DNN DNN平台 参数保护弱加密算法漏洞"
updated = "2026-06-17T01:47:00.017"

