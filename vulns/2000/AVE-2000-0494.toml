[basic]
description = "Savant Web Server 2.1及3.0版本存在远程缓冲区溢出漏洞。攻击者可通过向目标服务器的80端口发送包含大量HTTP头部字段的超长GET请求触发该漏洞，导致栈缓冲区溢出并覆盖关键内存区域（如返回地址和异常处理结构）。成功利用此漏洞可在目标Windows系统上以Web Server进程权限执行任意代码，或导致服务崩溃引发拒绝服务。该漏洞无需身份认证，任何能够与目标服务器建立TCP连接的远程攻击者均可利用，攻击门槛较低。具体利用方式为发送包含约5000个额外HTTP头部字段的GET请求，超出服务器缓冲区的处理边界，造成内存越界写入，进而劫持程序执行流程实现代码执行。"
published = "2000-07-08T04:00:00.000"
remediation = "该漏洞存在于早已停止维护的 Savant WebServer 2.1/3.0 中，官方不再提供补丁。应立即将 Savant WebServer 从生产环境迁移至 Apache、Nginx 或 IIS 等仍在维护的 Web 服务器。迁移前可在系统防火墙中限制对 Savant 监听端口的访问，仅允许可信来源 IP 连接，或将其部署在反向代理后方以减小暴露面。如短期无法迁移，可在 Savant 配置文件中缩短连接超时时间、限制最大请求 URI 长度，并禁用目录列表功能。迁移完成后应彻底卸载 Savant WebServer 程序。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Savant WebServer 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:52:10.233"

