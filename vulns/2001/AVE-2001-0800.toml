[basic]
description = "Trend Micro Interscan VirusWall 3.6.x 及更早版本的 Web 管理界面未对通信进行加密，管理员登录凭据通过 HTTP GET 请求以 Base64 编码形式传输。由于 Base64 仅为编码而非加密，未经身份认证的远程攻击者只要能够监听网络流量，即可通过抓包方式获取 setpasswd.cgi 或其他包含 Base64 编码用户名和密码的 HTTP GET 请求，解码后直接获得明文管理员密码，从而完全控制 VirusWall 管理界面。该漏洞影响 Interscan VirusWall 3.6.x 及之前所有版本，攻击条件为攻击者可访问并监听目标设备的网络通信，无需事先拥有任何凭据即可实施利用。"
published = "2001-03-12T05:00:00Z"
remediation = "升级 Trend Micro Interscan VirusWall 至 3.6.1 或更高版本，修复后 Web 管理界面将启用 SSL/TLS 加密传输，不再以明文 Base64 编码方式在 HTTP 中传递管理员凭证。如暂无法升级，应通过网络防火墙或 ACL 仅允许受信任的 IP 地址访问 VirusWall 的 Web 管理端口（默认 80/443），或暂时禁用远程 Web 管理界面，改用本地控制台进行管理操作。同时修改默认管理员密码，防止凭证泄露后被直接利用。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "趋势科技 Interscan VirusWall 管理界面密码明文传输漏洞"
updated = "2026-06-16T21:53:44Z"

