[basic]
description = "Microsoft Qlib 的 _mount_nfs_uri 函数存在命令注入漏洞，该函数在处理用户提供的 NFS 挂载 URI 字符串时未进行充分的输入验证，直接将未过滤的字符串传递给系统调用执行。未经身份认证的网络相邻攻击者可通过发送特制的 NFS URI 请求触发此漏洞，在目标系统上以 root 权限执行任意代码，从而完全控制受影响的 Microsoft Qlib 安装实例。"
published = ""
