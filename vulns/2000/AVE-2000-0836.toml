[basic]
description = "Real Networks RealServer 5.0/6.0/7.0 及更早版本存在内存内容泄露漏洞。攻击者无需身份验证即可通过访问 /admin/includes/ URL 远程获取 RealServer 的内存内容，可能泄露敏感信息。该漏洞由网络攻击向量、低攻击复杂性和无认证触发，造成部分机密信息泄露影响，CVSS 评分为 5.0，中等风险水平。攻击者可以通过简单的 URL 请求访问服务器的内部内存，从而可能暴露包括配置文件、用户凭据和应用程序数据在内的敏感信息。该漏洞对系统的完整性和可用性不造成直接影响，但机密性破坏可能导致进一步的安全风险。该漏洞已知影响 Windows 和 Linux 平台上的 RealServer 服务，用户应立即应用安全补丁或升级到支持版本以修复此问题。"
published = "2001-01-09T05:00:00Z"
remediation = "建议立即迁移至现代流媒体服务器（如 SRS、Nginx-RTMP、Wowza Streaming Engine 等），RealServer 5.0/6.0/7.0 早已停止维护无补丁可用。若必须继续使用旧版本，请在防火墙/反向代理层面禁止外部访问 /admin/includes/ 路径，并限制管理接口仅允许可信 IP 访问。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Real Networks RealServer 内存内容泄露漏洞"
updated = "2026-06-16T21:53:19Z"

