[basic]
description = 'Microsoft SQL Server 2000 及 Microsoft Desktop Engine (MSDE) 2000 的用户认证函数存在缓冲区溢出漏洞，远程攻击者无需身份认证即可向 TCP 1433 端口发送特制的超长请求（即 "Hello" 溢出），触发栈缓冲区溢出，导致攻击者能够以 SQL Server 进程权限执行任意代码。该漏洞影响 SQL Server 2000 全系列版本，CVSS 评分 7.5，危害等级高。Microsoft 已在安全公告 MS02-056 中发布补丁修复此漏洞，Metasploit 框架已集成公开利用模块。'
published = "2002-09-24T04:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS02-056 提供的补丁，或升级至 SQL Server 2000 Service Pack 4。如无法升级，在防火墙上封锁 TCP 端口 1433 以阻止远程攻击。对于 MSDE 2000 实例，建议禁用不必要的网络连接或升级至受支持的 SQL Server 版本。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft SQL Server 2000 用户认证远程缓冲区溢出漏洞"
updated = "2026-06-16T21:58:46.197"

