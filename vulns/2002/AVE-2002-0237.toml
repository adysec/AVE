[basic]
description = "Sawmill for Solaris 6.2.14及更早版本在创建AdminPassword文件时设置了全局可写权限，导致本地用户可通过修改该文件提升权限。该漏洞影响Sawmill for Solaris 6.2.14及更早版本，CVSS评分4.6（本地访问、低复杂度、无需认证、部分影响机密性/完整性/可用性）。攻击者需具备本地访问权限，通过修改全局可写的AdminPassword文件实现权限提升。Sawmill官方已发布更新版本修复此漏洞。"
published = "2002-05-29T04:00:00Z"
remediation = "建议升级至 Sawmill 6.2.15 或更高版本，或手动修复 AdminPassword 文件权限：执行 chmod 600 /path/to/Sawmill/AdminPassword 移除全局写权限，限制仅管理员可读写。若无法升级，请限制本地用户对 Sawmill 安装目录的写入权限作为临时缓解。建议尽快升级到最新版 Sawmill 以彻底修复该权限配置缺陷。升级包可从 Sawmill 官网下载（http://www.sawmill.net/）"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Sawmill 6.2.x 管理员密码文件不安全默认权限漏洞"
updated = "2026-06-16T21:57:06Z"

