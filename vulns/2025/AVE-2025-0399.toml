[basic]
description = "Google Chrome 的 V8 JavaScript 引擎 Maglev 编译器中存在对象内存损坏漏洞，由于编译器在处理寄存器状态时存在验证缺陷，导致攻击者可通过构造特制的 HTML 页面触发堆内存损坏。远程攻击者无需身份认证即可利用该漏洞，成功利用可导致浏览器崩溃或潜在的内存数据破坏。该漏洞影响 Google Chrome 132.0.6834.110 之前版本，CVSS 评分 8.2，危害等级高。Google 已在 132.0.6834.110 版本中修复此漏洞。"
published = "2025-01-22T20:15:30Z"
remediation = "建议立即将 Google Chrome 升级至 132.0.6834.110 或更高版本，可通过 Chrome 菜单 > 帮助 > 关于 Google Chrome 自动检查并安装更新。使用基于 Chromium 的浏览器（如 Edge、Brave）的用户应同步更新至对应修复版本。Linux 发行版用户请更新 chromium 软件包，openSUSE 用户参考 openSUSE-SU-2025:0034-1 安全公告，FreeBSD 用户将 qt6-webengine 更新至 6.8.2 或更高版本。"
score = 8.2
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 对象内存损坏漏洞"
updated = "2026-06-17T08:26:48Z"

