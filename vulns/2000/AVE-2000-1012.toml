[basic]
description = "tags.<value>FreeBSD 4.1.1 的 fingerd 服务存在任意文件读取漏洞，攻击者无需身份认证即可通过远程向 finger 服务发送特制的请求，将目标文件名作为用户参数传入，从而读取服务器上的任意文件。该漏洞影响 FreeBSD 4.1.1 及此前版本的 finger 服务，CVSS 评分为 5，属于中等危害等级。攻击条件仅为网络可达且目标开放 finger 服务（通常为 TCP 端口 79），攻击者可利用此漏洞获取系统敏感配置文件或用户信息等文件内容。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 FreeBSD 系统至 4.1.1-STABLE（修正日期 2000-10-05 之后版本）。如无法立即升级，可从 ftp://ftp.freebsd.org/pub/FreeBSD/CERT/patches/SA-00:54/fingerd.patch 获取补丁并手动修补：cd /usr/src/usr.bin/finger 执行 patch 和 make all install，再 cd /usr/src/libexec/fingerd 执行 make all install。作为临时缓解措施，在 /etc/inetd.conf 中注释掉 finger 服务行（#finger stream tcp nowait/3/10 nobody /usr/libexec/fingerd fingerd -s），并同时注释掉 IPv6 对应的 finger 行。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "freebsd 任意文件读取漏洞 漏洞"
updated = "2026-06-16T21:52:45.440"

