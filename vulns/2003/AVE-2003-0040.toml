[basic]
description = "OpenSSL 0.9.6i 及更早版本、0.9.7 和 0.9.7a 的 SSL 与 TLS 组件存在 Bleichenbacher 攻击变种漏洞（又称 Klima-Pokorny-Rosa 攻击）。远程攻击者可通过大量使用 PKCS #1 v1.5 填充的 SSL/TLS 连接，利用密文与明文之间的关联信息泄露，执行未授权的 RSA 私钥操作，从而获取敏感信息。该漏洞影响范围广泛，攻击者无需身份认证即可通过网络远程利用，CVSS 评分 7.5，危害等级高。"
published = "2003-03-24T05:00:00Z"
remediation = "立即升级 OpenSSL 至 0.9.7b 或更高版本（该版本默认启用 RSA Blinding 缓解时序侧信道攻击）。如无法升级，可在编译时移除 `OPENSSL_NO_FORCE_RSA_BLINDING` 宏定义，或调用 `RSA_blinding_on()` 手动开启 RSA 盲化。升级后须重新编译并重启所有依赖 OpenSSL 的应用（如 Apache + mod_ssl）。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "OpenSSL SSL/TLS 组件信息泄露漏洞"
updated = "2026-06-16T22:01:36Z"

