[basic]
description = "Microsoft Outlook 98/2000 及 Outlook Express 4.0x/5.0x 存在缓存绕过漏洞（Cache Bypass）。远程攻击者可构造特制的畸形 HTML 邮件，利用邮件客户端对 HTML 内容中文件缓存机制的缺陷，将恶意文件存储到缓存目录之外的位置，从而读取客户端系统上的任意文件。该漏洞无需身份认证即可远程利用，攻击复杂度低，可导致敏感信息泄露。Microsoft 已在后续安全更新中修复此漏洞。"
published = "2000-07-20T04:00:00Z"
remediation = "立即安装 Internet Explorer 5.01 Service Pack 1 或 Internet Explorer 5.5，您将获得不受影响的 Outlook Express 5.5 版本，修复了此缓存 bypass 漏洞。或者，将 Microsoft Outlook 升级到包含补丁的 Office 2000 版本。Office 2000 更新可由 Microsoft Product Support 获取。也可以直接应用微软知识库文章 Q247638 补丁。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Microsoft Outlook和Outlook Express缓存Bypass文件读取漏洞"
updated = "2026-06-16T21:52:07Z"

