[basic]
description = "RealPlayer及RealPlayer SP的Cook音频编解码器在初始化过程中存在未指定的错误缺陷，导致堆内存破坏。未经身份认证的远程攻击者可利用该漏洞，通过发送特制的媒体文件或网络传输数据触发Cook编解码器的初始化错误，从而可能实现远程代码执行。该漏洞影响RealPlayer 11.0至11.1、RealPlayer SP 1.0至1.1.5、Mac版RealPlayer 11.0至12.0.0.1444以及Linux版RealPlayer 11.0.2.1744等多个版本。CVSS评分为10.0，攻击复杂度低且无需身份认证即可触发，危害等级严重。RealNetworks后续发布了安全更新修复此问题。"
published = "2010-12-14T16:00:02Z"
remediation = "升级到 RealPlayer 12.0.1.609 或更高版本以修复 Cook codec 初始化缺陷。如无法立即升级，可禁用 RealPlayer 的 Cook 编解码器模块或在网络层面阻断来自不可信来源的媒体文件传输作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer Cook编解码器初始化内存损坏漏洞"
updated = "2026-06-16T23:15:31Z"

