[basic]
description = "ViewComponent 是 Ruby on Rails 中用于构建可复用视图组件的框架，其 4.0.0 至 4.12.0 版本存在渲染上下文残留漏洞。ViewComponent::Base 实例在多次调用 render_in 时保留了渲染作用域对象（如 helpers、controller、request、view_flow 等），当同一组件、集合或间隔组件实例在跨请求、跨用户、跨租户或跨线程场景下被复用时，后续渲染会使用前次渲染的过期上下文。攻击者可通过构造特定请求触发组件复用，导致权限感知组件向低权限用户渲染特权 UI、生成包含过期 Host 头的链接、泄露插槽/辅助方法状态，并在并发渲染场景下混入请求上下文。该漏洞 CVSS 评分 6.8，危害等级中危，影响所有使用 ViewComponent 且存在组件实例复用模式的 Rails 应用。官方已在 4.12.0 版本中修复此问题。"
published = "2026-07-17T21:17:08Z"
remediation = "立即将 view_component gem 升级至 4.12.0 或更高版本（`bundle update view_component`）。如无法升级，避免跨请求/线程复用同一组件实例，确保每次渲染使用 `MyComponent.new` 创建新实例，不在常量、单例或缓存中存储已实例化的组件对象。"
score = 6.8
severity = "MEDIUM"
sources = ["ghsa"]
title = "ViewComponent view_component 组件实例复用导致渲染上下文污染漏洞"
updated = "2026-07-23T16:20:01Z"

