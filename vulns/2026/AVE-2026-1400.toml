[basic]
description = "Electron 是一款用于使用 JavaScript、HTML 和 CSS 编写跨平台桌面应用程序的框架。该框架在离屏渲染（offscreen rendering）模式下，GPU 进程发送给主进程的帧数据未经过完整边界验证，导致主进程在生成 paint 事件图像时可能发生越界内存读取。攻击者若已在 GPU 进程中取得代码执行权限，可构造特制帧数据触发该漏洞，造成内存敏感信息泄露或应用程序崩溃。该漏洞仅影响启用了 `webPreferences.offscreen` 离屏渲染选项的 Electron 应用程序，未使用该特性的应用程序不受影响。目前尚无应用侧的临时缓解措施，用户必须升级至已修复版本（39.8.10、40.9.0、41.2.1、42.0.0-beta.3）方可彻底消除风险。"
published = "2026-08-05T16:17:03Z"
remediation = "请将 Electron 升级至已修复版本：39.8.10、40.9.0、41.2.1 或 42.0.0-beta.3（根据当前使用的主版本号选择对应版本）。如暂时无法升级，建议在应用侧禁用 offscreen rendering 模式（移除 webPreferences.offscreen 配置项）作为临时缓解措施，同时限制 GPU 进程的权限与沙箱隔离以降低被攻陷后的横向影响。"
score = 3.9
severity = "LOW"
sources = ["ghsa"]
title = "Electron 离屏渲染越界读取内存漏洞"
updated = "2026-08-05T19:17:38Z"

