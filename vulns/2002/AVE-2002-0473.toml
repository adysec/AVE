[basic]
description = "CGIScript.net 开发的 csPassword.cgi 1.0 版本存在输入验证漏洞，远程认证用户可通过在编辑页面的标题字段中注入换行符，绕过输入限制修改服务器上的 .htaccess 文件，从而提升权限获取对敏感资源的未授权访问。攻击者只需拥有普通用户权限即可利用该漏洞，无需其他特殊条件。该漏洞影响 csPassword.cgi 1.0 版本，CVSS 评分 7.5，危害等级高，建议用户升级至最新版本或对用户输入进行严格过滤。"
published = "2002-10-04T04:00:00.000"
remediation = '立即停止使用 csPassword.cgi 1.0，该脚本已不再维护。在 csPassword.cgi 的 title 字段处理逻辑中，对用户输入进行严格过滤，移除换行符（\n 和 \r）及特殊字符，防止通过换行符注入修改 .htaccess 文件。同时将 .htaccess 文件权限设置为 644 并禁止 CGI 用户写入，在 Web 服务器配置中限制对 .htaccess 文件的直接访问。建议迁移至其他仍在维护的密码管理 CGI 脚本或使用现代 Web 应用替代。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "CGIScript.net csPassword.cgi 1.0 HTAccess 文件泄漏漏洞"
updated = "2026-06-16T21:58:23.397"

