[basic]
description = "htgrep CGI 程序存在任意文件读取漏洞，远程攻击者无需身份认证即可通过向 hdr 参数传递目标文件的完整路径名，绕过输入验证限制，读取服务器上的任意文件（如 /etc/passwd 等敏感文件），导致敏感信息泄露。该漏洞影响部署了 htgrep CGI 程序的 Web 服务器，攻击条件简单，仅需网络可达即可利用。"
published = "2000-11-14T05:00:00.000"
remediation = "移除或禁用存在漏洞的 htgrep CGI 脚本，对 hdr 参数实施严格的路径白名单过滤，限制仅能访问指定目录下的文件，或升级到已修复该漏洞的最新版本。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "htgrep CGI 任意文件读取漏洞"
updated = "2026-06-16T21:52:33.597"

