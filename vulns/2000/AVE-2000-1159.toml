[basic]
description = "Phorum 3.0.7 的 code.php3 文件存在任意文件读取漏洞，远程攻击者无需身份认证即可通过构造特制的查询字符串（query string）读取 phorum 目录下的任意文件，导致敏感信息泄露。该漏洞影响 Phorum 3.0.7 版本，攻击条件简单（无需认证、无需用户交互），危害等级中等。"
published = "2000-12-31T05:00:00Z"
remediation = "升级 Phorum 至 3.0.8 或更高版本，该版本已修复 code.php3 中查询字符串未经验证即用于文件读取的问题。如无法升级，在 code.php3 入口处添加输入校验，仅允许白名单内的合法文件名参数，拒绝包含 ../ 等路径遍历字符的请求。当前最新版本为 Phorum 10.0，建议直接升级至最新版以获得完整安全支持。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Phorum 3.0.7 任意文件读取漏洞"
updated = "2026-06-16T21:53:25Z"

