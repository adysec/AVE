[basic]
description = "CVE-2000-0783是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2000-10-20T04:00:00Z"
remediation = "建议升级至 WatchGuard Firebox II 修复该漏洞的固件版本（具体版本号请参考 WatchGuard 官方安全公告），或联系 WatchGuard 技术支持获取最新可用固件。如无法立即升级，可在边界防火墙或 ACL 中限制对设备 4100 端口（认证服务）的入站访问来源，仅允许可信管理网段访问，以临时缓解恶意构造 URL 导致的拒绝服务风险。若设备已超出支持生命周期，建议更换至受支持的 WatchGuard 下一代防火墙型号。"
