[basic]
description = "Windows 电话服务（Telephony Service）存在堆缓冲区溢出漏洞（CWE-122），远程攻击者可通过向目标系统发送特制请求触发该漏洞，导致远程代码执行。攻击需要用户交互（如点击恶意链接或打开特制文件），成功利用后可获取系统权限，完全控制受影响主机。该漏洞影响 Windows 10/11 多个版本及 Windows Server 2008/2012/2016/2019/2022/2025，CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:16:05Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 (KB5049984)，该更新修复了 Windows Telephony Service 中的堆溢出漏洞。通过 Windows Update 自动更新或访问 Microsoft 更新目录手动下载安装。如无法立即打补丁，可禁用 TapiSrv 服务（电话服务）作为临时缓解措施，但需评估对依赖电话 API 的应用程序的影响。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:43:18Z"

