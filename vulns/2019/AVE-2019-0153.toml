[basic]
description = "Pure-FTPd 1.0.49 版本中存在栈耗尽漏洞，攻击者可通过发送特制的 LIST 或 NLST 命令触发 listdir 函数中的栈溢出，导致服务崩溃或拒绝服务。该漏洞无需身份认证即可利用，影响运行 Pure-FTPd 1.0.49 的 FTP 服务器。"
published = "2019-12-31T15:15:11.223"
remediation = "升级 Pure-FTPd 到 1.0.50 或更高版本，该版本修复了 ls.c 中的 listdir 函数堆栈耗尽漏洞。确认系统已应用最新的安全补丁，并检查是否有更高级的版本可供升级。如需立即缓解风险，可在 pure-ftpd 配置文件中启用 `LimitConcurrentLogins 1` 并 `LimitLogEntriesPerSecond 10` 来限制资源消耗。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Pure-FTPd 资源管理错误漏洞"
updated = "2026-06-17T02:30:09.983"

