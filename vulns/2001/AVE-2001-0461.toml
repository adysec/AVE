[basic]
description = "SnapStream Personal Video Station (PVS) 1.2a 存在目录遍历漏洞，远程攻击者可通过在请求 URL 中插入 `../` 序列绕过路径限制，读取服务器上的任意文件。该漏洞源于程序未对用户输入的路径参数进行充分过滤，允许攻击者遍历目录结构访问系统敏感文件（如配置文件、密码文件等）。攻击者无需身份认证，仅需向目标服务器发送特制的 HTTP 请求即可利用，CVSS 评分 7.5，危害等级高。目前官方已停止维护该版本，建议用户升级至最新版本或部署 Web 应用防火墙进行防护。"
published = "2001-07-26T04:00:00Z"
remediation = "该漏洞为 SnapStream PVS 1.2a 的目录遍历漏洞，产品已停止维护且无官方补丁。建议立即升级到 SnapStream 最新版本（如 Enterprise TV 系列），或迁移至其他受支持的视频录制方案。如无法升级，可在 Web 服务器或反向代理层（如 Nginx/Apache）配置规则过滤 URL 中的 `../` 目录跳转序列，并在防火墙限制对 8129 端口的访问仅限可信 IP。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "SnapStream Personal Video Station 目录遍历漏洞"
updated = "2026-06-16T21:55:36Z"

