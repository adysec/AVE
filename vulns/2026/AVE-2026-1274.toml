[basic]
description = "ip-address 是用于解析和操作 IPv4 与 IPv6 地址的 JavaScript 库。受影响版本 10.1.1 至 10.2.0 中，Address6 的 isLoopback()、isLinkLocal()、isMulticast() 及 isUnspecified() 等特殊属性检查方法未对 IPv4 映射地址（`::ffff:0:0/96`）和 NAT64 通用前缀（`64:ff9b::/96`）执行嵌入式 IPv4 归一化，而是仅依据 IPv6 封装格式进行分类，导致这些实际指向 loopback、RFC 1918 内网或云元数据（如 169.254.169.254）的地址被错误标记为 Global unicast。若应用程序依赖这些检查实现 SSRF 防护或网络信任边界过滤，攻击者即可利用如 `::ffff:127.0.0.1`、`::ffff:10.0.0.1`、`::ffff:169.254.169.254` 或 `64:ff9b::7f00:1` 等地址绕过限制，向服务器本机服务或云实例元数据端点发起请求，造成敏感信息泄露。该漏洞已在 10.2.1 版本中修复。"
published = "2026-07-27T18:16:56.410"
remediation = "升级 ip-address 库到 10.2.1 或更高版本，该版本修复了 Address6 对 IPv4-mapped 和 NAT64 地址的分类错误。如无法立即升级，可在代码中对 IPv4-mapped 地址调用 to4() 方法，将 ::ffff:0:0/96 和 64:ff9b::/96 前缀的地址转换为嵌入的 IPv4 地址后再进行 isLoopback、isPrivate 等信任边界检查。"
score = 6.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "ip-address ip-address IPv6地址分类错误绕过SSRF漏洞"
updated = "2026-07-27T18:16:56.410"

