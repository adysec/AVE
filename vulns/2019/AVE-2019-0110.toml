[basic]
description = "WordPress Visualizer 插件 3.3.0 存在存储型跨站脚本（XSS）漏洞。该漏洞源于插件中的 wp-json/visualizer/v1/update-chart 接口未实施任何访问控制，且 classes/Visualizer/Render/Page/Data.php 文件缺乏输出净化处理。未经身份认证的远程攻击者可利用该漏洞向插件提交包含恶意 JavaScript 代码的图表数据，当管理员或其他特权用户通过 WordPress 后台编辑该图表时，恶意脚本将在其浏览器中执行，从而可能导致会话劫持、后台权限窃取或进一步的控制台操作。该漏洞影响使用 Visualizer 插件 3.3.0 版本的 WordPress 网站，攻击复杂度低，无需用户交互即可在管理员视角触发，危害等级为中等。"
published = "2019-10-03T19:15:09.770"
remediation = "建议立即将 Visualizer 插件升级到 3.3.1 或更高版本，该版本修复了 Gutenberg 块编辑器中未授权的 REST API 访问及输出过滤缺失问题。如暂时无法升级，可临时禁用该插件的 Gutenberg Block 功能，或在防火墙/WAF 层拦截对 wp-json/visualizer/v1/update-chart 的未授权访问请求，以阻止存储型 XSS 攻击。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Visualizer插件 存储型跨站脚本漏洞"
updated = "2026-06-17T02:22:59.503"

