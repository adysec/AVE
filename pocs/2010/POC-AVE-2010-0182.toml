[info]
author = "ave"
description = "通过构造包含 CSS :visited 伪类样式和 JavaScript 计算样式检测的 HTML 页面，验证 Safari 浏览器是否泄露用户已访问链接信息。PoC 页面创建指向目标 URL 的链接，应用 :visited 样式，利用 getComputedStyle 检测颜色差异以判断访问历史。"
id = "POC-AVE-2010-0182"
name = "Apple Safari WebKit CSS :visited 伪类信息泄露漏洞 PoC"
severity = "medium"
tags = ["ave-2010-0182"]
vuln_id = [
    "CVE-2010-2264",
    "AVE-2010-0182",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc-css-visited.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    ":visited",
    "getComputedStyle",
]
