[basic]
description = "Google Chrome 17.0.963.65 之前版本的 WebKit 引擎在处理行盒（line boxes）时存在类型转换错误漏洞（CWE-704），具体为对未指定变量执行了不正确的类型强制转换。远程攻击者可通过诱导用户访问特制 HTML 文档触发该漏洞，成功利用可能导致浏览器崩溃拒绝服务，或在部分情况下实现任意代码执行。该漏洞影响 Google Chrome 17.0.963.65 之前的所有版本，攻击者无需身份认证即可利用，但需要用户交互配合打开恶意网页。"
published = "2012-03-05T19:55:01Z"
remediation = "升级 Google Chrome 至 17.0.963.65 或更高版本（可通过 chrome://settings/help 检查更新或访问 google.com/chrome 手动下载）；Ubuntu 用户更新 chromium-browser 至 18.0.1025.151~r130497 或更高版本；Apple 用户将 Safari 升级至 6.0+、iOS 升级至 6.0+、iTunes 升级至 10.7+；openSUSE 用户通过 zypper update chromium 获取修复。如无法立即升级，可在浏览器中禁用 JavaScript 作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 行框处理类型转换错误漏洞"
updated = "2026-06-16T23:32:28Z"

