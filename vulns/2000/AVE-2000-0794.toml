[basic]
description = "AnalogX 代理服务器 4.04 及更早版本中存在缓冲区溢出漏洞。远程攻击者可通过向 SMTP 协议发送超长 HELO 命令触发该漏洞，导致代理服务进程崩溃，造成拒绝服务。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响所有运行受影响版本的 AnalogX 代理服务器。"
published = "2000-07-25T04:00:00Z"
remediation = "升级到 AnalogX Proxy 4.05 或更高版本（最新版为 4.15），该版本已修复 SMTP/POP3/FTP 处理中的溢出漏洞。如无法升级，可在防火墙或代理服务器层面限制 SMTP HELO 命令长度，或禁用 SMTP 代理转发功能作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "AnalogX Proxy Server SMTP HELO命令缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:12Z"

