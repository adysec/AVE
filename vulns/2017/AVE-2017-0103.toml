[basic]
description = "Graphite 的 composer/views.py 中 send_email 函数存在服务端请求伪造（SSRF）漏洞。攻击者无需身份认证即可利用该 SSRF 端点，使 Graphite Web 服务器向任意内部或外部资源发起 HTTP 请求，并将响应内容编码为图片文件后发送至攻击者指定的邮箱地址，从而实现敏感信息窃取。该漏洞影响 Graphite 1.1.5 及之前所有版本，CVSS 评分 7.5，危害等级高。"
published = "2019-10-11T23:15:10Z"
remediation = "立即升级 Graphite-web 至 1.1.6 或更高版本。如无法升级，手动删除 webapp/graphite/composer/views.py 中的 send_email 函数，该函数未被使用且不影响正常功能。同时检查 SMTP 服务器配置，限制出站网络访问以缓解 SSRF 风险。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Graphite Graphite Web 服务端请求伪造漏洞"
updated = "2026-06-17T01:13:12Z"

