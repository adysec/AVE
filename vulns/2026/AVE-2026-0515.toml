[basic]
description = "`@feathersjs/commons` 工具库中的 `_.merge` 函数存在原型污染漏洞。当通过 `JSON.parse` 解析的输入包含 `__proto__`、`constructor` 或 `prototype` 键时，递归合并操作会将攻击者控制的属性写入 `Object.prototype`，从而污染 Node.js 进程中所有普通对象的原型链。该漏洞 CVSS 评分 3.7，危害等级低，实际利用条件苛刻——需要下游插件或应用将 JSON 解析后的不可信输入直接传入 `_.merge`。已在 `@feathersjs/commons@5.0.45` 中修复。"
published = "2026-07-17T22:17:44Z"
remediation = "将 @feathersjs/commons 升级至 5.0.45 及以上版本，该版本已跳过 __proto__、constructor 和 prototype 键的迭代合并。如无法立即升级，避免将 JSON.parse 解析的不可信输入传入 commons._.merge 方法，或在上游对输入键名进行校验过滤。"
score = 3.7
severity = "LOW"
sources = ["ghsa"]
title = "Feathersjs @feathersjs/commons 原型污染漏洞"
updated = "2026-07-23T17:58:34Z"

