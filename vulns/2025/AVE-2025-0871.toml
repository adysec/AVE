[basic]
description = "Windows Routing and Remote Access Service (RRAS) 存在堆缓冲区溢出漏洞，远程攻击者可通过向目标系统的 RRAS 服务发送特制请求触发该漏洞，成功利用可在目标系统上以服务进程权限执行任意代码。攻击需要用户交互（如点击恶意链接或打开恶意文件），但无需身份认证，攻击复杂度低。该漏洞影响多个 Windows Server 版本，CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:39.593"
remediation = "安装 Microsoft 2025 年 2 月安全更新 (KB5051987) 或热补丁 (KB5052105)。受影响版本升级目标：Windows Server 2016 至 10.0.14393.7785 及以上、Server 2019 至 10.0.17763.6893 及以上、Server 2022 至 10.0.20348.3207 及以上、Server 2025 至 10.0.26100.3194 及以上。如无法立即打补丁，建议在防火墙限制对 RRAS 服务的远程访问，并禁用不必要的路由和远程访问功能以降低攻击面。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 路由和远程访问服务 (RRAS) 远程代码执行漏洞"
updated = "2026-06-17T08:43:18.090"

