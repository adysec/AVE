[basic]
description = "Apple iTunes 10.7 之前版本所集成的 WebKit 渲染引擎存在内存破坏漏洞（CWE-119）。远程攻击者可构造恶意网站，当用户在 iTunes 内置浏览器中访问该页面时，WebKit 在处理特制网页内容过程中触发内存损坏，从而在目标系统上执行任意代码或导致应用程序崩溃，造成拒绝服务。该漏洞影响范围广泛，攻击复杂度低，无需身份认证即可远程利用，CVSS 评分高达 9.3，危害等级严重。"
published = "2012-09-13T10:30:19.387"
remediation = "建议立即将 Apple iTunes 升级至 10.7 或更高版本，通过 Apple Software Update 或访问 apple.com/itunes/download 下载最新版本。如暂时无法升级，可在防火墙层面限制 iTunes 进程的出站网络连接，或暂时禁用 iTunes 访问不可信网站作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple iTunes 远程代码执行漏洞"
updated = "2026-06-16T23:43:35.740"

