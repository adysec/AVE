[basic]
description = "L-Soft Listserv 1.8d及更早版本的Web存档组件中存在缓冲区溢出漏洞，远程攻击者可通过向目标服务器发送特制的超长查询字符串（query string）触发该漏洞，导致缓冲区溢出，从而执行任意命令。该漏洞影响L-Soft Listserv 1.8d及之前版本，攻击者无需身份认证即可远程利用，CVSS评分7.5，危害等级高。厂商已发布修复版本，建议升级至1.8e或更高版本。"
published = "2000-07-17T04:00:00.000"
remediation = "升级 L-Soft Listserv 至 1.8e 或更高版本，该版本已修复 web archive 组件的缓冲区溢出漏洞。如无法立即升级，可在 Web 服务器（如 Apache/IIS）层面限制对 listserv/wa.exe 等 web archive 脚本的访问，仅允许可信 IP 段访问，或在反向代理中过滤超长查询字符串（超过 1024 字节的请求直接拦截）。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "L-Soft Listserv Web Archive 组件缓冲区溢出漏洞"
updated = "2026-06-16T21:52:09.080"

