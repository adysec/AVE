[basic]
description = "Infonautics 产品的 getdoc.cgi CGI 脚本存在安全绕过漏洞，远程攻击者可通过修改表单变量参数绕过付费验证机制，直接访问受保护的文档内容。该漏洞影响运行 Infonautics 相关产品的 Web 服务器，攻击者可无需支付费用即可获取原本需要付费才能查看的文档。利用方式为：攻击者通过网络向目标服务器发送包含篡改后表单变量的 HTTP 请求，绕过 getdoc.cgi 的付费阶段校验，从而获取文档访问权限。该漏洞攻击复杂度低，无需身份认证，可被远程利用，导致信息泄露，危害等级为中危。建议管理员及时升级 Infonautics 软件或移除存在漏洞的 CGI 脚本。"
published = "2000-04-12T04:00:00Z"
remediation = "立即移除或禁用服务器上的 getdoc.cgi 脚本，该 CGI 程序因未正确校验支付状态表单参数而存在绕过漏洞，且厂商 Infonautics 已停止维护，无补丁可用。建议改用支持支付验证的安全文档分发方案或更换为维护中的产品；若短期内无法替换，应在 Web 服务器配置中通过访问控制列表限制该脚本仅对可信 IP 段开放，并在前端增加表单参数校验与签名机制，防止攻击者篡改支付状态字段。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Infonautics getdoc.cgi 支付绕过漏洞"
updated = "2026-06-16T21:51:24Z"

