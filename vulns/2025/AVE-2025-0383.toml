[basic]
description = "Google Chrome 使用的 Skia 图形引擎中存在整数溢出漏洞，远程攻击者可通过诱使用户访问特制的 HTML 页面触发该漏洞，导致堆内存损坏，进而可能实现远程代码执行或信息泄露。该漏洞影响 Google Chrome 132.0.6834.83 之前版本及基于 Chromium 的浏览器（如 Microsoft Edge），攻击需用户交互（点击链接），CVSS 评分 8.8，危害等级高。Google 已在 Chrome 132.0.6834.83 版本中修复此漏洞。"
published = "2025-01-15T11:15:09Z"
remediation = "立即将 Google Chrome 升级至 132.0.6834.83 及以上版本（设置→关于 Chrome→自动检查更新）；Microsoft Edge 用户升级至 132.0.2957.115 及以上版本；Apple Safari 用户升级至 18.3.1，iOS/iPadOS 升级至 15.8.4 或 16.7.11；基于 Chromium 的 Electron 应用需更新至内嵌 Chromium 132 及以上版本。Linux 发行版用户通过包管理器更新至 132.0.6834.83 对应版本。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome Skia 整数溢出远程代码执行漏洞"
updated = "2026-06-17T08:26:28Z"

