[basic]
description = "Linux 内核 ath11k WiFi 驱动在 monitor 模式下调用 ath11k_hal_srng_* 系列函数时缺少 srng->lock 锁保护，导致共享的 srng 数据结构存在并发访问竞争条件。本地低权限攻击者可通过在受影响设备（如 WCN6855、QCN9074）上启用 monitor 模式触发该竞态，引发内核警告（RIP: ath11k_hal_srng_dst_peek）及系统崩溃，造成拒绝服务。该漏洞影响使用 ath11k 驱动的 Linux 内核版本，CVSS 评分 5.5，危害等级中等。"
published = "2025-04-16T15:15:53Z"
remediation = "升级 Linux 内核至 6.14.2 及以上版本（或对应发行版内核：Ubuntu 25.04 更新至 linux-image-6.14.0-22-generic，RHEL/Debian 更新至各自稳定仓库最新内核）。如无法立即升级，可在加载 ath11k 驱动时禁用 monitor 模式（不启用无线监控功能）作为临时缓解措施。升级后需重启系统使新内核生效。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel ath11k 无线驱动监视器模式缺失锁保护导致拒绝服务漏洞"
updated = "2026-06-17T08:14:37Z"

