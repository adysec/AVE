[basic]
description = "GNU elfutils 0.192 版本中的 eu-read 组件存在空指针解引用漏洞。该漏洞位于 readelf.c 文件的 handle_dynamic_symtab 函数中，当程序处理特制的 ELF 文件时，由于未能正确校验指针导致空指针解引用，从而引发程序崩溃（拒绝服务）。攻击者需要具备本地访问权限，通过诱导受害者或系统使用 readelf 工具分析恶意构造的二进制文件来触发该漏洞。"
published = "2025-02-17T03:15:09Z"
remediation = "建议将 GNU elfutils 升级至最新版本，或手动应用官方发布的修复补丁 b38e562a4c907e08171c76b8b2def8464d5a104a 以修复 readelf.c 中 handle_dynamic_symtab 函数的空指针解引用漏洞。"
score = 4.8
severity = "MEDIUM"
sources = ["msrc"]
title = "GNU elfutils 空指针解引用漏洞"
updated = "2026-06-17T08:39:00Z"

