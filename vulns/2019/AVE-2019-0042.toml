[basic]
title = "Kubernetes API Server JSON/YAML 深度嵌套负载拒绝服务漏洞"
description = "Kubernetes API Server 在处理特制 JSON 或 YAML 负载时存在输入验证缺陷，授权用户可发送包含深度嵌套结构的恶意请求，导致 API Server 消耗大量 CPU 和内存资源，最终崩溃不可用。v1.14.0 之前版本默认 RBAC 策略允许匿名用户触发此漏洞。影响 Kubernetes v1.0~v1.12 全版本及 v1.13.12 之前、v1.14.8 之前、v1.15.5 之前、v1.16.2 之前的版本。"
severity = "HIGH"
score = 7.5
sources = ["cve", "nvd", "redhat"]
published = "2019-10-17"
updated = "2024-06-01"
remediation = "升级 Kubernetes 至 v1.13.12、v1.14.8、v1.15.5 或 v1.16.2 及以上版本。从 v1.14.0 之前版本升级的集群需手动收紧 RBAC 策略，限制匿名用户对 API Server 的访问权限。"

