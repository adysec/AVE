[basic]
description = "Microsoft Internet Explorer 5.1 至 6.0、ISA Server 2000 及 Proxy Server 2.0 的 Gopher 客户端存在缓冲区溢出漏洞。该漏洞源于客户端在处理 Gopher 服务器响应时未能正确验证数据长度。远程攻击者可以通过构造一个特制的 gopher:// URL，诱导用户访问并将其重定向至一个发送超长响应的恶意 Gopher 服务器，从而触发溢出并执行任意代码。此漏洞允许未经身份验证的远程攻击者完全控制受影响的目标系统。"
published = "2002-07-03T04:00:00Z"
remediation = "建议用户立即升级至 Internet Explorer 6.0 的最新补丁版本或更高版本的浏览器。对于服务器端，请安装 Microsoft ISA Server 2000 及 Proxy Server 2.0 的相关安全更新。若无法升级，可通过组策略或注册表禁用 Gopher 协议支持，防止攻击者通过 gopher:// 链接触发缓冲区溢出。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer/ISA Server/Proxy Server Gopher 客户端远程缓冲区溢出漏洞"
updated = "2026-06-16T21:57:18Z"

