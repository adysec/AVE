[basic]
description = "SuSE Linux 6.0 至 7.2 版本中自带的 sdbsearch.cgi 脚本存在任意命令执行漏洞。攻击者可通过上传包含 shell 元字符（如管道符、分号等）文件名的 keylist.txt 文件，并在 HTTP Referer 字段中构造目录遍历序列（`..`）将搜索路径指向该文件所在目录，从而触发 CGI 脚本执行恶意命令。远程未经认证的攻击者可利用此漏洞在目标服务器上以 Web 服务器权限执行任意系统命令，进而完全控制受影响的 SuSE Linux 系统。"
published = "2001-08-02T04:00:00Z"
remediation = "升级到 SuSE Linux Enterprise Server 11 或更高版本（如 12 SP3+），这些版本修复了 sdbsearch.cgi 中的 shell 命令注入漏洞。确保升级到包含 Security Update for SuSE Linux 6.3/6.4/7.0 sdb (CVE-2001-1130) 的补丁包（如 sbd-1.3.4-26.93+）。如无法立即升级，可通过修改 httpd 配置禁用对 .. 文件名的搜索功能，并限制通过 HTTP_REFERER 变量传递的路径长度，将 risk_level 参数设置为 high 以拒绝可疑的目录遍历请求。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "SuSE Linux Sdbsearch.cgi 任意命令执行漏洞"
updated = "2026-06-16T21:55:38Z"

