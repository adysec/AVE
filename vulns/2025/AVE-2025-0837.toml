[basic]
description = "Windows CSC（Client Side Caching）服务存在越界读取漏洞，CWE-125。具有低权限的本地攻击者可利用该漏洞读取系统内存中的敏感信息，导致机密性泄露。该漏洞攻击复杂度低，无需用户交互即可触发，影响 Windows 多个版本。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:16:03.003"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新（KB5050004），该更新修复了 Windows CSC 服务中的越界读取漏洞。受影响系统包括 Windows 10/11 及 Windows Server 各版本，更新后对应版本号分别为：Windows 10 1507 升级至 10.0.10240.20890、Windows 10 1607 升级至 10.0.14393.7699、Windows 10 1809 升级至 10.0.17763.6775、Windows 10 22H2 升级至 10.0.19045.5371、Windows 11 22H2/23H2 升级至 10.0.22621.4751/10.0.22631.4751、Windows 11 24H2 升级至 10.0.26100.2894、Windows Server 2022 升级至 10.0.20348.3091、Windows Server 2025 升级至 10.0.26100.2894。可通过 Windows Update 自动获取更新，或从 Microsoft 更新目录网站手动下载安装。无法立即打补丁时，建议限制本地用户对 CSC 服务的访问权限作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows CSC 服务信息泄露漏洞"
updated = "2026-06-17T08:43:13.510"

