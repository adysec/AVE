[basic]
description = "Windows Win32k 内核驱动存在越界写入漏洞（CWE-787），攻击者可在本地低权限上下文中通过构造特制的窗口消息或 GDI 对象操作触发该漏洞，从而将权限提升至 SYSTEM 级别。该漏洞影响 Windows 10 多个版本及 Windows Server 2019/2022 等系统，CVSS 评分 7.8，危害等级高。攻击者需具备本地登录权限或已拥有低特权账户，通过调用存在缺陷的 Win32k.sys 系统服务触发越界写入，最终实现本地特权提升。Microsoft 已在 2021 年 2 月安全更新中修复此漏洞。"
published = "2021-02-25T23:15:13.930"
remediation = '立即安装 Microsoft 2021 年 2 月安全更新（KB4601382 / KB4601384 / KB4601386 等，对应各 Windows 版本），或通过 Windows Update 自动更新修复。如无法立即打补丁，可在注册表中禁用 Win32k 子系统的漏洞利用路径：定位 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon，将 AllocateDASD 值设为 0以阻止本地提权。该漏洞已被用于勒索软件攻击，优先修补。'
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Win32k 特权提升漏洞"
updated = "2026-06-17T03:32:27.587"

