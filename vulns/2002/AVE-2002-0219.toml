[basic]
description = "Agora.cgi 3.2r 至 4.0 版本在开启调试模式时存在完整路径泄露漏洞。远程攻击者无需身份认证即可通过请求一个不存在的 .html 文件触发该漏洞，服务器返回的错误信息中会泄露 agora.cgi 脚本在服务器上的完整物理路径。该漏洞可被攻击者利用来收集目标系统的目录结构信息，为进一步攻击（如路径遍历、文件包含等）提供基础。攻击条件简单，仅需目标开启调试模式且网络可达即可实施。"
published = "2002-05-16T04:00:00Z"
remediation = "立即禁用 Agora.cgi 的调试模式（debug mode），将配置文件中 `debug` 参数设为 `0` 或 `off`。如无法修改配置，在 Web 服务器层面（如 Apache 的 `<Location>` 或 Nginx 的 `location` 块）限制对 `agora.cgi` 的访问来源 IP。建议升级至已修复此问题的 Agora 4.0 以上版本，或迁移至其他受支持的论坛软件。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Agora.cgi 3.2r至4.0 调试模式完整路径泄露漏洞"
updated = "2026-06-16T21:57:00Z"

