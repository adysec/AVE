[basic]
description = "Schneider Electric Pelco VideoXpert Enterprise 2.0 及之前版本存在目录遍历漏洞 (CWE-22)，未经身份认证的远程攻击者可通过构造包含目录遍历序列（如 ../）的恶意 HTTP 请求，绕过 Web 服务器的目录访问限制，读取服务器上的任意敏感文件（如配置文件、日志、源代码等）。该漏洞 CVSS 3.0 评分 5.8（中危），攻击向量为网络（AV:N），攻击复杂度低（AC:L），无需权限（PR:N）和用户交互（UI:N），范围改变（S:C），仅造成低机密性影响（C:L），不影响完整性和可用性。攻击者无需认证即可远程利用，仅需向目标 Web 服务发送包含路径遍历序列的请求即可获取敏感文件内容，可能导致敏感信息泄露、进一步攻击路径暴露。Schneider Electric 已发布修复版本，建议用户升级至 2.0 以上版本。CVSS 向量：CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:N/A:N。CVE-2017-9965 对应 CNVD-2017-38304。"
published = "2018-01-02T03:29:00Z"
remediation = "建议立即升级 Schneider Electric Pelco VideoXpert Enterprise 至 2.1 及以上版本（参考施耐德电气安全公告 SEVD-2017-113-01）。如暂时无法升级，请在 Web 服务器层面配置严格的路径遍历防护规则（如 Nginx/Apache 限制 .. 路径遍历），并在 WAF 层面拦截包含 ../ 等路径遍历特征的请求，同时限制 Web 服务器目录权限，禁止 Web 进程访问敏感系统目录。"
score = 5.8
severity = "MEDIUM"
sources = ["nuclei"]
title = "施耐德电气 Pelco VideoXpert Enterprise 目录遍历漏洞"
updated = "2026-06-17T01:29:17Z"

