[basic]
description = "NVIDIA NeMo Framework for Linux 存在反序列化不可信数据漏洞（CWE-502），本地攻击者通过向受影响系统提交特制的序列化数据触发该漏洞，成功利用可导致远程代码执行、权限提升、数据篡改及信息泄露。该漏洞影响 NVIDIA NeMo Framework 相关版本，攻击者需具备本地低权限访问条件，CVSS 评分 7.8，危害等级高。NVIDIA 已发布安全公告，建议用户及时更新至修复版本。"
published = "2026-06-16T17:16:39Z"
remediation = "建议立即将 NVIDIA NeMo Framework 升级至 2.7.3 或更高版本，该版本已修复反序列化信任边界校验问题。如无法立即升级，应限制本地用户对 NeMo Framework 服务的访问权限，仅允许受信任用户执行模型加载与推理操作，并启用输入数据校验机制防止恶意序列化数据传入。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "NVIDIA NeMo Framework 反序列化漏洞"
updated = "2026-06-17T13:20:10Z"

