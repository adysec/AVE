[basic]
description = "FreeBSD 5.0 及更早版本中的 setlocale 函数存在任意文件读取漏洞，由于该函数在处理 LANG 环境变量时未对文件路径进行充分校验，导致本地攻击者可通过设置恶意的 LANG 环境变量来触发 setlocale 读取任意系统文件。攻击者只需拥有本地用户权限即可利用该漏洞，无需认证，攻击复杂度低。成功利用后，攻击者可读取 /etc/passwd、配置文件等敏感文件内容，导致敏感信息泄露，进而可能为提权或横向移动提供信息支撑。该漏洞影响 FreeBSD 5.0 及之前所有版本，CVSS 评分 7.2，危害等级高。"
published = "2000-12-11T05:00:00Z"
remediation = "升级 FreeBSD 至 5.0 之后的安全修复版本，或安装 FreeBSD-SA-00:53 安全公告中提供的补丁。如无法升级，限制本地用户登录权限，并监控 LANG 环境变量的异常使用行为。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "FreeBSD setlocale 函数本地任意文件读取漏洞"
updated = "2026-06-16T21:52:58Z"

