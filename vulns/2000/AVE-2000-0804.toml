[basic]
description = "Internet Explorer 5.x 及 Microsoft Outlook 中 DHTML Edit Control（DHTMLED）存在任意文件读取漏洞。远程攻击者可通过构造特制网页，利用 IFRAME 重定向技术绕过浏览器安全限制，读取目标系统上的任意文件内容。攻击无需身份认证，仅需诱导用户访问恶意网页即可触发，影响范围广泛。该漏洞 CVSS 评分 5.0，危害等级中等，主要威胁为敏感信息泄露。"
published = "2000-07-14T04:00:00Z"
remediation = '建议立即升级至 Internet Explorer 6.0 或更高版本（2001 年 8 月发布），该版本已修复 DHTML Edit Control 的任意文件读取漏洞。对于 Outlook 用户，请升级至 Outlook 2002 或更高版本。如无法升级，可通过注册表为 DHTML Edit Control 控件（CLSID: 2D360201-FFF5-11D1-8D03-00A0C959BC0E）设置 Kill Bit 来禁用该 ActiveX 控件，具体操作为：在 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\ActiveX Compatibility\{2D360201-FFF5-11D1-8D03-00A0C959BC0E} 下创建 DWORD 值 Compatibility Flags 并设为 0x0400。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Internet Explorer 5.x 及 Outlook DHTML Edit Control 任意文件读取漏洞"
updated = "2026-06-16T21:52:12Z"

