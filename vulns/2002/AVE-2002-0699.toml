[basic]
description = "CGIScript.net csPassword.cgi 脚本存在敏感信息泄露漏洞，该脚本将存储用户密码哈希的 .htpasswd 文件错误地放置在 Web 服务器文档根目录下。未经身份验证的远程攻击者可通过直接 HTTP 请求下载该文件，获取系统中其他用户的密码哈希值，进而使用离线破解工具还原明文密码，最终冒充合法用户获得系统未授权访问权限。该漏洞影响所有部署 CGIScript.net csPassword.CGI 的 Web 服务器。"
published = "2002-10-04T04:00:00Z"
remediation = "该漏洞源于 csPassword.cgi 将 .htpasswd 文件存放在 Web 文档根目录下，攻击者可直接下载并破解用户密码。由于 CGIScript.net 已停止运营且未发布修复补丁，建议立即采取以下措施：首先从 Web 服务器中彻底删除或禁用 csPassword.cgi 脚本，防止进一步被利用；其次将现有 .htpasswd 文件迁移至 Web 文档根目录之外的安全位置，并在 Web 服务器配置（如 Apache 的 httpd.conf 或 Nginx 配置）中添加规则禁止对 .htpasswd 文件的直接访问；随后全面审查 Web 服务器访问日志，检查是否存在对该文件的未授权下载记录；最后强制重置所有系统用户密码，并建议替换为仍在维护的身份验证方案。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "CGIScript.net csPassword.cgi htpasswd文件泄露漏洞"
updated = "2026-06-16T21:58:23Z"

