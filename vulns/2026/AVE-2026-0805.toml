[basic]
description = "pion/stun 是 Go 语言实现的 STUN 协议库，用于会话穿透应用（Session Traversal Utilities for NAT）。在 3.1.3 版本之前，该库的 XORMappedAddress.GetFromAs 函数在处理畸形短 XOR-MAPPED-ADDRESS 属性时缺乏充分的输入验证，导致在处理 STUN 或 ICE Binding-response 解析路径中的畸形数据包时发生程序 panic（崩溃）。未经身份认证的远程攻击者可通过向目标服务器发送特制的恶意 STUN 消息触发该漏洞，造成远程拒绝服务攻击，使依赖该库的应用程序或服务停止响应。该漏洞影响使用受感染版本 pion/stun 库构建的各类 WebRTC、ICE 及 NAT 穿透应用，攻击条件为攻击者能够与目标服务建立网络连接并发送构造的数据包，无需用户交互或权限验证。建议升级到 v3.1.3 或更高版本以修复此问题。"
published = "2026-07-31T23:17:25Z"
remediation = "将 Pion STUN Go 库升级至 v3.1.3 或更高版本，或直接应用补丁 https://github.com/pion/stun/pull/278 修复 XOR-MAPPED-ADDRESS 属性解析中的 panic 问题；如短期内无法升级，建议在 STUN/ICE 服务前部署 WAF 或网络 ACL，过滤异常的 STUN Binding Response 报文以降低拒绝服务风险。"
score = 5.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Pion STUN 远程拒绝服务漏洞"
updated = "2026-07-31T23:17:25Z"

