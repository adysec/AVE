[basic]
description = "libXfont2 的 BitmapScaleBitmaps 函数存在堆缓冲区溢出漏洞，由于 32 位大小字段溢出导致堆内存越界写入。攻击者若能够访问 X Server，可通过发送特制的图形数据触发该漏洞，在 X Server 进程上下文中执行任意代码。该漏洞影响 libXfont2 2.0.8 之前的所有版本，CVSS 评分 8.5，危害等级高。由于需要本地或远程能够连接到 X Server 的前提，攻击条件为中等复杂度，但一旦利用成功将获得服务器上下文的高权限执行，影响范围涵盖所有使用受影版本 libXfont2 的 X Server 部署环境。建议升级 libXfont2 至 2.0.8 或更高版本以修复此漏洞。"
published = "2026-07-08T09:16:30.050"
remediation = "将 libXfont2 升级到 2.0.8 或更高版本，可应用 X.Org 官方提交 be0b08e2d354138d3222b4490e2a77c6ee42f778 中的补丁修复该整数溢出漏洞。如暂时无法升级，应在防火墙中限制 X Server 的网络访问，仅允许本地回环地址或可信内网连接，以阻止远程攻击者利用 BitmapScaleBitmaps 中的堆缓冲区溢出执行代码。"
score = 8.5
severity = "HIGH"
sources = ["zdi"]
title = "X.Org libXfont2 整数溢出堆缓冲区溢出漏洞"
updated = "2026-07-09T19:46:32.177"

