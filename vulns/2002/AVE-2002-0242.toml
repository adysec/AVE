[basic]
description = "Bugzilla 2.14 2.14.2之前版本及2.16 2.16rc2之前版本在配置了反向DNS解析功能时，存在安全绕过漏洞。远程攻击者可利用此漏洞，通过伪造反向DNS主机名的方式绕过基于IP地址的访问限制，未经授权访问受保护的Bugzilla系统。该漏洞影响启用了反向DNS查找功能的Bugzilla实例，攻击条件为攻击者能够控制其连接的反向DNS解析结果。CVSS评分为7.5，危害等级较高。"
published = "2002-08-12T04:00:00Z"
remediation = "将 Bugzilla 升级至 2.14.2 或更高版本（2.14 分支），或升级至 2.16rc2 或更高版本（2.16 分支），并运行 checksetup.pl 完成数据库结构升级（logincookies 表将改为存储 IP 地址）。如暂时无法升级，可在 Apache 配置中设置 HostnameLookups Off 以禁用反向 DNS 查询，从而阻断利用路径。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Mozilla Bugzilla IP地址限制绕过漏洞"
updated = "2026-06-16T21:58:10Z"

