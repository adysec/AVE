[basic]
description = "HP-UX 操作系统中的打印后台处理服务 lpspooler（位于 PrinterMgmt.LP-SPOOL 文件集）存在缓冲区溢出漏洞。本地攻击者可通过向 lpspooler 发送特制的打印请求触发缓冲区溢出，从而覆盖内存中的关键数据，实现权限提升，获取 root 级别系统控制权。该漏洞影响 HP-UX 11.0 及更早版本，CVSS 评分 4.6，危害等级中危。攻击者需要拥有本地系统访问权限才能利用此漏洞，无法远程利用。"
published = "2000-12-19T05:00:00Z"
remediation = "立即安装 HP 针对 PrinterMgmt.LP-SPOOL 文件集发布的 lpspooler 安全补丁（参见 HP 安全公告 HPSBUX0012-148）。如无法打补丁，可临时移除 lpspooler 的 setuid 权限：`chmod 0555 /usr/sbin/lpspooler`，并限制仅授权管理员可执行打印管理操作。建议升级至 HP-UX 11.11 及以上受支持版本。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "HP HP-UX lpspooler 缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:52:52Z"

