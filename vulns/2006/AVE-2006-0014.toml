[basic]
description = 'PHP 5.3.4之前版本中存在空字节注入漏洞，由于PHP在处理文件路径时未正确过滤\0（空字节）字符，导致攻击者可在路径名中插入空字节来绕过访问限制。具体而言，攻击者可通过向file_exists等函数传递包含恶意扩展名的路径（如.php\0.jpg），使PHP仅识别.jpg等安全扩展名而忽略前面的.php，从而绕过文件类型检查或上传限制。该漏洞攻击复杂度低，无需认证即可远程利用，影响所有PHP 5.3.4之前版本。'
published = "2011-01-18T20:00:10Z"
remediation = '立即将 PHP 升级至 5.3.4 或更高版本，该版本修复了路径名中空字节（\0）导致的安全绕过漏洞。如无法立即升级，可在应用层对用户输入的文件名进行过滤，移除空字节字符（\0），并严格校验文件扩展名白名单，仅允许预期的扩展名通过。同时建议在 Web 服务器层面（如 Apache 的 mod_security）添加规则拦截包含空字节的请求 URI。'
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "PHP NULL字节注入安全限制绕过漏洞"
updated = "2026-06-16T22:34:39Z"

