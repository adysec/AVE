[info]
author = "ave"
description = "通过 HTTP GET 请求检测目标是否存在 Windows 相关内容，间接验证 Windows Themes 欺骗漏洞的暴露面。目标服务器返回的页面中包含 'windows' 关键字则判定为可能存在风险。"
id = "POC-AVE-2025-0767"
name = "CVE-2025-21308 Windows Themes Spoofing PoC"
severity = "medium"
tags = ["ave-2025-0767"]
vuln_id = [
    "CVE-2025-21308",
    "AVE-2025-0767",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
case_insensitive = true
expect = true
part = "body"
type = "word"
words = ["windows"]
