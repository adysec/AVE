[basic]
description = "Computer Associates ARCserveIT 6.61 和 6.63 客户端版本在创建临时文件 asagent.tmp 和 inetd.tmp 时未进行安全检查，存在竞争条件漏洞。本地攻击者可通过在临时文件创建前建立指向敏感系统文件的符号链接，诱导进程将数据写入目标文件，实现任意文件覆盖。该漏洞需本地访问权限且攻击复杂度高（CVSS 1.2，AV:L/AC:H），仅影响文件完整性，可导致关键配置或系统文件被篡改，进而引发权限提升或服务中断。Computer Associates 已发布补丁修复此问题。"
published = "2001-05-18T04:00:00Z"
remediation = "建议立即升级 ARCserveIT 至 6.66 或更高版本，以修复临时文件符号链接漏洞。如暂时无法升级，可采取以下临时缓解措施：将 /tmp 目录权限设置为 1777 并启用 sticky bit，同时通过 crontab 定期清理 /tmp 下的 inetd.tmp 和 asagent.tmp 文件，或在 asagent 启动脚本中预先创建这两个空文件并设置不可修改权限，防止普通用户通过符号链接覆盖系统关键文件。"
score = 1.2
severity = "LOW"
sources = ["exploitdb"]
title = "Computer Associates ARCserveIT 临时文件任意文件覆盖漏洞"
updated = "2026-06-16T21:56:05Z"

