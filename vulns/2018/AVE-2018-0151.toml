[basic]
description = "DomainMOD 4.11.01 及之前版本中的资产添加页面（assets/add/account-owner.php）存在存储型跨站脚本漏洞。具有管理员权限的攻击者可在 Owner name 字段中注入恶意 JavaScript 代码，当其他管理员访问受影响页面时脚本自动执行，导致敏感信息泄露或会话劫持。攻击需高权限用户交互，CVSS 评分 4.8，危害等级中危。"
published = "2018-11-29T22:29:00Z"
remediation = "升级 DomainMOD 至 v4.12.0 或更高版本（当前最新为 v4.23.0），该版本已对用户输入进行转义处理，可有效防御 XSS 攻击。如无法立即升级，可在 `assets/add/account-owner.php` 中对 Owner name 字段使用 `htmlspecialchars()` 或 `strip_tags()` 进行输出编码，并启用 HTTP 响应头 `X-XSS-Protection: 1; mode=block` 作为临时缓解措施。"
score = 4.8
severity = "MEDIUM"
sources = ["nuclei"]
title = "DomainMOD 跨站脚本漏洞"
updated = "2026-06-17T01:49:47Z"

