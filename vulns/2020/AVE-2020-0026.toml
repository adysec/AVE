[basic]
description = "tags.<value>Apple的TCC（Transparency, Consent, and Control）框架在处理环境变量时存在安全验证缺陷，攻击者可利用该缺陷绕过TCC的访问控制机制，从而获取用户敏感信息。该漏洞影响iOS 13.6之前、iPadOS 13.6之前以及macOS Catalina 10.15.6之前的版本。攻击条件为攻击者需具备目标系统的本地用户权限，通过构造恶意环境变量或利用Metasploit框架中的tccbypass模块，可绕过系统隐私保护策略，读取受TCC保护的敏感用户数据。Apple已在iOS 13.6、iPadOS 13.6和macOS Catalina 10.15.6中通过改进环境变量验证逻辑修复此漏洞。"
published = "2020-10-16T17:15:17.637"
remediation = "立即将设备升级至iOS 13.6或iPadOS 13.6，将macOS Catalina升级至10.15.6版本，以修复环境变量处理缺陷导致的敏感信息泄露。若无法立即升级，可通过限制本地用户权限、禁用不必要的账户访问作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["kev"]
title = "Apple iOS iPadOS macOS TCC框架环境变量处理信息泄露漏洞"
updated = "2026-06-17T03:28:50.000"

