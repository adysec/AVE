[basic]
description = "FreeBSD 4.x 及更早版本中，inetd 超级服务器所加载的 ident 服务（RFC 1413）存在权限配置缺陷。该服务在处理远程 ident 请求时未正确设置组权限，导致无需任何身份认证的远程攻击者即可读取由 wheel 用户组可访问文件的前 16 个字节内容。由于 wheel 组成员在 FreeBSD 系统中通常拥有读取系统关键敏感文件（如密码文件等）的权限，攻击者可通过向目标主机 113/tcp 端口发送特制 ident 查询请求来获取文件片段信息，从而造成系统敏感信息泄露。该漏洞影响所有启用 ident 服务且运行 FreeBSD 4.x 及更早版本的网络可达系统，攻击条件简单，仅需目标系统开放 ident 服务端口。FreeBSD 安全团队已发布安全公告 FreeBSD-SA-01:11.inetd 提供修复补丁，建议用户升级系统或应用补丁以消除该信息泄露风险。"
published = "2001-05-03T04:00:00Z"
remediation = "建议升级 FreeBSD 系统至 4.x 之后的安全补丁版本。如无需使用 ident 服务，可通过编辑 /etc/inetd.conf 文件，将 ident 服务相关的配置行注释掉，并重启 inetd 服务以彻底禁用该服务，从而消除权限漏洞风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "FreeBSD inetd ident 服务信息泄露漏洞"
updated = "2026-06-16T21:53:51Z"

