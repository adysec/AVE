[basic]
description = "OpenSSH SSH客户端在2.3.0版本之前未能正确禁用X11转发及ssh-agent转发功能。未经身份认证的远程攻击者可搭建恶意SSH服务器，当合法用户使用受影响版本的SSH客户端连接至该恶意服务器时，攻击者可通过X11转发获取目标用户X11显示的访问权限并窃取X11事件数据，或通过ssh-agent转发获取ssh-agent的访问权限，进而利用agent转发在其他系统中进行身份验证或执行未授权操作。该漏洞影响所有使用OpenSSH 2.3.0之前版本的SSH客户端用户，CVSS评分为7.5，危害等级为高。"
published = "2001-01-09T05:00:00Z"
remediation = "建议将 OpenSSH SSH 客户端升级至 2.3.0 或更高版本，该版本已修复 X11 和 ssh-agent 转发在受信任环境下未被正确限制的问题。同时检查 ssh_config 配置文件，确保未在全局范围内启用 ForwardX11 或 ForwardAgent，或通过 TrustedUserCAKeys/Matchers 机制严格限制仅向可信主机转发显示与代理权限。如短期内无法升级，可临时在 ssh_config 中显式设置 ForwardX11 no 与 ForwardAgent no 以阻断攻击面。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "OpenSSH SSH客户端 X11及代理转发未授权访问漏洞"
updated = "2026-06-16T21:53:18Z"

