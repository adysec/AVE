[basic]
description = "tags.<value>Apple iOS、iPadOS和watchOS的Mail组件存在缓冲区溢出漏洞（CWE-787），由于边界检查不足，处理恶意构造的邮件消息时可能触发越界写入。攻击者可通过发送特制的恶意邮件诱导目标用户打开，利用该漏洞实现内存篡改或应用崩溃，进而可能执行任意代码。该漏洞影响iOS 13.5之前、iPadOS 13.5之前、iOS 12.4.7之前及watchOS 6.2.5之前的版本，CVSS评分为8.8，危害等级为高危。"
published = "2020-06-09T17:15:13.317"
remediation = "tags.<value>立即将设备升级至 iOS 13.5、iPadOS 13.5 或 iOS 12.4.7，watchOS 用户升级至 watchOS 6.2.5。升级路径：进入「设置」→「通用」→「软件更新」，确保自动更新已开启。如设备不再接收官方更新（已停止支持的旧版本），应禁用 Mail 应用中的远程内容加载功能（设置→邮件→账户→下载附件→设为「仅 Wi-Fi」或关闭），并避免打开来源不明的邮件附件，以降低被利用的风险。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Apple iOS、iPadOS和watchOS Mail组件缓冲区错误漏洞"
updated = "2026-06-17T03:28:37.607"

