[basic]
description = "这是一个导致 Opera 浏览器崩溃的拒绝服务漏洞。受影响的 Opera 浏览器版本低于 11.50 时的错误页面处理机制存在缺陷，当用户持续访问无效 URL 时，浏览器生成的错误页面会逐渐占用主机磁盘空间。当磁盘空间耗尽时，浏览器将崩溃并留下残留的错误文件。通过不断提交无效 URL 的方式可以触发此漏洞，导致目标系统无法正常使用 Opera 浏览器。攻击者无需身份验证即可远程执行此攻击，影响范围涵盖所有使用旧版 Opera 浏览器的用户，存在较低的攻击复杂度。该漏洞通过浏览器占满磁盘空间的资源耗尽机制引发，可导致服务中断，CVSS 评分为 5.0，属于中危漏洞。Microsoft 和 Opera 厂商已发布安全补丁修复此问题，建议用户立即升级到最新版本以获取保护。"
published = "2011-07-01T10:55:02Z"
remediation = "建议立即将 Opera 浏览器升级到 11.50 或更高版本，该版本已修复此拒绝服务漏洞。若暂时无法升级，可通过禁用 JavaScript 或限制访问不可信网站作为临时缓解措施，并建议定期清理浏览器缓存防止磁盘空间耗尽导致崩溃。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera Web Browser远程拒绝服务漏洞"
updated = "2026-06-16T23:31:39Z"

