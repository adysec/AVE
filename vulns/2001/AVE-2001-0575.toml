[basic]
description = "Windows NT 系统的 NTLM 安全支持提供程序（NTLMSSP）服务在处理本地过程调用（LPC）请求时，未正确校验请求中的功能编号（function number），存在权限提升漏洞。由于 NTLMSSP 运行在较高权限的进程上下文中，本地攻击者可在目标系统上构造并发送特制的 LPC 请求，借助这一校验缺陷将普通用户权限提升至管理员级别，从而完全控制系统、窃取敏感数据或安装恶意程序。攻击前提是攻击者已获得目标主机上的本地账户访问权限，无需通过身份认证或任何外部网络访问。微软已于后续安全更新中修复该漏洞。"
published = "2001-03-12T05:00:00Z"
remediation = "这是 Windows NT 4.0 的本地权限提升漏洞（Microsoft Security Bulletin MS00-083）。请立即通过 Microsoft 2000 年 12 月安全更新（Hotfix，http://support.microsoft.com 安全公告 KB Q282266）升级系统或安装对应补丁包，彻底修复 NTLMSSP 对 LPC 请求中函数号参数的校验缺陷。若无法即时打补丁，作为临时缓解措施可限制本地用户登录权限、加强账户管理并仅允许受信任管理员交互式登录；同时持续监控事件日志（Security/System）中对 LSASS/NtLmSsp 进程的可疑本地越权访问行为，及时排查受影响终端。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Windows NT NTLMSSP 本地权限提升漏洞"
updated = "2026-06-16T21:53:29Z"

