[basic]
description = "CVE-2001-0270是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-05-03T04:00:00Z"
remediation = "升级 Marconi ASX-1000 交换机的 Forethought 固件至厂商发布的安全补丁版本（高于 6.2），以修复 telnet 和 Web 管理接口处理带 SYN-FIN 及分片标志畸形数据包时的拒绝服务漏洞。如无法立即升级，应在防火墙或访问控制列表中限制仅允许可信管理网段访问设备的 telnet（23 端口）和 HTTP/HTTPS 管理接口，并在不需要时临时禁用 Web 管理功能，仅通过本地串口Console进行管理。"
