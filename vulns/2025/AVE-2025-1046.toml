[basic]
description = "Linux 内核 VLAN 子系统存在越界读取漏洞。当在非以太网设备（如 GRE 隧道设备）上创建 VLAN 设备时，内核会为该底层设备初始化 GARP 和 MRP 协议，并通过 dev_mc_add 添加组播地址。由于底层设备的地址长度（dev->addr_len）可能大于以太网的 6 字节，而 GARP/MRP 提供的组播地址固定为 6 字节，导致内核发生越界读取，可能将内核函数地址泄露到用户态。攻击者需要具备本地低权限访问权限，通过在主机上创建基于非以太网设备的 VLAN 接口并执行特定命令即可触发该漏洞，造成信息泄露。该漏洞影响使用受影响内核版本的 Linux 系统，CVSS 评分为 7.1（高危）。"
published = "2025-04-01T16:15:22Z"
remediation = "建议立即升级 Linux 内核至以下修复版本之一：5.4.291、5.10.235、5.15.179、6.1.131、6.6.83、6.12.19、6.13.7 或更高版本。具体操作：Debian 12 用户执行 apt update && apt upgrade linux-image-$(uname -r)，升级至 6.1.133-1 及以上；Ubuntu 22.04 LTS 用户通过 apt install --only-upgrade linux-image-generic-hwe-22.04 升级至 5.15.0-140.150 及以上；RHEL 9 用户通过 yum update kernel 安装 RHSA-2025:8643 补丁后重启系统。如无法立即重启，可通过 sysctl -w kernel.unprivileged_userns_clone=0 限制非特权用户命名空间克隆，或通过 sysctl -w net.ipv4.ip_forward=0 禁用不必要的隧道接口，并移除 gretap/ip6gre 等非以太网隧道设备的 VLAN 绑定配置，以临时缓解越界读取风险。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux kernel VLAN 越界读取信息泄露漏洞"
updated = "2026-06-17T08:44:36Z"

