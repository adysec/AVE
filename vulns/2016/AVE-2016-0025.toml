[basic]
description = "hero-maps-pro 是一款 WordPress 地图插件，其 2.1.0 及之前版本中存在反射型跨站脚本漏洞。攻击者无需认证即可通过构造特制的恶意 URL，诱使用户点击后，恶意 JavaScript 代码将在用户浏览器中执行，导致会话劫持、钓鱼攻击或页面内容篡改。该漏洞源于程序未对用户输入进行充分的过滤与转义处理，攻击条件简单，危害中等。"
published = "2016-10-10T20:59:13Z"
remediation = "立即停用并删除 hero-maps-pro 插件（该插件已于 2016 年 5 月从 WordPress 仓库下架，不再维护）。替换为仍在维护的地图插件（如 WP Google Maps）。如无法立即删除，在 WAF 层面添加规则拦截包含 `<script>` 等 XSS 特征的 URL 参数请求，同时在 WordPress 中禁用该插件所有短代码以防止反射型 XSS 利用。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress hero-maps-pro 插件反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:44Z"

