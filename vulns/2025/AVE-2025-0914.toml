description = "CVE-2025-21667是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2025-01-31T12:15:27.863"
remediation = "建议将 Linux 内核升级至安全版本：6.1.127、6.6.74、6.12.11 或 6.13 及以上。具体操作：Debian 12 用户执行 apt update && apt upgrade linux-image-*（目标版本 6.1.128-1）；Ubuntu 22.04 LTS 用户安装 linux-image-6.8.0-64-generic 6.8.0-64.67~22.04.1；Ubuntu 24.04 LTS 默认不受影响。如无法立即升级，可临时在防火墙层禁用 IPv6 或限制本地用户对 XFS 文件系统的写入权限作为缓解措施。升级后必须重启系统使新内核生效。"
