[info]
author = "ave"
description = "检测 Apache mod_ssl 2.8.9 及更早版本中的 off-by-one 缓冲区溢出漏洞。通过检查服务器版本号判断是否存在漏洞，该漏洞允许本地用户通过构造超长 .htaccess 条目以 Apache 用户权限执行任意代码。"
id = "POC-AVE-2002-0217"
name = "Apache mod_ssl 2.8.x HTAccess Off-by-One Buffer Overflow PoC"
severity = "high"
tags = [
    "cve-2002-0653",
    "apache",
    "mod-ssl",
    "buffer-overflow",
]
vuln_id = [
    "CVE-2002-0653",
    "AVE-2002-0217",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = [
    "Apache/2.8",
    "Apache/2.7",
    "Apache/2.6",
    "Apache/2.5",
    "Apache/2.4",
    "Apache/2.3",
    "Apache/2.2",
    "Apache/2.1",
    "Apache/2.0",
]
