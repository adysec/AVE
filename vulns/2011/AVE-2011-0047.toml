[basic]
description = "Adobe Flash Player 10.3.181.14之前版本（Windows/Mac OS X/Linux/Solaris）及10.3.185.21之前版本（Android）存在内存破坏漏洞。攻击者可构造特制的SWF文件，通过诱导用户访问恶意网页或打开恶意文档触发该漏洞，成功利用后可导致远程代码执行或拒绝服务。该漏洞无需身份认证，但需要用户交互，CVSS评分9.3，危害等级严重。Adobe已在2011年5月安全公告APSB11-12中发布更新修复此漏洞。"
published = "2011-05-13T22:55:01Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.181.14 及以上版本（Windows/Mac/Linux/Solaris）或 10.3.185.21 及以上版本（Android）。由于 Flash Player 已停止支持并存在大量已知漏洞，强烈建议彻底卸载 Flash Player，改用 HTML5 替代方案。如业务必须使用，可在浏览器中启用 click-to-play 插件策略，并限制仅访问受信任站点。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏漏洞"
updated = "2026-06-16T23:27:45Z"

