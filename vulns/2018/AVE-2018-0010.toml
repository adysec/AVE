[basic]
description = "Cisco IOS、IOS XE 和 IOS XR 软件的链路层发现协议（LLDP）子系统存在多个缓冲区溢出漏洞。该漏洞源于 LLDP 协议处理过程中对数据包长度校验不充分，导致未经身份认证的相邻攻击者可通过向受影响设备发送特制的 LLDP 数据包触发缓冲区溢出，造成设备拒绝服务（DoS）或利用提升的权限执行任意代码。该漏洞影响 Cisco IOS、IOS XE 及 IOS XR 全系列版本，CVSS 评分 8.8，危害等级高。Cisco 已在 2018 年 3 月 28 日发布安全公告修复此漏洞，该漏洞已被 CISA 列入已知被利用漏洞目录（KEV）。"
published = "2018-03-28T22:29:00Z"
remediation = "立即升级至 Cisco 官方修复版本：Cisco IOS XR 用户升级至 5.3.4 或 5.1.3 及以上版本；Cisco IOS/IOS XE 用户升级至对应修复版本（参考 cisco-sa-20180328-lldp 公告）。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），且 Cisco PSIRT 确认存在野外利用，无变通缓解措施，必须通过升级修复。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS/IOS XE/IOS XR LLDP子系统缓冲区溢出漏洞"
updated = "2026-06-17T01:29:59Z"

