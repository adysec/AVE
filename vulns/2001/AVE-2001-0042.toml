[basic]
description = "Brian Stanback bsguest.cgi 1.0 是一个 CGI guestbook 脚本，该脚本存在远程命令执行漏洞。未经身份认证的远程攻击者可以通过在 email 地址字段中输入 shell 元字符（如分号、管道符等），向服务器注入并执行任意系统命令。该漏洞影响所有使用 bsguest.cgi 1.0 版本的 Web 应用程序，攻击者无需身份验证即可在目标服务器上获得与 Web 服务器相同权限的命令执行能力，CVSS 评分为 10.0，危害等级为严重。"
published = "2001-02-12T05:00:00.000"
remediation = "删除服务器上的 bsguest.cgi 脚本，该软件已停止维护且未发布修复版本，无法通过升级解决此漏洞。如需保留留言功能，应替换为当前受维护的留言板或评论系统（如 Commento、Cusdis 等）。如无法立即移除，可在 Apache 配置的 cgi-bin 目录中注释掉该脚本的执行权限，或通过 mod_rewrite 规则拦截对 bsguest.cgi 的所有访问请求，同时建议在防火墙或 WAF 规则中过滤 email 字段中的分号（;）、管道符（|）等 shell 元字符，并确保 Web 服务器进程以最低权限运行。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Brian Stanback bsguest.cgi 远程命令执行漏洞"
updated = "2026-06-16T21:53:39.200"

