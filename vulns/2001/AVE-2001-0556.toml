[basic]
description = "Windows 2000 的 RunAs（runas.exe）服务在运行时仅维护单个会话实例，本地攻击者可通过与认证服务器建立命名管道会话但不发送任何服务请求的方式，耗尽 RunAs 的会话处理能力，导致该服务挂起（拒绝服务）。该漏洞攻击复杂度低，无需身份认证即可触发，但需要本地访问权限。厂商虽曾争议其危害性，但在终端服务器场景下确实可影响其他用户。CVSS 评分 2.1，危害等级低。"
published = "2001-12-31T05:00:00Z"
remediation = 'Windows 2000 已停止支持，建议升级至 Windows 10/11 或 Windows Server 2019/2022 等受支持版本。如无法升级，可通过组策略限制非授权用户的本地交互登录权限，并禁用 RunAs 服务的网络访问。临时缓解措施：在注册表 `HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\RunAs` 中限制同时运行实例数。'
score = 2.1
severity = "LOW"
sources = ["exploitdb"]
title = "Microsoft Windows 2000 RunAs 服务拒绝服务漏洞"
updated = "2026-06-16T21:56:25Z"

