[basic]
description = "Ipswitch WinCOM LPD 1.00.90 的 LPD（行式打印机守护进程）组件在处理 LPD 协议选项时存在输入验证缺陷。未经身份认证的远程攻击者可通过向目标系统的 515 端口发送大量特制的 LPD 选项数据包，触发服务组件中的资源耗尽或缓冲区处理异常，导致 LPD 服务进程崩溃或停止响应，造成拒绝服务。该漏洞影响 WinCOM LPD 1.00.90 版本，CVSS 评分 5.0，危害等级中等，攻击复杂度低，无需用户交互。"
published = "2000-11-14T05:00:00.000"
remediation = "该产品已停止维护，建议立即在防火墙层面限制对 515 端口的访问，仅允许可信主机连接；如业务不需要 LPD 服务，直接禁用该服务或卸载 WinCOM LPD 软件，并迁移至受支持的替代打印解决方案。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Ipswitch WinCOM LPD 1.00.90 拒绝服务漏洞"
updated = "2026-06-16T21:52:34.460"

