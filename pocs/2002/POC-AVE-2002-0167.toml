[info]
author = "AVE"
description = "检测目标系统上是否存在 Sudo 1.6.x 版本，该版本密码提示功能存在堆溢出漏洞(CVE-2002-0184)，本地攻击者可通过构造特制的 -p 参数触发堆缓冲区溢出，覆盖堆内存中的关键数据结构，实现权限提升至 root"
id = "POC-AVE-2002-0167"
name = "CVE-2002-0184 PoC"
severity = "high"
tags = ["cve-2002-0184"]
vuln_id = [
    "CVE-2002-0184",
    "AVE-2002-0167",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/usr/bin/sudo"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = "."
type = "regex"
