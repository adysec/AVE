[basic]
description = "talkback.cgi 程序存在目录遍历漏洞，未经身份认证的远程攻击者可通过在 article 参数中注入 ..（点号）路径遍历序列，绕过 Web 服务器目录限制读取服务器上的任意文件。该漏洞影响使用 talkback CGI 脚本的 Web 服务器，攻击者无需事先认证即可在存在该脚本的服务器上执行任意文件读取操作，可能导致敏感配置文件、密码文件或源代码泄露。攻击者只需构造包含目录遍历字符的 HTTP 请求即可触发漏洞，利用方式简单且无需复杂交互。"
published = "2001-06-18T04:00:00Z"
remediation = "建议将 talkback.cgi 升级至 Way To The Web 发布的修复版本（Talkback 1.2 或更高版本），该版本已过滤 article 参数中的 `..` 路径序列。如暂时无法升级，可修改 talkback.cgi 源代码，在读取文件前对 article 参数进行校验，拒绝包含 `..` 或 `/` 的请求，并将程序文件目录设置为 Web 根目录之外的独立目录，同时配置 Web 服务器禁止对 data/ 等敏感目录的访问。临时缓解措施可直接在 Apache 配置中使用 `RedirectMatch 404 ^/cgi-bin/talkback` 禁用该脚本执行。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Matt Wright Talkback 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:54:16Z"

