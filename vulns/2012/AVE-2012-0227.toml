[basic]
description = "Mozilla Firefox/Thunderbird/SeaMonkey 的 JSDependentString::undepend 函数中存在释放后重用（Use-After-Free）漏洞。远程攻击者可利用包含多依赖关系的字符串向量触发内存破坏，导致拒绝服务或任意代码执行。该漏洞影响 Firefox 4.x 至 13.0、Firefox ESR 10.x 至 10.0.6、Thunderbird 5.0 至 13.0、Thunderbird ESR 10.x 至 10.0.6 及 SeaMonkey 2.11 之前版本，CVSS 评分 10.0，危害等级严重。Mozilla 已在 Firefox 14.0 及相应更新中修复此漏洞。"
published = "2012-07-18T10:26:49.047"
remediation = "升级 Firefox 至 14.0 及以上版本，Firefox ESR 升级至 10.0.6 及以上版本；Thunderbird 升级至 14.0 及以上版本，Thunderbird ESR 升级至 10.0.6 及以上版本；SeaMonkey 升级至 2.11 及以上版本。无法立即升级时，可禁用 JavaScript 作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 释放后使用内存破坏漏洞"
updated = "2026-06-16T23:40:40.867"

