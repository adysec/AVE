[basic]
description = "VMware ESXi 及 Horizon DaaS 设备中使用的 OpenSLP 服务存在堆缓冲区覆写漏洞（CWE-787），未经身份认证的远程攻击者可通过发送精心构造的 SLP（服务位置协议）数据包触发堆内存破坏，进而在目标系统上实现远程代码执行。该漏洞影响 VMware ESXi 6.5/6.7 及 Horizon DaaS 相关版本，CVSS v3.1 评分 9.8（严重），攻击向量为网络（AV:N）、攻击复杂度低（AC:L）、无需权限（PR:N）且无需用户交互（UI:N），可直接导致系统完全沦陷。VMware 已发布安全补丁修复此漏洞，建议受影响用户尽快升级至修复版本。"
published = "2019-12-06T16:15:11Z"
remediation = "建议立即将 VMware ESXi 升级至 6.7 Update 2 或 6.5 Update 3 及其更高版本。若无法立即更新，可通过执行命令 `vim-cmd hostsvc/slp-set-enabled 0` 禁用 SLP 服务，或在防火墙中拦截 TCP/UDP 427 端口以缓解风险。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "VMware ESXi OpenSLP 堆缓冲区覆写漏洞"
updated = "2026-06-17T02:37:52Z"

