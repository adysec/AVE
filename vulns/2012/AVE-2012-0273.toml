[basic]
description = "Apple Safari 6.0 之前版本使用的 WebKit 渲染引擎存在内存破坏漏洞。攻击者可通过构造恶意网页，利用 WebKit 在处理网页内容时的内存管理缺陷触发缓冲区溢出或内存损坏，从而在用户系统上执行任意代码或导致浏览器崩溃拒绝服务。该漏洞影响所有使用受影响版本 Safari 浏览器的用户，攻击者无需身份认证即可远程发起攻击，攻击过程隐蔽且影响重大。用户仅需访问攻击者控制的恶意网站即可被利用，可造成敏感信息泄露、远程代码执行等严重后果。Apple 已在 Safari 6.0 中修复此漏洞。"
published = "2012-07-25T20:55:02Z"
remediation = '将 OS X Lion 升级至 v10.7.4 并安装 Safari 6.0，或直接更新至 OS X Mountain Lion 10.8 及以上版本，以修复 WebKit 中导致内存破坏的多个安全漏洞。如无法立即升级，可临时启用 Safari 的"安全浏览"功能并在防火墙中拦截恶意站点，同时避免访问不可信的网页内容。'
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:32Z"

