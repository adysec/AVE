[basic]
description = "Microsoft Office 在处理特制 RTF 文档时存在内存损坏漏洞（CWE-119）。攻击者可通过向用户发送包含恶意 RTF 内容的文档或邮件，诱导用户打开后触发漏洞，导致远程代码执行。该漏洞影响 Microsoft Word 2007 SP2、Word 2010 SP2、Word 2013 SP1、Word 2016、Word for Mac 2011、Word 2016 for Mac、Office 兼容包 SP3、Word Viewer、SharePoint Server 2010/2013 上的 Word Automation Services 以及 Office Web Apps 2010/2013 和 Office Online Server 等多个版本。攻击成功后可完全控制受影响的系统，实现安装程序、查看/更改/删除数据或创建新账户等操作。Microsoft 已在 2016 年 10 月安全更新中修复此漏洞。"
published = "2016-10-14T02:59:38Z"
remediation = "建议立即安装 Microsoft Office 2019/2021 或 Microsoft 365 的最新累积安全更新 (KB5018433 等)，或通过 Windows Update 自动更新至至少 Office 2016 的最新支持版本。如无法立即打补丁，可通过组策略禁用 Office 文档的自动内容执行功能，并限制 RTF 文件的访问权限作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Office 内存损坏远程代码执行漏洞"
updated = "2026-06-17T00:52:45Z"

