[basic]
description = "Microsoft SharePoint Server 存在远程代码执行漏洞，该漏洞源于权限验证（CWE-285）不足，具有高权限的认证攻击者可通过网络向受影响 SharePoint 服务器发送特制请求触发漏洞，成功利用可在目标系统上以 SharePoint 服务账户权限执行任意代码。该漏洞影响 Microsoft SharePoint Server 多个受支持版本，CVSS 评分 7.2，危害等级高。Microsoft 已在 2025 年 1 月安全更新中发布补丁修复此漏洞。"
published = "2025-01-14T18:16:00Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新，具体版本：SharePoint Enterprise Server 2016 升级至 16.0.5483.1001，SharePoint Server 2019 升级至 16.0.10416.20041，SharePoint Server Subscription Edition 升级至 16.0.17928.20356。可通过 Microsoft Update 自动更新或从 MSRC 下载补丁手动安装。如无法立即打补丁，建议限制对 SharePoint 服务器的网络访问，仅允许受信任管理员 IP 连接，并审查高权限用户账户。"
score = 7.2
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft SharePoint Server 远程代码执行漏洞"
updated = "2026-06-17T08:43:09Z"

