[basic]
description = "Grafana 2.x 至 6.x 版本（低于 6.3.4）的 HTTP API 存在访问控制缺陷，`/api/snapshots` 端点未要求身份验证即可使用。未经身份认证的远程攻击者可通过向该端点发送特制的 POST 请求，反复创建包含大量数据的快照，导致 Grafana 服务器磁盘空间被耗尽，从而触发拒绝服务攻击。该漏洞影响 Grafana 2.x 至 6.x 全部版本，攻击者无需任何凭据即可利用此缺陷，在服务器上执行未授权操作，影响仪表板创建、用户管理等依赖数据库的常规功能。Grafana 已在 6.3.4 版本中修复此问题。"
published = "2019-09-03T12:15:10.933"
remediation = "将 Grafana 升级至 6.3.4 或更高版本以修复此漏洞。若暂时无法升级，可在 grafana.ini 配置文件中设置 [auth.anonymous] enabled = false 以禁用匿名用户访问，或在反向代理层面对 /api/ 路径实施访问控制，仅允许授权 IP 访问 Grafana HTTP API，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Grafana HTTP API 拒绝服务漏洞"
updated = "2026-06-17T02:19:35.723"

