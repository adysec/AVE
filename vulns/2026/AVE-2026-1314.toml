[basic]
description = "Quest NetVault Backup 产品的 NVBURemovableMedia JSON-RPC 接口存在 SQL 注入漏洞。该漏洞源于在处理用户提供的字符串时缺乏适当的输入验证，攻击者可通过构造特制的 JSON-RPC 消息将恶意 SQL 代码注入查询语句中。尽管该漏洞需要身份认证才能利用，但现有认证机制可被绕过，导致未经授权的攻击者也能成功触发漏洞。成功利用后，攻击者可以在 NETWORK SERVICE 的权限上下文内执行任意代码，从而完全控制受影响的备份服务器，造成严重的数据泄露和服务中断风险。该漏洞由 Zero Day Initiative（ZDI-26-372）发现并报告，CVSS v3 评分为 8.8，危害等级为高。"
published = "2026-06-25T00:17:48Z"
remediation = "建议立即将 Quest NetVault Backup 升级至 14.0.2 或更高版本，以修复 NVBURemovableMedia JSON-RPC 接口的 SQL 注入漏洞。升级前请备份当前配置与数据，并在 /tmp 目录放置已下载的 .dlv 新版许可证文件，安装后在 WebUI 的 License Management 页面完成授权。如暂无法立即升级，应在防火墙或网络边界限制对 NetVault Web UI 及 JSON-RPC 端口的访问，仅允许可信管理网段连接，以降低远程代码执行风险。"
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "Quest NetVault Backup NVBURemovableMedia SQL注入远程代码执行漏洞"
updated = "2026-06-26T05:16:32Z"

