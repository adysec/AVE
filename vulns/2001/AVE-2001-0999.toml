[basic]
description = "CUPS（Common UNIX Printing System）1.1.5 版本的 httpGets 函数存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标系统的 CUPS Web 管理接口发送超长输入行触发该溢出，从而在服务器上执行任意操作系统命令。该漏洞影响运行 CUPS 1.1.5 的各类 UNIX 及 Linux 系统，由于 CUPS 是多数 Linux 发行版默认的打印系统，受影响面较广。攻击者成功利用后可完全控制目标主机，包括窃取敏感数据、安装后门或进一步横向移动。"
published = "2001-05-03T04:00:00Z"
remediation = "升级 CUPS 到 1.1.6 或更高版本（例如 1.1.7 或 1.1.8），并确保系统已应用 Debian DSA-036 或相应的安全补丁。如无法立即应用补丁，可在防火墙中暂时阻止对打印服务端口（例如 631/tcp）的外部访问，作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Apple CUPS 远程代码执行漏洞"
updated = "2026-06-16T21:53:51Z"

