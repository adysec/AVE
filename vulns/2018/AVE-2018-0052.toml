[basic]
description = "Monstra CMS 3.0.4 及更早版本的 index.php 存在反射型跨站脚本（XSS）漏洞，攻击者可通过构造包含恶意 JavaScript 代码的 URL 参数诱导受害者点击，受害者访问后脚本在其浏览器上下文中执行，可窃取会话 Cookie、执行敏感操作或重定向至钓鱼页面。该漏洞影响 Monstra CMS 3.0.4 及更早版本，CVSS 3.0 评分 6.1（中危），攻击向量为网络、攻击复杂度低、无需权限但需用户交互、范围扩大、机密性和完整性影响低、可用性无影响。攻击者需诱导用户点击恶意链接，利用方式为构造包含 XSS 载荷的 URL 诱导受害者访问。官方已在后续版本中修复，建议升级至最新版本。"
published = "2019-07-03T16:15:09Z"
remediation = "升级到 Monstra CMS 4.1.5 或更高版本以获取安全更新（CVE-2018-11227 已修复），确保所有用户输入经过 properly html_encode 转义，在前端使用 Content Security Policy 头部限制脚本执行，仅允许自有域名，在配置文件中禁用危险的 PHP 开关，并定期备份系统以防数据丢失。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Monstra CMS 跨站脚本漏洞"
updated = "2026-06-17T01:35:32Z"

