[basic]
description = 'Allaire JRun 3.0 存在路径遍历漏洞，未经身份认证的远程攻击者可通过构造包含特殊字符"."的畸形 URL 绕过目录访问限制，列出 WEB-INF 目录下的文件列表并读取 web.xml 配置文件。该漏洞影响 Allaire JRun 3.0 版本，攻击者无需凭据即可在网络可达的情况下发起利用，通过发送特制 HTTP 请求获取应用程序敏感配置信息（如 Servlet 映射、初始化参数、安全约束等），可能导致进一步的安全风险。攻击条件为目标服务器运行存在漏洞的 JRun 3.0 版本且网络可达。'
published = "2001-05-03T04:00:00Z"
remediation = "建议升级 Allaire JRun 到最新版本（JRun 3.1 或更高版本），或应用 Allaire 官方安全公告 ASB01-02 发布的补丁以修复 URL 解析缺陷。如无法立即升级，可在前端 Web 服务器（IIS 或 Apache）层面配置 URL 过滤规则，拒绝包含连续点号（.）或 URL 编码点号（%2e）的畸形请求；同时将 WEB-INF 目录移至 Web 根目录之外，或通过服务器配置禁止直接访问 WEB-INF 目录及其中的 web.xml 文件。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Allaire JRun 目录遍历信息泄露漏洞"
updated = "2026-06-16T21:53:49Z"

