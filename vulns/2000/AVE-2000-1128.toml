[basic]
description = 'tags.<value>FreeBSD 4.1.1 及更早版本中的 ppp 网络工具存在访问控制绕过漏洞。当系统使用 ppp 工具配置 NAT 并启用 "nat deny_incoming" 命令以限制外部网络主动入站连接时，ppp 未能正确执行该访问限制策略，导致远程攻击者可以绕过 NAT 入站过滤机制，直接向目标系统发起网络连接。该漏洞影响所有使用受影响版本 FreeBSD 并依赖 ppp 工具部署 NAT 防火墙规则的用户和网络环境。未经身份认证的远程攻击者无需任何凭据即可利用此漏洞，突破原本应被拒绝的入站连接限制，进而可能对内部网络服务进行进一步探测、端口扫描或直接攻击。CVSS 基础评分 7.5，攻击向量为网络、攻击复杂度低、无需身份验证即可利用，对机密性、完整性和可用性均造成部分影响。'
published = "2001-01-09T05:00:00Z"
remediation = "根据 FreeBSD-SA-00:70 安全公告，影响的 FreeBSD 版本为 3.5、3.5.1、4.1、4.1.1。建议将系统升级至 FreeBSD 4.2-RELEASE 或更高版本，或升级到 3.5.1-STABLE/4.1.1-STABLE 的 2000-10-30 之后版本。如无法立即升级，可下载官方补丁（ftp://ftp.freebsd.org/pub/FreeBSD/CERT/patches/SA-00:70/ppp.patch），执行 cd /usr/src/usr.sbin/ppp && patch -p < patch_file && make depend && make all install 并重新编译安装。临时缓解措施：在 PPP 网关上配置 ipfw(8) 或 ipf(8) 防火墙，拒绝所有未经授权的入站连接。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "FreeBSD ppp 未授权访问漏洞"
updated = "2026-06-16T21:53:18Z"

