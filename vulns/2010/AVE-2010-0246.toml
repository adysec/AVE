[basic]
description = "Apple QuickTime 在处理 Sorenson 编码影片文件时存在内存破坏漏洞，属于 CWE-119 内存操作不当问题。远程攻击者可构造特制的 Sorenson 影片文件，通过诱导用户打开恶意文件触发内存损坏，导致应用程序崩溃或任意代码执行。该漏洞影响 Mac OS X 10.6.x 至 10.6.5 及 QuickTime 7.6.9 之前版本，攻击复杂度较高，需用户交互配合。Apple 已在 2010 年 11 月发布的 Mac OS X 10.6.5 安全更新中修复此漏洞。"
published = "2010-11-16T22:00:16Z"
remediation = "升级 QuickTime 至 7.6.9 或更高版本，同时将 Mac OS X 升级至 10.6.5 或更高版本。无法立即升级时，避免在浏览器中打开来源不明的 Sorenson 编码媒体文件，并禁用 QuickTime 浏览器插件作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple QuickTime Sorenson 编码影片文件内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:23:32Z"

