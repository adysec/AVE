[basic]
description = "websocket-driver 是一个 WebSocket 协议处理库，当通过 `WebSocket::Driver.server()` 方法在 TCP 服务器上实现 WebSocket 服务或作为 WebSocket 客户端使用时，攻击者可通过发送包含无休止 HTTP 头部的请求或响应，导致单条连接消耗无上限的内存，最终使接收进程因内存耗尽而崩溃。该漏洞属于 CWE-770 资源无限制分配，影响所有使用 websocket-driver 0.8.1 之前版本的应用，CVSS 评分 6.3，危害等级中危。攻击者无需身份认证即可远程触发，但需要一定的网络条件。官方已在 0.8.1 版本中将 HTTP 请求/响应行及头部总大小限制为 32KB 以修复此问题。"
published = "2026-07-17T20:17:26Z"
remediation = "立即将 websocket-driver Ruby gem 升级至 0.8.1 或更高版本，该版本将 HTTP 请求/响应行及头部总大小限制为 32KB，防止内存耗尽。如无法升级，可在反向代理层（如 Nginx）设置 client_header_buffer_size 和 large_client_header_buffers 限制传入头部大小作为临时缓解措施。"
score = 6.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Faye websocket-driver HTTP 头部解析内存耗尽漏洞"
updated = "2026-07-23T16:19:47Z"

