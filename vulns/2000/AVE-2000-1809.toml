[basic]
description = "Microsoft IIS 4.0 和 5.0 在处理 ASP 页面时存在会话 ID Cookie 标记漏洞。当用户在安全（HTTPS）与非安全（HTTP）会话之间切换时，IIS 会为两者发送相同的 Session ID Cookie，导致攻击者可通过拦截非安全会话中的 Cookie 来劫持用户的安全 Web 会话。攻击者利用该漏洞无需身份认证，可获取受害者在安全会话中的敏感信息或执行未授权操作。该漏洞影响 IIS 4.0 和 5.0 版本，CVSS 评分 7.5，危害等级高。"
published = "2000-12-19T05:00:00.000"
remediation = '安装 Microsoft 2000 年 10 月安全更新 (MS00-080) 修补 Session ID Cookie 标记漏洞，或升级至 Windows 2000 SP2 及以上版本。同时，在 IIS 管理器中为涉及敏感操作的虚拟目录启用"要求安全通道 (SSL)"，并配置 ASP 应用程序使用 Secure 属性标记 Session Cookie，确保 Cookie 仅通过 HTTPS 传输，防止在 HTTP 会话中泄露会话标识符。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft IIS Session ID Cookie 安全会话劫持漏洞"
updated = "2026-06-16T21:52:52.890"

