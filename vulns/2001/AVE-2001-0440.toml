[basic]
description = "Ipswitch WS_FTP Server 2.0/2.02 存在多个 FTP 命令缓冲区溢出漏洞。攻击者可通过匿名登录后向 DELE、MDTM、MLST、MKD、RMD、RNFR、RNTO、SIZE、STAT、XMKD、XRMD 等 11 个命令传递超长参数触发缓冲区溢出，导致远程代码执行。该漏洞影响 WS_FTP Server 2.02 及更早版本，无需身份认证即可利用，CVSS 评分 7.5，危害等级高。"
published = "2001-07-26T04:00:00Z"
remediation = "立即升级 WS_FTP Server 至 Progress 官方最新支持版本（当前为 WS_FTP Server 8.x），该漏洞已在后续版本中修复。旧版 2.0.2 已停止技术支持，无法通过补丁修复。如无法升级，在防火墙层面限制对 FTP 服务（端口 21）的匿名访问来源 IP，仅允许可信网络段连接，并禁用不必要的 FTP 命令（DELE、RNFR、MKD 等）以降低攻击面。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Ipswitch WS_FTP Server 多FTP命令缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:55:25Z"

