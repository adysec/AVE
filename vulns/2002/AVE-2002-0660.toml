[basic]
description = "Microsoft Internet Explorer 5.5 至 6.0 存在拒绝服务漏洞，攻击者可构造包含特定 CSS 样式规则（声明 p{cssText} 元素并设置粗体字体权重）的网页，诱使用户用浏览器访问后触发崩溃。未经身份认证的远程攻击者无需用户交互即可利用，导致 IE 无法正常工作。该漏洞影响早期版本 IE，利用方式简单且效果直接。"
published = "2002-12-31T05:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS02-070 所发布的 Internet Explorer 累积安全更新，或升级到 Internet Explorer 6 SP1 及以上版本。如暂无法安装补丁，建议临时更换为 Mozilla Firefox、Opera 等不受该漏洞影响的现代浏览器，并在组策略中禁用 CSS 解析作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer CSS 拒绝服务漏洞"
updated = "2026-06-16T21:59:48Z"

