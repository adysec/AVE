[basic]
description = "YzmCMS 3.6 版本中的 index.php 页面存在反射型跨站脚本漏洞（XSS），由于对 a、c、m 等参数缺乏有效的过滤与转义处理，攻击者可通过构造特制的 URL 并诱导已登录用户点击，在用户浏览器中执行恶意 JavaScript 脚本，导致敏感信息泄露或页面内容篡改。攻击无需身份认证，但需要用户交互，影响 YzmCMS 3.6 版本。"
published = "2018-03-04T19:29:00.213"
remediation = "升级 YzmCMS 至 3.7 及以上版本，该版本已修复 index.php 中 a、c、m 参数未过滤导致的 XSS 漏洞。如无法立即升级，在应用入口处对 `$_GET['a']`、`$_GET['c']`、`$_GET['m']` 三个参数做 HTML 实体编码过滤，禁止直接输出用户输入内容。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "YzmCMS 3.6 跨站脚本漏洞"
updated = "2026-06-17T02:03:29.113"

