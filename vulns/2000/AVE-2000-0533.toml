[basic]
description = "CVS 1.10.8 客户端存在路径名信任漏洞，CVS 服务器可向客户端发送特制的路径名信息，由于客户端未对服务器返回的路径名进行充分校验，攻击者可通过控制恶意 CVS 服务器诱导连接客户端在本地创建任意文件。该漏洞攻击条件要求用户主动连接恶意 CVS 服务器，影响 CVS 1.10.8 及之前版本，CVSS 评分 2.1，危害等级低。"
published = "2000-10-20T04:00:00Z"
remediation = "升级到 CVS 1.11 或更高版本以修复此漏洞。避免连接不可信的 CVS 服务器，对服务器返回的路径名进行严格校验。建议使用 SSH 隧道等加密通道连接 CVS 服务器，防止中间人攻击篡改路径名。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "CVS CVS Server 1.10.8 任意文件创建漏洞"
updated = "2026-06-16T21:52:15Z"

