[basic]
description = "WordPress Yuzo Related Posts 插件 5.12.94 版本存在跨站脚本漏洞。该插件错误地认为 `is_admin()` 函数能验证请求来自管理员用户，但实际上该函数仅验证请求是否指向管理页面。未经身份认证的远程攻击者可利用此缺陷，通过向插件设置参数（如 `yuzo_related_post_css_and_style`）注入恶意载荷，实现持久化 XSS 攻击。攻击者无需任何权限，仅需诱导管理员访问恶意构造的链接即可触发，导致在管理员浏览器中执行任意 JavaScript 代码，进而窃取会话 Cookie、篡改页面内容或执行其他恶意操作。"
published = "2019-05-09T23:29:00Z"
remediation = "立即升级WordPress Yuzo Related Posts插件至最新版本（高于5.12.94），该漏洞已在后续版本中修复了is_admin()验证逻辑缺陷。如无法立即升级，请暂时禁用该插件，并检查wp-admin后台是否有异常插件设置项，同时限制对/wp-admin目录的访问。Wordfence已确认该漏洞曾在野外被利用，建议尽快处理。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Yuzo Related Posts插件跨站脚本漏洞"
updated = "2026-06-17T02:13:46Z"

