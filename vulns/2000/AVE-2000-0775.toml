[basic]
description = "Netscape Directory Server 4.12 及 iPlanet Certificate Management System 4.2 存在目录遍历漏洞。由于服务器在处理 Agent、End Entity 和 Administrator 服务中的文件路径时未正确过滤 `..`（点点）序列，未经身份认证的远程攻击者可通过向受影响服务发送特制的包含 `../` 的 HTTP 请求，实现目录向上遍历，从而读取服务器上的任意文件。该漏洞可导致敏感信息泄露，包括配置文件、密码文件等，为后续攻击提供信息基础。攻击无需认证，仅需网络可达即可触发，危害较大。"
published = "2000-12-11T05:00:00.000"
remediation = "建议立即升级到 iPlanet 官方补丁版本（补丁编号 0122），该补丁可从原厂商归档站点获取。如无法升级，可在反向代理或 Web 应用防火墙（WAF）层面过滤包含 `..` 的 URL 请求路径，限制对 Agent、End Entity、Administrator 服务的未授权访问，并禁用不必要的目录列表功能。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Netscape iPlanet Directory Server 4.12 目录遍历漏洞"
updated = "2026-06-16T21:53:05.947"

