[basic]
description = "OpenBSD yp_passwd 程序存在格式字符串漏洞，由于程序在处理用户输入时未正确过滤格式字符串参数，本地攻击者可通过向 yp_passwd 程序提交特制的畸形名称参数触发格式字符串漏洞，从而获取 root 权限。该漏洞影响 OpenBSD 及其他基于 BSD 的操作系统，CVSS 评分 7.2，危害等级高，攻击者需要本地访问权限但无需认证即可利用。"
published = "2000-12-19T05:00:00Z"
remediation = "立即应用 OpenBSD 2.7 补丁 028_format_strings.patch（下载地址 ftp://ftp.openbsd.org/pub/OpenBSD/patches/2.7/common/028_format_strings.patch），以 root 执行 `patch -p0 < 028_format_strings.patch` 后重新编译内核及受影响的程序。如无法打补丁，可临时移除 yp_passwd 的 setuid 权限：`chmod u-s /usr/bin/yp_passwd`。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "OpenBSD yp_passwd 格式字符串漏洞"
updated = "2026-06-16T21:52:56Z"

