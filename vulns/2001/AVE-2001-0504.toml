[basic]
description = 'iptables 1.2.4 之前版本中的 iptables-save 工具存在信息泄露漏洞。当管理员配置 "--reject-with icmp-host-prohibited" 拒绝规则时，iptables-save 会错误地将其记录为 "--reject-with tcp-reset"，导致 iptables 实际生成的响应与管理员预期不符。攻击者可通过观察目标系统对不同端口的响应差异，推断出防火墙规则的存在与配置细节，从而获取网络拓扑和访问控制策略等敏感信息。该漏洞需要本地访问权限，CVSS 评分 2.1，危害等级低。'
published = "2001-11-05T05:00:00Z"
remediation = "升级 iptables 至 1.2.4 或更高版本，该版本已修复 iptables-save 规则记录错误问题。如无法升级，请手动检查并修正 iptables 规则集中所有 `--reject-with` 参数，确保 `icmp-host-prohibited` 规则未被错误保存为 `tcp-reset`，并在保存规则后使用 `iptables -L -n` 验证规则完整性。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Netfilter iptables 信息泄露漏洞"
updated = "2026-06-16T21:56:10Z"

