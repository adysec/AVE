[basic]
description = "Microsoft SQL Server 2000 的 Jet 引擎 OpenDataSource 函数存在 Unicode 缓冲区溢出漏洞。远程攻击者可通过向目标数据库服务器发送特制的 Unicode 字符串参数触发该漏洞，导致缓冲区溢出，从而在系统上下文中执行任意代码。该漏洞影响 Microsoft SQL Server 2000 及 Microsoft Jet 4.0 数据库引擎，CVSS 评分 7.5，危害等级高。攻击者无需身份认证即可远程利用，成功利用后可完全控制受影响系统。"
published = "2002-09-05T04:00:00Z"
remediation = "安装微软安全公告 MS02-035 提供的 Jet 4.0 数据库引擎更新（KB Q282010），该补丁修复了 OpenDataSource 函数中的 Unicode 缓冲区溢出漏洞。由于 Microsoft SQL Server 2000 和 Jet 4.0 均已停止支持，建议升级至受支持的 SQL Server 版本（如 2019/2022）。临时缓解措施：在网络防火墙限制对 SQL Server 1433 端口的访问，仅允许受信任主机连接；在 SQL Server 中禁用 OPENROWSET 和 OpenDataSource 函数，或撤销 PUBLIC 角色对临时分布式查询的权限。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft SQL Server 2000 Jet 引擎 OpenDataSource 缓冲区溢出漏洞"
updated = "2026-06-16T21:58:16Z"

