[basic]
description = "HP AdvanceStack 交换机中的 Web 配置工具存在身份认证绕过漏洞。该漏洞影响 J3200A 至 J3210A 型号的交换机，尤其是运行固件版本 A.03.07 及更早版本的设备。攻击者无需任何身份验证，只需发送一个直接的 HTTP 请求到 web_access.html 文件即可绕过身份认证机制，从而完全控制交换机的配置，包括修改管理员密码和执行其他配置变更。此漏洞的攻击复杂度低，攻击面广，可通过网络远程利用，可能导致对交换机配置的完全未经授权的修改，危及网络设备的安全性和稳定性。"
published = "2002-05-29T04:00:00Z"
remediation = "升级 HP AdvanceStack 交换机固件到支持安全补丁的最新版本，移除 web_access.html 文件并重新设计认证机制，为管理界面启用强密码策略和多因素认证，通过防火墙限制对管理端口的访问，并定期检查系统日志以检测异常认证尝试。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "HP AdvanceStack 交换机身份认证绕过漏洞"
updated = "2026-06-16T21:57:04Z"

