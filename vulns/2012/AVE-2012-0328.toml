[basic]
description = "Apple iTunes 中的 WebKit 组件存在内存破坏漏洞，未经身份认证的远程攻击者可通过诱使用户访问特制的恶意网站触发该漏洞，导致内存越界访问和应用程序崩溃，进而可能执行任意代码。该漏洞影响 iTunes 10.7 之前的所有版本，CVSS 评分为 6.8，危害等级中等。用户访问恶意网页即可触发攻击，无需额外交互权限。"
published = "2012-09-13T10:30:19.730"
remediation = "建议立即将 Apple iTunes 升级至 10.7 或更高版本，或将 iOS 升级至 6.0 及以上版本。Safari 用户应升级至 Safari 6.0.1。Apple 已通过 APPLE-SA-2012-09-12-1 发布安全更新，请通过 Mac App Store 或 Apple 官方更新渠道安装。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:39.620"

