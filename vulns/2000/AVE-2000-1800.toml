[basic]
description = "HiNet LP5100 IP-Phone 的 Web 管理服务存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向目标设备发送超长 GET 请求触发该漏洞，导致设备拒绝服务，甚至可能执行任意命令。该漏洞 CVSS 评分为 10.0，危害等级为严重，攻击复杂度低，且无需任何权限即可利用，对机密性、完整性和可用性均造成完全影响。"
published = "2000-12-19T05:00:00.000"
remediation = "该设备（HiNet LP5100 IP-Phone）已停产且厂商不再提供安全更新，建议立即将设备从生产网络隔离或替换为受支持的替代产品。如无法替换，须在防火墙层面限制对 Web 管理端口（默认 80）的访问，仅允许受信任的管理 IP 连接，并禁用不必要的远程管理功能。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "HiNet LP5100 IP-Phone Web管理服务缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:52.117"

