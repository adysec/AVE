[basic]
description = "BeOS R5 Pro 及更早版本中使用的 Felix IRC 客户端存在拒绝服务漏洞。远程攻击者可通过向目标用户发送包含超长 URL 的消息触发该漏洞，导致 Felix IRC 客户端崩溃或停止响应，无法正常提供 IRC 聊天服务。攻击者无需身份认证即可利用此漏洞，攻击条件简单，只需构造一条特制消息发送给受害者即可。该漏洞影响 Xavier Ducrohet Felix 2.3 及更早版本，CVSS 评分 5.0，危害等级中危。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 Felix IRC 客户端至 2.3 以上版本（如仍在使用 BeOS 系统）；由于 BeOS 已停止维护，建议迁移至 Haiku OS 并使用其自带或更新的 IRC 客户端。临时缓解措施可在 Felix 客户端配置中限制单条消息 URL 长度不超过 1024 字节，或改用其他 IRC 客户端（如 IRCle）。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Xavier Ducrohet Felix 2.3 IRC 客户端长 URL 拒绝服务漏洞"
updated = "2026-06-16T21:53:15Z"

