[basic]
description = 'id Software Quake II Server 3.20 及 3.21 版本中存在信息泄漏漏洞。远程攻击者可通过发送包含未展开的"$"宏变量的客户端命令（如 `say $rcon_password`）触发该漏洞，导致服务器端展开宏变量并将敏感信息（包括服务器 cvar 变量、目录列表及 rcon 管理员密码）回显给攻击者，进而可获取服务器控制权限。攻击无需身份认证，危害较大。'
published = "2002-08-12T04:00:00Z"
remediation = "升级至 Quake 2 服务器 3.22 或更高版本（该版本修复了 $ 宏展开导致的信息泄漏问题）。如无法升级，可在 server.cfg 中设置 `set allow_expand_macros 0` 禁用宏展开功能，并避免在公开服务器上使用 rcon_password 或使用强密码并限制 RCON 来源 IP。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "id Software Quake II Server 远程信息泄漏漏洞"
updated = "2026-06-16T21:58:06Z"

