[basic]
description = "Apache HTTP Server 2.0.40 至 2.0.45 版本在 Unix 系统上的认证模块存在线程安全漏洞。当使用 threaded MPM（多线程处理模块）时，crypt_r 或 crypt 函数未正确处理线程同步，导致远程攻击者可发送特制的认证请求触发条件竞争，使得合法用户名和密码的基础认证（Basic Authentication）失败，造成拒绝服务。该漏洞影响 Apache 2.0.40-2.0.45 版本，攻击者无需认证即可远程触发，危害等级中危。"
published = "2003-06-09T04:00:00.000"
remediation = "立即将 Apache HTTP Server 升级至 2.0.46 或更高版本（2.0 系列最终版为 2.0.65，建议直接升级至 2.4.x 系列最新版）。如无法升级，在 httpd.conf 中将 MPM 切换为 prefork（`ServerLimit 256; StartServers 5; MaxClients 256`），避免使用 worker 或 event 等线程化 MPM 以消除线程竞争条件。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Apache HTTP Server 认证模块拒绝服务漏洞"
updated = "2026-06-16T22:01:43.140"

