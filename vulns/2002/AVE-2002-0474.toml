[basic]
description = "CGIScript.net csNews 1.0 的 csNews.cgi 存在双重 URL 编码绕过漏洞。由于程序对用户输入的 URL 参数仅做单次解码校验，攻击者可利用双重 URL 编码（如将 `.` 编码为 `%2e` 再编码为 `%252e`）绕过访问控制。未经身份验证的远程攻击者可通过构造特制的 URL 请求直接访问 `default%2edb` 或 `default%2edb.style` 等数据库文件，导致敏感信息泄露；已认证用户还可通过将 database 参数设置为 `default%2edb` 执行管理操作。该漏洞影响 CGIScript.net csNews 1.0 版本，CVSS 评分 5.0，危害等级中危。"
published = "2002-10-04T04:00:00.000"
remediation = "立即停止使用 csNews 1.0，该软件已停止维护多年。建议迁移至现代新闻管理系统（如 WordPress 或 Joomla）。如无法立即替换，可采取以下临时缓解措施：在 Web 服务器（Apache/Nginx）配置中禁止对 csNews.cgi 的 `database` 参数传递包含 `%2e` 的请求，添加重写规则拦截 `command=manage` 或 `command=showadv` 等管理操作；同时将 csNews.cgi 文件权限设置为 750，仅允许 Web 服务器运行用户执行，禁止外部直接访问数据库文件（`*.db`）。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "CGIScript.net csNews 双重URL编码未授权管理访问漏洞"
