[basic]
description = "Skipper 路由服务 routesrv 组件的所有 API 端点缺乏身份认证机制，将完整的集群路由拓扑（Ingress/RouteGroup 配置、后端 URL、过滤器链、OAuth/OIDC 回调路径）以及缓存集群拓扑（Redis/Valkey 分片地址）通过明文 HTTP 暴露。攻击者只需在 Kubernetes 集群中攻陷任意 Pod（通过应用漏洞、供应链攻击或恶意容器镜像），即可通过 routesrv 的可预测 DNS 名称直接访问 `/routes`、`/swarm/redis/shards` 等端点，获取跨命名空间的集群级敏感数据，进而实施缓存层攻击（限流数据篡改、会话数据窃取）。该漏洞本质上是控制平面数据泄露，影响机密性，CVSS 评分 6.5，危害等级中等。"
published = "2026-01-01T00:00:00Z"
remediation = "立即为 routesrv 组件添加认证机制，在启动参数中通过 `-route-server-filters` 配置 bearer token 或 mTLS 认证过滤器；同时部署 Kubernetes NetworkPolicy 限制仅数据面 skipper Pod 可访问 routesrv（端口 9090），拒绝所有其他来源的入站流量；如使用 Redis/Valkey 缓存集群，应启用密码认证并限制 routesrv 所在节点的网络访问范围。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Zalando Skipper routesrv 组件未授权访问漏洞"
updated = "2026-01-01T00:00:00Z"

