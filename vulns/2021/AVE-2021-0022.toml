[basic]
description = "Cisco HyperFlex HX 数据平台的管理界面存在多个命令注入漏洞。未经身份认证的远程攻击者可通过向 Web 管理界面发送特制的 HTTP 请求，在目标设备的操作系统中执行任意系统命令。该漏洞影响 Cisco HyperFlex HX 系列产品，攻击者可利用此漏洞获取设备的完全控制权，进而窃取数据或进一步渗透内部网络。CVSS 评分 9.8，危害等级严重。"
published = "2021-05-06T13:15:10.500"
remediation = "立即升级 Cisco HyperFlex HX 软件至以下修复版本：4.0(2e) 或 4.5(2a)。若当前版本低于 4.0，需先迁移至 4.0(2e)。Cisco 官方未提供临时缓解措施，无可用变通方案。升级前请确认设备内存充足且硬件配置受新版本支持，升级过程需遵循 Cisco 软件许可协议。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "cisco hyperflex_hx_data_platform os命令中使用的特殊元素转义处理不恰当（os命令注入） 漏洞"
updated = "2026-06-17T03:31:54.773"

