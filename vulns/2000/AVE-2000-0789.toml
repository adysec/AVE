[basic]
description = "Novell BorderManager 中的 ClientTrust 组件存在身份验证来源验证缺陷，远程攻击者可通过监听目标受害主机 3024 端口的认证请求与响应流量，重放捕获到的认证数据包来冒充合法用户身份，从而获取未授权访问权限。该漏洞影响 Novell BorderManager 多个版本，CVSS 评分 7.5，危害等级高。厂商已发布安全更新修复此漏洞。"
published = "2000-07-07T04:00:00.000"
remediation = "Novell BorderManager 已停止维护，建议立即迁移至受支持的替代产品（如 Micro Focus 后续安全网关方案）。作为临时缓解措施，在防火墙上限制对 TCP 3024 端口的访问，仅允许受信任 IP 连接，并启用认证请求来源校验机制。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Novell BorderManager ClientTrust 认证请求重放用户冒充漏洞"
updated = "2026-06-16T21:52:11.513"

