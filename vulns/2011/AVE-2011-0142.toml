[basic]
description = "Google Chrome 浏览器在处理自定义字体时存在使用后释放漏洞。攻击者可通过向目标系统发送包含恶意结构的特殊自定义字体数据包，利用此漏洞触发内存管理器的瑕疵，导致核心处理程序尝试使用已被释放的内存，从而引发系统崩溃或可能实现远程代码执行。该漏洞影响 Chrome 13.0.782.215 之前的版本，攻击者无需身份验证即可远程利用，CVSS 评分高达 9.3，危及程度极高。 Microsoft 及苹果公司已发布补丁修复此漏洞，用户需及时更新浏览器版本以获取保护。"
published = "2011-08-29T15:55:01Z"
remediation = "升级 Google Chrome 至 13.0.782.215 或更高版本，通过浏览器菜单「帮助」→「关于 Google Chrome」触发自动更新。若无法立即升级，可暂时禁用自定义字体加载功能作为缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Google Chrome 使用后释放漏洞"
updated = "2026-06-16T23:32:04Z"

