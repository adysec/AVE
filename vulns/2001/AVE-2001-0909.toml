[basic]
description = "标签之间。<value>Caldera Linux 的 DHCP 服务器和客户端在错误日志记录代码中存在格式字符串漏洞。远程攻击者无需身份认证，即可通过向目标系统发送特制的 DHCP 数据包触发该漏洞，进而在系统中执行任意命令。该漏洞影响 openlinux_desktop、openlinux_edesktop 和 openlinux_eserver 等多个版本，CVSS 评分满分 10.0，危害等级极为严重。"
published = "2001-03-26T05:00:00Z"
remediation = "升级至 Caldera OpenLinux 的最新安全补丁版本，或将 DHCP 服务迁移至经过安全加固的 ISC DHCP 等现代替代方案。若无法立即更新，应在防火墙层面限制 UDP 67 和 68 端口的入站流量，仅允许受信任的内网段进行通信以降低远程攻击风险。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Caldera OpenLinux DHCP 服务端及客户端格式字符串远程代码执行漏洞"
updated = "2026-06-16T21:53:49Z"

