[basic]
description = "Windows UPnP 设备主机服务（upnphost.dll）存在未受控资源消耗漏洞（CWE-400），未经身份认证的远程攻击者可向目标系统发送特制的 UPnP 网络请求触发该漏洞，导致目标系统服务耗尽系统资源而拒绝服务。该漏洞影响多个 Windows 版本，CVSS 评分 7.5，危害等级高。攻击无需用户交互，攻击复杂度低。Microsoft 已在 2025 年 1 月安全更新（5050061）中修复此漏洞。"
published = "2025-01-14T18:15:52Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 (KB5050061)，该补丁修复了 Windows UPnP Device Host 组件的拒绝服务漏洞。可通过 Windows Update 自动更新或从 Microsoft Update Catalog 手动下载安装。如无法立即打补丁，可在防火墙层面限制外部网络对目标主机 1900/UDP (SSDP) 端口的访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows UPnP Device Host 拒绝服务漏洞"
updated = "2026-06-17T08:43:02Z"

