[basic]
description = "CVE-2000-0721是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2000-10-20T04:00:00Z"
remediation = "立即执行 chmod o-w /usr/bin/FSserial /usr/bin/FlagShip_c /usr/bin/FlagShip_p 移除世界可写权限，并使用 rpm -Vf 或 debsums 验证 FlagShip 软件包中所有文件的完整性与权限是否正确。如无法获取厂商更新版本，应将 /usr/bin/ 下的这些二进制文件权限收紧为 755 并重新赋值属主为 root，同时审计系统上是否存在被替换为木马的同名文件。"
score = 6.2
severity = "MEDIUM"
sources = ["avd"]
title = "Multisoft FlagShip 4.4 本地权限提升漏洞"
