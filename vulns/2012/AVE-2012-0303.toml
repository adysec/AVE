[basic]
description = "WebKit 引擎作为 Apple Safari 浏览器核心组件，在 6.0 之前版本中存在内存破坏漏洞。远程攻击者可构造恶意网站，当用户使用受影响版本的 Safari 浏览器访问该网站时，将触发 WebKit 内存处理过程中的缓冲区溢出，导致任意代码执行或应用程序崩溃。该漏洞影响 macOS 和 iOS 平台上的 Safari 浏览器，攻击者可通过诱导用户点击链接或访问恶意页面实现远程利用，最终完全控制受影响系统。Apple 已在 2012 年 7 月发布 Safari 6.0 安全更新修复此漏洞。"
published = "2012-07-25T20:55:03Z"
remediation = "升级到 Safari 6.0 或更高版本（随 OS X Lion v10.7.4 提供），Mac 用户可通过 Mac App Store 或软件更新自动安装；iOS 用户请升级至 iOS 6.0 或更高版本。如无法立即升级，可临时改用其他浏览器访问不可信网站，并在 Safari 偏好设置中禁用 JavaScript 执行作为缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:36Z"

