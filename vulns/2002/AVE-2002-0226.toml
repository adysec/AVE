[basic]
description = "Hanterm 3.3.1 及更早版本存在缓冲区溢出漏洞，攻击者可通过向目标系统发送包含超长字符串的特定命令参数（如 -fn、-hfb 或 -hfn 参数）触发漏洞。漏洞利用引发堆内存溢出，导致程序控制流被篡改，攻击者得以劫持控制权并执行任意代码。受影响用户包括所有使用汉化终端模拟器的 Windows 用户，攻击条件为本地执行触发，攻击者需精心构造超出程序缓冲区长度的输入。该漏洞影响 Windows 平台下的 Hanterm 终端模拟器，攻击者可利用本地权限获得系统完全控制权，破坏系统完整性、机密性和可用性。攻击者仅需向程序提交经过精心构造的长字符串参数即可触发漏洞，无需身份验证，环境复杂度较低，漏洞利用相对直接。"
published = "2002-05-29T04:00:00Z"
remediation = "建议立即升级 hanterm 至 3.3.2 或更高版本（如已停止维护，建议迁移至 rxvt-unicode、xterm 或 konsole 等现代终端模拟器）；若暂时无法升级，请限制本地用户对 hanterm 二进制文件的执行权限（chmod 750 /usr/bin/hanterm 并限制所属组），或通过 SELinux/AppArmor 策略限制 hanterm 仅以受限上下文运行，禁止本地非特权用户传递超长 -fn/-hfb/-hfn 参数。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Hanterm Hanterm 3.3 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:57:03Z"

