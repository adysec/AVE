[info]
author = "ave"
description = "通过创建符号链接指向目标文件，诱使 ml85p 将临时文件写入攻击者控制的路径，实现任意文件覆盖。验证方式：创建临时文件路径的符号链接指向 /tmp/ave-poc-test，运行 ml85p 后检查目标文件是否被写入。"
id = "POC-AVE-2001-0476"
name = "Samsung ML-85G 打印机驱动不安全临时文件创建漏洞 PoC"
severity = "medium"
tags = [
    "cve-2001-1177",
    "samsung",
    "ml85p",
    "symlink",
    "local",
]
vuln_id = [
    "CVE-2001-1177",
    "AVE-2001-0476",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/tmp/ml85p-ave-poc-test"
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["ml85p"]
