[basic]
description = "suidperl 5.6.1 及更早版本中存在多个安全漏洞，本地用户可利用这些漏洞获取其没有适当权限访问的文件的敏感信息。suidperl 作为 Perl 脚本以 setuid 权限运行的包装程序，在处理文件访问和环境变量时存在安全缺陷，攻击者无需任何认证即可利用这些缺陷读取系统敏感文件内容，造成信息泄露。该漏洞影响使用 suidperl 的多种 Linux/Unix 发行版，包括 Debian 等，CVSS v2 评分为 2.1，危害等级为低。Debian 已在 DSA-431 安全公告中发布修复补丁，Red Hat 亦在 Bugzilla #114923 中跟踪此问题。"
published = "2004-05-04T04:00:00Z"
remediation = "立即升级系统 Perl 包至安全版本：Debian/Ubuntu 用户执行 apt-get install --only-upgrade perl（升级后 suidperl 版本应不低于 5.6.1-8.6 或 5.8.7-10ubuntu1）；Red Hat/CentOS 用户执行 yum update perl（该漏洞不影响 RHEL 4 及后续版本）。如无法立即升级，可执行 chmod u-s /usr/bin/suidperl 移除 suidperl 的 SUID 权限位作为临时缓解措施，并限制本地用户对 perl 脚本的 setuid 执行权限。升级完成后重启相关服务并验证 suidperl 版本已更新。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Perl suidperl 信息泄露漏洞"
updated = "2026-06-16T22:02:31Z"

