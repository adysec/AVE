[basic]
description = "GLib（GNOME 库）的 GVariant 解析器在处理特制恶意输入字符串时存在缓冲区下溢漏洞（CWE-190 整数溢出），远程攻击者无需认证，通过向受影响应用发送构造的数据即可触发堆内存损坏。该漏洞可导致拒绝服务或潜在代码执行，攻击复杂度较高但无需用户交互，影响所有使用 GLib 库处理 GVariant 数据的 Linux 应用及发行版。"
published = "2025-12-10T09:15:47Z"
remediation = "立即将 GLib 升级至 2.86.3 或更高版本（该版本通过将循环索引由 gint 改为 size_t 修复了 GVariant 解析器中 bytestring_parse/string_parse 的整数溢出导致堆缓冲区下溢的问题）。RHEL 用户请安装对应的 RHSA 安全更新（如 RHSA-2026:7461 等）。如无法立即升级，避免解析来自不可信来源的超长 GVariant 文本格式数据作为临时缓解措施。"
score = 5.6
severity = "MEDIUM"
sources = ["msrc"]
title = "GNOME GLib GVariant解析器缓冲区下溢导致堆损坏漏洞"
updated = "2026-07-13T22:16:44Z"

