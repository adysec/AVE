[basic]
description = "Google Chrome 浏览器 143.0.7499.41 之前的 DevTools（开发者工具）中存在实现不当的漏洞。该漏洞允许攻击者通过诱导用户安装特制的恶意扩展程序，利用 DevTools 的缺陷实现沙箱逃逸（Sandbox Escape）。攻击者在用户安装恶意扩展的条件下，可通过精心构建的扩展功能绕过浏览器安全隔离机制，从而在目标系统上执行潜在的非法操作或获取更高权限。该漏洞影响所有运行受影响版本的 Chromium 浏览器用户，危害等级为高。"
published = "2025-12-02T19:15:47Z"
remediation = "建议立即将 Google Chrome 浏览器升级至 143.0.7499.41 或更高版本。对于使用 Chromium 的用户，请更新至 chromium-143.0.7499.146 及以上版本。在更新完成前，建议用户谨慎安装来源不明的浏览器扩展程序，以防止攻击者通过恶意扩展诱导触发沙箱逃逸。"
score = 5.4
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome DevTools 沙箱逃逸漏洞"
updated = "2026-06-17T08:34:28Z"

