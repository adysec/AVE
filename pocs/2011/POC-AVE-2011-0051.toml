[basic]
description = "Adobe Flash Player在处理特定SWF文件时存在边界检查漏洞，攻击者可通过构造恶意SWF文件，在用户浏览器中触发堆缓冲区溢出，进而实现远程代码执行。该漏洞无需用户交互即可触发（仅需访问恶意页面），影响范围广泛。"
published = "2011-05-13"
remediation = "升级Adobe Flash Player至10.3.181.14及以上版本（桌面平台）或10.3.185.21及以上版本（Android）。Adobe已于2011年5月发布安全公告APSB11-12提供修复补丁，建议用户立即更新。"
score = 9.3
severity = "CRITICAL"
sources = ["cve"]
title = "Adobe Flash Player 边界检查远程代码执行漏洞"
updated = "2011-05-13"

