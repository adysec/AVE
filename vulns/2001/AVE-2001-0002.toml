[basic]
description = "SSH-1 协议存在中间人攻击漏洞，远程攻击者可创建与目标服务器相同的会话 ID，但使用弱公钥对替代目标服务器的强公钥，从而计算出对应的私钥，利用被攻陷的密钥对伪装成目标服务器，实现对客户端质询响应的重放攻击。该漏洞影响所有使用 SSH-1 协议的服务端与客户端，攻击者需处于客户端与服务器之间的网络路径上，无需认证即可实施攻击，可导致敏感信息泄露、会话劫持等严重后果。"
published = "2001-01-18T05:00:00Z"
remediation = "禁用 SSH-1 协议，升级至仅支持 SSH-2 的 OpenSSH 版本（如 OpenSSH 3.0+），在 sshd_config 中设置 Protocol 2 并重启 sshd 服务。对于无法升级的旧系统，在服务器和客户端两端均配置只接受 SSH-2 连接。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "SSH SSH-1协议中间人攻击漏洞"
updated = "2026-06-16T21:56:20Z"

