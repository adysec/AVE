[basic]
description = "BSDi 3.0 和 4.0 系统中的 rcvtty 工具在执行脚本前未正确丢弃特权权限，存在本地权限提升漏洞。本地攻击者可通过在命令行指定特洛伊木马脚本，利用该漏洞获取系统最高权限。攻击条件为拥有本地系统访问权限，无需身份认证即可触发。该漏洞影响 BSDi 3.0 及 4.0 版本，CVSS 评分 7.2，危害等级高。"
published = "2001-01-09T05:00:00.000"
remediation = "升级到 BSDi 3.1 或更高版本以修复 rcvtty 未正确降权执行脚本的问题。如无法升级，可临时移除 rcvtty 的 setuid 位（chmod u-s /usr/bin/rcvtty），并限制本地用户仅限受信任人员访问系统。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "BSDi BSD/OS rcvtty 本地权限提升漏洞"
updated = "2026-06-16T21:53:09.207"

