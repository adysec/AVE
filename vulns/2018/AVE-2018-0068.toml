[basic]
description = "希捷 NAS OS 版本 4.3.15.1 中的 /api/external/7.0/system.System.get_infos 接口存在访问控制不当漏洞，未经身份认证的远程攻击者可通过发送空的 POST 请求直接调用该接口，获取 NAS 设备的敏感系统信息。该漏洞源于 API 端点未正确验证用户权限，导致匿名用户可访问本应受保护的系统信息。CVSS 评分 7.5，属于高危漏洞，影响使用受影响版本 NAS OS 的希捷存储设备。"
published = "2019-05-13T13:29:00Z"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "希捷 NAS OS 访问控制不当导致信息泄露漏洞"
updated = "2026-06-17T01:37:30Z"

