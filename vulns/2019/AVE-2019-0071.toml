[basic]
description = "Alfresco Community Edition 5.2.6 以下版本、6.0.N 及 6.1.N 系列版本中，Alfresco Share 应用存在开放重定向漏洞（CWE-601）。攻击者可通过构造特制的 POST 请求，操纵请求参数将受害者重定向至任意恶意网站（支持 http、https、ftp、smb 等协议），从而实施钓鱼攻击。该漏洞无需身份认证，但需要用户交互（点击恶意链接），CVSS 评分 6.1，危害等级中危。官方已在后续版本中修复此漏洞。"
published = "2019-09-06T17:15:11Z"
remediation = "升级 Alfresco Community Edition 至 5.2.6 及以上版本，或升级至 6.2.x 及更高版本。如无法立即升级，可在反向代理或 WAF 层对 `/share/page/dologin` 的 `failure` 和 `success` 参数进行白名单校验，仅允许内部合法重定向目标 URL，阻止任意协议的外部跳转。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Alfresco Community Edition Share 开放重定向漏洞"
updated = "2026-06-17T02:17:58Z"

