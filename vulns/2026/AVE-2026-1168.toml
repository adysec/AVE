[basic]
description = "Windows Win32K 内核模式用户界面子系统存在访问控制不当漏洞。攻击者利用该漏洞可绕过权限检查，在本地系统上以更高权限执行代码，从而将权限提升至 SYSTEM 级别。该漏洞影响 Windows 10（1607/1809/21H2/22H2）、Windows 11（24H2/25H2/26H1）以及 Windows Server 2012/2012 R2/2016/2019/2022/2025 等多个版本。攻击者需已获取目标系统本地登录权限，通过构造特制的应用程序或利用 Win32k.sys 驱动程序中的权限验证缺陷，触发内核态权限提升。Microsoft 已在 2026 年 7 月安全更新中修复此漏洞。"
published = "2026-07-14T17:16:58.137"
remediation = "立即将系统升级至以下修复版本：Windows 10 22H2 升级到 10.0.19045.7548 及以上，Windows 11 24H2 升级到 10.0.26100.8875 及以上，Windows Server 2022 升级到 10.0.20348.5386 及以上。通过 Windows Update 或 Microsoft Update Catalog 手动下载并安装 2026 年 7 月安全更新。临时缓解措施：在注册表中禁用 Win32k 子系统或通过组策略限制本地登录权限，阻断低权限用户利用此漏洞提权。"
score = 7
severity = "HIGH"
sources = ["zdi"]
title = "Microsoft Windows Win32k 权限提升漏洞"
updated = "2026-07-22T16:17:36.053"

