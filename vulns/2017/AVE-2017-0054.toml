[basic]
description = "ZEIT Next.js 2.4.1 之前版本中存在路径遍历漏洞（CWE-22）。攻击者可通过向 /_next 和 /static 命名空间下的 URL 发送特制的路径请求，利用目录遍历绕过访问限制，读取服务器上的任意敏感文件（如配置文件、源代码等）。该漏洞无需身份认证即可远程利用，攻击复杂度低，CVSS 评分 7.5，危害等级高。官方已在 2.4.1 版本中修复此漏洞，建议用户及时升级。"
published = "2017-11-17T17:29:00Z"
remediation = "立即将 Next.js 升级至 2.4.1 或更高版本，该版本修复了 /_next 和 /static 命名空间下的路径遍历问题。如无法立即升级，可在反向代理层（如 Nginx）配置规则，阻止对 /_next 和 /static 目录的目录遍历请求（如拦截包含 ../ 的 URL 路径）。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "ZEIT Next.js 目录遍历漏洞"
updated = "2026-06-17T01:10:04Z"

