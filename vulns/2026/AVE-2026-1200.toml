[basic]
description = "tags.<value>Windows Hyper-V 存在使用后释放（Use After Free）漏洞，攻击者利用 vmswitch.sys 组件中的内存管理缺陷，在本地以授权用户身份执行特制操作后可提升权限。该漏洞影响 Windows 10 1809/21H2/22H2、Windows 11 24H2/25H2/26H1 以及 Windows Server 2019/2022/2025 等版本。攻击条件为需要本地访问权限且经过身份认证，无需网络远程利用。CVSS 评分为 7.0，危害等级为高危。"
published = "2026-07-14T17:17:05.113"
remediation = "立即升级受影响系统至以下安全版本：Windows 10 1809 升级到 10.0.17763.9020，Windows 10 21H2 升级到 10.0.19044.7548，Windows 10 22H2 升级到 10.0.19045.7548，Windows 11 24H2 升级到 10.0.26100.8875，Windows 11 25H2 升级到 10.0.26200.8875，Windows 11 26H1 升级到 10.0.28000.2525，Windows Server 2019 升级到 10.0.17763.9020，Windows Server 2022 升级到 10.0.20348.5386，Windows Server 2025 升级到 10.0.26100.33158。安装后重启系统，并通过 Windows Update 检查是否还有待安装的安全更新。若无需使用 Hyper-V 功能，可在控制面板中关闭 Hyper-V 角色作为临时缓解措施。"
score = 7
severity = "HIGH"
sources = ["zdi"]
title = "Microsoft Windows Hyper-V 权限提升漏洞"
updated = "2026-07-22T16:18:15.210"

