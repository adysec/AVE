[basic]
description = "GNU Binutils 2.45 版本的链接器组件在处理 elf64-x86-64.c 文件中的 elf_x86_64_relocate_section 函数时存在基于堆的缓冲区溢出漏洞（CWE-119）。攻击者可通过本地方式向目标系统提交特制的 ELF 文件触发该溢出，导致程序崩溃或潜在的内存破坏。该漏洞仅限本地利用，需要攻击者具有本地系统访问权限，CVSS 评分 1.9，危害等级低。GNU Binutils 项目已发布补丁（commit 6b21c8b2ecfef5c95142cbc2c32f185cb1c26ab0）修复此问题，建议用户更新至修复版本。"
published = "2025-10-08T20:15:34Z"
remediation = "建议将 GNU Binutils 升级至 2.44 及以上版本（包含 commit 6b21c8b2ecfef5c95142cbc2c32f185cb1c26ab0 的修复）。SUSE 用户可安装 SUSE-SU-2025:4096-1 安全更新。对于无法立即升级的系统，避免在链接过程中使用 `-z gcs=implicit` 参数作为临时缓解措施。"
score = 1.9
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils 链接器基于堆的缓冲区溢出漏洞"
updated = "2026-06-17T08:30:34Z"

