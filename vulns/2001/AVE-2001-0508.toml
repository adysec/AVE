[basic]
description = "xinetd 服务管理程序 2.3.0 及更早版本（直至 2.3.3 的变种）存在多个缓冲区溢出及空终止符处理不当漏洞。远程攻击者无需身份认证即可通过网络向目标系统发送特制请求触发缓冲区溢出，导致服务崩溃引发拒绝服务，或利用内存破坏实现任意代码执行。该漏洞影响广泛部署 xinetd 的 Linux/Unix 系统，CVSS 评分 7.5，危害等级高。"
published = "2001-08-29T04:00:00Z"
remediation = "建议升级 xinetd 至 2.3.4 或更高版本。Red Hat 用户应安装 RHSA-2001:109 提供的更新补丁；Mandrake Linux 用户安装 MDKSA-2001:076 更新；Immunix 用户安装 IMNX-2001-70-033-01 更新。如无法升级，可在 xinetd.conf 中禁用不需要的服务（如 echo、chargen、daytime 等），并在防火墙层面限制对 xinetd 管理端口的访问。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Xinetd 缓冲区溢出拒绝服务代码执行漏洞"
updated = "2026-06-16T21:56:10Z"

