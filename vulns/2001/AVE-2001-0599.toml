[basic]
description = "NSA Security-enhanced Linux（SELinux）的 libsecure 库中 find_default_type 函数存在缓冲区溢出漏洞。本地攻击者可通过向该函数传递特制输入触发缓冲区溢出，导致内存中关键数据被篡改，从而可能绕过 SELinux 安全策略或破坏系统完整性。该漏洞需要本地访问权限，攻击复杂度低，无需身份认证，但仅影响数据完整性，不影响系统可用性和机密性。受影响的系统包括使用 NSA SELinux 的 Linux 发行版。"
published = "2001-02-12T05:00:00.000"
remediation = "立即升级至 Linux 内核 2.6.0 及以上版本（SELinux 主线化版本），该版本已重写安全机制，不再使用存在漏洞的 libsecure 库。如无法升级内核，可限制本地用户对 SELinux 策略文件的写入权限，并监控 find_default_type 相关日志。对于现代发行版，确保 selinux-policy 包更新至最新即可。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "NSA Security-enhanced Linux 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:36.340"

