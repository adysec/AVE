[basic]
description = "pyasn1 是一个用于 Python 的通用 ASN.1 库，其 BER/CER/DER 解码器在处理 OBJECT IDENTIFIER 和 RELATIVE-OID 值时存在二次复杂度问题。攻击者可构造包含大量弧段（arcs）的小型恶意载荷（数十 KB），当应用程序解码该数据时，每个 decode() 调用将消耗数秒 CPU 时间，导致拒绝服务。该漏洞影响所有解码不可信 ASN.1 数据的应用场景，包括证书解析、LDAP、SNMP、Kerberos 等。编码器在重新编码攻击者提供的值时也存在相同问题。pyasn1 0.6.4 版本已修复此漏洞，将弧段累积算法改为线性时间复杂度。"
published = "2026-07-14T17:17:14Z"
remediation = "立即将 pyasn1 升级至 0.6.4 或更高版本（pip install --upgrade pyasn1），该版本已将 OID 弧累积算法改为线性时间复杂度。如无法升级，可在解码前限制不可信 ASN.1 输入数据大小（建议不超过 1KB），或使用防火墙/反向代理过滤包含大量 OID 弧的畸形 ASN.1 载荷。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "pyasn1 ASN.1 OID处理二次复杂度拒绝服务漏洞"
updated = "2026-07-21T14:38:21Z"

