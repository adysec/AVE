[basic]
description = "tags at the end.<value>Small HTTP Server 2.01 是一个轻量级Web服务器，在处理HTTP请求时存在资源耗尽漏洞。攻击者可以通过快速连接服务器并发送大量HTTP请求（如GET、HEAD或POST），然后提前关闭连接，迫使服务器保持连接状态，耗尽系统资源（如文件描述符、内存），最终导致服务器响应速度变慢或完全无法响应，造成服务中断。该漏洞影响当时流行的网络服务器产品，可能导致Web服务不可用。攻击者无需身份验证即可远程触发，攻击成本低且影响范围广。"
published = "2001-01-09T05:00:00.000"
remediation = "建议立即停止使用 Max Feoktistov Small HTTP Server 2.01，迁移至 Apache HTTP Server 2.4.x、Nginx 1.24+ 或其他现代维护中的 Web 服务器。临时缓解措施：在防火墙层面限制单 IP 连接数（如 iptables 限制每 IP 最大 50 并发）、设置连接超时（如 nginx proxy_read_timeout 30s）、禁用 Keep-Alive 或限制请求头大小，减少资源耗尽风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Max Feoktistov Small HTTP Server 2.01 HTTP Request 拒绝服务漏洞"
updated = "2026-06-16T21:52:43.133"

