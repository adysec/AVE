[basic]
description = "ASUS System Control Interface 存在关键资源权限分配不当漏洞（CWE-732）。该漏洞的原理是软件对关键RPC接口的权限配置不足，允许本地低权限用户通过发送特制的RPC调用来绕过验证机制，从而将权限提升至SYSTEM级别并执行任意代码。影响范围包括安装了该组件的ASUS相关Windows系统，攻击者需要先在本地获得低权限访问权限（如通过恶意软件或受限用户账户），然后利用此漏洞实现权限提升。攻击条件要求攻击者能够在目标系统上执行本地代码，利用方式为构造绕过验证机制的特制RPC请求，成功利用后可完全控制系统并造成严重影响。"
published = "2026-05-29T02:16:17.223"
remediation = "立即升级 ASUS System Control Interface 至 3.1.60.0 或更高版本（64 位系统），或 3.2.61.0 或更高版本（ARM 系统）。可通过 ASUS Update Utility 或访问 https://www.asus.com/security-advisory/ 下载对应版本的安全更新补丁并安装。如暂时无法升级，可通过 Windows 服务管理器将 ASUS System Control Interface 服务设置为手动启动或临时禁用，以降低本地攻击面。"
score = 7.3
severity = "HIGH"
sources = ["zdi"]
title = "ASUS System Control Interface 本地权限提升漏洞"
updated = "2026-07-21T12:10:00.090"

