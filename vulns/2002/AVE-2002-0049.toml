[basic]
description = "Fetchmail 6.0.0及之前版本的 getmxrecord 函数存在边界检查缺失漏洞。远程攻击者可利用恶意的 DNS 服务器返回特制的 DNS 数据包，当 Fetchmail 处理该数据包时，函数未正确校验数据边界，导致读取超出预期范围的内存区域，从而触发程序崩溃，造成拒绝服务。攻击者无需认证即可远程触发，影响 Fetchmail 6.0.0及之前版本。"
published = "2002-10-11T04:00:00Z"
remediation = "升级 Fetchmail 至 6.1.0 或更高版本。各发行版参照相应安全公告安装更新：Debian 安装 DSA-171 更新包，Red Hat 安装 RHSA-2002:215 更新包，Mandrake 安装 MDKSA-2002:063 更新。若无法立即升级，避免在 multidrop 多投递模式下运行 Fetchmail，并确保 DNS 服务器位于可信网络内以降低被攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Fetchmail 6.0.0 及之前版本 DNS getmxrecord 拒绝服务漏洞"
updated = "2026-06-16T21:58:52Z"

