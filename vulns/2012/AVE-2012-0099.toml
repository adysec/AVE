[basic]
description = "Adobe Flash Player 存在通用跨站脚本（Universal XSS）漏洞，远程攻击者可通过特制的网页或HTML内容诱导用户访问，在用户浏览器上下文中注入并执行任意脚本或HTML代码，从而窃取Cookie、会话令牌或模拟用户操作。该漏洞影响Windows、Mac OS X、Linux、Solaris及Android平台上的Flash Player 10.3.183.15之前版本和11.1.102.62之前版本，已在2012年2月被野外利用。攻击无需身份认证，但需要用户交互（点击恶意链接或访问恶意网页），CVSS评分6.1，危害等级中危。"
published = "2012-02-16T19:55:01Z"
remediation = "立即将 Adobe Flash Player 升级到 Windows/Mac/Linux/Solaris 平台 10.3.183.15 或 11.1.102.62 及以上版本；Android 2.x/3.x 升级到 11.1.111.6 以上，Android 4.x 升级到 11.1.115.6 以上。由于 Adobe 已于 2020 年 12 月 31 日停止 Flash Player 支持，建议彻底卸载 Flash Player，或在浏览器中设置 click-to-play 禁止自动加载 Flash 内容，并在组策略中禁用 Flash 执行权限作为根本缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["tenable"]
title = "Adobe Flash Player 通用跨站脚本漏洞"
updated = "2026-06-16T23:38:13Z"

