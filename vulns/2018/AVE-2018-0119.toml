[basic]
description = "Rubedo CMS 3.4.0及之前版本的主题组件存在目录遍历漏洞（CWE-22），未经身份认证的远程攻击者可通过构造包含`%2e%2e/`等编码路径穿越序列的恶意URI（如`/theme/default/img/%2e%2e/..//etc/passwd`），突破服务根目录限制，实现任意文件读取与执行。该漏洞CVSS评分9.8，危害等级严重，可导致服务器敏感信息泄露及远程代码执行，影响所有使用Rubedo CMS的Web应用。"
published = "2018-09-11T16:29:00Z"
remediation = "Rubedo CMS 官方已停止维护，无安全补丁可用。建议立即迁移至其他受支持的 CMS 平台。如无法迁移，可采取以下缓解措施：(1) 在 Web 服务器（Nginx/Apache）层面配置规则，拦截包含 `%2e%2e`、`..//` 等路径遍历特征的 URI 请求；(2) 在应用入口处对 `theme/default/img/` 路径参数进行规范化校验，拒绝包含 `../` 或编码后路径穿越字符的请求；(3) 限制 Web 服务进程对文件系统的读取权限，仅允许访问 `webroot` 目录下的必要资源；(4) 部署 WAF（如 ModSecurity）并启用路径遍历攻击防护规则集。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Rubedo CMS 主题组件目录遍历漏洞"
updated = "2026-06-17T01:44:52Z"

