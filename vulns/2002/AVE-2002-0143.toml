[basic]
description = "CVS 1.10.8 之前版本中存在全局变量未正确初始化的缺陷，远程攻击者可通过 diff 功能向 CVS 服务器发送特制的请求，触发未初始化变量导致的异常，造成服务器进程崩溃，形成拒绝服务。该漏洞影响所有运行 CVS 1.10.8 之前版本的系统，攻击无需身份认证，通过网络即可发起，利用难度较低。"
published = "2002-03-15T05:00:00Z"
remediation = "升级 CVS 至 1.10.8 或更高版本（Debian 稳定版已发布 DSA-117 修复至 1.10.7-9，Red Hat 已发布 RHSA-2002:026 补丁），该版本已正确初始化全局变量，可防止通过 diff 功能触发的拒绝服务攻击。如无法立即升级，可在 CVS 服务器上通过 inetd 或 xinetd 限制 pserver 服务的访问来源 IP，或使用防火墙规则限制对 CVS 默认端口 2401/tcp 的访问。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "CVS 1.10.8 全局变量未初始化拒绝服务漏洞"
updated = "2026-06-16T21:56:45Z"

