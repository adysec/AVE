[basic]
description = "psyBNC 2.3 存在拒绝服务漏洞，远程攻击者可通过向 PASS 命令提交超长密码参数并迅速断开连接，导致 psyBNC 无法正确终止该连接，从而引发 CPU 资源耗尽和服务不可用。该漏洞影响 psyBNC 2.3 版本，攻击者无需认证即可远程触发，危害等级中等。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 psyBNC 至 2.3.1 或更高版本，该版本已修复 PASS 命令超长密码导致的资源耗尽问题。如无法升级，可修改源码限制 PASS 参数长度不超过 128 字符后重新编译。网络层面可在防火墙上限制 psyBNC 端口（默认 6667）仅允许可信 IP 访问。鉴于 psyBNC 已停止维护，建议迁移至 ZNC 等仍在维护的 IRC 代理软件。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Psychoid psyBNC 超大密码拒绝服务漏洞"
updated = "2026-06-16T21:58:02Z"

