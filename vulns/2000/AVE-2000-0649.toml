[basic]
description = "Microsoft IIS 4.0/5.0 及 Personal Web Server (PWS) 存在 Unicode 编码目录遍历漏洞。远程攻击者可通过向目标服务器发送包含特殊 Unicode 编码字符（如 %c1%1c）的恶意 HTTP 请求，绕过 IIS 的路径安全检查，读取 Web 根目录以外的任意文件，甚至可能执行任意命令。该漏洞源于 IIS 对 Unicode 编码 URL 的解析缺陷，将编码序列错误解释为目录遍历符，攻击者无需身份认证即可远程利用，影响 IIS 4.0/5.0 及 PWS 等版本。"
published = "2000-12-19T05:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS00-078 对应补丁（IIS 4.0 更新 Q277625，IIS 5.0 更新 Q277625），或升级至 Windows 2000 Service Pack 1 及以上版本。如无法打补丁，在 IIS 管理器中禁用「父路径」选项，并删除可执行虚拟目录的脚本映射权限以降低风险。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Microsoft IIS 4.0/5.0 Unicode编码目录遍历漏洞"
updated = "2026-06-16T21:52:40Z"

