[basic]
description = "K3s 的 etcd 快照解压功能存在 ZIP 存档路径遍历漏洞（CWE-22）。攻击者可通过构造包含恶意文件名（如 `../../../../etc/password`）的 ZIP 存档，当管理员使用 `--cluster-reset --cluster-reset-restore-path` 恢复该压缩快照时，存档中的文件会被解压写入到文件系统的任意位置，导致任意文件写入。该漏洞需管理员手动触发恢复操作且需高权限，CVSS 评分 5.8，影响 K3s 1.35.3+k3s1、1.34.6+k3s1、v1.33.10+k3s1 之前版本。修复方式为升级至上述安全版本或启用 Go 内置的不安全路径保护机制。"
published = "2026-06-25T19:16:41Z"
remediation = "立即升级 K3s 至 v1.35.3+k3s1、v1.34.6+k3s1 或 v1.33.10+k3s1 及以上版本。如无法立即升级，恢复 etcd 快照时设置环境变量 `GODEBUG=zipinsecurepath=0` 启用 Go 内置的不安全路径保护，或手动从 ZIP 中解压快照文件后再恢复（确保快照文件不以 .zip 结尾）。"
score = 5.8
severity = "MEDIUM"
sources = ["ghsa"]
title = "K3s etcd 快照解压 ZIP 路径遍历漏洞"
updated = "2026-06-26T19:16:42Z"

