[basic]
description = "MetInfo 7.0.0beta 版本后台 product_admin 模块存在 SQL 注入漏洞。攻击者在获得高权限管理员身份后，可通过向 admin/?n=product&c=product_admin&a=dopara&app_type=shop 接口的 id 参数提交恶意 SQL 语句，绕过数据库查询过滤机制，实现对后台数据库的非法查询、篡改或删除操作。该漏洞影响使用 MetInfo 7.0.0beta 版本的网站系统，CVSS 评分 7.2，危害等级高。攻击者需具备管理员权限才能利用此漏洞，无需用户交互即可完成数据库注入攻击。"
published = "2019-09-30T13:15:11Z"
remediation = "立即升级至MetInfo 8.1或更高版本（当前最新版本），或从MetInfo 7.0.x直接升级到8.1版本，版本8.1已修复该SQL注入漏洞。在升级前如无法立即修复，建议通过修改product_admin.class.php文件中的参数验证逻辑或在Web应用防火墙中添加对product_admin类文件 suspicious parameter监控规则作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["nuclei"]
title = "MetInfo CMS SQL注入漏洞"
updated = "2026-06-17T02:23:07Z"

