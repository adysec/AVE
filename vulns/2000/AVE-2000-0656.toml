[basic]
description = "Mirabilis ICQ Web Front 服务中的 Guestbook CGI 程序存在输入验证缺陷，远程攻击者无需身份认证即可通过向 guestbook 参数提交超长 URL 名称触发缓冲区异常，导致 ICQ Web Front 服务进程崩溃，造成拒绝服务。该漏洞影响 ICQ 2000a、99b 及更早版本，攻击复杂度低，仅需构造特制 HTTP 请求即可利用，无需用户交互。"
published = "2000-05-29T04:00:00Z"
remediation = "该漏洞影响 Mirabilis ICQ 2000a/99b 及更早版本的 Web Front 服务 guestbook CGI 组件。由于该产品已停止维护且无官方补丁，建议立即停用 ICQ Web Front 服务或将其从公网隔离；如必须使用，可在 Web 服务器或应用层对 guestbook CGI 的 name 参数做长度限制（如限制不超过 256 字符），并部署 WAF 规则拦截超长 URL 请求。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Mirabilis ICQ Web Front 服务 Guestbook CGI 长 URL 参数拒绝服务漏洞"
updated = "2026-06-16T21:52:00Z"

