[basic]
description = "Oracle MySQL 5.1.61及之前版本、5.5.21及之前版本的Server DML组件中存在未明漏洞。远程认证用户可通过发送特制的DML语句触发该漏洞，导致MySQL服务进程崩溃或拒绝服务。攻击者需拥有数据库的有效登录凭据，利用复杂度低，无需特殊权限即可实施攻击。该漏洞影响范围广泛，涉及所有使用受影响版本的MySQL数据库实例。"
published = "2012-05-03T22:55:02.387"
remediation = "升级 MySQL 至 5.5.22 及以上版本（或 5.1.62 及以上版本），该漏洞已在 MySQL 5.5.22 中修复。如无法立即升级，可在 my.cnf 中限制 DML 操作用户的连接数并启用查询超时参数（max_execution_time）以缓解 DoS 风险。"
score = 4
severity = "MEDIUM"
sources = ["tenable"]
title = "Oracle MySQL Server DML 拒绝服务漏洞"
updated = "2026-06-16T23:40:05.973"

