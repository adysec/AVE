[basic]
description = "OmniHTTPd 是一款由 Omnicron 公司开发的 HTTP Web 服务器软件，其 2.07 版本中包含的 statsconfig.pl 脚本存在严重的命令注入漏洞。该脚本在生成 Perl 统计页面时，未对用户提交的 mostbrowsers 参数进行充分过滤和转义，导致远程攻击者可在参数中注入任意 Perl 代码或系统命令。由于该服务通常以管理员权限运行，攻击者无需身份认证即可通过构造恶意的 mostbrowsers 请求参数执行任意操作系统命令，最终完全控制服务器。该漏洞影响 OmniHTTPd 2.07 及早期版本，攻击者可利用此漏洞获取服务器权限、窃取敏感数据或进一步渗透内网。CVSS 评分满分 10.0，危害等级为严重。"
published = "2001-03-12T05:00:00.000"
remediation = "将 OmniHTTPd 升级至 2.08 或更高版本，该版本已对 statsconfig.pl 脚本中的 mostbrowsers 参数进行输入过滤，消除命令注入风险。由于 OmniHTTPd 已停止维护且无后续安全更新，建议迁移至持续更新的替代 Web 服务器（如 Apache、Nginx）。作为临时缓解措施，可在防火墙或 Web 服务器配置中阻止外部访问 statsconfig.pl 脚本，或直接删除该脚本。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Omnicron OmniHTTPd 远程命令执行漏洞"
updated = "2026-06-16T21:53:40.800"

