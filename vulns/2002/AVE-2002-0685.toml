[basic]
description = """Drupal 4.0.0 存在跨站脚本攻击漏洞，其新闻模块未能对用户提交的内容进行充分的 HTML 过滤。未经身份验证的远程攻击者可在新闻帖子中注入包含 JavaScript 代码的 IMG 标签，例如使用 IMG SRC="javascript:alert('unsecure')" 形式的恶意代码。当其他用户浏览该条新闻时，嵌入的脚本将在其浏览器中以站点上下文执行，导致攻击者可窃取会话 Cookie、重定向用户或执行其他恶意操作。该漏洞影响所有使用 Drupal 4.0.0 的站点，攻击条件为攻击者能够向站点发布新闻内容，且用户访问包含恶意脚本的新闻页面。"""
published = "2002-12-31T05:00:00Z"
remediation = "立即升级 Drupal 到 4.0.1 或更高版本，该版本修复了新闻消息中 HTML 及 JavaScript 注入过滤不严格的问题。如无法立即升级，应在 Web 服务器或应用层对用户提交的内容进行过滤，禁止 IMG 标签中使用 javascript: 协议，并在防火墙或 WAF 中配置规则拦截包含 javascript: 协议的请求，同时清理已发布的新闻消息中的恶意内容。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Drupal 4.0.0 图片标签跨站脚本注入漏洞"
updated = "2026-06-16T22:00:00Z"

