[basic]
description = "Ghostscript 6.51 之前版本中存在安全模式绕过漏洞。当启用 `-dSAFER` 安全限制时，`file` 操作符本应被禁用以防止文件读写，但由于权限检查不完善，本地攻击者可通过构造特制的 PostScript 文件，以 `lp` 用户身份读取或写入系统任意文件。攻击条件要求攻击者拥有本地 shell 访问权限，且目标系统安装了受影响版本的 Ghostscript。该漏洞可导致敏感信息泄露或系统文件被篡改。"
published = "2001-09-18T04:00:00Z"
remediation = "升级 Ghostscript 至 6.51 或更高版本，该版本修复了 -dSAFER 模式下 file 操作符绕过沙箱的问题。如无法升级，可在调用 Ghostscript 处理用户输入前，使用系统权限控制（如以非 lp 用户的低权限账户运行）限制文件读写范围，并禁用不必要的 PS 操作符。对于打印服务场景，建议使用 AppArmor/SELinux 策略限制 Ghostscript 进程的文件访问路径。"
score = 2.6
severity = "LOW"
sources = ["redhat"]
title = "Artifex Ghostscript 任意文件读写漏洞"
updated = "2026-06-16T21:56:06Z"

