[basic]
description = "Linux kernel的usbnet/ipheth驱动程序在处理RNDIS协议数据包时存在越界读取漏洞。NDP16头部包含固定数量的数据路径元素（DPE），但代码未正确限制处理的DPE数量，导致读取超出分配缓冲区边界的内存。本地低权限攻击者可利用此漏洞泄露内核内存内容或导致系统崩溃。该漏洞影响包含受影响usbnet/ipheth代码的Linux内核版本。"
published = "2025-02-27T03:15:14.730"
remediation = "建议将 Linux 内核升级至已修复该漏洞的稳定版本（如 6.12+ 或对应发行版的最新补丁版本）。对于无法立即升级的系统，可尝试通过禁用 ipheth 驱动模块（运行 `modprobe -r ipheth`）来降低受攻击风险。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux kernel usbnet ipheth 越界读取漏洞"
updated = "2026-06-17T08:44:09.980"

