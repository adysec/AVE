[basic]
description = "Linux 内核 btrfs 文件系统在 cow_file_range() 函数执行失败时存在不正确的 folio（页缓存单元）清理漏洞。当写入时空间不足（-ENOSPC）导致 cow_file_range() 失败后，错误处理流程未能正确清除剩余页面的脏标志和 EXTENT_DELALLOC 标志，导致部分页面仍保持脏状态但缺少延迟分配标记。后续写回操作触发这些页面时，因找不到对应的 ordered extent 而进入 COW 修复路径，最终触发内核 BUG_ON() 导致系统崩溃。本地低权限攻击者可利用此漏洞造成拒绝服务。该漏洞自 btrfs 引入以来一直存在，影响所有使用 btrfs 文件系统的 Linux 内核版本。"
published = "2025-02-27T02:15:10Z"
remediation = "建议立即将 Linux 内核升级至 6.12.36、6.13.2 或 6.14 及以上版本，这些版本已包含 btrfs cow_file_range() 失败时 folio 清理的修复补丁。对于无法立即升级的系统，可限制本地用户对 btrfs 文件系统的写入权限以降低触发概率，但最有效的措施仍是安装内核安全更新。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Kernel Btrfs 文件系统 folio 清理不当导致拒绝服务漏洞"
updated = "2026-06-17T08:14:21Z"

