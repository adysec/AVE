[basic]
description = "Peter Sandvik's Simple Web Server 0.5.1 及更早版本存在文件泄露漏洞，远程攻击者可通过在 HTTP 请求中使用多个连续斜杠（如 `///file/`）绕过访问限制，读取服务器上任意文件。该漏洞源于路径解析时对斜杠序列处理不当，导致权限检查被绕过。攻击者无需身份认证即可利用，影响范围广泛。目前已有公开 PoC 利用代码。"
published = "2002-11-12T05:00:00.000"
remediation = "该软件已停止维护，开发者已暂停项目开发。建议立即迁移至其他受支持的 Web 服务器（如 Apache、Nginx），并确保服务器上不存放敏感文件。如无法立即迁移，可在 Web 应用防火墙（WAF）或反向代理层配置规则，拦截包含连续多个斜杠（如 `///`）的畸形 URL 请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Peter Sandvik Simple Web Server 文件泄漏漏洞"
updated = "2026-06-16T21:58:59.313"

