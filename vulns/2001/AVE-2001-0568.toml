[basic]
description = 'tags, no other content.<value>SimpleServer:WWW 1.13及更早版本（包括1.0.7、1.0.8）存在目录遍历漏洞，远程攻击者可通过在请求的URL中使用十六进制编码的"../"序列（%2E%2E%2F%）绕过服务器对目录路径的过滤校验，向cgi-bin/目录发送恶意请求。成功利用该漏洞可导致攻击者在目标Windows系统上执行任意程序，造成完全的系统控制。该漏洞影响AnalogX开发的SimpleServer:WWW轻量级HTTP服务器，攻击者无需身份认证即可在任意目标上发起远程利用，CVSS评分高达10.0，危害等级为严重。'
published = "2010-02-12T21:30:00Z"
remediation = "立即升级 SimpleServer:WWW 至 AnalogX 官方发布的 v1.15 或更高版本（最新稳定版 v1.24），该版本已修复 cgi-bin 目录下的目录遍历漏洞。若无法立即升级，可在 IIS 或其他反向代理层配置 URL 重写规则，拒绝包含 %2E%2E%2F 或 .. 路径片段的请求，或直接禁用 cgi-bin 目录的远程访问权限作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "SimpleServer WWW 目录遍历漏洞"
updated = "2026-06-16T21:56:33Z"

