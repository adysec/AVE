[basic]
description = "在可组合的 `astro/hono` 管道中，`security.checkOrigin` 保护机制仅由 `middleware()` 原语安装。`actions()` 和 `pages()` 原语各自独立分发到用户代码，因此当管道在 `middleware()` 之前（或不使用 `middleware()`）挂载这两个原语时，相关请求将绕过源站校验。这是一个仅写无读的跨站请求伪造（CSRF）漏洞：攻击者可以利用受害者的凭据触发状态变更操作或端点处理程序，但无法读取跨域响应内容。该漏洞影响 Astro >= 7.0.0 版本中采用可组合 `astro/hono` 管道的应用，特别是 `actions()` 挂载在 `middleware()` 之前，或未使用 `middleware()` 而直接使用 `pages()` 的配置。默认的非可组合管道不受影响。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Astro composable astro/hono 管道安全绕过漏洞"
