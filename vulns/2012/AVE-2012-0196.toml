[basic]
description = "Mozilla Firefox/Thunderbird/SeaMonkey 浏览器引擎中存在多处未指定的内存破坏漏洞。当处理畸形网页内容时，浏览器引擎未能正确管理内存操作，导致内存损坏。远程攻击者可诱导用户访问特制的恶意网页，触发内存破坏，导致应用程序崩溃或实现任意代码执行。该漏洞影响 Firefox 4.x 至 12.0、Firefox ESR 10.0 至 10.0.4、Thunderbird 5.0 至 12.0、Thunderbird ESR 10.0 至 10.0.4 及 SeaMonkey 2.10 之前版本，CVSS 评分 9.3，危害严重。Mozilla 已在 Firefox 13.0、Firefox ESR 10.0.5、Thunderbird 13.0、Thunderbird ESR 10.0.5 及 SeaMonkey 2.10 中修复此漏洞。"
published = "2012-06-05T23:55:01Z"
remediation = "升级 Firefox 至 13.0 及以上版本、Firefox ESR 至 10.0.5 及以上版本、Thunderbird 至 13.0 及以上版本、Thunderbird ESR 至 10.0.5 及以上版本、SeaMonkey 至 2.10 及以上版本。无法立即升级时，建议禁用 JavaScript 并限制浏览器访问不可信网站以降低风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 浏览器引擎内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:40:36Z"

