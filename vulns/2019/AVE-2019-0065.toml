[basic]
description = "MindPalette NateMail 3.0.15 存在反射型跨站脚本（XSS）漏洞。攻击者可通过向目标应用发送特制的 POST 请求，在 recipient 参数中注入恶意 JavaScript 代码。由于 NateMail 的收件人数组默认使用整数作为键值，任何非数字字符串输入均会被视为无效并直接反射回响应页面，导致恶意脚本在受害者浏览器中执行。攻击者可借此窃取会话凭证、劫持用户会话或实施钓鱼攻击。该漏洞无需身份认证，但需要用户交互（点击恶意链接或提交表单），CVSS 评分 6.1，危害等级中危。"
published = "2019-10-16T00:15:10.587"
remediation = "建议立即手动修复 NateMail.php 源代码：在第 379 行将 `$thisRecipKey` 输出改为 `htmlspecialchars($thisRecipKey, ENT_QUOTES, 'UTF-8')` 以防止 XSS；同时在第 638 行起对 redirect 参数实施 URL 白名单验证，仅允许跳转到可信域名。由于 MindPalette 已停止维护 NateMail 且无官方补丁，无法通过升级解决。如无法修改代码，可在 WAF 或反向代理层添加规则，拦截 POST 请求中 recipient 参数包含 `<script>`、`<img>` 等 HTML 标签的恶意载荷。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "MindPalette NateMail 反射型跨站脚本漏洞"
updated = "2026-06-17T02:16:41.687"

