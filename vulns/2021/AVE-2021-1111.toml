[basic]
description = "Accellion FTA（File Transfer Appliance）9.12.411 及更早版本存在服务端请求伪造（SSRF）漏洞，攻击者可通过向 wmProgressstat.html 端点发送特制 POST 请求触发该漏洞。由于该请求无需身份验证即可利用，攻击者可在服务器端伪造请求，访问内网资源或外部系统，导致信息泄露、服务滥用等严重后果。该漏洞影响部署了 Accellion FTA 的企事业单位文件传输系统，CVSS 评分 9.8，危害等级严重。厂商已在 FTA_9_12_416 及更高版本中修复此漏洞，建议用户尽快升级至安全版本。"
published = "2021-02-16T21:15:13Z"
remediation = "建议将 Accellion FTA 升级至 FTA_9_12_416 或更高版本。如无法立即升级，可在防火墙或反向代理层拦截对 wmProgressstat.html 端点的 POST 请求，或限制 FTA 服务对内部网络的出站访问作为临时缓解措施。该漏洞已被 CISA 列入已知被利用漏洞目录，且已被勒索软件活动利用，建议优先安排补丁升级。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Accellion FTA 服务器端请求伪造漏洞"
updated = "2026-06-17T03:44:18Z"

