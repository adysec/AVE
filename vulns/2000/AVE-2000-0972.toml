[basic]
description = "FreeBSD 系统中的 eject 工具存在多处缓冲区溢出漏洞，本地攻击者可通过向 eject 程序传递特制的命令行参数触发缓冲区溢出，从而覆盖内存中的关键数据，实现权限提升并获得 root 权限。该漏洞影响 FreeBSD 及可能其他类 Unix 操作系统，攻击者需要拥有本地系统访问权限，无需身份认证即可利用，危害等级高。"
published = "2000-11-14T05:00:00Z"
remediation = "立即升级 FreeBSD 系统至包含补丁的版本（FreeBSD-SA-00:43），或从 FreeBSD CVS 仓库获取 eject 源码补丁并重新编译安装。如无法升级，可移除 eject 的 setuid 位（chmod u-s /usr/bin/eject）以消除本地提权风险，但会丧失普通用户直接调用 eject 的功能。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "FreeBSD eject 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:52:36Z"

