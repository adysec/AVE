[basic]
description = "Twig webmail system 未正确设置 vhosts 变量，当站点未配置该变量时，未经身份认证的远程攻击者可通过向 index.php3 程序指定替代的 vhosts 作为参数，向系统中插入并执行任意 PHP 代码，从而导致远程代码执行。该漏洞影响使用 Twig webmail system 的站点，CVSS 评分 7.5，危害等级高。"
published = "2001-01-09T05:00:00Z"
remediation = "立即升级 Twig webmail system 至最新版本并显式配置 vhosts 变量；如系统已停止维护，建议迁移至 SquirrelMail 或 Roundcube 等现代 webmail 系统。临时缓解措施：通过 Web 服务器配置限制仅允许本地访问 index.php3，或直接禁用该旧版 webmail 系统对外暴露。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Twig webmail 系统远程代码执行漏洞"
updated = "2026-06-16T21:53:17Z"

