[basic]
description = "WordPress Snap Creek Duplicator 插件（及 Duplicator Pro）存在目录遍历漏洞，未经身份认证的远程攻击者可通过向 `duplicator_download` 或 `duplicator_init` 接口的 `file` 参数传递 `../` 路径序列，实现任意文件读取，获取服务器敏感信息如 wp-config.php 等配置文件。该漏洞影响 Duplicator 版本低于 1.3.28 及 Duplicator Pro 版本低于 3.8.7.1，无需登录即可利用，CVSS 评分 7.5，危害等级高。"
published = "2020-04-13T22:15:10.660"
remediation = "立即将 WordPress Duplicator 免费版升级至 1.3.28 或更高版本，Duplicator Pro 升级至 3.8.7.1 或更高版本。如无法立即升级，可在 Web 服务器（Nginx/Apache）层面添加规则，拦截对 duplicator_download 和 duplicator_init 接口中包含 ../ 的请求路径。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "WordPress Duplicator 插件路径遍历漏洞"
updated = "2026-06-17T02:50:42.807"

