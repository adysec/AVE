[basic]
description = "Infopop Ultimate Bulletin Board (UBB) 6.2.0 Beta Release 1.0 及更早版本存在跨站脚本（XSS）漏洞。远程攻击者可通过在论坛帖子中构造包含编码 JavaScript 代码的 IMG 标签，当其他用户浏览该帖子时，恶意脚本将在用户浏览器中自动执行，导致攻击者可窃取用户会话 Cookie、伪造页面内容或执行其他恶意操作。该漏洞无需身份认证即可利用，影响 UBB 5.4/6.0/6.2 等多个版本。"
published = "2002-03-25T05:00:00Z"
remediation = "升级 Infopop Ultimate Bulletin Board 至 6.2.0 正式版或更高版本，该 Beta 版本存在 IMG 标签编码 JavaScript 的 XSS 漏洞。如无法升级，在服务器端对用户提交的 IMG 标签中 src 属性进行严格过滤，禁止包含 javascript:、onerror、onload 等事件处理器，并对 HTML 特殊字符进行 HTML 实体编码转义。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Infopop Ultimate Bulletin Board 跨站脚本攻击漏洞"
updated = "2026-06-16T21:56:49Z"

