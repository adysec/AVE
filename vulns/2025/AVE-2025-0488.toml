[basic]
description = "wolfSSL 的 XChaCha20-Poly1305 解密函数 wc_XChaCha20Poly1305_Decrypt() 中存在整数下溢漏洞（CWE-191），导致越界内存访问。该漏洞不涉及 TLS 连接，仅在应用程序直接调用该解密函数时触发。攻击者可通过向目标应用提交特制的密文数据触发整数下溢，造成越界读取或写入，可能导致敏感信息泄露或程序崩溃。CVSS 评分 2.1，危害等级低，利用需要用户交互且攻击复杂度较高。"
published = "2025-11-21T23:15:43Z"
remediation = "升级 wolfSSL 至包含 PR #9223 修复的版本（≥5.7.6），该 PR 修复了 `wc_XChaCha20Poly1305_Decrypt()` 函数中的整数下溢导致越界访问问题。如无法立即升级，避免在应用中直接调用该解密函数，或在使用前对输入长度参数进行严格校验。"
score = 2.1
severity = "LOW"
sources = ["msrc"]
title = "wolfSSL XChaCha20-Poly1305 整数下溢导致越界访问漏洞"
updated = "2026-06-17T08:31:25Z"

