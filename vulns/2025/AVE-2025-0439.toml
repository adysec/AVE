[basic]
description = "libxslt 在解析 XSL 节点时存在释放后使用（Use-After-Free）漏洞。当处理跨 RVT（Runtime Variable Tree）存储的 key 数据时，程序未能正确管理内存生命周期，导致已释放的指针被继续引用，可能触发过期指针的解引用操作，造成应用程序崩溃。该漏洞需要用户交互触发，攻击者需诱使用户打开特制的 XSL 文件，影响范围限于本地攻击场景，CVSS 评分 5.5，危害等级中危。受影响的版本包括 libxslt 1.1.x 系列。"
published = "2025-09-25T16:15:31Z"
remediation = "将 libxslt 升级至 1.1.44 或更高版本（v1.1.44 于 2025-11-25 发布，v1.1.45 于 2025-11-30 发布）。RHEL 8 用户升级至 libxslt-1.1.32-6.4.el8_10，RHEL 10 用户升级至 libxslt-1.1.39-8.el10_2.1，对应 RHSA 公告。如无法立即升级，避免在不可信来源的 XSLT 样式表中使用 xsl:key 和跨 RVT 引用，并限制本地用户上传恶意 XSL 文件。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "libxslt 解析 XSL 节点释放后使用漏洞"
updated = "2026-07-23T14:16:56Z"

