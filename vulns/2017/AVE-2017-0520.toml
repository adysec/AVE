[basic]
description = "Palo Alto Networks PAN-OS 防火墙管理接口存在远程命令执行漏洞，攻击者可通过向防火墙管理接口发送特制的请求，利用 readSessionVarsFromFile() 函数中的会话处理缺陷触发缓冲区溢出或会话损坏，从而在目标系统上以 root 权限执行任意代码。该漏洞影响 PAN-OS 6.1.19 之前、7.0.19 之前、7.1.14 之前及 8.0.6 之前的版本，CVSS 评分 9.8，危害等级严重。攻击者无需身份认证即可远程利用，且已有公开的 Metasploit 利用模块，建议用户立即升级至修复版本。"
published = "2017-12-11T17:29:00.490"
remediation = "升级 PAN-OS 至 6.1.19 / 7.0.19 / 7.1.14 / 8.0.6 及以上版本。如无法立即升级，在防火墙上配置管理接口仅允许受信 IP 访问，并禁用管理接口对公网的暴露。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Palo Alto Networks PAN-OS 远程代码执行漏洞"
updated = "2026-06-17T01:08:31.113"

