[basic]
description = "Microsoft Office 2000、Windows 2000 及 Windows Me 中的 Web Extender Client（WEC）组件在处理 Internet Explorer 安全设置与 NTLM 身份验证交互时存在安全缺陷，未能正确继承和强制执行 IE 的安全区域配置。未经身份认证的远程攻击者可通过特制网页或网络链接诱使受害系统使用 WEC 发起 NTLM 身份验证请求，进而拦截并获取用户的 NTLM 凭据，理论上可进一步离线破解获得明文密码。该漏洞影响所有使用上述受影响系统版本且启用 WEC 功能的用户，攻击条件简单，无需用户预先授权或交互即可在网络中被利用，主要威胁为凭据泄露及由此引发的横向移动风险。微软已于 2001 年 2 月发布安全公告 MS01-009 及对应补丁修复此问题。"
published = "2001-02-12T05:00:00Z"
remediation = "安装 Microsoft 安全更新 MS01-001。Office 2000 用户需先安装 SR-1a 再打补丁；Windows 2000 Gold/SP1 用户安装对应补丁，后续升级至 Service Pack 2 可包含此修复；Windows Me Gold 用户安装对应补丁。临时缓解措施：在 Internet Explorer 中禁用自动登录到 Intranet 区域以外的站点，并避免浏览不受信任的网站或打开不明来源的 HTML 邮件。由于 Windows 2000、Windows Me 及 Office 2000 均已停止支持，建议升级至受支持的操作系统与 Office 版本以彻底消除风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows Web Client NTLM 认证信息泄露漏洞"
updated = "2026-06-16T21:53:28Z"

