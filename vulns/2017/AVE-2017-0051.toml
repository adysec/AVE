[basic]
description = "FiberHome 路由器存在目录遍历漏洞，攻击者无需认证即可通过远程向 /cgi-bin/webproc 端点发送特制请求，利用 getpage 参数配合构造的 var:page 值实现路径穿越，从而读取设备上的任意文件（如 /etc/passwd 等敏感文件）。该漏洞影响多款 FiberHome 路由器型号，CVSS 评分 7.5，危害等级高，可能导致敏感信息泄露，进一步扩大攻击面。"
published = "2017-10-19T22:29:00Z"
remediation = "建议立即限制对路由器 /cgi-bin/webproc 路径的访问，在防火墙或反向代理层面添加规则拦截包含 getpage 参数的请求；同时将路由器管理界面绑定到内网特定 IP，禁止从 WAN 侧访问；如设备支持，升级到厂商发布的最新固件版本；若无法升级，可考虑更换已停止维护的 FiberHome 设备为仍在安全更新支持期内的替代产品。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "FiberHome 路由器目录遍历漏洞"
updated = "2026-06-17T01:08:03Z"

