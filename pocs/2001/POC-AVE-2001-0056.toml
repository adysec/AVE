[info]
author = "ave"
description = "通过构造特制 JavaScript URL 触发 WMP ActiveX 控件跨域验证绕过，验证目标是否存在漏洞"
id = "POC-AVE-2001-0056"
name = "Microsoft Windows Media Player 7.0 ActiveX 跨域绕过 PoC"
severity = "high"
tags = ["ave-2001-0056"]
vuln_id = [
    "CVE-2001-0148",
    "AVE-2001-0056",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["WMP ActiveX"]
