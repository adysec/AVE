[basic]
description = "tags.<value>Linux内核2.2版本的TCP初始序列号（ISN）生成算法使用可预测的随机数机制，远程攻击者可通过分析返回值规律预测后续连接的初始序列号。该漏洞影响运行Linux内核2.2.x系列的操作系统，攻击者无需身份认证即可在远程发起利用，通过预测的ISN值伪造TCP数据包源地址或劫持已建立的合法TCP会话，实现会话劫持、数据包注入等攻击，严重威胁网络通信安全性与数据完整性。"
published = "2000-12-19"
remediation = "升级到 FreeBSD 4.1.1-STABLE 或 3.5.1-STABLE（修正日期 2000-09-28 之后）。若无法升级，下载官方补丁 ftp://ftp.freebsd.org/pub/FreeBSD/CERT/patches/SA-00:52/tcp-iss.patch，验证 PGP 签名后应用到 /usr/src/sys/netinet/tcp_seq.h 和 tcp_subr.c，将 random() 替换为 arc4random()，然后按 http://www.freebsd.org/handbook/kernelconfig.html 重新编译内核并重启。同时禁用基于 IP 地址的信任认证（如 .rhosts、hosts.equiv），改用 Kerberos 或密码认证的网络服务。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Linux内核2.2 TCP初始序列号可预测漏洞"
updated = "2000-12-19"

