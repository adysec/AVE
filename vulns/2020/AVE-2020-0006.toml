[basic]
description = "Microsoft SQL Server Reporting Services（SSRS）在错误处理页面请求时存在反序列化漏洞（CWE-502）。已认证的远程攻击者可向目标 SSRS 服务器发送特制的页面请求，触发不安全的 .NET 反序列化，从而在目标系统上以 SSRS 服务账户权限执行任意代码。该漏洞影响 Microsoft SQL Server 2008/2012/2014/2016/2017 等多个版本的 Reporting Services，CVSS 评分 8.8，危害等级高。Microsoft 已在 2020 年 2 月安全更新中修复此漏洞。"
published = "2020-02-11T22:15:13.400"
remediation = "立即安装 Microsoft 2020 年 2 月安全更新，具体补丁编号对应 SQL Server 版本：SQL Server 2012 SP4 (KB4532097)、SQL Server 2014 SP3 (KB4532098)、SQL Server 2016 SP2 (KB4532099)。如无法立即打补丁，可在 IIS 中限制对 ReportServer 虚拟目录的访问权限，仅允许受信任 IP 访问，并禁用 SSRS 中不必要的自定义身份验证扩展作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft SQL Server Reporting Services 远程执行代码漏洞"
updated = "2026-06-17T02:46:11.073"

