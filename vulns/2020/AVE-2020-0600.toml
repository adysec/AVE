[basic]
description = "Oracle Solaris 系统的可插拔认证模块（PAM）存在缓冲区溢出漏洞，CWE-787 越界写入。未经身份认证的远程攻击者可通过 SunSSH 服务利用多协议网络访问触发该漏洞，成功利用可导致完全接管目标系统。该漏洞影响 Solaris 10 和 11 版本，CVSS 评分 10.0，危害等级严重。注意：Solaris 11.1 及更高版本不受影响。ExploitDB 已公开该漏洞的远程 root 利用代码。"
published = "2020-10-21T15:15:24Z"
remediation = "升级 Oracle Solaris 至 11.1 或更高版本（或 ZFSSA 8.7 或更高版本），这些版本已修复该漏洞。如无法立即升级，可禁用 SunSSH 的 PAM 认证模块作为临时缓解措施，或限制网络访问仅允许可信来源连接 SSH 服务。"
score = 10
severity = "CRITICAL"
sources = ["kev"]
title = "Oracle Solaris PAM模块缓冲区溢出漏洞导致远程接管"
updated = "2026-06-17T02:55:43Z"

