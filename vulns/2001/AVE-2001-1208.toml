[basic]
description = "mailnews.cgi 1.3 及更早版本存在命令注入漏洞，远程攻击者可在提交的用户名参数中嵌入 shell 元字符（如分号、管道符、反引号等），当应用程序未对输入进行充分过滤和转义时，这些元字符会被系统 shell 解析并执行，导致攻击者可以在服务器上以 Web 进程权限执行任意操作系统命令。该漏洞影响运行受影响版本 mailnews.cgi 的所有系统，攻击者无需身份认证即可从远程发起利用。成功利用后可完全控制目标服务器，造成信息泄露、数据篡改或服务器沦陷等严重后果。"
published = "2001-05-03T04:00:00Z"
remediation = """立即升级 mailnews.cgi 至可用最新版本，或替换为维护中的替代产品（如 WebMail 或 modern Webmail 客户端）。如无法立即替换，须对 username 字段进行输入过滤，剔除或转义 shell 元字符（如 ; & | $ ` ' " ( ) * # ~ < > 等），避免将用户输入直接传入系统命令。建议在 Web 服务器层面对该 CGI 脚本的执行权限进行限制，并关闭不必要的 mailnews 功能入口。临时缓解措施可在防火墙或反向代理层拦截对 mailnews.cgi 的异常访问请求。"""
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "mailnews.cgi 远程代码执行漏洞"
updated = "2026-06-16T21:54:00Z"

