[basic]
description = "Linux 内核 MHI 总线驱动程序的 PCI 通用子模块存在不当锁定漏洞（CWE-667）。当设备在恢复操作期间不可用时，恢复工作程序会调用 pci_reset_function() 重置 PCI 设备，而该函数内部会先获取 device_lock() 再执行重置。由于恢复工作程序是异步调度的，若 device_lock() 已被持有者占用（例如 PM shutdown() 或 suspend() 回调期间驱动核心持有该锁），恢复工作程序将因等待锁而被阻塞，从而导致系统死锁。该漏洞影响运行受影响 Linux 内核版本的本地系统，低权限本地攻击者可通过触发设备故障并在系统关机或挂起期间利用该竞争条件导致系统死锁，进而造成拒绝服务。CVSS 评分 5.5，危害等级为中危。Linux 内核社区已通过将 pci_reset_function() 替换为 pci_try_reset_function() 来修复此问题，该函数在无法获取锁时返回 -EAGAIN 而非阻塞等待。"
published = "2025-04-01T16:15:26Z"
remediation = "建议将 Linux 内核升级至已修复该漏洞的最新稳定版本。Ubuntu 用户可通过执行 `sudo apt update && sudo apt upgrade` 安装 USN-7511-1 或 USN-7605-1 更新；Debian 用户请升级至 DSA-5900-1 补丁版本。对于自定义内核，需将 MHI 驱动 recovery_work 中的 `pci_reset_function()` 替换为 `pci_try_reset_function()` 以消除死锁风险。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 MHI PCI 通用驱动 死锁拒绝服务漏洞"
updated = "2026-06-17T08:44:41Z"

