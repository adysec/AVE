[basic]
description = "Internet Explorer 4.x 和 5.x 版本中存在框架域验证漏洞，浏览器窗口内框架的域来源验证机制不完善，远程攻击者可通过构造恶意网页，诱使用户访问后利用跨域框架读取客户端本地文件，导致敏感信息泄露。攻击复杂度较高，需要用户交互配合，影响范围包括使用上述 IE 版本的 Windows 系统。"
published = "2000-10-20T04:00:00.000"
remediation = '立即安装 Microsoft 安全公告 MS00-055 提供的补丁，该补丁修复了 IE 4.x 和 5.x 中的 Frame Domain Verification 漏洞。由于该漏洞年代久远，建议将 Internet Explorer 升级至最新受支持版本（IE 11），或迁移至 Microsoft Edge 等现代浏览器以获得持续安全更新。如无法升级，可在 Internet 选项的"安全"设置中将 Internet 区域的安全级别调至"高"并禁用 Active Scripting 作为临时缓解措施。'
score = 2.6
severity = "LOW"
sources = ["epss"]
title = "Microsoft Internet Explorer 跨域框架验证客户端文件读取漏洞"
updated = "2026-06-16T21:52:26.447"

