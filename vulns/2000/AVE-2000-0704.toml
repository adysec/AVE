[basic]
description = "cURL 6.1 至 7.4 版本存在远程缓冲区溢出漏洞。攻击者可通过构造超长错误消息触发 curl 或 curl-ssl 的缓冲区溢出，导致远程代码执行。该漏洞影响 cURL 6.0-1.1 之前版本及 curl-ssl 6.0-1.2 之前版本，CVSS 评分 10.0，危害等级严重。攻击者无需身份认证即可远程利用，完全控制目标系统。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 cURL 至 7.4 及以上版本（或 curl >= 6.0-1.1、curl-ssl >= 6.0-1.2），该漏洞在 7.4 版本中通过限制错误消息长度修复。如无法立即升级，可在应用层对 curl 传入的 URL 参数做长度校验和特殊字符过滤，避免触发超长错误信息。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "cURL 6.1 < 7.4 远程缓冲区溢出"
updated = "2026-06-16T21:52:53.267"

