[basic]
description = "Windows NT 4.0 SP 6a 系统中 lsass.exe 进程存在拒绝服务漏洞。具有 winnt/system32 目录写入权限的本地攻击者可通过运行 NT4ALL 利用程序并指定 SPECIAL 模式，向 lsass.exe 发送特制请求触发异常处理错误，导致 lsass.exe 崩溃，造成系统拒绝服务。该漏洞为本地利用，攻击者需先获得系统本地访问权限及特定目录写入权限，影响 Windows NT 4.0 系统。"
published = "2001-08-03T04:00:00Z"
remediation = '''
The user wants me to generate a remediation field for CVE-2001-1122. Let me analyze the vulnerability:

- Windows NT 4.0 SP 6a
- Local user with write access to winnt/system32 can cause DoS (crash in lsass.exe) by running NT4ALL exploit in 'SPECIAL' mode
- CVSS 2.1 (Low)
- Published 2001-08-03

This is a very old vulnerability (2001) for Windows NT 4.0, which is long out of support. The remediation should be practical and actionable.

Since Windows NT 4.0 is long end-of-life, the primary remediation would be to upgrade to a supported Windows version. Let me think about what specific steps to recommend.

Key points:
1. Windows NT 4.0 is EOL - no patches available
2. The vulnerability requires local write access to system32
3. Mitigation: restrict write access to system32, upgrade to supported Windows version

Let me craft a specific, actionable remediation in Chinese, ≥20 characters.<value>Windows NT 4.0 已停止支持，建议升级至受支持的 Windows 版本（如 Windows 10/11 或 Windows Server 2019/2022）。如无法升级，严格限制 winnt\system32 目录的写入权限，仅允许 Administrators 组写入，移除普通用户的写入权限，并禁用不必要的本地用户账户。
'''
