[basic]
description = "Windows 2000 系统中的 Network Dynamic Data Exchange（NetDDE）组件存在权限提升漏洞。该漏洞的原理在于 NetDDE 使用了一个不可见窗口来处理 DDE 消息，而该窗口以 WINLOGON 进程的权限运行，WINLOGON 进程拥有系统级别的 SYSTEM 权限。本地攻击者无需任何身份认证，只需向该不可见窗口发送特制的 WM_COPYDATA 消息，即可利用 DDE 消息机制将自身权限提升至 SYSTEM 级别。此漏洞影响 Windows 2000 操作系统，攻击条件为攻击者已获得目标系统的本地访问权限（例如通过交互式登录或远程桌面连接）。成功利用后，攻击者可完全控制系统，执行任意代码、修改系统配置或窃取敏感数据。Microsoft 在 2001 年 2 月发布的安全公告 MS01-007 中提供了修复补丁，建议受影响用户立即安装该安全更新以消除漏洞风险。"
published = "2001-03-12T05:00:00Z"
remediation = "安装 Microsoft 安全公告 MS01-007 补丁（KB285851），或升级至 Windows 2000 Service Pack 3。如无法立即打补丁，可通过运行 services.msc 禁用 Network DDE 服务作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Windows 2000 NetDDE 权限提升漏洞"
updated = "2026-06-16T21:53:29Z"

