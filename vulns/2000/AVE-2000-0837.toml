[basic]
description = "PHF CGI程序存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过向目标系统发送包含大量参数及长MIME头部的HTTP请求触发该漏洞，从而在服务器上执行任意命令。该漏洞影响运行PHF CGI程序的Linux/x86系统，CVSS评分为7.5，危害等级为高危。攻击者无需本地访问权限即可利用此漏洞远程控制受影响主机。"
published = "2001-01-09T05:00:00Z"
remediation = '立即从 Web 服务器文档根目录及 cgi-bin 目录中彻底删除 phf CGI 脚本，可通过执行 find / -name "phf" -type f 2>/dev/null 定位并删除该文件；同时检查 Apache 等 Web 服务器的 httpd.conf 或 apache2.conf 配置文件，确认无 ScriptAlias /cgi-bin phf 或类似指向 phf 的别名字典项映射，若有则予以移除；重新加载 Web 服务器配置以使修改生效；如确需保留电话簿查询功能，应替换为定期维护的现代化替代脚本。对于受影响的生产系统，建议将 Apache 升级至不受此漏洞影响的维护版本。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "PHF CGI 程序 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:20Z"

