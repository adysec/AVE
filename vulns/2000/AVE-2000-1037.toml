[basic]
description = 'cmd5checkpw 0.21 及更早版本中存在拒绝服务漏洞，远程攻击者可通过向 SMTP 服务发送包含未知用户名的 "SMTP AUTH" 命令，导致服务进程崩溃或资源耗尽，造成拒绝服务。攻击无需身份认证，攻击复杂度低，影响服务的可用性。'
published = "2000-12-19T05:00:00Z"
remediation = "建议升级 cmd5checkpw 至 0.22 或更高版本（若存在）；该软件已停止维护，建议迁移至其他维护中的 SMTP 认证方案（如 Dovecot SASL）。临时缓解措施：在 SMTP 服务端配置中禁用 AUTH 命令或限制未知用户名请求的速率。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Krzysztof Dabrowski cmd5checkpw SMTP AUTH 命令拒绝服务漏洞"
updated = "2026-06-16T21:52:55Z"

