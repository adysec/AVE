[basic]
description = "proot-distro 是一款用于管理 proot 容器的 Termux 工具，其安装功能中的 `_extract_plain_tar()` 和 `_apply_layer()` 函数在解压 tar 归档时仅校验了成员文件名中的 `..` 路径穿越，但未对符号链接目标（`member.linkname`）做任何安全检查。攻击者可构造恶意 tar 归档，在解压目录内植入指向宿主机绝对路径的符号链接，随后通过该符号链接将文件写入宿主机文件系统。该漏洞无需容器运行即可触发，仅需用户执行 `proot-distro install` 安装恶意归档即可实现任意文件写入，可被用于覆盖 `~/.bashrc` 等关键文件实现持久化代码执行。影响 proot-distro 5.1.5 之前版本，CVSS 评分 8.2，危害等级高。"
published = "2026-07-29T17:16:52Z"
remediation = "立即升级 proot-distro 至 5.1.5 或更高版本（`pkg upgrade proot-distro`）。如无法升级，在 `_extract_plain_tar()` 和 `_apply_layer()` 中添加对 `member.linkname` 的校验，拒绝绝对路径符号链接目标或解析后超出 rootfs 目录的符号链接。"
score = 8.2
severity = "HIGH"
sources = ["ghsa"]
title = "Termux proot-distro 符号链接逃逸任意主机文件写入漏洞"
updated = "2026-07-30T20:07:01Z"

