[basic]
description = "Linux 内核 PCF85063 RTC 驱动中的 NVMEM 读取接口存在越界写入漏洞。nvmem 子系统支持可变缓冲区大小，而底层 regmap 接口使用固定大小的 unsigned int（4 字节）存储。当 nvmem 客户端使用小于 4 字节的缓冲区调用 regmap_read 时，regmap 会向缓冲区外写入数据，导致越界写入。本地攻击者可通过构造特定的 nvmem 访问请求触发此漏洞，造成系统内存损坏，进而实现权限提升或系统崩溃。该漏洞影响使用 PCF85063 RTC 芯片的 Linux 系统，攻击者需具备本地低权限访问条件。"
published = "2025-03-06T16:15:53Z"
remediation = "建议立即升级 Linux 内核至修复版本：5.4.291、5.10.235 或 5.15.179 及以上版本，这些版本已包含针对 PCF85063 RTC 驱动 NVMEM 读取越界写入的补丁。Debian 用户可参考 DLA-4102 和 DLA-4178 公告通过 apt update && apt upgrade 更新内核包。如无法立即升级，可通过限制本地用户对 /dev/rtc 及相关 sysfs 接口的访问权限作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 PCF85063 RTC 驱动越界写入漏洞"
updated = "2026-06-17T08:14:33Z"

