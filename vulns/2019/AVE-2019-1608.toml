[basic]
description = "SonicWall SMA100 系列安全远程访问设备存在 SQL 注入漏洞，未经身份认证的远程攻击者可通过向目标设备发送特制 SQL 查询语句，绕过身份验证机制并获取未授权的只读访问权限，从而读取后台数据库中的敏感配置信息与用户数据。该漏洞源于对用户输入未进行充分校验，攻击条件要求攻击者能够通过网络访问设备管理界面，无需登录凭据即可发起利用，CVSS v3.1 评分 7.5，危害等级高。受影响版本包括 SMA100 9.0.0.3 及更早版本，SonicWall 官方已发布安全公告和固件更新修复该漏洞。"
published = "2019-12-17T23:15:14Z"
remediation = "升级 SMA100 固件到 9.0.0.4 或更高版本，该版本已修复 SQL 注入漏洞。升级路径：登录 SMA100 管理界面，依次进入「系统」→「固件」，上传 SonicWall 官方发布的修复固件完成升级。如短期内无法升级，建议在防火墙前置 WAF 规则，对 / 等路径的 SQL 注入特征（如单引号、UNION、SELECT 等关键字）进行拦截过滤，同时限制管理接口仅对可信 IP 开放，减少未授权访问面。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "SonicWall SMA100 SQL注入漏洞"
updated = "2026-06-17T02:40:38Z"

