[basic]
description = "Danware NetOp 6.0 的文件传输机制缺乏身份认证功能，远程攻击者无需任何凭证即可通过网络访问并任意读写目标系统上的文件。该漏洞允许攻击者上传恶意文件或下载敏感数据，对系统机密性、完整性和可用性均造成完全破坏。攻击条件简单，仅需目标开启文件传输服务且网络可达即可利用，无需用户交互。CVSS 评分 10.0，危害等级严重。"
published = "2000-05-23T04:00:00Z"
remediation = "立即升级 Danware NetOp 至 6.0 以上版本（如 7.0 或更高），该漏洞在后续版本中已加入文件传输认证机制。如无法升级，在防火墙中限制对 NetOp 文件传输端口（默认 TCP 6502/UDP 6502）的访问，仅允许受信任 IP 连接，并禁用不必要的文件传输功能作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Danware NetOp 6.0 文件传输机制未授权访问漏洞"
updated = "2026-06-16T21:51:58Z"

