[basic]
description = "Microsoft Network Monitor (Netmon) 的 HTTP 协议解析器存在缓冲区溢出漏洞，远程攻击者可通过向目标系统发送特制的畸形 HTTP 数据包触发该漏洞，导致攻击者能够在受影响系统上执行任意命令。该漏洞影响 Microsoft Network Monitor 产品，CVSS 评分 7.5，危害等级高危。攻击者无需身份认证即可远程利用，且无需用户交互，攻击复杂度低。"
published = "2000-12-19T05:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS00-083 对应补丁：Windows NT 4.0 Server 需先安装 Service Pack 6a 后安装补丁；Windows 2000 Server 需在 Gold 或 SP1 基础上安装补丁；SMS 1.2 需先升级到 SP4 后安装 SMS 补丁，SMS 2.0 可直接安装补丁。如无法打补丁，在防火墙上阻止外部用户向内网特定地址发送畸形数据包作为临时缓解措施，并确保 Netmon 仅以本地管理员而非域管理员身份运行。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Microsoft Network Monitor HTTP协议解析器缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:32Z"

