[basic]
description = "Better Auth 是一个 TypeScript 认证与授权库。其遗留插件 oidcProvider 和 mcp 暴露了 OAuth 2.0 令牌端点，在 refresh_token 授权模式下仅验证请求者持有绑定的 refreshToken 行及匹配的 client_id，未对机密客户端的 client_secret 进行校验。攻击者只要获取任意有效的 refresh_token（可通过数据库读取、日志捕获、浏览器端 XSS 或 mcp 场景下的 CORS 放大脚本等途径）以及公开的 client_id，即可通过 /api/auth/oauth2/token 或 /api/auth/mcp/token 端点持续伪造访问令牌和轮换刷新令牌，获得 indefinite 的持久化访问权限。攻击者利用此漏洞可在用户授权范围内读取或写入资源服务器所授权的全部资源。该漏洞影响使用 better-auth 且启用了 oidcProvider() 或 mcp() 插件的应用程序，且至少注册了一个机密 OAuth 客户端（类型为 web、native 或 user-agent-based）。已修复于 better-auth 1.6.11 版本，建议用户立即升级。"
published = "2026-07-15T18:16:47Z"
remediation = "建议将 better-auth 升级至 1.6.11 或更高版本，并将 deprecated 的 oidcProvider() 迁移至 @better-auth/oauth-provider。如暂无法升级，可强制将所有 OAuth 客户端类型设为 public 并启用 PKCE，同时在负载均衡器或反向代理层对 /api/auth/oauth2/token 和 /api/auth/mcp/token 实施 IP 白名单限制，并删除数据库中所有受影响的 oauthAccessToken 记录以撤销已泄露的 refresh_token。"
score = 9.1
severity = "CRITICAL"
sources = ["ghsa"]
title = "Better Auth 框架 oidcProvider 与 mcp 插件 OAuth refresh_token 授予因缺少客户端身份验证导致的重放漏洞"
updated = "2026-07-21T13:33:47Z"

