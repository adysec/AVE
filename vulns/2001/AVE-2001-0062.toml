[basic]
description = "CVE-2001-0168是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-05-03T04:00:00Z"
remediation = '立即将 WinVNC 升级至官方发布的安全版本，并手工修改 vnc_winsrc/winvnc/Log.cpp 文件，将第 133 行的 vsprintf(line, format, ap) 替换为 _vsnprintf(line, sizeof(line)-sizeof(TCHAR), format, ap)，重新编译部署。若无法立即升级，应将注册表项 HKEY_LOCAL_MACHINE\Software\ORL\WinVNC3\DebugLevel 的值设为 0 以关闭调试日志功能，并在防火墙规则中阻断 5800/tcp 和 5900/tcp 端口的公网访问。官方补丁文件可从 ftp://ftp.core-sdi.com/pub/patches/VNC-serverBO.patch 获取。'
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "AT&T WinVNC HTTP GET 请求缓冲区溢出漏洞"
updated = "2026-06-16T21:53:47Z"

