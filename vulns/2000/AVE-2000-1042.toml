[basic]
description = 'Element InstantShop 的 add_2_basket.asp 页面存在输入验证缺失漏洞，远程攻击者可通过修改表单中 "price" 隐藏字段的值来任意更改商品价格，实现低价或零元购。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响购物车结算流程的完整性，可能导致商家经济损失。CVSS 评分 7.5，危害等级高。'
published = "2000-12-11T05:00:00Z"
remediation = "Element InstantShop 已停止维护，无官方补丁。修复措施：(1) 修改 add_2_basket.asp 服务端代码，从数据库读取商品真实价格覆盖客户端提交的 price 参数，禁止信任隐藏表单字段；(2) 部署 WAF 规则，拦截 POST 请求中 price 参数值异常（如负数、零或与数据库价格不符）的请求；(3) 建议迁移至仍在安全维护的电商平台（如 Magento、WooCommerce），避免继续使用已停运的 InstantShop。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Element InstantShop 商品价格篡改漏洞"
updated = "2026-06-16T21:52:56Z"

