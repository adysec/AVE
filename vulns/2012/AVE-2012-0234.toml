[basic]
description = "Mozilla Firefox/Thunderbird/SeaMonkey 浏览器引擎中存在未指定的内存安全漏洞，远程攻击者可通过诱导用户访问特制网页触发垃圾回收机制与 MethodJIT 执行过程中的内存破坏，导致拒绝服务或任意代码执行。该漏洞影响 Firefox 15.0 之前版本、Thunderbird 15.0 之前版本及 SeaMonkey 2.12 之前版本，CVSS 评分 9.3，危害等级严重。"
published = "2012-08-29T10:56:39.847"
remediation = "立即升级 Mozilla Firefox 至 15.0 及以上版本、Thunderbird 至 15.0 及以上版本、SeaMonkey 至 2.12 及以上版本。对于无法立即升级的系统，可禁用 JavaScript（在 about:config 中将 javascript.enabled 设为 false）作为临时缓解措施，但会严重影响正常功能，建议优先完成版本升级。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/SeaMonkey/Thunderbird 浏览器引擎内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:40:42.587"

