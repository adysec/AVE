[basic]
description = "Linux 内核 platform/x86 子系统中 int3472 驱动程序存在空指针解引用漏洞。当设备没有 ACPI 伴生 fwnode 时，adev 指针可能为 NULL，而 skl_int3472_get_acpi_buffer() 函数在未对 adev 进行空值检查的情况下直接使用该指针，导致空指针解引用。本地低权限攻击者可通过 sysfs 手动将 int3472 驱动绑定到其他 i2c/platform 设备触发此漏洞，造成内核崩溃，导致拒绝服务。该漏洞影响使用 Intel 平台/x86 int3472 驱动的 Linux 内核系统，CVSS 评分 5.5，危害等级中等。"
published = "2025-02-27T03:15:12Z"
remediation = "立即升级 Linux 内核至以下安全版本：5.15.195、6.1.129、6.6.78、6.12.14、6.13.3 或 6.14 及以上版本。Debian 11 用户请运行 `apt update && apt upgrade linux` 应用 DLA-4102-1 安全更新；Ubuntu 22.04 LTS 用户请运行 `apt update && apt upgrade linux-image-generic` 应用 USN-8163-1 更新。Siemens SIMATIC S7-1500 MFP 用户请参考 Siemens 安全公告 SSA-019113 升级固件。如无法立即升级，可通过限制本地用户对 sysfs 接口的写入权限作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Kernel int3472 驱动程序空指针解引用漏洞"
updated = "2026-07-14T13:17:15Z"

