description = "tags. The task says I can briefly analyze first but final answer must be in <value> tags. I'll just output the value.<value>GNU userv 1.0.0 及更早版本在文件描述符交换过程中存在安全缺陷，未能正确执行文件描述符的交换操作，导致 USERV_GROUPS 与 USERV_GIDS 两个环境变量被破坏或污染，从而令本地用户得以绕过部分访问限制。该漏洞的核心原理在于权限校验所依赖的环境变量可能被非法篡改，攻击者只需具备本地登录权限，通过构造特定运行环境即可触发，进而绕过系统的访问控制机制，实现权限提升或越权操作。该漏洞 CVSS 评分为 4.6，危害等级为中危，建议受影响的用户及时升级至修复版本。"
published = "2000-10-20T04:00:00Z"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
