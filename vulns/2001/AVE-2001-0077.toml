[basic]
description = "SEDUM HTTP Server 2.0 存在目录遍历漏洞，该服务器未对 HTTP GET 请求中的文件路径进行充分过滤和校验，导致远程攻击者可通过在请求路径中插入 .. (dot dot) 序列实现目录穿越，从而读取服务器文件系统上的任意敏感文件。该漏洞影响范围为运行 SEDUM HTTP Server 2.0 的所有系统，攻击者无需身份认证即可利用，攻击条件为能够向目标服务器发送特制的 HTTP GET 请求，利用方式为构造包含多层 ../ 路径穿越序列的请求，即可突破 Web 根目录限制访问系统配置文件、密码文件或其他敏感数据，造成信息泄露风险。"
published = "2001-05-03T04:00:00.000"
remediation = "建议将 SEDUM HTTP Server 2.0 替换为 Apache、Nginx 等仍受支持的现代 HTTP 服务器；如确需临时继续使用，应在服务器配置中严格过滤 URL 中的 ../ 和 .../ 序列，限制 Web 根目录外的文件访问权限，并在防火墙或反向代理层禁止外部直接访问服务器端口，仅允许通过前端代理转发请求。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "SEDUM HTTP Server 2.0 目录遍历漏洞"
updated = "2026-06-16T21:53:52.067"

