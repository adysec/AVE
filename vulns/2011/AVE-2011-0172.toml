[basic]
description = "Google Chrome 浏览器中的 WebKit 渲染引擎存在释放后使用（use-after-free）漏洞。该漏洞位于子框架（subframe）加载处理逻辑中，当浏览器在加载嵌套子页面时，若内存中的对象已被释放而程序仍尝试继续访问该对象，即可触发此漏洞。未经身份认证的远程攻击者可构造包含恶意内容的特制网页，诱导用户访问该网页，当浏览器解析并加载其中的子框架页面时触发漏洞，导致浏览器崩溃（拒绝服务），在某些情况下可进一步执行任意代码，完全控制用户系统。该漏洞影响 Google Chrome 17.0.963.56 之前的所有版本，CVSS v3 基础评分 7.5，危害等级高。Google 已在 17.0.963.56 版本中修复此漏洞，建议用户尽快升级浏览器至最新版本以消除安全风险。"
published = "2012-02-16T20:55:03Z"
remediation = "建议立即将 Google Chrome 浏览器升级至 17.0.963.56 或更高版本。用户可通过点击浏览器菜单中的“关于 Google Chrome”触发自动更新检查并安装最新安全补丁，以修复 subframe 加载相关的内存管理漏洞。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome WebKit 释放后使用漏洞"
updated = "2026-06-16T23:32:26Z"

