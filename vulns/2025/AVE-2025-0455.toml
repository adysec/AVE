[basic]
description = "Google Chrome for Windows 的 Media 组件存在不恰当实现漏洞，远程攻击者可通过构造特制的 HTML 页面并诱骗用户执行特定的 UI 手势交互，从而实施域名欺骗攻击。该漏洞允许攻击者在浏览器地址栏或安全指示器中伪造目标域名，使用户误信正在访问合法网站。攻击需要用户交互（如点击或拖拽操作），降低了攻击门槛。该漏洞影响 Windows 平台上 141.0.7390.54 之前版本的 Google Chrome 浏览器，CVSS 评分 6.3，危害等级中危。用户需升级至 Chrome 141.0.7390.54 或更高版本以修复此问题。"
published = "2025-11-06T22:15:39Z"
remediation = "建议立即将 Google Chrome 升级至 141.0.7390.54 或更高版本（Windows 平台），可通过 Chrome 菜单 > 帮助 > 关于 Google Chrome 自动检查更新。基于 Chromium 的浏览器（如 Edge、Brave 等）请同步更新至对应版本。如无法立即升级，可配置组策略禁用不可信来源的 HTML 页面交互，并提醒用户勿点击可疑链接或执行非预期的 UI 操作。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome Media 组件域欺骗漏洞"
updated = "2026-06-17T08:29:52Z"

