[basic]
description = "Apple Safari浏览器WebKit渲染引擎存在内存破坏漏洞，远程攻击者可构造恶意网站或特制图像文件（如TIFF、PNG、JPEG格式），诱使用户访问或加载后触发内存损坏，进而实现远程代码执行或导致应用程序崩溃拒绝服务。该漏洞影响Safari 6.0及更早版本，以及iOS 6.0之前系统，攻击者无需身份认证即可在目标设备上执行任意代码。"
published = "2012-07-25T20:55:03.820"
remediation = "Mac 用户请将 Safari 升级至 6.0 或更高版本（OS X Mountain Lion 10.8 已内置 Safari 6.0；OS X Lion 用户可升级至 Safari 6.0.1），iOS 用户请升级至 iOS 6.0 或更高版本。如无法立即升级，应避免访问未知或恶意网站，同时在 Safari 中启用安全浏览功能以降低风险。Apple 已通过改进 WebKit 内存处理修复了该漏洞。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:38.823"

