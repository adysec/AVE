[basic]
description = "OpenBSD 的 photurisd 守护进程存在格式化字符串漏洞。本地攻击者可通过在配置文件目录名中插入 %n、%s 等格式化字符，当 photurisd 处理该目录名时触发格式化字符串解析，导致攻击者能够以 photurisd 进程权限执行任意命令。该漏洞影响 OpenBSD 系统，利用条件为攻击者拥有本地访问权限，无需额外认证即可利用。成功利用后可实现权限提升或执行恶意代码，危害系统安全。"
published = "2000-12-11T05:00:00.000"
remediation = "升级 OpenBSD 至 2.8 或更高版本，该漏洞已在 OpenBSD 2.8 中修复。如无法升级，可禁用 photurisd 服务（在 /etc/rc.conf 中设置 photurisd_flags=NO），并确保不受信任的用户无法控制配置文件目录名称。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "OpenBSD photurisd 格式化字符串漏洞"
updated = "2026-06-16T21:52:57.190"

