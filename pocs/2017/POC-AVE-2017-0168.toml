[info]
author = "AVE"
description = "通过向 Jenkins CLI 端点 /cli 发送特制 HTTP POST 请求（含 download/upload 双通道），检测目标是否运行存在反序列化漏洞的 Jenkins 版本。若服务器返回 Jenkins Remoting 协议特征数据，说明 CLI 接口开放且可能受 CVE-2017-1000353 影响。"
id = "POC-AVE-2017-0168"
name = "Jenkins CLI 反序列化远程代码执行漏洞 PoC"
severity = "critical"
tags = [
    "cve-2017-1000353",
    "jenkins",
    "rce",
    "deserialization",
]
vuln_id = [
    "CVE-2017-1000353",
    "AVE-2017-0168",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cli"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
Content-type = "application/x-www-form-urlencoded"
Session = "00000000-0000-0000-0000-000000000001"
Side = "download"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "JENKINS REMOTING CAPACITY",
    "remoting",
]

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cli"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
Content-type = "application/octet-stream"
Session = "00000000-0000-0000-0000-000000000001"
Side = "upload"
Transfer-Encoding = "chunked"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "JENKINS REMOTING CAPACITY",
    "remoting",
]
