[basic]
description = "Apache Tomcat 7.0.0 至 7.0.79 版本在 Windows 系统上存在危险类型文件上传漏洞。当 Default Servlet 的 readonly 初始化参数设置为 false（即允许 PUT 方法）时，远程攻击者可通过发送特制 HTTP PUT 请求向服务器上传包含恶意代码的 JSP 文件，随后通过访问该 JSP 文件触发服务器端执行任意代码。该漏洞利用条件为 Tomcat 开启 PUT 方法且未对上传文件类型做严格校验，攻击者无需认证即可远程利用，可完全控制目标服务器。官方已在 Tomcat 7.0.81 版本中修复此漏洞。"
published = "2017-09-19T13:29:00.190"
remediation = "升级 Apache Tomcat 至 7.0.80 及以上版本（或 8.0.47+ / 8.5.23+ / 9.0.1+）。如无法立即升级，在 conf/web.xml 中将 Default Servlet 的 readonly 参数设为 true（默认值），或通过防火墙/反向代理限制 PUT 方法的访问来源。"
score = 8.1
severity = "HIGH"
sources = ["kev"]
title = "Apache Tomcat PUT 文件上传远程代码执行漏洞"
updated = "2026-06-17T01:03:37.697"

