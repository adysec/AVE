[basic]
description = "Linux 内核 LoongArch 架构存在 DMA 内存对齐配置不当漏洞。系统中 ARCH_DMA_MINALIGN 默认值为 1，但部分龙芯架构专用设备（如 APBDMA）需要 16 字节对齐的 DMA 缓冲区。当分配的内存缓冲区长度过小时，硬件在写入缓存行（cacheline）时可能发生错误，导致缓存一致性问题、数据损坏或系统崩溃。具有本地低权限访问权限的攻击者可通过向 DMA 操作提交特制的小尺寸缓冲区，触发缓存行错误写入，进而可能导致内核内存损坏、信息泄露或权限提升。该漏洞影响运行 Linux 内核的龙芯架构系统，CVSS v3.1 评分为 7.8。龙芯架构社区已通过将 ARCH_DMA_MINALIGN 从默认值 1 提升至 16 以修复此问题，需升级内核至包含该补丁的版本以彻底消除风险。"
published = "2025-04-16T15:15:58Z"
remediation = "升级到 Linux kernel 6.1.134 或更高版本，该版本已将 LoongArch 架构的 ARCH_DMA_MINALIGN 从 1 增加到 16，修复了 DMA 缓冲区对齐不足导致的 cacheline 写入错误问题。受影响系统还可通过重新编译内核，在 arch/loongarch/include/asm/cache.h 中添加 #define ARCH_DMA_MINALIGN 16 作为临时缓解措施，确保 kmalloc 分配的 DMA 缓冲区满足 APBDMA 等设备的 16 字节对齐要求。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 LoongArch 架构 DMA 内存对齐本地权限提升漏洞"
updated = "2026-07-30T06:22:08Z"

