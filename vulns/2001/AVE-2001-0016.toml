[basic]
description = "ssldump 0.9 beta1 版本存在格式字符串漏洞，远程攻击者可通过向目标服务发送包含恶意格式字符串说明符的特制 URL，利用该漏洞触发格式化函数误解析用户输入，导致拒绝服务或获取 root 权限。由于 ssldump 以 root 权限运行，攻击成功可完全控制受影响的系统。该漏洞影响 ssldump 0.9b1 版本，CVSS 评分 10.0，危害等级严重。"
published = "2001-02-16T05:00:00Z"
remediation = "升级 ssldump 至 0.9b2 或更高版本，该版本已修复格式字符串处理缺陷。可从 https://github.com/adulau/ssldump 获取最新源码编译安装。如无法升级，避免在不可信网络环境中以 root 权限运行 ssldump，并限制网络嗅探接口的访问范围作为临时缓解。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "ssldump 0.9b1 格式字符串漏洞"
updated = "2026-06-16T21:53:31Z"

