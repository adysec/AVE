[basic]
description = "NullSoft Winamp 2.64 及更早版本在处理 M3U 播放列表文件时存在缓冲区溢出漏洞。攻击者可通过构造包含超长 #EXTINF: 扩展字段的恶意 .m3u 文件，诱使用户在 Winamp 中打开该文件，触发栈缓冲区溢出，从而在目标系统上执行任意命令。该漏洞无需身份认证即可远程利用，影响所有使用 Winamp 2.64 及之前版本的用户。"
published = "2000-07-20T04:00:00Z"
remediation = "升级 Winamp 至 2.65 或更高版本，该版本已修复 M3U 播放列表解析中的缓冲区溢出漏洞。如无法升级，避免打开来源不明的 .m3u 文件，并考虑使用其他播放器作为替代方案。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "NullSoft Winamp 2.64 .m3u 播放列表缓冲区溢出漏洞"
updated = "2026-06-16T21:52:08Z"

