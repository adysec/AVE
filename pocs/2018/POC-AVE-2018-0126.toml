[info]
author = "AVE"
description = "通过向 jtreelink/dialogs/links.php 的 parent 参数注入 UNION SELECT 语句，检测目标是否存在 SQL 注入漏洞。若响应中包含 md5 校验值，则证明注入成功。"
id = "POC-AVE-2018-0126"
name = "Joomla JCK Editor 6.4.4 SQL注入 PoC"
severity = "critical"
tags = ["ave-2018-0126"]
vuln_id = [
    "CVE-2018-17254",
    "AVE-2018-0126",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/plugins/editors/jckeditor/plugins/jtreelink/dialogs/links.php"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
Referer = "{{BaseURL}}"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["nuclei-template"]
