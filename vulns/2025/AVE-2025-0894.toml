[basic]
description = "go-git 是一个用纯 Go 语言编写的高度可扩展的 Git 实现库。在 v5.13 之前的版本中发现存在拒绝服务（DoS）漏洞。攻击者可通过向 go-git 客户端提供恶意构造的 Git 服务器响应，触发客户端资源耗尽，导致服务不可用。该漏洞影响 go-git v4 及更高版本的所有用户。攻击者无需身份认证即可在远程利用此漏洞，只需控制或伪造一个 Git 服务器并向目标客户端发送特制响应即可触发。受影响版本包括所有 v4.x 至 v5.12.x 的 go-git 版本。建议用户将 go-git 升级至 v5.13 版本以修复该漏洞。"
published = "2025-01-06T17:15:47Z"
remediation = "建议将 go-git 升级至 v5.13.0 或更高版本以修复此漏洞。对于 Go 项目，可通过执行 go get github.com/go-git/go-git/v5@latest 更新依赖；若使用 Go modules，请修改 go.mod 文件中 require github.com/go-git/go-git/v5 v5.13.0 后运行 go mod tidy。如因兼容性无法立即升级，可临时限制不可信 Git 服务器的连接或禁用对不受控仓库的自动克隆功能以降低攻击面。升级后建议重新编译并测试应用功能。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "go-git 客户端 拒绝服务漏洞"
updated = "2026-06-17T08:43:51Z"

