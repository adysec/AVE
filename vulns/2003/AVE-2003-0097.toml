[basic]
description = "tags.<value>semi MIME 库 1.14.5 及更早版本、以及 wemi 1.14.0 及可能的其他版本在创建临时文件时使用了不安全的文件名，未对临时文件进行原子性创建或权限限制。本地攻击者可通过符号链接（symlink）攻击，将临时文件链接到系统中的任意文件，从而在程序以相应权限写入临时数据时覆盖目标文件内容。该漏洞影响 Debian Linux 及相关发行版上使用上述库的应用程序，攻击者需要具备本地访问权限才能利用。通过预先创建指向敏感文件（如 /etc/passwd 或用户配置文件）的符号链接，攻击者可篡改系统文件或提升权限，造成拒绝服务或权限提升后果。"
published = "2003-08-18T04:00:00Z"
remediation = '建议将 semi 升级至 1.14.3.cvs.2001.08.10-1woody2 或更高版本（当前 Debian 稳定版为 1.14.7~0.20230104-1），wemi 升级至 1.14.0.20010802wemiko-1.3 或更高版本。Debian 用户可通过 apt-get update && apt-get install --only-upgrade semi wemi 进行升级，升级后使用 dpkg -l | grep -E "semi|wemi" 确认版本。RHEL 2 用户需安装 Red Hat 于 2003 年 10 月 2 日发布的 RHSA-2003:231 补丁，执行 up2date 或 rpm -Fvh semi-*.rpm。如无法立即升级且 semi 或 wemi 非必需，建议通过 apt-get remove --purge semi wemi 卸载，或设置文件系统 nofollow 限制以临时阻止符号链接利用。'
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "Debian semi MIME 库 符号链接攻击任意文件写入漏洞"
updated = "2026-06-16T22:02:12Z"

