[basic]
description = "EServ 2.92 Build 2982 邮件服务器存在缓冲区溢出漏洞，远程未授权攻击者可通过发送超长的 HELO 和 MAIL FROM SMTP 命令触发缓冲区溢出，导致服务拒绝服务甚至可能执行任意代码。该漏洞影响 EServ 2.92 Build 2982 版本，攻击者无需认证即可远程发送畸形 SMTP 命令触发漏洞，CVSS 评分 7.5（高危），影响机密性、完整性和可用性。攻击者可通过网络远程发送超长 SMTP 命令触发缓冲区溢出，导致服务崩溃或潜在的任意代码执行。建议升级至修复版本或限制 SMTP 服务访问。"
published = "2000-12-19T05:00:00.000"
remediation = "升级eserv到最新可用版本，建议使用2000-2001年间发布的正式补丁版；启用命令长度限制，配置HELO和MAIL FROM命令最大接受字节数为256以下；部署反轰击防护，限制单个IP连接速率并设置超时时间；使用防火墙规则过滤异常长命令，部署流量整形设备缓解攻击影响。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Eserv Eserv 2.92 Build 2982 拒绝服务漏洞"
updated = "2026-06-16T21:52:44.277"

