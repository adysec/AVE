[basic]
description = "Lars Ellingsen guestserver.cgi 脚本存在命令注入漏洞，未经身份认证的远程攻击者可在 email 参数中注入 shell 元字符（如分号、管道符等），从而在目标服务器上执行任意系统命令。该漏洞影响运行 guestserver.cgi 的 Web 服务器，攻击者无需登录即可通过构造恶意的 email 字段参数触发漏洞，完全控制受影响的主机系统。由于漏洞利用条件极低且攻击效果为任意代码执行，CVSS 评分高达 10.0，危害等级为严重。攻击者可利用该漏洞获取服务器权限、窃取敏感数据或进一步渗透内网。建议立即升级或打补丁修复 guestserver.cgi，并对输入参数进行严格的过滤与转义。"
published = "2001-05-03T04:00:00Z"
remediation = "建议升级到 Guestserver 5.x 或更高版本，该版本已修复 email 参数的 shell 元字符注入问题。如无法立即升级，可临时禁用或删除 guestserver.cgi 脚本，并在 Web 服务器层面对包含分号、竖线、反引号、美元符号等 shell 元字符的 email 参数请求实施拦截。同时应对 email 字段进行严格的输入验证，仅允许合法的电子邮件格式字符，禁止传入特殊符号。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Lars Ellingsen guestserver.cgi 远程代码执行漏洞"
updated = "2026-06-16T21:53:49Z"

