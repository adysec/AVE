[basic]
description = "MIT Kerberos V5 的 ASN.1 解码器存在整数符号错误漏洞，在 krb5 1.2.5 之前版本中，远程攻击者可通过向目标系统发送特制的包含大无符号数据元素长度的 ASN.1 编码数据包，该长度值随后被作为负数使用，触发解码器处理异常，导致目标 Kerberos 服务崩溃，造成拒绝服务。该漏洞影响 MIT Kerberos 5-1.2.1 至 1.2.4 版本，攻击者无需认证即可远程触发，CVSS 评分 5.0，危害等级中等。Red Hat 已发布安全公告 RHSA-2003-052 修复此漏洞。"
published = "2003-02-19T05:00:00Z"
remediation = "升级 MIT Kerberos V5 至 krb5 1.2.5 或更高版本，该版本修复了 ASN.1 解码器中的整数符号错误。如无法立即升级，可在网络边界限制对 Kerberos 服务（默认端口 88/udp）的访问，仅允许受信任的客户端连接以降低攻击面。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "MIT Kerberos 5 ASN.1 解码器拒绝服务漏洞"
updated = "2026-06-16T21:56:38Z"

