[basic]
description = "WPGraphQL 0.2.3 插件中的 createComment 变异函数未对请求执行充分的身份认证与权限校验，导致未认证的远程攻击者能够通过向 WordPress 站点发送特制 GraphQL 请求，在任意文章下发布评论，即便该文章或站点已全局禁用评论功能。该漏洞影响所有使用 WPGraphQL 0.2.3 版本的 WordPress 网站，攻击者无需登录凭据或特殊权限，仅需具备对 GraphQL 端点的网络访问权限即可发起利用，从而可能导致垃圾评论泛滥、内容篡改或作为进一步渗透的跳板。WPGraphQL 已在 v0.3.0 版本中修复此问题，建议受影响用户及时升级。"
published = "2019-06-10T18:29:01Z"
remediation = "立即将 WordPress 的 WPGraphQL 插件从 0.2.3 升级到 0.3.0 或更高版本，0.3.0 引入了 Model Layer 访问控制层，修复了 createComment 等 GraphQL 变更操作缺乏身份验证的问题。升级方式为登录 WordPress 后台，进入「插件」页面，在 WPGraphQL 条目上点击「立即更新」；若后台更新不可用，可手动上传 0.3.0 版本插件包覆盖安装。如因业务原因无法立即升级，建议临时停用 WPGraphQL 插件或通过 WordPress 插件禁用功能将其 deactivate，以阻断未认证用户通过 GraphQL endpoint 发布评论的利用路径，升级完成后重新启用并验证插件正常运行。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress WPGraphQL 访问控制错误漏洞"
updated = "2026-06-17T02:44:46Z"

