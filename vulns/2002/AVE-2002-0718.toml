[basic]
description = "AlsaPlayer 0.99.71 存在本地缓冲区溢出漏洞。当该音频播放软件以 setuid root 权限安装时，本地用户可通过向命令行参数传入超长字符串，例如通过 -f（指定音频文件名）或 -o（指定输出文件）参数，触发程序在解析参数时的缓冲区溢出，从而在目标系统上以 root 权限执行任意代码。该漏洞攻击前提是程序被设置为 setuid root，攻击者需具备本地账户访问权限，无需网络远程交互。Exploit-DB 已公开编号为 21814 的利用代码，极大降低了利用门槛，可导致本地权限提升与系统完全受控。"
published = "2002-12-31T05:00:00Z"
remediation = "建议立即升级 AlsaPlayer 至 0.99.72 及更高版本（官方已在后续版本修复 -f/-o 及插件路径参数的长度校验缺陷）。该软件默认并非 setuid，漏洞仅在以 setuid root 方式安装时才可利用，因此若暂无补丁可打，请立即移除其 setuid 位：执行 chmod 755 /usr/bin/alsaplayer 或 chmod u-s，禁止它获取 root 特权；同时避免以 root 身份运行以普通用户参数调用的 alasaplayer，并限制仅可信用户可写二进制所在目录以防本地攻击者替换文件。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "AlsaPlayer AlsaPlayer 0.99.71 本地缓冲区溢出漏洞"
updated = "2026-06-16T22:00:15Z"

