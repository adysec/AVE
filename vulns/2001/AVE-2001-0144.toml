[basic]
description = "Windows 98 和 Windows 2000 操作系统内置的 Java 虚拟机（JVM）在运行 Java applet 时对网络套接字（socket）的分配缺乏必要的限制机制。远程攻击者可构造包含恶意 Java applet 的网页或 HTML 格式电子邮件，当用户使用内置 Java 客户端浏览该网页或打开邮件时，恶意 applet 便可在用户系统上以低权限执行。该 applet 通过循环调用 DatagramSocket 构造函数大量创建 UDP 套接字，迅速耗尽系统的套接字资源池，导致操作系统无法再分配新的 UDP 或 TCP 连接，从而造成拒绝服务。受影响的具体表现为：Windows 2000 系统无法进行正常的 DNS 域名解析，Windows 98 系统无法接受任何新的 TCP 连接，严重时可导致系统崩溃。该漏洞由安全研究员 Georgi Guninski 于 2001 年 2 月发现并公开，攻击复杂度较高（AC:H），但攻击者无需任何身份认证即可远程触发，且用户仅需正常浏览网页或打开邮件即可遭攻击，无需任何额外交互操作。"
published = "2001-05-03T04:00:00Z"
remediation = "建议升级至受支持的 Windows 版本（如 Windows 10/11），并禁用浏览器中的 Java Applet 功能（IE/Edge 设置 → Internet 选项 → 安全 → 自定义级别 → 禁用 Java）。若必须保留旧系统，可在防火墙层面封锁 UDP 端口 135/137/138/445，或通过组策略限制非受信代码执行 Java。"
score = 2.6
severity = "LOW"
sources = ["cve"]
title = "Microsoft Windows 98/2000 Java Applet UDP Socket 拒绝服务漏洞"
updated = "2026-06-16T21:54:06Z"

