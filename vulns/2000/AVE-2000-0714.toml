[basic]
description = "Microsoft Windows 95/98/Me 操作系统中的文件和打印共享服务（File and Print Sharing service）存在共享密码绕过漏洞。该漏洞源于共享访问控制中密码验证逻辑缺陷：当用户尝试访问受密码保护的文件共享时，系统仅校验用户提供密码的第一个字符是否与真实密码的第一个字符匹配，而非完整密码字符串。远程攻击者可利用此缺陷，无需完整密码凭据，仅发送一个包含正确首字符的单字节密码即可绕过共享访问控制，未经授权访问共享文件或目录。受影响范围包括 Windows 95、Windows 98 和 Windows Millennium Edition 等旧版操作系统的共享资源。攻击条件简单，攻击者仅需网络访问共享服务即可，无需本地访问或身份验证。利用方式为向目标共享发送特制的单字节密码认证请求，实现绕过共享密码访问控制的目的。"
published = "2000-12-19T05:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS00-072 补丁：Windows 95 下载 273991USA5.EXE，Windows 98/98SE 下载 273991USA8.EXE，Windows Me 下载 273991USAM.EXE，并重启系统。补丁下载地址为 Microsoft 官网支持知识库文章 Q273991。如无法立即更新，进入「控制面板→网络→文件与打印共享」关闭 File and Print Sharing 服务，或在共享文件夹上启用用户级访问控制（需加入 Windows NT 域），避免使用仅凭口令的共享级保护。"
score = 6.4
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows 9x/ME 共享密码绕过漏洞"
updated = "2026-06-16T21:52:54Z"

