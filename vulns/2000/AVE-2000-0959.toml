[basic]
description = "Auction Weaver 1.0 至 1.04 版本存在路径遍历漏洞，远程攻击者无需身份认证即可通过在 username 或 bidfile 表单字段中注入 ..（点点）序列实现目录跳转，从而读取服务器上的任意文件。该漏洞源于应用程序未对用户输入的文件路径进行充分过滤和校验，导致攻击者可越权访问系统敏感文件，造成信息泄露。CVSS 评分 5.0，危害等级中危。"
published = "2000-12-19T05:00:00Z"
remediation = "该产品已停止维护，无官方补丁可用。建议立即停用 Auction Weaver 或将应用迁移至其他仍在维护的竞拍平台。如无法停用，应在 Web 服务器（如 Apache/Nginx）层面配置输入过滤规则，拦截包含 `..` 或 `%2e%2e` 的请求参数；同时限制 Web 进程对文件系统的读取权限，仅允许访问应用必需目录，防止读取 `/etc/passwd` 等敏感文件。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Auction Weaver 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:52:31Z"

