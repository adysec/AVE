[basic]
description = "WordPress 的 Download Manager 插件在 2.9.94 版本之前存在跨站脚本（XSS）漏洞（CWE-79）。该漏洞源于插件在 category 短代码（shortcode）功能中对 `orderby`、`search[publish_date]` 等参数的输入过滤与输出转义不充分，攻击者无需任何权限，即可将恶意构造的 JavaScript 载荷注入这些参数并生成恶意链接。当受害者点击该链接时，恶意脚本会在其浏览器会话中以当前用户权限执行，可导致会话 Cookie 窃取、账户接管、敏感信息泄露或页面内容篡改。攻击向量为网络、攻击复杂度低，但需诱导用户交互，CVSS 3.0 评分为 6.1，危害等级中危，影响 WordPress Download Manager 2.9.94 之前的所有版本，官方已在 2.9.94 版本中修复。"
published = "2019-09-03T18:15:12Z"
remediation = "立即将 WordPress 的 Download Manager 插件升级至 2.9.94 或更高版本（该版本修复了 category 短代码功能中 orderby、search[publish_date] 等参数未正确转义导致的存储型 XSS 问题），可在 WordPress 后台「插件 → 已安装的插件」中点击更新，或从 https://wordpress.org/plugins/download-manager/ 下载覆盖更新。若暂时无法升级，作为临时缓解措施：停止在文章或页面的 category 短代码中渲染任何来自用户输入的可信度较低的参数，并安装启用 Web 应用防火墙（如 Wordfence）对含 orderby、search[publish_date] 等参数的请求进行过滤拦截；同时在后台限制贡献者/订阅者角色发布含该短代码内容的权限，降低被恶意利用的风险。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress download-manager插件跨站脚本（XSS）漏洞"
updated = "2026-06-17T02:21:16Z"

