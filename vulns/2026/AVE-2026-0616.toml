[basic]
description = "Cloudreve 文件事件流存在越权访问漏洞。当单文件分享的接收者打开文件事件流（`GET /api/v4/file/events?uri=<share-root>`）时，系统将订阅者注册到分享文件所属的父文件夹而非文件本身，导致接收者能够实时接收父文件夹中其他未分享文件的活动事件（包括创建、重命名、修改、删除等操作及文件名元数据）。攻击者只需拥有有效的单文件分享链接并登录认证即可触发，无需额外权限。该漏洞影响 Cloudreve 3.x 及 4.x 版本，CVSS 评分 5.4，危害等级中危。虽然不直接泄露文件内容，但暴露了未授权文件的元数据信息，可能被用于进一步的信息收集和攻击。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级 Cloudreve 至 v4.18.0 或更高版本（该版本已通过 commit 0b00dd3 修复，在单文件分享视图下拒绝事件流订阅）。如无法立即升级，可在管理面板中将 `fs_event_push_enabled` 设为 `0` 以临时禁用文件事件推送功能，阻断信息泄露风险。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Cloudreve 文件事件流越权访问漏洞"
updated = "2026-01-01T00:00:00Z"

