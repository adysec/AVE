[basic]
description = "OpenSSL 默认未启用 RSA 盲化机制，存在计时侧信道攻击漏洞。本地或远程攻击者可通过精确测量 Montgomery 约减中额外规约操作的次数差异，以及 Karatsuba 与普通整数乘法算法之间的执行时间差异，推断出服务器的 RSA 私钥信息。该漏洞影响 OpenSSL 0.9.7 及之前版本，攻击者无需身份认证即可通过网络远程发起计时攻击，导致私钥泄露，危害严重。建议升级至 OpenSSL 0.9.7b 或更高版本并启用 RSA 盲化。"
published = "2003-03-31T05:00:00Z"
remediation = "立即升级 OpenSSL 至 0.9.7b 或 0.9.6j 及以上版本，该版本默认启用 RSA Blinding 机制以防御计时攻击。如无法升级，可在编译时添加 -DOPENSSL_NO_FORCE_RSA_BLINDING 禁用强制盲化，或手动调用 RSA_blinding_on() 开启盲化。各发行版用户请安装对应安全更新：Debian 安装 DSA-288 补丁、Red Hat 安装 RHSA-2003:101/102、Gentoo 安装 GLSA-200303-23。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "OpenSSL RSA Timing侧信道攻击信息泄露漏洞"
updated = "2026-06-16T22:01:38Z"

