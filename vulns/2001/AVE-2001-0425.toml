[basic]
description = "THQ Volition 开发的 Red Faction 游戏服务端与客户端存在拒绝服务漏洞。远程攻击者无需认证即可向目标主机的 UDP 7755 端口发送特制数据包，导致游戏服务端或客户端进程崩溃挂起，无法正常提供服务。攻击条件简单，仅需知道目标 IP 地址即可发起攻击，使用 nmap 等工具发送 UDP 探测包即可触发该漏洞。该漏洞影响 Red Faction 1.0 及 1.1 版本。"
published = "2001-12-07T05:00:00Z"
remediation = "在防火墙或路由器层面阻止 UDP 端口 7755 的入站流量，防止外部攻击者向游戏服务器/客户端发送恶意数据包。如使用软件防火墙（如 Windows 防火墙），添加入站规则禁止 UDP 7755 端口。建议升级到厂商已修复的最新版本（如有），或停止使用该版本游戏服务。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "THQ Volition Red Faction 游戏服务器/客户端拒绝服务漏洞"
updated = "2026-06-16T21:55:17Z"

