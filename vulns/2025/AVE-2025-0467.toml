[basic]
description = "Google Chrome 的 Sync 同步功能组件中存在堆缓冲区溢出漏洞，远程攻击者可通过构造特制的 HTML 页面诱导用户访问，触发越界内存读取，导致敏感信息泄露或系统崩溃。该漏洞影响 Chrome 141.0.7390.65 之前版本，CVSS 评分 8.1，危害等级高。攻击者需要用户交互（点击链接）才能成功利用，无需身份认证，攻击复杂度低。Google 已在 Chrome 141.0.7390.65 版本中修复此漏洞。"
published = "2025-11-06T23:15:35Z"
remediation = "升级 Google Chrome 至 141.0.7390.65 或更高版本。Fedora 用户执行 `sudo dnf update chromium` 更新至 141.0.7390.122。Debian/Ubuntu 用户通过 `sudo apt update && sudo apt install chromium-browser` 获取修复版本。如无法立即升级，可限制用户仅访问可信网站作为临时缓解措施。"
score = 8.1
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome Sync 堆缓冲区溢出漏洞"
updated = "2026-06-17T08:30:29Z"

