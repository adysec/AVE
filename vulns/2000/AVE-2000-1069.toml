[basic]
description = "HP Jetdirect 打印机卡中的 Telnet 服务存在缓冲区溢出漏洞，该漏洞影响 X.08.20 及更早版本的固件。攻击者可通过向目标系统发送特制的 Telnet 数据包，利用此漏洞触发缓冲区溢出，导致 Telnet 服务崩溃，引发拒绝服务攻击。该漏洞允许未经身份验证的远程攻击者破坏服务可用性，影响范围涵盖部署了受影响固件的 HP Jetdirect 打印机产品。利用此漏洞攻击者可发送精心构造的网络包，触发溢出并使进程终止，从而使打印机服务不可用。"
published = "2000-12-11T05:00:00Z"
remediation = "立即更新 HP JetDirect 打印机卡固件至 X.08.20 及以上版本，修复 Telnet 服务缓冲区溢出漏洞。如无法立即更新，建议通过防火墙禁用 Telnet 端口 23 访问，并限制管理端口访问范围以降低被利用风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "HP Jetdirect Telnet 服务缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:53:04Z"

