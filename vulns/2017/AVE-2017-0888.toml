[basic]
description = "Cisco IOS 15.1/15.2/15.4 及 IOS XE 3.14~3.18 版本的 UDP 处理代码存在资源管理漏洞。由于软件在创建 UDP 套接字后未正确关闭空闲套接字，未经身份认证的远程攻击者可向目标设备发送目标端口为 0 的特制 UDP 数据包，导致输入接口队列持续积压 UDP 报文，形成接口队列楔入（interface queue wedge），最终造成拒绝服务（DoS）条件。该漏洞影响大量 Cisco 路由器和交换机设备，CVSS 评分 7.5，危害等级高。当输入队列收到 250 个报文后会自动恢复，但攻击者可持续发送数据包维持拒绝服务状态。"
published = "2017-09-07T21:29:00Z"
remediation = "该漏洞已被 CISA 列入已知被利用漏洞目录，建议立即升级至 Cisco 修复版本（通过 Cisco bug ID CSCup10024、CSCva95506、CSCvc96281、CSCve64219 查询对应 IOS/IOS XE 修复版本）。如无法立即升级，可在所有接口配置 hold-queue 值大于 250（如 hold-queue 350 in）以缓解队列阻塞；或配置扩展 ACL 拒绝目标端口为 0 的 UDP 报文（access-list 180 deny udp any any eq 0），并将 ACL 应用到所有设备接口。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS/IOS XE UDP 拒绝服务漏洞"
updated = "2026-06-17T01:22:40Z"

