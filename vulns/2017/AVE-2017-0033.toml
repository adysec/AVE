[basic]
description = "Windows SMBv1 服务器存在远程代码执行漏洞（EternalBlue/MS17-010）。攻击者可通过向目标系统的 SMBv1 服务发送特制数据包，利用 SMB 协议解析过程中的内存处理缺陷触发缓冲区溢出，从而在目标系统上以 SYSTEM 权限执行任意代码。该漏洞影响 Windows Vista SP2、Windows Server 2008 SP2/R2 SP1、Windows 7 SP1、Windows 8.1、Windows Server 2012 Gold/R2、Windows RT 8.1、Windows 10 Gold/1511/1607 及 Windows Server 2016 等多个版本。攻击者无需用户交互即可远程利用，CVSS 评分 8.8，危害等级高。该漏洞被广泛用于 WannaCry、NotPetya 等勒索软件的大规模传播，造成全球性破坏。Microsoft 已于 2017 年 3 月安全更新（MS17-010）中修复此漏洞。"
published = "2017-03-17T00:59:04Z"
remediation = "立即安装微软 2017 年 3 月安全公告 MS17-010 对应补丁，各 Windows 版本补丁编号为 KB4012212/KB4012215/KB4012216/KB4012606/KB4013198。如无法打补丁，在防火墙/安全组中阻止 TCP 445/139 端口入站流量，并禁用 SMBv1 协议（通过 PowerShell 执行：Set-SmbServerConfiguration -EnableSMB1Protocol $false）。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows SMBv1 远程代码执行漏洞"
updated = "2026-06-17T00:57:09Z"

