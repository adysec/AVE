[basic]
description = "Google Chrome 21.0.1180.57（Mac OS X/Linux）及 21.0.1180.60（Windows/Chrome Frame）之前版本存在资源管理错误漏洞（CWE-399）。当用户访问恶意构造的网站时，浏览器不会对大量连续下载操作弹出确认提示，导致攻击者可诱导用户触发大量自动下载，从而耗尽系统存储和网络带宽资源，造成拒绝服务。该漏洞攻击复杂度较高，需要用户交互配合，CVSS 评分 4.3，危害等级中危。"
published = "2012-08-06T15:55:01Z"
remediation = "升级 Google Chrome 至 21.0.1180.60（Windows/Chrome Frame）或 21.0.1180.57（Mac/Linux）及以上版本，该版本已修复大量下载未提示问题，在连续下载前会弹出用户确认对话框。如无法立即升级，可在浏览器设置中禁用自动下载功能或通过组策略限制下载行为作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 过多下载未提示资源消耗漏洞"
updated = "2026-06-16T23:42:12Z"

