[basic]
description = "BusyBox 1.37.0及之前版本中的 netstat 工具存在 ANSI 转义序列注入漏洞。本地攻击者可通过创建恶意网络应用程序，在进程名 argv[0] 中嵌入 ANSI 终端转义序列，当受害用户使用 netstat 命令查看网络连接时，终端将解析这些恶意转义序列，导致终端锁定或显示异常，造成拒绝服务。该漏洞攻击复杂度高，需本地访问且依赖用户交互，影响面有限。"
published = "2025-04-23T18:16:03Z"
remediation = "升级 BusyBox 至 1.37.0 以上版本，或应用 Alpine Linux 提供的补丁 0036-Fix-CVE-2024-58251-sanitize-process-names-when-calli.patch 对 netstat 输出中的进程名进行转义处理。如无法立即升级，避免在不可信终端环境中执行 netstat 命令，或使用 `cat` 等管道重定向 netstat 输出以阻止 ANSI 转义序列生效。"
score = 2.5
severity = "LOW"
sources = ["msrc"]
title = "BusyBox netstat ANSI终端转义序列注入拒绝服务漏洞"
updated = "2026-06-17T08:14:42Z"

