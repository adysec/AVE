[basic]
description = "Windows NTLM 存在欺骗漏洞，由于 NTLM 身份认证协议中的保护机制失效，未经身份认证的远程攻击者可通过诱导用户访问恶意服务器或打开特制文件，触发 NTLM 凭据泄露。成功利用该漏洞可导致攻击者获取目标用户的 NTLM 哈希值，进而用于离线破解或中继攻击。该漏洞影响 Windows 10/11 及 Windows Server 多个版本，CVSS 评分 6.5，需用户交互方可利用。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:33Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新 (KB5050061)，可通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载。受影响系统包括：Windows 10 1507 需升级至 10.0.10240.20890 及以上、Windows 10 1607 需升级至 10.0.14393.7699 及以上、Windows 10 1809 需升级至 10.0.17763.6775 及以上、Windows 10 21H2/22H2 需升级至 10.0.19044.5371/10.0.19045.5371 及以上、Windows 11 22H2/23H2/24H2 需分别升级至 10.0.22621.4751/10.0.22631.4751/10.0.26100.2894 及以上、Windows Server 2016/2019/2022/2025 需升级至对应修复版本。如无法立即打补丁，可限制不受信任来源对 NTLM 服务的访问，并教育用户不要点击可疑链接或打开不可信文件作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows NTLM 欺骗漏洞"
updated = "2026-06-17T08:42:48Z"

