[basic]
description = "Google Chrome 132.0.6834.83 之前版本的导航（Navigation）组件中存在不当实现漏洞（CWE-79），远程攻击者可通过构造特制的 HTML 页面诱导用户访问，利用该漏洞实现权限提升。成功利用后攻击者可获取高机密性、高完整性及高可用性影响，包括窃取敏感数据、篡改页面内容或执行任意代码。攻击复杂度低，无需身份认证，但需要用户交互（如点击链接）。Google 已在 Chrome 132.0.6834.83 版本中修复。"
published = "2025-01-15T11:15:10Z"
remediation = "立即将 Google Chrome 升级至 132.0.6834.83 或更高版本，可通过 Chrome 设置中的「关于 Chrome」自动检查更新。使用 Chromium 内核的浏览器（如 Edge、Brave）需同步更新至对应版本。无法立即更新时，建议禁用 JavaScript 解析不可信 HTML 页面作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome 导航不当实现权限提升漏洞"
updated = "2026-06-17T08:26:29Z"

