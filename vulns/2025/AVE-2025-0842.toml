[basic]
description = "Windows DHCP 客户端服务存在使用后释放（Use-After-Free，CWE-416）漏洞。攻击者需与目标位于同一网络段，通过发送特制的 DHCP 响应报文，在客户端处理响应时触发对已释放内存的非法访问，从而导致远程代码执行。该攻击需要用户交互且攻击复杂度较高，但成功利用后可完全控制目标系统的机密性、完整性和可用性。影响 Windows 11 24H2 及 Windows Server 2025 等版本。"
published = "2025-02-11T18:15:36Z"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新（KB5051987），将 Windows 11 24H2 升级至 10.0.26100.3194 及以上版本，Windows Server 2025 升级至 10.0.26100.3194 及以上版本。无法立即打补丁时，限制 DHCP 服务对不可信网络段的暴露，并禁用不必要的 DHCP 中继代理以降低攻击面。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows DHCP 客户端服务远程代码执行漏洞"
updated = "2026-06-17T08:43:14Z"

