[basic]
description = "ISC BIND 9.2.1 之前版本存在拒绝服务漏洞（DoS_findtype）。该漏洞源于 message.c 中 dns_message_findtype() 函数对 rdataset 参数的错误处理缺陷——当该参数不为 NULL 时，函数未能正确处理特定错误条件。攻击者仅需向目标 BIND 服务器发送一个精心构造的畸形 DNS 响应包，即可触发此未处理的错误条件，导致命名服务进程异常终止，造成 DNS 服务中断。该漏洞无需身份认证，远程即可利用，攻击门槛极低，对 DNS 服务可用性造成严重影响。受影响版本包括 BIND 9.0 至 9.2.0 系列，ISC 已在 BIND 9.2.1 版本中修复此问题，用户应尽快升级至修复版本。"
published = "2002-06-18T04:00:00Z"
remediation = "立即将 ISC BIND 9 升级至 9.2.1 或更高版本，该版本已修复 dns_message_findtype() 函数对畸形 DNS 报文处理不当导致的拒绝服务问题。如无法立即升级，可在防火墙或 iptables 中限制对 DNS 服务端口的访问来源，仅允许可信 IP 段发起 DNS 查询，以降低被攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "ISC BIND 9 DNS 拒绝服务漏洞"
updated = "2026-06-16T21:57:22Z"

