[basic]
description = "libxml2 中存在堆缓冲区溢出漏洞，当 Google Chrome 浏览器（版本低于 16.0.912.75）解析特制的 XML 数据时触发该漏洞。远程攻击者可通过诱导用户访问恶意网页或打开精心构造的 XML 文件，利用该漏洞造成浏览器崩溃（拒绝服务），甚至可能实现任意代码执行。该漏洞影响广泛使用 libxml2 库的 Google Chrome 浏览器，CVSS 评分 7.5，危害等级高。"
published = "2012-01-07T11:55:13Z"
remediation = "升级 Google Chrome 至 16.0.912.75 及以上版本，该版本已修复 libxml2 堆缓冲区溢出漏洞。对于使用 libxml2 的 Linux 发行版，升级 libxml2 至 2.7.8.9 及以上安全版本。Apple iOS 用户应升级至 iOS 6.0 及以上版本。如无法立即升级，可配置 Web 应用防火墙（WAF）规则过滤包含畸形 XML 的请求作为临时缓解。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome libxml2 堆缓冲区溢出漏洞"
updated = "2026-06-16T23:34:09Z"

