[basic]
description = "Linux netkit 软件包中的 telnet 守护进程（telnetd）在版本低于 netkit-telnet-0.16 时存在安全绕过漏洞。当 telnetd 以 -L 命令行选项运行时，未经身份认证的远程攻击者可利用该漏洞绕过 telnet 登录认证机制，直接获取远程 shell 访问权限。该漏洞影响 Caldera OpenLinux eDesktop 和 eServer 等发行版，攻击者无需任何凭据即可通过网络远程利用，且利用方式简单、无需特殊交互条件，成功利用后可对目标系统造成保密性、完整性和可用性方面的损害。CVSS 评分为 7.5，危害等级高。Caldera 已在安全公告 CSSA-2000-008.0 中发布补丁，建议升级至 netkit-telnet-0.16 或更高版本以修复此漏洞。"
published = "2001-08-31T04:00:00Z"
remediation = "升级 netkit-telnet 到 0.16 或更高版本以修复此漏洞。若使用 Caldera OpenLinux eDesktop/eServer，请安装 Caldera 安全公告 CSSA-2000-008.0 中发布的补丁包。临时缓解措施：停止使用 -L 命令行选项启动 telnetd，或通过 xinetd/inetd 配置禁用 telnet 服务，改用 SSH 替代 Telnet 以彻底消除风险。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Caldera OpenLinux EDESKTOP/ESERVER Telnetd 身份验证绕过漏洞"
updated = "2026-06-16T21:53:21Z"

