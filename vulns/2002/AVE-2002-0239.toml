[basic]
description = "Thunderstone TEXIS 3.0 的 CGI 脚本存在全路径泄漏漏洞，未经身份认证的远程攻击者可通过向目标服务器发送对不存在文件或目录的 HTTP 请求触发该漏洞。当请求的资源不存在时，服务器返回的错误页面中会包含 Web 根目录的完整物理路径名，导致攻击者能够获取服务器文件系统的目录结构和敏感系统信息，为后续的定向攻击提供侦察数据。该漏洞影响 TEXIS 3.0 及更早版本，攻击者仅需构造一次简单的 HTTP 请求即可完成信息获取，无需凭据且攻击复杂度低。Thunderstone 已在后续版本 4.03.1049406926 中修复此问题，建议管理员升级至安全版本并加强 Web 应用错误信息配置，避免向客户端暴露内部路径信息。"
published = "2002-05-29T04:00:00Z"
remediation = "升级 Thunderstone TEXIS 至 4.03.1049406926 或更高版本以修复路径泄露漏洞。若无法立即升级，可在 Web 服务器（如 Apache/Nginx）中配置自定义错误页面，屏蔽 CGI 脚本返回的错误信息中暴露的完整文件路径，同时通过访问控制规则限制对 /texis/ 目录的远程访问。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Thunderstone TEXIS 路径泄露漏洞"
updated = "2026-06-16T21:57:06Z"

