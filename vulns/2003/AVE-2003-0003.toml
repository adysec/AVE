[basic]
description = "Linux 内核 2.4.10 至 2.4.21-pre4 版本中的 O_DIRECT 特性存在安全漏洞。当进程以 O_DIRECT 标志打开文件时，内核未能正确处理直接 I/O 操作的缓存同步机制，导致本地攻击者可通过构造特定的文件读写操作，利用该漏洞读取本应已被删除但仍在磁盘缓存中的文件内容，从而获取其他用户的敏感信息；或通过破坏文件系统元数据的一致性导致文件系统损坏。攻击者需具备本地系统访问权限及文件写入权限，无法远程利用。"
published = "2003-02-19T05:00:00Z"
remediation = "升级 Linux 内核至 2.4.21 正式版或更高版本。Red Hat 用户安装 RHSA-2003:025 提供的更新内核；Debian 用户参照 DSA-358/DSA-423 升级；Mandrake 用户安装 MDKSA-2003:014 更新。如无法升级，限制本地用户对 O_DIRECT 特性的访问权限作为临时缓解。"
score = 3.6
severity = "LOW"
sources = ["redhat"]
title = "Linux Kernel O_DIRECT 信息泄露与文件系统损坏漏洞"
updated = "2026-06-16T22:01:21Z"

