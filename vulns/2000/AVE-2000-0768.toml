[basic]
description = "L-Soft Listserv 1.8d 及更早版本的 Web 归档组件存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过发送超长查询字符串触发缓冲区溢出，进而在目标系统上以服务进程权限执行任意命令。该漏洞影响 L-Soft Listserv 1.8d 及更早版本，CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），属于高危漏洞。攻击者无需身份认证即可远程发起攻击，通过构造超长查询字符串触发缓冲区溢出，实现远程代码执行。L-Soft 已发布修复版本，建议用户尽快升级到 1.8d 之后的版本。"
published = "2000-07-17T04:00:00Z"
remediation = "建议立即升级 L-Soft Listserv 至 1.8e 或更高版本，官方已在 1.8e 版本中修复该缓冲区溢出漏洞。如暂时无法升级，可在 Web 服务器层面配置查询字符串长度限制（如限制 query string 长度不超过 256 字符），并在 Web 应用防火墙（WAF）层面拦截超长查询字符串请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "L-Soft Listserv 1.8d 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:09Z"

