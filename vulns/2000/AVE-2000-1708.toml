[basic]
description = "NetBSD 系统中 Global 3.55 及更早版本包含的 global.cgi CGI 程序存在命令注入漏洞。远程攻击者无需身份认证即可向该 CGI 脚本传递包含 shell 元字符的特制输入，从而在目标服务器上执行任意操作系统命令。该漏洞利用条件简单、攻击门槛低，可导致攻击者完全接管服务器，造成严重的信息泄露与系统破坏风险。"
published = "2000-12-19T05:00:00Z"
remediation = """立即将 NetBSD 的 Global 软件包升级至 4.0.1 或更高版本，执行 `cd pkgsrc/devel/global; make clean; make install` 从源码重新编译安装。如暂无法升级，临时修改 `HTML/cgi-bin/global.cgi` 第 35 行，将 `$pattern =~ s/'//g;` 改为 `$pattern =~ s/"//g;` 以阻断 shell 元字符注入，阻止远程命令执行。"""
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "NetBSD Global CGI 远程代码执行漏洞"
updated = "2026-06-16T21:52:50Z"

