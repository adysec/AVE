[basic]
description = "libpcap 中的 pcap_ether_aton() 辅助函数用于将字符串解析为 MAC-48 地址并返回固定大小的缓冲区。该函数要求输入参数为格式正确的 MAC-48 地址，但这一前提条件在文档中未充分说明。当外部应用程序直接调用该公共 API 并传入不符合预期格式的字符串时，解析循环会读取超出输入字符串末尾的内存（越界读取，CWE-126），同时向分配的缓冲区之外写入数据（堆缓冲区溢出，CWE-122）。攻击者需要具备本地高权限且攻击复杂度较高，成功利用可导致受影响系统完整性受到低度影响。该漏洞影响 libpcap 1.10.6 之前的所有版本，Tcpdump Group 已通过提交 b2d2f9a 修复此问题。"
published = "2025-12-31T01:15:54Z"
remediation = "建议立即将 libpcap 升级至 1.10.6 或更高版本，该版本已通过 commit b2d2f9a9 修复了 pcap_ether_aton() 中的越界读取和越界写入问题。如无法立即升级，应避免将不可信的 MAC 地址字符串直接传入 pcap_ether_aton() 函数，并在调用前对输入字符串格式进行严格校验。"
score = 1.9
severity = "LOW"
sources = ["msrc"]
title = "libpcap pcap_ether_aton() 越界读取与越界写入漏洞"
updated = "2026-06-17T08:31:29Z"

