[basic]
description = "标签之间。<value>post-query 示例 CGI 程序存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过向目标 Web 服务器发送包含至少 10001 个参数的 HTTP POST 请求触发该溢出，成功利用后可在服务器上执行任意操作系统命令，从而完全控制目标系统。该漏洞影响部署了该示例 CGI 程序的 Web 服务器，攻击条件简单，仅需网络可达即可利用，CVSS 评分 10.0，危害等级为严重。"
published = "2001-05-03T04:00:00Z"
remediation = "立即删除或禁用 cgi-bin 目录中的 post-query 示例 CGI 程序，该程序仅用于演示用途，不应在生产环境运行。升级 Apache HTTP Server 至最新稳定版本（1.3.x 已停止维护，建议迁移至 2.4.x 系列），新版默认不再包含此类危险示例脚本。如短期内无法升级，应在 httpd.conf 中通过 ScriptAlias 或 Directory 指令严格限制 cgi-bin 目录的执行权限，仅允许必要的业务脚本运行，并在 WAF 或反向代理层设置规则拦截 POST 请求参数数量超过 1000 的异常请求，同时检查 Web 服务器日志中是否存在包含大量参数的 POST 请求记录以排查潜在攻击痕迹。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "post-query CGI 样本程序 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:54:02Z"

