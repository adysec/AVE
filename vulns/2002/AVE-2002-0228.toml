[basic]
description = 'AtheOS 0.3.7 操作系统的 chroot 函数存在目录遍历漏洞，攻击者可通过向 chdir 函数传递包含 ".." (点点) 的路径名参数逃逸 chroot 监狱环境。该漏洞影响 AtheOS 0.3.7 版本，CVSS 评分 7.5 (AV:N/AC:L/Au:N/C:P/I:P/A:P)，属于高危漏洞。攻击条件为网络可达、低攻击复杂度、无需身份认证，攻击者可远程利用该漏洞突破 chroot 限制访问文件系统任意目录，导致机密性、完整性和可用性部分受损。ExploitDB (EDB-21282) 及多个 GitHub 仓库已公开 PoC 利用代码。'
published = "2002-05-29T04:00:00Z"
remediation = 'AtheOS 0.3.7 已停止维护且无官方补丁，根本解决方案是迁移至受支持的操作系统（如 Linux LTS 或 FreeBSD）。临时缓解措施：1) 在网络边界部署防火墙限制对该主机的访问，仅允许必要管理 IP；2) 禁用非必要网络服务，降低攻击面；3) 避免依赖 chroot 进行安全隔离，改用完整虚拟机或容器技术；4) 若必须继续使用，确保 chroot 目录无 ".." 遍历路径，进程以非 root 权限运行，并删除 chroot 内不必要的 setuid 程序；5) 审计所有 chdir 调用，禁止非受信用户访问 chroot 环境。建议在 7 天内完成网络隔离，30 天内完成系统迁移。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "AtheOS AtheOS 0.3.7 目录遍历漏洞"
updated = "2026-06-16T21:57:04Z"

