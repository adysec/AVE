[basic]
description = "ACLogic CesarFTP 0.98b 及更早版本存在目录遍历漏洞。远程认证用户（包括匿名用户）可通过向 FTP 服务发送包含 `...%5c`（编码后的修改点点点）的 GET 请求，绕过路径限制读取服务器上的任意文件。攻击者无需特殊权限，仅需具备 FTP 登录凭证即可利用，可能导致敏感信息泄露。该漏洞 CVSS 评分 5.0，危害等级中危，建议升级至最新版本修复。"
published = "2001-05-27T04:00:00Z"
remediation = "建议立即停止使用已停止维护的 CesarFTP 0.98b，迁移至其他受支持的 FTP 服务器软件（如 FileZilla Server 或 vsftpd）。如无法立即迁移，可在防火墙层面限制对 FTP 端口（默认 21）的访问来源 IP，并禁用匿名登录以降低被利用风险。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "ACLogic CesarFTP 目录遍历漏洞"
updated = "2026-06-16T21:56:03Z"

