[basic]
description = "Windows MapUrlToZone 组件存在整数下溢（CWE-191）导致的拒绝服务漏洞。未经身份认证的远程攻击者无需用户交互即可向目标系统发送特制请求，触发 MapUrlToZone 函数在处理 URL 映射时发生整数下溢，导致目标系统服务崩溃或停止响应。该漏洞影响多个 Windows 版本，CVSS 评分 7.5，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:48Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新（KB5050061），可通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。受影响版本包括：Windows 10（需升级至 10.0.10240.20890/14393.7699/17763.6775/19044.5371/19045.5371 及以上）、Windows 11（需升级至 22621.4751/22631.4751/26100.2894 及以上）、Windows Server（需升级至 14393.7699/17763.6775/20348.3091/26100.2894 及以上）。如无法立即打补丁，建议限制不可信来源对 MapUrlToZone 组件的网络访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows MapUrlToZone 拒绝服务漏洞"
updated = "2026-06-17T08:42:58Z"

