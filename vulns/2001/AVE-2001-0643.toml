[basic]
description = "Palm OS 3.5.2 及更早版本的后门模式中内置了调试实用程序，攻击者在获得 Palm 设备的物理接触后，可利用该调试功能绕过系统访问限制机制，并在锁屏保护已启用的情况下直接获取设备密码。该漏洞影响所有搭载受影响版本 Palm OS 的掌上设备，攻击者无需账号凭据即可通过本地调试接口读取敏感信息。"
published = "2001-06-02T04:00:00Z"
remediation = "升级到 Palm OS 3.5.3 或更高版本，该版本已移除调试后门模式并修复了绕过机制。如无法立即升级，应禁用设备调试后门模式，并在 HotSync 设置中关闭未加密的本地传输，同时启用设备锁密码策略以增加物理攻击的难度。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Palm Palm OS 调试后门安全绕过漏洞"
updated = "2026-06-16T21:53:46Z"

