[basic]
description = "Windows 电话服务（Telephony Service）在处理特制 RPC 请求时存在堆缓冲区溢出漏洞（CWE-122）。未经身份认证的远程攻击者可诱导目标用户访问恶意服务器或发送特制请求，触发该漏洞，实现远程代码执行，获取系统完全控制权。攻击复杂度低，无需特权，但需要用户交互。CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 2 月安全更新（KB5051974/5051987/5052072）中修复此漏洞，影响 Windows 10/11 及 Windows Server 各版本。"
published = "2025-02-11T18:15:35Z"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新 KB5051974（Windows 10/11）或 KB5051987（Windows Server），也可通过 Windows Update 自动获取。对于无法立即打补丁的系统，可在防火墙层面限制 TAPI 服务的网络暴露，并禁用不必要的电话服务（TapiSrv）作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Telephony Service 远程代码执行漏洞"
updated = "2026-06-17T08:43:12Z"

