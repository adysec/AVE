[basic]
description = "id Software Quake 3 Arena 服务器 1.29f 及 1.29g 版本存在缓冲区溢出漏洞。远程攻击者无需身份认证即可向目标服务器发送特制的畸形连接数据包（以多个 char-255 字符开头），触发缓冲区溢出，导致服务器崩溃拒绝服务。该漏洞影响 Quake 3 Arena 1.29f 和 1.29g 版本，CVSS 评分 5.0，危害等级中等。目前官方已发布更新修复此漏洞。"
published = "2001-07-29T04:00:00Z"
remediation = "建议升级至 ioquake3（Quake 3 Arena 开源维护分支），该分支已修复此缓冲区溢出漏洞。下载地址 https://ioquake3.org/get-it/。如无法升级，可在防火墙层面限制 UDP 27960 端口仅允许可信 IP 连接，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "id Software Quake 3 Arena Server 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:55:58Z"

