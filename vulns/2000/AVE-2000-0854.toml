[basic]
description = "Auction Weaver CGI 脚本 1.03 及更早版本中存在路径遍历漏洞，攻击者可通过向 fromfile 参数提交包含 `..`（点点）序列的恶意请求，绕过路径限制读取服务器上的任意文件。该漏洞无需身份认证即可远程利用，攻击条件低，可导致敏感信息泄露（如配置文件、密码文件等），危害较大。"
published = "2000-10-20T04:00:00Z"
remediation = "立即升级 Auction Weaver CGI 脚本至 1.04 或更高版本。由于该产品已停止维护多年，建议彻底移除或禁用 Auction Weaver CGI 脚本，改用受支持的替代方案。如必须继续使用，应在 Web 服务器层面（如 Apache mod_rewrite）对 fromfile 参数进行过滤，拒绝包含 ../ 或 %2e%2e/ 等路径遍历特征的请求，同时限制 Web 进程对敏感系统文件的读取权限。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Auction Weaver CGI 任意文件读取漏洞"
updated = "2026-06-16T21:52:16Z"

