[basic]
description = "Check Point Firewall-1 的 SecuRemote 组件默认配置存在信息泄露漏洞。远程攻击者无需任何身份认证即可通过发送特制请求获取受保护网络的敏感配置信息，包括网络拓扑、防火墙规则等内部细节。该漏洞影响 Check Point Firewall-1 4.0 及更早版本，CVSS 评分 5.0，危害等级中危。攻击者可利用泄露的信息进一步规划针对性攻击，扩大攻击面。"
published = "2001-07-18T04:00:00Z"
remediation = '升级 Check Point Firewall-1 至 4.1 及以上版本，该版本默认禁用未认证拓扑下载。如无法升级，在 Firewall-1 管理控制台中取消勾选 "Allow unauthenticated cleartext topology downloads" 选项，并在网络边界防火墙规则中限制对 TCP 端口 256 和 264 的外部访问，仅允许受信任的 SecureRemote 客户端 IP 连接。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Check Point Firewall-1 SecuRemote 网络信息泄露漏洞"
updated = "2026-06-16T21:56:00Z"

