[basic]
description = "Samba 2.0.7 的 Web 管理工具（SWAT）存在拒绝服务漏洞，远程攻击者可通过向 SWAT 服务发送特制的非标准 URL 的 GET HTTP 请求，导致 SWAT 进程崩溃并强制重启，造成服务不可用。攻击者无需身份认证即可利用该漏洞，攻击复杂度低，但仅影响服务可用性，不涉及数据机密性和完整性。该漏洞影响 Samba 2.0.7 版本，CVSS 评分 5.0，危害等级中危。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 Samba 至 2.0.8 或更高版本，该版本已修复 SWAT 对异常 URL 请求的处理逻辑。如无法立即升级，可在 SWAT 配置文件（通常位于 /etc/swat.conf）中限制仅允许受信任内网 IP 访问，或在防火墙层面限制对 SWAT 服务端口（默认 901/TCP）的外部访问。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Samba SWAT Web管理工具拒绝服务漏洞"
updated = "2026-06-16T21:52:48.757"

