[basic]
description = "Pegasus Mail 3.11 在处理包含二进制数据的电子邮件消息时存在缓冲区溢出漏洞。远程攻击者无需身份验证，只需向使用 Pegasus Mail 的用户发送一封包含超长二进制数据的特制邮件，即可触发该缓冲区溢出，导致客户端拒绝服务，并可能进一步执行任意命令。该漏洞影响所有使用 Pegasus Mail 3.11 版本的用户，由于电子邮件是日常办公中广泛使用的通讯方式，攻击者可轻易通过社会工程或批量发送恶意邮件实施攻击，危害范围涵盖个人及企业用户。"
published = "2000-12-19T05:00:00.000"
remediation = "建议立即将 Pegasus Mail 升级至 3.12 或更高版本，以修复处理长邮件消息时产生的缓冲区溢出漏洞。对于无法立即升级的用户，建议在邮件客户端中禁用对包含二进制数据的异常长邮件的自动解析，或使用现代的安全邮件网关过滤异常的邮件载荷。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Pegasus Mail 3.11 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:47.657"

