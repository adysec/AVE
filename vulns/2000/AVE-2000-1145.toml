[basic]
description = "Lotus Domino SMTP 服务器 4.63 至 5.08 版本存在拒绝服务漏洞。远程攻击者无需任何身份验证，即可通过伪造一封发件人为 bounce@[127.0.0.1]（本地回环地址）的电子邮件消息触发该漏洞。由于 Domino 邮件系统将该地址识别为本地系统产生的自动退信地址，会将伪造邮件视为内部系统产生的退信，导致服务器进入无限邮件循环状态，持续消耗大量 CPU 资源。成功利用后，攻击者可导致目标 Domino 服务器 CPU 占用率飙升，造成正常邮件服务中断，影响企业的邮件通信和业务运转。该漏洞影响范围覆盖 Lotus Domino 4.63 到 5.0.8 版本的所有 SMTP 服务器实例。"
published = "2001-08-20T04:00:00Z"
remediation = '建议升级 Lotus Domino 至 5.0.9 或更高版本（如 5.0.10、6.0 以上），该版本修复了 SMTP 邮件循环漏洞。若暂时无法升级，可在服务器配置文件 notes.ini 中添加 SMTPMTA_Deny_Relay=1 禁止开放中继，并在配置文档中设置"拒绝发件人为本地地址的外部邮件"规则，同时在防火墙层面限制 25 端口仅允许受信 IP 访问。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Lotus Domino SMTP 服务器拒绝服务漏洞"
updated = "2026-06-16T21:53:22Z"

