[basic]
description = "Linux 内核 acct(2) 系统调用存在空指针解引用漏洞。当进程通过 acct(2) 将记账输出重定向至触发内部文件查找的目标（如 /sys/power/resume）时，调用任务已退出并执行了 exit_fs()，导致后续的文件查找操作访问已释放的 current->fs 结构体指针时触发 NULL 指针解引用，进而引发系统崩溃。该漏洞影响使用旧版内核的 Linux 发行版，攻击者需在目标系统具有本地低权限访问能力，无需用户交互即可触发，成功利用可导致系统可用性完全丧失（拒绝服务）。CVSS v3.1 评分 5.5，危害等级为中等。内核维护者已将最终写入操作重构至 workqueue 中执行，同时保留原有凭证信息，修复了此问题。"
published = "2025-03-12T10:15:16Z"
remediation = "升级 Linux 内核至包含修复的版本：5.4.291、5.10.235、5.15.179、6.1.130、6.6.80、6.12.17 或 6.13.5 及以上。可通过发行版官方更新仓库执行 apt/yum/dnf 升级。若暂无法升级内核，可临时禁用 acct 服务（systemctl disable acct；systemctl stop acct）以消除攻击面，该服务用于记录进程 accounting 信息，禁用后仅影响进程统计功能，不影响系统正常运行。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 acct 空指针解引用漏洞"
updated = "2026-07-14T13:17:24Z"

