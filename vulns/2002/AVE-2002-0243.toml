[basic]
description = "tags as requested.<value>Bugzilla 2.14 至 2.14.2 之前版本及 2.16 至 2.16rc2 之前版本存在权限配置不当漏洞。程序在创建新目录和 params 文件时将其设置为全局可写（world-writable），导致本地用户能够修改这些关键文件并执行任意代码。受影响系统包括运行 Bugzilla 2.14.x 和 2.16.x 系列的服务器，攻击者需先获得本地系统访问权限，利用该漏洞可进一步提升权限并完全控制目标系统。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 Bugzilla 至 2.14.2（2.14.x 分支）或 2.16rc2（2.16.x 分支）。修改 defparams.pl 中 WriteParams 函数的目录创建逻辑，移除对 data 目录的 chmod 777 操作，确保新创建目录和 params 文件不被赋予全局可写权限。同时检查 defparams.pl、globals.pl、importxml.pl 和 move.pl 中所有 chmod 调用，将文件权限修正为仅 Web 服务器用户可写。升级后须重新运行 checksetup.pl 以应用修复后的权限设置。临时缓解措施：以 Web 服务器用户身份手动将 data 目录和 params 文件权限设为 750 或 770，禁止全局用户写入访问。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "Bugzilla 不安全文件权限本地代码执行漏洞"
updated = "2026-06-16T21:58:10Z"

