[basic]
description = "Apple iOS 5.0.1 之前版本及 Mac OS X 10.7.2 之前版本的 CFNetwork 组件存在 URL 解析漏洞。远程攻击者无需身份认证，通过向目标用户发送特制的 HTTP 或 HTTPS 链接，可诱使用户访问非预期的恶意网站，并导致本应发送给合法网站的 Cookie 被错误传输至攻击者控制的网站，造成用户敏感信息泄露。该漏洞攻击复杂度低，影响范围包括 iPhone、iPad、iPod touch 等 iOS 设备及 Mac OS X 系统。"
published = "2011-10-14T10:55:09Z"
remediation = "将 Apple iOS 升级至 5.0.1 或更高版本，将 Mac OS X 10.7 升级至 10.7.2 或更高版本。如无法立即升级，可在受影响的 iOS 设备上避免点击不可信链接，并在 Mac OS X 中限制 Safari 浏览器对不可信 URL 的自动解析行为作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iOS CFNetwork URL解析信息泄露漏洞"
updated = "2026-06-16T23:32:57Z"

