[basic]
description = "TOTOLINK 及多家厂商路由器固件存在凭证保护不足漏洞，管理界面将管理员密码以明文形式存储在闪存和文件中。未经身份认证的远程攻击者可通过访问路由器管理接口读取该文件或直接读取闪存内容，获取管理员账号密码，进而完全控制路由器设备。该漏洞影响 TOTOLINK A3002RU、A702R、N301RT、N302R、N300RT、N200RE、N150RT、N100RE 多个系列固件版本，以及 Rutek、Sapido、CIK TELECOM、KCTVJEJU、Fibergate、Hi-Wifi、HCN、T-broad、Coship、IO-Data 等品牌的多款路由器产品。CVSS 评分 7.5，危害等级高。"
published = "2020-01-27T18:15:12.883"
remediation = "立即从 TOTOLINK 官方网站下载并升级路由器固件至最新版本（A3002RU 升级至 2.0.0 以上、A702R 升级至 2.1.3 以上、N301RT 升级至 2.1.6 以上、N302R/N300RT/N150RT/N100RE 升级至 3.4.0 以上、N200RE 升级至 4.0.0 以上）。升级完成后，登录路由器管理后台，进入系统设置→修改管理员密码，将原明文存储的弱密码更换为高强度密码。同时在路由器防火墙中关闭远程管理端口（如 WAN 口的 80/443/8080 端口），仅允许内网访问管理界面，以降低被外部攻击者利用的风险。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "TOTOLINK 路由器固件 明文存储管理员密码漏洞"
updated = "2026-06-17T02:27:18.127"

