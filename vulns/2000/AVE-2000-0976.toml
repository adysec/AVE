[basic]
description = "Microsoft IIS 4.0 存在拒绝服务漏洞，远程攻击者可通过发送畸形的 URL 请求导致 INETINFO.EXE 进程崩溃，使 IIS 服务停止响应。该漏洞影响运行 IIS 4.0 的 Microsoft Windows NT 4.0 系统，攻击者无需身份认证即可远程触发，仅需向目标 Web 服务器发送一系列特制的无效 URL 请求即可导致服务中断。CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），属于可用性影响类漏洞，利用门槛低，可造成持续的服务不可用。"
published = "2000-11-14T05:00:00.000"
remediation = "立即升级到包含此漏洞修复的Microsoft Windows NT 4.0 SP6或更高版本，并安装 IIS 4.0安全更新（例如 Microsoft 2025 年 7 月累计安全更新），或确保已安装自 2000 年以降服漏洞的特定补丁包（如 KB266680）。如无法立即打补丁，可通过修改 IIS 的元数据库禁用虚假路径处理功能，并限制传入 URL 请求长度至 1KB，防止畸形请求触发 INETINFO.EXE 崩溃。该漏洞属于 DoS 类别，暂无完整利用方式，但攻击者可能通过反复发送畸形 URL 请求导致服务不可用，升级补丁可彻底修复此问题。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft IIS 4.0 URL 畸形请求拒绝服务漏洞"
updated = "2026-06-16T21:52:36.887"

