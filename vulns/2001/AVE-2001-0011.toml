[basic]
description = "simplestmail.cgi 是 Leif M. Wright 开发的一款用于处理网页表单邮件响应的 CGI 脚本程序。该脚本在处理用户提交的 MyEmail 参数时，对 open() 函数的调用存在不安全结构，未能对用户输入中的 shell 元字符进行有效过滤。未经身份认证的远程攻击者可通过向目标服务器发送特制的 HTTP POST 请求，在 MyEmail 参数中注入 shell 元字符，从而在 Web 服务器权限下执行任意操作系统命令。该漏洞影响所有部署了 simplestmail.cgi 1.0 版本的 Web 服务器，攻击者无需认证即可获得服务器的命令执行权限，进而可能导致服务器被完全控制。CVSS 评分为 10.0，危害等级为严重。"
published = "2001-02-12T05:00:00Z"
remediation = "立即从服务器上删除 simplestmail.cgi 文件及其在 cgi-bin 目录下的所有副本，该脚本作者 Leif M. Wright 早已停止维护且从未发布补丁版本。将其替换为受支持的现代替代方案，如使用 PHP 内置 mail() 函数或成熟的 Web 表单邮件库，替代方案必须对用户输入进行严格的参数化过滤，禁止将未经过滤的输入直接传入 shell 命令。若短期内无法完成替换，应在 Web 服务器层面对 cgi-bin 目录实施访问控制（如 Apache 的 <Directory> 指令或 Nginx 的 location 匹配规则）阻断外部对该脚本的访问，同时在防火墙规则中禁止对外访问该 CGI 端口作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Leif M. Wright simplestmail.cgi 远程命令执行漏洞"
updated = "2026-06-16T21:53:30Z"

