[basic]
description = "Microsoft IIS 4.0 和 5.0 的 shtml.dll 组件在处理错误消息时未对用户输入进行正确转义，导致存在跨站脚本（XSS）漏洞。远程攻击者可通过在链接中嵌入恶意脚本，诱使用户点击后，脚本在受信任站点的安全上下文中执行，导致敏感信息泄露、会话劫持或恶意操作。攻击无需身份认证，仅需用户交互即可触发，影响范围广泛。"
published = "2000-10-20T04:00:00.000"
remediation = '安装 Microsoft 安全公告 MS00-060 提供的补丁程序。对于 IIS 4.0，升级至 Windows NT 4.0 Service Pack 6 或更高版本；对于 IIS 5.0，安装 Windows 2000 Service Pack 1 或更高版本。如无法升级，在 IIS 管理器中删除 .shtml 和 .shtm 映射到 shtml.dll 的应用程序映射，或使用 URLScan 工具过滤包含 "<script>" 等危险字符的请求作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft IIS 4.0/5.0 shtml.dll 跨站脚本漏洞"
updated = "2026-06-16T21:52:23.690"

