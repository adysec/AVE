[basic]
description = "ypbind 3.3 的日志记录功能存在格式化字符串漏洞，当 ypbind-mt 以调试模式运行时，未对用户可控的输入进行格式化字符串过滤，导致攻击者可通过向目标系统发送特制的网络请求触发该漏洞，造成文件描述符泄露，进而导致拒绝服务。该漏洞影响 SuSE Linux 6.2/6.3/6.4/7.0 等版本，CVSS 评分 10.0，危害等级严重。攻击者无需身份认证即可远程利用，建议用户升级至修复版本或避免以调试模式运行 ypbind。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级 ypbind 至 3.3 以上修复版本。各发行版对应补丁：Red Hat 安装 RHSA-2000:086 更新包，Debian 安装 2000-10-14 安全更新，Caldera 安装 CSSA-2000-039.0 补丁，Mandrake 安装 MDKSA-2000:064 更新。如无法升级，确保 ypbind 不以 debug 模式运行（移除启动参数中的 -d 或 --debug 标志），并在防火墙上限制对 ypbind 端口（默认 32768/TCP 和 32768/UDP）的访问。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "SuSE Linux ypbind 格式化字符串拒绝服务漏洞"
updated = "2026-06-16T21:53:01Z"

