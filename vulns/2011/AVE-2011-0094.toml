[basic]
description = "Adobe Flash Player 存在远程缓冲区溢出漏洞（CWE-119），攻击者可通过向用户浏览器发送特制的 SWF 文件触发内存越界写入，导致远程代码执行。该漏洞影响 Windows、Mac OS X、Linux、Solaris 平台上的 Flash Player 10.3.183.5 之前版本及 Android 平台上的 10.3.186.3 之前版本，以及 Adobe AIR 2.7.1 之前版本。攻击者无需身份认证即可远程利用，CVSS v2 评分 10.0，危害等级严重。用户只需访问包含恶意 Flash 内容的网页即可被攻击，可能导致系统完全失陷。Adobe 已在安全公告 APSB11-21 中发布修复版本。"
published = "2011-08-10T22:55:00Z"
remediation = "升级 Adobe Flash Player 至 10.3.183.5 及以上版本（Windows/Mac/Linux/Solaris），Android 版升级至 10.3.186.3 及以上，Adobe AIR 升级至 2.7.1 及以上。由于 Adobe Flash Player 已于 2020 年底停止支持，建议彻底卸载 Flash Player 并移除浏览器插件，改用 HTML5 替代方案，从根本上消除风险。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 缓冲区溢出漏洞"
updated = "2026-06-16T23:31:17Z"

