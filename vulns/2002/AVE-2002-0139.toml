[basic]
description = "Squid 代理服务器 2.4 STABLE3 及更早版本中的 SNMP 组件存在内存泄漏漏洞。远程攻击者可通过向目标 Squid 服务器的 SNMP 服务发送特制的 SNMP 请求包，触发该内存泄漏缺陷，导致系统内存资源被持续消耗直至耗尽，最终造成拒绝服务。该漏洞攻击复杂度较高（需认证或特定条件），CVSS 评分 2.6，危害等级低。厂商已发布更新版本修复此问题。"
published = "2002-03-08T05:00:00Z"
remediation = "升级 Squid 至 2.4.STABLE4 或更高版本（官方已发布补丁 squid-2.4.STABLE3-SNMP_memory_leaks.patch）。如无法升级，在 squid.conf 中添加 snmp_port 0 禁用 SNMP 服务，或设置 snmp_incoming_address 127.0.0.1 限制 SNMP 仅监听本地回环地址。各发行版用户请安装对应安全更新：Red Hat 安装 RHSA-2002:029、FreeBSD 安装 SA-02:12、Mandrake 安装 MDKSA-2002:016。"
score = 2.6
severity = "LOW"
sources = ["redhat"]
title = "Squid SNMP 内存泄漏拒绝服务漏洞"
updated = "2026-06-16T21:56:42Z"

