[info]
author = "ave"
description = "通过向 Jenkins CLI 接口发送特制序列化 Java 对象触发 LDAP 查询，检测 Jenkins Remoting 反序列化远程代码执行漏洞（CVE-2016-9299）。攻击者无需认证即可利用，影响 Jenkins < 2.32 及 LTS < 2.19.3。"
id = "POC-AVE-2016-0075"
name = "Jenkins CLI HTTP Java Deserialization PoC"
severity = "critical"
tags = ["ave-2016-0075"]
vuln_id = [
    "CVE-2016-9299",
    "AVE-2016-0075",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/cli"
protocol = "http"

[poc.requests.headers]
Content-Length = "0"
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["hudson.remoting.UserRequest"]
