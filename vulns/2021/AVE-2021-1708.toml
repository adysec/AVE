[basic]
description = "Windows 内核存在一个信息泄露漏洞，其原理在于内核在处理特定请求时未能正确清除内存区域，导致敏感的内核地址或数据被泄露给用户模式进程。攻击者在拥有低权限本地账户权限的条件下，可通过运行特制的本地程序触发该漏洞。泄露的内核地址可被攻击者用于绕过 KASLR（内核地址空间布局随机化）防御机制，从而为进一步的权限提升（LPE）或内核利用提供关键的内存布局基础。该漏洞影响多个 Windows 操作系统版本，CVSS 评分为 5.5，危害等级为中危。"
published = "2021-06-08T23:15:08Z"
remediation = "立即安装 Microsoft 2021 年 6 月安全更新，通过 Windows Update 自动更新或访问 Microsoft Update Catalog 手动下载对应补丁，将受影响系统内核升级至修复版本（Windows 10 21H1 需 ≥10.0.19043.1052、20H2 需 ≥10.0.19042.1052、2004 需 ≥10.0.19041.1052、1909 需 ≥10.0.18363.1621、1809 及 Server 2019 需 ≥10.0.17763.1999）。如暂无法立即更新，应严格遵循最小权限原则，移除本地非特权用户的管理员权限，禁用不必要的调试与性能诊断工具，并限制本地进程对 ntoskrnl.exe 及内核调试接口的访问，以降低信息泄露风险。"
score = 5.5
severity = "MEDIUM"
sources = ["kev"]
title = "Microsoft Windows 内核信息泄露漏洞"
updated = "2026-06-17T03:52:33Z"

