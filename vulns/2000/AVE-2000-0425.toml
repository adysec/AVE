[basic]
description = "Concatus IMate Web Mail Server 2.5 存在远程缓冲区溢出漏洞。该邮件服务器在处理 SMTP 协议的 HELO 命令时，未能对输入参数长度进行有效边界检查，攻击者可通过发送超长 HELO 命令触发缓冲区溢出。此漏洞影响所有使用该版本软件部署的邮件服务器，攻击者无需任何身份认证即可利用。攻击者只需向目标服务器的 SMTP 端口发送特制的超长 HELO 数据包，即可导致服务崩溃或挂起，造成拒绝服务。"
published = "2000-06-01T04:00:00Z"
remediation = "升级 Concatus IMate Web Mail Server 至最新可用版本，或迁移至仍在维护的邮件服务器（如 Postfix、Exchange）。在无法升级时，可在防火墙或反向代理层限制 SMTP HELO/EHLO 命令长度不超过 100 字符，阻断超长载荷请求以缓解缓冲区溢出攻击。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Concatus IMate Web Mail Server 2.5 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:51:53Z"

