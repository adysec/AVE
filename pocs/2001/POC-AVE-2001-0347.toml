[info]
author = "ave"
description = "验证目标 teTeX 过滤器是否存在 CVE-2001-0906 临时文件符号链接竞争条件。当 lpr 打印 .dvi 文件时，teTeX 过滤器（1.0.7 之前）在 /tmp 下创建临时文件不加安全检查，本地攻击者可预创建指向敏感目标的符号链接，利用 TOCTOU 竞争窗口覆盖文件实现权限提升。"
id = "POC-AVE-2001-0347"
name = "teTeX 过滤器临时文件竞争条件漏洞 PoC"
severity = "medium"
tags = ["ave-2001-0347"]
vuln_id = [
    "CVE-2001-0906",
    "AVE-2001-0347",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/tmp"
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["teTeX"]
