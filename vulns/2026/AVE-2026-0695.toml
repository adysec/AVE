[basic]
description = "该漏洞源于 WordPress Coding Standards (WordPressCS) 中 `WordPress.WP.EnqueuedResourceParameters` 检查项的实现缺陷。在处理 `wp_enqueue_script()` 等函数的 `$ver` 参数时，其 `is_falsy()` 方法会将重建的参数通过 `eval()` 函数执行。攻击者可通过在恶意 PHP 代码中构造特殊的参数（如 `'system'('id')`），诱导使用 `WordPress` 或 `WordPress-Extra` 规则集的 PHPCS 扫描器执行。当开发人员在本地审查第三方代码或 CI 流水线自动对 PR 进行代码风格检查时，会导致扫描主机被远程执行任意命令。该漏洞影响 3.4.1 之前的所有版本。"
published = "2026-07-28T16:18:13Z"
remediation = '建议立即将 WordPress Coding Standards (WordPressCS) 升级至 3.4.1 或更高版本。若无法立即升级，可通过在自定义 ruleset 文件中添加 `<rule ref="WordPress"><exclude name="WordPress.WP.EnqueuedResourceParameters"/></rule>` 来禁用受影响的 sniff，从而缓解风险。'
score = 8.6
severity = "HIGH"
sources = ["ghsa"]
title = "WordPress WordPressCS 任意代码执行漏洞"
updated = "2026-07-28T16:18:13Z"

