[basic]
description = "tags.<value>Guzzle 的 CookieJar 在处理缺少 Domain 属性或 Domain 为空的响应 Cookie 时，未正确保留其 host-only 状态。攻击者可利用此缺陷，使原本仅限父主机访问的 host-only Cookie 被发送至子域名，从而窃取会话标识、授权令牌等敏感信息。该漏洞影响 Guzzle 7.15.1 之前的版本，需要应用启用了 Cookie 支持并复用了同一个 CookieJar 实例，且存在从父主机向不受信任的子域名发送请求的场景。CVSS 评分为 5.0，危害等级为中等。"
