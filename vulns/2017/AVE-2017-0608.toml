[basic]
description = "ZyXEL P660HN-T1A 路由器（TrueOnline 分发版本 v1 TCLinux Fw $7.3.15.0 v001 / 3.40(ULM.0)b31）的 ViewLog.asp 页面存在命令注入漏洞，位于远程系统日志转发功能的 remote_host 参数中。未经身份认证的远程攻击者可通过构造恶意参数注入任意系统命令，在路由器上以最高权限执行代码，完全控制设备。该漏洞无需用户交互、无需认证即可远程利用，CVSS 评分 9.8（严重），影响设备的完整性、机密性与可用性。"
published = "2019-05-02T17:29:00Z"
remediation = "立即禁用路由器的远程系统日志转发功能（Remote System Log），在 Web 管理界面中取消勾选 System Log → Remote Log 中的启用选项。在防火墙层面限制对路由器 Web 管理端口（默认 80/443）的访问，仅允许受信任的内部 IP 连接。如无法禁用该功能，建议将设备替换为仍在厂商支持周期内的型号（如 ZyXEL USG 系列），或刷写第三方固件（如 OpenWrt）以彻底消除该命令注入风险。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "ZyXEL P660HN-T1A 路由器远程系统日志转发功能命令注入漏洞"
updated = "2026-06-17T01:12:42Z"

