[basic]
description = "Adobe Flash Player存在内存错误引用（use-after-free）漏洞，源于Primetime SDK在处理媒体播放器监听器对象时产生的悬空指针。未经身份认证的远程攻击者可通过诱使用户打开恶意Flash内容（如嵌入ActiveX控件的恶意网页或钓鱼邮件附件），触发该漏洞并实现任意代码执行。该漏洞影响Adobe Flash Player 28.0.0.161之前的所有版本，曾被用于针对韩国目标的定向攻击及大规模恶意邮件活动中。"
published = "2018-02-06T21:29:00Z"
remediation = "立即将 Adobe Flash Player 升级至 28.0.0.161 或更高版本，该版本修复了 Primetime SDK 中媒体播放器监听对象处理时的悬空指针问题。若已不再使用 Flash Player，建议直接卸载以彻底消除攻击面。Windows 用户可通过控制面板 > 程序和功能卸载，macOS 用户可将 /Applications/Adobe Flash Player 移至废纸篓。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Adobe Flash Player 内存错误引用远程代码执行漏洞"
updated = "2026-06-17T01:59:12Z"

