[basic]
description = "Cisco IOS 软件中 PROFINET 发现与配置协议（PN-DCP）的实现存在输入验证不当漏洞。该漏洞源于设备对入站 PN-DCP Identify Request 数据包解析不充分，未经身份认证的远程攻击者可通过向目标设备发送特制的 PN-DCP Identify Request 数据包，并持续发送正常 PN-DCP Identify Request 数据包，触发设备重新加载，导致拒绝服务（DoS）。该漏洞影响 Cisco IOS 12.2 至 15.6 版本，自 IOS 12.2(52)SE 起 PROFINET 在基础交换模块和扩展单元以太网端口上默认启用，扩大了攻击面。攻击无需用户交互，CVSS 评分 7.5，危害等级高。Cisco 已发布安全公告修复此漏洞。"
published = "2017-09-29T01:34:48Z"
remediation = "立即升级 Cisco IOS 至修复版本。使用 Cisco IOS Software Checker（https://tools.cisco.com/security/center/selectIOSVersion.x）查询受影响版本对应的修复版本，将设备升级至该修复版本或更高版本。由于无任何变通方案，升级是唯一修复途径。升级前可通过 `show running-config | include profinet` 确认 PROFINET 是否启用，若输出 `no profinet` 则不受影响；也可通过 `show profinet status` 检查 PROFINET 状态。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），建议优先处理。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS PROFINET DCP 报文解析拒绝服务漏洞"
updated = "2026-06-17T01:02:56Z"

