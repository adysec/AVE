[basic]
description = "Netscape 6.2.3 及 Mozilla 1.0 及更早版本中存在基于堆的缓冲区溢出漏洞。远程攻击者可通过向用户发送特制的 PNG 图像（包含超大宽度和高度值以及 8 位或 16 位 Alpha 通道）触发该漏洞，导致目标浏览器崩溃，甚至可能执行任意代码。攻击无需身份认证且复杂度低，CVSS 评分 7.5，危害等级高。受影响用户应升级至不受影响的版本以修复此漏洞。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 Mozilla 至 1.0.1 及以上版本，或升级 Netscape 至 6.2.4 及以上版本。由于上述浏览器均已停止维护，建议立即更换为 Firefox、Chrome 等现代浏览器，并保持自动更新开启。如无法升级，可在浏览器中禁用 PNG 图片渲染（通过 about:config 设置 image.png.enabled 为 false）作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Netscape Mozilla PNG 图片处理堆缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T22:00:34Z"

