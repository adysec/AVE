[basic]
description = "HP Intelligent Management Center（IMC）的tftpserver.exe组件存在基于栈的缓冲区溢出漏洞。远程攻击者无需身份认证，通过向目标服务器的TFTP服务发送特制的超长mode字段数据包，即可触发栈缓冲区溢出，导致任意代码执行。该漏洞影响IMC 5.0 E0101L02之前的所有版本，CVSS评分10.0，危害等级严重。HP已发布安全更新修复此漏洞。"
published = "2011-05-13T17:05:44Z"
remediation = "立即升级 HP Intelligent Management Center (IMC) 至 5.0 E0101L02 或更高版本。该补丁由 HP 官方安全公告 c02822750 提供。如无法立即升级，建议在网络边界防火墙处阻断对 TFTP 服务（默认 UDP 端口 69）的未授权访问，并限制仅可信 IP 可访问 IMC 管理端口。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "HP Intelligent Management Center 远程代码执行漏洞"
updated = "2026-06-16T23:30:14Z"

