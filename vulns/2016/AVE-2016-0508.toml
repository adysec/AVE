[basic]
description = "Apple iOS 内核存在信息泄露漏洞（CVE-2016-4655），该漏洞是 Trident 攻击链（Pegasus 间谍软件使用的零日漏洞链）的组成部分之一。攻击者可通过诱导用户安装特制恶意应用程序，利用内核内存处理缺陷读取未授权的内核内存数据，从而泄露敏感信息（如凭据、加密密钥等）。该漏洞影响 iOS 9.3.5 之前的所有版本，攻击需本地访问且依赖用户交互（如点击恶意链接或安装恶意应用），CVSS 评分 5.5，危害等级中危。Apple 已在 iOS 9.3.5 安全更新中修复此漏洞。"
published = "2016-08-25T21:59:00Z"
remediation = "立即将 iOS 设备升级至 9.3.5 或更高版本（设置 > 通用 > 软件更新）。该漏洞已被 Pegasus 间谍软件在野利用（Trident 漏洞链之一），攻击者可通过恶意 App 读取内核内存。无法升级的旧设备（如 iPhone 4s 以下）建议停止使用或限制安装不可信应用。"
score = 5.5
severity = "MEDIUM"
sources = ["kev"]
title = "Apple iOS 内核信息泄露漏洞"
updated = "2026-06-17T00:47:58Z"

