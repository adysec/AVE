[basic]
description = "Windows 2000 存在本地安全策略损坏漏洞，本地用户可通过发送畸形 RPC 流量破坏本地安全策略，导致系统拒绝服务。该漏洞源于 RPC 处理逻辑未正确验证输入数据，攻击者需具备本地访问权限且无需认证即可发送畸形 RPC 流量触发漏洞，导致本地安全策略损坏，引发系统服务拒绝服务。影响 Windows 2000 系统，CVSS 评分 2.1，属于本地拒绝服务漏洞，攻击复杂度低，无需认证，仅影响系统可用性。"
published = "2000-10-20T04:00:00Z"
remediation = "建议升级至受支持的 Windows 版本（如 Windows 10/11 或 Windows Server 2019/2022）。若必须维持 Windows 2000，请安装微软发布的 MS00-067 补丁（KB271823），并在防火墙层面封锁本地 135/445 端口 RPC 通信作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "Microsoft Windows 2000 本地安全策略损坏拒绝服务漏洞"
updated = "2026-06-16T21:52:26Z"

