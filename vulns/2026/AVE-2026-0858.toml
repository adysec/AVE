[basic]
description = "@sigstore/oci 中的 getRegistryCredentials() 函数在读取 Docker 配置文件 (~/.docker/config.json) 时，使用子字符串匹配而非精确主机名匹配来选择认证凭据。当目标镜像仓库地址与已配置的认证密钥存在子串包含关系时（如攻击者控制的 cr.io 匹配已配置的 ghcr.io），攻击者可通过控制目标镜像仓库地址，诱使系统将高权限的注册表凭据（如 GHCR、Docker Hub 或云注册表令牌）发送至其控制的恶意注册表，导致凭据泄露。该漏洞影响 @sigstore/oci <= 0.7.0 版本，CVSS 评分 9.6，危害等级严重。利用条件包括：主机 Docker 配置中存在注册表凭据、目标注册表地址可被不可信来源影响、攻击者控制的注册表主机名与已配置密钥存在子串关系。已在 @sigstore/oci@0.7.1 中修复，修复方案为采用精确主机名匹配并规范化 URL 格式。"
published = "2026-07-14T17:17:15.270"
remediation = "将 `@sigstore/oci` 升级至 0.7.1 或以上版本，该版本已将凭据匹配方式从子串匹配改为精确主机名匹配。如无法升级，确保传入 `@sigstore/oci` 的镜像仓库地址来自可信源，避免由不可信方控制目标 registry；同时限制 Docker 配置中仅保留必要凭据，避免注册表主机名存在子串包含关系，并使用短时效令牌缩小影响面。"
score = 9.6
severity = "CRITICAL"
sources = ["ghsa"]
title = "Sigstore @sigstore/oci 注册表凭据混淆漏洞"
updated = "2026-07-21T19:17:12.150"

