[basic]
description = "GIMP 在处理 TIF 图像文件时存在整数溢出漏洞，由于对用户提供的数据缺乏有效验证，在分配缓冲区前未正确检查整数运算结果，导致可被利用执行任意代码。攻击者需要诱使用户访问恶意页面或打开特制的 TIF 文件才能触发该漏洞，成功利用后可在当前进程上下文中执行任意代码。该漏洞影响 GIMP 图像处理软件，CVSS 评分 7.8，危害等级高。GIMP 官方已通过 GitLab 提交修复补丁。"
published = "2026-01-01"
remediation = "立即升级 GIMP 至包含 commit 0a45a2b5 的版本（≥3.0.0 最新稳定版），该提交修复了 TIF 文件解析中的整数溢出漏洞。如无法立即升级，应避免打开来源不明的 TIF 图像文件，并考虑在邮件网关/下载代理层面拦截可疑 TIF 附件作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "GIMP TIF 文件解析整数溢出远程代码执行漏洞"
updated = "2026-01-01"

