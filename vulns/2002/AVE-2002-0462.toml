[basic]
description = 'NewAtlanta ServletExec/ISAPI 4.1 存在目录遍历漏洞，远程攻击者可通过向 com.newatlanta.servletexec.JSP10Servlet 发送包含 "..%5c"（URL 编码的路径穿越序列）的特制请求，绕过路径限制读取服务器上的任意文件。该漏洞影响 ServletExec ISAPI 4.1 版本，攻击者无需身份认证即可通过网络远程利用，可能导致敏感信息泄露。目前已公开利用代码。'
published = "2002-10-04T04:00:00Z"
remediation = "升级到 NewAtlanta ServletExec 5.0 或更高版本，该漏洞已在后续版本中修复。如无法升级，可在 IIS 中使用 URLScan 工具拦截包含 `..%5c` 的请求路径，或在 IIS ISAPI 筛选器层面添加规则，拒绝访问 `/com.newatlanta.servletexec.JSP10Servlet/` 路径下的目录遍历请求。同时建议限制 ServletExec ISAPI 仅处理必需的 JSP/Servlet 请求，移除未使用的 Servlet 映射。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "NewAtlanta ServletExec/ISAPI 4.1 目录遍历漏洞"
updated = "2026-06-16T21:58:20Z"

