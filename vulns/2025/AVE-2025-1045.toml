[basic]
description = "Linux 内核调度器（sched/fair）子系统的 child_cfs_rq_on_list 函数中存在潜在内存损坏漏洞。该函数尝试将 'prev' 指针转换为 cfs_rq 结构体，但该指针可能源自 struct rq 的 leaf_cfs_rq_list，导致转换无效并可能引发内存破坏。由于当前内存结构布局可能尚未导致崩溃，该问题可能表现为不可预测的行为，但在结构布局发生变化时可能触发严重的内存错误或数据损坏。影响范围涵盖受影响的 Linux 内核版本，攻击者需在目标系统上拥有低权限本地访问权限（PR:L），无需用户交互即可利用此漏洞。利用成功后可导致本地权限提升或系统不稳定。修复方案是在 child_cfs_rq_on_list 函数中增加对 'prev' 指针的边界检查，确保 container_of 操作仅作用于正确的 cfs_rq 结构。"
published = "2025-04-01T16:15:22Z"
remediation = "升级 Linux 内核至修复版本：Ubuntu 22.04 LTS 升级至 5.15.0-140.150 或更高版本，Ubuntu 24.04 LTS 升级至 6.8.0-84.84 或更高版本；Debian 12 (bookworm) 升级至 linux 6.1.133-1 或更高版本。临时缓解措施：通过 sysctl 限制本地用户权限，或使用 grsecurity/PaX 等内核安全模块限制进程调度器内存访问；如业务允许，可通过 SELinux 或 AppArmor 限制非特权用户对调度子系统相关 sysfs 接口的写入访问。建议立即通过系统包管理器执行全量内核更新并重启系统，更新完成后执行 uname -r 确认内核版本已升级。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 CFS 调度器内存损坏漏洞"
updated = "2026-07-14T13:17:26Z"

