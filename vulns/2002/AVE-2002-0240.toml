[basic]
description = "Bugzilla 2.14.2 之前版本及 2.16rc2 之前版本的 queryhelp.cgi 存在访问控制缺陷，远程未授权攻击者可直接发送 HTTP 请求访问该脚本，绕过权限检查查看受限的产品和组件信息。该漏洞影响 Bugzilla 2.14.x（<2.14.2）和 2.16.x（<2.16rc2）版本，CVSS 5.0 分（AV:N/AC:L/Au:N/C:P/I:N/A:N），攻击无需认证、网络可达即可利用，攻击者只需构造针对 queryhelp.cgi 的 HTTP 请求即可获取受限产品/组件信息，属于信息泄露类漏洞。官方已在 2.14.2 和 2.16rc2 版本中修复该漏洞。"
published = "2002-08-12T04:00:00Z"
remediation = "建议立即升级 Bugzilla 至 2.14.2 或 2.16rc2 及以上版本。若暂无法升级，可在 Web 服务器层面（如 Apache）配置访问控制规则，禁止对 queryhelp.cgi 的直接 HTTP 访问，或在 Bugzilla 配置中限制 queryhelp.cgi 的访问权限仅允许授权用户访问。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Mozilla Bugzilla queryhelp.cgi 信息泄露漏洞"
updated = "2026-06-16T21:58:09Z"

