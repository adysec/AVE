[basic]
description = "Google Chrome 142.0.7444.59 之前版本的扩展程序存在策略绕过漏洞（CWE-306：关键功能缺少认证）。攻击者通过诱使用户安装恶意扩展程序，利用特制的 Chrome 扩展可从进程内存中获取敏感信息，导致机密数据泄露。该漏洞可远程利用，无需认证但需要用户交互，攻击复杂度较高，CVSS 评分 5.9，危害等级中危。"
