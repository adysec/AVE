[basic]
description = "Linux 内核的 ksmbd（SMB3 服务器）在处理客户端 oplock break notification 时存在竞争条件漏洞。当 ksmbd_work 正在处理 oplock break 通知期间，若底层连接被意外释放，工作队列结构体可能被提前释放，导致后续处理过程中发生释放后使用（use-after-free）或空指针解引用。该漏洞影响运行 Linux 内核且启用 ksmbd 模块的系统，攻击者需要具有目标服务器的网络访问权限并具备一定身份认证，可通过向 SMB 服务发送特制请求触发 oplock break 流程并利用该竞争条件，最终可能导致系统崩溃或特权提升。CVSS 评分为 8.8（高危），影响 Ubuntu 22.04/24.04 LTS 等多个发行版。"
published = "2025-04-01T16:15:26Z"
remediation = "立即升级 Linux 内核至已修复此漏洞的版本。该漏洞存在于 ksmbd（内核态 SMB 服务器）的 oplock break 通知处理流程中，可在特定条件下触发 use-after-free，导致本地低权限攻击者获得系统最高权限。受影响的 Linux 内核版本为 5.15 至 6.6.83、6.7 至 6.12.19、6.13 至 6.13.7。修复已于以下版本中合入：Ubuntu 24.04 LTS 请升级至内核 6.8.0-84.84 或更高版本，Ubuntu 24.10 请升级至内核 6.11.0-28.28 或更高版本，RHEL 9 系列请升级至内核 6.12.20 或更高版本，Debian 12 请升级至内核 6.1.123-1 或更高版本。执行 sudo apt update && sudo apt install linux-image-$(uname -r) 完成升级后重启系统。如短期内无法立即升级，可执行 sudo rmmod ksmbd 卸载 ksmbd 内核模块作为临时缓解措施，或通过防火墙屏蔽 TCP 445 端口以阻断 SMB 入站连接，直至完成内核补丁更新。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 ksmbd 使用后释放漏洞"
updated = "2026-07-30T06:21:59Z"

