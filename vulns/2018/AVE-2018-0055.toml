[basic]
description = "Cisco IOS 软件 Login Enhancements（登录增强）功能存在资源管理漏洞。未经身份认证的远程攻击者可通过向受影响设备发送特制的登录请求，触发系统资源耗尽，导致设备重载（reload），造成拒绝服务（DoS）。该漏洞影响运行 Cisco IOS 软件版本 15.4(2)T、15.4(3)M、15.4(2)CG 及后续版本的设备。攻击复杂度较高，无需用户交互即可远程触发。Cisco 已发布安全公告修复此漏洞。"
published = "2018-03-28T22:29:01Z"
remediation = "建议立即升级至包含修复的 Cisco IOS 版本，具体修复版本请参考 Cisco Bug ID CSCuy32360 对应的软件版本，通过 Cisco 软件中心（software.cisco.com）获取。该漏洞无完整变通方案，对于 CSCuy32360 可采取临时缓解措施：先配置 login block-for 再配置 login quiet-mode access-class，或在配置两者后重新加载设备。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），存在在野利用，应优先处理。"
score = 5.9
severity = "MEDIUM"
sources = ["kev"]
title = "Cisco IOS 登录增强功能资源管理错误拒绝服务漏洞"
updated = "2026-06-17T01:30:01Z"

