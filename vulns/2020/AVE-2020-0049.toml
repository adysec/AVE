[basic]
description = "Kong 的 docker-kong 部署方案（通过 2.0.3 版本）在默认配置下，其 Admin Rest API 端口可能监听在除 127.0.0.1 之外的其他网络接口上。当用户通过 docker-compose 部署 Kong 时，若未遵循安全文档中的网络层访问限制配置，Admin API 将暴露给外部网络。未经身份认证的远程攻击者可直接访问该 API 接口，执行未授权操作，包括创建/删除服务、路由、消费者、插件等，从而完全控制 API 网关。该漏洞影响 docker-compose 模板的默认配置，Kong 官方已通过文档改进提醒用户正确配置网络访问限制，以仅允许本地回环地址访问 Admin API，CVSS v3.1 评分 9.8（严重）。"
published = "2020-04-12T17:15:10Z"
remediation = "升级 Kong Docker 镜像至 2.0.4 或更高版本。在 docker-compose.yml 或 docker run 命令中将 Admin API 端口 8001 和 8444 仅绑定到 127.0.0.1，即将端口映射改为 127.0.0.1:8001:8001 和 127.0.0.1:8444:8444，而非 0.0.0.0:8001。同时在 kong.conf 中设置 admin_listen = 127.0.0.1:8001 确保 Admin API 仅监听本地回环接口。通过防火墙规则限制外部主机对 8001 端口的访问，仅允许受信任的管理节点连接。如使用 Kong Enterprise，启用 Admin API 的 RBAC 认证机制作为纵深防御。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Kong Admin API 未授权访问漏洞"
updated = "2026-06-17T02:50:39Z"

