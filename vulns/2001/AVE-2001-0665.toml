[basic]
description = "BiblioWeb 2.0 网络服务器存在目录遍历漏洞，未经身份认证的远程攻击者可通过在 HTTP GET 请求中使用 `..`（点号点号）或 `...`（三个点号）等目录穿越序列，访问服务器文件系统上的任意文件。该漏洞利用条件极低，攻击者仅需向目标服务器发送特制的 HTTP 请求即可读取敏感文件（如系统配置文件、密码文件等），无需任何认证凭据或复杂交互。该漏洞影响运行 BiblioWeb 2.0 版本的 Web 服务器，可导致敏感信息泄露，危害等级中等。"
published = "2001-05-03T04:00:00Z"
remediation = '建议立即停用 BiblioWeb 2.0 并迁移至现代维护的 Web 服务器（如 Apache HTTP Server 2.4+、Nginx 1.18+）。若必须继续使用，请在反向代理层（Nginx/Apache）配置路径规范化并拦截包含 ".." 的请求，同时在文件系统层面设置严格的目录访问控制列表（ACL）限制 Web 进程仅能访问网站根目录。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "BiblioWeb Web Server 目录遍历漏洞"
updated = "2026-06-16T21:53:55Z"

