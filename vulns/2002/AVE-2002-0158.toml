[basic]
description = "BSCW（Basic Support for Cooperative Work）协作平台 3.x 及 4.0 版本存在不安全的默认安装配置漏洞。默认情况下系统启用了用户自助注册功能，导致未经身份认证的远程攻击者无需任何凭证即可自行注册账号并登录系统，进而能够上传恶意文件、访问本应限制的协作社区资源。该漏洞影响 BSCW 3.x 全系列版本，CVSS 评分 7.5，危害等级高。厂商已发布安全更新建议关闭自助注册功能或升级至修复版本。"
published = "2002-03-25T05:00:00Z"
remediation = "在 BSCW 服务器配置文件中将 `allow_self_registration` 参数设为 `false` 以禁用用户自助注册功能；同时升级到已修复此默认配置问题的最新版本。如无法升级，在 Web 服务器（Apache/IIS）层面添加 IP 白名单访问控制，仅允许可信网段访问 BSCW 的注册页面 `/pub/english.cgi`。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "BSCW 默认配置用户自行注册漏洞"
updated = "2026-06-16T21:56:45Z"

