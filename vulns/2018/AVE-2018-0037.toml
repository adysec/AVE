[basic]
description = "Zend Server 9.1.3 之前的版本中，Zend Debugger 模块存在跨站脚本（XSS）漏洞。该漏洞由于未能对用户输入的数据进行充分的过滤和转义，导致攻击者可以通过构造包含恶意 JavaScript 代码的特制请求，诱导受害者访问该链接，从而在受害者的浏览器上下文中执行任意代码。攻击者可利用此漏洞窃取敏感 Cookie、劫持用户会话或进行其他钓鱼攻击。此漏洞影响 Zend Server 9.1.2 及更早版本，CVSS 评分为 6.1。"
published = "2018-04-19T16:29:00Z"
remediation = "建议将 Zend Server 升级至 9.1.3 或更高版本以修复 Zend Debugger 中的 XSS 漏洞。若无法立即升级，建议通过 Web 应用防火墙（WAF）过滤包含恶意脚本标签的输入请求，或限制 Zend Debugger 的访问权限仅允许信任的 IP 地址访问。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Zend Zend Server Zend Debugger 跨站脚本攻击漏洞"
updated = "2026-06-17T01:33:43Z"

