[basic]
description = "Drupal Drupalgeddon2 是一款严重的高危漏洞，由整数类型处理不当导致，影响 Windows 10/11 以及 Windows Server 2019/2022 等多个版本。该漏洞源于 Drupal 系统在处理用户输入时缺乏充分验证，导致攻击者可通过精心构造的请求实现远程代码执行。攻击者无需任何身份验证，仅需向目标服务器发送特定请求即可触发漏洞利用，攻击者的代码将以较高权限在服务器上执行。漏洞影响范围广泛，包括 Drupal 7.58 以下版本和 8.x 系列（8.3.9 以下、8.4.x 低于 8.4.6、8.5.x 低于 8.5.1 等），CVE 评分高达 9.8， CVSS 向量：CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H。攻击者可通过利用多个子系统中的默认配置缺陷，获得对目标系统的完全控制权，获取敏感信息或破坏系统完整性。微软在 2024 年 8 月的安全更新中修复了此漏洞，建议所有受影响用户立即更新以获取保护。"
published = "2018-03-29T07:29:00.260"
remediation = "立即升级 Drupal 至 7.58、8.3.9、8.4.6、8.5.1 或更高版本（对应安全公告 SA-CORE-2018-002）；若无法立即升级，应立即禁用 Drupal REST、JSON:API、HAL 等 RESTful 模块，并在 WAF 层面部署针对 Drupalgeddon2 攻击载荷（如 form_build_id、#post_render、#lazy_builder 等恶意参数）的拦截规则作为临时缓解措施"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Drupal CMS 远程代码执行漏洞"
updated = "2026-06-17T02:03:25.850"

