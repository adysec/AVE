[info]
author = "ave"
description = "向 NetWin DNews 5.3 的 DNEWSWEB CGI 程序发送包含超长 group 参数的 HTTP POST 请求，检测目标服务器是否存在缓冲区溢出漏洞。当服务器返回 500 内部服务器错误时，表明可能存在该漏洞。"
id = "POC-AVE-2000-0344"
name = "NetWin DNews DNEWSWEB CGI 缓冲区溢出漏洞检测"
severity = "medium"
tags = ["ave-2000-0344"]
vuln_id = [
    "CVE-2000-0423",
    "AVE-2000-0344",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/dnewsweb"
protocol = "http"

[poc.requests.body]
content = ""
type = "form"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [500]
type = "status"
