[basic]
description = "Win32k 内核态驱动程序的菜单管理组件中存在释放后使用（Use-After-Free）漏洞。本地攻击者可通过运行特制的应用程序触发该漏洞，在内核上下文中执行任意代码，从而获取 SYSTEM 权限。该漏洞影响 Windows 7 SP1、Windows 8.1、Windows 10、Windows Server 2008/2012/2016 等多个版本，CVSS 评分 7.8，危害等级高。攻击者需具备本地登录权限，无需用户交互即可完成提权。Microsoft 已在 2017 年 5 月安全更新中修复此漏洞。"
published = "2017-05-12T14:29:05Z"
remediation = "建议立即安装 Microsoft 2017 年 5 月安全更新（MS17-017）。各版本对应补丁编号：Windows 7 SP1 安装 KB4015217，Windows 8.1 安装 KB4015550，Windows 10 各版本安装 KB4015217/KB4015438/KB4019472，Windows Server 2012/2016 安装对应补丁。如无法立即打补丁，可限制非管理员用户登录系统作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Win32k 特权提升漏洞"
updated = "2026-06-17T00:57:21Z"

