[basic]
description = "Century Software Term For Linux 6.27.869 的 callin 程序存在命令行缓冲区溢出漏洞，本地攻击者可通过向 callin 程序传递过长的 tty 参数触发栈溢出，从而覆盖返回地址执行任意代码并获取 root 权限。该漏洞影响 Century Software Term For Linux 6.27.869 版本，攻击者需具备本地用户权限，通过构造超长 tty 参数调用 callin 程序即可触发溢出并提权至 root，CVSS 评分 7.2（高危），属于本地权限提升类缓冲区溢出漏洞。"
published = "2002-06-25T04:00:00Z"
remediation = "建议立即卸载 Century Software Term 并安装最新安全补丁。如果无法立即更新，建议禁用终端程序的 setuid 权限（chmod 777 callin），并限制对终端程序的访问权限，作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "世纪软件 Term For Linux 6.27.869 命令行缓冲区溢出漏洞"
updated = "2026-06-16T21:57:13Z"

