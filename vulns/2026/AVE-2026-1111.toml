[basic]
description = "Diesel 的 Rust SQLite 连接通过 `SqliteConnection::deserialize_readonly_database` 函数支持从字节缓冲区（`&[u8]``）运行时加载只读 SQLite 数据库。该漏洞属于释放后使用（Use After Free）类型：在 Diesel 2.3.10 之前的版本中，缓冲区被直接传递给底层 libsqlite3，但 libsqlite3 要求缓冲区在整个数据库连接生命周期内保持存活，而 Diesel 的 safe API 并未强制执行此约束。攻击者（或存在缺陷的应用程序代码）若在关闭数据库连接之前过早释放传入的字节缓冲区，将导致 libsqlite3 访问已释放的内存，可能引发内存安全违规或未定义行为。该漏洞影响所有使用 `SqliteConnection::deserialize_readonly_database` API 且缓冲区生命周期管理不当的 Rust 应用程序，受影响版本为 Diesel 2.3.10 之前的所有版本，攻击无需身份认证，攻击条件为远程或本地均可触发，具体取决于应用程序的部署场景和输入来源。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
