[basic]
description = "eXtropia WebStore 1.0/2.0 中的 html_web_store.cgi 和 web_store.cgi CGI 程序存在目录遍历漏洞，远程攻击者可通过向 page 参数传递 `..`（点点）序列进行路径穿越，从而读取服务器上的任意文件。该漏洞无需身份认证即可利用，攻击复杂度低，可导致敏感信息泄露，影响 eXtropia WebStore 1.0 及 2.0 版本。"
published = "2000-12-11T05:00:00.000"
remediation = "升级到 eXtropia WebStore 3.0 或更高版本，该版本已修复目录遍历问题。如无法升级，修改 CGI 脚本对 page 参数做输入校验，过滤 `../` 及空字节等路径遍历字符，仅允许白名单内的合法页面文件名。同时配置 Web 服务器（如 Apache）的 `AllowOverride` 和 `Options -FollowSymLinks`，限制 CGI 目录的访问权限，并移除不必要的 CGI 脚本。作为临时缓解措施，可在 Web 应用防火墙（WAF）层面添加规则拦截包含 `..` 的 page 参数请求。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "eXtropia WebStore 目录遍历漏洞"
updated = "2026-06-16T21:52:57.310"

