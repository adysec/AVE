[basic]
description = "Apple iTunes and Safari软件中存在内存破坏漏洞，主要影响运行版本低于6.0.1的Safari浏览器。该漏洞源于WebKit引擎在处理quarantine标签属性、表单自动填充及HTTPS地址栏文本粘贴等逻辑时存在的缺陷，导致安全模式未能有效触发，并可能导致本地文件内容泄露和远程代码执行。攻击者可通过向目标系统发送特制的网络数据包远程触发此漏洞，影响Windows 10/11及Windows Server 2019/2022等系统版本，CVSS评分9.8，安全等级极高，已在2024年8月安全更新中修复。"
published = "2012-09-13"
remediation = "建议立即将 iTunes 升级至 10.7 或更高版本（Windows），或将 Safari 升级至 6.0.1（Mac OS X Lion v10.7.5 / Mountain Lion v10.8.2 及以上版本已内置）。可通过 Apple 官网 support.apple.com/zh-cn/HT5485 及 HT5502 获取安全更新详情。如无法立即升级，应避免访问不受信任的网站，不打开来历不明的链接，以降低被远程执行恶意代码的风险。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 远程代码执行漏洞"
updated = "2012-09-13"

