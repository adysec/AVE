[basic]
description = "MDaemon WorldClient 5.0.5.0 及更早版本中的 WorldClient.cgi 脚本存在缓冲区溢出漏洞。攻击者通过向 NewFolder 参数提交超长文件夹名称即可触发栈缓冲区溢出，进而在受影响系统上执行任意代码。该漏洞仅影响具有本地访问权限的用户，攻击向量为本地，攻击复杂度低且无需认证。受影响产品包括 Alt-N Technologies MDaemon 邮件服务器套件的 WorldClient Web 邮件组件。成功利用可导致敏感信息泄露或权限提升。NVD 评估该漏洞 CVSS v2 评分为 2.1，危害等级为低。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 MDaemon 至 5.0.6 或更高版本以修复 WorldClient.cgi 中的缓冲区溢出漏洞。如无法立即升级，可在 MDaemon 管理控制台中临时禁用 WorldClient 服务，或在系统防火墙中限制对 WorldClient.cgi 的本地访问，并移除普通用户对 MDaemon 安装目录的写入权限。"
score = 2.1
severity = "LOW"
sources = ["exploitdb"]
title = "MDaemon WorldClient 文件夹创建缓冲区溢出漏洞"
updated = "2026-06-16T21:59:54Z"

