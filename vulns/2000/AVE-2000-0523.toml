[basic]
description = "Novell NetWare 5.0 的 SMDR.NLM 模块存在拒绝服务漏洞，远程攻击者无需身份认证即可通过向目标服务器的 UDP 40193 端口发送大量随机数据包，导致 SMDR（Station Management Data Request）服务崩溃或资源耗尽，造成系统拒绝服务。该漏洞影响 Novell NetWare 5.0 及 5.0 SP5/6.0 SP1 版本，CVSS 评分 5.0，危害等级中危。目前已有公开的 PoC 利用代码，攻击者可通过简单的网络洪水攻击实现利用。"
published = "2000-07-11T04:00:00.000"
remediation = "立即卸载 SMDR.NLM 模块（在控制台执行 `unload smdr.nlm`），并在防火墙层面阻止外部对 TCP/UDP 40193 端口的访问。由于 Novell NetWare 5.0 已停止技术支持，建议迁移至受支持的服务器操作系统（如 SUSE Linux Enterprise Server），并关闭 IPX 兼容模式以避免类似攻击面。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Novell NetWare 5.0 SMDR.NLM 拒绝服务漏洞"
updated = "2026-06-16T21:52:13.830"

