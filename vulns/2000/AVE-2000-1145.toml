[basic]
description = "Lotus Domino SMTP 服务器 4.63 至 5.08 版本存在拒绝服务漏洞，远程攻击者无需身份认证即可利用。其原理是攻击者可伪造一封发件人为 bounce@[127.0.0.1]（本地回环地址）的恶意邮件并发送至目标服务器，该发件地址会被 Domino 解析为本地主机，导致系统对退信邮件进行循环转发处理，形成无限邮件循环，从而大量消耗服务器 CPU 资源，最终使邮件服务瘫痪、无法正常响应，造成拒绝服务。整个攻击过程仅需目标系统开放 SMTP 端口即可发起，无需任何特殊权限或额外认证条件。"
published = "2001-08-20T04:00:00Z"
remediation = "建议升级到 Lotus Notes/Domino 5.0.9 或更高版本，该版本已修复 SMTP 服务器接收伪造发件人（如 bounce@[127.0.0.1]）引发邮件回环导致 CPU 耗尽的问题。若暂无法升级，可在服务器配置的 SMTP 入站连接控制中，拒绝来自 127.0.0.1 回环地址及包含本地域伪造发件人的邮件，并限制 SMTP 中继与每连接消息数，同时监控 SMTP 日志中的重复投递以尽早发现攻击。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Lotus Domino SMTP Server 拒绝服务漏洞"
updated = "2026-06-16T21:53:22Z"

