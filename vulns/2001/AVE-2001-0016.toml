[basic]
description = "ssldump 0.9 b1 版本存在格式字符串漏洞，程序在处理用户提供的 URL 输入时未对格式字符串进行充分验证，攻击者可通过在 URL 中注入恶意的格式字符串说明符来操纵内存。该漏洞影响 ssldump 0.9 b1 版本，无需身份认证的远程攻击者即可利用，只需向目标系统发送包含特制格式字符串的 URL 即可触发。成功利用后可能导致应用程序崩溃（拒绝服务），并可能进一步获取 root 权限实现远程代码执行，危害程度极高。"
published = "2001-02-16T05:00:00Z"
remediation = "立即将 ssldump 升级至 0.9b2 或更高版本，具体操作为：从官方源（https://github.com/stevemk14ebr/Pcap-Analyst 或原始项目 https://www.rtfm.com/ssldump/）下载修复后的源码包，执行 ./configure && make && make install 重新编译安装。若当前通过 Debian/Ubuntu 包管理安装，运行 apt-get update && apt-get install --only-upgrade ssldump 从发行版安全更新仓库获取补丁版本。作为临时缓解措施，在防火墙或 IDS 规则中对包含 %s、%n、%x 等格式字符串字符的 URL 进行过滤拦截，并移除 ssldump 的 setuid 位权限（chmod u-s /usr/sbin/ssldump），防止攻击者利用该漏洞以 root 权限执行任意代码。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "ssldump 0.9 b1 远程格式字符串漏洞"
updated = "2026-06-16T21:53:31Z"

