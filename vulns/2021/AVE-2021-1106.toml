[basic]
description = "Microsoft Exchange Server 存在远程代码执行漏洞，该漏洞属于 ProxyLogon 攻击链的组成部分。攻击者可通过发送特制请求利用此漏洞，在目标 Exchange Server 上执行任意代码，进而完全控制系统。该漏洞影响 Microsoft Exchange Server 2013、Exchange Server 2016 及 Exchange Server 2019 等版本。利用方式为本地攻击向量，无需身份认证但需要用户交互，攻击复杂度低，成功利用后可导致目标系统机密性、完整性和可用性完全受损，CVSS 评分为 7.8，危害等级严重。"
published = "2021-01-01T00:00:00Z"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
