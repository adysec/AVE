[basic]
description = "WebKit 渲染引擎存在内存破坏漏洞，影响 Apple Safari 6.0 之前版本及 iOS 6.0 之前版本。远程攻击者可通过构造恶意网页，利用 WebKit 在处理 TIFF、PNG、JPEG 图像及 ImageIO 过程中存在的内存错误，触发内存破坏，从而执行任意代码或导致应用程序崩溃。该漏洞攻击条件为网络可达，攻击者仅需诱导用户使用 Safari 浏览器访问特制网页即可完成利用，无需身份认证，CVSS 评分 9.3，危害等级为高危。Apple 已在 iOS 6.0 及 Safari 6.0 中修复此漏洞。"
published = "2012-07-25T20:55:03Z"
remediation = "将 iOS 设备升级至 6.0 或更高版本，或安装 Apple 2012 年 7 月 25 日发布的安全更新 (HT 5365)。同时将 Mac 上的 Safari 浏览器升级至 6.0 或更高版本。如暂无法升级，建议暂时禁用 Safari 的 JavaScript 功能并避免访问不可信网站，以降低被远程攻击的风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple iOS WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:36Z"

