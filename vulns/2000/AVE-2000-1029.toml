[basic]
description = "OpenBSD 2.7 的 IPsec 实现中存在空 AH/ESP 数据包处理缺陷，远程攻击者可通过向目标系统发送特制的空认证头（AH）或封装安全载荷（ESP）数据包触发该漏洞，导致系统内核崩溃或服务中断，造成拒绝服务。该漏洞影响 OpenBSD 2.7 版本，攻击无需身份认证，通过网络即可远程触发，危害等级中等。目前官方已发布补丁修复此问题。"
published = "2000-12-19T05:00:00Z"
remediation = "升级 OpenBSD 至 2.8 或更高版本，该版本已修复空 AH/ESP 报文处理缺陷。如无法升级，在 ipsec.conf 中添加 `block in proto ah` 和 `block in proto esp` 规则临时阻断未认证的 IPsec 流量作为缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "OpenBSD 2.7 IPsec 空 AH/ESP 数据包拒绝服务漏洞"
updated = "2026-06-16T21:52:51Z"

