[basic]
description = "Cisco Secure ACS for Windows NT 2.42 及更早版本中的 CSAdmin 模块存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标服务器 2002 端口发送超大特制数据包触发此漏洞，导致缓冲区溢出并引发拒绝服务，甚至可能执行任意命令。在 2.3x 及更高版本中，CSAdmin 模块会在崩溃后自动重启，但现有会话需重新认证；在更早版本中则需要手动重启才能恢复正常功能。该漏洞影响范围涵盖运行 CiscoSecure ACS Server 2.4(2) 及以前版本的系统，CVSS 评分为满分 10.0，危害等级极为严重。"
published = "2000-12-11T05:00:00Z"
remediation = "建议升级至 Cisco Secure ACS for Windows NT 2.4(3) 或更高版本以修复 CSAdmin 模块缓冲区溢出漏洞。如无法立即升级，可在防火墙或访问控制列表层面限制 TCP 2002 端口的访问来源，仅允许可信管理网段连接；同时配置入侵检测系统监控异常长度的数据包，并在 CSAdmin 模块启用自动重启策略以缩短服务中断时间。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Cisco Secure ACS for Windows NT CSAdmin模块远程缓冲区溢出漏洞"
updated = "2026-06-16T21:53:03Z"

