[basic]
description = "Coder OIDC 登录存在两个链式缺陷导致账户接管漏洞：邮箱回退关联未校验既有 IdP subject 关联，且 email_verified 声明仅在显式为布尔 false 时才校验，缺失或非布尔值均被视为已验证。攻击者若能在配置的 OIDC 提供商处注册或控制与受害者 Coder 账户相同邮箱，且受害者账户未关联不同的 IdP subject，即可伪造认证登录为受害者，完全接管其工作区、模板及资源。影响 Coder 2.29.7、2.32.7、2.33.8、2.34.2 之前版本，CVSS 7.4 高危。官方已在 2.29.17、2.32.7、2.33.8、2.34.2 版本修复，限制邮箱回退仅用于首次及遗留关联，并将缺失或类型异常的 email_claimed 默认为 false。缓解措施为配置 OIDC 提供商禁止自注册或强制邮箱验证后再签发令牌。"
published = "2026-07-07T22:16:53Z"
remediation = "建议立即升级 Coder 到对应修复版本：2.34 线升级至 v2.34.2，2.33 线升级至 v2.33.8，2.32 线升级至 v2.32.7，2.29 ESR 线升级至 v2.29.17。升级参考：https://github.com/coder/coder/releases。无法立即升级时，配置 OIDC 提供商禁止自助注册并强制要求 email_verified 为 true 后再签发 token，作为临时缓解措施。"
score = 7.4
severity = "HIGH"
sources = ["ghsa"]
title = "Coder Coder OIDC 登录账户接管漏洞"
updated = "2026-07-08T19:46:56Z"

