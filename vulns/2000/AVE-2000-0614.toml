[basic]
description = "xinetd 2.1.8.x 版本中存在访问控制绕过漏洞。当使用主机名进行访问控制时，如果连接发起方的主机没有反向 DNS 记录，xinetd 无法正确限制连接，导致远程攻击者可以绕过基于主机名的访问限制策略。攻击者只需控制一个没有 PTR 记录的主机即可发起连接，无需身份认证。成功利用此漏洞可导致未授权访问受保护的服务，造成信息泄露、数据篡改或服务中断等危害。"
published = "2000-06-04T04:00:00Z"
remediation = "升级 xinetd 至 2.3.0 或更高版本，该版本修复了反向 DNS 查询失败时访问控制绕过的问题。Debian 用户应安装安全更新 DSA-200006-1（已存档）。如无法升级，可在 xinetd 配置中使用 IP 地址而非主机名进行访问控制，避免依赖反向 DNS 解析。对于现代 Linux 系统，建议迁移至 systemd socket 激活替代 xinetd。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "xinetd 2.1.8.x 连接限制绕过漏洞"
updated = "2026-06-16T21:51:56Z"

