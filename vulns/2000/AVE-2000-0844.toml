[basic]
description = 'Microsoft SQL Server 2000、SQL Server 7.0 及 MSDE 1.0 中 "sa" 系统管理员账户在默认安装时密码为空，远程攻击者可通过空密码直接登录数据库系统，获取数据库管理员权限，进而执行任意 SQL 命令、创建账户、读取或篡改数据，实现完全控制数据库服务器。该漏洞已被 Voyager Alpha Force 和 Spida 等蠕虫广泛利用，影响范围包括使用这些数据库产品的第三方软件包如 Tumbleweed Secure Mail、Compaq Insight Manager 和 Visio 2000 等。'
published = "2002-08-12T04:00:00Z"
remediation = """立即为 SQL Server 的 sa 账户设置强密码（至少 12 位含大小写字母、数字和特殊字符），使用 ALTER LOGIN sa ENABLE; ALTER LOGIN sa WITH PASSWORD = '<强密码>' 命令执行。同时禁用 sa 账户或改用 Windows 身份验证模式，在 SQL Server Management Studio 中设置"仅 Windows 身份验证"。对于已停止支持的 SQL Server 2000/7.0/MSDE 1.0，建议迁移至 SQL Server 2019 或更高版本。"""
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Microsoft SQL Server sa 账户默认空密码远程权限提升漏洞"
updated = "2026-06-16T21:53:23Z"

