[basic]
description = "MySQL 3.23.x 及 4.0.x 版本中 COM_CHANGE_USER 命令存在内存损坏漏洞，远程攻击者无需身份认证即可通过向 MySQL 服务器发送特制的超长密码响应数据包，触发缓冲区溢出，导致任意代码执行。该漏洞影响 MySQL 3.23.54 之前版本及 4.0.6 之前版本，CVSS 评分 7.5，危害等级高。建议升级至 MySQL 3.23.54 或 4.0.7 及以上版本修复。"
published = "2002-12-23T05:00:00Z"
remediation = "升级到 MySQL 3.23.54 及以上版本，或 4.0.7 及以上版本。如无法立即升级，可在 my.cnf 中禁用远程连接（`bind-address=127.0.0.1`）并在防火墙限制 3306 端口仅允许可信 IP 访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "MySQL MySQL COM_CHANGE_USER 内存破坏漏洞"
updated = "2026-06-16T21:59:12Z"

