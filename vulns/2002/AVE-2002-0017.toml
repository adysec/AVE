[basic]
description = "Perl 的 Digest::MD5 模块（perl-Digest-MD5）与 Perl 解释器之间存在交互缺陷，导致处理 UTF-8 编码数据时生成错误的 MD5 校验和。攻击者可利用此缺陷构造经过篡改的 UTF-8 数据，使其通过错误的 MD5 校验从而绕过完整性验证机制。该漏洞影响所有使用 perl-Digest-MD5 模块进行数据完整性校验的 Perl 应用程序与系统，包括基于 Perl 的软件包管理系统和文件校验工具。攻击者无需身份认证即可在网络路径上发送特制的 UTF-8 数据，触发错误的校验和计算，进而实施数据篡改攻击。CVSS 评分为 7.5，危害等级为高危。Red Hat、Mandriva 等发行版已通过安全更新修复此漏洞。"
published = "2002-07-26T04:00:00Z"
remediation = "升级 perl-Digest-MD5 模块至修复版本，或更新操作系统至包含安全补丁的版本。Red Hat 用户应参照 RHSA-2002-081 升级受影响的 Perl 包，Mandriva 用户应参照 MDKSA-2002-035 更新 perl-Digest-MD5。在无法立即升级的情况下，可临时禁用依赖 MD5 校验和验证的 Perl 应用服务，或使用其他哈希算法替代 MD5 进行数据完整性校验。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Gisle Aas MD5模块 UTF-8摘要计算漏洞"
updated = "2026-06-16T21:57:58Z"

