[basic]
description = "Wingate 4.1 Beta A 及更早版本的日志文件服务存在目录遍历漏洞，远程攻击者无需身份认证即可通过向目标发送包含 URL 编码 `..` 序列的特制 HTTP GET 请求，突破路径限制读取服务器上的任意文件（如系统配置文件、密码文件等），导致敏感信息泄露。该漏洞利用方式简单，攻击门槛低，CVSS 评分 5.0，危害等级中危。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级 WinGate 至 4.2 或更高版本，该版本已修复日志服务的目录遍历漏洞。如无法升级，可在防火墙中限制仅允许可信 IP 访问 WinGate 的日志服务端口（默认 80/8080），或直接禁用日志 HTTP 服务模块。同时避免在 URL 中使用编码后的 `..` 序列访问文件路径。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Wingate 日志服务目录遍历漏洞"
updated = "2026-06-16T21:53:02Z"

