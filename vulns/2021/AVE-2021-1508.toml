[basic]
description = "Google Chrome 浏览器内置的 V8 JavaScript 引擎存在类型混淆漏洞，攻击者可构造包含恶意 JavaScript 代码的 HTML 页面，诱骗用户访问后触发 V8 引擎的类型混淆错误，导致堆内存损坏并可能执行任意代码。该漏洞影响 Google Chrome 91.0.4472.164 之前的所有版本，以及基于 Chromium 内核的 Microsoft Edge、Opera 等浏览器。远程攻击者无需身份认证，仅需通过诱导用户打开特制网页即可发起攻击，成功利用后可完全控制目标系统，CVSS 评分 8.8，危害等级为高危。Google 已在 2021 年 7 月发布的安全更新中修复该漏洞，CISA 亦将其列入已知被利用漏洞目录。"
published = "2021-08-03T19:15:08Z"
remediation = '建议将 Google Chrome 浏览器升级至 91.0.4472.164 或更高版本以修复 V8 引擎中的类型混淆漏洞。Windows 用户可通过 Chrome 菜单中的"帮助→关于 Google Chrome"自动下载并安装更新；macOS 用户可通过 Mac App Store 或 Chrome 自动更新机制升级。Linux 用户（如 Ubuntu/Debian）可通过终端执行 sudo apt update && sudo apt install chromium-browser 命令更新至最新安全版本，当前 Ubuntu 18.04 LTS 的修复版本为 92.0.4515.159-0ubuntu0.18.04.1。企业环境中可通过组策略强制推送 Chrome 91.0.4472.164+ 版本更新。若暂时无法升级，建议临时禁用或限制浏览器 JavaScript 执行，并避免访问不可信网站，减少遭受恶意 HTML 页面攻击的风险。'
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome V8 类型混淆远程代码执行漏洞"
updated = "2026-06-17T03:50:28Z"

