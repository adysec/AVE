[basic]
description = "Alibaba Web Server 2.0（Computer Software Manufaktur 产品）存在缓冲区溢出漏洞。远程攻击者可通过向目标服务器发送超长 GET 请求触发缓冲区溢出，导致服务崩溃或拒绝服务。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响 Alibaba 2.0 版本。Exploit-DB 上已有公开的拒绝服务利用代码（EDB-ID: 20080）。"
published = "2000-07-18T04:00:00Z"
remediation = "立即停止使用已停止维护的 Alibaba 2.0 Web 服务器，迁移至 Apache HTTP Server、Nginx 或 IIS 等仍在安全更新的现代 Web 服务器。如短期内无法迁移，可在网络边界防火墙或 WAF 上配置规则，拦截长度超过 8000 字节的 HTTP GET 请求，并限制仅允许可信 IP 访问该服务以降低攻击面。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Computer Software Manufaktur Alibaba 2.0 Web服务器缓冲区溢出漏洞"
updated = "2026-06-16T21:52:08Z"

