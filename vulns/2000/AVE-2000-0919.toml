[basic]
description = "SuSE Linux 6.2/6.3/6.4/7.0 所捆绑的 ypbind 3.3 在进入调试模式（debug mode）时，其日志记录函数存在格式化字符串漏洞。攻击者可通过精心构造的日志输入……具体而言，该漏洞会导致程序在日志输出过程中错误地处理格式化字符串选项，进而泄漏文件描述符，并可能引发内存访问错误，最终造成拒绝服务。该漏洞可利用网络或本地触发，CVSS 评分为 10.0，危害等级为严重。由于 ypbind 是用于 NIS 客户端身份验证的关键服务，服务被终止后将导致依赖身份认证的远程用户或本地进程无法正常访问认证资源，影响范围较广。厂商已在后续版本中修复该格式化字符串处理缺陷。"
published = "2000-12-11T05:00:00.000"
remediation = "该漏洞为 ypbind 3.3 调试模式下日志功能的格式字符串漏洞。修复建议：1) 升级 ypbind 至修复该漏洞的 3.4 或更高版本（3.3 及更早版本存在此缺陷），可从发行版官方软件仓库获取补丁；2) 如无法立即升级，切勿以 debug mode 运行 ypbind（避免对不可信输入直接格式化日志），并在 /etc/inetd.conf 关闭不必要的 ypbind 监听服务；3) 通过防火墙限制对 ypbind 相关端口（如 1011）的访问，仅允许受信任的 NIS 客户端连接，降低被利用风险。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "SuSE ypbind 3.3 调试模式格式化字符串拒绝服务漏洞"
updated = "2026-06-16T21:53:01.743"

