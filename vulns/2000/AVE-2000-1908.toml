[basic]
description = "eWave ServletExec 3.0C 及更早版本中存在权限许可漏洞，其 UploadServlet Java/JSP 组件未对上传操作进行有效的访问控制。远程攻击者无需身份认证即可通过网络向目标服务器发送特制的上传请求，将任意恶意文件（如 JSP 木马）上传至服务器，进而执行任意系统命令，完全控制目标主机。该漏洞影响 eWave ServletExec 3.0C 及之前版本，CVSS 评分 10.0，危害等级严重。"
published = "2000-12-11T05:00:00Z"
remediation = "升级至 ServletExec 3.0E 或更高版本（下载地址 http://www.servletexec.com/downloads/）。如无法升级，在 Web 服务器层面（Apache/IIS/Netscape）通过访问控制规则禁止外部请求访问 `/servlet/com.unify.ewave.servletexec.UploadServlet` 路径，或在 ServletExec 配置中移除未注册的 UploadServlet 类。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "eWave ServletExec 未授权文件上传远程代码执行漏洞"
updated = "2026-06-16T21:52:59Z"

