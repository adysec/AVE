[basic]
description = "Recourse ManTrap 1.6 在 Solaris 系统上运行时会默认隐藏最先启动的前 4 个进程，本地攻击者无需身份认证，通过对比系统预期进程列表与实际可见进程即可识别出进程被隐藏的现象，从而判定目标系统部署了 ManTrap 蜜罐工具。该漏洞影响 Recourse ManTrap 1.6.1 版本，攻击条件为攻击者拥有目标系统的本地访问权限，利用方式为通过进程枚举检测蜜罐环境，导致攻击者可据此调整攻击策略以避开监控。"
published = "2001-01-09T05:00:00Z"
remediation = "建议将 PHP-Nuke 升级至最新安全版本。若无法升级，需在 'Reviews' 模块的代码中，对所有用户可控的输入参数调用 htmlspecialchars() 函数进行 HTML 实体转义，以拦截恶意脚本注入。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "PHP-Nuke Reviews 模块跨站脚本漏洞"
updated = "2026-06-16T21:53:14Z"

