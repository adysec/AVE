[basic]
description = "YaBB（Yet Another Bulletin Board）1.40 和 1.41 版本的论坛登录脚本 index.php 中存在跨站脚本攻击（XSS）漏洞。当用户提交错误的登录信息时，程序在错误提示页面中未对 passwrd（密码）参数进行任何过滤或转义处理，直接将其内容回显到页面中。未经身份认证的远程攻击者可通过构造包含恶意 JavaScript 代码的钓鱼链接，诱使论坛用户点击访问登录页面，用户提交的密码参数中所携带的脚本代码将在用户浏览器中被执行。攻击者可借此窃取用户浏览器中存储的基于 Cookie 的会话认证凭据，进而劫持用户会话并接管账户，甚至可在不进一步验证身份的情况下直接修改用户密码。该漏洞影响所有使用 YaBB 1.40 和 1.41 版本搭建的在线论坛系统，攻击者无需预先获取任何凭据即可发起攻击，用户点击恶意链接即可触发，危害面较广。CVSS 评分 4.3，危害等级中等，YaBB 官方后续版本已修复此漏洞。"
published = "2002-12-31T05:00:00Z"
remediation = "立即将 YaBB 论坛升级至 YaBB 2.0 或更高版本以修复此跨站脚本漏洞。若暂时无法升级，可手动修改 index.php 文件中的登录错误输出逻辑，在输出 passwrd 参数前调用 htmlspecialchars() 函数对用户输入进行转义，确保特殊字符被编码为 HTML 实体。此外，建议在 Web 服务器或反向代理层面配置 WAF 规则，过滤 passwrd 参数中的 script、iframe 等 HTML 标签，作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "YaBB 1.40/1.41 跨站脚本漏洞"
updated = "2026-06-16T22:00:09Z"

