[basic]
description = "WordPress 的 e-search 插件 1.0 版本存在反射型跨站脚本漏洞（Reflected XSS，CWE-79）。攻击者无需认证即可通过构造特制的 URL 参数，诱使目标用户点击后，恶意脚本将在用户浏览器中执行，导致敏感信息泄露或会话劫持。该漏洞利用方式简单，攻击成本低，影响使用该插件的 WordPress 站点。"
published = "2016-10-10T20:59:05Z"
remediation = "立即停用并删除 WordPress e-search 插件 v1.0，该插件已长期未更新且存在反射型 XSS 漏洞。建议替换为其他受支持的搜索插件（如 SearchWP 或 Relevanssi）。如必须继续使用，在服务器 WAF 层添加规则过滤 `s` 参数中的 `<script>` 等恶意字符。同时确保 WordPress 核心及所有插件保持最新版本。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress e-search Plugin 反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:44Z"

