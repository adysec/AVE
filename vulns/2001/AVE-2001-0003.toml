[basic]
description = 'Windows NT 4.0 系统中的 Winsock2ProtocolCatalogMutex 互斥体存在权限配置不当漏洞，该互斥体被授予 Everyone 组的完全控制权限。具有本地登录权限的低权限用户可利用此漏洞，将互斥体权限修改为"无访问"，从而禁用 Winsock 网络连接功能，导致系统网络服务中断。该漏洞影响 Windows NT 4.0 所有版本，攻击者需在目标系统上拥有本地访问权限，成功利用后可造成拒绝服务，使系统无法建立或维护网络连接。Microsoft 已通过安全更新修复此权限配置问题。'
published = "2001-02-12T05:00:00Z"
remediation = "应用 Microsoft 安全公告 MS01-003 补丁（Knowledge Base Q279336），该补丁将修复 Winsock2ProtocolCatalogMutex 互斥体的权限设置，仅允许管理员和系统账户访问。受影响系统包括 Windows NT 4.0 Server SP6a 及 Windows NT 4.0 Terminal Server Edition SP6，可从微软下载中心获取对应补丁安装。如暂无法安装补丁，建议在终端服务器和域控制器上严格限制普通用户的交互式登录权限，仅允许管理员和服务账户登录，以降低本地用户利用该漏洞造成拒绝服务的风险。补丁已包含在 Windows NT 4.0 Service Pack 7 中，升级至 SP7 亦可修复此问题。"
score = 7.1
severity = "HIGH"
sources = ["avd"]
title = "Microsoft Windows NT 4.0 Winsock 拒绝服务漏洞"
updated = "2026-06-16T21:53:28Z"

