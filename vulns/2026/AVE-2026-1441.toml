[basic]
description = "GuzzleHTTP Guzzle 库在 7.15.1 之前的版本中存在 Cookie 作用域处理不当漏洞。当库在处理 HTTP 响应中的 Cookie 时，未能正确设置 host-only 标记，而是将请求主机名写入 Cookie 的 Domain 字段，导致父域名下设置的仅限本域 Cookie 可以被子域名获取。攻击者若控制目标父域名的子域名，则可通过该子域名接收到仅应发送给父域名的会话标识符和授权令牌，进而导致会话劫持。该漏洞影响所有使用共享 Cookie 容器（Cookie Jar）并向不同信任域发起请求的应用场景，攻击无需认证，但需要攻击者能够控制目标服务的子域名。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Guzzle PHP HTTP 客户端 host-only Cookie 作用域未正确保留漏洞"
