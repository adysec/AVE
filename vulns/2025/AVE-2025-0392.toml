[basic]
description = "Google Chrome（及基于 Chromium 的 Microsoft Edge）中的 Skia 图形引擎存在释放后使用（Use After Free）漏洞。远程攻击者可通过构造特制的 HTML 页面诱导用户访问，成功利用该漏洞可触发堆内存损坏，导致信息泄露、拒绝服务或潜在代码执行。该漏洞影响 Chrome 133.0.6943.53 之前版本及 Edge 133.0.3065.51 之前版本，攻击需用户交互，CVSS 评分 6.3，危害等级中危。Google 和 Microsoft 已在 2025 年 2 月安全更新中修复。"
published = "2025-02-04T19:15:32Z"
remediation = "立即将 Google Chrome 升级至 133.0.6943.53 或更高版本，Microsoft Edge 升级至 133.0.3065.51 或更高版本。可通过浏览器内置自动更新或访问官网下载安装。如使用 Chromium 内核的第三方浏览器，请关注厂商安全公告并及时更新。无法立即升级时，可禁用 JavaScript 解析不受信任的 HTML 页面作为临时缓解措施。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome Skia 释放后使用漏洞"
updated = "2026-06-17T08:26:29Z"

