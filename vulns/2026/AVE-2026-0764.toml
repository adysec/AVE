[basic]
description = "ImageMagick 是一款开源图像处理软件，其 XCF 解码器在处理特制 XCF 图像时存在整数转换溢出漏洞（CWE-190）。攻击者可构造恶意 XCF 文件，当用户或自动化程序使用受影响版本解析该文件时，整数溢出导致堆缓冲区过度读取，可能造成信息泄露或程序崩溃。该漏洞影响 ImageMagick 6.9.13-51 之前版本及 7.1.2-26 之前版本，CVSS 评分 6.5，无需身份认证且无需用户交互，远程攻击者可通过诱导用户打开恶意图像触发。"
published = "2026-07-01T19:16:54Z"
remediation = '升级 ImageMagick 至 6.9.13-51 或 7.1.2-26 及以上版本；Debian 13 用户执行 `apt update && apt upgrade imagemagick` 安装 DSA-6383-1 安全更新。如无法立即升级，可在处理用户上传图片前使用 `identify -verbose` 预检 XCF 文件，或通过策略文件 `policy.xml` 禁用 XCF 解码器：`<policy domain="coder" rights="none" pattern="XCF" />`。'
score = 6.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "ImageMagick XCF解码器堆缓冲区越界读取漏洞"
updated = "2026-07-02T19:34:08Z"

