[basic]
description = "Mozilla Firefox/Thunderbird/SeaMonkey 的 nsDOMAttribute 子节点删除处理中存在释放后使用（Use-After-Free）漏洞。当 DOM 属性子节点被移除时，AttributeChildRemoved 通知未能正确更新对已删除子节点的引用，导致内存被释放后仍可被访问。远程攻击者可构造特制网页，诱使用户访问，触发对已释放内存的非法访问，进而实现任意代码执行。CVSS 评分 9.3，危害等级严重。该漏洞影响 Firefox 3.6.26 之前及 4.x 至 9.0 版本、Thunderbird 3.1.18 之前及 5.0 至 9.0 版本、SeaMonkey 2.7 之前版本。Metasploit 框架已包含该漏洞的利用模块。"
published = "2012-02-01T16:55:00Z"
remediation = "升级 Firefox 至 3.6.26 或 10.0 及以上版本，Thunderbird 升级至 3.1.18 或 10.0 及以上版本，SeaMonkey 升级至 2.7 及以上版本。如无法立即升级，可在浏览器中禁用 JavaScript 作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey nsDOMAttribute 释放后使用远程代码执行漏洞"
updated = "2026-06-16T23:33:42Z"

