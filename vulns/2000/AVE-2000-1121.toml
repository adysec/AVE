[basic]
description = "NAI Sniffer Agent 使用 base64 编码进行身份认证，由于 base64 并非加密算法而仅是一种编码方式，用户名和密码以明文可逆形式在网络中传输。远程攻击者可通过嗅探网络流量，轻松捕获并解码包含认证信息的 base64 编码数据，从而获取明文凭据，进而未授权访问受保护的网络管理系统。该漏洞影响 NAI Sniffer Agent 相关版本，攻击者只需具备网络监听能力即可实施，无需任何身份认证。"
published = "2001-01-09T05:00:00.000"
remediation = "立即升级 NAI Sniffer Agent 至支持强加密认证的最新版本，或迁移至 McAfee 后续替代产品。如无法升级，须在管理通信链路上启用 IPSec 或 SSH 隧道加密所有认证流量，同时在交换机端口配置 VLAN 隔离和端口安全，限制嗅探器管理流量仅在受信任的管理网段内传输，防止攻击者通过网络嗅探截获 base64 编码的明文凭据。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "NAI Sniffer Agent 认证信息泄露漏洞"
updated = "2026-06-16T21:53:16.903"

