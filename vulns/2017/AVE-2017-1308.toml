[basic]
description = "DNN（即 DotNetNuke）9.1.1 之前版本存在远程代码执行漏洞，攻击者可通过构造特制的 Cookie 触发该漏洞。该漏洞源于系统对用户可控的 Cookie 数据缺乏充分的输入验证与过滤，导致攻击者能够注入恶意代码并在服务器端执行。攻击者只需拥有低权限账户即可远程利用，无需用户交互，成功利用后可完全控制目标服务器，获取敏感数据、安装恶意软件或进行横向移动。CVSS 评分 8.8，危害等级高，影响所有运行受影响版本 DotNetNuke 的 Web 服务器。"
published = "2017-07-20T12:29:00.233"
remediation = "升级 DNN (DotNetNuke) 至 9.1.1 或更高版本。官方已在 9.1.1 版本中通过修复 Cookie 反序列化处理逻辑消除了 RCE 漏洞。如无法立即升级，可在 Web 应用防火墙 (WAF) 层面配置规则拦截包含恶意序列化对象的 Cookie 请求作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "DNN DotNetNuke 远程代码执行漏洞"
updated = "2026-06-17T01:28:59.713"

