[basic]
description = "Apple QuickTime 7.7.2 之前版本在 Windows 平台上处理 QTVR 全景电影文件时存在整数符号错误漏洞。远程攻击者可向目标用户发送特制的 QTVR 电影文件，当用户使用 QuickTime 播放器打开该恶意文件时，触发内存破坏，导致任意代码执行或应用程序崩溃。该漏洞影响 Windows 平台上的所有 QuickTime 7.7.2 之前版本，CVSS 评分 9.3，危害等级严重。Apple 已发布 QuickTime 7.7.2 版本修复此漏洞。"
published = "2012-05-16T10:12:57.647"
remediation = "立即将 Apple QuickTime 升级至 7.7.2 或更高版本（该版本已修复此漏洞）。由于 Apple 已停止对 Windows 版 QuickTime 的安全支持，建议彻底卸载 QuickTime for Windows，改用支持 H.264 的现代播放器（如 VLC media player）。如业务必须保留，可在浏览器中禁用 QuickTime 插件，并避免打开来源不明的 .mov/.qtvr 文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime QTVR电影文件整数符号错误远程代码执行漏洞"
updated = "2026-06-16T23:38:02.470"

