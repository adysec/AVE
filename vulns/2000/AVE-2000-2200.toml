[basic]
description = "Haakon Nilsen 开发的简单集成发布系统（SIPS）0.2.4 及之前版本存在严重安全缺陷，未经身份认证的远程攻击者可通过网络直接发起利用，完全获取系统的机密性、完整性和可用性控制权。该漏洞 CVSS 评分满分 10.0，危害等级为严重，影响所有部署了受影响版本 SIPS 的网站服务器。攻击者利用该漏洞可执行任意代码或完全接管目标系统，建议用户立即升级至 0.2.4 或更高版本进行修复。"
published = "2000-12-31T05:00:00Z"
remediation = "立即将 SIPS 升级至 0.3.1 或更高版本以彻底修复该严重安全漏洞。如暂时无法升级，建议临时下线该系统或限制其网络访问权限，并在 Web 服务器层面配置 IP 访问控制列表，仅允许可信地址访问该应用。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Haakon Nilsen SIPS 内容发布系统未指定安全漏洞"
updated = "2026-06-16T21:53:26Z"

