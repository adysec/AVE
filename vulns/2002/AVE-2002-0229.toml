[basic]
description = "Zope 2.4.0 至 2.5.1 版本中的 ZCatalog 插件索引支持功能存在访问控制绕过漏洞。该漏洞源于 ZCatalog 插件索引支持功能未正确验证访问权限，导致未经身份认证的匿名用户和不可信代码可绕过访问限制，直接调用目录索引的任意方法。攻击者无需认证即可通过网络远程利用该漏洞，攻击复杂度低，可造成部分机密性、完整性和可用性影响（CVSS 7.5，高危）。影响范围涵盖 Zope 2.4.0 至 2.5.1 版本，攻击者可通过调用任意索引方法实施信息泄露、数据篡改或服务拒绝攻击。"
published = "2002-07-23T04:00:00Z"
remediation = '立即升级 Zope 到 2.13.x 或 4.x 系列，至少版本 2.13.29，以修复 ZCatalog 索引支持漏洞。紧急情况下可将 web_python 脚本中 ZCatalog 访问权限修改为仅限内部用户，并通过 web.xml 配置中启用安全管理器。访问控制列表（ACL）应严格限制未认证用户的 ZCatalog 方法访问，如使用这样的配置：<acquired xmlns="..." id="zpublisher.publish_rates.default"><allow>Python scripts</allow><forbid>Catalog operations</forbid></acquired>'
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Zope Zope 安全绕过漏洞"
updated = "2026-06-16T21:57:56Z"

