[basic]
description = "Windows 电话服务（Telephony Service）在处理特制请求时存在堆缓冲区溢出漏洞（CWE-122），远程攻击者可通过网络向目标系统发送恶意构造的请求，诱使用户在受影响的系统上执行特定操作（如拨打电话相关功能），从而触发该漏洞。成功利用此漏洞的攻击者可在目标系统上以电话服务进程权限执行任意代码，实现完全控制受影响的系统。该漏洞影响多个 Windows 10/11 及 Windows Server 版本，CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中发布补丁修复此漏洞。"
published = "2025-01-14T18:15:38Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新（KB5049981/KB5049983/KB5049984/KB5050021），或通过 Windows Update 自动获取更新。受影响版本包括 Windows 10/11 及 Windows Server 2016/2019/2022/2025，更新后对应版本号分别为 10.0.10240.20890、10.0.19045.5371、10.0.22621.4751、10.0.26100.2894 等。如无法立即打补丁，建议限制 TAPI 服务对不可信网络的暴露，并禁用不必要的远程桌面协议入口。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:42:51Z"

