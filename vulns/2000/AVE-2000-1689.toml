[basic]
description = "WatchGuard SOHO 防火墙的 HTTP 服务器存在缓冲区溢出漏洞。远程攻击者无需身份认证即可通过发送超长的 HTTP GET 请求触发该漏洞，导致服务崩溃并可能执行任意代码。该漏洞影响 WatchGuard SOHO 系列防火墙设备，CVSS 评分为 10.0，危害等级严重，攻击条件宽松且利用门槛低。"
published = "2001-02-12T05:00:00.000"
remediation = "WatchGuard 已于 2001 年初发布针对此漏洞的固件更新。建议立即将 SOHO 防火墙固件升级至 v2.2.1 或更高版本（通过 WatchGuard System Manager 进行固件刷写）。若不确定当前版本，可登录 Web 管理界面查看状态页。由于该产品已停产且不再获得安全更新，建议淘汰老旧 SOHO 设备，更换为受支持的 WatchGuard Firebox 系列硬件并升级至最新 Fireware OS，同时在网络边界配置访问控制列表（ACL）限制对管理端口的访问。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "WatchGuard SOHO Firewall 缓冲区溢出拒绝服务代码执行漏洞"
updated = "2026-06-16T21:52:41.840"

