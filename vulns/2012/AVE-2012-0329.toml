[basic]
description = "tags.<value>Apple iTunes 使用的 WebKit 引擎存在内存破坏漏洞，远程攻击者可通过构造恶意网页触发该漏洞，导致任意代码执行或应用程序崩溃（拒绝服务）。该漏洞影响 iTunes 10.7 之前的版本，攻击条件为受害者访问包含恶意内容的网站。CVSS 评分为 6.8，危害等级中等。"
published = "2012-09-13T10:30:19.777"
