[basic]
description = "Internet Explorer 5.0 至 5.5 版本中的 Frame Domain Verification（帧域验证）机制存在安全绕过漏洞。该漏洞源于浏览器在渲染包含多个帧(frame)的网页时，未能正确验证不同帧之间所属的安全域(domain)，导致不同安全域之间的访问隔离失效。未经身份认证的远程攻击者可构造恶意网页，在用户浏览器中同时加载属于攻击者控制的域和用户本地文件系统域的帧，利用两者之间未受适当域检查限制的通信方式，读取用户本地计算机上的文件内容。攻击者仅能在已知文件路径的前提下读取文件，无法修改或删除文件，且需要用户访问恶意网页才能触发利用。该漏洞属于信息泄露类型，影响 Windows 系统上使用 IE 5.0/5.01/5.5 浏览网页的用户，Microsoft 已在安全公告 MS00-093 中发布补丁，用户应升级至 IE 5.01 SP2 或 IE 5.5 SP2 以修复此问题。"
published = "2001-02-16T05:00:00.000"
remediation = "建议立即安装 Microsoft 2001 年 3 月安全更新 Q286045（或后续 MS01-027 补丁），或升级到 Internet Explorer 5.5 Service Pack 2 / IE 6.0 及更高版本。如无法立即打补丁，可在 Internet Explorer 的 Internet 安全区域中禁用 Active Scripting，将安全级别设置为高，并避免访问不受信任的网站或打开可疑 HTML 邮件。"
score = 2.6
severity = "LOW"
sources = ["epss"]
title = "Microsoft Internet Explorer 跨域信息泄露漏洞"
updated = "2026-06-16T21:53:38.450"

