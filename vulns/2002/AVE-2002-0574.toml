[basic]
description = "Sun Cobalt RaQ 4 应用服务器在安装安全加固补丁（SHP）后，其管理界面的 overflow.cgi CGI 脚本存在命令注入漏洞。未经身份认证的远程攻击者可通过向该脚本发送包含 shell 元字符的 POST 请求，利用 email 参数执行任意系统命令，从而完全控制目标服务器。该漏洞影响安装 SHP 补丁的 Sun Cobalt RaQ 4 设备，攻击者无需凭据即可在远程服务器上执行任意代码，CVSS 评分为 10.0，危害等级严重。"
published = "2002-12-23T05:00:00Z"
remediation = "Sun Microsystems 已发布 RaQ4-en-Security-2.0.1-SHP_REM.pkg 补丁包，用于彻底移除存在漏洞的 SHP（Security Hardening Patch）组件，建议立即从 ftp.cobalt.sun.com/pub/packages/raq4/eng/ 下载并安装该补丁。若无法立即安装补丁，可通过防火墙阻断对管理端口 81（非 SSL）和 444（SSL）的远程访问作为临时缓解措施，同时禁用或删除 overflow.cgi 脚本（路径 /cgi-bin/.cobalt/overflow/overflow.cgi），以防止未经授权的远程代码执行。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Sun Cobalt RaQ 4 远程代码执行漏洞"
updated = "2026-06-16T21:59:10Z"

