[info]
author = "ave"
description = "验证目标系统在处理恶意PNG文件时是否触发整数溢出导致拒绝服务"
id = "POC-AVE-2011-0173"
name = "CVE-2011-3026 PoC"
severity = "medium"
tags = ["ave-2011-0173"]
vuln_id = [
    "CVE-2011-3026",
    "AVE-2011-0173",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/tmp/cve-2011-3026.png"
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["PNG"]
