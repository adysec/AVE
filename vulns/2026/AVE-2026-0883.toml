[basic]
description = 'Apollo ConfigService 存在输入验证不当漏洞，当启用 AccessKey 认证时，对 /configfiles/raw/{appId}/{clusterName}/{namespace} 接口的请求中，认证模块错误地将路径中的 "raw" 解析为 appId 而非实际目标 appId，导致系统使用 "raw" 查询 AccessKey 密钥。若不存在名为 "raw" 的应用的密钥配置，请求将跳过签名验证直接放行。未经身份认证的远程攻击者可利用此缺陷读取目标应用的原始配置数据，造成敏感信息泄露。该漏洞影响 Apollo 2.5.2 之前版本，CVSS 评分 7.5，危害等级高。官方已在 Apollo 2.5.2 版本中修复此问题。'
published = "2026-07-15T17:16:51.087"
remediation = "立即升级 Apollo ConfigService 至 2.5.2 或更高版本。如使用 Docker 部署，拉取最新镜像 `apolloconfig/apollo-configservice:2.5.2` 重启容器；如使用 JAR 包部署，从 GitHub Releases 下载 v2.5.2 替换后重启服务。临时缓解措施：在反向代理层（如 Nginx）添加规则，拒绝 `/configfiles/raw/` 路径的未授权请求。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Apollo ConfigService 原始配置文件接口认证绕过漏洞"
updated = "2026-07-15T19:18:34.287"

