[basic]
description = "Unraid 6.8.0及以下版本的Web管理界面存在认证绕过与任意代码执行漏洞。未经身份认证的远程攻击者可通过向目标系统的`/webGui/images/green-on.png/`端点发送包含特制`path`和`site[x][text]`参数的恶意HTTP请求，绕过身份验证并在服务器端执行任意PHP代码。该漏洞影响部署Unraid操作系统的网络存储设备，攻击者无需有效凭据即可在受影响的系统上以root权限执行任意命令，完全控制文件系统、敏感数据及网络服务。CVSS评分为9.8，危害等级严重。Unraid已在后续版本中修复此漏洞。"
published = "2020-03-16T18:15:12.713"
remediation = '立即将 Unraid 升级至 6.8.1 或更高版本以修复该漏洞，可通过 Unraid 控制台的"更新与恢复"功能或访问 https://unraid.net/download 手动下载最新稳定版进行升级。同时建议在网络层面通过防火墙限制对管理界面（默认端口 80/443）的访问，仅允许可信 IP 地址连接，并在无法立即升级时临时禁用 Web 界面的远程访问以降低被利用风险。'
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Lime Technology Unraid 远程代码执行漏洞"
updated = "2026-06-17T03:22:19.723"

