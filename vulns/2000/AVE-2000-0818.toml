[basic]
description = "HP-UX 10.20 系统中 HP 资源监视器服务的 registrar 组件存在本地任意文件读取漏洞。registrar 在写入日志文件时未对日志文件有效性进行充分校验，本地低权限攻击者可将原始 registrar.log 日志文件重命名，并创建指向目标文件的符号链接。此后当 registrar 向日志文件追加记录信息时，实际内容会被写入目标文件，且文件权限被设置为全局可读。攻击者可利用此方式读取或修改系统上的任意文件，造成敏感信息泄露。该漏洞影响 HP-UX 10.20 版本，无需身份认证即可在本地利用。"
published = "2001-01-09T05:00:00.000"
remediation = "立即升级 HP-UX 到支持补丁的版本（11 或 11i），在 /etc/opt/resmon/log 目录设置 sticky 权限并禁止符号链接创建，重新命名 registrar.log 文件并使用绝对路径，启用系统日志审计并监控异常符号链接操作，作为紧急缓解措施的临时解决方案。"
score = 3.6
severity = "LOW"
sources = ["avd"]
title = "HP HP-UX 10.20 resource monitor registrar 本地任意文件读取漏洞"
updated = "2026-06-16T21:53:12.403"

