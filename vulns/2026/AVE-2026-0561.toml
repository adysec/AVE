[basic]
description = "Zcash Orchard 池的零知识证明电路中，`halo2_gadgets` 库的变基标量乘法 gadget 在实现 double-and-add 算法时，对基点使用了 `assign_advice()` 而非 `copy_advice()`，缺少复制约束将基点值绑定到实际输入，导致恶意证明者可自由选择基点值。攻击者可利用此缺陷绕过多样化地址完整性检查（pk<sub>d</sub> = [ivk] g<sub>d</sub>），使用错误的空化密钥（nk）为同一笔 note 生成不同的 nullifier，实现 Orchard 池内的双花攻击；或伪造花费授权窃取他人资金。该漏洞自 NU5 升级（2022 年 5 月 31 日）起存在，攻击无需认证且链上不可检测，CVSS 评分 9.3，危害严重。修复需升级至 zebrad 5.0.0 / halo2_gadgets 0.5.0 / orchard 0.14.0 / zcash_primitives 0.28.0 / zcashd 6.20.0，并需 NU6.2 硬分叉激活。"
published = "2026-07-17T17:17:16Z"
remediation = "立即升级 zebrad 至 5.0.0 及以上版本、zcashd 至 6.20.0 及以上版本、halo2_gadgets 至 0.5.0 及以上版本、orchard 至 0.14.0 及以上版本、zcash_primitives 至 0.28.0 及以上版本。NU6.2 硬分叉已修复该电路漏洞并重新启用 Orchard 交易。在升级前，节点运营者可部署临时软分叉（如 Zebra 4.5.3）拒绝所有含 Orchard 交易的区块作为临时缓解措施。依赖受影响 crate 的下游项目应同步升级并审计其他使用 assign_advice() 但未施加 copy 约束的代码位置。"
score = 9.3
severity = "CRITICAL"
sources = ["ghsa"]
title = "Zcash Foundation Zebra Orchard 交易零知识证明验证绕过漏洞"
updated = "2026-07-17T18:45:20Z"

