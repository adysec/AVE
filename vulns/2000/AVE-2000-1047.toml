[basic]
description = "FreeBSD 的 catopen() 函数中存在缓冲区溢出漏洞，由于未对环境变量长度进行有效边界检查，本地攻击者可通过设置超长环境变量触发缓冲区溢出，从而以 root 权限执行任意代码。该漏洞影响 FreeBSD 5.0 及更早版本，攻击者需具备本地系统访问权限，无需任何认证即可利用，成功利用后可完全控制目标系统，造成机密性、完整性和可用性的完全丧失。"
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 FreeBSD 系统至 5.0-RELEASE 之后的补丁版本，或应用 FreeBSD 安全公告 SA-00:53 中提供的 catopen() 补丁。具体操作为：以 root 身份执行 `/usr/sbin/freebsd-update fetch && /usr/sbin/freebsd-update install` 更新系统；若无法升级，可临时限制本地用户设置过长环境变量，或通过 `chmod 755 /usr/lib/libc.so.*` 降低 libc 文件权限作为缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "FreeBSD catopen() 函数缓冲区溢出本地权限提升漏洞"
updated = "2026-06-16T21:52:58.040"

