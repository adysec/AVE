[basic]
description = "Linux 内核 Orangefs 文件系统的 orangefs_debug_write 函数存在 slab 越界读取漏洞（CWE-125）。该漏洞由 syzbot 模糊测试发现，由于调试写接口未对用户传入的偏移量和长度进行充分边界检查，本地低权限攻击者可构造特制输入触发越界读取，从而泄露内核内存中的敏感信息或导致系统崩溃。该漏洞影响包含 Orangefs 模块的 Linux 内核版本，攻击者需要具备本地访问权限才能利用。CVSS 评分为 7.1（HIGH），对系统机密性和可用性造成严重影响。修复补丁已由 Al Viro 提出方案并合入主线内核。"
published = "2025-02-27T03:15:19.050"
remediation = "将 Linux 内核升级至已修复此漏洞的稳定版本：Linux 5.4.291、5.10.235、5.15.179、6.1.129、6.6.79、6.12.16 或 6.13.4 及以上版本。对于 Ubuntu 发行版，20.04 LTS 请升级至内核 5.4.0-216.236 或更高版本，22.04 LTS 请升级至 5.15.0-140.150，24.04 LTS 请升级至 6.8.0-78.78。如暂时无法升级内核，可通过以下临时缓解措施降低风险：卸载 orangefs 内核模块（执行 rmmod orangefs），或限制 debugfs 文件系统的访问权限，仅允许 root 用户挂载（执行 mount -o remount,mode=750 /sys/kernel/debug）。该漏洞仅能通过 /sys/kernel/debugfs/orangefs/kernel-debug 路径触发，需要 root 权限，因此限制调试文件系统的访问可有效减少攻击面。建议通过系统包管理器执行内核升级：Ubuntu/Debian 系统执行 apt update && apt upgrade linux-image，RHEL/CentOS 系统执行 yum update kernel，并重启系统使新内核生效。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux kernel Orangefs 越界读取漏洞"
updated = "2026-06-17T08:44:15.937"

