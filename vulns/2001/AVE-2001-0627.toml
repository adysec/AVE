[basic]
description = "shadow-utils 中的 useradd 程序存在符号链接攻击漏洞，本地攻击者可通过创建恶意符号链接，诱使 useradd 在处理文件时覆盖任意系统文件，导致权限提升或系统破坏。攻击需要本地用户权限且利用条件较为苛刻，CVSS 评分 1.2，危害等级低。"
published = "2001-03-12T05:00:00Z"
remediation = "升级 shadow-utils 至修复版本（19990827-18 及以上），或应用 Immunix OS 安全更新及 Mandrake MDKSA-2001:007 补丁。确保 /etc/default 等临时文件目录权限正确，非全局可写。作为临时缓解措施，限制不可信本地用户对系统的访问权限。"
score = 1.2
severity = "LOW"
sources = ["cve"]
title = "GNU shadow-utils useradd 程序符号链接任意文件写入漏洞"
updated = "2026-06-16T21:53:41Z"

