[basic]
description = "Mozilla Firefox 4.x至9.0、Thunderbird 5.0至9.0及SeaMonkey 2.7之前版本中存在跨域安全绕过漏洞。远程攻击者可通过构造包含目标子框架名称属性的表单提交目标，绕过HTML5框架导航策略，在跨域文档中替换任意子框架，导致内容欺骗或信息篡改。该漏洞无需身份认证即可远程利用，影响范围广泛。"
published = "2012-02-01T16:55:01Z"
remediation = "升级 Firefox 至 10.0 及以上版本、SeaMonkey 至 2.7 及以上版本、Thunderbird 至 10.0 及以上版本。无法立即升级时，可禁用 JavaScript 或使用 NoScript 等扩展限制第三方框架脚本执行作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox/SeaMonkey/Thunderbird 跨域框架导航策略绕过漏洞"
updated = "2026-06-16T23:37:16Z"

