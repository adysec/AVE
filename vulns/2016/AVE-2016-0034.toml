[basic]
description = "WordPress 的 pondol-formmail 插件 1.1 版本中存在反射型跨站脚本漏洞（Reflected XSS，CWE-79）。攻击者无需认证即可通过构造恶意 URL 并诱导用户点击，将恶意 JavaScript 代码注入到响应页面中，导致攻击者在用户浏览器上下文中执行任意脚本，可窃取会话 Cookie、劫持用户会话或篡改页面内容。该漏洞利用条件低，仅需用户交互（点击链接），影响 WordPress 站点中安装了该插件的环境。"
published = "2016-10-10T20:59:24Z"
remediation = "立即停用并删除 pondol-formmail 插件（v1.1 已不再维护），该插件存在反射型 XSS 漏洞，攻击者可构造恶意 URL 窃取用户 Cookie 或会话令牌。建议迁移至其他仍在维护的表单插件（如 Contact Form 7、WPForms），并确保 WordPress 核心及所有插件保持最新版本。如必须使用，可在 Web 应用防火墙（WAF）层面添加规则过滤 `_wpnonce` 等参数中的恶意脚本代码。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress pondol-formmail 插件反射跨站脚本漏洞"
updated = "2026-06-17T00:38:45Z"

