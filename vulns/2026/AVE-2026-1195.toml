description = "React Router 的 RSC（React Server Components）模式存在跨站请求伪造（CSRF）绕过漏洞。攻击者可在不稳定 RSC 代码路径中，在服务器返回 400 响应之前触发动作执行，从而绕过 CSRF 防护机制。该漏洞影响使用 React Router 不稳定 RSC API 的应用程序，攻击条件为远程无需认证，CVSS 评分为 5.0，危害等级中等。"
