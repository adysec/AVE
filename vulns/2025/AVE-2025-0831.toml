[basic]
description = "Microsoft Digest 身份验证模块存在堆缓冲区溢出漏洞（CWE-122），由于在处理特制身份验证请求时未正确验证输入缓冲区长度，已获得低权限的攻击者可向目标系统发送精心构造的 Digest 认证请求，触发堆内存损坏，进而实现远程代码执行。该漏洞影响多个 Windows 版本，CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:35.340"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新 KB5051974（Windows Server 2025/Windows 11 24H2 等受影响版本），或安装热补丁 KB5052105。如无法立即打补丁，可在防火墙层面限制对 Digest 认证端口的访问，并禁用不必要的 Digest 认证作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Digest 身份验证远程代码执行漏洞"
updated = "2026-06-17T08:43:12.683"

