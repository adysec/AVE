[basic]
description = "Pheditor 是一款用 PHP 编写的单文件编辑器与文件管理器。在 2.0.1 至 2.0.6 之前的版本中，程序在 pheditor.php 第 11 行硬编码了默认管理员密码 admin（SHA-512 哈希），且首次登录时无强制修改密码机制。未经身份认证的远程攻击者可使用默认凭据登录系统，获得文件编辑、文件上传及终端执行功能的完全访问权限，进而实现任意文件读写与远程代码执行。该漏洞影响 Pheditor 2.0.1 至 2.0.6 之前的所有版本，CVSS 评分 9.8，危害等级严重。"
published = "2026-07-27T18:16:56Z"
remediation = "立即升级 Pheditor 至 2.0.6 或更高版本，该版本已移除硬编码默认密码并强制首次登录时设置密码。如无法升级，手动修改 pheditor.php 中 PASSWORD 常量为强随机哈希值，并在部署后通过 Web 界面修改默认密码。同时建议在 Web 服务器层面限制 pheditor.php 的访问 IP 白名单作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["ghsa"]
title = "Pheditor 硬编码默认管理员密码漏洞"
updated = "2026-07-27T20:32:11Z"

