[basic]
description = "GRUB2 的 HFS 文件系统模块在读取 HFS 文件系统数据时，使用来自文件系统元数据的用户可控参数来计算内部缓冲区大小，但未正确检查整数溢出。攻击者可构造恶意的 HFS 文件系统镜像，使缓冲区大小计算发生溢出，导致 grub_malloc() 分配的内存小于预期。随后 hfsplus_open_compressed_real() 函数会将数据写入超出缓冲区长度的内存区域，从而篡改 GRUB 内部关键数据，绕过安全启动保护机制并实现任意代码执行。该漏洞影响所有使用 GRUB2 引导加载程序且支持 HFS 文件系统的系统，包括基于 Linux 和 macOS 的引导环境。"
published = "2025-03-03T15:15:16Z"
remediation = "升级 grub2 到已修复版本：Debian/Ubuntu 用户升级至 grub2 ≥ 2.06-3~deb11u7（bullseye-security）、2.06-13+deb12u2（bookworm）或 2.14-3（sid/trixie）；RHEL/CentOS 用户升级至 grub2 ≥ 2.06-99.el9 或检查 RHSA 公告获取具体版本。若暂时无法升级，可通过 GRUB 命令行禁用 hfs/hfsplus 模块加载（执行 grub-probe 后从 grub.cfg 中移除 hfs 模块引用），或从 GRUB 配置中移除对 HFS+ 文件系统的依赖。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "GNU GRUB2 HFS 文件系统整数溢出堆越界写入漏洞"
updated = "2026-06-30T00:16:54Z"

