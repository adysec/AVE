` mixed in. The quality check says description field is empty - this is because the current TOML has malformed description with those tags.

Requirements:
- ≥50 字中文
- 涵盖：漏洞原理、影响范围、攻击条件（远程/本地、是否需要认证）
- 将 NVD 英文描述翻译为流畅中文
- 不要编造 URL 或具体版本号（除非 presearch 数据中有）

From presearch, I have version info:
- Foxit PDF Editor: versions 14.0.3 and earlier
- Foxit PDF Reader: versions 2026.1 and earlier

CVSS vector says AV:L (Local) - but the title says "Remote Code Execution". Let me re-read the CVSS vector: CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H

AV:L = Local attack vector. This means the attack requires local access. PR:N = No privileges required. UI:R = Requires user interaction.

So the attack vector is LOCAL, not remote. The user needs to open a malicious PDF file. But the title in the AVD data says "远程代码执行" (remote code execution) - this refers to the impact (code execution), not the attack vector. The attack is local (requires user to open file).

Wait, actually in the current TOML the description mentions "攻击者可构造恶意 PDF 文件，通过网络诱骗用户使用受影响版本的 Foxit PDF 编辑器或阅读器打开该文件" - this suggests a remote attack via social engineering. The CVSS vector confirms local attack vector but with user interaction.

Let me construct a proper description:

漏洞原理：解析逻辑缺陷导致非签名数据被错误识别为有效签名，在处理畸形表单字段层级结构时引发无效内存写入和程序崩溃（CWE-20  improper input validation）。

影响范围：Foxit PDF 编辑器（14.0.3 及更早版本）和 Foxit PDF 阅读器（2026.1 及更早版本）。

攻击条件：攻击者需诱骗用户在受影响版本的软件中打开特制 PDF 文件，无需身份认证即可触发漏洞，成功利用可导致应用程序崩溃或潜在的代码执行风险。

CVSS: 3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H means:
- Attack Vector: Local
- Attack Complexity: Low
- Privileges Required: None
- User Interaction: Required
- Scope: Unchanged
- Confidentiality/Integrity/Availability: High

Let me write a comprehensive Chinese description ≥50 chars:

Foxit PDF 编辑器与阅读器的 AcroForm 签名验证模块存在输入验证不当漏洞（CWE-20）。当软件处理包含畸形表单字段层级结构的特制 PDF 文件时，解析逻辑缺陷会导致非签名数据被错误识别为有效签名，进而在内部数据结构构建过程中引发无效内存写入和程序崩溃。该漏洞影响 Foxit PDF 编辑器 14.0.3 及更早版本、Foxit PDF 阅读器 2026.1 及更早版本。攻击者可通过构造恶意 PDF 文件诱骗用户打开，无需身份认证即可触发，成功利用可能导致应用程序拒绝服务或远程代码执行。CVSS 评分 7.8，危害等级高。

Let me count characters... This looks well over 50 characters.

Actually, looking at the current broken TOML, there are some garbled strings with `<value>` tags that need to be cleaned up. But the user only asked for the description field value.

The instructions say: "只输出 <value>..."""
