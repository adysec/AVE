[basic]
description = "Google Chrome Android版本在142.0.7444.59之前的Omnibox（地址栏）组件存在安全UI显示不正确漏洞（CWE-306）。远程攻击者可通过构造特制HTML页面，诱导用户执行特定UI手势操作，实施界面欺骗攻击，使用户误判地址栏显示的真实来源。该漏洞需要用户交互且攻击复杂度较高，成功利用可导致低机密性信息泄露和有限的可用性影响。影响范围为Google Chrome Android版本<142.0.7444.59，CVSS 3.1评分4.2（中危），攻击向量为网络远程，无需权限但需要用户交互。"
published = "2025-11-10T20:15:39Z"
remediation = """
The user wants me to generate a remediation (修复建议) for CVE-2025-12447. Let me analyze the information:

- CVE-2025-12447: Chromium Omnibox security UI spoofing on Android
- Affects Google Chrome on Android prior to 142.0.7444.59
- CVSS 4.2 (MEDIUM)
- The tenable data mentions updating to 142.0.7444.59 and also 142.0.7444.162

The remediation should be actionable, in Chinese, at least 20 characters.<value>升级 Google Chrome for Android 至 142.0.7444.59 或更高版本，可通过 Google Play Store 自动更新。如使用基于 Chromium 的第三方浏览器，请同步更新至对应修复版本。无法立即更新时，避免在不可信页面中执行特定 UI 手势操作。"""
score = 4.2
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome Android版 Omnibox 安全UI绕过漏洞"
updated = "2026-06-17T08:32:24Z"

