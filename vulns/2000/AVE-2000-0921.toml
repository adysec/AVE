[basic]
description = "nss_ldap 是 Linux/Unix 系统中用于 LDAP 名称服务集成的 NSS 模块。在运行 nscd（名称服务缓存守护进程）的环境下，121 版本之前的 nss_ldap 未能对远程来源的 LDAP 请求进行合理的速率限制与保护。未经身份认证的远程攻击者可通过向目标系统发送大量 LDAP 请求，导致 nscd 缓存守护进程消耗过多系统资源，最终引发拒绝服务。该漏洞影响使用 nss_ldap 与 nscd 配合进行 LDAP 身份验证及名称解析的 Linux/Unix 系统，攻击者无需事先获得系统访问权限即可实施攻击。"
published = "2000-12-11T05:00:00Z"
remediation = "升级 nss_ldap 至 121 或更高版本（如 nss_ldap-121.tar.gz 及后续版本）。若暂时无法升级，可停止 nscd 服务（systemctl stop nscd 或 service nscd stop）或在 /etc/nscd.conf 中禁用 LDAP 缓存（enable-cache ldap no），并重启 nscd 生效。此外可在防火墙层面限制 LDAP 端口（389/636）仅允许受信任 IP 访问，减少攻击面。"
score = 1.2
severity = "LOW"
sources = ["avd"]
title = "红帽 nss_ldap 拒绝服务漏洞"
updated = "2026-06-16T21:53:02Z"

