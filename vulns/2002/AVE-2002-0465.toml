[basic]
description = 'LocalWEB2000 2.1.0 Standard Web 服务器存在文件泄漏漏洞，远程攻击者可通过在 URL 中添加 "/./" 目录遍历序列绕过访问限制，读取服务器上受限制的任意文件。该漏洞无需身份认证即可利用，攻击复杂度低，影响 LocalWEB2000 2.1.0 Standard 版本。攻击者只需构造特制 HTTP 请求即可触发，可能导致敏感信息泄露。目前已有公开的 Exploit-DB 利用代码（ID: 21475）。'
published = "2002-10-04T04:00:00Z"
remediation = '建议立即升级 LocalWEB2000 至非漏洞版本（如 2.1.0 以上版本），或迁移至其他受支持的 Web 服务器软件。如无法升级，可在 Web 服务器前端部署反向代理或 WAF，配置规则拦截包含 "/./" 目录遍历序列的 URL 请求，同时限制对敏感目录的访问权限以降低风险。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "LocalWEB2000 2.1.0 文件泄漏漏洞"
updated = "2026-06-16T21:58:20Z"

