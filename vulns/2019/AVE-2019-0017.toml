[basic]
description = "Windows 错误报告管理器（Windows Error Reporting, WER）在处理硬链接时存在权限提升漏洞。本地低权限攻击者可通过创建恶意硬链接，利用 WER 组件以 SYSTEM 权限执行任意文件操作，从而将权限提升至 SYSTEM 级别。该漏洞攻击复杂度低，无需用户交互，影响 Windows 7/8/10 及 Windows Server 2008/2012/2016/2019 等多个版本。Microsoft 已在 2019 年 10 月安全更新中修复此漏洞。"
published = "2019-10-10T14:15:15Z"
remediation = '立即安装 Microsoft 2019 年 10 月安全更新：Windows 10 1903 版安装 KB4517389，1809 版安装 KB4519338，1709 版安装 KB4520004，Windows Server 2019 安装 KB4519338。如无法立即打补丁，可限制低权限用户对 C:\ProgramData\Microsoft\Windows\WER 目录的写入权限作为临时缓解措施。'
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows 错误报告管理器权限提升漏洞"
updated = "2026-06-17T02:28:21Z"

