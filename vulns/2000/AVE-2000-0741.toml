[basic]
description = "HP TurboIMAGE 数据库管理工具中的 DBUTIL.PUB.SYS 组件存在权限提升漏洞。本地攻击者可通过向 DBUTIL 程序传递特制参数，利用其不正确的权限检查机制，以高于当前用户的权限执行任意操作，导致机密性、完整性和可用性部分受损。该漏洞攻击复杂度低，无需用户交互，但需要本地系统访问权限。"
published = "2000-06-26T04:00:00Z"
remediation = "立即联系 HP 支持获取 MPE/iX 平台 TurboIMAGE 的官方安全补丁并安装。如无法立即打补丁，通过 MPE/iX 文件系统权限控制将 DBUTIL.PUB.SYS 的执行权限限制为仅授权管理员账户，移除普通用户（:PUB 组）的执行权限，同时在系统层面限制非授权用户对 TurboIMAGE 数据库管理工具的访问。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "HP TurboIMAGE DBUTIL 本地特权提升漏洞"
updated = "2026-06-16T21:52:07Z"

