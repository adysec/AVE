[basic]
description = "SuSE Linux 6.3及6.4版本中Apache HTTP服务器的默认配置文件(httpd.conf)存在不当的别名配置漏洞。系统默认将/usr/doc目录映射为/doc/packages的Web可访问路径，导致远程攻击者无需任何身份认证即可通过HTTP请求直接访问该目录下的软件包文档。攻击者可借此获取系统已安装软件包列表、版本号及系统配置信息等敏感数据，为后续针对性攻击提供信息支撑。该漏洞利用条件简单，仅需目标开放HTTP服务即可实施信息泄露攻击。"
published = "2000-12-11T05:00:00Z"
remediation = "编辑 Apache 配置文件 /etc/httpd/httpd.conf，删除或注释掉 `Alias /doc/packages /usr/doc` 行，然后重启 Apache 服务（`rcapachectl restart`）。如无法立即修改配置，可在 httpd.conf 中对 `/doc/packages` 路径添加 `Deny from all` 访问限制作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "SuSE Linux Apache 默认配置信息泄露漏洞"
updated = "2026-06-16T21:52:58Z"

