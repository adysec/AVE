[basic]
description = 'Xerver Free Web Server 2.10 及更早版本在处理 HTTP 请求时存在输入验证漏洞。远程攻击者可以通过发送一个包含大量 "C:/" 序列的特制 HTTP 请求，触发服务器在解析路径时的处理异常，导致程序崩溃并引发拒绝服务（DoS）攻击。该漏洞无需身份验证即可触发，影响所有部署了相关版本的 Xerver 服务器，导致其无法响应正常请求。'
published = "2002-07-26T04:00:00Z"
remediation = '将 Xerver Web Server 升级至 2.11 或更高版本以修复该拒绝服务漏洞，新版本已对包含大量 "C:/" 序列的 HTTP 请求进行过滤处理，防止服务器崩溃。如厂商未发布修复版本，建议迁移至 Apache、Nginx 等仍在维护的 Web 服务器。临时缓解措施可在前端部署反向代理或防火墙规则，拦截包含连续 "C:/" 字符串的异常请求，限制单条请求中特殊字符序列的最大重复次数，并确保 Web 服务器进程配置为崩溃后自动重启以维持服务可用性。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Xerver Web Server HTTP请求拒绝服务漏洞"
updated = "2026-06-16T21:57:27Z"

