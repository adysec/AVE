[basic]
description = "RealNetworks RealPlayer 在处理视频流时存在远程代码执行漏洞，由于程序未正确验证媒体文件头中的 VIDOBJ_START_CODE 字段，远程攻击者可向用户发送特制的恶意视频文件，诱导用户使用 RealPlayer 打开后触发该漏洞，导致任意代码执行。该漏洞影响 RealPlayer 11.x、14.x、15.x 及 RealPlayer SP 1.0~1.1.5 等多个版本，CVSS 评分 9.3，危害严重。用户应升级至 15.0.2.72 及以上版本修复此漏洞。"
published = "2012-02-08T15:55:00.827"
remediation = "升级 RealPlayer 至 15.0.2.72 或更高版本。该版本修复了多个远程代码执行漏洞，包括 VIDOBJ_START_CODE 解析缺陷。如无法立即升级，建议在浏览器中禁用 RealPlayer 插件，或使用防火墙规则阻止 RealPlayer 对外部不可信来源的网络连接作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer 视频流 VIDOBJ_START_CODE 远程代码执行漏洞"
updated = "2026-06-16T23:38:30.970"

