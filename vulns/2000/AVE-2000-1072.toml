[basic]
description = "FreeBSD 4.1.1 及更早版本中的 getnameinfo 函数存在缓冲区处理缺陷，当该函数处理超长 DNS 主机名时，可触发缓冲区溢出导致服务崩溃。远程攻击者无需身份认证，仅需向目标系统发送特制 DNS 查询即可触发该漏洞，造成拒绝服务。该漏洞影响 FreeBSD 4.0/4.1/4.1.1 等版本，CVSS 评分 5.0，危害等级中危。"
published = "2000-12-11T05:00:00Z"
remediation = "升级 FreeBSD 至 4.2 或更高版本，该漏洞已在 FreeBSD-SA-00:63 公告中修复。如无法升级，可应用官方补丁（ftp://ftp.FreeBSD.org/pub/FreeBSD/CERT/advisories/FreeBSD-SA-00:63.getnameinfo.asc）重新编译内核或 libc。临时缓解措施可在边界防火墙上限制 DNS 响应包大小，防止超长主机名触发 getnameinfo 崩溃。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "FreeBSD DNS getnameinfo 拒绝服务漏洞"
updated = "2026-06-16T21:53:05Z"

