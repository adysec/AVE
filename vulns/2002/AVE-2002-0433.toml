[basic]
description = "ViewCVS 0.9.2 的 viewcvs.cgi 页面存在跨站脚本（XSS）漏洞。远程攻击者可通过向 cvsroot 或 sortby 参数注入恶意脚本代码，当其他用户访问特制链接时，脚本将在受害者浏览器中执行，导致 Cookie 被窃取或页面内容被篡改。攻击无需身份认证，仅需诱使用户点击恶意链接即可触发。该漏洞影响 ViewCVS 0.9.2 及更早版本。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 ViewCVS 至 0.9.2-5 或更高版本。如为 Debian 系统，执行 `apt-get update && apt-get install viewcvs`。同时对所有用户输入参数（尤其是 cvsroot 和 sortby）进行 HTML 实体编码输出，避免直接拼接至 HTML 页面。无法升级时，可在 Web 应用防火墙（WAF）层面过滤包含 `<script>` 等危险标签的请求参数作为临时缓解。"
score = 6.4
severity = "MEDIUM"
sources = ["exploitdb"]
title = "ViewCVS viewcvs.cgi 跨站脚本漏洞"
updated = "2026-06-16T21:58:06Z"

