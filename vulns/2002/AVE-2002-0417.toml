[basic]
description = "Apache HTTP Server 2.0.39 和 2.0.40 版本的 mod_cgi 模块存在拒绝服务漏洞。当 CGI 脚本向 stderr 输出大量数据时，httpd 进程与 CGI 子进程之间的读写缓冲区会出现死锁，导致服务器进程挂起并持续消耗内存，最终引发拒绝服务。该漏洞可由本地用户或远程攻击者利用，通过触发产生大量 stderr 输出的 CGI 脚本即可实施攻击。受影响版本包括 Apache 2.0.39 和 2.0.40，CVSS v3.1 评分 7.5，危害等级为高。"
published = "2002-12-31T05:00:00Z"
remediation = "将 Apache HTTP Server 升级至 2.0.44 或更高版本，该修复版本已修正 mod_cgi 模块在 CGI 脚本向 stderr 输出过量数据时导致 httpd 与 CGI 进程之间发生死锁并耗尽内存的问题。建议优先升级至当前受支持的稳定版本 2.4.68。如短期内无法升级，可临时在 httpd.conf 中限制 CGI 脚本的执行权限，仅允许受信任的脚本执行，并监控 Web 服务器进程的内存使用情况，当发现 httpd 进程内存异常增长时立即重启服务以缓解拒绝服务攻击的影响。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Apache HTTP Server mod_cgi 拒绝服务漏洞"
updated = "2026-06-16T22:00:10Z"

