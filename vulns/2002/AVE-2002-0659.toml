[basic]
description = "ZeroBoard 4.1 存在 PHP 文件包含型任意命令执行漏洞。当 PHP 配置中 `allow_url_fopen` 和 `register_globals` 选项同时启用时，攻击者可通过修改 `_zb_path` 参数，将其指向远程 Web 服务器上的恶意 PHP 代码文件，从而在目标服务器上执行任意 PHP 代码。该漏洞影响 ZeroBoard 4.1 版本，攻击者无需身份认证即可发起远程攻击，利用该漏洞可获取服务器控制权限或进行进一步的渗透攻击。"
published = "2002-12-31T05:00:00Z"
remediation = "在 php.ini 中设置 allow_url_fopen = Off 并关闭 register_globals，重启 Web 服务；修改 _head.php 文件，对 _zb_path 参数增加本地路径校验，禁止加载远程 URL；由于 ZeroBoard 4.1 已停止维护且存在多处已知漏洞，建议迁移至持续维护的现代论坛系统（如 phpBB、Flarum）并彻底替换原有代码。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "ZeroBoard 4.1 远程代码执行漏洞"
updated = "2026-06-16T21:59:48Z"

