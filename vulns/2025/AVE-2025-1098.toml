[basic]
description = "Linux 内核 nfsd 组件存在引用计数泄漏漏洞。在将 dl_recall 委托回调排入回调队列前，代码已为 dl_stid 增加引用计数，但若 nfsd4_run_cb 排队失败，该引用计数无法被回调函数释放，导致 nfs4_stid 对象持续泄漏。攻击者可通过向 NFS 服务器发起大量需要委托回调的 NFSv4 操作请求，反复触发该错误路径，逐步耗尽服务器内核内存资源，最终导致拒绝服务。该漏洞影响运行受影响 Linux 内核版本的内核 NFS 服务器，CVSSv3 评分为 7.5。修复方式为检查 nfsd4_run_cb 返回值，在失败时调用 nfs4_put_stid 正确释放引用计数。"
published = "2025-04-16T15:15:55Z"
remediation = "升级 Linux 内核至以下安全版本以修复此漏洞：5.10.236、5.15.180、6.1.134、6.6.87、6.12.23、6.13.11 或更高版本。Ubuntu 22.04 LTS 用户可执行 `sudo apt update && sudo apt upgrade linux-image-generic` 升级至 5.15.0-1083.89 及更高版本；Ubuntu 20.04 FIPS 用户需安装 5.15.0-1114.123~20.04.1 或更高版本。如无法立即升级内核，可临时通过在防火墙限制 NFS 服务端口（2049/tcp、2049/udp）访问范围至受信任网络，缓解未授权 NFS 客户端触发 dl_recall 回调队列失败导致的 nfs4_stid 内存泄漏风险。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 nfsd 引用计数未释放漏洞"
updated = "2026-07-30T06:22:04Z"

