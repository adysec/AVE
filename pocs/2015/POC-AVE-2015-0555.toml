[info]
author = "ave"
description = "Adobe Flash Player ByteArray Use-After-Free 漏洞验证。攻击者通过托管恶意 SWF 文件，诱使目标浏览器加载并执行，利用 ActionScript 3 中 ByteArray 类的 use-after-free 漏洞实现任意代码执行。"
id = "POC-AVE-2015-0555"
name = "CVE-2015-5119 PoC"
severity = "critical"
tags = ["ave-2015-0555"]
vuln_id = [
    "CVE-2015-5119",
    "AVE-2015-0555",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "HT_exploit",
    "HT_Exploit",
    "flash_exploit_",
]
