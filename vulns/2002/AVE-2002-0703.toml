[basic]
description = "CVE-2002-1829是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2002-12-31T05:00:00Z"
remediation = "OpenBB 项目已停止维护，无官方补丁。建议立即迁移至仍在维护的论坛软件（如 phpBB、MyBB 或 Discuz!）以彻底消除漏洞。若暂时无法迁移，应在服务器层面部署 Web 应用防火墙（WAF），对请求中的 `[img]`、`[glow]` 等 BBCode 标签内的 `onerror`、`javascript:`、`<script>` 等危险模式进行拦截过滤；同时手动修改 `codeparse.php`，在 BBCode 转 HTML 过程中对用户输入调用 `htmlspecialchars()` 进行编码，并对 `myhome.php` 中的用户输出同样执行 HTML 实体转义，防止任意脚本注入浏览器执行。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Open Bulletin Board (OpenBB) 1.0.0 RC3 跨站脚本漏洞"
updated = "2026-06-16T22:00:08Z"

