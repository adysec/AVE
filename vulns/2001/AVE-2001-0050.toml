[basic]
description = 'IBM HTTP Server 1.3.x 及 WebSphere Application Server 3.52 中的 Fast Response Cache Accelerator (FRCA) 组件 AfpaCache 模块存在内核信息泄露漏洞。远程攻击者可通过发送一系列特制的畸形 HTTP 请求，触发服务器返回 "bad request" 错误，导致内核内存泄露，最终造成拒绝服务。攻击无需身份认证，通过网络即可发起，CVSS 评分 5.0，危害等级中等。该漏洞影响 IBM HTTP Server 1.3.x 及 WebSphere Application Server 3.52 版本，目前已有公开的 PoC 利用代码。'
published = "2001-03-13T05:00:00.000"
remediation = "IBM 已发布安全公告指出该漏洞影响 IBM HTTP Server 1.3.x 及 WebSphere 3.52，建议升级至 IBM HTTP Server 2.0 以上版本或 WebSphere 4.0 以上版本，并在反向代理配置中禁用 FRCA/AfpaCache 模块作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "IBM WebSphere Application Server Fast Response Cache Accelerator AfpaCache 拒绝服务漏洞"
updated = "2026-06-16T21:53:41.827"

