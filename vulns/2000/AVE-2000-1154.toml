[basic]
description = "标签之间。<value>Quikstore Shopping Cart 的 quikstore.cgi 脚本存在代码执行漏洞。远程攻击者无需身份认证，即可通过在 HTTP GET 请求的 URL 中注入 shell 元字符执行任意系统命令，从而完全控制目标服务器。该漏洞影响部署了 Quikstore 的网站，CVSS 评分为 7.5，危害等级高。"
published = "2000-11-20T05:00:00Z"
remediation = "由于 Quikstore Shopping Cart 已停止维护，建议立即停止使用该软件并迁移至现代电子商务平台。若必须维持运行，请在 Web 服务器前端部署 WAF 或配置过滤规则，拦截所有包含 shell 元字符（如 ; | & ` $）的 HTTP GET 请求以缓解风险。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Quikstore Shopping Cart 远程代码执行漏洞"
