[basic]
description = "Phorum 3.0.7 的 code.php3 脚本存在文件读取漏洞。该脚本在处理 HTTP 请求的 query string 参数时未对用户输入进行充分过滤和验证，未经身份认证的远程攻击者可通过构造包含路径遍历序列的恶意查询字符串，读取 phorum 目录下的任意敏感文件内容。漏洞利用条件宽松，攻击者无需任何凭证即可在远程直接发起攻击，利用复杂度低（CVSS 向量 AV:N/AC:L/Au:N）。该漏洞影响 Phorum 3.0.7 版本，主要威胁系统文件 confidentiality，不会影响数据完整性和服务可用性。"
published = "2000-12-31T05:00:00Z"
remediation = "建议立即升级 Phorum 到 3.1 或更高版本（官方已修复此文件读取漏洞）。若暂时无法升级，请在 Web 服务器配置中禁止直接访问 code.php3，或在代码层面对 query string 参数实施严格的路径遍历过滤（如过滤 ../ 等序列），同时设置 open_basedir 限制 PHP 只能访问 phorum 目录外的文件。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Phorum 任意文件读取漏洞"
updated = "2026-06-16T21:53:25Z"

