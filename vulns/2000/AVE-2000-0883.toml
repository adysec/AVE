[basic]
description = "Worm HTTP Server 存在目录遍历漏洞，远程攻击者无需身份认证即可通过向服务器发送包含 `../` 序列的特制 HTTP 请求，突破路径限制读取服务器上的任意文件。该漏洞源于服务器对用户请求路径过滤不严，未正确处理相对路径跳转符，导致攻击者可遍历目录结构获取敏感信息如配置文件、密码文件等。攻击条件简单，仅需目标服务器开放 HTTP 端口且运行 Worm HTTP Server 软件即可实施。"
published = "2000-10-20T04:00:00.000"
remediation = "立即升级 Worm HTTP Server 至最新版本或更换为受支持的 Web 服务器软件（如 Apache/Nginx）。如无法升级，在 Web 服务器根目录配置中禁用目录遍历功能，并在防火墙层面限制对 80 端口的访问来源，仅允许可信 IP 连接。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Worm HTTP Server 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:52:21.880"

