[basic]
description = 'NukeViet CMS 的新闻模块存在两处反 XSS 过滤器绕过漏洞。`filterAttr()` 方法未过滤 ASCII 进纸符（`\x0C`），攻击者可在事件处理属性名前添加 `\x0C` 绕过 `/^on/` 正则检测；`unhtmlentities()` 方法未过滤十进制 HTML 实体 `&#9;`，可在 `javascript:` URI 中插入 `&#9;` 绕过关键词过滤。拥有新闻发布权限的低权限用户可在文章中注入持久化 JavaScript，当管理员或其他用户访问受影响页面时触发，导致会话劫持、凭据窃取、权限提升等严重后果。厂商已在 commit 中修复此漏洞。'
published = "2026-01-01T00:00:00Z"
remediation = '立即将 nukeviet/nukeviet 升级至 4.6.00 及以上版本。该版本在 vendor/vinades/nukeviet/Core/Request.php 中修复了 filterAttr() 方法（在属性名前过滤 \x00-\x20 控制字符）和 unhtmlentities() 方法（过滤十进制 HTML 实体编码的控制字符）。由于无临时缓解措施，必须升级才能彻底修复。'
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "NukeViet 新闻模块存储型跨站脚本漏洞"
updated = "2026-01-01T00:00:00Z"

