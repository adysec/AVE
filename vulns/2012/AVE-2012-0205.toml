[basic]
description = "Mozilla Firefox/SeaMonkey/Thunderbird 的内容安全策略（CSP）实现未能正确拦截内联事件处理程序，导致安全绕过漏洞。远程攻击者可通过构造特制的 HTML 文档，利用该漏洞绕过 CSP 的内联脚本拦截机制，更容易实施跨站脚本攻击（XSS）。该漏洞影响 Firefox 4.x 至 12.0、Firefox ESR 10.x 之前版本、Thunderbird 5.0 至 12.0、Thunderbird ESR 10.x 之前版本及 SeaMonkey 2.10 之前版本，CVSS 评分 4.3，危害等级中危。"
published = "2012-06-05T23:55:01.763"
remediation = "升级至 Firefox 13、Firefox ESR 10.0.5、Thunderbird 13、Thunderbird ESR 10.0.5 或 SeaMonkey 2.10 及以上版本。各 Linux 发行版用户可通过系统包管理器安装对应安全更新（如 Ubuntu USN-1463-1、Red Hat RHSA-2012:0710/0715）。如无法立即升级，建议在 Web 应用中部署额外 XSS 过滤机制作为补充，不单独依赖 CSP 内联脚本拦截策略。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox/SeaMonkey/Thunderbird 内容安全策略内联事件处理器安全绕过漏洞"
updated = "2026-06-16T23:40:37.123"

