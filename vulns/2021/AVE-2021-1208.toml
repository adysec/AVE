[basic]
description = "FatPipe WARP、IPVPN 及 MPVPN 设备的 Web 管理界面存在文件上传漏洞，未经身份认证的远程攻击者可通过该漏洞绕过上传限制，向文件系统任意目录上传恶意文件，从而获取服务器控制权限或造成拒绝服务。该漏洞影响 10.1.2r60p92 及 10.2.2r44p1 之前的版本，CVSS 评分 9.8，危害等级严重。攻击者无需凭据即可构造特殊上传请求利用此漏洞。"
published = "2021-12-08T17:15:10Z"
remediation = "立即升级 FatPipe WARP/IPVPN/MPVPN 至 10.1.2r60p92 或 10.2.2r44p1 及以上版本。若暂时无法升级，请在 Web 管理接口前部署 WAF 限制文件上传类型与大小，并禁用不必要的文件上传功能；同时在网络层面限制管理接口仅允许受信任 IP 访问。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "FatPipe WARP IPVPN MPVPN 不限制文件类型上传漏洞"
updated = "2026-06-17T03:45:32Z"

