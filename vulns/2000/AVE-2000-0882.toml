[basic]
description = "HP-UX 操作系统中 newgrp 命令存在权限验证不足漏洞。攻击者可利用此漏洞在本地执行 newgrp 命令，绕过权限验证机制，成功提升用户权限至系统管理员级别。该漏洞影响 HP-UX 11.0 版本，攻击者无需任何身份验证即可利用，攻击复杂度较低。可通过修改系统配置文件或执行特定命令触发，导致系统保密性、完整性和可用性受到部分破坏。微软已发布安全补丁修复此漏洞，建议用户及时更新操作系统补丁。"
published = "2000-10-20T04:00:00Z"
remediation = "建议立即安装惠普发布的安全补丁 PHSS_19411（对应安全公告 HPSBUX0008-118），或升级至 HP-UX 11.0 后续修补版本。若无法立即打补丁，可通过移除 newgrp 命令的 setuid 位（chmod u-s /usr/bin/newgrp）或限制本地用户登录权限作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "惠普 HP-UX 权限提升漏洞"
updated = "2026-06-16T21:52:21Z"

