[basic]
description = "Phorum 3.0.7 论坛软件的 read.php3 及其他脚本中存在SQL注入漏洞。该漏洞源于程序对用户输入的 sSQL 参数未进行充分的过滤和验证，未经身份认证的远程攻击者可通过向目标服务器发送包含恶意SQL语句的特制请求，利用 sSQL 参数执行任意SQL查询。攻击者可借此方式读取数据库中的敏感信息、篡改数据甚至获取数据库控制权限。该漏洞影响所有运行 Phorum 3.0.7 版本的站点，攻击者无需任何凭据即可在网络范围内发起远程攻击。"
published = "2000-12-31T05:00:00Z"
remediation = "建议立即升级 Phorum 至 3.4.8a 或更高版本（官方已停止维护，推荐迁移至 Discourse、phpBB 等现代论坛系统）。若暂时无法升级，需在 read.php3 等受影响脚本中对 sSQL 参数实施严格输入验证：使用 addslashes() 或 mysql_real_escape_string() 过滤单引号，禁止执行多条 SQL 语句，并配置数据库账号仅授予必要的 SELECT/INSERT 权限。同时在 Web 应用防火墙（WAF）部署 SQL 注入特征规则拦截含 UNION SELECT、' OR '1'='1 等载荷的请求，日志审计所有数据库错误信息以便溯源。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Phorum 3.0.7 远程SQL注入漏洞"
updated = "2026-06-16T21:53:26Z"

