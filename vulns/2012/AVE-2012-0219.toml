[basic]
description = "Mozilla Firefox 4.x至13.0、Firefox ESR 10.x至10.0.6、Thunderbird 5.0至13.0、Thunderbird ESR 10.x至10.0.6及SeaMonkey 2.11之前版本中存在地址栏欺骗漏洞。该漏洞源于JavaScript的history.forward和history.back函数在处理浏览器历史导航时未能正确更新地址栏显示内容，远程攻击者可通过构造特制网页诱导用户访问，利用历史记录操作使地址栏显示与当前页面实际URL不一致的虚假地址，从而实施钓鱼攻击或欺骗用户信任恶意网站。攻击需用户交互（如点击链接），CVSS评分6.8，危害等级中危。Mozilla已在Firefox 14.0及相应ESR更新中修复此漏洞。"
published = "2012-07-18T10:26:48Z"
remediation = "升级 Mozilla Firefox 至 14.0 及以上版本，Firefox ESR 升级至 10.0.6 及以上版本，Thunderbird 升级至 14.0 及以上版本（ESR 升级至 10.0.6 及以上），SeaMonkey 升级至 2.11 及以上版本。如无法立即升级，可禁用 JavaScript 作为临时缓解措施（在 about:config 中将 javascript.enabled 设为 false）。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox、SeaMonkey、Thunderbird 地址栏欺骗漏洞"
updated = "2026-06-16T23:40:39Z"

