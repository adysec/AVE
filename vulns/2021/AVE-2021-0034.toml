[basic]
description = "Android 调制解调器接口驱动中的 set_skb_priv() 函数存在缓冲区边界检查缺失漏洞。攻击者可通过发送特制数据包触发越界内存读取，进而解引用无效函数指针实现任意代码执行。该漏洞影响 SMR Oct-2021 Release 1 之前的 Android 系统版本，本地低权限用户可利用此漏洞在系统上下文执行代码，获取高权限并完全控制受影响设备。"
published = "2021-10-06T18:15:09Z"
remediation = "将三星移动设备升级至 Security Maintenance Release (SMR) Oct-2021 Release 1 或更高版本。用户可通过「设置」→「软件更新」→「下载并安装」下载并安装最新安全补丁；企业设备管理员应通过 Samsung Knox Mobile Enrollment 或移动设备管理 (MDM) 系统强制推送 SMR Oct-2021 Release 1 及以上更新。如暂无法安装补丁，建议通过网络访问控制限制调制解调器接口的本地调用，阻止低权限应用程序发送特制数据包。补丁下载地址：https://security.samsungmobile.com/securityUpdate.smsb?year=2021&month=10"
score = 7.3
severity = "HIGH"
sources = ["kev"]
title = "Google Android 越界内存读取远程代码执行漏洞"
updated = "2026-06-17T03:42:10Z"

