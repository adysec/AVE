[basic]
description = "Fastream FTP++ 2.0 存在缓冲区溢出漏洞，远程攻击者可通过向 FTP 服务器发送超长用户名触发缓冲区溢出，导致拒绝服务，在特定条件下可能执行任意代码。攻击无需身份认证，仅需网络可达目标服务器的 FTP 端口即可发起利用，危害较大。"
published = "2000-11-14T05:00:00Z"
remediation = "该漏洞影响 Fastream FTP++ 2.0，厂商已停止维护且无官方补丁。建议立即迁移至现代活跃维护的 FTP 服务器（如 FileZilla Server 或 vsftpd）。如无法立即迁移，可在防火墙或 IPS 层面添加规则，过滤包含超长用户名字段的 FTP 登录请求（用户名长度超过 64 字节即拦截），并限制 FTP 服务仅对可信 IP 段开放。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Fastream FTP++ 2.0 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:33Z"

