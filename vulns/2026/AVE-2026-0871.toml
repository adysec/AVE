[basic]
description = 'Mistune 是一个 Python Markdown 解析器。在 3.3.0 版本之前，其 toc 插件和 TableOfContents 指令在生成标题 ID 时，默认使用可预测的 `toc_1`、`toc_2`、`toc_3` 等顺序编号，而不对标题文本内容进行 slugify 处理。攻击者若能在文档中注入 HTML 元素并设置与可预测 ID 相同的 `id="toc_N"` 属性，即可与自动生成的标题锚点发生冲突，导致页面内导航被劫持、CSS 选择器错误匹配或 JavaScript 事件处理被重定向至攻击者控制的内容。该漏洞影响所有使用 Mistune 3.3.0 之前版本并启用了 TOC 功能的应用程序，攻击条件为应用程序渲染了攻击者可控制的 Markdown/HTML 内容（或启用了 `escape=False` 模式）。攻击者只需在文档中提前插入带有目标 ID 的 HTML 元素，即可利用浏览器对重复 ID 的未定义行为，使锚点链接、样式和脚本指向恶意内容，从而干扰用户浏览体验并可能实施钓鱼攻击。'
published = "2026-07-08T17:17:28.867"
remediation = '立即升级 mistune 至 3.3.0 或更高版本（`pip install --upgrade mistune`）。如无法升级，在调用 `add_toc_hook(md)` 或 `TableOfContents` 时传入自定义 `heading_id` 回调函数，基于标题文本生成 slug 化 ID（如使用 `re.sub(r"[^a-z0-9]+", "-", text.lower())`），避免使用默认的纯序号 `toc_N` 命名方案。'
score = 4.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Mistune Markdown 解析器 toc 插件可预测标题 ID 生成漏洞"
updated = "2026-07-09T19:28:30.570"

