[basic]
description = "Unraid Web Server 的 FileUpload.php 组件存在命令注入漏洞，由于系统在将用户提供的字符串用于执行系统调用前未进行适当验证，经过身份认证的远程攻击者可通过构造恶意输入触发该漏洞，在 www-data 用户上下文中执行任意代码。该漏洞影响 Unraid 的 Web 服务器组件，成功利用可导致攻击者完全控制受影响系统，造成严重的信息泄露、权限提升及服务中断风险。CVSS 评分为 8.8，危害等级为高。"
published = "2026-06-24T22:16:49Z"
remediation = "将 Unraid 升级至 7.3.0 或更高稳定版本。操作路径：登录 WebGUI 后前往「Settings → Update」，检查并安装最新可用更新；或从 Unraid 官网下载完整镜像后通过 USB 闪存盘重新刷写升级。如无法立即升级，建议暂时限制 WebGUI 访问权限至可信 IP 段，在防火墙或反向代理层面拒绝外部直接访问 Unraid Web 管理界面，以降低远程利用风险。升级完成后重启系统确保补丁生效。"
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "Unraid Web Server FileUpload 命令注入远程代码执行漏洞"
updated = "2026-06-26T20:15:18Z"

