[basic]
description = 'Microsoft IIS 4.0 的 ISAPI .ASP 解析机制存在缓冲区溢出漏洞，远程攻击者可通过在脚本标签的 "LANGUAGE" 参数中提交超长字符串触发该漏洞，导致任意代码执行。该漏洞影响 IIS 4.0 版本，攻击者需具备向目标服务器发送恶意 HTTP 请求的能力，成功利用后可获取服务器控制权限。'
published = "2001-01-09T05:00:00.000"
remediation = "立即升级到 IIS 7.5 或更高版本（支持 Windows Server 2008/2012/2016/2019/2022），并应用当前安全更新。无法直接升级的 legacy 系统，请禁用不必要的 ISAPI 扩展，实施严格的输入验证，限制对 ASP 处理页面的访问权限，使用 Windows Firewall 仅允许必要端口，通过 URL 扫描器进行定期安全审计。`'LANGUAGE'` 参数输入长度应限制在合理范围内，避免长字符串攻击。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft IIS 4.0 ISAPI 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:15.453"

