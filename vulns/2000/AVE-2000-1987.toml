[basic]
description = 'iCal 2.1 Patch 2 图形界面安装程序在安装过程中使用 "xhost +" 命令禁用了 X 服务器的访问控制机制，导致任何远程主机均可无限制连接到该 X 服务器。远程攻击者无需身份认证即可通过网络连接到目标系统的 X 服务，捕获并监控用户的所有 X Window 事件（包括键盘输入、屏幕显示内容等），进而获取与授权用户相当的系统权限。该漏洞影响安装了 iCal 2.1 Patch 2 的 Unix/Linux 系统，攻击条件宽松且利用过程对用户透明。'
published = "2000-12-11T05:00:00Z"
remediation = "安装 Sun Microsystems 发布的安全更新，将 iCal 升级至 2.1 Patch 3 或更高版本以修复安装脚本中 xhost + 命令的问题。如无法立即升级，应在安装前编辑安装脚本，移除所有 xhost + 调用并改用 xauth 进行 X 服务器认证，同时通过 xhost - 恢复访问控制或配置防火墙仅允许本地 X11 连接。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Apple iCal GUI 安装权限提升漏洞"
updated = "2026-06-16T21:53:05Z"

