[basic]
description = "Intel 公司 Shiva Access Manager 5.0.0 在配置为将配置信息存入 LDAP 目录时，会将 LDAP 根 DN（可分辨名称）及其密码以明文形式写入全局可读（world-readable）的本地文件。本地攻击者无需特权即可读取该文件获取 LDAP 管理员凭据，进而完全控制 LDAP 服务器，导致机密性、完整性与可用性全面受损。该漏洞影响运行于 Solaris 上的 Shiva Access Manager 5.0 相关部署，攻击条件为本地可访问目标主机且产品启用 LDAP 配置存储；利用方式为直接读取含明文密码的配置文件并使用所得凭据接管 LDAP。CVSS 评分 7.2，危害等级高。"
published = "2000-06-06T04:00:00.000"
remediation = "1. 立即修改受影响配置文件的权限，将 $SHIVA_HOME_DIR/insnmgmt/shiva_access_manager/radtac.ini 的访问权限收紧为仅 root 用户可读写：以 root 身份执行 chmod 600 $SHIVA_HOME_DIR/insnmgmt/shiva_access_manager/radtac.ini 并确认文件属主为 root:root，防止本地任意用户读取其中以明文存储的 LDAP root DN 名称及密码。2. 将 radtac.ini 中记录的 LDAP 密码修改为复杂度足够的高强度密码，同时同步更新 LDAP 服务器上的对应凭据，确保在文件权限修复前泄露的密码不再有效。3. 审计系统中是否存在其他由 Shiva Access Manager 生成的明文配置文件（如 $SHIVA_HOME_DIR/insnmgmt/shiva_access_manager/ 下的所有 ini 文件），一并收紧权限并清除其中不必要的敏感信息。4. 由于 Intel Shiva Access Manager 已于多年前停止维护且未发布任何补丁，强烈建议将远程访问认证、授权及计费功能迁移至当前仍在维护的替代产品（如 FreeRADIUS、OpenAM 或商用 IAM 解决方案），从根本上消除因产品停更导致的安全风险。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Intel Shiva Access Manager 5.0 LDAP密码明文存储泄露漏洞"
updated = "2026-06-16T21:51:54.187"

