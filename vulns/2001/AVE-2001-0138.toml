[basic]
description = "Bajie HTTP JServer 0.78 及 0.90 版本中的 UploadServlet 组件存在远程命令执行漏洞。未经身份认证的远程攻击者可通过调用该 Servlet 上传恶意程序文件，随后利用请求中的路径穿越或修改机制访问已上传的文件，从而在目标服务器上执行任意系统命令。该漏洞影响 Bajie WebServer 0.78 至 0.80 以下版本，攻击者无需凭证即可在服务器权限下执行代码，可能导致服务器被完全控制、敏感数据泄露或进一步横向渗透。CVSS v3 评分 7.5，危害等级为高。"
published = "2001-05-03T04:00:00Z"
remediation = "建议立即升级 Bajie HTTP JServer 至 0.80 或更高版本，该版本已修复 UploadServlet 上传后门及路径穿越执行漏洞。如暂时无法升级，应在服务器配置中禁用 UploadServlet 或限制其对 /cgi/bin/ 目录的访问权限，并在防火墙层面阻止外部对上传目录的访问。鉴于 Bajie HTTP JServer 已长期停止维护，建议迁移至仍在持续更新的 Web 服务器产品以获得持续安全支持。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Bajie HTTP JServer 远程代码执行漏洞"
updated = "2026-06-16T21:54:04Z"

