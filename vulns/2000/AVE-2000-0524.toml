[basic]
description = "CVSWeb 1.80 的 cvsweb CGI 脚本存在不安全的 Perl open 函数调用漏洞。具有 CVS 仓库写入权限的远程攻击者可通过向脚本提交包含 shell 元字符的特制请求，利用 open 函数对用户输入过滤不严的缺陷，在目标服务器上执行任意系统命令。该漏洞可导致服务器被完全控制，影响运行 CVSWeb 1.80 的系统。CVSS 评分 7.2，危害等级高。目前已有公开利用代码。"
published = "2000-07-12T04:00:00.000"
remediation = "立即将 CVSWeb 升级至 1.81 或更高版本，该版本修复了 Perl open() 函数对文件名中 shell 元字符过滤不严的问题。如为 FreeBSD 系统，请应用 FreeBSD-SA-00:37 安全公告中的补丁；如为 TurboLinux 系统，请安装 TL-SA-2000-08-15 对应的更新包。临时缓解措施：在 CVS 仓库端限制用户提交包含单引号、分号、反引号等特殊字符的文件名，或在 Web 服务器层面对 cvsweb 脚本的访问进行 IP 白名单限制。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "CVSWeb Developer CVSWeb 1.80 CGI 远程命令执行漏洞"
updated = "2026-06-16T21:52:13.950"

