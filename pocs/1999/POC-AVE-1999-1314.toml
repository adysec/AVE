[info]
author = "ave"
description = "通过向 Classifieds.cgi 的隐藏变量注入系统命令，远程以 Web 进程权限执行任意命令，验证服务器是否受漏洞影响。"
id = "POC-AVE-1999-1314"
name = "Greg Matthews Classifieds.cgi 任意命令执行漏洞 PoC"
severity = "critical"
tags = [
    "cve-1999-0935",
    "rce",
    "cgi",
]
vuln_id = [
    "CVE-1999-0935",
    "AVE-1999-1314",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/classifieds.cgi"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "uid=",
    "www-data",
    "nobody",
]
