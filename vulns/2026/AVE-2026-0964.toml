[basic]
description = """Progress ADC 系列产品（包括 LoadMaster、ECS 连接管理器、对象规模连接管理器和 MOVEit WAF）的 API 中存在操作系统命令注入远程代码执行漏洞。具有 "All" 权限的认证攻击者可通过向 'killsession' 命令提交未经正确清理的输入，在 LoadMaster 设备上以系统权限执行任意命令。该漏洞源于程序未对用户输入进行充分的过滤和转义，导致攻击者能够注入恶意操作系统命令。攻击者需已获得高权限认证且位于相邻网络，CVSS 评分 8.4，危害等级高。"""
published = "2026-04-20T14:16:19.517"
remediation = '立即将 LoadMaster 升级至 V7.2.63.1（GA 版本）或 V7.2.54.17（LTSF 版本），ECS Connections Manager、Object Scale Connection Manager 及 MOVEit WAF 同步升级至 V7.2.63.1。补丁下载地址：https://community.progress.com/s/article/LoadMaster-Security-Vulnerabilites-CVE-2026-3517-CVE-2026-3518-CVE-2026-3519-CVE-2026-4048-CVE-2026-21876。如无法立即升级，可在管理界面限制具备 "All" 权限的账户数量，并严格审计 killsession 命令的调用日志，监控异常命令执行行为。'
score = 8.4
severity = "HIGH"
sources = ["zdi"]
title = "Progress LoadMaster 操作系统命令注入远程代码执行漏洞"
updated = "2026-06-17T10:43:42.497"

