[basic]
description = 'Grav CMS 的 Common/Grav.php 文件存在开放重定向漏洞。由于"Redirect trailing slash"功能未对输入进行充分验证，攻击者可在 URL 中使用经过双重 URL 编码的特殊字符序列（如 %2f%5c）构造恶意请求，诱导 Grav CMS 生成指向外部不受信任站点的重定向响应。当 Grav 安装在域根目录且开启尾部斜杠重定向功能时，该漏洞可被远程触发，未经身份认证的攻击者仅需诱使用户点击恶意链接即可实施攻击，造成钓鱼网站跳转或恶意软件分发等危害。该漏洞影响 Grav 1.7 之前的所有版本，其中 1.6.23 版本仅做了部分修复，1.6.x 系列仍然存在此问题，Grav 1.7 版本已完全修复。'
published = "2020-04-04T19:15:11Z"
remediation = "建议立即升级 Grav CMS 到 1.7.0 或更高版本以完全修复此开放重定向漏洞。若暂时无法升级，可在 1.6.x 分支中应用补丁 commit 2eae104c7a4bf32bc26cb8073d5c40464bfda3f7 进行部分缓解，并配置 Web 应用防火墙 (WAF) 规则拦截包含恶意重定向参数的请求。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Grav CMS 开放重定向漏洞"
updated = "2026-06-17T02:50:20Z"

