[basic]
description = "Beck IPC GmbH IPC@CHIP 嵌入式控制器的 TelnetD 服务存在暴力破解漏洞，其 telnet 登录服务在用户输入错误密码后不会延迟响应或主动断开连接，导致远程攻击者可利用自动化工具对登录账户进行无限制的密码暴力枚举攻击。攻击者无需任何身份认证即可通过网络远程实施攻击，一旦成功破解弱口令即可完全控制目标设备，获取系统最高权限。该漏洞影响 IPC@CHIP 系列嵌入式控制器，CVSS 评分 9.8，危害等级严重。厂商建议用户禁用 Telnet 服务或限制可访问 IP 地址以缓解风险。"
published = "2001-05-24T04:00:00Z"
remediation = "立即禁用 IPC@CHIP 设备上的 Telnet 服务，改用 SSH 进行远程管理。在网络边界防火墙上限制对 IPC@CHIP Telnet 端口（默认 23/TCP）的访问，仅允许受信任的管理 IP 连接。如设备固件仍受厂商支持，请访问 HMS Networks（原 Beck IPC）支持页面 https://www.anybus.com/support 检查是否有最新固件更新。若设备已停产或不再获得厂商支持，建议将 IPC@CHIP 替换为受支持的工业通信控制器，并启用登录失败锁定和延迟机制。"
score = 9.8
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Beck IPC IPC@CHIP Telnet服务暴力破解漏洞"
updated = "2026-06-16T21:56:04Z"

