[basic]
description = 'Microsoft Internet Explorer 5.0 至 5.5 版本存在"通过表单上传文件"安全漏洞。该漏洞的根源在于浏览器对 HTML 表单中 INPUT TYPE=FILE 元素的脚本防护机制存在设计缺陷，恶意网页可利用 JavaScript 或 VBScript 拦截用户在表单文本框中的每次键盘输入，将输入的字符逐字注入到文件上传字段中，从而绕过浏览器限制向文件上传框填充指定文件名。远程攻击者通过构造恶意网页诱骗用户访问并引导用户在表单中输入内容，即可将客户端计算机上的任意已知文件上传至攻击者服务器，但受限于攻击者必须预先知道或猜测目标文件的完整路径和文件名，且文件名长度须与用户在表单中输入的字符数一致，同时用户对目标文件需具有读取权限。每次利用仅能窃取一个文件，且无法对客户端文件进行修改或删除操作。该漏洞影响 Windows 平台上的 Internet Explorer 5.0 至 5.5 版本，CVSS 评分 2.6，危害等级较低。Microsoft 已在安全公告 MS00-093 中发布补丁修复此漏洞，建议用户升级浏览器版本。'
published = "2001-02-16T05:00:00.000"
remediation = "立即将 Internet Explorer 升级至 6.0 或更高版本，或安装 Microsoft 2001 年 3 月安全补丁 (MS01-015)。如无法立即升级，可暂时禁用 Active Scripting 和文件上传功能，或通过组策略限制 IE 对本地文件的访问权限。"
score = 2.6
severity = "LOW"
sources = ["epss"]
title = "Microsoft Internet Explorer 5 客户端任意文件读取漏洞"
updated = "2026-06-16T21:53:38.113"

