[basic]
description = "SuSE Linux 6.2 及可能其他 Linux 发行版中的 ypbind-mt 存在格式化字符串漏洞。远程攻击者可通过向 ypbind-mt 服务发送特制的包含格式化字符串占位符（如 %n、%s）的请求，利用该漏洞实现任意内存写入，从而以 root 权限执行任意代码。该漏洞无需身份认证即可远程利用，攻击复杂度低，CVSS 评分 10.0，危害等级严重，可导致目标系统完全受控。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级 ypbind-mt 至 SuSE 官方补丁版本（参见 SuSE 安全公告 2000 年 11 月补丁），或从 http://archives.neohapsis.com/archives/linux/suse/2000-q4/0262.html 获取修补后的二进制包。如无法立即升级，可在 /etc/inetd.conf 中注释掉 ypbind-mt 服务行并重启 inetd，或使用防火墙限制仅允许受信任子网访问 RPC 端口（111/ypbind 端口）。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "SuSE ypbind-mt 格式化字符串漏洞"
updated = "2026-06-16T21:53:02Z"

