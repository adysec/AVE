[basic]
description = 'Lotus Domino 5.0.4 及更早版本的 SMTP 服务存在缓冲区溢出漏洞。远程攻击者无需身份认证即可通过向 SMTP 服务的 "MAIL FROM" 命令中发送超长的 ENVID 关键字参数触发缓冲区溢出，导致服务崩溃造成拒绝服务，在特定条件下可能执行任意代码。该漏洞影响 Lotus Domino 邮件服务器及企业服务器，CVSS 评分 10.0，危害等级严重。'
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 Lotus Domino SMTP 服务至 5.0.5 或更高版本，该版本已修复 SMTP MAIL FROM 命令中 ENVID 关键字超长导致的缓冲区溢出漏洞。如无法立即升级，可在防火墙或网络层面限制 SMTP 端口的访问来源，仅允许可信邮件服务器连接，并禁用不必要的 SMTP 扩展命令以降低攻击面。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Lotus Domino SMTP服务缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:02.750"

