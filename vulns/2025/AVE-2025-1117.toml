[basic]
description = "Linux内核中的GENEVE（通用网络虚拟化封装）隧道选项解析存在整数溢出漏洞。struct geneve_opt使用5位长度字段表示单个选项大小，理论上应小于128字节，但相关Netlink策略未对该长度进行有效约束。具有本地低权限的攻击者可构造恰好128字节的特制GENEVE选项，伪造零长度选项以混淆内核解析逻辑，进而触发堆越界读取。该漏洞可导致敏感内核内存信息泄露，甚至可能被进一步利用实现权限提升或拒绝服务。此漏洞影响Linux内核多个版本，CVSS评分为7.1，危害等级高。"
published = "2025-04-16T15:15:58Z"
remediation = "立即将 Linux 内核升级至已包含修复的稳定版本：5.10.236、5.15.180、6.1.134、6.6.87、6.12.23、6.13.11、6.14.2 或更高版本，该补丁在相关 Netlink 策略中强制校验 GENEVE 选项长度不得超过 127 字节，防止整数溢出导致堆越界读取。若使用发行版内核，请通过包管理器安装对应安全更新（如 apt upgrade 或 yum update）。如短期内无法升级，可临时限制非特权用户对 tc 命令及 Netlink 套接字的访问权限，例如通过文件系统权限或 capabilities 限制 CAP_NET_ADMIN 的使用，以降低本地低权限进程利用此漏洞的风险。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux kernel GENEVE_Opt 长度整数溢出漏洞"
updated = "2026-07-30T06:22:09Z"

