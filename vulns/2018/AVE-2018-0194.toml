[basic]
description = "TI-Tool TITool PrintMonitor 登录接口的 username 参数存在 SQL 注入漏洞，攻击者可在未经认证的情况下向该参数注入恶意的 SQL 语句，利用 AND/OR 时间盲注技术绕过身份验证或窃取数据库中的敏感信息。该漏洞影响 TITool PrintMonitor 相关版本，CVSS 评分 9.8，危害等级严重。目前官方尚未发布修复补丁，建议通过输入过滤或参数化查询进行缓解。"
published = "2019-12-06T17:15:11Z"
remediation = "升级 TITool PrintMonitor 至 PM18.2.1 或更高版本。该版本已修复登录接口 username 参数的 SQL 注入漏洞。如无法立即升级，可在 Web 应用防火墙（WAF）层面添加规则，对 /login.php 的 username 参数进行 SQL 关键字过滤，并限制登录接口的访问来源 IP。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "TI-Tool TITool PrintMonitor SQL注入漏洞"
updated = "2026-06-17T02:02:57Z"

