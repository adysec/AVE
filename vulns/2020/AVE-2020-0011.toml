[basic]
description = "Windows Installer 在处理 MSI 包时未能正确解析符号链接，存在特权提升漏洞。本地低权限攻击者可通过构造恶意的 MSI 安装包，利用符号链接指向高权限可访问的文件或目录，从而在 SYSTEM 权限下执行任意操作。该漏洞影响所有受支持的 Windows 版本，攻击者成功利用后可完全控制系统，包括安装程序、查看/更改/删除数据或创建新账户。Microsoft 已在 2020 年 2 月安全更新中修复此漏洞。"
published = "2020-02-11T22:15:15.650"
remediation = "立即安装 Microsoft 2020 年 2 月安全更新：Windows 7/Server 2008 R2 用户安装 KB4537820（月度汇总）或 KB4537813（安全仅更新）；Windows 10/Server 2016/2019 用户安装对应版本的 2020-02 累积更新。该漏洞源于 Windows Installer 在处理 MSI 包符号链接时未正确验证权限，攻击者登录后即可提权至 SYSTEM。如无法立即打补丁，可限制非管理员用户安装 MSI 包的权限，通过组策略启用「始终以提升的权限进行安装」为禁用状态，并移除受影响的 Trusted Installer 写权限。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Installer 特权提升漏洞"
updated = "2026-06-17T02:46:20.557"

