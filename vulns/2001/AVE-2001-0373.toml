[basic]
description = "GazTek ghttpd 1.4.x Web服务器存在远程缓冲区溢出漏洞，存在于 util.c 中的 Log() 函数和 protocol.c 中的 serveconnection 函数中。未经身份认证的远程攻击者可通过向这两个函数传递过长参数触发缓冲区溢出，进而执行任意代码。该漏洞影响 GazTek ghttpd 1.4.x 版本，CVSS 评分 7.5（HIGH），攻击向量为网络、攻击复杂度低、无需认证，影响机密性、完整性和可用性。攻击者无需认证即可远程发送超长参数触发缓冲区溢出，实现远程代码执行。ExploitDB 和 GitHub 上均有公开 PoC 代码可供验证利用。建议升级到修复版本或停用该版本服务。"
published = "2001-12-06T05:00:00Z"
remediation = "升级 ghttpd 到 1.4.1 及以上版本，该版本修复了 util.c 中 Log() 函数和 protocol.c 中 serveconnection 的缓冲区溢出问题，增强了输入参数长度验证。通过安装安全补丁并检查 httpd 配置文件中的参数限制，可防止攻击者通过长参数触发漏洞。如无法立即更新，建议通过防火墙限制对 ghttpd 端口的访问，并部署 WAF 以过滤恶意长参数请求。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "GazTek ghttpd 1.4.x 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:55:01Z"

