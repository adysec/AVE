[basic]
description = "Microsoft Excel 存在越界读取（Out-of-bounds Read，CWE-125）漏洞，由于程序在处理特制 Excel 文件时未正确验证内存边界，导致攻击者可读取越界内存中的敏感信息。攻击者需诱使用户打开恶意构造的 Excel 文件（用户交互为必要条件），成功利用后可泄露目标系统内存中的机密数据，进而可能结合其他漏洞实现进一步攻击。该漏洞影响 Microsoft 365 Apps for Enterprise、Excel 2016、Office 2019、Office LTSC 2021 及 Office LTSC 2024（含 macOS 版本）。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:36.963"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新。对于 Windows 版 Microsoft 365/Office，通过「文件→账户→更新选项→立即更新」获取最新补丁；对于 Office for Mac，通过「帮助→检查更新」安装最新版本。无法立即更新的用户应避免打开来自不可信来源的 Excel 文件，并启用受保护的视图（默认开启）作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Excel 信息泄露漏洞"
updated = "2026-06-17T08:43:14.920"

