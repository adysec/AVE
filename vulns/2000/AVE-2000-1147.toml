[basic]
description = "Apache HTTP Server 1.3.0 至 1.3.11 版本存在跨站脚本（XSS）漏洞。攻击者可通过以下途径实施攻击：(1) printenv CGI 脚本（printenv.pl）未对输出进行编码，导致反射型 XSS；(2) ap_send_error_response 函数生成的错误页面（如 404 页面）未指定明确字符集，可被利用执行恶意脚本；(3) 部分 Apache 模块及核心代码生成的消息未正确过滤用户输入。远程攻击者无需认证即可利用这些漏洞，诱使其他用户访问特制链接，在受害者浏览器中执行任意脚本，窃取会话凭证或实施钓鱼攻击。该漏洞影响范围广泛，CVSS 评分 4.3，危害等级中危。"
published = "2000-02-01T05:00:00.000"
remediation = "升级 Apache HTTP Server 至 1.3.12 或更高版本，该版本已修复 printenv.pl 输出编码问题和错误响应页面字符集设置缺陷。如无法升级，删除或禁用 printenv.pl CGI 脚本（位于 cgi-bin/ 目录），并在 httpd.conf 中设置 AddDefaultCharset UTF-8 以防止浏览器自动检测编码执行脚本。"
score = 4.3
severity = "MEDIUM"
sources = ["epss"]
title = "Apache HTTP Server 跨站脚本漏洞"
updated = "2026-06-16T21:53:22.627"

