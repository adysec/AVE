[basic]
description = "undici 的 setCookie 函数存在 cookie 属性注入漏洞，包含两条注入路径：一是 validateCookieDomain 未拒绝分号，攻击者可在 domain 值中注入分号及额外属性（如 SameSite=None）；二是 unparsed 数组仅检查是否包含等号但未对值做净化，攻击者可注入 HttpOnly 等属性。影响将用户可控输入传入 domain 或 unparsed 字段的应用程序，尤其是多租户或反向代理服务器，可导致 SameSite CSRF 防护被绕过，或 Secure、HttpOnly、SameSite 属性被强制修改、剥离或覆盖。该漏洞影响 undici 6.28.0 之前、7.0.0 至 7.29.0 之前、8.0.0 至 8.9.0 之前的版本，CVSS v3.1 评分 4.8，危害等级中等。建议升级至 undici v6.28.0、v7.29.0 或 v8.9.0 以修复此漏洞。"
published = "2026-07-29T17:16:51.123"
remediation = "升级 undici 到 v6.28.0、v7.29.0 或 v8.9.0 及更高版本。如暂无法升级，需对传入 setCookie 的 domain 参数按 RFC 1034 规范清洗，仅允许字母、数字及连字符，并禁止将用户可控数据传入 unparsed 字段。"
score = 4.8
severity = "MEDIUM"
sources = ["ghsa"]
title = "Node.js undici Cookie 属性注入漏洞"
updated = "2026-08-05T15:18:55.053"

