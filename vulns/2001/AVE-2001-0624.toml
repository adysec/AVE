[basic]
description = "GPM（General Purpose Mouse daemon）1.19.3 版本存在符号链接攻击漏洞。本地攻击者可在/tmp等可写目录中预创建恶意符号链接，指向系统关键文件（如/etc/passwd），当GPM服务以root权限向该路径写入数据时，会跟随符号链接覆盖目标文件。攻击条件为拥有本地低权限账户，无需其他特殊权限。该漏洞利用方式简单，可导致系统配置文件被篡改、服务拒绝或权限提升，危害中等。"
published = "2001-03-12T05:00:00.000"
remediation = "升级 GPM 到 1.19.3-4_StackGuard_2 或更高版本。Immunix OS 7.0-beta 用户可通过 Immunix 安全更新 IMNX-2000-70-021-01 获取修复版本。Mandrake Linux 用户应安装 MDKSA-2001:006 补丁。其他 Linux 发行版应联系厂商获取对应补丁。"
score = 1.2
severity = "LOW"
sources = ["cve"]
title = "GPM 1.19.3 符号链接攻击任意文件覆盖漏洞"
updated = "2026-06-16T21:53:41.130"

