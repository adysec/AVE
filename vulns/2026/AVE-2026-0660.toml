[basic]
description = 'Gitea 1.26.1 版本中 OAuth2 登录回调接口存在授权不当漏洞。当用户通过已关联的外部身份提供商（如 GitHub、GitLab、Keycloak 等）进行 OAuth 认证时，回调处理函数 `handleOAuth2SignIn` 会无条件将本地账户的 `IsActive` 标志重置为 `true`，并立即签发有效会话。这导致管理员通过"禁用账户"功能对用户实施的停用操作被静默撤销，被禁用的用户只需完成一次 OAuth 登录即可自动恢复账户活跃状态，重新获得仓库、组织及访问令牌的全部读写权限。攻击条件为攻击者已关联外部 IdP 且管理员曾执行过禁用操作，无需任何额外认证即可绕过管理员权限控制。'
published = "2026-07-03T21:17:05Z"
remediation = "立即将 Gitea 升级至 v1.26.4 或更高版本（该版本已通过 PR #38009 修复 OAuth 回调中自动重新激活已禁用用户的问题）。如无法立即升级，可暂时解除受影响用户的 OAuth 外部身份提供商关联，改为仅使用本地密码登录，并在 IdP 侧撤销该用户的联邦身份授权作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["ghsa"]
title = "Gitea OAuth 登录回调授权不当漏洞"
updated = "2026-07-06T18:18:46Z"

