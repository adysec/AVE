[basic]
description = "Windows Telephony Service（电话服务）存在远程代码执行漏洞，由于该服务对特制请求的验证不充分，未经身份认证的攻击者可通过网络向目标系统发送恶意构造的请求，诱使用户连接恶意服务器或打开恶意文件触发漏洞，成功利用可在目标系统上以 SYSTEM 权限执行任意代码。该漏洞影响多个 Windows 版本，CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复。"
published = "2025-01-14T18:15:40Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新（KB5049984 适用于 Windows Server 2022/Windows 11 21H2；KB5049983 适用于 Windows 10 22H2；KB5050021 适用于 Windows 11 23H2/24H2；KB5049981 适用于 Windows Server 2019），可通过 Windows Update 自动获取。如无法立即打补丁，建议在防火墙层面限制 TAPI 服务对外暴露端口，并禁用不必要的传入 RPC 连接作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:42:52Z"

