[basic]
description = "Paessler PRTG Network Monitor 18.2.40.1683 之前版本存在本地文件包含漏洞，未经身份认证的远程攻击者可通过构造恶意 HTTP 请求，覆盖 /public/login.htm 中 'include' 指令的属性，包含并执行 /api/addusers 接口。攻击者仅需提供 'id' 和 'users' 参数，即可在无需认证的情况下创建具有读写权限（含管理员）的用户账户，进而完全控制监控系统。该漏洞影响所有未升级至 18.2.40.1683 版本的 PRTG Network Monitor 实例，CVSS 3.1 评分 9.8（严重），攻击向量为网络、攻击复杂度低、无需权限、无需用户交互，机密性/完整性/可用性均受高度影响。"
published = "2018-11-21T16:29:00Z"
remediation = "立即升级 PRTG Network Monitor 至 18.2.40.1683 或更高版本（Paessler 官网下载最新安装包覆盖安装）。若暂时无法升级，请在防火墙层面限制 PRTG Web 界面（默认端口 80/443）仅允许受信任管理 IP 访问，并定期审计用户列表排查非授权创建的管理员账号。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Paessler PRTG Network Monitor 本地文件包含漏洞"
updated = "2026-06-17T01:49:15Z"

