[basic]
description = "针对SquirrelMail 1.2.8的安全补丁存在严重缺陷，安全修复程序在调用PHP_SELF变量的strip_tags函数进行XSS过滤时，未将过滤结果保存回原变量，导致跨站脚本攻击仍然可行。攻击者通过网络发送精心构造的HTTP请求，利用PHP_SELF变量中的未过滤代码执行恶意JavaScript脚本，从而窃取用户会话Cookie、重定向用户访问恶意网站等操作。该漏洞影响SquirrelMail 1.2.8版本，攻击者无需身份认证即可远程利用，威胁用户隐私信息安全。2018年11月29日已发布安全通告，建议用户立即升级到SquirrelMail 1.2.9或更高版本以获得完整修复。"
published = "2002-11-29T05:00:00Z"
remediation = "建议立即升级 SquirrelMail 至 1.2.9 或更高版本（如 1.4.0 及以上稳定版），修复 PHP_SELF 变量未正确过滤的 XSS 漏洞。若无法立即升级，可临时修改 src/redirect.php 等相关文件，将 `strip_tags($PHP_SELF)` 修改为 `$PHP_SELF = strip_tags($PHP_SELF);` 确保过滤结果写回变量，或在 Web 服务器层面配置 `php_flag expose_php Off` 并限制 PHP_SELF 暴露作为临时缓解。"
score = 4.3
severity = "MEDIUM"
sources = ["redhat"]
title = "SquirrelMail 1.2.8 跨站脚本漏洞"
updated = "2026-06-16T21:59:02Z"

