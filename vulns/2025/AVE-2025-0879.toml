[basic]
description = "Windows 安装程序文件清理组件存在 Improper Link Resolution Before File Access（链接跟随）漏洞。本地攻击者在获得低权限后，可通过创建特制的符号链接，诱导系统安装程序文件清理进程以更高权限访问恶意目标文件，从而导致权限提升。该漏洞影响 Windows 10/11 及 Windows Server 2008 R2 至 2025 等多个版本，CVSS 评分 7.1，危害等级高危。攻击者需具备本地访问权限和低权限用户身份，无法远程利用。Microsoft 已在 2025 年 2 月安全更新（KB5051974）中修复此漏洞。"
published = "2025-02-11T18:15:40.227"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新 (KB5051974)，该更新修复了 Windows Setup Files Cleanup 中的符号链接竞争条件漏洞。受影响版本包括 Windows 10 1507/1607/1809/21H2/22H2、Windows 11 22H2/23H2/24H2 及 Windows Server 2016/2019/2022/2025，对应修复版本号分别为 10.0.10240.20915、10.0.14393.7785、10.0.17763.6893、10.0.19044.5487、10.0.19045.5487、10.0.22621.4890、10.0.22631.4890、10.0.26100.3194、10.0.20348.3207、10.0.25398.1425。可通过 Windows Update 自动获取，或从 Microsoft Update Catalog 手动下载。临时缓解措施：限制低权限用户对系统安装目录的写入权限，并启用 Windows Defender 攻击面减少规则以阻止符号链接提权攻击。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 安装程序文件清理特权提升漏洞"
updated = "2026-06-17T08:43:19.380"

