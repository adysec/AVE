[basic]
description = "Apple iTunes 使用的 WebKit 引擎存在内存破坏漏洞，未身份认证的远程攻击者可通过诱导用户访问恶意网页触发该漏洞，导致任意代码执行或应用程序崩溃。该漏洞影响 iTunes 10.7 之前的版本，CVSS 评分 6.8，危害等级中等。攻击者需构造包含恶意内容的网页，诱导用户访问后即可利用此漏洞实施攻击。"
published = "2012-09-13T10:30:20.557"
remediation = "立即将 Apple iTunes 升级至 10.7 或更高版本，同时将 Safari 浏览器更新至 6.0.1 或更高版本以修复 WebKit 内存破坏漏洞。若无法立即打补丁，可在 Safari 中禁用 JavaScript 执行作为临时缓解措施，并避免访问不可信网站以降低被利用风险。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:42.773"

