[basic]
description = "Roxen WebServer 2.0.69之前版本存在空字节注入漏洞。远程攻击者通过在URL中插入空字符(%00)，可绕过访问控制限制、列出任意目录内容并读取服务器端源代码文件。该漏洞利用无需认证，攻击复杂度低，仅需构造特制HTTP请求即可触发。"
published = "2000-07-21T04:00:00Z"
remediation = "立即升级 Roxen WebServer 至 2.0.69 或更高版本，该版本已修复空字节注入漏洞。如无法升级，可在 Web 服务器前端部署反向代理（如 Nginx/Apache），配置规则拦截 URL 中包含 %00 或空字节的请求，同时限制目录列表功能，确保 Directory Listing 处于关闭状态。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Roxen WebServer 2.0.x 空字符请求目录遍历漏洞"
updated = "2026-06-16T21:52:14Z"

