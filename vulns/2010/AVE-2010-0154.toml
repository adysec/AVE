[basic]
description = "LibTIFF 3.9.3 之前版本中的 FAX3 解码器 tif_fax3.c 文件的 Fax3SetupState 函数存在多个整数溢出漏洞，该漏洞被 Apple Mac OS X 10.5.8 及 10.6.4 之前版本的 ImageIO 组件所使用。远程攻击者可通过向目标系统提交特制的 TIFF 文件触发堆缓冲区溢出，导致应用程序崩溃或实现任意代码执行。攻击成功需要用户打开恶意构造的 TIFF 图像文件，无法远程直接利用。"
published = "2010-06-17T16:30:01Z"
remediation = "升级 LibTIFF 至 3.9.3 或更高版本；Apple Mac OS X 用户升级至 10.6.4 或更高版本。无法立即升级时，避免使用受影响系统打开来源不可信的 TIFF 文件。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Mac OS X ImageIO LibTIFF FAX3解码器整数溢出远程代码执行漏洞"
updated = "2026-06-16T23:18:19Z"

