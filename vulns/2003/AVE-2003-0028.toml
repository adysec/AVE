[basic]
description = "Red Hat Enterprise Linux 2.1 及其他操作系统中所包含的 mod_auth_any 认证模块存在参数转义缺陷，当该模块调用外部程序进行认证时，未能正确转义用户提供的参数，导致攻击者可通过在认证请求中注入 shell 元字符（如管道符、分号等）执行任意系统命令。该漏洞无需身份认证即可远程利用，攻击者成功利用后可完全控制目标系统，影响范围包括使用 mod_auth_any 的各类 Linux 发行版。"
published = "2003-05-12T04:00:00Z"
remediation = "立即卸载 mod_auth_any 软件包，该模块已不再维护且存在严重命令注入漏洞。对于 Red Hat Enterprise Linux 2.1 系统，应升级至 Red Hat 官方提供的修复版本（如 mod_auth_any-1.3-1）或迁移至受支持的 RHEL 版本。替代方案是使用 mod_authz_core 或 mod_authn_file 等 Apache 内置认证模块，避免使用调用外部程序的第三方认证模块。同时检查 Apache 配置中所有 Auth_Any 指令，确保已移除或替换为安全实现。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Red Hat Enterprise Linux mod_auth_any 任意命令执行漏洞"
updated = "2026-06-16T22:01:29Z"

