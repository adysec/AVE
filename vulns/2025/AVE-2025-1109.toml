[basic]
description = "Linux 内核 ksmbd 模块存在释放后重用漏洞。在多通道（multichannel）模式下，当第二个通道通过第一个通道的连接建立会话时，会话注销函数 ksmbd_sessions_deregister() 中存在释放后重用问题：已通过全局会话表释放的会话可被连接结构体的 ->sessions 再次访问，导致攻击者可能劫持程序执行流程。该漏洞影响启用了 ksmbd 的 Linux 内核版本，攻击者需要具备较低权限并能够向目标 SMB 服务发送特制请求。成功利用该漏洞可导致远程代码执行，CVSS 评分 8.8，危害等级高。Debian 12 及 Ubuntu 25.04 等发行版已在安全更新中修复此漏洞。"
published = "2025-04-16T15:15:56Z"
remediation = "将 Linux 内核升级至安全版本（6.1.134、6.6.87、6.12.23、6.13.11 或 6.14.2 及以上），或临时通过 rmmod ksmbd 禁用 ksmbd 内核 SMB 服务器模块以阻断利用路径。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 ksmbd 会话注销释放后使用漏洞"
updated = "2026-06-17T08:44:54Z"

