[basic]
description = "FineCms 5.0.9 版本中存在 URL 重定向漏洞，位于 controllers/Weixin.php 文件的 sync 动作中，攻击者可通过构造恶意的 url 参数将用户重定向至任意外部网站。该漏洞属于开放重定向（CWE-601），攻击者无需身份认证即可利用，但需要用户交互（点击恶意链接）。成功利用可导致钓鱼攻击、诱导用户访问恶意站点，造成信息泄露或进一步的社会工程攻击。CVSS 评分 6.1，危害等级中危。"
published = "2017-07-24T00:29:00Z"
remediation = "升级 FineCms 至 5.0.9 以上版本（如已停止维护则迁移至其他 CMS）。如无法升级，修改 controllers/Weixin.php 中 sync 操作的 url 参数处理逻辑，添加白名单校验，仅允许跳转到可信域名，并禁止未经验证的外部 URL 重定向。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "dayrui FineCMS 开放重定向漏洞"
updated = "2026-06-17T01:02:03Z"

