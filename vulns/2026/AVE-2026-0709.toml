[basic]
description = "Pterodactyl 的 Wings 组件在 `/upload/file` 接口中存在 JWT 作用域验证不足的权限提升漏洞。由于 Wings 仅校验 JWT 是否包含 `server_uuid`、`user_uuid` 和 `unique_id` 等必要声明，而未验证该令牌的预期用途，导致攻击者可以将低权限操作（如 WebSocket 连接或文件下载）生成的 JWT 令牌复用于文件上传接口。只要攻击者拥有最低限度的子用户权限（如 `websocket.connect`），即可通过重放该令牌绕过 `file.create` 权限检查，从而在目标服务器上任意上传文件，导致服务器被非法篡改或执行远程代码。该漏洞影响 Panel 1.12.3 及 Wings 1.12.2 之前的版本。"
published = "2026-07-28T16:19:00Z"
remediation = "建议将 Pterodactyl Panel 升级至 1.12.3 版本，并将 Wings 升级至 1.12.2 版本，以修复 JWT 范围验证不足导致的文件上传权限提升漏洞。"
score = 8.1
severity = "HIGH"
sources = ["ghsa"]
title = "Pterodactyl Wings JWT 验证失效导致的文件上传权限提升漏洞"
updated = "2026-07-28T17:16:51Z"

