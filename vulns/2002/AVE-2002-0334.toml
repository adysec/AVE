[basic]
description = "CVE-2002-0542是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2002-07-03T04:00:00Z"
remediation = "升级到 OpenBSD 3.0（2002年4月11日 errata 018 之后版本）或更高版本，或手动应用官方补丁 018_mail.patch 至 src/usr.bin/mail/collect.c 并重新编译 mail。具体操作：cd /usr/src && patch -p0 < 018_mail.patch，然后 cd usr.bin/mail && make cleandir && make obj && make depend && make && make install。同时检查 cron 中 mail 调用配置，禁用非必要的交互式 mail 调用以降低风险。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "OpenBSD mail 命令注入漏洞"
updated = "2026-06-16T21:57:38Z"

