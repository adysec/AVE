[basic]
description = "GIMP 的 HDR 文件解析功能存在堆缓冲区溢出漏洞，由于在将用户数据复制到堆缓冲区前未正确验证数据长度，导致可写入越界数据。远程攻击者可诱导用户访问恶意页面或打开特制的 HDR 文件触发该漏洞，实现以当前进程上下文的权限执行任意代码。该漏洞影响 GIMP 全版本，CVSS 评分 7.8，危害等级高，需用户交互配合利用。"
published = "2026-06-24T22:16:46Z"
remediation = "立即将 GIMP 升级至 3.2.4 或更高版本（2026 年 4 月发布，已修复底层 GEGL 库的 HDR 解析漏洞）。RHEL 8 用户安装 gegl >= 0.2.0-40.el8_10（RHSA-2026:38485），RHEL 9 用户安装 gegl04 >= 0.4.62-1.el9_8.1（RHSA-2026:38497）。如无法升级，在文件关联设置中取消 .hdr 文件与 GIMP 的默认关联，并教育用户不要打开来源不明的 HDR 文件。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "GIMP HDR 文件解析堆缓冲区溢出远程代码执行漏洞"
updated = "2026-07-15T02:19:28Z"

