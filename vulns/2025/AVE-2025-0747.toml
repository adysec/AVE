[basic]
description = "Windows COM 服务器组件存在信息泄露漏洞，源于 COM 服务器在使用未初始化的资源（CWE-908）时未能正确处理内存对象，导致敏感信息被不当暴露。具有低权限的本地认证攻击者可通过在受影响系统上运行特制应用程序来利用此漏洞，获取本不应被访问的敏感信息。该漏洞影响 Windows 10/11 及 Windows Server 2008/2012/2016/2019/2022/2025 等多个版本，CVSS 评分 5.0，危害等级中危。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T00:00:00Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新（KB5050061），或通过 Windows Update 自动更新。受影响版本包括 Windows 10/11 及 Windows Server 2008~2025 全系列，更新后对应版本号分别为 10.0.10240.20890（1507）、10.0.14393.7699（1607/2016）、10.0.17763.6775（1809/2019）、10.0.19044.5371（21H2）、10.0.19045.5371（22H2）、10.0.22621.4751（11 22H2）、10.0.22631.4751（11 23H2）、10.0.26100.2894（11 24H2/Server 2025）、10.0.20348.3091（Server 2022）。如无法立即打补丁，建议限制本地用户登录权限作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows COM Server 信息泄露漏洞"
updated = "2025-01-14T00:00:00Z"

