[basic]
description = '24Link 1.06 Web 服务器存在访问控制绕过漏洞，其核心原理是服务器对 HTTP GET 请求中的路径规范化处理存在缺陷，未能正确规范化并验证请求路径中的特殊字符序列。远程未经身份认证的攻击者可通过在 HTTP GET 请求的路径前预置 "/+/" 或 "/." 等特殊字符串，绕过服务器的访问限制机制，直接访问受保护的目录或文件资源。该漏洞影响 24Link Web Server 1.06 版本，CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），攻击向量为网络、攻击复杂度低、无需认证即可利用，成功利用可导致机密性、完整性和可用性均遭受部分损失。攻击者只需构造包含特殊路径前缀的 HTTP GET 请求发送至目标服务器即可触发漏洞，无需特殊权限或用户交互。建议升级至修复版本或配置 Web 服务器规范化并严格校验请求路径。'
published = "2001-01-09T05:00:00.000"
remediation = '建议升级到 24Link 1.08 或更高版本，该版本修复了路径解析漏洞，移除了对"/+"/"或"/."等特殊字符串的自动处理。在升级前，可临时通过防火墙规则阻止包含"/"字符的异常HTTP请求作为缓解措施。详细补丁信息请参考24Link官方安全公告中的CVE-2000-1118补丁说明。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "24Link Web Server 安全绕过漏洞"
updated = "2026-06-16T21:53:11.143"

