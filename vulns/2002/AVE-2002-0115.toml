[basic]
description = "Bugzilla 2.14.1 之前版本中的 CGI.pl 文件在启用 LDAP 认证时存在认证绕过漏洞。远程攻击者无需任何身份认证即可通过发送不包含密码字段的 HTTP 请求，导致 CGI.pl 向 LDAP 服务器发送空密码从而获取匿名绑定权限。攻击者可利用该漏洞绕过身份验证机制，以匿名 LDAP 用户身份访问系统，进而可能获取敏感信息或执行未授权操作。该漏洞影响所有使用 LDAP 认证的 Bugzilla 2.14.1 之前版本，CVSS v2.0 评分为 10.0，危害等级严重。"
published = "2002-01-31T00:00:00Z"
remediation = "立即将 Bugzilla 升级至 2.14.1 或更高版本，该版本修复了 CGI.pl 中 LDAP 认证时未校验空密码的问题。如无法立即升级，可在 LDAP 服务器端禁用匿名绑定（将 nsslapd-allow-anonymous-access 设为 off），或在 Bugzilla 配置中临时关闭 LDAP 认证方式，改用本地数据库认证作为替代。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Bugzilla LDAP认证绕过漏洞"
updated = "2002-01-31T00:00:00Z"

