[basic]
description = "Synology DiskStation DS925+ 的 MailPlus 组件存在通信通道未正确限制漏洞。该漏洞源于 MailPlus 防火墙规则配置缺陷，导致 Redis 实例意外通过 IPv6 协议暴露在网络上。网络相邻的未认证攻击者可利用此漏洞直接访问 Redis 实例，获取敏感信息（如缓存数据、会话密钥等），并可能结合其他漏洞实现以 root 权限执行任意代码。攻击者无需任何认证即可发起攻击，攻击复杂度低。Synology 已发布安全公告 Synology_SA_26_11 修复此漏洞。"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 Synology MailPlus Server 升级至以下修复版本：DSM 7.3 升级至 4.0.1-31663 及以上，DSM 7.2.1/7.2.2 升级至 4.0.1-21663 及以上。如无法立即升级，可在网络防火墙层面禁用 IPv6 访问，或限制对 Redis 端口（6379）的访问仅允许受信 IP 段，以降低被相邻网络攻击者利用的风险。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "Synology DiskStation DS925+ MailPlus Redis 实例不当暴露漏洞"
updated = "2026-01-01T00:00:00Z"

