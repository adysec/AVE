[basic]
description = "CGI Script Center Account Manager 1.0 LITE/PRO 的管理密码更改功能存在身份验证缺失漏洞。远程攻击者无需任何认证，可直接调用 amadmin.pl 脚本并传入 setpasswd 参数，即可任意修改管理员密码，从而获取 Account Manager 的管理权限。该漏洞影响 Account Manager LITE 及 PRO 版本，攻击复杂度低，无需用户交互，可导致敏感信息泄露、权限提升及系统被篡改。CVSS 评分 7.5，危害等级高。"
published = "2000-10-20T04:00:00Z"
remediation = "厂商 CGI Script Center 已停止维护 Account Manager 产品线，建议立即停止使用 Account Manager LITE/PRO，迁移至其他受支持的账户管理方案。临时缓解措施包括：在 Web 服务器层面限制 amadmin.pl 的访问 IP 白名单，移除或重命名 amadmin.pl 脚本，或在脚本中添加管理员会话验证逻辑以防止未授权调用。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "CGI Script Center Account Manager 1.0 认证绕过漏洞"
updated = "2026-06-16T21:52:16Z"

