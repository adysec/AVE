[basic]
description = "Apple iOS 设备中的 Sorenson 编解码器在处理 Sorenson 编码的电影文件时存在未初始化内存访问漏洞。该漏洞位于 QuickTime（Mac OS X）和 CoreMedia（iOS）组件中，影响 iOS 6 之前版本及 Mac OS X 10.7.5 之前版本。远程攻击者可通过向用户发送或诱使其打开特制的 Sorenson 编码电影文件触发该漏洞，导致应用崩溃（拒绝服务）或远程代码执行。攻击者无需身份认证即可在目标设备上执行任意代码，CVSS 评分 6.8，危害等级中等。"
published = "2012-09-20T21:55:03Z"
remediation = "iOS 用户应立即升级到 iOS 6 或更高版本；Mac OS X 用户应升级到 10.7.5 或安装安全更新 2013-002。临时缓解措施包括避免打开来源不明的 Sorenson 编码电影文件，并禁用 QuickTime 的影片自动播放功能。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iOS Sorenson编解码器未初始化内存访问漏洞"
updated = "2026-06-16T23:43:48Z"

