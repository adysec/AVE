[basic]
description = "htDig 是一款开源的网站全文检索工具，其 htsearch 程序（版本 3.2 beta、3.1.6、3.1.5 及更早版本）存在敏感信息泄露漏洞。漏洞原理在于，当攻击者通过 config 参数请求一个不存在的配置文件时，htsearch 会生成包含服务器完整物理路径的错误信息并直接返回给客户端。攻击条件为无需任何身份认证，远程攻击者仅需向目标 Web 服务器发送特制的 HTTP 请求即可触发，利用方式简单，通过构造带 config 参数指向不存在文件的请求，便能从错误回显中获取服务器文件系统的绝对路径。该信息可为后续侦察与攻击提供便利，属于 CWE-209 类的信息暴露问题，CVSS 评分 5.0，危害等级中等。"
published = "2001-08-31T04:00:00Z"
remediation = "建议升级至 htDig 3.2 正式版及以上版本，此版本已修复 htsearch 通过错误消息泄露物理路径的问题。若暂时无法升级，可在 Web 服务器层配置自定义错误页面，过滤或替换错误消息中返回的完整物理路径信息；同时通过访问控制（如 IP 白名单）限制 htsearch CGI 的调用范围，仅允许可信来源访问，并关闭服务器详细的错误报告以降低信息泄露风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "htDig htsearch 通过错误消息泄露服务器物理路径的信息泄露漏洞"
updated = "2026-06-16T21:53:20Z"

