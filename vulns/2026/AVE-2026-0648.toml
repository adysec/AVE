[basic]
description = "webtransport-go 在处理 WebTransport 会话中未知类型的胶囊（capsule）时存在内存耗尽漏洞。该库在跳过未知胶囊时使用 `io.ReadAll` 将整个胶囊体读入内存，而非直接丢弃数据。攻击者可通过发送声明了超大负载长度的未知胶囊，导致接收端分配大量内存，从而引发拒绝服务（DoS）。QUIC 流控机制无法限制此类分配，因为读取流会推进流控窗口但数据仍保留在内存中。该漏洞影响使用 webtransport-go 库的所有应用，攻击者只需建立 WebTransport 会话即可触发，无需任何身份认证。"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 github.com/quic-go/webtransport-go 升级到 v0.11.1 或更高版本。该版本将跳过未知 capsule 时的处理方式从 `io.ReadAll`（全量读入内存）改为 `io.Discard`（直接丢弃），从而消除内存耗尽风险。如无法立即升级，可在网络边界限制 QUIC 连接中未知 capsule 类型的最大长度作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "quic-go webtransport-go 内存耗尽拒绝服务漏洞"
updated = "2026-01-01T00:00:00Z"

