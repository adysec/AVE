[basic]
description = "Lmail 2.7 及更早版本存在临时文件竞争条件漏洞。本地攻击者可通过在目标系统上创建符号链接（symlink）指向任意文件，当 Lmail 在处理临时文件时由于未对文件操作进行原子性检查，攻击者可利用该时间差竞争条件将临时文件重定向至系统任意文件，从而覆盖目标文件内容。该漏洞攻击复杂度较高，需要本地用户权限，成功利用可导致敏感文件被篡改或系统服务异常。"
published = "2001-07-05T04:00:00Z"
remediation = "立即升级 Lmail 至 2.7 以上版本，或替换为其他受维护的本地邮件投递代理（如 Postfix 内置的 local delivery 或 procmail）。如无法升级，可临时移除 lmail 的 setuid root 权限（执行 `chmod u-s /usr/bin/lmail`）以消除提权风险，但会限制部分功能。同时避免在多用户环境下使用 lmail 处理临时文件。"
score = 3.7
severity = "LOW"
sources = ["exploitdb"]
title = "Lmail 2.7 临时文件竞争条件漏洞"
updated = "2026-06-16T21:55:33Z"

