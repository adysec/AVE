[basic]
description = "OpenOffice.org 3.3之前版本的soffice启动脚本在处理LD_LIBRARY_PATH环境变量时存在路径遍历漏洞。该脚本在LD_LIBRARY_PATH中插入了一个空目录名，导致动态链接器在搜索共享库时优先搜索当前工作目录而非系统库目录。本地攻击者可通过将恶意共享库放置在目标用户即将运行OpenOffice的目录中，诱使受害者在受控目录下启动soffice，从而加载恶意库实现权限提升。该漏洞影响OpenOffice.org 3.x全系列版本，CVSS评分6.9，危害等级较高。"
published = "2011-01-28T22:00:05Z"
remediation = "升级到 OpenOffice.org 3.3 或更高版本。如无法立即升级，在运行 soffice 或其他 OpenOffice.org shell 脚本前，确保 LD_LIBRARY_PATH 环境变量不为空，或手动清除当前目录中的恶意共享库文件。"
score = 6.9
severity = "MEDIUM"
sources = ["tenable"]
title = "Apache OpenOffice LD_LIBRARY_PATH本地权限提升漏洞"
updated = "2026-06-16T23:23:20Z"

