[basic]
description = "IBM AIX 4.3.x 系统中的 piobe 命令（位于 /usr/lib/lpd/piobe）存在缓冲区溢出漏洞。由于该命令在处理环境变量时未对输入长度进行有效边界检查，本地攻击者可通过设置超长的环境变量触发缓冲区溢出，进而覆盖栈内存并劫持程序执行流程。该漏洞允许本地未授权用户提升自身权限至超级用户级别，从而完全控制受影响的系统。该漏洞影响 IBM AIX 4.3.x 版本，攻击条件要求攻击者已具备对系统的本地访问权限，利用方式为在调用 piobe 命令时通过长环境变量触发溢出，CVSS 评分为 7.2，危害等级高。IBM 已在后续安全更新中修复此漏洞，建议受影响用户升级至更高版本或应用相应补丁。"
published = "2001-01-09T05:00:00.000"
remediation = "立即安装 IBM 针对 CVE-2000-1124 发布的 APAR 修复包 IY12638，可通过 IBM Fix Central 下载对应 AIX 4.3.x 版本的补丁并执行 installp 命令安装。安装完成后使用 oslevel -s 或 lslpp -l bos.rte.printers 验证补丁版本已更新，然后执行 stopsrc -g spooler 和 startsrc -g spooler 重启打印子系统使修复生效。作为临时缓解措施，可修改 /etc/security/login.cfg 限制非特权用户对 piobe 命令的执行权限，或通过 chmod 移除 /usr/lib/lpd/piobe 的 setuid 位以阻断提权路径。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "IBM AIX piobe 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:53:11.990"

