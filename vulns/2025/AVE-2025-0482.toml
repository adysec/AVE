[basic]
description = "GNU Binutils 2.43 版本的 ld 组件中 bfd/libbfd.c 文件的 bfd_putl64 函数存在内存损坏漏洞（CWE-119）。攻击者可通过构造特制的二进制文件，在链接处理过程中触发越界内存操作，导致程序崩溃或潜在代码执行。该漏洞攻击复杂度较高，远程攻击者需诱导用户处理恶意文件方可利用。GNU Binutils 2.44 版本已修复此问题。"
published = "2025-02-11T00:00:00Z"
remediation = "升级 GNU Binutils 至 2.44 或更高版本，该漏洞已在 2.43 至 2.44 之间被修复。SUSE 用户请应用 SUSE-SU-2025:4096-1 安全更新。在 aarch64 架构上不要对旧代码流启用 '-z gcs=implicit' 链接选项作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["msrc"]
title = "GNU Binutils ld 内存损坏漏洞"
updated = "2025-02-11T00:00:00Z"

