[basic]
description = "Microsoft SQL Server 7.0/2000 及 Microsoft SQL Server Desktop Engine (MSDE) 1.0/2000 中的 xp_displayparamstmt 扩展存储过程函数存在缓冲区溢出漏洞。该函数在调用 SQL Server API 中的 srv_paraminfo 函数前未正确限制缓冲区长度，导致攻击者可向 xp_displayparamstmt 传入特制参数触发缓冲区溢出。成功利用此漏洞的攻击者可导致目标 SQL Server 服务崩溃（拒绝服务）或执行任意命令。该漏洞需要攻击者具有本地登录权限，无法远程直接利用，但低权限用户可利用此漏洞提升权限或破坏数据库服务。"
published = "2001-01-09T05:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-092 提供的补丁：SQL Server 7.0 用户需先升级至 Service Pack 2，再安装该补丁（后续 SP3 已包含此修复）；SQL Server 2000 用户直接安装补丁（后续 SP1 已包含）。同时检查所有第三方扩展存储过程（XP）对 srv_paraminfo() 的调用是否正确分配缓冲区。如无法立即打补丁，建议将 SQL Server 服务账号配置为普通用户权限而非管理员权限，以限制攻击成功后的影响范围。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft SQL Server 7.0/2000 / Data Engine 1.0/2000 xp_displayparamstmt 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:06.653"

