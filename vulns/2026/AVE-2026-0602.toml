[basic]
description = "Coder 尾网协调器（tailnet coordinator）在验证代理节点时，仅校验其 `Addresses` 字段是否源自认证 UUID，但未对 `AllowedIPs` 字段进行同等检查。恶意工作区代理可向协调器提交伪造的 `AllowedIPs` 前缀（如其他代理的尾网地址），协调器将其原样转发给隧道对端并写入 WireGuard 对端配置，导致路由劫持。攻击者利用此漏洞可拦截 Web 终端和工作区应用的流量，提供伪造内容。利用条件为拥有运行中工作区的认证用户配合修改过的代理二进制文件。该漏洞影响 Coder 2.34.2 之前版本、2.33.8 之前版本、2.32.7 之前版本及 2.29.17 之前版本，CVSS 评分 8.2，危害等级高危。官方已在对应版本中修复，修复方式为对 `AllowedIPs` 前缀进行与 `Addresses` 相同的 UUID 校验。"
published = "2026-07-08T00:16:33Z"
remediation = "立即升级 Coder 至以下已修复版本：v2.34.2、v2.33.8、v2.32.7 或 v2.29.17（ESR）。如无法立即升级，应持续监控 tailnet coordinator 日志中是否存在 agent 广播异常 AllowedIPs 前缀的行为，并配合入侵检测系统对可疑路由变更进行告警。"
score = 8.2
severity = "HIGH"
sources = ["ghsa"]
title = "Coder 尾网协调器 AllowedIPs 校验缺失导致路由劫持漏洞"
updated = "2026-07-08T19:44:06Z"

