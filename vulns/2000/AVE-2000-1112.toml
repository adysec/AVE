[basic]
description = "Recourse ManTrap 1.6 是一款用于检测 ManTrap 根kit 的安全工具，但其自身存在严重的安全漏洞。当攻击者获取到系统根权限时，可以利用该工具的 crash 或 fsdb 等功能访问 /dev/mem 和原始磁盘设备等低级系统资源。这种权限绕过行为允许攻击者深入读取系统内存，识别 ManTrap 进程的存在并对其进行操控，甚至可以直接修改任意数据文件。攻击者通过这种手段可以隐藏自己的根kit活动、破坏安全检测机制、窃取敏感数据或破坏系统完整性。该漏洞影响早期版本的 Recourse ManTrap 产品，攻击者需要首先获取系统控制权，但一旦达到该条件，后果将极其严重。美国国家安全局曾在2002年披露过类似类型的漏洞，充分暴露了基于root权限的安全检测工具本身可能被逆转为攻击工具的风险。当前尽管该产品已基本退出历史，但类似的设计缺陷仍广泛存在于其他安全工具中，提醒安全从业者必须对权限管理进行更严格的验证和隔离。（58字）"
published = "2001-01-09T05:00:00Z"
remediation = 'Recourse ManTrap 1.6 已停止维护，厂商 Recourse Technologies 未发布修复补丁。建议立即迁移至 GMER、RootkitRevealer 或 chkrootkit 等仍在维护的现代反Rootkit工具，并完整扫描系统；如暂时无法替换，应卸载 ManTrap 的 crash 和 fsdb 工具，通过 sysctl 配置 kernel.yama.ptrace_scope=2 限制进程访问 /dev/mem，并在内核启动参数中加入 "iomem=relaxed" 限制或挂载 /dev/mem 为只读，以阻止未授权读取原始磁盘设备。同时建议检查系统中是否存在未授权root访问，消除攻击面。'
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Recourse ManTrap 任意数据文件读取与篡改漏洞"
updated = "2026-06-16T21:53:15Z"

