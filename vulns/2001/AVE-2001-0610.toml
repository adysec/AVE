[basic]
description = "Subscribe-Me Lite 2.0 及更早版本存在管理访问控制缺陷，攻击者无需身份认证即可通过直接调用 subscribe.pl CGI 脚本并传入目标邮件列表地址，删除任意邮件列表用户。该漏洞影响使用 Subscribe-Me Lite 的网站邮件列表管理系统，攻击条件宽松仅需网络可达即可触发，可导致邮件列表被恶意清空或篡改，属于中等严重程度的完整性漏洞。"
published = "2001-02-12T05:00:00.000"
remediation = "立即将 CGI Script Center Subscribe Me Lite 升级至最新可用版本，或从服务器移除 subscribe.pl 等敏感 CGI 脚本；在 Web 服务器层面限制对 subscribe.pl 的访问，仅允许可信 IP 调用，并为其配置基本身份认证（Basic Auth）；若无法升级或移除，可在 Web 应用防火墙（WAF）中添加规则，拒绝所有未经认证的 POST/GET 请求访问 subscribe.pl 路径，同时监控并审计对该脚本的异常调用行为。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "CGI Script Center Subscribe Me LITE 管理访问漏洞"
updated = "2026-06-16T21:53:37.780"

