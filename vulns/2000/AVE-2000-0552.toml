[basic]
description = 'suidperl（又称 sperl）是 Perl 5.00503 中用于设置用户 ID 执行的辅助程序，其在调用 /bin/mail 发送错误报告时未正确过滤转义序列 "~!"，导致恶意用户可通过设置 "interactive" 环境变量并传入包含该转义序列的文件名触发 mail 的 shell 转义功能，从而以提升的权限执行任意命令。该漏洞允许本地攻击者在目标系统上获取 root 权限，完全控制受影响的系统。攻击者需要拥有本地访问权限，但无需额外认证即可利用，危害严重。'
published = "2000-10-20T04:00:00.000"
remediation = "立即移除 suidperl 的 setuid 权限位（chmod u-s /usr/bin/suidperl），或升级 Perl 至 5.6.0 及以上版本。Red Hat Linux 用户应安装 RHSA-2000-048 提供的更新包；Caldera OpenLinux 用户应安装 CSSA-2000-026 补丁。如无法升级，可删除 suidperl 的 setuid 位并改用普通 perl 替代，以消除本地提权风险。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Perl suidperl Mail Shell 转义本地权限提升漏洞"
updated = "2026-06-16T21:52:18.217"

