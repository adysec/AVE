[basic]
description = "Hubuum Rust 客户端库内置的 HTTP 客户端在处理重定向时存在凭据泄露风险。由于使用了 reqwest 默认的重定向策略，当重定向目标位于同一方案、主机和端口但超出配置的 BaseUrl 路径前缀时，客户端仍会携带敏感的 Authorization 认证头。攻击者可通过控制 3xx 重定向响应，诱导客户端将身份验证令牌发送至共享源下的非预期路径。该漏洞影响 0.6.1 版本之前的客户端库，攻击者需能够影响重定向响应，导致敏感凭据在同源不同路径间泄露。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Hubuum Rust 客户端库重定向路径遍历漏洞"
