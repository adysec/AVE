[basic]
description = "Linux 内核 ksmbd SMB 服务器组件在处理 IPC 消息时存在竞争条件漏洞。由于 req->handle 通过 ida_alloc 分配，来自 ksmbd_ipc_login_request 和 FSCTL_PIPE_TRANSCEIVE ioctl 的请求可能获得相同的 handle 值，导致消息类型混淆，攻击者可能利用此问题访问意外内存区域。此外，ksmbd 在检查 IPC 响应类型时缺少 continue 语句，无法正确跳过错误响应并继续检查下一个响应。该漏洞影响使用 ksmbd 的 Linux 系统，无需身份验证即可在网络可达条件下触发，CVSS v3.1 评分 8.1。成功利用可能导致内存越界读取，造成敏感信息泄露或系统崩溃。"
published = "2025-04-01T16:15:25Z"
remediation = "升级 Linux 内核至包含修复提交 e2ff19f0b7a3 的版本。Debian 12 用户应安装 Linux 6.1.133-1 或更高版本，Ubuntu 24.04 LTS 用户应升级至 Linux 6.8.0-84.84，Ubuntu 22.04 LTS HWE 用户应升级至 Linux 6.8.0-85.85~22.04.1，Ubuntu 24.10 用户应升级至 Linux 6.11.0-28.28。如无法立即升级内核，可通过 modprobe -r ksmbd 命令卸载 ksmbd 模块作为临时缓解措施，或通过内核启动参数禁用 ksmbd。建议通过系统包管理器（apt upgrade linux-image-*）自动安装安全更新并重启系统。"
score = 8.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux ksmbd 竞争条件类型混淆漏洞"
updated = "2026-06-17T08:44:40Z"

