[basic]
description = "PrestaShop 的 Responsive Mega Menu Pro 模块 1.0.32 及更早版本中，`modules/bamegamenu/ajax_phpcode.php` 文件存在代码注入漏洞。未经身份认证的远程攻击者可通过向该文件发送特制的 `code` 参数，直接注入并执行任意 PHP 代码，从而完全控制目标服务器。该漏洞影响 PrestaShop 1.5.5.0 至 1.7.2.5 版本，攻击无需用户交互，利用复杂度低，危害严重。"
published = "2018-03-28T02:29:00Z"
remediation = "从 PrestaShop Addons Marketplace 升级 Responsive Mega Menu (Horizontal+Vertical+Dropdown) Pro 模块至最新版本。如暂时无法升级，应立即删除 modules/bamegamenu/ajax_phpcode.php 文件或在整个 PrestaShop 站点的 php.ini 中禁用 exec()、passthru()、shell_exec()、system() 等危险 PHP 函数作为临时缓解，随后替换为其他安全菜单模块。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "PrestaShop Responsive Mega Menu Pro 模块远程代码执行漏洞"
updated = "2026-06-17T02:05:27Z"

