[info]
author = "ave"
description = "Google Chrome 在 17.0.963.83 版本前的 CSS 实现中存在使用后释放漏洞，源于对 CSS :first-letter 伪元素处理不当导致内存引用错误。远程攻击者可通过构造包含特制 :first-letter 伪元素的恶意网页，诱导用户访问触发使用后释放漏洞，导致浏览器崩溃拒绝服务，甚至可能实现任意代码执行。"
id = "POC-AVE-2011-0190"
name = "CVE-2011-3050 PoC"
severity = "medium"
tags = ["ave-2011-0190"]
vuln_id = [
    "CVE-2011-3050",
    "AVE-2011-0190",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/test.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
