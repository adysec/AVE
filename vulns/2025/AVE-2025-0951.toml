[basic]
description = "Linux内核中的fastrpc驱动程序存在越界写入漏洞。当处理非注册缓冲区时，fastrpc驱动会复制缓冲区并传递给远程子系统，但当前的页面大小计算实现未在计算中考虑偏移量。这可能导致传递不正确且超出边界的页面大小，进而引发内存越界写入问题。攻击者需具备本地访问权限并能触发fastrpc驱动的缓冲区复制操作，通过构造特制的输入数据可利用此漏洞导致内存损坏甚至远程代码执行。该漏洞影响使用fastrpc驱动的Linux内核版本，CVSS评分为7.8（高危），CWE编号为CWE-787（越界写入）。"
published = "2025-02-27T03:15:14.030"
remediation = "升级 Linux 内核至 6.14 或更高版本以修复 fastrpc 驱动的缓冲区页面大小计算缺陷。Debian 用户请将 linux 包升级至 bookworm 的 6.1.180-1 或 trixie 的 6.12.100-1；Ubuntu 用户请将 linux-image 包升级至 noble 的 6.8.0-64.67 或 oracular 的 6.11.0-26.26。22.04 LTS jammy 用户应关注后续安全更新或升级至 24.04 LTS。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 fastrpc 驱动缓冲区页面大小越界写入漏洞"
updated = "2026-07-30T06:21:14.637"

