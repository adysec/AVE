[basic]
description = "Quest NetVault Backup 的 NVBULibraryPort 组件在处理 JSON-RPC 消息时存在 SQL 注入漏洞。由于未对用户提供的字符串进行充分验证就将其用于构造 SQL 查询，未经身份认证的远程攻击者可利用该漏洞在受影响系统上以 NETWORK SERVICE 权限执行任意代码。尽管利用此漏洞需要身份认证，但现有认证机制可被绕过。该漏洞影响 NetVault Backup 14.0.0.19 及更早版本，CVSS 评分为 8.8，危害等级高。Quest 已在 14.0.2 版本中发布修复补丁。"
published = "2026-06-25T00:00:00Z"
remediation = '将 Quest NetVault Backup 升级至 14.0.2 或更高版本，该版本已在官方发布说明（NV-4863）中修复 NVBULibraryPort JSON-RPC SQL 注入漏洞。升级前务必备份数据库，并在 NetVault Server 的 \tmp 文件夹中保存最新 .dlv 格式许可证文件。如无法立即升级，建议通过防火墙或 IPS 限制 NVBULibraryPort 的远程访问，仅允许受信任的管理网络访问该端口。'
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "Quest NetVault Backup SQL注入漏洞"
updated = "2026-06-25T00:00:00Z"

