[basic]
description = "Windows NT 4.0 的 MTS 包管理注册表项默认权限设置不当，本地用户可通过修改注册表键值安装或篡改任意 Microsoft Transaction Server (MTS) 包，从而提升权限至系统级。攻击者需拥有本地登录权限，利用该漏洞可完全控制系统。Microsoft 尚未发布针对该旧版本系统的安全更新。"
published = "2001-02-16T05:00:00Z"
remediation = '安装 Microsoft Windows NT 4.0 Service Pack 6a 及后续安全更新，或通过 Windows Update 安装 2001 年 2 月安全更新补丁。如无法安装补丁，可限制对注册表项 HKLM\Software\Microsoft\TransactionServer 的写入权限，仅允许管理员组访问。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Windows NT 4.0 MTS包管理注册表权限提升漏洞"
updated = "2026-06-16T21:53:33Z"

