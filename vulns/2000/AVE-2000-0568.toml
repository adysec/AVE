[basic]
description = "Windows 2000 服务控制管理器（SCM）在创建命名管道时使用可预测的名称，本地攻击者通过控制台登录系统后，可利用此可预测性创建恶意命名管道，诱使 SCM 连接并模拟攻击者身份，从而获取管理员权限。该漏洞影响 Windows 2000 系统，攻击者需具备本地控制台访问权限，CVSS 评分 4.6，危害等级中危。Microsoft 已在 MS00-053 安全公告中发布补丁修复此漏洞。"
published = "2000-10-20T04:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-053 提供的补丁，下载地址为 https://www.microsoft.com/download/details.aspx?FamilyId=CF0D00F5-2552-4CA2-B2F4-615FBD7EB2FD。如无法打补丁，应限制非管理用户的交互式控制台登录权限，不在工作站和终端服务器上授予普通用户本地登录权限，并禁用不必要的系统服务（如 ClipBook）以降低被利用风险。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows 2000 服务控制管理器命名管道可预测性本地权限提升漏洞"
updated = "2026-06-16T21:52:22.670"

