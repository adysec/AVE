[basic]
description = "Google Chrome（Windows 版）DevTools 组件存在路径名限制不当漏洞（CWE-22，路径遍历）。攻击者可通过诱使用户安装恶意 Chrome 扩展程序，利用特制的扩展绕过 DevTools 的文件访问限制，实现越权读取和写入本地文件系统。该漏洞影响 Windows 平台 Google Chrome 134.0.6998.35 之前版本及 Microsoft Edge（基于 Chromium）134.0.3124.51 之前版本。攻击需要用户交互（安装恶意扩展），但无需额外权限，CVSS 评分 8.1，危害等级高。"
published = "2025-03-05T04:15:11Z"
remediation = "立即将 Google Chrome 升级至 134.0.6998.35 或更高版本（通过「设置 > 关于 Chrome > 自动检查更新」），Microsoft Edge 用户升级至 134.0.3124.51 或更高版本。临时缓解措施：在组策略中禁用未签名的第三方扩展安装（Chrome 策略 ExtensionInstallBlocklist / ForceInstall），并提醒用户不要安装来源不明的扩展程序。"
score = 8.1
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome DevTools 路径限制不当导致文件访问绕过漏洞"
updated = "2026-06-17T08:40:19Z"

