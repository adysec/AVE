[info]
author = "AVE"
description = "Microsoft Office EPSIMP32.FLT 在处理特制 EPS 文件时存在释放后使用漏洞，通过 kcufId/eps-CVE-2017-0261 提供的 PoC 进行验证"
id = "POC-AVE-2017-0106"
name = "CVE-2017-0261 Microsoft Office EPS UAF PoC"
severity = "high"
tags = [
    "cve-2017-0261",
    "office",
    "eps",
    "uaf",
]
vuln_id = [
    "CVE-2017-0261",
    "AVE-2017-0106",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/CVE-2017-0261.eps"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["%!PS-Adobe"]
