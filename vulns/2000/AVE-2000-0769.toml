[basic]
description = "Microsoft VM（Microsoft 虚拟机）组件在 Internet Explorer 4.x 及 5.x 版本中存在安全绕过漏洞。未经签名的 Java Applet 可创建并调用 ActiveX 控件（com.ms.activeX.ActiveXComponent），从而绕过 Internet Explorer 的安全策略限制。远程攻击者可通过构造恶意网页或发送包含恶意代码的电子邮件，诱使用户访问或打开，进而以当前用户权限在目标系统上执行任意命令。该漏洞影响 Windows 平台上的 Internet Explorer 4.x/5.x 及 Microsoft VM 2000/3100/3200/3300 系列版本，CVSS 评分 5.1，攻击复杂度较高但无需身份认证。"
published = "2000-12-11T05:00:00.000"
remediation = "安装 Microsoft 安全公告 MS00-075 提供的补丁，该补丁通过修改 Java 虚拟机（Microsoft VM）中 com.ms.activeX.ActiveXComponent 类的权限检查机制，阻止未签名的小程序创建和调用 ActiveX 控件。如无法立即打补丁，可在 Internet Explorer 安全设置中将「运行 ActiveX 控件和插件」设为禁用，或将受信站点区域的安全级别设为高。"
score = 5.1
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Internet Explorer Java虚拟机 ActiveXComponent 任意程序执行漏洞"
updated = "2026-06-16T21:53:04.500"

