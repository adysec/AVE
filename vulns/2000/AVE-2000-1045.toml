[basic]
description = 'Microsoft Exchange Server 5.5 在处理带有空白字符集（charset）参数的 MIME 邮件头时存在解析缺陷，远程攻击者无需身份认证即可向目标服务器发送特制的包含 charset="" 字段的邮件消息，触发服务器在处理畸形 MIME 头部时发生异常，导致 Exchange 服务进程崩溃或停止响应，造成拒绝服务。该漏洞仅影响 Exchange 5.5 版本，攻击复杂度低，但仅影响服务可用性，不影响机密性和完整性。'
published = "2000-12-11T05:00:00Z"
remediation = "Exchange Server 5.5 用户请安装 Service Pack 4 或 MS00-082 安全补丁；Exchange Server 5.0 用户请安装 KB834130 累积更新（同时修复 MS01-041 和 MS03-046）。安装后重启 Exchange 服务并清除队列中畸形邮件即可恢复正常运行。Exchange 2000 不受此漏洞影响，无需操作。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Exchange Server 5.5 MIME Header 拒绝服务漏洞"
updated = "2026-06-16T21:52:57Z"

