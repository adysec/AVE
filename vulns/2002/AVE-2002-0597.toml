[basic]
description = "L-Forum 是由 Leszek Krupinski 开发的基于 PHP 的论坛程序，2.4.0 及更早版本的 search.php 文件存在 SQL 注入漏洞。该文件在处理用户搜索请求时，未对 search 参数进行充分的输入验证与过滤，直接将用户输入拼入 SQL 查询语句，导致远程攻击者可通过构造包含恶意 SQL 代码的搜索参数，在数据库服务器上执行任意 SQL 语句。该漏洞影响所有运行受影响版本 L-Forum 的网站，攻击者无需身份认证即可远程利用，攻击条件为攻击者能够访问目标网站的 search.php 页面。利用方式为向 search.php 的 search 参数提交包含 SQL 注入 payload 的特制 URL，PostgreSQL 和 MySQL 数据库的利用语法略有不同。成功利用后攻击者可获取论坛数据库中的敏感信息，包括用户账号、密码哈希等，危害等级高。"
published = "2003-06-09T04:00:00Z"
remediation = "修改 search.php 中对 search 参数的数据库查询方式，使用参数化预处理语句替代字符串拼接，并对用户输入进行类型校验与特殊字符过滤；如无法即时修改代码，可临时在 Web 服务器前端对该参数进行 WAF 拦截或限制仅允许字母数字与空格，阻止单引号与分号等 SQL 关键字传入后端。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Leszek Krupinski L-Forum 2.4 search.php SQL注入漏洞"
updated = "2026-06-16T21:59:21Z"

