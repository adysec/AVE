[basic]
description = "HP-UX 10.20 系统的 FTP 守护进程（ftpd）存在格式化字符串漏洞，远程攻击者无需身份认证即可通过向 PASS 命令发送特制的格式化字符串触发该漏洞。该漏洞源于 ftpd 在处理用户输入时未正确过滤格式化字符串标记，导致攻击者可读取或写入任意内存地址。成功利用此漏洞可导致远程代码执行或拒绝服务，完全控制目标系统。CVSS 评分 10.0，危害等级严重。"
published = "2000-10-20T04:00:00Z"
remediation = "立即安装 HP 官方针对此漏洞发布的安全补丁（HP Security Bulletin 相关补丁包），将 HP-UX 系统升级至 11.00 及以上版本以彻底修复 ftpd 格式化字符串漏洞。如无法立即升级，可临时禁用 FTP 服务（inetd 中注释 ftp 行并重启 inetd），或通过防火墙限制对 TCP 21 端口的访问，仅允许可信 IP 连接，同时监控 FTP 日志中的异常 PASS 命令请求。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "HP HP-UX FTPD 格式化字符串远程代码执行漏洞"
updated = "2026-06-16T21:52:17Z"

