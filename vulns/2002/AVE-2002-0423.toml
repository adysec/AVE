[basic]
description = "Cyrus SASL 1.5.24 及 1.5.27 版本中的 LDAP 和 MySQL 认证补丁存在 SQL 注入漏洞。远程攻击者无需身份认证即可通过网络向目标系统发送特制的密码参数，触发 SQL 注入攻击，从而执行任意 SQL 命令并以任意 POP 邮件用户身份登录系统。该漏洞影响 Cyrus SASL 的 LDAP/MySQL 认证模块，CVSS 评分 7.5，危害等级高，可导致敏感信息泄露和权限绕过。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 Cyrus SASL 至 2.1.x 或更高版本（1.5.x 系列已停止维护），该漏洞在后续版本中已修复。如无法升级，移除第三方 LDAP/MySQL 认证补丁，改用 Cyrus SASL 内置的 sasldb 或 PAM 认证机制。若必须使用 LDAP/MySQL 认证，需对用户输入的密码参数进行严格的参数化查询和输入过滤，防止 SQL 注入。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Cyrus SASL LDAP和MySQL认证SQL注入漏洞"
updated = "2026-06-16T22:00:32Z"

