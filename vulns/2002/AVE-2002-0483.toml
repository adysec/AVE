[basic]
description = "Lumigent Log Explorer 3.02 之前版本中存在缓冲区溢出漏洞，具有数据库权限的攻击者可通过向扩展存储过程 xp_logattach_StartProf、xp_logattach_setport 或 xp_logattach 传递超长参数触发缓冲区溢出，从而在数据库服务器上以系统权限执行任意代码。该漏洞 CVSS 评分 7.5，危害等级高，攻击复杂度低且无需认证，远程即可利用，影响数据的机密性、完整性和可用性。Exploit-DB 上已有公开的利用代码。"
published = "2002-10-04T04:00:00.000"
remediation = "升级 Lumigent Log Explorer 至 3.02 或更高版本，该版本已修复 xp_logattach_StartProf、xp_logattach_setport 和 xp_logattach 三个扩展存储过程中的缓冲区溢出漏洞。如无法升级，应在 SQL Server 中撤销对数据库用户执行上述扩展存储过程的权限，并限制非授权数据库账户的登录访问。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Lumigent Log Explorer 扩展存储过程缓冲区溢出漏洞"
updated = "2026-06-16T21:58:25.880"

