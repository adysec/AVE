[basic]
description = "Microsoft Windows 2000 的 Indexing Services 中的 CiWebHitsFile 组件存在跨站脚本（XSS）漏洞。远程攻击者可通过向 IIS 服务器发送特制的 .htw 请求，在 CiRestriction 参数中注入恶意脚本代码，当其他用户访问受影响的索引页面时，该脚本将在用户浏览器中执行，导致敏感信息泄露或会话劫持。攻击无需身份认证，但需要用户交互。该漏洞影响 Windows 2000 上运行 IIS 4.0/5.0 的系统，CVSS 评分 5.1，危害等级中危。"
published = "2000-12-19T05:00:00.000"
remediation = "建议立即安装 Microsoft Security Bulletin MS00-098 对应补丁（Windows 2000 安全更新），或通过 Windows Update 安装历史更新。如无法打补丁，可在 IIS 管理器中移除 .htw 脚本映射（网站属性 → 主目录 → 配置 → 应用程序映射 → 删除 .htw 映射），或直接卸载 Indexing Service 组件（控制面板 → 添加/删除程序 → 添加/删除 Windows 组件 → 取消勾选 Indexing Service）。作为临时缓解措施，可在 URLScan 或 ISAPI 筛选器中拦截包含 .htw 的请求。"
score = 5.1
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows 2000 Indexing Service 跨站脚本攻击漏洞"
updated = "2026-06-16T21:52:49.197"

