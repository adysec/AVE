[basic]
description = "Google Chrome 浏览器 V8 JavaScript 引擎存在类型混淆漏洞。Turbofan JIT 编译器在编译全局属性存储代码时，若属性映射（property map）在编译后被原地修改，已优化的代码未能正确反优化（deoptimize），导致后续加载函数访问属性时发生类型混淆，进而触发堆内存越界写入。攻击者可通过构造恶意的 HTML 页面，诱使用户使用受影响版本的 Chrome 浏览器访问该页面，利用此漏洞造成堆损坏，最终实现远程代码执行。该漏洞影响 Google Chrome 93.0.4577.82 之前的所有版本，CVSS 评分为 8.8，危害等级为高危。Google 已于 2021 年 9 月发布安全更新修复此漏洞。"
published = "2021-10-08T21:15:07Z"
remediation = "立即将 Google Chrome 升级至 93.0.4577.82 或更高版本以修复 V8 引擎中的类型混淆漏洞。用户可通过 Chrome 菜单 → 帮助 → 关于 Google Chrome 自动下载安装更新。如无法立即升级，可临时启用 Chrome 的沙箱强化模式（chrome://flags/#safe-sandbox）或使用扩展程序限制 JavaScript 执行作为缓解措施，同时避免访问不受信任的网页。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome V8 堆内存越界写入漏洞"
updated = "2026-06-17T03:50:35Z"

