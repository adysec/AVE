[basic]
description = "Apache HTTP Server 的 mod_userdir 模块存在 CRLF 注入漏洞，攻击者可通过向使用该模块的站点发送特制请求，在 HTTP 响应头中注入换行符，从而实现 HTTP 响应拆分攻击。该漏洞允许攻击者利用响应拆分进行缓存投毒、跨站脚本攻击等进一步危害。攻击者需要诱导用户访问恶意构造的链接，影响版本为 Apache HTTP Server 2.4.1 至 2.4.23 以及 2.2.0 至 2.2.31。Apache 已在 2.4.25 和 2.2.32 版本中通过禁止在 Location 及其他响应头键值中注入 CR 或 LF 字符修复此漏洞。"
published = "2018-08-14T12:29:00Z"
remediation = '升级 Apache HTTP Server 至 2.4.25+（2.4.x 分支）或 2.2.32+（2.2.x 分支），禁止 Location 等响应头中出现 CR（\r）或 LF（\n）字符。如无法立即升级，可在反向代理或 WAF 层面对响应头进行 CRLF 过滤，拦截包含 %0d%0a 的请求参数。'
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Apache HTTP Server CRLF注入漏洞"
updated = "2026-06-17T00:48:32Z"

