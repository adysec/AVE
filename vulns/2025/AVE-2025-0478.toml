[basic]
description = "libxslt 的 exsltFuncResultComp() 函数在处理样式表解析中的 EXSLT &lt;func:result&gt; 元素时，由于类型处理不当，可能将 XML 文档节点误当作普通 XML 元素节点处理，导致类型混淆（CWE-843）。该漏洞影响 libxslt 1.1.44 之前版本，以及 Red Hat Enterprise Linux 7/8/9、Red Hat OpenShift Container Platform 4 等集成产品。攻击者需在网络可达的前提下诱使用户加载特制 XSLT 样式表才能触发，利用条件苛刻（高攻击复杂度、需用户交互），成功利用可导致应用程序不稳定或拒绝服务。该漏洞由 Google Big Sleep 报告给 Red Hat，目前尚无公开利用代码。"
published = "2025-10-14T06:15:34Z"
remediation = "升级 libxslt 至 1.1.44 或更高版本。openSUSE 用户可通过 zypper update libxslt 安装安全更新。如无法立即升级，可在解析不可信样式表时禁用 EXSLT 功能（--without-plugins 编译），或限制仅处理受信任的 XSLT 文件作为临时缓解措施。"
score = 3.1
severity = "LOW"
sources = ["msrc"]
title = "libxslt EXSLT 类型混淆拒绝服务漏洞"
updated = "2026-06-30T07:16:30Z"

