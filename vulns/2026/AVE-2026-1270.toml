[basic]
description = "Ghost 的 ActivityPub 客户端在 @tryghost/activitypub 包中存在跨站脚本（XSS）漏洞。当用户查看或共享来自恶意定制的 ActivityPub 服务器的帖子时，服务器可在帖子内容中注入未经净化的 JavaScript 代码，导致该代码在用户浏览器中执行。此漏洞影响 @tryghost/activitypub 3.1.0 之前的所有版本，攻击者无需预先认证即可通过构造恶意 ActivityPub 服务器向 Ghost 用户投递恶意脚本。攻击者可借此窃取用户会话 Cookie、篡改页面内容或进一步控制 Ghost 管理后台。Ghost 已在 @tryghost/activitypub v3.1.0 中修复此问题，建议用户尽快升级。"
published = "2026-06-24T19:17:12.713"
remediation = "建议将 @tryghost/activitypub 升级至 v3.1.0 或更高版本。Ghost 用户可直接更新 Ghost CMS 到最新版本，系统会自动拉取修复后的 activitypub 包。作为临时缓解措施，可在 Ghost 管理后台的 ActivityPub 设置中暂时关闭联邦功能，或限制仅与受信任的 ActivityPub 服务器进行内容同步，以防止恶意服务器注入的 JavaScript 代码在帖子中执行。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Ghost ActivityPub 客户端 跨站脚本漏洞"
updated = "2026-06-25T16:07:28.730"

