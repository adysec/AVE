[basic]
description = "tags.<value>苹果 iOS 5.1 以下版本及 iTunes 10.6 以下版本中使用的 WebKit 内核存在内存破坏漏洞。攻击者可通过诱导用户访问精心构造的恶意网站，远程触发该漏洞，实现任意代码执行或导致应用程序崩溃（拒绝服务）。该漏洞利用内存损坏作为攻击向量，无需身份认证即可被利用，CVSS 评分为 9.3（严重级），可完全破坏系统的机密性、完整性和可用性。"
published = "2012-03-08T22:55:02Z"
remediation = "建议立即升级 Apple iOS 设备至 5.1 版本（通过设置 → 通用 → 软件更新检查更新），并升级 iTunes 至 10.6 或更高版本（从 Apple 官网下载最新安装包）。如无法立即更新，可暂时关闭 Safari 中的 JavaScript 与 Java 功能（设置 → Safari），并尽量避免访问包含动态多媒体内容的不可信网站。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple iOS Safari WebKit 内存破坏漏洞"
updated = "2026-06-16T23:37:53Z"

