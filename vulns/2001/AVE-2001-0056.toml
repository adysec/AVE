[basic]
description = "Windows Media Player 7.0 中的 WMP ActiveX 控件存在 JavaScript URL 安全绕过漏洞。该漏洞源于控件未正确验证 Frame Domain 边界，远程攻击者可通过构造包含 javascript: 协议的恶意 URL，在 Internet Explorer 浏览器中执行任意命令。攻击者无需身份认证，仅需诱导用户访问包含恶意 ActiveX 控件的网页即可触发利用。成功利用后，攻击者可在用户浏览器上下文中执行任意脚本或命令，可能导致敏感信息泄露或浏览器会话劫持。该漏洞影响安装 Windows Media Player 7.0 的 Windows 系统，CVSS v2 评分 7.5，危害等级为高。"
published = "2001-06-02T04:00:00Z"
remediation = "安装 Microsoft 2001 年 3 月安全更新 MS01-015 中针对 Internet Explorer 5.5 SP1 的补丁（Q286045，后被 MS01-027 补丁 supersede），或将 IE 升级至 5.5 Service Pack 2。若无法立即打补丁，可在 IE 的「安全区域」设置中禁用未信任网站的 Active Scripting，并避免打开来源不明的 HTML 邮件作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Windows Media Player 7.0 ActiveX 远程代码执行漏洞"
updated = "2026-06-16T21:53:45Z"

