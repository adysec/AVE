[basic]
description = "Windows 2000 简体中文版输入法编辑器（IME）存在权限提升漏洞。由于 IME 未正确限制对系统特权功能的访问，本地用户可通过输入法界面调用本应受限的高权限操作，从而获取额外系统权限。攻击者需拥有本地登录权限，无需身份认证即可利用该漏洞实现权限提升，影响机密性、完整性和可用性。该漏洞影响 Windows 2000 简体中文版系统。"
published = "2000-12-19T05:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS00-069 提供的补丁，下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=6CD4A747-9DE4-4F2F-817F-92BB597B8F5B。该补丁已包含在 Windows 2000 Service Pack 2 中，建议升级至 SP2 或更高版本。如无法安装补丁，可在登录屏幕中禁用简体中文输入法编辑器（IME），或限制物理键盘和终端服务器会话的访问权限作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Windows 2000 简体中文版输入法编辑器权限提升漏洞"
updated = "2026-06-16T21:52:47Z"

