[basic]
description = "Computer Associates eTrust Intrusion Detection 1.4.1.13（原名 SessionWall-3）使用弱加密算法（XOR）将管理员密码存储在 Windows 注册表中，本地攻击者可通过读取注册表键值并直接对密文进行 XOR 解密还原出明文密码，从而获取系统管理权限。该漏洞攻击复杂度低，无需特殊权限即可利用，影响 eTrust Intrusion Detection 1.4.1.13 及更早版本。"
published = "2000-06-07T04:00:00Z"
remediation = '建议立即升级至 Computer Associates eTrust Intrusion Detection 1.4.1.13 之后的修复版本（建议升级至最新 Broadcom 官方支持版本）。如无法立即升级，请通过注册表编辑器修改 HKLM\SOFTWARE\ComputerAssociates\eTrust Intrusion Detection 相关键值权限，移除本地用户组的读取权限，仅保留 SYSTEM 和管理员组的完全控制权限，防止本地用户读取注册表中 XOR 加密的管理员密码。同时建议部署主机入侵防护系统（HIPS）监控注册表敏感键值访问，并强制执行强密码策略定期轮换管理员密码。'
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "Computer Associates eTrust Intrusion Detection 弱加密漏洞"
updated = "2026-06-16T21:51:59Z"

