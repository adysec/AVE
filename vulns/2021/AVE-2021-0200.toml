[basic]
description = 'Buffalo WSR-2533DHPL2 和 WSR-2533DHP3 路由器 Web 管理接口存在路径遍历漏洞，其固件版本在 1.02 及以下（WSR-2533DHPL2）和 1.24 及以下（WSR-2533DHP3）时受影响。未经身份认证的远程攻击者可通过在 HTTP 请求中构造包含目录遍历序列（如 "../../../"）的特制请求路径，绕过 Web 界面身份验证限制，进而访问敏感系统文件或执行任意操作，完全控制路由器。该漏洞利用门槛极低，无需身份凭据、无需用户交互，攻击者仅需通过网络向目标路由器发送构造好的请求即可利用。CISA 已将此漏洞列入已知被利用漏洞目录（KEV），表明已有实际在野利用案例。受影响设备为 Buffalo 旗下多款无线路由器产品，建议用户立即升级至最新固件版本并关闭不必要的 Web 远程管理功能以降低风险。'
published = "2021-04-29T15:15:10.630"
remediation = "立即将 Buffalo WSR-2533DHPL2 固件升级至 1.02 之后的安全版本，WSR-2533DHP3 升级至 1.24 之后的安全版本，可通过访问 Buffalo 日本官网支持页面下载对应型号的最新固件并刷写更新（详见 Buffalo 2021 年 4 月 27 日发布的安全公告 https://www.buffalo.jp/news/detail/20210727-01.html）。如暂无法完成固件升级，应在路由器管理界面中禁用 WAN 侧 Web 管理功能，禁止公网直接访问路由器的 HTTP/HTTPS 管理页面，仅允许来自内网 IP 段的访问请求，以阻止未授权远程攻击者利用路径遍历绕过认证。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Buffalo WSR-2533DHPL2 路由器固件路径遍历漏洞"
updated = "2026-06-17T03:33:15.487"

