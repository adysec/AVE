[basic]
description = "Microsoft Windows 95/98 操作系统在处理伪造的 ARP（地址解析协议）数据包时存在安全漏洞。远程攻击者无需身份认证即可通过网络向目标系统发送特制的伪造 ARP 响应包，从而覆盖目标系统 ARP 缓存表中的静态条目，导致网络通信流量被重定向至攻击者控制的设备，实现中间人攻击。该漏洞影响 Windows 95 和 Windows 98 系统，攻击者需与目标处于同一广播域内，利用难度较低。"
published = "2000-06-29T04:00:00Z"
remediation = "该漏洞影响已停止支持的 Windows 95/98/NT 4.0，微软不再提供安全更新。建议立即升级到 Windows 10/11 等受支持版本；在无法升级的隔离网络中，可通过 `arp -s` 命令为关键网关和服务器添加静态 ARP 表项，并在交换机上启用端口安全（Port Security）和动态 ARP 检测（DAI）功能，防止伪造 ARP 包篡改缓存表。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Windows 9x/NT 4.0 ARP欺骗漏洞"
updated = "2026-06-16T21:52:06Z"

