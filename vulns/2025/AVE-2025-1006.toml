[basic]
description = "Linux 内核 SMB 客户端在 receive_encrypted_standard() 函数中处理加密响应时，未对 cifs_buf_get() 和 cifs_small_buf_get() 的返回值进行空指针检查。未经身份认证的远程攻击者可通过向目标系统发送特制的 SMB 加密响应数据包，触发空指针解引用，导致系统崩溃或拒绝服务。该漏洞影响使用 CIFS/SMB 客户端挂载网络共享的 Linux 内核版本，攻击者无需权限或用户交互即可利用，危害等级为高。补丁通过在 receive_encrypted_standard() 中增加 next_buffer 的空值校验来修复该问题。"
published = "2025-03-12T10:15:16Z"
remediation = "立即升级 Linux 内核至已包含修复 commit 860ca5e50f73 的稳定版本：Debian 12 升级至 6.1.133-1 或更新版本，Debian 11 升级至 5.10.237-1 或更新版本，Ubuntu 22.04 LTS 升级至 5.15.0-1084.91 或更新版本，Ubuntu 24.04 LTS 升级至 6.8.0-78.78 或更新版本。可通过执行 apt update && apt upgrade 安装系统提供的最新内核安全更新，并重启系统使新内核生效。如短期内无法升级内核，可暂时禁用 SMB 客户端挂载功能（卸载 cifs-utils 包或在 /etc/modprobe.d/ 中配置 blacklist cifs），以消除远程攻击面，待内核更新完成后再恢复。同时建议启用内核地址随机化（KASLR）和内核页表隔离（KPTI）以增加利用难度。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 SMB 客户端空指针解引用漏洞"
updated = "2026-07-30T06:21:40Z"

