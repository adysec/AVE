[basic]
description = "Cisco IOS 和 IOS XE 软件的 SNMP（简单网络管理协议）子系统存在缓冲区溢出漏洞。该漏洞源于 SNMP 协议处理过程中对输入数据长度校验不足，当处理特制的 SNMP 数据包时触发栈缓冲区溢出。经过身份认证的远程攻击者可通过 IPv4 或 IPv6 向目标系统发送精心构造的 SNMP 报文来利用此漏洞。利用 SNMP v1/v2c 时攻击者需知道只读团体字符串（community string），利用 SNMP v3 时需拥有有效用户凭据。成功利用可导致远程代码执行，使攻击者完全控制受影响设备，或导致设备重载。该漏洞影响所有启用了 SNMP 且未排除受影响 MIB 或 OID 的 Cisco IOS 和 IOS XE 设备，CVSS 评分 8.8，危害等级高。"
published = "2017-07-17T21:29:00Z"
remediation = "升级到 Cisco 官方公告中对应版本的第一修复版本（使用 Cisco IOS Software Checker 查询具体版本号）。临时缓解措施：在设备上通过 snmp-server view 命令禁用受影响 MIB（ADSL-LINE-MIB、ALPS-MIB、CISCO-SLB-EXT-MIB 等 10 个 MIB），并限制 SNMP 只允许可信管理站访问。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS和IOS XE SNMP缓冲区溢出远程代码执行漏洞"
updated = "2026-06-17T01:22:53Z"

