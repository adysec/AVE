[basic]
description = "Microsoft Windows Media Player 7 的 OCX 控件存在资源未正确关闭导致的拒绝服务漏洞。攻击者可通过向支持 RTF 格式的电子邮件客户端发送嵌入了特制 OCX 控件的邮件，当用户打开邮件时触发该漏洞，导致目标系统上的媒体播放器或邮件客户端崩溃。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响运行 Windows Media Player 7 的系统。"
published = "2000-12-19T05:00:00.000"
remediation = '升级到 Windows Media Player 9 或更高版本，该漏洞已在后续版本中修复。临时缓解措施：在 Outlook/Outlook Express 中设置安全级别为「高」，禁止 ActiveX 控件自动运行；或在注册表 `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\ActiveX Compatibility` 下为 Media Player OCX 控件 CLSID 设置兼容性标志以禁用嵌入执行。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows Media Player 7 OCX 控件拒绝服务漏洞"
updated = "2026-06-16T21:52:47.363"

