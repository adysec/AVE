[basic]
description = "hanterm-xf 终端模拟器 2.0.5 及更早版本存在转义序列注入漏洞。攻击者可通过构造包含特殊转义序列的恶意文件，当用户使用 hanterm-xf 查看该文件时，终端窗口标题会被修改并回注入命令行，从而在用户终端中执行任意命令。该漏洞利用方式简单，攻击者无需身份认证即可远程触发，CVSS 评分 7.5，危害等级高，影响范围包括所有使用受影响版本 hanterm-xf 的 Linux/Unix 系统。"
published = "2003-03-18T05:00:00Z"
remediation = "升级 hanterm-xf 至修复版本（Red Hat 已通过 RHSA-2003-070 和 RHSA-2003-071 发布补丁，对应更新后的 hanterm-xf 软件包已修复转义序列注入问题）。如无法升级，建议避免在 hanterm-xf 中查看或打开来自不可信来源的文本文件，或改用 xterm、GNOME Terminal 等持续维护的终端模拟器作为替代。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Hanterm hanterm-xf 终端模拟器命令执行漏洞"
updated = "2026-06-16T22:01:28Z"

