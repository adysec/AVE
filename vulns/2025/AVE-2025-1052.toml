[basic]
description = "Linux 内核 RapidIO 驱动程序中存在释放后使用漏洞。rio_add_net() 函数在调用 device_register() 失败时，错误处理路径错误地使用 kfree() 而非 put_device() 释放设备对象，同时未将 mport->net 指针置为 NULL，造成释放后使用。具有本地低权限的攻击者可通过构造特定条件触发该错误路径，进而实现权限提升或导致系统拒绝服务。该漏洞影响配置了 RapidIO 支持的主流 Linux 内核版本，CVSS 评分 7.8，危害等级为高。"
published = "2025-04-01T16:15:24Z"
remediation = "升级 Linux kernel 至包含补丁 commit 22e4977141dfc6d109bf29b495bf2187b4250990 的修复版本：Ubuntu 20.04 LTS 升级至 5.4.0-216.236 或更高、Ubuntu 22.04 LTS 升级至 5.15.0-140.150 或更高、Ubuntu 24.04 LTS 升级至 6.8.0-84.84 或更高；其他发行版升级至内核 5.4.291、5.10.235、5.15.179、6.1.131、6.6.83、6.12.19、6.13.7 及后续版本。如无法立即升级，临时执行 chmod 600 /dev/rio-mport* 限制 RapidIO mport 字符设备仅 root 可访问，降低本地攻击者利用风险。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux kernel RapidIO 驱动 use-after-free 漏洞"
updated = "2026-06-17T08:44:39Z"

