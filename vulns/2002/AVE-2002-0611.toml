[basic]
description = "Lycos HTMLGear guestbook 留言簿组件存在跨站脚本（XSS）注入漏洞。攻击者可在提交的留言内容中，通过 IMG 标签的 SRC 属性或 STYLE 样式属性注入恶意脚本代码，当其他用户访问包含恶意内容的留言页面时，脚本将在受害者浏览器中执行，从而窃取 Cookie、会话令牌或重定向用户至恶意站点。该漏洞影响所有部署了 Lycos HTMLGear guestbook 功能的网站及其访问用户，攻击者无需身份认证即可提交恶意留言触发漏洞利用。"
published = "2003-04-02T05:00:00.000"
remediation = "Lycos HTMLGear guestGear 组件已停止维护多年，无法通过升级修复此漏洞。建议立即从服务中移除 guestGear 聊天簿组件并替换为受支持的现代替代方案；若短期内无法下线，应在 Web 服务器前端部署 WAF 规则，严格过滤输入中的 STYLE 属性及 IMG SRC 字段，阻断类似 javascript: 和 expression() 等脚本注入载荷，以降低跨站脚本攻击风险。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Lycos HTMLGear 跨站脚本攻击漏洞"
updated = "2026-06-16T21:59:25.883"

