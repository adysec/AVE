[basic]
description = "Trend Micro Threat Discovery Appliance 2.6.1062r1 版本存在目录遍历漏洞，远程未认证攻击者可通过向目标系统发送特制的包含目录遍历序列的 session_id Cookie 触发该漏洞，以 root 权限删除任意文件，进而绕过身份认证或导致拒绝服务。该漏洞影响 Trend Micro Threat Discovery Appliance 2.6.1062r1 版本，CVSS 评分 9.8，危害等级严重。目前官方已发布安全更新修复此漏洞。"
published = "2017-04-12T10:59:00Z"
remediation = "立即升级 Trend Micro Threat Discovery Appliance 至厂商提供的最新固件版本。如已停止支持，应尽快迁移至 Trend Micro 当前在售的威胁检测产品（如 Trend Micro Deep Security 或 Vision One）。在无法升级或迁移前，在防火墙上严格限制对该设备管理端口的访问（仅允许可信管理 IP），并部署 WAF 规则过滤包含目录遍历特征（如 ../）的 session_id Cookie 请求作为临时缓解。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Trend Micro Threat Discovery Appliance 目录遍历漏洞"
updated = "2026-06-17T00:53:14Z"

