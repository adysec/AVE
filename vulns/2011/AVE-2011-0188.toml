[basic]
description = "libpng 库的 png_inflate() 函数在处理 PNG 文件时存在整数符号错误，导致堆缓冲区溢出。该漏洞影响 libpng 1.4.10beta01 之前版本，Google Chrome 17.0.963.83 之前版本及其他使用受影响 libpng 的产品。远程攻击者可诱导用户打开精心构造的恶意 PNG 文件，触发整数溢出导致堆缓冲区溢出，进而造成应用程序崩溃（拒绝服务）或在用户上下文中执行任意代码。攻击需要用户交互（打开恶意文件），CVSS 3.1 评分 8.8（高危），属于整数溢出与符号转换错误类漏洞（CWE-190, CWE-195）。"
published = "2012-03-22T16:55:01Z"
remediation = "建议立即升级 libpng 库至 1.4.10 及以上版本，或更新到支持该版本的软件（如 Google Chrome 17.0.963.83），如无法立即打补丁，请在系统级启用地址解析完整性检查以增强抵御能力"
score = 8.8
severity = "HIGH"
sources = ["tenable"]
title = "libpng 堆缓冲区溢出漏洞"
updated = "2026-06-16T23:32:30Z"

