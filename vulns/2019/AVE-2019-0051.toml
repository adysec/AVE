[basic]
description = "Zyxel ZyWall、USG 及 UAG 系列设备中的 free_time_failed.cgi CGI 程序存在反射型跨站脚本（XSS）漏洞，远程攻击者无需身份认证即可通过向 err_msg 参数注入恶意 HTML 或 JavaScript 代码触发该漏洞，导致受害者在浏览器中执行任意脚本，进而可能窃取会话凭证或发起钓鱼攻击。该漏洞影响 Zyxel 多款安全网关设备，CVSS 评分 6.1，危害等级中危。用户应升级至厂商发布的最新固件版本以修复此漏洞。"
published = "2019-06-27T15:15:09.170"
remediation = '建议立即将 Zyxel USG 系列固件升级至 4.32 及以上版本，UAG 系列固件升级至 4.20 及以上版本。登录设备管理后台，在"系统设置→固件升级"中上传官方固件包进行更新。如无法立即升级，可在"Free Time"功能页面禁用该功能，或在 Web 管理界面配置 WAF/IPS 规则对 err_msg 参数进行过滤，阻止跨站脚本攻击。具体固件下载请访问 Zyxel 官方支持门户（support.zyxel.com）。'
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Zyxel ZyWall、USG及UAG设备跨站脚本漏洞"
updated = "2026-06-17T02:14:54.480"

