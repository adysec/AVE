[basic]
description = "WebKit 渲染引擎存在内存破坏漏洞，该漏洞影响 Apple Safari 6.0 之前版本以及使用 WebKit 的应用程序（如 iTunes）。远程攻击者可通过构造恶意网页，利用 WebKit 解析网页内容时的内存损坏缺陷，无需身份认证即可在目标系统上执行任意代码或导致应用程序崩溃拒绝服务。攻击者通常需要诱导用户使用 Safari 浏览器访问包含恶意代码的网页，一旦用户打开该网页即可触发漏洞，CVSS 评分高达 9.3。攻击条件要求目标系统运行受影响版本的 Safari 或 WebKit，攻击复杂度中等，攻击向量为网络远程。Apple 已在后续版本中修复该漏洞，建议用户升级至 Safari 6.0 或更高版本。"
published = "2012-07-25T20:55:03.633"
remediation = "标签之间。<value>建议立即升级 Safari 至 6.0 或更高版本（OS X Lion 用户请安装 Safari 6），iOS 用户升级至 iOS 6 或更高版本，iTunes 用户升级至 10.7 或更高版本。如无法立即升级，应避免点击来源不明的链接或访问不可信网站，以降低远程攻击者利用该 WebKit 内存破坏漏洞执行任意代码的风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:38.190"

