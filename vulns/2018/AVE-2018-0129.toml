[basic]
description = "Comodo UTM Firewall 2.7.0 之前版本的 Web 控制台存在身份验证绕过漏洞（CWE-287）。远程攻击者无需任何认证，通过向目标系统发送特制的 HTTP 请求即可绕过登录验证，直接以管理员权限执行任意代码。该漏洞影响 Comodo UTM Firewall 全系列 2.7.0 之前版本，CVSS 评分 9.8，危害等级严重。攻击者只需知道目标 Web 控制台地址即可发起攻击，利用门槛极低。厂商建议用户升级至 2.7.0 或更高版本以修复此漏洞。"
published = "2019-01-30T15:29:04Z"
remediation = "升级 Comodo UTM Firewall 至 2.7.0 或更高版本，该版本修复了 Web Console 无需认证即可执行任意代码的问题。如无法立即升级，可在防火墙上限制对 Web Console 管理端口（默认 80/443）的访问来源 IP，仅允许受信任的管理员 IP 连接，并禁用公网暴露。同时建议修改默认管理员口令并启用双因素认证。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Comodo UTM Firewall Web Console 远程代码执行漏洞"
updated = "2026-06-17T01:45:49Z"

