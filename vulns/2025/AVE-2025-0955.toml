[basic]
description = "Linux 内核 SCSI UFS 驱动核心模块存在释放后使用（CWE-416）漏洞。在驱动初始化错误处理或移除过程中，`ufshcd_dealloc_host()` 会先释放包含 `struct ufs_hba::crypto_profile` 的 SCSI 主机结构，随后关联的平台设备才被释放，导致加密清理回调函数访问已释放的内存，引发使用后释放问题。该漏洞影响 RHEL 9、SUSE SLES15/SLED15、openSUSE 15 等多个 Linux 发行版的内核版本。攻击者需具备本地访问权限，通过触发驱动加载或卸载流程中的错误路径，可导致内核崩溃或潜在权限提升。Linux 内核社区已通过重新设计资源释放顺序修复此问题。CVSS 评分为 7.8，危害等级为高危。"
published = "2025-02-27T03:15:14.530"
remediation = "建议立即更新 Linux 内核至最新稳定版本。RHEL 9 用户请安装 RHSA-2025:20518 安全更新；SLES 15 用户请安装 SUSE-SU-2025:01951-1 或 SUSE-SU-2025:01967-1 补丁。可通过执行 `dnf update kernel` 或 `zypper update` 完成升级并重启系统。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 SCSI UFS 核心驱动 释放后使用漏洞"
updated = "2026-06-17T08:44:09.783"

