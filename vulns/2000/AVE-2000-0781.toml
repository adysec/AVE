[basic]
description = "WebActive HTTP Server 1.00 存在缓冲区溢出漏洞，远程攻击者可通过向服务器发送超长 URL 请求触发缓冲区溢出，导致服务进程崩溃，造成拒绝服务。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响 WebActive HTTP Server 1.00 版本。由于缺乏对输入长度的有效校验，攻击者构造的恶意 URL 可覆盖堆栈内存，使服务异常终止。"
published = "2000-07-12T04:00:00.000"
remediation = "WebActive HTTP Server 1.00 已停止维护且无官方补丁，建议立即停止使用该产品，迁移至受支持的 Web 服务器（如 Apache HTTP Server、Nginx 等）。如无法立即替换，可在网络边界防火墙或 WAF 上配置规则，拦截包含超长 URL 路径的请求（如限制 URI 长度不超过 1024 字节），以缓解缓冲区溢出导致的拒绝服务风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "WebActive HTTP Server 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:10.477"

