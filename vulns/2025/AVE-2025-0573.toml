[basic]
description = "MariaDB 的 mariadb-dump 实用程序在处理视图名称时存在目录遍历漏洞。该漏洞源于程序在将用户提供的路径用于文件操作前未进行严格的合法性验证，导致攻击者可通过构造特制的路径跳出预设目录。在能够与 mariadb-dump 实用程序交互的条件下，远程攻击者可利用此缺陷在目标系统上以当前运行用户的权限执行任意代码。该漏洞影响多个 MariaDB 版本，CVSS 评分为 7.0（高危），建议用户及时升级至 10.5.29 或更高版本以修复此问题。"
published = "2025-12-23T22:15:44Z"
remediation = "建议立即将 MariaDB 升级至 10.5.29 或更高版本，以修复 mariadb-dump 实用程序在处理视图名称时缺乏路径校验导致的目录遍历及远程代码执行漏洞。"
score = 7
severity = "HIGH"
sources = ["msrc"]
title = "MariaDB mariadb-dump 目录遍历远程代码执行漏洞"
updated = "2026-06-17T08:34:36Z"

