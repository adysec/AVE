[basic]
description = "Windows Server 2000的Service Control Manager (SCM)服务在创建命名管道时使用可预测的名称，使得本地用户能够通过控制台访问时跟踪并识别这些管道。通过模仿合法管道的身份验证过程，攻击者可以建立管道连接并欺骗系统授权执行管理员级别的操作。这使得攻击者能够从普通用户权限提升到系统管理员权限，从而获得对整个系统的完全控制权。攻击条件要求攻击者首先获得目标系统的本地访问权限（如控制台访问）并了解管道的命名模式。利用方式通常涉及调用CreateNamedPipe函数时提供的可预测名称，随后通过呼叫特定Win32 API实现管道劫持。微软在2000年10月的安全更新中修复了这一漏洞。"
published = "2000-10-20T04:00:00Z"
remediation = "升级到 Windows Server 2000 SP2或更高版本（如SP3/SP4），并应用相关安全更新包；禁用或重新配置可疑的命名前置服务；使用网络安全策略限制本地用户Console权限；若无法立即升级，可在防火墙中阻止对特定服务控制管理器命名管道的访问，并使用严格的访问控制列表限制本地用户权限"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "微软 Windows Server 2000 命名管道可预测性漏洞"
updated = "2026-06-16T21:52:22Z"

