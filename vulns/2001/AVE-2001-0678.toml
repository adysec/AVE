[basic]
description = "Internet Explorer 5.5 及更早版本存在帧域验证漏洞，浏览器未正确验证同一窗口中不同框架（frame）的域信息，导致跨域安全策略（同源策略）被绕过。远程攻击者可通过构造恶意网页，将本地文件或跨域框架中的数据信息发送到不同域的框架中，从而读取客户端系统中的敏感文件。该漏洞影响运行 IE 5.5 及更早版本的 Windows 系统，攻击者只需诱导用户访问恶意网页即可触发，无需身份认证，攻击条件简单。微软已在后续安全更新中修复此漏洞，建议用户升级至更高版本的 Internet Explorer。"
published = "2001-06-27T04:00:00.000"
remediation = '安装 Microsoft 2001 年 5 月安全更新 MS01-027（IE 5.01 对应 KB295106，IE 5.5 对应 KB299618），或将浏览器升级至 Internet Explorer 6 及以上版本。验证补丁安装时，打开 IE 选择"帮助"→"关于 Internet Explorer"，确认 Update Versions 字段中列出 Q295106（IE 5.01）或 Q299618（IE 5.5）。升级至 IE 6 时，在 Windows 95/98/98SE/ME 系统上必须选择 Typical Install 或 Full Install，否则漏洞文件可能未更新。如无法立即打补丁，可暂时使用其他浏览器替代 IE 5.01/5.5 作为缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Internet Explorer 跨域帧信息泄露漏洞"
updated = "2026-06-16T21:53:57.373"

