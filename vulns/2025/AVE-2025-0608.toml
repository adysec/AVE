[basic]
description = "Perl Crypt::Sodium::XS 模块 0.000042 之前版本捆绑了存在 CVE-2025-69277 漏洞的 libsodium 库（≤1.0.20 或 2025-12-30 前发布版本）。该漏洞位于 crypto_core_ed25519_is_valid_point 函数，在非典型用例中对椭圆曲线点验证逻辑缺陷，错误允许不在主加密群组内的点通过校验，导致加密绕过。攻击者可利用此缺陷构造恶意椭圆曲线点，绕过 Ed25519 签名验证或密钥交换检查，影响所有使用受影响模块版本的 Perl 应用。CVSS 9.8（CRITICAL），攻击向量为网络、低复杂度、无需权限和用户交互。升级至 0.000042 版本（含 libsodium 1.0.20-stable，2026-01-03 发布）可修复。"
published = "2026-01-06T01:16:01Z"
remediation = "tags as requested.<value>建议立即升级 Crypt::Sodium::XS 模块到 0.000042 或更高版本，该版本包含修复的 libsodium 1.0.20-stable，可防止椭圆曲线点验证漏洞影响。"
score = 9.8
severity = "CRITICAL"
sources = ["msrc"]
title = "CPAN Crypt::Sodium::XS 椭圆曲线点验证不当导致加密绕过漏洞"
updated = "2026-06-17T08:37:47Z"

