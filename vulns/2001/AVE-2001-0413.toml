[basic]
description = "SuSE Linux 6.4/7.0/7.1/7.2 中的 Berkeley Parallel Make (pmake) 2.1.33 及更早版本存在栈缓冲区溢出漏洞。本地攻击者可通过构造超长的 shell 定义 check 参数触发缓冲区溢出，覆盖返回地址并执行任意代码，从而将权限提升至 root。该漏洞 CVSS 评分 7.2（本地/低复杂度/无需认证/完全影响 CIA），影响 SuSE Linux 多个版本，攻击者需具备本地账户权限，通过构造恶意参数触发栈溢出实现本地提权。"
published = "2001-11-21T05:00:00Z"
remediation = "立即升级 pmake 至 2.1.33 以上版本（如适用）。若供应商已不再提供更新，作为临时缓解措施，执行 `chmod u-s /usr/bin/pmake` 移除 pmake 二进制文件的 suid root 权限位，以阻止本地用户通过格式串漏洞提升至 root 权限。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "SuSE Linux Berkeley Parallel Make 缓冲区溢出漏洞"
updated = "2026-06-16T21:55:13Z"

