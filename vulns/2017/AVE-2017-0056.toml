[basic]
description = "Laravel 框架 5.5.21 及之前版本中存在信息泄露漏洞，源于 `src/Illuminate/Foundation/Console/KeyGenerateCommand.php` 中的 `writeNewEnvironmentFileWith` 函数使用 `file_put_contents` 写入 `.env` 文件时未限制文件访问权限，导致该配置文件可被直接通过 Web 访问。远程未经身份认证的攻击者可通过直接请求目标站点 `/.env` URI 获取数据库密码、应用密钥等敏感信息，CVSS 评分 7.5，危害等级高。建议升级至 Laravel 5.5.22 或更高版本，或配置 Web 服务器禁止访问 `.env` 文件。"
published = "2017-11-20T01:29:00Z"
remediation = '升级 Laravel 至 5.5.22 或更高版本，该版本修复了 writeNewEnvironmentFileWith 函数中 .env 文件权限未限制的问题。如无法升级，在 Web 服务器（Nginx/Apache）配置中增加规则禁止直接访问 .env 文件：Nginx 添加 `location ~ /\.env { deny all; }`，Apache 添加 `<FilesMatch "^\.env"> Require all denied </FilesMatch>`。同时确保 .env 文件权限设为 600 或 640，仅允许所属用户读取。'
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Laravel Laravel框架 环境配置文件信息泄露漏洞"
updated = "2026-06-17T01:10:06Z"

