[basic]
description = "Microsoft Outlook 及 Outlook Express 存在拒绝服务漏洞，远程攻击者可通过向目标用户发送包含空白字段（如 BCC、Reply-To、Return-Path 或 From）的特制电子邮件，导致邮件客户端在处理畸形邮件时崩溃或无法响应，造成拒绝服务。该漏洞影响 Microsoft Outlook 和 Outlook Express 多个版本，攻击者无需身份认证即可远程触发，CVSS 评分 5.0，危害等级中危。"
published = "2000-06-05T04:00:00Z"
remediation = "建议升级 Microsoft Exchange Server 至 2000 SP3 或更高版本，Outlook 升级至 2000 或更高版本，Outlook Express 升级至 6.0 或更高版本。如无法升级，可在邮件服务器或客户端配置邮件内容过滤规则，拦截包含空白 BCC/Reply-To/Return-Path/From 字段的邮件作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Outlook 和 Outlook Express 空白邮件字段拒绝服务漏洞"
updated = "2026-06-16T21:51:55Z"

