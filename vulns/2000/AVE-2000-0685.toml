[basic]
description = "Samba 2.0.7 中的 Web 管理工具 SWAT（Samba Web Administration Tool）存在安全日志记录缺陷，当远程攻击者使用正确的用户名但错误的密码进行登录尝试时，SWAT 不会记录此类失败登录事件。这导致攻击者可以在不被系统管理员察觉的情况下，对 Samba 服务实施暴力密码猜解攻击，从而可能获取系统访问权限。该漏洞影响 Samba 2.0.7 版本，攻击者只需通过网络访问 SWAT 管理界面即可利用，无需任何身份认证。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 Samba 至 2.2.0 或更高版本，该版本改进了认证日志机制。如无法升级，在 SWAT 配置文件（通常位于 /etc/xinetd.d/swat 或 /etc/inetd.conf）中将 SWAT 服务绑定至本地回环地址（127.0.0.1），并通过 iptables 限制对 TCP 901 端口的访问来源 IP，同时在 smb.conf 中启用 valid users 限制 SWAT 管理界面仅允许特定用户访问。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Samba SWAT 登录失败日志缺失导致暴力密码猜测漏洞"
updated = "2026-06-16T21:52:48.497"

