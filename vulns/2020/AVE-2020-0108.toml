[basic]
description = "Microsoft Windows 的 Adobe Type Manager 库在处理特制的多主字体（Adobe Type 1 PostScript 格式）时存在内存越界写入漏洞。攻击者可诱使用户打开特制字体文件或预览包含恶意字体的文档，在除 Windows 10 之外的所有系统上实现远程代码执行。该漏洞影响 Windows 7/8/8.1/Server 2008/2012/2016/2019 等多个版本，CVSS 评分 8.8，危害等级高。Microsoft 已在 2020 年 4 月安全更新中修复此漏洞。"
published = "2020-04-15T15:15:20Z"
remediation = '立即安装 Microsoft 2020 年 4 月安全更新（对应 KB4549951/ KB4550944/ KB4550922 等，视系统版本而定），或通过 Windows Update 自动获取更新。对于无法立即打补丁的 Windows 7/Server 2008 系统，可通过注册表禁用 ATMFD.DLL：将 `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Session Manager\KnownDLLs` 下新增 `ATMFD` 项值为 `0`，或重命名 `%windir%\system32\atmfvd.dll` 为 `atmfvd.dll.old` 以阻止加载，注意此操作可能影响 Adobe Type 1 字体渲染功能。'
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Adobe Font Manager 库远程代码执行漏洞"
updated = "2026-06-17T03:00:14Z"

