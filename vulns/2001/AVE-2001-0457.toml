[basic]
description = "Digital UNIX 4.0G 及更早版本中的 msgchk 工具存在缓冲区溢出漏洞。msgchk 在处理超长命令行参数时未正确检查缓冲区边界，导致栈溢出。本地攻击者可通过向 msgchk 程序传递特制的超长命令行参数触发该漏洞，覆盖返回地址，从而以目标进程权限执行任意代码。该漏洞影响 Digital UNIX 4.0G 及之前版本，CVSS 评分 7.2，危害等级高。目前已存在公开的利用代码，攻击者无需身份认证即可在本地利用此漏洞完全控制系统。"
published = "2001-09-10T04:00:00Z"
remediation = "该漏洞影响已停止维护的 Digital UNIX（Tru64 UNIX）4.0G 及更早版本，厂商 Compaq/HP 已停止对该产品的安全支持，不再提供官方补丁。建议立即将系统迁移至受支持的操作系统平台（如 HP-UX 或 Linux）；若无法迁移，应限制本地用户对 msgchk 二进制文件的访问权限（如 chmod 750 /usr/bin/msgchk），并移除 msgchk 的 setuid 位以降低提权风险。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Digital UNIX msgchk 缓冲区溢出漏洞"
updated = "2026-06-16T21:55:34Z"

