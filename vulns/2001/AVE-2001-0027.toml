[basic]
description = "OpenBSD 的 ftpd（FTP 守护进程）2.6 及 2.7 版本中，replydirname 函数存在单字节缓冲区溢出漏洞。远程攻击者无需身份认证即可向目标 FTP 服务发送特制的请求，利用该溢出覆盖返回地址，从而以 root 权限在目标系统上执行任意代码。该漏洞影响运行 OpenBSD 并启用 ftpd 的服务器系统，CVSS 评分为 10，危害等级极高。攻击条件仅为可访问目标 FTP 服务的网络路径，利用方式是通过发送精心构造的 FTP 请求触发缓冲区溢出，最终获取 root 级别的系统控制权。"
published = "2001-02-12T05:00:00.000"
remediation = "建议立即升级 OpenBSD 至 2.8 或更高版本（该版本已修复 ftpd replydirname 单字节缓冲区溢出），或应用 OpenBSD 官方发布的 2.6/2.7 补丁（ftp://ftp.openbsd.org/pub/OpenBSD/patches/2.6/common/017_ftpd.patch / 2.7 对应补丁）。若暂时无法升级，请在防火墙层面封禁 21 端口外部访问，或在 /etc/inetd.conf 中注释掉 ftpd 行并重启 inetd 禁用 FTP 服务作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "OpenBSD ftpd 2.6 / 2.7 - Remote Exploit漏洞 漏洞"
updated = "2026-06-16T21:53:34.030"

