[basic]
description = "AMD SEV-SNP 的 RMP（反向映射表）初始化过程中存在不当访问控制漏洞（CWE-284）。拥有管理员权限的本地攻击者可在 SNP 初始化期间向 RMP 写入数据，破坏 SEV-SNP 安全加密虚拟化机制的内存完整性保护，导致虚拟机客户内存的机密性丧失。该漏洞需攻击者具备本地管理员权限，攻击复杂度低，影响 AMD EPYC 处理器等支持 SEV-SNP 的平台。AMD 已发布固件更新修复此漏洞。"
published = "2025-10-14T15:16:00Z"
remediation = "建议立即更新 AMD EPYC 7003 系列（Milan）处理器固件至 MilanPI 1.0.0.H 及以上版本，EPYC 9005 系列（Turin）处理器固件至 TurinPI 1.0.0.6 及以上版本。请从 AMD 官网或服务器 OEM 厂商获取对应 BIOS/固件更新包，按照平台文档完成固件升级并重启系统。如无法立即更新，可在 SNP 初始化期间限制管理员对主机的物理或带外管理访问权限，并监控 RMP 相关日志异常作为临时缓解措施。"
score = 6
severity = "MEDIUM"
sources = ["msrc"]
title = "AMD SEV-SNP 初始化期间 RMP 访问控制不当漏洞"
updated = "2026-06-17T08:25:41Z"

