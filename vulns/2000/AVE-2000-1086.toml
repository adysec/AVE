[basic]
description = 'tags.<value>PTlink IRCD 3.5.3 及 PTlink Services 1.8.1 存在命令处理缺陷，未经身份认证的远程攻击者可通过发送特制的 "mode +owgscfxeb" 或 "oper" 命令触发服务器崩溃，导致拒绝服务。该漏洞影响运行上述版本的 IRC 服务器软件，攻击者无需认证即可远程利用，危害等级中等。'
published = "2001-01-09T05:00:00.000"
remediation = "立即升级至 PTlink IRCD 6.19.4 或更高版本，该版本修复了命令解析漏洞。如无法立即升级，可在 IRC 服务器前端部署防火墙规则，限制外部对 +owgscfxeb 模式及 oper 命令的访问，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "PTlink IRCD 拒绝服务漏洞"
