[basic]
description = "标签之间。<value>PostgreSQL 7.2.x 版本及 7.3.x 早于 7.3.4 的版本中 to_ascii 函数存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标数据库发送特制请求触发溢出，进而执行任意系统命令，可能导致敏感数据泄露、服务中断或服务器被完全控制。该漏洞影响所有运行受影响版本且启用相关函数的 PostgreSQL 实例，CVSS 评分 7.5，攻击复杂度低，危害等级高。"
published = "2003-11-03T05:00:00Z"
remediation = "升级 PostgreSQL 到 7.3.4 或更高版本以修复缓冲区溢出漏洞。对于仍运行 7.2.x 的系统，建议升级到 7.3.4 或更新的受支持版本。如暂时无法升级，应在防火墙层面限制 5432 端口的访问，仅允许可信 IP 连接，并检查 pg_hba.conf 配置以拒绝未授权访问。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "PostgreSQL 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T22:03:09Z"

