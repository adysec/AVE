[basic]
description = "Tenda AC11 路由器固件中的 /goform/setmac 接口存在栈缓冲区溢出漏洞。攻击者可通过向该接口发送特制的 HTTP POST 请求，利用溢出漏洞在设备上执行任意代码，进而完全控制路由器。该漏洞影响运行 02.03.01.104_CN 及之前版本固件的 Tenda AC11 设备，攻击者无需身份认证即可远程利用，CVSS 评分 9.8，危害等级严重。"
published = "2021-05-07T23:15:07Z"
remediation = '立即登录 Tenda AC11 路由器管理界面，进入"系统设置"→"固件升级"，检查并安装 Tenda 发布的最新官方固件版本，以修复 /goform/setmac 接口中的栈缓冲区溢出漏洞。若当前管理界面无法正常访问或升级失败，请通过 Tenda 官方技术支持渠道获取修复后的固件文件，使用手动升级方式完成更新。在完成固件升级前，建议通过防火墙或路由器访问控制列表（ACL）限制对路由器 Web 管理界面的外部访问，仅允许可信内网 IP 访问，以降低被远程利用的风险。'
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "腾达 AC11 路由器 setmac 接口堆栈缓冲区溢出远程代码执行漏洞"
updated = "2026-06-17T03:52:12Z"

