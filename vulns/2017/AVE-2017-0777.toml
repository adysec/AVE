[basic]
description = "Intel Active Management Technology (AMT)、Intel Standard Manageability (ISM) 及 Intel Small Business Technology (SBT) 版本 6.x 至 11.6 存在访问控制缺陷（CWE-269），未授权的远程网络攻击者可通过向 AMT/ISM 管理端口（如 16992/16993）发送特制 Digest 认证请求绕过鉴权，直接获取系统级权限；本地未授权攻击者亦可启用管理功能提升至网络或本地系统权限。该漏洞影响广泛部署于企业服务器、工作站的 Intel 管理引擎固件，CVSS 3.1 评分 9.8 (CRITICAL，AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H)，已列入 CISA 已知被利用漏洞目录，攻击者无需认证即可远程接管设备管理控制权，最终完全控制目标主机操作系统。"
published = "2017-05-02T14:59:00Z"
remediation = "升级 Intel AMT/ISM 固件到 v12.0 或更高版本，从 Intel 支持网站下载并应用官方固件更新包，或通过 Windows Update 自动更新 AMT 组件。如无法立即应用固件更新，请在防火墙中禁用未授权的 AMT 网络访问，并确保 AMT 管理密码安全设置（启用强密码+双因素认证），同时禁用 AMT 的 Internet 共享功能 IDS。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Intel Active Management Technology 远程权限提升漏洞"
updated = "2026-06-17T01:21:02Z"

