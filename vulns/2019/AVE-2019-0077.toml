[basic]
description = "这是一个针对 Windows Graphics Device Interface (GDI) 处理内存对象方式的远程代码执行漏洞。攻击者无需身份验证即可通过精心构造的数据包触发此漏洞，导致攻击者在目标系统上获得权限。该漏洞影响 Windows 7、8.1、10 和 Server 等多个版本，CVSS 评分高达 8.8，威胁等级为高级。攻击者只需诱使目标用户执行特定操作即可利用此漏洞。微软已发布安全更新来修复此漏洞，用户应及时安装更新以获取保护。"
published = "2019-05-16T19:29:02Z"
remediation = "立即安装 Windows 10/11 的最新安全更新（至少升级到 2023 年 6 月累积更新或更高版本），或确保已安装 Microsoft 2024 年 8 月安全更新包（KB 编号：4522938 及以上），并启用 Windows Defender 实时保护。此外，由于这一 GDI RCE 漏洞影响 GDI+ 对象处理，可临时通过注册表 DisableDWORD 值关闭 GDI+ 功能来缓解风险，或通过组策略禁用 Windows 照片查看器等使用 GDI+ 的应用，待补丁部署后再恢复功能。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "微软 Windows GDI 远程执行代码漏洞"
updated = "2026-06-17T02:09:09Z"

