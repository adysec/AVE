[basic]
description = "Oracle Fusion Middleware 的 Oracle WebLogic Server 组件 WLS Core 子组件存在远程代码执行漏洞。未经身份认证的远程攻击者可通过 T3 协议向受影响的 WebLogic Server 发送特制的序列化数据包触发该漏洞，成功利用可完全接管目标 WebLogic Server 服务器，导致机密性、完整性和可用性全部丧失。该漏洞影响 WebLogic Server 10.3.6.0、12.1.3.0、12.2.1.2 及 12.2.1.3 版本，无需任何权限即可远程利用，CVSS 评分 9.8，危害等级严重。Oracle 已在 2018 年 7 月季度关键补丁更新中修复此漏洞。"
published = "2018-07-18T13:29:00Z"
remediation = "建议立即安装 Oracle 2018 年 7 月关键补丁更新（Critical Patch Update），通过 Oracle 支持门户下载对应版本的 WebLogic Server 补丁。受影响版本包括 10.3.6.0、12.1.3.0、12.2.1.2 和 12.2.1.3。如无法立即打补丁，可在防火墙或网络层面阻止 T3 协议流量进入 WebLogic Server 端口（默认为 7001），作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Oracle WebLogic Server WLS Core 组件远程代码执行漏洞"
updated = "2026-06-17T01:56:34Z"

