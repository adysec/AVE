[basic]
description = "Linux 内核 XHCI 驱动中的 NEC uPD720200 控制器在处理等时（isochronous）USB 传输时存在越界写入漏洞（CWE-787）。当控制器在传输环末端遇到 Missed Service Errors 时，由于 Link TRB 的 chain 位未正确设置，硬件会错误地遍历超出传输环范围的内存页面，导致 IOMMU 页面错误。在共享 IOMMU 域的环境中，攻击数据可能被写入其他端点、其他 USB 设备甚至其他控制器的随机缓冲区，造成数据损坏、系统不稳定或信息泄露。拥有本地低权限访问权限的攻击者可通过连接带宽密集型 USB 等时设备（如 UVC 摄像头）并制造带宽竞争条件来触发该漏洞，CVSS 评分 7.8，危害等级高。该漏洞影响使用 NEC uPD720200 控制器的 Linux 系统。"
published = "2025-04-16T11:15:42Z"
remediation = "建议立即升级 Linux 内核至 6.12.19、6.6.85、6.1.130 或更高版本（含修复提交 9e8b5f3c7d2a）。Ubuntu 25.04 用户执行 `apt update && apt upgrade linux-image-generic` 安装 USN-7594-1 更新；SUSE SLES15 SP7 用户安装 SUSE-SU-2025:03633-1 / SUSE-SU-2025:3725-1 补丁包。无法立即升级时，可通过内核参数 `iommu=pt` 禁用 IOMMU 直通或在 BIOS 中关闭 USB 3.0 控制器作为临时缓解。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux Linux内核 USB xHCI 缓冲区溢出漏洞"
updated = "2026-07-30T06:22:03Z"

