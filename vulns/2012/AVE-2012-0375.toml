[basic]
description = "tags as specified.<value>WebKit 渲染引擎存在内存破坏漏洞，Apple iTunes 10.7 之前版本受此影响。未经身份认证的远程攻击者可通过构造恶意网站诱骗用户访问，触发内存损坏，导致远程代码执行或应用程序崩溃拒绝服务。攻击者无需任何凭据，仅需诱导用户使用受影响的 iTunes 打开恶意网页内容即可实现利用。"
published = "2012-09-13T10:30:20.933"
remediation = '升级 Apple iTunes 至 10.7 或更高版本，同时将 Safari 更新至 6.0.1 或更高版本（OS X Mountain Lion 用户请升级至 10.8.2，OS X Lion 用户请升级至 10.7.5），以修复 WebKit 内存破坏漏洞。Windows 用户请通过 iTunes 的"检查更新"功能或 Apple 官网下载最新版本。如无法立即升级，请避免访问不可信网站，并在浏览器中禁用 JavaScript 作为临时缓解措施。'
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes 内存破坏漏洞"
updated = "2026-06-16T23:43:45.817"

