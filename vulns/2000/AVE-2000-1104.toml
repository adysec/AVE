[basic]
description = "tags.<value>Lotus Notes R5 客户端（R5.0.5 及更早版本）在接收 S/MIME 加密或签名邮件时，未能正确校验邮件内容在传输过程中的完整性，导致即使邮件被中途篡改，客户端也不会向用户发出任何安全警告。攻击者可在邮件传输路径中实施中间人攻击，修改邮件正文、附件或链接而不被察觉，从而欺骗用户执行恶意操作或泄露敏感信息。该漏洞影响使用 Lotus Notes R5 客户端处理 S/MIME 邮件的所有用户，攻击者只需在网络中截获并篡改邮件即可完成攻击，无需认证凭据。建议用户升级至修复版本并启用额外的邮件完整性校验机制。"
published = "2001-01-09T05:00:00Z"
remediation = "将 Lotus Notes R5 客户端升级至 R5.0.6 或更高版本（含 Lotus Domino/Notes 6.x），以修复 S/MIME 签名与加密验证告警缺失问题。升级前备份 Notes 数据目录及 local.nsf 配置文件，升级后验证客户端收到签名被篡改或加密损坏的 S/MIME 邮件时能正确弹出安全警告提示。如暂无法升级，应对所有未显示签名验证状态的 S/MIME 邮件保持警惕，通过其他渠道核实邮件来源及内容完整性，并启用邮件网关层面的 S/MIME 完整性校验策略作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "IBM Lotus Notes R5 S/MIME 邮件篡改未告警漏洞"
updated = "2026-06-16T21:53:14Z"

