[basic]
description = "DD-WRT 固件（版本 45724 之前）的路由器 UPnP 组件中的 router/upnp/src/ssdp.c 文件存在不安全的 strcpy 调用，导致基于栈的缓冲区溢出漏洞（CWE-121）。未经身份认证的远程攻击者可通过向目标设备发送特制的 UPnP M-SEARCH 请求（可触发 ssdp_msearch 函数），利用 strcpy 将超长数据复制到内部固定大小的缓冲区，造成缓冲区溢出。该漏洞影响 DD-WRT 45724 之前版本固件，CVSS 评分 8.1，危害等级高。利用该漏洞的前提条件是设备管理员手动开启 UPnP 服务（该功能默认关闭，且默认仅监听内网接口），攻击者需处于 UPnP 服务可达的网络范围内（通常为内网）。成功利用后，攻击者可能实现远程代码执行或导致设备崩溃。"
published = "2026-07-16T18:16:39Z"
remediation = '升级到 DD-WRT build 45724 或更高版本（该版本已修复 ssdp.c 中不安全的 strcpy 调用）。如无法立即升级，请登录路由器管理界面，在"服务→UPnP"设置中关闭 UPnP 功能（该功能默认关闭且仅监听内网接口，关闭后即可阻断远程 M-SEARCH 请求触发的栈溢出）；若业务必须开启 UPnP，应确保路由器 WAN 侧不暴露该端口，并在防火墙中仅允许内网可信主机访问 UPnP 服务端口，同时限制 M-SEARCH 请求来源。'
score = 8.1
severity = "HIGH"
sources = ["kev"]
title = "DD-WRT UPnP处理缓冲区溢出远程代码执行漏洞"
updated = "2026-07-22T05:17:07Z"

