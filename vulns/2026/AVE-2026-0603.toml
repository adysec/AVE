[basic]
description = "Coder 远程开发环境管理平台中存在授权绕过漏洞（CWE-639），源于 `UpsertWorkspaceApp` 函数在处理主键冲突时直接覆盖已有工作空间应用的 `agent_id`，且 `insertAgentApp` 函数未验证 `CompleteJob` 载荷中的应用 ID 是否属于当前构建的工作空间。具有模板作者或外部编排器操作权限的攻击者可通过构造恶意 `CompleteJob` 请求，将已知受害者应用 UUID 绑定到攻击者控制的代理上，导致受害者的 IDE 会话、终端连接等应用流量被代理至攻击者的工作空间，造成敏感信息泄露和会话劫持。该漏洞影响 Coder 2.34.2 之前的所有版本，CVSS 评分 8.7，危害等级高。"
published = "2026-07-08T00:16:33Z"
remediation = "立即升级 Coder 至对应修复版本：v2.34.x 升级至 v2.34.2，v2.33.x 升级至 v2.33.8，v2.32.x 升级至 v2.32.7，v2.29.x (ESR) 升级至 v2.29.17。该漏洞无临时缓解措施，必须通过升级修复。升级后 `UpsertWorkspaceApp` 会校验 app ID 是否属于当前构建的工作空间，拒绝跨工作空间 agent 重绑定。"
score = 8.7
severity = "HIGH"
sources = ["ghsa"]
title = "Coder Coder 跨工作空间工作区应用重绑定漏洞"
updated = "2026-07-08T19:43:31Z"

