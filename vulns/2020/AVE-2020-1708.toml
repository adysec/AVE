[basic]
description = "Mozilla Firefox 浏览器缓存子系统存在释放后重用（use-after-free）漏洞，具体位于 `CacheStreamControlParent` 组件的 IPDL 接口实现中。当浏览器收到关闭或中止命令时，若仍有读取流处于打开状态，会触发 `StreamList::CloseAll` 函数，导致 `CacheStreamControlParent` 对象被提前释放，随后访问其 `mId` 成员时发生释放后重用。该漏洞存在于 Firefox 74.0.1 之前版本、Firefox ESR 68.6.1 之前版本及 Thunderbird 68.7.0 之前版本，攻击条件为利用竞争条件在缓存查询过程中触发关闭操作，攻击者无需身份验证即可远程利用，结合 CVE-2020-6819 可实现从渲染器沙箱逃逸至浏览器主进程，进而执行任意代码。该漏洞已被发现存在针对性在野攻击利用。"
published = "2020-04-24T16:15:13Z"
remediation = "将 Firefox 升级至 74.0.1 或更高版本，Firefox ESR 升级至 68.6.1 或更高版本，Thunderbird 升级至 68.7.0 或更高版本。如暂时无法升级，可在 Firefox 设置中禁用 JavaScript (about:config → javascript.enabled 设为 false) 作为临时缓解措施，并避免访问不可信网站。"
score = 8.1
severity = "HIGH"
sources = ["kev"]
title = "Mozilla Firefox ReadableStream 释放后重利用漏洞"
updated = "2026-06-17T03:23:51Z"

