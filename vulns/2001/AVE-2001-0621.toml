[basic]
description = 'HP-UX 11.04 及更早版本系统中自带的 top 工具存在文件覆盖漏洞，本地攻击者利用该漏洞可覆盖属于 "sys" 用户组的文件，导致系统完整性受损。攻击者需拥有本地系统访问权限，利用 top 工具在处理文件时的权限缺陷，以 sys 组身份覆盖目标文件，造成非授权数据篡改。该漏洞 CVSS 评分 2.1，危害等级低，攻击复杂度低，无需认证即可利用。'
published = "2001-02-12T05:00:00.000"
remediation = "立即升级 HP-UX 至 11.11（11i）或更高版本，该问题已在后续版本中修复。如无法升级，以 root 执行 `chmod 555 /usr/bin/top` 移除 top 的 setgid 位，防止本地用户利用其特权覆盖 sys 组文件。同时限制非信任用户的本地登录权限作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "HP-UX top 本地文件覆盖漏洞"
updated = "2026-06-16T21:53:39.907"

