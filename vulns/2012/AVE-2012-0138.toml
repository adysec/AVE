[basic]
description = "Apple QuickTime 7.7.2 之前版本在处理 H.264 编码的电影文件时存在堆缓冲区溢出漏洞。远程攻击者可向目标用户发送特制的恶意电影文件，当用户使用 QuickTime 打开该文件时触发堆缓冲区溢出，导致攻击者能够在受影响系统上执行任意代码或造成应用程序崩溃。该漏洞影响 Windows 和 macOS 平台上的 QuickTime 7.7.2 之前所有版本，CVSS 评分 9.3，危害等级严重。Apple 已发布 QuickTime 7.7.2 版本修复此漏洞。"
published = "2012-05-16T10:12:57Z"
remediation = "立即将 Apple QuickTime 升级至 7.7.2 或更高版本（Mac 用户通过 Software Update 更新，Windows 用户从 Apple 官网下载安装）。如无法升级，建议卸载 QuickTime 或禁用浏览器 QuickTime 插件，并避免打开来源不明的 H.264 编码影片文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime H.264编码文件堆缓冲区溢出漏洞"
updated = "2026-06-16T23:38:02Z"

