[basic]
description = "Apple iTunes在10.7及之前版本中使用了存在安全缺陷的WebKit组件，远程攻击者可构造包含恶意代码的网页，当用户使用iTunes内置浏览器访问该网页时，触发WebKit中的内存破坏漏洞，导致应用程序崩溃（拒绝服务）或在受影响系统上执行任意代码。该漏洞影响Apple iTunes 10.7之前的版本，CVSS评分为6.8，危害等级为中等偏上。"
published = "2012-09-13T10:30:21.087"
remediation = "立即将 Apple iTunes 升级至 10.7 或更高版本，Apple 在该版本中通过改进 WebKit 内存处理机制修复了此漏洞。临时缓解措施包括避免访问不可信网站、在防火墙或代理层面过滤恶意 Web 内容，并禁用 iTunes 浏览器中的 JavaScript 执行以降低远程代码执行风险。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:46.380"

