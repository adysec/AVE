[basic]
description = "Cisco CBOS 宽带操作系统 TCP/IP 协议栈存在内存消耗拒绝服务漏洞。运行 CBOS 2.4.4 及更早版本的 Cisco DSL CPE 设备中，TCP/IP 协议栈在处理超大尺寸数据包时存在内存分配缺陷。远程未经身份认证的攻击者可通过向目标设备的 DHCP 端口（67/68）、Telnet 端口（23）发送特制大包，或向 CPE 设备发送大量大包洪流，触发 TCP/IP 协议栈过度消耗系统内存，导致设备挂起或崩溃，造成拒绝服务。该漏洞无需认证即可远程利用，攻击复杂度低。"
published = "2002-10-04T04:00:00Z"
remediation = "升级 Cisco CBOS 至 2.4.5 或更高版本（Cisco Bug ID CSCdx36121 已修复此问题）。由于 Cisco 600 系列 DSL CPE 路由器已停产且不再提供固件更新，建议立即更换为受支持的 Cisco 设备。临时缓解措施：在边界防火墙上限制对 DHCP（UDP 67/68）和 Telnet（TCP 23）端口的访问，仅允许来自可信管理网络的连接。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Cisco CBOS TCP/IP协议栈拒绝服务漏洞"
updated = "2026-06-16T21:58:19Z"

