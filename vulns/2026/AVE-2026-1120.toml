[basic]
description = "Adobe Acrobat Reader 存在释放后使用（Use After Free）漏洞，攻击者可构造恶意 PDF 文件诱导用户打开，在解析过程中触发内存访问错误，从而在当前用户权限下执行任意代码。受影响版本包括 24.001.30365、26.001.21651 及更早版本，CVSS 评分为 7.8，危害等级为高。成功利用此漏洞需要用户交互，即受害者必须主动打开攻击者发送的恶意文件。"
published = "2026-06-09T21:17:21.710"
remediation = '立即升级 Acrobat Reader 2024 连续版至 24.001.30383 或更高版本、Acrobat Reader 2026 连续版至 26.001.21662 或更高版本，可通过 Acrobat 内"帮助"→"检查更新"或访问 Adobe 官网手动下载补丁。如暂无法更新，应避免打开来源不明的 PDF 文件，并在操作系统级别启用 DEP（数据执行保护）作为临时缓解措施。'
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Adobe Acrobat Reader 释放后使用漏洞"
updated = "2026-07-23T09:10:00.113"

