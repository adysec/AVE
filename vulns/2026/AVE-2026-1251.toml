[basic]
description = "undici 是 Node.js 中广泛使用的 HTTP 客户端库。该漏洞源于 undici 的 HTTP/1.1 dispatcher 在处理鸭类型（duck-typed）blob-like 请求体时，直接将 body.type 属性作为 Content-Type HTTP 头部值发送，未经过 isValidHeaderValue() 函数进行有效性验证。当应用程序通过 request()、stream()、pipeline() 或 dispatch() 等方法传递一个类型（.type）来自不可信输入的鸭类型 blob 对象时，攻击者可在其中注入 CRLF（回车换行）序列，从而在 HTTP 请求中追加任意头部字段，可能导致 HTTP 请求走私漏洞，使恶意请求绕过上游代理或 WAF 的安全检查。原生 Blob 对象不受影响，因其构造函数会自动剥离 CRLF 字符；使用 fetch() API 的应用也不受影响，因为该 API 通过 Headers 类进行验证。受影响版本包括 undici 6.x（低于 6.28.0）、7.x（7.0.0 至 7.29.0 之前）及 8.x（8.0.0 至 8.9.0 之前）。用户应升级至 undici v6.28.0、v7.29.0 或 v8.9.0 及更高版本以修复此漏洞。"
published = "2026-07-29T22:16:52.463"
remediation = '立即升级 undici 至 v6.28.0、v7.29.0 或 v8.9.0 及更高版本，以修复 HTTP/1.1 分发器对 blob-like 请求体 .type 属性未做验证导致的 CRLF 注入漏洞。若短期内无法升级，可在 request()、stream()、pipeline() 或 dispatch() 调用时显式设置经过验证的 Content-Type 请求头以跳过脆弱代码路径；同时改用原生 Blob 或 fetch-blob 替代手动构造的 duck-typed blob，或在赋值 .type 前拒绝包含 \r 和 \n 的控制字符作为临时缓解措施。'
score = 4.2
severity = "MEDIUM"
sources = ["ghsa"]
title = "Node.js undici HTTP 请求走私漏洞"
updated = "2026-08-04T15:41:50.450"

