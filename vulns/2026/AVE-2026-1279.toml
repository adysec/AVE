[basic]
description = "Progress ADC 产品（包括 LoadMaster、ECS 连接管理器、ObjectScale 连接管理器及 MOVEit WAF）的 API 接口存在操作系统命令注入漏洞。未经身份认证的远程攻击者可利用该漏洞，通过向多个命令端点发送包含未过滤特殊字符的恶意请求，在 LoadMaster 设备上执行任意操作系统命令，从而实现远程代码执行。该漏洞源于 API 端点未对用户输入进行充分过滤和验证，攻击者无需任何凭据即可构造特制请求触发命令执行。CVSS 评分为 9.6，危害等级严重，影响所有运行受影响版本的系统。"
published = "2026-06-04T14:16:45.177"
remediation = "立即升级 Kemp LoadMaster 至 GA 版本 7.2.63.2 或 LTSF 版本 7.2.54.18 及以上版本（修复版本发布于 2026 年 6 月）。如无法立即升级，请在 Web 界面中禁用 API 功能（System Configuration > System Administration > API Settings 中取消勾选 Enable API），或在防火墙层面限制仅允许受信任管理 IP 访问管理端口（默认 443/8443）。漏洞利用前提是 API 已启用，禁用 API 可作为临时缓解措施阻断攻击面。同时建议检查日志中是否存在异常 /accessv2 请求记录（特征：包含四个单引号 '''' 的 apiuser 字段和大量 g0-g60 参数），确认是否已遭利用。"
score = 9.6
severity = "CRITICAL"
sources = ["zdi"]
title = "Progress ADC LoadMaster 操作系统命令注入远程代码执行漏洞"
updated = "2026-07-22T20:10:00.127"

