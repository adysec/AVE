[basic]
description = "Check Point VPN-1/FireWall-1 4.1及更早版本中，模块间S/Key一次性密码认证机制的种子生成算法存在设计缺陷，远程攻击者可通过暴力破解方式枚举种子值，绕过认证机制获取未授权访问权限。该漏洞影响VPN网关和防火墙设备的管理访问控制，攻击者无需身份认证即可通过网络远程利用，可能导致敏感信息泄露、权限提升或网络策略绕过。Check Point官方已发布安全更新修复此漏洞。"
published = "2000-11-14T05:00:00.000"
remediation = "升级 Check Point VPN-1/FireWall-1 到 4.1 以上已修复该漏洞的版本。由于该产品版本已极其老旧，建议升级到 Check Point 官方仍在支持的最新版本（如 R80 及以上系列），同时在防火墙策略中禁用已过时的 S/Key 一次性密码认证方式，改用更安全的双因素认证机制（如 SecurID 令牌或数字证书认证）作为替代方案。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Check Point VPN-1/FireWall-1 S/Key 身份认证绕过漏洞"
updated = "2026-06-16T21:52:31.430"

