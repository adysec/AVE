[basic]
description = 'Cobalt RaQ3 服务器中 poprelayd 脚本（2.0 版本之前）存在 SMTP 中继认证绕过漏洞。远程攻击者可通过向 maillog 日志文件中注入包含自身 IP 地址的 "POP login by user" 字符串，绕过认证机制并利用该服务器作为开放 SMTP 中继发送垃圾邮件。该漏洞影响 Cobalt RaQ3 系列服务器，CVSS 评分 5.0，危害等级中等。厂商已发布更新版本修复此漏洞。'
published = "2001-07-04T04:00:00Z"
remediation = "升级 poprelayd 脚本至 2.0 或更高版本。Cobalt RaQ3 服务器已停止维护，建议迁移至受支持的邮件服务器软件，并在邮件服务器上启用 SMTP 认证（SMTP AUTH）及限制中继来源 IP 范围作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Cobalt RaQ3 PopRelayD SMTP 中继认证绕过漏洞"
updated = "2026-06-16T21:55:32Z"

