[basic]
description = 'WinVNC 安装时为其 WinVNC3 注册表键配置了过宽的访问权限，将读取和修改权限授予了"Everyone"用户组。任何本地或远程用户均可直接读取注册表中存储的敏感信息（如密码），或篡改相关配置实现特权提升，进而获得对目标系统的未授权访问。该漏洞影响多个版本的 WinVNC，CVSS 评分 9.0，危害等级严重。'
published = "2001-01-09T05:00:00Z"
remediation = '立即升级 WinVNC 至 3.3.4r7 或更高版本（从 http://www.realvnc.com 获取），新版本在安装时已将 WinVNC3 注册表项的访问权限从 Everybody 组收紧至仅限制服务账户可写。如无法立即升级，请手动修改注册表权限：打开 regedit，导航至 HKEY_LOCAL_MACHINE\Software\ORL\WinVNC3，右键属性→安全，删除 Everybody 组的读取与写入权限，仅保留 SYSTEM 和当前运行 VNC 服务的账户，完成后重启 WinVNC 服务使权限生效。上述操作可防止普通用户读取存储在注册表中的 VNC 认证密码及修改配置文件。'
score = 9
severity = "CRITICAL"
sources = ["cve"]
title = "AT&T WinVNC 注册表权限配置不当导致信息泄露与权限提升漏洞"
updated = "2026-06-16T21:53:17Z"

