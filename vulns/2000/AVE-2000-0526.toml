[basic]
description = "Microsoft Windows NT 4.0 及 2000 系统中的 NetBIOS Name Server (NBNS) 协议缺乏身份认证机制，远程攻击者无需任何权限即可向目标系统发送伪造的 Name Conflict（名称冲突）或 Name Release（名称释放）数据报文，导致目标 NetBIOS 名称服务错误地释放或更改其注册名称，进而造成网络名称解析服务不可用，引发拒绝服务。该漏洞攻击门槛低，仅需网络可达即可触发，影响所有运行 NBNS 服务的 Windows NT 4.0 和 Windows 2000 系统。"
published = "2000-07-27T04:00:00.000"
remediation = '安装 Microsoft MS00-047 安全补丁（Windows NT 4.0 及 Windows 2000），下载地址见 https://technet.microsoft.com/security/bulletin/ms00-047。安装后设置注册表 HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NetBT\Parameters 下 NoNameReleaseOnDemand 为 1（DWORD），以忽略伪造的名称释放数据包。同时在防火墙层面阻断 UDP 137 端口，防止外部攻击。Windows 2000 环境下可启用 IPSec 策略对 137-139 端口进行会话认证。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows NetBIOS Name Server 拒绝服务漏洞"
updated = "2026-06-16T21:52:14.333"

