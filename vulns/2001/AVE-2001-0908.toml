[basic]
description = "Lars Ellingsen 开发的 guestserver.cgi CGI 脚本存在远程命令执行漏洞。该脚本在处理用户提交的 email 参数时未对 shell 元字符进行有效过滤和转义，攻击者可通过向该参数注入特制的命令序列（如分号、管道符、反引号等 shell 元字符），从而在 Web 服务器上执行任意操作系统命令。该漏洞影响部署有 guestserver.cgi CGI 脚本的 Web 服务器，攻击者无需身份认证即可远程利用，仅需构造包含恶意 shell 元字符的 HTTP 请求即可触发，可导致服务器完全被控制。"
published = "2001-05-03T04:00:00Z"
remediation = '由于该漏洞软件已停止维护且无官方补丁，建议立即从服务器上删除 guestserver.cgi 脚本。如必须保留功能，应在 CGI 脚本代码中对 email 参数使用白名单过滤，剔除 &, |, ;, $, `, \ 等 shell 元字符，或将运行该脚本的用户权限降至最低，并在 WAF 中拦截包含 shell 特殊字符的请求。'
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Lars Ellingsen guestserver.cgi 远程代码执行漏洞"
updated = "2026-06-16T21:53:49Z"

