[basic]
description = "Quest KACE System Management Appliance 8.0.318 产品中的`/common/download_agent_installer.php` 脚本存在安全漏洞，该脚本被匿名用户无需身份验证即可访问，并可被攻击者利用执行任意系统命令，导致远程代码执行。该漏洞的攻击条件极其简单，攻击者无需权限或用户交互即可触发，危害范围广泛，影响 Windows Server 等企业级设备，CVSS 评分高达 9.8，属于极端严重的安全漏洞。攻击者可通过向目标系统发送恶意请求，完全控制服务器，窃取敏感数据或破坏系统完整性。尽管微软等厂商随后发布了安全更新，但许多企业可能未及时更新，仍面临极大安全风险。该漏洞充分体现了 Web 应用中输入验证不足和参数清理缺失的危险后果，属于典型的命令注入类安全问题。"
published = "2018-05-31T18:29:00Z"
remediation = "建议升级到 Quest KACE System Management Appliance最新安全补丁（至少8.0.400版本）以修复 `/common/download_agent_installer.php` 中的命令注入漏洞。同时，限制匿名用户访问该脚本权限，并配置Web应用防火墙规则阻止可疑的shell参数请求。 בנוסף，部署最新的网络入侵检测系统规则以监控针对此漏洞的攻击行为，并定期进行安全审计以确保补丁已正确应用。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Quest KACE System Management Appliance 命令注入漏洞"
updated = "2026-06-17T01:35:19Z"

