[basic]
description = "FreeBSD 4.1.1 系统中的 fingerd 服务存在任意文件读取漏洞。由于 fingerd 未对用户输入进行充分过滤，远程攻击者无需身份认证即可通过指定目标文件名替代常规用户名的方式，向 fingerd 服务发送特制请求，从而读取系统上的任意文件内容。该漏洞可导致敏感信息泄露，CVSS 评分 5.0，危害等级中危。目前暂无官方补丁信息。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 FreeBSD 至 4.1.1-STABLE（2000-10-05 之后版本），或应用官方补丁修改 finger.c 源码：在参数遍历循环中增加对以 '/' 开头的参数的校验拦截，重新编译 finger 和 fingerd 二进制。临时缓解措施：在 /etc/inetd.conf 中注释掉 finger 服务行（finger stream tcp nowait/3/10 nobody /usr/libexec/fingerd fingerd -s），重启 inetd 或发送 SIGHUP 使其生效。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "FreeBSD fingerd 任意文件读取漏洞"
updated = "2026-06-16T21:52:45.440"

