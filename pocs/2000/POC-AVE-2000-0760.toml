[info]
author = "ave"
description = "检测 Apache::ASP 模块 source.asp 示例脚本是否存在，该脚本允许远程攻击者写入/修改同目录下的任意文件，可导致 WebShell 上传和任意代码执行"
id = "POC-AVE-2000-0760"
name = "CVE-2000-0628 PoC"
severity = "high"
tags = ["ave-2000-0760"]
vuln_id = [
    "CVE-2000-0628",
    "AVE-2000-0760",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/site/eg/source.asp"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "source.asp",
    "Apache::ASP",
    "File Write",
    "write to file",
    "FileName",
    "Content",
]
