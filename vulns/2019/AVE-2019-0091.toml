[basic]
description = "CVE-2019-15811是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2019-08-29T19:15:13Z"
remediation = '建议立即升级 DomainMOD 至最新版本（4.13 之后版本已修复该 XSS 漏洞），并检查 `reporting/domains/cost-by-month.php` 文件中 `daterange` 参数的输出是否经过 `htmlspecialchars()` 或 `htmlentities()` 转义。如暂时无法升级，可在 Apache/Nginx 配置中添加 WAF 规则过滤 `daterange` 参数中的尖括号和 script 关键字，或在 php.ini 中启用 `default_charset = "UTF-8"` 并部署 ModSecurity 规则拦截 XSS 攻击载荷作为临时缓解措施。'
score = 6.1
severity = "MEDIUM"
