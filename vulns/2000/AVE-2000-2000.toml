[basic]
description = "Microsoft Windows 95/98/NT/2000 系统中 CIFS 浏览器协议与 NetBIOS 的实现存在缓冲腐败漏洞。远程攻击者可通过向目标系统发送特制的欺骗性 Browse Frame 请求（以单播或 UDP 广播数据报形式），修改动态 NetBIOS 名称缓存条目，导致系统将网络流量错误地重定向到攻击者控制的恶意主机。该漏洞影响 Windows 95、98、NT 4.0 及 2000 等版本，CVSS 评分 7.5，危害等级高。攻击者无需身份认证即可远程利用，可能导致信息泄露、服务中断或权限提升。"
published = "2000-08-29T04:00:00Z"
remediation = "安装 Microsoft 安全公告 MS00-067 提供的补丁程序。临时缓解措施：在防火墙阻止 UDP 137-138 端口和 TCP 139-445 端口入站流量，或禁用 NetBIOS over TCP/IP。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Windows 9x/NT 4.0/2000 NetBIOS 缓冲腐败漏洞"
updated = "2026-06-16T21:53:06Z"

