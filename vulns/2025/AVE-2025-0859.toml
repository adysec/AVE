[basic]
description = "Microsoft Office 存在释放后使用（Use-After-Free，CWE-416）漏洞，攻击者可通过诱导用户打开特制的 Office 文件触发该漏洞。成功利用此漏洞的攻击者可在当前用户权限上下文中执行任意代码，获取对受影响系统的完全控制，包括读取、修改或删除数据以及安装恶意程序。该漏洞影响 Microsoft Office 系列产品，CVSS 评分 7.8，危害等级高。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:38Z"
remediation = "建议立即安装 Microsoft 2025 年 2 月安全更新，通过 https://aka.ms/OfficeSecurityReleases 获取最新补丁，或通过 Windows Update 自动更新。受影响版本包括 Microsoft 365 Apps for Enterprise、Office LTSC 2021 及 Office LTSC 2024。该漏洞为 Use-After-Free 类型，攻击者需诱导用户打开特制 Office 文件方可利用，临时缓解措施可启用受保护视图（Protected View）并禁用来自不受信任来源的 OLE 对象嵌入。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Office 远程代码执行漏洞"
updated = "2026-06-17T08:43:16Z"

