[basic]
description = "Windows 数字媒体组件存在越界读取漏洞，该漏洞源于对内存边界检查不足。已获得低权限并具备物理访问权限的攻击者可利用此漏洞读取越界内存内容，进而实现权限提升，获取系统最高权限。攻击复杂度低，无需用户交互即可完成利用。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:45Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新：Windows Server 2008 安装 KB5050061（仅安全更新）或 KB5050063（月度汇总），Windows 10 1809 安装 KB5050008，Windows Server 2008 R2 安装 KB5050049。可通过 Windows Update 自动获取更新，或从 Microsoft Update Catalog 手动下载。由于该漏洞需要物理访问才能利用（CVSS 攻击向量为 Physical），限制对受影响系统的物理访问可作为临时缓解措施。"
score = 6.6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 数字媒体特权提升漏洞"
updated = "2026-06-17T08:42:55Z"

