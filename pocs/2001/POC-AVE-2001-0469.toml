[info]
author = "AVE"
description = "检测 D-Link DI-704 网关设备，通过 HTTP 请求识别设备型号与固件版本，确认是否存在 IP 分片拒绝服务漏洞。攻击者无需认证即可发送特制畸形 IP 分片数据包导致设备重启。"
id = "POC-AVE-2001-0469"
name = "CVE-2001-1137 PoC"
severity = "medium"
tags = [
    "cve-2001-1137",
    "dlink",
    "dos",
]
vuln_id = [
    "CVE-2001-1137",
    "AVE-2001-0469",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "D-Link",
    "DI-704",
]
