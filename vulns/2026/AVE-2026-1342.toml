[basic]
description = """Flowise 是用于构建大语言模型流程的拖拽式用户界面工具。在 3.1.3 版本之前，其 CSVAgent 组件（CSVAgent.ts）存在 Python 代码注入漏洞。该组件通过 `file.split(',').pop()` 提取用户上传的 CSV 文件数据，且未对内容进行任何校验，直接将提取结果以字符串模板的形式拼接进可执行的 Python 代码中（`base64_string = "${base64String}"`），随后调用 Pyodide 执行。由于 `validatePythonCodeForDataFrame()` 的拒绝列表仅对后续 LLM 生成的代码进行校验，未覆盖这段初始代码块，因此攻击者可通过在 CSV 数据中注入闭合引号及后续 Python 代码，利用 Pyodide 的 `js` 桥接功能访问宿主 Node.js 进程，进而加载 `child_process` 模块并在 Flowise 容器中以 root 权限执行任意操作系统命令，实现远程代码执行。该漏洞影响所有使用了受影响 CSVAgent 组件的 Flowise 实例，攻击者只需拥有登录凭据并创建包含恶意 CSV 内容的对话流即可触发利用。Flowise 已在 3.1.3 版本中修复此漏洞。"""
published = "2026-08-04T17:17:00Z"
remediation = "立即升级 Flowise 至 3.1.3 或更高版本，官方已通过 commit f4e2794 修复 CSVAgent 中的代码注入漏洞。若暂时无法升级，建议在防火墙或反向代理层面禁用 CSV Agent 节点的文件上传功能，或限制对 /api/v1/chatflows 接口的未授权访问，以阻止攻击者利用 Pyodide js 桥接执行任意操作系统命令。"
score = 9.2
severity = "CRITICAL"
sources = ["ghsa"]
title = "Flowise 低代码平台 CSVAgent 远程代码执行漏洞"
updated = "2026-08-04T20:16:53Z"

