[basic]
description = "WQuinn QuotaAdvisor 4.1 在处理存储在备用数据流（Alternative Data Streams, ADS）中的文件时，未能正确记录文件实际大小，导致本地用户可通过将文件写入 NTFS 备用数据流来绕过磁盘配额限制。攻击者只需拥有本地系统访问权限即可利用此漏洞，无需特殊权限。该漏洞影响 WQuinn QuotaAdvisor 4.1 版本，CVSS 评分 4.6，危害等级中危。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 WQuinn QuotaAdvisor 至 4.1 以上已修复该问题的版本；如厂商已停止支持，建议更换为支持 NTFS 备用数据流（ADS）正确计费的替代配额管理软件（如 Windows 内置文件服务器资源管理器 FSRM 配额功能）。临时缓解措施：通过组策略或 NTFS 权限限制用户对备用数据流的写入权限，并定期审计磁盘使用情况。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "WQuinn QuotaAdvisor 安全绕过漏洞"
updated = "2026-06-16T21:52:47.093"

