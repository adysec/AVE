[basic]
description = 'Windows 2000 系统的 Indexing Service 中的 ixsso.query ActiveX 对象被错误标记为"对脚本安全"，导致远程攻击者可通过恶意网页嵌入脚本，利用该 ActiveX 对象探测访问者系统中特定文件是否存在，造成敏感信息泄露。攻击条件仅需目标用户使用 Internet Explorer 访问恶意网站，且系统启用了 Indexing Service 服务。该漏洞影响 Windows 2000 系统，CVSS 评分 4.3，危害等级中危。'
published = "2001-01-09T05:00:00Z"
remediation = '在 Internet Explorer 中为"Internet"和"受信任的站点"区域启用"对标记为可安全执行脚本的 ActiveX 控件执行脚本"设置为"禁用"；通过注册表设置 `ixsso.query` 控件的 Kill Bit（CLSID: {C0A9EE9B-AC7B-11D1-9A6E-006097C6BDBE}，将 Compatibility Flags DWORD 值设为 0x400）；如无需使用 Indexing Service，在服务管理器中停止并禁用 Indexing Service 服务；建议将 Windows 2000 系统升级到受支持的 Windows 版本（如 Windows 10/11）以获得持续安全更新。'
score = 4.3
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows 2000 Indexing Service 跨站脚本漏洞"
updated = "2026-06-16T21:53:09Z"

