[basic]
description = "Google Chrome 的 V8 JavaScript 引擎存在堆缓冲区溢出漏洞，远程攻击者可通过构造特制的 HTML 页面诱导用户访问，触发 V8 引擎在处理 JavaScript 对象时发生堆内存越界写入，导致堆破坏。成功利用此漏洞可实现远程代码执行或导致浏览器崩溃拒绝服务。该漏洞影响 Google Chrome 133.0.6943.126 之前版本及基于 Chromium 的 Microsoft Edge 133.0.3065.82 之前版本，攻击复杂度低，无需特殊权限，仅需用户交互（点击链接或访问恶意网页）。Google 已在 2025 年 2 月发布的 Chrome 133.0.6943.126 版本中修复此漏洞。"
published = "2025-02-19T17:15:14Z"
remediation = "升级 Google Chrome 至 133.0.6943.126 及以上版本，或升级 Microsoft Edge 至 133.0.3065.82 及以上版本。基于 Chromium 的第三方浏览器（如 Opera、Brave 等）请同步更新至对应修复版本。如无法立即升级，可启用 Chrome 的安全浏览功能并禁用 JavaScript 作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 堆缓冲区溢出漏洞"
updated = "2026-06-17T08:27:29Z"

