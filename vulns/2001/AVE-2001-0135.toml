[basic]
description = "Thinking Arts ES.One 软件包中的 store.cgi 脚本存在目录遍历漏洞。未经身份认证的远程攻击者可通过在 StartID 参数中注入 .. (点号) 序列实现路径穿越，从而读取服务器文件系统上的任意文件内容。该漏洞影响 Thinking Arts ES.One 1.0 版本，攻击者无需任何凭据即可构造包含 /../ 序列并附加 %00 截断符的恶意 URL，在无需交互的情况下利用此漏洞获取敏感信息，可能导致配置文件、源代码等机密数据泄露。"
published = "2001-05-03T04:00:00Z"
remediation = "Thinking Arts ES.One 1.0 及 store.cgi 已停止维护且无官方补丁，建议立即下线该服务并迁移至现代 Web 应用框架。如确需临时缓解，应在 Apache/Nginx 中禁用 store.cgi 执行权限，或在 Web 应用防火墙（WAF）中配置规则拦截 StartID 参数中的 ../ 序列与 %00 空字节，同时将 cgi-bin 目录文件系统权限收紧至最小范围。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Thinking Arts ES.One 目录遍历漏洞"
updated = "2026-06-16T21:54:03Z"

