[basic]
description = "Open WebUI 是一款自托管 AI 平台，其 0.8.12 至 0.10.0 版本中存在授权绕过漏洞。已认证的非管理员用户若拥有对 arena 包装模型的读取权限，可通过任务端点（如 /api/v1/tasks/moa/completions）直接调用底层受限模型。漏洞根源在于任务路由直接调用 utils.chat.generate_chat_completion()，arena 回退解析在包装模型访问检查后以 bypass_filter=True 递归分发，跳过了对所选子模型的访问权限校验。攻击者无需交互即可利用该漏洞查询管理员限制访问的模型，导致机密信息泄露及 API 配额消耗。该漏洞 CVSS 评分 5.4，影响范围包括所有使用 Open WebUI 且配置了 arena 模型访问控制的部署实例。官方已在 v0.10.0 版本中修复。"
published = "2026-07-09T17:17:03Z"
remediation = "立即升级 Open WebUI 至 v0.10.0 或更高版本（对应 commit dc4924b66e655b315e3be4430a3e51b7d5c20acc）。如无法立即升级，可临时移除非管理员用户的 arena wrapper 模型读取权限，或通过反向代理限制对 /api/v1/tasks/moa/completions 等任务端点的非管理员访问。"
score = 5.4
severity = "MEDIUM"
sources = ["ghsa"]
title = "Open WebUI Arena 任务端点访问控制绕过漏洞"
updated = "2026-07-10T02:44:19Z"

