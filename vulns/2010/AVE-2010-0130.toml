[basic]
description = "Apple iTunes 9.2 之前版本（Windows 平台）及 iOS 4 之前版本（iPhone 和 iPod touch）的 WebKit JavaScriptCore 组件存在释放后重用漏洞。远程攻击者可通过构造与页面转换相关的恶意网页内容，触发内存对象在释放后被再次访问，导致任意代码执行或应用程序崩溃拒绝服务。该漏洞 CVSS 评分 9.3（严重），攻击向量为网络、攻击复杂度中等、无需身份认证，机密性/完整性/可用性均受完全影响。此漏洞与 CVE-2010-1763 和 CVE-2010-1769 属于不同漏洞。Apple 已在 iTunes 9.2 和 iOS 4 中修复此问题。"
published = "2010-06-18T16:30:01Z"
remediation = "将 iTunes 升级至 9.2 或更高版本（Windows 平台），将 iOS 升级至 4.0 或更高版本（iPhone/iPod touch）。可在 WebKit 设置中禁用 JavaScript 作为临时缓解措施，或通过内容过滤网关拦截包含恶意页面跳转的 HTTP 流量。Apple 已通过 iTunes 9.2 更新和 iOS 4 更新修复该漏洞，建议从 Apple 官网或设备设置中立即安装更新。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple iTunes 及 iOS WebKit JavaScriptCore 释放后重用远程代码执行漏洞"
updated = "2026-06-16T23:18:15Z"

