[basic]
description = "node-tar 是 Node.js 的 tar 归档操作库，其解压和解析路径（如 src/extract.ts）未对解压后数据总量、条目数量及压缩比设置硬性上限。未经身份认证的远程攻击者可通过构造特制的极小 Gzip Bomb 压缩包，利用该缺陷在解压时迅速膨胀至数 GB 数据，耗尽服务器磁盘空间和 CPU 资源，导致服务崩溃。该漏洞影响所有使用 node-tar 处理不可信归档的应用（如 npm 注册表、CI/CD 流水线、文件共享平台），CVSS 评分 9.2，危害等级严重。开发者应升级至 7.5.19 及以上版本修复。"
published = "2026-07-08T16:16:33Z"
remediation = "立即将 node-tar 升级至 7.5.19 或更高版本（`npm install tar@^7.5.19`）。如无法升级，在调用 tar.extract() 前自行校验压缩比，拒绝解压后大小超过阈值（如 1GB）的归档文件，或使用沙箱环境限制磁盘写入配额。"
score = 9.2
severity = "CRITICAL"
sources = ["ghsa"]
title = "node-tar 解压缩拒绝服务漏洞"
updated = "2026-07-10T18:57:17Z"

