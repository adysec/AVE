[basic]
description = "Flowise 是一个用于构建大语言模型（LLM）流程的拖放式用户界面。在 3.1.3 版本之前，Flowise 在代码执行沙箱中注入 $vars 变量时未验证调用者是否具备 variables:view 权限，从而绕过官方变量 API 的权限保护。具有低权限账户或 API 密钥的远程攻击者，即使被拒绝 variables:view 权限，也可通过调用 /api/v1/node-custom-function 端点获取当前工作区的全部变量，包括静态变量值及从服务器环境变量 process.env 解析的运行时变量。这可能导致数据库密码、JWT 密钥、SMTP 密码、云密钥等敏感凭据泄露。此漏洞由权限边界绕过引起，影响所有低于 3.1.3 版本的 Flowise 实例，修复建议升级至 3.1.3。"
published = "2026-08-04T19:16:54Z"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
score = 7.1
severity = "HIGH"
sources = ["ghsa"]
title = "Flowise Flowise 权限绕过导致未授权工作区变量泄露漏洞"
updated = "2026-08-04T20:16:53Z"

