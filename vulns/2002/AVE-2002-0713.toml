[basic]
description = "W-Agora 4.1.3 版本存在 PHP 远程文件包含漏洞，由于应用程序对 inc_dir 参数缺乏有效过滤，未经身份认证的远程攻击者可通过构造特制的请求参数，将外部服务器上的恶意 PHP 文件引入并执行。攻击者利用该漏洞可在目标系统上执行任意 PHP 代码，从而获取服务器控制权、窃取敏感数据或进一步渗透内网。该漏洞利用复杂度低，攻击者仅需向目标 Web 站点发送包含恶意路径的 HTTP 请求即可触发，无需预先获取账户凭证或进行复杂交互。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 W-Agora 至厂商发布的安全补丁版本，或手动下载并应用官方补丁（补丁下载地址：http://www.w-agora.net/current/view.php?site=support&bn=support_dl&key=1023878911）。如无法立即升级，应在 php.ini 中将 allow_url_include 设为 Off 以禁止远程文件包含，并在代码层面对 inc_dir 参数进行严格校验，仅允许本地路径值，同时部署 Web 应用防火墙拦截包含 http:// 或 https:// 的 inc_dir 参数请求，临时阻止攻击利用。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "W-Agora 4.1.x 远程文件包含漏洞"
updated = "2026-06-16T22:00:13Z"

