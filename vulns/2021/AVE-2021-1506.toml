[basic]
description = "标签中。<value>Google Chrome 浏览器在 91.0.4472.114 版本之前存在 WebGL use-after-free 漏洞。远程攻击者可通过构造特制的 HTML 页面，利用 WebGL 组件中已释放内存的引用触发堆内存损坏，在用户使用受影响版本 Chrome 打开恶意网页时实现远程代码执行。该漏洞需要用户交互，攻击者需诱使目标用户访问包含恶意 WebGL 内容的网页。Google 已在 Chrome 91.0.4472.114 中修复该漏洞。"
published = "2021-07-02T19:15:07Z"
remediation = '升级 Google Chrome 至 91.0.4472.114 或更高版本，可通过 Chrome 菜单"帮助"→"关于 Google Chrome"自动更新。如暂无法立即升级，可临时禁用 WebGL 功能（在地址栏访问 chrome://flags/#disable-webgl 并设为 Disabled）作为缓解措施，但可能导致依赖 WebGL 的网页无法正常显示。'
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome WebGL 释放后使用漏洞"
updated = "2026-06-17T03:50:27Z"

