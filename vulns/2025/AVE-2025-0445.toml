[basic]
description = "GNU Binutils 2.45 版本的链接器组件在处理 ELF 文件的异常帧头（.eh_frame）信息时，`bfd/elf-eh-frame.c` 文件中的 `_bfd_elf_parse_eh_frame` 函数存在基于堆的缓冲区溢出漏洞。本地攻击者可通过构造特制的 ELF 文件，诱导目标用户使用受影响版本的链接器进行链接操作，触发堆缓冲区溢出，可能导致信息泄露或程序崩溃。该漏洞需本地访问且需低权限用户交互，CVSS 评分 1.9，危害等级低。GNU Binutils 已在 2.46 版本中修复此问题。"
published = "2025-09-27T23:15:31Z"
remediation = "升级 GNU Binutils 至 2.46 或更高版本（官方已确认修复）。补丁 commit 为 ea1a0737c7692737a644af0486b71e4a392cbca8，可手动应用该补丁重新编译。对于无法立即升级的系统，限制本地用户对受影响二进制文件（ld/linker）的执行权限作为临时缓解措施。"
score = 1.9
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils 链接器基于堆的缓冲区溢出漏洞"
updated = "2026-06-17T08:29:36Z"

