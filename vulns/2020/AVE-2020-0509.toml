[basic]
description = "Microsoft Windows Netlogon 远程协议（MS-NRPC）在处理安全通道连接时存在加密认证绕过漏洞（代号 ZeroLogon）。攻击者无需任何身份认证，通过网络向域控制器发送特制的 Netlogon 请求，利用 AES-CFB8 加密算法中计算初始向量为零时的缺陷，即可伪造计算机账户凭据，重置域控制器的机器账户密码，从而获取域管理员权限。该漏洞影响所有 Windows Server 版本（2008 至 2019），CVSS 评分 10.0，危害等级严重。Microsoft 已分两阶段发布安全更新修复此漏洞。"
published = "2020-08-17T19:15:15Z"
remediation = '立即为所有域控制器安装 Microsoft 2020 年 8 月安全更新 (KB4565349) 及后续 2021 年 2 月补丁 (KB4571694)，并启用域控制器上的 "Domain controller: Allow vulnerable Netlogon secure channel connections" 组策略为 "Disabled"。同时运行 `Test-ComputerSecureChannel -Repair` 验证所有域成员的安全通道状态，对不支持安全 RPC 连接的旧设备设置 "Account is sensitive and cannot be delegated" 标记作为临时缓解。'
score = 5.5
severity = "MEDIUM"
sources = ["kev"]
title = "Microsoft Windows Netlogon 权限提升漏洞"
updated = "2026-06-17T03:01:29Z"

