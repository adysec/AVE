[basic]
description = "WordPress wp-live-chat-support插件8.0.27版本之前存在跨站脚本漏洞。该漏洞源于GDPR页面对用户输入内容缺乏充分的过滤与转义，未经身份认证的远程攻击者可通过构造包含恶意JavaScript代码的请求诱骗管理员或高权限用户访问该页面，从而在用户浏览器端执行任意脚本代码。由于攻击向量为网络，攻击复杂度低且无需任何权限，但需要用户点击触发，成功利用后可导致会话劫持、敏感信息窃取或后台管理员权限被接管，对使用该插件的WordPress站点安全构成威胁。"
published = "2019-08-12T15:15:12.527"
remediation = "立即升级 WordPress wp-live-chat-support 插件至 8.0.27 或更高版本。进入 WordPress 管理后台，点击「插件」→「已安装插件」，找到 wp-live-chat-support 并执行更新。如无法立即升级，可临时禁用该插件或删除插件目录下的 GDPR 相关页面文件以阻断攻击面。更新完成后建议清除浏览器缓存及 CDN 缓存，确保新版本代码正常生效。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress wp-live-chat-support插件跨站脚本漏洞"
updated = "2026-06-17T02:19:23.160"

