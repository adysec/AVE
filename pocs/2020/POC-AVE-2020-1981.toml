[info]
author = "ave"
description = "验证Trend Micro Apex One和OfficeScan XG服务器是否存在任意文件上传目录遍历漏洞，未经身份验证的远程攻击者可利用该漏洞向受影响安装路径写入任意数据并绕过ROOT登录"
id = "POC-AVE-2020-1981"
name = "CVE-2020-8599 PoC"
severity = "critical"
tags = ["ave-2020-1981"]
vuln_id = [
    "CVE-2020-8599",
    "AVE-2020-1981",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/servlet//vulnerable/endpoint"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["vulnerable"]
