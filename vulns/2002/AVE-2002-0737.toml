[basic]
description = "使用 Microsoft Foundation Class (MFC) 静态库构建的 ISAPI 扩展（如 BadBlue）在处理特制超长 HTTP 查询字符串时，CHttpServer::OnParseError 函数存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过发送超长查询字符串触发解析错误，导致访问违规和应用程序崩溃，进而可能执行任意代码。该漏洞影响基于 Visual C++ 5.0 及 6.0（SP3 之前版本）构建的应用程序。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 Visual C++ 6.0 至 SP3 或更高版本并重新编译受影响 ISAPI 扩展；若使用 BadBlue，升级至 2.5 版本以上；临时缓解可在 IIS 中禁用 ISAPI 扩展或限制查询字符串长度"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft Foundation Class Library 7.0 ISAPI 缓冲区溢出漏洞"
updated = "2026-06-16T22:00:24Z"

