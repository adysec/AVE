[basic]
description = "Linux 2.4 内核（版本低于 2.4.19）在处理浮点上下文切换时错误地假设 `fninit` 指令会清除所有寄存器，但部分处理器在执行该指令后并不会清除 SSE 相关寄存器的残留数据。本地攻击者可利用此缺陷，通过精心构造的程序读取其他进程遗留的敏感信息，导致内核信息泄露。该漏洞攻击复杂度低，无需特殊权限即可利用，影响所有使用受影响内核版本的 Linux 系统。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 Linux 内核至 2.4.19 或更高版本，该版本修复了 fninit 指令未完全清除 SSE 寄存器导致的信息泄露问题。如无法立即升级内核，可通过禁用内核中对 SSE/SSE2 寄存器的用户态访问权限作为临时缓解措施，但建议优先完成内核升级。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Linux Kernel 2.4 处理器 SSE 寄存器信息泄露漏洞"
updated = "2026-06-16T21:59:34Z"

