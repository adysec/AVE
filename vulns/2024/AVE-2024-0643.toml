[basic]
description = "Linux 内核 MediaTek DRM 子系统中存在释放后使用（Use-After-Free）漏洞。在 mtk_drm_bind 函数中，当 mtk_drm_kms_init 初始化失败时，drm 对象会通过 drm_dev_put 被释放，但 private->all_drm_private[i]->drm 指针未被置为 NULL。系统关机时调用 drm_atomic_helper_shutdown 会访问该悬空指针，导致释放后使用。本地攻击者可通过构造特定条件触发该漏洞，造成系统崩溃或潜在的信息泄露与权限提升。该漏洞影响 Linux 内核 MediaTek DRM 驱动，攻击者需具备本地低权限访问。"
published = "2025-01-19T12:15:26Z"
remediation = "立即升级 Linux 内核至包含提交 fa1a78e5d24b 的版本（如 v6.13-rc2 及以上），该提交修复了 mtk_drm_bind 失败时未将指针置 NULL 导致的 use-after-free 问题。Ubuntu 用户请安装 USN-7381-1 或 USN-7514-1 安全更新，通过 apt update && apt upgrade linux-image-* 完成升级。如无法立即更新，可临时限制 Mediatek DRM 模块加载（通过 blacklist mtk_drm），但建议尽快打补丁。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux Kernel MediaTek DRM 驱动释放后使用漏洞"
updated = "2026-06-17T08:14:14Z"

