[basic]
description = "ASUSTOR ADM 3.1.0.RFQ3 Photo Gallery应用中存在SQL注入漏洞。该应用的树列表功能在处理 'album_id' 或 'scope' 参数时缺乏有效的输入验证和SQL查询参数化，导致攻击者能够向photo-gallery/api/album/tree_lists/端点发送恶意参数嵌入恶意SQL代码。未经身份验证的远程攻击者可利用此漏洞访问、修改或删除数据库中的所有数据，甚至可能执行系统命令和获取控制权，威胁系统安全。该漏洞广泛存在于ASUSTOR ADM 3.1.0.RFQ3版本中，由于攻击向量为网络远程，攻击者无需任何权限即可触发，攻击成功率极高。漏洞危害等级极高，CVSS评分达到9.8，评估为严重威胁，攻击者只需要简单构造的恶意请求即可成功利用该漏洞，导致系统数据泄露、破坏或被完全控制。Microsoft已发布安全更新补丁，但许多用户未及时更新，仍然暴露在攻击之下。"
published = "2018-08-16T20:29:01Z"
remediation = "建议立即升级 ASUSTOR ADM 至 3.1.1 或更高版本（官方已在 2018 年 8 月修复该 SQL 注入漏洞）。如无法立即升级，请在 ADM 控制台禁用「照片图库」应用，或在防火墙/反向代理层面限制对 /photo-gallery/api/album/tree_lists/ 接口的访问，并配置 WAF 规则拦截针对 album_id/scope 参数的 SQL 注入载荷（如单引号、UNION SELECT、SLEEP 等特征）。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "ASUSTOR ADM 3.1.0.RFQ3 Photo Gallery Application SQL注入"
updated = "2026-06-17T01:36:05Z"

