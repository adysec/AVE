[basic]
description = "AnyPortal(php) 系统中的 siteman.php3 脚本存在未明确漏洞，版本在 2000 年 4 月 22 日之前受影响。未经身份认证的远程攻击者可通过未知攻击向量向该系统发送特制请求，触发信息泄露漏洞，导致系统绝对路径等敏感信息被泄露。该漏洞影响部署有 AnyPortal(php) 的 Web 服务器，攻击条件简单，仅需远程网络访问即可利用，且无需身份认证。攻击者可通过路径泄露进一步了解服务器目录结构，为后续攻击提供便利。"
published = "2000-12-31T05:00:00.000"
remediation = '升级 AnyPortal PHP 至 2000 年 4 月 22 日或之后的版本（已修复 siteman.php3 路径泄露）。若无法升级，建议在 Web 服务器层面限制对 siteman.php3 的访问（如 Apache 使用 <Files "siteman.php3"> Require all denied </Files>），并配置 PHP 关闭 display_errors 避免错误回显绝对路径。同时部署 WAF 规则拦截针对该文件的异常请求。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "AnyPortal PHP 远程信息泄露漏洞"
updated = "2026-06-16T21:53:26.860"

