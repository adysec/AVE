[basic]
description = "BEA WebLogic 5.1.x 服务器存在源代码读取漏洞。攻击者通过在 URL 中插入 `/*.shtml/` 路径，可触发 SSIServlet 解析请求，导致服务器以明文形式返回 JSP 等解析页面的源代码。该漏洞无需身份认证，远程攻击者即可利用，可能导致敏感业务逻辑、数据库配置等源码信息泄露。CVSS 评分 5.0，危害等级中危。Oracle 已发布安全公告建议升级或禁用 SSIServlet。"
published = "2000-10-20T04:00:00Z"
remediation = "升级 BEA WebLogic 至 6.0 及以上版本，该漏洞已在后续版本中修复。如无法升级，在 WebLogic 管理控制台中禁用 SSIServlet，或通过 web.xml 移除 .shtml 映射，并在网络层面限制对 7001 端口的访问来源。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "BEA WebLogic 源代码读取漏洞"
updated = "2026-06-16T21:52:15Z"

