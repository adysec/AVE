[info]
author = "AVE"
description = "检测 QNX Neutrino RTOS 6.2.0 应用程序打包器非显式路径执行漏洞。通过检查 QNX 系统特征文件确认目标系统，验证是否存在 PATH 环境变量劫持导致本地权限提升的风险。"
id = "POC-AVE-2002-0563"
name = "QNX Neutrino RTOS Application Packager PATH Hijacking PoC"
severity = "high"
tags = [
    "cve-2002-1239",
    "qnx",
    "path-hijacking",
    "privilege-escalation",
]
vuln_id = [
    "CVE-2002-1239",
    "AVE-2002-0563",
]

[poc]
logic = "any"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
