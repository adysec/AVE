[info]
author = "ave"
description = "验证目标系统是否存在 Macromedia Shockwave Flash 插件 SWF 文件畸形标签长度导致的拒绝服务漏洞"
id = "POC-AVE-2001-0648"
name = "Macromedia Shockwave Flash Plugin SWF 文件拒绝服务漏洞 PoC"
severity = "high"
tags = ["ave-2001-0648"]
vuln_id = [
    "CVE-2001-0166",
    "AVE-2001-0648",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/test.swf"
protocol = "http"

[poc.requests.headers]
Accept = "application/x-shockwave-flash"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
