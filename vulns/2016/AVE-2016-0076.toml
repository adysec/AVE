[basic]
description = "这是一个影响 guard-livereload 的目录遍历漏洞。该工具的 live reload 服务器组件在路径验证方面存在缺陷，攻击者可通过发送包含目录遍历序列（如../）的特制 HTTP 请求，绕过目录限制读取任意文件。漏洞影响版本低于 2.5.2，攻击者无需身份验证即可远程执行此攻击，获取目标系统中的敏感文件，如配置文件、证书、源代码等。此类漏洞可能导致信息泄露和进一步的安全风险。"
published = "2016-01-01T00:00:00Z"
remediation = "建议立即升级 guard-livereload 到 2.5.2 或更高版本（运行 bundle update guard-livereload 或修改 Gemfile 指定版本）。若暂时无法升级，可在 Web 服务器层面配置路径规范化校验，禁止访问包含 ../ 等路径遍历序列的请求，同时限制 livereload 服务仅监听本地回环地址（127.0.0.1）避免外部直接访问。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "guard-livereload guard-livereload 目录遍历漏洞"
updated = "2016-01-01T00:00:00Z"

