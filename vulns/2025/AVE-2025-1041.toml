[basic]
description = 'Linux 内核 GPIO RCAR 驱动中，用于保护寄存器访问的 spinlock 类型选择不当。该驱动使用普通 spinlock（而非 raw_spinlock）来序列化寄存器访问操作，当内核开启 spinlock 调试功能时，会在特定上下文（如中断上下文或睡眠上下文）中触发"Invalid wait context"警告，因为普通 spinlock 可能会进入睡眠状态，而 raw_spinlock 则不会。该漏洞影响搭载 Renesas RCAR GPIO 控制器的 Linux 内核版本，本地低权限攻击者可通过竞争条件在特定内核配置下利用此问题，导致内核出现等待上下文错误、系统不稳定或拒绝服务。漏洞利用需要本地访问权限、低权限用户账户以及内核启用 spinlock 调试选项等条件，CVSS 评分 5.5，危害等级为中等。修复方式为将 spinlock 替换为 raw_spinlock 以确保寄存器访问序列化时不会触发上下文违规警告。'
published = "2025-04-01T16:15:21Z"
remediation = "建议立即升级 Linux 内核至已修复版本：Debian 11 升级至 5.10.223-1（DLA-4327）、Debian 12 升级至 6.1.106-1（DSA-5900）、Ubuntu 22.04 LTS 升级至 5.15.0-122-generic（USN-7511-1）、Ubuntu 24.04/24.10 升级至对应内核版本（USN-7605-1）。如无法立即更新内核，可暂时禁用 GPIO RCAR 相关驱动模块或避免在受影响硬件上启用 spinlock 调试选项（CONFIG_DEBUG_SPINLOCK）作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 rcar GPIO 驱动不当锁定漏洞"
updated = "2026-06-17T08:44:35Z"

