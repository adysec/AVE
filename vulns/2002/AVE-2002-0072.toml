[basic]
description = "w3m 文本浏览器 0.3.2.2 及之前版本在处理 IMG 标签的 ALT 属性时未正确转义 HTML 标签，导致跨站脚本攻击（XSS）漏洞。远程攻击者可构造包含恶意脚本的 IMG 标签 ALT 属性，诱导受害者使用 w3m 访问包含该恶意内容的页面，触发脚本执行从而窃取本地文件或 Cookie 信息。攻击需用户主动浏览恶意页面，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:P/I:N/A:N），影响范围为未升级至 0.3.2.2 版本的 w3m 用户。"
published = "2003-02-19T05:00:00Z"
remediation = "建议立即升级 w3m 到 0.3.2.2 或更高版本（可通过包管理器如 apt upgrade w3m 或 yum update w3m 安装）。若暂时无法升级，可通过编辑配置文件 ~/.w3m/config 设置 display_image=0 禁用图片显示，或在防火墙层面限制不受信任网站的访问作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "w3m 文本浏览器 IMG标签ALT属性HTML转义不当跨站脚本攻击漏洞"
updated = "2026-06-16T21:59:08Z"

