[basic]
description = "OpenSSH 在启用 UseLogin 选项时未能正确丢弃权限，导致本地用户可通过向 ssh 守护进程提供恶意命令来执行任意代码。该漏洞影响启用 UseLogin 配置的 OpenSSH 版本，攻击者需拥有本地系统访问权限，利用难度较低。成功利用后攻击者可获得目标系统的完全控制权限，CVSS 评分 10.0，危害等级严重。"
published = "2000-06-08T04:00:00Z"
remediation = "立即在 /etc/sshd_config 中将 UseLogin 设置为 no（UseLogin no），然后重启 sshd 服务。如必须使用 UseLogin 功能，请升级至 OpenSSH 2.1.1 或更高版本。OpenBSD 用户可参考官方 errata 006 获取补丁。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "OpenSSH UseLogin 本地权限提升漏洞"
updated = "2026-06-16T21:51:55Z"

