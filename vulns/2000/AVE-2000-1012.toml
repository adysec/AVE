[basic]
description = "该漏洞存在于 FreeBSD 4.1.1 的 fingerd 服务中。由于程序在处理请求时未能对用户输入的用户名进行严格验证，远程攻击者可以通过在请求中指定目标文件名而非合法用户名，欺骗服务读取并返回系统中的任意文件。该漏洞允许未经身份验证的远程攻击者在无需特权的条件下，通过网络直接获取服务器上的敏感文件，导致信息泄露。"
published = "2000-12-19T05:00:00.000"
remediation = '建议升级 FreeBSD 操作系统至 4.2 或更高版本以修复 fingerd 的漏洞；若无需使用 finger 服务，应在 /etc/rc.conf 中将 fingerd_enable 设置为 "NO" 并重启服务，从根本上消除攻击面。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "FreeBSD fingerd 远程任意文件读取漏洞"
updated = "2026-06-16T21:52:45.440"

