[basic]
description = "Azure Service Fabric 运行时存在不安全的链接解析漏洞（CWE-59，链接跟随）。已获得授权的本地攻击者可通过创建恶意符号链接，诱导 Service Fabric 运行时在处理文件访问时错误地解析链接路径，从而实现对目标系统上文件的高完整性篡改或敏感信息删除。该漏洞攻击复杂度较高，需要低权限用户交互配合，影响 Azure Service Fabric 运行时的文件访问机制。Microsoft 已在 2025 年 7 月安全更新中修复此漏洞。"
published = "2025-07-08T17:15:33Z"
remediation = "立即将 Azure Service Fabric 运行时升级至 10.1 Cumulative Update 7.0 或更高版本。可通过 Microsoft Update Catalog 或 Windows Update 获取该安全更新。临时缓解措施：限制对 Service Fabric 节点的本地交互式登录权限，仅允许受信任的管理员账户访问，以降低本地提权攻击面。"
score = 6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Azure Service Fabric 运行时权限提升漏洞"
updated = "2026-06-17T08:42:44Z"

