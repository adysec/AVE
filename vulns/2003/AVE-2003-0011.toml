[basic]
description = '该漏洞存在于带有 Kerberos 认证支持的 FTP 客户端（如 Kerberos 网络文件系统中的 FTP 客户端）。漏洞原理是：FTP 客户端在处理从远程 FTP 服务器获取的文件名时，未能对文件名中的管道符（|）字符进行充分过滤和转义，直接将文件名传入系统命令行解析，从而导致远程 FTP 服务器可以通过在文件名中嵌入管道符及任意命令的方式，在用户的本地系统上执行任意代码。攻击条件是：攻击者需要控制一个恶意的远程 FTP 服务器，当目标用户使用受影响的 FTP 客户端连接该服务器并下载/获取一个包含管道符文件名时，命令将在客户端本地以用户权限静默执行，无需额外交互。影响范围包括所有使用受影响 Kerberos FTP 客户端版本的 Linux/UNIX 系统用户，攻击可能导致完全的机密性、完整性和可用性破坏（CVSS 10.0，CWE-78），例如窃取敏感文件、篡改本地数据或瘫痪系统。利用方式是攻击者在恶意 FTP 服务端返回的目录列表中构造形如 "|command" 的文件名，诱导用户执行下载操作即可触发远程命令执行。'
published = "2003-02-19T05:00:00Z"
remediation = "I need to research CVE-2003-0041 to provide an accurate remediation. Let me search for specific fix information.Let me fetch more specific information about the patch for this vulnerability.Let me search for the specific advisory related to CVE-2003-0041 about the FTP client pipe vulnerability.I have enough information from the NVD page. The Red Hat advisory link (RHSA-2003-020) is a broken link, but from the NVD and other sources I can determine the remediation. This is a pipe character command injection vulnerability in the MIT Kerberos FTP client. Let me also check for the specific patch.Now I have enough information to construct an accurate remediation. Based on the MIT Kerberos advisories, this vulnerability was fixed in MITKRB5-SA-2003-001, which affected versions prior to 1.2.5. The Debian security tracker shows the fix for Debian bullseye (1.18.3-6+deb11u5 or later).<value>立即升级 MIT Kerberos 至 1.2.5 或更高版本（含 1.3.x 及 1.4.x 最新补丁），或从发行商安全更新中获取修复后的 krb5-clients 包（如 RedHat RHSA-2003:020、Mandrake MDKSA-2003:021）。如无法立即升级，请卸载或禁用 Kerberos FTP 客户端，改用 SFTP/SCP 等安全协议传输文件，避免从不可信 FTP 服务器获取文件。</arg_value>"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "Kerberos FTP客户端 远程代码执行漏洞"
updated = "2026-06-16T22:01:24Z"

