[basic]
description = "scponly 是一个限制用户仅使用 scp 和 sftp 命令的受限 Shell，但其在定位 scp 和 sftp-server 程序时未正确验证路径。已认证的远程攻击者可通过上传恶意程序并修改 $HOME/.ssh/environment 文件中的 PATH 环境变量，使系统定位到攻击者上传的恶意程序而非合法的 scp/sftp-server，从而绕过 scponly 的访问控制限制，在目标系统上执行任意命令。该漏洞影响 SCPOnly 2.3 和 2.4 版本，CVSS 评分 7.5，攻击向量为网络，攻击复杂度低，无需额外身份认证即可利用，可导致机密性、完整性和可用性均受到破坏。"
published = "2003-04-22T04:00:00.000"
remediation = "立即将 scponly 升级至 2.4 或更高版本（推荐 4.0 以上），新版本已修复对 scp 和 sftp-server 程序路径的验证缺陷。对于已部署的系统，执行以下临时缓解措施：以 root 身份将受限用户的 home 目录及 .ssh 子目录所有权改为 root.root 并设为不可变（chown root.root ~scpuser ~scpuser/.ssh && chattr +i ~scpuser ~scpuser/.ssh），禁止直接向 home 目录上传文件，改为创建 incoming 专用目录（mkdir ~scpuser/incoming && chown scpuser.scpuser ~scpuser/incoming），并全面审计及清除 home 目录中已有的所有隐藏文件（dotfiles），防止攻击者通过修改 $HOME/.ssh/environment 中的 PATH 变量绕过访问控制。同时在 sshd_config 中设置 PermitUserEnvironment no 以禁用用户环境文件加载，重启 sshd 服务生效。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "scponly SSH 环境变量注入访问控制绕过漏洞"
updated = "2026-06-16T21:59:23.197"

