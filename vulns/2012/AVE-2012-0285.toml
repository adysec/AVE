[basic]
description = "WebKit 作为被 Apple Safari 6.0 之前版本及 Apple iTunes 10.6.3 使用的网页渲染引擎，存在内存破坏漏洞。由于 WebKit 在处理特制网页中的畸形数据时缺少严格的内存边界校验，远程攻击者可诱使用户通过 Safari 或 iTunes 访问精心构造的恶意网站，进而触发内存破坏，导致应用程序崩溃并造成拒绝服务，或在当前用户权限下执行任意代码。该漏洞无需额外的身份认证即可利用，攻击条件仅为诱导受害者访问恶意网页。Apple 已在其 2012 年 7 月 25 日发布的安全更新（APPLE-SA-2012-07-25-1）中修复此漏洞，建议用户尽早将 Safari 升级至 6.0 及以上版本以消除风险。"
published = "2012-07-25T20:55:02Z"
remediation = "立即将 Apple Safari 升级到 6.0 及以上版本，或通过系统「软件更新」安装 Apple 于 2012 年 7 月 25 日发布的 Safari 6.0 更新，以修复 WebKit 中导致远程代码执行与内存破坏的相关缺陷；使用苹果 iOS 的设备应同步更新至 iOS 6.0。若暂时无法升级，请勿使用 Safari 访问不可信网站，可临时改用其他浏览器（如 Chrome、Firefox），并禁用 WebKit 对不可信网页的脚本/插件加载，以降低被恶意网页利用执行任意代码或造成拒绝服务的风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:34Z"

