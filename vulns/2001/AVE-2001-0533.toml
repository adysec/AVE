[basic]
description = 'Bugzilla 2.14 之前版本的 process_bug.cgi 在处理 Bug 跨产品组移动时，未正确重置或设置目标组的 "groupset" 权限位，导致被移动的 Bug 仍沿用原产品组的访问限制。由于原组的权限约束可能比目标组更为宽松，已授权用户可借此访问本应受限的 Bug 信息，造成信息泄露。攻击者需拥有 Bugzilla 系统合法账户并触发跨组移动操作，攻击复杂度低，无需额外权限。该漏洞影响 Bugzilla 2.14 之前所有版本。'
published = "2001-09-10T04:00:00Z"
remediation = "升级 Bugzilla 至 2.14 或更高版本。如无法升级，需手动修改 process_bug.cgi 中移动 bug 跨产品组时的逻辑，在移动操作完成后显式重置 groupset 位为目标产品组的权限掩码，确保旧组权限不被继承。具体补丁可参考 Bugzilla 2.14 安全公告中相关 bug 编号对应的补丁文件。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Mozilla Bugzilla process_bug.cgi 权限管理漏洞"
updated = "2026-06-16T21:56:12Z"

