[basic]
description = "Nuxeo 平台 10.3 版本之前存在服务端模板注入漏洞（SSTI），远程攻击者可通过向受影响版本的 Nuxeo 平台发送特制的恶意请求，利用模板引擎对用户输入的不当处理，在服务端执行任意 FreeMarker 模板表达式，从而实现远程代码执行。该漏洞无需身份认证即可触发，攻击复杂度低，可导致服务器被完全控制。Nuxeo 官方已在 10.3 版本中修复此漏洞。"
published = "2021-01-05T00:00:00Z"
remediation = "立即升级 Nuxeo Platform 至 10.3 或更高版本。该版本修复了错误页面处理中的 FreeMarker 模板注入漏洞。如无法立即升级，可在反向代理层（如 Nginx/HAProxy）添加规则拦截 URL 中包含 `${` 的请求，或禁用 FreeMarker 的 Execute 类（在 `nuxeo.conf` 中添加 `org.freemarker.template.utility.Execute=false`）作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Nuxeo 内容管理平台模版注入漏洞"
updated = "2021-01-05T00:00:00Z"

