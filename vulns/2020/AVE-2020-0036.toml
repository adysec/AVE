[basic]
description = "WAVLINK WL-WN530HG4、WN531G3、WN533A8 及 WN551K1 等多款无线路由器存在信息泄漏漏洞。其 `/cgi-bin/ExportAllSettings.sh` 接口未对 POST 请求进行身份认证校验，攻击者可直接发送特制请求获取路由器完整配置信息，其中包含管理员密码等高敏感数据。尽管获取到的配置数据需经过解密步骤方可还原明文密码，但解密所需的密钥及算法信息已公开可用。该漏洞影响上述多款 WAVLINK 路由器设备，攻击者无需任何认证凭据即可在远程网络位置发起攻击，成功利用后可获取设备管理员权限，进而完全控制路由器并进一步渗透内网。"
published = "2020-05-07T18:15:11Z"
remediation = "WAVLINK 未针对此漏洞发布官方补丁，受影响设备（WN530HG4、WN531G3、WN533A8、WN551K1）已停止维护。建议立即将设备管理界面限制为仅内网访问，禁止从 WAN 侧访问 Web 管理页面；更改管理员密码以降低凭据泄露后的风险；在边界防火墙中阻断对端口 80/443 的未授权入站访问；若条件允许，建议更换为仍在官方支持周期内的 WAVLINK 设备或其他品牌产品。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "WAVLINK WN530HG4 信息泄漏漏洞"
updated = "2026-06-17T02:48:47Z"

