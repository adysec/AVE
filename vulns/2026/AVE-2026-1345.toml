[basic]
description = "Flowise 是一款用于构建大语言模型流程的拖放式用户界面。在 3.1.3 版本之前，CSVAgent 节点允许用户提供通过 pyodide 执行的 Python 代码以处理 CSV 文件。尽管系统配置了黑名单拦截危险的 Python 构造（如 import、eval、exec 等），但攻击者可以利用 pandas 库的 read_pickle() 函数反序列化恶意 pickle 载荷，从而绕过黑名单实现远程代码执行。受影响文件为 flowise-components/nodes/agents/CSVAgent/CSVAgent.ts，用户可控的 customReadCSVFunc 参数会被直接拼入 pd.${customReadCSVFunc} 执行。具备创建或修改聊天流程权限的认证用户，可在 CSV Agent 的 Additional Parameters 中注入恶意代码，保存流程后通过向 /api/v1/prediction/&lt;UUID&gt; 发送 POST 请求触发，最终在服务器上执行任意操作系统命令。该漏洞 CVSS 评分 9.4，危害等级严重，已在 Flowise 3.1.3 版本中修复。"
published = "2026-08-04T17:17:00Z"
remediation = "立即升级 Flowise 至 3.1.3 或更高版本，该版本已移除 CSVAgent 节点中通过 pyodide 执行用户自定义 Python 代码的能力，从根本上消除 pandas.read_pickle() 反序列化攻击面。如暂无法立即升级，应通过访问控制列表（ACL）限制仅有受信任管理员可创建或修改 Chatflow，并在部署环境中临时禁用或移除 CSVAgent 节点及其相关功能入口。"
score = 9.4
severity = "CRITICAL"
sources = ["ghsa"]
title = "Flowise CSVAgent 远程代码执行漏洞"
updated = "2026-08-05T14:17:10Z"

