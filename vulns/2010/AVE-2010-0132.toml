[basic]
description = "该漏洞存在于 Apple Safari WebKit 渲染引擎中，影响 Windows 平台及 Mac OS X 10.5-10.6 版本的 Safari 4.0.5 及更早版本，对 Mac OS X 10.4 系统的 Safari 4.1 及更早版本也存在影响。漏洞原理是 WebKit 在处理 HTML 文档时对 UTF-7 字符串的规范化处理存在缺陷，且缺乏对引号结尾的完全验证，这导致攻击者能够通过向目标浏览器发送特制的 HTML 文档嵌入恶意 JavaScript 代码。攻击条件方面，攻击者无需身份验证，只需诱使受害者访问由攻击者控制的恶意网站即可触发漏洞。利用方式包括构造包含特殊 Unicode UTF-7 编码和未闭合引号的 HTML 文档，当受害者使用受影响的 Safari 版本浏览时，浏览器会解析这些文档并执行恶意脚本，从而可能导致会话劫持、隐私信息泄露或其他安全影响。该漏洞评分 4.3，表明其 severity 为 MEDIUM 需要中度操作复杂度才能利用，但影响仅限于用户信息，不涉及系统完整性破坏。"
published = "2010-06-11T18:00:21.020"
remediation = "升级 Apple Safari 至 5.0 版本（Mac OS X 10.5/10.6 及 Windows 系统）或 4.1 版本（Mac OS X 10.4 系统），可通过 Apple 软件更新或 Mac App Store 获取最新补丁。如暂时无法升级，建议在 Safari 偏好设置中禁用 JavaScript 执行，或改用其他浏览器作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari 跨站脚本漏洞"
updated = "2026-06-16T23:18:15.757"

