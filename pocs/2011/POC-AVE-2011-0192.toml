[info]
author = "ave"
description = "验证目标浏览器是否受V8引擎无效读取漏洞影响，通过构造特制JavaScript触发崩溃以确认漏洞存在"
id = "POC-AVE-2011-0192"
name = "CVE-2011-3057 PoC"
severity = "medium"
tags = ["ave-2011-0192"]
vuln_id = [
    "CVE-2011-3057",
    "AVE-2011-0192",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/test.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
