[basic]
description = "Sonatype Nexus Repository Manager 3.21.2 之前版本存在 Java EL 注入漏洞（CWE-917）。具有低权限的远程攻击者可通过向受影响组件的特定接口发送特制的 HTTP 请求，注入恶意的 Java 表达式语言（EL）脚本，从而在服务器端执行任意代码。该漏洞可导致目标系统被完全控制，造成机密性、完整性和可用性全面受损。攻击无需用户交互，利用复杂度低，已有公开的 Metasploit 利用模块及多种 PoC 脚本广泛流传。"
published = "2020-04-01T19:15:14.393"
remediation = "立即将 Sonatype Nexus Repository Manager 升级至 3.21.2 或更高版本。如无法立即升级，可在 nexus.properties 中添加 `nexus.scripts.allowCreation=false` 配置项禁用脚本创建功能作为临时缓解措施，同时限制对 Nexus 管理后台的访问来源 IP，仅允许可信网络段访问 8081 端口。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Sonatype Nexus Repository Manager Java表达式注入远程代码执行漏洞"
updated = "2026-06-17T02:47:28.890"

