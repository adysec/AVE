[basic]
description = """
I need to generate the description field based on the known information. The description is empty in the TOML currently (it shows the summary but the validator says description is empty - wait, it shows content. Interesting, but the validators say description is empty. Actually looking more carefully, the description field contains an English summary but it's marked as empty/short/needs Chinese.

My task: produce a Chinese description ≥50 chars covering principle, impact scope, attack conditions.

Let me write the Chinese description based on the Loofah SVG href info.

Pure TOML output requirement - but the task here says output only what's between <value></value>. Let me just output the value.<value>Loofah 的 HTML5 净化器（sanitizer）默认配置下仅对某些 SVG 元素的 `xlink:href` 属性限制为本地同文档引用，但根据 SVG 2 规范，浏览器同样接受普通 `href` 属性作为 `xlink:href` 的替代写法，而 Loofah 未对其施加同样的限制，导致这些元素可以引用任意外部文档。攻击者可通过提交包含恶意 `href` 的 SVG `<use>` 或 `feImage` 元素绕过净化限制：当引用的外部 SVG 为同源且包含脚本或危险内容时，脚本可在净化后的文档上下文中执行，造成 XSS 等危害，`feImage` 还可加载外部图像用于用户追踪。该漏洞影响使用 Loofah 默认白名单净化用户提交 SVG（或作为 HTML 一部分）的应用程序，CVSS 评分为 5，危害等级为中危。修复方式是升级至 2.25.2 及以上版本。该漏洞由维护者在安全审计中发现，攻击需用户环境满足对应属性解析条件，属于本地/客户端触发场景。</value>"""
