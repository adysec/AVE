[basic]
description = "mruby 编程语言实现（≤3.4.0）存在严重的 use-after-free 内存破坏漏洞，位于 src/array.c 文件的 sort_cmp 函数中。当本地攻击者以适当权限操作包含特殊数据结构的数组并触发排序函数时，漏洞允许访问已被释放的内存区域，导致堆 corruption 并可能实现远程代码执行。该漏洞允许攻击者利用不安全的内存管理破坏 mruby 相关应用的完整性。漏洞已被安全研究者公开披露，开发团队已发布关键安全修复补丁（commit eb398971bfb43c38db3e04528b68ac9a7ce509bc）以修复此问题。建议更新至包含此补丁的版本以防止潜在系统被攻破。"
published = "2025-11-13T16:15:51Z"
remediation = "直接应用 mruby 补丁 commit eb398971bfb43c38db3e04528b68ac9a7ce509bc 修复 sort_cmp use after free 漏洞，或升级到更高版本。关键步骤是使用 git apply 应用该补丁到您的 mruby 代码库中；如无法立即应用，可通过限制 mruby 脚本执行权限来缓解作为本地访问漏洞的风险"
score = 1.9
severity = "LOW"
sources = ["msrc"]
title = "mruby mruby 释放后使用漏洞"
updated = "2026-06-17T08:33:31Z"

