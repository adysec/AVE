[basic]
description = "Windows WLAN AutoConfig 服务存在信息泄露漏洞，源于服务在处理无线网络配置数据时未正确验证边界，导致越界读取内存（CWE-125）。本地攻击者利用低权限账户即可触发该漏洞，无需用户交互，可读取进程内存中的敏感信息（如凭据、会话令牌等）。该漏洞影响 Windows 10/11 及 Windows Server 2019/2022 等版本，CVSS 评分 5.5（中危），攻击向量为本地，机密性影响高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞，建议尽快应用补丁 KB5049981 以降低风险。"
published = "2025-01-14T18:15:43Z"
remediation = "立即安装 Windows 2025 年 1 月安全更新 KB5049981 以修复此信息泄漏漏洞。对于受影响的 Windows 10 版本 1607-22H2、Windows 11 版本 22H2-24H2 和 Windows Server 2016-2025 系统，请启用 Windows Update 自动更新。如无法立即打补丁，请禁用 WLAN AutoConfig 服务并限制无线网络访问权限作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "微软 Windows 信息披露漏洞"
updated = "2026-06-17T08:42:55Z"

