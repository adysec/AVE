[basic]
description = "SquirrelMail 1.2.7 及更早版本存在信息泄露漏洞，攻击者可通过向 options.php 脚本发送构造不当的 optpage 文件参数，触发服务器返回错误消息，从而获取该脚本的绝对路径。该漏洞无需身份认证即可利用，影响 SquirrelMail 1.2.7 及之前所有版本。攻击者利用此漏洞可获取服务器文件系统结构信息，为后续进一步攻击提供便利条件。CVSS 评分为 5.0，危害等级为中等。"
published = "2002-10-04T04:00:00Z"
remediation = "升级 SquirrelMail 至 1.2.8 或更高版本。如无法立即升级，建议在 php.ini 中将 display_errors 设置为 Off，通过禁用 Web 服务器的详细错误显示来防止绝对路径泄露。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "SquirrelMail SquirrelMail 绝对路径泄露漏洞"
updated = "2026-06-16T21:58:47Z"

