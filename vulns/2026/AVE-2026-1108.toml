[basic]
description = "该漏洞存在于cel-go库的NativeTypes和ParseStructTag功能中，由于JSON解析过程中对结构体标签的处理不当，导致标记为私有的JSON字段被错误地暴露出来。这可能导致敏感信息的泄露，攻击者无需身份验证即可远程访问原本应该隐藏的JSON字段。受影响的版本包括在cel-go库中使用NativeTypes和ParseStructTag处理JSON的应用程序。这种信息泄露漏洞可能被攻击者利用来收集服务器环境信息，为进一步攻击提供依据。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
