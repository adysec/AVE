[basic]
description = "Ghost CMS（Node.js 内容管理系统）在 v6.0.9 至 v6.21.0 版本中存在服务端请求伪造（SSRF）漏洞。其出站 HTTP 请求的私有 IP 地址检查机制可通过 DNS 重绑定攻击被绕过，导致未经身份认证的远程攻击者能够通过 Ghost 的 oEmbed、webmentions、recommendations 等触发外部获取请求的功能，强制 Ghost 服务器向内部网络中的主机发起请求。该漏洞影响自托管及 Ghost-CLI 安装方式的所有受影响的 Ghost 实例，攻击者可借此探测或访问内网中的敏感服务（如云实例元数据 169.254.169.254、内部 API 等）。Ghost 官方已在 v6.21.1 中发布修复补丁，用户应立即升级。临时缓解措施包括在网络层配置出站防火墙规则，阻止 Ghost 进程向 RFC1918 内网地址、回环地址及链路本地地址发起连接，并关闭触发外部获取请求的功能以减少攻击面。"
published = "2026-06-24T19:17:12.090"
remediation = "立即将 Ghost 升级至 v6.21.1 或更高版本。Docker 部署用户可从 Docker Hub 拉取官方最新镜像并重新部署容器；Ghost-CLI 部署用户运行 `ghost update` 命令完成升级。如暂时无法升级，应在防火墙层面配置出站规则，阻止 Ghost 进程连接 RFC1918 内网地址、回环地址、链路本地地址（含 169.254.169.254）及其他内部网段，同时禁用 oEmbed、webmentions 和 recommendations 等触发外部请求的功能以减小攻击面。"
score = 4
severity = "MEDIUM"
sources = ["ghsa"]
title = "Ghost CMS DNS重绑定服务端请求伪造漏洞"
updated = "2026-06-25T16:16:39.120"

