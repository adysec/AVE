[basic]
description = "Adobe Flash Player 存在安全绕过漏洞，攻击者通过构造特制的 Flash 内容诱导用户访问，可利用未指定的向量绕过安全访问限制，进而实现远程代码执行。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上的 Flash Player 10.3.183.15 之前版本和 11.1.102.62 之前版本，CVSS 评分 9.3，危害严重。攻击无需用户认证，仅需用户交互（如点击恶意链接或打开恶意文件）即可触发。"
published = "2012-02-16T19:55:01.240"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.15 及以上版本（10.x 分支）或 11.1.102.62 及以上版本（11.x 分支）；Android 2.x/3.x 升级至 11.1.111.6，Android 4.x 升级至 11.1.115.6。如无法升级，可在浏览器中禁用 Flash 插件或使用 Chrome 内置 Flash 沙箱机制缓解风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 安全绕过漏洞"
updated = "2026-06-16T23:38:11.940"

