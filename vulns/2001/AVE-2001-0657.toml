[basic]
description = "GoodTech FTP Server 3.0.1.2.1.0 及更早版本存在拒绝服务漏洞，攻击者无需身份认证即可通过网络向目标 FTP 服务发起大量并发连接请求，服务器在处理海量连接时资源耗尽导致崩溃。该漏洞影响运行 GoodTech FTP Server 的各类服务器系统，攻击者利用脚本工具持续建立连接即可触发服务中断，造成合法用户无法正常访问 FTP 服务，影响业务可用性。"
published = "2001-03-26T05:00:00.000"
remediation = "升级至 GoodTech FTP Server 修复版本或更高版本，彻底消除连接洪水漏洞。若短期内无法升级，应在防火墙上对 FTP 端口（TCP 21）实施单 IP 最大并发连接数限制（如 iptables -A INPUT -p tcp --dport 21 -m connlimit --connlimit-above 3 -j REJECT），并在服务器端启用连接超时与空闲会话回收，降低被洪水攻击导致崩溃的风险。长期建议迁移至 ProFTPD、vsftpd 等持续维护的 FTP 服务。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "GoodTech FTP Server 连接洪泛拒绝服务漏洞"
updated = "2026-06-16T21:53:50.630"

