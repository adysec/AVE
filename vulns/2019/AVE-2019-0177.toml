[basic]
description = "YouPHPTube Encoder 插件的 getImage.php 接口存在命令注入漏洞，攻击者可通过构造恶意的 base64Url 参数在服务器上执行任意系统命令，无需身份认证即可利用该漏洞。该漏洞影响 YouPHPTube Encoder 2.3 版本，攻击者成功利用后可完全控制服务器。CVSS 评分 9.8，危害等级严重。"
published = "2019-10-25T18:15:11Z"
remediation = "立即将 YouPHPTube Encoder 从 2.3 升级至修复版本（2019 年 10 月 16 日后的最新提交，即 GitHub 上 commit 688b194 及之后版本）。如暂时无法升级，可手动编辑 objects/include_config.php，在文件顶部 $_GET['base64Url'] 处理前增加 filter_var(base64_decode($_GET['base64Url']), FILTER_VALIDATE_URL) 校验，对非法 URL 直接 exit 阻断，并在日志中记录攻击请求。如仍无法修复，建议在 Web 服务器层通过 rewrite 规则屏蔽对 /objects/getImage.php 的未授权访问，或临时禁用 YouPHPTube Encoder 插件作为缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "YouPHPTube Encoder 命令注入漏洞"
updated = "2026-06-17T02:37:10Z"

