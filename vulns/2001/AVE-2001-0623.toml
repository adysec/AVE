[basic]
description = "Symantec Veritas Backup 4.5 Linux 版 Backup Agent 服务存在拒绝服务漏洞。远程攻击者可在不与服务端进行任何数据交互的情况下直接建立 TCP 连接，导致 Backup Agent 进程挂起（hang），从而无法响应正常的备份请求，造成拒绝服务。该漏洞攻击条件简单，无需认证即可远程触发，影响 Veritas Backup 4.5 版本。"
published = "2001-03-12T05:00:00.000"
remediation = "升级到 Symantec Veritas Backup 4.5 最新补丁包或迁移至受支持的 Veritas Backup Exec 版本。如无法升级，在防火墙上限制对 Backup agent 端口（默认 10000/tcp）的访问，仅允许受信任的备份服务器 IP 连接，并配置 idle timeout 断开空连接。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Symantec Veritas Backup Agent 拒绝服务漏洞"
updated = "2026-06-16T21:53:40.120"

