[basic]
description = "Opera Web Browser 在打印预览功能中处理大型 HTML 表格时存在拒绝服务漏洞。攻击者可构造包含超大表格的恶意网页，诱骗用户访问并在该页面上触发打印预览操作，导致浏览器异常挂起、无法响应用户交互，造成可用性中断。该漏洞影响 11.50 版本之前的所有 Opera 浏览器，攻击复杂度中等，远程攻击者无需身份认证即可利用，但需要用户主动配合（如点击打印或预览）才能触发。"
published = "2011-07-01T10:55:02Z"
remediation = "立即将 Opera 浏览器升级至 11.50 或更高版本以修复该漏洞。如无法立即升级，可在地址栏输入 opera:config 进入高级设置，关闭 Print Preview 选项并禁用 JavaScript 执行作为临时缓解措施，同时避免访问不可信网站或点击可疑链接。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera 浏览器打印预览功能拒绝服务漏洞"
updated = "2026-06-16T23:31:40Z"

