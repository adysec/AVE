[basic]
description = "IBM Net.Data 7.0 的 db2www 软件包中 document.d2w CGI 程序存在服务器物理路径泄露漏洞。远程攻击者无需进行身份认证，仅需向该 CGI 程序发送一个包含不存在命令参数的 HTTP 请求，程序在处理非法请求时会将服务器的完整物理磁盘路径信息直接返回给攻击者。该漏洞影响所有部署 IBM Net.Data 7.0 的 Web 服务器环境，攻击条件极为简单，CVSS 评分 5.0，危害等级中等。虽然该漏洞本身不直接导致代码执行或权限提升，但泄露的服务器物理路径可被攻击者用于后续渗透攻击，例如配合目录遍历、文件包含或路径猜测等手段，进一步扩大攻击面，对服务器安全构成潜在威胁。"
published = "2001-01-09T05:00:00.000"
remediation = "建议删除或禁用 db2www 包中的 document.d2w CGI 程序，该产品已被 IBM 停止维护。如必须使用，应在 Web 服务器层面限制对 /cgi-bin/db2www/ 目录的访问（Apache 配置 Order Deny,Allow / IIS 配置 IP 限制），并配置自定义错误页面以隐藏物理路径信息。长期方案是迁移到 IBM Data Studio 或其他受支持的 IBM 数据访问技术。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "IBM Net.Data 7.0 完整路径泄露漏洞"
updated = "2026-06-16T21:53:10.103"

