[basic]
description = "Guzzle 内置 CookieJar 存在拒绝服务漏洞。其内置 CookieJar 对单个响应中的 Set-Cookie 头字段数量及字段大小均无限制，当后续请求匹配到存储的 Cookie 时，会将所有匹配项合并为一个 Cookie 头发出，既未限制 Cookie 数量也未限制头总长度。攻击者控制的恶意或失陷服务器可返回大量超大 Cookie，导致 Guzzle 在内存中存储攻击者可写数据并将其复制到后续请求头中，从而增加内存占用和处理时间，甚至使生成的 Cookie 头超出处理程序、HTTP 实现、代理或目标服务器的限制而导致后续请求失败。此外，某子域主机设置的父域 Cookie 可能被同一 Jar 复用于另一子域，从而影响使用相同 Jar 的其他服务。该漏洞影响 Guzzle 所有启用内置 Cookie 支持、接收攻击者可控响应并复用 Cookie Jar 的应用。Guzzle 的内置处理器自行管理 Cookie 而未使用 libcurl 的原生 Cookie 引擎，因此 cURL 在 CVE-2022-32205 中的修复并不保护 Guzzle 的独立 Jar。该漏洞已在 7.15.1 及更高版本中得到修复，受影响版本为 7.15.1 之前的所有版本。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
