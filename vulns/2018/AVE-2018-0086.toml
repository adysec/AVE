[basic]
description = "Responsive FileManager 9.13.1 及之前版本的 upload.php 存在服务端请求伪造（SSRF）漏洞。攻击者无需身份认证即可通过 url 参数向任意内部或外部服务器发起 HTTP 请求，利用该漏洞可探测内网资产、读取云元数据接口（如 AWS 元数据服务），甚至结合其他漏洞实现远程代码执行。该漏洞影响广泛部署的 Responsive FileManager 插件，CVSS 评分 9.8，危害等级严重。目前已有公开 PoC 及自动化扫描模板。"
published = "2018-08-03T18:29:00Z"
remediation = "立即升级 Responsive FileManager 至 9.13.2 或更高版本，该版本在 upload.php 中增加了对 url 参数的校验，禁止访问内网地址和 file:///gopher:// 等非 HTTP(S) 协议。如无法升级，在 upload.php 中删除或注释对 url 参数的处理逻辑，并在 Web 应用防火墙（WAF）层面添加规则拦截包含 file://、gopher://、169.254.169.254 等内网地址的请求。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Responsive FileManager 服务器端请求伪造漏洞"
updated = "2026-06-17T01:41:31Z"

