[basic]
description = "CloudBees Jenkins 在 1.638 之前的版本以及 LTS 1.625.2 之前的版本中，Fingerprints 页面存在信息泄露漏洞。未经身份认证的远程攻击者可通过直接发送 HTTP 请求访问该页面，获取敏感的作业（Job）和构建（Build）名称信息。该漏洞影响所有使用受影响版本 Jenkins 的系统，攻击条件宽松，无需认证即可利用。CVSS 评分为 7.5，危害等级为 HIGH。Jenkins 官方已在后续版本中修复此问题，建议用户升级至 Jenkins 1.638 或 LTS 1.625.2 及以上版本。"
published = "2015-11-25T20:59:07Z"
remediation = "立即将 Jenkins 升级至 1.638 或更高版本，或将 Jenkins LTS 升级至 1.625.2 或更高版本以修复信息泄露漏洞。如无法立即升级，可通过 Jenkins 反向代理或防火墙规则限制对 /fingerprints/ 路径的未授权外部访问，仅允许可信 IP 范围访问该端点作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "CloudBees Jenkins 信息泄露漏洞"
updated = "2026-06-17T00:28:55Z"

