[basic]
description = "PhotoAlbum 0.9.9 之前版本中的 getalbum.php 存在路径遍历漏洞，远程攻击者可通过向目标发送包含 `..` 的特殊构造请求，绕过目录限制读取服务器上的任意文件。该漏洞源于对用户输入的文件路径参数缺乏充分的过滤和校验，攻击者无需身份认证即可利用，可能导致敏感信息泄露（如配置文件、数据库凭证等）。"
published = "2000-12-19T05:00:00.000"
remediation = '立即将 PhotoAlbum 升级至 0.9.9 或更高版本，该版本已修复 getalbum.php 中路径遍历漏洞。如无法升级，在 Web 服务器层（如 Apache mod_rewrite 或 Nginx）添加规则，拦截包含 `../` 或 `..\\` 的请求参数，并对 `file` 参数做白名单校验，仅允许读取指定目录下的文件。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "PhotoAlbum getalbum.php 任意文件读取漏洞"
updated = "2026-06-16T21:52:43.583"

