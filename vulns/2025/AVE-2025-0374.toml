[basic]
description = "QNAP NAS 操作系统（QTS 5.2.x、QuTS hero h5.2.x 及 h5.3.x）中存在命令参数分隔符不当 neutralization 漏洞（CWE-88）。攻击者通过向受影响设备发送精心构造的 SMB 域名（domain_name）参数，利用该参数在系统调用前缺乏有效验证的缺陷，可注入恶意命令分隔符从而篡改系统执行逻辑。远程未经身份认证的攻击者（网络邻近即可触发）可利用此漏洞绕过身份验证或获取未授权访问权限，影响用户数据与系统安全。该漏洞源于 Pwn2Own 2025 赛事，由 DEVCORE 研究团队发现并报告，QNAP 已在 2025 年 10 月发布的安全更新（QTS 5.2.7.3297、QuTS hero h5.2.7.3297 及 h5.3.1.3292 构建版本）中修复此漏洞。"
published = "2025-12-16T03:15:58Z"
remediation = "立即将 QNAP NAS 操作系统升级至已修复版本：QTS 升级至 5.2.7.3297 build 20251024 或更高版本，QuTS hero 升级至 h5.2.7.3297 build 20251024 或 h5.3.1.3292 build 20251024 或更高版本。操作步骤：登录 QNAP 设备 Web 管理界面，进入「控制台」→「系统」→「固件更新」，点击「在线更新」检查并安装最新固件。如暂无法升级，建议通过 QuFirewall 或外部防火墙限制对 NAS 管理端口（默认 8080/8443）的访问来源，仅允许可信 IP 段连接，降低被远程利用的风险。"
score = 6.6
severity = "MEDIUM"
sources = ["zdi"]
title = "QNAP QTS/QuTS hero 命令参数分隔符注入漏洞"
updated = "2026-06-17T09:52:31Z"

