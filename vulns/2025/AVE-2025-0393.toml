[basic]
description = "Google Chrome 的 V8 JavaScript 引擎存在释放后使用（Use After Free）漏洞，CWE-416。远程攻击者可通过构造特制的 HTML 页面诱导用户访问，触发 V8 引擎对已释放内存的非法访问，导致堆破坏，进而可能造成信息泄露或任意代码执行。该漏洞影响 Chrome 133.0.6943.53 之前版本及基于 Chromium 的 Microsoft Edge 133.0.3065.51 之前版本，CVSS 评分 5.4，危害等级中危。攻击需用户交互（点击链接或访问恶意页面），无需身份认证。Google 和 Microsoft 已在 2025 年 2 月安全更新中修复。"
published = "2025-02-04T19:15:32Z"
remediation = "升级 Google Chrome 至 133.0.6943.53 及以上版本，或升级 Microsoft Edge (Chromium-based) 至 133.0.3065.51 及以上版本。无法立即升级时，可禁用 V8 JIT 编译（设置 --jitless 标志）作为临时缓解措施，但会影响 JavaScript 执行性能。"
score = 5.4
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome V8 释放后使用漏洞"
updated = "2026-06-17T08:26:29Z"

