[basic]
description = "Microsoft PowerPoint 2000 的文件加载器在解析机制中存在缓冲区溢出漏洞。攻击者需通过本地访问构造特制的 PowerPoint 文件，当用户在 PowerPoint 2000 中打开该文件时，可触发缓冲区溢出并执行任意系统命令。由于该漏洞需要本地访问权限且攻击复杂度较高，在实际利用中需要攻击者已具备一定本地访问能力。成功利用后，攻击者可在目标系统上执行任意代码，完全控制受影响系统。该漏洞影响 Microsoft PowerPoint 2000 版本，CVSS 评分为 6.2。"
published = "2001-02-12T05:00:00Z"
remediation = "建议立即安装 Microsoft 2001 年 1 月安全更新 MS01-002，PowerPoint 2000 升级至版本 9.0.4190，PowerPoint 97 需安装 Office 97 Service Release 2b 补丁。如无法立即打补丁，应避免打开来源不明的 PowerPoint 文件作为临时缓解措施。"
score = 6.2
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft PowerPoint 2000 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:28Z"

