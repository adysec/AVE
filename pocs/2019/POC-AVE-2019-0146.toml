[info]
author = "ave"
description = "验证目标路由器管理界面是否无需身份认证即可访问。攻击者通过直接访问管理页面路径，若返回200且包含登录表单或管理员配置信息，则确认存在认证缺失漏洞。"
id = "POC-AVE-2019-0146"
name = "CVE-2019-19822 PoC"
severity = "high"
tags = ["ave-2019-0146"]
vuln_id = [
    "CVE-2019-19822",
    "AVE-2019-0146",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/admin/"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "password",
    "admin",
    "login",
]
