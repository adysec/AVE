[basic]
description = "Network Associates Sniffer Agent 3.0.10 版本的登录机制存在资源处理缺陷。远程未经身份验证的攻击者可以通过向目标服务发送海量的登录请求，触发程序崩溃或耗尽系统资源，从而导致拒绝服务（DoS）攻击。该漏洞主要影响运行该版本 Agent 的系统，攻击者无需特权即可在网络可达的情况下通过简单的请求泛洪实现利用，导致服务不可用。"
published = "2001-01-09T05:00:00Z"
remediation = "建议立即停止使用 Network Associates Sniffer Agent 3.0.10 版本，升级至厂商发布的后续修复版本或迁移至现代网络分析工具。若必须运行，应在防火墙或 ACL 层面限制仅允许受信 IP 地址访问登录端口，以防止外部攻击者发送大量请求导致服务崩溃。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Network Associates Sniffer Agent 3.0.10 登录拒绝服务漏洞"
updated = "2026-06-16T21:53:17Z"

