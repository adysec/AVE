[info]
author = "AVE"
description = "检测 Oracle 8.0.6-9.0.1 中 dbsnmp 组件是否存在。该组件因未对 ORACLE_HOME 环境变量做边界检查，本地攻击者可通过设置超长环境变量触发栈缓冲区溢出，实现提权至 root。"
id = "POC-AVE-2001-0423"
name = "Oracle 8/9i DBSNMP ORACLE_HOME 缓冲区溢出 PoC"
severity = "medium"
tags = ["ave-2001-0423"]
vuln_id = [
    "CVE-2001-0941",
    "AVE-2001-0423",
]

[poc]
logic = "any"

[[poc.requests]]
path = "/usr/local/oracle/app/oracle/product/8.1.6/bin/dbsnmp"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = ".+"
type = "regex"

[[poc.requests]]
path = "/u01/app/oracle/product/8.1.6/bin/dbsnmp"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = ".+"
type = "regex"

[[poc.requests]]
path = "/opt/oracle/product/9.0.1/bin/dbsnmp"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = ".+"
type = "regex"
