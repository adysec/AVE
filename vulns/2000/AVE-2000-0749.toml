[basic]
description = 'Unify eWave ServletExec JSP/Java Servlet 引擎 3.0C 及更早版本存在拒绝服务漏洞。远程攻击者无需认证即可向目标服务器发送包含 "/servlet/" 字符串的恶意 URL 请求，当 ServletExec servlet 已在运行时，该请求会触发未处理的异常导致服务器进程崩溃，造成拒绝服务。攻击条件简单，无需特殊权限，影响服务器可用性。'
published = "2000-12-11T05:00:00Z"
remediation = '升级到 ServletExec 3.0E 或更高版本（下载地址 http://www.servletexec.com/downloads/）。如无法升级，可在 Web 服务器层面配置 URL 重写规则，拦截包含 "/servlet/ServletExec" 路径的请求，或限制对 /servlet/ 路径的访问权限以缓解拒绝服务攻击。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Unify eWave ServletExec 3.0c 拒绝服务漏洞"
updated = "2026-06-16T21:52:59Z"

