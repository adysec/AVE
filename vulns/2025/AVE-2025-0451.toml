[basic]
description = "Google Chrome（Chromium）141.0.7390.54之前版本的Media组件存在UI实现不当漏洞（CWE-451）。远程攻击者可通过构造特制的HTML页面，诱骗用户执行特定的UI手势交互，从而触发UI欺骗攻击，导致用户界面显示内容被篡改。成功利用该漏洞可导致机密性、完整性和可用性均受到低度影响。攻击者需要用户主动参与交互，降低了攻击门槛。Google已在Chrome 141.0.7390.54版本中修复此漏洞。"
published = "2025-11-06T22:15:38Z"
remediation = "立即将 Google Chrome 升级至 141.0.7390.54 及以上版本，基于 Chromium 的浏览器（如 Edge、Brave）需同步更新至对应版本。Fedora 43 用户执行 `sudo dnf update chromium` 升级至 141.0.7390.122。无法立即升级时，可配置组策略禁用自动播放媒体内容作为临时缓解措施。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome Media 组件不当实现导致用户界面欺骗漏洞"
updated = "2026-06-17T08:29:51Z"

