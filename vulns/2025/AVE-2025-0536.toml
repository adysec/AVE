[basic]
description = "PostgreSQL CREATE STATISTICS 命令存在授权检查缺失漏洞（CWE-862），未验证用户对目标 schema 的 CREATE 权限。表所有者可在任意 schema 下创建同名统计对象，导致拥有该 schema CREATE 权限的合法用户后续执行同名 CREATE STATISTICS 命令失败，造成拒绝服务。攻击条件为：攻击者需具备表所有者权限且网络可达 PostgreSQL 服务，攻击复杂度高（AC:H），需低权限（PR:L），无需用户交互（UI:N），仅影响可用性（A:L），CVSS 3.1 评分 3.1（LOW）。受影响版本：PostgreSQL 18.1、17.7、16.11、15.15、14.20、13.23 之前的所有版本。官方已在上述版本中修复，建议升级至修复版本。攻击方式为表所有者恶意创建同名统计对象占用名称，阻断正常用户创建操作，属拒绝服务类漏洞，危害等级低。"
published = "2025-11-13T13:15:45Z"
remediation = "建议立即升级 PostgreSQL 到以下修复版本之一：18.1 及以上、17.7 及以上、16.11 及以上、15.15 及以上、14.20 及以上、13.23 及以上。可通过包管理器升级：RHEL/CentOS 执行 `dnf update postgresql*`，Debian/Ubuntu 执行 `apt update && apt upgrade postgresql*`。若暂时无法升级，可临时收回非必要用户的 schema CREATE 权限：`REVOKE CREATE ON SCHEMA public FROM PUBLIC;` 并按需授权给特定用户。升级后需重启 PostgreSQL 服务使补丁生效。升级命令示例：`systemctl restart postgresql`（systemd 系统）或 `pg_ctl restart -D /var/lib/postgresql/data`。建议升级前备份数据库并测试应用兼容性。"
score = 3.1
severity = "LOW"
sources = ["msrc"]
title = "PostgreSQL CREATE STATISTICS 缺少架构 CREATE 权限检查导致拒绝服务漏洞"
updated = "2026-06-17T08:32:59Z"

