[basic]
description = "Slashcode 2.0 Alpha 之前版本的默认配置中存在硬编码管理员密码漏洞。远程攻击者无需任何身份认证即可利用该默认密码登录系统后台，获取 Slashcode 管理权限，进而可能执行任意命令或修改网站内容。该漏洞影响范围广泛，攻击复杂度低，CVSS 评分 7.5，危害等级高。建议用户升级至 2.0 Alpha 或更高版本以修复此问题。"
published = "2000-12-11T05:00:00.000"
remediation = "立即将 Slashcode 升级至 2.0 Alpha 或更高版本，该版本移除了默认管理密码。如无法升级，立即登录后台修改默认管理员密码为强密码（至少 12 位，含大小写字母、数字和特殊字符），并限制管理后台的访问 IP 范围。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Slashcode 默认管理密码漏洞"
updated = "2026-06-16T21:52:58.547"

