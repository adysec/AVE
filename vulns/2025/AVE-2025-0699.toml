[basic]
description = "Windows Telephony Service（电话服务）存在堆缓冲区溢出漏洞（CWE-122），远程攻击者可通过向目标系统发送特制的 TAPI 请求触发该漏洞。攻击者需诱导用户访问恶意服务器或执行特定操作（用户交互），成功利用后可实现远程代码执行，获取系统完全控制权（机密性、完整性、可用性均受高影响）。该漏洞影响多个 Windows 10/11 及 Windows Server 版本，CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复。"
published = "2025-01-14T18:15:38Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 KB5049984，可通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。对于无法立即打补丁的系统，建议限制对 TAPI（电话 API）服务的网络访问，并在防火墙层面阻止不必要的 RPC 流量作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:42:52Z"

