[info]
author = "ave"
description = "检测 Recourse ManTrap 1.6 蜜罐系统通过检查 /proc 目录列表中是否缺少 '..' 父目录项"
id = "POC-AVE-2000-1105"
name = "CVE-2000-1141 PoC"
severity = "low"
tags = ["ave-2000-1105"]
vuln_id = [
    "CVE-2000-1141",
    "AVE-2000-1105",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/proc"
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = [".."]
