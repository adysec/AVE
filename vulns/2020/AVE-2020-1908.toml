[basic]
description = "Trend Micro Apex One 2019 和 OfficeScan XG 中的迁移工具组件存在远程代码执行漏洞。该漏洞源于迁移工具在处理认证请求时的安全缺陷，未经充分身份验证的远程攻击者可通过构造恶意请求在受影响安装上执行任意代码。攻击者需要先获得低权限用户凭证才能发起利用尝试，成功利用后可完全控制目标系统，导致机密性、完整性和可用性均遭受严重影响。该漏洞影响 OfficeScan XG 12.0 及 Apex One 2019 14.0 版本，CVSS 评分为 8.8，危害等级为高。CISA 已将其列入已知被利用漏洞目录，Trend Micro 已发布安全更新修复此问题。"
published = "2020-03-18T01:15:11Z"
remediation = "立即升级到 Trend Micro 支持的最新版本：OfficeScan 12.0 升级到 12.4 或更高版本，Apex One 2019 升级到 14.0 或更高版本。下载并安装最新的安全补丁包，通过 Windows Update 或 Trend Micro 下载中心获取最新版本。如无法立即打补丁，请通过防火墙阻止迁移工具端口的网络访问，作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "趋势科技 Apex One 和 OfficeScan XG 迁移工具组件远程代码执行漏洞"
updated = "2026-06-17T03:26:25Z"

