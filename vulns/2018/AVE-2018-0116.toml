[basic]
description = "NCBI ToolBox 遗留版本（2.0.7 至 2.2.26）中的 viewcgi.c 组件存在目录遍历漏洞。未经身份认证的远程攻击者可通过向 nph-viewgif.cgi 脚本的查询字符串中注入特殊构造的路径序列（如 ../），绕过路径限制实现任意文件读取，导致敏感信息泄露，甚至可删除服务器上的任意文件。该漏洞攻击复杂度低，无需用户交互，CVSS 评分 9.1，危害等级严重。"
published = "2019-05-02T20:29:00Z"
remediation = "立即将 NCBI ToolBox 升级至 NCBI C++ Toolkit（最新稳定版，支持 C++20，可从 https://github.com/ncbi/ncbi-cxx-toolkit-public/releases 获取源码编译安装）。如无法升级，须从 Web 服务器中删除或禁用 nph-viewgif.cgi 脚本，或在 Web 服务器（Apache/Nginx）配置中对 nph-viewgif.cgi 路径添加访问控制规则，仅允许受信任 IP 访问，同时确保 viewcgi.c 相关 CGI 程序不暴露于公网。"
score = 9.1
severity = "CRITICAL"
sources = ["nuclei"]
title = "NCBI ToolBox 目录遍历漏洞"
updated = "2026-06-17T01:44:42Z"

