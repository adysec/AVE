[basic]
description = "WordPress 插件 enhanced-tooltipglossary 3.2.8 版本中存在反射型跨站脚本（Reflected XSS）漏洞，属于 CWE-79 类型。攻击者无需身份认证，通过构造包含恶意 JavaScript 代码的 URL 诱使用户点击，即可在用户浏览器中执行任意脚本，窃取 Cookie、会话令牌或重定向至恶意网站。该漏洞影响 WordPress enhanced-tooltipglossary 插件的 3.2.8 及更早版本，CVSS 评分 6.1，危害等级中危。建议用户升级至最新版本以修复此漏洞。"
published = "2016-10-10T20:59:07Z"
remediation = "立即将 CM Tooltip Glossary 插件升级至 4.3.8 及以上版本（推荐升级至最新版 4.5.5），在 WordPress 后台插件页面直接更新即可。如无法升级，可在 Web 应用防火墙（WAF）层面添加规则，对 `glossary_tooltip` 短码相关参数进行输入过滤和输出转义，拦截包含 `<script>` 等恶意标签的请求。同时建议对所有用户输入启用 WordPress 内置的 `esc_html()` 和 `esc_attr()` 转义函数。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress enhanced-tooltipglossary 插件反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:44Z"

