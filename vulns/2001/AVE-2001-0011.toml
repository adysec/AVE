[basic]
description = "Leif M. Wright simplestmail.cgi 1.0 版本存在远程命令执行漏洞，其 CGI 程序在处理 MyEmail 参数时未对用户输入进行充分验证和过滤，导致攻击者可通过注入 Shell 元字符（如分号、反引号、管道符等）在服务器上执行任意系统命令。该漏洞影响部署了该 CGI 脚本的所有 Web 服务器，CVSS 评分 10.0（满分），属于严重级别。攻击条件为：目标服务器运行该 CGI 程序且可通过网络访问，无需身份认证即可远程利用。利用方式为构造包含恶意 Shell 命令的 MyEmail 参数发送 HTTP 请求，服务器在处理邮件发送逻辑时会拼接并执行攻击者注入的命令，从而实现完全控制服务器。官方未发布补丁，建议停用该脚本或升级至安全的替代方案。"
published = "2001-02-12T05:00:00Z"
remediation = "建议立即停用或删除 simplestmail.cgi 1.0 脚本，改用经过安全审计的邮件发送程序（如 sendmail/postfix 配合 PHP mail() 或 Python smtplib）。若必须保留 CGI，需在代码中对 MyEmail 参数实施严格白名单校验（仅允许邮箱格式字符），并禁用 shell 调用函数（system/exec/popen），改用语言原生邮件库发送。同时在 WAF 层面拦截含反引号、分号、管道符、$() 等 Shell 元字符的请求。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Leif M. Wright simplestmail.cgi 远程命令执行漏洞"
updated = "2026-06-16T21:53:30Z"

