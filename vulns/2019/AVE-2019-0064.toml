[basic]
description = "D-Link Central WiFi Manager CWM-100 存在严重的代码注入与认证绕过漏洞。攻击者无需任何身份认证即可远程利用该漏洞，通过向目标设备的 /web/Lib/Action/IndexAction.class.php 发送特制的 Cookie 请求，在 username 字段中注入恶意 PHP 代码，同时使用空密码绕过认证机制，最终导致任意 PHP 代码执行。攻击者可借此完全控制受影响设备，窃取敏感信息或将其作为跳板发起进一步攻击。该漏洞影响 v1.03R0100_BETA6 之前的所有版本，CVSS 评分 9.8，危害等级严重。"
published = "2019-07-06T23:15:10Z"
remediation = "立即将 D-Link Central WiFi Manager CWM-100 升级至 v1.03R0100_BETA6 或更高版本。该版本已修复 Cookie eval 注入、SQL 注入及认证绕过问题。如无法立即升级，可在 Web 服务器或 WAF 层面添加规则，拦截对 /web/Lib/Action/IndexAction.class.php 和 /web/Public/Conn.php 的未授权访问请求，并过滤 Cookie 中 username 字段的特殊字符。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "D-Link Central WiFi Manager CWM-100 远程代码执行漏洞"
updated = "2026-06-17T02:16:39Z"

