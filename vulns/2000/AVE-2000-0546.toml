[basic]
description = "Sun Solaris AnswerBook2 1.4.2/1.4.3/1.4.4 版本中集成的 dwhttpd Web 服务器管理接口存在身份验证缺失漏洞。该管理接口在处理对后端 CGI 脚本的请求时未执行有效的身份认证检查，导致远程未经身份认证的攻击者可直接调用 admin CGI 脚本，从而在目标系统上添加任意管理员账户，完全接管 AnswerBook2 管理界面。攻击者无需任何凭证即可通过网络远程利用此漏洞，CVSS v2 评分 7.5，危害等级高。Sun 已发布安全公告（编号 00196）提供修复补丁。"
published = "2000-10-20"
remediation = "安装 Sun 于 2000 年 8 月发布的 AnswerBook2 安全补丁（参考 Sun 安全公告，补丁编号见 http://archives.neohapsis.com/archives/sun/2000-q3/0001.html），限制 dwhttpd 管理接口仅允许受信任 IP 访问。由于 Solaris AnswerBook2 已停止支持，建议迁移至替代文档系统，并在防火墙层面阻止对 AnswerBook2 服务端口（默认 8888）的未授权外部访问。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Sun AnswerBook2 管理接口访问漏洞"
updated = "2000-10-20"

