[basic]
description = "Apple WebKit/JavaScriptCore 引擎存在类型混淆漏洞（CWE-843），源于 JSPropertyNameEnumerator 在处理属性枚举时因状态管理不当导致越界读取。攻击者可通过构造恶意网页内容触发该漏洞，在用户访问恶意页面时实现任意代码执行。该漏洞影响 iOS 14.4 及更早版本、iPadOS 14.4 及更早版本、macOS Big Sur 11.2 及更早版本、tvOS 14.4 及更早版本、watchOS 7.3 及更早版本以及 Safari 14.0.3 及更早版本。CVSS 评分为 8.8（高危），攻击无需身份认证但需要用户交互（访问恶意页面）。Apple 已在 macOS Big Sur 11.2、iOS 14.4、iPadOS 14.4、Safari 14.0.3、tvOS 14.4 和 watchOS 7.3 中修复此漏洞。"
published = "2021-04-02T18:15:21.747"
remediation = "立即将设备升级至 iOS 14.4 / iPadOS 14.4、macOS Big Sur 11.2 或 Safari 14.0.3 及以上版本。macOS Catalina 用户需安装 Security Update 2021-001，Mojave 用户同理。在补丁部署前，可通过 Safari 浏览器设置中的「防止跨网站跟踪」功能临时降低攻击面，避免访问不可信网站。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Apple iOS iPadOS 类型混淆远程代码执行漏洞"
updated = "2026-06-17T03:32:33.900"

