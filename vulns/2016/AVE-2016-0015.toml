[basic]
description = "WordPress 反抄袭（anti-plagiarism）插件 3.60 版本存在反射型跨站脚本（XSS）漏洞，该漏洞源于程序未对用户输入进行充分的过滤与转义处理。未经身份认证的远程攻击者可通过构造特制的 URL 参数，诱使目标用户点击恶意链接，导致恶意 JavaScript 代码在用户浏览器中执行，从而窃取会话凭证、劫持用户会话或实施钓鱼攻击。攻击条件仅需用户交互（点击链接），无需任何认证，影响运行该插件的所有 WordPress 站点。"
published = "2016-10-10T20:59:03Z"
remediation = "立即停用并删除 WordPress 插件 anti-plagiarism 3.60 及所有更早版本，该插件已自 2010 年起关闭且不再维护。安装替代的原创检测插件（如 Plagiarism Checker 或 CopyDetect）。同时配置 Web 应用防火墙（WAF）规则拦截包含 `<script>` 等恶意标签的 URL 查询参数，作为纵深防御措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress anti-plagiarism 插件反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:43Z"

