[basic]
description = "RealNetworks RealServer 7 及更早版本存在信息泄露漏洞。远程攻击者无需身份认证即可通过访问 /admin/includes/ URL 获取 RealServer 内存中的敏感信息，可能包括配置数据、用户凭证等机密内容。该漏洞源于对管理接口目录访问控制不当，攻击者只需发送特制 HTTP 请求即可利用，CVSS 评分 5.0，危害等级中危。"
published = "2001-01-09T05:00:00.000"
remediation = "建议升级至 RealServer 7.0 以上版本（该版本已修复此漏洞）。如无法升级，在 Web 服务器或反向代理层配置访问控制规则，禁止外部 IP 访问 `/admin/includes/` 路径，仅允许受信任的管理 IP 访问管理后台目录。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Real Networks RealServer 内存内容泄露漏洞"
updated = "2026-06-16T21:53:19.747"

