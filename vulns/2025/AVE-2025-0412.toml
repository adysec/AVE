[basic]
description = "libcurl 在处理 HTTP 响应中的 gzip 压缩内容时，若使用 zlib 1.2.0.3 或更早版本，存在整数溢出漏洞。当 libcurl 通过 CURLOPT_ACCEPT_ENCODING 选项启用自动 gzip 解压缩功能时，攻击者可构造特制的压缩数据触发整数溢出，进而导致堆缓冲区溢出。远程攻击者无需身份认证即可利用此漏洞，可能导致信息泄露、数据篡改或服务拒绝。该漏洞影响广泛使用 libcurl 的应用程序和系统，包括 curl 命令行工具及各类集成 libcurl 的软件。用户应升级 curl/libcurl 至修复版本或更新 zlib 至 1.2.0.4 及以上版本以缓解风险。"
published = "2025-02-05T10:15:22Z"
remediation = "立即将 curl/libcurl 升级至 8.12.0 或更高版本（官方已在该版本中移除对 zlib < 1.2.0.4 的支持，直接阻断溢出路径）。如无法立即升级，可应用官方补丁（https://github.com/curl/curl/commit/76f83f0db23846e254d940ec7）后重新编译，或临时避免使用 CURLOPT_ACCEPT_ENCODING 选项禁用自动 gzip 解压，同时确保系统 zlib 版本不低于 1.2.0.4。"
score = 7.3
severity = "HIGH"
sources = ["msrc"]
title = "curl libcurl gzip 解压缩整数溢出漏洞"
updated = "2026-06-17T08:27:02Z"

