[basic]
description = "Linux CUPS（Common UNIX Printing System）1.1.6 之前版本存在缓冲区溢出漏洞。漏洞原理在于打印服务对输入数据长度校验不足，远程攻击者无需身份认证即可向网络可达的 CUPS 服务发送特制请求或数据，触发缓冲区溢出并可能执行任意代码。影响范围覆盖运行存在漏洞版本 CUPS 的 Linux 系统（如当时的 SuSE、Mandrake、Conectiva 等发行版），攻击条件为服务对外开放且攻击者可网络访问目标。CVSS 评分为 7.5（高危），可导致机密性、完整性与可用性受损。"
published = "2001-05-10T04:00:00Z"
remediation = "将 CUPS 升级至 1.1.6 或更高版本（如发行版提供的 cups 安全更新包）；无法立即升级时，在防火墙限制 631 端口仅允许受信内网访问，或临时停止 cupsd 服务并关闭对外打印共享。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Linux CUPS 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:56:03Z"

