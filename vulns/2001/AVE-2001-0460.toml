[basic]
description = "SnapStream PVS 1.2a 将用户密码以明文形式存储在 SSD.ini 配置文件中，远程攻击者可通过网络访问该文件直接获取明文密码，进而获得服务器特权访问权限。该漏洞攻击复杂度低，无需身份认证，且已有公开利用方法，影响 SnapStream PVS 1.2 及更早版本。"
published = "2001-07-26T04:00:00Z"
remediation = "立即将 SnapStream PVS 升级到 1.3 或更高版本（该版本已修复明文密码存储问题）。如无法升级，手动设置 SSD.ini 文件权限为仅管理员可读（Linux: chmod 600 SSD.ini；Windows: 右键属性→安全→删除 Everyone 和 Users 的读取权限），并确保该文件不在 Web 根目录下。同时将数据库连接方式改为 Windows 集成身份验证，避免在配置文件中存储任何凭据。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "SnapStream PVS 明文密码存储漏洞"
updated = "2026-06-16T21:55:36Z"

