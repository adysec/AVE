[basic]
description = "Linux 内核的 `create_elf_tables()` 函数存在整数溢出漏洞。当处理 ELF 二进制文件的辅助向量（auxiliary vectors）时，未正确验证参数数量，导致内核栈上的整数运算发生溢出。本地低权限用户通过访问 SUID 或具有特权的二进制程序，可触发该溢出，进而覆盖内核内存中的关键数据结构，实现权限提升至 root。该漏洞影响 Linux 内核 2.6.x、3.10.x 及 4.14.x 系列版本，CVSS 评分 7.8，危害等级高。Red Hat、Debian、CentOS 等主流发行版均受影响。"
published = "2018-09-25T21:29:00Z"
remediation = "立即安装 Red Hat 提供的 RHSA-2018:2748/RHSA-2018:2763/RHSA-2018:2846 等内核安全更新，或升级 Linux 内核至 4.14.55 及以上版本。Ubuntu 用户应安装 USN-3775-1/USN-3779-1 更新。如无法立即打补丁，可通过移除受影响系统上 SUID 二进制文件的执行权限作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Linux内核 create_elf_tables() 整数溢出本地权限提升漏洞"
updated = "2026-06-17T01:41:20Z"

