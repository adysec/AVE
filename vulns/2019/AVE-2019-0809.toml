[basic]
description = "CVE-2019-16920是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2019-09-27T12:15:10Z"
remediation = "受影响 D-Link 路由器型号（DIR-655、DIR-866L、DIR-652、DHP-1565、DIR-855L、DAP-1533、DIR-862L、DIR-615、DIR-835、DIR-825）已确认 EOL，D-Link 不再发布修复固件。建议立即停用并更换为仍在官方支持周期内的 D-Link 新型号路由器。临时缓解措施：在路由器管理界面关闭远程管理（Remote Management/WAN 口访问），限制 Web 管理界面仅允许内网 IP 访问；在边界防火墙或上游设备上配置 ACL，阻止外部网络对 80/443 端口的未授权访问；定期更换设备管理密码并启用 WPA2/WPA3 无线加密。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "D-Link DIR 系列路由器 PingTest 远程代码执行漏洞"
updated = "2026-06-17T02:22:57Z"

