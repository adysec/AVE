[basic]
description = "Adobe Flash Player 9.0.124.0 及更早版本存在跨站脚本漏洞，由于对 ActionScript 属性的解释存在宽松处理，远程攻击者可利用该漏洞通过构造特制的 Flash 内容或网页向用户浏览器注入任意 Web 脚本或 HTML 代码。攻击者无需身份认证即可在受害者浏览包含恶意内容的网页时触发漏洞，导致恶意脚本在用户浏览器上下文中执行，从而窃取用户敏感信息、劫持会话或进行其他恶意操作。该漏洞影响使用受影响版本 Flash Player 的所有 Windows 平台用户，CVSS v3 评分 4.3，危害等级为中等。Adobe 已在新版本中修复此问题，建议用户升级至最新版本以消除风险。"
published = "2008-11-10T14:12:55Z"
remediation = "根据Adobe官方安全公告APSB08-20，受影响的Adobe Flash Player 9.0.124.0及更早版本存在跨站脚本漏洞，攻击者可通过ActionScript属性进行XSS攻击。建议立即将Adobe Flash Player升级至10.0.12.36或更高版本，并确认浏览器中的Flash插件已更新至修复版本。如暂时无法升级补丁，可在浏览器中禁用Flash Player插件或配置浏览器阻止来自不受信任域的Flash内容作为临时缓解措施，直至完成版本升级。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Adobe Flash Player 跨站脚本漏洞"
updated = "2026-06-16T22:58:37Z"

