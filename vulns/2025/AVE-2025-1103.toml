[basic]
description = "Linux 内核 arm64 架构的 do_compat_alignment_fixup() 函数存在空指针解引用漏洞。该函数在处理 32 位兼容模式对齐异常时调用 do_alignment_t32_to_handler()，但该函数仅对特定指令进行修复，在处理 LDREX 等指令时会返回 NULL，而原代码未对此返回值进行判断，直接调用空指针导致内核崩溃并触发 panic。该漏洞影响运行 arm64 架构的 Linux 内核系统，具有本地低权限攻击条件的恶意用户可通过执行特制指令触发对齐异常，导致系统内核崩溃并拒绝服务，CVSS 评分为 5.5（中危）。Linux 内核社区已修复此问题。"
published = "2025-04-16T15:15:55Z"
remediation = "升级 Linux 内核至已修复版本：6.1.134、6.6.87、6.12.23、6.13.11 或 6.14.2 及以上。可通过发行版官方包管理器（如 apt upgrade linux-image、yum update kernel）或编译上游稳定版内核并应用补丁（https://git.kernel.org/stable/c/2df8ee605eb6806cd41c2095306db05206633a08）修复。若暂无法升级，可在受影响系统的 ARM64 架构上禁用 32 位兼容模式（通过内核启动参数或 sysctl 限制 COMPAT 系统调用），阻止触发 do_compat_alignment_fixup() 路径，作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 arm64 架构空指针引用拒绝服务漏洞"
updated = "2026-06-17T08:44:53Z"

