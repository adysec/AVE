[basic]
description = 'cmd5checkpw 0.21 及更早版本中存在 SMTP 认证处理缺陷，远程攻击者无需身份认证即可通过向 SMTP 服务发送包含未知用户名的 "SMTP AUTH" 命令，触发程序处理异常，导致服务崩溃拒绝服务。该漏洞影响 cmd5checkpw 0.20/0.21 版本，攻击复杂度低，且可能进一步导致信息泄露或权限提升。'
published = "2000-12-19T05:00:00Z"
remediation = "升级 cmd5checkpw 至 0.22 或更高版本，该版本修复了 SMTP AUTH 命令处理未知用户名时导致的崩溃问题。如无法升级，可在 SMTP 代理/防火墙层限制对 SMTP AUTH 命令的访问，或替换为其他更活跃维护的 SMTP 认证工具。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Krzysztof Dabrowski cmd5checkpw SMTP AUTH 命令拒绝服务漏洞"
updated = "2026-06-16T21:52:55Z"

