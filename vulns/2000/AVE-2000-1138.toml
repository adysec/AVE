[basic]
description = "Argosoft FRP Server 1.0 存在缓冲区溢出漏洞，远程未授权攻击者可向 FTP 服务发送超长字符串作为 USER 或 CWD 命令参数，触发栈缓冲区溢出导致拒绝服务，甚至可能实现任意代码执行。该漏洞影响 Argosoft FRP Server 1.0 版本，攻击无需身份认证，仅需网络可达 FTP 端口即可利用，CVSS 评分 7.5（高危），属于典型的远程代码执行风险。"
published = "2001-08-31T04:00:00Z"
remediation = "建议安装 Argosoft FRP 服务器的最新补丁（参考 http://www.mdma.za.net/fk/FK9.zip），或升级到支持安全修复的版本。如无法立即应用补丁，请在防火墙层面限制对 USER 和 CWD 命令的访问权限，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "阿戈夫特 FRP 服务器 1.0 缓冲区溢出导致拒绝服务漏洞"
updated = "2026-06-16T21:53:21Z"

