[basic]
description = "tags.<value>Windows 2000 终端服务的远程桌面协议（RDP）组件在处理特定畸形数据包时存在安全缺陷。未经身份认证的远程攻击者可通过向目标系统发送特制构造的恶意 RDP 数据包触发该漏洞，导致终端服务进程异常终止或系统拒绝服务。该漏洞影响运行 Windows 2000 的服务器及启用终端服务的客户端系统，攻击者无需事先获取系统凭据即可在远程发起攻击，利用门槛较低。受影响服务将在接收到畸形数据包后无法正常响应后续合法连接请求，造成合法用户无法正常使用远程桌面功能。Microsoft 已在后续安全更新中修复此问题。"
published = "2001-02-12T05:00:00Z"
remediation = "建议立即安装 Microsoft 安全公告 MS01-006 对应补丁（KB286132），或升级至 Windows 2000 Service Pack 2。补丁适用于 Windows 2000 Gold 和 Service Pack 1，可通过 Microsoft Download Center 或 Windows Update 获取。如无法立即打补丁，可在防火墙或路由器上限制 TCP 3389 端口的访问来源，仅允许可信 IP 连接到终端服务，以阻断远程恶意数据包到达 RDP 服务。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows 2000 远程桌面协议拒绝服务漏洞"
updated = "2026-06-16T21:53:29Z"

