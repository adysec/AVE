[basic]
description = "Linux 内核媒体子系统的 vimc（Virtual Media Controller）测试驱动中存在拒绝服务漏洞。当调用 vimc_streamer_pipeline_terminate() 终止媒体管线时，该函数会对已停止或未启动的实体（entity）错误地调用 .s_stream() 操作。v4l2-subdev 核心层的 call_s_stream() 函数包含检查机制，会检测对未启动子设备的 .s_stream() 调用并触发内核警告。攻击者需在本地系统拥有低权限访问权限，通过触发特定的媒体管线启动与终止序列，可导致内核产生警告信息，在高权限上下文下可能引发系统不稳定或拒绝服务。该漏洞影响包含 vimc 测试驱动的 Linux 内核版本，CVSS v3.1 评分为 5.5（中危）。"
published = "2025-04-16T15:15:55Z"
remediation = "建议升级 Linux 内核至 6.13 或更高版本（含该修复提交 36cef585e2a3），或应用稳定内核分支回港补丁：6.12.19+、6.11.11+、6.6.87+、6.1.126+、5.15.184+、5.10.239+、5.4.291+。Ubuntu 25.04 用户执行 `apt update && apt install linux-image-6.14.0-22-generic` 并重启；Debian 12 升级至 6.1.126+；RHEL 9 等待 RHSA 公告应用 kernel-5.14.0-503.el9+；如无法立即升级，可禁用 VIMC 测试驱动（`modprobe -r vimc && echo 'blacklist vimc' > /etc/modprobe.d/vimc.conf`）作为临时缓解。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 vimc 拒绝服务漏洞"
updated = "2026-06-17T08:44:52Z"

