[basic]
description = "Ipswitch IMail 6.0 Web服务存在拒绝服务漏洞。远程攻击者无需身份认证，通过发送大量包含超长Host头部的HTTP连接请求，可导致服务线程崩溃，从而使邮件服务无法正常响应合法用户请求。该漏洞影响Ipswitch IMail 6.0版本，CVSS评分5.0，危害等级中等。"
published = "2000-11-14T05:00:00.000"
remediation = "升级 Ipswitch IMail 至 6.01 或更高版本，该版本已修复长 Host 头导致线程崩溃的问题。如无法升级，可在 Web 服务前端部署反向代理（如 Nginx/HAProxy），配置限制单 IP 并发连接数（如 max_connections=10）并过滤超长 Host 头（超过 255 字符的请求直接拒绝），同时在防火墙层面限制对 IMail Web 服务端口（默认 8383）的访问来源。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Ipswitch IMail 6.0 Web Service 长Host头拒绝服务漏洞"
updated = "2026-06-16T21:52:32.720"

