[basic]
description = "Google Chrome 89.0.4389.72 之前的版本存在音频子系统的数据竞争漏洞。该漏洞源于 ScriptProcessorNode::process() 函数中，输入和输出共享缓冲区在音频线程与主线程之间并发访问时缺乏适当的同步锁机制。远程攻击者可通过构造包含恶意 JavaScript 代码的 HTML 页面，诱使目标用户访问该页面来触发此漏洞。在攻击过程中，攻击者利用 AudioContext、ScriptProcessorNode 等音频 API 使 inputBuffer 同时被音频线程和主线程访问，并在主线程中对共享缓冲区执行排序操作，从而导致越界写入和堆内存损坏。成功利用后，攻击者可能实现远程代码执行。Google 已于 2021 年 3 月发布安全更新修复此漏洞，受影响版本包括 Chrome 89.0.4389.69 及更早版本。此外，该漏洞同样影响了 WebKit 浏览器。"
published = "2021-03-09T18:15:16.297"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome 音频数据竞争远程代码执行漏洞"
updated = "2026-06-17T03:34:57.070"

