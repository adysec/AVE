[basic]
description = "Crestron AM-100/101、Barco wePresent、Extron ShareLink、Teq AV IT WIPS710、SHARP PN-L703WA、Optoma WPS-Pro、Blackbox HD WPS、InFocus LiteShow3/4 等多款路由器产品均存在命令注入漏洞。攻击者可远程匿名利用 file_transfer.cgi HTTP 端点的漏洞，在未授权情况下执行任意系统命令并获得 root 权限。此严重漏洞影响多个路由器厂商和版本，可能危及网络设备安全并导致系统被完全掌控。"
published = "2019-04-30T21:29:00Z"
remediation = "建议立即升级所有受影响设备至厂商最新固件：Barco WiPG-1600W 升级至 2.4.1.19 或更高版本，Crestron AM-100/AM-101、Extron ShareLink 200/250、Teq WIPS710、Sharp PN-L703WA、Optoma WPS-Pro、Blackbox HD WPS、InFocus LiteShow3/4 登录各官网下载并安装最新固件。若暂无法升级，请将设备管理接口隔离在受管 VLAN，防火墙仅允许受信 IP 访问 80/443 端口，并在 Web 服务器层面禁用 file_transfer.cgi 端点，禁止未授权访问。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Barco wePresent file_transfer.cgi 命令注入漏洞"
updated = "2026-06-17T02:35:52Z"

