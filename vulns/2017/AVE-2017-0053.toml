[basic]
description = "Ulterius 服务器 1.9.5.0 之前版本中的 RemoteTaskServer/WebServer/HttpServer.cs 文件的 Process 函数存在目录遍历漏洞。攻击者无需身份认证即可通过 HTTP 协议向目标服务器发送特制的包含路径遍历序列（如 ../）的请求，绕过路径限制访问服务器文件系统上的任意文件，导致敏感信息泄露。该漏洞影响 Ulterius 服务器所有低于 1.9.5.0 的版本，CVSS 评分 7.5，危害等级高危。官方已在 1.9.5.0 版本中修复此漏洞。"
published = "2017-11-13T21:29:00Z"
remediation = "立即升级 Ulterius 至 1.9.5.0 或更高版本，该版本已修复目录遍历漏洞。如无法立即升级，可在 Web 服务器前端部署反向代理，限制对 RemoteTaskServer 路径的访问，并禁用不必要的 HTTP 功能作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Ulterius Ulterius Server 目录遍历漏洞"
updated = "2026-06-17T01:09:57Z"

