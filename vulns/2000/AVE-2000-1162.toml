[basic]
description = "Oracle Internet Application Server（IAS）3.0.7及更早版本存在信息泄露漏洞。该漏洞源于系统默认配置中端口监听器与modplsql组件的安全设置不当，未经身份认证的远程攻击者可通过向目标服务器发送特制的HTTP请求来访问Database Access Descriptor（DAD）文件，从而获取数据库的特权信息。攻击者无需任何凭据即可在低复杂度条件下远程利用此漏洞，主要导致敏感数据泄露，但不会影响数据完整性或系统可用性。"
published = "2000-12-31T05:00:00Z"
remediation = "建议升级 Oracle Internet Application Server 至 3.0.8 或更高版本；修改 modplsql 配置文件（dads.conf/plsql.conf），移除或限制默认 DAD 访问权限，设置 PlsqlExclusionList 禁止敏感路径；在防火墙层面限制非受信 IP 访问 Oracle IAS 端口（默认 7777/7778），并禁用不必要的 PL/SQL 网关功能作为临时缓解措施。价值"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Oracle Internet Application Server 信息泄露漏洞"
updated = "2026-06-16T21:53:26Z"

