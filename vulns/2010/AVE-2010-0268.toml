[basic]
description = "RealNetworks RealPlayer 在处理 RealMedia 文件中的媒体属性头部（MDPR）时存在数组索引错误漏洞。由于程序未对畸形 MDPR 头中的索引值进行有效验证，远程攻击者可构造特制的 RealMedia 文件，通过诱导用户打开或网站自动播放触发该漏洞，导致数组越界访问，最终实现任意代码执行。该漏洞影响 RealPlayer 11.0 至 11.1、RealPlayer Enterprise 2.1.2、Mac RealPlayer 11.0 至 11.1、Linux RealPlayer 11.0.2.1744 及 HelixPlayer 1.0.6 等多个版本，CVSS 评分 9.3，危害严重。"
published = "2010-12-14T16:00:04Z"
remediation = "立即升级 RealPlayer 至 12.0.1.609 或更高版本。Windows 用户可通过 RealPlayer 内置更新功能或从官网下载最新版安装。Linux 用户（RHEL 4）应执行 `rpm -e HelixPlayer` 卸载 HelixPlayer 包，或通过 RHN 应用 RHSA-2010:0981 更新（该更新会移除 HelixPlayer）。如无法升级，建议在浏览器中禁用 RealPlayer 插件，并避免打开来源不明的 .rm/.ram 媒体文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer 数组索引错误远程代码执行漏洞"
updated = "2026-06-16T23:24:41Z"

