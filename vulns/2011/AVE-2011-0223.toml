[basic]
description = "Apple QuickTime 在处理特制 MP4 文件时存在未初始化内存访问漏洞。由于 QuickTime 在解析 MP4 编码文件时未能正确初始化内存位置，远程攻击者可向目标用户发送恶意构造的 MP4 文件，诱导用户打开后触发该漏洞，导致任意代码执行或应用程序崩溃。该漏洞影响 Mac OS X 10.7.3 之前版本及 QuickTime 7.7.2 之前版本，CVSS 评分 6.8，危害等级中危。用户需升级至 QuickTime 7.7.2 或更高版本以修复此问题。"
published = "2012-02-02T18:55:01Z"
remediation = "升级 Apple QuickTime 至 7.7.2 或更高版本（Mac OS X 10.7.3 及以上系统已包含修复版本），可通过 Apple 软件更新功能或从 Apple 官网下载安装。如无法立即升级，建议不要打开来源不明的 MP4 文件，并在浏览器中禁用 QuickTime 插件作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple QuickTime MP4文件解析未初始化内存访问漏洞"
updated = "2026-06-16T23:33:19Z"

