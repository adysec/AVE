[basic]
description = "Microsoft Internet Explorer 5/6 存在 JavaScript 接口欺骗漏洞，攻击者可利用 `window.createPopup()` 方法创建无边框、无标题栏的色块窗口（chromeless window），模拟合法的系统对话框、登录框或安全警告等界面元素。由于缺少浏览器原生 UI 标识（如地址栏、状态栏、安全锁图标），用户难以辨别真伪，从而被诱导输入敏感信息（账号密码、信用卡号等）或执行非预期操作。该漏洞影响 IE 5、IE 6 及更早版本，属于客户端欺骗类漏洞，CVSS 评分 5.0（中危），攻击向量为网络、低复杂度、无需认证，主要造成机密性部分泄露。利用方式为构造恶意网页诱导受害者访问，结合社会工程学手段实施钓鱼攻击。"
published = "2003-08-18T04:00:00Z"
remediation = "建议立即停止使用 Internet Explorer 5/6 等已停止支持的浏览器，升级至 Microsoft Edge、Google Chrome、Mozilla Firefox 等现代浏览器最新版本。若因兼容性原因必须使用 IE，请在“Internet 选项”→“安全”→“自定义级别”中将“活动脚本”设为“禁用”或“提示”，并将受信任站点安全级别设为“高”，同时部署网络层面的 URL 过滤策略拦截可疑链接，防止钓鱼页面利用 window.createPopup() 进行欺骗攻击。Microsoft 已于 2016 年 1 月停止对 IE 8/9/10 的安全更新，建议通过 Windows Update 升级至受支持的 Windows 10/11 并使用 Edge 浏览器。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer 5/6 JavaScript 接口欺骗漏洞"
updated = "2026-06-16T21:56:13Z"

