[basic]
description = "HP Intelligent Management Center（IMC）5.0 E0101L02之前版本的img.exe组件中存在基于栈的缓冲区溢出漏洞。远程攻击者无需身份认证，通过向目标系统发送特制的包含恶意长度字段的数据包即可触发该漏洞，导致缓冲区溢出，进而实现远程代码执行，可完全控制受影响系统。该漏洞CVSS评分10.0，危害等级严重，攻击复杂度低。"
published = "2011-05-13T17:05:44Z"
remediation = "立即将 HP Intelligent Management Center 升级至 5.0 E0101L02 或更高版本。如无法立即升级，在防火墙上限制对 IMC 服务器 5099 端口（img.exe 默认监听端口）的访问，仅允许受信任的管理 IP 连接，并禁用不必要的 IMC 子服务以缩小攻击面。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "HP Intelligent Management Center img.exe 栈缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T23:30:14Z"

