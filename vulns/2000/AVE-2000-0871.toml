[basic]
description = "tags.<value>GoodTech FTP Server 3.0/3.0.1 存在拒绝服务漏洞，远程攻击者可通过向目标 FTP 服务器发送大量 RNTO（重命名）命令，消耗服务器资源导致服务崩溃或不可用。该漏洞无需身份认证即可利用，影响运行 GoodTech FTP Server 3.0 和 3.0.1 版本的系统，攻击者只需通过标准 FTP 客户端连接并循环发送恶意 RNTO 请求即可触发拒绝服务。CVSS 评分为 5.0，危害等级为中等。"
published = "2000-10-20T04:00:00Z"
remediation = "升级到 GoodTech FTP Server 3.0.2 或更高版本，该版本已修复 RNTO 命令拒绝服务漏洞。若无法升级，可在 FTP 服务器前端部署网络层防护，限制单个 IP 的并发连接数和 RNTO 命令请求频率，或在防火墙上屏蔽异常大量的 RNTO 流量；同时降低 FTP 服务的最大并发会话数，设置连接超时以自动断开异常连接，从而缓解拒绝服务攻击的影响。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "GoodTech FTP Server 3.0/3.0.1 RNTO命令拒绝服务漏洞"
updated = "2026-06-16T21:52:20Z"

