[basic]
description = "Linux内核网络子系统的ARP协议实现存在释放后使用漏洞，arp_xmit()函数可在未持有RTNL锁或RCU保护的情况下被调用，导致对象被释放后仍被访问。攻击者需位于目标主机同一网络段，在高竞争窗口内发送特制ARP报文触发漏洞。该漏洞影响未打补丁的Linux内核版本，无需身份认证即可远程利用，成功利用可导致系统崩溃、权限提升或信息泄露，对机密性、完整性和可用性均产生严重影响。"
published = "2025-02-27T03:15:16.857"
remediation = "升级 Linux 内核至以下对应分支的修复版本：5.4.x 用户升级至 5.4.291，5.10.x 用户升级至 5.10.235，5.15.x 用户升级至 5.15.179，6.1.x 用户升级至 6.1.129，6.6.x 用户升级至 6.6.79，6.12.x 用户升级至 6.12.16。或通过各发行版的安全更新机制（如 apt upgrade、yum update、dnf update）安装最新内核安全补丁。如暂时无法升级，可通过 sysctl 设置 net.ipv4.conf.all.arp_ignore=1 和 net.ipv4.conf.all.arp_announce=2 限制 ARP 报文处理，作为临时缓解措施，降低本地网络中被利用的风险。"
score = 8.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 ARP 释放后使用漏洞"
updated = "2026-07-30T06:21:29.140"

