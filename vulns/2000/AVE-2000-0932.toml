[basic]
description = "imwheel 工具包中的 imwheel-solo 程序存在符号链接攻击漏洞。该程序在处理用户主目录下的 .imwheelrc 配置文件时，未对符号链接进行安全校验，本地攻击者可在该文件中预创建指向任意系统文件的符号链接，诱使 imwheel-solo 按当前运行用户权限对其写入或覆盖，从而修改任意文件内容。该漏洞影响安装 imwheel 软件包的本地系统，攻击者需具备本地访问权限并诱导目标用户或特权进程触发程序执行，属于典型的本地符号链接竞争类漏洞，CVSS 评分为 2.1，危害等级较低。"
published = "2001-08-31T04:00:00Z"
remediation = "建议升级 imwheel 到修复符号链接跟随问题的后续版本（1.0 及以后），并收紧本地权限配置：对 ~/.imwheelrc 设置 `chmod 600 ~/.imwheelrc`、`chmod 700 ~` 限制属主读写，避免使用符号链接指向该文件；切勿以 root 身份运行 imwheel-solo，改以普通用户执行；同时将配置文件从 /tmp 等共享可写目录移出，并定期检查相关目录内是否存在指向敏感文件的符号链接。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "imwheel imwheel-solo 符号链接攻击任意文件修改漏洞"
updated = "2026-06-16T21:53:20Z"

