[info]
author = "ave"
description = "OpenBB 1.0.0 codeparse.php 跨站脚本检测，利用IMG标签中的JavaScript执行代码"
id = "POC-AVE-2002-0330"
name = "CVE-2002-0330 Cross-Site Scripting PoC"
severity = "high"
tags = ["ave-2002-0269"]
vuln_id = [
    "CVE-2002-0330",
    "AVE-2002-0330",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/codeparse.php"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<script>",
    "javascript:",
    "IMG",
    "codeparse.php",
]
