[basic]
description = "Citrix SD-WAN 10.2.3之前版本及NetScaler SD-WAN 10.0.8之前版本存在目录遍历漏洞（CWE-22）。未经身份认证的远程攻击者无需用户交互即可通过向受影响设备的管理接口发送特制的HTTP请求，利用路径遍历序列（如../）绕过访问限制，读取服务器上的任意敏感文件（如配置文件、系统凭证等），进而可能导致完全控制目标设备。该漏洞CVSS评分9.8，危害等级严重，影响范围包括Citrix SD-WAN 10.2.x及NetScaler SD-WAN 10.0.x系列版本。"
published = "2019-07-16T18:15:13.023"
remediation = "立即将 Citrix SD-WAN 升级到 10.2.3 或更高版本，将 NetScaler SD-WAN 升级到 10.0.8 或更高版本。补丁详情参见 Citrix 安全公告 CTX251987。如无法立即升级，可在 WAF/IPS 层面配置规则拦截对 /Collector/appliancesettings/applianceSettingsFileTransfer 路径的异常请求，并限制 www-data 用户对 webroot 目录的写入权限作为临时缓解。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Citrix SD-WAN 和 NetScaler SD-WAN 目录遍历漏洞"
updated = "2026-06-17T02:15:52.317"

