[basic]
description = "Mozilla Network Security Services (NSS) 的 QuickDER 解码器中的 ASN.1 解码器在处理零长度项时存在缺陷，远程攻击者可通过构造特制的零长度基本约束或零长度 OCSP 响应字段触发该漏洞，导致应用程序崩溃，造成拒绝服务。该漏洞影响 Firefox 4.x 至 12.0、Firefox ESR 10.0.5 之前版本、Thunderbird 5.0 至 12.0、Thunderbird ESR 10.0.5 之前版本及 SeaMonkey 2.10 之前版本，攻击者无需身份认证即可远程利用，危害等级中危。"
published = "2012-06-05T23:55:01Z"
remediation = "升级 Mozilla NSS 至 3.13.4 或更高版本。对应产品：Firefox 升级至 13.0 及以上、Firefox ESR 升级至 10.0.5 及以上、Thunderbird 升级至 13.0 及以上、Thunderbird ESR 升级至 10.0.5 及以上、SeaMonkey 升级至 2.10 及以上。如无法立即升级，可在网络边界部署 IPS/IDS 规则拦截包含异常 ASN.1 零长度字段的 OCSP 响应和证书，以降低被攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox/SeaMonkey/Thunderbird NSS ASN.1解码器拒绝服务漏洞"
updated = "2026-06-16T23:37:16Z"

