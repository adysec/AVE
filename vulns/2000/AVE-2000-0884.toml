[basic]
description = "Jeremy Arnold Worm Webserver 1.0 存在 URL 过长导致的拒绝服务漏洞，远程未认证攻击者可通过发送超长 URL 请求导致服务器资源耗尽或崩溃，造成拒绝服务。该漏洞影响 Worm Webserver 1.0 版本，攻击复杂度低、无需认证即可远程利用，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），主要影响可用性。攻击者只需发送超长 URL 即可触发拒绝服务，建议升级至修复版本或限制 URL 长度进行缓解。"
published = "2000-10-20T04:00:00Z"
remediation = "Jeremy Arnold Worm Webserver 1.0 存在 URL 拒绝服务漏洞，攻击者可通过发送过长 URL 导致服务器崩溃。建议立即升级到 Worm Webserver 2.0 或更高版本，并配置 URL 长度限制参数。此类服务不应运行在公网，直接从受信网络访问控制端口。使用小型协议栈或网络应用程序防火墙过滤超长URL请求，降低服务暴露风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Jeremy Arnold Worm Webserver 1.0 URL 拒绝服务漏洞"
updated = "2026-06-16T21:52:22Z"

