[basic]
description = "WordPress 的 sourceAFRICA 插件 0.1.3 版本中 js/window.php 文件存在跨站脚本漏洞，攻击者无需身份认证即可向该页面注入恶意 JavaScript 或 HTML 代码。当管理员或其他用户访问特制的 URL 时，注入的脚本会在浏览器中执行，可能导致会话劫持、敏感信息泄露或恶意操作。该漏洞利用方式简单，影响运行该插件的 WordPress 站点。"
published = "2015-09-12"
remediation = "该插件已于 2015 年 5 月 29 日从 WordPress 官方仓库下架关闭，不再提供更新。建议立即卸载 sourceAFRICA 插件 0.1.3 版本，并替换为其他功能替代插件。如必须继续使用，可在 Web 应用防火墙（WAF）层面添加规则过滤 wpbase 参数中的恶意脚本内容作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress sourceAFRICA Plugin 0.1.3 跨站脚本漏洞"
updated = "2015-09-12"

