[basic]
description = "Linux-PAM 的 pam_wheel 模块在 trust 选项启用且 use_uid 选项禁用的情况下，本地攻击者可通过操纵 getlogin() 函数返回伪造的用户名，进而伪造系统日志条目并提升自身权限。该漏洞影响 Linux-PAM 0.78 及更早版本，攻击者需拥有目标系统的本地访问权限，利用 pam_wheel 的信任机制绕过身份验证限制，实现未授权的特权提升。"
published = "2003-07-24T04:00:00Z"
remediation = "建议立即将 Linux-PAM 升级至 1.5.1 或更高版本。如暂时无法升级，可编辑 /etc/pam.d/su 配置文件，在 pam_wheel.so 配置行中添加 use_uid 选项，例如将 auth sufficient pam_wheel.so trust use_uid 改为 auth sufficient pam_wheel.so trust use_uid，强制 PAM 通过真实 UID 而非 getlogin() 返回值进行身份验证，从而消除利用条件。如业务允许，亦可临时移除 trust 选项，要求 wheel 组成员使用 su 时输入密码。同时建议检查系统日志中是否存在异常的 su 成功记录，排查是否已被利用。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux-PAM pam_wheel 模块 用户名伪造权限提升漏洞"
updated = "2026-06-16T22:02:06Z"

