[basic]
description = "Microsoft Exchange Server 存在反序列化远程代码执行漏洞（CWE-502），经过身份认证的普通用户可通过向 Exchange 服务器发送特制的恶意请求触发不安全反序列化，从而在 Exchange 控制面板（ECP）上下文中执行任意代码。该漏洞影响 Microsoft Exchange Server 2010/2013/2016/2019 等多个版本，攻击者需拥有有效 Exchange 凭据但无需管理员权限，利用复杂度较低。Microsoft 已在 2020 年 12 月安全更新中修复此漏洞。"
published = "2020-12-10T00:15:16Z"
remediation = "立即安装 Microsoft 2020 年 12 月安全更新（KB4588742），可通过 Microsoft Update Catalog 或 Windows Server Update Services (WSUS) 获取。对于 Exchange Server 2010 SP3，需升级至 Update Rollup 31 及以上版本。如无法立即打补丁，建议限制 Exchange 服务器的网络访问权限，仅允许受信 IP 连接，并启用 Exchange 反序列化白名单机制作为临时缓解措施。"
score = 8.4
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Exchange 反序列化远程代码执行漏洞"
updated = "2026-06-17T02:58:45Z"

