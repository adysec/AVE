[basic]
description = "Google Chrome on Android 的 UI 组件存在堆缓冲区溢出漏洞（CWE-787/CWE-122），攻击者首先需要诱使用户访问特制的 HTML 页面以攻破渲染器进程，随后利用该漏洞实现沙箱逃逸，获取更高的系统权限。该漏洞影响 Chrome 86.0.4240.185 之前版本，CVSS 评分 9.6，危害等级严重，且已被发现在野利用。Google 已在 Chrome 86.0.4240.185 版本中修复此漏洞。"
published = "2020-11-03T03:15:15.603"
remediation = "立即将 Google Chrome for Android 升级至 86.0.4240.185 或更高版本，可通过 Google Play Store 检查并安装更新。如无法立即升级，可在 Chrome 设置中禁用 JavaScript（设置 → 网站设置 → JavaScript → 关闭）作为临时缓解措施，但此操作会影响正常浏览功能，建议优先完成版本升级。"
score = 9.6
severity = "CRITICAL"
sources = ["kev"]
title = "Google Chrome on Android 堆缓冲区溢出漏洞"
updated = "2026-06-17T02:57:37.767"

