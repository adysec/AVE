[basic]
description = "Windows AppX 部署服务器（AppXSvc）在处理符号链接（junctions）时存在权限提升漏洞。由于该服务未能正确验证符号链接的目标路径，允许低权限攻击者在已获得系统执行权限后，通过创建恶意符号链接指向高权限可访问的文件或注册表项，从而将自身权限提升至 SYSTEM 级别。该漏洞影响所有受支持的 Windows 版本，攻击者需先获得目标系统的低权限代码执行能力方可利用。"
published = "2019-09-11T22:15:16Z"
remediation = "立即安装 Microsoft 2019 年 9 月安全更新（对应 KB4515384 及后续累积更新），可通过 Windows Update 自动获取。受影响版本包括 Windows 10 1703/1709/1803/1809/1903 及 Windows Server 1803/1903/2019。如无法立即打补丁，建议限制低权限用户本地登录，并监控 AppXSvc 对符号链接的异常操作行为。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows AppX Deployment Server 特权提升漏洞"
updated = "2026-06-17T02:28:14Z"

