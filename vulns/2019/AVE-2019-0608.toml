[basic]
description = "Windows Win32k 组件在内存中处理对象时存在释放后使用漏洞，已获得低权限的本地攻击者可通过在目标系统上运行特制的恶意应用程序触发该漏洞，利用 Win32k 内核模式驱动对内核对象的错误引用实现权限提升，从而获取 SYSTEM 权限并完全控制系统。该漏洞影响 Windows 7/8.1/10 及 Windows Server 2008/2012/2016/2019 等多个版本，已有公开的利用工具（代号 WizardOpium）和 PoC 代码，Google Project Zero 也发布了详细分析报告。Microsoft 已在 2019 年 12 月安全更新中修复此漏洞。"
published = "2019-12-10T22:15:16Z"
remediation = "立即安装 Microsoft 2019 年 12 月安全更新（Windows 10 对应 KB4530681/KB4530684，Windows 7 对应 KB4530692，Windows 8.1 对应 KB4530702，Windows Server 对应 KB4530691/KGB4530714 等），或通过 Windows Update 自动获取更新。如无法立即打补丁，可限制低权限用户登录系统作为临时缓解措施，同时监控异常的系统调用行为。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Win32k 特权提升漏洞"
updated = "2026-06-17T02:28:38Z"

