[basic]
description = "Windows XP 帮助与支持中心（Help and Support Center）的 HCP URI 处理程序存在设计缺陷，远程攻击者可通过构造特制的 hcp: 协议链接，诱导用户点击后触发 uplddrvinfo.htm 页面，导致目标系统任意文件被删除。该漏洞无需身份认证，攻击复杂度低，影响所有 Windows XP 版本。Microsoft 尚未发布官方补丁，建议用户禁用 HCP 协议处理或升级至更高版本操作系统。"
published = "2002-09-24T04:00:00.000"
remediation = '立即安装微软 MS02-060 安全更新（KB328940），该补丁修复了 HCP 协议处理程序对 uplddrvinfo.htm 的未授权文件删除问题。如无法安装补丁，可在注册表中删除 HKEY_CLASSES_ROOT\hcp 项以禁用 hcp: 协议处理，或通过组策略限制 HelpCtr.exe 的执行权限。由于 Windows XP 已停止支持，建议升级至受支持的操作系统版本（如 Windows 10/11）以获得持续安全更新。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Windows XP Help and Support Center HCP URI 处理程序任意文件删除漏洞"
updated = "2026-06-16T21:58:29.513"

