[basic]
description = "<value>XFree86 X11R6 3.3.3 版本中 startx 命令存在符号链接跟进缺陷。本地攻击者可在执行 startx 命令时，利用竞态条件，通过创建指向受限目录的符号链接，诱导系统将文件写入特定受限位置，从而可能提升权限或引发拒绝服务。该漏洞利用前提是攻击者需拥有本地有效账号并在符号链接创建与文件写入之间执行竞态攻击。攻击者可利用此漏洞修改系统文件、覆盖配置文件或耗尽磁盘空间等。CVSS 评分 4.6，危害等级中级，属于本地权限提升类漏洞。用户应升级至 XFree86 最新版本或应用官方补丁以避免受此漏洞影响。</arg_value></tool_call>"
published = "1999-03-21T05:00:00Z"
remediation = "立即升级 XFree86 3.3.3 到 3.3.4 或更高版本，该版本修复了多个安全问题包括 startx 脚本的 symlink 攻击漏洞。如无法立即升级，可在系统启动前执行以下缓解措施：删除并重建 /tmp/.X11-unix 目录并设置粘滞位权限（rm -rf /tmp/.X11-unix && mkdir -m 1777 /tmp/.X11-unix），确保普通用户无法通过该目录替换系统文件。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "XFree86 X11R6 startx 符号链接攻击漏洞"
updated = "2026-06-16T21:48:23Z"

