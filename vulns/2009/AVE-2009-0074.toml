[basic]
description = "Adobe Flash Player 和 Adobe AIR 存在权限提升漏洞，未经身份认证的远程攻击者可通过向目标系统发送或诱使用户访问特制 Flash 内容，利用应用程序内部权限管理机制缺陷实现权限提升并执行任意代码。该漏洞影响 Adobe Flash Player 9.0.246.0 之前版本及 10.x 10.0.32.18 之前版本，同时影响 Adobe AIR 1.5.2 之前版本，CVSS 评分 9.3，危害等级严重。攻击者可能通过恶意网页、电子邮件附件或在线广告中的 SWF 文件触发该漏洞，导致应用程序崩溃或获得与当前用户相同的系统权限执行任意代码，进而可能进一步控制整个目标系统。Adobe 已在后续版本中修复此漏洞，建议受影响用户立即升级至最新版本。"
published = "2009-07-31T19:30:00Z"
remediation = "Adobe Flash Player 升级至 9.0.246.0 或 10.0.32.18 及更高版本，Adobe AIR 升级至 1.5.2 及更高版本以修复此权限提升漏洞。如无法立即升级，可在浏览器中禁用 Flash Player 插件、启用点击播放（Click-to-Play）功能，并避免访问不可信网站作为临时缓解措施。同时建议安装 Adobe 安全公告 APSB09-10 对应的官方补丁。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player Adobe AIR 权限提升漏洞"
updated = "2026-06-16T23:08:13Z"

