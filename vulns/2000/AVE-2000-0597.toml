[basic]
description = "SGI IRIX 6.2及6.3版本中/usr/sbin/gr_osview工具存在缓冲区溢出漏洞。该工具在处理-D命令行选项时未对用户输入长度进行有效校验，本地攻击者可向-D选项传递超长字符串参数触发栈缓冲区溢出，覆盖函数返回地址，从而获取root权限。该漏洞利用需要本地系统访问权限，无需用户交互，CVSS评分7.2，危害等级高。"
published = "2000-10-20T04:00:00.000"
remediation = "立即安装 SGI 安全公告 20040104-01-P 中提供的补丁，或升级 IRIX 至 6.5 以上版本。如无法打补丁，可执行 `chmod u-s /usr/sbin/gr_osview` 移除该程序的 setuid 权限位，防止本地用户通过缓冲区溢出提权至 root。同时限制仅授权用户可本地登录系统。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "SGI IRIX gr_osview 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:52:30.063"

