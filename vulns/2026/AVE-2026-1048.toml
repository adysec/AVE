[basic]
description = 'Phoenix Contact CHARX SEC-3xxx 系列电动汽车充电控制器存在未限制文件上传漏洞（CWE-434）。具有"operator"权限的低权限远程攻击者可通过本意为固件更新的 REST 接口上传任意文件，导致攻击者控制的文件被持久化存储在设备上，并可能耗尽系统资源，最终引发拒绝服务。该漏洞影响 CHARX SEC-3xxx 系列设备，该产品专为封闭工业网络设计，通常部署在站点级防火墙后方。攻击者需要通过网络访问目标设备的 REST 固件更新服务，并已获得 operator 权限认证，无需额外用户交互即可利用。根据 CISA 评估，该漏洞暂无在野利用证据，技术影响程度为局部，且不可自动化利用。'
published = "2026-07-30T07:16:57.813"
remediation = "建议将 CHARX SEC-3000、SEC-3050、SEC-3100、SEC-3150 充电控制器固件升级至 1.9.1 或更高版本，该补丁计划于 2026 年 8 月 12 日前在 Phoenix Contact 官网产品页面发布。如暂时无法升级，应将这些设备部署在封闭工业网络中，并通过防火墙严格限制对 REST 固件更新端点的访问，仅允许受信任的管理员 IP 发起请求。"
score = 5.3
severity = "MEDIUM"
sources = ["zdi"]
title = "Phoenix Contact CHARX SEC-3150 任意文件上传漏洞"
updated = "2026-07-30T16:17:11.743"

