[basic]
description = "GnuPG (gpg) 1.0.3 在验证包含多个文档的签名文件时存在签名校验缺陷，仅对第一个文档进行完整性校验，而忽略了后续文档的签名验证。远程攻击者可在不破坏整体签名有效性的前提下，篡改多文档签名文件中除首个文档外的任意文档内容，导致受害者信任被篡改后的恶意数据。该漏洞攻击复杂度低，无需身份认证，可对机密性、完整性和可用性造成部分影响。"
published = "2000-12-19T05:00:00Z"
remediation = "建议升级 GnuPG 至 1.0.4 或更高版本，该版本修复了多文档签名验证不完整的问题。如无法升级，应避免直接信任 gpg 对多文档文件的签名结果，对每个文档单独验证签名后再使用。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "GNU Privacy Guard (GnuPG) 多文档签名验证绕过漏洞"
updated = "2026-06-16T21:52:53Z"

