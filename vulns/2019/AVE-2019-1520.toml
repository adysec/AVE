[basic]
description = "Linear eMerge E3系列门禁与建筑管理系统存在命令注入漏洞。该漏洞位于card_scan.php接口的ReaderNo参数处，未经身份认证的远程攻击者可通过在ReaderNo参数中插入反引号包裹的操作系统命令，向目标设备发送特制HTTP请求，将命令输出重定向至web目录下的test.txt文件并读取，从而在lighttpd用户权限下执行任意系统命令，并可进一步通过su提权获取root权限。该漏洞影响eMerge E3 1.00-06及以下版本设备，攻击者无需任何凭据即可远程利用，CVSS评分9.8，危害等级严重。"
published = "2019-07-02T19:15:11Z"
remediation = "立即将 Linear eMerge E3-Series 门禁控制器的固件升级至厂商发布的最新版本（参考 Nice E3-Bulletin-06-27-2023），Elite 与 Essential 型号均受影响，当前确认受影响版本为 1.00-06 及之前版本。升级前请从 Nortek Control/Nice 官方渠道获取固件。如暂无法立即升级，应将设备 Web 管理界面完全隔离于内网，禁止外网直接访问，远程管理必须通过 VPN 进行，并立即修改所有默认管理员密码及设备默认 IP 地址，同时限制可访问管理界面的源 IP，以降低被远程利用的风险。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Nortek Security & Control Linear eMerge E3-Series 命令注入漏洞"
updated = "2026-06-17T02:40:19Z"

