[basic]
description = "Netscape PublishingXpert 2.0/2.2/2.5 版本（SP2 之前）的 PSCOErrPage.htm 页面存在任意文件读取漏洞。攻击者可通过构造恶意的 errPagePath 参数，远程读取服务器上的任意文件内容。该漏洞无需身份认证即可利用，攻击复杂度低，CVSS 评分 5.0（中危），主要影响文件机密性。受影响版本包括 Netscape PublishingXpert 2.0、2.2 及 2.5 早期版本，升级至 SP2 或更高版本可修复该漏洞。"
published = "2001-08-31T04:00:00Z"
remediation = "升级到 Netscape PublishingXpert SP2 或更高版本以修复文件读取漏洞；禁用 errPagePath 参数；在配置文件中实施输入验证白名单，只允许预定义的安全参数；使用最小权限原则限制 Web 服务器用户读取文件系统的权限；部署 Web 应用防火墙过滤对 PSCOErrPage.htm 的异常请求；定期安全审计以发现类似的文件处理漏洞。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Netscape PublishingXpert 任意文件读取漏洞"
updated = "2026-06-16T21:53:21Z"

