[basic]
description = "Arm Mali GPU 内核驱动存在越界写入漏洞，未授权用户可获得对只读页面的读写访问权限，攻击者可利用该漏洞在内核上下文中执行任意代码，从而实现权限提升或造成内存损坏导致拒绝服务。该漏洞影响 Bifrost r0p0 至 r29p0、Valhall r19p0 至 r29p0 以及 Midgard r8p0 至 r30p0 版本的 GPU 驱动，攻击者只需以普通用户权限在目标设备上执行恶意应用程序即可触发利用，无需特殊权限。该漏洞 CVSS 评分为 8.8，危害等级为高。"
published = "2021-05-10T15:15:07Z"
remediation = "建议立即升级 Arm Mali GPU 内核驱动至修复版本：Bifrost 系列升级至 r30p0 或更高版本，Valhall 系列升级至 r30p0 或更高版本，Midgard 系列升级至 r31p0 或更高版本。通过设备厂商（如三星、小米、OPPO 等）发布的 Android 系统安全补丁（2021 年 6 月及以后的安全补丁级别）获取更新。若无法立即升级，可暂时限制非受信应用安装，并在 SELinux 强制模式下运行以减少攻击面。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Arm Mali GPU 内核驱动内存损坏漏洞"
updated = "2026-06-17T03:46:43Z"

