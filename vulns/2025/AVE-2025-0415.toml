[basic]
description = "Go 语言标准库 os 包中的 OpenFile 函数在处理 O_CREATE|O_EXCL 标志时存在符号链接处理不一致漏洞（CWE-59）。在 Unix 系统上，当目标路径为悬空符号链接时，OpenFile 不会跟随链接；而在 Windows 系统上，OpenFile 会跟随悬空符号链接并在链接指向的位置创建文件，导致文件创建行为绕过预期安全检查。本地攻击者可通过创建恶意符号链接，诱使高权限程序在非预期位置创建文件，造成完整性破坏。该漏洞影响 Go 语言所有版本，需本地低权限访问且用户无交互即可触发。"
published = "2025-06-11T18:15:24Z"
remediation = "升级 Go 至 1.24.4 或更高版本（Go 1.23 系列升级至 1.23.8+），该版本修复了 os.OpenFile 在 Unix 与 Windows 上对 O_CREATE|O_EXCL 与 dangling symlink 处理不一致的问题。如无法立即升级，应避免在涉及符号链接的场景中使用 O_CREATE|O_EXCL 组合标志，并确保应用程序以低权限用户运行以降低影响。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Go 标准库 os.OpenFile 符号链接处理不一致漏洞"
updated = "2026-06-17T08:27:21Z"

