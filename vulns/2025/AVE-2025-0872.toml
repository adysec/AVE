[basic]
description = "Windows 电话服务（Telephony Service，TapiSrv）存在堆缓冲区溢出漏洞（CWE-122），远程攻击者可通过向目标系统发送特制请求，在用户交互（如点击恶意链接或打开特制文件）的情况下触发该漏洞，导致远程代码执行。成功利用此漏洞的攻击者可获得目标系统的高权限访问能力，实现机密性、完整性和可用性的完全破坏。该漏洞影响 Windows 10 1507/1607/1809/21H2/22H2、Windows 11 23H2/24H2 及 Windows Server 等多个版本，CVSS 评分 8.8，危害等级高危。"
published = "2025-01-14T18:16:04.860"
remediation = "安装 Microsoft 2025 年 1 月安全更新（含 KB5049984），将受影响 Windows 系统升级至以下修复版本：Windows 10 21H2/22H2 升级至 10.0.19045.5371，Windows 11 22H2/23H2 升级至 10.0.22631.4751，Windows 11 24H2 升级至 10.0.26100.2894，Windows Server 2022 升级至 10.0.20348.3091。如无法立即安装补丁，可临时通过防火墙禁用 Telephony Service (TapiSrv) 对外连接作为缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:43:18.240"

