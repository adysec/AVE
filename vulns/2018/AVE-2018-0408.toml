[basic]
description = "Adobe ColdFusion 的 upload.cfm 接口存在未限制文件上传漏洞（CWE-434），远程未认证攻击者可通过 HTTP POST 请求直接向目标服务器上传任意类型的恶意文件（如 JSP Webshell），无需任何身份验证。成功利用该漏洞可导致攻击者在服务器上执行任意代码，完全控制受影响系统。该漏洞影响 Adobe ColdFusion 2018.0.0.310739 版本及更早的 Update 6、Update 14 版本，CVSS 评分 9.8，危害等级严重。Adobe 已在 2018 年 7 月安全更新中发布修复补丁。"
published = "2018-09-25T13:29:01.567"
remediation = "立即升级 Adobe ColdFusion 2018 至 2018.0.0.310739 及以上版本，ColdFusion 2016 升级至 Update 7 及以上版本，ColdFusion 11 升级至 Update 15 及以上版本。如无法立即升级，可在 Web 服务器层面配置访问控制规则，限制对 /cf_scripts/scripts/ajax/ckeditor/plugins/filemanager/upload.cfm 路径的匿名访问，或删除该目录下未使用的 CKEditor filemanager 组件。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Adobe ColdFusion upload.cfm 任意文件上传漏洞"
updated = "2026-06-17T01:43:25.060"

