[basic]
description = '24Link 1.06 Web 服务器存在安全绕过漏洞，未经身份认证的远程攻击者可通过在 HTTP GET 请求的资源路径前添加特殊字符串（如 "/+/" 或 "/."）等方式绕过访问控制限制，从而访问原本受保护的敏感资源。该漏洞影响运行 24Link 1.06 版本的 Web 服务器，攻击者无需任何凭据即可在网络上发起利用，造成部分信息泄露与未授权访问。攻击者只需向目标服务器发送精心构造的 HTTP 请求即可触发漏洞，利用条件简单且无需交互。厂商应尽快升级至安全版本或应用访问控制补丁以修复该问题。'
published = "2001-01-09T05:00:00.000"
remediation = '立即联系 24hours24 厂商获取 24Link 1.06 的补丁程序，或升级到已修复该访问控制绕过漏洞的更高版本。24Link 1.06 存在路径规范化缺陷，攻击者通过在 HTTP GET 请求前追加 "/+/" 或 "/." 等字符串即可绕过访问限制，升级后需重新配置访问控制规则并验证补丁生效。如厂商已停止支持且无法获取补丁，建议迁移至受支持的 Web 服务器（如 Nginx、Apache），并在前端反向代理或防火墙层统一拦截包含 "/+/"、"/." 等异常路径前缀的请求，作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "24link Web Server 访问控制绕过漏洞"
updated = "2026-06-16T21:53:11.143"

