[basic]
description = "Internet Explorer 5.0 至 5.5 版本中用于调用脚本小程序（Scriptlet）的 ActiveX 控件存在任意文件读取漏洞。当用户访问攻击者精心构造的恶意网页时，该控件会错误地将任意类型的文件内容渲染为 HTML 页面，而非仅处理预期的 HTML 文件，导致攻击者能够跨域读取目标系统上的任意文件内容。攻击条件要求用户使用受影响的 IE 浏览器访问恶意网站，且需诱使用户交互触发脚本执行。该漏洞可导致敏感信息泄露，影响 Windows 平台上 IE 5.0 至 5.5 版本。"
published = "2001-02-16T05:00:00Z"
remediation = '立即安装 Microsoft 安全公告 MS00-093 提供的补丁，该补丁随 IE 5.5 Service Pack 2 或 IE 5.01 Service Pack 2 发布。如无法升级，可在 IE 安全设置中将 Internet 区域脚本功能禁用，并将 ActiveX 控件中"对未标记为可安全执行脚本的 ActiveX 控件初始化并执行脚本"设为禁用。建议升级至更高版本 IE 或更换现代浏览器以彻底消除风险。'
score = 2.6
severity = "LOW"
sources = ["cve"]
title = "Microsoft Internet Explorer Scriptlet ActiveX 控件任意文件读取漏洞"
updated = "2026-06-16T21:53:38Z"

