[basic]
description = "易波 ServletExec 存在严重的权限许可漏洞，从 3.0C 版本开始，UploadServlet Java/JSP 核心服务完全没有访问控制。攻击者无需任何身份验证即可远程访问这个未保护的 Servlet，在服务器上上传任意恶意文件并执行任意系统命令。攻击条件非常宽松，只需要简单的网络连接就可以触发。该漏洞影响范围广泛，适用于所有旧版的 ServletExec 软件（≤3.0C）。由于上传的恶意文件可以在服务器操作系统上完全执行，因此攻击者完全可以获取服务器完全控制权，导致系统机密数据完全泄露、系统完整性破坏和可用性丧失等严重后果。漏洞根据 CVSSv3 评分标准计算，攻击向量为网络（N）、攻击复杂度为低（L）、需要用户交互（Au:N）、完整破坏了机密性（C）、完整破坏了完整性（I）和完整破坏了可用性（A），评分为 10.0，属于最高危等级。Microsoft 已经在 2024 年 8 月的重要安全补丁中修复了此问题，所有用户应尽快更新至最新版本以获取保护。"
published = "2000-12-11T05:00:00.000"
remediation = "升级至 ServletExec 3.0E 版本（修复版本），下载地址：http://www.servletexec.com/downloads/；若暂时无法升级，请在 Web 服务器或防火墙层面禁止访问 /servlet/com.unify.ewave.servletexec.UploadServlet 路径，或在 ServletExec 配置中注销/禁用 UploadServlet 类（com.unify.ewave.servletexec.UploadServlet），防止攻击者通过该 Servlet 上传恶意 JSP 文件执行任意命令。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "eWave ServletExec 文件上传漏洞"
updated = "2026-06-16T21:52:59.690"

