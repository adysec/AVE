[basic]
description = "Linux内核memstick子系统的rtsx_usb_ms驱动存在释放后使用漏洞。当USB设备断开时，rtsx_usb_ms_drv_remove函数会释放设备控制结构体内存，但内核工作队列中的rtsx_usb_ms_poll_card工作线程可能仍在并发访问该内存区域，导致释放后使用（Use After Free）。攻击者需具备本地低权限访问权限，无需用户交互即可在设备热插拔过程中触发该竞争条件，进而导致内核内存损坏、特权提升或系统崩溃拒绝服务。该漏洞主要影响启用Realtek USB存储卡读卡器驱动的Linux内核系统。"
published = "2025-04-16T11:15:42Z"
remediation = "建议立即将 Linux 内核升级至已修复版本：5.4.292、5.10.236、5.15.180、6.1.133、6.6.86、6.12.22、6.13.10 或 6.14.1 及以上。各发行版用户可通过系统包管理器安装对应安全更新：Debian/Ubuntu 执行 apt upgrade linux-image，RHEL/CentOS 执行 dnf update kernel，Arch Linux 执行 pacman -Syu linux。如暂时无法升级内核，可通过 modprobe -r rtsx_usb_ms 卸载该驱动模块作为临时缓解措施，但可能导致使用 Realtek USB 读卡器的设备无法正常读取存储卡。建议同时关注各发行厂商发布的安全公告，及时应用补丁。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 memstick rtsx_usb_ms 释放后使用漏洞"
updated = "2026-06-17T08:44:51Z"

