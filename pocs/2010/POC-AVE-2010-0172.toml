[info]
author = "AVE"
description = "检测 Apple Safari WebKit 中 TEXTAREA 元素内 HTML 未正确转义导致的跨站脚本漏洞。通过构造包含恶意 HTML/JavaScript 的 TEXTAREA 页面，验证浏览器是否错误解析了 TEXTAREA 子元素中的 HTML 内容。"
id = "POC-AVE-2010-0172"
name = "Apple Safari WebKit TEXTAREA XSS PoC"
severity = "medium"
tags = ["cve-2010-1762"]
vuln_id = [
    "CVE-2010-1762",
    "AVE-2010-0172",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<textarea><script>alert(1)</script></textarea>"]
