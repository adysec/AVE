[basic]
description = "NetBSD 操作系统中 mopd（Maintenance Operations Protocol 加载守护进程）存在缓冲区溢出漏洞。远程攻击者可通过向目标系统发送包含过长文件名的特制网络请求，触发该缓冲区溢出，从而执行任意系统命令。该漏洞影响运行 mopd 服务的 NetBSD 系统版本，攻击者无需身份认证即可在远程利用此漏洞获取系统控制权限。"
published = "2000-10-20T04:00:00Z"
remediation = "升级 NetBSD 至 1.4.2 或更高版本，或从 NetBSD CVS 获取 mopd/process.c r1.8 修订版本的补丁并重新编译安装 mopd。OpenBSD 用户请应用 2.7 的第 018 号安全补丁（018_mopd.patch），FreeBSD 用户请安装 FreeBSD-SA-00:40 安全公告中的修复包，Red Hat Linux 用户请安装 RHSA-2000:050 安全更新。如暂无法升级，可在防火墙或路由器层面阻断 UDP 端口 652 和 653 的 MOP 协议流量，或直接从 inetd.conf 中禁用 mopd 服务行以临时缓解风险。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "NetBSD mopd 缓冲区溢出远程命令执行漏洞"
updated = "2026-06-16T21:52:24Z"

