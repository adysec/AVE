[basic]
description = "Microsoft SQL Server 7.0/2000 及 MSDE 中的 xp_peekqueue 扩展存储过程函数在调用 srv_paraminfo API 时未正确限制缓冲区长度，存在缓冲区溢出漏洞。本地攻击者可通过向 SQL Server 发送特制的参数调用触发该溢出，导致服务拒绝响应或执行任意命令。该漏洞影响 SQL Server 7.0/2000 及 Desktop Engine (MSDE) 版本，需拥有本地登录权限才能利用。"
