[basic]
description = 'Caucho Technology Resin 1.2 及更早版本存在 JSP 源代码泄漏漏洞，远程攻击者无需认证即可通过向 .jsp 文件 URL 后附加特定字符（如 ".."、"%2e.."、"%81"、"%82" 等）发送特制 HTTP 请求，导致服务器返回 JSP 源代码而非执行后的结果。攻击者可借此获取 Web 应用敏感逻辑、数据库配置等关键信息，为后续攻击提供铺垫。该漏洞利用难度低，仅需网络访问即可触发。'
published = "2000-11-23T05:00:00Z"
remediation = '升级 Caucho Resin 至 1.2.1 或更高版本，该漏洞已在后续版本中修复。如无法升级，可在 Apache 或反向代理层配置 URL 重写规则，拦截包含 ".."、"%2e.."、"\%8[12]" 等特殊字符序列的 .jsp 请求，返回 404 或 403 状态码。同时确保 Web 服务器不将 .jsp 文件作为静态资源直接提供。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Caucho Technology Resin JSP 源代码泄漏漏洞"
updated = "2026-06-16T21:53:25Z"

