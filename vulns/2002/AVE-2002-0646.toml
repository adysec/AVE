[basic]
description = "Novell NetWare 5.1 在安装过程中默认部署了多个示例应用程序，未经身份认证的远程攻击者可通过直接访问这些示例文件获取系统敏感信息。受影响的文件包括 ndsobj.nlm、allfield.jse、websinfo.bas、ndslogin.pl、volscgi.pl、lancgi.pl、test.jse 和 env.pl 等。攻击者无需任何凭据即可通过网络请求触发信息泄露，导致目录内容、环境变量、脚本源码等敏感数据泄露。该漏洞影响运行 Novell NetWare 5.1 并使用 Netscape Enterprise Web Server for Netware 4/5 5.0 的系统，CVSS 评分为 5.0，危害等级为中等。攻击者可利用泄露的信息进一步进行针对性的网络攻击。"
published = "2002-12-31T05:00:00.000"
remediation = "删除或禁用 NetWare 5.1 安装的示例应用程序（包括 ndsobj.nlm、allfield.jse、websinfo.bas、ndslogin.pl、volscgi.pl、lancgi.pl、test.jse、env.pl），并升级至 NetWare 6.x 或更高版本。如无法立即升级，应在防火墙中限制对 Web Server 端口的访问，并严格配置目录权限以阻止未授权用户访问示例脚本目录。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Novell NetWare 5.1 示例应用程序信息泄漏漏洞"
updated = "2026-06-16T21:59:41.737"

