[basic]
description = "Apache HTTP Server 的 mod_rewrite 模块存在任意文件读取漏洞，当服务器配置的 RewriteRule 规则中包含正则表达式反向引用且目标路径扩展后包含文件名时，未经身份认证的远程攻击者可利用该漏洞读取服务器上的任意文件。该漏洞影响 Apache 1.3.12 及更早版本，Apache 安全团队将其评级为 important。Apache 已在 1.3.14 版本中修复此漏洞。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 Apache HTTP Server 至 1.3.14 或更高版本，该版本修复了 mod_rewrite 因正则表达式引用导致任意文件访问的漏洞。如暂无法升级，请检查 httpd.conf 及所有 RewriteRule 配置，移除目标地址中包含正则表达式反向引用（如 $N、%N）的规则，避免使用包含文件名的重写目标，并确保 RewriteRule 的目的地仅指向受控的 Web 目录。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Apache HTTP Server mod_rewrite 任意文件读取漏洞"
updated = "2026-06-16T21:52:45.083"

