[basic]
description = "PHP-Nuke 4.4 的 cookiedecode 函数存在认证绕过漏洞。远程攻击者无需身份认证即可通过提取 Cookie 中的认证信息，绕过登录验证机制，非法获取其他用户的账户权限。该漏洞影响 PHP-Nuke 4.4 版本，攻击者利用此漏洞可窃取用户敏感数据或冒充他人身份执行操作，危害较大。官方已发布修复版本，建议用户及时升级。"
published = "2001-06-02T04:00:00Z"
remediation = "立即升级 PHP-Nuke 至 4.5 或更高版本，该版本已修复 cookiedecode 函数中直接解码用户可控 Cookie 凭据的安全问题。由于 PHP-Nuke 已停止维护且不再发布安全更新，强烈建议迁移至其他活跃维护的 CMS（如 WordPress、Joomla）。临时缓解措施：在 includes/cookiedecode.php 中对 cookie 数据进行服务端签名验证，禁止直接信任客户端提交的认证凭据。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "PHP-Nuke PHP-Nuke cookiedecode 函数认证绕过漏洞"
updated = "2026-06-16T21:53:27Z"

