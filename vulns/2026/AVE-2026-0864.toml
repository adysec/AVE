[basic]
description = "Mistune（Python Markdown 解析器）的 HTMLRenderer.safe_url() 函数存在跨站脚本（XSS）漏洞。该函数旨在通过检查 URL 前缀来拦截 javascript: 等危险协议，但在进行协议检查前未对输入 URL 进行 URL 解码。远程攻击者可通过构造包含百分号编码的 javascript URI（如 javascript%3Aalert(1)）的恶意 Markdown 链接或图片，绕过 safe_url() 的安全过滤。当受害者点击该链接时，浏览器会自动解码 %3A 为 :，导致任意 JavaScript 代码在受害者浏览器上下文中执行。攻击者可利用此漏洞窃取会话 Cookie、执行任意脚本，甚至实现账户接管。该漏洞影响 Mistune 3.3.0 之前的所有版本，CVSS 评分 6.1，危害等级中危。用户需升级至 3.3.0 或更高版本修复此漏洞。"
published = "2026-07-08T17:17:27.910"
remediation = "立即将 mistune 升级至 3.3.0 或更高版本（pip install --upgrade mistune）。如无法升级，在调用 mistune 渲染前对用户输入的 Markdown 内容中的 URL 进行额外解码校验，过滤包含 javascript: 等危险协议的链接。"
score = 6.1
severity = "MEDIUM"
sources = ["ghsa"]
title = "Mistune Python Markdown解析器跨站脚本漏洞"
updated = "2026-07-09T19:35:14.273"

