[basic]
description = 'Borland InterBase 5/6 版本中的 gds_lock_mgr 组件存在符号链接攻击漏洞。攻击者利用该漏洞可通过创建指向目标文件的符号链接，诱使系统在处理临时文件 "isc_init1.X" 时将内容写入攻击者指定的文件，从而覆盖任意文件并提升本地权限。该漏洞影响 InterBase 5.x 和 6.x 版本，攻击条件为攻击者需具备本地访问权限，无需远程网络利用。通过构造恶意的符号链接并触发 gds_lock_mgr 对临时文件的写入操作，攻击者可将 xinetdbd 等关键系统文件替换为恶意内容，实现权限提升。'
published = "2003-04-02T05:00:00.000"
remediation = "建议升级到 Borland InterBase 7.0 或更高版本（已修复该临时文件符号链接漏洞）。若无法升级，可通过设置 gds_lock_mgr 文件权限为 750 并限制仅由 interbase 用户执行，同时配置临时目录粘滞位（chmod +t /tmp）防止非所有者删除/重命名文件，作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Borland InterBase GDS_Lock_MGR UMask 文件权限更改漏洞"
updated = "2026-06-16T21:59:28.260"

