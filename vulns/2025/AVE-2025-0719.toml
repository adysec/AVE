[basic]
description = "Windows 数字媒体组件存在越界读取漏洞，该漏洞源于对内存中对象读取操作边界检查不充分。具有物理访问权限的低权限攻击者可通过向目标系统插入特制媒体设备或运行恶意应用程序触发该漏洞，成功利用后可导致系统内存敏感信息泄露，进而实现权限提升，获取对机密性、完整性和可用性的高等级控制。该漏洞影响 Windows 10/11 及 Windows Server 多个版本，Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:44Z"
remediation = "安装 Microsoft 2025 年 1 月安全更新 (KB5050061)。各受影响版本对应的修复版本号：Windows 10 v1507 升级至 10.0.10240.20890，v1607/Server 2016 升级至 10.0.14393.7699，v1809/Server 2019 升级至 10.0.17763.6775，v21H2 升级至 10.0.19044.5371，v22H2 升级至 10.0.19045.5371，Windows 11 v22H2 升级至 10.0.22621.4751，v23H2 升级至 10.0.22631.4751，v24H2/Server 2025 升级至 10.0.26100.2894，Server 2022 升级至 10.0.20348.3091，Server 2022 23H2 升级至 10.0.25398.1369。也可通过 Windows Update 自动获取更新。由于该漏洞需要物理访问才能利用，限制本地登录权限可作为临时缓解措施。"
score = 6.6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 数字媒体特权提升漏洞"
updated = "2026-06-17T08:42:55Z"

