[basic]
description = "imap-uw IMAP 软件包中的 POP2/POP3 服务器（pop3d）在 FreeBSD 及其他操作系统上存在拒绝服务漏洞。该漏洞源于 pop3d 服务创建邮件锁定文件时使用可预测的文件名，攻击者可以通过在特定路径下创建指向其他用户邮箱的锁定文件，使得其他用户无法正常访问其邮件，从而造成拒绝服务。在本地 unprivileged 权限下即可触发，无需远程访问。攻击者无需特殊工具，仅需在本地创建同名或相似的锁定文件即可。该漏洞影响范围包括运行 imap-uw IMAP 软件包的 FreeBSD 及其他类 Unix 系统。CVSS 评分 2.1（仅影响完整性无可用性），危害等级较低。建议升级 imap-uw 软件包至最新版本或应用厂商提供的补丁。"
published = "2001-08-31T04:00:00Z"
remediation = "升级 imap-uw 至 2000c 或更高版本（修复了 POP2/POP3 锁文件可预测名称漏洞）。若无法立即升级，可将邮件锁文件目录权限设为 1777 (sticky bit) 并限制为 root 所有，防止普通用户创建他人邮箱锁文件；或在 /etc/inetd.conf 中禁用 POP2/POP3 服务（注释掉 pop2/pop3 行）并重启 inetd。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "imap-uw 邮件服务 拒绝服务漏洞"
updated = "2026-06-16T21:53:21Z"

