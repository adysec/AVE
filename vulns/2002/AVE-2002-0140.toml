[basic]
description = "rsync 以守护进程模式运行时，在降低权限前未正确调用 setgroups 函数清除补充组权限，导致本地用户可利用该缺陷继承额外的组特权，从而读取本应被禁止访问的文件。该漏洞影响多个 Linux/Unix 发行版中默认安装的 rsync 守护进程版本，攻击者需拥有本地系统访问权限，利用难度较低，可造成敏感信息泄露。建议升级至 rsync 2.5.6 及以上版本修复此问题。"
published = "2002-03-15T05:00:00Z"
remediation = "升级 rsync 至 2.5.3 或更高版本。Red Hat 用户可运行 `up2date rsync` 安装 RHSA-2002:026 提供的更新包；Mandrake 用户安装 MDKSA-2002:024 更新。如无法升级，在 rsyncd.conf 中设置 `use chroot = yes` 并限制 `uid = nobody` 和 `gid = nobody`，避免 rsync 以 root 权限运行 daemon 模式。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Samba rsync 特权管理不当漏洞"
updated = "2026-06-16T21:56:43Z"

