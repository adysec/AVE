[basic]
description = "Artica Pandora FMS 7.23 及之前版本的 /pandora_console/ajax.php AJAX 端点存在本地文件包含漏洞，攻击者可通过构造恶意参数调用任意 PHP 文件，导致远程代码执行或敏感文件读取。该漏洞影响 Artica Pandora FMS 7.23 及之前所有版本，CVSS 3.0 评分 7.5（HIGH），攻击向量为网络，攻击复杂度低，无需权限和用户交互，机密性影响高。攻击者可直接向 /pandora_console/ajax.php 发送包含文件包含参数的恶意请求，利用输入验证缺陷包含并执行服务器上的任意 PHP 文件，从而获取服务器控制权限或窃取敏感数据。Artica 已在后续版本中修复该漏洞，建议用户升级至最新版本。"
published = "2018-06-16T01:29:05Z"
remediation = "建议立即升级 Artica Pandora FMS 至 7.24 或更高版本（官方已修复该 LFI 漏洞）。如暂无法升级，可通过 Web 服务器配置禁用 /pandora_console/ajax.php 接口的 PHP 文件包含功能，或在 Web 应用防火墙层面拦截包含 ../ 等路径遍历特征的请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Artica Pandora FMS 本地文件包含漏洞"
updated = "2026-06-17T01:35:31Z"

