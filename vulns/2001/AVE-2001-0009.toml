[basic]
description = "simplestguest.cgi 是 Leif M. Wright 开发的一款 CGI 留言板程序，版本 2.0 存在远程命令执行漏洞。该程序在处理用户提交的留言内容（guestbook 参数）时未对输入进行充分的过滤与转义，攻击者可以在参数值中插入 Shell 元字符（如分号、管道符、反引号等），将任意系统命令注入到服务器的命令执行环境中。该漏洞可通过 HTTP 请求直接触发，攻击者无需事先进行身份认证或获取任何凭据。利用此漏洞，未经身份验证的远程攻击者可以在承载该 CGI 程序的 Web 服务器上执行任意操作系统命令，从而完全控制目标服务器。该漏洞影响部署了 simplestguest.cgi 2.0 版本的 Web 服务器，CVSS v3 基础评分 10.0，危害等级严重。Microsoft 等安全厂商已在安全公告中披露该漏洞并建议及时修复。"
published = "2001-02-12T05:00:00Z"
remediation = "立即删除或禁用 simplestguest.cgi 文件，该软件已停止维护且存在严重的远程命令执行漏洞。如仍需访客留言功能，应替换为持续维护的现代替代方案，并在 Web 服务器配置中移除对 vulnerable 目录的 CGI 执行权限，同时审查 Web 服务器上所有遗留 CGI 脚本的安全性作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Leif M. Wright simplestguest.cgi 远程命令执行漏洞"
updated = "2026-06-16T21:53:30Z"

