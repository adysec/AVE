[basic]
description = "Microsoft Windows 的 HTML Help ActiveX 控件（hhctrl.ocx）存在缓冲区溢出漏洞。远程攻击者可通过向目标用户发送特制网页，利用 Alink 函数的长参数或 showHelp 函数的长参数脚本触发栈缓冲区溢出，从而在用户浏览网页时以当前用户权限执行任意代码。该漏洞影响 Windows 98/98 SE/Me/NT 4.0/2000/XP 等多个版本，CVSS 评分 7.5，危害等级高。攻击者需诱导用户使用 Internet Explorer 访问恶意网页即可触发，无需额外认证。"
published = "2002-10-10T04:00:00Z"
remediation = '该漏洞影响已停止支持的 Windows 98/ME/NT 4.0/2000/XP 系统，微软已不再提供安全更新。建议立即升级到受支持的 Windows 10/11 版本。如无法升级，可通过注册表设置 hhctrl.ocx 的 kill bit（CLSID: 52a2aaae-085d-4187-97ea-8c30db990436）来禁用该 ActiveX 控件，在注册表 `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\ActiveX Compatibility` 下新建该 CLSID 项，将 Compatibility Flags DWORD 值设为 0x400。同时建议将 Internet 区域安全级别设为高，禁用 ActiveX 脚本执行。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft Windows HTML Help ActiveX 控件缓冲区溢出漏洞"
updated = "2026-06-16T21:57:57Z"

