[basic]
description = "tags.<value>DriveLock 存在目录遍历信息泄露漏洞（对应 ZDI-26-288 / ZDI-CAN-28713）。该漏洞源于 Web 服务在处理用户提交的路径参数时未进行充分的路径校验与过滤，导致攻击者可利用目录遍历技术访问服务账户上下文中的敏感文件信息。默认情况下，受影响的服务监听 TCP 4568 端口。攻击者需经过身份认证后，通过构造恶意路径请求即可触发漏洞，获取服务器上的敏感数据。该漏洞影响 DriveLock 相关版本，CVSS 评分为 6.5（中等危害）。"
published = "2026-07-29T20:17:06.140"
remediation = '立即将DriveLock升级至25.2.4版本（或25.1.7/24.2.9），该版本已修复路径遍历漏洞。如暂时无法升级，可在网络层面限制对TCP 4568端口的访问，仅允许授权IP连接，并部署WAF规则拦截包含"../"等路径遍历序列的请求。'
score = 6.5
severity = "MEDIUM"
sources = ["zdi"]
title = "DriveLock 目录遍历信息泄露漏洞"
updated = "2026-07-30T14:18:46.477"

