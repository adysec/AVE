[basic]
description = "CVE-2002-1549是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2003-03-31T05:00:00.000"
remediation = "Light HTTPd 0.1 已于 2002 年停止维护且无官方补丁，建议立即替换为当前维护的 HTTP 服务器（如 nginx 或 Apache）。若因业务需要必须继续使用 Light HTTPd 0.1，请在反向代理（如 nginx）层配置 `client_max_body_size` 限制 HTTP GET 请求体大小，并在防火墙层面限制来源 IP，仅允许可信网段访问端口 3000。同时将服务运行在低权限账户下，禁用不必要的网络暴露面。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
