[basic]
description = "Apple Safari浏览器所采用的WebKit渲染引擎存在内存破坏漏洞（CWE-119），远程攻击者可通过构造包含恶意内容的特制网站触发该漏洞，导致目标系统发生内存损坏并执行任意代码或引发应用程序崩溃。该漏洞影响Safari 6.0之前的所有版本，攻击者无需身份认证即可利用，攻击复杂度为中等，攻击者需诱导用户访问恶意网页作为攻击条件。"
published = "2012-07-25T20:55:03Z"
remediation = '立即将 Apple Safari 升级至 6.0 或更高版本，该版本已修复 WebKit 内存破坏漏洞。对于 macOS Lion 和 Mountain Lion 系统，可通过 Mac App Store 免费获取 Safari 6.0；Windows 用户需下载 Safari 6.0 for Windows 安装包。如暂时无法升级，应避免访问不受信任的网站，禁用 JavaScript 执行（Safari → 偏好设置 → 安全 → 取消勾选"启用 JavaScript"），并启用"安全浏览"功能以阻止恶意网站。同时建议将系统更新至最新版本以获取其他相关安全补丁。'
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:38Z"

