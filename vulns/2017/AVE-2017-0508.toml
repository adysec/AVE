[basic]
description = "Apache Tomcat 在启用了 HTTP PUT 方法（即将 Default Servlet 的 readonly 初始化参数设置为 false）时存在文件上传漏洞。远程攻击者可通过构造特制的 HTTP PUT 请求，向服务器上传包含恶意 JSP 代码的文件，随后通过访问该 JSP 文件触发服务器端执行任意代码。该漏洞影响 Tomcat 7.0.0 至 7.0.81、8.0.0.RC1 至 8.0.46、8.5.0 至 8.5.22 以及 9.0.0.M1 至 9.0.0 等多个版本，CVSS 评分 8.1，危害等级高。攻击者无需身份认证即可利用该漏洞，但需要目标服务器开启 PUT 方法且存在可写目录。目前已公开多个 PoC 利用脚本，实际威胁较高。"
published = "2017-10-04T01:29:02Z"
remediation = "升级 Apache Tomcat 至 9.0.1、8.5.23、8.0.47 或 7.0.82 及以上版本。如无法立即升级，将 DefaultServlet 的 readonly 初始化参数设为 true（默认即为 true，确认未被显式改为 false），以禁用 HTTP PUT 方法上传文件功能。同时建议在 Web 应用防火墙（WAF）层面拦截对 `.jsp` 后缀的 PUT 请求作为纵深防御。"
score = 8.1
severity = "HIGH"
sources = ["nuclei"]
title = "Apache Tomcat PUT文件上传远程代码执行漏洞"
updated = "2026-06-17T01:03:38Z"

