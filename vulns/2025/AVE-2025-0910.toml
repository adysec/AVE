[basic]
description = "Linux 内核 drivetemp 硬件监控驱动程序在处理 SCSI 命令错误时存在缺陷。scsi_execute_cmd() 函数可能同时返回负值（Linux 内核错误码）和正值（SCSI 命令结果字段）两种类型的错误码，而当前驱动程序未正确区分这两种错误码，直接将其传递给 hwmon 核心层。由于 hwmon 核心仅识别负值错误码，当发生 SCSI 错误（如磁盘驱动器被断开连接）时，正值错误码会被误判为成功，导致驱动程序向用户空间返回未初始化的垃圾数据。该漏洞影响使用 drivetemp 驱动的 Linux 内核系统，攻击条件为本地低权限用户或 SCSI 设备出现错误状态，攻击者可利用此问题获取不准确的硬件监控数据或造成信息泄露。"
published = "2025-01-21T13:15:09Z"
remediation = "升级 Linux 内核至 6.6.72、6.12.10 或更高版本（含 6.13 系列），或向内核上游合并补丁 commit 82163d63ae7a4c36142cd252388737205bb7e4b9。Ubuntu 用户可执行 apt update && apt install linux-image-generic 安装最新内核更新。如无法立即升级，可通过限制本地用户对 hwmon 接口的访问权限作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel hwmon drivetemp 信息泄露漏洞"
updated = "2026-06-17T08:43:56Z"

