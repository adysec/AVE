[basic]
description = "goshs 文件服务器的 ?bulk zip-download 路由存在授权绕过漏洞。httpserver/updown.go 中的 bulkDownload 处理函数在处理 ?bulk&file= 参数时，未调用 findEffectiveACL 和 applyCustomAuth 进行 ACL 校验，导致攻击者可通过构造 ?bulk 请求绕过 .goshs 文件夹级别的访问控制列表和文件黑名单保护。未认证的远程攻击者无需任何身份验证即可读取受 .goshs ACL 保护的文件，获取敏感信息。该漏洞影响 goshs 2.1.1 之前的所有版本，其根本原因与 GHSA-wvhv-qcqf-f3cx 相同——修复仅覆盖了 PUT/POST 上传和 ?mkdir/?delete 等状态变更路由，但未覆盖 ?bulk 读路由。攻击者利用方式简单，仅需发送 GET /?bulk&file=/受保护路径/文件名 即可将受保护文件内容以 ZIP 压缩包形式返回。此漏洞为信息泄露（机密性影响），不涉及完整性或可用性破坏。"
published = "2026-07-28T23:17:09.213"
remediation = "将 goshs 升级至 v2.1.1 或更高版本，该版本已在 bulkDownload 处理函数中强制调用 findEffectiveACL 和 applyCustomAuth，确保 ?bulk 路由与正常读路径执行相同的 ACL 鉴权逻辑。升级后验证 GET /?bulk&file= 受保护文件应返回 401 而非 200。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "goshs ?bulk zip-download 路径鉴权绕过漏洞"
updated = "2026-07-29T13:19:00.653"

