[basic]
description = "tags as required.<value>Linux 内核 iscsi_ibft 模块的 ibft_attr_show_nic() 函数存在越界移位漏洞。当系统通过 IPv6 网络执行 iSCSI 启动时，iscsistart 工具会读取 /sys/firmware/ibft/ethernetX/subnet-mask 文件获取子网掩码。由于 IPv6 前缀长度为 64，导致移位计算中的指数变为负值，触发 UBSAN 运行时警告。IPv6 地址架构不适用传统的子网掩码概念，该越界操作可能引发内核未定义行为，导致内存信息泄露或系统可用性受影响。攻击者需要具备本地访问权限并能够控制 iSCSI 启动环境才能触发该漏洞，CVSS 评分 7.1，危害等级高。"
published = "2025-04-02T13:15:43Z"
remediation = "升级 Linux 内核至修复版本。主线内核请升级至 6.14-rc2 或更高版本，该修复已通过 commit 07e0d99a2f701123ad3104c0f1a1e66bce74d6e5 合入主线。各发行版修复版本如下：Ubuntu 22.04 LTS 升级内核至 5.15.0-1079.85 或更高，Ubuntu 24.04 LTS 升级内核至 6.8.0-1023.27 或更高，Debian 11 (bullseye) 升级内核至 5.10.237-1 或更高，Debian 12 (bookworm) 升级内核至 6.1.133-1 或更高。升级后需重启系统使新内核生效。如当前环境使用 iSCSI IPv6 启动且无法立即升级内核，可临时禁用 IPv6 启动或将 iSCSI 引导方式切换为 IPv4 以规避触发 UBSAN 警告的条件。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 iscsi_ibft 移位越界漏洞"
updated = "2026-06-17T08:44:47Z"

