[basic]
description = "tags.<value>X-News 1.1及早期版本存在远程密码泄漏漏洞。该软件将用户密码以MD5哈希形式存储在users.txt数据文件中，攻击者可通过网络嗅探或直接读取该文件获取任意用户的密码哈希值，随后将窃取的MD5哈希值作为cookie提交即可冒充该用户完成身份认证。该漏洞影响所有部署X-News 1.1及更早版本的站点，攻击者无需任何账号凭据即可在远程条件下实施利用，造成用户身份被窃取及敏感信息泄露。"
published = "2002-12-31T05:00:00.000"
remediation = "由于 X-News 1.1 将用户 MD5 密码校验和明文存储在 users.txt 数据文件中，攻击者可通过读取该文件或网络嗅探获取密码哈希并在 Cookie 中伪造身份以认证为其他用户。建议升级到 X-News 的最新稳定版本，新版本已将用户认证凭据从明文文件迁移至数据库存储并采用更安全的哈希机制。如暂时无法升级，应将 users.txt 文件权限设置为禁止 Web 服务器进程读取，同时在 Web 服务器配置中添加访问规则拒绝对该文件的 HTTP 直接访问，并强制使用 HTTPS 以防止密码哈希在传输过程中被嗅探。此外，建议将所有用户密码强制重置，并启用服务器端会话管理替代 Cookie 中的 MD5 校验和认证方式。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "X-News 1.1 远程密码泄漏漏洞"
updated = "2026-06-16T21:59:44.023"

