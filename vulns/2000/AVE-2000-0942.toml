[basic]
description = "Red Hat Linux 6.2 至 7J 等发行版中 iputils 工具包（20001010 之前版本）的 ping 命令在获取原始套接字后未正确释放特权（setuid 权限），导致 ping 进程长期以高权限运行。远程攻击者可利用 ping 中存在的其他低权限漏洞，通过发送特制网络数据包触发缓冲区溢出或格式字符串等缺陷，从而提升至 root 权限执行任意代码。该漏洞影响范围广泛，攻击复杂度低，无需身份认证即可远程利用，CVSS 评分 7.5，危害等级高。"
published = "2000-10-18T04:00:00Z"
remediation = "升级 iputils 至 20001010 或更高版本。Red Hat Linux 6.2~7J 用户可通过 Red Hat 官方渠道安装更新后的 iputils 包。如无法升级，可移除 ping 的 SUID 权限（chmod u-s /bin/ping），使 ping 以普通用户权限运行，但会丧失部分网络诊断功能。也可在 iptables 层面限制对 raw socket 的访问作为临时缓解。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Red Hat Linux iputils 不释放特权漏洞"
updated = "2026-06-16T21:53:23Z"

