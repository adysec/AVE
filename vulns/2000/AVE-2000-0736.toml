[basic]
description = "Palm OS 3.5.2 及更早版本使用弱加密算法存储用户密码，攻击者在物理接触 Palm 设备的情况下，可通过分析设备存储的加密密码数据，利用其加密强度不足的缺陷还原出明文密码，从而绕过设备访问控制获取用户敏感信息。该漏洞利用条件要求攻击者能够物理访问目标设备，影响设备上存储的所有密码数据安全。"
published = "2000-12-11T05:00:00Z"
remediation = "Palm OS 3.5.2 及更早版本使用弱加密算法存储用户密码，物理接触设备的攻击者可解密获取密码。建议升级至 Palm OS 4.0 或更高版本以使用更强的加密机制；如无法升级，避免在 Palm 设备上存储敏感密码，或使用第三方加密软件（如 PocketCrypt）对密码数据库进行额外加密保护。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Palm OS 弱加密漏洞"
updated = "2026-06-16T21:52:57Z"

