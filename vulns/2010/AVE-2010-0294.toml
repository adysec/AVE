[basic]
description = "Apple WebKit 渲染引擎在处理 SVG 文档中浮动元素（floating element）时存在内存破坏漏洞。未经身份认证的远程攻击者可通过构造包含恶意浮动元素的 SVG 文档并诱使 Safari 浏览器渲染该文档来触发漏洞，导致应用程序内存被破坏，进而执行任意代码或造成拒绝服务（应用崩溃）。该漏洞影响 Safari 5.0.1 之前版本（Mac OS X 10.5/10.6 及 Windows 平台）、Safari 4.1.1 之前版本（Mac OS X 10.4）以及 webkitgtk 1.2.6 之前版本。攻击者可将恶意 SVG 文件嵌入网页、发送链接或通过其他方式诱导目标用户打开含恶意 SVG 内容的网页即可完成利用。CVSS v2 评分为 9.3，危害等级严重。"
published = "2010-07-30T20:30:02Z"
remediation = "立即升级 Safari 至 5.0.1（Mac OS X 10.5/10.6 及 Windows）或 4.1.1（Mac OS X 10.4），WebKitGTK 用户升级至 1.2.6。如无法立即更新，临时禁用 WebKit 对 SVG 文档的自动渲染，避免访问不可信网站。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:19:20Z"

