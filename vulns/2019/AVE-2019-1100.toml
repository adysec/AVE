[basic]
description = "tags.<value>Citrix ADC（应用交付控制器）和 Gateway 存在目录遍历漏洞，未经身份认证的远程攻击者可通过发送特制的 HTTP 请求，利用路径遍历技术访问并写入服务器上的任意文件，进而在目标系统上执行任意代码。该漏洞影响 Citrix ADC 和 Gateway 的 10.5、11.1、12.0、12.1 及 13.0 版本，CVSS 评分 9.8，危害等级严重。攻击者无需任何身份认证即可利用此漏洞，成功后可获得对受影响系统的完全控制权。"
published = "2019-12-27T14:15:12.070"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Citrix Application Delivery Controller (ADC) 和 Gateway 目录遍历远程代码执行漏洞"
