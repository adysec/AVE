[basic]
description = "Caldera UnixWare 7.1.1 和 Open UNIX 8.0.0 的 WebTop 组件中存在任意命令执行漏洞，攻击者可通过向 scoadminreg.cgi 或 service_action.cgi 的 -c 参数注入 Shell 元字符（如管道符、分号等），实现远程命令执行并获取 root 权限。CVSS 评分 10.0，攻击向量为网络、攻击复杂度低、无需身份认证，可导致系统机密性、完整性和可用性完全丧失。"
published = "2002-05-31T04:00:00Z"
remediation = "立即升级到UnixWare 7.1.1+（包含安全补丁更新）或升级到Open UNIX 8.0.0.2+及以上版本，获取官方发布的SCOAdminReg.cgi和service_action.cgi脚本安全修复包。如无法立即应用补丁，请禁止外部网络访问WebTop管理端口，关闭cgi执行权限，并过滤所有-c参数中的shell元字符作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "SCO UnixWare 7.1.1 WebTop 任意命令执行漏洞"
updated = "2026-06-16T21:57:11Z"

