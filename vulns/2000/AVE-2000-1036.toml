[basic]
description = "Bardon Data Systems WinU 1.0至5.1版本存在硬编码后门密码漏洞。攻击者可通过该预设密码绕过正常身份认证机制，远程登录WinU管理界面，进而修改系统配置、添加或删除用户账户、更改服务设置等。该漏洞源于软件在代码中硬编码了管理员级后门密码，且未提供修改或禁用机制。攻击者无需任何权限即可利用该后门密码获取完全控制权，导致系统配置被篡改、服务中断或进一步被用于内网渗透。CVSS评分7.2，危害等级高。"
published = "2000-12-19T05:00:00.000"
remediation = "立即升级 WinU 至 5.1 以上版本，Bardon 官方已发布补丁（参见 pwdcrack.htm）修复后门密码问题。如厂商已停止支持或无法升级，应在防火墙层面限制对 WinU 管理端口的远程访问，仅允许受信任 IP 连接，并修改默认管理密码。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Bardon Data Systems WinU 后门密码漏洞"
updated = "2026-06-16T21:52:55.163"

