[basic]
description = "Pine 4.43 及更早版本的 URL 处理代码存在命令注入漏洞，远程攻击者可通过向目标用户发送包含单引号包裹且含有 shell 元字符（如 &）的特制 URL 的邮件，当用户点击该 URL 时，Pine 会将其传递给 shell 执行，导致攻击者在用户系统上执行任意命令。该漏洞影响所有 Pine 4.43 及之前版本，CVSS 评分 7.5，危害等级高，攻击无需身份认证，利用复杂度低。"
published = "2002-07-26T04:00:00Z"
remediation = "立即升级 Pine 至 4.44 或更高版本，该版本已修复 URL 处理中的命令注入漏洞。Red Hat 用户应安装 RHSA-2002:009 提供的更新包；HP-UX 用户应用 HPSBTL0201-015 补丁；Conectiva Linux 用户安装公告 000460 对应更新。临时缓解措施：在邮件客户端设置中禁用 Pine 的 URL 自动打开功能，或配置外部浏览器调用时对 URL 进行严格过滤。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "University of Washington Pine URL 处理远程代码执行漏洞"
updated = "2026-06-16T21:56:35Z"

