[basic]
description = "Cisco ASA 及 Firepower Threat Defense (FTD) 设备的 Web 管理接口存在路径遍历漏洞。该漏洞源于 HTTP URL 输入验证不充分，未经身份认证的远程攻击者可通过向受影响设备发送特制的 HTTP 请求，利用目录遍历技术读取设备上的敏感系统信息（如配置文件、系统文件等），或在特定软件版本下导致设备意外重载引发拒绝服务。该漏洞影响 Cisco ASA 5500 系列、ASAv、Firepower 2100/4100/9300 系列等多款安全设备，CVSS 评分 7.5，危害等级高。攻击无需认证，攻击复杂度低，仅需网络可达即可触发。Cisco 已发布安全更新修复此漏洞。"
published = "2018-06-07T12:29:00.403"
remediation = "升级 Cisco ASA Software 至 9.1.7.29、9.2.4.33、9.4.4.18、9.6.4.8、9.7.1.24、9.8.2.28 或 9.9.2.1 及以上版本；升级 Cisco Firepower Threat Defense (FTD) 至 6.1.0、6.2.2.3 及以上版本。如无法立即升级，可在设备访问控制列表(ACL)中限制对 ASA Web 管理界面的访问，仅允许可信管理 IP 连接 HTTP/HTTPS 服务。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Cisco Adaptive Security Appliance 路径遍历漏洞"
updated = "2026-06-17T01:30:25.433"

