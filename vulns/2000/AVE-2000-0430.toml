[basic]
description = "Intel Shiva Access Manager 5.0 在 Solaris 平台上配置使用 LDAP 目录存储配置信息时，将根 DN（Distinguished Name）名称和密码以明文形式存储在全局可读的文件中。本地攻击者可直接读取该文件获取 LDAP 管理凭据，从而完全控制 LDAP 服务器，导致机密性、完整性和可用性全部丧失。攻击需本地访问权限，无需身份认证，利用复杂度低，CVSS 评分 7.2（AV:L/AC:L/Au:N/C:C/I:C/A:C）。"
published = "2000-06-06T04:00:00Z"
remediation = "立即修改存储 LDAP root DN 密码的配置文件权限为 600（仅 root 可读），命令：chmod 600 /etc/opt/shiva/ldap.conf。若无法修改权限，请迁移至不依赖本地明文文件存储 LDAP 凭据的认证方案（如 SASL/GSSAPI 或 LDAPS 客户端证书认证），并限制本地用户登录权限。Intel Shiva Access Manager 5.0 已停止维护，建议尽快替换为受支持的 RADIUS/AAA 解决方案。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Intel Corporation Shiva Access Manager 5.0 LDAP密码明文存储漏洞"
updated = "2026-06-16T21:51:54Z"

