[basic]
description = "JBoss Application Server 的 HTTP Invoker 组件中的 ReadOnlyAccessFilter 类的 doFilter 方法在反序列化处理时未对类进行限制，导致存在反序列化漏洞。未经身份认证的远程攻击者可通过向目标服务器发送特制的序列化数据触发该漏洞，在目标系统上执行任意代码。该漏洞影响 Red Hat Enterprise Application Platform 5.2 及 JBoss 5.x/6.x 版本，CVSS 评分 9.8，危害等级严重。攻击者无需任何认证即可利用，攻击复杂度低，且已有公开的 PoC 和利用工具，建议用户尽快升级修复。"
published = "2017-10-04T21:01:00.180"
remediation = "立即升级至 JBoss EAP 7.1.0 及以上版本（对应 Red Hat 安全公告 RHSA-2017:3456/RHSA-2017:3455）。如无法升级，可删除 HTTP Invoker 组件中的 ReadOnlyAccessFilter 类文件或禁用 HTTP Invoker 服务（移除 jboss-web.xml 中相关 servlet 映射）。同时建议在反向代理或防火墙层面限制对 /invoker/ 路径的访问，仅允许可信 IP 来源。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Red Hat JBoss 应用服务器反序列化远程代码执行漏洞"
updated = "2026-06-17T01:02:46.610"

