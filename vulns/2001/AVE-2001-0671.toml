[basic]
description = "News Desk 1.2 的 newsdesk.cgi 脚本存在任意文件读取漏洞，未对用户输入中的 shell 元字符进行充分过滤和校验。未经身份认证的远程攻击者可通过在请求参数中注入特制的 shell 元字符，操纵文件路径读取服务器上的任意文件，可能导致敏感配置信息、凭据等机密数据泄露。该漏洞影响运行 News Desk 1.2 的 Web 服务器系统，CVSS 评分为 5.0，危害等级中等。"
published = "2001-03-26T05:00:00.000"
remediation = "升级到 News Desk 1.3 或更高版本，该版本修复了 newsdesk.cgi 中的 shell 元字符解析漏洞；或者直接删除 newsdesk.cgi 文件并使用防火墙规则阻止对该脚本的访问；如无法立即升级，可使用 waf 规则过滤包含 shell 元字符的请求，并在 web 服务器配置中限制 CGI 执行权限，仅允许特定目录访问 CGI 脚本。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "News Desk 1.2 任意文件读取漏洞"
updated = "2026-06-16T21:53:55.780"

