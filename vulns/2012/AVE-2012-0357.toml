[basic]
description = "WebKit浏览器引擎存在内存破坏漏洞，苹果Safari 6.0之前版本使用该引擎。未经身份认证的远程攻击者可通过构造恶意网站触发内存越界写入，导致任意代码执行或拒绝服务（应用崩溃）。该漏洞利用条件宽松，攻击者无需用户交互即可通过诱骗用户访问恶意网页实施攻击。CVSS评分9.3，危害等级严重。"
published = "2012-07-25T20:55:04.727"
remediation = "立即将Apple Safari升级至6.0或更高版本。在macOS上通过「系统偏好设置」→「软件更新」安装Safari 6更新，或从Apple支持页面https://support.apple.com/kb/HT5485手动下载安装。在iOS设备上升级至iOS 6。临时缓解措施：在Safari中禁用JavaScript（偏好设置→安全→取消勾选「启用JavaScript」），或避免访问不可信网站。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "苹果 Safari WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:43.430"

