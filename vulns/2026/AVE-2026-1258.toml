[basic]
description = "Ghost 内容管理系统存在服务器端请求伪造（SSRF）漏洞，攻击者可通过发送包含 IPv6 字面量的特制请求，绕过内置的私有 IP 地址过滤机制，将请求映射到内网中的私有 IPv4 地址，从而向内部服务发起未授权请求。该漏洞影响 Ghost 6.0.9 至 6.21.0 版本，攻击者无需身份认证即可远程利用，可能造成信息泄露或对内部系统的进一步渗透。Ghost 已在 6.21.1 版本中修复此问题。"
published = "2026-06-24T19:17:11.957"
remediation = "升级 Ghost 至 v6.21.1 或更高版本以修复该漏洞。使用 Docker 部署的自托管实例，请拉取官方最新镜像并重新创建容器；采用 Ghost-CLI 安装的实例，运行 ghost update 命令进行升级。如暂时无法升级，可在防火墙或反向代理层面限制外部请求的目标地址范围，阻止 IPv6 字面量映射到内网私有地址。"
score = 5.8
severity = "MEDIUM"
sources = ["ghsa"]
title = "Ghost CMS IPv6 地址绕过私有 IP 过滤漏洞"
updated = "2026-06-25T16:07:28.730"

