[basic]
description = "glftpd 1.18 的 privpath 指令存在安全绕过漏洞。远程攻击者无需身份认证即可利用文件名的自动补全功能绕过目录访问限制，访问本应被 privpath 指令禁止的受保护目录，导致敏感信息泄露。该漏洞攻击复杂度低，无需任何权限即可远程利用，CVSS 评分 10.0，危害等级严重。目前厂商已停止维护该软件，建议用户升级至不受影响的版本或迁移至其他 FTP 服务器软件。"
published = "2000-06-26T04:00:00Z"
remediation = "升级 glftpd 至 1.18 以上版本，该漏洞已在后续版本中修复。如无法升级，可在 glftpd 配置文件中禁用文件名自动补全功能（tab completion），或限制 privpath 目录的访问权限以降低风险。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "glFTPd glftpd 访问限制绕过漏洞"
updated = "2026-06-16T21:52:03Z"

