[basic]
description = 'Cisco IOS 12.0 至 12.1 版本的 HTTP 服务器存在拒绝服务漏洞。本地攻击者可通过向目标设备发送包含 "?/" 字符串的恶意 URL 请求，触发 HTTP 服务器处理异常，导致设备崩溃并重新加载，造成服务中断。该漏洞影响大量 Cisco 路由器和交换机设备，CVSS 评分 5.0，危害等级中等。Cisco 已发布安全公告建议升级至不受影响版本。'
published = "2000-12-19T05:00:00Z"
remediation = "升级Cisco IOS至12.1.2或更高版本以修复该漏洞。如无法立即升级，可在网络边界或设备访问控制列表(ACL)中过滤包含'?/'的恶意HTTP请求路径作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Cisco IOS HTTP Server 拒绝服务漏洞"
updated = "2026-06-16T21:52:54Z"

