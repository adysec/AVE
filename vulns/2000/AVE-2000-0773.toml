[basic]
description = "Netscape iCal 2.1 Patch2 中的 csstart 程序在安装 libsocket 和 libnsl 库时使用了相对路径，而非绝对路径。本地攻击者（icsuser 账户）可在当前目录或父目录中放置恶意的特洛伊木马库文件，当 csstart 程序以 root 权限执行时，会优先加载攻击者构造的恶意库文件，从而导致权限提升，获得 root 权限。该漏洞影响 iPlanet iCal 2.1 Patch2 版本，攻击者需拥有本地 icsuser 账户访问权限，无需用户交互即可利用。"
published = "2000-12-11T05:00:00.000"
remediation = "建议立即升级到 iPlanet iCal 2.1 Patch 3 或更高版本，该补丁已修复 csstart 使用相对路径加载库文件的问题。如无法升级，可手动修改 csstart 脚本，将 libsocket 和 libnsl 的加载路径改为绝对路径（如 /usr/lib/libsocket.so），并移除 csstart 程序的 setuid root 权限（chmod u-s /path/to/csstart）。由于 iPlanet iCal 已停止维护，建议迁移至现代支持的日历解决方案（如 Oracle Communications Calendar Server）。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Netscape iCal 2.1 Patch2 本地权限提升漏洞"
updated = "2026-06-16T21:53:05.833"

