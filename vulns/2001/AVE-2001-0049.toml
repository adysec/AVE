[basic]
description = "Solaris 7及更早版本中的arp命令存在缓冲区溢出漏洞，由于程序对-f参数输入长度缺乏有效边界检查，本地攻击者可通过向arp命令传递超长的-f参数触发缓冲区溢出，从而以root权限执行任意代码。该漏洞影响Solaris 7及更早版本，CVSS评分7.2，危害等级高危。利用该漏洞需要本地系统访问权限，攻击复杂度低，可完全控制目标系统。"
published = "2001-03-12T05:00:00.000"
remediation = "建议立即安装 Sun Security Bulletin #200 中提供的补丁，或升级至 Solaris 8 及以上版本。对于无法升级的系统，可通过 chmod 700 /usr/sbin/arp 限制 arp 命令仅 root 用户可执行，并监控本地用户对 arp 命令的异常调用行为作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Sun Solaris arp 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:53:41.017"

