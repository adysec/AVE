[basic]
description = "Pine 邮件客户端在处理 RFC 2231 编码邮件参数时，rfc2231_get_param 函数存在整数符号错误（signedness error），攻击者可利用负数索引触发越界数组访问。未经身份认证的远程攻击者仅需向目标用户发送一封特制邮件即可利用该漏洞，进而在目标系统上执行任意代码。该漏洞影响 Pine 4.58 之前的所有版本，CVSS v2 评分为 7.5，危害等级为 High。攻击无需复杂交互条件，用户只需正常接收或预览邮件即可触发代码执行，具有较高的远程利用风险。"
published = "2003-09-17T04:00:00Z"
remediation = "建议立即升级 PINE 邮件客户端至 4.58 或更高版本（如 Alpine 2.00+），可从官方源 https://alpine.x10host.com/alpine/ 下载最新版本。若暂时无法升级，可配置邮件服务器拦截包含异常 RFC2231 参数的邮件，或禁用 PINE 的 MIME 解析功能作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "华盛顿大学 Pine 邮件客户端越界数组访问远程代码执行漏洞"
updated = "2026-06-16T22:02:42Z"

