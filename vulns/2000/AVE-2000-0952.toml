[basic]
description = 'Check Point VPN-1/FireWall-1 4.1 及更早版本存在安全绕过漏洞，远程攻击者可绕过防火墙的连接方向性检查机制。具体而言，攻击者通过发送分片的 TCP 连接请求或重新打开已关闭的 TCP 连接请求，可欺骗防火墙使其认为该出站连接是由内部主机发起的，从而绕过 "单向连接强制" 安全规则，建立未经授权的到内部网络的连接。该漏洞影响所有部署受影响版本的企业边界防护设备，攻击者无需身份认证即可在任意网络位置发起利用，导致部分内部信息泄露及未授权访问。CVSS v2 评分为 7.5（高危），攻击向量为网络、攻击复杂度低、无需认证，对机密性、完整性和可用性均造成部分影响。Check Point 已在官方安全公告中发布修复建议。'
published = "2000-11-14T05:00:00Z"
remediation = "立即升级 Check Point FireWall-1 至 4.1 SP2 或更高版本，或升级至 FireWall-1 Next Generation (NG)。如暂时无法升级，请在防火墙策略中添加规则拒绝所有 IP 分片数据包（在 SmartDashboard 的规则中设置 IP 分片匹配条件为拒绝），并在内核参数中设置 fw ctl set int fwenforce_oneway_check 1 强制启用单向连接检测，同时确保防火墥墙不在半透明模式下运行。重启防火墙服务后通过 fw ctl zdebug drop 命令验证分片数据包是否被正确丢弃。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Check Point VPN-1/FireWall-1 安全绕过漏洞"
updated = "2026-06-16T21:52:30Z"

