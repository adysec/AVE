[basic]
description = 'Jetty HTTP Server 4.1.0 之前版本中的 CGIServlet 存在目录遍历漏洞，远程攻击者无需身份认证即可向 cgi-bin 目录发送包含 `..\`（点-点-反斜杠）序列的恶意 HTTP 请求，绕过路径限制访问任意目录并执行任意命令。该漏洞影响 Jetty 3.1.6/3.1.7/4.1 等版本，CVSS 评分 5.0，危害等级中危。建议升级至 Jetty 4.1.0 或更高版本以修复此漏洞。'
published = "2002-10-11T04:00:00.000"
remediation = '升级 Jetty 至 4.1.0 或更高版本，该版本修复了 CGIServlet 对 `..\` 序列的路径校验缺陷。如无法升级，可禁用 CGIServlet 或通过反向代理限制对 `/cgi-bin/` 路径的访问，并过滤包含 `..\` 的请求。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Jetty HTTP Server CGIServlet 目录遍历任意命令执行漏洞"
updated = "2026-06-16T21:58:52.913"

