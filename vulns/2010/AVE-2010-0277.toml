[basic]
description = "RealNetworks RealPlayer 11.0至11.1版本、RealPlayer SP 1.0至1.1.5版本以及Linux RealPlayer 11.0.2.1744版本中的Advanced Audio Coding（AAC）帧数据处理存在基于堆的缓冲区溢出漏洞。远程攻击者可通过向目标用户发送特制的包含恶意conditional component的AAC媒体文件，诱使用户在RealPlayer中打开该文件，触发堆缓冲区溢出，从而导致任意代码执行。该漏洞CVSS评分9.3，危害等级严重，影响Windows和Linux多平台版本。"
published = "2010-12-14T16:00:05Z"
remediation = "立即升级 RealPlayer 至 12.0.1.609 或更高版本，该版本已修复 AAC 帧数据条件组件中的堆缓冲区溢出漏洞。如无法升级，可在浏览器中禁用 RealPlayer 插件，或通过防火墙阻止 RealPlayer 对外部媒体的自动连接请求作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer AAC帧数据条件组件堆缓冲区溢出漏洞"
updated = "2026-06-16T23:24:42Z"

