[info]
author = "ave"
description = "AVE-2020-1982 verification"
id = "POC-AVE-2020-1982"
name = "PoC for AVE-2020-1982"
severity = "medium"
tags = ["ave-2020-1982"]
vuln_id = ["AVE-2020-1982"]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/api_jsonrpc.php"
protocol = "http"

[poc.requests.body]
content = '{"jsonrpc":"2.0","method":"user.login","params":{"user":"Admin","password":"wrong"},"id":1}'
type = "json"

[poc.requests.headers]
Content-Type = "application/json"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["No permissions"]
