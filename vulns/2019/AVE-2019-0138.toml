[basic]
description = "Allied Telesis AT-GS950/8 交换机基于 Web 的管理界面存在路径遍历漏洞（CWE-22），攻击者可利用此漏洞读取服务器上的任意系统文件。该漏洞影响固件版本 AT-S107 V.1.1.3 [1.00.047] 及更早版本。未经身份认证的远程攻击者只需发送经过特殊构造的 HTTP GET 请求即可触发该漏洞，无需任何认证条件。由于该产品已进入生命周期终止（End-of-Life）阶段，官方不再提供安全更新与补丁修复。CVSS 评分为 7.5（高危），攻击者可借此获取服务器上的敏感配置文件、日志文件及其他系统资源信息。"
published = "2019-11-29T19:15:11.980"
remediation = "升级至 Allied Telesis 发布的最新非受影响固件版本（若存在）。若设备已停止支持，应将 Web 管理接口限制在专用管理 VLAN 内，通过防火墙仅允许受信任的管理 IP 访问，并禁用不必要的远程管理服务。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Allied Telesis AT-GS950/8 路径遍历漏洞"
updated = "2026-06-17T02:25:34.947"

