[basic]
description = "Apple iOS 及 Safari 浏览器中 WebKit 组件存在内存破坏漏洞，攻击者可通过构造包含特制 TIFF、PNG 或 JPEG 图像的恶意网页，触发 ImageIO 处理过程中的内存错误，从而在目标系统上执行任意代码或导致应用崩溃。该漏洞影响 Apple iOS 6.0 之前版本及 Safari 6.0.1 之前版本，无需用户交互即可被远程利用，CVSS 评分为 6.8，危害等级中等。"
published = "2012-09-13T10:30:20.587"
remediation = "升级 Apple iOS 至 6.0 或更高版本，或升级 Safari 至 6.0.1 及以上版本，或升级 Apple iTunes 至 10.7 及以上版本以修复 WebKit 内存破坏漏洞。iOS 用户可通过设备设置中的「软件更新」功能直接升级；macOS 用户应通过 Mac App Store 更新 Safari 和 iTunes。如暂无法升级，建议在 Safari 中禁用 JavaScript 作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iOS WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:42.910"

