[basic]
description = "Apache Tomcat 的 AJP（Apache JServ Protocol）连接器存在文件读取与包含漏洞（Ghostcat）。由于 Tomcat 默认将 AJP 连接视为比 HTTP 连接更高信任级别，当 AJP 端口（默认 8009）暴露给不可信网络时，未经身份认证的远程攻击者可通过构造特制的 AJP 请求包，实现从 Web 应用任意位置读取任意文件，或将任意文件作为 JSP 解析执行。若 Web 应用允许文件上传，攻击者可上传恶意 JSP 文件后通过 AJP 协议触发解析，进而实现远程代码执行。该漏洞影响 Apache Tomcat 7.x（至 7.0.99）、8.5.x（至 8.5.50）及 9.0.x（至 9.0.30）版本，CVSS 评分 9.8，危害等级严重。"
published = "2020-02-24T22:15:12Z"
remediation = '升级 Apache Tomcat 至 9.0.31、8.5.51 或 7.0.100 及以上版本。如无法升级，在 server.xml 中禁用 AJP Connector（注释 `<Connector protocol="AJP/1.3"` 行）；若必须使用 AJP，添加 `requiredSecret="yourSecret"` 属性并设置 `address="127.0.0.1"` 限制本地访问。'
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Apache Tomcat AJP 文件读取与远程代码执行漏洞"
updated = "2026-06-17T03:02:39Z"

