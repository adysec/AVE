[basic]
description = "Windows 安全内核模式（Secure Kernel Mode）存在权限提升漏洞，其根源在于对关键资源的权限分配不当（CWE-732）。本地低权限攻击者可通过向安全内核发送特制的系统调用，利用该漏洞获取 SYSTEM 权限，从而完全控制目标系统，实现任意代码执行、数据窃取或安装持久化后门。该漏洞影响所有受支持的 Windows 10/11 及 Windows Server 版本，CVSS 评分 7.8，危害等级高。攻击者需具备本地登录能力，但无需用户交互，降低了利用门槛。Microsoft 已在 2025 年 1 月安全更新（KB5050021）中修复此漏洞。"
published = "2025-01-17T01:15:31Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 KB5050021，将 Windows 11 22H2 升级至 OS Build 22621.4751、23H2 升级至 22631.4751。可通过 Windows Update 自动更新或从 Microsoft 更新目录手动下载安装。该漏洞需本地访问且需低权限，建议同时限制非管理用户本地登录权限作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 安全内核模式特权提升漏洞"
updated = "2026-06-17T08:43:06Z"

