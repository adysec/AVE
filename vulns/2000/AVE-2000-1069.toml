[basic]
description = "HP JetDirect 打印机网卡固件 x.08.20 及更早版本的 Telnet 服务存在缓冲区溢出漏洞。远程攻击者无需身份认证即可通过网络向目标设备的 Telnet 端口发送特制的超长数据，触发缓冲区溢出，导致 Telnet 服务崩溃，造成拒绝服务。该漏洞影响 HP JetDirect X.08.04/X.08.05/X.08.20 等系列固件版本，CVSS 评分 5.0，危害等级中危。"
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 HP JetDirect 打印机网卡固件至 x.08.20 以上版本，固件更新包可从 HP 官方支持网站下载（原链接 http://www.hp.com/cposupport/networking/software/allhpjd3.exe.html）。如无法立即升级，可在网络边界防火墙或路由器上禁用对打印机 Telnet 服务（默认端口 23）的入站访问，仅允许受信任管理 IP 连接，以降低远程攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "HP JetDirect 打印机卡 Telnet 服务缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:53:04.720"

