[basic]
description = "RSA ACE/Server 存在认证请求端口 UDP 洪泛拒绝服务漏洞。远程攻击者无需身份认证即可向目标服务器的认证请求端口发送大量 UDP 数据包，导致服务器处理过载而崩溃，造成拒绝服务。该漏洞影响 RSA ACE/Server 4.1 及更早版本，攻击条件简单，无需特殊权限即可实施。"
published = "2000-06-08T04:00:00.000"
remediation = "立即升级 RSA ACE/Server 至 4.1 或更高版本，并应用 RSA Security 官方发布的 DoS 补丁（原发布于 ftp://ftp.securid.com/support/outgoing/dos/）。如无法立即升级，在防火墙上限制对服务器认证端口 5500/UDP 的访问，仅允许受信任的管理网段 IP 与其通信，以阻断外部 UDP 洪水攻击。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "RSA ACE Server 认证端口UDP泛洪拒绝服务漏洞"
updated = "2026-06-16T21:51:54.970"

