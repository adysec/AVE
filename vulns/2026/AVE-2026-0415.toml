[basic]
description = "Prompty TypeScript 加载器在解析 .prompty 文件前置内容时，直接调用 gray-matter 库且未禁用 JavaScript 前置内容引擎，导致攻击者可构造包含 ---js 可执行前置内容的恶意 .prompty 文件。受影响版本为 @prompty/core v2 预发布版本（>=2.0.0-alpha.1 <2.0.0-beta.3），攻击者诱导受害应用加载恶意提示词文件即可在 Node.js 宿主进程中执行任意 JavaScript 代码，影响加载不可信提示词文件、用户提供提示词路径或来自低信任源提示词包的应用。攻击条件为网络可达、低攻击复杂度、无需权限但需用户交互（诱导加载恶意文件），CVSS 4.0 评分 8.7（HIGH）。升级至 @prompty/core@2.0.0-beta.3 或更高版本可修复，修复显式禁用 js/javascript 前置内容引擎并拒绝执行。修复提交：c27402da2487075be577f06aa79df627fb9d6853。"
published = "2026-07-16T16:19:12Z"
remediation = "立即升级 @prompty/core 至 2.0.0-beta.3 或更高版本（npm install @prompty/core@2.0.0-beta.3）。修复版本已显式禁用 gray-matter 的 js/javascript 前置代码引擎，拒绝执行 ---js 前置内容。暂无法升级时，请勿加载不可信的 .prompty 文件，并限制用户提示路径仅限可信目录。补丁提交：c27402da2487075be577f06aa79df627fb9d6853，已包含拒绝 ---js 前置内容的回归测试。"
score = 8.7
severity = "HIGH"
sources = ["ghsa"]
title = "Microsoft Prompty 任意代码执行漏洞"
updated = "2026-07-18T03:16:36Z"

