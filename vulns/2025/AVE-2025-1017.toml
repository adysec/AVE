[basic]
description = "Linux 内核 mm/migrate_device 子系统中存在释放后使用漏洞。当设备内存迁移操作在 migrate_device_finalize() 函数中执行时，无论迁移成功还是失败，目标 folio 的 memcg_data 可能已被清零或未正确设置，但代码仍错误地调用 folio_putback_lru() 将其添加至 LRU 链表，导致内存控制组代码在处理该 folio 时触发无效引用，可能引发内核崩溃或权限提升。该漏洞影响支持异构内存管理（HMM）及设备私有内存迁移的 Linux 内核版本，攻击者需在目标系统具有本地低权限访问权限，且无需用户交互即可通过触发特定内存迁移路径（如 hmm-tests 中的设备私有内存迁移场景）利用此漏洞，造成拒绝服务或潜在的本地权限提升风险。"
published = "2025-03-12T10:15:19Z"
remediation = "升级 Linux 内核至各发行版最新安全版本：Red Hat Enterprise Linux 9 安装 kernel-5.14.0-427.18.1.el9_5 或更高版本（RHSA-2025:20518）；Ubuntu 22.04/24.04 安装 5.15.0-125-generic 或 6.8.0-35-generic 及更高版本；SUSE Linux Enterprise 15 SP6/SP7 安装 5.14.0-427.18.1 或更高版本（SUSE-SU-2025:01967-1）。重启系统使新内核生效。若无法立即重启，可通过 cgroup v2 限制设备内存迁移的触发频率作为临时缓解。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 设备内存迁移 释放后使用漏洞"
updated = "2026-07-14T13:17:25Z"

