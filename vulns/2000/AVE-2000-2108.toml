[basic]
description = "WinVNC安装时创建的WinVNC3注册表项权限配置不当，对Everyone用户组开放读取与修改权限。拥有基本用户账户的攻击者可直接访问该注册表项，读取其中存储的VNC密码等敏感信息，或篡改配置绕过认证机制，获得未授权远程桌面访问权限并提升系统特权。该漏洞影响安装了WinVNC的Windows系统，攻击条件为攻击者具备基本用户身份且能访问目标主机注册表，利用方式简单直接，无需复杂操作即可造成敏感信息泄露与系统完全失控。"
published = "2001-01-09T05:00:00Z"
remediation = '建议立即升级到 TightVNC 2.0 或更高版本（或 RealVNC、UltraVNC 的最新版本），这些版本已修复 WinVNC3 注册表权限配置问题。若无法立即升级，可手动修改注册表权限：打开 regedit，定位到 HKEY_LOCAL_MACHINE\SOFTWARE\ORL\WinVNC3，右键选择权限，移除 Everybody 组的写入权限，仅保留 SYSTEM 和 Administrators 组的完全控制权限。临时缓解措施：在防火墙层面限制 VNC 服务端口（默认 5900）的访问，仅允许可信网络连接，并启用 VNC 强密码认证。'
score = 9
severity = "CRITICAL"
sources = ["avd"]
title = "AT&T WinVNC 注册表权限配置不当导致敏感信息泄露与权限提升漏洞"
updated = "2026-06-16T21:53:17Z"

