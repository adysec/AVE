[basic]
description = 'Fetchmail 6.1.3 及更早版本存在基于堆的缓冲区溢出漏洞。该漏洞在解析邮件头部中的本地邮件地址时，未正确考虑 "@" 字符的长度计算，导致缓冲区大小分配不当。未经身份认证的远程攻击者可通过向邮件服务器发送包含大量本地地址的特制邮件头数据包触发该溢出漏洞，从而在目标系统上执行任意代码。该漏洞影响使用 Fetchmail 作为邮件客户端的服务器系统，攻击者可利用此漏洞完全控制受影响的系统，CVSS 评分为 7.5，危害等级高。攻击者无需任何前置权限或交互即可远程利用此漏洞，仅需向目标发送一封构造好的恶意邮件即可实现攻击。'
published = "2002-12-23T05:00:00Z"
remediation = '建议立即升级 Fetchmail 到 6.1.4 或更高版本，该版本已修复缓冲区长度计算中未正确处理 "@" 字符的问题。升级前可从官方源（fetchmail.sourceforge.io）获取补丁包，通过包管理器或手动编译安装。若暂时无法升级，可在防火墙或邮件网关处过滤包含大量本地地址的邮件头字段，或暂时禁用 Fetchmail 的本地地址解析功能作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Fetchmail 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:59:11Z"

