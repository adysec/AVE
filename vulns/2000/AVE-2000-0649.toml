[basic]
description = 'Microsoft IIS 4.0/5.0 及 Personal Web Server (PWS) 存在 Unicode 编码目录遍历漏洞。由于 IIS 在处理包含特殊 Unicode 编码字符（如 "%c1%1c"）的 URL 时未能正确过滤路径遍历序列，远程攻击者无需身份认证即可通过发送特制的 HTTP 请求绕过 Web 根目录限制，实现跨目录读取服务器上的任意文件（如 ASP 源码、配置文件等），甚至结合上传功能可能导致任意命令执行。该漏洞利用难度低，影响大量 Windows 服务器，曾广泛用于 Web 服务器入侵。'
published = "2000-12-19T05:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-078 提供的补丁：IIS 4.0 安装 Windows NT 4.0 Security Rollup，IIS 5.0 升级至 Windows 2000 Service Pack 1 或更高版本。同时部署 IIS Lockdown Tool 和 URLScan 过滤器，阻止包含 `%c0%ae%c0%af` 等畸形 Unicode 编码的请求，并禁用不需要的虚拟目录权限。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft IIS 4.0/5.0 Unicode 编码目录遍历漏洞"
updated = "2026-06-16T21:52:40.277"

