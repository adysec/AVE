[basic]
description = "Linux 内核 iwlwifi Wi-Fi 驱动在处理固件文件时存在越界读取漏洞。该驱动读取 TLV 结构中的字符串时未验证固件文件是否以 NUL 字节结尾，若字符串超出 TLV 缓冲区边界且该 TLV 为文件中最后一个结构，则可能读取文件缓冲区以外的内存。具有本地访问权限的低权限攻击者可通过加载特制固件文件触发此漏洞，导致系统内存信息泄露或拒绝服务。该漏洞影响使用 Intel Wi-Fi 硬件的 Linux 系统，CVSS 评分 7.1，危害等级高。官方补丁已通过限制打印格式为缓冲区实际大小来修复此问题。"
published = "2025-04-01T16:15:20Z"
remediation = "将 Linux 内核升级至修复版本：对于 5.4 系列升级到 5.4.291 或更高版本，5.10 系列升级到 5.10.235，5.15 系列升级到 5.15.179，6.1 系列升级到 6.1.131，6.6 系列升级到 6.6.83，6.12 系列升级到 6.12.19，6.13 系列升级到 6.13.7。Debian 用户可执行 apt update && apt upgrade linux-image 升级到 bullseye 的 5.10.237-1 或 bookworm 的 6.1.133-1。如暂时无法升级内核，可通过 modprobe -r iwlwifi 卸载 Intel 无线网卡驱动模块作为临时缓解措施，或使用有线网络替代无线连接以规避该驱动代码路径。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux iwlwifi WiFi驱动 越界读取漏洞"
updated = "2026-06-17T08:44:34Z"

