[basic]
description = "XChat IRC 客户端在处理 /dns 命令时存在命令注入漏洞。当用户对某个主机执行 DNS 反向查询时，如果该主机的 DNS 反向解析记录中包含 shell 元字符（如反引号、管道符、分号等），XChat 未对查询结果进行充分过滤和转义，直接将其传递给 shell 执行，导致远程攻击者可通过控制 DNS 解析记录，诱使受害者执行 /dns 命令，从而在受害者系统上执行任意命令。该漏洞影响 XChat 1.4.x 及更早版本，攻击者无需身份认证即可利用，危害严重。"
published = "2002-06-25T04:00:00Z"
remediation = "升级 XChat 至 1.8.8 或更高版本，该版本修复了 /dns 命令对 DNS 反向查询结果中 shell 元字符的过滤问题。Red Hat Linux 用户安装 RHSA-2002:097 或 RHSA-2002:124 更新包，Mandrake Linux 用户安装 MDKSA-2002:051 更新。临时缓解措施：避免在不可信频道中对未知主机执行 /dns 命令。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "XChat IRC客户端远程代码执行漏洞"
updated = "2026-06-16T21:57:19Z"

