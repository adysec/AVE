[basic]
description = "tags.<value>Linux 内核 af_unix.c 中的 unix_scm_to_skb 函数存在竞态条件导致的释放后使用漏洞。攻击者可利用该缺陷在目标系统上实现本地权限提升至 System 执行权限，无需用户交互即可触发。该漏洞影响 Android 内核及基于 Linux 内核的 Android 设备，利用者需具备本地访问权限即可发起攻击。"
published = "2021-12-15T19:15:11.017"
remediation = "升级 Android 系统至 2021 年 11 月安全补丁级别及以上（Android 安全公告 2021-11-01 已修复该漏洞）。若使用 Debian 系统，请将 linux 内核包升级至 4.9.290-1（stretch）或 7:4.3.3-0+deb11u1（bullseye）及以上版本。修复内核中 af_unix.c 的 unix_scm_to_skb 函数竞态条件导致的 use-after-free 问题，消除本地权限提升风险。"
score = 6.4
severity = "MEDIUM"
sources = ["kev"]
title = "Google Android 内核竞态条件Use-After-Free本地权限提升漏洞"
updated = "2026-06-17T03:30:39.430"

