[basic]
description = "Windows 电话服务（Telephony Service）存在远程代码执行漏洞，源于 TapiServer.dll 组件在处理畸形输入数据时存在内存处理缺陷（相关类型为 CWE-122）。远程攻击者可通过诱导用户访问恶意构造的链接或连接至攻击者控制的资源，使系统电话服务解析特定数据，从而在受影响主机上以当前用户权限执行任意代码。利用此漏洞攻击复杂度较低且无需任何特权，但需要用户交互配合才能触发，可能进一步结合权限提升实现完全控制。该漏洞影响主要 Windows 10/11 及 Windows Server 等版本，CVSS 3.1 评分为 8.8，危害等级为高危。Microsoft 已在 2025 年 1 月安全更新（如 KB5049983、KB5049984 等）中发布修复补丁，建议用户尽快安装更新以消除风险。"
published = "2025-01-14T18:15:43Z"
remediation = "建议立即安装微软 2025 年 1 月安全更新（KB5049981，对应 Windows 10/11 与 Windows Server 2022），或通过「设置 → Windows 更新」启用自动更新并重启系统完成部署。该漏洞源于 Telephony Service 对内存对象的处理错误，攻击者需诱导用户在受影响主机上打开恶意文件或访问恶意网站方可远程利用，因此作为临时缓解措施：可在企业边界与终端防火墙上封堵并限制对 control 通信的访问，并通过组策略禁用或限制 Windows 电话服务（Telephony Service，服务名 Tapisrv）的启动类型，同时加强用户安全意识培训，禁止打开来源不明的文件与链接。若无法立即打补丁，请在非必要环境暂缓暴露远程桌面等服务入口，降低被利用面。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Windows Telephony Service Remote Code Execution Vulnerability 漏洞"
updated = "2026-06-17T08:42:54Z"

