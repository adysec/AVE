[basic]
description = 'Mozilla Firefox 4.x 至 9.0 以及 SeaMonkey 2.7 之前版本在 Linux 和 Mac OS X 系统上存在不安全文件权限漏洞。当用户导出 Firefox Sync 密钥时，生成的 "Firefox Recovery Key.html" 文件权限设置不当，导致其他本地用户可通过标准文件系统操作读取该文件内容，从而获取 Firefox Sync 同步密钥，造成敏感信息泄露。攻击者需具有本地系统访问权限，利用难度较低。'
published = "2012-02-01T16:55:01Z"
remediation = "升级 Mozilla Firefox 至 10.0 及以上版本，SeaMonkey 至 2.7 及以上版本，Thunderbird 至 10.0 及以上版本。如无法立即升级，确保 Firefox Sync 恢复密钥文件（Firefox Recovery Key.html）所在目录权限为 700，仅允许当前用户访问，并避免在多用户共享系统上使用 Firefox Sync 密钥导出功能。"
score = 2.1
severity = "LOW"
sources = ["tenable"]
title = "Mozilla Firefox 和 SeaMonkey 恢复密钥文件权限漏洞"
updated = "2026-06-16T23:37:17Z"

