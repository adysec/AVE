description = '''
Rational ClearCase 3.2/4.x 及更早版本中的 db_loader 组件存在缓冲区溢出漏洞。程序在处理 TERM 环境变量时未正确校验长度，本地攻击者可通过设置过长的 TERM 环境变量触发栈溢出，进而以 root 权限执行任意代码。该漏洞影响 ClearCase 4.2 及更早版本（含 3.2/4.x），攻击条件为具备本地用户权限且无需额外认证；成功利用后可完全破坏机密性、完整性与可用性，CVSS 评分为 7.2，危害等级高。"""
```

