[basic]
description = "OpenLDAP 2（OpenLDAP2）2.2.0 及更早版本存在多处缓冲区溢出漏洞。远程攻击者可通过以下五种方式触发该漏洞：向 slurpd 传递超长的 -t 或 -r 参数；提交恶意构造的 ldapfilter.conf 文件，getfilter 函数未能正确处理导致溢出；提交恶意 ldaptemplates.conf 文件导致 libldap 发生溢出；构造特定的访问控制列表触发 slapd 溢出；或利用日志记录拒绝复制请求时生成超长文件名。成功利用该漏洞可导致远程代码执行，CVSS 评分 7.5，影响范围广泛。"
published = "2003-01-02T05:00:00Z"
remediation = "升级 OpenLDAP 至 2.2.1 或更高版本。各发行版用户请安装对应安全更新：Debian 用户运行 apt-get install slapd 更新至 DSA-227 修复版本；Red Hat 用户安装 RHSA-2003-040 提供的更新包；SuSE Linux 用户安装 advisory 2002-47-0047 提供的修补包。如无法立即升级，可在 slapd 配置中限制访问控制列表（ACL）的复杂规则，并避免使用 slurpd 的 -t/-r 长参数传递不可信输入。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "OpenLDAP OpenLDAP 2 多缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:59:12Z"

