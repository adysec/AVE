[basic]
description = "Mozilla Firefox 4.x至9.0、Thunderbird 5.0至9.0及SeaMonkey 2.7之前版本在处理image/vnd.microsoft.icon格式图标图像时，未正确初始化内存数据。远程攻击者可通过构造特制的ICO图标文件，诱使用户访问恶意网页触发转换过程，导致未初始化的内存数据作为填充字节被编码到生成的PNG图像中，从而泄露堆内存中的敏感信息。该漏洞无需身份认证，攻击复杂度低，影响范围广泛。"
published = "2012-02-01T16:55:01Z"
remediation = "立即升级 Mozilla Firefox 至 10.0 或更高版本，Thunderbird 升级至 10.0 或更高版本，SeaMonkey 升级至 2.7 或更高版本。可通过浏览器内置的「关于」页面检查更新并自动安装。如无法立即升级，可在浏览器设置中禁用 ICO 图片格式的自动渲染，或使用 NoScript 等扩展限制不可信网站的图片加载作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla 多款产品 ICO 图像解析信息泄露漏洞"
updated = "2026-06-16T23:37:17Z"

