[basic]
description = "GNU GRUB2 的 reiserfs 文件系统模块在处理符号链接时存在整数溢出漏洞。攻击者可通过挂载特制的 reiserfs 文件系统，利用文件系统几何参数中用户可控的数值触发缓冲区大小计算溢出，导致 grub_malloc() 分配过小的内存缓冲区，进而在 grub_reiserfs_read_symlink() 调用 grub_reiserfs_read_real() 时使用溢出的长度参数，造成堆越界写入。该漏洞可被利用来破坏 GRUB 内部关键数据，实现任意代码执行，从而绕过 Secure Boot 保护机制。攻击者需要本地高权限访问并具备较高的攻击复杂度。"
published = "2025-03-03T18:15:30Z"
remediation = "立即升级 GRUB2 至修复版本：Debian 用户升级至 2.06-3~deb11u7（bullseye）或 2.06-13+deb12u2（bookworm）；Ubuntu 用户安装对应安全更新；RHEL/CentOS 用户安装最新 grub2 安全更新。升级后执行 `grub2-install` 重新安装引导程序并重启。如无法立即升级，可在 grub.cfg 中禁用 reiserfs 模块（`insmod reiserfs` 前加 `#` 注释），并避免使用 reiserfs 作为 /boot 分区。"
score = 6.4
severity = "MEDIUM"
sources = ["msrc"]
title = "GNU GRUB reiserfs 模块整数溢出漏洞"
updated = "2026-06-30T00:16:50Z"

