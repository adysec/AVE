[basic]
description = "tags as specified.<value>SGI IRIX 6.2 和 6.3 版本中的 gr_osview 程序存在缓冲区溢出漏洞，本地攻击者可通过向 -D 参数传递超长字符串触发栈溢出，覆盖返回地址并执行任意代码，从而提升至 root 权限。该漏洞影响运行 IRIX 6.2/6.3 的 SGI 工作站和服务器，攻击需本地账户访问权限，利用方式为构造恶意 -D 参数调用 /usr/sbin/gr_osview。CVSS 评分 7.2（AV:L/AC:L/Au:N/C:C/I:C/A:C），属于高危本地提权漏洞。"
published = "2000-10-20T04:00:00Z"
remediation = "建议升级至 SGI IRIX 6.5.10 或更高版本（已修复该缓冲区溢出），或安装 SGI 发布的安全补丁集（如 Patch 3651）。若无法立即升级，可执行 chmod u-s /usr/sbin/gr_osview 移除 setuid 位，限制普通用户执行权限作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "SGI IRIX gr_osview 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:30Z"

