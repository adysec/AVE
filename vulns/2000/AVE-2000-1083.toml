[basic]
description = "tags.<value>SonicWALL SOHO Firewall 4.0/5.0 的 Web 访问服务存在拒绝服务漏洞。远程攻击者无需身份认证即可通过向目标系统发送空的 HTTP GET 或 POST 请求，触发 Web 服务器异常，导致服务崩溃或不可用。该漏洞影响运行 SonicWALL SOHO Firewall 4.0 和 5.0 版本的设备，攻击者仅需知道目标 IP 地址和 Web 服务端口即可发起攻击，无需任何身份验证或特殊权限。由于 Web 服务不可用，受影响设备将无法提供防火墙保护和网络访问控制功能。"
published = "2001-01-09T05:00:00.000"
remediation = "立即将 SonicWALL SOHO Firewall 升级至 SonicOS 6.x 及以上版本，该版本已修复空 HTTP 请求导致拒绝服务的缺陷。若无法立即升级，可采取以下缓解措施：在防火墙管理界面中，将 Web 管理访问限制为仅允许可信 IP 段访问，并启用 SonicOS 内置的入侵防御（IPS）规则集以拦截异常空请求；同时在边界路由器上配置 ACL，拒绝来自外部网络的对防火墙管理端口（如 80/443）的非必要访问。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "SonicWALL SOHO Firewall 拒绝服务漏洞"
updated = "2026-06-16T21:53:08.543"

