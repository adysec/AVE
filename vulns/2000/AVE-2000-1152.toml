[basic]
description = "Microsoft Windows 2000 SP2 之前版本在非 Windows 2000 域环境中使用 NTLM 认证时，若本地缓存了账户凭据，存在账户锁定策略绕过漏洞。本地用户可通过利用本地缓存的凭据进行无限次登录尝试，绕过系统的账户锁定机制，从而实施暴力破解攻击。该漏洞影响 Windows 2000 SP2 之前版本，CVSS 评分 4.6，危害等级中危。攻击者需具备本地访问权限，攻击复杂度较低。"
published = "2000-11-21T05:00:00.000"
remediation = "立即安装 Microsoft 发布的 MS00-089 安全更新补丁（下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=45C7A628-CE0E-49D5-B7A7-3A71B2FF4C97），或升级至 Windows 2000 Service Pack 2（SP2）及以上版本。如无法立即打补丁，可将 Windows 2000 机器加入纯 Windows 2000 域环境（使用 Kerberos 认证替代 NTLM），或在防火墙层面阻止 NetBIOS 端口（137-139、445）以限制远程攻击入口。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows 2000 域账户锁定策略安全绕过漏洞"
updated = "2026-06-16T21:53:24.150"

