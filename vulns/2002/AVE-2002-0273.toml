[basic]
description = "Macromedia Shockwave Flash 解码器存在边界检查漏洞，当解码器遇到具有恶意 SWF 文件头部的文件时，由于头部指定的数据长度不足以包含后续的实际数据，它会允许读取超出缓冲区范围的数据，从而引发整数溢出或缓冲区溢出漏洞。该漏洞影响所有安装了 Flash Player 的用户，攻击者可远程发送特制的 SWF 文件无需认证即可触发，导致攻击者在用户权限下执行任意代码，破坏系统的完整性、机密性和可用性，安全风险极高，已确认存在相关的攻击利用代码。"
published = "2002-08-12T04:00:00Z"
remediation = "立即安装 Adobe Shockwave Flash 6 Update 3 或更高版本（包含安全修复），或将 Flash 升级到 7.x 系列并应用 2002 年 8 月安全补丁，如无法立即更新，可通过浏览器禁用 Flash 插件并限制 SWF 文件加载以缓解风险。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Macromedia Shockwave Flash 代码执行漏洞"
updated = "2026-06-16T21:58:15Z"

