[basic]
description = "Apple Safari 及 iOS 中使用的 WebKit 引擎存在未明内存破坏漏洞（CWE-119），远程攻击者可通过诱导用户访问特制网站触发内存损坏，导致任意代码执行或应用程序崩溃。该漏洞影响 Safari 5.1.4 之前版本、iOS 5.1 之前版本及 iTunes 10.6 之前版本，CVSS 评分 9.3，危害等级严重。用户无需额外交互即可被攻击，攻击复杂度中等。Apple 已在 2012 年 3 月安全更新中修复此漏洞。"
published = "2012-03-08T22:55:03Z"
remediation = "建议将 iOS 升级至 5.1 或更高版本，将 Safari 升级至 5.1.4 或更高版本，将 iTunes 升级至 10.6 或更高版本。Apple 于 2012 年 3 月发布了安全更新 APPLE-SA-2012-03-07-1 和 APPLE-SA-2012-03-07-2 修复该漏洞，可通过系统设置中的软件更新或访问 Apple 支持页面下载对应补丁。如暂无法升级，应避免使用受影响版本访问不可信网站，并限制浏览器对恶意内容的解析能力。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:56Z"

