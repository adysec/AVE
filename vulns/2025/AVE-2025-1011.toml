[basic]
description = "标签之间。<value>Linux 内核的 sockmap 与 vsock 子系统存在空指针解引用漏洞。sockmap 期望所有 vsock 都具备已分配的 transport，但可连接的 vsock socket 在失败的 connect() 尝试后切换至 TCP_LISTEN 状态时，其 transport 可能已丢失或残留无效指针。当此类 listening vsock 被挂载到 sockmap 时，会在 vsock_read_skb 函数中触发空指针解引用，导致内核崩溃。本地低权限攻击者可通过创建 vsock socket、发起失败连接后监听并映射至 sockmap，即可触发拒绝服务。该漏洞影响使用 sockmap 和 vsock 的 Linux 内核系统，CVSS 评分 5.5。"
published = "2025-03-12T10:15:18Z"
remediation = "立即升级 Linux 内核至包含修复补丁的安全版本。对于主流发行版：SUSE Linux Enterprise 15 应升级至 2025 年 3 月发布的安全更新内核（SUSE-SU-2025:02997-1、SUSE-SU-2025:01964-1）；Ubuntu/Debian 用户应安装对应的 linux-image 安全更新；Fedora/RHEL 用户应升级至最新内核版本。从 upstream 视角，6.4 系列内核需升级至 6.6.80 或更高，6.7-6.12 系列需升级至 6.12.17 或更高，6.13 系列需升级至 6.13.5 或更高。如暂时无法升级内核，可临时禁用 sockmap BPF 程序或限制本地低权限用户对 vsock 设备的访问作为缓解措施。补丁提交包括 22b683217ad2112791a708693cb236507abd637a 和 8fb5bb169d17cdd12c2dcc2e96830ed487d77a0f。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 vsock 空指针解引用漏洞"
updated = "2026-06-17T08:44:27Z"

