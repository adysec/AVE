[basic]
description = "QNAP NAS 设备上运行的 Photo Station 存在路径遍历漏洞，属于外部控制文件名或路径类型（CWE-22）。未经身份认证的远程攻击者可通过发送特制请求利用该漏洞，访问或修改系统文件，进而可能导致敏感信息泄露或系统被完全控制。该漏洞影响搭载 QTS 4.2.6、4.3.0 至 4.3.3、4.3.4 至 4.4.0 及 4.4.1 的 QNAP NAS 设备，相应版本的 Photo Station 均受影响。CVSS v3.1 评分 9.8（严重等级），攻击向量为网络可达、低复杂度、无需用户交互。该漏洞已被 CISA 列入已知被利用漏洞目录，且已知在勒索软件攻击中被活跃利用。QNAP 建议用户将 Photo Station 升级至 5.2.11、5.4.9、5.7.10 或 6.0.3 及以上版本以修复此问题。"
published = "2019-12-05T17:15:13Z"
remediation = "升级 Photo Station 至以下修复版本：QTS 4.4.1 系统升级 Photo Station 6.0.3 及更高版本；QTS 4.3.4–4.4.0 升级 Photo Station 5.7.10 及更高版本；QTS 4.3.0–4.3.3 升级 Photo Station 5.4.9 及更高版本；QTS 4.2.6 升级 Photo Station 5.2.11 及更高版本。同时建议将 QTS 固件升级至最新版本（QTS 4.4.1 build 20190918 或更高、QTS 4.3.6 build 20190919 或更高）。升级步骤：以管理员身份登录 QTS，进入「控制台 > 系统 > 固件更新」点击「检查更新」安装最新 QTS；然后打开 App Center，搜索「Photo Station」并点击「更新」。如无法立即升级，建议在防火墙层限制 Photo Station 的外部访问，仅允许可信网络范围内的用户访问，以降低路径遍历攻击风险。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "QNAP Photo Station 路径遍历漏洞"
updated = "2026-06-17T02:40:14Z"

