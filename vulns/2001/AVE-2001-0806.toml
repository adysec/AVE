[basic]
description = "Compaq 管理软件（如 Insight Manager 和管理代理）中的 Web 功能组件存在缓冲区溢出漏洞，攻击者可通过向 cpqlogin.htm 页面提交超长用户名参数触发栈溢出，进而在目标服务器上执行任意系统命令。该漏洞影响所有启用 Web 管理功能的 Compaq Insight Manager 及相关管理代理产品，由于攻击无需身份认证且可通过网络远程发起，CVSS 评分高达 10.0。攻击者只需构造包含特长用户名的 HTTP 请求发送至受影响的 Web 管理界面，即可利用缓冲区溢出实现远程代码执行，完全控制目标服务器。"
published = "2001-03-12T05:00:00Z"
remediation = "安装 Compaq 针对漏洞编号 SSRT0705（追踪号 A00000399318-00001263158）发布的官方补丁，将 Compaq Management Agents 升级至修复该缓冲区溢出的安全版本；若暂无法打补丁，应在防火墙或 ACL 中限制 TCP 2301 端口的访问来源，仅允许可信管理网段访问，或暂时禁用 Web-Based Management 服务；长期建议将管理软件迁移至 HP Insight Management（HP 收购 Compaq 后的后续产品）并持续保持更新。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Compaq Insight Manager 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:44Z"

