[basic]
description = "三星移动设备剪贴板服务（SemClipboardProvider）存在访问控制不当漏洞。该服务以系统进程权限运行，但其 Content Provider 未对 insert 操作设置任何权限限制，也未验证调用方的 UID。攻击者只需在受影响的 Samsung 移动设备上安装一个无需特殊权限的普通应用程序，即可通过 ContentResolver 向剪贴板 Content Provider 插入包含任意文件路径（如 _data 字段）的记录，进而获取该文件的 ParcelFileDescriptor 及原生文件描述符（fd），从而以系统进程的身份读取或写入设备本地文件系统中本受 Linux 权限或 SELinux 策略保护的敏感文件，实现权限提升。该漏洞影响三星 Android 9.0、10.0 和 11.0 系统的移动设备，受影响版本为 SMR Mar-2021 Release 1 之前的所有版本。该漏洞曾被多次用于野外在野利用链中，作为权限提升和文件系统访问的关键组件。三星已在 SMR Mar-2021 Release 1 安全更新中通过在 insert、update 和 delete 函数执行前验证调用方 UID 是否为 system（UID 1000）的方式修复了此漏洞，CISA 亦已将其列入已知被利用漏洞目录。"
published = "2021-03-04T21:15:13Z"
remediation = '三星已发布 SMR Mar-2021 Release 1 安全更新修复该漏洞，受影响的三星移动设备应立即升级至最新 Samsung Monthly Security Release（SMR）版本。用户可通过"设置 → 软件更新 → 下载并安装"检查并安装最新安全补丁。如无法立即更新，建议暂时禁用或限制第三方应用访问剪贴板的权限，并避免从不受信任的来源安装应用，以降低本地文件被读取或篡改的风险。'
score = 4.4
severity = "MEDIUM"
sources = ["kev"]
title = "三星 Android 剪贴板服务访问控制不当漏洞"
updated = "2026-06-17T03:41:53Z"

