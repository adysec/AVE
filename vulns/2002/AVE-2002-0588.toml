[basic]
description = "Novell NetWare 5.1 和 6.0 的 Web 服务器使用 Perl 5.003 作为脚本处理程序时存在代码执行漏洞，未经身份认证的远程攻击者可通过向目标服务器发送特制 HTTP POST 请求触发该漏洞，在服务器上执行任意 Perl 代码。该漏洞影响运行 Perl 5.003 的 NetWare 5.1/6.0 版本，攻击者无需凭据即可在远端系统执行命令、读取或写入文件，导致服务器被完全控制。Novell 已在后续补丁中修复此问题，升级 Perl 版本或应用官方补丁可消除风险。"
published = "2003-04-11T04:00:00.000"
remediation = "升级 NetWare 集成的 Perl 解释器至 5.6 或更高版本，或安装 Novell 官方安全补丁（TID 2963307）。如无法立即应用补丁，可临时禁用或限制对 Perl CGI 脚本的 HTTP POST 访问，并在防火墙层面过滤外部对 Web 服务器的恶意请求。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Novell NetWare HTTP POST 远程代码执行漏洞"
updated = "2026-06-16T21:59:19.540"

