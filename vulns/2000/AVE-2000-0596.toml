[basic]
description = "SGI IRIX 6.2/6.3 系统中的 dmplay 工具存在栈缓冲区溢出漏洞。本地攻击者可通过向 dmplay 命令行参数传递超长字符串触发缓冲区溢出，覆盖返回地址，从而以 root 权限执行任意代码。该漏洞影响 IRIX 6.2 及 6.3 版本，需要本地用户身份才能利用，CVSS 评分 7.2，危害等级高。SGI 已发布安全补丁修复此漏洞。"
published = "2000-10-20T04:00:00.000"
remediation = "立即升级到 SGI IRIX 的最新安全补丁版本，或从 SGI 官方获取针对 dmplay 缓冲区溢出漏洞的补丁 (SGI Security Advisory 20000801-01-P)。如无法立即打补丁，可临时移除 /usr/sbin/dmplay 的 setuid 位（执行 chmod u-s /usr/sbin/dmplay）以消除本地提权风险，但可能影响正常功能。鉴于 IRIX 已停止维护，建议迁移至受支持的替代操作系统。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "SGI IRIX dmplay 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:52:29.937"

