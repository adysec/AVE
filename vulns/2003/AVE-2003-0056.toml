[basic]
description = "Linux 内核 2.4.20 版本的 Netfilter 连接跟踪模块（CONFIG_IP_NF_CONNTRACK 或 ip_conntrack）存在拒绝服务漏洞。由于内核链表实现与连接跟踪状态机之间的不一致，Netfilter 无法正确识别处于 UNCONFIRMED 状态的连接，导致这些连接使用过长的超时时间而无法被及时清理。远程攻击者可通过持续发送大量未确认的网络连接请求，耗尽系统连接跟踪资源，造成目标系统拒绝服务。该漏洞影响启用连接跟踪功能的 Linux 2.4.20 系统，CVSS 评分 5.0，危害等级中危。"
published = "2003-08-27T04:00:00Z"
remediation = "立即升级 Linux 内核至 2.4.21 或更高版本（2.4.21 已修复此问题）；如无法升级内核，应用 Netfilter Core Team 提供的补丁（修改 ip_conntrack.h 和 ip_conntrack_core.c 中连接跟踪状态判断逻辑，引入 IPS_CONFIRMED 标志位替代链表指针判空）。临时缓解措施：卸载 ip_conntrack 模块（rmmod ip_conntrack），或在 iptables 规则中避免使用 conntrack 模块。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux Kernel Netfilter ip_conntrack 连接跟踪拒绝服务漏洞"
updated = "2026-06-16T22:01:42Z"

