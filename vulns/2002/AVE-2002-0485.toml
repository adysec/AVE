[basic]
description = "MakeBook 2.2 CGI 程序存在输入验证漏洞，远程攻击者可通过向 Name 或 Email 表单参数提交特制的恶意脚本代码，由于程序未对用户输入进行充分过滤，导致攻击者可以执行跨站脚本攻击（XSS）或服务器端包含（SSI）指令。成功利用该漏洞可窃取其他访问者的会话凭证、在 Web 服务器上执行任意 SSI 命令，影响网站数据安全。攻击无需认证，仅需诱使用户访问恶意构造的链接即可触发。"
published = "2002-10-04T04:00:00Z"
remediation = "立即停用 MakeBook 2.2 CGI 程序，该软件已停止维护且厂商失联。如必须使用，在 Apache 配置中禁用 SSI 功能（Options -Includes），并在 Web 服务器或应用入口处对 Name 和 Email 参数实施严格的输入过滤，禁止 HTML 标签和 SSI 指令字符（<、>、<!--、#exec 等）。建议迁移至其他仍在维护的留言簿程序。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Scripts for Educators MakeBook 2.2 CGI 跨站脚本漏洞"
updated = "2026-06-16T21:58:26Z"

