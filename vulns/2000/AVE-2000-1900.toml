[basic]
description = "OpenBSD 的 ssh 程序存在格式化字符串漏洞，远程攻击者无需身份认证即可利用该漏洞，通过向 ssh 服务发送特制的格式化字符串 payload，触发内存越界读写，从而获取目标系统的 root 权限。该漏洞影响 OpenBSD 及其他基于 BSD 的操作系统，CVSS 评分 10.0，危害等级严重。攻击者可在网络层面直接利用，无需用户交互，完全控制受影响系统。"
published = "2000-12-11T05:00:00.000"
remediation = "立即应用 OpenBSD 官方补丁：下载 ftp://ftp.openbsd.org/pub/OpenBSD/patches/2.7/common/028_format_strings.patch 并执行 `patch -p0 < 028_format_strings.patch` 后重新编译安装 ssh 程序。如无法升级，可在 `/etc/ssh/sshd_config` 中设置 `LogLevel VERBOSE` 减少格式字符串利用面，并限制 SSH 访问来源 IP 作为临时缓解。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "OpenBSD ssh程序格式化字符串权限提升漏洞"
updated = "2026-06-16T21:52:56.540"

