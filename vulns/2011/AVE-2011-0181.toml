[basic]
description = "Google Chrome浏览器在处理多列布局时存在Use-After-Free内存使用后期漏洞。该漏洞影响版本低于17.0.963.65的所有Chrome用户，攻击者可通过精心 crafted的网页触发多列布局渲染过程，利用释放后内存的重用实现代码执行或导致程序崩溃。远程无需认证即可利用，成功概率中等，可窃取敏感信息、破坏数据完整性并可能导致系统完全控制。该漏洞属于MITRE定义的CWE-416类错误，对浏览器安全构成严重威胁。"
published = "2012-03-05T19:55:01Z"
remediation = "建议立即升级 Google Chrome 至 17.0.963.65 或更高版本。可通过 Chrome 菜单→帮助→关于 Google Chrome 自动更新，或访问 google.com/chrome 下载最新版。若暂时无法升级，建议禁用 JavaScript 或避免访问不可信网站作为临时缓解措施。建议企业通过组策略强制推送更新至所有终端。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 多列处理使用后释放漏洞"
updated = "2026-06-16T23:32:28Z"

