[basic]
description = "Fortinet FortiOS 存在默认配置漏洞，当设备配置使用 LDAP 进行用户认证时，系统未对 LDAP 服务器身份进行充分验证。同一子网内的未经身份认证的攻击者可通过伪造 LDAP 服务器响应，实施中间人攻击，诱使 FortiOS 设备将敏感认证信息（包括用户凭证）发送至攻击者控制的服务器，导致敏感信息泄露。该漏洞影响 FortiOS 全系列版本，攻击者只需与目标处于同一广播域即可利用，无需任何认证，CVSS 评分 6.5，危害等级中危。Fortinet 已在安全公告中建议用户启用 LDAP over TLS 并配置证书验证以缓解此漏洞。"
published = "2020-08-14T16:15:16Z"
remediation = "升级 FortiOS 至 6.2.1 及以上版本，并在 CLI 中执行 config user ldap → edit <ldap-server> → set ca-cert <LDAP服务器证书> → set secure ldaps → set server-identity-check enable 以启用 LDAP 服务器身份校验。从 6.0.3-6.2.0 升级到 6.2.1 后不会自动启用该选项，需手动配置。如无法升级，可在同一子网内通过防火墙策略限制 LDAP 流量仅允许与可信服务器通信作为临时缓解。"
score = 6.5
severity = "MEDIUM"
sources = ["kev"]
title = "Fortinet FortiOS 默认配置致LDAP仿冒信息泄露漏洞"
updated = "2026-06-17T02:37:54Z"

