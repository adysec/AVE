[basic]
description = 'Allaire JRun 3.0 HTTP Servlet 服务器存在拒绝服务漏洞，远程攻击者可通过向目标服务器发送包含大量连续 "." 字符的恶意 URL 触发该漏洞，导致服务器资源耗尽、服务响应缓慢甚至完全崩溃。该漏洞影响 JRun 3.0 版本，攻击无需身份认证，攻击复杂度低，CVSS 评分 5.0，危害等级中等。厂商已发布安全更新修复此漏洞。'
published = "2000-12-11T05:00:00.000"
remediation = '立即安装 Allaire Security Bulletin ASB00-30 提供的补丁，或升级至 JRun 4.0 及以上版本。由于 JRun 产品已停止维护，建议迁移至 Adobe ColdFusion 或 Apache Tomcat 等受支持的应用服务器。临时缓解措施可在 Web 服务器或 WAF 层面配置规则，拦截包含超长连续点号（超过 50 个 "."）的 /servlet/ 路径请求。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Allaire JRun 3.0 HTTP Servlet 拒绝服务漏洞"
updated = "2026-06-16T21:53:03.037"

