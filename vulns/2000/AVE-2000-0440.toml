[basic]
description = "KDE 1.1.2 的 KApplication 类在配置文件管理功能中存在安全漏洞，本地攻击者可通过创建符号链接等方式利用该漏洞覆盖系统任意文件，从而提升权限至 root。该漏洞影响 KDE 1.1.2 及更早版本，攻击者需要拥有本地用户权限即可利用，无需用户交互。目前已公开的利用代码可实现本地权限提升，建议用户升级至修复版本。"
published = "2000-05-31T04:00:00Z"
remediation = "升级 KDE 至 1.1.2 以上版本，或安装对应发行版安全补丁：Red Hat Linux 用户安装 RHSA-2000-032 提供的更新包，Caldera OpenLinux 用户安装 CSSA-2000-015.0 补丁。限制不可信用户的本地登录权限可作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "KDE KApplication 配置文件管理本地权限提升漏洞"
updated = "2026-06-16T21:51:55Z"

