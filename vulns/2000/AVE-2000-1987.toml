[basic]
description = 'iCal 2.1 Patch 2 的 GUI 安装程序在执行过程中会使用 "xhost +" 命令禁用 X 服务器的访问控制，导致任意远程攻击者无需认证即可监视目标系统的 X Window 事件，从而窃取敏感信息（如键盘输入、屏幕内容）并获取提升的权限。该漏洞影响 iCal 2.1 Patch 2 版本，CVSS 评分 10.0，危害等级严重。攻击者只需通过网络可达目标主机即可利用，无需任何身份凭证。'
published = "2000-12-11T05:00:00.000"
remediation = "安装 iCal 2.1 Patch 2 后立即手动执行 `xhost -` 命令重新启用 X 服务器访问控制。如使用 GUI 安装程序，安装前先执行 `xhost -` 再运行安装程序。建议升级到 iCal 2.1 Patch 3 或更高版本，该版本已修复安装程序自动禁用 X 访问控制的问题。如无法升级，可在防火墙层面限制 6000/TCP 端口的入站连接以阻止远程 X 连接。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "iCal 2.1 Patch 2 GUI 权限提升漏洞"
updated = "2026-06-16T21:53:05.500"

