[basic]
description = "Adobe Flash Player 10.2.152.26之前版本存在内存破坏漏洞（CWE-119）。攻击者可通过构造特制的Flash内容（如SWF文件），诱使用户在受影响浏览器或应用中打开，触发内存破坏，导致远程代码执行或拒绝服务。攻击无需身份认证但需用户交互（如点击恶意链接），CVSS评分9.3，危害等级严重。Adobe已在10.2.152.26版本中修复此漏洞。"
published = "2011-02-10T16:00:32Z"
remediation = "立即升级 Adobe Flash Player 至 10.2.152.26 或更高版本。对于无法升级的环境，可在浏览器中禁用 Flash 插件，或通过组策略限制 Flash 内容的加载。Linux 用户可通过发行版包管理器更新 flash-plugin 或 libflashplayer 至对应修复版本。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏漏洞"
updated = "2026-06-16T23:27:40Z"

