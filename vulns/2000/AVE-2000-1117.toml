[basic]
description = "BeOS r5 pro 及更早版本中的浏览器 IRC 客户端存在拒绝服务漏洞。未经身份认证的远程攻击者可通过向目标系统发送包含超长 URL 的 IRC 消息触发该漏洞。由于程序在处理包含过长 URL 的消息时未对输入长度进行适当验证，导致内存资源被异常消耗或程序崩溃。该漏洞影响运行 BeOS r5 pro 及更早版本的系统上的 IRC 客户端用户，攻击者无需任何身份凭据即可在远程发起攻击。攻击者只需在 IRC 频道中发送包含超长 URL 链接的消息，即可使目标客户端的浏览器组件发生异常，造成服务中断或系统不稳定，严重时可能导致系统需要重启才能恢复正常使用。"
published = "2001-01-09T05:00:00Z"
remediation = "建议升级至 2000 年修补版本的 BeOS IRC 客户端（Felix、Baxter 或 Bowser），原作者 vort-fu 于 2000 年早期已通知开发者并发布修复版本。若无法获取旧版补丁，可在 IRC 客户端设置中禁用 URL 自动解析/链接功能，或改用其他不受影响的 IRC 客户端（如 X-Chat for BeOS）。由于 BeOS 及相关客户端已停止维护，长期建议迁移至现代操作系统与受支持的 IRC 软件。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "BeOS Browser IRC Client URL 拒绝服务漏洞"
