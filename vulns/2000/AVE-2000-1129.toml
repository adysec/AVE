[basic]
description = "IBM HTTP Server 1.3.6（基于 Apache）存在拒绝服务漏洞，远程攻击者可通过向目标服务器发送超长 GET 请求触发该漏洞，导致服务崩溃或可能执行任意命令。该漏洞影响 IBM HTTP Server 1.3.6 版本，攻击者无需身份认证即可通过网络远程利用，CVSS 评分 7.5，危害等级高。建议升级至最新版本或限制请求长度以缓解风险。"
published = "2001-01-09T05:00:00.000"
remediation = "升级 IBM HTTP Server 到 1.3.12 或更高版本。该漏洞影响 Windows 2000 简体中文版上的 IHS 1.3.6，攻击者发送 219 字符的超长 GET 请求即可触发蓝屏死机（BSOD），需管理员重启服务器恢复。如无法升级，可在 Web 服务器前端部署反向代理或 WAF，对 URI 长度进行限制（建议不超过 1024 字节）以缓解风险。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "IBM HTTP Server 远程代码执行漏洞"
updated = "2026-06-16T21:53:18.170"

