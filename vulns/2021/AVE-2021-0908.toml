[basic]
description = "Atlassian Confluence Server 和 Data Center 存在 OGNL 注入漏洞，未经身份认证的远程攻击者可通过向目标实例发送特制 HTTP 请求触发该漏洞，进而执行任意代码。受影响版本包括 6.13.23 之前、6.14.0 至 7.4.11 之前、7.5.0 至 7.11.6 之前以及 7.12.0 至 7.12.5 之前的所有版本。该漏洞 CVSS 评分为 9.8，危害等级严重。攻击者无需任何凭据或用户交互即可利用此漏洞获取服务器控制权，建议用户尽快升级至官方修复版本。"
published = "2021-08-30T07:15:06Z"
remediation = "立即升级 Confluence Server 或 Data Center 至 6.13.23、7.4.11、7.11.6、7.12.5 或 7.13.0 及以上版本。如暂无法立即升级，可临时在 COG > User Management > User Signup Options 中禁用「允许用户自行注册创建账户」功能，或通过反向代理及 WAF 拦截包含 OGNL 表达式（如 %{}、#{）的 HTTP 请求作为过渡缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Atlassian Confluence OGNL 注入远程代码执行漏洞"
updated = "2026-06-17T03:42:49Z"

