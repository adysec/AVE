[basic]
description = "nfs-utils 软件包中的 rpc.statd 守护进程存在格式字符串漏洞，该程序未能正确过滤和处理来自远程用户的可信格式字符串参数。未经身份认证的远程攻击者可通过向目标系统上运行的 rpc.statd 服务发送特制的包含格式字符串占位符（如 %n、%x）的 RPC 请求，利用该漏洞触发内存越界写入，从而以 root 权限执行任意代码。该漏洞影响 Conectiva 4.x/5.x、Debian 2.x、RedHat 6.x、S.u.S.E 6.x/7.0 及 Trustix 1.x 等多个 Linux 发行版，CVSS 评分 10.0，危害等级严重。攻击无需任何认证，利用复杂度低，已存在公开的远程利用代码。"
published = "2000-07-16T04:00:00Z"
remediation = "升级 nfs-utils 至 0.1.9.1 及以上版本（Red Hat 用户安装 RHSA-2000-043 更新包，Debian 用户更新至 nfs-utils_0.1.9.1-1）。如无法立即升级，可在防火墙阻断外部对 rpc.statd 端口（默认 111/TCP/UDP 及动态 RPC 端口）的访问，或禁用 NFS 服务中的 rpc.statd 组件作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Linux nfs-utils rpc.statd 远程格式字符串漏洞"
updated = "2026-06-16T21:52:13Z"

