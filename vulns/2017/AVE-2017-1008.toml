[basic]
description = "Cisco IOS 和 IOS XE 软件的 SNMP 子系统中存在远程代码执行漏洞（CVE-2017-6744）。该漏洞源于 SNMP 子系统在处理特制 SNMP 请求时存在缓冲区溢出缺陷，经过身份验证的远程攻击者可通过向受影响设备的 SNMP 服务发送精心构造的数据包触发缓冲区溢出，从而在目标系统上以设备权限执行任意代码。该漏洞影响 Cisco IOS 12.0 至 15.6 及 IOS XE 多个版本，CVSS 评分 10.0，危害等级严重。攻击者需拥有有效的 SNMP 读写社区字符串（community string）方可利用，但社区字符串可通过暴力破解或嗅探获取。Cisco 已发布安全公告 cisco-sa-20170629-snmp 提供修复版本。"
published = "2017-07-18T00:00:00Z"
remediation = "升级 Cisco IOS 至不受影响版本（通过 Cisco IOS Software Checker 查询对应版本的第一修复版本），或升级 IOS XE 至 3.18 及以上版本。临时缓解措施：在全局配置下使用 snmp-server view NO_BAD_SNMP 排除 ADSL-LINE-MIB、CISCO-SLB-EXT-MIB 等 10 个受影响 MIB，并将该视图绑定到 SNMP community 字符串；同时限制 SNMP 仅允许可信管理站访问。"
score = 5
severity = "MEDIUM"
sources = ["kev"]
title = "Cisco IOS和IOS XE SNMP远程代码执行漏洞"
updated = "2017-07-18T00:00:00Z"

