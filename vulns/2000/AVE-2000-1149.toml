[basic]
description = "Apache Tomcat 3.1 之前版本中的 source.jsp 存在目录遍历漏洞，远程攻击者可通过向 source.jsp 参数传入 `..`（点点）序列实现路径穿越，从而读取服务器上的任意文件。该漏洞源于对用户输入的文件路径缺乏充分的过滤与校验，攻击者无需身份认证即可通过网络远程利用，影响机密性。受影响的版本包括 Apache Tomcat 3.1 之前的所有版本。"
published = "2002-03-22T05:00:00.000"
remediation = '升级 Apache Tomcat 至 3.1 或更高版本，该版本修复了 source.jsp 中未对用户输入进行路径过滤的问题。如无法升级，可删除或限制 source.jsp 的访问权限，并在 Web 服务器层面对包含 ".." 的 URL 请求进行拦截。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Apache Tomcat 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:53:23.353"

