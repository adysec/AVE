[basic]
description = "Internet Explorer 脚本引擎（JScript/Chakra）在处理内存中的对象时存在类型混淆导致的内存损坏漏洞，攻击者可通过构造恶意网页诱导用户访问，触发脚本引擎内存损坏实现远程代码执行。该漏洞影响 Internet Explorer 11（如 Windows 10 1809 版本 17763.316 等），CVSS 3.1 评分 7.5（HIGH），攻击向量为网络、攻击复杂度高、需用户交互、无需权限，机密性/完整性/可用性影响均为高。CISA 已将其列入已知被利用漏洞目录，确认存在在野利用。攻击者需诱导受害者访问精心构造的恶意网页触发漏洞，成功利用可在当前用户权限下执行任意代码。Microsoft 已于 2019 年 4 月安全更新中修复此漏洞（CVE-2019-0752 与 CVE-2019-0739、CVE-2019-0753、CVE-2019-0862 为不同漏洞）。"
published = "2019-04-09T21:29:00Z"
remediation = "建议立即安装 Microsoft 2019 年 4 月安全更新（如 KB4493472 等对应版本补丁），通过 Windows Update 自动更新或手动下载安装对应 IE 累积更新。无法立即打补丁时，建议禁用 Internet Explorer 脚本引擎（通过组策略禁用 Active Scripting）或改用 Edge/Chrome 等现代浏览器作为临时缓解措施。建议尽快升级至 Windows 10 1903 或更高版本彻底解决 IE 遗留漏洞风险。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Internet Explorer 脚本引擎内存损坏远程代码执行漏洞"
updated = "2026-06-17T02:08:49Z"

