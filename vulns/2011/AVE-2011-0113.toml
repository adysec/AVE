[basic]
description = "Adobe Flash Player 存在内存破坏漏洞（编号 CVE-2011-2454），该漏洞属于一组多个内存破坏缺陷之一（与 CVE-2011-2445、CVE-2011-2451、CVE-2011-2452、CVE-2011-2453、CVE-2011-2455、CVE-2011-2459、CVE-2011-2460 等为同一类漏洞的不同实例）。漏洞原理为 Flash Player 在处理特制的 SWF 内容时，因未对输入数据进行充分的边界检查，导致内存缓冲区发生越界写入（CWE-119），攻击者可精心构造恶意 Flash 文件触发该缺陷，实现任意代码执行或拒绝服务。受影响版本包括 Windows、Mac OS X、Linux、Solaris 平台上 10.3.183.11 之前的所有 Flash Player 版本及 11.x 系列中 11.1.102.55 之前的版本，同时 Android 平台 11.1.102.59 之前的版本以及 Adobe AIR 3.1.0.4880 之前的版本也均受影响。攻击条件为攻击者通过网页挂马、恶意广告或诱导用户访问特制页面等方式，向受害者浏览器投递包含恶意 Flash 内容的页面，用户无需额外交互（仅需加载页面）即可触发漏洞。该漏洞 CVSS 评分为 10.0（最高危），攻击复杂度低且无需认证，可直接远程利用。Adobe 已在 2011 年 10 月发布的安全更新中修复此漏洞，建议用户立即升级至 Flash Player 11.1.102.55 或更高版本，以及 Adobe AIR 3.1.0.4880 或更高版本。"
published = "2011-11-11T16:55:01Z"
remediation = "升级 Adobe Flash Player 至 10.3.183.11 及以上版本（Windows/Mac/Linux/Solaris）或 11.1.102.55 及以上版本（11.x 分支），Android 平台升级至 11.1.102.59 及以上版本；Adobe AIR 升级至 3.1.0.4880 及以上版本。如无法升级，可在浏览器中禁用 Flash 插件或启用点击播放功能作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:31:22Z"

