[info]
author = "ave"
description = "Cisco CBOS 2.4.1 及更早版本的 Web 界面允许远程攻击者通过发送不以空格字符结尾的 URL 造成拒绝服务。"
id = "POC-AVE-2001-0591"
name = "CVE-2001-0058 PoC"
severity = "medium"
tags = ["ave-2001-0591"]
vuln_id = [
    "CVE-2001-0058",
    "AVE-2001-0591",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/{{path}}"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
