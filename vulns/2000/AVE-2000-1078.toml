[basic]
description = 'Microsoft SQL Server 2000 及 MSDE 中的 xp_printstatements 扩展存储过程函数存在缓冲区溢出漏洞。该函数在调用 srv_paraminfo API 前未正确验证输入缓冲区长度，允许拥有本地登录权限的攻击者向 SQL Server 发送特制的参数数据触发缓冲区溢出，进而导致服务拒绝或执行任意命令。攻击者需先通过身份认证登录数据库系统，利用条件较为受限，但一旦成功可完全控制数据库服务器进程。此漏洞又名"扩展存储过程参数解析"漏洞。'
published = "2001-01-09T05:00:00Z"
remediation = "立即安装微软安全公告 MS00-092 提供的补丁（SQL Server 2000 补丁后续包含在 Service Pack 1 中，SQL Server 7.0 补丁包含在 Service Pack 3 中）。如无法立即打补丁，应将 SQL Server 服务账号配置为普通用户权限而非管理员权限，以限制利用成功后的影响范围；同时检查所有第三方扩展存储过程（XP）在调用 srv_paraminfo() 前是否正确分配了足够大小的缓冲区。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft SQL Server 2000 扩展存储过程参数解析缓冲区溢出漏洞"
updated = "2026-06-16T21:53:07Z"

