[basic]
description = "标签之间。<value>Portix-PHP 0.4.02 版本的 index.php 脚本存在目录遍历漏洞。远程攻击者无需身份认证即可通过向 Web 请求的 l 和 topic 参数中注入 ..（点号）路径遍历序列，突破应用程序的目录访问限制，从而读取服务器文件系统上的任意文件。该漏洞可能导致敏感配置文件、密码文件等内部数据泄露，影响使用 Portix-PHP 搭建的博客或内容管理系统的站点。攻击者仅需构造包含路径遍历字符的 URL 即可发起利用，无需登录或交互。"
published = "2002-12-31T05:00:00Z"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Portix 0.4.02 目录遍历漏洞"
updated = "2026-06-16T22:00:37Z"

