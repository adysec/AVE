[basic]
description = "Windows NT 4.0 系统中，RAS Administration 注册表项的默认权限配置不当，允许本地用户修改该注册表键值并将其指向恶意的 DLL 文件。当系统或相关服务尝试加载此 DLL 时，将在受影响系统上执行任意代码。该漏洞影响 Windows NT 4.0 版本，攻击者需具备目标系统的本地访问权限。利用方式上，攻击者可将 RAS Administration 注册表项的值修改为指向自己控制的恶意 DLL 路径，从而在系统加载该组件时触发代码执行，进而完全掌控目标系统。该漏洞属于注册表权限配置类安全缺陷，CVSS 评分高达 10 分，危害等级严重。"
published = "2001-02-16T05:00:00Z"
remediation = '立即安装 Microsoft 安全公告 MS00-095 发布的注册表权限修复工具（regacl40），该工具可将 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\RAS 注册表项的默认权限修改为仅允许 Administrators、System 和 Creator Owner 完全控制，从而阻止普通用户修改 RAS Administration 键值指向恶意 DLL。可从 Microsoft Download Center（FamilyID=8E7C68EE-98BC-440E-A99D-6A97308FDCB0）下载对应 Windows NT 4.0 Service Pack 5 或 6a 版本的工具，运行命令为 regacl40，或使用 regedt32 手动删除 Everyone 对该键的写权限。如系统未安装 RAS 服务，可通过控制面板移除远程访问服务作为临时缓解措施。'
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Microsoft Windows NT 4.0 注册表权限远程代码执行漏洞"
updated = "2026-06-16T21:53:33Z"

