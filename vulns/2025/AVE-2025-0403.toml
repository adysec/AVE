[basic]
description = "iniparser 库中的 iniparser_dumpsection_ini() 函数存在基于堆的缓冲区溢出漏洞（CWE-122）。攻击者可通过向该函数传入特制的 INI 配置文件，触发堆内存越界读取，导致敏感信息泄露。该漏洞需要本地访问权限才能利用，攻击复杂度较低，无需用户交互即可触发。影响范围包括使用 iniparser 库解析 INI 配置文件的各类应用，CVSS 评分 5.1，危害等级中等。"
published = "2025-02-19T07:15:33Z"
remediation = "建议立即将 iniparser 升级到 v4.2.6 或更高版本，该版本已修复 iniparser_dumpsection_ini() 中的堆缓冲区溢出问题。如无法立即升级，可在调用 iniparser_dumpsection_ini() 前对输入数据进行长度校验，避免传入超长 section 名称或畸形 INI 内容触发越界读取。"
score = 5.1
severity = "MEDIUM"
sources = ["msrc"]
title = "iniparser iniparser_dumpsection_ini 函数堆缓冲区溢出漏洞"
updated = "2026-06-17T08:26:52Z"

