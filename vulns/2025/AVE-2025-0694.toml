[basic]
description = "Windows PrintWorkflowUserSvc 服务存在输入验证不当漏洞（CWE-20），低权限攻击者可在本地登录系统后，通过向受影响的打印工作流服务发送特制请求触发该漏洞，成功利用可提升至 SYSTEM 权限，从而完全控制目标系统。该漏洞影响多个 Windows 版本，Microsoft 已在 2025 年 1 月安全更新（KB5049981）中修复。"
published = "2025-01-14T18:15:36Z"
remediation = '立即安装 Microsoft 2025 年 1 月安全更新：Windows 10 22H2/21H2 安装 KB5049981（OS Builds 19044.5371/19045.5371），Windows Server 2019 安装 KB5050008（OS Build 17763.6775），Windows 11 对应安装 2025 年 1 月累积更新。通过"设置→Windows 更新→检查更新"自动获取。如无法立即打补丁，可禁用 PrintWorkflowUserSvc 服务（services.msc 中找到 PrintWorkflowUserSvc，将启动类型设为"禁用"）作为临时缓解措施，但可能影响打印工作流功能。'
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows PrintWorkflowUserSvc 特权提升漏洞"
updated = "2026-06-17T08:42:51Z"

