[basic]
description = "Arm Mali GPU 内核驱动存在释放后使用（Use-After-Free）漏洞，未经权限提升的本地用户可通过触发该漏洞访问已释放的内存，从而造成敏感信息泄露或获得 root 权限。该漏洞影响 Bifrost r16p0 至 r29p0（修复版本为 r30p0）、Valhall r19p0 至 r29p0（修复版本为 r30p0）以及 Midgard r28p0 至 r30p0 版本的 GPU 内核驱动，CVSS 评分为 8.8，危害等级为高危。CISA 已将其列入已知被利用漏洞目录（KEV），表明该漏洞已在野利用。攻击者无需特殊权限即可在受影响设备上执行恶意代码，获取系统最高权限或窃取内核内存中的敏感数据。Arm 已在安全更新中发布修复补丁，受影响用户应升级 Mali GPU 驱动至 r30p0 或更高版本以消除风险。"
published = "2021-05-24T18:15:08Z"
remediation = "升级 Arm Mali GPU 内核驱动至安全版本：Bifrost 架构升级到 r30p0 或更高版本，Valhall 架构升级到 r30p0 或更高版本，Midgard 架构升级到 r31p0 或更高版本。具体操作：联系设备厂商获取包含修复补丁的固件或驱动更新包，通过系统包管理器或厂商提供的 OTA 渠道安装更新。如暂时无法获取补丁，可在内核启动参数中禁用 Mali GPU 设备节点访问权限，或通过 SELinux/AppArmor 限制非特权用户对 /dev/mali* 设备的访问，以缓解利用风险。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Arm Mali GPU 内核驱动 释放后使用漏洞"
updated = "2026-06-17T03:47:27Z"

