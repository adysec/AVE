[info]
author = "AVE"
description = "检测 Samba 2.0.7 SWAT cgi.log 符号链接漏洞，本地攻击者可通过创建符号链接覆盖任意文件"
id = "POC-AVE-2000-0682"
name = "Samba SWAT Symlink PoC"
severity = "high"
tags = ["ave-2000-0682"]
vuln_id = [
    "CVE-2000-0935",
    "AVE-2000-0682",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/tmp/cgi.log"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [""]
