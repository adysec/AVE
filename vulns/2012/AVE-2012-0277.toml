[basic]
description = "Apple iTunes 10.7 之前版本所嵌入的 WebKit 渲染引擎存在内存破坏漏洞。远程攻击者无需身份验证，只需诱使用户打开一个恶意构造的网页，即可触发内存损坏，导致应用程序崩溃或执行任意代码。攻击条件为受害者使用受影响版本的 iTunes 并访问攻击者控制的恶意网站。成功利用后，攻击者可在用户系统上以当前用户权限执行任意指令，完全控制受影响设备。"
published = "2012-09-13T10:30:19.010"
remediation = "升级 Apple iTunes 至 10.7 或更高版本。Mac 用户可通过 Mac App Store 或 Apple 官网下载最新 iTunes 安装包进行升级；Windows 用户请访问 Apple 官网下载 Windows 版 iTunes 10.7 或更高版本。如暂时无法升级，应避免在 iTunes 内打开未知来源的网页链接，并禁用不必要的 WebKit 组件访问权限作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes 远程代码执行漏洞"
updated = "2026-06-16T23:43:33.227"

