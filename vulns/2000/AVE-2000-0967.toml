[basic]
description = "UnixWare 7 的 scohelphttp Web 服务器中 search97cgi/vtopic 组件存在目录遍历漏洞，远程攻击者无需身份认证即可通过构造包含 `..`（点点）序列的恶意 HTTP 请求，突破路径限制读取服务器上的任意文件，导致敏感信息泄露。该漏洞影响 UnixWare 7 系列版本，攻击复杂度低，仅需网络可达即可利用。"
published = "2000-11-14T05:00:00Z"
remediation = "UnixWare 7 已停止维护，官方不再提供安全更新。建议立即禁用 scohelphttp 服务（`/etc/rc2.d/S99scohelp stop && chkconfig scohelphttp off`），或在 inetd 配置中注释掉相关行后重启 inetd。如业务必须使用，应在网络边界防火墙封禁对 457/TCP 端口的访问，仅允许可信 IP 连接，并迁移至受支持的 Web 服务器（如 Apache）替代。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "SCO UnixWare scohelphttp 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:52:34Z"

