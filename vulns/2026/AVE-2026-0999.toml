[basic]
description = "vantage6 是一款用于隐私保护协作数据分析与机器学习的开源平台。该漏洞存在于算法编辑权限机制中，由于缺乏所有权检查（CWE-863 不正确的授权），拥有编辑权限的低权限远程攻击者可以篡改其他开发者处于待审核或审核中状态的算法元数据。攻击者最可将算法镜像地址或镜像标签替换为恶意镜像，当审核者未察觉元数据变更而批准时，节点将信任并拉取执行被篡改的镜像而非实际审核通过的镜像。该漏洞影响 vantage6 5.0.2 及之前版本，攻击者无需认证即可远程利用，严重危害数据分析与机器学习任务的完整性和安全性。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
