[basic]
description = "Pulse Secure Pulse Connect Secure (PCS) 存在路径遍历漏洞，未经身份认证的远程攻击者可通过向设备发送特制的 URI 请求读取系统任意文件内容。该漏洞影响 PCS 8.2（低于 8.2R12.1）、8.3（低于 8.3R7.1）及 9.0（低于 9.0R3.4）版本，由于 Web 接口对用户提供的路径参数缺乏充分验证，攻击者可利用目录遍历技术绕过访问控制，获取 /etc/passwd、/etc/shadow 等敏感系统文件及配置文件，进而提取用户凭证、VPN 私钥等关键信息，造成严重的信息泄露风险。CISA 已将其列入已知被利用漏洞目录，公开 Metasploit 模块及多种利用脚本已在野外广泛传播。"
published = "2019-05-08T17:29:00Z"
remediation = "立即将 Pulse Connect Secure 升级至 8.2R12.1、8.3R7.1 或 9.0R3.4 及以上版本（对应各主版本线），升级前务必先运行 Pulse Connect Secure Integrity Tool 检查设备是否已被植入后门（已知攻击者可利用此漏洞在设备上驻留 webshell 并跨越升级周期保持持久化）。若无法立即打补丁，导入 Pulse Secure 提供的 XML 配置文件（SA44784）作为临时缓解措施，限制对 /dana-na/ 路径的访问，并监控 HTTPS 访问日志中是否存在包含 ../../../../ 等路径遍历特征的 URI 请求。升级完成后重置所有相关账户密码并审查配置是否被篡改。"
score = 10
severity = "CRITICAL"
sources = ["kev"]
title = "脉冲安全 Pulse Connect Secure SSL VPN 任意文件读取漏洞"
updated = "2026-06-17T02:13:04Z"

