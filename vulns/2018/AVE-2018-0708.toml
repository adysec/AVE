[basic]
description = "Sierra Wireless AirLink ES450 工业路由器的 ALEOS 固件中，upload.cgi 功能存在未授权文件上传漏洞。攻击者通过发送特制的 HTTP 请求，可在已认证的情况下向设备上传可执行文件，由于上传路径位于 Web 服务器可路由目录中，上传的可执行文件可被远程调用执行，最终导致远程代码执行。该漏洞影响 Sierra Wireless AirLink ES450 FW 4.9.3 版本，CVSS v3.1 评分为 8.8，危害等级高。"
published = "2019-05-06T19:29:00Z"
remediation = "将 AirLink ES450 的 ALEOS 固件升级至 4.9.4.p09 或更高版本以修复该文件上传漏洞。升级前请通过 Sierra Wireless 授权经销商或技术支持获取固件安装包并遵循官方升级指引。配置方面应使用强密码保护用户账户和 AAF User 账户（遵循 NIST SP800-63B  memorized secret 密码强度规范），并确保直接管理设备时仅通过 HTTPS 连接且浏览器启用 CSRF 防护。临时缓解措施包括：在边界防火墙上限制对设备 Web 管理界面的访问来源，仅允许可信管理 IP 段访问；如无法即时升级且产品已到达生命周期终点，建议停止使用并更换设备。注意该设备可能已处于 EoL/EoS 状态，具体生命周期信息请参考 https://source.sierrawireless.com/resources/airlink/hardware_reference_docs/airlink_es450_eol。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Sierra Wireless AirLink ES450 远程代码执行漏洞"
updated = "2026-06-17T01:58:18Z"

