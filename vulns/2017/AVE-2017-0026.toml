[basic]
description = "Supervisord inet_http_server 存在 XML-RPC 服务器漏洞。攻击者可通过精心 crafted 的 XML-RPC 请求利用嵌套 supervisord 命名空间查找漏洞，在相关 Supervisor 版本（3.0.1 及更早版本、3.1.x 及更早版本、3.2.x 及更早版本、3.3.x 及更早版本）中执行任意命令，导致远程代码执行。该漏洞 CVSS 评分 8.8，影响等级高。Microsoft 和 Supervisor 团队已在安全更新中修复此漏洞，建议升级到最新版本以消除风险。"
published = "2017-08-23T14:29:00Z"
remediation = "立即升级 Supervisor 到 3.0.1、3.1.4、3.2.4、3.3.3 或更高版本（pip install --upgrade supervisor）。若无法立即升级，请在 supervisord.conf 中注释掉 [inet_http_server] 段或将 port 绑定到 127.0.0.1 仅本地访问，并设置强密码认证，同时在防火墙层面限制 9001 端口仅允许受信任 IP 访问。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "Supervisor inet_http_server XML-RPC 远程代码执行漏洞"
updated = "2026-06-17T01:02:04Z"

