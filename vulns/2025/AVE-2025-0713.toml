[basic]
description = "Windows Internet Connection Sharing (ICS) 存在拒绝服务漏洞，攻击者可通过向目标系统发送特制的相邻网络数据包引发服务崩溃。该漏洞影响 Windows 10/11 及 Windows Server 2019/2022 等版本，可导致系统网络连接功能完全不可用。攻击无需认证且无用户交互，利用路径为构造恶意邻近网络流量。攻击者可远程触发此漏洞，导致系统响应停滞，服务不可用。该漏洞 CVSS 评分 6.5，危害等级中等，由微软安全团队确认。微软已发布安全更新 MS5051974 修复此漏洞，建议用户及时更新补丁以防止服务中断影响网络连接。确保防火墙规则和网络监控机制，以检测和阻止此类恶意流量。"
published = "2025-02-11T18:15:32Z"
remediation = "立即安装 Microsoft 2024 年 8 月安全更新（KB5051974），升级到 Windows 10 版本 22H2（19045.5487）及以上版本或 Windows 11 版本 22H2（22621.4890）及以上版本。如无法立即更新，可临时禁用受影响的 Internet Connection Sharing (ICS) 服务或在防火墙中限制对 ICS 端口的访问。立即访问 Microsoft 官方安全更新指南获取完整补丁信息：https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-21254。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows Internet Connection Sharing (ICS) 拒绝服务漏洞"
updated = "2026-06-17T08:42:54Z"

