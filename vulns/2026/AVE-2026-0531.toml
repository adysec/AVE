[basic]
description = "TensorZero Gateway 的 `/internal/object_storage` 接口存在任意文件读取与 SSRF 漏洞。该接口接受调用者提供的 JSON `storage_path` 参数，可动态覆盖 TensorZero 的 `[object_storage]` 配置。攻击者通过滥用 `filesystem` 存储类型可读取网关文件系统中的任意文件（包括敏感凭据），通过滥用 `s3_compatible` 存储类型可强制网关向攻击者指定的内部端点或云元数据端点发起出站对象存储请求。该漏洞仅在网关可被不可信调用者访问时生效，若部署已启用认证则仅认证用户可利用。已在版本 `2026.6.0` 中修复。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级 TensorZero Gateway 至 v2026.6.0 或更高版本（PR #7527）。如无法立即升级，在反向代理或防火墙层面配置规则，阻止外部不可信调用者访问 `/internal/object_storage` 端点，并确保已启用网关认证功能。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "TensorZero Gateway 任意文件读取与服务器端请求伪造漏洞"
updated = "2026-01-01T00:00:00Z"

