[basic]
description = "zlib 1.1.3 及更早版本的解压缩算法中存在双重释放（double free）漏洞，当 inflateEnd 函数处理特制的畸形压缩数据时，会多次释放同一内存区域，导致堆内存损坏。远程攻击者可通过向使用 zlib 的应用程序（如 Web 服务器、SSH 客户端、压缩工具等）发送恶意构造的压缩数据块触发该漏洞，成功利用可实现任意代码执行。由于 zlib 被大量第三方软件和操作系统广泛集成，该漏洞影响范围极广，危害严重。"
published = "2002-03-15T05:00:00Z"
remediation = "立即将 zlib 升级至 1.1.4 或更高版本（1.1.4 于 2002 年 3 月发布，修复了 inflateEnd 双重释放问题）。各 Linux 发行版用户应通过包管理器更新：Debian/Ubuntu 执行 apt-get install --only-upgrade zlib1g，Red Hat/CentOS 执行 yum update zlib，或参照 RHSA-2002-026/RHSA-2002-027 安装对应补丁。如无法升级，可在应用层对传入的压缩数据做完整性校验，并限制仅接受可信来源的压缩数据流。"
score = 9.8
severity = "CRITICAL"
sources = ["redhat"]
title = "zlib 数据解压缩双重释放远程代码执行漏洞"
updated = "2026-06-16T21:56:40Z"

