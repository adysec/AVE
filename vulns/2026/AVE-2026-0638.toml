[basic]
description = "Gitea 的 OIDC 用户信息端点（`GET /login/oauth/userinfo`）在接收 Gitea API 令牌作为 Bearer 凭证时，未对 API 令牌的作用域进行权限校验。攻击者仅需持有作用域为 `read:misc` 的个人访问令牌，即可通过该端点获取用户的身份信息（包括邮箱、组织及团队成员信息），而相同令牌访问需要 `read:user` 等作用域的 REST API 端点时会被正确拒绝。该漏洞削弱了 Gitea API 令牌作用域的权限隔离机制，导致身份信息泄露，但不会影响仓库、问题、PR 等数据。"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 Gitea 升级至 v1.27.0 或更高版本，该版本已修复 OIDC userinfo 端点未正确校验 API Token 作用域的问题。如无法立即升级，可在反向代理层限制对 `/login/oauth/userinfo` 路径的访问，仅允许受信任的 OAuth 客户端调用，并审查现有 API Token 的权限分配。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Gitea OIDC userinfo 端点 API 令牌作用域绕过漏洞"
updated = "2026-01-01T00:00:00Z"

