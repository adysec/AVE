[basic]
description = "WordPress 插件 2kb Amazon Affiliates Store 2.1.1 之前版本（含 2.1.0 及更早）在后台管理页面 wp-admin/admin.php 的 kbAmz 页面中存在多处跨站脚本（XSS）漏洞。攻击者可在未经充分过滤的情况下，通过 page 或 kbAction 参数注入任意 Web 脚本或 HTML。该漏洞影响已安装该插件的 WordPress 站点，攻击条件为网络可达且需诱使具备相应权限的用户（通常为管理员）访问恶意构造的链接（UI:R）。成功利用后可在受害者浏览器上下文中执行恶意脚本，导致会话劫持、权限提升或恶意操作，CVSS 3.0 评分为 6.1（中危）。厂商已在 2.1.1 版本中修复相关参数输出过滤问题。"
published = "2017-09-28T01:29:01Z"
remediation = "将 WordPress 插件 2kb Amazon Affiliates Store 升级至 2.1.1 或更高版本以修复 page 与 kbAction 参数的 XSS。可在后台「插件」中更新，或手动下载官方包替换 wp-content/plugins/2kb-amazon-affiliates-store。若暂无法升级，请停用并删除该插件，限制非必要管理员账号并避免点击不可信后台链接。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "2kb Amazon Affiliates Store WordPress插件 跨站脚本漏洞"
updated = "2026-06-17T01:06:30Z"

