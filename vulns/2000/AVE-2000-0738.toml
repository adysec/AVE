[basic]
description = "Red Hat Linux 6.2 中的 dump 工具（版本 0.4b15）存在环境变量信任漏洞，该程序信任 RSH 环境变量指定的路径名，未进行任何安全检查。本地攻击者可通过预先修改 RSH 环境变量，将其指向自己构造的恶意程序，当普通用户或具有特权的进程调用 dump 时，dump 会以 root 权限执行攻击者指定的恶意程序，从而导致权限提升，获得完全的系统控制权。该漏洞攻击复杂度低，无需身份认证即可利用。"
published = "2000-12-11T05:00:00Z"
remediation = "升级 Red Hat Linux 至 7.0 及以上版本，该漏洞已在后续版本中修复。如无法升级，可移除 dump 的 setuid 权限（chmod u-s /sbin/dump），并确保 RSH 环境变量不被非授权用户修改，同时限制普通用户对 dump 命令的执行权限。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Red Hat Linux dump 本地权限提升漏洞"
updated = "2026-06-16T21:52:57Z"

