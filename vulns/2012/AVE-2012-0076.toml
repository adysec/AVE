[basic]
description = "Apple WebKit 引擎存在内存破坏漏洞，影响 iOS 5.1 之前版本及 iTunes 10.6 之前版本的 Safari 浏览器。漏洞原理在于 WebKit 在解析特定网页内容时未能正确处理内存，导致内存损坏。攻击者可通过构建一个包含恶意代码的特制网站，诱导目标用户访问，在无需身份验证的情况下触发该漏洞。成功利用后，攻击者可实现远程代码执行（RCE）以完全控制目标设备，或导致浏览器进程崩溃引发拒绝服务（DoS）攻击。"
published = "2012-03-08T22:55:02Z"
remediation = "建议将 Safari 浏览器升级至 5.1.4 或更高版本；iOS 设备用户请将系统升级至 iOS 5.1 或更新版本；iTunes 用户请升级至 10.6 或更高版本，以修复 WebKit 内存损坏漏洞并防止远程代码执行。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏漏洞"
updated = "2026-06-16T23:37:53Z"

