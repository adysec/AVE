[basic]
description = "CGI Script Center News Update 1.1 的管理员密码修改功能存在认证绕过漏洞。该 CGI 应用在修改管理员密码时未正确验证原始密码，远程攻击者无需知道当前管理员密码即可直接提交密码修改请求，将管理员密码重置为任意值。攻击者随后可使用新密码登录后台，获取新闻系统的完全管理权限，包括发布、修改、删除新闻内容等操作。该漏洞攻击复杂度低，无需认证，CVSS 评分 9.8，危害严重。ExploitDB 已公开该漏洞的利用方法。"
published = "2000-12-19T05:00:00.000"
remediation = "立即停止使用 CGI Script Center News Update 1.1，该软件已停止维护且无安全更新。建议迁移至其他受支持的新闻发布系统（如 WordPress、Joomla 等现代 CMS）。作为临时缓解措施，可删除或重命名服务器上的 newsup.pl 文件，或通过 Web 服务器配置（如 .htaccess 或 Nginx 规则）限制对 /cgi-bin/newsup 路径的访问，仅允许受信 IP 地址访问该目录。"
score = 9.8
severity = "CRITICAL"
sources = ["cve"]
title = "CGI Script Center News Update 1.1 管理员密码未授权修改漏洞"
updated = "2026-06-16T21:52:49.477"

