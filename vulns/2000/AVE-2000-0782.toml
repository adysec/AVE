[basic]
description = "tags.<value>Microsoft SQL Server 7.0/2000 及 Desktop Engine (MSDE) 1.0/2000 中的 xp_showcolv 扩展存储过程函数在调用 SQL Server API 的 srv_paraminfo 函数前，未对缓冲区长度进行适当限制，导致缓冲区溢出。攻击者可在本地提交超长参数触发该漏洞，造成拒绝服务或执行任意命令。该漏洞影响 SQL Server 7.0/2000 及 MSDE 1.0/2000 等版本，CVSS 评分 2.1，危害等级低，需本地访问权限即可触发。"
published = "2001-01-09T05:00:00.000"
remediation = '立即安装 Microsoft 安全公告 MS00-092 发布的补丁（KB280380）。SQL Server 7.0 用户应升级至 Service Pack 3，SQL Server 2000 用户应升级至 Service Pack 1，MSDE 1.0 和 MSDE 2000 用户需分别安装对应的扩展存储过程参数解析修复补丁。补丁通过修正 xp_showcolv 等扩展存储过程中对 srv_paraminfo API 的缓冲区分配逻辑，消除缓冲区溢出风险。安装前请从控制面板的"添加/删除程序"中确认 MSDE 是否已安装，安装后参照 KB280380 验证补丁文件的大小和创建日期以确认安装成功。'
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "Microsoft SQL Server xp_showcolv 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:06.877"

