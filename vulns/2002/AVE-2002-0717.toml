[basic]
description = "tags.<value>IRCIT 0.3.1 IRC 客户端在处理邀请（invite）消息时存在缓冲区溢出漏洞。由于该客户端在解析收到的 invite 消息时未对消息长度进行充分的边界检查，远程攻击者无需身份认证即可向受害用户发送特制的超长 invite 请求，从而触发栈缓冲区溢出，覆盖返回地址或内存数据并劫持程序执行流程，最终导致远程任意代码执行，危害等级为高危（CVSS 评分 7.5）。该漏洞影响 IRCIT 0.3.1 版本，攻击条件简单、利用难度较低。由于该软件已停止维护，建议用户停止使用该客户端并迁移至受支持的安全替代方案。"
published = "2002-12-31T05:00:00Z"
remediation = "该漏洞源于 IRCIT 0.3.1 在处理超长 INVITE 消息时未做边界检查，可被远程利用执行任意代码。由于官方已停止维护且无补丁版本，建议：1) 立即停止使用 IRCIT，改用长期维护的 IRC 客户端（如 HexChat、WeeChat 或 Konversation），并升级到官方最新版本；2) 如无法立即替换，仅连接可信且受控的 IRC 服务器，避免连接不受信任的服务器或加入陌生频道，并在防火墙中限制对外 6667/6697 等 IRC 端口的访问范围；3) 在客户端所在主机上启用补丁防护（如 DEP/NX）以降低缓冲区溢出利用成功率；4) 由于该软件已 EOL（终止支持），不建议继续用于生产环境。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Ayman Akt IRCIT IRC 客户端远程缓冲区溢出漏洞"
updated = "2026-06-16T22:00:15Z"

