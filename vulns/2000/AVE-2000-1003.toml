[basic]
description = 'thttpd 轻量级 Web 服务器 2.19 及更早版本中的 ssi CGI 程序存在目录遍历漏洞。程序未对用户提交的路径参数进行严格过滤和边界校验，攻击者可利用 URL 编码的 "%2e%2e"（即 ".." 的编码形式）替代传统的 ".." 路径穿越序列，绕过访问控制机制读取服务器上任意文件。该漏洞影响所有启用 ssi CGI 功能且运行受影响版本的 thttpd 服务器，攻击者无需任何身份验证即可通过网络远程发起利用。攻击者只需构造包含特殊编码路径穿越字符的特制 HTTP 请求发送至目标服务器，即可通过 ssi CGI 程序获取目标系统上的敏感文件内容，导致信息泄露风险。此漏洞 CVSS v3 评分 7.5，危害等级为高。'
published = "2000-12-19T05:00:00.000"
remediation = "建议立即升级 thttpd 至 2.20 或更高版本以修复 ssi CGI 目录遍历漏洞；若暂时无法升级，请编辑 thttpd.conf 配置文件将 ssi_enabled 设置为 0 禁用 SSI 功能，或在 Web 服务器前部署 WAF 规则拦截包含 %2e%2e 路径穿越字符的请求，同时限制 Web 服务器进程对敏感目录的文件系统读取权限作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "thttpd thttpd 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:52:43.280"

