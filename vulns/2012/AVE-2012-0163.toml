[basic]
description = "FreeType 2.4.9之前版本在处理BDF字体的属性数据时存在内存破坏漏洞，远程攻击者可通过向目标系统提交特制的BDF字体文件触发无效堆读取操作，导致内存损坏，进而造成拒绝服务或在受影响系统上执行任意代码。该漏洞影响Mozilla Firefox Mobile 10.0.4之前版本、Apple iOS 6.0之前版本及其他使用FreeType的产品，CVSS评分10.0，危害等级严重。"
published = "2012-04-25T10:10:17.933"
remediation = "将 FreeType 升级至 2.4.9 或更高版本。对于使用 FreeType 的产品（如 Mozilla Firefox Mobile），升级至 Firefox Mobile 10.0.4 及以上版本。Apple iOS 用户升级至 iOS 6.0 及以上版本。Linux 发行版用户通过包管理器更新 freetype 包（如 apt upgrade freetype）。如无法立即升级，可在应用层面对 BDF 字体文件的解析进行输入校验，拒绝畸形属性数据的 BDF 字体。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "FreeType BDF字体属性数据处理不当致远程代码执行漏洞"
updated = "2026-06-16T23:39:04.587"

