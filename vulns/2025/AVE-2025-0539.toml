[basic]
description = "libxml2 的 xmlSetTreeDoc() 函数在 tree.c 中处理跨文档节点移动时存在命名空间释放后使用（CWE-416）漏洞。当调用 xmlAddChild() 或 xmlReplaceNode() 将带有命名空间的节点从源文档移动到目标文档时，xmlNodeSetDoc() 会递归更新节点的 doc 指针，但未同步更新 node->ns 命名空间指针，导致其悬挂指向已释放的源文档命名空间内存。攻击者可通过构造包含命名空间的 XML 文档并触发跨文档节点移动操作，在源文档销毁后对目标节点执行序列化，从而触发堆内存释放后使用，可能导致拒绝服务或远程代码执行。该漏洞影响所有使用 libxml2 解析和操作 XML 文档的应用程序，但 CVE-2025-12863 已被美国国家漏洞数据库（NVD）判定为无效并正式拒绝分配。"
published = "2025-11-07T21:15:40Z"
remediation = "立即升级 libxml2 至 v2.15.3 或更高版本（v2.14.x 用户升级至对应修复版本），该版本重写了 xmlSetTreeDoc() 函数以修复命名空间释放后使用漏洞。升级后需重新编译链接 libxml2 的应用程序。若无法立即升级，可在 XML 解析时禁用命名空间处理（设置 XML_PARSE_NOBLANKS 标志并避免跨文档移动带命名空间的节点）作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["msrc"]
title = "Libxml2 libxml2 命名空间释放后使用漏洞"
updated = "2025-11-20T15:17:23Z"

