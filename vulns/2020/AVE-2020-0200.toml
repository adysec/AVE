[basic]
description = "Tenda AC15 AC1900 无线路由器固件版本 15.03.05.19 存在操作系统命令注入漏洞。该漏洞源于 goform/setUsbUnload 接口未对用户输入进行有效过滤，攻击者可通过 POST 请求中的 deviceName 参数注入并执行任意系统命令。该漏洞无需身份认证即可被远程利用，CVSS 评分为 9.8，危害等级为严重。成功利用该漏洞可使攻击者完全控制受影响的路由器设备。"
published = "2020-07-13T19:15:12Z"
remediation = "建议立即升级路由器固件到最新版本，如 AC15 设备请访问官方网站下载最新稳定版本固件并进行升级。如无法立即升级，可通过管理页面禁用 USB功能以关闭 setUsbUnload 接口作为临时缓解措施，并在防火墙上限制对路由器管理端口的访问，仅允许内部网段访问。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Tenda AC15 AC1900 命令注入漏洞"
updated = "2026-06-17T02:48:48Z"

