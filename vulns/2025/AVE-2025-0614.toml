[basic]
description = "libssh2 1.11.1 及之前版本的 src/sftp.c 中 sftp_symlink() 函数存在堆缓冲区越界读取漏洞。恶意 SSH 服务器或中间人攻击者可通过发送精心构造的 SSH_FXP_NAME 响应，在 SFTP READLINK 和 REALPATH 操作中提供超过实际数据包大小的 link_len 值，由于缺少对可用数据包缓冲区大小的验证直接执行 memcpy 操作，导致最多读取 target_len 减一字节的堆内存内容。该漏洞可导致敏感堆内存泄露或程序崩溃，CVSS 4.0 评分 8.3（HIGH），影响所有使用受影响版本 libssh2 进行 SFTP 通信的客户端应用。已在 commit 2dae302 中修复。"
published = "2026-06-18T21:16:27Z"
remediation = "立即升级 libssh2 到 1.11.2 或更高版本，其中包含对 sftp_symlink() 缓冲区过读漏洞的修复；如果无法立即更新，可临时禁用 SFTP 服务或限制 SSH 连接用户权限作为缓解措施。"
score = 8.3
severity = "HIGH"
sources = ["msrc"]
title = "libssh2 libssh2 SFTP 堆缓冲区越界读取漏洞"
updated = "2026-07-14T23:17:19Z"

