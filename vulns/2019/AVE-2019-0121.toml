[basic]
description = "Zabbix 监控系统在 zabbix.php?action=dashboard.view&dashboardid=1 处存在认证绕过漏洞。未经身份认证的远程攻击者可直接绕过登录页面访问仪表盘页面，并以匿名方式创建 Dashboard、Report、Screen 或 Map 等可视化元素。这些创建的内容可被平台其他用户及管理员访问，可能导致敏感监控数据泄露或恶意配置被持久化。该漏洞影响 Zabbix 4.4 及以下版本，攻击者无需凭据即可在 Web 界面完成利用，危害等级严重。"
published = "2019-10-09T14:15:12.817"
remediation = "立即将 Zabbix 升级至 4.0.15 或更高版本（4.4.2/5.0.0 亦可），新版本默认禁用 Guest 账号，可彻底消除未授权访问风险。如暂时无法升级，请登录 Zabbix 网页管理界面，进入 Administration → Users，将 Guest 用户的状态设置为 Disabled，或删除 Guest 用户并确认前端配置文件中未启用 guest 登录选项，同时在防火墙层面限制 zabbix.php 的对外访问。"
score = 9.1
severity = "CRITICAL"
sources = ["nuclei"]
title = "Zabbix 仪表盘未授权访问漏洞"
updated = "2026-06-17T02:23:51.087"

