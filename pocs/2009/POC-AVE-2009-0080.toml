[info]
author = "ave"
description = "验证目标是否存在 Adobe Flash Player URI 解析堆缓冲区溢出漏洞（CVE-2009-1868）。该漏洞源于 Flash Player 在解析超长或特制 URL 时未进行充分的堆内存边界检查，导致堆缓冲区溢出，可造成应用程序崩溃或任意代码执行。通过请求 ExploitDB 公开的 PoC 页面，检测目标环境中 Flash Player 版本是否受影响（9.0.246.0 之前及 10.x 10.0.32.18 之前）。"
id = "POC-AVE-2009-0080"
name = "CVE-2009-1868 Adobe Flash Player URI Parsing Heap Buffer Overflow PoC"
severity = "high"
tags = ["ave-2009-0080"]
vuln_id = [
    "CVE-2009-1868",
    "AVE-2009-0080",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Adobe Flash Player",
    "application/x-shockwave-flash",
]
