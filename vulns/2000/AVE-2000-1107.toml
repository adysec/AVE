[basic]
description = "Recourse ManTrap 1.6 版本存在特定处理缺陷，当攻击者进入进程的当前工作目录 /proc/self/cwd 并执行 pwd 命令时，工具会异常崩溃并泄露错误信息。这个漏洞影响 Early 2000 年代的网络安全监控工具，攻击者无需认证即可利用该漏洞来检测目标系统是否为蜜罐系统，从而规避安全监控。在蜜罐/沙箱环境中，这种探测行为可能导致安全分析人员的误判，影响整体安全态势感知。漏洞 CVSS 评分 2.1，分类为低危，但其信息披露性质可能被恶意攻击者用作安全防御系统探测工具，在网络安全监控场景中具有潜在危害。"
published = "2001-01-09T05:00:00Z"
remediation = "建议立即停用 Recourse ManTrap 1.6 等已停止维护的老旧蜜罐产品，迁移至现代主动维护的蜜罐解决方案（如 Cowrie、Dionaea、Honeypot.py 等）。若短期无法迁移，可通过以下缓解措施降低风险：1) 在蜜罐系统中挂载 procfs 时添加 hidepid=2 参数（mount -o remount,hidepid=2 /proc），限制非特权用户访问 /proc/self/cwd；2) 使用 chroot 或容器技术隔离蜜罐 shell 环境，禁止攻击者执行 pwd 等探测命令；3) 在网络层面部署流量镜像与行为分析，替代依赖单一蜜罐系统的检测逻辑。参考厂商后续回复（Bugtraq 20001107）建议升级至修复版本，但该产品已于 2002 年随 Recourse 被 Symantec 收购后停止维护，无可用补丁，唯一彻底方案为替换产品。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Recourse ManTrap 蜜罐信息泄露漏洞"
updated = "2026-06-16T21:53:14Z"

