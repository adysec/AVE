[basic]
description = "Balabit syslog-ng 是一款开源的日志管理系统，广泛用于集中收集、过滤和存储系统日志。该漏洞存在于 1.4.6、1.4.7 和 1.4.8 版本的日志优先级（Priority）解析功能中。攻击者可通过向 syslog-ng 服务发送一个格式错误的日志消息，该消息在优先级说明符中缺少右尖括号 `>` 作为闭合标记。由于程序未对优先级字段进行充分的边界检查和格式验证，导致解析异常并触发应用程序崩溃。该漏洞影响运行受影响版本 syslog-ng 的 Linux 和 Unix 服务器。攻击者无需身份认证即可在网络中远程发起攻击，攻击复杂度低，只要目标系统对外开放 syslog 端口（默认为 UDP 514 或 TCP 514），攻击者即可构造恶意日志数据包发送至目标，造成拒绝服务，使日志服务中断，影响系统审计与监控能力。Balabit 后续版本已修复此问题，建议用户升级至最新版本。"
published = "2001-01-09T05:00:00Z"
remediation = "将 Balabit syslog-ng 升级到 1.4.9 或更高版本，该版本已修复对日志消息优先级字段缺少闭合大于号的 malformed input 处理。对于 FreeBSD 系统，安装安全公告 FreeBSD-SA-01:02.syslog-ng 对应的二进制补丁。如暂时无法升级，可在防火墙或入站日志接收端过滤不包含闭合 '>' 的畸形 syslog 消息，限制 untrusted 网络对 syslog 接收端口（默认 514/UDP）的访问，仅允许可信日志源发送数据。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Balabit syslog-ng 拒绝服务漏洞"
updated = "2026-06-16T21:53:17Z"

