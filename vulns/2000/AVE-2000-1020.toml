[basic]
description = "Samba 2.0.7 中的 Web 管理工具 SWAT（Samba Web Administration Tool）存在用户信息枚举漏洞。当远程攻击者尝试登录时，SWAT 对有效用户名和无效用户名返回不同的错误提示信息，攻击者无需身份认证即可通过对比响应差异来枚举服务器上的有效系统用户名。该漏洞可被用于信息收集阶段，为后续针对性攻击（如密码爆破）提供目标用户列表，降低攻击难度。虽然该漏洞不直接导致代码执行或数据泄露，但暴露了系统用户信息，增加了被进一步攻击的风险。建议升级至 Samba 2.0.8 及以上版本。"
published = "2000-12-19T05:00:00.000"
remediation = "将 Samba 升级至 2.0.10 或更高版本，该版本修复了 SWAT 返回不同错误信息导致用户名枚举的问题。如无法升级，可在 SWAT 配置中禁用错误信息差异化输出，或在防火墙层面限制对 SWAT 服务（默认端口 901）的访问，仅允许可信 IP 连接。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Samba Samba Web Administration Tool 用户名枚举漏洞"
updated = "2026-06-16T21:52:48.630"

