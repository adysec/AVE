[basic]
description = "Jodit 编辑器（WYSIWYG 富文本编辑器）的 clean-html 净化功能存在跨站脚本（XSS）漏洞。由于 SVG 或 MathML 命名空间中的元素节点名保持原始大小写（如 `script` 而非 `SCRIPT`），而 denyTags 过滤列表使用大写哈希进行匹配，导致嵌套在 SVG 中的 `<script>` 元素绕过过滤，保留在编辑器值中并在内容加载时执行。攻击者可利用此漏洞实现存储型或 DOM 型 XSS 攻击，在受害者（如管理员）的认证浏览器上下文中执行任意脚本。该漏洞影响 Jodit 4.13.6 之前的所有版本，CVSS 评分 5.3，危害等级中危。"
published = "2026-07-31T20:16:53Z"
remediation = "立即将 Jodit 升级至 4.13.6 或更高版本，该版本修复了 SVG/MathML 命名空间中 script 标签大小写绕过过滤的问题。如无法立即升级，在服务端对用户提交的 HTML 内容进行独立 XSS 过滤（如 DOMPurify），移除所有 `<svg>` 和 `<math>` 内的 `<script>` 元素作为临时缓解措施。"
score = 5.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Jodit Jodit Editor SVG脚本绕过clean-html过滤的跨站脚本漏洞"
updated = "2026-07-31T20:16:53Z"

