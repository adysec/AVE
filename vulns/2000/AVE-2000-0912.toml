[basic]
description = "cyrus-sasl 1.5.24 之前版本在 Red Hat Linux 7.0 中存在授权验证缺陷，本地用户可通过绕过系统设定的访问限制，获取非授权的资源访问权限。该漏洞源于 SASL 库对本地用户授权检查不充分，攻击者利用本地账户即可触发，无需网络访问。成功利用后可导致机密性、完整性和可用性部分受损，CVSS 评分 4.6，危害等级中危。"
published = "2000-12-19T05:00:00Z"
remediation = "升级 cyrus-sasl 至 1.5.24 或更高版本。对于 Red Hat Linux 7.0 系统，通过 `up2date cyrus-sasl` 命令更新软件包，或从 Red Hat 官方仓库下载最新 RPM 包手动安装。如无法升级，可通过限制本地用户对 SASL 认证服务的访问权限作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Red Hat Linux Cyrus SASL 本地授权验证绕过漏洞"
updated = "2026-06-16T21:52:51Z"

