[basic]
description = "Internet Explorer 客户端文件读取漏洞（CVE-2000-0768）是早期 IE 浏览器中存在的客户端文件读取漏洞。漏洞原理在于 IE 对特定协议处理器（如 file://、res:// 等）的安全限制不足，攻击者可构造恶意 HTML 页面诱导用户访问，利用 IE 对本地文件协议处理不当，绕过同源策略读取本地文件系统中的敏感文件内容。影响范围覆盖 Internet Explorer 5.x 及早期 6.0 版本，运行于 Windows 95/98/NT/2000 等系统之上。攻击条件为受害者使用受影响版本 IE 访问攻击者构造的恶意网页，无需用户交互即可触发。利用方式为构造包含 file:// 或 res:// 协议引用本地敏感文件（如系统配置文件、注册表导出文件）的恶意页面，诱导受害者访问后通过脚本读取文件内容并外传。Microsoft 已于 2000 年发布安全公告 MS00-060 发布补丁修复此漏洞，建议升级至 IE 5.01 SP2/5.5 SP2/6.0 以上版本并应用补丁。"
published = "2000-10-20T00:00:00Z"
remediation = '立即升级到最新版本的Microsoft Edge（基于Chromium）或Firefox浏览器彻底替代已废弃的Internet Explorer。如需继续使用IE，请安装2001年发布的IE7安全补丁包，并同时部署2004年发布的IE8初始版，使用支持ActiveX的安全版本。此外，建议禁用IE的ActiveX控制和高危功能，并在防火墙中封锁IE的IE4/IE5激活服务。无法立即升级的情况下，可通过注册表禁用IE的ActiveX控制，并使用 Win + R 运行"about:blank"强制浏览器加载空白页面以降低风险。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Internet Explorer 客户端文件读取漏洞"
updated = "2000-10-20T00:00:00Z"

