[basic]
description = "Atlassian Confluence 5.8.17 之前版本中存在目录遍历漏洞，远程认证用户可通过向 spaces/viewdefaultdecorator.action 或 admin/viewdefaultdecorator.action 的 decoratorName 参数传递包含路径遍历序列的特制请求，读取服务器上的任意配置文件，导致敏感信息泄露。攻击者需拥有 Confluence 有效账户，利用难度较低，无需特殊权限即可实施。Atlassian 已在 5.8.17 版本中修复此漏洞。"
published = "2016-04-11T21:59:11Z"
remediation = "升级至 Atlassian Confluence 5.8.17 或更高版本，该版本已修复 viewdefaultdecorator.action 的目录遍历问题。如无法立即升级，可在反向代理层限制对 /spaces/viewdefaultdecorator.action 和 /admin/viewdefaultdecorator.action 路径的访问，仅允许受信 IP 或管理员网段访问。"
score = 4.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "Atlassian Confluence 目录遍历漏洞"
updated = "2026-06-17T00:34:27Z"

