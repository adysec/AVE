[basic]
description = "Recourse ManTrap 1.6 存在蜜罐识别漏洞，其 `cd` 到 `/proc/self/cwd` 目录后执行 `pwd` 命令时会生成错误信息，导致攻击者能够据此判断当前系统为蜜罐（honeypot）环境而非真实业务主机。该漏洞影响使用 Recourse ManTrap 1.6 版本部署的蜜罐系统，攻击条件为攻击者已获得目标系统的交互式 shell 或命令执行权限。利用方式简单，仅需执行上述两条命令即可通过错误输出特征检测蜜罐，从而绕过诱骗环境、规避入侵检测并直接针对真实资产发起攻击。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 Recourse ManTrap 至 2.0 或更高版本。Recourse Technologies 已于 2000 年 11 月发布 ManTrap 2.0 官方修复包，解决了 jail 环境中 /proc/self/cwd 路径处理不当导致的 honeypot 检测漏洞。建议联系 Recourse Technologies 获取升级包并安装。如暂无法升级，可临时在 ManTrap jail 的 shell 启动脚本中覆盖 pwd 命令，当检测到当前路径为 /proc/self/cwd 时返回正常目录信息而非错误，或通过修改 jail 的 proc 文件系统挂载配置确保该路径行为一致。同时应在 cage 部署后严格监控 cage 内进程列表，防止攻击者利用其他指纹手段识别蜜罐环境。鉴于 ManTrap 已停止维护，长期建议迁移至新一代蜜罐系统。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "Recourse ManTrap 蜜罐检测信息泄露漏洞"
updated = "2026-06-16T21:53:14Z"

