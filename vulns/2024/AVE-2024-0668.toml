[basic]
description = "Linux 内核 wcn36xx WiFi 驱动中存在内存分配大小计算错误漏洞，由于在分配通道调查（channel survey）内存时使用了错误的大小计算方式，导致未初始化内存被使用。KASAN 工具已报告该问题。本地低权限攻击者可通过触发 WiFi 通道扫描操作，使内核访问未初始化的内存区域，导致系统崩溃或信息泄露，造成可用性影响。该漏洞影响使用 wcn36xx 驱动的 Linux 内核版本，CVSS 评分 5.5，危害等级中等。"
published = "2025-02-27T02:15:13Z"
remediation = "立即升级 Linux 内核至安全版本：6.1.129、6.6.76、6.12.13、6.13.2 或更高版本（6.14+）。Debian 11 用户应更新至 DLA-4102-1 提供的内核包，Ubuntu 22.04 LTS 用户应更新至 USN-7653-1 提供的 linux-image-6.8.0-64-generic 版本。无法立即升级时，可卸载 wcn36xx 内核模块（modprobe -r wcn36xx）并黑名单加载以禁用该 WiFi 驱动作为临时缓解。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel wcn36xx WiFi 驱动未初始化内存访问漏洞"
updated = "2026-06-17T08:14:24Z"

