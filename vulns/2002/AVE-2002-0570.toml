[basic]
description = "BizDesign ImageFolio 3.01 及更早版本存在跨站脚本（XSS）漏洞，未经身份认证的远程攻击者可通过向 imageFolio.cgi 的 direct 参数注入恶意脚本，或利用 nph-build.cgi 中的过滤不足，将任意 Web 脚本以其他用户身份在浏览器中执行。攻击者利用该漏洞可窃取用户会话 Cookie、获取敏感信息或重定向用户至恶意页面。该漏洞影响 BizDesign ImageFolio 2.23、2.24、2.26、2.27、3.0.1 及 3.01 等版本，CVSS 评分为 6.8（MEDIUM），攻击向量为网络，攻击复杂度中等，无需身份认证即可远程利用，对机密性、完整性和可用性均造成部分影响。"
published = "2002-12-11T05:00:00Z"
remediation = "立即升级 BizDesign ImageFolio 至 3.1 或更高版本以修复此跨站脚本漏洞。如无法立即升级，应在 Web 服务器层面对 nph-build.cgi 和 imageFolio.cgi 脚本的请求参数实施输入过滤，或通过 Web 应用防火墙（WAF）拦截包含 &lt;script&gt; 等 HTML/JavaScript 标签的 HTTP 请求，同时禁用或删除不必要的 admin 目录下 CGI 脚本作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "BizDesign ImageFolio 跨站脚本攻击漏洞"
updated = "2026-06-16T21:59:07Z"

