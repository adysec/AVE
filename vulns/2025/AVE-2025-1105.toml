[basic]
description = "Linux内核中ksmbd（SMB服务器）存在空指针解引用漏洞。攻击者可通过向目标服务器发送特制的SMB2协商请求触发错误响应，随后在协商阶段未完成的情况下继续发送SMB2会话设置请求。由于此时连接结构体中的preauth_info尚未分配，服务端在调用alloc_preauth_hash()函数时会发生空指针解引用，导致内核崩溃或服务拒绝。该漏洞影响运行受影响内核版本的Linux系统，无需身份认证即可远程利用，CVSS评分为7.5，危害等级高。攻击者仅需向暴露SMB端口的系统发送恶意构造的SMB2协议数据包即可触发漏洞，造成目标系统不可用。"
published = "2025-04-16T15:15:56Z"
remediation = "升级 Linux 内核至修复版本：5.15 内核用户升级至包含 commit 8f216b33a5e1b3489c073b1ea1b3d7cb63c8dc4d 的稳定版；6.6 内核升级至 6.6.107 或更高版本；6.12 内核升级至 6.12.23 或更高版本；6.13 内核升级至 6.13.11 或更高版本；6.14 内核升级至 6.14.2 或更高版本。若无法立即升级，可执行 systemctl stop smbd nmbd 禁用 ksmbd/Samba 服务，或在防火墙规则中限制 SMB 端口（TCP 139、445）仅允许可信客户端访问，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Linux内核 ksmbd 空指针解引用漏洞"
updated = "2026-07-30T06:22:04Z"

