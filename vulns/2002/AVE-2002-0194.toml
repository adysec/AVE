[basic]
description = 'GNU tar 1.13.19 至 1.13.25 版本（及可能后续版本）存在目录遍历漏洞。当解压特制的归档文件时，攻击者可在归档文件中构造 "/.." 或 "./.." 路径字符串，由于 tar 在处理时仅去除前导斜杠而保留 ".." 序列，导致路径穿越检查被绕过。远程攻击者可通过诱导用户解压恶意构造的 tar 归档文件，实现任意文件覆写，进而可能导致代码执行或系统控制。该漏洞 CVSS 评分 5.0，攻击复杂度低，无需身份认证。'
published = "2002-10-10T04:00:00Z"
remediation = "升级 GNU tar 至 1.13.26 或更高版本。Red Hat 用户应安装 RHSA-2002:096 提供的更新包；Debian/Ubuntu 用户运行 apt-get update && apt-get upgrade tar。临时缓解措施：避免以 root 权限解压不可信 tar 文件，解压时使用 --no-overwrite-dir 选项，或先以普通用户解压后手动调整权限。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "GNU tar 目录遍历任意文件写入漏洞"
updated = "2026-06-16T21:57:22Z"

