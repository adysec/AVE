[info]
author = "AVE"
description = "AVE-2012-0304 安全无损验证，通过检测 Safari/WebKit 版本判断是否存在 WebKit 内存破坏漏洞。"
id = "POC-AVE-2012-0304"
name = "CVE-2012-3628 PoC"
severity = "high"
tags = [
    "cve-2012-3628",
    "webkit",
    "safari",
    "memory-corruption",
]
vuln_id = [
    "CVE-2012-3628",
    "AVE-2012-0304",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.headers]
User-Agent = "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_7_4) AppleWebKit/534.46 (KHTML, like Gecko) Version/5.1 Safari/534.46"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = ["Safari/5"]
