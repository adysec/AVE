[basic]
description = "该漏洞存在于 QNX Voyager 网页服务器的嵌入式资源管理器中。该管理器中的一个组件未能正确验证用户请求，使得未经身份验证的攻击者能够通过特定的嵌入式 HTML 网页访问敏感的系统统计信息。攻击者只需向目标系统发送简单的 HTTP 请求，就能够读取包含系统详细信息的页面，导致系统敏感信息泄露。受影响的系统包括安装了 QNX 405 演示磁盘并启用 Voyager 网页服务器的 QNX 嵌入式设备。攻击难度较低，远程无需任何权限即可利用此漏洞。攻击者可以利用读取到的系统统计信息进一步对目标进行侦察，为后续攻击收集情报。该漏洞被评定为中危（CVSS 5.0），直接影响了系统的保密性。微软（QNX）已在安全更新中修复了这一漏洞，建议立即对受影响的系统进行补丁升级。"
published = "2000-12-19T05:00:00.000"
remediation = "立即从 Voyager Web 服务器根目录删除 embedded.html 文件，消除信息泄露路径。将 QNX 4.05 升级至更新的 QNX 版本，并将演示光盘自带的 Voyager Web 服务器更换为生产级 HTTP 服务，同时在防火墙中禁止外部访问系统统计信息页面，仅暴露必要的业务端口。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "QNX Voyager Web Server 2.01B 敏感信息泄露漏洞"
updated = "2026-06-16T21:52:43.980"

