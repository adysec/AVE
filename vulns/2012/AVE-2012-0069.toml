[basic]
description = "Apple iOS 5.1 之前的 Safari 私人浏览（Private Browsing）功能存在隐私保护绕过漏洞（CWE-264）。由于 Safari 未能有效隔离正常浏览会话与私人浏览模式下的访问记录，远程攻击者可诱导用户访问一个特制的恶意网页，该页面中的 JavaScript 代码通过调用 History API 的 pushState 或 replaceState 方法写入历史条目，从而在用户开启私人浏览时仍将相关网址记录进浏览器历史，突破预期的隐私设置。此漏洞影响 iOS 5.1 及更早版本的 Apple iPhone、iPad、iPod touch 设备，攻击条件为诱使用户在默认或正常网络环境访问恶意构造网页，攻击无需身份认证，CVSS 评分 5.0（中危），可导致用户隐私信息（如浏览记录）泄露。"
published = "2012-03-08T22:55:01Z"
remediation = """
tags.

Let me write a clean, specific, actionable Chinese remediation, ≥20 chars.<value>建议立即将受影响设备升级至 iOS 5.1 及以上版本，或安装苹果 2012 年 3 月通过 iTunes 更新（APPLE-SA-2012-03-07-2）及 iOS 5.1 安全更新的补丁（http://lists.apple.com/archives/security-announce/2012/Mar/msg00001.html），该版本修复了 Safari 私人浏览模式中 pushState/replaceState 绕过隐私设置的问题；更新前请通过 iTunes 或 iCloud 备份重要数据。对暂时无法升级的设备，可在"设置-访问限制（内容与隐私）"中停用 Safari 浏览器，或限制浏览器历史记录的保留；同时提示用户切勿在私人浏览（Private Browsing）会话中访问不受信任的网页或点击可疑链接，避免恶意 JavaScript 调用 History API 写入非预期浏览记录，减少隐私泄露风险。"""
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iOS Safari 隐私浏览功能权限绕过漏洞"
updated = "2026-06-16T23:37:52Z"

