[basic]
description = "WordPress 插件 simpel-reserveren 3.5.2 版本中存在反射型跨站脚本（XSS）漏洞，该漏洞源于程序未对用户输入进行充分的过滤与转义处理。攻击者可利用该漏洞向目标用户发送特制的恶意链接，当用户点击链接后，恶意脚本将在用户浏览器中执行，导致敏感信息泄露或页面内容篡改。攻击无需身份认证，但需要用户交互配合。该漏洞影响 simpel-reserveren 插件 3.5.2 及更早版本，CVSS 评分 6.1，危害等级中危。"
published = "2016-10-10T20:59:27Z"
remediation = "立即升级 simpel-reserveren 插件至 3.5.3 或更高版本（WordPress 后台插件页面检查更新或手动从 wordpress.org/plugins/simpel-reserveren 下载最新版）。如插件已下架无法更新，则立即在后台停用并删除该插件，改用其他仍在维护的预约管理插件替代。同时可在 Web 应用防火墙（WAF）中添加规则拦截 `edit.php` 中 `page` 参数的恶意脚本载荷作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress simpel-reserveren 插件反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:46Z"

