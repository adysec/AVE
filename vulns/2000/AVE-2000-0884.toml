[basic]
description = "Jeremy Arnold Worm Webserver 1.0 存在拒绝服务漏洞，远程攻击者可通过向目标服务器发送超长 URL 请求触发该漏洞，导致 Worm HTTP 服务进程崩溃或停止响应，造成服务不可用。攻击无需身份认证，攻击复杂度低，但仅影响服务可用性，不涉及数据泄露或完整性破坏。该漏洞影响 Worm Webserver 1.0 版本，目前官方已停止维护，建议用户迁移至其他受支持的 Web 服务器软件。"
published = "2000-10-20T04:00:00.000"
remediation = "立即停止使用 Worm Webserver 1.0，该产品已停止维护且无安全补丁。建议迁移至 Apache HTTP Server 2.4.x 或 Nginx 1.x 等现代 Web 服务器。如无法立即迁移，可在 Web 服务器前端部署反向代理（如 Nginx），在 proxy 层限制请求 URI 长度不超过 4096 字节，并配置 Web 应用防火墙（WAF）拦截超长 URL 请求作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Jeremy Arnold Worm Webserver 1.0 长URL远程拒绝服务漏洞"
updated = "2026-06-16T21:52:22.003"

