[basic]
description = "Google Chrome 20.0.1132.43 之前版本中存在释放后使用（Use-after-free）漏洞，该漏洞源于对包含节（sections）的 HTML 表格对象处理不当，在内存对象被释放后未正确清除指针。远程攻击者可通过诱导用户访问特制网页，触发浏览器对已释放内存的访问，导致拒绝服务或可能执行任意代码。攻击无需身份认证，仅需用户正常浏览网页即可触发，危害等级高。"
published = "2012-06-27T10:18:38.493"
remediation = "升级 Google Chrome 至 20.0.1132.43 或更高版本，该版本已修复表节处理中的释放后重用漏洞。使用 Apple Safari 的用户应升级至 Safari 6.0.1（OS X Lion）或 Safari 5.1.7（OS X Snow Leopard），对应 Apple 安全公告 HT5485 和 HT5502。基于 WebKit 的第三方应用应同步更新至修复后的 WebKit 版本。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome 节表释放后使用漏洞"
updated = "2026-06-16T23:42:09.293"

