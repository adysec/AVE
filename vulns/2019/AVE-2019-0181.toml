[basic]
description = "Sell Media 插件 v2.4.1 的 /inc/class-search.php 文件在生成搜索结果页面时，对用户输入的 keyword 参数（即 $search_term 或搜索框内容）未进行充分的转义过滤，导致存在跨站脚本（XSS）漏洞。未经身份认证的远程攻击者可通过构造包含恶意 JavaScript 代码的搜索关键字，当其他用户浏览包含该搜索结果的页面时，恶意脚本将在受害者浏览器中执行，从而窃取 Cookie、会话令牌等敏感信息或实施其他恶意操作。该漏洞影响使用 Sell Media 插件的 WordPress 网站，攻击者无需预先认证即可发起攻击，但需要受害者访问恶意构造的搜索链接才能触发。GraphPaperPress 已在后续版本中对搜索输入进行了 htmlspecialchars 转义处理以修复此漏洞。"
published = "2020-08-14T14:15:12Z"
remediation = "建议立即升级 Sell Media 插件至 2.4.2 或更高版本（含修复提交 8ac8cebf332e0885863d0a25e16b4b180abedc47）。如暂时无法升级，可通过 WordPress 后台禁用该插件，或在 Web 应用防火墙（WAF）配置规则拦截包含 `<script>`、`onerror=`、`onload=` 等 XSS 特征的 keyword 搜索参数请求。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "graphpaperpress Sell Media 跨站脚本漏洞"
updated = "2026-06-17T02:38:37Z"

