[basic]
description = "phpWebLog 0.4.2 的 common.inc.php 文件未正确初始化 $CONF 数组，导致系统将管理员密码意外设置为单个字符，远程攻击者无需认证即可通过暴力猜测 SiteKey 绕过管理员认证机制，获取 phpWebLog 后台完全管理权限。该漏洞影响 phpWebLog 0.4.2 及可能更早版本，攻击复杂度低，仅需网络访问即可利用。"
published = "2001-02-16T05:00:00.000"
remediation = "立即将 phpWebLog 升级至 0.4.3 或更高版本，该版本已修复 common.inc.php 中 $CONF 数组未正确初始化导致密码被设为单字符的问题。如已无法获取更新版本，建议迁移至其他受支持的 Web 日志系统（如 WordPress），并在迁移前严格限制对 phpWebLog 管理后台的访问 IP 范围。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "phpWebLog 管理员认证绕过漏洞"
updated = "2026-06-16T21:53:38.010"

