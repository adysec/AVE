[basic]
description = "tags.<value>X.Org X server 的 XKB 兼容映射（compatibility map）处理逻辑中存在整数下溢漏洞（CWE-191）。当攻击者构造特制的键盘兼容映射数据时，相关代码在下溢后进行内存读取操作，从而触发缓冲区读取越界（buffer read overrun），破坏内存安全约束。该漏洞影响 X.Org X server 及基于其架构的 Xwayland 等实现，广泛波及使用 X11 的 Linux/Unix 桌面环境。攻击者需具备对 X11 服务器的本地或远程访问能力，且需拥有本地低权限账户（CVSS 向量 AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H），攻击复杂度较低且无需用户交互。利用该漏洞可导致内存越界读取，轻则造成拒绝服务（DoS），重则可能进一步升级为内存破坏、信息泄露甚至任意代码执行。该漏洞由 ZDI（ZDI-26-333 / ZDI-CAN-28593）报告，CVSS 评分为 7.8，危害等级为高危，各 Linux 发行版厂商（如 Red Hat）已将其标记为重要安全更新，建议及时升级 X.Org 及 Xwayland 相关软件包。"
published = "2026-04-23T16:16:24Z"
remediation = """
The user wants me to fix the [remediation] field for CVE-2026-33999. The presearch data has concrete fix version info from Debian tracker:
- xorg-server 2:21.1.22-1 (fixed)
- trixie: xorg-server 2:21.1.16-1.3+deb13u2
- bookworm: xorg-server 2:21.1.7-3+deb12u12

Also X.Org announcement link: https://lists.x.org/archives/xorg-announce/2026-April/003677.html

Red Hat erratas RHSA-2026:10739 etc.

I should write a concrete, actionable Chinese remediation ≥20 chars, citing the Debian fixed versions and Red Hat errata.

Let me craft the remediation field value.<value>建议立即升级 X.Org X server 及 Xwayland 至官方修复版本：根据 Debian 安全通告，Debian unstable 修复版本为 xorg-server 2:21.1.22-1，trixie 为 2:21.1.16-1.3+deb13u2，bookworm 为 2:21.1.7-3+deb12u12；Red Hat 各产品线已发布 RHSA-2026:10739、RHSA-2026:11352 等安全更新（详见 https://access.redhat.com/security/cve/CVE-2026-33999），请使用发行版包管理工具安装对应补丁包（如 `apt upgrade xorg-server xwayland`、`yum"""
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "X.Org X server XKB整数下溢漏洞"
updated = "2026-07-15T02:20:27Z"

