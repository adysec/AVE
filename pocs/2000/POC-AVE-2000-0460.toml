[info]
author = "ave"
description = "Apacheftpd 1.3.6 产品存在目录遍历漏洞，攻击者可通过向 FTP 服务发送包含 '..' 序列的特制路径请求，突破目录限制读取服务器上的任意文件。这一漏洞源于FTP服务器对用户输入的文件路径缺乏充分的过滤与验证，攻击者可利用此漏洞窃取敏感配置文件、密码文件等任意系统文件，导致机密信息泄露。"
id = "POC-AVE-2000-0460"
name = "Apacheftpd FTP服务器目录遍历漏洞 PoC"
severity = "critical"
tags = ["ave-2000-0460"]
vuln_id = [
    "CVE-2000-0577",
    "AVE-2000-0460",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/path/to/vulnerable-endpoint"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
