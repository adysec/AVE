[basic]
description = "tags.<value>csSearch 2.3 及更早版本中的 csSearch.cgi 脚本存在代码注入漏洞。远程攻击者无需身份认证，即可通过发送包含 savesetup 命令和 setup 参数的特制 HTTP 请求，将任意 Perl 代码写入 setup.cgi 配置文件。由于 csSearch.cgi 在处理请求时会加载该配置文件，攻击者注入的代码将在服务器端以 Web 服务权限执行，最终导致完全控制目标服务器。该漏洞影响所有使用 csSearch 2.3 及更早版本的网站，CVSS 评分为满分 10.0，危害等级为严重。攻击者可通过此漏洞获取服务器权限、篡改网站内容或进一步渗透内网。"
published = "2002-08-12T04:00:00Z"
remediation = "建议将 csSearch 升级至 2.31 或更高版本（厂商已发布补丁修复 savesetup 命令对 setup 参数的代码注入漏洞）。升级后，验证 /cgi-bin/csSearch.cgi 不再接受 savesetup 命令写入 setup.cgi 配置文件。若暂时无法升级，应从 Web 服务器中移除 csSearch.cgi 及其相关文件，或通过 Web 服务器配置（如 Apache 的 Require local）限制仅本地访问该 CGI 脚本。同时，检查服务器上的 setup.cgi 文件权限，移除 Web 服务器进程对其的写入权限，防止被远程覆盖写入恶意 Perl 代码。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "CSSearch csSearch 2.3 远程命令执行漏洞"
