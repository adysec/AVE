[basic]
description = "JBoss 3.0.8 和 3.2.1 版本内嵌的 HSQLDB 组件存在 SQL 注入漏洞（CWE-89）。该漏洞出现在 Java 1.4.x 平台的默认配置环境中，未经身份认证的远程攻击者可通过向目标系统发送特制的 SQL 语句发起攻击。受影响版本中，JBoss 3.2.1 通过 TCP 1701 端口、JBoss 3.0.8 通过 TCP 1476 端口暴露 HSQLDB 服务，攻击者利用该漏洞可执行未授权操作，甚至可能通过数据库功能进一步执行任意系统命令，最终导致服务器被完全控制。"
published = "2003-11-17T05:00:00Z"
remediation = "建议立即将 JBoss 升级到 3.2.2 或更高版本，新版本已修复 HSQLDB 组件的远程命令注入漏洞，不再默认暴露 HSQLDB 端口。如无法立即升级，可临时通过防火墙规则禁用 1701/TCP（JBoss 3.2.1）或 1476/TCP（JBoss 3.0.8）端口的对外访问，或在 jboss-service.xml 中注释掉 HSQLDB MBean 配置以关闭该服务，仅允许本地回环地址访问。同时建议检查服务器日志中是否存在异常 SQL 查询或系统命令执行痕迹，确认未被利用后实施升级。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "JBoss HSQLDB 远程代码执行漏洞"
updated = "2026-06-16T22:03:04Z"

