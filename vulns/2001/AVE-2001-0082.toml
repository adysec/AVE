[basic]
description = "Micro Focus Cobol 4.1 开发套件在启用 AppTrack 功能时，会在系统中安装 mfaslmf 目录及 nolicense 脚本文件，但这两个资源被赋予了不安全的文件权限。本地低权限攻击者可通过修改 nolicense 脚本内容向其中植入恶意代码，等待应用服务器许可证被用尽后，该脚本将以 root 权限执行，从而使攻击者获得系统最高权限，实现任意命令执行。该漏洞影响运行 Micro Focus Cobol 4.1 的 Unix 平台，利用过程无需身份验证，攻击者仅需具备本地访问权限即可完成提权操作。"
published = "2001-06-02T04:00:00Z"
remediation = "立即禁用 Micro Focus Cobol 4.1 的 AppTrack 功能，或在安装时选择不启用该功能，从而避免创建权限不安全的 mfaslmf 目录及 nolicense 文件。如业务需要保留 AppTrack，请将 /var/mfaslmf/nolicense 文件权限修改为仅 root 可读写（chmod 700 /var/mfaslmf/nolicense），并将 mfaslmf 目录权限收紧为 750（chmod 750 /var/mfaslmf），同时以 root 身份删除目录内所有可被普通用户修改的脚本。建议升级至 Micro Focus Cobol 后续版本，以彻底修复该权限配置缺陷。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Micro Focus Cobol 4.1 本地权限提升漏洞"
updated = "2026-06-16T21:53:53Z"

