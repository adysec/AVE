[basic]
description = "tags.<value>PlanetIntra 2.5 中的 pi 程序存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过发送特制的数据包触发该漏洞，在目标系统上执行任意命令。该漏洞影响 PlanetIntra 2.5 及可能更早版本，CVSS 评分为 10（最高危），攻击向量为网络、攻击复杂度低、无需认证即可利用，可导致完全的信息泄露、完整性破坏和可用性丧失。"
published = "2001-05-03T04:00:00.000"
remediation = "立即停止运行 PlanetIntra 2.5 的 pi 程序服务，或在网络防火墙层面禁止外部访问该服务所在端口。如需继续使用，应联系厂商获取安全更新版本，或迁移至已修复此缓冲区溢出漏洞的替代产品。在未获得补丁前，禁止将 PlanetIntra 服务暴露在公网或不受信任的网络区域中。"
score = 10
severity = "CRITICAL"
