[basic]
description = "Trend Micro Interscan VirusWall 3.6.x及更早版本的Web管理接口未对通信内容进行加密保护。未经身份认证的远程攻击者可通过网络嗅探手段截获管理员提交的HTTP GET请求，或直接访问setpasswd.cgi等管理程序，从中提取base64编码的用户名和密码凭据，进而获取系统管理员权限。该漏洞影响所有部署了受影响版本Interscan VirusWall的邮件安全网关设备，攻击者无需任何前置认证即可远程利用，导致系统完全被接管并可能进一步渗透内部网络。"
published = "2001-03-12T05:00:00.000"
remediation = "Trend Micro 确认 Interscan VirusWall 3.6.x 及更早版本无法通过补丁修复此漏洞，建议立即升级到 3.7.x 或更高版本，新版已对 Web 管理接口启用 HTTPS 加密传输。如暂无法升级，应在防火墙层面仅允许受信任的 IP 地址访问管理端口 1812，或仅在本地主机使用浏览器配置工具，避免远程通过 HTTP 协议传输管理员凭证。同时建议修改默认管理员密码为高强度密码，并定期审计 /tmp 目录下可疑的临时文件。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "趋势科技 Interscan VirusWall 弱管理员密码保护漏洞"
updated = "2026-06-16T21:53:44.053"

