[basic]
description = "Mozilla Firefox 4.x至9.0、Thunderbird 5.0至9.0及SeaMonkey 2.7之前版本的浏览器引擎中存在未指定的内存安全漏洞。远程攻击者可通过构造特制的网页，诱使用户访问，触发内存破坏，导致目标应用程序崩溃或拒绝服务，在特定条件下可能实现任意代码执行。该漏洞无需认证即可远程利用，攻击复杂度低，CVSS评分10.0，危害严重。Mozilla已在Firefox 10.0、Thunderbird 10.0及SeaMonkey 2.7中修复此漏洞。"
published = "2012-02-01T16:55:00Z"
remediation = "升级 Mozilla Firefox 至 10.0 及以上版本，Thunderbird 至 10.0 及以上版本，SeaMonkey 至 2.7 及以上版本。对于无法立即升级的系统，可禁用 JavaScript 执行（about:config 中设置 javascript.enabled=false）作为临时缓解措施，或使用 NoScript 等扩展限制不可信站点脚本执行。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/SeaMonkey/Thunderbird 内存破坏漏洞"
updated = "2026-06-16T23:37:16Z"

