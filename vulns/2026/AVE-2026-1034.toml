[basic]
description = "Phoenix Contact CHARX SEC-3150 电动汽车充电控制器固件中存在信任边界违规漏洞（CWE-501）。该设备的 MQTT Broker 服务未对客户端进行身份认证和输入验证，未经身份验证的远程攻击者可通过向 MQTT Broker 发送特制的恶意 ID 请求，导致系统在配置中创建新的配置条目。攻击者可借此篡改设备配置参数，造成完整性破坏和服务中断（可用性丧失）。该漏洞影响 CHARX SEC-3150 固件 1.9.1 以下版本。尽管该设备设计用于封闭工业网络且通常部署在防火墙后方，但一旦 MQTT Broker 暴露于网络可达范围内，攻击者即可在无需任何凭据和用户交互的情况下完成利用。Phoenix Contact 已发布固件版本 1.9.1 修复此漏洞，建议用户升级并确保设备部署在受保护的内部网络中。"
published = "2026-07-30T07:16:56.963"
remediation = "立即将 Phoenix Contact CHARX SEC-3xxx 系列 EV 充电控制器的固件升级至 1.9.1 或更高版本，升级文件可从 Phoenix Contact 官网或 CERT VDE 公告 VDE-2026-008 获取。如暂时无法升级，应在网络边界部署防火墙规则，仅允许可信管理主机访问 MQTT Broker 端口，并将设备限制在封闭工业网络内。升级完成后，需检查系统配置中是否存在恶意 ID 条目并清除，同时审计所有配置变更记录。"
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "Phoenix Contact CHARX SEC-3150 MQTT Broker 未授权配置篡改漏洞"
updated = "2026-07-31T23:17:23.707"

