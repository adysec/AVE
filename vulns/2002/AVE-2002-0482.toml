[basic]
description = "Cisco Secure Access Control Server (ACS) 3.0 for Windows NT 的 setup.exe 页面存在跨站脚本漏洞。远程攻击者可通过向 setup.exe 的 action 参数注入恶意脚本或 HTML 代码，当其他用户访问特制链接时，恶意脚本将在用户浏览器中执行，导致敏感信息泄露、会话劫持等危害。攻击无需身份认证，利用方式简单，仅需诱使用户点击恶意链接即可触发。"
published = "2002-10-04T04:00:00.000"
remediation = "升级 Cisco Secure ACS 至 3.0.1 或更高版本，该版本修复了 setup.exe 对 action 参数输入验证不足的问题。如无法立即升级，可在 Web 服务器或反向代理层限制对 /setup.exe 的访问，仅允许受信管理 IP 访问，并对 action 参数实施严格的字符白名单过滤（仅允许字母数字）。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Cisco Secure ACS for Windows NT 3.0 跨站脚本漏洞"
updated = "2026-06-16T21:58:25.440"

