[basic]
description = "Microsoft IIS 2.0/3.0/4.0/5.0/5.1 版本存在内部 IP 地址泄露漏洞。当攻击者向受基本认证保护且未定义 realm 字段的网页发送 HTTP 1.0 请求时，服务器会在 401 未授权响应中泄露其内部 IP 地址。攻击者无需认证即可远程利用，通过获取内网 IP 可为进一步渗透提供网络拓扑信息。该漏洞影响范围广泛，覆盖 IIS 多个主要版本。"
published = "2000-07-13T04:00:00.000"
remediation = "升级到 IIS 6.0 或更高版本，该漏洞已在后续版本修复。如无法升级，安装 IIS Lockdown Tool 和 URLScan 工具，配置基本身份验证时始终指定 realm 参数，防止未定义 realm 时泄露内部 IP。"
score = 2.6
severity = "LOW"
sources = ["epss"]
title = "Microsoft IIS 内部IP地址泄露漏洞"
updated = "2026-06-16T21:52:11.267"

