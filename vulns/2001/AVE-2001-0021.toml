[basic]
description = "Cisco Catalyst 系列交换机运行 CatOS 系统时，Telnet 认证过程存在内存泄漏漏洞。远程攻击者可通过向目标交换机发送大量失败的 Telnet 认证请求，导致系统内存资源被持续消耗，最终造成设备拒绝服务。该漏洞影响 Cisco Catalyst 4000/5000/6000 系列交换机运行 CatOS 5.5.4a 及之前版本，攻击者无需认证即可远程触发，CVSS 评分 7.8，危害等级高。Cisco 已发布安全公告建议升级系统版本或限制 Telnet 访问以缓解风险。"
published = "2001-02-16T05:00:00Z"
remediation = "将 Cisco CatOS 升级至 5.5.5 或更高版本以修复 Telnet 认证内存泄漏漏洞。如无法立即升级，可在交换机 ACL 中限制 Telnet（端口 23）的源 IP 范围，仅允许受信任的管理网段访问，并启用 SSH 替代 Telnet 进行远程管理。同时监控交换机内存使用情况，在内存耗尽前重启设备作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["cve"]
title = "Cisco Catalyst 4000/5000/6000 系列交换机 Telnet 认证内存泄漏拒绝服务漏洞"
updated = "2026-06-16T21:53:32Z"

