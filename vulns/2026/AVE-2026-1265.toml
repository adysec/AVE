[basic]
description = "Trend Micro Cleaner One Pro 的垃圾文件清理功能中存在符号链接跟踪（link following）漏洞。攻击者首先需要在目标系统上获得执行低权限代码的能力，随后通过创建目录联接（junction）的方式，诱使 Cleaner One Pro 的后台服务以 SYSTEM 权限跟踪该链接并删除任意文件。该漏洞影响 Trend Micro Cleaner One Pro 的受影响安装版本，本地攻击者可利用此漏洞删除目标系统上的任意文件，造成数据丢失或系统不稳定。Trend Micro 已发布安全更新修复此漏洞，建议用户及时升级至最新版本。"
published = "2026-01-01"
remediation = "建议立即升级 Trend Micro Cleaner One Pro 至 6.8.375 或更高版本（受影响版本为 6.8.359 及以下）。通过软件内置的更新功能或访问 Trend Micro 官网下载最新安装包进行升级。若暂时无法更新，可在任务管理器中禁用 Cleaner One Pro 相关服务作为临时缓解措施，防止垃圾文件清理功能被滥用删除任意文件。详见厂商公告：https://helpcenter.trendlife.com/en-us/article/TMKA-13319"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "SolarWinds Web Help Desk 远程代码执行漏洞"
updated = "2026-01-01"

