[basic]
description = "这是一个关于 GNOME gdm、KDE kdm 和 wdm 显示管理器 XDMCP（X 显示管理器控制协议）解析代码的缓冲区溢出漏洞。当处理特制的、过长的 FORWARD_QUERY 请求时，攻击者可以触发溢出。该漏洞允许远程、非认证攻击者在目标系统中执行任意命令或导致拒绝服务。漏洞影响广泛的 Linux 发行版，任何未修复的系统中均存在风险。该漏洞属于网络攻击类型，攻击条件简单，攻击者无需任何权限即可远程利用。根据 CVSS 评分（10 分）及其向量（AV:N/AC:L/Au:N/C:C/I:C/A:C）表明该漏洞可以导致完整的系统 compromise，具有极其严重的危险性和广泛的影响范围。"
published = "2000-05-24T04:00:00Z"
remediation = "升级到 gdm 1.2.x 或更高版本以获取安全补丁。如果无法立即升级，建议通过防火墙禁用 XDMCP 服务（端口177），并移除或禁用不必要的 XDMCP 认证方式。具体措施：1) 配置 XDMCP 为仅本地网络开放访问 2) 限制 XDMCP 配置文件权限 3) 如需保留 XDMCP 功能，请使用强认证机制并限制连接数量"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "GNOME GDM/KDE KDM/WDM XDMCP 缓冲区溢出漏洞"
updated = "2026-06-16T21:51:50Z"

