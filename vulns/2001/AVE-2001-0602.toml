[basic]
description = "Sun Cluster 2.x 中的 in.mond 守护进程存在本地任意文件读取漏洞。本地攻击者可通过在运行 HA-NFS 的主机状态文件上实施符号链接攻击，利用该漏洞读取系统上的任意文件，导致敏感信息泄露。攻击条件为拥有本地系统访问权限，无需身份认证即可利用，危害等级低，CVSS 评分 2.1。"
published = "2001-02-12T05:00:00.000"
remediation = "立即升级至 Oracle Solaris Cluster 4.x 或更高版本（Sun Cluster 2.x 已停止支持多年）。如无法升级，作为临时缓解措施：限制本地用户登录受影响的 HA-NFS 节点，使用 chmod 600 收紧 in.mond 状态文件权限，并启用 Solaris 内核级 symlink 保护（设置 fs.symlink_attack_protection=1）。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Sun Cluster 2.x 本地任意文件读取漏洞"
updated = "2026-06-16T21:53:36.893"

