[basic]
description = "PHP 5.3.9 及之前版本在修复哈希碰撞拒绝服务漏洞（CVE-2011-4885）时引入了新的远程代码执行漏洞。该漏洞位于 php_variables.c 文件中的 php_register_variable_ex() 函数，修复方案新增了 max_input_vars 配置变量用于限制输入变量数量，但当输入变量超过该阈值且正在处理的变量为数组类型时，会触发数组处理逻辑错误，导致任意代码执行。远程攻击者无需身份认证即可通过向目标服务器发送特制的包含大量数组变量的 HTTP 请求触发该漏洞，完全控制受影响系统。该漏洞影响所有使用 PHP 5.3.9 的 Web 服务器，CVSS 评分 7.5，危害等级高。"
published = "2012-02-06T20:55:03Z"
remediation = "立即升级 PHP 至 5.3.10 或更高版本，该版本已修复 php_register_variable_ex() 中因 max_input_vars 超限导致的数组处理不当问题。如无法立即升级，可在 php.ini 中将 max_input_vars 设置为较低值（如 100）并限制 max_input_nesting_level 以降低攻击面，同时部署 WAF 规则拦截超量 POST 参数请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "PHP PHP php_register_variable_ex 函数远程代码执行漏洞"
updated = "2026-06-16T23:38:20Z"

