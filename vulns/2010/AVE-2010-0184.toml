[basic]
description = "RealNetworks RealPlayer 的 Cook 音频编解码器在初始化时未正确设置声道数（number of channels），导致未初始化的内存访问漏洞。远程攻击者可通过诱导用户打开特制的媒体文件触发该漏洞，造成敏感信息泄露。该漏洞影响 RealPlayer 11.0~11.1、RealPlayer SP 1.0~1.1.4、RealPlayer Enterprise 2.1.2、Mac RealPlayer 11.0~11.1 及 Linux RealPlayer 11.0.2.1744 等多个版本，攻击无需身份认证，利用复杂度低。"
published = "2010-12-14T16:00:02Z"
remediation = "升级 RealPlayer 至 12.0.1.609 或更高版本，该版本修复了 Cook 编解码器未初始化通道数导致的内存访问漏洞。如无法立即升级，可在浏览器中禁用 RealPlayer 浏览器插件（NPAPI/ActiveX），并避免打开来源不明的媒体文件（.rm/.ra/.ram），以降低被远程利用的风险。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "RealNetworks RealPlayer cook编解码器内存访问漏洞"
updated = "2026-06-16T23:21:01Z"

