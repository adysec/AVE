[basic]
description = "DrayTek Vigor3900、Vigor2960 和 Vigor300B 设备在 1.5.1 版本之前，cgi-bin/mainfunction.cgi/cvmcfgupload 接口在处理文件上传时未对文件名中的 shell 元字符进行有效过滤，当使用 text/x-python-script 内容类型时，远程未经身份认证的攻击者可通过构造包含特殊字符的文件名触发 OS 命令注入，实现远程代码执行。该漏洞影响大量 DrayTek 企业级路由器和安全设备，CVSS 评分 9.8，危害等级严重。厂商已在 1.5.1 版本中修复此漏洞。"
published = "2020-06-30T14:15:11.953"
remediation = "立即将 DrayTek Vigor3900、Vigor2960 和 Vigor300B 设备固件升级至 1.5.1 或更高版本。升级路径：登录设备管理后台 → 系统维护 → 固件升级 → 上传官方最新固件。如无法立即升级，可在防火墙上限制对设备 80/443 端口的公网访问，仅允许受信任 IP 连接管理界面，并禁用 cgi-bin/mainfunction.cgi 的未授权访问。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "DrayTek Vigor3900、Vigor2960、Vigor300B 远程命令执行漏洞"
updated = "2026-06-17T02:56:38.220"

