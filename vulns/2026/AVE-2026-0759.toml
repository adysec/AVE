[basic]
description = "Easy!Appointments（开源预约调度系统）1.6.0之前版本中存在授权绕过漏洞（CWE-639）。`application/controllers/Google.php:278` 的 `Google::oauth` 方法将URL传入的 `provider_id` 直接存入会话而未校验调用者是否拥有该提供商，导致任意已登录的后端用户（管理员、服务提供者或秘书）可劫持其他服务提供者的Google OAuth绑定。攻击成功后，受害者的预约数据（含客户姓名、邮箱）将同步至攻击者的Google日历，攻击者还可通过删除日历事件来清除受害者的预约记录，或通过创建事件插入不可用时段。攻击条件：攻击者需拥有后端登录权限，且目标实例已配置Google Calendar OAuth同步功能。该漏洞CVSS评分3.1，危害等级低，已在1.6.0版本中修复。"
published = "2026-07-14T16:17:00Z"
remediation = "立即升级至 Easy!Appointments 1.6.0 或更高版本，该版本在 `Google::oauth` 方法中增加了 `cannot('edit', PRIV_USERS) && (int) session('user_id') !== (int) $provider_id` 权限检查，阻止非管理员或非所属服务提供者绑定他人的 Google OAuth。如无法立即升级，可手动在 `application/controllers/Google.php:278` 的 `oauth` 方法开头添加上述权限检查逻辑作为临时缓解措施。"
score = 3.1
severity = "LOW"
sources = ["ghsa"]
title = "alextselegidis Easy!Appointments Google OAuth 授权绕过漏洞"
updated = "2026-07-14T16:42:11Z"

