[basic]
description = "Guzzle PHP HTTP 客户端存在主机名校验绕过漏洞。受影响的版本在处理请求 URI 与 Host 头时分别传递给传输层：cURL 和 StreamHandler 按原始文本设置请求地址，但 libcurl 会自行解析权限部分并对域名进行百分号解码及 IDNA 映射，导致实际连接的主机与应用程序校验通过的主机不一致。例如 `http://127.0.0.%31/` 经 filter_var() 校验为非法的 IP 字面量而被放行，但 libcurl 将其解码后实际连接到 127.0.0.1（本地回环），且无需 DNS 查询。攻击者若能控制请求 URI，即可通过非规范编码（如百分号转义、Unicode IDN 映射、用户信息注入 `blocked.example.com@127.0.0.1`）绕过 IP 白名单、私有网段和域名黑名单等防护，实现 SSRF 攻击读取内部服务响应。此外，Cookie 中间件根据 URI 原文而非实际连接主机存储 Cookie，可造成跨租户 Cookie 污染；RedirectMiddleware 的 Authorization 和 Cookie 剥离决策也受影响。该漏洞影响 Guzzle 7.x 早于 7.15.2 及 8.0.0 的所有版本，CVSS 评分 7.2。官方已在 7.15.2 和 8.0.1 版本中对所有内置处理器增加了主机名校验，修复了此类绕过问题。"
published = "2026-08-03T21:16:42Z"
remediation = "将 Guzzle 升级到 7.15.2 或 8.0.1 及以上版本。若暂无法升级，需在将 URI 交给 Guzzle 前自行校验主机名：确保 host 仅包含可打印 ASCII 字符（0x21-0x7E）、不含百分号与 URI 分隔符、不以句点结尾；同时单独校验显式 Host 头，拒绝含百分号的 Host 值。对不受信任来源的 URI，建议解析后重新验证并禁止跳转至内网地址，必要时使用独立 cookie 容器隔离来源。"
score = 7.2
severity = "HIGH"
sources = ["ghsa"]
title = "Guzzle HTTP客户端 非规范主机绕过主机校验漏洞"
updated = "2026-08-04T15:16:42Z"

