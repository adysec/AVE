[info]
author = "ave"
description = "Apple iTunes 使用的 WebKit 引擎存在内存破坏漏洞，未身份认证的远程攻击者可通过诱导用户访问恶意网页触发该漏洞，导致任意代码执行或应用程序崩溃。该漏洞影响 iTunes 10.7 之前的版本，攻击者需构造包含恶意内容的网页，诱导用户访问后即可利用此漏洞实施攻击。"
id = "POC-AVE-2012-0352"
name = "CVE-2012-3676 PoC"
severity = "medium"
tags = ["ave-2012-0352"]
vuln_id = [
    "CVE-2012-3676",
    "AVE-2012-0352",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["WebKit"]
