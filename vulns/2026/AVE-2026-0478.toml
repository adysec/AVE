[basic]
description = "EasyAdmin 后台管理面板的 FileField 和 ImageField 字段默认接受浏览器可执行文件类型（FileField 无 MIME/扩展名限制，ImageField 的 Image 约束接受 SVG 格式）。当上传目录配置在 Web 公开可访问路径下时，攻击者可通过具有上传权限的账户上传包含恶意 JavaScript 的 .html 或 .svg 文件。其他管理员在后台访问该文件时，由于文件与后台同源，恶意脚本将在认证会话上下文中执行，导致会话令牌窃取、CSRF 令牌泄露或权限提升。该漏洞为存储型 XSS，需开发者将上传目录置于公开路径且存在上传者与查看者之间的权限差才能利用。"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 easycorp/easyadmin-bundle 升级到 v5.0.13 或更高版本（composer require easycorp/easyadmin-bundle:^5.0.13），该版本默认对 .html/.svg 等危险文件类型强制下载而非内联渲染。如无法立即升级，可在 Nginx/Apache 中为上传目录配置 Content-Disposition: attachment 响应头，或将上传目录移至 public 目录之外。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "EasyCorp EasyAdmin 存储型跨站脚本漏洞"
updated = "2026-01-01T00:00:00Z"

