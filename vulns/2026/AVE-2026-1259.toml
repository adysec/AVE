[basic]
description = "Progress Software 旗下 LoadMaster、ECS Connection Manager、Object Scale Connection Manager、MOVEit WAF 及 Multi Tenant 产品存在缺失授权漏洞（CWE-862）。由于 REST API 接口未对低权限已认证用户的访问权限进行严格校验，攻击者在获取普通账户凭据后，可通过调用管理员级别的 REST API 接口执行敏感管理操作，从而绕过权限边界获取系统最高控制权，导致系统完全被攻陷。该漏洞影响上述产品的多个版本，攻击者仅需在目标网络内发起恶意请求即可利用，CVSS v3.1 评分为 8.0，危害等级高。"
published = "2026-07-27T13:18:22.457"
remediation = "升级 LoadMaster 至 7.2.63.3 或更高版本，升级 ECS Connection Manager、Object Scale Connection Manager 和 MOVEit WAF 至 7.2.63.3 或更高版本，升级 Multi Tenant 至 7.1.35.16 或更高版本。如无法立即升级，应通过网络访问控制限制 REST API 的访问来源，仅允许受信任的管理网段访问，同时加强低权限账号的审计监控。"
score = 8
severity = "HIGH"
sources = ["zdi"]
title = "Progress Software LoadMaster REST API 缺失授权漏洞"
updated = "2026-07-28T16:22:01.443"

