[basic]
description = "Adobe Flash Player 对跨域策略文件（crossdomain.xml）的解析与使用存在权限控制缺陷。Flash Player 7.x 至 7.0.70.0、8.x 至 8.0.35.0 以及 9.x 至 9.0.48.0 版本未对跨域策略文件的解释和执行施加足够严格的安全限制，导致远程攻击者可通过构造恶意的跨域策略文件，绕过同源策略（Same-Origin Policy）限制，实施跨域数据访问与跨站脚本（XSS）攻击。攻击者可在托管 Flash 内容的 Web 服务器上部署特制的跨域策略文件，使 Flash Player 错误地授予来自其他域的 Flash 内容访问本域敏感资源的权限，从而窃取用户数据或执行任意脚本。该漏洞影响范围广泛，CVSS v2 评分为 9.3（严重等级），攻击复杂度低，无需身份认证即可远程利用。Adobe 已于安全公告 APSB07-20 和 APSB08-11 中发布修复补丁，用户应升级至受保护的 Flash Player 版本以消除风险。"
published = "2007-12-20T01:46:00Z"
remediation = "建议立即将 Adobe Flash Player 升级至 9.0.48.0 之后的安全版本（如 9.0.49.0 及以上）。由于 Flash Player 目前已被主流浏览器禁用且停止维护，建议用户彻底卸载 Flash 插件或在浏览器设置中禁用所有 Flash 内容以消除安全风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 跨域策略文件权限绕过漏洞"
updated = "2026-06-16T22:47:40Z"

