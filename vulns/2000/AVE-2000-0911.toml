[basic]
description = "Intel Express 500 系列交换机在处理畸形 IP 数据包时存在拒绝服务漏洞。远程攻击者无需身份认证即可向目标交换机发送特制的畸形 IP 数据包，导致交换机处理异常、网络服务中断。该漏洞影响 Intel Express 500 系列交换机固件版本 2.63 及 2.64，CVSS 评分 5.0，危害等级中危。厂商已发布固件更新修复此漏洞。"
published = "2000-10-20T04:00:00.000"
remediation = "Intel Express 500 系列交换机已停产且厂商不再提供安全更新。建议立即将设备固件升级至 2.65 或更高版本（如存在）；若无法升级，可在网络入口边界部署 ACL 规则，过滤掉畸形 IP 分片包（如 offset 字段异常的包），或直接替换为仍在厂商支持周期内的现代交换机产品以彻底消除风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Intel Express 500 系列交换机 IP 数据包拒绝服务漏洞"
updated = "2026-06-16T21:52:25.963"

