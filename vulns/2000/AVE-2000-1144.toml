[basic]
description = "IBM IBMHSSSB 1.0 中捆绑的 ikeyman 工具存在本地权限提升漏洞。由于 ikeyman 在设置 CLASSPATH 环境变量时，将用户自定义目录置于系统目录之前，导致 Java 类加载时优先从用户可控路径读取类文件。恶意本地用户可在该目录中放置同名的木马 Ikeyman 类，当管理员或特权用户以 root 身份运行 ikeyman 时，恶意类被优先加载并执行任意代码，从而实现权限提升并以 root 身份执行任意命令。该漏洞攻击条件为本地用户具有可写目录权限并能诱使特权用户运行 ikeyman 工具，危害严重，可能造成系统完全被控制。"
published = "2001-08-31T04:00:00Z"
remediation = "建议立即升级 IBM HTTP Server（IBMHSSSB）至 1.0 之后的安全修复版本，或停止使用受影响的 ikeyman 组件。若无法立即升级，应修复启动脚本，确保 /usr/bin/ikeyman 在设置 CLASSPATH 时始终将系统类目录（如 /usr/IBMIHS 自带的类路径）置于用户目录之前，禁止把用户可控目录（如 $HOME/.CLASSPATH、当前目录 .）混入其中，并在调用前显式校验 CLASSPATH 内容、移除一切用户可写目录。同时限制 ikeyman 仅由受信任的维护账户执行，杜绝普通本地用户以 root 权限运行，从而阻断通过植入木马 Ikeyman 类实现提权的路径。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "IBM IBMHSSSB ikeyman 本地权限提升漏洞"
updated = "2026-06-16T21:53:22Z"

