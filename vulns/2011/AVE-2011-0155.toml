[basic]
description = "WebKit 浏览器引擎存在多个未明内存破坏漏洞，远程攻击者可通过诱导用户访问包含恶意构造内容的网页触发该漏洞，导致浏览器崩溃或在受影响系统上执行任意代码。该漏洞影响 Safari 5.1.4 之前版本及其他使用受影响 WebKit 版本的产品，攻击条件为攻击者与用户在同一网络或网络不受限制，利用方式为远程代码执行。"
published = "2012-03-09"
remediation = "升级 Safari 至 5.1.4 或更高版本（Mac OS X），升级 iOS 至 5.1 或更高版本（iPhone/iPad/iPod touch），升级 iTunes 至 10.6 或更高版本。如暂无法升级，应避免使用旧版 Safari 浏览器访问不受信任的网站，并禁用 WebKit 的 JavaScript 执行作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏漏洞"
updated = "2012-03-09"

