[basic]
description = "RobinHood 1.1 Web 服务器中的 RHConsole 组件在处理超长 HTTP 请求时存在缓冲区溢出漏洞。远程攻击者无需身份认证即可向目标 BeOS r5 pro 及更早版本系统发送特制的超长 HTTP 请求，触发缓冲区溢出，导致服务进程崩溃，造成拒绝服务。该漏洞 CVSS 评分 5.0，危害等级中等，利用复杂度低，仅需网络访问即可实施攻击。"
published = "2001-01-09T05:00:00.000"
remediation = "RobinHood 1.1 已停止维护且无官方补丁，建议立即停止使用该 Web 服务器，迁移至支持 BeOS 的替代方案（如 Apache 或 lighttpd 的旧版本）。如无法立即替换，可在网络边界防火墙或路由器上配置规则，限制对 TCP 80 端口的请求体长度不超过 4000 字节，并部署入侵检测系统（IDS）规则检测超长 HTTP 请求特征。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "BeOS RobinHood 1.1 HTTP服务器 远程拒绝服务漏洞"
updated = "2026-06-16T21:53:16.393"

