[basic]
description = "PVote 1.0/1.5 版本存在身份认证缺失漏洞，系统未对受限操作（添加/删除投票）进行用户身份验证。远程攻击者可直接访问 add.php 和 del.php 接口并通过篡改参数，未经授权添加或删除投票内容。该漏洞影响 PVote 1.9 之前版本，攻击条件为网络可达目标 Web 应用，无需认证即可利用，CVSS 评分 5.0（中危），主要影响数据完整性。"
published = "2002-06-18T04:00:00Z"
remediation = "升级 PVote 到 1.9 或更高版本，该版本修复了未授权访问 add.php 和 del.php 的漏洞。若暂时无法升级，可在 Web 服务器配置中为 add.php 和 del.php 添加访问控制（如 IP 白名单、Basic Auth 或要求有效会话），并禁用匿名用户对这两个文件的直接访问。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "PVote PVote 投票内容篡改漏洞"
updated = "2026-06-16T21:57:43Z"

