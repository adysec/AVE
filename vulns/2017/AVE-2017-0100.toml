[basic]
description = "Internet Explorer 存在内存损坏漏洞，当 IE 引擎在内存中不当访问对象时触发该漏洞。远程攻击者可通过诱导用户访问特制的恶意网页来利用此漏洞，成功利用后可获得与当前用户相同的权限，从而在目标系统上执行任意代码。攻击者可借此安装程序、查看/更改/删除数据或创建新账户。该漏洞需要用户交互（点击链接），影响 Internet Explorer 9/10/11 等多个版本，CVSS 评分 8.8，危害等级高。Microsoft 已在 2017 年 5 月安全更新中修复此漏洞。"
published = "2017-05-12T14:29:02Z"
remediation = "立即安装 Microsoft 2017 年 5 月安全更新 (MS17-006)，该补丁修复了 Internet Explorer 内存损坏漏洞。可通过 Windows Update 自动更新或访问 Microsoft 安全响应中心下载。如无法打补丁，可配置组策略将 IE 安全级别设为高，禁用 ActiveX 控件和活动脚本，或改用 Edge/Chrome 等现代浏览器。同时建议在网络边界部署入侵检测规则拦截针对该漏洞的攻击流量。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Internet Explorer 内存损坏漏洞"
updated = "2026-06-17T00:57:17Z"

