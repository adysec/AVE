[basic]
description = "SCO Unixware 7 系统中的 SCOhelp HTTP 服务器所包含的 search97.cgi CGI 脚本存在格式化字符串漏洞。远程攻击者无需身份认证即可通过向 queryText 参数中传入特制的格式化字符串字符（如 %n、%s 等），触发该漏洞，导致攻击者能够在目标服务器上以 Web 服务器进程权限执行任意命令。该漏洞影响 Unixware 7 全版本，CVSS 评分 7.5，危害等级高。"
published = "2000-12-11T05:00:00Z"
remediation = "立即禁用 SCOhelp HTTP 服务：以 root 执行 `ps -ef | grep scohelp` 确认进程，然后执行 `/etc/init.d/scohelp stop` 停止服务，并运行 `rm /etc/rc2.d/*scohelp*` 删除开机自启。在防火墙上封锁端口 457/tcp：添加规则 `iptables -A INPUT -p tcp --dport 457 -j DROP`。如业务必须使用，升级至 SCO 官方补丁（联系 SCO 支持获取 Unixware 7 安全补丁包），或将 search97cgi 脚本权限改为 000：`chmod 000 /usr/internet/scohelp/search97cgi/vtopic`。鉴于 Unixware 7 已停止维护，建议迁移至受支持的操作系统。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "SCO Unixware 7.0 help HTTP 服务器 search97.cgi 格式字符串远程代码执行漏洞"
updated = "2026-06-16T21:52:58Z"

