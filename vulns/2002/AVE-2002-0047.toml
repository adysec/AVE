description = """
tags.

Let me analyze the requirements:
1. Chinese description, ≥50 characters
2. Must cover: vulnerability principle (null pointer dereference), impact range (Net-SNMP 5.0.1-5.0.5), attack conditions (remote, no auth needed, but requires knowledge of SNMP community string)
3. Translate NVD English description to fluent Chinese, supplement with local data technical details
4. Don't fabricate URLs

From the NVD data:
- The handle_var_requests function in snmp_agent.c for the SNMP daemon in the Net-SNMP (formerly ucd-snmp) package 5.0.1 through 5.0.5 allows remote attackers to cause a denial of service (crash) via a NULL dereference.

From the local data and PoC references, I can see:
- The vulnerability is in handle_var_requests() at line 1876 of agent/snmp_agent.c
- Exploitation requires foreknowledge of a known SNMP community string (read or read/write)
- Affects installations where "public" read-only community string hasn't been changed
- The issue is a NULL dereference - asp->treecache_num is NULL but the code tries to access it with <= comparison

Let me compose a proper description that covers all required aspects and is ≥50 characters.

The description should be placed inside <value> tags only.<value>Net-SNMP SNMP 守护进程的 agent/snmp_agent.c 中 handle_var_requests 函数存在空指针解引用漏洞。攻击者需预先知晓目标系统的 SNMP 共同体字符串（如默认的 "public" 只读社区名），随后发送精心构造的 SNMP 数据包即可触发该漏洞，导致 SNMP 服务崩溃并造成拒绝服务。该漏洞影响 Net-SNMP 5.0.1 至 5.0.5 所有版本，CVSS 评分为 5.0，危害等级为中等。"""
published = "2002-10-11T04:00:00Z"
remediation = "升级 Net-SNMP 至 5.0.6 或更高版本，该版本修复了 snmp_agent.c 中 handle_var_requests 函数的 NULL 指针解引用问题。升级后重启 SNMP 服务（service snmpd restart），并确认服务正常运行。若无法立即升级，可在网络边界防火墙层面限制对 SNMP 端口（UDP 161/162）的外部访问，仅允许受信任的管理站 IP 访问，临时降低被远程利用导致拒绝服务的风险。"
score = 5
