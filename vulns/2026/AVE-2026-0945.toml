[basic]
description = "GIMP 在处理 SGI 图像文件时存在整数溢出漏洞，由于对用户提供的数据缺乏充分验证，解析 SGI 文件过程中可触发整数溢出，导致在写入内存前发生越界操作。攻击者可利用此漏洞在受害者打开特制的 SGI 文件或访问恶意页面时，在当前进程上下文中执行任意代码。该漏洞影响 GIMP 图像处理软件，CVSS 评分 7.8，危害等级高。GIMP 官方已通过 GitLab 提交修复补丁。"
published = "2026-01-01"
remediation = "升级 GIMP 至 3.2.4 或更高版本（该版本已合入 SGI 解析修复 commit 76531da97），或从 GitLab 仓库拉取最新源码重新编译。如无法立即升级，避免打开来源不明的 SGI 格式图片文件，并在文件关联中取消 GIMP 作为 SGI 文件的默认打开程序作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "GIMP SGI文件解析整数溢出远程代码执行漏洞"
updated = "2026-01-01"

