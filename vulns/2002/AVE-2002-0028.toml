[basic]
description = "CVSD 1.11.2 之前版本的 CVS PreservePermissions 功能在 rcs.c 中存在越界写入漏洞（CWE-193），本地低权限攻击者可通过构造特制的 CVS 请求触发 rcs.c 中 PreservePermissions 函数的越界写入，导致栈缓冲区溢出，进而在本地提权执行任意代码。该漏洞影响 CVSD 1.11.2 之前所有版本，CVSS 3.1 评分 7.8（HIGH），攻击向量为本地、低攻击复杂度、低权限、无需用户交互，机密性/完整性/可用性影响均为高。攻击者需具备本地系统访问权限并能调用 CVS 相关功能，通过精心构造的参数触发 rcs.c 中 PreservePermissions 函数的 off-by-one 溢出，覆盖关键栈数据实现任意代码执行。CVSD 1.11.2 已修复此漏洞，建议升级至 1.11.2 或更高版本。"
published = "2002-08-12T04:00:00Z"
remediation = "建议立即升级 CVSD 到 1.11.2 或更高版本，该版本已修复 rcs.c 中 PreservePermissions 的越界写入漏洞。若无法立即升级，可暂时禁用 CVSD 的 PreservePermissions 功能或限制本地用户对 CVS 仓库的写入权限作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["redhat"]
title = "CVSD CVSD 1.11.2之前版本 CVS PreservePermissions off-by-one溢出代码执行漏洞"
updated = "2026-06-16T21:58:15Z"

