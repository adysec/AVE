[basic]
description = "SGI IRIX 操作系统的嵌入式支持伙伴（ESP）守护进程（rpc.espd）存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标系统发送特制的 RPC 请求数据触发该缓冲区溢出，进而在受影响系统上执行任意命令。该漏洞影响 IRIX 6.5.8 及更早版本（包括 6.5.5）等 SGI 系统，攻击复杂度低，无需身份认证即可通过网络远程利用。CVSS 评分 7.5，危害等级高。SGI 已在安全公告 20010501-01-P 中发布补丁修复此漏洞。"
published = "2001-06-27T04:00:00Z"
remediation = "建议立即应用 SGI 官方安全补丁（公告编号 20010501-01-P），升级 IRIX 至修复版本。若无法立即打补丁，可执行临时缓解：以 root 权限运行 `chmod -x /usr/etc/rpc.espd` 禁用 rpc.espd 守护进程，随后执行 `/etc/killall -HUP inetd` 重启 inetd 使配置生效，防止远程攻击者利用缓冲区溢出获取 root 权限。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "SGI IRIX ESP守护进程 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:54:06Z"

