[basic]
description = "Microsoft SQL Server 及 SQL Server Desktop Engine (MSDE) 中的 xp_updatecolvbm 函数在调用 SQL Server 扩展存储过程（XP）API 中的 srv_paraminfo 函数之前，未正确限制缓冲区长度。该漏洞允许攻击者通过构造超长的扩展存储过程参数触发缓冲区溢出，从而造成拒绝服务或执行任意命令。攻击条件为本地访问、低攻击复杂度，无需身份认证即可利用，影响机密性、完整性和可用性。此漏洞 CVSS 评分为 4.6，危害等级中等。"
published = "2001-01-09T05:00:00.000"
remediation = "建议立即升级 SQL Server 7.0 至 Service Pack 2 或 SQL Server 2000 至 Service Pack 1，并安装微软安全公告 MS01-031 提供的补丁程序。若无法立即升级，可通过企业管理器或执行 sp_dropextendedproc 移除 xp_updatecolvbm 等高危扩展存储过程，并限制 sa 账户权限、阻止非信任用户访问数据库服务端口作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft SQL Server 扩展存储过程缓冲区溢出漏洞"
updated = "2026-06-16T21:53:06.987"

