[basic]
description = "ONNX/ONNX 框架的 `download_model` 函数中存在路径遍历漏洞，由于对恶意 tar 文件中路径遍历攻击的防护不足，攻击者可通过构造特制的 tar 文件触发任意文件覆盖。未经身份认证的远程攻击者无需用户交互即可利用该漏洞，覆盖目标系统用户目录下的任意文件，在特定场景下可进一步导致远程命令执行。该漏洞影响 ONNX 1.16.1 及之前所有版本，CVSS 评分 9.1，危害等级严重。"
published = "2025-03-20T10:15:37Z"
remediation = "立即将 ONNX 框架升级至 v1.16.2 或更高版本（v1.16.2 已修复 tar 包目录遍历问题，PR #6164）。如无法立即升级，在使用 download_model 函数前对下载的 tar 文件进行路径合法性校验，拒绝包含 ../ 等路径穿越内容的文件条目，并限制解压目标目录为专用临时目录。"
score = 9.1
severity = "CRITICAL"
sources = ["msrc"]
title = "ONNX onnx 任意文件覆盖漏洞"
updated = "2026-06-17T08:20:53Z"

