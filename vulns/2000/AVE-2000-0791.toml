[basic]
description = 'Microsoft Enterprise Manager 的数据转换服务（DTS）包中的"已注册服务器对话框"存在密码泄露漏洞。本地用户可通过访问该对话框界面，以明文形式获取数据库连接密码。该漏洞需要攻击者具有本地系统访问权限，属于本地提权类漏洞，影响 Microsoft SQL Server 7.0 及 SQL Server 2000 等版本。攻击者可利用获取的数据库密码进一步扩大系统访问权限，对数据的机密性和完整性构成威胁。'
published = "2000-07-11T04:00:00Z"
remediation = "升级至 Microsoft SQL Server 7.0 Service Pack 2（SP2）或更高版本，该补丁已修复 DTS 包中密码明文存储问题。如无法立即升级，限制对 Enterprise Manager 工具和 DTS 包文件的本地访问权限，仅授权管理员可登录服务器操作；避免在 DTS 包中保存密码，改为每次执行时手动输入。同时审查并移除已存在的 DTS 包中硬编码凭据。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Enterprise Manager DTS密码泄露漏洞"
updated = "2026-06-16T21:52:11Z"

