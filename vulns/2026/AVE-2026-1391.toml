[basic]
description = "Ghost 内容管理系统存在输入验证缺失漏洞，用户在兑换订阅优惠时，系统未正确校验该优惠是否仍处于有效状态，导致已过期的归档优惠仍可被成功兑换。该漏洞影响 Ghost v4.22.0 至 v6.54.0 版本，攻击者无需身份认证即可在远程利用此缺陷获取未授权的订阅权益，从而造成经济损失或服务滥用。Ghost 官方已在 v6.54.1 中修复此问题，建议受影响用户升级至最新版本。"
published = "2026-08-04T22:17:16Z"
remediation = "立即将 Ghost 升级至 v6.54.1 或更高版本以修复该漏洞。Docker 自托管用户请执行 docker pull ghost:latest 并重启容器；Ghost-CLI 安装用户请运行 ghost update 命令完成更新。如暂无法升级，可在 Ghost 管理员后台临时禁用订阅优惠功能作为过渡缓解措施。"
score = 4.8
severity = "MEDIUM"
sources = ["ghsa"]
title = "Ghost 订阅优惠券验证缺失漏洞"
updated = "2026-08-05T15:17:14Z"

