[basic]
description = "Bytes Interactive Web Shopper 购物车程序（shopper.cgi）2.0及更早版本存在目录遍历漏洞，远程攻击者无需身份认证即可通过向 newpage 参数传递 `../` 等路径遍历序列，绕过访问限制读取服务器上的任意文件。该漏洞影响 Web Shopper 2.0 及之前版本，攻击复杂度低，可导致敏感信息泄露。"
published = "2000-12-19T05:00:00.000"
remediation = "立即将 Bytes Interactive Web Shopper 升级至 2.0 以上版本（如厂商已停止维护，建议迁移至其他受支持的购物车系统）。临时缓解措施：在 Web 服务器配置中限制对 shopper.cgi 的访问，仅允许受信任 IP 调用；在 WAF 或反向代理层添加规则，过滤 newpage 参数中的 `../` 及 URL 编码变体（如 `%2e%2e%2f`），阻止目录遍历攻击。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Bytes Interactive Web Shopper 目录遍历漏洞"
updated = "2026-06-16T21:52:46.397"

