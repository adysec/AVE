[basic]
description = "ClearSwift MAILsweeper for SMTP 3.x 在处理 ZIP 压缩包中的损坏 CDA 文档时存在处理逻辑缺陷，未能正确校验文件完整性，导致应用程序挂起无响应。远程攻击者可通过向 SMTP 邮件服务器发送包含特制损坏 CDA 文档的 ZIP 附件触发此漏洞，造成邮件过滤服务拒绝服务，影响正常邮件收发。该漏洞无需身份认证即可远程利用，攻击复杂度低。"
published = "2000-12-19T05:00:00.000"
remediation = "该产品（ClearSwift MAILsweeper for SMTP 3.x）已停止维护，无安全补丁可用。建议立即迁移至受支持的邮件安全网关产品（如 Microsoft Exchange Online Protection、Symantec Email Security.cloud 等）。若无法立即迁移，可在 SMTP 网关层面配置规则，拦截或扫描所有 ZIP 压缩包内的 CDA 文档附件，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "ClearSwift MAILsweeper for SMTP 3.x ZIP Archive 拒绝服务漏洞"
updated = "2026-06-16T21:52:47.807"

