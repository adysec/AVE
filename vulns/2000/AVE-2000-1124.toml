[basic]
description = "AdCycle 广告横幅管理系统在安装后未正确删除或限制 build.cgi 程序的访问权限，导致该程序留在 Web 可访问目录中。远程未经身份验证的攻击者可以通过直接请求该 CGI 脚本，触发漏洞以查看系统敏感密码或删除数据库内容。该漏洞影响部署了 AdCycle 的服务器，攻击条件极低，仅需通过 HTTP 请求即可利用，将导致严重的敏感信息泄露及数据完整性破坏。"
published = "2001-01-09T05:00:00Z"
remediation = "立即从 Web 服务器中删除可公开访问的 build.cgi 程序文件，或通过 Web 服务器配置（如 .htaccess 或 nginx 配置文件）禁用对该文件的外部访问请求，以防止远程攻击者利用该程序泄露凭据或破坏数据库。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "AdCycle Banner Management System 敏感文件泄露及远程代码执行漏洞"
updated = "2026-06-16T21:53:17Z"

