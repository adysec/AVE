[basic]
description = "phpGroupWare 在 0.9.7 及之前版本中存在远程代码执行漏洞，其 phpgw.inc.php 程序未对 phpgw_info 参数进行严格校验，导致远程攻击者可通过构造恶意包含文件路径的方式，将任意 PHP 文件引入并执行。该漏洞影响部署了受影响版本 phpGroupWare 的 Web 服务器，攻击者无需身份认证即可在目标服务器上执行任意 PHP 代码，完全控制服务器及数据。由于涉及文件包含与远程代码执行，该漏洞 CVSS 评分为满分 10.0，危害等级为严重。建议将 phpGroupWare 升级至 0.9.7 或更高版本以修复该漏洞。"
published = "2001-02-16T05:00:00Z"
remediation = "将 phpGroupWare 升级至 0.9.7 或更高版本，该版本已修复 phpgw.inc.php 中 phpgw_info 参数的远程文件包含漏洞。如暂无法升级，可在 Web 服务器层对 phpgw.inc.php 的 phpgw_info 参数进行输入过滤，禁止包含外部 URL，并限制该文件的直接访问权限。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "phpGroupWare 远程代码执行漏洞"
updated = "2026-06-16T21:53:32Z"

