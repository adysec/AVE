[basic]
description = "Internet Explorer 5.5 及更早版本存在网页地址栏欺骗漏洞，攻击者可通过在页面中嵌入框架或特殊构造的 HTML 内容，使用户在地址栏中看到合法的 URL，但实际加载的却是攻击者控制的恶意网页。由于浏览器未对地址栏显示与实际页面来源进行严格校验，攻击者可利用该漏洞实施钓鱼攻击，诱骗用户提交敏感信息如账号密码、银行资料等。该漏洞影响所有使用受影响 IE 版本的系统用户，攻击者仅需引导用户访问恶意网页即可成功利用，无需任何身份认证或特殊权限，CVSS 评分 7.5，危害等级为高危。"
published = "2001-06-27T04:00:00Z"
remediation = '安装微软 MS01-027 安全补丁（IE 5.01 对应 KB295106，IE 5.5 对应 KB299618），或直接升级到 Internet Explorer 6。在 Windows 95/98/98SE/ME 系统上升级 IE 6 时请选择 Typical Install 或 Full Install（默认即为 Typical Install），以确保完整修复。如暂时无法安装补丁或升级，可在 IE 的"工具-选项-高级-安全"设置中取消勾选"Check for server certificate revocation"选项作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Internet Explorer SSL哄骗漏洞"
updated = "2026-06-16T21:54:07Z"

