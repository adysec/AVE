[basic]
description = "Linux 内核邻居发现协议（NDISC）子系统的 ndisc_send_skb() 函数存在 use-after-free 漏洞。该函数可在未持有 RCU 读锁的情况下被调用，导致内核在处理网络设备结构时可能访问已释放的内存。该漏洞影响 Linux 内核多个版本，主流发行版如 Ubuntu、Debian、SUSE 等均受波及。攻击者需位于目标网络 adjacent 位置或具备中间人能力，能够向目标发送特制的 ICMPv6 邻居发现数据包，无需身份认证且无需用户交互。利用方式为通过精心构造的 IPv6 邻居请求或通告数据包，在目标内核处理时触发 UAF 条件，可能导致信息泄露、特权提升或拒绝服务。该漏洞 CVSS v3.1 评分为 8.1（CVSS 向量：AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H），危害等级为高。"
published = "2025-02-27T03:15:16.653"
remediation = "建议将 Linux 内核升级至已修复该漏洞的稳定版本：5.4.291、5.10.235、5.15.179、6.1.129、6.6.79、6.12.16 或 6.13.4 及更高版本。对于使用主流发行版的系统，可通过发行版官方安全更新渠道获取补丁，如 Debian/Ubuntu 执行 apt upgrade、RHEL/CentOS 执行 yum update。如暂时无法升级，可临时禁用 IPv6 邻居发现协议功能以降低攻击面，但此措施可能影响 IPv6 网络通信，仅作为应急缓解手段。"
score = 8.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 ndisc 释放后使用漏洞"
updated = "2026-07-30T06:21:28.730"

