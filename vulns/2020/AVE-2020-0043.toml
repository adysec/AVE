[basic]
description = "WordPress 的 Rank Math SEO 插件（版本 1.0.40.2 及之前版本）存在输入验证错误漏洞。该插件的 REST API 端点 `rankmath/v1/updateRedirection` 未进行身份认证和权限校验，未经身份验证的远程攻击者无需登录即可通过发送特制 HTTP 请求利用该接口创建任意名称的重定向 URI，并将其指向外部恶意网站。攻击者可构造如 `/exampleredirect` 等自定义重定向路径，诱导访问者跳转至钓鱼站点或恶意页面，造成网络钓鱼攻击、流量劫持和网站声誉损害。该漏洞影响所有使用 Rank Math 插件的 WordPress 网站，CVSS 评分 6.1，危害等级为中危。建议用户尽快将 Rank Math 插件升级至最新版本以修复此漏洞。"
published = "2020-04-07T17:15:13Z"
remediation = '将 WordPress Rank Math SEO 插件从受影响版本（≤1.0.40.2）升级到 1.0.40.3 或更高版本，以修复 rankmath/v1/updateRedirection REST API 端点的未授权访问漏洞。登录 WordPress 后台，进入"插件"页面，若 Rank Math 支持自动更新则直接点击"现在更新"；否则通过 WordPress 插件市场或官网下载最新版本手动安装覆盖。升级完成后，前往"设置"→"固定链接"重新保存一次以刷新重写规则。如无法立即升级，可在网站防火墙（WAF）或 .htaccess 中拒绝对 /wp-json/rankmath/ 路径的未授权 POST 请求，作为临时缓解措施。'
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Rank Math 插件未授权开放重定向漏洞"
updated = "2026-06-17T02:50:19Z"

