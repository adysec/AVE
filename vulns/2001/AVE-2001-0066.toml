[basic]
description = "ReiserFS 3.5.28 在 SuSE Linux 系统中存在缓冲区溢出漏洞。该漏洞允许本地用户通过构造超长目录名称的方式触发缓冲区溢出，从而造成拒绝服务，并可能进一步执行任意命令。攻击者需具备目标系统的本地访问权限才能利用此漏洞。此漏洞影响使用 ReiserFS 3.5.28 文件系统的 Linux 发行版，成功利用可能导致系统崩溃或获得与受影响进程相当的权限。"
published = "2001-03-26T05:00:00Z"
remediation = "立即升级 SuSE Linux 7.0 到 7.1 或更高版本，或安装 SuSE 官方安全更新补丁（reiserfs 包版本 3.5.29 及以上），该补丁修复了长目录名处理时的缓冲区溢出问题。如无法立即升级，可通过内核模块参数限制 ReiserFS 目录名最大长度为 255 字符，或临时禁用 ReiserFS 改用 ext3 作为临时缓解措施，防止本地用户利用超长目录名触发内核崩溃或代码执行。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "SuSE Linux ReiserFS 3.5.28 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:53:48Z"

