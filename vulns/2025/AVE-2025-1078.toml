[basic]
description = "Linux 内核 GRED（通用随机早期检测）调度器存在空指针解引用漏洞。当 gred_init() 函数中的 kzalloc 内存分配失败返回 NULL 时，错误处理流程调用 gred_destroy()，进而调用 gred_offload()，其中 memset 可能接收到 NULL 指针作为参数，触发内核空指针解引用导致系统崩溃或内核 panic。该漏洞影响运行受影响 Linux 内核版本的系统，攻击者需具备本地访问权限并触发特定错误路径方可利用，CVSS 评分 5.5，危害等级为中危。"
published = "2025-04-01T16:15:29Z"
remediation = "升级 Linux 内核至已修复版本：6.1.132、6.6.84、6.12.20 或 6.13.8（含）以上，具体取决于所使用的稳定分支。受影响版本范围为内核 5.16 至 6.1.132 之前、6.2 至 6.6.84 之前、6.7 至 6.12.20 之前、6.13 至 6.13.8 之前。可通过内核官方补丁（git.kernel.org/stable/c/0f0a152957d6）进行编译修复。Debian 用户可安装 DSA-5900 安全更新；SUSE 用户可应用 SUSE-SU-2025:01964-1、SUSE-SU-2025:01614-1 公告中的内核更新。如暂无法升级内核，可临时避免使用 GRED（Generic Random Early Detection）队列 discipline 作为缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 GRED 调度器空指针解引用漏洞"
updated = "2026-06-17T08:44:45Z"

