[basic]
description = "Tech-Source Raptor GFX PGX32 配置工具 pgxconfig 存在缓冲区溢出漏洞。pgxconfig 程序在处理命令行参数时未对输入长度进行充分边界检查，本地攻击者可通过向 pgxconfig 传递超长特制命令行选项触发栈缓冲区溢出，覆盖函数返回地址，从而劫持程序执行流程。成功利用后攻击者可以获取目标系统的 root 或 SYSTEM 级别权限。攻击条件为攻击者需拥有目标系统的本地 shell 访问权限，无需任何额外认证。该漏洞影响 Raptor GFX PGX32 2.3.1 及更早版本，CVSS 评分 7.2，危害等级高。"
published = "2000-10-20T04:00:00Z"
remediation = "建议立即移除 pgxconfig 的 setuid 权限位：`chmod u-s /usr/sbin/pgxconfig`，仅允许受信任的 root 用户执行该工具。如业务需要普通用户使用，可通过 sudo 配置精细化授权（如 `Cmnd_Alias RAPTOR=/usr/sbin/pgxconfig`），避免以 root 权限直接运行。同时升级到厂商修复版本（PGX32 2.3.1 之后），或联系 Tech-Source 获取补丁。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Tech-Source Raptor GFX PGX32 配置工具缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:52:17Z"

