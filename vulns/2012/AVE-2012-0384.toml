[basic]
description = "WebKit 是 Apple iTunes 10.7 之前版本中使用的网页渲染引擎，存在内存破坏漏洞。未经身份认证的远程攻击者可通过诱导用户访问特制的恶意网站触发该漏洞，导致内存损坏和应用程序崩溃，进而可能执行任意代码或造成拒绝服务攻击。该漏洞影响 Apple iTunes 10.7 之前的版本，攻击者无需获取用户凭据即可在网络层面发起攻击，CVSS 评分 6.8，危害等级为中危。用户需升级至 iTunes 10.7 或更高版本以修复此问题。"
published = "2012-09-13T10:30:21Z"
remediation = "立即将 Apple iTunes 升级至 10.7 或更高版本，或安装 Apple 2012 年 9 月安全更新（APPLE-SA-2012-09-12-1）。对于 macOS 用户，Safari 应升级至 6.0.1。如无法立即升级，请避免访问未知或恶意网站，并禁用 iTunes 的网页浏览功能作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes 远程代码执行漏洞"
updated = "2026-06-16T23:43:47Z"

