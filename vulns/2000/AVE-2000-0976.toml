[basic]
description = 'Microsoft IIS 4.0 存在"Invalid URL"拒绝服务漏洞。远程攻击者无需身份认证即可向目标 IIS 服务器发送一系列特制的畸形 URL 请求，触发 INETINFO.EXE 进程崩溃，导致 IIS 服务无法正常响应合法请求。该漏洞影响 Windows NT 4.0 系统上运行的 IIS 4.0 版本，攻击复杂度低，无需用户交互即可远程利用。'
published = "2000-11-14T05:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS00-063 提供的 Windows NT 4.0 补丁（KB271652），下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=B2A1FED4-F251-4233-B911-22C4DD81438E。如无法打补丁，可升级至 IIS 5.0（Windows 2000），该版本不受此漏洞影响。服务因攻击失败后重启 IIS 服务即可恢复，无需重启系统。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft IIS 4.0 畸形URL请求拒绝服务漏洞"
updated = "2026-06-16T21:52:36Z"

