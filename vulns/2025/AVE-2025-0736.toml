[basic]
description = "Microsoft 消息队列服务（MSMQ）存在拒绝服务漏洞。未经身份认证的远程攻击者可向运行 MSMQ 服务的目标系统发送特制消息，触发服务异常并导致其停止响应，造成消息处理中断。该漏洞影响启用了 MSMQ 的 Windows 系统，攻击者无需任何权限或用户交互即可在网络层面发起利用，仅对系统可用性造成危害。攻击成功后将导致消息队列服务不可用，影响依赖消息队列通信的业务流程。Microsoft 已通过安全更新修复该漏洞，建议受影响系统尽快安装补丁。"
published = "2025-01-14T18:15:48Z"
remediation = '建议立即安装 Microsoft 2025 年 1 月安全更新，各受影响版本对应的累积更新 KB 号如下：Windows 10 21H2/22H2 安装 KB5049985；Windows 11 22H2/23H2/24H2 安装 KB5049993/KB5049987/KB5050888；Windows Server 2019/2022/2025 安装对应 KB5041050/KB5049989/KB5050889。可将系统自动更新配置为"自动下载并安装"，或通过 Microsoft Update Catalog 手动下载对应架构（x64/arm64）的累积更新包进行安装。如暂时无法立即安装补丁，可在防火墙层阻断 MSMQ 服务（TCP 端口 1801）及 RPC 相关端口的入站访问作为临时缓解措施，待维护窗口期再完成补丁部署。'
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft MSMQ 拒绝服务漏洞"
updated = "2026-06-17T08:42:58Z"

