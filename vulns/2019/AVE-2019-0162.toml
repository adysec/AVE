[basic]
description = "CVE-2019-25246是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2025-12-24T20:15:52.780"
remediation = "1. 升级固件：联系 Beward R&D Co., Ltd 官方客服（support@beward.net）获取 N100 相机的最新固件，将当前版本 M2.1.6.04C014 升级到厂商发布的安全修复版本；2. 网络隔离：将设备管理界面从公网暴露中移除，仅允许可信内网 IP 访问，通过防火墙或 ACL 限制对 80/443 端口的访问来源；3. 禁用 CGI：如固件支持，在设备设置中禁用 fileread 脚本及 SendCGICMD API 等不必要的 CGI 功能，减少攻击面；4. 凭证轮换：立即修改设备管理员默认密码，使用高强度唯一密码，防止攻击者利用泄露的 /etc/passwd 等信息进一步入侵。"
score = 7.1
severity = "HIGH"
sources = ["nuclei"]
title = "Beward N100 H.264 VGA IP Camera 路径穿越文件读取漏洞"
updated = "2026-06-17T02:31:52.260"

