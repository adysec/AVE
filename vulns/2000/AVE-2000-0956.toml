[basic]
description = "Check Point VPN-1 和 FireWall-1 4.1 及更早版本的模块间 S/Key 身份验证机制在种子生成过程中存在缺陷。远程攻击者可以通过针对一次性密码（s/key）进行暴力破解攻击，从而绕过身份验证机制。该漏洞允许未经授权的远程攻击者在无需合法凭据的情况下进入系统，导致机密数据泄露或系统控制权被非法获取。影响范围涵盖所有使用该认证机制的 4.1 及以下版本产品。"
published = "2000-11-14T05:00:00Z"
remediation = "建议将 Check Point VPN-1/FireWall-1 升级至 4.2 或更高版本，以修复 S/Key 认证机制的种子生成漏洞。若无法立即升级，应在配置中禁用 S/Key 一次性密码认证，改用更强的多因素认证（MFA）或证书认证方式。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Check Point VPN-1/FireWall-1 认证绕过漏洞"
updated = "2026-06-16T21:52:31Z"

