[basic]
description = "Autel MaxiCharger AC Elite Home 电动汽车充电桩的 NFC 接口存在基于栈的缓冲区溢出漏洞，该漏洞在 Pwn2Own 2026 黑客大赛中被披露。攻击者可通过物理接触设备，向 NFC 读卡器发送特制的卡片响应数据，触发固定长度栈缓冲区溢出，从而在设备上下文中执行任意代码。利用该漏洞无需任何身份认证，攻击者只需持有特制 NFC 卡片或模拟 NFC 设备靠近充电桩即可完成攻击。成功利用可导致攻击者完全控制设备，进而可能操纵充电过程、窃取用户信息或将设备作为跳板攻击内部网络。该漏洞影响 Autel MaxiCharger AC Elite Home 系列产品，厂商已在固件版本 V1.40.81 中修复此问题。"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 Autel MaxiCharger AC Elite Home 充电桩固件升级至 V1.40.81 或更高版本。该漏洞通过 NFC 接口触发，需物理接触设备，因此除升级外还应限制充电桩的物理访问权限，将设备部署在受控区域，并禁用非必要的 NFC 读卡功能作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "Autel MaxiCharger AC Elite Home NFC栈缓冲区溢出远程代码执行漏洞"
updated = "2026-01-01T00:00:00Z"

