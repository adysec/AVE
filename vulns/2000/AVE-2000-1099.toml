[basic]
description = "Bill Kendrick 开发的 GBook 网站留言本 CGI 脚本存在命令注入漏洞，未经身份认证的远程攻击者可通过留言本的 _MAILTO 表单参数注入 shell 元字符（如管道符、分号、反引号、命令替换等），在 Web 服务器上执行任意操作系统命令。该漏洞影响部署了 GBook 脚本的网站服务器，利用条件简单，攻击者仅需向表单提交包含恶意命令的数据即可触发，无需任何身份验证。成功利用后可导致服务器被完全控制、敏感配置文件泄露、网站内容被篡改，甚至作为跳板进一步渗透内网，危害程度严重。"
published = "2001-01-09T05:00:00Z"
remediation = "建议立即删除或禁用 gbook.cgi 脚本，并更换为现代留言板程序（如 PHP/Node.js 实现）。若必须保留，需在 Web 应用防火墙配置规则拦截 _MAILTO 参数中的 Shell 元字符（; | & ` $ ( )），同时在 CGI 脚本中添加输入验证过滤 shell 元字符，并将 CGI 目录权限设为不可写（chmod 555）。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Bill Kendrick GBook gbook.cgi 远程代码执行漏洞"
updated = "2026-06-16T21:53:12Z"

