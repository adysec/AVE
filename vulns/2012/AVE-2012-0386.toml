[basic]
description = "Apple Safari 6.0.1 之前版本在处理 HTML 文档的 Quarantine 隔离属性时存在逻辑错误，导致沙盒安全保护模式未对隔离文件正确生效。该漏洞影响 macOS 和 Windows 平台上的 Safari 浏览器，攻击者可利用用户下载的恶意 HTML 文档作为攻击载体，绕过浏览器沙盒隔离机制，读取受害者系统上的任意本地文件内容。利用此漏洞需要一定的用户交互，即受害者需要先下载并打开恶意构造的文档文件，属于用户辅助型远程攻击。Apple 已在 Safari 6.0.1 版本中修复了此问题。"
published = "2012-09-20T21:55:02Z"
remediation = '将 Safari 浏览器升级至 6.0.1 或更高版本，可通过 Mac OS X 系统"软件更新"功能自动获取补丁。如暂无法升级，应避免打开来自不受信任来源的下载 HTML 文件，并临时禁用 Safari 的"打开安全文件"选项以降低本地文件泄露风险。'
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari 本地文件信息泄露漏洞"
updated = "2026-06-16T23:43:47Z"

