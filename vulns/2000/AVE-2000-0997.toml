[basic]
description = "SGI IRIX系统的分布式GL守护进程（dgld）运行在5232端口，攻击者无需身份认证即可通过向目标主机发送探测数据包识别出该系统为SGI IRIX主机，从而获取系统指纹信息。该漏洞影响运行dgld服务的SGI IRIX系统，攻击条件仅为网络可达，目标主机暴露了5232端口。攻击者可利用此信息进一步探测内网SGI系统并制定后续攻击策略。Microsoft虽未直接修复此漏洞，但SGI官方已在后续版本中移除或禁用dgld服务以消除信息泄露风险。"
published = "2001-02-16T05:00:00.000"
remediation = "在SGI IRIX系统上禁用Distributed GL Daemon（dgld）服务：执行`/etc/init.d/dgld stop`或通过系统管理工具关闭dgld进程。若系统依赖dgld功能，可在防火墙层面阻止外部对5232端口的访问（如使用`ipfilter`规则拒绝入站TCP 5232流量），以防止攻击者通过扫描该端口识别IRIX系统并发起后续攻击。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "SGI IRIX dgld服务远程信息泄露漏洞"
updated = "2026-06-16T21:52:41.487"

