[basic]
description = "Mozilla Firefox 及 Thunderbird 的浏览器引擎中存在多处未指定的内存安全漏洞，远程攻击者可通过未知向量触发内存破坏，导致应用程序崩溃或可能执行任意代码。该漏洞影响 Firefox 3.6.18 之前版本及 4.x 至 4.0.1 版本、Thunderbird 3.1.11 之前版本，攻击无需身份认证且无需用户交互，CVSS 评分 10.0，危害等级严重。Mozilla 已发布安全更新修复此漏洞。"
published = "2011-06-30T16:55:05Z"
remediation = "升级 Mozilla Firefox 至 3.6.18 或 5.0 及以上版本，Thunderbird 升级至 3.1.11 及以上版本，SeaMonkey 升级至 2.2 及以上版本。如无法立即升级，可禁用 JavaScript 并关闭 XUL 文档支持作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox 浏览器引擎内存破坏漏洞"
updated = "2026-06-16T23:31:12Z"

