[basic]
description = "python-cryptography 库在 49.0.0 版本之前的证书验证器存在名称约束绕过漏洞。当某个中间约束 CA 仅允许签发 DNS 名称 foo.example.com 的证书时，若叶子证书的 DNS SAN 中包含通配符名称 *.example.com，该库的 verifier 会错误地接受该证书链，从而允许绕过名称约束签发其他域名（如 bar.example.com）的有效证书。根本原因在于 DNSConstraint::matches 实现中，通配符模式被错误地视为匹配更具体的允许约束，而 *.example.com 实际可扩展为 foo.example.com 之外的任意同级域名。攻击者可通过构造包含过宽通配符 SAN 的叶子证书，利用中间 CA 的名称约束配置逃逸其授权范围，导致无效证书链被接受为有效。该漏洞影响所有使用 python-cryptography 进行 X.509 证书链验证的 Python 应用程序，可能导致中间 CA 被滥用于签发超出其授权范围的证书，CVSS 评分为 6.9，危害等级为中等。"
published = "2026-08-03T22:16:52Z"
remediation = "立即将 python-cryptography 升级到 49.0.0 或更高版本，以修复 DNSConstraint::matches 中通配符证书验证绕过漏洞。如使用 pip 管理，执行 pip install --upgrade cryptography>=49.0.0。若暂无法升级，建议在代码中绕过默认验证器，手动校验证书链中的 permittedSubtrees 约束，确保通配符证书不超出中间 CA 允许的 DNS 名称范围。"
score = 6.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "Python python-cryptography 通配符DNS名称证书验证绕过漏洞"
updated = "2026-08-04T16:16:28Z"

