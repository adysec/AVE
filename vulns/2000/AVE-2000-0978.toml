[basic]
description = "PHP 3.x 和 4.x 版本的文件上传功能存在任意文件读取漏洞。攻击者可通过构造与 PHP 内部脚本变量同名的隐藏表单字段，利用文件上传机制中的变量覆盖缺陷，绕过正常访问控制读取服务器上的任意文件。该漏洞无需身份认证即可远程利用，攻击复杂度低，主要影响使用 PHP 文件上传功能的 Web 应用服务器，可导致敏感信息泄露。官方已在后续版本中修复此问题。"
published = "2000-11-14T05:00:00Z"
remediation = "升级 PHP 至 4.0.2 或更高版本（该版本修复了 rfc1867.c 中文件上传处理函数对内部变量名的校验缺陷）。如无法升级，在 php.ini 中将 register_globals 设为 Off 可缓解攻击，同时避免在表单中使用与内部变量同名的隐藏字段。鉴于 PHP 3/4 已停止安全支持多年，强烈建议迁移至受支持的 PHP 8.x 版本。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "PHP 任意文件读取漏洞"
updated = "2026-06-16T21:52:37Z"

