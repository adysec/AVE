[basic]
description = "MidiCart PHP、PHP Plus 及 PHP Maxi 购物车系统存在信息泄露与任意文件上传双重漏洞。系统未对 admin/upload.php 和 admin/credit_card_info.php 的访问进行身份验证与权限控制，远程攻击者可无需认证直接请求这些路径，从而上传任意 PHP 文件到服务器获取控制权限，或直接窃取敏感信用卡信息。该漏洞影响所有部署了 Midicart PHP 系列的站点，攻击条件简单，无需登录凭证即可利用，CVSS 评分 9.1，危害等级严重。"
published = "2002-12-31T05:00:00Z"
remediation = "1. 立即迁移至受支持的电商平台（如 osCommerce、OpenCart 等），MidiCart PHP 已停止维护且无官方补丁，继续使用存在严重安全风险。2. 若暂时无法迁移，在 Web 服务器配置（Apache .htaccess 或 Nginx 配置）中为 `admin/` 目录添加 HTTP 基本认证，仅允许授权 IP 访问，阻止未认证用户直接访问 `admin/credit_card_info.php` 等敏感文件。3. 删除或移至 Web 根目录之外 `admin/upload.php` 文件，防止任意文件上传；同时在 `php.ini` 中设置 `file_uploads = Off` 或限制上传目录权限。4. 在 Web 服务器层面阻止对 `admin/` 目录的直接访问，仅在需要时通过 VPN 或反向代理（如 Nginx auth_request）进行受控访问。5. 检查 Web 服务器日志中是否存在对 `admin/credit_card_info.php` 和 `admin/upload.php` 的历史访问记录，若发现异常请求立即排查是否已有 Webshell 植入。"
score = 9.1
severity = "CRITICAL"
sources = ["exploitdb"]
title = "MidiCart PHP 敏感信息泄露漏洞"
updated = "2026-06-16T22:00:00Z"

