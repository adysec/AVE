[basic]
description = "Windows 内核存在安全功能绕过漏洞（CWE-284 权限管理不当），低权限攻击者可在本地利用该漏洞绕过内核安全机制，获取系统级权限，实现完全控制目标主机的机密性、完整性和可用性。攻击无需用户交互，复杂度低，但需本地访问能力。Microsoft 已在 2025 年 2 月安全更新（KB5051974）中修复。"
published = "2025-02-11T18:15:34.743"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新 (KB5051974)，可通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载。受影响版本包括 Windows 10/11 全系列及 Windows Server 2016/2019/2022/2025，更新后各版本对应内核版本分别为 10.0.10240.20915 (1507)、10.0.19045.5487 (22H2)、10.0.22621.4890 (11 22H2)、10.0.26100.3194 (11 24H2) 等。如无法立即打补丁，建议限制本地用户登录权限并启用 Windows Defender 攻击面减少 (ASR) 规则以降低绕过风险。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 内核安全功能绕过漏洞"
updated = "2026-06-17T08:43:11.380"

