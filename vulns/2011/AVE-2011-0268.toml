[basic]
description = "tags as required.<value>Apple Mac OS X 系统及 QuickTime 播放器在解析电影文件中的原子（atom）层级结构时存在实现缺陷，远程攻击者可通过构造特制的电影文件（如 MOV、MP4 等格式），利用该缺陷向目标系统发送恶意文件，触发内存损坏进而执行任意代码或导致应用程序崩溃拒绝服务。该漏洞影响 Mac OS X 10.7.2 之前版本及 QuickTime 7.7.1 之前版本，攻击者无需身份认证即可通过社交工程手段诱骗用户打开恶意文件完成攻击。CVSS 评分 6.8，危害等级中等。Apple 已在后续安全更新中修复此问题。"
published = "2011-10-14T10:55:08Z"
remediation = "Mac OS X 用户请升级至 OS X Lion v10.7.2 或安装安全性更新 2011-006；Windows 用户请将 QuickTime 升级至 7.7.1。临时缓解措施：不要打开来源不明的影片文件，或在防火墙/邮件网关中拦截 .mov、.mp4 等影片文件附件。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Mac OS X QuickTime 代码注入漏洞"
updated = "2026-06-16T23:32:54Z"

