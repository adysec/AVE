[basic]
description = "Linux 内核 2.2.x 版本的 /proc/pid/mem 接口存在本地拒绝服务漏洞。本地攻击者可通过 mmap() 函数使用 PROT_READ 参数访问不可读的内存页，触发内核崩溃，导致系统拒绝服务。该漏洞需要本地用户权限才能利用，攻击复杂度低，影响运行 Linux 内核 2.2.x 的系统。"
published = "2002-12-23T05:00:00Z"
remediation = "升级至 Linux 2.2.26 或更高版本（该版本修复了 /proc/pid/mem 接口允许读取不可读内存页的问题），或升级至 2.4.x/2.6.x 系列内核。如无法升级，可通过移除 /proc/pid/mem 文件的 setuid 权限或限制本地用户对 /proc 文件系统的访问作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Linux Kernel 2.2 mmap 本地拒绝服务漏洞"
updated = "2026-06-16T21:59:13Z"

