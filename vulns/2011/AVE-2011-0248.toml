[basic]
description = "Google Chrome 16.0.912.77 之前版本中存在释放后使用（Use-After-Free）漏洞，该漏洞源于对 DOM 选择操作的对象生命周期管理不当，导致已释放的内存仍可被访问。远程攻击者可通过诱导用户访问特制网页触发该漏洞，成功利用可导致浏览器崩溃拒绝服务，甚至可能实现任意代码执行。CVSS 评分 7.5，危害等级高。Google 已在 Chrome 16.0.912.77 版本中修复此漏洞。"
published = "2012-01-24T04:03:36Z"
remediation = "立即将 Google Chrome 升级至 16.0.912.77 或更高版本，该版本已修复此释放后使用漏洞。受影响用户也可通过 Chrome 内置自动更新机制获取补丁。此外，该漏洞通过 WebKit 组件影响 Apple Safari（升级至 6.0+）、Apple iOS（升级至 6.0+）及 Apple iTunes（升级至 10.7+），相关用户应同步更新对应产品。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome 释放后使用漏洞"
updated = "2026-06-16T23:34:09Z"

