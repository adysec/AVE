[basic]
description = "BlackICE Defender 2.1及更早版本、BlackICE Pro 2.0.23及更早版本中存在安全策略绕过漏洞。当安全级别设置为 Nervous 或更低时，该入侵检测系统无法正确识别和拦截 Back Orifice（BO）远程管理木马的通信流量。远程攻击者可利用此漏洞绕过防火墙和入侵检测机制，通过 BO 木马对目标系统实施未授权远程控制，导致敏感信息泄露、数据篡改或服务中断。该漏洞无需身份认证即可远程利用，攻击复杂度低，CVSS 评分 7.5，危害等级高。"
published = "2000-06-22T04:00:00Z"
remediation = "将 BlackICE Defender 升级至 2.1 以上版本，或将 BlackICE Pro 升级至 2.0.23 以上版本，并将安全级别设置为 Nervous 以上以确保正确拦截 Back Orifice 流量。该产品已停止维护，建议迁移至现代主机入侵防御系统（如 Windows Defender Firewall + EDR 方案）以获得持续安全更新。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Internet Security Systems BlackICE 安全策略绕过漏洞"
updated = "2026-06-16T21:52:00Z"

