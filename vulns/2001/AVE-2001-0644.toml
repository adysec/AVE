[basic]
description = "Lucent/ORiNOCO WaveLAN 无线网卡在实现无线加密协议（WEP）时，使用了可预测的初始化向量（IV）值。远程攻击者无需身份认证即可在目标无线网络覆盖范围内，通过被动监听并收集足够数量的无线数据包，快速获取大量 IV 值。利用这些可预测的 IV 值，攻击者能够通过统计分析或字典攻击方式，在较短时间内破解 WEP 加密密钥，进而解密网络中传输的敏感数据。该漏洞影响了所有使用 Lucent/ORiNOCO WaveLAN 系列网卡的无线设备，CVSS 评分 5.0，危害等级中等。"
published = "2001-01-01T05:00:00Z"
remediation = "建议立即更换支持 WPA2 或 WPA3 的无线网卡，并更新无线路由器固件至最新版本。禁用 WEP 协议，配置强加密密码（推荐使用 AES 加密）。如无法立即更换硬件，可在防火墙层面禁用 affected 端口，并部署网络入侵检测系统监控异常的 IV 模式。此外，建议限制无线网络的物理覆盖范围，开启 MAC 地址过滤，部署无线网络专用 VLAN，必要时配置临时缓解措施如定期更换 WEP 密钥。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Lucent ORiNOCO WaveLAN 无线网卡 WEP加密初始化向量可预测漏洞"
updated = "2026-06-16T21:53:46Z"

