[basic]
description = "GNU C Library（glibc）2.13 至 2.40 版本的 assert() 函数在断言失败时，未能为断言失败消息字符串及大小信息分配足够的内存空间。当消息字符串大小与页面边界对齐时，会触发缓冲区溢出，导致程序崩溃或拒绝服务。该漏洞为本地攻击向量，攻击复杂度低，无需特权及用户交互即可触发，仅影响系统可用性。受影响的 Linux 发行版需升级至修复版本以消除风险。"
published = "2025-01-22T13:15:20Z"
remediation = "立即升级 GNU C Library (glibc) 至 2.41 及以上版本（含 2.42），该版本已包含 assert() 缓冲区溢出修复提交 68ee0f704cb8。各 Linux 发行版用户应通过包管理器安装对应安全更新：Debian/Ubuntu 运行 `apt update && apt upgrade libc6`，RHEL/CentOS 运行 `yum update glibc`，Alpine 运行 `apk upgrade musl`（如使用 musl）。无法立即升级时，可移除或禁用存在 assert() 触发的 setuid 程序作为临时缓解措施。"
score = 6.2
severity = "MEDIUM"
sources = ["msrc"]
title = "GNU glibc assert 函数缓冲区溢出漏洞"
updated = "2026-06-17T08:26:23Z"

