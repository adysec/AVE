[basic]
description = "Apple Safari for Windows 5.1.4之前版本中的国际化域名（IDN）功能未能正确限制URL中使用的字符，远程攻击者可通过在域名中插入同形异码字（homoglyphs，即外观相似的不同Unicode字符）来伪造合法域名，诱导用户访问恶意网站。该漏洞属于输入验证不完善（CWE-20），攻击者无需身份认证即可通过网络远程利用，可能导致用户被钓鱼攻击欺骗，泄露敏感信息。Apple已发布Safari 5.1.4版本修复此问题。"
published = "2012-03-12T21:55:00Z"
remediation = "立即将 Apple Safari 升级至 5.1.4 或更高版本（Windows 平台）。如无法升级，可在浏览器设置中禁用国际化域名（IDN）功能，或使用其他浏览器（如 Chrome、Firefox）替代 Safari 访问不信任的网站，避免点击可疑链接。"
score = 6.4
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari 国际域名 URI 伪造漏洞"
updated = "2026-06-16T23:37:52Z"

