[info]
author = "ave"
description = "BSDi 3.0/4.0 中 rcvtty 工具在执行脚本前未正确降级权限，本地攻击者可通过在命令行指定特制木马脚本，使脚本以提升的权限运行，从而获取系统高级访问权限。"
id = "POC-AVE-2000-0797"
name = "CVE-2000-1103 PoC"
severity = "high"
tags = ["ave-2000-0797"]
vuln_id = [
    "CVE-2000-1103",
    "AVE-2000-0797",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
