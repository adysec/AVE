[basic]
description = "佳能多款小型办公多功能打印机和激光打印机（包括 Satera LBP670C/MF750C 系列、Color imageCLASS LBP630C/MF650C 系列、i-SENSYS LBP630C/MF650C 系列、imageRUNNER 1643i II 等，固件版本 v06.02 及更早）的 XPS 字体解析处理模块存在缓冲区溢出漏洞（CWE-787）。该漏洞源于程序在处理特制 XPS 文件中的 TTF 字体数据时未正确校验长度，导致整数溢出进而引发越界写入。在 Pwn2Own 黑客大赛中已证实可被利用，网络相邻且未经验证的攻击者可通过向目标打印机发送特制的 XPS 打印任务触发该漏洞，导致设备拒绝服务或执行任意代码。CVSS 评分 9.3，危害等级严重。"
published = "2026-01-16T00:16:28Z"
remediation = '立即将受影响 Canon 打印机固件升级至 v06.02 之后的最新版本。固件更新包可通过 Canon 官方支持网站（https://psirt.canon/advisory-information/cp2026-001/）获取对应型号的更新文件，在打印机 Web 管理界面中通过"固件更新"功能上传安装。如无法立即打补丁，可在网络层面限制打印机仅接受来自受信任管理网段的访问，在防火墙上阻断非必要的 9100/TCP（Raw IPP）、515/TCP（LPD）及 80/TCP（Web 管理）端口的入站流量，并将打印机部署在独立 VLAN 中与业务网络隔离。'
score = 9.3
severity = "CRITICAL"
sources = ["zdi"]
title = "Canon 多款激光打印机 XPS字体解析缓冲区溢出远程代码执行漏洞"
updated = "2026-06-17T08:35:35Z"

