[basic]
description = "Rockwell Automation 公司 Arena Simulation 产品在解析 DOE 文件时存在越界写入漏洞。该漏洞源于对用户提供数据缺乏适当的边界验证，远程攻击者可构造特制的恶意 DOE 文件，诱使目标用户打开该文件触发解析过程，进而导致写入超出已分配内存对象末尾并造成内存损坏，最终可在当前进程上下文中执行任意代码。该漏洞影响 Arena 64 位版本 16.20.08 及更早版本、32 位版本 16.20.07 及更早版本，CVSS 评分 7.5，攻击复杂度较高且需要用户交互才能利用。"
published = "2026-01-01"
remediation = "立即安装 Oracle 2026 年 7 月 Critical Patch Update 安全补丁，将 Siebel CRM Cloud Applications 升级至 26.5 及以后已修复版本；如暂无法打补丁，应在防火墙或负载均衡器层面限制对 Siebel Cloud Manager 组件 HTTP 端口的网络访问，仅允许受信任的管理网段访问，以降低低权限攻击者通过 HTTP 进行未认证利用的风险。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "Oracle Siebel CRM Cloud Applications 认证缺失漏洞"
updated = "2026-01-01"

