[basic]
description = "Squid 2.4.STABLE6 之前版本存在代理认证凭证转发漏洞，当用户通过 Squid 代理访问远程 Web 站点时，代理服务器会在转发请求时错误地将用户的代理认证凭证（用户名和密码）转发给目标 Web 站点。远程攻击者可通过搭建恶意 Web 站点诱导代理用户访问，从而窃取用户的代理登录凭证。该漏洞影响 Squid 2.4.STABLE6 之前的所有版本，CVSS 评分 5.0（中等危害），攻击向量为网络、攻击复杂度低、无需认证、仅影响机密性。攻击者只需诱导受害者通过易受攻击的 Squid 代理访问恶意站点即可窃取凭证。升级至 Squid 2.4.STABLE6 或更高版本可修复此漏洞。"
published = "2002-07-26T04:00:00Z"
remediation = "建议立即升级 Squid 代理服务器至 2.4.STABLE6 或更高版本，升级前请备份配置文件 squid.conf。若暂时无法升级，请在 squid.conf 中配置 proxy_auth 代理认证时强制要求 HTTPS 连接，或在防火墙层面限制代理端口仅允许可信内网 IP 访问，禁止公网直接访问代理端口。升级后请重启 Squid 服务并验证代理认证功能正常。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Squid Squid 代理认证凭证泄露漏洞"
updated = "2026-06-16T21:57:59Z"

