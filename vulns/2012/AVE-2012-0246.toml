[basic]
description = "nginx 的 ngx_http_mp4_module 模块在处理 MP4 文件时存在缓冲区溢出漏洞。当启用 mp4 指令时，远程攻击者可通过向目标服务器发送特制的 MP4 文件触发该漏洞，导致内存覆写，造成拒绝服务或可能执行任意代码。该漏洞影响 nginx 1.0.7 至 1.0.14 及 1.1.3 至 1.1.18 版本，CVSS 评分 6.8，危害等级中危。官方已在 1.0.15 和 1.1.19 版本中修复此漏洞。"
published = "2012-04-17T21:55:01Z"
remediation = "升级 nginx 至 1.0.15 或 1.1.19 及以上版本。如无法立即升级，在 nginx 配置中移除所有 mp4 指令，或使用 `--without-http_mp4_module` 重新编译 nginx 以禁用 mp4 模块，阻止攻击者通过构造的 MP4 文件触发缓冲区溢出。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Nginx ngx_http_mp4_module 缓冲区溢出漏洞"
updated = "2026-06-16T23:40:58Z"

