[basic]
description = "AnalogX Proxy 4.04 及更早版本中存在缓冲区溢出漏洞，远程攻击者可通过向 FTP 代理服务发送超长的 USER 命令触发该漏洞，导致代理服务崩溃，造成拒绝服务。该漏洞源于对用户输入长度缺乏有效校验，攻击者无需身份认证即可利用，攻击复杂度低。受影响版本包括 AnalogX Proxy 4.04 及之前的所有版本。"
published = "2000-07-25T04:00:00.000"
remediation = "升级 AnalogX Proxy 至 4.5 或更高版本（4.5 及 4.6 已修复此漏洞），可从官方下载页面 http://www.analogx.com/contents/download/network/proxy.htm 获取。如无法升级，可在防火墙或网络边界限制对 FTP 代理端口（默认 21）的访问，仅允许受信 IP 连接。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "AnalogX Proxy 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:12.183"

