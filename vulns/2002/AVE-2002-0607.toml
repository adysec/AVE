[basic]
description = "Trillian 0.73 和 0.74 版本的 IRC 组件存在远程拒绝服务漏洞。攻击者可通过搭建恶意 IRC 服务器，当用户使用受影响版本的 Trillian 客户端连接到该服务器时，服务器向客户端发送特制的原始 IRC 消息（包括 206、211、213、214、215、217、218、243、302、317、324、332、333、352、367 等命令），触发客户端在解析这些消息时发生异常，导致程序崩溃。该漏洞无需身份认证，攻击条件简单，只要目标用户连接到恶意 IRC 服务器即可触发。利用方式为远程拒绝服务攻击，攻击者可借此中断受影响用户的即时通讯服务。受影响产品为 Cerulean Studios 开发的 Trillian 0.73 和 0.74 版本 IRC 客户端。"
published = "2003-04-02T05:00:00.000"
remediation = "升级到 Trillian 0.74d 或更高版本以修复此漏洞。Cerulean Studios 发布的 0.74d 补丁修复了 IRC 组件对原始消息 206、211、213、214、215、217、218、243、302、317、324、332、333、352 和 367 的异常处理缺陷。如暂时无法升级，建议避免连接不受信任的 IRC 服务器，或临时更换其他即时通讯客户端作为缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Cerulean Studios Trillian 远程拒绝服务漏洞"
updated = "2026-06-16T21:59:25.227"

