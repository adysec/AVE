[info]
author = "ave"
description = "检测远程托管的 .wms 皮肤文件是否包含可执行脚本元素，验证 Windows Media Player 7.0 在加载自定义皮肤文件时执行嵌入脚本的漏洞条件"
id = "POC-AVE-2000-0802"
name = "CVE-2000-1112 Windows Media Player .wms Script Execution PoC"
severity = "medium"
tags = ["ave-2000-0802"]
vuln_id = [
    "CVE-2000-1112",
    "AVE-2000-0802",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/skin.wms"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<script",
    "javascript:",
    "vbscript:",
    "onload",
    "onclick",
    "ActiveXObject",
]
