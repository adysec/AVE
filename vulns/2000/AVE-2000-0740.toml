[basic]
description = "SCO Unixware 7.0 自带的 SCOhelp HTTP 服务器中的 search97.cgi CGI 脚本存在格式字符串漏洞。远程攻击者可通过向 queryText 参数提交特制的格式字符串标记（如 %s、%n 等），利用 C 语言格式化函数的特性实现任意内存读写，从而在目标系统上以 Web 服务器进程权限执行任意命令。该漏洞无需身份认证即可远程利用，攻击复杂度低，可导致目标系统完全被控制。受影响的 SCO Unixware 7.0 系统在默认配置下即存在该 CGI 脚本，攻击面广泛。目前已存在公开的利用代码，危害性较高。"
published = "2000-12-11T05:00:00.000"
remediation = "建议立即禁用或移除 SCOhelp HTTP 服务器中的 search97.cgi 脚本，该脚本存在格式化字符串漏洞。如业务需要保留该服务，应在 Web 服务器配置中限制 search97.cgi 的访问来源 IP，仅允许可信内网段访问，并在边界防火墙上阻断外部对该 CGI 路径的访问。由于 SCO Unixware 7 已停止维护，官方不再提供安全补丁，最彻底的方案是迁移至受支持的操作系统平台。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "SCO Unixware help HTTP 服务器格式字符串漏洞"
updated = "2026-06-16T21:52:58.420"

