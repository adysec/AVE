[basic]
description = "Apple QuickTime 7.7.2 之前版本的 Windows 平台插件中存在栈缓冲区溢出漏洞。远程攻击者可构造特制的 QTMovie 对象文件，当用户使用受影响的 QuickTime 播放器打开该恶意文件时，触发栈缓冲区溢出，导致任意代码执行或应用程序崩溃。该漏洞无需身份认证，但需要用户交互（打开恶意文件），CVSS 评分 9.3，危害等级严重。Apple 已在 QuickTime 7.7.2 版本中修复此漏洞。"
published = "2012-05-16T10:12:57Z"
remediation = "立即将 Apple QuickTime 升级至 7.7.2 或更高版本（Apple 已于 2012 年 5 月发布 QuickTime 7.7.2 修复此漏洞，详见 http://support.apple.com/kb/HT5261）。由于 Apple 已停止对 Windows 版 QuickTime 的支持，建议在无法升级的环境中彻底卸载 QuickTime，并禁用浏览器中的 QuickTime 插件，同时避免打开来源不可信的 QTMovie 文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime 插件QTMovie对象栈缓冲区溢出漏洞"
updated = "2026-06-16T23:38:02Z"

