[basic]
description = "Ghost CMS 在特性图片说明（feature_image_caption）字段存在输入验证缺陷，具有 staff 权限的低权限用户可在创建文章时注入恶意 JavaScript 脚本。当其他具有更高权限的 staff 用户或管理员通过浏览器访问该文章时，注入的脚本将在其 Ghost Admin 会话上下文中执行，从而窃取会话凭证并实现权限提升。该漏洞影响 Ghost v4.9.0 至 v6.54.0 版本，攻击者需先拥有有效的 staff 账户，利用跨站脚本在管理员访问恶意内容时劫持其会话令牌，进而接管目标账户的完整管理权限。Ghost 官方已在 v6.54.1 版本中修复此问题。"
published = "2026-08-05T16:17:03Z"
remediation = "立即将 Ghost 升级至 v6.54.1 或更高版本以修复此跨站脚本漏洞。自托管用户若使用 Docker，请执行 docker pull ghost:latest 并重新部署容器；若使用 Ghost-CLI 安装，请运行 ghost update 完成版本升级。如暂时无法升级，可在 Ghost Admin 后台对用户输入内容启用严格过滤，或限制 feature_image_caption 字段的写入权限给受信管理员账号作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Ghost CMS 特性图片标题跨站脚本漏洞"
updated = "2026-08-05T18:17:14Z"

