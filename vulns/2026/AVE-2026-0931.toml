[basic]
description = "SwiftNIO HTTP/2 实现在处理入站 HEADERS 帧时缺少对 CR、LF、NUL、SP 等控制字符的校验，攻击者可通过构造包含换行符或空格的恶意 HTTP/2 头部值，利用 HTTP2ToHTTP1Codec 编解码器将其注入到后端 HTTP/1.1 请求中，实现 HTTP 请求走私或响应拆分攻击。该漏洞影响使用 swift-nio-http2 且跳过了出站头部验证的应用程序，CVSS 评分 5.3，危害等级中危。官方已在 1.45.0 版本中修复此漏洞。"
published = "2026-07-23T20:17:21.440"
remediation = "立即将 swift-nio-http2 升级至 1.45.0 或更高版本，该版本已修复 HEADERS 帧中 CR/LF/NUL 等控制字符的校验缺失问题。如无法立即升级，确保启用 NIOHTTP1 的 outbound header 验证（enableOutboundHeaderValidation 保持默认开启），并避免在 HTTP/2 到 HTTP/1.1 的编解码管道中跳过出站验证。"
score = 5.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Apple swift-nio-http2 HTTP/2头部值验证缺失导致请求走私漏洞"
updated = "2026-07-24T21:16:45.877"

