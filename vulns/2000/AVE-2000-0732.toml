[basic]
description = "Stalker CommuniGate Pro 3.3.2 的 POP3 守护进程在处理用户认证时存在信息泄露漏洞。当攻击者尝试登录时，服务器对无效用户名和无效密码返回不同的错误提示信息，导致远程攻击者无需认证即可通过枚举方式探测出服务器上有效的电子邮件地址。该漏洞可被利用于针对性的垃圾邮件攻击，扩大攻击面。受影响版本为 CommuniGate Pro 3.3.2，攻击者只需网络可达即可利用，无需任何权限。"
published = "2000-12-11T05:00:00.000"
remediation = '升级 Stalker CommuniGate Pro 至 3.3.3 或更高版本，该版本修复了 POP3 守护进程返回不同错误信息的问题。如无法升级，修改 POP3 服务配置，使无效用户名和无效密码返回相同的通用错误提示（如 "Authentication failed"），防止攻击者通过错误信息差异枚举有效邮箱地址。同时可在防火墙层面限制 POP3 端口（110）仅允许可信 IP 访问，降低被远程枚举的风险。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Stalker CommuniGate Pro POP3 用户名枚举漏洞"
updated = "2026-06-16T21:52:56.930"

