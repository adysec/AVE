[basic]
description = "MetInfo CMS 7.0.0beta 版本存在 SQL 注入漏洞，位于后台语言管理模块的 language_general.class.php 文件中，攻击路径为 admin/?n=language&c=language_general&a=doExportPack 接口的 appno 参数。由于该参数未进行充分的输入验证和参数化处理，具有后台管理员权限的认证攻击者可通过构造恶意的 SQL 语句，向数据库服务器发送特制请求，从而绕过身份验证机制直接执行任意 SQL 查询。该漏洞影响所有使用 MetInfo 7.0.0beta 版本的网站系统，攻击者可利用此漏洞获取数据库中的敏感信息（如管理员账号密码哈希、用户隐私数据、站点配置信息），甚至篡改或删除数据，导致严重的信息泄露和完整性破坏。CVSS v3.1 评分为 7.2（高危），攻击复杂度低，无需用户交互，但需要高权限账户才能触发。"
published = "2019-09-30T13:15:11Z"
remediation = "立即将 MetInfo 从 7.0.0 beta 升级至官方最新稳定版 8.1（下载地址 https://www.metinfo.cn/download/），该 SQL 注入漏洞已在后续稳定版本中修复。若暂无法升级，可临时将后台目录 admin 通过 Web 服务器配置限制为仅允许可信 IP 访问，并对 appno 参数进行严格的整数类型校验，阻止恶意 SQL 语句注入。升级完成后清除管理员会话并重新生成后台密码。"
score = 7.2
severity = "HIGH"
sources = ["nuclei"]
title = "米拓 MetInfo CMS SQL注入漏洞"
updated = "2026-06-17T02:23:07Z"

