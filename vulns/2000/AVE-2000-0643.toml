[basic]
description = "Lilikoi Ceilidh 2.60 存在拒绝服务漏洞，远程攻击者无需认证即可通过向目标服务器发送大量 POST 请求，耗尽服务器资源导致服务崩溃或无法响应正常请求。该漏洞影响 Ceilidh 2.60 版本，攻击复杂度低，仅需网络访问即可触发，无需用户交互。CVSS 评分 5.0，危害等级中危，主要影响系统可用性。"
published = "2000-06-09T04:00:00Z"
remediation = "Ceilidh 2.60 已停止维护，官方不再提供安全更新。建议立即停止使用该产品，迁移至受支持的替代方案。如无法立即替换，可在 Web 服务器或应用防火墙（WAF）层面限制单 IP 的 POST 请求速率（如每秒不超过 10 个请求），并配置请求体大小上限（如 1MB），以缓解大量 POST 请求导致的拒绝服务攻击。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Lilikoi Ceilidh POST请求拒绝服务漏洞"
updated = "2026-06-16T21:51:59Z"

