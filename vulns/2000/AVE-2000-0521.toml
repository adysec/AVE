[basic]
description = "Linux 系统中 pam_console PAM 模块存在权限验证缺陷，当显示管理器（如 gdm 或 kdm）启用 XDMCP 协议时，远程用户可绕过正常认证机制获取系统控制台访问权限，并能够重启系统。该漏洞影响 Conectiva 4.x/5.x 及 RedHat 6.x 等版本，CVSS 评分 5.0，危害等级中等。攻击者无需身份认证即可通过网络远程触发，导致系统可用性受损。"
published = "2000-07-27T04:00:00Z"
remediation = "安装 Red Hat 安全公告 RHSA-2000-044 提供的更新补丁，升级 pam_console 模块至修复版本。如无法立即打补丁，可在 gdm/kdm 等显示管理器中禁用 XDMCP 协议（将 /etc/X11/gdm/gdm.conf 中 Enable=false），或通过防火墙限制 XDMCP 端口（UDP 177）的远程访问作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Conectiva/RedHat Linux pam_console PAM模块 远程权限提升漏洞"
updated = "2026-06-16T21:52:13Z"

