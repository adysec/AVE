[basic]
description = "Moreover.com 的 cached_feed.cgi 脚本（版本 4.July.00）存在目录遍历漏洞。远程攻击者无需身份认证，通过在 category 或 format 参数中构造 `../` 序列进行路径穿越，可读取服务器上的任意文件，导致敏感信息泄露。该漏洞攻击复杂度低，仅需发送特制 HTTP 请求即可利用，影响运行该 CGI 脚本的 Web 服务器。"
published = "2000-12-19T05:00:00Z"
remediation = '立即升级 cached_feed.cgi 脚本至 2.0 或更高版本（厂商已在漏洞公开前修复并发布 2.0）。如无法升级，在 Web 服务器配置中对 category 和 format 参数做输入过滤，拒绝包含 "../" 或 "..\" 等目录遍历序列的请求，或限制 CGI 脚本仅允许特定用户访问。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Moreover cached_feed.cgi 目录遍历漏洞"
updated = "2026-06-16T21:52:44Z"

