[basic]
description = "Microsoft IIS 3.0/4.0/5.0 的管理脚本存在拒绝服务漏洞。远程攻击者无需认证即可通过 HTTP 访问管理脚本，且不提供特定参数（Absent Directory Browser Argument），导致 IIS 服务进程崩溃或资源耗尽，造成拒绝服务。该漏洞攻击条件简单，无需特殊权限，影响 IIS 3.0 至 5.0 版本。"
published = "2000-07-14T04:00:00.000"
remediation = "强烈建议优先禁用 IIS 中的 .HTR 脚本映射：打开 Internet 服务管理器，右键单击 Web 服务器 → 属性 → 主属性 → WWW 服务 → 编辑 → 主目录 → 配置，删除 .HTR 条目。如因业务必须保留 .HTR 功能，请安装 MS01-004 安全更新（已取代 MS00-044 补丁），该补丁适用于 Windows NT 4.0 SP5/SP6a 和 Windows 2000 Gold/SP1/SP2。同时收紧 /scripts/iisadmin 目录权限，仅允许管理员访问。若服务器已因该漏洞陷入无限循环，停止并重启 IIS 服务即可恢复，无需重启操作系统。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft IIS 管理脚本拒绝服务漏洞"
updated = "2026-06-16T21:52:08.957"

