[basic]
description = "Harmis JE Messenger 组件 1.2.2 for Joomla! 存在目录遍历漏洞，攻击者可通过构造包含目录遍历序列（如 `../`）的请求参数，绕过应用目录限制，读取服务器上的任意文件（如配置文件、源代码等敏感信息）。该漏洞影响使用该组件 1.2.2 版本的 Joomla! 站点，攻击者无需身份认证，攻击复杂度低，可直接远程利用，导致敏感信息泄露，CVSS 评分 7.5。"
published = "2019-03-29T15:29:00Z"
remediation = "升级 Harmis JE Messenger 至 1.2.3 或更高版本以修复目录遍历漏洞。如厂商已停止提供更新，应立即卸载该组件并移除相关文件。临时缓解措施包括在 Web 服务器配置中禁用该组件目录的访问权限，或在防火墙层面阻断包含目录遍历特征参数的恶意请求。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Harmis JE Messenger 目录遍历漏洞"
updated = "2026-06-17T02:44:51Z"

