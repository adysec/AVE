[basic]
description = "Google Chrome 17.0.963.46之前版本在处理CSS列跨度（column span）时存在变量类型转换不当导致的释放后使用（Use-After-Free）漏洞。远程攻击者可构造特制HTML文档，诱使用户在受影响浏览器中访问，触发已释放内存的非法访问，导致浏览器崩溃拒绝服务，甚至可能实现任意代码执行。该漏洞影响Chrome 16.x及更早版本，CVSS评分6.8，危害等级中危。"
published = "2012-02-09T04:10:28Z"
remediation = "升级 Google Chrome 至 17.0.963.46 或更高版本，该版本修复了列跨度处理中的类型转换错误导致的使用后释放漏洞。如无法升级，可禁用 JavaScript 或使用 Chrome 的站点隔离功能作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 列跨度变量转换释放后使用漏洞"
updated = "2026-06-16T23:34:12Z"

