[info]
author = "ave"
description = "验证目标系统是否存在Windows Server权限提升漏洞(CVE-2026-50311)，该漏洞允许已认证本地用户通过不当访问控制提升权限至SYSTEM级别"
id = "POC-AVE-2026-1172"
name = "CVE-2026-50311 PoC"
severity = "high"
tags = ["ave-2026-1172"]
vuln_id = [
    "CVE-2026-50311",
    "AVE-2026-1172",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
