[info]
author = "ave"
description = "O'Reilly WebSite Professional 2.4 及更早版本存在缓冲区溢出漏洞，远程攻击者通过发送超长 GET 请求路径或超长 Referrer 头字段可触发溢出并执行任意命令。本 PoC 发送超长 URI 请求，检测响应中是否包含 WebSitePro 服务器标识以确认漏洞存在。"
id = "POC-AVE-2000-1406"
name = "CVE-2000-0623 PoC"
severity = "critical"
tags = ["ave-2000-1406"]
vuln_id = [
    "CVE-2000-0623",
    "AVE-2000-1406",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/{{Path}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Server: WebSitePro"]
