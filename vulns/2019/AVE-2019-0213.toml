[basic]
description = "elFinder 是一款开源的 Web 文件管理器，其在 2.1.48 及之前版本的 PHP connector 中存在操作系统命令注入漏洞（CWE-78）。未经身份认证的远程攻击者可以通过构造特制的 HTTP 请求参数（如文件名或路径参数）向服务器发送任意操作系统命令，从而获得远程代码执行能力。该漏洞影响所有使用受影响版本部署 elFinder 的 Web 应用系统，CVSS v3 基础评分为 9.8（严重），攻击复杂度低且无需用户交互即可成功利用。攻击者成功利用该漏洞后可在目标服务器上执行任意系统命令，进而完全控制服务器或窃取敏感数据。官方已在 2.1.48 版本中修复该漏洞。"
published = "2019-02-26T19:29:00Z"
remediation = "将 elFinder 升级至 2.1.48 或更高版本（推荐 2.1.70）以修复 PHP connector 中的命令注入漏洞。如暂无法立即升级，可临时禁用 PHP connector（移除或重命名 /php/connector.minimal.php），或通过 Web 服务器配置（如 Apache .htaccess 或 Nginx 配置）限制 elFinder 目录的访问权限，并部署 WAF 规则过滤请求中的特殊字符（如反引号、管道符、分号等）。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Studio-42 elFinder 操作系统命令注入漏洞"
updated = "2026-06-17T02:43:19Z"

