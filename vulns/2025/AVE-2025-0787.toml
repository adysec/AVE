[basic]
description = "Windows MapUrlToZone 安全功能存在绕过漏洞，该函数负责将 URL 映射到对应的安全区域（如 Internet、本地 Intranet、受信任站点等）。攻击者可构造特制的 URL 链接，诱使用户点击后绕过安全区域检查机制，使本应归属 Internet 区域的恶意内容被错误地视为更受信任的区域，导致机密性受到低度影响。该漏洞攻击复杂度低，无需身份认证，但需要用户交互配合。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:57Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新。Windows 10/11 用户通过 Windows Update 自动获取更新即可；Windows Server 用户需安装对应累积更新（如 Server 2022 更新至 10.0.20348.3091 及以上版本，Server 2025 更新至 10.0.26100.2894 及以上版本）。对于已停止主流支持的 Windows Server 2008/2012 等版本，需购买 ESU 扩展安全更新并安装 KB5050061。如无法立即打补丁，可限制用户仅访问受信任的 URL 区域，并禁用不必要的 Internet Explorer 功能作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows MapUrlToZone 安全功能绕过漏洞"
updated = "2026-06-17T08:43:06Z"

