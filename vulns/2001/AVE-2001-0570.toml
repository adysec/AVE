[basic]
description = "CVE-2001-0003是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-02-12T05:00:00Z"
remediation = "安装 Microsoft Security Bulletin MS01-001 发布的补丁：对于 Office 2000 系统，须先安装 SR-1a 再安装 Office 2000 补丁（KB282132）；对于未安装 Office 2000 的 Windows 2000 和 Windows Me 系统，分别安装对应操作系统补丁。补丁将强制 Web Extender Client 遵守 Internet Explorer 安全区域设置，不再向不可信服务器发送 NTLM 凭证。如无法立即打补丁，可临时禁用 Web Folders 功能，并避免访问恶意网站或打开不明 HTML 邮件。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Office Web Extender Client NTLM 认证凭据泄露漏洞"
