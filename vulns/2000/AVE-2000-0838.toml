[basic]
description = "SGI IRIX 6.3/6.4/6.5 中 Performance Copilot 的性能指标收集守护进程（PMCD）存在输入验证缺陷，远程未授权攻击者可向 PMCD 端口发送超长字符串，导致守护进程资源耗尽并拒绝服务。该漏洞影响运行 Performance Copilot 的 IRIX 系统，攻击者只需网络访问 PMCD 端口即可利用，无需身份认证，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），属于拒绝服务类漏洞。ExploitDB 已有公开 PoC（编号 21431）演示该利用方式。"
published = "2001-08-31T04:00:00Z"
remediation = "立即应用SGI安全补丁20020407补丁集，升级到IRIX 6.5 Service Release 1或更高版本。通过BGP/WAN口关闭PMCD端口或限制访问IP。将服务配置为使用固定长度字符串缓冲区，防止长字符串攻击。限制PMCD端口的网络访问权限，部署IDS监控PMCD异常流量，并在IRIX 6.x系统上安装最新的Performance Metrics Collector Daemon安全更新包。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "SGI IRIX 性能协作者 拒绝服务漏洞"
updated = "2026-06-16T21:53:21Z"

