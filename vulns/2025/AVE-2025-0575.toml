[basic]
description = "GNU elfutils 0.192 版本的 eu-readelf 组件在 readelf.c 文件的 dump_data_section 与 print_string_section 函数中存在缓冲区溢出漏洞。攻击者可通过构造一个特制的 ELF 格式文件，并在本地环境下利用 eu-readelf 工具对其进行解析，通过操纵参数 z/x 触发内存溢出。该漏洞的影响范围涵盖所有使用受影响版本 GNU elfutils 的系统，可能导致程序异常崩溃或被利用实现本地代码执行。"
published = "2025-02-17T03:15:09Z"
remediation = "建议将 GNU elfutils 更新至 0.192 之后的修复版本，或手动应用官方发布的补丁（Patch ID: 73db9d2021cab9e23fd734b0a76a612d52a6f1db）。对于 Linux 发行版用户，请及时执行系统更新（如 `yum update` 或 `apt upgrade`）以安装由厂商分发的安全更新包。"
score = 4.8
severity = "MEDIUM"
sources = ["msrc"]
title = "GNU elfutils eu-readelf 缓冲区溢出漏洞"
updated = "2026-06-17T08:39:00Z"

