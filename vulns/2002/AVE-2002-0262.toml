[basic]
description = "BadBlue 1.5/1.6 是一个功能强大的文件共享服务器软件，但在版本 1.5 和 1.6 中存在严重的目录遍历漏洞。攻击者可通过在URL请求中嵌入特殊目录遍历符（如 '..' 等）或使用修改后的遍历符号，绕过路径验证机制，直接访问目标系统上的任意文件。攻击者无需任何身份验证即可远程触发此漏洞，利用精心构造的HTTP请求读取敏感文件，包括系统配置文件、密码文件、数据库文件等，严重威胁到系统的信息完整性和机密性。该漏洞影响 Windows 平台上安装的 BadBlue 1.5 和 1.6 版本用户，攻击者可通过网络远程利用此漏洞窃取或破坏关键系统信息。虽然攻击对系统可用性影响有限，但完整性破坏风险高。微软及厂商已发布安全补丁，建议所有用户立即升级至 BadBlue 1.6.1 或更高版本以修复此安全隐患，防止潜在的数据泄露和系统破坏风险。攻击者通过网络直接访问服务器文件系统，破坏了应用程序的访问控制机制，可能导致敏感信息泄露或系统完整性受损。攻击场景包括文件读取、密码字典获取、系统配置信息泄露等多个方面，攻击者可利用漏洞获取管理员权限、修改系统文件或植入恶意程序，对企业数据安全构成严重威胁。"
published = "2002-06-25T04:00:00Z"
remediation = '建议立即升级 BadBlue 到 1.6.1 或更高版本以修复目录遍历漏洞。若暂时无法升级，可在 Web 服务器层面配置 URL 规则拦截包含 "../" 或 "..%2f" 等目录遍历序列的请求，或在 Web 应用防火墙 (WAF) 添加目录遍历攻击特征规则作为临时缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Working Resources BadBlue 1.5/1.6 目录遍历漏洞"
updated = "2026-06-16T21:57:13Z"

