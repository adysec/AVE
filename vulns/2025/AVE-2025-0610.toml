[basic]
description = "Keras Model.load_model 函数存在任意代码执行漏洞，即使启用 safe_mode=True 也无法阻止。攻击者可构造恶意 .keras 归档文件，通过篡改其中的 config.json 指定任意 Python 模块和函数及其参数，在模型加载时被执行。该漏洞影响 Keras 3.9.0 之前版本，CVSS 评分 7.3（HIGH），属于代码注入类漏洞（CWE-94）。攻击需要受害者加载恶意模型文件，利用方式为诱导用户加载经过篡改的模型存档，从而在目标系统上执行任意代码。"
published = "2025-03-11T09:15:25Z"
remediation = "升级 TensorFlow/Keras 到最新安全版本（≥2.15.0）并应用 GitHub 拉取请求 #20751 的补丁。如无法立即升级，建议禁用 Python 的 `pickle` 模块加载功能，并限制 `.keras` 归档文件的使用权限。通过 Keras 的 `load_model` 函数设置 `safe_mode=True` 并验证模型文件完整性。当前版本 Keras 2.15.0 已经修复了利用 config.json 进行代码执行的漏洞，建议立即应用安全更新。"
score = 7.3
severity = "HIGH"
sources = ["msrc"]
title = "Keras Model.load_model 远程代码执行漏洞"
updated = "2026-06-17T08:39:21Z"

