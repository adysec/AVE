[basic]
description = "Apple Safari 6.0 之前的版本中，WebKit 引擎在处理网页拖放（drag-and-drop）事件时存在信息泄露漏洞。当用户在 Safari 浏览器中浏览恶意构造的网页时，攻击者可通过 JavaScript 监听拖放事件，获取用户本地文件的完整路径名称（full pathname），并将该信息泄露至远程服务器。该漏洞影响 macOS 和 iOS 系统上的 Safari 浏览器，攻击条件为受害者需在恶意网页上执行拖放操作（如将本地文件拖入浏览器窗口）。由于路径名称可能包含用户名、目录结构等敏感信息，攻击者可借此进一步实施定向攻击。Apple 已在 Safari 6.0 中修复此漏洞，建议用户升级浏览器至安全版本，并避免在不受信任的网页上执行拖放操作。"
published = "2012-07-25T19:55:06.167"
remediation = "升级 OS X 至 Lion v10.7.4 以获取 Safari 6.0，该版本通过改进对拖动文件事件的处理修复了文件路径向远程服务器泄露的问题。如暂无法升级，应避免在 Safari 中将本地文件拖放到不受信任的网页上，或改用其他浏览器作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari 拖放文件信息泄露漏洞"
