[basic]
description = "BTT Software SNMP Trap Watcher 1.16 存在缓冲区溢出漏洞，远程攻击者可通过发送超长字符串的 SNMP trap 消息触发缓冲区溢出，导致拒绝服务攻击，甚至可能执行任意代码。该漏洞影响 BTT Software SNMP Trap Watcher 1.16 版本，攻击者无需身份认证即可远程利用，CVSS 评分 7.5，属于高危漏洞。"
published = "2001-08-31T04:00:00Z"
remediation = "立即停止使用 BTT Software SNMP Trap Watcher 1.16 并卸载该软件，该产品已停止维护且无官方补丁。如短期内无法替换，请在防火墙或路由器 ACL 中严格限制仅允许可信管理主机访问该软件监听的 SNMP 端口，阻止外部攻击者发送恶意长字符串 trap 数据包；同时在边界防火墙启用入侵检测规则，拦截含有异常长度 SNMP trap 载荷的网络流量。长期方案建议迁移至仍在积极维护的 SNMP 监控工具，如 SolarWinds、Paessler PRTG 或开源替代方案 Nagios/Zabbix。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "BTT Software SNMP Trap Watcher 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:21Z"

