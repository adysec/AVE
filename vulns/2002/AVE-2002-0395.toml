[basic]
description = "Microsoft SQL Server 7.0 和 2000 安装程序为与辅助函数关联的扩展存储过程设置了过弱的访问权限，导致低权限用户甚至远程攻击者可通过调用 xp_execresultset、xp_printstatements、xp_displayparamstmt 等存储过程以管理员权限执行任意 SQL 命令。攻击者无需身份认证即可通过网络远程利用，实现完全权限提升，CVSS 评分 10.0，危害等级严重。Microsoft 已在后续安全更新中修复此漏洞。"
published = "2002-09-05T04:00:00Z"
remediation = "立即安装 Microsoft SQL Server 2000 Service Pack 3 (SP3) 或更高版本，该更新已修复扩展存储过程的权限问题。如无法升级，手动执行以下操作：连接到 SQL Server 后运行 `REVOKE EXECUTE ON xp_execresultset TO PUBLIC; REVOKE EXECUTE ON xp_printstatements TO PUBLIC; REVOKE EXECUTE ON xp_displayparamstmt TO PUBLIC;` 撤销 PUBLIC 角色的执行权限。同时建议在防火墙层面限制对 SQL Server 端口 (1433/TCP) 的访问，仅允许受信任 IP 连接。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Microsoft SQL Server 2000/7.0 扩展存储过程权限提升漏洞"
updated = "2026-06-16T21:58:00Z"

