[basic]
description = "Apache 2.0.47 之前版本在 IPv6 主机上运行时，其 FTP 代理模块在尝试创建 IPv6 套接字失败后会陷入无限循环，导致 CPU 资源被耗尽，造成拒绝服务。远程攻击者无需认证即可通过构造特定 FTP 请求触发该漏洞，影响运行 Apache 2.0.47 之前版本且启用 IPv6 及 FTP 代理功能的服务器。"
published = "2003-08-18T04:00:00Z"
remediation = "立即将 Apache HTTP Server 升级至 2.0.47 或更高版本（官方修复版本）。由于 Apache 2.0.x 已停止维护，强烈建议升级至 2.4.x 最新稳定版。如无法立即升级，可在配置中禁用 mod_proxy_ftp 模块（注释掉 LoadModule proxy_ftp_module 行），或通过防火墙规则阻止外部对 FTP 代理端口的访问作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Apache HTTP Server 2.0.47 拒绝服务漏洞"
updated = "2026-06-16T22:01:50Z"

