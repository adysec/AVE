[basic]
description = "MuH IRC 服务器的日志记录功能存在安全漏洞，攻击者可以通过向服务器发送包含恶意格式字符串的昵称来触发漏洞。该漏洞的核心原因是服务器日志记录功能未能有效对用户输入的格式字符串进行转义处理，导致格式字符串解析时出现异常。远程攻击者可利用这一漏洞导致服务器崩溃（拒绝服务）或在目标系统上执行任意代码，影响用户数据安全和服务器稳定。通过精心构造的昵称，攻击者可以绕过服务器的验证机制，将恶意代码注入到日志处理流程中，实现对目标IRC服务器的远程代码执行控制。该漏洞影响 MuH 2.05d IRC 服务器版本，攻击者无需任何权限即可实施攻击，安全风险极高。漏洞的 CVSS 评分达到 7.5，表明其严重性介于中高与高之间，需要及时修复以确保网络服务安全。"
published = "2000-11-14T05:00:00.000"
remediation = "立即升级到现代IRC服务器替代品（如UnrealIRCd、Ngircd或Divebaudinet），并确保升级到最新安全补丁版本。如果无法立即更换，请编辑muh服务器的源代码.patch文件，应用安全清理格式字符串的补丁解决方案。同时，将服务绑定到局域网内部，禁用外部访问，并严格限制客户端发送格式化nicknames，实现防火墙级防护作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "muh IRC服务器 格式化字符串漏洞导致拒绝服务和任意代码执行"
updated = "2026-06-16T21:52:36.770"

