[basic]
description = "Netopia ISDN Router 650-ST 在 4.3.5 版本之前存在认证绕过与信息泄露漏洞。该漏洞源于登录界面的异常处理机制存在缺陷，未经身份认证的远程攻击者可直接访问设备的登录页面，通过输入特定控制字符绕过身份验证过程，从而无需用户名和密码即可读取系统日志文件。受影响设备包括所有运行旧版本固件的 Netopia ISDN Router 650-ST 系列路由器。攻击者利用此漏洞可获取系统日志中的敏感信息，如网络配置参数、接口状态、连接记录及用户活动信息，这些信息可能被用于进一步 reconnaissance 或针对性的后续攻击。由于该漏洞利用无需认证且攻击复杂度低，攻击者只需通过 HTTP 或 Telnet 直接连接至设备登录界面即可完成利用，CVSS v2 评分为 5.0，危害等级中等。"
published = "2001-01-09T05:00:00Z"
remediation = "立即升级 Netopia ISDN Router 650-ST 固件至 4.3.5 或更高版本，以修复未经认证即可通过控制字符读取系统日志的漏洞。如暂时无法升级，应在防火墙或路由器访问控制列表中仅允许可信管理主机访问设备的 telnet 端口，阻止外部攻击者直接连接到登录界面。此外建议关闭不必要的 telnet 远程管理功能，改用本地串口或 SSH（若设备支持）进行管理，并定期审查系统日志的访问记录。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Netopia ISDN Router 650-ST 未授权信息泄露漏洞"
updated = "2026-06-16T21:53:19Z"

