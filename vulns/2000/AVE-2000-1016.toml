[basic]
description = "WQuinn QuotaAdvisor 4.1 存在信息泄露漏洞。该软件在生成目标共享报告时未对目录和文件列表进行访问控制，本地攻击者可通过运行报告功能枚举系统上的目录结构和文件列表，导致敏感信息泄露。攻击条件要求攻击者具有本地访问权限，无需身份认证即可利用，CVSS 评分 2.1，危害等级低。"
published = "2000-12-19T05:00:00.000"
remediation = "立即升级 WQuinn QuotaAdvisor 至 4.1 以上版本（如厂商已停止维护，建议迁移至其他受支持的磁盘配额管理工具）。在无法升级时，通过 Windows 共享权限和 NTFS 权限限制非授权用户对目标共享目录的访问，仅允许管理员运行报告功能，并移除 Everyone 等默认权限组。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "WQuinn QuotaAdvisor 信息泄露漏洞"
updated = "2026-06-16T21:52:47.227"

