[basic]
description = "MIT Kerberos 5（krb5）1.2.2 及更早版本中的 radix_encode 函数在处理 ftpglob 函数返回的文件通配符输出时，未能正确校验 base-64 编码数据的长度边界，导致发生缓冲区溢出（CWE-120）。未经身份认证的远程攻击者可通过发送特制的 base-64 编码数据包触发该漏洞，进而使目标 Kerberos 服务崩溃拒绝服务，严重情况下可被利用执行任意代码。该漏洞影响运行受影响版本 Kerberos 的各类 Linux 系统，包括 Red Hat Linux 7.0 至 7.2、Mandrake Linux 8.1 至 8.2 以及 MandrakeSoft Multi Network Firewall 2.0 等发行版，攻击条件宽松，无需身份验证且无需用户交互即可远程利用。"
published = "2001-05-16T04:00:00Z"
remediation = "升级 MIT Kerberos 5 至 1.2.3 或更高版本，并重新编译 ftpd。如暂无法立即升级，可下载并应用 MIT 2001 年 4 月发布的 ftpbuf_122_patch.txt 补丁后重新编译 ftpd；同时在 ftpd 配置中禁用匿名 FTP 登录作为临时缓解措施，限制攻击面。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "MIT Kerberos krb5 FTP 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:56:02Z"

