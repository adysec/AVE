[basic]
description = "该漏洞存在于 Mozilla Firefox 4.x 至 5 版本、Thunderbird 6.0 之前版本以及 SeaMonkey 2.x 之前版本中。当这些浏览器在 Windows 系统上使用 Direct2D (D2D) API 进行硬件加速时，其 canvas 元素处理机制存在缺陷，允许远程攻击者绕过同源策略（Same Origin Policy）。攻击者可以通过在 canvas 中插入恶意内容，非法获取来自不同域名的敏感图像数据。利用该漏洞需要用户访问受控的恶意网页，从而导致跨源数据窃取。"
published = "2011-08-18T18:55:01Z"
remediation = "建议立即将 Mozilla Firefox 升级至 6.0 或更高版本，Mozilla Thunderbird 升级至 6.0 或更高版本，以及 SeaMonkey 升级至 2.3 或更高版本。如无法立即升级，可通过在浏览器设置中禁用硬件加速（Direct2D）来缓解该跨源数据窃取风险。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 跨源数据窃取漏洞"
updated = "2026-06-16T23:32:22Z"

