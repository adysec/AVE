[basic]
description = "Linux 内核 2.2.19 之前版本的 binfmt_misc 模块存在未知漏洞，与用户页（user pages）处理不当有关。本地攻击者可通过加载特制的二进制格式文件触发该漏洞，利用高复杂度攻击获取系统最高权限，导致机密性、完整性和可用性完全丧失。该漏洞影响所有 2.2.19 之前版本的 Linux 内核。"
published = "2001-04-17T04:00:00Z"
remediation = "升级 Linux 内核至 2.2.19 或更高版本（如 2.4.x 系列），或在内核配置中禁用 CONFIG_BINFMT_MISC 选项并重新编译内核。Debian 用户可应用 DSA-047 安全更新。若无法立即升级，可通过卸载 binfmt_misc 模块（modprobe -r binfmt_misc）或在 /proc/sys/fs/binfmt_misc/ 中移除注册的解释器作为临时缓解措施。"
score = 6.2
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux Kernel binfmt_misc 用户页相关未知漏洞"
updated = "2026-06-16T21:56:10Z"

