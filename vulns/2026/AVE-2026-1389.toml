[basic]
description = "Open WebUI 是一款可自托管的 AI 平台。在 0.10.0 至 0.11.0 版本中，`backend/open_webui/routers/folders.py` 内的 `DELETE /api/v1/folders/{id}` 接口存在授权逻辑缺陷：删除操作的级联逻辑绑定的是文件夹所有者的 ID，但子文件夹的授权检查仅要求调用者具备继承的写入权限，而非所有者或管理员身份，而根文件夹却要求所有权或管理员权限。当文件夹共享功能开启（`user.permissions.sharing.folders`，默认关闭），且受害者以写入权限向攻击者共享文件夹后，攻击者可利用该漏洞永久删除所有者共享文件夹内及整个子目录树下的全部聊天记录与消息；若在请求中设置 `delete_contents=false`，还可强制将所有者聊天记录移出文件夹，造成未授权的数据重定位。Open WebUI 0.11.0 已统一修复该问题，要求根文件夹和子文件夹的删除操作均仅限所有者或管理员执行。"
published = "2026-08-04T21:16:38Z"
remediation = "将 Open WebUI 升级至 0.11.0 或更高版本以彻底修复该漏洞，修复提交见 https://github.com/open-webui/open-webui/commit/915ef7d0798d3175819cedbb2f62d7bf0db78c98，发布页见 https://github.com/open-webui/open-webui/releases/tag/v0.11.0。如暂时无法升级，应在系统配置中关闭文件夹共享功能（将 `user.permissions.sharing.folders` 设置为 `false`），并审查现有共享文件夹权限，移除不必要的写入协作者，以降低数据被恶意删除的风险。"
score = 8.1
severity = "HIGH"
sources = ["ghsa"]
title = "Open WebUI 共享文件夹越权删除漏洞"
updated = "2026-08-05T15:17:12Z"

