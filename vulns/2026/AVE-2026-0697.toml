[basic]
description = "GitHub MCP Server 在处理 `completion/complete` 请求时存在空指针解引用漏洞。由于 `CompletionsHandler` 函数在访问 `params.Ref` 之前未进行空值检查，未经身份验证的远程攻击者可通过发送缺失或为空的 `ref` 字段的畸形 JSON-RPC 请求，触发 Go 运行时恐慌（panic）并导致服务器进程崩溃。该漏洞影响 1.1.0 版本之前的所有版本，可被用于实施完整的拒绝服务（DoS）攻击。"
published = "2026-07-28T16:18:14Z"
remediation = "建议立即将 GitHub MCP Server 升级至 v1.1.0 或更高版本。该版本通过在 CompletionsHandler 函数中增加对 params.Ref 的 nil 检查，解决了空指针解引用导致的拒绝服务漏洞。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "GitHub MCP Server 空指针解引用拒绝服务漏洞"
updated = "2026-07-28T18:17:20Z"

