[basic]
description = "Linux内核KVM x86虚拟化模块中存在空指针解引用漏洞。当向客户机暴露Hyper-V enlightenments时，若本地APIC未以内核模式实现而在用户空间模拟，SEND_IPI和SEND_IPI_EX hypercall处理逻辑未正确校验APIC模式，导致kvm_hv_send_ipi函数调用__apic_accept_irq时触发空指针解引用，可使客户机内具备低权限的恶意用户引发宿主机内核崩溃，造成拒绝服务。该漏洞影响使用KVM虚拟化且启用Hyper-V特权的Linux内核版本，攻击者需在客户机内拥有本地低权限访问权限并发送特制hypercall方可触发。"
published = "2025-02-27T03:15:18.690"
remediation = "升级 Linux 内核至以下修复版本：5.10.236、5.15.179、6.1.129、6.6.79、6.12.16 或 6.13.4 及以后版本。受影响版本为 4.20 至 6.13.3 之间的内核。如暂无法升级，可在 KVM 虚拟化环境中禁用 Hyper-V  enlightenments 或强制使用内核态本地 APIC 模拟作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 KVM x86 空指针解引用拒绝服务漏洞"
updated = "2026-06-17T08:44:15.507"

