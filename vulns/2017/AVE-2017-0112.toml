[basic]
description = "Fortinet FortiOS 5.6.0 及之前版本存在跨站脚本（XSS）漏洞，位于 SSL-VPN 的 Replacement Message HTML 功能中。远程攻击者无需身份认证即可向该功能注入恶意脚本代码，当管理员或用户访问受影响的 SSL-VPN 页面时，注入的脚本会在浏览器中执行，导致敏感信息泄露或未授权操作。该漏洞影响广泛部署的 Fortinet 防火墙设备，攻击复杂度低，需用户交互触发。"
published = "2017-09-12T02:29:00Z"
remediation = "升级 FortiOS 至 5.6.1 或更高版本。在 FortiGate 管理界面中，检查 SSL-VPN 门户的 Replacement Message HTML 自定义内容，移除或转义所有用户可控的输入参数。如无法立即升级，可在 SSL-VPN 设置中禁用 Replacement Message 自定义 HTML 功能，并限制 SSL-VPN 管理界面的访问来源 IP。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Fortinet FortiOS SSL-VPN 跨站脚本漏洞"
updated = "2026-06-17T01:17:35Z"

