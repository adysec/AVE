[basic]
description = "Check Point VPN-1/FireWall-1 4.1 及更早版本存在 FTP 连接强制绕过漏洞（FTP Bounce）。远程攻击者可通过向防火墙发送特制的无效 FTP 命令，利用防火墙对 FTP 协议处理不当的缺陷，将 FTP 连接重定向至第三方服务器，从而绕过防火墙访问控制策略。该漏洞允许攻击者利用受影响的防火墙作为跳板扫描内网或攻击其他目标，CVSS 评分 5.0，危害等级中危。厂商已发布安全更新修复此漏洞。"
published = "2000-11-14T05:00:00Z"
remediation = "升级 Check Point VPN-1/FireWall-1 至 4.1 SP2 或更高版本，该漏洞已在后续版本中修复。如无法升级，可在防火墙策略中禁用 FTP 协议的安全检查（将 FTP Security Server 设为 None），或改用 FTPS/SFTP 替代明文 FTP 协议。同时建议在防火墙上配置严格出站规则，限制内部服务器主动发起外部连接的能力。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Check Point VPN-1/FireWall-1 FTP连接重定向漏洞"
updated = "2026-06-16T21:52:32Z"

