[basic]
description = "Windows DHCP 客户端服务存在越界读取漏洞。由于 DHCP 客户端服务在处理特制 DHCP 响应报文时未正确验证数据边界，导致越界内存读取，进而触发服务崩溃。该漏洞的攻击复杂度较高，需要攻击者与目标处于同一相邻网络，并诱使用户触发特定网络操作。成功利用此漏洞可导致 DHCP 客户端服务停止响应，造成拒绝服务。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:29Z"
remediation = "建议立即安装 Microsoft 2025 年 2 月安全更新：Windows 11 24H2 安装 KB5051987（OS Build 26100.3194），Windows 11 23H2/22H2 安装 KB5051989（OS Build 22631.4890），Windows Server 系统安装对应版本的安全更新或热补丁 KB5052105。可通过 Windows Update 自动获取更新，或从 Microsoft Update Catalog 手动下载安装。如无法立即打补丁，可在网络层面限制 DHCP 端口的相邻网络访问作为临时缓解措施。"
score = 4.8
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft DHCP 客户端服务拒绝服务漏洞"
updated = "2026-06-17T08:42:42Z"

