[basic]
description = "tags.<value>wwwwais 网关程序存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过向目标服务器发送包含超长 QUERY_STRING 参数的 HTTP GET 请求触发该溢出，进而在服务器上执行任意操作系统命令。该漏洞影响部署 wwwwais CGI 网关的 Unix/Linux 系统，攻击者无需任何凭据或用户交互即可利用，且利用过程简单、攻击门槛极低。成功利用后，攻击者可完全控制目标服务器，窃取敏感信息、篡改系统文件或进一步渗透内网。"
published = "2001-03-26T05:00:00Z"
remediation = "该漏洞影响 wwwwais.c (wwwwais.25.c) CGI 程序，官方已无维护且无官方补丁发布。建议立即删除服务器上的所有 wwwwais* 文件 (rm -f wwwwais*) 以消除攻击面。如业务仍需 WAIS 检索功能，请迁移至现代搜索引擎解决方案 (如 Elasticsearch、Apache Solr) 或使用维护中的 CGI 替代品，并在 Web 服务器层面配置访问控制限制 CGI 执行目录权限。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "wwwwais 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:54Z"

