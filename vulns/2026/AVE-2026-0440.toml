[basic]
description = "AWS Bedrock AgentCore Python SDK 的 install_packages() 方法中存在参数分隔符未正确中和的漏洞（CWE-88）。该 SDK 提供代码解释器功能用于在托管沙箱中安装 Python 包，但由于对包名参数输入验证不足，远程认证攻击者可通过构造特制的包名参数绕过过滤机制，在代码解释器沙箱环境中执行任意命令。该漏洞影响 bedrock-agentcore 1.18.1 之前的所有版本，CVSS 评分 8.4，危害等级高。AWS 已在 1.18.1 版本中修复此漏洞，建议用户升级至最新版本。"
published = "2026-07-23T21:17:03Z"
remediation = "立即将 bedrock-agentcore Python SDK 升级至 1.18.1 或更高版本（`pip install --upgrade bedrock-agentcore`）。如无法升级，禁止将不可信或模型生成的输入传递给 `install_packages()` 方法，并对所有动态包名按 PyPI 命名规则严格校验，限制 extras 组为逗号分隔的合法标识符。"
score = 8.4
severity = "HIGH"
sources = ["ghsa"]
title = "AWS Bedrock AgentCore Python SDK 参数分隔符注入漏洞"
updated = "2026-07-24T20:47:41Z"

