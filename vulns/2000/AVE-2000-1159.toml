[basic]
description = "Phorum 3.0.7 论坛软件的 code.php3 脚本存在路径遍历漏洞，远程攻击者可通过构造包含目录遍历序列的 HTTP 查询字符串，绕过文件访问限制，读取 phorum 安装目录下的任意文件（如配置文件、数据库连接文件等敏感数据）。该漏洞无需身份认证，攻击者仅需向目标服务器发送特制 HTTP 请求即可触发利用，且攻击复杂度极低。受影响版本为 Phorum 3.0.7，成功利用可导致服务器敏感信息泄露，进而为后续攻击提供有力支撑。"
published = "2000-12-31T05:00:00Z"
remediation = "建议立即升级 Phorum 至 3.0.8 或更高版本（官方已发布修复补丁），若无法升级则需在 code.php3 中添加路径遍历防护：使用 basename() 校验 query string 参数，结合 realpath() 限制文件读取范围至 phorum 目录内；同时在 Web 服务器层面配置 .htaccess 禁止直接访问 code.php3，并将敏感配置文件移至 Web 根目录之外作为纵深防御。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Phorum 论坛程序任意文件读取漏洞"
updated = "2026-06-16T21:53:25Z"

