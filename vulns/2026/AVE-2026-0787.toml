[basic]
description = "ZITADEL 开源身份管理平台存在不正确的授权漏洞（CWE-863），其用户自管理 API 路径（internal/command/user_v2_email.go、user_v2_phone.go 及 user_v2_human.go）在返回邮箱和手机验证码时缺少必要的权限检查。已认证的攻击者可通过调用自管理接口获取验证码，从而声明其并不实际控制的邮箱地址或手机号码的所有权，绕过基于邮箱或手机的安全策略。该漏洞影响 ZITADEL 2.43.0 至 2.71.19、3.0.0 至 3.4.10 及 4.0.0 至 4.15.0 版本，CVSS 评分 8.2，危害等级高。厂商已在 3.4.11 和 4.15.1 版本中修复。"
published = "2026-07-29T17:16:53Z"
remediation = "建议立即升级 ZITADEL 至 v4.15.1（4.x 分支）或 v3.4.11（3.x/2.x 分支），这两个版本已修复邮箱/电话自验证权限检查缺陷。如无法立即升级，可通过配置 action (v2) 拦截返回验证码的 API 请求作为临时缓解措施。"
score = 8.2
severity = "HIGH"
sources = ["ghsa"]
title = "ZITADEL ZITADEL 邮箱与电话自验证权限绕过漏洞"
updated = "2026-07-30T20:07:01Z"

