[basic]
description = "Snitz Forums 2000 3.3.03 及更早版本存在跨站脚本漏洞，攻击者可通过在 IMG 标签中嵌入恶意 JavaScript 代码，诱导其他论坛用户访问包含恶意图片的帖子，从而在受害者浏览器上下文中执行任意脚本代码。该漏洞影响 Snitz Forums 2000 3.0/3.1/3.3 等版本，CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），属于高危漏洞。远程未认证攻击者可利用此漏洞窃取用户会话、劫持账号或执行其他恶意操作。"
published = "2002-06-25T04:00:00Z"
remediation = "Snitz Forums 2000 已经停止维护，建议立即卸载并替换为现代社区论坛软件（如 vBulletin、XenForo 或 Discourse）。如无法立即迁移，可禁用所有用户上传图片功能并关闭图片预览脚本，以阻止利用 IMG 标签的 XSS 攻击。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Snitz Forums 2000 论坛 IMG标签 跨站脚本攻击漏洞"
updated = "2026-06-16T21:57:13Z"

