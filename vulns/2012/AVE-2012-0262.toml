[basic]
description = "Dnsmasq 2.63test1 之前版本在与特定 libvirt 配置配合使用时存在输入验证不当（CWE-20）导致的接口访问控制绕过漏洞，未能正确限制来自禁止网络接口的 DNS 查询请求。未经身份认证的远程攻击者可通过发送伪造的 DNS 查询包绕过接口访问控制，触发大量 DNS 响应流量放大，最终造成拒绝服务。该漏洞影响使用 dnsmasq 作为 DNS 转发器的虚拟化环境，攻击无需认证且复杂度低。"
published = "2013-03-05T21:38:54Z"
remediation = "建议升级 Dnsmasq 至 2.63test1 或更高版本以修复该漏洞。若暂时无法升级，可在 libvirt 配置中禁用 dnsmasq 的接口监听功能，或在防火墙层面限制 DNS 服务仅允许可信网段访问，防止欺骗查询放大攻击。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Thekelleys Dnsmasq 接口验证缺陷导致拒绝服务漏洞"
updated = "2026-06-16T23:43:10Z"

