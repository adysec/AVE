[basic]
description = "OpenBSD 2.x 版本及更早版本的 FTP 守护进程 ftpd 中的 glob() 函数存在缓冲区溢出漏洞。远程攻击者无需身份验证，即可通过向目标 FTP 服务器发送包含花括号（{}）序列的超长模式字符串，触发 g_opendir、g_lstat、g_stat 以及 glob2、glob3 等函数中 glob0 缓冲区的溢出，进而执行任意系统命令。该漏洞影响基于 BSD 的 FTP 服务器，攻击者可利用其获得目标系统的完全控制权。CVSS 评分为 10.0，危害等级为严重，OpenBSD 已在 2.8 版本中修复此问题。"
published = "2001-06-18T04:00:00.000"
remediation = "立即升级 OpenBSD 至 2.8 或更高版本以修复 ftpd glob() 缓冲区溢出漏洞。若暂时无法升级，可通过注释 inetd.conf 中 ftpd 行来禁用 FTP 服务，并在防火墙层面限制 21 端口入站访问作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "OpenBSD ftpd glob() 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:57.480"

