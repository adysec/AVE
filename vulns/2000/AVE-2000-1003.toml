[basic]
description = 'thttpd 2.19 及更早版本中的 ssi CGI 程序存在目录遍历漏洞。攻击者可通过向目标服务器发送包含 "%2e%2e"（即 URL 编码的 ".." 序列）的特殊构造 HTTP 请求，绕过路径限制，读取服务器上任意可读文件。该漏洞无需身份认证即可远程利用，可导致敏感信息泄露（如配置文件、密码文件等），CVSS 评分 7.5，危害等级高危。目前官方尚未发布针对此旧版本的安全更新，建议升级至不受影响的版本或禁用 ssi CGI 功能。'
published = "2000-12-19T05:00:00Z"
remediation = '升级 thttpd 至 2.20 或更高版本，该版本已修复 ssi CGI 程序中对 "%2e%2e" 序列的路径过滤缺陷。如无法升级，可禁用 ssi CGI 功能或配置 Web 服务器在请求到达前拦截包含 "%2e%2e" 的 URL 路径。'
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "thttpd ssi CGI 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:52:43Z"

