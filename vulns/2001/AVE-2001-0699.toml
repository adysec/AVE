[basic]
description = "Ipswitch IMail 7.04 及更早版本的 webmail 接口存在缓冲区溢出漏洞。该漏洞存在于 readmail.cgi 和 printmail.cgi 等 CGI 程序中，远程已认证用户可通过提交包含大量句点或其他特殊字符的邮箱名称触发缓冲区溢出，导致服务崩溃和拒绝服务。在特定条件下，该漏洞还可能被利用执行任意代码。受影响范围包括所有运行 Ipswitch IMail 7.04 及更早版本的服务器，攻击者只需通过网络向 webmail 接口发送构造好的特制请求即可利用此漏洞。"
published = "2001-10-12T04:00:00Z"
remediation = "建议立即升级 Ipswitch IMail 至 7.05 或更高版本以修复该缓冲区溢出漏洞。若暂时无法升级，可在 Web 服务器层面配置输入长度限制（如限制 mailbox 参数最大长度为 256 字符），并在防火墙层面阻断针对 readmail.cgi 和 printmail.cgi 的异常请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Ipswitch IMail Webmail 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:55:57Z"

