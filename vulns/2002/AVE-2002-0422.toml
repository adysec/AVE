[basic]
description = "Phorum 3.3.2a 存在远程命令执行漏洞，远程攻击者可通过向 plugin.php、admin.php 或 del.php 发送特制 HTTP 请求，修改 PHORUM[settings_dir] 变量指向包含恶意 PHP 文件的目录，从而在服务器上执行任意命令。该漏洞影响 Phorum 3.3.2a 及更早版本，攻击无需身份认证，危害严重。目前厂商已发布修复版本，建议升级至最新版。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 Phorum 至 3.3.2b 或更高版本以修复变量覆盖漏洞；如无法升级，删除或限制对 plugin.php、admin.php、del.php 的 Web 访问权限，并在 php.ini 中禁用 allow_url_include 和 register_globals。由于 Phorum 已停止维护，建议迁移至现代论坛系统。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Phorum 3.3.2a 远程命令执行漏洞"
updated = "2026-06-16T21:58:05Z"

