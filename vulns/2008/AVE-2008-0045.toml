[basic]
description = "Adobe Flash Player 9.0.124.0 及更早版本的设置管理器（Settings Manager）存在点击劫持漏洞。远程攻击者可构造恶意网页，将 Flash Player 的访问控制对话框伪装为正常图形元素覆盖在网页之上，诱导用户在不自知的情况下点击确认按钮，从而授权攻击者访问摄像头、麦克风等设备。该漏洞影响安装了受影响版本 Flash Player 的所有 Windows 系统用户，攻击者仅需诱使用户访问恶意网页即可实施攻击，无需身份认证。利用此漏洞，攻击者可在用户未察觉的情况下获取敏感权限，导致隐私泄露。"
published = "2008-10-09T18:00:01Z"
remediation = "立即将 Adobe Flash Player 升级至 10.0.12.36 或更高版本，该版本修复了 Settings Manager 的 clickjacking 漏洞。对于 Windows 用户，可通过浏览器自动更新或访问 Adobe 官方下载页面手动下载安装；对于 Linux 用户，建议通过系统包管理器升级 flash-plugin 软件包。如无法立即升级，可临时在浏览器中禁用或卸载 Flash Player 插件，或在防火墙层面阻止对恶意站点的访问作为缓解措施。鉴于 Flash Player 已于 2020 年底停止支持，建议彻底卸载该插件，并升级浏览器至最新版本以完全消除攻击面。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Adobe Flash Player 点击劫持漏洞"
updated = "2026-06-16T22:57:56Z"

