[basic]
description = "Google Chrome 17.0.963.65 之前版本中存在一处释放后重用（Use-After-Free）漏洞，该漏洞位于 WebKit 引擎处理 SVG 文档的过程中。当用户通过 Chrome 浏览器访问包含特制 SVG 内容的恶意网页时，远程攻击者可利用该漏洞触发已释放内存的非法访问，导致浏览器崩溃拒绝服务，甚至可能实现任意代码执行。攻击条件为用户只需使用受影响版本的 Chrome 浏览恶意构造的网页即可触发，CVSS 评分 6.8，危害等级中危。Google 已在 2012 年 3 月发布的 Chrome 17.0.963.65 版本中修复此漏洞。"
published = "2012-03-05T19:55:01Z"
remediation = "立即将 Google Chrome 升级至 17.0.963.65 或更高版本（可通过 chrome://settings/help 检查更新并自动升级）。使用 Chromium 的发行版（如 openSUSE、Gentoo）请更新系统软件包至包含该修复的版本。该漏洞亦影响 Apple Safari/iOS 中使用 WebKit 的组件，Safari 应升级至 6.0 及以上版本，iOS 升级至 6.0 及以上版本。确保启用 Chrome 自动更新功能，避免禁用浏览器自动升级。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome SVG文档释放后使用漏洞"
updated = "2026-06-16T23:32:28Z"

