[basic]
description = "NetWin DMailWeb 和 CWMail 2.6g 版本的 POP 服务器默认配置信任所有 POP 服务器，存在信任配置缺陷导致的拒绝服务漏洞。攻击者无需身份认证即可通过网络远程访问目标 POP 服务器，利用默认信任配置绕过正常身份验证机制，向服务器发送恶意请求导致服务拒绝，造成服务不可用。该漏洞影响 NetWin DMailWeb 和 CWMail 2.6g 版本的 POP 服务组件，攻击复杂度低，无需认证即可远程利用，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），主要影响系统可用性。NetWin 已在后续版本中修复该默认配置缺陷，建议用户升级至修复版本或修改默认信任配置限制可信 POP 服务器列表。"
published = "2000-06-23T04:00:00.000"
remediation = "建议立即升级 NetWin DMailWeb 和 CWMail 至 2.7 或更高版本，并在 POP 服务器配置中明确指定受信任的 POP 服务器地址列表，禁止默认信任所有 POP 服务器。如无法立即升级，可在防火墙层面限制 POP 服务端口（110/995）仅允许受信任 IP 访问，并配置 POP 服务器白名单作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "NetWin DMailWeb/CWMail POP Server 拒绝服务漏洞"
updated = "2026-06-16T21:52:06.450"

