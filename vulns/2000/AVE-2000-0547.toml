[basic]
description = "Solaris AnswerBook2 的 dwhttpd Web 服务器管理接口存在命令注入漏洞，由于未对用户输入中的 shell 元字符进行过滤，远程攻击者可通过向管理接口发送特制的 HTTP 请求注入任意系统命令，从而在目标服务器上以 dwhttpd 进程权限执行任意命令。该漏洞影响 Solaris AnswerBook2 所有版本，CVSS 评分 10.0，危害等级严重。攻击者无需身份认证即可远程利用，且已有公开的 ExploitDB 利用代码，建议受影响的系统立即升级或禁用该服务。"
published = "2000-10-20T04:00:00.000"
remediation = "立即安装 Sun 安全公告 #00196 提供的补丁：SPARC 平台安装补丁 110011-02，x86 平台安装补丁 110012-02，并将 AnswerBook2 升级至 v1.4.2 或更高版本。如无法立即打补丁，可在防火墙上限制对端口 8888 的访问，仅允许受信任的管理 IP 连接，并删除或限制 /cgi-bin/admin/admin 脚本的执行权限作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Sun Solaris AnswerBook2 远程命令执行漏洞"
updated = "2026-06-16T21:52:17.447"

