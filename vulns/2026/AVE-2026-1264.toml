[basic]
description = "Ghost CMS 会员登录端点存在信息泄露漏洞。由于会员登录接口的响应处理逻辑存在差异，未经身份认证的远程攻击者可通过向目标 Ghost 站点的会员登录端点提交特制请求，并分析响应差异来判断指定的邮箱地址是否已注册为该站点的正式成员。该漏洞影响 Ghost v5.18.0 至 v6.21.0 版本，CVSS 评分为 5.3（中危等级）。攻击者无需任何认证凭据即可在远程发起探测，通过枚举有效邮箱地址为后续定向钓鱼攻击和凭据填充攻击提供依据，严重威胁站点会员隐私安全。Ghost 官方已在 v6.21.1 版本中修复此问题。"
published = "2026-06-24T19:17:12.337"
remediation = "tags.<value>将 Ghost 升级至 v6.21.1 或更高版本以修复此漏洞。Docker 自托管用户应更新至官方 Docker Hub 上的最新 Ghost 镜像（≥6.21.1），并按照官方文档重新部署容器；Ghost-CLI 安装实例应执行 `ghost update` 命令更新至最新版本。如暂时无法升级，可暂时禁用会员魔法链接登录功能作为临时缓解措施，避免攻击者利用响应差异枚举注册会员邮箱地址。更新完成后建议重启 Ghost 服务并验证版本号。"
score = 5.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Ghost CMS 会员邮箱枚举漏洞"
updated = "2026-06-25T18:16:39.913"

