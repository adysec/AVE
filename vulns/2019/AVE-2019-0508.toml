[basic]
description = "Citrix StoreFront Server 存在 XML 外部实体注入（XXE）漏洞，由于服务器在处理 XML 输入时未正确限制外部实体的解析，未经身份认证的远程攻击者可通过向目标系统发送特制的 XML 请求触发该漏洞，导致敏感文件读取或内部网络探测。该漏洞影响 Citrix StoreFront Server 1903 之前版本、7.15 LTSR CU4 之前版本及 7.6 LTSR CU8 之前版本，CVSS 评分 7.5，危害等级高。Citrix 已发布安全更新修复此漏洞。"
published = "2019-08-29T19:15:13.227"
remediation = "升级 Citrix StoreFront Server 至 1903 版本，或 7.15 LTSR 升级至 CU4 (3.12.4000)，7.6 LTSR 升级至 CU8 (3.0.8000)。如无法立即升级，可在 StoreFront 服务器上配置 Web.config 禁用 DTD 解析，阻止 XML 外部实体注入攻击。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Citrix StoreFront Server XML外部实体注入漏洞"
updated = "2026-06-17T02:17:04.013"

