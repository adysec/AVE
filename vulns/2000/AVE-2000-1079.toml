[basic]
description = 'Microsoft SQL Server 2000 及 MSDE 中的 xp_proxiedmetadata 扩展存储过程函数在调用 srv_paraminfo API 时未正确限制缓冲区长度，存在缓冲区溢出漏洞。本地认证攻击者可通过向该函数传递特制参数触发缓冲区溢出，导致服务拒绝或执行任意命令，获取目标系统的控制权限。该漏洞被命名为"扩展存储过程参数解析"漏洞，影响 SQL Server 2000 及 MSDE 版本。'
published = "2001-01-09T05:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS00-092 提供的官方补丁。SQL Server 7.0 用户需升级至 Service Pack 3，SQL Server 2000 用户需升级至 Service Pack 1。如无法立即打补丁，应限制对 SQL Server 的登录权限，确保 SQL Server 服务以最低权限用户账户运行而非管理员账户，并禁用不必要的扩展存储过程（XP）以降低攻击面。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft SQL Server 2000 扩展存储过程参数解析缓冲区溢出漏洞"
updated = "2026-06-16T21:53:07Z"

