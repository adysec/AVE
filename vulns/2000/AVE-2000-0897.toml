[basic]
description = "HP OpenView Network Node Manager (NMM) 6.1 版本存在密码加密漏洞。该漏洞源于密码加密保护机制不足，攻击者在本地系统中无需身份认证即可利用，通过低复杂度操作获取或篡改网络节点管理器存储的密码敏感信息。成功利用可导致密码数据泄露或系统完整性受损。该漏洞影响部署 HP OpenView NMM 6.1 的系统环境。建议升级至受支持的软件版本，并实施严格的本地访问控制策略以缓解风险。"
published = "2000-10-20T04:00:00Z"
remediation = "建议将 HP OpenView Network Node Manager 6.1 升级至 6.2 或更高版本以修复密码加密漏洞（CVE-2000-0754）。如暂无法升级，应在操作系统层面通过访问控制列表限制仅有授权用户可访问 NNM 服务端口，或临时部署防火墙规则限制对 NNM 管理接口的本地及远程访问权限，并强制重置所有管理账户密码以降低信息泄露风险。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "HP OpenView Network Node Manager (NMM) 密码加密漏洞"
updated = "2026-06-16T21:52:24Z"

