[basic]
description = 'FaSTream FTP++ Server 2.0 存在信息泄露漏洞，未经身份认证的远程攻击者可通过 FTP 协议向目标服务器发送 "pwd" 命令获取服务器文件系统的真实路径名称。该漏洞利用条件简单、攻击门槛低，攻击者无需任何凭据即可在远程环境下执行命令并获取敏感目录结构信息，进而为后续渗透攻击提供路径情报支持。受影响版本为 FaSTream FTP++ Server 2.0 及以下版本，攻击者只需通过网络连接目标 FTP 服务并发送特制命令即可触发信息泄露，造成服务器目录结构暴露。'
published = "2001-06-02T04:00:00.000"
remediation = "立即升级 FaSTream FTP++ Server 到 Beta 10 Build 3 或更高版本以修复路径泄露漏洞。如厂商已停止维护且无法获取更新，建议彻底卸载该 FTP 服务组件并迁移至替代方案，如 FileZilla Server、Microsoft IIS FTP 或 vsftpd，同时确保 FTP 根目录配置正确并限制匿名用户仅能访问指定目录。作为临时缓解措施，可在防火墙层面限制外部访问 FTP 端口（默认 21），或通过 IP 访问控制列表仅允许可信源 IP 连接。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "FaSTream FTP++ Server 路径信息泄露漏洞"
updated = "2026-06-16T21:53:58.280"

