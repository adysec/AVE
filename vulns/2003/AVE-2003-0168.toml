[basic]
description = "Sendmail 8.12.9 中的 prescan 函数存在缓冲区溢出漏洞，具体触发点为 parseaddr.c 中的 parseaddr 函数在处理邮件地址时未对输入长度进行充分校验，导致向固定大小缓冲区写入超出其容量的数据。未经身份认证的远程攻击者可通过向目标 Sendmail 服务器发送特制邮件地址触发该漏洞，利用方式无需任何交互或前置条件。攻击者成功利用后可获得 Sendmail 进程的权限并在目标系统上执行任意代码，由于 Sendmail 通常以 root 权限运行，该漏洞可导致攻击者完全控制服务器。该漏洞影响几乎所有运行 Sendmail 8.12.9 的 Unix/Linux 系统，包括部分 Mac OS X Server 版本，CVSS v2 评分高达 10.0，危害等级为严重。Sendmail 官方已在 8.12.10 版本中修复此问题，各 Linux 发行版（包括 Red Hat、Debian、Mandrake 等）均发布了对应的安全补丁。"
published = "2003-10-06T04:00:00Z"
remediation = """建议立即升级 Sendmail 至 8.12.10 或更高版本，可从 ftp.sendmail.org 下载补丁包并重新编译安装。如无法立即升级，可在 sendmail.mc 配置文件中添加 "define(`confRUN_AS_USER',`sendmail')" 并启用 RunAsUser 选项，以非 root 权限运行 sendmail 进程，降低漏洞被利用后的权限影响。同时建议在防火墙层面临时限制 25 端口的陌生来源连接，阻止恶意邮件地址的远程利用尝试。"""
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "Sendmail prescan 函数缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T22:02:39Z"

