[basic]
description = "Telerik Reporting for ASP.NET WebForms 的 Report Viewer 控件（Telerik.ReportViewer.WebForms.dll）在 R1 2017 SP2（11.0.17.406）之前版本中存在反射型跨站脚本（XSS）漏洞。远程攻击者无需身份认证即可通过向 Telerik.ReportViewer.axd 处理程序传递特制的 bgColor 参数注入任意 web 脚本或 HTML 代码，当受害者浏览器解析该响应时恶意脚本将在其会话上下文中执行，导致敏感信息泄露或会话劫持。该漏洞影响所有使用受影响版本 Telerik Reporting 组件的 Web 应用程序。"
published = "2017-05-22T05:29:03Z"
remediation = "升级 Telerik Reporting 至 R1 2017 SP2（11.0.17.406）或更高版本，该版本已修复 bgColor 参数的输入验证缺陷。如无法立即升级，可在 Web 应用防火墙（WAF）上添加规则过滤 bgColor 参数中的 `<script>`、`<img>` 等 HTML 标签及 JavaScript 事件处理器，并对用户输入执行 HTML 编码转义。同时配置 Content-Security-Policy 响应头限制脚本执行来源作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Telerik Reporting Report Viewer 跨站脚本漏洞"
updated = "2026-06-17T01:27:33Z"

