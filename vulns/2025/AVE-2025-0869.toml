[basic]
description = "Microsoft Edge（Chromium 内核）存在类型混淆远程代码执行漏洞（CWE-843）。攻击者可通过构造特制的恶意网页，诱使用户在受影响版本的 Edge 浏览器中访问，触发 Chromium 渲染引擎在处理页面对象时的类型混淆错误，从而在沙箱环境下执行任意代码。该漏洞无需攻击者身份认证，但需要用户交互（点击链接或浏览恶意页面），CVSS 评分 8.8，影响机密性、完整性和可用性。Microsoft 已在 2025 年 2 月安全更新中发布 Edge 133.0.3065.51 版本修复此漏洞。"
published = "2025-02-06T23:15:09Z"
remediation = "立即将 Microsoft Edge 升级至 133.0.3065.51 或更高版本，可通过浏览器菜单「设置」→「关于 Microsoft Edge」自动检查并安装更新，或通过 Microsoft Update Catalog 下载离线安装包。企业环境可通过组策略配置自动更新策略，确保浏览器及时接收安全更新。作为临时缓解措施，可配置 Edge 的「增强安全模式」并限制用户访问不受信任的站点。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Edge（基于 Chromium）远程代码执行漏洞"
updated = "2026-06-17T08:43:17Z"

