[basic]
description = "Compaq Easy Access Keyboard 软件 1.3 版本存在权限提升漏洞。当系统屏幕被锁定后，该软件未能正确禁用自定义按钮的功能，导致本地攻击者可通过物理接触键盘并按下预设的自定义快捷键，绕过系统锁屏保护机制，从而在未授权情况下执行任意程序或获取更高系统权限。该漏洞攻击条件要求攻击者具有物理访问权限，影响运行该软件的 Compaq 计算机系统。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 Compaq Easy Access Keyboard 软件至修订版 1723 或更高版本，该补丁在锁定屏幕时正确禁用自定义按钮功能。如无法升级，可在系统登录后手动锁定工作站前关闭 Easy Access 键盘自定义按钮功能，或通过组策略禁用该软件的自动启动。对于企业环境，建议通过软件分发工具统一推送补丁。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Compaq Easy Access Keyboard 软件权限提升漏洞"
updated = "2026-06-16T21:52:49.727"

