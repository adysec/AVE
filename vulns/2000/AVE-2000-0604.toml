[basic]
description = "glibc 2.1.1 中的 unsetenv 函数在处理重复传入的环境变量时存在缺陷，未能正确取消设置环境变量。本地攻击者可通过在 setuid 程序中指定重复的危险环境变量（如 LD_PRELOAD 或 LD_LIBRARY_PATH），利用此漏洞执行任意命令，获取提升的权限。该漏洞影响使用 glibc 2.1.1 的 Linux 系统，攻击者需要本地访问权限，无需认证即可利用。"
published = "2000-11-14T05:00:00.000"
remediation = "升级 glibc 至 2.2 及以上版本（该漏洞在 glibc 2.2 中修复），或安装对应 Linux 发行版的安全补丁。对于 ProFTPd 用户，升级至 1.2.0 及以上版本。临时缓解措施：在系统层面禁用 setuid 程序的环境变量继承，或通过 pam_env 限制 LD_PRELOAD/LD_LIBRARY_PATH 等危险环境变量。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "ProFTPd 1.2 pre6 snprintf 远程代码执行漏洞"
updated = "2026-06-16T21:52:32.550"

