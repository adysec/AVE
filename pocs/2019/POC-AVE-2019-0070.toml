[info]
author = "AVE"
description = "检测WordPress Nevma Adaptive Images插件任意文件删除漏洞。通过向adaptive-images-script.php发送特制请求，验证是否存在未授权参数覆盖漏洞。"
id = "POC-AVE-2019-0070"
name = "CVE-2019-14206 PoC"
severity = "high"
tags = ["ave-2019-0070"]
vuln_id = [
    "CVE-2019-14206",
    "AVE-2019-0070",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/wp-content/plugins/adaptive-images/adaptive-images-script.php"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Adaptive Images"]
