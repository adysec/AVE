[basic]
description = "tags.<value>Spring Framework 5.0 prior to 5.0.5 and 4.3 prior to 4.3.15版本中，应用程序可配置Spring MVC从文件系统提供静态资源（如CSS、JS、图片）。在Windows环境下，当静态资源从文件系统而非类路径或ServletContext提供时，攻击者可通过发送构造特殊的URL触发目录穿越漏洞，读取服务器上的任意文件。该漏洞无需身份认证，网络可达，影响使用受影响版本的Spring MVC应用。修复方案为升级至Spring Framework 5.0.5或4.3.15及以上版本。"
published = "2018-04-06T13:29:00Z"
remediation = "升级 Spring Framework 至 5.0.5 或 4.3.15 及以上版本以彻底修复该漏洞。若暂时无法升级，应将静态资源配置在 classpath 下而非 Windows 文件系统路径，或通过修改 WebMvcConfigurer 配置禁止外部访问静态资源目录，并在防火墙层面限制对敏感路径的直接访问作为临时缓解措施。"
score = 5.9
severity = "MEDIUM"
sources = ["nuclei"]
title = "Spring Framework Spring MVC 目录穿越漏洞"
updated = "2026-06-17T01:50:53Z"

