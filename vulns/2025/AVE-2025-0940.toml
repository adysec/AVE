[basic]
description = "Linux 内核 md/md-bitmap 驱动存在同步机制缺陷，bitmap_get_stats() 函数未与位图生命周期正确同步，可在位图已被销毁或尚未完全初始化时被调用，导致对已释放或不存在的位图结构体进行解引用，触发内核通用保护错误（Oops）及内核崩溃。该漏洞影响 Linux 内核中使用软件 RAID（md 模块）的系统，攻击者需具备本地低权限访问权限，通过在特定时序下读取 /proc 文件系统触发竞争条件，可导致本地拒绝服务（内核 panic），在特定场景下或可进一步利用实现本地权限提升。CVSS 评分为 7.8，危害等级高。"
published = "2025-02-27T02:15:14Z"
remediation = "升级 Linux 内核至包含 commit ec6bb299c7c3 修复的稳定版本：Debian 12 用户应执行 apt update && apt install linux-image-6.1.90-1，Ubuntu 22.04 LTS / 24.04 LTS 用户应安装 USN-7703-1 安全更新。如无法立即升级，可通过 chmod 600 /proc/mdstat 限制非特权用户读取 md 位图统计信息，或使用 sysctl 禁用 md 序列接口作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 md-bitmap 本地权限提升漏洞"
updated = "2026-07-30T06:20:26Z"

