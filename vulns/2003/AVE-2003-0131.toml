[basic]
description = "OpenSSH 3.7.1及更早版本存在内存安全漏洞，未经身份认证的远程攻击者可通过向SSH服务发送特制网络数据包触发内存错误，可能导致敏感信息泄露、服务中断或任意代码执行。该漏洞影响运行受影响版本OpenSSH的Unix/Linux服务器及网络设备，攻击者无需有效账户凭据即可在低复杂度条件下发起远程利用，对系统机密性、完整性和可用性造成部分影响。"
published = "2003-10-06T04:00:00Z"
remediation = "建议将 OpenSSH 升级至 3.7.2 或更高版本，可前往 https://www.openssh.com/ 下载最新稳定版并重新编译安装。如无法立即升级，可在防火墙上限制 22/tcp 端口的入站访问，仅允许可信来源 IP 连接，并在 sshd_config 中设置 Protocol 2 以禁用不安全的 SSHv1 作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "OpenSSH 远程内存安全漏洞"
updated = "2026-06-16T22:02:38Z"

