[basic]
description = "WebKit 作为 Apple iTunes 10.7 及之前版本的内置网页渲染引擎，存在内存破坏漏洞。未经身份认证的远程攻击者可构造包含恶意代码的特制网页，诱导用户在 iTunes 中打开该网页时触发内存错误，进而导致应用程序崩溃或远程执行任意代码，实现对用户系统的完全控制并窃取敏感数据。该漏洞攻击条件简单，仅需用户访问恶意站点即可完成利用，影响范围覆盖所有未升级至 iTunes 10.7 的终端用户。Apple 已通过安全更新修复该问题。"
published = "2012-09-13T10:30:19Z"
remediation = "立即将 Apple iTunes 升级至 10.7 或更高版本。Windows 系统可通过 iTunes「帮助」→「检查更新」或前往 Apple 官网下载安装；Mac 系统通过 Mac App Store 或「系统偏好设置」→「软件更新」获取更新。如暂无法升级，应临时避免使用 iTunes 打开未知网页链接，并通过防火墙限制 iTunes 访问不可信站点以降低风险。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:38Z"

