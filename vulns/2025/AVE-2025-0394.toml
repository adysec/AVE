[basic]
description = "Google Chrome（Chromium）扩展程序存在不当实现漏洞（CWE-451），远程攻击者可通过构造恶意的Chrome扩展程序，并诱导用户执行特定的UI交互手势（如点击或拖拽），从而实施UI欺骗攻击。该漏洞影响Chrome 132.0.6834.83之前的所有版本，攻击成功后可导致用户界面元素被伪造，使用户误信恶意内容为合法界面。此漏洞无需身份认证，但需要用户交互，CVSS评分4.3，危害等级中危。Google已在Chrome 132.0.6834.83版本中修复此漏洞。"
published = "2025-01-15T11:15:10Z"
remediation = "立即将 Google Chrome 升级至 132.0.6834.83 或更高版本，该版本已修复 Extensions 组件中 UI 欺骗漏洞。可通过 Chrome 菜单 > 帮助 > 关于 Google Chrome 自动检查并安装更新，或从 google.com/chrome 下载最新版手动安装。企业用户可通过组策略将浏览器强制更新至修复版本。作为临时缓解措施，可禁用不可信来源的 Chrome 扩展程序，仅允许从 Chrome 网上应用店安装扩展。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome Extensions 界面伪造漏洞"
updated = "2026-06-17T08:26:29Z"

