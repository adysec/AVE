[basic]
description = "Conectiva Linux 中 OpenLDAP 1.2.11 之前版本的 logrotate 脚本存在信号处理缺陷，该脚本向内核日志守护进程（klogd）发送了错误的信号，导致 klogd 进程被意外终止。攻击者无需认证即可远程触发该漏洞，造成系统日志记录功能失效，影响系统审计与故障排查。由于 CVSS 评分高达 10.0，攻击复杂度低且无需权限，危害严重。"
published = "2000-10-20T04:00:00.000"
remediation = "立即将 OpenLDAP 升级至 1.2.11 或更高版本。检查 logrotate 配置文件中 OpenLDAP 的 postrotate 脚本，确保发送给 klogd 的信号正确（应使用 SIGHUP 而非 SIGTERM 或其他信号）。如无法立即升级，可手动编辑 /etc/logrotate.d/openldap，移除或注释掉 postrotate 中向 klogd 发送信号的命令，改为手动重启 syslog 服务作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Conectiva Linux OpenLDAP logrotate 脚本拒绝服务漏洞"
updated = "2026-06-16T21:52:23.810"

