[info]
author = "AVE"
description = "验证目标是否可通过 HTML 页面触发 Windows Media Player 7.0 加载恶意 .wmd/.wmz 皮肤文件，导致任意脚本执行。攻击者构造包含恶意 JavaScript 的 .wmz 皮肤文件，通过 iframe 或 window.open 嵌入 HTML 页面，用户访问后自动下载并执行 ActiveX 脚本。"
id = "POC-AVE-2000-0802"
name = "Microsoft Windows Media Player 7.0 .wms Arbitrary Script Execution PoC"
severity = "medium"
tags = [
    "cve-2000-1112",
    "windows-media-player",
    "arbitrary-script",
    "ms00-090",
]
vuln_id = [
    "CVE-2000-1112",
    "AVE-2000-0802",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/test.wmd"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = [
    "application/x-zip-compressed",
    "application/zip",
]
