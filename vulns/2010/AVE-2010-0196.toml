[basic]
description = "RealNetworks RealPlayer 11.0 至 11.1 及 RealPlayer SP 1.0 至 1.1.4（Windows 版）的 ParseKnownType 函数中存在多处整数溢出漏洞。远程攻击者可通过向目标用户发送特制的 FLV 文件，其中包含精心构造的 HX_FLV_META_AMF_TYPE_MIXEDARRAY 或 HX_FLV_META_AMF_TYPE_ARRAY 数据，在解析时触发整数溢出，最终导致任意代码执行。攻击者无需身份认证，但需诱导用户打开恶意文件。该漏洞 CVSS 评分 9.3，危害严重，影响范围广泛。"
published = "2010-08-30T20:00:02Z"
remediation = "立即升级 RealPlayer SP 至 12.0.0.879 或更高版本，该版本修复了 FLV 文件解析中的整数溢出漏洞。官方安全公告及下载地址：http://service.real.com/realplayer/security/08262010_player/en/。如无法立即升级，建议禁用浏览器中的 RealPlayer ActiveX 控件，或限制用户对不可信 FLV 文件的访问作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer FLV 解析整数溢出远程代码执行漏洞"
updated = "2026-06-16T23:21:56Z"

