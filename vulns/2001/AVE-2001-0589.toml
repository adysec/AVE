[basic]
description = "Cisco CBOS 2.4.1 及更早版本路由器中的 Web 管理接口存在登录日志缺失漏洞。由于系统未对无效登录尝试进行记录，远程攻击者可在不被察觉的情况下对管理接口实施暴力密码猜测攻击，成功后可获取设备管理权限，进而窃取敏感信息、篡改配置或中断服务。攻击无需认证，仅需网络可达即可利用，危害较大。"
published = "2001-02-16T05:00:00.000"
remediation = "升级 Cisco CBOS 至 2.4.2 或更高版本，该版本已修复 Web 管理接口未记录登录失败的问题。如无法立即升级，可在路由器上配置访问控制列表（ACL），限制仅允许可信 IP 访问 Web 管理端口，或直接禁用远程 Web 管理功能以降低攻击面。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Cisco CBOS Web管理接口密码猜测漏洞"
updated = "2026-06-16T21:53:34.370"

