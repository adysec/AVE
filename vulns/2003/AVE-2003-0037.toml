[basic]
description = "Ximian Evolution 邮件用户代理 1.2.2 及更早版本的 mail-format.c 文件中，try_uudecoding 函数在处理恶意 uuencode（UUE）编码头部时存在堆缓冲区溢出漏洞。远程攻击者可向目标用户发送特制邮件，触发该函数对畸形 UUE 头部进行解码操作，导致堆内存越界写入，造成邮件客户端崩溃（拒绝服务），甚至可能利用该漏洞执行任意代码。攻击无需身份认证，仅需诱导用户预览或打开恶意邮件即可触发。"
published = "2003-03-24T05:00:00Z"
remediation = "升级 Ximian Evolution 至 1.2.3 或更高版本。Red Hat Linux 用户安装 RHSA-2003:108 提供的更新包；Gentoo 用户执行 emerge sync 后升级至 >=1.2.3-r1；Mandriva 用户安装 MDKSA-2003:045 更新。如无法立即升级，可在邮件客户端中禁用自动解码 uuencode 附件功能作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Ximian Evolution 邮件客户端 UUEncoding 堆缓冲区溢出漏洞"
updated = "2026-06-16T22:01:35Z"

