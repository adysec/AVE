[basic]
description = "Microsoft Visual Studio 存在堆缓冲区溢出漏洞（CWE-122），攻击者可通过构造特制的项目文件或代码片段，诱导用户使用 Visual Studio 打开后触发该漏洞。成功利用此漏洞的攻击者可获得与当前用户相同的权限，在目标系统上执行任意代码，实现完全控制受影响的系统（机密性、完整性、可用性均受高影响）。该漏洞影响 Visual Studio 2015 Update 3、2017、2019 及 2022 多个版本系列，CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中发布补丁修复此漏洞。"
published = "2025-01-14T18:15:30Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新，将 Visual Studio 升级至以下修复版本：Visual Studio 2015 Update 3 升级到 14.0.24252.2 及以上；Visual Studio 2017 (15.9) 升级到 15.9.69 及以上；Visual Studio 2019 (16.11) 升级到 16.11.43 及以上；Visual Studio 2022 (17.6) 升级到 17.6.22 及以上；Visual Studio 2022 (17.8) 升级到 17.8.17 及以上；Visual Studio 2022 (17.10) 升级到 17.10.10 及以上；Visual Studio 2022 (17.12) 升级到 17.12.4 及以上。可通过 Visual Studio 内置检查更新功能或访问 https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-21178 获取补丁。临时缓解措施包括限制用户打开来自不可信来源的解决方案文件，并启用 Windows Defender Exploit Guard 缓解堆缓冲区溢出攻击。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Visual Studio 远程代码执行漏洞"
updated = "2026-06-17T08:42:42Z"

