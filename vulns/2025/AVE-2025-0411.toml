[basic]
description = "GNU GRUB2 的 read 命令存在整数溢出漏洞。read 命令用于从键盘读取用户输入，其内部使用 32 位整数存储输入长度，当输入超长字符串时该整数可发生溢出，导致堆缓冲区越界写入。攻击者需具备物理访问权限和高权限账户，并诱导用户输入特制超长字符串，成功利用后可破坏 GRUB 内部关键数据，进而可能绕过 Secure Boot 安全启动机制。该漏洞影响所有使用 GRUB2 的 Linux 发行版，CVSS 评分 6.1，危害等级中危。"
published = "2025-02-24T08:15:09Z"
remediation = "升级 GRUB2 至 2.12 以上版本，或应用上游补丁（commit dad8f502974e）。RHEL 9 用户安装 grub2-1:2.06-104.el9_6 及以上版本（RHSA-2025:6990）。Debian/Ubuntu 用户更新至 grub2-common 2.12-1 以上。无法立即更新时，限制物理接触引导菜单的用户权限以降低利用风险。"
score = 6.1
severity = "MEDIUM"
sources = ["msrc"]
title = "GNU GRUB2 read命令整数溢出导致堆越界写入漏洞"
updated = "2026-06-30T00:16:50Z"

