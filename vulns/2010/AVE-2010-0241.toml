[basic]
description = "Apple QuickTime 7.x版本存在输入验证漏洞，处理JP2、FlashPix和GIF图像等文件时可能访问未初始化的内存区域，导致内存损坏。该漏洞影响Windows和macOS系统，攻击者可通过精心 crafted 的图片文件触发漏洞，实现远程代码执行或导致应用程序崩溃。攻击者无需身份验证即可利用此漏洞，严重威胁软件安全性。该漏洞最初披露于2010年，对广大使用QuickTime的用户构成安全风险。"
published = "2010-11-16T22:00:16Z"
remediation = "升级 Apple QuickTime 至 7.6.9 或更高版本，同时将 Mac OS X 升级至 10.6.5 或更高版本（对应安全更新 2010-007）。在完成升级前，避免在浏览器中打开来源不明的 JP2 图片文件，并禁用 QuickTime 浏览器插件作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple QuickTime 7.x JP2图片处理未初始化访问漏洞"
updated = "2026-06-16T23:23:32Z"

