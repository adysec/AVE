[basic]
description = "这是一个影响 Netfortris Trixbox 2.8 及以下版本的路径遍历漏洞。攻击者通过发送特制参数利用该漏洞访问目标系统上的敏感文件。具体来说，攻击者可以通过向 `/maint/index.php?packages` 发送包含 `xajaxargs` 参数的请求，或向 `/maint/modules/home/index.php` 发送包含 `lang` 参数的请求，绕过权限验证访问操作系统文件。该漏洞需要攻击者拥有低权限且可远程发起攻击，但却可能导致敏感信息泄露。其 CVSS 评分 6.5，中等严重程度，CWE 编号为 22。微软及其合作伙伴已发布安全补丁修复了此漏洞，建议用户及时更新到安全版本。"
published = "2018-02-16T04:29:00Z"
remediation = "立即将 Trixbox 升级至官方发布的最新可用版本（高于 2.8.0.4），该版本修复了路径遍历漏洞。如暂无法立即升级，可临时修改 /maint/index.php 和 /maint/modules/home/index.php 中对 xajaxargs 和 lang 参数的输入验证逻辑，增加路径规范化检查并过滤包含 ../ 或 ..%2f 等遍历序列的请求；同时关闭 PHP 的 allow_url_fopen 和 display_errors 配置项，并通过 Web 应用防火墙限制对 /maint/ 目录的恶意访问，防止攻击者利用该漏洞读取服务器敏感文件。"
score = 6.5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Netfortris Trixbox 2.8 目录遍历漏洞"
updated = "2026-06-17T01:06:20Z"

