[basic]
description = "Microstrategy Web 10.4版本存在敏感信息泄漏漏洞，攻击者可通过访问/MicroStrategyWS/happyaxis.jsp路径获取JVM配置、CPU架构、安装文件夹等服务器环境信息。未经身份认证的远程攻击者无需任何凭据，仅需目标系统网络可达即可构造访问请求获取敏感环境信息，用于进一步渗透攻击。该漏洞影响所有Microstrategy Web 10.4版本部署实例，攻击者利用此信息泄漏可深入了解应用程序运行环境，为后续漏洞利用和横向移动提供情报支持。官方已在11.0及更高版本中修复此问题。"
published = "2020-04-02T15:15:17Z"
remediation = "升级 MicroStrategy Web 至 11.0 或更高版本，该版本已移除 /MicroStrategyWS/happyaxis.jsp 页面或修复了信息泄露问题。如无法立即升级，可通过 Web 服务器（如 IIS 或 Apache）的访问控制规则或防火墙拦截对 /MicroStrategyWS/happyaxis.jsp 的访问请求，作为临时缓解措施。同时联系 MicroStrategy 支持团队获取 10.4 版本的补丁。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Microstrategy Web 信息泄漏漏洞"
updated = "2026-06-17T02:50:12Z"

