[basic]
description = "tags containing the formatted description.<value>Netscape Enterprise Server 3.x 的 Web Publishing 功能在处理 REVLOG 命令时存在输入验证缺陷。未经身份认证的远程攻击者可通过向目标服务器发送特制的 REVLOG 命令触发该漏洞，导致服务器进程异常终止或资源耗尽，从而引发拒绝服务。该漏洞影响运行 Netscape Enterprise Server 3.0 及 3.x 版本的 Web 服务器，攻击者无需任何凭据即可在网络上发起攻击，利用门槛极低。攻击成功后将使合法用户无法正常访问 Web Publishing 相关的服务功能。Netscape 后续版本已修复此问题，建议将服务器升级至受支持的版本。"
published = "2001-06-02T04:00:00Z"
remediation = "建议立即升级到 Netscape Enterprise Server 3.6 或更高版本，该版本已修复 Web Publishing 功能中 REVLOG 命令的输入验证缺陷。如暂时无法升级，可通过管理控制台禁用 Web Publishing 功能作为临时缓解措施。由于该产品已停止官方支持，建议迁移至现代受支持 Web 服务器（如 Apache、Nginx 或 Sun ONE Web Server）以消除长期安全风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Netscape Enterprise Server Web Publishing 拒绝服务漏洞"
updated = "2026-06-16T21:53:57Z"

