[basic]
description = "Adobe Flash Player 9.0.124.0 及更早版本中的 ActionScript 在处理 FileReference 类的文件上传和下载 API 时，未强制要求用户交互即可触发 browse 和 download 操作。未经身份认证的远程攻击者可通过诱骗用户访问包含恶意 SWF 文件的网页，绕过正常的安全提示机制直接创建文件浏览对话框，进而可能导致未授权文件上传或下载，造成敏感信息泄露或恶意代码执行。该漏洞影响广泛部署的 Flash Player 版本，CVSS 评分 10.0，危害等级严重。"
published = "2008-10-17T19:31:15Z"
remediation = "升级 Adobe Flash Player 至 10.0.12.36 或更高版本。Windows 用户可通过 Adobe 官网下载页面手动安装，或启用浏览器自动更新获取补丁；Linux 用户可通过系统包管理器（如 yum、apt、emerge）更新 flash-plugin 至最新版本。对于无法立即升级的环境，应在浏览器中禁用或卸载 Flash Player 插件，并在网络边界部署 WAF/代理规则拦截外部 SWF 文件下载，直至完成补丁部署。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 文件上传下载访问控制漏洞"
updated = "2026-06-16T22:57:44Z"

