[basic]
description = "微软 FrontPage 2000 Server Extensions 1.1 版本中 shtml.exe 组件包含路径泄露漏洞。攻击者无需身份验证即可通过向服务器发送包含标准 DOS 设备名的无效 URL 请求，诱使服务器返回物理路径信息。该漏洞影响 Windows 及相关服务器系统，可能导致敏感信息泄露，为攻击者进一步实施攻击提供情报支持。漏洞 CVSS 评分 5.0，威胁等级中低，Microsoft 已于 2000 年 10 月发布安全更新修复此漏洞。"
published = "2000-10-20T04:00:00Z"
remediation = "Microsoft FrontPage Server Extensions 1.1 已过时，建议立即升级到 Windows Server 2003 或更高版本（已包含Modern化的FrontPage服务替换功能），并删除已安装的FrontPage Server Extensions组件。如无法立即升级，可通过在IIS中禁用.shtml扩展名并移除shtml.exe文件作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft FrontPage Server Extensions shtml.exe 物理路径信息泄漏漏洞"
updated = "2026-06-16T21:52:19Z"

