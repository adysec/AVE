[basic]
description = "Apple QuickTime 7.7.1 之前版本在处理电影文件中的 TKHD（Track Header）原子时存在内存破坏漏洞。未经身份验证的远程攻击者可构造包含恶意 TKHD 原子的特制 QuickTime 电影文件，当用户在 Windows 系统上使用受影响版本的 QuickTime 打开该文件时，攻击者可成功利用此漏洞执行任意代码或导致应用程序崩溃拒绝服务。该漏洞影响所有运行 Windows 平台 QuickTime 7.7.1 之前版本的用户。"
published = "2011-10-28T02:49:53Z"
remediation = "立即升级 Apple QuickTime 至 7.7.1 或更高版本。由于 Apple 已于 2016 年停止支持 Windows 版 QuickTime，建议在 Windows 系统上彻底卸载该软件。临时缓解措施包括：在浏览器中禁用 QuickTime 浏览器插件，不要打开来源不明的 .mov 影片文件，并通过组策略或防火墙限制 QuickTime 进程对 untrusted 目录的访问。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime 远程代码执行漏洞"
updated = "2026-06-16T23:32:58Z"

