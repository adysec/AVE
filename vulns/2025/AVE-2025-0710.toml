[basic]
description = "tags.<value>CVE-2025-21251 是 Microsoft 消息队列（MSMQ）组件中存在的高危拒绝服务漏洞。该漏洞源于 MSMQ 服务在处理特制消息时对资源控制不当（CWE-400），导致资源消耗失控。攻击者无需任何身份认证，仅需通过网络向目标 MSMQ 服务发送精心构造的消息即可触发，且攻击复杂度低、无需用户交互，可使 MSMQ 服务崩溃或停止响应，造成拒绝服务，严重影响系统可用性，但不影响机密性与完整性。该漏洞影响 Windows 10/11 及 Windows Server 2019/2022 等多个版本，Microsoft 已通过安全更新 5050061 修复。"
published = "2025-01-14T18:15:42Z"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft 消息队列 (MSMQ) 拒绝服务漏洞"
updated = "2026-06-17T08:42:54Z"

