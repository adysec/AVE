[basic]
description = "Linux内核net/mlx5子系统中存在使用后释放（Use-After-Free）漏洞。当固件在匹配器断开流程中发生错误时，错误处理流程会尝试重新连接匹配器并返回错误，导致调用函数继续执行并最终释放正在断开连接的匹配器。这使得匹配器列表中保留已释放的匹配器，进而触发使用后释放错误并导致系统崩溃。攻击者需具备本地访问权限，利用该漏洞可导致内核崩溃（DoS），部分场景下可能实现权限提升。该漏洞影响使用mlx5网卡驱动的Linux内核版本。"
published = "2025-02-27T03:15:15.760"
remediation = "立即升级 Linux 内核至已修复版本：Debian bullseye 用户升级至 linux 5.10.262-1 或更高；Debian bookworm 用户升级至 linux 6.1.180-1 或更高；Debian trixie 用户升级至 linux 6.12.100-1 或更高；Debian forky/sid 用户升级至 linux 7.1.6-1 或更高。Ubuntu 22.04 及 24.04 用户确认内核版本已高于 6.8（不受影响）。若无法立即升级且系统未使用 Mellanox ConnectX 网卡，可在内核启动参数中添加 `mlx5_core.disable=1` 临时禁用 mlx5 驱动以规避崩溃风险。修复内核版本中包含提交 1ce840c7a659aa53a31ef49f0271b4fd0dc10296，该提交禁止在固件命令失败时重新连接匹配器，从而避免使用已释放的匹配器导致 use-after-free 和系统崩溃。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux Kernel mlx5 驱动 HWS 匹配器断开使用后释放漏洞"
updated = "2026-06-17T08:44:11.290"

