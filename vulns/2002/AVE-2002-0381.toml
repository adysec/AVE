[basic]
description = "Apple Mac OS X 10.1.x 系统的 SoftwareUpdate 组件在下载软件更新时未对更新服务器进行身份认证，远程攻击者可通过 DNS 欺骗或缓存投毒等技术伪装成 Apple 更新服务器，向目标系统分发特制的木马更新包，从而在目标系统上以系统权限执行任意代码。该漏洞影响 Mac OS X 10.1.x 系列版本，CVSS 评分 7.5，危害等级高，攻击者无需身份认证即可远程利用。"
published = "2002-07-11T04:00:00Z"
remediation = "升级至 Mac OS X 10.2 (Jaguar) 或更高版本，该版本中 SoftwareUpdate 已引入数字签名验证机制，可防止篡改更新包。如无法升级，可在网络层面配置 DNSSEC 防止 DNS 缓存投毒，并在防火墙上限制出站连接仅允许访问 Apple 官方更新服务器 (swscan.apple.com)。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Apple Mac OS X SoftwareUpdate 任意软件包安装漏洞"
updated = "2026-06-16T21:57:55Z"

