[basic]
description = "PublicCMS 的 getXml 方法存在服务端请求伪造（SSRF）漏洞，由于在允许访问功能前未进行充分授权验证，未经身份认证的远程攻击者可通过构造恶意请求利用该漏洞，使服务器向外部发起请求并泄露敏感信息。该漏洞影响 PublicCMS 产品，攻击者无需任何凭据即可在远程条件下触发，导致应用程序上下文中的信息泄露。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
