[basic]
description = "Unix 系统 locale 子系统中的部分函数（如 gettext 和 catopen）未能正确过滤用户注入的格式化字符串，导致存在格式化字符串漏洞。本地攻击者可通过向受影响函数传递特制的格式化字符串参数，利用该漏洞执行任意命令，实现本地权限提升。该漏洞影响使用 GLIBC 的 Unix/Linux 系统，CVSS 评分 10.0，危害等级严重。攻击者需具备本地访问权限，无需身份认证即可触发，成功利用后可完全控制目标系统。"
published = "2000-11-14T05:00:00.000"
remediation = "升级 glibc 至 2.2 及以上版本，该版本修复了 locale 子系统中 gettext 和 catopen 等函数的格式化字符串注入漏洞。如无法升级，可移除受影响系统上不可信用户对 locale 环境变量的设置权限，并限制本地用户执行 setuid 二进制文件。对于关键系统，建议禁用不必要的 setuid 程序并启用 SELinux 或 AppArmor 作为纵深防御。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "GNU glibc 区域设置子系统格式化字符串漏洞"
updated = "2026-06-16T21:52:35.100"

