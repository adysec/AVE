[basic]
description = "Stalker CommuniGate Pro 3.2.5 及更早版本的 Web 管理界面存在目录遍历漏洞，远程攻击者通过在 URL 中注入 ../ 序列可绕过路径限制，读取服务器上的任意文件。该漏洞无需身份认证即可利用，攻击者可通过 HTTP 请求访问 /../../etc/passwd 等路径获取敏感信息，可能导致系统配置泄露或进一步攻击。CVSS 评分 5.0，危害等级中危。目前已有公开的 ExploitDB 利用代码（ID: 20091）。"
published = "2000-04-03T04:00:00Z"
remediation = "升级 CommuniGate Pro 至 3.2.6 或更高版本，该版本修复了 Web 管理接口的路径遍历漏洞。如无法立即升级，在防火墙层面限制对 TCP 8010 端口的访问，仅允许受信任的管理 IP 连接；同时避免以 root 身份运行 CommuniGate Pro 服务，降低文件被读取后的影响范围。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Stalker CommuniGate Pro 任意文件读取漏洞"
updated = "2026-06-16T21:52:09Z"

