[basic]
description = "Adobe Flash Player 存在访问限制绕过漏洞（CWE-200），攻击者可通过诱导用户访问特制网页等方式，利用未指定的向量绕过 Flash Player 的安全访问控制机制，从而获取本不应被访问的敏感信息。该漏洞影响 Windows、Mac OS X、Linux 及 Android 等多个平台的 Flash Player 版本（10.3.183.20 之前及 11.x 系列）以及 Adobe AIR 3.3.0.3610 之前版本，攻击者无需身份认证即可远程利用，但需要用户交互配合。Adobe 已在安全公告 APSB12-14 中发布修复版本。"
published = "2012-06-09T00:55:01.157"
remediation = "升级 Adobe Flash Player 至 10.3.183.20 或 11.3.300.257（Windows/Mac）、11.2.202.236（Linux）、11.1.111.10（Android 2.x/3.x）、11.1.115.9（Android 4.x），升级 Adobe AIR 至 3.3.0.3610。如无法升级，在浏览器中禁用 Flash 插件或启用 click-to-play 机制。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Adobe Flash Player 访问限制绕过漏洞"
updated = "2026-06-16T23:40:50.620"

