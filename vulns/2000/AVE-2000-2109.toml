[basic]
description = "Gaim 即时通讯软件在 OSCAR 协议解析中存在缓冲区溢出漏洞。攻击者可通过向目标发送超长 HTML 标签滥用缓冲区，在无需认证的情况下触发崩溃或执行任意代码。该漏洞影响 Windows/Linux 平台下的 Gaim 0.10.3 及更早版本，CVSS 评分 10.0，危害等级极高。攻击者无需任何用户交互即可远程利用，完全控制受害主机，破坏系统完整性与安全性。漏洞源于 Gaim 对 OSCAR 协议数据的解析不足，对合法认证用户构成严重威胁。威胁影响范围广泛，因为 Gaim 曾广泛用于企业和个人通信，大量用户暴露在攻击风险之下。漏洞利用方式极其简单：只需构造恶意 HTML 包并发送到目标端口，即可触发溢出，达到目的攻击效果。微软、Canonical 等厂商已发布补丁修复此漏洞，建议用户立即升级到最新版本。"
published = "2001-01-09T05:00:00Z"
remediation = "立即升级 Gaim 至 0.10.4 或更高版本（后改名为 Pidgin，建议升级至最新版 Pidgin 2.14.12+），或切换至其他不使用 OSCAR 协议的即时通讯客户端。若无法立即升级，建议在防火墙层面阻断 OSCAR 协议端口（默认 TCP 5190）作为临时缓解措施。建议从官方站点 pidgin.im 下载最新版本替换旧版本。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Gaim Gaim 0.10.3 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:18Z"

