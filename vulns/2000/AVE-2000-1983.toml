[basic]
description = "SuSE Linux 6.2 及部分其他 Linux 发行版中 ypbind-mt 存在格式化字符串漏洞。ypbind-mt 是 NIS（网络信息服务）客户端守护进程，在处理用户输入时未对格式化字符串参数进行正确过滤，远程攻击者无需身份认证即可向目标服务发送特制的格式化字符串载荷，触发内存读写操作，最终以 root 权限执行任意代码，导致目标系统完全失陷。CVSS 评分 10.0，危害等级严重。"
published = "2000-12-11T05:00:00.000"
remediation = "立即安装 SuSE 安全公告 SuSE-SA:2000:042 中发布的 ypbind-mt 补丁包，升级 ypbind-mt 至修复版本。如无法立即打补丁，可临时禁用 ypbind-mt 服务（`killall ypbind-mt`）并改用标准 ypbind 替代，同时在防火墙上限制对 NIS 相关端口（TCP/UDP 111、834-846）的访问作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "SuSE Linux ypbind-mt 格式化字符串漏洞"
updated = "2026-06-16T21:53:02.340"

