[basic]
description = "Apple Safari 6.0 之前版本所采用的 WebKit 渲染引擎存在内存破坏漏洞。远程攻击者可通过构造恶意网站，当用户使用受影响版本的 Safari 浏览器访问该网站时，触发 WebKit 中的内存损坏，进而导致应用程序崩溃或远程执行任意代码。该漏洞影响所有运行 Safari 6.0 以下版本的 macOS 和 iOS 系统，攻击者无需任何身份验证即可利用，仅需诱使用户打开恶意链接即可完成攻击。Apple 已在 Safari 6.0 安全更新中修复此漏洞。"
published = "2012-07-25T20:55:02Z"
remediation = "将 Apple Safari 升级至 6.0 或更高版本。对于 OS X Lion 系统，需安装 OS X Lion v10.7.4 或更高版本以获取 Safari 6.0。如无法立即升级，建议暂时避免访问不可信网站，并在 Safari 偏好设置中禁用 JavaScript 执行作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:32Z"

