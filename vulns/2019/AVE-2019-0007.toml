[basic]
description = "Microsoft SharePoint 存在远程代码执行漏洞，由于软件未能正确验证应用程序包的源标记，导致对用户提供的输入进行不安全的反序列化处理。未经身份认证的远程攻击者可通过向目标 SharePoint 服务器发送特制的恶意应用程序包触发该漏洞，成功利用可在目标系统上以 SharePoint 应用程序池权限执行任意代码。该漏洞影响 Microsoft SharePoint 2010/2013/2016/2019 等多个版本，CVSS 评分 9.8，危害等级严重。Microsoft 已在 2019 年 3 月安全更新中修复此漏洞，建议用户尽快安装补丁或禁用不受信任的应用程序包上传功能。"
published = "2019-03-05T23:29:00Z"
remediation = "立即安装 Microsoft 2019 年 3 月安全更新（SharePoint 2016 KB4462205 / SharePoint 2013 KB4462210），或通过 Windows Update / WSUS 部署最新累积更新。此漏洞通过反序列化实现远程代码执行，CVSS 9.8，已发现公开利用代码并纳入 CISA KEV 目录，必须优先修复。若暂时无法打补丁，可配置 WAF 规则拦截对 `/_vti_bin/webpartpages.asmx` 的异常 SOAP 请求作为临时缓解。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Microsoft SharePoint 反序列化远程代码执行漏洞"
updated = "2026-06-17T02:08:31Z"

