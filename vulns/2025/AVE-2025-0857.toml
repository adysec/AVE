[basic]
description = "Microsoft Access 存在堆溢出远程代码执行漏洞，未经身份认证的本地攻击者可通过社会工程手段诱骗用户打开特制的 Access 数据库文件（如 .accdb、.accde 等格式），在本地触发堆缓冲区溢出，从而在目标系统上以当前用户权限执行任意代码。该漏洞影响 Microsoft Access 2016、Microsoft 365 Apps for Enterprise、Microsoft Office 2019、Microsoft Office LTSC 2021 及 Microsoft Office LTSC 2024 等多个版本，CVSS 评分为 7.8（高危），攻击复杂度较低且无需预先获取权限。攻击者成功利用后可完全控制受影响系统，进而窃取数据、安装恶意软件或横向移动。预览窗格不是该漏洞的攻击向量。Microsoft 已发布安全更新 5002688 修复此问题，建议受影响用户尽快安装补丁或启用自动更新以降低风险。"
published = "2025-01-14T18:16:04Z"
remediation = "Microsoft 已发布安全更新修复此漏洞。Access 2016 用户应将 Microsoft Access 升级至版本 16.0.5487.1000 或更高版本。Microsoft 365 Apps for Enterprise、Office 2019、Office LTSC 2021 和 Office LTSC 2024 用户应安装 2025 年 2 月 11 日发布的最新安全更新，具体版本信息请查阅 https://aka.ms/OfficeSecurityReleases。如无法立即更新，可暂时禁用 Access 中 ActiveX 控件执行并限制打开不受信任来源的 .accdb/.accde 文件作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Access 远程代码执行漏洞"
updated = "2026-06-17T08:43:16Z"

