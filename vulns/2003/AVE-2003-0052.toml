[basic]
description = "Ethereal（现 Wireshark）0.9.9 及更早版本的 NTLMSSP 协议解析代码中存在堆缓冲区溢出漏洞。远程攻击者可通过向目标系统发送特制的网络数据包触发该漏洞，导致 Ethereal 服务崩溃（拒绝服务），甚至可能利用该漏洞在目标系统上执行任意代码。该漏洞影响 Ethereal 0.9.9 及之前所有版本，CVSS 评分 7.5，危害等级高。用户需升级至更新版本以修复此漏洞。"
published = "2003-04-02T05:00:00Z"
remediation = "升级 Ethereal 至 0.9.10 或更高版本。Ethereal 已更名为 Wireshark，建议直接安装最新版 Wireshark（当前最新稳定版）。如无法升级，可在防火墙规则中限制 NTLMSSP 协议流量仅允许可信来源访问。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Ethereal NTLMSSP 堆缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T22:01:40Z"

