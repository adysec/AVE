[basic]
description = "Quest NetVault Backup 的 NVBULibrarySlot JSON-RPC 消息处理模块存在 SQL 注入漏洞（CWE-89）。该漏洞源于在构造 SQL 查询语句前未对用户提供的字符串进行充分验证，导致攻击者可以通过注入恶意 SQL 代码操纵数据库查询。该漏洞影响 Quest NetVault Backup 的多个受影响版本，CVSS 评分 8.8，危害等级高。虽然利用该漏洞需要认证凭据，但现有认证机制可被绕过，因此远程攻击者无需有效账户即可利用。成功利用后，攻击者可在 NETWORK SERVICE 上下文中执行任意代码，完全控制受影响的备份服务器，可能导致数据泄露、勒索软件部署或供应链攻击。"
published = "2026-06-25T00:17:48Z"
remediation = "立即升级到 Quest NetVault Backup 14.0.2 或更高版本以修复 NVBULibrarySlot JSON-RPC 消息处理中的 SQL 注入漏洞，受影响版本为 14.0.0.19 及更早版本。可从 Quest 支持站点（support.quest.com）下载对应补丁包，按照官方升级指南安装。如暂无法立即升级，应在防火墙或 WAF 层面限制对 NetVault Web 管理界面的访问来源 IP，仅允许受信任的管理员网络访问，并禁用不必要的远程管理端口，以降低被利用的风险。"
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "Quest NetVault Backup NVBULibrarySlot SQL注入远程代码执行漏洞"
updated = "2026-06-26T05:16:32Z"

