[basic]
description = "Thermo Fisher Scientific dataTaker DT80 dEX 1.50.012 版本存在信息泄露漏洞，由于 /services/getFile.cmd 接口未对 userfile 参数进行路径遍历校验，未经身份认证的远程攻击者可直接请求 /services/getFile.cmd?userfile=config.xml 路径，直接读取设备配置文件 config.xml，从而获取敏感凭证及配置信息。该漏洞影响 dataTaker DT80 dEX 1.50.012 版本，CVSS 3.1 评分 9.8（CRITICAL），攻击向量为网络、攻击复杂度低、无需权限、无需用户交互，攻击者可远程无认证直接访问敏感配置文件导致凭证泄露及设备配置泄露，进而可能导致设备完全被控制。攻击者只需发送构造的 HTTP GET 请求即可利用，无需任何前置条件。建议升级至修复版本或限制相关接口访问权限。"
published = "2017-07-12T12:29:00Z"
remediation = "立即在设备上部署最新的固件版本（X.X.X或更高），这修正了配置文件访问的认证漏洞。为Web管理界面启用强认证并限制来源IP，防止未授权访问。如果无法立即应用固件更新，可临时禁用`/services/`目录或通过防火墙阻止对该URI的外部访问。实施网络分段以隔离设备，将其与企业网络分离。定期审计配置文件访问日志，发现任何异常访问后立即调查。关闭设备不必要的服务，减少攻击面。所有默认凭据必须立即更改为强密码，并启用多因素认证保护管理界面访问。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Thermo Fisher Scientific dataTaker DT80 dEX 信息泄露漏洞"
updated = "2026-06-17T01:01:20Z"

