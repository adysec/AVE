[basic]
description = "SGI IRIX 6.5 至 6.5.16 版本中的 xfsmd 服务存在远程命令执行漏洞。该服务在调用 popen() 函数（如 export_fs()）时未正确过滤 shell 元字符，远程攻击者无需身份认证即可通过网络发送特制请求，利用 shell 元字符注入执行任意系统命令，完全控制目标主机。该漏洞影响 IRIX 6.x 全系列版本，危害严重。"
published = "2002-07-03T04:00:00Z"
remediation = "立即升级 SGI IRIX 至 6.5.17 或更高版本（SGI 已发布安全补丁修复 rpc.xfsmd 中 popen() 调用未过滤 shell 元字符的问题）。如无法升级，立即停止 xfsmd 服务（/etc/init.d/xfsmd stop）并从 inetd 配置中移除该服务条目，同时在防火墙层面阻断对 RPC 端口 177 的未授权访问。由于 IRIX 已停止维护，建议迁移至受支持的操作系统。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "SGI IRIX rpc.xfsmd 远程命令执行漏洞"
updated = "2026-06-16T21:57:52Z"

