[basic]
description = "RealNetworks RealPlayer 的 rvrender.dll 组件存在代码注入漏洞，远程攻击者可通过向用户发送特制的 RMFF 媒体文件，在其中嵌入恶意构造的 flags 字段触发该漏洞，导致在目标系统上执行任意代码。该漏洞影响 RealPlayer 11.x、14.x、15.x 及 RealPlayer SP 1.0~1.1.5 等多个版本，CVSS 评分 9.3，危害等级严重。用户只需在受影响版本中打开恶意媒体文件即可被利用，无需额外认证。RealNetworks 已发布 15.0.2.71 及以上版本修复此漏洞。"
published = "2012-02-08T15:55:00.750"
remediation = "立即将 RealPlayer 升级至 15.0.2.71 或更高版本（推荐 15.0.2.72），该版本已修复 rvrender.dll 中因 RMFF 文件 crafted flags 导致的远程代码执行漏洞。如暂时无法升级，应避免打开来自不可信来源的 RMFF 媒体文件，并在防火墙或邮件网关中过滤 .rm/.rmff 附件，同时卸载 RealPlayer SP 1.0 至 1.1.5 受影响版本。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer RMFF文件远程代码执行漏洞"
updated = "2026-06-16T23:38:30.733"

