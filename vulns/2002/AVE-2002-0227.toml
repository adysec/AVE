[basic]
description = 'Zope 2.0 至 2.5.1 b1 版本的"通过 Web 代码"功能存在访问控制缺陷，未经身份认证的远程攻击者可通过发送特定 HTTP 头部向 Zope 服务器发送关闭指令，导致服务拒绝。该漏洞源于 Zope 未对通过 Web 提交的管理代码执行权限进行充分验证，攻击者无需认证即可通过发送特定 Header 触发服务器关闭，导致服务完全不可用。影响 Zope 2.0 至 2.5.1 beta 1 所有版本，CVSS 5.0 分（AV:N/AC:L/Au:N/C:N/I:N/A:P），属可用性影响类漏洞。攻击者只需向目标发送包含特定关闭指令的 HTTP 请求即可触发，无需认证且无需用户交互。官方已在后续版本修复该权限校验缺陷。'
published = "2002-07-23T04:00:00Z"
remediation = '建议升级 Zope 到 2.5.1 正式版或更高版本（如 2.6.0 及以上），官方已在正式版中修复 "through the web code" 关闭服务器漏洞。若暂时无法升级，可在 Web 服务器层面（如 Apache/nginx）配置规则拦截包含恶意头部的请求，或在防火墙层面限制非受信 IP 访问 Zope 管理端口（默认 8080/9673）作为临时缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Zope 远程服务拒绝漏洞"
updated = "2026-06-16T21:57:56Z"

