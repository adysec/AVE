[basic]
description = "Windows 95/98/98SE 系统的 NetBIOS 客户端存在拒绝服务漏洞。远程攻击者可通过修改文件共享服务使其返回未知驱动程序类型，导致目标系统的 NetBIOS 客户端崩溃，造成拒绝服务。攻击者无需身份认证即可利用该漏洞，但攻击复杂度较高。该漏洞影响 Windows 95、Windows 98 及 Windows 98 Second Edition 等早期 Windows 操作系统，CVSS 评分 2.6，危害等级低。微软已发布安全更新修复此漏洞。"
published = "2000-12-11T05:00:00Z"
remediation = '该漏洞影响已停止支持的 Windows 95/98/98SE，微软未发布官方补丁。建议立即升级到 Windows 10 或更高版本（如 Windows 11），这些版本已不再使用 NetBIOS 作为默认文件共享协议。如无法升级，可在网络适配器属性中卸载"Microsoft 网络的文件和打印机共享"组件，或在防火墙中阻止 UDP 137-138 端口和 TCP 139 端口入站流量，以阻断远程 NetBIOS 攻击路径。'
score = 2.6
severity = "LOW"
sources = ["epss"]
title = "Microsoft Windows 95/98/98SE NetBIOS Client 拒绝服务漏洞"
updated = "2026-06-16T21:52:57Z"

