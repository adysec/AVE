[basic]
description = "Microsoft Office 存在释放后使用（Use-After-Free）漏洞，由于程序在处理特制 Office 文件时未正确管理内存对象的生命周期，攻击者可通过诱导用户打开恶意 Office 文档触发该漏洞，成功利用可在当前用户上下文中执行任意代码。该漏洞影响 Microsoft Office 多个版本，CVSS 评分 7.8，危害等级高。攻击需用户交互（打开恶意文件），无法远程直接利用。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:37Z"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新：Office 2016 升级至 16.0.5487.1000 及以上版本，Office LTSC for Mac 升级至 16.94.25020927 及以上版本；Microsoft 365 Apps 用户通过 Office 自动更新或访问 https://aka.ms/OfficeSecurityReleases 获取补丁。临时缓解措施：避免打开来自不可信来源的 Office 文档。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Office 远程代码执行漏洞"
updated = "2026-06-17T08:43:15Z"

