[basic]
description = "Oracle WebCenter Sites 的 Advanced UI 子组件存在权限提升与未授权数据访问漏洞。该漏洞影响 Oracle WebCenter Sites 12.2.1.3.0 版本，攻击复杂度低，具备网络访问权限的低权限攻击者可通过 HTTP 向目标站点发送特制请求，无需用户交互即可利用该漏洞。攻击成功后，攻击者能够未授权读取 Oracle WebCenter Sites 中部分可访问的数据，造成敏感信息泄露。Oracle 已发布安全补丁修复此漏洞。"
published = "2019-04-23T19:32:49.317"
remediation = "立即安装 Oracle 2019 年 4 月 Critical Patch Update (CPU) 补丁，补丁文档见 https://support.oracle.com/epmos/faces/DocumentDisplay?id=2498664.1。受影响版本为 Oracle WebCenter Sites 12.2.1.3.0（Fusion Middleware Advanced UI 组件），应用该 CPU 补丁后即可修复 CVE-2019-2579。如无法立即打补丁，可在防火墙或反向代理层面限制对 WebCenter Sites Advanced UI 接口的 HTTP 访问权限，仅允许可信来源 IP 访问，以降低低权限攻击者通过网络利用该漏洞的风险。同时建议将 WebCenter Sites 升级至 Oracle Fusion Middleware 12.2.1.4.0 或更高受支持版本以获得完整安全修复。"
score = 4.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "Oracle WebCenter Sites 未授权信息访问漏洞"
updated = "2026-06-17T02:34:08.673"

