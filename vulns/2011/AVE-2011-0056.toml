[basic]
description = "Adobe Flash Player在处理特制Flash内容时存在内存破坏漏洞。远程攻击者可通过诱导用户打开包含恶意嵌入.swf文件的Microsoft Office文档或访问恶意网页触发该漏洞，成功利用可在目标系统上执行任意代码或导致拒绝服务。该漏洞源于Flash Player对畸形SWF文件输入验证不足，造成内存损坏。影响Windows、Mac OS X、Linux、Solaris及Android平台上的Flash Player 10.3.181.14之前版本（Android为10.3.185.21之前版本）。该漏洞已在2011年5月被野外利用，CVSS评分8.8，危害等级高。"
published = "2011-05-13T22:55:01Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.181.14 及以上版本（Windows/Mac/Linux/Solaris）或 10.3.185.21 及以上版本（Android）。由于 Adobe 已于 2020 年 12 月 31 日停止 Flash Player 支持并推荐卸载，建议彻底卸载 Flash Player 组件，并在浏览器中禁用 Flash 插件。对于必须使用 Flash 的遗留系统，可部署应用白名单策略限制 .swf 文件来源，并在 Microsoft Office 中禁用 ActiveX 控件加载 Flash 内容。"
score = 8.8
severity = "HIGH"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏漏洞"
updated = "2026-06-23T16:16:56Z"

