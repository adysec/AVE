[basic]
description = "Matt Wright's download.cgi 1.0 存在路径遍历漏洞，远程攻击者可通过在 f 参数中注入 ..（点号斜杠）序列绕过目录限制，读取服务器上的任意敏感文件，如 /etc/passwd 等系统配置文件。该漏洞无需身份验证即可利用，影响运行该脚本的 Web 服务器，攻击者可借此获取敏感信息，CVSS 评分 5.0，危害等级中等。"
published = "1999-09-09T04:00:00Z"
remediation = "建议从 Web 服务器中彻底移除 Matt Wright 的 download.cgi 1.0 脚本，或替换为维护中的文件下载组件。如确需保留该脚本，应对 f 参数进行严格校验：禁止包含 ..（点号点号）路径遍历字符，只允许指定白名单目录内的文件访问，并使用 realpath() 解析后验证文件是否位于白名单范围内。同时将 cgi-bin 目录权限设置为最小必要权限，禁止脚本对系统敏感目录（如 /etc、/etc/passwd）进行读取操作。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Matt Wright download.cgi 任意文件读取漏洞"
updated = "2026-06-16T21:50:18Z"

