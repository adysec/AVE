[basic]
description = "Cisco Secure PIX 防火墙 5.2(2) 及更早版本中的邮件防护（mailguard）功能未能正确限制对 SMTP 命令的访问权限。远程攻击者可通过先发送 DATA 命令，再发送本应被限制的 SMTP 命令的方式绕过内容过滤机制，从而执行受限命令。该漏洞影响 Cisco PIX 防火墙 4.x 及 5.x 系列版本，攻击者无需身份认证即可远程利用，可能导致邮件服务器被滥用或敏感信息泄露。CVSS 评分 7.5，危害等级高。"
published = "2000-12-11T05:00:00Z"
remediation = "升级 Cisco PIX 防火墙至 5.2(3) 或更高版本，该版本已修复 mailguard 功能对 SMTP 命令的访问控制缺陷。如无法立即升级，可在 PIX 配置中禁用 mailguard 功能（`no fixup protocol smtp 25`），并在网络边界 ACL 中限制仅允许与可信邮件服务器的 SMTP 通信，同时启用审计日志监控异常 SMTP 会话。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Cisco PIX防火墙 SMTP 命令过滤绕过漏洞"
updated = "2026-06-16T21:52:59Z"

