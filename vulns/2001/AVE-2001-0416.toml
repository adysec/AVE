[basic]
description = "Namazu 2.0.9 及更早版本存在跨站脚本漏洞，远程攻击者可通过在 idxname 参数中指定无效索引文件，触发错误消息回显时注入任意 JavaScript 代码，导致以其他 Web 用户身份执行脚本。该漏洞源于错误页面未对用户输入进行充分过滤和转义，影响运行 Namazu 搜索引擎的所有 Web 应用。攻击者无需认证即可远程利用，只需诱导受害者访问包含恶意 idxname 参数的 URL，即可窃取会话 Cookie、执行钓鱼攻击或进行其他客户端攻击。CVSS 评分 7.5（高危），攻击向量为网络，复杂度低，无需权限，可影响机密性、完整性和可用性。"
published = "2001-12-27T05:00:00.000"
remediation = "建议立即升级 Namazu 到 2.0.10 或更高版本（官方已修复该 XSS 漏洞），下载地址：http://www.namazu.org/。若暂时无法升级，可在 Web 服务器层面配置 WAF 规则拦截包含 <script>、javascript: 等 XSS 特征的 idxname 参数，或在 Web 服务器层面对 idxname 参数进行严格的输入验证和 HTML 实体编码转义，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Namazu Namazu 搜索引擎 跨站脚本攻击漏洞"
updated = "2026-06-16T21:56:06.100"

