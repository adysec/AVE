[basic]
description = "Agora.CGI 3.0a至4.0g版本在开启调试模式时，其agora.cgi脚本存在跨站脚本漏洞。远程攻击者无需身份认证即可通过cart_id参数注入恶意JavaScript代码，当其他用户访问受影响的页面时脚本将被执行，导致会话劫持、敏感信息窃取等危害。攻击者只需构造特制的URL并诱使用户点击即可触发该漏洞，攻击门槛低、影响范围广。"
published = "2001-12-17T05:00:00.000"
remediation = "立即禁用 Agora.CGI 的调试模式（debug mode），在配置文件中将 debug 参数设为 0 或 false；同时升级到 Agora 4.0h 或更高版本。如无法升级，在 Web 服务器层面对 cart_id 等输入参数进行严格的 HTML 编码过滤，阻止恶意脚本注入。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Steve Kneizys Agora Debug Mode 跨站脚本漏洞"
updated = "2026-06-16T21:55:47.783"

