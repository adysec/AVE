[basic]
description = "AWStats 7.6 及之前版本存在一个全路径泄露（Full Path Disclosure）漏洞。该漏洞源于程序在处理请求时未能正确过滤输入，远程攻击者可通过向 `awstats.pl` 脚本发送精心构造的 `framename` 和 `update` 等参数，触发服务器返回包含配置文件绝对路径的错误信息。这使得攻击者能够获取服务器内部的文件系统结构，为进一步的攻击（如敏感文件读取）提供关键线索。"
published = "2018-04-20T17:29:00Z"
remediation = "建议将 AWStats 升级到 7.7 或更高版本，以修复全路径泄露漏洞。如果无法立即升级，可通过在 Web 服务器配置中限制对 awstats.pl 脚本的访问权限，或在 WAF 中拦截包含敏感参数（如 framename）的请求来缓解此风险。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "AWStats 全路径泄露信息泄露漏洞"
updated = "2026-06-17T01:33:45Z"

