[basic]
description = "Texas Imperial Software WFTPD 及 WFTPD Pro 2.41 版本在处理 RESTART (REST) 命令时存在输入验证缺陷，远程攻击者无需认证即可通过 STOU、STOR 或 APPE 等命令向文件末尾之外写入数据或向不存在的文件写入内容，导致 FTP 服务进程崩溃，造成拒绝服务。该漏洞影响 WFTPD 2.41 及更早版本，攻击者只需网络可达即可触发，无需任何权限。"
published = "2000-07-21T04:00:00Z"
remediation = "升级 WFTPD 至 2.42 或更高版本，该版本已修复 REST 命令越界写入问题。如无法升级，在 FTP 服务器配置中禁用 STOU/STOR/APPE 命令的写入权限，或限制可写目录的访问范围。若 WFTPD 已停止维护，建议迁移至 FileZilla Server 或 vsftpd 等仍在维护的 FTP 服务器软件。"
score = 6.4
severity = "MEDIUM"
sources = ["avd"]
title = "Texas Imperial Software WFTPD REST命令拒绝服务漏洞"
updated = "2026-06-16T21:52:10Z"

