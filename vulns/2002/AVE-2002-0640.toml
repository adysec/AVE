[basic]
description = "MailReader.com 的 nph-mr.cgi 脚本存在目录遍历漏洞，远程攻击者可通过在 configLanguage 参数中注入 ..（点线）路径序列和空字节（%00）绕过目录限制，从而读取服务器上的任意敏感文件。该漏洞影响 2.3.20 至 2.3.31 版本，攻击者无需身份认证即可在低复杂度条件下发起利用，可能导致系统配置文件、密码文件等敏感信息泄露，造成机密性破坏。"
published = "2004-12-06T05:00:00.000"
remediation = '立即升级 MailReader.com 至厂商已修复漏洞的最新版本（参考 http://mailreader.com/download/ChangeLog 获取修复版本信息），受影响版本范围为 2.3.20 至 2.3.31。如使用 Debian 系统，可安装 Debian 安全补丁版本 2.3.29-5woody1（参见 DSA-534）。若暂无法升级，作为临时缓解措施，可在 Web 服务器配置中对 nph-mr.cgi 的 configLanguage 参数输入进行过滤，禁止传入包含 ".." 或 "%00" 的内容，或在防火墙/WAF 层拦截包含目录遍历字符的请求，同时限制对 nph-mr.cgi 脚本的访问权限。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "MailReader.com 2.3.x NPH-MR.cgi 目录遍历文件泄漏漏洞"
updated = "2026-06-16T21:59:35.613"

