[basic]
description = "Linux 内核 ksmbd 模块在处理 SMB2/SMB3 协议持久句柄上下文时存在边界检查缺失漏洞。未经充分验证的攻击者可通过向目标 SMB 服务器发送特制的 durable handle 请求，触发越界内存访问，导致敏感内核信息泄露或系统拒绝服务。该漏洞影响 Linux 内核 5.10 及后续版本中的 ksmbd 实现，攻击者需要具备有效的 SMB 访问权限，通过网络发送恶意构造的 SMB 协议数据包即可利用，CVSS 评分 8.1，危害等级高。Linux 内核维护者已发布补丁修复该问题。"
published = "2025-04-16T15:15:57Z"
remediation = '升级 Linux 内核至上游修复版本 6.6.87、6.12.23、6.13.11 或 6.14.2 及以上。各发行版用户应安装对应安全更新：Ubuntu 25.04 升级至 linux-image-6.14.0-22.22、Ubuntu 24.10 升级至 linux-image-6.11.0-28.28、Debian 12 等待 backport 补丁或升级至 6.12.101-1。如暂时无法打补丁，可通过 echo "blacklist ksmbd" > /etc/modprobe.d/disable-ksmbd.conf 禁用 ksmbd 内核模块并重启系统，同时停止所有 ksmbd 服务进程以消除漏洞被利用的风险。'
score = 8.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 ksmbd 持久句柄上下文越界读取漏洞"
updated = "2026-07-30T06:22:05Z"

