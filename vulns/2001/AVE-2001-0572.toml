[basic]
description = "Microsoft PowerPoint 2000 的文件加载器在解析机制中存在缓冲区溢出漏洞。当应用程序打开特制 PowerPoint 文件时，文件加载器的解析代码未对输入数据长度进行充分边界检查，导致堆栈缓冲区溢出，攻击者可借此覆盖返回地址并在目标系统上执行任意命令。该漏洞影响 Microsoft PowerPoint 2000 版本，攻击条件要求用户主动打开攻击者精心构造的恶意 PowerPoint 演示文稿文件，利用复杂度较高。成功利用后，攻击者可在当前用户权限下执行任意代码，造成机密信息泄露、数据篡改或系统可用性破坏等严重后果。Microsoft 已在后续安全更新中修复此漏洞。"
published = "2001-02-12T05:00:00Z"
remediation = "根据微软安全公告 MS01-002，建议立即为受影响版本安装安全补丁：PowerPoint 2000 用户应将程序升级至版本 9.0.4190，PowerPoint 97 用户需安装对应补丁并确认系统已安装 Office 97 Service Release 2b。补丁下载地址见微软官方更新目录。如暂时无法安装补丁，临时缓解措施包括：避免打开来源不明的 PowerPoint 文件，在 Outlook 等邮件客户端中禁用 PowerPoint 附件预览，并通过防火墙或组策略限制 PowerPoint 对 untrusted 文件的自动打开行为。Office XP 及更高版本不受此漏洞影响，长期解决方案是迁移至受支持的最新 Office 版本。"
score = 6.2
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft PowerPoint 2000 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:28Z"

