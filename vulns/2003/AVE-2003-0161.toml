[basic]
description = "WU-FTPD 2.6.2 版本的 wuftpd-freezer.c 组件在处理 FTP 客户端请求时，调用了系统 ls 命令并允许攻击者通过 -w 参数控制输出宽度。fileutils 或 coreutils 包中的 ls 程序存在内存消耗漏洞，当收到特大的 -w 参数值时，会分配过量内存导致进程资源耗尽。攻击者无需身份认证即可向 FTP 服务发送包含超大 -w 值的恶意请求，触发 ls 命令分配大量内存，使服务进程内存耗尽并崩溃，最终造成拒绝服务。该漏洞影响运行 WU-FTPD 2.6.2 的 Linux/Unix 服务器，攻击者可通过远程连接 FTP 端口发起利用。"
published = "2003-11-17T05:00:00Z"
remediation = "升级 GNU coreutils 至修复后的版本（5.2.1 或更高版本），以修复 ls 命令在 -w 参数下的整数溢出与内存耗尽漏洞。若为 Red Hat 系统，应安装 RHSA-2003:309 或 RHSA-2003:310 安全更新。同时升级 WU-FTPD 至不依赖 vulnerable ls 的版本，或在 wu-ftpd 配置中限制或禁用 LIST 命令的 -w 参数使用。如暂无法立即升级，可通过防火墙限制对 FTP 服务的访问作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "WU-FTPD 远程拒绝服务漏洞"
updated = "2026-06-16T22:03:05Z"

