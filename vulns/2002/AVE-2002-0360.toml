[basic]
description = "Microsoft SQL Server 2000（包括 MSDE 2000）的密码加密函数中存在缓冲区溢出漏洞。由于程序在处理 SQL Server 身份验证时的密码加密过程缺乏充分的边界检查，远程未经身份验证的攻击者可通过发送特制的认证请求触发该漏洞。攻击者可利用此缺陷获取数据库控制权并执行任意代码，导致系统被完全接管。该漏洞影响所有使用 SQL Server 身份验证的 SQL Server 2000 及相关桌面引擎版本。"
published = "2002-07-23T04:00:00Z"
remediation = "建议立即将 Microsoft SQL Server 2000 升级至更高版本或安装微软发布的相应安全补丁。如无法立即升级，请在防火墙上限制 1433 端口的访问权限，或将身份验证模式从“SQL Server 身份验证”更改为“仅 Windows 身份验证”以缓解风险。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft SQL Server 2000 密码加密程序缓冲区溢出漏洞"
updated = "2026-06-16T21:57:47Z"

