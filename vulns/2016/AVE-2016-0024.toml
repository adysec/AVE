[basic]
description = "heat-trackr WordPress 插件 1.0 版本存在反射型跨站脚本漏洞（Reflected XSS）。由于插件未对用户输入进行有效的过滤与转义处理，攻击者可通过构造特制的 URL 参数注入恶意 JavaScript 脚本。当受害者点击该恶意链接后，脚本将在其浏览器中执行，导致敏感信息泄露、会话劫持或页面内容篡改。攻击无需身份认证，但需诱使用户交互，CVSS 评分 6.1，危害等级中危。"
published = "2016-10-10T20:59:12Z"
remediation = "立即卸载 heat-trackr 插件（该插件已于 2016 年 4 月从 WordPress 官方目录下架且不再维护），删除 /wp-content/plugins/heat-trackr/ 目录下的所有文件。同时将 WordPress 核心更新至最新版本，并安装 Web 应用防火墙插件（如 Wordfence）以拦截反射型 XSS 攻击。作为临时缓解措施，可在服务器端对 HTTP 请求中的 query 参数进行 HTML 实体编码输出过滤。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress heat-trackr 插件反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:44Z"

