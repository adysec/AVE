[basic]
description = "Adobe Flash Player 10.2.152.26 之前版本存在内存破坏漏洞（CWE-119），远程攻击者可通过诱导用户访问特制网页或打开恶意 SWF 文件触发内存损坏，导致任意代码执行或拒绝服务。该漏洞无需身份认证，攻击复杂度中等（需用户交互），CVSS 评分 9.3，危害等级严重。Adobe 已在 2011 年 2 月发布安全更新修复此漏洞，建议用户升级至 Flash Player 10.2.152.26 或更高版本。"
published = "2011-02-10T16:00:33Z"
remediation = "立即升级 Adobe Flash Player 至 10.2.152.26 或更高版本。Windows 用户可通过 Adobe 官方下载中心获取更新，Linux 用户可通过发行版包管理器安装（如 Red Hat 执行 RHSA-2011-0206/0259/0368，openSUSE 执行 SUSE-SR:2011:003）。如无法立即升级，可在浏览器中禁用 Flash 插件或启用 click-to-play 机制作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏漏洞"
updated = "2026-06-16T23:27:44Z"

