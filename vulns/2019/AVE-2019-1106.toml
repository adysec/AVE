[basic]
description = "TVT NVMS-1000 网络视频管理系统存在目录遍历漏洞，远程攻击者无需身份认证即可通过向目标设备发送特制的 HTTP GET 请求，在路径中包含 `../` 序列遍历服务器文件系统，从而读取任意敏感文件（如配置文件、系统密码等）。该漏洞影响 TVT NVMS-1000 系列设备，攻击复杂度低，无需用户交互，CVSS 评分 7.5，危害等级高。目前已有公开的 PoC 利用代码，攻击者可轻易实施攻击。"
published = "2019-12-30T03:15:10Z"
remediation = "立即将 TVT NVMS-1000 设备的管理界面从公网断开，仅允许内网可信 IP 访问 8080 端口。在反向代理或 WAF 层面添加规则，拦截包含 `/..` 或 `/%2e%2e` 等目录遍历特征的 HTTP 请求。如设备已停产且无官方固件更新，建议迁移至受支持的视频管理系统以彻底修复漏洞。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "TVT NVMS-1000 目录遍历漏洞"
updated = "2026-06-17T02:29:56Z"

