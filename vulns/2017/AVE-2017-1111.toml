[basic]
description = 'Artifex Ghostscript 存在类型混淆漏洞，攻击者可通过构造特制的 EPS 文档，在文档中嵌入包含 "/OutputFile (%pipe%" 子串的 .rsdparams 参数，绕过 Ghostscript 的 -dSAFER 安全沙箱保护机制，导致远程命令执行。该漏洞影响 Ghostscript 9.21 及之前版本，已在 2017 年 4 月被野外利用。攻击者只需诱使用户使用 Ghostscript 或依赖 Ghostscript 的应用程序（如 ImageMagick、Python PIL 库等）打开恶意 EPS 文件即可触发，无需身份认证，危害严重。'
published = "2017-04-27T01:59:02Z"
remediation = "升级到 Ghostscript 9.22 或更高版本（9.21 及之前版本均受影响）。可通过包管理器更新：`apt install ghostscript`（Debian/Ubuntu）、`yum update ghostscript`（CentOS/RHEL）或从 https://www.ghostscript.com/download/gsdnld.html 下载源码编译安装。如无法立即升级，可在使用 ImageMagick/Python PIL 等库处理用户上传图像时，禁用 EPS 处理或添加 `-dSAFER -dDELAYSAFER` 参数，并在系统层面移除或限制 `gs` 二进制文件的 SUID 权限。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Artifex Ghostscript 类型转换远程命令执行漏洞"
updated = "2026-06-17T01:26:08Z"

