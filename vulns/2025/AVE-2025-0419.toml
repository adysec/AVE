[basic]
description = "Google Chrome 导航功能中存在释放后使用（Use After Free）漏洞，远程攻击者可通过诱使用户安装特制的 Chrome 扩展程序触发堆损坏，导致在浏览器进程中执行任意代码。该漏洞影响 Google Chrome 133.0.6943.98 之前版本及基于 Chromium 的 Microsoft Edge 133.0.3065.69 之前版本，CVSS 评分 8.1，危害等级高。攻击需要用户交互（安装恶意扩展），成功利用可窃取敏感信息或篡改网页内容。Google 已在 Chrome 133.0.6943.98 中修复此漏洞。"
published = "2025-02-15T02:15:09Z"
remediation = "升级 Google Chrome 至 133.0.6943.98 或更高版本，Microsoft Edge (Chromium 内核) 升级至 133.0.3065.69 或更高版本。Debian 12 用户执行 `apt update && apt upgrade chromium` 安装 DSA-5866 安全更新。无法立即升级时，禁用不可信 Chrome 扩展程序作为临时缓解措施。"
score = 8.1
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome Navigation 释放后使用漏洞"
updated = "2026-06-17T08:27:29Z"

