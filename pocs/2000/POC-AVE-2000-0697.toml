[info]
author = "AVE"
description = "通过构造包含javascript:URL的HTML页面，在Sun HotJava Browser 3.0中打开命名窗口，绕过同源策略跨域访问目标页面DOM，验证任意DOM访问漏洞"
id = "POC-AVE-2000-0697"
name = "Sun HotJava Browser 3 Arbitrary DOM Access PoC"
severity = "medium"
tags = [
    "cve-2000-0958",
    "dom-access",
    "hotjava",
]
vuln_id = [
    "CVE-2000-0958",
    "AVE-2000-0697",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "HotJava",
    "cross-domain",
    "DOM accessed",
]
