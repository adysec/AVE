[basic]
description = "Evolution 邮件客户端内置的 GtkHTML 组件在处理特制畸形邮件消息时存在解析缺陷，远程攻击者可向目标用户发送包含恶意构造内容的邮件，触发 GtkHTML 解析器内存访问异常，导致 Evolution 客户端崩溃，造成拒绝服务。该漏洞影响 Evolution 1.2.4 之前版本，攻击无需身份认证，仅需诱使用户预览或打开恶意邮件即可触发。"
published = "2003-05-05T04:00:00Z"
remediation = "升级 GNOME Evolution 至 1.2.4 或更高版本，该版本修复了 GtkHTML 组件解析畸形邮件导致崩溃的问题。如无法升级，建议禁用 Evolution 的 HTML 邮件预览功能，仅以纯文本方式查看邮件，或改用其他邮件客户端作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "GNOME GtkHTML 拒绝服务漏洞"
updated = "2026-06-16T22:01:36Z"

