[basic]
description = "Fluid Dynamics Search Engine (FDSE) 2.0.0.0055 之前版本的 search.pl 脚本存在跨站脚本漏洞，远程攻击者可通过向 Rank 或 Match 参数注入恶意 Web 脚本代码触发该漏洞，导致在用户浏览器中执行任意脚本，窃取会话 Cookie 或重定向至恶意网站。该漏洞攻击复杂度低，无需身份认证即可利用，影响所有使用 FDSE 2.0.0.0055 之前版本的网站。"
published = "2002-10-04T04:00:00Z"
remediation = "升级 Fluid Dynamics Search Engine 至 2.0.0.0055 或更高版本，该版本已修复 search.pl 中 Rank 和 Match 参数的 XSS 漏洞。如无法升级，需在 search.pl 中对 Rank 和 Match 参数进行 HTML 实体编码过滤，严格限制输入仅允许数字和字母，并设置 Content-Security-Policy 响应头作为深度防御。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Fluid Dynamics Search Engine 跨站脚本漏洞"
updated = "2026-06-16T21:58:36Z"

