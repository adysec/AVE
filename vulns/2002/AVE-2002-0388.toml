[basic]
description = 'Macromedia Flash Player 6.0.47.0 之前版本存在同源策略绕过漏洞。远程攻击者可通过以下三种方式绕过同域限制并读取任意文件：(1) 利用 HTTP 重定向；(2) 在 Web 文档中设置 "file://" 协议的基础 URL；(3) 从 Web 存档（mht 文件）中使用相对 URL。该漏洞影响安装了 Flash Player 及 Shockwave 插件的所有浏览器，攻击者无需身份认证即可通过网络远程触发，导致敏感文件信息泄露。Adobe 已在 Flash Player 6.0.47.0 版本中修复此问题。'
published = "2003-04-22T04:00:00Z"
remediation = "升级 Macromedia Flash Player 至 6.0.47.0 或更高版本，该版本修复了通过 HTTP 重定向、file:// 协议及 .mht 文件绕过同源策略读取任意文件的问题。如无法升级，可在浏览器中禁用 Flash 插件或使用 ActiveX 筛选功能阻止 Flash 内容加载。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Macromedia Flash Player 安全绕过任意文件读取漏洞"
updated = "2026-06-16T21:59:22Z"

