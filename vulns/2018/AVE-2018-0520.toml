[basic]
description = "这是一个涉及 GIGABYTE多款产品中的GDrv低级驱动程序的安全漏洞，该驱动程序在APP Center、AORUS GRAPHICS ENGINE、XTREME GAMING ENGINE和OC GURU II等软件版本中暴露了读取和写入处理器特定寄存器（Machine Specific Registers，MSR）的功能。未经身份验证的远程攻击者可通过访问这些受保护的MSR寄存器，从而绕过系统安全控制，获取更高的系统权限或执行恶意代码，进而完全控制受影响系统。该漏洞影响Windows平台多款GIGABYTE产品，CVSS评分高达9.8，属于严重安全漏洞。攻击者无需任何特殊条件即可远程触发，危险性极高。GIGABYTE已经发布了安全补丁，用户应及时更新到最新版本以修复此漏洞。"
published = "2018-12-21T23:29:00Z"
remediation = "建议立即升级 GIGABYTE 相关软件到修复版本：GIGABYTE APP Center 升级至 v1.05.22 或更高版本，AORUS GRAPHICS ENGINE 升级至 v1.57 或更高版本，XTREME GAMING ENGINE 升级至 v1.26 或更高版本，OC GURU II 升级至 v2.09 或更高版本。若无法立即升级，建议卸载受影响的 GIGABYTE 软件套件（APP Center、AORUS ENGINE、XTREME ENGINE、OC GURU II），并在设备管理器中禁用 GDrv 驱动程序（GDrv.sys），或在 BIOS 中禁用相关驱动加载选项作为临时缓解措施。请访问 GIGABYTE 官网支持页面下载对应产品的最新版本驱动与工具。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "技嘉 GIGABYTE APP Center 等多款产品 权限提升漏洞"
updated = "2026-06-17T01:49:08Z"

