[basic]
description = "MiniVend 购物车程序的 view_page.html 示例页面存在命令注入漏洞，远程攻击者可通过向该页面传递包含 shell 元字符（如分号、管道符等）的特制参数，在服务器端执行任意系统命令。该漏洞影响 MiniVend 购物车系统，攻击者无需身份认证即可利用，可能导致敏感信息泄露、网站篡改或进一步渗透服务器。由于该页面为默认示例文件，安装后即存在风险，建议删除或限制访问该文件。"
published = "2000-07-10T04:00:00.000"
remediation = "立即删除或限制访问 MiniVend 安装目录下的 `view_page.html` 示例页面文件，该文件存在 shell 元字符注入漏洞。升级 MiniVend 至 1.4.1 或更高版本，该版本已移除存在漏洞的示例文件。如无法升级，在 Web 服务器（Apache/Nginx）配置中禁止外部访问 `/samples/` 目录，或删除整个 samples 目录以彻底消除风险。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "MiniVend 购物车程序 view_page.html 远程命令执行漏洞"
updated = "2026-06-16T21:52:09.450"

