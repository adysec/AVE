[basic]
description = "tags.<value>Microsoft Silverlight 5 在 5.1.41212.0 之前的版本中，运行时在解码过程中错误处理负偏移量，特别是在对象头解析阶段。远程攻击者可通过诱导用户访问特制的恶意网站，利用此漏洞执行任意代码或造成拒绝服务（对象头损坏）。该漏洞无需身份认证即可利用，但需要用户主动访问恶意页面。CVSS 评分为 8.8，危害等级为高危。"
published = "2016-01-13T05:59:22Z"
remediation = "立即升级 Microsoft Silverlight 到 5.1.41212.0 或更高版本，并确保完全安装最新安全更新。如系统已过时或无法升级，可能需要部署应用程序虚拟化解决方案来隔离受影响的 Silverlight 5.1.41212.0 之前版本。如无法立即修复，可临时阻止未验证的网络流量到 Silverlight 运行时或配置 web 应用服务器以禁用 Silverlight 插件，请确保应用完整的补丁套件或安装 Windows 10/11 系统补丁 KB4056892，彻底修复问题"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Silverlight 远程代码执行漏洞"
updated = "2026-06-17T00:36:49Z"

