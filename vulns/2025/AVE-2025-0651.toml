[basic]
description = "Windows MapUrlToZone 存在安全功能绕过漏洞。该函数用于将 URL 映射到对应的安全区域（如 Internet、本地 Intranet、受信任站点等），但由于对 URL 的解析逻辑存在缺陷，攻击者可通过诱导用户点击特制链接或访问恶意网页，绕过 Internet 区域的限制策略，使本应受严格限制的网页内容被错误地分配到权限更高的安全区域，导致机密性受到低度影响。该漏洞攻击复杂度低，无需提前获取用户权限，但需要用户交互。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:31Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新 (KB5050061)，或通过 Windows Update 自动获取更新。受影响的 Windows 版本包括 Windows 10/11 及 Windows Server 2008 至 2025，更新后各版本对应内核版本号分别为：Windows 10 1507 升级至 10.0.10240.20890、Windows 11 24H2 升级至 10.0.26100.2894 等。如无法立即打补丁，可配置 Internet 安全区域为高等级并限制不可信来源的 URL 访问作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows MapUrlToZone 安全功能绕过漏洞"
updated = "2026-06-17T08:42:43Z"

