[basic]
description = "Mozilla Firefox 和 Thunderbird 在处理 JavaScript 错误时存在信息泄露漏洞。攻击者可通过精心构造的 HTTP 重定向和远程内容，利用 JavaScript 错误处理机制中泄露的敏感信息绕过同源策略限制，获取本应受保护的跨域数据。该漏洞影响 Firefox 12.0 之前版本、Thunderbird 12.0 之前版本及 SeaMonkey 2.9 之前版本。攻击者无需身份认证即可通过远程方式利用此漏洞，CVSS v2 评分 5.0，危害等级中等。"
published = "2011-03-11T02:01:18Z"
remediation = "升级 Google Chrome 至 10.0.648.127 或更高版本，升级 Mozilla Thunderbird 至 12.0 或更高版本。如无法立即升级，可在浏览器中禁用 JavaScript（chrome 设置 → 隐私和安全 → 网站设置 → JavaScript 关闭）作为临时缓解措施，但可能影响正常功能。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 同源策略绕过漏洞"
updated = "2026-06-16T23:28:53Z"

