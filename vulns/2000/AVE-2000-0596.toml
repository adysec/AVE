[basic]
description = "IRIX 6.2/6.3 操作系统中的 dmplay 程序存在缓冲区溢出漏洞。攻击者通过向 dmplay 程序发送过长的命令行参数可覆盖相邻内存区域，从而实现任意代码执行并获取 root 权限。该漏洞影响 IRIX 6.2、6.3 及 6.5.x 版本，攻击者仅需本地访问权限即可触发，危害等级严重。攻击者可通过精心构造的恶意参数劫持控制权，完全掌控目标系统。"
published = "2000-10-20T04:00:00Z"
remediation = "立即升级到最新的IRIX版本（6.5 MR2或更高版本），或迁移到支持的安全操作系统。6.5及更高版本已修复dmplay缓冲区溢出漏洞，并包含增强的安全机制，如堆栈保护和地址随机化。如无法立即升级，可通过限制用户对`/usr/sbin/dmplay`的访问权限并实施强制UID检查作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "IRIX dmplay 缓冲区溢出"
updated = "2026-06-16T21:52:29Z"

