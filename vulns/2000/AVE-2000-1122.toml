[basic]
description = "NAI Sniffer Agent 存在权限提升漏洞。远程攻击者可通过嗅探初始 UDP 认证数据包获取认证凭据，然后伪造命令向 Sniffer Agent 发送恶意请求，从而在目标系统上以 Agent 权限执行任意操作。该漏洞影响 NAI Sniffer Agent 相关版本，攻击者无需身份认证即可远程利用，CVSS 评分 7.5，危害等级高。厂商已发布安全更新修复此漏洞。"
published = "2001-01-09T05:00:00.000"
remediation = "将 NAI Sniffer Agent 部署在独立的受信管理网段，通过防火墙 ACL 限制仅允许特定管理主机访问 Agent 的 UDP 认证端口。由于该产品已停止维护，建议升级至支持加密认证的网络监控方案（如 McAfee Network Security Platform 或同类产品），避免在不可信网络中暴露未加密的 UDP 认证流量。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "NAI Sniffer Agent 远程权限提升漏洞"
updated = "2026-06-16T21:53:17.040"

