[basic]
description = "Linux 发行版（如 RedHat 6.1）及 IRIX 6.5.18 中 lpr 软件包的行式打印机守护进程（lpd）存在认证绕过漏洞。lpd 在验证客户端权限时，将本地主机反向解析的主机名与 gethostname 返回的打印服务器主机名进行比对，攻击者可通过篡改攻击 IP 的 DNS 记录，使反向解析结果与目标打印服务器主机名一致，从而绕过访问控制，以 root 权限远程执行任意命令。该漏洞 CVSS 评分 10.0，危害等级严重，影响范围广泛。"
published = "2000-01-08T05:00:00.000"
remediation = "Red Hat Linux 系统应立即通过 Red Hat Network 或本地镜像升级 lpr 软件包至 RHSA-2000-002 勘误表修复版本，或直接升级到 Red Hat 6.2 及更高版本。IRIX 6.5.x 系统应安装 SGI 安全补丁 20021104-01-P。如暂时无法打补丁，可在防火墙中禁用 TCP 515 端口的对外访问，或通过 /etc/hosts.lpd 和 /etc/hosts.equiv 文件严格限制允许打印的主机，必要时临时停止 lpd 服务以减少攻击面。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "RedHat Linux lpd 远程命令执行漏洞"
updated = "2026-06-16T21:53:24.660"

