[basic]
description = "PrimeFaces 5.x 版本中存在弱加密漏洞（CWE-326），其 ViewState 加密密钥使用固定或可预测的密钥，未经身份认证的远程攻击者可通过构造特制的恶意序列化对象发送至目标服务器，触发 Java 反序列化导致远程代码执行。该漏洞影响 PrimeFaces 5.x 全系列版本，CVSS 评分 9.8，危害等级严重。官方已在 GitHub Issue #1152 中确认并修复，建议升级至 6.0 及以上版本。"
published = "2018-01-03T20:29:00Z"
remediation = "立即将 PrimeFaces 升级至 5.2.21 或 5.3.8 及以上版本，该漏洞源于弱加密算法（CWE-326）导致攻击者可伪造加密数据触发反序列化远程代码执行。如无法立即升级，可在 WAF/反向代理层添加规则拦截包含恶意加密上下文的请求作为临时缓解。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Primetek Primefaces 远程代码执行漏洞"
updated = "2026-06-17T00:59:15Z"

