[basic]
description = "Samba 2.0.7 中的 Web 管理工具 SWAT（Samba Web Administration Tool）在安装时将 cgi.log 日志文件设置为全局可读权限，导致本地攻击者可读取该日志文件中的敏感信息，如用户名称和密码。该漏洞攻击复杂度低，无需身份认证即可利用，影响 Samba 2.0.7 版本。由于日志文件权限配置不当，任何拥有本地系统访问权限的用户均可直接读取日志内容，造成敏感信息泄露。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 Samba 至 2.0.8 或更高版本（该版本修复了 SWAT cgi.log 权限问题）。如无法升级，手动执行 chmod 600 /usr/local/samba/var/cgi.log 限制日志文件权限为仅 root 可读写；在 smb.conf 中禁用 SWAT（设置 disable_swat = yes）；或通过 Web 服务器配置限制 SWAT 访问来源 IP。如不使用 SWAT 管理功能，建议彻底移除 swat 二进制文件及对应 CGI 脚本。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "Samba SWAT 日志文件权限信息泄露漏洞"
updated = "2026-06-16T21:52:48.367"

