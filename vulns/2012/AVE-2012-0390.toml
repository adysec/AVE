[basic]
description = "tags.<value>Apple iOS 6.0 之前的 CFNetwork 框架存在 URL 解析漏洞，由于在处理 HTTP 请求时未能正确识别 URL 中的主机部分，远程攻击者可通过构造包含畸形主机名的恶意 URL 发起信息泄露攻击。当受影响设备访问该 URL 时，CFNetwork 会将携带敏感信息的请求错误地发送至攻击者指定主机，导致 Cookie、认证令牌等数据泄露。该漏洞影响所有运行 iOS 6.0 以下版本的 iPhone、iPad 及 iPod touch，攻击者无需身份验证即可远程利用，且攻击复杂度低，用户无法察觉。Apple 已在 iOS 6.0 安全更新中修复此漏洞。"
published = "2012-09-20T21:55:03Z"
remediation = "建议将受影响的 Apple iPhone、iPad 或 iPod touch 设备升级至 iOS 6.0 或更高版本，该版本已通过改进 URL 处理机制修复了 CFNetwork 在处理畸形 URL 时向错误主机名发送请求导致敏感信息泄露的问题。对于暂不具备升级条件的设备，应避免访问来源不明的网站链接，并谨慎处理包含异常主机名的网页请求，以临时降低信息泄露风险。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iOS CFNetwork 信息泄露漏洞"
updated = "2026-06-16T23:43:48Z"

