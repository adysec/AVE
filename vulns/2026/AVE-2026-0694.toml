[basic]
description = "Pocket ID 的 `createTokenFromRefreshToken` 函数在处理 OIDC 刷新令牌流程时，仅验证了令牌的加密完整性，而未重新验证用户的当前授权状态。这导致攻击者在持有合法刷新令牌的情况下，可以通过刷新流程绕过三种限制：1. 授权撤销：用户撤销客户端授权后，刷新令牌依然有效；2. 账户禁用：管理员禁用用户账户后，刷新令牌仍能生成新的访问令牌；3. 组限制：用户被移出允许访问的组后，刷新令牌依然可用。攻击者只需向 `/api/oidc/token` 端点发送含有有效刷新令牌的请求，即可实现权限持久化并获取用户敏感信息，严重影响企业级账户管理的安全基线。"
published = "2026-05-12T15:16:15Z"
remediation = "建议立即将 Pocket ID 升级至 v2.6.0 或更高版本。升级后，系统将在 OIDC 刷新令牌流程中重新验证用户账户是否被禁用、授权记录是否依然存在以及组权限是否匹配，从而防止失效令牌被持续利用。"
score = 8.5
severity = "HIGH"
sources = ["ghsa"]
title = "Pocket ID OIDC 刷新令牌流程权限绕过漏洞"
updated = "2026-06-17T10:50:09Z"

