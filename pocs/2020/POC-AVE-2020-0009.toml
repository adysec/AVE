[info]
author = "ave"
description = "检测 Internet Explorer 11 是否受 CVE-2020-0674 JScript.dll 释放后使用漏洞影响。通过发送特制 HTML 页面触发 JScript 引擎对已释放内存的非法访问，验证目标是否存在该漏洞。"
id = "POC-AVE-2020-0009"
name = "Microsoft Internet Explorer JScript.dll Use-After-Free PoC"
severity = "high"
tags = ["ave-2020-0009"]
vuln_id = [
    "CVE-2020-0674",
    "AVE-2020-0009",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "JScript",
    "Use-After-Free",
]
