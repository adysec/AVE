[basic]
description = "Cisco IOS 12.4 至 15.6 版本的网络地址转换（NAT）功能中存在资源管理漏洞。该漏洞源于设备在处理使用注册、许可和状态（RAS）协议的 H.323 消息时，NAT 应用层网关（ALG）对 IPv4 数据包的转换存在缺陷。未经身份认证的远程攻击者可通过向受影响设备发送特制的 H.323 RAS 数据包触发该漏洞，成功利用可导致设备崩溃并重新加载，造成拒绝服务（DoS）。默认情况下，Cisco 设备为 H.323 RAS 消息启用了 NAT ALG，因此大量设备受影响。Cisco 已发布安全更新修复此漏洞。"
published = "2017-09-29T01:34:48Z"
remediation = "立即升级 Cisco IOS 至包含 CSCvc57217 修复的版本（如 15.6(3)M 及以上），或参考 cisco-sa-20170927-nat 公告中的固定版本列表。如无法立即升级，可在受影响设备上禁用 H.323 NAT ALG 功能（命令：no ip nat service h323 ras），作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS NAT H.323 RAS 消息处理拒绝服务漏洞"
updated = "2026-06-17T01:02:55Z"

