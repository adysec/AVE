[info]
author = "ave"
description = "验证目标系统是否受 CVE-2001-0002 漏洞影响。该漏洞存在于 Internet Explorer 5.5 及更早版本中，远程攻击者可获取缓存内容的物理路径并在本地计算机区域打开，利用 .chm 文件执行任意程序。本检测通过检查目标是否允许不安全的内容加载和本地区域访问来验证漏洞存在性。"
id = "POC-AVE-2001-0600"
name = "CVE-2001-0002 PoC"
severity = "high"
tags = ["ave-2001-0600"]
vuln_id = [
    "CVE-2001-0002",
    "AVE-2001-0600",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.headers]
User-Agent = "Mozilla/4.0 (compatible; MSIE 5.5; Windows NT 5.0)"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
