[basic]
description = "三星 Galaxy S25 设备上的 Samsung Members 应用（版本 5.5.01.3 之前）存在输入验证不当漏洞，远程攻击者可利用该漏洞诱导用户点击恶意链接，从而以 Samsung Members 权限连接任意 URL 并启动任意 Activity。该漏洞在 Pwn2Own 大赛中被公开演示，攻击需用户交互，CVSS 评分 7.1，危害等级高。用户应升级 Samsung Members 至 5.5.01.3 或更高版本以修复此漏洞。"
published = "2025-11-05T06:15:34Z"
remediation = "立即将 Samsung Members 应用升级至 5.5.01.3 及以上版本，可通过 Galaxy Store 或设置中的「软件更新」路径获取。如无法立即更新，可在 Samsung Members 设置中关闭「通过链接打开」等自动跳转功能，并教育用户不要点击来源不明的链接。"
score = 7.1
severity = "HIGH"
sources = ["zdi"]
title = "Samsung Samsung Members 开放重定向漏洞"
updated = "2026-06-17T08:42:34Z"

