[basic]
description = "Linux 内核中 spi: sn-f-ospi 驱动存在除零漏洞。当 spi-nor 命令中不包含虚拟周期（dummy cycle）时，虚拟总线周期字节数和宽度均为零，驱动代码在进行除法运算时触发除零错误，导致系统产生警告甚至崩溃。该漏洞影响搭载 TI SN-F-OSPI 控制器并使用 Linux 内核的系统，具有本地低权限访问条件的攻击者可通过触发特定的 SPI-NOR 操作来利用此漏洞。成功利用可能导致系统拒绝服务（DoS），对系统可用性造成影响。Linux 内核社区已提交补丁修复此问题，在遇到除零情形时直接返回零以避免危险计算。"
published = "2025-02-27T03:15:20.190"
remediation = "升级 Linux 内核至已修复版本：运行受影响内核（6.2 至 6.14-rc2）的系统应升级至 6.6.79、6.12.16、6.13.4 或 6.14 及以上版本。Ubuntu 24.04 LTS 用户可通过 apt 升级至内核 6.8.0-78.78 或更高版本；Ubuntu 22.04 LTS、Debian 11/12 及更早版本不受此漏洞影响。如暂时无法升级，可通过 modprobe -r spi_sn_f_ospi 命令卸载 spi-sn-f-ospi 驱动模块作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 SPI SN-F-OSPI 驱动除零漏洞"
updated = "2026-06-17T08:44:17.627"

