[basic]
description = "KDE 桌面环境的 kghostview 程序在调用 Ghostscript 处理 PostScript（PS）和 PDF 文件时，未传递 -dPARANOIDSAFER 和 -dSAFER 安全参数，导致沙箱逃逸防护失效。远程攻击者可诱骗用户打开特制的 PS 或 PDF 文件，在目标系统上执行任意命令，完全控制受影响主机。该漏洞影响 KDE 2 及 KDE 3.1.1 及更早的 3.x 版本，攻击无需身份认证，利用难度较低。"
published = "2003-05-05T04:00:00.000"
remediation = "立即升级 KDE 至 3.0.5b 或 3.1.1a 及以上版本，下载地址 https://download.kde.org/stable/。如无法升级，可手动应用补丁：从 ftp://ftp.kde.org/pub/kde/security_patches/ 下载对应版本的 post-3.1.1-kdebase-thumbnail.diff、post-3.1.1-kdegraphics-kdvi.diff、post-3.1.1-kdegraphics-kghostview.diff 和 post-3.1.1-kdelibs-kimgio.diff 并依次打补丁。临时缓解措施：删除 kghostview.desktop、thumbnail.protocol、eps.kimgio 和 kdvi.desktop 文件后重启 KDE，禁用文件预览和 PS/PDF 处理功能。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "KDE kghostview 任意命令执行漏洞"
updated = "2026-06-16T22:01:44.793"

