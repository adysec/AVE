[basic]
description = "Flowerfire SawMill 5.0.21 的 CGI 程序存在信息泄露漏洞，攻击者通过向 rfcf 参数提交任意文件路径，服务器会将该文件内容作为配置命令解析并返回首行内容，从而泄露服务器上的敏感信息。该漏洞无需身份认证即可利用，影响运行 SawMill 5.0.21 的 Web 服务器，攻击者可通过构造简单的 HTTP 请求即可读取服务器上任意文件的第一行内容，可能导致配置文件、日志文件等敏感信息泄露。"
published = "2000-06-26T04:00:00.000"
remediation = "建议立即升级 Sawmill 至修复后的最新版本。如暂无法升级，可在 Web 服务器配置中禁用或限制 Sawmill CGI 程序的访问权限，仅允许来自可信 IP 地址的请求，并对 rfcf 参数实施严格的输入过滤，防止任意文件被读取。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Flowerfire SawMill 任意文件读取漏洞"
updated = "2026-06-16T21:52:03.573"

