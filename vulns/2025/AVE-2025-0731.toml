[basic]
description = "Windows COM 服务器组件存在未初始化内存信息泄露漏洞（CWE-908）。由于 COM 服务器在处理特定调用时未能正确初始化内存区域，导致未初始化的内存内容可能被泄露。已获得低权限的本地攻击者可通过向受影响系统发送特制的 COM 调用请求触发该漏洞，从而读取本不应被访问的敏感内存数据，造成机密信息泄露。该漏洞影响多个 Windows 版本，CVSS 评分 6.5，危害等级中危。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:46Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新 KB5050061。该更新适用于 Windows Server 2008 SP2，需先安装服务栈更新 KB5050682 后再安装此安全更新。可通过 Microsoft Update Catalog 下载独立安装包，或通过 WSUS 同步推送。如无法立即打补丁，建议限制本地用户对 COM 服务器的访问权限作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows COM 服务器信息泄露漏洞"
updated = "2026-06-17T08:42:57Z"

