[basic]
description = "Info-ZIP UnZip 软件 (5.42 及更早版本) 存在文件名处理不当漏洞，攻击者可通过构造以 '/' 斜线开头的文件名压缩包，利用软件提取机制中的路径验证缺陷，将恶意文件写入系统任意位置。此漏洞主要影响 Linux/Unix 环境下的 Unzip 用户，在未经身份验证的情况下即可远程利用。攻击条件包括：目标系统安装了受影响的 Unzip 版本，且用户解压了攻击者控制的恶意压缩文件。利用方式是攻击者精心设计 ZIP 归档文件，伪装成正常压缩包，其中文件名以 '/' 开头，Unzip 在提取时会将其视为绝对路径，直接覆盖系统关键文件，导致权限提升或系统破坏。此漏洞 CVSS 评分 2.1，威胁等级较低，但可能导致严重的权限提升风险。Info-ZIP 团队已发布安全补丁，建议升级到 5.43 及以上版本以修复此漏洞。"
published = "2001-07-12T04:00:00Z"
remediation = "建议立即升级 Info-ZIP UnZip 至 5.50 或更高版本（修复了绝对路径遍历漏洞）。若无法立即升级，可使用 `unzip -q` 参数或在受限目录下解压（如 `unzip -d /safe/dir archive.zip`）限制解压目录，避免使用 root 权限解压不可信压缩包。Red Hat 用户可安装 RHSA-2002:138 补丁包（unzip-5.50-3 及以上），Debian/Ubuntu 用户升级至 unzip 5.52 以上版本。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Info-ZIP UnZip 任意文件写入漏洞"
updated = "2026-06-16T21:55:56Z"

