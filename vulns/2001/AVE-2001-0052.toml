[basic]
description = "Tinyproxy 是一款轻量级的 HTTP 代理服务器，其 1.3.3 及更早版本在处理 CONNECT 请求时存在堆溢出漏洞。攻击者通过向目标代理发送包含超长 CONNECT 请求的特殊数据包，可覆盖内存中相邻的堆结构数据。该漏洞无需身份认证，远程攻击者即可触发，成功利用可导致代理服务进程崩溃，造成拒绝服务；在某些环境下攻击者还可控制程序执行流程，实现任意命令执行。该漏洞影响所有使用 Tinyproxy 1.3.3 及之前版本的部署场景，攻击者仅需与目标 HTTP 代理建立网络连接便可发起攻击，无需任何附加权限。"
published = "2001-03-12T05:00:00Z"
remediation = "该漏洞存在于 tinyproxy 1.3.3 及更早版本的 HTTP 代理 connect 请求处理中，因未对超长 connect 请求做长度校验导致堆溢出，远程攻击者可触发拒绝服务甚至执行任意代码。建议立即将 tinyproxy 升级到 1.3.4 或更高版本（包含该漏洞修复），升级前先停止导出代理服务更换二进制文件并验证版本号。若无法立即升级，可在代理服务配置文件将允许的请求长度限制调小，并限制 connect 方法仅允许访问授权的内网目标端口，同时在防火墙层面对代理端口（默认 8888）仅开放给可信客户端源地址，作为临时缓解措施以降低被利用风险。升级后重启服务并确认 connect 功能恢复正常。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Tinyproxy Tinyproxy HTTP代理远程堆溢出漏洞"
updated = "2026-06-16T21:53:42Z"

