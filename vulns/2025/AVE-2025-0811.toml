[basic]
description = "Google Chrome V8 引擎存在类型混淆（Type Confusion）漏洞，CWE-843。攻击者可构造特制 HTML 页面，诱导用户访问后触发 V8 引擎对 JavaScript 对象类型的错误处理，导致堆内存破坏（heap corruption），进而实现任意地址读写，最终可能导致远程代码执行。该漏洞影响 Chrome 134.0.6998.88 之前的所有版本，CVSS 评分 8.8，危害等级高危。攻击需用户交互（点击恶意链接或访问恶意网页），无需身份认证，攻击复杂度低。Google 已在 Chrome 134.0.6998.88 版本中修复此漏洞。"
published = "2025-03-10T21:15:40.613"
remediation = "立即将 Google Chrome 升级至 134.0.6998.88 或更高版本（通过 chrome://settings/help 检查更新并重启浏览器）。基于 Chromium 的浏览器（Microsoft Edge、Brave、Opera 等）需同步更新至对应修复版本。Linux 发行版用户请安装对应的 chromium 安全更新（如 Debian 的 DSA-5877）。如无法立即更新，可配置内容安全策略（CSP）限制 JavaScript 执行来源，并避免在未受保护的浏览器中访问不可信链接。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 类型混淆远程代码执行漏洞"
updated = "2026-06-17T09:06:23.940"

