[basic]
description = "tags.<value>Adobe Flash Player 存在内存破坏漏洞，影响 Windows、Mac OS X、Linux 及 Android 平台上的 10.3.183.20 及更早版本、11.x 系列 11.3.300.257 及更早版本，以及 Adobe AIR 3.3.0.3610 及更早版本。未经身份认证的远程攻击者可通过未知攻击向量向目标系统发送特制内容触发该漏洞，导致内存损坏，进而执行任意代码或造成拒绝服务。该漏洞利用需要用户交互（例如诱使用户访问恶意网页或打开恶意文档），成功利用后可完全控制受影响系统。"
published = "2012-06-09T00:55:00.987"
remediation = "立即将 Adobe Flash Player 升级至 10.3.183.20 或更高版本（Windows/Mac OS X/Linux），Android 2.x/3.x 升级至 11.1.111.10 及以上、Android 4.x 升级至 11.1.115.9 及以上；将 Adobe AIR 升级至 3.3.0.3610 或更高版本。如暂时无法升级，请在浏览器设置中禁用 Flash Player 插件，或通过组策略限制 Flash 内容的运行，避免访问不受信任的网站和打开未知来源的文件。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:40:50.083"

