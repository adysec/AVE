[basic]
description = "LabKey Server Community Edition 18.3.0 之前的版本在处理 /__r1/ 路径的 returnURL 参数时存在开放重定向漏洞。攻击原理在于该接口未对 returnURL 参数的值进行严格的域名白名单校验，导致非受信的外部 URL 可被任意传入。漏洞影响范围包括使用 LabKey Server Community Edition 18.3.0-61806.763 及更早版本的用户，可导致用户的浏览器被重定向至攻击者控制的任意恶意网站，进而引发钓鱼攻击、凭证窃取或恶意脚本投递等后续危害。攻击条件较为宽松，攻击者只需构造包含恶意 returnURL 的链接并诱导用户点击即可触发，无需任何认证权限，但需要用户交互。利用方式为向目标发送特制链接，当受害者在已登录或未登录状态下访问该链接时，浏览器将遵循重定向跳转至攻击者指定站点。该漏洞 CVSS 评分为 6.1，等级为中危。"
published = "2019-01-30T20:29:00Z"
remediation = "建议立即将 LabKey Server 升级至 18.3.0-61806.770 或更高版本，该版本已修复 /__r1/ 路径中 returnURL 参数缺少目标域名白名单校验导致的开放重定向问题。若无法立即升级，可部署临时缓解措施：在 Nginx/Apache 等反向代理层拦截 /__r1/ 请求，校验 returnURL 参数的域名，仅允许跳转到本机或受信内网域名，对指向外部的非法重定向参数直接返回 4xx 拒绝；同时通过防火墙限制对该路径的访问来源，并定期审计访问日志中可疑的跳转行为，以降低用户被钓鱼重定向的风险。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "LabKey Server 开放重定向漏洞"
updated = "2026-06-17T02:35:51Z"

