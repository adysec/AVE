[basic]
description = "veraPDF 验证库的 GFPDAcroForm.getdynamicRender() 方法在解析 PDF 中 /AcroForm 字典的 /XFA 流时，使用默认配置的 DocumentBuilderFactory（未禁用 DOCTYPE 声明、外部实体和外部参数实体），导致 XML 外部实体注入（XXE）漏洞。远程攻击者只需向目标服务器提交一个包含恶意 XFA 流的特制 PDF 文件，在触发 PDF/UA-1 验证流程后即可利用该漏洞读取服务器本地任意文件或发起服务端请求伪造（SSRF）攻击。该漏洞影响 veraPDF-validation 1.17.35 至 1.30.2 及 1.31.71 版本，CVSS 评分 8.7，危害等级高，攻击无需身份认证及用户交互。"
published = "2026-07-29T16:17:53Z"
remediation = '立即升级 veraPDF-validation 至 1.30.2 或 1.31.71 及以上版本。如无法升级，在 GFPDAcroForm.java 的 getdynamicRender() 方法中，将 DocumentBuilderFactory 配置为禁用 DOCTYPE（调用 setFeature("http://apache.org/xml/features/disallow-doctype-decl", true)），并关闭外部实体加载（FEATURE_SECURE_PROCESSING、external-general-entities、external-parameter-entities）。同时避免对不可信 PDF 启用 PDF/UA-1 验证。'
score = 8.7
severity = "HIGH"
sources = ["ghsa"]
title = "veraPDF veraPDF-validation XML外部实体注入漏洞"
updated = "2026-07-30T19:23:14Z"

