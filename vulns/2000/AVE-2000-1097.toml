[basic]
description = 'McAfee VirusScan 4.5 的默认配置中未对 ImagePath 变量使用引号进行包裹，导致系统搜索路径被错误设置。该漏洞影响安装了 McAfee VirusScan 4.5 的 Windows 系统。具备本地访问权限的攻击者可利用此漏洞，在 C:\Program Files 目录中放置特洛伊木马程序 "common.exe"，由于搜索路径配置不当，系统可能优先加载并执行该恶意程序而非 McAfee 的正规组件，从而获得未经授权的程序执行权限，进而对系统机密性、完整性和可用性造成部分影响，CVSS 评分 4.6。'
published = "2001-01-09T05:00:00Z"
remediation = '标签之间。<value>升级 McAfee VirusScan 至 4.5 补丁版本或更高版本以修复 ImagePath 注册表项未加引号问题。如暂无法立即升级，可手动修改注册表中 McAfee 相关服务的 ImagePath 值，在路径前后添加英文双引号，例如将 `C:\Program Files\McAfee\VirusScan\...` 改为 `"C:\Program Files\McAfee\VirusScan\..."`，确保 Windows 能正确解析包含空格的完整路径，防止本地用户在 C:\Program Files 目录下放置名为 `common.exe` 的特洛伊木马程序。'
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "McAfee VirusScan 4.5 不安全路径搜索代码执行漏洞"
updated = "2026-06-16T21:53:12Z"

