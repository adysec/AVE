[basic]
description = "VShell SSH gateway 1.0.1 及更早版本存在缺省端口转发规则配置漏洞。该软件默认配置了允许任意源地址到任意目标地址的端口转发规则（0.0.0.0/0.0.0.0），攻击条件要求攻击者已作为本地用户登录系统，无需额外身份认证即可利用该配置向网络中的其他系统发起任意端口转发。通过该漏洞，已获得本地访问权限的攻击者可以将受感染的 SSH 网关作为跳板，绕过网络边界防护访问内部系统或其他受保护的服务，造成信息泄露或横向移动风险。"
published = "2001-06-02T04:00:00Z"
remediation = "建议立即升级 VShell 到 2.0 或更高版本（当前最新为 5.0），新版本默认限制了端口转发规则。若暂时无法升级，请在 VShell 控制面板的「端口转发」设置中，将默认的 0.0.0.0/0.0.0.0 规则删除或修改为仅允许特定目标 IP 和端口（如仅允许内网管理段 192.168.1.0/24 访问 22/3389 端口），并重启 VShell 服务使配置生效。若业务不需要 SSH 端口转发功能，可直接在控制面板禁用「允许端口转发」选项彻底规避风险。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "VanDyke VShell SSH 网关未授权端口转发漏洞"
updated = "2026-06-16T21:53:46Z"

