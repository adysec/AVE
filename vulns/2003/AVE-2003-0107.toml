[basic]
description = "Linux 2.4.x 内核的 execve 系统调用存在竞争条件漏洞，该调用在执行过程中会将可执行进程的文件描述符记录到调用进程的文件表中。本地低权限用户可利用此缺陷，通过在 execve 系统调用执行期间发起竞争访问，获取对受限文件描述符的读取权限，从而绕过文件权限限制并泄露敏感文件内容。该漏洞影响 Linux 2.4.x 系列内核，攻击者需在本地拥有登录权限或能够执行本地程序。Red Hat、Debian 及 Mandrake 等主流发行版均已发布安全公告并提供补丁修复。"
published = "2003-08-07T04:00:00Z"
remediation = "升级 Linux 内核至已修复版本。Ubuntu 用户应升级至 kernel-source-2.4.27-12 或更高版本；Red Hat 企业 Linux 用户应应用 RHSA-2003-238 安全公告中的内核补丁；Debian 用户应参考 DSA-358 安全公告进行升级。如无法立即升级内核，可临时通过禁用不需要的本地用户账户、使用 PAM 限制本地登录、或启用 SELinux/AppArmor 强制访问控制来降低风险。建议通过系统包管理器（如 apt-get upgrade 或 yum update）安装完整内核更新并重启系统。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Linux kernel execve 本地文件描述符信息泄露漏洞"
updated = "2026-06-16T22:02:16Z"

