[basic]
description = "Solaris 2.7 和 2.8 系统中的 catman 工具在处理临时文件时存在不安全的符号链接（symlink）竞争条件漏洞。本地攻击者可通过在 /tmp 目录下预创建恶意的 sman_PID 符号链接，诱使 catman 以 root 权限向攻击者指定的任意文件写入数据，从而实现任意文件覆盖。该漏洞攻击复杂度较高，需要本地访问权限且依赖时序竞争条件，CVSS 评分 1.2，危害等级低。建议升级到不受影响的 Solaris 版本或限制 catman 的 suid 权限。"
published = "2001-02-12T05:00:00.000"
remediation = "Solaris 2.7 和 2.8 已停止维护，官方不再提供安全补丁。建议升级至受支持的 Solaris 10/11 或迁移至 Oracle Solaris 11.4 SRU。临时缓解措施：限制本地用户登录权限，使用 `umask 077` 保护临时目录，或通过 `solaris.symlink_hardlink` 安全策略限制符号链接攻击。"
score = 1.2
severity = "LOW"
sources = ["cve"]
title = "Sun Solaris catman 本地符号链接攻击漏洞"
updated = "2026-06-16T21:53:38.760"

