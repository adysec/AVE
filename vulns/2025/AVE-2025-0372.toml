[basic]
description = "QHora QuRouter 存在转义序列中和不当漏洞（CWE-150），具有管理员权限的本地攻击者可通过向设备管理界面发送特制的控制序列，利用该漏洞绕过输入过滤机制，导致设备出现非预期行为，如信息泄露或配置篡改。该漏洞影响 QuRouter 2.6.3.009 之前版本，CVSS 评分 5.6，危害等级中危。厂商已在 QuRouter 2.6.3.009 版本中修复此漏洞。"
published = "2026-03-20T17:16:42Z"
remediation = "立即将 QHora QuRouter 升级至 2.6.3.009 或更新版本。如无法立即升级，应严格限制管理员账户的分配与使用，仅授予必要人员，并启用多因素认证；同时监控 QuRouter 管理界面的异常操作日志，及时发现可疑行为。"
score = 5.6
severity = "MEDIUM"
sources = ["zdi"]
title = "QHora QuRouter 控制序列中和漏洞"
updated = "2026-06-17T09:52:31Z"

