description = """
tags.

One thing: the task says "将 NVD 英文描述翻译为流畅中文" but there's no NVD entry for this GHSA (as confirmed by the search). So I should base it on the English description provided in the TOML and the local data.

Also: "不要编造 URL 或具体版本号（除非 presearch 数据中有）" - I have version numbers from presearch (<= v1.74.0, v1.75.0), so I can use those.

Let me finalize:

<value>rclone 的 WebDAV 客户端在处理同主机 HTTPS 到 HTTP 重定向时，未拒绝传输层降级，导致 Basic 授权凭据和 Cookie 等敏感头信息被回放到明文 HTTP 连接。当 WebDAV 服务器向同一主机名的 HTTP 端口发送 307 等重定向响应时，Go HTTP 客户端会沿用同主机敏感头转发规则，使路径上的攻击者能够窃取这些可重用的凭据。该漏洞影响 rclone <= v1.74.0 版本，攻击者需位于目标网络相邻位置或通信路径上，能够监听明文 HTTP 流量，并利用窃取的 Basic 密码、Bearer 令牌或会话 Cookie 执行该账户被授权的 WebDAV 读/写操作，危害数据的机密性与完整性。"""
