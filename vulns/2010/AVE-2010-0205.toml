[basic]
description = "OpenOffice.org 的 oowriter 组件在处理特制 RTF 文档中的标签时存在释放后使用漏洞。攻击者可构造恶意 RTF 文件，诱导用户使用 OOo 2.x 或 3.3 之前版本打开，触发已释放内存的访问，导致应用程序崩溃或执行任意代码。该漏洞影响范围广泛，CVSS 评分 9.3，危害严重。用户应升级至 OpenOffice.org 3.3 或更高版本以修复此漏洞。"
published = "2011-01-28T22:00:05Z"
remediation = "升级 OpenOffice.org 至 3.3 或更高版本（已在 2011 年 1 月 Oracle CPU 中修复），或迁移至持续维护的 Apache OpenOffice 4.x / LibreOffice 7.x。临时缓解：禁止打开来源不明的 RTF 文档，配置邮件/网关拦截 .rtf 附件，启用 DEP/ASLR 降低利用成功率。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apache OpenOffice oowriter RTF文档处理释放后使用漏洞"
updated = "2026-06-16T23:22:48Z"

