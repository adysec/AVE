[basic]
description = "imcat 4.4 存在敏感信息泄露漏洞，远程攻击者可通过直接访问 `root/tools/adbug/binfo.php?phpinfo1` 路径获取服务器 PHP 配置信息（phpinfo），该页面未进行任何身份验证或访问控制。phpinfo 输出中包含了服务器环境变量、系统路径、已安装的 PHP 扩展及版本等敏感信息，攻击者可利用这些信息进一步探测服务器配置弱点，为后续攻击提供情报支撑。攻击条件简单，无需任何权限，仅需目标系统运行 imcat 4.4 且该调试页面未被删除或限制访问。"
published = "2018-12-30T21:29:00Z"
remediation = "立即删除或限制访问 `root/tools/adbug/binfo.php` 文件，该调试脚本不应存在于生产环境。升级 imcat 至最新版本（4.4 之后已修复此问题）。如无法升级，在 Web 服务器（Nginx/Apache）配置中添加规则拒绝访问 `/tools/adbug/` 路径，或移除整个 `tools/adbug/` 目录。同时禁用生产环境中的 `phpinfo()` 函数（在 php.ini 中将 `disable_functions` 加入 `phpinfo`）。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "imcat 4.4 信息泄露漏洞"
updated = "2026-06-17T01:53:10Z"

