[basic]
description = "McAfee WebShield SMTP 4.5 存在拒绝服务漏洞，远程攻击者可通过发送畸形的收件人字段触发该漏洞，导致 SMTP 服务崩溃或停止响应。该漏洞源于 WebShield SMTP 对邮件收件人字段输入验证不当，攻击者无需身份认证即可通过网络远程利用。影响范围为运行 WebShield SMTP 4.5 版本的邮件网关系统，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），属于可用性影响类漏洞。攻击条件仅需攻击者能够向目标 SMTP 服务器发送邮件数据，利用方式为构造包含特制格式的 RCPT TO 命令或收件人头字段，导致服务解析异常而拒绝服务。"
published = "2001-01-09T05:00:00.000"
remediation = "立即应用 Network Associates 官方补丁（参考 SecurityFocus BID 1999 及 archives.neohapsis.com 2000-11/0324 厂商公告）修复 WebShield SMTP 4.5 收件人字段拒绝服务漏洞，或将 WebShield SMTP 升级至已修复该漏洞的后续版本。临时缓解措施：在邮件网关上配置 SMTP 过滤器，拦截收件人字段中包含连续六个及以上 URL 编码空格（%20%20%20%20%20%20）的邮件会话，并在防火墙层限制未经授权的 SMTP 出站连接，防止攻击者利用恶意邮件触发服务崩溃。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Network Associates WebShield SMTP 4.5 远程拒绝服务漏洞"
updated = "2026-06-16T21:53:12.690"

