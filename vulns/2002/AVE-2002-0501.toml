[basic]
description = "HP CIFS/9000 Client A.01.06 及更早版本（基于 Sharity 软件包）中的 cifslogin 命令存在缓冲区溢出漏洞。本地攻击者可通过向 -U、-D、-P、-S、-N、-u 等参数传递超长字符串触发缓冲区溢出，成功利用后可获取 root 权限，完全控制受影响系统。该漏洞影响 HP CIFS/9000 Server A.01.05 和 A.01.06 版本，攻击需要本地访问权限，无需用户交互。"
published = "2002-10-04T04:00:00.000"
remediation = "升级 HP CIFS/9000 Client 至 A.01.06 之后的安全版本（厂商已发布补丁，详见 ISS 公告 X-Force ID 9431）。如无法升级，立即限制 cifslogin 命令的本地用户执行权限，仅授权管理员使用，并通过文件系统权限将 cifslogin 的 setuid 位移除，防止普通用户提权至 root。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "HP CIFS/9000 Client 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:58:31.540"

