[basic]
description = "Evince 文档查看器的 DVI 后端组件中的 PK 字体解析器存在数组索引错误漏洞。攻击者可通过构造特制的字体文件并嵌入 DVI 文档中，当用户使用 Evince 的缩略图生成器处理该文档时，触发数组越界访问，导致函数指针覆盖，最终造成任意代码执行。该漏洞影响 Evince 2.32 及更早版本，CVSS 评分 7.6，危害等级高。用户应升级至 Evince 3.0 或更高版本以修复此漏洞。"
published = "2011-01-07T19:00:17Z"
remediation = "升级 Evince 至 2.30.3 及以上版本（Debian 对应 2.30.3-2，Red Hat 对应 RHSA-2011-0009 补丁）。如无法升级，避免使用 Evince 打开来源不明的 DVI 文件，或禁用 DVI 缩略图预览功能作为临时缓解措施。"
score = 7.6
severity = "HIGH"
sources = ["tenable"]
title = "GNOME Evince DVI后端PK字体解析器远程代码执行漏洞"
updated = "2026-06-16T23:21:08Z"

