[basic]
description = "SuSE Linux 6.x 及 7.0 版本中的 rctab 脚本在处理目录创建错误时存在竞争条件漏洞。该脚本创建临时文件 rctmp 的方式存在安全隐患，本地攻击者可在 rctab 创建临时文件与写入内容之间的时间窗口内，通过符号链接（symlink）将 rctmp 指向任意目标文件，从而实现对任意文件的创建或覆盖。攻击者需要具备本地登录权限才能利用此漏洞，利用难度较高（需竞态条件）。成功利用该漏洞可导致敏感文件被篡改或覆盖，进而可能获得提权或其他进一步攻击路径。该漏洞影响 SuSE Linux 7.0 及更早版本，CVSS 评分为 1.2，危害等级较低。"
published = "2001-03-12T05:00:00.000"
remediation = "升级到已修复该漏洞的 SuSE Linux 版本（SuSE 7.1 或更高版本），或应用 SuSE 官方安全补丁更新 rctab 脚本，将其临时目录创建方式从可预测的 rctmpdir.[pid] 路径改为使用 mktemp 生成不可预测的临时目录，同时确保 /tmp 目录权限为 1777（sticky bit），防止普通用户删除或替换其他用户的临时文件。"
score = 1.2
severity = "LOW"
sources = ["epss"]
title = "SUSE Linux rctab 符号链接竞争条件本地文件覆盖漏洞"
updated = "2026-06-16T21:53:40.360"

