[basic]
description = "标签中输出这个描述。<value>Adobe ColdFusion 存在路径遍历漏洞（CWE-22），由于对文件路径的限制不完善，低权限远程攻击者可通过构造包含目录遍历序列的恶意请求，绕过安全限制访问受限目录之外的敏感文件或目录。该漏洞影响 ColdFusion 2023.18、2025.6 及更早版本，攻击无需用户交互且攻击复杂度低。成功利用可导致安全特性被绕过，造成未授权访问或信息泄露。"
published = "2026-04-14T22:16:31.680"
remediation = "ColdFusion 2025 用户应升级至 Update 7，ColdFusion 2023 用户应升级至 Update 19。如无法立即升级，可在防火墙或反向代理层面限制对 ColdFusion 管理界面和内部路径的访问，或临时禁用不必要的目录映射作为缓解措施。"
score = 7.7
severity = "HIGH"
sources = ["zdi"]
title = "Adobe ColdFusion 路径遍历漏洞"
updated = "2026-07-24T22:10:00.140"

