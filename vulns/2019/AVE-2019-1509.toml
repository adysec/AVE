[basic]
description = "Sonatype Nexus Repository Manager 3 的 coreui_Component 组件存在访问控制缺陷，未经身份认证的远程攻击者可通过向 /service/extdirect 接口发送特制的 POST 请求，利用 OrientDB 自定义函数功能注入恶意 JEXL 表达式，从而在目标服务器上执行任意系统命令。该漏洞影响 3.15.0 之前的所有 Nexus Repository Manager OSS/Pro 版本，攻击无需任何认证或用户交互，利用复杂度低，CVSS 评分 9.8，危害等级严重。"
published = "2019-03-21T17:29:01Z"
remediation = "立即升级 Sonatype Nexus Repository Manager 至 3.15.0 或更高版本。如无法立即升级，可通过反向代理或 WAF 规则限制对 /service/extdirect 路径的访问，仅允许可信 IP 调用该接口，并禁用不必要的 extdirect 功能模块作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Sonatype Nexus Repository Manager 3 远程命令执行漏洞"
updated = "2026-06-17T02:40:18Z"

