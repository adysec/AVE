[basic]
description = "Mandrake Linux 6.1/7.0/7.1 系统中安装的 Apache mod_perl 模块存在配置缺陷，默认情况下 /perl/ 目录被设置为可浏览状态，攻击者无需身份验证即可远程获取该目录下的文件列表。该漏洞影响 Mandrake 6.1 到 7.1 版本，通过向目标服务器发送简单的 HTTP 请求即可触发，攻击者可借此获取服务器的 Perl 模块路径、内部文件结构等敏感信息，可能为进一步攻击提供情报支持。该漏洞的 CVSS 评分 5.0，CVSS 向量为 AV:N/AC:L/Au:N/C:P/I:N/A:N，安全性等级中等，对系统保密性造成部分影响，对完整性和可用性影响不大。"
published = "2000-11-14T05:00:00.000"
remediation = '建议升级至 Mandrake Linux 7.2 或更高版本，或升级 Apache/mod_perl 至修复版本。若无法立即升级，请编辑 Apache 配置文件（httpd.conf 或 perl.conf），在 <Directory /perl> 区域添加 "Options -Indexes" 禁用目录浏览，重启 Apache 生效。临时缓解可在防火墙层面限制 /perl 目录访问。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Mandrake Linux mod_perl Apache HTTP目录遍历漏洞"
updated = "2026-06-16T21:52:40.130"

