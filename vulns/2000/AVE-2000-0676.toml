[basic]
description = 'Armada Master Index 1.0 的 search.cgi CGI 脚本存在目录遍历漏洞，远程攻击者可通过向 "catigory" 参数提交包含 ".."（点点）序列的恶意请求，绕过路径限制读取服务器上的任意文件。该漏洞无需身份认证即可利用，攻击复杂度低，可导致敏感信息泄露。Exploit-DB 已公开该漏洞的利用代码。'
published = "2000-12-19T05:00:00.000"
remediation = '由于 Armada Design Master Index 1.0 已停止维护，官方不再提供补丁。建议在 search.cgi 中对 "catigory" 参数进行严格过滤，移除 "../" 等目录遍历字符序列，并限制仅允许访问指定目录下的文件。更彻底的方案是替换为仍受支持的 Web 应用或自行重写 search.cgi 脚本，在代码层面使用白名单机制限定可访问文件路径。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Armada Design Master Index 1.0 目录遍历漏洞"
updated = "2026-06-16T21:52:46.660"

