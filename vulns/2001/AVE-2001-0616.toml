[basic]
description = "NetBSD 1.5 及 FreeBSD 4.2 及更早版本中使用的 Kerberos 4 认证库 libkrb 的 kdc_reply_cipher 函数存在缓冲区溢出漏洞。当该库被集成到 telnetd、login 等 Kerberized 应用程序中时，本地攻击者可通过向该函数发送特制的认证响应数据触发缓冲区溢出，覆盖内存中的关键数据结构，从而获取 root 权限。该漏洞影响范围包括 NetBSD 和 FreeBSD 系统上所有依赖 libkrb 进行 Kerberos 认证的服务程序，CVSS 评分 7.2，危害等级高。利用该漏洞需要本地系统访问权限，但无需身份认证即可触发。"
published = "2001-02-12T05:00:00.000"
remediation = "FreeBSD 用户应升级至 4.2-STABLE（2000-12-13 之后）或 3.5-STABLE（2000-12-15 之后），或下载 FreeBSD-SA-01:25 补丁后执行 `cd /usr/src && patch -p < 补丁文件 && cd /usr/src/kerberosIV && make depend && make all install && cd /usr/src/libexec/telnetd && make depend && make all install` 重新编译 libkrb 和 telnetd。NetBSD 1.5 用户应升级至 2000-12-15 之后的分支版本，或下载 20001220-krb 补丁后重新编译 libkrb 和 telnetd。临时缓解措施：在 `/etc/inetd.conf` 中注释掉 telnet 服务行并重启 inetd 以禁用远程利用入口。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "NetBSD 和 FreeBSD Kerberos 4 认证库缓冲区溢出漏洞"
updated = "2026-06-16T21:53:38.660"

