[basic]
description = "Labcenter Electronics Proteus 软件在处理 PDSPRJ 文件时存在越界写入漏洞，源于对用户提交数据缺乏充分验证，导致写入操作超出已分配缓冲区的边界。攻击者可通过构造恶意 PDSPRJ 文件或包含该文件的恶意网页，诱导受害者打开文件或访问页面来触发漏洞，成功后可利用在当前进程上下文中执行任意代码。该漏洞影响 Labcenter Electronics Proteus 所有受影响版本，CVSS 评分为 7.8（高危），攻击条件为本地访问且需用户交互。"
published = "2026-04-11T01:16:18.563"
remediation = "立即将Labcenter Electronics Proteus升级至9.x版本，该版本已修复PDSPRJ文件解析越界写入漏洞。若无法升级，应禁止打开来源不明的PDSPRJ文件，并在防火墙层面限制Proteus进程的网络出站连接，以降低远程代码执行风险。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Labcenter Electronics Proteus PDSPRJ 文件解析越界写入远程代码执行漏洞"
updated = "2026-06-17T10:59:07.280"

