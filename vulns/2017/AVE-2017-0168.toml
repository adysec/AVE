[basic]
description = "Jenkins CI 存在反序列化远程代码执行漏洞，未经身份认证的远程攻击者可通过 Jenkins CLI 向目标服务器发送特制的 Java `SignedObject` 序列化对象，该对象在反序列化过程中绕过了原有的黑名单防护机制，导致远程代码执行。该漏洞影响 Jenkins 2.56 及更早版本以及 2.46.1 LTS 及更早版本，CVSS 评分 9.8，危害等级严重。攻击者无需任何认证即可利用该漏洞完全控制目标 Jenkins 服务器，获取敏感信息、篡改数据或植入后门。官方通过将 `SignedObject` 加入黑名单并默认禁用基于 Java 序列化的 CLI 协议进行修复。"
published = "2018-01-29T17:29:00.193"
remediation = "升级 Jenkins 至 2.46.2 LTS 或 2.54 及以上版本；如无法升级，在 Jenkins 启动参数中添加 -Djenkins.CLI.disabled=true 禁用 CLI 协议，或在反向代理层限制 /cli 路径的访问。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Jenkins CI 反序列化远程代码执行漏洞"
updated = "2026-06-17T00:59:00.597"

