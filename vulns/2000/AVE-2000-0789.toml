[basic]
description = "Novell BorderManager 的 ClientTrust 程序未正确验证身份验证请求的来源，攻击者可通过重放来自目标主机 3024 端口的身份验证请求与响应，冒充其他用户身份。该漏洞允许远程未经身份认证的攻击者实施用户冒充，影响 Novell BorderManager 软件的相关版本，CVSS 评分为 7.5，危害等级为高危。"
published = "2000-07-07T04:00:00Z"
remediation = "升级 Novell BorderManager 至最新补丁版本，限制对 TCP 3024 端口的访问仅允许受信任的内部网络 IP，在防火墙上添加规则阻止外部对 3024 端口的访问。如产品已停止支持，建议迁移至 Micro Focus 当前支持的替代产品，并启用加密认证机制防止重放攻击。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Novell BorderManager 认证请求重放用户冒充漏洞"
updated = "2026-06-16T21:52:11Z"

