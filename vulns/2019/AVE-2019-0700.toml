[basic]
description = "Palo Alto Networks PAN-OS 的 GlobalProtect Portal 或 GlobalProtect Gateway 接口存在输入验证错误漏洞（CWE-134：外部可控格式字符串），未经身份认证的远程攻击者可通过向目标设备的 GlobalProtect 服务发送特制请求触发该漏洞，导致远程代码执行。该漏洞影响 PAN-OS 7.1.18 及更早版本、PAN-OS 8.0.11-h1 及更早版本、PAN-OS 8.1.2 及更早版本，CVSS 评分 8.1，危害等级高。Palo Alto Networks 已在 PAN-OS 7.1.19、8.0.12、8.1.3 及更高版本中修复此漏洞。"
published = "2019-07-19T22:15:11Z"
remediation = "立即将 PAN-OS 升级至 7.1.19 及以上、8.0.12 及以上或 8.1.3 及以上版本。如无法立即升级，请将威胁防护内容更新至 8173 或更高版本，并确保在 GlobalProtect 门户和网关接口的流量上启用并强制执行威胁预防策略。该漏洞已被 CISA 列入已知被利用漏洞目录，应优先修复。"
score = 8.1
severity = "HIGH"
sources = ["kev"]
title = "Palo Alto Networks PAN-OS 远程代码执行漏洞"
updated = "2026-06-17T02:28:47Z"

