[basic]
description = "GTK+ 1.2.8 库中存在任意模块加载漏洞。本地用户可通过设置 GTK_MODULES 环境变量指定任意共享模块，当 GTK+ 被 setuid/setgid 程序使用时，该环境变量会被继承，导致以提升后的权限加载并执行攻击者指定的恶意模块，实现本地权限提升。攻击者需拥有本地账户且目标系统上存在使用 GTK+ 的 setuid/setgid 程序。CVSS 评分 7.2，危害等级高。"
published = "2001-02-12T05:00:00Z"
remediation = "移除所有使用 GTK+ 1.2.8 的 setuid/setgid 程序的 suid 位（chmod u-s /path/to/program），改用非特权 GUI 前端通过管道与特权后端通信的架构。如无法立即重构，可在启动脚本中执行 unset GTK_MODULES 或在系统层面通过 pam_env 禁止该环境变量传递给 setuid 程序。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "GTK+ 任意可加载模块执行漏洞"
updated = "2026-06-16T21:53:37Z"

