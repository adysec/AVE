[basic]
description = "Allaire JRun 2.3 服务器中的 SSIFilter servlet 存在目录遍历漏洞，远程攻击者无需身份认证即可通过构造包含特殊路径序列（如 ../）的 HTTP 请求，利用 SSIFilter 对文件路径的过滤缺陷，突破目录限制读取服务器上的任意文件。该漏洞可导致敏感配置文件、源代码等机密信息泄露，攻击复杂度低，仅需网络可达即可利用。受影响的版本为 Allaire JRun 2.3。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级到 Allaire JRun 3.0 或更高版本（已修复此漏洞），或按照 Allaire 安全公告 ASB00-28 安装官方补丁。由于 JRun 2.3 已停止维护，建议迁移至 Adobe ColdFusion 或其他受支持的 Java 应用服务器。临时缓解措施：在 Web 服务器层面（如 Apache/IIS）配置 URL 重写规则，阻止对 /servlet/com.livesoftware.jrun.plugins.ssi.SSIFilter/ 路径的访问，或直接删除 SSIFilter servlet 的映射配置。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Allaire JRun 服务器目录遍历漏洞"
updated = "2026-06-16T21:53:03Z"

