[basic]
description = "IBM AIX 4.3.x 及更早版本中的 digest 命令存在缓冲区溢出漏洞。本地攻击者可通过向 digest 命令传入特制的参数触发缓冲区溢出，从而在目标系统上以 root 权限执行任意命令。该漏洞影响 IBM AIX 4.3 系列操作系统，攻击者需拥有本地系统访问权限才能利用，CVSS 评分 7.2，危害等级高。目前已有公开的本地缓冲区溢出利用代码。"
published = "2001-01-09T05:00:00.000"
remediation = "立即安装 IBM APAR IY17249 修复 digest 命令缓冲区溢出问题，或升级 AIX 系统至 4.3.3 及以上维护版本。如无法立即打补丁，可临时移除 /usr/lib/lpd/digest 文件的 setuid 权限（chmod u-s /usr/lib/lpd/digest），限制非授权用户执行该命令作为缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "IBM AIX 4.3 digest 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:53:11.420"

