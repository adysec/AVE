[basic]
description = "Adobe Flash Player 21.0.0.197及之前版本中存在高危漏洞，远程攻击者可通过构造特制的Flash内容诱导用户访问，触发JIT Spraying攻击绕过地址空间布局随机化（ASLR）保护机制，进而导致应用程序崩溃或实现任意代码执行。该漏洞已在2016年4月被检测到在野利用，影响Windows、macOS、Linux等多个平台上的Flash Player。Adobe已在后续版本21.0.0.213中修复此漏洞。"
published = "2016-04-07T10:59:01Z"
remediation = "立即升级 Adobe Flash Player 至 21.0.0.213 及以上版本（Windows/Mac）或 11.2.202.616 及以上版本（Linux）。由于 Adobe 已于 2020 年 12 月 31 日停止 Flash Player 支持并推荐卸载，建议彻底卸载 Flash Player 组件，并在浏览器中禁用 Flash 插件，同时通过组策略或注册表禁用 Flash 执行权限以彻底消除风险。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Adobe Flash Player 远程代码执行漏洞"
updated = "2026-06-17T00:41:08Z"

