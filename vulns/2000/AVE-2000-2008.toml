[basic]
description = "HP-UX 11.00 及更早版本中 auto_parms 和 set_parms 组件存在漏洞，远程未授权攻击者可通过发送特制请求触发缓冲区溢出或输入验证缺陷，导致任意代码执行或拒绝服务。该漏洞 CVSS 评分 10.0（AV:N/AC:L/Au:N/C:C/I:C/A:C），影响范围覆盖所有运行 HP-UX 11.00 及更早版本的系统，攻击无需认证且网络可远程利用，危害等级极其严重。HP 官方已发布补丁修复此问题。"
published = "2001-01-09T05:00:00.000"
remediation = "建议升级 HP-UX 至 11.00 后续安全补丁版本（如 PHNE_19783、PHCO_18483 等官方补丁）或迁移至 HP-UX 11i (11.11) 及以上版本。若暂时无法升级，可通过删除或限制 auto_parms 和 set_parms 程序的执行权限（chmod 000 /usr/sbin/auto_parms /usr/sbin/set_parms），并配置防火墙限制相关服务端口的外部访问作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "HP HP-UX 远程代码执行漏洞"
updated = "2026-06-16T21:53:12.257"

