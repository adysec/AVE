[basic]
description = "Big Brother 监控系统 1.4h2 及更早版本的默认配置中缺少适当的访问控制限制，导致远程攻击者可通过 bbd 组件上传具有可执行扩展名的文件，该文件随后被 Web 服务器作为 CGI 脚本执行，从而实现任意命令执行。攻击者无需身份认证即可远程利用，可完全控制受影响系统。该漏洞影响 Big Brother 1.0/1.3/1.4 等多个版本，CVSS 评分 7.5，危害等级高。"
published = "2000-06-11T04:00:00.000"
remediation = '升级 Big Brother 至 1.4h3 或更高版本（如已不可获取，建议迁移至 Nagios、Zabbix 等现代监控系统）。在 Web 服务器配置中禁止执行 `bb/logs/` 目录下的 CGI 脚本，例如 Apache 中设置 `<Directory "/path/to/bb/logs"> Options -ExecCGI -Includes </Directory>`。限制 `bbd` 服务的访问来源 IP，仅允许受信任的监控客户端连接。删除 `bb/logs/` 目录中非预期的 `.php`、`.cgi`、`.pl` 等可执行文件。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Sean MacGuire Big Brother 默认配置权限不足导致远程命令执行漏洞"
updated = "2026-06-16T21:52:09.987"

