[basic]
description = "WFTPD 2.4.1 RC11 及 WFTPD Pro 2.41 存在路径信息泄露漏洞。远程攻击者无需身份认证，只需在文件传输过程中向 FTP 服务器发送 STATUS（STAT）命令，即可获取被传输文件在服务器上的真实绝对路径名。该漏洞利用条件低，攻击者通过网络即可触发，可能导致服务器目录结构等敏感信息泄露，为进一步攻击提供信息支撑。CVSS 评分 5.0，危害等级中等。"
published = "2000-07-21T04:00:00Z"
remediation = "立即升级 WFTPD/WFTPD Pro 至 2.41 以上版本（官方已修复此漏洞）。由于该产品已停止维护，建议迁移至现代 FTP 服务器（如 FileZilla Server 或 vsftpd）。临时缓解措施：在防火墙限制 FTP 服务仅允许可信 IP 访问，并禁用匿名用户执行 STAT 命令的权限。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Texas Imperial Software WFTPD 文件传输路径信息泄露漏洞"
updated = "2026-06-16T21:52:10Z"

