[basic]
description = 'Hassan Consulting Shopping Cart 1.23 的 shop.pl 脚本存在任意命令执行漏洞，远程攻击者可通过向 "page" 参数注入 shell 元字符（如分号、管道符等）实现任意系统命令执行。该漏洞无需身份认证即可远程利用，攻击者可借此完全控制目标服务器，获取敏感数据或植入后门。目前已有公开的 ExploitDB 利用代码，危害严重。'
published = "2001-09-08T04:00:00Z"
remediation = "立即升级 Hassan Consulting Shopping Cart 至 1.34 或更高版本（1.34 已包含安全修复，1.40 进一步增强了安全性）。如无法升级，在 Web 服务器（Apache）层面通过 mod_rewrite 或 mod_security 规则过滤 shop.pl 的 page 参数中的 shell 元字符（| ; ` $ 等），或限制 /cgi-local/ 目录仅允许 GET 请求并禁用 CGI 脚本的执行权限作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Hassan Consulting Shopping Cart 1.23 任意命令执行漏洞"
updated = "2026-06-16T21:55:21Z"

