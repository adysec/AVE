[basic]
description = "FreeBSD 操作系统的 procfs 文件系统对每个进程的 mem 和 ctl 文件访问控制存在缺陷，本地攻击者可通过 fork 子进程并在子进程中执行特权程序，同时父进程保留对子进程地址空间的访问权限，从而利用该缺陷读取或修改子进程内存，最终实现本地权限提升至 root 级别。该漏洞影响 FreeBSD 及可能其他使用 procfs 的操作系统，攻击者需具备本地用户权限，无需额外认证即可利用。"
published = "2001-02-12T05:00:00Z"
remediation = "立即升级 FreeBSD 至修复版本（含 FreeBSD-SA-00:77 补丁的版本），或从 ftp://ftp.FreeBSD.org/pub/FreeBSD/CERT/advisories/FreeBSD-SA-00:77.procfs.v1.1.asc 获取并应用补丁。如无法升级，在 /etc/fstab 中将 procfs 行注释掉或添加 `noexec` 选项后重启，或卸载 procfs（`umount /proc`）并移除自动挂载配置以彻底禁用 procfs 文件系统，消除本地提权路径。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "FreeBSD procfs 权限许可和访问控制漏洞"
updated = "2026-06-16T21:53:34Z"

