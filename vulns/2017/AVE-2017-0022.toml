[basic]
description = "Microsoft Windows SMBv1 服务器存在远程代码执行漏洞，攻击者通过向目标系统发送特制的 SMBv1 数据包即可触发该漏洞，无需用户交互。该漏洞影响 Windows Vista SP2、Windows Server 2008 SP2/R2 SP1、Windows 7 SP1、Windows 8.1、Windows Server 2012 Gold/R2、Windows RT 8.1、Windows 10 Gold/1511/1607 及 Windows Server 2016 等多个版本。成功利用此漏洞的攻击者可完全控制目标系统，实现安装程序、查看/更改/删除数据或创建新帐户等操作。该漏洞与 CVE-2017-0143、CVE-2017-0144、CVE-2017-0146 和 CVE-2017-0148 不同，CVSS 评分 8.8，危害等级高。此漏洞已被广泛用于勒索软件（如 WannaCry）和蠕虫传播，影响极其深远。Microsoft 已在 2017 年 3 月安全更新 MS17-010 中修复此漏洞。"
published = "2017-03-17T00:59:04Z"
remediation = '立即安装 Microsoft 2017 年 3 月安全更新 MS17-010（KB4012212/KB4012215），可通过 Windows Update 自动获取。如无法打补丁，在注册表中将 SMBv1 禁用（HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters，将 SMB1 DWORD 值设为 0），并在防火墙层面阻止 TCP 139/445 端口的入站连接作为临时缓解措施。'
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows SMBv1 远程代码执行漏洞"
updated = "2026-06-17T00:57:09Z"

