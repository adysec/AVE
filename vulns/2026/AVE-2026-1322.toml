[basic]
description = "Quest NetVault Backup 的 NVBULogDaemon 组件在处理 JSON-RPC 消息时存在命令注入漏洞。由于缺乏对用户提供字符串的充分验证即将其用于执行系统调用，攻击者可通过发送特制的 JSON-RPC 请求触发该漏洞。虽然利用此漏洞需要身份验证，但现有认证机制可被绕过。成功利用后，攻击者可在 SYSTEM 上下文中执行任意代码，从而完全控制目标系统。该漏洞影响 Quest NetVault Backup 的多个版本，CVSS 评分为 8.8，危害等级为高。"
published = "2026-06-25T00:17:48Z"
remediation = "建议立即将 Quest NetVault Backup 升级至 14.0.2 或更高版本以修复 NVBULogDaemon 命令注入漏洞。如暂无法升级，请在防火墙或主机 ACL 中限制 NVBULogDaemon 服务的 JSON-RPC 端口仅对可信管理网段开放，并临时禁用不必要的远程日志管理功能以降低暴露面。升级前请备份 NetVault 数据库与配置，升级后验证 NVBULogDaemon 服务正常运行并审查系统日志是否存在异常调用记录。"
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "Quest NetVault Backup NVBULogDaemon 命令注入远程代码执行漏洞"
updated = "2026-06-26T05:16:32Z"

