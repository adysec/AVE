[basic]
description = "Nortek Security & Control 旗下 Linear eMerge E3-Series 门禁考勤管理系统存在路径遍历漏洞。攻击者无需身份认证即可通过向 Web 管理界面发送包含目录遍历序列（如 ../../../../）的特制请求，构造恶意 URL 参数（如 `?c=` 或 `tpl=` 参数），实现对服务器本地敏感文件的非法读取，例如获取 `/etc/passwd`、`/etc/version` 等系统文件内容。该漏洞影响 eMerge E3 固件 1.00-06 等版本，利用门槛低且攻击成功率高，可导致敏感信息泄露，进而为攻击者进一步渗透内网提供基础。"
published = "2019-07-02T19:15:11Z"
remediation = "将 Linear eMerge E3-Series（Elite 和 Essential）设备固件升级至 Nortek Security & Control 发布的修复版本（受影响版本为 1.00-06 及之前所有版本），升级方法为通过设备 Web 管理界面上传官方固件包完成。如厂商暂未提供补丁版本，应在网络边界防火墙或路由器上限制对设备 Web 管理端口（通常为 80/443）的访问来源，仅允许可信管理网段 IP 连接，同时通过 VPN 进行远程管理，避免将设备直接暴露于互联网。此外，建议在设备前部署 WAF 或反向代理，过滤包含 `../` 或 `%00` 等路径遍历特征的请求，并在核心交换机上配置 ACL 阻断来自不可信源地址的 HTTP 请求到达该设备。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Nortek Security Linear eMerge E3-Series 路径遍历漏洞"
updated = "2026-06-17T02:40:19Z"

