[basic]
description = "Drupal RESTful API 模块对非表单来源的数据反序列化时未正确过滤用户输入，导致存在反序列化漏洞。远程攻击者可在启用了 RESTful Web Services 模块（或 JSON:API 等第三方 Web 服务模块）的 Drupal 8.5.x（低于 8.5.11）及 8.6.x（低于 8.6.10）版本上，通过向 REST API 端点发送特制的 PATCH 或 POST 请求，触发 PHP 对象反序列化，从而在目标服务器上执行任意 PHP 代码，实现完全控制。该漏洞无需认证即可利用，但需要目标开启相关 Web 服务模块。"
published = "2019-02-21T21:29:00Z"
remediation = "立即升级 Drupal 8.5.x 至 8.5.11 版本，或 8.6.x 至 8.6.10 及以上版本。如无法立即升级，可临时禁用 RESTful Web Services (rest) 模块或限制 PATCH/POST 请求的访问权限。同时检查并更新 JSON:API 等第三方 Web 服务模块至安全版本。"
score = 8.1
severity = "HIGH"
sources = ["kev"]
title = "Drupal RESTful API 远程代码执行漏洞"
updated = "2026-06-17T02:39:02Z"

