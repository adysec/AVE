[info]
author = "ave"
description = "检测 Google Chrome 49.0.2623.108 之前版本中 V8 引擎 Array.prototype.concat 的越界读取漏洞。通过构造包含自定义原型属性的数组，触发 concat 操作时因元素数据类型检查不完善导致越界读取。PoC 代码来自 tunz/js-vuln-db 和 lcatro/browser_vuln_check 公开仓库。"
id = "POC-AVE-2016-0111"
name = "Google Chrome V8 Array.prototype.concat 越界读取漏洞 PoC"
severity = "high"
tags = ["ave-2016-0111"]
vuln_id = [
    "CVE-2016-1646",
    "AVE-2016-0111",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cve-2016-1646-poc.html"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["CVE-2016-1646"]
