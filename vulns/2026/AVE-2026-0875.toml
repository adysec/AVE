[basic]
description = "Composer（PHP 依赖管理器）在调试日志输出中存在敏感信息泄露漏洞。当以 -vvv（调试详细级别）运行时，内嵌在仓库或包 URL 用户名位置中的凭据（如 GitHub 个人访问令牌，格式为 https://TOKEN@host/）会以明文形式输出到调试日志中。此前 Composer 已对 URL 中的密码部分进行脱敏处理，但用户名部分未做处理，导致嵌入在用户名位置的令牌被完整记录。该漏洞仅影响满足以下所有条件的场景：凭据直接嵌入在 composer.json 的 repositories 条目或包 dist/source URL 中（而非通过 auth.json 或 COMPOSER_AUTH 环境变量提供），且 Composer 以 -vvv 级别运行，调试输出被保留或分享（如公开 CI 构建日志、粘贴到 issue 或聊天中的输出、存档的终端会话等）。攻击者若能获取这些调试日志，即可窃取 GitHub 个人访问令牌等敏感凭据，进而访问受保护的代码仓库。该漏洞 CVSS 评分 4.7，危害等级中危，已在 Composer 2.2.29 和 2.10.2 版本中修复。"
published = "2026-07-08T20:16:59.843"
remediation = "立即升级 Composer 至 2.10.2 或 2.2.29 及以上版本，该漏洞已在上述版本中修复。如无法立即升级，避免在输出会被捕获或共享的环境中使用 -vvv 调试模式运行 Composer，并将凭据从 URL 中移出至 auth.json 或 COMPOSER_AUTH 环境变量管理，同时检查并清理可能已泄露令牌的 CI 构建日志。"
score = 4.7
severity = "MEDIUM"
sources = ["ghsa"]
title = "Composer 调试日志凭据泄露漏洞"
updated = "2026-07-10T19:10:59.333"

