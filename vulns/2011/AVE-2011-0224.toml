[basic]
description = "Apple QuickTime 在处理特制影片文件中的 rdrf atom 时存在 off-by-one 缓冲区溢出漏洞。远程攻击者可向目标用户发送包含恶意 rdrf atom 的构造影片文件，当用户使用 QuickTime 打开该文件时触发缓冲区溢出，导致任意代码执行或应用程序崩溃。该漏洞影响 Apple Mac OS X 10.7.3 之前版本及 QuickTime 7.7.2 之前版本，攻击需诱导用户打开恶意文件，CVSS 评分 6.8，危害等级中危。"
published = "2012-02-02T18:55:01Z"
remediation = "升级 Apple QuickTime 至 7.7.2 或更高版本（Mac OS X 10.7.3 及以上系统已包含修复版本），可通过 Apple 软件更新功能或从 Apple 官网下载安装。如无法立即升级，建议在浏览器中禁用 QuickTime 插件，并避免打开来源不明的 .mov/.mp4 多媒体文件。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple QuickTime rdrf原子处理越界写入远程代码执行漏洞"
updated = "2026-06-16T23:33:19Z"

