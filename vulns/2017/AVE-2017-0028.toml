[basic]
description = "XOOPS Core 2.5.8 的 /modules/profile/index.php 页面存在 URL 重定向绕过漏洞。由于对用户输入的 URL 过滤不严，攻击者可通过构造特制的重定向参数绕过过滤机制，将用户引导至恶意外部站点。攻击者利用该漏洞可实施钓鱼攻击，诱导用户访问仿冒页面从而窃取敏感信息。该漏洞攻击复杂度低，无需身份认证，但需要用户交互触发，CVSS 评分 6.1，危害等级中危。"
published = "2017-08-02T05:29:00Z"
remediation = "立即将 XOOPS Core 升级到 2.5.9 或更高版本，该版本已修复 /modules/profile/index.php 中 xoops_redirect 参数 URL 过滤绕过问题。如无法立即升级，可临时禁用 User Profile 模块，或在 Web 服务器（如 Nginx/Apache）层面添加规则拦截包含异常 xoops_redirect 参数的请求。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "XOOPS XOOPS Core URL重定向漏洞"
updated = "2026-06-17T01:02:45Z"

