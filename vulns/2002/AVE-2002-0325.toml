[basic]
description = 'KDE LISa 守护进程存在多个缓冲区溢出漏洞，影响 KDE 2.x 2.1 及后续版本、KDE 3.x 3.0.4 之前版本。攻击者可通过向 lisa 守护进程发送特制数据，或诱导用户访问恶意构造的 "lan://" URL 触发漏洞，导致任意代码执行。该漏洞可被本地攻击者利用提升权限，亦可被远程攻击者在无需身份认证的情况下通过网络触发，CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），影响机密性、完整性和可用性。建议升级至 KDE 3.0.4 或更高版本修复。'
published = "2002-11-29T05:00:00Z"
remediation = "升级 KDE 到 3.0.4 或更高版本（已修复 LISa 守护进程缓冲区溢出）。若暂时无法升级，建议停用并禁用 lisa 守护进程（通过系统服务管理器或删除 /etc/init.d/lisa 启动脚本），并在防火墙层面阻断相关端口访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "KDE LISa 缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:59:05Z"

