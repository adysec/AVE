[basic]
description = "Microsoft IIS 的 Phone Book 服务存在缓冲区溢出漏洞，远程攻击者可通过向该服务发送特制的请求触发缓冲区溢出，导致任意代码执行。该漏洞影响 Microsoft Windows NT 4.0 及 IIS 服务器，CVSS 评分 10.0，危害等级严重。攻击者无需身份认证即可远程利用，获取系统完全控制权限。Microsoft 已在 MS00-094 安全公告中发布补丁修复此漏洞。"
published = "2001-01-09T05:00:00.000"
remediation = "立即安装 Microsoft 官方补丁：Windows NT 4.0 用户下载 KB276575 补丁（https://www.microsoft.com/download/details.aspx?FamilyId=37B1473A-33E6-446A-BD16-39B85548CCC6），Windows 2000 用户下载对应补丁（https://www.microsoft.com/download/details.aspx?FamilyId=C2EFB014-BC57-4CAF-AD28-4E3E735E1934）。如无法打补丁，可在 IIS 管理器中卸载 Phone Book Service（该服务默认未安装，仅通过 NT 4 Option Pack 或 Windows 2000 可选网络组件安装），或限制对 IIS 服务器的网络访问。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Microsoft Windows NT Phone Book 服务缓冲区溢出漏洞"
updated = "2026-06-16T21:53:07.557"

