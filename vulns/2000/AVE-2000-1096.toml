[basic]
description = "CVE-2000-1123是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-01-09T05:00:00.000"
remediation = "立即安装 IBM AIX 对应版本的 APAR IY12638 安全补丁，将 AIX 4.3.x 升级至包含该补丁的最新维护级别（如 AIX 4.3.3 或更高版本），以修复 /usr/lib/lpd/pio/etc/pioout 命令中的缓冲区溢出漏洞。若暂时无法应用补丁，可临时移除 pioout 的 setuid 位（执行 chmod u-s /usr/lib/lpd/pio/etc/pioout）作为缓解措施，并限制本地用户对打印子系统的访问权限。订阅 aixserv@austin.ibm.com 的安全通知邮件列表以获取后续安全公告。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "IBM AIX pioout 命令缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:53:11.850"

