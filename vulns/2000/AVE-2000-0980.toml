[basic]
description = "Allaire Spectra 1.0.1 的管理界面工具存在未授权访问漏洞。远程攻击者无需身份认证即可通过网络访问该管理接口，进而读取或修改服务器的敏感配置信息，导致系统配置泄露或被篡改。攻击条件低，仅需目标系统开放管理界面端口即可利用，影响系统机密性和完整性。厂商已发布修复建议，建议升级至最新版本或限制管理界面的网络访问权限。"
published = "2000-11-14T05:00:00Z"
remediation = "建议立即升级 Allaire Spectra 至 1.0.2 或更高版本（厂商已发布安全补丁修复管理接口未授权访问问题）。如无法升级，应在防火墙或反向代理层面将管理接口（默认路径 /admin 或 /spectra/admin）的访问权限限制为仅可信内网 IP，禁止从公网直接访问该管理界面，同时删除或重命名服务器上不必要的管理工具脚本。"
score = 6.4
severity = "MEDIUM"
sources = ["avd"]
title = "Allaire Spectra 管理界面敏感配置信息泄露漏洞"
updated = "2026-06-16T21:52:37Z"

