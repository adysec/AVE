[basic]
description = "Windows 2000 的 Still Image Service（静止图像服务）存在缓冲区溢出漏洞。本地攻击者可通过向该服务发送特制的长 WM_USER 消息触发缓冲区溢出，从而获取系统级权限。该漏洞影响 Windows 2000 系统，攻击者需拥有本地访问权限，无需身份认证即可利用，成功利用后可完全控制受影响系统。Exploit-DB 上已有公开的利用代码。"
published = "2000-11-14T05:00:00.000"
remediation = 'Windows 2000 已停止安全更新，建议立即升级至受支持的 Windows 版本（如 Windows 10/11 或 Windows Server 2019+）。临时缓解措施：以管理员身份运行 `services.msc`，找到 Still Image Service，将启动类型改为"禁用"并停止该服务，同时在防火墙中阻止端口 137/138/139/445 的入站连接。'
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows 2000 Still Image Service 缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:52:36.020"

