[basic]
description = "VMware Workspace ONE Access、Access Connector、Identity Manager 及 Identity Manager Connector 等身份管理产品组件存在命令注入漏洞（CWE-78）。该漏洞位于管理配置器（Appliance Configurator）服务 8443 端口的 /cfg/ssl/installSelfSignedCertificate 端点，由于在调用后端命令执行逻辑时对用户可控的 san 参数过滤不严，攻击者可通过 POST 请求构造恶意参数将系统命令拼接执行。利用前提是能够访问配置器 8443 端口并持有 configurator admin 账户及密码，即需要高权限认证；攻击复杂度较低且无需用户交互，一旦成功即可在底层操作系统上以受影响服务权限执行任意命令，结合权限提升可能获得系统完全控制权。该漏洞波及 VMware 多个核心身份管理与单点登录组件，已被 CISA KEV 收录并证实于野利用，CVSS 评分 9.1，危害等级严重。VMware 已发布安全补丁（VMSA-2020-0027），建议立即升级受影响组件及配置器补丁并进行日志审计监控。"
published = "2020-11-23T22:15:12Z"
remediation = "该漏洞位于管理配置器（Administrator Configurator）端口 8443，攻击者需拥有 configurator admin 密码方可利用。请立即按 VMware 公告 VMSA-2020-0027 修复：将 Workspace ONE Access 升级到 20.01 或 20.10 版本，将 Identity Manager（vIDM）升级到 3.3.1、3.3.2 或 3.3.3 版本，并同步对 Access Connector / vIDM Connector 应用对应补丁（见 KB81754，于 2020-12-03 VMSA-2020-0027.2 修复）。若暂无法升级，可应用 KB81731 提供的工作区缓解措施：通过防火墙/安全组限制对配置器 8443 端口的网络访问，仅允许受信任的管理网段访问，并随即将部署时设置的默认 configurator admin 密码更换为高强度随机密码，同时启用管理与命令执行日志审计、监控异常管理员登录行为。由于该漏洞已被 CISA KEV 收录并在野外利用，须优先处理。"
score = 9.1
severity = "CRITICAL"
sources = ["kev"]
title = "VMware Workspace ONE Access 及 Identity Manager 命令注入漏洞"
updated = "2026-06-17T03:19:25Z"

