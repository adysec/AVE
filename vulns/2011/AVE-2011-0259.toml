Let me compose a proper description:

"Opera Web Browser 11.10 之前版本的 CSS 渲染引擎存在资源管理漏洞。远程攻击者可构造包含 CSS 伪类 :hover 与 transform 变换的浮动元素的恶意网页，当目标用户使用受影响版本的 Opera 浏览器访问该页面时，浏览器应用程序会崩溃，造成拒绝服务。该漏洞无需身份认证即可通过网络远程利用，攻击复杂度低。"

Let me check character count:
- Opera Web Browser 11.10 之前版本的 CSS 渲染引擎存在资源管理漏洞。(32 chars)
- 远程攻击者可构造包含 CSS 伪类 :hover 与 transform 变换的浮动元素的恶意网页，(33 chars)
- 当目标用户使用受影响版本的 Opera 浏览器访问该页面时，浏览器应用程序会崩溃，造成拒绝服务。(40 chars)
- 该漏洞无需身份认证即可通过网络远程利用，攻击复杂度低。(25 chars)

Total is well over 50 characters.

This covers:
1. Vulnerability principle: CSS rendering engine resource management vulnerability, triggered by :hover pseudo-class with transforms on floated elements
2. Impact scope: Opera before 11.10
3. Attack conditions: Remote attacker constructs malicious webpage, target visits with affected browser, no auth needed, network-based

The description is accurate, based on NVD data, and meets all requirements.<value>Opera Web Browser 11.10 之前版本的 CSS 渲染引擎存在资源管理漏洞，远程攻击者可构造包含 CSS 伪类 :hover 与 transform 变换的浮动元素的恶意网页，当目标用户使用受影响版本的 Opera 浏览器访问该页面时，触发浏览器应用程序崩溃，造成拒绝服务攻击。该漏洞无需身份认证即可通过网络远程利用，攻击复杂度低，CVSS v2 评分为 5.0，危害等级为中危，影响 Opera 11.10 之前的所有版本，Opera Software 已在 11.10 版本中修复此漏洞。"""
published = "2011-07-01T10:55:03Z"
