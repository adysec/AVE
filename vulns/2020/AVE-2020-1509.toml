[basic]
description = "VMware Fusion、VMware Remote Console for Mac 及 Horizon Client for Mac 存在权限提升漏洞，其根本原因是产品中 setuid 二进制文件使用不当。攻击者在已拥有目标系统普通用户权限的前提下，可通过构造符号链接和恶意服务脚本，诱导 setuid 二进制文件以 root 身份执行任意代码，从而将自身权限提升至系统 root 级别。该漏洞影响 VMware Fusion 11.x（低于 11.5.2 版本）、VMware Remote Console for Mac 11.x 及更早版本（低于 11.0.1）、Horizon Client for Mac 5.x 及更早版本（低于 5.4.0）。成功利用此漏洞后，攻击者可完全控制受影响的 macOS 系统，执行任意系统命令、修改敏感文件或横向移动。VMware 已在后续安全更新中修复此问题，受影响用户应升级至修复版本。"
published = "2020-03-17T19:15:12Z"
remediation = "立即升级 VMware Fusion 到 11.5.3、VMware Remote Console for Mac 到 11.0.1、Horizon Client for Mac 到 5.4.0；若 Fusion 已升级至 11.5.2，仍需额外应用 VMware KB78294 补丁方可完全修复。通过 VMware 官网下载页面获取更新版本安装，并重启受影响主机。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "VMware Fusion、VMRC及Horizon Client 权限提升漏洞"
updated = "2026-06-17T03:19:18Z"

