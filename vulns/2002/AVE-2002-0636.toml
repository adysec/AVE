remediation = "升级到 Microsoft MS03-010 补丁（KB331953）：Windows 2000 SP4 用户从微软官方下载并安装该补丁；Windows XP SP1 用户同样安装此补丁。Windows NT 4.0 微软未提供补丁，须在防火墙层面阻止 TCP 端口 135 的所有入站连接以阻断 RPC Endpoint Mapper 攻击面。Windows XP 用户启用 Internet Connection Firewall（ICF）可默认阻止入站 RPC 流量。"
