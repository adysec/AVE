[basic]
description = "PHP 的 pgsql 和 pdo_pgsql 扩展在调用底层引用函数对 SQL 字符串进行转义处理时，未对函数返回值进行错误检查。当转义函数因 PostgreSQL 服务器拒绝无效字符串而返回错误时，程序未正确处理该错误状态，可能导致应用程序发生崩溃。该漏洞影响 PHP 8.1.x（低于 8.1.33）、8.2.x（低于 8.2.29）、8.3.x（低于 8.3.23）以及 8.4.x 版本中使用 pgsql 或 pdo_pgsql 扩展的应用。攻击条件为：远程攻击者能够控制传入转义函数的 SQL 查询字符串内容，且 PostgreSQL 服务器因该字符串格式无效而拒绝接受。成功利用可导致应用程序拒绝服务，但不会直接造成数据泄露或权限提升。建议升级至 PHP 8.1.33、8.2.29、8.3.23 或更高版本以修复此漏洞。"
published = "2025-07-13T23:15:22Z"
remediation = "立即升级 PHP 至以下安全版本：PHP 8.1.33、8.2.29、8.3.23 或 8.4.11 及以上版本，修复 pgsql 与 pdo_pgsql 扩展在字符串转义时未检查底层 quoting 函数返回值的问题。对于使用操作系统包管理的系统，可通过 apt install php8.1-pgsql 或 yum update php-pgsql 安装对应安全补丁。如无法立即升级，应避免将未经严格校验的用户输入直接传入 pg_escape_string() 或 PDO::quote() 等转义函数，并在 PostgreSQL 服务端启用严格的字符串格式校验，以降低因服务器拒绝无效字符串导致 PHP 进程崩溃的风险。同时审查所有使用 pgsql/pdo_pgsql 扩展的代码路径，确保异常情况下不会触发未处理的段错误。"
score = 5.9
severity = "MEDIUM"
sources = ["msrc"]
title = "PHP pgsql扩展 SQL注入漏洞"
