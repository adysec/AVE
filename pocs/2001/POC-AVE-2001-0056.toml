[exploit]
exp_urls = ["https://www.exploit-db.com/exploits/20528"]
poc_urls = ["https://www.exploit-db.com/exploits/20528"]

[info]
author = "ave"
description = "检测 Windows Media Player 7.0 ActiveX 控件 JavaScript URL 远程代码执行漏洞。该漏洞允许远程攻击者通过构造包含 javascript: 协议的 URL，在 Internet Explorer 中执行任意命令。攻击者需诱导用户访问包含恶意 ActiveX 控件的网页，成功利用后可执行任意脚本或读取用户文件系统。"
id = "POC-AVE-2001-0056"
name = "CVE-2001-0148 PoC"
severity = "high"
tags = ["ave-2001-0056"]
vuln_id = [
    "CVE-2001-0148",
    "AVE-2001-0056",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "6BF52A52-394A-11D3-B153-00C04F79FAA6",
    "launchURL",
]
