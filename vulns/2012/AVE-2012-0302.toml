[basic]
description = "Apple Safari 浏览器在 6.0 版本之前所使用的 WebKit 渲染引擎存在内存破坏漏洞。远程攻击者可向目标用户发送或诱导其访问精心构造的恶意网页，当用户使用受影响的 Safari 版本打开该网页时，引擎在处理网页内容过程中触发内存损坏，从而导致远程代码执行或应用程序崩溃拒绝服务。该漏洞影响所有 Safari 6.0 之前的版本，攻击者无需任何身份认证即可通过网络远程发起攻击，成功利用后可完全控制用户系统并执行任意指令。"
published = "2012-07-25T20:55:02Z"
remediation = '立即升级 Safari 至 6.0 或更高版本（OS X Lion 用户需先升级至 v10.7.4），iOS 用户升级至 iOS 6.0。具体操作：通过 Mac App Store 或"系统偏好设置"→"软件更新"安装 Safari 6.0 及 OS X Lion v10.7.4 更新；iOS 设备通过"设置"→"通用"→"软件更新"升级至 iOS 6.0。如暂无法升级，应避免使用 Safari 访问不可信网站，并启用 Gatekeeper 限制未知来源应用，同时通过防火墙限制浏览器访问外部 untrusted 内容。'
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:36Z"

