[basic]
description = "MyWebServer 1.0.2 存在跨站脚本（XSS）漏洞，由于服务器在处理超长 HTTP 请求时未对用户输入进行充分过滤，远程攻击者可通过发送特制的长 HTTP 请求并在其后附加恶意脚本，利用该漏洞将脚本和 HTML 代码注入到服务器返回的错误消息页面中。当用户访问包含恶意内容的错误页面时，嵌入的脚本将在用户浏览器中执行。该漏洞影响 MyWebServer 1.0.2 版本，攻击者可通过构造包含 JavaScript 代码的超长请求，诱导用户点击恶意链接，从而窃取会话令牌、Cookie 或执行其他恶意操作。"
published = "2002-08-14T04:00:00Z"
remediation = "如 MyWebServer 有后续版本，请升级到厂商发布的最新版本以修复此问题。若官方已停止维护且无补丁可用，建议迁移至仍在持续更新的 Web 服务器软件（如 Apache、Nginx 或 IIS），并在迁移前通过 Web 应用防火墙（WAF）拦截超长 HTTP 请求中包含的脚本与 HTML 标签，同时对服务器返回的错误页面实施严格的输出编码，防止恶意内容回显给用户。临时缓解措施包括在边界防火墙或反向代理层过滤包含 `<script>`、`javascript:` 等关键词的请求，降低跨站脚本攻击的成功率。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "MyWebServer 1.0.2 跨站脚本攻击漏洞"
updated = "2026-06-16T21:59:21Z"

