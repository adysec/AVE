[basic]
description = "AnalogX proxy server 4.04 及更早版本存在缓冲区溢出漏洞，远程攻击者可通过向目标服务器的 SOCKS4 CONNECT 请求中发送超长用户名字段触发该漏洞，导致代理服务崩溃并造成拒绝服务。该漏洞影响 AnalogX proxy server 4.04 及之前所有版本，攻击无需身份认证，通过网络即可实施，危害等级中等。"
published = "2000-07-25T04:00:00.000"
remediation = "建议立即升级 AnalogX Proxy 至 4.05 或更高版本（当前最新为 4.15），该版本已修复 SOCKS4 处理中的缓冲区溢出问题。可从 https://www.analogx.com/contents/download/network/proxy.htm 下载更新。如无法升级，可在防火墙层面限制对 SOCKS4 端口（通常为 1080）的外部访问，仅允许可信来源连接。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "AnalogX proxy server 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:12.557"

