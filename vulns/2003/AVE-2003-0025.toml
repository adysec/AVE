[basic]
description = "Ethereal（现 Wireshark）的 SOCKS 协议解析器 packet-socks.c 中存在格式化字符串漏洞，版本 0.8.7 至 0.9.9 受影响。远程攻击者可通过向目标系统发送特制的包含格式化字符串说明符的 SOCKS 数据包触发该漏洞，导致任意代码执行。攻击者无需身份认证即可利用，危害严重。该漏洞 CVSS 评分 7.5，建议用户升级至修复版本。"
published = "2003-03-18T05:00:00Z"
remediation = "升级 Ethereal 至 0.9.10 或更高版本（Debian 系统对应升级至 0.9.4-1/woody 或 0.9.9-2/unstable），该漏洞在 packet-socks.c 中因未对用户可控输入做格式化字符串过滤导致远程代码执行。如无法升级，建议禁用 SOCKS 协议解析器：在 Ethereal 首选项中将 SOCKS 协议设为禁用，或迁移至已修复此漏洞的 Wireshark 最新版本。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Ethereal SOCKS解析器格式化字符串远程代码执行漏洞"
updated = "2026-06-16T22:01:28Z"

