[basic]
description = "OpenTelemetry Java Instrumentation 的 JDBC 自动埋点功能在处理 SQL CONNECT 语句时，当数据库密码被双引号包裹时未能正确进行脱敏处理，导致明文密码被记录到追踪跨度属性中并导出至可观测性后端。攻击者若能够访问可观测性系统（如 Jaeger、Zipkin 等），即可窃取数据库明文凭据。该漏洞影响 2.28.0 之前的所有版本，CVSS 评分 6.5，危害等级中危。官方已在 2.28.0 版本中修复此问题。"
published = "2026-07-01T22:16:50Z"
remediation = "立即升级 OpenTelemetry Java Instrumentation 至 2.28.0 或更高版本。如无法升级，在 JDBC 连接字符串中避免对密码使用双引号包裹，或通过配置 `otel.instrumentation.jdbc.omit-connection-password=true` 禁止密码输出到 span 属性。同时检查已导出的 trace 数据，确认是否存在明文密码泄露并轮换受影响数据库凭据。"
score = 6.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "OpenTelemetry Java Instrumentation JDBC 自动埋点密码明文泄露漏洞"
updated = "2026-07-06T17:00:08Z"

