[basic]
description = "Google Chrome 89.0.4389.90 之前版本中的 Blink 渲染引擎存在释放后使用漏洞（CWE-416）。未经身份认证的远程攻击者可构造恶意 HTML 页面，诱骗用户使用受影响的 Chrome 版本访问该页面，从而触发堆内存损坏，进而实现远程代码执行。该漏洞影响所有基于 Chromium 的浏览器，攻击条件宽松，仅需用户浏览恶意网页即可触发。Google 已在 Chrome 89.0.4389.90 版本中修复该漏洞，CVSS v3.1 评分为 8.8，危害等级为高。"
published = "2021-03-16T15:15:13.157"
remediation = 'Google Chrome 89.0.4389.90 版本修复了 Blink 引擎中的释放后使用漏洞。请立即将 Google Chrome 升级至 89.0.4389.90 或更高版本：Windows 用户通过 Chrome 菜单"帮助"→"关于 Google Chrome"检查并安装更新；macOS 用户通过 App Store 更新 Chrome；Linux 用户使用各自发行版包管理器升级 chromium 包。如无法立即升级，可临时禁用或限制浏览器对 untrusted HTML 页面的自动渲染，并避免点击来源不明的链接或访问可疑网站，以降低远程攻击者通过恶意页面触发堆破坏的风险。企业环境可通过组策略统一推送 Chrome 89.0.4389.90 补丁。此漏洞已被 CISA 列入已知被利用漏洞目录，建议在 2021 年 11 月 17 日前完成修复。'
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome Blink 释放后使用漏洞"
updated = "2026-06-17T03:35:00.483"

