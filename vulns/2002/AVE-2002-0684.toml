[basic]
description = "DaCode 1.2.0 新闻消息模块存在跨站脚本（XSS）漏洞，远程攻击者可在 IMG 标签中嵌入 JavaScript 代码，向目标页面注入任意 HTML 或脚本内容。该漏洞影响 DaCode 1.2.0 版本，CVSS 评分为 4.3（中危），攻击向量为网络，攻击复杂度为中等，攻击者无需身份认证即可远程发起攻击。当用户访问包含恶意构造新闻消息的页面时，嵌入的 JavaScript 脚本将在用户浏览器中执行，攻击者可借此窃取用户会话 Cookie、实施钓鱼攻击或篡改页面显示内容。建议用户升级至 DaCode 更新版本以消除该安全风险。"
published = "2002-12-31T05:00:00Z"
remediation = '由于 DaCode 1.2.0 已停止维护且无官方补丁，建议立即停止使用该软件并迁移至持续维护的现代新闻发布系统（如 WordPress、Ghost 或 Drupal）。如短期内无法替换，应在 Web 服务器层面启用 Web 应用防火墙（WAF）规则拦截 IMG 标签中的 javascript: 伪协议及事件处理器（onload、onerror），同时对新闻发布表单输入进行 HTML 实体编码（将 <、>、" 替换为 &lt;、&gt;、&quot;），并在模板渲染处增加 strip_tags() 过滤，仅保留允许的 HTML 标签白名单。'
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "DaCode 1.2 跨站脚本漏洞"
updated = "2026-06-16T22:00:00Z"

