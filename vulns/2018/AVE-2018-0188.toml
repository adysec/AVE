[basic]
description = "Joomla! 的 Zh BaiduMap 3.0.0.1 组件存在 SQL 注入漏洞，攻击者无需身份认证即可通过 id 参数向 getPlacemarkDetails、getPlacemarkHoverText、getPathHoverText 或 getPathDetails 请求注入恶意 SQL 语句，可导致数据库信息泄露、数据篡改甚至服务器被完全控制。该漏洞攻击复杂度低，仅需发送特制 HTTP 请求即可触发，影响范围广泛。"
published = "2018-02-05T21:29:00Z"
remediation = "立即升级 Zh BaiduMap 组件至最新版本（当前为 6.22.1.1），该版本已修复 SQL 注入漏洞。通过 Joomla 后台「扩展管理→更新」功能自动检测并安装更新，或前往开发者官网 https://zhuk.cc 下载最新安装包手动覆盖安装。如无法立即升级，可在 Joomla 后台「扩展管理→插件管理」中禁用 com_zhbaidumap 组件，或在 Web 应用防火墙（WAF）层面添加规则拦截 id 参数中包含 UNION/SELECT 等 SQL 关键词的请求作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Joomla Zh BaiduMap 3.0.0.1 SQL注入漏洞"
updated = "2026-06-17T02:02:05Z"

