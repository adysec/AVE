[basic]
description = "LPRng 打印假脱机服务存在默认配置不当的安全漏洞，影响 Red Hat Linux 7.0 至 7.3、Mandrake 8.1 和 8.2 以及其他使用 LPRng 的操作系统。该漏洞的根本原因是 LPRng 在默认安装配置下未对远程打印请求进行任何访问控制验证，允许任意远程主机向目标打印机服务提交打印作业。未经认证的攻击者可利用此漏洞从网络上任意位置发送恶意打印任务，可能导致打印机服务拒绝正常打印请求（DoS），消耗系统资源，或利用打印作业处理过程中可能存在的其他缺陷进行进一步攻击。CVSS 评分 7.5（高危），攻击复杂度低，无需认证即可通过网络发起攻击。"
published = "2002-07-03T04:00:00Z"
remediation = "升级LPRng至最新安全版本，具体操作：Red Hat用户安装RHSA-2002-089提供的更新包（运行up2date或rpm -Uvh），Mandrake用户安装MDKSA-2002-042提供的更新包。如无法立即升级，修改/etc/lprng/lpd.perms配置文件，添加访问控制规则限制仅允许受信任IP段提交打印作业，并重启lpd服务。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Red Hat Linux LPRng 打印后台服务未授权访问漏洞"
updated = "2026-06-16T21:57:19Z"

