[basic]
description = "tags.<value>Nagios XI 在 5.4.13 版本之前的 admin/menuaccess.php 页面中，chbKey1 参数存在 SQL 注入漏洞。未经充分身份认证的远程攻击者可通过向该参数提交特制的 SQL 语句，在数据库层面执行任意查询操作。该漏洞影响所有部署了受影响版本 Nagios XI 的系统，CVSS 评分为 7.2，危害等级为高。攻击者需具备高权限账户才能访问管理页面并利用此漏洞，成功利用后可导致敏感数据泄露、数据库篡改或进一步提权。"
published = "2018-05-16T13:29:00Z"
remediation = "立即将 Nagios XI 升级至 5.4.13 或更高版本，以修复 admin/menuaccess.php 文件中 chbKey1 参数的 SQL 注入漏洞。升级前请备份配置文件与数据库。如暂时无法升级，应通过防火墙或访问控制列表限制对 /nagiosql/admin/menuaccess.php 的访问权限，仅允许可信管理 IP 访问该页面，并严格遵循最小权限原则，避免使用高权限账户进行日常运维操作。"
score = 7.2
severity = "HIGH"
sources = ["nuclei"]
title = "Nagios Nagios XI SQL注入漏洞"
updated = "2026-06-17T01:34:36Z"

