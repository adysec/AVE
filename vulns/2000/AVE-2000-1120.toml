[basic]
description = "StarOffice 5.2 在运行过程中会在 /tmp 目录下创建 soffice.tmp 临时目录，并在创建时遵循符号链接（symlink）同时设置全局可读权限。该漏洞允许同一系统上的本地用户通过预先在 /tmp/soffice.tmp 路径下创建指向其他用户敏感文件的符号链接，当使用 StarOffice 的其他合法用户启动应用时，该用户可读取符号链接指向的文件内容，造成信息泄露。该漏洞利用条件要求攻击者具有目标系统的本地访问权限，利用复杂度低，无需认证。攻击者可借此读取 StarOffice 用户的个人文件、邮件、文档等敏感数据。建议升级至修复该漏洞的 StarOffice 版本，或在系统级对 /tmp 目录实施严格权限管控并禁用对临时目录中符号链接的跟随。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 StarOffice 5.2 至 5.2 后续补丁版本或更高版本（如 StarOffice 6.0/7.0），Sun Microsystems 已发布安全补丁修复 /tmp/soffice.tmp 符号链接及权限问题。临时缓解措施：设置 umask 为 077 限制临时文件权限，或将 TMPDIR 环境变量指向用户私有目录，避免使用全局可写的 /tmp 目录。"
score = 3.6
severity = "LOW"
sources = ["avd"]
title = "Sun Microsystems StarOffice 符号链接信息泄露漏洞"
updated = "2026-06-16T21:53:16Z"

