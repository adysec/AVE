[basic]
description = "Enterasys SSR8000 智能交换路由器的 MPS（多端口扫描）功能存在缺陷，在固件 8.3.0.10 之前的版本中，未经身份认证的远程攻击者可向目标设备的 15077 和 15078 端口发送大量端口扫描请求，触发拒绝服务（DoS）导致设备崩溃。该漏洞影响运行旧版固件的 SSR8000 设备，攻击无需身份验证，利用门槛低。"
published = "2003-04-02T05:00:00.000"
remediation = "tags.<value>立即将 Enterasys SSR8000 SmartSwitch 固件升级至 8.3.0.10 或更高版本，该版本修复了 MPS 功能在收到对端口 15077 和 15078 的连续端口扫描时导致的崩溃问题。在升级完成前，可在交换机防火策略中屏蔽来自外部网络的端口 15077/15078 访问作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Enterasys SSR8000 SmartSwitch 端口扫描拒绝服务漏洞"
updated = "2026-06-16T21:59:26.770"

