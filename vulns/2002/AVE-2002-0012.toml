[basic]
description = "OpenSSL 0.9.7 至 0.9.7-beta3 版本在启用 Kerberos 支持时存在缓冲区溢出漏洞。当处理过长的 master key 时，程序未正确验证输入长度，导致堆或栈缓冲区溢出。远程攻击者可通过向使用受影响 OpenSSL 版本的服务发送特制的 Kerberos 握手请求触发该漏洞，成功利用可实现任意代码执行，完全控制目标系统。该漏洞影响所有启用 Kerberos 的 OpenSSL 0.9.7 系列版本，CVSS 评分 7.5，危害等级高。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 OpenSSL 至 0.9.7-beta3 或更高版本。如无法立即升级，可在编译时禁用 Kerberos 支持（./configure --no-kerberos），消除缓冲区溢出攻击路径。对于生产环境，建议部署 WAF 规则拦截异常长度的 master key 请求作为临时缓解。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "OpenSSL 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:57:52Z"

