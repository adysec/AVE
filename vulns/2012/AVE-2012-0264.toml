[basic]
description = "Apache Tomcat 在处理分块传输编码（chunked transfer encoding）时，其输入过滤器对 chunk extensions 的校验存在缺陷，导致攻击者无需身份认证即可通过构造畸形的 CRLF（回车换行）序列触发高资源消耗。该漏洞影响 Apache Tomcat 6.x 早于 6.0.37 版本及 7.x 早于 7.0.30 版本，CVSS 评分 5.0，危害等级中等。攻击者通过向目标 Tomcat 服务器发送包含畸形分块扩展的恶意数据流，即可耗尽服务器资源，造成拒绝服务，使合法用户无法正常访问服务。建议升级至 Tomcat 6.0.37 或 7.0.30 及以上版本以修复此漏洞。"
published = "2013-06-01T14:21:05.750"
remediation = "将 Apache Tomcat 6.x 升级至 6.0.37 或更高版本，将 Apache Tomcat 7.x 升级至 7.0.30 或更高版本。如暂无法立即升级，可在前置反向代理（如 Apache httpd 或 Nginx）中配置规则，拒绝或限制包含恶意块扩展（chunk extension）的 chunked 编码请求，或在 Tomcat Connector 配置中禁用 chunked transfer encoding 以临时缓解拒绝服务风险。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Apache Tomcat 分块传输编码拒绝服务漏洞"
updated = "2026-06-16T23:43:26.467"

