[basic]
description = "Cisco Prime Infrastructure（PI）和 Cisco Evolved Programmable Network（EPN）Manager 的基于 Web 的管理界面存在输入验证错误漏洞。攻击者需先通过身份认证，随后上传恶意文件到管理界面，即可利用该漏洞在底层操作系统上以 root 权限执行任意代码。该漏洞影响 Cisco Prime Infrastructure 及 EPN Manager 软件，CWE 分类为 CWE-20（输入验证不当），CVSS 评分为 8.8（高危）。利用条件为攻击者需具备对管理界面的网络可达性并持有合法认证凭据，成功利用后可获得系统最高权限。"
published = "2019-05-16T01:29:00.483"
remediation = "立即将 Cisco Prime Infrastructure 升级至 3.4.1、3.5 或 3.6 版本，或将 Cisco EPN Manager 升级至 3.0.1 版本。升级前从 Cisco Software Center 下载对应版本（路径：Browse all > Cloud and Systems Management > Network Management Solutions），确认设备内存充足且硬件配置受支持。若无法立即升级，将管理接口访问限制为仅可信 IP 网段，并禁用或隔离 Health Monitor 模块的上传功能以降低暴露面。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "Cisco Prime Infrastructure Software和Cisco Evolved Programmable Network Manager 输入验证错误漏洞"
updated = "2026-06-17T02:29:23.183"

