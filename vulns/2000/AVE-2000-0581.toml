[basic]
description = "xlockmore 和 xlockf 工具在处理 -d 选项时未能正确过滤用户输入的格式字符串，导致存在格式字符串漏洞。本地攻击者可通过在命令行参数中注入精心构造的格式化字符串，利用该漏洞实现任意内存读写，从而在目标系统上非法提升权限至 root 级别。该漏洞主要影响 xlock 4.16 及更早版本，攻击条件为攻击者能够以本地用户身份执行相关命令。"
published = "2000-10-20T04:00:00Z"
remediation = "建议升级 xlock 至最新安全版本或安装发行版提供的补丁。对于源码维护者，应将 xlockmore 和 xlockf 中处理 -d 参数的格式化输出函数（如 printf）修改为非格式化输出，确保用户输入不被直接作为格式字符串解析。作为临时缓解措施，可移除 xlock 的 SUID 权限以防止本地用户通过该漏洞提升至 root 权限。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "David Bagley xlock 格式字符串漏洞"
updated = "2026-06-16T21:52:25Z"

