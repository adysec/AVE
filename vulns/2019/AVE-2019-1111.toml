[basic]
description = "tags.<value>Oracle Fusion Middleware 中的 BI Publisher（原 XML Publisher）组件的 BI Publisher Security 子组件存在 XML 外部实体注入漏洞。未经身份认证的远程攻击者可通过 HTTP 协议向受影响系统发送包含恶意 XML 外部实体引用的特制请求，无需任何凭据或用户交互即可成功利用。成功利用后，攻击者可实现对 BI Publisher 可访问数据的未授权读取、更新、插入或删除，从而造成数据泄露和数据完整性破坏。该漏洞影响 Oracle BI Publisher 11.1.1.9.0、12.2.1.3.0 和 12.2.1.4.0 版本，攻击复杂度低，网络可达即可触发。Oracle 已在 2019 年 4 月关键补丁更新中发布修复补丁。"
published = "2019-04-23T19:32:51.537"
remediation = "立即应用 Oracle 2019 年 4 月关键补丁更新（CPU）中针对 BI Publisher 的安全补丁，受影响版本 11.1.1.9.0、12.2.1.3.0 和 12.2.1.4.0 均应升级至后续已修复的补丁版本。如无法立即打补丁，可在防火墙或反向代理层限制对 BI Publisher HTTP 端口的访问，仅允许可信源 IP 访问，并禁用不必要的外部网络访问作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["nuclei"]
title = "Oracle BI Publisher XML 外部实体注入漏洞"
updated = "2026-06-17T02:34:13.690"

