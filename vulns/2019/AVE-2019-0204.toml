[basic]
description = "Total.js Platform 在 3.2.3 之前的版本中存在目录遍历漏洞，其 index.js 文件未对用户传入的路径进行充分过滤和校验，攻击者可通过构造包含 URL 编码点号（如 `.%2e`）的特制请求路径绕过访问控制，实现对服务器敏感文件的任意读取。该漏洞影响所有使用受影响版本 Total.js 构建的 Web 应用程序，攻击者无需身份认证即可在远程网络位置发起攻击，且无需任何用户交互。成功利用该漏洞可导致应用程序源代码、配置文件等敏感信息泄露，为后续攻击提供信息支撑。建议用户尽快升级 Total.js 至 3.2.3 或更高版本。"
published = "2019-02-18T16:29:00Z"
remediation = "将 Total.js Platform 升级至 3.2.3 或更高版本，该版本修复了 index.js 中路径遍历过滤逻辑，以更严格的方式处理 ../ 序列。如暂无法立即升级，可在前置反向代理（如 Nginx）层配置拦截包含 ../ 或 %2e%2e 的请求路径，或在应用层添加自定义中间件对 req.url 进行路径规范化与校验，禁止返回上级目录的内容，并严格限制静态文件服务的根目录范围。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Total.js 目录遍历漏洞"
updated = "2026-06-17T02:42:45Z"

