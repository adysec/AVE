[info]
author = "ave"
description = "检测 @astrojs/rss 组件 XML 注入漏洞 - 通过控制 RSSFeedItem 的 title 字段注入恶意 XML 元素"
id = "POC-AVE-2026-0831"
name = "CVE-2026-59728 PoC"
severity = "medium"
tags = ["ave-2026-0831"]
vuln_id = [
    "CVE-2026-59728",
    "AVE-2026-0831",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/rss.xml"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<link>"]
