[basic]
description = "Microsoft Windows 的 splwow64.exe 组件在处理特定打印调用时存在本地权限提升漏洞。该组件用于在 64 位系统上兼容 32 位打印驱动程序，由于对特定函数调用参数验证不当，本地已认证攻击者可构造恶意打印任务或调用特定 API，触发内存破坏或权限不当提升，最终以 SYSTEM 权限执行任意代码。漏洞影响 Windows 7 至 Windows 10 及对应 Server 版本，CVSS 3.1 评分 7.8（HIGH），攻击向量为本地（AV:L），需低权限（PR:L）且无需用户交互（UI:N）。攻击者需先在目标系统获得普通用户权限，通过提交特制打印作业或调用 splwow64 暴露的 LPC 接口即可利用。Microsoft 已在 2019 年 7 月补丁星期二发布修复补丁（KB4507456 等）。"
published = "2019-07-15T19:15:15Z"
remediation = "安装 Microsoft 2019 年 7 月安全更新（KB4516071 / KB4516077 等对应各 Windows 版本），通过 Windows Update 自动更新或手动下载安装。无法立即打补丁时，可通过组策略或防火墙限制 splwow64.exe 的网络访问权限作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft splwow64 特权提升漏洞"
updated = "2026-06-17T02:09:06Z"

