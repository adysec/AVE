[info]
author = "AVE"
description = "通过向 Gordano NTMail Web 配置服务器发送一系列不完整的 HTTP 请求，导致服务器资源耗尽或进程崩溃，验证拒绝服务漏洞的存在"
id = "POC-AVE-2000-0977"
name = "Gordano NTMail Web Configuration Server HTTP Partial Request DoS PoC"
severity = "medium"
tags = ["ave-2000-0977"]
vuln_id = [
    "CVE-2000-0859",
    "AVE-2000-0977",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "NTMail",
    "Gordano",
]
