[basic]
description = "tags.<value>Apple QuickTime 7.7.1 之前的版本在处理 FLC 编码的电影文件时存在缓冲区溢出漏洞。未经身份认证的远程攻击者可构造一个恶意的 FLC 格式电影文件，诱使目标用户使用 QuickTime 打开该文件，从而触发缓冲区溢出，实现远程代码执行或导致应用程序崩溃拒绝服务。该漏洞影响 Windows 和 Mac OS X 平台上的 QuickTime 播放器，CVSS 评分为 9.3，危害等级严重。攻击者可通过电子邮件附件、共享文件或网页链接等方式将恶意文件传递至目标用户，无需任何身份验证即可在目标系统上执行任意代码。"
published = "2011-10-28T02:49:53Z"
remediation = "将 Apple QuickTime 升级至 7.7.1 或更高版本。对于 OS X Lion 用户，升级至 OS X Lion v10.7.2 即可修复该问题；对于 Mac OS X v10.6 用户，安装 Apple 发布的安全更新 2011-006 即可修复；对于 Windows 用户（Windows XP SP2 及以上、Windows Vista、Windows 7），请直接下载并安装 QuickTime 7.7.1 更新。如暂时无法升级，应避免打开来源不明的 FLC 编码影片文件，并可在浏览器或邮件客户端中禁用 QuickTime 插件的自动播放功能作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime FLC文件处理缓冲区溢出漏洞"
updated = "2026-06-16T23:32:57Z"

