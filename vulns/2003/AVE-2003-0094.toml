[basic]
description = "Ethereal（现 Wireshark）0.9.12 及更早版本存在多处协议解析器字符串处理漏洞。由于 BGP、WTP、DNS、802.11、ISAKMP、WSP、CLNP、ISIS 及 RMI 共九个解析器在解析特制网络数据包时未能正确处理字符串内容，未经身份认证的远程攻击者可通过向目标主机发送包含畸形字段的恶意网络流量触发该漏洞，导致缓冲区溢出，进而可在受影响系统上执行任意代码，造成完全的系统失陷。该漏洞影响运行 Ethereal 进行网络抓包分析的系统，攻击者无需任何凭据即可在本地局域网或远程环境中完成利用，危害等级极高。建议用户升级至修复版本以消除安全风险。"
published = "2003-07-24T04:00:00Z"
remediation = "建议立即将 Ethereal 升级到 0.9.13 或更高版本（含 Wireshark 后续版本），以修复 BGP、DNS、ISAKMP、802.11、WSP 等多个协议解析器的字符串处理漏洞。使用 Debian/Ubuntu 等发行版的用户可通过 apt-get install --only-upgrade ethereal 命令安装安全更新；使用 RPM 系发行版的用户可通过 yum update ethereal 安装补丁。对于无法立即升级的环境，建议暂时避免使用 Ethereal 分析来自不受信任来源的不可信网络流量，作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "Ethereal 网络协议分析器 多协议解析器字符串处理漏洞"
updated = "2026-06-16T22:02:11Z"

