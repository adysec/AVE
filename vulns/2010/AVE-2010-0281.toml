[basic]
description = "libxml2 2.7.8及之前版本中存在双重释放漏洞（CWE-415），该漏洞位于XPath表达式处理模块中。远程攻击者可通过向使用libxml2库的应用程序（如Google Chrome 8.0.552.215之前版本、OpenOffice等）发送特制的XPath查询请求，触发内存双重释放操作，导致拒绝服务或潜在的任意代码执行。攻击无需身份认证，通过网络即可远程触发，CVSS评分7.5，危害等级高。"
published = "2010-12-07T21:00:09Z"
remediation = "将 libxml2 升级至 2.7.8 之后包含修复的版本（如 2.9.0+），或根据发行版安装对应安全更新：Debian 用户执行 `apt-get install libxml2` 更新至 DSA-2137 修复版本；Red Hat/CentOS 用户安装 RHSA-2011-1749 或 RHSA-2013-0217 提供的更新；Google Chrome 用户升级至 8.0.552.215 及以上版本；OpenOffice 用户升级至 3.3 及以上版本。如无法立即升级，可在应用层禁用 XML XPath 解析功能作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "libxml2 XPath处理双重释放漏洞"
updated = "2026-06-16T23:24:55Z"

