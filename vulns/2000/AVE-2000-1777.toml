[basic]
description = "Netscape Messaging Server 4.15 Patch 2 的 IMAP 服务组件存在缓冲区溢出漏洞。远程攻击者无需身份认证即可通过向目标服务器的 IMAP 端口发送特制的超长 LIST 命令触发该漏洞，导致缓冲区溢出，进而可在服务器上以服务进程权限执行任意代码。该漏洞 CVSS 评分 10.0，危害等级严重，影响所有运行受影响版本的 Netscape Messaging Server 系统。"
published = "2000-12-19T05:00:00Z"
remediation = "Netscape Messaging Server 4.15 Patch 2 已停止维护，官方不再提供安全更新。建议立即迁移至受支持的邮件服务器（如 Dovecot 或 Microsoft Exchange），并停止使用该版本。在迁移完成前，可在防火墙层面限制 IMAP 端口（143/tcp）仅允许受信任 IP 访问，同时禁用不必要的 IMAP 服务以降低攻击面。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Netscape Messaging Server IMAP 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:51Z"

