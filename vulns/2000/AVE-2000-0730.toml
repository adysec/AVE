[basic]
description = "NetWin dMailWeb 和 cwMail 2.6g 及更早版本存在拒绝服务漏洞，远程未经身份认证的攻击者可通过向用户名参数传递超长字符串触发缓冲区溢出或资源耗尽，导致邮件服务进程崩溃或停止响应，造成拒绝服务。该漏洞影响所有运行受影响版本的 NetWin 邮件服务器，攻击门槛低，无需认证即可远程利用，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），主要影响系统可用性。建议升级至 2.6g 之后的修复版本或应用厂商发布的补丁。"
published = "2000-06-21T04:00:00Z"
remediation = "建议升级至 NetWin dMailWeb/cwMail 2.6g 之后的修复版本。由于该产品已停止维护，建议迁移至仍在安全更新的替代邮件服务软件。如无法立即升级，可在 Web 服务器或反向代理层对 username 参数实施长度限制（如限制不超过 64 字符），并配置访问控制策略仅允许可信 IP 访问管理接口。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Netwin DMailWeb/CWMail 拒绝服务漏洞"
updated = "2026-06-16T21:52:06Z"

