[basic]
description = "BEA WebLogic 5.1.x 中的 JSPServlet 访问控制不当，远程攻击者可直接调用该 Servlet 编译并执行任意 JSP 源代码文件，导致远程代码执行。攻击者无需身份认证即可利用该漏洞完全控制目标服务器，CVSS 评分 10.0，危害等级严重。Oracle 已发布安全补丁修复此漏洞。"
published = "2000-10-20T04:00:00.000"
remediation = "立即升级 BEA WebLogic 至 5.1.x 的补丁版本（参考 BEA 安全公告 security_000731），或限制对 JSPServlet 的访问权限，仅允许受信来源调用。由于 BEA WebLogic 5.1.x 已停止维护，建议迁移至 Oracle WebLogic 受支持版本并配置 Web 层访问控制列表（ACL）拦截对 /servlet/* 路径的未授权请求。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "BEA WebLogic JSP Servlet 远程代码执行漏洞"
updated = "2026-06-16T21:52:15.797"

