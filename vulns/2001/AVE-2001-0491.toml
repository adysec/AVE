[basic]
description = "Tcl/Tk 8.3.1 版本在加载库文件时存在不安全的搜索路径漏洞，程序会优先在当前工作目录中查找所需库文件，而非系统标准库路径。本地攻击者可通过将特洛伊木马库文件放置在用户可控目录中，诱使 tcl/tk 程序加载恶意库文件，从而执行任意代码。该漏洞影响使用 tcl/tk 8.3.1 的 Linux 系统，攻击者需具备本地访问权限，利用难度较低，可导致机密性、完整性和可用性部分受损。"
published = "2001-07-19T04:00:00Z"
remediation = "升级 tcl/tk 至 8.3.3 及以上版本（Red Hat 已通过 RHSA-2002:148 修复此问题）。对于仍在使用旧版 tcl/tk 的系统，应安装对应发行版的安全更新补丁。临时缓解措施：避免在不受信任的目录中执行 tcl/tk 脚本，或通过设置环境变量 TCLLIBPATH 限制库搜索路径。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "Tcl/Tk tcltk 库搜索路径本地代码执行漏洞"
updated = "2026-06-16T21:56:08Z"

