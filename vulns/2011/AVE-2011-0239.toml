[basic]
description = "Google Chrome 15.0.874.102之前版本中存在跨源访问限制绕过漏洞。该漏洞源于程序未能正确处理 javascript: URL，远程攻击者可通过诱使用户访问特制网页，利用该漏洞绕过同源策略限制，跨源读取目标网站的 Cookie 信息，导致用户敏感数据泄露。攻击无需认证，仅需用户浏览恶意页面即可触发。"
published = "2011-10-25T19:55:01Z"
remediation = "升级 Google Chrome 至 15.0.874.102 或更高版本，该版本修复了 javascript: URL 处理不当导致的 Cookie 跨源读取问题。如无法升级，可在浏览器中禁用 JavaScript 或使用 NoScript 等扩展限制不可信来源的脚本执行作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome javascript:URL处理访问限制绕过漏洞"
updated = "2026-06-16T23:34:06Z"

