[basic]
description = "Windows Digital Media 组件存在越界读取（Out-of-bounds Read）漏洞，低权限攻击者在获取物理访问权限后，可通过特制应用程序触发该漏洞，利用越界读取获取敏感内存信息，进而实现权限提升至 SYSTEM 级别。该漏洞影响多个 Windows 版本，攻击复杂度低且无需用户交互，CVSS 评分 6.6，危害等级中危。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:34Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 KB5050061，或通过 Windows Update 自动更新。各版本修复版本号：Windows 10 1507 升级至 10.0.10240.20890、Windows 10 1809 升级至 10.0.17763.6775、Windows 11 24H2 升级至 10.0.26100.2894、Windows Server 2025 升级至 10.0.26100.2894。如无法立即打补丁，建议限制物理访问权限，因为该漏洞需要攻击者具备物理接触设备的能力（AV:P）。"
score = 6.6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 数字媒体特权提升漏洞"
updated = "2026-06-17T08:42:49Z"

