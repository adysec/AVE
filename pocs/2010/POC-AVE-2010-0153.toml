[info]
author = "ave"
description = "通过构造包含深度嵌套 use 元素的 SVG 文档，验证 Apple Safari WebKit 引擎是否存在 CVE-2010-1410 内存破坏漏洞。当 Safari 渲染该 SVG 时，嵌套 use 元素的递归处理导致内存损坏，可造成浏览器崩溃或潜在任意代码执行。"
id = "POC-AVE-2010-0153"
name = "Apple Safari WebKit SVG Nested Use Elements Memory Corruption PoC"
severity = "critical"
tags = ["ave-2010-0153"]
vuln_id = [
    "CVE-2010-1410",
    "AVE-2010-0153",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cve-2010-1410.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["CVE-2010-1410"]
