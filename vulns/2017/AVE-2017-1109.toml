[basic]
description = "海康威视多款网络摄像头（DS-2CD2xx2F-I、DS-2CD2xx0F-I、DS-2CD2xx2FWD、DS-2CD4x2xFWD、DS-2CD4xx5、DS-2DFx、DS-2CD63xx等系列）存在不正确身份验证漏洞，受影响固件版本为V5.0.9至V5.4.5。漏洞成因是设备应用程序未能对用户身份进行充分且正确的验证，未经身份认证的远程攻击者可通过发送特制请求绕过认证机制，直接提升自身权限并获得管理员级访问权限，进而窃取敏感视频监控数据、读取设备配置信息。该漏洞攻击复杂度低，无需用户交互，在互联网上可直接利用，危害等级严重。海康威视已发布固件更新修复此问题。"
published = "2017-05-06T00:29:00Z"
remediation = "立即将受影响型号的摄像头固件升级至厂商发布的安全版本：DS-2CD2xx2F-I 系列升级至 V5.4.5 build 170123 及更高版本，DS-2CD2xx0F-I 系列升级至 V5.4.5 Build 170123 及更高版本，DS-2CD2xx2FWD 系列升级至 V5.4.5 Build 170124 及更高版本，DS-2CD4x2xFWD 系列升级至 V5.4.5 Build 170228 及更高版本，DS-2CD4xx5 系列升级至 V5.4.5 Build 170302 及更高版本，DS-2DFx 系列升级至 V5.4.9 Build 170123 及更高版本，DS-2CD63xx 系列升级至 V5.4.5 Build 170206 及更高版本。升级前请确认设备为正规授权渠道购买，避免因非授权固件导致升级失败或界面异常。临时缓解措施包括：通过防火墙限制摄像头 Web 接口仅允许可信网络访问，禁止直接从互联网暴露摄像头管理端口，禁用不必要的 UPnP 功能，修改默认管理员密码并启用强认证策略。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "海康威视多款网络摄像机身份验证绕过漏洞"
updated = "2026-06-17T01:25:28Z"

