[basic]
description = "WordPress bws-google-maps 插件（版本 1.3.6 之前）存在跨站脚本（XSS）漏洞。该插件未能正确过滤用户输入，未经身份认证的远程攻击者可通过向受影响站点发送特制请求，诱使用户点击恶意链接，在用户浏览器中执行任意 JavaScript 代码，导致敏感信息泄露或页面内容篡改。攻击需用户交互，影响机密性和完整性，CVSS 评分 6.1，危害等级中危。"
published = "2019-08-21T13:15:11Z"
remediation = "立即将 WordPress 插件 bws-google-maps 升级至 1.3.6 或更高版本。登录 WordPress 后台 → 插件 → 已安装插件 → 找到 bws-google-maps → 点击「更新」。如已删除该插件，请彻底卸载并清理残留文件，避免被重新激活利用。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress bws-google-maps插件跨站脚本漏洞"
updated = "2026-06-17T01:13:05Z"

