[basic]
description = "PHP 3.0.16 及 4.0.2 版本存在格式化字符串漏洞，由于未对用户输入的格式化字符串进行有效过滤，远程攻击者可通过构造特制的 HTTP 请求触发 PHP 错误日志记录功能，将恶意格式化字符串写入错误日志，从而利用格式化字符串漏洞执行任意代码。该漏洞影响 PHP 3.x 及 4.x 系列版本，CVSS 评分 10.0，危害等级严重。攻击者无需身份认证即可远程利用，且无需目标系统开启特定配置。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 PHP 至 4.0.3 或更高版本（或 PHP 3.0.17+），该版本修复了格式化字符串注入问题。临时缓解措施：在 php.ini 中设置 `log_errors = Off` 并关闭 `display_errors`，同时限制 Web 服务器对错误日志文件的写入权限。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "PHP 3/4 错误日志格式字符串溢出漏洞"
updated = "2026-06-16T21:52:52.483"

