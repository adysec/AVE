[basic]
description = "Trend Micro Interscan VirusWall 3.6.x 及更早版本的 Web 管理界面未对 HTTP 通信进行加密，攻击者可通过嗅探网络流量或直接访问 setpasswd.cgi 等 CGI 程序，截获包含经 Base64 编码的用户名和密码的 HTTP GET 请求，进而还原并窃取管理员密码。该漏洞影响使用上述版本 Interscan VirusWall 的所有系统，由于无需身份认证即可被远程利用，攻击者可获得完整的管理员权限，危害等级严重。Trend Micro 已在后续版本中修复了该漏洞，建议用户升级至最新版本并确保管理界面仅通过加密通道访问。"
published = "2001-03-12T05:00:00Z"
remediation = "立即升级至 Interscan VirusWall 3.7.x 或更高版本，该版本已修复 Web 管理接口明文传输密码的问题。如暂时无法升级，应在防火墙上仅允许可信 IP 访问管理接口端口，并通过 SSH 隧道或 VPN 访问 Web 管理界面以避免明文密码在网络中传输，同时立即修改默认管理员密码为高强度密码并定期更换。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Trend Micro Interscan VirusWall 管理员密码远程窃取漏洞"
updated = "2026-06-16T21:53:44Z"

