[basic]
description = "Apple iPhone OS 3.1 及更早版本（含 iPod touch 3.1.1 之前版本）中的 Safari 浏览器存在信息泄露漏洞。当用户访问包含嵌入用户名和密码的 URL（如 http://user:pass@example.com）后，Safari 在向其他网站发起请求时，未对 HTTP Referer 头中的原始 URL 进行清洗，导致认证凭据随 Referer 头一并发送至第三方服务器。攻击者可通过监控 Web 服务器访问日志中的 Referer 字段，直接读取并窃取用户的敏感认证信息，且整个过程无需用户知情或进行任何交互。该漏洞影响所有运行受影响版本 iOS 的 iPhone 和 iPod touch 设备，CVSS 评分 5.0，危害等级中等。Apple 已在 iOS 3.1 及后续版本中修复此问题，移除了 Referer 头中 URL 的用户名和密码部分。"
published = "2009-09-10T21:30:01Z"
remediation = "升级 iPhone OS 至 3.1 或更高版本（iPod touch 升级至 3.1.1），Apple 已在 2009 年 9 月安全更新中修复此问题。如无法立即升级，应避免在 Safari 地址栏直接输入含用户名和密码的 URL，改用书签或表单登录方式，以降低 Referer 头泄露凭据的风险。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iPhone OS Safari 敏感信息泄露漏洞"
updated = "2026-06-16T23:10:14Z"

