[basic]
description = "@hypequery/clickhouse 的 escapeValue() 函数在参数替换过程中未正确转义反斜杠，导致攻击者可通过在参数值末尾添加反斜杠来转义单引号，从而注入任意 SQL 语句。该漏洞影响所有使用 @hypequery/clickhouse 2.0.2 之前版本并将用户可控输入作为查询参数传递的场景。攻击者无需身份认证即可利用此漏洞执行任意 SQL 命令，危害等级严重。厂商已在 2.0.2 版本中修复此问题。"
published = "2026-07-28T23:17:08Z"
remediation = "立即升级 @hypequery/clickhouse 至 2.0.2 版本，该版本已修复 escapeValue() 函数中未对反斜杠进行转义的问题。升级命令：npm install @hypequery/clickhouse@2.0.2 或 yarn add @hypequery/clickhouse@2.0.2。升级后需验证所有涉及用户输入参数的 SQL 查询是否仍能正常执行，确保参数转义逻辑正确生效。"
score = 9.8
severity = "CRITICAL"
sources = ["ghsa"]
title = "Hypequery ClickHouse SQL 注入漏洞"
updated = "2026-07-29T13:18:59Z"

