[basic]
description = "BSD 系列操作系统（包括 OpenBSD、NetBSD 以及其他可能受影响的类 BSD 系统）的 eeprom 程序中存在格式字符串漏洞。由于程序在处理用户输入时未对格式化字符串进行充分校验，本地攻击者可通过构造包含特殊格式说明符（如 %x、%n 等）的输入触发该漏洞，进而篡改内存数据并实现权限提升，最终获得目标系统的 root 权限。该漏洞影响本地登录用户或拥有 shell 访问权限的攻击者，利用门槛较低，且成功利用后可完全控制受影响系统，对系统机密性、完整性和可用性造成严重危害。OpenBSD 已发布 028_format_strings.patch 补丁修复此问题。"
published = "2000-12-19T05:00:00.000"
remediation = "OpenBSD 2.7 用户应立即下载并应用官方补丁 028_format_strings.patch（ftp://ftp.openbsd.org/pub/OpenBSD/patches/2.7/common/028_format_strings.patch），进入 /usr/src 目录后执行 patch -p0 < 028_format_strings.patch，随后依次重新编译并安装受影响的 eeprom（仅 sparc 平台）、fstat、passwd、su、top、ssh 程序。NetBSD 及其他 BSD 衍生版用户应升级至内核源码树已合并该修复的稳定版本，或联系厂商获取对应补丁。如无法立即打补丁，应通过文件系统权限或防火墙规则限制本地非特权用户对 eeprom 及相关系统程序的访问，以降低本地提权风险。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "OpenBSD NetBSD eeprom 格式字符串本地提权漏洞"
updated = "2026-06-16T21:52:56.293"

