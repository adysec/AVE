[basic]
description = "Apache HTTP Server 的 mod_vhost_alias 虚拟主机模块存在源代码信息泄露漏洞。远程攻击者无需身份认证即可通过构造特制的 HTTP 请求，在满足 cgi-bin 目录位于文档根目录（DocumentRoot）下这一条件时，直接获取 CGI 程序的完整源代码文件。该漏洞影响 Apache 1.3.9、1.3.11 及 1.3.12 版本，CVSS v2 评分为 5.0，危害等级中等。攻击者可利用此漏洞窃取 CGI 脚本中的敏感信息（如数据库连接凭据、业务逻辑代码等），进而为进一步攻击提供情报支持。修复建议为升级 Apache 至 1.3.13 或更高版本，并将 cgi-bin 目录移出 DocumentRoot 目录之外。"
published = "2000-10-13T04:00:00Z"
remediation = "升级 Apache HTTP 服务器到 1.3.14 或更高版本（该漏洞在 1.3.14 中修复），或临时通过在 httpd.conf 中配置 mod_vhost_alias 虚拟主机文档目录时，确保 cgi-bin 目录不放置在文档根目录下；同时在 Directory 配置段中为 CGI 目录添加 AllowOverride None 和 Require all denied 等访问限制，阻止直接通过 Web 访问 CGI 脚本源代码。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Apache HTTP Server mod_vhost_alias 模块 CGI 源代码泄露漏洞"
updated = "2026-06-16T21:53:22Z"

