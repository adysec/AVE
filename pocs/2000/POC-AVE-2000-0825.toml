[info]
author = "AVE"
description = "检测目标 Apache Tomcat 服务器是否未对 /admin 管理控制台进行访问限制。通过直接访问 /admin 上下文并尝试添加根目录上下文，可验证是否存在任意文件读取漏洞。"
id = "POC-AVE-2000-0825"
name = "Apache Tomcat 管理控制台任意文件读取漏洞 PoC"
severity = "medium"
tags = [
    "cve-2000-0672",
    "tomcat",
    "admin-bypass",
    "arbitrary-file-read",
]
vuln_id = [
    "CVE-2000-0672",
    "AVE-2000-0825",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/admin/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Apache Tomcat",
    "Tomcat Administration",
    "Admin",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/admin/index.html"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Apache Tomcat",
    "Tomcat Administration",
    "Admin",
]
