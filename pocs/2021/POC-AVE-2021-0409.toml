[info]
author = "ave"
description = "VMware vCenter Server vSphere Client (HTML5) vROps插件未授权文件上传漏洞（CVE-2021-21972）检测。通过访问/ui/vropspluginui/rest/services/getstatus端点，若返回VSPHERE-UI-JSESSIONID响应头且状态码为200，则表示vROps插件存在，目标可能存在该漏洞"
id = "POC-AVE-2021-0409"
name = "CVE-2021-21972 VMware vCenter Server RCE PoC"
severity = "critical"
tags = ["cve-2021-21972"]
vuln_id = [
    "CVE-2021-21972",
    "AVE-2021-0409",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/ui/vropspluginui/rest/services/getstatus"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = ["VSPHERE-UI-JSESSIONID"]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
