[basic]
description = "melange/Apko 软件包完整性验证存在缺陷，仅校验了控制段（如 .PKGINFO）哈希与已签名 APKINDEX 的一致性，但未对数据段（实际安装的包文件）哈希进行验证。攻击者通过劫持镜像源、投毒缓存或中间人攻击替换包内容时，控制段校验仍可通过，导致任意文件内容被替换。该漏洞影响使用 Apko/melange 构建 Alpine 软件包的系统，攻击者可在无认证条件下实施供应链投毒攻击，危害等级高。"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 melange 升级至 v0.50.4 或更高版本，将 apko 升级至 v1.2.9 或更高版本。这两个版本已增加对 APK 数据段哈希的完整性校验。如无法立即升级，应在网络层面限制对不可信 APK 镜像源的访问，并启用 HTTPS 传输层加密和签名验证以降低中间人攻击风险。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Chainguard melange 软件包完整性验证不完整漏洞"
updated = "2026-01-01T00:00:00Z"

