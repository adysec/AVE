[basic]
description = "GNU troff (groff) 1.21 之前版本中 contrib/pdfmark/pdfroff.sh 脚本存在设计缺陷，在调用 Ghostscript 程序处理文档时未添加 -dSAFER 安全选项，导致远程攻击者可通过构造恶意文档，利用 Ghostscript 的功能创建、覆盖、重命名或删除任意文件。该漏洞影响 groff 1.21 之前版本，CVSS 3.0 评分 6.5 (MEDIUM)，攻击向量为网络、攻击复杂度低、无需权限和用户交互，成功利用可导致文件完整性和可用性受损。GNU 已在 groff 1.21 版本中修复该漏洞。"
published = "2011-06-30T15:55:01Z"
remediation = "建议升级 GNU troff (groff) 至 1.21 或更高版本，该版本已在 pdfroff.sh 中添加 -dSAFER 参数限制 Ghostscript 权限。若无法立即升级，可手动编辑 contrib/pdfmark/pdfroff.sh 脚本，在 gs 命令行参数中添加 -dSAFER 选项以限制文件系统访问权限。Gentoo 用户可执行 emerge --ask '>=sys-text/groff-1.21' 升级，Debian/Ubuntu 用户可执行 apt-get update && apt-get install groff 升级至修复版本。"
score = 6.5
severity = "MEDIUM"
sources = ["tenable"]
title = "GNU troff 设计错误导致任意文件操作漏洞"
updated = "2026-06-16T23:14:57Z"

