[basic]
description = "Adobe Flash Player 存在类型混淆（Type Confusion）内存破坏漏洞（CWE-843）。攻击者通过构造特制的 SWF 文件，诱使用户在受影响的 Flash Player 版本中打开，即可触发类型混淆错误，导致内存破坏。成功利用该漏洞可导致远程代码执行或拒绝服务。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上的 Flash Player 10.3.183.15 之前版本和 11.1.102.62 之前版本，CVSS 评分 9.3，危害严重。Adobe 已在 2012 年 2 月安全更新中修复此漏洞。"
published = "2012-02-16T19:55:01.037"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.15 或 11.1.102.62 及以上版本（桌面平台）；Android 2.x/3.x 升级至 11.1.111.6，Android 4.x 升级至 11.1.115.6。由于 Adobe Flash Player 已于 2020 年底停止维护，建议彻底卸载 Flash Player 并迁移至 HTML5 以根除风险。如无法立即卸载，可在浏览器中禁用 Flash 插件，并将 chrome://settings/content/flash 设为「禁止网站运行 Flash」。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 类型混淆内存破坏漏洞"
updated = "2026-06-16T23:38:11.357"

