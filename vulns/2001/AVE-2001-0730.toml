[basic]
description = """
tags.

Let me make sure my description is accurate and comprehensive. I'll translate the NVD description into fluent Chinese:

"Microsoft Windows 2000 Telnet 服务创建命名管道时使用了可预测的名称，且未对管道进行充分验证。本地用户可通过创建具有相同可预测名称的命名管道，并将恶意程序关联到该管道，从而执行任意命令。这是该漏洞两个变体中的第一个。该漏洞影响 Windows 2000 系统上的 Telnet 服务，攻击者需具备对目标系统的本地访问权限，但无需身份认证即可利用，成功利用后可导致完全的系统权限提升。"

This covers:
- Principle: predictable named pipes, insufficient verification
- Impact: Windows 2000 Telnet service
- Attack condition: local access, no authentication
- Exploitation: create named pipe, associate malicious program, execute arbitrary commands
- ≥50 Chinese characters

Let me refine it to be more natural and comprehensive.<value>Microsoft Windows 2000 Telnet 服务在创建命名管道时使用了可预测的名称，且未对管道名称进行充分的身份验证。本地用户可通过创建具有相同可预测名称的命名管道，并将恶意程序关联到该管道，从而在系统上下文中执行任意命令。这是该漏洞两个变体中的第一个。该漏洞影响 Windows 2000 系统上的 Telnet 服务，攻击者需具备对目标系统的本地访问权限，但无需身份认证即可利用，成功利用后可导致完全的系统权限提升。"""
published = "2001-07-21T04:00:00Z"
remediation = '安装微软安全公告MS01-031发布的补丁KB299553，该补丁改进Telnet服务命名管道名称选择随机性以消除漏洞。补丁适用于Windows 2000 SP1及SP2系统，安装后无需重启，可通过注册表键值HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Updates\Windows 2000\SP3\Q299553验证安装成功。Windows 2000 SP3已包含此修复。Windows NT 4.0系统需应用对应的MS01-031安全更新。如无法立即安装补丁且Telnet服务非必需，可禁用该服务作为临时缓解：在"服务"管理器中停止并禁用Telnet服务，或在命令行执行net stop tlntsvr与net stop tlntsvr。'
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Windows 2000 Telnet 远程代码执行漏洞"
updated = "2026-06-16T21:54:08Z"

