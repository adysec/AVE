[basic]
description = 'Gene6 BPFTP FTP Server 2.0（即 G6 FTP Server 2.10）存在用户凭证泄露漏洞，源于该 FTP 服务器在处理 FTP 用户请求的文件 SIZE 或 MDTM 命令时，若目标文件路径为 UNC 格式的网络共享路径（如 \\host\share\path），服务器会向该共享所在的主机发起外部 SMB 连接。在此过程中，FTP 服务器必须使用其运行账户的登录凭据来完成 SMB 认证，这些凭据（包括用户名和密码哈希值）会被明文发送至远程主机。攻击者只需在 FTP 服务器与远程主机之间的网络链路上进行嗅探，即可截获这些传输的凭据哈希，进而离线破解获取原始用户名和密码，实现对服务器或其他系统的未授权访问。该漏洞影响运行 Gene6 BPFTP FTP Server 2.0/2.10 的 Windows 平台，攻击条件为攻击者需能够先通过 FTP 认证登录服务器，然后提交指向网络共享路径的 SIZE 或 MDTM 命令触发服务器发起外部 SMB 连接。该漏洞利用方式简单且无需复杂的权限提升，可直接导致服务器运行账户凭据泄露，带来横向移动和内网渗透的风险。'
published = "2001-06-18T04:00:00Z"
remediation = "升级 Gene6 BPFTP Server 至 2.11 或更高版本，该版本已修复网络共享文件请求时向外部主机泄露 NETBIOS 凭证的安全问题。如暂无法升级，应在防火墙中阻断 FTP 服务进程向外部主机的 SMB 出站连接，限制 FTP 服务账户仅能访问本地文件系统，禁用 UNC 网络路径访问，并避免使用 SIZE 和 MDTM 命令访问外部共享文件。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Gene6 BPFTP FTP Server 用户凭证泄露漏洞"
updated = "2026-06-16T21:53:59Z"

