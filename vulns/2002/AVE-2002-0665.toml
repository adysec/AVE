[basic]
description = "tags.<value>Outfront Spooky Login 2.0 至 2.5 版本存在 SQL 注入漏洞，其登录功能在验证用户身份时未对密码字段进行充分的输入过滤和参数化查询处理。未经身份认证的远程攻击者可在登录页面密码输入框中构造恶意的 SQL 语句，通过注入特殊字符或 SQL 代码片段篡改后端查询逻辑，从而绕过身份验证机制直接获取管理员或其他用户的访问权限。该漏洞影响所有使用受影响版本 Spooky Login 组件搭建的 Web 应用系统，攻击者无需事先获取有效账户凭证，只需具备对登录页面的网络访问权限即可发起利用，实施难度低且成功后可完全控制目标系统账户。"
published = "2002-12-31T05:00:00Z"
remediation = "Outfront Spooky Login 已停止维护无官方补丁，建议立即迁移至现代认证方案（如 ASP.NET Core Identity、IdentityServer）。临时缓解：在 IIS 配置请求筛选规则拦截包含 SQL 注入特征的密码字段（如单引号、OR、--、;）、部署 WAF 启用 SQLi 防护规则、限制登录接口访问 IP 白名单、启用账户锁定策略防暴力尝试。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Outfront Spooky Login SQL注入漏洞"
updated = "2026-06-16T21:59:50Z"

