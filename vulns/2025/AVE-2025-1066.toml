[basic]
description = "Linux 内核 netfilter 子系统的 nf_conncount 连接计数模块在 insert_tree() 函数中未完全初始化 struct nf_conncount_tuple 结构体。此前一次提交向该结构体引入了 cpu 和 jiffies32 字段，但仅在 nf_conncount_add() 分配结构体时进行了初始化，而 insert_tree() 函数（由原 count_tree() 拆分而来）未能同步初始化这两个字段。当系统通过 iptables 或 nftables 的连接数限制规则处理网络数据包时，nf_conncount_count() 会调用 insert_tree() 将未完全初始化的元组插入红黑树，随后 find_or_evict() 读取这些未初始化字段时触发 KMSAN 报告的 uninit-value 错误。未经身份认证的远程攻击者可通过向目标系统发送特制网络连接请求，触发连接数限制匹配路径，利用未初始化内存读取造成内核信息泄露或系统稳定性下降。该漏洞影响包含受影响 netfilter 代码的 Linux 内核版本，CVSS 评分为 7.3，危害等级为高。"
published = "2025-04-01T16:15:27Z"
remediation = "建议将 Linux 内核升级至 5.10.236、5.15.180 或 6.12.20 及之后的稳定版本，上述版本已包含对 net/netfilter/nf_conncount.c 中 insert_tree() 函数的补全初始化修复。若当前系统运行了 iptables -m connlimit 规则或 Open vSwitch conntrack 区域限制，可临时移除相关规则以降低未初始化内存值被利用的风险，直至完成内核升级。"
score = 7.3
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 netfilter nf_conncount 模块未初始化值漏洞"
updated = "2026-07-30T06:21:59Z"

