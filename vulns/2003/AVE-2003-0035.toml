[basic]
description = 'man 程序 1.5l 之前版本中存在不安全的返回值漏洞。当用户执行包含特殊引号的恶意构造的 man 文件时，my_xsprintf 函数会返回字符串 "unsafe"，该字符串随后通过 system 调用被当作程序名执行。如果攻击者能够将包含恶意可执行文件的目录置于用户搜索路径中，或诱导用户处理特制的 man 文件，即可导致任意命令执行。该漏洞影响 Linux/Unix 系统下 man 程序 1.5l 之前版本，CVSS 评分 4.6，危害等级中危。'
published = "2003-03-18T05:00:00Z"
remediation = '升级 man 程序至 1.5l 或更高版本，该版本修复了 my_xsprintf 函数对引号处理不当导致返回 "unsafe" 字符串的问题。作为临时缓解措施，检查并移除用户 PATH 环境变量中的当前目录（.），避免 "unsafe" 被意外执行。'
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "GNU Man 程序不安全返回值导致命令执行漏洞"
updated = "2026-06-16T22:01:35Z"

