[basic]
description = "Mozilla Firefox 12.0、Thunderbird 12.0 及 SeaMonkey 2.9 的 Windows 版更新程序（Mozilla Updater）和 Windows Updater Service 存在任意 DLL 加载漏洞。本地攻击者可通过将恶意 DLL 放置在更新程序搜索路径的特定目录中，诱使更新服务以高权限加载该 DLL，从而获取 SYSTEM 权限，实现本地权限提升。该漏洞攻击复杂度低，无需身份认证即可利用，成功后可完全控制受影响系统。Mozilla 已在 Firefox 13.0、Thunderbird 13.0 及 SeaMonkey 2.10 中修复此问题。"
published = "2012-06-05T23:55:01Z"
remediation = "立即升级 Mozilla Firefox 至 13.0 及以上版本、Thunderbird 至 13.0 及以上版本、SeaMonkey 至 2.10 及以上版本，或升级 Firefox/Thunderbird ESR 至 10.0.5。该漏洞源于 Mozilla Updater 和 Windows Updater Service 在加载 DLL 时未验证路径安全性，本地用户可通过将恶意 DLL 放置在特定目录（如应用程序安装目录）实现提权。如无法立即升级，可通过配置 Windows 软件限制策略（Software Restriction Policies）禁止非标准路径下的 DLL 加载，或使用 AppLocker 规则限制 updater.exe 仅从受信任路径加载模块作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey Windows Updater DLL加载本地权限提升漏洞"
updated = "2026-06-16T23:40:36Z"

