[basic]
description = "标签中。<value>saned 是 SANE（Scanner Access Now Easy）后端组件 sane-backends 中的扫描服务守护进程，用于提供网络扫描服务。该漏洞存在于 sane-backends 1.0.7 及更早版本（可能波及后续版本）中，由于其未在特定场景下正确分配内存，未经身份认证的远程攻击者可通过向目标主机发送特制请求触发该缺陷，持续消耗系统内存资源，最终导致拒绝服务。攻击无需任何认证凭据，仅需网络可达即可实施，影响依赖 sane-backends 提供网络扫描服务的 Linux/Unix 系统。"
published = "2003-09-22T04:00:00Z"
remediation = "建议将 sane-backends 升级至 1.0.11 或更高版本以修复该漏洞。具体操作：使用系统包管理器安装更新，如 Debian/Ubuntu 执行 `apt-get update && apt-get install sane-backends`，RHEL/Fedora 执行 `dnf update sane-backends`。如暂无法立即升级，可临时通过编辑 `/etc/sane/saned.conf` 禁用 saned 远程监听（注释掉 `#@/etc/services` 及监听地址行），或通过防火墙限制 6566/TCP 端口的访问来源，仅允许本地回环地址，以防止未经授权的网络连接导致内存耗尽。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "SANE sane-backends saned 内存消耗拒绝服务漏洞"
updated = "2026-06-16T22:02:49Z"

