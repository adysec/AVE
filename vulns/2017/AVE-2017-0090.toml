[basic]
description = "WordPress 的 Zendesk Help Center 插件 1.0.5 之前版本存在跨站脚本漏洞。该插件未能正确过滤用户输入，当管理员或用户访问包含恶意构造的 URL 时，攻击者可在页面中注入任意 JavaScript 代码。成功利用此漏洞需要用户交互（点击链接），攻击者可窃取会话 Cookie、篡改页面内容或进行钓鱼攻击，危害网站用户数据安全。CVSS 评分 6.1，危害等级中危。"
published = "2019-08-16T21:15:10Z"
remediation = "立即将 WordPress 的 zendesk-help-center 插件升级至 1.0.5 或更高版本。该版本已修复多处跨站脚本漏洞。如无法升级，可在 WordPress 后台禁用该插件，并通过 Web 应用防火墙（WAF）添加规则过滤 `zendesk-help-center` 相关 URL 中的可疑参数，防止 XSS 攻击。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Zendesk Help Center插件跨站脚本漏洞"
updated = "2026-06-17T01:13:03Z"

