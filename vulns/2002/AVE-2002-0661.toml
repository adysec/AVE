[basic]
description = "BasiliX Webmail 1.1.0 存在跨站脚本漏洞，远程攻击者可在邮件主题或消息正文中注入恶意脚本代码。由于应用程序未对用户输入进行充分过滤，当其他用户查看该邮件内容时，恶意脚本将在 BasiliX 站点的上下文中以当前用户身份执行，可能导致会话劫持、Cookie 窃取或页面篡改等危害。攻击者无需身份认证即可构造包含脚本的恶意邮件诱导用户查看，从而在受害者的浏览器环境中执行任意 JavaScript 代码。"
published = "2002-12-31T00:00:00Z"
remediation = """将 BasiliX Webmail 从 1.1.0 升级至官方修复版本 BasiliX 1.1.1_fix2（可从 SourceForge https://sourceforge.net/projects/basilix/ 下载 Basilix-1.1.1_fix2.tar.gz），该版本已修复邮件主题和正文字段的脚本注入问题。升级前请务必备份配置文件（config.inc.php）及用户数据，升级后重新执行安装程序完成数据库升级。如因业务限制无法立即升级，作为临时缓解措施：在 Web 服务器（如 Apache）层面对邮件显示页面启用 Content-Security-Policy: script-src 'self' 响应头，阻止内联脚本执行；同时在邮件主题和正文渲染输出时，对所有用户提供的内容进行 HTML 实体编码（将 < > " ' & 分别转义为 &lt; &gt; &quot; &#x27; &amp;），防止恶意脚本被浏览器执行。上述缓解措施仅作为临时方案，最终必须完成版本升级以彻底消除漏洞。"""
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "BasiliX Webmail 跨站脚本攻击漏洞"
updated = "2002-12-31T00:00:00Z"

