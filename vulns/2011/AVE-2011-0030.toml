[basic]
description = "Adobe Flash Player 10.2.152.26 之前版本中存在整数溢出漏洞。攻击者通过构造包含超长数组长度值的 ActionScript Function 类方法，在处理过程中触发整数溢出，导致内存破坏，从而可实现远程代码执行。攻击者只需诱使用户访问包含恶意 SWF 文件的网页即可触发该漏洞，无需其他认证条件。该漏洞影响 Adobe Flash Player 10.2.152.26 及更早版本，CVSS 评分 9.3，危害等级严重。Adobe 已在 2011 年 2 月发布安全更新修复此漏洞。"
published = "2011-02-10T16:00:32Z"
remediation = "立即升级 Adobe Flash Player 至 10.2.152.26 或更高版本；使用 Google Chrome 的用户应升级至 9.0.597.94 或更高版本。如无法立即升级，可在浏览器中禁用 Flash 插件或通过组策略限制 Flash 内容执行作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 整数溢出远程代码执行漏洞"
updated = "2026-06-16T23:27:37Z"

