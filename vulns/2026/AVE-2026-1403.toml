[basic]
description = "Electron 应用框架存在上下文隔离绕过漏洞（CWE-693）。当应用通过 contextBridge 向网页内容暴露返回 Promise 的函数时，攻击者可通过劫持 Function.prototype.bind 破坏上下文隔离机制，使不受信任的网页内容获得访问隔离 preload 世界的权限，进而获取 preload 脚本的全部能力。若渲染器未启用沙箱保护或启用了 nodeIntegration 选项，该漏洞可进一步升级为 Node.js 远程代码执行。影响 Electron 39.8.9、40.9.2、41.2.2 和 42.0.0-beta.5 之前的所有版本。攻击者需诱使用户在加载不受信任内容的 Electron 窗口中执行恶意网页代码方可触发漏洞，官方已在上述修复版本中通过强化 Promise 返回函数的绑定机制彻底解决此问题。"
published = "2026-08-05T16:17:04Z"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Electron 上下文隔离绕过漏洞"
updated = "2026-08-05T18:17:14Z"

