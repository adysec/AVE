[basic]
description = "Check Point Firewall-1 4.0 及更早版本的客户端认证接口存在用户名枚举漏洞。该漏洞源于系统对无效用户名和无效密码返回不同的错误提示信息，导致远程攻击者无需认证即可通过暴力枚举方式识别出防火墙上的有效用户名，进而为后续密码破解或针对性攻击提供信息基础。该漏洞影响 Check Point Firewall-1 4.0 及之前版本，CVSS 评分 5.0，危害等级中危。"
published = "2000-12-11T05:00:00Z"
remediation = "升级 Check Point Firewall-1 至 4.1 或更高版本，该版本统一了认证失败的错误提示信息，不再区分用户名无效与密码无效。如无法升级，可在防火墙上配置自定义错误响应页面，并启用登录失败速率限制（如连续 5 次失败后临时封禁源 IP 30 分钟），同时开启详细日志审计以监控暴力枚举行为。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Check Point Firewall-1 客户端认证接口用户名枚举漏洞"
updated = "2026-06-16T21:53:00Z"

