[basic]
description = "HP-UX 11.0 及 HP Tru64 UNIX 4.0f 至 5.1a 版本中集成的 dtterm 终端模拟器存在缓冲区溢出漏洞。本地攻击者可通过向 dtterm 的 -tn 命令行选项传递超长字符串参数触发缓冲区溢出，从而覆盖进程内存空间并执行任意代码。该漏洞影响 HP 多个 UNIX 系统版本，攻击者需拥有本地系统访问权限方可利用，成功利用后可获取目标系统的非授权访问权限，导致机密性、完整性和可用性受损。"
published = "2000-12-11T05:00:00Z"
remediation = "HP-UX 11.0 用户应安装 HP 安全补丁包（参考 HP 安全公告 HPSBUX0009-121），限制 dtterm 的 setuid 权限；Tru64 UNIX 4.0f-5.1a 用户应安装 Compaq 补丁 SRB0039W。如无法打补丁，建议移除 dtterm 的 setuid 位（chmod u-s /usr/dt/bin/dtterm），并将本地用户访问限制为仅信任用户。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "HP dtterm 缓冲区溢出本地代码执行漏洞"
updated = "2026-06-16T21:53:00Z"

