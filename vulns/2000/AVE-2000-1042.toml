[basic]
description = 'Element InstantShop 的 add_2_basket.asp 页面存在隐藏表单变量篡改漏洞。远程攻击者无需身份认证即可通过修改 HTTP 请求中 "price" 隐藏字段的值，以任意价格提交订单，实现低价购买商品。该漏洞影响 Element InstantShop 所有版本，CVSS 评分 7.5，危害等级高，攻击复杂度低，可导致数据完整性与机密性受损。'
published = "2000-12-11T05:00:00Z"
remediation = "该产品 Element InstantShop 已停止维护且不再提供安全更新，建议立即迁移至其他受支持的电子商务平台。如无法立即迁移，必须在服务器端对提交的价格参数进行严格校验，禁止信任客户端提交的隐藏表单字段值；同时启用订单人工审核流程，对每笔订单的价格与实际商品进行比对确认，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Element InstantShop 价格参数篡改漏洞"
updated = "2026-06-16T21:52:56Z"

