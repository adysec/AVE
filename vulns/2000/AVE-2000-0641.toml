[basic]
description = "Ceilidh 是一个基于 Web 的课程管理系统，其存在路径信息泄露漏洞。远程攻击者无需身份认证即可通过向目标系统发送包含特制 translated_path 隐藏表单字段的 HTTP 请求，利用该漏洞获取 Ceilidh 安装目录的真实物理路径。攻击者获取该路径信息后，可进一步用于探测系统目录结构、定位敏感文件，为后续攻击提供信息支撑。该漏洞影响 Lilikoi Ceilidh 2.60 版本，攻击复杂度低，仅需构造简单的 HTTP 请求即可触发。"
published = "2000-06-08T04:00:00Z"
remediation = "建议立即升级至 Ceilidh 2.61 或更高版本（如存在）；若无法升级，修改源代码移除 `translated_path` 隐藏字段的处理逻辑，或在 Web 服务器层（如 Apache mod_rewrite）过滤包含 `translated_path` 的请求参数，同时限制错误信息输出级别防止路径泄露。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Lilikoi Ceilidh 路径信息泄露漏洞"
updated = "2026-06-16T21:51:59Z"

