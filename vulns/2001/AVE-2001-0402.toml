[basic]
description = "PHP-Nuke 的 Network Tools 0.2 插件存在命令注入漏洞。该组件未对用户传入的 $hostinput 变量进行充分过滤，远程攻击者可在无需身份认证的情况下，向相关网络诊断功能注入 shell 元字符（如分号、管道符等），使输入被拼接进系统命令并在服务器端执行任意操作系统命令。漏洞影响安装了 Network Tools 0.2 插件的 PHP-Nuke 站点，可导致信息泄露、文件篡改乃至主机被完全控制。CVSS 评分为 7.5，危害等级为高危。"
published = "2001-11-16T05:00:00Z"
remediation = "立即卸载或禁用 PHP-Nuke 的 Network Tool 0.2 插件模块；若必须保留，在处理 $hostinput 的 PHP 代码中使用 escapeshellcmd() 过滤 shell 元字符（如 ; & | ` $ 等）后再传给 ping/nmap/traceroute，或升级到已修复该输入校验问题的后续版本，并限制仅管理员可访问该网络工具页面。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "PHP-Nuke Network Tool 0.2 Addon 远程命令执行漏洞"
updated = "2026-06-16T21:55:11Z"

