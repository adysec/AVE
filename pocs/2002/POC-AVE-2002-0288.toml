[info]
author = "ave"
description = "验证 Netscape/Mozilla 浏览器在处理宽度为零的特制 GIF 图像时是否存在堆损坏漏洞。加载恶意 GIF 后，浏览器内存损坏，可能导致任意代码执行。PoC 仅为检测目标是否受影响，不包含完整利用代码。"
id = "POC-AVE-2002-0288"
name = "CVE-2002-1091 PoC"
severity = "high"
tags = ["ave-2002-0288"]
vuln_id = [
    "CVE-2002-1091",
    "AVE-2002-0288",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/test.gif"
protocol = "http"

[poc.requests.headers]
User-Agent = "Mozilla/5.0 (Windows NT 5.1; rv:1.0.1) Gecko/20020819 Firefox/0.9.2"

[[poc.requests.matchers]]
expect = true
part = "status"
status = [200]
type = "status"
