[info]
author = "ave"
description = "通过恶意HTML页面触发Google Toolbar Search()函数异常，导致IE浏览器崩溃。当用户访问包含恶意Google Toolbar ActiveX对象的网页时，调用GOOGLE.Search()会引发oleaut32.dll异常，造成拒绝服务。"
id = "POC-AVE-2002-0589"
name = "Google Toolbar 1.1.60 Search Function Denial of Service PoC"
severity = "low"
tags = ["ave-2002-0589"]
vuln_id = [
    "CVE-2002-1444",
    "AVE-2002-0589",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["00EF2092-6AC5-47c0-BD25-CF2D5D657FEB"]
