[basic]
description = "mgetty 软件包中的 faxrunq 和 faxrunqd 组件存在符号链接遍历漏洞。本地攻击者可通过在 /var/spool/fax/outgoing/.last_run 路径下创建指向目标文件的符号链接，利用 faxrunq/faxrunqd 进程的文件操作权限，实现对任意文件的创建或修改。该漏洞影响 mgetty 1.1.19/1.1.20/1.1.21/1.22.8 版本，CVSS 评分 2.1，危害等级低。攻击者需具备本地用户权限，利用条件简单，可导致本地文件完整性破坏。"
published = "2000-10-20T04:00:00Z"
remediation = "升级 mgetty 至 1.1.22 或更高版本，该版本修复了 faxrunq/faxrunqd 盲目跟随符号链接的问题。如无法立即升级，可移除 faxrunq 和 faxrunqd 的 setuid 权限位，或限制 /var/spool/fax/outgoing/ 目录仅允许 root 用户写入，防止本地用户创建符号链接进行攻击。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "Gert Doering mgetty 符号链接遍历漏洞"
updated = "2026-06-16T21:52:16Z"

