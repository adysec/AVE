[basic]
description = "Webteachers Webdata 存在任意文件读取漏洞，具有有效账户的远程攻击者可通过向 WebData 数据库发送导入文件的 POST 请求，读取服务器上的任意文件内容，导致敏感信息泄露。该漏洞影响 Webteachers Webdata 相关版本，攻击者只需拥有合法账户即可利用，无需其他特殊权限，危害等级中等。"
published = "2000-12-11T05:00:00.000"
remediation = "建议立即停止使用已停止维护的 WebTeacher WebData 2.2，迁移至受支持的替代方案。如无法立即替换，应在防火墙层面限制仅受信 IP 可访问 WebData 管理接口，移除所有非必要用户账户，并对 import 功能实施严格的路径白名单校验，防止任意文件读取。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Webteachers Webdata 任意文件读取漏洞"
updated = "2026-06-16T21:52:58.773"

