[basic]
description = "Joomla! 内容管理系统 1.5.x、2.x 及 3.4.6 之前版本中存在 PHP 反序列化漏洞。攻击者可通过向目标服务器发送特制的 HTTP 请求，在 User-Agent 头部中注入恶意序列化数据，触发 PHP 对象注入，从而在未经认证的情况下执行任意 PHP 代码，实现远程代码执行。该漏洞在 2015 年 12 月已被在野利用，影响范围广泛，危害严重。官方已在 3.4.6 版本中修复此漏洞。"
published = "2015-12-16T21:59:06Z"
remediation = "立即升级 Joomla! 至 3.4.6 或更高版本（官方已修复 PHP 反序列化漏洞）。如无法升级，可在 Web 服务器层面（Nginx/Apache）添加规则过滤 User-Agent 头中的恶意序列化载荷，或限制后端 PHP `session.serialize_handler` 为 `php_serialize`。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Joomla Session反序列化远程代码执行漏洞"
updated = "2026-06-17T00:34:46Z"

