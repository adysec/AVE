[basic]
description = "Oracle 8.1.5 数据库组件中存在缓冲区溢出漏洞，当 names、tnslsnr、tnsping 等工具处理超长 ORACLE_HOME 环境变量时，未正确校验输入长度导致栈溢出。本地攻击者可通过设置特制的 ORACLE_HOME 环境变量并调用受影响程序触发该漏洞，成功利用可获得目标系统的提升权限，实现完全控制受影响系统。该漏洞影响 Oracle 8.1.5 版本，攻击复杂度低，无需身份认证即可利用。"
published = "2000-12-19T05:00:00.000"
remediation = "立即将 Oracle 8.1.5 升级至 Oracle 官方仍在支持的最新版本（如 Oracle 19c 或 21c），并安装对应版本的最新关键补丁更新（CPU）。升级前作为临时缓解措施，限制本地用户对 ORACLE_HOME 环境变量的设置权限，仅允许受信任的管理员账户修改该变量，同时通过文件系统权限控制 Oracle 二进制文件（如 names、tnslsnr 等）仅允许 root 或 oracle 用户执行。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Oracle 8.1.5 多应用组件缓冲区溢出本地权限提升漏洞"
updated = "2026-06-16T21:52:54.923"

