[basic]
description = "Cisco IOS 和 IOS XE 软件的 SNMP 子系统存在缓冲区溢出漏洞，源于 SNMP 协议处理过程中对特制数据包边界检查不充分。经过身份认证的远程攻击者可通过向目标设备发送特制的 SNMP 数据包（支持 IPv4 和 IPv6），利用该漏洞在受影响系统上执行任意代码或导致系统重载。该漏洞影响所有 SNMP 版本（v1/v2c/v3），利用 SNMP v2c 及更早版本需知道只读团体字符串，利用 SNMP v3 需拥有用户凭据。成功利用可获取设备完全控制权。Cisco 已发布修复建议。"
published = "2017-07-17T21:29:00Z"
remediation = "立即升级受影响的 Cisco IOS/IOS XE 设备至 Cisco 安全公告 cisco-sa-20170629-snmp 中对应版本的第一修复版本，可通过 Cisco IOS Software Checker 工具查询具体版本号。如无法立即升级，在全局配置模式下使用 snmp-server view 命令创建视图 NO_BAD_SNMP，逐一排除 ADSL-LINE-MIB、ALPS-MIB、CISCO-BSTUN-MIB 等 10 个受影响 MIB，并将该视图绑定到 SNMP community 字符串，同时限制仅允许可信管理站访问 SNMP 服务。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS/IOS XE SNMP 远程代码执行漏洞"
updated = "2026-06-17T01:22:55Z"

