[basic]
description = "SGI IRIX 5.3 至 6.5.10 版本中 InPerson 组件的 inpview 工具存在条件竞争漏洞。本地攻击者可通过在目标系统上创建指向 .ilmpAAA 临时文件的符号链接，利用该程序对临时文件的不安全处理方式触发条件竞争，从而获取系统权限。该漏洞影响范围包括 IRIX 5.3 至 6.5.10 版本，攻击者需具备本地访问权限，利用难度较高，但成功利用后可实现权限提升。"
published = "2000-10-20T04:00:00.000"
remediation = "立即应用 SGI 安全公告 20001101-01-I 中提供的补丁，或升级 IRIX 至 6.5.11 及以上版本。如无法升级，可移除 /usr/lib/InPerson/inpview 的 SUID 权限（chmod u-s /usr/lib/InPerson/inpview）以消除提权风险，但会影响 InPerson 正常功能。"
score = 3.7
severity = "LOW"
sources = ["epss"]
title = "SGI IRIX InPerson inpview 竞争条件漏洞"
updated = "2026-06-16T21:52:30.323"

