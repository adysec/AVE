[basic]
description = "Window Maker (wmaker) 0.80.0 及更早版本在处理图像文件时，因未正确验证图像的宽度和高度信息来分配缓冲区，导致存在缓冲区溢出漏洞。远程攻击者可通过诱导用户打开特制的图像文件，触发缓冲区溢出并在目标系统上以当前用户权限执行任意代码。该漏洞影响 Window Maker 0.80.0 及更早版本，CVSS 评分 7.5（高危），攻击向量为网络、攻击复杂度低、无需身份认证，影响机密性、完整性和可用性。攻击者需诱导用户打开恶意图像文件即可触发漏洞，实现远程代码执行。"
published = "2002-11-12T05:00:00Z"
remediation = "建议立即升级 Window Maker 到 0.80.1 或更高版本（如 0.92.0 及以上稳定版），可通过包管理器执行 `apt-get upgrade wmaker` 或 `dnf update WindowMaker` 完成升级。若暂无法升级，可临时禁用不受信任的图像文件处理，或在防火墙层面限制非受信来源访问 Window Maker 服务端口作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Window Maker 窗口制作工具 缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:59:02Z"

