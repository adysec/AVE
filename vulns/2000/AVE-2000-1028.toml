[basic]
description = "Netscape Messaging Server 4.15p1 的 POP3 服务存在用户枚举漏洞。该服务器在处理 POP3 认证请求时，对不存在的用户名和错误的密码返回不同的错误提示信息，导致远程攻击者无需认证即可通过暴力枚举方式探测系统上的有效用户账户。攻击者利用此漏洞可收集有效邮箱地址，进而用于发送垃圾邮件或进行针对性钓鱼攻击。该漏洞无需特殊权限，攻击复杂度低，仅需网络可达即可利用。"
published = "2000-12-19T05:00:00.000"
remediation = "该漏洞源于 Netscape Messaging Server 4.15p1 的 POP3 服务对用户名错误和密码错误返回不同错误信息，导致攻击者可枚举有效用户。由于该产品已停止维护，建议立即迁移至受支持的邮件服务器（如 Dovecot 或 Microsoft Exchange），并在迁移前配置 POP3 服务返回通用错误信息，避免区分用户名与密码错误。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Netscape Messaging Server POP3 用户枚举漏洞"
updated = "2026-06-16T21:52:51.613"

