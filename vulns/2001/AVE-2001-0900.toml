[basic]
description = "Internet Explorer 5.5 及更早版本中的 HTML 电子邮件功能存在安全漏洞。攻击者可通过为邮件附件设置异常的 MIME 类型，利用 Internet Explorer 对该类型处理不当的问题，诱使用户在打开或预览包含恶意附件的 HTML 电子邮件时触发代码执行。该漏洞影响 Internet Explorer 5.5 及更早版本的用户，攻击者无需身份认证即可通过网络远程发起攻击，成功利用后可实现对受影响系统的代码执行。"
published = "2001-05-03T04:00:00Z"
remediation = "安装微软 2001 年 3 月发布的安全补丁 Q290108（MS01-020 公告），或升级到 Internet Explorer 6.0。如暂无法升级，可在 Internet Explorer 安全区域设置中禁用文件下载选项作为临时缓解措施，并避免打开来自未知发件人的 HTML 电子邮件及附件。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Internet Explorer 远程代码执行漏洞"
updated = "2026-06-16T21:53:46Z"

