[basic]
description = "slocate（secure locate）在 2.7 版本前存在本地缓冲区溢出漏洞，程序在处理过长的 -c（创建数据库）或 -r（指定数据库路径）命令行参数时未进行边界检查，导致栈缓冲区溢出。本地攻击者可通过构造超长参数调用 slocate，覆盖返回地址或函数指针，实现任意代码执行并提权至 root 权限（slocate 通常以 setuid root 运行）。影响范围为 slocate 2.5、2.6 等早期版本，攻击条件要求攻击者已具备本地账户并能执行 slocate 二进制文件。利用方式为向 -c 或 -r 参数传递精心构造的超长字符串，触发缓冲区溢出并劫持控制流执行 shellcode。该漏洞 CVSS 7.2 分（AV:L/AC:L/Au:N/C:C/I:C/A:C），属本地提权高危漏洞。"
published = "2003-02-19T05:00:00Z"
remediation = "建议立即将 slocate 升级至 2.7 或更高版本以修复缓冲区溢出漏洞。若无法立即升级，可通过设置严格的文件权限限制非受信本地用户调用该程序，或移除该软件以消除风险。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "GNU slocate 本地缓冲区溢出漏洞"
updated = "2026-06-16T22:01:25Z"

