[basic]
description = "imap-uw IMAP 软件包中的 POP2/POP3 服务器（pop3d）在创建邮件锁文件时使用了可预测的文件名，未经身份认证的本地攻击者可以通过提前创建其他用户邮箱的锁文件，导致合法用户无法访问其邮件，从而造成拒绝服务攻击。该漏洞影响 FreeBSD 及其他操作系统上使用 imap-uw 包的系统，攻击者需具有本地系统访问权限即可利用，利用方式简单且无需特殊条件，可导致部分用户邮件服务不可用。"
published = "2001-08-31T04:00:00Z"
remediation = "建议将 imap-uw 软件包升级至已修复该漏洞的后续版本，或针对 pop3d 服务手动应用补丁以实现锁文件名的随机化生成。在无法立即升级的情况下，可以通过限制对锁文件存放目录的写权限，禁止非特权本地用户创建任意锁文件来缓解风险。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "University of Washington imap-uw IMAP 拒绝服务漏洞"
updated = "2026-06-16T21:53:21Z"

