[basic]
description = "Google Chrome 20.0.1132.57 之前版本中存在释放后重用（Use-After-Free）漏洞，该漏洞源于 CSS 计数器（counter）处理过程中对已释放内存对象的错误引用。远程攻击者可构造特制网页，诱使用户访问，触发内存错误引用，导致浏览器崩溃拒绝服务，或可能实现任意代码执行。该漏洞影响 Google Chrome 及基于 WebKit 内核的 Apple Safari 等浏览器，CVSS v2 评分 7.5，危害等级高。Google 已在 Chrome 20.0.1132.57 稳定版更新中修复此漏洞。"
published = "2012-07-12T21:55:06.030"
remediation = "立即将 Google Chrome 升级至 20.0.1132.57 或更高版本（通过 Chrome 内置自动更新或从 google.com/chrome 下载安装）。使用 Apple Safari 的用户应升级至 Safari 6.0.1 或更高版本（通过 Software Update 或从 support.apple.com 获取）。openSUSE 用户可安装 openSUSE 2012 年 8 月安全更新中的 chromium 修补包。如无法立即升级，可禁用 JavaScript 作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome 内存错误引用漏洞"
updated = "2026-06-16T23:42:11.877"

