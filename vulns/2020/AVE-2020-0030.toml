[basic]
description = "rConfig 3.9.4及更早版本的compliancepolicies.inc.php文件存在未经身份验证的SQL注入漏洞。攻击者无需登录即可向目标系统发送特制请求触发该漏洞，由于rConfig默认以明文形式存储被监控网络设备的密码，攻击者可通过SQL注入提取数据库中的设备凭据，进而实现横向移动并获得对被监控网络设备的访问权限，严重危害企业网络基础设施安全。该漏洞由CWE-89类型缺陷导致，CVSS评分9.8，危害等级严重。"
published = "2020-06-04T04:15:12Z"
remediation = "立即升级 rConfig 至 3.9.7 或更高版本以修复 compliancepolicies.inc.php 中的未认证 SQL 注入漏洞。如无法立即升级，应在 Web 服务器或反向代理层（如 Nginx/Apache）部署 WAF 规则，拦截对 /www/compliancepolicies.inc.php、/www/compliancepolicyelements.inc.php、/www/devices.inc.php、/www/snippets.inc.php 的恶意 SQL 注入请求，同时限制管理后台 IP 访问并尽快安排补丁更新。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "rConfig 网络设备配置管理软件 SQL注入漏洞"
updated = "2026-06-17T02:47:59Z"

