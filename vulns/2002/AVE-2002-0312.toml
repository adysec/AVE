[basic]
description = "Intellisol Xpede（原名 WorkforceROI Xpede）4.1 及 7.0 版本存在弱密码加密漏洞。认证信息在存入 Cookie 时使用了安全性不足的加密算法，攻击者可通过物理接触目标机器、网络嗅探或跨站脚本攻击等方式获取 Cookie 中的加密凭据，并利用弱加密算法的可逆向性解密出明文密码，从而获取系统敏感权限。该漏洞允许本地或具有 Cookie 访问权限的攻击者实现权限提升，CVSS 评分 7.2，危害等级高。"
published = "2002-08-12T04:00:00Z"
remediation = '立即升级 WorkforceROI Xpede 至厂商提供的最新补丁版本。如已无官方支持，建议迁移至其他支持强加密认证机制的替代产品；如必须继续使用，须将 Web 服务器配置为启用 HTTPS 并启用安全 cookie 属性（Secure+HttpOnly），同时在服务器端会话中存储认证状态而非在 cookie 中存放明文/弱加密凭据。另外应立即通知所有用户修改密码，并在操作系统层面限制对 cookie 文件目录（如 `c:\winnt\Profiles\*\Cookies\*@*.txt`）的访问权限，仅允许最小必要用户可读。'
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Intellisol Xpede 弱密码加密漏洞"
updated = "2026-06-16T21:57:32Z"

