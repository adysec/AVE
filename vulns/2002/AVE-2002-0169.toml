[basic]
description = "Snort 1.8.3 未正确定义最小 ICMP 头部大小，远程攻击者可向运行 Snort 的目标系统发送特制的畸形 ICMP 数据包，触发内存访问越界导致 Snort 进程崩溃并产生核心转储。该漏洞无需身份认证即可远程触发，攻击复杂度低，主要影响 Snort 1.8.3 版本的入侵检测系统部署环境，可导致网络监控服务中断。"
published = "2002-03-25T05:00:00Z"
remediation = "建议立即升级 Snort 至 1.9.0 或更高版本，该版本已正确定义最小 ICMP 头部大小并修复此漏洞。如无法立即升级，可在 Snort 配置中添加规则过滤畸形 ICMP 数据包，或通过网络访问控制限制允许发送 ICMP 流量到 Snort 主机的来源 IP 范围作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Martin Roesch Snort 1.8.3 ICMP 拒绝服务漏洞"
updated = "2026-06-16T21:56:49Z"

