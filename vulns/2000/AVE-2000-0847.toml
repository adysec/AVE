[basic]
description = 'Caucho Technology Resin 1.2 及更早版本存在 JSP 源代码泄漏漏洞，远程攻击者通过在 .jsp 文件请求 URL 后附加特殊字符序列（如 ".."、"%2e.."、"%81"、"%82" 等）绕过访问限制，导致服务器返回 JSP 源文件而非执行后的结果。攻击者无需身份认证即可通过网络远程利用，成功后可获取 JSP 源码中的敏感信息（如数据库连接凭证、业务逻辑等），危害中等。该漏洞影响 Resin 1.2 及之前版本。'
published = "2000-11-23T05:00:00.000"
remediation = "升级至 Caucho Resin 2.0 或更高版本，该漏洞已在后续版本中修复。如无法升级，在 Web 服务器前置代理层配置规则，拦截包含 `..`、`%2e`、`%81`、`%82` 等特殊字符的 URL 请求，并禁止直接对外暴露 JSP 源码目录的访问权限。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Caucho Technology Resin JSP 源代码泄漏漏洞"
updated = "2026-06-16T21:53:25.010"

