[basic]
description = "SGI IRIX 6.3/6.4/6.5 操作系统中 Performance Copilot 组件的 Performance Metrics Collector Daemon (PMCD) 存在输入验证缺陷。远程攻击者无需身份认证即可向 PMCD 端口发送超长字符串，触发资源耗尽，导致拒绝服务。该漏洞利用网络可达性即可实施，影响系统监控服务的可用性，攻击者可通过此漏洞中断目标系统的性能监控功能。"
published = "2001-08-31T04:00:00Z"
remediation = "应用 SGI 安全公告 20020407-01-I 中提供的补丁，将 Performance Copilot PMCD 守护进程更新至修复版本。同时，通过 IRIX 的 ipfilter 防火墙规则限制对 PMCD 端口 4321 的访问，仅允许受信任的管理主机连接该端口，以阻止未经授权的远程字符串超长输入导致的资源耗尽拒绝服务。若无法立即应用补丁，可暂时禁用 PMCD 服务或在网络边界封禁 4321/UDP 和 4321/TCP 端口作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "SGI IRIX Performance Copilot 远程拒绝服务漏洞"
updated = "2026-06-16T21:53:21Z"

