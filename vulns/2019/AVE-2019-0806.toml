[basic]
description = "tags.<value>思科 Small Business RV320 和 RV325 双千兆 WAN VPN 路由器的 Web 管理界面存在访问控制不当漏洞，未经身份认证的远程攻击者可通过 HTTP 或 HTTPS 协议连接到受影响设备并请求特定 URL 路径，绕过访问控制获取路由器配置文件或详细诊断信息等敏感数据。该漏洞影响 RV320 和 RV325 系列路由器，CVSS 评分 7.5（高危），思科已发布固件更新修复此漏洞。"
published = "2019-01-24T16:29:00.317"
remediation = '立即将 Cisco Small Business RV320 和 RV325 路由器的固件升级至 1.4.2.22 或更高版本：登录设备 Web 管理界面，依次进入"维护"→"固件升级"，上传 Cisco 官方提供的新固件文件并完成重启。如暂时无法升级，应在"防火墙"→"常规设置"中关闭远程管理功能，仅保留 LAN 侧管理接口访问，以降低未授权信息泄露风险。升级文件可从 Cisco 软件中心或思科技术支持渠道获取。'
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "思科 Small Business RV320 和 RV325 路由器 访问控制不当信息泄露漏洞"
updated = "2026-06-17T02:28:58.090"

