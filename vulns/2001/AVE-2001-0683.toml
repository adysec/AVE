[basic]
description = "FaSTream FTP++ Server 2.0 在用户认证阶段对用户名长度的输入验证存在缺陷，未经身份认证的远程攻击者可通过向目标 FTP 服务发送超长用户名触发缓冲区溢出或内存耗尽，从而导致拒绝服务，并在某些条件下可能执行任意系统命令。该漏洞影响运行 FaSTream FTP++ Server 2.0 版本的系统，攻击者无需任何凭据即可在远程发起攻击，利用方式为构造包含超长字符串的 USER 命令报文并发送至服务端口。由于该版本已停止维护且利用门槛较低，存在被批量扫描利用的风险。"
published = "2001-06-02T04:00:00Z"
remediation = "建议立即升级 FaSTream FTP++ Server 至 Beta 10 Build 3 或更高版本以修复已知路径泄露问题；同时应在防火墙或 IDS 中部署规则，拦截包含超过 2048 字节用户名的 FTP 连接请求，并在服务器配置中限制 USER 命令参数长度，拒绝超长用户名连接。如条件允许，建议禁用 FTP++ 内嵌服务器组件或替换为其他经过安全加固的 FTP 服务器软件作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "FaSTream FTP++ Server 超长用户名缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:53:58Z"

