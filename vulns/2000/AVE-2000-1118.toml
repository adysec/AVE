[basic]
description = "BeOS r5 pro 及更早版本中的 PostMaster 1.0 邮件客户端存在拒绝服务漏洞。远程攻击者可通过向目标用户发送包含超长 URL 的邮件消息，导致 PostMaster 在处理该 URL 时发生缓冲区溢出或资源耗尽，从而使邮件客户端崩溃或无法响应。攻击者无需身份认证即可利用此漏洞，攻击条件仅为能够向目标发送邮件。该漏洞影响 BeOS r5 pro 及之前版本，CVSS 评分 5.0，危害等级中等。"
published = "2001-01-09T05:00:00.000"
remediation = "将 BeOS r5 pro 及更早版本上的 PostMaster 1.0 升级至后续修复版本，或迁移至受支持的现代邮件服务器软件。临时缓解措施为在邮件网关或防火墙处配置规则，将入站邮件 URL 最大长度限制为 256 字节并拦截包含超长 URL 的外部邮件。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "BeOS PostMaster 1.0 远程拒绝服务漏洞"
updated = "2026-06-16T21:53:16.270"

