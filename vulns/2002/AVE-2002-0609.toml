[basic]
description = "标签包裹。<value>PlanetDNS PlanetWeb 1.14 及更早版本存在缓冲区溢出漏洞。远程攻击者无需身份认证，可通过向目标服务器发送包含超长 URL 的 HTTP GET 请求或使用超长方法名称的 HTTP 请求触发该漏洞，成功利用后可执行任意代码，导致服务器被完全控制。该漏洞利用复杂度低，攻击者仅需通过网络发送特制请求即可完成攻击，对系统机密性、完整性和可用性均造成严重影响。"
published = "2003-04-02T05:00:00Z"
remediation = "PlanetDNS 已于多年前停止维护，官方不再提供安全补丁。建议立即将 PlanetWeb 替换为仍在维护的开源 Web 服务器（如 Nginx、Apache HTTP Server 或 Caddy），并配置请求行长度限制（如 Nginx 设置 large_client_header_buffers 4 16K，Apache 设置 LimitRequestFieldSize 和 LimitRequestLine），以阻止过长 URL 或方法名触发缓冲区溢出。在完成替换前，可在前端部署 WAF 或反向代理，对 HTTP 请求行长度进行严格校验并丢弃超长请求，同时限制该服务器的网络访问范围为仅允许可信源 IP 访问。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "PlanetDNS PlanetWeb HTTP GET 缓冲区溢出漏洞"
updated = "2026-06-16T21:59:25Z"

