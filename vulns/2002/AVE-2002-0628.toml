[basic]
description = "SurfControl SuperScout Email Filter 的管理界面（STEMWADM）中 msgError.asp 文件存在跨站脚本（XSS）漏洞。远程攻击者无需身份认证即可通过向该页面提交特制的 Reason 参数，注入任意脚本或 HTML 代码。成功利用后，攻击者可在受害者的浏览器会话中执行恶意脚本，窃取管理员 Cookie 或实施会话劫持。该漏洞影响 SurfControl SuperScout Email Filter 3.5 及 4.0 版本，CVSS 评分为 4.3，危害等级为中等。"
published = "2003-03-31T05:00:00.000"
remediation = "建议立即安装最新官方安全补丁，SurfControl SuperScout Email Filter 的管理界面漏洞已修复在 2003 年版中。立即升级到 SurfControl SuperScout Email Filter 2003 或更高版本，如果无法立即应用补丁，请在防火墙中禁用对 msgError.asp 页面的 HTTP POST 请求，并加强对管理界面的认证保护，以防止 XSS 攻击。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "SurfControl SuperScout Email Filter 跨站脚本攻击漏洞"
updated = "2026-06-16T21:59:29.933"

