[basic]
description = "IBM AS/400 Firewall R440 的 Web 管理接口存在拒绝服务漏洞。远程攻击者无需身份认证即可通过向目标设备的 Web 管理端口发送一个空的 GET 请求，导致防火墙服务崩溃或停止响应，造成拒绝服务。该漏洞影响 IBM AS/400 Firewall R440 版本，攻击条件简单，危害中等，但不会导致数据泄露或权限提升。"
published = "2000-12-11T05:00:00Z"
remediation = "立即安装 IBM 提供的 APAR SA90544 补丁，该补丁已修复空 GET 请求导致拒绝服务的问题。如无法安装补丁，升级 IBM AS/400 Firewall 至 R450 及以上版本。同时限制 Web 管理界面的访问来源 IP，仅允许受信任的管理网段访问，并在网络层部署访问控制规则过滤异常 HTTP 请求。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "IBM AS/400 Firewall 拒绝服务漏洞"
updated = "2026-06-16T21:53:01Z"

