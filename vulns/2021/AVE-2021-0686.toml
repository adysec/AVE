[basic]
description = "Linux内核netfilter子系统的x_tables.c模块中存在堆越界写入漏洞。当用户在兼容模式下调用iptables或ip6tables的setsockopt操作时，xt_compat_target_from_user()函数在将32位结构体转换为64位结构体的过程中，分配内存时未正确计算target->targetsize的大小，导致memset写入超出分配堆块边界，可覆盖相邻的kmalloc-512缓存对象（如msg_msg结构体）。该漏洞影响自2.6.19-rc1起至修复版本（5.12、5.10.31、5.4.113、4.19.188、4.14.231、4.9.267、4.4.267）之前的所有Linux内核版本，CVSSv3评分8.3（高危）。攻击者需在目标系统上拥有本地执行权限，通过创建新用户命名空间（unshare CLONE_NEWUSER）并构造畸形的IPv6 ip6tables规则（如设置特定大小的target和pad字段），即可触发堆溢出并覆盖相邻堆块，进而实现use-after-free获取内核代码执行权限，完成本地权限提升至root，且可绕过KASLR、SMAP、SMEP等内核保护机制。攻击条件为攻击者已具备目标系统的本地shell访问权限，利用复杂度高，但无需身份认证，成功利用后可完全控制系统。"
published = "2021-07-07T12:15:08Z"
remediation = '立即升级 Linux 内核至 5.9 或更高版本（上游补丁提交 b29c457a6511435960115c0f548c4360d5f4801d）。主流发行版用户应安装对应安全更新：Ubuntu 20.04 LTS 升级至内核 5.4.0-74.83 或更高版本（执行 apt update && apt install linux-image-generic && reboot）；RHEL/CentOS 7 升级至内核 3.10.0-1160.53.1 或更高（执行 yum update kernel && reboot）；RHEL/CentOS 8 升级至内核 4.18.0-305 或更高（执行 dnf update kernel && reboot）。若无法立即升级，可通过 sysctl 临时限制非特权用户创建用户命名空间（执行 echo "kernel.unprivileged_userns_clone = 0" >> /etc/sysctl.conf && sysctl -p），以阻止漏洞利用路径，但仅作为临时缓解手段，最终仍须升级内核彻底修复。'
score = 8.3
severity = "HIGH"
sources = ["kev"]
title = "Linux Netfilter 本地权限提升漏洞"
updated = "2026-06-17T03:37:25Z"

