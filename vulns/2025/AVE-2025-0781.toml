[basic]
description = "Microsoft PC Manager 存在 Improper Link Resolution Before File Access（CWE-59）漏洞，即符号链接跟踪漏洞。本地攻击者可在低权限条件下利用该漏洞，通过创建恶意的符号链接指向系统敏感文件，诱使 PC Manager 以高权限执行文件操作，从而将权限提升至 SYSTEM。成功利用后攻击者可完全控制受影响系统，包括安装程序、查看/更改/删除数据或创建新账户。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:33.027"
remediation = "建议立即通过 Microsoft Store 将 Microsoft PC Manager 更新至最新版本（2025 年 2 月安全更新已修复此漏洞）。打开 Microsoft Store → 库 → 获取更新，或开启自动更新以确保及时安装。由于该漏洞为本地提权（需低权限用户登录后触发），如无法立即更新，应限制非管理员用户的本地登录权限，并监控异常的文件链接创建行为作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft PC Manager 特权提升漏洞"
updated = "2026-06-17T08:43:05.863"

