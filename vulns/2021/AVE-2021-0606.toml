[basic]
description = "ExifTool 是一款广泛用于读取和处理图片元数据的开源工具，但在处理特制的 DjVu 格式图像文件时存在代码注入漏洞。该漏洞源于 ExifTool 对 DjVu 文件中的用户数据未进行正确的中立化处理，攻击者可构造包含恶意 Perl 代码的 DjVu 文件，当目标系统使用受影响版本的 ExifTool 解析该文件时，嵌入的恶意代码会被执行，导致任意代码执行。受影响版本为 7.44 至 12.23。该漏洞攻击条件为本地低权限访问，攻击者无需身份认证且无需用户交互，攻击复杂度低。成功利用可导致攻击者在目标系统执行任意命令，进而获取敏感数据或进一步控制系统。"
published = "2021-04-23T18:15:08Z"
remediation = "立即将 ExifTool 升级至 12.24 或更高版本（受影响版本为 7.44 至 12.23），可通过官方下载页面 https://exiftool.sourceforge.net/ 获取最新安装包或使用 CPAN 执行 `cpan install Image::ExifTool` 更新。升级后请执行 `exiftool -ver` 确认版本号不低于 12.24。临时缓解措施：在补丁应用前，避免使用 ExifTool 解析来源不可信的 DjVu 格式图像文件，或对上传文件进行格式校验与沙箱隔离处理。"
score = 6.8
severity = "MEDIUM"
sources = ["kev"]
title = "ExifTool DjVu 文件解析远程代码执行漏洞"
updated = "2026-06-17T03:36:47Z"

