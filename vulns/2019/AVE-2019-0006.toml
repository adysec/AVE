[basic]
description = "Windows 安全支持提供程序接口（SSPI）在处理网络身份验证请求时存在权限提升漏洞，攻击者可利用会话 0 中的身份验证处理缺陷提升权限。该漏洞影响 Windows 7、Windows 8.1、Windows 10 及 Windows Server 2008 R2、2012、2012 R2、2016、2019 等多个版本。攻击者需具备本地低权限访问权限，无需用户交互即可触发漏洞，成功利用可导致系统完全受控（机密性、完整性、可用性均受高影响）。Microsoft 已于 2019 年 1 月发布补丁修复。"
published = "2019-01-08T21:29:00Z"
remediation = '立即安装 Microsoft 2019 年 1 月安全更新 KB4480970（Windows 10 版本 1803 / Windows Server 2016）或 KB4480969（Windows 10 版本 1809 / Windows Server 2019），通过 Windows Update 自动更新或手动下载安装。如无法立即打补丁，可在组策略中禁用 NTLM 身份验证的会话 0 网络令牌委派作为临时缓解措施，命令为：reg add "HKLM\SYSTEM\CurrentControlSet\Control\Lsa" /v LsaLookupNames /t REG_DWORD /d 0 /f，随后重启系统。'
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows SSPI网络身份验证会话0特权提升漏洞"
updated = "2026-06-17T02:08:20Z"

