[basic]
description = 'Recourse ManTrap 1.6/1.6.1 是一款用于隐藏真实系统环境的蜜罐工具，它通过建立 chroot 环境来伪装主机系统，试图让攻击者误以为已经获得 root 权限。然而该工具在构建 chroot 环境后，其根目录文件系统 "/" 的 inode 节点号高于正常系统根目录的标准值，导致未经身份认证的本地攻击者可以通过 stat 系统调用检查根目录的 inode 号，识别出自身正处于 chroot 限制环境中，从而发现蜜罐存在并规避检测。该漏洞影响 ManTrap 1.6 及 1.6.1 版本，攻击条件为攻击者已登录目标系统并获得有限的 shell 访问权限，利用方式简单，仅需执行 stat("/") 等基本文件系统命令即可完成探测，造成系统安全机制被识别的信息泄露后果。'
published = "2001-01-09T05:00:00Z"
remediation = "建议升级到 ManTrap 1.6.2 或更高版本，该版本修复了根目录 inode 泄露问题。如无法升级，可修改 chroot 环境的文件系统参数，将根目录 inode 号调整为较低值，或采用 mount --bind 方式重新挂载根目录以掩盖 inode 特征。同时建议在 Solaris 系统中启用 /dev/urandom 作为随机数源，避免使用静态 inode 分配策略。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "Recourse ManTrap 1.6.1 根目录Inode信息泄露漏洞"
updated = "2026-06-16T21:53:14Z"

