[basic]
description = "EServ 2.92 Build 2982 在处理 SMTP 协议请求时存在缓冲区溢出漏洞。远程未经身份验证的攻击者可以通过发送特制的超长 HELO 和 MAIL FROM 命令，导致服务崩溃引发拒绝服务（DoS）状态，在特定条件下还可能实现远程任意代码执行。该漏洞影响 EServ 2.92 特定版本，攻击者无需权限即可通过网络触发，危害等级较高。"
published = "2000-12-19T05:00:00.000"
remediation = "建议立即停止使用 EServ 2.92 及以下版本，迁移至支持现代安全标准的邮件服务器软件（如 Postfix 或 Exim）。若必须维持运行，应在防火墙或反向代理层限制对 SMTP 端口（25）的访问，并配置输入长度检查规则，拦截超长的 HELO 和 MAIL FROM 指令以缓解拒绝服务攻击。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "EServ 2.92 远程拒绝服务及代码执行漏洞"
updated = "2026-06-16T21:52:44.277"

