[basic]
description = 'tags as requested.<value>guestserver.cgi 是 Lars Ellingsen 开发的一个 CGI 脚本程序，存在远程命令执行漏洞。攻击者无需身份认证，即可通过向该脚本的 "email" 参数中注入 shell 元字符（如分号、管道符等），在 Web 服务器上执行任意操作系统命令。该漏洞影响所有部署了 guestserver.cgi 的 Web 服务器，由于网络可达且无需认证，CVSS 评分达到满分 10.0，危害等级为严重。攻击者利用此漏洞可完全控制目标服务器，窃取数据、植入后门或进一步内网渗透。建议管理员立即移除或修复该 CGI 脚本，并升级至安全版本。'
published = "2001-05-03T04:00:00Z"
remediation = "立即从 Web 服务器文档根目录中删除 guestserver.cgi 脚本，或将其移至非 CGI 执行目录并禁止执行权限。若业务暂时无法下线该脚本，须修改 guestserver.cgi 源码，对 email 参数增加严格的输入验证与过滤，禁止传入分号、管道符、美元符、反引号、反斜杠等 shell 元字符，并使用参数化方式处理用户输入。同时在 Apache 或 Nginx 配置中通过 RewriteRule 或 location 块限制对 guestserver.cgi 的访问，或在前置 WAF/IPS 中部署规则拦截包含 shell 元字符的 email 参数请求。建议定期审查服务器 CGI 目录，移除或禁用所有已知危险的旧版 CGI 脚本，并在防火墙层面禁止不必要的对外 CGI 服务端口。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Lars Ellingsen guestserver.cgi 远程命令执行漏洞"
updated = "2026-06-16T21:53:49Z"

