[basic]
description = "Opera 11.50 之前版本存在远程拒绝服务漏洞，攻击者可通过网页脚本在窗口间移动 AUDIO 或 VIDEO 元素，触发浏览器内存管理错误导致应用程序崩溃。该漏洞影响 Opera 11.50 之前所有版本，CVSS 评分 5.0（中危），攻击向量为网络，攻击复杂度低，无需认证，仅影响可用性。攻击者只需诱导用户访问包含恶意脚本的网页，即可触发浏览器崩溃造成拒绝服务。Opera 已在 11.50 版本中修复该漏洞，建议用户升级至 11.50 或更高版本。"
published = "2011-07-01T10:55:02Z"
remediation = "建议立即升级 Opera 浏览器至 11.50 或更高版本（官网 https://www.opera.com/download 下载最新版）。若暂时无法升级，可暂时禁用 JavaScript（设置→隐私与安全→网站设置→JavaScript→禁止）或避免访问不可信网站，作为临时缓解措施防止音视频元素跨窗口移动触发崩溃。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera Web Browser 远程拒绝服务漏洞"
updated = "2026-06-16T23:31:39Z"

