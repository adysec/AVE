[basic]
description = "Allaire JRun 2.3 服务器中，SSIFilter servlet 可被直接调用，未对可执行内容的源码访问做充分限制。远程攻击者无需身份认证，即可通过直接请求 SSIFilter 相关路径，获取本应编译或处理后才对外提供的可执行内容（如 JSP 等）源代码，造成敏感业务逻辑与配置信息泄露。该漏洞影响 Allaire JRun 2.3，攻击条件为可网络访问目标服务且访问成本低，主要危害为机密性受损，CVSS 约 5.0，属中危信息泄露类问题。"
published = "2000-12-11T05:00:00.000"
remediation = "标签中。<value>升级 Allaire JRun 至 2.3.6 或更高版本以修复该漏洞，或迁移至受支持的 Macromedia ColdFusion/JRun 后续版本；在 web.xml 中注释或删除 SSIFilter servlet 的 servlet-mapping 配置；在网络边界防火墙或 Web 服务器上通过访问控制列表（ACL）拦截外部对 /SSIFilter 路径的直接访问；如无法立即升级，部署 Web 应用防火墙规则，阻断对 SSIFilter servlet 的未授权请求。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Allaire JRun SSIFilter 远程源代码泄露漏洞"
updated = "2026-06-16T21:53:03.470"

