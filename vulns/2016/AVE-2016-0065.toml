[basic]
description = "Netgear DGN2200 和 DGND3700 路由器固件中存在信息泄露漏洞，其 /BSW_cxttongr.htm 页面未设置任何身份认证机制，远程攻击者无需任何凭证即可直接访问该页面。当该页面被访问时，会在重定向至 bsw_vfysucc.cgi 之前以明文形式泄露管理员密码。攻击者可利用获取的管理员密码登录路由器 Web 管理界面，进而完全控制目标设备，修改网络配置、劫持 DNS 或实施中间人攻击。该漏洞影响 DGN2200 V1.0.0.50_7.0.50 及 DGND3700 V1.0.0.17_1.0.17 版本，CVSS 评分 9.8，危害等级严重。"
published = "2018-07-24T15:29:00Z"
remediation = 'Netgear 已停止对 DGN2200 和 DGND3700 系列路由器的固件支持，未针对此漏洞发布安全补丁。建议立即更换为仍在支持周期内的新款路由器。如无法更换，请采取以下临时缓解措施：(1) 登录路由器管理界面，关闭"远程管理"(Remote Management)和"从广域网访问 Web 管理"(Allow WAN Access to Web Management)选项；(2) 在上游防火墙中限制仅内网可信 IP 地址可访问路由器 Web 管理端口（80/443）；(3) 禁用 UPnP 和 WPS 等不必要服务以缩小攻击面；(4) 定期访问 Netgear 官方支持页面检查是否有新版固件发布并及时更新。'
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Netgear DGN2200 信息泄露漏洞"
updated = "2026-06-17T00:49:49Z"

