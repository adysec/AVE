[basic]
description = "WordPress Showbiz Pro 插件存在任意文件上传漏洞，该插件在处理 ZIP 压缩包上传时未对文件类型进行有效验证，导致攻击者可构造包含恶意 PHP 文件的 ZIP 压缩包并上传至服务器。当服务器解压该压缩包后，恶意 PHP 文件将被释放到 Web 可访问目录，攻击者可直接访问该文件实现远程代码执行，从而完全控制受影响的 WordPress 站点。该漏洞影响 1.7.1 及以下所有版本，CVSS 评分 9.8，危害等级严重。攻击者无需身份认证，仅需具备文件上传功能的访问权限即可利用此漏洞，最终可能导致网站数据泄露、恶意代码植入、服务器被完全接管等严重后果。"
published = "2019-10-22T21:15:10Z"
remediation = '立即禁用并完全删除 WordPress Showbiz Pro 插件（当前最高版本 1.7.1 仍未修复该漏洞，开发商未发布补丁）。操作步骤：1）登录 WordPress 后台进入"插件"页面，停用 Showbiz Pro；2）点击"删除"移除插件文件；3）手动清理 wp-content/plugins/showbizpro/ 目录及 wp-content/uploads/ 下残留的临时上传文件（如 temp/update_extract/ 路径中的 PHP 文件）；4）检查数据库 wp_options 表中是否存在该插件相关配置并清除；5）通过 Web 应用防火墙（WAF）添加规则拦截对 wp-admin/admin-ajax.php 中 action=showbiz_ajax_action 的请求作为临时缓解措施；6）如确需类似功能，可替换为官方维护的同类轮播插件（如 MetaSlider、Smart Slider 3 等）。'
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress Showbiz Pro插件任意文件上传远程代码执行漏洞"
updated = "2026-06-17T00:36:39Z"

