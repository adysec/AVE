[basic]
description = "WordPress Calmar Webmedia Total Donations 插件（版本至 2.0.5）中的 migla_ajax_functions.php 文件存在访问控制不当漏洞。未经身份认证的远程攻击者可通过向目标站点发送特制的 HTTP 请求到 wp-admin/admin-ajax.php，调用 miglaA_update_me 操作来修改任意 WordPress 选项值，进而实现网站完全接管。该漏洞影响使用该插件的 WordPress 站点，攻击者可借此开启新用户注册并将新用户的默认角色设置为管理员，无需任何凭据即可获得站点最高权限。CVSS 评分 9.8，危害等级严重。"
published = "2019-01-27T02:29:00Z"
remediation = "立即在WordPress后台停用并删除Total Donations插件（该插件已于2025年4月24日因安全问题被官方关闭，无安全修复版本可用）。如无法立即删除，应在Web应用防火墙（WAF）或安全插件中配置规则，拦截对wp-admin/admin-ajax.php中miglaA_update_me动作的未授权外部访问，并检查wp_options表中users_can_register和default_role等关键选项是否被篡改。建议替换为其他维护活跃的捐赠管理插件，并审查站点是否存在未知管理员账户。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress Calmar Webmedia Total Donations 插件未授权访问漏洞"
updated = "2026-06-17T02:39:32Z"

