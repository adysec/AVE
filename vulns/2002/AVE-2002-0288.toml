[basic]
description = "该漏洞存在于 Netscape 6.2.3 及更早版本以及 Mozilla 1.0.1 浏览器中。漏洞原理在于浏览器在处理 GIF 图像时，未能正确校验图像宽度，导致在处理宽度为零的特制 GIF 图片时发生堆内存损坏。远程攻击者可通过诱导用户访问含有恶意 GIF 图像的网页，在无需身份验证的情况下触发此漏洞，从而在目标系统上执行任意代码。该漏洞影响早期版本的 Netscape 和 Mozilla 浏览器，危害等级较高。"
published = "2002-10-04T04:00:00Z"
remediation = "建议立即停止使用 Netscape 6.2.3 及更早版本以及 Mozilla 1.0.1 浏览器，升级至更新的安全版本或迁移至现代浏览器（如 Firefox）。对于无法立即迁移的系统，建议在网关层面拦截或过滤异常构造的 GIF 图像文件，以减轻远程代码执行风险。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Netscape/Mozilla 浏览器 GIF 图像处理远程代码执行漏洞"
updated = "2026-06-16T21:58:42Z"

