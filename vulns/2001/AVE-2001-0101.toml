[basic]
description = "SSH 1.2.27 至 1.2.30 版本的 ssh-keygen 工具在启用 Secure-RPC 功能时存在身份认证漏洞，允许本地攻击者恢复其他用户生成的 SUN-DES-1 魔术短语。攻击者利用该短语可解密目标用户的 SSH 私钥文件，进而冒充该用户进行身份认证并获得未授权访问。该漏洞影响运行受影响版本 SSH 的 Unix/Linux 系统，攻击条件要求攻击者已具备本地系统访问权限。SSH Communications Security 已发布补丁修复此问题，建议用户升级至安全版本并重新生成密钥对。"
published = "2001-06-02T00:00:00Z"
remediation = '建议立即停止使用 SSH 1.2.x 版本，将其升级至 OpenSSH 2.0 或更高版本。在配置文件中通过设置 "Protocol 2" 禁用不安全的 SSH 1.x 协议，并移除所有基于 Secure-RPC 的弱加密认证配置。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "OpenSSH ssh-keygen 弱加密身份认证漏洞"
updated = "2001-06-02T00:00:00Z"

