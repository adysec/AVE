[basic]
description = "Google Chrome 核心浏览引擎中的 WebKit 组件存在 use-after-free 类型的内存引用漏洞，该漏洞源于在处理“ruby”标签（小注标记）及嵌套“table”样式时未能正确释放已分配的内存，导致指针悬空。当攻击者构造特定的 HTML 文件并诱导受害者访问时，可利用此漏洞实现任意代码执行或导致浏览器崩溃。该漏洞影响 Chrome 14.0.835.163 及更早版本，同时也同样影响基于 WebKit 的 Safari 浏览器（版本低于 5.1.4）。攻击者无需任何权限即可远程触发，操作简单，影响广泛，成功可能导致远程代码执行或系统完全控制。此外，攻击者还可能对 WebKit 的其他组件利用类似技术破坏浏览器的安全沙盒机制。"
published = "2011-09-19T12:02:56Z"
remediation = "直接升级 Google Chrome 到 14.0.835.163 或更高版本，通过 Windows Update 自动更新或下载安装最新稳定版本。如无法立即更新，可临时禁用 Chrome 中的 Ruby 和表格样式处理功能以降低利用风险。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome  内存错误引用漏洞"
updated = "2026-06-16T23:32:07Z"

