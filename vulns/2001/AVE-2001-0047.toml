[basic]
description = "splitvt 终端分屏工具在 1.6.5 及更早版本中存在多个缓冲区溢出漏洞，未经充分身份验证的本地攻击者可通过构造特制的终端输入数据触发溢出，从而在系统上执行任意命令。该漏洞影响运行受影响版本 splitvt 的 Linux 及类 Unix 系统，CVSS 评分 7.2，危害等级高。攻击者需具备本地访问权限，但无需复杂操作即可利用该漏洞获取系统控制权。"
published = "2001-03-12T05:00:00.000"
remediation = "立即将 splitvt 升级到 1.6.5 或更高版本，该版本已修复多处缓冲区溢出漏洞。可通过源码编译安装（从官方站点获取 splitvt-1.6.5.tar.gz 后执行 ./configure && make && make install），或使用系统包管理器（如 Debian/Ubuntu 执行 apt-get install --only-upgrade splitvt）进行升级。如短期内无法完成升级，建议临时限制对 splitvt 的访问权限（chmod 750 /usr/bin/splitvt），仅允许可信用户执行该程序，以降低本地用户利用缓冲区溢出执行任意命令的风险。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "splitvt 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:53:40.693"

