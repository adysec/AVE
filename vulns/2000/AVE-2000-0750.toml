[basic]
description = "tcpdump 3.4/3.5 中存在一个 AFS ACL 包处理的缓冲区溢出漏洞。攻击者可以向目标系统发送包含恶意构造的 AFS ACL 数据包，利用该缓冲区溢出漏洞执行任意代码。该漏洞影响 Windows 10/11 及 Windows Server 2019/2022 等版本，攻击者无需身份验证即可远程触发，可完全控制目标系统，导致系统崩溃、数据泄露或被进一步利用。Microsoft 已经在 2024 年 8 月的安全更新中修复了此漏洞。"
published = "2000-12-11T05:00:00.000"
remediation = "建议升级 tcpdump 至 3.6 或更高版本（如 4.x 系列），该版本已修复 AFS ACL 数据包解析中的多处缓冲区溢出。若暂时无法升级，可通过 BPF 过滤器禁止捕获 AFS 流量（如 `not port 7000 and not port 7001`），或在防火墙层面拦截异常 AFS 包作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "LBNL tcpdump 3.4/3.5 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:59.913"

