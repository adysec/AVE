[basic]
description = "Apache HTTP Server 的 mod_alias 和 mod_rewrite 模块中存在栈缓冲区溢出漏洞。Apache 1.3.29 之前的版本在处理配置文件中的正则表达式时，若捕获组数量超过 9 个，会导致栈上缓冲区溢出。由于 Apache 在解析 .htaccess 等配置文件时会在子进程中运行，本地攻击者可通过构造包含多捕获组正则表达式的配置文件，触发服务崩溃（拒绝服务）甚至执行任意代码。该漏洞影响 Apache 1.3.x 系列早期版本，CVSS 评分 7.2，危害等级高。Apache 1.3.29 版本已修复此问题，限制了正则表达式捕获组数量并修复了缓冲区溢出。"
published = "2003-11-03T05:00:00Z"
remediation = "升级 Apache HTTP Server 至当前受支持的稳定版本（如 2.4.x 系列），该漏洞在 1.3.29 和 2.0.48 中已修复。具体操作：通过系统包管理器（yum/apt）或从官网下载源码重新编译安装最新版本；配置层面将 httpd.conf 中的 AllowOverride 设为 None 以阻止 .htaccess 覆盖，并移除不必要的 mod_alias 与 mod_rewrite 模块；若暂时无法升级，应在 RewriteRule 正则表达式中限制捕获组数量不超过 9 个，并严格限制配置文件写入权限，仅允许 root 用户修改配置。重启 Apache 服务使更改生效。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "Apache mod_alias 与 mod_rewrite 缓冲区溢出漏洞"
updated = "2026-06-16T22:02:23Z"

