[basic]
description = 'Galacticomm Worldgroup FTP服务器3.20及更早版本存在缓冲区溢出漏洞。攻击者可远程发送包含大量"/"、"*"及".."字符的LIST命令，触发缓冲区溢出，导致服务崩溃（拒绝服务）并可能执行任意代码。该漏洞评估分值7.5， CVSS向量为AV:N/AC:L/Au:N/C:P/I:P/A:P，影响范围广泛，攻击者无需身份验证即可利用此漏洞。'
published = "2002-06-25T04:00:00Z"
remediation = "升级到 Galacticomm Worldgroup 3.20 及以上版本，应用安全补丁修复 FTP 服务器缓冲区溢出漏洞。修改 FTP 服务配置，限制 LIST 命令最大长度，开启用户认证并限制访问IP。同时关闭防火墙端口21，以HTTP或SFTP代替FTP服务。若无法立即升级，建议停用FTP服务或使用强访问控制和暴力破解防护措施作为临时缓解方案。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "银河通信 Worldgroup 3.20 远程FTP缓冲区溢出漏洞"
updated = "2026-06-16T21:57:14Z"

