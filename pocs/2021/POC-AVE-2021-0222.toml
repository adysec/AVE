[info]
author = "ave"
description = "检测 Google Chrome V8 引擎 Array Transfer 堆缓冲区溢出漏洞（CVE-2021-21148），通过构造包含恶意 Array Transfer 操作的 JavaScript 代码页面，诱使目标浏览器触发堆内存损坏。该漏洞影响 Chrome 88.0.4324.150 之前版本，CVSS 评分 8.8，CISA 已确认野外活跃利用"
id = "POC-AVE-2021-0222"
name = "CVE-2021-21148 Chrome V8 Array Transfer Heap Overflow PoC"
severity = "high"
tags = ["ave-2021-0222"]
vuln_id = [
    "CVE-2021-21148",
    "AVE-2021-0222",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cve-2021-21148-poc.html"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["VULNERABLE"]
