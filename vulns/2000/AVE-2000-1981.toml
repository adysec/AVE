[basic]
description = "Mandrake Linux 7.1 及更早版本（以及其他可能受影响的 Linux 发行版）中 ypserv 服务存在缓冲区溢出漏洞。当 ypserv 在编译时未启用 vsyslog() 函数时，远程攻击者无需身份认证即可通过网络向目标系统发送特制数据包触发该漏洞，成功利用可获取目标系统的 root 最高权限，完全控制受影响主机。该漏洞 CVSS 评分 10.0，危害等级严重。"
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 ypserv 至修复版本（Mandrake Linux 7.1 用户安装 MDKSA-2000:064 安全更新），或重新编译 ypserv 时确保链接 vsyslog() 函数。如无需 NIS 服务，执行 service ypserv stop && chkconfig ypserv off 禁用 ypserv 以彻底消除风险。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Mandrake Linux ypserv 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:02.053"

