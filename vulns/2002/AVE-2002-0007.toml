[basic]
description = "OpenSSH 2.3.1 至 3.3 版本的 sshd 组件在处理挑战-响应认证时存在缓冲区溢出漏洞。当 OpenBSD 系统使用 PAM 模块并启用交互式键盘认证（PAMAuthenticationViaKbdInt）时，远程攻击者无需身份认证即可通过发送大量认证响应数据触发栈缓冲区溢出，导致任意代码执行。该漏洞 CVSS 评分 10.0，危害等级严重，攻击复杂度低，影响范围广泛。受影响的 OpenSSH 版本需升级至 3.3 以上版本修复。"
published = "2002-07-03T04:00:00Z"
remediation = "升级 OpenSSH 至 3.4 或更高版本，该版本修复了 sshd 在 PAM 交互式键盘认证（PAMAuthenticationViaKbdInt）中的挑战响应缓冲区溢出漏洞。如无法立即升级，可在 sshd_config 中禁用 ChallengeResponseAuthentication 或 PAMAuthenticationViaKbdInt 作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "OpenSSH sshd 挑战响应认证缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:57:50Z"

