[basic]
description = "Windows Installer 存在特权提升漏洞，该漏洞源于安装程序在处理安装操作时未正确验证符号链接路径，导致可被利用进行链接跟随攻击。本地低权限攻击者可通过诱导高权限用户运行特制的恶意安装程序，利用符号链接重定向文件操作，从而以 SYSTEM 权限读取、写入或删除受保护的系统文件，实现权限提升。该漏洞影响所有受支持的 Windows 10/11 及 Windows Server 版本，CVSS 评分 7.3，危害等级高危。Microsoft 已在 2025 年 1 月安全更新（KB5050061）中修复此漏洞。"
published = "2025-01-14T18:15:58.120"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新（对应 KB5050061），通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。受影响版本包括 Windows 10/11 及 Windows Server 各版本，升级后系统版本号应达到：Win10 1507≥10.0.10240.20890、Win10 1809≥10.0.17763.6775、Win11 22H2≥10.0.22621.4751、Win Server 2022≥10.0.20348.3091 等。如无法立即打补丁，可限制非管理员用户对 Windows Installer 的调用权限，并启用 AppLocker 或 WDAC 策略阻止未签名 MSI 文件的执行作为临时缓解措施。"
score = 7.3
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Installer 特权提升漏洞"
updated = "2026-06-17T08:43:07.263"

