[basic]
description = "UUCP（Unix-to-Unix Copy）工具集在处理文件创建及重定向操作时存在符号链接（symlink）跟随竞态条件漏洞。由于 UUCP 的相关命令在写文件前未对目标路径进行正确校验，攻击者可通过在目标目录中预先放置符号链接等手段，诱导 UUCP 以运行权限覆盖或创建任意文件，进而实现文件篡改、提权或底层攻击。该漏洞主要影响 Apple MacOS X 10、HP-UX 9/10/11、Mandriva 6/7、RedHat 5/6、SCO 5、IRIX 6 等众多 Unix 系操作系统。攻击条件为攻击者具备本地账户并能够控制文件系统的特定目录，利用方式通常是在目标目录创建指向敏感文件的符号链接，再触发 UUCP 的文件创建/覆盖操作，从而实现对任意文件的写入或损坏，属于本地权限提升类安全风险。"
published = "2001-01-09T00:00:00Z"
remediation = "建议立即将 UUCP 升级到 1.07 或更高版本（如 tar.gz 补丁 1.07.8），该版本修复了通过 symlink 创建/覆盖任意文件及 shell 重定向的竞赛条件漏洞。如无法升级，可在受影响系统上为 uucp 目录设置严格权限，限制 uucp 用户对用户可写目录的符号链接跟踪，并禁止攻击者控制的进程以 root 权限调用重定向。对于 HP-UX、RedHat、SCO、IRIX 等受影响系统的相关临时目录，使用 sticky bit 并收紧 /dev 及 spool 目录的写权限，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "UUCP 涉及多个 Unix 平台 shell 重定向符号链接竞态导致文件创建或覆盖漏洞"
updated = "2001-01-09T00:00:00Z"

