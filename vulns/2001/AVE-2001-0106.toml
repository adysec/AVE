[basic]
description = "tags.<value>PGP 5.x/6.x/7.0 及更早版本的 ASCII Armor 解析器在处理恶意构造的 ASCII armored 加密文件时存在路径遍历漏洞。攻击者可通过发送特制的 ASCII armored 文件，利用解析器缺乏路径校验的缺陷，在目标系统的任意位置创建或覆盖文件。该漏洞影响 Windows 平台上的 PGP 软件，攻击者无需身份认证即可在本地触发，仅需较低的交互复杂度即可完成利用，可导致文件系统完整性受损。攻击者可通过替换关键系统文件或创建启动项实现权限提升或持久化访问。"
published = "2001-06-18T04:00:00Z"
remediation = "立即将 PGP 升级至 7.0.4 或更高版本，以修复 ASCII Armor 解析器任意文件创建漏洞。如短期内无法升级，应避免打开来历不明的 ASCII armored 签名文件或公钥文件，并在邮件网关中过滤可疑的 armored 附件。PGP Corporation 已发布 7.0.4 版本补丁，用户可通过 PGP 官方支持站点获取更新安装程序，或使用 PGP 自动更新功能完成修复。"
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "PGP 5.x/6.x/7.0 ASCII Armor 解析器任意文件创建漏洞"
updated = "2026-06-16T21:53:59Z"

