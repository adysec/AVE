[basic]
description = "Fortinet FortiOS 及 FortiProxy 的 SSL VPN 门户存在路径遍历漏洞（CWE-22），未经身份认证的远程攻击者可通过向 `/remote/fgt_lang?lang=/../../../..//dev/cmdb/sslvpn_websession` 等特制 HTTP 资源请求，绕过路径限制访问系统任意文件，导致敏感信息泄露（如 VPN 会话 Cookie、用户凭据等）。该漏洞影响 FortiOS 6.0.0 至 6.0.4、5.6.3 至 5.6.7、5.4.6 至 5.4.12 及 FortiProxy 多个版本，CVSS 评分 9.1，危害严重。攻击无需认证，仅需目标开放 SSL VPN 服务（默认 443 端口）即可利用。该漏洞已被纳入 CISA KEV 目录，存在大量在野利用案例，Metasploit 等工具已集成自动化利用模块。"
published = "2019-06-04T21:29:00.233"
remediation = '升级 FortiOS 至 6.0.5 及以上、5.6.8 及以上或 5.4.13 及以上版本；FortiProxy 升级至 2.0.1 及以上版本。如无法立即升级，可在 SSL VPN 门户中禁用"通过 HTTP 下载书签"功能，或在防火墙上限制对 SSL VPN 端口的访问来源 IP。'
score = 9.1
severity = "CRITICAL"
sources = ["kev"]
title = "Fortinet FortiOS SSL VPN 路径遍历漏洞"
updated = "2026-06-17T01:39:18.123"

