[basic]
description = "Apache Struts2 REST Plugin 使用 XStreamHandler 进行 XML 反序列化时未对数据类型进行任何过滤，攻击者可通过构造特制的 XML 请求包发送到目标服务器，触发反序列化远程代码执行漏洞。该漏洞影响 Struts2 2.1.1 至 2.3.33 及 2.5 至 2.5.12 版本，无需身份认证即可远程利用，CVSS 评分 8.1，危害等级高。建议升级至 2.3.34 或 2.5.13 及以上版本修复。"
published = "2017-09-15T19:29:00.237"
remediation = "升级 Apache Struts2 至 2.3.34（2.3.x 分支）或 2.5.13（2.5.x 分支）及以上版本，禁用 REST Plugin 中 XStreamHandler 的反序列化功能。如无法立即升级，可在 Web 应用防火墙（WAF）层面拦截包含恶意 XML 载荷的 REST 请求作为临时缓解措施。"
score = 8.1
severity = "HIGH"
sources = ["kev"]
title = "Apache Struts2 REST Plugin 反序列化远程代码执行漏洞"
updated = "2026-06-17T01:28:57.493"

