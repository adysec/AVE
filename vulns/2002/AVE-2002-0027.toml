[basic]
description = 'Apache HTTP Server 1.3.26 及之前版本、2.0.42 及之前版本存在跨站脚本（XSS）漏洞。当服务器配置 UseCanonicalName 为 "Off" 且支持通配符 DNS 解析时，远程攻击者可通过在 HTTP 请求的 Host 头中注入恶意脚本代码，该脚本会在默认错误页面中被反射执行，导致受害者在浏览器上下文中执行任意脚本，窃取 Cookie 或伪造页面内容。攻击者无需身份认证，仅需诱使用户访问特制链接即可触发。'
published = "2002-10-11T04:00:00Z"
remediation = '升级 Apache HTTP Server 至 2.0.43 及以上版本，或 1.3.27 及以上版本。如无法立即升级，将 UseCanonicalName 指令设为 "On" 以禁用通配符 DNS 支持，并在反向代理或 WAF 层过滤 Host 头中的恶意脚本内容作为临时缓解措施。'
score = 6.8
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Apache HTTP Server 错误页面跨站脚本漏洞"
updated = "2026-06-16T21:58:14Z"

