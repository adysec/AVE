[basic]
description = "AnyPortal(php) 的 siteman.php3 脚本存在未明确指定的信息泄露漏洞，未经身份认证的远程攻击者可通过未知攻击向量向目标系统发送特制请求，触发路径泄露，导致服务器绝对路径被暴露。该漏洞影响 2000 年 4 月 22 日之前发布的 AnyPortal(php) 版本，攻击者无需凭据即可在网络上发起利用，利用路径信息可进一步针对服务器文件系统实施定向攻击，如读取敏感文件、构造进一步利用载荷等。CVSS 评分为 5.0，危害等级中等。"
published = "2000-12-31T05:00:00Z"
remediation = "建议立即升级 AnyPortal PHP 至 2000 年 4 月 22 日之后的版本，或彻底移除 siteman.php3 文件。若无法升级，请在 Web 服务器配置中关闭详细错误信息显示（如 PHP display_errors=Off），并在应用层实现统一错误处理避免泄露绝对路径。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "AnyPortal PHP 信息泄露漏洞"
updated = "2026-06-16T21:53:26Z"

