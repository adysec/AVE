[basic]
description = "tags.<value>Linux 内核 SCTP 协议栈的 sysctl udp_port 处理函数存在空指针解引用漏洞。该函数通过 current->nsproxy 指针获取网络命名空间结构，但在当前任务退出等特定场景下（如 syzbot 利用 acct(2) 系统调用所发现的），该指针可能为 NULL，导致内核发生空指针解引用（Oops）并触发系统崩溃，造成拒绝服务攻击。受影响版本包括所有采用该脆弱代码路径的 Linux 内核发行版。攻击者需要在目标系统上拥有低权限本地访问权限，无需任何用户交互即可在触发条件满足时利用此漏洞，直接影响系统可用性并可能损害数据完整性。开发者已通过将 net 结构体获取方式从 current->nsproxy 改为从 table->data 使用 container_of() 来修复该问题。"
published = "2025-01-19T11:15:09Z"
remediation = "立即升级 Linux 内核至修复版本：Debian 12 (bookworm) 升级至 6.1.128-1 或更高，Ubuntu 22.04 LTS 升级至 5.15.0-1077.83 或更高。执行 `apt update && apt install linux-image-$(uname -r)` 后重启系统使新内核生效。如暂无法升级，可通过限制本地低权限用户对 SCTP sysctl 接口的访问权限作为临时缓解措施。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux kernel SCTP sysctl udp_port 空指针解引用漏洞"
updated = "2026-07-30T06:16:41Z"

