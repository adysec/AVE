[basic]
description = "LibTIFF 3.9.4及更早版本中的ThunderScan解码器（tif_thunder.c）存在基于堆的缓冲区溢出漏洞。当处理包含异常BitsPerSample值的THUNDER_2BITDELTAS数据的特制.tiff文件时，解码器未正确验证输入数据长度，导致堆缓冲区溢出。远程攻击者可向目标用户发送恶意构造的TIFF图像文件，诱使用户使用受影响版本的LibTIFF库解析该文件，从而触发缓冲区溢出，最终实现任意代码执行。该漏洞影响广泛使用LibTIFF库的Linux发行版及各类图像处理应用，CVSS评分6.8，危害等级中等。"
published = "2011-03-28T16:55:04Z"
remediation = "升级 LibTIFF 至 4.0.0 或更高版本。各 Linux 发行版用户可通过包管理器更新：Red Hat/CentOS 运行 `yum update libtiff`，Debian/Ubuntu 运行 `apt-get update && apt-get upgrade libtiff`，Fedora 运行 `yum update libtiff`。Apple iOS 用户升级至 iOS 6.0 或更高版本。如无法立即升级，可禁用 TIFF 图像的 ThunderCode 解码支持作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "LibTIFF ThunderCode解码器堆缓冲区溢出漏洞"
updated = "2026-06-16T23:28:51Z"

