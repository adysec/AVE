[basic]
description = "Cisco Secure ACS Server 2.4(2) 及早期版本存在缓冲区溢出漏洞，由于对 TACACS+ 数据包长度缺乏边界检查，远程未授权攻击者可发送超长 TACACS+ 数据包触发栈溢出，导致拒绝服务甚至执行任意代码。该漏洞影响 CiscoSecure ACS 所有 2.4(2) 及更早版本，CVSS 10.0 严重级别，攻击向量为网络、低复杂度、无需认证，且机密性、完整性、可用性均受完全影响。攻击者只需向监听 TACACS+ 端口（默认 49/tcp）发送畸形大包即可利用，无需用户交互。Cisco 已发布补丁修复，建议升级至 2.4(3) 或更高版本。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级 Cisco Secure ACS Server 到 2.6 或更高版本（思科已发布修复补丁）；若无法立即升级，在网络边界防火墙层面阻断非信任源对 TACACS+ 端口（TCP/49）的访问，或在 ACS 服务器上配置 TACACS+ 访问控制列表仅允许受信网络设备连接。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Cisco ACS Server 缓冲区溢出远程代码执行和拒绝服务漏洞"
updated = "2026-06-16T21:53:03Z"

