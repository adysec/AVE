[basic]
description = "Veritas Backup Exec 在 21.2 之前的版本中，客户端与 Agent 之间的通信通常通过 TLS 完成身份认证，但由于 SHA 认证方案存在设计缺陷，攻击者能够绕过身份验证机制完成未授权认证。成功认证后，攻击者可在建立的连接上执行数据管理协议命令，进而利用系统权限在目标主机上执行任意命令。该漏洞影响 Backup Exec 16.x、20.x 及 21.1 版本，所有平台上的 Agent 均受影响，CVSS 评分 8.8，危害等级高。Veritas 已在 21.2 版本中修复此问题，建议用户尽快升级至安全版本。"
published = "2021-03-01T22:15:14Z"
remediation = '立即升级 Veritas Backup Exec 至 21.2 或更高版本以彻底消除 SHA 认证绕过漏洞。若无法立即升级，可采取临时缓解措施：以管理员身份在注册表路径 Software\Veritas\Backup Exec For Windows\Backup Exec\Engine\Agents\XBSA\Machine\ 下检查是否存在 DBAID 字符串值；若不存在，请创建类型为 REG_SZ 的 DBAID 值并赋值为随机十六进制字符串（如"UIBj_?@BNo8hjR;1RW>3L1h\onZ^acSJC`7^he<2S;l"），以禁用 SHA 认证方案，阻止攻击者利用该漏洞通过数据管理协议命令在系统上以系统权限执行任意命令。CISA 已将此漏洞列入已知被利用漏洞目录，建议最迟于 2023 年 4 月 28 日前完成补丁应用。'
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Veritas Backup Exec 认证绕过远程代码执行漏洞"
updated = "2026-06-17T03:45:33Z"

