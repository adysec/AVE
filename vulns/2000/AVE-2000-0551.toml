[basic]
description = "HP-UX 11.0 系统中的 net.init RC 脚本（S008net.init）存在符号链接攻击漏洞。该脚本以 root 权限运行时会在 /tmp 目录下创建 stcp.conf 临时文件，且未对文件路径进行安全校验。本地攻击者可通过预先创建指向任意系统文件的符号链接 /tmp/stcp.conf，诱导脚本写入操作覆盖目标文件内容，从而实现权限提升或破坏系统关键配置。攻击者需要拥有本地系统访问权限，无需身份认证即可利用此漏洞，CVSS 评分 7.2，危害等级高。"
published = "2000-10-20T04:00:00Z"
remediation = "建议立即升级 HP-UX 系统至 11.11（11i）或更高版本，该版本已修复 net.init 脚本中不安全的临时文件创建问题。如无法升级，可手动修改 /sbin/init.d/net.init 脚本，将创建 /tmp/stcp.conf 的方式改为使用 mktemp 命令生成随机临时文件名，避免使用固定路径。同时限制本地非授权用户对 /tmp 目录的写入权限，或移除 S008net.init 脚本的 setuid 位以降低提权风险。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "HP HP-UX 11.00 net.init RC 脚本符号链接攻击漏洞"
updated = "2026-06-16T21:52:18Z"

