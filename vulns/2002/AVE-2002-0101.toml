[basic]
description = "Netris 游戏服务在处理 -w（等待）选项时存在缓冲区溢出漏洞，远程攻击者可通过向目标系统端口 9284 发送超长字符串触发内存损坏，导致服务崩溃并造成拒绝服务。该漏洞影响 Netris 0.3、0.4、0.5 及之前版本，无需身份认证即可远程利用，危害等级中等。"
published = "2003-08-27T04:00:00.000"
remediation = "立即将 netris 升级至 0.52 或更高版本，该版本已修复缓冲区溢出漏洞。如无法立即升级，可临时禁用 netris 的 -w（wait）选项或通过防火墙阻断外部对 9284 端口的访问作为缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Netris Netris 远程拒绝服务漏洞"
updated = "2026-06-16T21:59:33.947"

