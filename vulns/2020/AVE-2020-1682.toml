[basic]
description = "Grandstream UCM6200 系列统一通信管理平台的 HTTP 接口存在未授权远程 SQL 注入漏洞。攻击者可通过发送特制的 HTTP 请求在无需身份认证的情况下向目标系统注入恶意 SQL 语句，进而在版本低于 1.0.19.20 的设备上以 root 权限执行任意系统命令，或在版本低于 1.0.20.17 的设备上向密码恢复邮件中注入恶意 HTML 内容。该漏洞影响 UCM6200、UCM6202 等多款型号，CVSS 评分 9.8，危害等级严重。攻击者无需任何凭据即可远程利用，且 ExploitDB 及 Metasploit 均已公开可用利用代码，CISA 已将其列入已知被利用漏洞目录。"
published = "2020-03-23T20:15:12Z"
remediation = "标签之间。<value>立即将 Grandstream UCM6200 系列设备固件升级至 1.0.20.17 或更高版本，以修复未授权远程 SQL 注入漏洞。若暂无法立即升级，应在边界防火墙或 WAF 中限制对设备 HTTP 管理接口的外部访问，仅允许受信任的 IP 段访问，并关闭无需的远程管理功能作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Grandstream UCM6200 系列未授权远程代码执行漏洞"
updated = "2026-06-17T03:22:06Z"

