[basic]
description = 'Mac OS 9 的"多用户"控制面板存在权限提升漏洞，普通用户可通过删除 Users & Groups Data File 来绕过 Owner 密码验证，从而无需密码即可以 Owner 账户身份登录系统，获得完全的管理员权限。该漏洞攻击复杂度低，无需身份认证即可利用，影响 Mac OS 9 系统，CVSS 评分 7.2，危害等级高。'
published = "2001-02-12T05:00:00Z"
remediation = "Mac OS 9 已停止安全支持，无官方补丁。建议升级至受支持的 macOS 版本（如 macOS Sonoma）。如无法升级，可将 Users & Groups Data File 权限改为仅系统管理员可读写（chmod 600），并限制普通用户对系统目录的写入权限作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Apple Mac OS 9 权限提升漏洞"
updated = "2026-06-16T21:53:39Z"

