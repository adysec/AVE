[basic]
description = "thttpd Web 服务器在处理请求时存在目录遍历漏洞。由于程序未能对用户请求的 URL 路径进行严格的过滤和校验，远程攻击者可以通过在请求路径中使用 `../` 等相对路径符号，绕过预设的根目录限制，直接读取服务器上任何具有读取权限的敏感系统文件（如 /etc/passwd）。该漏洞影响 thttpd 早期版本，攻击者无需任何身份验证即可在网络环境下触发，导致严重的机密信息泄露。"
published = "2000-12-19"
remediation = '建议停止使用已停止维护的 thttpd 服务器，并迁移至 Nginx 或 Apache 等现代 Web 服务器。若必须维持运行，可通过在前端部署 WAF 或反向代理，配置过滤规则拦截所有包含 "../" 或 "..%2f" 等路径遍历关键字的 HTTP 请求以缓解风险。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "thttpd Web 服务器目录遍历任意文件读取漏洞"
updated = "2000-12-19"

