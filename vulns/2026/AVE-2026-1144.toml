[basic]
description = "Windows Win32K 组件存在不正确的访问控制漏洞。已通过身份验证的本地低权限攻击者可通过特制操作触发该缺陷，以高复杂度利用方式在无需用户交互的情况下提升系统权限。成功利用后，攻击者可获取受保护系统资源的完全访问权限，导致机密性、完整性和可用性均面临高风险。该漏洞影响受支持的 Windows 操作系统版本，CVSS v3.1 评分 7.0，Microsoft 已在 2026 年 7 月安全更新中发布修复补丁。"
published = "2026-07-14T17:16:56Z"
remediation = "建议立即安装 Microsoft 2026 年 7 月安全更新。受影响系统需升级至以下安全版本：Windows 10 Version 1607 升级至 10.0.14393.9339、Version 1809 升级至 10.0.17763.9020、Version 21H2 升级至 10.0.19044.7548、Version 22H2 升级至 10.0.19045.7548；Windows 11 24H2/25H2/26H1 分别升级至 10.0.26100.8875、10.0.26200.8875、10.0.28000.2525；Windows Server 2012/2012 R2 分别升级至 6.2.9200.26226、6.3.9600.23291，Server 2016/2019/2022/2025 分别升级至 10.0.14393.9339、10.0.17763.9020、10.0.20348.5386、10.0.26100.33158。可通过 Windows Update 或微软更新目录手动安装对应累积更新。如暂时无法打补丁，可采取临时缓解措施：通过本地安全策略限制低权限账户登录交互会话，并启用 AppLocker 或 WDAC 应用控制策略阻止未签名可执行文件运行，以降低本地提权风险。详情参见 https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-49805。"
score = 7
severity = "HIGH"
sources = ["zdi"]
title = "Microsoft Windows Win32K 权限提升漏洞"
updated = "2026-07-22T16:17:34Z"

