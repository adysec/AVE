[basic]
description = "WatchGuard SOHO 防火墙内置 HTTP 服务器未对管理功能（如密码重置、设备重启）进行充分的访问控制与身份验证，未经身份认证的远程攻击者可直接通过 HTTP 请求调用这些管理接口，从而造成防火墙拒绝服务或执行未授权操作。该漏洞影响运行 SOHO 系列固件的 WatchGuard 防火墙设备，攻击者无需任何凭据即可利用，攻击条件简单，攻击向量为网络可达。由于该漏洞的 CVSS 评分为满分 10.0，属于最高严重等级，可被利用导致完全的系统可用性丧失与管理权限的非法获取，危害极大。WatchGuard 已发布固件更新以修复该漏洞，建议用户升级至安全版本并限制防火墙管理接口的网络访问范围。"
published = "2001-02-12T05:00:00.000"
remediation = "升级到 WatchGuard SOHO 防火墙最新固件版本，启用管理员访问控制限制远程管理端口，仅允许受信任 IP 地址访问管理界面，并关闭不必要的 HTTP 管理服务以降低攻击面。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "WatchGuard SOHO 防火墙拒绝服务漏洞"
updated = "2026-06-16T21:52:41.627"

