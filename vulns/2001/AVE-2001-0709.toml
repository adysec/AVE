[basic]
description = "Olivier Debon Flash 插件（非 Macromedia 官方插件）中存在缓冲区溢出漏洞，远程攻击者可通过向目标用户发送包含超长 DefineSound 标签的特制 SWF 文件触发该漏洞，导致插件崩溃（拒绝服务），并可能利用溢出实现任意代码执行。攻击者需要诱导用户访问恶意网页或打开恶意文件，攻击复杂度较高，但成功利用后可完全控制受影响系统。"
published = "2001-03-12T05:00:00.000"
remediation = "立即卸载 Olivier Debon Flash 插件，该插件已停止维护且无安全更新。改用官方 Adobe Flash Player（已于 2020 年底停止支持），或直接移除所有 Flash 依赖，迁移至 HTML5 标准。在浏览器中禁用 Flash 插件加载，并在 Web 服务器配置中拦截 .swf 文件请求作为临时缓解措施。"
score = 7.6
severity = "HIGH"
sources = ["cve"]
title = "Olivier Debon Flash 插件 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:42.427"

