[info]
author = "AVE"
description = "检测 wcurl 是否安装且版本是否在受影响范围内（curl 8.14.0-8.17.0 或 wcurl 2024.12.08-2025.11.04），以及验证百分号编码斜杠是否导致文件保存到当前目录之外"
id = "POC-AVE-2025-0477"
name = "CVE-2025-11563 wcurl Path Traversal PoC"
severity = "medium"
tags = [
    "cve-2025-11563",
    "wcurl",
    "path-traversal",
]
vuln_id = [
    "CVE-2025-11563",
    "AVE-2025-0477",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/usr/bin/wcurl"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["wcurl"]
