[basic]
description = "Novell NetWare 5.0 的 SMDR.NLM 服务在处理 UDP 40193 端口的入站数据时存在缺陷，未对输入数据进行有效性校验。远程攻击者无需身份认证即可向目标端口发送大量随机数据，导致服务崩溃或拒绝响应，从而使 NetWare 文件与打印服务不可用。该漏洞攻击条件简单、影响范围限于服务器可用性，CVSS 评分为 5.0，属于中等危害等级。"
published = "2000-07-11T04:00:00Z"
remediation = "该漏洞影响已停止支持的 Novell NetWare 5.0/6.0，厂商不再提供安全补丁。建议立即升级到受支持的服务器操作系统（如 SUSE Linux Enterprise Server）。临时缓解措施：在防火墙上阻止外部对 UDP/TCP 40193 端口的访问，并在 NetWare 服务器上禁用 IPX 兼容模式（通过 MONITOR.NLM 或 INETCFG.NLM 关闭 IPX 协议绑定）。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Novell NetWare 5.0 SMDR.NLM 拒绝服务漏洞"
updated = "2026-06-16T21:52:13Z"

