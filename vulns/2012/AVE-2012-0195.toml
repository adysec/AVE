[basic]
description = "Oracle MySQL Server 5.5.23 及之前版本中的 InnoDB 存储引擎存在未指定的安全漏洞，已认证的远程攻击者可通过向 MySQL 服务器发送特制的数据库查询请求，利用 InnoDB 组件中的未知错误触发拒绝服务条件，导致 MySQL 服务进程崩溃或无法响应正常请求。该漏洞影响 MySQL 5.5.x 全系版本，攻击者需拥有数据库有效登录凭据方可利用，CVSS 评分 4.0，危害等级中低。Oracle 已在 2012 年 7 月的关键补丁更新（CPU）中发布 MySQL 5.5.24 修复此问题。"
published = "2012-07-17T23:55:02Z"
remediation = "升级 MySQL Server 至 5.5.24 或更高版本。可通过 Oracle 官方 July 2012 Critical Patch Update (My Oracle Support Note 1446033.1) 获取补丁，或从 MySQL 官网下载 5.5.24 及以上版本进行升级。如无法立即升级，可在 my.cnf 中限制 InnoDB 相关参数并严格控制数据库用户权限，仅授予必要的最小权限，降低认证用户利用 InnoDB 组件发动拒绝服务攻击的风险。"
score = 4
severity = "MEDIUM"
sources = ["tenable"]
title = "Oracle MySQL Server InnoDB 拒绝服务漏洞"
updated = "2026-06-16T23:40:14Z"

