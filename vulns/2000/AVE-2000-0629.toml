[basic]
description = "MIT Kerberos 4 KDC 程序中的 set_tgtkey 函数存在缓冲区溢出漏洞，由于对 lastrealm 变量缺乏正确的边界检查，远程攻击者可通过向 Kerberos 密钥分发中心发送特制的认证请求触发缓冲区溢出，导致 KDC 服务崩溃，造成拒绝服务。该漏洞影响 MIT Kerberos 4.0 及 Kerberos 5 1.0/1.1/1.1.1 版本，攻击无需认证即可远程触发，危害中等。"
published = "2000-06-09T04:00:00Z"
remediation = "立即升级 MIT Kerberos 至 1.2.x 或更高版本（该漏洞在 1.2 系列中已修复）。如无法立即升级，可应用 MIT 官方提供的针对 krb5-1.0.x 或 krb5-1.1.1 的补丁（见 http://web.mit.edu/kerberos/www/advisories/krb4kdc.txt），或在 KDC 配置中禁用 Kerberos 4 兼容模式以消除攻击面。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "MIT Kerberos KDC set_tgtkey 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:51:58Z"

