[basic]
description = "Citrix NFuse 1.6 版本的 applist.asp 页面存在访问控制缺陷，未进行身份验证即允许远程匿名访问。未经身份认证的远程攻击者可直接访问该页面，枚举并获取已发布应用程序的列表信息，导致敏感应用信息泄露。该漏洞影响 Citrix NFuse 1.6 版本，CVSS 评分 5.0（中等危害），攻击向量为网络，攻击复杂度低，无需认证，仅影响机密性。攻击者无需认证即可通过直接访问 applist.asp 页面获取应用列表信息。Citrix 已发布补丁修复此漏洞，建议升级至修复版本。"
published = "2002-08-12T04:00:00Z"
remediation = "建议升级至 Citrix NFuse 1.6 Hotfix 2 (Build 1560) 或更高版本，该补丁修复了 applist.asp 未授权访问漏洞。若无法立即升级，可在 IIS 中为 applist.asp 配置 NTFS 权限仅允许已认证用户访问，或在 IIS URL 授权规则中拒绝匿名访问 /nfuse/applist.asp 路径，同时在防火墙层面限制外部直接访问 NFuse 发布站点的管理页面路径。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Citrix NFuse 1.6 信息泄露漏洞"
updated = "2026-06-16T21:57:34Z"

