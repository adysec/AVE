[basic]
description = "标签包裹。<value>DG/UX 操作系统的 lpsched 打印调度程序存在缓冲区溢出漏洞，该漏洞存在于 R4.20MU06 和 MU02 版本中。攻击者可通过向 lpsched 传递过长的命令行参数（如不存在的打印机名称）触发缓冲区溢出，从而在本地提升权限至 root。该漏洞利用条件要求攻击者已具备本地访问权限，攻击复杂度低且无需额外身份认证，可完全破坏系统的机密性、完整性和可用性。CVSS 评分为 7.2，危害等级较高。成功利用该漏洞后，本地攻击者可直接获取系统最高权限，对系统安全造成严重威胁。"
published = "2001-06-27T04:00:00Z"
remediation = "tags as requested.<value>建议升级至 DG/UX R4.20MU07 或更高版本以修复 lpsched 缓冲区溢出漏洞。如暂无法升级，应通过 chmod 限制 lpsched 可执行权限，仅允许 lp 用户运行该程序，并配置 sudoers 规则拒绝普通用户直接调用 lpsched。同时删除不必要的打印机队列，限制本地用户对打印服务的访问，以降低漏洞被利用的风险。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "DG/UX lpsched 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:54:10Z"

