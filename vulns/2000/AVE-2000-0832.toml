[basic]
description = 'YaBB SE 1.5.1 的 search.pl CGI 脚本存在目录遍历漏洞，远程攻击者通过在 "catsearch" 表单字段中提交 `..`（点点）攻击序列，可绕过路径限制读取服务器上的任意文件。此外，该版本 News.php 文件还存在 SQL 注入漏洞，攻击者可利用注入获取敏感数据库信息。该漏洞影响 YaBB SE 1.5.1 及更早版本，CVSS 评分 7.5，危害等级高，无需身份认证即可远程利用。'
published = "2001-01-09T05:00:00.000"
remediation = "升级 YaBB 至 1.5.2 或更高版本，该版本修复了 search.pl 中用户输入未经验证即传入 open() 函数导致的目录遍历与任意命令执行漏洞。如无法升级，应移除或禁用 search.pl 脚本，并在 Web 服务器层面限制 CGI 目录的执行权限，同时过滤 catsearch 参数中的 ../ 及 shell 元字符作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "YaBB SE 1.5.1 search.pl 目录遍历漏洞"
updated = "2026-06-16T21:53:19.160"

