[basic]
description = "Windows 2000 内置 Telnet 服务未能正确终止未完成的连接尝试，存在拒绝服务漏洞。未经身份认证的远程攻击者仅需向目标主机发起 TCP 连接并连接后不发送任何输入数据，即可导致 Telnet 服务资源被无效连接占用，耗尽服务并发连接上限，使合法用户无法正常建立 Telnet 会话。该漏洞影响 Windows 2000 Professional 等版本，攻击门槛低、无需认证，在公网暴露 Telnet 服务的系统面临可用性风险。Microsoft 已在后续安全更新中修复此问题，建议关闭不必要的 Telnet 服务或升级系统。"
published = "2001-01-09T05:00:00.000"
remediation = '建议立即安装 Windows 2000 Service Pack 2 或更高版本补丁，修复 Telnet 服务对未完成 TCP 连接未正确终止的缺陷。如无法立即打补丁，可依次采取以下缓解措施：依次打开"控制面板"→"管理工具"→"服务"，找到"Telnet"服务（服务名 Telnet），将其启动类型修改为"已禁用"并停止服务；或通过组策略（gpedit.msc）配置本地安全策略，在"系统服务"中禁止 Telnet 服务运行；同时在边界防火墙和路由器上阻断 TCP 23 端口的入站访问，仅允许可信管理来源的 SSH 替代方案。由于 Windows 2000 已于 2010 年终止支持，强烈建议将系统升级至受支持的 Windows Server 版本。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Windows 2000 Telnet Service 拒绝服务漏洞"
updated = "2026-06-16T21:53:10.223"

