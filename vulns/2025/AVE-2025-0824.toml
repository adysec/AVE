[basic]
description = "Microsoft Excel 存在释放后使用（Use After Free，CWE-416）漏洞，攻击者可通过向目标用户发送特制的 Excel 文件并诱导其打开，触发内存释放后使用错误，成功利用可在当前用户权限下执行任意代码。该漏洞影响 Microsoft Office 系列产品，CVSS 评分 8.4，危害等级高。由于攻击无需用户交互（预览窗格即可触发）且无需额外权限，攻击者可通过邮件、网页下载等方式大规模传播恶意文件。Microsoft 已在 2025 年 1 月安全更新中发布修复补丁。"
published = "2025-01-14T18:16:01.820"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新。对于 Microsoft Excel 2016，升级至 16.0.5483.1001 及以上版本；对于 Office LTSC for Mac 2021/2024，升级至 16.93.25011212 及以上版本；对于 Office Online Server，升级至 16.0.10416.20047 及以上版本；Microsoft 365 Apps for Enterprise 用户可通过 Microsoft Update 自动获取修复。如无法立即打补丁，建议在受影响的 Excel 实例上启用受保护视图（Protected View）并阻止来自不受信任来源的文档宏执行，以降低利用风险。"
score = 8.4
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Excel 远程代码执行漏洞"
updated = "2026-06-17T08:43:11.780"

