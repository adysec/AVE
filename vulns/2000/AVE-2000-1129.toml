[basic]
description = "IBM HTTP Server 1.3.6（基于Apache）存在缓冲区溢出漏洞。远程未经身份认证的攻击者可通过向目标服务器发送超长构造的GET请求触发该漏洞。由于服务器在处理HTTP请求时未对请求行长度进行有效边界检查，攻击者发送的恶意数据可覆盖内存关键区域，导致服务进程崩溃（拒绝服务）。在某些条件下，该漏洞还可能被进一步利用以执行任意系统命令，从而完全控制目标服务器。该漏洞影响部署IBM HTTP Server 1.3.6版本的系统。"
published = "2001-01-09T05:00:00Z"
remediation = "建议立即升级 IBM HTTP Server 至 1.3.12 或更高版本，该版本已修复因超长 GET 请求引发的缓冲区溢出及远程拒绝服务漏洞。如暂无法立即升级，可在前置防火墙或反向代理层限制单条 HTTP GET 请求的 URL 长度不超过 255 个字符作为临时缓解措施，并尽快安排补丁升级。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "IBM HTTP Server 长GET请求远程命令执行与拒绝服务漏洞"
updated = "2026-06-16T21:53:18Z"

