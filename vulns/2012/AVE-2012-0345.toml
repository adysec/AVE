[basic]
description = "Apple Safari 6.0 之前版本中的 WebKit 引擎存在内存破坏漏洞，攻击者可通过构造恶意网页触发该漏洞，导致远程代码执行或拒绝服务（内存损坏与应用崩溃）。该漏洞影响 Safari 浏览器及 iOS 移动操作系统，攻击条件为受害者访问包含特制内容的网页，无需身份认证即可触发。CVSS 评分 9.3，危害等级严重。"
published = "2012-07-25T20:55:04.430"
remediation = "立即将 Apple Safari 升级至 6.0 或更高版本（macOS 用户可通过 OS X Mountain Lion 更新获取，iOS 用户需升级至 iOS 6.0）。在无法立即升级的情况下，可在 Safari 设置中临时禁用 JavaScript 以降低被利用风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:41.830"

