[basic]
description = "phpRank 1.8 的 add.php 页面存在跨站脚本攻击（XSS）漏洞。该漏洞源于应用程序未对用户输入进行充分的过滤和转义处理，未经身份认证的远程攻击者可以通过在添加链接时向 email 参数或 banurl 参数中注入恶意 JavaScript 脚本或 HTML 代码来利用此漏洞。当其他用户访问包含这些恶意脚本的页面时，攻击者精心构造的脚本将在受害者浏览器中执行，导致会话劫持、Cookie 信息窃取或页面内容篡改等后果。该漏洞影响所有部署 phpRank 1.8 版本的站点，攻击者无需账户凭证即可发起攻击，仅需诱骗用户点击包含恶意载荷的链接即可触发。"
published = "2002-12-31T05:00:00Z"
remediation = "由于 phpRank 1.8 已于 2002 年停止维护且无官方安全补丁，建议尽快将系统迁移至由活跃社区维护的替代排名脚本（如 osclass 或自研方案）。如短期内无法迁移，采取以下缓解措施：第一，修改 add.php 中对 email 和 banurl 参数的输出处理，使用 htmlspecialchars() 函数对用户输入进行转义后再输出到页面，防止浏览器执行注入的脚本；第二，在 Apache 或 Nginx 配置中添加 WAF 规则，拦截包含 <script>、javascript:、onload= 等 XSS 特征Payload 的请求；第三，在 HTTP 响应头中设置 Content-Security-Policy: script-src 'self'，限制页面只能执行同源脚本，阻止跨站脚本执行；第四，若仅使用 phpRank 作为内部工具，可通过防火墙或 .htaccess 限制外部访问 add.php，仅允许可信 IP 段访问。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "phpRank 1.8 跨站脚本攻击漏洞"
updated = "2026-06-16T22:00:00Z"

