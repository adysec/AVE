[basic]
description = 'DeleGate 代理服务器 7.7.0 至 7.8.1 版本存在跨站脚本漏洞。当服务器返回"403 Forbidden"错误页面时，未对用户可控的 URL 参数中的脚本命令进行转义处理，导致攻击者可以通过构造特制的恶意 URL 诱使其他用户访问，从而在受害者浏览器中执行任意 JavaScript 代码。攻击者无需身份认证即可利用该漏洞，CVSS 评分 7.5，危害等级高。成功利用可窃取用户会话 Cookie、劫持用户会话或发起钓鱼攻击。'
published = "2001-12-28T05:00:00Z"
remediation = '建议升级至 DeleGate 9.9.13（最终版本，已修复该 XSS 漏洞）。如无法升级，可在前端部署反向代理（如 Nginx/Apache）过滤含 `<script>` 等 HTML 标签的恶意 URL 请求；或在 DeleGate 配置中启用 `RELIABLE="*"` 参数限制可信任来源，并禁用不必要的协议转发功能作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "DeleGate 403 Forbidden 错误页面跨站脚本漏洞"
updated = "2026-06-16T21:55:48Z"

