[basic]
description = "D-Link DCS-2530L（固件版本低于 1.06.01 Hotfix）和 DCS-2670L（固件版本 2.02 及之前）网络摄像头存在未授权访问漏洞。攻击原理在于设备固件中的 `/config/getuser` 接口缺少身份认证机制，未经身份验证的远程攻击者可直接向该接口发送 HTTP 请求，无需凭据即可获取设备管理员账户的用户名与明文密码。攻击条件为目标设备暴露于网络且可被外部访问，攻击者仅需使用基本的 HTTP 客户端工具即可完成利用，无需交互操作或特殊权限。漏洞影响所有未修复固件版本的 D-Link DCS-2530L 和 DCS-2670L 设备，成功利用后攻击者将获得管理员权限，进而完全控制目标摄像头，可能导致视频监控被窃取、设备被篡改或作为内网进一步渗透的跳板。CVSS v3.1 评分 7.5，危害等级为高。"
published = "2020-09-02T16:15:12Z"
remediation = "DCS-2530L 用户应立即升级固件至 v1.07.00 Hotfix（通过 Mydlink Mobile App 更新）；DCS-2670L 用户升级至 v2.03.00 Hotfix；DCS-4603 升级至 v1.04.02 Hotfix；DCS-4622 升级至 v2.01.10 Hotfix；DCS-4701E 升级至 v2.03.01 Hotfix；DCS-4703E 升级至 v1.03.04 Hotfix；DCS-4705E 升级至 v1.03.02 Hotfix；DCS-4802E 升级至 v2.01.01 Hotfix。DCS-P703 已停止服务，建议停用并更换设备。临时缓解措施：在防火墙或路由器层面限制对设备管理端口（80/443）的访问，仅允许受信任的内网 IP 访问。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "D-Link DCS-2530L和DCS-2670L 信息泄露漏洞"
updated = "2026-06-17T03:06:20Z"

