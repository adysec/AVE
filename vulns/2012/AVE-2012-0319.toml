[basic]
description = "Apple Safari 6.0 之前版本所使用的 WebKit 渲染引擎存在内存破坏漏洞，远程攻击者可通过构造恶意网页触发该漏洞，导致应用程序内存损坏并引发崩溃，进而可执行任意代码或造成拒绝服务。该漏洞影响 Mac OS X 和 iOS 系统上的 Safari 浏览器，攻击者无需身份认证，只需诱导用户访问包含恶意特制内容的网页即可完成利用。由于 WebKit 被广泛应用于 Safari 及 iOS 系统，影响范围较广。Apple 已在 iOS 6.0 和 Safari 6.0 中修复此漏洞。"
published = "2012-07-25T20:55:03Z"
remediation = "升级 Safari 浏览器至 6.0 或更高版本。对于 OS X Mountain Lion 用户，请前往 App Store 下载 Safari 6.0 更新；对于 Lion 或 Snow Leopard 用户，可运行系统软件更新或从 Apple 官网下载独立安装包。如暂时无法升级，建议临时禁用 WebKit 的 JavaScript 自动执行功能并谨慎点击未知来源链接，以降低远程代码执行风险。建议立即安装 Apple 2012 年 7 月 25 日发布的安全更新 (APPLE-SA-2012-07-25-1)。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:38Z"

