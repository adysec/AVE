[basic]
description = '24Link 1.06 Web 服务器存在访问控制绕过漏洞，远程攻击者通过在 HTTP GET 请求路径前添加 "/+/" 或 "/." 等特殊字符串，可绕过服务器的访问限制规则，未经授权访问受保护的资源或目录。该漏洞影响 24Link 1.06 版本，攻击者无需身份认证即可利用，CVSS 评分 7.5，危害等级高。目前官方已停止维护，建议用户迁移至其他 Web 服务器软件。'
published = "2001-01-09T05:00:00Z"
remediation = '24Link 1.06 已停止维护，官方未发布安全补丁。建议立即迁移至受支持的 Web 服务器（如 Apache httpd 2.4 或 Nginx），并在迁移前通过反向代理或 WAF 规则拦截包含 "/+/" 或 "/." 等异常路径的 HTTP GET 请求作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "24Link Web Server 安全绕过漏洞"
updated = "2026-06-16T21:53:11Z"

