[basic]
description = "Proxomitron Naoko-4 BetaFour 及更早版本存在跨站脚本漏洞。远程攻击者可通过向目标用户发送包含恶意脚本的畸形 URL，当 Proxomitron 代理服务器处理该 URL 并返回错误信息时，恶意脚本会被反射回用户浏览器中执行。攻击者无需身份认证即可利用此漏洞，在受害者浏览器上下文中执行任意脚本代码，可能导致会话劫持、敏感信息窃取等危害。该漏洞 CVSS 评分 7.5，危害等级高。"
published = "2001-07-24T04:00:00Z"
remediation = 'Proxomitron Naoko-4 已停止维护，建议立即替换为 Squid、HAProxy 等活跃维护的代理软件。如暂时无法替换，可在 Proxomitron 配置文件中启用 HTML 编码过滤规则，将错误信息中的 `<`、`>`、`"` 等特殊字符转义为 HTML 实体，防止脚本在错误页面中执行。同时建议在浏览器端禁用第三方代理的 JavaScript 执行权限作为纵深防御。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Scott R. Lemmon Proxomitron Naoko-4 跨站脚本漏洞"
updated = "2026-06-16T21:55:22Z"

