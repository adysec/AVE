[basic]
description = "Google Chrome（Linux 和 ChromeOS 版本）的 Ozone 组件中存在释放后使用（Use-After-Free）漏洞，CWE-416。远程攻击者可通过构造特制的 HTML 页面诱导用户访问，成功利用该漏洞可导致对象内存损坏，进而实现任意代码执行或信息泄露。该漏洞影响 142.0.7444.59 之前版本的 Chrome 浏览器，CVSS 评分 8.8，危害等级高危。用户需升级至 142.0.7444.59 或更高版本以修复此漏洞。"
published = "2025-11-10T20:15:38Z"
remediation = "立即将 Google Chrome 升级至 142.0.7444.59 或更高版本（Linux/ChromeOS 平台），可通过 Chrome 内置更新或官方网站下载。Fedora 用户升级至 142.0.7444.162。如无法立即更新，可在浏览器中启用站点隔离（Site Isolation）并禁用 Ozone 相关实验性功能作为临时缓解。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome（Linux/ChromeOS）Ozone 组件释放后使用漏洞"
updated = "2026-06-17T08:32:23Z"

