[info]
author = "AVE"
description = "检测目标 Windows 系统是否存在 UPnP 设备主机服务（upnphost.dll）拒绝服务漏洞。通过向目标发送 HTTP 请求并检查响应中是否包含 Windows 特征字符串，判断目标是否为潜在受影响系统。该漏洞允许未经身份认证的远程攻击者通过特制 UPnP 请求包导致服务崩溃。"
id = "POC-AVE-2025-0851"
name = "CVE-2025-21389 Windows UPnP 设备主机拒绝服务漏洞 PoC"
severity = "high"
tags = [
    "cve-2025-21389",
    "upnp",
    "dos",
    "windows",
]
vuln_id = [
    "CVE-2025-21389",
    "AVE-2025-0851",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["windows"]
