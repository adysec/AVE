[basic]
description = "phpBB 1.4.0 及更早版本的 prefs.php 中存在变量初始化缺陷漏洞。远程认证用户可通过提交非法的 language 参数值，导致 $l_statsblock（prefs.php）或 $l_privnotify（auth.php）变量未能被正确初始化，进而利用这些可控变量传入 eval 语句执行任意 PHP 代码。攻击者需拥有有效账户，无需特殊权限即可利用，可完全控制目标服务器，造成数据泄露、篡改或服务中断。"
published = "2001-07-31T04:00:00Z"
remediation = "升级 phpBB 至 1.4.2 或更高版本，该版本已修复 prefs.php 中 $l_statsblock 和 $l_privnotify 变量未正确初始化的问题。由于 phpBB 1.x 系列已停止安全维护，建议迁移至当前受支持的 phpBB 3.3.x 最新版本，并在迁移前对 auth.php 和 prefs.php 中所有 eval 调用的输入变量进行严格过滤与初始化检查。"
score = 8.8
severity = "HIGH"
sources = ["exploitdb"]
title = "phpBB phpBB 1.x 任意代码执行漏洞"
updated = "2026-06-16T21:56:20Z"

