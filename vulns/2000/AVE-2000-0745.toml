[basic]
description = "Top Layer AppSwitch 2500 存在 ICMP 数据包处理缺陷，远程攻击者无需身份认证即可通过网络向目标设备发送特制的畸形 ICMP 数据包，触发设备协议栈解析异常，导致设备拒绝服务，无法正常转发网络流量。该漏洞影响 Top Layer AppSwitch 2500 系列产品，CVSS 评分 5.0，危害等级中等。目前厂商已发布相关修复建议。"
published = "2000-07-19T04:00:00Z"
remediation = "Top Layer AppSwitch 2500 已停止技术支持且不再发布固件更新，建议将设备替换为受支持的现代应用交付控制器（ADC）。在完成替换前，可在边界防火墙上配置规则丢弃（drop）所有入站 ICMP 报文（包括 Echo Request、Timestamp、Address Mask 等类型），并限制 ICMP 速率以缓解畸形报文导致的拒绝服务攻击。同时建议将设备管理接口隔离到独立管理 VLAN，避免暴露在不可信网络中。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Top Layer AppSwitch 2500 ICMP报文处理拒绝服务漏洞"
updated = "2026-06-16T21:52:07Z"

