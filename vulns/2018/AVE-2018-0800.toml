[basic]
description = "CVE-2018-4990是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2018-07-09T19:29:03Z"
remediation = "升级 Adobe Acrobat Reader 至以下修复版本：Acrobat Reader DC Continuous 更新至 2018.011.20063，Acrobat Reader 2017 更新至 2017.011.30102，Acrobat Reader 2015 更新至 2015.006.30452。更新方式：打开 Acrobat Reader，点击「帮助」→「检查更新」，或从 Adobe 官方下载中心（https://get.adobe.com/reader/）下载完整安装包重新安装。如无法立即升级，可在 Acrobat Reader 中禁用 JavaScript（编辑→首选项→JavaScript→取消勾选「启用 Acrobat JavaScript」）作为临时缓解措施，以阻止利用脚本执行。"
score = 8.8
severity = "HIGH"
