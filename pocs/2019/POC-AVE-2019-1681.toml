[info]
author = "AVE"
description = "检测 Apple macOS/iOS XNU 内核 in6_pcbdetach 释放后使用漏洞，通过检查系统版本判断是否存在漏洞"
id = "POC-AVE-2019-1681"
name = "CVE-2019-8605 PoC"
severity = "high"
tags = ["cve-2019-8605"]
vuln_id = [
    "CVE-2019-8605",
    "AVE-2019-1681",
]

[poc]
logic = "any"

[[poc.requests]]
path = "/System/Library/CoreServices/SystemVersion.plist"
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["10.14.5"]
