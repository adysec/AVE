[basic]
description = "NewAtlanta ServletExec ISAPI 4.1 中的 JSPServlet 组件存在拒绝服务漏洞。远程攻击者可通过向目标服务器发送超长 .jsp 文件请求，或直接向 com.newatlanta.servletexec.JSP10Servlet 发送超长 URL，触发服务器崩溃，导致服务不可用。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响运行 ServletExec ISAPI 4.1 的 Web 服务器。"
published = "2002-10-04T04:00:00Z"
remediation = "升级 ServletExec ISAPI 至 4.1 以上版本（如 5.0），或安装厂商提供的安全补丁。若无法升级，在 web.xml 中移除或限制 com.newatlanta.servletexec.JSP10Servlet 的访问映射，并在 Web 服务器（IIS）层面限制 URL 长度不超过 4096 字节，同时配置 ISAPI 筛选器仅允许可信来源的请求。由于该产品已停止维护，建议迁移至 Tomcat 或 Jetty 等仍在支持的 Java Servlet 容器。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "NewAtlanta ServletExec ISAPI 4.1 拒绝服务漏洞"
updated = "2026-06-16T21:58:20Z"

