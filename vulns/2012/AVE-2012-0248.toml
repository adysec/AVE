[basic]
description = "MySQL 5.1.63 之前版本及 5.5.24 之前版本中存在排序顺序索引计算错误漏洞，远程认证用户可通过构造特定查询触发不正确的索引计算，导致 mysqld 进程崩溃，造成拒绝服务。该漏洞影响 MySQL 5.1.x 和 5.5.x 系列，攻击者需拥有数据库有效账户，利用难度较低，但仅影响服务可用性，不涉及数据泄露。"
published = "2012-08-17T00:55:03.517"
remediation = "升级 MySQL 至 5.1.63 及以上版本（5.1.x 分支）或 5.5.24 及以上版本（5.5.x 分支）。如使用 Oracle 官方发行版，通过包管理器更新：yum update mysql-server 或 apt-get upgrade mysql-server。临时缓解措施可在 MySQL 配置中限制连接速率和并发数，降低攻击者利用认证后 DoS 的风险。"
score = 4
severity = "MEDIUM"
sources = ["tenable"]
title = "Oracle MySQL Server 排序索引计算拒绝服务漏洞"
updated = "2026-06-16T23:42:01.933"

