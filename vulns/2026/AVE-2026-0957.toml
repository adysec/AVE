[basic]
description = "Trend AI Apex One 及 Vision One SEP（原 Standard Endpoint Protection）Windows 终端安全代理中存在一个基于命名管道的来源验证漏洞（CWE-346）。该漏洞位于 Apex One NT Listener 服务的命名管道通信机制中，服务端未能充分验证客户端命令的来源身份，导致本地低权限攻击者可在已获得低权限代码执行权限的前提下，通过向该命名管道发送特制请求的方式注入并执行特权操作，最终实现本地权限提升至 SYSTEM 级别。该漏洞与 CVE-2026-34927 属于同一漏洞类别，但存在于不同的命名管道通信机制中。受影响的版本包括 Apex One 2019 代理版本低于 17079，以及 Apex One as a Service / Vision One SEP 代理版本低于 14.0.20731 的 Windows 系统。Trend AI 已观测到该漏洞类别的实际在野利用尝试，并已发布安全更新修复此问题，受影响用户应尽快升级至 SP1 CP Build 18012（Apex One 本地部署版）或 Security Agent build 14.0.20731（云服务版）。"
published = "2026-05-21T14:16:45.463"
remediation = "将 Apex One 安全代理升级至 SP1 Build 17079（全新安装）或 SP1 CP Build 18012（现有 SP1 用户），Apex One as a Service / Vision One SEP 安全代理升级至 Agent build 14.0.20731。如无法立即更新，应严格限制对受影响系统的物理和远程访问权限作为临时缓解措施，并持续关注 Trend Micro 下载中心（downloadcenter.trendmicro.com）获取最新补丁。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Trend Micro Apex One SEP 代理本地权限提升漏洞"
updated = "2026-07-23T16:10:00.137"

