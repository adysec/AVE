[basic]
description = "Adobe Flash Player 10.3.183.5之前版本存在缓冲区溢出漏洞，攻击者可通过向受影响系统发送特制的Flash内容触发该漏洞，导致远程代码执行。该漏洞影响Windows、Mac OS X、Linux、Solaris及Android平台，CVSS评分10.0，危害等级严重。攻击无需身份认证，用户只需访问包含恶意Flash内容的网页即可被利用。Adobe已在安全更新中修复此漏洞。"
published = "2011-08-10T21:55:02Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.5 及以上版本（Windows/Mac/Linux/Solaris）或 10.3.186.3 及以上版本（Android），同时升级 Adobe AIR 至 2.7.1 及以上版本。鉴于 Adobe Flash Player 已停止支持，建议彻底卸载 Flash Player 并迁移至 HTML5 标准。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 远程缓冲区溢出漏洞"
updated = "2026-06-16T23:30:45Z"

