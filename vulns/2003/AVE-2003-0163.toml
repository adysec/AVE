[basic]
description = "iproute 2.4.7 及更早版本存在拒绝服务漏洞，该漏洞源于内核 netlink 接口缺乏对消息来源的充分验证。本地攻击者无需身份认证即可通过伪造其他用户身份发送特制消息至内核 netlink 接口，触发内核异常或资源耗尽，导致系统拒绝服务。该漏洞影响运行受影响版本 iproute 的 Linux 系统，攻击者需具备本地访问权限，利用复杂度低，可造成系统可用性中断。"
published = "2003-12-15T05:00:00Z"
remediation = "升级 iproute 至 2.4.8 或更高版本以修复 netlink 接口消息伪造导致的拒绝服务漏洞。Debian 用户应执行 apt-get install --only-upgrade iproute 应用 DSA-492 安全更新；Red Hat 用户应通过 up2date 或 yum update iproute 安装 RHSA-2003-316 和 RHSA-2003-317 修复包；Ubuntu 用户应升级至 20041019-4ubuntu5 或更高版本。如无法立即升级，临时缓解措施为通过 sysctl 限制非特权用户对 NETLINK 套接字的访问权限，或配置 iptables 规则过滤本地 netlink 消息，降低本地恶意用户伪造消息导致内核拒绝服务的风险。"
score = 4.9
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux iproute 本地消息伪造拒绝服务漏洞"
updated = "2026-06-16T22:03:05Z"

