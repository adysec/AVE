[basic]
description = "AOL Instant Messenger (AIM) 4.1.2010 存在格式化字符串漏洞，远程攻击者可通过向目标用户传输包含格式化字符（如 %s、%n 等）的特殊构造文件名的文件，触发 AIM 客户端在处理文件名时的格式化字符串解析缺陷，导致拒绝服务或可能执行任意命令。攻击条件仅需目标用户接收并处理该恶意文件，无需其他认证。该漏洞影响 AIM 4.1.2010 版本，CVSS 评分 5.0，危害等级中危。"
published = "2000-12-11T05:00:00Z"
remediation = "升级 AOL Instant Messenger 至 4.7 及以上版本，该漏洞在后续版本中已修复。由于 AOL 已于 2017 年 12 月正式关闭 AIM 服务，建议立即停止使用该软件，迁移至其他即时通讯工具（如 Signal、Telegram 等）。如因遗留系统必须使用，应在网络边界防火墙阻断 AIM 使用的 5190 端口入站连接，并避免接收来自不可信来源的文件传输请求。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "AOL Instant Messenger 格式字符串漏洞"
updated = "2026-06-16T21:52:56Z"

