[basic]
description = "Microsoft Edge（基于 Chromium）存在远程代码执行漏洞。该漏洞源于 Chromium 内核在处理特制网页内容时存在缺陷，未经身份认证的攻击者可通过诱导用户访问恶意构造的网页触发漏洞，成功利用可在目标系统上以当前用户权限执行任意代码。攻击需要用户交互（如点击链接或访问恶意站点），无法远程直接利用。影响 Microsoft Edge 133.0.3065.51 之前版本，CVSS 评分 6.5，危害等级中危。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-06T23:15:09Z"
remediation = "立即将 Microsoft Edge 更新至 133.0.3065.51 或更高版本。可通过浏览器菜单「帮助和设置」→「关于 Microsoft Edge」自动检查并安装更新，或从 microsoft.com/edge 手动下载最新版本安装。企业用户可通过 Microsoft Endpoint Manager 或 WSUS 统一推送更新。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Edge（基于 Chromium）远程代码执行漏洞"
updated = "2026-06-17T08:42:59Z"

