[basic]
description = 'HIS Auktion 1.62 存在目录遍历漏洞，攻击者通过在 menue 参数中插入 ".."（点号）路径遍历序列，可绕过目录限制读取服务器上的任意文件。此外，该参数还可能通过 shell 元字符注入实现远程命令执行。攻击者无需身份认证即可远程利用此漏洞，CVSS 评分为 7.5，危害等级为高危。该漏洞影响 HIS Auktion 1.62 版本。ExploitDB 上已有公开 PoC（编号 20628），攻击者可直接参考其利用方法构造恶意请求。'
published = "2001-06-02T04:00:00.000"
remediation = "立即升级His Software Auktion至最新版本，若无可用补丁则在Web服务器中禁用auktion.pl的menue参数或在应用层过滤../路径遍历字符，同时限制CGI脚本所在目录的文件系统访问权限。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "HIS Auktion 1.62 目录遍历漏洞"
updated = "2026-06-16T21:53:53.547"

