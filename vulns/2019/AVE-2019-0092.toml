[basic]
description = 'WordPress 的 wps-hide-login 插件在 1.5.3 之前版本中存在安全功能绕过漏洞。该插件用于隐藏 WordPress 默认登录页面 wp-login.php，以防范暴力破解和自动化攻击，但其在 /classes/plugins.php 文件中使用不安全的字符串匹配方式检查请求参数，仅通过 strpos 判断 URL 中是否包含 "action=confirmaction" 即放行访问。未经身份认证的远程攻击者可通过在请求 URL 中拼接包含该字符串的查询参数（例如 wp-login.php?SECUPRESSaction=confirmaction），绕过插件的登录页面保护机制，直接访问 WordPress 默认登录页面，进而实施暴力破解、凭据填充或进一步入侵。该漏洞影响所有安装了 wps-hide-login 插件 1.5.3 之前版本的 WordPress 站点，攻击复杂度低，无需权限、无需用户交互，可远程利用，CVSS 评分为 9.8，危害等级为严重。'
published = "2019-08-30T13:15:11Z"
remediation = "升级 WordPress 的 wps-hide-login 插件到 1.5.3 或更高版本，该版本已修复 action=confirmaction 保护绕过漏洞。进入 WordPress 后台，点击「插件」→「已安装的插件」，找到 WPS Hide Login，如版本低于 1.5.3 则点击「更新」。若后台暂时无法访问插件页面，可登录 WordPress 管理后台的「插件」→「安装插件」，搜索 WPS Hide Login 进行覆盖安装。如因业务原因暂时无法升级，可在 Web 服务器（如 Nginx 或 Apache）防火墙规则中拦截包含 action=confirmaction 参数的 wp-login.php 请求作为临时缓解措施，例如在 Nginx 配置中添加 return 403 规则阻断包含该参数的对 wp-login.php 的访问。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress wps-hide-login 插件保护绕过漏洞"
updated = "2026-06-17T02:21:08Z"

