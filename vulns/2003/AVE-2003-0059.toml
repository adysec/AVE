[basic]
description = "OpenSSH-portable（OpenSSH）3.6.1p1 及更早版本在启用 PAM 支持时，当用户不存在时会立即发送错误消息，而存在的用户则需经过完整的 PAM 认证流程后才返回错误，这一响应时间差异使得远程攻击者可通过计时攻击（Timing Attack）枚举系统有效用户名。该漏洞影响所有启用 PAM 的 OpenSSH 3.6.1p1 及之前版本，攻击者无需认证即可利用，CVSS 评分 5.0，危害等级中危。已公开的利用工具（ExploitDB ID: 25）可自动化完成用户名探测过程。"
published = "2003-05-12T04:00:00Z"
remediation = "升级 OpenSSH-portable 至 3.6.1p2 或更高版本，该版本已集成 Openwall 补丁，确保对不存在的用户名也执行 PAM 密码认证流程，消除响应时间差异。如无法升级，可在 /etc/pam.d/system-auth 中 pam_unix.so 行添加 nodelay 选项（如 auth sufficient /lib/security/pam_unix.so likeauth nullok nodelay），消除 pam_unix 模块的认证延迟差异。同时建议在 sshd_config 中禁用 PAMAuthenticationViaKbdInt 并限制 SSH 登录尝试频率作为纵深防御。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "OpenSSH OpenSSH-portable PAM 用户枚举漏洞"
updated = "2026-06-16T22:01:43Z"

