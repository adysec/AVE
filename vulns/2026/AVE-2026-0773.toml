[basic]
description = "GeoNetwork 是一款用于管理空间参考资源的目录应用系统，其 OAuth2/OIDC 和 Keycloak 登录过滤器在验证用户登录后的重定向目标 URL 时存在安全验证绕过漏洞（CWE-601）。由于对重定向目标的校验逻辑不完善，未能正确拒绝所有可导致浏览器离开 GeoNetwork 源站点的 URL 格式，攻击者可构造特制的登录链接，诱使已登录用户在完成认证流程后被重定向至攻击者控制的外部站点，从而用于钓鱼攻击（如展示虚假登录表单）或链式攻击。该漏洞影响 GeoNetwork 3.12.0 至 4.2.16 及 4.4.11 版本，攻击者需具备低权限且需用户交互触发，CVSS 评分 4.8，危害等级中危。官方已在 4.2.16 和 4.4.11 版本中修复此问题。"
published = "2026-07-31T23:17:24Z"
remediation = "升级 GeoNetwork 至 4.2.16 或 4.4.11 及以上版本，这两个版本已修复 OAuth2/OIDC 和 Keycloak 登录后的开放重定向绕过漏洞。如无法立即升级，可在反向代理层（如 Nginx）添加规则，拦截包含外部域名的 redirect 参数请求作为临时缓解措施。GeoNetwork 3.x 和 4.0.x 已停止维护，必须迁移至受支持版本。"
score = 4.8
severity = "MEDIUM"
sources = ["ghsa"]
title = "GeoNetwork core-geonetwork 开放重定向绕过漏洞"
updated = "2026-07-31T23:17:24Z"

