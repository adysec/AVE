[basic]
description = "Cisco VCO/4K 5.1.3 存在远程用户名和密码检索漏洞。攻击者无需身份认证即可通过网络向目标设备发送特制请求，利用该漏洞可远程获取系统存储的用户名和密码等敏感凭据信息，进而获得设备管理权限，可能导致整个通信网络被控制。该漏洞影响 Cisco VCO/4K 5.1.3 版本，Exploit-DB 已公开利用代码，攻击门槛较低。"
published = "2000-12-19"
remediation = "立即限制 SNMP 访问来源，在 VCO/4K 上配置 ACL 仅允许受信任管理 IP 访问 SNMP（161/UDP），并将 SNMP community string 改为复杂随机字符串（≥20 位含大小写字母数字特殊字符）。同时禁用 SNMP v1/v2c，改用 SNMP v3 并启用加密认证。由于该产品已停止支持，建议尽快迁移至受支持的替代平台。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Cisco Virtual Central Office 4000 远程用户名和密码泄露漏洞"
updated = "2000-12-19"

