[basic]
description = "Apple iOS、iPadOS、macOS、tvOS 及 watchOS 系统存在内存损坏漏洞，由于 IOAccelCommandQueue2::processSegmentKernelCommand() 函数对内存缓冲区边界内操作限制不恰当，导致越界时间戳写入。攻击者需诱导用户在受影响设备上运行特制恶意应用程序方可触发漏洞，成功利用后将获得内核权限并执行任意代码，完全控制设备。该漏洞影响 iOS 13.3 及更早版本、iPadOS 13.3 及更早版本、macOS Catalina 10.15.2 及更早版本等。Apple 已在 iOS 13.3.1、iPadOS 13.3.1、macOS Catalina 10.15.3、tvOS 13.3.1、watchOS 6.1.2 中修复此问题，CVSS v3.1 评分为 7.8，危害等级高。"
published = "2020-02-27T21:15:16Z"
remediation = "将 iOS 设备升级至 13.3.1 或更高版本，iPadOS 升级至 13.3.1 或更高版本，macOS 升级至 Catalina 10.15.3 或更高版本，tvOS 升级至 13.3.1 或更高版本，watchOS 升级至 6.1.2 或更高版本以修复内存损坏漏洞。如暂无法升级，应限制设备本地物理访问权限并卸载不受信任的第三方应用作为临时缓解。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Apple iOS/macOS 越界时间戳写入内存破坏远程代码执行漏洞"
updated = "2026-06-17T03:19:07Z"

