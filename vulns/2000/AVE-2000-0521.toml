[basic]
description = "Linux 系统中 pam_console PAM 模块存在安全漏洞。当显示管理器（如 gdm 或 kdm）启用 XDMCP 协议时，远程攻击者可在无需认证的情况下通过 XDMCP 连接获取系统控制台访问权限，进而能够重启目标系统。该漏洞影响 Conectiva 4.x/5.x 及 RedHat 6.x 等 Linux 发行版，CVSS 评分 5.0，危害等级中等。攻击者只需通过网络可达目标即可利用，无需任何身份凭证，但仅影响系统可用性。"
published = "2000-07-27T04:00:00.000"
remediation = "禁用 gdm/kdm 的 XDMCP 服务（编辑 `/etc/X11/gdm/gdm.conf` 或 `/etc/kde/kdm/kdmrc`，将 `Enable=XDMCP=true` 改为 `false`），或升级至不受影响的 Red Hat 7.x+/Conectiva 后续版本。如无需远程图形登录，建议彻底移除 xdm 包。限制控制台物理访问权限作为辅助措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Linux pam_console 模块权限提升漏洞"
updated = "2026-06-16T21:52:13.697"

