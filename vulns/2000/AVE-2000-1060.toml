[basic]
description = 'Wingate 4.1 Beta A 及更早版本的日志文件服务存在目录遍历漏洞，远程攻击者无需身份验证即可通过向目标发送包含编码字符的 HTTP GET 请求，利用"../"路径穿越序列读取服务器上的任意文件。该漏洞影响部署受影响版本 Wingate 代理服务器的组织，攻击者可借此获取敏感配置文件、系统文件等机密信息，造成信息泄露。由于攻击仅需构造特制的 HTTP 请求且无需任何凭据，在网络可达的情况下即可被利用，危害等级中等。'
published = "2000-12-11T05:00:00.000"
remediation = "升级到 WinGate 4.1 Beta B 或更高版本以修复此目录遍历漏洞。如暂时无法升级，应在 WinGate 配置中禁用 logfile service 的远程访问功能，或在防火墙层面限制对日志服务端口的访问，仅允许可信 IP 连接，同时检查系统日志中是否存在利用编码 ../ 字符读取敏感文件的异常请求。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "WinGate 日志服务目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:53:02.900"

