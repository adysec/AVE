[basic]
description = "Icecast 是一款开源的流媒体音频服务器软件，其 1.3.8beta2 及更早版本（包括 1.3.7、1.3.8）中的 print_client() 函数存在格式字符串漏洞。当远程攻击者向运行有漏洞版本的 Icecast 服务器发起连接时，服务器会将用户可控的输入作为格式字符串直接传递给格式化输出函数而未进行适当过滤，攻击者可利用 %s、%n、%x 等格式说明符读取或覆盖内存任意地址，进而执行任意系统命令。由于该漏洞无需身份认证，攻击条件极为简单：只要目标服务器暴露在网络上且运行着受影响的版本，远程攻击者即可单步触达利用并完全控制服务器。该漏洞影响所有使用 Icecast 1.3.x 系列早期版本的流媒体服务部署，CVSS 评分为满分 10.0，危害等级为严重。攻击者成功利用后可在目标系统上执行任意代码，造成信息泄露、服务中断乃至系统沦陷等严重后果。"
published = "2001-03-26T05:00:00Z"
remediation = '立即将 Icecast 升级至已修复的 1.3.8.beta2-2 或更高版本（Red Hat 6.x 系列）及 1.3.8.beta2-3（Red Hat 7.0），或从源码打补丁：修改 utility.c 中 print_client() 函数，将所有 fd_write(info.statsfile, buf) 调用改为 fd_write(info.statsfile, "%s", buf)，并将 sprintf(buf, ...) 替换为 snprintf(buf, BUFSIZE, ...)，确保缓冲区大小限制，防止格式字符串被当作格式化指令解析。如无法立即升级，可临时在防火墙层阻断对 Icecast 端口（默认 8000）的外部访问，直至完成补丁更新。'
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Xiph Icecast 格式字符串远程代码执行漏洞"
updated = "2026-06-16T21:53:51Z"

