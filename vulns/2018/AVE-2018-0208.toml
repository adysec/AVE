[basic]
description = 'Fortinet FortiOS 及 FortiProxy 的 SSL VPN Web 门户存在授权不当漏洞（CWE-863），也被称为"magic 后门"。未经身份认证的远程攻击者可通过向 SSL VPN 登录页面发送包含特殊 magic 参数的精心构造的 HTTP 请求，绕过授权检查直接修改任意 SSL VPN 用户的密码，进而获取 VPN 访问权限。该漏洞影响 FortiOS 6.0.0 至 6.0.4、5.6.0 至 5.6.8、5.4.1 至 5.4.10 以及 FortiProxy 2.0.0、1.2.0 至 1.2.8、1.1.0 至 1.1.6、1.0.0 至 1.0.7 版本，CVSS 评分 9.1，危害等级严重，已被 CISA 列入已知被利用漏洞目录。'
published = "2019-06-04T21:29:00Z"
remediation = "升级 FortiOS 至 6.2.0/6.0.5/5.6.9/5.4.11 及以上版本，FortiProxy 升级至 2.0.1/1.2.9/1.1.7/1.0.8 及以上版本。若无法立即升级，可在 SSL VPN 管理界面限制可信源 IP 访问并启用多因素认证作为临时缓解措施。"
score = 9.1
severity = "CRITICAL"
sources = ["kev"]
title = "Fortinet FortiOS SSL VPN 未授权密码重置漏洞"
updated = "2026-06-17T01:39:18Z"

