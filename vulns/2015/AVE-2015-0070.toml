[basic]
description = "WordPress RobotCPA 插件 5 版本中存在路径遍历漏洞，位于 f.php 文件的 l 参数中。未经身份认证的远程攻击者可通过向目标站点发送特制的 HTTP 请求，利用 l 参数中的目录跳转序列（如 ../）读取服务器上任意文件，导致敏感信息泄露。该漏洞影响所有使用 RobotCPA 插件的 WordPress 站点，攻击无需任何权限，利用难度低，危害等级高。建议用户立即升级或移除受影响插件。"
published = "2019-10-10T17:15:16Z"
remediation = "立即在 WordPress 后台「插件」页面停用并彻底删除 RobotCPA 插件，该插件已长期无人维护且官方未发布补丁。如仍需广告跟踪功能，替换为活跃维护的替代插件（如 Pretty Links）。同时确保 WordPress 核心程序及所有插件更新至最新版本，并配置 Web 应用防火墙（WAF）规则拦截路径遍历攻击载荷（如 `../` 及编码变体）。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress RobotCPA插件路径遍历漏洞"
updated = "2026-06-17T00:36:36Z"

