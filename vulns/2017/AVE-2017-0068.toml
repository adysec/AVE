[basic]
description = "WordPress contact-form-multi插件在1.2.1之前版本存在多个跨站脚本攻击（XSS）漏洞（CWE-79）。该漏洞源于插件未对用户提交的表单数据进行充分的安全过滤和转义处理，导致攻击者可注入恶意JavaScript代码。未授权远程攻击者可通过构造包含恶意脚本的表单输入字段，当管理员或其他用户访问受影响页面时，恶意代码将在其浏览器中执行。利用该漏洞可窃取用户会话凭证、篡改页面内容、实施钓鱼攻击或进行恶意重定向，影响所有安装并启用该插件的WordPress网站。"
published = "2019-08-13T17:15:13Z"
remediation = "立即将 WordPress 的 Contact Form Multi 插件升级至 1.2.1 或更高版本。登录 WordPress 后台，进入「插件」→「已安装插件」，找到 Contact Form Multi 点击「立即更新」；或从 WordPress 插件目录重新下载安装。如无法立即更新，可暂时禁用该插件，并移除所有 `bws_panel` 页面中未经验证的 `category` 参数输出作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress contact-form-multi 插件跨站脚本漏洞"
updated = "2026-06-17T01:12:56Z"

