[basic]
description = "Windows Media Player 7.0 的皮肤文件（.wmz）处理机制存在任意 Java 小程序执行漏洞。远程攻击者可将恶意 Java 小程序封装在名为 skin.wmz 的皮肤文件中，然后通过 applet 标签的 codebase 参数引用该皮肤文件，诱使用户在 Internet Explorer 中访问恶意页面，即可在用户浏览器中执行任意 Java 小程序。该漏洞影响 Windows Media Player 7.0 版本，攻击复杂度较高（需用户交互），成功利用可导致机密性、完整性和可用性部分受损。"
published = "2001-03-12T05:00:00Z"
remediation = '建议立即安装 Microsoft 安全公告 MS01-010 提供的 Windows Media Player 7 安全更新补丁，下载地址为 https://www.microsoft.com/download/details.aspx?FamilyId=BAF62356-D717-4B8F-97E0-299A7697A083。如无法立即打补丁，可在 Internet Explorer 中将 Internet 区域的安全级别设置为"高"，并禁用 Java 小程序执行作为临时缓解措施。'
score = 5.1
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows Media Player 7.0 .wmz 皮肤文件远程代码执行漏洞"
updated = "2026-06-16T21:53:44Z"

