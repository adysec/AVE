[basic]
description = "Brightstation Muscat 1.0 的 Muscat Empower CGI 程序存在路径泄露漏洞，攻击者无需身份认证即可通过向目标服务器发送包含恶意 DB 参数的请求，获取服务器文件的绝对路径信息。该漏洞影响运行 Muscat 1.0 的 Web 服务器，攻击者可利用泄露的路径信息进一步探测服务器结构，为后续攻击提供便利。CVSS 评分为 5.0，危害等级中等。"
published = "2001-06-02T04:00:00.000"
remediation = "删除或停用 Brightstation Muscat 1.0，该版本已无官方补丁。若必须保留，请在 Web 服务器中禁用对 /cgi-bin/empower 路径的访问，并对 DB 参数进行输入验证，拒绝包含非预期字符的请求。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Brightstation Muscat 1.0 路径泄露漏洞"
updated = "2026-06-16T21:53:54.890"

