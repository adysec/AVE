[basic]
description = "Aptis TotalBill 3.0 的 sysgen 服务未实施任何身份认证机制，远程攻击者可直接连接该服务并指定要执行的系统命令，从而以 root 权限在目标服务器上执行任意命令。该漏洞影响 Aptis TotalBill 3.0 版本，攻击无需任何认证，利用方式简单，可导致服务器完全被控制。"
published = "2000-10-20T04:00:00.000"
remediation = "立即升级到最新的Aptis Software TotalBill版本（建议使用3.0.1及以上），并确保禁用或移除默认的sysgen服务。如果无法立即更新，建议通过防火墙阻止对sysgen服务端口的外部访问，并部署入侵检测系统监控可疑进程。定期进行安全扫描，删除过期服务文件并应用最新的安全补丁。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Aptis Software TotalBill 远程命令执行漏洞"
updated = "2026-06-16T21:52:25.063"

