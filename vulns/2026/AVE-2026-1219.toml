[basic]
description = "Labcenter Electronics Proteus在解析PDSPRJ文件时存在缓冲区越界写入漏洞，原因是缺乏对用户提交数据的充分验证。未经身份认证的远程攻击者可构造恶意PDSPRJ文件，诱使用户访问恶意页面或打开该文件，从而在当前进程上下文中执行任意代码。该漏洞影响Proteus 8.17 SP5版本，CVSS评分为7.8，危害等级为高危，对应ZDI-CAN-25718。"
published = "2026-01-01"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
