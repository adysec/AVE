[basic]
description = "QEMU 的 virtio-gpu 驱动程序中存在整数溢出漏洞。calc_image_hostmem() 函数在计算 2D 图像所需内存大小时，使用 32 位整数进行宽度与每像素比特数的乘法运算，当攻击者构造特制的图像尺寸参数时可触发整数溢出，导致分配的内存缓冲区过小，进而引发堆缓冲区溢出。本地攻击者需先在客户机中获得低权限代码执行能力，随后通过向 virtio-gpu 发送恶意构造的资源创建请求触发该漏洞，成功利用可实现权限提升，在宿主机上下文中执行任意代码。该漏洞影响 QEMU 全版本（至修复前），CVSS 评分 8.8，危害等级高。Red Hat 已发布补丁修复此漏洞。"
published = "2026-01-01"
remediation = "立即升级 QEMU 至包含补丁的版本（如 openSUSE 升级至 10.0.11 或更高版本）。补丁已合入 QEMU 主线，commit 为 9462ff4695aa 的后续修复，将 calc_image_hostmem 返回值类型提升为 uint64_t 并添加显式整数溢出检查。如无法立即升级，可在虚拟机配置中禁用 virtio-gpu 设备（移除 -device virtio-gpu-pci 参数），改用其他显示后端（如 VGA 或 cirrus）作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "QEMU virtio-gpu 整数溢出本地权限提升漏洞"
updated = "2026-01-01"

