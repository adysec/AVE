[basic]
description = "NUUO NVRmini 2、NUUO NVRsolo 及 NETGEAR ReadyNAS Surveillance 等网络视频录像机（NVR）产品的 __debugging_center_utils___.php 文件中存在输入验证不当漏洞（CWE-20）。远程未经身份认证的攻击者可通过向该脚本的 log 参数传递特制的 PHP 代码，利用该漏洞实现任意 PHP 代码执行，进而完全控制目标设备。攻击无需任何权限或用户交互，仅需网络可达即可触发，危害严重。该漏洞影响 NUUO NVRmini 2 1.7.5 至 3.0.0、NUUO NVRsolo 1.7.5 至 3.0.0 及 NETGEAR ReadyNAS Surveillance 1.1.1 至 1.4.1 版本。"
published = "2016-08-31T15:59:00Z"
remediation = "厂商 NUUO 和 NETGEAR 未发布任何安全补丁，建议立即将受影响的 NUUO NVRmini 2（固件 1.7.5~3.0.0）、NUUO NVRsolo（固件 1.0.0~3.0.0）及 NETGEAR ReadyNAS Surveillance（1.1.1~1.4.1）设备从公网隔离，禁止暴露在不可信网络中；在防火墙层面限制对设备 80/443 端口的访问，仅允许受信任的管理 IP 连接；如业务允许，建议更换为已维护的替代产品。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "NUUO NVRmini2/NVRsolo 及 NETGEAR ReadyNAS Surveillance 远程代码执行漏洞"
updated = "2026-06-17T00:49:51Z"

