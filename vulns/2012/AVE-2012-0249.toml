[basic]
description = "Google Chrome 20.0.1132.43之前版本中存在信息泄露漏洞。远程攻击者可通过构造包含跨域IFRAME元素的恶意网页，利用不同域名下iframe元素对URL片段标识符（fragment identifier）的访问权限，获取目标页面中的敏感信息。该漏洞无需用户认证即可远程利用，攻击复杂度低，仅影响机密性。Google已在Chrome 20.0.1132.43版本中修复此漏洞。"
published = "2012-06-27T10:18:38Z"
remediation = "将 Google Chrome 升级至 20.0.1132.43 或更高版本；Apple Safari 用户升级至 6.0 或更高版本；Apple iOS 用户升级至 6.0 或更高版本。Linux 发行版用户通过包管理器更新 chromium 浏览器。无法立即升级时，可在浏览器中禁用 JavaScript 或使用 NoScript 类扩展阻止跨域 IFRAME 访问作为临时缓解。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 跨域信息泄露漏洞"
updated = "2026-06-16T23:42:09Z"

