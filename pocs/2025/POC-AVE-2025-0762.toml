[info]
author = "ave"
description = "通过向目标发送 HTTP GET 请求并检测响应体是否包含 Windows 关键字，验证目标是否为 Windows DNS 服务器。该漏洞为远程代码执行漏洞，CVSS 9.8，攻击者可通过特制 DNS 请求触发远程代码执行，影响多个 Windows 版本。"
id = "POC-AVE-2025-0762"
name = "CVE-2025-21303 Windows DNS RCE PoC"
severity = "critical"
tags = ["ave-2025-0762"]
vuln_id = [
    "CVE-2025-21303",
    "AVE-2025-0762",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["windows"]
