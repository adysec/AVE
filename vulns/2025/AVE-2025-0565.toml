[basic]
description = "Google Chrome 在 Windows 平台的下载功能实现中存在逻辑缺陷。本地攻击者可通过诱导用户访问一个精心构造的 HTML 页面，利用该实现不当的问题绕过浏览器的“网络标记”（Mark of the Web, MotW）安全机制。MotW 旨在标识文件来源自互联网并触发相应的安全警告，一旦被绕过，原本应被标记为潜在危险的下载文件将被视为本地受信文件，从而降低系统的安全防御能力。该漏洞影响版本低于 143.0.7499.41 的 Google Chrome 浏览器，攻击条件为用户触发特定页面交互，影响范围为 Windows 平台用户。"
published = "2025-12-02T19:15:48Z"
remediation = '建议将 Google Chrome 浏览器升级至 143.0.7499.41 或更高版本。用户可通过点击浏览器右上角“三点”菜单 $\rightarrow$ “帮助” $\rightarrow$ “关于 Google Chrome”触发自动更新并重启浏览器以完成修复。'
score = 4.4
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome 下载功能实现不当导致的安全机制绕过漏洞"
updated = "2026-06-17T08:34:29Z"

