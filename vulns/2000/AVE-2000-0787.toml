[basic]
description = "AOL Instant Messenger（AIM）存在缓冲区溢出漏洞，漏洞位于 'aim://' 协议处理流程中。未经身份认证的远程攻击者可通过发送超长的 'goim' 命令触发缓冲区溢出，从而在目标系统上执行任意命令。该漏洞影响 AIM 4.3.2229 之前的所有版本，CVSS 评分为 7.5（高危），攻击条件宽松，无需用户交互即可远程利用。"
published = "2001-01-09T05:00:00.000"
remediation = '立即升级 AOL Instant Messenger 至 4.3.2229 或更高版本，该版本修复了 aim:// URI 协议处理中的缓冲区溢出问题。如无法立即升级，可在网络边界防火墙处拦截包含 "aim://" 协议的出站流量，阻止攻击向量。'
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "AOL Instant Messenger aim:// 协议缓冲区溢出漏洞"
updated = "2026-06-16T21:53:07.890"

