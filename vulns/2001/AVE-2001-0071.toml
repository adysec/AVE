[basic]
description = "WU-FTPD 2.6.1 及更早版本（含 2.4.2、2.5、2.6）在开启调试模式（debug mode）运行时存在格式字符串漏洞。未经身份认证的远程攻击者可通过向 FTP 服务发送包含格式字符串特制参数的请求，该参数会被记录在 PASV 被动模式端口分配信息中，从而触发格式字符串漏洞，最终可导致在目标服务器上执行任意命令。该漏洞影响使用受影响版本 WU-FTPD 且启用了调试模式的所有系统，攻击者无需任何凭据即可远程利用，危害等级极为严重，CVSS 评分为 10.0。"
published = "2001-03-26T05:00:00Z"
remediation = '升级 WU-FTPD 至 2.6.2 或更高版本，该版本已修复调试模式下的格式字符串漏洞。具体操作：从 ftp.wu-ftpd.org 下载 2.6.2 版本源码，编译安装前应用 missing_format_strings.patch 补丁。如暂无法升级，应在 /etc/ftpaccess 配置文件中设置 "debug off" 关闭调试模式，或通过防火墙限制 FTP 端口对外访问作为临时缓解措施。建议迁移至 vsftpd 或 proftpd 等仍在积极维护的 FTP 服务。'
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "WU-FTPD FTP服务器 调试模式客户端主机名格式字符串漏洞"
updated = "2026-06-16T21:53:50Z"

