[info]
author = "ave"
description = "检测目标是否为 Windows 系统，通过发送 HTTP GET 请求并检查响应体中是否包含 Windows 标识信息，辅助确认目标是否运行受影响版本的 Windows 操作系统。"
id = "POC-AVE-2025-0779"
name = "CVE-2025-21320 Windows Kernel Memory Information Disclosure PoC"
severity = "medium"
tags = ["ave-2025-0779"]
vuln_id = [
    "CVE-2025-21320",
    "AVE-2025-0779",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[[poc.requests.matchers]]
case_insensitive = true
expect = true
part = "body"
type = "word"
words = ["windows"]
