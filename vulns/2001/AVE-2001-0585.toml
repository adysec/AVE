[basic]
description = "Lexmark MarkVision 打印机驱动程序中存在多个缓冲区溢出漏洞。本地攻击者可通过向 cat_network、cat_parallel 和 cat_serial 命令传递超长参数触发缓冲区溢出，从而获取系统特权提升。该漏洞影响运行 Lexmark MarkVision 驱动程序的 Windows 系统，攻击者需具有本地访问权限，CVSS 评分 7.2，危害等级高。"
published = "2001-02-16T05:00:00Z"
remediation = "立即移除 MarkVision 驱动程序文件（cat_network、cat_parallel、cat_serial）的 setuid/setgid 权限：`chmod u-s /path/to/cat_network /path/to/cat_parallel /path/to/cat_serial`。如不需要打印机管理功能，直接卸载 Lexmark MarkVision 软件包。若必须使用，限制可执行文件的属主为 root 且仅允许管理员组执行：`chown root:admin /path/to/* && chmod 750 /path/to/*`，并对所有命令行参数做长度校验。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Lexmark MarkVision 打印机驱动缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:53:33Z"

