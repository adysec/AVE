[basic]
description = "Google Chrome 的 Mojo 组件中存在不当实现漏洞，攻击者可通过构造特制的 HTML 页面诱导用户访问，从而绕过站点隔离机制（Site Isolation），导致攻击者能够访问其他站点的敏感数据或执行未授权操作。该漏洞影响 Android、Linux 及 ChromeOS 平台上 Chrome 140.0.7339.127 之前版本，CVSS 评分 8.8，危害等级高危。Google 已在 Chrome 140.0.7339.127 版本中修复此漏洞。"
published = "2025-09-10T19:15:40Z"
remediation = "立即将 Google Chrome 升级至 140.0.7339.127 及以上版本（Chrome 菜单 > 帮助 > 关于 Google Chrome 自动检查更新）。Linux 发行版用户通过包管理器更新：Debian/Ubuntu 执行 `apt update && apt upgrade chromium-browser`，Fedora 执行 `dnf update chromium` 至 140.0.7339.207。Android 用户通过 Google Play 商店更新 Chrome。无法立即升级时，可在浏览器设置中启用「严格站点隔离」（chrome://flags/#strict-site-isolation）作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome Mojo 站点隔离绕过漏洞"
updated = "2026-06-17T08:27:53Z"

