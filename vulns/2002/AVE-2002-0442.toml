[basic]
description = "Critical Path InJoin Directory Server 4.0 的 iCon 管理 Web 服务器存在文件泄漏漏洞。已通过身份验证的 inJoin 管理员可通过向 LOG 参数中指定目标文件路径，读取服务器上的任意文件，导致敏感信息泄露。攻击者需拥有有效管理员凭据方可利用，CVSS 评分 5.0，危害等级中等。目前已有公开 PoC 利用代码。"
published = "2002-08-12T04:00:00Z"
remediation = "该产品（Critical Path InJoin Directory Server 4.0）已停止维护，建议立即迁移至受支持的目录服务器产品（如 Microsoft Active Directory 或 OpenLDAP）。若无法立即迁移，应通过防火墙或反向代理严格限制 iCon 管理 Web 服务器的访问来源 IP，仅允许受信任的管理员 IP 段访问管理端口，并禁用 LOG 参数中的路径遍历能力。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Critical Path InJoin Directory Server 文件读取漏洞"
updated = "2026-06-16T21:58:07Z"

