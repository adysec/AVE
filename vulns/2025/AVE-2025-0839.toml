[basic]
description = "Windows 轻量级目录访问协议（LDAP）存在堆缓冲区溢出漏洞，源于整数下溢（CWE-191）及竞争条件（CWE-362）缺陷。未经身份认证的远程攻击者可通过向目标系统的 LDAP 服务发送特制数据包触发堆溢出，导致远程代码执行。该漏洞影响 Windows 10/11 全版本及 Windows Server 2008/2012/2016/2019/2022/2025 等广泛版本，CVSS 评分 8.1，危害等级高。攻击复杂度较高但无需用户交互，成功利用可完全控制目标系统。Microsoft 已在 2025 年 2 月安全更新（KB5051974）中修复此漏洞。"
published = "2025-02-11T18:15:36Z"
remediation = "建议立即安装 Microsoft 2025 年 2 月安全更新 KB5051974，该更新修复了 Windows LDAP 远程代码执行漏洞。可通过 Windows Update 自动更新或从 Microsoft 更新目录手动下载安装。如无法立即打补丁，可在域控防火墙限制对 LDAP 服务（389/TCP、636/TCP）的未授权访问，并启用 LDAP 签名/通道绑定作为临时缓解措施。"
score = 8.1
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows LDAP 远程代码执行漏洞"
updated = "2026-06-17T08:43:13Z"

