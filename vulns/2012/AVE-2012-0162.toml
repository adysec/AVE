[basic]
description = "RealNetworks RealPlayer 中的 ATRAC 音频编解码器在解码音频样本时存在代码注入漏洞，未能正确验证特制 ATRAC 音频文件中的样本数据。远程攻击者可诱导用户打开恶意构造的 ATRAC 音频文件触发该漏洞，导致任意代码执行。该漏洞影响 RealPlayer 11.x、14.x 至 14.0.7、RealPlayer SP 1.0 至 1.1.5 及 Mac RealPlayer 12.x 至 12.0.0.1703 版本，CVSS 评分 9.3，危害等级严重。厂商已发布 RealPlayer 15.0.2.72 版本修复此漏洞。"
published = "2012-02-08T15:55:01.047"
remediation = "升级 RealPlayer 至 15.0.2.72 及以上版本（Windows）或 12.0.0.1703 及以上版本（Mac），该版本修复了 ATRAC 编解码器样本解码中的远程代码执行漏洞。如无法立即升级，建议在浏览器中禁用 RealPlayer 插件，并避免打开来源不明的媒体文件。对于企业环境，可通过组策略禁用 RealPlayer 对 ATRAC 格式文件的关联处理作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer ATRAC音频解码远程代码执行漏洞"
updated = "2026-06-16T23:38:31.447"

