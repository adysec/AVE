[basic]
description = "NAI Sniffer Agent 存在权限提升漏洞。该漏洞原理在于其初始 UDP 身份验证过程缺乏足够的加密或校验机制，远程攻击者可通过在网络中嗅探初始 UDP 认证数据包，截获认证信息后伪造合法命令发送给 Agent。在攻击者能够监听相关网络流量的条件下，可利用此漏洞在目标 Agent 上获取高权限，从而导致系统被非法控制或敏感数据泄露。"
published = "2001-01-09T05:00:00Z"
remediation = "停止使用 NAI Sniffer Agent 软件。若必须运行，请将该 Agent 部署在隔离的受信网络中，并配置防火墙仅允许特定可信 IP 通过 UDP 端口访问，以防止外部攻击者嗅探认证包并伪造命令。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "NAI Sniffer Agent 权限提升漏洞"
updated = "2026-06-16T21:53:17Z"

