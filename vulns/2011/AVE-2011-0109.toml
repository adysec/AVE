[basic]
description = "Adobe Flash Player 在处理特定 SWF 文件时存在堆破坏漏洞（CWE-119）。攻击者可通过诱导用户访问恶意网页或打开特制的 Flash 文件，触发堆内存损坏，导致任意代码执行或拒绝服务。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上的 Flash Player 10.3.183.11 之前版本和 11.x 系列 11.1.102.55 之前版本，以及 Adobe AIR 3.1.0.4880 之前版本。攻击无需身份认证，远程即可利用，CVSS 评分 10.0，危害等级严重。Adobe 已发布安全更新修复此漏洞。"
published = "2011-11-11T16:55:01Z"
remediation = "升级 Adobe Flash Player 至 10.3.183.11 及以上版本（Windows/Mac/Linux/Solaris）或 11.1.102.55 及以上版本（11.x 分支），Android 版升级至 11.1.102.59 及以上版本；Adobe AIR 升级至 3.1.0.4880 及以上版本。由于 Adobe Flash Player 已于 2020 年底停止支持并存在大量已知漏洞，建议彻底卸载 Flash Player 并移除所有浏览器插件，迁移至 HTML5 技术方案。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 堆破坏远程代码执行漏洞"
updated = "2026-06-16T23:31:21Z"

