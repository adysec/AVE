[info]
author = "AVE"
description = "检测目标 Solaris 系统上是否存在易受攻击的 Raptor GFX PGX32 配置工具 pgxconfig。该 setuid 二进制文件通过 system(3s) 调用执行外部命令时依赖 PATH 环境变量，本地攻击者可创建恶意同名程序劫持执行流程获取 root 权限"
id = "POC-AVE-2000-0543"
name = "Tech-Source Raptor GFX PGX32 pgxconfig Local Privilege Escalation PoC"
severity = "high"
tags = ["cve-2000-0695"]
vuln_id = [
    "CVE-2000-0695",
    "AVE-2000-0543",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/usr/sbin/pgxconfig"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [""]
