[basic]
description = "该漏洞源于 QNAP Photo Station 中 video.php 文件存在不当访问控制缺陷，攻击者无需身份认证即可通过构造恶意请求绕过访问限制机制，从而获得对目标系统的未授权访问权限。成功利用该漏洞可导致攻击者获取系统管理员权限，进而读取敏感数据、上传恶意文件或执行任意命令。该漏洞影响运行 Photo Station 的 QNAP NAS 设备，CVSS v3.1 评分为 9.8，危害等级为严重。攻击者只需通过网络向目标设备的 Photo Station 服务发送特制 HTTP 请求即可触发漏洞，无需用户交互或特殊权限。QNAP 官方已发布安全更新，建议用户尽快将 Photo Station 升级至最新版本以修复该漏洞。"
published = "2019-12-05T17:15:12Z"
remediation = "请立即登录 QNAP NAS 管理界面，将 QTS 固件升级至最新版本，并将 Photo Station 应用升级至对应修复版本：QTS 4.4.1 用户需将 Photo Station 升级至 6.0.3 或更高版本，QTS 4.3.4–4.4.0 用户需升级至 5.7.10 或更高版本，QTS 4.3.0–4.3.3 用户需升级至 5.4.9 或更高版本，QTS 4.2.6 用户需升级至 5.2.11 或更高版本。升级方式为登录 QTS 管理员账户，进入「控制面板」>「系统」>「固件更新」检查并安装最新 QTS 更新，然后打开 App Center 搜索 Photo Station 并点击更新。若无法立即升级，建议在防火墙中限制 Photo Station 的互联网访问，仅允许可信网络内的用户使用该服务作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "QNAP Photo Station 远程代码执行漏洞"
