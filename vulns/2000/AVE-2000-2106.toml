[basic]
description = "NAI Sniffer Agent 存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过发送包含超长 SNMP community name 的 SNMP 请求触发缓冲区溢出，从而在目标系统上执行任意命令。该漏洞影响运行 NAI Sniffer Agent 的系统，CVSS 评分为 10，危害等级极高。由于攻击无需认证且利用门槛低，攻击者可远程完全控制受影响主机。"
published = "2001-01-09T05:00:00Z"
remediation = "安装 Network Associates（McAfee）针对 Sniffer Agent 发布的官方安全补丁，具体版本参照其安全公告 VU#3163（可在 cert.org 获取），该补丁修复了 SNMP 共同体名（community name）字段的边界检查，防止长名称导致堆栈溢出。若因业务暂无法升级，应临时禁用 Sniffer Agent 中对 SNMP 非必要的监听服务，或在防火墙层限制仅允许受信管理主机访问 SNMP 端口（UDP/161）。此外建议将 Sniffer Agent 升级至 McAfee Network Security Platform（原 IntruShield）替代老版本，并确保 SNMP 社区名设置长度不超过合理范围（建议不超过 15 个字符）作为纵深防御措施。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "NAI Sniffer Agent SNMP 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:16Z"

