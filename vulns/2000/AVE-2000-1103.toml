[basic]
description = "Debian GNU/Linux 系统中的 elvis-tiny 文本编辑器（1.4-10 版本之前）存在符号链接（symlink）文件覆盖漏洞。本地用户可通过创建指向其他用户文件的符号链接，诱使 elvis-tiny 将临时文件写入目标文件路径，从而覆盖或篡改其他用户的文件内容。该漏洞影响 Debian GNU/Linux 及其他 Linux 发行版系统，攻击者只需具备本地登录权限即可在低复杂度条件下完成利用，无需额外身份认证，可对文件机密性、完整性和可用性造成部分破坏。Debian 已在后续版本中修复此漏洞，建议将 elvis-tiny 升级至 1.4-10 或更高版本。"
published = "2001-01-09T05:00:00Z"
remediation = "立即升级 elvis-tiny 软件包至 1.4-10 或更高版本。Debian GNU/Linux 用户可通过 apt-get update && apt-get install elvis-tiny 获取修复版本，或从 Debian 安全更新仓库 (security.debian.org) 手动下载 elvis-tiny_1.4-10_i386.deb 并执行 dpkg -i 安装。该漏洞源于程序创建临时文件时未使用 O_EXCL 标志，导致本地用户可通过符号链接攻击覆盖其他用户的文件，升级后版本已修复临时文件创建逻辑。如暂时无法升级，可通过文件系统权限限制（设置 /tmp 目录 sticky bit 并严格管控写权限）作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Debian elvis-tiny 符号链接文件覆盖漏洞"
updated = "2026-06-16T21:53:13Z"

