[basic]
description = "tags.<value>Fake Identd 0.9 至 1.4 版本存在远程缓冲区溢出漏洞。该漏洞源于软件在处理客户端查询请求时未对输入长度进行充分边界检查，攻击者可通过发送超长请求数据并分割为多个数据包的方式触发栈缓冲区溢出。由于该服务通常以 root 权限运行，成功利用该漏洞可导致远程攻击者在目标系统上执行任意代码，完全控制受影响的 Linux/Unix 主机。攻击者无需身份认证即可从网络远程发起攻击，利用条件简单，危害极为严重。"
published = "2002-12-31T05:00:00Z"
remediation = "建议立即停止使用并卸载 Fake Identd 0.9 至 1.4 版本，因为该软件已停止维护。若无法立即卸载，请在网络防火墙上禁用或严格限制对 113 端口的外部访问，以防止远程攻击者利用缓冲区溢出漏洞执行代码。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Fake Identd 客户端查询远程缓冲区溢出漏洞"
updated = "2026-06-16T21:59:59Z"

