[basic]
description = "Apple QuickTime 在处理 MPEG 编码影片文件时存在缓冲区溢出漏洞，由于程序对特制 MPEG 影片文件中的畸形数据缺乏正确的边界检查，导致堆缓冲区溢出。远程攻击者可通过诱导用户打开恶意构造的 MPEG 影片文件触发该漏洞，成功利用可导致应用程序崩溃或任意代码执行。该漏洞影响 Mac OS X 10.6.x 至 10.6.4 版本及 QuickTime 7.6.9 之前版本，攻击无需身份认证但需要用户交互，CVSS 评分 6.8，危害等级中危。"
published = "2010-11-16T22:00:16Z"
remediation = "升级 Apple QuickTime 至 7.6.9 或更高版本，Mac OS X 用户应安装 2010-006 安全更新升级至 10.6.5。如无法立即升级，建议禁用浏览器 QuickTime 插件解析 MPEG 文件，并避免打开来源不明的媒体文件。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Mac OS X QuickTime MPEG编码影片文件缓冲区溢出漏洞"
updated = "2026-06-16T23:23:32Z"

