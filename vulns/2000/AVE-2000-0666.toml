[basic]
description = "OpenBSD 2.6 及更早版本存在 ARP 协议处理缺陷，远程攻击者无需身份认证即可通过向目标服务器大量发送 ARP 请求发起洪水攻击，导致系统资源耗尽并拒绝服务。该漏洞影响运行 OpenBSD 2.6 及之前版本的操作系统，CVSS 评分为 5，危害等级为中等。攻击条件仅为网络可达即可利用，无需任何特权或用户交互。"
published = "2000-12-19T05:00:00.000"
remediation = "立即将 OpenBSD 升级至 2.7 或更高版本，该版本已修复 ARP 请求洪水攻击的防御缺陷。如无法立即升级，可在网络边界路由器上启用 ARP 速率限制（arp-rate-limit），将每秒 ARP 请求数阈值调低以缓解洪水攻击的影响。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "OpenBSD ARP Flooding 拒绝服务漏洞"
updated = "2026-06-16T21:52:45.303"

