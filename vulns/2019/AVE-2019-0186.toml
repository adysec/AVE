[basic]
description = "CVE-2019-6799是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2019-01-26T17:29:00Z"
remediation = "将 phpMyAdmin 升级至 4.8.5 或更高版本，同时确保配置文件中 $cfg['AllowArbitraryServer'] 设置为 false（默认值），并在 PHP 配置中设置 mysql.allow_local_infile = Off 以禁用本地文件加载功能，阻止攻击者通过恶意 MySQL 服务器读取服务器上的任意文件。如暂无法升级，建议在防火墙或反向代理层限制对 phpMyAdmin 的访问来源。"
score = 5.9
severity = "MEDIUM"
sources = ["nuclei"]
title = "phpMyAdmin phpMyAdmin 信息泄露漏洞"
