[basic]
description = "Veritas Backup Agent for Linux 存在拒绝服务漏洞，远程攻击者无需任何身份验证即可向目标系统建立 TCP 连接后不发送任何数据，导致备份代理进程陷入挂起状态，无法正常提供服务。该漏洞影响运行 Symantec Veritas Backup 4.5 Service 的 Linux 系统，攻击者可通过持续建立此类空连接消耗系统资源，使合法用户的备份与恢复操作无法执行，造成业务中断。攻击条件简单，仅需目标系统开放备份服务端口且攻击者能够网络访问，利用方式为直接建立 TCP 连接后保持空闲，即可触发进程阻塞，实现无需复杂权限的提升即可造成可用性破坏。"
published = "2001-03-12T05:00:00.000"
remediation = "建议将受影响的 Veritas Backup Exec 4.5 升级至当前受支持的 Veritas Backup Exec 21.x 或更高版本，或迁移至 Veritas NetBackup 8.x 及以上版本以彻底消除该漏洞。若暂无法升级，应在 Linux 主机防火墙（如 iptables）中配置规则，仅允许受信任的管理服务器 IP 访问 TCP 端口 8192（Veritas Backup agent 默认端口），拒绝所有其他来源的连接请求；同时可在 /etc/hosts.deny 中配置限制，或通过 xinetd 设置连接速率限制。若系统不需要 Linux 备份代理服务，可直接停用 Veritas Backup agent 进程作为临时缓解措施，并持续监控目标主机端口 8192 的异常连接行为。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Symantec Veritas Backup Agent 拒绝服务漏洞"
updated = "2026-06-16T21:53:40.120"

