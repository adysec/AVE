[basic]
description = "Oracle 8.1.5（Oracle 8i）中的多个应用程序组件（包括 names、namesctl、onrsd、osslogin、tnslsnr、tnsping、trcasst、trcroute）存在缓冲区溢出漏洞。本地攻击者可通过向 ORACLE_HOME 环境变量传递超长字符串触发缓冲区溢出，成功利用后可获取目标系统的提升权限，导致机密性、完整性和可用性部分受损。该漏洞需要本地访问权限，攻击复杂度较低。"
published = "2000-12-19T05:00:00Z"
remediation = "立即升级 Oracle 数据库至受支持的版本（如 19c 或更高版本），Oracle 8.1.5 已停止技术支持多年，不再提供安全补丁。如无法升级，作为临时缓解措施，限制本地用户对 Oracle 相关二进制文件（names、tnslsnr 等）的执行权限，并通过系统级环境变量白名单机制防止 ORACLE_HOME 被传入超长字符串。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Oracle 8.1.5 缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:52:54Z"

