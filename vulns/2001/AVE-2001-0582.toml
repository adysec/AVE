[basic]
description = "KTH Kerberos IV 存在权限提升漏洞。本地攻击者可通过设置 KRBCONFDIR 环境变量指定替代配置目录，从而修改以高权限运行的 Kerberos 服务器配置，进而获取额外系统权限。该漏洞影响 KTH Kerberos IV 版本，攻击者需具备本地访问权限，无需身份认证即可利用，CVSS 评分 7.2，危害等级高。"
published = "2001-02-16T05:00:00Z"
remediation = "升级到支持 KRBCONFDIR 环境变量验证的最新 KTH Kerberos 5 版本，并通过 PAM 或系统安全策略禁止普通用户设置此环境变量，同时强制使用绝对路径验证 Kerberos 配置目录来防止配置篡改。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "KTH Kerberos IV 环境变量本地权限提升漏洞"
updated = "2026-06-16T21:53:31Z"

