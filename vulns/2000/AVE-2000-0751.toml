[basic]
description = "NetZero ZeroPort 3.0 及更早版本使用弱加密方法存储用户登录凭据，本地攻击者可利用该漏洞解密存储的密码信息。该漏洞源于软件对用户凭证的加密强度不足，采用可逆或易破解的加密算法，导致具有本地系统访问权限的攻击者能够获取明文密码。攻击者一旦成功解密，可进一步利用获取的凭证进行横向移动或权限提升。该漏洞影响 NetZero ZeroPort 3.0 及所有更早版本，CVSS 评分 4.6，危害等级中危。建议用户升级到修复此漏洞的更新版本。"
published = "2000-07-18T04:00:00Z"
remediation = "立即升级 NetZero ZeroPort 至 3.0 以上版本（如 3.1 或更高），该版本已改用强加密算法存储用户登录凭据。由于 NetZero 拨号服务已停止运营，建议彻底卸载 NetZero ZeroPort 软件，改用其他现代宽带 ISP 客户端，避免本地弱加密密码泄露风险。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "NetZero ZeroPort 3.0 用户登录信息弱加密存储漏洞"
updated = "2026-06-16T21:52:08Z"

