[basic]
description = 'tags.<value>PALS Library System WebPALS 1.0 的 pals-cgi 程序存在目录遍历漏洞。远程攻击者无需身份认证，通过在 documentName 参数中插入 ".."（点号）序列，可绕过目录限制读取服务器上的任意文件。该漏洞影响使用 WebPALS 1.0 的图书馆系统，攻击者可利用此漏洞获取系统配置文件、源代码或其他敏感信息。CVSS 评分为 5.0，危害等级中等。'
published = "2001-06-02T04:00:00.000"
remediation = '由于该软件版本过于陈旧且厂商已停止维护，建议立即迁移至现代化的库管理系统。若必须继续使用，请在 Web 应用防火墙 (WAF) 或服务器配置中增加过滤规则，拦截所有包含 "../" 或 "%2e%2e/" 的请求，以阻断目录遍历攻击。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "PALS Library System WebPALS 1.0 pals-cgi 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:53:54.110"

