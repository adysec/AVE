[basic]
description = "SagePay Server Gateway for WooCommerce WordPress 插件 1.0.9 之前版本中的 includes/pages/redirect.php 页面存在反射型跨站脚本(XSS)漏洞。攻击者无需身份认证即可通过构造恶意的 page 参数注入任意 JavaScript 代码，当管理员或其他用户访问特制链接时，恶意脚本将在浏览器中执行，导致敏感信息泄露、会话劫持或钓鱼攻击。该漏洞利用条件简单，仅需诱使用户点击恶意链接即可触发。"
published = "2018-01-09T22:29:00.257"
remediation = "立即将 SagePay Server Gateway for WooCommerce 插件升级至 1.0.9 或更高版本。如无法立即升级，可在 WordPress 管理后台禁用该插件，或通过 Web 应用防火墙（WAF）规则拦截包含恶意 page 参数的请求以缓解 XSS 风险。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress SagePay Server Gateway for WooCommerce 插件跨站脚本漏洞"
updated = "2026-06-17T02:00:07.230"

