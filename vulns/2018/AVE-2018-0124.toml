[basic]
description = "Snap Creek Duplicator WordPress 插件 1.2.42 之前版本存在 PHP 代码注入漏洞。该插件在安装过程中会遗留 installer.php 和 installer-backup.php 等安装文件，远程未认证攻击者可通过直接访问这些残留的安装文件，在数据库配置步骤中向 wp-config.php 注入恶意 PHP 代码，从而实现任意代码执行。攻击无需任何身份验证，利用门槛极低，可完全控制目标站点。CVSS 评分 9.8，危害等级严重。"
published = "2018-09-19T16:29:01Z"
remediation = "立即升级 Snap Creek Duplicator 插件至 1.2.42 或更高版本。作为临时缓解措施，手动删除服务器上残留的 installer.php 和 installer-backup.php 文件，并检查 wp-config.php 中是否存在恶意 PHP 代码。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Snap Creek Duplicator PHP代码注入漏洞"
updated = "2026-06-17T01:45:32Z"

