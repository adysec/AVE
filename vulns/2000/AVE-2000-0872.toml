[basic]
description = "MandrakeUpdate 工具存在竞争条件漏洞，本地用户可在 RPM 软件包文件被保存至 /tmp 临时目录后、执行安装操作前的短暂时间窗口内，通过竞争文件句柄的方式篡改 RPM 文件内容。该漏洞源于 MandrakeUpdate 未对临时目录中的待安装 RPM 文件实施原子性保护或完整性校验机制。受影响系统为使用 MandrakeUpdate 进行软件包更新的 Mandrake Linux 发行版，攻击者需具备本地用户访问权限并精确利用文件操作时序。成功利用可导致安装的 RPM 软件包内容被恶意篡改，进而危及系统软件包完整性与安全性。"
published = "2000-10-20T04:00:00Z"
remediation = '安装 Mandrake Linux 安全公告 MDKSA-2000:034 发布的 MandrakeUpdate 修复更新包。受影响的 Mandrake Linux 6.0、6.1、7.0 和 7.1 用户可通过 MandrakeUpdate 工具自动获取更新，亦可手动从官方 FTP 更新服务器下载修复后的 MandrakeUpdate RPM 包后执行 "rpm -Uvh mandrakeupdate-<version>.rpm" 进行升级。如暂时无法立即打补丁，可将 /tmp 目录挂载为 noexec 以减少攻击窗口，并配置定期自动清理 /tmp 中滞留文件，同时限制本地用户对 /tmp 的写权限以降低文件被篡改的风险。鉴于受影响版本均已终止支持，建议评估迁移至受支持的 Linux 发行版。'
score = 1.2
severity = "LOW"
sources = ["avd"]
title = "Mandrake Linux MandrakeUpdate 竞争条件文件篡改漏洞"
updated = "2026-06-16T21:52:20Z"

