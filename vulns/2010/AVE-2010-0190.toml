[basic]
description = "OpenOffice.org Impress 模块 simpress.bin 存在整数溢出漏洞，攻击者可构造包含恶意多边形的 PowerPoint 文档，触发堆缓冲区溢出，导致应用程序崩溃（拒绝服务）或远程执行任意代码。该漏洞影响 OpenOffice.org 2.x 及 3.x 版本（3.3 之前），CVSS 评分 9.3（严重），攻击向量为网络，需用户打开恶意文档才能触发。Apache OpenOffice 3.3 版本已修复此漏洞，建议升级至 3.3 或更高版本。"
published = "2010-08-25T20:00:17Z"
remediation = "升级至 OpenOffice.org 3.3 或更高版本。该漏洞在 3.3 版本中已修复。如无法立即升级，应避免打开来自不可信来源的 PowerPoint 文档，并在邮件网关层面拦截可疑的 .ppt 附件作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apache OpenOffice Impress PowerPoint 多边形解析整数溢出远程代码执行漏洞"
updated = "2026-06-16T23:21:47Z"

