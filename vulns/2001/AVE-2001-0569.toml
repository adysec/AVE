[basic]
description = "PHP-Nuke 4.4 的 cookiedecode 函数存在安全绕过漏洞，该函数在处理用户认证 cookie 时未对加密内容进行充分的解密与完整性校验，导致未经身份认证的远程攻击者可以通过提取并解析目标浏览器 cookie 中保存的认证信息，伪造合法用户身份令牌绕过身份验证机制，从而非法访问其他用户账户。该漏洞影响 PHP-Nuke 4.4 版本，CVSS 评分 7.5，危害等级为高危。攻击者无需任何身份凭证即可在网络中发起攻击，成功利用后可获取其他用户的账户权限，造成敏感信息泄露或数据篡改。"
published = "2001-06-02T04:00:00Z"
remediation = "立即升级 PHP-Nuke 至 4.4 之后已修复该漏洞的版本，或应用官方发布的 cookiedecode 函数安全补丁，修改 auth.inc.php 中 cookie 解码逻辑以增加加密校验机制，防止攻击者通过伪造 cookie 绕过认证。如无法立即升级，可在 Web 服务器层面添加规则拦截包含异常编码内容的 Cookie 请求，并强制用户重新登录以重置会话状态。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "PHP-Nuke 认证绕过漏洞"
updated = "2026-06-16T21:53:27Z"

