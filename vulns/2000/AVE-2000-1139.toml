[basic]
description = "Linux netkit 套件中的 telnetd 守护进程在启用 -L 命令行选项运行时存在认证绕过漏洞。远程攻击者无需任何身份认证，通过特制的 telnet 会话即可绕过登录验证直接访问目标系统，导致机密性、完整性和可用性部分受损。该漏洞影响 netkit-telnet-0.16 之前的所有版本，CVSS 评分 7.5，危害等级高。"
published = "2001-08-31T04:00:00Z"
remediation = "升级 netkit-telnet 至 0.16 或更高版本。如使用 Caldera OpenLinux，安装 CSSA-2000-008 安全更新。若无法升级，建议禁用 telnetd 的 -L 选项或直接禁用 telnet 服务，改用 SSH。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Linux Netkit telnetd 认证绕过漏洞"
updated = "2026-06-16T21:53:21Z"

