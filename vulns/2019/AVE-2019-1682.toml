[basic]
description = 'ThinkPHP 3.2.4 之前版本存在访问控制错误漏洞，攻击者可通过构造特制的 HTTP 请求，利用 `public//?s=index/\think\app/invokefunction` 路由绕过权限检查，直接调用 `call_user_func_array` 函数执行任意系统命令。该漏洞影响使用 ThinkPHP 框架的 Open Source BMS v1.1.1 等应用，攻击者无需身份认证即可远程利用，CVSS 评分 8.8，危害等级高。'
published = "2019-02-24T18:29:00Z"
remediation = '升级 ThinkPHP 至 3.2.4 或更高版本，该版本修复了 /think/app/invokefunction 路由的访问控制缺陷。如无法立即升级，可在应用入口处拦截包含 think\app/invokefunction 的请求路径。'
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "ThinkPHP 远程命令执行漏洞"
updated = "2026-06-17T02:43:02Z"

