[basic]
description = "Microsoft Office Visio 在处理 OLE 对象时存在 DLL 侧加载漏洞。攻击者可通过诱使用户打开特制的 Office 文件，利用 Visio 加载恶意 DLL 的方式实现本地权限提升。该漏洞影响 Visio 2007 SP3、Visio 2010 SP2、Visio 2013 SP1、Visio 2016 及 Visio Viewer 2007 SP3/2010 等多个版本。攻击需要用户交互（如打开恶意文件），成功利用后可获取与当前用户相同的系统权限，进而执行任意代码。Microsoft 已在安全更新 MS16-070 中修复此漏洞。"
published = "2016-06-16T01:59:36.983"
remediation = "安装 Microsoft 2016 年 6 月安全更新 MS16-070 (KB3115262)，该更新修复了 Visio 加载库时的 DLL 侧加载漏洞。受影响版本包括 Visio 2007 SP3、2010 SP2、2013 SP1、2016 及 Visio Viewer 2007/2010。如无法立即打补丁，可配置 Web 应用程序的 LoadLibrary 安全搜索模式，或限制用户以管理员权限运行 Office 应用作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Visio OLE DLL 侧加载权限提升漏洞"
updated = "2026-06-17T00:45:20.667"

