[basic]
description = "WordPress bws-smtp 插件（1.1.0 之前版本）存在多个跨站脚本漏洞（CWE-79）。该插件未能对用户输入进行充分过滤和转义，攻击者可构造恶意请求，在受影响的 WordPress 站点中注入恶意 JavaScript 代码。当其他用户（包括管理员）访问被污染的页面时，恶意脚本将在其浏览器上下文中执行，可导致会话劫持、Cookie 窃取、页面内容篡改或重定向至恶意网站。该漏洞无需认证即可触发（AV:N/AC:L/PR:N），但需要用户交互（UI:R），CVSS 评分 6.1，属于中危漏洞。受影响站点应立即升级 bws-smtp 插件至 1.1.0 或更高版本。"
published = "2019-08-20T16:15:11Z"
remediation = "将 WordPress bws-smtp 插件升级至 1.1.0 或更高版本。登录 WordPress 后台，进入「插件」→「已安装插件」，找到 bws-smtp 并点击「更新」，或从 WordPress 插件目录重新下载安装最新版。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress bws-smtp 插件跨站脚本漏洞"
updated = "2026-06-17T01:13:01Z"

