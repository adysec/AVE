[basic]
description = "HP-UX 操作系统的软件分发器 SD-UX 组件在 11.0 及更早版本中存在本地权限提升漏洞。由于 SD-UX 在处理软件包安装或管理操作时未正确验证用户权限或存在不安全的文件权限设置，本地已认证攻击者可通过执行特定的 SD-UX 命令或操作特制的软件包，利用该缺陷将权限从普通用户提升至 root 权限，进而完全控制受影响系统。该漏洞影响 HP-UX 11.0 及更早版本，CVSS 评分 7.2（AV:L/AC:L/Au:N/C:C/I:C/A:C），属于高危本地提权漏洞，攻击者需具备本地账户访问权限才能利用。"
published = "2001-05-03T04:00:00Z"
remediation = "升级 HP-UX 操作系统至 11.0 之后的最新受支持版本，或安装由 HP 官方发布的 SD-UX 组件安全补丁。如无法立即升级，建议通过权限管理工具严格限制非特权用户对 Software Distributor (SD-UX) 相关可执行文件的访问权限，以消除本地权限提升的风险。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "HP HP-UX SD-UX 权限提升漏洞"
updated = "2026-06-16T21:53:59Z"

