[info]
author = "AVE"
description = "检测 Bugzilla 2.14 之前版本中 sanitycheck.cgi 是否存在未授权访问漏洞。该脚本未做权限限制，本地攻击者可大量请求消耗服务器 CPU 资源造成拒绝服务。"
id = "POC-AVE-2001-0532"
name = "Bugzilla sanitycheck.cgi 未授权访问拒绝服务 PoC"
severity = "low"
tags = [
    "cve-2001-1405",
    "bugzilla",
    "dos",
    "sanitycheck",
]
vuln_id = [
    "CVE-2001-1405",
    "AVE-2001-0532",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/sanitycheck.cgi"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "sanitycheck",
    "Bugzilla",
]
