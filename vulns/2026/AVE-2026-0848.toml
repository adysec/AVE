[basic]
description = "Immutable.js 的 Immutable.Map 和 Immutable.Set 数据结构使用 32 位哈希值进行键值存储，当多个键共享相同哈希值时会被放入 HashCollisionNode 碰撞桶中进行线性扫描。由于字符串哈希算法是公开且确定性的（JVM 风格多项式哈希），攻击者可通过控制插入到 Map 中的键（如通过 Immutable.Map(obj)、Immutable.fromJS(obj) 或 state.merge(userObject) 等方式），构造大量哈希碰撞的键，使插入和查找操作从均摊 O(1) 退化为 O(n)，构建或读取整个集合的时间复杂度达到 O(n²)。在单线程运行时环境（如 Node.js）中，少量精心构造的 payload 即可消耗不成比例的 CPU 资源，导致事件循环阻塞，造成拒绝服务。该漏洞影响 Immutable.js 4.x 至 5.1.7 版本，已在 4.3.9 和 5.1.8 版本中修复。"
published = "2026-07-08T16:16:34.517"
remediation = "立即升级 Immutable.js 至 v4.3.9（4.x 分支）或 v5.1.8（5.x 分支）及以上版本，这两个版本已引入带种子的二次哈希算法解决碰撞问题。如无法立即升级，在将不可信用户输入传入 Immutable.Map(obj)、Immutable.fromJS(obj) 或 state.merge(userObject) 前，应限制请求体大小、对象键数量及键长度，并拒绝高基数 payload 以降低攻击面。"
score = 8.7
severity = "HIGH"
sources = ["ghsa"]
title = "Immutable.js Immutable.Map/Set 哈希碰撞算法复杂性拒绝服务漏洞"
updated = "2026-07-10T18:49:51.197"

