[basic]
description = "Windows NT 4.0 Terminal Server 的 RegAPI.DLL 组件中存在缓冲区溢出漏洞。远程未经身份验证的攻击者可以通过在登录过程中发送一个超长的用户名，触发该缓冲区溢出漏洞，从而在目标系统上以高权限执行任意代码。该漏洞影响运行 Terminal Server 服务的 Windows NT 4.0 系统，攻击者可利用此漏洞实现远程代码执行，导致系统完全被接管。"
published = "2001-01-09T05:00:00.000"
remediation = "建议立即为 Windows NT 4.0 安装微软发布的终端服务安全更新补丁。由于该系统已停止支持，强烈建议迁移至现代操作系统。作为临时缓解措施，可通过防火墙限制 TCP 3389 端口的访问，仅允许可信来源连接。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Windows NT Terminal Server 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:15.730"

