[basic]
description = "Windows CSC 服务（Client Side Caching，客户端缓存）中存在堆缓冲区溢出漏洞，该服务负责管理脱机文件同步功能。由于对用户输入的内存分配大小校验不足，低权限攻击者可通过向系统发送特制的请求触发堆缓冲区溢出，成功利用此漏洞可提升至 SYSTEM 权限并执行任意代码。该漏洞攻击复杂度低，无需用户交互，影响 Windows 10/11 及 Windows Server 多个版本。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:16:03Z"
remediation = "安装 Microsoft 2025 年 1 月安全更新（KB5050004），更新 Windows CSC 服务组件至修复版本。受影响系统包括 Windows 10/11 及 Windows Server 多个版本，可通过 Windows Update 或 Microsoft Update Catalog 获取补丁。无法立即更新的系统应限制本地用户登录权限，并监控异常进程提权行为。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows CSC 服务权限提升漏洞"
updated = "2026-06-17T08:43:14Z"

