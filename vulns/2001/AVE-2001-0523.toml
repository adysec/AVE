[basic]
description = "Linux 内核 2.2.19 之前版本中的 UDP 端口分配存在未知漏洞，本地用户可通过特制的 UDP 请求触发内核死锁，导致拒绝服务。该漏洞影响 Linux 2.2.x 系列内核，攻击者需具有本地系统访问权限，无需高权限即可利用。由于 UDP 端口分配逻辑存在缺陷，多个并发 UDP 连接可能导致内核资源竞争，最终引发死锁，系统无法响应正常请求。Linux 社区已在 2.2.19 版本中修复此漏洞。"
published = "2001-04-17T04:00:00Z"
remediation = "升级 Linux 内核至 2.2.19 或更高版本，该版本修复了 UDP 端口分配中的死锁问题。如无法升级内核，可通过限制本地用户对 UDP 端口的访问权限作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Linux kernel UDP 端口分配拒绝服务漏洞"
updated = "2026-06-16T21:56:11Z"

