[basic]
description = "CVE-2000-0719是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2000-10-20T04:00:00Z"
remediation = '立即修改 VariCAD 安装目录下文件和目录的权限，防止本地用户替换程序文件。具体操作：将 /usr/bin/xvcad/ 目录下的 dxfin、igesin、var_rm 等二进制文件权限改为 755（chmod 755 /usr/bin/xvcad/dxfin /usr/bin/xvcad/igesin /usr/bin/xvcad/var_rm），并将 /usr/bin/xvcad/glib/ 和 /usr/lib/xvcad/ 目录及其子目录权限改为 755（find /usr/bin/xvcad/glib/ /usr/lib/xvcad/ -type d -exec chmod 755 {} \; 以及 find /usr/bin/xvcad/glib/ /usr/lib/xvcad/ -type f -exec chmod 755 {} \;）。同时建议升级到 VariCAD 后续版本以彻底修复此权限配置问题。如暂时无法升级，可通过文件完整性监控机制定期校验 VariCAD 程序文件的哈希值，确保未被篡改。'
score = 6.2
severity = "MEDIUM"
sources = ["avd"]
title = "VariCAD VariCAD 文件覆盖漏洞"
updated = "2026-06-16T21:52:20Z"

