[basic]
description = "osCommerce 2.1 版本的 include_once.php 文件存在 PHP 远程文件包含漏洞。由于应用程序对 include_file 参数缺乏有效过滤，未经身份认证的远程攻击者可通过构造恶意外部 URL 并传入该参数，诱使服务器加载并执行远程 PHP 代码，最终导致任意代码执行。该漏洞影响 osCommerce 2.1 所有在线商店实例，CVSS 评分为 7.5，危害等级高。攻击者仅需向目标站点发送包含恶意参数的 HTTP 请求即可利用，无需身份认证或特殊网络条件，可被用于获取服务器权限、窃取客户数据或进一步横向移动。"
published = "2002-12-31T05:00:00Z"
remediation = '建议立即将 osCommerce 从 2.1 升级至 2.1a 或更高版本，官方补丁已对 include_once.php 中的 include_file 参数增加输入验证，禁止加载远程 URL 路径，仅允许包含本地文件。如暂时无法升级，可在 catalog/includes/ 目录下放置 .htaccess 文件，设置 "deny from all" 以阻止外部直接访问该目录下的 PHP 文件，同时将 PHP 配置项 allow_url_include 设置为 Off，作为临时缓解措施防止远程文件包含攻击。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "osCommerce 远程文件包含漏洞"
updated = "2026-06-16T22:00:30Z"

