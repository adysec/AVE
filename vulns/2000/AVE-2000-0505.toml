[basic]
description = "Microsoft Outlook Express 存在持久邮件浏览器链接漏洞（Persistent Mail-Browser Link），远程攻击者可通过向目标用户发送特制电子邮件，利用 JavaScript 在用户浏览器中创建与 Outlook Express 窗口的持久链接，从而监控用户的邮件阅读活动。该漏洞影响 Outlook Express 5 及之前版本，攻击者无需身份认证即可实施攻击，可能导致用户隐私泄露。目前已有公开的利用代码（ExploitDB ID: 19738），建议用户升级至更高版本或禁用脚本执行功能。"
published = "2000-07-20T04:00:00Z"
remediation = '建议立即升级至 Outlook Express 5.5（可通过默认安装 Internet Explorer 5.01 Service Pack 1 或 Internet Explorer 5.5 获得），或安装 MS00-045 安全补丁。如无法升级，可采取以下缓解措施：在 Outlook Express 中禁用预览窗格（查看→布局→取消勾选"显示预览窗格"）；将 HTML 邮件分配到受限站点区域，并在该区域禁用 Active Scripting（Internet Explorer→工具→Internet 选项→安全→受限站点→自定义级别→脚本→Active Scripting→禁用）。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Outlook Express 持续邮件浏览器链接信息泄露漏洞"
updated = "2026-06-16T21:52:11Z"

