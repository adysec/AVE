[basic]
description = 'Palo Alto Networks PAN-OS 的 SAML 认证功能存在签名验证不当漏洞（CWE-347）。当启用 SAML 认证且未勾选"验证身份提供商证书"选项时，PAN-OS 无法正确验证 SAML 断言中的数字签名，导致未经身份认证的远程攻击者可伪造 SAML 响应绕过认证，从而访问受保护的资源。该漏洞影响 PAN-OS 9.1.3 之前版本、9.0.9 之前版本、8.1.15 之前版本及 8.0 全版本（已停服）。在 GlobalProtect 网关/门户、Clientless VPN、Captive Portal 和 Prisma Access 场景下，攻击者可利用该漏洞绕过认证策略获取受保护资源访问权限；在 PAN-OS 和 Panorama Web 管理界面场景下，攻击者可登录为管理员并执行任意管理操作，CVSS 评分 10.0，危害等级严重。Palo Alto Networks 已在 PAN-OS 9.1.3、9.0.9、8.1.15 版本中修复此漏洞。'
published = "2020-06-29T15:15:12.733"
remediation = '立即将 PAN-OS 升级至修复版本：8.1.15、9.0.9、9.1.3 或更高版本。升级前务必在 SAML Identity Provider Server Profile 中配置 Identity Provider Certificate（IdP 证书），并启用 "Validate Identity Provider Certificate" 选项。如 IdP 使用自签名证书无法启用该选项，需更换为 CA 签发的证书。临时缓解措施：禁用 SAML 认证改用其他认证方式，或在防火墙管理接口限制仅允许可信管理网络访问。PAN-OS 8.0 已 EOL，必须升级到受支持版本。升级后建议重启防火墙和 Panorama 以清除所有未授权会话，并通过 `show user ip-user-mapping all type SSO` 检查并清理 Captive Portal 中的异常用户会话。'
score = 10
severity = "CRITICAL"
sources = ["kev"]
title = "Palo Alto Networks PAN-OS SAML 认证签名验证绕过漏洞"
updated = "2026-06-17T03:11:38.983"

