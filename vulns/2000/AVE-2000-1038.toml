[basic]
description = "OpenBSD yp_passwd 程序存在格式字符串漏洞，未经身份认证的本地攻击者可通过向该程序传入包含格式字符串特制名称参数来利用此漏洞，导致在受影响系统上以 root 权限执行任意代码。该漏洞影响 OpenBSD 2.7 及其他基于 BSD 的操作系统，CVSS 评分 7.2，危害等级高。OpenBSD 已于 2000 年 10 月发布安全补丁 028_format_strings.patch 修复此问题。"
published = "2000-12-19T05:00:00.000"
remediation = '建议升级至 OpenBSD 2.7 并应用补丁 patch 028（ftp://ftp.openbsd.org/pub/OpenBSD/patches/2.7/common/028_format_strings.patch），或直接升级至 OpenBSD 2.8 及后续版本，该补丁将 yp_passwd.c 中第 75 行的 warn(name) 修正为 warn("%s", name) 以消除格式字符串漏洞。如短期内无法打补丁，可临时执行 chmod u-s /usr/bin/yp_passwd 移除 setuid 位，阻断本地提权路径；若系统不使用 NIS/YP 服务，建议直接停用或卸载 ypbind 及相关 NIS 客户端服务，从根源消除攻击面。'
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "OpenBSD yp_passwd 格式字符串漏洞"
updated = "2026-06-16T21:52:56.057"

