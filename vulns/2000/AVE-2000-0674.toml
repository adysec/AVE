[basic]
description = "Bytes Interactive Web Shopper 购物车程序 shopper.cgi 2.0 及更早版本存在目录遍历漏洞。远程攻击者无需身份认证即可通过向 newpage 参数提交包含 `../` 的恶意路径，突破 Web 根目录限制，读取服务器上的任意文件（如 /etc/passwd 等敏感文件）。该漏洞利用方式简单，攻击者仅需构造特制 HTTP 请求即可完成利用，可能导致敏感信息泄露。"
published = "2000-12-19T05:00:00Z"
remediation = '由于 Bytes Interactive 已停止维护 Web Shopper，建议立即迁移至受支持的购物车系统（如 Magento、WooCommerce）。若无法立即替换，在 shopper.cgi 中对 newpage 参数实施严格的路径白名单过滤，禁止包含 `../` 或 `..\` 等目录遍历字符，并将 Web 服务器配置为拒绝包含编码后路径遍历模式的请求。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Bytes Interactive Web Shopper 目录遍历漏洞"
updated = "2026-06-16T21:52:46Z"

