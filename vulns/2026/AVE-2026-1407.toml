[basic]
description = "Electron 框架中的 `net.fetch()` 和 `net.request()` 函数在处理 HTTP 重定向时，未对重定向目标协议类型进行限制。远程攻击者可构造恶意服务器，向目标 Electron 应用发起包含重定向的 HTTP 请求，使其跳转至本地资源（如 `file://` 协议），若应用将响应内容返回或转发给用户，则可能导致本地敏感文件内容泄露。该漏洞影响所有使用 Electron 且对外暴露 `net` 网络请求能力的桌面应用，前提是应用会访问攻击者可控制的 URL 并默认跟随重定向。CVSS 评分为 5.9（MEDIUM），CVSS 向量为 AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N，属于 SSRF 类型漏洞（CWE-918）。Electron 官方已在 39.8.8、40.9.0、41.2.1 及 42.0.0-beta.3 版本中修复此问题。建议开发者通过设置 `redirect: 'error'` 或 `redirect: 'manual'` 对不受信任的 URL 禁用自动重定向，并在跟随重定向前验证目标地址。"
published = "2026-08-05T16:17:04Z"
remediation = "建议升级 Electron 至 39.8.8、40.9.0、41.2.1 或 42.0.0-beta.3 或更高版本。如暂无法升级，可在代码中对访问不可信 URL 的 net.fetch() 和 net.request() 请求设置 redirect: 'error' 或 redirect: 'manual' 参数，阻止自动跟随重定向，并在跟随前手动验证重定向目标是否指向本地文件。"
score = 5.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "Electron Electron HTTP重定向本地文件读取漏洞"
updated = "2026-08-06T15:17:26Z"

