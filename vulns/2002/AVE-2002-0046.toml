[basic]
description = 'Sendmail 受限 Shell（SMRSH）存在访问控制绕过漏洞，由于对输入中 "||" 序列和 "/" 字符的过滤机制不完善，攻击者可在符合 smrsh 限制的命令后插入额外命令或路径，绕过其沙箱约束执行未授权程序。该漏洞影响 Sendmail 8.12.6、8.11.6-15 及 1998 年 5 月 19 日之后的多个版本，CVSS 评分 4.6，危害等级低。具备本地访问权限或已通过 Sendmail 服务获得受限 shell 会话的攻击者可利用此漏洞进一步提升权限或执行任意代码。'
published = "2002-10-11T04:00:00Z"
remediation = '立即升级 Sendmail 至 8.12.7 或更高版本（NetBSD 用户升级至 sendmail-8.12.6nb1 或之后版本），该版本已修复 SMRSH 对 "||" 和 "/" 字符的过滤缺陷。升级后重启 sendmail 服务，并检查 /etc/mail/sendmail.cf 中 smrsh 配置是否仍指向受限 shell 路径。若无法立即升级，可临时在 sendmail.cf 中移除 smrsh 的 Path 限制或禁用 SMRSH 功能作为缓解措施。'
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "Sendmail Sendmail SMRSH 双管道命令注入访问验证绕过漏洞"
updated = "2026-06-16T21:58:51Z"

