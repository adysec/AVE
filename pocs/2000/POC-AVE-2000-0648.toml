[info]
author = "ave"
description = "检测目标是否存在Mandrake Linux 6.1/7.0/7.1系统中mod_perl的/apache/perl目录被设置为可浏览的状态。该目录遍历漏洞允许攻击者无需身份验证即可远程列出目录下的文件"
id = "POC-AVE-2000-0648"
name = "Mandrake Linux mod_perl HTTP目录遍历漏洞 PoC"
severity = "medium"
tags = ["ave-2000-0648"]
vuln_id = [
    "CVE-2000-0883",
    "AVE-2000-0648",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/perl/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Directory Listing"]
