[basic]
description = "标签之间。<value>Bajie HTTP JServer 0.78 及 0.80 以下版本存在远程命令注入漏洞。当服务器接收到对不存在 CGI 程序的 HTTP 请求时，未对用户输入进行充分过滤和验证，导致攻击者可在请求参数或路径中嵌入 shell 元字符（如分号、管道符、反引号等），从而在服务器操作系统上执行任意系统命令。该漏洞影响所有使用受影响版本部署 Web 服务的系统，攻击者无需身份认证即可通过网络远程利用，可能造成服务器被完全控制、敏感数据泄露或服务中断。CVSS 评分 7.5，危害等级为高危。"
published = "2001-05-03T04:00:00Z"
remediation = "建议将 Bajie HTTP JServer 升级至 0.80 或更高版本以修复该命令注入漏洞。若厂商已停止维护且无法获取更新版本，建议迁移至 Apache、Nginx 等持续维护的 Web 服务器。作为临时缓解措施，可在前置防火墙或 WAF 中配置规则，拦截 HTTP 请求路径及参数中包含分号、管道符、反引号等 Shell 元字符的请求，阻断潜在命令注入载荷。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Bajie HTTP JServer 任意命令执行漏洞"
updated = "2026-06-16T21:54:04Z"

