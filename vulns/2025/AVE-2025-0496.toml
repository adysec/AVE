[basic]
description = "Google Chrome 的 V8 JavaScript 引擎存在越界内存访问漏洞，源于 V8 对内存边界检查不充分。远程攻击者可通过构造特制的 HTML 页面诱导用户访问，触发越界读取操作，导致敏感信息泄露或内存破坏。该漏洞影响 Google Chrome 141.0.7390.122 之前版本及基于 Chromium 的 Microsoft Edge、Fedora 等衍生软件，CVSS 评分 8.8，危害等级高。用户需升级至 Chrome 142.0.7444.162 或安装对应安全更新以修复此漏洞。"
published = "2025-11-06T23:15:35Z"
remediation = '立即升级 Google Chrome 至 141.0.7390.122 或更高版本（设置→关于 Chrome→检查更新），同时升级 Microsoft Edge 至 142.0.3595.53 或更高版本（设置→关于 Microsoft Edge→检查更新）。Linux 用户（Fedora 43）执行 sudo dnf update chromium 升级至 141.0.7390.122。若暂时无法升级，可在 Chrome 启动参数中添加 --js-flags="--jitless" 禁用 JIT 编译作为临时缓解措施，并避免访问不受信任的网页。'
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 引擎越界内存访问漏洞"
updated = "2026-06-17T08:31:36Z"

