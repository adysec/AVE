[basic]
description = "pgp4pine 是 Pine 邮件客户端的 PGP 加密接口工具，版本 1.75-6 存在加密验证缺陷。该工具在通过 Gnu Privacy Guard（GnuPG）获取公钥进行邮件加密时，未对公钥有效期进行正确校验，导致用户使用已过期的公钥加密邮件时，系统不会触发加密失败提示，而是将邮件内容以明文形式发送。攻击者可通过诱骗目标使用已过期的受控公钥加密邮件，或在公钥过期后继续接收目标发送的未加密邮件，从而窃取敏感通信内容。该漏洞影响使用 pgp4pine 配合 GnuPG 进行邮件加密的用户，攻击条件需满足用户持有已过期的公钥并尝试发送加密邮件，利用方式较为复杂。建议用户升级 pgp4pine 至最新版本并定期更新 GnuPG 密钥环，确保公钥在有效期内使用。"
published = "2001-05-03T04:00:00Z"
remediation = "建议升级 pgp4pine 至 1.75-7 或更高版本以修复密钥过期校验逻辑。若无法升级，应检查 GnuPG 配置确保强制执行密钥有效期验证，或直接迁移至现代支持 PGP 的安全邮件客户端以避免明文传输风险。"
score = 2.6
severity = "LOW"
sources = ["epss"]
title = "PGP4pine 敏感信息泄露漏洞"
updated = "2026-06-16T21:54:00Z"

