[basic]
description = 'Nuxt 是用于 Vue.js 的开源 Web 开发框架。在 3.1.0 至 3.21.10 和 4.5.1 版本中，未经身份验证的远程攻击者可以利用 server island 中的 v-for 指令遍历 prop（如 `v-for="n in count"` 或 `<slot v-for>`），触发无限制的服务端渲染（SSR）内存分配。由于 island URL 的 hash 是请求参数的非密文摘要，攻击者可以计算任意 prop 值的有效 hash，并将迭代次数作为大整数发送。服务器在 SSR 过程中会展开 v-for 到指定次数，分配与攻击者输入数值成正比的内存。通过单个约 130 字节的请求，攻击者即可发送高达 4000 万次迭代的 prop，导致 worker 进程因内存耗尽而崩溃，造成服务拒绝。该漏洞影响所有渲染了包含 v-for 的 island 或 server 组件的 Nuxt 应用。'
published = "2026-08-05T21:16:59Z"
remediation = '建议将 Nuxt 升级到 3.21.10 或 4.5.1 版本以彻底修复此漏洞。若短期内无法升级，应在服务器组件中避免直接对未限制的 prop 使用 v-for，或在模板中手动限制迭代次数（例如 v-for="n in Math.min(count, 1000)"）。此外，可在反向代理层对 /__nuxt_island/ 路径设置合理的请求体大小限制，以缓解数组类型输入导致的无限内存分配风险。'
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Nuxt Nuxt.js 未认证内存耗尽拒绝服务漏洞"
updated = "2026-08-06T14:16:43Z"

