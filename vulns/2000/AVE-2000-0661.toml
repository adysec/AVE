[basic]
description = "More公司CGI脚本cached_feed.cgi存在目录遍历漏洞，攻击者可通过向目标系统发送特制的请求，利用category或format参数中的'..'路径遍历攻击读取系统任意文件，导致敏感信息泄露。该漏洞影响于More.com网站及其相关服务，攻击者无需身份验证即可远程利用，CVSS评分5.0，危害等级中等。"
published = "2000-12-19T05:00:00.000"
remediation = "建议立即升级 Moreover cached_feed.cgi 至 4.July.00 之后的修复版本，或彻底移除该 CGI 脚本。若无法升级，请在 Web 服务器层面（如 Apache mod_rewrite 或 Nginx location 配置）对 category 与 format 参数进行严格路径穿越过滤，拦截包含 `..`、`../` 等路径遍历序列的请求；同时配置 Web 应用防火墙（WAF）规则拦截目录遍历攻击载荷，并限制 CGI 脚本对文件系统的访问权限至最小必要目录。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Moreover cached_feed.cgi 脚本目录遍历文件泄露漏洞"
updated = "2026-06-16T21:52:44.133"

