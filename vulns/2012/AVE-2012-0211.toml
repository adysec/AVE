[basic]
description = "Mozilla Firefox/SeaMonkey/Thunderbird 的 utf16_to_isolatin1 函数中存在堆缓冲区溢出漏洞。当处理特定字符集转换失败时，程序未能正确验证缓冲区边界，导致攻击者可通过构造特制的网页内容触发越界写入。远程攻击者诱导用户访问恶意网页即可利用该漏洞，无需其他前置条件，成功利用可实现任意代码执行。该漏洞影响 Firefox 4.x 至 12.0、Firefox ESR 10.x 低于 10.0.5、Thunderbird 5.0 至 12.0、Thunderbird ESR 10.x 低于 10.0.5 及 SeaMonkey 低于 2.10 版本，CVSS 评分 9.3，危害等级严重。"
published = "2012-06-05T23:55:01.887"
remediation = "升级 Mozilla Firefox 至 13.0 及以上版本，Firefox ESR 升级至 10.0.5 及以上版本；Thunderbird 升级至 13.0 及以上版本，Thunderbird ESR 升级至 10.0.5 及以上版本；SeaMonkey 升级至 2.10 及以上版本。无法立即升级时，禁用 JavaScript 作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 堆缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T23:40:37.633"

