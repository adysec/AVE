[basic]
description = "EServ 2.92 Build 2982 的 SMTP 服务在处理超长 HELO 和 MAIL FROM 命令时存在缓冲区溢出漏洞。远程攻击者无需身份认证即可向目标服务器的 25 端口发送特制的超长 SMTP 命令，触发缓冲区溢出，导致服务进程崩溃（拒绝服务），在特定条件下还可执行任意代码。该漏洞影响 EServ 2.92 及可能更早版本，CVSS 评分 7.5，危害等级高。"
published = "2000-12-19T05:00:00.000"
remediation = "建议立即将 EServ 升级至 2.97 或更高版本（该版本修复了 SMTP 命令长度校验缺陷），或彻底替换为现代邮件服务器软件（如 hMailServer、MailEnable）。如无法立即升级，可在防火墙上限制外部 IP 对 TCP 端口 25 的访问，仅允许可信来源连接 SMTP 服务，以降低远程利用风险。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "EServ SMTP 远程代码执行漏洞"
updated = "2026-06-16T21:52:44.277"

