[basic]
description = "Adobe Creative Cloud Desktop 应用程序存在未受控搜索路径元素漏洞（CWE-427）。该漏洞源于程序加载动态链接库时搜索路径包含可被攻击者控制的目录，本地低权限攻击者可将恶意 DLL 放置于该目录下，诱使应用程序加载并执行恶意代码，从而在当前用户上下文中实现任意代码执行。该漏洞影响 Creative Cloud Desktop 6.9.1.1 及更早版本，利用需要本地访问权限与较低权限，但攻击复杂度较高且依赖特定运行环境，成功利用后可完全控制用户系统并造成机密性、完整性和可用性的严重影响。Adobe 已在 6.10.0.252.3 版本中修复此漏洞。"
published = "2026-07-14T21:16:57Z"
remediation = "建议立即将 Adobe Creative Cloud Desktop 升级至 6.10.0.252.3 或更高版本。操作方式：打开 Creative Cloud 应用程序，依次点击「帮助」→「检查更新」，或前往 Adobe 官网下载最新版安装包覆盖安装。如企业环境中无法立即升级，可在部署前临时移除包含受影响组件的旧版安装，或通过组策略限制非管理员用户对 Creative Cloud 安装目录的写入权限，以缓解 DLL 劫持风险。请参见 Adobe 安全公告 APSB26-77（https://helpx.adobe.com/security/products/creative-cloud/apsb26-77.html）。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Adobe Creative Cloud Desktop 搜索路径可控漏洞"
updated = "2026-07-17T03:24:18Z"

