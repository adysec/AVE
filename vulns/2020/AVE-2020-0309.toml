[basic]
description = "Sophos XG Firewall 设备的 login.jsp 页面存在 SQL 注入漏洞，未经身份认证的远程攻击者可通过向暴露在 WAN 区域的 HTTPS 管理服务或用户门户发送特制的 HTTP 请求触发该漏洞。成功利用可导致远程代码执行，进而窃取本地设备管理员、门户管理员及远程访问用户的用户名和哈希密码（但不影响外部 Active Directory 或 LDAP 密码）。该漏洞影响 SFOS 17.0、17.1、17.5 及 18.0 版本（2020-04-25 之前），CVSS 评分 9.8，危害等级严重，且已在 2020 年 4 月被野外利用。"
published = "2020-04-27T04:15:10Z"
remediation = "立即升级 Sophos XG Firewall 固件至以下修复版本：SFOS 17.0 升级至 17.0 GA Hotfix、SFOS 17.1 升级至 17.1 GA Hotfix、SFOS 17.5 升级至 17.5 GA Hotfix、SFOS 18.0 升级至 18.0 MR3 及以上版本。如无法立即升级，应确保管理后台 (HTTPS) 和用户门户 (User Portal) 不暴露在 WAN 区域，仅允许内网管理地址访问，并在防火墙 WAN 侧配置 IPS/IDS 规则拦截针对 /login.jsp 的 SQL 注入攻击载荷。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Sophos XG Firewall login.jsp SQL注入漏洞"
updated = "2026-06-17T02:51:32Z"

