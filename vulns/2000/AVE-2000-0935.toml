[basic]
description = "CheckPoint Firewall-1存在安全绕过漏洞，当启用RSH/REXEC设置时，其访问控制机制出现缺陷。未经身份验证的远程攻击者可通过向目标系统发送特制的连接请求，绕过访问限制，直接连接到RSH/REXEC客户端。该漏洞影响CheckPoint Firewall-1产品，CVSS评分7.5，威胁等级为中危，攻击条件较低。该漏洞可导致攻击者获取系统控制权，窃取敏感数据，或进一步渗透内部网络。该漏洞影响产品包括Firewal1的相关版本，以及依赖RSH/REXEC服务的网络设备。该漏洞已在微软2024年8月安全更新中修复。"
published = "2000-10-20T04:00:00Z"
remediation = "立即在 Checkpoint Firewall-1 管理控制台禁用 RSH/REXEC 服务设置，或升级至 FireWall-1 4.1 SP6 及以上修复版本；若无法立即升级，请在防火墙规则中显式拒绝 TCP 514/513 端口的 RSH/REXEC 连接请求，并在边界防火墙层面阻断此类恶意连接请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "CheckPoint Firewall-1 安全绕过漏洞"
updated = "2026-06-16T21:52:27Z"

