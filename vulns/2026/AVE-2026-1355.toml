[basic]
description = "Ollama 的 downloadBlob 函数存在数组索引验证不当漏洞（CWE-129），由于未对用户提供的数据进行充分校验，远程攻击者可通过发送特制请求触发数组越界内存访问，导致目标系统发生拒绝服务。该漏洞影响 Ollama 0.7.1 版本，攻击者无需身份认证即可在远程发起利用。"
