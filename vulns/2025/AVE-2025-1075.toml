[basic]
description = "Linux 内核 MCTP（Management Component Transport Protocol）网络模块存在内存管理漏洞。当使用 MCTP-over-USB 驱动克隆数据包时，重组包过程中 frag_list 未正确取消共享，导致多个数据包共享同一 sk_buff 的 frag_list，可能触发错误重组并造成内存泄漏。该漏洞影响使用了 MCTP 协议的 Linux 内核版本，CVSS 评分为 8.8。攻击者需位于目标网络相邻位置（AV:A），无需身份认证或用户交互即可利用，可能导致系统可用性下降或权限提升。厂商已在后续内核更新中修复此问题。"
published = "2025-04-01T16:15:28Z"
remediation = "立即将 Linux 内核升级至已修复版本：6.12.20、6.13.8 或 6.14 及以后版本。Ubuntu 24.04 LTS 用户可升级至 6.8.0-1036.40 或更高版本（如 6.8.0-1039.41、6.8.0-1040.42）；SUSE Linux Enterprise 15 SP6/SP7 用户请安装对应安全更新（SUSE-SU-2025:01614-1、SUSE-SU-2025:01951-1、SUSE-SU-2025:01964-1）。使用 `uname -r` 确认当前内核版本，通过 `apt upgrade linux-image-*` 或发行版包管理器进行升级并重启系统。如暂无法升级，可临时禁用 MCTP-over-USB 驱动或限制 MCTP 协议的使用以减少攻击面，具体方法为在启动参数中添加 `mctp.disable=1` 或通过 modprobe 黑名单禁用相关内核模块。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 MCTP 数据包重组内存泄漏漏洞"
updated = "2026-07-30T06:22:01Z"

