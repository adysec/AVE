[basic]
description = "标签中。<value>Windows NT 和 Windows 2000 系统中的 Dr. Watson 程序默认配置会在应用程序崩溃时生成 user.dmp 崩溃转储文件，但该文件被设置为所有用户可读（world-readable）权限。本地攻击者无需特殊身份认证即可直接访问这些转储文件，从中提取内存中残留的敏感信息，可能导致系统凭据、进程数据或其他机密内容泄露。该漏洞影响 Windows NT 及 Windows 2000 的默认安装配置，攻击前提为攻击者已具备对目标系统的本地访问权限。"
published = "2001-06-18T04:00:00Z"
remediation = '建议通过修改文件系统权限，将 Dr. Watson 生成的 user.dmp 文件权限设置为仅限管理员访问。或在注册表中将 "EnableWatson" 键值设置为 0 以禁用 Dr. Watson 崩溃转储功能，防止敏感信息被泄露。'
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Microsoft Windows Dr. Watson 敏感信息泄露漏洞"
updated = "2026-06-16T21:54:11Z"

