[basic]
description = "WordPress Pagination by BestWebSoft 插件 1.0.7 之前版本存在跨站脚本漏洞（XSS），该插件在后台管理页面的 category 参数中未对用户输入进行充分的过滤与转义处理，导致认证后的攻击者（如订阅者或贡献者角色）可构造包含恶意 JavaScript 代码的 URL 并诱导管理员点击，从而在目标浏览器中执行任意脚本，窃取会话 Cookie、执行未授权操作或篡改页面内容。攻击者需具备 WordPress 后台登录权限，利用难度较低，影响运行该插件的所有 WordPress 站点。"
published = "2019-08-20T16:15:12Z"
remediation = "立即将 WordPress pagination 插件升级至 1.0.7 或更高版本。如无法升级，可在 WordPress 管理后台禁用该插件，并检查所有用户提交内容中是否已存在恶意脚本注入。同时建议在 Web 应用防火墙（WAF）层面添加针对 XSS 的过滤规则，对 URL 参数和表单输入中的 `<script>`、`onerror` 等关键字进行拦截。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Pagination插件 跨站脚本漏洞"
updated = "2026-06-17T01:13:02Z"

