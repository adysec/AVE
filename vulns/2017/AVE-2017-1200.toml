[basic]
description = "Windows Search 服务在处理内存对象时存在远程代码执行漏洞。未经身份认证的远程攻击者可通过向目标系统发送特制的 SMB 请求触发该漏洞，成功利用后可完全控制受影响的系统，实现安装程序、查看/更改/删除数据或创建新账户等操作。该漏洞影响范围广泛，涵盖 Windows XP 至 Windows Server 2016 等多个版本，CVSS 评分 9.8，危害等级严重。Microsoft 已在 2017 年 6 月安全更新中修复此漏洞。"
published = "2017-06-15T01:29:04Z"
remediation = "立即安装 Microsoft 2017 年 6 月安全更新：Windows 8.1/Server 2012 R2 安装 KB4022717，Windows 10/Server 2016 安装 KB4022726 或 KB4022715，Windows 7/Server 2008 R2 安装 KB4022719。如无法打补丁，可在防火墙阻止入站 SMB 流量（TCP 445/139）并禁用 Windows Search 服务（WSearch）作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Microsoft Windows Search 远程代码执行漏洞"
updated = "2026-06-17T01:26:33Z"

