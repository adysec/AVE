[basic]
description = "Google Chrome 使用的 FreeType 字体渲染库存在堆缓冲区溢出漏洞，该漏洞源于 FreeType 在处理特定字体文件时未正确验证缓冲区边界。远程攻击者可通过诱导用户访问包含特制字体的恶意 HTML 页面触发堆内存破坏，导致浏览器崩溃或实现任意代码执行。该漏洞影响 Chrome 86.0.4240.111 之前的所有版本，CVSS 评分 9.6，危害等级严重。Google 已在 Chrome 86.0.4240.111 版本中修复此漏洞。"
published = "2020-11-03T03:15:14.853"
remediation = "升级 Google Chrome 至 86.0.4240.111 及以上版本（Chrome 会自动检查更新，也可访问 chrome://settings/help 手动触发更新）。对于使用 FreeType 库的系统（如 Linux 发行版），更新 FreeType 至 2.10.4 及以上版本，命令：apt-get update && apt-get install freetype2（Debian/Ubuntu）或 yum update freetype（CentOS/RHEL）。临时缓解措施：避免在受影响浏览器中打开不可信的 HTML 页面。"
score = 9.6
severity = "CRITICAL"
sources = ["kev"]
title = "Google Chrome FreeType 堆缓冲区溢出漏洞"
updated = "2026-06-17T02:57:36.243"

