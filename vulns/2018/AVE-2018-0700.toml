[basic]
description = 'SAP CRM多个版本（7.01、7.02、7.30、7.31、7.33、7.54）存在路径遍历漏洞（CWE-22），由于系统对用户提供的路径信息缺乏充分验证，导致攻击者可利用".."等父目录遍历字符绕过限制，访问受限文件API。攻击者需具备SAP CRM管理员凭据，通过向日志记录功能注入恶意路径，将JSP木马写入服务器文件系统，进而实现远程命令执行。该漏洞影响SAP NetWeaver AS Java CRM组件，CVSS评分6.6（中等），危害等级中等。SAP在2018年2月安全补丁日发布了修复程序，建议用户升级至已修补版本。'
published = "2018-03-01T17:29:00Z"
remediation = "根据 SAP 安全公告 2018 年 2 月补丁日（SAP Security Patch Day February 2018）信息，此路径遍历漏洞已在 SAP 安全说明 2547431 中给出修复方案。受影响版本为 SAP CRM 7.01、7.02、7.30、7.31、7.33 和 7.54。首要措施是立即应用 SAP 软件更新管理器（SUM）下载并安装对应的安全补丁，对照 SAP Security Note 2547431 中的修正版本号，将受影响组件升级至已修复版本。若基础设施 WAR/EAR 部署在其他应用服务器上，则需同步更新该组件版本。对于短期内无法完成升级的系统，应在 Web  dispatcher 或反向代理层面实施 IP 白名单访问控制，仅允许管理面来源 IP 访问 /b2b/admin/logging.jsp 及相邻管理员页面，同时关闭未授权用户对 CRM 管理界面的访问路径，以缩小攻击暴露面。"
score = 6.6
severity = "MEDIUM"
sources = ["kev"]
title = "SAP CRM 路径遍历漏洞"
updated = "2026-06-17T01:55:36Z"

