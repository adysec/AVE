[basic]
description = "Allaire JRun 3.0 的 HTTP Servlet 服务器存在目录泄露漏洞。远程攻击者可通过向目标服务器发送包含额外前导斜杠（如 `//servlets/`）的特制 HTTP 请求，绕过访问控制限制，导致服务器返回敏感目录的完整文件列表。该漏洞可泄露 Web 应用目录结构、配置文件路径及其他敏感信息，为后续攻击提供情报支撑。攻击无需身份认证，利用方式简单，影响 Allaire JRun 3.0 版本。"
published = "2000-12-11"
remediation = 'Allaire JRun 3.0 已停止维护，官方不再提供安全更新。建议立即迁移至受支持的 Java 应用服务器（如 Apache Tomcat 9+ 或 WildFly）。在完成迁移前，可在反向代理层（如 Apache httpd 的 mod_rewrite）添加规则，将包含连续双斜杠 "//" 的 URL 请求重写或拒绝，例如：RewriteRule ^//(.*)$ /$1 [R=301,L] 或直接返回 403 状态码，以阻止攻击者通过额外前导斜杠绕过 WEB-INF 目录访问限制。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Allaire JRun 3.0 目录泄露漏洞"
updated = "2000-12-11"

