[basic]
description = "Opera 5.11 及更早版本在处理包含大量图片的网页时存在拒绝服务漏洞。远程攻击者可通过构造包含大量图片元素的恶意网页，诱使用户访问后触发该漏洞，导致浏览器 CPU 占用率飙升及内存泄漏，最终造成浏览器崩溃或系统资源耗尽。该漏洞影响 Opera 5.11、Microsoft Internet Explorer 6.0 及 Mozilla 0.9.6 等浏览器，攻击条件低，无需身份认证即可远程利用。"
published = "2001-12-31T05:00:00Z"
remediation = "升级 Opera 浏览器至 6.0 及以上版本，或升级 Internet Explorer 至 6.0 SP1 及以上版本，或升级 Mozilla 至 1.0 及以上版本。临时缓解措施：在浏览器设置中禁用自动加载图片功能，或使用内容过滤插件限制单页面图片加载数量。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Opera Web Browser 图片数量拒绝服务漏洞"
updated = "2026-06-16T21:56:22Z"

