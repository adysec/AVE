[basic]
description = "exmh 2.2 及更早版本在处理临时文件时存在符号链接（symlink）攻击漏洞。本地攻击者可通过在 exmhErrorMsg 临时文件上创建符号链接，诱使 exmh 以当前用户权限覆盖任意系统文件，导致系统文件被篡改或数据损坏。该攻击需要本地用户权限，利用难度较高，但成功后可造成较大影响。受影响的系统包括 Debian、Mandrake Linux 等发行版。"
published = "2001-03-12T05:00:00Z"
remediation = "升级 exmh 至 2.3 或更高版本；Debian 用户安装 dsa-022 更新，Mandrake 用户安装 MDKSA-2001-015 补丁。如无法升级，设置 TMPDIR 或 EXMHTMPDIR 环境变量指向用户自有目录以缓解 symlink 攻击。"
score = 1.2
severity = "LOW"
sources = ["cve"]
title = "exmh 临时文件符号链接攻击任意文件写入漏洞"
updated = "2026-06-16T21:53:42Z"

