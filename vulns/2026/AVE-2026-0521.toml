[basic]
description = "西门子 SINEC NMS 的 UMC 组件存在身份验证绕过漏洞，由于对用户身份验证的校验不充分，未经身份认证的远程攻击者可向目标系统发送特制请求绕过认证机制，从而未授权访问受保护的应用程序功能。该漏洞影响 SINEC NMS V4.0 SP3 之前的所有版本，CVSS 评分 6.9，危害等级中危。Siemens 已发布安全更新修复此漏洞。"
published = "2026-04-14T09:16:34Z"
remediation = "建议立即将 SINEC NMS 升级至 V4.0 SP3 或更高版本，该版本修复了 UMC 组件中的身份验证绕过漏洞。补丁下载地址：https://support.industry.siemens.com/cs/ww/en/view/110000760/。如无法立即升级，应限制对 SINEC NMS 管理端口的网络访问，仅允许受信任 IP 连接，并将管理网络与业务网络隔离。"
score = 6.9
severity = "MEDIUM"
sources = ["zdi"]
title = "西门子 SINEC NMS 身份验证绕过漏洞"
updated = "2026-06-17T10:22:29Z"

