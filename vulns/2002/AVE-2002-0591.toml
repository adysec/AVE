[basic]
description = "Cisco VPN Client for Unix 3.5.1 及更早版本的 vpnclient 程序中存在缓冲区溢出漏洞。本地攻击者可通过向 connect 参数传递超长的配置文件名称，触发缓冲区溢出，从而获得系统的管理权限。该漏洞影响运行 UNIX 平台的 Cisco VPN Client 3.5.2 之前版本，攻击者需预先获得本地访问权限方可利用此漏洞成功执行提权操作，CVSS 评分 7.2，危害等级较高。Cisco 已在后续版本中修复该问题。"
published = "2002-05-28T04:00:00Z"
remediation = "立即升级 Cisco VPN Client for Unix 至 3.5.2 或更高版本。临时缓解措施包括：通过 chmod 或文件系统 ACL 限制本地用户对 /usr/local/bin/vpnclient 的执行权限，删除不必要的连接配置文件，并监控该程序的异常调用行为。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Cisco VPN Client for Unix 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:59:20Z"

