[basic]
description = "WebKit渲染引擎在处理SVG文本元素时存在越界读取漏洞。Google Chrome 18.0.1025.142之前版本以及采用旧版WebKit的浏览器（如Safari）受此影响。远程攻击者可通过构造恶意的SVG网页，利用浏览器解析SVG文本元素时的内存访问越界，使浏览器进程崩溃拒绝服务，或在特定条件下读取敏感内存信息。该漏洞只需诱使用户访问包含恶意SVG内容的网页即可触发，无需复杂身份认证或特殊用户交互，攻击可在客户端无感知的情况下完成。Apple和Google已在后续安全更新中修复此漏洞。"
published = "2012-03-30T22:55:01Z"
remediation = "立即将 Apple iOS 升级至 6.0 或更高版本，或将 Google Chrome 升级至 18.0.1025.142 及以上版本，以修复 WebKit 组件中的内存破坏漏洞。如无法立即升级，可临时禁用浏览器中的 JavaScript 执行功能。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome SVG 文本元素越界读取漏洞"
updated = "2026-06-16T23:32:32Z"

