[basic]
description = "Apache Struts2 REST 插件在 2.1.1 至 2.3.x（<2.3.34）和 2.5.x（<2.5.13）版本中使用了 XStreamHandler，但在反序列化 XML 时并未进行任何类型过滤，这为攻击者提供了通过恶意 XML 负载实现远程代码执行的途径。攻击者无需任何权限即可远程触发此漏洞，攻击难度较高，但一旦成功 exploited，将导致目标系统完全控制权丧失。受影响产品涵盖 Apache Struts2 2.1.6 至 2.3.33 版本以及 2.5 至 2.5.12 版本，攻击者可构造恶意 XML 载荷，利用 Struts2 REST 插件的反序列化实现代码执行，危害等级与 CVSS 8.1 高危相似，攻击者可横向移动、窃取敏感数据或破坏系统完整性，一旦成功引发将导致系统遭受严重破坏，攻击者可完全掌控目标服务器权限，相当于授予了攻击者对目标系统的完全控制权。"
published = "2017-09-15T19:29:00Z"
remediation = "升级 Apache Struts2 到 2.5.13 或更高版本，关闭支持 XStream 的 REST 插件或禁用 XML 反序列化功能。如无法立即升级，可在 web.xml 中添加过滤器阻止危险的 XML 解析，暂时缓解风险。"
score = 8.1
severity = "HIGH"
sources = ["nuclei"]
title = "Apache Struts2 S2-052 远程命令执行漏洞"
updated = "2026-06-17T01:28:57Z"

