[info]
author = "AVE"
description = "检测Netscape 6/Mozilla 1.0 RC1及更早版本中CSS LINK元素信息泄露漏洞。通过构造包含file://协议引用的CSS样式表，探测目标浏览器是否泄露本地文件存在信息。攻击者可通过诱导用户访问恶意页面，利用CSS LINK元素的HTTP重定向行为判断客户端文件是否存在。"
id = "POC-AVE-2002-0211"
name = "CVE-2002-0594 PoC"
severity = "medium"
tags = ["ave-2002-0211"]
vuln_id = [
    "CVE-2002-0594",
    "AVE-2002-0211",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/CVE-2002-0594-test.html"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["CVE-2002-0594"]
