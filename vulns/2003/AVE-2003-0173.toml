[basic]
description = "netpbm 是一套广泛使用的图像处理工具集，该漏洞存在于 netpbm 9.25 及更早版本中。由于程序在创建临时文件时未能正确设置安全权限和防范竞争条件，本地攻击者可以利用符号链接攻击或时序竞争（race condition）覆盖系统上的任意文件。该漏洞利用需要本地用户权限且访问复杂度较高，但仍可能导致敏感系统文件被篡改或权限提升。受影响范围包括所有安装了受影响版本 netpbm 的 Linux 及 Unix 类操作系统。"
published = "2004-02-17T05:00:00Z"
remediation = '升级 netpbm 至 10.0 或更高版本以修复临时文件创建漏洞。Debian 用户执行 apt-get update && apt-get upgrade 安装 netpbm-free 2:9.20-8.4 或更高版本；Red Hat 用户安装 RHSA-2004:030 或 RHSA-2004:031 补丁；Gentoo 用户执行 emerge -pv ">=media-libs/netpbm-10.0" 后 emerge ">=media-libs/netpbm-10.0" 升级。如暂无法升级，应通过文件系统权限或 sudoers 配置限制非授权本地用户执行 pnm 系列工具。'
score = 3.7
severity = "LOW"
sources = ["redhat"]
title = "netpbm 任意文件写入漏洞"
updated = "2026-06-16T22:03:10Z"

