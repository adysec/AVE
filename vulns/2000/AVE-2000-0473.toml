[basic]
description = "BitchX IRC 客户端在处理 /INVITE 命令时存在格式化字符串漏洞。由于程序未能正确清理不可信的格式化字符串参数，当攻击者向目标用户发送包含特殊格式化字符（如 %s、%n 等）的频道名称邀请时，客户端在解析频道名时会将其作为格式化字符串处理，导致读取或写入任意内存地址，进而造成程序崩溃或拒绝服务。攻击者无需认证即可远程触发该漏洞，影响 BitchX 75p1、75p3 及 1.0c16 及之前版本。目前已公开利用代码，攻击复杂度低。"
published = "2000-07-04T04:00:00.000"
remediation = "升级 BitchX 至 1.0c17 或更高版本。Red Hat Linux 用户可安装 RHSA-2000-042 提供的更新包；Caldera OpenLinux 用户安装 CSSA-2000-022.0 补丁。如无法升级，可在 IRC 客户端配置中禁用自动接受邀请（/ignore invite），或使用其他 IRC 客户端（如 irssi）作为临时替代。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "BitchX IRC Client 格式化字符串拒绝服务漏洞"
updated = "2026-06-16T21:52:04.317"

