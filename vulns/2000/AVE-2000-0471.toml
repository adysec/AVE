[basic]
description = "SapporoWorks WinProxy 2.0 及 2.0.1 版本的 POP3 服务存在缓冲区溢出漏洞，远程攻击者可通过向 POP3 服务发送超长的 USER、PASS、LIST、RETR 或 DELE 命令触发缓冲区溢出，导致任意代码执行。该漏洞无需身份认证即可利用，攻击复杂度低，影响 WinProxy 邮件代理服务的机密性、完整性和可用性。Exploit-DB 已公开该漏洞的远程利用代码。"
published = "2000-06-27T04:00:00Z"
remediation = "WinProxy 2.0 和 2.0.1 已停止维护，官方未发布安全补丁。建议立即停止使用该版本，升级至受支持的替代代理服务器软件（如 Squid、HAProxy 等）。作为临时缓解措施，在防火墙层面限制对 POP3 端口（110/TCP）的访问，仅允许受信任 IP 连接，并禁用不必要的 POP3 服务。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "SapporoWorks WinProxy POP3服务缓冲区溢出漏洞"
updated = "2026-06-16T21:52:04Z"

