[basic]
description = "Google Chrome 134.0.6998.35 之前版本的 Media 组件存在越界读取漏洞（CWE-125）。远程攻击者可通过构造特制的 HTML 页面诱导用户访问，触发越界内存访问，导致敏感信息泄露或内存破坏。该漏洞影响 Google Chrome 及基于 Chromium 的 Microsoft Edge 等浏览器，用户交互（点击链接）为攻击条件，CVSS 评分 8.8，危害等级高。Google 已在 134.0.6998.35 版本中修复。"
published = "2025-03-05T04:15:11Z"
remediation = "立即将 Google Chrome 升级至 134.0.6998.35 或更高版本（通过 chrome://settings/help 检查更新并重启浏览器）。使用 Microsoft Edge 的用户应升级至 134.0.3124.51 或更高版本。该漏洞位于 Media 组件中，攻击者可通过构造恶意 HTML 页面触发越界读取，建议在无法立即升级时启用站点隔离（Site Isolation）并禁用不信任来源的媒体内容自动播放作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome Media 越界读取漏洞"
updated = "2026-06-17T08:40:20Z"

