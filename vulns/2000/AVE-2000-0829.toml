[basic]
description = "Virtual Visions FTP 浏览器中的 ftp.pl CGI 程序存在目录遍历漏洞，远程攻击者可通过向该 CGI 程序发送包含 `..`（点点）序列的特制请求，绕过文档根目录限制，读取服务器上任意目录中的文件。该漏洞利用难度低，无需身份认证即可远程触发，可能导致敏感信息泄露。受影响的 Virtual Visions FTP 浏览器版本未明确，建议用户升级或禁用该 CGI 程序。"
published = "2000-07-12T04:00:00.000"
remediation = "立即删除或禁用 ftp.pl CGI 脚本，或限制其只能访问特定目录。在 Web 服务器层面配置过滤 `../` 路径遍历序列，并确保 CGI 程序运行在最小权限账户下，避免访问 Web 根目录外的文件系统。由于该软件已停止维护，建议迁移至其他受支持的 FTP 浏览器方案。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Virtual Visions FTP浏览器 ftp.pl CGI 目录遍历漏洞"
updated = "2026-06-16T21:52:14.467"

