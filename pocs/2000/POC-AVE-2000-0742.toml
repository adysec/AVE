[info]
author = "ave"
description = "检测 SuSE Linux 6.3/6.4 默认 Apache 配置中 /usr/doc 目录别名是否可访问，通过请求 /doc/packages/ 路径并检查返回状态码 200 及目录列表特征字符串"
id = "POC-AVE-2000-0742"
name = "SuSE Linux Apache /doc/packages Directory Browsable PoC"
severity = "medium"
tags = ["cve-2000-1016"]
vuln_id = [
    "CVE-2000-1016",
    "AVE-2000-0742",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/doc/packages/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["index of /doc"]
