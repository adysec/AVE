[basic]
description = "Microsoft IIS 4.0/5.0 的错误消息页面存在跨站脚本（XSS）漏洞，是 MS00-060 公告中所述漏洞（CVE-2000-0746）的变种。恶意网站运营者可将脚本嵌入指向受信任站点的链接中，当用户点击该链接访问受信任站点时，IIS 返回的错误消息未对脚本进行正确转义，导致脚本在受信任站点的安全上下文中执行。攻击者利用此漏洞可窃取用户 Cookie、伪造页面内容或发起其他客户端攻击。攻击条件为用户必须点击恶意构造的链接，无需额外认证。"
published = "2001-01-09T05:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-060 提供的补丁程序。IIS 4.0 用户下载安装 KB260347 补丁，IIS 5.0 用户下载安装 KB275657 补丁。下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=FE95D9FC-D769-43F3-8376-FAA1D2ABC4F3（IIS 4.0）和 https://www.microsoft.com/download/details.aspx?FamilyId=31734888-9C17-43F1-BFD9-FDA8FEAF6D68（IIS 5.0）。如无法安装补丁，可在 IIS 中启用 URLScan 工具过滤恶意脚本字符，或在 Web 应用层对所有用户输入进行 HTML 编码转义，过滤 <script> 等危险标签。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft IIS 4.0/5.0 错误消息跨站脚本漏洞"
updated = "2026-06-16T21:53:09.327"

