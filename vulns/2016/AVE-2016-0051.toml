[basic]
description = "WordPress Brafton 插件 3.4.8 之前版本中存在反射型跨站脚本漏洞，该漏洞位于 wp-admin/admin.php?page=BraftonArticleLoader 页面的 tab 参数中，未对用户输入进行充分过滤和转义。攻击者可构造恶意 URL 诱导已登录管理员点击，在目标浏览器中执行任意 JavaScript 代码，窃取会话 Cookie 或执行恶意操作。CVSS 评分 6.1，危害等级中危。"
published = "2019-09-16T17:15:12Z"
remediation = "升级 WordPress Brafton 插件至 3.4.8 或更高版本，该版本修复了 wp-admin/admin.php 页面 tab 参数跨站脚本漏洞。如无法立即升级，可限制对 wp-admin 目录的访问权限或使用 Web 应用防火墙（WAF）拦截包含恶意 tab 参数的请求。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Brafton插件跨站脚本漏洞"
updated = "2026-06-17T00:40:43Z"

