[basic]
description = "WebKit 渲染引擎（存在于 Apple iTunes 10.7 之前版本中）存在内存损坏远程代码执行漏洞。未经身份认证的远程攻击者可通过构造包含恶意代码的网页，诱导用户使用受影响版本的 iTunes 打开该网页，从而触发 WebKit 引擎中的内存损坏缺陷，实现任意代码执行或导致应用程序崩溃。该漏洞影响运行 Windows 和 Mac OS X 系统的用户，攻击条件要求用户访问攻击者控制的恶意网站，利用方式为通过特制网页内容触发内存破坏，进而获得与当前用户相同的权限。"
published = "2012-09-13T10:30:18Z"
remediation = '建议将 iOS 设备升级至 6.0 或更高版本，Mac 上的 Safari 升级至 6.0.1 或更高版本，iTunes 升级至 10.7 或更高版本。iOS 用户可通过"设置"→"通用"→"软件更新"下载安装，Mac 用户通过 Mac App Store 或 Apple 官网获取 Safari 和 iTunes 最新版本。如无法立即升级，应避免在 Safari 或 iTunes 中打开未知网站或点击可疑链接，以降低被利用风险。'
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "苹果 WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:32Z"

