[basic]
description = "vBulletin 论坛系统 forumrunner/includes/moderation.php 文件中存在 SQL 注入漏洞，攻击者无需身份认证即可通过向 forumrunner/request.php 发送特制的 postids 参数，在数据库查询中注入恶意 SQL 语句，导致任意 SQL 命令执行。攻击者可利用该漏洞窃取数据库中的用户凭证、论坛配置等敏感信息，甚至进一步获取服务器控制权。该漏洞影响 vBulletin 4.2.2 Patch Level 5 之前版本及 4.2.3 Patch Level 1 之前版本，已在 2016 年 7 月被野外利用，CVSS 评分 9.8，危害等级严重。"
published = "2016-08-30T19:59:00Z"
remediation = "立即升级 vBulletin 至 4.2.2 Patch Level 5 或 4.2.3 Patch Level 1 及以上版本，该漏洞已在上述版本中修复。如无法立即升级，可在 Web 服务器层面（如 Nginx/Apache）添加规则拦截对 /forumrunner/request.php 的 POST 请求，并过滤 postids 参数中的恶意 SQL 语句作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "vBulletin ForumRunner SQL注入漏洞"
updated = "2026-06-17T00:50:37Z"

