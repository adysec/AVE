[basic]
description = 'Ultrafunk Popcorn 1.20 存在拒绝服务漏洞，远程攻击者可通过向受影响软件发送包含特殊格式的 Subject 头（包含制表符 "\t\t"）的畸形邮件，导致软件崩溃。该漏洞利用方式简单，无需身份认证即可远程触发，影响 Ultrafunk Popcorn 1.20 版本。攻击者只需构造特制邮件并发送至目标用户，即可造成服务不可用。'
published = "2002-10-04T04:00:00Z"
remediation = 'Ultrafunk Popcorn 1.20 已停止维护且不再发布安全更新，建议立即卸载该软件，迁移至仍受支持的邮件客户端（如 Mozilla Thunderbird 或 Microsoft Outlook）。若暂时无法卸载，可在邮件服务器或客户端侧配置内容过滤规则，拦截包含异常 Subject 字段（如连续制表符 \t\t）或日期年份超过 2037 的畸形邮件，作为临时缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Ultrafunk Popcorn 1.20 拒绝服务漏洞"
updated = "2026-06-16T21:58:37Z"

