[basic]
description = 'Unify eWave ServletExec JSP/Java Servlet 引擎 3.0C 及更早版本存在拒绝服务漏洞。远程攻击者通过向目标服务器发送包含 "/servlet/" 字符串的特制 URL 请求，当 ServletExec servlet 已在运行时，该请求会触发 servlet 内部异常，导致服务崩溃或无法响应正常请求。攻击无需身份认证，通过网络即可发起，影响运行 ServletExec 3.0C 及之前版本的所有 Web 服务器。目前厂商已停止维护该产品，建议用户升级至更高版本或迁移至其他 Servlet 容器。'
published = "2000-12-11T05:00:00.000"
remediation = '建议立即升级 ServletExec 至 3.0C 以上版本；该产品已停止维护，建议迁移至受支持的 Java Servlet 容器（如 Apache Tomcat 或 Eclipse Jetty）。临时缓解措施可在反向代理或 Web 服务器层面过滤包含 "/servlet/" 路径的请求。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Unify eWave ServletExec 拒绝服务漏洞"
updated = "2026-06-16T21:52:59.793"

