[basic]
description = "Samba Web Administration Tool (SWAT) 在 Samba 2.0.7 版本中存在符号链接漏洞（Symlink Attack）。SWAT 的 CGI 日志功能将 HTTP 请求内容写入 /tmp/cgi.log，但该日志文件未设置严格的访问权限，本地低权限用户可将其替换为指向系统任意文件（如 /etc/passwd）的符号链接。当开启 CGI 日志记录时，攻击者向 SWAT 默认端口 701 提交的内容会通过符号链接写入被指向的目标文件，攻击者可构造包含新用户条目的内容将其注入 /etc/passwd，通过以此创建的账户获取 root 权限，进而完全控制系统。该漏洞为本地权限提升类漏洞，CVSSv2 评分 7.2，影响运行 Samba 2.0.7 且启用了 SWAT CGI 日志功能的 Linux/Unix 系统，Samba 官方已在新版本中修复此问题。"
published = "2000-12-19T05:00:00.000"
remediation = '立即升级 Samba 到 2.2.0a 或更高版本，该版本修复了 SWAT 在 xinetd 下运行时不设置 umask 导致 /tmp/cgi.log 权限过低的缺陷。如暂无法升级，可在 /etc/inetd.conf 或 xinetd 配置中为 SWAT 服务添加 "umask 077" 确保日志文件仅 root 可读写，或直接禁用 SWAT 的 CGI 日志功能（注释掉 swat 配置中的 cgi.log 相关设置），并删除已有的 /tmp/cgi.log 文件防止被利用覆盖系统关键文件。'
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Samba SWAT 符号链接任意文件覆盖漏洞"
updated = "2026-06-16T21:52:48.227"

