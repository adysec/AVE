[basic]
description = "bsguest.cgi 是 Brian Stanback 开发的访客留言簿 CGI 脚本，存在远程命令执行漏洞。由于该脚本未对用户输入进行严格的过滤和转义，攻击者可以在电子邮件地址参数中注入 shell 元字符（如分号、管道符、反引号等），进而在服务器端执行任意系统命令。该漏洞影响运行 bsguest.cgi 1.0 版本的 Web 服务器，攻击者无需身份认证，只需通过网络访问目标服务器并提交包含恶意 shell 命令的电子邮件地址即可触发漏洞。攻击者利用此漏洞可在 Web 服务器上执行任意系统命令，从而完全控制目标服务器，造成严重的信息泄露和系统破坏风险。"
published = "2001-02-12T05:00:00Z"
remediation = "立即从 Web 服务器中删除或禁用 bsguest.cgi 脚本。若业务确需保留留言功能，应替换为当前仍受维护的现代留言本程序，并对用户提交的 email 字段严格过滤分号（;）、管道符（|）、反引号（`）等 shell 元字符，仅允许符合 RFC 5322 规范的邮件地址格式通过。临时缓解措施可在 Web 服务器配置中关闭该目录的 CGI 执行权限，或通过防火墙限制对 bsguest.cgi 的直接访问。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Brian Stanback bsguest.cgi 远程命令执行漏洞"
updated = "2026-06-16T21:53:39Z"

