[basic]
description = "Coder AI Bridge Proxy（aibridgeproxyd）默认配置下使用 InsecureSkipVerify: true 的 Go 代理传输层，导致出站 HTTPS 连接接受任意 TLS 证书，不验证服务器身份。中间人攻击者通过 ARP 欺骗、DNS 投毒或代理环境变量劫持，可拦截 Coder 会话令牌、用户提供的 API 密钥以及包含提示词和响应的完整请求体。该漏洞影响 Coder v2.30.0 至 v2.34.1 版本，CVSS 评分 7.4，危害等级高。官方已在 v2.32.7、v2.33.8 和 v2.34.2 中无条件启用 TLS 1.2+ 及系统根 CA 校验修复。"
published = "2026-07-08T01:16:27Z"
remediation = "立即升级 Coder AI Bridge Proxy 至 v2.34.2（推荐）、v2.33.8 或 v2.32.7 及以上版本，修复将无条件启用 TLS 1.2+ 证书校验。如无法升级，确保 Coder access URL 使用受信证书，并将 AI Bridge Proxy 与 Coder 服务器部署在同一回环地址或配置 mTLS 以加固网络路径。"
score = 7.4
severity = "HIGH"
sources = ["ghsa"]
title = "Coder AI Bridge Proxy 默认配置跳过 TLS 证书校验漏洞"
updated = "2026-07-08T19:39:30Z"

