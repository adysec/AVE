[basic]
description = "Cat Soft Serv-U FTP Server 2.5.x 版本存在暴力破解漏洞，攻击者可先以有效用户（可能为匿名用户）身份登录系统，随后绕过服务器的防暴力破解保护机制，尝试猜测其他用户的密码。该漏洞允许远程未认证攻击者通过网络访问进行攻击，影响服务器上所有用户账户的安全性，可能导致账户被接管、数据泄露及后续横向移动。CVSS 评分 7.5（高危），攻击向量为网络、攻击复杂度低、无需认证、影响机密性/完整性/可用性。受影响版本为 Serv-U FTP Server 2.5.x 系列。"
published = "2000-12-11T05:00:00.000"
remediation = "建议升级 Serv-U FTP Server 至 2.5e 或更高版本（官方已修复反暴力破解绕过漏洞），或升级至 3.x/4.x 后续稳定版本。若无法立即升级，建议在防火墙层面限制 FTP 登录尝试频率（如每 IP 每分钟最多 5 次失败登录），并禁用匿名登录账户以降低暴力破解风险，同时启用账户锁定策略（如连续 5 次失败锁定 30 分钟）作为临时缓解措施。建议尽快迁移至现代 FTP/SFTP 服务器（如 FileZilla Server、vsftpd 或 WinSCP Server）并启用失败登录锁定与 IP 黑名单功能。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Cat Soft Serv-U FTP Server 2.5.x 暴力破解漏洞"
updated = "2026-06-16T21:53:00.790"

