[basic]
description = 'QNAP NAS 设备上的 Photo Station 应用在 6.0.3 及之前版本中存在路径遍历漏洞（CWE-22）。未经身份认证的远程攻击者可通过发送包含目录遍历序列（如 "../../../"）的特制 HTTP 请求，访问或修改 NAS 设备上的任意系统文件。该漏洞可被与其他漏洞组合利用，形成完整的预认证远程代码执行攻击链，使攻击者获取设备的 root 权限并完全控制 NAS 及其存储的所有数据。受影响设备包括互联网上约 45 万台运行受影响版本 QTS 和 Photo Station 的 QNAP NAS。CVSSv3.1 评分为 9.8，危害等级为严重。QNAP 已在 Photo Station 6.0.3 版本中修复该漏洞，建议用户立即升级至最新版本。'
published = "2019-12-05T17:15:13Z"
remediation = "建议立即将 QNAP Photo Station 升级至修复版本：QTS 4.4.1 用户升级至 Photo Station 6.0.3 或更高版本；QTS 4.3.4-4.4.0 用户升级至 5.7.10 或更高版本；QTS 4.3.0-4.3.3 用户升级至 5.4.9 或更高版本；QTS 4.2.6 用户升级至 5.2.11 或更高版本。通过 QTS 控制台的「App Center」→「已安装」→「Photo Station」点击「更新」完成升级。若暂时无法升级，建议在防火墙层面限制对 Photo Station Web 端口（默认 80/443）的外部访问，仅允许可信内网 IP 访问，并禁用不必要的共享文件夹权限作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "QNAP Photo Station 路径遍历漏洞"
updated = "2026-06-17T02:40:14Z"

