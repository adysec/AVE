[basic]
description = "Pan 新闻阅读器存在拒绝服务漏洞，攻击者无需身份认证即可通过向目标系统发送包含超长作者电子邮件地址的新闻帖子触发该漏洞，导致程序崩溃并拒绝服务。该漏洞影响 Pan 0.13.3 及之前所有版本，CVSS 评分 7.8，危害等级高。攻击者可通过远程 NNTP 连接构造恶意新闻组邮件头，利用邮件地址字段长度校验缺失的缺陷，触发缓冲区溢出或内存访问异常，造成服务不可用。受影响的 Unix/Linux 系统上运行的 Pan 新闻客户端均存在风险，建议用户尽快升级到修复版本。"
published = "2003-11-03T05:00:00Z"
remediation = "建议将 Pan 阅读器升级至 0.13.4 或更高版本以修复处理超长邮件地址导致的崩溃漏洞。由于该软件已停止维护，强烈建议迁移至 Newsboat 或 Slrn 等现代且安全的 NNTP 客户端。"
score = 7.8
severity = "HIGH"
sources = ["redhat"]
title = "Charles Kerr Pan 远程拒绝服务漏洞"
updated = "2026-06-16T22:03:05Z"

