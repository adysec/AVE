[basic]
description = "Quikstore Shopping Cart 中的 quikstore.cgi 脚本存在命令注入漏洞，远程攻击者可通过在 HTTP GET 请求的 URL 参数中插入 shell 元字符（如分号、管道符等）来执行任意系统命令。该漏洞影响 Quikstore Shopping Cart 所有版本，攻击者无需身份认证即可利用，成功利用后可完全控制目标服务器，导致数据泄露、网站篡改或进一步内网渗透。CVSS 评分 7.5，危害等级高。"
published = "2000-11-20T05:00:00Z"
remediation = "建议立即升级 Quikstore 至 2.11.00 以上版本（该版本已修复此漏洞）。如无法升级，可采取以下缓解措施：1) 在 Unix/Linux 系统上使用 chroot 限制 Web 服务器可访问的文件系统范围；2) 移除 Web 目录中不必要的脚本和二进制文件；3) 在 Web 服务器或 WAF 层面过滤 HTTP GET 请求 URL 中的 shell 元字符（如 `;`、`|`、`` ` ``、`$()` 等）。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Quikstore Shopping Cart 远程命令执行漏洞"
updated = "2026-06-16T21:53:24Z"

