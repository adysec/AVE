[basic]
description = "SAP NetWeaver AS JAVA 的 Universal Worklist 配置存在信息泄露漏洞。远程攻击者无需身份认证即可向目标系统发送特制的 HTTP 请求，利用该漏洞可获取敏感用户信息，如用户名、邮箱地址等个人身份数据。该漏洞影响 SAP NetWeaver AS JAVA 7.1 至 7.5 版本，CVSS 评分 5.3，危害等级中危。SAP 已在安全公告 2256846 中发布补丁修复此漏洞。"
published = "2016-02-16T15:59:02Z"
remediation = "立即安装 SAP Security Note 2256846 对应的补丁，该补丁可通过 SAP Launchpad 支持门户获取。如无法立即打补丁，可在反向代理或 Web 防火墙层面限制对 `/webdynpro/resources/sap.com/XXX/JWFTestAddAssignees` 路径的匿名访问，并禁用不必要的 Web Dynpro 应用作为临时缓解措施。"
score = 5.3
severity = "MEDIUM"
sources = ["kev"]
title = "SAP NetWeaver AS JAVA 信息泄露漏洞"
updated = "2026-06-17T00:43:57Z"

