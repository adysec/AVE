[basic]
description = "Quest NetVault Backup 的 addclient3 网页存在跨站脚本认证绕过漏洞。该漏洞源于对用户提交数据缺乏充分验证，攻击者可向 addclient3 页面注入任意恶意脚本。未经身份认证的远程攻击者通过诱使目标用户访问包含恶意代码的网页或打开恶意文件，即可利用该漏洞绕过 Quest NetVault Backup 的认证机制，并可能结合其他漏洞以 SYSTEM 权限执行任意代码。该漏洞影响 Quest NetVault Backup 的相关版本，CVSS 评分 8.8，危害等级高。攻击成功需要用户交互，攻击者需引导用户访问恶意页面或打开恶意文件。"
published = "2026-06-25T00:17:48Z"
remediation = '请立即升级 Quest NetVault Backup 至 14.0.2 或更高版本，该版本已在 addclient3 网页中对用户输入进行了正确的验证，修复了跨站脚本认证绕过漏洞。升级前请务必将 \tmp 文件夹中保存好所有 .dlv 格式的许可证文件，以防升级后因许可证格式不兼容导致备份失败。如暂时无法升级，可在防火墙或反向代理层限制对 addclient3 网页的访问，阻止外部用户直接访问该页面，同时避免点击来源不明的链接或打开可疑文件，以降低被利用的风险。'
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "Quest NetVault Backup addclient3 跨站脚本认证绕过漏洞"
updated = "2026-06-26T02:04:10Z"

