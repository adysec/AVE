[basic]
description = "Windows 应用包安装程序（App Package Installer）存在权限提升漏洞，该漏洞源于对特权的错误处理（CWE-285）。本地攻击者可通过在目标系统上运行特制的应用程序包来触发该漏洞，成功利用后可获取系统级权限，实现完全控制受影响的系统。攻击者需要具备本地访问权限和低权限用户身份，无法远程利用。该漏洞影响多个 Windows 版本，包括 Windows 10、Windows 11 及 Windows Server 系列。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:47Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 KB5049981（Windows 10 22H2/21H2）或对应版本的累积更新。可通过 Windows Update 自动获取更新，或从 Microsoft 更新目录手动下载安装。对于 Windows 11 及其他受影响版本，请安装对应的 2025 年 1 月安全更新。如无法立即打补丁，建议限制非管理员用户安装 AppX 包的能力作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 应用包安装程序特权提升漏洞"
updated = "2026-06-17T08:42:58Z"

