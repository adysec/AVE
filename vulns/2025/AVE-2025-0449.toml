[basic]
description = "Google Chrome 141.0.7390.54 之前版本中的 Video 组件存在堆缓冲区溢出漏洞，该漏洞源于对视频数据处理时边界检查不严格，导致越界写入。远程攻击者可通过构造特制的 HTML 页面诱导用户访问，成功利用此漏洞可实现沙箱逃逸，造成机密性、完整性和可用性受损。CVSS 评分 7.1，危害等级高，用户交互为触发条件。"
published = "2025-11-06T22:15:38Z"
remediation = "立即将 Google Chrome 升级至 141.0.7390.54 或更高版本（通过设置→关于 Chrome 自动检查更新），该版本已修复 Video 模块中的堆缓冲区溢出漏洞。基于 Chromium 的浏览器（Microsoft Edge、Brave、Opera 等）需同步更新至对应修复版本。Fedora 43 用户应更新至 chromium-141.0.7390.122。无法立即升级时，可启用 Chrome 的站点隔离功能（chrome://flags/#site-isolation-trial-opt-out）作为临时缓解措施。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Google Chromium Video 堆缓冲区溢出漏洞"
updated = "2026-06-17T08:29:51Z"

