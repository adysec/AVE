[basic]
description = "Trlinux Postaci Webmail 1.1.3 的默认配置将 /includes/global.inc 配置文件直接放置于 Web 根目录下，未进行访问控制保护。远程攻击者无需任何身份认证，只需向目标服务器发送一次普通的 HTTP GET 请求，即可直接读取该配置文件，获取数据库用户名、密码等敏感信息。该漏洞影响所有使用 Postaci Webmail 1.1.3 默认配置的部署环境，攻击条件极为宽松，利用方式简单直接，危害等级较高。"
published = "2001-01-09T05:00:00.000"
remediation = '将 global.inc 文件从 Web 根目录移至 Web 根目录之外（如 /etc/postaci/），并修改文件权限为仅限管理员账户可读（chmod 600）。在 Apache/Nginx 中添加配置规则禁止访问 .inc 扩展名文件（如 Nginx 中 location ~ \.inc$ { deny all; }）。修改完成后，立即更换数据库密码以防止已泄露的凭据被继续利用。'
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Trlinux Postaci Webmail 密码泄露漏洞"
updated = "2026-06-16T21:53:08.807"

