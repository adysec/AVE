[basic]
description = "PrestaShop 的 ps_facetedsearch 分层导航筛选模块存在 PHP 对象注入漏洞。该模块从请求 URL 中重建筛选条件时，未对滑块筛选器（价格或重量）参数值进行充分校验，直接将其序列化后存入内部缓存，随后使用原生 `unserialize()` 反序列化读取。未经身份认证的远程攻击者可通过构造特制的恶意序列化 PHP 对象注入缓存，触发 gadget 链在模块目录下写入任意 PHP 文件作为 webshell，进而实现远程代码执行，完全控制服务器。该漏洞影响 ps_facetedsearch 3.0.0 至 4.0.3 版本，CVSS 评分 10.0，危害等级严重。官方已在 4.0.4 版本中修复，建议立即升级或替换 `Block.php` 中 `unserialize()` 为 `Tools::unSerialize()`。"
published = "2026-07-17T21:17:07Z"
remediation = '立即将 ps_facetedsearch 模块升级到 4.0.4 或更高版本。如无法立即升级，手动修改 src/Filters/Block.php 中 getFromCache() 方法，将 unserialize() 替换为 \Tools::unSerialize()；同时移除前台筛选模板中的价格和重量滑块筛选器，清除 faceted-search 过滤器缓存，并在 WAF 层面拦截包含 PHP 序列化特征（如 O:、;i:）的搜索请求。'
score = 10
severity = "CRITICAL"
sources = ["ghsa"]
title = "PrestaShop ps_facetedsearch PHP对象注入远程代码执行漏洞"
updated = "2026-07-23T16:04:11Z"

