[basic]
description = "FreeType 字库引擎在 2.4.9 之前版本中存在堆内存写入漏洞，远程攻击者可通过向目标用户发送特制的 TrueType 字体文件触发该漏洞，导致无效堆写入操作和内存破坏，进而造成拒绝服务或在受影响应用程序上下文中执行任意代码。该漏洞影响 Mozilla Firefox Mobile 10.0.4 之前版本及其他使用 FreeType 的产品，攻击者可通过诱导用户访问恶意网页或打开包含恶意字体的文件进行利用，CVSS 评分 9.3，危害严重。"
published = "2012-04-25T10:10:18Z"
remediation = "升级 FreeType 至 2.4.9 或更高版本。Red Hat 用户安装 RHSA-2012:0467 更新；Debian/Ubuntu 用户分别应用 DSA-2428 和 USN-1403-1 更新；Mozilla Firefox Mobile 升级至 10.0.4 以上；Apple iOS 升级至 6.0 以上。嵌入 FreeType 的第三方应用需同步更新库文件。如无法立即升级，可通过 Web 应用防火墙过滤包含畸形字体的请求作为临时缓解。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "FreeType FreeType 字体解析远程代码执行漏洞"
updated = "2026-06-16T23:39:07Z"

