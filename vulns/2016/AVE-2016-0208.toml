[basic]
description = "Microsoft Visio 在加载库文件时存在 OLE DLL 侧加载漏洞，由于程序未正确限制 DLL 搜索路径，本地攻击者可通过诱使用户打开特制的 Office 文档或应用程序，将恶意 DLL 放置在特定目录中，从而利用当前进程权限加载恶意代码，实现权限提升。该漏洞影响 Visio 2007 SP3、Visio 2010 SP2、Visio 2013 SP1、Visio 2016 及 Visio Viewer 等多个版本，CVSS 评分 7.8，危害等级高。攻击者需具备本地访问权限并诱导用户交互，成功利用后可获取与当前用户相同的系统权限。Microsoft 已在 MS16-070 安全公告中发布补丁修复此漏洞。"
published = "2016-06-16T01:59:36Z"
remediation = "立即安装 Microsoft 2016 年 6 月安全更新 MS16-070 (KB3163610)，通过 Windows Update 自动更新或从 Microsoft 下载中心手动安装对应版本的 Visio 更新：Visio 2007 SP3 安装 KB3114740，Visio 2010 SP2 安装 KB3114872，Visio 2013 SP1 安装 KB3115020，Visio 2016 安装 KB3115041，Visio Viewer 2007 SP3 安装 KB2596915，Visio Viewer 2010 安装 KB2999465。该漏洞无官方缓解措施，必须安装补丁修复。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Visio OLE DLL 侧加载远程代码执行漏洞"
updated = "2026-06-17T00:45:20Z"

