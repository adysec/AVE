[basic]
description = "Common Unix Printing System (CUPS) 1.1.14 至 1.1.17 版本存在多处整数溢出漏洞。未经身份认证的远程攻击者可通过向 CUPSd HTTP 接口发送特制请求，或通过 CUPS 过滤器中的图像处理代码触发整数溢出，导致堆缓冲区溢出，最终实现远程代码执行。该漏洞 CVSS 评分 10.0，攻击复杂度低且无需认证，可完全控制目标系统，危害严重。"
published = "2002-12-26T05:00:00Z"
remediation = "立即升级 CUPS 至 1.1.18 或更高版本。Red Hat 用户请安装 RHSA-2002:295 提供的更新包；SuSE Linux 用户应用 SuSE Security Advisory 2003-002 补丁。如无法升级，可在 CUPS 配置文件中禁用远程打印服务（注释掉 Listen 0.0.0.0:631 行，仅监听本地），并在防火墙阻断 631/tcp 端口的外部访问作为临时缓解。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "CUPS 整数溢出远程代码执行漏洞"
updated = "2026-06-16T21:59:13Z"

