[basic]
description = "Check Point VPN-1/FireWall-1 4.1及更早版本中的模块间认证机制（fwa1）存在安全绕过漏洞。远程攻击者无需任何身份认证即可通过网络向目标系统发送特制的模块间通信数据，绕过认证机制，导致防火墙服务拒绝响应，造成拒绝服务（DoS）。该漏洞影响Check Point FireWall-1 3.0/4.0/4.1等版本，CVSS评分5.0，危害等级中等。"
published = "2000-11-14T05:00:00.000"
remediation = "升级 Check Point FireWall-1 至 4.1 Service Pack 2 及以上版本，或升级至 VPN-1/FireWall-1 4.1 SP2。如无法升级，在防火墙上限制对 fwa1 模块（端口 256/TCP）的访问，仅允许受信任的管理网段 IP 连接，并启用严格认证策略作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Check Point VPN-1/FireWall-1 FWA1 模块间认证绕过拒绝服务漏洞"
updated = "2026-06-16T21:52:31.177"

