[basic]
description = "EServ 2.9.2 及更早版本的 FTP 服务器在日志记录功能中存在缓冲区溢出漏洞。当攻击者向目标服务器发送超长的 MKD（创建目录）FTP 命令时，由于日志模块未对输入长度进行有效校验，导致写入数据超出预分配缓冲区边界，覆盖相邻内存区域。经认证的远程攻击者可精心构造恶意 MKD 命令载荷，控制溢出数据覆写返回地址，从而在服务器进程上下文中执行任意系统命令，获取完全控制权。该漏洞 CVSS 评分 10.0，属于最高危害等级，影响 EServ 2.9.2 及其之前所有版本，攻击者无需特殊权限即可实现远程代码执行。"
published = "2000-06-06T04:00:00Z"
remediation = "立即将 EServ 升级至 2.9.2 之后的修复版本（如 EServ 3.x），若新版本不再可用则应彻底停用 EServ 并替换为仍在维护的代理服务器软件（如 Squid、Nginx）。升级前可先在防火墙或路由器上限制对 EServ 管理端口（默认 21/80/8080）的访问，仅允许可信 IP 连接，以阻断远程 MKD 命令的攻击路径。同时检查服务器日志中是否存在异常超长 MKD 请求记录，若已被利用须立即排查后门和数据泄露情况。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Etype Eserv FTP服务日志堆缓冲区溢出漏洞"
updated = "2026-06-16T21:51:55Z"

