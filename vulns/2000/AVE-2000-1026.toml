[basic]
description = "MySQL 可插拔认证模块（pam_mysql）在 0.4.7 版本之前存在 SQL 注入漏洞，该模块在构造 SQL 查询语句时未对用户输入进行充分过滤和净化，直接将用户可控数据拼接到 SQL 语句中执行。未经身份认证的远程攻击者可通过向使用 pam_mysql 进行身份验证的服务（如 SSH、FTP、登录服务等）提交特制输入，触发 SQL 注入，绕过正常认证流程并直接读取数据库中存储的明文密码或密码哈希值，进而获得对目标系统的未授权访问。该漏洞影响所有运行 Linux/Unix 系统并启用 pam_mysql 进行身份验证且版本低于 0.4.7 的环境。"
published = "2000-12-19T05:00:00Z"
remediation = "建议立即将 pam_mysql 升级至 0.4.7 或更高版本，该版本已修复用户输入未正确清理导致 SQL 注入的问题。若无法立即升级，可临时在 PAM 配置中注释或移除 pam_mysql.so 模块引用，并改用其他安全认证方式，同时监控数据库访问日志以检测异常 SQL 查询行为。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "MySQL PAM 模块 SQL 注入密码泄露漏洞"
updated = "2026-06-16T21:52:51Z"

