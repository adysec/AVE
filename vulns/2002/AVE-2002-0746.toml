[basic]
description = "PostNuke 0.703 的 user.php 文件存在 PHP 文件包含漏洞，未经身份认证的远程攻击者可通过构造包含 caselist 参数的特制 HTTP 请求，向目标系统引入并包含任意远程或本地文件。该漏洞影响使用 PostNuke 0.703 版本搭建的内容管理系统，攻击者成功利用后可读取敏感文件信息、包含恶意代码并可能实现远程代码执行，从而完全控制目标服务器。CVSS 评分 7.5，危害等级高危。"
published = "2002-12-31T05:00:00Z"
remediation = "PostNuke 0.703 已停止维护且未发布官方补丁，建议立即迁移至其继任项目 Zikula 或其他受支持的现代内容管理系统。若短期内无法迁移，可采取以下缓解措施：在 php.ini 中设置 open_basedir 限制 Web 根目录路径，禁用 allow_url_include 和 allow_url_fopen 指令，并在 Web 服务器层面配置 WAF 规则拦截 user.php 中 caselist 参数包含 http/ ftp/ php 等协议或绝对路径的请求。同时修改 user.php 代码，对 caselist 参数值进行白名单校验，仅允许包含已注册的模块文件，禁止任意文件包含。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "PostNuke 内容管理系统 caselist 任意文件包含漏洞"
updated = "2026-06-16T22:00:29Z"

