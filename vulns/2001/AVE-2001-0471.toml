[basic]
description = "ArGoSoft FTP Server 1.2.2.2 版本存在弱密码加密漏洞。该软件对用户密码采用弱加密算法存储，攻击者在获取到密码文件后，可通过逆向分析加密算法或暴力破解方式还原明文密码，进而以合法用户身份登录 FTP 服务器，获取服务器文件访问权限。该漏洞攻击复杂度低，无需身份认证即可利用，影响运行 ArGoSoft FTP Server 1.2.2.2 的系统。"
published = "2001-07-12T04:00:00Z"
remediation = "ArGoSoft FTP Server 1.2.2.2 使用弱加密算法存储用户密码，攻击者获取密码文件后可破解明文密码。建议立即升级到 ArGoSoft FTP Server 1.4.3.5 或更高版本（该版本修复了弱密码加密问题）；如厂商已停止维护，应迁移至 FileZilla Server 或 vsftpd 等活跃维护的 FTP 服务器软件，并启用强密码策略和加密传输（FTPS/SFTP）。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "ArGoSoft FTP Server 弱密码加密漏洞"
updated = "2026-06-16T21:55:40Z"

