[basic]
description = "tags format.<value>Apple Safari 6.0 之前的版本中，WebKit 引擎存在内存破坏漏洞。远程攻击者可通过构造恶意网站，利用该漏洞在目标系统上执行任意代码或导致拒绝服务（内存损坏与应用崩溃）。该漏洞影响 Safari 浏览器及其 WebKit 组件，攻击条件为用户访问包含恶意内容的网页。CVSS 评分为 9.3，危害等级严重。Apple 已在 Safari 6.0 中修复此漏洞。"
published = "2012-07-25T20:55:04.617"
remediation = "立即将设备升级至 Apple iOS 6.0 或更高版本，或升级至 Safari 6.0。iOS 用户可通过「设置」→「通用」→「软件更新」检查并安装 Apple 2012 年 7 月安全更新 (APPLE-SA-2012-07-25-1)。企业管理员可通过移动设备管理 (MDM) 平台强制推送该更新。如无法立即升级，可在 Safari 中禁用 JavaScript 作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:43.183"

