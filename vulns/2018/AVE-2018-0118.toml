[basic]
description = "FUEL CMS 1.4.1 存在 PHP 代码注入漏洞，攻击者无需身份认证即可通过 pages/select/ 接口的 filter 参数或 preview/ 接口的 data 参数注入恶意 PHP 代码，实现远程代码执行。该漏洞源于程序对用户输入过滤不严，导致攻击者可完全控制目标服务器，获取系统权限。CVSS 评分 9.8，危害等级严重，影响所有运行 FUEL CMS 1.4.1 版本的系统。"
published = "2018-09-09T21:29:00Z"
remediation = "立即升级至 FUEL CMS 1.4.13 或更高版本（最新版为 1.5.2）。1.4.13 版本已包含安全补丁 commit b14b294，移除了 `fuel_model` 函数默认配置中的 `parser_allowed_functions` 选项，并新增 `allow_inline_actions` 配置项。如无法立即升级，可在 `fuel/application/config/MY_fuel.php` 中将 `parser_allowed_functions` 配置项清空，禁止在模板中执行 PHP 代码，同时在 Web 服务器（Nginx/Apache）层面限制对 `/fuel/pages/select/` 和 `/fuel/preview` 路径的未授权访问。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "FUEL CMS 1.4.1 远程代码执行漏洞"
updated = "2026-06-17T01:44:46Z"

