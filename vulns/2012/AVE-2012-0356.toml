[basic]
description = "Apple Safari 6.0 之前版本所使用的 WebKit 浏览器引擎存在内存破坏漏洞。远程攻击者可通过构造恶意网站向目标系统发送特制的网页内容，利用 WebKit 在处理网页渲染过程中的内存管理缺陷触发缓冲区溢出，最终实现任意代码执行或导致应用程序崩溃拒绝服务。该漏洞影响 Mac OS X 及 iOS 平台使用旧版 Safari 浏览器的用户，攻击者无需任何身份认证即可在受害者访问恶意网页时完成利用。CVSS 评分 9.3，危害等级严重。Apple 已在 iOS 6 及 Safari 6.0 安全更新中修复此漏洞，受影响用户应尽快升级至最新版本。"
published = "2012-07-25T20:55:04.680"
remediation = '升级 Apple Safari 浏览器至 6.0 或更高版本，iOS 设备升级至 iOS 6.0 或更高版本。Mac 用户可通过"系统偏好设置"中的"软件更新"或访问 https://support.apple.com/zh-cn/HT5503 下载安全更新。如无法立即升级，可临时使用其他浏览器（如 Chrome 或 Firefox）访问可疑网站，并避免点击来源不明的链接或打开未知网页。'
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:43.307"

