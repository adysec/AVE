[basic]
description = "DriveLock 数据库服务存在 SQL 注入漏洞，默认监听 TCP 4568 端口。攻击者需先通过身份认证后，向 Web 服务提交经过精心构造的恶意输入，由于系统未对用户提供的字符串进行充分的输入验证和参数化处理，直接将用户输入拼接到 SQL 查询语句中执行，从而绕过权限限制获取本不应访问的受保护资源。该漏洞影响 DriveLock 所有受影响版本，CVSS 评分为 8.8，属于高危级别。"
published = "2026-07-29T20:17:05.893"
remediation = "立即将 DriveLock 升级至 25.2.4 或更高版本（受影响版本包括 <=24.2.8、<=25.1.6、<=25.2.3）。若暂时无法升级，可在 Web 服务前端部署 WAF 规则拦截 RQL 注入请求，并限制对 TCP 4568 端口的访问来源。"
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "DriveLock SQL注入权限提升漏洞"
updated = "2026-07-31T04:17:24.013"

