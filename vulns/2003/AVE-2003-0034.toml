[basic]
description = "tcpdump 3.6 至 3.7.1 版本的 ISAKMP 协议解析器中的 isakmp_sub_print 函数存在拒绝服务漏洞。远程攻击者无需身份认证即可向目标系统监听的 UDP 500 端口发送特制的畸形 ISAKMP 数据包，触发解析器进入无限循环，导致 CPU 资源被耗尽，造成拒绝服务。该漏洞影响 tcpdump 3.6、3.6.2、3.7、3.7.1 等多个版本，攻击条件简单（仅需网络可达），CVSS 评分 5.0，危害等级中危。官方建议升级至 tcpdump 3.8 及以上版本修复此漏洞。"
published = "2003-03-07T05:00:00Z"
remediation = "升级 tcpdump 至 3.7.2 或更高版本。Debian 用户安装 DSA-255 更新包，Red Hat 用户应用 RHSA-2003:032/RHSA-2003:085/RHSA-2003:214 安全更新。如无法立即升级，可在防火墙上限制 UDP 端口 500 的入站流量，或避免在不可信网络上以 root 权限运行 tcpdump 抓包。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "LBL tcpdump ISAKMP 解析器拒绝服务漏洞"
updated = "2026-06-16T22:01:32Z"

