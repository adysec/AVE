[basic]
description = "Apple QuickTime 在解析电影文件中嵌入的字体表时存在整数符号转换错误，攻击者可构造包含特制字体表的恶意电影文件，诱骗用户使用受影响版本的 QuickTime 打开该文件，从而触发内存损坏漏洞，实现任意代码执行或导致应用程序崩溃拒绝服务。该漏洞影响 QuickTime 7.7.1 之前的所有版本，攻击者可通过网络发送恶意文件或诱导用户从本地/远程打开 crafted movie 文件，在用户无需额外操作的情况下完全控制受影响系统。CVSSv2 评分 9.3，危害等级严重。"
published = "2011-10-28T02:49:52Z"
remediation = "Windows 用户请立即升级 QuickTime 至 7.7.1 或更高版本，可从 Apple 官网下载安装程序；Mac OS X Snow Leopard 用户请安装 Security Update 2012-001，OS X Lion 用户请升级至 v10.7.3 或更高版本，上述更新均可通过系统软件更新功能自动获取。如短期内无法完成升级，建议在防火墙或邮件网关处拦截包含 .mov、.qt 等 QuickTime 电影文件格式附件的传入流量，并在浏览器中禁用或卸载 QuickTime 浏览器插件，以阻止攻击者通过恶意构造的嵌入字体表文件触发远程代码执行。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime 电影文件字体表整数符号错误远程代码执行漏洞"
updated = "2026-06-16T23:32:57Z"

