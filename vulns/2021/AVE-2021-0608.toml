[basic]
description = "GitLab CE/EE 未对用户上传的图片文件进行严格校验，攻击者可上传包含恶意元数据的特制图片，当 GitLab 使用 ExifTool 解析该图片文件时会触发远程命令执行，导致在服务器上执行任意系统命令。该漏洞影响 GitLab 11.9 至 13.10.1 版本，未经身份认证的远程攻击者仅需向目标 GitLab 实例上传恶意图片即可利用，攻击成功后可完全接管服务器，且已在野利用中被广泛使用。"
published = "2021-04-23T18:15:08Z"
remediation = "建议立即将 GitLab CE/EE 升级至 13.10.3、13.9.6 或 13.8.8 及以上安全版本，受影响版本为 11.9 起至 13.10.2、13.9.5、13.8.7。升级前请先通过 Omnibus 包管理器或 Helm Chart 执行完整备份，随后按照官方安全版本发布说明逐步更新并重启 GitLab 服务。如短期内无法完成升级，可在 GitLab 前端反向代理层（如 Nginx）对 `/uploads/user` 等上传接口实施严格的 Content-Type 校验与文件头检查，同时限制上传文件的 MIME 类型仅允许白名单内的图片格式，禁止解析 DjVu、PSD 等含脚本元数据的图像文件，以临时缓解该漏洞风险。"
score = 10
severity = "CRITICAL"
sources = ["kev"]
title = "GitLab CE/EE 远程代码执行漏洞"
updated = "2026-08-06T05:16:35Z"

