[basic]
description = "Google Chrome 20.0.1132.43 之前版本中存在释放后重用（Use-after-free）漏洞，该漏洞源于程序在处理 SVG 引用时未能正确管理内存对象的生命周期。远程攻击者可通过诱使用户访问包含特制 SVG 元素的恶意网页触发该漏洞，成功利用可导致浏览器崩溃（拒绝服务），甚至可能实现任意代码执行。该漏洞影响所有 Chrome 20.0.1132.43 之前版本，CVSS 评分 7.5，危害等级高。"
published = "2012-06-27T10:18:39.353"
remediation = "升级 Google Chrome 至 20.0.1132.43 或更高版本。打开 chrome://settings/help 检查并自动更新，或从 google.com/chrome 下载最新版手动安装。如无法升级，可在浏览器设置中禁用 JavaScript 并安装 NoScript 等扩展阻止 SVG 恶意引用作为临时缓解。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome SVG引用释放后使用漏洞"
updated = "2026-06-16T23:42:10.953"

