[basic]
description = 'Solaris 系统的行打印守护进程（in.lpd）存在缓冲区溢出漏洞，该漏洞影响 Solaris 8 及更早版本。攻击者可通过特制的"传输作业"请求触发缓冲区溢出，无需身份验证即可利用该漏洞，成功利用后可获得目标系统的 root 权限。该漏洞同时影响本地和远程攻击场景，CVSS 评分达到满分 10.0，危害等级为严重。'
published = "2001-07-21T04:00:00Z"
remediation = "立即安装 Sun 安全补丁：Solaris 8 安装补丁 108993-01（或更高版本），Solaris 7 安装补丁 106803-01（或更高版本），Solaris 2.6 安装补丁 105807-01（或更高版本）。补丁可从 sunsolve.sun.com 下载（需 Sun 支持合同）。若无法立即打补丁，编辑 /etc/inetd.conf 注释掉 printer 行（printer stream tcp wait root /usr/lib/print/in.lpd in.lpd），然后执行 pkill -HUP inetd 重载配置以禁用 in.lpd 服务；或使用 inetadm disable svc:/network/print/server 禁用打印服务。建议升级到 Solaris 9 或更高版本彻底解决。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Sun Solaris 行式打印机守护进程缓冲区溢出漏洞"
updated = "2026-06-16T21:54:09Z"

