[basic]
description = "OpenClaw 的 Canvas 端点认证功能存在身份验证绕过漏洞。该漏洞源于认证机制实现不当，未经身份认证的远程攻击者无需任何凭证即可利用此漏洞，通过向目标系统发送特制的请求绕过 Canvas 端点的身份验证检查，从而获取对系统的未授权访问权限，导致机密性和完整性受到高等级影响。该漏洞影响 OpenClaw 相关版本，CVSS 评分 7.4，危害等级高。目前厂商已发布安全公告 GHSA-vvjh-f6p9-5vcf 提供修复方案。"
published = "2026-04-11T01:16:15Z"
remediation = "立即升级 OpenClaw 至 2026.2.19 或更高版本（commit c45f3c5b），该版本修复了 `authorizeCanvasRequest()` 中基于 IP 的认证绕过逻辑。如无法升级，在网关配置中将 `--bind lan` 改为 `--bind loopback` 仅监听本地回环地址，或通过反向代理（如 Nginx）在网关前增加独立 token 校验层，禁止从共享 IP 环境（NAT/K8s/Docker）直接暴露 canvas 端点（`/__openclaw__/a2ui/`、`/__openclaw__/canvas/`、`/__openclaw__/ws`）。"
score = 7.4
severity = "HIGH"
sources = ["zdi"]
title = "OpenClaw Canvas 身份验证绕过漏洞"
updated = "2026-06-17T10:44:00Z"

