[basic]
description = "Interbase 6 SuperServer for Linux 存在拒绝服务漏洞，攻击者可通过向数据库服务器发送包含 0 字节的特制查询请求，导致服务进程崩溃或停止响应。该漏洞源于服务器对畸形查询请求的处理缺陷，未对输入数据进行充分校验。攻击者需具有本地访问权限，无需身份认证即可触发，影响 Interbase 6 版本在 Linux 平台上的稳定运行。由于 CVSS 评分仅 2.1，危害等级较低，但可能导致业务中断。"
published = "2000-11-14T05:00:00Z"
remediation = "升级至 InterBase 6 Service Pack 1 或更高版本，该补丁修复了零字节查询导致服务崩溃的问题。如无法升级，限制本地用户对 InterBase SuperServer 的访问权限，仅允许受信任的管理员账户连接数据库服务。对于仍在使用该版本的环境，建议迁移至受支持的 InterBase 2020 或更高版本。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "Borland Interbase 6 SuperServer 拒绝服务漏洞"
updated = "2026-06-16T21:52:37Z"

