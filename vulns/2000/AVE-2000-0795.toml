[basic]
description = "PostACI Webmail 1.1.3 默认安装配置存在安全缺陷，系统将包含数据库连接凭据的 /includes/global.inc 配置文件直接放置在 Web 根目录下。远程攻击者无需任何身份认证，仅通过向目标服务器发送直接的 HTTP GET 请求即可访问该配置文件，从而获取数据库用户名、密码等敏感信息。攻击者可利用泄露的数据库凭据进一步入侵后端数据库系统，导致数据泄露、篡改或服务器被完全控制。"
published = "2001-01-09T05:00:00.000"
remediation = "将 /includes/global.inc 配置文件移出 Web 根目录（如移至上级目录），或通过 Web 服务器配置（如 Apache 的 <Files> 指令或 .htaccess）禁止直接访问 /includes/ 路径下的 .inc 文件，同时限制该目录的 HTTP GET 请求。升级至已修复此问题的最新版本。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Trlinux Postaci Webmail 默认配置文件敏感信息泄露漏洞"
updated = "2026-06-16T21:53:08.807"

