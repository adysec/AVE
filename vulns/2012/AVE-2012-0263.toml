[basic]
description = "Linux内核中net/rds/recv.c文件内的rds_recvmsg函数在3.0.44版本之前未正确初始化某个结构体成员。本地低权限攻击者可通过在RDS（Reliable Datagram Sockets）套接字上发起recvfrom或recvmsg系统调用来触发该漏洞，从而读取内核栈内存中的残留敏感数据，造成本地信息泄露。该漏洞影响Linux内核2.6.x至3.0.43版本，攻击者需具有本地访问权限才能利用。"
published = "2012-10-03T11:02:56.533"
remediation = "升级 Linux 内核至 3.0.44 或更高版本，以修复 net/rds/recv.c 中 rds_recvmsg() 函数未正确初始化 msg_namelen 导致的本地信息泄露漏洞。主流发行版用户应安装各自安全公告中的修复内核：Debian Squeeze 升级至 2.6.32-36，Ubuntu 12.04 升级至 3.2.0-31.50 或 3.0.0-26.42，Red Hat/CentOS 应用对应 RHSA 公告。如暂无法升级，可临时卸载 RDS 内核模块（执行 rmmod rds 或向 /etc/modprobe.d/disable-rds.conf 写入 blacklist rds），并重启系统使配置生效，以阻止本地用户通过 recvfrom/recvmsg 系统调用读取内核栈内存。"
score = 2.1
severity = "LOW"
sources = ["tenable"]
title = "Linux Kernel RDS 套接字本地信息泄露漏洞"
updated = "2026-06-16T23:43:12.590"

