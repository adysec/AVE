[basic]
description = "Network Associates Net Tools PKI Server 1.0 的 HTTP Server 组件存在拒绝服务漏洞。远程攻击者可通过向目标服务器发送超长的 HTTP 请求，导致服务进程崩溃或停止响应，造成拒绝服务。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响 Net Tools PKI Server 1.0 版本。CVSS 评分 5.0，危害等级中等。"
published = "2000-06-19T04:00:00Z"
remediation = "立即从 ftp://ftp.tis.com/gauntlet/hide/pki/hotfix.txt 下载并安装官方热修复补丁。该补丁通过限制 HTTP 请求长度来防止缓冲区溢出导致的拒绝服务。如无法获取补丁，可在防火墙或反向代理层面设置 HTTP 请求 URI 长度上限（建议不超过 1024 字节），并过滤异常长请求。由于 Net Tools PKI Server 1.0 已停止维护，建议迁移至受支持的 PKI 服务器产品。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Network Associates Net Tools PKI Server 1.0 HTTP Server 拒绝服务漏洞"
updated = "2026-06-16T21:51:55Z"

