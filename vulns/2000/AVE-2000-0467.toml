[basic]
description = "SawMill 5.0.21 CGI 程序存在信息泄露漏洞，远程攻击者可通过向 rfcf 参数传递目标文件路径，使 SawMill 尝试将该文件内容解析为配置命令，从而读取任意文件的第一行。该漏洞影响 Flowerfire Sawmill 5.0.21 版本，攻击者无需身份认证即可利用，危害等级中危，可能导致敏感信息泄露。目前官方已发布更新版本修复此问题。"
published = "2000-06-26T04:00:00Z"
remediation = "升级 Sawmill 至 5.0.22 或更高版本，该漏洞在后续版本中已修复。如无法升级，可在 Web 服务器层面（如 Apache/Nginx）限制对 cgi-bin/sawmill.cgi 的访问，仅允许受信任 IP 访问，或移除该 CGI 脚本的 SUID 权限。同时检查并过滤 rfcf 参数输入，禁止包含路径遍历字符（如 ../）。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Flowerfire Sawmill 5.0.21 CGI 任意文件读取漏洞"
updated = "2026-06-16T21:52:03Z"

