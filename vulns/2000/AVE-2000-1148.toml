[basic]
description = "Apache HTTP Server 1.3.11 及更早版本在使用 mod_rewrite 进行大规模虚拟主机配置时，以及 Apache HTTP Server 1.3.9 在使用 mod_vhost_alias 模块时，存在任意文件读取漏洞。由于模块在处理虚拟主机映射时对用户控制的输入缺乏充分验证，未经身份认证的远程攻击者可通过构造特制的 HTTP 请求，利用路径遍历技术读取服务器上的任意文件内容。该漏洞影响使用上述配置方式部署的 Apache 服务器，攻击者无需任何凭据即可获取敏感文件信息，可能导致源代码、配置文件或系统文件泄露。攻击者仅需向目标服务器发送包含目录遍历序列（如 ../）的 HTTP 请求，即可突破虚拟主机目录限制，访问到 Web 根目录之外的任意文件。"
published = "1999-08-20T04:00:00Z"
remediation = "将 Apache httpd 升级至 1.3.11 或更高版本。如暂无法升级，可在 httpd.conf 中注释掉 LoadModule rewrite_module 和 LoadModule vhost_alias_module 两行以禁用相关模块，或限制 DocumentRoot 目录权限，防止外部访问敏感文件。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Apache httpd 任意文件读取漏洞"
updated = "2026-06-16T21:53:22Z"

