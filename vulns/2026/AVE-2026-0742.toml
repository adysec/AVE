[basic]
description = "Cedar-Java 是 CNCF 开源项目 Cedar 策略语言的 Java 实现，用于应用程序的细粒度授权决策。在 4.9.0 之前版本中，EntityIdentifier.equals() 方法对 null 引用和自引用的检查逻辑被颠倒，导致对 null 对象比较时返回 true、对自身对象比较时返回 false，造成不正确的相等性判断。该漏洞影响所有使用 Cedar-Java 库进行自定义实体标识符比较的集成应用程序，攻击者可通过构造特定输入触发异常相等比较行为，绕过授权检查或导致业务逻辑错误。此问题不会影响由 Rust 核心从 JSON 计算的 Cedar 授权决策，但会影响在 Java 层自行调用 equals() 进行安全敏感比较的代码路径。建议用户升级至 Cedar-Java 4.9.0 或更高版本以修复此问题。"
published = "2026-07-13T20:16:48.453"
remediation = "升级到 CedarJava 4.9.0 或更高版本。在升级前，将代码中所有依赖 EntityIdentifier.equals() 进行安全敏感判断的逻辑替换为显式的空值检查与身份比较，避免使用被篡改的 equals 方法。"
score = 8.8
severity = "HIGH"
sources = ["ghsa"]
title = "Cedar-Java 实体标识符相等性比较逻辑反转漏洞"
updated = "2026-07-14T15:17:04.773"

