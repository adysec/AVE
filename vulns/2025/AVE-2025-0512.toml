[basic]
description = "Google Chrome 的 V8 JavaScript 引擎存在竞态条件漏洞（CWE-362），攻击者可通过构造特制的 HTML 页面触发该漏洞，导致堆内存损坏。远程攻击者需要诱使用户访问恶意页面，成功利用后可实现任意代码执行，造成机密性、完整性和可用性全面受损。该漏洞影响 Chrome 142.0.7444.59 之前的所有版本，CVSS 评分 8.8，危害等级高。Google 已在 2025 年 10 月 28 日发布的稳定版更新中修复此漏洞。"
published = "2025-11-10T20:15:37Z"
remediation = "立即升级 Google Chrome 至 142.0.7444.59 及以上版本（Chromium 用户升级至对应版本），可通过 Chrome 设置 > 关于 Chrome 自动检查更新。基于 Chromium 的浏览器（如 Edge、Brave 等）请同步更新至厂商发布的最新版本。Fedora 42 用户执行 `sudo dnf update chromium` 升级至 142.0.7444.162。无法立即升级时，可禁用 V8 JIT 编译（设置 `--jitless` 标志）作为临时缓解，但会显著影响性能。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 引擎竞争条件漏洞"
updated = "2026-06-17T08:32:22Z"

