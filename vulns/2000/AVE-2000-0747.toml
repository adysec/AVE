[basic]
description = "Alabanza Control Panel 3.0 的 nsManager.cgi CGI 程序存在严重的权限绕过漏洞，该程序在未对用户进行身份认证的情况下允许直接访问管理命令。远程攻击者无需提供用户名和密码，仅需通过构造特制的 HTTP 请求 URL 即可访问域名管理功能，实现对域名注册信息的未授权修改、添加或删除操作。该漏洞影响使用 Alabanza 虚拟主机托管服务的网站及经销商，攻击者可借此篡改 MX 和 CNAME 记录，甚至将恶意域名添加至目标服务器，进而导致服务中断或用于进一步的域名劫持攻击。CVSS 评分 7.5，危害等级为高危。"
published = "2000-12-11T05:00:00.000"
remediation = "Alabanza 已停止运营且未发布修复补丁，建议立即从服务器中删除或禁用 /cp/rac/nsManager.cgi 脚本，并将域名管理迁移至 BIND、PowerDNS 或云服务商提供的受支持 DNS 管理平台。作为临时缓解措施，可在 Apache 或防火墙层面通过 .htaccess 或 IP 访问控制列表限制 /cp/rac/ 目录的访问权限，仅允许可信管理 IP 访问。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Alabanza Control Panel 未授权访问远程修改域漏洞"
updated = "2026-06-16T21:52:59.573"

