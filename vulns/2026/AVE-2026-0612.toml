[basic]
description = "Coder 远程开发环境平台的工作区应用子域名代理存在 CORS 源校验绕过漏洞。当工作区名称的子域名段被解析为 UUID 时，系统仅通过 ID 解析工作区而未验证 URL 中的用户名是否与真实所有者匹配，同时 CORS 中间件信任了未经核验的主机名用户名。已认证的攻击者可构造包含自身工作区 UUID 和受害者用户名的恶意子域名 URL，诱使已登录的受害者访问后，攻击者的 JavaScript 可发起携带凭据的跨域 fetch() 请求读取受害者工作区应用中的敏感数据，导致信息泄露。该漏洞需要启用通配符子域名应用路由且受害者主动访问恶意链接方可利用，影响 Coder 2.34.2 之前的多条发布线。"
published = "2026-07-08T01:16:28Z"
remediation = "立即升级 Coder 至修复版本：v2.34.2、v2.33.8、v2.32.7 或 v2.29.17（ESR），具体根据当前使用的发布线选择对应版本。升级后重启 Coder 服务使补丁生效。该漏洞无临时缓解措施，必须通过版本升级修复。"
score = 5.8
severity = "MEDIUM"
sources = ["ghsa"]
title = "Coder Coder workspace app CORS 校验绕过漏洞"
updated = "2026-07-08T19:38:38Z"

