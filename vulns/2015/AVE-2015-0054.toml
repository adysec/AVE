[basic]
description = "Joomla CMS 3.2至3.4.4版本中存在SQL注入漏洞，远程攻击者无需身份认证即可通过特制的HTTP请求向数据库注入恶意SQL语句，导致数据库信息泄露、数据篡改甚至获取管理员权限。该漏洞影响范围广泛，攻击复杂度低，CVSS评分7.5，危害等级高。官方已在3.4.4版本中修复此漏洞，建议用户及时升级。"
published = "2015-10-29T20:59:08Z"
remediation = "立即升级 Joomla CMS 至 3.4.4 或更高版本，该版本已修复 /components/com_contenthistory/ 中的 SQL 注入漏洞。如无法立即升级，可临时禁用 com_contenthistory 组件或通过 Web 应用防火墙（WAF）拦截包含恶意 SQL 语句的请求作为缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Joomla CMS 3.2至3.4.4版本 SQL注入漏洞"
updated = "2026-06-17T00:32:12Z"

