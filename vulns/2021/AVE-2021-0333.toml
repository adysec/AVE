[basic]
description = "Google Chrome 浏览器的 V8 JavaScript 引擎存在类型混淆漏洞。该漏洞源于 V8 引擎在处理特定数据时无法正确区分变量类型，导致攻击者可通过精心构造的 HTML 页面触发类型混淆，在沙箱环境内执行任意恶意代码。该漏洞影响 Chrome 90.0.4430.85 之前的版本，攻击者需诱导用户访问恶意网页以触发利用，攻击条件为需用户交互，但网络攻击向量为特定网络的远程攻击，且无需预先认证。该漏洞 CVSS 评分 8.8，危害等级为高危，一旦成功利用可能导致信息泄露、权限提升及任意代码执行等严重后果。Google 已在 90.0.4430.85 版本中修复该漏洞，建议用户及时升级至该版本或更高版本以规避风险。"
published = "2021-04-26T17:15:08Z"
remediation = "立即将 Google Chrome 升级至 90.0.4430.85 或更高版本，或通过浏览器「设置 → 关于 Chrome」自动更新到最新稳定版；启用 Chrome 自动更新策略，确保企业环境通过组策略/管理后台统一推送补丁。该漏洞已被恶意利用（CISA KEV 收录），务必尽快升级，并检查浏览器是否启用了「允许自动更新」。若使用基于 Chromium 的第三方浏览器（Edge、Chrome for Testing 等），需同步更新至对应修复版本。建议同时提醒用户不要访问来历不明的网页或点击可疑链接，作为补丁部署前的临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome V8 引擎类型混淆远程代码执行漏洞"
updated = "2026-06-17T03:35:04Z"

