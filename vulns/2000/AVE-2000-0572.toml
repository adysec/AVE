[basic]
description = "明尼苏达大学 (UMN) Gopherd 2.x 版本中的 Halidate 函数存在缓冲区溢出漏洞。漏洞原理是程序在处理 DES 密钥生成请求 (GDESkey) 时，未能对输入的 ticket 字段进行有效的长度检查，导致特制的数据可以覆盖内存缓冲区。远程未经身份验证的攻击者可通过向目标 Gopher 服务发送包含超长 ticket 值的恶意请求，触发该溢出漏洞，从而在目标系统上执行任意代码或命令。该漏洞影响所有使用 Gopherd 2.x 的系统，CVSS 评分 10.0，危害等级为严重。"
published = "2000-10-20T04:00:00Z"
remediation = "由于 UMN Gopherd 2.x 为极旧的过时软件且已停止维护，建议立即停止运行该服务并将其替换为安全的现代替代方案（如 HTTPS 站点）。若必须保留，请在防火墙中禁用 Gopher 默认端口（70）以阻断远程攻击路径。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "University of Minnesota Gopherd 2.x 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:23Z"

