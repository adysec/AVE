[basic]
description = "tags.<value>Dell EMC iDRAC7和iDRAC8在2.52.52.52之前的版本中存在CGI注入漏洞（CWE-94，代码注入）。该漏洞源于程序在处理CGI变量时未对输入进行充分的过滤与校验，未经身份认证的远程攻击者可通过向目标服务器管理接口发送特制的HTTP请求，在CGI变量中注入恶意代码并使其执行，从而实现远程代码执行。攻击者无需任何凭据即可利用该漏洞，影响范围覆盖iDRAC7和iDRAC8系列固件；一旦利用成功，攻击者可完全控制受影响主机，CVSS评分9.8，危害等级严重。"
published = "2018-03-23T14:29:00Z"
remediation = "立即将 Dell EMC iDRAC7/iDRAC8 固件升级至 2.52.52.52 或更高版本，此版本修复了 /cgi-bin/login、/cgi-bin/putfile 等 CGI 接口的参数注入问题。若暂时无法升级，应通过防火墙将 iDRAC 管理端口（TCP 443/80）限制为仅可信管理网段访问，禁止暴露到互联网，并关闭不必要的 CGI 接口。同时修改默认管理员口令、启用会话超时与访问日志监控，以便及时发现异常登录与文件上传行为。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Dell EMC iDRAC7和iDRAC8 CGI注入远程代码执行漏洞"
updated = "2026-06-17T01:50:42Z"

