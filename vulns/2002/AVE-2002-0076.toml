[basic]
description = 'tags.<value>Common Unix Printing System（CUPS）1.1.14 至 1.1.17 版本存在认证绕过漏洞，攻击者无需任何身份验证即可通过发送特制的 UDP 数据包向目标系统添加打印机。该漏洞利用 CUPS 在处理打印机添加请求时未正确校验权限的缺陷，攻击者可借此执行未授权操作，例如通过管理界面的"需要授权"页面窃取本地 root 证书，从而获取管理权限并进一步控制受影响的 Unix/Linux 系统。该漏洞影响 CUPS 1.1.14、1.1.15、1.1.16 和 1.1.17 所有版本，CVSS 评分 10，危害等级严重。'
published = "2002-12-26T05:00:00Z"
remediation = "建议将 CUPS 升级至 1.1.18 或更高版本。若无法立即升级，可通过防火墙策略拦截进入 631 端口的 UDP 流量，或在配置文件中限制 CUPS 仅监听本地回环地址，以阻断远程未授权添加打印机的攻击路径。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "CUPS 远程未授权添加打印机漏洞"
updated = "2026-06-16T21:59:11Z"

