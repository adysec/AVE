[info]
author = "ave"
description = "AVE-2026-1214 verification"
id = "POC-AVE-2026-1214"
name = "PoC for AVE-2026-1214"
severity = "medium"
tags = ["ave-2026-1214"]
vuln_id = [
    "AVE-2026-1214",
    "CVE-2026-5491",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/vuln/path"
protocol = "http"

[poc.requests.body]
content = '{"key":"value"}'
type = "json"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["vulnerable"]
