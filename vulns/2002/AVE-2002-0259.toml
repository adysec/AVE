[basic]
description = "Ethereal（后更名为 Wireshark）0.9.5 及之前版本的 ISIS 协议解析器中存在缓冲区溢出漏洞。远程攻击者可向目标系统发送特制的畸形 ISIS 协议数据包，触发解析器在内存处理过程中发生缓冲区溢出，导致拒绝服务或任意代码执行。攻击无需身份验证，通过网络即可完成。该漏洞影响 Ethereal 0.9.5 及更早版本，CVSS 评分 7.5，危害等级高。"
published = "2002-09-24T04:00:00Z"
remediation = "升级 Ethereal 至 0.9.6 或更高版本，该版本修复了 ISIS 解析器中的缓冲区溢出问题。无法立即升级时，可在防火墙上禁用 ISIS 协议流量（TCP 端口 116 或原始 ISIS 数据包），或使用入侵检测系统拦截畸形的 ISIS 报文作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Ethereal ISIS解析器缓冲区溢出漏洞"
updated = "2026-06-16T21:58:13Z"

