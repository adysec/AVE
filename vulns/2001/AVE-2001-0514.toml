[basic]
description = "3Com SuperStack II PS Hub 40 等设备的 Telnet 服务存在弱密码保护漏洞。该设备的 Telnet 服务器在收到错误的用户名或密码后，不会增加延迟或主动断开连接，导致远程攻击者可以通过暴力破解方式持续尝试登录凭据，直至获得有效账号密码。攻击者无需身份认证即可从网络远程发起攻击，一旦成功获取访问权限，可完全控制目标设备，造成信息泄露、网络中断等严重后果。该漏洞影响 3Com SuperStack II PS40 等系列设备，CVSS 评分 9.8，危害等级严重。厂商已发布安全更新，建议用户升级固件或禁用 Telnet 服务改用 SSH。"
published = "2001-07-12T04:00:00Z"
remediation = "建议立即在网络边界防火墙或 ACL 策略中禁止来自非信任网段的 Telnet（TCP 23）访问 3Com SuperStack II PS Hub 40 设备；若设备支持 SSH，请禁用 Telnet 并启用 SSH 管理；配置强密码策略（≥12 位含大小写数字特殊字符）并定期轮换；若设备支持 RADIUS/TACACS+ 认证，请接入集中认证并启用账号锁定策略（如 5 次失败锁定 15 分钟）；设备已停产停维，无厂商补丁可用，条件允许时请尽快更换为支持 SSHv2、具备暴力破解防护的现代网络设备。"
score = 9.8
severity = "CRITICAL"
sources = ["exploitdb"]
title = "3Com SuperStack II PS Hub 40 弱密码保护漏洞"
updated = "2026-06-16T21:55:58Z"

