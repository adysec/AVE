[basic]
description = "Linux 内核 vsock 子系统中，vsock_*_has_data() 和 vsock_*_has_space() 函数在 socket 从 transport 解除分配后仍可能被调用，未对空指针进行充分校验，导致空指针解引用。本地低权限攻击者可通过特定操作触发该漏洞，造成内核崩溃或拒绝服务，影响包含 vsock 功能的内核版本，攻击者需具备本地访问权限且无需用户交互即可利用。修复方式为在这些函数中增加空指针检查，当检测到空指针时返回 0 并发出警告，以保持代码运行一致性。"
published = "2025-01-31T12:15:27Z"
remediation = "立即升级 Linux 内核至修复版本：5.15.177、6.1.127、6.6.74、6.12.11 或更高版本。Debian 用户可升级到 5.10.234-1、6.1.128-1 或 6.12.11-1；Ubuntu 22.04 LTS 用户升级到 5.15.0-1077.83。如无法立即打补丁，可通过 sysctl 限制 vsock 模块的加载或禁用虚拟机通信后端作为临时缓解措施，并持续关注内核安全更新。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 vsock 空指针解引用漏洞"
updated = "2026-06-17T08:43:58Z"

