[basic]
description = "Prisma Industriale Checkweigher PrismaWEB 存在硬编码凭证漏洞，设备 Web 管理界面使用固定的管理员账号密码，远程攻击者可通过默认凭据直接登录后台获取系统控制权。该漏洞影响 PrismaWEB 系列工业称重设备，攻击者无需身份认证即可访问敏感配置信息并修改设备参数，对工业生产线安全构成严重威胁。厂商已发布安全更新，建议用户立即修改默认凭据并限制管理接口的网络访问权限。"
published = "2018-04-01"
remediation = "立即联系 Prisma Industriale 获取修复版本或替代固件；如厂商已停止支持，须将 PrismaWEB 管理界面从公网断开，仅允许受信任内网 IP 访问（在防火墙或 HMS AnyBus-S WebServer 层面配置访问控制列表）。同时修改 `/user/scripts/login_par.js` 中的密码为强密码（至少 12 位含特殊字符），并重启 Web 服务使更改生效。作为临时缓解措施，部署 WAF 规则阻止对 `/user/scripts/login_par.js` 路径的外部访问，并监控对该路径的异常请求。"
score = 5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Prisma Industriale Checkweigher PrismaWEB 硬编码凭证漏洞"
updated = "2018-04-01"

