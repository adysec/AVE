[basic]
description = "WordPress 的 Formidable Form Builder 插件 2.05.03 及之前版本中存在敏感数据泄露漏洞。该漏洞源于插件通过 `frm_forms_preview` AJAX 接口未对请求进行充分的权限验证，导致未认证的远程攻击者无需任何身份凭证即可通过发送特制的 AJAX 请求，导出指定表单中的所有提交数据，包括用户填写的敏感信息。攻击者只需知道目标表单 ID 即可利用该漏洞，攻击门槛低。CVSS 评分 5.3，危害等级中危。建议用户升级插件至最新版本以修复此漏洞。"
published = "2024-10-16T08:15:03Z"
remediation = """立即将 Formidable Form Builder 插件升级至 2.05.04 或更高版本。在 WordPress 后台进入"插件"页面，找到 Formidable Forms，点击"更新"按钮。如无法立即升级，可临时禁用 frm_forms_preview AJAX 接口，在 functions.php 中添加 `add_filter('frm_forms_preview', '__return_false');` 或通过 Web 应用防火墙（WAF）规则阻止对 `/wp-admin/admin-ajax.php?action=frm_forms_preview` 的未认证访问。"""
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Formidable Form Builder 插件敏感数据泄露漏洞"
updated = "2026-06-17T01:15:22Z"

