[basic]
description = "tags.<value>Apache HTTP Server 的 htpasswd 和 htdigest 工具存在符号链接攻击漏洞（CWE-59），攻击者在获得服务器本地用户权限后，可通过创建指向敏感文件的符号链接，利用这些工具在写入密码文件时的竞争条件，将任意内容覆盖到目标文件，导致敏感数据损坏或权限提升。该漏洞影响 Apache 2.0a9、1.3.14 等早期版本，CVSS v3.1 评分为 3.3，危害等级为低危。由于需要本地用户访问权限且攻击条件较为复杂，实际利用难度较高，但仍可能导致系统文件被篡改或服务中断。"
published = "2001-03-12T05:00:00Z"
remediation = "标签内。<value>立即升级 Apache HTTP Server 至 1.3.15 或更高版本（1.3.x 系列），或 2.0.36 或更高版本（2.0.x 系列），以修复 htpasswd 和 htdigest 工具的符号链接覆盖漏洞。如暂无法升级，应检查并删除系统中与 htpasswd、htdigest 相关的异常符号链接，确保执行这两个命令时工作目录不存在指向 /etc/passwd、/etc/shadow 等敏感文件的符号链接，并避免以 root 权限直接运行，同时配置文件系统挂载时启用 nosuid 和 nodev 选项以降低符号链接攻击风险。"
score = 3.3
severity = "LOW"
sources = ["epss"]
title = "Apache HTTP Server htpasswd htdigest 符号链接攻击任意文件覆盖漏洞"
updated = "2026-06-16T21:53:43Z"

