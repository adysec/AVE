[basic]
description = "open-feature-operator 存在跨命名空间资源引用漏洞，在多租户 Kubernetes 集群中，攻击者通过在被控命名空间内创建控制器拥有的工作负载，并利用 `openfeature.dev/featureflagsource` 注解以 `{NAMESPACE}/{NAME}` 语法跨命名空间引用其他租户的 `FeatureFlagSource` 或 `InProcessConfiguration` 资源，导致 operator 跨集群范围解析并泄露目标资源中的内联环境变量、`httpSyncBearerToken` 令牌、同步 URI 等敏感配置内容。该漏洞影响将命名空间视为信任边界的多租户集群，攻击者需具备在工作负载控制器（如 Deployment、StatefulSet）上执行 create 操作的权限。此漏洞属于架构设计缺陷而非传统代码缺陷，类似于 CVE-2020-8554 的跨命名空间信任边界问题。"
published = "2026-01-01T00:00:00Z"
remediation = "限制对 featureflagsources 和 inprocessconfigurations 资源的 create 权限，仅授予可信命名空间；使用 valueFrom.secretKeyRef 替代 spec.envVars 内联敏感值；避免在 CR spec 字段中放置明文凭据；关注后续版本将引入的 ClusterFeatureFlagSource/ClusterInProcessConfiguration 集群作用域 CRD 以消除隐式跨命名空间解析。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "OpenFeature open-feature-operator 跨命名空间信息泄露漏洞"
updated = "2026-01-01T00:00:00Z"

