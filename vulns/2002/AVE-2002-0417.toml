[basic]
description = "Apache HTTP Server 2.0.39 及 2.0.40 版本的 mod_cgi 模块存在死锁漏洞，当 CGI 脚本向标准错误输出（stderr）发送大量数据时，httpd 进程与 CGI 脚本之间会发生读写死锁，导致 Apache 服务挂起并持续消耗内存资源。本地用户以及可能的远程攻击者可利用此漏洞造成拒绝服务。该漏洞影响 Apache 2.0.39 和 2.0.40 版本，CVSS 评分 7.5，危害等级高。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 Apache HTTP Server 至 2.0.43 或更高版本，该版本修复了 mod_cgi 中 CGI 脚本向 stderr 输出大量数据导致 httpd 与 CGI 进程间读写死锁的问题。如无法升级，可在 httpd.conf 中限制 CGI 脚本资源使用（RLimitMEM 和 RLimitCPU），或禁用不必要的 CGI 功能作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Apache HTTP Server mod_cgi 拒绝服务漏洞"
updated = "2026-06-16T22:00:10Z"

