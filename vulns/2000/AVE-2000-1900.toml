[basic]
description = "OpenBSD ssh 程序存在格式化字符串漏洞，远程攻击者可通过向 ssh 服务发送特制的格式化字符串触发该漏洞，导致攻击者能够获取 root 权限。该漏洞影响 OpenBSD 及其他基于 BSD 的操作系统，CVSS 评分 10.0，危害等级严重。攻击者无需身份认证即可远程利用，完全控制目标系统。"
published = "2000-12-11T05:00:00Z"
remediation = "立即应用 OpenBSD 官方补丁：下载 ftp://ftp.openbsd.org/pub/OpenBSD/patches/2.7/common/028_format_strings.patch 并执行 `patch -p0 < 028_format_strings.patch` 后重新编译安装 ssh 程序；或升级至 OpenBSD 2.8 及以上版本。如无法升级，可在 inetd.conf 中禁用 ssh 服务并改用 telnet 作为临时替代，同时限制 SSH 源 IP 访问。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "OpenBSD ssh 格式化字符串漏洞"
updated = "2026-06-16T21:52:56Z"

