[basic]
description = "Apple iOS 5.0.1 之前版本的内核在处理 mmap 系统调用时，未能正确验证标志位组合的有效性，存在资源管理错误漏洞。本地攻击者可通过向受影响的 iOS 设备安装特制应用程序触发该漏洞，绕过代码签名检查机制，以系统权限执行任意未签名代码。该漏洞影响 iOS 3.0 至 5.0 版本，CVSS 评分 7.2，危害等级高。Apple 已在 iOS 5.0.1 安全更新中修复此漏洞。"
published = "2011-11-11T18:55:01Z"
remediation = "升级 Apple iOS 至 5.0.1 或更高版本，该版本修复了 kernel 中 mmap 系统调用标志组合校验不严导致任意代码执行的问题。无法立即升级的设备应限制不可信应用的安装，仅从官方 App Store 下载应用，并启用 iOS 的代码签名强制检查机制。"
score = 7.2
severity = "HIGH"
sources = ["tenable"]
title = "Apple iOS 内核 mmap 系统调用本地代码执行漏洞"
updated = "2026-06-16T23:33:17Z"

