[basic]
description = "GnuPG（gpg）1.0.3 版本在验证包含多个文档的文件时，仅检查第一个文档的签名，而未对所有文档的签名进行完整校验。攻击者利用此缺陷可在不触发签名验证告警的情况下，篡改文件中除首个文档外的其他所有文档内容，导致数据完整性被破坏。该漏洞无需身份认证即可远程利用，影响机密性、完整性和可用性。用户应升级到 GnuPG 1.0.4 或更高版本以修复此问题。"
published = "2000-12-19T05:00:00.000"
remediation = "立即升级 GnuPG 至 1.0.4 或更高版本。Debian 用户运行 apt-get update && apt-get upgrade gnupg，Red Hat 用户应用 RHSA-2000-089 提供的更新包，FreeBSD 用户安装 FreeBSD-SA-00:67 补丁。当前最新稳定版为 GnuPG 2.4.x 系列，建议升级至最新版本以获得完整安全支持。如无法立即升级，在验证多文档签名时应逐一检查每个文档的签名而非仅检查第一个。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "GNU Privacy Guard GnuPG 多文档签名验证绕过漏洞"
updated = "2026-06-16T21:52:53.400"

