[basic]
description = "Dansie Shopping Cart 3.04 及更早版本存在隐私泄露漏洞，该软件在用户注册或登录过程中，会将包含用户名、密码等敏感凭据信息以明文形式发送至由产品开发者控制的电子邮箱地址。远程攻击者无需身份认证即可通过网络利用该漏洞，通过监听或截获开发者邮箱流量获取用户凭据，进而导致用户账户信息泄露。该漏洞影响 Dansie Shopping Cart 3.04 及之前版本，CVSS 评分 5.0，危害等级中等。"
published = "2000-12-31T05:00:00Z"
remediation = "立即停止使用 Dansie Shopping Cart 3.04 及更早版本，该产品已停止维护且无官方补丁。建议迁移至其他活跃维护的开源或商业购物车系统（如 WooCommerce、Magento 等）。如暂时无法迁移，可在 Web 应用防火墙（WAF）层面添加规则，拦截包含用户凭据的对外发往非授权域名的 HTTP 请求，并审计应用代码中所有邮件发送函数，移除将用户输入明文发送给第三方邮箱的逻辑。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Dansie Shopping Cart 敏感信息泄露漏洞"
updated = "2026-06-16T21:53:27Z"

