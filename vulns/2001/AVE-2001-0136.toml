[basic]
description = "ITAfrica WEBactive HTTP Server 1.00 存在目录遍历漏洞，未经身份认证的远程攻击者可通过在 URL 中插入 .. (点斜杠) 序列突破服务器目录访问限制，读取目标系统上的任意敏感文件（如配置文件、密码文件等）。该漏洞利用条件极低，无需认证且攻击复杂度低，仅需构造包含特殊路径的 HTTP 请求即可完成信息泄露。该漏洞影响运行 ITAfrica WEBactive 1.00 的 Web 服务器，CVSS 评分 5.0，危害等级为中等。ExploitDB 已公开相关利用代码（exploits/20637），攻击者可利用该漏洞获取服务器敏感信息，进而为进一步入侵提供支撑。建议管理员升级至安全版本或限制 URL 中的路径访问权限。"
published = "2001-05-03T04:00:00Z"
remediation = "检查并升级至 ITAfrica WEBactive HTTP Server 的更新版本，或替换为 Apache、IIS 等仍在维护的 HTTP 服务器产品。在服务器端对 URL 中的请求路径进行严格过滤，禁止包含 .. 或 ../ 等目录遍历序列的访问请求。通过访问控制列表（ACL）或服务器目录权限配置，严格限制 Web 根目录以外的文件系统访问，确保仅允许访问指定发布目录内的内容。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "ITAfrica WEBactive HTTP Server 目录遍历漏洞"
updated = "2026-06-16T21:54:04Z"

