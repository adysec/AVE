[basic]
description = "Adobe eBook Reader 2.2 存在文件恢复权限提升漏洞。本地攻击者可通过备份关键数据文件，执行复制、打印、借阅和赠送等受限操作，再恢复原始数据文件，从而绕过数字版权管理（DRM）限制。该漏洞影响 Adobe eBook Reader 2.2 版本，攻击者需具备本地系统访问权限，利用方式简单，可导致未授权的文件操作和权限提升。"
published = "2002-10-04T04:00:00Z"
remediation = '卸载 Adobe eBook Reader 2.2，升级至 Adobe Digital Editions 4.5 或更高版本以替代旧版；如无法升级，通过操作系统 ACL 限制对 `%APPDATA%\Adobe\eBook Reader` 目录的写入权限，仅允许 Administrators 组完全控制，禁止普通用户修改数据文件；同时启用文件审计日志监控对该目录的异常备份/恢复操作。'
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Adobe eBook Reader 文件恢复权限提升漏洞"
updated = "2026-06-16T21:58:34Z"

