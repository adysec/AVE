[basic]
description = "SurfControl SuperScout WebFilter for Windows 2000 的 Web Reports Server 组件存在目录遍历漏洞。远程攻击者无需身份认证即可通过向目标服务器发送包含三个点号（...）序列的特制 HTTP 请求，绕过路径限制读取服务器上的任意文件，导致敏感信息泄露。该漏洞影响 SurfControl SuperScout WebFilter for Windows 2000 版本，CVSS 评分 5.0，危害等级中危。目前已有公开的利用代码，攻击者可通过 Exploit-DB 获取 PoC 进行验证。"
published = "2002-10-10T04:00:00Z"
remediation = "该产品已停止技术支持，官方未发布补丁。建议立即禁用 Web Reports Server 服务（默认端口 8888），或通过防火墙限制仅允许受信管理 IP 访问该端口。如仍需查看报表，改用终端会话（如 RDP）直连服务器操作，避免将报表服务暴露于网络。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "SurfControl SuperScout WebFilter 目录遍历漏洞"
