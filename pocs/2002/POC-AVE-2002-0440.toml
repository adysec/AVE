[info]
author = "ave"
description = "通过构造恶意 HTML 页面，利用 Opera 5.12/6.0 对跨域 frame location 属性访问控制不严的缺陷，使用 javascript: URL 修改内嵌框架的 location，从而在目标域上下文中执行任意脚本，绕过同源策略"
id = "POC-AVE-2002-0440"
name = "Opera 5.12/6.0 Frame Location Same Origin Policy Circumvention PoC"
severity = "medium"
tags = ["ave-2002-0440"]
vuln_id = [
    "CVE-2002-0783",
    "AVE-2002-0440",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<iframe"]
