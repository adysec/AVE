[basic]
description = "Linux内核caif_virtio驱动的cfv_probe()函数存在空指针引用漏洞。del_vqs()函数会释放virtqueues，但代码在调用前错误地检查了cfv->vdev而非cfv->vq_tx指针是否为NULL，导致在指针已被释放的情况下仍被解引用。该漏洞影响使用Linux内核的系统，需要本地低权限访问权限，无需用户交互即可触发。攻击者可通过触发该空指针引用导致系统崩溃或拒绝服务，CVSS评分5.5。"
published = "2025-04-01T16:15:20Z"
remediation = "升级 Linux 内核至包含修复的稳定版本，例如 Ubuntu 22.04 LTS 升级至 5.15.0-140.150 或更高版本，Ubuntu 24.04 LTS 升级至 6.8.0-84.84 或更高版本。如无法立即升级内核，可通过编译安装 Linux 5.4.291、5.10.235、5.15.179、6.1.131、6.6.83、6.12.19 或 6.13.7 及后续稳定版本来修复该漏洞。临时缓解措施：如系统未使用 CAIF_VIRTIO 设备驱动，可在内核启动参数中禁用该模块或从 initramfs 中移除 caif_virtio 驱动。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 caif_virtio 空指针解引用漏洞"
updated = "2026-06-17T08:44:34Z"

