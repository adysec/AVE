[basic]
description = "Microsoft SharePoint 存在远程代码执行漏洞，由于软件在处理应用程序包时未能正确检查源标记（source markup），导致未经身份认证的远程攻击者可通过向目标 SharePoint 服务器发送特制的应用程序包触发 .NET 反序列化，从而在目标系统上以 SharePoint 应用程序池权限执行任意代码。该漏洞影响 SharePoint 2010/2013/2016/2019 等多个版本，CVSS 评分 9.8，危害等级严重，且已被 CISA 列入已知被利用漏洞目录（KEV），存在公开的武器化利用代码。Microsoft 已在 2019 年 3 月安全更新中修复此漏洞。"
published = "2019-03-05T23:29:00Z"
remediation = "立即安装 Microsoft 2019 年 3 月安全更新（对应 SharePoint Server 2010 SP2、SharePoint Foundation 2013 SP1、SharePoint Enterprise Server 2016、SharePoint Server 2019 各版本的补丁），通过 Microsoft Update 或 WSUS 部署。如无法立即打补丁，可在 SharePoint 前端启用输入验证并限制应用包上传权限，同时使用 WAF 规则拦截反序列化攻击载荷作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Microsoft SharePoint 远程代码执行漏洞"
updated = "2026-06-17T02:08:31Z"

