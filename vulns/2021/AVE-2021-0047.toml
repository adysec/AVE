[basic]
description = "tags.<value>Apple macOS X 存在可信数据反序列化漏洞（CWE-502），沙箱环境下的进程可通过特制的序列化数据绕过沙箱限制，进而提升权限或执行恶意代码。该漏洞影响 macOS Catalina（Security Update 2021-005）、macOS Big Sur 11.6、iOS 12.5.5、iOS 14.8、iPadOS 14.8 及 watchOS 7.6.2 等多个版本，CVSS 评分为 7.5（高危），攻击者利用该漏洞可在无需用户交互的情况下从沙箱逃逸并获取系统级权限。Apple 已知该漏洞在发布时可能已被活跃利用，目前已通过改进的数据验证机制完成修复。"
published = "2021-08-24T19:15:24Z"
remediation = "立即将设备更新至修复版本：macOS 升级至 Big Sur 11.6 或安装安全性更新 2021-005 Catalina，iOS 升级至 14.8（或 12.5.5），iPadOS 升级至 14.8，watchOS 升级至 7.6.2。前往「系统偏好设置」→「软件更新」或「设置」→「通用」→「软件更新」自动安装。如企业 MDM 管理设备，可通过配置描述文件强制推送更新。若因合规要求暂无法打补丁，建议在防火墙或 MDM 策略中限制 Core Telephony 相关进程的网络访问权限，以降低沙盒逃逸风险。该漏洞已被 CISA 列入已知被利用漏洞目录，存在在野利用证据，须优先修复。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Apple macOS 反序列化沙箱绕过漏洞"
updated = "2026-06-17T03:51:18Z"

