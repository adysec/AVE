[basic]
description = 'HP-UX 11.04 及更早版本中的 inetd 服务器存在拒绝服务漏洞，未经身份认证的远程攻击者可通过向目标系统发送特制网络请求，在 inetd 使用"swait"状态时触发漏洞，导致服务进程异常终止，造成拒绝服务。该漏洞影响 HP-UX 11.04 及更早版本系统，CVSS 评分 5.0，危害等级为中危。攻击者无需任何凭据即可利用此漏洞使 inetd 管理的网络服务不可用，造成系统可用性下降。HP 已发布安全补丁修复此漏洞，建议用户尽快升级至修复版本。'
published = "2001-02-12T05:00:00.000"
remediation = "立即安装 HP 安全公告 HPSBUX0101-136 对应的补丁，将 HP-UX 11.04 升级至官方修复版本或更高版本（如 HP-UX 11.11 及以后版本）。如无法立即升级，可临时通过修改 /etc/inetd.conf 禁用不必要的 inetd 托管服务并重启 inetd 进程，以降低 swait 状态拒绝服务攻击风险。同时建议在防火墙上限制对 inetd 相关端口的访问，减少攻击面。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "HP HP-UX inetd 拒绝服务漏洞"
updated = "2026-06-16T21:53:40.020"

