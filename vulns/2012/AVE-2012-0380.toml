[basic]
description = "WebKit 是 Apple iTunes 使用的网页渲染引擎，在 10.7 之前的版本中存在内存破坏漏洞。远程攻击者可通过构造恶意网站向用户发起攻击，触发内存损坏导致应用崩溃（拒绝服务），或在特定条件下实现任意代码执行。该漏洞影响安装有旧版 iTunes 的 Windows 和 Mac 系统，攻击者无需身份认证即可通过网络发送特制网页内容利用此漏洞。用户访问攻击者控制的网页即可触发漏洞，造成敏感信息泄露或系统被远程控制。Apple 已在 iTunes 10.7 中修复此问题。"
published = "2012-09-13T10:30:21.137"
remediation = "将 Apple iTunes 升级至 10.7 或更高版本，以修复 WebKit 内存破坏漏洞。如暂无法升级，应避免在 iTunes 中打开或点击未知来源的网页链接，并可通过防火墙规则限制 iTunes 访问外部网络的权限作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes 远程代码执行漏洞"
updated = "2026-06-16T23:43:46.513"

