[basic]
description = "bftpd 1.0.11 中的 FTP 守护进程存在缓冲区溢出漏洞，远程攻击者可通过向目标服务器发送超长的 USER 命令参数触发该漏洞，导致服务进程崩溃引发拒绝服务，在特定条件下还可执行任意代码。该漏洞影响 bftpd 1.0.11 及之前版本，攻击无需身份认证，危害等级高。"
published = "2000-12-19T05:00:00.000"
remediation = "立即将 bftpd 升级至 1.0.12 或更高版本（当前最新稳定版为 6.7），该漏洞已在后续版本中修复。如无法升级，可在 bftpd.conf 中限制 USER 命令最大长度，或在防火墙/iptables 层面限制对 FTP 端口（默认 21）的访问来源，仅允许可信 IP 连接。同时建议使用 inetd 包装器（如 tcp_wrappers）添加访问控制白名单。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "bftpd 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:49.340"

