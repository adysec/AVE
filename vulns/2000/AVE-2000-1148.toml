[basic]
description = "Apache HTTP Server 1.3.11 之前版本中，当配置为使用 mod_rewrite 或 mod_vhost_alias（Apache 1.3.9 引入）进行大规模虚拟主机托管时存在文件信息泄露漏洞。远程攻击者可通过发送特制的 HTTP 请求绕过访问控制限制，读取服务器上的任意文件内容，导致敏感信息泄露。该漏洞利用网络可达即可触发，无需身份认证，攻击复杂度低。"
published = "1999-08-20T04:00:00.000"
remediation = "升级 Apache httpd 至 1.3.11 或更高版本。对于仍在运行 Apache 1.3 系列的服务器，应立即升级至 2.4 系列最新稳定版（如 2.4.62），该漏洞已在 1.3.11 中修复。如无法升级，在 httpd.conf 中禁用 mod_rewrite 和 mod_vhost_alias 模块作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Apache HTTP Server mod_rewrite/mod_vhost_alias 文件泄漏漏洞"
updated = "2026-06-16T21:53:22.813"

