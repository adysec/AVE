[info]
author = "AVE"
description = "验证 nebula-mesh 生成的 config.yml 中缺少 pki.blocklist 配置项，导致证书吊销无法在网格中强制执行"
id = "POC-AVE-2026-0896"
name = "CVE-2026-61699 PoC"
severity = "high"
tags = ["ave-2026-0896"]
vuln_id = [
    "CVE-2026-61699",
    "AVE-2026-0896",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/nebula/config.yml"
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["pki.blocklist"]
