[basic]
description = "Apple iTunes 10.7 之前版本使用的 WebKit 引擎存在内存破坏漏洞，未经身份认证的远程攻击者可通过诱导用户访问恶意网页触发该漏洞，导致任意代码执行或拒绝服务（内存损坏与应用崩溃）。该漏洞影响 iTunes 10.7 之前的版本，CVSS 评分 6.8，危害等级中等。攻击条件为受害者需访问攻击者构造的恶意网站，利用 WebKit 引擎在处理网页内容时的内存错误实现代码执行或导致应用崩溃。"
published = "2012-09-13T10:30:20.527"
remediation = '升级 iTunes 至 10.7 版本（Windows 平台），或升级 Safari 至 6.0.1 版本（macOS 平台，可通过安装 OS X Mountain Lion 10.8.2 或后续系统更新获得）。在未打补丁前，建议在 Safari 中禁用 JavaScript（偏好设置 → 安全 → 取消勾选"启用 JavaScript"）作为临时缓解措施，避免访问不可信网站以降低被利用风险。'
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:42.640"

