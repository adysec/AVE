[basic]
description = "Apple iTunes 10.7 之前版本所集成的 WebKit 引擎存在内存破坏漏洞。未经身份认证的远程攻击者可通过诱导用户访问特制 crafted 网页，利用 iTunes 打开恶意网页时触发该漏洞，导致内存损坏和应用程序崩溃，或执行任意代码，从而完全控制受影响系统。该漏洞仅需用户点击恶意链接即可被利用，无需身份认证。"
published = "2012-09-13T10:30:21Z"
remediation = '将 Apple iTunes 升级至 10.7 或更高版本，可通过 iTunes 菜单"帮助"→"检查更新"自动升级，或从 Apple 官网下载完整安装包手动安装。如暂无法升级，建议在 iTunes 偏好设置中禁用网页内容预览功能，并避免使用 iTunes 打开或访问来自不可信来源的网页链接及媒体文件，同时通过防火墙限制 iTunes 进程对外发起的不必要 Web 请求以降低风险。'
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes 远程代码执行漏洞"
updated = "2026-06-16T23:43:47Z"

