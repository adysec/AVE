[basic]
description = "BIND 4 的 nslookupComplain 函数存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向运行 BIND 4 的目标 DNS 服务器发送特制 DNS 查询包触发该溢出，进而获取目标系统的 root 权限，导致服务器完全被控。该漏洞影响广泛部署 BIND 4 的 DNS 服务器，攻击条件简单，无需任何认证凭据即可远程利用，危害等级极高。"
published = "2001-02-12T05:00:00Z"
remediation = "立即升级 BIND 4 至 4.9.8 或更高版本，或迁移至 BIND 9.x 系列。如无法立即升级，可在防火墙层面限制 DNS 服务的外部访问，并以非 root 权限运行 named 进程作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "ISC BIND 4 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:29Z"

