[basic]
description = "Google Chrome 132.0.6834.110 之前版本中的 V8 JavaScript 引擎存在越界内存访问漏洞（CWE-125）。远程攻击者可通过构造特制的 HTML 页面诱导用户访问，触发 V8 引擎在处理 JavaScript 对象时发生越界读取，导致堆内存损坏，进而造成浏览器崩溃或拒绝服务。该漏洞无需用户交互即可触发（CVSS 攻击复杂度为低），影响所有使用受影响 Chrome 版本的用户。Google 已在 132.0.6834.110 版本中修复此漏洞。"
published = "2025-01-22T20:15:30Z"
remediation = "立即升级 Google Chrome 至 132.0.6834.110 或更高版本，可通过 Chrome 设置 > 关于 Chrome > 自动检查更新完成升级。基于 Chromium 的浏览器（如 Edge、Opera、Brave）请同步更新至对应修复版本。Linux 发行版用户通过包管理器更新 chromium 包（如 openSUSE 已发布 openSUSE-SU-2025:0034-1）。无法立即升级时，可禁用 JavaScript 作为临时缓解措施（chrome://settings/content/javascript），但会严重影响正常浏览功能。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 内存越界访问漏洞"
updated = "2026-06-17T08:26:50Z"

