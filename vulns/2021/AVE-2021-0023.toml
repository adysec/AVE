[basic]
description = "高通 Snapdragon 系列芯片的 apq8009_firmware 中存在地址注销异常处理不当漏洞。当地址注销操作失败时，固件未能正确处理该异常条件，导致新的 GPU 地址分配失败。该漏洞影响 Snapdragon Auto、Snapdragon Compute、Snapdragon Connectivity、Snapdragon Consumer IOT、Snapdragon Industrial IOT、Snapdragon Mobile、Snapdragon Voice & Music 及 Snapdragon Wearables 等多个产品线。攻击者需在目标设备上具备本地访问权限，无需用户交互即可触发该漏洞，造成系统可用性中断。CVSS v3.1 评分为 6.2，危害等级为中等。"
published = "2021-05-07T09:15:08.280"
remediation = "安装设备厂商发布的最新固件更新以修复此漏洞，该补丁已包含在高通2021年5月安全公告（May 2021 Bulletin）中。受影响用户应联系设备制造商获取补丁固件，或通过设备系统更新功能安装安全补丁。如暂时无法更新，建议限制对受影响设备的本地物理访问，并监控系统日志中GPU异常报错作为临时缓解措施。"
score = 6.2
severity = "MEDIUM"
sources = ["kev"]
title = "高通 Snapdragon 芯片组 GPU 固件拒绝服务漏洞"
updated = "2026-06-17T03:32:48.490"

