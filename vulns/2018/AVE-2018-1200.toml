[basic]
description = "Internet Explorer 脚本引擎在处理内存中的对象时存在内存损坏漏洞。由于在处理特定对象时未能正确验证内存边界，远程攻击者可通过诱导用户访问包含特制脚本的恶意网页，在受害者浏览器中触发该漏洞。该漏洞影响 Internet Explorer 9、10 及 11 版本，成功利用后可导致远程代码执行，从而在目标系统上获取与当前用户相同的权限。"
published = "2018-12-20T13:29:00Z"
remediation = "建议立即安装微软 2018 年 12 月发布的累积安全更新以修复脚本引擎漏洞。鉴于 Internet Explorer 已停止支持，强烈建议用户升级至 Microsoft Edge 或其他现代浏览器以消除此类底层内存损坏风险。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Internet Explorer 脚本引擎内存损坏远程代码执行漏洞"
updated = "2026-06-17T02:05:15Z"

