[basic]
description = "Russh 是 Rust 编写的 SSH 客户端与服务器库。在 0.62.5 及更早版本中，服务端存在 SSH channel 生命周期管理缺陷。当客户端完成认证后，即使未发送 `SSH_MSG_CHANNEL_OPEN` 消息请求建立会话通道，`russh` 仍会为任意 recipient channel ID 调度 channel-scoped 回调函数（如 `exec_request`、`shell_request`、`subsystem_request`、`pty_request` 等）。具体而言，在 `server_read_authenticated` 函数中处理 `CHANNEL_REQUEST` 消息时，代码未先验证 recipient channel ID 是否存在于加密会话的已确认 channel 表中，就直接调用应用层的 handler 回调。攻击者作为已认证的 SSH 客户端（需提供有效用户名和密码），可直接伪造 `SSH_MSG_CHANNEL_REQUEST` 数据包并指定任意的 recipient channel ID，从而绕过服务端应用程序的 channel-open 策略，触发本应仅对已授权开放 channel 执行的操作（如执行受限命令）。此漏洞并非认证绕过，攻击前提是已通过身份验证，危害在于 channel-open 决策边界未被正确执行，可能导致未授权命令执行或工作流触发。修复建议将受影响的 channel-scoped 回调调度前增加 `enc.channels` 中的 established channel 确认检查，并确保应用层 channel 引用仅在 channel 被批准时才插入。"
published = "2026-08-03T17:16:44Z"
remediation = "将项目依赖中的 russh 升级至 0.62.5 或更高版本。在 Cargo.toml 中将 russh 版本修改为 0.62.5，执行 cargo update 拉取修复版本。如暂无法立即升级，可在应用层对 exec_request、shell_request、subsystem_request、data、channel_eof、channel_close 等 channel-scoped 回调前增加显式校验，仅处理 enc.channels 中已确认打开的 channel，拒绝任何未经过 CHANNEL_OPEN 确认的 recipient channel ID 请求，以阻止未打开通道的请求触发状态变更操作。"
score = 6.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Russh SSH 服务端通道回调绕过漏洞"
updated = "2026-08-03T17:16:44Z"

