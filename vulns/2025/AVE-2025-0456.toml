[basic]
description = "Google Chrome for Android 的 Omnibox（地址栏）组件存在不当实现漏洞（CWE-451）。远程攻击者可通过构造特制的 HTML 页面，诱导用户执行特定的 UI 手势操作，利用该漏洞在地址栏中伪造目标域名，实现域名欺骗。攻击者无需身份认证，但需要用户交互配合。成功利用后，攻击者可伪装为可信站点，诱使用户泄露敏感信息或执行恶意操作。该漏洞影响 Android 平台上 141.0.7390.54 之前版本的 Google Chrome。Google 已在 Chrome 141.0.7390.54 版本中修复此漏洞。"
published = "2025-11-06T22:15:39Z"
remediation = "立即将 Android 端 Google Chrome 升级至 141.0.7390.54 或更高版本（通过 Google Play 商店更新）；基于 Chromium 的第三方浏览器同步更新至对应版本。临时缓解措施：警惕可疑链接，避免在不可信页面上执行特定 UI 手势操作。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome Omnibox 不当实现导致域名欺骗漏洞"
updated = "2026-06-17T08:29:52Z"

