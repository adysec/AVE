[basic]
description = "Windows Telephony Service（TAPI）存在整数溢出漏洞（CWE-190），由于对用户输入数据长度校验不充分导致内存破坏。未经身份认证的远程攻击者可通过诱导用户访问恶意网站或打开特制文件触发该漏洞，成功利用可在目标系统上以 SYSTEM 权限执行任意代码。该漏洞影响多个 Windows 10/11 及 Windows Server 版本，CVSS 评分 8.8，危害等级高危。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:40Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新。Windows 11/Server 2025 用户安装 KB5049984，Windows Server 2022 安装 KB5049981，Windows 10 21H2/22H2 安装 KB5050021。如无法打补丁，可在防火墙中限制 TAPI 服务（tapisrv.dll）的网络入站访问，并禁用不必要的电话服务（Telephony Service）作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:42:52Z"

