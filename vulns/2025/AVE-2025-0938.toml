[basic]
description = "Linux 内核多路径 TCP（MPTCP）子选项状态处理机制存在缺陷，攻击者可通过向目标系统发送特制的 MPTCP 数据包触发该漏洞。由于接收子选项的状态位掩码和相关位字段未在解析前正确初始化，MPTCP 代码在处理入站选项时可能使用未初始化的内存值，导致内核崩溃或敏感信息泄露。该漏洞影响启用了 MPTCP 的 Linux 内核版本，无需身份认证即可远程利用，CVSS 评分为 9.8，危害等级为严重。"
published = "2025-02-27T02:15:14Z"
remediation = "将 Linux 内核升级至已修复的稳定版本：5.15.179、6.1.129、6.6.76、6.12.13 或 6.13.2 及以后版本。Debian 12（bookworm）用户可安装 linux 6.1.180-1 及以上版本，Ubuntu 22.04 LTS 用户可安装 5.15.0-140.150 内核，Ubuntu 24.04 LTS 用户可安装 6.8.0-64.67 内核。若无法立即升级，可在防火墙或 sysctl 层面禁用 MPTCP 作为临时缓解措施：执行 echo 0 > /proc/sys/net/mp tcp/enabled 或添加 net.mptcp.enabled=0 到内核启动参数。"
score = 9.8
severity = "CRITICAL"
sources = ["msrc"]
title = "Linux 内核 MPTCP 子选项状态位字段未初始化漏洞"
updated = "2026-07-30T06:20:02Z"

