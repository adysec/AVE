[basic]
description = "Microsoft Internet Explorer 5.5 与 6.0 存在文件下载安全警告绕过漏洞。远程攻击者可构造特制网页或下载链接，使“文件下载”对话框中显示的文件名或扩展名被错误呈现，从而误导用户将危险文件（如可执行程序）误认为安全类型并确认下载执行。该漏洞无需身份认证，攻击条件为网络可达且用户需主动确认下载；成功利用可导致恶意代码在用户系统中运行，造成信息泄露、篡改或可用性受损。CVSS 评分为 7.5，危害等级为高危，主要影响使用 IE 5.5/6.0 的 Windows 客户端环境。"
published = "2001-11-26T05:00:00Z"
remediation = "立即安装微软安全公告 MS01-058 对应的累积补丁 KB313675，下载地址为 https://www.microsoft.com/windows/ie/downloads/critical/Q313675/default.asp。IE 5.5 用户安装后需重启浏览器，IE 6.0 Gold 用户可直接安装。如暂时无法打补丁，可在 IE 安全设置中将 Internet 区域和 Intranet 区域的「文件下载」功能禁用，作为临时缓解措施。长远建议升级至 IE 5.5 SP3 或 IE 6 SP1，该补丁已集成于这两个服务包中。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer 文件下载安全警告绕过漏洞"
updated = "2026-06-16T21:55:08Z"

