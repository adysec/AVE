[info]
author = "AVE"
description = "Microsoft Office memory corruption remote code execution vulnerability. Detects if target is running vulnerable version of Microsoft Office."
id = "POC-AVE-2017-0300"
name = "CVE-2017-11826 PoC"
severity = "high"
tags = [
    "cve-2017-11826",
    "office",
    "rce",
]
vuln_id = [
    "CVE-2017-11826",
    "AVE-2017-0300",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Microsoft Office"]
