[basic]
description = "IBM Net.Commerce 2.0/3.x/4.x 及 WebSphere Commerce Suite 4.1.1 及更早版本中的 orderdspc.d2w 宏存在 SQL 注入漏洞。远程攻击者无需身份认证，即可通过向目标服务器发送特制的 HTTP 请求，在 orderdspc.d2w 报表功能的 order_rn 参数中插入恶意 SQL 语句，从而执行任意数据库查询。该漏洞可导致攻击者获取数据库中敏感信息，包括管理员账户及加密密码，并进一步将权限提升至 DB2INST1 数据库账户，甚至可能以该账户身份执行任意操作系统命令。IBM 已在 Net.Commerce 3.2 及 WebSphere Commerce Suite 4.1 中修复了其自带的易受攻击宏，但用户自定义宏仍可能存在类似风险。"
published = "2001-05-03T00:00:00Z"
remediation = "升级 IBM Net.Commerce 至 3.2 版本或升级 WebSphere Commerce Suite 至 4.1 及以上版本，如条件允许直接迁移至 5.1 版本彻底消除 Net.Data 宏风险。同时审计所有自定义创建的 Net.Data 宏文件，禁止直接在宏中拼接用户可控参数至 SQL 查询语句，必要时采用参数化查询或预编译语句进行重构。若短期内无法升级，应在 Web 服务器层面通过 URL 过滤规则拦截对 /ExecMacro/orderdspc.d2w/report 路径的访问请求，或关闭该报告宏的执行权限作为临时缓解。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "IBM WebSphere Commerce Suite orderdspc.d2w SQL注入漏洞"
updated = "2001-05-03T00:00:00Z"

