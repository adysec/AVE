[basic]
description = "Linux 内核 netfilter 子系统的 nf_tables 框架存在逻辑缺陷。在处理链更新时，若 nf_tables_updchain 函数遇到错误需要回滚钩子注册，代码未正确检查表是否处于休眠（dormant）状态即执行注销操作，导致对休眠状态下从未注册的钩子执行重复注销，可能触发空指针解引用并引发内核崩溃。该漏洞影响使用 nf_tables 功能的 Linux 内核版本，攻击者需要具备本地低权限访问权限，无需用户交互即可在本地触发，成功利用将导致系统可用性完全丧失（拒绝服务），但不影响数据保密性和完整性。该漏洞 CVSS 评分 5.5，危害等级为中等。"
published = "2025-04-16T15:16:00Z"
remediation = "Linux 内核存在 netfilter nf_tables 模块在休眠状态下未正确注销钩子的漏洞（CVE-2025-22064），本地低权限用户可利用此漏洞触发空指针解引用，导致系统崩溃（ denial of service），在特定条件下可能存在权限提升风险。建议立即将 Linux 内核升级至已修复版本：对于主线稳定版，请升级至 6.6.87、6.12.23、6.13.11、6.14.2 或更高版本；对于 Ubuntu 系统，24.04 LTS 应升级至 6.8.0-86.87 及以后版本，24.10 应升级至 6.11.0-28.28 及以后版本，25.04 应升级至 6.14.0-22.22 及以后版本；对于 SUSE Linux Enterprise 15 SP6，请安装 SUSE-SU-2025:01964-1 安全更新中的 RT 内核补丁。如暂时无法立即升级内核，可临时通过配置 nftables 禁用休眠表（dormant table）功能或限制本地 nftables 命令的执行权限作为缓解措施，具体可通过 sysctl 或 iptables/nftables 规则限制非特权用户对 netfilter 配置的修改权限。升级后请重启系统使新内核生效，并通过 `uname -r` 验证当前运行的内核版本是否已包含修复补丁（commit 03d1fb457b696c18fe15661440c4f052b2374e7e）。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel nf_tables 拒绝服务漏洞"
updated = "2026-06-17T08:44:58Z"

