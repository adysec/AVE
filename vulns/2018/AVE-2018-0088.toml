[basic]
description = "Microsoft Office 公式编辑器（Equation Editor）在处理内存中的对象时存在内存损坏漏洞。远程攻击者可通过向用户发送特制的 Office 文档并诱导其打开来触发该漏洞，成功利用后可实现远程代码执行，获取目标系统的完全控制权。该漏洞影响 Microsoft Office 2007、2010、2013 及 2016 等多个版本，攻击无需身份认证但需要用户交互，CVSS 评分 8.8，危害等级高危。Microsoft 已在 2018 年 1 月安全更新中修复此漏洞。"
published = "2018-01-10T01:29:00Z"
remediation = "立即安装 Microsoft 2018 年 1 月安全更新：Office 2007 安装 KB4011654，Office 2010 安装 KB4011651，Office 2013 安装 KB4011650，Office 2016 安装 KB4011663。如无法打补丁，可禁用 Equation Editor 组件（通过重命名 eqnedt32.exe）作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Office 远程代码执行漏洞"
updated = "2026-06-17T01:31:40Z"

