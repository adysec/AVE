[basic]
description = "IBM AIX 4.3.x 和 5.1 操作系统中的 errpt 错误报告工具存在栈缓冲区溢出漏洞。该工具在处理用户传入的超长命令行参数时未对缓冲区边界进行有效校验，本地攻击者可通过构造特制的参数触发溢出并覆写栈上返回地址。成功利用该漏洞后，攻击者能够在受影响系统上以 root 权限执行任意代码，从而完全控制目标主机。该漏洞影响 AIX 4.3.x 及 5.1 等多个版本，CVSS 评分为 10.0，危害等级为严重。攻击者需具备目标系统的本地访问权限才能利用此漏洞，公开利用代码已通过设置环境变量并调用 errpt 命令的方式实现权限提升。"
published = "2003-04-22T04:00:00.000"
remediation = "立即安装包含 errpt 安全修复的 IBM AIX 5.2 或 5.3 版本，或将系统升级至应用了解决 errpt 缓冲区溢漏洞的授权修正程序 (APAR) IY34119。升级后，系统将应用增强的安全验证机制以防止 errpt 命令的缓冲区溢出攻击。如无法立即升级，可通过 `/etc/security/user` 修改账户权限，限制对 errpt 命令的使用权限，并部署文件完整性检查工具监控 errpt 二进制文件的完整性变化。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "IBM AIX ERRPT 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:59:23.090"

