[basic]
description = 'Nevis Systems All-Mail 1.1 邮件服务器软件中存在缓冲区溢出漏洞。远程攻击者无需身份认证，通过向 SMTP 服务发送超长的 "MAIL FROM" 或 "RCPT TO" 命令即可触发栈缓冲区溢出，导致任意代码执行。该漏洞 CVSS 评分 10.0，危害等级严重，可完全控制受影响系统。官方已停止维护，建议用户迁移至其他邮件服务器软件。'
published = "2000-12-19T05:00:00.000"
remediation = "Nevis Systems 已停止维护 All-Mail 产品，建议立即迁移至受支持的 SMTP 服务器软件（如 Exchange Server、Postfix 等）。在迁移完成前，在防火墙层面限制对 TCP 25 端口的访问，仅允许受信任 IP 连接 SMTP 服务，并禁用不必要的 SMTP 命令扩展以降低攻击面。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Nevis Systems All-Mail 1.1 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:54.800"

