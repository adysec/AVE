[basic]
description = "vpopmail 的 vchkpw 组件在 4.8 版本之前存在格式化字符串漏洞，程序在调用 syslog 记录日志时未对用户提供的 USER 或 PASS 命令参数进行正确的格式化字符串过滤，远程攻击者可通过向 SMTP/POP3 服务发送包含特制格式化指令的认证请求触发该漏洞，导致系统日志服务崩溃或产生异常行为，造成拒绝服务。该漏洞影响 vpopmail 4.5 及 4.7 版本，CVSS 评分 5.0，危害等级中等。"
published = "2000-06-30T04:00:00Z"
remediation = '升级 vpopmail 至 4.8 或更高版本，该版本已修复 vchkpw 中 syslog 调用的格式化字符串漏洞。如无法立即升级，可在 vchkpw 源码中将对 syslog 的调用改为 syslog(LOG_INFO, "%s", buffer) 形式，避免直接将用户输入作为格式化字符串参数传递。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Inter7 vpopmail vchkpw 格式字符串拒绝服务漏洞"
updated = "2026-06-16T21:52:02Z"

