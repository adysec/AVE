[basic]
description = "Leif M. Wright everythingform.cgi 2.0 程序存在一个严重的安全漏洞。该 CGI 脚本在处理 config 参数时未能对用户输入进行有效过滤，导致攻击者能够通过注入 shell 特殊字符来执行任意 shell 命令。该漏洞影响到 everythingform.cgi 2.0 版本及类似版本，由未经验证的远程攻击者可利用此漏洞在目标服务器上执行系统命令，可能导致系统完全被入侵。攻击者可以利用此漏洞窃取敏感数据、修改系统配置或植入恶意后门程序，严重威胁服务器安全。此漏洞 CVSS 评分达到 10.0，属于最高危等级。2001 年发现的这一漏洞是早期网络安全的重要案例，凸显了 Web 应用中输入验证的重要性。"
published = "2001-02-12T05:00:00Z"
remediation = "由于该软件已停止维护，建议立即从服务器上删除 everythingform.cgi 脚本以消除风险。若必须保留，请在 Web 服务器（如 Apache/Nginx）层面配置 WAF 规则，拦截包含 `;`, `|`, `&`, `` ` `` 等 Shell 元字符的请求，或通过代码重写对 config 参数进行严格的白名单过滤。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Leif Wright everythingform.cgi 任意命令执行漏洞"
updated = "2026-06-16T21:53:30Z"

