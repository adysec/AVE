[basic]
description = "Adobe Flash Player 在处理 MP4 文件中的 cprt 数据块时存在内存破坏漏洞（CWE-787，越界写入）。远程攻击者可通过诱导用户访问恶意网页或打开特制的 MP4 文件触发该漏洞，导致内存损坏，进而实现任意代码执行或拒绝服务。受影响版本包括 Windows、Mac OS X、Linux、Solaris 平台上的 Flash Player 10.3.183.15 之前版本及 11.1.102.62 之前版本，以及 Android 平台多个版本。该漏洞已被广泛利用，Metasploit 框架包含公开利用模块。"
published = "2012-02-16T19:55:01Z"
remediation = "建议立即升级 Adobe Flash Player 至 10.3.183.15 或 11.1.102.62 及以上版本（Windows/Mac/Linux/Solaris），Android 2.x/3.x 升级至 11.1.111.6，Android 4.x 升级至 11.1.115.6。由于 Flash Player 已停止支持，强烈建议彻底卸载 Flash Player 并迁移至 HTML5 标准。"
score = 8.1
severity = "HIGH"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:38:11Z"

