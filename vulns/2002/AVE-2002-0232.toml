[basic]
description = "Linux Netfilter 组件（iptables 1.2.6a 及更早版本）的网络地址转换功能在处理 ICMP 错误消息时，会错误地泄露经过地址转换后的内部真实 IP 地址。攻击者无需任何权限即可远程触发该漏洞（AV:N/AC:L/PR:N/UI:N），通过发送特制数据包诱导目标系统产生 ICMP 错误响应，从而在错误消息中获取内网真实 IP 信息，导致网络拓扑结构、主机布局等敏感信息泄露，严重破坏 NAT 提供的地址隐藏安全性。该漏洞影响启用 NAT 功能的 Linux 内核防火墙系统，CVSS 3.1 评分 7.5（HIGH），机密性影响高（C:H），完整性和可用性无影响。NVD 于 2002-07-26 发布，建议升级至 iptables 1.2.6b 或内核 2.4.20 以上版本修复。"
published = "2002-07-26T04:00:00Z"
remediation = "立即升级iptables到1.2.6b或以上版本，开启连接跟踪功能以完整记录NAT状态；在iptables规则中禁用自动生成的ICMP错误消息，实现IP地址信息过滤和隐藏；关闭不必要的日志记录功能，阻止通过防火墙规则间接泄露内网IP地址；如有条件，可迁移到nftables以获得更好的NAT状态跟踪和安全性"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Linux NetFilter NAT 信息泄露漏洞"
updated = "2026-06-16T21:57:58Z"

