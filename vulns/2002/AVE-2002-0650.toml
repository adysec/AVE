[basic]
description = "vBulletin 论坛软件在 2.2.0 版本之前的 calendar.php 文件中存在命令注入漏洞。未经身份认证的远程攻击者可以通过向 calendar.php 的 command 参数提交包含 shell 元字符的恶意输入，将任意系统命令注入到服务器端执行。该漏洞影响 vBulletin 2.0.x 系列版本，攻击者无需登录即可利用，仅需向目标服务器发送构造好的 HTTP 请求即可触发命令执行，可能导致服务器被完全控制、敏感数据泄露或进一步内网渗透。攻击条件宽松，网络可达且无需权限，危害程度较高。"
published = "2002-12-31T05:00:00.000"
remediation = "立即将 vBulletin 升级至 2.2.0 或更高版本，该版本已修复 calendar.php 对 command 参数未过滤 shell 元字符导致的远程命令执行漏洞。如暂时无法升级，可临时在 Web 服务器配置中限制对 calendar.php 的访问，或通过修改文件系统权限禁止该脚本执行，以缓解被远程攻击的风险。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "vBulletin 命令执行漏洞"
updated = "2026-06-16T21:59:44.500"

