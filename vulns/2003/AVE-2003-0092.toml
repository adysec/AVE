[basic]
description = "Ethereal（现称 Wireshark）网络协议分析器 0.9.12 及更早版本中的 SPNEGO 协议解析器存在拒绝服务漏洞。远程攻击者无需任何身份验证，仅需向运行 Ethereal 的目标系统发送一个包含畸形 ASN.1 结构值的特制网络数据包，即可在 Ethereal 解析 SPNEGO 握手数据时触发该漏洞，导致应用程序崩溃，造成拒绝服务。该漏洞影响使用受影响版本 Ethereal 进行网络流量捕获和分析的所有系统，攻击条件简单，无需物理接触或用户交互，利用难度极低，仅造成服务中断而不涉及数据泄露或代码执行。Ethereal 官方已在后续版本中修复此问题，建议用户升级至安全版本。"
published = "2003-07-24T04:00:00Z"
remediation = "建议立即升级 Ethereal 至 0.9.13 或更高版本（现更名为 Wireshark，建议升级至最新稳定版）。若无法立即升级，可在捕获过滤器中排除 SPNEGO 流量（如 `not tcp.port == 88`）或禁用 SPNEGO 解析器作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Ethereal 0.9.12 SPNEGO Dissector 拒绝服务漏洞"
updated = "2026-06-16T22:02:11Z"

