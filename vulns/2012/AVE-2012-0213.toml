[basic]
description = "Mozilla Firefox 4.x至13.0、Thunderbird 5.0至13.0及SeaMonkey 2.11之前版本的浏览器引擎中存在多处未指定的内存安全漏洞。远程攻击者可通过未知向量触发内存破坏，导致目标应用程序崩溃或拒绝服务，在特定条件下可能实现任意代码执行。该漏洞CVSS评分9.3，危害等级严重，影响范围广泛。Mozilla已在Firefox 14.0及相应版本中修复此漏洞。"
published = "2012-07-18T10:26:48.533"
remediation = "升级 Mozilla Firefox 至 14.0 及以上版本，Thunderbird 至 14.0 及以上版本，SeaMonkey 至 2.11 及以上版本。无法立即升级时，可禁用 JavaScript（在 about:config 中将 javascript.enabled 设为 false）作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 浏览器引擎内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:40:38.080"

