[basic]
description = "UnixWare 7.1.1 消息目录库函数存在格式字符串漏洞。攻击者可通过修改 LC_MESSAGE 环境变量，利用 setuid 程序（如 vxprint）读取其它消息目录中的格式字符串，从而导致本地权限升级。该漏洞仅限本地攻击者执行，攻击复杂度低，CVSS 评分 7.2（完全破坏机密性、完整性和可用性），受影响操作系统为 UnixWare 7.1.1。攻击者需先获得本地访问权限方可触发，未受影响的版本包含此漏洞修复机制，但默认安装配置下此类修复并非常规策略，且可能与应用兼容性问题相关，导致企业环境广泛使用此受影响版本。"
published = "2002-05-29T04:00:00Z"
remediation = "升级到 Caldera UnixWare 7.1.1 的安全补丁版本，参考 Caldera 安全公告 CSSA-2002-SCO.3（ftp://stage.caldera.com/pub/security/unixware/CSSA-2002-SCO.3/CSSA-2002-SCO.3.txt）获取并安装对应补丁。临时缓解措施：在运行 setuid 程序（如 vxprint）前，将 LC_MESSAGES 环境变量设置为空值或不可信的只读目录，阻止攻击者通过该变量注入恶意格式字符串载荷。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Caldera UnixWare 7.1.1 消息目录环境变量格式字符串漏洞"
updated = "2026-06-16T21:57:04Z"

