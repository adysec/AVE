[basic]
description = "Linux 内核 FEC（Fast Ethernet Controller）网络驱动存在空指针解引用漏洞。在 `fec_enet_update_cbd` 函数中，调用 `page_pool_dev_alloc_pages` 分配内存页面时，若因系统内存压力较大导致该函数返回 NULL，驱动未对 NULL 返回值进行正确处理，仅触发 WARN_ON 告警后继续使用空指针，导致系统内核崩溃。该漏洞影响使用 FEC 以太网控制器的嵌入式平台（如 NXP i.MX6Q 等），在系统内存不足或高负载场景下可被触发，攻击者可通过持续网络流量或 SMB 文件写入等方式诱发内存紧张，进而造成拒绝服务。CVSS v3.1 评分 7.5，危害等级为高。"
published = "2025-01-31T12:15:28Z"
remediation = "升级 Linux 内核至包含修复的稳定版本：6.1 系列升级至 6.1.167 或更高版本，6.6 系列升级至 6.6.74 或更高版本，6.12 系列升级至 6.12.11 或更高版本。对于 Ubuntu 24.04 LTS，安装内核版本 6.8.0-62.65 或更新版本；Ubuntu 24.10 则升级至 6.11.0-24.24 或更新版本。如暂时无法升级内核，可通过执行 sysctl -w vm.min_free_kbytes=65536 增大系统空闲内存阈值，或加载 fec 模块时增加 page pool 预分配数量以降低内存紧张时的分配失败概率，但此措施仅为临时缓解，最终仍需升级内核以彻底修复。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Linux内核 fec以太网控制器空指针解引用拒绝服务漏洞"
updated = "2026-07-30T06:18:28Z"

