[basic]
description = "简体中文版 Windows 2000 系统的输入法编辑器（Input Method Editor，IME）存在权限控制缺陷，未正确禁用本应受限的特权功能接口。当本地用户已登录系统后，可通过触发 IME 状态识别机制绕过正常的安全限制，进而获取超出普通用户权限的特权访问能力，实现本地权限提升。该漏洞影响简体中文版 Windows 2000 操作系统，CVSS 评分为 4.6，危害等级中等，攻击条件要求攻击者已在目标主机上拥有本地访问权限。"
published = "2000-12-19T05:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-069 发布的补丁程序，该补丁可让简体中文输入法正确识别系统状态并在登录屏幕中限制不应暴露的功能。下载地址为 Microsoft 下载中心（FamilyId=6CD4A747-9DE4-4F2F-817F-92BB597B8F5B），适用于 Windows 2000（含或不含 SP1）。若无法立即打补丁，可升级至 Windows 2000 Service Pack 2（已集成此补丁），或在登录屏幕禁用简体中文 IME 输入法作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows 2000 简体中文输入法权限提升漏洞"
updated = "2026-06-16T21:52:47.940"

