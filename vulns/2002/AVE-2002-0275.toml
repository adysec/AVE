[basic]
description = "GNU Mailman 2.0.12 之前版本存在跨站脚本漏洞，攻击者可通过订阅者的列表订阅选项中的 adminpw 或 info 参数向 ml-name 功能注入恶意脚本，诱导其他用户访问时执行任意脚本代码。该漏洞影响 Mailman 2.0.x 版本，CVSS 评分 7.5（高危），攻击向量为网络、攻击复杂度低、无需认证、可导致机密性、完整性、可用性部分受损。攻击者可构造恶意订阅链接诱导管理员或用户点击，窃取会话凭证或执行恶意操作。GNU 已在 2.0.12 版本中修复此漏洞，建议升级至 2.0.12 或更高版本。"
published = "2002-09-05T04:00:00.000"
remediation = "建议立即升级 GNU Mailman 至 2.0.12 或更高版本（如 2.1.x 稳定版）。若暂时无法升级，可临时在 Web 服务器层面（如 Apache mod_security）配置规则拦截包含脚本标签的 adminpw 和 info 参数，或在 Mailman 配置中禁用基于 Web 的订阅管理功能作为临时缓解措施。建议尽快通过官方渠道（https://www.list.org/）下载并安装 2.0.12 或更高版本补丁包。同时建议配置 Web 应用防火墙（WAF）拦截包含 <script>、javascript: 等 XSS 特征的 adminpw 和 info 参数请求。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "GNU Mailman 跨站脚本漏洞"
