[basic]
description = "Linux 内核 SCSI qla1280 驱动程序中存在空指针解引用漏洞。当驱动程序以 DEBUG_QLA1280 调试选项编译且 ql_debug_level 大于 2 时，调试信息打印函数错误地使用了 sg_next(s) 的长度而非 sg_dma_len(s)，导致内核触发空指针解引用并产生 oops 异常，系统可能发生内核崩溃或拒绝服务。该漏洞影响使用 QLogic QLA1280 SCSI 主机总线适配器的 Linux 内核系统，攻击者需要具备本地系统权限才能触发此调试代码路径。Linux 内核社区已提交补丁修复此问题，将错误的 sg_next(s) 长度替换为正确的 sg_dma_len(s) 计算方式。"
published = "2025-04-01T16:15:26Z"
remediation = "升级 Linux 内核至包含 commit 5233e3235dec3065ccc632729675575dbe3c6b8a 的稳定版本，如 Debian 12 bookworm 的 6.1.133-1 及以上版本、Debian 11 bullseye 的 5.10.237-1 及以上版本，或 SUSE Linux Enterprise 15 SP6/SP7 对应的内核更新包。如无法立即升级，可临时降低 ql_debug_level 至 2 或以下，或重新编译内核时禁用 CONFIG_SCSI_QLA1280_DEBUG 选项以消除触发条件。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 qla1280 SCSI 驱动空指针解引用漏洞"
updated = "2026-06-17T08:44:42Z"

