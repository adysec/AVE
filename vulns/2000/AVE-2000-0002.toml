[basic]
description = "Apache Tomcat 3.0 和 3.1 版本中 Snoop Servlet 存在信息泄露漏洞。远程攻击者无需身份认证即可通过向目标服务器发送带有 .snp 扩展名的不存在 URL 请求，触发 Snoop Servlet 返回系统环境变量、系统属性、请求参数等敏感信息。攻击者可利用泄露的信息进一步探测内网结构或实施更深入的攻击。该漏洞影响 Jakarta Tomcat 3.0 和 3.1 版本，CVSS 评分 6.4，危害等级中危。建议升级至 Tomcat 3.2 及以上版本或禁用 Snoop Servlet。"
published = "2000-10-20T04:00:00.000"
remediation = "升级至 Apache Tomcat 3.2 及以上版本，该版本已移除存在信息泄露风险的 Snoop servlet。如无法升级，在 web.xml 中删除 snoop servlet 及其 .snp 扩展名映射，或通过 Apache 配置限制对 /examples/jsp/snp/ 路径的访问。"
score = 6.4
severity = "MEDIUM"
sources = ["epss"]
title = "Apache Tomcat Snoop Servlet 信息泄露漏洞"
updated = "2026-06-16T21:52:25.440"

