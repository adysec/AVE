[basic]
description = "Microsoft Visual Studio 6.0 Enterprise Edition 中的 VB-TSQL 调试器对象 vbsdicli.exe 存在缓冲区溢出漏洞。远程攻击者无需身份验证即可通过网络向调试器发送特制请求触发缓冲区溢出，成功利用后可执行任意代码，完全控制目标系统。该漏洞影响 Visual Basic 和 Visual Studio 6.0 用户，CVSS 评分 7.5，危害等级高。"
published = "2001-05-03T04:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS01-018 提供的补丁，下载地址为 https://msdn2.microsoft.com/vstudio/Aa718356。受影响用户应将 Visual Studio 6.0 Enterprise Edition 升级至 Service Pack 6 或更高版本。如无法立即打补丁，应在路由器或防火墙层面阻止端口 137-139 和 445 的入站流量，以阻断来自互联网的远程利用。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Visual Studio 6.0 VB-TSQL 调试器对象缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:46.343"

