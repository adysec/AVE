[basic]
description = "Windows 虚拟受信任的平台模块（Virtual TPM）存在输入验证不当漏洞（CWE-20）。具有本地低权限的攻击者可利用该漏洞向目标系统发送特制的请求，触发虚拟 TPM 组件拒绝服务，导致系统可用性受影响。该漏洞无需用户交互即可利用，影响 Windows 10/11 及 Windows Server 多个版本。CVSS 评分 5.5，危害等级中危。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:49Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新（KB5049981），通过 Windows Update 或 Microsoft Update Catalog 手动下载并安装补丁。受影响系统包括 Windows 10 Version 1507/1607/1809/21H2/22H2、Windows 11 22H2/23H2/24H2 及 Windows Server 2016/2019/2022/2025，需将系统更新至包含该补丁的对应版本（如 Windows 11 24H2 需更新至 10.0.26100.2894 及以上）。如暂无法立即安装补丁，可暂时禁用虚拟机监控程序中的虚拟 TPM（vTPM）功能作为临时缓解措施。详细修复信息参见 https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-21284"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 虚拟受信任的平台模块 拒绝服务漏洞"
updated = "2026-06-17T08:42:59Z"

