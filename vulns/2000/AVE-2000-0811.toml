[basic]
description = "TransSoft Broker FTP Server 3.0.x 及 4.0 版本存在缓冲区溢出漏洞。远程攻击者无需身份认证即可通过向 FTP 服务器发送超长的用户名命令触发栈缓冲区溢出，导致服务崩溃拒绝服务，并可能执行任意代码。该漏洞影响 TransSoft Broker FTP Server 4.3.0.1 之前的所有版本，CVSS 评分 7.5，危害等级高。攻击者只需具备网络访问能力即可利用，无需任何权限，利用复杂度低。"
published = "2001-01-09T05:00:00.000"
remediation = "升级 TransSoft Broker FTP Server 至 4.3.0.1 或更高版本以修复用户名缓冲区溢出漏洞。如无法升级，在防火墙或网络层面限制对 FTP 服务（默认端口 21）的访问，仅允许受信任 IP 连接，并监控异常长度的 FTP 命令。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "TransSoft Broker FTP Server 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:10.893"

