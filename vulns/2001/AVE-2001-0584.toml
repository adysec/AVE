[basic]
description = "Ipswitch IMail 6.0.5 存在拒绝服务漏洞。远程攻击者可通过 SMTP AUTH 命令发送长度在 80 到 136 字节之间的 base64 编码用户密码，导致邮件服务程序崩溃或无法响应正常请求。该漏洞无需身份认证即可远程触发，攻击条件简单，影响邮件服务的可用性。"
published = "2001-02-16T05:00:00Z"
remediation = "升级 Ipswitch IMail 至 6.0.6 或更高版本，该版本修复了通过 SMTP AUTH 命令发送特制 base64 编码密码导致服务崩溃的问题。如无法升级，可在防火墙上限制对 SMTP 端口（25/TCP）的访问，仅允许可信来源连接。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Ipswitch IMail 6.0.5 SMTP AUTH 命令处理拒绝服务漏洞"
updated = "2026-06-16T21:53:32Z"

