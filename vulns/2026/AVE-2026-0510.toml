[basic]
description = 'cyberdrop-dl-patched 在处理 Pixeldrain URL 时存在 API 密钥泄露漏洞。该工具通过子字符串匹配方式识别 Pixeldrain 域名，攻击者可注册包含 "pixeldrain" 子串的恶意域名（如 evil-pixeldrain.com），诱导用户访问后，工具会将包含用户 Pixeldrain API 密钥的 Authorization 请求头发送到攻击者控制的服务器，导致 API 密钥泄露。已在 v9.14.0 版本中修复，采用精确域名匹配替代子字符串匹配。'
published = "2026-01-01T00:00:00Z"
remediation = "立即将 cyberdrop-dl-patched 升级至 v9.14.0 或更高版本，该版本通过严格匹配官方域名来阻止 API Key 泄露。已使用过 Pixeldrain API Key 的用户应视为密钥已泄露，需登录 Pixeldrain 账户删除并重新生成 API Key。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Cyberdrop-DL cyberdrop-dl-patched Pixeldrain API密钥泄露漏洞"
updated = "2026-01-01T00:00:00Z"

