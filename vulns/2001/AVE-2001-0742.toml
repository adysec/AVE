[basic]
description = "Mirabilis ICQ 2000.0b Build 3278的WebFront Plug-in插件在处理HTTP请求URL时存在输入验证缺陷，未能对请求中的百分号（%）字符进行正确处理。未经身份认证的远程攻击者可以通过向目标系统发送包含大量百分号字符的特制HTTP URL请求来触发该漏洞，导致WebFront服务崩溃并引发拒绝服务，使ICQ服务无法正常响应用户请求。该漏洞影响所有使用ICQ 2000.0b Build 3278版本WebFront Plug-in的用户，攻击条件为网络可达，无需任何认证凭据即可远程实施攻击。"
published = "2001-06-27T04:00:00Z"
remediation = "升级 Mirabilis ICQ 至厂商发布的最新版本，以修复 ICQ2000b Build 3278 WebFront Plug-in 中因 HTTP 请求包含大量百分号字符导致的拒绝服务漏洞。如暂无法升级，可在 ICQ 设置中禁用 WebFront Plug-in 功能，或在防火墙层面限制外部对 WebFront 服务端口的访问，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Mirabilis ICQ 2000b WebFront 拒绝服务漏洞"
updated = "2026-06-16T21:54:10Z"

