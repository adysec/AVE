[basic]
description = "Microsoft IIS 4.0 和 5.0 的 shtml.dll 组件在处理错误消息时未对用户输入进行正确转义，存在跨站脚本攻击（XSS）漏洞。远程攻击者可通过向受信任站点构造包含恶意脚本的特制链接，诱骗用户点击后，该脚本会在错误消息中未经引号处理直接返回给客户端浏览器，并在受信任站点的安全上下文中执行，导致敏感信息泄露、会话劫持或恶意操作。攻击无需身份认证，仅需用户交互即可触发。"
published = "2000-10-20T04:00:00.000"
remediation = "安装 Microsoft 安全公告 MS00-060 提供的补丁：IIS 4.0 下载 KB260347 补丁，IIS 5.0 下载 KB275657 补丁。同时对所有用户输入进行 HTML 编码过滤，在 Web 应用中禁用 shtml.dll 对错误消息中未转义脚本的处理，并在服务器端实施输入验证，过滤 `<script>`、`<`、`>` 等危险字符。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft IIS 4.0/5.0 shtml.dll 错误消息跨站脚本漏洞"
updated = "2026-06-16T21:52:23.690"

