[basic]
description = "Windows 通用即插即用(UPnP)设备主机服务存在不受控制的资源消耗漏洞，该漏洞源于 upnphost.dll 组件在处理特制网络请求时未正确限制资源分配。未经身份认证的远程攻击者可通过向目标系统发送精心构造的 UPnP 请求包，触发服务消耗大量系统资源，导致目标系统服务崩溃或停止响应，造成拒绝服务。该漏洞影响多个 Windows 版本，CVSS 评分 7.5，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:16:03Z"
remediation = '建议立即安装 Microsoft 2025 年 1 月安全更新 (KB5050061)，或通过 Windows Update 自动更新。如无法立即打补丁，可在 Windows 服务管理器中禁用 "UPnP Device Host" 服务（upnphost），或在防火墙入站规则中阻止对 TCP/UDP 1900 端口的访问作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows UPnP 设备主机拒绝服务漏洞"
updated = "2026-06-17T08:43:15Z"

