[basic]
description = 'Borland/Inprise Interbase 4.0、5.0 及 6.0 数据库服务器存在硬编码后门账户（用户名通常为 "SYSDBA"，密码为 "masterkey"），未经身份认证的远程攻击者可利用该默认账户直接连接数据库，并通过执行存储过程（stored procedures）向服务器文件系统写入任意内容，实现文件覆盖或植入后门。该漏洞影响所有启用默认配置的 Interbase 服务器实例，攻击者无需任何凭据即可在远程利用，可导致服务器被完全接管、敏感数据泄露或服务中断。CVSS 评分 10.0，危害等级严重。建议立即修改默认密码或升级至修复版本。'
published = "2001-02-12T05:00:00Z"
remediation = "建议立即停止使用 Interbase 4.0/5.0/6.0 版本，将其迁移至已修复该问题的 Firebird 或更新版本的 Interbase 数据库。若无法立即迁移，必须在网络防火墙上配置访问控制列表 (ACL)，封禁远程访问数据库端口（默认 3050），仅允许受信 IP 连接以缓解后门被利用的风险。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Borland Interbase 数据库后门账户远程任意文件覆盖漏洞"
updated = "2026-06-16T21:53:28Z"

