[basic]
description = 'Armada Design Master Index 1.0 的 search.cgi 脚本由于未能对用户输入的参数进行严格过滤，导致存在目录遍历漏洞。远程攻击者可以通过在 "catigory" 参数中构造特制的路径跳转字符（如 `..` 符号），绕过原有的路径限制，从而直接读取服务器上任意可访问的文件。该漏洞影响 Armada Design Master Index 1.0 版本，允许未经身份验证的攻击者在网络环境下获取敏感系统文件，导致信息泄露。'
published = "2000-12-19T05:00:00.000"
remediation = "Armada Master Index 1.0 已停止维护且未发布补丁，建议迁移至其他受支持的搜索引擎软件。如暂时无法替换，可在 Web 服务器层面对 search.cgi 的请求进行过滤：Apache 可通过 mod_rewrite 规则拦截 catigory 参数中包含 ../ 的请求，Nginx 可通过 rewrite 指令阻止目录遍历；同时将 Web 服务器运行账户权限降至最低，限制其只能访问必要的目录和文件。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Armada Design Master Index 目录遍历漏洞"
updated = "2026-06-16T21:52:46.660"

