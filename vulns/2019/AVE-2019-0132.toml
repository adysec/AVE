[basic]
description = "tags.<value>ProFTPD FTP服务器在处理过长FTP命令时存在无限循环漏洞，由于main.c子进程中未能正确限制命令长度，攻击者无需身份认证即可向目标服务器发送超长FTP指令，触发子进程进入死循环，导致服务拒绝响应。该漏洞影响ProFTPD 1.3.6b之前版本及1.3.7rc至1.3.7rc2之前的所有版本，攻击者可通过任意FTP客户端远程利用，造成目标FTP服务不可用。CVSS评分为7.5，属于高危级别。"
published = "2019-10-21T04:15:10.433"
remediation = "立即将 ProFTPD 升级至 1.3.6b 或更高版本（1.3.x 分支），或升级至 1.3.7rc2 及以上（1.3.7rc 分支）。升级后重启 ProFTPD 服务以加载修复补丁。若暂时无法升级，可在防火墙层面限制来自不可信网络的 FTP 连接，并启用 Rate Limiting 机制限制单位时间内命令请求频率，降低被利用的风险。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "ProFTPD FTP服务器处理过长命令时无限循环导致拒绝服务漏洞"
updated = "2026-06-17T02:24:30.160"

