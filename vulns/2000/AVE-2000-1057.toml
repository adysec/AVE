[basic]
description = "Check Point Firewall-1 4.0 及更早版本的客户端认证接口存在用户名枚举漏洞。由于系统在验证用户身份时，对无效用户名和无效密码返回不同的错误提示信息，远程攻击者无需认证即可通过暴力枚举方式区分有效与无效用户名，从而获取防火墙上的有效用户列表。该漏洞可被用作进一步攻击（如密码爆破）的前置步骤，影响范围包括 Check Point Firewall-1 4.0 及所有更早版本。"
published = "2000-12-11T05:00:00.000"
remediation = '升级到 Check Point Firewall-1 4.1 或更高版本，该漏洞已在后续版本中修复。对于无法升级的旧系统，可修改防火墙认证接口配置，对无效用户名和无效密码返回相同的通用错误信息（如"认证失败"），避免泄露用户名是否存在的信息。由于 Firewall-1 4.0 已停止技术支持，建议迁移至当前受支持的 Check Point 版本（如 R80 及以上系列）。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Check Point Firewall-1 用户枚举漏洞"
updated = "2026-06-16T21:53:00.660"

