[basic]
description = "Microsoft Excel 97 及 2000 版本中的 Register.ID 函数存在代码执行漏洞。攻击者可通过诱使用户打开特制的 Excel 文件，利用该函数加载恶意 DLL，从而在目标系统上执行任意命令。该漏洞需要本地访问权限，攻击者无法远程直接利用，但结合社会工程学手段（如钓鱼邮件）可有效触发。成功利用后可能导致敏感信息泄露、系统数据篡改或服务中断，影响用户系统安全。"
published = "2000-07-26T04:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-051 提供的补丁，该补丁禁用 Excel 工作表中的 REGISTER.ID 函数，阻止恶意 DLL 被调用。Excel 2000 用户安装 KB269252 更新，Excel 97 用户安装 KB269263 更新。如无法打补丁，建议不要打开来源不明的 Excel 文件，并在安全软件中启用宏防护策略。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Excel 97和2000 REGISTER.ID函数远程代码执行漏洞"
updated = "2026-06-16T21:52:09.710"

