[basic]
description = "Apple QuickTime 在处理 FlashPix（.FPX）图像文件时存在缓冲区溢出漏洞，该漏洞由不正确的内存边界检查导致。攻击者可通过构造恶意的 FlashPix 文件远程触发溢出，向目标系统发送特制文件即可利用此漏洞执行任意代码或导致应用程序崩溃（拒绝服务）。该漏洞影响运行 Mac OS X 10.7.2 之前版本的 Apple 系统，攻击者无需身份认证即可发起远程攻击，攻击条件为用户打开或预览恶意 FlashPix 文件。CVSS 评分 6.8，CWE-119。Apple 于 2011 年 10 月在 Mac OS X 10.7.2 安全更新中修复了此漏洞。"
published = "2011-10-14T10:55:08Z"
remediation = "建议 Mac OS X 用户通过软件更新安装 OS X Lion v10.7.2 或安全性更新 2011-006，Windows 用户将 QuickTime 升级至 7.7.1 或更高版本。临时缓解措施为避免打开来源不明的 FlashPix (.fpx) 文件。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "苹果 Mac OS X QuickTime FlashPix 文件缓冲区溢出漏洞"
updated = "2026-06-16T23:32:54Z"

