[basic]
description = "Apache HTTP Server 未对其错误日志中的终端转义序列进行过滤，攻击者可将精心构造的终端控制序列（如 ESC 转义码）通过请求头或请求内容注入到访问日志/错误日志中。当管理员使用存在相应转义序列处理漏洞的终端模拟器查看这些日志时，日志里嵌入的转义序列会被终端解释执行，从而能配合终端模拟器自身的漏洞触发任意操作，进一步可能导致被动的命令执行或造成管理员终端环境的敏感信息泄露。该漏洞实现攻击的前提条件是：攻击者能够向日志中注入包含转义序列的内容，同时管理员必须在其终端模拟器中查看相关日志；网络层面攻击复杂度较低、无需身份认证即可注入，但实际危害受限于终端模拟器是否受转义序列影响。该问题影响了 Apache 2.x 等多个版本的相关日志输出组件，CVSS 评分为 5.0，Red Hat 评估其危害等级为低，官方建议及时升级至受支持的安全版本并对日志呈现进行转义过滤加固。"
published = "2003-03-18T05:00:00Z"
remediation = "建议将 Apache 升级至 2.0.48 或更高版本，该版本修复了错误日志中终端转义序列的处理；升级后可配置日志过滤，对错误日志中的 ESC (x1b) 转义字符进行净化或剔除，防止恶意序列进入终端模拟器。作为缓解措施，避免直接查看原始错误日志的终端或采用支持安全解析转义序列的工具查看日志，并在 Web 服务器层面限制错误日志中输入可打印字符之外的字节。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Apache HTTP Server 终端转义序列注入漏洞"
updated = "2026-06-16T22:01:21Z"

