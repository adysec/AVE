[basic]
description = "Adobe Flash Player 29.0.0.171 及更早版本（30.0.0.113 之前版本）存在栈缓冲区溢出漏洞（CWE-787, CWE-121）。该漏洞源于 Flash Player 在处理特定恶意构造的 Flash 内容时，未正确验证栈缓冲区边界，导致攻击者可通过诱导用户访问包含恶意 Flash 内容的网页或打开恶意文件，触发栈缓冲区溢出，进而在当前用户权限上下文中执行任意代码。该漏洞影响 Windows、macOS、Linux 等平台上的 Adobe Flash Player，CVSS 3.1 评分 7.8（HIGH），攻击向量为本地（AV:L），攻击复杂度低（AC:L），无需权限（PR:N），但需要用户交互（UI:R），成功利用可导致机密性、完整性、可用性均受到高影响（C:H/I:H/A:H）。该漏洞已被 CISA 列入已知被利用漏洞目录，Adobe 已于 2018 年 6 月发布 30.0.0.113 版本修复此漏洞，用户应尽快升级至最新版本或卸载 Flash Player。"
published = "2018-07-09T19:29:03Z"
remediation = "建议立即升级 Adobe Flash Player 到 32.0.0.393 或更高版本，这是支持所有安全补丁的最新版本。如无法立即升级，可先通过全局策略禁用 Flash 插件。确保Windows Defender或杀毒软件开启漏洞防护，并监控系统对可疑flash进程的网络活动。此外，强烈建议彻底停用Flash功能，改用现代Web技术（HTML5/WebGL）以彻底消除风险。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Adobe Flash Player 栈缓冲区溢出漏洞"
updated = "2026-06-17T01:59:26Z"

