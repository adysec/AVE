[basic]
description = 'Phorum 3.0.7 的 auth.php3 文件中存在后门漏洞，远程攻击者无需身份认证即可通过构造包含 PHP_AUTH_USER 参数值为 "boogieman" 的 HTTP 请求绕过访问控制，从而获取受限页面的访问权限。该漏洞利用难度低，攻击者仅需发送特制 HTTP 请求即可触发，可能导致敏感信息泄露。CVSS 评分 5.0，危害等级中危。'
published = "2000-12-31T05:00:00.000"
remediation = '''
[id]
ave_id = "AVE-2000-00001"
aliases = ["CVE-2000-1230"]

[basic]
title = "Phorum 3.0.7 auth.php3 后门漏洞"
description = "Phorum 3.0.7 的 auth.php3 脚本中存在硬编码后门密码。远程攻击者无需任何身份认证，只需在 HTTP 请求中设置 PHP_AUTH_USER 参数为特殊值 \"boogieman\"，即可绕过身份验证机制，访问本应受限制的 Web 管理页面和资源。该漏洞影响所有使用 auth.php3 进行访问控制的页面，攻击者可借此获取敏感信息或进一步提权。"
severity = "MEDIUM"
score = 5.0
sources = ["cve", "exploitdb"]
published = "2000-12-31"
updated = "2024-06-16"
remediation = "升级到 Phorum 3.0.8 或更高版本。由于 Phorum 已停止维护，建议迁移到其他活跃维护的论坛系统。临时缓解措施可在 Web 服务器层面配置规则，拦截包含 PHP_AUTH_USER=boogieman 的 HTTP 请求。"

[references]
urls = ["https://www.exploit-db.com/exploits/20588", "http://www.securityfocus.com/bid/2274", "http://hispahack.ccc.de/mi020.html", "http://www.digitalsec.net/stuff/z-mirrors/hispahack/mi020.htm"]

