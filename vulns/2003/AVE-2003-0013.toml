[basic]
description = "MIT Kerberos V5 密钥分发中心（KDC）1.2.5 版本之前存在空指针解引用漏洞，远程已认证攻击者可通过向同一领域内的 KDC 发送特定协议请求触发该漏洞，导致 KDC 服务崩溃拒绝服务。该漏洞影响 MIT Kerberos 5-1.2.1 至 5-1.2.4 版本，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），攻击复杂度低、无需交互，但需认证权限且仅影响可用性。"
published = "2003-02-19T05:00:00Z"
remediation = "升级 MIT Kerberos V5 至 1.2.5 或更高版本。若无法立即升级，可在网络边界防火墙限制 KDC 服务端口（默认 88/TCP、88/UDP）仅允许受信任域控制器访问，并监控 KDC 崩溃日志及时重启服务。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "MIT Kerberos 5 Key Distribution Center NULL Pointer Dereference 拒绝服务漏洞"
updated = "2026-06-16T22:01:26Z"

