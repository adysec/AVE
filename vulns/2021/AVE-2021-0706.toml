[basic]
description = "Rockwell Automation Studio 5000 Logix Designer 21 及更高版本和 RSLogix 5000 16 至 20 版本在验证 Logix 控制器与 Rockwell Automation 通信时使用了密钥机制，但该验证机制存在不充分的凭证保护漏洞（CWE-522）。未经身份认证的远程攻击者无需任何凭据即可绕过此验证，进而对 CompactLogix 1768/1769/5370/5380/5480、ControlLogix 5550/5560/5570/5580、DriveLogix 5560/5730/1794-L34、Compact GuardLogix 5370/5380、GuardLogix 5570/5580 及 SoftLogix 5800 等工业控制器进行非法认证与操控。攻击者只需在网络可达目标的前提下发送特制数据包即可触发验证绕过，可能导致工业控制流程被篡改、生产中断或设备损坏，CVSS 评分 9.8，危害等级严重。"
published = "2021-03-03T18:15:14Z"
remediation = "Rockwell Automation 已确认该漏洞无法通过软件补丁修复，需采取以下缓解措施：将控制器模式开关置于 Run 模式以禁用通过消息触发的固件更新功能；在控制器上部署 CIP Security 协议以启用基于 TLS/DTLS 的安全通信，或升级并配置 1756-EN4TR ControlLogix EtherNet/IP 模块支持 CIP Security；在网络层面将控制系统设备置于防火墙后并隔离于企业网络，限制或阻断工业控制网络区域外的 TCP 44818 端口访问，禁止直接暴露于互联网；远程访问时仅通过 VPN 进行且 VPN 须保持最新版本；监控控制器更改日志以检测异常修改，v17 及以上版本启用 Controller Log，v20 及以上版本启用 Change Detection，如有条件使用 FactoryTalk AssetCentre 监控配置与程序文件变更。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "罗克韦尔自动化 Studio 5000 Logix Designer 身份验证绕过漏洞"
updated = "2026-06-17T03:37:34Z"

