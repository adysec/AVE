[basic]
description = 'Microsoft Windows Server 2003 R2 的 IIS 6.0 WebDAV 服务中 ScStoragePathFromUrl 函数存在缓冲区溢出漏洞。远程攻击者无需身份认证即可向目标服务器发送特制的 PROPFIND 请求，在 If 头中构造以 "If: <http://" 开头超长字符串触发栈缓冲区溢出，导致远程代码执行。该漏洞影响 Windows Server 2003 R2 系统，CVSS 评分 9.8，危害等级严重。该漏洞曾在 2016 年 7 至 8 月被野外利用，已有公开的 Metasploit 利用模块和多种 PoC 代码。'
published = "2017-03-27T02:59:00.453"
remediation = "Windows Server 2003 R2 已于 2015 年 7 月停止支持，微软未发布官方补丁。建议立即迁移至受支持的 Windows Server 版本（如 2012/2016/2019/2022）。若无法迁移，可采取以下缓解措施：1) 在 IIS 6.0 管理器中禁用 WebDAV 扩展；2) 在防火墙或 WAF 上拦截包含 `If: <http://` 开头的 PROPFIND 请求；3) 使用 URLScan 工具过滤长 `If:` 头部请求。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Microsoft IIS 6.0 WebDAV 远程代码执行漏洞"
updated = "2026-06-17T01:23:58.520"

