[basic]
description = "用户应用程序初始化脚本存在命令注入漏洞，低权限本地用户可通过构造特制的输入参数在系统启动时注入恶意操作系统命令，以 root 身份执行任意代码，从而获取系统完全控制权。该漏洞影响使用受影响初始化脚本管理的用户应用程序所在主机，攻击者需拥有目标系统的本地低权限访问权限即可利用，无需额外身份认证或用户交互。成功利用后，攻击者可完全接管目标系统，读取敏感数据、修改系统配置或进一步横向移动。CWE-78 类型漏洞，CVSS v4.0 评分 8.5，危害等级高。"
published = "2026-07-30T07:16:57.260"
remediation = "将 CHARX SEC-3000/3050/3100/3150 设备的固件升级至 v1.9.1 或更高版本，该修复版本由 Phoenix Contact 于 2026 年 8 月 12 日前发布，可通过厂商官方支持渠道获取。如无法立即升级，应临时限制低权限本地用户对 user-applications 服务的访问权限，并在文件系统中禁用不必要用户的符号链接创建能力（例如通过设置 /etc/sysctl.conf 中的 fs.protected_symlinks=1），同时限制本地 SSH/Telnet 等远程登录入口以减少攻击面。"
score = 8.5
severity = "HIGH"
sources = ["zdi"]
title = "操作系统 初始化脚本 命令执行漏洞"
updated = "2026-07-30T14:31:21.447"

