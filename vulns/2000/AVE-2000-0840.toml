[basic]
description = "Qualcomm qpopper 2.53/3.0、RedHat imap 4.5 及 UoW imap 4.5 的 popd 服务在创建邮箱锁文件时使用可预测的文件名，本地攻击者可通过预先创建目标用户的锁文件，导致合法用户无法访问邮件服务，造成拒绝服务。该漏洞属于不当锁定机制（CWE-667），攻击向量为本地（AV:L），需低权限（PR:L）且无需用户交互（UI:N），主要影响可用性（A:H），CVSS 3.1 评分 5.5（中危）。攻击者只需拥有本地系统访问权限，即可通过创建同名锁文件阻断其他用户的 POP 邮件收取功能。"
published = "2001-08-31T04:00:00Z"
remediation = "升级 qpopper 至 4.0 或更高版本（采用随机锁文件名），升级 UW imap 至 2000 年 9 月后版本，RedHat 用户安装 imap-4.5-5 或更新的 RPM 包。若无法立即升级，可通过设置邮箱目录粘滞位（chmod +t /var/spool/mail）防止非所有者创建锁文件，或配置 POP 服务使用非预测性锁文件路径。"
score = 5.5
severity = "MEDIUM"
sources = ["cve"]
title = "高通 qpopper 文件锁定拒绝服务漏洞"
updated = "2026-06-16T21:53:21Z"

