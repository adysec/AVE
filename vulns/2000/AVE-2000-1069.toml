[basic]
description = "HP JetDirect 打印卡 Telnet 服务存在缓冲区溢出漏洞，固件版本 x.08.20 及更早版本（包括 x.08.04、x.08.05）均受影响。未经身份验证的远程攻击者可向目标设备 Telnet 服务（默认端口 23）发送超长或构造畸形的数据包，触发缓冲区溢出，导致打印卡服务异常中断，网络打印功能完全不可用，造成拒绝服务攻击。该漏洞攻击复杂度低、无需认证、无需用户交互，攻击者可远程发起利用，影响所有暴露 Telnet 服务的 HP JetDirect 打印服务器设备。HP 已发布固件更新修复此问题，建议用户升级到 x.08.20 之后的安全版本并限制 Telnet 服务的网络访问。"
published = "2000-12-11T05:00:00Z"
remediation = "升级 HP Jetdirect 打印卡固件至 x.08.20 之后的安全版本（建议通过 HP 官方支持渠道获取最新固件并重新刷写）；如无法立即升级，建议在设备管理界面禁用 Telnet、FTP 及 LPD 服务，并在网络边界通过防火墙或 ACL 限制对 Jetdirect 设备管理端口的访问，仅允许可信网段通信。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "HP Jetdirect 打印机网卡 Telnet 服务缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:53:04Z"

