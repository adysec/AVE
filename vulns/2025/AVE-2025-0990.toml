[basic]
description = "Linux内核hid-thrustmaster驱动存在栈外读取漏洞（CWE-125）。该驱动的ep_addr数组在传递给usb_check_int_endpoints()函数时缺少终止空元素，导致该函数中的for循环遍历数组时无法识别数组边界，从而读取数组末尾之后的非-existent内存数据。攻击者可在本地以低权限用户身份，通过向系统插入特制的Thrustmaster USB HID设备触发该漏洞，成功利用可导致内核崩溃（拒绝服务）或泄露高权限敏感内存信息。该漏洞影响包含该驱动的Linux内核版本，CVSS评分7.1，危害等级高。修复方案是在ep_addr数组末尾添加0元素以正确终止循环。"
published = "2025-02-27T03:15:20.293"
remediation = "建议将 Linux 内核更新至已修复该漏洞的稳定版本。具体操作为在 Linux 源代码中为 hid-thrustmaster 驱动的 ep_addr 数组末尾添加 0 元素以防止栈越界读取，或通过发行版（如 Debian LTS DLA-4102）提供的安全更新包进行内核升级并重启系统。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 hid-thrustmaster 堆栈越界读取漏洞"
updated = "2026-06-17T08:44:17.790"

