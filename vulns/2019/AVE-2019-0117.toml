remediation = "立即将 OneTone 主题升级至 3.0.7 或更高版本，该版本修复了 includes/theme-functions.php 中的存储型 XSS 漏洞。如短期内无法升级，应在 WordPress 管理后台停用 OneTone 主题并切换至 Twenty Twenty-Four 等受支持的主题。临时缓解措施包括：使用 WordPress 提供的 esc_html()、esc_attr()、wp_kses() 等函数对所有前端输出字段进行转义，在 includes/theme-functions.php 中对用户可控输入进行过滤，在 Web 应用防火墙层配置规则拦截 script、iframe、javascript:、onerror 等常见 XSS 载荷，并设置 wp-content/themes/onetone/ 目录为只读权限，阻止攻击者持久化恶意脚本。"
