[basic]
description = "Linux 内核 ksmbd（SMB/CIFS 文件服务器）实现中存在空指针解引用漏洞。在 smb2_send_interim_resp() 函数中，当 ksmbd_alloc_work_struct() 分配工作结构体失败时返回 NULL 指针，后续 allocate_interim_rsp_buf() 未做空值检查即直接访问 in_work->response_buf，导致非法内存写入。本地低权限攻击者可利用该漏洞触发内核崩溃或造成系统完整性及可用性受损。该漏洞影响 Linux 内核 ksmbd 模块，CVSS 评分 7.1，危害等级高。"
published = "2025-01-19T12:15:26Z"
remediation = "立即更新 Linux 内核至修复版本：稳定分支升级至 5.15.177、6.1.125、6.6.72 或 6.12.10 及以上版本，主线内核升级至 6.13 及以上版本。各发行版用户请安装对应安全更新：Ubuntu 24.04 LTS 升级 linux-image-6.11.0-1011-lowlatency 至 6.11.0-1011.12~24.04.1，Ubuntu 20.04 LTS 升级 linux-image-5.15.0-1077-intel-iotg 至 5.15.0-1077.83~20.04.1，Debian 用户参考 DLA-4041-1 公告更新。如无法立即打补丁，可临时禁用 ksmbd 内核模块（rmmod ksmbd）或通过防火墙限制 SMB 端口（445/tcp）访问作为缓解措施。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux ksmbd 空指针解引用导致非法内存访问漏洞"
updated = "2026-06-17T08:14:14Z"

