[basic]
description = "SourceForge NewsDaemon 0.21b 版本及更早版本存在 SQL 注入漏洞。远程攻击者可通过在用户登录请求中构造恶意的 user_username 参数，向应用程序后台数据库发送任意 SQL 查询语句，从而获取数据库敏感信息并提升自身权限。该漏洞影响所有运行 NewsDaemon 0.21b 之前版本的服务器，攻击者无需身份认证即可远程利用，攻击复杂度低且成功率高。成功利用后，攻击者可绕过身份验证机制，以管理员或其他高权限账户身份访问系统，威胁数据安全和系统完整性。"
published = "2001-05-03T04:00:00.000"
remediation = "将 NewsDaemon 升级至 0.21b 或更高版本，该版本已修复 user_username 参数的 SQL 注入漏洞。若暂无法升级，应对 user_username 输入进行严格过滤，禁止传入单引号、分号等特殊字符，并在数据库层对查询语句进行参数化绑定，同时限制 NewsDaemon 的数据库账户权限为最低必需权限。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "SourceForge NewsDaemon SQL注入漏洞"
updated = "2026-06-16T21:53:56.013"

