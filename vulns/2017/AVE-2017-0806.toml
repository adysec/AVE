[basic]
description = "Citrix NetScaler SD-WAN 设备（含 CloudBridge 系列）v9.1.2.26.561201 及之前版本存在命令注入漏洞。远程未经身份认证的攻击者可通过向目标设备发送特制的 CGISESSID（CloudBridge 设备为 CAKEPHP）Session ID Cookie，利用输入验证缺陷以 root 权限执行任意系统命令。该漏洞 CVSS 评分 9.8，危害等级严重，影响范围广泛。目前已存在公开的 Metasploit 利用模块，攻击者可直接获取设备完全控制权。"
published = "2017-07-20T04:29:00Z"
remediation = "立即升级 Citrix NetScaler SD-WAN 至 10.0.0 或更高版本（CloudBridge 设备同步升级），该漏洞已在 CTX220265 公告中修复。如无法立即升级，可在管理接口前端部署 Web 应用防火墙（WAF），配置规则拦截包含异常 CGISESSID 或 CAKEPHP cookie 值的请求，并限制管理接口仅允许可信 IP 访问。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Citrix NetScaler SD-WAN 命令注入漏洞"
updated = "2026-06-17T01:22:08Z"

