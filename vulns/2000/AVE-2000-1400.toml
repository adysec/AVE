[basic]
description = 'Microsoft Outlook 和 Outlook Express 在处理HTML格式电子邮件时存在"缓存绕过"漏洞。远程攻击者可通过向目标用户发送特制的畸形HTML邮件，利用客户端将文件存储在缓存目录之外的机制，绕过浏览器缓存安全限制，从而读取客户端系统上的敏感文件。该漏洞影响 Microsoft Outlook 98/2000 以及 Outlook Express 4.0x/5.0x 等旧版本邮件客户端。攻击者无需预先认证或交互，仅需受害者打开或预览恶意HTML邮件即可触发。CVSS评分为7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），危害等级为高危。'
published = "2000-07-20T04:00:00.000"
remediation = "安装 Microsoft 2000 年 7 月安全更新（MS00-046），该补丁修复 Outlook 98、Outlook 2000、Outlook Express 4.x 及 5.x 的缓存绕过漏洞。也可将 Internet Explorer 升级至 5.01 Service Pack 1 或 5.5 版本（除 Windows 2000 外），其中 Outlook Express 5.5 已包含不受影响的组件。如无法立即安装补丁，可临时在 Outlook 和 Outlook Express 中将邮件阅读格式切换为纯文本，禁用 HTML 邮件渲染以防止恶意邮件利用缓存绕过机制读取本地文件。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Outlook 和 Outlook Express 远程文件读取漏洞"
updated = "2026-06-16T21:52:07.677"

