[basic]
description = "MiniVend 购物车程序的 view_page.html 示例页面存在命令注入漏洞，远程攻击者可通过向该页面提交包含 shell 元字符的特制请求，在服务器上执行任意系统命令。该漏洞源于程序未对用户输入进行有效过滤，攻击者无需身份认证即可利用，可导致敏感信息泄露、系统被控制等严重后果。CVSS 评分 7.5，危害等级高。"
published = "2000-07-10T00:00:00Z"
remediation = "立即删除或禁用 MiniVend 安装目录下的 `view_page.html` 示例页面文件，该文件存在 shell 元字符注入漏洞。升级到 MiniVend 4.03 及以上版本（或其后继项目 Interchange），该版本已修复此命令注入问题。如无法升级，在 Web 服务器层面配置规则拦截对 `view_page.html` 的访问请求，并确保所有用户输入经过严格过滤后再传递给系统调用。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "MiniVend view_page.html 远程命令执行漏洞"
updated = "2000-07-10T00:00:00Z"

