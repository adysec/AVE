[basic]
description = "Linux 2.4.x内核的/proc/tty/driver/serial文件会暴露串行链路中传输字符的精确数量，本地用户可通过读取该文件获取敏感信息，例如通过分析串行通信中的字符计数推断密码长度等隐私数据。该漏洞影响Linux 2.4.x系列内核，攻击者需具有本地访问权限即可利用，无需身份认证，可通过直接读取/proc文件系统实现信息泄露。"
published = "2003-08-27T04:00:00Z"
remediation = "将 Linux 内核升级至 2.4.22 或更高版本（推荐升级至 2.6.x 稳定版），Debian  woody 用户应安装 kernel-source-2.4.18-11 或 kernel-image-2.4.18-9，Ubuntu 6.06 LTS/6.10 用户应安装内核版本 2.4.27-12，Red Hat 7.x/8/9 用户应应用 RHSA-2003:238 及 RHSA-2004:188 安全补丁。如暂时无法升级内核，可将 /proc/tty/driver/serial 文件权限修改为仅 root 可读（chmod 600 /proc/tty/driver/serial），或通过加载 hidepid 挂载选项限制普通用户对 /proc 的访问，以缓解信息泄露风险。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Linux Kernel串行驱动Proc文件信息泄露漏洞"
updated = "2026-06-16T22:02:14Z"

