[basic]
description = "Apple Safari浏览器在6.0及更早版本中，WebKit渲染引擎未能正确过滤和处理拖放（drag-and-drop）事件，导致当用户访问恶意网站时，页面可通过特定脚本劫持用户的拖放操作，将本地文件内容回传至远程服务器。该漏洞影响macOS和Windows平台上所有使用受影响的WebKit版本的产品，攻击需用户配合（如将文件拖放到页面中的特定区域），攻击者可借此读取用户计算机上的任意文件内容，造成敏感信息泄露。Apple已在Safari 6.0中修复此问题。"
published = "2012-07-25T19:55:06.057"
remediation = "立即将 Safari 升级至 6.0 或更高版本，可通过 Mac App Store 或 Apple 官方支持页面下载安装。对于暂时无法升级的系统，可在 Safari 偏好设置→安全性中禁用 JavaScript，并避免访问不受信任的网站作为临时缓解措施。OS X Lion 用户应安装 Apple 官方发布的 Safari 6.0 独立安全更新补丁。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari 拖放事件任意文件读取漏洞"
updated = "2026-06-16T23:43:44.590"

