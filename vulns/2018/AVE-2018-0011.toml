[basic]
description = "Cisco IOS 软件和 IOS XE 软件的 Smart Install 功能存在缓冲区溢出漏洞，由于对数据包数据验证不充分，未经身份认证的远程攻击者可通过向目标设备 TCP 端口 4786 发送特制的 Smart Install 消息触发该漏洞，成功利用可导致设备重载、远程代码执行或触发看门狗崩溃进入无限循环。该漏洞影响大量 Cisco 交换机设备，CVSS 评分 9.8，危害等级严重。Cisco 已发布安全更新修复此漏洞。"
published = "2018-03-28T22:29:01.063"
remediation = "立即升级 Cisco IOS/IOS XE 软件至修复版本，可通过 Cisco IOS Software Checker 工具查询具体版本对应的修复版本号。如业务不需要 Smart Install 功能，在全局配置模式下执行 `no vstack` 命令禁用该功能。无法立即升级时，可在网络边界防火墙 ACL 中阻止对 TCP 端口 4786 的访问，限制仅受信任管理设备可连接该端口。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Cisco IOS及IOS XE Software Smart Install远程代码执行漏洞"
updated = "2026-06-17T01:29:59.627"

