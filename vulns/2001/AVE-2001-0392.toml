[basic]
description = "MySQL 3.23.31 之前版本存在缓冲区溢出漏洞，远程攻击者可通过向 MySQL 服务发送特制请求触发该漏洞，导致服务拒绝服务，并可能利用该漏洞提升权限。该漏洞影响 MySQL 3.22.x 及 3.23.x 系列版本，攻击复杂度低，无需身份认证即可远程利用，可对目标系统的机密性、完整性和可用性造成部分影响。厂商已发布 3.23.31 版本修复此问题。"
published = "2001-01-23T05:00:00Z"
remediation = "升级 MySQL 至 3.23.31 或更高版本，该版本修复了本地缓冲区溢出漏洞。如无法立即升级，限制 MySQL 服务的本地用户访问权限，避免向不可信用户开放本地数据库访问。同时监控系统日志中异常的 MySQL 崩溃或提权行为。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "MySQL 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:55:56Z"

