[basic]
description = "Opera 浏览器 11.10 之前版本在处理嵌入式 Java applet 的空参数值时存在资源管理错误，远程攻击者可通过向受害者发送包含空参数值嵌入式 Java applet 的恶意 HTML 文档，触发浏览器应用程序崩溃，导致拒绝服务。该漏洞无需身份认证，攻击复杂度低，攻击者只需诱导用户使用受影响版本的 Opera 浏览器打开特制网页即可触发。受影响版本包括 Opera 11.10 之前的所有版本。"
published = "2011-07-01T10:55:03Z"
remediation = "立即将 Opera 浏览器升级至 11.10 或更高版本，以修复嵌入式 Java applet 空参数处理不当导致的拒绝服务漏洞。如暂无法升级，可临时在浏览器设置中禁用 Java 插件，并避免访问不可信的网页内容，减少应用崩溃风险。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera Opera 浏览器 Java Applet 空参数拒绝服务漏洞"
updated = "2026-06-16T23:31:42Z"

