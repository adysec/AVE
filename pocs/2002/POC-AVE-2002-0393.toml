[info]
author = "AVE"
description = "检测 shadow-utils useradd 创建的邮箱文件权限是否为 660（属主和同组可读写），验证是否存在本地信息泄露风险"
id = "POC-AVE-2002-0393"
name = "CVE-2002-1509 PoC"
severity = "low"
tags = ["ave-2002-0393"]
vuln_id = [
    "CVE-2002-1509",
    "AVE-2002-0393",
]

[poc]
logic = "any"

[[poc.requests]]
path = "/var/mail/{{Username}}"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = "."
type = "regex"
