[basic]
description = "GNOME 桌面管理器（GDM）对 XDMCP（X Display Manager Control Protocol）协议的实现在 2.4.1.6 及之前版本存在拒绝服务漏洞。远程未经身份认证的攻击者可通过在 XDMCP 握手过程中使所选主机会话过期，触发 GDM 守护进程异常崩溃，导致图形登录服务中断，用户无法正常登录桌面环境。该漏洞的影响范围涵盖启用 XDMCP 远程登录功能的 Linux/Unix 系统，攻击者无需任何凭据即可从网络层面发起攻击，造成服务可用性下降。Red Hat 等发行版已在 2003 年发布安全公告和补丁进行修复，建议升级 GDM 至 2.4.1.6 或更高版本。"
published = "2003-08-27T00:00:00Z"
remediation = "将 GDM 升级至 2.4.1.6 或更高版本以修复此 XDMCP 拒绝服务漏洞，可通过系统包管理器安装对应发行版的安全更新补丁（如 Red Hat RHSA-2003-258/RHSA-2003-259）。如暂时无法升级，应在 GDM 配置文件 /etc/gdm/gdm.conf 中设置 [xdmcp] Enable=false 禁用 XDMCP 服务，并将 GDM 监听限制在本地回环接口（Listen=127.0.0.1），同时确保 XDMCP 仅在可信内网中使用。"
score = 3.5
severity = "LOW"
sources = ["redhat"]
title = "GNOME GDM XDMCP 拒绝服务漏洞"
updated = "2003-08-27T00:00:00Z"

