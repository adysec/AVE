[basic]
description = "vCenter Server 内置的 Rhttproxy 代理服务在实现 URI 规范化（URI normalization）时存在缺陷，未经身份认证的远程攻击者只需能够网络访问 vCenter Server 443 端口，即可通过构造特殊请求绕过代理访问控制，直接访问原本受代理保护的后端内部端点。该漏洞影响 VMware vCenter Server 6.7（低于 6.7 U3o）、6.5（低于 6.5 U3q）以及 VMware Cloud Foundation 3.x（低于 3.10.2.2）版本。CISA 已知被利用漏洞目录（KEV）已收录该漏洞并确认其存在野外利用。VMware 在 VMSA-2021-0020 安全公告中给出了修复方案，建议用户升级至安全版本以消除风险。"
published = "2021-09-23T13:15:08Z"
remediation = "将受影响的 vCenter Server 6.7 升级至 6.7 U3o 或更高版本，将 vCenter Server 6.5 升级至 6.5 U3q 或更高版本，将 VMware Cloud Foundation 3.x 升级至 3.10.2.2（参考 VMware 公告 KB85719）。vCenter Server 7.0 及 Cloud Foundation 4.x 不受此漏洞影响，无需操作。如暂时无法升级，应在网络边界防火墙或访问控制列表中限制对 vCenter Server 443 端口的访问，仅允许受信任的管理 IP 段连接，以降低攻击者利用 URI 规范化绕过反向代理访问内部端点的风险。"
score = 5.3
severity = "MEDIUM"
sources = ["kev"]
title = "VMware vCenter Server URI 规范化不当访问控制绕过漏洞"
updated = "2026-06-17T03:36:33Z"

