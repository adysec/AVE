[basic]
description = "tags.<value>Flowise 是一款开源的低代码 AI 应用开发平台。在 3.1.3 之前的版本中，多个记录管理器及代理记忆节点（包括 MySQL、PostgreSQL、SQLite 数据库连接节点）允许用户通过 additionalConfig 参数向 TypeORM DataSource 类传递任意配置选项。TypeORM 的 entities、subscribers、migrations 等选项支持从本地加载 JavaScript 文件作为代码执行。已认证的攻击者可利用此漏洞，先上传恶意 JavaScript 脚本至文档存储，再通过 additionalConfig.entities 引用该文件，从而在服务器上执行任意代码，实现沙箱逃逸和远程代码执行，完全控制运行 Flowise 的服务器。"
published = "2026-08-04T15:16:44Z"
remediation = "立即升级 Flowise 至 3.1.3 或更高版本，该版本已修复 TypeORM DataSource 任意选项注入漏洞。如暂无法升级，应通过防火墙或反向代理限制 Flowise 仅对受信任用户开放，并移除或禁用所有 Record Manager 和 Agent Memory 节点的 additionalConfig 输入字段，以阻断攻击路径。"
score = 9
severity = "CRITICAL"
sources = ["ghsa"]
title = "FlowiseAI Flowise TypeORM DataSource 远程代码执行漏洞"
updated = "2026-08-04T16:16:28Z"

