[basic]
description = "Windows Kerberos 认证协议存在输入验证不当漏洞（CWE-20），未经身份认证的远程攻击者可通过向目标域控制器发送特制的 Kerberos 认证请求触发该漏洞，导致目标系统的 Kerberos 服务崩溃或停止响应，造成拒绝服务。该漏洞攻击复杂度较高（AC:H），无需用户交互即可远程利用，影响 Windows Server 系列操作系统。Microsoft 已在 2025 年 2 月安全更新（KB5051974）中修复此漏洞。"
published = "2025-02-11T18:15:33Z"
remediation = "建议立即安装 Microsoft 2025 年 2 月安全更新 KB5051974，该更新修复了 Windows Kerberos 中的输入验证缺陷，防止未经认证的远程攻击者通过特制 Kerberos 请求触发服务拒绝。可通过 Windows Update 自动更新或访问 Microsoft 更新目录手动下载安装。如无法立即打补丁，可在防火墙层面限制对域控制器 88/TCP 和 88/UDP 端口的非信任来源访问作为临时缓解措施。"
score = 5.9
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows Kerberos 拒绝服务漏洞"
updated = "2026-06-17T08:43:10Z"

