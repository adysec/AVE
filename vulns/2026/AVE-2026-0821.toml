[basic]
description = "Open WebUI 的频道成员接口存在敏感信息泄露漏洞。在 0.7.0 至 0.10.0 版本中，`/api/v1/channels/{id}/members` 端点返回完整的 UserModel 对象，包含用户的 settings.ui.toolServers[].key 和 webhook 配置等敏感凭据。低权限攻击者只需创建一个与管理员用户的私信频道，即可通过该接口获取管理员的工具服务器 Bearer Token 和 Webhook URL，进而控制集成服务。该漏洞源于接口未对返回的敏感字段进行过滤，CVSS 评分 6.0，需启用 Channels 功能方可利用。"
published = "2026-07-09T17:17:03Z"
remediation = "立即升级 Open WebUI 至 v0.10.0 或以上版本（对应 commit fbcdcf1），该版本已限制 `/api/v1/channels/{id}/members` 接口仅返回非敏感用户信息。如无法立即升级，建议在反向代理层（如 Nginx）添加规则拦截对 `/api/v1/channels/*/members` 的 GET 请求，或暂时关闭 Channels（Beta）功能以消除攻击面。"
score = 6
severity = "MEDIUM"
sources = ["ghsa"]
title = "Open WebUI 频道成员接口敏感信息泄露漏洞"
updated = "2026-07-10T17:43:06Z"

