[basic]
description = "Google Chrome 22.0.1229.79 之前版本中存在跨站脚本（XSS）漏洞，远程攻击者可通过包含恶意 frame 元素的向量注入任意 Web 脚本或 HTML，实现通用跨站脚本攻击（UXSS）。该漏洞源于浏览器对跨源 frame 的源追踪机制不完善，导致攻击者可在任意站点上下文中执行脚本，窃取用户数据或发起进一步攻击。攻击者需诱使用户访问恶意构造的页面，无需额外权限。"
published = "2012-09-26T10:56:04.903"
remediation = "升级 Google Chrome 至 22.0.1229.79 及以上版本，Chrome 浏览器会自动检查并安装更新，用户也可通过地址栏输入 chrome://settings/help 手动触发更新检查。使用 Apple Safari 的用户应升级至 6.0.3 及以上版本。使用 Apple iOS 设备的用户应安装 Apple 2013 年 1 月发布的安全更新。Linux 发行版用户（如 openSUSE）可安装对应的安全补丁包。由于该漏洞通过帧处理实现跨站脚本攻击，无法立即升级时可在服务端配置 Content-Security-Policy 头部的 frame-src 指令限制可加载的帧来源作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 帧处理通用跨站脚本漏洞"
updated = "2026-06-16T23:42:17.433"

