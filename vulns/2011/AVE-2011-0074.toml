[basic]
description = "libxml2 的 xpath.c 文件中存在整数溢出漏洞，当处理 XPath 表达式添加新的命名空间节点时，由于对节点集大小计算不当，可触发基于堆的缓冲区溢出。远程攻击者可通过向受影响应用提交特制的 XML 文件触发该漏洞，导致应用崩溃或实现任意代码执行。该漏洞影响 libxml2 2.6.x 至 2.6.32 及 2.7.x 至 2.7.8 版本，CVSS 评分 9.3，危害等级严重。用户需升级至 libxml2 2.7.9 或更高版本以修复此漏洞。"
published = "2011-09-02T16:55:03Z"
remediation = "升级 libxml2 至 2.7.9 或更高版本（官方补丁 commit d7958b21）。各发行版操作：Ubuntu 执行 apt-get install libxml2，Debian 参考 DSA-2255，Red Hat 应用 RHSA-2011:1749，Fedora 更新至 libxml2-2.7.8-4。Apple iOS 用户升级至 iOS 6.0 及以上版本。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "libxml2 XPath节点集处理整数溢出漏洞"
updated = "2026-06-16T23:30:26Z"

