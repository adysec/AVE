[basic]
description = 'Microsoft Internet Explorer 5.0 至 6.0 版本存在自引用对象拒绝服务漏洞。远程攻击者可通过构造一个类型为 "text/html" 且 DATA 字段指向包含该对象自身的 HTML 文档，诱使浏览器在解析过程中产生无限递归调用，导致程序崩溃或拒绝服务。该漏洞影响所有运行 Internet Explorer 5 和 6 的 Windows 系统，攻击者无需身份认证即可利用。攻击者只需将恶意 HTML 页面托管于任意网站，通过电子邮件或即时消息发送链接诱使用户点击，当用户在受影响版本的浏览器中打开该页面时，系统即会陷入无限递归循环直至浏览器崩溃。Microsoft 已通过安全公告 MS02-070 发布补丁进行修复，受影响用户应升级浏览器版本或应用相应安全更新。'
published = "2002-12-31T05:00:00Z"
remediation = "立即安装 Microsoft Internet Explorer 5.5 Service Pack 2 或 Internet Explorer 6.0 Service Pack 1  cumulative 安全更新，或通过 Windows Update 自动更新至最新版本。如无法立即升级，可临时禁用 Internet Explorer 中的 ActiveX 控件和脚本执行作为缓解措施，或改用其他浏览器访问网页。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer 5/6 自引用对象拒绝服务漏洞"
updated = "2026-06-16T21:59:49Z"

