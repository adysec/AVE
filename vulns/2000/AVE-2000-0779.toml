[basic]
description = "Microsoft SQL Server 7.0/2000及MSDE 1.0/2000的xp_displayparamstmt扩展存储过程函数在调用srv_paraminfo处理扩展存储过程参数时，未对缓冲区长度进行有效限制，导致缓冲区溢出。攻击者可通过构造特制的SQL语句或本地恶意程序触发该漏洞，造成拒绝服务或执行任意命令。该漏洞影响SQL Server 7.0、SQL Server 2000及Microsoft SQL Server Desktop Engine 1.0和2000所有版本，CVSS评分为4.6，攻击向量为本地访问，危害等级中等。"
published = "2001-01-09T05:00:00.000"
remediation = "升级至 Microsoft SQL Server 7.0 Service Pack 3 或 SQL Server 2000 Service Pack 1，该补丁包含在 MS00-092 安全公告中。也可直接安装 Microsoft Knowledge Base 文章 Q280380 提供的补丁。安装后重启 SQL Server 服务以生效。如暂时无法打补丁，可限制 SQL Server 服务账户权限为普通用户，避免以管理员身份运行，从而降低被利用后获取系统控制权的风险。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft SQL Server 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:06.653"

