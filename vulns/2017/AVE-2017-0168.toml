[basic]
description = "Jenkins CI 2.56及更早版本以及2.46.1 LTS及更早版本中存在反序列化远程代码执行漏洞。未经身份认证的远程攻击者可通过Jenkins CLI向目标服务器发送特制的序列化Java `SignedObject`对象，服务器在反序列化时使用新的`ObjectInputStream`，绕过了原有的黑名单防护机制，导致任意代码执行。该漏洞影响广泛部署的Jenkins持续集成服务器，CVSS评分9.8，危害等级严重。攻击者无需任何权限即可远程触发，成功利用后可完全控制目标服务器。官方通过将`SignedObject`加入黑名单并弃用基于Java序列化的CLI协议来修复此漏洞。"
published = "2018-01-29T17:29:00Z"
remediation = "升级 Jenkins 至 2.46.2 LTS 或 2.54 及以上版本（2.56 以下版本均受影响）。如无法立即升级，在 Jenkins 启动参数中添加 `-Dhudson.cli.CLIProtocol.enabled=false` 禁用基于 remoting 的 CLI 协议，并在网络层面限制对 Jenkins CLI 端口（50000）的未授权访问。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Jenkins CI 反序列化远程代码执行漏洞"
updated = "2026-06-17T00:59:00Z"

