[basic]
description = "xdm（X Display Manager）在 authComplain 变量设置为 false 且认证目录不存在时，不会向用户发出警告，而是直接允许任意远程攻击者无需认证即可连接到 X 服务器，从而获取对目标系统图形界面的完全控制权限。攻击者无需任何身份凭证即可利用此漏洞，危害等级严重，CVSS 评分 10.0。受影响的包括 XFree86 4.1.0 及早期版本。"
published = "2003-03-03T05:00:00Z"
remediation = "升级 XFree86 至 4.2.0 或更高版本（NetBSD 对应更新 xsrc/xfree86），或安装 Red Hat 提供的 RHSA-2003:064/RHSA-2003:065 安全更新。如无法升级，确保 xdm 认证目录（通常为 /var/lib/xdm/authdir）存在且权限正确，并将 xdm 配置中 authComplain 设为 true 以拒绝未认证连接。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "XFree86 xdm authDir 缺失导致未授权连接漏洞"
updated = "2026-06-16T21:59:27Z"

