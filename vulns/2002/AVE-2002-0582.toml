[basic]
description = "Easy Homepage Creator 1.0 中的 edit.cgi 脚本的 print_html_to_file 函数未对用户身份进行认证验证，未经身份认证的远程攻击者可直接利用该漏洞修改其他用户的个人主页内容。该漏洞影响 Easy Homepage Creator 1.0 所有部署版本，攻击者无需任何凭据即可通过发送特制请求篡改目标用户的主页文件，造成页面内容被恶意替换或注入恶意代码。CVSS 评分为 7.5，危害等级为高危。由于该软件为静态网页生成工具，漏洞利用方式简单直接，攻击者可借此在目标服务器上挂载钓鱼页面或传播恶意软件。"
published = "2003-04-11T04:00:00.000"
remediation = "Easy Homepage Creator 1.0 官方已停止维护，未发布针对此漏洞的补丁版本。建议立即停用该软件，并将主页功能迁移至其他维护中的内容管理系统。如暂时无法替换，应在 Web 服务器配置中禁用 edit.cgi 脚本的执行权限，或通过 .htaccess 限制仅允许可信 IP 访问，以阻止远程攻击者利用。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Ben Chivers Easy Homepage Creator 未授权文件修改漏洞"
updated = "2026-06-16T21:59:18.540"

