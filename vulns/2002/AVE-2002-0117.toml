[basic]
description = 'Bugzilla 2.14.1 之前版本的 show_bug.cgi 存在信息泄露漏洞，拥有"Bugs Access"权限的用户可通过提交漏洞报告并查看生成的产品下拉菜单，查看到本无权访问的其他产品信息。该漏洞源于产品下拉菜单未正确校验用户权限，导致越权查看受限产品列表。影响范围为 Bugzilla 2.14.1 之前版本，攻击者需具备合法的"Bugs Access"权限，通过提交漏洞报告触发漏洞，利用方式为读取生成页面中的产品下拉菜单获取敏感产品信息，CVSS 评分 5.0（中等），影响机密性，不影响完整性和可用性。'
published = "2002-01-31T05:00:00Z"
remediation = "升级 Bugzilla 至 2.14.1 或更高版本，该版本修复了 show_bug.cgi 中产品权限检查缺失的问题。如无法立即升级，可修改 show_bug.cgi 源码，在显示产品下拉菜单前增加用户产品权限校验逻辑，或限制非管理员用户提交 bug 的权限。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Mozilla Bugzilla Show_Bug.CGI 产品信息泄露漏洞"
updated = "2026-06-16T21:56:35Z"

