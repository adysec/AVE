[basic]
description = "BIBLIOsoft BIBLIOpac 2008 存在跨站脚本（XSS）漏洞，远程攻击者可通过向 `bin/wxis.exe/bibliopac/` 页面的 `db` 或 `action` 参数注入恶意 Web 脚本或 HTML 代码触发该漏洞。攻击无需身份认证，但需诱使用户点击恶意链接，成功利用后可窃取用户会话凭证、劫持页面内容或发起钓鱼攻击。该漏洞影响 BIBLIOsoft BIBLIOpac 2008 版本，CVSS 评分 6.1，危害等级中危。"
published = "2019-05-13T20:29:00Z"
remediation = "厂商已声明 BIBLIOpac 2008 停止维护且不发布补丁，建议立即升级到 BIBLIOsoft 最新版产品。如无法升级，可在 Web 服务器（如 Apache/Nginx）或 WAF 层面添加规则，对 `db` 和 `action` 参数过滤 `<script>`、`onerror=` 等 XSS 关键字，并对用户输入进行 HTML 实体编码输出。同时限制 `/bibliopac/bin/wxis.exe/bibliopac/` 路径仅允许可信 IP 访问。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "BIBLIOsoft BIBLIOpac 跨站脚本漏洞"
updated = "2026-06-17T01:43:45Z"

