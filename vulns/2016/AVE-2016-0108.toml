[basic]
description = "D-Link DCS-930L 网络摄像头存在操作系统命令注入漏洞（CWE-78），设备固件版本低于 2.12 时，远程攻击者可通过向 setSystemCommand 接口的 SystemCommand 参数注入恶意操作系统命令，以设备 root 权限执行任意命令。攻击者需具备设备管理后台的认证权限，但利用难度较低，成功利用后可完全控制设备，进而用于构建僵尸网络或窃取监控数据。该漏洞已公开 Exploit-DB 利用代码（ID: 39437），实际攻击风险较高。"
published = "2020-03-09T01:15:10Z"
remediation = "将 D-Link DCS-930L 设备固件升级至 2.12 或更高版本。如无法升级，在设备管理界面中禁用远程 Web 管理功能，并在网络防火墙中限制仅内网可信 IP 访问设备管理端口（80/443），同时避免将设备直接暴露在公网。此外，定期检查并修改设备管理员密码，防止攻击者通过弱口令获得高权限后利用该命令注入漏洞。"
score = 7.2
severity = "HIGH"
sources = ["kev"]
title = "D-Link DCS-930L 操作系统命令注入漏洞"
updated = "2026-06-17T00:40:49Z"

