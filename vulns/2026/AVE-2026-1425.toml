[basic]
description = "tags.<value>Nuxt 开源 Web 开发框架存在服务端远程代码执行漏洞，其原理为运行时模板注入。当 `vue.runtimeCompiler` 配置项被启用且应用存在服务端岛屿组件时，未经身份认证的远程攻击者可通过 `/__nuxt_island/` 端点向动态组件传入包含恶意 `template` 键的 props，触发 Nitro 服务端进程执行攻击者控制的模板代码，最终实现远程代码执行。该漏洞影响 Nuxt 3.4.0 至 3.21.10 以下版本及 4.0.0 至 4.5.1 以下版本。攻击复杂度较高，需满足特定组件配置条件，但无需身份认证即可远程利用。"
published = "2026-08-05T22:17:08Z"
remediation = "1. 升级 Nuxt 到修复版本：Nuxt 3.x 用户升级至 3.21.10 或更高版本，Nuxt 4.x 用户升级至 4.5.1 或更高版本，可通过 npm install nuxt@latest 完成更新。2. 关闭 Vue 运行时模板编译器：在 nuxt.config.ts 中确保 vue.runtimeCompiler 设置为 false（默认即为关闭状态），避免启用运行时编译功能。3. 避免将用户可控的 island props 传入动态组件解析路径：不要将 props 直接绑定到 <component :is>、resolveDynamicComponent 或 h() 等动态组件接口，防止属性透传导致 template 键被利用。4. 部署 WAF 规则作为纵深防御：在 /__nuxt_island/ 端点上配置 Web 应用防火墙规则，对请求中的 props 参数进行 URL 解码和 JSON 解析，拦截包含 template 或 render 键的请求内容，覆盖所有 HTTP 方法。"
score = 8.1
severity = "HIGH"
sources = ["ghsa"]
title = "Nuxt Server Islands 运行时模板注入服务端远程代码执行漏洞"
updated = "2026-08-07T05:17:03Z"

