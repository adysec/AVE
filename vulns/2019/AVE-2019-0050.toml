[basic]
description = "Web Port 1.19.1 存在反射型跨站脚本漏洞，位于 /log 页面的 type 参数中。攻击者可构造包含恶意 JavaScript 代码的 URL，诱使用户点击后，在用户浏览器中执行任意脚本，窃取会话 Cookie 或执行其他恶意操作。攻击无需身份认证，但需要用户交互（点击链接）。CVSS 评分 6.1，危害等级中危。目前官方尚未发布修复版本，建议限制对 /log 页面的访问或对输入参数进行严格过滤。"
published = "2019-05-30T14:29:02.297"
remediation = "升级 Web Port 至 1.19.2 或更高版本（官方下载页面：https://webport.se/nedladdningar/），该版本已修复此漏洞。如无法立即升级，对 /log 接口的 type 参数实施严格的输入验证和 HTML 实体编码输出转义，并配置 Content-Security-Policy 响应头限制脚本执行。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Web Port 1.19.1 反射型跨站脚本漏洞"
updated = "2026-06-17T02:14:42.480"

