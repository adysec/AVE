[basic]
description = "Half-Life 专用服务器 3104 及更早版本的 changelevel 命令存在格式化字符串漏洞。远程攻击者可通过系统控制台或 rcon 向 changelevel 命令注入格式化字符串，触发任意代码执行。该漏洞影响所有运行受影响版本的 Half-Life 专用服务器，CVSS 评分 10.0（严重），攻击向量为网络、低复杂度、无需认证，可导致完全的机密性、完整性和可用性破坏。"
published = "2000-12-19T05:00:00Z"
remediation = '建议升级 Half-Life Dedicated Server 至 3105 或更高版本（如 Steam 版 build 4554+）。若无法升级，请禁用 rcon（server.cfg 设置 rcon_password ""），并通过防火墙限制 27015 端口仅允许受信 IP 访问，同时避免直接暴露服务器控制台。'
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Valve Half-Life Dedicated Server 格式化字符串漏洞"
updated = "2026-06-16T21:52:52Z"

