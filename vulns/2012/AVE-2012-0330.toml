[basic]
description = "tags.<value>Apple Safari 浏览器使用的 WebKit 引擎存在内存破坏漏洞，未经身份认证的远程攻击者可通过构造恶意网页诱使用户访问，在目标系统上触发内存越界写入，导致任意代码执行或拒绝服务。该漏洞影响 Safari 6.0 之前的所有版本，攻击条件为用户需主动访问恶意网站。CVSS 评分 9.3，危害等级严重。Apple 已在 2012 年 7 月发布的安全更新中修复此漏洞。"
published = "2012-07-25T20:55:03.917"
remediation = "立即将 Apple Safari 升级至 6.0 或更高版本，该版本修复了 WebKit 内存破坏漏洞。建议通过 Mac App Store 检查更新，或访问 Apple 官方支持页面下载最新安装包。对于无法立即升级的系统，可在 Safari 设置中禁用 JavaScript 作为临时缓解措施，并禁止访问不可信网站以降低被利用风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit内存破坏漏洞"
updated = "2026-06-16T23:43:39.893"

