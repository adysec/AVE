[info]
author = "ave"
description = "Apple iTunes 使用的 WebKit 引擎存在内存破坏漏洞，未经身份认证的远程攻击者可通过诱导用户访问恶意网页触发该漏洞，导致任意代码执行或应用程序崩溃。该漏洞影响 iTunes 10.7 之前的版本，攻击条件为受害者需访问包含恶意内容的网站，利用方式是通过构造特殊的网页内容触发 WebKit 内存处理错误。"
id = "POC-AVE-2012-0347"
name = "CVE-2012-3671 PoC"
severity = "medium"
tags = ["ave-2012-0347"]
vuln_id = [
    "CVE-2012-3671",
    "AVE-2012-0347",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cve-2012-3671-poc.html"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["WebKit"]
