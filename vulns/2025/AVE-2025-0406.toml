[basic]
description = "GNU GRUB2 的 squash4 文件系统模块存在整数溢出漏洞。在处理 squash4 文件系统时，grub 的 squash4 模块使用文件系统几何结构中用户可控的参数来确定内部缓冲区大小，但未正确检查整数溢出。攻击者可构造恶意的 squash4 文件系统，使缓冲区大小计算发生整数溢出，导致 grub_malloc() 分配的内存小于预期，进而在 direct_read() 函数执行数据读取时发生堆越界写入。该漏洞可被利用来破坏 GRUB 内部关键数据，最终导致任意代码执行，从而绕过 Secure Boot 保护机制。攻击者需要本地访问权限且能够挂载特制的 squash4 文件系统才能触发该漏洞。"
published = "2025-03-03T17:15:14Z"
remediation = "立即升级 GRUB2 至 2.12 以上版本（含上游安全补丁 84bc0a9a），或应用各发行版提供的 CVE-2025-0678 补丁（将 squash4.c 中 grub_malloc 替换为 grub_calloc 以防止整数溢出）。对于 RHEL 7/8/9/10 用户，安装 Red Hat 发布的对应 grub2 安全更新。同时更新 shim 引导加载器以应用最新的 SBAT 吊销数据，通过 `mokutil --sb-state` 确认 Secure Boot 状态，并使用 `mokutil --set-sbat-policy` 应用 SBAT 策略更新，防止绕过 Secure Boot 的利用。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "GNU GRUB2 squash4文件系统整数溢出导致堆越界写入漏洞"
updated = "2026-06-30T00:16:50Z"

