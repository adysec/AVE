[basic]
description = "Trustix Secure Linux 的 Apache-SSL RPM 包在安装 httpsd 程序时设置了全局可写权限，导致本地用户可将其替换为恶意木马程序。该漏洞影响 Trustix 发行版中使用 Apache-SSL 的系统，攻击者需具备本地账户权限，通过覆盖 httpsd 二进制文件实现权限提升，在 Apache-SSL 服务重启或受害者执行时以提升后的权限运行任意代码，CVSS 评分 4.6 属中危级别。"
published = "2000-10-20T04:00:00Z"
remediation = "升级 Trustix 系统至 Apache-SSL 1.3.14-2 或更高版本（含权限修复补丁）；或手动执行 chmod 755 /usr/sbin/httpsd 移除世界可写权限；同时限制非特权用户对 Web 服务二进制文件的写入访问。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Trustix Apache-SSL RPM 权限漏洞"
updated = "2026-06-16T21:52:29Z"

