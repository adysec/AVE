[basic]
description = "Check Point VPN-1/FireWall-1 4.1 及更早版本中的 OPSEC 通信认证机制（fwn1）存在认证绕过漏洞，未经身份验证的远程攻击者可通过伪造 OPSEC 协议报文欺骗目标系统，冒充合法的 OPSEC 客户端与防火墙管理服务器建立连接，进而绕过身份认证流程。该漏洞影响部署有受影响版本 Check Point 防火墙产品的网络环境，攻击者仅需能够访问目标设备的 OPSEC 通信端口即可发起利用，无需任何凭据，利用复杂度低。成功利用后，攻击者可获取防火墙敏感配置信息、篡改安全策略或控制网络访问规则，导致网络边界防护被绕过。Check Point 已在后续版本中修复此漏洞，建议升级至安全版本。"
published = "2000-11-14T05:00:00Z"
remediation = "建议将 Check Point VPN-1/FireWall-1 升级至 4.1 之后的安全补丁版本，或直接升级到更高主版本的防火墙系统以修复 OPSEC 身份验证机制缺陷。如无法立即升级，应通过严格的防火墙访问控制列表 (ACL) 限制对相关端口的外部访问，以降低欺骗攻击风险。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Check Point VPN-1/FireWall-1 OPSEC 身份认证欺骗漏洞"
updated = "2026-06-16T21:52:31Z"

