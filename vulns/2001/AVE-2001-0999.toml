[basic]
description = "CUPS 1.1.5 版本的 httpGets 函数存在缓冲区溢出漏洞。远程攻击者无需身份认证即可通过向目标系统发送超长输入行触发该溢出，进而在受影响系统上执行任意系统命令。该漏洞影响运行 CUPS 1.1.5 版本的所有 Unix/Linux 系统及提供打印服务的网络设备，攻击者可利用此漏洞完全控制目标服务器，造成严重的信息泄露与系统破坏。"
published = "2001-05-03T04:00:00Z"
remediation = "建议将 CUPS 升级至 1.1.6 或更高版本以修复缓冲区溢出漏洞。若无法立即升级，建议通过防火墙限制对 CUPS HTTP 端口（默认 631）的远程访问，仅允许信任的 IP 地址连接，以阻断远程攻击者利用长输入行执行任意命令。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "CUPS 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:51Z"

