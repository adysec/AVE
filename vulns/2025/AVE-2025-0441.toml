[basic]
description = "该漏洞存在于 curl 的 SSH 连接管理代码中，当使用 wolfSSH 后端进行 SFTP 操作时，缺失主机验证机制。这导致 curl 无法在 SSH 连接期间检测到 man-in-the-middle (MITM) 攻击者。攻击者可利用这一漏洞在用户与目标 SSH/SFTP 服务器之间插针，窃取用户凭证并潜在获取敏感数据。该漏洞影响使用 curl 执行 SFTP 文件传输操作的场景，尤其当 SFTP 后端采用 wolfSSH 时更为严重。尽管 CVSS 评分仅为 4.3（中等风险），但其潜在影响不容忽视，可能导致 SSH 连接被劫持，危及传输数据的安全性和用户隐私。攻击者通过提供虚假主机密钥即可触发该漏洞，系统将无法验证服务器真实身份，从而允许未经授权的连接建立。这一安全缺陷暴露了 wolfSSH 在主机验证方面的系统性不足，需要在代码中强制实施严格的主机密钥验证和指纹验证流程。未修复的 curl 版本将继续暴露用户到 SSH/SFTP 连接过程中的安全风险，建议立即更新到包含安全补丁的版本并配置强壮的主机密钥验证机制以确保连接安全。"
published = "2025-11-07T08:15:39Z"
remediation = "立即将 curl 升级至 8.17.0 及以上版本（该版本已移除 wolfSSH 后端支持）。如无法升级，重新编译 curl 时选择 libssh2 或 OpenSSH 等其他 SSH 后端替代 wolfSSH；或在应用层避免使用 sftp:// 协议，改用 scp 或其他文件传输方式作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "curl wolfSSH SFTP 后端缺少主机验证漏洞"
updated = "2026-06-17T08:29:21Z"

