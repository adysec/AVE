[basic]
description = "TYPSoft FTP Server 0.78 及更早版本存在缓冲区溢出漏洞，由于对 USER、PASS 和 CWD 命令的输入长度缺乏边界检查，未经身份认证的远程攻击者可发送超长命令字符串触发栈溢出，导致拒绝服务甚至执行任意代码。该漏洞影响所有运行受影响版本的 FTP 服务器，CVSS 评分 10.0，攻击向量为网络、低复杂度、无需认证，可完全破坏系统机密性、完整性和可用性。"
published = "2000-12-11T05:00:00.000"
remediation = "建议立即升级 TYPSoft FTP Server 至 0.78 以上版本（如存在），或彻底停止使用已停止维护的 TYPSoft FTP Server，迁移至 FileZilla Server 或 vsftpd 等仍在积极维护的 FTP 服务端。临时缓解措施：在防火墙层面限制仅允许可信 IP 访问 FTP 端口（21/TCP），并在 FTP 服务端配置中限制单条命令最大长度不超过 2048 字节。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "TYPSoft FTP Server 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:01.053"

