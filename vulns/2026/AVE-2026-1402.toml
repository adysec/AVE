[basic]
description = "Electron 是一个用于使用 JavaScript、HTML 和 CSS 编写跨平台桌面应用程序的框架。该漏洞存在于原生自动填充弹出框的定位机制中，跨源 iframe 可以将其定位到自身边界之外并覆盖嵌入页面的 UI 元素，从而实现点击劫持或伪造可信界面的攻击。受影响的应用需要在显示可信 UI 的窗口中嵌入不可信内容的 iframe，不嵌入第三方不可信内容的应用不受影响。攻击者需诱使用户在包含恶意 iframe 的页面上执行交互操作，才能利用此漏洞欺骗用户点击虚假界面元素。该漏洞影响 39.8.8、40.9.0、41.2.1 和 42.0.0-beta.3 之前的版本，CVSS 评分为 3.1，危害等级较低。"
published = "2026-08-05T16:17:04Z"
remediation = "将 Electron 升级至对应分支的安全版本：39.x 升级至 39.8.8、40.x 升级至 40.9.0、41.x 升级至 41.2.1、42.x 升级至 42.0.0-beta.3。如无法立即升级，请勿在显示受信任 UI 的窗口中嵌入不受信任内容的 iframe，并可通过 Content-Security-Policy 限制第三方 iframe 加载作为临时缓解。"
score = 3.1
severity = "LOW"
sources = ["ghsa"]
title = "Electron 跨域iframe原生自动填充弹出框点击劫持漏洞"
updated = "2026-08-06T15:17:26Z"

