[basic]
description = "tags.<value>BNBForm 组件存在任意文件读取漏洞，其 automessage 隐藏表单变量未对用户提交的路径参数进行充分过滤与校验，远程攻击者可在未经身份认证的情况下，通过构造恶意的 automessage 变量值，结合目录穿越或路径注入技术来指定任意文件路径。攻击者仅需向目标服务器发送特制的 HTTP 请求即可触发该漏洞，成功利用后可读取 Web 服务器上攻击者权限范围内的任意敏感文件，如配置文件、源代码或系统关键文件，进而导致敏感信息泄露，并可能为进一步的横向渗透提供基础。"
published = "1998-12-03T05:00:00Z"
remediation = "建议立即卸载并彻底移除服务器上已停止维护的 BNBForm CGI 脚本（尤其 automessage.cgi 及同名危险脚本），停止对外提供该 CGI 服务，防止通过 automessage 隐藏表单变量读取任意文件。若业务必须保留，请将 CGI 目录权限收紧为仅限 Web 服务账户可读，禁止脚本以更高权限运行，并在 Web 服务器层（如 Apache 的 mod_rewrite 或防火墙规则）阻断对 automessage.cgi 等已知危险脚本的访问请求。建议改用当前仍受支持且经过安全审计的表单处理组件或框架（如现代后端语言自带的表单解析库）替代 BNBForm，避免继续使用此类早已停止更新的组件。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "BNBForm 任意文件读取漏洞"
updated = "2026-06-16T21:49:21Z"

