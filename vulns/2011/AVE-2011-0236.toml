[basic]
description = "Mozilla Firefox 3.6.26之前版本、4.x至6.0版本、Thunderbird 3.1.18之前版本及5.0至6.0版本、SeaMonkey 2.4之前版本中存在跨域信息泄露漏洞。该漏洞源于浏览器未能正确强制实施IPv6字面地址语法规则，远程攻击者可通过代理服务器发送特制的XMLHttpRequest请求，并读取返回的错误消息，从而获取敏感信息。攻击无需用户交互，仅需诱使用户访问恶意网页即可触发，影响机密性。Mozilla已发布安全更新修复此漏洞。"
published = "2012-02-01T16:55:00Z"
remediation = "升级 Firefox 至 3.6.26 或 7.0 及以上版本，Thunderbird 升级至 3.1.18 及以上版本，SeaMonkey 升级至 2.4 及以上版本。临时缓解措施可配置代理服务器过滤包含 IPv6 文字地址的 XMLHttpRequest 请求，或限制浏览器对 IPv6 地址的解析能力。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox IPv6字面地址语法跨域信息泄露漏洞"
updated = "2026-06-16T23:33:44Z"

