[basic]
description = "tags.<value>SAP Solution Manager（用户体验监控组件）7.2 版本存在缺失身份验证漏洞。其 EemAdmin 服务未对任何访问请求执行身份认证检查，未经身份验证的远程攻击者可直接访问该服务的管理接口，通过发送特制请求完全接管所有连接到 Solution Manager 的 SMDAgent（SAP 托管代理），进而实现对整个 Solution Manager 系统的完全控制与远程代码执行。该漏洞影响所有暴露在互联网或内网中的 SAP Solution Manager 7.2 实例，攻击条件极为宽松——攻击者无需任何凭据或用户交互即可远程利用，可导致敏感业务数据泄露、系统配置篡改及横向移动。CVSS v3.1 向量为 AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H，评分为 9.8，危害等级为严重。"
published = "2020-03-10T21:15:14.793"
remediation = "立即应用 SAP 安全公告 SAP Note 2890213 发布的补丁，将 SAP Solution Manager 7.2 升级至对应 Support Package 的最新补丁级别：SP004 不低于 Patch 0012、SP005 不低于 Patch 0013、SP006 不低于 Patch 0014、SP007 不低于 Patch 0020、SP008 不低于 Patch 0016、SP009 不低于 Patch 0008、SP010 不低于 Patch 0002、SP011 不低于 Patch 0004。补丁下载地址：https://service.sap.com/sap/support/notes/2890213。如无法立即打补丁，临时措施为通过 SAP GateWay 或防火墙限制 EemAdmin 服务的访问源，仅允许可信网络中的 SMD Agent 通信，并禁用匿名访问。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "SAP Solution Manager EemAdmin 远程代码执行漏洞"
updated = "2026-06-17T03:22:52.123"

