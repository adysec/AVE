[basic]
description = "Linux内核中的nilfs2文件系统存在使用后释放（Use-After-Free）漏洞。当nilfs2检测到文件系统损坏并回退到只读模式时，页面/段（folio）写请求的处理回调会在不检查缓冲区是否仍被引用的情况下，强制清除缓冲区的工作状态。这导致mark_buffer_dirty()和nilfs_btree_propagate()等操作中出现缓冲区状态不一致，进而触发内核警告并可能导致内核崩溃或权限提升。攻击者需具备本地访问权限，利用该漏洞可在受影响系统上执行任意代码或导致拒绝服务。该漏洞影响使用nilfs2文件系统的Linux内核版本，CVSS评分为7.8（高危），CWE编号为CWE-416。"
published = "2025-02-27T02:15:15.883"
remediation = "升级 Linux 内核至包含修复补丁的版本：Debian bullseye 升级至 linux-image 5.10.262-1 或更高，bookworm 升级至 6.1.180-1 或更高，trixie 升级至 6.12.100-1 或更高；RHEL 9 用户升级至 kernel-4.14.358 或更高版本（需确认 RHEL 9.4+ 已包含回溯补丁）。若无法立即升级内核，可临时卸载 nilfs2 文件系统模块（`modprobe -r nilfs2`）以消除攻击面，或在挂载 nilfs2 时禁用写缓存功能作为缓解措施。修复来源为 Linux 内核主线 commit ca76bb226bf47ff04c782cacbd299f12ddee1ec1（6.14-rc1），该补丁在 buffer 被引用时跳过强制清除 folio 状态的操作，避免缓冲区使用后释放（use-after-free）导致内核崩溃或权限提升。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux内核 NILFS2文件系统 释放后使用漏洞"
updated = "2026-06-17T08:44:07.253"

