[basic]
description = "BIND 4、BIND 8.2.x 的 stub resolver 库以及 glibc 2.2.5 及更早版本、libc 和 libresolv 等基础库中存在缓冲区溢出漏洞。该漏洞的原理是在处理 DNS 响应时，解析库错误地使用了最大缓冲区大小而非实际数据的长度，导致在读取 DNS 响应时发生越界读取（Read Buffer Overflow）。远程攻击者可以通过向目标系统发送特制的 DNS 响应数据包来触发此漏洞，导致受影响的服务或系统崩溃，从而引发拒绝服务（DoS）攻击。该漏洞影响范围涵盖大量依赖上述库的早期 UNIX 系统，攻击条件为目标系统向 DNS 服务器发起请求并接收到攻击者伪造的恶意响应数据。"
published = "2002-10-11T04:00:00Z"
remediation = "建议将 glibc 升级至 2.2.6 或更高版本，并将 BIND 升级至 8.3 及以上版本或应用 BIND 8.2.x 的相关安全补丁，以修复 DNS 响应处理时的缓冲区溢出问题。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "GNU glibc 及 BIND DNS 解析库缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:58:48Z"

