[basic]
description = "Win32k 图形子系统存在越界写入漏洞（CWE-787），攻击者可通过运行特制恶意应用程序在本地用户上下文中触发该漏洞，导致内核内存被破坏，从而实现权限提升。该漏洞影响 Windows 10 Version 1803/1809/1909/2004/20H2 及 Windows Server 2016/2019 等版本，CVSS 评分 7.8，危害等级高。由于攻击者需要先在目标系统上以低权限身份执行代码，且无需用户交互，成功利用后可完全控制受影响系统。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），表明其在野已被广泛利用。Microsoft 已在 2021 年 4 月安全更新中修复此漏洞，建议受影响用户及时安装补丁。"
published = "2021-04-13T20:15:16Z"
remediation = "建议立即安装微软 2021 年 4 月安全更新 KB5001330，将 Windows 10 Version 2004/20H2 及 Windows Server 2019 升级至 OS Build 19041.928/19042.928，修复 Win32k 组件中的越界写入漏洞。如无法立即更新，可临时通过组策略禁用 win32k.sys 的交互式桌面服务或限制低权限用户对 win32k 的访问权限作为缓解措施，并持续关注微软后续补丁发布。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Win32k 特权提升漏洞"
updated = "2026-06-17T03:46:08Z"

