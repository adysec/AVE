[basic]
description = "Texas Imperial Software WFTPD 及 WFTPD Pro 2.41 版本在处理 FTP 命令时存在竞争条件漏洞。远程攻击者可在 LIST 命令仍在执行期间发送 STAT 命令，导致 FTP 服务进程崩溃，造成拒绝服务。攻击无需身份认证，仅需网络访问目标主机的 FTP 端口即可触发，利用门槛低。该漏洞影响 WFTPD 2.34、2.40、2.41 及 2.4.1 RC11 等多个版本。"
published = "2000-07-21T04:00:00.000"
remediation = "立即升级 WFTPD 至 2.4.1RC11 或更高版本（该版本已修复 STAT/LIST 并发处理缺陷）。由于 Texas Imperial Software 已停止维护 WFTPD，建议迁移至 FileZilla Server 或 vsftpd 等仍在积极维护的 FTP 服务器软件。在完成迁移前，可在防火墙或 WAF 层面限制对 FTP 服务端口（默认 21）的访问，仅允许可信 IP 连接，以降低被攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Texas Imperial Software WFTPD STAT/LIST命令处理拒绝服务漏洞"
updated = "2026-06-16T21:52:10.607"

