[basic]
description = "Cisco Integrated Services Routers Generation 2 (ISR G2) 系列路由器上运行的 Cisco IOS 软件 15.0 至 15.6 版本存在以太网帧分类错误漏洞。未经身份认证的相邻攻击者可通过向目标设备发送特制的以太网帧，触发设备重新加载，导致拒绝服务（DoS）条件。该漏洞源于设备对以太网帧的错误分类，攻击者无需任何认证即可在相邻网络内发起攻击，影响设备可用性。Cisco 已发布安全公告（CSCvc03809）并提供修复版本。"
published = "2017-09-29T01:34:48Z"
remediation = "立即升级 Cisco IOS 至修复 CSCvc03809 的版本，具体修复版本可通过 Cisco IOS Software Checker 工具（https://tools.cisco.com/security/center/selectIOSVersion.x）查询。由于该漏洞已被 CISA 列入已知被利用漏洞目录且存在野外利用，建议优先升级至最新稳定版。该漏洞无临时缓解措施（workaround），必须通过软件升级彻底修复。"
score = 6.5
severity = "MEDIUM"
sources = ["kev"]
title = "Cisco IOS ISR G2 路由器以太网帧拒绝服务漏洞"
updated = "2026-06-17T01:02:55Z"

