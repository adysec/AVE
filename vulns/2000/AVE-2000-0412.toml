[basic]
description = "NetWin DMail 邮件服务器中的 DSMTP 组件 2.7q 版本存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向 SMTP 服务发送超长的 ETRN 请求，触发栈缓冲区溢出，从而在服务器进程中执行任意指令。攻击无需任何认证或用户交互，成功率较高，可完全控制受影响服务器。该漏洞影响 NetWin DMail 2.7 及 2.8 版本。"
published = "2000-06-01T04:00:00Z"
remediation = '立即升级至 NetWin DMail 2.7r（正式版）或 2.8k（测试版），下载地址 https://netwinsite.com/dmail/download.htm。升级前可使用 `grep "etrn" /usr/local/dmail/dwatch/*.ded` 检查是否已被利用；若发现最近 3 天内存在匹配记录，说明系统可能已遭入侵，建议同时进行全系统安全审计。如无法立即升级，可在网络层面限制对 SMTP 端口的非信任来源访问作为临时缓解措施。'
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "NetWin DMail DSMTP 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:51:50Z"

