[basic]
description = "Polycom ViaVideo 2.2 和 3.0 版本的嵌入式 web 服务器存在栈缓冲区溢出漏洞。远程攻击者无需身份认证，即可通过向目标设备发送超长的 HTTP GET 请求触发溢出，导致 web 服务进程崩溃并引发拒绝服务。由于该 web 服务以较高系统权限运行，存在被进一步利用执行任意代码的风险。该漏洞影响部署 ViaVideo 视频会议系统的网络设备，攻击者可在局域网或互联网环境下利用公开 PoC（ExploitDB #21941）实施攻击，建议升级至安全版本或禁用相关 web 服务以缓解风险。"
published = "2002-12-31T05:00:00Z"
remediation = "升级到Polycom官方发布的安全修复版本，或联系厂商获取补丁。如无法立即升级，应在边界防火墙限制对ViaVideo Web服务端口3603的访问，仅允许可信管理网段访问，并在WAF或反向代理层拦截超长HTTP GET请求，同时监控服务日志中的异常请求模式。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Polycom ViaVideo 缓冲区溢出漏洞"
updated = "2026-06-16T22:00:16Z"

