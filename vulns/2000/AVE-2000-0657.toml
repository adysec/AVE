[basic]
description = "QSSL Voyager 2.01B Web 服务器在 QNX 4.05 演示磁盘版本中存在目录遍历漏洞。该漏洞源于服务器对用户请求的文件路径验证不足，远程攻击者可以通过在 URL 中构造包含 `..`（点点）字符的特制请求，绕过根目录限制，从而非法访问并读取服务器上任意的文件。此漏洞影响所有运行受影响版本的 Voyager 服务器，可能导致敏感系统文件或配置信息泄露。"
published = "2000-12-19T05:00:00.000"
remediation = '由于 QSSL Voyager 2.01B 是一款极其陈旧且已停止维护的软件，建议立即停止使用该服务器并迁移至 Apache 或 Nginx 等现代安全的 Web 服务器。若必须短期运行，请在服务器前端部署 WAF 或反向代理，配置过滤规则拦截包含 "../" 等目录遍历字符的恶意请求。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "QSSL Voyager 2.01B 任意文件读取漏洞"
updated = "2026-06-16T21:52:43.710"

