[basic]
description = "Apple WebKit 存在内存破坏漏洞，远程攻击者可通过诱使用户访问特制网站触发内存损坏，导致任意代码执行或应用程序崩溃。该漏洞影响 iOS 5.1 之前版本、iTunes 10.6 之前版本及 Safari 5.1.4 之前版本，攻击者无需身份认证即可利用，CVSS 评分 9.3，危害严重。Apple 已在 2012 年 3 月安全更新中修复此漏洞。"
published = "2012-03-08T22:55:02Z"
remediation = "将 Apple iOS 升级至 5.1 或更高版本（通过「设置→通用→软件更新」安装），将 iTunes 升级至 10.6 或更高版本（通过 Apple Software Update 或官网下载），将 Safari 升级至 5.1.4 或更高版本。如无法立即更新，可在浏览器中禁用 JavaScript 并避免访问不可信网站作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:54Z"

