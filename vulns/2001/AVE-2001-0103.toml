[basic]
description = 'Gene6 G6 FTP Server 2.0（又名 BPFTP Server 2.10）存在路径遍历信息泄露漏洞。当服务器未启用 "show relative paths" 选项时，未经身份认证的远程攻击者可通过 FTP 服务的 SIZE 和 MDTM 命令配合绝对路径，读取 FTP 根目录之外的文件属性信息（如文件大小、修改时间等），从而泄露服务器敏感目录结构及文件存在性信息。该漏洞影响 Gene6 BPFTP Server 2.0/2.10 版本，攻击者无需任何凭据即可在远程网络上发起利用，攻击复杂度低。CVSS 评分 7.5，危害等级高。建议用户升级到修复版本或启用相对路径显示选项以缓解风险。'
published = "2001-06-18T04:00:00Z"
remediation = '立即在服务器设置中启用 "show relative paths" 选项，使 FTP 服务仅返回相对路径，阻止通过 SIZE 和 MDTM 命令探测 FTP root 外的文件结构。建议升级到 Gene6 FTP Server 3.x 或更高版本，该版本已修复此路径遍历漏洞。如无法升级，应配置 FTP 根目录权限，限制用户仅能访问指定目录，并通过防火墙限制 FTP 服务仅对可信 IP 开放。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Gene6 BPFTP Server 文件存在性信息泄露漏洞"
updated = "2026-06-16T21:53:59Z"

