[basic]
description = "Autel MaxiCharger AC Elite Home 电动汽车充电桩在处理自定义 USB 数据包时存在堆缓冲区溢出漏洞。该漏洞源于设备未对用户提交的数据长度进行有效验证，直接将数据复制到固定长度的堆缓冲区中，导致缓冲区溢出。物理接触攻击者无需任何认证即可通过特制 USB 设备触发该漏洞，实现以设备权限执行任意代码。该漏洞影响 Autel MaxiCharger AC Elite Home 系列产品，厂商已在固件版本 V1.40.81 中修复。"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 Autel MaxiCharger AC Elite Home 固件升级至 V1.40.81 或更高版本，可通过 Autel 官方管理后台或 USB 本地升级。如无法立即升级，应限制对充电桩 USB 端口的物理访问，将设备部署在受控区域并加装 USB 防篡改封条，同时监控异常 USB 设备接入行为。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "Autel MaxiCharger AC Elite Home USB堆缓冲区溢出任意代码执行漏洞"
updated = "2026-01-01T00:00:00Z"

