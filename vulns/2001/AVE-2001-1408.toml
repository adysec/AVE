[basic]
description = "Oracle Java Virtual Machine（JVM）存在任意文件读取漏洞，影响 Oracle 8i 8.1.7 及 Oracle Application Server 9iAS Release 1.0.2.0.1 版本。当服务器配置了 <<ALL FILES>> FilePermission 时，远程攻击者无需身份认证即可通过构造特制的 .jsp 或 .sqljsp 文件请求，利用 JVM 的文件权限配置绕过机制读取服务器上的任意文件内容，可能导致敏感信息泄露，包括配置文件、数据库凭据等关键数据。该漏洞利用方式简单，攻击者仅需向目标服务器发送恶意 HTTP 请求即可触发，CVSS 评分 7.5，危害等级高。"
published = "2001-05-03T04:00:00Z"
remediation = "立即应用 Oracle 提供的安全补丁，将 Oracle 8i 升级至 8.1.7.4 或更高版本，将 Oracle Application Server 9iAS 升级至 9.0.2.2 或更高版本。如无法立即升级，可修改 JVM 安全策略文件（java.policy），将 .jsp 和 .sqljsp 文件扩展名对应的 FilePermission 从 <<ALL FILES>> 修改为仅授予应用目录所需的最小读写权限，移除对所有目录的访问授权，并在防火墙层面禁止对 Oracle HTTP Server 8080 端口的未授权外部访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Oracle Application Server 任意文件读取漏洞"
updated = "2026-06-16T21:54:06Z"

