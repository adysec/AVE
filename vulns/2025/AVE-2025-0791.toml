[basic]
description = "Windows MapUrlToZone 安全功能存在路径等价解析不当漏洞（CWE-41）。该功能用于将 URL 映射到 Internet、本地 Intranet 等安全区域，由于对 URL 路径等价性的解析逻辑存在缺陷，攻击者可构造特制的 URL 绕过区域映射机制，使恶意网站被错误归类到低限制安全区域，从而绕过安全策略。该漏洞影响 Windows 10/11 及 Windows Server 2008 至 2025 等多个版本。攻击者可通过诱导用户点击恶意链接远程触发，无需认证但需要用户交互，成功利用可导致低度信息泄露。"
published = "2025-01-14T18:15:58Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新 KB5050061，可通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。该更新修复了 Windows 中 MapUrlToZone 组件的 URL 区域映射绕过漏洞，受影响版本包括 Windows 10/11 及 Windows Server 2008 至 2025。如无法立即打补丁，可配置 Internet 安全区域为高等级并限制从不受信任来源打开链接作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows MapUrlToZone 安全功能绕过漏洞"
updated = "2026-06-17T08:43:07Z"

