[basic]
description = "Aplio PRO 设备的 authenticate.cgi CGI 程序存在命令注入漏洞，远程攻击者无需身份认证即可通过向 password 参数中注入 shell 元字符（如分号、管道符等）执行任意系统命令。该漏洞影响 Aplio PRO 系列电话设备，攻击者只需能够访问目标设备的 Web 管理界面即可利用，可导致设备完全受控、敏感信息泄露或作为跳板攻击内网其他系统。由于该 CGI 程序未对用户输入进行有效过滤，攻击难度较低，危害严重。"
published = "2000-12-19T05:00:00Z"
remediation = "Aplio PRO 产品已停止维护，厂商不再提供安全更新。建议立即将受影响设备从公网断开或下线；如业务必须保留使用，应在网络边界防火墙设置白名单策略，仅允许可信 IP 访问该设备，并在反向代理层对 authenticate.cgi 的 password 参数进行特殊字符过滤（如禁止 |;&`$(){}[]<> 等 shell 元字符），同时启用 Web 应用防火墙（WAF）拦截命令注入攻击。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Aplio PRO authenticate.cgi 远程命令执行漏洞"
updated = "2026-06-16T21:52:46Z"

