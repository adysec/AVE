[basic]
description = "Microsoft SQL Server 7.0 存在存储过程权限绕过漏洞。本地用户可通过创建临时存储过程来引用并执行原本无权访问的存储过程，从而绕过数据库的权限检查机制，实现权限提升。攻击者需要拥有本地系统访问权限，利用该漏洞可获取未授权的数据读取、修改或删除能力。该漏洞影响 Microsoft SQL Server 7.0 版本，CVSS 评分 4.6，危害等级中危。"
published = "2000-07-07T04:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS00-048 提供的官方补丁：Intel 平台下载 S70843i.exe，Alpha 平台下载 S70843a.exe。安装后重启 SQL Server 服务使补丁生效。同时建议将数据库所有者从 sa 账户更改为专用账户，避免使用 sa 账户进行日常操作；推荐将 SQL Server 认证模式切换为 Windows NT 身份验证模式，从根本上降低权限绕过风险。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft SQL Server 7.0 存储过程权限绕过漏洞"
updated = "2026-06-16T21:52:05Z"

