[basic]
description = "RealNetworks RealPlayer 及 RealPlayer SP 等多款播放器在解析 SIPR 文件格式时存在堆缓冲区溢出漏洞。攻击者可通过诱导用户打开精心构造的恶意 SIPR 文件，触发堆缓冲区溢出，导致远程代码执行。该漏洞影响 RealPlayer 11.0-11.1、RealPlayer SP 1.0-1.1.4、RealPlayer Enterprise 2.1.2、Mac RealPlayer 11.0-11.1、Linux RealPlayer 11.0.2.1744 及可能的 HelixPlayer 1.0.6 等版本，CVSS 评分 9.3（严重），攻击向量为网络、攻击复杂度中等、无需身份认证，可导致机密性、完整性、可用性完全丧失。RealNetworks 已在 12.0.1.609 版本中修复此漏洞，用户应升级至最新版本。"
published = "2010-12-14T16:00:04Z"
remediation = "建议立即升级 RealPlayer 至 12.0.1.609 或更高版本（可从 RealNetworks 官网下载最新版本）。若无法立即升级，建议卸载 RealPlayer 或禁用浏览器中的 RealPlayer 插件/ActiveX 控件，并配置防火墙阻止 RealPlayer 网络访问作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer 堆溢出漏洞"
updated = "2026-06-16T23:24:40Z"

