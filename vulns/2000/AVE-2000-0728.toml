[basic]
description = "BSD 系统 libutil 库中的 pw_error 函数存在格式化字符串漏洞，本地用户可通过在 chpass 或 passwd 等命令中提交特制的畸形密码字符串触发该漏洞，导致 pw_error 函数对用户输入进行不安全的格式化输出处理，从而执行任意代码以获取 root 权限。该漏洞影响多个 BSD 衍生系统，攻击者需拥有本地账户即可利用，危害等级高。"
published = "2000-12-19T05:00:00.000"
remediation = "针对 OpenBSD 2.7，应用 errata #025 补丁或升级至 OpenBSD 2.8 及以上版本；针对 FreeBSD，安装 FreeBSD-SA-00:58 安全公告对应补丁；针对 NetBSD，安装 NetBSD-SA2000-015 安全公告对应补丁。临时缓解措施可移除 chpass 等受影响命令的 setuid 位：`chmod u-s /usr/bin/chpass`。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "BSD libutil 库 pw_error 函数格式化字符串本地权限提升漏洞"
updated = "2026-06-16T21:52:55.813"

