[basic]
description = "TIBCO JasperReports 系列产品的默认服务器实现存在目录遍历漏洞（CWE-22）。由于对用户提供的文件路径参数缺乏充分验证，已认证的远程攻击者可通过构造包含 `../` 等特殊序列的 HTTP 请求，突破路径限制访问服务器文件系统中的任意文件，导致敏感信息泄露。攻击者需拥有有效用户凭证，无需用户交互即可利用。该漏洞影响 TIBCO JasperReports Library、Server 及 Community Edition 等多个版本。"
published = "2019-03-07T22:29:00.323"
remediation = "根据 TIBCO 官方安全公告（2019年3月6日发布），建议将 TIBCO JasperReports Library 升级至 6.4.3 或 7.2.1 及以上版本，JasperReports Server 升级至 7.2.1 及以上版本，Community Edition 升级至 6.7.1 及以上版本。对于无法立即升级的环境，可在 Web 服务器或反向代理层面限制对 /jasperserver-pro/reportresource/reportresource/ 路径的外部访问，并配置 WAF 规则拦截包含 ../ 的 resource 参数请求，同时限制对 js.jdbc.properties 等敏感配置文件的直接访问。"
score = 6.5
severity = "MEDIUM"
sources = ["kev"]
title = "TIBCO JasperReports 系列产品路径遍历漏洞"
updated = "2026-06-17T01:47:56.560"

