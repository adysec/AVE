[basic]
description = "Mirabilis ICQ Web Front Server 的 HTTPd 组件在处理包含问号（?）字符的 URL 请求时存在输入验证缺陷，远程攻击者无需身份认证即可向目标服务器发送特制的 URL 请求，触发服务进程崩溃，导致拒绝服务。该漏洞影响 ICQ Web Front 多个版本，攻击复杂度低，仅需发送单个恶意 HTTP 请求即可利用，但不会造成数据泄露或权限提升。Exploit-DB 已公开 PoC 利用代码。"
published = "2000-12-11T05:00:00Z"
remediation = "立即停止使用 Mirabilis ICQ Web Front 服务，该产品已停止维护多年，无官方补丁可用。建议迁移至其他即时通讯服务端软件（如 Matrix/Synapse、Ejabberd 等），并在防火墙层面封禁 ICQ Web Front 默认端口（80/443）的外部访问作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Mirabilis ICQ Web Front Server 拒绝服务漏洞"
updated = "2026-06-16T21:53:06Z"

