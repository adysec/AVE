[basic]
description = "HP JetDirect 打印机网卡固件 X.08.20 及更早版本的 IP 协议栈实现存在缺陷，未经身份认证的远程攻击者可通过发送畸形 IP 数据包触发漏洞，导致打印机崩溃拒绝服务。该漏洞影响 HP JetDirect X.08.04、X.08.05、X.08.20 等固件版本，攻击无需用户交互，网络可达即可利用，CVSS 评分 5.0（中危），主要影响打印服务可用性。"
published = "2000-12-11T05:00:00Z"
remediation = "请立即更新 HP JetDirect 固件到 X.08.21 或以上版本以修复漏洞，建议使用 USB 或网络管理工具进行批量升级。如无法立即更新，可通过防火墙策略丢弃非标准IP报文作为临时缓解措施，并关闭JetDirect网络服务以禁用其协议端口。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "HP Jetdirect 打印机卡 IP 拒绝服务漏洞"
updated = "2026-06-16T21:53:04Z"

