[basic]
description = "Drupal 7.x 和 8.x 核心存在远程代码执行漏洞（CVE-2018-7602，又称 Drupalgeddon3），由于表单渲染过程中对用户输入校验不严，未经身份认证的远程攻击者可通过向目标站点发送特制的 HTTP 请求，利用多个攻击向量触发该漏洞，在无需登录的情况下实现远程代码执行，完全控制目标服务器。该漏洞 CVSS 评分 9.8，危害等级严重，影响所有 Drupal 7.58 以下及 8.5.1 以下版本，且已在野外被大规模利用。官方已发布安全更新修复此漏洞，建议立即升级至 Drupal 7.58 或 8.5.1 及以上版本。"
published = "2018-07-19T17:29:00.373"
remediation = "立即升级 Drupal 至安全版本：Drupal 7.x 升级至 7.59，Drupal 8.4.x 升级至 8.4.8，Drupal 8.5.x 升级至 8.5.3。如无法立即升级，可先应用 SA-CORE-2018-002（CVE-2018-7600）的补丁，再应用 CVE-2018-7602 的官方补丁（Drupal 8.x 补丁：https://git.drupalcode.org/project/drupal/commit/bb6d396609600d1169da29456ba3db59abae4b7e.diff；Drupal 7.x 补丁：https://git.drupalcode.org/project/drupal/commit/080daa38f265ea28444c540832509a48861587d0.diff）。同时检查站点是否已被入侵，若发现异常立即排查并恢复备份。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Drupal 远程代码执行漏洞"
updated = "2026-06-17T02:03:26.140"

