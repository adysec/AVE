[info]
author = "ave"
description = "Apple Safari WebKit内存破坏漏洞复现验证，通过构造恶意网页触发内存损坏导致任意代码执行或拒绝服务"
id = "POC-AVE-2012-0339"
name = "CVE-2012-3663 PoC"
severity = "critical"
tags = ["ave-2012-0339"]
vuln_id = [
    "CVE-2012-3663",
    "AVE-2012-0339",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc/test.html"
protocol = "http"

[poc.requests.headers]
User-Agent = "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_8) AppleWebKit/536.26 (KHTML, like Gecko) Version/6.0 Safari/536.26"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
