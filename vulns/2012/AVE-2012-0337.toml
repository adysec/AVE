[basic]
description = "Apple iTunes 10.7 之前的版本中，WebKit 组件存在内存破坏漏洞。远程攻击者可通过构造恶意网页，触发内存错误，导致任意代码执行或应用程序崩溃。该漏洞无需身份认证即可利用，影响使用旧版 iTunes 的 macOS 系统用户。Apple 已在 iTunes 10.7 版本中修复此漏洞。"
published = "2012-09-13T10:30:20.243"
remediation = "立即将 Apple iTunes 升级至 10.7 版本，该版本修复了 WebKit 组件中的内存破坏漏洞。同时将 iOS 升级至 6.0 或更高版本，将 Safari 升级至 6.0.1 或更高版本。若无法立即升级，可在网络边界防火墙层面阻止对已知恶意站点的访问，禁用 Safari 的自动打开安全文件功能以降低被利用风险。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:40.797"

