[basic]
description = "Squid 缓存代理服务器 2.4 STABLE3 及更早版本的 FTP 代理功能中存在缓冲区溢出漏洞。远程攻击者可通过向 Squid 服务器发送包含大量特殊字符的恶意 ftp:// URL 触发该漏洞，当 Squid 对 URL 中的特殊字符进行转义处理时，由于缓冲区边界检查不足导致溢出，可能造成拒绝服务（核心转储）甚至任意代码执行。该漏洞 CVSS 评分 7.5，危害等级高，无需身份认证即可远程利用。"
published = "2002-03-08T05:00:00Z"
remediation = "升级 Squid 至 2.4.STABLE4 或更高版本（官方补丁 squid-2.4.STABLE3-ftp_coredump.patch 已修复此漏洞）。如无法立即升级，可在 squid.conf 顶部添加以下 ACL 规则以缓解风险：`acl non_anonymous_ftp url_regex -i ftp://[^/@]*@` 和 `http_access deny non_anonymous_ftp`，拒绝非匿名 FTP URL 的代理转发。同时限制只有受信任用户才允许使用 FTP 代理功能。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Squid Cache FTP代理URL缓冲区溢出漏洞"
updated = "2026-06-16T21:56:42Z"

