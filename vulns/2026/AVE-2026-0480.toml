[basic]
description = "File Browser 是一款用于管理指定目录内文件上传、删除、预览、重命名和编辑的文件管理界面。其 Hook Authentication（钩子认证）功能允许管理员将登录验证委托给外部 shell 命令执行，但该功能在 2.63.6 之前版本中存在 OS 命令注入漏洞。用户提交的用户名和密码通过 `os.Expand` 直接拼接到 shell 命令字符串中，未进行任何转义或过滤处理。未经身份认证的远程攻击者可在登录页面的用户名或密码字段中注入 shell 元字符（如 `;`、`#` 等），导致服务器在认证前即执行任意操作系统命令，实现预认证远程代码执行。攻击者无需任何有效账户或凭证，仅需发送单个特制 HTTP 请求即可完成利用，危害等级严重。"
published = "2026-06-25T19:16:40Z"
remediation = "立即升级 File Browser 至 2.63.6 或更高版本，该版本已修复 `os.Expand` 未转义导致的命令注入问题。如无法立即升级，应禁用 Hook Authentication 功能（在配置文件中移除或注释相关 hook 命令配置），并在网络层面限制对 File Browser 登录端口的访问，仅允许可信 IP 连接。"
score = 9.3
severity = "CRITICAL"
sources = ["ghsa"]
title = "File Browser Hook认证功能命令注入导致预认证远程代码执行漏洞"
updated = "2026-06-25T19:58:30Z"

