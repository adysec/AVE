[basic]
description = "Open WebUI 在 0.7.0 至 0.11.0 版本中存在权限绕过漏洞。当管理员已撤销某用户的图像生成权限（features.image_generation）时，该用户仍可通过在聊天补全（chat-completions）请求中携带 features.image_generation 标志来调用图像生成功能。这是因为聊天管道直接信任了客户端提供的 features 对象，未像直接图像路由和原生函数调用路径那样重新检查用户权限。成功利用后，攻击者可消耗运营商配置的图像生成服务提供商的 API 额度和配额，并将生成的文件写入运营商存储空间。该漏洞不影响原生函数调用路径（native function calling），且不会暴露提供程序凭据或其他用户数据。漏洞已在 0.11.0 版本中修复。"
published = "2026-08-04T20:16:55Z"
remediation = "立即将 Open WebUI 升级至 0.11.0 或更高版本。该版本修复了 legacy chat-features 块未重新校验 features.image_generation 权限的缺陷，确保被撤销图像生成权限的用户无法通过聊天补全接口生成图像。如暂时无法升级，可关闭 ENABLE_IMAGE_GENERATION 配置项禁用图像生成功能，或在聊天请求中将 params.function_calling 设置为 native 模式（而非 legacy）作为临时缓解措施，因为 native 模式会在注册图像工具前正确检查用户权限。"
score = 4.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Open WebUI 图像生成权限绕过漏洞"
updated = "2026-08-05T16:17:02Z"

