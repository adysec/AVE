[info]
author = "AVE"
description = "检测目标是否运行 oops WWW Proxy Server 1.4.6。该版本在处理反向 DNS 查询返回的超长主机名时存在堆缓冲区溢出漏洞，远程攻击者可利用此漏洞执行任意命令。PoC 通过 HTTP 连接代理服务器验证服务存在。"
id = "POC-AVE-2001-0015"
name = "Oops! WWW Proxy Server 1.4.6 堆缓冲区溢出 PoC"
severity = "critical"
tags = ["ave-2001-0015"]
vuln_id = [
    "CVE-2001-0029",
    "AVE-2001-0015",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    200,
    301,
    302,
    403,
    404,
    500,
    502,
    503,
]
type = "status"
