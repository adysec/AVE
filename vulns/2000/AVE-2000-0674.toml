[basic]
description = "Bytes Interactive Web Shopper 购物车程序 shopper.cgi 2.0 及更早版本存在目录遍历漏洞。远程攻击者无需身份认证，通过向 newpage 参数提交 `../` 等路径遍历序列，即可突破路径限制读取服务器上的任意文件，导致敏感信息泄露。该漏洞影响 Web Shopper 2.0 及之前版本，攻击复杂度低，危害中等。"
published = "2000-12-19T05:00:00.000"
remediation = 'Bytes Interactive 已停止维护 Web Shopper，建议立即停止使用 shopper.cgi 2.0 及更早版本，迁移至受支持的购物车系统。如无法立即替换，在 Web 服务器层面（Apache/Nginx）配置重写规则，拒绝 newpage 参数包含 `../`、`..\` 或空字节编码的请求；同时在 shopper.cgi 入口处对 newpage 参数做路径规范化校验，过滤所有非字母数字及 `./` 之外的字符，禁止包含连续点号或斜杠的输入。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Bytes Interactive Web Shopper 目录遍历漏洞"
updated = "2026-06-16T21:52:46.397"

