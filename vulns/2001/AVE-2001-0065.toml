[basic]
description = "WhitSoft SlimServe HTTPd 1.0 存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过向目标服务器发送超长 HTTP GET 请求触发该漏洞，导致服务拒绝服务，并可能执行任意系统命令。该漏洞影响 SlimServe HTTPd 1.0 及更早版本，攻击者无需任何凭据即可利用超长请求行溢出服务端缓冲区，进而获得与服务器进程同等权限的访问能力，完全控制受影响主机。CVSS 评分 10.0，危害等级严重。"
published = "2001-05-03T04:00:00Z"
remediation = "建议立即停止使用 WhitSoft SlimServe HTTPd 1.1 并迁移至 Apache 或 Nginx 等现代安全 Web 服务器。若无法立即迁移，应在防火墙或 WAF 层面实施限制，拦截所有超长的 HTTP GET 请求以缓解缓冲区溢出攻击。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "WhitSoft SlimServe HTTPd 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:48Z"

