[basic]
description = "Windows Core Messaging 组件存在堆缓冲区溢出漏洞（CWE-122），已获得低权限的本地攻击者可通过特制系统调用触发该漏洞，利用堆内存损坏实现权限提升至 SYSTEM 级别。该漏洞攻击复杂度较高，但成功利用后可完全控制目标系统，影响机密性、完整性和可用性。Microsoft 已在 2025 年 2 月安全更新（KB5051974）中修复此漏洞。"
published = "2025-02-11T18:15:39.787"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新 (KB5051974)，可通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载。该更新修复了 Windows Core Messaging 组件的堆缓冲区溢出漏洞 (CWE-122)。如无法立即安装补丁，可限制低权限用户对 Core Messaging 接口的访问作为临时缓解措施。"
score = 7
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Core Messaging 特权提升漏洞"
updated = "2026-06-17T08:43:18.617"

