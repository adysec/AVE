[basic]
description = '@wakaru/cli 命令行工具在处理 JavaScript bundle 解包（--unpack）时存在路径穿越漏洞。该漏洞源于程序对模块文件名的过滤机制不足，仅执行一次清理，导致包含重叠遍历字符（如 "....//"）的恶意文件名在过滤后仍能还原为 "../"，从而使输出路径逃逸出预设的目标目录。攻击者可通过诱导用户解包特制的恶意 bundle 文件，在目标系统上实现任意文件写入。根据目标路径和环境不同，此漏洞可能进一步导致远程代码执行。受影响版本为 1.0.0 至 1.4.0，CVSS 评分 7.1，危害等级为高。'
published = "2026-07-28T16:18:59Z"
remediation = "建议立即将 @wakaru/cli 升级至 1.4.0 或最新版本，可通过运行 `npm install @wakaru/cli@latest` 完成更新。在无法立即升级的情况下，请停止对来源不可信或未知的 JavaScript bundle 使用 `--unpack` 参数以防止任意文件写入。"
score = 7.1
severity = "HIGH"
sources = ["ghsa"]
title = "wakaru @wakaru/cli 任意文件写入漏洞"
updated = "2026-07-28T16:18:59Z"

