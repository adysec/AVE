[basic]
description = "BlackBoard 5.0 存在跨站脚本（XSS）漏洞，远程攻击者可通过向 login.pl 的 course_id 参数、ProcessInfo.cgi 的 CTID 参数或 index.cgi 的 Message 参数注入恶意 Web 脚本代码，当其他用户访问特制链接时脚本将在浏览器中执行，导致会话劫持、信息泄露或钓鱼攻击。攻击无需认证，仅需诱使用户点击恶意链接即可触发。该漏洞影响 BlackBoard 5 版本，CVSS 评分 7.5，危害等级高。"
published = "2002-10-04T04:00:00Z"
remediation = "升级 Blackboard 至 6.0 及以上版本，该版本已修复多个输入参数（course_id、CTID、Message）的跨站脚本漏洞。如无法升级，在 Web 服务器（如 IIS/Apache）层面配置输入过滤规则，对 course_id、CTID、Message 等参数进行 HTML 实体编码，禁止 `<script>` 等标签字符传入。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Blackboard Blackboard 5.0 跨站脚本漏洞"
updated = "2026-06-16T21:58:33Z"

