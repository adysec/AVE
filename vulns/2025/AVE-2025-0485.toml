[basic]
description = "GNU Binutils 2.43 的 ld 组件中 bfd/elflink.c 文件的 bfd_elf_reloc_symbol_deleted_p 函数存在内存损坏漏洞（CWE-119）。攻击者可通过向目标系统提交特制的 ELF 文件触发该漏洞，导致内存访问越界或数据损坏。虽然攻击复杂度较高且利用难度较大，但该漏洞的利用代码已公开披露，远程攻击者可能结合其他向量实现拒绝服务或潜在代码执行。补丁已提交至上游仓库，建议用户尽快更新至修复版本。"
published = "2025-02-11T09:15:09Z"
remediation = "立即将 GNU Binutils 升级至 2.44 或更高版本（包含 commit b425859021d17adf62f06fb904797cf8642986ad 的修复）。SUSE 用户可通过 SUSE-SU-2025:4096-1 更新至 2.4 版本。如无法立即升级，避免在 ld 链接过程中使用不受信任的输入文件，并禁用 `-z gcs=implicit` 选项作为临时缓解措施。"
score = 2.3
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils ld 组件 bfd/elflink.c 内存损坏漏洞"
updated = "2026-06-17T08:38:32Z"

