[basic]
description = 'Allaire JRun 3.0 HTTP Servlet 服务器存在目录泄露漏洞。远程攻击者通过在 URL 请求开头添加额外的斜杠（即"extra leading slash"），可绕过访问控制直接访问 WEB-INF 目录及其中的敏感文件（如 web.xml 配置文件）。该漏洞无需身份认证即可利用，攻击者可通过构造特制的 HTTP 请求获取服务器配置信息，为后续攻击提供情报。CVSS 评分 5.0，危害等级中等。'
published = "2000-12-11T05:00:00Z"
remediation = "立即安装 Allaire Security Bulletin ASB00-27 提供的补丁，升级 JRun 至修复版本。如无法升级，可在 Web 服务器（如 Apache/IIS）前端配置 URL 重写规则，拦截包含 `//WEB-INF/` 的请求并返回 403；或在 JRun 的 web.xml 中添加安全约束，禁止对 WEB-INF 目录的直接访问。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Allaire JRun 3 目录泄露漏洞"
updated = "2026-06-16T21:53:03Z"

