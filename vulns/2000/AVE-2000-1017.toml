[basic]
description = "Pegasus Mail 3.11 存在缓冲区溢出漏洞，远程攻击者可通过向目标用户发送包含大量二进制数据的超长邮件消息触发该漏洞，导致邮件客户端缓冲区溢出，造成拒绝服务，在特定条件下可能执行任意代码。该漏洞影响 Pegasus Mail 3.11 版本，攻击无需身份认证，利用方式简单，危害较大。"
published = "2000-12-19T05:00:00.000"
remediation = "立即升级 Pegasus Mail 至 4.91 或更高版本，该漏洞在 3.11 之后版本已修复。如无法升级，建议在邮件服务器或客户端防火墙中限制接收包含大量二进制数据的异常邮件，并禁用邮件客户端自动预览功能作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Pegasus Mail 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:47.657"

