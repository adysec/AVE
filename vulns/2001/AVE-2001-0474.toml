[basic]
description = "Intego FileGuard 2.0 及 4.0 版本使用弱加密算法存储用户信息和密码，本地攻击者可通过 Disengage 等工具解密存储的凭据数据，从而获取提升后的系统权限。该漏洞攻击复杂度低，无需身份认证即可利用，影响系统机密性、完整性和可用性。受影响用户应升级至修复版本或采取额外加密措施保护敏感信息。"
published = "2002-04-01T05:00:00Z"
remediation = "升级到 Intego FileGuard 最新版本（若厂商已停止支持则建议迁移至 macOS 内置的 FileVault 加密方案）。临时缓解措施：限制本地用户对密码存储文件的读取权限，并启用物理访问控制防止攻击者运行 Disengage 等解密工具。"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Intego FileGuard 弱密码加密漏洞"
updated = "2026-06-16T21:55:42Z"

