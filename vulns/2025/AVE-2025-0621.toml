[basic]
description = "CPython 电子邮件库在处理邮件地址列表折叠时，当分隔逗号位于需要 Unicode 编码的折行上时，该逗号本身也被错误地进行了 Unicode 编码，而非保持为普通逗号。此缺陷源于对 RFC 5322 邮件头折叠规范的实现不当（CWE-116），可导致某些邮件服务器错误解析邮件地址头信息，造成邮件路由或投递异常。攻击者可通过构造特制的邮件头利用此漏洞，攻击复杂度较高，需具备低权限且需用户交互。"
published = "2025-02-28T19:15:36Z"
remediation = "升级 CPython 至 3.11.10+、3.12.5+ 或 3.13.0+ 版本，这些版本已合入修复提交 09fab93（防止逗号分隔符被错误编码）和 858b9e8（修复回归问题并补充遗漏场景）。如无法立即升级，可在邮件处理流程中避免对长地址列表进行折叠操作，或使用外部邮件解析库（如 `email6`）替代标准库 `email` 模块的 `_header_value_parser`。"
score = 2.3
severity = "LOW"
sources = ["msrc"]
title = "Python CPython 电子邮件标头折叠Unicode编码不当漏洞"
updated = "2026-07-31T14:16:44Z"

