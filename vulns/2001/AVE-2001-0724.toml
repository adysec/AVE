[basic]
description = "Microsoft IIS 5.0 及更早版本的 FTP 服务存在账户枚举漏洞，未经身份认证的远程攻击者可通过在用户名前添加特殊字符序列，向目标 FTP 服务发送探测请求，根据服务响应差异判断受信任域中 Guest 账户是否存在。该漏洞影响运行 IIS 5.0 的 Windows 2000 等系统，攻击者无需任何凭据即可通过网络远程枚举域账户信息，CVSS 评分 5.0，危害等级中。Microsoft 已通过 MS01-026 安全公告发布补丁修复此漏洞。"
published = "2001-06-27T04:00:00Z"
remediation = "建议立即安装 Microsoft 安全公告 MS01-026 对应的累积安全补丁：IIS 4.0 安装 Q295534 补丁，IIS 5.0 安装 Q293826 补丁，或升级至 Windows 2000 Service Pack 3 及更高版本。临时缓解措施：将 FTP 服务器配置为独立服务器而非域成员，减少不必要的受信任域关系，并确保所有域的 Guest 账户处于禁用状态。补丁将修复 FTP 服务对特殊字符序列的处理逻辑，使服务仅在用户正确指定域名时才允许登录域账户，从而消除通过前缀字符枚举域用户账户的可能。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft IIS FTP 远程账户枚举漏洞"
updated = "2026-06-16T21:54:07Z"

