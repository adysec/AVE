[basic]
description = "CVS 1.10.8 服务器未正确限制用户创建任意 Checkin.prog 或 Update.prog 程序，导致具有 CVS 提交权限的远程攻击者可通过在仓库中植入特制的 Checkin.prog 或 Update.prog 木马程序，当其他用户执行 CVS 提交操作时触发恶意代码执行。该漏洞允许攻击者在目标系统上以 CVS 服务器进程权限执行任意命令，实现完全控制。攻击者需要拥有 CVS 仓库的提交权限，降低了攻击门槛。CVSS 评分 7.2，危害等级高。"
published = "2000-10-20T04:00:00.000"
remediation = "升级 CVS 服务器至 1.11 或更高版本（该版本限制普通用户修改 Checkin.prog/Update.prog 等钩子脚本）。如无法升级，手动设置 CVSROOT 目录权限为仅管理员可写，并定期审计该目录下文件完整性；同时限制 CVS 提交者范围，仅允许可信用户执行 commit 操作。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "CVS Kit CVS Server Checkin.prog 任意二进制执行漏洞"
updated = "2026-06-16T21:52:15.253"

