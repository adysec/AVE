[basic]
description = "Windows Script Host 存在文件信息泄露漏洞，远程攻击者可通过 Internet Explorer 中的 GetObject JavaScript 函数配合 htmlfile ActiveX 对象，在无需身份认证的情况下读取目标系统上的任意文件内容。该漏洞影响 Windows Script Host 5.1/5.5 及 Internet Explorer 5.5 及更早版本，攻击者只需构造恶意的 JavaScript 代码诱导用户访问，即可利用 GetObject() 函数指定本地文件路径，通过 htmlfile ActiveX 对象将文件内容返回给攻击者，造成敏感文件泄露。CVSS 评分 5.0，危害等级中等。"
published = "2001-06-02T04:00:00Z"
remediation = '安装 Microsoft 2001 年 3 月安全更新 MS01-015，将 Windows Script Host 5.1 升级至版本号末四位大于等于 6330 的最新版本，或将 WSH 5.1/5.5 直接升级至 WSH 5.6；Internet Explorer 5.01 SP1 用户安装补丁 Q279328，IE 5.5 SP1 用户安装补丁 Q286045。临时缓解措施：在 IE 安全区域设置中禁用不可信站点的 Active Scripting，或在邮件客户端中将 HTML 邮件设置为在"受限站点"区域中打开，并通过注册表删除不必要的异步可插入协议（APP）以限制 WSH 被网页调用。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows Script Host 文件泄露漏洞"
updated = "2026-06-16T21:53:45Z"

