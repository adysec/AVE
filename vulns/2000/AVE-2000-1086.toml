[basic]
description = 'PTlink IRCD 3.5.3 及配套的 PTlink Services 1.8.1 存在拒绝服务漏洞。该漏洞源于 IRC 守护进程在处理用户发送的特制命令时缺乏充分的输入验证与边界检查。未经身份认证的远程攻击者可通过向目标服务器发送包含恶意参数的命令（如"mode +owgscfxeb"及"oper"命令），触发 IRCD 进程内部的异常处理逻辑，导致服务器进程崩溃并停止服务。该漏洞影响运行 PTlink IRCD 3.5.3 或 PTlink Services 1.8.1 的 IRC 服务器实例，攻击者无需预先获得账户权限或完成身份认证即可发起攻击。攻击成功后将造成 IRC 服务中断，所有在线用户被迫断开连接，影响服务的可用性与正常运行。CVSS v2 评分 5.0，危害等级为中等。建议受影响用户升级至修复版本或应用相关安全补丁以消除该拒绝服务风险。'
published = "2001-01-09T05:00:00.000"
remediation = "立即将 PTlink IRCD 升级至更新版本，或迁移至受维护的 IRC 服务端（如 ircd-hybrid、InspIRCd 等）；若暂无法升级，应在防火墙层面限制对 IRCD 端口的访问，仅允许可信 IP 连接，并禁用不必要的 oper 命令授权。同时升级 PTlink Services 至安全版本，防止攻击者通过 mode +owgscfxeb 及 oper 命令触发服务端崩溃。建议定期审查 oper 权限配置，移除不必要的全局操作员账户。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "PTlink IRCD 远程拒绝服务漏洞"
updated = "2026-06-16T21:53:09.077"

