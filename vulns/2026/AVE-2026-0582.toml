[basic]
description = "OpenRemote KNX 协议资产导入功能中存在 XML 外部实体注入漏洞。该漏洞源于 CVE-2026-40882 的修复不完整——官方仅修补了 Velbus 协议处理器的 XXE 缺陷，却遗漏了 KNXProtocol.java 中两处未受保护的 XML 解析调用（Saxon XSLT 转换与 XMLInputFactory）。已认证的攻击者可通过上传特制的 ETS 项目 ZIP 文件，利用外部实体读取服务器任意文件（如 /etc/passwd、数据库配置、云元数据等），并可能通过 SSRF 攻击内网服务。该漏洞影响所有暴露 Manager API 给认证用户的 OpenRemote 部署，无需管理员权限即可利用。"
published = "2026-01-01T00:00:00Z"
remediation = "将 io.openremote:openremote-agent 升级到 1.24.2 或更高版本，该版本已在 KNXProtocol.java 中对 Saxon TransformerFactory 和 XMLInputFactory 添加 XXE 防护配置（设置 FEATURE_SECURE_PROCESSING、disallow-doctype-decl、external-general-entities、external-parameter-entities、load-external-dtd 等安全特性）。如暂无法升级，可通过防火墙或反向代理限制对 /api/{realm}/agent/{agentId}/import 端点的访问，仅允许受信任的管理员 IP 调用资产导入功能，以阻止未授权用户的 XML 解析攻击面。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "OpenRemote KNXProtocol XML外部实体注入任意文件读取漏洞"
updated = "2026-01-01T00:00:00Z"

