[basic]
description = "Sudo 1.6.6 之前版本中存在差一错误（off-by-one）漏洞，该漏洞可导致基于堆的缓冲区溢出。本地攻击者可通过向 -p（提示符）参数传入特殊字符触发此漏洞，由于程序未能正确展开这些特殊字符，最终可导致攻击者获取 root 权限。攻击条件要求攻击者拥有本地系统访问权限，无需用户交互，利用难度较低。该漏洞影响 Sudo 1.6.6 之前的所有版本，CVSS 评分 7.8，危害等级高。"
published = "2002-05-16T04:00:00.000"
remediation = "立即升级 Sudo 至 1.6.6 或更高版本。各发行版用户请参考对应安全公告：Debian 用户参照 DSA-128，Red Hat 用户参照 RHSA-2002:071/RHSA-2002:072，Mandrake 用户参照 MDKSA-2002:028。如无法立即升级，建议限制本地用户对 sudo 命令的访问权限作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["redhat"]
title = "Sudo 密码提示堆缓冲区溢出本地提权漏洞"
updated = "2026-06-16T21:56:57.320"

