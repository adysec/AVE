[basic]
description = "tags.<value>blaze-server 是 http4s 框架提供的 HTTP/1.1 服务器实现，存在头字段注入与前端代理绕过漏洞。当应用使用 HTTP/1.1 chunked 传输编码处理请求时，攻击者可在 chunked-body 的 trailer fields 中注入任意头字段（如 X-Forwarded-For、X-Real-IP 或内部认证头）。由于 blaze-server 会将 trailer fields 提升合并到 Request.headers，前端代理原本在请求头部分已清理或去重的头字段可被重新注入，导致基于头字段的信任决策（如客户端 IP 校验、速率限制、审计日志等）被绕过。此外，恶意注入的 Connection: close trailer 也会被服务器处理，可导致后端连接池中的连接被异常终止。该漏洞影响所有使用 BlazeServerBuilder 并以 HTTP/1.1 协议提供服务的 http4s 应用。攻击者无需身份认证，仅需向目标服务器发送构造的包含恶意 trailer fields 的 chunked-body 请求即可利用。攻击条件为：应用部署在前端代理之后，且代理仅对请求头进行了清理而未对 trailer fields 做过滤或拒绝。"
