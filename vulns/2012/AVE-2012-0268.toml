[basic]
description = "WebKit 是 Apple Safari 浏览器使用的核心渲染引擎。CVE-2012-3592 是 Safari 6.0 之前版本中 WebKit 组件存在的一系列内存破坏漏洞，远程攻击者可通过构造恶意网页内容触发该漏洞。未经身份认证的远程攻击者只需诱使用户使用受影响版本的 Safari 浏览器访问包含恶意代码的网页，即可在目标系统上执行任意代码或导致应用程序崩溃，造成拒绝服务。该漏洞影响 Apple Safari 6.0 之前的 macOS 系统以及 iOS 6.0 之前的 iPhone、iPad 和 iPod touch 等移动设备。攻击条件极为简单，仅需用户浏览恶意网页即可触发，无需任何额外交互，因此具有极高的危害性，CVSS v2 评分为 9.3。"
published = "2012-07-25T20:55:01Z"
remediation = "立即将 Apple Safari 升级至 6.0 或更高版本，OS X Lion 升级至 10.7.4，OS X Lion Server 升级至 10.7.4。对于 iOS 设备，升级至 iOS 6.0 或更高版本。如无法立即升级，可临时禁用 WebKit 的 JavaScript 执行或使用其他浏览器替代 Safari，并避免访问不受信任的网站。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:32Z"

