[basic]
description = "Mozilla Firefox 4.x至13.0、Firefox ESR 10.x至10.0.6、Thunderbird 5.0至13.0、Thunderbird ESR 10.x至10.0.6及SeaMonkey 2.11之前版本中的内容安全策略（CSP）功能在生成违规报告时，未正确限制写入blocked-uri参数的字符串内容，导致攻击者可通过构造恶意网页触发CSP违规，将OAuth 2.0访问令牌和OpenID凭证等敏感信息嵌入违规报告并发送至攻击者控制的服务器，造成用户凭证泄露。攻击者只需诱导用户访问恶意网页即可触发该漏洞，无需额外认证，CVSS评分4.3，危害等级中危。"
published = "2012-07-18T10:26:49.093"
remediation = "升级 Firefox 至 14.0 及以上版本，Firefox ESR 升级至 10.0.6 及以上版本，Thunderbird 升级至 14.0 及以上版本，Thunderbird ESR 升级至 10.0.6 及以上版本，SeaMonkey 升级至 2.11 及以上版本。如无法立即升级，可在 Web 服务器端配置 CSP 报告 URI 为受控端点，避免将 violation report 发送到不可信第三方。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 内容安全策略实现信息泄露漏洞"
updated = "2026-06-16T23:40:41.077"

