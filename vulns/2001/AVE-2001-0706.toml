[basic]
description = "Ikonboard 2.1.7b 及更早版本中的 register.cgi 脚本存在代码执行漏洞。未经身份认证的远程攻击者可以通过向 SEND_MAIL 参数提交恶意命令，覆盖程序内部引用待执行程序的变量，从而在目标服务器上执行任意系统命令。该漏洞影响运行 Ikonboard 论坛系统的 Web 服务器，攻击者无需任何凭据即可利用此漏洞获得服务器的完整控制权，可能导致数据泄露、网站被篡改或进一步的内网渗透。"
published = "2001-02-12T05:00:00Z"
remediation = "立即升级 Ikonboard 至已修复该漏洞的补丁版本（2.1.7b fix），或手动修改 register.cgi，将原先遍历所有 CGI 参数的循环改为仅遍历白名单参数（inmembername、password、emailaddress、showemail、homepage、aolname、icqnumber、location、interests、signature、timedifference、useravatar、action），并过滤掉 SEND_MAIL 参数，防止攻击者覆盖内部变量执行任意命令。如无法立即升级，可在 Web 服务器配置中禁用或删除 register.cgi，或通过 ModSecurity 等 Web 应用防火墙拦截包含 SEND_MAIL 参数的请求作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Ikonboard 论坛系统 远程代码执行漏洞"
updated = "2026-06-16T21:53:36Z"

