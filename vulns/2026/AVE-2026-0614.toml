[basic]
description = "Cloudreve 用户搜索接口存在信息泄露漏洞。`GET /api/v4/user/search` 接口对任意登录用户开放，其后端 `SearchActive` 方法仅按邮箱/昵称关键词过滤，但未添加 `StatusActive` 状态谓词，导致已禁用、封禁的非活跃账户也被返回。攻击者只需拥有有效登录会话，使用 2 字符以上关键词即可枚举并获取非活跃用户的邮箱、昵称、头像等个人信息，构成 PII 泄露与用户枚举风险。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级 Cloudreve 至修复版本（≥v4.x 中已添加 `StatusActive` 谓词的 commit），或在 `service/user/info.go` 的 `SearchActive` 函数中手动添加 `Where(user.StatusEQ(user.StatusActive))` 条件过滤非活跃用户；同时修改 `GET /api/v4/user/info/:id` 接口，对非活跃/封禁账号返回匿名级别脱敏数据，并移除搜索接口返回的邮箱字段。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Cloudreve: Information Exposure in `GET /api/v4/user/search`: `SearchActive` omits the active-status predicate, leaking inactive/banned account emails 漏洞"
updated = "2026-01-01T00:00:00Z"

