[basic]
description = 'Lotus Domino Server 5.0.5 的 Web 服务器存在目录遍历漏洞，未经身份认证的远程攻击者可通过在请求路径中使用 ".." 等路径遍历序列，绕过 Web 根目录限制，读取服务器上的任意文件。该漏洞影响运行 Web 服务的 Lotus Domino Server 5.0.x 版本，攻击者无需凭据即可发送特制 HTTP 请求访问敏感系统文件（如配置文件、用户数据等），可能导致信息泄露。CVSS 评分 5.0，危害等级中危。IBM/Lotus 已发布安全更新修复此漏洞，建议升级至修复版本。'
published = "2001-02-12T05:00:00Z"
remediation = '立即将 Lotus Domino Server 升级至 5.0.7 或更高版本以修复此目录遍历漏洞。如短期内无法完成升级，应在 Domino 服务器前的防火墙或反向代理中拦截包含 ".." 和 ".nsf" 的恶意 HTTP 请求路径，并限制 Web 服务仅对必要目录开放读取权限，同时将服务器上的敏感文件（如 notes.ini、password.nsf）移至 Web 根目录之外。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Lotus Domino Server 目录遍历漏洞"
updated = "2026-06-16T21:53:28Z"

