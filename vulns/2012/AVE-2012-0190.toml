[basic]
description = "Oracle MySQL Server 5.5.21 及更早版本中的 Partition 组件存在未指定的安全漏洞。已认证的远程攻击者可通过向 MySQL 数据库服务器发送特制的分区操作请求，利用该漏洞触发拒绝服务条件，导致数据库服务异常终止或无法响应正常查询。该漏洞影响 MySQL 5.5 系列所有低于 5.5.22 的版本，攻击者需拥有数据库的有效登录凭据方可利用，CVSS 评分 4.0，危害等级中低。Oracle 已在 2012 年 4 月的关键补丁更新（CPU）中修复此漏洞，建议用户升级至 MySQL 5.5.22 或更高版本。"
published = "2012-05-03T22:55:02Z"
remediation = "升级 MySQL 至 5.5.22 或更高版本，该版本已修复 Partition 组件的拒绝服务漏洞。如无法立即升级，可在 MySQL 配置中限制受影响用户的 PARTITION 操作权限，或通过防火墙限制数据库服务的访问来源 IP 以降低攻击面。"
score = 4
severity = "MEDIUM"
sources = ["tenable"]
title = "Oracle MySQL Server Partition 拒绝服务漏洞"
updated = "2026-06-16T23:40:07Z"

