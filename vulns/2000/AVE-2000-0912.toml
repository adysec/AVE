[basic]
description = "cyrus-sasl 1.5.24之前版本在Red Hat Linux 7.0中存在授权验证缺陷，本地用户可通过绕过访问限制机制获取未授权的系统资源访问权限。该漏洞源于SASL库对本地用户授权检查不充分，攻击者利用本地账户即可触发，可能导致敏感信息泄露、数据篡改或权限提升。CVSS评分4.6，危害等级中危。"
published = "2000-12-19T05:00:00Z"
remediation = "立即升级 cyrus-sasl 至 1.5.24 或更高版本。Red Hat Linux 7.0 用户应安装 RHSA-2000-094 提供的更新包，可通过 `up2date cyrus-sasl` 命令或从红帽官方渠道下载 RPM 包手动安装。临时缓解措施可限制不可信本地用户对 SASL 认证服务的访问权限。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Red Hat Linux Cyrus SASL 本地用户权限绕过漏洞"
updated = "2026-06-16T21:52:51Z"

