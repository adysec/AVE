[basic]
description = "FreeBSD 在 2000 年 1 月 14 日发布的 SSH 安全补丁中，错误地将 SSH 服务同时绑定到端口 722 和默认的 22 端口。这一配置缺陷导致即使管理员通过防火墙规则过滤了 22 端口，攻击者仍可通过 722 端口绕过访问控制策略，未经授权访问 SSH 服务。该漏洞影响 FreeBSD 系统，远程攻击者无需身份认证即可利用，可能导致信息泄露、权限提升或服务被滥用。"
published = "2000-06-07T04:00:00Z"
remediation = "升级 FreeBSD 至 2000-01-14 之后的安全补丁版本，或重新配置 SSH 服务仅监听端口 22（在 `/etc/ssh/sshd_config` 中设置 `Port 22` 并注释或删除 `Port 722` 行），同时在防火墙层面明确禁止端口 722 的入站流量作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "FreeBSD SSH 安全绕过漏洞"
updated = "2026-06-16T21:51:56Z"

