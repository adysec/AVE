[basic]
description = 'Haakon Nilsen 开发的简单集成发布系统（SIPS）0.2.4 版本之前存在未明确类型的严重安全漏洞，官方标记为"严重安全缺陷"。该漏洞 CVSS 评分 10.0（AV:N/AC:L/Au:N/C:C/I:C/A:C），属网络远程可利用、低攻击复杂度、无需身份认证即可导致机密性/完整性/可用性完全丧失的高危漏洞。具体漏洞原理、攻击向量及影响范围未公开披露，仅知影响 SIPS 0.2.4 之前版本，建议用户立即升级至 0.2.4 或更高版本修复。'
published = "2000-12-31T05:00:00Z"
remediation = "立即将 SIPS 升级至 0.2.4 或更高版本以修复该严重安全缺陷。由于 SIPS 项目已于 2013 年停止维护且存在未明确披露的高危漏洞，建议评估后迁移至现代 PHP 内容管理系统（如 WordPress 或 Flatpress）并启用安全配置。如短期内无法替换，应在 Web 服务器前端部署 WAF 规则过滤恶意请求，并严格限制 SIPS 目录的读写权限与远程访问来源，以降低被远程利用的风险。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Haakon Nilsen SIPS 未指定漏洞"
updated = "2026-06-16T21:53:26Z"

