[basic]
description = "KDE 2 及 KDE 3.x 至 3.0.5 版本存在命令注入漏洞，当处理 URL、文件名或电子邮件地址时，未对插入 shell 命令的参数进行正确转义处理，远程攻击者可通过构造特制的恶意链接或文件名，诱使用户点击触发命令执行，导致任意代码执行。该漏洞影响 KDE 2 全系列及 KDE 3.0.5 及更早版本，CVSS 评分 7.5，危害等级高。"
published = "2003-01-17T05:00:00Z"
remediation = "KDE 3.0 用户应立即升级至 KDE 3.0.5a 版本（下载地址 http://download.kde.org/stable/3.0.5a/）；KDE 2.2.2 用户应从 KDE FTP 服务器（ftp://ftp.kde.org/pub/kde/security_patches/）获取并应用 kdelibs、kdebase 等组件的安全补丁。各 Linux 发行版用户应安装对应安全更新：Debian 安装 DSA-234~243 系列更新，Red Hat 安装 RHSA-2003:002/003 更新，Mandriva 安装 MDKSA-2003:004 更新。临时缓解措施可限制不可信来源的 URL、文件名和邮件地址传入 KDE 组件。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "KDE KDE 2/3.x 远程代码执行漏洞"
updated = "2026-06-16T21:59:14Z"

