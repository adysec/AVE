[basic]
description = "Lantronix SecureLinx Spider（SLS）2.2及以上版本存在跨站脚本漏洞（XSS/CWE-79），攻击者可在auth.asp登录页面注入恶意脚本代码。未经身份认证的远程攻击者可通过构造含恶意JavaScript的URL诱导管理员访问，在浏览器中执行任意脚本，窃取会话令牌或凭据。该漏洞影响运行SSL/TLS加密Web管理界面的Lantronix设备，CVSS评分为6.1，中等危害。"
published = "2019-05-02T20:29:00Z"
remediation = "升级到 Lantronix SecureLinx Spider 固件 2.2 或更高版本，该版本已修复 auth.asp 登录页面中 nickname 参数的 XSS 漏洞。如无法立即升级，可在 Web 服务器或反向代理层部署 WAF 规则，拦截对 auth.asp 页面中 nickname 参数的恶意脚本输入，作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Lantronix SecureLinx Spider 跨站脚本漏洞"
updated = "2026-06-17T01:33:56Z"

