[basic]
description = "Apache Airflow 的 Experimental API 默认配置存在认证缺失漏洞。该 API 在默认配置下允许所有 API 请求无需任何身份认证即可直接访问，远程未经认证的攻击者可利用此缺陷通过发送特制 HTTP 请求直接调用 Experimental API 接口，实现未授权访问敏感数据、执行任意 DAG 任务甚至远程代码执行。该漏洞影响 Apache Airflow 1.10.11 之前的所有版本，CVSS 评分 9.8，危害等级严重。官方已在 Airflow 1.10.11 版本中将默认配置修改为拒绝所有未认证请求，用户需手动配置 `[api]auth_backend = airflow.api.auth.backend.deny_all` 以修复此漏洞。"
published = "2020-11-10T16:15:11.807"
remediation = "建议升级至 Apache Airflow 1.10.11 或更高版本（新版本默认已禁止未经认证的 Experimental API 访问）。对于已有安装，需手动修改 airflow.cfg 配置文件，在 [api] 段下设置 auth_backend = airflow.api.auth.backend.deny_all，并重启 Airflow 服务使配置生效；若业务需要开放接口，可配置为 airflow.api.auth.backend.basic_auth 并启用密码认证。此外，应在防火墙或反向代理层面仅允许可信来源访问 Experimental API（/api/experimental/）端口，并启用 TLS 加密传输，作为无法立即升级时的临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Apache Airflow Experimental API 未授权访问漏洞"
updated = "2026-06-17T02:53:54.840"

