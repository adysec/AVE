[basic]
description = 'Apple Safari 5.1.4 之前版本中的 WebKit 组件未正确实现"阻止来自第三方和广告商的 Cookie"功能，导致远程攻击者可通过设置 Cookie 绕过隐私设置，从而追踪用户浏览行为。该漏洞允许第三方网站在用户配置 Safari 阻止 Cookie 的情况下仍然设置并读取 Cookie，造成用户隐私信息泄露。攻击者只需诱导用户访问恶意网站即可利用此漏洞，无需其他特殊权限。CVSS 评分 5.0，危害等级中危。'
published = "2012-03-12T21:55:00.933"
remediation = '升级 Apple Safari 至 5.1.4 或更高版本，该版本修复了 WebKit 中第三方 Cookie 阻止功能实现不当的问题。如无法立即升级，可在浏览器隐私设置中手动启用"阻止所有 Cookie"作为临时缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari WebKit Cookie阻止绕过漏洞"
updated = "2026-06-16T23:37:59.543"

