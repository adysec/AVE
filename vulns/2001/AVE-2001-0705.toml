[basic]
description = "Simple Server HTTPd 1.0（原 Free Java Server）存在目录遍历漏洞。远程攻击者无需身份认证，通过在 URL 中插入 ..（点号）路径遍历序列，即可突破 Web 服务器的目录访问限制，读取服务器文件系统中的任意文件内容。该漏洞影响运行 Simple Server HTTPd 1.0 的所有系统，攻击者可利用此漏洞获取敏感配置文件、密码文件等系统文件，造成信息泄露。由于漏洞利用简单、无需认证且攻击可远程发起，存在较大安全风险。"
published = "2001-05-03T04:00:00Z"
remediation = '由于 Simple Server HTTPd 1.0（原 Free Java Server）已停止维护且无官方补丁，建议立即迁移至仍在维护的替代 HTTP 服务器，如 Apache httpd 2.4.x 或 nginx 1.x。如短期内无法完成迁移，应在反向代理或边界防火墙层配置规则，拦截所有包含 ".."（双点）路径的 HTTP 请求，同时将该服务器仅绑定至内部网络接口监听，禁止直接对外暴露，直至完成替换。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Simple Server HTTPd 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:54:03Z"

