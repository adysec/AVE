[basic]
description = "Darxite 0.4 及更早版本的登录功能存在缓冲区溢出漏洞。远程攻击者可通过向登录界面提交超长的用户名或密码数据，触发缓冲区溢出，导致任意代码执行。该漏洞无需身份认证即可利用，攻击者可直接获取目标系统控制权。CVSS 评分 7.5，危害等级高。目前已有公开的 Exploit-DB 利用代码，建议用户立即升级至最新版本或停止使用该软件。"
published = "2000-11-14T05:00:00.000"
