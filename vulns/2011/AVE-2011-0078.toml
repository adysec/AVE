[basic]
description = "Adobe Flash Player在处理特定SWF文件时存在内存破坏漏洞，攻击者可通过诱导用户访问恶意网页或打开特制文件触发该漏洞。由于Flash Player对用户输入数据边界检查不充分，导致内存越界读写，成功利用可在受影响系统上以当前用户权限执行任意代码，或导致应用程序崩溃拒绝服务。该漏洞影响Windows、Mac OS X、Linux、Solaris及Android平台上的Flash Player 10.3.183.5之前版本，CVSS评分10.0，危害等级严重。Adobe已在安全公告APSB11-21中发布修复版本。"
published = "2011-08-10T22:55:00Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.5 及以上版本（Windows/Mac/Linux）或 10.3.186.3 及以上版本（Android），Adobe AIR 升级至 2.7.1 及以上版本。由于 Adobe Flash Player 已于 2020 年底停止支持并终止安全更新，建议彻底卸载 Flash Player 并迁移至 HTML5 标准，同时在浏览器中禁用 Flash 插件以防止后续漏洞利用。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:30:45Z"

