[basic]
description = 'Apache Shiro 1.2.4 及之前版本存在反序列化远程代码执行漏洞。由于 Shiro 的 "remember me" 功能在未配置自定义密钥时使用硬编码的默认密钥对 Cookie 进行加密和反序列化处理，远程攻击者无需身份认证即可通过构造特制的 rememberMe Cookie 参数触发 Java 反序列化，从而在目标服务器上执行任意代码。攻击者只需知道默认密钥（已知公开），即可利用 ysoserial 等工具生成恶意序列化 payload 并发送至目标系统。该漏洞影响所有使用 Apache Shiro <= 1.2.4 且未修改默认密钥的应用系统，CVSS 评分 9.8，危害等级严重。官方已在 1.2.5 版本中修复此问题，要求用户必须配置自定义密钥。'
published = "2016-06-07T14:06:13Z"
remediation = "立即升级 Apache Shiro 至 1.2.5 或更高版本。如无法升级，在 shiro.ini 或 Spring 配置中为 rememberMe 功能设置自定义 cipherKey（通过 securityManager.setRememberMeManager().setCipherKey() 配置），避免使用默认密钥。同时可在 WAF 层对 Cookie 中 rememberMe 字段的 base64 解码内容进行反序列化攻击特征检测与拦截。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Apache Shiro 默认密钥致远程代码执行漏洞"
updated = "2026-06-17T00:47:33Z"

