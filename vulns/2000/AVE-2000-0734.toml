[basic]
description = "eXtropia WebStore 1.0 和 2.0 版本的 html_web_store.cgi 及 web_store.cgi CGI 程序存在目录遍历漏洞，远程攻击者可通过向 page 参数传递 `../` 序列绕过路径限制，读取服务器上的任意文件。该漏洞影响 eXtropia WebStore 系列产品，攻击者无需身份认证即可利用，可能导致敏感信息泄露（如配置文件、密码文件等）。由于 CGI 程序未对用户输入的路径参数进行充分过滤，攻击者只需构造特制的 HTTP 请求即可触发。"
published = "2000-12-11T05:00:00.000"
remediation = "建议立即升级到 eXtropia 官方发布的最新安全版本；如产品已停止维护无法获取补丁，应迁移至其他受支持的购物车系统。临时缓解措施可在 Web 服务器（如 Apache）层面配置 mod_rewrite 规则，对 CGI 目录的 page 参数进行路径规范化过滤，限制 `../` 序列的传入，并实施最小权限原则限制 Web 服务器进程对文件系统的访问范围。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "eXtropia WebStore 1.0/2.0 目录遍历漏洞"
updated = "2026-06-16T21:52:57.310"

