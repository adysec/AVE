[basic]
description = "Google Chrome 浏览器所依赖的 libxml2 库中存在双重释放漏洞（CWE-415）。当浏览器解析包含特制 XPath 表达式的网页内容时，libxml2 组件对 XML 数据的处理过程中出现内存管理错误，导致同一块内存被多次释放。远程攻击者无需任何身份认证，只需向目标用户发送一个包含恶意构建 XPath 表达式的网页链接，诱使用户使用受影响版本的 Google Chrome 浏览器访问该页面，即可触发此漏洞。成功利用后可能导致应用程序崩溃（拒绝服务），在特定条件下还可能实现任意代码执行，完全控制用户系统。该漏洞影响 Google Chrome 13.0.782.215 之前的所有版本，同时影响苹果 iOS 6.0 之前版本、Mac OS X 10.7.4 之前版本以及 Debian Linux、Red Hat Enterprise Linux 等主流操作系统。CVSS v2 评分为 7.5（高危），网络攻击向量、低攻击复杂度、无需认证即可利用，对机密性、完整性和可用性均可能造成严重影响。"
published = "2011-08-29T15:55:01Z"
remediation = "立即升级 Google Chrome 浏览器至 13.0.782.215 或更高版本，该版本修复了 libxml2 库中的双重释放漏洞。如无法立即更新，可禁用浏览器中的 JavaScript 执行作为临时缓解措施，因为该漏洞需要通过构造的 XPath 表达式触发。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome libxml2 双重释放远程拒绝服务漏洞"
updated = "2026-06-16T23:32:03Z"

