[basic]
description = "GNU elfutils 0.192 版本的 eu-strip 组件在 strip.c 文件的 gelf_getsymshndx 函数中存在缺陷。攻击者可通过构造特制的 ELF 文件，在具有本地访问权限的情况下触发该函数处理符号表索引时的异常，导致程序崩溃并引发拒绝服务（DoS）攻击。该漏洞影响 GNU elfutils 0.192 及相关发行版，攻击条件为目标系统处理恶意伪造的二进制文件。建议尽快应用官方补丁（patch id: fbf1df9ca286de3323ae541973b08449f8d03aba）以修复此漏洞。"
published = "2025-02-17T05:15:10Z"
remediation = "建议将 GNU elfutils 升级至已修复该漏洞的最新版本。对于源码安装的用户，请手动应用补丁 fbf1df9ca286de3323ae541973b08449f8d03aba；对于使用发行版（如 SUSE, Ubuntu）的用户，请通过系统包管理器更新 elfutils 软件包至最新补丁版本。"
score = 4.8
severity = "MEDIUM"
sources = ["msrc"]
title = "GNU elfutils eu-strip 拒绝服务漏洞"
updated = "2026-06-17T08:39:01Z"

