[basic]
description = "SSH 1.5 版本协议（包括 OpenSSH 2.3.0 及以下版本、AppGate、ssh-1 1.2.31 及以下版本）在特定配置下使用 PKCS#1 1.5 填充方案加密通信。远程攻击者可通过 Bleichenbacher 选择密文攻击（针对 RSA 的适应性选择密文攻击），向目标 SSH 服务发送大量精心构造的密文，利用服务端返回的错误信息反馈逐步推断出会话密钥或原始明文，从而实现对 SSH 加密流量的解密或篡改。攻击者需要能够拦截目标主机与客户端之间的加密流量，且目标 SSH 服务必须配置为使用易受攻击的 PKCS#1 v1.5 填充方案。成功利用后可导致敏感数据泄露或会话劫持。该漏洞影响 OpenSSH、AppGate 及 ssh-1 等主流 SSH 实现，CVSS v2 评分 5.0，危害等级中危。相关厂商已在后续版本中修复此问题。"
published = "2001-06-27T04:00:00Z"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
score = 4
severity = "MEDIUM"
sources = ["cve"]
title = "OpenSSH SSH 加密流量解密漏洞"
updated = "2026-06-16T21:54:09Z"

