[basic]
description = "Lorex 2K Indoor Wi-Fi Security Camera 的 sonia 二进制程序在解析 JSON 请求时存在格式化字符串漏洞，由于未对用户提供的字符串进行有效验证便直接用作格式化字符串参数，导致远程代码执行。网络相邻且未经验证的攻击者可利用该漏洞以 root 权限执行任意代码，完全控制受影响设备。该漏洞影响 Lorex 2K Indoor Wi-Fi Security Camera 系列产品，CVSS 评分 7.5，危害等级高。"
published = "2026-07-13T22:16:45Z"
remediation = "立即联系 Lorex 技术支持确认是否有针对 sonia 二进制格式串漏洞的固件更新，并将摄像头固件升级至最新版本。如暂无补丁，在防火墙上设置 ACL 规则，仅允许受信任的管理设备访问摄像头 IP 的 Web 管理端口，禁止来自非信任网段的连接。同时将摄像头部署在独立 VLAN 中，与核心业务网络隔离，限制网络邻接攻击者的可达路径。若短期内无法升级，建议在摄像头 Web 管理界面中禁用不必要的 JSON API 功能（如设备发现、远程配置接口），并修改默认管理员密码。"
score = 7.5
severity = "HIGH"
sources = ["zdi"]
title = "Lorex 2K Indoor Wi-Fi Security Camera 格式字符串远程代码执行漏洞"
updated = "2026-07-14T16:45:45Z"

