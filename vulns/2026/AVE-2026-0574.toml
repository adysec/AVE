[basic]
description = "Cloudreve 自托管文件管理系统存在 OAuth 访问令牌绕过范围强制执行漏洞。漏洞原理是 OAuth 访问令牌在签发时缺失 `client_id` 声明，导致 JWT 验证器未将令牌作用域加载至请求上下文，使得 `RequiredScopes(...)` 中间件误判为无作用域的第一方会话认证而跳过作用域检查。影响范围为 Cloudreve 4.12.0 至 4.16.1 版本，已在 4.16.1 修复。攻击条件为攻击者需持有合法用户的低权限 OAuth 访问令牌（如仅授权 `openid` 作用域），利用方式为攻击者使用该令牌作为 Bearer Token 调用需高权限作用域的 API（如文件读写、分享管理、工作流、用户设置、WebDAV 账户、管理员接口），因作用域检查被绕过而成功访问或篡改敏感资源，管理员账号甚至可触及管理员级 API。CVSS 评分 7.6（HIGH），攻击向量为网络，攻击复杂度低，需低权限和用户交互，机密性与完整性影响高，可用性影响低。CVE-2026-54560 对应 CWE-863（错误的授权）。"
published = "2026-07-15T15:16:44Z"
remediation = "建议立即升级 Cloudreve 到 4.16.1 或更高版本（下载地址：https://github.com/cloudreve/cloudreve/releases/tag/4.16.1）。升级前请备份数据库和配置文件，按官方文档执行升级步骤。若暂时无法升级，可在管理后台禁用 OAuth 功能或删除所有 OAuth 客户端配置作为临时缓解措施，并限制管理员账号进行 OAuth 授权。"
score = 7.6
severity = "HIGH"
sources = ["ghsa"]
title = "Cloudreve Cloudreve OAuth 权限绕过漏洞"
updated = "2026-07-15T18:15:13Z"

