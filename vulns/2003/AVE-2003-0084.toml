[basic]
description = "gzip 软件包中的 znew 工具在处理压缩文件时未对临时文件的创建进行充分的安全检查，存在符号链接攻击漏洞。本地攻击者可通过在目标系统上创建恶意的符号链接指向系统任意文件，当 root 用户或其他用户执行 znew 命令时，程序会以当前用户权限覆盖被链接的目标文件，导致任意文件写入。该漏洞影响多个 Linux 发行版，攻击者需具有本地访问权限，CVSS 评分 2.1，危害等级低。"
published = "2003-07-02T04:00:00Z"
remediation = "升级 gzip 到 ≥1.4.0 版本，该版本修复了 znew 工具中临时文件的 symlink 攻击漏洞。如无法立即升级，可使用 `gzip -S` 选项指定安全临时文件前缀，或在/tmp 中使用具有安全权限的临时目录。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "GNU gzip znew 任意文件写入漏洞"
updated = "2026-06-16T22:02:04Z"

