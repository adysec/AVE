[basic]
description = "I-gear 3.5.7 及更早版本在日志处理中存在输入验证缺陷，当 URL 长度超过 255 个字符时，程序未能正确截断或过滤超长输入，导致日志记录功能异常。远程攻击者可通过向目标系统发送包含超长 URL 的 HTTP 请求触发此漏洞，造成报表系统生成错误数据或日志解析失败，影响系统监控与审计功能的正常使用。该漏洞攻击复杂度低，无需身份认证即可远程利用。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级 I-gear 至 3.5.7 以上版本（如 3.6 或更高），该漏洞已在后续版本中修复。由于 I-gear 产品已停止维护多年，建议迁移至受支持的 Web 内容过滤方案（如 Symantec Web Security Service 或其他现代 URL 过滤产品）。如短期内无法替换，可在 Web 服务器或反向代理层限制请求 URL 长度不超过 255 字符，以缓解日志处理异常导致的报表错误。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "I-gear I-gear 日志URL超长处理不当拒绝服务漏洞"
updated = "2026-06-16T21:52:57Z"

