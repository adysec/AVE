[basic]
description = 'Microsoft Windows NT 4.0 操作系统的 Winsock2ProtocolCatalogMutex 互斥体对象因权限配置不当而存在安全漏洞，该互斥体被赋予了 Everyone 组的完全控制权限。具有本地登录权限的低权限攻击者可将该互斥体的权限修改为 "No Access"，从而阻止 Winsock 网络服务正常工作，导致系统网络连接完全中断并引发拒绝服务。该漏洞影响 Windows NT 4.0 及其所有后续补丁版本，攻击者需具备本地交互式登录权限方可利用此漏洞。漏洞利用条件简单，攻击者只需通过修改互斥体访问控制列表即可禁用系统的网络通信能力。根据 CVSS 3.1 评分体系，该漏洞评分为 7.1（高危），本地攻击复杂度低，无需用户交互，对系统可用性和完整性造成严重影响。Microsoft 已发布 MS01-011 安全公告及对应补丁程序修复此权限配置问题。'
published = "2001-02-12T05:00:00Z"
remediation = "建议立即安装 Microsoft 安全公告 MS01-003 补丁（KB279336），升级至 Windows NT 4.0 Service Pack 7 或安装对应安全更新程序，修复 Winsock2ProtocolCatalogMutex 的访问权限配置。如无法立即安装补丁，应在服务器安全策略中撤销未授权用户的交互式登录权限，限制本地登录账户范围，仅允许管理员和系统账户访问该互斥体，以阻止本地用户修改对象权限导致网络连接中断。"
score = 7.1
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Windows NT 4.0 Winsock 互斥体拒绝服务漏洞"
updated = "2026-06-16T21:53:28Z"

