[basic]
description = "FreeBSD 3.5.1 和 4.2 系统 ports 包中的 ja-xklock 2.7.1 及更早版本存在缓冲区溢出漏洞。本地攻击者无需身份认证即可利用该漏洞，通过向 xklock 程序发送特制输入触发缓冲区溢出，进而获取 root 权限。该漏洞影响 FreeBSD 操作系统的本地安全边界，成功利用后攻击者可完全控制系统，CVSS 评分 7.2，危害等级高。"
published = "2001-06-02T04:00:00Z"
remediation = "建议立即将 ja-xklock 升级至 2.7.2 或更高版本以修复缓冲区溢出漏洞。如当前 ports 树中已无可用更新包，可通过 portsnap fetch && portsnap update 更新 ports 索引后重新安装。临时缓解措施：以 root 身份执行 chmod -s /usr/local/bin/xklock 移除 setuid 权限位，阻止普通用户利用该漏洞获取 root 权限。如仍无法修复，建议卸载 ja-xklock 并改用 xlockmore 等替代屏幕锁定程序，同时升级 FreeBSD 系统至仍在支持周期的稳定版本。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "FreeBSD xklock 本地缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:53:54Z"

