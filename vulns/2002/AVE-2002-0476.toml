[basic]
description = "Wolfram Research webMathematica 1.0.0 及 1.0.0.1 版本存在目录遍历漏洞，远程攻击者可通过向 MSPStoreID 参数传递 `..`（点点）序列绕过路径限制，读取服务器上的任意文件。该漏洞无需身份认证即可利用，攻击复杂度低，可导致敏感信息泄露（如配置文件、源代码等），影响系统机密性。"
published = "2002-10-04T04:00:00Z"
remediation = '升级 Wolfram Research webMathematica 至最新版本（若厂商已停止支持则迁移至替代方案）。在 Web 服务器或应用层对 MSPStoreID 参数进行严格输入过滤，禁止包含 `../` 或 `..\` 等目录遍历序列，仅允许白名单内的合法 StoreID 值。同时配置 Web 服务器（如 Apache/Tomcat）的访问控制，限制应用进程对敏感系统文件（如 /etc/passwd）的读取权限，并启用 chroot 或容器化隔离运行环境。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Wolfram Research webMathematica 目录遍历漏洞"
updated = "2026-06-16T21:58:24Z"

