[basic]
description = "Icecast 1.3.11 及更早版本中的 AVLLib 组件存在缓冲区溢出漏洞。远程攻击者可通过向目标 Icecast 服务器发送特制的超长 HTTP GET 请求（伪装为 MP3 客户端请求）触发该漏洞，导致缓冲区溢出，进而实现远程代码执行。攻击者无需身份认证即可利用此漏洞，成功利用后可完全控制目标服务器，窃取敏感信息、植入后门或发起进一步攻击。该漏洞影响 Icecast 1.3.11 及之前所有版本，CVSS 评分 7.5，危害等级高。"
published = "2002-04-22T04:00:00.000"
remediation = "升级 Icecast 至 1.3.12 或更高版本以修复 AVLLib 缓冲区溢出漏洞。如无法升级，在 Web 服务器或防火墙层面限制对 Icecast 服务的 HTTP GET 请求长度，并限制仅允许可信 IP 访问 8000 端口。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Xiph Icecast 缓冲区溢出漏洞"
updated = "2026-06-16T21:56:56.720"

