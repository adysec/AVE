[basic]
description = "Internet Explorer 脚本引擎在处理内存中对象时存在内存损坏漏洞。远程攻击者可构造特制网站诱导用户访问，触发该漏洞导致远程代码执行。攻击者成功利用后可获取与当前用户相同的权限，安装程序、查看/更改/删除数据或创建新账户。该漏洞影响 Internet Explorer 11 及更早版本，CVSS 评分 7.5，危害等级高。Microsoft 已在 2020 年 4 月安全更新中修复此漏洞。"
published = "2020-04-15T15:15:18Z"
remediation = "立即安装 Microsoft 2020 年 4 月安全更新（Internet Explorer 累积更新 KB4550951 及对应 Windows 版本的补丁），可通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），建议优先修复。如无法立即打补丁，可配置组策略禁用 Internet Explorer 中的 JScript 脚本引擎，或使用 Microsoft 提供的缓解工具（EMET/Windows Defender Exploit Guard）启用内存保护机制作为临时措施。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Internet Explorer 脚本引擎内存损坏漏洞"
updated = "2026-06-17T02:47:06Z"

