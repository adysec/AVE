[basic]
description = "Koha 图书馆管理系统存在目录遍历漏洞，远程攻击者无需身份认证即可通过向 `svc/virtualshelves/search` 或 `svc/members/search` 接口的 `template_path` 参数传入 `..%2f`（URL 编码的路径遍历序列）绕过路径限制，实现任意文件读取。该漏洞影响 Koha 3.14.x 至 3.20.1 之间的多个版本，CVSS 评分 7.5，危害等级高，可导致敏感配置文件、数据库凭据等关键信息泄露。"
published = "2018-10-18T21:29:01.333"
remediation = "升级 Koha 至 3.14.16、3.16.12、3.18.08 或 3.20.1 及以上版本，该漏洞已在上述版本中修复。如无法立即升级，可在 Web 服务器（如 Apache/Nginx）层面添加规则，对 `template_path` 参数中的 `..%2f` 及路径遍历字符进行拦截过滤，并限制 `/svc/` 路径的访问权限。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Koha 目录遍历任意文件读取漏洞"
updated = "2026-06-17T00:27:38.180"

