[basic]
description = "Leif M. Wright 开发的 ad.cgi 1.0 CGI 程序存在命令注入漏洞，由于未对用户提供的 file 参数进行充分过滤和验证，远程攻击者可在该参数中注入 shell 元字符（如分号、管道符、反引号等），从而在目标服务器上执行任意操作系统命令。该漏洞利用门槛极低，攻击者无需身份认证即可通过网络远程发起利用，完全控制受影响系统。CVSS 评分高达 10.0，危害等级严重。建议升级至安全版本或移除该 CGI 程序。"
published = "2001-02-12T05:00:00Z"
remediation = "Leif M. Wright 的 ad.cgi 1.0 为已被弃用的免费广告轮换 CGI 脚本，官方从未发布修复版本，因此无法通过版本升级消除此漏洞。建议立即从 Web 服务器上彻底移除 ad.cgi 脚本及其关联文件，改用其他经过安全审计且仍在维护的广告管理系统替代。如短期内无法下线，应在 Web 服务器配置（如 Apache .htaccess 或 Nginx 配置）中拒绝对外提供 ad.cgi 的访问，同时对 file 参数实施严格的输入验证，仅允许包含字母数字和下划线字符，并过滤所有 shell 元字符（如分号、管道符、反引号、$() 等），同时限制 CGI 脚本的运行权限，确保其以最小权限账户执行，禁止访问敏感系统文件和目录。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Leif M. Wright ad.cgi 远程命令执行漏洞"
updated = "2026-06-16T21:53:30Z"

