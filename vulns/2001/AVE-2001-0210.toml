[basic]
description = "ISC BIND 4 和 BIND 8 版本存在内存信息泄漏漏洞。远程攻击者无需身份认证即可向目标 DNS 服务器发送特制查询请求，触发服务端在响应中泄露内存中的敏感信息（如环境变量、进程数据等）。该漏洞影响广泛部署的 BIND 4.x 和 8.x 版本 DNS 服务器，攻击复杂度低且无需交互，成功利用可导致服务器机密信息外泄，为后续攻击提供辅助信息。"
published = "2001-02-12T05:00:00Z"
remediation = "立即升级 ISC BIND 至 8.2.3 或更高版本（建议直接迁移至当前维护的 BIND 9.18/9.20 分支）。如暂时无法升级，可通过防火墙限制 DNS 服务端口（UDP/TCP 53）仅允许可信网段访问，并禁用不必要的反向查询功能。BIND 4.x 和 8.1-8.2.2 预发布版本均受影响，建议尽快完成版本迁移以彻底修复此内存信息泄漏漏洞。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "ISC BIND 远程内存信息泄漏漏洞"
updated = "2026-06-16T21:53:29Z"

