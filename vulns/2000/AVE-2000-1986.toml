[basic]
description = "Poll It 2.0 的 pollit.cgi 脚本存在命令注入漏洞，远程攻击者无需身份认证即可通过向 poll_options 参数中注入 shell 元字符（如管道符、分号等）执行任意系统命令。该漏洞影响 Poll It 2.0 及可能更早版本，CVSS 评分 10.0，可导致服务器完全失陷，攻击者能够获取敏感数据、篡改页面内容或以此为跳板攻击内网。利用方式简单，仅需构造特制 HTTP 请求即可触发。"
published = "2000-12-11T05:00:00Z"
remediation = "立即停止使用 Poll It 2.0 的 pollit.cgi 脚本，该软件已停止维护且厂商网站已不可访问。最佳方案是彻底删除 pollit.cgi 或将其从 Web 服务器中移除。如必须保留使用，需在 pollit.cgi 中对 poll_options 参数做严格的输入过滤，禁止 shell 元字符（如 ; | & ` $ ( ) { } < >），或改用 CGI.pm 的 escapeHTML 函数对用户输入进行编码后再传递给后端处理。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Poll It 2.0 pollit.cgi 远程命令执行漏洞"
updated = "2026-06-16T21:53:05Z"

