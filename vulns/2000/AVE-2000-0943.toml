[basic]
description = "iputils 网络工具包中的 ping 程序存在缓冲区溢出漏洞。在 20001010 版本之前的 iputils 中，ping 工具的 outpack 和 buf 变量存在缓冲区溢出缺陷，攻击者可利用此漏洞实现权限提升。该漏洞影响 Red Hat Linux 6.2 至 7J 等多个操作系统发行版，攻击者需要具备目标系统的本地访问权限，通过向 ping 程序输入超长参数触发缓冲区溢出，从而覆盖堆栈上的返回地址，进而执行任意代码或提升自身权限至更高特权级别。由于该漏洞仅需本地账户即可利用，且无需身份认证，因此对多用户系统构成潜在安全风险，CVSS 评分 4.6。"
published = "2000-10-18T04:00:00Z"
remediation = "将 iputils 升级至 2000-10-10 或更高版本以修复 ping 中 outpack 和 buf 变量的缓冲区溢出。Red Hat Linux 用户应安装 RHSA-2000:087 安全更新（适用于 Red Hat Linux 6.2 至 7J）。如暂无法立即升级，可临时通过文件系统权限限制普通用户执行 ping 命令，仅允许 root 或授权用户运行，以降低本地提权风险。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Linux iputils 缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:53:23Z"

