[basic]
description = "Apple iOS 5.1 之前版本、iTunes 10.6 之前版本以及 Safari 5.1.4 之前版本所使用的 WebKit 中存在内存破坏漏洞（CWE-119）。远程攻击者可诱导用户访问特制网站，触发 WebKit 内存处理逻辑缺陷，导致内存损坏，成功利用可实现任意代码执行或造成拒绝服务（应用崩溃）。该漏洞无需身份认证，攻击复杂度较低，CVSS 评分 9.3，危害严重。Apple 已于 2012 年 3 月发布安全更新修复此漏洞。"
published = "2012-03-08T22:55:02Z"
remediation = "将 Safari 升级至 5.1.4 或更高版本，将 iOS 升级至 5.1 或更高版本，将 iTunes 升级至 10.6 或更高版本。Apple 已于 2012 年 3 月发布安全更新（APPLE-SA-2012-03-07），可通过 iTunes 或 iOS 设备 OTA 更新获取。如无法立即升级，可禁用 JavaScript 作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:53Z"

