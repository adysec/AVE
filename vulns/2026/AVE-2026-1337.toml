[basic]
description = "Flowise 是一个用于构建 AI 应用的低代码平台，其多个自定义工具组件（AgentAsTool、ChatflowTool 和 ExecuteFlow）在 vm2 沙箱内执行用户自定义 JavaScript 代码。然而，这些组件在构建脚本时直接将用户可控的 baseURL 值拼接进 JavaScript 源代码，而 isValidURL 校验未阻止 URL 哈希片段中的特殊字符。已认证攻击者可通过构造包含代码注入的 baseURL，闭合字符串后注入任意 JavaScript 代码，利用 vm2 沙箱与 Flowise 在同一 Node.js 进程中执行且暴露危险依赖的特性，最终绕过沙箱限制在服务器上执行任意代码，获得与 Flowise 进程用户等同的权限。该漏洞影响 Flowise 3.1.1 及之前版本，攻击者只需拥有有效用户会话即可利用。"
published = "2026-08-04T16:16:29Z"
remediation = '立即将 Flowise 升级至 3.1.3 或更高版本，该版本已移除对不安全 vm2 沙箱的依赖并修复了 baseURL 代码注入漏洞。如暂时无法升级，应在流量入口处通过防火墙或 WAF 拦截包含 `#";\n` 等注入特征的请求，同时禁用 AgentAsTool、ChatflowTool 和 ExecuteFlow 节点中对 vm2 沙箱的使用，并将 `useSandbox` 设为 `false` 的组件切换至 E2B 沙箱或 isolated-vm 替代方案，以降低被利用风险。'
score = 9
severity = "CRITICAL"
sources = ["ghsa"]
title = "FlowiseAI Flowise vm2 沙箱逃逸远程代码执行漏洞"
updated = "2026-08-05T16:17:01Z"

