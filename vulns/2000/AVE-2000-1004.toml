[basic]
description = 'PhotoAlbum 0.9.9 版本之前的 getalbum.php 存在目录遍历漏洞，远程未认证攻击者可通过构造包含 ".." 序列的请求参数，利用目录遍历漏洞读取服务器上任意文件内容。该漏洞影响 PhotoAlbum 0.9.9 之前版本，攻击者无需身份认证即可通过网络远程利用，仅需构造包含目录遍历序列的恶意请求参数即可读取服务器敏感文件，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:P/I:N/A:N），主要影响机密性。官方已在 0.9.9 版本修复该漏洞，建议升级至 0.9.9 或更高版本。'
published = "2000-12-19T05:00:00.000"
remediation = "建议立即升级到 PhotoAlbum 0.9.9 或更高版本，应用官方安全补丁以修复 getalbum.php 中的目录穿越漏洞。可选的临时缓解措施包括在 Web 服务器配置中禁用对包含 .. 路径的访问，或限制 PHP 文件的操作权限至 albums 目录。升级是彻底解决该漏洞的最有效方法，建议立即实施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "phpphotoalbum 任意文件读取漏洞"
updated = "2026-06-16T21:52:43.583"

