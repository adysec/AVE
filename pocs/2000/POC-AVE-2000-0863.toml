[info]
author = "ave"
description = "验证 dbconnect.inc 文件是否泄露在 Web 根目录下，导致远程攻击者可获取管理员数据库密码等敏感信息。"
id = "POC-AVE-2000-0863"
name = "PCCS MySQLDatabase Admin Tool Manager 信息泄露验证"
severity = "high"
tags = ["ave-2000-0863"]
vuln_id = [
    "CVE-2000-0707",
    "AVE-2000-0863",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/dbconnect.inc"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "mysql",
    "password",
]
