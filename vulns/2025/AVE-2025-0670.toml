[basic]
description = "Windows Secure Boot 安全功能存在绕过漏洞，具有物理访问权限的攻击者可通过在系统启动过程中加载未签名的恶意引导程序，绕过 Secure Boot 的安全验证机制，从而在目标系统上执行未授权的代码并获取高权限控制。该漏洞影响多个 Windows 版本，CVSS 评分 6.8，危害等级中等。Microsoft 已在 2025 年 1 月安全更新中发布补丁修复此漏洞。"
published = "2025-01-14T18:15:32Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新（KB5049981），通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。受影响版本包括 Windows 10/11 及 Windows Server 多版本，更新后对应版本号：Win10 1507 需 ≥10.0.10240.20890，Win10 22H2 需 ≥10.0.19045.5371，Win11 24H2 需 ≥10.0.26100.2894，Server 2022 需 ≥10.0.20348.3091。如无法立即打补丁，建议在 UEFI 固件设置中启用 Secure Boot 并确保平台密钥（PK）为最新，同时限制物理访问以防止本地利用。"
score = 6.8
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows Secure Boot 安全功能绕过漏洞"
updated = "2026-06-17T08:42:46Z"

