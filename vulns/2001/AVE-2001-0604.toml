[basic]
description = "nCipher硬件安全模块的swinit组件存在安全配置缺陷，即使在用户明确禁用Operator Card Set恢复功能的情况下，该组件仍未能正确关闭此功能。攻击者可利用该缺陷绕过密钥保护机制，获取nCipher设备中存储的应用密钥，从而危及加密系统的机密性。该漏洞影响使用nCipher硬件安全模块的所有版本，攻击者无需身份认证即可利用，CVSS评分为5.0，危害等级中等。"
published = "2001-02-12T05:00:00.000"
remediation = "tags.<value>建议升级 nCipher nShield/6000/5000L 系列设备到支持 Operator Card Set recovery 禁用功能的固件版本 2.12.0 或更高版本；如果无法立即升级，可通过安全配置文件禁用 Operator Card Set recovery 功能，并限制物理访问权限至授权工作人员，定期审计卡密钥备份。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "nCipher swinit 访问控制绕过漏洞"
updated = "2026-06-16T21:53:37.227"

