[basic]
description = "tags.<value>Linux内核的nilfs2文件系统驱动中，nilfs_fiemap()函数内的nilfs_bmap_lookup_contig()在计算结果时可能遍历最多INT_MAX个块，导致n值因blkbits的左移操作而发生整数溢出（CWE-190）。虽然实际触发概率极低，但攻击者可在本地以适当权限构造恶意文件系统操作，触发该溢出从而导致拒绝服务或权限提升。该漏洞影响包含受影响nilfs2代码的Linux内核版本，CVSS评分为5.5（中等），需要本地访问权限。"
published = "2025-02-27T03:15:14.230"
remediation = "升级内核至已修复版本：Debian 11 用户升级至 linux-6.1 ≥ 6.1.129-1~deb11u1 或 linux-5.10 ≥ 5.10.237-1；Ubuntu 用户升级至对应内核版本（如 6.8.0-1032.34、6.11.0-1014.15 等）。可通过 `apt update && apt upgrade linux-image-*` 安装更新。若无法立即升级，可临时卸载 nilfs2 模块（`rmmod nilfs2`）或禁用 NILFS2 文件系统挂载以降低攻击面。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux内核 NILFS2 整数溢出漏洞"
updated = "2026-06-17T08:44:09.370"

