[basic]
description = "Adobe Flash Player authplay.dll 组件存在内存损坏漏洞（CWE-787 越界写入），攻击者可通过构造恶意的 Flash 应用程序嵌入 PDF 文件（.pdf）或制作恶意 SWF 文件（.swf），诱导用户打开后触发漏洞，导致任意代码执行或拒绝服务。该漏洞影响 Adobe Reader 和 Acrobat 9.x 至 9.1.2 版本，以及 Adobe Flash Player 9.x 至 9.0.159.0 和 10.x 至 10.0.22.87 版本。攻击需要用户交互（需打开恶意文件），2009年7月已在野利用。CVSS 3.1 评分 7.8（HIGH），攻击向量为本地，权限要求无，用户交互必需，机密性/完整性/可用性影响均为高。"
published = "2009-07-23T20:30:00Z"
remediation = "建议立即将 Adobe Reader 和 Acrobat 升级至 9.1.3 或更高版本，将 Adobe Flash Player 升级至 10.0.32.18 或更高版本。若系统仍在使用已终止支持的 Flash Player 9.x 版本，应彻底卸载或禁用该组件。如暂时无法升级，可在浏览器中禁用 Flash 插件，并在 Adobe Reader 9 中删除或重命名 authplay.dll 和 rt3d.dll 文件以作临时缓解，同时在 Windows 系统中启用数据执行预防（DEP）以降低攻击风险。"
score = 7.8
severity = "HIGH"
sources = ["tenable"]
title = "Adobe Flash Player authplay.dll 远程代码执行漏洞"
updated = "2026-06-16T23:08:13Z"

