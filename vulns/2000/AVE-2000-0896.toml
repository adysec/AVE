[basic]
description = "Microsoft Outlook 邮件客户端在处理 RTF（Rich Text Format）格式邮件时，会将发件人计算机的物理路径信息嵌入到 winmail.dat 附件中。远程攻击者可通过向目标用户发送特制的 RTF 格式邮件，当收件人打开该邮件时即可从 winmail.dat 中获取发件人机器的本地文件系统路径，导致敏感信息泄露。该漏洞无需身份认证即可利用，攻击复杂度低，影响 Microsoft Outlook 多个版本。"
published = "2000-10-20T04:00:00.000"
remediation = "建议安装 Microsoft Outlook 2000 安全更新 (SR-1 及以上版本)，该更新修复了 RTF 格式邮件中 winmail.dat 附件泄露发送者物理路径的问题。如无法升级，可在 Outlook 中禁用 RTF 格式邮件发送，将邮件格式设置为纯文本或 HTML 以缓解信息泄露风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Outlook RTF winmail.dat 附件路径信息泄露漏洞"
updated = "2026-06-16T21:52:24.563"

