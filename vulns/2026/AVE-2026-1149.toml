[basic]
description = "标签之间。<value>blaze HTTP/1.1 协议解析器存在五个一致性缺陷，导致请求边界解析不一致，可被利用进行 HTTP 请求走私攻击。当畸形请求经过支持 HTTP/1.1 的前端反向代理（如 nginx、HAProxy）转发时，代理与后端 blaze 服务器对请求边界的判断产生分歧，可能导致前端 ACL/认证绕过、后端响应队列污染及缓存投毒等后果。该漏洞影响使用 BlazeServerBuilder 构建的 blaze HTTP 服务器，攻击者无需认证即可远程发送特制 HTTP 请求触发漏洞。建议部署在符合 RFC 规范的反向代理后，并及时升级 blaze 至安全版本。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
