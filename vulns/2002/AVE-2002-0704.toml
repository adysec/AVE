[basic]
description = "Open Bulletin Board (OpenBB) 1.0.0 RC3 论坛系统的 moderator.php 页面存在认证绕过漏洞。该页面未对直接访问请求执行身份验证，远程攻击者只需构造包含 action 和 ismod 参数的特制 URL 直接请求 moderator.php，即可完全绕过登录验证机制，访问本应仅版主可用的后台管理选项。该漏洞影响所有运行 OpenBB 1.0.0 RC3 的站点，无需身份认证且利用门槛极低，攻击者获取版主权限后可篡改论坛设置、删除帖子或封禁用户，对论坛内容安全和管理秩序造成威胁。"
published = "2002-12-31T05:00:00Z"
remediation = "由于 OpenBB 项目已停止维护且无官方补丁，若仍在使用该软件，应立即在 moderator.php 文件顶部添加 session 认证检查逻辑，验证当前用户是否已通过登录认证且具备版主权限后方可执行操作；同时在 Web 服务器配置中通过 .htaccess 或 nginx 规则限制对 moderator.php 的直接外部访问，仅允许来自站内管理界面的请求。长期解决方案为将论坛迁移至仍在维护的开源平台（如 phpBB、Flarum 或 Discourse），并清理所有旧版本数据。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "OpenBB Open Bulletin Board 1.0 未授权访问漏洞"
updated = "2026-06-16T22:00:08Z"

