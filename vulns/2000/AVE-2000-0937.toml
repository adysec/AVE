[basic]
description = "BSD lpr/lpd 打印服务存在格式化字符串漏洞，位于 printjob.c 的 startprinting() 函数中。该函数将 checkremote() 返回的字符串直接作为 syslog() 的格式字符串传递，未对格式说明符进行转义。本地低权限用户可通过发送包含 %n、%x 等格式字符的特制打印请求，触发 lpd 守护进程解析非法格式串，从而造成内存读取或写入，最终实现权限提升至 lpd 权限。该漏洞影响所有基于 BSD 的 lpr/lpd 软件包，包括 NetBSD、FreeBSD 及 OpenBSD 等早期版本。攻击者无需身份认证，在本地即可发起利用，危害等级高。"
published = "2002-08-12T04:00:00Z"
remediation = "建议升级 NetBSD 至 1.5 或更高版本（已修复该格式化字符串漏洞），或应用厂商发布的 lpr/lpd 补丁包。若无法立即升级，可暂时禁用 lpd 服务（注释 /etc/inetd.conf 中 printer 行并重启 inetd），或限制本地用户对打印队列目录的写入权限作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "NetBSD lpr lpd 格式字符串权限提升漏洞"
updated = "2026-06-16T21:53:23Z"

