[basic]
description = "Microsoft Outlook 98/2000 在处理 vCard（.vcf）文件时未对超长或畸形字段进行正确校验，远程攻击者可向目标用户发送特制的 vCard 附件，当用户使用 Outlook 打开该附件时触发解析异常，导致 Outlook 应用程序崩溃，造成拒绝服务。该漏洞影响 Microsoft Outlook 98 和 Outlook 2000 版本，攻击条件简单，无需身份认证即可远程利用。"
published = "2000-10-20T04:00:00.000"
remediation = "立即安装 Microsoft Office 2000 Service Pack 2（SP2）或更高版本，该更新修复了 vCard 解析器对超长或畸形字段处理不当的问题。对于 Outlook 98 用户，请安装 Outlook 98 更新程序（Outlook 98 Update）。在无法安装补丁的情况下，作为临时缓解措施，建议在邮件客户端中禁用预览窗格，不要打开来自不可信来源的 .vcf 附件，并在邮件服务器层面过滤 vCard 附件。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Outlook 98/2000 vCard 拒绝服务漏洞"
updated = "2026-06-16T21:52:24.937"

