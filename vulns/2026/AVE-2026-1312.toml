[basic]
description = "tags.<value>Quest NetVault Backup 是一款数据备份软件，其 NVBUDeviceDrive 组件在处理 JSON-RPC 消息时存在 SQL 注入漏洞。由于系统未对用户提交的字符串进行充分验证便将其用于构造 SQL 查询，攻击者可通过注入恶意 SQL 代码实现远程代码执行。虽然利用该漏洞需要身份认证，但现有认证机制可被绕过。成功利用后，攻击者能够以 NETWORK SERVICE 权限执行任意代码，从而完全控制受影响的备份服务器。该漏洞影响 Quest NetVault Backup 多个版本，CVSS 评分 8.8（高危），攻击者只需向目标系统的 NVBUDeviceDrive JSON-RPC 接口发送特制请求即可触发漏洞。"
published = "2026-06-25T00:17:48Z"
remediation = "建议立即升级 Quest NetVault Backup 至 14.0.2 版本，该版本修复了 NVBUDeviceDrive JSON-RPC 消息处理中的 SQL 注入漏洞。升级前请备份当前配置与作业数据，通过 Quest 官方支持渠道获取 14.0.2 安装包并按照升级指南执行。如暂时无法升级，应在防火墙或反向代理层限制对 NetVault Backup Web 管理界面的访问，仅允许可信管理网段 IP 访问，以降低被远程利用的风险。"
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "Quest NetVault Backup SQL注入远程代码执行漏洞"
updated = "2026-06-26T05:16:32Z"

