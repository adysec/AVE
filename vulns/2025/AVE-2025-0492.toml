[basic]
description = "WolfSSL 的 TLS 1.3 预共享密钥（PSK）实现中存在前向保密违规漏洞。当客户端发送包含 psk_dhe_ke 但缺少 key_share 扩展的 ClientHello 时，恶意或故障的服务器可忽略客户端对完美前向保密（PFS）的请求，导致连接继续使用不含 PFS 的 PSK 会话。这降低了 TLS 连接的安全性，使得攻击者若获取了会话密钥，可解密过去捕获的通信内容。该漏洞影响使用 WolfSSL 库且启用 TLS 1.3 PSK 的系统，攻击者无需认证即可远程触发，CVSS 评分 6.3，危害等级中等。"
published = "2025-11-21T22:16:18Z"
remediation = "立即升级 WolfSSL 至 5.8.4 及以上版本（该版本包含 PR #9112 的修复，强制客户端执行 onlyDhPskKe 标志检查）。如无法立即升级，可在编译时使用 --onlyPskDheKe 选项启用 PSK DHE 密钥交换强制前向保密，或在应用层禁用 TLS 1.3 PSK 会话复用作为临时缓解措施。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "WolfSSL wolfSSL TLS 1.3 前向保密违规漏洞"
updated = "2026-06-17T08:31:26Z"

