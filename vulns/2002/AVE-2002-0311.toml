[basic]
description = "PHP 3.0.x 及 4.x 版本中的 move_uploaded_file 函数在处理文件上传时未对 open_basedir 配置指令进行检查，远程攻击者无需身份认证即可利用该漏洞绕过目录限制，将上传文件写入系统上的任意目录，破坏文件系统完整性并可能导致进一步的攻击利用。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 PHP 至 4.2.0 或更高版本（该版本已为 move_uploaded_file 添加 open_basedir 检查）；如无法升级，在 php.ini 中设置 open_basedir 限制可访问目录范围，并启用 safe_mode 作为深度防御。同时避免向不可信用户开放文件上传功能。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "PHP move_uploaded_file open_basedir 绕过漏洞"
updated = "2026-06-16T21:57:32Z"

