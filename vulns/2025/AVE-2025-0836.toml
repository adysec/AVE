[basic]
description = "Windows Installer 在处理 MSI 安装包时存在链接跟踪漏洞（CWE-59），本地低权限攻击者可通过创建符号链接诱导 Windows Installer 以 SYSTEM 权限写入目标文件，从而将权限提升至 SYSTEM。该漏洞影响所有受支持的 Windows 版本，攻击者需具备本地访问权限，无需用户交互即可利用。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:35.740"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新（KB5051974）。各受影响版本的最低修复版本号：Windows 10 1507 升级至 10.0.10240.20915，Windows 10 1607/Server 2016 升级至 10.0.14393.7785，Windows 10 1809/Server 2019 升级至 10.0.17763.6893，Windows 10 21H2 升级至 10.0.19044.5487，Windows 10 22H2 升级至 10.0.19045.5487，Windows 11 22H2/23H2 升级至 10.0.22621.4890/10.0.22631.4890，Windows 11 24H2/Server 2025 升级至 10.0.26100.3194，Server 2022 升级至 10.0.20348.3207，Server 2022 23H2 升级至 10.0.25398.1425。可通过 Windows Update 自动获取更新，或从 Microsoft 更新目录网站手动下载安装。如无法立即打补丁，建议限制本地用户登录权限并启用 Windows Defender 攻击面减少（ASR）规则以缓解利用风险。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Installer 特权提升漏洞"
updated = "2026-06-17T08:43:13.297"

