[basic]
description = "tags format.<value>Microsoft Windows Media Player 7.0 在处理自定义皮肤文件（.WMS）时存在脚本执行漏洞。该播放器在加载 .WMS 皮肤文件时会自动执行其中嵌入的脚本代码，而未对脚本内容进行有效的安全验证。远程攻击者可构造包含恶意脚本的 .WMS 皮肤文件，当用户使用 Windows Media Player 7.0 加载该皮肤文件时，恶意脚本将在用户权限下执行，从而提升攻击者权限或执行任意操作。该漏洞影响运行 Windows Media Player 7.0 的系统，攻击条件为用户必须主动打开并加载恶意 .WMS 文件。攻击者可利用此漏洞在目标系统上执行任意代码，窃取敏感信息或进一步控制用户计算机。"
published = "2001-01-09T05:00:00.000"
remediation = "立即安装 Microsoft 2000 年 11 月发布的安全更新 (MS00-090，知识库文章 KB280419)，该补丁可阻止 .WMS 自定义皮肤文件中的脚本执行。如无法立即安装补丁，应避免下载和使用来源不明的 .WMS 或 .WMZ 自定义皮肤文件，并在 Internet Explorer 安全区域设置中禁用 ActiveX 控件作为临时缓解措施，同时确保 Windows Media Player 仅使用默认皮肤。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Windows Media Player .wms 文件任意脚本执行漏洞"
updated = "2026-06-16T21:53:10.350"

