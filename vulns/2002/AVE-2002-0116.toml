[basic]
description = 'Bugzilla 2.14.1 之前版本存在输入验证漏洞，远程攻击者无需认证即可利用。漏洞一：攻击者通过向 process_bug.cgi 发送包含伪造 "who" 参数的 HTTP 请求（绕过 Bugzilla_login cookie 验证），可冒充任意用户发表评论。漏洞二：攻击者通过修改 enter_bug.cgi 中传递给 post_bug.cgi 的 reporter 参数，可冒充其他用户提交漏洞报告。该漏洞影响所有 Bugzilla 2.14.1 之前版本，攻击复杂度低，无需任何权限，可导致用户身份伪造、数据完整性破坏，CVSS 评分 7.5，危害等级高危。'
published = "2002-01-31T05:00:00Z"
remediation = "建议立即升级 Bugzilla 至 2.14.1 或更高版本（当前最新稳定版为 6.x 系列）。使用 tarball 安装的用户请下载 https://www.bugzilla.org/download/ 获取最新版；使用 CVS 的用户请执行 `cvs update` 同步至 2002-01-03 之后的代码。若暂时无法升级，可应用官方补丁 https://www.bugzilla.org/bugzilla2.14to2.14.1.patch 修补 2.14 版本。同时建议启用 HTTPS 强制加密 Cookie 传输，限制 Bugzilla 管理界面仅允许内网 IP 访问。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Bugzilla Bugzilla 评论伪造漏洞"
updated = "2026-06-16T21:56:34Z"

