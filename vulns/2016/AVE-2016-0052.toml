[basic]
description = "WordPress 安全编辑器插件（Safe Editor）1.2 版本之前存在跨站脚本漏洞。该插件在保存编辑器内容时未对用户输入进行身份验证和过滤，导致攻击者可通过向未经验证的 se_save 接口提交特制的恶意载荷，在管理员或其他用户访问受影响页面时执行任意 JavaScript 代码。攻击者无需认证即可远程利用，可窃取会话 Cookie、篡改页面内容或进行钓鱼攻击。该漏洞影响所有使用 Safe Editor 1.2 之前版本的 WordPress 站点，CVSS 评分 6.1，危害等级中危。"
published = "2019-09-17T15:15:11Z"
remediation = "立即将 WordPress 安全编辑器插件 safe-editor 升级到 1.2 或更高版本。如无法升级，可在 WordPress 后台禁用该插件，并审查所有已发布内容中是否已嵌入恶意脚本，清除后重新保存。同时建议安装 Web 应用防火墙（WAF）拦截 XSS 攻击载荷作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Safe Editor插件跨站脚本漏洞"
updated = "2026-06-17T00:40:44Z"

