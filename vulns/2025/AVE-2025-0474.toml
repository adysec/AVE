[basic]
description = "GNU Binutils 2.43 版本的 ld 组件中 libbfd.c 文件的 bfd_malloc 函数存在内存泄漏漏洞（CWE-401）。攻击者可通过远程方式触发该漏洞，导致目标系统内存资源被逐渐耗尽，进而影响链接器正常运行。由于攻击复杂度较高且利用难度较大，实际利用场景有限。该漏洞 CVSS 评分 2.3，危害等级低。目前官方已在 master 分支修复，但 2.44 分支尚未合入补丁。"
published = "2025-02-10T17:15:18Z"
remediation = "升级 GNU Binutils 至 2.44 或更高版本（所有内存泄漏已在 master 分支修复）。SUSE Linux 用户可通过 SUSE-SU-2025:4096-1 更新至 binutils 2.4 版本。如无法立即升级，避免在 ld 链接过程中使用不受信任的输入文件作为临时缓解措施。"
score = 2.3
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils ld 组件 libbfd.c 内存泄漏漏洞"
updated = "2026-06-17T08:38:28Z"

