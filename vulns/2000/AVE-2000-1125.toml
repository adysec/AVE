[basic]
description = "Ghostscript 在 5.10-16 之前的版本中存在安全漏洞。该漏洞的原理在于程序在处理环境变量 LD_RUN_PATH 为空时，会默认在当前目录下搜索库文件。本地攻击者可以通过在其他用户执行 Ghostscript 的目录下放置一个伪造的特洛伊木马库文件，诱导目标用户运行程序，从而导致攻击者以该用户的权限执行任意命令。该漏洞影响所有受影响版本的本地用户，攻击条件为攻击者需在目标执行路径拥有写权限。"
published = "2001-01-09T05:00:00Z"
remediation = "建议将 Ghostscript 升级至 5.10-16 或更高版本，以修复 LD_RUN_PATH 环境变量处理不当导致的库搜索路径问题。若无法立即升级，请确保所有用户执行 ghostscript 的目录不具备可写权限，防止攻击者在当前目录下放置恶意共享库。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Ghostscript Ghostscript 本地特权提升命令执行漏洞"
updated = "2026-06-16T21:53:17Z"

