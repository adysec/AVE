[basic]
description = "Microsoft Excel 存在释放后使用（Use After Free）远程代码执行漏洞。当用户打开特制恶意 Excel 文件时，程序在处理特定对象时释放了内存但随后仍继续使用该内存区域，攻击者可利用此漏洞在用户系统上执行任意代码，完全控制受影响设备。该漏洞影响 Microsoft 365 Apps for Enterprise、Microsoft Excel 2016、Microsoft Office 2019、Office LTSC 2021、Office LTSC 2024、Office Online Server 及 Mac 平台多个版本，CVSS 评分 7.8。成功利用需攻击者诱导用户打开恶意文件，攻击复杂度低但需要用户交互。"
published = "2025-02-11T18:15:38Z"
remediation = "建议立即安装 Microsoft 2025 年 2 月安全更新，将 Microsoft Excel 2016 升级至 16.0.5487.1000 或更高版本，Microsoft 365 Apps 升级至 16.0.1 或更高版本，Office LTSC for Mac 升级至 16.94.25020927 或更高版本，Office Online Server 升级至 16.0.10416.20058 或更高版本。如无法立即更新，请暂时避免打开来源不明的 Excel 文件以降低风险。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Excel 远程代码执行漏洞"
updated = "2026-06-17T08:43:16Z"

