[basic]
description = "Episerver 7 patch 4及更早版本中存在XML外部实体（XXE）漏洞。远程攻击者无需身份认证，可通过向util/xmlrpc/Handler.ashx接口发送包含恶意DTD的XML请求，利用该漏洞读取服务器上的任意文件。该漏洞源于应用程序在处理XML请求时未正确禁用外部实体的解析，导致攻击者可以引用外部DTD文件读取系统敏感文件（如配置文件、密码文件等）。CVSS评分7.5，危害等级高。"
published = "2018-08-29T19:29:00Z"
remediation = "立即升级到 Episerver 7 Patch 5 或更高版本。如无法立即升级，可在 Web 服务器防火墙或反向代理层面拦截所有路径以 /util/xmlrpc 开头的 HTTP 请求，并限制 Web 服务器出站 TCP 连接和 DNS 查询，以阻断 XXE 带外数据外传通道。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Episerver XML外部实体注入漏洞"
updated = "2026-06-17T01:11:36Z"

