[basic]
description = "赛门铁克 Messaging Gateway（原 Brightmail）10.6.3-2 及之前版本存在未认证远程代码执行漏洞。漏洞由两个缺陷链式触发：一是 Web 认证绕过，LoginAction.notificationLogin 方法使用静态 PBEWithMD5AndDES 密钥加密参数，攻击者可伪造任意用户会话；二是 RestoreAction.performRestore 中 localBackupFilename 参数存在命令注入，经 sudo 包装脚本 db-restore 最终在 Perl 调用 /usr/bin/du 时执行任意命令。攻击者无需认证即可远程利用，获取 root 权限完全控制设备。该漏洞影响部署为物理设备或 ESX 虚拟设备的邮件安全网关产品，CVSS 评分 8.8，危害等级高危，已被 CISA 列入已知被利用漏洞目录。"
published = "2017-08-11T20:29:00Z"
remediation = "立即升级 Symantec Messaging Gateway 至 10.6.3-267 或更高版本（可通过 Broadcom 支持门户下载补丁）。若暂时无法升级，可在网络边界防火墙限制对管理控制台端口（默认 443/8443）的访问，仅允许受信任管理 IP 访问，并启用 WAF 防御命令注入攻击载荷。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "赛门铁克 Messaging Gateway 远程代码执行漏洞"
updated = "2026-06-17T01:22:09Z"

