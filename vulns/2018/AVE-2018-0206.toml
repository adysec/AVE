[basic]
description = "Fortinet FortiOS 及 FortiProxy 的 SSL VPN 门户存在路径遍历漏洞（CWE-22）。未经身份认证的远程攻击者可通过向目标设备的 SSL VPN Web 门户发送特制的 HTTP 资源请求，利用 `../../../../../../../..//dev/cmdb/sslvpn_websession` 等路径遍历序列绕过目录限制，下载系统任意文件，包括包含明文用户凭证的会话文件。该漏洞影响 FortiOS 6.0.0 至 6.0.4、5.6.3 至 5.6.7、5.4.6 至 5.4.12 及 FortiProxy 多个版本，CVSS 评分 9.1，危害严重。攻击无需认证，仅需网络可达即可利用，已被 CISA 列入已知被利用漏洞目录，且网上已有公开的 Metasploit 模块和 PoC 脚本，实际攻击门槛极低。"
published = "2019-06-04T21:29:00Z"
remediation = "立即升级 FortiOS 至 6.0.5 及以上、5.6.8 及以上或 5.4.13 及以上版本；FortiProxy 升级至 1.2.9 及以上、1.1.7 及以上或 1.0.8 及以上版本。如无法立即升级，可在 SSL VPN 门户配置中禁用 HTTP 访问或限制来源 IP 作为临时缓解措施。"
score = 9.1
severity = "CRITICAL"
sources = ["nuclei"]
title = "Fortinet FortiOS SSL VPN 路径遍历漏洞"
updated = "2026-06-17T01:39:18Z"

