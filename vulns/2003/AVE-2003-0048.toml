[basic]
description = "tcpdump 3.7.2 之前版本中的 RADIUS 协议解析器存在拒绝服务漏洞。攻击者可通过向目标系统发送特制的 RADIUS 数据包，触发解析器进入无限循环，导致 tcpdump 进程耗尽 CPU 资源而无法正常处理网络流量。该漏洞无需身份认证即可远程触发，影响 tcpdump 3.5.2、3.6.2、3.7 及 3.7.1 版本。用户需升级至 tcpdump 3.7.2 或更高版本以修复此漏洞。"
published = "2003-03-31T05:00:00Z"
remediation = "建议升级 tcpdump 至 3.7.2 或更高版本。Debian 已发布 DSA-261 安全公告，Red Hat 已发布 RHSA-2003:032、RHSA-2003:151、RHSA-2003:214 补丁，MandrakeSoft 已发布 MDKSA-2003:027 安全公告。如无法立即升级，可在网络边界过滤或限制对 RADIUS 流量的抓包解析作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "LBL tcpdump RADIUS 解析器无限循环拒绝服务漏洞"
updated = "2026-06-16T22:01:38Z"

