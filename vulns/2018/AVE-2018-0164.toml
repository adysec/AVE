[basic]
description = "Sahi Pro 7.x.x 及 8.0.0 版本 Web 报表模块存在目录遍历漏洞（CWE-22）。攻击者无需身份认证即可通过网络远程利用该漏洞，通过构造包含路径遍历序列的特制 HTTP 请求，绕过访问限制读取服务器上的任意敏感文件（如配置文件、系统密码文件等）。该漏洞 CVSS 评分 7.5，危害等级高，影响所有默认配置下的 Sahi Pro 部署实例。公开的 PoC 已可在 ExploitDB 及 Nuclei 模板中获取，利用难度低。"
published = "2019-06-17T14:15:10Z"
remediation = "建议立即升级至 Sahi Pro 9.0.0 或更高版本，该版本已修复 web reports 模块中的目录遍历漏洞。如无法立即升级，可采取以下临时缓解措施：在 Sahi Pro 的配置文件中限制 web reports 模块的访问权限，仅允许本地主机或受信任的 IP 地址访问 _s_/dyn/Log_highlight 路径；或通过防火墙/反向代理对该路径实施访问控制，阻止外部未授权请求。同时检查服务器上是否存在敏感文件泄露，清除受影响目录下的无关文件。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Tyto Sahi Pro 目录遍历漏洞"
updated = "2026-06-17T01:52:55Z"

