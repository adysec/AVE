[basic]
description = "Apache Solr 的 DataImportHandler（DIH）模块存在远程命令执行漏洞。DIH 是 Solr 中用于从数据库等数据源导入数据的可选功能模块，其调试模式允许通过 HTTP 请求中的 `dataConfig` 参数直接传入完整的 DIH 配置。由于 DIH 配置支持嵌入脚本代码，攻击者可在未授权情况下向 Solr 服务端发送特制的 dataConfig 参数，触发任意命令执行，进而完全控制服务器。该漏洞影响 Apache Solr 8.2.0 之前的所有版本，CVSS 评分 7.2，危害等级高。官方已在 Solr 8.2.0 中通过引入 `enable.dih.dataConfigParam` 系统属性开关进行修复，默认关闭该危险参数。"
published = "2019-08-01T14:15:13Z"
remediation = "升级至 Apache Solr 8.2.0 及以上版本，该版本默认禁用通过 dataConfig 参数注入脚本的功能。如无法升级，在启动参数中添加 `-Denable.dih.dataConfigParam=false` 或不在 solr.in.sh 中设置该参数为 true。同时建议在反向代理层限制 `/solr/*/dataimport*` 路径的访问权限，仅允许受信 IP 访问 Solr Admin 管理界面，并移除未使用的 DataImportHandler 插件配置。"
score = 7.2
severity = "HIGH"
sources = ["nuclei"]
title = "Apache Solr DataImportHandler 远程命令执行漏洞"
updated = "2026-06-17T02:07:55Z"

