[basic]
description = "WordPress 的 nd-booking 插件 2.5 版本之前存在开放重定向漏洞。该插件在实现 AJAX 处理功能时暴露了一个无需身份验证的 nopriv_ 操作，未经认证的远程攻击者可通过构造恶意 AJAX 请求修改 WordPress 站点的 siteurl 设置，将用户访问重定向至攻击者控制的恶意网站。该漏洞影响所有使用受影响版本插件的 WordPress 站点，攻击者利用此漏洞可发起钓鱼攻击或社工攻击，且需要用户点击链接才能触发重定向行为。"
published = "2019-08-29T12:15:11Z"
remediation = "立即将 nd-booking（Hotel Booking）插件升级到 2.5 或更高版本，该版本已在 AJAX 请求中添加 nonce 验证机制，可阻断未认证的 nopriv_ AJAX 操作。升级路径：进入 WordPress 后台「插件」→「已安装的插件」→ 找到 nd-booking/Hotel Booking → 点击「立即更新」。升级后检查「设置」→「常规」中的 WordPress 地址（URL）和站点地址（URL）是否被篡改，如有异常请立即恢复。若无法立即升级，建议暂时停用该插件作为临时缓解措施，直至完成版本更新。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress nd-booking 插件开放重定向漏洞"
updated = "2026-06-17T02:21:02Z"

