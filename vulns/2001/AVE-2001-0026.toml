[basic]
description = "IBM DB2 Universal Database 6.1 及 7.1 版本存在拒绝服务漏洞，本地用户可通过向数据库发送特制的畸形查询语句，导致数据库服务进程崩溃或无法响应正常请求。该漏洞需要本地访问权限，攻击复杂度较低，无需身份认证即可触发，仅影响系统可用性，不涉及机密性和完整性。IBM 已在后续版本更新中修复此漏洞。"
published = "2001-02-16T05:00:00Z"
remediation = "IBM DB2 Universal Database 已停止支持，无官方补丁。建议升级到受支持的 IBM Db2 版本（如 11.5+），或迁移至其他受支持的数据库产品。如无法升级，可在防火墙层面限制对 DB2 服务的访问（默认端口 50000），仅允许可信 IP 连接，并监控异常 SQL 查询流量作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "IBM DB2 Universal Database 畸形查询拒绝服务漏洞"
updated = "2026-06-16T21:53:33Z"

