[basic]
description = "Windows HTTP 协议栈（http.sys）存在释放后使用漏洞，未经身份认证的远程攻击者可通过向目标系统发送包含特制 Accept-Encoding 头的 HTTP 请求触发该漏洞，实现远程代码执行。该漏洞影响 Windows 10 Version 2004/20H2 及 Windows Server 2004/20H2 等版本，CVSS 评分 9.8，危害等级严重，且已被 CISA 列入已知被利用漏洞目录。Microsoft 已在 2021 年 5 月安全更新中修复此漏洞，受影响用户应安装相关补丁。"
published = "2021-05-11T19:15:09Z"
remediation = "建议立即安装 Microsoft 2021 年 5 月的安全更新，通过 Windows Update 或从 Microsoft Update Catalog 下载安装对应版本的累积更新补丁（如 KB5003636）。如无法立即打补丁，可在防火墙层面禁用 80 和 443 端口作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Microsoft Windows HTTP 协议栈远程代码执行漏洞"
updated = "2026-06-17T03:51:21Z"

