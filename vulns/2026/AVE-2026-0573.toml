[basic]
description = "PocketSphinx 5prealpha 版本的语言模型加载代码（trie 模型）在解析 ARPA、DMP 及二进制格式文件头时未正确校验边界条件，攻击者可通过提供特制的恶意语言模型文件触发栈或堆缓冲区溢出；同时，声学模型加载代码中存在多处未限制长度的 sscanf 调用，同样可导致栈溢出。若环境变量 POCKETSPHINX_PATH 指向的目录可被不可信用户写入，攻击者可将恶意模型文件放入该目录，当受害者使用 PocketSphinx 加载模型时触发漏洞，造成程序崩溃或潜在代码执行。该漏洞影响 PocketSphinx 5prealpha 版本，已在 5.1.1 版本中修复。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级 PocketSphinx 至 5.1.1 或更高版本，该版本已修复语言模型和声学模型加载中的缓冲区溢出问题。如无法升级，确保 `POCKETSPHINX_PATH` 环境变量未设置或指向仅受信任用户可写的目录，并避免加载来源不可信的 ARPA/DMP/二进制格式语言模型文件。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "PocketSphinx 语言模型与声学模型加载缓冲区溢出漏洞"
updated = "2026-01-01T00:00:00Z"

