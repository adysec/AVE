[basic]
description = "ATP HTTPd 0.4b 及更早版本中的 sock_gets 函数存在单字节缓冲区溢出漏洞（CWE-193）。未经身份认证的远程攻击者可通过向目标服务器发送超长的 HTTP GET 请求触发该溢出，由于边界检查不严导致缓冲区写入超出预期范围一个字节，攻击者可利用此漏洞执行任意远程代码。该漏洞影响所有运行受影响版本 ATPhttpd 的系统，利用方式简单直接，ExploitDB 已公开相关利用代码。"
published = "2002-12-31T05:00:00Z"
remediation = "鉴于 ATP HTTPd 0.4b 官方项目已长期停止维护且从未发布修复补丁，强烈建议将服务迁移至仍在维护的 Web 服务器（如 Nginx 1.28+ 或 Apache HTTPD 2.4.62+），从根本上消除该缓冲区溢出风险。如因业务限制短期内无法替换，可采取以下缓解措施：第一，在服务器前置防火墙或反向代理处限制 HTTP 请求头的最大长度，将 `client_header_buffer_size` 和 `large_client_header_buffers` 设置为不超过 1KB，使攻击者无法发送足以触发溢出的超长 GET 请求；第二，若坚持使用 ATP HTTPd，须手动修改源码中 `sockhelp.c` 内 `sock_gets` 函数的缓冲区定义，将原有固定大小的字符数组增大至至少 2048 字节，并在读取输入时改用 `snprintf` 替代不安全的字符串拷贝操作，重新编译后部署，同时建议配合 TCP Wrapper 或 iptables 规则仅允许可信来源访问 80 端口，以降低被远程利用的可能性。"
score = 9.8
severity = "CRITICAL"
sources = ["exploitdb"]
title = "ATP httpd 0.4 缓冲区溢出漏洞"
updated = "2026-06-16T22:00:06Z"

