[basic]
description = "Akopia Interchange 4.5.3 至 4.6.3 版本在安装时会自动部署示例商店（包括 barry、basic 和 construct），且这些示例商店中存在一个默认组账户 `:backup`，该账户未设置密码。未经身份验证的远程攻击者可以利用这一默认凭据漏洞，通过访问示例商店的 `:backup` 账户直接获得管理员权限，进而完全控制电子商务服务器。该漏洞影响所有使用受影响版本并启用演示商店的 Akopia Interchange 部署实例，攻击者无需任何前置条件即可远程利用。"
published = "2001-06-18T04:00:00Z"
remediation = "立即升级到 Akopia Interchange 4.6.4 或更高版本，该版本已修复 demo 商店默认 :backup 账户无密码的问题。如暂时无法升级，应在服务器配置文件中为 :backup 账户设置高强度密码，并删除或禁用 barry、basic、construct 三个示例商店目录，同时在防火墙层面限制对演示目录的远程访问。建议在完成修复后重新启动 Interchange 服务，并验证所有用户账户密码策略是否符合要求。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Akopia Interchange 电子商务服务器默认组账号未授权访问漏洞"
updated = "2026-06-16T21:54:10Z"

