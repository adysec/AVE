[basic]
description = "Windows 电话服务（Telephony Service）存在堆缓冲区溢出漏洞（CWE-122），攻击者可通过向目标用户发送特制请求并诱使其执行特定操作，在无需身份认证的情况下利用该漏洞实现远程代码执行。成功利用后攻击者可获取 SYSTEM 权限，完全控制受影响系统，实现安装程序、查看/更改/删除数据或创建新账户等操作。该漏洞影响多个 Windows 版本，包括 Windows 10、Windows 11 及 Windows Server 系列。CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中发布补丁修复此漏洞。"
published = "2025-01-14T18:15:45Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新（KB5049984 / KB5049983 / KB5050004 / KB5050021 / KB5049981，具体版本取决于 Windows 版本），或通过 Windows Update 自动获取更新。如无法立即打补丁，可在防火墙中限制 TAPI 服务的网络访问，并禁用不必要的电话服务（Telephony Service）作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:42:56Z"

