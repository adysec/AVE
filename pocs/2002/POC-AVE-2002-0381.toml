[info]
author = "ave"
description = "验证目标系统是否暴露未认证的 SoftwareUpdate HTTP 服务，该漏洞允许远程攻击者通过 DNS 欺骗或缓存投毒伪装成 Apple 更新服务器，向目标系统分发特制的木马更新包，从而在目标系统上以系统权限执行任意代码。该漏洞影响 Mac OS X 10.1.x 系列版本（10.1 至 10.1.5），CVSS v2 评分 7.5，危害等级高，攻击者无需身份认证即可远程利用。"
id = "POC-AVE-2002-0381"
name = "Apple Mac OS X SoftwareUpdate 未认证软件包安装漏洞 PoC"
severity = "high"
tags = ["ave-2002-0381"]
vuln_id = [
    "CVE-2002-0676",
    "AVE-2002-0381",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
