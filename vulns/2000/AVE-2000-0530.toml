[basic]
description = "Netscape Communicator 及 Navigator 4.04 至 4.74 版本中存在 Java 小程序权限绕过漏洞（又称 Brown Orifice）。远程攻击者可通过诱导用户访问恶意网页，利用 Java applet 以 file、http、https、ftp 等协议打开连接，从而越权读取目标系统上的任意文件内容。该漏洞无需用户交互即可触发，攻击者仅需构造特制 HTML 页面即可窃取敏感信息，影响范围广泛。"
published = "2000-10-20T04:00:00Z"
remediation = "升级 Netscape Communicator 至 4.75 或更高版本，或完全禁用 Java applet 支持（在 Preferences → Advanced 中取消 Enable Java 选项）。如无法升级，建议更换为现代浏览器（如 Firefox、Chrome）以避免此漏洞风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Netscape Communicator 及 Navigator Java Applet URL 读取漏洞"
updated = "2026-06-16T21:52:14Z"

