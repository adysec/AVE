[basic]
description = 'Linux内核SCSI MPI3MR驱动存在空指针解引用漏洞。当bsg_setup_queue()初始化失败时，bsg_queue被赋予非NULL值，导致mpi3mr_bsg_exit()中的清理条件"if(!mrioc->bsg_queue)"无法满足，程序跳过bsg_remove_queue()的正常清理流程，最终在mpi3mr_bsg_exit+0x1f处触发内核空指针解引用崩溃。攻击者需具备本地访问权限并能触发BSG队列设置失败的条件（如加载特定SCSI设备配置），即可导致内核崩溃或拒绝服务。该漏洞影响使用MPI3MR驱动的Linux系统，CVSS评分为5.5（中等），危害等级中等。Linux内核社区已在后续版本中修复此问题，建议用户升级至已修补的内核版本。'
published = "2025-02-27T02:15:15.993"
remediation = "立即升级 Linux 内核至 6.12.13、6.13.2 或 6.14 及以上版本以修复 MPI3MR 驱动 BSG 队列释放缺陷。Ubuntu 用户执行 `sudo apt update && sudo apt upgrade linux-image-generic`，Debian 用户执行 `sudo apt update && sudo apt upgrade linux-image-amd64`，RHEL/CentOS 用户执行 `sudo dnf update kernel`。升级后重启系统使新内核生效，并通过 `uname -r` 确认版本已更新。若无法立即升级，可在 `/etc/default/grub` 中禁用 BSG 功能作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux内核 SCSI MPI3MR驱动 BSG设置失败时空指针解引用导致崩溃漏洞"
updated = "2026-06-17T08:44:07.453"

