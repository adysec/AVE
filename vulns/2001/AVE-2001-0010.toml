[basic]
description = "everythingform.cgi 是 Leif M. Wright 开发的一个 CGI 表单处理程序，版本 2.0 及更早版本中存在命令注入漏洞。由于该程序在接收用户输入后未对 config 参数进行充分的输入验证，攻击者可在参数中嵌入 shell 元字符（如分号、管道符等），从而在 Web 服务器上执行任意操作系统命令。该漏洞影响运行 everythingform.cgi 的所有 Web 服务器，攻击者无需任何身份认证即可远程利用，CVSS 评分为 10.0，危害等级为严重。"
published = "2001-02-12T05:00:00Z"
remediation = "立即从 Web 服务器中删除 everythingform.cgi 脚本，或将其移出 cgi-bin 目录并禁止执行权限。如业务确需表单功能，应升级到 Leif M. Wright 发布的修复版本或替换为其他安全的主流表单处理程序。同时应在 Apache 或 IIS 配置中添加针对该脚本的访问限制规则，禁止外部用户直接调用。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Leif M. Wright everythingform.cgi 远程命令执行漏洞"
updated = "2026-06-16T21:53:30Z"

