[basic]
description = "Apple WebKit 渲染引擎存在未明的内存破坏漏洞（CWE-119），该漏洞影响 Apple Safari 5.1.4 以下版本、iOS 5.1 以下版本以及 iTunes 10.6 以下版本。未经身份认证的远程攻击者可通过诱导用户访问精心构造的恶意网站触发此漏洞，利用内存损坏实现远程代码执行或导致应用程序崩溃，从而完全控制受影响设备并造成拒绝服务。"
published = "2012-03-08T22:55:03Z"
remediation = "将 Apple Safari 升级至 5.1.4 及以上版本，Apple iOS 升级至 5.1 及以上版本，Apple iTunes 升级至 10.6 及以上版本。可通过 Apple 软件更新功能或访问 https://support.apple.com/zh-cn 下载对应更新。如无法立即升级，建议在浏览器中禁用 JavaScript 并避免访问不可信网站作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:56Z"

