[basic]
description = "Linux 内核 2.4.20 之前版本的 bttv 驱动（bttv-driver.c）中 bttv_read 函数存在带符号整数溢出漏洞。攻击者可通过向目标系统发送特制数据触发该漏洞，导致内核内存破坏，可能造成拒绝服务或权限提升。该漏洞影响所有使用受影响 Linux 内核版本的系统，CVSS 评分 10.0，危害等级严重。由于无需认证即可远程利用，建议用户尽快升级至 2.4.20 及以上版本。"
published = "2002-12-31T05:00:00Z"
remediation = "立即升级 Linux 内核至 2.4.20 或更高版本，该漏洞已在 2.4.20 中修复。Red Hat Linux 用户请安装 RHSA-2002:205 和 RHSA-2002:206 提供的更新内核 RPM 包。如无法升级内核，可通过模块黑名单禁用 bttv 驱动（在 /etc/modprobe.d/ 中添加 blacklist bttv），阻止攻击者通过该驱动进行利用。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "Linux kernel bttv 驱动带符号整数溢出漏洞"
updated = "2026-06-16T21:59:34Z"

