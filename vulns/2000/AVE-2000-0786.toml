[basic]
description = 'alex heiphetz Group eZshopper 2.0/3.0 的 loadpage.cgi CGI 程序存在目录遍历漏洞。远程攻击者无需身份认证，通过在"file"参数的文件名前插入"/"字符，可遍历并读取 EZshopper 数据目录中的任意文件。该漏洞影响 EZshopper 2.0 和 3.0 版本，CVSS 评分为 5.0，危害等级为中等。攻击条件仅为向 loadpage.cgi 发送特制的 HTTP 请求，利用方式简单直接，可导致敏感数据泄露。'
published = "2001-01-09T05:00:00.000"
remediation = '禁用或移除 loadpage.cgi CGI 程序，或在 Web 服务器层面禁止对 /cgi-bin/ezshopper*/loadpage.cgi 的访问；通过配置 Web 服务器（如 Apache）的 Alias 或 Location 块，限制该 CGI 路径仅允许本地访问，并拒绝包含 "/" 或 ".." 的 file 参数请求。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "alex heiphetz Group eZshopper 目录遍历漏洞"
updated = "2026-06-16T21:53:07.783"

