[basic]
description = "NSI Rwhoisd 1.5.x 存在格式化字符串漏洞，攻击者可通过 -soa 命令中的格式说明符注入恶意输入，无需身份认证即可远程触发该漏洞。漏洞源于程序未对用户输入的格式字符串进行过滤和校验，导致攻击者可利用 %n 等格式说明符读写内存，最终实现任意代码执行。该漏洞影响运行 Rwhoisd 1.5.x 的服务器系统，CVSS 评分为 7.5，危害等级为高危。攻击条件为攻击者可直接向目标发送特制请求，利用方式是通过构造包含格式字符串 specifiers 的 -soa 命令参数来操控程序执行流程。"
published = "2001-12-06T05:00:00Z"
remediation = "建议立即升级 NSI Rwhoisd 至 1.5.7 或更高版本（Network Solutions 已发布修复补丁）。若无法立即升级，请在防火墙层面限制 4321 端口（Rwhois 默认端口）仅允许可信 IP 访问，或在防火墙层面过滤包含格式化字符串特征（如 %n、%s、%x 等）的 -soa 命令参数作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Network Solutions Rwhoisd 远程代码执行漏洞"
updated = "2026-06-16T21:55:04Z"

