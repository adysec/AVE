[basic]
description = "Netscape Fasttrack Server 4.1 的缓存模块存在资源耗尽漏洞，未经身份认证的远程攻击者可通过向目标服务器连续发送大量指向不存在资源的 HTTP 请求来触发该漏洞。服务器在处理这些无效请求时，缓存模块会不断尝试缓存不存在的 URL，导致内存、CPU 及磁盘 I/O 资源被大量消耗，最终引发拒绝服务，使正常用户无法访问服务。该漏洞影响 Netscape Fasttrack Server 4.1 及同系列 iPlanet FastTrack/Enterprise 4.1 产品，攻击者无需任何凭据即可实施攻击，仅需具备网络连通性即可利用自动化工具持续发起请求。"
published = "2001-03-26T05:00:00Z"
remediation = "Netscape 官方已确认该漏洞不提供修复补丁（FastTrack Server 4.1 设计上不适用于生产环境，厂商拒绝发布修复）。受影响产品（Netscape FastTrack Server 4.1 for Windows NT 4.0）已全面终止支持（EOL），无后续安全更新。建议立即将 Web 服务迁移至受支持的服务器产品（如 Apache、Nginx 或 Microsoft IIS 当前支持版本）。如短期内无法完成迁移，应在服务器前端部署反向代理或 WAF（如 ModSecurity），配置规则限制对不存在 URL 的异常高频请求，并监控服务器内存与缓存模块的资源占用情况以提前发现异常。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Netscape Fasttrack Server 4.1 缓存模块拒绝服务漏洞"
updated = "2026-06-16T21:53:48Z"

