[info]
author = "ave"
description = "Tnef程序在解压TNEF编码的压缩附件时未对解压输出路径进行合法性校验，允许远程攻击者通过在附件中指定绝对路径名将文件写入目标系统的任意位置，可覆盖关键配置文件或可执行文件以提升权限"
id = "POC-AVE-2000-1314"
name = "CVE-2000-0614 PoC"
severity = "critical"
tags = ["ave-2000-1314"]
vuln_id = [
    "CVE-2000-0614",
    "AVE-2000-1314",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/tnef/decode"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
Content-Type = "message/rfc822"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
