[basic]
description = "BlackBoard CourseInfo 4.0 存在认证缺陷漏洞，由于未对直接调用的 CGI 程序（如 user_update_passwd.pl 和 user_update_admin.pl）进行用户身份验证，导致本地攻击者可直接访问并修改 CourseInfo 数据库信息，进而提升权限。攻击者无需复杂前置条件即可实施利用，影响系统完整性和机密性。"
published = "2000-07-18T04:00:00.000"
remediation = "立即联系 Blackboard 厂商获取 CourseInfo 4.0 的安全补丁并安装，或升级至已修复此漏洞的最新版本。作为临时缓解措施，在 Web 服务器（如 Apache）中配置访问控制，限制对 CGI 目录（如 /cgi-bin/）的直接调用，仅允许经过身份验证的管理员 IP 访问 user_update_passwd.pl 和 user_update_admin.pl 等后台 CGI 脚本；同时在脚本入口处添加 session 认证检查，拒绝未登录用户的直接请求。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "BlackBoard CourseInfo 认证绕过与权限提升漏洞"
updated = "2026-06-16T21:52:08.453"

