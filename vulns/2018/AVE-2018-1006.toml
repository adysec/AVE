[basic]
description = "Schneider Electric U.Motion Builder 是一款工业监控和数据采集（SCADA）系统。该软件 1.3.4 版本存在 SQL 注入与操作系统命令注入漏洞。攻击者无需身份认证，即可通过在 `track_import_export.php` 接口的 `object_id` 参数中输入恶意构造的字符，触发 SQL 注入，进而实现操作系统命令执行。该漏洞影响范围为 Schneider Electric U.Motion Builder 1.3.4 版本。CVSS v3.1 评分 9.8（CRITICAL），攻击向量为网络，攻击复杂度低，无需权限或用户交互即可远程利用，可导致敏感信息泄露、数据破坏或服务器被完全控制。攻击者能够通过该漏洞完整接管运行该软件的服务器，对工业控制系统安全构成严重威胁。"
published = "2019-05-22T20:29:01.480"
remediation = "建议将受影响版本的 U.motion Builder 软件（1.3.4）从网络中断开或下线停用，因为 Schneider Electric 已将该产品标记为生命周期终止（end-of-life），不再提供修复补丁。如短期内无法替换，应在边界防火墙或 WAF 上针对 track_import_export.php 接口添加访问控制规则，限制仅可信来源 IP 可访问该接口，同时以最小权限账户运行 U.motion Builder 服务，并在数据库层对 object_id 参数进行严格的输入过滤与白名单校验，以降低 SQL 注入被利用的风险。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "施耐德电气 U.Motion Builder 操作系统命令注入漏洞"
updated = "2026-06-17T02:03:50.500"

