[basic]
description = "Ethereal（现Wireshark）网络协议分析器的AFS访问控制列表解析器存在缓冲区溢出漏洞。该漏洞影响Ethereal 0.8.13及更早版本，当软件解析包含过长用户名的特制AFS数据包时，会触发堆栈缓冲区溢出。未经身份认证的远程攻击者可通过向目标系统发送恶意构造的网络数据包，利用该漏洞执行任意系统命令。由于攻击无需认证且攻击复杂度低，攻击者可直接在网络中发起远程利用，成功入侵后可完全控制受影响的系统。该漏洞CVSS评分为7.5，危害等级为高危。"
published = "2001-01-09T05:00:00Z"
remediation = "立即将 Ethereal 升级到 0.8.14 或更高版本以修复 AFS ACL 解析器的缓冲区溢出漏洞。由于 Ethereal 已停止维护并更名为 Wireshark，建议直接迁移到 Wireshark 最新稳定版。如暂时无法升级，可在防火墙或 IDS 中过滤 AFS 相关 UDP 端口（7000-7008）的数据包，或禁用 AFS 协议解析功能作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Ethereal AFS 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:18Z"

