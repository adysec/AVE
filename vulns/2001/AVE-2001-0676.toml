[basic]
description = "CVE-2001-0243是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-06-27T04:00:00.000"
remediation = '建议将 Windows Media Player 6.4 升级到 7.1 或更高版本（包括 Windows XP 自带的 Windows Media Player 8），或直接安装微软安全更新补丁 Q47366（MS01-029）。安装补丁后，在 Windows Media Player 6.4 中依次点击 View → Options → Player 选项卡，取消勾选"Allow Internet sites to uniquely identify your player"；在 Windows Media Player 7.1 中依次点击 Tools → Options → Player 选项卡，同样取消该选项以增强隐私保护。如无法立即升级或打补丁，可临时禁用浏览器对 ActiveX 控件的自动运行，并避免打开来源不明的 .ASX 文件和 HTML 邮件，以降低被利用的风险。补丁及升级包可通过 Windows Update 或微软下载中心获取。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows Media Player 任意文件读取漏洞"
updated = "2026-06-16T21:53:57.057"

