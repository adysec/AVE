[basic]
description = "Adobe Flash Player 及 Adobe AIR 存在空指针引用漏洞（CWE-476）。攻击者可通过向受影响版本（Windows/Mac 上 Flash Player 低于 10.3.183.20 或 11.x 低于 11.3.300.257，Linux 上低于 10.3.183.20 或 11.x 低于 11.2.202.236，Android 2.x/3.x 上低于 11.1.111.10，Android 4.x 上低于 11.1.115.9，以及 Adobe AIR 低于 3.3.0.3610）的用户发送特制的恶意 Flash 内容，触发空指针解引用，导致应用程序崩溃或执行任意代码。该漏洞无需身份认证，远程攻击者可通过诱导用户访问恶意网页或打开恶意文件进行利用，CVSS 评分 9.3，危害等级严重。"
published = "2012-06-09T00:55:01.207"
remediation = "立即升级 Flash Player 至以下安全版本：Windows/Mac 升级至 10.3.183.20 或 11.3.300.257，Linux 升级至 10.3.183.20 或 11.2.202.236，Android 2.x/3.x 升级至 11.1.111.10，Android 4.x 升级至 11.1.115.9，Adobe AIR 升级至 3.3.0.3610。由于 Adobe Flash Player 已停止支持，建议彻底卸载 Flash Player 并在浏览器中禁用 Flash 插件，改用 HTML5 替代方案以永久消除风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 空指针解引用漏洞"
updated = "2026-06-16T23:40:50.733"

