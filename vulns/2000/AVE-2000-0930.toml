[basic]
description = "Netscape 4.75 及更早版本的 HTML 解析器存在缓冲区溢出漏洞，远程攻击者可通过在表单字段中提交超长密码值触发该漏洞，导致任意命令执行。攻击者只需诱使用户访问特制网页即可完成利用，无需身份认证。该漏洞影响所有使用受影响 Netscape 浏览器的系统，CVSS 评分 7.5，危害等级高。"
published = "2001-01-09T05:00:00Z"
remediation = "立即停止使用 Netscape 4.75 及更早版本，升级至 Netscape 6.0 或更高版本。由于 Netscape 浏览器已停止维护，建议彻底迁移至现代浏览器（如 Firefox、Chrome 或 Edge）。在完成迁移前，可在浏览器设置中禁用 JavaScript 和自动表单填充功能，并配置 Web 应用防火墙（WAF）过滤包含超长表单字段的 HTTP 请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Netscape Communicator/Navigator HTML解析器缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:20Z"

