[basic]
description = "D-Link DIR-600M 无线路由器存在认证绕过漏洞（CWE-306），其 wan.htm 页面未实施任何身份验证机制，远程攻击者无需任何凭证即可直接访问该页面，导致 WAN 口配置信息（如 IP 地址、DNS、MAC 地址等）泄露，并可进一步修改页面中的数据字段，实现对路由器 WAN 设置的未授权篡改。该漏洞影响固件版本 3.02、3.03、3.04 及 3.06，攻击者只需知道目标路由器的 IP 地址即可通过浏览器直接访问 wan.htm 触发，无需用户交互，危害严重。"
published = "2019-08-08T13:15:12.407"
remediation = "建议立即将 D-Link DIR-600M 固件升级至厂商提供的最新安全版本（如已停止支持则升级至 3.07 及以上版本）。如无法升级，可在路由器管理界面中设置仅允许内网特定 IP 访问管理页面，并在网络边界防火墙中阻断对路由器 80/8080 端口的外部访问，同时禁用 WAN 侧远程管理功能以降低暴露面。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "D-Link DIR-600M 认证绕过漏洞"
updated = "2026-06-17T02:16:03.580"

