[basic]
description = "NetPBM 9.20 及更早版本中存在多个整数溢出和整数符号错误漏洞，这些数学运算溢出缺陷可导致缓冲区溢出。远程攻击者可通过向目标系统发送特制的图像文件触发该漏洞，成功利用后可导致拒绝服务或执行任意代码。该漏洞影响 NetPBM 9.20 及之前所有版本，攻击无需身份认证且复杂度较低，CVSS 评分 7.5，危害等级高。"
published = "2003-03-31T05:00:00Z"
remediation = "升级 NetPBM 至 9.20-8 或更高版本（Debian 对应 DSA-263，Red Hat 对应 RHSA-2003:060）。如无法立即升级，可限制仅受信任用户调用 NetPBM 相关工具（如 pnmtojpeg、ppmtogif 等），并避免处理来自不可信来源的图像文件作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "NetPBM 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T22:01:38Z"

