[basic]
description = "D-Link DNS-320 网络存储设备中的 login_mgr.cgi 脚本存在操作系统命令注入漏洞（CWE-78）。该脚本对用户输入的命令参数过滤不严，未经验证的远程攻击者可通过向目标设备发送特制的 HTTP 请求，在设备操作系统上注入并执行任意系统命令，从而实现远程代码执行、完全控制设备或导致数据泄露。该漏洞影响 DNS-320 的 2.05.B10 及之前所有固件版本，攻击向量为远程网络访问且无需任何认证与用户交互，CVSS 评分 9.8，危害等级严重，已被列入 CISA 已知被利用漏洞目录。"
published = "2019-01-01"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["nuclei"]
title = "D-Link DNS-320 操作系统命令注入漏洞"
