[basic]
description = "Cisco ATA-186 模拟电话适配器的 Web 管理界面存在身份认证绕过漏洞。远程攻击者可通过向该设备的配置接口发送仅包含单个字节的 HTTP POST 请求绕过登录认证，从而获取管理员密码或修改设备配置参数。该漏洞影响 Cisco ATA-186 全系列版本，攻击者无需任何身份凭证即可利用，可能导致设备被完全控制及通信数据泄露。"
published = "2002-08-12T04:00:00Z"
remediation = "立即升级 Cisco ATA 186 固件至厂商修复版本（参见 Cisco 安全公告：http://www.cisco.com/warp/public/707/ata186-password-disclosure.shtml）。如无法升级，在设备所在网络边界部署访问控制列表（ACL），仅允许受信任管理 IP 访问设备的 Web 管理端口（默认 TCP 80），并禁用 WAN 侧对管理界面的访问。同时建议将设备置于内部管理 VLAN 中，避免暴露在不可信网络中。"
score = 6.4
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Cisco ATA-186 HTTP设备配置信息泄露漏洞"
updated = "2026-06-16T21:58:05Z"

