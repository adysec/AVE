[basic]
description = "HP ProCurve Switch 4000M 交换机固件 C.07.23 版本存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标设备发送包含85个字符的特制 SNMP 写入请求触发该漏洞，导致设备发生堆栈缓冲区溢出并崩溃，最终造成拒绝服务。该漏洞影响网络可用性，攻击条件简单，攻击者无需账号凭据即可在网络可达的情况下直接利用，CVSS 评分 7.8，危害等级高。"
published = "2003-04-11T04:00:00.000"
remediation = "该漏洞需要具有 SNMP 写入权限才能触发，首先应在 SNMP 服务中移除或限制写入权限，仅保留只读 community string。将 SNMP community string 的默认值（如 private、public）修改为复杂且难以猜测的值，并在交换机 ACL 中限制仅允许受信任的管理网段访问 SNMP 服务（161/udp 端口）。同时，在管理平面禁用不必要的 SNMP write 团体（write community）或将 SNMP 版本升级至 v3 并启用认证加密模式。若当前设备固件版本低于 C.07.24，应联系 HP 官方获取修复补丁并升级至最新可用固件版本。作为临时缓解措施，若 SNMP 写入功能非业务必需，可直接在设备上禁用 SNMP 写入访问。"
score = 7.8
severity = "HIGH"
sources = ["exploitdb"]
title = "HP ProCurve Switch 4000M SNMP 写入请求拒绝服务漏洞"
updated = "2026-06-16T21:59:18.430"

