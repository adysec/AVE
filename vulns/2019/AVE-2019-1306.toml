[basic]
description = "Rails框架的Action View组件存在文件内容泄露漏洞，版本低于5.2.2.1、5.1.6.2、5.0.7.2、4.2.11.1及v3均受影响。攻击者可通过构造恶意的HTTP Accept请求头，诱导服务器读取并返回目标系统任意文件的内容。该漏洞无需身份认证即可利用，攻击者可借此获取服务器上的敏感配置文件、源代码等敏感信息。CVSS评分为7.5，危害等级为高危。"
published = "2019-03-27T14:29:01Z"
remediation = "立即升级 Ruby on Rails 至以下安全版本之一：5.2.2.1、5.1.6.2、5.0.7.2 或 4.2.11.1。如暂无法立即升级，可在反向代理（如 Nginx）中过滤含 MIME 类型范围的 Accept 请求头，或通过修改配置限制 Action View 渲染文件路径，阻止任意文件读取。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Ruby on Rails Action View 任意文件读取漏洞"
updated = "2026-06-17T02:37:39Z"

