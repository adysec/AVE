[basic]
description = "Thumbor 是一款开源的图片缩略图服务，其 convolution 滤镜的正则表达式存在灾难性回溯（ReDoS）漏洞。该正则表达式在处理包含大量重复数值的输入时会产生指数级回溯，未经身份认证的远程攻击者可通过构造特制的 URL 请求（如包含多个重复分号分隔数值的 convolution 滤镜参数）触发该漏洞，导致服务器在处理该请求时 CPU 资源耗尽，无法继续处理其他图片请求，造成拒绝服务。该漏洞影响 Thumbor 7.8.0 之前的所有版本，CVSS 评分 7.5，危害等级高。官方已在 7.8.0 版本中通过修复正则表达式修复此漏洞。"
published = "2026-07-31T19:17:09Z"
remediation = "立即升级 Thumbor 至 7.8.0 或更高版本，该版本已修复 convolution 过滤器正则表达式的指数回溯问题。如无法立即升级，可在反向代理层（如 Nginx）添加规则拦截包含大量重复数字的 convolution 参数请求，或禁用 convolution 过滤器功能作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Thumbor 卷积过滤器正则表达式拒绝服务漏洞"
updated = "2026-08-01T00:17:16Z"

