[basic]
description = 'MultiHTML 1.5 CGI 脚本存在文件泄露漏洞，远程攻击者可通过向 "multi" 参数传递特制的文件名，读取服务器上的任意文件，甚至可能执行任意命令。该漏洞源于 CGI 脚本未对用户输入的 "multi" 参数进行充分的路径过滤和权限检查，导致目录遍历攻击。攻击者无需身份认证即可利用，影响范围包括部署了 MultiHTML 1.5 CGI 脚本的 Web 服务器。公开的 PoC 表明攻击者可通过构造恶意请求读取 /etc/passwd 等敏感文件，危害较大。'
published = "2000-12-19T05:00:00.000"
remediation = "立即停用或删除 MultiHTML 1.5 CGI 脚本，该软件已停止维护且无安全更新。如业务必须使用，在 Web 服务器层面（如 Apache 的 mod_rewrite 或 Nginx 的 location 规则）限制对 multihtml.pl 的访问，仅允许白名单 IP 调用；同时修改脚本代码，对 multi 参数做严格过滤，拒绝包含 ../ 或 %00 空字节的输入，并将脚本运行用户权限降至最低（如 nobody），禁止读取 /etc/passwd 等敏感文件。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "MultiHTML CGI 脚本任意文件读取漏洞"
updated = "2026-06-16T21:52:44.943"

