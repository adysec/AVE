[basic]
description = "Blueimp jQuery-File-Upload 组件（版本 ≤ 9.22.0）存在未授权任意文件上传漏洞。该漏洞源于文件上传功能未对上传文件类型进行有效校验，未认证的远程攻击者可通过向目标服务器上传恶意的 PHP 等可执行脚本文件，直接获取 WebShell 权限，进而完全控制服务器。攻击无需任何身份认证，仅需目标部署了受影响版本的 jQuery-File-Upload 组件且上传目录可执行脚本即可利用。该漏洞影响大量使用该组件的 Web 应用，CVSS 评分 9.8，危害等级严重。"
published = "2018-10-11T15:29:00.640"
remediation = "立即升级 Blueimp jQuery-File-Upload 至 v9.22.1 或更高版本，该版本修复了未经验证的文件上传漏洞。如无法升级，可在服务端 upload 目录配置严格的文件类型白名单（仅允许图片等安全类型），并对上传接口添加身份认证与 CSRF 防护作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Blueimp jQuery-File-Upload 任意文件上传漏洞"
updated = "2026-06-17T02:06:14.080"

