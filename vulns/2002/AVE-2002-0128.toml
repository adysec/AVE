[basic]
description = "Linux 内核及部分其他操作系统在处理分片 ICMP 数据包时存在内存信息泄露漏洞。远程攻击者可通过向目标系统发送特制的分片 ICMP 报文，当报文触发 TTL 超时后，系统生成的 ICMP TTL Exceeded 响应数据包中会包含内核内存中的部分数据，导致敏感信息泄露。该漏洞攻击复杂度低，无需身份认证即可远程利用，CVSS 评分 5.0，影响范围广泛。"
published = "2002-01-31T05:00:00Z"
remediation = "立即升级 Linux 内核至厂商修复版本。Red Hat 已发布 RHSA-2002-007 安全公告，建议更新内核至包含 ICMP 分片包内存泄露修复的版本。如无法立即升级，可在边界防火墙上配置规则丢弃异常分片 ICMP 数据包，并启用内核 sysctl 参数 net.ipv4.icmp_ignore_bogus_error_responses=1 以缓解风险。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux kernel ICMP分片包内存信息泄露漏洞"
updated = "2026-06-16T21:56:39Z"

