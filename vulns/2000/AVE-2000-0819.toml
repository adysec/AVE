[basic]
description = "McAfee WebShield SMTP 4.5 在处理 SMTP 协议的收件人字段时存在输入验证缺陷，当接收到含有畸形收件人字段的邮件时，软件无法正确解析该数据，导致服务崩溃或拒绝响应。未经身份认证的远程攻击者可向目标邮件服务器发送特制的 SMTP 邮件来利用此漏洞，使其停止处理邮件服务。该漏洞影响 McAfee WebShield SMTP 4.5 及之前版本，CVSS 评分为 5.0，危害等级中等。McAfee 官方已发布修复补丁，建议用户及时升级以修复此问题。"
published = "2001-01-09T05:00:00.000"
remediation = '建议将 WebShield SMTP 4.5 升级至 McAfee Email Gateway 等受支持的邮件安全产品，并在邮件网关前增加 SMTP 会话过滤规则，拒绝收件人字段中包含连续六个及以上 "%20" 的入站邮件，防止畸形邮件头触发访问冲突导致服务中断。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Network Associates WebShield SMTP 4.5 拒绝服务漏洞"
updated = "2026-06-16T21:53:12.690"

