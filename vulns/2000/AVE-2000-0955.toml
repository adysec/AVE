[basic]
description = "Check Point VPN-1/FireWall-1 4.1 及更早版本中的 OPSEC 通信认证机制（fwn1）存在身份验证绕过漏洞。远程攻击者无需身份认证即可通过网络向目标系统发送特制数据包，利用该漏洞伪造合法连接，从而获取对受保护网络的未授权访问权限。成功利用后，攻击者可窃取敏感信息、篡改数据或执行恶意操作，对系统机密性、完整性和可用性均造成影响。该漏洞 CVSS 评分 7.5，危害等级高。"
published = "2000-11-14T05:00:00.000"
remediation = "立即升级 Check Point VPN-1/FireWall-1 至 4.1 Service Pack 2 及以上版本，该漏洞已在后续版本中修复。如无法升级，可在防火墙上配置访问控制规则，限制 OPSEC 通信端口（默认 TCP 18184）仅允许受信任的管理站 IP 访问，并启用 OPSEC 通信加密认证。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Check Point VPN-1/FireWall-1 OPSEC 认证欺骗漏洞"
updated = "2026-06-16T21:52:31.310"

