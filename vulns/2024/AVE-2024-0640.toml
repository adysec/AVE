[basic]
description = "Linux 内核 DRM/AMD Display 驱动中的 dml ceil/floor 辅助函数（dcn_bw_ceil2 和 dcn_bw_floor2）缺少对 granularity 参数的零值检查，当传入零值时触发除零错误，导致内核崩溃（拒绝服务）。本地低权限攻击者可利用此漏洞造成系统可用性受影响。该漏洞影响 Linux 内核各发行版，CVSS 评分 5.5，危害等级中等。修复补丁已合入主线内核，需更新至包含该修复的内核版本。"
published = "2025-01-19T12:15:26Z"
remediation = "立即更新 Linux 内核至包含提交 f6e09701c3eb2ccb8cb0518e0b67f1c69742a4ec 的版本（主线内核 ≥ 6.13，或各发行版已合入该补丁的内核包）。Ubuntu 20.04 LTS 用户升级至 linux-image-5.15.0-1077-intel-iotg 及以上版本；Debian 11 用户应用 DLA-4075-1 安全更新。如无法立即升级，可通过禁用受影响 AMD GPU 的显示模式库（DML）相关功能模块作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux AMD Display 驱动除零错误漏洞"
updated = "2026-06-17T08:14:14Z"

