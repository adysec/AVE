[basic]
description = "Mozilla Firefox 和 Thunderbird 的 nsDocShell 析构函数中存在竞争条件漏洞。当 nsDocShell 对象被销毁时，存在一个竞态窗口，攻击者可以利用该窗口触发释放后重用（use-after-free），从而可能导致任意代码执行。该漏洞影响 Firefox 低于 74.0.1 的版本、Firefox ESR 低于 68.6.1 的版本以及 Thunderbird 低于 68.7.0 的版本。攻击者可通过构造特制的网页内容或邮件，诱导用户浏览恶意页面或打开恶意邮件以触发该漏洞。由于该漏洞已存在已知的在野定向攻击案例，用户应尽快升级到安全版本以防范潜在威胁。该漏洞由竞争条件（CWE-362）和使用后释放（CWE-416）共同导致，CVSS v3.1 评分为 8.1（高危）。"
published = "2020-04-24T16:15:13.370"
remediation = "升级 Firefox 至 74.0.1 或更高版本，Firefox ESR 升级至 68.6.1 或更高版本，Thunderbird 升级至 68.7.0 或更高版本。如无法立即更新，可在 Firefox 偏好设置中禁用 JavaScript 或安装 NoScript 扩展以限制脚本执行作为临时缓解措施，并避免访问不受信任的网站。"
score = 8.1
severity = "HIGH"
sources = ["kev"]
title = "Mozilla Firefox 及 Thunderbird 释放后使用漏洞"
updated = "2026-06-17T03:23:51.823"

