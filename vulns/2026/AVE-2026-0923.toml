[basic]
description = 'File Browser 的归档构建器存在路径穿越漏洞（zip-slip）。在 Linux 系统中，反斜杠是合法的文件名字符，但归档构建器使用 `strings.ReplaceAll(nameInArchive, "\\", "/")` 将反斜杠替换为路径分隔符 `/`，导致一个名为 `..\..\evil.sh` 的普通文件在生成的 zip/tar 归档中被改写为 `../../evil.sh`。拥有上传权限的攻击者可上传此类包含反斜杠的文件，当其他用户下载并解压该归档时，恶意文件将逃逸到解压目录之外，覆盖目标系统上的配置文件或启动脚本，可能导致远程代码执行。该漏洞影响 File Browser v2.63.6 至 v2.63.16 版本，CVSS 评分 6.8，危害等级中危。厂商已在 v2.63.17 版本中修复。'
published = "2026-07-15T16:16:52Z"
remediation = "立即将 File Browser 升级至 v2.63.17 或更高版本，该版本已修复归档构建器中的反斜杠路径穿越问题。如无法立即升级，可暂时禁用归档下载功能，或限制只有受信任用户拥有上传权限。"
score = 6.8
severity = "MEDIUM"
sources = ["ghsa"]
title = "File Browser 存档构建器路径遍历漏洞"
updated = "2026-07-15T18:15:13Z"

