[basic]
description = "PHP 5.2.x至5.2.14及5.3.x至5.3.3版本中，filter_var函数在FILTER_VALIDATE_EMAIL模式下存在栈消耗漏洞。远程攻击者可通过向该函数提交超长电子邮件地址字符串，触发递归调用导致栈空间耗尽，进而造成目标系统内存资源大量消耗及应用程序崩溃，属于拒绝服务漏洞。该漏洞无需身份认证即可远程触发，攻击复杂度较低。"
published = "2010-10-25T20:01:03Z"
remediation = "升级 PHP 至 5.3.4 或更高版本，该版本已修复 filter_var 函数在 FILTER_VALIDATE_EMAIL 模式下处理超长邮件地址时的栈消耗问题。如无法立即升级，可在代码中避免对不可信输入使用 FILTER_VALIDATE_EMAIL 模式，或限制输入字符串长度。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "PHP filter_var 函数 FILTER_VALIDATE_EMAIL 模式栈消耗拒绝服务漏洞"
updated = "2026-06-16T23:23:23Z"

