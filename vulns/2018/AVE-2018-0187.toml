[basic]
description = "vBulletin 3.x.x 及 4.2.x 至 4.2.5 版本的 redirector.php 文件中存在开放重定向漏洞，由于对 url 参数缺乏充分的合法性校验，远程攻击者可构造特制的恶意链接，诱使用户点击后将其重定向至任意外部站点，导致钓鱼攻击或绕过安全策略。攻击者无需身份认证，但需用户交互配合。该漏洞影响范围广泛，CVSS 评分 6.1，危害等级中危。"
published = "2018-01-25T04:29:00.240"
remediation = "升级 vBulletin 至 4.2.6 或更高版本，该版本已修复 redirector.php 中 url 参数未校验跳转目标的问题。如无法升级，修改 redirector.php 添加白名单校验逻辑，仅允许跳转到本站域名，或直接禁用 redirector.php 文件（通过 .htaccess 或 Nginx 配置返回 403）。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "vBulletin vBulletin 开放重定向漏洞"
updated = "2026-06-17T02:01:30.063"

