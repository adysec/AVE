[basic]
description = "GnuPG (gpg) 1.0.3 版本在处理包含多个文档的文件时，未能正确校验除第一个文档外的所有文档的数字签名。远程攻击者可构造包含多个文档的恶意文件，修改第二个及后续文档的内容而保持第一个文档签名有效，导致签名验证通过但文档内容被篡改。该漏洞影响 GnuPG 1.0.3 版本，CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），攻击复杂度低、无需认证即可远程利用，主要危害数据完整性与机密性。用户在验证多文档签名文件时可能误信篡改后的内容真实有效。"
published = "2000-12-19T05:00:00Z"
remediation = "立即升级 GnuPG 至 1.0.4 或更高版本（修复多文档签名验证缺陷），参考 Red Hat RHSA-2000:089 或 Debian 20001111 安全公告获取补丁包。若暂时无法升级，请避免处理包含多个文档的签名文件，改为逐个文档单独验证签名完整性，并限制 GnuPG 仅以必要最小权限运行。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "GnuPG GnuPG 多文档签名验证绕过漏洞"
updated = "2026-06-16T21:52:53Z"

