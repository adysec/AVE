[basic]
description = "Oracle PeopleSoft Enterprise PeopleTools 的 Updates Environment Management 组件存在身份验证绕过漏洞（CWE-306），未经身份认证的远程攻击者可通过 HTTP 协议向目标系统发送特制请求，利用该组件缺失的关键功能身份验证机制，在无需任何权限的情况下实现 PeopleSoft Enterprise PeopleTools 的完全接管，导致机密性、完整性和可用性全面受损。该漏洞影响 PeopleTools 8.61 和 8.62 版本，攻击复杂度低，无需用户交互，CVSS 评分 9.8，危害等级严重。Oracle 已在关键补丁更新中修复此漏洞，建议升级至 PeopleTools 8.63 及以上版本。"
published = "2026-06-11T04:16:53Z"
remediation = "立即升级 PeopleTools 至 8.63 或更高版本；在 Web 服务器/防火墙层面限制 /psp/ 和 /PSEMHUB/hub 路径仅允许内网 IP 访问；在 JVM 启动参数中添加反序列化过滤器 -Djdk.serialFilter=!* 以阻断 ysoserial 攻击载荷；部署 WAF 规则拦截恶意 HTTP 请求中的 Java 反序列化特征。"
score = 9.8
severity = "CRITICAL"
sources = ["zdi"]
title = "Oracle PeopleSoft Enterprise PeopleTools 未授权接管漏洞"
updated = "2026-07-23T09:10:00Z"

