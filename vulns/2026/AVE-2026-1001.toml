[basic]
description = "MCP Atlassian 的 SSRF 漏洞修复存在 DNS 重绑定 TOCTOU 绕过漏洞。该漏洞通过 CWE-367（竞争条件）利用 CWE-918（SSRF），`validate_url_for_ssrf` 函数在中间件阶段解析并验证主机名后，仅返回验证结果字符串而丢弃已解析的 IP，随后请求在连接时使用原始主机名重新解析，未对 IP 进行锁定。攻击者通过控制域名解析，使首次解析返回合法公网 IP 通过校验，第二次解析返回云元数据地址 169.254.169.254 或内网 IP，导致未认证的 SSRF 攻击，可窃取云环境 IAM 凭证或访问内网服务。影响 mcp-atlassian 小于 0.22.0 的版本（包括已修复的 0.17.0 构建）。攻击者无需身份认证，但需要具备攻击者控制的权威 DNS 重绑定服务，并利用解析与连接之间的时间窗口完成攻击。"
published = "2026-01-01T00:00:00Z"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["ghsa"]
title = "sooperset MCP Atlassian DNS重绑定绕过SSRF防护漏洞"
