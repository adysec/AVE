[basic]
description = "tags.<value>Flowise 是一款通过拖放界面构建自定义大语言模型工作流的工具。该漏洞存在于 Flowise 的删除接口 `/api/v1/chatflows/:id` 中，该接口在授权检查时使用 `checkAnyPermission('chatflows:delete,agentflows:delete')`，仅需持有任一权限即可到达删除逻辑。然而删除逻辑仅通过 id 和 workspaceId 解析目标记录，并未验证目标资源的类型，导致仅有 `agentflows:delete` 权限的用户可以删除 CHATFLOW 类型的工作流，仅有 `chatflows:delete` 权限的用户可以删除 AGENTFLOW 类型的工作流。这破坏了 Chatflows 与 Agentflows 之间预期的 RBAC 权限隔离。攻击者可在同一工作区内使用仅具备单一类型删除权限的 API 密钥，向删除接口发送特制的 DELETE 请求，从而越权删除不属于自己权限范围内的流程类型，造成配置丢失或业务中断。该漏洞影响 Flowise 3.1.3 之前的所有版本，CVSSv4.0 评分为 7.1（高危），用户应升级到 3.1.3 或更高版本进行修复。"
published = "2026-08-04T17:17:01Z"
remediation = "立即将 Flowise 升级至 3.1.3 或更高版本，该版本在删除逻辑中加入了资源类型校验，修复了跨类型删除漏洞。如暂无法升级，应在权限管理层面禁止同一账号同时持有 chatflows:delete 和 agentflows:delete 权限，或通过反向代理对 /api/v1/chatflows/:id 和 /api/v1/agentflows/:id 的 DELETE 请求实施细粒度的访问控制规则，限制仅拥有对应类型权限的用户发起删除操作。"
score = 7.1
severity = "HIGH"
sources = ["ghsa"]
title = "Flowise Flowise 未授权删除漏洞"
updated = "2026-08-05T14:17:11Z"

