[basic]
description = "IBM WebSphere Application Server 3.0.2 的 Server Plugin 组件存在缓冲区溢出漏洞。远程攻击者可通过向目标服务器发送特制的超长 Host 请求头触发该漏洞，导致缓冲区溢出，进而实现任意命令执行。该漏洞无需身份认证即可远程利用，攻击复杂度低，可完全控制受影响系统。影响 IBM WebSphere Application Server 3.0.2 版本，CVSS 评分 10.0，危害等级严重。"
published = "2000-11-14T05:00:00.000"
remediation = "升级 IBM WebSphere Application Server 至 3.0.2.2 或更高版本（Fix Pack 2），该补丁修复了处理 Host 请求头时的缓冲区溢出问题。如无法立即升级，可在反向代理或 Web 服务器层对 Host 请求头长度进行限制（建议不超过 255 字节），并过滤包含异常长 Host 头的请求。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "IBM WebSphere Application Server 服务器插件缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:35.657"

