[info]
author = "AVE"
description = "检测目标是否运行存在CVE-2001-0089漏洞的Internet Explorer 5.0-5.5版本，通过构造包含INPUT TYPE=FILE元素的HTML表单实现客户端任意文件读取"
id = "POC-AVE-2001-0037"
name = "Microsoft Internet Explorer 5.0-5.5 File Upload via Form PoC"
severity = "medium"
tags = ["ave-2001-0037"]
vuln_id = [
    "CVE-2001-0089",
    "AVE-2001-0037",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = [
    "MSIE 5.0",
    "MSIE 5.01",
    "MSIE 5.5",
]
