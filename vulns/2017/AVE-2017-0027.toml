[basic]
description = "dayrui FineCMS 5.0.10 及之前版本中存在跨站脚本（XSS）漏洞，位于 controllers/api.php 文件中。远程攻击者可通过向目标系统发送特制的 c=api&m=data2 请求，在 function 参数中注入恶意脚本代码，当管理员或其他用户访问受影响页面时，恶意脚本将在浏览器中执行，导致敏感信息泄露或会话劫持。攻击者无需身份认证，但需要用户交互（点击链接或访问特定页面）。该漏洞影响 FineCMS 5.0.10 及更早版本，CVSS 评分 6.1，危害等级中危。"
published = "2017-07-26T08:29:00Z"
remediation = "升级 FineCMS 至 5.0.9 及以上版本（如 5.0.9 已修复该漏洞）；若无法升级，手动编辑 dayrui/controllers/api.php 中 data2 函数，对 $function 参数使用 htmlspecialchars() 或 strip_tags() 过滤后输出；建议迁移至仍在维护的 CMS 系统。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "dayrui FineCMS 跨站脚本攻击漏洞"
updated = "2026-06-17T01:02:06Z"

