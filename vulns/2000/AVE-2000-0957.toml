[basic]
description = "Check Point VPN-1/FireWall-1 4.1 及更早版本的模块间通信机制中的协议检查器 Getkey 函数存在缓冲区溢出漏洞。远程攻击者无需身份认证即可通过网络向目标系统发送特制的恶意数据包，触发缓冲区溢出，导致防火墙服务崩溃或拒绝服务。该漏洞影响 Check Point VPN-1/FireWall-1 4.1 及之前版本，CVSS 评分 5.0，危害等级中危。厂商已发布安全更新修复此漏洞。"
published = "2000-11-14T05:00:00Z"
remediation = "升级 Check Point VPN-1/FireWall-1 至 4.1 以上已修复版本（如 4.1 SP2 或更高），该漏洞在 Getkey 协议检查器组件中存在缓冲区溢出，远程攻击者可发送特制数据包触发拒绝服务。如无法立即升级，可在防火墙上配置访问控制规则，限制不可信 IP 对 VPN-1/FireWall-1 管理通信端口的访问，并禁用不必要的协议检查模块以降低攻击面。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Check Point VPN-1/FireWall-1 协议检查器缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:31Z"

