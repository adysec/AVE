[info]
author = "ave"
description = "检测 vLLM 版本是否低于 0.24.0，该版本存在推测性解码状态处理缺陷导致的远程拒绝服务漏洞（CVE-2026-54234）"
id = "POC-AVE-2026-0499"
name = "vLLM 远程拒绝服务漏洞 PoC"
severity = "high"
tags = ["ave-2026-0499"]
vuln_id = [
    "CVE-2026-54234",
    "AVE-2026-0499",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/version"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "0.23",
    "0.22",
    "0.21",
    "0.20",
    "0.19",
    "0.18",
    "0.17",
    "0.16",
    "0.15",
    "0.14",
    "0.13",
    "0.12",
    "0.11",
    "0.10",
    "0.9",
    "0.8",
    "0.7",
    "0.6",
    "0.5",
    "0.4",
    "0.3",
    "0.2",
    "0.1",
]
