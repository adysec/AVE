[basic]
description = "Ikonboard 2.1.7b 及更早版本中的 register.cgi 存在远程命令执行漏洞。攻击者可通过向 SEND_MAIL 参数传递特制数据，覆盖程序内部用于引用可执行程序的变量，从而在服务器上以 Web 进程权限执行任意命令。该漏洞无需身份认证即可远程利用，CVSS 评分 10.0，可导致服务器完全失陷。"
published = "2001-02-12T05:00:00.000"
remediation = "Ikonboard 已停止维护，官方未发布补丁。建议立即迁移至仍受支持的论坛软件（如 phpBB、Simple Machines Forum 或 Discourse），迁移前导出数据库和配置文件。临时缓解措施：在 Web 服务器层面删除或重命名 register.cgi 文件，并限制 CGI 目录的执行权限（如 Apache 中 `Options -ExecCGI`），同时配置 WAF 规则拦截包含 SEND_MAIL 参数的请求。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Ikonboard register.cgi 远程命令执行漏洞"
updated = "2026-06-16T21:53:36.673"

