[basic]
description = "` tags.<value>Loofah Ruby 库的 HTML5 清洗器存在跨站脚本（XSS）绕过漏洞。当使用 `Loofah::HTML5::Scrub.allowed_uri?` 方法验证用户控制的 URL 时，攻击者可通过在 URI 方案中使用不带分号的数字字符引用（如 `&#58` 表示冒号、`&#9` 表示制表符）来绕过安全检测。浏览器会解码这些字符引用并将 URL 解析为可执行的 `javascript:` 方案，而 `allowed_uri?` 方法因仅检测带分号的字符引用而将其误判为安全。该漏洞影响直接调用 `allowed_uri?` 的应用及基于其构建的功能，例如 Ruby on Rails 8.2 中 Action Text 的 Markdown 链接验证功能。攻击者需控制用户输入中的 URL 内容，在浏览器渲染时触发 JavaScript 执行，实现跨站脚本攻击。升级到 Loofah >= 2.25.2 可修复此问题。"
published = "2026-01-01T00:00:00Z"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Loofah HTML 净化库跨站脚本绕过漏洞"
updated = "2026-01-01T00:00:00Z"

