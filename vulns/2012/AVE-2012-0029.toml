[basic]
description = "Apple QuickTime 7.7.2 之前版本在 Windows 平台上存在基于栈的缓冲区溢出漏洞。当用户通过 QuickTime 打开包含特制文件路径的多媒体文件时，程序在处理文件路径名时未正确验证输入长度，导致栈缓冲区溢出。远程攻击者可利用此漏洞，诱使用户访问恶意构造的文件或链接，触发缓冲区溢出，从而实现任意代码执行或导致应用程序崩溃。该漏洞影响所有 Windows 平台上的 QuickTime 7.7.2 之前版本，CVSS 评分 9.3，危害等级严重。Apple 已发布 QuickTime 7.7.2 版本修复此漏洞。"
published = "2012-05-16T10:12:56Z"
remediation = "立即将 Apple QuickTime 升级至 7.7.2 或更高版本，该版本已修复文件路径处理中的栈缓冲区溢出漏洞。用户可通过 Apple 官方支持页面（http://support.apple.com/kb/HT5261）获取更新。由于 Apple 已停止对 Windows 版 QuickTime 的安全支持，建议卸载 QuickTime for Windows 并改用 VLC 等替代播放器；如无法卸载，应在浏览器中禁用 QuickTime 插件并阻止其处理来自不可信来源的媒体文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime 文件路径栈缓冲区溢出漏洞"
updated = "2026-06-16T23:37:00Z"

