[basic]
description = "Sudo 1.6.x 版本中的密码提示功能存在堆溢出漏洞，当用户输入超长密码时，程序在内存分配过程中未正确校验缓冲区边界，导致堆内存被越界写入。本地攻击者可通过构造特制的超长密码字符串触发该漏洞，覆盖堆内存中的关键数据结构，进而实现权限提升至 root 级别。该漏洞影响所有 Sudo 1.6.x 版本，攻击者需拥有本地系统访问权限，利用难度较低，危害严重。"
published = "2002-05-16T00:00:00Z"
remediation = "升级 Sudo 至 1.6.6 或更高版本，该版本修复了 -p 参数中特殊字符未正确展开导致的堆缓冲区溢出问题。各发行版用户可通过官方渠道安装对应安全更新（如 Debian DSA-128、RedHat RHSA-2002:071）。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Sudo 1.6.x 密码提示堆溢出漏洞"
updated = "2002-05-16T00:00:00Z"

