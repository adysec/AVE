[basic]
description = "Windows 内核在处理内存对象时存在管理缺陷，导致特权提升漏洞。攻击者可通过在受影响系统上执行特制的恶意代码，利用该内存处理漏洞将低权限账户权限提升至系统级最高权限（SYSTEM）。该漏洞影响 Windows 7、Windows 8.1、Windows 10 以及 Windows Server 2008/2012/2016/2019 等多个版本。攻击条件要求攻击者拥有本地低权限访问权限，成功利用后可实现对目标系统的完全控制。"
published = "2018-12-12T00:29:00Z"
remediation = "建议立即安装微软 2018 年 12 月发布的累积安全更新（针对各版本 Windows 操作系统），或通过 Windows Update 自动升级到最新补丁版本。对于无法立即更新的系统，建议限制本地低权限用户的执行权限，以降低攻击者利用该漏洞提升至内核权限的风险。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows 内核特权提升漏洞"
updated = "2026-06-17T02:05:11Z"

