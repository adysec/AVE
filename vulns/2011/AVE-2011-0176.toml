[basic]
description = "Google Chrome 17.0.963.65 之前版本在处理 SVG 值时存在释放后使用（Use-After-Free）漏洞，远程攻击者可通过构造恶意 SVG 内容诱导用户访问，触发内存释放后重复引用，导致浏览器崩溃拒绝服务或可能执行任意代码。该漏洞影响 Chrome 17.0.963.65 之前所有版本，攻击向量为网络，攻击复杂度中等，无需身份认证，可导致部分机密性、完整性和可用性影响（CVSS 6.8）。Google 已在 Chrome 17.0.963.65 版本中修复该漏洞，用户升级至该版本或更高版本即可修复。"
published = "2012-03-05T19:55:01Z"
remediation = "升级 Google Chrome 到 17.0.963.65 或更高版本，获取针对 SVG 处理和内存管理的问题的补丁修复，如无法立即更新，可临时禁用 Chrome 中 SVG 内容加载功能以降低利用风险。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome SVG值处理释放后使用漏洞"
updated = "2026-06-16T23:32:27Z"

