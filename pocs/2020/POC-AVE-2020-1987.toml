[info]
author = "ave"
description = "AVE-2020-1987 verification"
id = "POC-AVE-2020-1987"
name = "PoC for AVE-2020-1987"
severity = "medium"
tags = ["ave-2020-1987"]
vuln_id = [
    "AVE-2020-1987",
    "CVE-2020-9377",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/api/"
protocol = "http"

[poc.requests.body]
content = '{"type":"op","cmd":"show system info","key":"{{apikey}}"}'
type = "json"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["system"]
