[basic]
description = "tags matters.<value>Google 浏览器（Chromium）的 Blink 渲染引擎中存在 Free-after-use（释放后使用）漏洞，在处理特定的 HTML 页面时，对已释放内存对象仍进行引用，导致内存被破坏。远程攻击者无需认证，仅需诱导受害用户通过浏览器访问精心构造的恶意网页即可触发该漏洞，成功利用后可导致堆内存破坏乃至远程代码执行，或使目标进程崩溃造成拒绝服务。该漏洞影响 Google Chrome 89.0.4389.128 之前版本，CVSS 评分 8.8,危害等级高危。Google 已在 2021 年 4 月发布安全更新修复，并确认已遭在野利用，建议用户及时升级至 Chrome 89.0.4389.128 及以上版本。"
published = "2021-04-26T17:15:08Z"
remediation = "建议立即将 Google Chrome 升级至 89.0.4389.128 或更高版本，并建议用户通过 Chrome 菜单「帮助→关于 Google Chrome」触发自动更新，或从 Chrome 官方下载页手动安装最新版本。同时排查使用 Chromium 内核的浏览器（如 Edge、Opera、Brave）及其内嵌 WebView/Electron 组件的应用，升级至包含 89.0.4389.128 修复的版本。该漏洞为远程攻击者通过精心构造的 HTML 页面触发的堆破坏，属于 UAF，已被 CISA KEV 收录，请优先处理并限制不可信网页的访问；无法立即升级的终端，可禁用或隔离访问不受信任外部内容的场景，并通过 Web 代理拦截高危页面作为临时缓解。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome Blink 模块使用后释放（Use-after-free）远程代码执行漏洞"
updated = "2026-06-17T03:35:02Z"

