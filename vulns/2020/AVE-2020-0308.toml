description = "CVE-2020-11978是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2020-07-17T00:15:10Z"
remediation = "建议立即升级到 Apache Airflow 1.10.11 或更高版本以彻底修复该命令注入漏洞。如暂时无法升级，可在 airflow.cfg 配置文件中将 load_examples 设置为 False 并重启 airflow webserver/scheduler/worker 服务，禁用示例 DAG 作为临时缓解措施。同时建议审计自定义 DAG 目录，移除或修复包含 execute() 或 BashOperator 命令注入风险的 DAG 文件。"
