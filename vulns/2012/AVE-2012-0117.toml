[basic]
description = "Apple iOS 5.1 之前版本、iTunes 10.6 之前版本以及 Safari 5.1.4 之前版本中使用的 WebKit 引擎存在未明内存破坏漏洞（CWE-119）。远程攻击者可诱导用户访问特制网站，通过触发 WebKit 内存处理错误导致内存损坏和应用程序崩溃，进而实现任意代码执行。该漏洞无需用户交互即可利用，CVSS 评分 9.3，危害等级严重。Apple 已在 2012 年 3 月安全更新中修复此漏洞。"
published = "2012-03-08T22:55:03Z"
remediation = "将 Apple Safari 升级至 5.1.4 或更高版本，将 iOS 升级至 5.1 或更高版本，将 iTunes 升级至 10.6 或更高版本。对于无法立即升级的 iOS 设备，建议限制访问不可信网站，并启用 Safari 的欺诈性网站警告功能作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple iOS 和 iTunes WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:57Z"

