[basic]
description = "Open WebUI 在渲染聊天内容中的 vega 和 vega-lite 围栏代码块时，在用户浏览器中构建 Vega 视图但未使用受限资源加载器，导致存在客户端服务端请求伪造（SSRF）漏洞。攻击者可通过在聊天、频道消息或共享对话中插入包含 Vega/Vega-Lite 图表的恶意代码块，诱使其他用户打开查看，使受害者浏览器向攻击者指定的外部地址发起 GET 请求，并从同源或允许跨域的响应中读取数据，从而绕过服务端 SSRF 防护机制探测内网主机、端口及站点端点。该漏洞影响 0.6.34 至 0.11.0 之前的 Open WebUI 版本，利用需要受害者主动打开包含恶意图表的消息，无需额外交互。官方已在 0.11.0 版本中通过限制资源加载器仅允许 data: 协议和同源请求修复此问题，用户升级至 0.11.0 即可缓解。"
published = "2026-08-04T20:16:54Z"
remediation = "请立即将 Open WebUI 升级至 0.11.0 或更高版本，该版本已通过限制 Vega 资源加载器仅允许 data: URI 和同源资源来修复此漏洞。升级方式为通过 pip 执行 pip install --upgrade open-webui，或使用容器镜像 ghcr.io/open-webui/open-webui:main 拉取最新镜像后重新部署。如暂时无法升级，可在反向代理层（如 Nginx）对聊天消息接口增加 Vega/Vega-Lite JSON 块的正则过滤规则，拦截包含外部 URL 的 data.url 字段，作为临时缓解措施。"
score = 4.1
severity = "MEDIUM"
sources = ["ghsa"]
title = "Open WebUI Vega/Vega-Lite 图表渲染客户端服务端请求伪造漏洞"
updated = "2026-08-05T15:17:09Z"

