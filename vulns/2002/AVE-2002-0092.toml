[basic]
description = "标签包裹。<value>Lynx 2.8.4 及更早版本存在 CRLF 注入漏洞。远程攻击者可通过构造包含编码回车符、换行符及空白字符的恶意 URL，在通过命令行参数传递给 Lynx 的 HTTP 请求中注入虚假 HTTP 头部。该漏洞影响使用命令行方式调用 Lynx 并访问不可信 URL 的场景，攻击者无需身份认证即可在网络可达的前提下实施利用，可能导致 HTTP 请求被篡改或欺骗。"
published = "2003-02-19T05:00:00.000"
remediation = "升级 Lynx 至 2.8.5 或更高版本（该版本修复了命令行 URL 的 CRLF 注入漏洞）。若暂时无法升级，可通过以下缓解措施：1) 避免在命令行直接传递不可信 URL，改用配置文件或交互模式；2) 在应用层过滤用户输入中的 %0D、%0A、%0d、%0a 等编码字符；3) 使用代理或 WAF 拦截包含 CRLF 序列的异常请求。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Lynx 浏览器 CRLF 注入漏洞"
updated = "2026-06-16T21:59:16.067"

