[basic]
description = "Apache 1.3.24 之前版本在记录日志时，即使双反向 DNS 查询失败，仍会记录 IP 地址反向查询返回的伪造主机名，导致日志条目中记录的主机名不可信。远程攻击者可通过构造虚假的 DNS PTR 记录，使 Apache 日志中显示伪造的主机名，从而隐藏攻击的真实来源 IP，给日志审计和溯源分析带来困难。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 Apache 至 1.3.24 或更高版本，该版本修复了反向 DNS 查询验证逻辑，在双反向解析失败时记录原始 IP 而非伪造主机名。如无法升级，可在 httpd.conf 中将 HostnameLookups 设为 Off 并启用 mod_log_forensic 记录真实 IP 作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Apache HTTP Server 反向查询日志主机名欺骗漏洞"
updated = "2026-06-16T22:00:39Z"

