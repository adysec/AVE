[basic]
description = "Denicomp Winsock RSHD/NT 中的 wrshdsp.exe 服务进程存在拒绝服务漏洞。远程攻击者无需身份认证即可通过向目标系统发送特制的端口号参数触发该漏洞：在 2.20.00 及更早版本中，传递负数等无效端口号会导致服务进程尝试连接该端口及 1024 以下所有端口，造成 CPU 资源耗尽；在 2.21.00 版本中，传递端口号 1024 同样会触发 CPU 过度消耗。攻击者只需具备网络访问能力即可实施攻击，导致目标服务不可用，影响系统正常运行。"
published = "2001-12-08T05:00:00Z"
remediation = "建议立即将 Denicomp Winsock RSHD/NT 升级至 2.24.01 或更高版本（厂商官网已发布修复版本）。如无法立即升级，可在防火墙层面限制对 TCP 514 端口的访问，仅允许受信任的源 IP 连接；同时在服务配置中禁用不必要的 rsh 功能，并通过主机等价表严格限制可访问的远程用户。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Denicomp Winsock RSHD/NT 拒绝服务漏洞"
updated = "2026-06-16T21:55:44Z"

