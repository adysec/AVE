[basic]
description = "NETGEAR WNR2000 系列路由器（含 WNR2000v3 1.1.2.14 之前、WNR2000v4 1.0.0.66 之前、WNR2000v5 1.0.0.42 之前固件）管理 Web 应用存在缓冲区溢出漏洞（CWE-120，厂商编号 PSV-2016-0261）。攻击者无需身份认证，可通过网络向管理接口提交特制参数触发溢出，实现认证绕过并执行任意代码，进而完全控制设备。该漏洞 CVSS 评分 9.8，危害等级严重，影响上述未及时升级固件的家用路由设备。"
published = "2017-05-26T20:29:00Z"
remediation = "请将 NETGEAR WNR2000v3 固件升级至 1.1.2.14 或更高版本，WNR2000v4 升级至 1.0.0.66 或更高版本，WNR2000v5 升级至 1.0.0.42 或更高版本；可在管理界面“高级 > 管理 > 固件更新”中手动上传官方固件完成升级。若暂时无法升级，应关闭远程管理（WAN 侧管理）、将管理界面仅限内网访问，并在防火墙上限制对路由器 Web 管理端口的入站访问。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Netgear WNR2000系列路由器缓冲区溢出远程代码执行漏洞"
updated = "2026-06-17T01:23:13Z"

