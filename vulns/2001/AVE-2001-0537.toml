[basic]
description = "XFree86 Xserver 4.1.0-2 中的 dexconf 脚本在创建 /dev/dri 目录时使用了不安全的权限设置（666），导致所有本地用户均可对该目录进行读写操作。本地攻击者可利用此权限配置缺陷，在 /dev/dri 目录中替换或创建恶意文件，进而影响根文件系统的完整性。该漏洞需要攻击者拥有本地系统访问权限，无法远程利用，CVSS 评分 3.6，危害等级低。受影响的版本包括 XFree86 Xserver 4.1.0-2，建议升级到修复版本或手动修正 /dev/dri 目录权限。"
published = "2003-07-24T04:00:00Z"
remediation = "升级 XFree86 至 4.1.0 补丁版本（Red Hat Enterprise Linux 2.1 用户安装 RHSA-2003:065 更新包），或手动将 /dev/dri 目录权限修正为 755（chmod 755 /dev/dri），并检查 dexconf 脚本确保启动时不再错误设置权限。Sun Solaris 用户应安装 Sun 补丁 228529-1。"
score = 3.6
severity = "LOW"
sources = ["redhat"]
title = "XFree86 Xserver dexconf /dev/dri 目录权限设置不安全漏洞"
updated = "2026-06-16T21:56:13Z"

