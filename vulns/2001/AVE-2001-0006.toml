[basic]
description = "Lotus Domino 5.0.5 Web 服务器存在目录遍历漏洞，远程攻击者无需身份认证即可通过向服务器发送包含 `../` 序列的特制 HTTP 请求，绕过路径限制访问服务器文件系统上的任意文件。该漏洞可导致敏感信息泄露（如配置文件、密码文件等），攻击条件低，仅需网络可达即可利用。目前已存在公开的 ExploitDB 利用代码（ID: 20530）。"
published = "2001-02-12T05:00:00Z"
remediation = "建议将 Lotus Domino Server 升级至 5.0.6 或更高版本，该版本已修复目录遍历漏洞。如无法升级，可在 Web 服务器配置中禁用 `..` 路径解析，或通过反向代理规则过滤包含 `../` 的 URL 请求路径。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Lotus Domino Server 5.0 目录遍历漏洞"
updated = "2026-06-16T21:53:28Z"

