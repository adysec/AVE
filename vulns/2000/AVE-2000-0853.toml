[basic]
description = "GCC 和 G++ 编译器（3.3.3 及更早版本）中的 `-ftrapv` 编译选项未能完整处理所有类型的整数溢出情况，导致即使启用了该溢出检测选项，编译出的应用程序仍可能存在整数溢出漏洞。远程攻击者可利用受影响应用程序中的整数溢出缺陷，导致信息泄露、数据篡改或服务异常，危害等级高。建议升级 GCC 至 3.4.0 及以上版本，或采用其他整数溢出防护机制。"
published = "2000-11-01T05:00:00Z"
remediation = "升级至 GCC 3.4.0 或更高版本，该版本已修复 libgcc2.c 中整数溢出检测算法的缺陷。如无法升级编译器，应避免依赖 -ftrapv 选项作为唯一的安全防护手段，同时在代码中手动添加整数溢出检查（如将 signed 运算结果与操作数比较），或使用 -Wstrict-overflow 等编译选项辅助检测溢出风险。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "GNU GCC 和 G++ 整数溢出检测不完整漏洞"
updated = "2026-06-16T21:53:24Z"

