[basic]
description = "SmartWin CyberOffice Shopping Cart 2.0（又称 CyberShop）默认安装时，_private 目录被赋予全局可读权限，导致未经身份认证的远程攻击者可直接访问该目录。该目录中存放包含客户订单及未加密信用卡信息的 Microsoft Access 数据库文件（shopping_cart.mdb），攻击者仅需通过浏览器向目标站点发送类似 http://target/_private/shopping_cart.mdb 的请求即可下载并获取敏感客户数据。该漏洞影响运行 Windows NT 4.0 或 Windows 2000 的电子商务网站，攻击条件极为宽松，无需任何认证即可完成利用，可能导致大规模客户隐私泄露及经济损失。"
published = "2000-12-19T05:00:00.000"
remediation = "通过 IIS 管理控制台或 FrontPage Explorer 移除 _private 目录的读取权限，仅保留写入权限以阻止远程用户下载 shopping_cart.mdb；并将数据库迁移至 /fpdb 目录。长期建议将存储引擎从 Access (MDB) 升级为 SQL Server，并对数据库中的客户敏感信息启用加密存储。此后需定期检查目录访问权限配置，确保无世界可读文件夹暴露。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "SmartWin CyberOffice Shopping Cart 2.0 客户端敏感信息泄露漏洞"
updated = "2026-06-16T21:52:46.800"

