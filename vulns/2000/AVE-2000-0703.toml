[basic]
description = "HP-UX 11.00 和 10.20 版本的 crontab 程序存在符号链接跟随漏洞，本地攻击者可利用 crontab -e 编辑功能创建指向任意目标文件的符号链接，在编辑会话中退出时，crontab 会生成包含目标文件内容的错误信息，导致敏感文件泄露。该漏洞影响 HP-UX 11.00/10.20 系统，CVSS 评分 5.5（中危），攻击向量为本地，需低权限用户交互，无需用户干预，主要影响机密性。攻击者需具备本地账户且能执行 crontab 命令，通过竞争条件在编辑窗口期替换文件为符号链接实现任意文件读取。"
published = "2000-12-19T05:00:00Z"
remediation = "建议立即安装 HP-UX 11.00 Service Pack 01 或 HP-UX 11.0A 支持补丁（PH23456）修复 crontab 漏洞。升级到 PH23456 或更高版本可修复 crontab 通过 -e 选项读取任意文件的问题。通过添加文件权限检查和防止符号链接攻击的代码修改，防止未经授权的 symlink 读取攻击。在升级前，如无法立即应用补丁，可在 crontab.allow 文件中限制用户权限，并通过 chroot 沙盒化 crontab 编辑环境作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["epss"]
title = "HP HP-UX crontab 符号链接任意文件读取漏洞"
updated = "2026-06-16T21:52:53Z"

