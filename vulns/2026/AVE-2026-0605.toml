[basic]
description = "Coder 的 `coder open app` 命令在打开外部工作区应用 URL 时未对 URL 协议和主机进行验证。当外部应用 URL 中包含 `$SESSION_TOKEN` 占位符时，CLI 会将其替换为用户的真实会话令牌，然后将该 URL 交给操作系统打开处理。攻击者可通过控制恶意工作区模板，定义包含 `$SESSION_TOKEN` 的外部应用 URL，当受害者运行 `coder open app` 时，会将会话令牌发送给攻击者，导致账户被完全冒充。攻击者还可利用此路径调用任意本地 URI 协议处理程序。该漏洞影响 Coder 2.29.7 之前、2.32.7 之前、2.33.8 之前和 2.34.2 之前的版本，CVSS 评分为 7.7（高危）。"
published = "2026-07-08T01:16:27Z"
remediation = "立即升级 Coder 至以下版本之一：v2.34.2（推荐）、v2.33.8、v2.32.7 或 ESR 分支 v2.29.17，这些版本修复了外部应用 URL 的会话令牌泄露问题。若暂时无法升级，应禁止在不受信任的工作区中运行 `coder open app` 命令，并在组织层面限制模板作者对外部应用 URL 的配置权限，以降低攻击面。"
score = 7.7
severity = "HIGH"
sources = ["ghsa"]
title = "Coder 远程开发环境 会话令牌泄露漏洞"
updated = "2026-07-08T19:42:45Z"

