[basic]
description = "Hosting Controller 1.x 的 browse.asp 页面存在目录遍历漏洞，远程攻击者可通过向 FilePath 参数传递特制的路径字符串（如 `../`）来读取服务器上的任意目录内容。该漏洞影响 Hosting Controller 1.x 版本，攻击者无需身份认证即可利用，可能导致敏感信息泄露。由于未对用户输入进行充分的路径过滤，攻击者可以遍历文件系统，获取配置文件、日志等敏感数据。"
published = "2002-08-12T04:00:00Z"
remediation = '建议立即安装 Hosting Controller Service Pack 2（SP2），或下载官方补丁 drivebrowse.zip 并覆盖安装到网站根目录。如无法升级，可在 IIS 中移除或限制 /admin/browse.asp 的匿名访问权限，同时在 Web 应用层对 FilePath 参数进行路径合法性校验，禁止包含 ".." 或绝对路径的输入。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Hosting Controller Browse.asp 任意目录文件读取漏洞"
updated = "2026-06-16T21:58:06Z"

