[basic]
description = "WordPress 的 MainWP Dashboard 插件（版本 3.1.2 及之前）存在存储型跨站脚本漏洞，其 mwp_setup_purchase_username 参数因对用户输入缺乏充分的清理和输出转义，导致未经身份认证的攻击者可在页面中注入任意 Web 脚本。当管理员或其他用户访问被注入的页面时，脚本自动执行，可能导致敏感信息泄露、会话劫持或恶意操作。攻击者无需任何权限，仅需向目标发送特制请求即可触发。"
published = "2024-10-16T07:15:04Z"
remediation = '立即将 MainWP Dashboard 插件升级至 3.1.3 或更高版本。登录 WordPress 后台，进入"插件"页面找到 MainWP Dashboard，点击"更新"按钮完成升级。如无法立即更新，可暂时禁用该插件或限制对 /wp-admin/admin-post.php?page=mainwp-setup 路径的访问权限作为临时缓解措施。'
score = 7.2
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress MainWP Dashboard 插件存储型跨站脚本漏洞"
updated = "2026-06-17T00:41:03Z"

