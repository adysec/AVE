[basic]
description = 'Cisco IOS 12.0 至 12.1 版本的 HTTP 服务器在处理包含 "?/" 字符串的 URL 时存在拒绝服务漏洞。远程攻击者无需身份认证即可向目标设备的 HTTP 服务发送特制请求，触发设备崩溃并重新加载，导致正常网络服务中断。该漏洞影响 Cisco IOS 12.0 至 12.1 系列版本，CVSS 评分 5.0，危害等级中等。目前已有公开的 PoC 利用代码，建议用户升级至不受影响的版本或禁用不必要的 HTTP 服务。'
published = "2000-12-19T05:00:00Z"
remediation = "建议将 Cisco IOS 升级至 12.1(3) 或更高版本（12.0 系列升级至 12.0(10) 或更高），该漏洞已在上述版本中修复。如无法立即升级，可在受影响设备的 HTTP 服务器配置中使用 `ip http access-class` 命令限制可访问 HTTP 服务的管理源 IP 地址，或通过 `no ip http server` 命令关闭 HTTP 服务，改用 `ip http secure-server` 仅启用 HTTPS 作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Cisco IOS HTTP Server 拒绝服务漏洞"
updated = "2026-06-16T21:52:54Z"

