[basic]
description = "Valve Half-Life 专用服务器在 3104 版本之前存在远程缓冲区溢出漏洞，攻击者可通过发送超长的 rcon（远程控制台）命令触发栈溢出，进而在服务器进程上下文中执行任意代码。该漏洞影响所有未升级至 3104 及以上版本的 Half-Life 专用服务器，CVSS 评分 10.0（严重），攻击向量为网络、低复杂度、无需认证，可导致机密性、完整性、可用性完全丧失。攻击者只需向开放 rcon 端口的服务器发送精心构造的长字符串即可利用，无需合法凭证即可实现远程代码执行。"
published = "2000-12-19T05:00:00Z"
remediation = "建议立即升级 Half-Life 专用服务器至 build 3104 或更高版本。可从 Valve 官方 SteamCMD 或 HLDS 更新工具下载最新服务端文件并覆盖安装。若暂时无法升级，请在防火墙层面限制 rcon 端口（默认 27015）仅允许受信任管理 IP 访问，并设置强复杂度的 rcon_password 作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "阀值 Half-Life 专用服务器 缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:52:52Z"

