[basic]
description = "GNU CFEngine 中的 cfd 守护程序存在格式字符串漏洞，攻击者可通过 CAUTH 命令中的特制格式字符向目标系统发送恶意数据包，导致远程代码执行。该漏洞影响 GNU CFEngine 1.6.0a11 版本之前的所有用户，攻击者无需身份验证即可通过网络远程触发，从而完全控制目标主机。漏洞 CVSS 评分极高，等级为危急，默认安全补丁未覆盖，风险极其严重。"
published = "2000-12-19T05:00:00.000"
remediation = "立即升级 GNU CFEngine 至 1.6.0a11 或更高版本，修复 cfd 守护进程 CAUTH 命令格式化字符串漏洞。若无法立即升级，请在防火墙层面限制 cfd 守护进程端口（默认 5308/tcp）仅允许受信任管理网段访问，或临时停止 cfd 服务作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "GNU CFEngine 格式字符串漏洞"
updated = "2026-06-16T21:52:49.857"

