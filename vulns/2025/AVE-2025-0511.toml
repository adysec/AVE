[basic]
description = "Google Chrome 142.0.7444.59 之前版本的扩展程序存在不当实现漏洞（CWE-288），攻击者通过诱骗用户安装恶意扩展程序，利用特制的 Chrome 扩展程序绕过导航限制，导致攻击者可在未授权情况下访问受限资源。该漏洞影响 Google Chrome、Microsoft Edge (Chromium-based) 及 Fedora 等使用 Chromium 内核的浏览器产品，CVSS 评分 6.5，危害等级中危。攻击者需诱使用户安装恶意扩展方可利用，无需特殊权限，影响机密性和完整性。Google 已在 Chrome 142.0.7444.59 版本中修复此漏洞。"
published = "2025-11-10T20:15:37Z"
remediation = "立即将 Google Chrome 升级至 142.0.7444.59 及以上版本（通过 Chrome 设置 > 关于 Chrome > 自动检查更新）；Microsoft Edge 用户升级至 142.0.3595.53 及以上版本；基于 Chromium 的其他浏览器参照各自厂商公告更新。Fedora 42 用户执行 `sudo dnf update chrom*` 升级至 142.0.7444.162。如无法立即更新，可在浏览器设置中禁用不可信来源的扩展安装，并审查已安装扩展权限。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome 扩展程序实现不当导致导航限制绕过漏洞"
updated = "2026-06-17T08:32:21Z"

