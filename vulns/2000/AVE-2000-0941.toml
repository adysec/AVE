[basic]
description = "WatchGuard Firebox II 防火墙设备的认证服务存在拒绝服务漏洞。远程攻击者无需身份认证即可向目标设备 TCP 4100 端口发送特制的畸形 URL 请求，触发认证服务处理异常，导致服务崩溃或无法响应正常请求，造成拒绝服务。该漏洞影响 WatchGuard Firebox II 系列防火墙设备，CVSS 评分 5.0，危害等级中危。厂商已发布安全公告并提供修复建议。"
published = "2000-10-20T04:00:00.000"
remediation = "WatchGuard Firebox II 已停产且不再接收安全更新，建议立即将设备替换为仍在支持周期内的 WatchGuard 新一代防火墙（如 Firebox M 或 T 系列），并升级至最新 Fireware OS 版本。如无法立即替换，可在网络防火墙上配置 ACL 规则，限制对端口 4100（认证服务）的访问来源 IP，仅允许受信任的管理网段连接，以降低攻击面。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "WatchGuard Firebox II 认证服务拒绝服务漏洞"
updated = "2026-06-16T21:52:28.320"

