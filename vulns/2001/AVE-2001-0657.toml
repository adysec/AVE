[basic]
description = "GoodTech FTP Server 3.0.1.2.1.0 及更早版本存在拒绝服务漏洞，远程攻击者无需身份认证即可通过向目标 FTP 服务器发送大量并发连接请求，触发服务端连接处理机制异常，导致服务器进程崩溃并停止响应正常服务请求。该漏洞影响运行 GoodTech FTP Server 3.0.1.2.1.0 及更早版本的所有 Windows 系统，攻击者仅需具备网络可达性即可发起利用，无需任何凭据或特殊权限。由于攻击方式简单、仅需建立海量 TCP 连接即可耗尽服务器资源，低门槛的拒绝服务攻击对依赖该 FTP 服务的业务系统构成显著可用性威胁。建议管理员尽快升级至修复版本或采取连接速率限制等缓解措施。"
published = "2001-03-26T05:00:00Z"
remediation = "建议将 GoodTech FTP Server 升级至厂商发布的最新安全版本（高于 3.0.1.2.1.0），若厂商已停止支持，应迁移至当前仍在维护的 FTP 服务器软件。同时，在防火墙或网关设备上配置连接速率限制和最大并发连接数阈值，仅允许可信 IP 地址访问 FTP 服务，并启用入侵检测系统监控异常连接行为，防止连接洪泛攻击。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Goodtech FTP Server 拒绝服务漏洞"
updated = "2026-06-16T21:53:50Z"

