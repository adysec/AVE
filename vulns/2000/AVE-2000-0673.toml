[basic]
description = "Oracle Web Listener for AIX 4.0.7.0.0 及 4.0.8.1.0 版本存在拒绝服务漏洞。远程攻击者无需身份认证即可通过向目标服务器发送特制的畸形 URL 请求，触发 Web 监听器处理异常，导致服务进程崩溃或资源耗尽，造成拒绝服务。该漏洞影响运行在 IBM AIX 系统上的 Oracle Web Listener 服务，攻击者只需能够向目标发送 HTTP 请求即可利用，攻击门槛较低。"
published = "2000-07-05T04:00:00Z"
remediation = "Oracle Web Listener for AIX 4.0.7.0.0 及 4.0.8.1.0 已停止维护，建议立即迁移至受支持的 Web 服务器（如 Oracle HTTP Server 或 IBM HTTP Server）。如无法迁移，可在网络边界防火墙配置规则，过滤包含畸形路径/超长 URL 的入站请求，并限制对 Oracle Web Listener 端口的访问来源 IP。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Oracle Web Listener for AIX 拒绝服务漏洞"
updated = "2026-06-16T21:52:02Z"

