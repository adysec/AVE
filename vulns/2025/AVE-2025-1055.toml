[basic]
description = "Linux 内核 drm/amd/display 模块中的 resource_build_scaling_params 函数存在空指针解引用漏洞。当 pipe_ctx->plane_state 指针为 null 时，函数未进行有效性检查便直接访问该指针，导致内核空指针异常，系统可用性受到严重影响。该漏洞为本地低权限漏洞，攻击者需要具备本地登录权限才能触发，无需用户交互即可造成系统崩溃或拒绝服务。CVSS 评分为 5.5，危害等级中等。Linux 内核社区已在后续版本中通过添加空指针检查修复此问题。"
published = "2025-04-01T16:15:24Z"
remediation = "升级 Linux 内核到包含该修复的版本：Ubuntu 22.04 LTS 升级到 5.15.0-142.152 或更高，Ubuntu 24.04 LTS 升级到 6.8.0-84.84 或更高，Debian 12 升级到 6.1.133-1 或更高，Debian 11 升级到 5.10.237-1 或 6.1.137-1 或更高。如无法立即升级，可临时禁用 AMD GPU 的显示加速功能或避免使用多显示器/显示切换场景以降低触发空指针解引用的风险。修复补丁已合入上游内核 commit 374c9faac5a763a05bc3f68ad9f73dab3c6aec90。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "AMD Linux 内核显示驱动空指针解引用漏洞"
updated = "2026-06-17T08:44:40Z"

