[basic]
description = """
wrapper and markdown-style quotes, which is why the validator says it's empty.

The issue is that the current description field contains `tags.<value>` and is wrapped in triple quotes with content that includes formatting issues. The validator sees it as empty.

I need to generate a proper Chinese description ≥50 characters covering:
- Vulnerability principle: bridge forwarding table spoofing via forged packets
- Impact scope: Linux 2.4.x systems with network bridge functionality
- Attack conditions: remote, unauthenticated, low complexity

Let me write a proper description in Chinese:

Linux 2.4.x 内核中的网桥转发机制存在安全漏洞，未经身份认证的远程攻击者可以通过向目标网桥发送源地址伪装为网桥自身地址的特制以太网帧来欺骗其 MAC 地址转发表。攻击者利用此漏洞可伪造或污染网桥的转发表项，导致网络流量被错误转发，从而可能实施中间人攻击或流量监听。该漏洞影响运行 Linux 2.4.x 内核并使用网桥功能的系统，攻击条件要求攻击者能够直接访问网桥所在的网络段，且无需任何身份验证，攻击复杂度较低。

Let me count characters... This looks to be well over 50 characters. It covers:
- Principle: bridge forwarding table spoofing via forged packets with source address = target address
- Impact: Linux 2.4.x with bridge functionality, can cause MITM or traffic sniffing
- Attack conditions: remote, unauthenticated, direct network access, low complexity

The current description in the TOML actually has decent content but is formatted incorrectly with `tags.<value>` prefix and triple quotes. I need to provide just the clean value.

Wait, I need to be careful. The instructions say "只输出 <value>..."""
published = "2003-08-27T04:00:00Z"
remediation = "立即升级 Linux 内核至 2.4.22-pre3 或更高版本以修复网桥转发表欺骗漏洞。对于仍使用 2.4.x 内核的系统，建议通过系统包管理器安装最新安全更新：Red Hat 系执行 up2date 或 yum update kernel，Debian 系执行 apt-get upgrade。若短期内无法升级内核，可暂时禁用网桥设备的生成树协议（STP）或关闭网桥转发功能作为缓解措施，运行命令：echo 0 > /sys/class/net/brX/bridge/stp_state 或通过 brctl stp brX off 关闭 STP，同时在防火墙层面严格过滤进入网桥接口的伪造源地址报文。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux 2.4.x 网桥转发表欺骗漏洞"
