[basic]
description = "Microsoft XML Core Services（MSXML）在处理内存对象时存在信息泄漏漏洞。攻击者可构造恶意网站，诱使用户通过浏览器访问，从而探测目标系统磁盘上是否存在特定文件，导致敏感信息泄漏。该漏洞影响 Windows 7 SP1、Windows 8.1、Windows 10、Windows Server 2008/2012/2016 等多个 Windows 版本。利用该漏洞需要用户交互（点击链接或浏览网页），无法远程直接利用。Microsoft 已在 2017 年 3 月安全更新中修复此漏洞。"
published = "2017-03-17T00:59:00Z"
remediation = "安装 Microsoft 2017 年 3 月安全更新：Windows 7 SP1 安装 KB4012212，Windows 8.1 安装 KB4012213，Windows 10 各版本安装对应累积更新（如 1607 版安装 KB4013429），也可通过 Windows Update 自动获取。如无法立即打补丁，可配置 IE/Edge 将受影响的 MSXML  ActiveX 控件 killbit 禁用，或使用 0patch 提供的微补丁作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["kev"]
title = "Microsoft XML Core Services 信息泄漏漏洞"
updated = "2026-06-17T00:56:56Z"

