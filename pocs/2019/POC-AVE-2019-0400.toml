[info]
author = "AVE"
description = "检测 Windows AppX Deployment Server (AppXSvc) 符号链接权限提升漏洞。通过检查 AppXSvc 服务 DLL 存在性及 Windows 版本号判断系统是否可能受 CVE-2019-1253 影响。"
id = "POC-AVE-2019-0400"
name = "CVE-2019-1253 PoC"
severity = "high"
tags = ["ave-2019-0400"]
vuln_id = [
    "CVE-2019-1253",
    "AVE-2019-0400",
]

[poc]
logic = "any"

[[poc.requests]]
path = 'C:\Windows\System32\AppXDeploymentServer.dll'
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = "."
type = "regex"
