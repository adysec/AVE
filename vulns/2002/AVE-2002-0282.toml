[basic]
description = "PHP 4.x 至 4.2.2 版本中 mail() 函数存在参数注入漏洞，攻击者可利用该漏洞绕过安全模式（safe_mode）限制，通过 mail() 函数的第五个参数修改传递给邮件传输代理（MTA，如 sendmail）的命令行参数，从而篡改 MTA 行为并可能实现远程命令执行。该漏洞影响使用 PHP 处理邮件功能的 Web 应用程序，攻击者无需身份认证即可在满足特定 PHP 版本和邮件配置条件下触发漏洞，具有较高的危害等级。"
published = "2002-09-24T04:00:00Z"
remediation = "升级到 PHP 4.2.3 或更高版本以修复 mail() 函数第 5 个参数的参数注入漏洞。在无法立即升级的情况下，可在 php.ini 中设置 disable_functions 禁用 mail() 函数，或在 Web 服务器层面限制对 mail() 的调用，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "PHP PHP 参数注入漏洞"
updated = "2026-06-16T21:58:30Z"

