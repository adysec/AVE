[basic]
description = "Apache Tomcat 4.0.5 及更早版本中，当同时启用 invoker servlet 和 default servlet 时存在文件源代码泄露漏洞。远程攻击者可通过特制请求绕过访问限制，读取服务器上的任意文件源代码或绕过某些安全保护机制。该漏洞源于 Tomcat 对 Servlet 请求处理不当，无需身份认证即可远程利用，属于 CAN-2002-1148 的变种。影响所有使用受影响版本的 Apache Tomcat 服务器，CVSS 评分 7.5，危害等级高。"
published = "2003-01-17T05:00:00Z"
remediation = "升级 Apache Tomcat 至 4.0.6 及以上版本（该漏洞已在 4.0.6 中修复）。如无法立即升级，删除 `$CATALINA_HOME/conf/web.xml` 中 invoker servlet 的映射（`/servlet/*`），或禁用 default servlet 的目录列表功能，并限制对 `WEB-INF` 目录的访问。Red Hat 用户可参考 RHSA-2003:075 和 RHSA-2003:082 获取对应发行版的补丁包。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Apache Tomcat 调用 Servlet 文件源码泄露漏洞"
updated = "2026-06-16T21:59:14Z"

