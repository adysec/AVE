[basic]
description = 'Node.js 8.5.0 至 8.6.0 版本中存在目录穿越漏洞（CWE-22），由于路径规范化处理与社区模块的路径名验证逻辑不兼容，远程攻击者无需身份认证即可通过发送特制的 HTTP 请求，利用 "../" 序列绕过路径限制，读取服务器上的任意文件（如 /etc/passwd、应用源码等敏感文件）。该漏洞影响范围广，攻击复杂度低，可导致敏感信息泄露，CVSS 评分 7.5，危害等级高。建议升级至 Node.js 8.6.0 及以上版本修复。'
published = "2017-09-28T01:29:02Z"
remediation = "立即将 Node.js 升级至 8.6.0 及以上版本（8.x 分支建议升级至 8.9.0 LTS 或更高版本），该漏洞在 8.6.0 中已修复。如无法升级，可在反向代理层（如 Nginx）添加路径过滤规则，拦截包含 `../` 的 URL 请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Node.js 目录穿越漏洞"
updated = "2026-06-17T01:06:51Z"

