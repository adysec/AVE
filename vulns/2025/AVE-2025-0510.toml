[basic]
description = "Google Chrome 142.0.7444.59 之前版本的 Media 组件中存在对象生命周期管理缺陷，远程攻击者可通过构造特制的 HTML 页面触发该漏洞，成功利用后可导致 UI 欺骗攻击，窃取用户敏感信息。该漏洞影响 Chrome、Microsoft Edge 等基于 Chromium 的浏览器，攻击无需用户交互及身份认证，CVSS 评分 7.5，危害等级高。Google 已在 Chrome 142.0.7444.59 版本中修复此漏洞。"
published = "2025-11-10T20:15:37Z"
remediation = "升级 Google Chrome 至 142.0.7444.59 及以上版本，或升级 Microsoft Edge 至 142.0.3595.53 及以上版本。Fedora 42 用户执行 `sudo dnf update` 更新至 142.0.7444.162。启用浏览器自动更新功能，确保及时接收安全补丁。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome Media 组件对象生命周期问题漏洞"
updated = "2026-06-17T08:32:21Z"

