[basic]
description = "Microsoft 数据访问组件（MDAC）中的 Internet Publishing Provider（WebDAV）在 8.103.2519.0 及更早版本中未能正确实施安全区域限制机制。远程攻击者无需身份认证，即可通过向目标系统发送特制的 WebDAV 请求绕过 Internet Explorer 的安全区域限制，进而访问本地文件系统或执行本应被安全策略阻止的操作。该漏洞影响 Windows 95/98/98SE/ME/NT/2000 等操作系统，CVSS v2 评分为 7.5（高危），攻击向量为网络，攻击复杂度低，无需交互即可利用。Microsoft 已在 MS01-022 安全公告中发布补丁修复此问题。"
published = "2001-07-02T04:00:00.000"
remediation = "安装微软 2001 年 4 月安全更新 MS01-022，将 msdaipp.dll 升级至修复版本，或通过 Windows Update 自动更新。如无法立即打补丁，可在 Internet 选项的安全区域设置中禁用 Active Scripting 作为临时缓解措施。补丁下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=046E5A26-54D8-4AAB-B3B1-0050C267C2B2"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Windows Data Access Component WebDAV 安全绕过漏洞"
updated = "2026-06-16T21:53:56.457"

