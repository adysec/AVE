[basic]
description = "Apple Safari 浏览器 WebKit 渲染引擎存在跨站脚本漏洞，攻击者可通过构造恶意的 feed:// URL 向目标用户注入任意 JavaScript 代码或 HTML 内容。该漏洞影响 Safari 6.0 之前的所有版本，当用户使用受影响版本的 Safari 访问包含恶意 feed:// 链接的网页时，攻击者即可在用户浏览器上下文中执行任意脚本，窃取会话 Cookie、重定向用户至钓鱼网站或篡改页面内容。攻击者无需身份认证，只需诱骗用户点击恶意链接即可完成攻击，CVSS v2 评分为 4.3，危害等级为中危。Apple 已在 Safari 6.0 中修复此漏洞。"
published = "2012-07-25T19:55:01Z"
remediation = "立即将 Safari 浏览器升级至 6.0 或更高版本，此修复包含在 Apple 2012 年 7 月发布的安全更新中。OS X Mountain Lion 用户可通过系统偏好设置中的软件更新或 Mac App Store 获取，OS X Lion 用户需先升级至 10.7.4 再安装 Safari 6.0。若暂无法升级，建议临时切换至其他受支持的现代浏览器以规避跨站脚本风险。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari 跨站脚本漏洞"
updated = "2026-06-16T23:38:03Z"

