[basic]
description = "YouPHPTube Encoder 2.3 插件的 `/objects/getSpiritsFromVideo.php` 文件存在命令注入漏洞。该文件用于提供视频编码功能，其中 `base64Url` 参数未经安全过滤直接传递给系统命令执行，导致未经身份认证的远程攻击者可通过构造恶意的 base64Url 参数值注入并执行任意系统命令。该漏洞影响所有使用 YouPHPTube Encoder 2.3 版本的 YouPHPTube 视频平台部署，攻击者利用该漏洞可完全控制服务器，进而造成数据泄露、网站内容篡改、内网横向渗透等严重后果。该漏洞 CVSS v3.1 评分为 9.8，危害等级为严重，属于典型的无需认证即可远程利用的命令执行漏洞。"
published = "2019-10-25T18:15:11Z"
remediation = "立即升级 YouPHPTube Encoder 到 3.0 或更高版本（GitHub: WWBN/AVideo-Encoder），修复版本已于 2020-01-11 发布。若暂时无法升级，请在 objects/include_config.php 中手动添加 base64Url 参数校验：解码后使用 filter_var 验证是否为合法 URL，非法则记录日志并 exit 阻断请求；同时建议在 Web 服务器层面（如 Nginx/Apache）配置规则拦截包含 shell 元字符（反引号、$()、|、; 等）的 base64Url 请求，并禁用 PHP 的 exec、shell_exec、system 等危险函数作为纵深防御。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "YouPHPTube Encoder 远程命令执行漏洞"
updated = "2026-06-17T02:37:10Z"

