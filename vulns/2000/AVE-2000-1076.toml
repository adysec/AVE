[basic]
description = "Microsoft SQL Server 及 MSDE 中的 xp_enumresultset 扩展存储过程函数在调用 srv_paraminfo API 时未正确限制缓冲区长度，存在缓冲区溢出漏洞。本地攻击者可通过向该函数传递特制的参数触发缓冲区溢出，导致目标系统服务崩溃造成拒绝服务，或执行任意命令。该漏洞需要攻击者拥有本地登录权限才能利用，影响 SQL Server 及 MSDE 多个版本。"
published = "2001-01-09T05:00:00Z"
remediation = "建议立即安装微软安全公告 MS00-092 提供的 KB280380 补丁：SQL Server 7.0 用户应升级至 Service Pack 3（含该补丁），SQL Server 2000 用户应升级至 Service Pack 1（含该补丁）。如无法立即打补丁，应将 SQL Server 服务账号配置为普通用户权限而非管理员权限，以限制攻击者获取代码执行权限后的影响范围；同时在防火墙层面限制对 SQL Server 端口的非必要访问，并禁用不必要的扩展存储过程作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft SQL Server 扩展存储过程参数解析缓冲区溢出漏洞"
updated = "2026-06-16T21:53:06Z"

