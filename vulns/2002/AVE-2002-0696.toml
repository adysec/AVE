[basic]
description = "tags as the final output.<value>eZ httpbench 1.1 的 ezhttpbench.php 脚本中存在路径遍历信息泄露漏洞。未经身份认证的远程攻击者可通过在 AnalyseSite 参数中传递完整文件路径的方式，读取目标服务器上的任意文件内容。该漏洞影响使用 eZ httpbench 1.1 版本的网站，攻击者无需账号凭据即可直接构造恶意请求利用此漏洞，造成服务器上的敏感文件（如配置文件、密码文件等）泄露，进而可能导致服务器被进一步入侵。"
published = "2002-12-31T05:00:00Z"
remediation = 'eZ httpbench 1.1 已停止维护且存在未修复的信息泄露漏洞，建议立即停止使用该工具并迁移至现代 Web 基准测试工具（如 ApacheBench、wrk 或 vegeta）。如因业务原因暂无法替换，应采取以下缓解措施：通过 Web 服务器配置（如 Apache 的 `<Files>` 指令或 Nginx 的 `location` 块）禁止外部访问 `ezhttpbench.php`，或将其仅限内网 IP 访问；同时从生产环境中彻底删除该文件。临时代码修复方案为修改 `ezhttpbench.php` 中对 `AnalyseSite` 参数的处理逻辑，使用 `basename()` 或正则过滤去除路径遍历字符，仅允许 HTTP/HTTPS URL 格式输入，禁止包含 `/`、`\`、`..` 等路径分隔符。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "EZ Systems HTTPBench 信息泄露漏洞"
