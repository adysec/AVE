[basic]
description = "Mozilla Firefox 3.6.x 及 Thunderbird 3.1.x 版本的浏览器引擎存在未指定的内存破坏漏洞。远程攻击者可通过向目标用户发送特制的网页或邮件内容触发该漏洞，导致浏览器内存损坏、应用程序崩溃，甚至可能实现远程代码执行。该漏洞影响 Firefox 3.6.18 之前版本及 Thunderbird 3.1.11 之前版本，CVSS 评分 10.0，危害等级严重。Mozilla 已在 2011 年 6 月的安全更新中修复此漏洞。"
published = "2011-06-30T16:55:05Z"
remediation = "升级 Mozilla Firefox 至 3.6.18 及以上版本，或升级 Thunderbird 至 3.1.11 及以上版本。如无法立即升级，可禁用 JavaScript（在 Firefox 中设置 about:config → javascript.enabled → false）作为临时缓解措施，但会严重影响正常功能，建议优先完成版本升级。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox 浏览器引擎内存破坏漏洞"
updated = "2026-06-16T23:31:11Z"

