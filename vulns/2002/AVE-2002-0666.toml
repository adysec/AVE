[basic]
description = "askSam Web Publisher 存在跨站脚本攻击（XSS）漏洞，其 as_web.exe 和 as_web4.exe 组件未对用户输入进行充分过滤和转义。未经身份认证的远程攻击者可通过构造包含恶意脚本的特制 URL，诱骗用户点击访问，从而在用户浏览器端以其他用户的身份执行任意脚本代码。该漏洞影响 askSam Web Publisher 1 和 4 版本，攻击者利用此漏洞可窃取用户会话令牌、篡改页面内容或进行钓鱼攻击，CVSS 评分为 6.8，危害等级中等。"
published = "2002-12-31T05:00:00Z"
remediation = "如已停止使用 askSam Web Publisher，请立即卸载并下线 as_web.exe 与 as_web4.exe 组件；如确需继续使用，应在 Web 服务器前端部署 Web 应用防火墙（WAF）以拦截 &lt;script&gt;、javascript: 等恶意脚本注入，同时在调用 as_web.exe 和 as_web4.exe 的 CGI 接口层对 Command、file、request 等全部用户输入参数实施严格的 HTML/JavaScript 过滤与编码输出，避免未经净化的用户数据直接回显至错误页面。此外，建议通过防火墙规则限制仅允许可信 IP 访问 Web Publisher 服务，并尽快迁移至厂商仍在持续维护的替代产品。"
score = 6.8
severity = "MEDIUM"
sources = ["exploitdb"]
title = "askSam Web Publisher 跨站脚本攻击漏洞"
