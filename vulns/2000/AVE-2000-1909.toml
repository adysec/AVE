description = "CVE-2000-1034是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2000-12-11T05:00:00Z"
remediation = "立即安装 Microsoft 安全更新 MS00-085 (KB278511) 修补 System Monitor ActiveX 控件缓冲区溢出。补丁下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=19B2BF01-BA79-47D6-9372-79A9FFF9663B。若无法立即打补丁，可在 IE“Internet”安全区将“运行 ActiveX 控件和插件”设为“禁用”或“提示”，并在 Outlook/Outlook Express 中将 HTML 邮件置于“受限站点”区（安装 Outlook 安全更新可自动完成），同时遵循最小权限原则不以管理员身份运行日常操作。"
