[basic]
description = "Oracle TNS Listener 存在缓冲区溢出漏洞，远程攻击者可通过向 TNS Listener 发送特制的长 SERVICE_NAME 参数触发该漏洞。当服务将错误信息写入日志文件时，未对超长 SERVICE_NAME 参数进行正确长度检查，导致栈缓冲区溢出，可造成远程代码执行。该漏洞影响 Oracle 8i/9i Database Server 等版本，CVSS 评分 7.5，危害等级高。Metasploit 框架已集成该漏洞的利用模块。"
published = "2002-10-04T04:00:00Z"
remediation = "立即安装 Oracle 于 2002 年发布的安全补丁（参考 otn.oracle.com/deploy/security/pdf/net9_dos_alert.pdf），将 Oracle 9i 升级至 9.2.0.5 或更高版本。如无法立即打补丁，在防火墙限制仅允许可信 IP 访问 TNS Listener 端口 1521，并禁用不必要的 SERVICE_NAME 动态注册功能。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Oracle 8i TNS Listener SERVICE_NAME 缓冲区溢出漏洞"
updated = "2026-06-16T21:58:28Z"

