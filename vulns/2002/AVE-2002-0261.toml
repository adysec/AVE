[basic]
description = "HP Secure OS 1.0 中的预启动执行环境（PXE）服务器存在拒绝服务漏洞，远程攻击者无需认证即可通过网络向目标系统发送来自 VoIP 电话的特定 DHCP 数据包，触发 PXE 服务器解析异常导致服务崩溃。该漏洞影响 HP Secure OS 1.0 版本，攻击者只需具备网络访问能力即可实施攻击，成功利用后可造成 PXE 服务中断，影响网络启动与系统部署功能。"
published = "2002-10-04T04:00:00Z"
remediation = "立即更新 HP-UX 系统，安装最新的内核补丁和安全更新包。禁用未经验证的PXE服务器服务或限制其接入源IP地址，通过严格验证DHCP请求和实现流控机制来缓解风险。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "HP Secure OS 1.0 Preboot eXecution Environment 服务器拒绝服务漏洞"
updated = "2026-06-16T21:58:13Z"

