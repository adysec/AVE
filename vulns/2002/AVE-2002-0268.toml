[basic]
description = "Apache HTTP Server 1.3.x 版本（1.3.27 之前）的共享内存记分板存在权限提升漏洞。Apache 使用共享内存记分板管理父子进程通信，记录 parent[].pid 和 parent[].last_rtime 等关键字段。由于权限控制不当，任何以 Apache UID 运行的用户均可修改共享内存中的这些字段，伪造父进程 PID，向任意进程发送 SIGUSR1 信号（以 root 权限执行），导致拒绝服务（进程被杀）或触发其他非预期的 root 权限行为。该漏洞影响 Apache 1.3.x 至 1.3.26 版本，CVSS 评分 7.2（高危），攻击条件为本地访问且具备 Apache 用户权限，攻击者可通过修改共享内存段实现提权或拒绝服务。Apache 1.3.27 已修复此漏洞，建议升级至 1.3.27 或更高版本。"
published = "2002-10-11T04:00:00Z"
remediation = "建议立即升级 Apache HTTP Server 至 1.3.27 或更高版本（如 2.0.40+），从官网 http://httpd.apache.org/download.cgi 下载对应版本源码包编译安装或使用系统包管理器升级。临时缓解措施：限制 Apache 进程用户权限（如使用专用低权限用户运行）、限制 /tmp 或共享内存目录权限（chmod 700）、配置 SELinux/AppArmor 限制 Apache 进程发送信号权限、在防火墙层面限制本地用户对 Apache 进程的信号发送能力。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "Apache 1.3.x HTTP Daemon 任意命令执行漏洞"
updated = "2026-06-16T21:58:14Z"

