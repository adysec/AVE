[basic]
description = "某应用程序的更新服务在检查更新时，会从包含低权限用户可写目录的搜索路径中加载系统库，且未严格限制为受信任的系统位置。由于这些库可能从用户可写位置解析并加载，本地攻击者可将恶意库文件放置于该路径，使其以 SYSTEM 权限被加载执行，从而导致本地权限提升和任意代码执行。该漏洞影响范围广泛，攻击者只需拥有本地低权限即可利用，危害等级高。"
published = "2026-04-01T02:16:02.440"
remediation = "立即将 Foxit PDF Reader 升级至 2026.1.2 及以上版本，Foxit PDF Editor 升级至 2026.1.2 及以上版本。可在软件内点击「帮助」→「关于」→「检查更新」自动升级，或从 Foxit 官网下载最新安装包。临时缓解措施：移除 Foxit Update Service 搜索路径中用户可写目录的写入权限，或通过组策略限制低权限用户对系统库加载路径的写入。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Foxit PDF Reader 搜索路径劫持本地提权漏洞"
updated = "2026-06-17T10:44:11.777"

