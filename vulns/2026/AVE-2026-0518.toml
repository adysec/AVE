[basic]
description = "garminconnect Python 库（版本 ≤ 0.3.4）在将 OAuth 令牌存储写入磁盘时未设置文件系统权限，在默认 umask 022 下令牌文件 garmin_tokens.json 以全局可读权限（0o644）创建，其中包含 Garmin 刷新令牌。多用户主机上的本地攻击者无需提权即可读取该文件获取刷新令牌，进而通过 Garmin OAuth 端点换取访问令牌，持续访问受害者账户中的健康、运动及设备管理数据，实现本地凭据窃取与权限提升。"
published = "2026-01-01T00:00:00Z"
remediation = "升级 garminconnect 至 0.3.5 或更高版本：`pip install --upgrade garminconnect`。升级后立即修复已存在的令牌文件权限：`chmod 600 ~/.garminconnect/garmin_tokens.json`。若令牌文件曾在多用户主机上暴露，应删除令牌文件并重新登录以刷新令牌，防止凭据被其他本地用户窃取。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Garmin garminconnect OAuth 令牌存储权限分配不当漏洞"
updated = "2026-01-01T00:00:00Z"

