[basic]
description = "Apple Safari浏览器所采用的WebKit渲染引擎存在内存破坏漏洞，远程攻击者可通过构造恶意网页，在用户仅使用受影响版本的Safari访问该页面时触发WebKit内存损坏，进而实现任意代码执行或导致浏览器应用程序崩溃拒绝服务。该漏洞影响Safari 6.0之前的所有版本，攻击向量为网络远程，攻击复杂度中等，无需身份认证，攻击者仅需诱导用户打开恶意网站即可完成利用，对系统机密性、完整性和可用性均造成严重影响，CVSS评分为9.3。Apple于2012年7月25日在Safari 6.0安全更新中修复了该漏洞，通过改进WebKit内存处理机制消除了此缺陷。"
published = "2012-07-25T20:55:01Z"
remediation = "升级 Mac 系统至 OS X Lion v10.7.4 或更高版本以获取 Safari 6.0，iOS 设备升级至 iOS 6.0 或更高版本，Windows 用户将 iTunes 升级至 10.7 或更高版本。通过系统软件更新或 Mac App Store 自动安装安全更新。如暂时无法升级，可改用其他浏览器访问网页，避免使用 Safari 打开不受信任的网站链接，并禁用不必要的 WebKit 插件作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:32Z"

