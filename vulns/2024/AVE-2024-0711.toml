[basic]
description = "Synaptics 音频驱动中的 CxUIUSvc64.exe 和 CxUIUSvc32.exe 服务二进制文件存在 DLL 加载漏洞（CWE-284），允许拥有本地低权限的认证攻击者利用该服务在特权进程中加载恶意 DLL，从而实现权限提升。成功利用后可获取系统最高权限，完全控制目标主机的机密性、完整性和可用性。该漏洞 CVSS 评分 7.8，危害等级高。需要注意的是，受影响的 Synaptics 音频驱动产品已停止维护（End-of-Life），官方建议用户移除该产品以避免安全风险。"
published = "2025-03-11T17:16:17Z"
remediation = "该产品已停止支持（End-of-Life），官方不再提供安全更新。建议立即卸载 Synaptics 音频驱动程序（CxUIUSvc64.exe / CxUIUSvc32.exe），或通过设备管理器禁用相关服务。如业务必须使用，可配置 Windows 强制签名策略（Enable LSA Protection）并限制非管理员用户安装 DLL 的目录权限作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Synaptics 音频驱动 DLL 加载权限提升漏洞"
updated = "2026-06-17T08:24:03Z"

