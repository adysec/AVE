[basic]
description = 'Big Brother System and Network Monitor 1.5c2 之前版本的 bbd 服务器存在命令注入漏洞，远程攻击者可通过向目标系统发送包含 "&" shell 元字符的特制请求，利用 bbd 服务器对用户输入过滤不严的缺陷，在服务器端执行任意系统命令。该漏洞影响 Big Brother 网络监控系统的多个版本，攻击者无需身份认证即可远程利用，可能导致服务器被完全控制、数据泄露或进一步内网渗透。厂商已发布 1.5c2 版本修复此问题。'
published = "2000-12-19T05:00:00.000"
remediation = '升级 Big Brother System and Network Monitor 至 1.5c2 或更高版本，该版本修复了 bbd 服务器对 shell 元字符的过滤缺陷。如无法立即升级，可在 bbd 服务器前端部署 WAF 或反向代理，拦截包含 "&"、"|"、"`"、"$" 等 shell 元字符的请求，并对 bbd 输入做严格的白名单校验。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Big Brother 系统和网络监控器 bbd 服务器远程代码执行漏洞"
updated = "2026-06-16T21:52:53.920"

