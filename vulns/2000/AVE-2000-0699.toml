[basic]
description = "SapporoWorks WinProxy 2.0 及 2.0.1 版本的 HTTP 服务器组件存在拒绝服务漏洞。远程攻击者在未指定 HTTP 版本号的情况下发送特制的 GET 请求，可导致代理服务器程序崩溃，造成服务不可用。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响 WinProxy 2.0/2.0.1 版本。"
published = "2000-06-27T04:00:00.000"
remediation = "升级至 SapporoWorks WinProxy 2.0.2 或更高版本以修复该拒绝服务漏洞。若无法获取更新版本，请在 HTTP 服务器配置中添加请求版本号校验规则，拒绝缺少 HTTP 版本头的 GET 请求，或在前端部署反向代理服务器过滤异常 HTTP 请求。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "SapporoWorks WinProxy 2.0/2.0.1 HTTP GET 请求处理拒绝服务漏洞"
updated = "2026-06-16T21:52:04.187"

