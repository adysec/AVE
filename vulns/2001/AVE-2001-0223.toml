[basic]
description = "GnuPG（GPG）1.0.4 及部分其他版本在从公钥服务器导入密钥时，未区分公钥和私钥，也未向用户提示私钥的存在，导致用户可能在不知情的情况下导入他人私钥。攻击者可将恶意私钥上传至公钥服务器，诱使用户导入该私钥，从而破坏信任链（Web of Trust）体系，使得攻击者能够以被窃取私钥的身份进行签名或加密通信。该漏洞无需身份认证即可远程利用，影响 GnuPG 1.0.4 及可能受影响的早期版本。"
published = "2001-02-12T05:00:00.000"
remediation = "升级 GnuPG 至 1.0.5 或更高版本，该版本在导入密钥时会区分公钥和私钥并给出明确提示。如无法升级，应避免使用 `--recv-keys` 从公钥服务器自动导入密钥，改为手动验证后导入，并定期使用 `gpg --list-secret-keys` 检查本地私钥列表是否有异常条目。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "GnuPG gpg 私钥静默导入致信任链破坏漏洞"
updated = "2026-06-16T21:53:36.220"

