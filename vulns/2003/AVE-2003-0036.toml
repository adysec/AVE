[basic]
description = "Linux 内核 2.2.x 至 2.2.25 之前版本及 2.4.x 至 2.4.21 之前版本的内核模块加载器中存在权限提升漏洞。本地攻击者可通过 ptrace 系统调用附加到内核派生的子进程，从而获取 root 权限。该漏洞影响所有使用受影响内核版本的 Linux 系统，攻击者需具备本地访问权限，无需身份认证即可利用，CVSS 评分 7.2，危害等级高。"
published = "2003-03-31T05:00:00Z"
remediation = "立即升级 Linux 内核至 2.2.25 及以上版本（2.2.x 系列）或 2.4.21 及以上版本（2.4.x 系列），该漏洞已在对应版本的内核中修复。如无法立即升级内核，可通过禁用内核模块自动加载缓解风险：在 /etc/modprobe.conf 或 /etc/modprobe.d/ 中添加 `install * /bin/false` 阻止自动加载模块，同时移除 setuid 二进制文件的 ptrace 权限或使用 `echo 0 > /proc/sys/kernel/exec-shield` 等缓解措施。注意禁用模块加载可能影响系统功能，应优先选择内核升级方案。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "Linux 内核模块加载器权限提升漏洞"
updated = "2026-06-16T22:01:35Z"

