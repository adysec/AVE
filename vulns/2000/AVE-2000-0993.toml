[basic]
description = "Sun Microsystems 两枚代码签名证书私钥被泄露，攻击者可利用泄露的私钥为恶意 Java 小程序或代码生成合法的 Sun 数字签名，使恶意代码在通过签名验证后被视为可信的 Sun 签名代码自动执行。该漏洞影响所有信任 Sun 根证书的 Java 运行环境，攻击者需获取泄露的私钥并诱导用户加载恶意签名小程序，利用方式为使用泄露私钥对恶意代码签名后诱导受害者运行，绕过 Java 安全沙箱执行任意代码。Sun 已吊销相关证书并发布更新吊销列表，用户需更新 JRE 信任库。"
published = "2001-02-12T05:00:00.000"
remediation = "建议立即升级到 Sun Microsystems 发布的安全补丁版本（JDK/JRE 1.2.2_007 或更高版本、1.3.0_02 或更高版本），并撤销对泄露证书（序列号 0x00a7b7e3 和 0x00a7b7e4）的信任。在 Java 控制面板中删除或禁用受影响的根证书，或通过部署规则集部署规则集禁用受信任证书。若无法立即升级，可在防火墙/代理层面拦截未签名或异常签名的 Java Applet 流量作为临时缓解措施。"
score = 5.1
severity = "MEDIUM"
sources = ["epss"]
title = "Sun Java 安全证书泄露导致恶意 Applet 签名伪造漏洞"
updated = "2026-06-16T21:52:40.987"

