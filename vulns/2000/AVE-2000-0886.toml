[basic]
description = "Becky! Internet Mail 邮件客户端 1.26.04 及更早版本存在缓冲区溢出漏洞。远程攻击者可通过向目标用户发送包含超长 Content-type MIME 头的恶意邮件，当用户转发该邮件时触发缓冲区溢出，导致邮件客户端崩溃，造成拒绝服务。该漏洞攻击复杂度低，无需身份认证，仅需诱使用户转发恶意邮件即可利用。"
published = "2000-10-20T04:00:00.000"
remediation = "立即升级 Becky! Internet Mail 至 1.26.05 或更高版本（可从开发商 RimArts 官网下载）。如无法升级，建议暂时改用其他邮件客户端处理可疑邮件，并避免转发来源不明的含畸形 MIME 头的邮件。在邮件网关层面过滤 Content-Type 头部超长字段可作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Becky! Internet Mail 客户端缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:22.547"

