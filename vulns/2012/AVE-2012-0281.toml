[basic]
description = "WebKit 渲染引擎存在内存破坏漏洞，远程攻击者可通过构造恶意网页向目标系统发送特制内容，触发内存损坏，进而实现任意代码执行或导致应用程序崩溃拒绝服务。该漏洞影响 Apple Safari 6.0 之前版本及 iOS 6.0 以下设备，攻击者无需身份认证即可在受害者浏览恶意网站时完成利用。CVSS 评分 9.3，危害等级严重。Apple 已在 iOS 6.0 及 Safari 6.0 中修复此漏洞。"
published = "2012-07-25T20:55:02.367"
remediation = "建议立即升级到 Safari 6.0（随 OS X Lion v10.7.4 提供）或更高版本，iOS 设备升级到 iOS 6.0 或更高版本，Windows 设备升级到 iTunes 10.7 或更高版本。如无法立即升级，应避免访问不受信任的网站，并禁用 WebKit 中不必要的 JavaScript 执行作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:33.750"

