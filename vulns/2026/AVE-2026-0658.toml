[basic]
description = "Gitea 仓库恢复功能中存在本地文件包含漏洞，位于 services/migrations/gitea_uploader.go 和 modules/uri/uri.go 组件中。uri.Open() 函数在处理用户提供的归档文件中的 release.yml 时，未对 DownloadURL 字段的 scheme 进行校验，允许使用 file:// 协议。具有操作员权限的攻击者可构造恶意归档文件，通过 file:// 协议读取服务器文件系统中的任意文件（如 app.ini 数据库密码、SSH 私钥、TLS 证书等），并将内容以发布附件形式存储，随后通过 API 获取。该漏洞影响 Gitea v1.22.x 及之前所有版本。"
published = "2026-01-01T00:00:00Z"
remediation = "升级 Gitea 至 v1.23.0 或更高版本，该版本在 services/migrations/gitea_uploader.go 中增加了对 DownloadURL 的 scheme 校验，仅允许 http/https 协议。如无法立即升级，应严格限制 restore-repo 命令仅由完全可信的操作员执行，并在运行前手动审计所有归档文件内容，同时检查已有 release 附件中是否存在异常敏感文件名。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Gitea 迁移恢复功能本地文件包含漏洞"
updated = "2026-01-01T00:00:00Z"

