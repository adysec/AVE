[basic]
description = "libcurl 在完成线程化域名解析后关闭连接通道时，会错误地将同一个 eventfd 文件描述符关闭两次，导致双重释放（double close）漏洞。攻击者可通过构造特定的 DNS 解析请求触发该漏洞，造成程序崩溃或文件描述符被重用的不可预测行为，可能导致信息泄露或拒绝服务。该漏洞影响 curl/libcurl 多个版本，CVSS 评分 7.0，危害等级高。攻击复杂度较高，需满足特定条件方可利用。官方已在 curl 8.14.1 版本中修复此问题。"
published = "2025-02-05T10:15:22Z"
remediation = "升级 curl/libcurl 至 8.12.0 或更高版本。如无法立即升级，可应用补丁 https://github.com/curl/curl/commit/ff5091aa9f73802e894b1cbdf 后重新编译，或在构建时禁用 eventfd（--disable-eventfd），或改用 c-ares 异步解析器作为临时缓解措施。"
score = 7
severity = "HIGH"
sources = ["msrc"]
title = "curl libcurl eventfd 双重关闭漏洞"
updated = "2026-06-17T08:26:55Z"

