[basic]
description = 'libcap 的 PAM 模块 pam_cap.so 在解析 /etc/security/capability.conf 配置文件时存在缺陷：规范支持以 "@" 开头的组名，但实际解析过程中，凡是不以 "@" 开头的配置项也会被错误地识别为组名。这导致非预期的用户被误授予继承的权限能力集，可能引发本地权限提升。攻击者可通过构造特定的用户名，结合使用该配置文件进行权限分配的系统环境，触发此解析错误，从而获得本不应拥有的 capabilities。该漏洞影响使用 libcap 并依赖 capability.conf 配置用户继承权限的 Linux 系统，CVSS 评分为 6.1（中等），攻击需具备本地访问权限且用户已存在于配置中。'
published = "2025-02-18T03:15:10Z"
remediation = '升级 libcap 库至修复版本：Ubuntu 系统请安装 libpam-cap 1:2.66-5ubuntu2.2（22.04 LTS）/ 1:2.66-5ubuntu2.2（24.04 LTS）/ 1:2.66-5ubuntu3.1（24.10），Debian 系统请升级至 libcap2 1:2.44-1+deb11u1（bullseye）/ 1:2.66-4+deb12u1（bookworm）/ 1:2.75-10+deb13u1（trixie），其他发行版请更新至包含 commit 1ad42b66c3567481cc5fa22fc1ba1556a316d878 的 libcap 2.78 或更高版本。更新后需重启系统使 pam_cap.so 新版本生效。如无法立即打补丁，可临时编辑 /etc/security/capability.conf，确保不以用户名为条目配置继承权限，仅使用以 "@" 开头的组名格式，以消除被错误解析为非组名条目的风险，并严格限制 /etc/security/capability.conf 文件权限为 600，仅允许 root 用户读取修改。'
score = 6.1
severity = "MEDIUM"
sources = ["msrc"]
title = "libcap pam_cap 模块配置解析错误本地权限提升漏洞"
updated = "2026-06-17T08:39:02Z"

