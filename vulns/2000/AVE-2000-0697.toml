[basic]
description = "Sun HotJava Browser 3.0 存在任意 DOM 访问漏洞。远程攻击者可通过在命名窗口中打开特制的 javascript: URL，绕过浏览器的同源策略限制，跨域访问目标网页的文档对象模型（DOM），导致敏感信息泄露。攻击无需身份认证，仅需诱使用户访问恶意链接即可触发。该漏洞影响 HotJava Browser 3.0 版本，CVSS 评分 5.0，危害等级中危。"
published = "2000-12-19T05:00:00.000"
remediation = "Sun HotJava Browser 已停止维护多年，官方未发布补丁。建议立即停止使用 HotJava Browser，改用现代受支持的浏览器（如 Firefox、Chrome、Edge），并启用 JavaScript 安全策略，限制跨窗口 DOM 访问权限。如必须使用，可在浏览器中禁用 JavaScript 功能作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Sun HotJava Browser 任意DOM访问漏洞"
updated = "2026-06-16T21:52:51.370"

