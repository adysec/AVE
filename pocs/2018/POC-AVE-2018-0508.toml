[info]
author = "AVE"
description = "检测DNN 9.2-9.2.2版本弱加密算法导致的Cookie反序列化漏洞。通过发送特制的DNNPersonalization Cookie触发反序列化，读取服务器文件以验证漏洞存在。"
id = "POC-AVE-2018-0508"
name = "CVE-2018-18325 PoC"
severity = "high"
tags = [
    "cve-2018-18325",
    "dotnetnuke",
    "deserialization",
    "rce",
    "kev",
]
vuln_id = [
    "CVE-2018-18325",
    "AVE-2018-0508",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/__"
protocol = "http"

[[poc.requests.matchers]]
condition = "and"
expect = true
part = "body"
type = "word"
words = [
    "[extensions]",
    "for 16-bit app support",
]

[[poc.requests.matchers]]
expect = true
status = [404]
type = "status"
