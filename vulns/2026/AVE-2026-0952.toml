[basic]
description = "Flyto2 Core 工作流引擎的变量解析器在解析 `${env.VAR}` 插值时，会直接读取主机任意环境变量且未受功能策略白名单约束。尽管厂商默认拒绝 `env.get` 与 `env.load_dotenv` 模块以防止敏感信息泄露，但插值发生在模块策略门控之前，攻击者仍可通过工作流参数或 API/MCP 接口输入 `${env.AWS_SECRET_ACCESS_KEY}` 等表达式，绕过模块黑名单读取 API 密钥、DSN 等机密，并通过被允许的外发模块将解析后的明文密钥发送至攻击者控制的服务器。该漏洞影响 2.26.6 之前的所有版本。"
published = "2026-07-29T19:16:51Z"
remediation = "立即升级 Flyto2 Core 至 2.26.6 或更高版本。该版本对变量解析器中的 ${env.*} 插值施加与 env.get 相同的显式 allowlist 策略，默认拒绝未授权环境变量访问。如无法立即升级，临时缓解措施：在 module_policy.py 中扩展 enforce_module_policy 以拦截 ${env.*} 解析路径，或在工作流参数传入层过滤含 ${env. 前缀的字符串，防止敏感凭据被外传。"
score = 8.6
severity = "HIGH"
sources = ["ghsa"]
title = "Flyto2 Core 环境变量信息泄露漏洞"
updated = "2026-07-30T19:27:35Z"

