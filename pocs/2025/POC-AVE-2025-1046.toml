[info]
author = "ave"
description = "该漏洞为 Linux 内核 VLAN 子系统的本地信息泄露漏洞。通过在非以太网设备（如 GRE 隧道）上创建 VLAN 设备，可触发内核越界读取，将内核函数地址泄露到用户态。该 PoC 通过 ip 命令创建 GRE 隧道和 VLAN 接口，并检测组播地址列表中是否泄露内核函数地址。需 root 权限执行。"
id = "POC-AVE-2025-1046"
name = "Linux Kernel VLAN 越界读取信息泄露漏洞 PoC"
severity = "high"
tags = ["ave-2025-1046"]
vuln_id = [
    "CVE-2025-21920",
    "AVE-2025-1046",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/proc/version"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Linux"]
