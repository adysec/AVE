[basic]
description = "guzzlehttp/guzzle 在 7.14.2 版本之前存在敏感信息泄露漏洞，其内置的 cURL 处理器（CurlHandler 和 CurlMultiHandler）未能正确将 Proxy-Authorization 请求头与源服务器隔离。当请求发生重定向、匹配 no_proxy 绕过规则、通过 SOCKS 代理（Guzzle 会错误将其分类为直连）或以空字符串禁用代理时，代理认证凭据会被意外发送至源服务器并记录在访问日志中。未经身份认证的远程攻击者可通过构造包含 Proxy-Authorization 头的请求并诱导应用向攻击者控制的源服务器发起重定向，从而在源服务器日志中窃取代理凭据。该漏洞影响 guzzlehttp/guzzle 所有低于 7.14.2 的版本，攻击复杂度低且无需用户交互。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Guzzle HTTP 客户端代理授权头信息泄露漏洞"
