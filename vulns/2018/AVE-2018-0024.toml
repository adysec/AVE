[basic]
description = "Jenkins GitHub Plugin 1.29.1 及更早版本在 GitHubTokenCredentialsCreator.java 中存在敏感信息泄露漏洞。该漏洞的原理是由于程序未对凭证 ID 进行严格校验，导致攻击者可通过服务端请求伪造（SSRF）漏洞，诱导服务器将存储在 Jenkins 中的敏感凭证发送至攻击者控制的恶意 URL。攻击者仅需通过其他方式获取合法的凭证 ID 并触发相关请求即可实现利用。此漏洞会导致 Jenkins 存储的机密凭证被窃取，严重影响系统安全性。"
published = "2018-06-26T17:29:00Z"
remediation = "立即将 Jenkins GitHub Plugin 插件升级到 1.29.2 或更高版本。在升级完成后，建议重新检查并轮换可能已泄露的 GitHub 访问令牌（Tokens）以确保凭证安全。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "Jenkins GitHub Plugin SSRF 敏感信息泄露漏洞"
updated = "2026-06-17T01:32:54Z"

