[basic]
description = "Nagios XI 5.6.6 之前版本存在 OS 命令注入漏洞。攻击者需以 nagios 用户权限访问服务器，或通过 Web 界面以 admin 用户登录。系统通过下载系统配置文件（profile.php?cmd=download）调用 getprofile.sh 脚本，该脚本借助免密码 sudo 配置以 root 权限执行，并调用由 nagios 用户拥有的 check_plugin 可执行文件。拥有插件修改权限的 Nagios XI 用户或服务器上的 nagios 用户可修改 check_plugin 并植入恶意命令，从而以 root 权限执行任意命令，实现完全控制服务器。CVSS 评分 8.8，危害等级高。"
published = "2019-09-05T17:15:12Z"
remediation = "立即将 Nagios XI 升级至 5.6.6 或更高版本，该版本已修复 getprofile.sh 脚本通过无密码 sudo 以 root 权限执行 check_plugin 导致的命令注入问题。如无法立即升级，可采取以下临时缓解措施：(1) 编辑 /etc/sudoers 文件，移除 nagios 用户对 getprofile.sh 的无密码 sudo 权限（删除或注释相关条目）；(2) 将 check_plugin 文件所有者改为 root，并移除 nagios 用户的写入权限（chown root:root /path/to/check_plugin && chmod 755 /path/to/check_plugin）；(3) 在 Web 界面中严格限制普通用户修改插件的权限，仅授予管理员必要的插件管理权限。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Nagios XI 远程代码执行漏洞"
updated = "2026-06-17T02:21:24Z"

