[basic]
description = "标签之间。<value>Linux内核GFS2文件系统模块存在本地权限提升漏洞。当GFS2_DIF_JDATA标志发生翻转时，系统未能正确截断inode地址空间，导致同一地址空间内混合使用buffer heads与iomap_folio_state结构体，引发内存损坏。该漏洞影响使用GFS2文件系统的Linux内核版本，攻击者需具备本地用户权限。成功利用后，攻击者可执行任意代码并完全控制受影响系统，CVSS评分7.8，危害等级高。"
published = "2025-02-12T14:15:33.020"
remediation = "升级 Linux 内核至已修复的稳定版本：内核 5.10.234、5.15.178、6.1.128、6.6.75、6.12.12 或 6.13.1 及以上版本均已包含修复补丁（commit e0b2858886ae31d290eb1ffc095f81118bc2f6b3）。Ubuntu 用户可通过 apt 升级至对应内核版本：20.04 LTS 升级至 5.4.0-211.231 或 5.15.0-1114.123~20.04.1，22.04 LTS 升级至 5.15.0-135.146，24.04 LTS 升级至 6.8.0-62.65。执行 apt update && apt upgrade linux-image-generic 后重启系统使新内核生效。如无法立即升级内核，可临时限制本地用户对 GFS2 文件系统的挂载与操作权限以降低风险。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 GFS2 文件系统本地权限提升漏洞"
updated = "2026-07-30T06:19:28.157"

