[basic]
description = "该候选编号已被 CVE 官方拒绝并标记为重复，应参考 CVE-2000-0743。实际漏洞为明尼苏达大学开发的 Gopher 守护进程 gopherd 2.x 版本存在缓冲区溢出缺陷，未经身份认证的远程攻击者可通过向目标发送包含超长票证值的 DES 密钥生成请求（GDESkey）触发溢出，进而在目标服务器上执行任意系统命令。该漏洞广泛影响部署了 gopherd 2.x 的 Unix 及 Linux 系统，攻击成功后可完全控制目标主机，危害极其严重。"
published = "2000-10-20T04:00:00Z"
remediation = "该漏洞编号已被官方弃用，系 CVE-2000-0743 的重复项。请直接参考 CVE-2000-0743 的修复建议，执行相应的软件更新或配置加固操作，无需针对此编号单独处理。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "University of Minnesota gopherd 缓冲区溢出漏洞"
