[basic]
description = "Microsoft SQL Server 7.0/2000 及 MSDE 1.0/2000 中的扩展存储过程 API srv_paraminfo() 存在缓冲区溢出漏洞。该函数在解析参数时未对缓冲区长度进行有效检查，当攻击者向 xp_displayparamstmt 等扩展存储过程传递超长参数时，可触发缓冲区溢出，导致 SQL Server 服务崩溃或执行任意代码。攻击者需先通过身份认证登录 SQL Server 后方可利用此漏洞，限制了远程攻击面。Microsoft 已在安全公告 MS00-092 中发布补丁修复此问题。"
published = "2001-01-09T05:00:00Z"
remediation = "Microsoft 已在 SQL Server 2000 Service Pack 2 中修复此漏洞。建议立即升级至 SQL Server 2000 SP2 或更高版本。对于仍在使用 SQL Server 7.0 的用户，应升级至 SQL Server 2000 SP2 以上。由于 SQL Server 2000 已停止支持，强烈建议迁移至受支持的 SQL Server 版本（如 SQL Server 2019/2022）并安装最新安全更新。如无法立即升级，可在注册表中禁用不必要的扩展存储过程作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft SQL Server 和 MSDE xp_displayparamstmt 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:06Z"

