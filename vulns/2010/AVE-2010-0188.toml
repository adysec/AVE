[basic]
description = "Evince 文档查看器 dvi-backend 组件中的 TFM 字体解析器存在整数溢出漏洞，当处理特制字体与 DVI 文件时，对用于内存分配大小的整数校验不足，导致可向分配范围外写入任意数据。远程攻击者可通过诱导用户打开恶意 DVI 文件（如通过 thumbnailer 自动处理）触发该漏洞，造成任意代码执行。该漏洞影响 Evince 2.32 及更早版本，CVSS 评分 7.6，危害等级高。"
published = "2011-01-07T19:00:17Z"
remediation = "升级 Evince 至 2.91.5 或更高版本（Debian 对应升级至 2.30.3-2，Ubuntu 对应升级至 2.22.2-4~lenny2）。如无法立即升级，建议禁用 DVI 文件的缩略图预览功能，避免 thumbnailer 自动处理恶意 DVI 文件触发漏洞。"
score = 7.6
severity = "HIGH"
sources = ["tenable"]
title = "GNOME Evince DVI后端整数溢出远程代码执行漏洞"
updated = "2026-06-16T23:21:08Z"

