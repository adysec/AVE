[basic]
description = "Mozilla 0.9.6 及更早版本与 Netscape 6.2 及更早版本的浏览器在处理 URL 时存在空字符注入漏洞。远程攻击者可通过构造包含十六进制编码空字符（%00）后接目标域名的特制链接，诱使用户点击后，浏览器错误地将跨域 Cookie 发送给攻击者控制的服务器，导致用户 Cookie 被窃取。该漏洞无需认证即可远程利用，攻击复杂度低，影响用户会话安全。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 Mozilla 至 0.9.7 及以上版本，或升级 Netscape 至 6.2.1 及以上版本。该漏洞因浏览器未正确过滤 URL 中的 %00 空字符导致跨域 Cookie 窃取，新版已修复此问题。如无法升级，可在代理或网关层拦截包含 %00 的 URL 请求作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Mozilla Netscape URL空字符注入Cookie窃取漏洞"
updated = "2026-06-16T22:00:29Z"

