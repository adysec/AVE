[basic]
description = "Ximian Evolution Mail User Agent 1.2.2 及更早版本中存在拒绝服务漏洞。远程攻击者可通过向目标用户发送经过多次 uuencode 编码的恶意邮件，导致邮件客户端在解析时消耗大量内存资源，最终造成服务崩溃或不可用。攻击无需身份认证，利用方式简单，危害较大。"
published = "2003-03-24T05:00:00Z"
remediation = "建议升级 Ximian Evolution 至 1.2.3 或更高版本。Red Hat Linux 用户安装 RHSA-2003:108 提供的更新包（通过 up2date 命令更新）；Gentoo Linux 用户执行 emerge sync && emerge -u evolution 升级至修补版本；Mandrake Linux 用户安装 MDKSA-2003:045 更新。如无法立即升级，可在邮件网关层面过滤含有畸形 uuencode 编码头的邮件作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Ximian Evolution 邮件客户端 UU编码解析拒绝服务漏洞"
updated = "2026-06-16T22:01:36Z"

