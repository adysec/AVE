[basic]
description = "LimeSurvey 在 application/controllers/admin/LimeSurveyFileManager.php 中管理后台的文件管理器存在路径穿越漏洞。未经身份认证的远程攻击者可通过构造包含目录穿越序列（如 ../）的文件路径参数，突破 Web 根目录限制，读取服务器上的任意敏感文件，包括配置文件、源代码及数据库凭证等。该漏洞影响 LimeSurvey 4.1.12+200324 之前的所有版本，由于攻击向量为网络、攻击复杂度低且无需用户交互或身份认证，CVSS 评分高达 9.8，危害等级为严重。攻击者成功利用后可能导致网站敏感信息泄露，进而引发进一步的系统入侵。建议升级至 4.1.12+200324 或更高版本以修复此漏洞。"
published = "2020-04-01T16:15:27Z"
remediation = "立即将 LimeSurvey 升级至 4.1.12 或更高版本（含 build 200324 及以后版本）。该版本修复了 application/controllers/admin/LimeSurveyFileManager.php 中的路径遍历漏洞，不再通过 URL 参数传递文件路径，消除未授权读取任意服务器文件的风险。若暂时无法升级，应通过 Web 服务器配置或防火墙规则限制对 /admin/filemanager/sa/getZipFile 接口的访问，仅允许可信管理 IP 访问，作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "LimeSurvey 路径遍历漏洞"
updated = "2026-06-17T02:50:12Z"

