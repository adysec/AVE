[basic]
description = "Cisco IOS 软件中集成服务模块 VPN（ISM-VPN）的加密引擎存在拒绝服务漏洞。该漏洞源于设备对 VPN 流量处理不足，未经身份认证的远程攻击者可通过向受影响设备发送特制的 VPN 数据包触发漏洞，导致设备挂起或崩溃，造成拒绝服务。该漏洞影响运行 Cisco IOS 软件的 ISM-VPN 模块，CVSS 评分 7.5，危害等级高。Cisco 已发布安全公告修复此漏洞。"
published = "2018-03-28T22:29:00Z"
remediation = "升级 Cisco IOS 至修复版本。使用 Cisco IOS Software Checker（https://tools.cisco.com/security/center/software-checker）输入当前 IOS 版本号，获取对应修复版本并升级。该漏洞无变通方案，必须通过软件升级修复。Cisco 已确认该漏洞在野外被积极利用，建议立即安排维护窗口完成升级。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS ISM-VPN Crypto Engine 拒绝服务漏洞"
updated = "2026-06-17T01:29:57Z"

