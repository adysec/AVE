[basic]
description = 'Recourse ManTrap 1.6.1 蜜罐系统中存在 chroot 环境检测漏洞。该软件通过 chroot 机制创建隔离文件系统以隐藏自身运行状态，但 chroot 后根目录 "/" 的 inode 编号异常高于正常文件系统。本地攻击者可通过执行 `ls -id /` 等命令检查根目录 inode 值，若发现 inode 编号异常偏高即可判断自身处于 chroot 环境中，从而识别出蜜罐系统的存在。该漏洞影响 ManTrap 1.6.1 版本，攻击者需具有本地 shell 访问权限，利用难度低，可导致蜜罐隐身机制失效。'
published = "2001-01-09T05:00:00Z"
remediation = "建议立即升级至 ManTrap 2.0 版本，该版本已修复 chroot 环境 inode 泄露问题。同时，管理员应在部署后额外采取以下缓解措施：在宿主机防火墙层面限制 cage 环境的网络出站流量，将 cage 日志通过安全通道发送至远程日志服务器，并定期监控 cage 内进程列表以检测异常。由于 2.0 版本仍存在 crash 工具可查看 cage 外进程的问题，建议在宿主机上禁用或移除不必要的调试工具，并严格限制 cage 内用户的命令执行权限。"
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "Recourse ManTrap 根目录Inode信息泄露漏洞"
updated = "2026-06-16T21:53:14Z"

