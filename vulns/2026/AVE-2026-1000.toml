[basic]
description = "Flowise 是一个用于构建大语言模型流程的拖放式用户界面。在 3.1.0 版本之前，该产品的 Airtable Agent 和 CSV Agent 节点中 run 方法存在代码注入漏洞。由于在通过 Pyodide 执行 LLM 生成的 Python 脚本时缺乏适当的沙箱隔离机制，未经身份认证的远程攻击者可通过提示词注入技术，向使用了 Airtable Agent 或 CSV Agent 节点的聊天流程发送恶意提示，诱使 LLM 生成包含攻击者控制命令的 Python 脚本，从而在 Flowise 服务器上执行任意代码并获取 root 权限。该漏洞影响所有启用了 Airtable Agent 或 CSV Agent 节点的 Flowise 实例，攻击者无需任何凭据即可发起远程利用，CVSS 评分 9.2，危害等级严重。此外受影响版本还可能存在图数据库 Cypher 注入和向量存储路径遍历等其他安全风险。Flowise 已在 3.1.0 版本中修复此漏洞。"
published = "2026-04-23T20:16:14.890"
remediation = "立即将Flowise升级至3.1.0或更高版本，官方修复了Airtable Agent节点缺乏Python脚本沙箱隔离的漏洞。如无法立即升级，临时措施包括：删除或禁用使用Airtable Agent节点的所有chatflow；在防火墙或反向代理层限制Flowise管理界面的访问IP，仅允许可信地址访问；监控服务器异常子进程创建和出站网络连接，发现可疑活动立即隔离。同时检查是否使用了GraphCypherQAChain和Vector Store basePath相关功能，这些组件在相同版本中也存在Cypher注入和路径遍历漏洞，需一并评估。"
score = 9.2
severity = "CRITICAL"
sources = ["zdi"]
title = "Flowise Airtable Agent 远程代码执行漏洞"
updated = "2026-06-17T10:46:24.407"

