[basic]
description = "Demarc PureSecure 1.0.5 版本（Unix/Windows 版本）存在 SQL 注入漏洞，攻击者可通过构造存储在 s_key Cookie 中的会话 ID 参数注入恶意 SQL 语句，绕过身份验证直接获取管理员权限。该漏洞影响 Demarc PureSecure 1.0.5 版本，CVSS 评分 10.0（严重级），攻击向量为网络远程、攻击复杂度低、无需身份认证，成功利用可导致系统机密性、完整性、可用性完全丧失。攻击者只需构造恶意 SQL 语句注入到会话 ID Cookie 参数中，即可绕过认证机制直接获得系统最高权限。ExploitDB 已公开该漏洞的利用代码（ExploitDB-21384）。"
published = "2002-07-03T04:00:00Z"
remediation = "建议立即安装最新的微软安全更新（特定版本请查询官方公告）。如果无法立即更新，可先在防火墙设备中禁用不必要的服务端口，并加强对会话ID字段的输入验证和参数化查询，以减轻SQL注入风险。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Demarc Security PureSecure 1.0.5 SQL注入漏洞"
updated = "2026-06-16T21:57:38Z"

