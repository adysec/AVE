[info]
author = "ave"
description = "验证Google Chrome Android版Omnibox UI欺骗漏洞，通过构造恶意HTML页面触发地址栏伪造，诱导用户输入敏感信息或点击恶意链接。需要用户交互（执行特定UI手势）才能触发。"
id = "POC-AVE-2025-0533"
name = "CVE-2025-12729 PoC"
severity = "medium"
tags = ["ave-2025-0533"]
vuln_id = [
    "CVE-2025-12729",
    "AVE-2025-0533",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc/spoof.html"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["spoof"]
