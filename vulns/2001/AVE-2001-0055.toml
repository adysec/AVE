[basic]
description = "SSH1 协议中的 CRC-32 补偿攻击检测器存在整数溢出漏洞，未经身份认证的远程攻击者可通过向目标 SSH 服务器或客户端发送特制数据包触发该整数溢出，从而执行任意命令，实现远程代码执行。该漏洞影响 SSH 1.2.x 版本，CVSS 评分 10.0，危害等级严重。攻击者仅需网络可达目标主机的 SSH 服务即可利用，无需任何身份认证且攻击复杂度低，可完全窃取数据、篡改文件并控制受影响系统。"
published = "2001-03-12T05:00:00Z"
remediation = '立即将 OpenSSH 升级到 2.2.0 或更高版本，OpenSSH 2.3.0p1 及后续版本已包含对 deattack.c 中整数溢出漏洞的完整修复。如暂无法升级，应在 sshd_config 中添加 "Protocol 2" 指令并重启 sshd 服务，以禁用存在漏洞的 SSH1 协议，仅允许 SSH2 连接。同时建议在防火墙层面限制 22 端口的访问来源，仅允许可信 IP 段连接，以降低被利用风险。对于 Cisco WebNS 4.01 B42s、4.10 22s、5.0 B11s、5.01 B6s 之前版本及 Secure Computing SafeWord Agent for SSH 等衍生受影响产品，应联系厂商获取补丁或升级至安全版本。'
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "OpenSSH SSH1 CRC-32补偿攻击远程命令执行漏洞"
updated = "2026-06-16T21:53:45Z"

