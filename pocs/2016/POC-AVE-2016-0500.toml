[info]
author = "AVE"
description = "Apache Shiro <=1.2.4 使用硬编码默认密钥对 rememberMe Cookie 进行反序列化，攻击者可构造恶意序列化对象触发 RCE。通过发送携带默认密钥加密的 rememberMe Cookie 并检测响应中是否包含 'rememberMe=deleteMe' 标识来判断漏洞是否存在。"
id = "POC-AVE-2016-0500"
name = "Apache Shiro 1.2.4 默认密钥反序列化远程代码执行漏洞 PoC"
severity = "critical"
tags = [
    "cve-2016-4437",
    "shiro",
    "deserialization",
    "rce",
]
vuln_id = [
    "CVE-2016-4437",
    "AVE-2016-0500",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = ["rememberMe=deleteMe"]
