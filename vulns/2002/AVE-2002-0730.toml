[basic]
description = "SafeTP 1.46 在被动模式（PASV）FTP 文件传输中存在信息泄露漏洞。当目标环境使用网络地址转换（NAT）时，该软件会在响应被动模式文件传输请求时将 FTP 服务器的内网 IP 地址泄露给客户端。未经身份认证的远程攻击者无需任何凭据，仅需发起一次被动模式文件传输请求，即可从服务器响应中获取到其内网 IP 地址。该漏洞影响使用 SafeTP 1.46 版本的用户，可能导致内网拓扑结构暴露，为攻击者后续的横向移动和渗透攻击提供关键信息，进而扩大安全威胁范围。"
published = "2002-12-31T05:00:00Z"
remediation = "建议升级至 SafeTP 1.5 或更高版本（若厂商仍提供更新），或迁移至 FileZilla Server、vsftpd 等维护中的 FTP 软件。若必须继续使用，可在防火墙/NAT 设备上配置 FTP ALG 或应用层网关，重写 PASV 响应中的内网 IP 为公网 IP；同时禁用被动模式，强制客户端使用主动模式（PORT）传输，并限制 FTP 服务仅对受信任内网 IP 开放。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "SafeTP 1.46 FTP 被动模式内部 IP 地址信息泄露漏洞"
updated = "2026-06-16T22:00:21Z"

