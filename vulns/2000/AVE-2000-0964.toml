[basic]
description = "Deerfield Serv-U FTP 服务器 2.5e 版本存在空字节拒绝服务漏洞。远程攻击者无需身份认证即可通过网络向目标 FTP 服务器发送大量空字节（NULL byte），导致服务器处理异常而崩溃或停止响应，造成拒绝服务。该漏洞利用方式简单，攻击者只需构造包含大量空字节的请求即可触发，无需特殊权限或复杂条件。CVSS 评分 5.0，危害等级中等，影响 Serv-U 2.5e 版本。"
published = "2000-11-14T05:00:00Z"
remediation = "建议将 Serv-U 升级至 2.5f 或更高版本，该漏洞已在后续版本中修复。如无法升级，可在防火墙或网络边界限制对 FTP 服务端口（默认 21）的访问，仅允许可信 IP 连接，并配置 FTP 服务端设置最大连接数与超时参数以缓解 DoS 影响。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Deerfield Serv-U 2.5e NULL Byte 拒绝服务漏洞"
updated = "2026-06-16T21:52:34Z"

