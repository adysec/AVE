[basic]
description = "Flowise的HTTP安全模块(httpSecurity.ts)未在检查deny list之前对IPv4映射的IPv6地址（如::ffff:127.0.0.1、::ffff:169.254.169.254）进行规范化处理。由于ipaddr.js对这类地址返回'ipv6'类型，而deny list中的IPv4 CIDR规则为'ipv4'类型，两者kind不匹配导致所有IPv4 CIDR拒绝检查被完全跳过。攻击者若能控制Flowise所访问主机名的DNS解析，可设置AAAA记录指向目标IPv4地址的IPv4映射格式，从而绕过SSRF保护向AWS元数据服务、内部网络服务及本地主机发送请求，窃取IAM凭据或访问敏感内部资源。该漏洞影响所有至v3.1.1的Flowise版本，已在v3.1.3中修复。"
published = "2026-08-04T17:17:00Z"
remediation = "立即将 Flowise 升级至 v3.1.3 或更高版本，该版本修复了 HTTP 安全模块未对 IPv4 映射 IPv6 地址进行规范化的问题。升级前可通过在 Nginx/Caddy 等反向代理层禁用 AAAA DNS 解析或拦截包含 ::ffff: 前缀的 IPv6 地址作为临时缓解措施，阻止攻击者利用 AAAA 记录绕过 SSRF 防护访问内网及云元数据服务。"
score = 7.6
severity = "HIGH"
sources = ["ghsa"]
title = "Flowise Flowise SSRF防护绕过漏洞"
updated = "2026-08-04T17:17:00Z"

