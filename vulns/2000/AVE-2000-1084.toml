[basic]
description = "JDK 1.2.2_05 及更早版本的 Java 运行时环境存在沙箱逃逸漏洞，由于未对不可信 Java 类的类调用权限进行充分限制，导致不可信类可调用被禁止访问的内部类。远程攻击者可通过诱导用户运行恶意 Java 小程序或应用程序触发该漏洞，成功利用后可绕过 Java 沙箱安全机制，在目标系统上执行未授权操作，造成机密性、完整性和可用性部分受损。攻击复杂度较高，需要用户交互配合。"
published = "2001-01-09T05:00:00.000"
remediation = "升级到 JDK 1.2.2_06 或更高版本。对于仍在运行 JDK 1.2.x 及更早版本的系统，应立即升级至 Oracle 当前支持的 JDK 版本（如 JDK 8 及以上），旧版本已不再接收安全更新。如无法立即升级，可在浏览器或应用服务器层面禁用 Java Applet 执行功能作为临时缓解措施。"
score = 5.1
severity = "MEDIUM"
sources = ["cve"]
title = "Sun Java Development Kit (JDK) Runtime 环境沙箱逃逸漏洞"
updated = "2026-06-16T21:53:08.667"

