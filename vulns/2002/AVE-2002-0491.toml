[basic]
description = "Voxel Dot Net CBMS 0.7 及更早版本存在多个代码注入漏洞，远程攻击者无需身份认证即可通过向 dltclnt.php 等页面发送特制的 SQL 注入请求，以其他用户身份执行未授权操作，包括删除客户端数据等。该漏洞攻击复杂度低，仅需网络访问即可利用，可导致机密性、完整性和可用性部分受损。CVSS 评分 7.5，危害等级高。目前官方已不再维护该软件，建议用户迁移至其他替代方案。"
published = "2002-10-04T04:00:00.000"
remediation = "该产品已停止维护，无官方补丁可用。建议立即迁移至其他受支持的客户管理系统。如无法立即迁移，采取以下缓解措施：1）在 Web 服务器层（如 .htaccess 或 Nginx 配置）限制对 dltclnt.php、edit.php 等关键脚本的访问，仅允许可信 IP；2）部署 WAF 规则拦截 SQL 注入和 XSS 攻击载荷；3）对 PHP 配置启用 magic_quotes_gpc=On 并关闭 register_globals；4）对用户输入参数（如 idnum）实施严格的整型校验和参数化查询。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Voxel Dot Net CBMS 多代码注入漏洞"
