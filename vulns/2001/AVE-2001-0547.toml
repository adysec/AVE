[basic]
description = "MacOS X 10.3 之前版本中的 nidump 工具存在敏感信息泄漏漏洞。本地攻击者可通过在命令行中指定 passwd 参数，利用 nidump 读取系统密码文件中的加密密码哈希值。该漏洞源于 nidump 未对命令行参数进行充分的权限检查，导致普通用户也能访问本应受保护的口令数据。攻击者获取加密密码后可通过离线破解方式获得明文密码，进而提升系统权限。该漏洞影响 MacOS X 10.3 之前的所有版本，攻击者需具有本地系统访问权限。"
published = "2003-11-17T05:00:00Z"
remediation = "升级至 Mac OS X 10.3 (Panther) 或更高版本，该版本已修复 nidump 允许普通用户读取加密密码文件的问题。如无法立即升级，可移除 nidump 的 setuid 位（chmod u-s /usr/bin/nidump）并限制仅管理员可执行，作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["exploitdb"]
title = "Apple MacOS X nidump密码文件泄露漏洞"
updated = "2026-06-16T21:56:13Z"

