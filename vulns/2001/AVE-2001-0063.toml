[basic]
description = "GNU C 库（glibc）在处理 SUID/SGID 应用程序的 LD_PRELOAD 环境变量时，未对 /etc/ld.so.cache 缓存中的预加载库进行 SUID/SGID 权限校验。当本地用户在 SUID/SGID 程序中使用 LD_PRELOAD 时，glibc 会加载 /lib 或 /usr/lib 目录下的共享库文件而忽略其权限设置，导致攻击者可在这些系统目录中放置恶意共享库，诱使特权程序加载并执行，从而覆盖目标主机上的任意文件。该漏洞影响 glibc 2.1.3 等早期版本，攻击者需具备目标系统的本地账户访问权限方可利用，可导致本地权限提升或文件系统被篡改，进而获取系统控制权。用户应升级至修复版本的 glibc 或禁用不必要的 SUID/SGID 权限以缓解风险。"
published = "2001-03-26T05:00:00Z"
remediation = "建议立即升级 glibc 到 2.1.4 或更高版本（该版本于 2001 年 1 月发布修复了此漏洞）。针对各发行版：Red Hat 用户执行 rpm -Uvh glibc-2.1.4*.rpm 安装 RHSA-2001:002 补丁包；Debian 用户执行 apt-get update && apt-get install libc6 升级至 DSA-039 修复版本；SuSE 用户通过 YaST 安装 SuSE-SA:2001:01 补丁。临时缓解措施：在 /etc/profile 或 /etc/ld.so.conf 中禁用 LD_PRELOAD 环境变量，或使用 chattr +i /etc/ld.so.cache 锁定缓存文件防止篡改。"
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "GNU glibc LD_PRELOAD 本地权限提升漏洞"
updated = "2026-06-16T21:53:48Z"

