[basic]
description = "Gitea 的 AddTime API 中存在空指针解引用漏洞。当仓库管理员在 `POST /api/v1/repos/{owner}/{repo}/issues/{index}/times` 端点中指定不存在的用户名时，`GetUserByName()` 返回错误但程序未停止执行，后续代码对空用户指针进行解引用操作，导致运行时 panic 引发拒绝服务。该漏洞需要仓库管理员权限才能触发，影响 Gitea 相关版本。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级 Gitea 至 v1.27.0 或更高版本，该版本已在 `routers/api/v1/repo/issue_tracked_time.go` 的 `GetUserByName()` 错误处理分支中补上了缺失的 `return` 语句，防止空指针解引用导致的 panic。如无法立即升级，可在反向代理层对 `POST /api/v1/repos/*/*/issues/*/times` 端点实施访问频率限制，并严格限制仓库管理员权限的授予范围，降低被恶意触发的风险。"
score = 3.5
severity = "LOW"
sources = ["ghsa"]
title = "Gitea Gitea AddTime API 空指针解引用拒绝服务漏洞"
updated = "2026-01-01T00:00:00Z"

