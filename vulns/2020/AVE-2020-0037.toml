[basic]
description = 'GLPI 是一款开源的 IT 服务管理和资产跟踪系统。在 9.4.6 版本之前，GLPI 的 `manageRedirect` 函数（位于 `inc/toolbox.class.php` 中）使用正则表达式对跳转 URL 进行白名单校验，以防止开放重定向漏洞。然而该正则表达式存在缺陷，攻击者通过在 URL 中构造类似 `/\/example.com` 的参数值（如访问 `http://目标/index.php?redirect=/\/example.com`），可绕过正则表达式的校验限制，使系统将 Location 头重写为 `//example.com`，进而将用户重定向至任意外部恶意网站。该漏洞影响 GLPI 9.4.6 之前的所有版本，CVSS v3.1 评分为 6.1（中危），攻击向量为网络、攻击复杂度低、无需权限、需用户交互。利用此漏洞可实施钓鱼攻击，将用户从可信的 GLPI 域名诱导至攻击者控制的恶意站点。GLPI 已在 9.4.6 版本中修复了此问题，修复方式为改进正则表达式校验逻辑。Fedora 项目也已发布安全通告提醒用户升级。'
published = "2020-05-05T22:15:12Z"
remediation = '''立即升级 GLPI 至 9.4.6 或更高版本，该版本修复了 inc/toolbox.class.php 中 manageRedirect 函数因正则表达式不严谨导致的开放重定向绕过漏洞（CVE-2020-11034），可阻止攻击者通过 //example.com 或 /\example.com 等编码形式进行外部跳转。如暂无法立即升级，可在 Nginx 或 Apache 层面对 index.php 的 redirect 参数进行过滤，拒绝包含 // 或 /\ 等可被误解析的外部 URL，或通过 $CFG_GLPI['url_base'] 配置强制限制跳转基址。'''
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "GLPI 开放重定向绕过漏洞"
updated = "2026-06-17T02:48:54Z"

