[basic]
description = "RobinHood 1.1 Web 服务器在 BeOS r5 pro 及更早版本中存在缓冲区溢出漏洞。由于 RHConsole 组件在处理 HTTP 请求时未能对输入长度进行有效校验，远程未经身份验证的攻击者可通过发送特制的超长 HTTP 请求触发该漏洞。这将导致服务器进程崩溃，造成拒绝服务（DoS）状态，在特定条件下可能被进一步利用实现远程代码执行。该漏洞影响所有运行相关版本的 BeOS 系统，攻击条件简单，仅需网络可达性即可实施。"
published = "2001-01-09T05:00:00.000"
remediation = "由于 RobinHood 1.1 及其运行环境 BeOS 已停止维护，建议立即弃用该 Web 服务器并迁移至现代且安全的 Web 服务软件（如 Apache 或 Nginx）。如必须运行，可通过在前端部署反向代理服务器（如 Nginx）并配置 `client_header_buffer_size` 限制 HTTP 请求长度，以拦截超长请求从而缓解拒绝服务攻击。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "RobinHood 1.1 Web Server RHConsole 拒绝服务漏洞"
updated = "2026-06-16T21:53:16.393"

