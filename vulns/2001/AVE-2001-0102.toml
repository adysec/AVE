[basic]
description = "标签中输出最终答案。<value>Netscape SmartDownload 1.3 存在缓冲区溢出漏洞。未经身份认证的远程攻击者可构造包含超长 URL 的恶意网页，当用户访问该网页时触发 SmartDownload 组件的缓冲区溢出，从而执行任意命令。该漏洞影响安装了 Netscape SmartDownload 1.3 的客户端系统，攻击者无需交互即可利用，CVSS 评分 7.5，危害等级为高危。用户应升级至安全版本或避免使用存在该漏洞的 SmartDownload 组件。"
published = "2001-07-02T04:00:00Z"
remediation = "立即卸载 Netscape SmartDownload 1.3，该软件已停止维护且无官方补丁。改用现代维护中的下载工具（如 Free Download Manager、JDownloader 2 或浏览器内置下载器）。若必须保留旧版本，请在防火墙层面禁止其访问不可信网站，并禁用自动处理 URL 的功能。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Netscape SmartDownload 1.3 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:59Z"

