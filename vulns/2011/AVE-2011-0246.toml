[basic]
description = "Google Chrome 16.0.912.63 之前版本中存在一处释放后重用（Use-After-Free）漏洞，位于 Range 处理逻辑中。远程攻击者可通过诱导用户访问特制网页，触发已释放内存对象的非法访问，导致浏览器崩溃拒绝服务，或可能进一步实现任意代码执行。该漏洞影响所有使用受影响 WebKit 内核的 Chrome 浏览器版本，CVSS 评分 7.5，危害等级高。Google 已在 16.0.912.63 版本中修复此漏洞。"
published = "2011-12-13T21:55:01Z"
remediation = "立即升级 Google Chrome 至 16.0.912.63 或更高版本，该版本修复了 Range 处理中的释放后重用漏洞。如无法升级，可禁用 JavaScript 或使用 Chrome 的 --no-sandbox 相关安全策略作为临时缓解，但建议优先完成版本升级。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome 释放后使用漏洞"
updated = "2026-06-16T23:34:08Z"

