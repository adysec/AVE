[basic]
description = "Internet Explorer 5.5 之前版本存在缓存凭据转发漏洞，当用户访问同一网站的 HTTPS 安全页面后，浏览器会将缓存的用户凭据自动转发给该网站的 HTTP 非安全页面。远程攻击者可通过网络嗅探或中间人攻击方式监控用户与 Web 服务器之间的连接，从而窃取转发的凭据信息，导致用户账户被未授权访问。该漏洞影响 Internet Explorer 5.5 及更早版本，CVSS 评分 7.5，危害等级高。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 Internet Explorer 至 5.5 或更高版本，该漏洞已在 IE 5.5 中修复。对于仍使用旧版 IE 的系统，建议升级至受支持的现代浏览器（如 Edge、Chrome、Firefox），这些浏览器不再受此缓存凭据泄露问题影响。同时避免在 HTTPS 安全站点与同一站点的 HTTP 不安全页面之间切换操作。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Internet Explorer 缓存凭据转发漏洞"
updated = "2026-06-16T21:52:54.427"

