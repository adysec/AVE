[basic]
description = "dump 0.4 b10 至 b29 版本中存在不正确的文件锁定漏洞（CWE-667）。本地攻击者可通过 flock() 系统调用锁定 /etc/dumpdates 文件，导致 dump 进程无法获取该文件的必要锁，从而阻止后续备份操作的正常执行，造成拒绝服务。该漏洞攻击复杂度低，无需特殊权限即可触发，影响 dump 0.4 系列多个版本。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 dump 至 0.4b30 或更高版本。Red Hat 用户可安装 RHSA-2005-583 提供的更新包。临时缓解措施：限制本地非授权用户对 dump 二进制文件的执行权限，或使用文件系统 ACL 保护 /etc/dumpdates 文件不被其他用户 flock 锁定。"
score = 5.5
severity = "MEDIUM"
sources = ["redhat"]
title = "dump 本地拒绝服务漏洞"
updated = "2026-06-16T22:00:17Z"

