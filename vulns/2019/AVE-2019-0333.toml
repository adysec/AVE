[basic]
description = "CVE-2019-1215 是 Windows 套接字驱动 ws2ifsl.sys（Winsock）中的释放后使用漏洞。本地低权限攻击者可通过特制系统调用触发已释放内存对象的访问，在内核上下文中执行任意代码，从而将权限提升至 SYSTEM 级别。该漏洞影响 Windows 7/8.1/10 及 Windows Server 2008/2012/2016/2019 等多个版本，CVSS 评分 7.8，危害等级高。已有公开的利用代码（ExploitDB 47935）可绕过 kASLR、kCFG 和 SMEP 等内核缓解措施。Microsoft 已在 2019 年 9 月安全更新中修复此漏洞。"
published = "2019-09-11T22:15:14Z"
remediation = "立即安装 Microsoft 2019 年 9 月安全更新（适用于 Windows 7 SP1/8.1/10 及 Windows Server 2008/2012/2016/2019 各版本），通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。该漏洞已有公开利用代码（ExploitDB 47935）且被 CISA 列入已知被利用漏洞目录，无法立即打补丁时应限制本地用户登录权限并启用 Windows Defender 攻击面减少（ASR）规则作为临时缓解。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows ws2ifsl.sys 特权提升漏洞"
updated = "2026-06-17T02:28:05Z"

