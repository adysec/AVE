[info]
author = "ave"
description = "通过 HTTP 请求检测 Microsoft SharePoint Server 是否存在 CVE-2025-21344 远程代码执行漏洞。向目标发送 GET 请求，检测响应中是否包含 SharePoint 相关特征字符串，判断目标是否可能受该漏洞影响。"
id = "POC-AVE-2025-0803"
name = "CVE-2025-21344 Microsoft SharePoint Server 远程代码执行检测 PoC"
severity = "high"
tags = ["ave-2025-0803"]
vuln_id = [
    "CVE-2025-21344",
    "AVE-2025-0803",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Microsoft SharePoint",
    "SharePoint Server",
    "_layouts",
    "/sites/",
]
