[basic]
description = "RPM 包管理器 4.0.4 版本的默认 --checksig 签名验证机制存在安全缺陷，仅验证软件包签名的有效性而未向用户显示签名者身份信息，导致远程攻击者可通过替换或伪造恶意软件包的签名，使其看似来自受信任的合法来源。用户在执行安装时无法区分包的真实来源，从而可能被诱导安装包含后门或恶意代码的软件包。攻击者无需身份认证即可远程实施该攻击，影响使用 RPM 包管理器的 Linux 发行版系统。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 RPM 至 4.1 或更高版本，新版默认会在签名验证时显示签名者信息。如无法升级，使用 `rpm -K --nogpg` 仅检查完整性，或通过 `rpm -Kvv <package>` 手动查看签名详情；同时建议导入并信任官方 GPG 公钥后使用 `rpm -K <package>` 验证签名归属。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "RPM Package Manager 签名验证用户反馈不足漏洞"
updated = "2026-06-16T22:00:50Z"

