[basic]
description = "Microsoft Brokering File System（代理文件系统）存在释放后使用（Use-After-Free）漏洞，CWE-416。具有低权限的本地攻击者可通过特制程序调用触发已释放内存的访问，导致权限提升至 SYSTEM 级别。该漏洞攻击复杂度较高（AC:H），但无需用户交互即可利用，成功利用后可完全控制受影响系统的机密性、完整性和可用性。影响所有受支持的 Windows 10/11 及 Windows Server 版本，Microsoft 已在 2025 年 1 月安全更新（KB5049984）中修复。"
published = "2025-01-14T18:16:02.813"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 KB5049984，通过 Windows Update 或 Microsoft Update Catalog 获取。该更新修复了 Microsoft Brokering File System 中的 Use-After-Free 漏洞，可防止本地攻击者提升至 SYSTEM 权限。如无法立即打补丁，建议限制本地用户登录受影响系统并监控异常进程创建行为。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft 代理文件系统特权提升漏洞"
updated = "2026-06-17T08:43:13.187"

