[basic]
description = "Google Chrome V8 引擎存在越界读取漏洞（CWE-125），位于 DoubleToRadixString 函数中。远程攻击者可通过构造特制的 HTML 页面诱导用户访问，触发 V8 引擎的越界内存读取，导致敏感信息泄露或内存破坏，进而实现任意代码执行。该漏洞影响 Google Chrome 134.0.6998.35 之前版本及基于 Chromium 的 Microsoft Edge 134.0.3124.51 之前版本，CVSS 评分 8.8，危害等级高危。用户需升级浏览器至修复版本以防范风险。"
published = "2025-03-05T04:15:10Z"
remediation = "立即将 Google Chrome 升级至 134.0.6998.35 及以上版本，可通过 Chrome 菜单 > 帮助 > 关于 Google Chrome 自动检查更新。使用 Microsoft Edge 的用户应升级至 134.0.3124.51 及以上版本。其他基于 Chromium 的浏览器（如 Brave、Opera、Vivaldi）请更新至对应厂商发布的最新稳定版。如无法立即升级，可暂时禁用 JavaScript 作为临时缓解措施（Chrome 设置 > 隐私和安全 > 网站设置 > JavaScript > 禁止），但会影响正常网页功能。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 越界读取漏洞"
updated = "2026-06-17T08:40:19Z"

