[basic]
description = "Microsoft Windows 的 library-ms 文件解析功能存在信息泄露漏洞。漏洞原理在于解析 library-ms 文件时存在缺陷，攻击者可构造恶意的 library-ms 文件内容，诱使目标用户打开包含该文件的文件夹，从而触发向外发送 WebDAV 请求并将当前用户上下文中的 NTLM 响应泄露给攻击者。该漏洞影响 Microsoft Windows 受影响版本，攻击者需与目标处于相邻网络位置，且需要用户交互（目标必须查看包含恶意内容的文件夹）才能利用，无需身份认证。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "Microsoft Windows library-ms NTLM 响应信息泄露漏洞"
