[basic]
description = "Alabanza Control Panel 3.0 的 nsManager.cgi CGI 程序存在认证缺失漏洞，远程攻击者无需密码即可直接访问管理命令接口，进而修改目标服务器的域名信息。该漏洞影响 Alabanza Control Panel 3.0 版本，攻击者只需向目标发送特制的 HTTP 请求即可利用，无需任何身份凭证，危害等级高。"
published = "2000-12-11T05:00:00Z"
remediation = "该产品已停止维护且厂商已不存在，无法获取官方补丁。建议立即将 Alabanza Control Panel 升级为现代受支持的托管控制面板（如 cPanel、Plesk 或 ISPConfig）。如无法立即迁移，可在 Web 服务器层面（Apache 的 .htaccess 或 Nginx 的 location 配置）对 /cp/rac/nsManager.cgi 路径添加 IP 白名单和 HTTP 基本认证限制，仅允许受信管理 IP 访问该 CGI 程序，同时在防火墙层面限制对 80/443 端口的非必要来源访问。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Alabanza Control Panel 未授权访问漏洞"
updated = "2026-06-16T21:52:59Z"

