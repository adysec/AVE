[basic]
description = "多种 RADIUS 实现中的摘要计算函数存在缓冲区溢出漏洞，远程攻击者可通过向 RADIUS 服务器发送包含特制共享密钥（shared secret）数据的认证请求报文，触发缓冲区溢出，导致服务崩溃拒绝服务，甚至可能执行任意代码。该漏洞影响多个厂商的 RADIUS 实现，攻击者无需身份认证即可通过网络远程触发，CVSS 评分 7.5，危害等级高。目前已有公开的检测脚本和漏洞分析文档，建议受影响的 RADIUS 服务及时更新至修复版本或限制对 RADIUS 端口的访问。"
published = "2002-03-04T05:00:00Z"
remediation = "建议立即升级受影响的 RADIUS 实现：Cistron RADIUS 升级至 1.6.6 或更高版本，FreeRADIUS 升级至 0.4 或更高版本，GnuRADIUS 升级至 0.96 或更高版本，YARD RADIUS 升级至 1.0.20 或更高版本，radiusclient 升级至 0.3.2 或更高版本。Red Hat Linux 用户应安装 RHSA-2002-030 安全更新。Lucent/Ascend RADIUS 用户可从 ftp://ftp.vergenet.net/pub/radius 获取非官方补丁。如无法立即升级，应在网络边界防火墙限制对 RADIUS 服务器（UDP 1812/1813 端口）的外部访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "多款 RADIUS 实现 digest 计算缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:56:08Z"

