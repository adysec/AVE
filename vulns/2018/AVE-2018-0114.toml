[basic]
description = "CIRCONTROL CirCarLife 4.3 之前版本存在信息泄露漏洞。攻击者无需认证即可直接访问 /html/devstat.html 接口，该接口未对请求来源进行身份验证，导致 PLC 设备状态信息被未授权获取。远程攻击者可通过向目标系统发送特制的 HTTP 请求获取 PLC 运行状态、设备配置等敏感信息，为后续攻击提供情报支持。该漏洞影响 CirCarLife SCADA 系统，CVSS 评分 5.3，危害等级中危。"
published = "2018-09-18T20:29:01Z"
remediation = "升级 CirCarLife 至 4.3 或更高版本，该版本已对 /html/devstat.html 等敏感接口添加身份认证机制。如无法立即升级，可在 Web 服务器（如 Nginx/Apache）或网络防火墙上限制对 /html/devstat.html 路径的访问，仅允许受信任的管理 IP 访问，并禁用 Scada 设备的公网暴露。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "CIRCONTROL CirCarLife SCADA 信息泄露漏洞"
updated = "2026-06-17T01:44:39Z"

