[basic]
description = '标签之间。<value>Lotus Domino Server 5.0.5 的 Web 服务器存在目录遍历漏洞，远程攻击者可通过构造包含 ".." 序列的特制 URL 路径突破目录访问限制，从而读取服务器文件系统上的任意敏感文件。该漏洞影响 Lotus Domino Server 5.0.x 版本，攻击者无需身份验证即可通过网络向目标服务器发送恶意请求并获取敏感数据。'
published = "2001-02-12T05:00:00.000"
remediation = "升级 Lotus Domino Server 至 5.0.7 或更高版本以修复该目录遍历漏洞。如暂时无法升级，请在防火墙或路由器层面限制外部对 Domino HTTP 服务（80 端口）的访问，或暂时禁用 Web 服务器功能作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Lotus Domino 服务器目录遍历漏洞"
updated = "2026-06-16T21:53:28.943"

