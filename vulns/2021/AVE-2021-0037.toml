[basic]
description = "Internet Explorer 存在远程代码执行漏洞，由内存破坏型缺陷（内存损坏）引发，未经身份认证的远程攻击者可通过特制网页诱导用户访问从而触发该漏洞。攻击者无需任何权限即可利用，但需要用户交互（例如点击恶意链接或打开 crafted 网页）。成功利用后，攻击者可在当前用户安全上下文下执行任意代码，进而获取敏感信息、修改数据或进一步提升权限。该漏洞影响 Internet Explorer 11，波及 Windows 10 多个版本（1803、1809、1909、2004、20H2）及 Windows Server 2019 等平台，CVSS 评分为 8.8，危害等级为高。Microsoft 已在 2021 年 3 月安全更新中发布补丁修复此漏洞。"
published = "2021-03-11T16:15:18Z"
remediation = "建议立即安装 Microsoft 2021 年 3 月安全更新（Windows 10 Version 20H2/2004/1909/1809 及 Windows Server 2019 适用 KB5000802，Windows 10 Version 1803 适用 KB5000808），或通过 Windows Update 自动更新。对于 Windows 8.1/7 SP1 分别适用 KB5000850/KB5000854。如无法立即打补丁，可通过组策略禁用 Internet Explorer 11 的脚本执行功能（gpedit.msc → 用户配置 → 管理模板 → Windows 组件 → Internet Explorer → 安全功能：限制 ActiveX）作为临时缓解措施，并尽快迁移至 Microsoft Edge 浏览器。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Internet Explorer 远程代码执行漏洞"
updated = "2026-06-17T03:44:15Z"

