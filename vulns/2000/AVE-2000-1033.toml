[basic]
description = "Microsoft NWLink 中的 NMPI（基于 IPX 的名称管理协议）监听器存在数据包过滤缺陷，未能正确过滤来自广播地址的数据包。远程攻击者可通过向目标系统发送特制的 IPX 广播数据包，触发广播风暴导致网络溢出，造成拒绝服务。该漏洞影响 Microsoft Windows 2000 等使用 NWLink IPX/SPX 协议栈的系统，攻击无需身份认证，危害等级中危。"
published = "2000-12-19T05:00:00.000"
remediation = '建议立即禁用 NWLink IPX/SPX/NetBIOS 兼容传输协议（在"网络连接"→"属性"中取消勾选），或卸载该协议。如业务必须使用，应在路由器/防火墙上配置 ACL 规则，丢弃来自广播地址的 IPX 数据包（目标地址为 FF:FF:FF:FF:FF:FF），并限制 NMPI 监听端口（UDP 1601）的入站流量。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft NWLink NMPI 监听器广播风暴漏洞"
updated = "2026-06-16T21:52:54.173"

