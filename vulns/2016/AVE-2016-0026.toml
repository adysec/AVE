[basic]
description = "WordPress 插件 indexisto 1.0.5 版本存在反射型跨站脚本漏洞（Reflected XSS）。攻击者无需认证即可通过构造特制的恶意 URL，诱使目标用户点击后，恶意脚本将在用户浏览器中执行，导致敏感信息泄露或会话劫持。该漏洞源于程序未对用户输入进行充分过滤与转义，攻击条件简单，仅需用户交互即可触发。CVSS 评分 6.1，危害等级中危。"
published = "2016-10-10T20:59:14Z"
remediation = "该插件已于 2014 年 3 月从 WordPress 官方仓库下架且不再维护，无法通过升级修复。建议立即卸载 Indexisto 1.0.5 插件，并替换为其他受支持的 WordPress 站内搜索插件（如 SearchWP、Relevanssi 等）。同时启用 WordPress 的 XSS 防护机制（如 Content-Security-Policy 头），并对用户输入进行严格的 HTML 编码转义。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Indexisto 插件反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:45Z"

