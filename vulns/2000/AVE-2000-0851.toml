[basic]
description = 'Computer Associates InoculateIT for Exchange Server 防病毒代理存在绕过漏洞，其检测机制在 SMTP 邮件头缺少 "From" 字段时无法识别邮件附件中的病毒，导致远程攻击者可发送特制邮件绕过病毒防护，将恶意附件投递至目标用户邮箱。该漏洞影响运行 InoculateIT 4.53 的 Microsoft Exchange Server 系统，攻击者无需身份认证即可在远程构造并发送缺少 From 邮件头的邮件，使防病毒扫描失效，进而传播病毒或执行恶意代码。'
published = "2000-12-31T05:00:00Z"
remediation = '升级 Computer Associates InoculateIT Agent for Exchange 至厂商发布的最新修复版本，或迁移至 Broadcom 提供的替代反病毒解决方案。在 Microsoft Exchange 邮件传输服务上配置 SMTP 连接器规则，强制要求所有入站邮件必须包含有效的 "From:" 头字段，拒绝或隔离缺少该字段的邮件会话。如无法立即升级，可在边界邮件网关启用 SMTP 头完整性校验，对缺少 "From" 字段的邮件执行病毒扫描或标记为可疑。此外，建议在 Exchange 服务器上配置连接筛选器，限制仅允许来自已知可信 SMTP 源的邮件直接投递，减少暴露面。'
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Computer Associates InoculateIT Microsoft Exchange 邮件病毒防护绕过漏洞"
