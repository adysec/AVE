[basic]
description = 'Horde library 1.02 存在命令注入漏洞，因未对邮件头中"from"地址的 shell 元字符进行安全过滤，攻击者可利用该缺陷执行任意系统命令。该漏洞影响使用 Horde 1.02 的邮件处理系统，攻击条件为攻击者能够向系统提交包含恶意构造内容的发件人地址。利用方式为在"from"字段中注入 shell 元字符（如分号、管道符等），经系统调用传递后触发命令执行，可能导致服务器被完全控制。建议升级至修复后的版本。'
published = "2000-12-19T05:00:00.000"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Horde 电子邮件库 代码执行漏洞"
updated = "2026-06-16T21:52:44.680"

