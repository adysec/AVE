[info]
author = "AVE"
description = "检测 FreeBSD 4.6.2-RELEASE 及更早版本中使用 libkvm 的端口程序（asmon、ascpu、bubblemon、wmmon、wmnet2）是否泄漏 /dev/mem 和 /dev/kmem 文件描述符，本地攻击者可利用泄漏的描述符读取内核内存"
id = "POC-AVE-2002-0541"
name = "CVE-2002-1125 PoC"
severity = "low"
tags = ["ave-2002-0541"]
vuln_id = [
    "CVE-2002-1125",
    "AVE-2002-0541",
]

[poc]
logic = "any"

[[poc.requests]]
path = "/dev/kmem"
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["Permission denied"]

[[poc.requests]]
path = "/dev/mem"
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["Permission denied"]
