[basic]
description = "Red Hat Linux 6.x 和 7.x 的 pam_localuser PAM 模块存在缓冲区溢出漏洞。未经身份认证的本地攻击者可通过向该模块发送超长输入触发缓冲区溢出，在目标系统上执行任意代码并提升至 root 权限。该漏洞影响所有使用受影响版本 PAM 模块的 Red Hat Linux 系统，攻击者只需具备本地登录权限即可利用此漏洞获取系统完全控制权，对系统机密性、完整性和可用性造成严重威胁。"
published = "2001-01-09T05:00:00Z"
remediation = "Red Hat Linux 6.x 和 7.x 用户应立即安装 Red Hat 安全公告 RHSA-2000:120 中发布的 pam 软件包更新，该更新修复了 pam_localuser PAM 模块中的缓冲区溢出漏洞。受影响版本（Red Hat Linux 6.0/6.1/6.2/7.0/7.0j）可通过 `rpm -Uvh pam-*.rpm` 手动升级，或使用 `up2date` 自动更新至补丁版本。鉴于这些发行版早已停止官方支持，强烈建议迁移至受支持的 Red Hat Enterprise Linux 版本。如短期内无法迁移，可通过在 `/etc/pam.d/system-auth` 等 PAM 配置文件中注释或移除 `pam_localuser.so` 相关条目，以禁用该模块作为临时缓解措施，但需评估对本地用户认证策略的影响。Mandrake Linux 用户则应安装 MDKSA-2000:082-1 安全更新。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Red Hat Linux PAM 模块缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:53:20Z"

