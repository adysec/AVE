[basic]
description = "AzeoTech DAQFactory 软件存在释放后使用（Use After Free）漏洞，影响 21.1 及更早版本。该漏洞的成因在于程序处理 .ctl 配置文件时，未正确管理已释放内存对象的引用，导致攻击者可构造特殊的 .ctl 文件触发释放后使用条件。攻击者需诱骗用户打开恶意构造的 .ctl 文件，利用释放后内存的重新占用实现任意代码执行。该漏洞的 CVSS 评分为 8.4（高危），成功利用可导致受影响系统被完全控制，造成数据泄露、系统破坏或进一步横向渗透。AzeoTech DAQFactory 广泛应用于工业数据采集与控制场景，攻击面涉及关键基础设施环境。"
published = "2026-06-25T19:16:36Z"
remediation = '立即将 AzeoTech DAQFactory 升级至 21.1 之后的最新版本，厂商已发布修复更新。如暂时无法升级，请采取以下缓解措施：仅从可信来源获取 .ctl 文件，将 .ctl 文件存放于仅管理员可写入的目录中，在加载不受信任的文档时启用"Safe Mode"运行模式，并为文档设置编辑密码以防止恶意篡改。'
score = 8.4
severity = "HIGH"
sources = ["zdi"]
title = "AzeoTech DAQFactory 释放后使用代码执行漏洞"
updated = "2026-07-16T15:50:47Z"

