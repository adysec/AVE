[basic]
description = "JFrog Artifactory 6.7.3 存在认证绕过漏洞，当管理员被锁定时系统默认使用 access-admin 账户从 localhost 重置管理员密码，但攻击者通过在请求中添加 X-Forwarded-For HTTP 头即可伪造来源地址，绕过 IP 白名单限制并以默认凭证登录 access-admin 账户。未经身份验证的远程攻击者可利用此漏洞调用 Artifactory API 获取所有用户的身份验证令牌，包括管理员账户的令牌，从而完全控制 Artifactory 管理的所有制品和存储库。该漏洞影响 JFrog Artifactory 6.7.3 版本，CVSS 评分 9.8，危害等级严重。JFrog 已在后续版本中修复此漏洞。"
published = "2019-04-11T19:29:01Z"
remediation = "建议立即将 JFrog Artifactory 升级到 6.8.6 或更高版本以彻底修复该认证绕过漏洞。如暂无法升级，可在反向代理或防火墙层过滤请求中的 X-Forwarded-For HTTP 头，并限制 Artifactory 控制台仅允许来自受信任 IP 地址的访问，同时修改 access-admin 账户的默认凭据以降低被利用风险。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "JFrog Artifactory 身份认证绕过漏洞"
updated = "2026-06-17T02:44:15Z"

