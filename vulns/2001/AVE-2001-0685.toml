[basic]
description = "I-Data Easycom/Safecom Print Server（固件版本 404.590）的 PrintGuide 服务器组件存在拒绝服务漏洞。远程攻击者可通过建立大量包含空字符（null character）的网络连接向目标设备发起请求，持续耗尽服务器连接资源，导致服务停止响应，无法正常处理打印作业。该漏洞无需身份认证即可利用，攻击条件简单，利用难度低。受影响设备为运行固件 404.590 的 Easycom/Safecom Print Server 系列网络打印服务器。成功利用该漏洞将导致打印服务中断，影响企业办公打印流程。CVSS 评分 5.0，危害等级为中等。"
published = "2001-06-02T04:00:00Z"
remediation = "1. 升级 Easycom/Safecom Print Server 固件至厂商发布的最新版本，修复 PrintGuide 服务对空字符连接缺乏限制的缺陷。2. 若暂无法升级，在防火墙或访问控制列表中限制对 PrintGuide 服务端口的远程访问，仅允许受信任的网段或管理主机连接。3. 如业务不需要远程打印管理功能，可在打印服务器设置中禁用 PrintGuide 服务，阻断攻击面。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "I-Data Easycom Safecom Print Server 远程拒绝服务漏洞"
updated = "2026-06-16T21:53:58Z"

