[basic]
description = "ghostscript 5.10-16 之前版本存在符号链接（symlink）文件覆盖漏洞。当本地用户使用 ghostscript 处理文件时，程序会在临时目录中以不安全的方式创建文件，攻击者可通过预先创建指向其他用户敏感文件的符号链接，使 ghostscript 在解析过程中覆盖该符号链接指向的文件内容。该漏洞影响运行 ghostscript 5.10-16 之前版本的 Linux/Unix 系统，攻击条件要求攻击者已具备本地访问权限且能够控制 ghostscript 处理的目标路径。攻击者利用此漏洞可篡改其他用户的配置文件、系统关键文件等，从而提升权限或造成系统不稳定。"
published = "2001-01-09T05:00:00Z"
remediation = "将 ghostscript 升级至 5.10-16 或更高版本以修复该符号链接攻击漏洞。对于 Red Hat Linux 系统，应用 RHSA-2000:114 安全更新补丁（覆盖 Red Hat Linux 5.0 至 7.0）；对于 Debian 系统，应用 DSA-20001123 安全更新。如无法立即升级，可临时限制普通用户对 ghostscript 的执行权限，仅允许可信用户运行该程序，并定期清理 /tmp 目录下的临时文件以降低符号链接攻击风险。"
score = 3.7
severity = "LOW"
sources = ["avd"]
title = "Ghostscript 符号链接文件覆盖漏洞"
updated = "2026-06-16T21:53:17Z"

