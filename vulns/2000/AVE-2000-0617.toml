[basic]
description = "Allaire JRun 2.3.x 中的 Servlet 示例组件存在信息泄露漏洞。远程攻击者无需身份认证即可通过访问 SessionServlet 等示例 Servlet，获取 HttpSession ID 等敏感信息，进而可能利用获取的会话标识符劫持其他用户的会话。该漏洞影响 JRun 2.3.x 系列版本，CVSS 评分 6.4，危害等级中危。厂商已发布安全公告建议删除或限制对示例 Servlet 的访问。"
published = "2000-06-22T04:00:00Z"
remediation = "删除 JRun 安装目录下的 Servlet 示例文件（特别是 SessionServlet），或确保生产环境不部署示例应用。JRun 2.3.x 已停止维护，建议迁移至 Adobe ColdFusion 或其他受支持的 Java Web 服务器，并遵循最小化安装原则移除所有示例组件。"
score = 6.4
severity = "MEDIUM"
sources = ["avd"]
title = "Allaire JRun Servlet 示例信息泄露漏洞"
updated = "2026-06-16T21:51:57Z"

