[basic]
description = "tags.<value>gBook 1.4 的 index.php 存在认证绕过漏洞，攻击者无需身份验证即可通过将 login 参数设置为 true 来获取管理员权限。该漏洞影响 gBook 1.4 版本，允许远程攻击者绕过登录认证机制，直接获得系统的管理员访问权限。攻击者可通过构造恶意 HTTP 请求，修改 login 参数值来触发漏洞，从而完全控制受影响的应用程序。CVSS 评分为 10，危害等级极高。"
published = "2003-03-31T05:00:00.000"
remediation = "立即升级至 gBook 最新可用版本以修复认证绕过漏洞；若官方已不再提供补丁，应禁用 index.php 管理功能，或在 Web 服务器层面配置 IP 白名单仅允许可信来源访问管理接口，并部署 Web 应用防火墙拦截未授权的管理请求。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "gBook 1.4 认证绕过管理访问漏洞"
updated = "2026-06-16T21:59:33.290"

