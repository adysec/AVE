[basic]
description = "Coder 远程开发环境平台中的 Devcontainer 重建接口存在授权绕过漏洞（CWE-862）。该接口仅依赖路由中间件检查 ActionRead 权限，未像删除接口那样执行 ActionUpdate 权限校验，导致拥有只读工作空间访问权限的低权限角色（如 Template Admin）可触发破坏性重建操作，造成容器内未提交数据丢失，反复调用可导致拒绝服务。攻击者需预先获得目标工作空间的低权限访问凭证方可利用。Coder 已在 v2.29.17、v2.32.7、v2.33.8、v2.34.2 版本中通过添加显式 ActionUpdate 授权检查修复此漏洞。"
published = "2026-07-08T01:16:27Z"
remediation = "tags.<value>立即将 Coder 升级至对应版本的补丁版本：2.34.x 用户升级到 v2.34.2，2.33.x 用户升级到 v2.33.8，2.32.x 用户升级到 v2.32.7，2.29.x ESR 用户升级到 v2.29.17。升级后验证 devcontainer recreate 接口的权限检查已生效，确保低权限角色（如 Template Admin）无法再调用该接口销毁容器。如暂时无法升级，可通过限制低权限角色对 target workspace 的访问来降低风险。"
score = 5.4
severity = "MEDIUM"
sources = ["ghsa"]
title = "Coder Devcontainer 重建接口授权绕过漏洞"
updated = "2026-07-08T19:39:45Z"

