[basic]
description = "Zope 2.2.0 至 2.2.4 版本中存在权限提升漏洞，由于对 Image 和 File 对象的数据更新方法保护不充分，拥有 DTML 编辑权限的攻击者可利用该漏洞修改这些对象的原始数据，导致数据完整性受损。攻击者无需身份认证即可通过网络远程触发，攻击复杂度低，但需要具备 DTML 编辑权限。该漏洞影响 Zope 2.2.x 系列版本，CVSS 评分 5.0，危害等级中危。"
published = "2000-12-18T05:00:00Z"
remediation = "立即升级 Zope 至 2.2.5 或更高版本；如无法升级，安装 Zope 官方 2000-12-18 发布的安全热修复补丁。Debian 用户应用 DSA-007 更新，Red Hat 用户安装 RHSA-2000:135 提供的更新包。同时严格限制 DTML 编辑权限，仅授予可信用户。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Zope 2.2.4 Image和File对象数据更新方法权限保护不当漏洞"
updated = "2026-06-16T21:53:23Z"

