[basic]
description = "AWS API MCP Server 在启动时加载安全策略执行数据，若加载失败则静默跳过后续所有请求的安全策略检查，导致用户配置的 deny 和 gate 规则失效。攻击者可通过诱导服务器在数据加载失败状态下启动（如网络不稳定），绕过安全策略执行本应被拒绝的 AWS API 操作。该漏洞影响版本 0.2.13 至 1.3.46，CVSS 评分 7.3，危害等级高。修复方式为升级至 1.3.47 版本。"
published = "2026-07-23T16:17:15Z"
remediation = "立即将 awslabs.aws-api-mcp-server 升级至 1.3.47 或更高版本。如无法立即升级，可采取以下临时缓解措施：(1) 使用最小权限 IAM 凭证（如 ReadOnlyAccess 角色）限制可执行的操作范围；(2) 若服务器在断网状态下启动，待网络恢复后重启服务进程，确保安全策略数据正确加载。"
score = 7.3
severity = "HIGH"
sources = ["ghsa"]
title = "AWS API MCP Server 安全策略绕过漏洞"
updated = "2026-07-23T19:16:53Z"

