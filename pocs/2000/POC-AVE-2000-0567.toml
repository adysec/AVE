[info]
author = "ave"
description = "验证Internet Explorer 5.01 WebBrowser控件IFRAME跨框架安全策略绕过漏洞，通过NavigateComplete2事件触发跨域数据读取"
id = "POC-AVE-2000-0567"
name = "CVE-2000-0503 PoC"
severity = "low"
tags = ["ave-2000-0567"]
vuln_id = [
    "CVE-2000-0503",
    "AVE-2000-0567",
]

[poc]
