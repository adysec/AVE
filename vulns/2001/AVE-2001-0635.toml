[basic]
description = "INN (InterNetNews) 2.2.3 在特定配置下存在符号链接攻击漏洞。本地攻击者可通过在 INN 临时目录中创建恶意符号链接，诱使 INN 进程以提升的权限向任意文件写入数据，从而实现任意文件覆盖。该漏洞影响 INN 2.2.3 及可能受影响的 Immunix 等 Linux 发行版，攻击前提是攻击者拥有本地访问权限且系统配置了易受攻击的 INN 设置。由于 CVSS 评分仅 1.2，危害等级低，但成功利用可导致系统文件被篡改，进而可能引发权限提升或服务异常。"
published = "2001-03-12T05:00:00Z"
remediation = "建议将 INN (InterNetNews) 升级至 2.2.3-3 及以上版本，该版本已使用 mkstemp 替代不安全的 mktemp 函数，并将所有临时文件创建移至 INN 私有临时目录（如 /var/news/tmp），避免与系统共享临时目录的符号链接竞争。如无法升级，可手动将 INN 临时目录设置为仅 INN 用户可写（chmod 0700 /var/news/tmp），并在系统层面限制本地用户对 /tmp 的符号链接创建权限。"
score = 1.2
severity = "LOW"
sources = ["cve"]
title = "immunix inn 符号链接任意文件写入漏洞"
updated = "2026-06-16T21:53:44Z"

