[basic]
description = "Sendmail 的 SMRSH（Sendmail Restricted Shell）存在命令注入漏洞，由于对 `||` 双管道序列和 `/` 字符过滤不严，攻击者可在已受限的 smrsh 环境中插入额外命令绕过访问限制，导致权限提升或敏感信息泄露。该漏洞影响 Sendmail 8.12.6、8.11.6-15 及 1998 年 5 月 19 日后发布的 8.11 以上版本，需要本地访问权限，攻击复杂度低。"
published = "2002-10-11T04:00:00Z"
remediation = "升级 Sendmail 至 8.12.7 或更高版本，该版本已修复 smrsh 对 || 双管道和 / 字符的过滤不严问题。如无法升级，可限制本地用户对 smrsh 的访问权限，仅允许受信任用户使用，并移除 smrsh 可执行目录中不必要的命令。"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Sendmail SMRSH 双管道访问验证绕过漏洞"
updated = "2026-06-16T21:58:51Z"

