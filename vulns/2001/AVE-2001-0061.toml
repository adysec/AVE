[basic]
description = "AT&T WinVNC（Virtual Network Computing）客户端3.3.3r7及更早版本存在缓冲区溢出漏洞。远程攻击者可通过向目标客户端发送包含超长reason字符串的特制rfbConnFailed数据包，触发缓冲区溢出并远程执行任意代码。该漏洞影响所有使用受影响版本WinVNC客户端的用户，攻击者无需身份认证即可发起利用，但需要诱骗用户连接到恶意VNC服务器。成功利用可导致攻击者完全控制目标系统，包括查看屏幕内容、控制鼠标键盘以及执行任意命令。由于需要用户主动连接攻击者控制的服务器，攻击复杂度较高，但一旦成功将造成严重的信息泄露和系统沦陷风险。"
published = "2001-05-03T04:00:00Z"
remediation = "立即升级 RealVNC 客户端至 3.3.8 或更高版本（vncviewer.exe），该版本已修复 rfbConnFailed 数据包中的缓冲区溢出漏洞。如使用 AT&T WinVNC，同样需升级至 3.3.3r8 及更新版本。如暂时无法升级，应在防火墙或主机 ACL 中限制 VNC 客户端仅允许连接至受信任的 VNC 服务器（5900/5901/5902 端口），并禁用客户端自动重连功能，避免自动向恶意服务器发起连接。同时可考虑在终端上部署入侵检测规则，监控异常的 RFB 协议流量。"
score = 7.6
severity = "HIGH"
sources = ["epss"]
title = "AT&T WinVNC 客户端缓冲区溢出漏洞"
updated = "2026-06-16T21:53:47Z"

