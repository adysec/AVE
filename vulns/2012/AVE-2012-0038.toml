[basic]
description = "Mozilla Firefox 3.6.26之前版本及4.x至9.0版本、Thunderbird 3.1.18之前版本及5.0至9.0版本、SeaMonkey 2.7之前版本中存在内存破坏漏洞。远程攻击者可通过在文档中嵌入特制的恶意XSLT样式表，触发内存破坏，导致目标应用程序崩溃或拒绝服务。由于XSLT处理器在处理畸形样式表时存在内存管理缺陷，攻击者无需身份认证即可利用此漏洞，CVSS评分9.3，危害严重。"
published = "2012-02-01T16:55:01Z"
remediation = "升级 Firefox 至 3.6.26 或 10.0 及以上版本，升级 Thunderbird 至 3.1.18 或 10.0 及以上版本，升级 SeaMonkey 至 2.7 及以上版本。无法立即升级时，可在浏览器中禁用 XSLT 或通过内容安全策略（CSP）限制样式表加载作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/SeaMonkey/Thunderbird XSLT样式表处理内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:17Z"

