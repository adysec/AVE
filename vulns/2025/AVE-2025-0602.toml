[basic]
description = "tags only.<value>libcurl 在复用 easy 或 multi 句柄进行 TLS 相关传输，并修改 CURLSSLOPT_NO_PARTIALCHAIN 选项时，可能意外复用内存中已缓存的 CA 证书库，而该证书库中的部分链选项状态已被反向改变，与用户预期相悖。这会导致 libcurl 接受原本不应接受的信任链，攻击者可借此向存在缓存复用场景的客户端（如使用 libcurl 的各类应用程序）发起中间人攻击，绕过证书链验证并窃取受保护数据传输的机密信息（CVSS 3.1 评分 5.3，CWE-295 证书验证不当）。攻击条件较为苛刻：需要用户交互配合且要求较高的攻击复杂度，仅影响重用句柄且动态切换 partial chain 选项的特定 TLS 使用场景。受影响的用户应升级至修复该漏洞的 curl 版本，避免启用易引发缓存混淆的配置组合。"
published = "2026-01-08T10:15:46Z"
remediation = "建议立即将 libcurl/curl 升级至 8.18.0 或更高版本（该漏洞在 8.18.0 中修复，受影响范围为 7.87.0 至 8.17.0），可通过发行版软件源更新 curl 包完成。若无法立即升级，作为缓解措施：1) 避免在应用代码中设置 CURLSSLOPT_NO_PARTIALCHAIN 选项，以关闭部分信任链校验的逆向风险；2) 将 CURLOPT_CA_CACHE_TIMEOUT 设置为 0，禁用 libcurl 的 CA 存储内存缓存，防止跨传输复用被逆转的信任链配置。注意该漏洞仅影响使用 OpenSSL（或其衍生库）后端的 libcurl，且不影响 curl 命令行工具，升级后建议重新编译依赖 libcurl 的应用程序。"
score = 5.3
severity = "MEDIUM"
sources = ["msrc"]
title = "curl libcurl 证书链部分信任策略绕过漏洞"
updated = "2026-06-17T08:36:36Z"

