[basic]
description = "Flowerfire Sawmill 5.0.21 使用弱加密算法存储用户密码，攻击者可通过获取密码存储文件后利用加密算法的弱点直接解密出明文密码，进而登录管理后台修改 SawMill 配置，获取系统控制权。该漏洞源于程序对密码仅进行了简单的可逆编码处理而非安全的哈希加盐存储，攻击难度较低，无需身份认证即可利用，CVSS 评分 7.5，危害等级高。"
published = "2000-06-26T04:00:00Z"
remediation = "立即升级 Sawmill 至 5.0.21 以上版本（厂商在 2000 年 7 月已发布修复版本），新版本改用强加密算法存储密码。如无法升级，手动加密配置文件中的密码字段，并将配置文件的文件权限设为仅管理员可读（chmod 600），同时限制对 Sawmill Web 管理界面的网络访问范围。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Flowerfire Sawmill 弱密码加密漏洞"
updated = "2026-06-16T21:52:03Z"

