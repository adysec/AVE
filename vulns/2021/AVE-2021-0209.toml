[basic]
description = "Adobe Acrobat Reader DC 存在堆溢出漏洞（CWE-122、CWE-787），攻击者可构造恶意的 PDF 文件，在用户打开时触发堆缓冲区溢出，从而在当前用户上下文中执行任意代码。该漏洞影响 2020.013.20074 及更早版本、2020.001.30018 及更早版本以及 2017.011.30188 及更早版本的 Acrobat Reader DC，CVSS 评分为 8.8（高危）。利用此漏洞需要用户交互，受害者必须主动打开特制的恶意文件，未经身份认证的远程攻击者即可利用此漏洞实现远程代码执行。"
published = "2021-02-11T20:15:13.997"
remediation = '根据 Adobe 安全公告 APSB21-09，请立即将 Adobe Acrobat 和 Acrobat Reader 升级到以下修复版本：Acrobat/Reader DC 连续轨道升级至 2021.001.20135 或更高版本；2020 经典轨道升级至 2020.001.30020 或更高版本；2017 经典轨道升级至 2017.011.30190 或更高版本。可通过"帮助"→"检查更新"或访问 Adobe 官网下载完整安装包进行更新。如无法立即安装补丁，建议暂时不要打开来源不明的 PDF 文件，并在浏览器及邮件客户端中禁用 PDF 的自动预览功能，以降低被利用的风险。'
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Adobe Acrobat Reader 堆溢出漏洞"
updated = "2026-06-17T03:34:40.193"

