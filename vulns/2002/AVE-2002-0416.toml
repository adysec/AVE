[basic]
description = 'National Instruments LabVIEW Web Server 5.1.1 至 6.1 版本存在 HTTP 请求解析缺陷，远程攻击者无需身份认证即可通过发送以两个换行符（\n\n）结尾而非标准回车换行符（\r\n）的 HTTP GET 请求，触发服务器崩溃，导致拒绝服务。该漏洞影响 LabVIEW 5.1.1、6.0 及 6.1 版本，攻击复杂度低，无需特殊权限，仅需网络可达即可利用，危害等级中危。'
published = "2002-08-12T04:00:00Z"
remediation = '升级 LabVIEW 至 6.1 以上版本（如 7.0 或更高），该漏洞已在后续版本中修复。若无法升级，可在 LabVIEW Web Server 配置中禁用 HTTP 服务或限制仅允许可信 IP 访问，同时在反向代理或防火墙层面过滤异常 HTTP 请求（如检测连续两个换行符 `\n\n` 而非标准 `\r\n` 的 GET 请求）作为临时缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "National Instruments LabVIEW Web Server HTTP请求拒绝服务漏洞"
updated = "2026-06-16T21:58:03Z"

