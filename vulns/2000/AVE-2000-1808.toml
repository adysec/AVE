[basic]
description = "Half Life 专用服务器（build 3104 及更早版本）存在格式化字符串漏洞，远程攻击者无需身份认证即可通过系统控制台或 rcon 接口向 changelevel 命令注入特制格式化字符串，触发内存越界读写，导致任意代码执行。该漏洞 CVSS 评分 10.0，危害等级严重，攻击者可完全控制受影响服务器。"
published = "2000-12-19T05:00:00.000"
remediation = "将 Half-Life Dedicated Server 升级至 build 3104 以上版本，该漏洞已在后续版本中修复。如无法升级，在服务器防火墙中限制 rcon 端口的访问来源 IP，仅允许受信任的管理员 IP 连接，并禁用系统控制台远程访问功能以降低攻击面。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Valve Half-Life Dedicated Server 格式化字符串远程代码执行漏洞"
updated = "2026-06-16T21:52:52.763"

