[basic]
description = "OpenSSH 2.0至3.0.2版本的通道代码中存在差一错误（Off-by-one）漏洞。远程恶意服务器或本地用户可利用该漏洞触发缓冲区溢出，从而获取目标系统的特权访问权限。攻击者无需身份认证即可发起攻击，且攻击复杂度较低。该漏洞影响所有运行受影响OpenSSH版本的系统，可导致完全的信息泄露、权限提升和系统控制。建议用户升级至OpenSSH 3.0.2以上版本以修复此漏洞。"
published = "2002-03-15T05:00:00.000"
remediation = "立即将 OpenSSH 升级至 3.1 或更高版本。各发行版用户请参考对应安全公告安装补丁：Debian 用户安装 DSA-119 更新，Red Hat 用户安装 RHSA-2002:043 更新，FreeBSD 用户安装 FreeBSD-SA-02:13 更新，NetBSD 用户安装 NetBSD-SA2002-004 更新。如无法立即升级，可手动应用 OpenBSD 官方补丁：将 channels.c 中第 149 行的 `if (id < 0 || id > channels_alloc)` 改为 `if (id < 0 || id >= channels_alloc)` 并重新编译 OpenSSH。"
score = 9.8
severity = "CRITICAL"
sources = ["redhat"]
title = "OpenSSH Channel Code Off-by-One 权限提升漏洞"
updated = "2026-06-16T21:56:44.270"

