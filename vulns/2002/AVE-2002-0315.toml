[basic]
description = 'DCShop 1.002 Beta 的 dcshop.cgi 存在空字节注入漏洞，远程攻击者可在 database 参数中注入空字符（\0），绕过文件路径校验并删除任意设置文件。该漏洞影响 DCShop 1.002 Beta 版本，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:P/A:N），属于部分完整性影响漏洞。攻击者无需身份认证即可远程利用，通过构造包含空字符的 database 参数请求 dcshop.cgi，即可删除服务器上的任意设置文件，导致配置破坏或服务拒绝。攻击条件为网络可达且无需认证，攻击复杂度低。官方已停止维护，建议升级至修复版本或迁移至其他电商系统。'
published = "2002-08-12T04:00:00Z"
remediation = "建议立即升级至 DCShop 官方发布的最新修复版本（若已停止维护建议迁移至成熟电商系统），或在 Web 应用防火墙（WAF）配置规则拦截 database 参数中的空字符（%00），同时设置 setup 目录及其文件为只读权限（chmod 444），并禁用 dcshop.cgi 中不必要的文件删除功能。若无法升级，建议部署 WAF 规则拦截包含 %00 的请求参数，并限制 Web 服务器进程对 setup 目录的写入权限。立即部署 Web 应用防火墙规则拦截 database 参数中的空字节注入，并将 setup 目录权限设为只读（chmod 555）防止文件被删除，建议尽快迁移至维护中的电商系统。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "DCscripts DCShop 1.002 Beta 空字节注入任意文件删除漏洞"
updated = "2026-06-16T21:57:32Z"

