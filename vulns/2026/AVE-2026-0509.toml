[basic]
description = "Apple 多系统音频处理组件存在越界读取漏洞（CWE-125），在处理恶意构造的媒体文件中的音频流时，由于边界检查不充分，攻击者可通过诱导用户打开特制媒体文件触发越界读取，导致进程异常终止，造成拒绝服务。该漏洞影响 iOS 18.7.7/iPadOS 18.7.7、iOS 26.4/iPadOS 26.4、macOS Sequoia 15.7.5/Sonoma 14.8.5/Tahoe 26.4、tvOS 26.4、visionOS 26.4 及 watchOS 26.4 等多个 Apple 操作系统版本。攻击需要用户交互，远程攻击者无法直接利用，CVSS 评分 6.5，危害等级中危。Apple 已在 2026 年 3 月安全更新中修复此漏洞。"
published = "2026-03-25T01:17:05Z"
remediation = "建议立即将受影响设备升级至以下安全版本：iOS 18.7.7 / iOS 26.4、iPadOS 18.7.7 / iPadOS 26.4、macOS Sequoia 15.7.5 / Sonoma 14.8.5 / Tahoe 26.4、tvOS 26.4、visionOS 26.4、watchOS 26.4。可通过「设置」→「通用」→「软件更新」获取最新版本。临时缓解措施：避免在受影响设备上打开来源不明的媒体文件。"
score = 6.5
severity = "MEDIUM"
sources = ["zdi"]
title = "Apple 多系统音频处理越界访问漏洞"
updated = "2026-06-17T10:17:42Z"

