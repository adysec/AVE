[basic]
description = "Docker Buildx 的缓存后端配置支持通过设置属性值的方式传递凭据，当用户将敏感凭据作为 cache-to/cache-from 配置的属性值输入时，这些安全值可能被 OpenTelemetry 追踪功能捕获并记录到遥测端点中，导致凭据泄露。该漏洞影响使用 Buildx 缓存后端配置传递凭据的场景，攻击者需要具备本地访问权限并诱导用户执行特定操作才能利用，CVSS 评分 4.1，危害等级中危。此漏洞不影响通过环境变量或注册表认证方式传递给 GitHub 缓存后端的凭据。"
published = "2025-03-17T20:15:13Z"
remediation = "立即将 Docker buildx 升级至 v0.21.3 或更高版本（当前最新版为 v0.35.0），可通过 `docker buildx upgrade` 或从 GitHub Releases 页面下载替换二进制文件。如无法立即升级，应避免在 `cache-to/cache-from` 配置的 CLI 参数中直接传递凭据值，改用环境变量或 registry 认证方式传递；同时确保 OpenTelemetry 追踪数据及 BuildKit 守护进程历史记录仅存储在受控安全环境中，防止凭据泄露。"
score = 4.1
severity = "MEDIUM"
sources = ["msrc"]
title = "Docker buildx 缓存后端配置密钥泄露到遥测端点漏洞"
updated = "2026-06-17T08:26:35Z"

