[basic]
description = "Open WebUI 是一个可扩展的自托管 AI 平台。在 0.9.6 至 0.11.0 版本中，当启用了 Playwright 网页加载引擎（WEB_LOADER_ENGINE=playwright）时，系统仅对用户提交的顶层页面 URL 执行地址验证，而页面加载后由 JavaScript 发起的子资源请求（如图片、脚本、样式表、AJAX 请求等）则完全绕过验证机制。任意已认证用户（无需管理员权限）可通过提交恶意 URL 触发网页抓取或 RAG 文档摄入，使 Playwright 浏览器向内部网络地址发起请求，读取云实例元数据（169.254.169.254）、同网络容器服务或绑定了内网地址的 API 等敏感信息。由于浏览器返回的完整 DOM 会包含从内部服务获取的数据，攻击者可通过 web-search 或文档摄入结果获取这些信息，实现内网信息横向读取。该漏洞由 SafePlaywrightURLLoader 组件的请求拦截器缺陷导致，其仅对 document 类型的请求进行验证并过早返回，忽略了所有其他资源类型的请求。官方已在 0.11.0 版本中通过提交 bef63a2ae 修复此问题，升级至 0.11.0 可完全解决该问题，无需额外配置修改。"
published = "2026-08-04T20:16:54Z"
remediation = '立即将 Open WebUI 升级至 0.11.0 或更高版本（对应 commit bef63a2ae），该版本对所有子资源请求和重定向请求增加了全局地址验证，同时通过 service_workers="block" 和 WebSocket 路由处理器阻止绕过验证器的路径。如无法立即升级，可临时将 WEB_LOADER_ENGINE 环境变量设为非 playwright 的值以禁用 Playwright 加载器，避免子资源请求绕过地址检查。'
score = 7.7
severity = "HIGH"
sources = ["ghsa"]
title = "Open WebUI 服务器端请求伪造漏洞"
updated = "2026-08-05T16:17:02Z"

