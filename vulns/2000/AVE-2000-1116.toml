[basic]
description = "Abisoft Baxter X/Y IRC 客户端在 BeOS r5 pro 及更早版本中存在 URL 长度验证缺陷。当客户端接收到包含超长 URL 的 IRC 消息时，由于未对 URL 长度进行有效边界检查，导致内存缓冲区处理异常，触发拒绝服务。未经身份认证的远程攻击者可通过向目标用户发送含有特制超长 URL 的 IRC 消息，使客户端程序崩溃或失去响应。该漏洞影响所有运行 BeOS r5 pro 及更早版本并使用 Abisoft Baxter IRC 客户端的用户，攻击者无需任何凭据即可在网络上发起攻击。攻击者只需构造一条包含超长 URL 的 IRC 消息并发送给目标用户，即可触发漏洞，造成客户端拒绝服务，严重影响用户正常通信体验。"
published = "2001-01-09T05:00:00Z"
remediation = "BeOS 系统已停止维护，无官方补丁。建议迁移至现代操作系统（如 Haiku、Linux 或 Windows）并使用现代 IRC 客户端（如 HexChat、WeeChat、Irssi）。若必须短期使用 BeOS，可在网络层面配置防火墙规则拦截超过 256 字节的 IRC PRIVMSG 消息，或在 IRC 服务器端部署消息长度限制插件作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Abisoft Baxter IRC 客户端远程拒绝服务漏洞"
updated = "2026-06-16T21:53:16Z"

