[basic]
description = "ImageMagick libmagick 库 5.5 及更早版本存在不安全的临时文件创建漏洞，本地攻击者可利用该漏洞在系统上创建或覆盖任意文件，进而导致权限提升、数据篡改或拒绝服务等危害。该漏洞影响使用受影响版本 libmagick 库的 Linux/Unix 系统，攻击者需具备本地访问权限，通过在临时文件竞争窗口期内创建符号链接等方式覆盖关键系统文件。Debian、Red Hat 等主流发行版已发布安全公告并修复此漏洞。"
published = "2003-08-07T04:00:00Z"
remediation = "升级 ImageMagick 至 5.5.7 或更高版本（libmagick 库同步升级），官方已修复临时文件不安全创建问题。如无法立即升级，可将应用运行权限降为非特权用户，并设置 /tmp 目录 sticky 位（chmod 1777 /tmp），避免本地用户利用临时文件竞争写入任意文件。Debian 用户应安装 DSA-331 安全更新，Red Hat 用户应安装 RHSA-2004-494 补丁。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "ImageMagick libmagick 不安全的临时文件创建漏洞"
updated = "2026-06-16T22:02:14Z"

