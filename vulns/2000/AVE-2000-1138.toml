[basic]
description = "Argosoft FRP server 1.0 的 FTP 服务在处理远程客户端发送的 USER 和 CWD 命令时，未能对输入字符串长度实施严格校验。未经身份认证的远程攻击者可通过向目标服务器的 FTP 端口发送超长字符串，触发缓冲区溢出或内存耗尽，进而导致服务拒绝服务崩溃。在某些条件下，该漏洞还可能被利用执行任意系统命令。该漏洞影响 Argosoft FRP server 1.0 版本，攻击者仅需具备网络可达性即可发起利用，无需任何凭据或用户交互。"
published = "2001-08-31T00:00:00Z"
remediation = "建议立即停止使用受影响的过时 FTP 服务器软件，将其升级至现代安全版本或迁移至支持加密传输的 SFTP/FTPS 协议。若必须保留该服务，请在防火墙层面限制访问来源 IP，或通过配置限制单个 IP 的并发连接数以缓解拒绝服务攻击。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Argosoft FRP Server 拒绝服务漏洞"
updated = "2001-08-31T00:00:00Z"

