[basic]
description = "Aruba AirWave 管理平台 VisualRF 组件存在反射型跨站脚本（XSS）漏洞。攻击者可通过向已登录的管理员用户发送特制链接，诱使其点击后，恶意脚本将在用户浏览器中执行，导致攻击者能够窃取会话 Cookie、登录凭据等敏感信息。该漏洞影响 AirWave 8.2.3.1 之前的所有版本，攻击者无需身份认证即可发起攻击，但需要目标管理员用户在同一浏览器中已登录 AirWave 并点击恶意链接。CVSS 评分 6.1，危害等级中危。HPE Aruba 已在 AirWave 8.2.3.1 版本中修复此漏洞。"
published = "2018-08-06T20:29:00Z"
remediation = "升级 Aruba AirWave 至 8.2.3.1 或更高版本以修复 VisualRF 组件中的反射型 XSS 漏洞。如无法立即升级，可在 Web 应用防火墙（WAF）层面添加规则，过滤 VisualRF 页面 URL 参数中的恶意脚本关键字（如 &lt;script&gt;、onerror= 等），并限制 AirWave 管理界面仅允许受信任 IP 访问，降低被利用风险。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Aruba AirWave VisualRF 跨站脚本漏洞"
updated = "2026-06-17T00:54:29Z"

