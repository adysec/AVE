[basic]
description = "Gitea 内部 API HTTP 客户端（modules/private/internal.go）硬编码了 TLSClientConfig.InsecureSkipVerify = true，且未提供任何配置选项来关闭此不安全行为。当运维人员在多主机或多 Pod 部署拓扑中将 LOCAL_ROOT_URL 配置为 HTTPS 协议指向非回环地址时，gitea serv 和 gitea hook 等子进程发起的内部 API 调用会接受任意 TLS 证书。位于同一网络段的攻击者可通过中间人攻击拦截连接，窃取用于认证所有 /api/internal/* 接口的静态高权限 INTERNAL_TOKEN，进而实现服务器重启、SSH 密钥授权、Git 命令执行、仓库钩子控制、邮件发送及 Actions Runner Token 生成等操作。该漏洞自 2017 年引入，影响所有 Gitea 版本，而其他出站 TLS 客户端（如 Webhook、Migrations、MinIO、LDAP、SMTP）均提供可配置的安全开关。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级 Gitea 至 v1.27.0 或更高版本，该版本已修复 internal API 客户端硬编码 InsecureSkipVerify 的问题。对于无法立即升级的分裂主机部署场景，临时缓解措施包括：(1) 将 LOCAL_ROOT_URL 改为 http+unix 套接字或 HTTP 回环地址，避免内部通信走 TLS；(2) 在防火墙/网络策略层面限制对 Gitea 内部 API 端口（/api/internal/*）的访问，仅允许受信主机连接；(3) 使用 mTLS 或 VPN 加固内部通信链路，防止中间人攻击。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Gitea 内部API HTTP客户端TLS证书验证绕过漏洞"
updated = "2026-01-01T00:00:00Z"

