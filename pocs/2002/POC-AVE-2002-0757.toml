[info]
author = "ave"
description = "QNX RTOS 4.25 和 6.1.0 的 ptrace 系统调用存在权限控制缺陷，允许普通程序附加到特权进程并修改其运行状态，本地用户可通过此漏洞执行任意代码。实际利用代码参见 ExploitDB 21507（https://www.exploit-db.com/exploits/21507），需在目标系统上编译运行 C 语言利用程序。"
id = "POC-AVE-2002-0757"
name = "CVE-2002-2042 QNX ptrace() 任意进程修改漏洞 PoC"
severity = "high"
tags = ["ave-2002-0757"]
vuln_id = [
    "CVE-2002-2042",
    "AVE-2002-0757",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/proc/self/status"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["TracerPid"]
