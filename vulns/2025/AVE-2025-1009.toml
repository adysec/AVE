[basic]
description = "Linux内核的nfp（Netronome Flow Processor）BPF子系统中，`nfp_bpf_cmsg_alloc()`函数调用`nfp_app_ctrl_msg_alloc()`分配控制消息内存时，未对返回值进行空指针检查。当内存分配失败时，返回的NULL指针被直接解引用，导致空指针引用漏洞（CWE-476）。该漏洞影响搭载Netronome网络处理器的Linux系统，CVSS评分5.5。本地低权限攻击者无需用户交互即可通过触发内存分配失败场景利用该漏洞，造成内核崩溃或系统拒绝服务，严重影响系统可用性。"
published = "2025-03-12T10:15:17Z"
remediation = "立即升级 Linux 内核至修复版本：5.4.291、5.10.235、5.15.179 或 6.1.130 及以上版本。Debian 用户可升级至 5.10.237-1（bullseye）或 6.1.133-1（bookworm），Ubuntu 用户可升级至 5.4.0-216.236、5.15.0-140.150 或 6.8.0-78.78，RHEL 9 用户请安装 RHSA-2025:20518 安全更新。如当前系统运行内核版本低于 6.1.130 且未使用 NFP 智能网卡，可临时通过 modprobe -r nfp 卸载 nfp 内核模块作为缓解措施，但升级内核后需重启系统以确保补丁生效。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 nfp BPF 空指针解引用漏洞"
updated = "2026-06-17T08:44:26Z"

