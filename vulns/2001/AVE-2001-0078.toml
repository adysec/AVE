[basic]
description = "Heat-On HSWeb Web Server 2.0 存在信息泄露漏洞，当服务器启用目录浏览功能时，未经身份认证的远程攻击者只需向目标服务器发送针对 /cgi/ 目录的HTTP请求，即可在页面响应中获取服务器的物理文件路径。该漏洞影响所有运行 Heat-On HSWeb 2.0 版本的Web服务器，攻击条件为目标服务器开启了目录浏览功能且攻击者能够访问其HTTP服务。泄露的物理路径信息可辅助攻击者进一步了解服务器文件系统结构，为后续渗透攻击（如本地文件包含、敏感文件定位等）提供便利，存在潜在的安全风险。"
published = "2001-05-03T04:00:00.000"
remediation = "如已升级至更新版本请确保目录浏览功能已被禁用；如仍运行该版本，应在服务器配置中关闭目录索引（Directory Indexing）功能，并移除或限制对 `/cgi/` 目录的访问权限。若厂商已发布补丁，请立即升级至最新版本；因该软件已停止维护，建议迁移至受支持的 Web 服务器。临时缓解措施可在防火墙或反向代理层拦截对 `/cgi/` 路径的访问请求。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Heat-On HSWeb Web Server 路径泄露漏洞"
updated = "2026-06-16T21:53:52.183"

