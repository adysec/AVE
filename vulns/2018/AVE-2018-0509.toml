[basic]
description = "TIBCO JasperReports 系列产品（包括 Library、Server 及 AWS 版本）的默认服务器实现存在目录遍历漏洞（CWE-22）。由于对用户提供的文件路径缺乏充分验证，已认证的 Web 服务器用户可通过在请求中构造包含 `../` 等路径遍历序列的特制 URL，突破目录限制访问主机系统上的任意文件，导致敏感信息泄露。该漏洞影响 TIBCO JasperReports Library ≤6.3.4/6.4.1/6.4.2/6.4.21/7.1.0/7.2.0、JasperReports Server ≤6.3.4/6.4.0-6.4.3/7.1.0 等多个版本，CVSS 评分 6.5，危害等级中危。攻击者需拥有 Web 服务器有效账户方可利用，无需用户交互。"
published = "2019-03-07T22:29:00Z"
remediation = "升级 TIBCO JasperReports Library 至 7.2.1 及以上版本，JasperReports Server 至 7.1.1 及以上版本，JasperReports Library Community Edition 至 6.7.1 及以上版本。如无法立即升级，在反向代理或 WAF 层添加规则，对 `/reportresource/reportresource/` 路径的 `resource` 参数进行路径遍历过滤，拦截包含 `../` 的请求。同时限制 Web 服务器运行账户对敏感文件（如 `js.jdbc.properties`）的读取权限。"
score = 6.5
severity = "MEDIUM"
sources = ["nuclei"]
title = "TIBCO JasperReports Library 目录遍历漏洞"
updated = "2026-06-17T01:47:56Z"

