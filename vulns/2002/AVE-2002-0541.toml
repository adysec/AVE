[basic]
description = "FreeBSD 4.6.2-RELEASE 及更早版本中，使用 libkvm 库的端口程序（asmon、ascpu、bubblemon、wmmon、wmnet2）存在文件描述符泄漏漏洞。这些程序在访问 /dev/mem 和 /dev/kmem 设备后未正确关闭打开的文件描述符，导致本地攻击者可利用泄漏的描述符读取内核内存中的敏感信息。攻击者需拥有本地系统访问权限，无需特殊权限即可利用，攻击复杂度低。"
published = "2002-09-24T04:00:00Z"
remediation = "升级 FreeBSD 至 4.6.2-RELEASE 以上版本，或更新受影响端口程序（asmon、ascpu、bubblemon、wmmon、wmnet2）至厂商修复版本。如无法升级，限制 /dev/mem 和 /dev/kmem 文件权限为仅 root 可读（chmod 600 /dev/mem /dev/kmem），并确保受影响程序以非特权用户运行。"
score = 2.1
severity = "LOW"
sources = ["exploitdb"]
title = "FreeBSD libkvm 端口程序内核内存文件描述符泄漏漏洞"
updated = "2026-06-16T21:58:46Z"

