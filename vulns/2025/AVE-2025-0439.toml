[basic]
description = "libxslt 在处理跨 RVT（运行时值树）存储的 xsl:key 数据时存在释放后使用（Use-After-Free）漏洞。当解析特制的 XSL 节点时，程序在释放内存后未正确清除指针，导致攻击者可通过诱导用户打开恶意构造的 XSLT 样式表文件，触发对已过期指针的解引用，造成应用程序崩溃。该漏洞为本地攻击向量，需要用户交互，影响使用 libxslt 库的应用程序，CVSS 评分 5.5，危害等级中等。"
published = "2025-09-25T16:15:31.337"
remediation = "升级 libxslt 至 1.1.44 及以上版本（1.1.44 于 2025-11-25 发布，包含 MR!77 修复）。RHEL 用户安装对应 RHSA 更新：RHEL 8 升级至 libxslt-1.1.32-6.4.el8_10，RHEL 10 升级至 libxslt-1.1.39-8.el10_2.1。如无法立即升级，避免在不受信任的 XSLT 样式表中使用 `<xsl:key>` 元素作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "GNOME libxslt 释放后使用漏洞"
updated = "2026-07-23T14:16:56.823"

