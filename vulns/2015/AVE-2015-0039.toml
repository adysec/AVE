[basic]
description = "Koha 3.20.1 及之前版本存在目录遍历漏洞，远程攻击者可通过向受影响系统发送特制的 HTTP 请求，利用未正确过滤的路径参数遍历服务器目录结构，从而读取系统上的任意文件，包括配置文件、密码文件等敏感信息。该漏洞无需身份认证即可利用，攻击复杂度低，危害较大。官方尚未发布修复补丁，建议用户限制对 Koha 系统的网络访问权限以降低风险。"
published = "2018-10-19"
remediation = "立即将 Koha 升级至 3.20.1、3.18.8、3.16.12 或 3.14.16 及以上版本，官方已在对应安全版本中修复了 template_path 参数路径遍历问题。如无法立即升级，可在 Web 服务器（如 Apache/Nginx）层面添加规则，拦截对 /cgi-bin/koha/svc/virtualshelves/search 和 /cgi-bin/koha/svc/members/search 路径中 template_path 参数包含 ..%2f 或 ../ 的请求，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Koha 目录遍历任意文件读取漏洞"
updated = "2018-10-19"

