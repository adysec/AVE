[basic]
description = "phpGroupWare 0.9.12 及更早版本在 PHP 配置中禁用 magic_quotes_gpc 特性时，存在 SQL 注入漏洞。远程攻击者可通过构造恶意 SQL 语句注入到数据库查询中，绕过输入过滤机制，直接操作或破坏后端数据库。该漏洞影响所有运行在 magic_quotes_gpc 关闭环境下的 phpGroupWare 0.9.12 及更早版本，攻击者无需身份认证即可远程利用，CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），影响机密性、完整性和可用性。攻击者可通过构造恶意 SQL 语句注入到输入参数中，绕过 magic_quotes_gpc 保护机制缺失的输入过滤，直接执行任意 SQL 命令，导致数据库泄露、篡改或破坏。建议升级至修复版本或启用 PHP 的 magic_quotes_gpc 配置选项。Debian 已发布相关安全更新修复该漏洞。"
published = "2002-07-03T04:00:00Z"
remediation = "升级 phpGroupware 到 0.9.13 或更高版本（包含安全修复），并确保在安装时启用 PHP 配置项 magic_quotes_gpc 以自动转义特殊字符。如无法立即更新，可通过在 php.ini 文件中添加 `magic_quotes_gpc = On` 设置来临时缓解风险。此外，建议实施输入验证和使用预编译语句技术来进一步加强应用安全性。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "phpGroupWare SQL注入漏洞"
updated = "2026-06-16T21:57:37Z"

