[basic]
description = "AOL Instant Messenger（AIM）4.7.2480、4.8.2616 及更早版本存在远程缓冲区溢出漏洞。攻击者可通过向目标用户发送特制的游戏请求（AddGame 命令），其中包含超长参数触发栈缓冲区溢出，从而在目标系统上以当前用户权限执行任意代码。该漏洞无需身份认证即可远程利用，CVSS 评分 10.0，危害等级严重。受影响的 AOL Instant Messenger 版本已停止维护，建议用户升级至替代即时通讯软件。"
published = "2002-01-31T05:00:00Z"
remediation = "建议立即卸载 AOL Instant Messenger 4.x 系列版本（包括 4.7.2480、4.8.2616 及更早版本），该产品已停止维护且不再提供安全更新。作为替代方案，请迁移至官方支持的即时通讯软件。若因业务需要暂时无法卸载，可在网络边界防火墙或主机防火墙中阻止 AIM 使用的 TCP 5190 端口的入站连接，以阻断远程攻击者的利用途径。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "AOL Instant Messenger 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:56:34Z"

