[basic]
description = 'ZyXEL Prestige 642R 和 Prestige 310 路由器存在 ICMP 畸形数据包拒绝服务漏洞。远程攻击者无需身份认证即可向目标设备发送特制的超大分片 "jolt" 风格 ICMP 数据包，触发设备协议栈处理异常，导致路由器崩溃或重启，无法正常提供网络服务。该漏洞影响 Prestige 642R 2.50(FA.1) 及 Prestige 310 V3.25(M.01) 版本，CVSS 评分 5.0，危害等级中危。厂商已发布固件更新修复此问题。'
published = "2002-10-04T04:00:00Z"
remediation = "该漏洞影响 ZyXEL Prestige 642R 2.50(FA.1) 及 Prestige 310 V3.25(M.01) 路由器，上述产品已停产且厂商不再提供安全更新。建议立即将受影响设备替换为受支持的型号。如无法立即替换，可在网络边界防火墙上配置 ACL 规则，丢弃超大分片 ICMP 数据包（例如 iptables 规则：iptables -A INPUT -p icmp -f -j DROP），并限制仅受信任的内部 IP 地址可访问设备 Web 管理界面（TCP 端口 80/443）和 Telnet/SSH 服务，同时禁用 WAN 侧 ICMP 响应以降低攻击面。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "ZyXEL Prestige 642R/310 ICMP 畸形数据包拒绝服务漏洞"
updated = "2026-06-16T21:58:40Z"

