[basic]
description = "SSH Communications Security sshd 2.4 for Windows 存在拒绝服务漏洞。未经身份认证的远程攻击者可通过向目标 SSH 服务器发起大量并发连接请求，快速耗尽系统连接池及内存资源，导致合法用户无法正常建立 SSH 连接，造成服务中断。该漏洞影响运行 sshd 2.4 版本的 Windows 系统，攻击条件为攻击者能够通过网络访问目标主机的 SSH 端口（默认 22 端口），且无需任何凭据即可发起利用，攻击门槛低、影响面广。"
published = "2001-06-27T04:00:00Z"
remediation = "将 SSH Secure Shell for Windows Server 从 2.4 版本升级至 2.5 或更高版本，该版本已修复 ssheloop.c 中事件循环无法处理 64 个以上并发连接导致断言失败的问题。如短期内无法升级，可在防火墙或 TCP Wrapper 层对 SSH 服务 (TCP/22) 实施连接数限制，或通过 IP 白名单仅允许受信地址访问，以缓解拒绝服务风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "SSH Communications Security sshd 拒绝服务漏洞"
updated = "2026-06-16T21:54:10Z"

