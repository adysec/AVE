[basic]
description = "Apple iOS 5.1 之前版本及 iTunes 10.6 之前版本中使用的 WebKit 引擎存在内存破坏漏洞（CWE-119）。远程攻击者可诱导用户访问特制恶意网站，触发 WebKit 在处理畸形网页内容时发生内存损坏，导致应用程序崩溃或实现任意代码执行。该漏洞影响 Safari 5.1.4 及更早版本，CVSS 评分 9.3，危害严重。Apple 已在 2012 年 3 月安全更新中修复此漏洞。"
published = "2012-03-08T22:55:02Z"
remediation = "将 Safari 升级至 5.1.4 或更高版本，将 iOS 升级至 5.1 或更高版本，将 iTunes 升级至 10.6 或更高版本。对于无法升级的设备，建议禁用 JavaScript 并避免访问不可信网站作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:53Z"

