[basic]
description = "Red Hat Linux 系统中 Secure Locate (slocate) 工具存在权限提升漏洞。本地攻击者可通过设置恶意的 LOCATE_PATH 环境变量，指定特制的配置文件，从而在 slocate 执行时触发该漏洞，获取目标系统的敏感信息读取权限、文件写入权限及程序执行权限。该漏洞攻击复杂度低，无需身份认证即可利用，影响 Red Hat Linux 系统安全。建议用户及时更新 slocate 至最新版本或应用厂商提供的安全补丁。"
published = "2000-06-21T04:00:00Z"
remediation = "立即升级 slocate 至 2.1-1 或更高版本，该版本修复了 LOCATE_PATH 环境变量处理中的配置注入漏洞。如无法升级，可移除 slocate 的 setuid 权限（chmod u-s /usr/bin/slocate），或改用 mlocate/plocate 替代。作为临时缓解措施，可在系统层面过滤 LOCATE_PATH 环境变量，限制普通用户通过该变量指定恶意配置文件。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Red Hat Linux Secure Locate 本地权限提升漏洞"
updated = "2026-06-16T21:52:05Z"

