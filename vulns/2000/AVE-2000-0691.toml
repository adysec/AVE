[basic]
description = "Cisco Catalyst 3500 XL 系列交换机的 Web 配置接口存在未授权命令执行漏洞。当设备未设置 enable 密码时，远程攻击者无需任何身份认证，即可通过向目标设备的 Web 管理界面发送包含 /exec/ 目录的特制 URL，直接以管理员权限执行任意系统命令。攻击者可利用该漏洞完全控制目标交换机，查看或修改配置、重启设备、获取网络拓扑信息，进而以此为跳板攻击内网其他设备。该漏洞影响 Cisco Catalyst 3500 XL 系列交换机，CVSS 评分 10.0，危害等级严重。Cisco 已发布安全公告建议用户设置 enable 密码或禁用 Web 管理接口以修复此漏洞。"
published = "2000-12-19T05:00:00.000"
remediation = "立即为 Catalyst 3500 XL 交换机设置 enable 密码（全局配置模式下执行 `enable secret <密码>`），防止未授权访问 /exec/ 目录。如无需 Web 管理界面，通过 `no ip http server` 禁用 HTTP 服务。同时将管理接口限制在专用管理 VLAN 中，使用 ACL 仅允许信任源 IP 访问 80/443 端口。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Cisco Catalyst 3500 XL 任意命令执行漏洞"
updated = "2026-06-16T21:52:49.600"

