[basic]
description = "Apple WebKit 存在内存破坏漏洞，远程攻击者可通过诱导用户访问特制网站触发内存损坏，导致任意代码执行或应用崩溃。该漏洞影响 iOS 5.1 之前版本、iTunes 10.6 之前版本及 Safari 5.1.4 之前版本，CVSS 评分 9.3，危害严重。攻击无需身份认证，用户仅需访问恶意网页即可触发。"
published = "2012-03-08T22:55:02Z"
remediation = "立即将 Safari 升级至 5.1.4 或更高版本，将 iOS 升级至 5.1 或更高版本，将 iTunes 升级至 10.6 或更高版本。上述更新可通过 Apple 软件更新功能或访问 support.apple.com 获取。如无法立即升级，可在浏览器中禁用 JavaScript 作为临时缓解措施，并避免访问不可信网站。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:54Z"

