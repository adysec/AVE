[basic]
description = 'Luca Deri ntop 1.2 a7-9 Web 模式存在目录遍历漏洞，未经身份认证的远程攻击者可通过构造包含 ".."（点点）序列的 HTTP 请求，突破 Web 根目录限制读取服务器文件系统上的任意文件。该漏洞影响 ntop 1.2 a7 至 a9 版本的 Web 管理模式，攻击者无需认证即可通过网络远程利用，仅需发送包含目录遍历序列的 HTTP 请求即可读取敏感文件（如密码文件、配置文件等），CVSS 评分 5.0（中等危害），机密性影响为部分，无完整性和可用性影响。'
published = "2000-10-20T04:00:00Z"
remediation = '升级 ntop 至 1.2 a10 或更高版本（含 Red Hat RHSA-2000:049 修复补丁），或禁用 ntop Web 管理模式；若暂时无法升级，请在 Web 服务器层面配置路径规范化与访问控制，拦截包含 ".." 目录遍历序列的 HTTP 请求，并限制 Web 进程对敏感目录（/etc、/var 等）的读取权限。参考 Red Hat 安全公告：http://www.redhat.com/support/errata/RHSA-2000-049.html'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Luca Deri ntop 目录遍历漏洞"
updated = "2026-06-16T21:52:18Z"

