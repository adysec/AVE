[basic]
description = "GNU Binutils 2.43 的 ld 组件在处理 ELF 文件链接时，elflink.c 文件中的 _bfd_elf_gc_mark_rsec 函数存在堆缓冲区溢出漏洞。攻击者可通过向目标系统提供特制的 ELF 对象文件触发该漏洞，导致堆内存越界写入。该漏洞可被远程触发（如通过诱导用户链接恶意文件），但攻击复杂度较高。成功利用可能导致程序崩溃或潜在的内存破坏。GNU Binutils 项目已通过提交 f9978defb6fab0bd8583942d97c112b0932ac814 修复此问题，建议用户及时应用补丁或更新至修复版本。"
published = "2025-02-11T06:15:22Z"
remediation = "立即将 GNU Binutils 升级至 2.44 或更高版本，该版本已包含针对 `_bfd_elf_gc_mark_rsec` 堆溢出的修复补丁（commit f9978defb6fab0bd8583942d97c112b0932ac814）。SUSE 用户可安装 SUSE-SU-2025:4096-1 安全更新。临时缓解措施：在 aarch64 架构上避免使用 `-z gcs=implicit` 链接器选项。"
score = 2.3
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils ld 堆缓冲区溢出漏洞"
updated = "2026-06-17T08:38:31Z"

