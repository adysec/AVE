[basic]
description = "Balabit syslog-ng 1.4.6、1.4.7 和 1.4.8 版本在处理日志优先级指定符时存在漏洞。由于程序未能正确验证优先级字段是否包含闭合的 '>' 符号，远程攻击者可以通过发送特制的畸形日志消息，触发应用程序崩溃，从而导致拒绝服务（DoS）攻击。该漏洞无需身份认证即可远程触发，影响所有运行上述受影响版本的 syslog-ng 服务。"
published = "2001-01-09T05:00:00Z"
remediation = "建议将 Balabit syslog-ng 升级至 1.4.9 或更高版本以修复解析缺陷。在无法立即升级的环境中，建议在防火墙上配置访问控制列表（ACL），限制 syslog 接收端口（默认 UDP/TCP 514）仅允许受信任的内部主机访问，以缓解远程攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Balabit syslog-ng 拒绝服务漏洞"
updated = "2026-06-16T21:53:17Z"

