[basic]
description = "BEA Systems WebLogic Server 6.1及7.0版本存在空字符拒绝服务漏洞。远程攻击者无需身份认证，通过向服务器发送包含MS-DOS设备名（如CON、NUL、AUX等）的.JSP文件请求，可导致服务器资源耗尽或进程崩溃，造成拒绝服务。该漏洞利用条件简单，仅需网络可达即可触发，CVSS评分5.0，危害等级中等。厂商已发布安全更新修复此漏洞。"
published = "2002-03-25T05:00:00Z"
remediation = "升级至 BEA WebLogic Server 6.1 Service Pack 2 及以上版本，该版本已修复 MS-DOS 设备名请求导致的拒绝服务问题。如无法升级，在 Web 服务器或防火墙层过滤包含 CON、NUL、AUX、LPT1 等 MS-DOS 保留设备名的 .JSP 请求路径。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "BEA Systems WebLogic Server MS-DOS设备名空字符拒绝服务漏洞"
updated = "2026-06-16T21:56:48Z"

