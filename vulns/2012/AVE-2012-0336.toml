[basic]
description = "Apple iTunes 使用的 WebKit 引擎存在内存破坏漏洞，远程攻击者可通过构造恶意网页触发该漏洞，导致任意代码执行或拒绝服务（内存损坏与应用崩溃）。该漏洞影响 iTunes 10.7 之前的版本，CVSS 评分为 6.8，危害等级中等。攻击者无需身份认证即可利用，用户访问恶意网站时即可触发。Apple 已在后续版本中修复此问题。"
published = "2012-09-13T10:30:20.213"
remediation = "立即将 Apple iTunes 升级至 10.7 或更高版本以修复 WebKit 内存破坏漏洞。在 macOS 上通过 App Store 或 Software Update 安装最新 iTunes；在 iOS 设备上升级至 iOS 6.0 或更高版本（设置 > 通用 > 软件更新）。作为临时缓解措施，可在 Safari 中禁用 JavaScript 或避免访问不可信网站，以降低通过恶意网页触发漏洞的风险。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes 内存破坏漏洞"
updated = "2026-06-16T23:43:40.663"

