[basic]
description = "Azure 虚拟桌面（Azure Virtual Desktop）存在授权缺失漏洞（CWE-862），已获得低权限身份认证的攻击者可通过网络向目标服务发送特制请求，利用授权检查缺失的缺陷绕过权限控制，实现权限提升。该漏洞影响 Azure Virtual Desktop 服务，CVSS 评分 8.5，危害等级高。攻击复杂度较高（需低权限账号且依赖特定网络条件），但成功利用后可导致机密性、完整性和可用性均受到严重影响。Microsoft 已在 2025 年 4 月安全更新中修复此漏洞。"
published = "2025-04-30T18:15:38Z"
remediation = "此漏洞已在 Azure 虚拟桌面服务端由 Microsoft 完成修复，用户无需执行任何操作。Azure 虚拟桌面为独占托管服务（Exclusively Hosted Service），微软已在服务端侧部署授权校验修复，所有用户自动受益。无需升级客户端版本或修改配置。如需进一步了解云服务 CVE 透明度策略，请参阅 https://aka.ms/MSRC-Cloud-CVEs。"
score = 8.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Azure Virtual Desktop 权限提升漏洞"
updated = "2026-06-17T08:43:18Z"

