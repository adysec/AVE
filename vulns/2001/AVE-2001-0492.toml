[basic]
description = "Microsoft IIS 4.0 和 5.0 的 asp.dll 组件中 Scripting.FileSystemObject 存在拒绝服务漏洞。本地或远程攻击者可通过两种方式利用：一是创建使用 Scripting.FileSystemObject 打开包含 MS-DOS 设备名（如 AUX、CON、NUL 等）文件的 ASP 程序；二是远程向内部使用 Scripting.FileSystemObject 的 ASP 程序注入设备名，导致 IIS 服务崩溃。该漏洞无需身份认证即可远程触发，攻击复杂度低，影响 IIS 服务器的可用性。"
published = "2001-07-04T04:00:00Z"
remediation = '升级到 Windows Server 2003 及以上版本（IIS 6.0+），该漏洞已在后续版本修复。如无法升级，在 ASP 应用中过滤 MS-DOS 设备名（CON、NUL、AUX、LPT1 等）作为输入参数，或移除 Scripting.FileSystemObject 组件注册：`regsvr32 -u %windir%\system32\scrrun.dll`。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft IIS 4.0/5.0 asp.dll Scripting.FileSystemObject 设备文件拒绝服务漏洞"
updated = "2026-06-16T21:55:52Z"

