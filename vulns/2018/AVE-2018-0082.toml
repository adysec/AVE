[basic]
description = "Synacor Zimbra Collaboration Suite 8.8.11 之前版本的 AJAX 和 HTML Web 客户端存在跨站脚本（XSS）漏洞。攻击者无需身份认证即可利用该漏洞，通过向目标用户发送特制的恶意链接，诱使用户点击后触发 XSS 攻击，导致在用户浏览器上下文中执行任意 JavaScript 代码，可能窃取会话 Cookie、重定向至钓鱼页面或篡改页面内容。该漏洞影响广泛部署的企业邮件协作系统，攻击条件仅需用户交互，危害等级中危。"
published = "2019-05-29T22:29:00Z"
remediation = """升级 Zimbra Collaboration Suite 至 8.8.11 或更高版本，该版本已修复 AJAX 和 HTML Web 客户端中的 XSS 漏洞。如无法立即升级，可在反向代理层（如 Nginx/Apache）添加 WAF 规则过滤 XSS 载荷，并限制用户输入中的特殊字符（如 `<` `>` `"` `'`）。"""
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Synacor Zimbra Collaboration Suite 跨站脚本漏洞"
updated = "2026-06-17T01:40:29Z"

