[basic]
description = "Microsoft 消息队列（MSMQ）组件存在信息泄露漏洞，由于对未初始化资源（CWE-908）的不当处理，未经身份认证的远程攻击者可通过网络向目标系统的 MSMQ 服务发送特制请求，触发未初始化内存读取，导致敏感信息泄露。该漏洞攻击复杂度低，无需用户交互，CVSS 评分 7.5，危害等级高。影响 Windows 10/11 及 Windows Server 等多个版本。Microsoft 已在 2025 年 1 月安全更新（KB5050061）中修复此漏洞。"
published = "2025-01-14T18:15:33Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 (KB5050061)，可通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。受影响版本包括 Windows 10/11 及 Windows Server 多版本，更新后对应版本号分别为：Win10 1507≥10.0.10240.20890、Win10 1809≥10.0.17763.6775、Win11 24H2≥10.0.26100.2894、Server 2022≥10.0.20348.3091 等。如无法立即打补丁，可在防火墙或网络层面限制对 MSMQ 服务（TCP 端口 1801）的匿名网络访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft 消息队列信息泄露漏洞"
updated = "2026-06-17T08:42:48Z"

