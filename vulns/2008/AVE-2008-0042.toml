[basic]
description = "Adobe Flash Player 中 ActionScript 语言提供的 System.setClipboard 方法存在剪贴板劫持漏洞。远程攻击者可通过嵌入恶意 Flash 内容的网页，在未经用户交互的情况下向系统剪贴板填充恶意 URL 链接。由于剪贴板内容难以被用户直接删除，攻击者可借此实施钓鱼攻击或恶意软件分发。该漏洞影响 Adobe Flash Player 9.0.124.0 及更早版本，在 2008 年 8 月已被野外利用。"
published = "2008-08-29T17:41:00Z"
remediation = "立即升级 Adobe Flash Player 至 10.0.22.87 或更高版本，修复 System.setClipboard 剪贴板劫持漏洞。如无法立即升级，可临时在浏览器中禁用 Flash Player 插件，或通过组策略限制 Flash 内容的自动执行。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Adobe Flash Player 剪贴板劫持漏洞"
updated = "2026-06-16T22:56:42Z"

