[basic]
description = "PlaySMS 1.4.3 之前版本存在输入验证漏洞，未对用户输入的恶意字符串进行过滤和转义处理。未经身份认证的远程攻击者可通过向 index.php 发送特制的 HTTP 请求，利用模板注入漏洞在服务器上执行任意代码。该漏洞影响所有使用 PlaySMS 1.4.3 之前的版本，CVSS 评分为 9.8，危害等级严重。攻击者无需任何认证即可触发漏洞，利用门槛极低，可导致服务器被完全控制。"
published = "2020-02-05T22:15:11.003"
remediation = "立即将 PlaySMS 升级至 1.4.3 或更高版本，该版本已修复输入未过滤导致的模板注入漏洞。如无法立即升级，可在 Web 服务器层面禁用模板引擎的动态代码执行功能，并对所有用户输入进行严格的字符过滤与转义处理，阻止恶意字符串被模板引擎解析执行。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "PlaySMS 短信平台 模板注入远程代码执行漏洞"
updated = "2026-06-17T03:26:41.917"

