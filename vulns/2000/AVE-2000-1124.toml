[basic]
description = "AdCycle 横幅管理系统在安装后未将 build.cgi 程序从 Web 可访问目录中移除，导致远程攻击者可直接通过 HTTP 请求访问并执行该 CGI 脚本，从而获取系统存储的明文密码或删除数据库。该漏洞影响 AdCycle 所有默认安装版本，攻击者无需任何身份认证即可利用，危害较大。厂商建议在安装完成后手动删除或限制对 build.cgi 的访问权限。"
published = "2001-01-09T05:00:00.000"
remediation = "立即删除 web 可访问目录下的 build.cgi 程序，或将其移出 web 根目录（如移至 cgi-bin 外的私有目录）。在 Web 服务器（Apache/Nginx）配置中对该文件路径添加访问控制，仅允许管理员 IP 访问。AdCycle 官方已停止维护，建议迁移至其他受支持的广告管理系统，或彻底停用该遗留系统。如必须继续使用，在 Web 服务器层面用 .htaccess 或 location 指令拒绝所有外部对 build.cgi 的访问。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "AdCycle 广告轮播管理系统密码泄露漏洞"
updated = "2026-06-16T21:53:17.280"

