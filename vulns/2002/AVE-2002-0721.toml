[basic]
description = "GazTek ghttpd 1.4 至 1.4.3 版本的 Log 函数存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过向目标服务器发送超长的 HTTP GET 请求触发该漏洞，导致远程代码执行。该漏洞影响所有运行受影响版本 ghttpd 的 Web 服务器，CVSS 评分 7.5，危害等级高。"
published = "2002-12-31T05:00:00Z"
remediation = "1. 升级替代方案：立即将 ghttpd 迁移至仍在维护的 Web 服务器，如 Nginx 1.26+ 或 Lighttpd 1.4.76，彻底消除该漏洞风险。2. 源码补丁（如无法立即迁移）：在 `util.c` 的 `Log` 函数入口处添加长度校验，将请求 URI 截断至 1024 字节以内，防止溢出。3. 临时缓解措施：在 ghttpd 前部署 Nginx 或 HAProxy 作为反向代理，限制客户端发送的 HTTP GET 请求 URI 长度不超过 1024 字节，并启用防火墙规则屏蔽异常长度的入站请求。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "GazTek ghttpd 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T22:00:16Z"

