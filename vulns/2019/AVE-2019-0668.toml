[basic]
description = "Cisco Small Business RV 系列路由器基于 Web 的管理接口存在命令注入漏洞，由于对 HTTP 请求负载缺乏充分的输入验证，已通过身份认证的远程攻击者可利用有效的凭据或活动会话令牌，向目标设备的管理接口发送特制的 HTTP 请求，从而以 root 权限执行任意命令。该漏洞影响多款 RV 系列路由器，CVSS 评分 8.8，危害等级高。Cisco 已发布固件更新修复此漏洞。"
published = "2019-11-26T03:15:11Z"
remediation = "立即将 Cisco Small Business RV 系列路由器（RV016/RV042/RV042G/RV082）固件升级至 4.2.3.10 或更高版本。登录设备 Web 管理界面，进入 Administration > Firmware Upgrade，上传官方固件文件并重启。如无法立即升级，可在管理界面中限制仅允许受信任的内网 IP 访问 Web 管理端口（默认 443/80），并禁用 WAN 侧远程管理功能作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Cisco Small Business RV系列路由器远程代码执行漏洞"
updated = "2026-06-17T02:19:59Z"

