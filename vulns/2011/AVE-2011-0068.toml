[basic]
description = "HP Intelligent Management Center（IMC）5.0 E0101L02之前版本的tftpserver.exe组件存在输入验证漏洞。远程攻击者无需认证即可通过网络向目标服务器发送特制的WRQ请求，利用该漏洞在服务器上创建或覆盖任意文件，进而执行任意代码。CVSS评分10.0，危害等级严重，攻击复杂度低，影响系统机密性、完整性和可用性。HP已发布5.0 E0101L02版本修复此漏洞。"
published = "2011-05-13T17:05:44Z"
remediation = "立即将 HP Intelligent Management Center (IMC) 升级至 5.0 E0101L02 或更高版本。该版本修复了 tftpserver.exe 组件中因 WRQ 请求输入验证缺失导致的任意文件创建/覆盖漏洞。如无法立即升级，可在网络边界防火墙中限制对 TFTP 端口（默认 UDP 69）的访问，仅允许可信管理网段连接 IMC 服务器。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "HP Intelligent Management Center tftpserver.exe 输入验证漏洞"
updated = "2026-06-16T23:30:14Z"

