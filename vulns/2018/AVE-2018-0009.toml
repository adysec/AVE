[basic]
description = "Cisco Catalyst 交换机上运行的 Cisco IOS 软件简单网络管理协议（SNMP）子系统中存在拒绝服务漏洞。当受影响软件处理包含 ciscoFlashMIB 对象标识符（OID）请求的 SNMP 读取请求时，会触发 CPU 资源耗尽条件（SYS-3-CPUHOG），导致设备重启。已通过 SNMPv2 或 SNMPv3 认证的远程攻击者可向目标设备发送特制的 SNMP GET 请求触发该漏洞。该漏洞影响运行特定版本 Cisco IOS 并配置 SNMPv2/v3 的 Catalyst 2960-L 系列、Digital Building 系列 8P/8U 交换机，CVSS 评分 6.3，危害等级中危。Cisco 已发布安全公告 CSCvd89541 修复此问题。"
published = "2018-03-28T22:29:00Z"
remediation = "升级 Cisco IOS 至 15.2(5)E2 或更新版本（通过 Cisco IOS Software Checker 确认具体修复版本）。如无法立即升级，可配置 SNMP ACL 限制仅允许可信源 IP 访问：`access-list 1 permit 192.168.0.1` 和 `snmp-server community example RO 1`；或将 ciscoFlashMIB 从 SNMP 查询列表中排除：`snmp-server view example ciscoFlashMIB excluded` 配合 `snmp-server community example view example ro`。同时建议启用 Unicast RPF 防止 UDP 源地址欺骗。"
score = 6.3
severity = "MEDIUM"
sources = ["kev"]
title = "Cisco Catalyst交换机 IOS SNMP 拒绝服务漏洞"
updated = "2026-06-17T01:29:58Z"

