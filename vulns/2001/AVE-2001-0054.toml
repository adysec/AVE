[basic]
description = "Microsoft Windows Media Player 7 的皮肤文件（.wmz）实际为 ZIP 压缩包格式，该版本允许将自定义皮肤下载到用户机器上的已知目录中。漏洞原理在于 ZIP 格式支持直接运行其中的 Java 类文件（.class），攻击者可制作包含恶意 Java 代码的皮肤文件并诱骗用户下载。一旦用户从恶意网站下载该皮肤文件，攻击者控制的网页或 HTML 邮件即可通过引用本地已下载的皮肤路径，在 Internet Explorer 的本地计算机安全区域中直接执行任意 Java 代码。影响范围为安装 Windows Media Player 7 的系统，早期版本不受此问题影响。成功利用后，恶意代码可在用户机器上执行任意操作，包括读取本地文件、下载并运行其他软件等。Microsoft 已在 MS01-010 安全公告中发布补丁修复此问题。"
published = "2001-03-12T00:00:00Z"
remediation = "安装 Microsoft 2001 年 2 月安全更新 MS01-010（KB287045），将 Windows Media Player 7 升级至修复版本。如无法立即安装补丁，请勿从不可信来源下载或打开 .wmz 皮肤文件，并考虑在 Internet Explorer 中禁用 Java 小程序执行作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows Media Player .wmz 任意 Java 小程序执行漏洞"
updated = "2001-03-12T00:00:00Z"

