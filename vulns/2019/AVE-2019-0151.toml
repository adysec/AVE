[basic]
description = "WordPress Email Subscribers &amp; Newsletters 插件在 4.2.3 版本之前存在授权缺失漏洞（CWE-862），未经验证的攻击者可通过构造特定 HTTP 请求直接下载插件存储的包含用户敏感信息的文件，导致用户数据泄露。该漏洞影响所有使用此插件的 WordPress 网站，攻击者无需登录或任何身份认证即可远程利用，CVSS 评分为 5.3，危害等级中等。"
published = "2019-12-26T03:15:11.783"
remediation = "立即将 WordPress 插件 Email Subscribers & Newsletters 升级至 4.2.3 或更高版本，该版本已修复未授权文件下载漏洞。若插件暂未使用，可直接停用并删除，以彻底消除攻击面。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Email Subscribers &amp; Newsletters 信息泄露漏洞"
updated = "2026-06-17T02:27:33.037"

