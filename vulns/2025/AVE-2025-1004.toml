[basic]
description = "标签之间。<value>Linux内核USB gadget子系统存在工作队列清理不当漏洞。device_del()函数执行后仍可调度新的工作项到gadget工作队列中，导致设备移除后工作队列未能正确清理，可能引发悬空指针引用或内存安全问题。该漏洞影响采用dwc3等USB gadget驱动的Linux系统设备。具备本地低权限访问权限的攻击者可在USB gadget设备断开连接过程中触发竞争条件，通过调度延迟执行的工作项导致系统崩溃或拒绝服务。CVSS评分5.5，危害等级中等。"
published = "2025-03-07T09:15:16Z"
remediation = "建议将 Linux 内核升级至已修复的稳定版本：6.1.130、6.6.80、6.12.16 或 6.13.4 及以上版本。可通过 `uname -r` 确认当前内核版本，然后使用各发行版包管理器进行升级，例如 Debian/Ubuntu 执行 `apt update && apt upgrade linux-image-*`，RHEL/CentOS 执行 `yum update kernel`。如暂时无法升级，可临时限制本地用户对 USB gadget 设备的访问权限，或在内核启动参数中禁用相关 gadget 驱动以降低风险。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 USB gadget 工作队列竞争条件漏洞"
updated = "2026-06-17T08:44:24Z"

