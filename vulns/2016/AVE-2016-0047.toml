[basic]
description = "WordPress的zm-gallery插件1.0版本中存在SQL注入漏洞，该漏洞位于order参数处。具有管理员权限的认证攻击者可通过向受影响插件发送特制的HTTP请求，利用order参数注入恶意SQL语句，从而获取数据库中的敏感信息（如用户凭证、配置数据等）。由于该插件未对用户输入进行充分的过滤和转义处理，导致攻击者能够操纵数据库查询。该漏洞影响WordPress zm-gallery插件1.0版本，CVSS评分7.2，危害等级高。"
published = "2019-09-13T12:15:10Z"
remediation = "立即在 WordPress 后台停用并删除 zm-gallery 插件 1.0 版本，该插件已长期无人维护且从官方仓库下架。改用其他仍在维护的 WordPress 相册插件（如 NextGEN Gallery 或 Modula）作为替代。同时检查网站近期是否有因该漏洞导致的数据泄露或数据库篡改痕迹。"
score = 7.2
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress zm-gallery插件 order参数SQL注入漏洞"
updated = "2026-06-17T00:40:39Z"

