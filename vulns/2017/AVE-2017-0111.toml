[basic]
description = 'Linux 内核 ELF 二进制加载器（`load_elf_binary()`）在处理 PIE（位置无关可执行文件）时存在内存布局缺陷。当 `CONFIG_ARCH_BINFMT_ELF_RANDOMIZE_PIE` 启用且采用自上而下的地址分配策略时，加载器仅将第一个 PT_LOAD 段映射到 `mm->mmap_base` 下方，但未为整个二进制文件分配足够空间，导致后续 PT_LOAD 段被映射到本应属于栈与二进制之间"间隙"区域的上方，破坏了内核内存布局。本地低权限攻击者可通过构造特制的 SUID PIE 程序触发此漏洞，实现权限提升至 root。该漏洞影响未合入 2015 年 4 月补丁（commit a87938b2e246）的 Linux 长期支持内核版本，包括 CentOS 7 等发行版，CVSS 评分 7.8，危害等级高。'
published = "2017-10-05T01:29:04Z"
remediation = "立即将 Linux 内核升级至 3.10.77 及以上版本（或对应发行版已修复的内核包）。RHEL/CentOS 7 用户安装 kernel-3.10.0-514.32.3.el7 及以上版本，Debian 用户升级至 3.2.71-1（Wheezy）/ 3.16.7-ckt11-1（Jessie）/ 4.0.2-1（Sid）及以上版本。升级后须重启系统使新内核生效。如无法立即升级，可移除 SUID PIE 二进制文件的 SUID 位作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Linux Kernel 本地权限提升漏洞"
updated = "2026-06-17T00:58:59Z"

