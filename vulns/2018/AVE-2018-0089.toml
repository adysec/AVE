[basic]
description = "LOYTEC LGATE-902 楼宇自动化网关设备存在不安全的权限分配漏洞（CWE-732），远程未经身份认证的攻击者可通过网络直接访问设备文件系统，利用该漏洞删除任意文件，导致设备关键功能失效或系统崩溃。该漏洞影响 LGATE-902 6.3.2 及之前版本，攻击无需任何认证或用户交互，攻击复杂度低，CVSS 评分 9.1，危害等级严重。攻击者可通过发送特制 HTTP 请求利用该漏洞实现任意文件删除操作。"
published = "2019-06-28T18:15:10Z"
remediation = "立即将 LGATE-902 固件升级至 6.4.2 或更高版本（该版本已修复任意文件删除漏洞）。如无法立即升级，在防火墙上限制对设备 80/443 端口的访问来源，仅允许受信任管理 IP 连接，并禁用设备 Web 界面的匿名访问功能。"
score = 9.1
severity = "CRITICAL"
sources = ["nuclei"]
title = "Loytec LGATE-902 任意文件删除漏洞"
updated = "2026-06-17T01:41:52Z"

