[basic]
description = "Fluent Bit 的 in_forward 输入插件在特定配置条件下未正确执行 security.users 认证机制。具有网络访问权限的远程攻击者可在暴露 forward 输入的 Fluent Bit 实例上发送未认证数据，绕过认证控制后注入伪造日志记录、向告警系统发起大量数据洪泛攻击，或操纵日志路由决策，从而严重影响所接收日志的真实性和完整性。该漏洞影响 Fluent Bit 4.0.0 至 4.1.0 版本，CVSS v3.1 评分为 6.5（中危），攻击向量为网络、攻击复杂度低、无需权限和用户交互，仅对数据完整性造成部分影响。Fluent Bit 官方已在 v4.1.1 及向 v4.0 后移植的 v4.0.13 版本中修复此问题。"
published = "2025-11-24T15:15:46Z"
remediation = "立即将 Fluent Bit 升级至 v4.1.1 或 v4.0.13 及以上版本，该版本已修复 in_forward 插件的用户认证绕过漏洞（PR #10973）。升级后需检查配置文件，确保在启用 security.users 时同时配置 shared_key 或 empty_shared_key，否则服务启动将报错并拒绝加载。若暂无法升级，可通过防火墙规则限制仅允许可信 IP 访问 in_forward 监听端口（如 24224/9880），并禁用未使用 in_forward 的实例以缩小攻击面。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Fluent Bit in_forward 输入插件身份认证绕过漏洞"
updated = "2026-06-17T08:33:18Z"

