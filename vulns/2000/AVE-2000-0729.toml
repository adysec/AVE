[basic]
description = "OpenBSD 2.x 系统中的 fstat 程序存在格式字符串漏洞，由于程序在处理 PWD 环境变量时未正确进行格式化输出，导致格式字符串被用户控制。本地攻击者可通过设置特制的 PWD 环境变量触发该漏洞，利用格式字符串写入任意内存地址，从而提升至 root 权限。该漏洞影响 OpenBSD 2.x 及可能其他基于 BSD 的操作系统，CVSS 评分 7.2，危害等级高。攻击者需拥有本地系统访问权限，无需身份认证即可利用。"
published = "2000-12-19T05:00:00.000"
remediation = "立即应用 OpenBSD 官方补丁：下载 ftp://ftp.openbsd.org/pub/OpenBSD/patches/2.7/common/028_format_strings.patch 并执行 `patch -p0 < 028_format_strings.patch` 后重新编译内核；或升级至 OpenBSD 2.8 及以上版本。如无法升级，限制本地用户设置 PWD 环境变量的能力作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "OpenBSD fstat 格式字符串漏洞"
updated = "2026-06-16T21:52:55.937"

