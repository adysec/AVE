[basic]
description = "tags.<value>Linux内核blk-cgroup（块设备控制组）子系统存在引用计数泄漏漏洞。blkcg_fill_root_iostats()函数在遍历@block_class类下的块设备时，使用class_dev_iter_init()和class_dev_iter_next()进行迭代，但未在遍历结束后调用class_dev_iter_exit()来释放资源，导致该类的子系统引用计数持续增加而无法回收。攻击者可在本地利用此缺陷，通过反复触发该迭代路径造成内核内存泄漏，最终导致系统资源耗尽、拒绝服务或权限提升。该漏洞影响使用受影响Linux内核版本的系统，CVSS评分为5.5（中等严重），CVSS向量为AV:L/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H。"
published = "2025-02-27T03:15:15.137"
remediation = "升级 Linux 内核至已修复版本：RHEL 9 用户升级至 kernel-5.14.0-611.5.1.el9_7 或更高；Debian 用户升级至 bullseye 5.10.262-1、bookworm 6.1.180-1 或更高；Ubuntu 22.04 LTS 用户升级至 5.15.0-1084.91 或更高。通过 `sudo apt update && sudo apt upgrade linux-image-generic`（Debian/Ubuntu）或 `sudo dnf update kernel`（RHEL）执行升级，完成后重启系统生效。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel blk-cgroup 子系统引用计数泄漏漏洞"
updated = "2026-07-14T13:17:22.233"

