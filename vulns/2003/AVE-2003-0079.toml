[basic]
description = "EPIC4 IRC 客户端在处理来自恶意 IRC 服务器的 CTCP 请求时存在缓冲区溢出漏洞。由于对超长昵称的长度计算错误，远程攻击者可通过向客户端发送特制的 CTCP 消息触发该漏洞，导致客户端崩溃（拒绝服务），在特定条件下可实现远程代码执行。该漏洞影响 EPIC4 pre2.002、pre2.003 及可能更早版本，CVSS 评分 7.5，危害等级高。目前已公开缓冲区溢出利用代码。"
published = "2003-06-09T04:00:00.000"
remediation = "建议升级 EPIC IRC Client (EPIC4) 至 pre2.004 或更高版本，或应用官方补丁 alloca_underrun-patch-1（下载地址 ftp://ftp.prbh.org/pub/epic/patches/alloca_underrun-patch-1）。Debian 用户应更新至 DSA-306/DSA-399 对应修复版本，Red Hat 用户安装 RHSA-2003-342 更新。临时缓解措施可在 IRC 服务器端限制客户端昵称长度。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "EPIC IRC Client EPIC4 CTCP Nickname 缓冲区溢出漏洞"
updated = "2026-06-16T22:02:00.357"

