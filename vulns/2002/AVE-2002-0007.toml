[basic]
description = "OpenSSH 2.3.1至3.3版本sshd组件中存在缓冲区溢出漏洞。当OpenBSD系统使用PAM模块启用交互式键盘认证（PAMAuthenticationViaKbdInt）时，远程未认证攻击者可通过在挑战-响应认证过程中发送大量响应数据触发缓冲区溢出，导致任意代码执行。该漏洞CVSS评分10.0，危害等级严重，攻击者无需身份认证即可远程利用，完全控制目标系统。"
published = "2002-07-03T04:00:00.000"
remediation = "立即升级 OpenSSH 至 3.4 或更高版本。各发行版对应补丁：Red Hat 安装 RHSA-2002:127/RHSA-2002:131，Debian 安装 DSA-134，Mandrake 安装 MDKSA-2002:040。如无法升级，可在 sshd_config 中禁用 ChallengeResponseAuthentication 和 PAMAuthenticationViaKbdInt 作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "OpenSSH OpenSSH 挑战响应认证缓冲区溢出漏洞"
updated = "2026-06-16T21:57:50.567"

