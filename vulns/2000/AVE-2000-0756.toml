[basic]
description = "标签包裹。<value>TYPSoft FTP Server 0.78及更早版本存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标FTP服务发送超长构造的USER、PASS或CWD命令触发溢出，导致拒绝服务，并可能执行任意系统命令。该漏洞影响所有运行受影响版本的系统，攻击者无需任何凭据即可在远程发起攻击。CVSS评分为10分，危害等级严重。"
published = "2000-12-11T05:00:00.000"
remediation = "TYPSoft FTP Server 0.78 及更早版本由于长时间命令导致缓冲区溢出，攻击者可以触发远程拒绝服务并可能执行任意命令。立即升级到 TYPSoft FTP Server 0.79 或更高版本，获取修复缓冲区溢漏洞的官方安全补丁。此外，建议限制FTP服务端口访问，配置防火墙策略以阻止异常长的数据包，部署缓冲区溢出保护机制，并定期监控FTP服务器日志以检测可疑攻击行为。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "TYPSoft FTP Server 远程拒绝服务漏洞"
updated = "2026-06-16T21:53:01.053"

