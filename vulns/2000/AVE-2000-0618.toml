[basic]
description = "Windows 2000 telnet 客户端默认自动尝试 NTLM 身份认证，远程攻击者可通过构造恶意的 telnet:// URL 链接诱导用户访问，从而捕获并重放 NTLM 挑战/响应凭据，实现身份冒充或进一步渗透。该漏洞影响 Microsoft Windows 2000 系统，攻击者无需身份认证即可远程触发，CVSS 评分 7.5，危害等级高。微软尚未发布官方补丁，建议禁用 telnet 客户端默认 NTLM 认证或使用更安全的 SSH 替代。"
published = "2000-11-14T05:00:00.000"
remediation = '安装 Microsoft 安全公告 MS00-067 对应的更新补丁，禁用 telnet 客户端的默认 NTLM 认证行为。如无法安装补丁，可通过注册表将 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Telnet\Authentication 值设为 0 以禁用 NTLM 认证，或使用 SSH 替代 telnet 协议进行远程管理。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Windows 2000 Telnet 客户端 NTLM 身份认证信息泄露漏洞"
updated = "2026-06-16T21:52:33.847"

