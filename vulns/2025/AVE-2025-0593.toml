[basic]
description = "Google Chrome 143.0.7499.110 及 144.0.7539.0 之前版本的密码管理器组件存在使用后释放（Use After Free）漏洞，攻击者可诱导用户访问精心构造的恶意 HTML 页面，触发内存释放后引用错误，进而突破沙箱隔离实现沙箱逃逸。该漏洞影响 Google Chrome 143.0.7499.110 及 144.0.7539.0 之前的所有版本，CVSS 3.1 评分 6.1（中危），攻击向量为网络、攻击复杂度低、需用户交互、权限范围改变，成功利用可导致低机密性和完整性影响。攻击者需诱导受害者访问恶意页面并进行交互才能触发漏洞，Google 已在 Chrome 143.0.7499.110 及 144.0.7539.0 版本中修复此漏洞。"
published = "2025-12-12T20:15:39Z"
remediation = '建议立即升级 Google Chrome 至 143.0.7499.110 或更高版本，或升级 Chromium 至 144.0.7539.0 及以上版本。可通过 Chrome 菜单→帮助→关于 Google Chrome 自动检查更新并重启浏览器完成升级。若无法立即升级，可临时禁用密码管理器自动填充功能（设置→自动填充和密码→密码管理器→关闭"自动登录"）以降低风险。企业环境可通过组策略强制推送更新策略。openSUSE 用户请执行 `zypper patch` 安装 openSUSE-SU-2025:20161-1 补丁。'
score = 6.1
severity = "MEDIUM"
sources = ["msrc"]
title = "谷歌 Chrome 浏览器 密码管理器 Use 后空漏洞"
updated = "2026-06-17T08:35:49Z"

