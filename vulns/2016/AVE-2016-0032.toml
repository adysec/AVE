[basic]
description = "WordPress 的 photoxhibit 插件 2.1.8 版本存在反射型跨站脚本（XSS）漏洞，该漏洞源于程序未对用户输入进行充分过滤与转义。未经身份认证的远程攻击者可通过构造特制 URL 并诱使目标用户点击，在用户浏览器中执行任意 JavaScript 代码，导致敏感信息泄露或会话劫持。攻击需用户交互，影响运行该插件的 WordPress 站点。"
published = "2016-10-10T20:59:20Z"
remediation = "立即从 WordPress 后台插件管理页面删除 PhotoXhibit 插件（该插件已于 2013 年关闭下架，开发者已停止维护，无补丁可用），并替换为仍在维护的相册插件（如 NextGEN Gallery 或 FooGallery），以彻底消除反射型 XSS 攻击风险。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress photoxhibit 插件反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:45Z"

