[basic]
description = "TransSoft Broker FTP Server 在用户名输入处理中存在缓冲区溢出漏洞。当攻击者向目标FTP服务器发送过长的用户名数据包时，服务器的用户名缓冲区会溢出，导致内存损坏并引发服务异常。该漏洞无需身份验证即可远程触发，攻击者可精心构造恶意用户名数据包，不仅可导致服务崩溃（拒绝服务），还可能在目标系统上执行任意代码。该漏洞影响TransSoft Broker FTP Server 3.0及4.0版本（低于4.3.0.1），攻击条件极其简单，一旦触发可能导致目标服务器被完全控制，安全风险严重。"
published = "2001-01-09T05:00:00.000"
remediation = "建议立即升级TransSoft Broker FTP Server到4.3.0.1或更高版本，至少打通告的最终补丁版本。如无法立即打补丁，可限制匿名FTP访问并限制用户登录速率以降低风险。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "TransSoft Broker FTP Server 用户名缓冲区溢出漏洞"
updated = "2026-06-16T21:53:10.893"

