[basic]
description = "HP JetDirect 打印卡固件 IP 协议实现存在漏洞，远程攻击者可通过向目标设备发送特制的畸形网络数据包触发该漏洞，导致打印机拒绝服务崩溃。该漏洞影响固件版本为 X.08.04、X.08.05 及 X.08.20 及更早版本的 HP JetDirect 打印卡，攻击者无需身份认证即可在网络上任意发起利用，且攻击复杂度低，CVSS 评分为 5.0，危害等级中等。攻击者只需构造符合漏洞触发条件的畸形 IP 数据包并发送至目标打印卡的 IP 地址即可造成服务中断。"
published = "2000-12-11T05:00:00.000"
remediation = "升级 HP JetDirect 打印卡固件至厂商发布的最新版本。受影响版本包括 X.08.04、X.08.05 及 X.08.20 及更早版本，应访问 HP 官方支持网站下载并安装更新后的固件以修复 IP 实现中的畸形数据包处理漏洞。如无法立即升级，可在网络边界部署访问控制规则，限制对打印卡 IP 地址的未授权访问，以临时缓解拒绝服务攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "惠普 Jetdirect 打印服务器 IP 实现拒绝服务漏洞"
updated = "2026-06-16T21:53:04.930"

