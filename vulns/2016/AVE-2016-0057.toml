[basic]
description = "WP Mobile Detector WordPress 插件 3.5 及更早版本的 resize.php 文件缺少文件类型验证，存在任意文件上传漏洞。未经身份认证的远程攻击者可直接向目标站点上传恶意 PHP 文件，从而在服务器上执行任意代码，实现完全控制。该漏洞 CVSS 评分 9.8，危害等级严重，影响所有使用该插件的 WordPress 站点。攻击者无需任何权限，仅需发送特制的 HTTP 请求即可完成利用。"
published = "2025-07-19T10:15:23Z"
remediation = "立即删除或禁用 WP Mobile Detector 插件（版本 ≤ 3.5），该插件已不再维护。如仍需使用移动设备检测功能，可替换为其他受支持的同类插件（如 WP Mobile Detect）。同时检查服务器上 wp-content/uploads/ 目录是否存在异常文件，清理已上传的恶意 webshell。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress WP Mobile Detector 插件任意文件上传漏洞"
updated = "2026-06-17T00:41:03Z"

