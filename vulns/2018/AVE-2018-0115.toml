[basic]
description = "CIRCONTROL CirCarLife 4.3 之前版本存在信息泄露漏洞。由于 /html/device-id 接口未实施身份认证，未经授权的远程攻击者可直接访问该接口获取系统软件版本、设备标识等敏感信息。攻击者无需任何凭证即可利用，攻击复杂度低，可能导致工控系统拓扑信息暴露，为后续攻击提供情报支撑。该漏洞影响 CirCarLife 全系列 4.3 之前版本，CVSS 评分 5.3，危害等级中危。"
published = "2018-09-18T20:29:01Z"
remediation = "立即将 CIRCONTROL CirCarLife 升级至 4.3 或更高版本，该版本已修复 `/html/device-id` 接口未授权访问问题。如无法立即升级，可在反向代理或 Web 服务器层面对 `/html/device-id` 路径添加身份认证或 IP 白名单访问控制，阻止未授权外部请求获取系统设备信息。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "CIRCONTROL CirCarLife 信息泄露漏洞"
updated = "2026-06-17T01:44:39Z"

