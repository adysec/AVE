[basic]
description = "XMail 邮件服务器中的 CTRLServer 组件存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标发送特制请求，利用 cfgfileget 或 domaindel 函数触发缓冲区溢出，进而在系统上执行任意命令。该漏洞影响 XMail 0.5 和 0.6 版本，攻击者可借此完全控制受影响服务器，CVSS 评分满分 10.0，危害等级严重。"
published = "2001-05-03T04:00:00Z"
remediation = "建议立即停止使用 Xmail 0.5/0.6 版本并迁移至现代、安全的邮件服务器软件。若必须维持运行，应在防火墙中严格限制 CTRLServer 端口的访问权限，仅允许受信 IP 访问，或直接禁用该管理服务以消除攻击面。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Xmail CTRLServer 远程代码执行漏洞"
updated = "2026-06-16T21:53:51Z"

