[basic]
description = 'rxvt 2.7.8 的"屏幕转储"（screen dump）功能存在任意文件写入漏洞。该漏洞的成因是 rxvt 在处理特定字符转义序列时，未对目标文件名进行充分校验，攻击者可构造恶意转义序列，当该序列被回显到用户的终端时即可触发，例如用户查看包含该恶意序列的文件时，会在不怀意的情况下被诱导写入任意文件。攻击者无需任何认证，仅需诱使目标用户查看包含恶意转义序列的文件，即可覆盖系统上任意可写文件，可能导致数据破坏、任意代码植入等严重后果。'
published = "2003-03-03T05:00:00Z"
remediation = "立即将 rxvt 升级到 2.7.8 之后已修复该问题的版本（如 shipped 的 2.7.9 以上版本），并从软件源获取官方补丁包完成更新。若无法立即升级，可暂时禁用终端对转义序列的解析能力，或避免直接使用 cat 等命令查看来源不可信的文本文件，且不要在不可信输入中启用终端屏幕转储功能。同时建议限制终端程序在受控用户环境下运行，以防止恶意序列被回显时覆盖任意文件。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "rxvt 终端模拟器任意文件写入漏洞"
updated = "2026-06-16T22:01:21Z"

