[basic]
description = 'Craft CMS 的 CraftSupport 小工具中存在 DOM 型跨站脚本（XSS）漏洞。该漏洞源于 CraftSupportWidget.js 中的 `FeedbackScreen.getSearchResultText` 函数在渲染 GitHub Issue 标题时直接返回 GitHub API 响应的原始 JSON 字符串，且后续使用 jQuery 的 `.html()` 方法将其设置为元素 innerHTML，未进行任何 HTML 编码或过滤。攻击者仅需一个 GitHub 账号（无需 Craft CMS 控制面板权限）即可在 `craftcms/cms` 仓库创建包含 JavaScript 载荷（如 `<img src=x onerror=alert(1)>`）的 Issue 标题。当 Craft CMS 管理员在仪表盘中使用 CraftSupport 小工具的 "Give feedback" 反馈搜索功能，输入匹配该恶意 Issue 的搜索关键词时，载荷会在管理员的控制面板会话中执行，窃取 CSRF Token 并劫持管理权限。受影响的版本为 Craft CMS 4.0.0-RC1 至 4.17.15 及 5.0.0-RC1 至 5.9.22。CVSS 评分 7.4，危害等级高。厂商已在 4.17.16 和 5.9.23 版本中修复该漏洞。'
published = "2026-07-01T23:16:52Z"
remediation = "立即将 Craft CMS 升级至已修复版本：4.x 分支升级至 4.17.16 或更高版本，5.x 分支升级至 5.9.23 或更高版本。通过 Composer 执行 `composer require craftcms/cms:^4.17.16` 或 `composer require craftcms/cms:^5.9.23` 完成升级。升级前务必备份数据库和项目文件。如暂无法升级，可在 Craft 后台禁用仪表盘中的 CraftSupport 反馈组件以消除攻击入口，或通过 Web 应用防火墙（WAF）对控制面板会话中的 HTML 输出进行 XSS 过滤。此外，建议对具有控制面板访问权限的管理员账号启用操作日志审计，以便及时发现异常行为。"
score = 7.4
severity = "HIGH"
sources = ["ghsa"]
title = "Craft CMS CraftSupport 组件 DOM 跨站脚本漏洞"
updated = "2026-07-02T20:17:03Z"

