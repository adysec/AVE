[basic]
description = "Windows 图形组件存在堆缓冲区溢出漏洞 (CWE-122) 和整数溢出漏洞 (CWE-190)。已获得低权限的本地攻击者可通过运行特制应用程序调用图形组件接口，触发堆缓冲区溢出，从而将权限提升至 SYSTEM 级别。攻击无需用户交互，成功利用后可导致任意代码执行、数据泄露及系统完全控制。该漏洞影响 Windows 10/11 及 Windows Server 2019/2022/2025 等多个版本。"
published = "2025-01-14T18:16:03.413"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新 (KB5050021)，通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载。受影响版本包括 Windows 10/11 及 Windows Server 多版本，更新后版本号应不低于：Win10 1809→10.0.17763.6775、Win11 24H2→10.0.26100.2894、Server 2025→10.0.26100.2894。如无法立即打补丁，可限制低权限用户登录受影响的 Windows 系统作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 图形组件特权提升漏洞"
updated = "2026-06-17T08:43:14.780"

