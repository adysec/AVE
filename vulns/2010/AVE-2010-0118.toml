[basic]
description = "RealNetworks RealPlayer 11.0-11.1 及 RealPlayer SP 1.0-1.1.4 (Windows版) 在处理 MP4 内容的 YUV420 色彩空间转换时，未正确校验视频帧维度参数，导致整数溢出进而触发堆缓冲区溢出。远程攻击者可构造恶意 MP4 文件，诱导用户使用受影响版本 RealPlayer 打开，触发漏洞在用户上下文中执行任意代码 (CVSS 9.3，AV:N/AC:M/Au:N/C:C/I:C/A:C)。受影响版本为 RealPlayer 11.0 至 11.1 及 RealPlayer SP 1.0 至 1.1.4，RealPlayer SP 12.0.0.879 及以上版本已修复。攻击需用户交互 (打开恶意文件)，攻击复杂度中等，成功利用可完全控制受害系统。"
published = "2010-08-30T20:00:01Z"
remediation = "立即卸载RealPlayer并改用当前支持的媒体播放器（如VLC、MPC-HC等），彻底消除漏洞影响。如必须继续使用RealPlayer，请升级到最新官方版本（12.0.0.879及以上），并仅从可信来源打开MP4文件，同时在防火墙中封锁所有RealPlayer协议处理相关端口作为网络层防护。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer MP4 YUV420 转换远程代码执行漏洞"
updated = "2026-06-16T23:15:30Z"

