[basic]
description = "Windows SPNEGO Extended Negotiation (NEGOEX) 安全机制存在释放后使用（Use-After-Free）漏洞。攻击者可通过向目标系统发送特制的 NEGOEX 协商请求，在内存对象被释放后仍对其进行访问，从而利用该漏洞实现远程代码执行。该漏洞影响多个 Windows 版本，CVSS 评分 8.1，危害等级高。攻击复杂度较高，但无需身份认证和用户交互即可远程触发。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:51Z"
remediation = '建议立即安装 Microsoft 2025 年 1 月安全更新 KB5050004，可通过 Windows Update 自动获取更新，或从 Microsoft Update Catalog 手动下载安装。如无法立即打补丁，可禁用 NEGOEX 协议作为临时缓解措施：在注册表 `HKLM\SYSTEM\CurrentControlSet\Control\Lsa\` 下创建 `DisableNegoex` DWORD 值为 1。'
score = 8.1
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows SPNEGO 扩展协商安全机制远程代码执行漏洞"
updated = "2026-06-17T08:43:01Z"

