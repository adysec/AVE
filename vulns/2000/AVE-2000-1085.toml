[basic]
description = 'Winsock FTPd (WFTPD) 3.00 及 2.41 版本在启用"限制到家目录"选项时存在目录遍历漏洞。本地用户可通过在路径中构造 "/../" 字符串绕过目录限制，逃逸出家目录访问系统其他文件，属于典型的点号点号（..）攻击变种。该漏洞可导致敏感信息泄露，攻击者无需身份认证即可利用，CVSS 评分 5.0，危害等级中危。'
published = "2001-01-09T05:00:00.000"
remediation = "立即升级到最新的 WFTPD 版本（如 3.10 及以上），或直接迁移到支持安全更新的现代 FTP 服务器（如 vsftpd、ProFTPD）。在升级前，可临时通过防火墙禁用 FTP 端口，限制管理界面访问权限，并确保仅在内部网络环境中使用此服务。无法立即升级的情况下，建议完全禁用 FTP 服务，或将其部署在隔离的 DMZ 区域，并严格限制访问权限为信任主机。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Winsock WFTPD 目录遍历漏洞"
updated = "2026-06-16T21:53:08.937"

