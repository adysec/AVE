[basic]
description = "PHP 5.3.4 之前版本中的 iconv 扩展的 iconv_mime_decode_headers 函数在处理 iconv 和 mbstring（多字节字符串）实现无法识别的字符编码时存在输入验证缺陷。远程攻击者可通过向目标系统发送包含特制 Subject 头的电子邮件消息，利用 ks_c_5601-1987 等非标准字符集触发该漏洞，导致函数输出不完整的数组，从而可能绕过垃圾邮件检测机制或造成其他未指定的安全影响。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响 PHP 5.3.0 至 5.3.3 版本。"
published = "2011-01-18T20:00:10Z"
remediation = "将 PHP 升级至 5.3.4 或更高版本，该版本修复了 iconv 扩展中 iconv_mime_decode_headers 函数对无法识别的字符编码处理不当的问题。如无法立即升级，可在邮件处理逻辑中过滤或校验 Subject 头部的字符编码，避免将不可识别编码直接传入 iconv_mime_decode_headers 函数。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "PHP Iconv iconv_mime_decode_headers 函数编码处理不当漏洞"
updated = "2026-06-16T23:25:22Z"

