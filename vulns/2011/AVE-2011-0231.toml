[basic]
description = "Mozilla Firefox 8.0之前版本及Thunderbird 8.0之前版本的浏览器引擎存在未检查的内存分配失败漏洞（CWE-119）。远程攻击者可通过特制向量触发未正确分配的内存操作，导致内存破坏和应用程序崩溃，在特定条件下可能实现任意代码执行。该漏洞无需身份认证即可远程利用，CVSS评分10.0，危害等级严重。影响Firefox 8.0之前及Thunderbird 8.0之前的所有版本。用户需升级至Firefox 8.0或Thunderbird 8.0及以上版本修复此漏洞。"
published = "2011-11-09T11:55:03Z"
remediation = "立即升级 Mozilla Firefox 至 8.0 或更高版本，Thunderbird 升级至 8.0 或更高版本。对于无法立即升级的系统，可禁用 JavaScript（在 about:config 中将 javascript.enabled 设为 false）作为临时缓解措施，但会严重影响正常浏览功能，建议优先完成版本升级。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox 浏览器引擎内存分配未检查远程代码执行漏洞"
updated = "2026-06-16T23:33:41Z"

