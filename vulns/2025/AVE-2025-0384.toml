[basic]
description = "Google Chrome 的 Metrics 组件存在越界读取漏洞（CWE-125），源于对内存边界检查不充分。远程攻击者可构造特制的 HTML 页面，诱使目标用户访问后触发堆损坏，导致敏感信息泄露或任意代码执行。该漏洞影响 Chrome 132.0.6834.83 之前版本及基于 Chromium 的浏览器（如 Microsoft Edge），CVSS 评分 8.8，危害等级高。用户需升级至 Chrome 132.0.6834.83 或更高版本以修复此漏洞。"
published = "2025-01-15T11:15:09Z"
remediation = "升级 Google Chrome 至 132.0.6834.83 或更高版本（设置→关于 Chrome→自动更新）；Microsoft Edge 用户升级至 132.0.2957.115 或更高版本；基于 Chromium 的浏览器（如 Opera、Brave）请更新至对应修复版本；Linux 发行版用户通过包管理器更新至 132.0.6834.83 及以上版本。无法立即升级时，可禁用 JavaScript 作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome Metrics 越界读取漏洞"
updated = "2026-06-17T08:26:28Z"

