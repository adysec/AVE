[basic]
description = "Mozilla Firefox 的 SVGTextElement.getCharNumAtPosition 函数在处理 SVG 文本时存在悬垂指针漏洞。远程攻击者可通过构造特制的 SVG 文档，诱使用户访问恶意页面，触发已释放内存的悬垂指针引用，导致任意代码执行。该漏洞影响 Firefox 3.6.20 之前版本及 4.x 至 5、Thunderbird 3.1.12 之前版本及 6 之前版本、SeaMonkey 2.3 之前版本，CVSS 评分 10.0，危害等级严重。Mozilla 已在 2011 年 8 月安全更新中修复此漏洞。"
published = "2011-08-18T18:55:01Z"
remediation = "立即升级 Firefox 至 3.6.20 及以上版本（4.x/5 系列用户升级至 6.0），Thunderbird 升级至 3.1.12 及以上版本，SeaMonkey 升级至 2.3 及以上版本。如无法立即升级，可在浏览器中禁用 JavaScript 作为临时缓解措施（about:config 中设置 javascript.enabled=false）。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox SVG 文本处理悬垂指针远程代码执行漏洞"
updated = "2026-06-16T23:26:46Z"

