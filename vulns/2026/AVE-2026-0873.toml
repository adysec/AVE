[basic]
description = "WatchGuard Fireware OS 的 networkd 进程存在越界写入漏洞，具有高权限的认证攻击者可通过向管理 Web UI 发送特制请求触发该漏洞，导致任意代码执行。该漏洞影响 Fireware OS 11.8 至 11.12.4_Update1、12.0 至 12.12 以及 2025.1 至 2026.2 版本，CVSS 评分 8.6，危害等级高危。攻击者需具备认证高权限，利用复杂度低，无需用户交互，可完全控制目标系统机密性、完整性和可用性。"
published = "2026-07-03T00:16:49.333"
remediation = "建议立即升级 Fireware OS 至修复版本：2025.x 系列升级至 2026.2.1，12.x 系列升级至 12.12.1，12.5.x（T15/T35 型号）升级至 12.5.19。11.x 系列已停止支持，须升级至受支持版本。升级路径：登录 WatchGuard Cloud 或 Fireware Web UI，进入 System > Software Update，下载并安装对应版本。如无法立即升级，可在 Management Web UI 中限制管理访问来源 IP，仅允许受信任的管理员 IP 连接，并禁用非必要的无线客户端管理功能作为临时缓解。"
score = 8.6
severity = "HIGH"
sources = ["zdi"]
title = "WatchGuard Fireware OS networkd 越界写入漏洞"
updated = "2026-07-07T05:16:48.363"

