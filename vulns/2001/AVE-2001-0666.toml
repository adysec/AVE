[basic]
description = "BiblioWeb web server 2.0 版本存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标服务器发送超长 HTTP GET 请求触发该缓冲区溢出，导致服务器拒绝服务，并可能在特定条件下执行任意命令。该漏洞影响所有部署 BiblioWeb 2.0 的 Web 服务器，攻击者无需凭据即可通过网络远程利用，攻击复杂度低。"
published = "2001-05-03T04:00:00Z"
remediation = "BiblioWeb 2.0 早已停止维护且无官方补丁，建议立即迁移至现代 Web 服务器（如 Apache 2.4+、nginx 1.18+ 或 IIS 10+）。若暂时无法替换，请在边界防火墙或 WAF 配置规则拦截超长 HTTP GET 请求（建议限制 URL 长度 ≤ 2048 字节、Header 总长 ≤ 8192 字节），并在反向代理层启用请求体大小限制（client_max_body_size 1m）作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "BiblioWeb Web Server 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:55Z"

