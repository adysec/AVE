[basic]
description = "华盛顿大学 c-client 库（被 pine 等邮件客户端使用）存在缓冲区溢出漏洞，远程攻击者可通过向目标邮件服务器发送包含超长 X-Keywords 头的特制邮件触发该漏洞，导致任意代码执行。该漏洞影响使用 c-client 库的多个邮件客户端及服务器软件，CVSS 评分 7.5，危害等级高。攻击者无需身份认证即可远程利用，成功利用后可完全控制受影响系统。"
published = "2000-11-14T05:00:00Z"
remediation = "立即升级 University of Washington c-client 库至 imap-2000 及以上版本，该版本修复了 X-Keywords 头处理中的缓冲区溢出问题。使用 pine 邮件客户端的用户应同步升级至 pine 4.44 或更高版本。如无法立即升级，可在 MTA 或邮件网关层面过滤包含超长 X-Keywords 头的邮件作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "University of Washington c-client 库缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:35Z"

