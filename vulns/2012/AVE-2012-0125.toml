[basic]
description = "Apple iTunes 10.6 之前版本中使用的 WebKit 组件存在内存破坏漏洞（CWE-119）。中间人攻击者可通过操纵 iTunes Store 浏览过程中的网络流量，触发 WebKit 内存损坏，导致远程代码执行或拒绝服务（应用崩溃）。攻击者需处于目标用户与 iTunes Store 之间的网络路径上，拦截并篡改通信数据即可触发该漏洞，无需用户交互。Apple 已在 iTunes 10.6 版本中修复此漏洞。"
published = "2012-03-08T22:55:03Z"
remediation = "立即将 Apple iTunes 升级至 10.6 或更高版本（通过 Apple Software Update 或从 apple.com/itunes 下载），同时将 Safari 升级至 5.1.4 或更高版本。该漏洞源于 WebKit 在处理 iTunes Store 浏览时的内存破坏问题，攻击者可通过中间人攻击执行任意代码。如无法立即升级，建议在网络边界启用 HTTPS 流量检测并禁用不必要的 WebKit 渲染组件作为临时缓解。"
score = 7.6
severity = "HIGH"
sources = ["tenable"]
title = "Apple iTunes WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:59Z"

