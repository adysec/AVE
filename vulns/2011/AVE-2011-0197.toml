[basic]
description = "Google Chrome 18.0.1025.142 之前版本存在使用后释放（use-after-free）漏洞，与 SVG 剪裁处理相关。未经身份认证的远程攻击者可通过构造包含特制 SVG 剪裁数据的网页，触发内存错误引用，导致拒绝服务或可能的其他未指定影响。该漏洞影响 Google Chrome 18.0.1025.142 之前的所有版本，CVSS 评分为 7.5，危害等级为高危。用户访问恶意网页即可触发该漏洞，无需额外交互条件。"
published = "2012-03-30T22:55:01Z"
remediation = "立即将 Google Chrome 升级至 18.0.1025.142 或更高版本，该版本已修复 SVG clipping 路径中的 use-after-free 漏洞。如无法立即升级，可在浏览器设置中禁用 JavaScript 的 SVG 支持作为临时缓解措施，或通过组策略限制不受信任的 SVG 内容加载。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome SVG裁剪使用后释放远程拒绝服务漏洞"
updated = "2026-06-16T23:32:33Z"

