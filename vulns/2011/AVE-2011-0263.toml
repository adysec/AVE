[basic]
description = "Opera浏览器11.10及之前版本未正确处理隐藏的GIF动画图像。远程攻击者可通过构造包含特制GIF动画文件的恶意网页或邮件，诱导目标用户使用受影响版本的Opera浏览器打开该内容。浏览器在处理该隐藏GIF图像时会触发持续性的图像重绘操作，导致CPU资源被大量消耗而无法释放，最终造成系统拒绝服务。该漏洞无需身份认证，攻击条件简单，攻击者仅需让用户访问包含恶意GIF内容的页面即可触发，从而影响正常使用浏览器和执行其他系统任务。"
published = "2011-07-01T10:55:03Z"
remediation = "将 Opera 浏览器升级到 11.10 或更高版本以修复该漏洞。如无法立即升级，可临时通过浏览器设置禁用 GIF 动画自动播放功能，避免加载来源不明的 GIF 图片，从而降低 CPU 被耗尽的风险。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera 浏览器 拒绝服务漏洞"
updated = "2026-06-16T23:31:42Z"

