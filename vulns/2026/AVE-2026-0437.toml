[basic]
description = "brace-expansion 库（≤5.0.7）的 `expand()` 函数虽通过 `max` 参数限制结果数量（默认 100,000），但未限制每个结果字符串的长度。攻击者通过链式拼接大量花括号组（如 `'{a,b}'.repeat(1500)`，约 7.5 KB 输入），使结果数量保持在限制内而每个结果长度随组数线性增长，导致总内存消耗随结果数与字符串长度同步膨胀，最终触发 Node.js 进程不可捕获的致命内存耗尽错误（OOM），造成拒绝服务。任何将用户可控输入传递给 `brace-expansion.expand()` 或其下游 `minimatch`/`glob` 花括号模式的应用程序均受影响。该漏洞 CVSS 评分 7.5，危害等级高，远程攻击者无需认证即可利用。"
published = "2026-07-23T14:17:00.250"
remediation = "立即将 brace-expansion 升级至 5.0.8 或更高版本，该版本新增 maxLength 选项（默认 4,000,000）限制单次 expand() 调用的累计输出字符数，防止内存无限增长。如无法立即升级，在调用 expand() 时显式传入较小的 max 和 maxLength 参数，并避免将用户可控的输入传递给 expand() 或依赖 brace-expansion 的 minimatch/glob 的 brace 模式。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "brace-expansion 内存耗尽拒绝服务漏洞"
updated = "2026-07-23T15:48:25.133"

