[basic]
description = "雄迈科技（XiongMai）uc-httpd 1.0.0 是一款轻量级 HTTP 服务器，广泛部署于雄迈系列网络摄像头、DVR、NVR 等安防设备的 Web 管理界面中。该版本存在缓冲区溢出漏洞（CWE-119），攻击者无需身份认证即可远程触发。当服务器处理特制的超长 HTTP 请求——如过长的 URI、查询字符串或 Cookie——时，由于缺乏适当的边界检查，数据写入缓冲区时发生溢出并覆盖相邻内存区域，进而可导致任意代码执行。该漏洞利用复杂度低（AC:L），无需用户交互，攻击者仅需向目标设备的 Web 端口（通常为 80 或 443 端口）发送精心构造的超长数据请求即可触发溢出并获得设备的完整控制权。此漏洞与 CVE-2017-16725 为不同的安全缺陷。受影响的安防设备一旦被利用，攻击者可植入固件后门、篡改设备配置或以内网为跳板发起横向移动，对监控网络和用户隐私构成严重安全威胁。"
published = "2018-06-08T12:29:00Z"
remediation = "升级XiongMai uc-httpd至1.0.0以上版本，从XiongMai官网下载最新固件并刷写受影响的DVR/IP摄像设备。若暂时无法获取修复版本，可在网络边界防火墙上禁止外部网络对设备Web管理端口（默认80/443）的访问，仅放行受信任的管理IP段，或直接禁用uc-httpd远程Web管理服务以缓解攻击风险。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "雄迈 uc-httpd 缓冲区溢出漏洞"
updated = "2026-06-17T01:33:28Z"

