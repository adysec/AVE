[basic]
description = "yt-dlp 和 youtube-dlp 命令行音视频下载工具中，--write-link、--write-url-link 和 --write-desktop-link 选项在生成 .url 或 .desktop 快捷方式文件时，未对从元数据中提取的 webpage_url 和 filename 字段进行充分验证与转义。攻击者可构造恶意元数据载荷，在 Windows 平台注入 file:// 协议 URI 指向远程可执行文件，或在 Linux 平台通过换行符注入修改桌面条目类型为 Application 并嵌入任意 shell 命令。用户若双击执行生成的快捷方式文件，将导致远程代码执行。该漏洞影响 yt-dlp 2026.07.04 之前的所有版本，CVSS 评分 7.5，危害等级高。"
published = "2026-07-08T20:16:52Z"
remediation = "立即升级 yt-dlp 至 2026.07.04 或更高版本，该版本已对 --write-link 输出的 URL scheme 进行校验并对 .desktop 文件中的条目值进行转义处理。如无法升级，避免使用 --write-link、--write-url-link 和 --write-desktop-link 选项，并确保不使用 --no-windows-filenames 参数以保留默认文件名净化功能。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "yt-dlp 快捷链接文件命令注入漏洞"
updated = "2026-07-13T17:01:13Z"

