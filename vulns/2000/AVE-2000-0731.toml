[basic]
description = "Debian Linux 系统中的 top 程序存在格式字符串漏洞。本地攻击者可以利用该漏洞，通过向 top 程序的 kill 或 renice 函数传递特制格式字符串参数，覆盖内存关键数据或执行任意代码，从而获得目标系统的 root 权限。该漏洞影响多个 Debian 版本，攻击者需要具备本地访问权限才能利用。"
published = "2000-12-11T05:00:00.000"
remediation = '立即升级 Debian 系统 procps 包至修复版本，执行 `apt-get update && apt-get install procps` 获取已修补的 top 程序。若暂无法升级，作为临时缓解措施，可通过 `sudo chmod -s /usr/bin/top` 移除 top 的 setuid/setgid 权限，或限制本地用户对 top 的 kill 和 renice 功能访问权限。该漏洞因 top 在 kill/renice 错误处理时将用户输入直接作为格式字符串传递给 printf 导致，修复版本已改用 `printf("%s", errmsg)` 方式安全输出错误消息。'
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Debian top 程序格式字符串本地提权漏洞"
updated = "2026-06-16T21:52:56.410"

