[basic]
description = "Apache Tomcat 4.0.4 及 4.1.10 及更早版本的 DefaultServlet 存在文件泄漏漏洞。由于该 Servlet 在处理请求时缺乏足够的访问控制限制，未经身份验证的远程攻击者可以通过构造特定的直接请求，诱导服务器将本应由 Tomcat 处理的源文件（如 .jsp 源码或配置文件）作为静态资源直接返回。该漏洞影响 Tomcat 3/4 系列版本，攻击者可利用此漏洞窃取服务器端的敏感源代码及配置信息，从而为进一步攻击提供关键线索。"
published = "2002-10-11T04:00:00Z"
remediation = "建议将 Apache Tomcat 升级至 4.0.5 或 4.1.11 及更高版本。若无法立即升级，可通过配置 Web 容器的安全策略，严格限制对敏感服务器文件的访问权限，或在前端部署 WAF 拦截包含异常路径请求的恶意探测。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Apache Tomcat DefaultServlet 任意文件读取漏洞"
updated = "2026-06-16T21:58:48Z"

