[basic]
description = "标签中。<value>Apple iTunes 在 10.7 及更早版本中使用了存在缺陷的 WebKit 组件，该组件存在内存破坏漏洞。远程攻击者可通过向用户发送包含恶意构造网页的链接，诱使用户在 iTunes 内置浏览器中打开该网页，从而触发内存损坏。成功利用该漏洞可导致应用程序崩溃造成拒绝服务，或在特定条件下执行任意代码。此漏洞影响所有使用受影响版本 WebKit 的 iTunes 用户，攻击者无需预先认证即可远程发起攻击。"
published = "2012-09-13T10:30:20.853"
remediation = "立即将 Apple iTunes 升级至 10.7 或更高版本，Windows 用户可通过 Apple Software Update 或 iTunes 内建更新机制下载安装；OS X 用户升级 Safari 至 6.0.1 或更高版本，或更新至 OS X Mountain Lion v10.8.2。临时缓解措施：避免点击未知来源链接或在浏览器中打开可疑网页，可降低被利用风险。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:44.830"

