[basic]
description = "Paul Vixie 开发的 crontab 工具在编辑计划任务时使用可预测的临时文件名，且未正确验证临时文件的所有权归属。具有 crontab 缓冲池目录写入权限的本地攻击者可通过创建全局可写的临时文件，在受害者执行 crontab -e 编辑计划任务时篡改该文件内容，从而以受害者权限执行任意命令，实现本地权限提升。该漏洞影响使用 vixie-cron 的 Linux 系统，攻击复杂度较高，需要本地访问权限及特定目录写入条件。"
published = "2001-01-09T05:00:00.000"
remediation = "升级 vixie-cron 至 4.2 或更高版本（该版本改用 mkstemp 创建临时文件，避免可预测文件名竞争条件）。如无法升级，限制 crontab 临时目录（通常为 /var/spool/cron）仅允许 root 写入，移除其他用户的写权限，并确保 umask 设置为 077 防止临时文件权限泄露。"
score = 3.7
severity = "LOW"
sources = ["cve"]
title = "Paul Vixie crontab 本地权限提升漏洞"
updated = "2026-06-16T21:53:08.263"

