description = "CVE-2025-14766是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2025-12-16T23:15:44Z"
remediation = "建议立即升级 Google Chrome 至 143.0.7499.147 或更高版本（Help→About Google Chrome 检查并安装更新，或通过 Chrome 自动更新机制推送），该漏洞已在上述版本中修复。使用 Microsoft Edge 的用户需升级至 143.0.3650.96 或更高版本（edge://settings/help 手动检查更新）。使用 Chromium 系内核的第三方浏览器（含嵌入式 CEF 应用）应同步升级至 chromium-143.0.7499.146 及以上（Fedora 可执行 sudo dnf update chromium）。由于攻击需用户交互且为远程可利用，升级前请勿在不可信网站上访问任意链接或打开未知 HTML 页面，并可通过组策略强制启用浏览器自动更新、限制 WebGPU 及 V8 JIT 相关实验特性作为临时缓解。"
