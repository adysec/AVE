[basic]
description = "Oracle Fusion Middleware 的 WebCenter Sites 组件 Advanced UI 子组件存在权限控制不当漏洞。具有高权限的攻击者可通过 HTTP 网络访问利用该漏洞，但需要目标系统上的其他用户进行交互配合。成功利用后可导致未授权读取关键数据乃至完全访问所有 WebCenter Sites 可访问数据，同时可对部分数据进行未授权更新、插入或删除操作，且攻击影响可能波及其他关联产品。该漏洞影响 WebCenter Sites 11.1.1.8.0 版本，CVSS 评分 6.9，危害等级中危。Oracle 已在 2018 年 10 月关键补丁更新中修复此漏洞。"
published = "2018-10-17T01:31:25.573"
remediation = "立即登录 My Oracle Support，下载并应用 Oracle 2018 年 10 月关键补丁更新 (CPUOct2018) 中针对 WebCenter Sites 的安全补丁。受影响版本为 11.1.1.8.0 和 12.2.1.3.0，请升级至对应补丁版本。如无法立即打补丁，可限制对 Advanced UI 组件的网络访问权限，仅允许受信管理员 IP 通过 HTTP 访问，并启用严格的身份验证与会话管理机制作为临时缓解措施。"
score = 6.9
severity = "MEDIUM"
sources = ["nuclei"]
title = "Oracle Fusion Middleware WebCenter Sites 未授权数据访问漏洞"
updated = "2026-06-17T01:57:18.650"

