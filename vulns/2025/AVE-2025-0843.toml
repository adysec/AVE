[basic]
description = "Azure Marketplace SaaS 资源存在访问控制不当漏洞（CWE-284），已获得 Azure 订阅访问权限的授权攻击者可利用该漏洞通过网络向目标 SaaS 资源发送特制请求，绕过预期的权限检查机制，实现信息泄露。根据 Microsoft 的评估，该漏洞在机密性、完整性和可用性三方面均造成高影响（CVSS 8.8），攻击复杂度低且无需用户交互。受影响产品为 Azure Marketplace SaaS，Microsoft 已在 2025 年 1 月安全更新中修复。"
published = "2025-01-09T23:15:08.340"
remediation = "Microsoft 已于 2025 年 1 月安全更新中修复了 Azure Marketplace SaaS 资源的访问控制缺陷，服务端已自动部署修复，用户无需手动安装补丁。建议用户立即审查 Azure 订阅中 Marketplace SaaS 资源的 RBAC 角色分配，移除不必要的特权访问权限，启用 Azure Activity Log 审计并定期检查异常访问行为。如使用自定义角色，确保遵循最小权限原则，限制对 SaaS 资源管理端点的网络访问。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Azure Marketplace SaaS Resources 信息泄露漏洞"
updated = "2026-06-17T08:43:14.540"

