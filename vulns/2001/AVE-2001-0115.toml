[basic]
description = "Working Resources BadBlue 1.02.07 Personal Edition 的 ext.dll 组件存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标服务器发送超长的 HTTP GET 请求触发该溢出，导致应用程序拒绝服务，并可能进一步执行任意系统命令。该漏洞影响 Windows 平台上运行 BadBlue 1.02.07 Personal Edition 的系统，攻击者仅需在网络可达的情况下构造恶意请求即可完成利用，无需任何认证凭据。由于 CVSS 评分满分且漏洞利用条件极低，所有暴露在互联网上的 BadBlue 1.02.07 PE 服务器均面临被远程控制或服务中断的严重风险。"
published = "2001-05-03T04:00:00Z"
remediation = "升级到 BadBlue 1.02.8（或更高版本），可从 Working Resources 官方网站 http://www.badblue.com 下载修复版本。如暂无法升级，建议在防火墙或反向代理层面限制 HTTP GET 请求的 URL 长度不超过 284 字节，以阻止缓冲区溢出触发；同时停止依赖 ext.dll 的 ISAPI 扩展功能，减少攻击面。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Working Resources BadWeb 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:54:00Z"

