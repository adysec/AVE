[basic]
description = 'Phorum 3.0.7 论坛系统的主设置管理功能中存在目录遍历漏洞。远程攻击者在获取 Phorum 管理员权限后，可在 Master Settings 页面的默认 .langfile 名称字段中插入".."（点点）序列进行路径遍历，绕过路径限制读取服务器上的任意文件，被读取的文件内容会直接显示在 admin.php3 页面中。该漏洞源于程序未对用户输入的 langfile 文件名进行充分的路径过滤和校验，攻击者无需身份认证即可通过网络远程触发，成功利用后可读取系统敏感文件（如 /etc/passwd、数据库配置文件等），导致敏感信息泄露。CVSS 评分 5.0，危害等级中危。'
published = "2000-12-31T05:00:00.000"
remediation = '''
[id]
ave_id = "AVE-2000-12290"
aliases = ["CVE-2000-1229"]

[basic]
title = "Phorum 3.0.7 目录遍历任意文件读取漏洞"
description = "Phorum 3.0.7 存在目录遍历漏洞，远程管理员可在 Master Settings 管理功能的默认 .langfile 名称字段中使用\"..\"（点点）序列读取任意文件，导致文件内容在 admin.php3 中显示。攻击者无需认证即可通过网络利用此漏洞获取服务器敏感信息，如配置文件、密码文件等。"
severity = "MEDIUM"
score = 5.0
sources = ["cve"]
published = "2000-12-31"
updated = "2000-12-31"
remediation = "升级到 Phorum 最新版本或对 .langfile 字段输入进行严格过滤，移除\"..\"等目录遍历序列，限制文件读取路径范围。"

[references]
urls = ["http://cert.uni-stuttgart.de/archive/bugtraq/2000/01/msg00215.html", "http://hispahack.ccc.de/mi020.html", "http://www.digitalsec.net/stuff/z-mirrors/hispahack/mi020.htm"]

