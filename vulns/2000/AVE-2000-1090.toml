[basic]
description = "Midnight Commander（mc）是一款类 Norton Commander 界面的文件管理器，广泛用于 Unix 和类 Unix 系统。mc 4.5.51 及更早版本在处理用户打开目录时，未能正确过滤和转义目录名中的特殊字符。攻击者可在本地创建包含特殊字符后跟待执行命令的恶意目录，当其他用户通过 mc 打开该目录时，特殊字符会被 mc 解析并执行其中的命令，从而使攻击者获得提升的权限。该漏洞影响所有使用 mc 文件管理器的 Unix/Linux 系统，本地攻击者无需远程访问即可利用，CVSS 评分为 4.6，属于低危级别。"
published = "2001-01-09T05:00:00.000"
remediation = "立即升级 Midnight Commander 至 4.5.55 或更高版本，以修复畸形目录名称处理中的权限提升漏洞。如无法立即升级，应避免以 root 身份运行 mc，移除 mc 二进制文件的 setuid/setgid 权限位（执行 chmod 0755 $(which mc)），并限制普通用户对不可信目录的访问权限，防止攻击者创建含特殊字符的恶意目录。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Midnight Commander mc 权限提升漏洞"
updated = "2026-06-16T21:53:09.980"

