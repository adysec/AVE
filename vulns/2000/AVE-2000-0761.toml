[basic]
description = "Lotus Domino 5.0.2c 及更早版本的 ESMTP 服务存在多处缓冲区溢出漏洞。远程攻击者无需身份认证即可通过向目标服务器的 25 端口发送超长的 RCPT TO、SAML FROM 或 SOML FROM 命令，触发栈缓冲区溢出，导致服务进程崩溃（拒绝服务），并可能利用精心构造的载荷实现任意代码执行。该漏洞 CVSS 评分 10.0，危害等级严重，影响 Lotus Domino Enterprise Server 及 Mail Server 5.0.1/5.0.2/5.0.3 等版本。"
published = "2000-12-11T05:00:00.000"
remediation = "升级 Lotus Domino 至 5.0.3 及以上版本，该版本已修复 ESMTP 服务中 RCPT TO、SAML FROM、SOML FROM 命令的缓冲区溢出问题。如无法升级，可在 SMTP 网关或防火墙上限制对 Domino ESMTP 端口的访问，仅允许可信邮件服务器连接。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Lotus Domino ESMTP服务远程缓冲区溢出漏洞"
updated = "2026-06-16T21:53:02.613"

