[basic]
description = "Small HTTP Server 2.01 是一款轻量级 HTTP 服务器软件。该版本存在拒绝服务漏洞，未经身份认证的远程攻击者可以连接到目标服务器，连续发送多个 GET、HEAD 或 POST 请求，并在服务器尚未响应之前立即断开连接。服务器未能妥善处理这些提前关闭的连接，导致资源无法及时释放，从而引发服务中断或系统不稳定。该漏洞影响所有运行 Small HTTP Server 2.01 的系统，攻击者无需任何凭据即可利用此漏洞造成拒绝服务攻击，使目标服务器无法正常响应合法用户的访问请求。"
published = "2001-01-09T05:00:00.000"
remediation = "立即将 SmallHTTP Server 从 2.01 版本升级至 2.03 版本，该版本已修复 HTTP 请求拒绝服务漏洞。在升级前，可在 Web 服务器前端部署反向代理（如 Nginx）并配置连接超时与请求速率限制，限制单个 IP 的并发连接数，以缓解攻击影响。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Max Feoktistov Small HTTP Server 2.01 拒绝服务漏洞"
updated = "2026-06-16T21:52:43.133"

