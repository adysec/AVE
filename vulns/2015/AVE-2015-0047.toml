[basic]
description = "WordPress Swim Team 插件 1.44.10777 版本中的 `include/user/download.php` 文件存在绝对路径遍历漏洞。由于对 `file` 参数缺乏有效的路径过滤与校验，未经身份认证的远程攻击者可通过传入完整绝对路径名（如 `/etc/passwd`）直接下载服务器上的任意文件，导致敏感信息泄露。该漏洞攻击复杂度低，无需认证即可利用，影响所有使用该插件的 WordPress 站点。"
published = "2016-01-12T19:59:03Z"
remediation = "立即升级 Swim Team 插件至 v1.45beta3 或更高版本（厂商已在该版本中修复了 download.php 对 file 参数未做路径过滤的问题）。该插件已从 WordPress 官方仓库下架，如无法获取更新版本，建议直接删除并停用该插件。临时缓解措施：在 Web 服务器层面添加访问控制规则，禁止外部直接访问 `/wp-content/plugins/wp-swimteam/include/user/download.php` 路径。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Swim Team插件任意文件下载漏洞"
updated = "2026-06-17T00:29:11Z"

