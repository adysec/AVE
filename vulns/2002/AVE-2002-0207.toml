[basic]
description = "Linux 2.4.x 内核的 UDP 协议实现在发送非分片数据包时将 IP 标识（ID）字段固定为 0，远程攻击者可通过向目标系统发送探测数据包并观察返回的 IP ID 值来识别目标操作系统类型。该漏洞利用方式简单，无需认证即可远程触发，可被用于信息收集阶段以辅助后续针对性攻击。影响所有运行 Linux 2.4 系列内核的系统。"
published = "2002-08-12T04:00:00Z"
remediation = "升级至 Linux 内核 2.6.0 或更高版本，该版本已修复 IP ID 字段固定为 0 的问题，改为随机化生成。对于无法升级内核的旧系统，可配置 iptables 规则限制外部 UDP 探测流量，或使用网络层防火墙过滤可疑的 UDP 探测包作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux Kernel 2.4 UDP IP标识符固定为0信息泄露漏洞"
updated = "2026-06-16T21:57:34Z"

