[basic]
description = "Internet Explorer 5.5 及更早版本存在区域绕过漏洞，远程攻击者可通过构造特制网页，获取浏览器缓存内容的物理路径位置，并将缓存内容在本地计算机区域中打开，随后利用已编译的 HTML 帮助文件（.chm）执行任意程序。攻击者只需诱导用户访问恶意网页即可触发，无需额外身份认证。该漏洞影响 Windows 平台上所有使用 IE 5.5 及更早版本的系统，可导致攻击者在用户权限下执行任意代码，危害严重。"
published = "2001-07-21T04:00:00Z"
remediation = '升级 Internet Explorer 至 6.0 或更高版本，并安装 Microsoft 安全公告 MS01-015 对应补丁。如无法升级，在 IE 安全设置中将「Internet 区域」的「对标记为可安全执行脚本的 ActiveX 控件执行脚本」设为禁用，同时通过注册表禁用 HTML Help 协议：在 `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\HTMLHelp\Restrict` 下创建 DWORD 值 `RestrictToFile` 并设为 1，阻止 .chm 文件跨域执行代码。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Internet Explorer 编译的 HTML 帮助文件远程代码执行漏洞"
updated = "2026-06-16T21:53:28Z"

