[basic]
description = 'Internet Explorer 5.5 及更早版本存在跨域帧信息泄露漏洞。该浏览器未正确验证浏览器窗口内帧的域名归属，远程攻击者可利用此缺陷，通过将本地帧中的信息发送到不同域的帧中，读取客户端计算机上的特定文件内容。该漏洞属于"帧域验证"类漏洞的一个变体，攻击者只需构造恶意网页诱导用户访问，即可在无需用户交互的情况下窃取本地敏感文件。此漏洞影响 Internet Explorer 早期版本，CVSS 评分为 5.0，危害等级中等。Microsoft 已在后续安全更新中修复此问题。'
published = "2001-06-27T04:00:00Z"
remediation = '建议安装 Microsoft 安全公告 MS01-027 提供的补丁：IE 5.01 用户安装 Q295106 补丁，IE 5.5 用户安装 Q299618 补丁。更彻底的修复方案是升级到 Internet Explorer 6 或更高版本（IE 5.5 Service Pack 2 已包含修复）。在 Windows 95/98/98SE/ME 上选择升级至 IE 6 时，必须选择"完整安装"或"典型安装"模式以确保所有受影响文件被替换；在 Windows NT 4.0、Windows 2000 或 Windows XP 上，任意方式升级至 IE 6 均可完全消除该漏洞。也可通过 Windows Update 自动安装累积安全更新。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Internet Explorer 跨域信息泄露漏洞"
updated = "2026-06-16T21:53:57Z"

