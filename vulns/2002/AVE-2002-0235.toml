[basic]
description = "EasyBoard 2000 1.27（EZboard）存在缓冲区溢出漏洞，远程攻击者可通过向 ezboard.cgi、ezman.cgi 或 ezadmin.cgi 发送包含超长 boundary 值的 multipart Content-Type 请求头触发溢出，从而执行任意代码或导致服务拒绝。该漏洞影响使用 EasyBoard 2000 1.27 版本的论坛系统，攻击者无需身份认证即可在目标服务器上执行未授权操作，危害等级高。CVSS v3 评分 7.5，攻击向量为网络，攻击复杂度低，无需交互即可利用。"
published = "2002-05-29T04:00:00Z"
remediation = '由于该软件厂商未发布官方补丁，需手动修复：将 ezboard.cgi、ezman.cgi、ezadmin.cgi 中的 sprintf(boundary, "--%s", delim) 改为 sprintf(boundary, "--%.200s", delim)，限制 boundary 参数长度以防止栈溢出；或直接应用 ExploitDB 提供的 ezboard-fix.pl 二进制补丁脚本对三个 CGI 文件进行修复。若无法立即修补，可在前端部署 WAF 或反向代理，过滤 Content-Type 中过长的 boundary 值作为临时缓解措施，并建议迁移至维护活跃的替代论坛系统。'
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "EZNE.NET Ezboard 2000 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:57:06Z"

