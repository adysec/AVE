[basic]
description = "标签之间。<value>Linux内核mlx5e网卡驱动在启用IPsec隧道模式数据包卸载时存在锁依赖顺序错误缺陷。当在调试内核下尝试添加IPsec安全关联（SA）时，由于SA添加例程中未正确使用_bh()变体获取锁，以及SA删除例程中存在不必要的workqueue刷新操作，触发了内核的锁顺序死锁检测机制，导致SOFTIRQ安全锁与不安全锁之间形成循环依赖。该漏洞影响使用Mellanox ConnectX系列网卡并启用IPsec功能的Linux系统，攻击者需要具备本地低权限访问权限，通过向netlink接口发送特制IPsec SA配置请求即可触发系统panic。该漏洞利用复杂度低且无需用户交互，主要影响系统可用性。内核社区已通过修复锁获取方式并移除冗余workqueue刷新操作来解决此问题。"
published = "2025-01-31T12:15:28Z"
remediation = '建议将 Linux 内核升级至已修复版本：Debian 12（bookworm）升级至 6.1.180-1 或更高，Debian 13（trixie）升级至 6.12.100-1 或更高，Ubuntu 24.04 LTS 升级至 6.8.0-62.65 或更高，Ubuntu 24.10 升级至 6.11.0-24.24 或更高。对于使用 Mellanox/NVIDIA mlx5 网卡并启用 IPsec 隧道模式卸载的系统，可临时通过内核启动参数 "ipsec=0" 或 modprobe 黑名单 mlx5e IPsec 模块来禁用 IPsec 卸载功能以规避崩溃。如无法立即升级内核，建议在防火墙或 IPsec 策略层面禁用隧道模式下的 IPsec 卸载，改为软件加密处理，直至完成内核版本更新。'
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 mlx5e IPsec 死锁漏洞"
updated = "2026-06-17T08:43:59Z"

