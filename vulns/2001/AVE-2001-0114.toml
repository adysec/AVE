[basic]
description = "Working Resources BadBlue 1.02.07 Personal Edition Web 服务器中的 ext.dll 存在路径信息泄露漏洞。未经身份认证的远程攻击者可直接向 ext.dll 发送不带任何参数的请求，触发应用程序错误并将服务器物理路径暴露在错误消息中。该漏洞影响 BadBlue 1.02.07 Personal Edition 版本，攻击者无需凭据即可在网络可达的情况下利用此漏洞获取服务器敏感路径信息，为后续进一步渗透攻击提供有利条件。"
published = "2001-05-03T04:00:00Z"
remediation = "建议立即升级 BadBlue 到 1.02.8 或更高版本，该版本已修复 ext.dll 路径信息泄露问题。升级前可从 BadBlue 官网下载对应补丁。如暂时无法升级，可在防火墙或 Web 服务器配置中禁止外部访问 ext.dll，或直接移除该文件，以阻止攻击者通过无参请求获取服务器物理路径。"
score = 6.4
severity = "MEDIUM"
sources = ["epss"]
title = "Working Resources BadBlue 路径信息泄露漏洞"
updated = "2026-06-16T21:54:00Z"

