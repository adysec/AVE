[basic]
description = "Windows Win32k 组件存在特权提升漏洞，由于在内存中处理对象时未能正确释放资源，导致对象引用计数错误（CWE-404）。攻击者在已获得目标系统低权限执行权限后，可通过特制构造的数据触发该漏洞，将进程权限提升至 SYSTEM 级别，完全控制受影响的系统。该漏洞影响 Windows 7、Windows 8.1、Windows 10、Windows RT 8.1 以及 Windows Server 2008、Windows Server 2008 R2、Windows Server 2012、Windows Server 2012 R2、Windows Server 2016、Windows Server 2019 等多个版本。Microsoft 已在 2018 年 12 月发布的安全更新中修复此漏洞。"
published = "2018-12-12T00:29:01Z"
remediation = "建议立即安装微软 2018 年 12 月发布的累积更新（Cumulative Update），通过 Windows Update 自动更新或从微软官方更新目录下载对应的 KB 补丁包。对于无法立即更新的系统，建议通过限制低权限用户的 Win32k 句柄访问权限来减轻风险。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Win32k 特权提升漏洞"
updated = "2026-06-17T02:05:14Z"

