[basic]
description = "Azure 备份和站点恢复代理安装程序存在权限管理不当漏洞（CWE-269）。本地已授权攻击者需具备低权限并诱使用户执行特定操作，利用安装程序中的权限管理缺陷将自身权限提升至 SYSTEM 级别，从而获取对目标系统的高完整性访问能力。该漏洞影响 Azure 备份和站点恢复代理安装程序组件，CVSS 评分 6.7，危害等级中危。成功利用后攻击者可读取敏感数据、安装程序或执行任意操作。Microsoft 已在 2025 年 3 月安全更新中修复此漏洞。"
published = "2025-03-11T17:16:19Z"
remediation = '将 Azure 备份代理升级到 2.0.9940.0 及以上版本，将 Azure Site Recovery 代理升级到 9.30 及以上版本。可在 Azure 门户中通过"恢复服务保管库"→"复制的基础结构"→"更新代理"批量推送更新。如无法立即升级，建议限制本地用户对安装目录的写入权限，并确保仅授权管理员执行代理安装操作。'
score = 6.7
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Azure 备份和站点恢复代理安装程序特权提升漏洞"
updated = "2026-06-17T08:42:45Z"

