[basic]
description = "Linux 内核 HID 子系统中的 thrustmaster 驱动程序存在端点类型检查缺失漏洞。在 thrustmaster_probe 函数中，未对 USB 传输端点类型进行正确校验，导致 USB 管道与传输端点之间存在类型不匹配，可触发内核警告。该漏洞由 syzbot 工具发现，攻击者需要本地低权限访问系统，通过插入特制的 Thrustmaster 游戏外设来触发此问题，造成内核警告信息泄露或拒绝服务。CVSS 评分 5.5，危害等级中等。Linux 内核主线已合入修复补丁，通过添加端点类型检查来消除该问题。"
published = "2025-02-27T02:15:13Z"
remediation = "建议立即将 Linux 内核升级至 6.1.129、6.6.76、6.12.13 或 6.13.2 及以上版本，这些版本已包含针对 hid-thrustmaster 驱动 USB 端点类型检查的修复补丁。如无法立即升级内核，可应用以下补丁提交：220883fba325、ae730deded66、e5bcae4212a6、816e84602900 或 50420d7c79c3。临时缓解措施可卸载 thrustmaster 内核模块（modprobe -r hid-thrustmaster）并禁用对应 USB 设备，但会影响方向盘功能。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 HID thrustmaster 驱动端点检查缺失导致拒绝服务漏洞"
updated = "2026-06-17T08:14:24Z"

