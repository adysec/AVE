[basic]
description = "Astro 是一个面向内容驱动型网站的 Web 框架。在 3.10.0 至 7.0.3 版本中，当 `transition:persist`、`transition:scope` 或 `transition:persist-props` 指令应用于客户端水合组件时，Astro 将指令值直接复制到渲染的 `<astro-island>` 元素上，未进行 HTML 转义。若开发者将攻击者可控的输入（如 URL 查询参数）反射到这些过渡指令中，攻击者可突破属性边界，向服务端渲染输出注入任意 HTML/JavaScript，导致反射型跨站脚本攻击（XSS）。利用前提是开发者将不可信的请求派生输入直接传递给过渡指令，这属于非惯用编码模式。该漏洞影响 Astro 3.10.0 至 7.0.3 版本，已在 7.0.4 版本中修复。"
published = "2026-07-27T20:16:40Z"
remediation = "立即升级至 astro@7.0.4 或更高版本（npm install astro@latest）。如无法立即升级，禁止将不可信的用户输入直接传递给 transition:persist、transition:scope 或 transition:persist-props 指令，必要时对输入进行 HTML 转义或严格校验。"
score = 2.1
severity = "LOW"
sources = ["ghsa"]
title = "Astro Astro 跨站脚本漏洞"
updated = "2026-07-28T16:19:23Z"

