[basic]
description = "West Street LocalWEB HTTP Server 1.2.0 存在缓冲区溢出漏洞，远程攻击者可通过向目标服务器发送超长 GET 请求触发该漏洞，导致服务进程崩溃，造成拒绝服务。该漏洞影响 LocalWEB HTTP Server 1.2.0 版本，攻击者无需身份认证即可远程利用，CVSS 评分 6.4，危害等级中危。目前厂商已停止维护，建议用户迁移至其他受支持的 Web 服务器软件。"
published = "2000-07-05T04:00:00Z"
remediation = "建议立即停止使用已停止维护的 West Street LocalWEB HTTP Server 1.2.0，迁移至受支持的 Web 服务器（如 Apache HTTP Server 或 Nginx）。若无法立即迁移，可在网络防火墙或反向代理层配置规则，拦截长度超过 4096 字节的 HTTP GET 请求路径，以缓解拒绝服务攻击风险。"
score = 6.4
severity = "MEDIUM"
sources = ["avd"]
title = "West Street Software LocalWEB HTTP Server 1.2.0 长GET请求拒绝服务漏洞"
updated = "2026-06-16T21:52:01Z"

