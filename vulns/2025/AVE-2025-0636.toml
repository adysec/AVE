[basic]
description = ".NET 框架及 .NET Core 运行时存在权限提升漏洞。该漏洞源于 .NET 在处理特权提升相关的安全边界校验时存在缺陷，攻击者在具备本地访问权限、且能操控受影响进程执行环境的情况下，可利用该缺陷绕过既有安全限制，导致权限提升。该漏洞需要攻击者已获得一定本地访问基础并具备较低权限（CVSS 局部访问、低复杂度、需用户交互），危害等级为高危。成功利用后攻击者可能篡改宿主进程权限或执行受限操作，从而影响系统完整性与机密性。Microsoft 已在其 2025 年 1 月安全更新中针对相关 .NET 版本发布修复补丁，建议用户尽快升级至受支持的更新版本以消除风险。"
published = "2025-01-14T18:15:30Z"
remediation = "将 .NET 8.0 升级至 8.0.12 或更高版本，.NET 9.0 升级至 9.0.1 或更高版本；将 Visual Studio 2022 17.6 升级至 17.6.22、17.8 升级至 17.8.17、17.10 升级至 17.10.10、17.12 升级至 17.12.4 或更高版本。可通过 dotnet SDK 官方安装包或 Visual Studio 更新程序安装对应安全更新。临时缓解措施：限制低权限用户对临时目录的写入权限，并避免以交互方式运行不受信任的 .NET 应用程序。"
score = 7.3
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft .NET 特权提升漏洞"
updated = "2026-06-17T08:42:41Z"

