[info]
author = "AVE"
description = "检测目标 Telerik UI for ASP.NET AJAX 是否启用了存在弱加密漏洞的 RadAsyncUpload 组件。通过访问 /Telerik.Web.UI.WebResource.axd?type=rau 端点，若返回包含 'RadAsyncUpload handler is registered succesfully' 则表明目标存在 CVE-2017-11317 漏洞，攻击者可利用弱加密绕过文件上传限制上传任意文件。"
id = "POC-AVE-2017-0208"
name = "Telerik UI for ASP.NET AJAX RadAsyncUpload Weak Encryption PoC"
severity = "critical"
tags = [
    "cve-2017-11317",
    "telerik",
    "file-upload",
]
vuln_id = [
    "CVE-2017-11317",
    "AVE-2017-0208",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/Telerik.Web.UI.WebResource.axd"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["RadAsyncUpload handler is registered succesfully"]

[poc.requests.params]
type = "rau"
