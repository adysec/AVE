[basic]
description = "Linux 内核调节器（regulator）子系统中的虚拟调节器（dummy）驱动存在空指针解引用漏洞。由于 dummy_regulator_probe() 与 anatop_regulator_probe() 可能在不同内核线程中并发执行，当虚拟调节器的探针尚未完成（dummy_regulator_rdev 仍为 NULL）时，anatop_regulator_probe() 调用 devm_regulator_register() 进而触发 regulator_register()、regulator_resolve_supply() 及 kobject_get()，导致空指针解引用。该漏洞影响 Linux 内核 6.4 至 6.13 等版本（在 6.6.85、6.12.21、6.13.9 修复之前），具有本地低权限攻击条件的攻击者可在系统启动时序窗口内触发该漏洞，导致系统崩溃或本地拒绝服务。CVSSv3.1 评分为 5.5（中危），攻击向量为本地、攻击复杂度低、无需用户交互。"
published = "2025-04-08T09:15:24Z"
remediation = "将 Linux 内核升级至包含该补丁的稳定版本，包括但不限于 6.6.85、6.12.21、6.13.9 或 6.14 及以上版本。对于 Ubuntu 系统，24.04 LTS 应升级至内核 6.8.0-84.84 或更高版本，24.10 应升级至 6.11.0-28.28 或更高版本。如暂时无法升级内核，可在启动参数中尝试禁用 dummy regulator 模块（modprobe.blacklist=dummy_regulator）作为临时缓解措施，但此举可能影响依赖虚拟调节器的设备树配置，仅建议在确认业务不受影响时使用。建议定期检查内核邮件列表和发行版安全公告以获取最新补丁。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel dummy regulator 空指针解引用漏洞"
