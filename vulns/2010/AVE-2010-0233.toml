[basic]
description = "PHP 的 ZipArchive::getArchiveComment 函数存在空指针解引用漏洞，当处理特制的 ZIP 压缩包时，该函数未能对传入参数进行有效验证，导致空指针被解引用从而引发程序崩溃。攻击者可通过向目标服务器提交恶意构造的 ZIP 文件触发此漏洞，造成 PHP 进程拒绝服务。该漏洞影响 PHP 5.2.x 至 5.2.14 及 5.3.x 至 5.3.3 版本，CVSS 评分 4.3，危害等级中危。官方已在 PHP 5.3.4 及 5.2.15 版本中修复此问题。"
published = "2010-11-09T01:00:02Z"
remediation = "立即将 PHP 升级至 5.3.4 或 5.2.15 及以上版本，该漏洞已在 PHP 5.3.4 的 ChangeLog 中标记为已修复。如无法立即升级，可在调用 ZipArchive::getArchiveComment() 方法前自行校验 ZIP 存档是否包含注释字段，避免传入恶意构造的 ZIP 文件触发空指针解引用导致服务崩溃。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "PHP ZipArchive::getArchiveComment 空指针解引用漏洞"
updated = "2026-06-16T23:23:23Z"

