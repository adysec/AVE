[basic]
description = "Apache Struts2 的 Struts1 插件存在远程命令执行漏洞（S2-048），当 ActionMessage 类接收用户传入的原始消息时，未对恶意字段值进行安全过滤，导致攻击者可通过构造特制的恶意请求触发 OGNL 表达式注入，从而在服务器端执行任意系统命令。该漏洞影响 Apache Struts 2.1.x 及 2.3.x 系列版本，攻击者无需身份认证即可远程利用，危害严重。官方已发布修复版本，建议升级至 2.3.32 或 2.5.10.1 及以上版本。"
published = "2017-07-10T16:29:00.277"
remediation = "升级 Apache Struts 至 2.3.32 及以上版本，禁用 Struts 1 插件（struts-plugin-1.x.jar），或从 WEB-INF/lib 目录移除 struts-plugin-1.jar 文件。如无法升级，在 ActionMessage 中避免使用用户输入作为原始消息参数。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Apache Struts2 远程命令执行漏洞"
updated = "2026-06-17T01:28:55.190"

