[basic]
description = "Hyper-V RemoteFX vGPU 功能存在输入验证不当漏洞，主机服务器未能正确验证来自客户机操作系统中已认证用户的输入数据，导致远程代码执行。攻击者需拥有客户机操作系统的合法登录权限，通过构造特制的输入触发漏洞，可在 Hyper-V 宿主机上以 SYSTEM 权限执行任意代码。该漏洞影响启用了 RemoteFX vGPU 功能的 Windows Server 版本，CVSS 评分 9.0，危害等级严重。Microsoft 已在 2020 年 7 月安全更新中修复此漏洞。"
published = "2020-07-14T23:15:11Z"
remediation = "立即安装 Microsoft 2020 年 7 月安全更新（对应 KB4565511 等补丁），或通过 Windows Update 自动更新。如无法立即打补丁，可在 Hyper-V 主机上禁用 RemoteFX vGPU 功能：在 PowerShell 中执行 `Set-VMRemoteFXPhysicalVideoAdapter -Disable`，或从虚拟机设置中移除 RemoteFX 3D 适配器。NVIDIA 用户还应参考 NVIDIA 安全公告 5044 更新 GPU 驱动。该漏洞已被 CISA 列入已知被利用漏洞目录，建议优先修复。"
score = 9
severity = "CRITICAL"
sources = ["kev"]
title = "Microsoft Hyper-V RemoteFX vGPU 远程代码执行漏洞"
updated = "2026-06-17T03:00:17Z"

