[basic]
description = "Microsoft Edge（Chromium 内核）存在欺骗漏洞，攻击者可通过构造特制的恶意网页，诱使用户在浏览器中点击或交互，导致浏览器 UI 内容被伪造或篡改，用户可能误认为正在访问合法站点而泄露敏感信息。该漏洞影响 Microsoft Edge 133.0.3065.51 之前版本，攻击者无需身份认证即可远程利用，但需要用户交互配合。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞，建议用户升级至最新版本。"
published = "2025-02-06T23:15:09Z"
remediation = "立即将 Microsoft Edge 升级至 133.0.3065.51 或更高版本，可通过 Edge 设置 > 关于 Microsoft Edge 检查更新自动安装。如无法立即更新，可在浏览器设置中启用「增强安全模式」并禁用 JavaScript 作为临时缓解措施，同时教育用户不要点击可疑链接。企业环境可通过组策略或 Microsoft Endpoint Manager 批量推送更新。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Edge (Chromium-based) 欺骗漏洞"
updated = "2026-06-17T08:43:17Z"

