[basic]
description = "Oracle 8.1.6 中的 oidldapd 组件存在缓冲区溢出漏洞，本地攻击者可通过向 connect 命令行参数传入超长字符串触发缓冲区溢出，从而获取目标系统的提升权限。该漏洞影响 Oracle Internet Directory 2.0.6 及更早版本，CVSS 评分 4.6，危害等级中危。攻击者需拥有本地访问权限，利用难度较低，成功利用后可导致系统机密性、完整性和可用性部分受损。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 Oracle 8.1.6 至 8.1.7 或更高版本，该漏洞已在后续版本中修复。如无法升级，限制本地用户对 oidldapd 可执行文件的执行权限，仅授权可信管理员账户使用，并监控 /var/log/messages 中异常的 oidldapd connect 参数记录。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Oracle Oracle Internet Directory oidldapd 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:52:55.040"

