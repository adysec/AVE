[basic]
description = "Netscape Communicator 未能正确阻止不受信任的实体创建 ServerSocket 对象，导致远程攻击者可通过恶意 Applet 在受害者系统上创建监听服务器，如 Brown Orifice Applet 所演示。该漏洞影响 Sun JDK 1.1.x、Sun JRE 1.1.x 及 Netscape Communicator，攻击者无需身份认证即可通过网络发起攻击，攻击复杂度低，成功利用可导致受害系统机密性、完整性、可用性均受到部分影响（CVSS 7.5，高危）。攻击者通过诱导用户运行恶意 Applet，在受害机器上建立监听端口，进而实现远程访问或进一步攻击。Sun 已发布补丁修复该漏洞，建议升级至 JDK/JRE 1.2 或更高版本。"
published = "2000-10-20T04:00:00Z"
remediation = "建议立即升级到 Sun JDK/JRE 1.2 或更高版本（已修复 ServerSocket 权限校验缺陷）。若无法立即升级，请在浏览器中彻底禁用 Java Applet 支持（Netscape Communicator 取消“启用 Java”勾选），并在防火墙层面禁止非受信任端口监听，作为临时缓解措施。建议尽快迁移至 JDK 1.2.2_001 或更高版本彻底修复该漏洞。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Sun JDK 1.1.x / Netscape Communicator 侦听套件漏洞"
updated = "2026-06-16T21:52:19Z"

