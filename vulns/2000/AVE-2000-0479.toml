[basic]
description = "O'Reilly WebSite Professional Web 服务器 2.x 版本中的 webfind.cgi 程序存在缓冲区溢出漏洞，远程攻击者可通过向目标系统发送包含超长 keywords 参数的恶意 URL 触发该漏洞，导致缓冲区溢出，从而在服务器上以 Web 进程权限执行任意命令。该漏洞影响 WebSite Professional 2.3.18/2.4/2.4.9 等版本，CVSS 评分 10.0，危害等级严重。攻击者无需身份认证即可远程利用，已有公开的 Exploit-DB 利用代码。"
published = "2000-07-19T04:00:00Z"
remediation = "O'Reilly WebSite Professional 已于 2000 年代停止维护，官方不再提供安全更新。建议立即迁移至受支持的 Web 服务器（如 Apache HTTP Server、Nginx 或 IIS）。如因遗留系统无法迁移，应删除或禁用 webfind.exe CGI 程序（通常位于 cgi-bin 目录），并在 Web 服务器或网络防火墙层面限制对 webfind.exe 的访问，仅允许可信 IP 调用。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "O'Reilly WebSite Professional webfind.exe 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:07Z"

