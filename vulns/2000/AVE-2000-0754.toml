[basic]
description = "ISC BIND 8.1 的 host 命令存在缓冲区溢出漏洞，远程攻击者可通过向目标 DNS 服务器发送特制的 AXFR 查询响应（超长响应数据），触发缓冲区溢出，从而在目标系统上执行任意代码。该漏洞影响 ISC BIND 8.1 版本，CVSS 评分 10.0，危害等级严重。攻击者无需身份认证即可远程利用，且可完全控制受影响系统。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级至 BIND 9.x 系列（如 9.16.48 或 9.18.24 以上版本），BIND 8.x 已停止维护且存在多个缓冲区溢出漏洞。如无法升级，在 named.conf 中限制 zone transfer 仅允许授权从服务器，并配置 ACL 限制 AXFR 查询来源 IP。同时禁用 dig/host 等调试工具的非必要递归查询功能。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "ISC BIND 8.1 host命令远程缓冲区溢出漏洞"
updated = "2026-06-16T21:53:00Z"

