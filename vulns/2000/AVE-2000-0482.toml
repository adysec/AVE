[basic]
description = "Computer Software Manufaktur 出品的 Alibaba Web 服务器 2.0 存在缓冲区溢出漏洞。攻击者无需身份认证，可通过网络向目标发送超长 GET 请求触发缓冲区溢出，导致服务拒绝服务（DoS）崩溃。该漏洞影响 Alibaba 2.0 等版本，攻击条件为可访问目标 HTTP 服务即可利用，公开 PoC 已证实可通过构造超长请求完成远程拒绝服务攻击。"
published = "2000-07-18T04:00:00.000"
remediation = "立即停止对外暴露 Computer Software Manufaktur Alibaba 2.0 Web Server，卸载该服务并迁移至 Nginx、Apache、IIS 等仍在维护的 Web 服务器。若短期无法替换，请在前置防火墙或反向代理上限制 HTTP GET 请求 URI 长度（例如拒绝超过 2048 字节的请求），仅允许可信源 IP 访问 80/443 端口，并对 Alibaba 进程配置异常崩溃后自动重启与监控告警。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Computer Software Manufaktur Alibaba 2.0 Web服务器 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:08.330"

