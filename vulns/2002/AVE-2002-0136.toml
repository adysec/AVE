[basic]
description = "Squid 2.4 STABLE3 及更早版本中存在安全绕过漏洞。即使管理员在 squid.conf 中将 htcp_port 设置为 0 以禁用 HTCP 协议，Squid 实际上并未正确禁用该协议，导致 HTCP 服务仍然处于可用状态。远程攻击者无需认证即可利用此漏洞，通过发送特制的 HTCP 数据包绕过预期的访问控制限制，可能导致信息泄露、权限提升或服务异常。该漏洞影响 Squid 2.4 STABLE3 及之前的所有版本，CVSS 评分 7.5，危害等级高。"
published = "2002-03-08T05:00:00Z"
remediation = "升级 Squid 至 2.4.STABLE4 及以上版本，或应用官方补丁 squid-2.4.STABLE3-htcp_off.patch。如无法升级，重新编译 Squid 时去掉 --enable-htcp 选项以彻底禁用 HTCP 功能；或在防火墙层面阻断 UDP 端口 4827（HTCP 默认端口）的入站流量作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Squid HTCP 安全绕过漏洞"
updated = "2026-06-16T21:56:42Z"

