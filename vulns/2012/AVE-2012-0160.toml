[basic]
description = "RealNetworks RealPlayer 的 RV10 编解码器在处理 RV10 RealVideo 视频流中的高度和宽度值时存在远程代码执行漏洞。攻击者可构造特制的 RV10 视频文件，诱导用户使用受影响版本的 RealPlayer 播放，从而触发该漏洞，导致任意代码执行。该漏洞影响 RealPlayer 11.x、14.x、15.x（15.02.71 之前版本）以及 RealPlayer SP 1.0 至 1.1.5 版本，CVSS 评分 9.3，危害等级严重。建议用户升级至 15.0.2.72 或更高版本以修复此漏洞。"
published = "2012-02-08T15:55:00Z"
remediation = "升级 RealPlayer 至 15.0.2.72 或更高版本，该版本修复了 RV10 编解码器处理高度/宽度值时存在的远程代码执行漏洞。由于 RealNetworks 已停止对旧版 RealPlayer 的支持，建议卸载 RealPlayer 并改用 VLC 等仍在维护的媒体播放器。临时缓解措施：不要打开来源不明的 .rm/.rmvb 媒体文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer RV10编解码器远程代码执行漏洞"
updated = "2026-06-16T23:38:31Z"

