[basic]
description = "Joe 文本编辑器在异常退出时创建名为 DEADJOE 的恢复副本时会跟随符号链接，导致本地攻击者可通过创建指向其他用户文件的符号链接，诱使受害者运行 Joe 编辑器并触发异常退出，从而覆盖目标用户的任意文件。该漏洞影响所有使用 Joe 编辑器的 Linux/Unix 系统，CVSS 评分 5.5（中等），攻击向量为本地、低权限、无需用户交互，主要影响文件完整性（完整性影响高）。攻击者需具备本地账户权限并能诱导目标用户运行 Joe 编辑器，利用方式为预先创建指向敏感文件的符号链接 DEADJOE，待目标用户异常退出编辑器时触发文件覆盖。该漏洞属于 CWE-59 符号链接跟随类漏洞，建议升级至修复版本的 Joe 编辑器或限制普通用户对符号链接的创建权限。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 Joe 编辑器到 2.9.8 或更高版本（该版本修复了 DEADJOE 符号链接跟随漏洞）。若无法立即升级，可通过设置环境变量 JOE_NOSYMLINKS=1 禁用符号链接跟随，或在 /etc/joe/joerc 中添加 -nosymlinks 选项禁用救援副本的符号链接跟随功能。建议同时设置用户 umask 077 限制救援文件权限，防止其他用户读写。"
score = 5.5
severity = "MEDIUM"
sources = ["cve"]
title = "Joe 文本编辑器 DEADJOE 符号链接跟随漏洞"
updated = "2026-06-16T21:53:19Z"

