[basic]
description = "GNU Binutils 2.45 版本的链接器（bfd/elflink.c）中的 elf_link_add_object_symbols 函数存在越界读取漏洞。本地攻击者可通过向目标系统提供特制的 ELF 文件触发该漏洞，导致链接器进程读取越界内存数据，可能造成敏感信息泄露或程序崩溃。该漏洞影响 GNU Binutils 2.45 及之前版本，CVSS 评分 1.9，危害等级低。升级至 Binutils 2.46 版本即可修复。"
published = "2025-10-07T22:15:34Z"
remediation = "将 GNU Binutils 升级至 2.46 或更高版本（commit 72efdf166aa0）。对于 SUSE Linux 用户，安装 SUSE-SU-2025:4096-1 安全更新。在 aarch64 架构上，避免在旧代码流中使用 `-z gcs=implicit` 链接选项作为临时缓解措施。"
score = 1.9
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils 链接器越界读取漏洞"
updated = "2026-06-17T08:30:24Z"

