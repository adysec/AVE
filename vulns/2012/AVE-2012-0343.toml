[basic]
description = "Apple Safari 浏览器所依赖的 WebKit 引擎存在内存破坏漏洞（CVE-2012-3667）。未经验证的攻击者可诱使用户访问恶意构造的网页，利用 WebKit 在处理特定数据时的内存管理缺陷触发内存越界写入，从而在目标系统上执行任意代码或导致应用程序崩溃拒绝服务。该漏洞影响 Safari 6.0 之前的所有版本，CVSS 评分为 9.3，危害等级严重。Apple 已在 2012 年 7 月发布的安全更新中修复此问题，建议用户尽快升级至 Safari 6.0 或更高版本。"
published = "2012-07-25T20:55:04.320"
remediation = "立即将 Apple Safari 升级至 6.0 或更高版本，该版本修复了 WebKit 内存破坏漏洞。macOS 用户可通过系统偏好设置中的软件更新获取补丁，或从 Apple 官方页面手动下载 Safari 6.0 安装包。若无法立即升级，可在 Safari 偏好设置中禁用 JavaScript 作为临时缓解措施，以降低被利用执行任意代码的风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:41.590"

