[basic]
description = "Linux 内核 spufs（Synergistic Processing Unit 文件系统）中存在引用计数漏洞，由于帮派目录（gang directory）的生命周期管理不当，先前错误的补丁移除了目录项固定机制，导致目录项引用计数失衡。当用户态进程创建帮派并打开其目录后，若在关闭帮派前创建并保持关联上下文，目录移除操作将失败，造成内核对象泄漏。具有本地低权限的攻击者可通过反复触发该条件，累积引用计数不平衡，最终实现权限提升并执行任意代码。该漏洞影响运行 Linux 内核的 PowerPC 系统，CVSS v3.1 评分 7.8（高危）。"
published = "2025-04-16T15:16:01Z"
remediation = "上游已在 Linux 内核中合并修复提交 c134deabf4784e155d360744d4a6a835b9de4dd4。建议将 Linux 内核升级至 6.12.25 及以上版本（Debian 已发布 DSA-5907-1，修复版本为 linux 6.12.25-1）。如暂时无法升级，可通过内核启动参数 'nospufs' 禁用 SPU 文件系统，或限制非特权用户对 /dev/spu 目录的访问权限，以减少本地攻击面。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 spufs 本地权限提升漏洞"
updated = "2026-07-30T06:22:10Z"

