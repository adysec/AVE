[basic]
description = 'his software auktion 1.62 版本存在目录遍历漏洞，攻击者可通过构造包含 "../" 序列的恶意请求参数，绕过路径限制读取服务器文件系统中的任意文件。该漏洞源于应用程序对用户输入的文件路径参数缺乏有效过滤和规范化处理，导致攻击者可通过目录穿越技术访问 Web 根目录之外的敏感文件（如系统配置文件、数据库文件、源代码等）。漏洞影响 auktion 1.62 版本，远程未认证攻击者即可利用，无需特殊权限。攻击者可通过该漏洞泄露服务器敏感信息，进而导致进一步的系统渗透或数据窃取风险。'
published = "2001-06-02T00:00:00Z"
remediation = "立即迁移至现代拍卖平台（如 OpenBid、AuctionWorx 等），HIS Software 已停业无补丁。若必须暂时保留：1) 在 Web 服务器层面（IIS/Apache）为 /cgi-bin/auktion.pl 添加 WAF 规则拦截 menue 参数中的 ../ 与 shell 元字符（; | & $ `）；2) 将 CGI 进程以低权限专用账户运行，禁止 SYSTEM/Administrator；3) 防火墙仅允许受信 IP 访问该 CGI；4) 删除或重命名 auktion.pl 禁用该功能模块。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "his software auktion 1.62 目录遍历漏洞"
updated = "2001-06-02T00:00:00Z"

