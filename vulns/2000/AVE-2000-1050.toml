[basic]
description = "Slashcode 2.0 Alpha 之前版本的默认配置中存在硬编码管理密码漏洞。远程攻击者无需身份认证即可利用该默认密码登录系统后台，获取 Slashcode 管理权限，进而可能执行任意命令，完全控制受影响系统。该漏洞影响所有使用 Slashcode 默认配置的服务器，CVSS 评分 7.5，危害等级高。建议用户升级至 2.0 Alpha 或更高版本，并在部署时修改默认管理密码。"
published = "2000-12-11T05:00:00Z"
remediation = "立即将 Slashcode 升级至 2.0 Alpha 或更高版本，该版本已移除默认管理密码。如无法升级，手动修改数据库或配置文件中管理员账户的默认密码为强密码（至少 12 位，含大小写字母、数字和特殊字符），并删除或禁用未使用的默认管理员账户。同时限制管理后台的访问来源 IP，仅允许可信网络段访问。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Slashcode Slashcode 默认管理密码漏洞"
updated = "2026-06-16T21:52:58Z"

