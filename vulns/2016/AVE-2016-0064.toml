[basic]
description = "Spring Security OAuth 2.0.0至2.0.9及1.0.0至1.0.5版本在处理授权请求时，使用白标视图（whitelabel views）对response_type参数值进行Spring SpEL表达式解析，导致存在SpEL注入漏洞。已登录的远程攻击者可通过构造恶意的response_type参数值触发SpEL表达式执行，从而在目标服务器上实现远程代码执行（RCE），完全控制受影响系统。该漏洞影响广泛使用Spring Security OAuth的应用，危害严重。"
published = "2017-05-25T17:29:00Z"
remediation = "建议立即将 Spring Security OAuth 升级至 2.0.10 或更高版本（2.x 用户），或 1.0.x 用户停止使用 whitelabel 视图处理授权审批和错误页面，改用自定义视图替代。如无法立即升级，可在反向代理层对 response_type 参数进行 SpEL 表达式过滤，阻止包含 ${} 或 T() 等 SpEL 特征字符的请求。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "Pivotal Spring Security OAuth SpEL表达式注入远程代码执行漏洞"
updated = "2026-06-17T00:48:32Z"

