[basic]
description = "Linux内核ENETC网络驱动程序中，虚拟功能（VF）设备不支持HWTSTAMP_TX_ONESTEP_SYNC单步时间戳模式，因为只有物理功能（PF）可访问PMa_SINGLE_STEP寄存器。当本地低权限用户通过VF尝试配置或测试单步时间戳时，驱动会访问无效虚拟地址00000000000080c0，触发内核分页请求错误，导致系统崩溃。该漏洞影响使用ENETC VF设备的Linux内核系统，CVSS评分5.5。攻击者需具备本地访问权限和低权限账户，无需用户交互即可通过触发网络接口的时间戳配置造成拒绝服务。"
published = "2025-04-01T16:15:19Z"
remediation = "立即将 Linux 内核升级至修复版本：5.3 及以上内核请升级至 6.6.83 或更高版本，6.7 至 6.12 系列升级至 6.12.18，6.13 系列升级至 6.13.6。可通过发行版官方包管理器（如 apt、yum、dnf）安装对应内核安全更新。如暂无法升级，应在 ENETC VF 上禁用 one-step 时间戳功能，避免触发空指针引用导致内核崩溃。可通过应用官方补丁 commit（1748531839298ab7be682155f6cd98ae04773e6a）临时修复。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel enetc 虚拟功能时间戳配置拒绝服务漏洞"
updated = "2026-06-17T08:44:33Z"

