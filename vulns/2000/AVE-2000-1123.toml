[basic]
description = "Network Associates（NAI）Sniffer Agent 3.0.10 存在登录请求处理缺陷，远程攻击者无需身份认证即可向目标系统发送大量登录请求，导致代理服务进程崩溃，造成拒绝服务。该漏洞影响 Sniffer Agent 3.0.10 版本，攻击者只需网络可达即可发起攻击，无需任何权限或用户交互，利用难度低。目前官方已发布相关安全公告，建议用户升级至修复版本或限制对 Sniffer Agent 管理端口的网络访问。"
published = "2001-01-09T00:00:00Z"
remediation = "升级 Sniffer Agent 至 3.0.10 以上版本（如 3.0.11 或更高），或在防火墙/主机上限制仅允许可信 IP 访问 Sniffer Agent 管理端口（默认 TCP 端口 9000），同时配置登录失败阈值策略，超过阈值自动临时封禁来源 IP。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Network Associates Sniffer Agent 3.0.10 Login 拒绝服务漏洞"
updated = "2001-01-09T00:00:00Z"

