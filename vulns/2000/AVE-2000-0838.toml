[basic]
description = "SGI IRIX 6.x 的 Performance Copilot 组件中的 Performance Metrics Collector Daemon (PMCD) 存在资源耗尽漏洞。远程攻击者无需身份认证即可向 PMCD 端口发送超长字符串，导致目标系统 CPU 和内存资源被大量消耗，最终造成拒绝服务。该漏洞影响 IRIX 6.3/6.4/6.5 等多个版本，CVSS 评分 5.0，危害等级中危。"
published = "2001-08-31T04:00:00.000"
remediation = "建议立即应用 SGI 于 2002 年 4 月发布的安全补丁（参见 advisory 20020407-01-I），升级 PMCD 组件至修复版本。如无法升级，可在防火墙上限制对 PMCD 端口（默认 4321/TCP）的访问，仅允许受信任的管理主机连接。由于 SGI IRIX 已停止维护，建议尽快迁移至受支持的操作系统平台。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "SGI IRIX Performance Copilot PMCD 拒绝服务漏洞"
updated = "2026-06-16T21:53:21.170"

