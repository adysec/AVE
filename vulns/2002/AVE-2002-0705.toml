[basic]
description = "Microsoft MSN Messenger 1.0 至 4.6 版本存在拒绝服务漏洞，远程攻击者可通过向目标发送包含十六进制编码空格（%20）的特制邀请请求，触发 Invitation-Cookie 字段解析错误导致服务崩溃。该漏洞影响所有启用消息服务交互的旧版 MSN Messenger 客户端，CVSS 评分 5.0，危害等级中等。攻击无需身份认证且攻击复杂度低，攻击者仅需构造恶意邀请数据包即可使目标客户端拒绝服务。微软后续版本已修复此问题。"
published = "2002-12-31T05:00:00Z"
remediation = "建议立即将 Microsoft MSN Messenger 升级至 5.0 或更高版本，以修复邀请请求处理中的拒绝服务漏洞。由于该软件版本过于陈旧且已停止维护，建议用户卸载旧版并迁移至现代的通信软件。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft MSN Messenger 拒绝服务漏洞"
updated = "2026-06-16T22:00:08Z"

