[basic]
description = "Progress Telerik UI for ASP.NET AJAX 的 RadAsyncUpload 组件存在 .NET 反序列化漏洞。攻击者需先利用 CVE-2017-11317 或 CVE-2017-11357 获取加密密钥，随后构造特制请求触发不安全反序列化，可在目标服务器上以应用权限执行任意代码。该漏洞影响 2019.3.1023 及之前版本，CVSS 评分 9.8，危害等级严重。2020.1.114 版本已通过默认安全配置修复此漏洞。"
published = "2019-12-11T13:15:11Z"
remediation = "立即升级 Telerik UI for ASP.NET AJAX 至 2020.1.114 或更高版本，该版本默认启用安全配置阻止反序列化攻击。如无法升级，在 2019.3.1023 中手动设置 RadAsyncUpload 的 `AsyncUploadConfigurationEncryption` 为 `true` 并更换加密密钥；同时修复 CVE-2017-11317 和 CVE-2017-11357 防止密钥泄露。在 Web.config 中禁用 `Telerik.AsyncUpload.ConfigurationEncryptionKey` 的硬编码密钥作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Progress Telerik UI for ASP.NET AJAX 反序列化远程代码执行漏洞"
updated = "2026-06-17T02:25:36Z"

