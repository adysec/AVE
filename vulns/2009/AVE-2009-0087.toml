[basic]
description = "Apple iPhone OS 3.1 之前版本（以及 iPod touch 上 iPhone OS 3.1.1 之前版本）的 Recovery Mode 恢复模式组件在命令解析过程中存在堆缓冲区溢出漏洞（CWE-119）。具有本地访问权限的已登录用户可利用此漏洞绕过设备的密码锁定保护，直接访问设备上的任意敏感数据。该漏洞影响早期 iPhone 与 iPod touch 设备，CVSS 评分为 7.2，危害等级高。"
published = "2009-09-10T21:30:01Z"
remediation = "升级到 iPhone OS 3.1 或更高版本（iPod touch 需升级至 3.1.1），该版本修复了 Recovery Mode 命令解析中的堆缓冲区溢出漏洞。如无法立即升级，应避免在 Recovery Mode 下执行未信任的命令，并限制设备物理访问。"
score = 7.2
severity = "HIGH"
sources = ["tenable"]
title = "Apple iPhone OS 恢复模式命令解析堆缓冲区溢出漏洞"
updated = "2026-06-16T23:10:14Z"

