[basic]
description = "TEMENOS T24 R15.01 版本的 WealthT24 模块中 GetImage Java Servlet 存在路径遍历漏洞。该漏洞源于登录页面的 downloadDocServer() JavaScript 函数在调用 GetImage 接口时，未对 docDownloadPath 和 uploadLocation 参数进行有效的路径过滤与校验。未经身份认证的远程攻击者无需登录即可直接向 /WealthT24/GetImage 接口发送特制请求，通过路径遍历技术读取服务器文件系统中的任意文件（如 /etc/passwd 或 Windows 配置文件），甚至可利用 SMB 协议回传攻击者控制的服务器以窃取 NTLM 哈希值，导致敏感信息泄露。CVSS 评分 7.5，危害等级高。"
published = "2019-12-09T17:15:11.850"
remediation = "联系TEMENOS厂商获取安全补丁，将T24 Channels升级至R15.01以上修复版本。如无法立即升级，在Web应用防火墙或反向代理层面添加规则，拦截对/WealthT24/GetImage接口的请求中docDownloadPath和uploadLocation参数包含路径遍历序列（如../）的恶意流量，并对该接口实施严格的输入白名单验证，仅允许访问指定目录下的文件。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "TEMENOS T24 Channels 路径遍历漏洞"
updated = "2026-06-17T02:18:02.837"

