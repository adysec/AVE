[basic]
description = "` tags.<value>Linux 内核 ksmbd 模块存在整数溢出漏洞（CWE-125），`dacloffset` 字段原被定义为有符号整型（int），在 `smb_check_perm_dacl()` 和 `smb_inherit_dacl()` 函数中被用于无检查的加法运算。未经身份认证的远程攻击者可通过发送特制 SMB 请求触发整数溢出，绕过边界检查导致越界内存访问，进而造成内核崩溃。该漏洞影响包含 ksmbd 模块的 Linux 内核版本，攻击向量为网络，攻击复杂度低，无需用户交互，CVSS 评分 8.8，危害等级高。"
published = "2025-04-16T15:15:56Z"
remediation = "升级 Linux 内核至已包含修复的版本，该漏洞修复补丁已将 ksmbd 模块中的 dacloffset 字段从 int 类型改为 unsigned int，并在 smb_check_perm_dacl() 和 smb_inherit_dacl() 函数中使用 check_add_overflow() 对 DACL 访问进行溢出验证。Ubuntu 24.04 LTS 用户应升级至内核 6.8.0-86.87 或更高版本，Ubuntu 22.04 LTS 用户需关注后续安全更新。如无法立即升级内核，可临时禁用 ksmbd 服务（执行 systemctl stop smbd nmbd 并执行 systemctl disable smbd nmbd 阻止开机自启），或通过防火墙限制 SMB 端口（TCP 139、445）的入站访问，仅允许受信任网络访问，以降低远程利用风险。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 ksmbd 整数溢出漏洞"
updated = "2026-07-30T06:22:05Z"

