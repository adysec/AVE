[basic]
description = "Ipswitch IMail 6.04 及更早版本的 Web 服务器组件存在目录遍历漏洞。远程攻击者无需身份认证即可通过向目标服务器发送包含 `../`（点点斜杠）序列的特制 HTTP 请求，突破文件访问限制，实现任意文件的读取与删除操作。该漏洞可导致敏感信息泄露（如配置文件、用户数据）或系统文件被恶意删除，影响服务器完整性与可用性。攻击条件简单，仅需目标开放 Web 服务端口即可远程利用。"
published = "2000-10-20T04:00:00.000"
remediation = "升级 Ipswitch IMail 至 6.05 或更高版本，该版本已修复 Web 服务器组件中的目录遍历漏洞。如无法升级，在 Web 服务器配置中禁用 ..（点点）路径解析，或部署 WAF 规则拦截包含 ../ 的 URL 请求作为临时缓解措施。"
score = 6.4
severity = "MEDIUM"
sources = ["epss"]
title = "Ipswitch IMail Web服务器目录遍历漏洞"
updated = "2026-06-16T21:52:27.943"

