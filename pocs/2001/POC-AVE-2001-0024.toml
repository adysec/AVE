[info]
author = "ave"
description = "BitchX IRC Client 1.0 c17 DNS缓冲区溢出漏洞验证，通过发送超长DNS主机名触发缓冲区溢出，导致拒绝服务或远程代码执行"
id = "POC-AVE-2001-0024"
name = "CVE-2001-0050 PoC"
severity = "critical"
tags = ["ave-2001-0024"]
vuln_id = [
    "CVE-2001-0050",
    "AVE-2001-0024",
]

[poc]
logic = "all"

[[poc.requests]]
dns_type = "A"
path = "{{Hostname}}"
protocol = "dns"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "NXDOMAIN",
    "SERVFAIL",
    "REFUSED",
    "timed out",
    "no answer",
]
