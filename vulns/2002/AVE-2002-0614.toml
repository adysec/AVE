[basic]
description = "Null HTTP Server 0.5.0 及更早版本存在基于堆的缓冲区溢出漏洞。攻击者无需身份认证即可通过向目标服务器发送特制的 HTTP 请求，在 Content-Length 头部字段填入负值来触发堆溢出，从而在服务器上执行任意代码。该漏洞影响运行 Null HTTP Server 0.5.0 及更早版本的系统，CVSS 评分为 7.5，危害等级为高危。"
published = "2003-04-02T05:00:00Z"
remediation = "立即升级 Null HTTP Server 至 0.5.1 版本（SourceForge 发布于 2002-09-22），该版本修复了 0.5.0 及之前版本中因 Content-Length 为负值导致的堆溢出漏洞。若无法立即升级，可在反向代理（如 Nginx/Apache）层配置请求过滤规则，拒绝 Content-Length 为负数的 HTTP 请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Null HTTPd 0.5 远程堆溢出漏洞"
updated = "2026-06-16T21:59:26Z"

