[basic]
description = "Aktivate 1.03 购物车系统的 catgy.cgi 脚本存在跨站脚本（XSS）漏洞，由于对 desc 参数缺乏充分的输入验证和输出编码，远程攻击者无需认证即可通过构造包含恶意 JavaScript 代码的 HTTP 请求，在受害者浏览器中执行任意脚本，可能导致会话 Cookie 窃取、页面内容篡改或钓鱼攻击。该漏洞影响 Aktivate 1.03 版本，CVSS 评分 5.0，攻击复杂度低，仅需网络访问即可利用。"
published = "2001-12-18T05:00:00Z"
remediation = """对 catgy.cgi 的 desc 参数进行严格的输入过滤和输出编码，过滤所有 HTML/JavaScript 特殊字符（如 < > " ' &），或直接删除 desc 参数中的脚本标签。由于 Aktivate 1.03 已停止维护且无官方补丁，建议立即迁移至仍在维护的购物车系统（如 Magento 或 WooCommerce），并在迁移完成前使用 Web 应用防火墙（WAF）拦截包含 <script> 等恶意标签的请求作为临时缓解措施。"""
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Aktivate Shopping Cart catgy.cgi 跨站脚本漏洞"
updated = "2026-06-16T21:55:49Z"

