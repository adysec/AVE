[basic]
description = "Apache 1.3.19 之前版本的默认安装中存在路径遍历漏洞。远程攻击者可通过向目标服务器发送包含大量连续斜杠（/）字符的特制 HTTP 请求，导致服务器在处理请求路径时错误地绕过 multiview 机制，直接列出目录文件列表而非返回 index.html 索引页面。该漏洞影响 mod_negotiation、mod_dir 和 mod_autoindex 三个模块，攻击者无需身份认证即可利用，导致敏感目录结构及文件信息泄露。CVSS 评分 5.0，危害等级中等。"
published = "2001-03-12T05:00:00Z"
remediation = "升级 Apache 至 1.3.19 或更高版本。Debian 用户可参考 DSA-067 安全公告安装更新，Mandrake 用户可参考 MDKSA-2001-077 获取补丁。如无法立即升级，在 httpd.conf 中移除 Options 指令中的 Indexes 参数，并确保 DirectoryIndex index.html 配置正确，同时禁用 mod_autoindex 模块以缓解目录列表泄露风险。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Apache HTTP Server 目录遍历漏洞"
updated = "2026-06-16T21:55:14Z"

