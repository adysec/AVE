[basic]
description = "Jackson-databind 在处理 Java Record 类型的反序列化时存在 @JsonIgnore 注解绕过漏洞。当 Record 类结合 PropertyNamingStrategy（属性命名策略）使用时，POJOPropertiesCollector._removeUnwantedIgnorals() 方法在 _renameUsing() 应用命名策略之前，先以原始隐式名称记录了被 @JsonIgnore 标记的组件。重命名后，_ignoredPropertyNames 仍仅持有重命名前的名称，导致 _ignorableProps 基于过期的键构建，使得重命名后的 JSON 键能够绕过 IgnorePropertiesUtil.shouldIgnore() 检查并被赋值给 Record 的构造参数。攻击者可利用此漏洞通过构造特制的 JSON 数据，将原本应被忽略的内部或敏感属性（如角色、权限标志等）注入到反序列化结果中，导致信息泄露或权限提升。该漏洞影响 jackson-databind 2.15.0 至 2.18.8、2.19.0 至 2.21.4 以及 3.0.0 至 3.1.4 版本，CVSS 评分 6.5，危害等级中危。已在 2.18.8、2.21.4 和 3.1.4 版本中修复。"
published = "2026-07-14T17:17:15.137"
remediation = "升级 jackson-databind 至修复版本：2.15.x 分支升级到 2.18.8 及以上，2.19.x 分支升级到 2.21.4 及以上，3.x 分支升级到 3.1.4 及以上。如无法立即升级，避免在 Java Record 上同时使用 @JsonIgnore 和 PropertyNamingStrategy，或改用普通 POJO 类替代 Record。"
score = 6.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "FasterXML jackson-databind Java Record @JsonIgnore 属性绕过漏洞"
updated = "2026-07-15T20:18:23.677"

