[basic]
description = "xtell xtelld 守护进程存在多个远程缓冲区溢出漏洞，攻击者可通过构造过长的 DNS 主机名（触发反向 DNS 查询）、过长的 AUTH 认证字符串或特制的 xtell 请求数据触发缓冲区溢出，导致远程任意代码执行。该漏洞影响 xtell 1.91.1 及更早版本，以及 2.7 版本之前的 2.x 版本。攻击者无需身份认证即可通过网络远程发送恶意数据包触发漏洞，攻击复杂度低，CVSS 评分 7.5（高危），成功利用可获得 xtelld 进程权限执行任意代码，影响系统机密性、完整性和可用性。建议升级至 xtell 2.7 或更高版本修复该漏洞。"
published = "2002-06-25T04:00:00Z"
remediation = "建议立即升级 xtell 到 2.7 或更高版本（1.x 分支无修复版本，需升级至 2.7+）。若暂时无法升级，建议在防火墙层面限制 xtell 服务端口（默认 4224/TCP）仅允许受信任 IP 访问，并禁用反向 DNS 解析功能以缓解主机名溢出风险。建议从官方源 https://www.chiark.greenend.org.uk/~ian/xtell/ 下载最新版本并重新编译安装。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "xtelld 公司 xtell 1.91.1/2.6.1 缓冲区溢出漏洞"
updated = "2026-06-16T21:57:14Z"

