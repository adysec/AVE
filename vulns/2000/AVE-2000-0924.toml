[basic]
description = "GNU ed 编辑器在 0.2-18.1 及更早版本中存在符号链接漏洞。本地攻击者可通过创建指向其他用户文件的符号链接，当特权进程或管理员使用 ed 编辑该符号链接时，实际操作将作用于目标文件，从而覆盖或篡改其他用户的文件内容。该漏洞利用条件为攻击者具备本地访问权限且目标文件系统允许符号链接创建，成功利用可导致文件内容被未授权修改，影响系统完整性。"
published = "2001-01-09T05:00:00Z"
remediation = "建议将 GNU ed 升级到 0.2-18.1 或更高版本，以修复由于符号链接攻击导致的文件覆盖漏洞。在无法立即升级的系统中，可通过限制对 ed 工具的执行权限或严格管控临时目录权限来降低风险。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "GNU ed 本地用户文件覆盖漏洞"
updated = "2026-06-16T21:53:13Z"

