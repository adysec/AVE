[basic]
description = "saposcol 是 SAP R/3 Web Application Server Demo 中的一个系统监控组件，该程序在执行 expand 程序时直接信任系统的 PATH 环境变量来确定可执行文件路径。攻击者作为本地用户可通过修改 PATH 环境变量，将其指向一个预先放置的木马 expand 程序，当 saposcol 以 root 权限执行 expand 时就会运行恶意代码，从而获取系统 root 权限并完全控制服务器。该漏洞影响 SAP R/3 Web Application Server Demo 1.5 之前的所有版本，攻击条件简单且无需身份认证，危害等级高。"
published = "2001-06-27T04:00:00Z"
remediation = "立即将 saposcol 升级至 1.5 或更高版本。如暂时无法升级，可在启动脚本中使用 expand 程序的绝对路径（如 /usr/bin/expand）替代 PATH 查找，并严格限制本地用户对 saposcol 配置文件和环境变量的修改权限，同时监控系统中 PATH 环境变量的异常变更。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "SAP R/3 Web Application Server Demo saposcol 本地权限提升漏洞"
updated = "2026-06-16T21:54:10Z"

