[basic]
description = 'IBM AIX 4.3.x 及更早版本中，/usr/bin/setsenv 命令存在缓冲区溢出漏洞。该漏洞源于 setsenv 在处理带有过长"x="参数的环境变量时未对输入长度进行充分边界检查，本地低权限用户可通过传入超长字符串触发堆栈溢出，覆盖返回地址并执行任意 shell 命令。受影响系统包括 IBM AIX 4.x 全系列版本，攻击者需具备目标主机的本地登录权限，通过构造恶意环境变量即可在 setuid 权限下获得 root 级别代码执行能力，危害等级为中等。'
published = "2001-01-09T05:00:00.000"
remediation = '立即应用 IBM 官方修复补丁：AIX 4.3.x 系统安装 APAR IY08812 对应的 PTF 补丁包，AIX 4.2.x 系统安装 APAR IY10721 对应的 PTF 补丁包，补丁下载地址为 http://techsupport.services.ibm.com/rs6k/fixes.html，也可通过 SMIT 工具执行 "smit update_all" 安装最新维护包以修复 /usr/bin/setsenv 的缓冲区溢出漏洞。作为临时缓解措施，若暂无法安装补丁，可执行 "chmod o-rwx /usr/bin/setsenv" 限制非授权用户执行 setsenv 命令，并定期审计系统日志排查本地提权行为。建议长期将 AIX 系统升级至 4.3.3 或更高受支持版本。'
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "IBM AIX 4.x setsenv 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:53:11.277"

