[basic]
description = "tags.<value>Microsoft Windows 2000 Telnet 服务存在拒绝服务漏洞，未经身份认证的远程攻击者可通过创建大量空闲 Telnet 会话阻止空闲会话超时机制，持续消耗目标系统连接资源与内存，导致服务不可用或系统响应缓慢。该漏洞影响 Windows 2000 系统默认启用的 Telnet 服务，CVSS 评分 5.0，危害等级中低危。攻击者无需身份验证或特殊权限即可利用该漏洞，通过批量建立并维持空闲会话的方式耗尽系统资源，造成拒绝服务。"
published = "2001-07-21T04:00:00Z"
remediation = "标签之间。<value>立即安装 Microsoft 2001 年 6 月安全更新 Q299553（MS01-031），或升级至 Windows 2000 Service Pack 3。如暂无法打补丁，可在服务管理器中禁用 Telnet 服务作为临时缓解措施，并在防火墙层面限制 TCP 23 端口的入站访问。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows 2000 Telnet 服务拒绝服务漏洞"
updated = "2026-06-16T21:54:08Z"

