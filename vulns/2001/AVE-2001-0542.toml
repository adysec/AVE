[basic]
description = "NetWin DMail 2.x 及 SurgeFTP 1.0/2.0 等产品使用的 NetWin 认证模块（NWAuth）2.0 和 3.0b 版本采用弱密码哈希算法，本地攻击者可利用该缺陷破解用户密码，或使用与正确密码具有相同哈希值的不同密码绕过认证。该漏洞影响范围包括 SurgeFTP、DMail 及其他集成 NWAuth 的软件，攻击者需具备本地访问权限，CVSS 评分 4.6，危害等级中危。"
published = "2001-07-20T04:00:00Z"
remediation = "建议立即升级 NetWin DMail 至最新版本（如仍受支持），或迁移至其他支持强密码哈希的 FTP/邮件服务软件。若无法升级，应严格限制本地用户对服务器的交互式登录权限，并对存储加密密码的 admin.dat 和 nwauth.clg 文件设置仅管理员可读（chmod 600），同时启用系统审计日志监控异常密码验证行为。"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "NetWin DMail/SurgeFTP NWAuth 弱密码加密漏洞"
updated = "2026-06-16T21:56:06Z"

