[basic]
description = 'News Desk 1.2 的 newsdesk.cgi 存在目录遍历漏洞，攻击者通过在 "t" 参数中插入 ".." 路径遍历序列，可绕过目录限制读取服务器上的任意文件。该漏洞无需身份认证即可远程利用，影响运行 News Desk 1.2 的 Web 服务器。攻击者可借此读取系统配置文件、源代码或其他敏感文件，导致信息泄露。CVSS 评分为 5.0，危害等级中等。'
published = "2001-03-26T05:00:00.000"
remediation = "修改 newsdesk.cgi 中的 open() 调用，启用 Perl 污点检查（taint checking）并对 URL 输入进行白名单过滤，仅允许字母数字和合法路径字符；若无源码访问权限，可在 Web 服务器层面限制对 newsdesk.cgi 的访问或禁用 CGI 执行权限。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "News Desk 1.2 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:53:55.667"

