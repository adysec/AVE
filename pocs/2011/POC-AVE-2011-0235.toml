[info]
author = "ave"
description = "通过构造特制 HTML 页面，利用 nsDOMAttribute 子节点删除时的释放后使用漏洞，触发对已释放内存的访问，结合堆喷射和 ROP 链实现远程代码执行。影响 Firefox 8/8.0.1/9/9.0.1 on Windows XP。"
id = "POC-AVE-2011-0235"
name = "Mozilla Firefox 8/9 AttributeChildRemoved Use-After-Free PoC"
severity = "critical"
tags = [
    "cve-2011-3659",
    "use-after-free",
    "firefox",
    "uaf",
]
vuln_id = [
    "CVE-2011-3659",
    "AVE-2011-0235",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "AttributeChildRemoved",
    "nsDOMAttribute",
]
