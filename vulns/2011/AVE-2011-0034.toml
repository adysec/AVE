[basic]
description = "Adobe Flash Player 10.2.152.26 之前版本存在内存破坏漏洞（CWE-119）。攻击者可通过构造特制的恶意 Flash 内容或网页，诱使用户在已安装受影响 Flash Player 的浏览器中打开，从而触发内存破坏。成功利用可导致任意代码执行或拒绝服务，造成机密性、完整性与可用性全面受损。该漏洞影响 Windows、macOS、Linux 及 Chrome 等环境中的旧版 Flash Player，CVSS 评分为 9.3，危害等级为严重。Adobe 已在 10.2.152.26 及后续版本中修复此问题。"
published = "2011-02-10T16:00:32Z"
remediation = "立即将 Adobe Flash Player 升级至 10.2.152.26 或更高版本；Windows/macOS 可通过 Adobe 官方安装包覆盖升级，Linux 使用发行版提供的 flash-player 安全更新包。无法立即升级时，在浏览器中禁用 Flash 插件、阻止加载 .swf 内容，或卸载 Flash Player；企业环境可通过组策略/应用白名单禁止 Flash 运行作为临时缓解。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏漏洞"
updated = "2026-06-16T23:27:38Z"

