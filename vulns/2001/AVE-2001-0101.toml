[basic]
description = 'tags.<value>SSH 1.2.27 至 1.2.30 版本中的 ssh-keygen 工具在使用 Secure-RPC 功能时存在弱加密漏洞。该工具为 SUN-DES-1 身份认证生成的"magic phrase"采用了可被破解的弱加密方式，本地攻击者可通过特定方法恢复其他用户生成的 magic phrase，进而利用该短语解密目标用户的私钥文件，导致身份认证信息泄露。该漏洞影响启用了 Secure-RPC 功能的 SSH 1.2.x 版本系统，攻击者需要具备本地系统访问权限，通过利用弱加密机制即可获取其他用户的 SSH 私钥，造成严重的身份凭证泄露风险。'
published = "2001-06-02T04:00:00Z"
remediation = "立即将 OpenSSH 升级至 1.2.31 或更高版本，该版本已彻底移除有缺陷的 Secure-RPC 支持。如使用 SSH Communications Security 商业版，请联系厂商获取安全补丁（https://www.ssh.com/products/ssh/patches/secureRPCvulnerability.html）。临时缓解措施：在 ssh_config 和 sshd_config 中禁用 Secure-RPC 相关功能，并重新生成所有用户的 SSH 密钥对，同时确保 ~/.ssh/ 目录权限设置为 700、私钥文件权限设置为 600。"
score = 3.6
severity = "LOW"
sources = ["epss"]
title = "OpenSSH 1.2.x Secure-RPC 弱加密身份认证漏洞"
updated = "2026-06-16T21:53:58Z"

