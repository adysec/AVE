[basic]
description = "WebKit 渲染引擎存在未明的内存破坏漏洞，属于缓冲区溢出类型。该漏洞影响 Apple iOS 5.1 之前的版本以及 iTunes 10.6 之前的版本。未经身份认证的远程攻击者可通过诱导受害者访问一个恶意构造的网站来触发该漏洞，利用方式为远程攻击者在网页中嵌入恶意代码，当用户在 Safari 浏览器中打开该页面时，WebKit 引擎在处理网页内容过程中发生内存损坏，可导致应用程序崩溃（拒绝服务）或在目标系统上执行任意代码。CVSS 评分 9.3，危害等级为高。"
published = "2012-03-08T22:55:02Z"
remediation = "立即将 Safari 升级至 5.1.4 或更高版本，iOS 升级至 5.1 或更高版本，iTunes 升级至 10.6 或更高版本，以修复 WebKit 内存破坏漏洞。如暂无法更新，应避免访问不可信网站，并在防火墙或代理层面过滤恶意网页内容作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存损坏远程代码执行漏洞"
updated = "2026-06-16T23:37:54Z"

