[basic]
description = "AxxonSoft Axxon Next 视频监控管理系统存在路径遍历漏洞。远程攻击者无需身份认证即可通过向目标系统发送特制的 HTTP 请求，在 URI 中使用 `/css/..%2f` 子串绕过路径限制，实现目录遍历。攻击者可利用该漏洞读取服务器上的任意敏感文件（如配置文件、系统文件等），导致敏感信息泄露。该漏洞影响 AxxonSoft Axxon Next 全版本，CVSS 评分 7.5，危害等级高。目前官方尚未发布修复补丁，建议通过 Web 应用防火墙（WAF）拦截包含 `..%2f` 的恶意请求进行缓解。"
published = "2018-02-27T21:29:00.313"
remediation = "升级 Axxon Next 至厂商发布的最新版本。如无法升级，在反向代理或 WAF 层面拦截包含 `/css/..%2f` 的 URI 请求，并限制对 Axxon Next 服务的网络访问范围，仅允许受信任 IP 连接。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "AxxonSoft Axxon Next 路径遍历漏洞"
updated = "2026-06-17T02:03:10.160"

