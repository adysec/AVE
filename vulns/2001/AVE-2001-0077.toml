[basic]
description = 'SEDUM HTTP Server 2.0 由 Guido Frassetto 开发，存在目录遍历漏洞。未经身份认证的远程攻击者可通过在 HTTP GET 请求中构造包含 "../" 或 ".../" 序列的特制 URL，绕过 Web 根目录访问限制，读取服务器上任意已知文件内容，导致敏感信息泄露。该漏洞影响运行在 Windows 平台上的 SEDUM HTTP Server 2.0 版本，攻击者无需登录即可利用，可获取配置文件、密码文件等敏感数据，CVSS 评分 5.0，危害等级中等。'
published = "2001-05-03T04:00:00Z"
remediation = "由于 SEDUM HTTP Server 2.0 已停止维护且无官方补丁，建议立即将其替换为现代 Web 服务器（如 Nginx、Apache HTTP Server 或 Microsoft IIS）。如确需临时继续使用，应在服务器前端部署反向代理并配置 URL 重写规则拦截所有包含 '../' 或 '.../' 序列的请求；同时将网站根目录设置在非系统分区，并严格限制 Web 服务器进程对根目录外文件的读取权限。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Guido Frassetto SEDUM HTTP Server 2.0 目录遍历漏洞"
updated = "2026-06-16T21:53:52Z"

