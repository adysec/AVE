[basic]
description = "Microsoft Excel 存在远程代码执行漏洞（CWE-122 堆缓冲区溢出），攻击者可通过诱导用户打开特制的 Excel 文件触发该漏洞，在目标系统上以当前用户权限执行任意代码。该漏洞影响 Microsoft Office 系列产品，CVSS 评分 7.8，危害等级高。攻击成功需要用户交互（打开恶意文件），无法远程直接利用。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:37Z"
remediation = "建议立即安装 Microsoft 2025 年 2 月安全更新：Excel 2016 升级至 16.0.5487.1000 及以上版本，Office Online Server 升级至 16.0.10416.20058 及以上版本，Mac 版 Office LTSC 升级至 16.94.25020927 及以上版本；Microsoft 365 订阅用户通过 Office 更新通道自动获取修复。如无法立即打补丁，建议配置组策略禁止从网络位置自动打开 Excel 文件，并启用受保护视图和文件阻止策略作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Excel 远程代码执行漏洞"
updated = "2026-06-17T08:43:15Z"

