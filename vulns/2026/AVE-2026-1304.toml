[basic]
description = "标签之间。<value>Socket.IO 是一款广泛用于实现实时双向通信的 JavaScript 框架。该漏洞（CWE-20）源于数据包处理逻辑中对输入验证的不足：攻击者可以发送特制的 Socket.IO 数据包，使服务器进入等待大量二进制附件到达的状态并将这些附件缓存在内存中。由于未对附件数量或大小进行限制，攻击者可通过持续发送此类恶意数据包耗尽服务器内存资源，导致服务拒绝。该漏洞影响 socket.io@4.x（低于 4.2.7）、socket.io@2.x（低于 3.4.5）以及 socket.io-client@2.x（低于 3.3.6）版本。攻击者无需任何认证即可远程利用此漏洞。建议用户升级至 4.2.7、3.4.5 或 3.3.6 版本进行修复。"
published = "2026-08-03T20:17:29Z"
remediation = "立即将 socket.io 升级至 4.2.7（4.x 版本）或 3.4.5（2.x 服务端），将 socket.io-client 升级至 4.2.7（4.x 版本）或 3.3.6（2.x 客户端）。执行 npm install socket.io@^4.2.7 socket.io-client@^4.2.7 或对应的 3.x 版本号完成修复后重启服务。由于不存在已知的非升级工作方式，建议尽快完成依赖更新。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Socket.IO 零附件内存耗尽拒绝服务漏洞"
updated = "2026-08-03T21:16:41Z"

