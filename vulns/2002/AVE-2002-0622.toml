[basic]
description = "tags.<value>HP TCP/IP Services for OpenVMS 的 UCX POP 服务器存在权限绕过漏洞，该服务器以 SYSPRV 和 BYPASS 高权限运行。攻击者可通过 -logfile 命令行选项覆盖文件系统权限，从而截断任意文件。本地用户无需认证即可利用此漏洞修改或破坏目标系统上的关键文件，影响 OpenVMS 4.2 至 5.3 版本。CVSS 评分为 4.6，危害等级中等。"
published = "2003-04-02T05:00:00.000"
remediation = "建议将 UCX POP 服务器的运行权限从 SYSPRV 和 BYPASS 降低为最低必要权限，防止其绕过文件系统访问控制；或升级 TCP/IP 服务组件至 HP 发布的最新安全版本，以限制 -logfile 参数对敏感文件的非法访问。"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "HP OpenVMS TCP/IP服务 UCX POP服务器 任意文件修改漏洞"
updated = "2026-06-16T21:59:28.137"

