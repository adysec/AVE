[basic]
description = 'slocate 2.6 及可能受影响的其他版本在 main.c 处理用户提供的数据库文件时存在堆缓冲区溢出漏洞。slocate 是一个用于快速文件定位的 Linux 工具，它维护一个文件路径数据库供快速检索。攻击者通过向目标系统提供特制的 slocate 数据库文件，可使程序在处理时产生负的"pathlen"值，进而触发堆溢出，实现本地权限提升。该漏洞仅需本地访问权限即可利用，无需网络访问或用户交互。攻击者成功利用后可获得与 slocate 相同或更高的执行权限，从而进一步控制系统。Ubuntu、Red Hat 等主流 Linux 发行版均受此漏洞影响，Ubuntu 将漏洞优先级评定为中等，Red Hat 评级为 moderate。该漏洞的 CVSS 评分为 4.6，公开利用代码已在 ExploitDB（EDB-ID: 23228）发布。建议用户尽快将 slocate 升级到已修复此漏洞的版本（如 3.1 及以上版本），并避免使用来源不明的 slocate 数据库文件。'
published = "2003-11-17T05:00:00Z"
remediation = "建议将系统上的 slocate 软件包升级至 2.7 或更高版本。Debian/Ubuntu 系统可通过执行 apt-get install --only-upgrade slocate 升级至 Debian 安全公告 DSA-428 或 Ubuntu 3.1-1ubuntu1 及后续修复版本；Red Hat/Fedora 系统应安装 RHSA-2004-040 或 RHSA-2004-041 发布的更新补丁。如短期内无法升级，可通过 chmod 600 限制 slocate 数据库文件的访问权限，仅允许 root 用户读写，降低本地用户篡改数据库文件的风险。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "SLocate 2.6 堆缓冲区溢出漏洞"
updated = "2026-06-16T22:03:04Z"

