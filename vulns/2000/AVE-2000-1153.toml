[basic]
description = "CVE-2000-1222是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2000-12-10T05:00:00Z"
remediation = "升级 AIX System Backup & Recovery 的 sysback.rte 软件包至 4.2.1.13 或更高版本，可通过执行 `lslpp -l sysback.rte` 检查当前版本，低于 4.2.1.13 则联系 IBM Support Center 获取最新补丁。如无法立即打补丁，可在允许操作的范围内移除 sysback 的 setuid root 权限作为临时缓解措施。"
score = 7.2
