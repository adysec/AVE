[info]
author = "AVE"
description = "检测 Lotus Domino 5.0.8 服务器默认配置是否在 HTTP 响应头中泄露系统版本、操作系统及构建日期等敏感信息。远程攻击者无需认证即可通过正常 HTTP 请求获取这些信息。"
id = "POC-AVE-2000-1150"
name = "Lotus Domino 5.0.8 HTTP Header Information Disclosure PoC"
severity = "medium"
tags = ["ave-2000-1150"]
vuln_id = [
    "CVE-2000-1215",
    "AVE-2000-1150",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = [
    "Lotus-Domino",
    "Server: Lotus",
    "//Lotus Domino",
]
