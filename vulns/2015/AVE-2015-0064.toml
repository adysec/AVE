[basic]
description = "WordPress NewStatPress 插件 1.0.5 之前版本中存在反射型跨站脚本漏洞。该漏洞位于 includes/nsp_search.php 文件的第 28 行和第 31 行，程序直接从 $_GET 参数中获取数据并输出到页面，未进行任何过滤或转义处理。虽然 WordPress 会自动对引号内的输出进行转义，但此处输出位于引号之外，导致攻击者可以注入任意 HTML 和 JavaScript 代码。攻击者需要诱使已登录的管理员用户访问特制的 URL，通过 groupby1 参数注入恶意 payload，从而在管理后台上下文中执行任意脚本代码，可能导致会话劫持、页面篡改或敏感信息窃取。该漏洞 CVSS 评分 6.1，危害等级中危，建议升级至 1.0.6 或更高版本。"
published = "2019-08-14T15:15:11Z"
remediation = "将 WordPress newstatpress 插件升级到 1.0.5 或更高版本。如无法立即升级，可在 WordPress 后台禁用 newstatpress 插件，并启用 WordPress 内置的安全插件（如 Wordfence）对输入输出进行 XSS 过滤防护。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress newstatpress插件跨站脚本漏洞"
updated = "2026-06-17T00:36:16Z"

