[basic]
description = "WircSrv IRC Server 5.07s 存在拒绝服务漏洞。远程攻击者无需身份认证，通过向服务器端口发送超长字符串，可触发缓冲区异常导致 IRC 服务进程崩溃，造成拒绝服务。该漏洞影响 WircSrv IRC Server 5.07s 版本，CVSS 评分 5.0，危害等级中等。由于该产品已停止维护，建议用户迁移至其他活跃维护的 IRC 服务器软件。"
published = "2000-07-10T04:00:00Z"
remediation = "WircSrv IRC Server 5.07s 已停止维护，官方不再发布补丁。建议立即迁移至活跃维护的 IRC 服务器软件（如 UnrealIRCd 6.x 或 InspIRCd 3.x）。若无法迁移，可在防火墙或反向代理层面限制单连接最大输入长度（如 iptables 配合 string 模块过滤超长请求），并在服务端口前部署 IPS 规则拦截异常长度数据包。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "WircSrv IRC Server 5.07s 拒绝服务漏洞"
updated = "2026-06-16T21:52:12Z"

