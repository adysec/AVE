remediation = "将受影响的 VMware vCenter Server 6.7（嵌入式或外部 Platform Services Controller）升级至 6.7 Update 3f (6.7u3f) 版本。升级前请参阅 VMware KB78543 确认当前部署是否从旧版本（6.0 或 6.5）升级而来，全新安装的 6.7 不受此漏洞影响。vCenter Server 7.0 不受影响，无需操作。升级完成后重启 vmdir 服务以确保补丁生效。"
