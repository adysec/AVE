[basic]
description = "WebKit 是 Apple iOS 和 Safari 浏览器中的网页渲染引擎，该引擎被披露存在内存破坏漏洞。未经身份认证的远程攻击者可构造包含恶意代码的网页，当用户使用受影响版本的 Safari 浏览器访问该网页时，将触发 WebKit 内存损坏问题，导致应用程序崩溃或远程执行任意代码。该漏洞影响 Apple iOS 6.0 及更早版本、Safari 6.0.1 及更早版本以及 iTunes 10.7 之前版本。攻击成功需满足的条件是用户主动访问攻击者控制的恶意网站，攻击者可通过网络钓鱼、邮件链接或注入脚本等方式诱导用户点击恶意网页，进而实施代码执行或拒绝服务攻击。"
published = "2012-09-13T10:30:19.527"
remediation = "立即将 Apple iOS 升级至 6.0.1 或更高版本，同时将 Safari 浏览器升级至 6.0.1 及以上版本、iTunes 升级至 10.7 或更高版本，以修复 WebKit 内存破坏漏洞。对于暂无法升级的设备，应通过配置防火墙或内容过滤网关拦截恶意网站访问，避免访问不可信的网页链接，作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple iOS WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:37.183"

