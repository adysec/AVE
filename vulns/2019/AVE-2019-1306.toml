[basic]
description = "Ruby on Rails 框架的 Action View 组件存在文件内容泄露漏洞，未经身份认证的远程攻击者可通过在 HTTP 请求的 Accept 头中注入特制路径，使服务器返回目标文件系统上的任意文件内容。该漏洞影响 Rails 4.2.x 早于 4.2.11.1、5.0.x 早于 5.0.7.2、5.1.x 早于 5.1.6.2 及 5.2.x 早于 5.2.2.1 的版本。攻击者仅需向目标站点发送包含目录遍历序列（如 ../../../../etc/passwd）的恶意 Accept 头即可触发，无需认证且攻击条件简单，可能导致敏感配置文件、凭证等敏感信息泄露。"
published = "2019-03-27T14:29:01Z"
remediation = "立即升级 Rails 至修复版本：5.2.2.1、5.1.6.2、5.0.7.2 或 4.2.11.1（根据当前所用分支选择对应版本），执行 `bundle update actionpack` 或修改 Gemfile 锁定版本后重新部署。若暂时无法升级，可在 Nginx/Apache 反向代理层添加规则，拒绝包含 `{{`、`{%` 等模板语法及异常换行符的 Accept 请求头，或通过 ModSecurity/WAF 拦截此类请求，以临时缓解文件泄露风险。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Ruby on Rails Action View 任意文件读取漏洞"
updated = "2026-06-17T02:37:39Z"

