[basic]
description = "Linux 内核 PPS（Pulse Per Second，脉冲每秒）子系统中存在释放后使用（Use-After-Free）漏洞。由于在 PPS 设备操作过程中对并发访问的处理不当，当多个线程同时访问或释放 PPS 设备时，可能导致已释放的内存被继续使用，进而引发内核崩溃或权限提升。本地攻击者可通过特制的系统调用序列触发此漏洞，实现对受影响系统的拒绝服务或潜在提权攻击。该漏洞影响多个 Linux 发行版，包括 SUSE Linux Enterprise 15、Ubuntu 18.04/22.04 LTS、Debian 11、Amazon Linux 及 EulerOS 等。各发行版已发布安全更新修复此漏洞，建议用户及时升级内核至修复版本。"
published = "2025-02-27T00:00:00Z"
remediation = "建议立即升级 Linux 内核至以下修复版本：5.4.291+、5.10.235+、5.15.179+、6.1.129+、6.6.76+、6.12.13+ 或 6.13.2+。各发行版用户请参照对应安全公告安装更新：Debian 用户参考 DLA-4102-1/DLA-4178-1，Ubuntu 用户参考 USN-7540-1/USN-7511-1，SUSE 用户参考 SUSE-SU-2025:0847-1，Amazon Linux 用户参考 ALAS2KERNEL-5.10-2025-088。如无法立即升级，可通过限制本地用户对 PPS 设备的访问权限作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 PPS 子系统释放后使用漏洞"
updated = "2025-02-27T00:00:00Z"

