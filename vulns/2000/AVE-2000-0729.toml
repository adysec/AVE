[basic]
description = "OpenBSD 2.x 系统中的 fstat 程序存在格式字符串漏洞，由于程序在处理 PWD 环境变量时未正确过滤用户输入，导致格式字符串说明符（如 %n、%s）被直接传递给 printf 类函数。本地攻击者可通过设置特制的 PWD 环境变量触发该漏洞，利用格式字符串写入任意内存地址，从而将权限提升至 root。该漏洞影响 OpenBSD 2.x 及可能其他基于 BSD 的操作系统，CVSS 评分 7.2，危害等级高。攻击者需具备本地系统访问权限，无需用户交互即可完成利用。"
published = "2000-12-19T05:00:00Z"
remediation = "升级 OpenBSD 至 2.8 或更高版本，该漏洞已在 OpenBSD 2.8 发布时修复。如无法升级，可移除 fstat 的 setuid 权限（chmod u-s /usr/bin/fstat）以消除本地提权风险，或限制可访问 fstat 的用户组。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "OpenBSD fstat 格式字符串漏洞"
updated = "2026-06-16T21:52:55Z"

