[basic]
description = "IBM DB2 Universal Database 6.1 版本存在 SQL 拒绝服务漏洞，攻击者可通过向数据库发送构造的恶意 SQL 查询触发该漏洞，导致数据库服务崩溃或不可用。该漏洞影响运行 IBM DB2 Universal Database 6.1 的 Windows NT 6.1/7.1 系统。本地攻击者无需身份认证即可利用此漏洞，通过发送特制的畸形查询语句使数据库进程异常终止，造成服务拒绝。CVSS 评分为 2.1，危害等级较低。"
published = "2001-02-16T05:00:00.000"
remediation = "建议立即升级 IBM DB2 Universal Database 至更高版本或安装厂商发布的最新补丁包（Fix Pack）以修复 SQL 解析缺陷。若无法立即升级，应严格限制数据库访问权限，禁止非受信用户执行复杂或自定义的 SQL 查询，以缓解拒绝服务攻击风险。"
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "IBM DB2 Universal Database Windows NT SQL 拒绝服务漏洞"
updated = "2026-06-16T21:53:33.917"

