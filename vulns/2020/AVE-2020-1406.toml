[basic]
description = "tags.<value>Cisco AnyConnect Secure Mobility Client for Windows 的进程间通信（IPC）通道存在 DLL 劫持漏洞。该漏洞源于应用程序在运行时加载资源时缺乏充分验证，导致搜索路径不受控制。具有 Windows 系统有效凭证的本地认证攻击者可通过向 AnyConnect 进程发送特制的 IPC 消息来触发 DLL 劫持，从而在受影响机器上以 SYSTEM 权限执行任意代码。该漏洞影响 Windows 平台上的 Cisco AnyConnect Secure Mobility Client 4.9.00086 之前的版本，CVSS 评分为 7.8（高危）。Cisco 已在 4.9.00086 版本中修复此漏洞，CISA 已将其列入已知被利用漏洞目录。"
published = "2020-08-17T18:15:12.947"
remediation = "将 Cisco AnyConnect Secure Mobility Client for Windows 升级至 4.9.00086 或更高版本。访问 Cisco Software Center（software.cisco.com），依次选择 Security > VPN and Endpoint Security Clients > Cisco VPN Clients > AnyConnect Secure Mobility Client > AnyConnect Secure Mobility Client v4.x 下载修复版本并安装。该漏洞无临时缓解措施，必须通过版本升级消除风险。升级前请确认设备满足新版本的硬件和内存要求，如无法通过软件中心获取升级文件，请联系 Cisco TAC（https://www.cisco.com/c/en/us/support/web/tsd-cisco-worldwide-contacts.html）并提供产品序列号及本公告链接申请免费升级。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Cisco AnyConnect Secure Mobility Client for Windows DLL 劫持漏洞"
updated = "2026-06-17T03:18:16.097"

