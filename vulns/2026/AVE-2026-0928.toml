[basic]
description = "MCP Ruby SDK（mcp gem）的 StreamableHTTPTransport 在处理 HTTP 请求时未验证 Host 和 Origin 请求头，存在 DNS 重绑定漏洞。攻击者可通过诱导用户访问恶意网页，利用 DNS 重绑定技术将域名解析到本地回环地址（127.0.0.1），从而绕过同源策略访问受害者本地运行的 MCP 服务器。成功利用后，攻击者可枚举服务器暴露的工具列表并调用任意工具，窃取文件、密钥、命令输出等敏感数据。该漏洞影响 mcp gem 0.23.0 之前的所有版本，CVSS 评分 6.9，危害等级中危。官方已在 0.23.0 版本中通过添加 Host/Origin 白名单机制修复此漏洞。"
published = "2026-07-29T20:17:10.630"
remediation = "立即将 mcp gem 升级至 0.23.0 或以上版本（`gem install mcp -v '>= 0.23.0'`），该版本在 StreamableHTTPTransport 中新增了 Host/Origin 白名单校验，默认仅允许回环地址访问。如无法立即升级，可在应用层添加 Rack 中间件对 HTTP Host 和 Origin 头进行白名单校验，拒绝非 localhost 来源的请求。"
score = 6.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "MCP Ruby SDK DNS重绑定漏洞"
updated = "2026-07-30T19:30:33.710"

