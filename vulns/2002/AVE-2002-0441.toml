[basic]
description = "GCC（GNU Compiler Collection）4.8.0 之前版本中的 `new[]` 运算符存在整数溢出漏洞（CWE-190）。当处理大型数组分配时，`new[]` 运算符在计算所需内存大小时未正确检查整数溢出，导致分配的内存空间小于预期，进而引发堆缓冲区溢出。本地攻击者可通过编译并运行特制的 C++ 程序触发该漏洞，造成程序崩溃或任意代码执行。该漏洞影响所有 GCC 4.8.0 之前版本，CVSS 评分 7.8，危害等级高。"
published = "2019-10-23T18:15:11Z"
remediation = "升级 GCC 至 4.8.0 或更高版本，该版本修复了 new[] 运算符中的整数溢出漏洞。对于无法立即升级编译器的系统，可考虑使用其他已修复的编译器版本（如 Clang）进行代码编译作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["redhat"]
title = "GNU GCC 整数溢出漏洞"
updated = "2026-06-16T22:01:18Z"

