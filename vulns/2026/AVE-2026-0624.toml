[basic]
description = "Pheditor 是一款单文件 PHP 编辑器与文件管理器，其 2.0.1 至 2.0.6 之前版本中的终端功能存在不完整的命令注入漏洞。该漏洞源于对用户输入命令的清理黑名单不完整——仅过滤了 &、;、|| 和 $ 字符，但未过滤 |（单管道）、`（反引号）和 0x0A（换行符）。已认证且拥有终端权限（默认开启）的攻击者可通过在允许的命令后附加管道符、反引号替换或换行符注入，绕过 TERMINAL_COMMANDS 白名单限制，执行任意操作系统命令。结合默认密码 admin，未授权攻击者也可利用此漏洞实现远程代码执行，完全控制 Web 服务器，造成机密性、完整性和可用性全面丧失。"
published = "2026-07-27T18:16:56Z"
remediation = "立即升级 Pheditor 至 2.0.6 或更高版本，该版本已修复终端功能中管道符、反引号和换行符绕过黑名单的问题。如无法立即升级，可临时禁用终端功能（移除终端权限），或在 Web 服务器层面限制对 pheditor.php 的访问。同时修改默认管理员密码，防止未授权用户利用终端功能。建议使用 `proc_open()` 替代 `shell_exec()` 并严格校验命令参数。"
score = 8.8
severity = "HIGH"
sources = ["ghsa"]
title = "Pheditor Pheditor 终端功能命令注入漏洞"
updated = "2026-07-27T20:32:11Z"

