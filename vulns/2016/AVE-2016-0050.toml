[basic]
description = "WordPress Newspaper 主题（tagDiv 主题）6.7.2 之前版本中存在权限管理不当漏洞，其 `td_ajax_update_panel` AJAX 处理函数未对用户身份进行有效验证，导致未经身份认证的远程攻击者可直接向该接口发送特制请求，修改主题面板中的任意选项配置，包括插入恶意 JavaScript 代码或修改站点关键设置。攻击者无需任何权限，仅需目标站点安装并启用受影响版本的主题即可实施攻击，可能导致完全接管网站控制权。CVSS 评分 9.8，危害等级严重。"
published = "2019-09-16T17:15:10Z"
remediation = "立即将 WordPress newspaper 主题升级至 6.7.2 或更高版本。该漏洞源于 td_ajax_update_panel 函数缺乏权限检查，允许未认证攻击者远程执行任意代码。升级后请清除 WordPress 缓存并验证后台面板功能正常。如无法立即升级，可临时禁用 newspaper 主题或通过 Web 应用防火墙（WAF）拦截对 /wp-admin/admin-ajax.php 中 td_ajax_update_panel 动作的未授权请求作为缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress newspaper theme 权限访问控制缺失漏洞"
updated = "2026-06-17T00:40:43Z"

