[basic]
description = "Infopulse GateKeeper 3.5 及更早版本存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向 GateKeeper 服务发送超长字符串触发缓冲区溢出，导致任意命令执行。该漏洞影响 GateKeeper 3.5 及之前版本，CVSS 评分 7.5，危害等级高。攻击者利用此漏洞可完全控制目标系统，目前已有公开的远程利用代码。"
published = "2000-07-13T04:00:00.000"
remediation = "建议立即升级 Infopulse GateKeeper 至 3.5 以上版本或升级到最新版本 4.0 以上，官方已在后续版本修复该缓冲区溢出漏洞。如暂时无法升级，建议在防火墙层面限制 GateKeeper 服务端口（默认 TCP 3128）仅允许受信任 IP 访问，或在防火墙层面禁用该服务端口作为临时缓解措施。建议联系厂商 Infopulse 获取官方补丁补丁包进行升级修复。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Infopulse GateKeeper 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:14.593"

