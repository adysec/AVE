[info]
author = "ave"
description = "验证目标是否包含可触发浏览器 JavaScript 解释器拒绝服务的恶意内容，通过检测响应中是否存在无限递归的 location.replace/location.href 调用"
id = "POC-AVE-2002-0307"
name = "CVE-2002-0461 PoC"
severity = "medium"
tags = ["ave-2002-0307"]
vuln_id = [
    "CVE-2002-0461",
    "AVE-2002-0307",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "crashme",
    "location.replace(url)",
]
