[basic]
description = "Apple多款产品Kernel组件存在内存管理错误漏洞，由于内核内存处理不当，攻击者可利用该漏洞以内核权限执行任意代码。此漏洞影响iOS 13.5.1之前版本、iPadOS 13.5.1之前版本、macOS Catalina 10.15.5之前版本、tvOS 13.4.6之前版本及watchOS 6.2.6之前版本。本地攻击者无需用户交互即可触发该漏洞，Apple已在后续更新中修复此问题。"
published = "2020-06-05T15:15:11.097"
remediation = "立即将设备操作系统升级至iOS 13.5.1、iPadOS 13.5.1、macOS Catalina 10.15.5补充更新、tvOS 13.4.6或watchOS 6.2.6及以上版本。对于无法立即升级的macOS用户，可通过系统偏好设置中的安全与隐私功能限制内核扩展加载作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Apple 多款产品 Kernel 内存资源管理错误漏洞"
updated = "2026-06-17T03:28:41.790"

