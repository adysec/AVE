[basic]
description = "RealPlayer SMIL 解析组件存在堆缓冲区溢漏洞。攻击者可通过精心构造的 SMIL 文件向目标发送控制字符串长度的数据，从而在 smlrender.dll 中的 smlpkt.cpp 函数触发内存溢出。该漏洞影响 RealPlayer 10、10.5、11 系列及 Helix Player 等多个版本及平台，允许远程攻击者在未授权情况下执行任意代码。攻击条件为无需身份验证，攻击向量为网络，影响面涵盖多种操作系统及 Real 产品系列，安全等级极高。"
published = "2010-01-25T19:30:01Z"
remediation = "建议立即升级至 RealPlayer SP 1.0.5 或更高版本（RealPlayer 11.0.5+、RealPlayer Enterprise 最新版、Mac RealPlayer 11.1+、Linux RealPlayer 11.1+、Helix Player 11.1+），可通过 RealNetworks 官网或自动更新功能获取。若暂时无法升级，建议卸载 RealPlayer 或在防火墙/终端防护层面禁止打开不可信的 SMIL 文件（.smil、.smi 后缀），并禁止自动打开来自不可信来源的流媒体链接作为临时缓解措施。建议卸载不再使用的 RealPlayer/Helix Player 以彻底消除攻击面。升级后建议重启浏览器及相关播放器进程使补丁生效。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer SMIL文件解析远程代码执行漏洞"
updated = "2026-06-16T23:13:20Z"

