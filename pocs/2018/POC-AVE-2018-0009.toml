[info]
author = "AVE"
description = "检测目标是否为受影响的 Cisco Catalyst 交换机，通过 HTTP 管理面识别设备型号。该漏洞源于 Cisco IOS 的 SNMP ciscoFlashMIB 实现中处理特制 SNMP GET 请求时存在缺陷，未经认证的攻击者可发送特定 SNMPv2 GET 请求（OID 1.3.6.1.4.1.9.9.10.1.1.1.0）触发 SYS-3-CPUHOG 错误导致设备重载。"
id = "POC-AVE-2018-0009"
name = "Cisco Catalyst IOS SNMP ciscoFlashMIB DoS PoC"
severity = "high"
tags = [
    "cve-2018-0161",
    "cisco",
    "snmp",
    "dos",
]
vuln_id = [
    "CVE-2018-0161",
    "AVE-2018-0009",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Catalyst",
    "Cisco IOS",
    "Cisco Systems",
]
