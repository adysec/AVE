[basic]
description = "tags.<value>FactoSystem CMS 存在多个 SQL 注入漏洞，未经身份认证的远程攻击者可通过向 author.asp 的 authornumber 参数、discuss.asp 的 discussblurbid 参数以及 holdcomment.asp 的 name 和 email 参数发送特制的 SQL 注入语句，绕过应用程序的输入过滤机制，直接对后端数据库执行任意 SQL 命令。该漏洞影响 FactoSystem Weblog 0.9、1.0 及 1.1 版本，攻击者无需任何身份认证即可利用，可获取或篡改数据库中的敏感信息。CVSS 评分为 7.5，危害等级为高危。"
published = "2003-04-02T05:00:00.000"
remediation = "建议立即将 FactoSystem CMS 升级至最新可用版本（如 1.1 之后的补丁版本），若厂商已停止维护则迁移至已停止维护的替代方案。对 author.asp、discuss.asp、holdcomment.asp 中 authornumber、discussblurbid、name、email 等参数实施输入过滤，剔除单引号、分号、注释符等 SQL 特殊字符。在 Web 服务器前端部署 WAF 规则，拦截包含 SQL 注入特征（如 AND 1=1、UNION SELECT、UPDATE SET、FLUSH PRIVILEGES）的 HTTP 请求。临时缓解措施：在 IIS 或反向代理层对 /author.asp、/discuss.asp、/holdcomment.asp 路径实施 IP 白名单访问控制，仅允许可信管理 IP 访问。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "FactoSystem CMS 多处SQL注入漏洞"
