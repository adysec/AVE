[info]
author = "AVE"
description = "检测目标是否使用受影响版本的 Mistune 解析器处理包含大量连续闭合标记对（如 ~~x~~）的 Markdown 输入，导致 CPU 耗尽拒绝服务"
id = "POC-AVE-2026-0863"
name = "CVE-2026-59922 PoC"
severity = "high"
tags = ["cve-2026-59922"]
vuln_id = [
    "CVE-2026-59922",
    "AVE-2026-0863",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}"
protocol = "http"

[poc.requests.body]
type = "raw"

[poc.requests.headers]
Content-Type = "text/plain"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "timeout",
    "error",
]
