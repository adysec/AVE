[basic]
description = "Windows 内核模式驱动 win32kfull.sys 中的 bFill 函数存在池溢出漏洞，由于对用户态传入的对象大小验证不充分，导致内核池内存越界写入。本地低权限攻击者可通过构造特制应用程序触发该漏洞，在内核上下文中执行任意代码，从而获取系统最高权限。该漏洞影响 Windows Vista SP2 至 Windows 10 1607 等多个版本，已有公开利用代码，危害等级高。Microsoft 已在 2016 年 8 月安全更新中修复此漏洞。"
published = "2016-08-09T21:59:16Z"
remediation = "安装 Microsoft 2016 年 8 月安全更新 MS16-098 (KB3178539)，该更新修复了 win32k.sys 内核驱动中的池溢出漏洞。通过 Windows Update 自动更新或从 Microsoft 更新目录手动下载安装。临时缓解措施：限制非授权用户本地登录权限，并启用 Windows Defender 应用程序控制策略阻止已知利用载荷运行。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Win32k 权限提升漏洞"
updated = "2026-06-17T00:45:28Z"

