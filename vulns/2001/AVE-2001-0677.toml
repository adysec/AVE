[basic]
description = 'Microsoft Index Server 2.0（Windows NT 4.0 附带）及 Windows 2000 的索引服务（Indexing Service）存在信息泄露漏洞。未经身份认证的远程攻击者可通过向目标服务器发送特制的、格式异常的搜索请求（即"畸形命中高亮"请求变体），诱使索引服务错误解析查询参数，从而读取服务器端包含（SSI）文件内容。该漏洞影响的系统包括 Windows NT 4.0 和 Windows 2000，攻击者无需任何凭据即可在网络上发起利用，成功后可获取服务器敏感配置信息或文件内容，对系统机密性造成部分损害。CVSS v2 向量为 AV:N/AC:L/Au:N/C:P/I:N/A:N，表明攻击门槛低、无需认证、通过网络即可远程利用，主要风险为信息泄露。Microsoft 已针对该漏洞发布安全补丁，建议受影响用户及时安装系统更新，并通过访问控制列表限制对索引服务的未授权访问。'
published = "2001-06-27T04:00:00Z"
remediation = "立即安装微软 MS01-025 安全公告补丁 Q296185。对于 Windows NT 4.0 上的 Index Server 2.0，需先安装 Service Pack 6a 及 Windows NT 4.0 Option Pack，再安装对应补丁；对于 Windows 2000 上的 Indexing Service，需安装 Service Pack 1 或更高版本后应用补丁。如无法立即打补丁，可通过 Internet Services Manager 删除 .idq 和 .ida 文件的脚本映射作为临时缓解措施，但添加或删除系统组件时映射可能被重新建立，因此补丁安装为最终解决方案。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Index Server 信息泄露漏洞"
updated = "2026-06-16T21:53:57Z"

