[basic]
description = "OpenBSD 的 photurisd 守护进程存在格式化字符串漏洞，本地攻击者可通过在配置文件目录名中插入格式化字符（如 %n、%s 等）触发该漏洞，导致任意代码执行。该漏洞影响 OpenBSD 系统，攻击者需拥有本地访问权限才能利用，CVSS 评分 4.6，危害等级中危。建议升级到修复版本或限制本地用户对配置文件的写入权限。"
published = "2000-12-11T05:00:00Z"
remediation = "升级 OpenBSD 至 2.9 或更高版本，该版本已修复 photurisd 的格式化字符串漏洞。如无法升级，可下载 OpenBSD 官方提供的 photurisd 源码补丁并重新编译安装。临时缓解措施：在 /etc/rc.conf 中禁用 photurisd 服务（设置 photurisd_flags=NO），或移除 photurisd 可执行文件的 setuid 权限（chmod 755 /usr/sbin/photurisd）。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "OpenBSD photurisd 格式化字符串漏洞"
updated = "2026-06-16T21:52:57Z"

