[basic]
description = "React Server Functions 组件（react-server-dom-webpack、react-server-dom-parcel、react-server-dom-turbopack）存在拒绝服务漏洞，未经身份认证的远程攻击者可通过向服务器函数端点发送特制的 HTTP 请求触发该漏洞，导致目标系统出现内存溢出异常或 CPU 资源过度消耗，造成服务不可用。该漏洞影响 19.0.0 至 19.0.7、19.1.0 至 19.1.8 及 19.2.0 至 19.2.7 版本，CVSS 评分 7.5，危害等级高危。官方已在 19.0.8、19.1.9 及 19.2.8 版本中修复此漏洞。"
published = "2026-07-21T17:17:08Z"
remediation = "立即将 react-server-dom-webpack、react-server-dom-parcel、react-server-dom-turbopack 升级至修复版本：19.0.x 系列升级到 19.0.8，19.1.x 系列升级到 19.1.9，19.2.x 系列升级到 19.2.8。如应用未使用 React Server Components 或服务端渲染，可确认不受影响无需操作；无法立即升级时，可在反向代理或 WAF 层限制对服务端函数端点的异常请求频率以缓解风险。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Meta React Server Functions 拒绝服务漏洞"
updated = "2026-07-21T20:25:45Z"

