[basic]
description = "GRUB2 网络引导过程中，grub_net_search_config_file() 函数在搜索配置文件时，使用 grub_strcpy() 将用户可控的环境变量复制到内部缓冲区，但未在分配缓冲区时校验环境变量长度，导致越界写入漏洞。同一网段内的攻击者可通过构造特制的网络引导请求触发该漏洞，实现远程代码执行，进而绕过 Secure Boot 安全启动保护机制。该漏洞影响所有使用 GRUB2 的 Linux 发行版，CVSS 评分 7.6，危害等级高。"
published = "2025-02-19T19:15:15Z"
remediation = "立即更新 GRUB2 至包含 2025-02-18 安全补丁的版本。上游补丁已由 Daniel Kiper 发布在 grub-devel 邮件列表（msg00027/msg00052），核心修复为将 `grub_net_search_config_file()` 中的 `grub_strcpy()` 替换为 `grub_strlcpy()` 并传入缓冲区长度参数。各发行版用户请关注对应安全公告：RHEL 用户安装 ALAS2023-2025-937 更新；Ubuntu 用户安装 USN 对应更新；Debian 用户等待 grub2 包更新。如无法立即更新，可在 GRUB 配置中设置 `disable_net_search=1` 禁用网络启动配置搜索作为临时缓解措施，或限制 PXE 启动环境仅允许受信任的 DHCP/TFTP 服务器。"
score = 7.6
severity = "HIGH"
sources = ["msrc"]
title = "GNU GRUB2 网络配置搜索功能越界写入漏洞"
updated = "2026-06-29T21:16:30Z"

