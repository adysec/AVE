[basic]
description = "DomainMOD 4.11.01 及之前版本的管理后台中存在跨站脚本（XSS）漏洞，位于 admin/ssl-fields/add.php 页面的 notes 字段。具有管理员权限的认证用户可通过向该字段注入恶意 JavaScript 代码触发漏洞，导致存储型 XSS。当其他管理员访问受影响页面时，恶意脚本会在浏览器中执行，造成敏感信息泄露或会话劫持。攻击者需具备管理员权限且需诱使用户交互，CVSS 评分 4.8，危害等级中危。"
published = "2018-11-29T22:29:00Z"
remediation = "升级 DomainMOD 至 4.12.0 或更高版本，该版本已修复 admin/ssl-fields/add.php 中 notes 字段的 XSS 问题。如无法升级，在服务器端对 notes 字段输入进行 HTML 实体编码过滤，并配置 Content-Security-Policy 响应头限制脚本执行。同时限制仅受信任的高权限用户访问 SSL 字段管理页面。"
score = 4.8
severity = "MEDIUM"
sources = ["nuclei"]
title = "DomainMOD 跨站脚本漏洞"
updated = "2026-06-17T01:49:47Z"

