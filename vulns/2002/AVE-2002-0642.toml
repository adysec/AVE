[basic]
description = 'GoAhead Web Server 2.1.7 及更早版本存在源代码信息泄露漏洞。远程攻击者无需身份认证，通过在请求的 ASP 文件 URL 末尾添加斜杠（/）、反斜杠（\）、URL 编码字符（%2f、%20、%00）等特殊终止符，可诱使服务器跳过 ASP 脚本解析引擎，直接返回未编译的原始 ASP 源代码。成功利用后，攻击者可获取应用程序的敏感信息，包括数据库连接配置、硬编码凭据、业务逻辑代码等。该漏洞利用门槛低，仅需构造特定 URL 即可触发，严重影响 Web 应用程序的机密性。'
published = "2002-02-13T05:00:00.000"
remediation = '将 GoAhead Web Server 升级到 2.1.8 或更高版本，该版本已修复 ASP 文件源代码泄漏漏洞。如无法立即升级，可在 Web 服务器前端配置 URL 过滤规则，阻断包含 %00、%2f、%5c、/ 或 \ 结尾的 ASP 文件请求，并限制对 .asp 文件的直接访问权限作为临时缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "GoAhead Web Server ASP 脚本源代码泄漏漏洞"
updated = "2026-06-16T21:59:38.260"

