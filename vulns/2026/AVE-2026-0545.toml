[basic]
description = "Apple 多个操作系统（iOS、iPadOS、macOS Tahoe、tvOS、visionOS、watchOS）中 libjxl（JPEG XL 图像编解码库）存在越界读取漏洞。攻击者可通过诱导用户打开特制的恶意 JPEG XL 图像文件触发该漏洞，导致解码器读取未初始化的未分配内存区域，进而引发应用程序意外终止（拒绝服务）。该漏洞无需身份认证，攻击复杂度低，但需要用户交互（打开恶意文件），CVSS 评分 6.5，危害等级中危。Apple 已在 26.5 版本系列的安全更新中修复此漏洞。"
published = "2026-05-11T21:18:54Z"
remediation = "立即将 Apple 设备更新至以下版本：iOS 26.5、iPadOS 26.5、macOS Tahoe 26.5、tvOS 26.5、visionOS 26.5、watchOS 26.5。可通过系统设置中的「软件更新」功能自动获取更新。在无法立即更新的情况下，避免打开来源不明的文件，尤其是图像文件，以降低被利用风险。"
score = 6.5
severity = "MEDIUM"
sources = ["zdi"]
title = "Apple 多平台 libjxl 越界读取漏洞"
updated = "2026-06-17T10:29:20Z"

