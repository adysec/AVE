[basic]
description = "Micro Focus Access Manager 存在信息泄露漏洞，源于 SAML 服务提供者在处理断言消费者服务（Assertion Consumer Service）URL 时发生重定向问题。该漏洞影响 5.0 版本之前的所有版本，攻击者无需身份认证即可通过网络远程利用。未经授权的远程攻击者可通过构造特制的 SAML 请求触发信息泄露，导致敏感配置信息被窃取。CVSS 评分为 7.5，危害等级为高。CISA 已将利用此漏洞的攻击代码收录至已知被利用漏洞目录。厂商已在 Access Manager 5.0 中修复该问题。"
published = "2021-03-26T14:15:11Z"
remediation = "建议立即升级 Micro Focus Access Manager 至 5.0 或更高版本以修复信息泄露漏洞。若暂时无法升级，请检查并禁用高级配置中的敏感信息暴露选项，同时在网络层面限制管理接口仅允许受信任 IP 访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Micro Focus Access Manager 信息泄露漏洞"
updated = "2026-06-17T03:37:20Z"

