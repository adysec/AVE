[basic]
description = "Pine 4.2.1 至 4.4.4 版本存在信息泄露漏洞。该软件在处理邮件时会将 Unix 用户名和/或用户 UID 写入 Sender: 和 X-Sender: 邮件头中，远程攻击者无需认证即可通过查看邮件头获取系统用户名等敏感信息，进而为后续针对性攻击（如密码爆破、社会工程学攻击）提供便利。攻击复杂度低，仅需网络访问即可利用。"
published = "2002-12-31T05:00:00Z"
remediation = "升级至 Pine 4.64（最终版），或在 Pine 配置中设置 `sender-leak-fix` 相关选项以禁止在邮件头中插入 Sender/X-Sender 字段；建议迁移至 Alpine（Pine 后继者，Apache 协议开源维护），Alpine 默认不泄露 Unix 用户名。如无法升级，可在 MTA 层面过滤出站邮件中包含的 Sender/X-Sender 头部信息。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "University of Washington Pine 信息泄露漏洞"
updated = "2026-06-16T22:00:16Z"

