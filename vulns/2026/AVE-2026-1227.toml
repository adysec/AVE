[basic]
description = "ArcadeDB 存在跨数据库越权访问（IDOR）漏洞。由于约 14 个 HTTP 处理程序（如 PostBatchHandler、PostTimeSeriesWriteHandler 等）直接继承自 AbstractServerHttpHandler 而非 DatabaseAbstractHandler，导致其在调用 getDatabase() 获取数据库实例前未进行权限检查，且未正确设置引擎主体。远程认证用户可通过构造特定请求（例如访问 /api/v1/batch/b 或 /api/v1/ts/b/write），在仅拥有数据库 'a' 权限的情况下，非法读取或写入其他数据库 'b' 的数据，导致敏感信息泄露或数据被篡改。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
