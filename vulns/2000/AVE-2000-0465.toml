[basic]
description = "DALnet Bahamut IRCd 4.6.5 的 SUMMON 命令存在缓冲区溢出漏洞，远程攻击者无需身份认证即可向目标 IRC 服务器发送特制的 SUMMON 请求触发该漏洞，导致服务崩溃拒绝服务或执行任意代码。该漏洞 CVSS 评分为 10.0，危害等级严重，影响运行 DALnet Bahamut IRCd 4.6.5 的所有系统。目前已存在公开的远程利用代码，攻击者可通过构造恶意数据包实现完全控制目标服务器。"
published = "2000-06-29T04:00:00Z"
remediation = "升级到 Bahamut 1.8.x 或更高版本（Dalnet IRCd 后继版本已修复此漏洞）。如无法升级，重新编译 IRCd 时移除 ENABLE_SUMMON 编译选项以禁用 SUMMON 命令。临时缓解措施：在防火墙层面限制对 IRC 端口（默认 6667）的访问，仅允许可信 IP 连接。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "DALnet Bahamut IRCd SUMMON 命令缓冲区溢出漏洞"
updated = "2026-06-16T21:52:03Z"

