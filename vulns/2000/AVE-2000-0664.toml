[basic]
description = "华盛顿大学 Pine 4.21 及更早版本的邮件客户端在自动邮件检查功能中未对 From 头部字段进行长度校验，存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标用户发送携带超长 From: 头的特制电子邮件，利用该漏洞在受害系统上触发缓冲区溢出并执行任意命令，从而完全控制受影响的邮件客户端所在主机。"
published = "2000-12-19T05:00:00.000"
remediation = "立即升级 Pine 邮件客户端至 4.21_1 或更高版本（FreeBSD 用户从 ftp.freebsd.org 获取更新包后重新安装）。若无法立即升级，可临时卸载 pine4 包或避免让 Pine 在后台保持打开邮箱文件夹的状态以降低风险。考虑迁移至 Alpine（Pine 的后续维护版本）以获得持续安全更新。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "华盛顿大学 Pine 邮件客户端 From 字段缓冲区溢出漏洞"
updated = "2026-06-16T21:52:44.540"

