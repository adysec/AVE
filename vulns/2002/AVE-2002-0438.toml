[basic]
description = "Linux 内核 TCP 协议栈在处理防火墙规则时存在安全绕过漏洞。攻击者可通过向目标系统发送设置了 RST 等其他标志位的特制 SYN 数据包，由于 Linux TCP 协议栈在防火墙过滤后未能正确丢弃此类异常数据包，导致防火墙规则被绕过。该漏洞允许未经身份认证的远程攻击者绕过网络访问控制策略，对目标系统造成潜在的未授权访问风险。CVSS 评分 7.5，危害等级高，攻击复杂度低，无需用户交互。"
published = "2021-05-18T12:15:07Z"
remediation = "升级 Linux 内核至 2.4.20 或更高版本，该版本在 tcp_input.c 中增加了对 SYN+RST 等非法 TCP 标志组合包的丢弃检查。如无法升级内核，可在防火墙层面配置规则丢弃 SYN+RST、SYN+FIN 等异常标志组合的数据包，并启用状态检测（stateful inspection）防火墙以跟踪连接状态而非仅依赖 TCP 标志位。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Linux Linux Kernel TCP/IP 认证绕过漏洞"
updated = "2026-06-16T22:01:18Z"

