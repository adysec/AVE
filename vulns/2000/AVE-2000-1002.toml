[basic]
description = "Max Feoktistov Small HTTP Server 2.01 存在 HTTP 请求拒绝服务漏洞。远程攻击者可通过向服务器建立连接后，连续发送多个 GET、HEAD 或 POST 请求，并在服务器响应前主动关闭连接，导致服务器资源耗尽或处理逻辑异常，从而触发拒绝服务状态。该漏洞影响 Small HTTP Server 2.01 版本，攻击无需身份认证，利用方式简单，CVSS 评分 5.0，危害等级中危。"
published = "2001-01-09T05:00:00Z"
remediation = "立即升级 Small HTTP Server 至 2.03 或更高版本。如无法升级，可在网络边界防火墙或主机防火墙中限制对 Small HTTP Server 端口（默认 80）的访问，仅允许可信来源 IP 连接；同时禁用 SSI（Server-Side Includes）功能，避免解析恶意 SSI 标签导致服务崩溃。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Max Feoktistov Small HTTP Server 2.01 HTTP 请求拒绝服务漏洞"
updated = "2026-06-16T21:52:43Z"

