[basic]
description = "SANE（Scanner Access Now Easy）后端 sane-backends 中的 saned 守护进程存在拒绝服务漏洞，影响 1.0.7 及更早版本（部分信息显示最高影响至 1.0.10）。该漏洞的成因在于：当远程客户端与 saned 建立 TCP 连接后，在发送数据长度值之前就断开连接时，saned 会使用尚未完整接收的任意字节值作为 malloc 的内存分配大小参数，从而导致申请超大内存块。未经身份认证的远程攻击者只需向运行 saned 的主机发起 TCP 连接并立即断开，即可触发该漏洞，造成目标系统内存耗尽或进程崩溃，最终导致拒绝服务。攻击复杂度低，无需任何凭据即可利用，影响主机的扫描服务可用性。Debian 安全公告 DSA-379 及上游开发者已发布 sane-backends 1.0.11-1 版本修复此问题，受影响用户应尽快升级到 1.0.11 或更高版本，或通过网络防火墙限制对 saned 默认端口 6566 的远程访问。"
published = "2003-09-22T04:00:00Z"
remediation = "升级 sane-backends 至 1.0.11 或更高版本，该版本已修复连接提前断开时 malloc 调用任意大小值的问题。如暂时无法升级，可在防火墙层面限制对 saned 默认端口 6566/TCP 的访问，仅允许可信客户端连接，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "SANE sane-backends 远程拒绝服务漏洞"
updated = "2026-06-16T22:02:48Z"

