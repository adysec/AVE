[basic]
description = "ArGoSoft Mail Server Plus/Pro 1.8.1.5及之前版本的webmail功能存在目录遍历漏洞。远程攻击者可通过在URL中注入`..`（点点）序列绕过路径限制，读取服务器上任意文件，导致敏感信息泄露。攻击无需身份认证，仅需向目标发送特制HTTP请求即可触发，利用难度较低。该漏洞影响ArGoSoft Mail Server Plus与Pro系列产品，CVSS评分5.0，危害等级中危。"
published = "2002-10-04T04:00:00Z"
remediation = "ArGoSoft 已停止维护且官网已不可访问，建议立即迁移至仍在安全更新的邮件服务器（如 hMailServer、MailEnable 等）。如暂时无法迁移，可在 Web 服务器（IIS 或反向代理）层面配置 URL 过滤规则，拦截包含 `..` 或 `_tempatt/../` 的请求路径，同时限制 webmail 功能仅允许内网 IP 访问以降低暴露面。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "ArGoSoft Mail Server 目录遍历漏洞"
updated = "2026-06-16T21:58:32Z"

