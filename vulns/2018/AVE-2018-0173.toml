[basic]
description = "Oracle Fusion Middleware 的 Oracle WebCenter Sites 组件 Advanced UI 子组件存在访问控制漏洞。未经身份认证的远程攻击者可通过 HTTP 利用该漏洞，在需要受害者交互的情况下，成功利用后可导致未授权访问关键数据或完全访问所有 Oracle WebCenter Sites 可访问数据，并可对部分数据进行未授权的更新、插入或删除操作。该漏洞影响 11.1.1.8.0、12.2.1.2.0 及 12.2.1.3.0 版本，CVSS 评分 8.2，危害等级高。"
published = "2018-04-19T02:29:03.457"
remediation = "请登录 My Oracle Support 下载并安装 Oracle 2018 年 4 月关键补丁更新（Critical Patch Update）中针对 Oracle WebCenter Sites 的安全补丁。受影响版本包括 11.1.1.8.0、12.2.1.2.0 和 12.2.1.3.0，对应补丁可通过 Oracle Fusion Middleware 的补丁文档获取（MOS 文档 2353306.1）。如无法立即打补丁，建议在网络层面限制对 WebCenter Sites Advanced UI 组件的访问，仅允许可信 IP 访问，作为临时缓解措施。"
score = 8.2
severity = "HIGH"
sources = ["nuclei"]
title = "Oracle WebCenter Sites Advanced UI 访问控制漏洞"
updated = "2026-06-17T01:56:20.147"

