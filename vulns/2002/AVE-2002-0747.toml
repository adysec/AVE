[basic]
description = "User-Mode Linux（UML）2.4.17-8 版本内核未对内核地址空间施加访问限制，本地攻击者可直接访问内核内存区域并执行任意代码，从而实现权限提升。该漏洞影响 Linux Kernel 2.4.17-8 版本运行的 User-Mode Linux 环境，攻击者需已具有目标系统的本地访问权限，利用方式为通过 UML 用户空间进程直接读写内核地址空间，最终获得系统最高权限，CVSS 评分 7.2，危害等级高。"
published = "2002-12-31T05:00:00Z"
remediation = "建议立即升级 User-Mode Linux 至 2.4.18 或更高版本（含 SKAS 模式支持），并在启动参数中添加 skas=1 启用独立内核地址空间保护。若无法升级，可在宿主机层面限制 UML 进程权限（如使用 chroot/jail 容器化运行、禁止特权系统调用、配置 seccomp 过滤器），并避免在多租户环境中部署受影响版本的 UML 实例。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Linux Kernel User-Mode Linux 内存访问权限提升漏洞"
updated = "2026-06-16T22:00:29Z"

