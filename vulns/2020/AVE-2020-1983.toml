[basic]
description = "EyesOfNetwork 5.3 的 sudoers 配置文件存在权限提升漏洞，允许 apache 用户通过精心构造的 NSE（Nmap Scripting Engine）脚本以 root 权限执行任意命令。攻击者需具备对 Web 应用的访问权限（apache 用户身份），并能利用 nmap 7 的 NSE 脚本执行功能触发该漏洞。该漏洞影响 EyesOfNetwork 5.3 及相关版本，CWE 类型为 CWE-269（权限管理不当），CVSS 评分为 7.8，属于高危级别。攻击成功后，攻击者可完全控制系统，执行任意操作。"
published = "2020-02-07T00:15:09.613"
remediation = "立即升级 EyesOfNetwork 到 5.3-1 或更高版本以修复此漏洞。临时缓解措施：编辑 /etc/sudoers 文件，移除或注释 apache 用户对 /usr/bin/nmap 的 NOPASSWD 权限条目，限制 apache 用户仅能执行系统服务管理命令。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "EyesOfNetwork sudoers配置权限提升漏洞"
updated = "2026-06-17T03:26:42.707"

