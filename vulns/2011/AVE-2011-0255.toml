[basic]
description = "Google Chrome 17.0.963.46 之前版本中存在释放后使用（Use-After-Free）漏洞，该漏洞源于 SVG 文档布局处理过程中对已释放内存对象的错误引用。远程攻击者可通过诱使用户访问包含特制 SVG 内容的恶意网页触发该漏洞，成功利用可导致浏览器崩溃（拒绝服务）或可能执行任意代码。CVSS 评分 6.8，危害等级中危。"
published = "2012-02-09T04:10:29Z"
remediation = "立即将 Google Chrome 升级至 17.0.963.46 或更高版本，该版本修复了 SVG 布局处理中的 use-after-free 漏洞。如无法升级，可禁用 Chrome 的 SVG 渲染支持或使用其他浏览器（如 Firefox）作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome SVG布局释放后使用漏洞"
updated = "2026-06-16T23:34:13Z"

