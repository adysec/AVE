[basic]
description = "Microsoft IIS 4.0 的 ISAPI 解析机制在处理 ASP 脚本标签的 LANGUAGE 参数时存在缓冲区溢出漏洞。远程攻击者可通过向目标服务器发送包含特制超长字符串的 LANGUAGE 参数请求，触发内存溢出并覆盖返回地址。该漏洞影响部署了 IIS 4.0 的 Windows 服务器，攻击者在无需身份验证的情况下即可利用此漏洞执行任意系统命令，从而导致服务器被完全接管。利用方式通常是通过精心构造的 ASP 页面请求实现远程代码执行。"
published = "2001-01-09T05:00:00.000"
remediation = "立即将 Microsoft IIS 4.0 升级至 IIS 5.0 或更高版本，并安装微软发布的安全更新补丁。临时缓解措施：在 IIS 管理器中禁用 ISAPI 扩展过滤功能，或在 Web 服务器前端部署反向代理并启用请求长度限制，阻断包含超长 LANGUAGE 参数的 ASP 请求。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft IIS 4.0 ISAPI 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:15.453"

