[basic]
description = "Microsoft SQL Server 2000 及 SQL Server Desktop Engine (MSDE) 中的 xp_printstatements 函数在调用 SQL Server 扩展存储过程 API 中的 srv_paraminfo 函数前，未正确限制缓冲区长度，导致缓冲区溢出。攻击者可通过发送特制的参数触发该漏洞，造成拒绝服务或执行任意命令。该漏洞影响 Microsoft SQL Server 2000 和 MSDE 所有版本，攻击条件为本地访问，无需身份认证，CVSS 评分 5，危害等级中等。"
published = "2000-01-01"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
