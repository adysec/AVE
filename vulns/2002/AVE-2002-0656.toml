[basic]
description = "ColdFusion MX 缺失模板处理模块存在跨站脚本（XSS）漏洞。当远程用户请求不存在的 ColdFusion 模板文件时，服务器会返回 404 错误页面，并将请求中的模板名称直接嵌入到响应内容中，但未对模板名称参数进行任何过滤或转义。未经身份认证的远程攻击者可通过构造包含恶意脚本的 HTTP 请求，将 JavaScript 代码注入到 404 错误消息的页面中。当其他用户访问该页面时，恶意脚本会在其浏览器中执行，导致会话劫持、Cookie 窃取或页面内容篡改等后果。该漏洞影响 Macromedia ColdFusion MX 6.0 版本，攻击者仅需向目标服务器发送特制 URL 即可触发，无需身份认证或特殊权限。由于 ColdFusion MX 广泛应用于企业 Web 应用开发，受影响站点数量众多。"
published = "2002-12-31T05:00:00.000"
remediation = "升级 ColdFusion MX 至 6.1 或更高版本，或安装 Macromedia 针对此漏洞发布的安全热修复补丁（参考 Macromedia 支持说明 ID 23047）。临时缓解措施：在 ColdFusion Administrator 中自定义 Missing Template 错误页面，确保错误消息不反射用户输入的 URL 参数内容，或在 Web 服务器（如 IIS/Apache）层面配置自定义 404 错误页面，阻断 ColdFusion MX 默认的 Missing Template Handler 输出。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Macromedia ColdFusion MX 跨站脚本漏洞"
updated = "2026-06-16T21:59:48.550"

