[basic]
description = "Linux 内核 ASoC（音频编解码器）子系统 SOF（Sound Open Firmware）的 ipc4-topology 模块中存在 NULL 指针引用漏洞。当非 DAI copier widget 与 ALH copier 共享相同的流名称（stream name）时，copier->data 为 NULL，且未附加 alh_data 结构，导致代码访问空指针触发崩溃，同时另一处循环会错误计算 ALH 设备数量，造成音频功能异常。该漏洞影响使用 SOF 音频框架的 Linux 内核系统，本地攻击者可通过特制的音频拓扑配置触发该漏洞，导致系统崩溃或权限提升。CVSS v3.1 评分为 7.8（HIGH），CWE-476。厂商已在后续内核版本中修复此问题，建议受影响用户升级至安全版本。"
published = "2025-03-27T14:15:48Z"
remediation = "升级 Linux 内核至 6.12.17 或 6.13.5 及以上版本（包含补丁 commit 6fd60136d256b3b948333ebdb3835f41a95ab7ef），受影响版本范围为 6.0–6.12.17 前及 6.13–6.13.5 前。如无法立即升级，可临时禁用 SOF IPC4 拓扑中的 ALH copier 模块以降低本地提权风险。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 ASoC SOF ipc4-topology 空指针解引用漏洞"
updated = "2026-07-30T06:21:42Z"

