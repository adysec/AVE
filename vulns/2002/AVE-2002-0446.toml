[basic]
description = "YoungZSoft CMailServer 3.30 及 4.0 版本存在远程缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向 POP3 服务发送超长 USER 参数触发缓冲区溢出，导致远程代码执行，完全控制目标服务器。该漏洞无需身份认证即可远程利用，危害严重，目前已公开利用代码。"
published = "2002-08-12T04:00:00Z"
remediation = "立即升级 CMailServer 至 4.0.2003.06.01 及以上版本，该版本已修复 POP3 USER 命令缓冲区溢出问题。如无法升级，在防火墙上限制对 TCP 110 端口的访问，仅允许受信任 IP 连接，并考虑迁移至现代邮件服务器（如 hMailServer 或 MailEnable）以彻底消除风险。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "YoungzSoft CMailServer 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:58:09Z"

