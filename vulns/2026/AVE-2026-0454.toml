[basic]
description = "Digilent DASYLab 在加载畸形文件时存在越界读取漏洞（CWE-125），由于程序未对文件数据进行充分边界检查，攻击者可通过诱导用户打开特制的 .dasy 工程文件触发内存越界读取，导致敏感信息泄露或任意代码执行。该漏洞影响 Digilent DASYLab 所有版本，攻击复杂度低，无需特权，但需要用户交互。建议用户避免打开来源不明的 DASYLab 文件，并及时关注厂商安全更新。"
published = "2026-03-13T19:53:57Z"
remediation = "目前 Digilent 官方尚未发布修复补丁，所有版本的 DASYLab 均受影响。建议用户不要打开来自不可信来源的 DASYLab 文件，仅处理可信来源的 .dasy 文件；同时关注 Digilent 官方安全公告（https://www.ni.com/en/support/security.html）以获取未来补丁更新。由于该漏洞需要本地用户交互才能利用，加强用户安全意识培训可有效降低风险。"
score = 8.5
severity = "HIGH"
sources = ["zdi"]
title = "Digilent DASYLab 越界读取漏洞"
updated = "2026-06-17T10:11:40Z"

