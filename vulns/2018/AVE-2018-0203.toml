[basic]
description = "DedeCMS 5.7 后台存在跨站请求伪造（CSRF）漏洞，位于 tag_test_action.php 文件中。攻击者可利用 partcode 参数构造恶意请求，结合 runphp 字段实现任意 PHP 代码执行。该漏洞无需身份认证即可触发，但需要管理员登录状态下访问攻击者构造的恶意链接。成功利用后攻击者可完全控制目标网站，包括获取敏感数据、篡改页面内容或植入后门。影响 DedeCMS 5.7 版本，CVSS 评分 8.8，危害等级高。"
published = "2018-03-27T18:29:00Z"
remediation = "升级 DedeCMS 至官方发布的最新版本（5.7 SP2 或更高），该版本已修复 tag_test_action.php 中 runphp 参数导致的 CSRF 任意代码执行漏洞。如无法升级，在 include/taglib/tag_test_action.php 中移除对 runphp 参数的处理逻辑，并在后台管理路径上增加 CSRF Token 校验机制，同时限制管理后台仅允许可信 IP 访问。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "DeDeCMS 5.7 跨站请求伪造漏洞"
updated = "2026-06-17T02:03:33Z"

