[basic]
description = "Windows 2000 的网络动态数据交换（NetDDE）服务存在权限提升漏洞。本地攻击者可通过向以 WINLOGON 进程权限运行的后台窗口发送特制的 WM_COPYDATA 消息，利用 DDE 协议的消息处理机制触发漏洞，从而将自身权限提升至 SYSTEM 级别。该漏洞影响 Windows 2000 系统，攻击者需具备本地登录能力，CVSS 评分 7.2，危害等级高。Microsoft 尚未发布官方补丁，建议禁用 NetDDE 服务以缓解风险。"
published = "2001-03-12T05:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS01-007 提供的补丁（KB285851），下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=9F7C3381-78AF-4D86-9F3D-62C962A7A33E。该修复已包含在 Windows 2000 Service Pack 3 中，建议升级至 SP3 或更高版本。如无法立即打补丁，可在服务管理器中禁用 Network DDE Agent 服务（NetDDE）作为临时缓解措施，并禁止非特权用户在关键服务器上运行任意代码。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Windows 2000 NetDDE 权限提升漏洞"
updated = "2026-06-16T21:53:29Z"

