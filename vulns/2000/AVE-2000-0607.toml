[basic]
description = "Mobius DocumentDirect for the Internet 1.2 的 ddicgi.exe 组件存在缓冲区溢出漏洞。远程攻击者可通过向目标系统发送特制的超长 User-Agent 参数的 HTTP 请求触发该漏洞，导致缓冲区溢出，从而执行任意命令。该漏洞影响 Mobius DocumentDirect for the Internet 1.2 版本，CVSS 评分 10.0，危害等级严重。目前官方已发布修复版本，建议用户升级至最新版本以修复此漏洞。"
published = "2000-11-14T05:00:00.000"
remediation = "由于 Mobius DocumentDirect for the Internet 1.2 已停止维护且厂商不再提供安全更新，建议立即停用该产品并迁移至受支持的替代方案。如无法立即替换，应在 Web 服务器（如 IIS）层面配置 URL 扫描过滤规则，限制对 /ddrint/bin/ddicgi.exe 的访问，并部署 WAF 拦截超长 User-Agent 请求作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Mobius DocumentDirect for the Internet 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:52:33.107"

