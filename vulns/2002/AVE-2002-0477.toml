[basic]
description = "Pirch 98 IRC 客户端存在缓冲区溢出漏洞，远程攻击者可通过在频道或私聊消息中发送超长超链接触发该漏洞，导致目标系统拒绝服务，甚至可能执行任意代码。该漏洞影响 Pirch 98 版本，攻击无需身份认证，利用复杂度低，CVSS 评分 7.5，危害等级高。目前已存在公开的利用代码。"
published = "2002-10-04T04:00:00Z"
remediation = "Pirch 98 IRC 客户端已停止维护且不再发布安全更新，建议立即停止使用该软件，迁移至仍在维护的现代 IRC 客户端（如 HexChat、Irssi 等）。如暂时无法替换，切勿点击来自不可信来源的 IRC 频道或私聊消息中的超链接，并在网络层面过滤 IRC 协议中异常长度的链接数据包作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Pirch IRC 98 Client 畸形链接缓冲区溢出漏洞"
updated = "2026-06-16T21:58:24Z"

