[basic]
description = "Apache::ASP模块1.93及更早版本中的source.asp示例脚本存在任意文件写入漏洞，由于脚本未对用户输入进行充分验证，远程攻击者可通过构造恶意请求向服务器写入或修改任意文件。该漏洞影响Apache::ASP 1.93及更早版本，CVSS评分7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），攻击向量为网络远程攻击，无需身份认证，攻击复杂度低，可导致机密性、完整性、可用性部分受损。攻击者可利用source.asp脚本的文件写入功能上传WebShell或篡改关键文件，进而控制Web服务器。Apache Software Foundation已发布修复版本，建议升级至Apache::ASP 1.94及以上版本并删除或限制示例脚本访问权限。"
published = "2000-07-11T04:00:00Z"
remediation = '建议立即升级 Apache::ASP 模块至 1.94 或更高版本，或删除/禁用 Apache::ASP 安装目录下的 source.asp 示例脚本。如暂时无法升级，可在 Apache 配置中移除或限制对 source.asp 的访问权限（如 <Files "source.asp"> Require all denied </Files>），并检查 Web 目录写入权限，确保 Web 进程无写权限。'
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Apache软件基金会 Apache::ASP 任意文件写入漏洞"
updated = "2026-06-16T21:52:08Z"

