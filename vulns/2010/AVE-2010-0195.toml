[basic]
description = "RealNetworks RealPlayer 11.0至11.1、RealPlayer SP 1.0至1.0.1、Mac RealPlayer 11.0至11.1及Linux RealPlayer 11.0.2.1744版本中的AAC文件解析组件存在整数溢出漏洞。攻击者可通过构造恶意的MLLT atom（多位置定位表）的AAC音频文件，诱导用户使用RealPlayer打开，触发堆内存破坏，成功利用可实现远程代码执行或导致拒绝服务。该漏洞CVSS评分9.3，危害等级严重，无需身份认证即可利用，但需要用户交互。建议用户升级至RealPlayer 12.0.1.609及以上版本修复此漏洞。"
published = "2010-12-14T16:00:02Z"
remediation = "立即升级 RealPlayer 至 12.0.1.609 或更高版本。RealPlayer 已于 2012 年停止维护，建议彻底卸载 RealPlayer 并改用 VLC、MPC-HC 等仍在维护的媒体播放器。如因业务必须使用，在无法升级的情况下，不要在浏览器中安装 RealPlayer 浏览器插件，不要打开来源不明的 AAC 音频文件，并在网络边界和主机防火墙中阻止 RealPlayer 对外部服务器的主动连接请求。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer AAC MLLT Atom 解析整数溢出远程代码执行漏洞"
updated = "2026-06-16T23:21:56Z"

