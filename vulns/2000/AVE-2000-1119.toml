description = "tags, and only that content. No markdown, no code blocks.<value>RobinHood 1.1 web server 中的 RHDaemon 组件存在拒绝服务漏洞，未经身份认证的远程攻击者可通过发送超长 HTTP 请求触发该漏洞，导致 BeOS R5 Pro 及更早版本系统的 Web 服务崩溃或无法响应。该漏洞利用条件简单，攻击者无需任何认证即可远程利用，CVSS 评分为 5.0，危害等级为中等。"
published = "2001-01-09T05:00:00.000"
remediation = "升级 RobinHood Web 服务器至不含该缺陷的发布版本，或在无法升级时通过修改 RHDaemon 配置文件限制 HTTP 请求最大长度并启用请求超时中断，同时对不可信来源 IP 实施网络层访问控制以缓解拒绝服务攻击风险。"
score = 5
severity = "MEDIUM"
