[basic]
description = "Pulse Connect Secure 存在命令注入漏洞，由于在 Windows Resource Profiles Feature 中对用户输入的特殊元素转义处理不当，未经充分身份验证的远程攻击者可通过该功能注入并执行任意操作系统命令，最终实现远程代码执行。该漏洞影响 9.1R11.4 之前的所有 Pulse Connect Secure 版本，攻击者需要具备基本身份认证凭据即可利用。成功利用后，攻击者可在目标设备上以高权限执行任意代码，完全控制设备。"
published = "2021-05-27T12:15:07Z"
remediation = "将 Pulse Connect Secure 固件升级至 9.1R11.4 或更高版本，该版本已修复命令注入漏洞。升级前使用 Pulse Connect Secure Integrity Tool（KB44755）检查系统完整性，若发现文件哈希不匹配，立即断开网络并联系厂商进行取证分析。升级后执行出厂重置，重新导入配置，并重置所有关联账户密码（包括管理员、服务和用户账户）。如暂无法升级，导入厂商提供的 XML 配置文件（SA44784）作为临时缓解措施，同时限制 Windows Resource Profiles 功能的使用权限。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Pulse Secure Pulse Connect Secure 命令注入漏洞"
updated = "2026-06-17T03:37:58Z"

