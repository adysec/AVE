[basic]
description = ".NET Framework 及 Visual Studio 中的 System.Security.Cryptography.Xml 组件存在基于栈的缓冲区溢出漏洞（CWE-121），该漏洞源于 EncryptedXml 类对输入数据缺乏充分的边界检查与验证。未经身份认证的远程攻击者可构造特制的 XML 数据包发送至目标系统，利用缓冲区溢出触发拒绝服务（DoS）攻击，导致应用程序崩溃或无法正常处理加密请求。该漏洞影响所有使用受影响版本 .NET 8（≤8.0.2）、.NET 9（≤9.0.14）及 .NET 10（≤10.0.5）的项目，攻击条件宽松且无需身份认证。Microsoft 已于 2026 年 4 月发布安全公告，建议将 System.Security.Cryptography.Xml 包升级至修复版本（.NET 8 升级至 8.0.3、.NET 9 升级至 9.0.15、.NET 10 升级至 10.0.6）以消除漏洞。"
published = "2026-04-14T18:17:27Z"
remediation = "升级 System.Security.Cryptography.Xml 包至修复版本：.NET 8 项目升级到 8.0.3，.NET 9 项目升级到 9.0.15，.NET 10 项目升级到 10.0.6。使用 NuGet 包管理器或 dotnet CLI 执行更新命令后重新编译并部署应用。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Microsoft .NET System.Security.Cryptography.Xml 缓冲区溢出拒绝服务漏洞"
updated = "2026-07-15T02:19:53Z"

