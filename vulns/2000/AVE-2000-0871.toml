[basic]
description = "GoodTech FTP Server 3.0及3.0.1版本在处理RNTO（重命名到）命令时存在拒绝服务漏洞。远程攻击者无需身份认证即可通过网络向目标FTP服务器发送大量特制的RNTO命令，导致服务器资源耗尽或程序崩溃，无法继续提供正常的FTP服务。该漏洞利用条件简单，攻击者只需能够访问目标服务器的FTP端口即可发起攻击，影响运行GoodTech FTP Server 3.0/3.0.1的系统。"
published = "2000-10-20T04:00:00.000"
remediation = "由于 GoodTech FTP Server 3.0/3.0.1 为已停止维护的 Windows 95/98/NT 时代产品，厂商 GoodTech 已不存在且无官方补丁可修复。建议立即将 FTP 服务迁移至当前维护的 FTP 服务器软件（如 FileZilla Server、ProFTPD 或 vsftpd），以彻底消除 RNTO 命令拒绝服务攻击面。若因业务限制暂时无法更换，应在网络边界防火墙层面限制外部对 FTP 服务端口（默认 21）的访问，并启用连接速率限制以缓解 RNTO 洪水攻击。完成迁移或缓解后，应持续监控 FTP 服务日志，排查异常 RNTO 请求行为。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "GoodTech FTP Server 3.0/3.0.1 RNTO命令拒绝服务漏洞"
updated = "2026-06-16T21:52:20.007"

