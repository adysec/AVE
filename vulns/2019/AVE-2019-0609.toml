[basic]
description = "tags.<value>Webmin 是一款用于类 Unix 系统的 Web 界面系统管理工具。该漏洞存在于 Webmin 1.920 及更早版本的 password_change.cgi 脚本中，由于 `old` 参数未对用户输入进行充分过滤，导致存在命令注入漏洞。未经身份认证的远程攻击者可通过发送特制的 HTTP 请求，在 `old` 参数中插入操作系统命令，从而在目标服务器上以 root 权限执行任意命令，实现远程代码执行。该漏洞影响所有运行受影响版本 Webmin 的系统，CVSS 评分 9.8，危害等级严重。"
published = "2019-08-16T03:15:11Z"
remediation = "强烈建议立即将 Webmin 升级至 1.930 或更高版本以彻底消除漏洞。如当前运行的是 1.900 至 1.920 版本且无法立即升级，可执行以下临时缓解措施：编辑 /etc/webmin/miniserv.conf 文件，删除 passwd_mode= 配置行，保存后执行 /etc/webmin/restart 命令重启 Webmin 服务，以禁用过期密码修改功能阻断利用路径。此外，建议同时轮换所有系统管理员密码及 Webmin 访问密钥，并检查 /etc/webmin/miniserv.conf 中是否存在异常配置，确保 Webmin 管理界面仅通过 VPN 或 IP 访问控制列表进行访问限制。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Webmin Webmin 远程命令执行漏洞"
updated = "2026-08-05T21:16:56Z"

