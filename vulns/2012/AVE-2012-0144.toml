[basic]
description = "Apple QuickTime 7.7.1 及之前版本在处理 .pict 文件时存在内存破坏漏洞。攻击者可构造特制的 .pict 文件并诱使用户通过 QuickTime 打开，触发内存损坏，导致远程代码执行或应用程序崩溃。该漏洞影响 Windows 和 macOS 平台上的 QuickTime 播放器，CVSS 评分 9.3，危害等级严重。用户需升级至 QuickTime 7.7.2 或更高版本以修复此漏洞。"
published = "2012-05-16T10:12:58Z"
remediation = "立即升级 Apple QuickTime 至 7.7.2 或更高版本。Apple 已停止对 QuickTime for Windows 提供安全更新，建议 Windows 用户卸载 QuickTime 并改用其他媒体播放器（如 VLC）。macOS 用户应确保系统已安装最新安全更新。如无法升级，避免在浏览器中打开不可信的 .pict 文件，并禁用 QuickTime 浏览器插件作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime .pict 文件内存破坏漏洞"
updated = "2026-06-16T23:38:02Z"

