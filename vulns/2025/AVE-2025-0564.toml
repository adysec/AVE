[basic]
description = "Google Chrome 浏览器 Digital Credentials 组件中存在释放后使用（Use-After-Free）漏洞。漏洞原理在于程序在释放内存后未能正确清除指针，导致在特定条件下再次访问已释放的内存区域。攻击者可通过诱导用户访问特制的 HTML 页面，在已劫持渲染进程的前提下触发堆损坏，从而实现潜在的任意代码执行或导致浏览器崩溃。该漏洞影响 143.0.7499.41 之前的 Google Chrome 版本，攻击条件需用户触发特定页面加载且攻击者已掌握渲染进程控制权。"
published = "2025-12-02T19:15:47Z"
remediation = "建议立即将 Google Chrome 或 Chromium 浏览器升级至 143.0.7499.41 或更高版本。对于使用 Fedora 42 等发行版的用户，应更新 chromium 软件包至 143.0.7499.146 版本。在无法立即更新的情况下，建议通过限制访问不可信的 HTML 页面以减轻潜在的远程攻击风险。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome 数字凭证组件释放后使用漏洞"
updated = "2026-06-17T08:34:29Z"

