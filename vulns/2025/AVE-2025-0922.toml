Looking at the current TOML, the description field is broken because it contains the AI's internal monologue. I need to provide just the clean description text.

Let me check the exact requirements again:
- ≥50 字中文
- 涵盖：漏洞原理、影响范围、攻击条件
- 将 NVD 英文描述翻译为流畅中文，补充本地数据中的技术细节
- 不要编造 URL 或具体版本号（除非 presearch 数据中有）

The description I drafted looks good. Let me refine it slightly to make sure it's accurate and flows well.

Final description:
Linux 内核的 pktgen 网络报文生成器子系统在 net/core/pktgen.c 的 get_imix_entries 函数中存在数组越界访问漏洞。由于边界检查逻辑不正确，当传入的 imix 条目数量超出数组上限（20）时，会导致对 pkt_dev->imix_entries 数组的非法索引访问。该漏洞影响 Linux 内核中启用 pktgen 模块的版本，攻击者需具备本地低权限访问权限，通过向 proc 文件系统写入超量 imix 条目即可触发越界读写，进而可能获取系统最高权限并影响机密性、完整性和可用性。该漏洞由 Linux Verification Center (linuxtesting.org) 通过 SVACE 发现。

This is accurate and covers all requirements.<value>Linux 内核的 pktgen 网络报文生成器子系统在 net/core/pktgen.c 的 get_imix_entries 函数中存在数组越界访问漏洞。由于边界检查逻辑不正确，当传入的 imix 条目数量超出数组上限（20）时，会导致对 pkt_dev->imix_entries 数组的非法索引访问。该漏洞影响 Linux 内核中启用 pktgen 模块的版本，攻击者需具备本地低权限访问权限，通过向 proc 文件系统写入超量 imix 条目即可触发越界读写，进而可能获取系统最高权限并影响机密性、完整性和可用性。该漏洞由 Linux Verification Center (linuxtesting.org) 通过 SVACE 静态分析工具发现。"""
published = "2025-01-31T12:15:29Z"
remediation = "建议升级 Linux 内核至包含修复的版本：5.15.177、6.1.127、6.6.74、6.12.11 或更高版本，或从上游仓库应用补丁（commit 76201b5979768500bca362871db66d77cb4c225e）。各发行版用户应安装对应安全更新，例如 Ubuntu 用户执行 apt upgrade linux-image-generic，RHEL 用户安装 RHSA-2025:20095 公告中的 kernel-6.12.0-124.8.1.el10_1 或更高版本。如暂无法升级，可临时卸载 pktgen 内核模块（执行 rmmod pktgen），或通过 chmod 限制 /proc/net/pktgen/ 目录的写权限以阻止本地低权限用户触发越界访问。此外，应严格限制 CAP_NET_ADMIN 权限仅授予可信账号，以缩小本地攻击面。"
score = 7.8
