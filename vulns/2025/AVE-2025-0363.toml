[basic]
description = "Linux 内核的 drm/vmwgfx 显卡驱动中存在命令标头大小验证缺失漏洞。由于未对来自用户空间的命令标头大小与 SVGA_CMD_MAX_DATASIZE 进行校验，攻击者可构造特制的命令数据触发缓冲区偏移计算整数溢出，导致越界内存访问，进而可能造成系统崩溃或权限提升。该漏洞需要本地用户权限才能利用，影响使用 VMware 图形驱动的 Linux 系统。"
published = "2025-12-06T22:15:55Z"
remediation = '立即更新 Linux 内核至包含提交 `drm/vmwgfx: Validate command header size against SVGA_CMD_MAX_DATASIZE` 的版本。Ubuntu 24.04 LTS 升级 linux-oem-6.17 至 6.17.0-1011.11（USN-8048-1），Ubuntu 25.10 升级 linux-image 至 6.17.0-14.14（USN-8029-1）。RHEL 8/9/10 分别安装 RHSA-2026:1148/RHSA-2026:0793/RHSA-2026:0453 对应内核更新。Debian 11 应用 DLA-4404-1。更新后重启系统生效。临时缓解措施：如无需 VMware 图形功能，可执行 `echo "blacklist vmwgfx" > /etc/modprobe.d/blacklist-vmwgfx.conf` 禁用该内核模块。'
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "Linux kernel drm/vmwgfx 命令标头大小验证不当导致越界访问漏洞"
updated = "2026-06-17T09:21:34Z"

