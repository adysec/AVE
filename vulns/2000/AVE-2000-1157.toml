[basic]
description = "Windows NT 4.0 和 Windows 2000 的 SMB 协议实现存在拒绝服务漏洞，远程攻击者可通过连续发送 SMBnegprots 协议协商请求且不读取服务端响应，导致系统连接资源被耗尽，使得合法用户无法建立新的网络连接。该漏洞无需身份认证即可远程触发，影响所有默认启用 SMB 服务的 Windows NT 4.0 及 Windows 2000 主机，攻击者仅需向目标发送特制的 SMB 数据包即可造成拒绝服务。"
published = "2000-12-31T05:00:00Z"
remediation = '对于仍在使用 Windows NT 4.0 或 Windows 2000 的系统，建议立即升级至受支持的 Windows 版本（如 Windows Server 2019/2022 或 Windows 10/11），并安装最新安全更新。如无法立即升级，可在防火墙或边界路由器上限制 TCP 445、139 端口的入站访问，仅允许来自可信 IP 地址的 SMB 连接；同时在系统注册表中禁用 SMBv1 协议（将 HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\SMB1 的 DWORD 值设为 0），并重启服务器使配置生效。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Windows NT 4.0/2000 SMBnegprots Request 拒绝服务漏洞"
updated = "2026-06-16T21:53:25Z"

