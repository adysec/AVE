[basic]
description = "XTux 游戏服务器在处理客户端初始连接请求时，未对输入数据进行有效性验证，攻击者可通过发送随机的垃圾数据触发异常处理逻辑，导致服务器 CPU 资源被大量消耗。该漏洞影响运行 XTux Server 2001.0 6.01 版本的服务器系统。利用条件为攻击者能够通过网络远程连接至目标服务器的 XTux 服务端口，且无需身份认证，仅需发送恶意连接数据即可触发消耗。攻击者通过向服务器发送特制的垃圾数据包，耗尽系统 CPU 资源，造成拒绝服务，使合法用户无法正常连接和使用服务。"
published = "2002-07-26T04:00:00Z"
remediation = "停止使用已过时的 XTux Server 2001.0 6.01 版本，建议迁移至现代的安全服务器软件。若必须运行，请在网络防火墙上配置访问控制列表 (ACL)，限制仅允许受信任的 IP 地址访问该服务端口，以防止远程攻击者发送随机输入导致 CPU 耗尽。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "XTux Server 拒绝服务漏洞"
updated = "2026-06-16T21:57:26Z"

