[basic]
description = "Jenkins 2.196及之前版本、LTS 2.176.3及之前版本的/whoAmI/诊断页面存在信息泄露漏洞。该页面会直接输出HTTP请求中Cookie头的明文值，即使Cookie设置了HttpOnly标记也无法阻止其被泄露。已登录的低权限远程攻击者可利用其他跨站脚本（XSS）漏洞诱导用户访问该页面，从而窃取会话Cookie实现会话劫持，导致敏感信息泄露和未授权操作。"
published = "2019-09-25T16:15:10.697"
remediation = "立即将 Jenkins 升级到 2.197（每周版）或 2.176.4/2.190.1（LTS 版）及以上版本。该版本已移除 /whoAmI/ 页面中 Cookie HTTP 请求头的明文输出，防止攻击者通过 XSS 窃取 HttpOnly 标记的会话 Cookie。如无法立即升级，可在反向代理层（如 Nginx）配置规则阻止对 /whoAmI/ 路径的访问作为临时缓解措施。"
score = 5.4
severity = "MEDIUM"
sources = ["nuclei"]
title = "Jenkins 2.196 及更早版本 /whoAmI/ 跨站脚本攻击"
updated = "2026-06-17T02:10:52.653"

