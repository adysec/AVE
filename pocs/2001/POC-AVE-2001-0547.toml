[info]
author = "ave"
description = "通过nidump命令读取MacOS X系统密码文件中的加密密码哈希值，验证本地信息泄露漏洞。在MacOS X 10.3之前版本中，nidump未对命令行参数进行权限检查，普通用户执行'nidump passwd'即可读取/etc/passwd中的加密密码。"
id = "POC-AVE-2001-0547"
name = "Apple MacOS X nidump密码文件泄露漏洞 PoC"
severity = "low"
tags = ["ave-2001-0547"]
vuln_id = [
    "CVE-2001-1412",
    "AVE-2001-0547",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
