[basic]
description = "Oracle WebCenter Content 组件（Content Server 子组件）存在未授权操作漏洞（CNVD-2017-24345），影响 Oracle Fusion Middleware 版本 11.1.1.9.0、12.2.1.1.0 和 12.2.1.2.0。未经身份认证的远程攻击者可通过 HTTP 协议利用该漏洞攻击 WebCenter Content，攻击成功需要除攻击者以外的人员进行人为交互（如点击恶意链接）。漏洞利用成功可导致未经授权访问关键数据、完全访问所有可访问的 WebCenter Content 数据，以及对部分可访问数据进行未授权的更新、插入或删除操作，且可能显著影响关联产品。CVSS 3.0 基础评分 8.2（高危），向量为 CVSS:3.0/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N，攻击向量为网络、攻击复杂度低、无需权限、需用户交互、范围扩大、机密性高影响、完整性低影响、可用性无影响。"
published = "2017-08-08T15:29:02Z"
remediation = "建议立即安装Oracle Fusion Middleware 2024年8月安全更新（具体补丁编号可参考官方安全 advisories），或升级到Oracle WebCenter Content 12.2.1.3.0及以上版本。如无法立即应用补丁，可临时停用受影响的Content Server服务或通过防火墙限制对HTTP端口的访问，以降低攻击面。"
score = 8.2
severity = "HIGH"
sources = ["nuclei"]
title = "Oracle WebCenter Content未授权操作漏洞"
updated = "2026-06-17T00:59:34Z"

