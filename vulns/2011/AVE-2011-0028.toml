[basic]
description = "Mozilla Firefox 3.6.18 之前版本、Thunderbird 3.1.11 之前版本及 SeaMonkey 2.0.14 及之前版本中的 nsXULCommandDispatcher 函数存在释放后重用（Use-After-Free）漏洞。远程攻击者可通过构造特制的 XUL 文档，在脚本禁用状态下触发命令更新器出队操作，导致已释放的内存被重新访问，从而执行任意代码。该漏洞 CVSS 评分 10.0，危害等级严重，攻击无需身份认证且复杂度低，影响范围广泛。"
published = "2011-06-30T16:55:04Z"
remediation = "升级 Firefox 至 3.6.18 及以上版本，Thunderbird 至 3.1.11 及以上版本，SeaMonkey 至 2.0.14 以上版本。Debian 用户安装 DSA-2268-1（iceweasel 3.5.16-8）、DSA-2269-1（iceape 2.0.11-6）、DSA-2273-3（icedove 3.0.11-1+squeeze3）。临时缓解措施：在浏览器中禁用 XUL 脚本执行（设置 xpinstall.whitelist.required 为 true）或使用不受影响的 Firefox 4+/SeaMonkey 2.1+。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey XUL文档处理远程代码执行漏洞"
updated = "2026-06-16T23:26:46Z"

