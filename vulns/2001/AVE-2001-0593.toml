[basic]
description = "FreeBSD 及其他操作系统的 procfs 文件系统存在拒绝服务漏洞，本地攻击者可通过调用 mmap 系统调用映射进程自身的 mem 文件，导致内核挂起，造成系统拒绝服务。该漏洞影响 FreeBSD 等多款操作系统，攻击者需具备本地用户权限，无需认证即可触发，危害等级低。目前暂无官方补丁信息。"
published = "2001-02-12T05:00:00.000"
remediation = "立即应用 FreeBSD-SA-00:77 安全公告提供的 procfs 补丁，升级到包含该修复的 FreeBSD 版本（如 4.1-STABLE 或 4.2-RELEASE 之后版本）。如无法立即打补丁，可在 /etc/fstab 中将 procfs 挂载选项改为 noexec，或在不需要时卸载 procfs（`umount /proc`），限制本地用户对 procfs 的 mmap 调用权限作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "FreeBSD procfs 本地拒绝服务漏洞"
updated = "2026-06-16T21:53:35.060"

