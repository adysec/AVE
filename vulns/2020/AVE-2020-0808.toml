[basic]
description = "Fuel CMS 1.4.7 存在 SQL 注入漏洞，攻击者可在登录后通过向 /pages/items、/permissions/items、/navigation/items 及 /logs/items 等管理页面的 col 参数注入恶意 SQL 语句，利用时间盲注技术（如 SLEEP 函数）绕过认证检测，实现数据库信息窃取、数据篡改甚至完全控制数据库服务器。该漏洞无需用户交互，攻击复杂度低，CVSS 评分 9.8，危害等级严重。厂商已在 1.4.8 版本中修复此漏洞。"
published = "2020-08-13T13:15:17.357"
remediation = "立即将 FUEL CMS 升级至 1.4.8 版本，该版本已修复 /pages/items、/permissions/items 和 /navigation/items 路径中 col 参数的 SQL 注入漏洞。如暂无法立即升级，可在 Web 应用防火墙或反向代理层对上述路径的 col 参数实施输入过滤，禁止传入单引号、UNION、SELECT 等 SQL 关键字，并强制限制该参数为整数类型，作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Fuel CMS FUEL CMS SQL注入漏洞"
updated = "2026-06-17T02:58:58.307"

