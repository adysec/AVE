[basic]
description = "YaBB（Yet Another Bulletin Board）1 Gold SP1 及更早版本中的 YaBB.cgi 存在跨站脚本（XSS）漏洞。远程攻击者无需身份认证即可通过向 num 参数注入恶意脚本代码，当其他用户访问包含该参数的错误页面时，注入的脚本将在受害者浏览器中执行，导致敏感信息泄露、会话劫持或恶意操作。攻击条件简单，仅需构造特制 URL 诱使用户点击即可触发。"
published = "2002-10-04T04:00:00Z"
remediation = "升级 YaBB 至 1 Gold SP2 或更高版本，该版本已修复 YaBB.cgi 中 num 参数未过滤导致的 XSS 漏洞。如无法升级，编辑 YaBB.cgi 源码，对 num 参数进行 HTML 实体编码（如将 < 替换为 &lt;），或部署 WAF 规则拦截包含 <script> 等恶意标签的 num 参数请求。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "YaBB YaBB.cgi 跨站脚本漏洞"
updated = "2026-06-16T21:58:27Z"

