[basic]
description = "Novell Groupwise 5.5（含 sp1 和 sp2）存在系统策略实现错误，未经身份认证的远程攻击者可利用该漏洞访问服务器上的任意文件。由于策略处理机制存在缺陷，攻击者无需凭据即可绕过访问控制，读取敏感文件内容。该漏洞影响运行受影响版本的系统，攻击者通过网络发送特制请求即可触发，可能导致信息泄露。"
published = "2001-06-27T04:00:00Z"
remediation = "立即将 Novell GroupWise 客户端升级到 5.5 SP3 或更高版本，该版本已修复 GroupWise 未正确检查操作系统策略（Zen Policies 或 NT Policies）而允许任意文件访问的实现错误。如无法立即升级，请联系 Novell GroupWise 技术支持（http://support.novell.com）获取补丁文件，并在防火墙或代理层面限制 GroupWise 客户端对本地及网络驱动器的访问权限作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Novell Groupwise 5.5 任意文件访问漏洞"
updated = "2026-06-16T21:54:09Z"

