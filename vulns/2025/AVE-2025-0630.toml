[basic]
description = "Google Chrome 134.0.6998.35 之前版本的 Media Stream（媒体流）功能存在不当实现漏洞。远程攻击者可通过构造特制的 HTML 页面，诱导用户访问后获取目标系统上外设（如摄像头、麦克风等）的敏感信息，导致机密性泄露。该漏洞攻击复杂度低，无需特权，但需要用户交互（点击或访问恶意页面），CVSS 评分 6.5，危害等级中危。Google 已在 Chrome 134.0.6998.35 版本中修复此漏洞，Microsoft Edge 也同步修复。"
published = "2025-03-05T04:15:11Z"
remediation = "立即将 Google Chrome 升级至 134.0.6998.35 或更高版本（通过 chrome://settings/help 检查更新并重启浏览器）。使用 Microsoft Edge 的用户应升级至 134.0.3124.51 或更高版本。其他基于 Chromium 的浏览器请参照厂商提供的对应修复版本进行更新。如无法立即更新，可在浏览器设置中禁用未授权的外设访问权限作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome Media Stream 实现不当信息泄露漏洞"
updated = "2026-06-17T08:40:20Z"

