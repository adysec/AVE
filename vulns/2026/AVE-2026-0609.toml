[basic]
description = "Coder AI Bridge 代理端点存在授权校验缺陷（CWE-863），`coderd/aibridgedserver` 中的 `Server.IsAuthorized` 方法在验证 API 密钥时仅检查密钥格式、过期时间、密钥密文以及已删除或系统用户状态，但未校验用户账户是否处于暂停（suspended）状态。由于暂停操作不会自动吊销已签发的 API 密钥，被暂停用户的未过期令牌仍可继续调用 AI Bridge LLM 代理端点，消耗部署环境计费的付费提供商资源。攻击条件为拥有有效长期令牌的已暂停用户，影响 Coder v2.30.0 至 v2.32.6、v2.33.0 至 v2.33.7、v2.34.0 至 v2.34.1 版本。官方已在 v2.32.7、v2.33.8、v2.34.2 中修复，临时措施为暂停用户时通过 `DELETE /api/v2/users/{user}/keys` 手动删除其 API 密钥。"
published = "2026-07-07T19:16:54Z"
remediation = "立即升级 Coder 至 v2.34.2/v2.33.8/v2.32.7 或更高版本，该修复在 AI Bridge 授权中增加了对非活跃用户的检查。如无法立即升级，在暂停用户后立即通过 `DELETE /api/v2/users/{user}/keys` 接口删除其 API 密钥，防止已签发令牌继续使用。"
score = 5.4
severity = "MEDIUM"
sources = ["ghsa"]
title = "Coder AI Bridge 授权校验缺陷漏洞"
updated = "2026-07-09T16:16:44Z"

