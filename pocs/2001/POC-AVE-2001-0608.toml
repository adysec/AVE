[info]
author = "ave"
description = "phpGroupWare 0.9.7之前版本中phpgw.inc.php程序存在远程文件包含漏洞，攻击者可通过phpgw_info参数指定恶意远程文件，导致任意PHP代码执行。通过发送包含远程URL的GET请求验证漏洞是否存在。"
id = "POC-AVE-2001-0608"
name = "phpGroupWare phpgw.inc.php Remote File Inclusion PoC"
severity = "critical"
tags = ["ave-2001-0608"]
vuln_id = [
    "CVE-2001-0043",
    "AVE-2001-0608",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/phpgw.inc.php"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["phpGroupWare"]
