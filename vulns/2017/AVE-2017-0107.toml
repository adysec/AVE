[basic]
description = 'Fortinet FortiOS 5.4.0至5.4.4及5.6.0版本存在跨站脚本（XSS）漏洞。该漏洞源于FortiView模块下"Applications"页面的filter输入参数未对用户输入进行充分过滤和转义，导致具有低权限的认证攻击者可通过构造恶意请求注入任意JavaScript代码。当管理员或其他用户访问受影响页面时，注入的脚本会在浏览器中执行，可能导致敏感信息泄露、会话劫持或页面内容篡改。攻击者需要拥有有效的低权限账号并诱使用户访问特制链接，利用条件相对受限。CVSS评分5.4，危害等级中危。Fortinet已发布安全更新修复此漏洞。'
published = "2017-09-12T02:29:00Z"
remediation = "立即将 FortiOS 升级至 5.6.1 或更高版本。如无法立即升级，可在 FortiGate 管理界面中限制可访问 FortiView 模块的管理员 IP 范围，并禁用非必要的管理接口暴露到公网，以降低被利用风险。"
score = 5.4
severity = "MEDIUM"
sources = ["nuclei"]
title = "Fortinet FortiOS FortiView 跨站脚本攻击"
updated = "2026-06-17T01:17:34Z"

