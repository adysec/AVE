[basic]
description = "GNU Binutils 2.43 版本的 ld 组件中 bfd/elflink.c 文件的 _bfd_elf_gc_mark_rsec 函数存在内存损坏漏洞（CWE-119）。攻击者可利用特制 ELF 文件触发该漏洞，导致程序崩溃或潜在的内存数据破坏。该漏洞攻击复杂度较高，利用难度较大，但已有公开的利用方法披露。远程攻击者可通过诱导用户处理恶意构造的二进制文件触发此漏洞。补丁已提交至上游代码库，建议用户及时更新至修复版本。"
published = "2025-02-11T08:15:31Z"
remediation = "建议立即将 GNU Binutils 升级至包含 commit 931494c9a 的版本（≥2.44），或应用对应发行版安全更新（如 SUSE 通过 SUSE-SU-2025:4096-1 更新至 2.4）。对于无法立即升级的 aarch64 系统，避免使用 `-z gcs=implicit` 链接选项作为临时缓解措施。NetApp 用户应参考 ntap-20250425-0007 安装对应补丁。"
score = 2.3
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils ld 内存损坏漏洞"
updated = "2026-06-17T08:38:32Z"

