[basic]
description = "Linux 内核 rxrpc（RPC over Rx）协议模块存在拒绝服务漏洞。当内核接收到连接级别的中止信号时，虽然会设置传播标志，但不会唤醒该连接上的挂起调用来处理终止操作，导致这些调用因无后续输入而永久挂起。本地攻击者可在具备低权限条件下触发该连接中止，造成受影响的内核线程阻塞，导致系统资源耗尽或服务不可用。该漏洞影响使用 rxrpc 协议的 Linux 内核版本，CVSS 评分 5.5，危害等级中等。"
published = "2025-03-06T16:15:51Z"
remediation = "升级 Linux 内核至包含修复补丁的版本：Ubuntu 22.04 LTS 用户需升级 linux-image 至 6.8.0-64-generic 或更高版本（通过 apt upgrade linux-image-generic-hwe-22.04）；SUSE 用户需应用 SUSE-SU-2025:02307-1 安全补丁。其他发行版请升级到对应的最新稳定内核版本。升级后必须重启系统使新内核生效。如暂无法升级内核，可考虑禁用 rxrpc 内核模块（rmmod af_rxrpc）作为临时缓解措施，但会影响 AFS 文件系统等依赖该模块的服务。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 rxrpc 连接中断处理拒绝服务漏洞"
updated = "2026-06-17T08:14:31Z"

