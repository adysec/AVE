[basic]
description = "CVE-2001-0312是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-06-02T04:00:00Z"
remediation = "在WebSphere Application Server管理控制台中配置严格的主机别名列表，仅允许合法的虚拟主机通过插件访问，阻止包含非授权Host头的HTTP请求。同时将IBM WebSphere Plugin升级至修复该漏洞的Fix Pack版本，并在plugin-cfg.xml中启用严格的主机名验证参数。如无法立即升级，可在Netscape Enterprise Server前端配置访问控制规则，限制对JSP文件的直接访问。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "IBM WebSphere for Netscape Enterprise Server 信息泄露漏洞"
updated = "2026-06-16T21:54:04Z"

