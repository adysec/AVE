[basic]
description = "Adobe Flash Player 及 Adobe AIR 存在内存破坏漏洞（CWE-119），属于缓冲区边界操作限制不当问题。攻击者可通过诱导用户访问特制的 Flash 内容触发未指定的内存破坏，导致远程代码执行或拒绝服务。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上的 Flash Player 10.3.183.11 之前版本和 11.1.102.55 之前版本，以及 Adobe AIR 3.1.0.4880 之前版本。攻击无需身份认证，仅需用户浏览恶意网页即可触发，CVSS v2 评分 10.0，危害严重。Adobe 已在安全公告 APSB11-28 中发布修复版本。"
published = "2011-11-12T00:00:00Z"
remediation = "将 Adobe Flash Player 升级至 10.3.183.11（10.x 分支）或 11.1.102.55（11.x 桌面版）/ 11.1.102.59（Android 版），将 Adobe AIR 升级至 3.1.0.4880 及以上版本。由于 Adobe 已于 2020 年 12 月 31 日停止 Flash Player 支持并建议卸载，最彻底的修复方案是从系统中完全卸载 Flash Player 及 Adobe AIR，改用 HTML5 替代方案。如因遗留业务必须使用，应限制 Flash 内容仅在受控内网运行，并在浏览器中启用 Click-to-Play 插件策略，防止任意网站自动加载 Flash 内容触发漏洞。"
score = 9.8
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏漏洞"
updated = "2011-11-12T00:00:00Z"

