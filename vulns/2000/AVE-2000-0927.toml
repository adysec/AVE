[basic]
description = 'Bajie HTTP Web Server 0.30a 版本的示例 Java Servlet "test" 存在信息泄露漏洞。未经身份认证的远程攻击者可通过向目标服务器发送特制 HTTP 请求访问该示例 Servlet，触发其将 Web 文档根目录的真实物理路径以明文形式返回给攻击者。该漏洞影响所有运行 Bajie HTTP Web Server 0.30a 版本的 Linux/Unix 系统，攻击者无需任何凭据即可在极低复杂度下利用此漏洞获取服务器文件系统结构等敏感信息，为后续渗透攻击提供有价值的 reconnaissance 数据。由于该示例 Servlet 随服务器安装包默认部署且未受访问控制保护，攻击条件极为宽松，仅需目标服务器网络可达即可完成利用，CVSS v2 评分 5.0，危害等级中等。'
published = "2000-10-20T04:00:00.000"
remediation = '删除 Bajie HTTP WebServer 0.30a 安装目录下的示例 Servlet "test" 文件或将其从 Web 应用部署中移除，防止通过访问 test servlet 泄露 Web 文档根目录的绝对路径。如无法移除，应通过服务器配置文件禁用该示例 Servlet 的访问，并将 Web 文档根目录设置为不含敏感路径信息的自定义目录。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Bajie Webserver 绝对路径泄露漏洞"
updated = "2026-06-16T21:52:27.193"

