[basic]
description = "Oracle Listener 默认安装配置存在安全漏洞，远程未授权攻击者可通过向 Oracle TNS Listener 服务发送特制的 SET TRC_FILE 或 SET LOG_FILE 命令，将日志信息追加到任意文件，甚至执行任意系统命令。该漏洞影响 Oracle 7.3.4、8.0.6 和 8.1.6 版本，无需身份认证即可远程利用，CVSS 评分 10.0，可导致目标系统完全失密。"
published = "2000-12-19T05:00:00.000"
remediation = "立即升级 Oracle Database 到 8.1.7 或更高推荐版本（如 11g/12c），该漏洞在 8.1.7 中已修补。升级前可临时缓解：在 listener.ora 中添加 ADMIN_RESTRICTIONS_LISTENER 参数禁止远程管理命令，同时配置防火墙仅允许受信 IP 访问 1521 端口，并通过 lsnrctl 设置监听器密码保护。旧版本 7.3.4、8.0.6、8.1.6 已停止支持，强烈建议迁移至受支持的现代版本。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Oracle Listener SET TRC_FILE/SET LOG_FILE 命令执行漏洞"
updated = "2026-06-16T21:52:32.423"

