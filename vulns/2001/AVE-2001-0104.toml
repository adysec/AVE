[basic]
description = "CVE-2001-0264是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-06-18T04:00:00Z"
remediation = "升级到 Gene6 官方发布的修复版本（BPFTP Server 后续版本），或改用最新版 BPFTP Server 以修复 NETBIOS 凭证泄露漏洞。将 FTP 服务运行账户从域账户/管理员账户改为本地低权限账户，限制其对网络共享的访问权限。在防火墙或入站规则中限制 FTP 服务器向外部发起的 SMB/CIFS 连接（TCP 139、445 端口），防止凭据被转发至外部主机。如业务无需访问网络共享，请在服务器配置中禁用 UNC 路径支持，避免 FTP 服务器触发外部 SMB 连接。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Gene6 BPFTP FTP Server 用户凭证泄露漏洞"
