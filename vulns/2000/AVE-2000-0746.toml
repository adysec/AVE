[basic]
description = "Cisco Secure PIX Firewall 5.2(2)及更早版本中的邮件防护（mailguard）功能未能正确限制对SMTP命令的访问权限，存在安全规避漏洞。远程攻击者可通过先发送DATA命令，再发送被限制的SMTP命令（如HELP等）的方式绕过内容过滤机制，从而执行本应被禁止的SMTP命令，可能导致信息泄露或进一步攻击。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响Cisco PIX防火墙4.x及5.x系列版本。"
published = "2000-12-11T05:00:00.000"
remediation = "升级 Cisco PIX 防火墙软件至 5.2(3) 或更高版本，该版本已修复 mailguard 功能对 SMTP 命令的过滤绕过问题。由于 Cisco PIX 防火墙系列已停产且停止技术支持，建议迁移至 Cisco ASA 系列防火墙，并启用应用层流量检测功能以替代 mailguard 的 SMTP 过滤。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Cisco Secure PIX Firewall SMTP内容过滤绕过漏洞"
updated = "2026-06-16T21:52:59.423"

