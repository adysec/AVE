[basic]
description = 'MyHelpDesk 20020509 版本的 index.php 存在 SQL 注入漏洞，远程攻击者无需身份认证即可通过向 detailticket、editticket 或 updateticketlog 操作的 "id" 参数注入恶意 SQL 代码，实现对数据库的未授权查询与篡改，导致敏感信息泄露或数据破坏。攻击条件简单，仅需目标系统运行存在漏洞的 MyHelpDesk 版本且 Web 服务可访问。'
published = "2002-10-04T04:00:00Z"
remediation = "建议升级 MyHelpDesk 至最新版本；如已停止维护，应迁移至其他受支持的工单系统。若无法立即替换，需对 index.php 中 detailticket、editticket、updateticketlog 操作的 id 参数实施严格的输入过滤，使用参数化查询（Prepared Statement）替代字符串拼接，并在 Web 应用防火墙（WAF）层面添加 SQL 注入拦截规则作为临时缓解措施。"
score = 6.4
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Luis Bernardo MyHelpDesk 20020509 SQL注入漏洞"
updated = "2026-06-16T21:58:24Z"

