description = "标签内，但skill说输出必须是纯TOML。我需要重新阅读skill：它说“下文所有 TOE、PoC、EXP 输出**必须且仅包含纯 TOML 文本**”，但这里只要求description字段，不是完整的TOML。用户说“最终答案必须放在一对 <value>..."
published = "2025-02-27T03:15:12Z"
remediation = "升级 Linux 内核至包含修复补丁的稳定版本。对于主线内核，升级到 6.6-rc4 或更高版本（含提交 9c1284f87978987982373948703a7c799662175c）；对于发行版，Ubuntu 用户执行 sudo apt update && sudo apt upgrade linux-image-generic 安装 USN-7511-1 或更高版本补丁，Debian 用户通过 sudo apt update && sudo apt upgrade linux-image-$(uname -r) 应用 DLA-4102-1/DLA-4178-1 安全更新，Red Hat/EulerOS 用户通过 yum update kernel 或 dnf update kernel 升级至已修复版本，Amazon Linux 2 用户升级至 kernel-5.10.235-227.919 或更高版本。若无法立即重启升级内核，该漏洞仅影响本地低权限攻击场景且仅可导致拒绝服务，可暂时降低风险优先级处理。"
score = 5.5
