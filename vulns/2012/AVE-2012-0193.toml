[basic]
description = "Oracle MySQL Server 5.5.23及之前版本的Server Optimizer组件中存在未指定的安全漏洞。远程认证用户可通过向数据库服务器发送特制的查询请求，利用优化器在处理查询计划时的未知向量，导致MySQL服务进程崩溃或进入不可用状态，造成拒绝服务。该漏洞无需特殊权限即可远程利用，攻击复杂度低，影响数据库服务的可用性。Oracle已在2012年7月的关键补丁更新中修复此漏洞，建议升级至MySQL 5.5.24及以上版本。"
published = "2012-07-17T22:55:01.740"
remediation = "升级 MySQL 5.5 至 5.5.24 或更高版本，或升级至 MySQL 5.6.x 系列。如无法立即升级，可在 my.cnf 中设置 optimizer_prune_level=1 和 optimizer_search_depth=62 限制优化器搜索深度，降低触发拒绝服务的风险；同时通过 max_user_connections 和 max_connections 限制数据库用户的并发连接数，减少攻击面。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Oracle MySQL Server Server Optimizer 拒绝服务漏洞"
updated = "2026-06-16T23:40:12.383"

