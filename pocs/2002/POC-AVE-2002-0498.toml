[info]
author = "AVE"
description = "检测 Internet Explorer 5.5/6.0 Web Folder 组件通过 mhtml: URL 协议处理程序导致的远程代码执行漏洞。攻击者可通过特制网页触发该漏洞。"
id = "POC-AVE-2002-0498"
name = "Microsoft Internet Explorer Web Folder MHTML URL Handler RCE PoC"
severity = "high"
tags = [
    "cve-2002-0980",
    "mhtml",
    "internet-explorer",
    "web-folder",
]
vuln_id = [
    "CVE-2002-0980",
    "AVE-2002-0498",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cve-2002-0980-poc.html"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["mhtml"]
