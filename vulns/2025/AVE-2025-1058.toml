[basic]
description = "Linux 内核 ksmbd 的 SMB2_LOCK 请求处理函数 smb2_lock 中存在释放后使用漏洞。当 smb_lock->zero_len 字段有值时，smb_lock 链表节点未被正确删除，导致错误处理例程引用已被释放的旧 flock 结构体，造成内存被重复释放或非法访问。该漏洞影响运行 Linux 内核且启用 ksmbd 服务的系统，具有低权限的网络攻击者可通过发送特制 SMB2 请求触发，成功利用可导致系统被完全接管。CVSS 评分 8.8，危害等级为高。该漏洞已在后续 Linux 内核版本中得到修复。"
published = "2025-04-01T16:15:25Z"
remediation = "将 Linux 内核升级至已修复版本：6.1.131、6.6.83、6.12.19 或 6.13.7 及以上。具体操作：使用包管理器（如 apt、yum、dnf）更新内核包并重启系统；若当前运行自编译内核，请从 https://git.kernel.org/stable/c/410ce35a2ed6d0e114132bba29af49b69880c8c7 拉取补丁重新编译。如暂无法升级，可通过防火墙阻断 TCP/445 端口的 SMB 访问作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 ksmbd 释放后重用漏洞"
updated = "2026-07-30T06:21:58Z"

