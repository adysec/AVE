[basic]
description = "Borland/Inprise Interbase 4.0、5.0 及 6.0 版本数据库服务器中存在一个硬编码后门账户，该账户由开发者有意预留，具有最高数据库权限。远程攻击者无需身份认证即可通过网络连接利用该后门账户登录数据库，随后通过调用存储过程覆盖服务器上的任意文件，实现完全控制目标系统。该漏洞影响所有使用上述版本 Interbase 的服务器，CVSS 评分 10.0，危害等级严重。厂商已在后续版本中移除此后门账户。"
published = "2001-02-12T05:00:00Z"
remediation = "立即升级 Borland/Inprise Interbase 至 6.0.1 或更高版本，该版本已移除硬编码后门账号。如无法升级，可手动删除 jrd/pwd.h 中定义的 LOCKSMITH_USER（politically）和 LOCKSMITH_PASSWORD（correct）后门凭据，重新编译服务端。临时缓解措施：在防火墙上限制对 Interbase 默认端口 3050 的访问，仅允许受信 IP 连接。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Borland Inprise Interbase 后门账户远程任意文件覆写漏洞"
updated = "2026-06-16T21:53:28Z"

