[basic]
description = "Microsoft Internet Explorer 4.0 至 6.0 版本中存在 XML Datasource Applet 文件泄露漏洞。远程攻击者可通过构造恶意网页，利用 com.ms.xml.dso.XMLDSO.class 遗留 XML 数据源小程序的特性，将基础 URL 修改为指向本地系统路径，从而绕过同源策略限制，读取目标系统上的任意文件。攻击者只需诱导用户访问恶意网页即可触发，无需任何身份认证，可能导致敏感信息泄露。"
published = "2002-09-24T04:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS02-047 提供的 Internet Explorer 累积补丁 Q323759。IE 5.01 用户需在 Windows 2000 SP2/SP3 上安装；IE 5.5 用户需升级至 SP1 或 SP2 后安装；IE 6.0 用户直接安装。该补丁修复了 XML 数据源重定向绕过跨域安全模型的问题，使 IE 拒绝打开重定向到站点外部的 XML 数据。如无法安装补丁，可禁用 Internet Explorer 中的 ActiveX 控件执行权限，或将所有不受信任的网站加入受限站点区域，同时使用 Outlook Express 6.0 或 Outlook 2002（默认在受限站点区域打开 HTML 邮件）以降低邮件攻击面。"
score = 6.4
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer XML Datasource Applet 文件泄露漏洞"
updated = "2026-06-16T21:58:29.740"

