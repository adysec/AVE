[basic]
description = "Abuse 2.00 及更早版本中存在本地缓冲区溢出漏洞，由于程序在处理 `-net` 命令行参数时未正确验证输入长度，本地攻击者可通过向该参数传递超长字符串触发缓冲区溢出，从而获得 root 权限。该漏洞影响 Abuse 2.00 及之前版本，攻击者需拥有本地系统访问权限，无需身份认证即可利用，CVSS 评分 7.2，危害等级高。"
published = "2002-11-12T05:00:00.000"
remediation = "立即升级 Abuse 至 2.00 以上版本（如已停止维护则卸载该软件包）。临时缓解措施：执行 `chmod u-s /usr/lib/games/abuse/abuse.console` 移除 setuid root 权限位，防止本地用户通过 `-net` 参数触发缓冲区溢出提权。如非必要，建议直接 `apt-get remove abuse` 彻底卸载。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Abuse 2.00 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:59:00.143"

