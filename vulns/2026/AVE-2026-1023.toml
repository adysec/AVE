[basic]
description = "Apple 多款操作系统存在内存处理不当漏洞（CWE-119），由于未对恶意制作的图像文件进行充分验证，攻击者可构造特制图像诱导用户通过本地应用程序打开或预览，从而触发内存损坏并实现任意代码执行。该漏洞影响 iOS、iPadOS、macOS Sequoia、macOS Tahoe、tvOS 及 visionOS 等多个系统版本，CVSS 评分 7.8，危害等级高。攻击者需在目标设备上具备本地访问权限，且需用户交互才能完成利用。Apple 已在 iOS 26.6、iPadOS 26.6、macOS Sequoia 15.7.8、macOS Tahoe 26.6、tvOS 26.6 及 visionOS 26.6 中修复此问题。"
published = "2026-07-27T21:16:57.487"
remediation = "立即将 iOS/iPadOS 升级至 26.6、macOS Sequoia 升级至 15.7.8、macOS Tahoe/tvOS/visionOS 升级至 26.6。如暂无法升级，应避免打开来源不明的图片文件，并启用系统沙盒限制以降低攻击面。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Apple iOS 及多平台操作系统图像处理内存损坏漏洞"
updated = "2026-07-29T20:25:07.387"

