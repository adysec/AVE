[basic]
description = "Microsoft IIS 5.0 在启用 Index Server 且设置 Index 属性的情况下存在配置错误漏洞。远程攻击者可通过 WebDAV 搜索功能向目标服务器发送特制请求，利用该配置缺陷枚举 Web 根目录下的文件目录结构，导致敏感信息泄露。攻击无需身份认证，攻击复杂度低，仅需网络访问即可实施。该漏洞影响 Microsoft IIS 5.0 版本，CVSS 评分 5.0，危害等级中危。"
published = "2000-12-19T05:00:00.000"
remediation = '升级到受支持的 Windows Server 版本（如 2008 以上），或卸载 Indexing Service 组件；在 IIS 管理器中取消网站目录的"索引此资源"属性；禁用 WebDAV 扩展（删除 WebDAV 映射或通过 URLScan 过滤 HTTP 的 SEARCH/PROPFIND 方法）。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft IIS 5.0 索引目录泄露漏洞"
updated = "2026-06-16T21:52:50.413"

