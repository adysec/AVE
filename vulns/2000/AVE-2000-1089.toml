[basic]
description = "Midnight Commander（mc）4.5.42 及更早版本中的 cons.saver 程序未能正确验证输出文件描述符是否为 TTY，存在符号链接漏洞。本地攻击者可通过创建指向目标文件的符号链接，调用 mc 并将该链接指定为 TTY 参数，导致 cons.saver 将输出写入任意文件，从而破坏系统文件或用户数据。攻击需要本地访问权限，无需认证，攻击复杂度较低。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 Midnight Commander 至 4.5.43 或更高版本。Debian 用户应安装 DSA-2000-11-25 提供的更新包；Mandrake Linux 用户应安装 MDKSA-2000-078 安全更新。如无法升级，避免在不可信环境中以 root 权限运行 mc，并限制本地用户创建符号链接的能力作为临时缓解。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Midnight Commander cons.saver 符号链接文件破坏漏洞"
updated = "2026-06-16T21:53:09Z"

