[basic]
description = "Linux 2.2.19 之前版本的内核在 x86 架构上存在用户空间访问汇编代码缺陷，部分内存操作函数复制了错误的字节数，导致内核内存被意外修改。本地攻击者可通过精心构造的系统调用触发该漏洞，实现内存越界写入，进而可能提升权限或导致系统崩溃。该漏洞影响所有使用 x86 架构的 Linux 系统，攻击者需具备本地访问权限，攻击复杂度低。"
published = "2001-04-17T04:00:00Z"
remediation = "升级 Linux 内核至 2.2.19 或更高版本，该版本修复了 x86 架构用户空间访问汇编指令中字节数复制错误的问题。如无法立即升级内核，可限制本地用户对系统的交互式访问权限作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Linux Kernel x86架构用户访问汇编错误漏洞"
updated = "2026-06-16T21:56:11Z"

