[basic]
description = "MetaProducts Offline Explorer 1.4 之前版本（含 1.x 系列）存在文件系统信息泄露漏洞，由于程序在处理下载请求时未对 URL 中的驱动器标识符进行有效过滤，未经身份认证的远程攻击者可在请求中指定目标系统驱动器盘符（如 C:），直接读取受感染主机上的目录结构及文件内容。该漏洞影响 Windows 平台下运行的所有受影响版本，攻击者仅需向默认监听端口 800 发起简单的 HTTP GET 请求即可触发，无需任何身份验证或交互，从而泄露敏感文件信息。"
published = "2001-02-16T05:00:00.000"
remediation = "建议立即升级 MetaProducts Offline Explorer 至 1.4 Service Release 2 或更高版本，该版本已修复文件系统泄露漏洞。若暂时无法升级，请在 Web 服务器或防火墙层面配置规则拦截包含盘符路径（如 C:、D:）的异常 URL 请求，并限制应用程序对本地文件系统的访问权限。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "MetaProducts Offline Explorer 1.x 任意文件读取漏洞"
updated = "2026-06-16T21:53:32.243"

