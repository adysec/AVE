[basic]
description = "Samba 2.0.7 中的 Web 管理工具 SWAT（Samba Web Administration Tool）存在用户名枚举漏洞。当远程攻击者尝试登录时，SWAT 对有效用户名和无效用户名返回不同的错误提示信息，攻击者无需认证即可通过对比响应差异逐个枚举服务器上的有效系统用户。该漏洞可被用于信息收集阶段，为后续针对性攻击（如密码爆破）提供目标用户列表，危害等级中等。官方建议升级至 Samba 2.0.8 或更高版本以修复此问题。"
published = "2000-12-19T05:00:00Z"
remediation = "升级 Samba 至 2.0.8 或更高版本，该版本修复了 SWAT 返回不同错误信息导致用户名枚举的问题。如无法升级，可禁用 SWAT 服务（删除或重命名 /etc/swat 配置文件，或注释 inetd.conf 中 swat 行后重启 inetd/xinetd），并在防火墙限制对 SWAT 端口（901/TCP）的访问，仅允许受信管理 IP 连接。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Samba Samba Web Administration Tool 用户枚举信息泄露漏洞"
updated = "2026-06-16T21:52:48Z"

