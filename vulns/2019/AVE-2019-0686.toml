[basic]
description = 'Docker Desktop Community Edition 2.1.0.1 之前版本存在不安全的权限分配漏洞（CWE-732）。低权限用户可将特制的恶意 docker-credential-wincred.exe 文件放置于 %PROGRAMDATA%\DockerDesktop\version-bin\ 目录中，当管理员或服务用户执行 Docker 认证、重启 Docker 或运行 docker login 命令时，该恶意程序将被触发执行，导致权限提升。攻击者借此可获得与目标用户同等的系统权限，实现本地提权攻击。该漏洞 CVSS 评分 7.8，危害等级高。'
published = "2019-08-28T21:15:10Z"
remediation = '升级 Docker Desktop Community Edition 至 2.1.0.1 或更高版本。同时限制 %PROGRAMDATA%\DockerDesktop\version-bin\ 目录的写入权限，仅允许管理员账户修改该目录内容，防止低权限用户植入恶意文件。建议启用 Windows Defender 或第三方 EDR 对 docker-credential-wincred.exe 的异常加载行为进行监控。'
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Docker Desktop Community Edition 本地权限提升漏洞"
updated = "2026-06-17T02:21:00Z"

