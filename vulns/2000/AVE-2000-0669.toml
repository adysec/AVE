[basic]
description = '标签之间。<value>PHPix Photo Album 1.0.2 及更早版本存在目录遍历漏洞。未经身份认证的远程攻击者可通过在请求中使用"../"（点斜杠）路径穿越序列，绕过应用程序的目录限制，读取服务器上的任意文件。该漏洞影响所有部署了受影响版本 PHPix Photo Album 的网站，攻击者只需向目标服务器发送包含目录穿越字符的特制 HTTP 请求即可利用，无需身份验证且利用条件简单，可能导致敏感配置文件（如数据库配置文件、密码文件等）泄露。'
published = "2000-12-19T05:00:00.000"
remediation = "立即停止使用已停止维护的 PHPix 1.0 版本并迁移至现代相册软件。若无法迁移，须在 Web 服务器层配置访问控制限制，或修改源代码对输入参数进行严格过滤，剔除 `../` 等路径遍历字符，防止攻击者通过点点斜杠访问任意系统文件。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "phpix PHPix Photo Album 目录遍历漏洞"
updated = "2026-06-16T21:52:46.000"

