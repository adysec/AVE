[basic]
description = "CVE-2001-0357是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-08-22T04:00:00Z"
remediation = '立即升级 FormMail.pl 至 1.9 或更高版本（原作者于 2001 年 8 月发布），新版本通过 @recipients 数组对收件人地址进行白名单校验，可阻止未授权邮件发送。在脚本配置中将 @recipients 定义为仅允许接收邮件的地址或域名列表（如 @recipients = ("^user\@example.com", "example.com")）。同时修复 check_url 子例程中的逻辑缺陷：将 else 分支中的 $check_referer = 1 改为 0，防止无 HTTP_REFERER 头时绕过验证。如暂时无法升级，可通过 Web 服务器配置（如 Apache .htaccess）限制对 FormMail.pl 的访问仅来自指定域名，并禁用 GET 方法以降低被滥用的风险。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "FormMail FormMail.pl 远程发送匿名邮件漏洞"
