[basic]
description = "Red Hat Linux 6.2 系统中的 restore 工具（版本 0.4b15 及更早版本）存在本地权限提升漏洞。该工具在处理备份恢复时信任 RSH 环境变量指定的路径名，未对程序路径进行有效验证。攻击者可通过修改 RSH 环境变量将其指向精心构造的特洛伊木马程序，当 restore 工具调用远程 shell 执行备份恢复操作时，将以 root 权限执行攻击者控制的恶意程序，从而获得系统最高权限。该漏洞影响 Red Hat Linux 6.2 系统上使用 restore 和 dump 工具的本地用户，攻击者需具备本地登录权限才能利用。CVSS 评分 7.2，危害等级高。Red Hat 已通过后续安全更新修复此问题。"
published = "2001-01-09T05:00:00.000"
remediation = "升级 restore 软件包至 0.4b16 或更高版本（Red Hat 官方已发布对应安全更新），或在 /etc/profile 及 /etc/bashrc 中强制设置 RSH=/bin/true，防止 restore 程序调用非预期的外部程序。临时缓解措施包括：限制非特权用户对 restore 命令的执行权限，或通过 sudoers 配置仅允许可信用户运行 restore。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Red Hat Linux 6.2 restore 本地权限提升漏洞"
updated = "2026-06-16T21:53:12.120"

