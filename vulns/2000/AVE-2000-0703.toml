[basic]
description = "HP-UX 11.00/10.20 的 crontab 工具存在符号链接跟随漏洞（CWE-59）。本地攻击者可通过 crontab -e 选项创建会话，在编辑过程中将临时文件替换为指向目标文件的符号链接，退出会话后 crontab 会读取该符号链接指向的文件并将错误信息返回给攻击者，从而实现对任意文件的读取。该漏洞影响 HP-UX 10.20 和 11.00 版本，CVSS 评分 5.5，危害等级中危。攻击者需拥有本地访问权限，利用难度较低。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 HP-UX 至 11.11（11i v1）或更高版本，或安装对应补丁包 PHCO_24672（11.00）和 PHCO_24671（10.20）。如无法升级，在 /var/adm/cron/cron.allow 中严格限制 crontab 使用用户白名单，移除 crontab 的 setuid 位（chmod u-s /usr/bin/crontab）作为临时缓解措施，并监控 /tmp 目录的符号链接创建行为。"
score = 5.5
severity = "MEDIUM"
sources = ["avd"]
title = "HP HP-UX crontab 任意文件读取漏洞"
updated = "2026-06-16T21:52:53.140"

