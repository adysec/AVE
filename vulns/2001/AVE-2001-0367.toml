[basic]
description = 'Icecast 1.3.7 及 1.3.11 之前版本在启用 HTTP 文件流支持时存在拒绝服务漏洞。远程攻击者可通过向目标服务器发送以 .（点）、/（正斜杠）或 \（反斜杠）结尾的特制 URL 请求，触发服务器崩溃，导致服务不可用。该漏洞源于 Icecast 对畸形文件名路径处理不当，无需身份认证即可远程利用，攻击复杂度低。已在 Icecast 1.3.11 版本中修复。'
published = "2001-06-26T04:00:00Z"
remediation = '升级 Icecast 至 1.3.11 或更高版本，该版本修复了特制 URL 结尾包含 . / \ 字符导致服务崩溃的拒绝服务漏洞。如无法升级，可在配置中禁用 HTTP 文件流式传输支持（HTTP server file streaming）作为临时缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Icecast HTTP Server 拒绝服务漏洞"
updated = "2026-06-16T21:55:33Z"

