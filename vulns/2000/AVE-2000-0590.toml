[basic]
description = "Netwin Netauth 4.2e 及更早版本中的 netauth.cgi 程序存在目录遍历漏洞。远程攻击者可通过在 URL 参数中构造 `..`（点点）序列绕过路径限制，读取服务器上任意文件，如 `/etc/passwd` 等敏感配置文件。该漏洞无需身份认证即可利用，攻击复杂度低，影响 Netwin Netauth 认证系统的机密性。厂商未发布官方补丁，建议升级或限制访问。"
published = "2000-10-20T04:00:00.000"
remediation = '立即升级 NetWin Netauth 至 4.2f 或更高版本（4.2f 于 2000-06-27 发布，新增 allow../ 设置并禁止 ../ 和 ..\ 出现在用户名中）。如无法升级，在 netauth.ini 中将 allow../ 设为 false，并在 Web 服务器（如 Apache/IIS）层面配置 URL 重写规则，拦截包含 ../ 的 page 参数请求。同时限制 netauth.cgi 的 page 参数仅允许访问指定目录下的文件。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Netwin Netauth 目录遍历漏洞"
updated = "2026-06-16T21:52:28.203"

