[basic]
description = "cURL 6.1 至 7.4 之前版本及 curl-ssl 6.0-1.2 之前版本存在缓冲区溢出漏洞。远程攻击者可通过构造超长错误消息触发该漏洞，导致任意命令执行，可完全控制目标系统。攻击无需身份认证且复杂度低，危害严重。受影响版本需升级至 curl 7.4 或 curl-ssl 6.0-1.2 以上版本修复。"
published = "2000-12-19T05:00:00Z"
remediation = "升级至 curl 7.4.1 或更高版本。curl 6.0 至 7.4 版本在处理恶意 FTP 服务器的错误响应时存在栈缓冲区溢出，攻击者可远程执行任意命令。建议立即升级到 curl 7.4.1+，或避免使用 curl 连接不可信的 FTP 服务器作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "cURL curl 及 curl-ssl 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:52:53Z"

