[basic]
description = "XMail 是一款开源邮件服务器软件，其 CTRLServer 远程管理组件在处理 cfgfileget 和 domaindel 函数请求时存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标系统的 CTRLServer 端口发送包含特制超长数据的恶意请求，触发缓冲区溢出并执行任意操作系统命令。该漏洞影响 XMail 0.5 和 0.6 版本，由于攻击可通过网络远程发起且无需任何凭据，利用条件简单，CVSS 评分为满分 10.0，危害等级为严重。成功利用该漏洞将导致攻击者完全控制邮件服务器，进而可窃取邮件数据、篡改邮件配置或进一步对内网进行横向渗透。"
published = "2001-05-03T04:00:00Z"
remediation = "建议立即停止使用已停止维护的 Xmail 0.5/0.6 版本，迁移至 Postfix 或 Exim 等现代安全邮件服务器。若无法立即迁移，必须在防火墙中禁用或严格限制 CTRLServer 监听端口的外部访问，以阻断远程利用路径。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "XMail CTRLServer 缓冲区溢出远程命令执行漏洞"
updated = "2026-06-16T21:53:51Z"

