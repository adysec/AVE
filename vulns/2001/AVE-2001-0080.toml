[basic]
description = "CVE-2001-0205是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-05-03T04:00:00.000"
remediation = 'AOLserver 3.2 及更早版本未对路径中的连续三个点（...）进行安全检查，攻击者可利用该漏洞遍历目录读取敏感文件。建议立即升级至 AOLserver 3.5.1 或更高版本（4.0 GM 及以上），后续版本已修复对多连续点的路径校验逻辑。若短期内无法升级，可在前置反向代理（如 Nginx）中配置正则匹配拒绝包含连续三个点的请求路径，或在防火墙层面拦截包含 "..." 的 HTTP 请求 URI，作为临时缓解措施。同时应检查 Web 根目录权限，确保敏感配置文件（如 nsd.conf、数据库连接文件）不在 Web 可访问路径下，限制 AOLserver 进程对系统目录的读取权限。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "AOLserver 3.2 目录遍历漏洞"
updated = "2026-06-16T21:53:52.763"

