[basic]
description = "Apple iOS、iPadOS 及 macOS 内核存在类型混淆漏洞（CWE-843），源于状态处理不当导致使用不兼容类型访问资源。本地攻击者可通过诱导用户安装并运行恶意应用程序触发该漏洞，利用类型混淆绕过内核防护，在内核权限下执行任意代码，实现权限提升。该漏洞影响 iOS 14.4 之前版本、iPadOS 14.4 之前版本、macOS Big Sur 11.2 之前版本，以及 Catalina 和 Mojave 相关安全更新前的版本。CVSS 3.1 评分 7.8（HIGH），攻击向量为本地（AV:L），无需权限（PR:N）但需用户交互（UI:R），机密性/完整性/可用性均高影响（C:H/I:H/A:H）。Apple 已确认该漏洞在野被利用，于 2021 年 1 月发布安全更新修复。"
published = "2021-08-24T19:15:15Z"
remediation = "立即将 iOS/iPadOS 设备升级至 14.4 或更高版本，macOS 设备升级至 Big Sur 11.2 或更高版本。如无法立即升级，请在「系统偏好设置」→「安全性与隐私」中启用 Gatekeeper 并限制安装来源仅为 App Store 已知应用，同时避免安装来源不明的应用程序，以降低被利用的风险。Catalina 和 Mojave 用户请安装 Security Update 2021-001 和 2021-006。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Apple iOS iPadOS 类型混淆漏洞"
updated = "2026-06-17T03:51:03Z"

