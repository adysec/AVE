[basic]
description = 'Virtual Visions FTP浏览器中的ftp.pl CGI程序存在目录遍历漏洞。远程攻击者通过在URL中注入".."（点点斜线）序列，可突破Web文档根目录限制，读取服务器上任意目录下的文件。该漏洞源于程序未对用户输入的路径参数进行充分过滤和规范化处理，导致攻击者能够利用路径回溯符向上跳转目录层级。攻击者无需身份认证即可通过HTTP请求利用此漏洞，获取敏感配置文件、系统信息或其他受保护资源，可能导致进一步的信息泄露和权限提升。受影响的软件版本为Virtual Visions FTP浏览器中集成的ftp.pl CGI程序。'
published = "2000-07-12T04:00:00Z"
remediation = "立即删除或禁用服务器上的 ftp.pl CGI 脚本，或限制其访问权限仅允许授权用户使用。如厂商已发布补丁版本，请升级至最新版；若产品已停止维护，建议替换为其他受支持的 FTP 浏览器解决方案，并在 Web 服务器层面配置输入过滤，阻止包含 `..` 的路径遍历请求。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Virtual Visions FTP浏览器 ftp.pl CGI程序目录遍历漏洞"
updated = "2026-06-16T21:52:14Z"

