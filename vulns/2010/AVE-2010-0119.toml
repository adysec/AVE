[basic]
description = "RealNetworks RealPlayer 11.0 至 11.1 及 RealPlayer SP 1.0 至 1.1.4 在 Windows 平台上处理 QCP 音频内容时存在堆缓冲区溢出漏洞。远程攻击者可通过构造包含超大尺寸值的恶意 QCP 音频文件，诱导用户播放触发堆溢出，进而在用户上下文中执行任意代码。该漏洞影响 Windows 平台上的 RealPlayer 多个版本，CVSS 评分 9.3（AV:N/AC:M/Au:N/C:C/I:C/A:C），攻击向量为网络、攻击复杂度中等、无需身份认证、机密性/完整性/可用性均完全受损。攻击者需诱导受害者打开恶意 QCP 文件或访问嵌入恶意 QCP 内容的网页，利用方式为构造畸形 QCP 文件触发堆溢出实现远程代码执行。RealNetworks 已在 RealPlayer SP 12.0.0.879 及更高版本中修复该漏洞。"
published = "2010-08-30T20:00:01Z"
remediation = "建议立即升级 RealPlayer 至 SP 12.0.0.879 或更高版本（官网下载最新版）。若暂时无法升级，建议在浏览器中禁用 RealPlayer ActiveX 插件（IE 管理加载项中禁用 RealPlayer Browser Record Plugin 等），并禁止打开不可信的 .qcp 文件作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer QCP 音频解析堆缓冲区溢出漏洞"
updated = "2026-06-16T23:15:31Z"

