[basic]
description = "AnalogX Proxy Server 4.04及更早版本中存在缓冲区溢出漏洞，远程攻击者可通过向POP3协议发送超长的USER命令触发该漏洞，导致代理服务程序崩溃，造成拒绝服务。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响使用AnalogX Proxy Server的所有系统。"
published = "2000-07-25T04:00:00Z"
remediation = "建议立即将 AnalogX Proxy 升级至 4.05 及以上版本（当前最新为 4.15），可从 analogx.com 下载更新。如无法升级，可在防火墙中限制对 POP3 端口（110）的访问，仅允许受信任 IP 连接，并限制 USER 命令输入长度以缓解缓冲区溢出风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "AnalogX Proxy Server POP3 USER 命令缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:12Z"

