[basic]
description = "OpenSSH 1.2.x 的 scp 客户端存在目录遍历漏洞，远程恶意 scp 服务器可通过在文件名中包含 ..（点点）序列，在客户端执行 scp 下载操作时覆盖客户端任意文件。攻击者只需搭建恶意 SSH 服务器并诱导受害者使用 scp 命令连接下载文件即可触发，无需认证。该漏洞影响 OpenSSH 1.2 系列版本，CVSS 评分 5.0，危害等级中危，可导致任意文件被覆盖，进而可能实现代码执行或系统控制。"
published = "2000-12-19T05:00:00.000"
remediation = "建议升级至 OpenSSH 3.0 及以上版本，该漏洞已在后续版本中修复。如无法升级，应禁用 scp 命令并改用 sftp 或 rsync 替代文件传输，同时在 sshd 配置中限制 scp 路径访问权限。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "OpenSSH scp 目录遍历文件覆盖漏洞"
updated = "2026-06-16T21:52:55.680"

