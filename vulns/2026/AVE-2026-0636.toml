[basic]
description = "Craft CMS 存在 Twig 模板注入漏洞，版本 5.9.0 至 5.10.0 中，具有条目编辑权限的控制面板用户在保存条目时，HTTP Referer 请求头中的签名重定向 URL 字符串会通过 `renderObjectTemplate()` 被编译为 Twig 模板执行，而沙箱化的替代函数 `renderSandboxedObjectTemplate()` 未被使用。由于 Referer 头可由攻击者控制，认证用户可利用此漏洞注入恶意 Twig 代码实现远程代码执行，导致服务器敏感信息泄露、数据篡改或完全受控。攻击者需具备控制面板访问权限和条目编辑权限，攻击复杂度低。该漏洞 CVSS 评分 8.7，危害等级高，建议升级至 Craft 5.10.0 或更高版本修复。"
published = "2026-07-02T00:16:45Z"
remediation = "立即升级 Craft CMS 至 5.10.0 或更高版本。如无法立即升级，可暂时限制控制面板用户编辑条目的权限，并在 WAF 层面对 HTTP Referer 头部进行过滤，阻止包含 Twig 模板语法的请求。"
score = 8.7
severity = "HIGH"
sources = ["ghsa"]
title = "Craft CMS Twig模板注入远程代码执行漏洞"
updated = "2026-07-02T15:12:53Z"

