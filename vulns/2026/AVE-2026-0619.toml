[basic]
description = "Cloudreve 4.16.1 存在 OAuth 授权作用域绕过漏洞。由于管理员路由组中 `POST /api/v4/admin/policy/oauth/signin` 接口未添加 `Admin.Write` 作用域守卫，仅拥有 `Admin.Read` 只读权限的 OAuth 令牌可调用该接口修改 OneDrive 存储策略的密钥和 App ID 等凭据。攻击者通过构造包含恶意 `secret` 和 `app_id` 字段的 JSON 请求，可篡改存储后端配置，导致存储服务异常或重定向 OAuth 认证流程至攻击者控制的应用参数。该漏洞影响 Cloudreve 4.16.1 版本，CVSS 评分 8.8，危害等级高危。"
published = "2026-01-01T00:00:00Z"
remediation = '升级 Cloudreve 至 4.16.2 或更高版本，该版本已在 `routers/router.go` 中为 `oauth.POST("signin")` 路由添加了 `middleware.RequiredScopes(types.ScopeAdminWrite)` 守卫。如无法立即升级，可在反向代理层（如 Nginx）限制 `POST /api/v4/admin/policy/oauth/signin` 接口仅允许受信 IP 访问，并审计所有 OAuth 客户端权限，撤销仅授予 `Admin.Read` 作用域的第三方应用令牌。'
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Cloudreve Cloudreve OAuth作用域授权绕过漏洞"
updated = "2026-01-01T00:00:00Z"

