[basic]
description = "Linux 内核 2.4 版本的 TTY 子系统存在未明漏洞，攻击者可通过向目标系统发送特制的 TTY 请求触发内核异常（kernel oops），导致系统崩溃或拒绝服务。该漏洞影响 Linux 内核 2.4 系列版本，攻击者无需身份认证即可远程利用，危害等级中危。由于漏洞细节未完全公开，建议用户升级至已修复版本或应用厂商提供的补丁。"
published = "2003-06-16T04:00:00Z"
remediation = "建议立即升级 Linux 内核至对应发行版修复版本：Red Hat 用户安装 RHSA-2003-187/195/198 提供的更新内核包；Debian 用户升级至 DSA-311/312/332/336/442 修复版本；Mandriva 用户应用 MDKSA-2003:066/074 补丁；TurboLinux 用户安装 TLSA-2003-41 更新。如无法升级，可通过限制本地用户对 TTY 设备的访问权限作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux Kernel 2.4 TTY 层拒绝服务漏洞"
updated = "2026-06-16T22:01:49Z"

