[basic]
description = "HP Tru64 UNIX 的 TCP/IP 协议栈在生成初始序列号（ISN）时使用可预测的随机增量算法，导致远程攻击者可通过发送大量包含不同 ISN 值的数据包进行洪水攻击，其中某个 ISN 可能与目标连接预期的序列号匹配，从而实现会话劫持或连接中断拒绝服务。该漏洞影响 HP Tru64 UNIX 操作系统，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），属于网络层拒绝服务漏洞。攻击者无需身份认证即可远程发起攻击，仅需能够向目标系统发送伪造的 TCP 数据包，利用方式为 ISN 预测与洪水注入导致会话状态混乱或劫持。"
published = "2001-06-27T04:00:00Z"
remediation = "应用 HP 发布的安全补丁：Tru64 UNIX 5.1B-3 安装 T64KIT0026447-V51BB26-ES-20050914，5.1B-2/PK4 安装 T64KIT0026436-V51BB25-ES-20050914，5.1A PK6 安装 T64KIT0026446-V51AB24-ES-20050914，4.0G PK4 安装 T64KIT0025920-V40GB22-ES-20050628，4.0F PK8 安装 DUXKIT0025921-V40FB22-ES-20050628，补丁通过 dupatch 工具安装。如无法立即打补丁，可通过 sysconfig 命令设置内核参数 icmp_tcpseqcheck=1 以验证 ICMP 错误消息中的 TCP 序列号，并使用 sysconfigdb 持久化配置，临时缓解 TCP 序列号猜测攻击。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "HP Tru64 UNIX TCP/IP 远程拒绝服务漏洞"
updated = "2026-06-16T21:54:06Z"

