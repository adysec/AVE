[basic]
description = "PGP 5.5.x 至 6.5.3 版本存在附加解密密钥（ADK）验证缺陷，未正确检查公钥证书签名部分中是否嵌入了 ADK。攻击者若能修改受害者的公钥证书并植入恶意 ADK，即可解密所有使用该篡改证书加密的数据，导致机密信息泄露。该漏洞利用条件为攻击者需具备修改目标公钥证书的能力，CVSS 评分 5.0，危害等级中危。"
published = "2000-10-20T04:00:00.000"
remediation = "建议立即升级 PGP 至 6.5.4 或更高版本，该版本已修复 ADK 附加解密密钥的验证缺陷。如无法升级，应禁用 ADK 功能（在 PGP 配置中设置 DisableAdditionalDecryptionKey=1），并严格验证所有导入公钥证书的签名完整性，避免使用来源不可信的公钥。同时关注 CERT/CC 公告 CA-2000-18 获取最新补丁信息。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "PGP 附加解密密钥验证绕过漏洞"
updated = "2026-06-16T21:52:15.010"

