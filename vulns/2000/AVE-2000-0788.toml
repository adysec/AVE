[basic]
description = "McAfee VirusScan 4.5 与 NetShield 4.5 默认安装时，标识 AutoUpgrade 目录的注册表项权限配置不当，本地用户可将该目录下的 SETUP.EXE 替换为木马程序。当系统执行自动升级相关流程时，会以较高权限运行被替换的程序，从而实现任意命令执行。该漏洞仅影响本地攻击场景，攻击者需具备目标主机本地访问权限且无需额外认证，主要破坏完整性。CVSS 评分为 2.1，危害等级较低。"
published = "2000-07-11T04:00:00Z"
remediation = '升级 McAfee VirusScan/NetShield 至 4.5 之后已修复权限问题的版本，或更换为当前受支持的终端防护产品。若暂无法升级，以管理员身份用 regedt32 打开注册表，找到标识 AutoUpgrade 目录的键（通常在 HKEY_LOCAL_MACHINE\SOFTWARE\Network Associates 或 McAfee 相关路径下），取消 Everyone/Users 的写权限，仅保留 Administrators 与 SYSTEM 的完全控制；同时对 AutoUpgrade 目录本身设置同样 ACL，禁止普通用户写入或替换 SETUP.EXE，并定期校验该目录下安装程序的完整性与数字签名。'
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "McAfee VirusScan/NetShield 注册表权限不当本地代码执行漏洞"
updated = "2026-06-16T21:52:11Z"

