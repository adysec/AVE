[basic]
description = 'suidperl（又称 sperl）是 Perl 5.00503 中用于执行 setuid 脚本的辅助程序，其在调用 /bin/mail 发送错误报告时未能正确过滤文件名中的 "~!" 转义序列。本地攻击者可通过设置 "interactive" 环境变量并构造包含该转义序列的特制文件名调用 suidperl，从而触发 mail 命令的 shell 转义，以提升至 root 权限。该漏洞影响 Perl 5.00503 及之前版本，攻击者需拥有本地系统访问权限，无需身份认证即可利用。'
published = "2000-10-20T04:00:00Z"
remediation = "升级 Perl 至 5.6.0 或更高版本，该版本已修复 suidperl 对转义序列的过滤缺陷。如无法升级，可移除 suidperl 的 setuid 权限（chmod u-s /usr/bin/suidperl）或直接删除该二进制文件。各发行版用户请安装对应安全补丁：RedHat RHSA-2000-048、Caldera CSSA-2000-026、SUSE 安全公告第 59 号。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Perl suidperl 邮件 shell 转义序列本地权限提升漏洞"
updated = "2026-06-16T21:52:18Z"

