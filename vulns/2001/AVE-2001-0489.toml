[basic]
description = "zml.cgi 存在目录遍历漏洞，远程攻击者可通过向 file 参数传递 `../` 等路径穿越序列，绕过访问限制读取服务器上的任意文件。该漏洞源于程序未对用户输入的 file 参数进行充分的路径过滤与合法性校验，攻击者无需身份认证即可利用，可能导致敏感信息泄露（如配置文件、系统密码文件等）。CVSS 评分 5.0，危害等级中危。目前已有公开 PoC 代码，利用难度低。"
published = "2001-12-31T05:00:00Z"
remediation = "立即停用或删除 zml.cgi 脚本，该脚本已无官方维护且存在目录遍历漏洞。如必须使用 SSI 功能，建议替换为 Apache 原生 mod_include 模块。临时缓解措施：在 zml.cgi 入口处添加参数校验，过滤 `../` 及 `%00` 空字节，并将可访问路径限制在指定白名单目录内。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Abe Timmerman zml.cgi 目录遍历漏洞"
updated = "2026-06-16T21:55:48Z"

