[basic]
description = "HP-UX 11.0 系统中的 cu 程序存在缓冲区溢出漏洞，本地攻击者可通过向 cu 程序的 -l 命令行参数传递超长字符串触发缓冲区溢出，导致攻击者能够获取 root 权限。该漏洞影响 HP-UX 11.0 系统，攻击者需要拥有本地系统访问权限，无需身份认证即可利用，CVSS 评分 7.2，危害等级高。目前已存在公开的利用代码。"
published = "2000-12-11T05:00:00Z"
remediation = "立即从 HP 官方渠道（ITRC 或 HP Support Portal）获取并安装针对 HP-UX 11.0 的 PHCO_23043 补丁包。如无法安装补丁，可执行 `chmod 555 /bin/cu` 移除 cu 程序的 setuid 权限，或使用 `chmod 0 /bin/cu` 彻底禁用 cu 命令。对于仍在使用 HP-UX 11.0 的系统，建议升级到受支持的 HP-UX 11i v3 或更高版本，该漏洞已在后续版本中修复。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "HP HP-UX /bin/cu 本地缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:53:00Z"

