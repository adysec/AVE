[basic]
description = "WordPress 插件 s3-video 0.983 版本中存在反射型跨站脚本（XSS）漏洞，攻击者无需认证即可通过构造特制的 URL 参数，诱使用户点击后，恶意脚本在用户浏览器中执行，导致信息泄露或会话劫持。该漏洞源于插件未对用户输入进行充分的过滤与转义处理，攻击条件为诱导用户访问恶意链接，影响机密性与完整性，CVSS 评分 6.1，危害等级中危。"
published = "2016-10-10T20:59:26Z"
remediation = "该插件 s3-video 已于 2013 年 12 月关闭下架且不再维护，建议立即从 WordPress 站点删除该插件，并替换为其他仍在维护的 S3 视频插件（如 WP Media Player 或 Video Embed & Thumbnail Generator）。如暂时无法替换，可在 Web 应用防火墙（WAF）层面添加规则过滤 GET 参数中的 <script> 等恶意 HTML 标签作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress s3-video 插件反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:46Z"

