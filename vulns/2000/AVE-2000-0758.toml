[basic]
description = "Extent RBS ISP Web Server 2.5 存在目录遍历漏洞。未经身份认证的远程攻击者可通过向服务器的 Image 参数注入路径遍历序列（如 .. ），突破 Web 根目录限制，读取服务器上的敏感文件。该漏洞影响该版本的 Web 服务器，攻击者无需凭证即可远程利用，成功后可泄露系统配置文件、密码文件或其他敏感数据。攻击条件简单，仅需目标运行受影响版本的 RBS ISP Web Server 并允许外部访问即可触发。"
published = "2000-12-11T05:00:00.000"
remediation = 'Extent Technologies 已长期停止维护，官方未发布针对该漏洞的补丁。建议采取以下临时缓解措施：在防火墙或 ACL 中仅允许可信 IP 访问 TCP 8002 端口；在前端反向代理或 WAF 中配置规则，拦截所有包含 ../ 或 ..\ 的 Image 参数请求；收紧 Web 服务器根目录的文件系统权限，禁止 Web 进程读取数据库等敏感文件；如条件允许，迁移到 Apache 或 Nginx 等持续受安全支持的 Web 服务器。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Extent Technologies RBS ISP 目录遍历漏洞"
updated = "2026-06-16T21:53:01.183"

