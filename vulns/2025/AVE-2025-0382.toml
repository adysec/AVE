[basic]
description = "Google Chrome for Android 导航组件存在不当实现漏洞（CWE-451），远程攻击者可通过构造特制的 HTML 页面，利用导航过程中的 UI 逻辑缺陷实施界面欺骗攻击。当用户使用受影响版本（132.0.6834.83 之前）的 Chrome 访问恶意页面时，攻击者可在地址栏中伪造目标 URL，诱导用户误认为正在访问合法网站，从而窃取凭据或敏感信息。该漏洞攻击复杂度低，无需认证，但需要用户交互触发，影响完整性。Google 已在 Chrome 132.0.6834.83 版本中修复，Microsoft Edge 和 Fedora 也已同步更新。"
published = "2025-01-15T11:15:09Z"
remediation = "升级 Google Chrome for Android 至 132.0.6834.83 及以上版本（通过 Google Play 商店更新）；使用 Microsoft Edge 的用户升级至 132.0.2957.115 及以上版本；Linux 发行版用户更新 chromium 包至 132.0.6834.83。临时缓解措施：避免在 Android 设备上点击可疑链接或访问不可信网页。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome 导航实现不当导致界面欺骗漏洞"
updated = "2026-06-17T08:26:28Z"

