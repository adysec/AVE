[basic]
description = "OpenBSD 2.8 及更早版本的 IPSEC 认证机制中存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标系统发送包含畸形认证头（AH）IPv4 选项的恶意数据包触发该漏洞，造成拒绝服务，并可能进一步执行任意命令。该漏洞影响所有启用 IPSEC 功能的 OpenBSD 2.8 及更早版本系统，攻击者可利用其无需任何凭据即可在远程发起利用，CVSS 评分为 10.0，危害等级为严重。"
published = "2001-05-03T04:00:00Z"
remediation = "建议将 OpenBSD 升级至 2.9 或更高版本，或手动应用 OpenBSD 2.8 官方安全补丁 023（2001 年 3 月 2 日发布）。如无法立即升级，可临时禁用内核 IPSEC 功能，并确保 AH IPv4 选项保持关闭状态（该选项默认不启用），直至完成升级。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "OpenBSD 操作系统 IPSec 认证机制缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:54:01Z"

