[basic]
description = "Windows 远程桌面网关（RD Gateway）存在竞争条件漏洞（CWE-362），由于在处理并发请求时未正确同步资源访问，导致本地攻击者可利用竞态条件触发系统资源耗尽或服务崩溃。该漏洞影响 Windows 10/11 及 Windows Server 2019/2022 等版本，CVSS 评分 6.2，危害等级中危。攻击者无需任何权限或用户交互即可利用此漏洞，但需具备本地系统访问能力，成功利用可导致目标系统拒绝服务。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:48Z"
remediation = "安装 Microsoft 2025 年 1 月安全更新：Windows 10/11 用户通过 Windows Update 自动更新至对应修复版本（如 22H2 需升级至 10.0.19045.5371 以上），Windows Server 用户安装 KB5050004 月度汇总。如无法立即打补丁，可在防火墙中限制 RD Gateway 服务（端口 443/3391）的本地访问来源，仅允许受信任管理 IP 连接，并禁用不必要的远程桌面网关角色以缩小攻击面。"
score = 6.2
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 远程桌面网关（RD Gateway）拒绝服务漏洞"
updated = "2026-06-17T08:42:58Z"

