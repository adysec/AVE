[basic]
description = "RealNetworks RealPlayer 11.0 至 11.1 版本及 12.0.0.879 之前版本的 ActiveX 控件存在未指定的安全绕过漏洞。远程攻击者可通过诱导用户访问恶意网页，利用 ActiveX 控件绕过文件访问限制，实现未授权文件读取或操作。该漏洞影响 RealPlayer SP 及早期版本，CVSS 评分 9.3，危害严重。官方已发布更新修复。"
published = "2010-08-30T20:00:02Z"
remediation = "立即升级 RealPlayer 至 SP 版本 12.0.0.879 或更高版本，该版本修复了包括 CVE-2010-3002 在内的多个安全漏洞。用户可访问 http://service.real.com/realplayer/security/08262010_player/en/ 获取官方安全公告及更新包。如无法立即升级，建议限制 RealPlayer 对本地文件系统的访问权限，避免在受影响的系统上打开来自不可信来源的媒体文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer 未授权文件访问漏洞"
updated = "2026-06-16T23:21:56Z"

