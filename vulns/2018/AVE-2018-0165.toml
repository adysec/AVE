[basic]
description = "Roxy Fileman 1.4.5 的 upload.php 文件存在任意文件上传漏洞，远程攻击者无需身份认证即可通过 HTTP POST 请求直接上传恶意 PHP 文件至服务器。攻击者上传 webshell 后即可获取服务器完全控制权，执行任意系统命令。该漏洞影响所有使用 Roxy Fileman 1.4.5 的 Web 应用，CVSS 评分 9.8，危害等级严重。官方至今未发布修复补丁，建议停止使用该版本或通过访问控制限制 upload.php 的访问。"
published = "2019-03-21T16:00:36Z"
remediation = '立即删除或禁用 Roxy Fileman 的 upload.php 文件，或通过 Web 服务器配置（如 Nginx location 拒绝、Apache 的 <Files> 指令）限制对该文件的访问。在 uploads 目录下放置 .htaccess 文件，内容为 "SetHandler default-handler" 以防止 PHP 执行。如必须使用文件上传功能，建议替换为其他仍在维护的文件管理器组件，因为 Roxy Fileman 官方已停止更新且厂商失联，1.4.5 之后无安全修复版本。'
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Roxy Fileman 任意文件上传漏洞"
updated = "2026-06-17T01:53:01Z"

