[basic]
description = "Fortinet FortiOS 和 FortiProxy 的 SSL VPN Web 门户中存在跨站脚本（XSS）漏洞，攻击者可通过向 error 或 message 处理参数中注入恶意脚本代码，当管理员或用户访问特制链接时，脚本将在受害者浏览器中执行，导致敏感信息泄露或会话劫持。该漏洞影响 FortiOS 6.0.0 至 6.0.4、5.6.0 至 5.6.7、5.4.0 至 5.4.12、5.2 及以下版本，以及 FortiProxy 2.0.0、1.2.8 及以下版本。攻击无需身份认证，但需用户交互（点击恶意链接），CVSS 评分 4.7，危害等级中危。Fortinet 已在后续版本中修复此漏洞。"
published = "2019-06-04T21:29:00Z"
remediation = "升级 FortiOS 至 6.0.5 及以上、5.6.8 及以上、5.4.13 及以上版本，或升级 FortiProxy 至 2.0.1 及以上版本。如无法立即升级，可在 SSL VPN 配置中对 error 和 message 参数进行输入过滤，或通过防火墙策略限制 SSL VPN 门户的访问来源 IP。"
score = 4.7
severity = "MEDIUM"
sources = ["nuclei"]
title = "Fortinet FortiOS SSL VPN 跨站脚本漏洞"
updated = "2026-06-17T01:39:18Z"

