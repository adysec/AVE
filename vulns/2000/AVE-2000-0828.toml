[basic]
description = "Microsys CyberPatrol 4.0 版本在注册过程中对信用卡号采用了极其脆弱的加密机制（仅为简单编码），并对用户提交的其余敏感信息完全未做任何加密处理。攻击者在同一局域网内即可通过网络嗅探手段截获注册流量，从而获取用户的信用卡号及其他隐私数据。该漏洞影响 CyberPatrol 4.003 与 4.005 等版本，CVSS 评分为 5.0，危害等级中等。由于注册信息以明文或可轻易解码的方式在网络中传输，任何能够监听网络流量的攻击者均可轻松获取敏感信息，存在信息泄露风险。"
published = "2001-01-09T05:00:00Z"
remediation = "建议立即停止使用 Microsys CyberPatrol 4.003/4.005 版本，改用现代家长控制软件（如 Qustodio、Net Nanny 或 Kaspersky Safe Kids）。若必须继续使用，请在网络层部署 TLS/VPN 加密所有注册流量，防止信用卡信息被嗅探；同时在防火墙限制该软件仅访问必要更新服务器，禁用明文 HTTP 通信端口。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsys CyberPatrol 注册信息泄露漏洞"
updated = "2026-06-16T21:53:18Z"

