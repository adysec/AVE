[basic]
description = "Samba 2.2.8a 之前版本存在多处缓冲区溢出漏洞。远程攻击者无需身份认证即可通过网络向 Samba 服务发送特制请求触发缓冲区溢出，导致任意代码执行或拒绝服务。该漏洞影响所有 Samba 2.2.8a 之前版本，CVSS 评分 10.0，危害等级严重。攻击者可通过 SMB/CIFS 协议端口（139/445）发送恶意构造的数据包实现远程利用，建议用户立即升级至 2.2.8a 或更高版本。"
published = "2003-05-05T04:00:00.000"
remediation = "立即升级 Samba 至 2.2.8a 或更高版本，该版本修复了多个缓冲区溢出漏洞。如无法升级，可在 smb.conf 中限制可访问的 IP 范围（hosts allow = 127.0.0.1 192.168.0.0/16），并禁用不必要共享服务以降低攻击面。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "Samba 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T22:01:44.003"

