[basic]
description = "Microsoft Windows NT 4.0 及 Windows 2000 系统存在 DLL 搜索路径劫持漏洞。当用户打开 Office 2000 文档时，系统会优先在文档所在目录中搜索 riched20.dll、msi.dll 等动态链接库文件。攻击者可将恶意 DLL 放置在文档同目录下，诱使用户打开文档后触发 DLL 加载，从而以当前用户权限执行任意代码。该漏洞攻击复杂度低，无需身份认证，CVSS 评分 10.0，危害等级严重。Microsoft 已发布安全更新修复此问题。"
published = "2000-11-14T05:00:00.000"
remediation = '安装 Microsoft 安全公告 MS00-052 提供的补丁（Windows NT 4.0 下载 KB269049，Windows 2000 下载对应补丁包），该补丁在 Shell 启动代码中强制在 Explorer.exe 前追加 %systemroot% 路径。同时启用安全 DLL 搜索模式：将注册表 HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Session Manager\SafeDllSearchMode 设为 1（将当前目录置于系统目录之后搜索）。作为临时缓解措施，避免从不受信任的目录（如下载文件夹、共享目录）直接双击打开 Office 文档，并限制普通用户对系统根目录 C:\ 的写入权限。'
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Microsoft Office 2000 DLL 搜索路径劫持漏洞"
updated = "2026-06-16T21:52:36.387"

