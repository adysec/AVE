[basic]
description = "Jodit 编辑器内置 clean-html 过滤器存在突变型 XSS 漏洞，攻击者利用 MathML 与 `<style>` 标签的嵌套特性（`math > mtext > table > mglyph > style`），使 `<img onload=...>` 等非 onerror 事件处理器在首次解析时被作为原始文本隐藏在 `<style>` 内，从而绕过仅遍历元素节点的同步清理逻辑；当编辑器将值重新解析写入可编辑区时，`<img>` 被提升为 HTML 命名空间下的活体元素，其事件处理器完整保留。受影响版本为 4.12.27 及更早（4.11.2 起需四层载体，更早版本裸载体即可绕过），默认配置下即可触发。攻击前提：攻击者能向编辑器写入 HTML（如内容提交角色），且应用后续将 editor.value 作为可信 HTML 渲染（如 innerHTML、服务端渲染）。利用方式：构造特定载体负载赋值给 editor.value，随后消费端渲染即自动触发 onload/onfocus 等无交互事件，导致存储型 XSS。CVSS 7.2（HIGH），已在 4.12.28 修复。"
published = "2026-07-01T21:17:04Z"
remediation = "立即升级Jodit编辑器到4.12.28或更高版本，该版本修复了MathML载体绕过clean-html sanitization的漏洞。如需立即缓解，请在初始化编辑器时禁用clean-html插件或配置更严格的自定义sanitizer，以阻止MathML内嵌的rawtext载体类型。"
score = 7.2
severity = "HIGH"
sources = ["ghsa"]
title = "Jodit Editor clean-html 突变 XSS 漏洞"
updated = "2026-07-31T20:16:52Z"

