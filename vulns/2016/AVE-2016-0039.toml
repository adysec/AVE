[basic]
description = "WordPress Whizz 插件 1.0.7 版本存在反射型跨站脚本攻击（Reflected XSS）漏洞，攻击者无需身份认证即可通过构造特制的 URL 参数向目标页面注入恶意 JavaScript 脚本。当已登录 WordPress 后台的管理员或普通用户点击该恶意链接时，脚本会在用户浏览器中执行，可能导致敏感信息泄露、会话劫持或页面内容篡改。该漏洞源于插件对用户输入参数缺乏充分的过滤与转义处理，攻击条件为诱导用户点击恶意链接，CVSS 评分 6.1，危害等级中危。"
published = "2016-10-10T20:59:32Z"
remediation = "立即删除或停用 WordPress 插件 Whizz，该插件已长期未更新且官方已不再维护。如仍需使用类似功能，请替换为其他活跃维护的 WordPress 图片/幻灯片插件。同时升级 WordPress 至最新版本，并安装 Web 应用防火墙（如 Wordfence）拦截 XSS 攻击载荷作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Whizz Plugin 1.0.7 反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:46Z"

