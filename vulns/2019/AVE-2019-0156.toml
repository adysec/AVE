[basic]
description = "Pandora FMS 7.0NG 的 netflow_get_stats 函数在处理 ip_src 参数时未对特殊字符进行充分转义，导致远程认证攻击者可通过构造包含 shell 元字符的请求，在 index.php?operation/netflow/nf_live_view 路径中注入并执行任意操作系统命令。该漏洞影响 Pandora FMS 7.0NG 742 之前的所有版本，攻击者需具备合法认证凭据，利用难度较低，CVSS 评分为 8.8，属于高危漏洞。修复方案为升级至 Pandora FMS 7.0 NG 742 或更新版本。"
published = "2020-01-09T16:15:10.660"
remediation = "立即将 Pandora FMS 升级至 7.0 NG 742 版本，该版本已修复 netflow_get_stats 函数中 ip_src 参数的命令注入漏洞。如暂时无法升级，可临时禁用 NetFlow 数据采集功能（关闭 netflow_nfdump 配置），或通过 WAF/防火墙规则拦截包含分号和双引号的异常请求。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "Pandora FMS OS命令注入漏洞"
updated = "2026-06-17T02:30:13.997"

