[basic]
description = "SolarWinds Orion API 存在认证绕过漏洞（CWE-288/CWE-306），攻击者无需身份验证即可绕过认证机制直接执行 API 命令，该漏洞是 SUNBURST 供应链攻击链的核心组成部分。受影响版本包括 SolarWinds Orion Platform 2019.4 HF 5、2020.2 未安装 hotfix 的版本以及 2020.2 HF 1，涵盖网络性能监控器（NPM）、网络配置管理器（NCM）、服务器与应用监控器（SAM）等多个产品模块。攻击者只需通过网络远程访问目标系统即可利用此漏洞，无需认证凭据或用户交互（CVSS 3.1 向量 AV:N/AC:L/PR:N/UI:N），通过构造特制的 API 请求直接调用 Orion API 执行任意命令，成功利用后可完全控制 SolarWinds 实例，进而窃取敏感数据、横向渗透内网，并可部署 TEARDROP、RAINDROP 等后续恶意载荷。该漏洞已于 2020 年 12 月被确认在野外遭到利用，CISA 于 2021 年 11 月将其列入已知被利用漏洞目录（KEV），SolarWinds 建议受影响用户升级至 2020.2.5 版本以彻底修复。"
published = "2020-12-29T22:15:12Z"
remediation = "建议立即将受影响的 SolarWinds Orion Platform 升级至 2020.2.5 版本（2019.4 HF 5 用户可升级至 2019.4.2），升级包可从 customerportal.solarwinds.com 下载。如暂无法升级，可下载 SolarWinds 提供的 SUPERNOVA 临时缓解脚本 (https://downloads.solarwinds.com/solarwinds/Support/SupernovaMitigation.zip) 部署至所有 Orion Web 服务器。同时应将 Orion 服务器置于防火墙隔离区域，禁用对外互联网访问，仅允许必需的内部端口通信，并监控 Orion API 异常调用行为。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "SolarWinds Orion API 身份验证绕过漏洞"
updated = "2026-06-17T02:47:26Z"

