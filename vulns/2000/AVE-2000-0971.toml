[basic]
description = 'Netegrity SiteMinder 4.11 之前版本存在安全绕过漏洞。远程攻击者通过在请求 URL 后附加 "$/FILENAME.ext"（其中 ext 为 .ccc、.class 或 .jpg）即可绕过身份认证机制，未经授权访问受保护的资源。该漏洞无需身份验证即可远程利用，CVSS 评分 7.5，危害等级高，影响使用 SiteMinder 进行访问控制的 Web 应用系统。'
published = "2000-11-14T05:00:00.000"
remediation = '升级 Netegrity SiteMinder 至 4.11 或更高版本，该版本修复了 URL 尾部追加 "$/FILENAME.ext" 绕过认证的漏洞。如无法升级，在 Web 服务器（IIS/Apache）层面配置 URL 重写规则，拦截包含 "$/" 模式的请求路径作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Netegrity SiteMinder 认证绕过漏洞"
updated = "2026-06-16T21:52:35.890"

