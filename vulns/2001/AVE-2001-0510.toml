[basic]
description = "Active Classifieds Free Edition 1.0 的管理后台 admin.cgi 脚本存在任意代码执行漏洞。远程攻击者无需身份认证即可通过向 table_width 参数传递特制的 Perl 代码，利用该参数未经过滤直接传入 eval 或类似函数执行的缺陷，实现任意 Perl 代码执行。成功利用后攻击者可修改系统配置、提升权限至 Web 服务器级别，进而完全控制目标站点。该漏洞影响 Active Classifieds Free Edition 1.0 及可能存在的商业版本，Exploit-DB 已公开完整利用代码，攻击门槛极低。"
published = "2001-06-28T04:00:00Z"
remediation = "立即停止使用 Active Classifieds Free Edition 1.0，该软件已停止维护且无安全补丁。如必须继续使用，应在 Web 服务器层面限制对 admin.cgi 的访问（如仅允许特定 IP 通过 .htaccess 或 Nginx/Apache 访问控制），并对 table_width 参数实施严格的输入过滤，禁止传入分号、引号等 Perl 特殊字符。强烈建议迁移至其他仍在维护的分类广告系统。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Active Classifieds Free Edition 1.0 任意代码执行漏洞"
updated = "2026-06-16T21:55:58Z"

