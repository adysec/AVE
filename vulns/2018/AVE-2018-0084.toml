[basic]
description = "Orange Forum 1.4.0 存在开放重定向漏洞，位于 views/auth.go 文件中。未经身份认证的远程攻击者可通过向 /login 或 /signup 页面的 next 参数中注入恶意 URL，诱使用户点击特制链接后自动跳转到外部恶意站点，导致钓鱼攻击或用户信任被滥用。该漏洞 CVSS 评分 6.1，危害等级中危，攻击复杂度低，无需特权，但需要用户交互。厂商已在 GitHub 提交 1f6313c 中修复此问题。"
published = "2018-07-20T18:29:00Z"
remediation = "立即升级 Orange Forum 至包含 commit 1f6313cb 的修复版本（≥1.4.1），该提交在 views/auth.go 中对 next 参数进行了 URL 白名单校验，阻止跳转到外部域名。如无法立即升级，可在反向代理层（Nginx/HAProxy）添加规则，仅允许 next 参数为相对路径或本站域名，拒绝包含 http/https 协议头的重定向请求。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Orange Forum 开放重定向漏洞"
updated = "2026-06-17T01:41:05Z"

