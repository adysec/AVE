[basic]
description = "MobileIron Core、Connector、Sentry 及 Monitor and Reporting Database (RDB) 产品中存在远程代码执行漏洞。未经身份认证的远程攻击者可通过向受影响组件的 LogService 发送特制请求，利用不安全的输入处理机制触发任意代码执行，从而完全控制目标服务器。该漏洞影响 MobileIron Core/Connector 10.6.0.0 及更早版本、Sentry 9.8.0 及更早版本、RDB 2.0.0.1 及更早版本，CVSS 评分 9.8，危害等级严重。攻击无需用户交互，利用复杂度低，可导致数据泄露、服务中断及内网横向移动。厂商已发布安全更新修复此漏洞。"
published = "2020-07-07T02:15:10.613"
remediation = "升级 MobileIron Core/Connector 至 v10.7.0.1 或更高版本，Sentry 升级至 v9.8.1 或更高版本，Monitor and Reporting Database (RDB) 升级至 v2.0.0.2 或更高版本。如无法立即升级，在防火墙层面限制对 LogService 端口（默认 8443）的访问，仅允许受信 IP 连接。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "MobileIron Core & Connector & Sentry 远程代码执行漏洞"
updated = "2026-06-17T02:56:45.497"

