[basic]
description = "Check Point Firewall-1 3.0 和 4.0 版本的客户端认证接口存在用户名枚举漏洞。该接口在验证身份时，对无效用户名和无效密码返回不同的错误消息，远程攻击者可通过分析这些错误反馈的差异来判断某个用户名是否存在于防火墙系统上。由于该接口暴露在网络上，攻击者无需任何身份认证即可远程发起枚举攻击，通过反复提交不同用户名并观察服务器返回的错误信息，逐步收集系统内的有效账户列表。收集到的有效用户名可被用于后续的密码暴力破解或社会工程攻击，对防火墙管理安全构成潜在威胁。CVSS v2 评分为 5.0（MEDIUM），受影响范围为所有暴露 Firewall-1 客户端认证接口的远程访问场景。"
published = "2000-12-11T05:00:00.000"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Check Point Firewall-1 用户名枚举漏洞"
updated = "2026-06-16T21:53:00.660"

