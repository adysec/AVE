[basic]
description = "Phorum 3.0.7 的 upgrade.php3 脚本存在未授权访问漏洞，远程攻击者无需身份认证即可通过网络向该脚本发送恶意请求，从而修改 Phorum 论坛数据库中的特定数据表。该漏洞影响 Phorum 3.0.7 版本，CVSS 评分 5.0，危害等级中危。攻击者利用此漏洞可破坏论坛数据的完整性，但无法读取敏感信息或导致服务不可用。目前官方尚未发布针对此版本的安全补丁。"
published = "2000-12-31T05:00:00Z"
remediation = "立即升级 Phorum 至 3.0.8 或更高版本（该版本已修复 upgrade.php3 未授权访问问题）。如无法升级，删除或重命名 upgrade.php3 文件，或通过 Web 服务器配置（如 .htaccess）限制对 upgrade.php3 的访问，仅允许管理员 IP 访问。由于 Phorum 3.x 已停止维护，建议迁移至受支持的论坛系统。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Phorum upgrade.php3 数据库表未授权修改漏洞"
updated = "2026-06-16T21:53:25Z"

