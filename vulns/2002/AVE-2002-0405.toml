[basic]
description = "ACME Labs thttpd 2.20 及更早版本存在跨站脚本（XSS）漏洞。远程攻击者可通过向目标服务器发送指向不存在页面的特制 URL，触发该漏洞。thttpd 在处理 404 错误页面时未对用户输入进行正确过滤，直接将恶意脚本嵌入错误消息中返回给用户，导致攻击者可在受害者浏览器中执行任意脚本。攻击者无需身份认证，仅需诱使用户访问恶意构造的链接即可实施攻击，可窃取会话 Cookie、重定向页面或执行其他恶意操作。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 thttpd 至 2.21 或更高版本（2.21 版本已修复内置错误页面的 XSS 漏洞）。如无法升级，可在 thttpd 配置中禁用自定义错误页面功能，或在前置反向代理（如 Nginx）层面过滤 URL 中的 <script> 等危险字符作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "ACME Labs thttpd 404错误页面跨站脚本漏洞"
updated = "2026-06-16T21:58:01Z"

