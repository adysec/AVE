[basic]
description = "WordPress Adaptive Images 插件（版本低于 0.6.67）中存在本地文件包含漏洞，远程攻击者无需身份认证即可通过向 adaptive-images-script.php 文件传递 `$_REQUEST['adaptive-images-settings']['source_file']` 参数，利用路径遍历攻击读取服务器上的任意文件，包括配置文件、系统敏感文件等，可能导致进一步的信息泄露和攻击面扩大。"
published = "2019-07-21T18:15:11.037"
remediation = "立即将 Adaptive Images 插件升级至 0.6.67 或更高版本（当前最新版 0.6.73），在 WordPress 后台「插件」页面点击更新即可。如无法立即升级，可暂时停用该插件，或通过 Web 应用防火墙（WAF）规则拦截包含 `adaptive-images-settings` 参数的请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress Adaptive Images 插件任意文件读取漏洞"
updated = "2026-06-17T02:17:56.770"

