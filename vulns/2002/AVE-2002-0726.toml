[basic]
description = 'Zone Labs ZoneAlarm Pro 3.0 和 3.1 个人防火墙软件存在拒绝服务漏洞。当防火墙配置为"阻止所有通信"模式时，未经身份认证的远程攻击者可通过向目标主机发送大量伪造源地址的 TCP SYN 数据包（SYN 洪水攻击），在 1 至 1024 端口范围内持续发送 300 个以上的 SYN 包，触发防火墙在处理大量半开连接时的资源耗尽漏洞，导致目标系统 CPU 和内存占用率飙升、系统停止响应直至崩溃。该漏洞影响运行 Windows 98/Me/NT/2000/XP 操作系统的 ZoneAlarm Pro 3.0 和 3.1（含 3.1.291）版本，攻击无需任何身份验证或用户交互，且攻击者可通过 IP 地址伪装隐藏真实来源。该漏洞由 NSSI  Technologies 研究实验室于 2002 年 10 月发现并向厂商报告，Zone Labs 确认了该漏洞的存在，但表示无法复现，未发布官方补丁，建议用户临时禁用 ZoneAlarm 或升级至更高版本以规避风险。'
published = "2002-12-31T05:00:00Z"
remediation = "由于 Zone Labs 未能重现该漏洞且未发布针对 3.0/3.1 版本的修复补丁，建议立即将 ZoneAlarm Pro 升级至后续受支持的版本（如 ZoneAlarm 2004 或更高版本），或更换为其他主流个人防火墙软件（如 Windows 内置防火墙、Comodo Firewall 等）。同时可在路由器或防火墙上配置 SYN 洪水攻击防护规则，限制每秒新建连接数，并在 Windows 上安装最新安全补丁，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Zone Labs ZoneAlarm SYN Flood 拒绝服务漏洞"
updated = "2026-06-16T22:00:17Z"

