[basic]
description = "LISa（LAN Information Service）的 resLISa 守护进程在启动时读取 LOGNAME 环境变量，但未对该变量长度进行边界检查，导致栈缓冲区溢出。本地攻击者可通过设置超长的 LOGNAME 环境变量覆盖栈内存，进而获取原始套接字权限。该漏洞影响包含 LISa 组件的 Linux 发行版，攻击者无需身份认证即可在本地执行提权操作，CVSS 评分 7.2，危害等级高。"
published = "2002-11-29T05:00:00Z"
remediation = "建议升级 LISa 到 0.9.7 版本或更高版本（已修复 LOGNAME 环境变量缓冲区溢出），或从发行版仓库安装已修补版本（如 Debian 3.0 woody 及更新版本）。若无法升级，可禁用 resLISa 守护进程或限制 LOGNAME 环境变量长度作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "LISa 缓冲区溢出漏洞"
updated = "2026-06-16T21:58:59Z"

