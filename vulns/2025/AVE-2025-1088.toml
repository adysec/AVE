[basic]
description = "` tags as requested.<value>Linux 内核 CAN 子系统的 ucan 驱动中存在越界读取漏洞。由于此前提交将 strncpy() 替换为 strscpy() 时，源缓冲区未以空字符结尾，而 strscpy() 会额外读取一个字节以检测字符串截断，导致在通过 USB 控制消息读取固件字符串时发生一次越界读取。该漏洞影响包含 ucan 驱动的 Linux 内核版本，具有本地访问权限的低权限攻击者可通过向 USB CAN 设备发送特制控制消息触发此漏洞，可能导致敏感内核内存信息泄露或系统拒绝服务。CVSS 评分为 5.5，危害等级为中等。"
published = "2025-04-03T08:15:15Z"
remediation = "升级 Linux 内核至已修复的稳定版本。受影响版本包括 6.2 至 6.6.84、6.7 至 6.12.20、6.13 至 6.13.8 以及 6.14-rc 系列。建议升级至内核 6.6.85、6.12.21、6.13.9 或 6.14 及更高版本。Ubuntu 24.04 LTS 用户应升级至 6.8.0-84.84 或更高版本，Ubuntu 24.10 用户应升级至 6.11.0-28.28 或更高版本。可通过发行版包管理器执行内核更新，或直接应用上游补丁 commit 7fdaf8966aae 后重新编译内核。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 CAN UCAN 越界读取漏洞"
updated = "2026-06-17T08:44:49Z"

