[basic]
description = "PALS Library System 的 pals-cgi CGI 程序存在任意命令执行漏洞，攻击者可通过向 documentName 参数注入 shell 元字符（如分号、管道符、反引号等），在未经身份认证的情况下远程执行任意操作系统命令。该漏洞影响 PALS Library System WebPALS 1.0 版本，攻击者无需认证即可利用，CVSS v3 评分 7.5，属于高危级别。攻击条件为攻击者能够访问运行该 Web 服务的目标系统，并通过正常的 HTTP 请求传递恶意构造的参数值，成功利用后可导致服务器被完全控制、敏感图书馆数据泄露或服务中断。"
published = "2001-06-02T04:00:00Z"
remediation = "立即升级 PALS Library System 至厂商发布的安全版本，或彻底替换 WebPALS 系统，因为 WebPALS 1.0 已停止维护且无官方补丁。若短期内无法替换，应在 Web 服务器层面对 pals-cgi 的 documentName 参数实施输入过滤，禁止传递含 shell 元字符（如 ; & | $ ` ( )）的请求，或在防火墙层面仅允许可信 IP 访问 pals-cgi 程序，将其从公网访问范围中移除，以阻断远程命令注入攻击路径。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "PALS Library System WebPALS 1.0 任意命令执行漏洞"
updated = "2026-06-16T21:53:53Z"

