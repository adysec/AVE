[basic]
description = "WordPress 的 page-layout-builder 插件 1.9.3 版本存在反射型跨站脚本攻击（XSS）漏洞。该漏洞由于未对用户输入进行充分过滤和转义，攻击者可构造特制的恶意 URL 链接，诱使已登录的管理员用户点击后，在浏览器中执行任意 JavaScript 代码，导致敏感信息泄露或页面内容篡改。攻击者无需身份认证，但需要用户交互。CVSS 评分 6.1，危害等级中危。"
published = "2016-10-10T20:59:18Z"
remediation = "立即卸载 page-layout-builder 插件（v1.9.3 及所有版本），该插件已于 2016 年 4 月从 WordPress 官方仓库下架且不再维护。替换为受支持的页面构建插件，如 Gutenberg 原生编辑器或 Elementor。如无法立即替换，在 WAF 或反向代理层添加规则，过滤对 /wp-content/plugins/page-layout-builder/ 路径下 URL 参数中的 <script>、onerror、onload 等 XSS 攻击载荷。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress page-layout-builder 插件反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:45Z"

