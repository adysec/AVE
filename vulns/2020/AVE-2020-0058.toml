[basic]
description = "Apache HTTP Server 的 mod_proxy_uwsgi 模块在处理 uWSGI 协议头时存在缓冲区溢出漏洞（CWE-120）。当服务器使用该模块将请求代理到后端 uWSGI 应用服务器时，攻击者可通过发送特制的恶意 uwsgi 协议数据包触发缓冲区溢出，导致敏感信息泄露，严重情况下可进一步实现远程代码执行（RCE）。该漏洞影响 Apache HTTP Server 2.4.32 至 2.4.44 版本。攻击者无需身份认证即可远程利用此漏洞，攻击复杂度低，危害严重。建议升级至 2.4.45 或更高版本进行修复。"
published = "2020-08-07T16:15:11Z"
remediation = "建议立即升级 Apache HTTP Server 至 2.4.44 或更高版本以修复 mod_proxy_uwsgi 缓冲区溢出漏洞。如暂无法升级，可在 httpd.conf 中注释掉 LoadModule proxy_uwsgi_module 指令以禁用该模块，或通过防火墙限制对 uWSGI 后端端口的访问作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Apache HTTP Server mod_proxy_uwsgi 远程代码执行漏洞"
updated = "2026-06-17T02:51:11Z"

