[info]
author = "ave"
description = "验证CUPS 1.1.14至1.1.17版本存在文件竞争条件漏洞，本地lp权限用户可利用时间差创建或覆盖任意文件"
id = "POC-AVE-2002-0075"
name = "CVE-2002-1366 PoC"
severity = "medium"
tags = ["ave-2002-0075"]
vuln_id = [
    "CVE-2002-1366",
    "AVE-2002-0075",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/tmp/ave_poc_check"
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["race condition"]
