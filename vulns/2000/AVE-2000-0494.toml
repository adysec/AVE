[basic]
description = "Savant Web Server 2.1 及 3.0 版本存在远程缓冲区溢出漏洞。攻击者无需身份认证，通过向目标服务器发送超长 GET 请求即可触发缓冲区溢出，导致任意代码执行，完全控制目标系统。该漏洞影响 Savant Web Server 2.1 和 3.0 版本，CVSS 评分 7.5，危害等级高。目前官方已停止维护该产品，建议用户迁移至其他受支持的 Web 服务器软件。"
published = "2000-07-08T04:00:00.000"
remediation = "Savant Web Server 已停止维护多年，官方未发布安全补丁。建议立即停止使用 Savant Web Server，迁移至受支持的 Web 服务器（如 Apache HTTP Server、Nginx 或 IIS）。如暂时无法迁移，可在网络边界防火墙或 WAF 中配置规则，限制 HTTP GET 请求头数量和长度，拦截超长请求以降低攻击面。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Michael Lamont Savant WebServer 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:52:10.233"

