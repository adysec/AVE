[basic]
description = "Linux内核usbnet/ipheth驱动存在越界读取漏洞。原始代码中NDP16的起始位置可基于NTH16中的wNdpIndex值在URB内任意位置，仅检查了NDP16起始位置，导致其固定长度部分可能超出URB边界，引发越界读取。攻击者需本地访问且无需用户交互即可触发，可造成信息泄露。该漏洞影响使用ipheth驱动的Linux系统，CVSS评分为7.1（高危）。"
published = "2025-02-27T03:15:14.830"
remediation = "升级内核到 ≥5.15.0 版本以获取修复 patched 版本，或应用包含 commit cd8a3c2bbf3b6bd24528d5a2372a098f31a98e1 的安全补丁。如无法立即升级，可临时通过禁用 usbnet 驱动或 ipheth 功能来限制攻击面，并监控系统日志以检测潜在异常的 USB 网络流量。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 usbnet/ipheth 驱动越界读取漏洞"
updated = "2026-06-17T08:44:10.137"

