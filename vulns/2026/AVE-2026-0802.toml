[basic]
description = "gemini-bridge 是一款轻量级 MCP 服务器，其 `consult_gemini_with_files` 工具在 inline 模式下未对 `files` 参数中的文件路径进行有效限制，`_resolve_path` 函数仅对显示名称进行空值处理而未实际校验路径是否超出工作目录，导致绝对路径、`..` 目录遍历及符号链接逃逸均可被利用。攻击者（如恶意 MCP 客户端或经提示注入的 LLM）可读取服务器进程权限范围内的任意文件（包括 SSH 密钥、云服务凭证、`.env` 环境变量及源代码），并通过 Gemini 往返回显将文件内容泄露给攻击者。该漏洞无需身份认证，攻击复杂度低，影响版本 1.0.0 至 1.3.1，已在 1.3.1 版本中修复。"
published = "2026-07-31T23:17:25Z"
remediation = '立即升级 gemini-bridge 至 v1.3.1 或以上版本，该版本已修复 `_resolve_path` 路径穿越与符号链接逃逸问题。如无法立即升级，避免在 `consult_gemini_with_files` 中使用 `mode="inline"` 处理不可信的 `files` 参数，或以低权限用户运行 MCP 服务器进程限制可读取文件范围。'
score = 6.2
severity = "MEDIUM"
sources = ["ghsa"]
title = "eLyiN gemini-bridge 任意本地文件读取漏洞"
updated = "2026-07-31T23:17:25Z"

