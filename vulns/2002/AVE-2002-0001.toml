[basic]
description = "SquirrelMail 1.2.7及更早版本的多个PHP脚本（addressbook.php、options.php、search.php和help.php）中存在跨站脚本漏洞。未经身份验证的远程攻击者可通过向这些页面注入恶意脚本代码，当其他用户访问包含恶意脚本的页面时，脚本将在受害者浏览器中以该用户的身份执行。该漏洞影响所有使用受影响版本SquirrelMail的用户，攻击者可利用此漏洞窃取用户会话Cookie、重定向用户至恶意网站或执行其他恶意操作，对Web邮件系统的安全性造成严重威胁。"
published = "2002-10-04T04:00:00Z"
remediation = "立即将 SquirrelMail 升级至 1.2.8 或更高版本，该版本已修复 addressbook.php、options.php、search.php 和 help.php 中的跨站脚本漏洞。升级前可对受影响页面启用输出编码（HTML 实体转义）作为临时缓解措施，并配置 Web 应用防火墙（WAF）规则拦截包含 <script> 标签的恶意请求。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "SquirrelMail 跨站脚本漏洞"
updated = "2026-06-16T21:58:47Z"

