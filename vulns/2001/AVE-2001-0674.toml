[basic]
description = "Microsoft Windows 2000 域控制器的 Kerberos 认证服务存在内存泄漏漏洞。该漏洞的原理是 Kerberos 服务在处理客户端网络连接时未能正确释放连接过程中分配的内存资源，导致每次连接建立后即使断开连接也会有部分内存残留且无法回收。未经身份认证的远程攻击者可以反复向目标系统的 Kerberos 服务（通常监听 UDP/TCP 88 端口）发起连接请求并立即断开，攻击者无需发送任何 Kerberos 认证数据即可触发内存泄漏。随着攻击次数持续增加，系统可用内存被逐渐耗尽，最终导致 Kerberos 服务拒绝响应合法用户的认证请求，造成拒绝服务。该漏洞影响运行 Windows 2000 Server 的域控制器系统。Microsoft 已于 2001 年 5 月发布的安全公告 MS01-024 中提供修复补丁，系统管理员应尽快安装相关安全更新以消除风险。"
published = "2001-06-27T04:00:00Z"
remediation = "安装 Microsoft 安全公告 MS01-024 中发布的补丁 KB294391，或升级到 Windows 2000 Service Pack 3，该补丁可修复 Kerberos 服务在处理异常请求时的内存泄漏问题。作为临时缓解措施，可在网络边界防火墙上阻断入站 TCP 88 端口（Kerberos）和 TCP 464 端口（Kerberos 密码修改），阻止远程攻击者直接连接到域控制器；受影响域控制器可通过重启恢复服务；在多域控制器环境中，可利用未受影响的域控制器分担流量，降低服务中断影响范围。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows 2000 Kerberos 拒绝服务漏洞"
updated = "2026-06-16T21:53:56Z"

