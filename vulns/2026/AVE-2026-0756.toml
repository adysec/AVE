[basic]
description = """Easy!Appointments 是一款开源在线预约系统，其后台预约设置页面允许管理员通过富文本编辑器自定义"预约已禁用"提示消息。该消息值被直接存储至 `disable_booking_message` 配置项，并在前端公共预约页面的 `booking_message` 视图中通过 `<?= vars('message_text') ?>` 未经任何 HTML 转义或过滤直接渲染输出。已认证的管理员可在该字段中注入恶意 HTML 或 JavaScript 代码，当启用预约禁用模式后，任何访问公共预约页面的未认证用户都会触发执行存储的恶意脚本，导致存储型跨站脚本攻击。攻击者可利用此漏洞在目标域下执行任意 JavaScript、窃取用户凭证、篡改页面内容或将访问者重定向至恶意站点。该漏洞影响 Easy!Appointments 1.6.0 之前的所有版本，已在 1.6.0 版本中修复。"""
published = "2026-07-14T16:17:00Z"
remediation = "立即升级至 Easy!Appointments 1.6.0 或更高版本，该版本已对 `disable_booking_message` 输出进行转义处理。如无法立即升级，可在 `application/views/pages/booking_message.php` 中将 `<?= vars('message_text') ?>` 改为 `<?= e(vars('message_text')) ?>` 以转义 HTML 输出，或通过 Web 应用防火墙 (WAF) 规则拦截包含 `<script>`、`onerror=` 等恶意标签的 POST 请求到 `/index.php/booking_settings/save` 路径。"
score = 2.6
severity = "LOW"
sources = ["ghsa"]
title = "Easy!Appointments 预约系统 disable_booking_message 存储型跨站脚本漏洞"
updated = "2026-07-14T17:17:03Z"

