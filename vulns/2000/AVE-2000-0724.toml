[basic]
description = "Intel InBusiness eMail Station 1.04.87 的 POP 服务存在缓冲区溢出漏洞，远程攻击者可通过向该服务发送超长的用户名（USER 命令）触发缓冲区溢出，导致服务崩溃拒绝服务，在特定条件下可能实现任意代码执行。该漏洞源于 POP 服务对用户输入长度缺乏有效校验，攻击者无需身份认证即可通过网络远程利用，影响 Intel InBusiness eMail Station 1.04.87 版本。Exploit-DB 上已有公开的 PoC 利用代码。"
published = "2000-12-19T05:00:00.000"
remediation = "Intel InBusiness eMail Station 1.04.87 已停止维护，官方不再提供安全更新。建议立即停止使用该产品，迁移至受支持的邮件服务器软件（如 Microsoft Exchange 或 Dovecot）。如无法立即迁移，可在防火墙或边界路由器上限制对 POP 端口（110/TCP）的访问，仅允许可信 IP 连接，并监控异常流量。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Intel InBusiness eMail Station POP服务缓冲区溢出漏洞"
updated = "2026-06-16T21:52:55.287"

