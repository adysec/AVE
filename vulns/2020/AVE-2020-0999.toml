[basic]
description = "TP-Link TL-WA855RE V5 固件存在关键功能认证缺失漏洞（CWE-306）。同一网络中的未认证攻击者可向设备发送特制的 TDDP_RESET POST 请求，触发设备恢复出厂设置并重启，随后攻击者可设置新的管理员密码获取设备完全控制权。该漏洞影响 TL-WA855RE V5 20200415-rel37464 版本，CVSS 评分 8.8，危害等级高，已被 CISA KEV 收录确认在野利用。"
published = "2020-08-31T16:15:15Z"
remediation = "立即将 TL-WA855RE V5 固件升级至 200731 及以上版本，下载地址为 TP-Link 官方支持页面。升级前在路由器/防火墙层面限制对设备 80/443 端口的局域网访问，仅允许受信任管理主机连接。如无法升级，可在设备管理界面禁用远程管理和 TDDP 协议以降低风险。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "TP-Link TL-WA855RE 固件关键功能认证缺失漏洞"
updated = "2026-06-17T03:05:25Z"

