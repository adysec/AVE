[info]
author = "ave"
description = "验证 Recourse ManTrap 1.6 在 /proc/self 目录路径处理中的拒绝服务漏洞，通过在 /proc/self 目录及其父目录之间反复切换并执行 ls、pwd 等命令，触发应用程序异常终止"
id = "POC-AVE-2000-1113"
name = "CVE-2000-1146 PoC"
severity = "low"
tags = ["ave-2000-1113"]
vuln_id = [
    "CVE-2000-1146",
    "AVE-2000-1113",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/proc/self"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["proc"]
