[basic]
description = "Sudo 1.6.0 至 1.6.3p7 版本在调用邮件程序时未能正确清理环境变量，导致本地攻击者可通过修改特定环境变量（如 PATH、IFS 等）来改变邮件程序的调用方式，从而以 root 权限执行任意代码。攻击者需要具有本地系统访问权限，无需身份认证即可利用该漏洞实现权限提升。该漏洞影响所有使用受影响版本 sudo 的 Linux/Unix 系统，CVSS 评分 7.2，危害等级高。"
published = "2002-01-31T05:00:00Z"
remediation = "升级 sudo 至 1.6.4 或更高版本，该版本在调用 mail 程序前会正确清理环境变量。如无法升级，可移除 sudo 的 mail 功能（在 sudoers 中设置 mailerpath 为空路径），或限制可执行 sudo 的用户范围以降低风险。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Sudo sudo 环境变量未清理导致本地权限提升漏洞"
updated = "2026-06-16T21:56:38Z"

