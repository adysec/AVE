[basic]
description = "Max Feoktistov Small HTTP Server 2.03 及更早版本存在拒绝服务漏洞，远程攻击者可通过反复请求不包含 index.html 文件的目录 URL，导致服务器内存持续消耗且请求完成后不释放，最终耗尽内存资源导致拒绝服务。该漏洞影响 Small HTTP Server 2.03 及更早版本，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），攻击向量为网络、攻击复杂度低、无需认证、仅影响可用性。攻击者无需身份认证即可远程发起攻击，通过持续发送针对无索引文件目录的请求耗尽服务器内存资源，导致服务拒绝。该漏洞由 Max Feoktistov Small HTTP Server 处理目录索引文件逻辑缺陷导致内存泄漏引发。"
published = "2001-01-09T05:00:00.000"
remediation = "立即升级到 Small HTTP Server 最新版本（如 2.04 或更高版本），修复原有版本在处理缺失 index.html 文件时的内存释放漏洞。配置文件中添加 `MaxMemoryCache=0` 禁用内存缓存，或设置 `Timeout=30` 限制连接保持时间，防止长时间占用资源攻击。如果无法升级，可在反向代理层面启用 `URI` 路径验证，仅允许访问预定义的有效资源，拒绝特定模式的异常请求以实现临时缓解。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Max Feoktistov Small HTTP Server 目录索引缺失拒绝服务漏洞"
updated = "2026-06-16T21:52:42.860"

