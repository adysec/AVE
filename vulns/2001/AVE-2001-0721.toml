[basic]
description = "Bugzilla 2.10 版本存在信息泄露漏洞，未经身份认证的远程攻击者可通过向目标系统发送对 globals.pl 文件的 HTTP 请求，直接读取该文件内容获取敏感信息，包括数据库用户名和密码等凭据。该漏洞影响 Bugzilla 2.10 版本，攻击者无需任何认证凭据即可在远程利用，只需通过 Web 浏览器或 HTTP 客户端访问该文件路径即可。由于 globals.pl 文件通常存储在 Web 服务器文档根目录下，Web 服务器可直接返回其内容而非执行，导致敏感凭据暴露。"
published = "2001-06-27T04:00:00Z"
remediation = "升级 Bugzilla 至 2.12 或更高版本（该版本已修复此问题）。若暂时无法升级，请在 Web 服务器配置中禁止直接访问 globals.pl 文件（如 Apache 设置 <Files globals.pl> Order allow,deny Deny from all </Files>），或将 .pl 文件配置为由 CGI 处理而非作为静态文件返回，同时建议修改数据库密码并限制数据库仅允许本地连接。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Mozilla Bugzilla 敏感信息泄露漏洞"
updated = "2026-06-16T21:54:06Z"

