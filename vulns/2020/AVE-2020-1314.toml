[basic]
description = "Cisco IP Phones 内置 Web 服务器存在输入验证不足漏洞，未经身份认证的远程攻击者可通过向目标设备发送特制的 HTTP 请求触发该漏洞，从而以 root 权限执行任意代码或导致受影响 IP 电话重新加载，造成拒绝服务。该漏洞由 Web 服务器对 HTTP 请求缺乏适当的输入验证导致，攻击者无需任何身份凭据即可远程利用。成功利用后攻击者可完全控制受影响设备或造成通信服务中断，CVSS v3.1 评分为 9.8，危害等级严重。Cisco 已在后续固件更新中修复此漏洞，建议受影响用户尽快升级至安全版本。"
published = "2020-04-15T20:15:15.097"
remediation = "升级到修复版本：桌面话机升级至 11.7(1) 固件，8831 会议话机升级至 10.3(1)SR6，8821/8821-EX 无线话机升级至 11.0(5)SR3。如短期内无法升级，在 Cisco Unified Communications Manager 中关闭受影响话机的 Web Access（Device > Phone > 选择话机 > 将 Web Access 设为 Disabled）作为临时缓解措施，因为 Web 访问默认即已禁用，关闭后话机不再受此漏洞影响。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Cisco IP Phones Web 服务器远程代码执行漏洞"
updated = "2026-06-17T03:17:31.293"

