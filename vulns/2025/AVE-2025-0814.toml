[basic]
description = "Windows Internet 连接共享（ICS）组件存在拒绝服务漏洞，其根源在于 ICS 服务对特制网络数据包的处理不当，导致资源消耗失控（CWE-400）。未经身份认证的攻击者在同一相邻网络段上，无需用户交互即可向目标系统的 ICS 服务发送特制数据包，触发该漏洞，导致目标系统服务停止响应或崩溃，造成拒绝服务。该漏洞影响多个 Windows 版本，CVSS 评分 6.5，危害等级中危。Microsoft 已在 2025 年 2 月安全更新（5051974）中修复此漏洞。"
published = "2025-02-11T18:15:34.310"
remediation = "建议立即安装 Microsoft 2025 年 2 月安全更新 (KB5051974)，或通过 Windows Update 自动获取更新。受影响版本包括 Windows 10/11 多版本及 Windows Server 2016/2019/2022/2025，各版本对应的修复版本号分别为 10.0.10240.20915 (1507)、10.0.14393.7785 (1607)、10.0.17763.6893 (1809)、10.0.19044.5487 (21H2)、10.0.19045.5487 (22H2)、10.0.22621.4890 (22H2)、10.0.22631.4890 (23H2)、10.0.26100.3194 (24H2)。如无法立即打补丁，可在防火墙层面限制对 ICS 服务的网络访问作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Internet Connection Sharing (ICS) 拒绝服务漏洞"
updated = "2026-06-17T08:43:10.573"

