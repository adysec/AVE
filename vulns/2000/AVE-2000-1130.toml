[basic]
description = "Netsnap webcam HTTP server 1.2.9之前版本中存在缓冲区溢出漏洞。该漏洞源于程序在处理HTTP GET请求时未对输入长度进行正确校验，远程攻击者无需身份认证即可通过向目标服务器发送超长的GET请求触发缓冲区溢出，覆盖内存中的关键数据，进而导致任意命令执行。攻击复杂度低，仅需网络可达即可利用，影响所有运行受影响版本Netsnap webcam HTTP服务的设备。"
published = "2001-01-09T05:00:00Z"
remediation = "立即将 Netsnap webcam HTTP server 升级至 1.2.9 及以上版本，该版本已修复对超长 GET 请求（约 342 字节）的缓冲区边界检查。如无法升级（产品已停止维护），建议在防火墙或反向代理层面限制对 TCP 8080 端口的访问，仅允许可信 IP 连接，或更换为其他仍在维护的 Webcam 服务软件。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Netsnap Webcam HTTP Server 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:18Z"

