[basic]
description = 'Big Brother System and Network Monitor 的 bbd 服务器组件存在命令注入漏洞，由于未对用户输入中的 shell 元字符进行过滤，远程攻击者可通过向目标服务器的 bbd 服务发送包含 "&" 等 shell 元字符的特制请求，在服务器上以 bbd 进程权限执行任意系统命令。该漏洞影响 Big Brother System and Network Monitor 1.5c2 之前的所有版本，CVSS 评分 7.5，危害等级高。攻击者无需身份认证即可远程利用，可能导致服务器被完全控制、数据泄露或进一步横向移动。'
published = "2000-12-19T05:00:00Z"
remediation = "升级 Big Brother System and Network Monitor 至 1.5c2 或更高版本，该版本修复了 bbd 服务器对 shell 元字符（&）的过滤缺陷。如无法升级，在 bbd 服务器前端部署反向代理或 WAF，对传入请求中的 shell 元字符进行过滤拦截，或禁用 bbd 服务的网络暴露端口。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Big Brother System and Network Monitor bbd服务器 远程命令执行漏洞"
updated = "2026-06-16T21:52:53Z"

