[basic]
description = "Python 的 plistlib 模块在加载 Plist 文件时，按照文件自身指定的大小读取数据，未对输入大小进行限制验证。攻击者可构造恶意 Plist 文件，指定极大的尺寸值，诱使模块尝试分配过量内存，导致内存耗尽（OOM）并引发拒绝服务（DoS）。该漏洞影响使用 Python 处理不受信任 Plist 文件的所有应用场景，攻击条件为受害者加载了特制的恶意 Plist 文件。CWE 编号为 CWE-400（资源消耗失控），CVSS 评分为 2.1 等级为低危。Debian 与 SUSE 已发布安全通告，建议用户更新 Python 包至修复版本以缓解风险。"
published = "2025-12-01T18:16:04Z"
remediation = "升级至 Python 3.11.15 或更高版本（包括 3.12.x、3.13.x），该版本已合入修复分块读取大数据的补丁，可防止恶意构造的 plist 文件触发内存耗尽。建议通过系统包管理器或 pip 执行：执行 pip install --upgrade python 或使用 apt/yum 更新至对应版本。如无法立即升级，应避免从不受信任的来源加载 plist 文件作为临时缓解措施，同时监控进程内存使用，防止 OOM 导致系统不可用。"
score = 2.1
severity = "LOW"
sources = ["msrc"]
title = "Python plistlib 加载Plist文件时内存不足导致拒绝服务漏洞"
updated = "2026-06-17T08:34:50Z"

