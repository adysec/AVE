[basic]
description = "Adobe Flash Player 9.0.289.0之前版本及10.x系列10.1.102.64之前版本在Windows平台上存在不可信搜索路径漏洞（DLL劫持）。本地用户（以及可能的远程攻击者）通过将恶意dwmapi.dll放置在Flash Player处理的文件所在目录中，当用户打开该文件时Flash Player会加载恶意DLL，从而导致任意代码执行。攻击者需诱导用户打开包含恶意DLL的目录中的文件，攻击条件相对容易满足，危害严重。"
published = "2010-10-19T21:00:10Z"
remediation = "立即升级 Adobe Flash Player 至 9.0.289.0（9.x 系列）或 10.1.102.64（10.x 系列）及以上版本。如无法升级，避免在不可信目录中打开 Flash 内容文件，并禁用 ActiveX 控件中自动加载 dwmapi.dll 的行为。企业环境可通过组策略限制 Flash 内容执行权限作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player DLL劫持远程代码执行漏洞"
updated = "2026-06-16T23:23:55Z"

