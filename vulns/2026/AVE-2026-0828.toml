[basic]
description = "Open WebUI 是一款可扩展、功能丰富的自托管 AI 平台，其 Socket.IO 服务器配置了 `always_connect=True`，且 `ydoc:awareness:update` 和 `ydoc:document:leave` 两个协作文档事件处理程序未进行身份验证检查。未经身份验证的远程攻击者可通过 WebSocket 连接，伪造 `user_id` 向协作文档房间广播虚假光标位置、用户状态等意识数据，或发送伪造的用户离开事件，导致 UI 干扰、用户身份冒充及服务器资源耗尽。该漏洞影响 Open WebUI 0.6.16 至 0.10.0 之前版本，CVSS 评分 3.1，危害等级低。已在 0.10.0 版本中修复。"
published = "2026-07-09T17:17:04Z"
remediation = "立即升级 Open WebUI 至 v0.10.0 或更高版本，该版本已修复 Socket.IO 未认证访问问题。如无法立即升级，手动修改 `backend/open_webui/socket/main.py`：将 `always_connect=True` 改为 `False`，并在 `connect` 事件处理器中对未认证连接返回 `False`；同时在 `ydoc:awareness:update` 和 `ydoc:document:leave` 处理器中添加 `SESSION_POOL` 成员身份校验，拒绝未认证客户端的协作文档事件。"
score = 3.1
severity = "LOW"
sources = ["ghsa"]
title = "Open WebUI Socket.IO 未授权访问协作文档处理程序漏洞"
updated = "2026-07-10T02:41:47Z"

