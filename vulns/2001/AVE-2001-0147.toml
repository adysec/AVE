[basic]
description = "标签之间。<value>Microsoft 为 IIS 5.0 及更早版本发布的 MS00-060 安全补丁存在编程错误，未经身份认证的远程攻击者可通过发送特制的畸形请求触发该漏洞，导致目标 Web 服务器拒绝服务。该漏洞影响 Windows NT/2000 平台上的 Internet Information Services（IIS）5.0 及更早版本，攻击者无需凭据即可利用，攻击复杂度低。攻击者向 IIS 服务发送精心构造的恶意 HTTP 请求即可使 Web 服务停止响应，造成服务中断。"
published = "2001-06-27T04:00:00Z"
remediation = "立即安装 Microsoft 2001 年 5 月安全更新 MS01-026，或升级到 Windows 2000 Service Pack 3 / Windows NT 4.0 Service Pack 6a 及后续安全汇总。IIS 4.0 需安装 Q295534 补丁，IIS 5.0 需安装 Q293826 补丁。如无法立即打补丁，可在防火墙或入侵检测系统层面过滤包含超长或异常编码字符序列的 HTTP 请求，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft IIS 5.0 MS00-060 补丁拒绝服务漏洞"
updated = "2026-06-16T21:54:07Z"

