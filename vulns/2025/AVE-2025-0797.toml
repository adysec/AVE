[basic]
description = "Windows 电话服务（Telephony Service）存在堆缓冲区溢出漏洞（CWE-122），由于服务在处理特制请求时对输入数据长度校验不严，导致内存损坏。远程攻击者可通过向目标用户发送恶意构造的请求并诱使其交互（如点击链接或打开恶意文件），在目标系统上以电话服务进程权限执行任意代码。该漏洞影响多个 Windows 版本，包括 Windows 10、Windows 11 及 Windows Server 系列，CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:59.480"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新。各受影响版本对应的修复版本号：Windows 10 1507 升级至 10.0.10240.20890，Windows 10 1607/Server 2016 升级至 10.0.14393.7699，Windows 10 1809/Server 2019 升级至 10.0.17763.6775，Windows 10 21H2 升级至 10.0.19044.5371，Windows 10 22H2 升级至 10.0.19045.5371，Windows 11 22H2 升级至 10.0.22621.4751，Windows 11 23H2 升级至 10.0.22631.4751，Windows 11 24H2/Server 2025 升级至 10.0.26100.2894，Server 2022 升级至 10.0.20348.3091，Server 2022 23H2 升级至 10.0.25398.1369。可通过 Windows Update 自动获取更新，或从 Microsoft Update Catalog 手动下载对应 KB 补丁包。如无法立即打补丁，建议禁用 TAPI 服务（Telephony Service）并在防火墙限制对 RPC 端口的访问作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:43:08.630"

