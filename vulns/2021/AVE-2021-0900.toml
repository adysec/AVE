[basic]
description = "Nagios XI 5.5.6 至 5.7.5 版本存在操作系统命令注入漏洞。漏洞位于 /usr/local/nagiosxi/html/includes/configwizards/switch/switch.inc.php 文件中，由于对已认证用户可控输入未进行充分的特殊字符过滤与转义处理，攻击者可通过单个特制 HTTP 请求注入并执行任意操作系统命令，进而在 Nagios XI 服务器上以服务器权限执行恶意代码。该漏洞影响 Nagios XI 5.5.6 至 5.7.5 版本，攻击者需要先获得有效用户凭据完成身份认证后方可触发漏洞。CISA 已知被利用漏洞目录已将 CVE-2021-25297 纳入，表明该漏洞已有在野利用记录。成功利用可导致攻击者完全接管服务器，对监控基础设施造成严重安全威胁。"
published = "2021-02-15T13:15:12Z"
remediation = "将 Nagios XI 升级至 5.8.0 或更高版本（5.8.0 和 5.8.1 均已修复此漏洞），可从 https://assets.nagios.com/downloads/nagiosxi/versions.php 下载最新安装包覆盖升级。如暂无法立即升级，应通过防火墙或访问控制列表限制对 /nagiosxi/config/monitoringwizard.php 页面的外部访问，仅允许受信任的管理网段 IP 访问 Nagios XI Web 界面，以降低被利用风险。升级完成后，验证 /usr/local/nagiosxi/html/includes/configwizards/switch/switch.inc.php 中 ip_address 参数已正确过滤特殊字符，确保不再传递未转义输入至系统命令执行函数。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Nagios XI 操作系统命令注入漏洞"
updated = "2026-07-09T13:39:51Z"

