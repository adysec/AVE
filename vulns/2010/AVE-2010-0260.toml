[basic]
description = "RealNetworks RealPlayer 在处理 RTSP 流中的 GIF87a 文件时存在堆缓冲区溢出漏洞。由于程序未正确验证 GIF 文件 Screen Descriptor 头部的 Screen Width 字段大小，远程攻击者可通过向目标系统发送包含特制大宽度值的 GIF87a 图像的 RTSP 流触发堆缓冲区溢出，导致拒绝服务或远程代码执行。该漏洞影响 RealPlayer 11.0 至 11.1、RealPlayer SP 1.0 至 1.1.1、Mac RealPlayer 11.0 至 11.1 及 Linux RealPlayer 11.0.2.1744 版本，CVSS 评分 9.3，危害等级严重。用户需升级至 RealPlayer 12.0.1.609 或更高版本以修复此漏洞。"
published = "2010-12-14T16:00:04Z"
remediation = "立即升级 RealPlayer 至 12.0.1.609 或更高版本。Windows 用户可通过 RealPlayer 内置更新功能检查并安装更新，或从 real.com 下载最新版本。Linux 用户应升级至 11.0.2.1744 以上版本。如无法升级，可在防火墙或代理层面阻止对不可信 RTSP 流媒体的访问，并禁用浏览器中 RealPlayer 对 RTSP 协议的处理。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer RTSP GIF解析堆缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T23:24:40Z"

