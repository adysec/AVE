[basic]
description = "Windows COM Aggregate Marshaler 组件在处理 IRemUnknown2 接口时存在类型混淆漏洞，导致本地权限提升。本地攻击者可通过运行特制应用程序触发该漏洞，以当前用户权限执行任意代码，从而获取目标系统的高权限控制。该漏洞影响 Windows 7/8.1/10/Server 2008/2012/2016 等多个版本，CVSS 评分 7.3，危害等级高。Microsoft 已在 2017 年 5 月安全更新中修复此漏洞，且该漏洞已被 CISA 列入已知被利用漏洞目录。"
published = "2017-05-12T14:29:01Z"
remediation = "立即安装 Microsoft 2017 年 5 月安全更新：Windows 10 1607 安装 KB4019472，Windows 10 1703 安装 KB4016871，Windows 7 SP1 安装 KB4019264，Windows 8.1 安装 KB4019215，Windows Server 2008/2012/2016 安装对应月度安全更新。如无法打补丁，可限制非管理员用户运行未信任应用程序，并启用 Windows Defender 应用程序控制策略作为临时缓解。"
score = 7.3
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows COM 特权提升漏洞"
updated = "2026-06-17T00:57:16Z"

