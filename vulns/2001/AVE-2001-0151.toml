[basic]
description = 'Qualcomm Eudora 邮件客户端在 5.1 及更早版本中存在远程代码执行漏洞。当用户启用"Use Microsoft Viewer"和"allow executables in HTML content"选项后，攻击者可通过发送包含 JavaScript 代码、ActiveX 控件以及嵌入了恶意代码的 IMG 标签的 HTML 格式电子邮件，在目标用户打开邮件时触发代码执行。该漏洞无需身份认证即可远程利用，攻击复杂度低，成功利用可导致攻击者在目标系统上执行任意代码并获取敏感信息。CVSS 评分为 7.5，危害等级为高危。'
published = "2001-06-27T04:00:00Z"
remediation = "立即将 Eudora 升级至 5.1 或更高版本以修复该漏洞。临时缓解措施为在设置中禁用「Use Microsoft Viewer」选项，并关闭「allow executables in HTML content」配置，阻止 HTML 邮件中的 JavaScript 与 ActiveX 控件执行。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Qualcomm Eudora 远程代码执行漏洞"
updated = "2026-06-16T21:54:10Z"

