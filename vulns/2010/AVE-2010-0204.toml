[basic]
description = "OpenOffice.org 的 oowriter 组件在处理特制 RTF 文档中的畸形表格时存在释放后使用（Use-After-Free）漏洞。远程攻击者可通过向目标用户发送包含恶意表格的 RTF 文件，诱使用户在受影响版本的 OpenOffice.org 中打开该文件，从而触发漏洞。成功利用此漏洞可导致应用程序崩溃（拒绝服务），或在目标系统上以当前用户权限执行任意代码。该漏洞影响 OpenOffice.org 2.x 及 3.3 之前的所有 3.x 版本，CVSS 评分 9.3，危害等级严重。用户需升级至 OpenOffice.org 3.3 或更高版本以修复此漏洞。"
published = "2011-01-28T22:00:05Z"
remediation = "升级 OpenOffice.org 至 3.3 或更高版本，该版本修复了 RTF 文档解析中的释放后使用漏洞。如无法立即升级，建议禁用 OpenOffice 自动打开 RTF 附件的功能，并在邮件网关层面拦截可疑 RTF 文件，同时限制 oowriter 进程对敏感系统目录的写入权限作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apache OpenOffice Writer RTF文档处理释放后使用漏洞"
updated = "2026-06-16T23:22:48Z"

