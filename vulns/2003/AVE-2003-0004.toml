[basic]
description = "Red Hat Linux 8.0 的 kernel-utils 软件包中的 uml_net 工具存在不正确的 setuid root 权限设置漏洞。本地普通用户可利用该工具错误的特权提升配置，通过修改 ARP 表项或将网络接口设置为混杂模式等方式，实现对网络接口的未授权修改。攻击者无需任何身份认证即可利用此漏洞，完全控制目标系统的网络行为，造成机密性、完整性和可用性全面受损。该漏洞影响 Red Hat Linux 8.0 系统，CVSS 评分 7.2，危害等级高。"
published = "2003-02-19T05:00:00Z"
remediation = "立即移除 uml_net 的 setuid root 权限位：`chmod u-s /usr/bin/uml_net`，并升级 kernel-utils 包至修复版本（如 kernel-utils-2.4-8.14 及以上）。如无法升级，可通过 `chmod 755 /usr/bin/uml_net` 取消 setuid 位作为临时缓解措施，限制本地用户以 root 权限修改网络接口。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "Red Hat Linux kernel-utils uml_net 本地权限提升漏洞"
updated = "2026-06-16T22:01:21Z"

