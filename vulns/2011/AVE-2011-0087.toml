[basic]
description = "Mozilla Firefox 3.6.x 及 Thunderbird 3.1.x 的浏览器引擎中存在未指定的内存破坏漏洞。远程攻击者可通过构造特制的网页内容，诱使用户访问后触发内存损坏，导致浏览器崩溃或拒绝服务，甚至可能实现任意代码执行。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响 Firefox 3.6.18 之前版本及 Thunderbird 3.1.11 之前版本，CVSS 评分 10.0，危害等级严重。Mozilla 已在 2011 年 6 月发布的安全更新中修复此漏洞。"
published = "2011-06-30T16:55:05Z"
remediation = "立即将 Mozilla Firefox 升级至 3.6.18 或更高版本，将 Mozilla Thunderbird 升级至 3.1.11 或更高版本。如无法立即升级，可禁用 JavaScript 并限制访问不可信网站作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox 与 Thunderbird 浏览器引擎内存破坏漏洞"
updated = "2026-06-16T23:31:11Z"

