[basic]
description = "Apache Struts2 框架在处理命名空间（namespace）时存在远程代码执行漏洞（S2-057）。当 alwaysSelectFullNamespace 属性设置为 true（由用户或 Convention 等插件启用）时，攻击者可通过构造特制的 URL 请求，利用无命名空间的结果配置与上层包的通配符命名空间组合，触发 OGNL 表达式注入，从而在目标服务器上执行任意系统命令。该漏洞影响 Apache Struts2 2.0.4 至 2.3.34 以及 2.5.0 至 2.5.16 版本，攻击复杂度较高但无需身份认证，成功利用可导致服务器完全受控、数据泄露或服务中断。CVSS 评分 8.1，危害等级高。"
published = "2018-08-22T13:29:00.753"
remediation = "升级 Apache Struts 至 2.3.35 或 2.5.17 及以上版本。如无法立即升级，在 struts.xml 中确保所有 result 和 url 标签显式指定 namespace 属性，避免使用通配符 namespace，并检查禁用 Convention 插件中的 alwaysSelectFullNamespace 配置项。"
score = 8.1
severity = "HIGH"
sources = ["kev"]
title = "Apache Struts2 远程代码执行漏洞（S2-057）"
updated = "2026-06-17T01:36:34.350"

