[basic]
description = "OpenSSH 3.7.1 及 3.7.1p1 版本的 PAM（可插拔认证模块）对话函数存在数组类型混淆漏洞，该函数错误地将结构体数组解释为指针数组进行遍历，导致栈内存被意外覆盖。未经身份认证的远程攻击者可通过向目标 SSH 服务发送特制的 PAM 认证响应触发此漏洞，利用栈溢出修改关键执行上下文，进而获得提升的权限或执行任意代码。该漏洞影响运行受影响版本 OpenSSH 的 Linux/Unix 系统，CVSS 评分为 7.5，危害等级高。"
published = "2003-11-17T05:00:00Z"
remediation = "升级到 Portable OpenSSH 3.7.1p2 或更高版本以彻底修复此漏洞。若无法立即升级，可在 sshd_config 配置文件中将 UsePam 设置为 no 以禁用 PAM 支持，然后重启 sshd 服务使配置生效。建议仅在确实需要使用 PAM 集成（如 Kerberos、LDAP 认证或会话管理）时才启用 UsePam，并配合编译时开启 privsep 选项以增强安全性。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "OpenSSH PAM 对话函数数组解释错误权限提升漏洞"
updated = "2026-06-16T22:02:50Z"

