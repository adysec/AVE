[basic]
description = "Linux 内核 TLS 子系统中存在释放后使用（Use-After-Free）漏洞，由于非异步解密请求处理与异步解密请求处理未正确分离，在特定竞争条件下可导致已释放的内存被引用。本地低权限攻击者可通过精心构造的 TLS 解密请求触发该漏洞，成功利用可实现权限提升，获得完全的内存读写能力，进而控制系统。该漏洞影响 Linux 内核各发行版版本，CVSS 评分 7.8，危害等级高。"
published = "2025-08-28T10:15:31Z"
remediation = "立即将 Linux 内核升级至 6.1.149、6.6.21、6.7.9 或 6.8 及以上版本（对应各长期支持分支的修复版本）。Debian 用户请安装 DSA-6009-1 安全更新。如无法立即升级，可通过内核模块黑名单临时禁用 TLS 卸载功能（modprobe.blacklist=tls），但建议优先安排内核重启升级以彻底修复 Use-After-Free 漏洞。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux Kernel TLS 释放后使用漏洞"
updated = "2026-06-17T08:14:42Z"

