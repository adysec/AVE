[basic]
description = "华为USG9500防火墙固件存在初始化不恰当漏洞，由于特定加密算法中初始化向量的处理不当，导致加密功能的机密性保护能力被削弱。攻击者可在无需身份认证的网络条件下，通过访问该加密原语并分析密文，推断出部分敏感信息。该漏洞影响USG9500多个固件版本（包括V500R001C30SPC100、V500R001C30SPC200、V500R001C30SPC600、V500R001C60SPC500、V500R005C00SPC100、V500R005C00SPC200），CVSS评分为3.7，危害等级为低危。华为已发布后续版本修复此问题，用户应及时升级固件以消除信息泄露风险。"
published = "2020-01-21T19:15:13.113"
remediation = "立即将USG9500固件从受影响版本（V500R001C30SPC100/200/600、V500R001C60SPC500、V500R005C00SPC100/200）升级至修复版本V500R005C20SPC300。升级前通过华为TAC（Technical Assistance Center）申请获取正式修复包，升级后验证加密模块初始化向量处理是否正常。若暂时无法升级，可限制对USG9500管理接口的网络访问范围，仅允许可信IP段访问，以降低攻击面。"
score = 3.7
severity = "LOW"
sources = ["nuclei"]
title = "华为 USG9500 固件初始化不恰当导致信息泄露漏洞"
updated = "2026-06-17T02:26:37.917"

