[basic]
description = 'Windows NT 4.0 的 Winsock2ProtocolCatalogMutex 互斥体存在不安全的默认权限配置漏洞（CWE-732），该互斥体被设置为 Everyone/Full Control 权限，导致本地攻击者可以修改其访问权限为"No Access"，从而禁用 Winsock 网络功能，造成拒绝服务。攻击者只需拥有本地系统访问权限即可利用，无需高权限。该漏洞影响 Windows NT 4.0 系统，ExploitDB 已有公开利用代码。'
published = "2001-02-12T05:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS01-003 提供的补丁，下载地址为 https://www.microsoft.com/download/details.aspx?FamilyId=09269636-F399-41CA-A3B4-A32F97053B2F（Windows NT 4.0）或 https://www.microsoft.com/download/details.aspx?FamilyId=F8AE733B-DB34-41A0-B534-190BD8E55A86（Terminal Server Edition），要求系统已安装 Service Pack 6a。如无法打补丁，应严格限制非特权用户的交互式登录权限，不在域控制器、文件服务器等关键服务器上授予普通用户本地登录权限，以降低被本地利用的风险。"
score = 7.1
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Windows NT 4.0 Winsock Mutex 拒绝服务漏洞"
updated = "2026-06-16T21:53:28Z"

