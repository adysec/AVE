[basic]
description = "LangBot（一个 AI 对话机器人平台）的 MCP 配置功能存在 OS 命令注入漏洞（CWE-78）。已认证的攻击者可通过在 MCP Server 配置中添加恶意的 STDIO 类型服务，传入任意系统命令，导致远程代码执行。攻击者仅需拥有有效账户即可利用该漏洞，可执行数据窃取、反弹 Shell 乃至完全控制服务器等操作。该漏洞影响所有公开部署的 LangBot 实例及同一网络环境下的本地实例。"
published = "2026-01-01T00:00:00Z"
remediation = "立即限制 MCP 配置功能的访问权限，仅允许管理员角色操作 STDIO 类型的 MCP 服务端配置，禁止普通用户添加或修改 MCP 配置。在代码层面，对 src/langbot/pkg/provider/tools/loaders/mcp.py 中的 StdioServerParameters 命令参数进行严格白名单校验，拒绝所有非预定义命令。如业务不需要 MCP 扩展功能，建议在管理界面中完全禁用 MCP 选项卡。同时将 LangBot 实例部署在内网并配置防火墙规则，限制来源 IP 访问 Web 管理界面，降低未授权访问风险。关注 LangBot 官方仓库等待补丁发布后立即升级。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "LangBot MCP 配置认证后远程代码执行漏洞"
updated = "2026-01-01T00:00:00Z"

