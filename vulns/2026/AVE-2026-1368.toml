[basic]
description = "Flowise 的 GET /api/v1/upsert-history 端点存在访问控制缺陷，未经充分身份认证和授权的低权限用户可访问该接口，服务器将返回完整的全局上传历史数据而非限定于当前用户或工作空间。响应数据量可超过 100MB，其中包含 Vector Store 等敏感配置参数（如 Qdrant Server URL、Collection 名称、向量维度等基础设施信息）。该漏洞影响 Flowise 3.1.3 之前的所有版本，攻击者无需额外验证即可通过发送简单 HTTP GET 请求获取全站敏感配置数据，进而实施进一步的针对性攻击。该漏洞已于 Flowise 3.1.3 版本中修复。"
published = "2026-08-04T19:16:54Z"
remediation = "升级到 Flowise 3.1.3 或更高版本，该版本已修复 GET /api/v1/upsert-history 接口的未授权访问和数据越权泄露问题。如无法立即升级，可通过反向代理（如 Nginx）配置访问控制规则，仅允许特定 IP 或 authenticated 用户访问 /api/v1/upsert-history 端点，并在应用层启用基于用户身份或工作空间的请求范围隔离与分页限制，防止跨租户数据泄露和超大响应导致的资源耗尽。"
score = 8.3
severity = "HIGH"
sources = ["ghsa"]
title = "Flowise 未授权信息泄露漏洞"
updated = "2026-08-04T20:16:54Z"

