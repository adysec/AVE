[basic]
description = "tags.<value>Mozilla Firefox 3.0.x（3.0.18之前）及3.5.x（3.5.8之前）版本，以及SeaMonkey 2.0.3之前的版本，其Web Worker功能在处理通过postMessage传递的数组数据类型时存在缺陷。攻击者可利用此缺陷通过特制的消息触发堆内存破坏，导致浏览器崩溃并可能执行任意代码。该漏洞无需身份认证即可远程利用，CVSS评分为10.0，危害等级极高。"
published = "2010-02-22T13:00:02Z"
remediation = "Mozilla Firefox 3.0.x 用户应升级至 3.0.18 或更高版本，Firefox 3.5.x 用户应升级至 3.5.8 或更高版本，SeaMonkey 用户应升级至 2.0.3 或更高版本，以修复 Web Worker 数组数据类型处理不当导致的内存破坏漏洞。升级前建议清除浏览器缓存并重启浏览器，确保补丁完全生效。若暂无法立即升级，可临时在浏览器配置中禁用 Web Workers 功能作为缓解措施，降低被远程攻击者利用执行任意代码的风险。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox 和 SeaMonkey Web Worker 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:15:35Z"

