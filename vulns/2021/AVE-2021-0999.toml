[basic]
description = "Atlassian Jira Server 和 Data Center 存在路径遍历漏洞，未经身份认证的远程攻击者可通过 /WEB-INF/web.xml 端点构造包含路径遍历序列的特制请求，读取服务器上的敏感文件。该漏洞影响 8.5.14 之前、8.6.0 至 8.13.6 之前以及 8.14.0 至 8.16.1 之前的版本，攻击者无需凭据即可利用，可能导致配置信息、密钥等敏感数据泄露。CVSSv3.1 评分为 5.3，危害等级为中等。"
published = "2021-08-16T01:15:06Z"
remediation = "立即将 Atlassian Jira Server 及 Data Center 升级至安全版本：8.5.14、8.13.6 或 8.16.1（根据当前所处版本线选择对应修复版本）。升级前请先在测试环境验证兼容性并备份数据库与实例目录。如暂无法升级，可在反向代理或 Web 服务器层对 /WEB-INF/web.xml 路径实施访问拒绝，仅放行业务所需端口，并在升级完成后立即解除该临时限制。"
score = 5.3
severity = "MEDIUM"
sources = ["kev"]
title = "Atlassian Jira 任意文件读取漏洞"
updated = "2026-06-17T03:42:50Z"

