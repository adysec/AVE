[basic]
description = "Internet Explorer 5.x 及 Microsoft Outlook 中存在任意文件读取漏洞。远程攻击者可通过 DHTML 编辑控件（DHTMLED）重定向 IFRAME 内容，从而读取目标系统上的任意文件。攻击者无需身份认证，只需诱导用户访问恶意网页即可触发该漏洞，导致敏感信息泄露。该漏洞影响 Internet Explorer 5.x 及 Microsoft Outlook 等产品，CVSS 评分 5.0，危害等级中等。"
published = "2000-07-14T04:00:00.000"
remediation = "该漏洞影响已停止支持的 Internet Explorer 5.x 及 Outlook，攻击者可通过 DHTML Edit Control 重定向 IFRAME 内容读取任意文件。建议立即升级到受支持的 Microsoft Edge 浏览器，或升级到 Internet Explorer 最新受支持版本（IE11）。如因兼容性必须使用旧版 IE，建议禁用 ActiveX 控件和 DHTML Edit Control（DHTMLED.OCX），并在组策略中设置受限站点区域为高安全级别，同时禁用脚本和 ActiveX 功能。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Internet Explorer DHTML Edit Control 任意文件读取漏洞"
updated = "2026-06-16T21:52:12.913"

