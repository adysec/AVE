[basic]
description = "Microsoft Exchange Server 存在信息泄露漏洞，攻击者可利用该漏洞实现远程代码执行，该漏洞被称为 ProxyOracle，由 DEVCORE 研究人员在 Pwn2Own 2021 竞赛中发现。漏洞原理在于 Exchange Server 的代理功能在处理特定 HTTP 请求时未对用户输入进行充分验证，导致攻击者可通过发送特制的 HTTP 请求利用服务器代理功能在未经适当身份验证的情况下转发请求，从而泄露敏感信息并最终实现远程代码执行。成功利用该漏洞需要攻击者具备 Exchange Server 的高权限账户凭据。该漏洞影响 Microsoft Exchange Server 2013、2016 和 2019 的多个累积更新版本，CVSS 评分 7.2，危害等级为高危。Microsoft 已于 2021 年 7 月发布安全更新修复此漏洞，CISA 已将其列入已知被利用漏洞目录。"
published = "2021-07-14T18:15:09Z"
remediation = '立即安装 Microsoft 2021 年 7 月安全更新 KB5001779，将 Exchange Server 2013 升级至累积更新 24（版本号 15.00.1497.023）、Exchange Server 2016 升级至累积更新 22（版本号 15.01.2308.014）、Exchange Server 2019 升级至累积更新 10（版本号 15.02.0922.013），安装后验证 IIS 应用程序池已重启。如暂时无法安装补丁，可在 IIS 管理器请求筛选功能中拒绝包含 "../" 或过长路径的 Autodiscover 请求，或通过防火墙规则限制外部对 Exchange 服务器 443 端口 Autodiscover 目录的访问来源 IP，同时监控 IIS 日志中是否存在异常的 Autodiscover.json 请求路径以检测利用尝试。详见 https://portal.msrc.microsoft.com/en-US/security-guidance/advisory/CVE-2021-31196'
score = 7.2
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Exchange Server 远程代码执行漏洞"
updated = "2026-06-17T03:51:25Z"

