[basic]
description = "Mozilla Firefox、Thunderbird 及 SeaMonkey 的浏览器引擎中存在多处内存安全漏洞，远程攻击者可通过诱导用户访问特制网页触发内存破坏，导致应用程序崩溃或实现任意代码执行。该漏洞影响 Firefox 3.6.26 之前版本及 4.x 至 9.0 版本、Thunderbird 3.1.18 之前版本及 5.0 至 9.0 版本、SeaMonkey 2.7 之前版本，攻击者无需身份认证即可利用，CVSS 评分 9.3，危害严重。Mozilla 已在相应版本更新中修复此漏洞。"
published = "2012-02-01T16:55:00Z"
remediation = "将 Firefox 升级至 3.6.26 或 10.0 及以上版本，Thunderbird 升级至 3.1.18 或 10.0 及以上版本，SeaMonkey 升级至 2.7 及以上版本。无法立即升级时，可禁用 JavaScript（Firefox 中设置 about:config → javascript.enabled → false）并限制仅访问可信站点作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/SeaMonkey/Thunderbird 浏览器引擎内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:16Z"

