[basic]
description = "NetWin dMailWeb 和 cwMail 2.6g 及早期版本存在认证绕过漏洞，攻击者可通过在用户名中插入回车字符（%0D）绕过身份验证机制，利用服务器进行邮件中继攻击。该漏洞源于对用户名输入缺乏对控制字符的过滤，导致认证逻辑被绕过。攻击者无需认证即可远程利用，CVSS 评分 5.0（中等），影响完整性。影响范围为 NetWin dMailWeb 和 cwMail 2.6g 及早期版本，攻击者可远程匿名利用，将服务器作为开放邮件中继发送垃圾邮件。建议升级至 2.6g 以降版本或应用厂商补丁修复输入验证缺陷。"
published = "2000-06-23T04:00:00.000"
remediation = "建议立即升级 NetWin dMailWeb 和 cwMail 至 2.6g 以上版本（建议升级至最新版本）。若暂时无法升级，可在邮件服务器前置防火墙层面拦截包含回车符（%0D 或 %0A）的用户名请求，并在 SMTP 服务器配置中禁用开放中继功能，仅允许经过认证的用户发送邮件。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "NetWin dMailWeb/cwMail 认证绕过漏洞"
updated = "2026-06-16T21:52:06.333"

