[info]
author = "ave"
description = "验证目标是否受 CVE-2001-0322 影响。该漏洞为 MSHTML.DLL HTML 解析器在处理 JavaScript 脚本时的拒绝服务漏洞，远程攻击者可通过构造包含恶意脚本的网页，在浏览器窗口中创建并删除与窗口对象关联的对象来触发 MSHTML.DLL 崩溃。"
id = "POC-AVE-2001-0143"
name = "CVE-2001-0322 Microsoft IE MSHTML.dll DoS PoC"
severity = "medium"
tags = ["ave-2001-0143"]
vuln_id = [
    "CVE-2001-0322",
    "AVE-2001-0143",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = [
    "MSHTML.DLL",
    "Internet Explorer",
]
