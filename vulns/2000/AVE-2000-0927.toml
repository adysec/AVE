[basic]
description = 'Bajie HTTP web服务器0.30a版本存在安全漏洞，其内置的"test" Java样板Servlet会意外泄露真实Web文档根目录路径信息。这允许攻击者无需身份验证即可获取服务器文件系统的内部结构，潜在泄露敏感文件或系统信息。攻击者通过简单的HTTP请求即可触发该漏洞，使服务器返回敏感路径，导致网站信息暴露，危及系统安全。该漏洞影响Bajie HTTP web服务器0.30a版本，可通过向服务器发送特定请求触发信息披露。'
published = "2000-10-20T04:00:00Z"
remediation = '立即升级到Bajie Webserver 1.0+版本或更高版本以修复路径泄露漏洞。如果无法立即更新，建议通过修改web.xml文件禁用"test"servlet，并限制servlet权限至最小化原则，以防止攻击者访问真实目录信息。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Bajie Webserver 路径泄露漏洞"
updated = "2026-06-16T21:52:27Z"

