[basic]
description = "SunFTP 1.0 Build 9 存在拒绝服务漏洞。远程攻击者可通过建立 FTP 连接后，在发送换行符之前主动断开连接，导致服务器无法正确处理异常连接状态，从而消耗服务器资源并造成服务崩溃。该漏洞影响 SunFTP 1.0 Build 9 版本，攻击者无需身份认证即可远程触发，危害等级中等。目前厂商已停止维护该产品，建议用户升级至更高版本或更换其他 FTP 服务器软件。"
published = "2000-11-14T05:00:00Z"
remediation = "升级 SunFTP 至 build 9(1) 之后的版本（如 build 10 或更高），该漏洞已在后续版本中修复。由于 SunFTP 已停止维护，建议迁移至其他活跃维护的 FTP 服务器软件（如 FileZilla Server 或 vsftpd）。如无法立即更换，可在防火墙层面限制对 FTP 端口的来源 IP 范围，仅允许可信 IP 连接，降低被攻击面。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Rasmus J.P. Allenheim SunFTP 1.0 Build 9 拒绝服务漏洞"
updated = "2026-06-16T21:52:36Z"

