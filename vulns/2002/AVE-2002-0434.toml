[basic]
description = 'PHP 4.2.2 之前版本的 IMAP 功能中存在 php_if_imap_mime_header_decode 函数缓冲区处理缺陷，远程攻击者可通过向目标服务器发送包含超长 "To" 头的特制电子邮件，触发该函数在处理邮件头时发生内存访问越界，导致 PHP 进程崩溃，造成拒绝服务。该漏洞影响 PHP 4.2.0 和 4.2.1 版本，攻击者无需身份认证即可远程触发，危害等级中等。'
published = "2002-12-31T05:00:00Z"
remediation = "升级 PHP 至 4.2.2 或更高版本，该版本已修复 IMAP 扩展中 php_if_imap_mime_header_decode 函数处理超长邮件头时的缓冲区溢出问题。如无法升级，可在 php.ini 中禁用 IMAP 扩展（在 extension=imap 前添加分号注释掉），或通过防火墙限制对邮件服务的访问。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "PHP IMAP php_if_imap_mime_header_decode 函数拒绝服务漏洞"
updated = "2026-06-16T22:00:51Z"

