[basic]
description = "Brian Stanback 开发的 bslist.cgi 1.0 邮件列表管理脚本存在输入验证漏洞，该脚本未能正确过滤用户提交的电子邮件地址中的分号（;）等 shell 元字符，远程攻击者无需身份认证即可通过向邮件列表注册功能提交特制的邮箱地址注入任意 shell 命令，以 Web 服务器权限执行恶意操作，如窃取敏感文件或发送垃圾邮件。攻击者只需能够访问该 CGI 脚本的 Web 页面即可触发漏洞，利用门槛极低。该漏洞影响所有使用 bslist.cgi 1.0 版本的 Web 服务器，CVSS 评分 10.0，危害等级严重。"
published = "2001-02-12T05:00:00Z"
remediation = "立即停止使用 bslist.cgi 1.0，该脚本已不再维护且厂商官网已不提供下载。彻底删除服务器上所有 bslist.cgi 文件，或移除 CGI 执行权限（`chmod -x bslist.cgi`）。如必须保留邮件列表功能，改用现代替代方案（如 Mailman 3 或 Sympa），并在 Web 服务器层面配置输入过滤规则，拦截包含 `;`、`|`、`&` 等 shell 元字符的请求参数。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Brian Stanback bslist.cgi 1.0 远程命令执行漏洞"
updated = "2026-06-16T21:53:39Z"

