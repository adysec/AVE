[basic]
description = "Linux 内核蓝牙管理子系统中存在空指针解引用漏洞。在 net/bluetooth/mgmt.c 的 mgmt_remote_name() 函数中，调用 mgmt_alloc_skb() 分配 socket 缓冲区后未对返回值进行空指针检查。当 mgmt_alloc_skb() 因内存不足等原因返回 NULL 时，后续对该指针的解引用操作将触发内核空指针异常，导致系统崩溃或拒绝服务。该漏洞影响 Linux 内核 5.17.2 至 6.13.x 版本（包括 6.14 多个 RC 版本），攻击者需要具备本地低权限访问能力，无需用户交互即可通过发送蓝牙管理命令触发该漏洞。CVSSv3.1 评分为 5.5（中危），攻击向量为本地，可利用性评分 1.8，对系统可用性影响为高，对机密性和完整性无影响。修复补丁已在多个稳定版内核分支中发布，受影响用户应升级至内核 6.1.131、6.6.83、6.12.19 或 6.13.7 及更高版本。"
published = "2025-04-01T16:15:24Z"
remediation = '升级Linux内核至包含修复提交f2176a07e7b19f73e05c805cf3d130a2999154cb的版本。Debian 12 (bookworm) 用户应安装linux-image-6.1.0-26或更高版本；Ubuntu 24.04 LTS用户应安装linux-image-6.8.0-84-generic或更高版本。执行apt update && apt install --only-upgrade linux-image-$(uname -r)进行内核升级，重启系统使修复生效。临时缓解措施可通过系统d配置禁用蓝牙管理接口：echo "disable_ertm=1" >> /etc/modprobe.d/bluetooth.conf并重启蓝牙服务。'
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel 蓝牙管理模块空指针解引用漏洞"
updated = "2026-06-17T08:44:39Z"

