[basic]
description = "该漏洞源于 Sun Java web 服务器 2.0 及其早期版本的默认配置问题。攻击者可通过 board.html 文件上传恶意 Java 代码，然后直接调用 JSP 编译器servlet，在绕过常规验证的情况下直接编译执行恶意代码。由于该服务器没有对上传和编译过程进行充分的验证和权限控制，攻击者得以轻易达到远程代码执行的目的，完全控制受影响的系统，导致服务器上的数据被盗用、篡改、删除等情况；同时攻击者可以借此手段进行进一步的 lateral movement等操作，危害系统的整体安全状态。该漏洞影响范围包括所有安装了 Sun Java web 服务器 2.0 及更早版本的用户，攻击者无需任何权限即可发起攻击，技术实现门槛较低。利用方法是首先通过 board.html 文件上传恶意 Java 源文件（通常包含后门代码），然后直接访问JSP编译器servlet以触发编译和执行过程，实现远程代码执行。 Sun 公司已发布安全补丁，修复了对上传文件和调用编译功能的访问控制，建议用户尽快更新补丁或卸载旧版本服务器。 该漏洞评分方法是按照 CVSS v2 标准进行评估，其中攻击向量为网络（AV:N）得分 3 分，攻击复杂性为低（AC:L）得分 1.5 分，权限数量为无（Au:N）得分 1.5 分，同时由于该漏洞会对系统 的机密性机密性（C）方面造成部分影响 2 分，完整性（I）方面造成部分影响 2 分，可用性（A）方面造成部分影响 2 分，因此该漏洞的最终评分为 7.5 分。公共暴露率为 10 %。"
published = "2000-07-12T04:00:00Z"
remediation = "立即应用 Sun 安全公告 jwsca-2000-02 提供的补丁，将 Sun Java Web Server 升级至修复版本或更高版本（如 Sun Java System Web Server 6.1 及以上）。如无法立即升级，应禁用或删除 board.html 文件以阻断攻击入口，并在 web server 配置中限制 JSP 编译器 servlet 仅对受信任用户开放，同时在防火墙层面限制对 web 服务器端口的外部访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Sun Java System Web Server 代码执行漏洞"
