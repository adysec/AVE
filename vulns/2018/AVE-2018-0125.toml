[basic]
description = "Kibana Console 插件存在任意文件包含漏洞，攻击者通过 Kibana Console API 发送特制请求可触发 JavaScript 代码执行，进而导致以 Kibana 进程权限在主机系统上执行任意命令。该漏洞影响 Kibana 6.4.3 之前及 5.6.13 之前的版本，攻击者无需身份认证即可远程利用，CVSS 评分 9.8，危害等级严重。用户需升级至 Kibana 6.4.3 或 5.6.13 及以上版本修复此漏洞。"
published = "2018-12-20T22:29:00Z"
remediation = "立即升级 Kibana 至 6.4.3 或 5.6.13 及以上版本。如无法升级，在 kibana.yml 中设置 console.enabled: false 禁用 Console 插件并重启服务，或在反向代理层限制 /api/console/api_server 路径的访问权限。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Elastic Kibana 本地文件包含漏洞"
updated = "2026-06-17T01:45:35Z"

