[basic]
description = "Windows 电话服务（Telephony Service）存在堆缓冲区溢出漏洞（CWE-122），远程攻击者可通过向目标系统发送特制的 RPC 请求触发该漏洞，导致远程代码执行。攻击无需身份认证但需要用户交互（如点击恶意链接或打开特制文件），成功利用后可获取系统权限，完全控制受影响主机。该漏洞影响多个 Windows 版本，CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:16:05.103"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 (KB5049984)，或通过 Windows Update 自动更新。受影响版本包括 Windows 10/11 及 Windows Server 2008~2025 全系列，各版本对应修复版本号：Windows 10 1507 需升级至 10.0.10240.20890 以上、Windows 11 24H2 需升级至 10.0.26100.2894 以上、Windows Server 2025 需升级至 10.0.26100.2894 以上。如无法立即打补丁，可禁用电话服务 (TapiSrv) 作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:43:18.430"

