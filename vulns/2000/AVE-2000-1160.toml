[basic]
description = "Phorum 3.0.7 论坛软件的 upgrade.php3 升级脚本存在访问控制缺陷，未经身份认证的远程攻击者可通过某种未知方法直接调用该脚本，修改论坛数据库中的特定数据表，可能导致论坛帖子、用户信息或配置参数被篡改。该漏洞攻击向量为网络，攻击复杂度低，无需任何凭据即可利用，仅影响数据完整性而不影响保密性和可用性。受影响版本为 Phorum 3.0.7，CVSS 评分 5.0，危害等级中等。建议升级至修复版本或删除 upgrade.php3 文件以消除风险。"
published = "2000-12-31T05:00:00Z"
remediation = "建议升级到 Phorum 3.4 或更高版本（推荐迁移至 5.x 系列），官方已修复 upgrade.php3 数据库篡改漏洞。若暂时无法升级，请删除或重命名 install/upgrade.php3 文件，或在 Apache 中添加 <Files upgrade.php3> Order deny,allow; Deny from all </Files> 禁止访问，同时配置数据库用户最小权限（仅 SELECT/INSERT/UPDATE，移除 DROP/ALTER 权限）作为深度防御。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Phorum upgrade.php3 远程数据库篡改漏洞"
updated = "2026-06-16T21:53:25Z"

