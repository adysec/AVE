[basic]
description = "Windows Win32 内核子系统存在释放后使用（Use-After-Free）漏洞，该漏洞源于内核对象在释放后未正确清理指针引用，导致攻击者可利用已释放的内存空间执行任意代码。已获得低权限的本地攻击者通过运行特制的应用程序即可触发该漏洞，成功利用后可获取 SYSTEM 权限，实现完全控制目标系统。该漏洞攻击复杂度低，无需用户交互，影响 Windows 10/11 及 Windows Server 等多个版本。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:34.943"
remediation = "建议立即安装 Microsoft 2025 年 2 月安全更新 KB5051974，或通过 Windows Update 自动获取补丁。受影响系统包括 Windows 10 1809/21H2/22H2、Windows 11 22H2/23H2/24H2、Windows Server 2019/2022/2025，更新后各版本对应修复版本号分别为 10.0.17763.6893、10.0.19044.5487、10.0.19045.5487、10.0.22621.4890、10.0.22631.4890、10.0.26100.3194、10.0.20348.3207。临时缓解措施：限制低权限用户登录受影响的 Windows 系统，并启用 Microsoft Defender for Endpoint 的行为监控以检测内核利用行为。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Win32 内核子系统特权提升漏洞"
updated = "2026-06-17T08:43:12.353"

