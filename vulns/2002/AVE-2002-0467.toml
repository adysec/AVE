[basic]
description = "MIT PGP Public Key Server 0.9.2 及 0.9.4 版本中存在缓冲区溢出漏洞。攻击者可通过向 lookup 功能提交超长搜索字符串参数，触发缓冲区溢出，导致服务崩溃（拒绝服务）并可能执行任意代码。该漏洞影响 pks PGP 公钥 Web 服务器 0.9.5 之前的所有版本，CVSS 评分 7.5，危害等级高危。厂商已在 0.9.5 版本中修复此漏洞。"
published = "2002-10-04T04:00:00Z"
remediation = "立即升级到 pks 0.9.5 或更高版本；若无法升级，可应用官方补丁（http://www.rubin.ch/pgp/src/patch_buffoverflow20020525）对 kd_search.c 中 word 数组的循环拷贝增加边界检查（`i < sizeof(word)`），限制搜索字符串长度不超过缓冲区大小。临时缓解措施可在防火墙或反向代理层限制对 /pks/lookup 路径的 GET 请求参数长度不超过 256 字节。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "MIT PGP Public Key Server 搜索字符串远程缓冲区溢出漏洞"
updated = "2026-06-16T21:58:21Z"

