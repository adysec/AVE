[basic]
description = "ACME mini_httpd 1.30 之前版本存在任意文件读取漏洞。攻击者可在 HTTP 请求中构造特制的路径（如利用 `%2e%2e%2f` 等编码绕过或直接使用 `../` 路径遍历序列），绕过服务器对文件访问的限制，读取服务器上任意文件（如 `/etc/passwd`、配置文件等敏感信息）。该漏洞源于程序未对用户请求的文件路径进行充分过滤和校验，导致目录遍历攻击。攻击者只需拥有低权限即可远程利用，无需用户交互，对机密性影响严重。"
published = "2018-10-29T12:29:10Z"
remediation = "升级 ACME mini_httpd 至 1.30 或更高版本，该版本修复了 URL 路径验证不严导致的任意文件读取漏洞。如无法立即升级，可在 Web 服务器前端部署反向代理（如 Nginx），通过访问控制规则限制对敏感路径（如 /etc/passwd、/proc/ 等）的请求，或禁用 mini_httpd 对符号链接的跟随功能作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["nuclei"]
title = "ACME mini_httpd 任意文件读取漏洞"
updated = "2026-06-17T01:47:52Z"

