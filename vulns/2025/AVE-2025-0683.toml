[basic]
description = "Windows Line Printer Daemon (LPD) 服务存在释放后使用（Use-After-Free）漏洞，攻击复杂度较高但无需身份认证，远程攻击者可通过向目标系统的 LPD 服务发送特制数据包触发内存释放后重用，成功利用可在目标系统上实现远程代码执行，获取完整机密性、完整性和可用性控制。该漏洞影响多个 Windows 版本，Microsoft 已在 2025 年 1 月安全更新中修复。"
published = "2025-01-14T18:15:34Z"
remediation = '建议立即安装 Microsoft 2025 年 1 月安全更新 (KB5049981)，该更新修复了 Windows LPD 服务中的释放后使用 (Use-After-Free) 远程代码执行漏洞。受影响版本包括 Windows 10 21H2/22H2、Windows 11 22H2/23H2/24H2、Windows Server 2022/2025，各版本对应修复版本号详见 MSRC 公告。如无法立即打补丁，可在服务管理器中停止并禁用 "Print Spooler" 服务，或在防火墙中阻止对 515/TCP 端口的入站访问作为临时缓解措施。'
score = 8.1
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 行式打印机守护程序 (LPD) 服务远程代码执行漏洞"
updated = "2026-06-17T08:42:49Z"

