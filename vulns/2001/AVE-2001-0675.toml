[basic]
description = "Microsoft Word 2002 之前版本存在 RTF 模板宏自动执行漏洞。当用户打开一个特制的 RTF 文档时，如果该文档链接到一个包含嵌入宏的模板，Word 会自动执行模板中的宏而不会向用户发出任何警告提示。攻击者可利用此漏洞构造恶意 RTF 文件，诱导用户打开后自动执行嵌入在关联模板中的 VBA 宏代码，从而在用户系统上运行任意恶意程序，实现代码执行、数据窃取或系统控制。该漏洞影响 Word 97、Word 2000 等早期版本。"
published = "2001-06-27T04:00:00.000"
remediation = '安装 Microsoft 安全公告 MS01-028 对应的安全补丁：Word 97 用户需确认已安装 QFE 8909，Word 2000 用户需将 Winword.exe 升级至版本 9.00.00.5302。受影响的 Word 98（J）、Word 98 Mac 及 Word 2001 Mac 用户请分别通过 Microsoft Download Center 或 Mac 下载页面获取对应补丁。最佳修复方案是升级到不受此漏洞影响的 Microsoft Word 2002 或更高版本。作为临时缓解措施，可在 Word 宏安全设置中将宏安全性级别设为"高"或"非常高"以禁用所有宏，并避免打开来自不可信来源的 RTF 文件。同时建议在 Windows 防火墙或邮件网关中过滤 .rtf 附件，阻断恶意文件进入内网。'
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Word RTF模板宏执行漏洞"
updated = "2026-06-16T21:53:56.693"

