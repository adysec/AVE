[basic]
description = "Fortinet FortiOS SSL VPN Web 门户的 login redir 参数存在跨站脚本（XSS）漏洞。具有低权限的远程攻击者可通过向受影响参数注入恶意脚本或 HTML 代码，在受害者浏览器上下文中执行任意脚本，窃取会话凭证或实施钓鱼攻击。同时该参数还可注入外部 URL 实现 URL 重定向攻击。影响 FortiOS 6.0.0 至 6.0.4、5.6.0 至 5.6.7 及 5.4 以下版本，CVSS 评分 5.4，危害等级中危。利用该漏洞需用户交互（如点击恶意链接）。"
published = "2017-11-29T19:29:00Z"
remediation = "升级 FortiOS 至 5.6.8、6.0.5 或 6.2.0 及以上版本。如无法立即升级，可通过 CLI 禁用 SSL-VPN Web Portal 功能作为临时缓解措施：FortiOS 5.2/5.4/5.6 分支执行 `config vpn ssl settings` → `unset source-interface` → `end`；5.0 及以下分支执行 `config vpn ssl settings` → `set sslvpn-enable disable` → `end`。"
score = 5.4
severity = "MEDIUM"
sources = ["nuclei"]
title = "Fortinet FortiOS SSL VPN Web Portal 跨站脚本漏洞"
updated = "2026-06-17T01:05:44Z"

