[basic]
description = "Macromedia Shockwave Flash 插件 8.0 及更早版本在处理 SWF 文件中的标签长度字段时存在安全缺陷。远程攻击者可通过构造包含畸形标签长度标识符的特制 SWF 文件，诱使用户在浏览器中打开该文件或访问嵌入恶意 Flash 内容的网页，从而触发插件解析异常，导致拒绝服务。该漏洞影响所有使用该版本 Flash 插件的浏览器及系统，攻击条件为受害者主动访问攻击者控制的页面或打开恶意 SWF 文件，无需身份认证即可通过网络发起攻击，危害等级较高。Adobe（原 Macromedia）已在后续版本中修复了此问题。"
published = "2001-03-26T05:00:00Z"
remediation = "将 Macromedia Shockwave Flash Player 升级至 8.0.22.0 或更高版本，可修复该漏洞。请前往 Adobe 官方网站下载最新 Flash Player 安全更新并替换旧版本。如暂无法升级，建议在浏览器中禁用 Shockwave Flash 插件，或通过防火墙限制对恶意 SWF 文件的访问作为临时缓解措施。"
score = 7.6
severity = "HIGH"
sources = ["epss"]
title = "Macromedia Shockwave Flash Plugin SWF 文件拒绝服务漏洞"
updated = "2026-06-16T21:53:47Z"

