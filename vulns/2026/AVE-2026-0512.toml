[basic]
description = "PostgreSQL JDBC 驱动（pgjdbc）在 42.7.4 至 42.7.11 版本中存在通道绑定身份验证静默降级漏洞。当连接设置 `channelBinding=require` 时，攻击者通过拦截 TLS 连接并出示签名算法不支持 `tls-server-end-point` 通道绑定哈希的证书（如 Ed25519、Ed448 或后量子算法证书），可触发从 SCRAM-SHA-256-PLUS 到普通 SCRAM-SHA-256 的静默降级，从而绕过中间人攻击保护机制。该漏洞由两个问题共同导致：一是 bundled 的 scram-client 库在无法计算绑定哈希时返回空字节数组而非报错，二是 pgJDBC 的 ScramAuthenticator 仅检查服务器是否通告了 -PLUS 机制，未拒绝空绑定值也未验证协商后的机制实际使用了通道绑定。CVSS 评分 8.2，危害等级高，影响所有使用 `channelBinding=require` 的 PostgreSQL 数据库连接。升级至 42.7.12 或更高版本可修复此漏洞。"
published = "2026-07-06T19:17:08Z"
remediation = "升级 pgJDBC 至 42.7.12 或更高版本。如无法立即升级，将 JDBC 连接参数 sslmode 设为 verify-full，并配置信任库仅包含服务端 CA 证书，以在 TLS 层阻止中间人攻击。注意：依赖 channelBinding=require 替代证书验证的连接无等效缓解措施，必须升级。"
score = 8.2
severity = "HIGH"
sources = ["ghsa"]
title = "PostgreSQL JDBC Driver 通道绑定认证静默降级漏洞"
updated = "2026-07-09T13:16:25Z"

