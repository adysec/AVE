[basic]
description = "Apache HTTP Server 1.3.12 及更早版本中的 mod_rewrite 模块存在任意文件读取漏洞。当 RewriteRule 指令被扩展为包含正则表达式匹配的文件名时，远程攻击者可通过构造特制的 HTTP 请求，利用正则表达式回溯机制绕过路径限制，读取服务器上的任意文件，包括配置文件、密码文件等敏感信息。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响所有使用受影响版本 Apache 的 Web 服务器。"
published = "2000-12-19T05:00:00Z"
remediation = "立即将 Apache HTTP Server 升级至 1.3.14 或更高版本。如使用 Red Hat Linux，安装 RHSA-2000-088 或 RHSA-2000-095 提供的更新包；Caldera 用户安装 CSSA-2000-035.0 补丁；Mandrake 用户安装 MDKSA-2000-060-2 更新。临时缓解措施：审查并移除 RewriteRule 指令中引用正则表达式反向引用的目标路径，避免将用户可控输入直接拼接到替换目标中。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Apache HTTP Server mod_rewrite 任意文件读取漏洞"
updated = "2026-06-16T21:52:45Z"

