[basic]
description = "tags.<value>WebKit内核存在内存破坏漏洞，影响Apple iOS 5.1之前版本及iTunes 10.6之前版本。远程攻击者可通过构造恶意网页触发该漏洞，无需身份验证即可在目标系统上执行任意代码或导致服务拒绝（内存损坏与应用崩溃）。该漏洞利用条件为用户访问恶意网站即可触发，CVSS评分9.3，危害等级严重。Apple已在2012年3月安全更新中修复此漏洞。"
published = "2012-03-08T22:55:01Z"
remediation = "立即将Safari浏览器升级至5.1.4或更高版本，或升级至iOS 5.1及以上系统，同时将iTunes升级至10.6版本以修复WebKit内存破坏漏洞，防止远程攻击者通过恶意网站利用该漏洞执行任意代码或造成拒绝服务。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:32:08Z"

