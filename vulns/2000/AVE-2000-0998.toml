[basic]
description = "WatchGuard SOHO 防火墙产品存在IP分片处理漏洞。由于系统未对大量分片IP数据包进行有效验证和速率限制，远程攻击者可向目标防火墙发送特制的分片IP数据包（包含大量IP分片头部）来滥用该系统。该漏洞可导致防火墙意外重启或停止工作，致使网络流量中断。攻击无需任何权限，攻击者只需向防火墙发起特定特征的IP分片洪水即可触发漏洞。该漏洞可影响 WatchGuard SOHO 防火墙 1.6.x/2.1.x 等版本，影响范围内终端用户与小型企业无法正常访问互联网，导致业务中断。攻击者通过精心构造的分片IP数据包，利用防火墙的分片重组逻辑缺陷，从而破坏防火墙的正常运营功能，最终导致整个网络安全防护系统失效。(原始英文描述：WatchGuard SOHO 防火墙由于对大量分片IP数据包的处理不足，攻击者可通过发送特制分片IP数据包导致防火墙连接中断并停止转发，导致拒绝服务。该漏洞无需认证即可远程触发，影响4分 CVSS 评分10.0)"
published = "2001-02-12T05:00:00.000"
remediation = "建议升级至 WatchGuard SOHO Firewall 2.1.4 或更高版本（官方已发布修补固件）。若设备已停止支持且无法升级，建议在防火墙上游部署 IP 分片重组设备或启用上游防火墙的 IP 分片重组与丢弃异常分片功能，限制单位时间内碎片包速率（如限制每秒≤50 个碎片包），并在防火墙上游部署 DDoS 防护设备清洗碎片包洪水流量。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "WatchGuard SOHO Firewall IP分片拒绝服务漏洞"
updated = "2026-06-16T21:52:42.733"

