[basic]
description = "Mutt 邮件客户端 1.4.0 及之前版本、1.5.x 至 1.5.3 版本，以及使用 Mutt 代码的其他程序（如 Balsa 2.0.10 之前版本）的 IMAP 协议处理模块存在缓冲区溢出漏洞。远程恶意 IMAP 服务器可通过发送特制的文件夹名称触发该漏洞，导致客户端崩溃（拒绝服务），在特定条件下可能实现任意代码执行。攻击者只需搭建恶意 IMAP 服务器并诱使用户连接即可利用，无需认证，危害较大。"
published = "2003-03-24T05:00:00.000"
remediation = "立即升级 Mutt 至 1.4.1 或 1.5.4 及以上版本，Balsa 用户升级至 2.0.10 及以上版本。Debian 用户执行 apt-get update && apt-get upgrade mutt 安装 DSA-268 安全更新；Red Hat 用户安装 RHSA-2003:109 提供的 RPM 包；Gentoo 用户执行 emerge sync && emerge -u mutt 应用 GLSA 200303-19 补丁。如无法立即升级，可在 IMAP 客户端配置中禁用自动文件夹列表功能，或改用 POP3 协议作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Mutt IMAP 文件夹处理缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T22:01:37.770"

