[basic]
description = "tags.<value>Adobe ColdFusion 存在不安全反序列化漏洞（CWE-502），攻击者可利用该漏洞向目标系统发送特制的序列化恶意数据，在无需身份认证的情况下触发反序列化过程，从而在服务器上执行任意代码。该漏洞影响 Adobe ColdFusion Update 5 及更早版本以及 ColdFusion 11 Update 13 及更早版本，CVSS 评分 9.8（严重级别），攻击条件宽松（网络可达、无需认证、无需用户交互），成功利用后可导致完全入侵受影响服务器。Adobe 已发布安全更新修复此漏洞。"
published = "2018-05-19T17:29:01Z"
remediation = "立即升级 Adobe ColdFusion 至 ColdFusion 2016 Update 6 或更高版本，或升级 ColdFusion 11 至 Update 14 或更高版本以修复反序列化漏洞。同时禁用不受信任的 Java 反序列化输入，并在部署层面启用 Web 应用防火墙（WAF）规则拦截可疑序列化对象请求。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Adobe ColdFusion远程代码执行漏洞CVE-2018-4939 漏洞"
updated = "2026-06-17T01:59:19Z"

