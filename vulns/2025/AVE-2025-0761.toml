[basic]
description = "Windows Telephony Service（TAPI）存在堆缓冲区溢出漏洞（CWE-122），攻击者可通过构造恶意的 RPC 请求或诱导用户访问恶意服务器触发该漏洞，导致远程代码执行。成功利用后攻击者可获取目标系统的完整控制权限，包括安装程序、查看/更改/删除数据或创建新账户。该漏洞影响多个 Windows 版本（包括 Windows 10/11 及 Windows Server 系列），CVSS 评分 8.8，危害等级高。利用需用户交互（如连接恶意 RPC 服务器），但无需身份认证。Microsoft 已在 2025 年 1 月安全更新中修复。"
published = "2025-01-14T18:15:52.840"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新（KB5049984），Windows Server 用户请安装对应版本补丁（KB5049983/KB5050004/KB5050021/KB5049981）。可通过 Windows Update 自动获取更新，或从 Microsoft Update Catalog 手动下载安装。如无法立即打补丁，可在防火墙层面限制 TAPI 服务的网络暴露，并禁用不必要的电话服务（TapiSrv）作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:43:02.647"

