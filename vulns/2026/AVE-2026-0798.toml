[basic]
description = "@phun-ky/defaults-deep 是一个类似 lodash defaultsDeep 的 JavaScript 库，支持数组合并且无 lodash 依赖。在 2.0.5 版本之前，其 defaultsDeep() 函数在递归合并用户提供的对象时，未对 __proto__、constructor、prototype 等危险属性名进行过滤，导致攻击者可通过构造包含这些属性的恶意输入，将属性写入 Object.prototype，从而触发原型链污染。成功利用该漏洞可影响运行进程中所有对象，导致应用逻辑绕过、非预期行为甚至拒绝服务。攻击者无需身份认证，通过网络即可远程触发，CVSS 评分 7.3，危害等级高。建议升级至 2.0.5 或更高版本修复此漏洞。"
published = "2026-07-31T18:17:17Z"
remediation = "立即将 @phun-ky/defaults-deep 升级至 2.0.5 或以上版本，该版本已过滤 __proto__、constructor、prototype 等危险键名。如无法升级，须在调用 defaultsDeep() 前递归清洗用户输入对象，移除所有层级的 __proto__、constructor、prototype 属性。"
score = 7.3
severity = "HIGH"
sources = ["ghsa"]
title = "@phun-ky defaults-deep 原型污染漏洞"
updated = "2026-07-31T19:17:10Z"

