[basic]
description = "Red Hat Linux 9 系统中 vsftpd FTP 服务在编译时未集成 TCP Wrappers（tcp_wrappers）支持，且以独立服务模式运行，导致系统管理员通过 hosts.allow 和 hosts.deny 配置的访问控制规则无法生效。远程攻击者可利用此缺陷绕过预期的 IP 地址访问限制，未经授权访问目标系统的 FTP 服务，进而可能进行文件读取、上传或进一步渗透。该漏洞影响 Red Hat Linux 9 发行版，CVSS 评分 7.5，危害等级高。"
published = "2003-04-11T04:00:00Z"
remediation = "升级 vsftpd 至 1.1.3 或更高版本（该版本已启用 TCP wrappers 编译支持），或重新编译当前 vsftpd 时加入 `--with-tcp-wrappers` 选项。如无法升级，使用 iptables 防火墙规则限制 FTP 服务（默认端口 21）的源 IP 范围作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Red Hat Linux 9 vsftpd TCP Wrappers 访问控制绕过漏洞"
updated = "2026-06-16T22:01:37Z"

