[basic]
description = "Mewsoft NetAuction 3.0 中的 auction.cgi 脚本存在跨站脚本（XSS）漏洞。该漏洞源于程序未对 Term 参数进行充分的输入过滤与输出编码，攻击者可构造包含恶意脚本代码的 URL，当用户点击该链接或访问恶意构造的页面时，恶意脚本将以用户的身份在浏览器中执行。影响范围包括运行 Mewsoft NetAuction 3.0 的网络拍卖应用及其访问用户，攻击者可借此窃取用户会话凭证、冒充用户执行操作或篡改页面内容。攻击条件为攻击者需诱导已登录或正常访问的用户点击构造的恶意链接，无需身份认证，攻击难度中等；CVSS 评分 6.8，危害等级为中等偏上。修复建议包括对 Term 参数输入进行严格的 HTML 实体转义。"
published = "2002-12-31T05:00:00Z"
remediation = '该产品已于 2002 年停止维护且无官方补丁，建议立即停用并迁移至仍在维护的电商竞拍平台；若仍需临时运行，可在 auction.cgi 处理 Term 参数时对用户输入进行严格 HTML 实体编码（如将 <、>、"、& 转义为 &lt; &gt; &quot; &amp;），并校验仅接受字母数字字符，同时配置 Web 服务器（如 Apache）的字符集为 UTF-8 以降低 UTF-7 绕过攻击风险；建议在网络防火墙或反向代理层面配置针对 /auction.cgi 请求的 Web 应用层过滤（WAF）规则，拦截包含 <script> 或 javascript: 的请求。'
score = 6.8
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Mewsoft NetAuction 跨站脚本漏洞"
updated = "2026-06-16T21:59:48Z"

