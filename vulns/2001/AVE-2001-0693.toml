[basic]
description = "Moby Netsuite Web Server 1.02 存在输入验证缺陷，未经身份认证的远程攻击者可通过向目标服务器发送超长的 HTTP 请求触发该漏洞，导致服务拒绝，并可能在特定条件下执行任意命令。该漏洞影响 Netsuite Web Server 1.02 版本，攻击者无需特殊权限，只需通过网络发送特制的超长 HTTP 请求即可利用此漏洞造成服务中断或潜在的代码执行后果。CVSS 评分 2.1，危害等级较低。"
published = "2001-05-03T04:00:00Z"
remediation = "鉴于 Moby Netsuite Web Server 1.02 已停止维护且 NVD 未发布官方补丁，建议立即将 Web 服务器迁移至仍在维护的替代方案（如 Apache HTTP Server 2.4.x 或 Nginx 1.24+），并将原有站点配置完整迁移。迁移前可通过前置反向代理（如 Nginx）实施临时缓解：在 Nginx 配置中设置 client_max_body_size 和 client_header_buffer_size 以限制请求大小，并在防火墙层面仅允许可信 IP 段访问该服务端口。若短期内无法完成迁移，应在 Nginx 中配置 limit_req 模块对 HTTP 请求频率和长度进行严格限制，同时启用 WAF 规则拦截超长 URI 和异常的 HTTP 请求头。"
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "Moby Netsuite Web Server 拒绝服务漏洞"
updated = "2026-06-16T21:54:00Z"

