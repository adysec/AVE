[basic]
description = "Common Unix Printing System (CUPS) 1.1.14 至 1.1.17 版本存在文件竞争条件漏洞。具有 lp 权限的本地攻击者可通过在打印作业处理过程中与其他进程竞争文件操作，利用时间差创建或覆盖系统任意文件。该漏洞影响 macOS X 及部分 Unix/Linux 系统上的 CUPS 打印服务，攻击者可借此获取对关键系统文件的写权限，进而导致权限提升或系统被控。"
published = "2002-12-26T05:00:00Z"
remediation = "升级 CUPS 至 1.1.18 或更高版本以修复文件竞争条件漏洞。Debian 系统执行 apt-get upgrade cupsys 应用 DSA-232 补丁，Red Hat 系统应用 RHSA-2002:295 更新包，Mandrake 系统应用 MDKSA-2003:001 补丁。如无法立即升级，应临时撤销不必要的 lp 用户账户权限，仅允许可信用户访问打印服务，并将 /var/spool/cups 等目录权限收紧为 cups 用户独占可写，阻止本地用户创建或覆盖任意文件。"
score = 6.2
severity = "MEDIUM"
sources = ["redhat"]
title = "Apple CUPS 任意文件写入漏洞"
updated = "2026-06-16T21:59:11Z"

