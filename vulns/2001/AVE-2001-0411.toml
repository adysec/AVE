[basic]
description = "Berkeley Parallel Make（pmake）2.1.33及更早版本中存在格式化字符串漏洞。本地攻击者通过在shell定义的check参数中注入格式化字符串说明符（如%n、%s等），利用该漏洞可覆盖任意内存地址，从而将权限提升至root。该漏洞影响SuSE Linux 6.4/7.0/7.1/7.2等发行版本，攻击者无需身份认证即可在本地触发利用，CVSS评分7.2，危害等级高。"
published = "2001-11-21T05:00:00Z"
remediation = "升级 Berkeley pmake 至高于 2.1.33 的版本以修复格式字符串漏洞；如无法升级，可临时移除 pmake 的 setuid 权限位（chmod u-s /usr/bin/pmake）以阻断本地提权路径。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "SuSE Linux Berkeley Parallel Make 格式字符串漏洞"
updated = "2026-06-16T21:55:13Z"

