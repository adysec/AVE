[basic]
description = "Linux kernel IPv6 路由子系统存在内存泄漏漏洞。由于 fib6_nh_init() 函数在分配 percpu 内存失败后未正确释放 nhc_pcpu_rth_output 已分配的内存，导致 fib_check_nh_v6_gw() 函数的错误处理路径中发生持续内存泄漏。该漏洞影响启用 IPv6 功能的 Linux 内核版本，攻击向量为本地，具有低复杂度、低权限要求且无需用户交互。本地低权限攻击者可通过构造特定的 IPv6 路由配置或网络命名空间场景，反复触发错误路径以耗尽系统内存，最终导致系统稳定性下降或拒绝服务。CVSS 评分 5.5，危害等级中危。"
published = "2025-04-03T08:15:16Z"
remediation = "建议立即升级 Linux 内核至以下修复版本之一：5.4.292+、5.10.236+、5.15.180+、6.1.132+、6.6.85+、6.12.21+、6.13.9+ 或 6.14+。可通过发行版包管理器更新（如 apt upgrade linux-image-generic、yum update kernel、dnf upgrade kernel）。若无法立即升级，可临时禁用 IPv6 路由网关功能：执行 sysctl -w net.ipv6.conf.all.forwarding=0 并重启网络服务，或在内核启动参数添加 ipv6.disable=1 完全禁用 IPv6（会影响 IPv6 业务）。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 IPv6 路由子模块内存泄漏漏洞"
updated = "2026-07-14T13:17:29Z"

