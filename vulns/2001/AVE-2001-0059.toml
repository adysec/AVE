[basic]
description = "Microsoft IIS 5.0 的 WebDAV 组件在处理畸形的 HTTP 请求时存在拒绝服务漏洞。远程攻击者无需身份认证即可通过网络向目标 IIS 服务器发送一系列特制的 WebDAV 请求，导致服务器 CPU 占用率飙升或进程崩溃，无法正常响应合法用户请求。该漏洞影响 Windows 2000 平台上运行的 IIS 5.0 版本，攻击条件简单，仅需网络可达即可触发。Microsoft 已发布安全公告 MS01-016 修复此漏洞。"
published = "2001-06-02T04:00:00Z"
remediation = "建议立即安装 Microsoft 于 2001 年 3 月发布的安全补丁 MS01-016（下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=400E3C59-62D6-4BCC-AB39-D7AE8DDF902E），该补丁修复了 WebDAV 处理畸形请求时的 CPU 耗尽漏洞。如无法安装补丁，可将系统升级至 Windows 2000 Service Pack 2（该修复已包含在 SP2 中）。临时缓解措施：按照 KB Q241520 禁用 WebDAV 服务（删除注册表中 WebDAV 的 ISAPI 筛选器映射），但会损失 Web Folders 和 Office 2000 发布等远程协作功能。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft IIS 5.0 WebDAV 拒绝服务漏洞"
updated = "2026-06-16T21:53:46Z"

