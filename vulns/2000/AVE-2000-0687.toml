[basic]
description = "Kootenay Web KW Whois 1.0 CGI 程序存在命令注入漏洞，远程攻击者无需身份认证即可通过向 whois 参数中注入 shell 元字符（如分号、管道符等）执行任意系统命令。由于程序未对用户输入进行过滤和转义，直接将参数传递给系统 shell 执行，导致攻击者可完全控制目标服务器，获取敏感信息、植入后门或发起进一步攻击。该漏洞 CVSS 评分 10.0，危害等级严重，影响所有使用 KW Whois 1.0 的 Web 服务器。"
published = "2000-12-19T05:00:00.000"
remediation = "Kootenay Web KW Whois 1.0 CGI 程序已停止维护，建议立即删除或禁用 kw_whois.cgi 脚本。如无法移除，需在 Web 服务器（Apache/Nginx）层面对 whois 参数做严格输入过滤，禁止传入 `;` `|` `` ` `` `$` `(` `)` `&` 等 shell 元字符，或改用参数化方式调用 whois 命令。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Kootenay Web Inc KW Whois 1.0 CGI 远程命令执行漏洞"
updated = "2026-06-16T21:52:49.050"

