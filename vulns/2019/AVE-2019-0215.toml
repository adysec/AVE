[basic]
description = "标签之间。<value>ESAFENET CDG 电子文档安全管理系统 V3 及 V5 版本存在任意文件下载漏洞。该系统在 /CDGServer3/ClientAjax 请求中错误处理 InstallationPack 参数，攻击者可通过 download.jsp 中的 fileName 参数构造恶意请求，在无需身份认证且无需用户交互的情况下，远程下载服务器上的任意敏感文件。该漏洞影响亿赛通 CDG 系列产品，攻击者可利用其读取系统配置文件、数据库连接文件等机密信息，造成敏感数据泄露，CVSS 评分 7.5，危害等级高。"
published = "2019-03-08T07:29:00Z"
remediation = "在 CDG 系统前置 WAF 或流量检测设备，拦截对 /CDGServer3/ClientAjax 端点 POST 请求中 InstallationPack 参数包含 ../ 或 / 路径穿越字符的请求；同时通过 iptables 或防火墙限制仅允许可信管理网段访问 CDG 管理端口，减少攻击面。联系 ESAFENET 官方技术支持获取修复补丁并升级至最新版本。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "亿赛通 CDG 电子文档安全管理系统任意文件下载漏洞"
updated = "2026-06-17T02:44:04Z"

