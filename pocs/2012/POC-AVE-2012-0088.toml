[info]
author = "AVE"
description = "Adobe Flash Player MP4 cprt 数据块越界写入远程代码执行漏洞验证，通过 HTTP 服务投递恶意 SWF 文件触发内存破坏"
id = "POC-AVE-2012-0088"
name = "CVE-2012-0754 PoC"
severity = "high"
tags = ["cve-2012-0754"]
vuln_id = [
    "CVE-2012-0754",
    "AVE-2012-0088",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/CVE-2012-0754.swf"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["200"]
