[basic]
description = "Apple Safari 浏览器在 6.0 之前的版本中存在 HTTP 头注入漏洞，该漏洞源于 WebKit 引擎对 WebSockets URI 处理不当，未对换行符（CRLF）进行有效过滤。未经身份认证的远程攻击者可构造恶意网页，通过特制的 WebSockets URI 在 HTTP 请求中注入任意头信息，进而实施 HTTP 请求拆分攻击，可用于绕过安全控制、劫持用户会话或缓存投毒。受影响版本包括 Safari 5.x 及更早版本，攻击者仅需诱使用户访问恶意网站即可触发利用。"
published = "2012-07-25T19:55:06.243"
remediation = "升级 Safari 浏览器至 6.0 或更高版本，或通过 Mac App Store 安装最新安全更新。iOS 用户需升级至 iOS 6.0 或更高版本。如暂无法升级，应避免访问不可信网站，禁用 WebSockets 功能作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari HTTP头注入漏洞"
updated = "2026-06-16T23:43:45.330"

