[basic]
description = "Optergy Proton/Enterprise 设备存在未授权的后门控制台，未经身份认证的远程攻击者可通过该后门控制台向目标设备发送特制请求，执行任意系统命令并获取 root 权限。该漏洞影响 Optergy Proton 和 Enterprise 系列产品，攻击者无需任何凭据即可在远程位置执行代码，完全控制设备。CVSS v3.1 评分为 9.8，危害等级严重。"
published = "2019-07-01T20:15:12Z"
remediation = "联系 Optergy 技术支持（邮箱：info@optergy.com）获取修复补丁并升级到 2.3.1 或更高版本，该版本已移除存在后门漏洞的 ConsoleResult.html 调试接口。临时缓解措施：在防火墙或反向代理层阻断对 /tools/ajax/ConsoleResult.html 路径的外部访问，仅允许来自受信任管理网段的 HTTPS 访问，同时禁用 WAN 面的远程管理功能，限制 Optergy BMS Web 界面的访问源 IP。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Optergy Proton/Enterprise 远程代码执行漏洞"
updated = "2026-06-17T02:40:22Z"

