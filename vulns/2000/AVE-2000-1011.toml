remediation = "立即升级 Horde IMP 至 2.2.1 或更高版本，该版本修复了 attachment_name 隐藏表单变量未经验证即用于读取和发送任意文件的安全缺陷。升级前可临时缓解：在 Web 服务器层面限制 IMP 附件处理路径的文件系统读取权限，仅允许访问必要的邮件附件目录，并禁用不必要的文件上传功能。"
