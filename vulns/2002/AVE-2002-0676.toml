[basic]
description = "Microsoft IIS 4.0 和 5.0 所附带的 SMTP 服务存在 SMTP 地址封装绕过漏洞，远程攻击者可通过构造封装在邮件头中的嵌套 SMTP 地址，绕过系统的反邮件中继规则，利用该服务发送垃圾邮件或伪造来源的邮件。该漏洞影响运行 IIS 4.0/5.0 的 Windows NT 4.0/Windows 2000 服务器，攻击者无需身份认证即可在网络可达的情况下发起利用，导致邮件欺骗与垃圾邮件中继，危害邮件系统的可信度与信息安全。Microsoft 已在 MS99-027 安全公告中发布补丁修复此问题。"
published = "2002-12-31T05:00:00Z"
remediation = "建议立即安装微软安全公告 MS99-027 提供的补丁程序，该补丁修复了 IIS 4.0/5.0 SMTP 服务的封装 SMTP 地址漏洞。若无法立即打补丁，可在 IIS 管理器中配置 SMTP 虚拟服务器的“访问”选项卡，启用“仅允许下列计算机中继”并明确列出受信 IP，或彻底禁用 SMTP 服务的中继功能作为临时缓解措施。建议升级至 IIS 6.0 或更高版本彻底解决该问题。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft IIS SMTP 服务封装地址绕过反垃圾邮件规则漏洞"
updated = "2026-06-16T21:59:59Z"

