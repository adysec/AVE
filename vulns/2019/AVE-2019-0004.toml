[basic]
description = "SAP Commerce Cloud（原 Hybris）的 virtualjdbc 扩展组件存在不安全的反序列化漏洞（CWE-502）。远程未经身份认证的攻击者可通过发送特制的序列化数据触发该漏洞，从而在目标机器上以 Hybris 用户权限执行任意代码，导致远程代码执行（RCE）。该漏洞影响版本包括 6.4, 6.5, 6.6, 6.7 以及 1808, 1811, 1905 等，CVSS 评分高达 9.8，危害等级严重。"
published = "2019-08-14T14:15:16Z"
remediation = "建议立即将 SAP Commerce Cloud 升级至官方发布的修复版本（如 1905 及以上版本），或安装对应的安全补丁以修复 virtualjdbc 扩展的反序列化漏洞。如无法立即升级，建议在防火墙或网络层限制对 virtualjdbc 相关接口的外部访问，以降低被远程攻击的风险。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "SAP Commerce Cloud virtualjdbc 远程代码执行漏洞"
updated = "2026-06-17T02:08:12Z"

