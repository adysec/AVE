[basic]
description = "Microsoft 消息队列（MSMQ）服务存在未受控资源消耗漏洞。未经身份认证的远程攻击者可通过向目标系统的 MSMQ 服务发送特制网络请求，触发 MSMQ 服务消耗大量系统资源，导致目标系统拒绝服务。该漏洞影响多个 Windows 版本，CVSS 评分 7.5，危害等级高危。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:50Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 (KB5050061)，该更新修复了 MSMQ 拒绝服务漏洞。可通过 Windows Update 自动更新或从 Microsoft 更新目录手动下载安装。如无法立即打补丁，建议在不需要 MSMQ 服务的系统上禁用 Message Queuing 服务作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft 消息队列 (MSMQ) 拒绝服务漏洞"
updated = "2026-06-17T08:43:00Z"

