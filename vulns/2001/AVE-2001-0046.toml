[basic]
description = "Debian 2.2 中的 splitvt 工具（版本 1.6.5 之前）存在格式字符串漏洞，源于对 -rcfile 命令行参数缺乏格式字符串验证。本地攻击者可通过传入包含格式化指示符（如 %n、%s）的恶意参数，控制程序内存写入，进而执行任意代码并提升至 root 权限。该漏洞影响使用 splitvt 的 Debian 2.2 系统，CVSS 评分 7.2（AV:L/AC:L/Au:N/C:C/I:C/A:C），攻击需本地访问权限，利用方式为构造特制的 -rcfile 参数触发格式化字符串解析错误。"
published = "2001-03-12T05:00:00.000"
remediation = "升级 splitvt 到 1.6.5 或更高版本（Debian 可执行 apt-get update && apt-get install splitvt）。若暂时无法升级，可移除 splitvt 的 setuid 位（chmod u-s /usr/bin/splitvt）作为临时缓解措施，防止本地用户利用格式字符串漏洞提权。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Debian splitvt 格式字符串漏洞"
updated = "2026-06-16T21:53:40.580"

