[basic]
description = "Apple Safari 浏览器使用的 WebKit 引擎存在未明内存破坏漏洞（CWE-119），远程攻击者可通过诱导用户访问特制网站触发内存损坏，导致任意代码执行或应用程序崩溃。该漏洞影响 Apple iOS 5.1 之前版本、iTunes 10.6 之前版本及 Safari 5.1.4 之前版本，CVSS 评分 9.3，危害等级严重。攻击者无需身份认证，仅需用户访问恶意构造的网页即可触发，属于高危远程代码执行漏洞。Apple 已在 2012 年 3 月安全更新中修复此漏洞。"
published = "2012-03-08T22:55:03Z"
remediation = "将 Apple Safari 升级至 5.1.4 或更高版本，将 iOS 升级至 5.1 或更高版本，将 iTunes 升级至 10.6 或更高版本。无法立即升级时，可禁用 JavaScript 解析或使用内容安全策略（CSP）限制不可信网页脚本执行作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:57Z"

