[basic]
description = "Twig webmail 系统在未配置 vhosts 变量时未能正确设置该变量，攻击者可通过向 index.php3 程序传递伪造的 vhosts 参数，注入并执行任意 PHP（PHP3）代码。该漏洞无需身份认证即可远程利用，影响使用 Twig webmail 系统的网站服务器，攻击者可借此在目标服务器上执行恶意代码，获取服务器控制权。"
published = "2001-01-09T05:00:00Z"
remediation = "由于该软件已极其陈旧且停止维护，建议立即停止使用 Twig webmail 系统并迁移至现代安全的邮件客户端。如必须临时维持运行，需在 Web 服务器配置中强制定义 vhosts 变量，或在 PHP 层面通过过滤 index.php3 的输入参数以拦截包含 PHP 标签的恶意代码。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Twig webmail system 远程代码执行漏洞"
updated = "2026-06-16T21:53:17Z"

