[basic]
description = 'Webmin 1.920 及之前版本的 password_change.cgi 脚本中存在远程命令执行漏洞。攻击者可在未经身份认证的情况下，通过向 password_change.cgi 发送特制的 HTTP 请求，在 "old" 参数中注入系统命令，从而在目标服务器上以 root 权限执行任意命令。该漏洞影响所有 Webmin 1.920 及更早版本，攻击复杂度低，无需用户交互，危害等级严重，可导致服务器完全失陷。'
published = "2019-08-16T03:15:11Z"
remediation = "立即升级 Webmin 至 1.930 或更高版本（官方已在该版本中移除了 password_change.cgi 的 old 参数处理逻辑）。如无法升级，可临时删除或重命名 /webmin/password_change.cgi 文件，或在 Web 服务器（Nginx/Apache）层面配置访问控制规则，限制对 /password_change.cgi 路径的访问来源 IP。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Webmin 远程命令执行漏洞"
updated = "2026-06-17T02:19:42Z"

