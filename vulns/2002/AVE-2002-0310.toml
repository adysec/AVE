[basic]
description = "CVE-2002-0483是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2002-08-12T04:00:00Z"
remediation = "立即将 PHP-Nuke 升级至 5.5 或更高版本，该版本已修复 index.php 中的路径泄露问题。同时，在 php.ini 或 .htaccess 中设置 display_errors = Off 并将 log_errors 设为 On，将错误信息写入服务器日志而非直接显示给客户端，从而阻止攻击者通过错误消息获取 Web 根目录物理路径。如暂时无法升级，可在 Apache 或 Nginx 中配置自定义 404 错误页面，屏蔽 PHP 脚本的输出。"
