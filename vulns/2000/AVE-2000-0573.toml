[basic]
description = "Easy Software Products 的 CUPS（Common Unix Printing System）在 1.1.4-3 及更早版本中，对 IPP（Internet Printing Protocol）请求处理不当。远程攻击者无需身份认证，即可向目标打印服务发送畸形 IPP 请求，触发拒绝服务，导致打印服务不可用。该漏洞影响网络可达的 CUPS 服务，攻击条件为可访问目标 IPP 端口，利用方式为构造并发送异常 IPP 报文，CVSS 约 5.0，危害等级中等。"
published = "2000-06-21T04:00:00Z"
remediation = "立即将 CUPS 升级至 1.0.5 或更高版本，或对 1.0.4 及更早版本下载并应用官方 cups-DoS.patch 后重新编译安装 cupsd；若暂无法升级，在防火墙将 631/tcp（IPP）仅放行内网可信主机并禁止公网访问，同时关闭不必要的远程打印共享。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Easy Software Products CUPS 畸形 IPP 请求拒绝服务漏洞"
updated = "2026-06-16T21:51:53Z"

