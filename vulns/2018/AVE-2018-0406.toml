[basic]
description = "DNN（DotNetNuke）9.2至9.2.1版本使用弱加密算法保护输入参数，攻击者无需身份认证即可通过网络远程利用该漏洞。由于加密强度不足，攻击者可逆向解密受保护的参数，导致敏感信息泄露。该漏洞攻击复杂度低，无需用户交互，CVSS评分7.5，危害等级高。建议升级至修复版本或应用官方安全补丁。"
published = "2019-07-03T17:15:10Z"
remediation = "升级 DNN (DotNetNuke) 至 9.2.2 及以上版本，该版本已修复弱加密算法问题。如无法立即升级，可在 web.config 中启用 customErrors 并配置 machineKey 使用强加密算法（如 AES-256），同时限制对 DNN 后台管理页面的网络访问。建议在反向代理或 WAF 层面添加对异常加密参数的检测规则作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "DNN (DotNetNuke) 弱加密算法漏洞"
updated = "2026-06-17T01:43:08Z"

