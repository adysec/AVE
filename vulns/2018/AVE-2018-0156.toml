[basic]
description = "DomainMOD 4.11.01及之前版本的后台管理页面 admin/dw/add-server.php 中存在存储型跨站脚本漏洞。具有管理员权限的认证攻击者可在添加服务器时，通过 DisplayName、HostName 或 UserName 字段注入未经过滤的恶意 JavaScript 代码，该代码被存储后将在服务器列表页面执行，导致受害管理员浏览器中执行任意脚本，可能造成会话劫持、敏感信息窃取或页面篡改。攻击者需先获取管理后台登录凭据方可利用，CVSS 评分 4.8，危害等级中危。"
published = "2018-12-06T03:29:00Z"
remediation = "立即升级到 DomainMOD v4.12.0 或更高版本（当前最新为 v4.23.0），该版本已修复 admin/dw/add-server.php 中 DisplayName、HostName、UserName 字段的存储型 XSS 问题。如无法立即升级，可在 Web 服务器（Apache/Nginx）层面添加 WAF 规则，对上述三个输入字段过滤 HTML 标签和 JavaScript 关键字，同时在 PHP 配置中启用 htmlspecialchars 对所有用户输入输出进行转义处理。"
score = 4.8
severity = "MEDIUM"
sources = ["nuclei"]
title = "DomainMod DomainMOD 跨站脚本漏洞"
updated = "2026-06-17T01:50:04Z"

