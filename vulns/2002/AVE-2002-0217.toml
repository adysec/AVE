[basic]
description = "Apache mod_ssl 模块 2.8.9 及更早版本中存在 off-by-one 缓冲区溢出漏洞，位于 ssl_compat_directive 函数中，该函数由 rewrite_command 钩子调用。本地攻击者可通过向 .htaccess 文件写入超长条目触发该漏洞，导致缓冲区溢出，从而以 Apache 服务器用户身份执行任意代码。该漏洞影响 Apache mod_ssl 2.8.x 系列版本，CVSS 评分 7.8，危害等级高。建议升级至 mod_ssl 2.8.10 或更高版本以修复此漏洞。"
published = "2002-07-11T04:00:00Z"
remediation = "将 mod_ssl 升级至 2.8.10 或更高版本（Apache httpd 2.0 用户应升级至 2.0.37 及以上版本）。各发行版用户请安装对应安全更新：Red Hat 安装 RHSA-2002:134/135/136 更新，Debian 安装 DSA-135 更新，Mandrake 安装 MDKSA-2002:048 更新。如无法立即升级，可在 httpd.conf 中禁用 AllowOverride 指令（设置为 None），阻止普通用户在 .htaccess 中触发该漏洞，并确保 .htaccess 文件仅由可信管理员管理。"
score = 7.8
severity = "HIGH"
sources = ["exploitdb"]
title = "Apache mod_ssl Off-by-One 缓冲区溢出漏洞"
updated = "2026-06-16T21:57:52Z"

