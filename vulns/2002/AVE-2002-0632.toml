[basic]
description = "SolarWinds TFTP Server Standard Edition 5.0.55 及更早版本存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过向目标系统发送超大 UDP 数据报触发该漏洞，导致服务崩溃并可能实现远程代码执行。该漏洞影响运行 SolarWinds TFTP Server 的 Windows 系统，CVSS 评分为 5.0，危害等级为中等。攻击者无需身份认证即可利用此漏洞发送特制 UDP 数据包进行攻击。"
published = "2003-03-31T05:00:00.000"
remediation = "建议立即升级至 SolarWinds TFTP Server 6.0 或更高版本，该版本已修复大型 UDP 数据包导致的拒绝服务漏洞。若业务允许，建议彻底禁用 TFTP 服务或在防火墙层面封禁 UDP 69 端口访问。临时缓解措施：配置网络设备限制 UDP 69 端口仅允许受信任管理 IP 访问，并监控异常大包流量。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "SolarWinds TFTP Server 标准版 大UDP数据包拒绝服务漏洞"
updated = "2026-06-16T21:59:31.340"

