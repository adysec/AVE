[basic]
description = "基于Chromium的Microsoft Edge浏览器存在欺骗漏洞（CWE-79），攻击者可通过构造恶意网页内容，诱骗用户执行特定操作（如点击或输入），从而实施界面伪造或地址栏欺骗等攻击。该漏洞影响运行Microsoft Edge且版本低于148.0.3967.70的Windows系统，攻击复杂度低且无需预先认证，但需要用户交互才能触发。成功利用可导致用户被误导至仿冒网站或执行非预期操作。Microsoft已于2026年5月发布安全更新修复此漏洞。"
published = "2026-05-18T18:17:38Z"
remediation = '建议将 Microsoft Edge（Chromium 内核）升级到 148.0.3967.70 或更高版本以修复该欺骗漏洞。用户可前往"设置 → 关于 Microsoft Edge"自动检查并安装更新，企业管理员可通过 Microsoft Update Catalog 或组策略集中推送补丁。如暂时无法升级，建议在 Edge 中启用增强安全模式或禁用不必要的 JavaScript 以降低被利用风险。'
score = 5.4
severity = "MEDIUM"
sources = ["zdi"]
title = "Microsoft Edge (Chromium-based) 欺骗漏洞"
updated = "2026-06-17T10:52:08Z"

