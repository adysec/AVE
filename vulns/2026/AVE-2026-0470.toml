[basic]
description = "DTMSoft 产品在解析项目文件时存在反序列化不可信数据漏洞（CWE-502）。攻击者可通过构造特制的恶意项目文件，诱使用户在受影响产品中打开该文件，触发反序列化过程，从而在目标系统上执行任意代码。该漏洞影响 DTMSoft 相关产品，攻击复杂度低且无需任何权限，但需要用户交互（如打开恶意文件）。成功利用可导致机密性、完整性和可用性完全丧失，CVSS 评分 8.4，危害等级高。"
published = "2026-06-30T09:16:24Z"
remediation = "建议立即联系台达技术支持获取 DTMSoft 修复版本，或参考 Delta-PCSA-2026-00010 安全公告安装补丁。如无法立即升级，采取以下临时缓解措施：不要打开来源不明的项目文件或邮件附件，避免以管理员权限运行 DTMSoft，使用标准用户权限运行以限制攻击影响范围。"
score = 8.4
severity = "HIGH"
sources = ["zdi"]
title = "DTMSoft 项目文件反序列化远程代码执行漏洞"
updated = "2026-06-30T14:18:42Z"

