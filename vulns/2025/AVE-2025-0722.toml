[basic]
description = "Windows 数字媒体组件存在越界读取漏洞，该漏洞源于对内存边界检查不足。已获得低权限的本地攻击者需物理访问目标系统，通过特制的应用程序触发越界读取操作，从而获取系统权限提升，实现完全控制目标设备的机密性、完整性和可用性。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:45Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新 (KB5050061)，或通过 Windows Update 自动更新获取。受影响版本包括 Windows 10/11 及 Windows Server 2008~2025，各版本对应修复版本号分别为：Windows 10 1507 升级至 10.0.10240.20890、Windows 10 1607 升级至 10.0.14393.7699、Windows 10 1809 升级至 10.0.17763.6775、Windows 11 24H2 升级至 10.0.26100.2894、Windows Server 2025 升级至 10.0.26100.2894。如无法立即打补丁，可限制物理访问权限作为临时缓解措施。"
score = 6.6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 数字媒体特权提升漏洞"
updated = "2026-06-17T08:42:55Z"

