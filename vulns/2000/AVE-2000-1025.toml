[basic]
description = "TIS Firewall Toolkit（FWTK）中的 x-gw 组件存在格式化字符串漏洞，本地攻击者可通过向 display name 参数传入特制的格式化字符串触发该漏洞，导致任意代码执行。攻击者利用此漏洞可获取目标系统的完全控制权限，包括读取、修改敏感数据或安装恶意程序。该漏洞影响 TIS FWTK 的受影响版本，攻击前提是攻击者拥有本地访问权限。目前厂商已发布相关安全公告，建议用户升级至修复版本。"
published = "2000-12-19T05:00:00.000"
remediation = 'TIS Firewall Toolkit (FWTK) 已停止维护，建议立即迁移至现代防火墙解决方案（如 iptables/nftables 或商业防火墙）。如必须继续使用 FWTK，应修改 x-gw 源码中处理 display name 的部分，将 `printf(user_input)` 替换为 `printf("%s", user_input)` 以消除格式化字符串漏洞，并重新编译部署。同时限制 x-gw 的本地访问权限，仅允许受信管理员用户执行。'
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "TIS Firewall Toolkit x-gw 格式化字符串漏洞"
updated = "2026-06-16T21:52:50.270"

