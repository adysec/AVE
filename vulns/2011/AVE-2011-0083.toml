[basic]
description = "Adobe Flash Player 10.3.183.5之前版本（Windows/Mac OS X/Linux/Solaris）及10.3.186.3之前版本（Android）存在内存破坏漏洞。攻击者可通过构造特制的MP4文件（利用SequenceParameterSetNALUnit）诱导用户打开，触发内存破坏，导致远程代码执行或拒绝服务。该漏洞影响范围广泛，CVSS评分10.0，危害严重。Adobe已在2011年8月安全公告中修复此漏洞，建议用户升级至最新版本。"
published = "2011-08-10T22:55:00Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.5 及以上版本（Windows/Mac/Linux/Solaris）或 10.3.186.3 及以上版本（Android）；Adobe AIR 升级至 2.7.1 及以上版本。由于 Flash Player 已停止维护，建议彻底卸载 Flash Player 并迁移至 HTML5 标准。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:30:46Z"

