Let me just work with the data I have from the GitHub advisory and craft a proper Chinese description. The provided data is very detailed:

1. Vulnerability: XSS in rails-html-sanitizer
2. Principle: When sanitizer is configured to allow SVG reference elements like `<use>` or `<feImage>`, the `Rails::HTML::PermitScrubber` restricts SVG reference elements in `SVG_ALLOW_LOCAL_HREF` collection to local, same-document references, but only for `xlink:href` attribute. Browsers also accept plain `href` attribute per SVG 2 spec, which was not restricted. So elements could reference arbitrary external documents. SVG `<use>` can load and render external SVG content by reference, and if the referenced document is same-origin and contains scripts, it could execute in the context of the sanitized document. `<feImage>` can load external images for tracking.
3. Affected: >= 1.0.3, < 1.7.1
4. Not affected: < 1.0.3 or default configuration
5. Fixed: 1.7.1
6. Attack condition: Applications are impacted only when the allowed tags are overridden to include one of these SVG reference elements. Default allowed tags do not include these SVG elements.

