[basic]
description = "MIT Kerberos 5（krb5）1.11.3 之前版本中 kadmind 服务的 kpasswd 组件（schpw.c）存在输入验证漏洞。远程攻击者可向目标系统发送特制的伪造 UDP 数据包，由于服务在发送响应前未正确验证数据包合法性，触发服务端之间的通信循环，导致目标系统 CPU 和带宽资源被大量消耗，造成拒绝服务。该漏洞影响所有运行 MIT Kerberos 5 1.11.3 之前版本的系统，攻击者无需身份认证即可远程触发，CVSS 评分 5.0，危害等级中等。"
published = "2013-05-29T14:29:06Z"
remediation = "升级 MIT Kerberos 5 (krb5) 至 1.11.3 或更高版本，该版本已修复 kpasswd 服务中 UDP 数据包校验缺失导致的 ping-pong 拒绝服务漏洞。如无法立即升级，可在防火墙或网络层面限制对 kpasswd 服务 UDP 端口（默认 464）的访问，仅允许可信来源连接，以降低被利用风险。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "MIT Kerberos 5 kpasswd 拒绝服务漏洞"
updated = "2026-06-16T22:01:18Z"

