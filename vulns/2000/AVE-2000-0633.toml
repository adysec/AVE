[basic]
description = "YaBB 公告板系统 9.1.2000 版本存在路径遍历漏洞，远程攻击者无需身份认证即可通过在 URL 中构造 `../` 序列进行目录穿越，读取服务器上的任意文件，包括配置文件、密码文件等敏感信息。该漏洞利用难度低，无需特殊权限，仅需目标系统运行受影响版本且 Web 服务可访问即可触发。CVSS 评分 5.0，危害等级中等。"
published = "2000-11-14T05:00:00.000"
remediation = "升级 YaBB 论坛程序至 9.1.2000 之后的安全版本，该版本已修复路径遍历漏洞。如无法升级，在 YaBB.pl 脚本中对 `num` 参数进行输入验证，过滤 `../` 及 `%00` 空字节字符，禁止包含父目录路径的请求。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "YaBB Bulletin Board 9.1.2000 任意文件读取漏洞"
updated = "2026-06-16T21:52:36.267"

