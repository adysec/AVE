[basic]
description = "Linux 内核的高分辨率定时器（hrtimers）子系统存在逻辑缺陷。当 CPU 离线时，系统会在 CPUHP_AP_HRTIMERS_DYING 阶段将定时器从即将离线的 CPU 迁移至在线 CPU；然而在该阶段之后，离线 CPU 仍可能执行唤醒操作并重新注册带宽定时器，导致定时器被错误地分配至已离线的目标 CPU，最终被系统忽略而无法触发。该漏洞影响运行受波及 Linux 内核版本的系统，本地低权限攻击者可利用 CPU 热插拔过程中的竞争条件，使高分辨率定时器失效，进而影响 RCU 子系统和 CPU 停机机器线程的正常调度，可能导致系统不稳定或拒绝服务。CVSSv3 评分为 5.5，危害等级为中危。"
published = "2025-02-27T20:16:04Z"
remediation = "升级 Linux 内核至修复版本：Debian 12 用户升级至 6.1.147-1 或更高版本；Debian 11 用户升级至 6.1.153-1~deb11u1；Ubuntu 24.04 LTS 用户升级至 6.8.0-64.67 或更高版本；Ubuntu 22.04 LTS 用户升级至 6.8.0-1032.34。如无法立即升级，可通过禁用 CPU 热插拔功能作为临时缓解措施。建议定期从各发行版安全公告获取最新内核补丁并及时安装。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel hrtimers 拒绝服务漏洞"
updated = "2026-06-17T08:44:21Z"

