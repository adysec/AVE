[exploit]
exp_urls = ["https://github.com/BrokenPorkMachine/B34ST/blob/main/exploits/webkit/CVE-2021-30661.js"]
poc_urls = ["https://github.com/BrokenPorkMachine/B34ST/blob/main/exploits/webkit/CVE-2021-30661.js"]

[info]
author = "ave"
description = "检测目标服务器是否托管包含 WebRTC 类型混淆利用代码的页面，该页面可在 Safari 14.1 之前版本触发 WebKit JavaScriptCore 的 use-after-free 漏洞，实现任意代码执行。通过 HTTP 请求获取页面内容，检查是否存在 RTCPeerConnection 及 JSC 利用原语（addrof/fakeobj）等特征。"
id = "POC-AVE-2021-1606"
name = "CVE-2021-30661 Apple Safari WebRTC Use-After-Free PoC"
severity = "high"
tags = ["ave-2021-1606"]
vuln_id = [
    "CVE-2021-30661",
    "AVE-2021-1606",
]

[meta]
collected_at = "2026-08-08T00:00:00Z"
status = "completed"

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "RTCPeerConnection",
    "addrof",
    "fakeobj",
]
