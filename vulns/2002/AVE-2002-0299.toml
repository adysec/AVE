[basic]
description = 'KDE 3.0 至 3.0.2 版本的 Konqueror 浏览器在处理 HTTP Cookie 时存在安全缺陷，无法正确识别和执行 Cookie 的 "secure" 标志。攻击者可以通过诱导用户在非加密通道（HTTP）上发送本应仅在加密通道（HTTPS）传输的敏感 Cookie，从而通过网络嗅探手段窃取用户会话信息。该漏洞影响使用相关版本的 KDE 桌面环境的用户，攻击条件为目标在非加密网络环境下运行且 Cookie 包含 secure 标志。'
published = "2002-10-11T04:00:00Z"
remediation = "建议将 KDE 桌面环境及 Konqueror 浏览器升级至 3.0.3 或更高版本。在升级完成前，建议用户避免在不信任的网络环境中使用 Konqueror 访问需要安全 Cookie 的敏感网站。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "KDE Konqueror 浏览器安全 Cookie 泄露漏洞"
updated = "2026-06-16T21:58:49Z"

