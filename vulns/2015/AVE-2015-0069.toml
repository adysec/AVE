[basic]
description = "WordPress bj-lazy-load 插件 1.0 之前版本存在远程文件包含漏洞，该插件未能正确验证用户输入的参数，导致未经身份认证的攻击者可以通过构造特制的 HTTP 请求，远程包含任意服务器上的文件并执行。攻击者无需任何权限即可利用该漏洞，成功利用可导致敏感信息泄露或远程代码执行，严重威胁网站安全。建议用户立即升级至 1.0 或更高版本。"
published = "2019-09-26T00:15:10Z"
remediation = "立即将 bj-lazy-load 插件升级至 1.0 或更高版本，该版本修复了远程文件包含漏洞。由于该插件已长期未维护，建议停用并替换为其他活跃维护的延迟加载插件（如 wp-lazy-loading 或 a3 Lazy Load），同时在 WordPress 根目录 wp-config.php 中添加 define('DISALLOW_FILE_EDIT', true) 限制文件操作权限。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress bj-lazy-load 插件远程文件包含漏洞"
updated = "2026-06-17T00:36:28Z"

