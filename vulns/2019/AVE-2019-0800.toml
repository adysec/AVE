[basic]
description = "Cisco Small Business RV320 和 RV325 双千兆 WAN VPN 路由器的基于 Web 的管理界面存在输入验证漏洞。该漏洞源于程序对用户提供的输入验证不充分，具有管理员权限的已认证远程攻击者可通过向受影响设备的管理界面发送特制的 HTTP POST 请求，利用该漏洞在底层 Linux shell 中以 root 权限执行任意命令。Cisco 已发布固件更新修复此漏洞。"
published = "2019-01-24T15:29:00Z"
remediation = "立即将 Cisco RV320/RV325 固件升级至 1.4.2.22 或更高版本（1.4.2.21 修复不完整，必须升级到 1.4.2.22）。登录设备管理界面，导航至 Administration > Firmware Upgrade，上传从 Cisco.com 下载的最新固件并重启。如无法立即升级，在 Firewall > General 中禁用 Remote Management（远程管理）功能，阻止从 WAN 口访问管理界面，仅保留 LAN 侧管理访问作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["kev"]
title = "Cisco Small Business RV320和RV325 命令注入漏洞"
updated = "2026-06-17T02:28:57Z"

