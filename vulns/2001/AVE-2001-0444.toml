[basic]
description = "Basilix Webmail 1.0 存在文件泄露漏洞，远程攻击者无需身份认证即可通过向特定脚本发送特制的 HTTP 请求，读取服务器上的任意文件。该漏洞源于程序未对用户输入的文件路径进行充分过滤，攻击者可利用路径遍历技术访问 /etc/passwd 等敏感文件，导致系统信息泄露。Exploit-DB 已公开该漏洞的利用代码，攻击复杂度低，危害较大。"
published = "2001-07-06T00:00:00Z"
remediation = "Basilix Webmail 已停止维护，官方不再提供安全更新。建议立即升级到不受此漏洞影响的版本（如 1.0.4 及以上），或迁移至其他仍在维护的 Webmail 解决方案。如无法升级，可在 Web 服务器层面（如 Apache mod_rewrite）对 `basilix.php3` 的 `request_id` 参数进行输入过滤，拒绝包含 `../` 等目录遍历字符的请求，并限制 PHP `include` 路径范围为白名单目录。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Basilix Webmail 1.0 文件泄露漏洞"
updated = "2001-07-06T00:00:00Z"

