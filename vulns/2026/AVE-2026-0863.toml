[basic]
description = "Mistune 是一款 Python Markdown 解析器，其格式化插件（strikethrough/删除线、mark/标记、insert/插入）在处理连续闭合标记对（如 `~~x~~`、`==x==`、`^^x^^`）时存在算法复杂度缺陷。攻击者无需认证即可通过网络向启用了上述插件的应用提交特制的 Markdown 载荷，由于解析器在每个可能的起始位置均执行前向扫描匹配闭合标记，导致时间复杂度为 O(N²)，8KB 输入即可使 CPU 占用约 4 秒，16KB 输入约 17 秒，造成服务拒绝。该漏洞影响启用了 strikethrough、mark 或 insert 插件的所有 Mistune 版本（低于 3.3.0），CVSS 评分 7.5，危害等级高。官方已在 3.3.0 版本中通过限制并发追踪的未匹配标记数量修复此漏洞。"
published = "2026-07-08T17:17:27Z"
remediation = "立即将 mistune 升级至 3.3.0 或更高版本（pip install --upgrade mistune）。如无法升级，在调用 create_markdown() 时移除 strikethrough、mark、insert 插件，或对用户输入的 Markdown 长度限制在 4KB 以内并设置 CPU 超时（如 2 秒）作为临时缓解。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Mistune Markdown 解析器拒绝服务漏洞"
updated = "2026-07-09T19:36:00Z"

