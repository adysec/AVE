[basic]
description = "Mozilla Firefox 的 SVG 动画组件中存在一处释放后重用（Use-After-Free）漏洞，位于 `nsSMILTimeContainer::NotifyTimeChange()` 函数中。当处理特制的 SVG 动画时间线时，已释放的内存对象被再次访问，导致攻击者可以操控已释放的内存区域。远程攻击者可通过诱导用户访问恶意网页触发该漏洞，在目标系统上实现任意代码执行。该漏洞已在野外被积极利用，主要针对 Windows 平台上的 Firefox 和 Tor Browser 用户。影响 Firefox 50.0.2 之前版本、Firefox ESR 45.5.1 之前版本以及 Thunderbird 45.5.1 之前版本。Mozilla 已发布安全更新修复此漏洞。"
published = "2018-06-11T21:29:01Z"
remediation = "升级 Firefox 至 50.0.2 及以上版本，Firefox ESR 升级至 45.5.1 及以上版本，Thunderbird 升级至 45.5.1 及以上版本。如无法立即升级，可禁用 SVG 动画支持或通过组策略限制受影响浏览器访问不可信网站作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Mozilla Firefox SVG 动画释放后使用远程代码执行漏洞"
updated = "2026-06-17T00:55:29Z"

