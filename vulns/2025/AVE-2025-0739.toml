[basic]
description = "Windows 虚拟受信任的平台模块（Virtual TPM）存在输入验证不当漏洞（CWE-20）。具有低权限的本地攻击者可利用该漏洞向 vTPM 组件发送特制输入，导致目标系统的虚拟 TPM 服务拒绝响应或崩溃，从而影响依赖 TPM 功能的安全特性（如 BitLocker、Windows Hello 等）的正常运行。该漏洞攻击复杂度低，无需用户交互，但需要攻击者已获得本地访问权限。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:48Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新 (KB5049981)，涵盖 Windows 10/11 及 Server 2016/2019/2022/2025 全系列受影响版本。可通过 Windows Update 自动更新或从 Microsoft 更新目录手动下载安装。如无法立即打补丁，建议限制本地用户对 vTPM 设备的访问权限作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 虚拟受信任的平台模块拒绝服务漏洞"
updated = "2026-06-17T08:42:58Z"

