[basic]
description = "Quest KACE 系统管理设备（SMA）8.0.318 版本的 `/common/download_agent_installer.php` 脚本存在命令注入漏洞。未经身份认证的远程攻击者可通过向该脚本发送特制请求，在目标系统上以 Web 服务权限执行任意命令，完全控制受影响设备。该漏洞影响 Quest KACE SMA 8.0.318 及更早版本，CVSS 评分 9.8，危害等级严重。目前已有 Metasploit 利用模块公开，建议立即升级修复。"
published = "2018-05-31T18:29:00.557"
remediation = "立即升级 Quest KACE SMA 至最新受支持版本（当前最新为 15.1.173），该漏洞已在后续版本中修复。如无法立即升级，在反向代理或 Web 服务器层面配置访问控制规则，禁止匿名用户访问 `/common/download_agent_installer.php` 路径，或限制该路径仅允许内部管理 IP 访问作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Quest KACE System Management Appliance 命令注入漏洞"
updated = "2026-06-17T01:35:19.433"

