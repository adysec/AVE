[basic]
description = "Flowise 低权限 API 密钥跨工作区未授权文件访问与删除漏洞。该漏洞存在于 Flowise 的 /api/v1/files 路由中，该路由仅通过 feat:files 功能门控进行保护，未在 GET 或 DELETE 请求上强制执行权限检查。因此，组织内任何持有低权限 API 密钥的已认证用户，即使其权限与文件操作无关，也可通过调用 GET /api/v1/files 列出同一组织下其他工作空间存储的文件，并通过 DELETE /api/v1/files?path=... 删除其他工作空间的任意文件。具体而言，getAllFiles 接口直接使用 activeOrganizationId 递归列出组织存储根目录下的所有文件，而 deleteFile 接口虽读取 activeWorkspaceId 但仅用于存储配额记账，实际删除操作基于 activeOrganizationId 与用户可控的路径组合执行，完全忽略了 activeWorkspaceId 的访问限制。该漏洞破坏了组织内工作空间之间的文件访问隔离，可导致未授权文件浏览和恶意篡改，影响所有 3.1.3 之前版本的 Flowise 部署。"
published = "2026-08-04T16:16:28Z"
remediation = "立即将 Flowise 升级至 3.1.3 或更高版本。该版本修复了 `/api/v1/files` 路由缺少权限校验的问题，在 GET 和 DELETE 请求中增加了 `checkPermission(...)` 检查，确保 API 密钥仅能访问所属工作区的文件。如短期内无法升级，可通过反向代理限制低权限 API 密钥访问 `/api/v1/files` 端点，或仅向管理员账户授予 `feat:files` 功能权限，降低跨工作空间文件泄露和删除的风险。"
score = 7.2
severity = "HIGH"
sources = ["ghsa"]
title = "Flowise 文件管理接口 越权访问与删除漏洞"
updated = "2026-08-04T17:17:00Z"

