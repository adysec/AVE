[basic]
description = "TBK DVR4104、DVR4216 系列网络硬盘录像机（DVR）及其贴牌设备（包括 Novo、CeNova、QSee、Pulnix、XVR 5 in 1、Securus、Night OWL、DVR Login、HVR Login、MDVR Login 等品牌）存在身份认证绕过漏洞。远程攻击者无需任何凭证，只需在 HTTP 请求中添加 `Cookie: uid=admin` 头部即可绕过登录认证，进而通过向 `device.rsp?opt=user&cmd=list` 接口发送请求，获取设备中所有用户的明文密码等敏感凭据信息。该漏洞 CVSS 评分 9.8，危害等级严重，攻击复杂度低，影响范围广泛，大量贴牌 DVR 设备均受影响。"
published = "2018-04-10T22:29:00.290"
remediation = "建议立即联系设备厂商确认是否有固件更新，如无官方补丁，应在防火墙层面限制仅内网 IP 访问 DVR 的 Web 管理端口（默认 80/443），切勿将设备直接暴露在公网。同时禁用不必要的远程 Web 管理功能，或通过 VPN 访问设备管理界面。对于已受影响的设备，修改默认管理员口令并限制 Cookie 认证来源。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "TBK DVR4104/DVR4216 登录绕过漏洞"
updated = "2026-06-17T02:07:27.907"

