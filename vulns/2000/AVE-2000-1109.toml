[basic]
description = "标签之间。<value>ITHouse Mail Server 1.04 存在缓冲区溢出漏洞，远程攻击者可通过发送超长的 RCPT TO 邮件命令触发该漏洞，进而在服务器上执行任意命令。该漏洞影响运行 ITHouse Mail Server 1.04 的 Windows 系统，攻击者无需身份认证即可从网络端发起利用，CVSS 评分 10.0，危害等级为严重。"
published = "2000-05-30T04:00:00Z"
remediation = "立即将 ITHouse Mail Server 升级至官方发布的无缓冲区溢出版本（版本号需 ≥ 修复版本），若厂商已停止维护该版本，则在邮件服务器前端部署 SMTP 过滤器（如 smtp-nel-filter）以拦截超长 RCPT TO 命令，同时在防火墙层面限制外部对邮件服务端口的访问，仅允许可信 IP 连接，作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "ITHouse Mail Server 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:51:50Z"

