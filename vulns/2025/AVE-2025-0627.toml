[basic]
description = "Google Chrome 的 PDFium 组件存在越界读取漏洞（CWE-125），版本早于 134.0.6998.35 时受影响。远程攻击者可通过诱导用户打开特制的恶意 PDF 文件触发该漏洞，导致浏览器进程发生越界内存访问，结合堆布局与内容投毒可在目标系统上实现信息泄露或内存数据破坏，严重情况下可能造成拒绝服务甚至远程代码执行。攻击需用户交互（点击/打开恶意 PDF），无需身份认证且攻击复杂度低，攻击向量为网络远程，CVSS 3.1 评分为 8.8，属于高危漏洞。受此影响的还包括基于 Chromium 内核的 Microsoft Edge（早于 134.0.3124.51）等衍生浏览器，Google 已于 Chrome 134.0.6998.35 版本修复此问题。"
published = "2025-03-05T04:15:11Z"
remediation = "建议立即将 Google Chrome 升级到 134.0.6998.35 或更高版本，可通过 Chrome 菜单「帮助→关于 Google Chrome」触发自动更新或从官网下载最新版。使用 Microsoft Edge 的用户请升级到 134.0.3124.51 或更高版本（2025 年 3 月 7 日发布的稳定版），可在 Edge「设置→关于 Microsoft Edge」中更新。该漏洞因解析恶意构造的 PDF 文件触发越界读，日常应避免打开来源不明的 PDF 文档；在企业环境中，可借助组策略禁用 Edge 内置 PDF 阅读器（将 ShowPDFViewer 设为 0），并部署 Chrome 的强制更新策略，降低被远程利用导致的内存访问风险。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome PDFium 越界读取漏洞"
updated = "2026-06-17T08:40:20Z"

