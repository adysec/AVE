[basic]
description = "netfoil 的 LRU 缓存组件存在资源泄漏漏洞。当条目从 LRU 缓存中移除时，指向已移除元素的指针未被正确清理，导致内存资源无法被正常回收。本地攻击者可利用此漏洞持续消耗系统内存资源，在默认 systemd 配置下最多可消耗 100MB 内存，达到限制后会导致服务重启，造成拒绝服务。该漏洞影响 netfoil 的多个版本，攻击者无需特殊权限即可触发。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
