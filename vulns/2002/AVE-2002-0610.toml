[basic]
description = "Cisco VPN 5000 Client 在 Linux 平台 5.2.7 及之前版本、Solaris 平台 5.2.8 及之前版本中存在缓冲区溢出漏洞。该漏洞源于 close_tunnel 和 open_tunnel 功能对输入数据长度校验不足，本地低权限用户可通过向这两个函数传入超长参数触发栈缓冲区溢出，进而获得系统 root 权限。攻击者需在目标主机上拥有本地登录权限，利用该漏洞可完全控制受影响系统，执行任意代码、篡改数据或发起进一步内网攻击。Cisco 已在后续版本中修复此漏洞，受影响用户应升级到 5.2.7（Linux）或 5.2.8（Solaris）及以上版本。"
published = "2003-04-02T05:00:00.000"
remediation = "建议将 Linux 平台 Cisco VPN 5000 Client 升级至 5.2.7 及以上版本，将 Solaris 平台升级至 5.2.8 及以上版本。可从 Cisco 官方支持站点下载对应补丁并替换旧版客户端程序。如暂无法立即升级，应限制本地用户对 VPN 5000 Client 安装目录的写权限，并监控系统日志中 open_tunnel 与 close_tunnel 的异常调用记录，防止本地提权利用。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Cisco VPN 5000 Client 缓冲区溢出漏洞"
updated = "2026-06-16T21:59:25.780"

