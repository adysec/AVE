[basic]
description = 'Microsoft Outlook 97/98/2000 及 Outlook Express 5 及更早版本存在地址簿欺骗漏洞。当用户启用了"自动将我回复的人添加到通讯簿"选项时，软件不会在"回复地址"与"发件人地址"不一致时向用户发出警告。远程攻击者可通过伪造发件人地址，诱使受害者回复邮件，从而将攻击者的地址自动添加到受害者通讯簿中，进而拦截本应发送给其他用户的邮件。该漏洞利用条件简单，无需认证即可远程触发，影响范围广泛。'
published = "2001-06-05T04:00:00Z"
remediation = '立即禁用 Outlook 中"自动将我回复的人添加到通讯簿"选项（工具→选项→首选参数→电子邮件选项→取消勾选该功能），并升级到 Outlook 2002（Office XP）或更高版本，新版本默认不自动添加通讯录条目且对 Reply-To 地址差异有安全提示。如使用 Outlook Express，升级至 6.0 或更高版本。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft Outlook 通讯簿欺骗漏洞"
updated = "2026-06-16T21:55:33Z"

