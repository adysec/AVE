[basic]
description = "Netscape Enterprise Server 3.0/4.0 的 Web Publishing 功能存在目录信息泄露漏洞。远程攻击者可通过发送 INDEX 命令，无需身份认证即可列出 Web 服务器根目录下的任意目录内容，获取敏感目录结构信息。该漏洞影响 Netscape Enterprise Server 3.0 及 4.x 早期版本，攻击者利用此漏洞可进一步侦察服务器文件系统结构，为后续渗透攻击提供辅助信息。漏洞利用条件简单，仅需目标服务器开放 HTTP 服务并启用 Web Publishing 功能，攻击者通过网络即可远程触发。"
published = "2001-06-02T04:00:00Z"
remediation = "建议升级至 Netscape Enterprise Server 4.1 或更高版本以修复该漏洞，或联系 Sun Microsystems 获取 Enterprise Server 4.0 的安全补丁。如暂时无法升级，可在服务器配置文件中禁用 Web Publishing 功能作为临时缓解措施，并在防火墙或 WAF 层过滤 INDEX 命令请求。由于 Netscape Enterprise Server 已停止维护，强烈建议迁移至 Sun Java System Web Server 7.0 或更高版本等受支持的 Web 服务器产品。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Netscape Enterprise Server INDEX 命令目录信息泄露漏洞"
updated = "2026-06-16T21:53:57Z"

