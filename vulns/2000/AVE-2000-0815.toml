[basic]
description = "IBM AIX 4.3.x 版本中的 piobe 命令存在缓冲区溢出漏洞，本地攻击者可通过设置过长的环境变量触发缓冲区溢出，从而提升本地权限获取系统完全控制权限。该漏洞影响 IBM AIX 4.3.x 版本，攻击者需具备本地系统访问权限，通过构造超长环境变量传递给 piobe 命令触发缓冲区溢出，进而执行任意代码实现权限提升至 root 权限。CVSS 评分 7.2（AV:L/AC:L/Au:N/C:C/I:C/A:C），属于本地权限提升漏洞，影响系统机密性、完整性和可用性均为完全影响。"
published = "2001-01-09T05:00:00.000"
remediation = "建议立即应用 IBM AIX 4.3.x 的 APAR IY12638 补丁（PTF U462851 或后续超集 PTF），通过安装对应的 AIX 修补包修复 piobe 缓冲区溢出漏洞。若无法立即打补丁，建议临时限制普通用户对 /usr/lib/lpd/piobe 的执行权限（chmod 750 /usr/lib/lpd/piobe 并限制组权限），同时限制本地用户设置过长环境变量，作为临时缓解措施。建议尽快升级至受支持的 AIX 版本（如 AIX 7.2 TL5 或更高版本）以获得长期安全支持。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "IBM AIX 4.3.x piobe 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:11.990"

