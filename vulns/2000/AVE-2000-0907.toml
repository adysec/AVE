[basic]
description = "Red Hat Linux 5.2 中的 Glint 工具存在符号链接攻击漏洞。Glint 是 RPM 包管理器的图形前端界面，在运行过程中以不安全的方式创建临时文件，未对文件路径进行充分校验。本地攻击者可通过在 Glint 创建临时文件前预置符号链接，将目标指向系统关键文件（如 /etc/passwd），从而在 Glint 以 root 权限运行时实现任意文件覆盖写入，导致系统拒绝服务或权限提升。该漏洞利用条件为拥有本地访问权限，无需额外认证，CVSS 评分 7.2，危害等级高。"
published = "2000-12-19T05:00:00.000"
remediation = "立即安装 Red Hat 官方安全公告 RHSA-2000:062 提供的 glint 更新包。由于 Red Hat Linux 5.2 已停止维护，建议升级到受支持的 Red Hat Enterprise Linux 版本。临时缓解措施：避免向不可信用户授予本地访问权限，并监控 /tmp 目录下的符号链接创建行为。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Red Hat Linux Glint 本地符号链接攻击任意文件覆盖漏洞"
updated = "2026-06-16T21:52:48.080"

