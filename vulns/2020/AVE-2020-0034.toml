[basic]
description = "rConfig 3.9.4 及更早版本中的 snippets.inc.php 等多个接口存在未经身份验证的 SQL 注入漏洞。攻击者可通过操纵 HTTP 请求参数中的 searchColumn 字段，将恶意 SQL 语句注入到数据库查询中，且无需登录凭据即可利用。由于 rConfig 默认以明文形式存储所管理网络设备的 IP 地址、用户名和密码等信息，成功利用该漏洞可导致攻击者横向渗透至受监控的网络设备，获取设备的完整访问权限。该漏洞影响所有使用 rConfig 3.9.4 及更早版本的网络配置管理系统，CVSS 评分 9.8，危害等级为严重。rConfig 官方已在后续版本中修复此漏洞。"
published = "2020-06-04T04:15:13Z"
remediation = "将 rConfig 升级至 3.9.7 或更高版本，该版本将 snippets.inc.php、compliancepolicies.inc.php、compliancepolicyelements.inc.php 和 devices.inc.php 等文件中未过滤的 SQL 查询替换为预处理语句，从根源消除 SQL 注入风险。如暂无法立即升级，应在 Web 服务器或防火墙层对 /www/snippets.inc.php 等路径实施访问控制，仅允许可信管理网段访问，并将数据库中明文存储的网络设备密码改为加密存储，同时检查用户表是否存在未授权创建的管理员账号。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "rConfig 网络设备配置管理平台 SQL 注入漏洞"
updated = "2026-06-17T02:47:59Z"

