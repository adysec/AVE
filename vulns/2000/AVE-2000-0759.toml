[basic]
description = "Check Point Firewall-1 Session Agent 3.0 至 4.1 版本存在认证绕过漏洞。该组件在身份验证时，对无效用户名和无效密码返回不同的错误消息，攻击者可通过远程发送认证请求并分析响应差异，枚举出系统中有效的用户名，进而使用字典攻击暴力破解密码，最终获取未授权访问权限。该漏洞影响 Check Point Firewall-1 3.0、4.0 及 4.1 等版本，CVSS 评分 7.5，危害等级高。远程攻击者无需身份认证即可利用此漏洞，对防火墙管理面安全造成严重威胁。Check Point 已在后续版本中修复此问题。"
published = "2000-12-11T05:00:00Z"
remediation = "立即将 Check Point Firewall-1 Session Agent 升级至 4.1 SP5 或更高版本，该版本已修复错误消息差异问题。如无法立即升级，应在边界防火墙或 ACL 中限制 TCP 261 端口的访问来源，仅允许可信管理网段访问 Session Agent，作为临时缓解措施。同时应启用强密码策略并定期审计防火墙会话认证日志，检测异常连接尝试。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Check Point Firewall-1 会话代理字典攻击漏洞"
updated = "2026-06-16T21:53:01Z"

