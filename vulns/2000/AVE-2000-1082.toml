[basic]
description = "SonicWALL SOHO Firewall 4.0 及 5.0 版本内置的 Web 服务器在处理认证页面时存在输入验证缺陷，远程攻击者无需身份认证即可向登录页面提交超长用户名，触发缓冲区溢出导致 Web 服务进程崩溃，造成拒绝服务。该漏洞影响 SonicWALL SOHO 系列防火墙设备，攻击条件简单，仅需网络可达即可实施，危害等级中危。"
published = "2001-01-09T05:00:00.000"
remediation = "建议立即升级 SonicWALL SOHO 防火墙固件至最新版本（该产品已停产，建议迁移至 SonicWALL TZ 系列等受支持型号）。如无法升级，可在防火墙管理界面中将 Web 管理访问限制为仅允许受信任的内部 IP 地址，并在网络边界 ACL 中阻断对 443 端口的非授权外部访问，以降低攻击面。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "SonicWALL SOHO Firewall 4.0/5.0 Web Server 拒绝服务漏洞"
updated = "2026-06-16T21:53:08.387"

