[basic]
description = 'Dasan GPON家庭路由器存在认证绕过漏洞，攻击者只需在需要认证的URL后附加"?images"参数（如/menu.html?images/或/GponForm/diag_FORM?images/），即可完全绕过设备认证机制，无需任何凭证即可访问设备管理界面。该漏洞允许未经身份认证的远程攻击者完全控制受影响的GPON家庭路由器，包括修改配置、查看敏感信息、执行任意操作等。CVSS评分9.8，危害等级严重。受影响的设备包括Dasan GPON系列家庭路由器产品，目前厂商尚未发布官方修复补丁。'
published = "2018-05-04T03:29:00Z"
remediation = "立即升级 Dasan GPON 家庭路由器固件至厂商发布的最新版本（如 H640GW V2.0.0.6 及以上、H660GW V2.0.0.7 及以上），该漏洞在 2018 年已有官方补丁。如无法升级，可在路由器管理界面禁用远程管理（WAN 侧访问），并将管理端口限制为仅内网 IP 可访问，同时在防火墙规则中拦截对 80/443 端口的公网访问作为临时缓解。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Dasan GPON家庭路由器认证绕过漏洞"
updated = "2026-06-17T01:34:10Z"

