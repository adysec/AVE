[basic]
description = "Thumbor 是一款开源图片缩略图服务，其 file_loader 组件存在路径遍历漏洞。漏洞原理是 file_loader 在完成 `abspath()` 和 `startswith()` 根目录边界安全检查之后，才对文件路径执行 `unquote()` 解码操作。攻击者可通过 watermark 或 frame 滤镜传入经过双重 URL 编码的路径遍历序列（如 `%252e%252e` 表示 `..`），该序列在安全检查时被视为普通目录名而绕过验证，随后被 `unquote()` 解码为真实的 `..` 遍历序列，导致读取 FILE_LOADER_ROOT_PATH 之外的任意文件。攻击条件要求启用 `ALLOW_UNSAFE_URL = True`（默认开启）并使用 file_loader。成功利用可读取服务器上的配置文件、密钥、私有证书等敏感信息，CVSS 评分 8.7，危害等级高。该漏洞在 Thumbor 7.8.0 版本中修复。"
published = "2026-07-31T19:17:09Z"
remediation = "立即升级 Thumbor 至 7.8.0 或更高版本（`pip install --upgrade thumbor`）。如无法升级，在配置中将 `ALLOW_UNSAFE_URL` 设为 `false`，或移除 `thumbor.loaders.file_loader` 改用其他 loader，或在反向代理层过滤包含 `%2e` 的请求路径。"
score = 8.7
severity = "HIGH"
sources = ["ghsa"]
title = "Thumbor file_loader 路径遍历漏洞"
updated = "2026-07-31T20:16:51Z"

