[basic]
description = "rConfig 3.9.4 及更早版本存在未认证的 devices.inc.php SQL 注入漏洞。攻击者无需身份认证即可向该接口发送构造的 SQL 语句，成功利用后可读取数据库中存储的节点密码信息。由于 rConfig 默认以明文形式保存网络设备的密码，攻击者能够进一步实施横向移动，获得对受监控网络设备的访问权限，造成严重的信息泄露和网络渗透风险。"
published = "2020-06-04T04:15:13Z"
remediation = "立即将 rConfig 升级至 3.9.7 或更高版本，该版本修复了 devices.inc.php 等文件的预认证 SQL 注入漏洞。升级前务必备份数据库与配置文件，执行 composer install --no-dev 及 php artisan migrate 完成版本迁移。若短期内无法升级，应在 Apache/Nginx 层面通过 IP 白名单限制 /www/devices.inc.php 等敏感接口的访问，或临时禁用相关功能模块以缓解风险。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "rConfig 网络配置管理系统 SQL注入漏洞"
updated = "2026-06-17T02:47:59Z"

