remediation = "Microsoft 已在服务端完成漏洞修复。用户应立即安装操作系统及浏览器的最新安全更新，确保系统运行受支持的 Windows 版本。企业管理员应审查 Microsoft Entra ID 条件访问策略，限制异常登录源和特权账户的横向移动。临时缓解措施：在网络边界防火墙中限制对 Microsoft Account 服务端口的出站访问，仅允许来自已知可信 IP 范围的 HTTPS 请求。持续关注 https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-21396 获取后续补丁通知。"
