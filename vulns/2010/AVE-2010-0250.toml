[basic]
description = "Apple QuickTime 7.6.9 之前版本在处理 QTVR（QuickTime Virtual Reality）影片文件中的全景原子（panorama atoms）时存在内存破坏漏洞。远程攻击者可构造特制的 FlashPix 或 QTVR 文件，通过诱导用户打开恶意文件触发内存损坏，导致应用程序崩溃或任意代码执行。该漏洞影响 Windows 和 macOS 平台上的 QuickTime 播放器，CVSS 评分 9.3，危害严重。用户需升级至 QuickTime 7.6.9 或更高版本以修复此漏洞。"
published = "2010-12-09T20:00:17Z"
remediation = "立即将 Apple QuickTime 升级至 7.6.9 或更高版本。macOS 用户可通过系统 Software Update 获取更新，或访问 http://support.apple.com/kb/HT4447 下载补丁。Windows 用户应从 Apple 官网下载 QuickTime 7.6.9 安装包。由于 Apple 已停止支持 Windows 版 QuickTime，建议 Windows 用户卸载 QuickTime 并改用 VLC 等替代播放器，同时在浏览器中禁用 QuickTime 插件以防止远程触发。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime FlashPix 文件处理内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:23:33Z"

