[basic]
description = "NAI Sniffer Agent 在身份验证过程中使用 base64 编码传输敏感凭据，由于 base64 仅为可逆编码而非加密机制，未经身份认证的远程攻击者可通过网络嗅探捕获目标系统的认证流量，并轻松解码获取明文用户名和密码。该漏洞影响使用 NAI Sniffer Agent 的系统和网络环境，攻击者只需位于同一局域网或网络路径可及的位置，即可被动监听网络通信并提取认证凭证，进而非法访问受保护资源。CVSS 评分 7.5，危害等级为高。"
published = "2001-01-09T05:00:00Z"
remediation = "1. 升级 NAI Sniffer Agent 至修复了 base64 弱认证问题的官方补丁版本，启用加密认证机制替代明文 base64 编码传输。2. 如无法立即升级，临时禁用 Sniffer Agent 的远程认证功能，仅在本地管理界面操作。3. 通过网络访问控制列表（ACL）或防火墙限制 Sniffer Agent 管理端口的访问来源，仅允许可信管理主机连接。4. 在 Sniffer Agent 部署网段启用端口安全或 MAC 地址绑定，防止未经授权的网络嗅探设备接入同一网段。5. 对所有 Sniffer Agent 管理员账户启用强密码策略并定期轮换，降低凭证泄露后的利用窗口。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "NAI Sniffer Agent 身份验证凭据弱加密嗅探漏洞"
updated = "2026-06-16T21:53:16Z"

