[basic]
description = "Novell NetWare 5.1 SP3 的 FTP 服务器组件 NWFTPD.nlm 在 5.01o 之前版本中存在多个未明确说明的访问控制漏洞。未经身份认证的远程攻击者可通过未知攻击向量绕过对匿名访问的预期限制，以匿名用户身份执行未经授权的 FTP 操作。该漏洞影响 Novell NetWare 5.01i 及 5.1 等版本，攻击者无需账号凭证即可在互联网或局域网内直接发起利用，导致敏感文件泄露、数据篡改或服务中断，CVSS 评分 7.5，危害等级高。"
published = "2010-04-05T15:30:00Z"
remediation = '建议将 NetWare 5.1 升级至 Service Pack 8 并安装 NWFTPD.NLM v5.05，或至少将 NWFTPD.NLM 升级至 5.01o 及以上版本以修复匿名访问控制绕过漏洞。同时修改 SYS:ETC\FTPSERV.CFG 配置文件，将 ANONYMOUS_ACCESS 设置为 NO 以禁用匿名 FTP 登录，并删除匿名用户账户。配置 SYS:ETC\FTPREST.TXT 访问控制列表，使用 NOREMOTE 限制禁止远程用户访问敏感目录，确保匿名密码符合 x@y 格式要求。如暂无法升级，可在防火墙层阻断 21 端口入站访问作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Novell NetWare FTP 服务 访问控制绕过漏洞"
updated = "2026-06-16T21:53:27Z"

