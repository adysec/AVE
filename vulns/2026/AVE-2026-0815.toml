[basic]
description = "Open WebUI 存在跨用户会话劫持漏洞，源于 Socket.IO 事件调用器 `get_event_call` 未验证 `session_id` 归属，仅检查会话是否在线即将 `execute:python`/`execute:tool` 事件投递至客户端提供的任意会话 ID。低权限认证攻击者可通过共享笔记的 `ydoc:document:join` 机制获取目标用户的实时 Socket ID，进而劫持其会话执行任意代码解释器 Python 脚本或工具。若目标为管理员，攻击者可利用劫持的管理员上下文调用 Functions API 创建恶意函数，其源码在服务端通过 `exec()` 执行，最终实现远程代码执行（默认容器中为 root 权限）。该漏洞影响 Open WebUI v0.10.0 之前的所有版本，CVSS 评分 7.7，危害等级高。"
published = "2026-07-09T17:17:02Z"
remediation = "立即升级 Open WebUI 至 v0.10.0 或更高版本（`docker pull ghcr.io/open-webui/open-webui:latest` 后重启容器）。如无法立即升级，在反向代理层限制 `/api/v1/chat/completions` 接口仅允许受信来源访问，并禁用代码解释器功能（关闭 Code Interpreter 开关）作为临时缓解措施。"
score = 7.7
severity = "HIGH"
sources = ["ghsa"]
title = "Open WebUI 跨用户会话代码执行漏洞"
updated = "2026-07-13T12:24:30Z"

