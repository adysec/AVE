[basic]
description = "tags.<value>SugarCRM Enterprise 9.0.0 的移动端错误页面 `mobile/error-not-supported-platform.html` 未对 `desktop_url` 参数进行充分过滤，导致存在反射型跨站脚本（XSS）漏洞。未经身份认证的远程攻击者可通过构造包含恶意 JavaScript 代码的特制 URL 并诱骗用户点击，在受害者浏览器中执行任意脚本，从而窃取会话 Cookie、重定向用户至恶意站点或进行其他恶意操作。该漏洞影响 SugarCRM Enterprise 9.0.0 版本，攻击向量为网络，攻击复杂度低，需要用户交互触发才能利用。CVSS v3 评分为 6.1，危害等级为中危。"
published = "2019-08-14T16:15:12.707"
remediation = "建议将 SugarCRM Enterprise 升级至 9.0.1 或更高版本。对于无法立即升级的系统，可通过修改 `mobile/error-not-supported-platform.html` 文件，对 `desktop_url` 参数实施严格的 URL 编码处理或白名单过滤，防止恶意脚本注入。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "SugarCRM Enterprise 9.0.0 跨站脚本漏洞"
updated = "2026-06-17T02:19:25.790"

