[basic]
description = "McAfee WebShield SMTP 4.5 存在安全绕过漏洞。远程攻击者可在邮件附件文件名中插入扩展 ASCII 字符（如高字节字符），使 SMTP 内容过滤规则无法正确识别附件类型或文件名，从而绕过病毒扫描、恶意文件检测等安全策略。受影响范围为部署 McAfee WebShield SMTP 4.5 的邮件网关设备。攻击条件为攻击者能够向受保护邮件服务器发送邮件并携带恶意附件。利用方式为在附件名中嵌入扩展 ASCII 字符，使过滤引擎对文件名解析失效，导致含有恶意代码的附件绕过检测进入用户邮箱。"
published = "2001-01-09T05:00:00.000"
remediation = "立即将 McAfee WebShield SMTP 升级至供应商发布的最新补丁版本，并在 SMTP 网关层配置规则，拒绝文件名包含扩展 ASCII 字符的附件，以阻断绕过内容过滤的攻击。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "McAfee WebShield SMTP 安全绕过漏洞"
updated = "2026-06-16T21:53:12.833"

