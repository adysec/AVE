[basic]
description = "Poll It 2.01 及更早版本中的 pollit.cgi 脚本将投票数据文件存放在 Web 文档根目录下，未对敏感文件进行访问控制。远程攻击者无需身份认证即可通过直接访问这些数据文件，获取投票记录、用户提交的敏感信息等私密数据。该漏洞利用难度低，仅需知道数据文件路径即可实施，影响所有使用 Poll It 2.01 及之前版本的 Web 站点。"
published = "2000-12-11T05:00:00Z"
remediation = "立即停止使用 Poll It 2.01 及更早版本，该脚本已不再维护且存在多处安全缺陷。如必须继续使用，需手动修改源代码：将 ReadForm 函数调用移至脚本第 15 行之前（所有变量声明之前），防止 CGI 参数覆盖内部变量；同时将 pollit_files 数据目录移出 Web 文档根目录（如移至 /var/pollit/data），并配置 Web 服务器禁止直接访问该目录。强烈建议迁移至其他受支持的投票系统。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Poll It pollit.cgi 信息泄露漏洞"
updated = "2026-06-16T21:53:05Z"

