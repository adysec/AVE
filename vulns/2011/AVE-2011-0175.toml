[basic]
description = "Google Chrome 浏览器内置的 V8 JavaScript 引擎在元素包装器（element wrapper）处理过程中存在释放后使用（use-after-free）漏洞。当浏览器处理特定 DOM 元素时，内存对象可能被提前释放，但程序仍试图访问已释放的内存区域。该漏洞影响 Google Chrome 17.0.963.65 之前的所有版本，攻击者无需身份认证即可远程利用。攻击条件为诱使用户访问包含恶意代码的网页，通过特制的网页内容触发 V8 引擎中的内存错误，可能导致浏览器崩溃（拒绝服务）或在某些条件下执行任意代码，进而危害用户系统安全。"
published = "2012-03-05T19:55:01Z"
remediation = "立即升级 Google Chrome 至 17.0.963.65 或更高版本，以修复 V8 引擎中的 use-after-free 漏洞。如无法立即升级，可临时使用其他浏览器访问不可信网站，并避免点击可疑链接或打开未知网页。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome V8 元素包装器 Use-after-free 漏洞"
updated = "2026-06-16T23:32:27Z"

