[basic]
description = "WordPress 的 Updater 插件（由 BestWebSoft 开发）1.35 版本之前存在多个跨站脚本（XSS）漏洞。该漏洞源于插件在 admin.php 页面的 bws_panel 功能中，对 category 参数未进行充分的输入过滤与转义处理。已登录认证的攻击者可通过构造包含恶意 JavaScript 脚本的特制 URL，诱使具有管理员权限的用户点击，导致恶意脚本在受害者浏览器中执行，从而窃取会话 Cookie、执行未授权操作或篡改页面内容。攻击者需具备 WordPress 站点的最低级订阅者权限，且需要用户交互触发，影响范围涉及所有使用该插件的 WordPress 站点。"
published = "2019-08-21T13:15:12Z"
remediation = "将 WordPress updater 插件升级至 1.35 或更高版本。在 WordPress 后台插件管理页面检查并更新 updater 插件至最新版；如已停用该插件，建议彻底删除后重新安装最新版本。作为临时缓解措施，可在 Web 应用防火墙（WAF）层面对包含恶意脚本参数的 URL 请求进行过滤拦截。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress updater插件跨站脚本漏洞"
updated = "2026-06-17T01:13:06Z"

