[basic]
description = "Microsoft Internet Explorer 5 及 6.0 版本中存在跨站脚本（XSS）漏洞，远程攻击者可通过构造特制 URL 利用本地 HTML 资源文件，绕过同源策略（Same Origin Policy）在本地计算机区域（Local Computer zone）执行恶意脚本。该漏洞源于浏览器对本地 HTML 资源文件的权限检查不充分，攻击者无需身份认证即可利用，可能导致敏感信息泄露、会话劫持或权限提升。Microsoft 已在 MS02-047 安全公告中发布补丁修复此漏洞。"
published = "2002-05-29T04:00:00Z"
remediation = '立即安装 Microsoft 于 2002 年 8 月发布的 Internet Explorer 累积安全更新 Q323759（对应公告 MS02-047）。该补丁修复了 IE 5.01/5.5/6.0 中本地 HTML 资源的跨站脚本绕过漏洞。如无法安装补丁，可将不受信任的网站加入受限站点区域，并启用 Outlook 2002 SP1 的"以纯文本阅读"功能作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer 同源策略绕过漏洞"
updated = "2026-06-16T21:56:57Z"

