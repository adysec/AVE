[basic]
description = "AnalogX Proxy 4.0 及之前版本存在缓冲区溢出漏洞。远程攻击者可通过向 TCP 6588 端口发送超长 HTTP 请求，或向 TCP 1080 端口发送包含超长 DNS 主机名的 SOCKS 4A 请求触发缓冲区溢出，导致服务拒绝服务，甚至可能执行任意代码。该漏洞影响 AnalogX Proxy 4.12 之前的所有版本，无需身份认证即可远程利用，危害严重。"
published = "2002-10-04T04:00:00Z"
remediation = "立即升级 AnalogX Proxy 至 4.12 或更高版本，该版本已修复 Socks4A 和 HTTP 请求的缓冲区溢出问题。如无法升级，在防火墙规则中限制对 TCP 端口 6588 和 1080 的访问，仅允许可信 IP 连接，并禁用 SOCKS 代理功能作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "AnalogX Proxy 缓冲区溢出漏洞"
updated = "2026-06-16T21:58:32Z"

