[basic]
description = "FreeBSD UFS 与 EXT2FS 文件系统存在竞争条件漏洞，文件删除后数据块在清零前短暂时间内仍可被用户进程访问。该漏洞影响 FreeBSD 4.2 及更早版本，并可能波及其他采用类似机制的类 Unix 操作系统。本地低权限攻击者可利用此竞争窗口，在文件被删除但尚未清零的间隙读取已删除的敏感数据，导致信息泄露。CVSS 评分为 6.2，危害等级中等。建议升级至 FreeBSD 较新版本以获得修复。"
published = "2001-06-18T04:00:00Z"
remediation = "建议立即升级 FreeBSD 系统至受支持的稳定版本（当前推荐 FreeBSD 14.x），该漏洞在 FreeBSD 4.3 及后续版本中已修复。如无法立即升级，可下载 FreeBSD-SA-01:30 补丁文件（ftp://ftp.FreeBSD.org/pub/FreeBSD/CERT/patches/SA-01:30/fs.patch），执行 cd /usr/src && patch -p &lt; /path/to/patch，重新编译内核并重启系统使修复生效。临时缓解措施：严格限制本地用户对敏感文件的访问权限，避免在系统上运行不受信任的本地进程。"
score = 6.2
severity = "MEDIUM"
sources = ["cve"]
title = "FreeBSD EXT2FS文件系统UFS竞争条件信息泄露漏洞"
updated = "2026-06-16T21:54:10Z"

