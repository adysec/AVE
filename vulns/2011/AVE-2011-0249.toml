[basic]
description = "Google Chrome 16.0.912.77 之前版本的 tree builder 组件中存在堆缓冲区溢出漏洞（CWE-787）。远程攻击者可通过诱导用户访问特制网页触发该漏洞，导致浏览器崩溃或可能执行任意代码。攻击无需身份认证，CVSS 评分 7.5，危害等级高。Google 已在 Chrome 16.0.912.77 版本中修复此漏洞。"
published = "2012-01-24T04:03:36Z"
remediation = "立即将 Google Chrome 升级至 16.0.912.77 或更高版本（通过 Chrome 内置更新或重新下载安装）。Apple 用户应将 Safari 升级至 6.0 及以上、iOS 升级至 6.0 及以上、iTunes 升级至 10.7 及以上。无法升级时，可禁用 JavaScript 或使用内容安全策略作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome 堆缓冲区溢出漏洞"
updated = "2026-06-16T23:34:10Z"

