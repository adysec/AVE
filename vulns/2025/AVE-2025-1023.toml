[basic]
description = "Linux 内核的 BPF 子系统中，bpf_prog_test_run_xdp() 函数在调用 bpf_test_init() 时，若传入的 user_data 参数值小于以太网头部长度（ETH_HLEN），会导致后续 eth_skb_pkt_type() 访问不包含以太网头部的 skb 数据，从而触发 use-after-free 内存安全漏洞。该漏洞影响所有支持 eBPF/XDP 程序测试运行的 Linux 内核版本，具有本地低权限攻击面，攻击者可通过构造恶意 BPF 程序测试运行请求，触发内核访问已释放的内存区域，进而造成拒绝服务或实现本地权限提升。漏洞的根本原因是内核未对用户传入的 user_data 长度进行有效性校验，导致后续网络设备类型解析时访问无效内存。"
published = "2025-03-27T14:15:47Z"
remediation = "升级 Linux 内核至已修复版本：stable 6.1.130、6.6.80、6.12.17、6.13.5 或 6.14+，可通过发行版包管理器（apt/yum/dnf）安装对应安全更新。如暂无法升级，可通过设置 kernel.unprivileged_bpf_disabled=1 禁用非特权 BPF 程序加载，或通过 seccomp 限制进程对 bpf() 系统调用的访问权限作为临时缓解。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux kernel BPF 释放后使用漏洞"
updated = "2026-07-14T13:17:26Z"

