[basic]
description = "OpenRun 项目存在重定向 URL 校验绕过漏洞。攻击者利用浏览器对 `//` 开头的路径自动补全为协议相对 URL 的特性，构造形如 `http://127.0.0.1:25222//evil.com` 的 URL——其 host 和 schema 与当前网站一致从而通过校验，但实际使用的 path 部分 `//evil.com` 被浏览器解析为外部地址，导致开放重定向。攻击者可借此将用户重定向至恶意网站，用于钓鱼攻击或社会工程学攻击。"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 openrun 升级至 v0.17.7 或更高版本（commit 709da784），该版本修复了重定向 URL 验证逻辑，禁止以 // 开头的路径绕过主机检查。如无法立即升级，可在反向代理或 WAF 层添加规则，拦截 Referer 或 Location 头中包含 // 后接外部域名的请求作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "OpenRun 开放重定向漏洞"
updated = "2026-01-01T00:00:00Z"

