[basic]
description = "Linux内核AX.25协议实现中存在释放后使用漏洞。在ax25_setsockopt()函数中，由于socket锁与RTNL锁之间存在循环依赖，攻击者可通过发送特制的AX.25数据包触发内核死锁，进而利用释放后使用漏洞实现权限提升或拒绝服务。该漏洞影响支持AX.25协议的内核版本，CVSS评分7.8，危害等级高。"
published = "2025-02-27T20:16:03Z"
remediation = "Linux 内核存在 AX25 `dev->ax25_ptr` 访问的 use-after-free（CWE-416）漏洞，可导致提权。修复应升级内核至包含补丁「ax25: rcu protect dev->ax25_ptr」的稳定版本（如内核 6.13.x 之后、或对应发行版厂商已修复的版本）。以 Ubuntu/Debian 为例执行 `sudo apt update && sudo apt upgrade linux-image-generic`，SUSE 用户更新至 SUSE-SU-2025:01614-1 / 01964-1 等公告对应内核包后重启。若无法立即升级，可在不需要 AX.25 协议的环境通过 `sudo modprobe -r ax25` 卸载该内核模块，或以内核启动参数禁用相关功能作为临时缓解；同时将 AX25 网络接口仅用于受信任的内网。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 AX.25 协议锁竞争导致使用后释放漏洞"
updated = "2026-06-17T08:44:20Z"

