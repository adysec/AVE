[basic]
description = "Linux 内核 2.2.19 之前版本中的 CPUID 和 MSR 驱动程序缺少正确的注销（unregister）调用，当用户反复加载和卸载这些驱动模块时，会导致内核资源管理混乱，进而引发系统崩溃（拒绝服务）。该漏洞需要本地用户权限才能触发，攻击条件较为有限，影响范围覆盖所有使用受影响 Linux 内核版本的系统。利用方式为通过模块操作触发内核错误，无法实现远程攻击或权限提升。"
published = "2001-04-17T04:00:00Z"
remediation = "升级 Linux 内核至 2.2.19 或更高版本，该版本已为 CPUID 和 MSR 驱动添加了正确的 unregister 调用，防止卸载重载时内核崩溃。如无法升级内核，可禁止卸载 CPUID 和 MSR 相关内核模块作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Linux Kernel CPUID 和 MSR 驱动未注册导致拒绝服务漏洞"
updated = "2026-06-16T21:56:10Z"

