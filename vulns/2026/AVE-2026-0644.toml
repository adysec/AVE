[basic]
description = "Gitea SSH 密钥解析器存在拒绝服务漏洞。Gitea 的 SSH 密钥导入接口接受 RFC 4716（SSH2）格式的密钥，在规范化处理时，parseKeyString 函数使用 Go 字符串的 += 操作逐行拼接密钥内容。由于 Go 字符串不可变，每次拼接都会分配新内存并复制整个累积字符串，导致时间复杂度为 O(N²)。任何已认证用户均可通过 POST /api/v1/user/keys 接口提交一个包含大量短行（如 40 万行、每行 100 字符）的恶意 SSH2 公钥，使服务器消耗大量 CPU 和内存资源，导致实例离线。该漏洞影响 Gitea ≤ 1.26.4 版本，已在 1.27.0 版本中修复。"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 Gitea 升级至 v1.27.0 或更高版本（该版本在 `models/asymkey/ssh_key_parse.go` 中增加了 SSH 公钥输入长度限制，并将 O(n²) 字符串拼接改为 strings.Builder）。如无法立即升级，可在反向代理层限制 `POST /api/v1/user/keys` 接口的请求体大小（建议 ≤1MB），并监控 CPU/内存异常飙升。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Gitea SSH密钥解析拒绝服务漏洞"
updated = "2026-01-01T00:00:00Z"

