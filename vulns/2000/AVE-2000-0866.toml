[basic]
description = "Microsoft FrontPage 2000 Server Extensions 1.1 的 shtml.exe 组件存在信息泄露漏洞。远程攻击者无需身份认证即可向目标服务器发送包含标准 DOS 设备名称（如 CON、NUL、AUX 等）的畸形 URL 请求，触发组件异常处理逻辑，导致服务器组件物理路径被泄露。该路径信息可被攻击者用于进一步探测系统目录结构，为后续攻击（如文件包含、目录遍历）提供基础。影响 Microsoft FrontPage 2000 Server Extensions 1.1 版本。"
published = "2000-10-20T04:00:00.000"
remediation = "建议立即安装 Microsoft FrontPage 2000 Server Extensions 1.2 (SR 1.2) 安全更新，该版本修复了 shtml.exe 对 DOS 设备名（如 CON、NUL、AUX、LPT1 等）输入校验不严的问题。如无法升级，可在 IIS 中移除 shtml.exe 的脚本映射，或配置 URLScan 等 ISAPI 过滤器拦截包含 DOS 保留设备名的请求路径作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft FrontPage 2000 Server Extensions shtml.exe 信息泄露漏洞"
updated = "2026-06-16T21:52:19.130"

