[basic]
description = 'Serv-U FTP Server 2.5i 之前版本存在目录遍历漏洞。远程攻击者通过在 CD 命令后附加 "/..%20." 等特殊构造字符串，可突破 FTP 根目录限制，读取服务器上的任意文件。该漏洞源于程序对用户输入的路径参数过滤不严，未正确校验 ".." 目录跳转序列，结合 URL 编码绕过机制实现路径穿越。攻击者无需身份认证即可利用该漏洞，可能导致敏感信息泄露，如配置文件、密码文件等。CVSS 评分 5.0，危害等级中。'
published = "2001-02-16T05:00:00.000"
remediation = '升级 Serv-U FTP Server 至 2.5i 或更高版本，该版本修复了 CD 命令中 "/..%20." 字符串导致的目录遍历问题。如无法升级，限制匿名用户对 FTP 根目录的访问权限，并在防火墙层面限制对 FTP 服务（默认端口 21）的访问来源 IP。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Cat Soft Serv-U FTP 服务器目录遍历漏洞"
updated = "2026-06-16T21:53:34.147"

