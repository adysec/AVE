[basic]
description = "Microsoft SQL Server 及 MSDE 中的 xp_updatecolvbm 扩展存储过程函数在调用 srv_paraminfo API 前未正确限制缓冲区长度，存在缓冲区溢出漏洞。本地认证攻击者可通过向该函数传递特制参数触发缓冲区溢出，导致服务拒绝或执行任意命令。该漏洞影响 SQL Server 7.0 及 MSDE 1.0 等版本，CVSS 评分 4.6，需本地登录后利用。"
published = "2001-01-09T05:00:00Z"
remediation = "建议立即安装 Microsoft 安全公告 MS00-092 提供的补丁。SQL Server 7.0 用户需先升级至 Service Pack 2 再安装此补丁，后续将包含在 SP3 中；SQL Server 2000 用户可直接安装补丁，后续将包含在 SP1 中。如无法立即打补丁，应限制对 SQL Server 的登录权限，确保 SQL Server 服务账户仅具有普通用户权限而非管理员权限，并检查所有第三方扩展存储过程（XP）对 srv_paraminfo() 的调用是否分配了足够大小的缓冲区。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft SQL Server 扩展存储过程参数解析缓冲区溢出漏洞"
updated = "2026-06-16T21:53:06Z"

