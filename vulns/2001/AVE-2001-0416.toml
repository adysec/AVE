[basic]
description = "Namazu 2.0.9 及更早版本存在跨站脚本（XSS）漏洞，远程攻击者可通过在 idxname 参数中指定无效索引文件，触发错误消息返回时注入恶意 JavaScript 脚本，导致其他用户在浏览器中执行任意脚本代码。该漏洞影响 Namazu 2.0.9 及之前所有版本，攻击者无需身份认证即可利用，危害较大。建议升级至最新版本或对 idxname 参数进行严格过滤。"
published = "2001-12-27T05:00:00.000"
remediation = "立即将 Namazu 升级至 2.0.10 或更高版本，该版本已修复 idxname 参数未正确过滤导致的跨站脚本漏洞。Red Hat Linux 7.0J 用户可通过 RHSA-2001:179-05 获取更新包（namazu-2.0.10-0j1）。如无法升级，在 Web 服务器层（如 Apache mod_rewrite）对 idxname 等 CGI 参数做输入校验，过滤 HTML 标签和特殊字符。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Namazu 2.0.9 跨站脚本漏洞"
updated = "2026-06-16T21:56:06.100"

