[basic]
description = "Net Tools PKI Server 存在访问控制漏洞，当 XUDA 模板文件中未使用绝对路径引用其他文件时，远程攻击者无需身份认证即可通过网络访问服务器，利用相对路径解析缺陷绕过访问限制，导致对目标系统文件的非授权修改。该漏洞影响 Net Tools PKI Server 相关版本，CVSS 评分 5.0，危害等级中等，攻击复杂度低，无需用户交互即可利用。"
published = "2000-06-19T04:00:00Z"
remediation = "立即从 ftp://ftp.tis.com/gauntlet/hide/pki/hotfix.txt 下载并安装 TIS 官方 hotfix，确保 XUDA 模板文件中所有引用路径均使用绝对路径。如无法获取补丁，应限制对 PKI Server 管理端口的网络访问（仅允许受信任 IP），并考虑迁移至仍在维护的 PKI 解决方案（如 OpenCA 或 EJBCA）以彻底消除风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Net Tools PKI Server 访问控制漏洞"
updated = "2026-06-16T21:51:55Z"

