[basic]
description = "Linux 内核中 dm9000 网络驱动程序的移除函数存在使用后释放（UAF）漏洞。dm 结构体是 netdev 私有数据，在调用 free_netdev() 后已失效，但代码中仍继续访问该数据，导致 UAF 条件。攻击者可通过本地权限利用此漏洞提升权限或造成拒绝服务。该漏洞影响包含受影响 dm9000 驱动代码的 Linux 内核版本。修复方案将 free_netdev() 调用移至函数末尾，确保私有数据在释放后不再被访问。"
published = "2025-02-27T02:15:15.167"
remediation = "升级 Linux 内核至已修复版本：Debian bullseye 升级到 linux 5.10.262-1 或更高；bookworm 升级到 6.1.180-1 或更高；trixie 升级到 6.12.100-1 或更高；Ubuntu 22.04 LTS 升级到 linux-image 5.15.0-1084.91 或更高；Ubuntu 20.04 LTS 升级到 5.4.0-1146.156 或更高；Ubuntu 18.04 LTS 升级到 4.15.0-2125.131 或更高。执行 `apt update && apt upgrade linux-image-*` 安装更新并重启。若无法立即升级，可在 GRUB 中禁用 davicom 驱动（添加 `dm9000.disable=1` 内核参数）作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "net: davicom: fix UAF in dm9000_drv_remove 漏洞"
updated = "2026-06-17T08:44:05.900"

