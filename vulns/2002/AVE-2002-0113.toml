[basic]
description = 'Linux/Unix 系统中的 "at" 守护进程（版本 3.1.8 等）存在堆损坏漏洞，本地用户可通过向 at 命令提交格式错误的执行时间参数，触发堆内存双重释放漏洞，导致堆元数据损坏并实现任意代码执行。该漏洞影响包含易受攻击 at 版本的 Linux/Unix 系统（如 Debian、Red Hat 等早期发行版），CVSS 评分 7.2（本地攻击、低复杂度、无需认证、完全影响机密性/完整性/可用性）。攻击者需具备本地账户权限，通过构造畸形时间参数（如格式化时间字符串）触发 at 守护进程在解析时发生堆双重释放，进而劫持控制流执行任意代码。Debian 已发布 DSA-102 安全公告修复该漏洞，建议升级 at 包至修复版本。'
published = "2002-02-27T05:00:00.000"
remediation = "升级到 GNU coreutils ≥ 8.4 的版本，其中包含 2000 年 6 月发布的 CVE-2002-0004 相关补丁。如使用旧版 Debian/Ubuntu，可通过 `apt-get install --reinstall --only-upgrade coreutils` 执行系统级强制升级，强制应用历史安全修补如 6.2.2.1 等版本。如在旧系统上无法直接在线升级，可通过编译 patch 文件应用特定补丁到源代码中，并重新安装。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "AT Formatted Time 堆溢出漏洞"
updated = "2026-06-16T21:56:34.437"

