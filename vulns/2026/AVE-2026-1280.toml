[basic]
description = "标签之间。<value>Fuji Tellus 软件在安装过程中向系统内核加载一个驱动组件，该驱动错误地配置了过于宽松的访问控制策略，授予所有本地用户对内核资源的完全读写权限。本地低权限攻击者无需身份验证或用户交互，即可利用该驱动程序执行任意内核级内存读写操作，实现权限提升并完全控制受影响系统。该漏洞影响运行 Fuji Tellus 的 Windows 平台，CVSS v3.1 评分 7.8，危害等级为高。"
published = "2026-05-12T23:16:19.023"
remediation = "立即联系 Fuji Electric 获取 Tellus 官方修复补丁并升级到已修复版本。如暂无法升级，应仅以管理员权限执行 Tellus 安装程序，阻止安装过程为所有用户赋予内核驱动读写权限；同时限制普通用户对 pcid64 驱动的访问，监控系统文件异常删除行为，降低本地提权风险。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "富士通 Tellus 内核驱动权限提升漏洞"
updated = "2026-07-21T15:57:23.293"

