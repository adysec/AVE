[basic]
description = "SV3C L-SERIES 高清网络摄像头 Web 管理界面存在开放重定向漏洞，受影响版本为 V2.3.4.2103-S50-NTD-B20170508B 和 V2.3.4.2103-S50-NTD-B20170823B。漏洞原理是摄像头 Web 界面在重定向用户时未验证目标 URL 的来源合法性，攻击者可构造恶意重定向链接诱导用户点击，将受害者重定向至钓鱼网站或恶意软件分发页面。攻击条件为：需用户交互（点击恶意链接）、网络可达摄像头 Web 界面、无需权限认证。利用方式为攻击者发送包含恶意重定向参数的 URL 给目标用户，用户点击后被重定向至攻击者控制的站点，可导致凭证窃取、恶意代码执行等后果。CVSS 3.0 评分 6.1（中危），CWE-601 分类。"
published = "2018-10-19T22:29:01Z"
remediation = "建议用户立即更新摄像头固件到最新可提供版本，如果无法更新，请在防火墙中禁用包含`/web/cgi-bin/hi3510/param.cgi`危险URL的访问，并对所有重定向URL进行源验证以防止开放重定向攻击。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "SV3C L-SERIES HD 摄像头 Web 界面开放重定向漏洞"
updated = "2026-06-17T01:38:09Z"

