[basic]
description = "Sambar Server 4.x 及 5.0 版本默认配置使用编译在二进制程序中的对称密钥对用户密码进行加密，本地攻击者可通过逆向分析该密钥或修改 Sambar 程序副本调用解密函数，从而破解所有用户密码。该漏洞影响 Sambar Server 5 及更早版本，攻击者获取密码后可进一步访问系统敏感资源，危害较大。官方未发布补丁，建议升级至更高版本或更换其他 Web 服务器软件。"
published = "2001-07-25T04:00:00Z"
remediation = "Sambar Server 已停止维护且不再发布安全更新，建议立即迁移至 Apache HTTP Server、Nginx 或 IIS 等仍在维护的 Web 服务器。如暂时无法迁移，可在 Sambar Server 前部署反向代理（如 Nginx）处理身份认证，并在防火墙层面限制对 Sambar 管理端口的访问来源 IP，同时禁用所有默认账户并改用外部认证机制（如 LDAP）替代内置密码存储。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Sambar Sambar Server 默认密码保护漏洞"
updated = "2026-06-16T21:55:35Z"

