[basic]
description = "WatchGuard Firebox II 4.1 与 4.5 版本存在拒绝服务漏洞，其 FTP 代理和 SMTP 代理服务在处理客户端请求时缺乏对并发连接数量及请求速率的有效限制。未经身份认证的远程攻击者可通过向目标设备的 FTP 或 SMTP 代理服务持续发送大量请求，使代理服务资源被耗尽，导致正常的代理转发功能被禁用，合法用户无法通过设备进行网络访问。该漏洞影响运行受影响版本固件的 WatchGuard Firebox II 防火墙设备，攻击者无需任何凭据即可在任意网络位置发起攻击，CVSS 评分为 5.0，危害等级为低。攻击者仅需编写脚本或使用工具持续向目标设备的 FTP（21 端口）或 SMTP（25 端口）代理服务发起高频率连接请求即可触发拒绝服务。WatchGuard 官方已在补丁页面发布修复固件，建议用户升级至最新版本以消除该安全风险。"
published = "2001-01-09T05:00:00Z"
remediation = "立即升级 WatchGuard Firebox II 固件到最新版本，安装安全补丁以修复服务洪水漏洞。同时，启用服务级别的限流和连接速率限制功能，配置 FTP 及 SMTP 服务最大连接数和请求频率限制。此外，通过 WAN 聚合与负载均衡技术实现多链路抗攻击能力；必要时通过防火墙规则屏蔽异常集中来源 IP，并在边缘路由设备部署 SYN cookie等紧急缓解措施作为临时防护。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "WatchGuard Firebox II 拒绝服务漏洞"
updated = "2026-06-16T21:53:19Z"

