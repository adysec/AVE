[basic]
description = "tags.<value>Network Associates WebShield SMTP 4.5 存在邮件地址处理缺陷，远程攻击者可通过发送 From: 地址以句号（.）结尾的特制电子邮件触发该漏洞，导致 WebShield 持续向自身发送邮件副本，形成拒绝服务。该漏洞无需身份认证即可利用，影响运行 WebShield SMTP 4.5 的邮件服务器，造成服务不可用。"
published = "2000-10-20T04:00:00.000"
remediation = "建议立即升级至 McAfee Security for Microsoft Exchange 或其他现代邮件网关产品，Network Associates WebShield SMTP 4.5 已停止支持且无官方补丁。临时缓解措施：在邮件网关或防火墙层面配置规则拦截 From: 地址以句点(.)结尾的邮件，或在 SMTP 网关配置拒绝以点号结尾的发件人地址，防止邮件循环导致拒绝服务。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Network Associates WebShield SMTP 拒绝服务漏洞"
updated = "2026-06-16T21:52:22.790"

