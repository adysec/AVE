[basic]
description = 'BOA Web Server 0.94.8.2 及更早版本存在目录遍历漏洞，远程攻击者可通过向服务器发送特制的 GET 请求，使用 "%2E" 替代 "." 绕过路径过滤，实现任意文件读取。该漏洞影响 BOA Web Server 0.94.8.2 及之前版本，攻击者无需身份认证即可利用，可读取服务器上的敏感文件如 /etc/passwd 等。Exploit-DB 已公开该漏洞的利用方法。'
published = "2000-12-19T05:00:00Z"
remediation = "将 BOA Web Server 升级至 0.94.14.1 或更高版本，该版本修复了 %2E 编码绕过导致的目录遍历问题。具体操作：从 https://www.boa.org/ 下载最新源码，执行 ./configure && make && make install 完成升级。如无法升级，可在 Web 服务器前部署反向代理（如 Nginx），配置规则拦截包含 %2E 或连续点号的 GET 请求路径；或在 iptables 层面限制对 80 端口的非必要来源访问作为临时缓解。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "BOA Web Server 目录遍历漏洞"
updated = "2026-06-16T21:52:46Z"

