[basic]
description = "Linux 内核的 Intel-ish-HID 驱动存在释放后使用（use-after-free）漏洞。当系统卸载该驱动时，`ishtp_hid_remove()` 函数会在销毁 HID 设备的循环中直接释放 `driver_data` 内存，而 `hid_destroy_device()` 在调用 `hid_ishtp_set_feature()` 关闭传感器电源时仍会使用该内存，导致访问已释放的内存区域。拥有本地访问权限的攻击者可在驱动被移除后的几分钟内触发此漏洞，造成系统随机崩溃或导致权限提升。该漏洞影响搭载 Intel-ish-HID 传感器 hub 的 Linux 系统，CVSS v3.1 评分 7.8，危害等级为高。Linux 内核社区已通过将 `driver_data` 存储在临时变量中、延迟释放内存的方式修复此问题。"
published = "2025-04-01T16:15:23Z"
remediation = "建议将 Linux 内核升级至已修复版本：5.4.291、5.10.235、5.15.179、6.1.131、6.6.83、6.12.19 或 6.13.7 及之后版本。可通过各发行版官方包管理器（如 apt、yum、dnf）安装对应安全更新。如暂时无法升级，可通过 modprobe 命令卸载 intel-ish-hid 驱动模块（rmmod intel-ish-hid）作为临时缓解措施，但会导致 ISH（Integrated Sensor Hub）相关传感器功能不可用。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 Intel ISH-TP HID 驱动 use-after-free 漏洞"
updated = "2026-06-17T08:44:38Z"

