[basic]
description = 'IBM WebSphere Application Server 2.0/3.0/3.0.2.1 存在源代码泄露漏洞（Showcode）。远程攻击者无需认证即可通过向 InvokerServlet 发送包含 "/servlet/file" 字符串的特制 URL，直接读取 JSP、Servlet 等可执行 Web 文件的源代码。该漏洞可导致敏感业务逻辑、数据库连接凭证等关键信息泄露，为后续攻击提供跳板。攻击条件低，仅需目标开放默认 Servlet 端口即可利用。'
published = "2000-07-24T04:00:00Z"
remediation = '升级 IBM WebSphere Application Server 至 3.5 及以上版本，或禁用默认的 InvokerServlet（在 web.xml 中注释或删除 InvokerServlet 映射）。如无法升级，可在 Web 服务器或反向代理层配置 URL 访问控制规则，拦截包含 "/servlet/file" 的请求路径。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "IBM WebSphere Application Server 源代码泄露漏洞"
updated = "2026-06-16T21:52:11Z"

