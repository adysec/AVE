[basic]
description = "Telindus 1100 系列 ADSL 路由器存在管理密码泄漏漏洞，远程攻击者无需身份认证即可向目标设备的 UDP 9833 端口发送特制数据包，设备将以明文形式回复包含路由器管理密码及其他敏感信息的响应数据。攻击者获取密码后可完全控制路由器，修改网络配置或实施进一步攻击。该漏洞影响 Telindus 1100 系列所有固件版本，CVSS 评分 7.5，危害等级高。厂商未发布官方补丁，建议通过防火墙限制 UDP 9833 端口的访问权限进行缓解。"
published = "2002-10-04T04:00:00.000"
remediation = "Telindus 1100 系列 ADSL 路由器已停止支持，无官方补丁。立即在边界防火墙上阻断 UDP 端口 9833 的入站流量，防止攻击者远程获取设备管理密码。同时将设备管理 Web/Telnet 接口限制在可信内网 IP 范围内，避免暴露于公网。长期建议更换已停止安全支持的旧型号设备。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Telindus 1100系列ADSL路由器管理密码泄露漏洞"
updated = "2026-06-16T21:58:26.673"

