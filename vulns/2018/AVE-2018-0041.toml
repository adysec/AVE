[basic]
description = "Nagios XI 5.4.13 之前的版本（包括 5.2.x 及小于 5.4.13 的 5.4.x）中，admin/info.php 文件的 key1 参数存在 SQL 注入漏洞。攻击者需具备管理员权限，通过构造恶意的 key1 参数值向数据库发送恶意 SQL 查询，可获取敏感信息或篡改数据库内容。该漏洞影响 Nagios XI 监控平台，CVSS 评分 7.2，危害等级为高危。"
published = "2018-05-16T13:29:00Z"
remediation = "建议将 Nagios XI 升级至 5.4.13 或更高版本以修复此漏洞。如暂无法升级，可临时移除或限制对 admin/info.php 页面的访问权限，仅允许可信网络地址访问，并在 Web 应用防火墙（WAF）中对该页面的 key1 参数进行过滤或拦截。"
score = 7.2
severity = "HIGH"
sources = ["nuclei"]
title = "Nagios XI SQL注入漏洞"
updated = "2026-06-17T01:34:36Z"

