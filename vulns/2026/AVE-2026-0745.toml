[basic]
description = "AWS AgentCore CLI 存在代码注入漏洞，源于 `agentcore add agent --type import` 命令在生成 Python 代码时对 Bedrock Agent 协作指令的三引号转义处理不当。攻击者可构造包含三重双引号的 collaborationInstruction 值，打破字符串边界并注入任意 Python 代码。该漏洞影响 @aws/agentcore 0.4.0-0.14.1 及预览版 0.3.0-preview.7.0-1.0.0-preview.8。需具备 bedrock:AssociateAgentCollaborator 权限的认证 AWS 用户可关联恶意协作 Agent，开发者导入并运行 `agentcore dev` 或 `agentcore deploy`/`invoke` 时将触发代码执行，分别在本地凭证和 Agent IAM 角色下运行。CVSS 8.8 高危，建议升级至 0.14.2 或 1.0.0-preview.9 并重新生成部署代码。"
published = "2026-06-08T19:16:41Z"
remediation = "建议立即升级 AgentCore CLI 至 v0.14.2 或 preview 版 1.0.0-preview.9（命令：npm install -g @aws/agentcore@latest）。升级后必须删除已导入的受影响 agent，重新运行 `agentcore add agent --type import` 重新生成干净的 main.py，并执行 `agentcore deploy` 重新部署至 AWS。如无法立即升级，可作为临时缓解手动检查生成的 main.py 中的 collaborationInstruction 字段，将所有三重双引号序列替换为转义等价字符后再运行 dev 或 deploy。"
score = 8.8
severity = "HIGH"
sources = ["ghsa"]
title = "Amazon AgentCore CLI 代码注入漏洞"
updated = "2026-07-23T08:10:00Z"

