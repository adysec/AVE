[basic]
description = "WordPress 的 JSmol2WP 插件 1.07 版本中存在任意文件读取漏洞，攻击者可通过 jsmol.php 的 query 参数传入 `php://filter/resource=../` 目录遍历序列，读取服务器上任意文件。该漏洞还可被用于服务端请求伪造（SSRF）攻击。攻击无需身份认证，可远程利用，导致敏感信息泄露。建议升级插件至最新版本或禁用该插件。"
published = "2018-12-25T21:29:00Z"
remediation = "立即停用 JSmol2WP 插件并升级到最新版本（若官方已修复）；如无安全版本，直接删除该插件。临时缓解措施：在 Web 服务器（如 Nginx/Apache）配置中禁用对 `jsmol.php` 的 `query` 参数的 `php://` 流访问，或限制 `jsmol.php` 的 URL 访问权限。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress JSmol2WP 插件目录遍历任意文件读取漏洞"
updated = "2026-06-17T01:52:53Z"

