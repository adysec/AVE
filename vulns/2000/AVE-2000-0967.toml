[basic]
description = "UnixWare 7 的 scohelphttp Web 服务器中的 search97cgi/vtopic CGI 程序存在路径遍历漏洞。远程攻击者无需身份认证即可通过向目标服务器发送包含 `..`（点点）序列的特制 HTTP 请求，突破路径限制读取服务器上的任意文件，导致敏感信息泄露。该漏洞影响 UnixWare 7 操作系统，CVSS 评分 5.0，危害等级中等。厂商未提供官方补丁，建议禁用相关 CGI 组件或限制访问权限。"
published = "2000-11-14T05:00:00.000"
remediation = "立即停止或禁用 UnixWare 7 上的 scohelphttp 文档 Web 服务，可通过停止对应的 HTTP 服务进程或在防火墙中阻断对外暴露的 80 端口访问。若业务仍需使用该服务，应升级 UnixWare 7 至最新维护补丁集（Maintenance Pack），SCO 安全公告 SCOCERT-2000-09-11 中已针对 search97cgi 路径遍历漏洞发布修复补丁。对于已不再维护的 UnixWare 7 系统，建议迁移至受支持的操作系统平台，并在迁移前通过网络层 ACL 限制对受影响服务的访问权限。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "SCO UnixWare scohelphttp 路径遍历任意文件读取漏洞"
updated = "2026-06-16T21:52:34.843"

