[basic]
description = "Bugzilla 2.14 之前版本存在敏感信息泄露漏洞，用户名和密码被直接包含在 URL 中。远程攻击者可通过读取 Web 服务器日志文件获取这些凭证，或通过肩窥（shoulder-surfing）观察浏览器地址栏直接窃取登录信息，从而获得系统管理员权限。该漏洞影响所有 Bugzilla 2.14 之前版本，攻击复杂度低，无需身份认证即可利用，CVSS 评分 7.5，危害等级高。"
published = "2001-09-10T04:00:00Z"
remediation = "立即升级 Bugzilla 至 2.14 或更高版本（2.14 已修复密码出现在 URL 中的问题）。升级后运行 checksetup.pl 完成数据库迁移，并确保 Apache 已启用 .htaccess（checksetup.pl 默认生成）以阻止对 data/ 目录和 localconfig 文件的未授权访问。同时清理现有 Web 服务器日志中可能已泄露的 URL 记录，并强制所有用户修改密码。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Mozilla Bugzilla 权限提升漏洞"
updated = "2026-06-16T21:56:12Z"

