[info]
author = "ave"
description = "Apache Tomcat 3.x/4.x JSP 引擎在处理 WPrinterJob().pageSetup(null,null) 调用时存在拒绝服务漏洞。拥有 Web 页面发布权限的攻击者可通过部署包含恶意 JSP 代码的页面触发引擎崩溃。PoC JSP 代码来自 ExploitDB 21534。"
id = "POC-AVE-2002-0480"
name = "Apache Tomcat JSP Engine DoS PoC"
severity = "medium"
tags = ["ave-2002-0480"]
vuln_id = [
    "CVE-2002-0936",
    "AVE-2002-0480",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc_cve_2002_0936.jsp"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "500",
    "Error",
    "Exception",
    "Unavailable",
]
