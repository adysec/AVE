[basic]
description = "O'Reilly WebSite Professional Web 服务器 2.4 及更早版本存在缓冲区溢出漏洞，远程攻击者可通过向目标服务器发送超长 GET 请求或 Referrer 头部触发缓冲区溢出，导致任意代码执行。该漏洞无需身份认证即可远程利用，攻击复杂度低，可完全控制受影响系统。由于该 Web 服务器常用于托管商业网站，攻击者可借此植入后门、窃取数据或发起进一步攻击。目前厂商已停止维护该产品，建议用户迁移至其他受支持的 Web 服务器软件。"
published = "2000-07-17T04:00:00Z"
remediation = "O'Reilly WebSite Professional 已停止维护，官方未发布安全补丁。建议立即迁移至受支持的 Web 服务器（如 Apache HTTP Server、Nginx 或 IIS）。临时缓解措施：在反向代理或防火墙层限制 HTTP 请求行和 Referer 头长度不超过 1024 字节，并部署 WAF 规则拦截超长请求。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "O'Reilly WebSite Professional 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:07Z"

