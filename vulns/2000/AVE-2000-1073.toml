[basic]
description = "标签中。<value>Poll It 2.01 及更早版本中的 pollit.cgi 脚本存在信息泄露漏洞。由于该脚本使用的数据文件被存储在 Web 服务器文档根目录下，未经身份认证的远程攻击者无需任何凭据即可直接通过 HTTP 请求访问这些文件，从而泄露应用程序的敏感配置数据或用户私有信息。该漏洞影响使用 Poll It 2.01 及之前版本的网站，攻击者只需构造针对 pollit.cgi 相关数据文件的 URL 即可读取敏感内容，造成信息泄露风险。"
published = "2000-12-11T05:00:00.000"
remediation = "1. 将 pollit_files 目录从 Web 文档根目录迁移到 Web 无法直接访问的目录（如 /var/lib/pollit_files），并在 pollit.cgi 中修改 $poll_options 等变量指向新的绝对路径；2. 对数据文件设置 640 权限，确保 Web 服务器用户可读写但禁止外部直接访问；3. 如无法迁移文件，可在 Web 服务器配置中添加 <Files> 或 location 规则禁止直接访问 pollit_files 目录下的所有文件；4. 建议升级到 Poll It 后续版本，或替换为更安全的 CGI 投票程序。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Poll It pollit.cgi 信息泄露漏洞"
updated = "2026-06-16T21:53:05.393"

