[basic]
description = "Microsoft Windows 98/NT 4.0/2000/XP 的域名解析器默认配置将 QueryIpMatching 参数设置为 0，导致系统会接受来自未查询主机的 DNS 更新响应，未经身份认证的远程攻击者可通过向目标系统发送伪造的 DNS 响应数据包实施 DNS 缓存投毒攻击，将合法域名解析指向恶意 IP 地址，进而实现中间人攻击、钓鱼或恶意软件分发。该漏洞影响 Windows 98/NT 4.0/2000/XP 等广泛使用的操作系统版本，CVSS 评分 9.8，危害等级严重。"
published = "2000-04-14T04:00:00.000"
remediation = '在受影响系统（Windows 98/NT 4.0/2000/XP）中，打开注册表编辑器，定位到 HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters，新建 DWORD 值 QueryIpMatching 并设为 1，使 DNS 解析器仅接受来自已查询 DNS 服务器的响应，防止 DNS 缓存投毒。同时建议部署 DNSSEC 或 IPSec 对 DNS 流量进行加密验证，并在网络边界防火墙限制仅允许与可信 DNS 服务器通信。'
score = 9.8
severity = "CRITICAL"
sources = ["epss"]
title = "Microsoft Windows DNS 缓存投毒漏洞"
updated = "2026-06-16T21:53:24.263"

