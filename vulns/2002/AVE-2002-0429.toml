[basic]
description = "Samba 2.2.5 之前版本中存在缓冲区溢出漏洞，由于 enum_csc_policy 数据结构未正确终止，远程攻击者可通过向 Samba 服务发送特制请求触发缓冲区溢出，导致任意代码执行。该漏洞影响 Samba 2.2.5 之前的所有版本，攻击者无需身份认证即可远程利用，CVSS 评分 7.5，危害等级高。建议升级至 Samba 2.2.5 或更高版本以修复此漏洞。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 Samba 至 2.2.5 或更高版本，该版本已修复 enum_csc_policy 数据结构未正确终止导致的缓冲区溢出漏洞。如无法立即升级，可在 smb.conf 中禁用相关 RPC 服务或通过防火墙限制 SMB 端口（139/TCP、445/TCP）的访问来源 IP。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Samba 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T22:00:49Z"

