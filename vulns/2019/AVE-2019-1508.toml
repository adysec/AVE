[basic]
description = 'QNAP NAS 设备上运行的 Photo Station 存在路径遍历漏洞（CWE-22），未经身份认证的远程攻击者可通过构造包含目录遍历序列（如 "../"）的特殊请求参数，绕过应用程序的文件路径限制，从而访问或修改设备上的任意系统文件。该漏洞影响搭载 QTS 4.2.6、4.3.0–4.3.3、4.3.4–4.4.0 及 4.4.1 系统且 Photo Station 版本低于 5.2.11、5.4.9、5.7.10 或 6.0.3 的 QNAP 网络存储设备。攻击者无需登录凭据即可在无需用户交互的情况下远程利用此漏洞，成功利用后可读取敏感配置文件、窃取凭证或进一步植入恶意程序导致远程代码执行。该漏洞已被美国 CISA 列入已知被利用漏洞目录（KEV），且确认在勒索软件攻击活动中被实际利用，CVSS v3.1 评分为 9.8（严重等级）。建议用户立即将 Photo Station 升级至 QNAP 官方发布的最新版本以修复此漏洞。'
published = "2019-12-05T17:15:13Z"
remediation = "登录 QTS 管理界面，进入控制面板 > 系统 > 固件更新，将 QTS 更新至 4.4.1 build 20190918 或更高版本。随后打开 App Center，搜索 Photo Station 并更新至对应修复版本：QTS 4.4.1 用户更新至 Photo Station 6.0.3，QTS 4.3.4–4.4.0 更新至 5.7.10，QTS 4.3.0–4.3.3 更新至 5.4.9，QTS 4.2.6 更新至 5.2.11。如暂无法更新，应临时关闭 Photo Station 服务以降低路径遍历攻击风险。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "QNAP Photo Station 路径遍历漏洞"
