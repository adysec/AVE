[basic]
description = "Pagy 宝石的 I18n 模块在设置 locale 参数时未对输入进行合法性校验，直接将用户提供的值作为文件路径组件拼接并读取对应的 YAML 字典文件。攻击者可通过构造包含 `../` 路径遍历序列或绝对路径的 locale 参数，使应用加载并解析任意服务器端 YAML 文件（如配置文件 database.yml），从而建立文件存在性与可读性的探测信道，并实现服务器端文件内容读取。该漏洞影响所有将不受信任的终端用户输入直接赋值给 `Pagy::I18n.locale=` 的 Ruby 应用，而使用可信来源设置 locale 的应用不受影响。CVSS 评分为 6.9（中等），已于 pagy 43.5.6 版本中通过限制 locale 必须符合 BCP 47 格式的方式修复。"
published = "2026-07-28T23:17:09Z"
remediation = '立即升级 pagy gem 至 43.5.6 或更高版本，该版本在 `Pagy::I18n.locale=` setter 中增加了 BCP 47 正则校验，阻止 `../` 和绝对路径等非法值。若暂时无法升级，请在赋值前对用户输入进行正则过滤：`Pagy::I18n.locale = params[:locale].to_s[/\A[a-zA-Z]{2,8}(-[a-zA-Z0-9]{1,8})*\z/]`，或仅允许赋值给预设的受信任 locale 列表（如 `I18n.available_locales`），拒绝任何不在列表中的值。'
score = 6.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "Pagy I18n locale 路径遍历信息泄露漏洞"
updated = "2026-07-29T13:19:00Z"

