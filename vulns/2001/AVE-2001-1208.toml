[basic]
description = "mailnews.cgi 1.3 及更早版本存在远程命令注入漏洞，攻击者无需身份认证即可通过 HTTP 请求向程序提交包含 shell 元字符（如分号、管道符、反引号等）的用户名参数，触发程序将恶意输入直接传递给系统 shell 执行任意系统命令。该漏洞影响使用 mailnews.cgi 的所有 Web 服务器，CVSS v2 评分为 10.0，危害等级为严重。攻击者利用该漏洞可完全控制目标服务器，获取敏感数据、篡改内容或进一步横向移动。由于该 CGI 程序通常部署在 Internet 可达的 Web 服务上，攻击门槛极低，仅需构造一个包含恶意字符的用户名即可完成利用，且无需用户交互或特殊权限。建议管理员立即升级至安全版本或在 Web 服务器层面对该 CGI 程序的输入进行严格过滤与权限隔离。"
published = "2001-05-03T00:00:00Z"
remediation = "升级 mailnews.cgi 至 1.4 或更高版本，该版本已修复用户名参数中 shell 元字符注入漏洞。若无法立即升级，应在程序中严格过滤用户名字段，移除或转义分号、管道符、反引号等 shell 元字符，并通过 Web 服务器配置限制该 CGI 脚本仅允许本地访问，或临时禁用 mailnews.cgi 作为缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "mailnews.cgi mailnews.cgi 代码执行漏洞"
updated = "2001-05-03T00:00:00Z"

