[basic]
description = "Oracle MySQL Server 的 InnoDB 存储引擎组件存在拒绝服务漏洞。受影响的版本包括 8.0.40 及更早版本、8.4.3 及更早版本、9.1.0 及更早版本。该漏洞易于利用，具有高权限且可通过多种网络协议访问 MySQL Server 的远程攻击者，可通过向服务器发送特制请求触发该漏洞，成功利用后可能导致 MySQL Server 进程挂起或频繁崩溃，造成完全拒绝服务（DOS），影响数据库的正常可用性。CVSS 3.1 基础评分为 4.9（中等严重程度）。"
published = "2025-01-21T21:15:13.703"
remediation = "建议立即升级 Oracle MySQL Server 到官方发布的最新安全补丁版本。对于受影响的 8.0.40、8.4.3 和 9.1.0 系列，建议升级至 8.0.41 及以上版本，或 8.4.4 及以上版本，或 9.1.1 及以上版本。如无法立即升级，可通过限制高权限用户网络访问或在防火墙中封锁多个协议端口作为临时缓解措施，以降低攻击者利用此漏洞导致服务崩溃的风险。"
score = 4.9
severity = "MEDIUM"
sources = ["msrc"]
title = "Oracle MySQL Server 拒绝服务漏洞"
updated = "2026-06-17T08:43:36.707"

