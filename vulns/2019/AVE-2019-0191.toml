[basic]
description = "Nortek Security & Control Linear eMerge E3-Series 门禁控制系统存在反射型跨站脚本（XSS）漏洞（CWE-79）。该设备的 `badging/badge_template_v0.php` 页面未对 `layout` 参数进行充分过滤和转义，未经身份认证的远程攻击者可构造包含恶意 JavaScript 代码的特制 URL，诱使管理员或用户点击访问，从而在受害者浏览器中执行任意脚本。该漏洞影响 eMerge E3 固件版本 1.00-06，攻击者可利用此漏洞窃取会话令牌、篡改页面内容或进行钓鱼攻击。攻击需要用户交互（点击链接），且目标设备需通过互联网或内部网络可达。CVSS 评分 6.1，危害等级中等。建议用户联系厂商获取修复补丁或升级到安全版本。"
published = "2019-07-02T19:15:11Z"
remediation = "建议立即升级 Nortek Linear eMerge E3-Series 固件至 1.00-07 或更高版本（通过 Nice/Linear 官方支持渠道获取）。如暂时无法升级，可在网络层面限制设备 Web 管理界面仅允许受信任 IP 访问，并在 Apache/Nginx 配置中禁用 /badging/badge_template_v0.php 接口或部署 WAF 拦截 layout 参数中的脚本载荷。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Nortek Security & Control Linear eMerge E3-Series 跨站脚本漏洞"
updated = "2026-06-17T02:40:19Z"

