[basic]
description = "Oracle Internet Application Server (IAS) 3.0.7 及更早版本中的 mod_sql 模块存在 SQL 注入漏洞。远程攻击者无需身份认证即可通过向 URL 查询字符串中注入特制的 SQL 语句，利用该漏洞执行任意 SQL 命令，进而导致数据库敏感信息泄露、数据篡改或绕过访问控制。攻击条件简单，仅需目标系统开放 HTTP 服务且使用受影响版本。"
published = "2000-12-31T05:00:00Z"
remediation = "立即升级 Oracle Internet Application Server 至 3.0.7 以上版本（若厂商已发布补丁），或迁移至 Oracle 当前支持的 Web 服务器产品（如 Oracle HTTP Server 或 WebLogic Server）。如无法升级，在 mod_sql 模块前部署 Web 应用防火墙（WAF）过滤恶意 SQL 注入载荷，并对所有用户输入进行参数化查询或严格转义处理。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Oracle Internet Application Server mod_sql SQL注入漏洞"
updated = "2026-06-16T21:53:26Z"

