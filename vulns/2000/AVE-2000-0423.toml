[basic]
description = 'Linux 内核 2.2.16 之前版本中的 "capabilities"（能力）机制存在权限提升漏洞。本地攻击者可通过设置 capabilities（使用 setcap 等机制）阻止 setuid 程序正常降权，导致拒绝服务或获取提升后的特权，即 "Linux kernel setuid/setcap vulnerability"。该漏洞影响 Linux Kernel 2.2.x 系列、2.4.0-test1 及 SGI ProPack 1.2/1.3 等发行版，CVSS 评分 10.0（严重），向量 AV:N/AC:L/Au:N/C:C/I:C/A:C，攻击向量为网络、攻击复杂度低、无需认证、完全影响机密性/完整性/可用性。本地攻击者利用该漏洞可绕过 setuid 程序的权限降低机制，实现权限提升或拒绝服务攻击。'
published = "2000-06-09T04:00:00Z"
remediation = "建议立即升级 Linux 内核至 2.2.16 或更高版本（2.2.x 分支）或升级至 2.4.x 稳定版本。SGI ProPack 用户请升级至 1.4 或更高版本（内核 ≥ 2.2.16）。若无法立即升级内核，可作为临时缓解措施：1) 移除不需要的 setuid 程序；2) 使用 chmod 移除不必要的 setuid 位；3) 限制本地用户登录权限；4) 监控异常 setuid 进程行为。Sendmail 用户请升级至 8.11 以上版本并禁用不必要的 capabilities 功能。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Linux 内核 Capabilities 权限提升漏洞"
updated = "2026-06-16T21:51:52Z"

