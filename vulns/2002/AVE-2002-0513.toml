[basic]
description = "BadBlue 1.7.3 版本存在空字节文件泄漏漏洞，其原理是服务器在处理 HTTP 请求时未正确过滤十六进制编码的空字节（%00），导致攻击者可绕过文件扩展名检查读取受限文件（如 EXT.INI 配置文件）。该漏洞影响 Working Resources BadBlue 1.7.3 版本，CVSS 评分 5.0（中等危害），攻击向量为网络远程、低复杂度、无需认证。攻击者仅需发送包含 %00 的特制 HTTP 请求即可利用，例如请求 ext.ini%00.txt 来读取敏感配置信息，造成信息泄露风险。"
published = "2002-10-04T04:00:00.000"
remediation = """
The user wants me to generate a remediation field for CVE-2002-1021. This is a vulnerability in BadBlue server 1.7.3 that allows reading restricted files via a hex-encoded null byte. I need to provide actionable Chinese remediation steps ≥20 characters.

Based on the presearch data:
- BadBlue 1.7.3 is affected
- The vulnerability is a null byte file disclosure
- No specific patch version is mentioned in the data
- The product is from 2002, likely discontinued

I need to write specific, actionable remediation steps in Chinese.<value>立即将 BadBlue 服务器升级至 1.7.3 以上版本（如官方已停止维护，建议迁移至其他受支持的 Web 服务器如 Apache 或 Nginx）。若无法升级，可在反向代理或 WAF 层拦截包含 `%00`（URL 编码空字节）的 HTTP 请求，并严格限制对 EXT.INI 等敏感文件的直接访问。同时配置 Web 服务器对 URL 中的空字节字符进行过滤或拒绝，防止路径遍历绕过。"""
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Working Resources BadBlue 空字节文件泄漏漏洞"
updated = "2026-06-16T21:58:34.810"

