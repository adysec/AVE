[basic]
description = "WordPress Sender 插件 1.2.1 之前版本存在多个跨站脚本（XSS）漏洞，该插件未能正确过滤用户输入数据，导致攻击者可在页面中注入恶意 JavaScript 脚本。攻击者可通过构造特制的 HTTP 请求将恶意载荷提交至受影响页面，当管理员或其他用户访问时触发脚本执行，造成敏感信息泄露（如会话令牌、Cookie 等）。该漏洞无需身份认证即可利用，但需要用户交互（如点击链接），影响数据的机密性和完整性。"
published = "2019-08-21T18:15:11Z"
remediation = "立即将 WordPress Sender 插件升级至 1.2.1 或更高版本（当前最新版 1.4.1），在 WordPress 后台「插件」页面找到 Sender 点击更新即可。如无法升级，可暂时停用该插件，并启用 WordPress 内置的 wp_kses 对用户输入进行 HTML 过滤作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress sender插件跨站脚本漏洞"
updated = "2026-06-17T01:13:06Z"

