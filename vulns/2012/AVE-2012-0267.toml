[basic]
description = "Apple Safari 6.0 之前的版本所使用的 WebKit 渲染引擎存在内存破坏漏洞。远程攻击者可构造恶意网页，诱使用户使用受影响版本的 Safari 浏览器访问该网页，从而触发内存损坏，实现远程代码执行或导致浏览器应用程序崩溃。该漏洞影响 Safari 5.x 等早期版本，攻击无需身份认证，攻击复杂度中等，利用成功率较高，CVSS 评分 9.3，危害等级严重。用户访问攻击者控制的特制网站即可触发漏洞。"
published = "2012-07-25T20:55:01Z"
remediation = "将 Apple Safari 升级至 6.0 或更高版本，该版本随 OS X Lion v10.7.4 及 OS X Lion Server v10.7.4 一起发布，修复了 WebKit 中的多处内存破坏问题。用户可通过 Mac App Store 或系统软件更新获取 Safari 6.0。如暂无法升级，建议暂时避免访问不可信的网站，并在 Safari 偏好设置中禁用 JavaScript 作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:31Z"

