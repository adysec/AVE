[basic]
description = 'Trend Micro InterScan VirusWall 在安装时创建了一个名为 "Intscan" 的共享目录，该目录指向 "InterScan" 路径并赋予 Everyone 组完全控制权限。攻击者利用此权限缺陷可修改 VirusWall 程序文件，从而提升自身权限并获取系统控制权。该漏洞影响 Trend Micro InterScan VirusWall 产品，CVSS 评分为 4.6，属于本地权限提升漏洞。攻击者需具备本地访问权限才能利用此漏洞修改共享目录中的程序文件以实现权限提升。'
published = "2001-01-09T05:00:00.000"
remediation = '删除或重命名"Intscan"共享目录，移除Everyone组的完全控制权限；通过Windows NTFS ACL将InterScan目录权限收紧为仅管理员和系统账户可修改；安装Trend Micro发布的InterScan VirusWall最新安全补丁以修复默认共享权限配置。'
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "趋势科技 InterScan VirusWall 权限提升漏洞"
updated = "2026-06-16T21:53:09.607"

