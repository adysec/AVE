[info]
author = "AVE"
description = "检测 Unix 区域设置子系统中的格式化字符串漏洞，gettext/catopen 函数未正确过滤用户注入的格式化字符串，可导致本地任意命令执行"
id = "POC-AVE-2000-0625"
name = "CVE-2000-0844 PoC"
severity = "high"
tags = ["cve-2000-0844"]
vuln_id = [
    "CVE-2000-0844",
    "AVE-2000-0625",
]

[poc]
logic = "any"

[[poc.requests]]
path = "/etc/locale.conf"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["LANG"]
