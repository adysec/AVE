[basic]
description = "SapporoWorks WinProxy 2.0 及 2.0.1 版本的 HTTP 代理服务组件存在拒绝服务漏洞。远程攻击者无需身份认证即可通过发送一个不包含 HTTP 版本号的畸形 GET 请求触发该漏洞，导致代理服务进程崩溃，停止响应正常请求。攻击者只需具备网络访问能力，无需任何权限或用户交互，即可反复利用该漏洞造成服务持续不可用。该漏洞影响 WinProxy 2.0 和 2.0.1 版本，CVSS 评分 5.0，危害等级中危。"
published = "2000-06-27T04:00:00Z"
remediation = "WinProxy 2.0 和 2.0.1 已停止维护，官方未发布补丁。建议立即卸载 WinProxy，迁移至仍受支持的代理服务器软件（如 Squid、HAProxy 等）。如无法立即替换，可在防火墙或网络边界配置规则，仅允许可信源 IP 访问代理服务的 HTTP 端口（默认 80/8080），以降低被攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "SapporoWorks WinProxy HTTP服务拒绝服务漏洞"
updated = "2026-06-16T21:52:04Z"

