[basic]
description = "WebActive HTTP Server 1.00 默认配置将 Web 访问日志文件 active.log 存储在网站文档根目录下，远程攻击者无需身份认证即可通过直接请求该日志文件路径获取敏感信息。该漏洞属于信息泄露类型，攻击者可通过分析日志内容获取访问记录、IP 地址等敏感数据，影响 WebActive HTTP Server 1.00 版本。"
published = "2000-07-12T04:00:00Z"
remediation = "将 WebActive HTTP Server 的日志文件 active.log 移出网站根目录（document root），存放至非 Web 可访问的目录（如 /var/log/webactive/）；同时配置 Web 服务器禁止直接访问 .log 后缀文件，可通过在配置文件中添加拒绝规则实现。由于该产品已停止维护，建议迁移至受支持的 HTTP 服务器（如 Apache、Nginx）以避免后续安全风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "WebActive HTTP Server 日志信息泄露漏洞"
updated = "2026-06-16T21:52:10Z"

