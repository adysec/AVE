[basic]
description = "vixie-cron 在执行 crontab -e 命令时，使用可预测的临时文件名且未正确验证文件所有者权限。本地用户若对 crontab spool 目录具有写访问权限，可创建全局可写的临时文件，并在受害者编辑文件时修改其内容，从而以受害者权限执行任意命令。该漏洞影响使用 vixie-cron 的 Unix/Linux 系统，CVSS 评分为 3.7（低危），攻击条件为本地访问且具备 spool 目录写权限。"
published = "2001-01-09T05:00:00.000"
remediation = "立即升级 vixie-cron 至 4.1 或更高版本，该版本修复了临时文件命名可预测及文件属主校验缺失问题。如无法立即升级，可临时缓解：将 crontab spool 目录（如 /var/spool/cron/crontabs）权限收紧为仅 root 可写（chmod 700），并限制本地用户对 spool 目录的写访问权限，防止攻击者创建世界可写的临时文件进行权限提升。"
score = 3.7
severity = "LOW"
sources = ["avd"]
title = "Vixie Cron 本地权限提升漏洞"
updated = "2026-06-16T21:53:08.263"

