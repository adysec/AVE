[basic]
description = "标签内。<value>WebKit 渲染引擎中存在内存损坏漏洞，影响 Apple iTunes 10.6 之前版本。攻击者可通过中间人攻击方式，在用户浏览 iTunes Store 时利用该漏洞触发内存破坏，导致任意代码执行或应用程序崩溃。该漏洞属于缓冲区溢出类型（CWE-119），攻击者无需用户交互即可远程执行恶意代码，CVSS v3 评分为 7.6，危害等级高。"
published = "2012-03-08T22:55:04.307"
remediation = "立即将 Apple iTunes 升级至 10.6 或更高版本（通过 Apple 软件更新或手动下载安装），该版本修复了 WebKit 中通过 iTunes Store 浏览触发的内存破坏漏洞。同时将 Safari 升级至 5.1.4 或更高版本。如无法立即升级，建议避免在不可信网络环境下使用 iTunes Store 浏览功能，并启用网络流量加密（如 VPN）以降低中间人攻击风险。"
score = 7.6
severity = "HIGH"
sources = ["tenable"]
title = "Apple iTunes 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:38:00.383"

