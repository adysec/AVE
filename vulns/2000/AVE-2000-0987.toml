[basic]
description = "Texas Imperial Software WFTPD 和 WFTPD Pro 2.41 RC12 版本存在拒绝服务漏洞，远程攻击者可通过发送包含大量不可打印字符的长字符串，导致 FTP 服务进程崩溃或停止响应，从而实现拒绝服务攻击。该漏洞源于程序对异常字符输入缺乏有效过滤和边界检查，攻击者无需身份认证即可远程触发，影响使用受影响版本 WFTPD 服务的所有系统。CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），属中危级别。"
published = "2000-11-14T05:00:00Z"
remediation = "建议立即升级到 Texas Imperial Software WFTPD和WFTPD Pro的最新版本（当前至少2.41 RC13或更高版本），并彻底删除已知存在漏洞的2.41 RC12版本。在升级过程中，请确保关闭FTP调试日志功能，并限制客户端连接速率到每分钟100个连接以内，以防止长期遭受不打印字符DoS攻击。如无法立即升级，建议在防火墙上配置IP封锁规则，禁止来自高风险网络段的连接，并启用FTP命令频率限制为每分钟50条以内，以降低被利用风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "泰克萨斯帝国软件 WFTPD 拒绝服务漏洞"
updated = "2026-06-16T21:52:39Z"

