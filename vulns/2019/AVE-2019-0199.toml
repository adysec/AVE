[basic]
description = "Atlassian Jira 软件的 CachingResourceDownloadRewriteRule 类存在路径访问检查不严格漏洞，未经身份认证的远程攻击者可通过构造特制请求路径绕过访问控制，读取 Jira Web 根目录下 META-INF 目录中的敏感文件（如 Maven 项目对象模型配置等），导致应用程序敏感信息泄露。该漏洞影响 Jira Server 7.13.4 之前、8.0.0 至 8.0.3 以及 8.1.0 版本，攻击者无需凭据即可在服务器端读取文件内容，可能进一步辅助针对 Jira 实例的渗透攻击与权限提升。Atlassian 已在 7.13.4、8.0.4 和 8.1.1 版本中修复此问题，建议受影响用户升级至安全版本。"
published = "2019-05-22T18:29:02Z"
remediation = "立即将 Jira 升级至 7.13.4、8.0.4 或 8.1.1 及以上版本，Atlassian 已在补丁中修复了 CachingResourceDownloadRewriteRule 类的路径访问检查缺陷。如暂时无法升级，可在反向代理或 WAF 层拦截包含 META-INF 目录的请求路径，或通过修改 jira.xml 配置临时禁用 CachingResourceDownloadRewriteRule 过滤器以阻断目录遍历。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Atlassian Jira 目录遍历漏洞"
updated = "2026-06-17T02:42:00Z"

