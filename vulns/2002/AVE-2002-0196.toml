[basic]
description = "Ethereal 0.9.3 及更早版本中的 SMB 协议解析器存在空指针解引用漏洞。远程攻击者可通过向目标系统发送特制的畸形网络数据包，触发 SMB 解析器在处理时解引用空指针，导致 Ethereal 程序崩溃（拒绝服务）或执行任意代码。攻击无需身份认证，仅需通过网络发送恶意构造的 SMB 流量即可触发，危害等级高。"
published = "2002-06-18T04:00:00Z"
remediation = "升级 Ethereal 至 0.9.4 或更高版本，该版本修复了 SMB 解析器中的空指针解引用问题。如无法升级，可在 Ethereal 设置中禁用 SMB 协议解析器，或使用防火墙规则过滤 SMB 流量（端口 445/TCP 和 139/TCP）作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Ethereal SMB解析器空指针解引用拒绝服务代码执行漏洞"
updated = "2026-06-16T21:57:22Z"

