[basic]
description = "ISDN4Linux (i4l) 套件中的 ISDN 点对点协议守护进程 (ipppd) 存在格式化字符串漏洞。当本地用户通过命令行参数传递设备名称时，该参数中的格式化字符串未被正确过滤即传入 syslog 函数，导致攻击者可利用 %n 等格式化符号实现任意内存写入。本地攻击者只需拥有系统普通用户权限，即可通过向 ipppd 传递特制的设备名字符串触发该漏洞，从而获取 root 权限。该漏洞影响 ISDN4Linux 3.1 及更早版本，CVSS 评分 7.2，危害等级高。"
published = "2002-09-05T04:00:00Z"
remediation = "升级 ISDN4Linux 软件包 isdnutils 至 1:3.2 或更高版本，该版本修复了 ipppd 守护进程在处理设备名参数时未正确过滤格式化字符串的问题。如无法升级，可通过移除 ipppd 的 setuid 权限或限制本地用户对 ISDN 设备的访问权限作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "ISDN4Linux IPPPD 格式字符串本地权限提升漏洞"
updated = "2026-06-16T21:58:15Z"

