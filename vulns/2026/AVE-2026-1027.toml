[basic]
description = "http4s-blaze-server 在聚合传入 WebSocket 消息片段时未对总大小和片段数量施加限制。远程攻击者完成 WebSocket 握手后，可发送永不终止的碎片化消息，迫使服务器 JVM 持续缓存所有片段直至堆内存耗尽，最终触发 OutOfMemoryError 导致服务拒绝。该漏洞影响所有基于 BlazeServerBuilder 提供 WebSocket 路由的 http4s 应用程序，且无需非默认配置；当端点无需认证即可访问时攻击者无需身份验证，若端点需要认证则任意已通过身份验证的客户端均可触发。"
