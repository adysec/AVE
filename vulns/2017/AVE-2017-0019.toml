[basic]
description = "Yaws 1.91 版本存在目录遍历漏洞，攻击者可通过向 8080 端口发送包含 /%5C../ 的特制 HTTP 请求绕过路径遍历防护机制，实现未经身份认证的远程文件泄露。该漏洞源于 Yaws Web 服务器对 URL 编码反斜杠（%5C）处理不当，导致路径规范化检查被绕过，攻击者可读取服务器上 Web 根目录之外的任意文件。攻击条件为：目标运行 Yaws 1.91 版本且 8080 端口开放，无需身份认证即可远程利用。攻击者可通过发送类似 GET /%5C../etc/passwd HTTP/1.1 的请求读取敏感系统文件，CVSS 3.0 评分 7.5（HIGH），影响范围为运行 Yaws 1.91 版本的所有服务器。官方已发布修复版本，建议升级至最新版本修复该漏洞。"
published = "2017-07-07T11:29:00Z"
remediation = '建议升级 Yaws 至 1.92 或更高版本（官方已修复目录遍历漏洞），可从官网 http://yaws.hyber.org/download/ 下载最新版本并替换原安装目录。若暂无法升级，可在 Yaws 配置文件 yaws.conf 中添加 `exclude_paths = ["/..", "/\\.."]` 规则限制路径遍历，或在反向代理层（如 Nginx）添加 `location ~ /\\\\\\\\.\\./ { deny all; }` 规则拦截包含 `/\\../` 的请求，作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Yaws Web服务器 目录遍历漏洞"
updated = "2026-06-17T01:01:01Z"

