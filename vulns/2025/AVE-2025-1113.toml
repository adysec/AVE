[basic]
description = "Linux内核x86/mm子系统中，flush_tlb_range()函数在处理页面表移除操作时存在缺陷。当通过collapse_pte_mapped_thp路径清除普通PMD条目时，x86架构的TLB刷新实现未正确处理此类情况，与arm64架构的正确实现不一致。具有本地访问权限和低权限的攻击者可利用此漏洞，在触发懒TLB刷新或Hyper-V半虚拟化场景时，导致speculative page table walks出现问题。该漏洞影响运行受影响内核版本的x86系统，可造成机密性、完整性和可用性的完全损失。CVSS v3.1评分为7.8，危害等级为高。"
published = "2025-04-16T15:15:57Z"
remediation = "将 Linux 内核升级至包含补丁 commit 3ef938c3503563bfc2ac15083557f880d29c2e64 的修复版本。Debian 11 用户请通过 apt 升级至 5.10.237-1，Debian 12 用户请升级至 6.1.180-1；Ubuntu 22.04 LTS 请升级内核至 5.15.0-142.152，Ubuntu 24.04 LTS 请升级至 6.8.0-86.87，Ubuntu 20.04 LTS (ESM) 请升级至 5.4.0-218.238。上游稳定版 5.4.292、5.10.236、6.1.135 及更高版本已包含此修复。如暂无法立即升级，建议通过内核参数限制本地用户权限并加强系统监控作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux Kernel x86 MM 本地权限提升漏洞"
updated = "2026-07-30T06:22:05Z"

