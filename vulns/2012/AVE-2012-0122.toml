[basic]
description = "Apple iOS 5.1 之前版本、iTunes 10.6 之前版本以及 Safari 5.1.4 之前版本中使用的 WebKit 引擎存在内存破坏漏洞（CWE-119）。远程攻击者可诱导用户访问特制网站，触发 WebKit 内存处理逻辑中的未明错误，导致内存损坏，进而实现任意代码执行或造成应用程序崩溃。攻击者无需任何身份认证，仅需用户通过受影响浏览器或应用访问恶意页面即可触发。Apple 已于 2012 年 3 月发布安全更新修复此漏洞。"
published = "2012-03-08T22:55:03Z"
remediation = "将 Apple iOS 升级至 5.1 或更高版本，将 iTunes 升级至 10.6 或更高版本，将 Safari 升级至 5.1.4 或更高版本。iOS 用户可通过设备「设置→通用→软件更新」OTA 升级；iTunes 用户可通过 Mac App Store 或 Apple 软件更新获取；Safari 用户可通过「Apple 菜单→软件更新」安装。如无法立即升级，建议禁用 JavaScript 解析并避免访问不可信网站作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:58Z"

