[basic]
description = "Half Life 专用服务器（build 3104 之前版本）存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向服务器发送超长的 rcon 命令触发该漏洞，导致任意代码执行。该漏洞影响 Half Life 早期版本的专用服务器，CVSS 评分 10.0，危害等级严重。攻击者只需具备网络访问能力即可利用，无需任何权限，可完全控制目标服务器。"
published = "2000-12-19T05:00:00.000"
remediation = "立即将 Half-Life Dedicated Server 升级至 build 3104 或更高版本。如无法升级，在服务器防火墙中限制 rcon 端口的访问来源 IP，仅允许受信任的管理员 IP 连接，并禁用不必要的远程管理功能。同时避免将 rcon 密码设置为弱口令或默认值。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Valve Half-Life Dedicated Server 远程缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:52:52.630"

