[basic]
description = "WordPress 的 sourceAFRICA 插件 0.1.3 版本中 `js/window.php` 文件存在反射型跨站脚本漏洞（CWE-79）。远程攻击者无需认证即可通过向 `wpbase` 参数注入恶意 Web 脚本或 HTML 代码，当管理员或用户访问特制 URL 时恶意脚本将在浏览器中执行，可能导致敏感信息泄露或会话劫持。攻击需诱使用户点击恶意链接，CVSS 评分 4.3，危害等级中危。"
published = "2015-09-11T20:59:02Z"
remediation = "立即在 WordPress 后台停用并卸载 sourceAFRICA 插件 0.1.3 版本，该插件已长期未维护且无安全更新。如仍需音频嵌入功能，建议替换为 SoundCloud 官方插件或其他活跃维护的替代方案。若无法立即卸载，在服务器端 WAF（如 ModSecurity）中添加规则拦截 `js/window.php?wpbase=` 请求中的 `<script>`、`<img>` 等 HTML 标签及 `onerror`、`onload` 等事件处理器，或通过 WordPress 函数 `esc_url()` 对 `wpbase` 参数进行输出转义处理。"
score = 4.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress sourceAFRICA 插件 0.1.3 跨站脚本漏洞"
updated = "2026-06-17T00:31:35Z"

