[basic]
description = "Red Hat Linux 6.2 中的 dump 工具（版本 0.4b15）存在信任环境变量的安全漏洞。dump 命令在执行备份操作时信任 RSH 环境变量所指定的路径名，未对其进行充分校验。本地攻击者可通过修改 RSH 环境变量，将其指向恶意的特洛伊木马程序，当 dump 调用远程 shell 时即可执行恶意代码，从而获取 root 权限。该漏洞影响 Red Hat Linux 6.2 系统，CVSS 评分 7.2，危害等级高。"
published = "2000-12-11T05:00:00.000"
remediation = "升级 dump 至 0.4b16 或更高版本，该版本已移除对 RSH 环境变量的信任。如无法升级，可卸载 dump 包（rpm -e dump）或移除 dump 的 SUID 位（chmod u-s /sbin/dump），改用其他备份工具替代。同时建议升级操作系统至受支持版本。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Red Hat Linux dump 本地权限提升漏洞"
updated = "2026-06-16T21:52:57.790"

