[basic]
description = "Microsoft IIS 5.0 在启用 Index Server 且设置 Index 属性的情况下存在目录泄露漏洞。远程攻击者无需身份认证即可通过 WebDAV 搜索功能向目标服务器发送特制请求，遍历 Web 根目录下的文件与子目录列表，导致敏感信息泄露。该漏洞影响 Windows 2000 上运行的 IIS 5.0 版本，CVSS 评分 5.0，危害等级中危。攻击者利用此漏洞可获取网站目录结构、文件名等敏感信息，为后续攻击提供情报支撑。"
published = "2000-12-19T05:00:00.000"
remediation = '建议立即升级至 Windows Server 2003 及以上版本（IIS 6.0+），或安装 Microsoft 安全更新 MS01-026。如无法升级，在 IIS 管理器中右键网站目录 → 属性 → 取消勾选"索引此文件"；若无需索引功能，在服务管理器中停止并禁用 Indexing Service 服务。同时可在 IIS 中删除 WebDAV 映射（默认禁用但需确认）。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft IIS 5.0 WebDAV 搜索目录泄露漏洞"
updated = "2026-06-16T21:52:50.413"

