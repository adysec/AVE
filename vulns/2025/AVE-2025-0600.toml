[basic]
description = "Google Chrome Mac 版本 143.0.7499.110 之前版本的 ANGLE 图形库 Metal 后端存在越界内存访问漏洞（CWE-787/CWE-119）。远程攻击者可通过诱导用户访问精心构造的 HTML 页面，触发 ANGLE Metal 后端的越界内存写入，导致越界内存访问，可能造成任意代码执行。该漏洞影响 macOS 上的 Google Chrome 及 iOS Safari，CVSS 3.1 评分 8.8（HIGH），攻击向量为网络、攻击复杂度低、无需权限但需要用户交互，机密性/完整性/可用性影响均为高。Google 已在 Chrome 143.0.7499.110 中修复该漏洞，Apple 也已在相应 Safari 版本中修复。"
published = "2025-12-12T20:15:39Z"
remediation = "建议立即将 macOS 版 Google Chrome 升级至 143.0.7499.110 或更高版本（通过 Chrome 菜单 → 关于 Chrome 自动更新），Debian 12/13 用户请执行 apt update && apt upgrade chromium 升级至 DSA-6083-1 修复版本。若暂时无法更新，可暂时禁用 GPU 加速（Chrome 启动参数添加 --disable-gpu）作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "谷歌 Chromium 浏览器内存溢出访问漏洞"
updated = "2026-06-17T08:35:27Z"

