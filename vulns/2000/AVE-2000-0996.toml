[basic]
description = "某些 Telnet 客户端实现存在信息泄露漏洞。远程攻击者可通过搭建恶意的 Telnet 服务器，在客户端连接时请求获取客户端的敏感环境变量（如 USER、HOME、PATH 等），或通过 telnet: URL 方式诱导用户访问恶意 Web 页面来间接获取这些信息。该漏洞可能导致用户账户名、目录路径等敏感信息泄露，为后续针对性攻击提供便利。攻击条件要求用户主动连接恶意 Telnet 服务器或点击恶意链接，CVSS 评分 2.6，危害等级低。"
published = "2001-07-21T04:00:00Z"
remediation = "建议停止使用 Telnet 协议，改用 SSH（OpenSSH 等）替代所有远程登录场景，从根本上消除环境变量泄露风险。如因兼容性必须保留 Telnet，请升级 telnet 客户端至最新版本，并在客户端配置中禁用环境变量传递（如设置 `ENV_DISPLAY=0` 或限制 `DISPLAY`、`TERM` 等敏感变量）。在防火墙上封禁 Telnet 端口（TCP 23）的出站连接，防止客户端意外连接到恶意服务器。"
score = 2.6
severity = "LOW"
sources = ["avd"]
title = "多厂商 Telnet 客户端环境变量信息泄露漏洞"
updated = "2026-06-16T21:52:41Z"

