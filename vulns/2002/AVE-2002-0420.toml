[basic]
description = "CGIScript.net 的 csMailto.cgi 脚本存在远程命令执行漏洞。该 Perl 脚本用于支持多个 mailto 表单，但其配置值存储在隐藏表单字段中。未经身份认证的远程攻击者可在脚本调用之间修改这些隐藏字段值，通过在 form-attachment 参数中注入 shell 元字符执行任意系统命令，还可利用 form-autoresponse 和 Email 参数将服务器文件通过邮件发送给任意收件人。该漏洞影响部署了 csMailto 脚本的 Web 服务器，攻击者无需任何凭据即可在受影响系统上执行任意操作。"
published = "2002-08-12T00:00:00Z"
remediation = "立即删除或停用服务器上的 csMailto.cgi 脚本，该脚本由已停止运营的 CGIScript.net 开发，官方不再提供安全补丁。如业务仍需使用邮件表单功能，应替换为现代且持续维护的替代方案（如 PHP mail() 函数配合严格输入过滤、或使用 Nginx/Apache 内置的邮件处理模块），并对所有用户输入进行严格的参数化过滤，禁止直接拼接 shell 命令。临时缓解措施包括在 Web 服务器配置中禁用 csMailto.cgi 的访问权限、在防火墙或 WAF 层面拦截包含 shell 元字符（如 ; | & $ `）的请求，并审计 Web 根目录下是否存在其他遗留的 CGIScript.net 产品。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "CGIScript.net csMailto 远程命令执行漏洞"
updated = "2002-08-12T00:00:00Z"

