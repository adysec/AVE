[basic]
description = "tags.<value>Solaris 2.8 及更早版本中的 /usr/bin/cu 程序存在缓冲区溢出漏洞。本地攻击者可通过执行 cu 时传入超长的程序名称（arg0）参数触发该溢出，从而在本地提升自身权限。该漏洞影响所有使用受影响版本 Solaris 的系统，攻击者无需任何身份认证即可利用此漏洞获取更高权限，CVSS 评分 7.2，危害等级为高。"
published = "2001-03-26T05:00:00.000"
remediation = "升级至 Solaris 9 或更高版本，从根本上修复 /usr/bin/cu 的缓冲区溢出漏洞。若无法升级，Solaris 2.6 系统应安装补丁 106468-02，Solaris 7 系统应安装补丁 108372-01。临时缓解措施：通过 chmod 750 /usr/bin/cu 并仅授予 root 组执行权限，或通过 sudoers 限制普通用户执行 cu，避免未授权本地用户利用长程序名参数触发特权提升。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Sun Solaris cu 本地缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:53:50.883"

