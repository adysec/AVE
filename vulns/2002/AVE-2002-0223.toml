[basic]
description = "mIRC 5.91 及更早版本存在昵称缓冲区溢出漏洞，远程攻击者可通过向客户端发送超长昵称字符串触发缓冲区溢出，导致任意代码执行。攻击者只需在 IRC 服务器上设置一个超长昵称，当目标用户连接该服务器或接收包含恶意昵称的消息时即可触发漏洞。该漏洞影响 mIRC 2.x 至 5.x 全系列版本，CVSS 评分 7.5，危害等级高。目前已有公开的利用代码，建议用户升级至最新版本。"
published = "2002-05-16T04:00:00Z"
remediation = "升级 mIRC 至 6.0 或更高版本（当前最新版为 6.35），该漏洞已在 6.0 中修复。如无法升级，可在服务器设置中限制昵称长度不超过 9 个字符，并避免连接不可信的 IRC 服务器。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "mIRC 昵称缓冲区溢出漏洞"
updated = "2026-06-16T21:57:02Z"

