[basic]
description = "Yet Another Bulletin Board（YaBB）1 Gold SP1 及更早版本的 YaBB.cgi 脚本中存在跨站脚本（XSS）漏洞。远程攻击者可通过在请求的 `num` 参数中注入恶意 JavaScript 脚本代码，构造特制 URL 发送给 YaBB 论坛用户；当用户访问该链接时，论坛在生成错误提示页面时未对 `num` 参数进行任何过滤，导致攻击者提供的脚本代码直接嵌入到响应页面中并在用户浏览器中执行。攻击者可借此窃取论坛用户的 Cookie 等认证凭据，进而劫持用户会话、以合法用户身份执行任意操作。该漏洞影响所有运行受影响版本 YaBB 的网站，CVSS 评分为 7.5，危害等级为高危。YaBB 官方已发布修复版本，管理员应尽快升级至 YaBB 1 Gold SP2 或更高版本以消除该风险。"
published = "2002-10-04T04:00:00Z"
remediation = "将 YaBB 升级至 1 Gold SP2 或更高版本（如 YaBB 2.x/3.x），新版本对 YaBB.cgi 中 num 参数进行了输入过滤和 HTML 编码，可防止脚本注入错误页面。如无法立即升级，可临时修改 YaBB.cgi 中对 num 参数的输出逻辑，在显示错误信息前使用 htmlspecialchars() 等函数对参数值进行编码，阻断脚本执行。同时建议在 Apache 或 Nginx 层通过 WAF 规则拦截包含 &lt;script&gt; 标签的 URL 请求，作为过渡缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "YaBB 1 Gold SP1 跨站脚本攻击"
updated = "2026-06-16T21:58:27Z"

