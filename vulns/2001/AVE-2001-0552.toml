[basic]
description = "Qualcomm Qpopper 4.0 及更早版本中的 popauth 实用程序存在符号链接（symlink）攻击漏洞。本地攻击者可通过向 popauth 的 -trace 文件选项传递特制的符号链接，利用 popauth 以 pop 用户权限处理 trace 文件时的路径跟随缺陷，实现覆盖任意文件或以 pop 用户身份执行任意命令。该漏洞需要攻击者拥有本地系统访问权限，无需认证即可利用，可导致本地权限提升或敏感信息泄露。CVSS 评分 4.6，危害等级中危。"
published = "2001-12-31T05:00:00Z"
remediation = "升级 QPopper 至 4.1 及以上版本，该版本已修复 popauth 对 -trace 文件参数处理不当导致的符号链接跟随问题。如无法升级，可移除 popauth 的 setuid 位（chmod u-s /usr/sbin/popauth），或限制仅授权管理员可通过 popauth 使用 -trace 选项，并确保 trace 文件写入专用目录而非用户可控路径。"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Qualcomm Qpopper 4.0.x PopAuth 符号链接文件覆盖与命令执行漏洞"
updated = "2026-06-16T21:56:22Z"

