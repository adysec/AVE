[basic]
description = "该漏洞存在于 Google Chrome 的下载组件中，由于下载功能的实现不当，导致浏览器在处理特定文件下载时未能正确隔离或验证 UI 元素。本地攻击者可以通过诱导用户访问一个精心构造的 HTML 页面，利用此缺陷实现 UI 欺骗（UI Spoofing），从而误导用户执行非预期操作或伪造系统界面。该漏洞影响 143.0.7499.41 之前的 Google Chrome 版本，CVSS 评分 4.4，危害等级为中低危。"
published = "2025-12-02T19:15:48Z"
remediation = "建议立即将 Google Chrome 浏览器升级至 143.0.7499.41 或更高版本。对于使用 Chromium 衍生版本（如 Fedora 上的 CEF/Chromium）的用户，应更新至 chromium-143.0.7499.146 或更新的发行版补丁版本，以修复下载组件中的实现缺陷，防止本地攻击者通过构造 HTML 页面进行 UI 欺骗。"
score = 4.4
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome 下载功能 UI 欺骗漏洞"
updated = "2026-06-17T08:34:29Z"

