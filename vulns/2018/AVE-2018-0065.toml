[basic]
description = "OEcms 3.1 版本的 info.php 文件中 mod 参数存在反射型跨站脚本漏洞，由于对用户输入的 mod 参数缺乏充分过滤和转义，攻击者可构造包含恶意 JavaScript 代码的 URL 诱导受害者点击。当用户访问该链接时，恶意脚本将在受害者浏览器中执行，可窃取 Cookie、会话令牌或执行其他敏感操作。该漏洞影响 OEcms 3.1 版本，攻击条件为用户需点击恶意链接且浏览器未开启 XSS 防护，CVSS 评分 5.4 为中危等级。"
published = "2018-06-11T11:29:00Z"
remediation = "立即将 Oecms 升级到 4.0 或更高版本，应用核心安全补丁并重新编译；在 info.php 中启用严格的输入验证和出码过滤，关闭 PHP 错误显示，配置 Content-Type 为 text/html 并添加 X-Content-Type-Options: nosniff 等安全 HTTP 头以缓解 XSS 风险。"
score = 5.4
severity = "MEDIUM"
sources = ["nuclei"]
title = "易创 Oecms 3.1 信息页面跨站脚本攻击"
updated = "2026-06-17T01:37:08Z"

