[basic]
description = "标签之间。<value>eEye Iris 1.0.1 beta 版本存在拒绝服务漏洞，其原理是程序在处理畸形网络数据包时缺乏充分的输入验证。远程攻击者可在网络环境中发送特制的畸形数据包到运行 Iris 的目标系统，当用户通过 Iris 客户端界面查看该数据包内容时，程序因无法正确解析而崩溃退出，造成拒绝服务。该漏洞影响 eEye Digital Security IRIS 1.0.1 版本，攻击者无需身份认证即可远程发起攻击，但需要用户主动查看恶意数据包才能触发利用。CVSS v2 评分为 2.6，危害等级较低。"
published = "2001-03-26T05:00:00Z"
remediation = "升级 eEye Iris 至修复后的稳定版本，避免使用 1.01 beta 等存在崩溃缺陷的早期版本。在网络边界防火墙或 IDS 上部署规则，过滤包含畸形 IP 头部字段（如 ip_hl=-1、ip_off=-1）和异常 TCP 标志位组合的恶意数据包。使用时应在受信隔离环境中打开网络捕获文件，避免直接分析来自不可信来源的数据包，防止攻击者利用畸形数据包触发程序崩溃。"
score = 2.6
severity = "LOW"
sources = ["epss"]
title = "eEye Digital Security Iris 拒绝服务漏洞"
updated = "2026-06-16T21:53:50Z"

