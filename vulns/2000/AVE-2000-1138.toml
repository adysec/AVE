[basic]
description = "Argosoft FRP Server 1.0 存在缓冲区溢出漏洞，远程攻击者无需身份认证即可向 FTP 服务的 USER 或 CWD 命令发送超长字符串，触发缓冲区溢出，导致服务进程崩溃拒绝服务，在特定条件下可执行任意命令。该漏洞影响 Argosoft FRP Server 1.0 版本，CVSS v2.0 评分 7.5，危害等级高。厂商未提供官方补丁，建议升级至更高版本或限制对 FTP 服务的访问。"
published = "2001-08-31T04:00:00Z"
remediation = "Argosoft FRP server 1.0 已停止维护，官方不再提供补丁，建议立即迁移至仍在维护的 FTP 服务端软件（如 vsftpd、ProFTPD 或 FileZilla Server）。若暂时无法迁移，先在防火墙层面仅允许受信任来源 IP 访问 21 端口并配置访问白名单、关闭匿名登录；同时在服务端限制 USER、CWD 命令参数长度（不超过 128 字符），并在网关部署规则拦截参数异常超长的 FTP 命令流量，以缓解远程拒绝服务与潜在命令执行风险。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Argosoft FRP Server 远程拒绝服务漏洞"
updated = "2026-06-16T21:53:21Z"

