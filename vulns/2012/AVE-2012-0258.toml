[basic]
description = "Google Chrome 21.0.1180.57之前版本（Mac OS X/Linux）及21.0.1180.60之前版本（Windows/Chrome Frame）的CSS DOM实现中存在释放后使用（Use-after-free）漏洞。远程攻击者可通过特制文档触发已释放内存的访问，导致拒绝服务或可能造成其他未明影响。该漏洞源于CSS样式表处理过程中对对象生命周期的错误管理，影响Chrome、Safari及iTunes等使用WebKit的应用程序。"
published = "2012-08-06T15:55:01.917"
remediation = """
