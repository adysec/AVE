[basic]
description = "Apple macOS Mojave 中存在一处释放后使用（Use-After-Free）内存破坏漏洞，该漏洞源于对内存对象生命周期管理不当。本地攻击者可通过运行特制的应用程序触发已释放内存的访问，从而利用该漏洞实现权限提升，获取系统最高控制权。攻击者需具备本地用户权限，无需用户交互即可利用。该漏洞影响 macOS Mojave 10.14.4 之前版本，CVSS 评分 7.8，危害等级高危。"
published = "2019-12-18T18:15:24Z"
remediation = "升级至 macOS Mojave 10.14.4 或更高版本，通过系统偏好设置 → 软件更新完成安装。如无法立即升级，可限制非授权用户本地登录权限，并监控异常提权行为作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Apple macOS Mojave 释放后使用权限提升漏洞"
updated = "2026-06-17T02:42:06Z"

