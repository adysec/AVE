[basic]
description = "AmTote International 的 Homebet 在线投注系统将包含用户账户和 PIN 码的敏感日志文件 homebet.log 存放在 Web 根目录下的 homebet/ 虚拟子目录中，且未设置任何访问控制或认证机制。远程攻击者只需通过 HTTP 直接访问该日志文件的 URL 即可获取所有用户的账户凭证信息，进而利用窃取的凭证进行未授权投注或资金操作。该漏洞攻击复杂度低，无需任何身份认证即可远程利用，影响范围涵盖所有部署了该版本的 Homebet 系统的服务器。"
published = "2001-09-29T04:00:00Z"
remediation = "将 homebet.log 文件移出 Web 可访问目录（如移至 /var/log/homebet/），并在 Web 服务器（Apache/Nginx）配置中添加对 /homebet/ 目录的访问控制规则，仅允许授权 IP 访问。同时设置日志文件权限为 600，仅允许应用进程读取。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "AmTote International Homebet 日志文件信息泄露漏洞"
updated = "2026-06-16T21:55:43Z"

