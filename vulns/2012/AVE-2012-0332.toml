[basic]
description = "Apple Safari 6.0 之前的版本中，WebKit 引擎存在内存破坏漏洞。远程攻击者可通过构造恶意网页，利用该漏洞在用户浏览器中执行任意代码或造成拒绝服务（内存损坏与应用崩溃）。该漏洞影响使用 WebKit 渲染引擎的 Safari 浏览器版本，攻击条件为用户访问包含恶意代码的网页即可触发，无需身份认证。"
published = "2012-07-25T20:55:03.960"
remediation = "立即将Apple Safari升级至6.0或更高版本。macOS用户可通过系统偏好设置中的软件更新安装，iOS用户需升级至iOS 6.0。在升级完成前，建议在Safari中禁用JavaScript作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:40.150"

