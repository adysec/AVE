[basic]
description = "GnuPG（Gnu Privacy Guard）1.0.4 及部分其他版本在验证分离签名（detached signature）时存在缺陷，未能正确校验签名与文件内容的匹配关系。本地攻击者可在无需认证的情况下，修改已签名文件的内容而不被签名验证机制检测到，导致文件完整性保护失效。该漏洞攻击复杂度低，但需要本地访问权限，影响 GnuPG 的签名验证可信性。"
published = "2001-02-12T05:00:00.000"
remediation = "升级 GnuPG 至 1.0.5 或更高版本，该版本修复了分离签名验证不完整的问题。对于无法升级的旧系统，应在验证分离签名前手动检查文件完整性，或使用 `gpg --verify` 时配合 `--trust-model always` 参数并交叉校验签名源文件哈希值。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "GNU GnuPG 分离签名验证绕过漏洞"
updated = "2026-06-16T21:53:36.093"

