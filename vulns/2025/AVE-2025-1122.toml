[basic]
description = "Linux 内核 SCTP 子系统中 proc_sctp_do_udp_port() 函数存在竞态条件漏洞，由于未对 sctp_udp_sock_stop() 和 sctp_udp_sock_start() 的调用进行互斥序列化，本地低权限攻击者可通过并发触发该 proc 接口，导致空指针解引用，引发系统崩溃或权限提升。该漏洞影响启用 SCTP 协议的内核版本，攻击者可利用 syzbot 所示的利用路径通过 splice 系统调用触发内核空指针访问，从而造成拒绝服务或潜在的本地提权风险。"
published = "2025-04-16T15:15:59Z"
remediation = "建议升级 Linux 内核至包含 commit 10206302af856791fbcc27a33ed3c3eb09b2793d 的修复版本，如 Debian 12 的 6.1.140-1、Ubuntu 22.04 的 5.15.0-144.157 或 Ubuntu 24.04 的 6.8.0-86.87。如暂时无法升级，可通过 echo 'install sctp /bin/true' >> /etc/modprobe.d/disable-sctp.conf 或 rmmod sctp 禁用 SCTP 内核模块以缓解风险。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 SCTP 空指针引用漏洞"
updated = "2026-07-30T06:22:10Z"

