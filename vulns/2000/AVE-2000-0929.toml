[basic]
description = "标签中。<value>Joe 文本编辑器在异常退出时会自动创建名为 DEADJOE 的恢复副本以保存未写入磁盘的编辑内容，但在创建该文件时会错误地跟随符号链接而非直接创建新文件。在多用户系统中，本地攻击者可预先在目标目录下创建指向其他用户敏感文件的符号链接，当其他用户的 joe 会话因程序崩溃或异常退出而终止时，编辑器会将恢复数据写入该符号链接指向的文件，从而覆盖或破坏其他用户的私有数据。该漏洞影响所有使用 Joe 文本编辑器的 Unix/Linux 多用户环境，需要本地访问权限且能够等待或诱导其他用户的编辑器会话异常退出才能利用。"
published = "2001-01-09T05:00:00Z"
remediation = "建议将 Joe 文本编辑器升级至最新稳定版本，以修复符号链接处理逻辑。若无法升级，可通过修改系统权限限制普通用户创建可被覆盖的符号链接，或在配置文件中禁用异常退出时的救援副本生成功能。"
score = 5.5
severity = "MEDIUM"
sources = ["avd"]
title = "Joe 文本编辑器 符号链接文件覆盖漏洞"
updated = "2026-06-16T21:53:19Z"

