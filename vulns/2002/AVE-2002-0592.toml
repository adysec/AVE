[basic]
description = '标签之间。<value>Blazix 1.2.2 之前版本的服务器存在特殊字符处理缺陷，远程攻击者无需身份认证即可通过构造以加号（"+"）或反斜杠（"\"）字符结尾的恶意 HTTP 请求，绕过目录访问限制读取 JSP 脚本的源代码或列出受密码保护的受限 Web 目录内容。该漏洞影响所有使用 Blazix 1.2.x 版本的 Java Web 应用程序，攻击者可利用此漏洞获取敏感信息，包括数据库连接配置、业务逻辑代码等，进而为进一步攻击提供信息支持。'
published = "2002-08-24T04:00:00Z"
remediation = '将 Blazix 升级到 1.2.2 或更高版本，该版本已修复特殊字符（"+" 和反斜杠）导致的 JSP 源代码泄露与目录遍历问题。如暂无法升级，可在 Web 服务器前端部署 WAF 规则，拦截所有以 "+" 或 "\" 结尾的 HTTP 请求，并检查 Web 根目录下 .jsp 文件及其编译后的 .class 文件访问权限，确保敏感目录禁止列目录。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Blazix Blazix 1.2 密码保护目录信息泄漏漏洞"
updated = "2026-06-16T21:59:21Z"

