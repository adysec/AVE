[basic]
description = "RealNetworks RealPlayer 浏览器插件中的 RecordClip 方法存在参数注入漏洞。攻击者可通过构造特制的网页，在调用 RecordClip 方法时向参数中注入双引号等特殊字符，从而突破参数边界，控制下载程序的路径和文件名。当用户使用受影响版本（RealPlayer 11.0~11.1 及 RealPlayer SP 1.0~1.1）的浏览器访问恶意页面时，攻击者可远程下载并执行任意程序到用户机器上，实现远程代码执行。该漏洞无需用户交互即可触发，危害严重，CVSS 评分 9.3。"
published = "2010-10-19T00:00:01Z"
remediation = "立即升级 RealPlayer SP 至 12.0.0.879 或更高版本，该版本已修复 RecordClip 方法参数注入漏洞。如无法升级，建议卸载 RealPlayer 或禁用浏览器中的 RealPlayer ActiveX 控件（CLSID: FDC3FEE3-7A4D-4F5E-8A1B-8B7A4D5E6F7A），并配置 Internet Explorer 将 RealPlayer ActiveX 控件设置为「禁用」或「提示」以阻止远程攻击者利用参数注入执行任意程序。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer RecordClip方法参数注入远程代码执行漏洞"
updated = "2026-06-16T23:23:26Z"

