[basic]
description = "标签内的内容。<value>Apple Safari 6.0 及更早版本中使用的 WebKit 渲染引擎存在内存破坏漏洞（CWE-119）。远程攻击者可通过诱导用户访问恶意构造的网页，利用该漏洞执行任意代码或导致应用崩溃（拒绝服务）。该漏洞与 TIFF、PNG、JPEG 图像及 ImageIO 的内存处理错误有关。成功利用需用户交互，攻击条件为中等复杂度。受影响范围包括桌面版 Safari 以及运行 iOS 6.0 之前的 iPhone、iPad 和 iPod touch 设备。"
published = "2012-07-25T20:55:03Z"
remediation = "Mac 用户请将 Safari 升级至 6.0 或更高版本：OS X Lion 10.7.4 用户可通过 Mac App Store 或系统偏好设置中的软件更新功能免费获取 Safari 6.0；OS X Mountain Lion 及以上版本用户直接通过系统更新安装。iOS 用户需通过 iTunes 将设备升级至 iOS 6.0 或更高版本。Windows 用户请将 iTunes 升级至 10.7 或更高版本以获取 WebKit 安全修复。如暂无法升级，建议暂时使用其他浏览器并避免访问不可信网站作为临时缓解措施。详细修复信息可参考 Apple 安全公告 APPLE-SA-2012-07-25-1 及知识库文章 HT5400、HT5485、HT5503。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:37Z"

