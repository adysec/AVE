[basic]
description = "Windows Digital Media 组件存在越界读取（CWE-125）漏洞，由于对内存边界检查不充分，具有低权限的本地攻击者可通过物理访问目标系统触发该漏洞，导致越界读取敏感内存数据，进而实现权限提升，获取高完整性访问权限，影响系统的机密性、完整性和可用性。该漏洞影响 Windows 10/11 及 Windows Server 多个版本，CVSS 评分 6.6，危害等级中危。Microsoft 已在 2025 年 1 月安全更新（KB5050061）中修复此漏洞。"
published = "2025-01-14T18:15:57.340"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新。各版本对应修复版本号：Windows 10 1507 升级到 10.0.10240.20890 以上，Windows 10 1607 升级到 10.0.14393.7699 以上，Windows 10 1809 升级到 10.0.17763.6775 以上，Windows 10 21H2/22H2 升级到 10.0.19044.5371/10.0.19045.5371 以上，Windows 11 22H2/23H2 升级到 10.0.22621.4751/10.0.22631.4751 以上，Windows 11 24H2 升级到 10.0.26100.2894 以上，Windows Server 2008 SP2 安装 KB5050061。可通过 Windows Update 自动获取更新，或从 Microsoft Update Catalog 手动下载安装。由于该漏洞需要物理访问权限才能利用，限制物理接触受影响的系统可作为临时缓解措施。"
score = 6.6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows Digital Media 特权提升漏洞"
updated = "2026-06-17T08:43:06.540"

