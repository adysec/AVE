[basic]
description = "I-Data Easycom Safecom Print Server 404.590 版本存在拒绝服务（DoS）漏洞。攻击者可通过建立大量并发连接请求来耗尽打印服务器的连接资源，导致服务器无法处理合法打印请求，从而造成拒绝服务。该漏洞影响 Easycom Safecom Print Server 404.590 版本，远程攻击者在无需认证的情况下即可触发，危害等级中等。目前官方已发布修复版本，建议用户升级以规避风险。"
published = "2001-06-02T00:00:00Z"
remediation = "鉴于 I-Data Easycom Safecom Print Server 404.590 已停止维护且厂商不再发布安全补丁，无法通过升级修复。建议立即在防火墙/ACL 中限制该打印服务器（8980/9100 等打印服务端口）的访问来源，仅允许可信内部网段，禁止来自不可信网络的连接，并关闭 Web 管理界面远程访问，防止未授权 Connection 请求造成服务崩溃。若业务允许，建议将打印服务器升级至仍在维护的同类设备，或改用支持固件更新的现代打印服务器/网络打印机以消除此拒绝服务风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "I-Data Easycom Safecom 打印服务器 拒绝服务漏洞"
updated = "2001-06-02T00:00:00Z"

