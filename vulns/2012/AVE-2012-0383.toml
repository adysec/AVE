[basic]
description = "WebKit 渲染引擎存在内存破坏漏洞，影响 Apple iTunes 10.6.3 及更早版本。远程攻击者可构造恶意网页，当用户使用受影响版本的 iTunes 访问该网页时，WebKit 在处理网页内容过程中触发内存损坏，可导致应用程序崩溃（拒绝服务）或在特定条件下执行任意代码。该漏洞的利用需要用户主动打开恶意链接，攻击复杂度中等。Apple 已在 iTunes 10.7 中修复此问题，建议用户升级至安全版本以消除风险。"
published = "2012-09-13T10:30:21Z"
remediation = "建议将 Apple iTunes 升级至 10.7 或更高版本，以修复 WebKit 引擎中的内存破坏漏洞。可在 iTunes 的「帮助」菜单中点击「检查更新」进行自动升级，或从 Apple 官网下载最新安装包覆盖安装。如暂无法升级，应避免使用 iTunes 打开或访问不受信任的网页链接及邮件附件，直至完成版本更新。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:46Z"

