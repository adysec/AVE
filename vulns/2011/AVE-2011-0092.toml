[basic]
description = "Mozilla Firefox 浏览器引擎中存在多处未指定的内存安全漏洞，影响 Firefox 3.6.18 之前版本及 Thunderbird 3.1.11 之前版本。远程攻击者可通过构造特制网页诱导用户访问，触发内存破坏导致浏览器崩溃，或利用内存损坏实现任意代码执行。该漏洞无需身份认证即可远程利用，攻击复杂度低，CVSS 评分 10.0，危害等级严重。Mozilla 已发布安全更新修复此漏洞。"
published = "2011-06-30T16:55:05Z"
remediation = "升级 Mozilla Firefox 至 3.6.18 及以上版本，或升级 Mozilla Thunderbird 至 3.1.11 及以上版本。如无法立即升级，可禁用 JavaScript 或使用 NoScript 等扩展限制脚本执行作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox 和 Thunderbird 浏览器引擎内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:31:13Z"

