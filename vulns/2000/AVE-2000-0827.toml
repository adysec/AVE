[basic]
description = 'Markus Triska CGIForum 1.0 的 cgiforum.pl 脚本中存在目录遍历漏洞，远程攻击者可通过 "thesection" 参数提交 ".."（点点）序列实现目录遍历攻击，从而读取服务器上的任意文件。该漏洞影响 CGIForum 1.0 版本，攻击者无需身份认证即可远程利用，攻击复杂度低，仅需构造包含目录遍历序列的恶意请求即可读取服务器敏感文件（如配置文件、源代码、系统文件等），导致机密性泄露，CVSS 评分 5.0（中危），影响机密性但不影响完整性和可用性。'
published = "2001-01-09T05:00:00Z"
remediation = '建议立即升级 CGIForum 至 1.0 之后的修复版本（如有官方修复版本），或从官方站点下载最新版本替换 cgiforum.pl。若无官方补丁，请立即停用 cgiforum.pl 脚本或在 Web 服务器层面配置规则拦截 thesection 参数中包含 ".." 或 "/" 的请求；同时配置 Web 服务器限制 CGI 脚本的文件系统访问权限（如 chroot/jail 到特定目录），并在 WAF 层面添加目录遍历特征规则拦截 ../ 等遍历载荷。若无法升级，建议暂时下线该 CGI 论坛功能并改用维护中的现代论坛软件。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Markus Triska CGIForum 1.0 目录遍历漏洞"
updated = "2026-06-16T21:53:18Z"

