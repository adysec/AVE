[basic]
description = "Windows Direct Show 存在双重释放（Double Free）远程代码执行漏洞，攻击者可通过构造特制的媒体文件并诱导用户打开，触发内存损坏，从而在目标系统上以当前用户权限执行任意代码。该漏洞影响多个 Windows 版本，CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:50Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 KB5049981，可通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载安装。如无法立即打补丁，建议限制用户打开来自不受信任来源的媒体文件，并禁用不必要的 DirectShow 组件作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Direct Show 远程代码执行漏洞"
updated = "2026-06-17T08:43:00Z"

