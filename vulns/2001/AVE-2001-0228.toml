[basic]
description = "diffutils 包中的 sdiff 2.7 版本存在符号链接攻击漏洞。本地攻击者可通过创建恶意符号链接，利用 sdiff 在处理临时文件时未正确检查文件类型的缺陷，诱使 sdiff 以提升的权限错误地覆盖目标文件，导致系统文件被非授权篡改或破坏。攻击条件为攻击者拥有本地用户权限并能创建符号链接，属于典型的 TOCTOU 竞态条件利用。"
published = "2001-03-12T05:00:00Z"
remediation = "建议升级 diffutils 至 2.7 以上版本，或安装对应发行版的安全补丁：Red Hat Linux 用户安装 RHSA-2001-116 提供的更新包；Mandrake Linux 用户安装 MDKSA-2001-008 更新；Immunix 用户安装 IMNX-2000-70-028-01 更新。如无法升级，避免在不可信目录下以 root 权限运行 sdiff，并使用 umask 限制临时文件权限作为临时缓解措施。"
score = 1.2
severity = "LOW"
sources = ["cve"]
title = "GNU diffutils sdiff 本地文件覆盖漏洞"
updated = "2026-06-16T21:53:41Z"

