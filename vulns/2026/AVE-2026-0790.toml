[basic]
description = "OnionShare CLI/Desktop 2.6.3 及之前版本中存在符号链接跟随漏洞。当用户共享一个包含攻击者提供的或不可信的符号链接的目录时，SendBaseModeWeb.set_file_info() 和 stream_individual_file() 函数在处理文件索引和流式传输时未拒绝符号链接，导致远程接收方可通过 Website 模式、Share 单文件下载模式或默认 ZIP 下载方式读取共享目录之外的本地文件。攻击者需要诱导 OnionShare 用户共享包含恶意符号链接的目录，并获取 OnionShare 服务地址，即可窃取 SSH 密钥、浏览器数据、钱包文件等敏感信息。该漏洞已在 2.6.4 版本中修复。"
published = "2026-07-31T17:16:33Z"
remediation = "立即升级 OnionShare 至 2.6.4 或更高版本，该版本已修复符号链接跟随问题。如无法立即升级，在共享目录前手动检查并移除所有符号链接文件，避免共享包含不可信来源文件的目录作为临时缓解措施。"
score = 4.8
severity = "MEDIUM"
sources = ["ghsa"]
title = "OnionShare OnionShare CLI/Desktop 符号链接跟随任意文件读取漏洞"
updated = "2026-07-31T19:17:10Z"

