[basic]
description = "Windmill 存在资源作用域 API 令牌授权绕过漏洞。该平台支持格式为 `{domain}:{action}[:{resource}]` 的作用域令牌，但路由级作用域检查仅验证令牌的 domain 和 action，未对 resource/path 部分进行校验。攻击者持有路径受限的 `scripts:read:{resource}` 令牌时，可通过 `GET /api/w/{workspace}/scripts/list_search` 端点获取工作区中所有脚本的 path 和 content，而不仅限于其被授权的路径前缀。这可能导致内部自动化逻辑、集成详情、业务逻辑、内联配置甚至硬编码的凭据泄露。攻击者无需管理员权限，仅需持有有效的资源作用域 API 令牌即可利用。该漏洞影响 Windmill <= 1.714.1 版本。"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 windmill 升级到 1.715.0 或更高版本（`cargo update -p windmill-api` 或从 GitHub Releases 下载新版本部署）。如无法立即升级，可在反向代理层（Nginx/Cloudflare）对 `GET /api/w/{workspace}/scripts/list_search` 端点添加访问控制，限制仅允许拥有完整 `scripts:read` 权限的 token 访问，或临时禁用资源级 scope token 的脚本读取功能作为缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Windmill 资源作用域API令牌路径限制绕过漏洞"
updated = "2026-01-01T00:00:00Z"

