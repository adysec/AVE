[basic]
description = "PGP 5.x/6.x/7.0 版本的 ASCII Armor 解析器存在任意文件创建漏洞。该漏洞源于解析器在处理畸形 ASCII 装甲文件时，未正确验证文件路径，导致攻击者可通过构造恶意 ASCII 装甲文件，在目标系统任意位置创建文件。影响范围为 Windows PGP 7.0.3 及更早版本。攻击条件为本地访问权限（AV:L），攻击复杂度低（AC:L），无需身份认证（Au:N），仅影响完整性（I:P），CVSS 评分 2.1。利用方式为诱导用户导入或处理恶意构造的 ASCII 装甲文件，触发解析器缺陷实现任意文件写入。"
published = "2001-06-18T04:00:00Z"
remediation = "升级到 PGP 7.0.4 或更高版本，该版本已修复 ASCII Armor 解析器的路径遍历漏洞。在打补丁前，不要打开或处理来自不受信任来源的 ASCII armored 文件（.asc/.sig），避免点击邮件或即时消息中的此类附件。对于加密签名验证操作，应仅处理来自已知可信发送方的 armored 文件，防止攻击者利用恶意 armored 文件在系统任意位置创建文件。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "PGP ASCII Armor 解析器 任意文件创建漏洞"
updated = "2026-06-16T21:53:59Z"

