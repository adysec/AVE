[basic]
description = "Netscape Fasttrack Server 4.1 的缓存模块存在资源消耗型拒绝服务漏洞。远攻击者无需身份认证，通过网络可达即可触发，攻击条件为可向目标服务器持续发送大量不存在的 URL 请求。由于缓存模块会对每个未命中项进行资源分配与缓存处理，大量的无效 URL 请求将导致服务器内存等缓存资源被迅速耗尽，进而使服务器无法正常处理合法用户的访问请求，造成拒绝服务。该漏洞影响面为运行 Netscape Fasttrack Server 4.1 的所有平台，危害等级中危（CVSS 5.0），攻击者仅需构造大量恶意请求即可实施拒绝服务攻击。"
published = "2001-03-26T05:00:00Z"
remediation = "该漏洞源于缓存模块对大量不存在 URL（如 .html）的请求进行缓存且不及时释放，导致服务器内存被耗尽、响应迟缓。厂商已明确回复 Fasttrack Server 不适用于生产环境，且不会修复此问题，因此**无官方补丁可用**。强烈建议立即停用该产品，迁移至受支持的 iPlanet/Netscape Enterprise Server 4.1 SP5 或后续维护的 Web 服务器（如 Sun Java System Web Server），并设置合理的缓存上限与缓存回收策略。如无法立即迁移，应在前端部署反向代理（如 Nginx）并开启请求速率限制，同时在防火墙或路由器上配置访问控制列表（ACL），仅允许可信来源 IP 访问该服务，将其限制在内网隔离区，以降低被利用的风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Netscape Fasttrack Server 4.1 缓存模块拒绝服务漏洞"
updated = "2026-06-16T21:53:48Z"

