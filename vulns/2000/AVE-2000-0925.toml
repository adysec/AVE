[basic]
description = 'Bajie HTTP 服务器 0.30a 版本存在目录遍历漏洞，未经身份认证的远程攻击者可通过在 URL 中插入 "...." 字符序列，绕过服务器的路径检查机制，从而任意读取服务器上的敏感文件。该漏洞影响运行 Bajie HTTP web server 0.30a 的系统，攻击者仅需构造包含特制路径的 HTTP 请求即可发起攻击，无需提供有效凭据或进行复杂交互。成功利用该漏洞可导致服务器敏感文件泄露，CVSS 评分 5.0，危害等级为中危。建议管理员升级至更高版本或应用相关安全补丁以消除此风险。'
published = "2000-10-20T04:00:00.000"
remediation = '升级 Bajie HTTP server 至存在官方修复的版本以消除目录遍历漏洞；若该服务器已停止维护且无补丁，建议替换为 Apache、Nginx 等持续更新的 Web 服务器。临时缓解措施：在反向代理或防火墙层配置 URL 过滤规则，拒绝包含连续点号序列（如 "...."）的 HTTP 请求，并对 Web 根目录设置严格的访问权限，禁止向外部暴露系统敏感文件。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Bajie HTTP web server 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:52:27.073"

