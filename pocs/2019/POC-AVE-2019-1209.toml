[info]
author = "ave"
description = "检测 Barco wePresent 等路由器产品的 file_transfer.cgi 端点的命令注入漏洞。通过注入 shell 命令验证攻击者可远程获得 root 权限。"
id = "POC-AVE-2019-1209"
name = "Barco wePresent file_transfer.cgi 命令注入漏洞 PoC"
severity = "critical"
tags = ["ave-2019-1209"]
vuln_id = [
    "CVE-2019-3929",
    "AVE-2019-1209",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/file_transfer.cgi"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["command execution failed"]
