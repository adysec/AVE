[basic]
description = "William Deich Super 3.x 的 SysLog 功能存在格式化字符串漏洞，本地攻击者可通过向 super 程序传递超长命令行参数触发该漏洞，利用格式化字符串缺陷覆盖内存关键数据，最终获取 root 权限。该漏洞影响 Linux 系统上的 super 3.x 版本，攻击向量为本地（AV:L），攻击复杂度低（AC:L），无需身份认证（Au:N），可导致机密性、完整性、可用性完全丧失（C:C/I:C/A:C），CVSS 评分 7.2。攻击者需具备本地系统访问权限，通过构造恶意格式化字符串参数实现提权。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 Super 软件包到最新版本（至少 3.20 及以上），或者应用包含修复的系统安全更新（如 Debian DSA-0139），并确保系统仅允许授权用户运行 super 命令。在升级前如无法立即修复，建议通过修改 super 配置文件禁止匿名用户访问作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "William Deich Super 3.x 格式字符串漏洞"
updated = "2026-06-16T21:58:11Z"

