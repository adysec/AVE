[basic]
description = "Microsoft SQL Server 2000 及 MSDE 中的 xp_proxiedmetadata 扩展存储过程函数存在缓冲区长度未正确限制的漏洞。当调用 SQL Server 扩展存储过程 API 中的 srv_paraminfo 函数时，未对输入参数缓冲区长度进行有效校验，导致攻击者可通过向该函数传递特制的超长参数触发缓冲区溢出，造成拒绝服务或执行任意命令。该漏洞要求攻击者具有本地登录权限，无法远程直接利用。微软已在相关安全更新中修复此问题。"
published = "2001-01-09T05:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-092 提供的补丁程序。SQL Server 7.0 用户需先安装 Service Pack 2 再应用补丁；SQL Server 2000 用户直接应用此补丁。如无法立即打补丁，建议限制对 SQL Server 的远程访问权限，仅允许受信任用户连接，并确保 SQL Server 服务以最低权限账户运行，避免使用管理员账户。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft SQL Server 2000 扩展存储过程参数解析缓冲区溢出漏洞"
updated = "2026-06-16T21:53:07.320"

