[basic]
description = "Google Chrome 15.0.874.102 之前版本中存在释放后重用（Use-After-Free）漏洞，源于 CSS 标记序列（token-sequence）数据处理不当，导致已释放的内存仍被引用。远程攻击者可通过诱导用户访问特制网页触发该漏洞，造成浏览器崩溃拒绝服务，或可能实现任意代码执行。该漏洞影响所有低于 15.0.874.102 版本的 Google Chrome 浏览器，CVSS 评分 7.5，危害等级高。Google 已在 Chrome 15.0.874.102 版本中修复此漏洞。"
published = "2011-10-25T19:55:01Z"
remediation = "升级 Google Chrome 至 15.0.874.102 或更高版本，该版本修复了 CSS token-sequence 数据释放后重用的内存错误。对于无法立即升级的环境，可禁用 WebKit 渲染引擎中 CSS 解析器的部分功能作为临时缓解措施，或使用 Chrome 自动更新功能确保及时获取安全补丁。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome 释放后使用漏洞"
updated = "2026-06-16T23:34:05Z"

