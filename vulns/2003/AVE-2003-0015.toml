[basic]
description = "XFree86 4.2.0 及之前版本中的 xterm 终端模拟器存在转义序列注入漏洞。攻击者可通过构造包含特殊转义字符序列的恶意文件（如日志或文本文件），当用户使用 cat、less 等命令查看该文件时，xterm 会解析其中的转义序列并修改终端窗口标题，随后将标题内容回注入命令行缓冲区，导致任意命令在用户终端中执行。该漏洞利用条件为用户主动查看恶意文件，影响所有使用受影响 xterm 版本的 Linux/Unix 系统，CVSS 评分 7.3，危害等级高。"
published = "2003-03-03T05:00:00Z"
remediation = '升级 XFree86 至 4.2.1 或更高版本。Red Hat 用户安装 RHSA-2003:064/065/066/067 提供的更新包；Debian 用户安装 DSA-380 提供的 xfree86 更新包。如无法升级，可在 xterm 启动时添加 -xrm "XTerm*allowTitleOps: false" 参数禁用窗口标题转义序列操作，或使用其他终端模拟器（如 rxvt）替代 xterm。'
score = 7.3
severity = "HIGH"
sources = ["redhat"]
title = "XFree86 xterm 终端模拟器转义序列注入漏洞"
updated = "2026-06-16T22:01:26Z"

