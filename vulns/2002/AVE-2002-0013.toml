[basic]
description = "OSSP mm 共享内存库（libmm）1.2.0 之前版本在处理临时文件时存在符号链接攻击漏洞。本地 Apache 用户可通过创建恶意的符号链接指向系统关键文件，诱使 libmm 以提升的权限操作这些临时文件，从而获取更高权限。攻击条件为拥有本地 Apache 用户访问权限，利用方式简单，危害较大，可导致本地权限提升。建议升级至 libmm 1.2.0 或更高版本。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 OSSP mm library (libmm) 至 1.2.0 或更高版本，该版本修复了临时文件创建中的竞态条件问题。如无法立即升级，确保 Apache 用户对临时目录（如 /tmp）的写入权限受到严格限制，并启用文件系统保护机制（如设置 sticky bit）防止符号链接攻击。"
score = 6.2
severity = "MEDIUM"
sources = ["exploitdb"]
title = "OSSP mm 共享内存库临时文件权限提升漏洞"
updated = "2026-06-16T21:57:53Z"

