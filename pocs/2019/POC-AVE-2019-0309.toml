[info]
author = "AVE"
description = "检测 Mozilla Firefox Prompt:Open IPC 沙箱逃逸漏洞。通过向目标 Firefox 用户发送特制 HTML 页面，利用 CVE-2019-9810 在内容进程获得代码执行后，通过 Prompt:Open IPC 消息欺骗父进程打开攻击者控制的 URL，实现沙箱逃逸。完整利用链参考 0vercl0k/CVE-2019-11708。"
id = "POC-AVE-2019-0309"
name = "CVE-2019-11708 PoC"
severity = "critical"
tags = [
    "cve-2019-11708",
    "sandbox-escape",
    "firefox",
]
vuln_id = [
    "CVE-2019-11708",
    "AVE-2019-0309",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Mozilla Firefox",
    "Firefox",
]
