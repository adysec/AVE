[info]
author = "ave"
description = "验证 Google Chrome WebRTC 模块中是否存在不恰当实现导致的任意内存读写漏洞。通过构造包含恶意 WebRTC 内容的 HTML 页面，检测浏览器是否在 143.0.7499.41 版本之前存在可利用的内存读写原语。"
id = "POC-AVE-2025-0570"
name = "CVE-2025-13639 PoC"
severity = "high"
tags = ["ave-2025-0570"]
vuln_id = [
    "CVE-2025-13639",
    "AVE-2025-0570",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/webRTC-poc.html"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = [
    "read/write",
    "WebRTC",
    "arbitrary memory",
]
