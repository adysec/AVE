[basic]
description = "Oracle MySQL 数据库服务器的 DDL 组件存在权限分配不当漏洞（CWE-732）。具有高权限且通过网络访问的攻击者可利用多种协议向 MySQL Server 发送特制请求触发该漏洞，成功利用可导致数据库服务挂起或频繁重复崩溃，造成完全拒绝服务（DOS）。该漏洞影响 MySQL 8.0.0 至 8.0.41、8.4.0 至 8.4.4 以及 9.0.0 至 9.2.0 版本，CVSS 3.1 基础评分为 4.9，危害等级为中危。"
published = "2025-04-15T21:15:53.910"
remediation = "立即升级 MySQL Server 至 Oracle CPU April 2025 安全补丁版本：8.0 系列升级至 8.0.42 或更高版本，8.4 系列升级至 8.4.5 或更高版本，9.0 系列升级至 9.2.1 或更高版本。可通过 Oracle 官方补丁文档 (Doc ID 3078827.1) 获取补丁包，或使用系统包管理器安装对应版本的安全更新。如无法立即升级，建议在防火墙层面仅允许受信任的 IP 地址访问 MySQL 端口 (3306/TCP)，并限制高权限账户的网络访问权限，以降低被攻击的风险。"
score = 4.9
severity = "MEDIUM"
sources = ["msrc"]
title = "Oracle MySQL Server DDL 拒绝服务漏洞"
updated = "2026-06-17T08:43:47.057"

