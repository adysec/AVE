[basic]
description = "Windows MapUrlToZone 安全功能存在绕过漏洞，该 API 用于将 URL 映射到 Internet、本地 Intranet、受信任站点等安全区域。攻击者可利用特制 URL 绕过区域安全检查，诱使用户点击恶意链接后，将本应归入受限区域的 URL 错误映射到低安全区域，导致浏览器或应用程序的安全策略被绕过，造成敏感信息泄露。该漏洞攻击复杂度低，无需身份认证，但需要用户交互。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:57.733"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新（KB5050061），或通过 Windows Update 自动获取更新。受影响版本包括：Windows 10 1507 升级至 10.0.10240.20890 及以上、Windows 10 1809 升级至 10.0.17763.6775 及以上、Windows 11 24H2 升级至 10.0.26100.2894 及以上、Windows Server 2025 升级至 10.0.26100.2894 及以上。如无法立即打补丁，可配置组策略将 Internet Explorer 安全区域设置为高等级，并禁用从 Internet 区域启动本地内容的功能作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows MapUrlToZone 安全功能绕过漏洞"
updated = "2026-06-17T08:43:06.930"

