[basic]
description = "Apple iTunes 9.2 之前版本（Windows 平台）及 Apple iOS 4 之前版本（iPhone/iPod touch）中集成的 WebKit 引擎在处理 HTML 表格时存在越界内存访问漏洞。远程攻击者可构造特制 HTML 文档，通过诱导用户访问恶意网页触发该漏洞，成功利用可导致任意代码执行或应用程序崩溃。CVSS 评分 10.0，攻击复杂度低，无需身份认证，影响系统机密性、完整性和可用性。"
published = "2010-06-18T16:30:01Z"
remediation = "立即将 Apple iTunes 升级至 9.2 或更高版本（Windows 平台），iPhone/iPod touch 用户升级至 iOS 4 或更高版本。该漏洞在 iTunes 9.2 及 iOS 4 中已修复，通过 Apple Software Update 或 iTunes 内置更新功能即可获取。无法升级时，避免在受影响设备上打开不可信的 HTML 文档或网页。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple iTunes WebKit 表格处理越界内存访问远程代码执行漏洞"
updated = "2026-06-16T23:19:17Z"

