[basic]
description = "X.Org X 服务器在处理 XKB 兼容映射时存在整数下溢漏洞，具体位于 XKB 兼容映射表（compatibility map）的处理逻辑中。由于未对输入数据进行正确的边界检查，攻击者可通过本地或远程 X11 服务器访问，向受影响系统发送特制的 XKB 数据触发缓冲区越界读取，导致内存安全违规，进而造成拒绝服务（DoS）或潜在的其他严重影响。该漏洞影响 X.Org X Server 及 XWayland 组件，攻击复杂度低，需低权限即可利用，CVSS 评分 7.8，危害等级高。"
published = "2026-04-23T16:16:24.623"
remediation = "建议立即升级 xorg-x11-server 至修复版本：RHEL 7 ELS 升级至 xorg-x11-server 1.20.4-34.el7_9，RHEL 8/9/10 升级至 xorg-x11-server-Xwayland 24.1.5-6.el10_1 及以上版本，对应 RHSA-2026:10739 等安全公告。TigerVNC 用户升级至 1.1.0-25.el6_10.16（RHEL 6 ELS）或 1.8.0-36.el7_9.4（RHEL 7 ELS）。Debian/Ubuntu 用户通过包管理器安装对应安全更新。临时缓解措施：限制不可信用户对 X11 服务器的本地访问权限，或在无需 X11 转发的场景下禁用 X11Forwarding。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "X.Org X Server XKB兼容映射表整数下溢漏洞"
updated = "2026-07-15T02:20:27.840"

