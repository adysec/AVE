[basic]
description = "TrendAI Vision One 的 Service Gateway 注册处理逻辑中存在不正确的权限分配漏洞（CWE-266）。该漏洞允许已通过身份认证的远程攻击者利用 Service Gateway 注册过程中的权限校验缺陷，将自身权限提升至本应受保护的高敏感资源访问级别。攻击者只需具备低权限账户即可通过网络远程触发该漏洞，无需用户交互。该漏洞影响 Trend Micro TrendAI Vision One 产品，CVSS 评分 7.8，危害等级高。Trend Micro 已发布安全更新修复此漏洞，建议用户及时升级至最新版本。"
published = "2025-01-01T00:00:00Z"
remediation = "确保 TrendAI Vision One Service Gateway 已更新至 2025 年 12 月或之后的月度维护版本（SaaS 平台自动推送，无需手动操作）。如未启用自动更新，请在管理控制台中开启月度维护自动更新功能。作为临时缓解措施，审查并限制可执行 Service Gateway 注册操作的用户角色，仅授予必要的最小权限。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "Trend Micro TrendAI Vision One 不正确权限分配权限提升漏洞"
updated = "2025-01-01T00:00:00Z"

