[basic]
description = "Flowise 是一个用于构建大语言模型流程的拖放式用户界面。在 3.1.3 版本之前，针对 CVE-2025-8943 的缓解措施虽已拦截 npx 命令的 -y 和 --yes 标志以防止自动安装任意软件包，但其环境变量校验逻辑仅通过精确字符串匹配禁止了 PATH、LD_LIBRARY_PATH、DYLD_LIBRARY_PATH 和 NODE_OPTIONS 四个变量。由于 npm 会从 npm_config_* 格式的环境变量中读取配置，攻击者可通过设置 npm_config_yes=true 复现 --yes 标志的行为，使 npx 在无提示的情况下自动安装并执行指定软件包。该漏洞影响 Flowise 3.1.1 版本，在默认无认证部署的情况下，任何能够访问 Flowise API 的未认证远程攻击者均可利用此绕过实现远程代码执行，且无需任何凭据。CVSS 评分为 8.7，危害等级为高。"
published = "2026-08-04T17:17:01Z"
remediation = "立即升级 Flowise 至 3.1.3 或更高版本，官方修复已剥离子进程环境变量或以白名单替代黑名单验证。如暂时无法升级，可在反向代理层限制 MCP 接口（/api/v1/mcp）访问权限，或暂时禁用 Custom MCP Server 功能作为临时缓解措施。"
score = 8.7
severity = "HIGH"
sources = ["ghsa"]
title = "Flowise MCP 环境变量黑名单绕过未授权远程代码执行漏洞"
updated = "2026-08-04T18:16:56Z"

