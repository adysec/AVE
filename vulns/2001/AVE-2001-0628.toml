[basic]
description = "tags.<value>ImageCast Control Center 4.1.0 版本存在拒绝服务漏洞。该软件监听 TCP 12002 端口，远程攻击者无需身份认证即可向该端口发送超长字符串数据，触发系统资源耗尽或程序崩溃，使合法用户无法正常使用服务。受影响范围为 Storagesoft ImageCast Control Center 4.1.0 版本，攻击者可在任何网络位置发起攻击，无需事先获取系统凭据或交互权限。攻击者仅需构造包含超长字符串的网络数据包并发送至目标主机的 12002 端口即可触发漏洞，导致服务拒绝。"
published = "2001-03-12T05:00:00.000"
remediation = "立即升级 Storagesoft ImageCast IC3 至厂商发布的最新补丁版本，或升级至 4.2 及以上版本以修复端口 12002 的长字符串输入验证缺陷。如暂无法升级，应在边界防火墙和主机防火墙中禁用对 12002/tcp 端口的外部访问，仅允许受信任的管理网段 IP 连接，并配置入侵检测系统监控该端口的异常长数据包。同时建议在 ImageCast Control Center 服务前部署 TCP 连接速率限制和会话超时策略，防止资源耗尽型拒绝服务攻击。如 Storagesoft 已停止支持该产品，建议迁移至同类型 CDN 或缓存管理系统的现行版本。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Storagesoft ImageCast Control Center 远程拒绝服务漏洞"
updated = "2026-06-16T21:53:41.717"

