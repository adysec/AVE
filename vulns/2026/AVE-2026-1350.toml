[basic]
description = "AnyDesk 屏幕录制文件处理过程中存在符号链接跟随漏洞（CWE-59），本地攻击者在获取目标系统低权限代码执行能力后，可通过创建目录联接（junction）的方式滥用 AnyDesk 服务进程的权限创建任意文件，从而在受影响系统上造成拒绝服务。该漏洞影响 AnyDesk 9.0.4 版本，攻击向量为本地，攻击复杂度低，无需用户交互，成功利用可导致系统可用性完全丧失。CVSS 3.1 评分 5.5，危害等级中等。"
