[basic]
description = "HP-UX FTPD 存在格式化字符串漏洞，远程攻击者无需身份认证即可通过向 FTP 服务的 PASS 命令发送特制的格式化字符串，触发该漏洞，导致目标系统拒绝服务或以 ftpd 进程权限执行任意代码。该漏洞影响 HP-UX 10.20 版本，CVSS 评分 10.0，危害等级严重。目前已有公开利用代码，建议立即升级至修复版本。"
published = "2000-10-20T04:00:00.000"
remediation = "立即安装 HP 针对此漏洞发布的安全补丁（HP Security Bulletin HPSBUX0008-121），升级 ftpd 至修复版本。如无法立即打补丁，可在 /etc/inetd.conf 中注释 ftp 行并重启 inetd 以禁用 FTP 服务，或在防火墙层面限制对 21/TCP 端口的访问仅允许可信 IP。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "HP-UX FTPD 格式化字符串远程代码执行漏洞"
updated = "2026-06-16T21:52:17.697"

