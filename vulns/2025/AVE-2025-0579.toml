[basic]
description = "OpenSC 的 libopensc 库中存在多个未初始化变量的使用漏洞。攻击者可以通过构造特殊的 USB 设备或智能卡，在向系统发送精心设计的 APDU 响应时触发该漏洞。由于程序在处理这些响应时使用了未初始化的变量，可能导致内存中的敏感信息泄露或触发应用程序崩溃（DoS）。该漏洞影响使用 libopensc 的智能卡管理系统，攻击者需要具备物理接触权限且构造复杂的恶意响应方可利用。"
published = "2026-04-23T13:16:09Z"
remediation = "建议立即将 OpenSC 升级至 0.25.0 或更高版本。若无法立即升级，可通过限制连接不可信的 USB 智能卡设备或使用受限的硬件驱动环境来减轻由恶意设备触发未初始化变量导致的崩溃或信息泄露风险。"
score = 5.7
severity = "MEDIUM"
sources = ["msrc"]
title = "OpenSC libopensc 未初始化变量导致信息泄露或崩溃漏洞"
updated = "2026-06-30T07:16:30Z"

