[basic]
description = 'PHP 3.x 运行于 Apache 1.3.6 时存在路径遍历漏洞，未经身份认证的远程攻击者可通过构造包含 "%5c"（编码反斜杠）的变体 ".."（点号点号）序列，绕过 PHP 的文件路径校验机制，从而读取服务器上的任意文件。该漏洞影响运行 PHP 3.x 的 Apache 1.3.6 及可能受影响的早期版本，攻击者只需向目标 Web 服务器发送特制 HTTP 请求即可触发，无需事先认证。成功利用后，攻击者可窃取如 /etc/passwd、配置文件等敏感文件内容，进而为进一步渗透提供信息支撑。CVSS 评分 5.0，危害等级中等。'
published = "2001-02-16T05:00:00Z"
remediation = "立即将 PHP 3.x 升级至 PHP 4.0 或更高版本，PHP 3 已停止维护且该路径遍历漏洞在 PHP 4 中已修复；同时将 Apache 升级至 1.3.7 或更高版本以加强路径规范化处理。如暂时无法升级，可在 Apache 配置中使用 mod_rewrite 拦截包含 %5c 或连续点号的反斜杠编码请求，或禁用 .php3 等旧扩展名的解析。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Apache PHP 3 文件泄露漏洞"
updated = "2026-06-16T21:53:32Z"

