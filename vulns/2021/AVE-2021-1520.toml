[basic]
description = "Google Chrome 浏览器在 93.0.4577.82 版本之前的索引数据库（IndexedDB）API 中存在释放后使用漏洞。当渲染器进程已被攻破时，远程攻击者可通过诱骗用户访问包含特制 HTML 页面的网站触发该漏洞，利用内存损坏实现沙箱逃逸，进而获取宿主机的高权限代码执行能力。该漏洞影响 Google Chrome 桌面端及基于 Chromium 的浏览器，CVSS 评分 9.6，危害等级严重，已被美国网络安全和基础设施安全局（CISA）列入已知被利用漏洞目录。"
published = "2021-10-08T21:15:07Z"
remediation = "立即将 Google Chrome 升级到 93.0.4577.82 或更高版本。通过 Chrome 菜单「设置」→「关于 Chrome」启用自动更新。如暂无法升级，可临时在 chrome://flags 中启用 Strict Site Isolation 功能，并避免访问不可信网站以降低被利用风险。"
score = 9.6
severity = "CRITICAL"
sources = ["kev"]
title = "Google Chrome IndexedDB API 释放后使用沙箱逃逸漏洞"
updated = "2026-06-17T03:50:36Z"

