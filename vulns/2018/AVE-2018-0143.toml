[basic]
description = "OpenMRS 平台在 2.24.0 版本之前存在不安全的对象反序列化漏洞。未经身份认证的远程攻击者可通过向目标系统发送包含恶意构造 XML 数据的请求体，利用 Java 反序列化机制在服务器端执行任意系统命令，最终完全控制目标服务器。该漏洞影响所有运行受影响版本 OpenMRS 的医疗信息系统，攻击条件简单，无需凭据即可远程利用。"
published = "2019-03-21T16:00:30Z"
remediation = """将 OpenMRS 的 webservices.rest 模块升级到 2.24.0 或更高版本，或将 OpenMRS Platform 升级到 2.24.0 及以上版本，同时将 OpenMRS Reference Application 升级到 2.8.1/2.7.2/2.6.2 等对应补丁版本。升级后检查应用日志中是否存在字符串 "Failed to convert value of type 'java.util.HashMap' to required type 'org.openmrs.module.webservices.rest.SimpleObject'"，以确认系统是否曾遭受利用尝试。注意：仅依赖 IP 白名单限制 Webservices 模块访问并不能防御此漏洞，必须通过版本升级修复。如暂时无法升级，建议在防火墙或反向代理层面阻断对 /ws/rest/ 路径的外部访问作为临时缓解措施。"""
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "OpenMRS Platform 不安全的对象反序列化漏洞"
updated = "2026-06-17T01:49:03Z"

