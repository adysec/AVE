[basic]
description = "Linux内核DRM子系统的radeon显卡驱动中，radeon_vce_cs_parse()函数存在未初始化变量安全问题。当攻击者通过ioctl()系统调用向该函数提交特制的命令流，且首个命令为编码操作（case 0x03000001）时，函数会试图将尚未被赋值的tmp变量作为size参数传递给radeon_vce_cs_reloc()，导致传递给底层函数的参数值不可预测。该漏洞影响使用radeon显卡及对应内核驱动的Linux系统，攻击者需具备本地用户权限，可通过构造异常命令流触发该漏洞，进而可能导致系统拒绝服务或未定义行为。Linux Verification Center通过静态分析工具SVACE发现此问题，修复方案是将tmp变量初始化为0，确保radeon_vce_cs_reloc()能及时捕获此类异常输入。"
published = "2025-04-03T08:15:15Z"
remediation = "建议将 Linux 内核升级至包含补丁 commit 2d52de55f9ee7aaee0e09ac443f77855989c6b68 的稳定版本：Debian 11 升级至 5.10.237-1（DLA-4178-1）或 6.1.137-1（DLA-4193-1），Debian 12 升级至 6.1.133-1（DSA-5900-1），Ubuntu 20.04 升级至 5.4.0-218.238，Ubuntu 22.04 升级至 5.15.0-142.152，Ubuntu 24.04 升级至 6.8.0-84.84。如暂无法立即升级，可通过内核启动参数 modprobe.blacklist=radeon 禁用 radeon 模块，或通过 udev 规则限制本地用户对 /dev/dri/card* 设备的访问权限作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Kernel Radeon DRM 未初始化变量使用漏洞"
updated = "2026-06-17T08:44:48Z"

