[basic]
description = "LBNL Traceroute 1.4a5 及更早版本的 savestr 函数中存在堆溢出漏洞。本地攻击者可通过向 traceroute 程序的 -g 选项（用于设置松散源路由）传递特制参数，触发堆缓冲区溢出，从而以提升的权限执行任意命令。该漏洞需要本地访问权限，但利用复杂度低，成功利用后可完全控制目标系统，造成机密性、完整性和可用性全部丧失。"
published = "2000-12-19T05:00:00.000"
remediation = "立即升级 LBNL traceroute 至 1.4a6 或更高版本。各发行版用户请安装对应安全更新：Debian 升级 traceroute 至 1.4a5-3，Red Hat 应用 RHSA-2000-078 补丁，Caldera 应用 CSSA-2000-034.0。如无法升级，建议移除 traceroute 的 setuid root 权限（chmod u-s /usr/sbin/traceroute）作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "LBNL Traceroute 堆溢出本地权限提升漏洞"
updated = "2026-06-16T21:52:50.113"

