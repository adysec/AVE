[basic]
description = "Cisco IDS Device Manager 3.1.2 之前版本的 Web 服务器存在目录遍历漏洞。远程攻击者无需身份认证，通过在 HTTPS 请求中发送包含 `..`（点点）序列的特制 URL，即可突破路径限制读取服务器上的任意文件，导致敏感信息泄露。该漏洞影响 Cisco IDS Device Manager 3.1.1 及更早版本，攻击复杂度低，仅需网络访问即可利用。"
published = "2002-10-04T04:00:00Z"
remediation = "升级 Cisco IDS Device Manager 至 3.1.2 或更高版本以修复目录遍历漏洞。如无法立即升级，可在网络边界防火墙限制对 HTTPS 管理端口的访问，仅允许受信任 IP 连接。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Cisco IDS Device Manager 目录遍历漏洞"
updated = "2026-06-16T21:58:22Z"

