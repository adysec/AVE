[info]
author = "ave"
description = "Apple Safari 6.0 之前版本 WebKit 渲染引擎远程代码执行漏洞验证，通过构造恶意网页触发内存损坏"
id = "POC-AVE-2012-0295"
name = "CVE-2012-3620 PoC"
severity = "high"
tags = ["ave-2012-0295"]
vuln_id = [
    "CVE-2012-3620",
    "AVE-2012-0295",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
