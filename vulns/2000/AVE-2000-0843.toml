[basic]
description = "PostgreSQL 6.3.2 和 6.5.3 版本在系统上以明文形式存储数据库用户名和密码，分别保存在 pg_shadow 和 pg_pwd 系统文件中，未进行任何加密保护。该漏洞影响早期 Linux/Unix 平台上的 PostgreSQL 数据库部署，CVSS v2 评分 4.6。攻击条件要求攻击者已具备对数据库服务器文件系统的读取权限（如通过本地 shell 访问、Web 目录遍历或其他本地漏洞获取），可直接读取上述系统文件获取数据库管理员和普通用户的明文凭据。利用方式极为简单，攻击者无需网络交互或身份认证，仅需在操作系统层面访问数据库数据目录，即可通过 cat、more 或类似命令提取完整密码哈希乃至明文，进而直接登录数据库，造成数据泄露、数据篡改或数据库服务中断等严重后果。"
published = "2001-08-31T04:00:00Z"
remediation = "立即将 PostgreSQL 升级至 7.0 及以上版本，修复敏感数据以明文存储的系统表。同时修改 pg_hba.conf，将本地认证方式改为 md5 或 ident，并设置 pg_shadow 文件权限为 0600、属主为 postgres 用户，禁止普通用户读取。若无法立即升级，可临时通过 chmod 600 限制 pg_pwd 与 pg_shadow 文件访问权限，并清理 web 目录下可能泄露的旧备份文件，降低本地提权风险。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "PostgreSQL 6.3.2/6.5.3 明文存储密码漏洞"
updated = "2026-06-16T21:53:21Z"

