[basic]
description = "Macromedia ColdFusion MX（即 ColdFusion 6.0）的 404 错误页面存在跨站脚本（XSS）漏洞。当用户访问不存在的模板文件（Missing Template）时，服务器生成的 404 错误信息会将未经验证过滤的请求 URL 或参数内容直接回显到错误页面中，且未对特殊字符进行 HTML 实体编码。攻击者只需构造包含恶意脚本代码的 URL 链接，诱导受害者点击，即可在受害者的浏览器会话中执行任意脚本，进而窃取会话 Cookie、劫持会话或实施钓鱼攻击。该漏洞危害中等，攻击无需任何认证，任何运行受影响版本 ColdFusion 的 Web 服务器均可能被利用。官方已建议升级到不受影响的版本并对 404 错误页面输出进行严格过滤以规避该风险。"
published = "2002-12-31T00:00:00Z"
remediation = "建议升级到 ColdFusion MX 官方发布的修复版本（6.1 及更高版本），该版本已修复缺失模板 404 错误页面未正确转义用户输入的问题，防止脚本注入。若无法立即升级，可在 Web 服务器（IIS/Apache）层面对 404 错误页面进行自定义重写，确保所有返回的错误信息对用户可输入内容进行 HTML 实体编码；同时在应用程序入口处对 URL 参数和路径进行过滤，剔除小于号、大于号等危险字符；并配置安全头（如开启 HttpOnly、Content-Security-Policy）以降低脚本注入后的利用影响。此为 2002 年旧漏洞，常年无补丁治理的场景建议直接迁移至受支持的 ColdFusion 版本。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Macromedia ColdFusion MX 模板缺失页面跨站脚本漏洞"
updated = "2002-12-31T00:00:00Z"

