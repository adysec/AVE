[basic]
description = "Linux 内核 vfio/platform 子系统中，read/write syscalls 未对用户空间传入的 count 和 offset 参数进行充分边界校验，仅对 offset 做了 40 位上限限制，攻击者可通过构造超出设备内存映射范围的偏移量和长度，触发越界读写操作。该漏洞影响搭载 vfio/platform 驱动的 Linux 内核版本，攻击者需具备本地低权限访问权限，无需用户交互即可利用。成功利用可导致内核内存信息泄露或权限提升，进而获取系统控制权。建议用户将内核升级至修复该漏洞的稳定版本以消除风险。"
published = "2025-02-10T16:15:38.207"
remediation = "升级Linux内核到已修复版本：5.4.290、5.10.234、5.15.178、6.1.128、6.6.75、6.12.12或更高版本。Debian/Ubuntu系统可执行apt update && apt upgrade安装linux-image更新包；RHEL/CentOS系统使用yum update kernel或dnf update kernel安装最新内核。更新后重启系统使新内核生效。若短期内无法升级，可通过chmod 660 /dev/vfio/*并设置专属用户组的方式限制本地非特权用户对vfio设备的访问，临时缓解越界读写风险。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 vfio/platform 越界读写漏洞"
updated = "2026-07-30T06:19:12.340"

