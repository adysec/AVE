[basic]
description = "Windows Win32k 组件在处理内存对象时存在空指针解引用漏洞，导致特权提升。攻击者可通过运行特制的恶意代码触发 SetImeInfoEx 等函数处理异常，从而从低权限账户提升至系统级（SYSTEM）权限。该漏洞影响 Windows 7、Windows Server 2008 及 Windows Server 2008 R2 等版本。攻击者需具备本地低权限执行权限即可利用此漏洞实现权限跨越。"
published = "2018-05-09T19:29:01Z"
remediation = "建议立即安装微软 2018 年 5 月发布的累积安全更新（针对 Windows 7 及 Windows Server 2008/2008 R2）。由于受影响系统已停止主流支持，建议用户升级到更高版本的 Windows 操作系统，或通过 Windows Update 安装所有可用的关键安全补丁以修复 Win32k 组件的内存处理缺陷。"
score = 7
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Win32k 特权提升漏洞"
updated = "2026-06-17T02:04:17Z"

