[basic]
description = "Microsoft Exchange Server 存在不安全反序列化漏洞（CWE-502），攻击者通过向 Exchange 控制面板（ECP）发送包含恶意序列化数据的特制请求，可在服务器上执行任意代码并获得 SYSTEM 级别权限。该漏洞影响 Microsoft Exchange Server 的 Unified Messaging 组件，是 ProxyLogon 攻击链（含 CVE-2021-26855、CVE-2021-26857、CVE-2021-26858、CVE-2021-27065）的关键组成部分。攻击者需要具备对 Exchange 服务器的网络访问权限，利用时需先通过 CVE-2021-26855 绕过身份认证，随后即可触发该漏洞实现远程代码执行，完全控制目标服务器。该漏洞已被 CISA 列入已知被利用漏洞目录，且在野已有大规模利用记录。"
published = "2021-01-01T00:00:00Z"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
