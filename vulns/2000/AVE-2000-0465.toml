[basic]
description = "DALnet Bahamut IRCd 4.6.5 存在缓冲区溢出漏洞，攻击者可通过发送特制的 SUMMON 命令触发该漏洞。未经身份认证的远程攻击者可利用此漏洞导致拒绝服务或执行任意命令。该漏洞影响运行 Bahamut IRCd 4.6.5 版本的 IRC 服务器，CVSS 评分为 10，危害等级严重。"
published = "2000-06-29T04:00:00.000"
remediation = "升级到 DALnet Bahamut IRCd 4.6.6 或更高版本，该版本已修复 SUMMON 命令的缓冲区溢出问题。如无法立即升级，可禁用 IRCd 的 SUMMON 命令功能，或在防火墙层面阻止外部对 IRC 服务端口（默认 6667）的 TCP 访问以临时缓解风险。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "DALnet Bahamut IRCd SUMMON 命令缓冲区溢出漏洞"
updated = "2026-06-16T21:52:03.320"

