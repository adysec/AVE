[basic]
description = "jaZip 0.32-2 版本的 Zip/Jaz 驱动器管理器中存在缓冲区溢出漏洞，由于程序在处理 DISPLAY 环境变量时未正确验证输入长度，本地攻击者可通过设置超长 DISPLAY 环境变量触发缓冲区溢出，从而获取 root 权限。该漏洞影响 jaZip 0.32-2 及可能更早版本，攻击者需拥有本地系统访问权限，CVSS 评分 7.2，危害等级高。"
published = "2001-03-12T05:00:00Z"
remediation = "建议立即升级 jaZip 至 Debian DSA-017 公告中提供的修复版本，或通过 apt-get upgrade jaZip 获取补丁。由于该软件年代久远已停止维护，如无法升级应彻底卸载 jaZip（apt-get remove jaZip）并移除其 setuid 权限位（chmod u-s /usr/bin/jazip），同时限制本地用户环境变量长度以防止利用。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "jaZip Zip/Jaz驱动器管理器本地缓冲区溢出漏洞"
updated = "2026-06-16T21:53:40Z"

