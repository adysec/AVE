[basic]
description = '标签之间。<value>Allaire JRun 3.0 的 HTTP Servlet 服务器在处理包含超长连续点号（"."）字符串的 URL 时存在输入验证缺陷。未经身份认证的远程攻击者只需向目标服务器发送包含大量连续 "." 字符的特制 URL 请求，即可触发服务拒绝漏洞，导致服务器进程崩溃或停止响应。该漏洞影响运行 JRun 3.0 的所有系统，攻击者无需任何凭据即可在网络上发起攻击，造成服务中断。'
published = "2000-12-11T05:00:00Z"
remediation = '建议升级至 JRun 3.0 Service Pack 1 或更高版本（如 JRun 3.1/4.0），或应用 Allaire 安全公告 ASB00-30 提供的补丁。若无法立即升级，可在 Web 服务器/前端防火墙层面配置规则拦截包含连续超过 50 个 "." 字符的 /servlet/ 路径请求，例如在 Apache 中使用 mod_rewrite：RewriteCond %{REQUEST_URI} /servlet/\.{50,} [NC] RewriteRule .* - [F,L]；或在 Nginx 中添加 location ~ /servlet/\.{50,} { deny all; } 实现临时缓解。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Allaire JRun 拒绝服务漏洞"
updated = "2026-06-16T21:53:03Z"

