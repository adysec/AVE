[basic]
description = "Inktomi Traffic Server 的 traffic_manager 组件存在缓冲区溢出漏洞。当本地用户向 traffic_manager 传递超长的 -path 参数时，会触发缓冲区溢出，攻击者可借此获取目标系统的 root 权限。该漏洞影响 Inktomi Traffic Server 4.0.18 至 5.2.2 版本、Traffic Edge 1.1.2 和 1.5.0 版本以及 Media-IXT 3.0.4 版本。由于漏洞利用仅需本地用户权限、攻击复杂度低且无需身份认证，成功利用后可完全控制受影响系统，危害等级为高危，CVSS 评分为 7.2。"
published = "2002-10-04T04:00:00.000"
remediation = "升级至 Inktomi 官方补丁版本（参见 SecurityFocus BID 5098 及 Inktomi KB 070202-003），该漏洞在后续版本中已修复。由于 Inktomi Traffic Server 已停止维护，建议迁移至其继任者 Apache Traffic Server（当前最新稳定版）。作为临时缓解措施，限制本地用户对 traffic_manager 二进制文件的执行权限，仅允许受信任的管理员账户运行，并通过系统审计日志监控 traffic_manager 的异常参数调用。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Inktomi Traffic Server traffic_manager 路径参数缓冲区溢出漏洞"
updated = "2026-06-16T21:58:33.933"

