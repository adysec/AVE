[basic]
description = "Sambar Server 4.3 及 4.4 Beta 3 版本的 ISAPI 搜索组件（search.dll）存在目录遍历漏洞。该组件在处理用户提交的 query 查询参数时，未对输入路径进行有效的过滤与安全校验，攻击者可向 search.dll 发送特制的 HTTP GET 请求，在 query 参数中传入空字节（%00）或路径分隔符（/）等特殊值，绕过 Web 根目录限制，列出并读取服务器上任意目录的内容（包括邮件文件夹、配置文件等敏感数据）。该漏洞无需任何身份认证，远程攻击者仅需能够访问目标服务器的 Web 服务即可利用，可能导致服务器敏感信息泄露。建议升级 Sambar Server 至安全版本，或禁用/移除 search.dll ISAPI 搜索组件。"
published = "2000-11-14T05:00:00.000"
remediation = "建议立即停止使用 Sambar Server，将网站迁移至当前受支持的 Web 服务器软件（如 Apache httpd 2.4+、Nginx 1.24+ 或 Microsoft IIS 10+）。若短期内无法完成迁移，应先在防火墙或访问控制列表中限制对 /search.dll 的访问，仅允许可信 IP 地址访问，或直接删除/禁用 ISAPI 搜索模块（在 Sambar 管理控制台的 ISAPI Filters 中移除 search.dll 相关映射）。迁移完成后对新服务器进行安全基线配置，关闭不必要的目录列表和 CGI 功能。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Sambar Server Search CGI 目录遍历漏洞"
updated = "2026-06-16T21:52:33.977"

