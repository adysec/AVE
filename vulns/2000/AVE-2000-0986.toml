[basic]
description = "该漏洞存在于 Eudora 邮件客户端中。Eudora 在生成虚拟名片（VCF）文件时，会将发送者主机的绝对路径信息嵌入到 VCF 文件内容之中，导致敏感信息泄露。远程攻击者无需身份认证，仅需诱导目标用户发送包含虚拟名片的电子邮件，即可获取发送者主机上的文件系统绝对路径信息。这可能暴露内部网络拓扑结构、用户名目录路径等系统信息，进而辅助攻击者实施更进一步的针对性攻击。漏洞利用难度低，攻击成本小，危害范围主要涉及 Eudora 邮件客户端用户的隐私与系统安全。建议用户及时升级至新版本以规避该风险。"
published = "2000-11-14T05:00:00Z"
remediation = "建议立即升级到 Eudora 最后官方版本：Windows 版 7.1.0.9 或 Macintosh 版 6.2.4（2006 年 10 月发布）。在“工具→选项→编写邮件” 中禁用“发送虚拟名片 (VCF)”功能以阻断泄露路径。鉴于 Qualcomm 已于 2006 年停止维护 Eudora，长期缓解方案建议迁移至仍在维护的邮件客户端（如 Thunderbird、Outlook、Apple Mail），并在邮件网关层面配置内容过滤规则拦截包含绝对路径的 VCF 附件。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Eudora 邮件客户端 VCF 虚拟通行证主机路径泄露漏洞"
updated = "2026-06-16T21:52:38Z"

