[basic]
description = "Linux 内核 IPsec 框架（xfrm）的状态查找过程中存在越界读取漏洞。xfrm_state 哈希表的查找与扩容操作可并发执行，虽然 xfrm_state_hash_generation seqlock 保证了重试机制，但哈希函数在扩容期间可能观察到与新的 hlist 数组不匹配的过大 hmask 值，导致越界内存读取。本地攻击者可通过低权限访问触发该竞态条件，造成敏感内存信息泄露或系统崩溃。该漏洞影响所有使用受影响 Linux 内核版本的系统，CVSS 评分 7.1，危害等级高。"
published = "2025-02-27T02:15:11Z"
remediation = "建议立即将 Linux 内核升级至 6.13.2 及以上版本（6.12.x 系列升级至 6.12.13，6.6.x 系列升级至 6.6.120）。各发行版用户应安装对应的内核安全更新包：Ubuntu 用户运行 apt update && apt upgrade linux-image-generic，RHEL/CentOS 用户运行 yum update kernel 后重启。如无法立即升级，可应用内核补丁提交 e952837f3ddb（主线）或 a16871c7832e、b86dc510308d、dd4c2a174994（稳定分支）进行源码级修复，重新编译内核后重启生效。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 xfrm 状态查找越界读取漏洞"
updated = "2026-06-17T08:14:22Z"

