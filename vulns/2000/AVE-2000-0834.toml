[basic]
description = "Oracle 8.1.5 Connection Manager Control 中的 cmctl 程序存在缓冲区溢出漏洞。本地攻击者可通过向 cmctl 程序提交超长命令行参数触发缓冲区溢出，导致内存数据被覆盖，从而获取目标系统的提升权限。该漏洞影响 Oracle 8.x 系列版本，攻击者需拥有本地系统访问权限，无需身份认证即可利用，成功利用后可实现完全控制受影响系统，造成机密性、完整性和可用性损失。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 Oracle 数据库至 9i 或更高版本（Oracle 8.1.5 已停止支持），该漏洞在 Oracle 9.0.1 及之后版本中已修复。如无法升级，限制本地用户对 cmctl 程序的执行权限，仅授权管理员使用：`chmod 750 $ORACLE_HOME/bin/cmctl` 并将属主改为 oracle 用户。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Oracle 8.x Connection Manager Control 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:19Z"

