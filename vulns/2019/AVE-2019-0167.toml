[basic]
description = "Oracle Fusion Middleware 的 BI Publisher（前身为 XML Publisher）组件存在访问控制错误漏洞。受影响版本包括 11.1.1.9.0、12.2.1.3.0 和 12.2.1.4.0。该漏洞易于利用，未经身份认证的远程攻击者只需通过网络 HTTP 访问即可对 BI Publisher 实施攻击。虽然漏洞位于 BI Publisher 组件中，但攻击可能显著影响其他关联产品。攻击成功后可导致未授权更新、插入或删除部分可访问数据，以及未授权读取部分可访问数据，CVSS 评分 7.2，危害等级高。"
published = "2019-07-23T23:15:40.163"
remediation = "立即安装 Oracle 2019 年 7 月 Critical Patch Update，将 Oracle BI Publisher 12.2.1.3.0 升级至 12.2.1.3.190716 或更高版本，将 12.2.1.4.0 升级至 12.2.1.4.190716 或更高版本，将 11.1.1.9.0 升级至 11.1.1.9.1 或应用 Oracle 发布的对应补丁程序。升级前停止 BI Publisher 服务，使用 opatch 工具应用补丁并验证 $ORACLE_HOME/inventory 中补丁列表，同时检查 XML Publisher 报表目录及数据源连接权限是否被还原为不安全的默认配置。如无法立即打补丁，应在防火墙或反向代理层面对 BI Publisher 的 HTTP/HTTPS 端口实施 IP 白名单访问控制，仅允许可信来源访问，并禁用不必要的对外端口映射作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["nuclei"]
title = "Oracle Fusion Middleware BI Publisher 访问控制错误漏洞"
updated = "2026-06-17T02:34:32.320"

