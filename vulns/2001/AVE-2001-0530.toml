[basic]
description = "Bugzilla 2.14 之前版本存在敏感信息明文存储漏洞，系统将用户密码以明文形式存储在数据库中，并在发送密码重置请求时通过电子邮件明文传输密码信息。本地或能够访问邮件系统的攻击者可利用此漏洞窃取用户密码，进而获取系统未授权访问权限，实现权限提升。该漏洞影响所有 Bugzilla 2.14 之前版本，CVSS 评分 7.5，危害等级高。建议升级至 Bugzilla 2.14 或更高版本以修复此问题。"
published = "2001-09-10T04:00:00Z"
remediation = "立即升级 Bugzilla 至 2.14 或更高版本，该版本已将用户密码改为加密存储而非明文。对于 Red Hat 用户，请安装 RHSA-2001:107 提供的补丁包。如无法立即升级，可在应用层限制对 Bugzilla 数据库 profiles 表的直接访问，并提醒用户避免使用与其他系统相同的密码。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Bugzilla 明文密码存储与邮件泄露致权限提升漏洞"
updated = "2026-06-16T21:56:12Z"

