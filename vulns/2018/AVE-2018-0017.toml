[basic]
description = "Cisco RV132W ADSL2+ Wireless-N VPN 路由器和 Cisco RV134W VDSL2 Wireless-AC VPN 路由器的 Web 管理界面存在身份验证缺失漏洞，部分包含敏感配置信息的页面未强制要求用户身份验证。未经身份认证的远程攻击者可通过向受影响设备发送精心构造的 HTTP 请求，直接访问包含管理员密码等敏感配置参数的页面，从而获取设备管理权限。该漏洞影响 Cisco RV132W 和 RV134W 系列 VPN 路由器，CVSS 评分 9.8（CRITICAL），攻击者无需身份认证即可远程利用，仅需发送恶意 HTTP 请求即可窃取管理员凭据并完全控制设备。Cisco 已发布安全公告 CSCvg92739 和 CSCvh60172 修复此漏洞，建议用户尽快升级固件版本。"
published = "2018-02-08T07:29:00Z"
remediation = "建议立即升级 Cisco RV132W 固件至 1.0.6.7 或更高版本，Cisco RV134W 固件至 1.0.3.20 或更高版本，通过 Cisco 官网下载中心下载对应型号固件并通过 Web 管理界面升级。若暂时无法升级，建议在边界防火墙限制 Web 管理界面仅允许受信任管理 IP 访问，并修改默认管理员密码作为临时缓解措施。参考 Cisco 安全公告 cisco-sa-20180207-rv130w 及 Bug ID CSCvg92739、CSCvh60172 获取固件下载链接。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "思科 RV132W/RV134W系列VPN路由器Web管理界面信息泄露漏洞"
updated = "2026-06-17T01:29:38Z"

