[basic]
description = "SEDUM 2.1 HTTP 服务器存在严重输入验证缺陷，未经身份认证的远程攻击者可通过向目标服务器发送超长特制 HTTP 请求触发缓冲区溢出漏洞，导致服务拒绝服务并可能执行任意系统命令。该漏洞影响所有运行 SEDUM 2.1 版本的 HTTP 服务器实例，CVSS 评分为 10.0，危害等级为严重。攻击者仅需通过网络访问目标服务器的 HTTP 服务端口即可发起攻击，无需任何身份凭证或用户交互，利用门槛极低且影响范围广泛。"
published = "2001-05-03T04:00:00Z"
remediation = "建议立即停止使用 SEDUM 2.1 HTTP 服务器并迁移至 Apache httpd 2.0+、nginx 1.0+ 或 lighttpd 等维护中的 Web 服务器。若必须短期继续使用，请在前端部署 WAF 或 Nginx 反向代理，配置 `client_max_body_size 1m; client_header_buffer_size 1k; large_client_header_buffers 4 2k;` 限制 HTTP 请求长度，并在防火墙层面封禁异常长请求的源 IP。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "SEDUM HTTP 服务器 拒绝服务漏洞"
updated = "2026-06-16T21:54:01Z"

