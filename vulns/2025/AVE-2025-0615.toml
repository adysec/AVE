[basic]
description = "libarchive 3.7.7 及之前版本的 bsdunzip.c 文件中 list 函数存在空指针解引用漏洞（CWE-476）。攻击者可通过构造特制的 ZIP 归档文件，诱导受害者在本地使用 libarchive 解压处理时触发空指针解引用，导致程序崩溃造成拒绝服务。该漏洞影响所有使用受影响版本 libarchive 的应用程序（如 tar、bsdtar 等归档工具及依赖该库的软件），攻击条件为本地访问且需低权限，无需用户交互。CVSS 4.0 评分 4.8（MEDIUM），主要影响可用性。目前厂商未发布官方补丁，建议升级至 3.7.8 或更高版本，或在解压不可信归档前进行输入验证。"
published = "2025-02-24T14:15:11Z"
remediation = "升级到 libarchive 3.7.8 或更高版本，其中修复了 bsdunzip.c 中 list 函数的空指针异常问题。如无法立即升级，可在编译时使用 -DDISABLE_BSDUNZIP 选项禁用该功能作为临时缓解措施。"
score = 4.8
severity = "MEDIUM"
sources = ["msrc"]
title = "libarchive libarchive 空指针解引用漏洞"
updated = "2026-06-17T08:39:30Z"

