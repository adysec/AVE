[basic]
description = "Adobe Flash Player 及 Adobe AIR 存在点击劫持（Clickjacking）漏洞，影响版本包括 Flash Player 9.0.246.0 之前版本、10.0.32.18 之前版本以及 Adobe AIR 1.5.2 之前版本。该漏洞源于产品未对用户界面元素进行充分的跨域隔离防护，攻击者可构造透明或伪造的网页层覆盖在可信目标内容之上，诱骗用户在不知情的情况下点击隐藏的链接或完成敏感对话框操作。攻击者可通过社会工程学手段将目标网页嵌入恶意页面，利用 CSS 透明度和绝对定位技术隐藏真实交互目标，使用户以为自己在与正常页面交互。成功利用后，攻击者可实现非预期的信息泄露或伪造用户操作，如修改设置、提交表单等，而用户完全感知不到其行为已被劫持。"
published = "2009-07-31T19:30:00Z"
remediation = "立即将 Adobe Flash Player 升级至 9.0.246.0 或 10.0.32.18 及以上版本，并将 Adobe AIR 升级至 1.5.2 及以上版本。如无法立即升级，可在浏览器中安装脚本拦截扩展以阻止恶意 iframe 嵌入，或暂时禁用 Flash Player 插件作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Adobe Flash Player 点击劫持漏洞"
updated = "2026-06-16T23:08:14Z"

