[basic]
description = "Storagesoft ImageCast Control Center 4.1.0 存在拒绝服务漏洞，远程攻击者可通过向 TCP 端口 12002 发送超长字符串，触发服务端资源耗尽或系统崩溃，导致目标服务不可用。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响 ImageCast 4.1.0 版本。厂商至今未发布官方补丁，建议通过防火墙限制对端口 12002 的访问以缓解风险。"
published = "2001-03-12T05:00:00Z"
remediation = "立即在防火墙层面限制对 TCP 12002 端口的访问，仅允许受信任的管理 IP 连接。由于 Storagesoft ImageCast 4.1 已停止维护，建议升级至替代产品（如现代 PXE 部署方案），或将该服务隔离在独立网段中运行。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Storagesoft ImageCast Control Center 4.1 拒绝服务漏洞"
updated = "2026-06-16T21:53:41Z"

