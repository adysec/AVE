[basic]
description = "Lotus Notes Client R5 Java虚拟机中的扩展控制列表（Extended Control List，ECL）功能存在时间侧信道漏洞，攻击者可通过 malicious 恶意网站控制访问，利用 getSystemResource 方法执行时间的微小变化测量技术，实现对客户端文件系统存在的侦测。该漏洞影响 Lotus Notes Client R5 版本，攻击者无需任何权限即可发起远程攻击，打破了系统文件存在的保密性，可能被用于进一步的精密攻击。该漏洞涉及 CWE-203 类别，反映出 JVM 安全机制在处理敏感系统资源时缺乏完善的访问控制和信息隐藏机制，导致可通过异常时间响应模式进行非直接访问。"
published = "2001-01-09T05:00:00.000"
remediation = '升级 Lotus Notes 至 R6 或更高版本（已修复 JVM ECL 计时攻击漏洞）。若无法升级，在 Lotus Notes 客户端中禁用 Java 支持：文件 → 首选项 → 用户偏好设置 → 基础 → 取消勾选"启用 Java"，或在 ECL 中将"执行 Java"权限设为"无"以阻止 Java 执行。临时缓解可在浏览器/Notes 中禁用 Java 小程序。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Lotus Notes Client R5 文件存在验证漏洞"
updated = "2026-06-16T21:53:11.013"

