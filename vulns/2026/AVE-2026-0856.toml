[basic]
description = "Jackson Databind 在处理 @JsonUnwrapped 注解的容器属性时存在视图绕过漏洞。UnwrappedPropertyHandler.processUnwrapped() 方法在反序列化过程中未对 prop.visibleInView(ctxt.getActiveView()) 进行校验，导致同时标注了 @JsonView 和 @JsonUnwrapped 的属性在低权限视图下仍能被攻击者 JSON 数据写入。攻击者可通过向使用 Jackson 进行 JSON 反序列化的服务端发送特制 JSON 载荷，绕过 @JsonView 的写权限控制，实现权限提升或敏感字段赋值（如角色、审批状态、信用额度等）。该漏洞影响 jackson-databind 2.18.0 至 2.18.9、2.21.5、2.22.1、3.1.5、3.2.1 之前版本，CVSS 评分 6.5，危害等级中危。"
published = "2026-07-14T21:17:06Z"
remediation = "升级 jackson-databind 至以下修复版本：2.x 系列升级到 2.18.9、2.21.5 或 2.22.1；3.x 系列升级到 3.1.5 或 3.2.1。如使用 Maven，在 pom.xml 中更新 `com.fasterxml.jackson.core:jackson-databind` 版本号；如使用 Gradle，更新 `implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'`。无法立即升级时，避免在 `@JsonView` 保护的容器属性上同时使用 `@JsonUnwrapped` 注解，并设置 `MapperFeature.DEFAULT_VIEW_INCLUSION=false` 作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "FasterXML Jackson-databind @JsonView反序列化权限绕过漏洞"
updated = "2026-07-16T16:19:15Z"

