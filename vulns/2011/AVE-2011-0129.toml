[basic]
description = "Opera 浏览器 11.50 之前版本存在内存分配漏洞，攻击者可通过诱导用户访问包含特制内容的恶意网页（如 test262.ecmascript.org 演示页面），触发浏览器内存消耗异常导致拒绝服务，造成浏览器崩溃或系统资源耗尽。该漏洞影响 Opera 11.50 之前所有版本，CVSS 评分 5.0（中等危害），攻击向量为网络，攻击复杂度低，无需认证，仅影响可用性。Opera 11.50 版本已修复此漏洞，用户升级至 11.50 或更高版本即可修复。"
published = "2011-07-01T10:55:02Z"
remediation = "立即升级 Opera 浏览器至 11.50 或更高版本（官网 https://www.opera.com/download）。无法立即升级时，建议在浏览器设置中禁用 JavaScript（设置 → 隐私与安全 → 站点设置 → JavaScript → 禁止），并避免访问不可信网站，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera Opera Web Browser 内存分配漏洞"
updated = "2026-06-16T23:31:39Z"

