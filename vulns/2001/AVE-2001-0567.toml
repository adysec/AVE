[basic]
description = "Solaris 8 及更早版本中的 lpd 守护进程（in.lpd）存在远程命令执行漏洞。该漏洞源于 lpd 在处理打印任务请求时会调用邮件程序发送通知邮件，攻击者可通过提交特制的控制文件，在 lpd 调用邮件程序时注入恶意指令，从而在无需身份认证的情况下执行任意操作系统命令。该漏洞影响 Sun Solaris 8.0 及之前所有版本，攻击者只需能够访问目标系统的 LPD 服务端口（515/TCP），即可远程利用此漏洞获取系统最高权限。Metasploit 框架中已包含该漏洞的利用模块，攻击者可通过构造级联打印任务请求配合恶意邮件配置文件的方式触发漏洞执行，最终获得目标系统的完全控制权。"
published = "2001-12-31T05:00:00Z"
remediation = "建议立即升级到 Solaris 9 或更高版本，或安装 Sun 安全补丁（Solaris 8 应用 112438-02，Solaris 7 应用 112439-02），消除 in.lpd 守护进程中的命令注入漏洞。如暂无法升级或打补丁，且无需打印服务，可通过 svcadm disable svc:/application/print/server:default 禁用 LPD 服务，并在防火墙层面封禁 TCP 515 端口作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Solaris LPD 远程代码执行漏洞"
updated = "2026-06-16T21:56:33Z"

