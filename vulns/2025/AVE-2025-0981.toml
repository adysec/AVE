[basic]
description = "标签之间。<value>Linux 内核 gpiolib 子系统中存在空指针解引用漏洞。gpiochip_get_ngpios() 函数使用 chip_*() 宏输出调试信息，但这些宏依赖 gpiodev 结构体已被正确初始化；当该函数通过 bgpio_init() 调用时，gpiodev 尚未赋值仍为 NULL，导致触发空指针解引用并使内核崩溃。该漏洞影响运行受影响内核版本的 Linux 系统，具有本地低权限的攻击者可通过诱使 GPIO 芯片初始化过程进入错误路径来利用此漏洞，造成系统拒绝服务，影响系统可用性。CVSS 评分 5.5，危害等级为中危。"
published = "2025-02-27T03:15:19.150"
remediation = "建议将 Linux 内核升级至已修复版本：6.6.79、6.12.16、6.13.4 或更高版本。可通过发行版官方更新机制安装内核安全补丁，Ubuntu 用户可安装 USN-7703-1 公告对应的内核更新包。若短期内无法升级，可通过限制本地用户对 GPIO 设备的访问作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 gpiolib 空指针解引用拒绝服务漏洞"
updated = "2026-06-17T08:44:16.063"

