[basic]
description = "tags.<value>FreeBSD 3.0/3.5.1/4.0/4.1/4.1.1 及更早版本中的 telnetd 服务存在拒绝服务漏洞。远程攻击者可通过构造包含超大文件的 TERMCAP 环境变量，在目标系统上触发该漏洞。当 telnetd 服务器处理此环境变量时，会消耗大量系统资源导致服务不可用。该漏洞影响 FreeBSD 多个版本及可能的其他操作系统，攻击无需身份认证，利用门槛低。CVSS 评分为 5，危害等级中等。"
published = "2001-01-09T05:00:00Z"
remediation = "升级至 FreeBSD 4.2-RELEASE 或更高版本（含 4.1.1-STABLE、3.5.1-STABLE 的修复版本，修正日期 2000-11-19 之后的源码）。手动打补丁时，可从 ftp://ftp.freebsd.org/pub/FreeBSD/CERT/patches/SA-00:69/telnetd.patch.v1.1 下载补丁，在 /usr/src/libexec/telnetd 目录执行 patch -p 并重新编译安装。如暂无法升级，可在 /etc/inetd.conf 中注释掉 telnet 服务行，或通过 ipfw、ipf 及 TCP wrappers (/etc/hosts.allow) 限制仅有可信主机可访问 23 端口。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "FreeBSD Telnet守护进程 环境变量拒绝服务漏洞"
updated = "2026-06-16T21:53:20Z"

