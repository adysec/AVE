[basic]
description = "Hassan Consulting 的 shop.cgi 购物车程序存在目录遍历漏洞，远程攻击者可通过向 page 参数提交 `..`（点点）序列绕过路径限制，读取服务器上的任意文件。该漏洞攻击复杂度低，无需身份认证即可远程利用，可能导致敏感信息泄露（如配置文件、密码文件等）。受影响版本为 Hassan Consulting Shopping Cart 1.18，目前已有公开 PoC 利用代码。"
published = "2000-12-19T05:00:00Z"
remediation = '升级 Hassan Consulting Shopping Cart 至 1.18 以上已修复版本，或在 shop.cgi 中对 page 参数进行输入过滤，移除 `../` 等目录遍历序列（如使用正则过滤 `\.\./` 及 URL 编码变体 `%2e%2e%2f`）。如厂商已停止维护，建议替换为现代受支持的购物车系统，并在 Web 服务器（Apache/Nginx）层面配置 URL 重写规则，拒绝包含 `..` 的请求路径。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Hassan Consulting shopping cart 目录遍历漏洞"
updated = "2026-06-16T21:52:46Z"

