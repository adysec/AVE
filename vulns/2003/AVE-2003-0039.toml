[basic]
description = "Ximian Evolution 邮件客户端 1.2.2 及更早版本中的 mail-format.c 文件的 handle_image 函数在处理 MIME 编码图片的 Content-ID 头时，未正确转义 HTML 特殊字符，导致存在跨站脚本（XSS）漏洞。远程攻击者可向目标用户发送特制的包含恶意 Content-ID 头的 MIME 图片邮件，当用户预览或查看该邮件时，恶意 HTML 脚本会在 Evolution 邮件客户端中执行，导致信息泄露或进一步攻击。该漏洞利用条件低，仅需用户使用受影响版本打开恶意邮件即可触发。"
published = "2003-03-24T05:00:00Z"
remediation = "立即将 Ximian Evolution 升级到 1.2.3 或更高版本，该版本修复了 mail-format.c 中 handle_image 函数对 HTML 字符转义不当的问题。如无法立即升级，可在邮件网关处配置过滤规则，拦截包含 MIME Content-ID 头且内容类型为 image/* 的入站邮件，同时避免在邮件客户端中自动加载远程图像内容，以降低跨站脚本攻击风险。建议同时关注 GNOME Evolution 后续安全更新。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Ximian Evolution 邮件客户端 MIME Content-ID 标头跨站脚本漏洞"
updated = "2026-06-16T22:01:36Z"

