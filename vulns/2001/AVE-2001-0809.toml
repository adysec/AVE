[basic]
description = "Windows 2000 事件查看器管理单元（event viewer snap-in）存在缓冲区溢出漏洞。攻击者可通过构造畸形的字段数据，在查看事件记录的详细视图时触发该漏洞，从而在目标系统上执行任意命令。该漏洞影响 Windows 2000 系统，攻击者无需身份认证即可通过网络远程发起攻击，利用难度低，可导致完全的系统控制。CVSS 评分 10.0，危害等级严重。"
published = "2001-05-03T04:00:00Z"
remediation = '建议立即安装 Microsoft 安全公告 MS01-013 对应的安全补丁 KB285156，或升级至 Windows 2000 Service Pack 3（SP3 已包含该修复）。补丁适用于 Windows 2000 Professional、Server、Advanced Server 及 Datacenter Server，可在 Service Pack 1 和 Service Pack 2 基础上直接安装。如无法立即安装补丁，可临时使用微软提供的 Dumpel 工具将事件日志导出为 Excel 文件进行查看，避免直接打开事件查看器的详细属性页，同时通过网络防火墙限制非必要用户对事件日志的远程访问。补丁安装后可通过注册表路径 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Updates\Windows 2000\SP3\Q285156 验证是否安装成功。'
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Microsoft Windows 2000 事件查看器管理单元远程代码执行漏洞"
updated = "2026-06-16T21:53:45Z"

