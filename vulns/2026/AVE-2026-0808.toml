[basic]
description = "Easy!Appointments 1.5.2 版本的客户搜索端点存在过度数据暴露漏洞，已认证用户可通过该端点获取其他用户的预约哈希值。由于缺乏对象级授权控制，攻击者利用获取的哈希值可调用预约管理接口（如 /calendar/reschedule/{hash}），实现对其他服务提供者预约的查看、修改或删除，导致预约接管。该漏洞影响数据机密性和完整性，CVSS 7.1（HIGH），攻击向量为网络、低攻击复杂度、低权限、无需用户交互。版本 1.6.0 已修复，建议升级并限制搜索端点仅返回当前提供者的预约数据。"
published = "2026-07-14T16:17:00Z"
remediation = "tags, and should be TOML compatible according to the skill rules.<value>升级 Easy!Appointments 到 1.6.0 或更高版本，修复 customers 搜索端点的授权验证漏洞。修改端点逻辑，确保仅返回属于认证用户的预约数据，同时加强对预约哈希值的访问控制。临时缓解措施：在防火墙中限制对 customers 端点的访问，仅允许特定 IP 地址。完成版本升级后，验证所有认证用户只能访问其 own 预约信息，确认预约劫持漏洞已修复。"
score = 7.1
severity = "HIGH"
sources = ["ghsa"]
title = "Easy!Appointments 预约管理系统 过度数据暴露导致预约接管漏洞"
updated = "2026-07-14T16:42:11Z"

