[basic]
description = "SGI Omron WorldView Wnn 亚洲语言服务器存在远程缓冲区溢出漏洞。该漏洞源于程序在处理 JS_OPEN、JS_MKDIR 和 JS_FILE_INFO 等命令时未对用户输入长度进行正确校验，远程攻击者可通过向目标服务器发送特制的超长命令字符串触发缓冲区溢出，从而在目标系统上以服务器进程权限执行任意命令。该漏洞影响 WorldView 6.5 及 Wnn4 4.2 版本，CVSS 评分 10.0，危害等级严重，攻击者无需身份认证即可远程利用。"
published = "2000-10-20T04:00:00.000"
remediation = "立即应用 SGI 安全公告 20000803-01-A 提供的补丁，升级 WorldView Wnn 至修复版本。如无法升级，在防火墙层面限制对 js_serv（端口 5680/TCP 默认）的访问，仅允许可信 IP 连接；若业务不需要远程日语输入服务，直接停止并禁用 wnn 服务（`/etc/init.d/wnn stop && chkconfig wnn off`）。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "SGI Omron WorldView Wnn 亚洲语言服务器远程缓冲区溢出漏洞"
updated = "2026-06-16T21:52:18.367"

