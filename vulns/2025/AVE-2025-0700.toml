[basic]
description = "Windows 电话服务（Telephony Service）中存在堆缓冲区溢出漏洞，该服务在处理特定远程过程调用（RPC）请求时未正确验证输入数据长度，导致堆内存越界写入。远程攻击者可通过向目标系统发送特制的 RPC 请求触发该漏洞，成功利用可在目标系统上以 SYSTEM 权限执行任意代码。攻击需要用户交互（如诱导用户点击恶意链接），但无需身份认证。该漏洞影响多个 Windows 版本，包括 Windows 10、Windows 11 及 Windows Server 系列。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:39Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新 (KB5049984)，或通过 Windows Update 自动获取更新。受影响系统包括 Windows 10/11 及 Windows Server 各版本。如无法立即打补丁，可通过禁用电话服务 (TapiSrv) 作为临时缓解措施：以管理员身份运行 `sc stop TapiSrv` 和 `sc config TapiSrv start= disabled`。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Telephony Service 远程代码执行漏洞"
updated = "2026-06-17T08:42:52Z"

