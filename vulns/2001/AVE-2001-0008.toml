[basic]
description = "Endymion MailMan Webmail 是一款基于 Web 的电子邮件客户端软件，该软件在 3.0.25 及更早版本中存在严重的命令注入漏洞。攻击者可通过在 alternate_template 参数中插入 Shell 元字符，向目标服务器操作系统注入并执行任意系统命令。由于该漏洞位于 Web 前端接口，未经身份验证的远程攻击者无需任何凭据即可利用此漏洞，通过构造包含恶意 alternate_template 参数的 HTTP 请求即可触发，从而完全控制服务器、窃取敏感数据或进一步渗透内网。该漏洞影响所有使用 Endymion MailMan 3.0.x 至 3.0.25 版本的系统，CVSS 评分 10.0，危害等级严重，用户应尽快升级到修复版本消除风险。"
published = "2001-02-16T05:00:00.000"
remediation = "升级到 Endymion MailMan 4.0 或更高版本，其中修复了 alternate_template 参数的 shell 元字符处理漏洞；如无法立即升级，可通过配置文件禁用该功能或限制其访问以临时缓解风险。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Endymion MailMan Webmail 远程命令执行漏洞"
updated = "2026-06-16T21:53:30.290"

