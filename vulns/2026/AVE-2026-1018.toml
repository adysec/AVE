[basic]
description = "tags.<value>OpenSSL 的 X509_VERIFY_PARAM_set1_email() 函数在处理 S/MIME 邮件验证时存在越界读取漏洞。该函数内部辅助函数在验证电子邮件地址本地部分时使用了错误的长度值，导致本地部分的 64 字节长度限制可能未被执行，进而触发越界读取。攻击者可通过在邮件头中构造恶意的 From: 地址，在目标应用进行 S/MIME 消息验证时触发该漏洞，造成应用程序崩溃和拒绝服务。该漏洞仅影响 OpenSSL 的非 FIPS 模块代码路径，不会直接导致敏感数据泄露，但可造成服务中断。"
published = "2026-06-09T17:17:08.663"
remediation = "建议将 OpenSSL 4.0.0 升级至 4.0.1 或更高版本以修复此越界读取漏洞。升级后需重新编译并部署所有依赖 OpenSSL 的应用程序和服务。当前暂无临时缓解措施，请尽快完成版本升级。"
score = 6.2
severity = "MEDIUM"
sources = ["zdi"]
title = "OpenSSL S/MIME 邮件地址验证越界读取拒绝服务漏洞"
updated = "2026-07-23T08:10:00.137"

