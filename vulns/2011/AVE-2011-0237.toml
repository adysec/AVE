[basic]
description = "Google Chrome 15.0.874.102之前版本及Android 4.4之前版本中使用的WebKit引擎存在同源策略绕过漏洞（Universal XSS）。远程攻击者可构造恶意网页，利用以下五种方式绕过同源策略：DOMWindow::clear函数与selection对象的交互、Object::GetRealNamedPropertyInPrototypeChain函数与__proto__属性的处理、HTMLPlugInImageElement::allowedToLoadFrameURL函数与javascript:URL的使用、XSLTProcessor::createDocumentFromSource函数对XSLT生成文档的源判定错误、以及ScriptController::executeIfJavaScriptURL函数对同步框架加载的不当处理。攻击者无需用户认证即可实施跨站脚本攻击，窃取敏感信息或执行恶意操作。该漏洞影响Chrome和Android两大平台，危害范围广泛。"
published = "2011-10-25T19:55:01Z"
remediation = "升级 Google Chrome 至 15.0.874.102 或更高版本；升级 Apple Safari 至 5.1.4 或更高版本；升级 Android 至 4.4 或更高版本。如无法升级，可禁用 JavaScript 或使用内容安全策略（CSP）作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome WebKit同源策略绕过漏洞"
updated = "2026-06-16T23:34:05Z"

