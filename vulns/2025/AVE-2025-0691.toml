[basic]
description = "Windows 数字媒体组件存在越界读取漏洞，该漏洞源于 Windows 数字媒体相关功能在处理特定内存对象时未正确验证边界，导致越界读取。具有物理访问权限的低权限攻击者可通过向目标系统插入特制媒体设备或执行恶意媒体文件触发该漏洞，成功利用后可提升至 SYSTEM 权限，实现机密性、完整性和可用性的完全控制。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:35Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新 (KB5050061)，可通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载。如无法立即打补丁，建议限制受影响的 Windows Digital Media 组件的执行权限，并确保用户以标准用户权限运行而非管理员账户。"
score = 6.6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows Digital Media 特权提升漏洞"
updated = "2026-06-17T08:42:50Z"

