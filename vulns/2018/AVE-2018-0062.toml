[basic]
description = "Eaton Intelligent Power Manager v1.6 的 server/node_upgrade_srv.js 接口存在本地文件包含漏洞（CWE-22）。未经身份认证的远程攻击者可在无需用户交互的情况下，通过 downloadFirmware 操作的 firmware 参数利用目录遍历，向服务器发送特制请求以包含或读取任意系统文件。该漏洞影响采用 Eaton Intelligent Power Manager v1.6 的能源管理及数据中心电源监控系统，由于无需认证且攻击复杂度低，攻击者可直接通过网络远程利用，可能导致敏感配置文件、凭据或其他系统文件泄露，进而造成严重的信息安全风险。CVSS 评分 9.8，危害等级严重。建议升级至安全版本并限制相关接口的网络访问权限。"
published = "2018-06-07T16:29:00Z"
remediation = 'Eaton 官方已发布补丁版本修复此漏洞，建议将 Intelligent Power Manager 立即升级至 1.7 或更高版本。升级前请备份所有配置文件和电源管理策略，安装新版本后重新导入配置并验证固件下载功能正常。如暂时无法升级，可临时禁用 node_upgrade_srv.js 中的 firmware 参数调用，或在反向代理层配置 WAF 规则阻断包含 "../" 或 "%2e%2e" 的 request URI，以阻止目录遍历攻击。'
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Eaton Intelligent Power Manager 文件包含漏洞"
updated = "2026-06-17T01:37:02Z"

