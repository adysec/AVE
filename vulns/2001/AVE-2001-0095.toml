[basic]
description = "CVE-2001-0236是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-05-03T04:00:00Z"
remediation = "应用 Sun Security Bulletin #207 提供的补丁：Solaris 2.6 系统应安装补丁 108491-02，Solaris 7 系统应安装补丁 108492-02，Solaris 8 系统应安装补丁 108493-02。若暂时无法安装补丁，可在 /etc/inetd.conf 或 /etc/xinetd.d/ 配置中禁用 snmpXdmid 服务（注释或删除相关行），并通过执行 pkill snmpXdmid 或 svcadm disable svc:/application/management/snmpXdmid:default 重启服务使其生效，作为临时缓解措施。补丁安装完成后应重启系统或相关服务以确保修复生效。同时建议通过防火墙或 TCP Wrapper 限制对 snmpXdmid 端口（RPC 程序号 100249）的访问。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Sun Solaris snmpXdmid SNMP代理 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:56Z"

