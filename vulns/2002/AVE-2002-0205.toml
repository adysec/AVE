[basic]
description = "GNU File Utilities (fileutils) 4.1 及之前版本中存在竞争条件漏洞。当程序执行递归目录删除或移动操作时，本地攻击者可通过在删除过程中将低层级目录移动到更高层级，利用时间差触发竞态条件，导致 fileutils 的 chdir 跳转到预期之外的上级目录，最终可能指向根文件系统。成功利用此漏洞可使攻击者以运行 fileutils 的用户权限删除任意目录，影响系统文件完整性。攻击需要本地访问权限且利用条件较为苛刻，CVSS 评分 1.2，危害等级低。"
published = "2002-07-26T04:00:00Z"
remediation = "升级到GNU fileutils 4.1以上版本，或迁移至GNU coreutils（fileutils的后继项目，已修复此问题）。Red Hat用户请安装RHSA-2003:015/RHSA-2003:016提供的更新包，Mandrake用户请安装MDKSA-2002:031更新，Caldera OpenLinux用户请安装CSSA-2002-018.1更新。在多用户共享系统上，避免对不可信目录结构执行递归删除或移动操作。"
score = 1.2
severity = "LOW"
sources = ["redhat"]
title = "GNU File Utilities 竞争条件漏洞"
updated = "2026-06-16T21:57:26Z"

