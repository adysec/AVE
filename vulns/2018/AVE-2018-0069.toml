[basic]
description = "Seagate NAS OS 4.3.15.1 版本的 echo-server.html 页面存在输入验证不严漏洞，攻击者可通过 URL 参数 'state' 构造恶意重定向链接。当用户点击攻击者提供的特制链接后，系统会将用户重定向至攻击者指定的外部站点，导致用户浏览器 Referer 头中携带的敏感信息（如 NAS 设备地址、会话令牌等）被攻击者窃取。该漏洞无需身份认证即可利用，攻击复杂度低，但需要用户交互才能触发，可造成信息泄露风险。"
published = "2019-05-13T13:29:00.620"
remediation = "立即升级 Seagate NAS OS 固件至官方发布的最新版本（修复 echo-server.html 中 state 参数未验证导致的任意重定向漏洞）；如无法立即升级，可在反向代理或 WAF 中过滤 echo-server.html 页面请求中的 state 参数，禁止其指向外部域名，同时限制 NAS Web 管理界面仅允许内网访问。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "希捷 NAS OS 任意重定向漏洞"
updated = "2026-06-17T01:37:30.870"

