[basic]
description = "Google Chrome 全屏界面存在安全 UI 显示不正确漏洞（CWE-306：关键功能缺少身份验证）。攻击者可通过构造特制的 HTML 页面，诱骗用户执行特定的 UI 手势（如点击或拖拽），导致全屏模式下 UI 欺骗，使用户误判当前页面来源。该漏洞影响 Google Chrome 142.0.7444.59 之前版本，攻击复杂度较高，需要用户交互配合，成功利用可导致信息泄露及界面欺骗，CVSS 评分 4.2，危害等级中危。"
published = "2025-11-10T20:15:39Z"
remediation = "升级 Google Chrome 至 142.0.7444.59 或更高版本，可通过 Chrome 设置 > 关于 Chrome 自动检查更新。基于 Chromium 的浏览器（如 Edge、Brave）需同步更新至对应修复版本。Linux 发行版用户通过系统包管理器更新（如 Fedora 执行 `sudo dnf update chromium`）。"
score = 4.2
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome 全屏界面安全 UI 绕过漏洞"
updated = "2026-06-17T08:32:23Z"

