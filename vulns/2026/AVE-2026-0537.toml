[basic]
description = "Adobe Acrobat Reader 存在释放后使用（Use After Free）漏洞，攻击者可通过构造特制的恶意 PDF 文件并诱使用户打开，触发已释放内存对象的非法访问，进而在当前用户上下文中执行任意代码。该漏洞影响 Acrobat Reader 24.001.30307、24.001.30308、25.001.21265 及更早版本，CVSS 评分 7.8，危害等级高。利用该漏洞需要用户交互，即受害者必须手动打开恶意文件。Adobe 官方已发布安全更新修复此漏洞。"
published = "2026-03-10T22:16:17Z"
remediation = "建议立即升级 Adobe Acrobat Reader DC 至 25.001.21288 及以上版本，或 Acrobat Classic 2024 至 24.001.30356 及以上版本。可通过 Adobe 官网或产品内置更新功能获取补丁（参考 APSB26-26）。在无法立即升级时，建议禁用 PDF 文件的自动打开功能，并教育用户不要打开来源不明的 PDF 文件。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Adobe Acrobat Reader 释放后重用远程代码执行漏洞"
updated = "2026-06-17T10:26:52Z"

