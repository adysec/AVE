[basic]
description = "` tags as specified.<value>Flyto2 Core 是一款用于自动化和 AI 代理工作流的执行内核。在 2.26.6 版本之前，其 `image.download` 及相关文件写入模块未使用集中式路径校验函数 `validate_path_with_env_config`，而是采用调用方可控的 `output_dir` 作为写入基准目录。由于该基准目录本身由攻击者指定，`os.path.commonpath` 的路径校验形同虚设，攻击者可通过特制参数将任意 HTTP 响应内容写入进程可访问的任意文件系统路径。受影响模块包括 `image.download`、`image.convert`、`image.resize`、`image.crop`、`image.compress`、`image.rotate`、`image.watermark`、`image.qrcode_generate`、`document.excel_write`、`document.pdf_fill_form`、`document.word_to_pdf`、`document.pdf_to_word` 及 `browser.pagination` 等。该漏洞影响通过 MCP 工具或托管 API 调用模块的场景，攻击者可利用其绕过 `FLYTO_SANDBOX_DIR` 沙盒限制，向沙盒外目录写入任意内容，进而覆盖配置文件、植入 Shell 脚本、修改 cron 任务或替换 Python 模块，最终导致远程代码执行。官方已在 2.26.6 版本中修复此问题。"
published = "2026-07-29T19:16:52.240"
remediation = "升级到 Flyto2 Core 2.26.6 或更高版本。此版本已修复 image.download 及所有文件写入模块的路径校验缺陷，统一使用 validate_path_with_env_config() 将写入操作限制在 FLYTO_SANDBOX_DIR 沙箱目录内。如无法立即升级，请确保 FLYTO_SANDBOX_DIR 环境变量已设置为受限目录，禁止向外部模块传递 output_dir 参数，并限制能调用 file-writing 模块的主体权限。"
score = 10
severity = "CRITICAL"
sources = ["ghsa"]
title = "FlytoHub Flyto2 Core 任意文件写入漏洞"
updated = "2026-07-30T16:41:25.650"

