[basic]
description = "FreeBSD 及其部分其他操作系统的 brouted 路由守护进程存在缓冲区溢出漏洞。该漏洞源于程序在处理命令行参数时缺乏严格的长度校验，当本地用户通过命令行传递超长参数时，会触发内存缓冲区溢出。攻击者可利用此缺陷覆盖栈帧中的返回地址，从而在特权上下文中执行任意代码，最终获取 root 权限。该漏洞影响部署了 brouted 服务的 FreeBSD 及相关兼容系统。"
published = "2000-10-20T04:00:00Z"
remediation = "建议立即更新 FreeBSD 系统至已修复该漏洞的最新补丁版本，或在不需要桥接路由功能时禁用并卸载 routed/brouted 服务。对于无法立即更新的旧系统，应通过严格限制对该二进制文件的执行权限（如 chmod 700）来防止普通本地用户调用该程序，从而缓解漏洞被利用的风险。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "FreeBSD brouted 本地缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:52:24Z"

