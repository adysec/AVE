[basic]
description = 'AnchorCMS 0.12.3 版本的 config/error.php 文件存在敏感信息泄漏漏洞。该漏洞源于系统将错误日志以明文形式暴露在 errors.log URI 路径下，当 MySQL 数据库发生连接错误（如"Too many connections"）时，错误日志中会明文记录 MySQL 数据库的用户名和密码等认证凭据。远程攻击者无需任何身份认证即可通过直接访问 /errors.log 路径获取数据库凭据，进而可能导致数据库被完全控制。该漏洞影响 AnchorCMS 0.12.3 及更早版本，攻击复杂度低，危害严重。'
published = "2018-02-19T22:29:00Z"
remediation = "立即升级 AnchorCMS 至 0.12.7 或更高版本，该版本已修复 errors.log 暴露问题。如无法升级，在 Web 服务器（Nginx/Apache）配置中禁止访问 /errors.log 路径，例如 Nginx 添加 `location /errors.log { deny all; }`，并移除 config/error.php 中向 Web 可访问目录写入日志的配置。同时修改 MySQL 数据库密码以防已泄露的凭据被利用。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "AnchorCMS error.log 数据库凭据信息泄漏漏洞"
updated = "2026-06-17T02:02:52Z"

