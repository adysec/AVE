[basic]
description = "Microsoft Indexing Services for Windows 2000 中的 CiWebHitsFile 组件存在跨站脚本（XSS）漏洞。远程攻击者可通过向运行 IIS 4/5 的目标服务器发送特制的 .htw 请求，在 CiRestriction 参数中注入恶意脚本代码，当用户访问受影响的索引页面时脚本将在用户浏览器中执行，导致敏感信息泄露或会话劫持。该漏洞无需身份认证即可利用，攻击复杂度较高，影响 Windows 2000 及早期 IIS 版本。"
published = "2000-12-19T05:00:00.000"
remediation = '立即安装 Microsoft 安全公告 MS00-098（后由 MS01-025 取代）提供的补丁，该补丁移除了 Indexing Service 中 ActiveX 控件的"safe for scripting"标记。下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=C93BC4EB-ED43-4887-80AA-9E3C2B053430。如无法安装补丁，可在 Internet Explorer 中禁用 ActiveX 控件或通过防火墙阻止对 .htw 文件的访问作为临时缓解措施。'
score = 5.1
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Windows 2000 Indexing Services 跨站脚本漏洞"
updated = "2026-06-16T21:52:49.197"

