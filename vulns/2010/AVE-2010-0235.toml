[basic]
description = "RealNetworks RealPlayer 的 CDDA URI ActiveX 控件在处理特制 URI 时存在未初始化指针漏洞。当用户通过浏览器访问恶意构造的网页时，攻击者可利用该控件解析 CDDA URI 过程中未正确初始化对象组件的问题，触发未初始化指针解引用，导致应用程序崩溃或执行任意代码。该漏洞影响 RealPlayer 11.0 至 11.1、RealPlayer SP 1.0 至 1.1.4 及 RealPlayer Enterprise 2.1.2 版本，CVSS 评分 9.3，危害严重。攻击者可通过社会工程手段诱导用户打开恶意页面触发漏洞，Metasploit 框架已集成该漏洞的利用模块。"
published = "2010-10-19T00:00:01Z"
remediation = '立即升级 RealPlayer SP 至 12.0.0.879 或更高版本。如无法升级，可在 Internet Explorer 中禁用 RealPlayer ActiveX 控件（CLSID: FDC7A2FC-8C4C-11D0-8D3D-00A0C91E9E4F），将 kill bit 写入注册表 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\ActiveX Compatibility 下对应 CLSID 的 Compatibility Flags 设为 0x400。鉴于 RealPlayer 已停止维护，建议彻底卸载该软件并改用其他播放器。'
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer CDDA URI 未初始化指针远程代码执行漏洞"
updated = "2026-06-16T23:23:26Z"

