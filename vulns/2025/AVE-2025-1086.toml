[basic]
description = "Linux 内核 proc 子系统中存在竞争条件导致的释放后使用（Use-After-Free）漏洞，位于 proc_get_inode() 函数。当内核模块被卸载（rmmod）的同时，进程通过 /proc/XXX 路径查找并实例化 inode 时，pde->proc_ops 指针所指向的模块内存已被释放，但代码仍会解引用该指针调用 proc_read_iter 等回调函数，从而触发释放后使用，导致内核崩溃或权限提升。该漏洞影响未使用 use_pde/unuse_pde() 保护机制的内核版本，攻击者需具备本地低权限访问权限，可通过加载并快速卸载内核模块，同时访问对应 /proc 条目触发竞争条件，最终可能实现本地特权提升。CVSS 评分 7.8，危害等级高。"
published = "2025-04-03T08:15:15Z"
remediation = "建议将 Linux 内核升级至已修复版本：5.10 系列升级到 5.10.236 或更高版本，5.15 系列升级到 5.15.180 或更高版本，6.1 系列升级到 6.1.132 或更高版本，6.6 系列升级到 6.6.85 或更高版本，6.12 系列升级到 6.12.21 或更高版本，6.13 系列升级到 6.13.9 或更高版本。如暂无法立即升级，可通过以下措施临时缓解：启用内核模块签名验证（设置 kernel.modules_disabled=1 或 module.sig_enforce=1），限制本地用户权限，仅允许可信用户访问系统，并通过 chmod 限制 /proc 目录下敏感文件的访问权限，禁止非授权用户加载内核模块。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux kernel proc 子系统释放后使用竞争条件本地提权漏洞"
updated = "2026-07-14T13:17:28Z"

