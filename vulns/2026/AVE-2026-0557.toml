[basic]
description = "Windows Win32K 图形内核子系统（GRFX）中存在竞争条件漏洞（CWE-362），由于对共享资源的并发访问缺乏正确的同步机制，导致权限提升。已获得本地系统访问权限的攻击者可利用此漏洞，在目标系统上以提升后的权限执行任意代码，从而完全控制系统。该漏洞影响多个 Windows 版本，攻击复杂度较高，需要攻击者已具备低权限账户并经过身份认证。Microsoft 尚未发布官方安全更新。"
published = "2026-04-14T18:17:33Z"
remediation = "建议立即安装 Microsoft 2026 年 4 月安全更新（对应 Windows 2026-Apr 月度累积更新），通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载。该漏洞影响 Windows Win32K-GRFX 组件，攻击者需本地登录并利用条件竞争释放后使用（UAF）缺陷提权至 SYSTEM。如无法立即打补丁，可限制低权限用户本地登录、启用 Windows Defender 攻击面减少（ASR）规则阻止可疑提权行为作为临时缓解。"
score = 7
severity = "HIGH"
sources = ["zdi"]
title = "Microsoft Windows Win32K GRFX 本地提权漏洞"
updated = "2026-07-24T23:10:00Z"

