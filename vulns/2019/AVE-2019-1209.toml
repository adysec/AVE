[basic]
description = "多款无线投屏设备存在命令注入漏洞，其 file_transfer.cgi HTTP 接口未对用户输入进行充分过滤。未经身份认证的远程攻击者可通过向该接口发送特制请求，构造恶意系统命令并以 root 权限执行。该漏洞影响 Crestron AM-100/AM-101、Barco wePresent WiPG-1000P/1600W、Extron ShareLink 200/250、Teq AV IT WIPS710、SHARP PN-L703WA、Optoma WPS-Pro、Blackbox HD WPS、InFocus LiteShow3/4 等多款设备的指定固件版本，CVSS 评分 9.8，危害等级严重，目前已有公开 Metasploit 利用模块可用。"
published = "2019-04-30T21:29:00Z"
remediation = "建议立即升级受影响设备固件至安全版本：Barco wePresent WiPG-1600W 升级至 2.4.1.19 或更高版本；Crestron AM-100/AM-101、Extron ShareLink 200/250、Teq AV IT WIPS710、SHARP PN-L703WA、Optoma WPS-Pro、Blackbox HD WPS、InFocus LiteShow3/4 需联系各厂商获取最新修复固件并应用。无法立即升级时，在网络边界防火墙层面封禁 file_transfer.cgi 端点访问，或将受影响设备隔离在受管 VLAN 中并限制非必要入站访问。定期检查厂商安全公告（Crestron、Barco、Extron、Teq、SHARP、Optoma、Blackbox、InFocus）确认补丁发布情况。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "多厂商 无线演示系统 命令注入漏洞"
updated = "2026-06-17T02:35:52Z"

