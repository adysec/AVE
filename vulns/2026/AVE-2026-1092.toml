[basic]
description = "CVE-2026-45495 是 Microsoft Edge（基于 Chromium）浏览器中的一个远程代码执行漏洞。由于浏览器在处理特定输入时存在不当验证缺陷（CWE-20/CWE-35），攻击者可构造恶意网页内容，诱骗用户使用受影响版本的 Edge 访问该页面，从而在目标系统上执行任意代码。该漏洞影响未升级至 148.0.3967.70 或更高版本的 Microsoft Edge，攻击向量为网络（AV:N）、攻击复杂度低（AC:L）、无需特权（PR:N）但需要用户交互（UI:R），可导致系统机密性、完整性和可用性完全受损。CVSS v3.1 评分为 8.8，危害等级为高。"
published = "2026-05-18T18:17:38.600"
remediation = '立即将 Microsoft Edge (Chromium-based) 升级至 148.0.3967.70 或更高版本。用户可通过 Edge 菜单的"帮助和反馈"→"关于 Microsoft Edge"自动下载安装更新；企业环境可通过 Microsoft Update Catalog 或 WSUS 批量部署补丁。临时缓解措施为开启 Edge 的增强安全模式（Enhanced Security Mode），或避免访问不受信任的网站以降低攻击面。'
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "Microsoft Edge (Chromium) 远程代码执行漏洞"
updated = "2026-06-17T10:52:09.390"

