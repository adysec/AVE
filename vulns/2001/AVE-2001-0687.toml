[basic]
description = 'Lotus Domino Mail Server 5.0.5及更早版本存在缓冲区溢出漏洞。远程攻击者无需身份认证，可通过向邮件服务器发送包含超长"RCPT TO"字段的特制SMTP命令触发该溢出，导致服务器崩溃或执行任意代码。该漏洞影响运行受影响版本Domino邮件服务器的组织，攻击者利用此漏洞可完全控制服务器，造成敏感邮件数据泄露或进一步内网渗透。由于SMTP服务通常暴露于公网，攻击者可在无需任何凭据的情况下直接利用。'
published = "2001-06-02T04:00:00Z"
remediation = '建议立即将 Lotus Domino Mail Server 升级至 5.0.6 或更高版本以修复缓冲区溢出漏洞。若无法立即升级，可通过配置邮件网关对 "RCPT TO" 命令的长度进行严格限制，或在防火墙层面拦截异常长度的 SMTP 流量作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Lotus Domino Mail Server 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:58Z"

