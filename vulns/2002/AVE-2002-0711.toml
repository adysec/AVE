[basic]
description = "` 标签之间。<value>D-Link DI-804、Dl-704 以及 Linksys WAP11、Etherfast BEFW11S4 等型号网络设备的内置嵌入式HTTP服务器存在缓冲区溢出漏洞。远程攻击者无需身份认证即可向设备发送包含超长HTTP头部（如Host头）的特制请求，触发缓冲区溢出导致设备拒绝服务。该漏洞影响上述设备的多个固件版本，攻击者可利用此漏洞使路由器或无线接入点崩溃，造成网络服务中断。"
published = "2002-12-31T05:00:00Z"
remediation = "对于仍在使用受影响设备的用户，Linksys WAP11 应升级到 1.4.2 或更高版本固件，Linksys Etherfast BEFW11S4 应升级到 1.42.8 或更高版本，D-Link DI-804 应升级到 4.70 或更高版本，D-Link Dl-704 应升级到 V2.56b7 或更高版本以修复嵌入式 HTTP 服务器的缓冲区溢出漏洞。如厂商不再提供固件更新，建议关闭设备远程 Web 管理功能，仅允许内网可信 IP 访问管理界面，并在边界防火墙或上游设备处过滤包含超长 HTTP Header（如 Host 头）的入站请求。如设备已超出厂商支持周期且无法获取补丁，建议直接更换为仍在安全维护周期内的现代网络设备。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "D-Link/Linksys 路由器 嵌入式HTTP服务器缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T22:00:11Z"

