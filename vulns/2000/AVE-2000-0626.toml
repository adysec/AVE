[basic]
description = "Microsoft Windows NT 4.0 和 Windows 2000 系统的 DCE/RPC 协议在处理 SMBwriteX 请求时存在输入验证缺陷，远程攻击者可通过向目标主机的 139/TCP 或 445/TCP 端口发送特制的包含无效数据长度的 DCE/RPC SMBwriteX 数据包，触发系统内存访问异常，导致目标系统蓝屏崩溃或服务停止响应，造成拒绝服务。该漏洞无需身份认证即可远程利用，攻击复杂度低，但仅影响系统可用性，不影响机密性和完整性。Microsoft 已在 MS00-066 安全公告中发布补丁修复此漏洞。"
published = "2000-06-05T04:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS00-066 对应的补丁（下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=E5B0235B-EDDC-4774-9B25-E489E7A2D5E4），或在防火墙层面阻止对端口 135-139 和 445 的入站访问以缓解风险。受影响的 Windows 2000 服务器重启后可恢复 RPC 服务。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Windows NT 4.0/2000 DCE/RPC SMBwriteX 拒绝服务漏洞"
updated = "2026-06-16T21:51:57Z"

