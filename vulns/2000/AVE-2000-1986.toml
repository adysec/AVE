[basic]
description = "Poll It 2.0 的 pollit.cgi 脚本存在命令注入漏洞，远程攻击者可通过向 poll_options 参数提交包含 shell 元字符（如分号、管道符等）的恶意输入，触发服务器执行任意系统命令。该漏洞允许未经身份认证的攻击者完全控制目标服务器，实现数据窃取、恶意软件植入等操作。攻击条件简单，仅需目标服务器运行 Poll It 2.0 且 CGI 环境配置不当即可利用，危害等级严重。"
published = "2000-12-11T05:00:00.000"
remediation = "立即删除或禁用服务器上的 pollit.cgi 脚本，该产品已停止维护无安全更新。如仍需投票功能，迁移至现代替代方案（如 PHP 开发的投票系统），并对所有用户输入进行严格的参数化处理和特殊字符过滤。在 Web 服务器层面配置 ModSecurity 规则拦截包含 shell 元字符（如 `;` `|` `&` `$`）的请求参数。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "CGI World Poll It 2.0 远程命令执行漏洞"
updated = "2026-06-16T21:53:05.150"

