[basic]
description = "Mozilla Firefox 7.0 及 Thunderbird 7.0 在 Windows 平台使用 Direct2D（D2D）API 配合 Azure 图形后端时，存在同源策略绕过漏洞。该漏洞是 CVE-2011-2986 的回归问题，远程攻击者可通过将跨域图像数据插入 canvas 元素，窃取其他域中的敏感图像信息，导致信息泄露。攻击复杂度较高，需目标系统启用 Direct2D 和 Azure 图形后端。"
published = "2011-11-09T11:55:03Z"
remediation = '升级至 Firefox 8.0 或 Thunderbird 8.0 及以上版本。对于 Windows 系统，可在 about:config 中将 gfx.content.azure.enabled 设为 false 以禁用 Azure 图形后端作为临时缓解措施，或在 Firefox 选项中取消勾选"启用硬件加速"以禁用 Direct2D 渲染。'
score = 2.6
severity = "LOW"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird 跨源信息泄露漏洞"
updated = "2026-06-16T23:33:41Z"

