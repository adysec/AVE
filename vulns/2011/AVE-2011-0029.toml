[basic]
description = "ISC BIND 9.7.1 至 9.7.2-P3 版本在配置为权威域名服务器时存在资源管理错误漏洞。当服务器处理成功的 IXFR（增量区域传输）或 DDNS（动态更新）操作后的短暂时间窗口内，若同时收到查询请求，可导致服务器发生死锁，造成 BIND 守护进程挂起，从而引发拒绝服务。远程攻击者无需身份认证即可利用此漏洞，通过构造特定时序的查询请求触发死锁条件。高查询或更新频率的服务器受影响概率更高。该漏洞 CVSS 评分 7.1，危害等级高，建议升级至 BIND 9.7.2-P4 或更高版本。"
published = "2011-02-23T19:00:01Z"
remediation = "升级 ISC BIND 至 9.7.2-P4 或更高版本。Ubuntu 10.10 用户更新 bind9 至 1:9.7.1.dfsg.P2-2ubuntu0.2；Debian 用户参照 DSA-2208 更新；Red Hat/CentOS 用户应用 RHSA 对应补丁。如无法立即升级，可在配置文件中限制 dynamic update 和 IXFR 的客户端来源，降低查询速率以缓解风险。"
score = 7.1
severity = "HIGH"
sources = ["tenable"]
title = "ISC BIND 9 IXFR/DDNS 更新拒绝服务漏洞"
updated = "2026-06-16T23:27:18Z"

