[basic]
description = "Mozilla Firefox ESR 10.x 及 Thunderbird ESR 10.x 版本的 jsinfer.cpp 组件中存在类型推断缺陷，远程攻击者可通过构造特制的 JavaScript 代码触发内存破坏，导致拒绝服务或任意代码执行。该漏洞影响 Firefox 10.0.5 之前版本及 Thunderbird 10.0.5 之前版本，CVSS 评分 9.3，危害严重。攻击者只需诱导用户访问恶意网页即可触发，无需其他认证条件。"
published = "2012-06-05T23:55:01.560"
remediation = "立即升级 Mozilla Firefox 至 13.0 或 Firefox ESR 10.0.5 及以上版本，Thunderbird 升级至 13.0 或 Thunderbird ESR 10.0.5 及以上版本，SeaMonkey 升级至 2.10 及以上版本。Red Hat 用户可安装 RHSA-2012:0710/RHSA-2012:0715 更新，Debian 用户安装 DSA-2499 更新。如无法立即升级，可在 Thunderbird/SeaMonkey 中禁用 JavaScript（编辑 about:config 将 javascript.enabled 设为 false）作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:40:36.387"

