[basic]
description = "W3.org Anaya Web开发服务器中的sendtemp.pl脚本存在目录遍历漏洞，攻击者可通过在templ参数中注入..（点斜杠）序列绕过路径验证，从而读取服务器上的任意文件。该漏洞影响使用该脚本的Web服务器，攻击者无需身份验证即可远程发起利用，可能导致敏感文件（如配置文件、密码文件等）内容泄露。攻击条件为目标服务器运行存在漏洞的sendtemp.pl脚本并允许外部HTTP请求访问，攻击者仅需构造包含目录遍历字符的特制请求即可读取受保护文件。"
published = "2001-05-03T04:00:00Z"
remediation = '立即删除或禁用 sendtemp.pl 脚本以消除风险。若必须保留，需修改脚本代码，在处理 templ 参数前使用正则表达式过滤掉所有 ".." 序列，并强制将请求路径限制在预定义的模板目录内，禁止访问根目录或系统敏感文件夹。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "W3.org Anaya Web Server 目录遍历文件读取漏洞"
updated = "2026-06-16T21:54:00Z"

