[basic]
description = "Apple Safari 6.0 之前版本使用的 WebKit 组件中存在内存破坏漏洞，远程攻击者可通过诱导用户访问特制网站触发内存损坏，导致任意代码执行或应用程序崩溃。该漏洞源于 WebKit 在处理畸形网页内容时存在边界错误，攻击者无需身份认证即可利用，影响 Apple Safari、iOS 及 iTunes 等多个产品。Apple 已在 Safari 6.0 及 iOS 6.0 中修复此漏洞。"
published = "2012-07-25T20:55:01Z"
remediation = "立即将 Safari 升级至 6.0 或更高版本（OS X Lion v10.7.4 及以上系统适用），可通过 Apple 软件更新或从 support.apple.com/kb/HT5400 下载安装。使用 iTunes 10.6.3 的用户应将 iTunes 升级至最新版本。iOS 设备用户应升级至 iOS 6.0 或更高版本（设置 > 通用 > 软件更新）。如无法升级，建议禁用 WebKit 渲染或使用其他浏览器（如 Chrome/Firefox）作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:38:04Z"

