[basic]
description = "SmartWin CyberOffice Shopping Cart 2（又称CyberShop）是一款在线购物车系统，其在处理商品表单时使用隐藏表单变量来存储商品价格信息，但未对Price参数进行服务器端校验。未经身份认证的远程攻击者可通过修改网页中的Price隐藏表单变量来篡改商品售价，以远低于正常价格的价格完成购买，从而获取非法经济利益。该漏洞影响SmartWin Technology CyberOffice Shopping Cart 2.0版本，利用门槛极低，攻击者仅需在提交订单时更改Price参数值即可实施利用，无需任何账号凭证或技术基础。商家若部署此版本系统，将面临商品售价被恶意压低导致的直接经济损失，属于典型的业务逻辑层价格篡改漏洞。"
published = "2000-12-19T05:00:00.000"
remediation = "在服务器端实现价格校验，禁止信任客户端传递的 Price 隐藏表单变量，确保订单价格由后端数据库统一核算。若无法升级软件，应通过 Web 应用防火墙 (WAF) 拦截对价格参数的异常篡改请求，或直接迁移至现代安全的电商平台。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "SmartWin CyberOffice Shopping Cart 2.0 价格修改漏洞"
updated = "2026-06-16T21:52:46.943"

