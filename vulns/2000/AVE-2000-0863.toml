[basic]
description = "PCCS MySQLDatabase Admin Tool Manager 1.2.4 及更早版本在安装时将包含数据库连接凭据的敏感文件 dbconnect.inc 放置在 Web 根目录下，导致远程攻击者无需任何身份认证即可通过直接访问该文件获取数据库管理员密码等敏感信息。攻击者利用获取的凭据可进一步登录数据库后台，对数据进行未授权访问、篡改或破坏，严重威胁系统数据安全。"
published = "2000-10-20T04:00:00.000"
remediation = '立即将 dbconnect.inc 文件移出 Web 根目录（如移至 Web 根目录之外或限制为 600 权限），并在 Apache/Nginx 配置中添加对该文件的访问拒绝规则：`<Files "dbconnect.inc"> Deny from all</Files>`。同时升级 PCCS MySQLDatabase Admin Tool Manager 至 1.2.5 或更高版本（若厂商已停止维护则建议更换为其他数据库管理工具）。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "PCCS MySQLDatabase Admin Tool Manager 信息泄露漏洞"
updated = "2026-06-16T21:52:18.757"

