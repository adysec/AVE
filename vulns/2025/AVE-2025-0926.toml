[basic]
description = "tags.<value>Linux 内核 Xilinx GPIO 驱动存在 improper locking 漏洞。该驱动在实现中断控制器接口时使用普通 spinlock（gpio_lock）进行内部保护，但 irq_chip 函数可能在 raw spinlock 上下文（如中断处理路径）中被调用，导致内核锁依赖检查器触发无效等待上下文警告，进而可能引发系统死锁或拒绝服务。受影响版本包括使用 Xilinx ZynqMP 等平台的 Linux 内核。攻击者需在本地系统上以低权限运行，通过触发 GPIO 中断处理流程即可复现该问题，导致系统可用性受影响。CVSS 评分 5.5，危害等级中等。"
published = "2025-02-09T12:15:29Z"
remediation = "将 Linux 内核升级至已修复该问题的稳定版本：5.15.x 系列升级到 5.15.179 或更高版本，6.1.x 系列升级到 6.1.129 或更高版本，6.6.x 系列升级到 6.6.74 或更高版本，6.7 至 6.12.x 系列升级到 6.12.11 或更高版本，6.13-rc 系列升级到包含 commit 9860370c2172 的版本。以 Ubuntu 22.04 LTS 为例，应安装 linux-image-5.15.0-1084-generic 或更高版本的内核包并重启系统。如无法立即升级内核，可通过禁用 Xilinx GPIO 中断控制器作为临时缓解措施，但该操作会影响使用 Xilinx GPIO 中断的相关硬件功能。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 Xilinx GPIO 驱动不当锁漏洞"
updated = "2026-06-17T08:44:01Z"

