[basic]
description = "标签包裹。<value>gnuserv 3.12 及更早版本（随 XEmacs 发行）在处理 X Windows MIT-MAGIC-COOKIE cookie 时未对指定长度进行正确边界校验，存在缓冲区溢出漏洞（CWE-120）。未经身份认证的远程攻击者可通过向目标服务发送特制的超长 cookie 触发缓冲区溢出，进而执行任意系统命令；也可利用长度校验缺陷进行暴力破解以绕过认证机制。该漏洞影响所有使用受影响 gnuserv 版本的 XEmacs 用户，CVSS 评分 10.0，危害等级严重。"
published = "2001-05-03T04:00:00Z"
remediation = "立即将 gnuserv 升级至 3.12 或更高版本。XEmacs 用户应更新 XEmacs 至包含 gnuserv 3.12 及以上的版本，或单独替换 /usr/lib/xemacs/xemacs-packages/gnuserv 目录下的 gnuserv 组件。如暂时无法升级，应在防火墙中阻断 12000/tcp 端口（gnuserv 默认监听端口）的外部访问，并通过 xauth 使用更长的 MIT-MAGIC-COOKIE 以增大暴力破解难度，同时检查并限制 localhost 以外的连接来源。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "XEmacs gnuserv 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:51Z"

