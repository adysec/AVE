[basic]
description = "mailto CGI脚本存在命令注入漏洞，远程攻击者通过在emailadd表单字段中注入shell元字符（如分号、管道符等），可在目标Web服务器上执行任意系统命令。该漏洞无需身份认证即可利用，攻击者通过发送特制HTTP请求即可触发，影响运行mailto CGI脚本的Apache、IIS等Web服务器，CVSS评分7.5，危害等级高，可能导致服务器被完全控制。"
published = "2000-11-14T05:00:00.000"
remediation = "删除或禁用 mailto.cgi 脚本，该脚本存在固有安全缺陷无法彻底修复。若必须保留邮件发送功能，应替换为经过输入验证的安全邮件表单，禁止在 CGI 脚本中使用 shell 调用处理用户输入。临时缓解措施：在 Web 服务器配置中添加规则拒绝访问 /cgi-bin/mailto.cgi 路径的请求。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Unix mailto CGI脚本 远程代码执行漏洞"
updated = "2026-06-16T21:52:39.473"

