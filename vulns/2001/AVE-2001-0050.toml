[basic]
description = 'IBM WebSphere Application Server 1.3.x 及 IBM HTTP Server 1.3.x 的 Fast Response Cache Accelerator (FRCA) 组件中 AfpaCache 模块存在内核泄漏漏洞。远程未授权攻击者可通过发送一系列畸形 HTTP 请求触发 "bad request" 错误，导致内核资源泄漏，最终引发拒绝服务。该漏洞影响 WebSphere 3.52 及相关版本，攻击复杂度低、无需身份认证、可通过网络远程利用，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），主要影响系统可用性。'
published = "2001-03-13T05:00:00.000"
remediation = "建议将 IBM HTTP Server 1.3.x 升级至 Fix Pack 13.0.11 或更高版本，或将 WebSphere Application Server 升级至 3.52 后续 Fix Pack 以修复 AfpaCache 模块内核内存泄漏。若无法立即升级，可在 httpd.conf 配置文件中注释或删除 AfpaCache 相关配置行以禁用 Fast Response Cache Accelerator 功能，随后重启 IBM HTTP Server 服务。作为临时缓解措施，还可在防火墙或反向代理层面限制对 HTTP 服务器的异常请求频率，阻止攻击者发送大量畸形请求导致内核内存耗尽。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "IBM WebSphere Application Server AfpaCache 拒绝服务漏洞"
updated = "2026-06-16T21:53:41.827"

