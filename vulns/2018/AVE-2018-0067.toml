[basic]
description = "这是一个影响Dell EMC Avamar和Integrated Data Protection Appliance安装管理器的访问控制漏洞。受影响的设备版本包括Avamar Server 7.3.1、7.4.1和7.5.0，以及Integrated Data Protection Appliance 2.0和2.1。攻击者无需任何身份验证即可利用该漏洞，访问或修改Local Download Service (LDLS)凭据。这些凭据用于连接Dell EMC在线支持平台。如果攻击者将LDLS配置更改为无效配置，则Avamar Installation Manager可能无法成功连接到Dell EMC在线支持网站。此外，攻击者可以利用窃取的凭据登录到Dell EMC在线支持，冒充AVI服务执行操作。该漏洞通过缺失访问控制检查机制实现，攻击者仅需向目标发送特制的网络请求即可触发，导致credentials泄露和非法使用，CVSS评分9.8，威胁等级严重，由Microsoft在2024年8月安全更新中修复。"
published = "2018-04-09T20:29:00Z"
remediation = "建议立即应用 Dell EMC 官方发布的热修复补丁：Avamar 7.3.1 用户安装 HOTFIX 290316，Avamar 7.4.1 和 IDPA 2.0 用户安装 HOTFIX 291882，Avamar 7.5.0 和 IDPA 2.1 用户安装 HOTFIX 291881。补丁可从 Dell EMC 下载中心获取，安装无需重启。若暂时无法打补丁，可在防火墙层面限制对 Avamar Installation Manager 管理端口（默认 HTTPS 443）的访问，仅允许受信任管理 IP 访问，并禁用 LDLS（本地下载服务）功能作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Dell EMC Avamar Installation Manager 访问控制缺失漏洞"
updated = "2026-06-17T01:50:44Z"

