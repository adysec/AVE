[basic]
description = "Microsoft Office 远程执行代码漏洞，影响 Microsoft Office 2010 SP2、Office 2013 SP1 及 Office 2016 等多个版本。该漏洞为未明确披露细节的远程代码执行缺陷，CVSS 3.1 评分为 7.6（高危），攻击向量为网络，攻击复杂度高，需要高权限账户并诱使用户打开特制恶意 Office 文档方可触发利用。攻击成功后，攻击者可在目标系统上下文中执行任意代码，完全控制受影响设备的机密性、完整性和可用性。该漏洞已被美国网络安全与基础设施安全局（CISA）列入已知被利用漏洞目录（KEV），确认存在野外主动利用迹象。Microsoft 已在 2021 年 3 月发布安全更新修复此漏洞。"
published = "2021-03-11T16:15:17Z"
remediation = "立即安装 Microsoft 2021 年 3 月 Office 安全更新（KB5000822 及对应版本补丁），或通过 Office 自动更新功能获取最新版本。受影响版本包括 Microsoft Office 2010 SP2、Office 2013 SP1 和 Office 2016（16.0.0 之前版本），受影响系统涵盖 32 位、x64 及 ARM64 平台。建议将 Office 2010 SP2 升级至更高受支持版本（Office 2013 SP1 ≥15.0.0、Office 2016 ≥16.0.0），同时确保系统已安装该月 cumulative update。如无法立即打补丁，可在防火墙或邮件网关处阻止来自外部不可信来源的 Office 文档附件（.doc/.docx/.xls/.xlsx 等），并限制 Office 应用程序访问 UNC 路径和外部网络连接，以降低远程代码执行风险。"
score = 7.6
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Office 远程代码执行漏洞"
