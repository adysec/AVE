[basic]
description = "KDE 3.0.2 及更早版本中的 Konqueror 浏览器在 SSL 实现上存在严重安全缺陷，未能正确验证由中间 CA 签发证书的基本约束（Basic Constraints）字段。远程攻击者无需任何身份认证，即可在网络通信路径中实施中间人攻击，伪造受信任站点的 SSL 证书，使用户误认为正在与合法网站建立安全加密连接，从而窃听或篡改用户在受保护会话中传输的敏感数据。"
published = "2002-09-24T04:00:00Z"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "KDE Konqueror SSL 证书验证绕过漏洞"
updated = "2026-06-16T21:58:29Z"

