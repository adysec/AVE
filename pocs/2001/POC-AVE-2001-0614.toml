[exploit]
exp_urls = []
poc_urls = []

[info]
author = "ave"
description = "检测 Internet Explorer 5.0-5.5 中 ActiveX 控件的 Scriptlet Rendering 变体漏洞，该漏洞允许攻击者通过构造恶意网页读取目标系统上的任意文件。"
id = "POC-AVE-2001-0614"
name = "Microsoft Internet Explorer Scriptlet Rendering 文件读取漏洞 PoC"
severity = "low"
tags = ["ave-2001-0614"]
vuln_id = [
    "CVE-2001-0091",
    "AVE-2001-0614",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.headers]
User-Agent = "Mozilla/4.0 (compatible; MSIE 5.0; Windows NT 5.0)"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<OBJECT",
    "CLSID",
    "scriptlet",
]
