[info]
author = "ave"
description = "Squid 2.4.STABLE6 之前版本存在多个缓冲区溢出漏洞，远程未认证攻击者可通过 MSNT 认证助手、Gopher 客户端或 FTP 目录列表解析器触发拒绝服务或远程代码执行"
id = "POC-AVE-2002-0018"
name = "CVE-2002-0713 PoC"
severity = "high"
tags = ["ave-2002-0018"]
vuln_id = [
    "CVE-2002-0713",
    "AVE-2002-0018",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
