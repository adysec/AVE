[basic]
description = "Google Chrome 的 Media 组件中存在越界读取漏洞，该漏洞源于对媒体数据处理时未正确验证内存边界。远程攻击者可通过构造特制的 HTML 页面，诱使目标用户访问该页面，从而触发越界内存访问，导致敏感信息泄露。CVSS 评分 7.5，危害等级高。攻击者无需身份认证即可利用，且无需用户交互以外的额外权限。受影响的版本为 Google Chrome 141.0.7390.54 之前的所有版本。Google 已在 Chrome 141.0.7390.54 版本中修复此漏洞。"
published = "2025-11-06T22:15:39Z"
remediation = "立即将 Google Chrome 升级至 141.0.7390.54 及以上版本（通过 chrome://settings/help 检查更新并重启浏览器）。基于 Chromium 的浏览器（Edge、Brave、Opera 等）需同步更新至对应版本。Linux 发行版用户（如 Fedora）执行包管理器更新至 chromium 141.0.7390.122。无法立即升级时，可禁用不受信任的 HTML 页面渲染或使用 Site Isolation 功能缓解越界读取风险。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome Media 越界读取漏洞"
updated = "2026-06-17T08:29:52Z"

