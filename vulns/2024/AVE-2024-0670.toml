[basic]
description = "Linux 内核 UVC 视频驱动（drivers/media/usb/uvc/uvc_v4l2.c）中存在释放后使用漏洞。当应用程序通过 V4L2 接口提交异步控制请求时，驱动会保存发起操作的文件句柄指针。若用户在设备操作完成前关闭该文件描述符，对应的内核结构体被释放，但驱动中仍保留指向已释放内存的悬空指针。后续设备完成异步操作时会访问该悬空指针，导致释放后使用。本地低权限攻击者可利用此漏洞触发内核内存破坏，实现权限提升，获得完全控制目标系统的能力。CVSS 评分 7.8，危害等级高。Linux 主线内核已合入修复补丁。"
published = "2025-02-27T03:15:11Z"
remediation = "立即将 Linux 内核升级至以下已修复版本：6.13.3 及以上、6.12.14 及以上、6.6.80 及以上。Debian 11 用户安装 DLA-4178 更新，Debian 12 用户安装 DSA-5900 更新，Ubuntu 18.04 LTS 用户安装 USN-7540-1 更新。如无法立即升级，可通过限制本地用户对 UVC 视频设备的访问权限作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux Kernel uvcvideo 驱动释放后使用漏洞"
updated = "2026-06-17T08:14:25Z"

