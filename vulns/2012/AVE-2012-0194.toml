[basic]
description = "Oracle MySQL Server 5.5.23及之前版本中存在一个未明确的拒绝服务漏洞，位于Server Optimizer组件中。远程认证用户可通过发送特制的SQL查询或利用GIS扩展、InnoDB存储引擎中的异常处理缺陷，触发服务进程异常终止或资源耗尽，导致数据库服务不可用。攻击者需拥有有效数据库账户才能利用此漏洞，CVSS评分4.0，危害等级中低。Oracle已在2012年7月的关键补丁更新中修复该漏洞，建议升级至MySQL 5.5.24及以上版本。"
published = "2012-07-17T22:55:02.413"
remediation = "升级 MySQL Server 至 5.5.24 或更高版本。如使用 Oracle 官方发行版，从 support.oracle.com 下载对应补丁；如使用操作系统包管理器（apt/yum），执行 `apt-get update && apt-get upgrade mysql-server` 或 `yum update mysql-server`。无法立即升级时，限制可信用户对 MySQL 服务的访问权限，通过防火墙仅允许必要 IP 连接 3306 端口作为临时缓解措施。"
score = 4
severity = "MEDIUM"
sources = ["tenable"]
title = "Oracle MySQL Server 拒绝服务漏洞"
updated = "2026-06-16T23:40:14.640"

