[info]
author = "ave"
description = "向目标 Windows 系统发送 HTTP 请求，检测响应中是否包含 Windows 特征字符串，判断目标是否存在地理位置服务信息泄露漏洞（CVE-2025-21301）。"
id = "POC-AVE-2025-0760"
name = "Microsoft Windows 地理位置服务信息泄露漏洞 PoC"
severity = "medium"
tags = ["ave-2025-0760"]
vuln_id = [
    "CVE-2025-21301",
    "AVE-2025-0760",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["windows"]
