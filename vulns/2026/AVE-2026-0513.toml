[basic]
description = "GitHub Copilot 和 Visual Studio Code 的 Copilot Chat 扩展中存在命令注入漏洞（CWE-77），由于对用户输入中特殊元素的过滤不充分，未经授权的远程攻击者可通过诱导用户访问恶意链接或打开特制文件，在目标系统上注入并执行任意命令，从而绕过安全功能。攻击者利用此漏洞可获取机密信息、篡改数据或完全控制受影响系统。该漏洞影响 Visual Studio Code Copilot Chat 扩展 0.27.0 至 0.37.1 之前版本及 Visual Studio Code 1.0.0 至 1.110.1 之前版本，CVSS 评分 8.8，危害等级高。Microsoft 已在 2026 年 2 月安全更新中发布补丁修复此漏洞。"
published = "2026-02-10T18:16:34Z"
remediation = '立即将 Visual Studio Code 升级至 1.110.1 或更高版本，并将 GitHub Copilot Chat 扩展升级至 0.37.1 或更高版本。可在 VS Code 中通过"帮助→检查更新"自动获取。如无法立即升级，建议在 VS Code 设置中禁用 Copilot Chat 扩展（extensions: disable GitHub.copilot-chat）作为临时缓解措施，同时避免在不可信网络环境中使用 Copilot 功能。'
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "GitHub Copilot 和 Visual Studio Code 命令注入安全功能绕过漏洞"
updated = "2026-06-17T10:18:46Z"

