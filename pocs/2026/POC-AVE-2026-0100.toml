[info]
author = "ave"
description = "通过向 /PSEMHUB/hub 发送包含 Java 反序列化 payload 的 POST 请求，检测 Oracle PeopleSoft PeopleTools 8.61/8.62 的 Updates Environment Management 组件是否存在未授权 Java 反序列化漏洞（CVE-2026-35273）。若响应包含 Java 序列化数据特征（rO0ABX）且状态码为 200，则判定存在漏洞。"
id = "POC-AVE-2026-0100"
name = "Oracle PeopleSoft PeopleTools PSEMHUB Pre-Auth Java Deserialization RCE PoC"
severity = "critical"
tags = ["ave-2026-0100"]
vuln_id = [
    "CVE-2026-35273",
    "AVE-2026-0100",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/PSEMHUB/hub"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["rO0ABX"]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
