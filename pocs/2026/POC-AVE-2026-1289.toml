[info]
author = "ave"
description = "验证 ASUS Business Manager 是否存在外部控制文件路径（CWE-73）漏洞，本地低权限用户可通过篡改进程间通信（IPC）消息以 SYSTEM 权限执行任意代码。"
id = "POC-AVE-2026-1289"
name = "ASUS Business Manager 外部控制文件路径漏洞 PoC"
severity = "high"
tags = ["ave-2026-1289"]
vuln_id = [
    "CVE-2026-8921",
    "AVE-2026-1289",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
