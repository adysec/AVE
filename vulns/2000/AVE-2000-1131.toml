[basic]
description = "Netopia ISDN Router 650-ST 4.3.5 之前版本存在认证绕过漏洞。远程攻击者无需任何身份认证，直接连接至路由器的登录界面并输入特定控制字符，即可绕过登录验证，读取系统日志中的敏感信息。该漏洞源于登录认证机制对控制字符处理不当，攻击者利用简单的网络连接即可实施攻击，无需用户交互或特殊权限。CVSS 评分 5.0，危害等级中危，影响机密性。"
published = "2001-01-09T05:00:00Z"
remediation = "立即将 Netopia ISDN Router 650-ST 固件升级至 4.3.5 或更高版本。如无法升级，可在路由器管理界面限制对登录端口的远程访问，仅允许受信任 IP 连接，并禁用 Telnet 等非加密管理协议作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Netopia ISDN Router 650-ST 未授权日志信息泄露漏洞"
updated = "2026-06-16T21:53:19Z"

