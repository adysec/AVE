[basic]
description = "SIX-webboard 2.01 及更早版本中的 generate.cgi 脚本存在目录遍历漏洞，远程攻击者无需身份认证即可通过在 content 参数中插入 ../（点点斜杠）序列读取服务器上的任意文件。该漏洞可导致敏感信息泄露，如配置文件、密码文件等。攻击者只需向目标 Web 服务器发送特制的 HTTP 请求即可触发，利用门槛低，危害较大。"
published = "2001-08-13T04:00:00Z"
remediation = "立即升级 SIX-webboard 至 2.01 以上版本（如厂商已停止维护，建议迁移至其他受支持的论坛系统）。临时缓解措施：在 Web 服务器（Apache/Nginx）层面配置规则，对 `/cgi-bin/webboard/generate.cgi` 的 `content` 参数过滤 `../` 和空字节 `%00`，或直接禁用该 CGI 脚本的访问权限。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "SIX-webboard 2.01 任意文件读取漏洞"
updated = "2026-06-16T21:55:36Z"

