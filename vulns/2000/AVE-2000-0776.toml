[basic]
description = 'ICQ Web Front HTTPd 对包含问号字符（"?"）的 URL 请求处理不当，远程攻击者可通过发送含有该特殊字符的畸形 HTTP GET 请求触发服务崩溃，导致拒绝服务。该漏洞影响 Mirabilis ICQ Web Front Server 及其 guestbook.cgi 组件，攻击者无需身份认证即可远程发起攻击，CVSS 评分 5.0，危害等级中危。'
published = "2000-12-11"
remediation = "建议立即停用 Mirabilis ICQ Web Front HTTPd 服务，该产品已停止维护且无安全补丁可用。迁移至受支持的 Web 服务器（如 Apache HTTP Server 或 Nginx）作为替代方案。如无法立即迁移，可在反向代理或网络防火墙层面配置规则，拦截包含连续多个 `?` 字符的畸形 HTTP GET 请求，以临时缓解拒绝服务攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Mirabilis ICQ Web Front Server guestbook.cgi 拒绝服务漏洞"
updated = "2000-12-11"

