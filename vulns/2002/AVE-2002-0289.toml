[basic]
description = "Python 2.2.1 及更早版本的 os._execvpe 函数在创建临时文件时采用了可预测的命名机制。本地攻击者可以通过在预测的临时文件路径中创建恶意符号链接（Symlink Attack），诱导高权限进程在执行相关操作时覆盖或写入敏感文件，从而实现任意代码执行。该漏洞影响所有运行受影响版本的 Python 环境，攻击条件为攻击者需具备本地用户权限，可通过操纵文件系统层级的临时文件链接完成利用。"
published = "2002-10-04T04:00:00Z"
remediation = "建议将 Python 环境升级至 2.2.2 或更高版本，该版本已修复 os._execvpe 创建临时文件时的可预测性问题。若无法立即升级，可通过限制 /tmp 等临时目录的权限（如设置 Sticky Bit）或使用更安全的临时文件创建 API 来缓解符号链接攻击风险。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "Python os._execvpe 临时文件符号链接攻击本地代码执行漏洞"
updated = "2026-06-16T21:58:45Z"

