[basic]
description = "Google Chrome 的 Split View 模块存在不当实现漏洞，在 143.0.7499.41 之前的版本中，未经身份认证的远程攻击者可通过构造恶意域名，诱导用户执行特定的 UI 手势操作，从而实施 UI 欺骗攻击。该漏洞影响所有使用受影响版本 Chromium 的浏览器发行版，攻击者利用精心设计的域名欺骗用户界面，使用户误以为其正在与可信站点交互。CVSS 评分为 4.3（中等），利用条件为需要用户主动参与 UI 手势交互。"
published = "2025-12-02T19:15:48Z"
remediation = "建议将 Google Chrome 浏览器升级至 143.0.7499.41 或更高版本。对于使用 Fedora 42 的用户，请执行系统更新，将 chromium 软件包升级至 143.0.7499.146 版本，以修复分屏视图（Split View）中可能导致 UI 欺骗的实现缺陷。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome 浏览器 Split View 界面欺骗漏洞"
updated = "2026-06-17T08:34:29Z"

