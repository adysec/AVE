[basic]
description = "Sequelize 是一款流行的 Node.js ORM 框架。在 6.37.4 版本之前，当应用使用 Oracle 数据库方言（dialect）时，`sql-string.js` 中的 `escape` 函数存在 SQL 注入漏洞。该函数在遇到以 `TO_TIMESTAMP` 或 `TO_DATE` 开头的字符串值时，会直接返回原值而不转义单引号，导致攻击者可以通过构造包含这些函数前缀的恶意输入注入任意 SQL 表达式。该漏洞影响所有使用 Sequelize Oracle 方言并对外暴露用户可控查询参数的应用程序。攻击者无需身份认证，仅需向目标应用发送特制 HTTP 请求即可触发，进而可能导致数据库中的数据被窃取、篡改或删除，严重危害数据的机密性、完整性和可用性。该漏洞在 Sequelize v6.37.4 中已修复。"
published = "2026-08-03T21:16:41Z"
remediation = "立即将 Sequelize 升级至 6.37.4 或更高版本，该版本已修复 sql-string.js 中 escape 函数对 TO_TIMESTAMP/TO_DATE 开头字符串未转义引号的问题。如暂时无法升级，可在应用层对用户输入进行严格校验，禁止传入以 TO_TIMESTAMP 或 TO_DATE 开头的字符串，或临时切换数据库 dialect 为 MySQL/PostgreSQL 等其他类型以规避 Oracle dialect 下的 SQL 注入风险。"
score = 9.8
severity = "CRITICAL"
sources = ["ghsa"]
title = "Sequelize Oracle SQL 注入漏洞"
updated = "2026-08-04T15:16:42Z"

