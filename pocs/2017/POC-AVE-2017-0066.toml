[info]
author = "AVE"
description = "CVE-2017-0149 是 Microsoft Internet Explorer 9/10/11 中 MSHTML 引擎处理内存对象时存在的远程代码执行漏洞，属于客户端漏洞，攻击者通过构造恶意网页诱导用户访问触发。由于该漏洞无法通过服务端 HTTP 请求可靠检测，本 PoC 仅做无损探测。"
id = "POC-AVE-2017-0066"
name = "CVE-2017-0149 PoC"
severity = "high"
tags = ["ave-2017-0066"]
vuln_id = [
    "CVE-2017-0149",
    "AVE-2017-0066",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "MSHTML",
    "Trident",
]
