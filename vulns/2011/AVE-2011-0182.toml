[basic]
description = "Google Chrome 浏览器在 17.0.963.65 版本之前存在使用后释放（Use-After-Free）漏洞，该漏洞位于 V8 JavaScript 引擎对引号（quote）的处理逻辑中。远程攻击者可构造包含恶意 JavaScript 代码的特制网页，诱使目标用户访问后触发内存释放后仍被引用的问题，导致浏览器崩溃或拒绝服务，并可能造成任意代码执行。该漏洞影响所有使用受影响版本 Google Chrome 的用户，CVSS 评分为 6.8，危害等级中等。"
published = "2012-03-05T19:55:01Z"
remediation = "立即将 Google Chrome 升级至 17.0.963.65 或更高版本。用户可通过 Chrome 的「设置」→「关于 Chrome」自动检测并安装更新；如无法自动更新，请前往 https://www.google.com/chrome 手动下载安装最新稳定版。如暂时无法升级，可在防火墙或代理层面限制访问包含恶意引号内容构造的网页，临时缓解远程攻击风险。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 释放后利用漏洞"
updated = "2026-06-16T23:32:29Z"

