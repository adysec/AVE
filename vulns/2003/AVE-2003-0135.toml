[basic]
description = "KDM（KDE显示管理器）在 KDE 3.1.3 及更早版本中，未对 pam_setcred 函数调用的返回结果进行验证。当该函数调用失败时，系统仍继续执行后续登录流程，导致 PAM（Pluggable Authentication Modules）认证状态与实际会话状态不一致。攻击者可通过精心构造的输入触发 PAM 模块（如 MIT pam_krb5）内部的错误条件，使 pam_setcred 调用失败但登录流程仍被允许通过，从而绕过认证机制获取 root 权限。该漏洞影响 KDE 3.1.3 及更早版本中的 KDM 组件，由于无需身份认证且利用条件简单，攻击者可远程发起攻击，对运行受影响版本 KDE 的 Linux/Unix 系统造成严重的安全风险。CVSS 评分 10.0，危害等级为严重。"
published = "2003-10-06T04:00:00Z"
remediation = "建议立即升级 KDE 至 3.1.4 或更高版本，Debian woody 用户升级 kdebase 至 4:2.2.2-14.7，Ubuntu 6.06 LTS 用户升级至 3.5.2-0ubuntu27.1。如无法立即升级，可临时禁用 KDM 改用控制台登录，或将 KDM 配置为仅监听本地回环接口 127.0.0.1 以限制远程攻击面。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "KDE KDM PAM模块PAM_SetCred权限提升漏洞"
updated = "2026-06-16T22:02:39Z"

