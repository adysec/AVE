[basic]
description = "Macromedia JRun 3.0/3.1/4.0 的 JSP 引擎中存在拒绝服务漏洞。具有 JSP 页面上传权限的攻击者可通过构造包含 WPrinterJob().pageSetup(null,null) 调用的恶意 JSP 页面，触发引擎内部异常导致 JRun 服务进程崩溃，造成拒绝服务。该漏洞无需身份认证即可远程触发，攻击条件低，影响 JRun 3.0、3.1 及 4.0 版本。"
published = "2002-10-04T04:00:00.000"
remediation = "升级JRun到最新版本，安装Macromedia提供的安全补丁（如JRun 4.0 Service Pack 1或更高版本），并禁止在JSP页面中使用sun.awt.windows.WPrinterJob类，或将其访问权限设置为仅限内部网络。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Macromedia JRun 3/4 JSP引擎拒绝服务漏洞"
updated = "2026-06-16T21:58:25.333"

