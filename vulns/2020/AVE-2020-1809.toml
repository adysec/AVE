[basic]
description = "Citrix ADC、Citrix Gateway 及 Citrix SDWAN WAN-OP 多个版本存在访问控制不当漏洞（CWE-284、CWE-287）。低权限用户可通过未授权访问 Citrix Nitro API 接口，绕过身份验证机制获取系统敏感信息，如网络拓扑、设备配置及用户会话等受限数据。该漏洞影响 Citrix ADC 和 Gateway 13.0-58.30 之前、12.1-57.18 之前、12.0-63.21 之前、11.1-64.14 之前及 10.5-70.18 之前版本，以及 Citrix SDWAN WAN-OP 11.1.1a 之前、11.0.3d 之前和 10.2.7 之前版本。攻击者无需用户交互即可在网络远程发起利用，但需具备低权限凭据，仅导致有限的信息泄露，无法修改数据或执行代码。CVSS v3.1 评分为 4.3，危害等级为中危。Citrix 已在后续版本中修复该漏洞，建议用户升级至安全版本以消除风险。"
published = "2020-07-10T16:15:12Z"
remediation = "立即将 Citrix ADC 和 Citrix Gateway 升级至修复版本 13.0-58.30、12.1-57.18、12.0-63.21、11.1-64.14 或 10.5-70.18，将 Citrix SD-WAN WAN-OP 升级至 11.1.1a、11.0.3d 或 10.2.7。如暂无法升级，应通过防火墙或访问控制列表限制对 Nitro API 端口的未授权访问，仅允许受信任的管理网段访问，并监控异常 API 请求日志。"
score = 4.3
severity = "MEDIUM"
sources = ["kev"]
title = "Citrix ADC 与 Gateway 未授权访问信息泄漏漏洞"
updated = "2026-06-17T03:26:02Z"

