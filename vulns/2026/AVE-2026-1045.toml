[basic]
description = "udhcpc 存在权限提升漏洞，由于在处理 DHCP 客户端交互时对输入验证不当，本地低权限用户 charx-web 可通过触发该漏洞在系统上以 root 身份执行任意操作系统命令，最终导致完全系统沦陷。该漏洞影响使用 udhcpc 作为 DHCP 客户端的嵌入式 Linux 系统及路由器等设备。攻击者需具备本地访问权限并登录为 charx-web 用户，通过利用命令注入机制即可获取 root 权限并完全控制受影响系统。CVSS 评分 8.5，危害等级高。"
published = "2026-07-30T07:16:57Z"
remediation = '建议立即将 Phoenix Contact CHARX SEC-3000/3050/3100/3150 充电控制器固件升级至 1.9.1 或更高版本。可通过设备 Web 管理界面或 Phoenix Contact 官方固件更新工具进行升级。升级前请备份配置，升级后验证固件版本显示为 1.9.1+。若暂时无法升级，可作为临时缓解措施限制本地 "charx-web" 用户权限，或在网络层面隔离设备管理接口。'
score = 8.5
severity = "HIGH"
sources = ["zdi"]
title = "Phoenix Contact CHARX SEC 命令注入权限提升漏洞"
updated = "2026-07-31T23:17:23Z"

