[basic]
description = "Mozilla Firefox、Thunderbird 及 SeaMonkey 的浏览器引擎中存在多处未指定的内存破坏漏洞，涉及 methodjit/ImmutableSync.cpp 及 JSObject::makeDenseArraySlow 函数等多个组件。远程攻击者可通过诱导用户访问特制网页触发内存损坏，导致浏览器崩溃或拒绝服务，在特定条件下可能实现任意代码执行。该漏洞影响 Firefox 13.0 之前版本、Thunderbird 13.0 之前版本及 SeaMonkey 2.10 之前版本，CVSS 评分 9.3，危害严重。"
published = "2012-06-05T23:55:01Z"
remediation = "升级 Firefox 至 13.0 及以上版本、Thunderbird 至 13.0 及以上版本、SeaMonkey 至 2.10 及以上版本。如无法立即升级，可在浏览器中禁用 JavaScript（设置 → 内容 → 启用 JavaScript 取消勾选）作为临时缓解措施，但会严重影响正常功能，建议优先完成版本升级。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 浏览器引擎内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:40:36Z"

