[basic]
description = "标签之间。<value>Working Resources BadBlue 1.7 及 1.7.2 版本（包括 Enterprise Edition 和 Personal Edition）的 ext.dll ISAPI 扩展存在跨站脚本（XSS）漏洞。远程攻击者可通过向 ext.dll 接口注入恶意脚本，当其他用户访问包含该脚本的页面时，脚本将在用户浏览器上下文中执行。攻击者借此可窃取用户会话Cookie、执行未经授权的操作或进行网络钓鱼攻击。该漏洞利用需要一定的用户交互，攻击者需诱使目标用户访问被注入恶意脚本的特定URL。"
published = "2002-12-31T05:00:00.000"
remediation = "建议立即升级到BadBlue 2.x及以上版本，并停用旧版ISAPI服务。官方发布的安全补丁修正了ext.dll XSS验证逻辑。可通过Windows控制面板卸载旧版，然后从Working Resources官方网站安装最新安全版本。如无法立即升级，建议在Web服务器上禁用ISAPI扩展或配置安全策略，过滤ext.dll路径的特殊字符输入。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Working Resources BadBlue 跨站脚本漏洞"
updated = "2026-06-16T21:59:47.120"

