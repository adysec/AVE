[basic]
description = "tags.<value>Linux 内核的 CAN 驱动 etas_es58x 中，驱动程序在访问 USB 设备的序列号字段时未进行空指针校验。商业设备的序列号通常不为空，但攻击者可通过伪造 USB 设备身份提供空的序列号，触发内核空指针解引用，导致系统崩溃或拒绝服务。该漏洞影响运行受影响内核版本的 Linux 系统，需要本地访问权限并具备物理 USB 设备伪装能力。攻击者可利用此漏洞造成内核恐慌，进而实现权限提升或系统不可用。CVSS 评分为 5.5，危害等级为中等。"
published = "2025-02-27T03:15:17.970"
remediation = '建议将 Linux 内核升级至 6.6.79、6.12.16、6.13.4 或 6.14 及以上版本，以修复 can: etas_es58x 驱动中的空指针解引用漏洞。Ubuntu 24.04 LTS 用户应升级至 6.8.0-78.78（generic/lowlatency）或 6.8.0-1035.37（aws），Ubuntu 22.04 LTS HWE 用户应升级至 6.8.0-78.78.1~22.04.1。如无法立即升级，可通过 udev 规则或黑名单禁用 etas_es58x 驱动（写入 /etc/modprobe.d/blacklist-etas_es58x.conf 内容为 "blacklist etas_es58x"）作为临时缓解措施，或限制未经授权人员对 USB 端口的物理访问。'
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel ETAS_ES58X CAN 驱动空指针解引用漏洞"
updated = "2026-06-17T08:44:14.660"

