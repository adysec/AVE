[basic]
description = "Cisco IOS 软件和 IOS XE 软件的 QoS（服务质量）子系统存在缓冲区溢出漏洞。该漏洞源于对发往受影响设备 UDP 端口 18999 的特定数据包中某些值的边界检查不正确，未经身份认证的远程攻击者可通过向目标设备发送特制的恶意数据包触发缓冲区溢出，导致设备重载造成拒绝服务，或利用提升的权限在设备上执行任意代码。成功利用该漏洞可完全控制受影响设备。仅需目标设备处理该恶意数据包即可触发，穿越设备的流量不会触发此漏洞。Cisco 已发布安全更新修复该漏洞。"
published = "2018-03-28T22:29:00Z"
remediation = "立即升级到 Cisco IOS/IOS XE 的修复版本，使用 Cisco IOS Software Checker 工具（https://tools.cisco.com/security/center/selectIOSVersion.x）查询具体受影响版本对应的修复版本号。如无法立即升级，可在设备上配置 Control Plane Policing（CoPP）策略，通过 ACL 拒绝所有发往 UDP 18999 端口的入站流量作为临时缓解措施。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），需在 2022 年 3 月 17 日前完成修复。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Cisco IOS 及 IOS XE 软件 QoS 子系统缓冲区溢出漏洞"
updated = "2026-06-17T01:29:56Z"

