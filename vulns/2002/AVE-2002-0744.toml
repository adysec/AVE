[basic]
description = "Apache Tomcat 3.2.3 和 3.2.4 的默认安装配置存在路径信息泄露漏洞。未经身份认证的远程攻击者可通过向目标服务器发送构造不当的 HTTP 请求，访问 test/jsp、samples/jsp 和 examples/jsp 目录下的 Java Server Pages 文件，或请求 test/realPath.jsp 服务端，触发错误消息并泄露 Web 根目录完整路径及目录列表等敏感系统信息。该漏洞影响使用上述受影响版本部署的所有 Tomcat 实例，攻击者无需任何凭据即可远程利用，为后续攻击（如路径穿越、本地文件包含等）提供了有利信息支撑。建议升级到 Tomcat 更高安全版本并移除示例文件目录以消除风险。"
published = "2002-12-31T05:00:00Z"
remediation = "将 Apache Tomcat 从 3.2.3/3.2.4 升级至 3.3a 或更高版本（3.3.x 已修复该漏洞，Tomcat 3.x 官方推荐迁移至 9.0.x 或更高版本以获得持续安全支持）。如暂时无法升级，须从生产环境中移除 test、samples 及 examples 这三个示例 Web 应用目录，并禁用 test/realPath.jsp servlet 的访问，同时在防火墙或反向代理层拦截对 /test/、/samples/、/examples/ 路径的外部请求作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Apache Tomcat 敏感信息泄露漏洞"
updated = "2026-06-16T22:00:28Z"

