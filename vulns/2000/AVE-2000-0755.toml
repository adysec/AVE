[basic]
description = "Serv-U FTP Server 存在暴力破解漏洞，其反暴力破解（anti-hammering）防护机制存在设计缺陷。未经身份认证的远程攻击者可先以有效用户身份（可能利用匿名账户）登录 FTP 服务，随后针对其他用户账户发起密码猜测攻击，从而绕过防护限制实施暴力破解。该漏洞影响 Cat Soft Serv-U FTP Server 2.5.x 系列版本，攻击者无需额外权限即可在远程条件下反复尝试密码，成功后可获取其他用户账户的访问权限，导致敏感数据泄露或服务器被非法控制。"
published = "2000-12-11T05:00:00.000"
remediation = "建议立即将 Serv-U FTP Server 从 2.5.x 版本升级到 3.0 或更高版本，该版本已修复反暴力破解机制绕过漏洞。同时，在服务器配置中禁用匿名登录（Anonymous Logon），仅允许授权用户访问。此外，在防火墙或路由器层面限制单 IP 在短时间内的 FTP 连接次数，并启用 Serv-U 的登录失败锁定功能，连续三次密码错误后自动禁用该账户一段时间。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Cat Soft Serv-U FTP Server 暴力破解漏洞"
updated = "2026-06-16T21:53:00.790"

