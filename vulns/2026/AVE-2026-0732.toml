[basic]
description = "tags. The skill says output format must be pure TOML but the specific task here says to put the answer between <value> tags. I'll follow the task's output format instruction.<value>X.Org X Server 的 XSYNC fence 触发逻辑中存在释放后使用（use-after-free）漏洞，具体位于 miSyncTriggerFence() 函数中。由于在同步 fence 对象被释放后仍继续访问其内存指针，具有 X11 服务器访问权限的攻击者无需用户交互即可触发该漏洞，导致服务器崩溃，并可能造成内存损坏，进而引发拒绝服务或系统进一步被利用。该漏洞本地可利用，攻击者需具备一定权限，CVSS 评分为 7.8，危害等级为高。"
published = "2026-04-23T16:16:24Z"
remediation = "tags.<value>建议立即升级 X.Org X server 至修复版本：Debian 用户请将 xorg-server 升级至 bookworm 版 2:21.1.7-3+deb12u12、trixie 版 2:21.1.16-1.3+deb13u3 或 sid 版 2:21.1.23-1，xwayland 同步升级至 2:24.1.12-1；RHEL/Fedora 用户请安装 Red Hat 发布的安全更新（RHSA-2026:10739 等系列 errata），Ubuntu 等其它发行版用户请通过系统软件源安装各自厂商提供的最新 xorg-server/xwayland 补丁包。在无法立即打补丁时，作为临时缓解措施，应限制 X11 服务器仅允许受信任用户访问，并减少对该 X11 会话的本地攻击面。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "X.Org X server XSYNC fence 释放后使用漏洞"
updated = "2026-07-15T02:20:28Z"

