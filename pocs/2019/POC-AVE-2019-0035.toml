[info]
author = "AVE"
description = "检测 Jenkins /whoAmI/ 诊断页面是否泄露 Cookie 头信息。Jenkins 2.196及之前版本、LTS 2.176.3及之前版本在 /whoAmI/ 页面中直接输出 Cookie 头的明文值，绕过 HttpOnly 保护，可被用于会话劫持。"
id = "POC-AVE-2019-0035"
name = "Jenkins /whoAmI/ Cookie Exposure PoC"
severity = "medium"
tags = [
    "cve-2019-10405",
    "jenkins",
    "information-disclosure",
]
vuln_id = [
    "CVE-2019-10405",
    "AVE-2019-0035",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/whoAmI/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = [
    "text/html",
    "x-jenkins",
]

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Cookie",
    "JSESSIONID",
]
