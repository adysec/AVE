[basic]
description = "Small HTTP Server 2.01 版本在处理包含空值的 Server Side Includes (SSI) 标签时存在输入验证缺陷，未正确处理空值导致服务器进程崩溃。本地攻击者可通过上传或植入包含恶意空值 SSI 标签的 HTML 文件，诱使服务器解析时触发空指针解引用或异常处理缺陷，导致 HTTP 服务进程崩溃拒绝服务。远程攻击者若能上传文件或注入 HTML 内容亦可远程触发。该漏洞影响 Small HTTP Server 2.01 版本，CVSS 5.0 (AV:N/AC:L/Au:N/C:N/I:N/A:P)，属拒绝服务类漏洞，影响服务可用性，厂商已停止维护建议升级替代产品。"
published = "2001-01-09T05:00:00.000"
remediation = "升级到 Small HTTP Server 2.02 或更高版本，修复 SSI 解析漏洞。修改配置文件，设置 `ssi_enabled=false` 禁用 SSI 功能以降低风险。对于必须保留 SSI 的环境，请添加 SSI 标签输入验证规则，拒绝包含 null 字符的 SSI 指令。配置服务器为 `ssi_parser_strict=true`，强制执行 SSI 指令规范。通过 Web 界面管理员页面设置SSI安全限制，在HTML文件上传时启用SSI安全检查；服务器监控日志记录检测SSI处理异常并及时更新补丁。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Small HTTP Server 服务拒绝漏洞"
updated = "2026-06-16T21:52:43.003"

