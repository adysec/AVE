[basic]
description = "ATEN Unizon 的 updateLicense 方法存在路径遍历漏洞，由于在文件操作前未对用户提供的路径进行充分验证，具有高权限的已认证远程攻击者可通过构造包含目录遍历序列的恶意请求参数，删除服务器上的任意文件，从而造成系统拒绝服务或数据丢失。该漏洞影响 ATEN Unizon 的受影响安装版本，攻击者需先通过身份认证后才能利用此漏洞触发任意文件删除，导致系统完整性受损。"
published = "2026-06-24T22:16:50Z"
remediation = "建议将 ATEN Unizon 固件升级至 V2.7.264.001 或更高版本以彻底修复该路径遍历漏洞。如暂时无法升级，可通过防火墙或反向代理限制对 /rest/system/license 端点的访问，仅允许可信管理 IP 访问，并禁用非必要管理员账户的许可证上传权限作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["zdi"]
title = "ATEN Unizon 路径遍历任意文件删除漏洞"
updated = "2026-06-27T18:59:13Z"

