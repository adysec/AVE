[basic]
description = "Windows 图形设备接口（GDI）存在本地特权提升漏洞，低权限本地用户可通过运行特制应用程序触发该漏洞，从而获取系统最高权限。该漏洞影响 Windows Vista SP2、Windows Server 2008 SP2/R2 SP1、Windows 7 SP1、Windows 8.1、Windows Server 2012 Gold/R2、Windows RT 8.1 及 Windows 10 等多个版本，CVSS 评分 7.8，危害等级高。攻击者需具备本地访问权限，无法远程利用。Microsoft 已在 2017 年 3 月安全更新中修复此漏洞。"
published = "2017-03-17T00:59:00Z"
remediation = "立即安装 Microsoft 2017 年 3 月安全更新 MS17-013。各系统对应补丁：Windows 7 SP1/Server 2008 R2 安装 KB4012212（仅安全）或 KB4012215（月度汇总）；Windows 8.1/Server 2012 R2 安装 KB4012213 或 KB4012216；Windows Server 2012 安装 KB4012214 或 KB4012217；Windows 10 安装 KB4012606（RTM）/KB4013198（1511）/KB4013429（1607）；Windows Vista/Server 2008 安装 KB4017018。安装后需重启系统。如无法立即打补丁，限制本地用户登录权限、以低权限账户运行应用程序作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows GDI 特权提升漏洞"
updated = "2026-06-17T00:56:54Z"

