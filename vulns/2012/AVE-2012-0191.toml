[basic]
description = "Oracle MySQL 的 Server Optimizer 组件中存在未明漏洞，远程认证用户可通过向 MySQL 服务器发送特制的查询语句触发该漏洞，导致数据库服务拒绝服务。该漏洞影响 MySQL 5.1.61 及更早版本、5.5.21 及更早版本，攻击者需拥有有效数据库账户，无需特殊权限即可通过网络远程利用，CVSS 评分 6.8，危害等级中危。Oracle 已在 2012 年 4 月关键补丁更新中修复此漏洞。"
published = "2012-05-03T22:55:02.747"
remediation = "将 MySQL 升级至 5.1.62 或 5.5.22 及以上版本。具体操作为：从 Oracle 官网下载 MySQL 5.5.22 或 5.1.62 安装包，执行升级安装；或通过 My Oracle Support Note 1406574.1 获取 Critical Patch Update April 2012 补丁集。如无法立即升级，可在数据库层面限制非必要用户的连接权限，并监控 Server Optimizer 相关异常查询以缓解 DoS 风险。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Oracle MySQL Server 拒绝服务漏洞"
updated = "2026-06-16T23:40:08.000"

