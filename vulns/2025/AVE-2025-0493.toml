[basic]
description = "wolfSSL v5.8.2 的 TLS 1.3 KeyShareEntry 解析存在输入验证不当漏洞。远程未认证攻击者可通过向目标服务器发送包含同一支持组的多个重复 KeyShareEntry 值的特制 ClientHello 消息，触发该漏洞，导致服务器在处理 ClientHello 期间消耗大量 CPU 和内存资源，造成拒绝服务。该漏洞影响运行 wolfSSL v5.8.2 的多平台系统，CVSS 评分 6.3，危害等级中等。"
published = "2025-11-21T23:15:44Z"
remediation = "升级 wolfSSL 至 v5.8.2 之后的版本（如 v5.9.0 或包含 PR #9117 修复的最新版本），该版本在 TLS 1.3 KeyShareEntry 解析中增加了对同一组重复 KeyShareEntry 的输入校验。如无法立即升级，可在服务端配置中禁用 TLS 1.3 协议，回退至 TLS 1.2 作为临时缓解措施。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "wolfSSL wolfSSL TLS 1.3 KeyShareEntry 解析拒绝服务漏洞"
updated = "2026-06-17T08:31:26Z"

