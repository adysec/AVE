[basic]
description = "Sendmail 8.12.8 及更早版本在处理增强型 DNS 黑名单查询（enhdnsbl）功能的 DNS map 代码中，未能正确初始化 RESOURCE_RECORD_T 等关键数据结构，导致程序在处理 DNS 响应时可能对未初始化的内存指针执行 free() 操作。未经身份认证的远程攻击者可通过向目标系统发送包含畸形数据的伪造 DNS 响应，触发 Sendmail 进程崩溃，造成拒绝服务。该漏洞影响所有启用了 FEATURE('enhdnsbl') 配置的 Sendmail 8.12.0 至 8.12.8 版本，攻击者需能够拦截或伪造 DNS 查询响应。Sendmail 官方已在 8.12.9 版本中通过初始化数据结构修复此问题。"
published = "2003-10-20T04:00:00Z"
remediation = "升级 Sendmail 至 8.12.9 或更高版本（该版本修复了 enhdnsbl 特性的 DNS 映射代码初始化缺陷）。若暂时无法升级，请在 sendmail.mc 配置中移除或注释掉 FEATURE(`enhdnsbl`) 并重新生成 sendmail.cf 后重启服务，或在防火墙层面限制非信任来源的 DNS 响应包作为临时缓解措施。>"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Sendmail DNS Mapper 拒绝服务漏洞"
updated = "2026-06-16T22:02:38Z"

