[basic]
description = "Cisco 600 系列路由器上运行的 CBOS 固件 2.0.1 至 2.4.2ap 版本中存在拒绝服务漏洞。远程攻击者可通过向路由器的 HTTP 或 Telnet 服务发起大量并发 TCP 连接，耗尽路由器系统资源，导致设备完全无响应并停止转发数据包。攻击无需身份认证，仅需通过网络发送大量连接请求即可触发，影响范围包括使用 CBOS 固件的 Cisco 600 系列路由器设备。"
published = "2001-08-31T04:00:00Z"
remediation = "升级 Cisco CBOS 至 2.4.2ap 之后的安全版本（如 2.4.3 或更高），该版本已修复 HTTP/Telnet 服务因大量并发连接导致拒绝服务的问题。如无法立即升级，可在路由器访问控制列表（ACL）中限制对 HTTP（80/TCP）和 Telnet（23/TCP）端口的源 IP 范围，仅允许受信任的管理地址访问，并配置连接数限制以降低攻击面。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Cisco CBOS HTTP/Telnet服务拒绝服务漏洞"
updated = "2026-06-16T21:55:30Z"

