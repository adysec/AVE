[basic]
description = "tags as requested.<value>I-gear 3.5.7 及更早版本在处理日志条目时存在输入验证缺陷，当 URL 长度超过 255 个字符时，程序无法正确处理并会引发日志报告错误。未经身份认证的远程攻击者可通过向受影响的 I-gear 系统发送包含超长 URL 的请求，触发日志处理模块异常，导致日志记录不完整或完全失效，影响系统的安全审计与监控能力。该漏洞利用门槛较低，仅需网络可达即可实施，攻击者无需账号权限，且攻击行为可能不留明显痕迹。"
published = "2000-12-11T05:00:00.000"
remediation = "建议将 I-gear 升级至厂商发布的最新安全版本，并关注 NVD 公告（https://nvd.nist.gov/vuln/detail/CVE-2000-1007）及 IBM X-Force 漏洞数据库（https://exchange.xforce.ibmcloud.com/vulnerabilities/5791）获取补丁信息。如 I-gear 已停止维护且无可用补丁，建议迁移至仍在积极维护的替代日志分析工具（如 AWStats、GoAccess 等），或在 Web 服务器前端通过 URL 长度限制（如 Apache 的 LimitRequestFieldSize 指令、Nginx 的 large_client_header_buffers 配置）将 URL 截断至 255 字符以内，以阻止超长 URL 进入日志，同时定期审查日志格式配置确保日志解析器能正确处理长 URL 条目。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "I-gear 日志记录 远程拒绝服务漏洞"
updated = "2026-06-16T21:52:57.537"

