[basic]
description = "Exim Internet Mailer 的 daemon.c 文件中存在格式字符串漏洞，影响 3.x 至 3.36 及 4.x 至 4.10 版本。具有 Exim 管理权限的本地用户可通过修改 pid_file_path 配置值触发该漏洞，利用格式字符串漏洞在目标系统上执行任意代码。该漏洞CVSS评分为7.2，危害等级较高。"
published = "2002-12-23T05:00:00Z"
remediation = "建议立即升级 Exim 到 4.11 或更高版本，或应用相关安全补丁（如 Debian squeeze 及更高版本包含修复）。临时缓解措施：通过 chroot 或 SELinux 将 Exim 进程限制在受限用户空间；配置修改：确保 `pid_file_path` 参数仅由受信任用户修改，并在运行时验证其路径安全性。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Exim Internet Mailer 格式字符串漏洞"
updated = "2026-06-16T21:59:13Z"

