[basic]
description = "Linux 内核 PTP（精确时间协议）子系统存在空指针解引用漏洞。ioctl 和 sysfs 处理器在调用时会无条件执行驱动的 ->enable 回调函数，但部分 PTP 驱动（如 ptp_s390.c、ptp_vclock.c 和 ptp_mock.c）并未实现该回调函数，导致内核发生 NULL 指针解引用，进而引发系统崩溃或拒绝服务。该漏洞影响包含受影响 PTP 驱动的 Linux 内核版本，攻击者需要具备本地访问权限并以低权限用户身份在目标系统上执行恶意操作，无需任何用户交互即可触发。成功利用该漏洞将导致系统可用性完全丧失。"
published = "2025-02-27T20:16:03Z"
remediation = "建议升级 Linux 内核至包含该漏洞修复的稳定版本（6.1.x 及 6.6.x LTS 内核已包含补丁）。Debian/Ubuntu 系统可执行 `apt update && apt upgrade linux-image-*` 完成更新；RHEL/CentOS 系统可执行 `yum update kernel` 后重启。由于该漏洞需本地访问权限触发，可通过 `chmod 660 /dev/ptp*` 收紧 PTP 设备节点权限作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 PTP 空指针解引用漏洞"
updated = "2026-07-14T13:17:24Z"

