[basic]
description = "Solaris patchadd 实用程序存在竞争条件漏洞，本地攻击者可通过创建恶意符号链接，在 patchadd 以特权运行处理补丁文件的时间窗口内，诱导其覆盖任意系统文件。该漏洞影响 Solaris 2.5.1、2.6、7.0 和 8.0 版本，攻击向量为本地（AV:L），攻击复杂度高（AC:H），需本地账户权限，成功利用可导致机密性、完整性、可用性完全丧失（CVSS 6.2）。攻击者需预先在可写目录植入指向敏感文件的符号链接，随后触发 patchadd 操作，利用 TOCTOU 窗口实现任意文件覆盖，进而提权或破坏系统完整性。Sun Microsystems 已发布补丁修复此问题。"
published = "2001-02-12T05:00:00.000"
remediation = "升级 Solaris 操作系统到已发布的安全补丁版本，如 Solaris 8 补丁 111522-12 或更高版本。这些补丁修复了 patchadd 程序的 race 条件漏洞，通过使用更安全的临时文件创建方式（如使用 mktemp 或确保原子操作）来防止 symlink 攻击。同时，可以设置 TMPDIR 环境变量到安全的专用目录，并确保 /tmp 目录的权限设置为 700，以限制其他用户创建恶意 symlink 的能力。"
score = 6.2
severity = "MEDIUM"
sources = ["cve"]
title = "Sun Solaris patchadd 竞争条件漏洞"
updated = "2026-06-16T21:53:34.720"

