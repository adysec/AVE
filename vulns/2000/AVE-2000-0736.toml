[basic]
description = "Palm OS 3.5.2 及更早版本使用弱加密算法存储用户密码，未经身份认证的攻击者在获得目标 Palm 设备的物理访问权限后，可利用此漏洞解密存储的密码，进而非法获取设备的访问权限。该漏洞影响所有运行 Palm OS 3.5.2 及以下版本的掌上设备，攻击者需实际接触设备，通过弱加密逆向破解方式还原用户密码，最终实现对设备的完全控制。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级设备固件至 Palm OS 3.5.3 或更高版本，该版本已修复密码弱加密存储缺陷。若无法升级，请在 Palm 设备的安全设置中关闭密码保护功能，避免密码以明文形式存储于设备本地。同时将设备置于物理安全环境中管控，禁止未经授权的人员接触设备。对于运行 HotSync 网络的场景，建议禁用 HotSync 网络密码同步功能，或在 HotSync Manager 中取消勾选「通过网络发送密码」选项，防止加密密码在网络中明文传输。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Palm OS 用户密码弱加密漏洞"
updated = "2026-06-16T21:52:57Z"

