[basic]
description = "GitLab Enterprise Edition 的 Jira 集成功能存在未认证的盲 SSRF（服务器端请求伪造）漏洞，攻击者无需身份验证即可构造恶意请求触发。该漏洞影响 GitLab EE 11.5.8 之前、11.6.x 11.6.6 之前及 11.7.x 11.7.1 之前的版本。攻击者可通过该漏洞诱使服务器向内部或外部任意地址发起请求，导致敏感信息泄露或对内网服务进行进一步扫描与攻击。GitLab 已在后续版本中修复此问题，建议受影响用户升级至安全版本。"
published = "2019-09-09T20:15:12Z"
remediation = "将 GitLab Enterprise Edition 升级至 11.5.8、11.6.6 或 11.7.1 及更高版本以修复该 SSRF 漏洞。如无法立即升级，请在 GitLab 管理员后台禁用 Jira 集成功能（Admin Area → Integrations → Jira），并配置防火墙或安全组规则限制 GitLab 服务器对内部敏感网络的出站连接，仅允许访问必要的 Jira 实例地址作为临时缓解措施。"
score = 7
severity = "HIGH"
sources = ["nuclei"]
title = "GitLab Jira 集成 服务端请求伪造漏洞"
updated = "2026-06-17T02:39:41Z"

