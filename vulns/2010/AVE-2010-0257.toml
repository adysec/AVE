[basic]
description = "PHP 5.3.x 版本中使用的 Libmbfl 1.1.0 库的 mb_strcut 函数存在信息泄露漏洞。当攻击者向该函数传递过大的第三个参数（length 参数）时，函数未能正确限制输出边界，导致可能泄露相邻内存中的敏感信息。远程攻击者可通过构造特制的 HTTP 请求触发该漏洞，获取服务器内存中的潜在敏感数据。该漏洞影响 PHP 5.3.0 至 5.3.3 版本，CVSS 评分 5.0，危害等级中危。官方已在 PHP 5.3.4 版本中修复此问题。"
published = "2010-11-10T03:00:02Z"
remediation = "将 PHP 升级至 5.3.4 或更高版本，该版本已修复 mb_strcut() 函数中因第三个参数（length 参数）过大导致的内存信息泄露问题。各发行版用户可通过包管理器更新：Red Hat 用户安装 RHSA-2011-0196 安全更新，Ubuntu 用户安装 USN-1042-1 更新，Fedora 用户安装对应安全公告中的更新包。如无法立即升级，可在应用层面对传入 mb_strcut 函数的 length 参数进行严格校验，限制其最大值不超过字符串实际长度。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "PHP Libmbfl mb_strcut 函数信息泄露漏洞"
updated = "2026-06-16T23:24:13Z"

