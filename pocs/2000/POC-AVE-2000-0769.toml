[info]
author = "ave"
description = "利用 Microsoft Virtual Machine ActiveX 控件 com.ms.activeX.ActiveXComponent 绕过 IE 安全沙盒，实现远程程序执行。该漏洞允许攻击者通过精心构造的网页加载未签名的 Java 小程序和 ActiveX 控件，绕过浏览器安全限制，在用户权限下执行任意系统命令。"
id = "POC-AVE-2000-0769"
name = "Microsoft Virtual Machine 2000/3100/3200/3300 Series ActiveXComponent 任意程序执行 PoC"
severity = "high"
tags = ["ave-2000-0769"]
vuln_id = [
    "CVE-2000-1061",
    "AVE-2000-0769",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/exploit.html"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["arbitrary program execution"]
