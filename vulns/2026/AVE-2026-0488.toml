[basic]
description = "7-Zip 在处理 XZ 压缩格式的解压过程中存在堆缓冲区溢出漏洞。该漏洞源于 7-Zip 对特制 XZ 压缩文件解压时未正确验证输入数据长度，导致堆内存越界写入。远程攻击者可通过诱导用户打开恶意构造的 XZ 压缩文件触发此漏洞，在目标系统上实现任意代码执行。该漏洞影响 Linux 平台上的 7-Zip 及 p7zip 软件包，涉及 Debian、Ubuntu 等多个发行版。ZDI 已收录此漏洞（ZDI-CAN-30169），目前厂商尚未发布官方补丁。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级到 7-Zip 26.02 或更高版本（官方于 2025 年 6 月 25 日发布修复），从 https://www.7-zip.org 手动下载安装。该版本修复了 C/XzDec.c 中 MixCoder_Code 函数的堆缓冲区溢出问题。对于内嵌 7-Zip XZ 解码器的第三方产品，需联系厂商获取对应补丁。临时缓解措施：不要使用 7-Zip 打开来自不可信来源的 XZ 格式压缩包。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "7-Zip XZ 解压堆缓冲区溢出漏洞"
updated = "2026-01-01T00:00:00Z"

