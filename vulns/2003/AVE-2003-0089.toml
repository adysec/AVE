[basic]
description = "MikMod 是一款开源音乐模块播放器库，支持 MOD 等多种音频格式及压缩包文件解析。该漏洞存在于 3.1.6 及更早版本中，程序在处理压缩包文件内的文件名时未对长度进行充分边界检查，导致发生缓冲区溢出。未经身份认证的远程攻击者可通过构造包含超长文件名文件的恶意压缩包，诱使目标用户使用 MikMod 打开该文件，进而触发缓冲区溢出并在目标系统上执行任意代码。该漏洞影响所有使用受影响版本 MikMod 库或相关工具的 Linux/Unix 系统，CVSS v2 评分为 7.5，危害等级为高。Debian 及 Red Hat 等发行版已发布安全公告和补丁程序修复此问题。"
published = "2003-07-24T04:00:00Z"
remediation = "升级 mikmod 至 3.1.7 或更高版本（Debian 用户可安装 3.1.6-4woody3，参考 Debian 安全公告 DSA-320），上游 3.1.7 版本已修复处理压缩包内文件名的缓冲区溢出漏洞。如无法立即升级，可临时卸载 mikmod 或避免使用其打开来源不可信的压缩文件作为缓解措施。Debian 用户可通过 apt-get upgrade 安装修复后的包，Red Hat 用户应参考 RHSA-2005:506 公告进行更新。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "MikMod 库 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T22:02:11Z"

