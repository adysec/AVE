[info]
author = "ave"
description = "通过发送超长的 HTTP 请求头（如 Referer）来验证 NetcPlus BrowseGate 2.80 是否存在缓冲区溢出导致拒绝服务的情况。"
id = "POC-AVE-2000-0663"
name = "NetcPlus BrowseGate 2.80 DoS PoC"
severity = "medium"
tags = ["ave-2000-0663"]
vuln_id = [
    "CVE-2000-0908",
    "AVE-2000-0663",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[[poc.requests.matchers]]
expect = false
status = [
    500,
    400,
]
type = "status"
