[basic]
description = "curl 的 WebSocket 实现未按 RFC 规范要求为每个新发出的数据帧更新 32 位掩码值，而是在整个连接期间使用固定的可预测掩码。恶意服务器可利用此缺陷构造特制的 WebSocket 数据帧，使中间代理（透明或显式配置）将伪造流量误判为真实 HTTP 通信并缓存其内容，导致缓存投毒攻击。该缓存中的恶意内容随后可被代理分发给所有用户。攻击者需能够与目标客户端建立 WebSocket 连接并控制服务端，攻击复杂度较低。"
published = "2025-09-12T06:15:40Z"
remediation = "升级 curl 至 8.14.1 或更高版本，该版本已修复 WebSocket 掩码未按规范每帧更新的问题。如无法立即升级，可在代理或反向代理层禁用 WebSocket 连接转发，或限制 curl 仅用于非 WebSocket 场景作为临时缓解措施。"
score = 5.3
severity = "MEDIUM"
sources = ["msrc"]
title = "curl WebSocket掩码可预测漏洞"
updated = "2026-06-17T08:27:47Z"

