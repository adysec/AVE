[basic]
description = "FlightPath 4.x 及 5.0-x 版本中存在目录遍历与本地文件包含漏洞。攻击者无需认证即可通过向 `index.php?q=system-handle-form-submit` 发送 POST 请求，在 `form_include` 参数中构造路径穿越序列（如 `../../`），利用 `modules/system/system.module` 中 `system_handle_form_submit` 函数的 `include_once` 调用，实现任意文件读取。该漏洞可导致敏感信息泄露，CVSS 评分 5.3，危害等级中危。"
published = "2019-07-10T14:15:11.887"
remediation = "升级 FlightPath 至 4.8.2 或 5.0-rc2 及以上版本，该漏洞在 system_handle_form_submit 函数中对 form_include 参数进行了严格的路径过滤。如无法立即升级，可在服务器端对 index.php 的 form_include 参数做白名单校验，仅允许指定目录下的文件包含。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "FlightPath 路径遍历漏洞"
updated = "2026-06-17T02:16:42.340"

