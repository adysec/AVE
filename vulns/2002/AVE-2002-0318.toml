[basic]
description = "Linux 内核 2.2.x/2.3/2.4.x 版本中的 d_path() 函数存在路径截断漏洞。该函数在处理过长路径名时会直接截断而不返回错误，导致路径解析结果不准确。本地攻击者可通过构造超长路径名，诱使程序基于截断后的错误路径执行文件操作，导致程序在错误目录上执行非预期操作，破坏文件系统完整性。该漏洞影响 Linux 内核 2.2.20 及更早版本、2.4.18 及更早版本，CVSS 评分 2.1（本地访问、低复杂度、无需认证、部分完整性影响），属于本地权限提升/完整性破坏类漏洞。攻击者需具备本地系统访问权限，通过构造超长路径诱导受影响程序（如 setuid 程序）操作错误目录实现利用。Linux 内核社区已在后续版本中修复该路径截断问题。"
published = "2002-08-12T04:00:00Z"
remediation = "建议立即升级 Linux 内核至 2.2.21 或 2.4.19 及以上版本，或从 kernel.org 下载并应用官方补丁修复 d_path() 路径截断漏洞。如暂时无法升级内核，请严格限制本地非特权用户登录权限，并通过访问控制列表（ACL）限制关键目录访问权限作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["exploitdb"]
title = "Linux Kernel Linux Kernel 2.2.x/2.3/2.4.x d_path() 路径截断漏洞"
updated = "2026-06-16T21:57:33Z"

