[basic]
description = "Apache Portable Runtime (APR) 库中的 apr_psprintf 函数存在缓冲区溢出漏洞，影响 Apache 2.0.37 至 2.0.45 版本。远程攻击者可通过向 mod_dav 模块发送特制的长字符串（如 XML 对象）触发该漏洞，导致服务进程崩溃，造成拒绝服务，在特定条件下可能实现任意代码执行。该漏洞无需身份认证即可远程利用，攻击复杂度较低。"
published = "2003-06-09T04:00:00.000"
remediation = "升级 Apache 至 2.0.46 或更高版本（已修复 APR 库 apr_psprintf 缓冲区溢出问题），或手动更新 APR 库至 0.9.5 以上版本。若暂时无法升级，可在 Web 应用防火墙（WAF）层面限制过长的 XML 请求体长度（如限制 Content-Length ≤ 8MB），并禁用不必要的 mod_dav 模块以减少攻击面。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Apache APR apr_psprintf 缓冲区溢出漏洞"
updated = "2026-06-16T22:01:49.410"

