[basic]
description = "glibc 2.1.1 中的 unsetenv 函数存在环境变量处理缺陷，当同一环境变量被重复设置两次时，unsetenv 仅移除第一次出现的变量而保留第二次，导致 setuid 程序无法正确清除危险环境变量。本地攻击者可通过传入重复的 LD_PRELOAD 或 LD_LIBRARY_PATH 环境变量，在 setuid 程序中加载恶意共享库，从而以提升的权限执行任意代码。该漏洞影响使用 glibc 2.1.1 的 Linux 系统，攻击者需具备本地账户权限即可利用。"
published = "2000-11-14T05:00:00Z"
remediation = "升级 glibc 至 2.1.2 及以上版本，该版本修复了 unsetenv 对重复环境变量处理不当的问题。如无法升级，可在系统层移除 setuid 程序中对 LD_PRELOAD/LD_LIBRARY_PATH 等危险环境变量的继承，或通过 pam_env 模块限制用户自定义环境变量传递。对于关键服务，建议使用 glibc 补丁包（如 RedHat 的 RHSA-2000:065）进行修复。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "GNU glibc unsetenv 环境变量处理本地权限提升漏洞"
updated = "2026-06-16T21:52:32Z"

