[basic]
description = "Linux内核ppp（点对点协议）驱动存在未初始化内存漏洞。当驱动使用Berkeley Packet Filter（BPF）进行socket过滤时，未正确初始化PPP数据包头部中的2字节Protocol字段，仅初始化了第一个字节的方向标识而第二个字节保持未初始化状态。攻击者可通过精心构造的BPF程序从偏移量0开始读取，利用该未初始化内存造成信息泄露或触发拒绝服务。该漏洞影响使用Linux内核PPP子系统的系统，需要本地访问权限才能触发，利用方式主要通过syzkaller等工具生成恶意BPF程序进行探测。"
published = "2025-04-01T16:15:22Z"
remediation = "升级 Linux 内核至修复版本：5.4.291、5.10.235、5.15.179、6.1.131、6.6.83、6.12.19、6.13.7 或更新稳定版本。具体操作：通过官方发行版安全更新通道升级（如 apt upgrade linux-image 或 yum update kernel），或从 https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git 拉取最新稳定版源码重新编译安装。如无法立即升级，可临时禁用 PPP 设备的 BPF 功能以缓解风险。升级后重启系统确保新内核生效，并验证内核版本号达到上述修复版本。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 PPP 协议栈未初始化值拒绝服务漏洞"
updated = "2026-06-17T08:44:37Z"

