[basic]
description = "Linux 内核块设备子系统存在潜在死锁漏洞。sysfs ->store() 回调在队列冻结（queue frozen）状态下被调用时，其中的 update_nr_requests、wbt 和 scheduler 等回调使用 GFP_KERNEL 标志分配内存，可能进入直接内存回收（direct reclaim）代码路径，进而触发内核死锁，导致系统拒绝服务。该漏洞影响 Linux 内核 6.12.96 至 6.13 以及 6.13.2 至 6.13.3 版本，CVSS v3.1 评分为 5.5（MEDIUM）。具有本地低权限访问权限的攻击者可通过向 /sys/block 下的相关文件写入特制值来触发该死锁，造成系统假死或崩溃。Linux 内核社区已通过补丁在 sysfs ->store() 调用期间标记 GFP_NOIO 来修复此问题。"
published = "2025-02-28T00:00:00Z"
remediation = "升级 Linux kernel 到 6.13.3 或更高版本，6.12.x 稳定版用户应升级至 6.12.97 或更新版本。如暂无法立即升级，可通过禁用 sysfs 块设备参数写入接口（如 /sys/block/ 下相关 store 入口）作为临时缓解措施，避免在队列冻结状态下触发内存分配导致死锁。"
score = 5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Linux内核 块设备sysfs存储操作死锁漏洞"
updated = "2025-02-28T00:00:00Z"

