[basic]
description = "Secure Locate（slocate）是一款用于文件索引和搜索的工具，其数据库文件解析功能存在内存破坏漏洞。本地攻击者可通过构造恶意的数据库文件，在其中指定超出预期缓冲区边界的偏移值，触发内存越界访问，导致程序内存损坏。成功利用该漏洞的攻击者可获取目标系统的最高权限，实现本地权限提升。攻击条件要求攻击者拥有本地系统访问权限，能够将特制数据库文件放置于目标系统上并诱导 slocate 解析该文件。"
published = "2001-02-16T05:00:00Z"
remediation = "立即升级 slocate 至 2.6 及以上版本。Debian 用户执行 `apt-get update && apt-get install slocate`，Red Hat 用户安装 RHSA-2000:128 提供的更新包。如无法升级，限制不可信用户对 slocate 数据库文件的写入权限，并移除 slocate 的 setuid 位作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Secure Locate slocate 本地内存破坏漏洞"
updated = "2026-06-16T21:53:35Z"

