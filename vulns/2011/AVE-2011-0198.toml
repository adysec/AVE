[basic]
description = "Google Chrome 18.0.1025.151 之前版本所使用的 Skia 图形引擎存在越界读（Out-of-Bounds Read）漏洞（CWE-125）。该漏洞源于 Skia 在进行裁剪（Clipping）操作时未正确验证边界，导致可读取超出分配内存范围的数据。远程攻击者可通过诱导用户访问包含特制图形内容的恶意网页触发该漏洞，可能导致信息泄露或浏览器拒绝服务（崩溃），在特定条件下甚至可能与其他漏洞组合实现任意代码执行。由于 Chrome 浏览器在当时具有极高的市场份额，该漏洞影响范围广泛，攻击条件为用户需访问恶意构造的网页，属于低复杂度但需用户交互的攻击场景。Google 已在 Chrome 18.0.1025.151 版本中修复此漏洞，建议用户及时升级至修复版本。"
published = "2012-04-05T22:02:07Z"
remediation = """content.The known info already tells me the fix version is 18.0.1025.151. I'll write the remediation directly.<value>建议立即将 Google Chrome 升级到 18.0.1025.151 或更高版本（该版本修复了 Skia 裁剪逻辑中的越界读问题），同时通过浏览器"关于 Chrome"菜单或企业级自动更新策略（如 GPO、管理后台的更新配置）批量推送补丁至所有终端。如无法立即升级，可临时启用浏览器安全模式、禁用第三方插件与自动加载的可信站点外内容，并通过内容安全策略（CSP）和限制恶意网页访问降低触发概率，同时监控异常崩溃日志以辅助检测利用尝试。"""
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome Skia 越界读取漏洞"
updated = "2026-06-16T23:32:33Z"

