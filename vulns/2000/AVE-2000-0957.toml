[basic]
description = "Check Point VPN-1/FireWall-1 4.1 及更早版本中，协议检查器（protocol checker）的 Getkey 函数存在缓冲区溢出漏洞。该漏洞位于模块间通信机制中，远程攻击者无需身份认证即可通过网络向目标系统发送特制的数据包触发缓冲区溢出，导致防火墙服务进程崩溃，造成拒绝服务（DoS）。该漏洞影响 Check Point VPN-1/FireWall-1 4.1 及之前版本，CVSS 评分 5.0，危害等级中危。"
published = "2000-11-14T05:00:00.000"
remediation = "升级到 Check Point 当前受支持的最新版本（如 R80.x 及以上系列），或迁移至 Check Point Quantum 系列下一代防火墙。如无法升级，应在防火墙上限制对协议检查模块的未授权网络访问，仅允许可信源 IP 连接。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Check Point VPN-1/FireWall-1 协议检查器缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:31.557"

