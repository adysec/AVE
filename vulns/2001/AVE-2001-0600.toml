[basic]
description = "Internet Explorer 5.5 及更早版本存在安全区域绕过漏洞，未经身份认证的远程攻击者可通过特定方式获取浏览器缓存内容的物理存储路径，并将该内容在本地计算机区域（Local Computer Zone）中打开，从而绕过 Internet 区域的安全限制。攻击者可进一步利用编译 HTML 帮助文件（.chm）执行任意程序，实现远程代码执行。该漏洞影响运行受影响版本 IE 的 Windows 系统，攻击条件为受害者访问恶意构造的网页或内容，CVSS 评分 7.5，危害等级高。用户应升级至更高版本的 Internet Explorer 或应用 Microsoft 安全更新以修复此漏洞。"
published = "2001-07-21T04:00:00Z"
remediation = "建议立即为 Internet Explorer 5.01 安装安全补丁 Q279328（适用于 SP1），或升级到 IE 5.01 SP2/IE 6.0；为 IE 5.5 安装补丁 Q286045 或升级到 IE 5.5 SP2/IE 6.0。同时将 Windows Script Host 升级到 5.5 最新版本（build 6330 或更高）。如无法立即安装补丁，可在 IE 安全区域设置中为不受信任的站点禁用 Active Scripting，并将 HTML 邮件配置为在受限站点区域中打开，以降低攻击风险。对于安装了 Services for Unix 2.0 的系统，还建议通过注册表移除 Telnet 异步可插拔协议。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Microsoft Internet Explorer Windows Script Host 远程代码执行漏洞"
updated = "2026-06-16T21:53:28Z"

