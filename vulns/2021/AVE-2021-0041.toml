[basic]
description = "标签之间。<value>WebKit渲染引擎存在整数溢出漏洞，由于缺乏对输入数据的充分验证，攻击者可构造恶意网页内容。当用户通过Safari浏览器访问该网页时，会触发WebKit中的整数溢出，导致任意代码执行。该漏洞影响macOS Big Sur 11.3.1之前版本、iOS 14.5.1之前版本、iPadOS 14.5.1之前版本、tvOS 14.6之前版本以及Safari 14.1.1之前版本。远程攻击者无需身份认证，只需诱导用户打开恶意链接即可利用此漏洞。"
published = "2021-09-08T15:15:13Z"
remediation = "建议立即升级至以下 Apple 已修复版本：iPhone/iPad 升级至 iOS 14.5.1 或 iPadOS 14.5.1，Mac 升级至 macOS Big Sur 11.3.1，Apple TV 升级至 tvOS 14.6，Safari 升级至 14.1.1，旧款 iPhone 升级至 iOS 12.5.3。可通过「系统设置」→「通用」→「软件更新」自动安装补丁。如短期内无法完成系统升级，可临时在 Safari 浏览器中禁用 JavaScript 作为缓解措施，以避免恶意网页内容触发 WebKit 整数溢出导致任意代码执行。该漏洞已被 CISA 列入已知被利用漏洞目录，存在在野攻击，务必优先完成修复。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Apple macOS WebKit 整数溢出远程代码执行漏洞"
updated = "2026-06-17T03:50:38Z"

