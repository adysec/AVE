[basic]
description = "Zope 2.2.1 之前版本存在权限访问控制缺陷，对 getRoles 方法的访问限制不严格，导致具有 DTML 编辑权限的用户可通过修改请求中包含的角色列表来添加或修改系统角色权限。攻击者可利用该漏洞提升权限至管理员级别，实现完全控制目标系统。该漏洞影响所有 Zope 2.2.1 之前版本，CVSS 评分 7.2，危害等级高，目前已通过升级至 2.2.1 及以上版本修复。"
published = "2000-10-20T04:00:00Z"
remediation = "立即将 Zope 升级至 2.2.1 或更高版本；若无法升级，安装 Zope 官方于 2000-08-09 发布的安全 Hotfix（security_alert）。Debian 用户参照 DSA-20000821、Red Hat 用户参照 RHSA-2000:052 安装对应发行版更新包。同时严格限制 DTML 编辑权限，仅授予可信用户。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Zope Zope getRoles 方法访问控制漏洞"
updated = "2026-06-16T21:52:21Z"

