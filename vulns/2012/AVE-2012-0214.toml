[basic]
description = "Mozilla Firefox 4.x 至 13.0 以及 Firefox ESR 10.x 至 10.0.6 版本中的拖拽（Drag-and-Drop）功能实现存在身份验证欺骗漏洞。该漏洞的原理在于，当用户在浏览器中拖拽网页内容时，攻击者可利用取消页面加载（cancel a page load）的时机伪造地址栏显示的错误 URL，从而误导用户当前所访问的实际站点。由于该漏洞可被伪造 URL 所利用，攻击者通常结合钓鱼或恶意链接，在用户不知情的情况下诱使其访问伪造地址并相信其真实性，进而窃取用户凭据或进行其他欺骗攻击。攻击者只需要在解析网络环境下随意的恶意网页链接，并诱导用户执行拖拽操作即可触发，无需特殊权限。该漏洞影响 Firefox 4.x 至 13.0 及 Firefox ESR 10.x 10.0.6 之前的版本，CVE 评分为 6.4，危害等级中危。Mozilla 已在 Firefox 14.0 及 ESR 10.0.6 中修复此漏洞，建议用户升级至相应最新版本。"
published = "2012-07-18T10:26:48.580"
remediation = "建议立即升级至 Firefox 14.0 及以上版本，或 Firefox ESR 10.0.6 及以上版本以彻底修复该漏洞。若无法立即升级，可将浏览器安全设置中的「阻止弹出窗口」保持开启，并主动避免从不受信任的网站拖放链接或内容到地址栏，勿在拖放操作过程中取消页面加载。同时在浏览器策略中禁用第三方 cookie，并提醒用户只从可信站点下载和拖放内容，以降低地址栏被欺骗、遭受钓鱼（如伪造 HTTPS 站点）的风险作为临时缓解措施。"
score = 6.4
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox 拖放功能地址栏欺骗漏洞"
updated = "2026-06-16T23:40:38.327"

