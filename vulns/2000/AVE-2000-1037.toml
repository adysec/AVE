[basic]
description = "cmd5checkpw 0.21 及更早版本中存在拒绝服务漏洞，远程攻击者可通过向 SMTP 服务发送包含未知用户名的 AUTH 命令，导致服务进程崩溃或资源耗尽，造成正常用户无法访问邮件服务。攻击无需身份认证，通过网络即可触发，利用难度低。该漏洞影响 cmd5checkpw 0.20 和 0.21 版本，CVSS 评分 7.5，危害等级高。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 cmd5checkpw 至 0.22 或更高版本（该版本已修复 SMTP AUTH 未知用户名导致的拒绝服务问题）。由于该项目已停止维护，建议迁移至现代 SMTP 认证方案（如 Dovecot SASL 或 Cyrus SASL）。临时缓解措施：在 MTA 层面限制 SMTP AUTH 仅允许已知用户，或使用 iptables 限制 SMTP 端口的来源 IP。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Krzysztof Dabrowski cmd5checkpw SMTP AUTH 命令拒绝服务漏洞"
updated = "2026-06-16T21:52:55.417"

