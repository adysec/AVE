[basic]
description = "Apache HTTP Server 1.3 (至 1.3.24) 和 2.0 (至 2.0.36) 的 Windows x86 版本在处理分块传输编码（Chunked Encoding）的 HTTP 请求时，由于对分块大小的校验机制存在缺陷，导致服务器使用错误的大小进行内存操作。远程未经身份验证的攻击者可通过向目标服务器发送特制的分块编码 HTTP 请求触发该漏洞，从而导致服务崩溃（拒绝服务）或在特定内存布局下执行任意代码。该漏洞主要影响部署在 Windows 平台上的 Apache 服务器。"
published = "2002-07-03T04:00:00Z"
remediation = "建议将 Apache HTTP Server 升级至 1.3.26 或 2.0.37 及以上版本，以修复在 Windows x86 平台上处理分块传输编码时导致内存损坏的缺陷。若无法立即升级，建议在 Web 应用防火墙 (WAF) 中拦截包含异常分块编码格式的 HTTP 请求。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Apache HTTP Server 分块编码远程代码执行漏洞"
updated = "2026-06-16T21:57:21Z"

