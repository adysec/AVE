[basic]
description = "Oracle MySQL Server 5.1.61及之前版本、5.5.21及之前版本中的Server Optimizer组件存在未指定的拒绝服务漏洞。已认证的远程攻击者可通过向MySQL服务器发送特制的查询请求，利用优化器在处理特定SQL语句时的缺陷，导致MySQL服务进程崩溃或资源耗尽，造成拒绝服务。该漏洞无需特殊权限即可远程利用，攻击复杂度低，但仅影响服务可用性，不影响机密性和完整性。"
published = "2012-05-03T22:55:02Z"
remediation = "升级 MySQL Server 至 5.1.62 或 5.5.22 及以上版本。对于无法立即升级的环境，可通过限制数据库用户权限、仅授予必要操作权限来降低攻击面，同时在网络层面限制对 MySQL 端口的访问来源 IP。"
score = 4
severity = "MEDIUM"
sources = ["tenable"]
title = "Oracle MySQL Server Optimizer 拒绝服务漏洞"
updated = "2026-06-16T23:40:06Z"

