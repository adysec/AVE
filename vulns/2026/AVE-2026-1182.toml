[basic]
description = "Micronaut 框架的 DefaultHttpClient 在处理 HTTP 重定向时，会将 Authorization、Cookie 和 Proxy-Authorization 等敏感请求头转发至跨域重定向目标，且仅过滤 Host、Connection、TE、CT、CL 等少数头部，未对敏感信息进行剥离。同时不存在最大重定向次数限制，可导致无限循环拒绝服务攻击。该漏洞影响 Micronaut 3.x（<3.10.6）、4.x（<4.10.24）及 5.x（<5.0.1）版本。攻击者可通过构造恶意重定向响应，诱导客户端将认证凭据和会话 Cookie 泄露至攻击者控制的域，实现跨域信息窃取或会话劫持。CVSS 评分为 5.0，危害等级中等。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
