[basic]
description = "GNUJSP 1.0.0 和 1.0.1 版本存在文件泄露漏洞，远程攻击者可直接请求 gnujsp servlet 访问目标文件，该组件未对 JServ 的访问限制进行绕过处理，也未对请求文件进行合法性和权限校验。攻击者无需身份认证即可通过构造特定请求路径，列出服务器目录结构、读取敏感脚本源代码，并绕过应用的访问控制限制，从而获取不该公开的信息。该漏洞影响启用了 GNUJSP 的 Java Servlet 容器环境，CVSS 评分为 5.0，危害等级为中等。"
published = "2002-05-31T04:00:00Z"
remediation = "立即升级GNUJSP至1.1或更高版本，修复文件披露漏洞。在Web服务器中配置访问控制，阻止对/servlets/gnujsp/路径的直接请求，修复允许绕过.htaccess的配置错误。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "GNU GNUJSP 文件泄漏漏洞"
updated = "2026-06-16T21:57:10Z"

