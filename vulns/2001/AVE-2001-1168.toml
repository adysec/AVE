[basic]
description = "Microsoft Index Server 2.0 在处理搜索请求时存在缓冲区溢出漏洞，CVSS 评分 7.5。该服务在处理搜索参数时未对参数长度进行充分校验，当攻击者提交超长搜索参数时会导致缓冲区溢出。若溢出数据为精心构造的代码，攻击者即可在服务器上以 Local System 权限执行任意代码，从而完全控制目标系统。该漏洞仅影响 Windows NT 4.0 Option Pack 中包含的 Index Server 2.0，Windows 2000 的 Indexing Service 不受此漏洞影响。成功利用需要攻击者拥有目标服务器上的有效用户账户，并能通过 NetBIOS 建立命名管道连接，因此在正常配置的网络环境中，该漏洞通常只能被内网用户利用。Microsoft 在安全公告 MS01-025 中发布了修复补丁（Q294472），该修复通过确保 Index Server 在使用搜索参数前正确检查其长度来消除漏洞。"
published = "2001-06-27T04:00:00Z"
remediation = "安装 Microsoft 安全公告 MS01-025 发布的补丁，对应 Index Server 2.0 缓冲区溢出漏洞的修复程序为知识库文章 Q294472，适用于 Windows NT 4.0 Service Pack 6a 及 Windows NT 4.0 Option Pack；Indexing Service 的补丁为 Q296185，适用于 Windows 2000 Gold/SP1/SP2。确保系统已安装对应 Service Pack 后再应用补丁，补丁将包含在 Windows NT 4.0 Service Pack 7 及 Windows 2000 Service Pack 3 中。如无法立即安装补丁，应在防火墙层面阻断 NetBIOS 端口（137–139、445）的入站访问，以阻止攻击者建立命名管道连接，从而临时缓解漏洞利用风险。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Index Server 2.0 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:57Z"

