[basic]
description = "Phorum 3.0.7 存在未授权管理员密码修改漏洞。远程攻击者无需任何身份认证，只需向 admin.php3 发送 HTTP 请求并构造 step、option、confirm 和 newPssword 参数，即可直接修改管理员密码。该漏洞源于管理后台缺乏有效的身份验证检查，攻击者无需登录或拥有任何权限即可完成操作，成功利用后可完全控制论坛管理后台，影响 Phorum 3.0.7 及更早版本。"
published = "2000-12-31T05:00:00Z"
remediation = "升级 Phorum 至 3.0.8 或更高版本，该版本修复了 admin.php3 未经验证即可修改管理员密码的问题。如无法升级，在 Web 服务器（Apache/Nginx）层面对 admin.php3 添加 IP 白名单或 HTTP 基本认证限制访问，同时在 Phorum 配置中禁用远程管理功能。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Phorum 3.0.7 管理员密码未授权修改漏洞"
updated = "2026-06-16T21:53:25Z"

