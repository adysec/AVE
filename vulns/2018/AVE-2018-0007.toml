[basic]
description = "Cisco IOS 及 IOS XE 软件的 Internet 密钥交换版本 2（IKEv2）模块存在输入验证漏洞。该漏洞源于对特定 IKEv2 数据包的处理不正确，未经身份认证的远程攻击者可通过向受影响设备发送特制的 IKEv2 数据包触发漏洞，导致设备持续消耗内存并最终重新加载，造成拒绝服务（DoS）条件。攻击无需用户交互或权限，攻击复杂度低，影响范围广。Cisco 已发布安全更新修复此漏洞。"
published = "2018-03-28T22:29:00Z"
remediation = "立即登录 Cisco.com 并使用 Cisco IOS Software Checker 工具（https://tools.cisco.com/security/center/selectIOSVersion.x）查询当前运行版本对应的修复版本，升级至 March 2018 安全公告捆绑包中指定的第一修复版本。该漏洞无任何变通方案，必须通过软件升级修复。CISA KEV 已确认该漏洞在野被积极利用，建议在 2022 年 3 月 17 日前完成升级。升级后重启设备使新版本生效，并在防火墙层面限制对 UDP 500/4500 端口的非授权访问作为深度防御。"
score = 8.6
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS/IOS XE IKEv2 输入验证漏洞"
updated = "2026-06-17T01:29:57Z"

