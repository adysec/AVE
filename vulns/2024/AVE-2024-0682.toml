[basic]
description = "Linux 内核 AMD GPU 驱动（amdgpu）中的 `atomctrl_get_smc_sclk_range_table` 函数存在空指针解引用漏洞（CWE-476）。该函数在调用 `smu_atom_get_data_table()` 获取 SMU_Info 数据表时，未检查其返回值。若该调用失败并返回 NULL，后续代码将直接对空指针进行解引用操作，导致内核崩溃（拒绝服务）。该漏洞仅在 Polaris 系列 GPU 芯片上存在可触发的代码路径，实际利用条件极为苛刻——正常运行时 VBIOS 数据表始终存在，因此在实际环境中极难触发。攻击者需具备本地权限才能构造特定条件触发此漏洞。Linux 内核已通过补丁添加返回值检查修复此问题。"
published = "2025-03-06T16:15:51Z"
remediation = "升级 Linux 内核至包含该修复的稳定版本。Ubuntu 22.04 LTS 用户可通过 `sudo apt update && sudo apt install linux-image-generic` 升级至 5.15.0-1083 及以上版本；Ubuntu 20.04 LTS 用户升级至 5.4.0-1146 及以上版本。Debian/其他发行版用户应升级至包含上游补丁的内核版本。若无法立即升级内核，可考虑禁用 amdgpu 驱动作为临时缓解（在 GRUB 引导参数中添加 `modprobe.blacklist=amdgpu`），但这会影响 AMD GPU 图形和计算功能。建议通过各发行版官方仓库获取安全更新，而非手动编译内核。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux内核AMD GPU驱动空指针解引用漏洞"
updated = "2026-06-17T08:14:31Z"

