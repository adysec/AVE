[basic]
description = "AN HTTPD 1.38 至 1.4.1c 版本存在缓冲区溢出漏洞。该漏洞位于 SOCKS4 代理请求处理模块，未对客户端发送的 SOCKS4 连接请求中的用户名字段长度进行有效边界检查。攻击条件：目标系统运行存在漏洞的 AN HTTPD 版本，且该服务被配置为处理或转发 SOCKS4 代理请求。未经身份认证的远程攻击者可通过向目标发送包含超长用户名的特制 SOCKS4 请求触发缓冲区溢出，覆盖函数返回地址，从而在目标服务器上执行任意代码，可能导致服务器被完全控制或敏感信息泄露。"
published = "2002-12-31T05:00:00Z"
remediation = "由于 AN HTTPd 已停止维护且该漏洞存在于 1.38 至 1.4.1c 版本，建议立即停止使用该过期软件并迁移至 Apache 或 Nginx 等现代化安全 Web 服务器。若无法立即迁移，请在网络防火墙上配置访问控制列表 (ACL)，拦截所有针对该服务的 SOCKS4 协议请求以缓解风险。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "AN HTTPD 畸形SOCKS4请求缓冲区溢出漏洞"
updated = "2026-06-16T22:00:19Z"

