[info]
author = "ave"
description = "检测 Apple Safari 6.0 之前版本中 WebKit 渲染引擎内存破坏漏洞 CVE-2012-3595。通过向目标发送包含特定触发向量的 HTTP 请求，验证 Safari WebKit 是否存在内存损坏导致远程代码执行的可能性。"
id = "POC-AVE-2012-0271"
name = "Apple Safari WebKit 内存破坏远程代码执行漏洞 PoC"
severity = "high"
tags = ["ave-2012-0271"]
vuln_id = [
    "CVE-2012-3595",
    "AVE-2012-0271",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = ["Safari/5"]
