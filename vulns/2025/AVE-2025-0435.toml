[basic]
description = "axboe fio 3.41 及之前版本的 init.c 文件中 __parse_jobs_ini 函数存在释放后使用（Use After Free）漏洞。攻击者需在本地环境下，通过精心构造的输入操控该函数处理逻辑，触发已释放内存的再次引用，可能导致程序崩溃或任意代码执行。该漏洞影响使用 fio 进行磁盘基准测试的 Linux/Unix 系统，CVSS 4.0 评分 1.9（低危），利用代码已公开披露。"
published = "2025-09-23T01:15:36Z"
remediation = "建议立即升级 fio 至 3.42 或更高版本（如 Ubuntu 24.04 的 fio 3.38-2ubuntu0.1 或更高版本已回港修复补丁）。如暂时无法升级，可限制本地用户执行 fio 配置文件解析权限（chmod 640 /etc/fio/ 等配置目录），或通过 SELinux/AppArmor 限制 fio 进程访问权限作为临时缓解措施。建议通过包管理器（apt upgrade fio / yum update fio / dnf update fio）直接升级到修复版本。"
score = 1.9
severity = "LOW"
sources = ["msrc"]
title = "axboe fio 释放后使用漏洞"
updated = "2026-06-17T08:29:04Z"

