[basic]
description = "Windows 基于虚拟化的安全性 (VBS) 存在安全功能绕过漏洞。由于 VBS 在实现安全隔离机制时存在逻辑缺陷，具有低权限本地账户的攻击者可以通过运行特制的应用程序，在无需用户交互的情况下绕过 VBS 的保护措施。此漏洞影响多种 Windows 操作系统版本，成功利用后可破坏系统内核隔离，导致机密数据泄露或为更高权限的攻击提供跳板。CVSS 评分为 5.5，危害等级为中危。"
published = "2025-01-14T18:15:59Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 KB5050021（OS Builds 22621.4751 和 22631.4751），可通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。该更新修复了 VBS 安全功能绕过漏洞，防止低权限攻击者绕过 VBS 隔离机制读取敏感信息。如无法立即安装更新，可限制本地用户对敏感虚拟化资源的访问权限，并启用 Credential Guard 和基于虚拟化的安全策略强化作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 基于虚拟化的安全性 (VBS) 安全功能绕过漏洞"
updated = "2026-06-17T08:43:08Z"

