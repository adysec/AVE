[basic]
description = "Nostromo nhttpd 1.9.6 及更早版本中的 http_verify 函数存在目录遍历漏洞，远程攻击者无需身份认证即可通过发送特制的 HTTP 请求（如包含 `..` 路径序列的 POST 请求）绕过路径限制，实现任意文件读取或远程命令执行。该漏洞影响所有运行 Nostromo nhttpd 1.9.6 及之前版本的系统，CVSS 评分 9.8，危害等级严重。官方已在 1.9.7 版本中修复此漏洞，建议用户立即升级。"
published = "2019-10-14T17:15:09Z"
remediation = "立即将 Nostromo nhttpd 升级至 1.9.7 或更高版本，该版本修复了 http_verify 函数中的目录遍历漏洞。如无法升级，可在 Web 服务器前端部署反向代理（如 Nginx）过滤包含 `..` 的恶意请求路径，或在防火墙层面限制对 80/443 端口的非信任来源访问。若业务允许，建议直接替换为积极维护的 Web 服务器（如 Nginx 或 Apache）。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Nostromo nhttpd 目录遍历远程代码执行漏洞"
updated = "2026-06-17T02:22:03Z"

