[basic]
description = "Check Point Firewall-1 4.1 版本在使用受限 IP 许可证时存在拒绝服务漏洞，远程攻击者可向内部接口发送大量伪造源地址的 IP 数据包，导致控制台被警告消息淹没并耗尽 CPU 资源，使防火墙无法正常处理合法流量。该漏洞影响 FireWall-1 4.1 受限许可证版本，攻击者无需认证即可远程利用，仅需能向防火墙内部接口发送数据包即可触发，属于资源耗尽型拒绝服务攻击，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），主要影响可用性。"
published = "2001-03-26T05:00:00.000"
remediation = '建议升级至 Check Point Firewall-1 4.1 SP1 或更高版本（如 NG AI R55），该版本修复了有限 IP 许可下的欺骗包处理逻辑。若暂时无法升级，可在内部接口配置反欺骗规则：启用 "Anti-Spoofing" 并设置为 "Track" 或 "Prevent" 模式，限制源地址为合法内网网段；同时在管理控制台调高 "Log Alerts" 阈值或禁用针对此类欺骗包的控制台告警，防止日志泛滥耗尽 CPU 资源。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Check Point FireWall-1 4.1 IP 报文拒绝服务漏洞"
updated = "2026-06-16T21:53:49.833"

