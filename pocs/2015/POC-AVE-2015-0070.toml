[info]
author = "ave"
description = "检测目标是否存在PHP会话反序列化漏洞"
id = "POC-AVE-2015-0070"
name = "CVE-2015-9480 PHP Session Deserialization PoC"
severity = "high"
tags = [
    "cve-2015-9480",
    "php",
    "deserialization",
]
