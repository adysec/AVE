[basic]
description = 'Zyxel UAG、USG 及 ZyWall 系列设备中的 "Free Time" 组件存在访问控制缺失漏洞。远程攻击者无需认证即可直接访问账户生成器接口，批量创建访客账户，进而获得未授权网络访问权限或导致服务拒绝（DoS）。该漏洞源于对关键功能缺乏权限校验（CWE-425），攻击者仅需发送特制 HTTP 请求即可利用，无需任何前置条件，CVSS 评分 9.1，危害严重。受影响的固件版本包括 UAG2100 等型号。'
published = "2019-06-27T14:15:10Z"
remediation = "立即联系 Zyxel 技术支持获取针对具体型号的 hotfix 补丁并安装：UAG2100 升级至 4.18(AAIZ.1)C0 以上、USG110 升级至 4.33(AAPH.0)C0 以上、ZyWall 110 升级至 4.33(AAAA.0)C0 以上，其余型号对应版本详见 Zyxel 安全公告。如无法立即打补丁，可在防火墙/ACL 层面限制对 /free_time.cgi 及 /free_time_transaction.cgi 路径的外部访问，仅允许受信任的客户端 IP 访问设备管理接口，并启用 MAC 地址过滤和速率限制以缓解账户耗尽型 DoS 攻击。"
score = 9.1
severity = "CRITICAL"
sources = ["nuclei"]
title = "Zyxel UAG/USG/ZyWall 设备 Free Time 组件访问控制缺失漏洞"
