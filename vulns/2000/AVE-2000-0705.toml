[basic]
description = "Fortech Proxy+ 存在安全绕过漏洞，远程攻击者可通过 Telnet 代理重定向连接，绕过对管理服务的访问限制。该漏洞源于代理服务器未正确区分管理流量与普通代理流量，导致未授权用户可借助 Telnet 代理通道间接访问管理接口，进而执行非授权操作。攻击者无需身份认证即可利用，CVSS 评分 5.0，影响 Fortech Proxy+ 相关版本。"
published = "2000-06-26T04:00:00Z"
remediation = "该漏洞影响 Fortech Proxy+ 管理服务，攻击者可通过 telnet 代理绕过访问限制。由于该产品已停止维护且厂商不再提供补丁，建议立即迁移至受支持的代理服务器软件（如 Squid、HAProxy），并在防火墙层面限制仅允许可信 IP 访问管理端口，同时禁用不必要的 telnet 代理功能。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Fortech Proxy+ 管理服务安全绕过漏洞"
updated = "2026-06-16T21:52:04Z"

