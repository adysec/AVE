[basic]
title = "AnalogX Proxy 4.04 及更早版本 FTP 协议缓冲区溢出拒绝服务漏洞"
description = "AnalogX Proxy 4.04 及更早版本的 FTP 代理服务存在缓冲区溢出漏洞。远程攻击者无需认证即可向 FTP 端口发送超长 USER 命令，触发栈缓冲区溢出，导致代理服务进程崩溃，造成拒绝服务。攻击复杂度低，危害性中等。"
severity = "MEDIUM"
score = 5.0
sources = ["cve", "exploitdb"]
published = "2000-07-25"
updated = "2000-07-25"
remediation = "升级到 AnalogX Proxy 4.05 或更高版本。该漏洞已在 4.05 版本中修复，用户应从官方渠道获取最新版本进行更新。"

[references]
urls = ["https://nvd.nist.gov/vuln/detail/CVE-2000-0656", "https://www.exploit-db.com/exploits/20099", "https://github.com/advisories/GHSA-xfg8-c4cc-3fg2"]

