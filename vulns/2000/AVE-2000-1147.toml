[basic]
description = "Apache HTTP Server 1.3.0 至 1.3.11 版本存在跨站脚本（XSS）漏洞，攻击者可利用该漏洞在访问者浏览器中执行任意脚本。漏洞原理在于 printenv CGI 脚本（printenv.pl）未对输出内容进行正确的 HTML 编码，导致用户可控参数被直接反射到页面中；此外，ap_send_error_response 函数生成的默认错误页面（如 404 页面）未声明明确的字符集，某些浏览器可能以 HTML 方式解析 text/plain 内容类型，从而触发脚本注入；部分核心代码及特定 Apache 模块生成的消息同样存在反射型 XSS 风险。该漏洞影响 Apache 1.3.0 到 1.3.11 的所有版本，攻击条件为远程攻击者诱导用户访问包含恶意脚本的特制 URL，利用方式为构造包含 JavaScript 代码的请求链接，当用户点击后在受害者浏览器中以当前站点上下文执行脚本，可窃取会话令牌、重定向页面或篡改页面内容。Apache 官方已在 1.3.12 版本中修复该漏洞。"
published = "2000-02-01T00:00:00Z"
remediation = "立即将 Apache HTTP Server 升级至 1.3.12 或更高版本，官方安全公告见 http://httpd.apache.org/security/vulnerabilities_13.html。如无法立即升级，可临时移除或禁用 cgi-bin 目录下的 printenv.pl 脚本，并在 httpd.conf 中添加 AddDefaultCharset UTF-8 指令确保错误页面输出包含明确的字符集声明，同时通过 Content-Security-Policy 响应头限制脚本执行以缓解跨站脚本攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Apache HTTP Server printenv.pl 跨站脚本漏洞"
updated = "2000-02-01T00:00:00Z"

