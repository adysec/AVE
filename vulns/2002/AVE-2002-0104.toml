[basic]
description = "Cyrus IMAP 邮件服务器 1.4/1.5.19/2.0.12/2.0.16/2.1.9/2.1.10 版本在 imapparse.c 中存在整数溢出漏洞。远程攻击者可在无需身份认证的情况下，通过向 IMAP 服务发送超长的登录字符串（如含极大长度值的 FETCH 或 LOGIN 命令），触发堆缓冲区溢出，导致堆内存损坏并可被利用执行任意代码。该漏洞影响 Cyrus IMAPD 1.4 至 2.1.10 多个版本，攻击者只需网络可达目标 IMAP 端口（143/993），无需事先获取凭据即可发起利用。与 CVE-2002-1347 为不同的漏洞。Cyrus 项目已在后续版本中修复此问题，建议升级到修复版本并限制不必要的 IMAP 端口暴露。"
published = "2004-06-14T04:00:00.000"
remediation = "升级到 Cyrus IMAP 2.1.11 或更高版本，该版本修复了 IMAP 解析代码中的预登录缓冲区溢出漏洞。如无法立即升级，可在防火墙或 iptables 层面限制对 IMAP 端口（143/993）的访问，仅允许可信 IP 连接；临时缓解措施还包括在 imapd 前部署反向代理以过滤超长的登录请求，或通过 TCP Wrapper 限制访问源。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Cyrus IMAPD Pre-Login 堆溢出远程代码执行漏洞"
updated = "2026-06-16T21:59:35.490"

