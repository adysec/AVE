[info]
author = "ave"
description = "检测 FreeBSD Alpha 系统上 /dev/random 和 /dev/urandom 设备文件是否存在。若缺失则 OpenSSL/OpenSSH 回退到弱 PRNG，生成可预测密钥。"
id = "POC-AVE-2000-0613"
name = "FreeBSD Alpha OpenSSL 弱随机数生成器检测 PoC"
severity = "medium"
tags = ["ave-2000-0613"]
vuln_id = [
    "CVE-2000-0535",
    "AVE-2000-0613",
]

[poc]
logic = "any"

[[poc.requests]]
path = "/dev/random"
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["No such file"]

[[poc.requests]]
path = "/dev/urandom"
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["No such file"]
