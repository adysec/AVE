[basic]
description = "Lorex 2K 室内 Wi-Fi 安全摄像头的 sonia 二进制程序在解析 JSON 请求时存在格式化字符串漏洞，由于未对用户提供的字符串进行适当验证便直接作为格式说明符使用，网络相邻的未认证攻击者可利用此漏洞在 root 权限下执行任意代码。该漏洞影响 Lorex 2K Indoor Wi-Fi Security Camera 产品，CVSS 评分 7.5，攻击向量为网络相邻且无需身份认证，危害等级为高危。"
