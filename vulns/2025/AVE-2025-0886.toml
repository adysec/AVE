[basic]
description = "标签之间。<value>Oracle MySQL Server 的 InnoDB 存储引擎存在未控制的资源消耗漏洞（CWE-400），低权限攻击者无需交互即可通过网络多协议远程访问目标数据库，触发资源耗尽条件，导致 MySQL Server 挂起或频繁可重复崩溃，造成完全拒绝服务。受影响版本包括 8.0.0 至 8.0.41、8.4.0 至 8.4.4 及 9.0.0 至 9.2.0，CVSS 3.1 基础评分为 6.5（MEDIUM），严重程度中等。"
published = "2025-04-15T21:15:48.120"
remediation = "建议立即升级 MySQL Server 到以下修复版本：8.0.42 或更高版本、8.4.5 或更高版本、9.2.1 或更高版本。可通过 Oracle 官方下载页面获取补丁包，或使用包管理器（如 yum/dnf/apt）更新至 Linux 发行商提供的修复版本（AlmaLinux 9 执行 `dnf update mysql-server`，RHEL 10 执行 `dnf update mysql`，RockyLinux 8 执行 `dnf update mysql`）。若暂时无法升级，可在防火墙层面限制 MySQL 端口（默认 3306）仅允许受信任 IP 访问，并配置 `innodb_buffer_pool_size` 等参数降低资源耗尽风险。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Oracle MySQL Server InnoDB 拒绝服务漏洞"
updated = "2026-06-17T08:43:46.287"

