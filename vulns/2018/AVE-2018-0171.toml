[basic]
description = "Swagger UI 4.1.2 及之前版本存在输入验证不恰当漏洞，远程攻击者可通过构造特制 URL 并诱使受害者点击，在 Swagger UI 中加载并显示远程 OpenAPI 定义内容，从而实施欺骗攻击。该漏洞影响 Swagger UI 全系列版本，官方声称在 4.1.3 版本修复，但第三方证实该版本及后续版本仍受影响。攻击需要用户交互，CVSS 评分 4.3，危害等级中危。"
published = "2022-03-11T07:15:07Z"
remediation = "升级 Swagger UI 至 v4.1.3 或更高版本（v5.x 推荐），该版本默认禁用从 URL 查询参数读取配置（`queryConfigEnabled` 默认为 `false`），防止攻击者通过 `?url=` 参数覆盖 OpenAPI 定义文件。切勿将 `queryConfigEnabled` 设为 `true`。如无法升级，在反向代理或应用入口处拦截含 `?url=` 参数的请求，或在使用 SwaggerUIBundle 初始化前检测并拒绝该参数。"
score = 4.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "SmartBear Swagger UI 输入验证不当漏洞"
updated = "2026-06-17T01:54:33Z"

