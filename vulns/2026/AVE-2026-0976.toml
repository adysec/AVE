[basic]
description = "OpenClaw 客户端 OAuth 授权实现中存在 PKCE 验证器信息泄露漏洞。该漏洞源于 OAuth 授权流程中将敏感数据暴露在授权 URL 查询字符串中，远程攻击者可通过诱导目标用户发起 OAuth 授权流程，利用 URL 中的泄露信息获取存储的凭据，进而导致进一步系统入侵。攻击复杂度较高，需要用户交互，影响 OpenClaw 2026.2.25 之前版本。"
published = "2026-04-11T01:16:16Z"
remediation = "将 OpenClaw 升级到 2026.2.25 或更高版本。该版本已移除 macOS beta 引导流程中通过 OAuth state 传递 PKCE code_verifier 的脆弱实现，改为仅支持 setup-token 方式完成 Anthropic 订阅认证。如暂无法升级，可暂时避开 macOS beta 版 onboarding 流程中的 Anthropic OAuth 登录入口，改用 setup-token 手动配置。补丁提交为 8f3310000a8b0c11eced054c2cdb6fb27803511a。"
score = 5.3
severity = "MEDIUM"
sources = ["zdi"]
title = "OpenClaw OAuth PKCE 验证器信息泄露漏洞"
updated = "2026-06-17T10:44:00Z"

