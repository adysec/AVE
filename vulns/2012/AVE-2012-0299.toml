[basic]
description = "tags.<value>Apple iTunes 10.7 之前版本所使用的 WebKit 渲染引擎存在内存破坏漏洞。远程攻击者可通过构造恶意网页，诱使用户在 iTunes 中打开或预览特制内容，从而触发堆或栈内存越界访问，导致应用程序拒绝服务或执行任意代码。该漏洞影响所有未及时安装 Apple 安全更新的 iTunes 用户，攻击无需预先获取系统权限，但需要用户主动访问攻击者控制的恶意链接才能触发利用过程。"
published = "2012-09-13T10:30:19Z"
remediation = "建议立即将 Apple iTunes 升级至 10.7 或更高版本，以修复 WebKit 内存损坏漏洞。升级路径为：打开 iTunes，依次点击「帮助」→「检查更新」，或直接从 Apple 官网下载安装最新版 iTunes。如暂无法升级，应避免使用 iTunes 访问不受信任的网站，并可在防火墙或代理中限制 iTunes 对已知恶意域名的访问，同时及时安装操作系统安全更新。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:36Z"

