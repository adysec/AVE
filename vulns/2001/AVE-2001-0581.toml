[basic]
description = "BroadVision One-To-One Enterprise 存在路径泄露漏洞，远程攻击者无需身份认证即可通过请求一个不存在的 .JSP 文件名，触发服务器返回包含物理路径的错误信息，从而获取服务器文件的真实路径。该漏洞影响 BroadVision One-To-One Enterprise 系列产品，CVSS 评分 5.0，危害等级中危。攻击者利用此信息可进一步探测服务器目录结构，为后续攻击提供基础。"
published = "2001-02-16T05:00:00Z"
remediation = "建议在 Web 服务器层面配置自定义 404/500 错误页面，禁止在错误响应中泄露任何服务器内部路径信息，同时禁用详细错误调试模式。由于 BroadVision One-To-One Enterprise 已停止维护，建议迁移至受支持的替代产品，并对 Web 目录实施最小权限原则。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "BroadVision One-To-One Enterprise 物理路径信息泄露漏洞"
updated = "2026-06-16T21:53:31Z"

