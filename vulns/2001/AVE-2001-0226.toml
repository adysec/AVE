[basic]
description = "该漏洞存在于 PHP Apache 模块 4.0.4 及更早版本中。其原理在于当远程攻击者向一个无访问限制的页面发送畸形的 HTTP 请求时，会导致 PHP 错误地将该页面的访问控制状态应用于随后请求的页面，从而绕过 `.htaccess` 文件的访问限制。攻击者无需身份验证即可通过构造特定请求，访问本应被限制的敏感资源。该漏洞影响所有运行受影响 PHP Apache 模块版本的服务器，可能导致机密信息泄露。"
published = "2001-03-12T05:00:00.000"
remediation = "建议将 PHP Apache 模块升级至 4.0.5 或更高版本以修复该漏洞。如运行的是 Red Hat Linux，可安装 Red Hat 官方安全更新包（php-4.0.4pl1-6 或更高版本）；如为 Debian 系统，请升级至 php4 4.0.4pl1-6.1 或更新版本；Mandrake 用户应安装 MDKSA-2001-013 安全更新。如暂时无法升级，可在 Apache 配置中添加 mod_security 规则过滤畸形 HTTP 请求，或临时禁用 PHP 对无访问控制目录的解析权限，并严格检查 .htaccess 文件的访问控制逻辑是否被正确继承。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Mandrake Linux PHP Apache 模块安全绕过漏洞"
updated = "2026-06-16T21:53:40.240"

