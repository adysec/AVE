[basic]
description = "SquirrelMail 1.2.3 之前版本的 compose.php 存在跨站请求伪造（CSRF）漏洞。远程攻击者可通过构造包含恶意 IMG 标签的 HTML 邮件或网页，诱使已登录 SquirrelMail 的用户访问，从而在用户不知情的情况下以该用户的身份发送邮件。攻击者可任意修改 send_to 和 subject 参数，实现冒充他人发送垃圾邮件或钓鱼邮件。该漏洞利用条件低，仅需用户点击恶意链接即可触发，影响所有使用 SquirrelMail 1.2.3 之前版本的 Web 邮件系统。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 SquirrelMail 至 1.2.3 或更高版本，该版本修复了 compose.php 中缺少 CSRF 令牌的问题。如无法立即升级，可在 Web 服务器（Apache/Nginx）层面配置 Referer 检查，拒绝非本站来源对 compose.php 的请求，并启用 CSRF 防护插件作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "SquirrelMail compose.php 跨站请求伪造漏洞"
updated = "2026-06-16T21:59:43Z"

