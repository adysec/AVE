[basic]
description = "XFree86 3.3.5 及 3.3.6 版本中 Xlib 库存在缓冲区溢出漏洞。本地攻击者可通过设置超长 DISPLAY 环境变量或在命令行传递超长 -display 参数触发该漏洞，导致任意命令执行。攻击者利用此漏洞可获取目标系统的本地权限提升，影响运行 XFree86 3.3.x 的 Unix/Linux 系统。攻击条件为需要本地用户身份，无需认证即可利用。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 XFree86 至 4.0 或更高版本（该版本修复了 xlib 缓冲区溢出问题），或迁移至 X.Org 分支。临时缓解措施：限制 DISPLAY 环境变量长度不超过 256 字符，并避免在不可信环境中使用 -display 命令行参数传递超长字符串。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "XFree86 Xlib Display 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:53.677"

