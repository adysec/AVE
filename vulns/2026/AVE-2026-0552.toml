[basic]
description = "Windows 截图工具（Snipping Tool）存在命令注入漏洞（CWE-77），该漏洞源于程序对用户输入的特殊元素过滤不严，未能正确中和命令中的特殊元素。本地攻击者可利用此漏洞，通过诱使用户打开特制的恶意文件或内容，在目标系统上以当前用户权限执行任意命令。该漏洞影响多个 Windows 版本，CVSS 评分 7.8，危害等级高。Microsoft 已在 2026 年 4 月安全更新中修复此漏洞。"
published = "2026-04-14T18:17:20Z"
remediation = "立即安装 Microsoft 2026 年 4 月安全更新，各版本最低修复版本号：Windows 10 1607 升级至 10.0.14393.9060、Windows 10 1809 升级至 10.0.17763.8644、Windows 10 21H2/22H2 升级至 10.0.19044.7184/10.0.19045.7184、Windows 11 23H2/24H2/25H2/26H1 分别升级至 10.0.22631.6936、10.0.26100.8246、10.0.26200.8246、10.0.28000.1836。可通过 Windows Update 自动获取更新，或访问 Microsoft 更新目录网站手动下载安装。临时缓解措施：限制用户对截图工具的可执行权限，避免在受影响的系统上打开来自不可信来源的截图文件。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Microsoft Windows Snipping Tool 命令注入漏洞"
updated = "2026-06-17T10:35:18Z"

