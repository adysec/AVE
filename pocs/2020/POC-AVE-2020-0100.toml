[info]
author = "ave"
description = "ManageEngine Desktop Central CewolfServlet Java反序列化远程代码执行漏洞检测，通过访问/cewolf/端点并检测Java异常响应验证漏洞是否存在"
id = "POC-AVE-2020-0100"
name = "CVE-2020-10189 ManageEngine Desktop Central RCE"
severity = "critical"
tags = ["ave-2020-0100"]
vuln_id = [
    "CVE-2020-10189",
    "AVE-2020-0100",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cewolf/"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "java.lang.ClassNotFoundException",
    "java.lang.RuntimeException",
    "CewolfServlet",
]
