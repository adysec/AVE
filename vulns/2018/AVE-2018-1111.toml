[basic]
description = "Windows Win32k 内核组件在处理内存对象时存在不当引用漏洞，本地低权限攻击者可通过构造恶意 Win32k 用户模式回调（如 NtUserSetWindowFNID），诱骗用户执行特制应用程序触发该漏洞，从而在内核态执行任意代码并提升至 SYSTEM 权限。该漏洞影响 Windows 7/8.1/10/RT 8.1 及 Windows Server 2008 至 2019 等多个主流版本，CVSS 评分 7.8，危害等级高。Microsoft 已在 2018 年 10 月安全更新中修复此漏洞。"
published = "2018-10-10T13:29:02Z"
remediation = "立即安装 Microsoft 2018 年 10 月安全更新，各版本对应 KB 编号为：Windows 10 Version 1809 安装 KB4464330、Version 1803/Windows Server 2016 安装 KB4462933、Windows 8.1/Windows 7 SP1 安装 KB4462921/KB4462920。通过 Windows Update 自动更新即可获取补丁。如无法立即安装，可启用 Windows Defender Exploit Guard 的 Attack Surface Reduction 规则或限制本地低权限用户运行 Win32k 回调相关程序作为临时缓解措施。该漏洞已被 CISA 纳入已知被利用漏洞目录，建议在规定期限内完成补丁部署。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Win32k 特权提升漏洞"
updated = "2026-06-17T02:04:54Z"

