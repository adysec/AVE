[basic]
description = "Adobe Flash Player 9.0.124.0 及更早版本中存在未明确指定的安全漏洞，攻击者可利用该漏洞发起 DNS 重绑定攻击。当用户访问包含恶意 Flash 内容的网页时，攻击者通过操控 DNS 响应使 Flash Player 误认为当前请求的目标域名与 SWF 文件所在域名一致，从而绕过 Flash 的同源策略安全限制。成功利用后，攻击者可在用户不知情的情况下以受害者的身份向内部网络或外部网站发送请求，窃取敏感信息或执行未授权操作。该漏洞影响广泛，因为 Flash Player 曾普遍安装于各类浏览器中，且攻击过程无需用户进行任何交互操作即可完成。"
published = "2008-11-10T14:12:55Z"
remediation = "建议立即升级 Adobe Flash Player 至 10.0.12.36 或更高版本，受影响版本为 9.0.124.0 及更早版本。Windows 用户可通过官方下载页获取更新，浏览器插件版本需对应升级。如暂时无法打补丁，可在浏览器中禁用 Flash Player 或使用浏览器扩展限制 Flash 内容的网络访问，以缓解 DNS 重绑定攻击风险。同时建议在企业环境中部署 Adobe 安全公告 APSB08-20 中描述的安全配置，限制 Flash 的跨域策略文件权限，防止攻击者利用 crossdomain.xml 进行权限提升。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Adobe Flash Player DNS重绑定漏洞"
updated = "2026-06-16T22:58:36Z"

