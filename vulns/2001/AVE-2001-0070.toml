[basic]
description = "eEye Iris 1.01 beta 网络监控工具存在拒绝服务漏洞，远程攻击者可构造特制的畸形数据包发送至目标网络，当用户使用 eEye Iris 查看该恶意数据包时，程序因未对异常数据包进行充分校验而触发崩溃，导致网络监控服务中断，影响网络安全审计与入侵检测工作的正常开展。该漏洞利用条件要求攻击者已处于目标网络环境中并能够发送特制数据包，且用户使用存在缺陷的 Iris 版本进行数据包查看，攻击无需身份认证即可实现服务拒绝，CVSS 评分为 2.6，危害等级较低。"
published = "2001-03-26T05:00:00.000"
remediation = "eEye Digital Security 已发布安全公告并修复该漏洞，受影响版本为 Iris 1.01 beta。建议立即将 Iris 网络流量分析器从 1.01 beta 升级至 eEye 官方发布的最新稳定版本（1.01 正式版或更高版本），新版本已修复对畸形数据包头部字段的解析缺陷。如暂时无法升级，应在边界防火墙或 IDS/IPS 设备上部署规则，过滤包含异常 IP/TCP 头部字段（如 ip_v、ip_hl 字段值为 -1）的恶意数据包，阻止其到达运行 Iris 的主机，作为临时缓解措施。同时限制对运行 Iris 主机的远程访问，仅允许受信任的管理源 IP 访问相关端口。"
score = 2.6
severity = "LOW"
sources = ["cve"]
title = "eEye Iris 拒绝服务漏洞"
updated = "2026-06-16T21:53:50.113"

