[basic]
description = "GNU Groff 排版系统存在提权漏洞。Groff 在查找设备描述文件时使用当前工作目录，攻击者可在本地放置伪造的 postpro 指令描述文件。当其他用户在该目录运行 groff 时，恶意指令会被执行，导致权限提升。CVSS 评分为 10 分（AV:N/AC:L/Au:N/C:C/I:C/A:C），危害严重。攻击者无需网络访问，仅需本地路径可写权限，诱导目标用户在恶意文件所在目录执行 groff 即可触发。"
published = "2000-12-19T05:00:00Z"
remediation = "<value>升级 GNU Groff 至 1.17 或更高版本。在 Debian/Ubuntu 系统中执行 `apt-get update && apt-get install groff`；在 RHEL/CentOS 系统中执行 `yum update groff` 或 `dnf update groff`。如无法立即升级，可采取以下缓解措施：（1）从受信任的目录运行 groff，避免在可写目录下执行；（2）检查是否存在恶意设备描述文件（如 postpro 等）并删除；（3）通过 `chmod 700` 限制用户工作目录权限，防止本地用户放置恶意描述文件；（4）定期审查 groff 运行目录下的异常文件。</arg_value></tool_call>"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "GNU Groff 本地特权提升漏洞"
updated = "2026-06-16T21:52:30Z"

