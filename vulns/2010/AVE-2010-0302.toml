[basic]
description = "Apple Safari 浏览器在 5.0.1 之前版本（Mac OS X 10.5 至 10.6 及 Windows 系统）以及 4.1.1 之前版本（Mac OS X 10.4）的 AutoFill 自动填充功能存在信息泄露漏洞。远程攻击者可构造恶意网页，通过 JavaScript 代码强制触发输入字段的键盘事件，诱使浏览器在用户无感知的情况下自动填充地址簿联系人信息，从而获取敏感的个人通讯数据。该漏洞属于信息泄露类型，攻击无需用户交互即可在后台窃取 Address Book 中的隐私数据。"
published = "2010-07-30T20:30:02Z"
remediation = "将 Safari 升级至 5.0.1 版本（Mac OS X 10.5–10.6 及 Windows）或 4.1.1 版本（Mac OS X 10.4），或通过 Safari 偏好设置中的自动填充功能关闭 AutoFill，以阻止地址簿信息在用户无交互时向网站泄露。"
score = 2.6
severity = "LOW"
sources = ["tenable"]
title = "Apple Safari AutoFill 信息泄露漏洞"
updated = "2026-06-16T23:19:21Z"

