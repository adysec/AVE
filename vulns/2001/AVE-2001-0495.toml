[basic]
description = "多种 TCP 协议栈实现存在 TCP 最大分段大小（MSS）处理缺陷，远程攻击者可通过将 MSS 设置为极小值并请求大量数据，迫使目标系统生成大量包含极少有效负载的小数据包，从而放大网络流量并耗尽服务器 CPU 资源，导致拒绝服务。该漏洞影响 HP-UX 11、Linux Kernel 2.4、Windows 2000/NT 4.0、IRIX 6.5 等多个操作系统，攻击无需认证，远程即可触发。"
published = "2001-07-07T04:00:00Z"
remediation = "Linux 系统：升级内核至 2.4.18 及以上版本，或通过 iptables 添加规则 `iptables -A FORWARD -p tcp -m tcpmss --mss 1:500 -j DROP` 过滤异常小 MSS 的 TCP 包。Windows 系统：安装 MS02-005 安全更新或升级至 Windows XP/2003 及以上版本。HP-UX 系统：安装 PHNE_25243 补丁。IRIX 系统：升级至 6.5.13 及以上版本。在网络边界防火墙配置规则，丢弃 TCP SYN 包中 MSS 值小于 536 字节的连接请求，作为通用缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "IRIX/Linux/Windows TCP MSS 小值拒绝服务漏洞"
updated = "2026-06-16T21:55:53Z"

