[basic]
description = "DomainMOD 4.11.01 版本中存在跨站脚本（XSS）漏洞，位于 `assets/add/ssl-provider-account.php` 页面的 `username` 参数中。具有管理员权限的攻击者可将恶意 JavaScript 代码注入该参数，当其他管理员访问受影响页面时脚本自动执行，导致敏感信息泄露或会话劫持。攻击需管理员权限及用户交互，CVSS 评分 4.8，危害等级中危。"
published = "2018-12-10T09:29:00Z"
remediation = "升级 DomainMOD 至 4.12.0 或更高版本，该版本已修复 ssl-provider-account.php 中 username 参数未正确转义导致的 XSS 问题。如无法立即升级，在应用入口处对 username 等用户输入参数实施 HTML 实体编码（如将 `<` 转义为 `&lt;`），并启用 Content-Security-Policy 响应头限制脚本执行来源。"
score = 4.8
severity = "MEDIUM"
sources = ["nuclei"]
title = "DomainMOD 4.11.01 ssl-provider-account.php 跨站脚本漏洞"
updated = "2026-06-17T01:52:09Z"

