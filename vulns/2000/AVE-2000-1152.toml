[basic]
description = "tags.<value>Microsoft Windows 2000 在 Service Pack 2 之前的版本中，当系统运行于非 Windows 2000 域环境并使用 NTLM 身份验证时，若账户凭据已被本地缓存，本地用户可通过该漏洞绕过账户锁定策略，进行无限次的登录尝试。攻击者利用缓存的凭据机制，反复提交密码 guesses 而不会触发账户锁定保护，从而逐步暴力破解账户口令，最终获取未授权系统访问权限。该漏洞影响 Windows 2000 各类部署场景，在满足特定域环境及 NTLM 认证条件时即可被利用，无需管理员权限。"
published = "2000-11-21T05:00:00Z"
remediation = '升级到 Windows 2000 Service Pack 2 (SP2) 或更高版本。如无法立即安装补丁，可临时禁用本地凭据缓存（修改注册表键 HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Lsa\ForceGuest 为 1 或将域控制器迁移到 Windows 2000 域模式，同时通过组策略配置账户锁定策略并启用强密码以限制暴力破解风险。'
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Windows 2000 账户锁定策略绕过漏洞"
updated = "2026-06-16T21:53:24Z"

