[basic]
description = 'Check Point VPN-1/FireWall-1 4.1及更早版本存在安全绕过漏洞，该产品在处理封装FWS数据包时未对数据包来源进行充分验证，即使数据包不来自合法的FWZ客户端也会进行重传转发。未经身份认证的远程攻击者可利用此"封装数据包重传"机制发送特制数据包，绕过防火墙的安全访问控制策略，可能导致未授权访问受保护的内部网络资源。该漏洞影响Check Point VPN-1/FireWall-1 4.1及更早版本，攻击复杂度低，CVSS评分为7.5，危害等级为高。'
published = "2000-11-14T05:00:00Z"
remediation = "立即将 Check Point VPN-1/FireWall-1 升级至 4.1 Service Pack 1 或更高版本，该补丁修复了对外封装 FWS 数据包的不当重传漏洞。如暂时无法升级，可在防火墙规则中禁用 FWZ 协议的封装修正功能，并限制外部对 VPN-1/FireWall-1 管理接口的访问，仅允许受信任的管理终端连接。建议联系 Check Point 技术支持获取针对 4.1 版的专用补丁包并进行完整性验证。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Check Point VPN-1/FireWall-1 安全绕过漏洞"
updated = "2026-06-16T21:52:31Z"

