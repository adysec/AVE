[basic]
description = "Apache HTTP Server 的 mod_cgid 模块在使用线程化多路处理模块（threaded MPM）时，未能正确处理 CGI 程序的重定向路径，导致 CGI 程序的输出（可能包含敏感数据如环境变量、请求头及请求体内容）被错误地发送至其他客户端连接，而非发起请求的客户端。该漏洞影响 Apache 2.0.48 之前且使用 worker 或 event 等线程化 MPM 的版本，攻击者无需身份认证即可通过构造包含 CGI 重定向的恶意请求触发信息泄露，CVSS 评分 10.0，危害等级严重。"
published = "2003-11-03T05:00:00Z"
remediation = "建议将 Apache HTTP Server 升级到 2.0.48 或更高版本，以修复 mod_cgid 在处理 CGI 重定向路径时的信息泄漏漏洞。若当前服务器使用 worker 或 winnt MPM 等线程式多处理模块，可在升级前临时切换为 prefork MPM 以规避 mod_cgid 模块被调用。升级后请重启 Apache 服务，并验证 Server 版本号确认更新已生效。如无法立即升级，建议通过防火墙或 ACL 限制对 CGI 脚本的直接访问，减少敏感数据被错误转发给其他客户端的风险。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "Apache HTTP Server mod_cgid CGI重定向路径信息泄漏漏洞"
updated = "2026-06-16T22:02:50Z"

