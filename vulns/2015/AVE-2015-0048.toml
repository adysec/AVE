[basic]
description = "Elasticsearch 1.6.1 之前版本中存在目录遍历漏洞（CWE-22），远程攻击者可通过向受影响版本的 Elasticsearch 集群发送特制的快照（Snapshot）API 请求，利用路径遍历技术突破目录限制，读取服务器上任意文件。该漏洞无需身份认证即可利用，攻击复杂度低，仅需网络可达即可触发。攻击者可读取系统敏感文件（如配置文件、密钥等），导致敏感信息泄露。官方已在 1.6.1 版本中修复此漏洞。"
published = "2015-08-17T15:59:02Z"
remediation = "立即升级 Elasticsearch 至 1.6.1 或更高版本。如无法立即升级，可在反向代理层限制对 _snapshot API 的访问，仅允许可信 IP 调用该接口，并禁用不必要的 snapshot 仓库配置。"
score = 5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Elasticsearch 目录遍历与任意文件读取漏洞"
updated = "2026-06-17T00:29:17Z"

