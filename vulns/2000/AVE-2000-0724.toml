[basic]
description = "Intel InBusiness eMail Station 1.04.87 的 POP 服务存在缓冲区溢出漏洞，远程攻击者可通过向该服务发送超长的用户名参数触发缓冲区溢出，导致服务崩溃拒绝服务，甚至可能执行任意命令。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响邮件服务的可用性。"
published = "2000-12-19T05:00:00.000"
remediation = "Intel InBusiness eMail Station已停止技术支持，建议更换为受支持的邮件服务器设备。如无法立即更换，可在网络边界防火墙限制对TCP 110端口的访问，仅允许可信IP连接，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Intel InBusiness eMail Station 1.4.87 POP服务缓冲区溢出漏洞"
updated = "2026-06-16T21:52:55.287"

