[basic]
description = "Sun SunPCi II VNC 软件 2.3 版本使用弱认证方案，远程攻击者可通过嗅探网络流量捕获随机字节挑战（challenge），该挑战被直接用作加密通信的密钥，从而破解并获取 VNC 密码。攻击者无需身份认证即可远程实施嗅探攻击，成功后可完全控制受影响的 VNC 服务，进而访问目标系统。该漏洞影响 Sun SunPCi II VNC 2.3 版本，CVSS 评分 7.5，危害等级高。目前已公开利用代码（ExploitDB ID: 21592），建议用户升级到修复版本或采用更强认证机制。"
published = "2002-10-04T04:00:00.000"
remediation = "SunPCi II VNC 2.3 已停止维护，Oracle（原 Sun）不再提供安全补丁。建议立即停用 SunPCi II VNC 2.3，迁移至支持加密认证的现代 VNC 方案（如 TigerVNC 或 TightVNC），并启用 TLS/SSH 隧道加密所有 VNC 通信。如无法立即迁移，可在防火墙层面将 VNC 端口（默认 5900）限制为仅允许受信任 IP 访问，同时通过 SSH 端口转发（`ssh -L 5900:localhost:5900 user@host`）替代直连，避免密码在网络上明文传输。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Sun SunPCi II VNC 弱认证密码泄露漏洞"
updated = "2026-06-16T21:58:31.863"

