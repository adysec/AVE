[basic]
description = "Pterodactyl Wings 服务端控制面板的 egg 配置文件模板引擎存在敏感信息泄露漏洞。低权限用户（如服务器所有者或具有 startup.update 权限的子用户）可在 egg 变量值中注入 `{{config.*}}` 占位符，当 Panel 将用户可控的变量值发送至 Wings 渲染配置文件时，该占位符会被解析为完整的守护进程配置，导致节点 daemon token、token_id 及 Docker 容器注册表凭据等敏感信息被写入用户服务器文件并可被读取。攻击者利用泄露的 daemon token 可伪造认证令牌，进而完全控制该节点上的所有服务器，实现从低权限账户到整节点沦陷的权限提升。该漏洞 CVSS 评分 9.9，危害等级严重，影响所有使用用户可编辑 egg 变量的多租户/共享托管部署环境。Wings v1.12.3 版本已修复此问题，修复后模板引擎仅暴露非敏感的网络接口配置子集。"
published = "2026-07-31T17:16:33Z"
remediation = "立即将 Wings 升级至 v1.12.3 或更高版本；升级后进入管理后台 Nodes → Configuration，重置受影响节点的 daemon token 并重新部署 config.yml 至节点。如无法立即升级，审计所有 egg 配置，确保无用户可编辑变量被渲染到配置文件中，或将该类变量设为不可编辑。"
score = 9.9
severity = "CRITICAL"
sources = ["ghsa"]
title = "Pterodactyl Wings 守护进程配置模板注入致敏感信息泄露漏洞"
updated = "2026-07-31T20:16:51Z"

