[basic]
description = "WebKit（Apple Safari 浏览器使用的渲染引擎）在处理 HTTP 重定向时存在设计缺陷。当用户通过 Safari 浏览器提交表单时，WebKit 会跟随多个重定向跳转，导致表单数据（如用户名、密码等敏感信息）被发送到中间的重定向服务器。攻击者可通过构造恶意的重定向链，在用户不知情的情况下截获提交的表单数据，造成信息泄露。该漏洞影响 Mac OS X 10.4 至 10.6 及 Windows 平台上的 Safari 5.0 以下版本（Mac OS X 10.4 上为 4.1 以下版本），CVSS 评分 4.3，危害等级中危。用户需升级至 Safari 5.0 或 4.1 及以上版本修复此漏洞。"
published = "2010-06-11T19:30:20Z"
remediation = "升级 Apple Safari 至 5.0 或更高版本（Mac OS X 10.5~10.6/Windows）或 4.1 或更高版本（Mac OS X 10.4）；Linux 用户更新 webkit 包至修复版本（参考 USN-1006-1）。无法升级时，避免在不可信站点提交表单数据。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari WebKit 表单重定向信息泄露漏洞"
updated = "2026-06-16T23:19:16Z"

