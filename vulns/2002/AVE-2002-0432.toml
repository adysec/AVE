[basic]
description = "OpenOffice 1.0.1 安装过程中存在不安全的临时文件处理漏洞，本地攻击者可通过符号链接攻击利用 `USERNAME_autoresponse.conf` 临时文件，在目标系统上覆盖任意文件并可能提升权限。攻击条件为攻击者拥有本地访问权限，利用难度较高（需预测临时文件名及时间窗口），但一旦成功可导致机密性、完整性和可用性完全丧失。建议升级至更高版本或确保临时目录权限配置正确。"
published = "2002-12-31T05:00:00Z"
remediation = "升级到 OpenOffice 1.1.0 或更高版本，该版本修复了安装过程中临时文件的不安全创建问题。如无法升级，安装前确保临时目录（/tmp）无其他用户写入的恶意符号链接，或以非特权用户身份执行安装。当前建议迁移至 Apache OpenOffice 4.x 或 LibreOffice 系列以获得持续安全支持。"
score = 6.2
severity = "MEDIUM"
sources = ["redhat"]
title = "OpenOffice 1.0.1 安装临时文件符号链接本地权限提升漏洞"
updated = "2026-06-16T22:00:51Z"

