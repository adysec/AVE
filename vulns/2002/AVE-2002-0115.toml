[basic]
description = "Bugzilla 2.14.1 之前版本在使用 LDAP 认证时存在安全漏洞。当远程攻击者向目标 Bugzilla 系统的 LDAP 认证接口发送不包含密码字段的请求时，系统会向 LDAP 服务器发送空密码进行绑定认证，导致攻击者能够以匿名身份成功绑定 LDAP 服务器，从而绕过身份验证机制。攻击者无需任何认证凭据即可通过网络远程利用该漏洞，获取系统未授权访问权限，可能导致敏感信息泄露、数据篡改等严重后果。CVSS 评分 10.0，危害等级严重。建议升级至 Bugzilla 2.14.1 或更高版本以修复此漏洞。"
published = "2002-01-31T05:00:00.000"
remediation = "立即将 Bugzilla 升级至 2.14.1 或更高版本，该版本修复了 LDAP 认证过程中空密码导致匿名绑定的问题。如无法升级，可在 LDAP 服务器端配置禁止匿名绑定（设置 `nsslapd-allow-anonymous-access off`），并在 Bugzilla 配置中强制要求 LDAP 认证密码字段非空校验。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "Bugzilla LDAP认证绕过漏洞"
updated = "2026-06-16T21:56:34.833"

