[basic]
description = "WebKit 引擎在处理特定网页内容时存在内存破坏漏洞。未经身份认证的远程攻击者可通过诱导用户访问一个精心构造的恶意网站，利用 WebKit 内存管理缺陷触发内存损坏，从而在受害者设备上执行任意代码或导致应用程序崩溃（拒绝服务）。该漏洞影响 iOS 5.1 之前版本及 iTunes 10.6 之前版本的浏览器组件，CVSS 评分 9.3，具有极高的安全风险。"
published = "2012-03-08T22:55:01Z"
remediation = "建议将 Apple iOS 系统升级至 5.1 或更高版本，并将 iTunes 升级至 10.6 或更高版本。对于无法立即更新的用户，建议避免使用 Safari 浏览器访问来源不明或不可信的第三方网页，以降低远程代码执行的风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存损坏远程代码执行漏洞"
updated = "2026-06-16T23:32:09Z"

