[basic]
description = 'kmMail 1.0、1.0a 和 1.0b 版本存在跨站脚本（XSS）漏洞，由于程序未对邮件内容中的 HTML 标签及属性进行充分过滤，未经身份认证的远程攻击者可在邮件正文中嵌入恶意 JavaScript 脚本或 HTML 代码。攻击者可利用诸如 "b" 等被视为安全的 HTML 标签的 onmouseover 等事件属性，或直接在邮件主题（Subject）字段中注入脚本。当受害者使用 kmMail 客户端打开包含恶意内容的邮件时，注入的脚本将在客户端浏览器上下文中执行，从而盗取会话 Cookie、重定向用户至恶意站点或篡改邮件内容。该漏洞影响 kmMail 1.0 至 1.0b 所有版本，CVSS v2 评分为 4.3，攻击复杂度中等，仅需网络可达即可利用。'
published = "2002-12-31T05:00:00Z"
remediation = "立即升级 kmMail 至已修复该漏洞的后续版本，或手动修改 PHP 源码：在打印邮件主题字段处使用 htmlspecialchars() 函数对 Subject 内容进行 HTML 实体编码，同时剥离 b 等 HTML 标签中的 onmouseover 等事件属性。若无法及时打补丁，建议临时禁用邮件主题 HTML 渲染功能，仅以纯文本格式显示邮件主题，直至完成版本升级。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "kmMail 1.0/1.0a/1.0b 电子邮件客户端 跨站脚本攻击漏洞"
updated = "2026-06-16T22:00:22Z"

