[basic]
description = "Adobe Flash Player 10.2.152.26 之前版本存在不可信搜索路径漏洞（DLL劫持）。当用户通过浏览器打开包含恶意 DLL 文件的目录时，Flash Player 会优先加载当前工作目录中的特制 DLL 文件，而非系统目录中的合法库文件。本地攻击者可通过将构造的恶意 DLL 放置在目标目录中，诱使用户在该目录下打开 Flash 内容，从而以当前用户权限执行任意代码。该漏洞影响 Windows 平台上的 Adobe Flash Player 10.2.152.26 之前所有版本，CVSS 评分 6.9，危害等级中危。"
published = "2011-02-10T16:00:32Z"
remediation = '升级 Adobe Flash Player 至 10.2.152.26 或更高版本。对于无法升级的环境，移除当前工作目录中不可信的 DLL 文件，并设置环境变量限制 DLL 搜索路径（如使用 SetDllDirectory 或修改注册表 HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Session Manager\SafeDllSearchMode 为 1）。'
score = 6.9
severity = "MEDIUM"
sources = ["tenable"]
title = "Adobe Flash Player 不可信搜索路径权限提升漏洞"
updated = "2026-06-16T23:27:40Z"

