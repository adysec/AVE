[basic]
description = "tags.<value>GIGABYTE APP Center v1.05.21及更早版本、AORUS GRAPHICS ENGINE 1.57之前版本、XTREME GAMING ENGINE 1.26之前版本以及OC GURU II v2.08中的GPCIDrv和GDrv底层驱动程序暴露了读写IO端口的功能。攻击者可利用此漏洞向目标系统发送特制的数据，通过IO端口读写操作实现权限提升，最终在目标设备上执行任意代码。该漏洞影响上述所有GIGABYTE产品版本，CVSS评分为7.8（高危），攻击条件为攻击者需具备对目标系统的本地访问权限或已获得一定级别的系统访问。GIGABYTE已发布更新版本修复此漏洞，用户应升级至最新版本以消除风险。"
published = "2018-12-21T23:29:00Z"
remediation = "立即升级GIGABYTE APP Center至v1.05.22或更高版本，AORUS GRAPHICS ENGINE至v1.57或更高版本，XTREME GAMING ENGINE至v1.26或更高版本，OC GURU II至v2.09或更高版本。若无法立即升级，可禁用GPCIDrv和GDrv驱动的IO端口访问权限作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "GIGABYTE 驱动程序 IO端口读写漏洞"
updated = "2026-06-17T01:49:07Z"

