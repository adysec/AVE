[basic]
description = 'EZshopper 3.0 及 2.0 版本的 loadpage.cgi CGI 程序存在目录遍历漏洞。远程攻击者无需身份认证即可通过向 file 参数中的目标文件名前插入 "/" 字符，绕过路径限制，实现读取 EZshopper 数据目录中的任意文件，导致敏感信息泄露。该漏洞攻击复杂度低，仅需构造特制 HTTP 请求即可利用，影响运行 EZshopper 2.0 和 3.0 的 Web 服务器。'
published = "2001-01-09T05:00:00Z"
remediation = "该产品（AHG EZshopper 2.0/3.0）已停止维护且厂商已不存在，无法通过官方补丁修复。建议立即停止使用 EZshopper，迁移至仍在维护的电子商务平台（如 Magento、WooCommerce 等）。如无法立即替换，可在 Web 服务器（Apache/Nginx）层面配置重写规则，拦截对 loadpage.cgi 的请求并返回 403；同时删除或禁用 loadpage.cgi 脚本，并对 CGI 参数中的路径遍历字符（../、/）进行严格过滤。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "alex heiphetz Group EZshopper 目录遍历漏洞"
updated = "2026-06-16T21:53:07Z"

