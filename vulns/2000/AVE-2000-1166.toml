[basic]
description = "AnyPortal(php) 22 APR 00 之前版本中的 siteman.php3 存在未指明信息泄露漏洞，远程攻击者可通过未知攻击向量利用该漏洞，导致系统绝对路径等敏感信息被泄露。该漏洞影响 AnyPortal(php) 22 APR 00 之前的所有版本，攻击者无需身份认证即可远程触发，危害等级中危。由于官方未公开具体攻击向量细节，实际利用方式尚不明确，但路径泄露可为后续攻击提供侦察信息。"
published = "2000-12-31T05:00:00Z"
remediation = "立即升级 AnyPortal(php) 至 2000 年 4 月 22 日之后的最新版本，该版本已修复 siteman.php3 泄露绝对路径的问题。由于 AnyPortal(php) 项目已长期停止维护，建议迁移至其他仍在活跃开发的 PHP 门户系统（如 Drupal 或 Joomla）。如无法立即升级，可在 Web 服务器（Apache/Nginx）配置中对 siteman.php3 添加访问控制，仅允许可信 IP 访问，或直接删除该文件以彻底消除信息泄露风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "AnyPortal PHP siteman.php3 路径信息泄露漏洞"
updated = "2026-06-16T21:53:26Z"

