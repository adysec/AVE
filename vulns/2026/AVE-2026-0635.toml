[basic]
description = "Craft CMS 5.0.0-RC1 至 5.9.22 版本的控制面板中存在存储型跨站脚本（XSS）漏洞。具有 Author 角色的用户可在条目标题中存储恶意的 JavaScript 载荷，当管理员或其他具有相同 Structure 板块 saveEntries 权限的用户在表格视图下将另一条目拖拽至被污染的条目下方时，载荷会在受害者会话中执行。漏洞根因在于服务端将标题转义到 data-title 属性后，浏览器解码该属性，jQuery 的 .data('title') 读取到解码后的值，随后该值未经 HTML 转义直接拼接到新 HTML 字符串中。攻击者需拥有控制面板账户（最低 Author 角色），受害者需执行拖拽操作且会话处于提升权限状态。该漏洞已在 5.9.23 版本中修复。"
published = "2026-07-01T22:16:50Z"
remediation = "立即升级 Craft CMS 至 5.9.23 或更高版本，该版本已修复 ElementTableSorter.js 中 data-title 属性值未转义即拼接至 HTML 的问题。如无法立即升级，可暂时限制 Author 角色用户的 createEntries 和 saveEntries 权限，或避免在 Table 视图下拖拽条目。"
score = 5.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "Craft CMS 后台表格视图存储型跨站脚本漏洞"
updated = "2026-07-02T16:16:33Z"

