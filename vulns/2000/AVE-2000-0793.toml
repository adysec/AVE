[basic]
description = "Paul Vixie 开发的 crontab 工具在处理 `crontab -e` 编辑任务时，使用可预测的临时文件名，且未正确验证临时文件的所有权归属。具有 crontab 缓冲池目录写入权限的本地攻击者，可在受害者编辑 crontab 文件期间，创建全局可写的临时文件并篡改其内容，从而注入恶意命令并以受害者权限执行，实现本地权限提升。该漏洞影响使用 vixie-cron 的系统，CVSS 评分 3.7，危害等级低。"
published = "2001-01-09T05:00:00.000"
remediation = "升级 vixie-cron 至 3.0pl1-74 或更高版本，或使用发行版官方安全更新修复临时文件竞争条件。若无法立即升级，应将 /var/spool/cron 目录权限设置为 755 并确保仅 root 用户具有写权限，同时设置 umask 077 防止临时文件被其他用户访问。建议禁止非特权用户使用 crontab 命令，或改用 cronie 等替代实现。"
score = 3.7
severity = "LOW"
sources = ["epss"]
title = "Paul Vixie crontab 本地权限提升漏洞"
updated = "2026-06-16T21:53:08.263"

