[basic]
description = "Apple Mac OS X 10.7.3 之前版本的 OpenGL 实现中存在内存破坏漏洞。该漏洞源于 OpenGL 着色语言（GLSL）编译过程未正确处理特制程序，远程攻击者可通过诱导用户访问包含恶意 GLSL 着色器的网页或打开特制媒体文件，触发内存损坏，导致目标系统应用程序崩溃或执行任意代码。CVSS 评分 7.5，危害等级高。Apple 已在 Mac OS X 10.7.3 更新中修复此漏洞。"
published = "2012-02-02T18:55:01Z"
remediation = "将 Apple Mac OS X 升级至 10.7.3 或更高版本（通过 Software Update 或从 Apple 支持网站下载组合更新），该版本修复了 OpenGL 着色语言编译中的内存破坏问题。对于 iOS 设备，升级至 iOS 6.0 或更高版本。如无法立即升级，可配置应用程序沙箱限制 OpenGL 程序的加载来源，并避免在受影响系统上处理来自不可信来源的 3D 渲染内容。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Apple Mac OS X OpenGL GLSL 编译内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:33:19Z"

