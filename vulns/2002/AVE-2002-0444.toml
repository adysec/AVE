[basic]
description = "Critical Path InJoin Directory Server 4.0 的 iCon 管理 Web 服务器存在跨站脚本（XSS）漏洞。远程攻击者无需身份认证即可通过向管理员 URL 中的 LOCID 或 OC 参数注入恶意脚本代码，当管理员访问特制链接时脚本将在管理员浏览器中执行，导致敏感信息泄露、会话劫持或权限提升。该漏洞影响 Critical Path InJoin Directory Server 4.0 版本，CVSS 评分 7.5，危害等级高。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 Critical Path InJoin Directory Server 至厂商提供的最新补丁版本；如已无官方支持，应立即迁移至仍在维护的目录服务器产品。临时缓解措施：在 iCon 管理 Web 服务器中对 LOCID 和 OC 参数实施严格的输入验证与输出编码，禁止在管理 URL 中直接传递未过滤的用户输入。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Critical Path InJoin Directory Server 4.0 跨站脚本漏洞"
updated = "2026-06-16T21:58:08Z"

