[basic]
description = "Microsoft Windows 95、Windows 98 和 Windows NT 4.0 的 ARP 协议实现存在缺陷，未正确验证接收到的 ARP 数据包来源真实性。远程未认证攻击者可向目标主机发送伪造的 ARP 回复包，覆盖系统 ARP 缓存表中的静态条目，导致 ARP 缓存投毒。攻击者可利用此漏洞实施中间人攻击、流量劫持或会话劫持，破坏网络通信完整性。该漏洞影响 Windows 95、98 及 NT 4.0 系统，CVSS 评分 5.0（中等危害），攻击复杂度低、无需认证、仅影响完整性。Microsoft 已发布补丁修复此漏洞，建议升级至修复版本或配置静态 ARP 条目防护。"
published = "2000-06-29T04:00:00.000"
remediation = "Windows 95、Windows 98 及 Windows NT 4.0 目前均已停止支持，Microsoft 未针对此漏洞发布专门补丁，建议通过以下方式修复：将受影响的系统升级至受支持的 Microsoft Windows 版本（如 Windows 10/11 或 Windows Server 2019/2022 及以上版本）；在现有受支持系统上启用动态 ARP 检测（DAI, Dynamic ARP Inspection）功能以阻止伪造 ARP 报文；在交换机和路由器上启用端口安全（Port Security）特性，将每个端口的 MAC 地址数量限制为合法主机数量；在网络边界防火墙和路由器上配置静态 ARP 条目绑定关键网关和服务器 IP 与 MAC 地址映射，防止 ARP 缓存表被篡改；对跨 VLAN 通信启用严格的 ACL 访问控制，限制仅允许必要的 ARP 流量通过；在网关上启用 ARP 报文来源验证功能，丢弃外部到达的 ARP 回复报文。对于无法立即升级的 Windows NT 4.0 核心服务器，应在物理网络层面实施 VLAN 隔离和端口绑定，并通过静态 ARP 绑定网关 MAC 地址作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows 9x/NT 4.0 ARP欺骗漏洞"
updated = "2026-06-16T21:52:06.560"

