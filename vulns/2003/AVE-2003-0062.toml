[basic]
description = "CUPS（Common Unix Printing System）1.1.19 之前版本存在拒绝服务漏洞。远程攻击者可通过向 IPP 端口（631）发送部分打印请求，由于服务端未对该类不完整请求设置超时机制，导致连接被长期占用，最终耗尽系统资源造成拒绝服务。攻击无需身份认证，攻击复杂度低，影响运行 CUPS 的各类 Unix/Linux 系统。"
published = "2003-06-16T04:00:00.000"
remediation = "升级 CUPS 至 1.1.19 或更高版本。Red Hat 用户安装 RHSA-2003:171 提供的更新包，Debian 用户应用 DSA-317 安全更新。如无法升级，可在防火墙上限制对 631/TCP 端口的访问，仅允许受信任 IP 连接，或禁用 CUPS 的远程 IPP 打印功能。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "CUPS IPP 部分请求超时拒绝服务漏洞"
updated = "2026-06-16T22:01:43.877"

