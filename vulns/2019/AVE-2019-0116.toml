[basic]
description = "tags.<value>WordPress OneTone主题（最高至3.0.6版本）及OneTone Companion插件（最高至1.1.1版本）中的includes/theme-functions.php文件存在未授权选项修改漏洞。该文件在处理主题功能时缺少权限校验机制，未经身份认证的远程攻击者可以通过向目标WordPress站点发送特制的HTTP请求，直接触发theme-functions.php中的选项更新功能，在无需登录后台或获取管理员凭据的情况下篡改站点配置选项。该漏洞影响所有使用受影响版本OneTone主题及插件的WordPress站点，攻击者可利用此漏洞修改主题设置、404页面消息等内容，通过注入恶意JavaScript代码实现存储型跨站脚本攻击（XSS），进而窃取管理员Cookie、篡改网站内容或重定向用户至恶意站点。攻击条件为目标站点运行受影响的OneTone主题或插件版本，攻击者只需构造包含待修改选项名称及值的HTTP POST请求发送至目标站点即可触发漏洞，无需任何认证凭据且无需用户交互。"
published = "2020-04-03T15:15:14Z"
remediation = "立即升级 OneTone 主题至 3.0.7 或更高版本；若无法升级（该主题已停止维护），建议更换为官方维护的其他 WordPress 主题（如 Twenty Twenty-Four 等）。临时缓解：在 Web 应用防火墙（WAF）层面拦截含 action=onetone_options_import 的 POST 请求，或在 wp-admin/admin-ajax.php 添加访问限制。同时检查并清理被篡改的 404 页面内容及其他主题选项。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress OneTone主题 未授权选项修改漏洞"
updated = "2026-06-17T02:23:31Z"

