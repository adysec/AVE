[basic]
description = "SonicWall Email Security 10.0.9.x 存在文件上传漏洞，由于应用程序未对用户上传的文件类型及内容进行严格限制与校验，已通过身份认证的攻击者可以利用该漏洞向远程主机上传任意危险类型文件。攻击者成功利用后可在服务器上执行恶意代码、获取敏感信息或进一步控制目标系统。该漏洞影响 SonicWall Email Security 10.0.9.x 版本，攻击者需拥有有效账户凭证才能发起利用，但一旦利用成功将导致服务器完全失陷，危害等级高。"
published = "2021-04-09T18:15:13.460"
remediation = "将 SonicWall Email Security 软件升级至 10.0.9.6103 或更高版本，Hosted Email Security 升级至 10.0.9.6103 或更高版本，Email Security Virtual Appliance 升级至 10.0.9.6105 或更高版本，以修复未经身份验证者可上传危险类型文件导致任意代码执行的安全漏洞。升级前请参考官方公告 SNWLID-2021-0008 获取完整补丁下载链接及安装说明，并在管理控制台中确认版本号已更新至安全版本。"
score = 7.2
severity = "HIGH"
sources = ["kev"]
title = "SonicWall Email Security 身份验证后未限制文件上传漏洞"
updated = "2026-06-17T03:33:09.610"

