[basic]
description = "LogWatch 2.5 之前版本存在不安全的临时目录创建漏洞。本地攻击者可通过在 LogWatch 处理日志时对临时目录实施符号链接（symlink）攻击，利用该漏洞以运行 LogWatch 进程的用户权限执行任意代码或覆盖系统文件。攻击条件为拥有本地系统访问权限，无需身份认证即可触发。该漏洞影响 LogWatch 2.5 之前的所有版本，CVSS 评分 6.2，危害等级中危。"
published = "2002-03-27T05:00:00.000"
remediation = "升级 LogWatch 至 2.5 或更高版本，该版本已修复临时目录的不安全创建方式。如无法升级，可手动设置 umask 077 并确保 logwatch 临时目录（通常为 /tmp/logwatch）的属主为 root，且不允许其他用户写入；同时建议使用 `sticky` 位或配置 logwatch 使用安全临时目录（如 `TMPDIR=/var/tmp/logwatch`）。"
score = 6.2
severity = "MEDIUM"
sources = ["redhat"]
title = "LogWatch 不安全的临时目录创建漏洞"
updated = "2026-06-16T21:56:54.870"

