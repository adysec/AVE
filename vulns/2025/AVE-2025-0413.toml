[basic]
description = "Google Chrome 132.0.6834.159 之前版本的开发者工具（DevTools）中存在释放后使用（Use After Free）漏洞。远程攻击者可通过诱使用户安装特制的恶意 Chrome 扩展程序，利用该漏洞触发堆内存损坏，导致任意代码执行或拒绝服务。该漏洞影响所有使用 Chromium 内核的浏览器，CVSS 评分 8.8，危害等级高。用户需升级至 Chrome 132.0.6834.159 或更高版本以修复此漏洞。"
published = "2025-01-29T11:15:09Z"
remediation = "立即升级 Google Chrome 至 132.0.6834.159 或更高版本，可通过 Chrome 设置 > 关于 Chrome > 自动检查更新完成升级。基于 Chromium 的浏览器（如 Edge、Brave 等）需同步更新至对应修复版本。如无法立即升级，可在浏览器设置中禁用或限制第三方扩展程序以降低利用风险。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome DevTools 释放后使用漏洞"
updated = "2026-06-17T08:27:06Z"

