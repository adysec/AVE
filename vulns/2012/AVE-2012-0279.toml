[basic]
description = "Apple Safari 浏览器所采用的 WebKit 渲染引擎存在内存破坏漏洞，远程攻击者可通过构造恶意网页向目标系统发送特制内容，触发 WebKit 内存管理中的越界访问或释放后重用，进而导致应用程序崩溃或执行任意远程代码。该漏洞影响 Apple Safari 6.0 之前的所有版本，攻击者无需身份认证即可通过网络远程发起攻击，攻击复杂度中等，成功利用后可完全控制用户系统。攻击条件为受害者使用存在漏洞的 Safari 版本访问攻击者控制的恶意网站页面。Apple 已在 2012 年 7 月发布的安全更新中修复此漏洞，建议用户升级至 Safari 6.0 或更高版本以消除风险。"
published = "2012-07-25T20:55:02.273"
remediation = "Mac 用户应立即升级 Safari 至 6.0 或更高版本（OS X Lion 及更早系统可通过软件更新安装 Safari 6.0，或升级至 OS X Mountain Lion 10.8）；iOS 用户应将设备升级至 iOS 6.0 或更高版本；Windows 用户需将 iTunes 升级至 10.7 或更高版本。临时缓解措施：避免点击未知来源链接，不访问恶意网站，并启用 Safari 安全浏览功能。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:33.507"

