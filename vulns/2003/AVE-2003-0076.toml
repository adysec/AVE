[basic]
description = 'UnZip 5.50 存在目录遍历漏洞，攻击者可通过在压缩文件名中构造两个点号之间的特殊编码字符，绕过过滤机制生成".."序列实现目录跳转，从而在解压过程中将恶意文件写入任意路径，覆盖目标系统上的任意文件。该漏洞利用条件简单，仅需诱导用户解压特制 ZIP 文件即可触发，影响 Info-ZIP UnZip 5.50 及可能更早版本。'
published = "2003-06-16T04:00:00Z"
remediation = "将 UnZip 升级至 5.51 或更高版本。各发行版对应操作：Debian 安装 unzip 5.50-9 以上版本；Red Hat 安装 RHSA-2003:199 提供的更新包；Mandriva 安装 MDKSA-2003:073 更新。如无法升级，避免使用 unzip 解压不可信来源的 ZIP 文件，改用 bsdtar 等替代工具处理压缩包。"
score = 2.6
severity = "LOW"
sources = ["redhat"]
title = "Info-ZIP UnZip 5.50 目录遍历漏洞"
updated = "2026-06-16T22:01:54Z"

