[basic]
description = "Zoho ManageEngine Netflow Analyzer、Network Configuration Manager、OpManager、OpUtils 及 Firewall Analyzer 等多款产品存在反射型跨站脚本攻击（XSS）漏洞。未经身份认证的远程攻击者可通过向目标系统发送包含恶意脚本的请求，将攻击载荷注入到`operation`参数并传递给`/servlet/com.adventnet.me.opmanager.servlet.FailOverHelperServlet`路径，当管理员访问该恶意链接时，脚本会在其浏览器上下文中执行。该漏洞影响 Netflow Analyzer 123137 版本之前、Network Configuration Manager 123128 版本之前、OpManager 123148 版本之前、OpUtils 123161 版本之前以及 Firewall Analyzer 123147 版本之前的全部受影响实例，攻击者可借此窃取会话令牌、执行未经授权的管理操作或篡改页面内容，CVSS 评分 6.1，危害等级为中危。"
published = "2018-06-29T12:29:00Z"
remediation = "建议立即升级受影响产品至安全版本：Netflow Analyzer 升级至 build 123137 及以上，Network Configuration Manager 升级至 build 123128 及以上，OpManager 升级至 build 123148 及以上，OpUtils 升级至 build 123161 及以上，Firewall Analyzer 升级至 build 123147 及以上。如无法立即升级，可在 Web 服务器或前端 WAF 中过滤 /servlet/com.adventnet.me.opmanager.servlet.FailOverHelperServlet 路径下 operation 参数中的 &lt;script&gt;、onerror 等恶意字符，或暂时限制该 servlet 的外网访问权限作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Zoho ManageEngine Netflow Analyzer 反射型跨站脚本攻击漏洞"
updated = "2026-06-17T01:38:40Z"

