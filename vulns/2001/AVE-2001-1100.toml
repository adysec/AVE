[basic]
description = "mars_nwe 0.99.pl19 存在格式化字符串漏洞。远程攻击者无需身份验证即可通过向目标服务发送包含格式化字符串特殊字符（如 %s、%x、%n）的恶意消息，利用该漏洞在目标系统上执行任意命令。该漏洞影响 mars_nwe 0.99.pl19 及更早版本，CVSS 评分为 10（严重），攻击复杂度低且无需认证。攻击者可通过 IRC 协议向运行 mars_nwe 服务的服务器发送特制消息，触发格式化字符串漏洞从而实现远程代码执行。"
published = "2001-05-03T04:00:00.000"
remediation = "立即卸载或停止运行 mars_nwe 0.99.pl19 服务，该版本已无官方修复补丁。若业务必须依赖此服务，请升级至 FreeBSD 官方在 2001 年 2 月安全公告中发布的修补版本，或迁移至当前维护的 Web 服务器软件（如 Apache 或 nginx）。在卸载前，可在防火墙层面限制对该服务的网络访问，仅允许可信 IP 连接，作为临时缓解措施。同时检查服务器日志，确认是否存在利用该漏洞的未授权访问痕迹。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "mars_nwe 格式化字符串远程代码执行漏洞"
updated = "2026-06-16T21:53:54.220"

