[basic]
description = "Fastjson 1.2.24及之前版本中的 parseObject 方法存在反序列化安全漏洞。攻击者可通过向目标服务器发送特制的 JSON 请求，在 dataSourceName 字段中构造恶意的 rmi:// URI，触发 autoType 机制加载恶意类，从而在未经身份认证的情况下实现远程代码执行。该漏洞影响所有使用 Fastjson 1.2.24 及更早版本的产品（包括 Pippo 1.11.0 等），CVSS 评分 9.8，危害等级严重。"
published = "2018-10-23T20:29:00Z"
remediation = "立即升级 Fastjson 至 1.2.25 或更高版本，该版本引入了 autoType 白名单安全机制，可有效防御反序列化攻击。如无法升级，可启用 safeMode（ParserConfig.getGlobalInstance().setSafeMode(true)）或通过 JVM 参数 -Dfastjson.parser.autoTypeSupport=false 禁用 autoType 功能，并在代码中调用 ParserConfig.getGlobalInstance().setAutoTypeSupport(false) 关闭自动类型解析。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "阿里巴巴 Fastjson 反序列化远程代码执行漏洞"
updated = "2026-06-17T01:12:39Z"

