[basic]
description = "Google Chrome V8 JavaScript 引擎存在整数溢出漏洞（CWE-190），远程攻击者可构造特制的 HTML 页面诱导用户访问，触发 V8 引擎在处理数组操作时的整数溢出，导致堆内存破坏。成功利用该漏洞可实现任意代码执行，完全控制目标系统。该漏洞影响 Chrome 140.0.7339.207 之前版本及基于 Chromium 的 Microsoft Edge、Fedora 等衍生软件，CVSS 评分 8.8，危害等级高。用户需升级至 Chrome 140.0.7339.207 或更高版本修复。"
published = "2025-09-24T17:15:39Z"
remediation = "立即将 Google Chrome 升级至 140.0.7339.207 及以上版本（通过设置→关于 Chrome→自动检查更新）；Microsoft Edge 用户升级至 140.0.3485.94 及以上版本；基于 Chromium 的第三方浏览器（如 Opera、Brave）请跟进厂商更新。Linux 发行版用户（如 Fedora）执行包管理器更新至 chromium 140.0.7339.207。无法立即升级时，可启用 Chrome 的站点隔离（Site Isolation）功能并禁用 V8 JIT（通过 --jitless 启动参数）作为临时缓解。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 整型溢出漏洞"
updated = "2026-06-17T08:29:13Z"

