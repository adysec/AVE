[info]
author = "AVE"
description = "检测 Ghostscript -dSAFER 模式下 file 操作符绕过漏洞。通过构造恶意 PostScript 文件，利用 file 操作符读取系统敏感文件（如 /etc/passwd），验证是否存在安全模式绕过。"
id = "POC-AVE-2001-0486"
name = "CVE-2001-1353 PoC"
severity = "low"
tags = [
    "cve-2001-1353",
    "ghostscript",
    "dsafer-bypass",
]
vuln_id = [
    "CVE-2001-1353",
    "AVE-2001-0486",
]

[poc]
logic = "any"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
