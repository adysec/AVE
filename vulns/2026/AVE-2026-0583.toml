[basic]
description = "OpenRemote 的 UserResourceImpl 中存在跨域（Cross-Realm）用户信息泄露漏洞。该组件的三个 REST API 读取端点（获取用户资料、获取客户端角色、获取域角色）在权限校验时仅检查调用者是否持有 read:admin 角色，但未验证目标用户是否属于调用者所在的域（realm）。已通过身份认证的任意租户域管理员可远程利用此缺陷，通过构造包含其他域（包括 master 域）用户 UUID 的 API 请求路径，越权读取跨租户用户的个人资料、客户端角色和域角色等敏感信息。该漏洞破坏了多租户部署环境下的域隔离机制，导致跨租户用户枚举和权限信息泄露，影响 OpenRemote 多租户部署场景。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级 OpenRemote 至 1.24.2 或更高版本，该版本已在 UserResourceImpl.java 的 get()、getUserClientRoles()、getUserRealmRoles() 三个读方法中增加了 throwIfCannotAdminRealm(realm) 跨域检查。如无法立即升级，可在反向代理层对 /api/{realm}/user/{realm2}/ 路径模式添加访问控制规则，仅允许同 realm 的请求通过，或临时移除受影响租户 admin 账号的 read:admin 角色权限。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "OpenRemote OpenRemote 跨域用户信息泄露漏洞"
updated = "2026-01-01T00:00:00Z"

