[basic]
description = "NETGEAR DGN2200 系列路由器固件版本 10.0.0.50 及更早版本的 ping.cgi 页面存在 OS 命令注入漏洞。远程攻击者可通过向该页面发送特制的 HTTP POST 请求，在 ping_IPAddr 字段中注入 shell 元字符，从而以设备权限执行任意系统命令。该漏洞影响 DGN2200v1/v2/v3/v4 等多个硬件版本，CVSS 评分 9.8，危害等级严重。攻击者无需身份认证即可利用，可完全控制目标设备。目前已有公开的 Exploit-DB 利用代码，建议用户立即升级固件或禁用远程管理功能。"
published = "2017-02-22T23:59:00Z"
remediation = 'NETGEAR 已停止为 DGN2200 系列提供固件更新，建议立即更换为受支持的设备。如无法更换，可在路由器管理界面中禁用"远程管理"功能，并将管理页面仅绑定到内网 IP；在防火墙层面限制对 DGN2200 的 80/443 端口的访问，仅允许受信任的管理 IP 段访问；同时监控 ping.cgi 接口的异常 POST 请求以检测利用行为。'
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "NETGEAR DGN2200 任意命令执行漏洞"
updated = "2026-06-17T01:21:45Z"

