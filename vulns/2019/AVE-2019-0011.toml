[basic]
description = 'Windows 远程桌面服务（RDP）内核驱动 termdd.sys 存在释放后使用（Use-After-Free，CWE-416）漏洞，被称为 "BlueKeep"。未经身份认证的远程攻击者可通过向开放 3389 端口的目标系统发送精心构造的 RDP 协议请求，触发内核内存使用后释放漏洞，导致远程代码执行（RCE），且无需用户交互、无需认证即可在 SYSTEM 权限下执行任意代码。该漏洞影响 Windows 7、Windows Server 2008 R2 等未打补丁的旧版本 Windows 系统，具备蠕虫传播特性（类似 WannaCry），CVSS 3.1 评分 9.8（CRITICAL），属于极高危远程代码执行漏洞。攻击者可利用公开 PoC（如 EternalBlue 风格的 Metasploit 模块、ExploitDB 47683 等）实现无文件落地的内核级代码执行。Microsoft 已于 2019 年 5 月发布安全更新（KB4499180 等）修复该漏洞，并罕见地为已停止支持的 Windows XP/Server 2003 发布补丁。'
published = "2019-05-16T19:29:00Z"
remediation = "立即安装微软 2019 年 5 月安全更新：Windows 7 SP1/Server 2008 R2 安装 KB4499164/KB4499175，Server 2008 安装 KB4499149/KB4499180，XP/Server 2003 安装 KB4500331。启用 RDP 网络级身份验证（NLA）：运行 gpedit.msc → 计算机配置 → 管理模板 → Windows 组件 → 远程桌面服务 → 远程桌面会话主机 → 安全 → 要求用户使用网络级身份验证。防火墙层面封锁 3389 端口对公网开放，仅允许可信 IP 访问。非必要情况下禁用远程桌面服务。启用网络级身份验证（NLA）可作为临时缓解措施阻断未认证攻击。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Microsoft Windows 远程桌面服务 远程代码执行漏洞"
updated = "2026-06-17T02:08:44Z"

