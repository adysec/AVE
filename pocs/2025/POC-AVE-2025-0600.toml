[info]
author = "ave"
description = "验证 Google Chrome（macOS）ANGLE 图形引擎 Metal 后端越界写入漏洞（CWE-787/CWE-119）。通过 WebGL API 设置 GL_UNPACK_IMAGE_HEIGHT 为较小值后上传高度超出分配暂存缓冲区的深度纹理，触发 ANGLE Metal 后端暂存缓冲区大小计算错误导致越界内存写入。影响 Chrome 143.0.7499.110 之前版本及 iOS Safari 26 之前版本，远程攻击者诱导用户访问恶意 HTML 页面即可触发。"
id = "POC-AVE-2025-0600"
name = "CVE-2025-14174 ANGLE Metal OOB Write PoC"
severity = "high"
tags = ["ave-2025-0600"]
vuln_id = [
    "CVE-2025-14174",
    "AVE-2025-0600",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
type = "raw"

[poc.requests.headers]
Content-Type = "text/html"

[[poc.requests.matchers]]
expect = true
status = [
    200,
    201,
]
type = "status"
