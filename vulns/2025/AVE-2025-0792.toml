[basic]
description = "Windows Hyper-V NT Kernel Integration 虚拟服务提供程序（VSP）存在释放后使用（Use-After-Free）漏洞。具有低权限的本地攻击者可利用该漏洞触发已释放内存的访问，导致权限提升至 SYSTEM 级别，从而完全控制受影响系统。该漏洞影响启用了 Hyper-V 角色的 Windows 10/11 及 Windows Server 2022/2025 等版本，CVSS 评分 7.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:58.770"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 (KB5050021)，可通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载。此漏洞为 Hyper-V NT Kernel Integration VSP 中的 Use-After-Free 漏洞，攻击者需拥有本地访问权限，建议同时限制 Hyper-V 主机上的非授权用户登录以降低风险。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Hyper-V NT Kernel Integration VSP 权限提升漏洞"
updated = "2026-06-17T08:43:07.783"

