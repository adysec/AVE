[basic]
description = "Adobe Flash Player 及 Adobe AIR 存在内存破坏漏洞（CWE-119）。由于 Flash Player 在处理特定媒体内容时对内存边界检查不充分，远程攻击者可通过诱导用户访问恶意网页或打开特制文件触发内存破坏，导致任意代码执行或拒绝服务。该漏洞影响 Windows、Mac OS X、Linux 及 Android 平台上的 Flash Player 10.3.183.20 之前版本、11.x 系列特定版本以及 Adobe AIR 3.3.0.3610 之前版本。攻击无需身份认证，但需要用户交互（如点击链接或打开文件），CVSS 评分 9.3，危害等级严重。Adobe 已发布安全更新修复此漏洞。"
published = "2012-06-09T00:55:01.110"
remediation = "将 Adobe Flash Player 升级至 10.3.183.20 或 11.3.300.257（Windows/Mac）、11.2.202.236（Linux）、11.1.111.10（Android 2.x/3.x）、11.1.115.9（Android 4.x），并将 Adobe AIR 升级至 3.3.0.3610。如无法升级，在浏览器中禁用 Flash 插件或使用 Chrome 内置的 PPAPI Flash 沙箱缓解风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏漏洞"
updated = "2026-06-16T23:40:50.510"

