[basic]
description = "tags.<value>Cisco Secure ACS Server 2.4(2)及更早版本的CSAdmin模块存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标系统发送特制的大尺寸数据包触发该漏洞，导致服务拒绝并可能执行任意命令。该漏洞影响Cisco Secure ACS for Windows NT 2.42及更早版本，由于无需认证且攻击向量为网络可达，危害等级极高，CVSS评分为10。"
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 Cisco Secure ACS for Windows NT 至 2.4(3) 或更高版本，该版本修复了 CSAdmin 模块中的缓冲区溢出问题。如无法升级，可在防火墙上限制对 TCP 端口 2002（CSAdmin 默认端口）的访问，仅允许受信任管理 IP 连接。鉴于该产品已停止支持，建议迁移至 Cisco ISE（Identity Services Engine）等受支持的替代方案。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Cisco Secure ACS 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:03.690"

