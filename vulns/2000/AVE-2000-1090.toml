[basic]
description = "Midnight Commander (mc) 4.5.51 及更早版本在处理畸形目录名时存在权限提升漏洞。当用户使用 mc 打开包含特殊字符的目录时，目录名中嵌入的命令会被执行，导致本地攻击者可通过创建包含特殊字符及待执行命令的恶意目录来获取更高权限。该漏洞影响 Midnight Commander 4.5.51 及之前版本，CVSS 评分 4.6，危害等级中危。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 Midnight Commander 至 4.5.51 以上版本，该版本修复了目录名中特殊字符的处理逻辑，避免将目录名内容传递给 shell 执行。Debian 用户可参考 DSA-036 安全公告获取对应发行版的补丁包，SUSE Linux 用户可参考 SuSE-SA:2001:11 公告进行更新。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "GNU Midnight Commander 目录名特殊字符处理不当导致本地权限提升漏洞"
updated = "2026-06-16T21:53:09Z"

