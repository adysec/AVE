[basic]
description = "LibTIFF 3.9.4 的 tiff_getimage.c 中存在多处整数溢出漏洞，当处理特制 TIFF 文件中精心构造的 tile 大小时，gtTileSeparate 和 gtStripSeparate 函数未能正确校验，导致堆缓冲区溢出。远程攻击者可诱使用户打开恶意 TIFF 文件触发该漏洞，实现任意代码执行。该漏洞影响广泛使用 LibTIFF 库的应用和系统，CVSS 评分 6.8，危害等级中危。"
published = "2012-06-04T20:55:03.447"
remediation = "升级 libtiff 库至 3.9.6 及以上版本（或 4.0.1 及以上版本）。Debian/Ubuntu 用户执行 apt-get update && apt-get install libtiff5；Red Hat/CentOS 用户执行 yum update libtiff；也可从官方 Git 仓库（gitlab.com/libtiff/libtiff）拉取最新源码编译安装。如无法立即升级，可在应用层对上传的 TIFF 文件进行校验，限制 tile size 字段不超过合理阈值，并禁用 libtiff 对畸形 TIFF 文件的自动解析。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "LibTIFF TIFF图像处理整数溢出远程代码执行漏洞"
updated = "2026-06-16T23:39:11.120"

