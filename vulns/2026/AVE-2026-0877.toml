[basic]
description = "Composer（PHP 依赖管理工具）在 2.2.29 及 2.10.2 之前版本中存在路径遍历导致的任意文件写入漏洞。当用户从非 Packagist.org 或 Private Packagist 的不可信第三方仓库安装依赖时，攻击者可通过发布包含恶意包名的软件包，利用 Composer 对包名校验不充分的缺陷，在 install 或 update 过程中将攻击者控制的内容写入 vendor/ 目录及项目目录之外的位置。攻击者可借此写入 shell 启动文件、SSH authorized_keys 或 cron 条目，实现供应链攻击场景下的远程代码执行。该漏洞需依赖图中存在恶意或已被攻破的软件包，无法直接远程利用。"
published = "2026-07-08T20:16:59.980"
remediation = "立即将 Composer 升级至 2.2.29 或 2.10.2 及以上版本：执行 `composer self-update 2.10.2` 完成升级。如无法升级，仅使用 Packagist.org 或 Private Packagist 作为包来源，禁止添加不受信任的第三方仓库源（`composer config repositories.xxx` 命令），并通过内部镜像仓库代理外部源以过滤恶意包名。"
score = 7
severity = "HIGH"
sources = ["ghsa"]
title = "Composer 依赖管理器任意文件写入漏洞"
updated = "2026-07-10T19:14:18.563"

