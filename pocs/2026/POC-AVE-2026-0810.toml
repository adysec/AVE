[info]
author = "ave"
description = "验证 Jodit Editor 4.12.27 及更早版本中 clean-html 过滤器绕过导致的突变型 XSS。通过构造 MathML/<style> 嵌套载体，使 <img onload=> 事件处理器绕过同步清理，在重新解析时被激活。"
id = "POC-AVE-2026-0810"
name = "Jodit Editor Mutation XSS PoC"
severity = "high"
tags = ["ave-2026-0810"]
vuln_id = [
    "CVE-2026-58263",
    "AVE-2026-0810",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["jodit"]
