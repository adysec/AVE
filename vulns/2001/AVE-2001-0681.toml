[basic]
description = 'FaSTream FTP++ Server 2.0 存在信息泄露漏洞，未经身份认证的远程攻击者可通过向 FTP 服务发送 "pwd" 命令，获取服务器的真实文件系统路径名。该漏洞影响运行 FaSTream FTP++ Server 2.0 版本的系统，攻击者无需任何凭据即可在网络可达的情况下利用此漏洞，导致服务器敏感路径信息泄露，可能为后续目录遍历、文件下载等攻击提供路径基础。'
published = "2001-06-02T04:00:00Z"
remediation = "升级到 FaSTream FTP++ Beta 10 Build 3，该版本已修复路径信息泄露问题。如无法立即升级，可临时禁用 FTP++ 嵌入式 FTP 服务，或在防火墙层面限制外部对 FTP 端口的访问，仅允许可信 IP 连接，以降低攻击者通过 PWD 命令获取服务器真实路径的风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "FaSTream FTP++ Server 路径信息泄露漏洞"
updated = "2026-06-16T21:53:58Z"

