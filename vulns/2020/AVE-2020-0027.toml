[basic]
description = "标签包裹。<value>rConfig是一款网络设备配置备份与变更管理工具。该工具web界面的commands.inc.php文件中的searchColumn参数存在SQL注入漏洞，影响rConfig 3.9.4及以下所有版本。未经身份认证的远程攻击者可通过向目标系统发送包含恶意SQL语句的searchColumn参数，在未经授权的情况下执行任意数据库查询，可能导致敏感配置信息泄露、数据库数据被篡改或删除，甚至进一步获取服务器权限，CVSS评分高达9.8，危害等级严重。"
published = "2020-03-07T23:15:11Z"
remediation = "建议立即将 rConfig 升级至 v8 Core 最新版本，该版本已彻底重写架构并移除了存在 SQL 注入漏洞的 commands.inc.php 文件。如短期内无法完成版本升级，可对 commands.inc.php 中 searchColumn 参数实施输入过滤，仅允许白名单内的列名（如 command、deviceName、ipAddr），禁止用户直接输入未经验证的列名；同时启用 Web 应用防火墙（WAF）规则拦截针对 commands.inc.php 的 SQL 注入攻击载荷，限制该接口仅允许内网 IP 访问，并在防火墙层面阻断外部对 commands.inc.php 的直接访问请求。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "rConfig SQL 注入漏洞"
