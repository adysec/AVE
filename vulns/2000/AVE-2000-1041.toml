[basic]
description = "AOL Instant Messenger (AIM) 4.1.2010 存在格式化字符串漏洞，远程攻击者可通过向目标用户传输包含格式化字符（如 %s、%n 等）的特殊构造文件名，触发该漏洞，导致 AIM 客户端拒绝服务，在特定条件下可能执行任意代码。攻击无需身份认证，仅需诱使用户接收恶意文件即可触发。"
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 AOL Instant Messenger 至 4.8 及以上版本（AOL 已发布修复该格式字符串漏洞的安全更新）。由于 AIM 已于 2017 年 12 月 15 日正式停止服务，建议彻底卸载 AIM 并改用其他受支持的即时通讯软件（如 Signal、Telegram）。如因业务需要必须继续使用，应在网络层面阻止 AIM 协议流量（TCP 端口 5190），并禁止接收来自不可信来源的文件传输请求。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "AOL Instant Messenger 格式化字符串远程代码执行漏洞"
updated = "2026-06-16T21:52:56.670"

