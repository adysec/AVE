[basic]
description = "Gitea OAuth 令牌内省端点 `/login/oauth/introspect` 存在权限校验缺失漏洞，违反 RFC 7662 第 4 节规范。在 `IntrospectOAuth` 处理器中，验证请求客户端身份后，错误地将 `app` 变量重新赋值为令牌颁发客户端，未校验请求客户端是否为令牌受众。任何认证的 OAuth 客户端均可通过该端点携带其他客户端的访问/刷新令牌进行内省，获取 `active`、`scope`、`username`、`iss`、`sub`、`aud` 等元数据。影响 Gitea 1.26.1 及更早版本（自内省端点引入以来）。攻击者需拥有合法 OAuth 客户端凭据（可通过注册应用获取），即可跨租户枚举令牌元数据、验证窃取令牌有效性、为后续攻击收集情报。Gitea 1.26.1 Docker 镜像确认受影响，官方已在 PR #37704 模式下修复，建议升级至修复版本。"
published = "2026-01-01T00:00:00Z"
remediation = "建议立即升级 Gitea 至 v1.26.2 或更高版本（已包含 PR #37704 同类修复）。若暂时无法升级，可通过反向代理在 `/login/oauth/introspect` 路径前增加客户端 ID 校验中间件，或在配置文件 `[oauth2]` 下设置 `ENABLE_INTROSPECTION_ENDPOINT = false` 临时禁用该端点，升级后重新启用。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Gitea Gitea OAuth 令牌内省信息泄露漏洞"
updated = "2026-01-01T00:00:00Z"

