[basic]
description = 'Gitea 是一款轻量级自托管 Git 服务。其 REST API 中的 `/orgs/{org}/public_members/{username}` 端点存在信息泄露漏洞。当私有组织（private visibility）内的成员被标记为"公开可见"时，任何未授权或低权限用户（包括未登录用户）均可通过该 API 端点查询指定用户是否属于该私有组织。攻击者只需构造包含目标组织名和用户名的 GET 请求，即可收到 204 状态码响应，从而确认成员关系。该漏洞导致本应在 Web 界面中隐藏的私有组织成员信息被泄露，破坏了 Gitea 的私有组织可见性控制机制。攻击条件简单，无需特殊权限，仅需知道目标组织名称即可发起探测。'
published = "2026-01-01T00:00:00Z"
remediation = "立即将 Gitea 升级至 v1.27.0 或更高版本（该版本已修复 REST API 泄露私有组织成员信息的问题）。如无法立即升级，可在反向代理层（如 Nginx）添加规则，限制对 `/api/v1/orgs/*/public_members/*` 接口的匿名访问，或禁用 API 令牌中不必要的组织成员查询权限作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Gitea REST API 私有组织成员信息泄露漏洞"
updated = "2026-01-01T00:00:00Z"

