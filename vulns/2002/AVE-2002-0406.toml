[basic]
description = "Linux 内核 2.4.20 之前版本中的 pcilynx IEEE 1394 (FireWire) 驱动程序（pcilynx.c）存在未明漏洞，与环绕处理（wrap handling）相关。该漏洞允许远程攻击者通过网络利用此缺陷，可能导致完全机密性、完整性和可用性丧失。由于漏洞细节未公开，具体攻击向量和利用方式尚不明确，但 CVSS v2 评分高达 10.0，表明潜在危害极大。受影响的系统需升级至 Linux 内核 2.4.20 或更高版本以修复此问题。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 Linux 内核至 2.4.20 或更高版本，该版本已修复 pcilynx FireWire 驱动中的 wrap handling 漏洞。Red Hat 用户可安装 RHSA-2002:205 或 RHSA-2002:206 提供的更新内核 RPM 包。如无法立即升级，可卸载 pcilynx 内核模块（rmmod pcilynx）或在内核引导参数中禁用 FireWire 支持作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "Linux Kernel pcilynx FireWire 驱动未指明漏洞"
updated = "2026-06-16T21:59:34Z"

