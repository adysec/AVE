[basic]
description = "CGIScript.net CSFAQ 1.0 版本的 csFAQ.cgi 脚本存在路径信息泄露漏洞。远程攻击者无需身份验证，通过向该 CGI 脚本发送包含无效数据库参数的特制请求，即可触发错误信息回显，导致 Web 服务器的物理文件路径被泄露。该漏洞影响运行 CSFAQ 1.0 的 Web 服务器，利用方式简单且无需交互。攻击者可通过获取的路径信息进一步针对服务器文件系统发起其他攻击，如定位配置文件、结合其他漏洞进行渗透。"
published = "2004-08-06T04:00:00Z"
remediation = "将 csFAQ 升级至修复了路径泄露问题的后续版本，或停用该 CGI 脚本并替换为其他维护中的 FAQ 系统。若暂无法替换，应在 Web 服务器配置中禁用脚本错误信息输出（如 Apache 的 ServerTokens Prod 与 PHP 的 display_errors Off），避免服务器真实路径泄露。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "CGIScript.net CSFAQ 信息泄露漏洞"
updated = "2026-06-16T22:06:07Z"

