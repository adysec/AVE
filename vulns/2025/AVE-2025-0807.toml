[basic]
description = "Trend Micro Vision One 的 Service Gateway 模块存在敏感信息泄露漏洞。该漏洞源于系统将敏感数据（如凭据、会话令牌等）以明文形式记录在日志文件中，具有低权限的远程攻击者可通过网络访问获取这些日志，从而窃取敏感信息。由于攻击影响范围跨越安全边界（Scope: Changed），泄露的敏感信息可被用于进一步攻击内部系统。该漏洞需认证后方可利用，CVSS 评分 7.7，危害等级高。Trend Micro 已发布安全更新修复此漏洞。"
published = "2025-01-01T00:00:00Z"
remediation = "确认 TrendAI Vision One Service Gateway 已启用自动更新（默认开启），系统会自动接收后端侧修复。若已关闭自动更新，请在管理控制台重新启用自动更新策略，或联系 Trend Micro 支持获取手动更新包进行安装。作为临时缓解措施，可在网络防火墙上限制对 Service Gateway 管理端口的非授权访问。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "Trend Micro Vision One Service Gateway 日志信息泄露漏洞"
updated = "2025-01-01T00:00:00Z"

