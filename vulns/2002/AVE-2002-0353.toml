[basic]
description = "该漏洞存在于 Ethereal 0.9.7 及更早版本中，攻击者可通过向目标系统发送构造恶意的网络数据包来触发漏洞，主要影响 PPP、LMP 和 TDS 等协议解析器。由于 Ethereal 网络协议解析器在处理 EndVerifyAck 消息时缺少必要字段验证，导致内存地址越界访问和资源耗尽，进而引发应用程序崩溃。此外，漏洞还存在潜在的远程代码执行风险，攻击者可能利用内存布局控制实现任意代码运行。该漏洞影响广泛，用户无需任何权限即可触发，攻击成本极低，易于被武器化。微软、安全厂商及开源社区已发布补丁以修复此漏洞，建议用户及时更新到最新版本以获取保护。"
published = "2002-12-23T05:00:00Z"
remediation = "升级 Ethereal 到支持 EndVerifyAck 消息解析的功能版本（≥0.9.8），或切换到已修复的 Wireshark 1.0+ 版本。如无法立即升级，可通过 Wireshark 配置文件禁用 LMP、PPP 和 TDS  dissector 以消除该特定解析路径的风险。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Ethereal 网络协议分析器 拒绝服务与远程代码执行漏洞"
updated = "2026-06-16T21:59:09Z"

