[basic]
description = "PHPMailer 5.2.18 之前版本中的 mail 函数存在参数注入漏洞。攻击者可通过向使用 PHPMailer 的 Web 应用提交特制的发件人邮箱地址，在 mail() 函数调用中注入额外的命令行参数，从而绕过安全限制执行任意代码。该漏洞影响大量使用 PHPMailer 的 CMS 系统（如 WordPress、Joomla 等），远程未认证攻击者无需任何权限即可利用，危害严重。"
published = "2016-12-31"
remediation = "立即将 PHPMailer 升级至 v5.2.18 或更高版本（https://github.com/PHPMailer/PHPMailer/releases/tag/v5.2.18）。使用 WordPress 4.6 的用户应升级至 4.7+，该版本已内置修复后的 PHPMailer。如无法立即升级，可在 php.ini 中禁用 mail.add_x_header 并限制 sendmail_path 参数传递，同时避免在邮件地址参数中直接拼接用户输入。"
score = 5
severity = "MEDIUM"
sources = ["kev"]
title = "PHPMailer mail函数参数注入远程代码执行漏洞"
updated = "2016-12-31"

