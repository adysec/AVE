[basic]
description = "Odoo 的 `tools.file_open` 函数存在目录遍历漏洞（CWE-22），远程认证攻击者可通过构造包含 `../` 等遍历序列的特殊文件路径参数，绕过路径限制访问服务器上的任意本地文件（如配置文件、数据库凭证等）。该漏洞影响 Odoo 8.0、9.0 和 10.0 版本，攻击者仅需拥有低权限账号即可利用，无需任何用户交互。由于 Odoo 服务通常以较高权限运行，攻击者可读取系统敏感文件导致信息泄露。CVSS 评分 6.5，危害等级中危。"
published = "2017-06-04T21:29:00Z"
remediation = "立即升级 Odoo 至修复版本：8.0 升级至 commit d18d606a 以上，9.0 升级至 98f5f1b8 以上，10.0 升级至 76cd8d25 以上，或从 https://www.odoo.com/page/download 下载安装最新版。如无法升级，可在文件系统层面限制 Odoo 运行用户对敏感文件的读取权限作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Odoo Odoo 目录遍历漏洞"
updated = "2026-06-17T01:28:03Z"

