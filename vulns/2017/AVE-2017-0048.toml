[basic]
description = "Intelbras WRN 150 无线路由器存在认证绕过漏洞（CWE-552），远程攻击者无需任何身份验证，通过向 /cgi-bin/DownloadCfg/RouterCfm.cfg 发送直接 HTTP 请求并携带 admin:language=pt Cookie，即可读取设备完整配置文件，泄露管理员密码、网络设置等敏感信息，进而完全绕过路由器认证机制获得管理权限。攻击者可利用泄露的凭据修改 DNS 配置、劫持网络流量或实施中间人攻击，CVSS 评分 9.8，危害等级严重。"
published = "2017-09-30T01:29:02Z"
remediation = "立即登录路由器管理后台检查固件版本，访问 Intelbras 官方支持页面下载并安装 WRN 150 最新固件。如厂商已停止支持，应在防火墙层面限制仅可信内网 IP 可访问路由器管理端口（80/443），并在 WAN 侧禁用远程管理功能，同时修改默认管理员密码。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Intelbras WRN 150 安全绕过漏洞"
updated = "2026-06-17T01:07:01Z"

