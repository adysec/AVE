[basic]
description = "Apple iOS 5.1 之前版本及 iTunes 10.6 之前版本中使用的 WebKit 引擎存在内存破坏漏洞，远程攻击者可通过诱导用户访问特制网站触发内存损坏，导致任意代码执行或应用程序崩溃。该漏洞属于 CWE-119 类内存操作缺陷，攻击无需身份认证但需用户交互，CVSS 评分 9.3，危害严重。Apple 已在 2012 年 3 月安全更新中修复。"
published = "2012-03-08T22:55:03Z"
remediation = "将 Apple iOS 升级至 5.1 或更高版本，将 iTunes 升级至 10.6 或更高版本，将 Safari 升级至 5.1.4 或更高版本。上述更新可通过 iOS 设备「设置→通用→软件更新」或 iTunes 内置更新功能获取。如无法立即升级，可配置 Web 内容过滤或禁用 JavaScript 作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:58Z"

