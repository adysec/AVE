[basic]
description = "Bill Kendrick 开发的 GBook 访客簿脚本（gbook.cgi）存在命令注入漏洞。该漏洞源于程序在处理 _MAILTO 表单变量时缺乏足够的输入验证，允许攻击者通过注入 Shell 元字符在服务器端执行任意系统命令。远程未经身份验证的攻击者可以通过发送特制的 HTTP 请求触发此漏洞，从而实现对目标 Web 服务器的远程代码执行，导致敏感数据泄露或系统被完全接管。"
published = "2001-01-09T05:00:00.000"
remediation = "升级到 GBook 2000 年 11 月 11 日发布的修复版本，将 gbook.cgi 中易受攻击的 sprintf() 调用替换为 snprintf()，并对 _MAILTO 表单变量进行 shell 元字符过滤。如无法立即升级，可从 Web 服务器中移除或限制对 gbook.cgi 的访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Bill Kendrick GBook 远程命令执行漏洞"
updated = "2026-06-16T21:53:12.973"

