[basic]
description = "MHonArc 2.5.12 及更早版本中存在跨站脚本（XSS）漏洞。远程攻击者可通过向目标用户发送特制的电子邮件，将恶意脚本或 HTML 代码嵌入 MIME 头名称中，当 MHonArc 处理并生成邮件归档 HTML 页面时，该恶意代码未经过滤即被渲染，导致在受害者浏览器中执行任意脚本。攻击者可利用此漏洞窃取会话凭证、劫持用户会话或实施钓鱼攻击。攻击条件仅需用户使用 MHonArc 查看包含恶意 MIME 头的邮件归档。"
published = "2002-11-29T05:00:00.000"
remediation = "建议立即将 MHonArc 升级至 v2.6.18 或更高版本（当前最新为 v2.6.19），该版本已修复 HTML 过滤器中的 XSS 漏洞。如无法立即升级，可在 MHonArc 配置中启用 `-htmlmail` 参数或设置 `EXCLUDE_HTML_MAIL` 选项，禁止将 HTML 格式邮件内容转换为网页，作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["exploitdb"]
title = "MHonArc MIME邮件头跨站脚本漏洞"
updated = "2026-06-16T21:59:05.180"

