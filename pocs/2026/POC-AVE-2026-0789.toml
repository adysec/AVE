[info]
author = "AVE"
description = '检测 MathLive 0.110.0 之前版本中 \text{} 和 \mbox{} 命令的 HTML 转义缺失导致的 XSS 漏洞'
id = "POC-AVE-2026-0789"
name = "CVE-2026-54705 PoC"
severity = "medium"
tags = ["cve-2026-54705"]
vuln_id = [
    "CVE-2026-54705",
    "AVE-2026-0789",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["mathlive"]
