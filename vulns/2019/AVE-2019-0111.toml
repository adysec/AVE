[basic]
description = "Windows 任务计划服务在验证文件操作时存在链接跟随漏洞（CWE-59），攻击者利用该漏洞可通过符号链接替换技术将任务计划服务指向恶意文件，从而获取系统高权限。攻击条件为攻击者需先在目标系统上获得低权限代码执行能力，随后利用任务计划服务对文件操作校验不充分的缺陷，将普通权限提升至 SYSTEM 权限。该漏洞影响 Windows 10、Windows Server 2019 等多个 Windows 版本，CVSS 评分为 7.8（高危），微软已于 2019 年 6 月发布安全更新修复此问题。"
published = "2019-06-12T14:29:04Z"
remediation = "建议立即通过 Windows Update 安装 2019 年 6 月安全更新 (KB4503293/KB4503327/KB4503286/KB4503276/KB4503292 等)，或手动下载对应系统版本的累积更新包：Windows 10 1903 升级至 Build 18362.175 (KB4503293)；Windows 10 1809/Server 2019 升级至 Build 17763.557 (KB4503327)；Windows 10 1803 升级至 Build 17134.829 (KB4503286)；Windows 8.1/Server 2012 R2 安装 KB4503276；Windows 7/Server 2008 R2 安装 KB4503292。如无法立即打补丁，可临时禁用 Task Scheduler 服务或限制非受信用户执行任务计划操作作为缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Task Scheduler 权限提升漏洞"
updated = "2026-06-17T02:27:45Z"

