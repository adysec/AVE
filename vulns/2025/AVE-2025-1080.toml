[basic]
description = "Linux 内核 AMD DRM 显示驱动中存在越界访问漏洞。`hpo_stream_to_link_encoder_mapping` 数组大小为 MAX_HPO_DP2_ENCODERS（即 4），但 location 参数最大可达 6，导致数组越界写入；同时 `disp_cfg_stream_location` 用作数组索引时合法范围应为 0..5，但代码中 ASSERT 条件使用了小于等于而非小于，同样存在越界风险。攻击者在本地系统上需拥有低权限，可通过特制参数触发该漏洞，导致内存越界读写，进而可能获取内核权限、篡改敏感数据或造成系统拒绝服务。该漏洞影响包含 AMD 显示驱动的 Linux 内核版本，CVSS 评分为 7.8（高危）。Linux 内核社区已发布补丁修复此问题，建议受影响用户及时更新内核版本。"
published = "2025-04-01T16:15:29Z"
remediation = "建议立即升级 Linux 内核至已修复版本：SUSE Linux Enterprise 15 SP6 用户升级至 kernel-default-6.4.0-150600.23.28.1 或更高版本（参考 SUSE-SU-2025:01964-1），SUSE Linux Enterprise 15 SP7 用户升级至 kernel-default-6.4.0-150700.5.10.1 或更高版本（参考 SUSE-SU-2025:01951-1）。通过 zypper patch 或 YaST 在线更新安装补丁。如暂时无法升级，可限制本地用户权限、移除非必要的 AMD GPU 驱动模块（黑名单 amdgpu），并启用内核地址空间布局随机化（KASLR）作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux内核AMD显示驱动越界访问漏洞"
updated = "2026-07-30T06:22:01Z"

