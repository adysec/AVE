[basic]
description = "Microsoft Internet Explorer 5.01、5.5 及 6.0 版本中存在一个用于显示特殊格式文本的遗留 ActiveX 控件缓冲区溢出漏洞。远程攻击者可通过构造特制网页，诱使用户访问后触发该 ActiveX 控件缓冲区溢出，从而在目标系统上以当前用户权限执行任意代码。该漏洞无需身份认证，攻击复杂度低，影响范围广泛，CVSS 评分 7.5，危害等级高。微软尚未发布官方补丁，建议用户禁用相关 ActiveX 控件或升级浏览器版本。"
published = "2002-09-24T04:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS02-047 提供的累积补丁 Q323759，该补丁为受影响 ActiveX 控件设置 kill bit 以彻底禁用其执行。IE 5.01 用户需运行于 Windows 2000 SP2/SP3 环境，IE 5.5 用户需安装 SP1 或 SP2 后打补丁，IE 6.0 用户直接安装。安装后重启系统，并通过 IE 帮助菜单确认更新版本号包含 Q323759。如无法安装补丁，可将 Internet 区域 ActiveX 控件和插件设置为禁用，并将 Outlook 邮件阅读区域设为受限站点。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer 遗留文本格式ActiveX控件缓冲区溢出漏洞"
updated = "2026-06-16T21:57:51Z"

