[info]
author = "ave"
description = "检测 Alabanza Control Panel 3.0 的 nsManager.cgi 是否可未授权访问，攻击者可利用该接口修改域名 DNS 记录"
id = "POC-AVE-2000-0747"
name = "Alabanza Control Panel 3.0 nsManager.cgi 未授权访问 PoC"
severity = "high"
tags = ["ave-2000-0747"]
vuln_id = [
    "CVE-2000-1023",
    "AVE-2000-0747",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/nsManager.cgi"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "200",
    "document follows",
    "Content-Type",
]
