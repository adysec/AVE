[basic]
description = "PHP 的 CGI 模式（php-cgi）中存在参数注入漏洞，当 PHP 以 CGI 脚本方式运行时，sapi/cgi/cgi_main.c 未能正确处理不含等号（=）的查询字符串，导致远程攻击者可通过在查询字符串中注入命令行选项（如 -d、-s 等）来执行任意代码。该漏洞影响 PHP 5.3.12 之前版本及 5.4.2 之前版本，攻击者无需认证即可远程利用，CVSS 评分 9.8，危害等级严重。攻击者可通过构造类似 /cgi.php?-d+allow_url_include%3don+-d+auto_prepend_file%3dphp://input 的请求实现远程代码执行。"
published = "2012-05-11T10:15:48.043"
remediation = "立即升级 PHP 至 5.3.12 或 5.4.2 及以上版本。如无法升级，将运行模式从 CGI 切换为 FastCGI 或 mod_php，或在 Web 服务器层添加 RewriteRule 过滤不含等号的查询字符串：RewriteCond %{QUERY_STRING} ^[^=]*$ [NC]；RewriteRule ^.*$ - [F,L]。"
score = 9.8
severity = "CRITICAL"
sources = ["tenable"]
title = "PHP PHP-CGI 远程代码执行漏洞"
updated = "2026-06-16T23:40:22.147"

