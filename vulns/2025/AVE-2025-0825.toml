[basic]
description = "Microsoft Word 存在不受信任指针解引用（Untrusted Pointer Dereference）漏洞，攻击者可构造特制的 Office 文档并诱使用户打开，触发该漏洞导致远程代码执行。该漏洞影响 Microsoft Office 多个版本，攻击者成功利用后可获取与当前用户相同的系统权限，实现完全控制目标系统。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞，建议用户及时安装补丁。"
published = "2025-01-14T18:16:01Z"
remediation = "建议立即通过 Windows 更新或 Microsoft 官网安装 Microsoft 2025 年 1 月安全更新（对应 Word 版本 KB），升级至该修复版本解决 CVE-2025-21363 远程代码执行漏洞。如无法立即打补丁，可采取缓解措施：在组织内禁止用户使用管理员身份运行 Office，通过组策略启用 Office 文件打开时的受保护视图（Protected View），并配置 ASR（攻击面减少）规则阻止可疑宏与 OLE 对象执行，同时避免打开来源不明的 .docx 文档。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Word 远程代码执行漏洞"
updated = "2026-06-17T08:43:11Z"

