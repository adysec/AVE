[basic]
description = "Ethereal 网络协议分析软件（现为 Wireshark）的 OSI 协议解析器存在缓冲区溢出漏洞。在 0.9.12 及更早版本中，当软件解析包含无效 IPv4 或 IPv6 前缀长度的网络数据包时，未能正确校验数据长度，导致缓冲区溢出。未经身份认证的远程攻击者可通过向运行 Ethereal 的系统发送特制网络数据包触发该漏洞，造成拒绝服务，并可能在特定条件下执行任意代码。该漏洞影响所有使用受影响版本进行网络流量分析的平台，攻击者无需特殊权限即可在目标系统上实现代码执行或使分析程序崩溃。"
published = "2003-07-24T04:00:00Z"
remediation = "建议立即升级 Ethereal 至 0.9.13 或更高版本（现已更名为 Wireshark）。Red Hat 用户可通过 `yum update ethereal` 安装 RHSA-2003:077 提供的修复包；Debian 用户可执行 `apt-get update && apt-get install ethereal` 获取 DSA-324 修复版本；其他 Linux 发行版请从官方源更新至 0.9.13 以上。如无法立即升级，可临时禁用 OSI 协议解析功能（编辑配置文件取消 OSI dissector），或在网络边界部署包过滤规则拦截异常 IPv4/IPv6 前缀长度的数据包，防止触发缓冲区溢出。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Ethereal OSI协议解析器 缓冲区溢出拒绝服务代码执行漏洞"
updated = "2026-06-16T22:02:11Z"

