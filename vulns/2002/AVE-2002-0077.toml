[basic]
description = "Common Unix Printing System（CUPS）1.1.14 至 1.1.17 版本存在负值长度 HTTP 头处理漏洞。远程攻击者可通过向目标系统发送特制的 HTTP 请求，在 Content-Length 头或 chunked transfer encoding 中注入负值长度参数，这些负值被传入 memcpy() 内存复制函数后，可导致缓冲区溢出，从而引发拒绝服务（程序崩溃）并可能被利用执行任意代码。该漏洞无需身份认证即可远程触发，攻击复杂度低，影响使用受影响版本 CUPS 的 Unix/Linux 系统。"
published = "2002-12-26T05:00:00Z"
remediation = "将 CUPS 升级至 1.1.18 或更高版本，新版本已修复 HTTP 请求头中负数 Content-Length 及 chunked transfer encoding 长度参数未做校验导致 memcpy() 被传入负值的问题。如暂无法升级，可通过 iptables 限制远程对 631 端口的 HTTP 访问，仅允许本地回环地址访问打印服务，或配置 cupsd.conf 中的 Port 指令仅监听 127.0.0.1:631 以临时缓解远程攻击风险。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "CUPS HTTP 请求缓冲区溢出漏洞"
updated = "2026-06-16T21:59:11Z"

