[basic]
description = "Apple QuickTime 在处理特制 MPEG 编码影片文件时存在整数符号错误漏洞。由于对 MPEG 文件中相关字段的符号性判断不当，远程攻击者可构造恶意 MPEG 影片文件，通过诱导用户打开该文件触发漏洞，导致应用程序崩溃或执行任意代码。该漏洞影响 Mac OS X 10.6.5 之前版本及 QuickTime 7.6.9 之前版本，攻击复杂度较高，需要用户交互配合。"
published = "2010-11-16T22:00:16Z"
remediation = "升级 QuickTime 至 7.6.9 或更高版本（Windows 系统），或通过 Apple 软件更新将 Mac OS X 升级至 10.6.5。如无法立即升级，可在浏览器中禁用 QuickTime 插件，并避免打开来源不明的 MPEG 媒体文件。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple QuickTime MPEG文件处理整数符号错误远程代码执行漏洞"
updated = "2026-06-16T23:23:32Z"

