[basic]
description = "Mandrake Linux 7.1 及更早版本中 ypserv（NIS 服务）存在格式化字符串漏洞。当 ypserv 在编译时未启用 vsyslog() 函数的情况下，远程攻击者可通过向 ypserv 服务发送特制的格式化字符串 payload，触发格式化字符串漏洞，从而以 root 权限执行任意代码。该漏洞 CVSS 评分 10.0，危害等级严重，攻击者无需身份认证即可远程利用，可完全控制目标系统，导致机密性、完整性和可用性全部丧失。"
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 ypserv 至修复版本（Mandrake Linux 用户安装 MDKSA-2000-064 安全更新提供的补丁包），确保 ypserv 编译时包含 vsyslog() 函数支持。如无法升级，在防火墙上限制对 ypserv 服务端口（TCP/UDP 834）的访问，仅允许受信任的 NIS 客户端 IP，并考虑迁移至 LDAP/Kerberos 等更安全的身份认证方案替代 NIS。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Mandrake Linux ypserv 格式化字符串漏洞"
updated = "2026-06-16T21:53:02.197"

