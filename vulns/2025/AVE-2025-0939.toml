[basic]
description = "tags.<value>Linux 内核 net/rose 子系统的 rose_setsockopt() 函数存在整数溢出漏洞（CWE-190）。当用户传入超大参数值并通过乘法运算进一步放大时，可能导致整数溢出，进而引发拒绝服务攻击。该漏洞影响支持 ROSE（业余无线电）网络协议的内核版本，攻击者需具备本地访问权限和低级别权限，无需用户交互即可利用。成功利用可导致系统可用性严重受损，造成服务中断或内核崩溃。漏洞成因是函数未对 opt 参数范围进行充分校验，修复方案为增加参数边界检查并改用无符号整数类型。"
published = "2025-02-27T02:15:14.760"
remediation = "建议立即升级 Linux 内核至修复版本：5.15.179、6.1.129、6.6.76、6.12.13 或 6.13.2 及以上版本；Ubuntu 22.04 LTS 用户可升级至 5.15.0-140.150，Ubuntu 24.04 LTS 用户可升级至 6.8.0-64.67。如暂无法升级，可执行 modprobe -r rose 或向 /etc/modprobe.d/disable-rose.conf 写入 install rose /bin/false 以禁用 ROSE 模块作为临时缓解。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 ROSE 网络子系统整数溢出漏洞"
updated = "2026-06-17T08:44:05.310"

