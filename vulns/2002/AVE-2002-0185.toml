[basic]
description = "华盛顿大学 UW-IMAPD 邮件服务器在处理 IMAP 协议的 BODY 命令时存在缓冲区溢出漏洞。远程认证用户可通过向目标服务器发送特制的超长 BODY 请求触发栈缓冲区溢出，导致任意代码执行。该漏洞影响 imap-2001、imap-2001a 及 imapd 2000.287 及更早版本，CVSS 评分 7.5，危害等级高。攻击者需先通过身份认证方可利用，成功利用后可完全控制受影响服务器。目前已存在公开的 ExploitDB 利用代码。"
published = "2002-06-25T04:00:00.000"
remediation = "升级 UW IMAPD 至 2001a 以上版本（如 imapd-2002 或更新版本），或应用 Debian DSA-133 提供的补丁。如无法升级，在 imapd.conf 中禁用 RFC 1730 兼容模式（设置 `legacy-rfc1730=no`），并在防火墙限制 IMAP 端口（143/993）仅允许受信任 IP 访问。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "华盛顿大学 UW-IMAPD 邮件服务器缓冲区溢出漏洞"
updated = "2026-06-16T21:57:19.440"

