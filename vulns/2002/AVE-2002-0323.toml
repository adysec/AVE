[basic]
description = "SquirrelMail 1.2.5 及更早版本存在远程命令执行漏洞。认证用户可通过修改 HTTP Cookie 中的 THEME 变量注入并执行任意操作系统命令。攻击者无需特殊权限即可利用此漏洞，在目标服务器上执行任意代码，获取完全的系统控制权。该漏洞影响 SquirrelMail 1.2.5 及之前所有版本，CVSS 评分为 10，危害等级为严重。"
published = "2002-08-12T04:00:00Z"
remediation = "建议立即升级 SquirrelMail 至 1.2.6 或更高版本（官方已修复该主题变量注入漏洞）。若暂时无法升级，可在配置文件 config.php 中禁用主题选择功能（$allow_theme_override = false），或在 Web 服务器层面配置拦截包含 THEME 参数的 Cookie 请求作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "SquirrelMail 1.2.x Theme远程命令执行漏洞"
updated = "2026-06-16T21:57:35Z"

