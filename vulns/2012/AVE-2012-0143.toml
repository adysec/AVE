[basic]
description = "Apple QuickTime 7.7.2 之前版本在处理特制影片文件中的 sean 原子时存在整数溢出漏洞。远程攻击者可构造恶意影片文件，诱使用户打开后触发整数溢出，导致堆内存破坏，最终实现任意代码执行或造成应用程序崩溃。攻击条件为诱导用户访问恶意网站或打开恶意文件，无需额外认证，CVSS 评分 9.3，危害严重。Apple 已发布 QuickTime 7.7.2 修复此漏洞。"
published = "2012-05-16T10:12:58Z"
remediation = "立即将 Apple QuickTime 升级至 7.7.2 或更高版本，该版本已修复 sean 原子整数溢出漏洞。由于 Apple 已停止对 Windows 版 QuickTime 的支持且不再发布安全更新，建议彻底卸载 QuickTime 并改用 VLC 等替代播放器，同时在浏览器中禁用或移除 QuickTime 插件，防止通过恶意网页触发远程代码执行。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime sean原子整数溢出漏洞"
updated = "2026-06-16T23:38:02Z"

