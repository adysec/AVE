[basic]
description = 'Dream Multimedia Dreambox 设备的 BouquetEditor WebPlugin 存在反射型跨站脚本（XSS）漏洞。攻击者可通过向 /file URI 的 file 参数或"Name des Bouquets"字段注入恶意 JavaScript 代码，当管理员或用户访问特制链接时，脚本将在浏览器中执行，可能导致会话劫持、敏感信息窃取或页面篡改。该漏洞影响 Dreambox WebControl 2.0.0 版本，攻击者无需身份认证，仅需诱导用户点击恶意链接即可触发，CVSS 评分 6.1，危害等级中危。'
published = "2017-10-12T15:29:00Z"
remediation = "厂商未发布针对此漏洞的官方补丁。建议采取以下措施：1）在 Dreambox 设备上禁用 BouquetEditor 插件，或通过 WebControl 管理界面关闭不必要的 Web 插件功能；2）对 /file URI 的 file 参数和 Bouquet 名称字段实施严格的输入过滤与输出编码，过滤 `<script>`、`<img>` 等 HTML 标签；3）通过防火墙限制 Dreambox Web 管理界面（默认 80/443 端口）仅允许可信内网 IP 访问，避免暴露在公网。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Dream Multimedia Dreambox WebControl 反射型跨站脚本漏洞"
updated = "2026-06-17T01:07:31Z"

