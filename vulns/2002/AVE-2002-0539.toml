[basic]
description = "Savant Web Server 3.1 及更早版本存在远程缓冲区溢出漏洞。攻击者无需身份认证，通过向目标服务器发送超长的 HTTP GET 请求即可触发缓冲区溢出，导致远程代码执行。该漏洞 CVSS 评分 7.5，危害等级高，影响范围广。Metasploit 框架已集成该漏洞的利用模块，攻击者可轻易获取服务器控制权。建议升级至最新版本或应用厂商补丁。"
published = "2002-09-24T04:00:00Z"
remediation = "Savant Web Server 已停止维护，官方不再发布安全更新。建议立即停止使用 Savant Web Server，迁移至 Apache HTTP Server 或 Nginx 等仍在积极维护的 Web 服务器。如无法立即迁移，可在 Web 服务器前端部署 IPS/IDS 设备，配置规则拦截超长 HTTP GET 请求（长度超过 4096 字节）以降低风险。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Savant Web Server 3.1 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:58:45Z"

