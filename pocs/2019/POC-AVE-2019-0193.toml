[info]
author = "ave"
description = "检测 Optergy Proton/Enterprise 设备是否存在未授权后门控制台。未经身份认证的远程攻击者可通过该后门控制台向目标设备发送特制请求，执行任意系统命令并获取 root 权限。该漏洞影响 Optergy Proton 和 Enterprise 系列 Building Management System 产品，CVSS v3.1 评分为 9.8。"
id = "POC-AVE-2019-0193"
name = "Optergy BMS Backdoor Console Detection"
severity = "critical"
tags = ["ave-2019-0193"]
vuln_id = [
    "CVE-2019-7276",
    "AVE-2019-0193",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/backdoor"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Optergy"]
