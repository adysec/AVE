[basic]
description = "Sambar Server 4.3 的 finger 和 whois 演示脚本存在缓冲区溢出漏洞。远程攻击者无需进行身份认证，只需向目标服务器发送包含超长主机名的请求即可触发该漏洞。由于脚本未对输入长度进行有效边界检查，过长的 hostname 参数会覆盖内存中的返回地址，使攻击者得以执行任意系统命令并完全控制服务器。该漏洞影响 Sambar Server 4.3 版本，CVSS v2 评分为 10.0，危害等级极高。"
published = "2000-06-01T04:00:00Z"
remediation = "Sambar Server 受影响版本为 4.3 beta 9，其中 finger 与 whois 演示脚本存在缓冲区溢出漏洞，可导致远程攻击者执行任意命令。立即缓解措施：删除或禁用 scripts 目录下 finger.cgi 与 whois.cgi 演示脚本。根治方案：升级至 Sambar Server 4.4 beta 或更高版本（5.x/6.x），厂商已在后续版本中修复 sambar.dll 的边界检查缺陷。升级前请备份配置文件，升级后验证 finger 与 whois 功能已移除或不再存在溢出风险。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Sambar Server 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:51:53Z"

