[basic]
description = 'Open WebUI 在 0.10.0 之前版本中，客户端 Python 执行引擎 Pyodide 运行在同源 Web Worker 内，导致存储型跨站脚本攻击（XSS）漏洞。低权限攻击者可将恶意 Python 载荷（利用 pyodide.http.pyfetch 或 js 模块的 fetch/XMLHttpRequest API）存入共享聊天消息中，当受害者（尤其是管理员或拥有 workspace.functions/workspace.tools 权限的用户）打开该聊天并点击"运行"按钮时，载荷以受害者身份发起同源认证请求，可调用管理员接口创建服务端执行的 Function/Tool，最终实现远程代码执行（RCE）。该漏洞 CVSS 评分 7.3，危害等级高，影响所有使用 Pyodide 的 Open WebUI 部署版本。'
published = "2026-07-09T17:17:02Z"
remediation = "升级 Open WebUI 至 0.10.0 或更高版本，该版本将 Pyodide 运行在沙箱化 iframe（opaque origin）中，阻止同源请求携带会话 cookie。如无法立即升级，可禁用 Pyodide 代码执行功能，或将代码执行/代码解释器引擎切换为服务端选项作为临时缓解措施。"
score = 7.3
severity = "HIGH"
sources = ["ghsa"]
title = "Open WebUI Pyodide Web Worker 存储型跨站脚本漏洞"
updated = "2026-07-10T19:24:29Z"

