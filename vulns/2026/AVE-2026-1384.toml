[basic]
description = "Open WebUI 自动化功能中的规则解析存在缺陷，攻击者可通过构造恶意 recurrence 规则触发实例级拒绝服务。受影响版本从 0.9.0 起包含自动化功能，解析器在处理 FREQ=MINUTELY 等子日级规则时以 2000-01-01 为固定锚点并同步向前枚举约 25 年的时间间隔，占用事件循环长达 18.9 秒，阻塞同一循环上的调度器、HTTP 及 WebSocket 服务。攻击者只需具备创建自动化的权限（默认部署中仅管理员可触达该路径，若开启了非管理员自动化功能则普通用户也可利用），发送一条常规语法的 recurrence 规则即可使调度器在每次轮询时重复执行高开销计算，导致整个实例持续卡顿无法恢复，影响该实例上的所有其他用户。该漏洞已在 0.11.0 版本中修复，通过将子日级规则锚点改为当前时钟时间，使相同规则的计算耗时降至毫秒级。"
published = "2026-08-04T21:16:37Z"
remediation = "立即将 Open WebUI 升级到 0.11.0 或更高版本。如暂无法升级，可在环境变量中设置 `USER_PERMISSIONS_FEATURES_AUTOMATIONS=false` 关闭自动化功能，或通过权限配置限制仅管理员可创建自动化规则，以阻断恶意 RRULE 规则的注入路径。"
score = 6.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Open WebUI 自动化循环规则实例拒绝服务漏洞"
updated = "2026-08-05T15:17:11Z"

