[basic]
description = "CVE-2019-8451是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2019-09-11T14:15:12Z"
remediation = "建议将 Jira Server 与 Data Center 升级至 8.4.0 或更高版本，修复 /plugins/servlet/gadgets/makeRequest 接口中 JiraWhitelist 类的逻辑缺陷，阻断未经授权的内网资源访问。如暂时无法升级，应在反向代理或防火墙层面限制该接口的外部访问，或通过修改代理配置禁止 Jira 实例向内网发起未授权出站请求，以缓解 SSRF 风险。"
score = 6.5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Atlassian Jira 服务端请求伪造漏洞"
updated = "2026-06-17T02:42:01Z"

