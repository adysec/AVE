[basic]
description = "Picserver 1.0 存在路径遍历漏洞，未经身份认证的远程攻击者可通过在 HTTP GET 请求中使用 .. (dot dot) 路径遍历序列，读取服务器上的任意敏感文件。该漏洞影响 Informs Picserver 1.0 Web 服务器，攻击者无需预先认证即可利用，攻击复杂度低且易于实施，可导致服务器配置文件、系统文件等敏感信息泄露。"
published = "2001-05-03T04:00:00Z"
remediation = '由于Informs Picserver 1.0年代久远且厂商已无维护记录，建议将Web服务器迁移至受支持的替代产品（如Nginx或Apache HTTP Server最新稳定版）。如短期内无法替换，应在反向代理或WAF层面对HTTP GET请求路径进行过滤，拦截包含"../"或"..\\"的目录遍历特征；同时限制Picserver运行账户对服务器文件系统的访问权限，仅开放Web根目录所需的最小读取范围，并监控异常文件访问行为。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Informs Picserver 目录遍历漏洞"
updated = "2026-06-16T21:53:52Z"

