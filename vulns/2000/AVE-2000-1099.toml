[basic]
description = "GBook 留言本应用（gbook.cgi）存在代码执行漏洞。远程攻击者无需身份认证即可利用该漏洞，通过向 _MAILTO 表单变量中注入包含 shell 元字符（metacharacters）的恶意输入，在目标服务器上执行任意系统命令。该漏洞影响运行 GBook 留言本的所有版本，攻击条件宽松，只需通过 HTTP 请求发送特制的 _MAILTO 参数即可触发。CVSS 评分为 7.5，危害等级为高危。攻击者可利用此漏洞获取服务器控制权，进而执行任意操作。"
published = "2001-01-09T05:00:00.000"
remediation = "立即将gbook.cgi升级至官方发布的最新修复版本，或直接移除该访客簿CGI脚本。若无法升级，需修改脚本代码中对_MAILTO表单变量的处理逻辑：删除所有shell元字符（分号、管道符、与号、反引号、美元符号等），禁止将用户输入直接传递给系统shell执行，改为使用安全的编程接口替代shell命令调用。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Bill Kendrick GBook 代码执行漏洞"
updated = "2026-06-16T21:53:12.973"

