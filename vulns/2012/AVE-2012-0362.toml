[basic]
description = "Apple Safari 6.0 之前版本使用的 WebKit 渲染引擎存在多处内存破坏漏洞（CWE-119），远程攻击者可通过向用户发送特制构造的恶意网页，诱使用户使用受影响版本的 Safari 浏览器访问该页面，触发 WebKit 中的缓冲区溢出或内存损坏，从而在目标系统上执行任意代码或导致应用程序崩溃拒绝服务。该漏洞影响 Apple Safari 浏览器及 iOS 6.0 之前版本的系统，CVSS v3 评分 9.3，危害等级为严重。攻击者无需身份认证即可在网络可达的情况下完成利用，用户仅需浏览恶意网页即可受到攻击。"
published = "2012-07-25T20:55:04.867"
remediation = "升级 Safari 至 6.0 或更高版本，或安装 Apple 2012 年 7 月安全更新（APPLE-SA-2012-07-25-1），对应 OS X Lion 10.7.4 及 OS X Lion Server 10.7.4 或更新系统。iOS 用户应升级至 iOS 6.0 或更高版本。如无法立即升级，可临时使用其他浏览器并禁用 WebKit 的 JavaScript 执行以降低被远程攻击的风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:44.070"

