[basic]
description = "WordPress 的 WaspThemes Visual CSS Style Editor（又名 yellow-pencil-visual-theme-customizer）插件 7.2.1 版本之前存在跨站请求伪造（CSRF）漏洞。攻击者可利用 yp_option_update 接口的 CSRF 缺陷，结合 yp_remote_get 功能实现管理员权限获取。攻击者只需诱使已登录的管理员用户访问恶意构造的页面，即可在未经授权的情况下执行任意操作，包括修改站点配置、注入恶意代码等。该漏洞 CVSS 评分 8.8，危害等级高，影响大量使用该插件的 WordPress 站点。"
published = "2019-05-13T05:29:00Z"
remediation = "立即将 WordPress 的 WaspThemes Visual CSS Style Editor（yellow-pencil-visual-theme-customizer）插件升级至 7.2.1 或更高版本。该版本已修复 yp_option_update CSRF 漏洞，可防止攻击者通过伪造请求利用 yp_remote_get 获取管理员权限。如无法立即升级，可暂时禁用该插件作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress WaspThemes Visual CSS Style Editor插件跨站请求伪造漏洞"
updated = "2026-06-17T02:13:48Z"

