[basic]
description = "JBoss RichFaces 框架 3.X 至 3.3.4 版本存在表达式语言（EL）注入漏洞，位于 UserResource 资源处理组件中。远程未认证攻击者可利用 org.ajax4jsf.resource.UserResource$UriData 类构造特制的 Java 序列化对象链，通过向目标服务器发送恶意 HTTP 请求触发 EL 表达式解析，从而在服务器端执行任意代码。该漏洞无需用户交互，攻击复杂度低，可完全控制受影响系统，导致数据泄露、服务中断或进一步横向移动。CVSS 评分 9.8，危害等级严重。Red Hat 已确认该漏洞并发布安全公告，建议用户升级至不受影响的版本或应用官方补丁。"
published = "2018-11-06T22:29:00Z"
remediation = "立即将 RichFaces 升级到 4.x 版本或迁移至 JSF 2.x 兼容的 UI 框架（如 PrimeFaces）。如无法立即升级，应在应用部署中禁用 org.ajax4jsf.resource.UserResource 资源映射，通过在 web.xml 或 faces-config 中移除该资源的注册来阻断攻击入口。同时在 Web 应用防火墙（WAF）层拦截包含 /a4j/res 路径的异常请求。对于使用 Red Hat JBoss EAP 的用户，安装 RHSA-2018:3518 安全公告中提供的补丁。RichFaces 3.x 已停止维护，建议制定迁移计划彻底替换。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "JBoss RichFaces EL表达式注入远程代码执行漏洞"
updated = "2026-06-17T01:41:24Z"

