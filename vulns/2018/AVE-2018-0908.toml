[basic]
description = "VMware NSX SD-WAN Edge（原 VeloCloud）的本地 Web UI 组件存在 OS 命令注入漏洞（CWE-78）。该组件默认处于禁用状态，但当管理员手动启用后，未经身份认证的远程攻击者可通过向受影响组件的输入参数中注入恶意操作系统命令，利用该漏洞在目标设备上以 root 权限执行任意命令，导致远程代码执行。攻击者无需认证即可利用，但需要目标启用该组件且攻击复杂度较高（需网络可达）。VMware 已在 3.1.0 版本中修复此漏洞，并计划在后续版本中彻底移除该服务。"
published = "2018-06-11T22:29:00.230"
remediation = "立即将 VMware NSX SD-WAN Edge by VeloCloud 升级至 3.1.0 或更高版本。该漏洞存在于 local web UI 组件中，该组件默认处于禁用状态，请确认该组件未被手动启用；如已启用，立即禁用并在防火墙上限制仅可信管理 IP 访问 9443 端口。如无法立即升级，确保 local web UI 组件处于禁用状态，并在网络边界阻断对该端口的非授权访问作为临时缓解措施。"
score = 8.1
severity = "HIGH"
sources = ["nuclei"]
title = "VMware NSX SD-WAN Edge 命令注入漏洞"
updated = "2026-06-17T02:02:31.090"

