[basic]
description = "SKYSEA Client View Ver.11.221.03及更早版本的管理控制台程序在处理TCP连接认证时存在认证绕过漏洞（CWE-287），远程攻击者无需任何凭证即可利用该缺陷与目标系统建立未授权连接，进而实现任意代码执行。该漏洞攻击复杂度低，无需用户交互，可被攻击者完全控制受影响的终端管理系统，导致敏感数据泄露、系统瘫痪或横向渗透。CVSS评分9.8，危害等级严重。厂商已发布更新版本修复此漏洞。"
published = "2017-06-09T16:29:01Z"
remediation = "立即升级 SKYSEA Client View 至 Ver.11.221.04 或更高版本。该漏洞源于管理控制台 TCP 连接认证处理缺陷，攻击者无需认证即可远程执行任意代码。如无法立即升级，应在防火墙层面限制对管理控制台 TCP 端口的网络访问，仅允许受信任的管理 IP 连接。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "SKYSEA Client View 远程代码执行漏洞"
updated = "2026-06-17T00:53:34Z"

