[basic]
description = "NetWin dMailWeb 和 cwMail 2.6i 及更早版本的 POP 服务存在缓冲区溢出漏洞，远程攻击者可通过发送过长的 POP 参数（pophost）触发缓冲区溢出，导致服务崩溃造成拒绝服务。该漏洞影响 NetWin dMailWeb 和 cwMail 2.6i 及更早版本，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），属于拒绝服务类漏洞，攻击者无需身份认证即可远程利用，通过发送超长 POP 参数即可触发服务崩溃导致拒绝服务攻击。"
published = "2000-06-21T04:00:00.000"
remediation = "建议升级至 NetWin dMailWeb 或 cwMail 的最新版本以修复该 POP 拒绝服务漏洞，同时检查是否有厂商发布的安全补丁。若暂时无法升级，可在防火墙或访问控制列表（ACL）中限制仅允许受信任 IP 访问 POP 服务端口（默认 110），或在不使用 POP 服务时临时禁用该服务作为缓解措施。此外，建议在邮件网关部署流量监控，检测异常的过长 POP 请求参数以提前发现攻击行为。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "NetWin DMailWeb/cwMail POP 拒绝服务漏洞"
updated = "2026-06-16T21:52:06.090"

