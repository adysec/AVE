[basic]
description = 'Carel pCOWeb 存在存储型跨站脚本（Stored XSS）漏洞，由于程序未对用户输入的"System contact"等字段进行充分的过滤与转义处理，导致具有低权限的认证攻击者可通过 config/pw_snmp.html 页面注入恶意脚本代码。当其他用户访问受影响页面时，注入的脚本将在浏览器中自动执行，窃取会话凭证或执行恶意操作。该漏洞影响 B1.2.4 之前版本的 pCOWeb 设备，CVSS 评分 5.4，危害等级中危。'
published = "2019-06-03T20:29:00.453"
remediation = "立即将 pCOWeb 卡固件升级至 B1.2.4 或更高版本（该版本已修复 SNMP 配置页面的输入过滤缺陷）。如无法立即升级，在防火墙或反向代理层面限制对 /config/pw_snmp.html 及 /config/pw_snmp_done.html 的访问，仅允许受信任的管理 IP 段访问 pCOWeb 管理界面，同时禁用 SNMP 写入功能作为临时缓解措施。"
score = 5.4
severity = "MEDIUM"
sources = ["nuclei"]
title = "Carel pCOWeb 跨站脚本漏洞"
updated = "2026-06-17T02:12:47.900"

