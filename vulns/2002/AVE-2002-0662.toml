[basic]
description = "CVE-2002-1712 是 Microsoft Windows 2000 和 Windows NT 4.0 操作系统 TCP/IP 协议栈中存在的一处拒绝服务漏洞。该漏洞的原理是远程攻击者无需身份认证即可向目标系统的 NetBIOS 服务端口（TCP/139）发送大量带有 ACK 和 FIN 标志位设置的空白 TCP/IP 数据包，导致系统内核内存被异常消耗而无法释放。受影响范围包括运行 Windows 2000 及 Windows NT 4.0 的服务器与工作站。攻击条件极为宽松，攻击者仅需能够访问目标网络的 TCP/139 端口即可实施攻击，无需任何凭据或交互。攻击者可通过持续发送特制的 TCP 数据包进行 Flood 攻击，最终导致系统资源耗尽、NetBIOS 服务拒绝或系统完全崩溃。Microsoft 已针对该漏洞发布安全补丁，建议受影响用户及时升级系统或通过防火墙限制对 TCP/139 端口的访问。"
published = "2002-12-31T05:00:00Z"
remediation = "建议立即安装 Microsoft Windows 2000 Service Pack 4 或更高版本的安全更新，该补丁修复了 TCP/IP 协议栈在处理带有 ACK 和 FIN 标志的空数据包时的内存管理缺陷。如无法立即升级，可在边界防火墙或路由器上配置 ACL 规则，过滤来自外部网络的 TCP/139 端口的异常 ACK/FIN 数据包，作为临时缓解措施。对于 Windows NT 4.0 系统，建议升级到 Windows 2000 或更高版本，因为 NT 4.0 已停止安全更新支持。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Windows TCP/IP 栈拒绝服务漏洞"
updated = "2026-06-16T21:59:49Z"

