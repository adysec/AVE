[basic]
description = "WordPress 的 photoblocks-grid-gallery 插件在 1.1.33 之前的版本中存在存储型跨站脚本（XSS）漏洞，攻击原理为插件在 wp-admin/admin.php?page=photoblocks-edit&id= 接口处未对用户输入进行充分过滤，导致具有较高权限的攻击者可在 id 参数中注入恶意 JavaScript 代码。当具有编辑权限的管理员或高权限用户访问包含恶意载荷的页面时，脚本会在其浏览器中执行，从而窃取会话 Cookie、篡改页面内容或发起进一步攻击。该漏洞影响所有使用受影响版本插件的 WordPress 网站，利用条件要求攻击者必须拥有较高权限账户才能触发漏洞，且需要目标管理员用户在 wp-admin 后台进行页面交互才能完成 XSS 利用。网站管理员应将 photoblocks-grid-gallery 插件升级至 1.1.33 或更高版本以修复此问题。"
published = "2019-08-30T14:15:10Z"
remediation = "立即将 WordPress 插件 photoblocks-grid-gallery（Gallery PhotoBlocks）升级至 1.1.33 或更高版本（当前最新稳定版为 1.3.4）。操作步骤：登录 WordPress 管理后台，进入「插件」→「已安装的插件」，找到 Gallery PhotoBlocks，点击「立即更新」，或前往「插件」→「安装插件」搜索 PhotoBlocks 后点击更新。如更新后页面显示异常，可临时停用该插件，并在 .htaccess 中添加规则禁止外部用户访问含 photoblocks 的路径作为临时缓解，待插件完成修复后再重新启用。"
score = 4.8
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress photoblocks-grid-gallery 插件跨站脚本漏洞"
updated = "2026-06-17T02:21:09Z"

