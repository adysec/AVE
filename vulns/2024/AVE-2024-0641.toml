[basic]
description = "Linux 内核文件系统导出层（exportfs）在处理文件句柄编码失败时存在可触发的断言（WARN_ON）漏洞。当文件系统的 `->encode_fh()` 方法因各种原因（如缓存回收、overlayfs 配置等）返回失败时，内核会错误地触发 WARN_ON 断言，导致内核崩溃或系统拒绝服务。本地低权限攻击者可通过结合 overlayfs（挂载 index=on,nfs_export=on 选项）、inotify 和 drop_caches 等操作触发该断言，造成系统可用性受损。该漏洞影响 Linux 内核 v6.6 及更早版本，CVSS 评分 5.5，危害等级中等。Linux 内核社区已通过移除错误的 WARN_ON 断言来修复此问题。"
published = "2025-01-19T12:15:26Z"
remediation = "立即将 Linux 内核升级至 6.1.151、6.6.74、6.12.10 或 6.13 及以上版本，对应补丁提交为 974e3fe0ac61、adcde2872f8f、f47c834a9131、73697928c806。如无法立即升级，可临时限制本地用户对 overlayfs（挂载 index=on,nfs_export=on）和 inotify 的访问权限以降低触发风险。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Kernel 文件句柄编码失败断言错误拒绝服务漏洞"
updated = "2026-07-14T13:17:14Z"

