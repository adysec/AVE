[basic]
description = "Trend Micro InterScan VirusWall 3.52 build 1462 存在邮件头解析绕过漏洞（Space Gap）。远程攻击者可通过发送包含违反 RFC 规范的畸形邮件头（如 Content-Type 或 Content-Transfer-Encoding 后缺少或多余空格、边界声明前缺少空格、边界值后包含多余空格）的电子邮件，绕过病毒扫描引擎的检测。Outlook Express 在处理此类畸形邮件头时与 InterScan VirusWall 的解析逻辑不一致，导致恶意附件可被正常投递至用户。该漏洞无需身份认证即可远程利用，CVSS 评分 7.5，影响机密性、完整性和可用性。"
published = "2002-07-11T04:00:00Z"
remediation = "立即升级 Trend Micro InterScan VirusWall 至 3.52 build 1462 之后的版本，该版本已修复邮件头空格绕过扫描的问题。如无法升级，可在邮件网关层面配置内容过滤规则，拦截 Content-Type 或 Content-Transfer-Encoding 等头字段中异常空格的邮件，并启用 RFC 合规性检查。由于该产品已停止支持，建议迁移至 Trend Micro 当前支持的邮件安全产品（如 Deep Security 或 ScanMail Suite）。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Trend Micro InterScan VirusWall 邮件头扫描绕过漏洞"
updated = "2026-06-16T21:57:50Z"

