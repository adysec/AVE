[basic]
description = "GnoRPM 0.95 之前版本存在符号链接攻击漏洞。当本地用户运行 GnoRPM 处理 RPM 包时，程序未对临时文件路径进行充分校验，攻击者可通过在临时目录中预先创建恶意符号链接，诱使 GnoRPM 以 root 权限写入任意系统文件，从而实现本地权限提升。该漏洞影响 Linux 系统中使用 GnoRPM 管理 RPM 包的所有发行版，攻击者需具备本地用户权限即可利用，CVSS 评分 7.2，危害等级高。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 GnoRPM 至 0.95 或更高版本，该版本已修复符号链接竞争条件。如无法升级，避免以 root 权限运行 GnoRPM，并确保临时文件目录（如 /tmp）设置了粘滞位（sticky bit），防止本地用户通过符号链接劫持提权。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "GnoRPM 符号链接攻击任意文件修改漏洞"
updated = "2026-06-16T21:52:49.983"

