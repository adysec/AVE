[basic]
description = "SLRN 软件包中的 slrnpull 组件存在缓冲区溢出漏洞。当 slrnpull 以 setuid 或 setgid 权限安装时，本地攻击者可通过向 -d（SPOOLDIR）参数传递超长字符串触发缓冲区溢出，从而获得提升的权限。该漏洞影响 SLRN 0.9.6 及之前版本，CVSS 评分 7.2，危害等级高。攻击者需拥有本地系统访问权限，利用难度较低。"
published = "2002-08-12T04:00:00Z"
remediation = "立即升级 SLRN 至 0.9.7.4 或更高版本（可从 SourceForge 获取），该版本修复了 slrnpull 的缓冲区溢出问题。如无法升级，作为临时缓解措施，移除 slrnpull 的 setuid/setgid 权限位（chmod u-s /usr/bin/slrnpull; chmod g-s /usr/bin/slrnpull），并限制仅受信任用户可本地访问系统。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "SLRN slrnpull 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:58:02Z"

