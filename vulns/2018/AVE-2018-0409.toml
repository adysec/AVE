[basic]
description = "Adobe Flash Player 存在一处释放后使用（Use-After-Free）漏洞，位于 com.adobe.tvsdk.mediacore.metadata 组件中。攻击者可通过诱导用户打开特制的 Flash 文件触发该漏洞，成功利用后可实现远程代码执行，获取与当前用户相同的系统权限。该漏洞影响 Flash Player 31.0.0.153 及更早版本，CVSS 评分 7.8，危害等级高。Adobe 已于 2018 年底发布安全更新修复，但 Flash Player 已停止维护，建议用户彻底卸载。"
published = "2019-01-18T17:29:01Z"
remediation = "Adobe 已于 2019 年 2 月发布安全公告 APSB19-06，修复版本为 Flash Player 32.0.0.142（Windows/Mac）及 32.0.0.130（Linux）。建议立即升级至该版本或更高版本。由于 Flash Player 已于 2020 年底停止支持并禁用，根本性缓解措施是彻底卸载 Flash Player，并在浏览器中禁用 Flash 插件。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Adobe Flash Player 释放后使用远程代码执行漏洞"
updated = "2026-06-17T01:43:27Z"

