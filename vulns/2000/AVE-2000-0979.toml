[basic]
description = "Mailman 1.1 邮件列表管理系统中存在命令注入漏洞，列表管理员在设置列表名称时，%(listname) 宏展开未能正确过滤 shell 元字符，攻击者可利用该漏洞在服务器上以 Mailman 进程权限执行任意系统命令，导致服务器被完全控制。该漏洞需要列表管理员权限方可利用，CVSS 评分 7.2，危害等级高。"
published = "2000-11-14T05:00:00Z"
remediation = "立即升级 Mailman 至 2.0 或更高版本，该漏洞在 2.0 中已修复，对 %(listname) 宏展开中的 shell 元字符进行了正确转义处理。如无法升级，可在 mailman 配置中禁用列表管理员通过 Web 界面创建新列表的功能，并严格限制可管理列表的用户范围。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "GNU Mailman 命令注入漏洞"
updated = "2026-06-16T21:52:37Z"

