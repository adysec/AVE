[basic]
description = "该漏洞是 Apple iPadOS IOMobileFrameBuffer 组件中的内存损坏（缓冲区错误）漏洞，源于内存处理不当，攻击者可通过构造特制的应用程序数据触发越界写入，实现内核权限的任意代码执行。该漏洞影响 iOS 14.x、iPadOS 14.x、macOS Big Sur 11.x 及 watchOS 7.x 等版本，CVSSv3.1 评分为 7.8，危害等级为高。Apple 确认该漏洞可能已被积极利用，已在 iOS 14.7.1、iPadOS 14.7.1、macOS Big Sur 11.5.1 和 watchOS 7.6.1 中修复。攻击者可通过诱导用户在受影响设备上运行恶意应用，无需交互即可获取内核级权限，进而完全控制设备并绕过沙盒限制。"
published = "2021-10-19T14:15:08Z"
remediation = '建议立即将 iPhone 升级至 iOS 14.7.1、iPad 升级至 iPadOS 14.7.1、Mac 升级至 macOS Big Sur 11.5.1。打开"设置"→"通用"→"软件更新"即可下载安装。Apple 同时发布了 watchOS 7.6.1 修复 Apple Watch 上的同一问题。若暂时无法更新，应避免打开来源不明的应用程序或文件，减少设备被利用的风险。'
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Apple iPadOS 内存损坏代码执行漏洞"
updated = "2026-06-17T03:50:55Z"

