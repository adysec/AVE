[basic]
description = "gtkhtml 是 GNOME 桌面环境中用于 HTML 渲染的组件，其 1.1.10 及之前版本中存在空指针解引用漏洞。当 Evolution 邮件客户端通过 gtkhtml 渲染邮件内容时，远程攻击者可向目标用户发送包含恶意构造消息的邮件，触发 gtkhtml 对畸形消息的处理逻辑，导致空指针解引用，进而引发程序崩溃。该漏洞无需身份认证，攻击者只需能够向目标发送邮件即可成功利用。受影响范围包括使用了 gtkhtml before 1.1.10 的 Evolution 邮件客户端及相关 GNOME 应用程序，成功利用可导致拒绝服务，造成邮件客户端不可用。"
published = "2003-09-17T04:00:00Z"
remediation = "立即升级 gtkhtml 到 1.1.10 或更高版本，该版本修复了畸形 HTML 消息导致的空指针解引用漏洞。对于 Evolution 用户，请升级到包含修复后 gtkhtml 的 Evolution 版本，并安装各 Linux 发行版发布的安全更新（Red Hat RHSA-2003:264、Debian DSA-710、Mandrake MDKSA-2003:093）。如无法立即升级，可临时配置 Evolution 以纯文本模式显示来自未知发件人的邮件，避免渲染恶意 HTML 内容。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "GNOME Evolution gtkhtml 消息处理空指针解引用拒绝服务漏洞"
updated = "2026-06-16T22:02:23Z"

