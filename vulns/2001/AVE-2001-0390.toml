[basic]
description = 'Linux 内核 2.2.17-14 之前版本在特定 Intel CPU 上存在 "mxcsr P4" 漏洞，本地用户可通过操作 MXCSR 控制寄存器触发内核异常，导致系统停机拒绝服务。该漏洞影响运行在特定 Intel Pentium 4 处理器上的 Linux 内核 2.2.17-14 之前版本，攻击者需具备本地访问权限且无需特权，通过执行特制指令序列操作 MXCSR 寄存器触发内核异常导致系统停机，CVSS 评分 2.1（AV:L/AC:L/Au:N/C:N/I:N/A:P），属低危本地拒绝服务漏洞。'
published = "2001-02-12T05:00:00Z"
remediation = "建议升级 Linux 内核至 2.2.17-14 或更高版本（如 2.4.x 稳定分支），该版本修复了 Pentium 4 上 mxcsr 寄存器导致的本地拒绝服务漏洞。若无法立即升级内核，可限制本地用户登录权限或通过 GRUB 启动参数添加 `nopentium4` 禁用 Pentium 4 特定优化作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Linux Linux Kernel mxcsr P4 本地拒绝服务漏洞"
updated = "2026-06-16T21:55:56Z"

