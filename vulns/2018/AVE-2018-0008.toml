[basic]
description = "Cisco IOS 与 Cisco IOS XE 软件在实现 Internet Key Exchange Version 1（IKEv1）功能时存在输入验证漏洞。该漏洞源于对特定 IKEv1 数据包的验证不足，未经身份认证的远程攻击者可在 IKE 协商阶段向受影响设备发送特制 IKEv1 数据包，触发设备重新加载，导致拒绝服务（DoS）攻击。该漏洞影响运行受影响 Cisco IOS 及 IOS XE 软件版本的路由器、交换机等网络设备，CVSS 评分为 7.5，危害等级为高危。Cisco 已在后续安全更新中修复该漏洞。"
published = "2018-03-28T22:29:00Z"
remediation = "Cisco 已发布修复此漏洞的软件更新，建议立即通过 Cisco IOS Software Checker（https://sec.cloudapps.cisco.com/security/center/softwarechecker.x）查询当前运行版本对应的首个修复版本，然后升级至安全的 Cisco IOS 或 IOS XE 发行版；在设备 CLI 中使用 show version 确认当前版本，使用 show ip sockets 或 show udp 检查 ISAKMP 是否启用，升级前确保设备内存充足且硬件配置受新版本支持；如无 Cisco 服务合同，请联系 Cisco TAC（https://www.cisco.com/c/en/us/support/web/tsd-cisco-worldwide-contacts.html）获取免费升级授权并提供设备序列号及本公告链接作为凭证；此漏洞无临时缓解措施，须通过升级修复。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS/IOS XE IKEv1 远程拒绝服务漏洞"
updated = "2026-06-17T01:29:58Z"

