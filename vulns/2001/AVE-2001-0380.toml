[basic]
description = "6Tunnel 0.08 及更早版本存在资源释放缺陷（CWE-772），未正确关闭客户端发起的 Socket 连接。远程未认证攻击者可通过反复建立并断开 TCP 连接，导致服务端文件描述符耗尽，引发拒绝服务（资源耗尽）。该漏洞影响 6Tunnel 0.6/0.7/0.8 版本，CVSS 3.1 评分 7.5（HIGH），攻击向量为网络、低复杂度、无需权限、无需用户交互，仅影响可用性（A:H）。攻击者只需持续发起 TCP 连接并立即断开，即可耗尽服务端文件描述符资源，导致合法连接无法建立。ExploitDB（EDB-21126）已公开 PoC 利用代码，攻击者可直接利用实施 DoS 攻击。升级至 6Tunnel 0.09 或更高版本可修复此漏洞。"
published = "2001-12-06T05:00:00Z"
remediation = "建议立即升级 6tunnel 至 0.09 或更高版本（已修复 socket 未正确关闭导致的资源耗尽漏洞）。若暂时无法升级，可在防火墙层面限制单 IP 连接频率（如 iptables 限制每分钟新建连接数），或在系统层面调整 TCP 连接超时参数（如降低 tcp_fin_timeout、启用 tcp_tw_reuse）缓解资源耗尽风险。长期建议升级至官方最新稳定版并监控连接数异常。建议立即升级 6tunnel 至 0.09 或更高版本（已修复 socket 未正确关闭导致的资源耗尽漏洞）。若暂时无法升级，可在防火墙层面限制单 IP 连接频率（如 iptables 限制每分钟新建连接数），或在系统层面调整 TCP 连接超时参数（如降低 tcp_fin_timeout、启用 tcp_tw_reuse）缓解资源耗尽风险。长期建议升级至官方最新稳定版并监控连接数异常。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "6Tunnel 6tunnel 连接断开状态拒绝服务漏洞"
