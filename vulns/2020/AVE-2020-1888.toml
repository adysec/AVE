[basic]
description = "Pulse Connect Secure（PCS）及 Pulse Policy Secure（PPS）的管理 Web 界面存在代码注入漏洞，攻击者可通过构造特制 URI 在目标设备上执行任意代码。该漏洞影响未升级至 9.1R8 版本的产品，攻击者需获得对管理界面的访问权限后方可利用。成功利用后，攻击者可完全控制设备，窃取凭据、横向移动或持久化驻留。Pulse Secure 已发布安全更新修复此漏洞，建议用户尽快升级并限制管理界面访问范围。"
published = "2020-07-30T13:15:11Z"
remediation = "立即将 Pulse Connect Secure 升级至 9.1R8 或更高版本以修复该代码注入漏洞。升级前请下载官方固件并校验完整性，升级后验证系统版本。如无法立即升级，应通过防火墙或 ACL 限制管理 Web 界面的访问来源，仅允许可信 IP 访问，同时监控 9.1R8 之前的版本是否有异常 URI 请求。"
score = 7.2
severity = "HIGH"
sources = ["kev"]
title = "Pulse Secure Pulse Connect Secure 代码注入漏洞"
updated = "2026-06-17T03:26:04Z"

