[basic]
description = "FreeBSD Ports 软件包中 ja-elvis（日文版）和 ko-helvis（韩文版）的 elvrec 程序存在缓冲区溢出漏洞。未经身份认证的本地攻击者可通过构造特制输入触发该缓冲区溢出，利用 elvrec 的 setuid root 权限将权限提升至 root 用户。该漏洞影响 FreeBSD 3.5.1 和 4.2 版本，攻击者需具有本地系统访问权限即可完成利用。"
published = "2001-06-02T04:00:00Z"
remediation = "1. 升级 ja-elvis 到 1.8.4_1 版本或 ko-helvis 到 1.8h2_1 版本，执行 `portsnap fetch update` 后进入 `/usr/ports/japanese/ja-elvis` 或 `/usr/ports/korean/ko-helvis` 目录运行 `make reinstall` 完成重建。2. 如无法立即升级，可先卸载受影响 ports：`pkg delete ja-elvis` 或 `pkg delete ko-helvis` 作为临时缓解措施，消除 elvrec 的 setuid root 风险。3. 亦可从 FreeBSD 官方 FTP 下载对应架构的 ja-elvis-1.8.4_1.tgz 或 ko-helvis-1.8h2_1.tgz 预编译包安装。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "FreeBSD Ports Package elvrec 本地缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:53:54Z"

