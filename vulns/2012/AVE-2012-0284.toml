[basic]
description = "Apple Safari 6.0 之前版本所集成的 WebKit 浏览器引擎存在内存破坏漏洞（CVE-2012-3608）。该漏洞源于 WebKit 在处理网页内容时对内存的释放与使用存在缺陷，远程攻击者可通过诱导用户访问精心构造的恶意网站，触发内存破坏并导致应用崩溃，进而实现任意代码执行或拒绝服务攻击。该漏洞无需在目标设备上预置恶意代码，仅需用户使用受影响的 Safari 版本浏览特制网页即可被触发，攻击条件为远程且无需用户认证，CVSS 评分 9.3，危害等级严重。攻击者成功利用后可在受影响的 iOS 及 macOS 设备上以当前用户权限执行任意代码，影响范围涵盖所有未升级至 Safari 6.0 的版本。Apple 已于 2012 年 7 月 25 日发布的安全更新（APPLE-SA-2012-07-25-1）中修复该漏洞，建议用户及时升级。"
published = "2012-07-25T20:55:02.417"
remediation = 'tags.<value>建议立即将 Apple Safari 升级至 6.0 及以上版本，OS X 用户可通过"软件更新"或 Mac App Store 安装官方安全更新（APPLE-SA-2012-07-25-1，参考 http://support.apple.com/kb/HT5400）；受影响的 iOS 设备应升级至 iOS 6.0 或更高版本（参考 http://support.apple.com/kb/HT5503），后续发布的 Safari/iOS 安全更新（HT5485、HT5503）亦应一并安装。如暂时无法升级，可采取临时缓解措施：避免访问不可信或来历不明的网站，在 Safari 偏好设置中禁用 JavaScript 执行，关闭"自动打开安全下载的文件"选项，并通过防火墙或代理软件拦截可疑域名，以降低恶意网页触发 WebKit 内存破坏进而执行任意代码的风险。'
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:34.157"

