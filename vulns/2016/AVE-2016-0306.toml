[basic]
description = "Windows GDI（图形设备接口）组件在处理特制网页内容时存在远程代码执行漏洞。攻击者可构造恶意网站，诱使用户访问后触发内存损坏，从而在当前用户上下文中执行任意代码。该漏洞影响 Windows Vista SP2、Windows 7 SP1、Windows 8.1、Windows 10（1511/1607）、Windows Server 2008/2012 等多个版本，CVSS 评分 7.8，危害等级高。攻击需要用户交互（如点击链接或打开附件），但无需身份认证。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），Microsoft 已在 MS16-120 安全更新中修复。"
published = "2016-10-14T02:59:30Z"
remediation = "安装 Microsoft 2016 年 9 月安全更新 MS16-120（对应 KB 编号：Windows 7/Server 2008 R2 为 KB3185330，Windows 8.1/Server 2012 R2 为 KB3185331，Windows 10 原始版为 KB3185614、1511 版为 KB3189866、1607 版为 KB3185611，Windows Vista/Server 2008 为 KB3175024），或通过 Windows Update 自动更新。该漏洞已被 CISA KEV 收录且存在公开利用代码，无法立即打补丁时应限制用户访问不可信网站，并禁用 ActiveX 控件和脚本在受限站点区域中的执行权限作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows GDI 远程代码执行漏洞"
updated = "2026-06-17T00:45:36Z"

