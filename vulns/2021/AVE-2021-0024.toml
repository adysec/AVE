[basic]
description = "tags.<value>SonicWall SMA100 系列安全移动接入设备的管理界面存在特殊元素转义处理不当漏洞，远程已认证攻击者可通过构造恶意输入注入任意操作系统命令并以 'nobody' 用户身份执行。该漏洞影响 SMA 200、SMA 210、SMA 400、SMA 410 及 SMA 500v 虚拟设备，受影响固件版本包括 9.0.0.10-28sv 及更早版本、10.2.0.7-34sv 及更早版本、10.2.1.0-17sv 及更早版本。攻击条件要求攻击者必须先通过身份认证并获得管理界面访问权限，随后利用命令注入执行任意系统命令，可导致目标设备拒绝服务，CVSSv3 评分为 6.5。CISA 已将本漏洞纳入已知被利用漏洞目录。"
published = "2021-09-27T18:15:08.383"
remediation = "立即将 SonicWall SMA100 系列（SMA 200/210/400/410/500v）固件升级至安全版本：9.0.0.11-31sv、10.2.0.8-37sv 或 10.2.1.1-19sv 及以上版本。升级前请备份当前配置，登录管理界面依次进入「系统」→「固件」→「上传固件」完成升级，升级完成后清除浏览器缓存并重启设备。如暂时无法升级，建议在防火墙规则中严格限制 SMA100 管理接口仅对可信内部网段开放，并关闭非必要的远程管理访问，同时监控设备日志中是否存在异常命令执行记录。"
score = 6.5
severity = "MEDIUM"
sources = ["kev"]
title = "SonicWall SMA 200 OS命令注入漏洞"
updated = "2026-06-17T03:33:11.067"

