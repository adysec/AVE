[basic]
description = "Apple iOS 5.1之前版本及iTunes 10.6之前版本中使用的WebKit组件存在未明内存破坏漏洞。远程攻击者可通过诱导用户访问特制网站触发内存破坏，导致任意代码执行或应用程序崩溃。该漏洞源于WebKit对内存对象处理不当，攻击者无需身份认证即可利用，CVSS评分9.3，危害等级严重。"
published = "2012-03-08T22:55:03Z"
remediation = "升级 Safari 至 5.1.4 或更高版本，升级 iOS 至 5.1 或更高版本，升级 iTunes 至 10.6 或更高版本。对于无法升级的系统，可禁用 JavaScript 或使用内容安全策略（CSP）缓解风险，但最有效的方式仍是安装 Apple 官方 2012 年 3 月安全更新。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:58Z"

