[basic]
description = "glibc2 动态链接器在处理 setuid 程序时未正确清除 LD_DEBUG_OUTPUT 和 LD_DEBUG 环境变量，导致本地攻击者可通过符号链接攻击利用调试输出重定向功能，以提升后的权限覆盖系统任意文件。该漏洞影响使用 glibc2 的 Linux 系统，攻击者需具备本地账户权限并能够触发 setuid 程序的执行，利用难度较高但危害较大，可导致敏感文件被破坏或权限提升。"
published = "2000-12-19T05:00:00Z"
remediation = "立即升级 glibc 至 2.1.94 及以上版本，该版本已修复 setuid 程序执行时 LD_DEBUG_OUTPUT 和 LD_DEBUG 环境变量未正确清除的问题。如无法升级，可在系统级禁用 setuid 二进制文件的 LD_DEBUG 功能，或通过移除 setuid 位限制受影响程序的提权执行。对于关键系统，建议监控 /tmp 目录的符号链接创建行为以检测利用尝试。"
score = 1.2
severity = "LOW"
sources = ["avd"]
title = "GNU glibc LD_DEBUG_OUTPUT 环境变量未清除导致本地符号链接攻击漏洞"
updated = "2026-06-16T21:52:51Z"

