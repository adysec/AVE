[basic]
description = "Microsoft Outlook 98 及 2000 在处理 vCard (.vcf) 电子名片文件时，未能正确校验并处理过长或格式错误的字段，导致解析逻辑出现异常。远程攻击者可以通过诱导用户打开一个经过精心构造的恶意 vCard 文件，触发该漏洞，从而导致 Outlook 客户端程序崩溃并引发拒绝服务（DoS）状态。该漏洞主要影响 Outlook 98 和 2000 版本，攻击者无需通过身份验证即可利用此漏洞影响目标系统的可用性。"
published = "2000-10-20T04:00:00Z"
remediation = "建议将 Microsoft Outlook 98/2000 升级至 Outlook 2002 或更高版本；若必须维持原版本，请安装微软官方发布的 vCard 解析安全更新补丁，或在打开来源不明的 .vcf 电子名片文件前进行严格的格式检查以避免触发拒绝服务。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Outlook 98/2000 vCard 拒绝服务漏洞"
updated = "2026-06-16T21:52:24Z"

