[basic]
description = "Windows 路由和远程访问服务（RRAS）存在堆缓冲区溢出漏洞，远程攻击者可通过向目标系统发送特制的 RRAS 请求触发该漏洞，成功利用可在目标系统上以系统权限执行任意代码。该漏洞影响多个 Windows Server 版本，攻击需要用户交互（如点击恶意链接），CVSS 评分 8.8，危害等级高危。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:31Z"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新 (KB5051987 或 KB5052105/KB5052072)，可通过 Windows Update 自动获取。如无法立即打补丁，可在服务管理控制台 (services.msc) 中禁用 Routing and Remote Access 服务，或在防火墙层面限制对 RRAS 服务端口 (1723/PPTP、500/IKE、4500/IPsec) 的入站访问作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Windows 路由和远程访问服务 (RRAS) 远程代码执行漏洞"
updated = "2026-06-17T08:42:46Z"

