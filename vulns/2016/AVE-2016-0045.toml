[basic]
description = "Opsview Monitor Pro 存在 URL 重定向漏洞（CWE-601），位于 /login 接口的 back 参数中。远程攻击者可构造恶意链接，将已登录用户重定向至任意外部网站，进而实施钓鱼攻击窃取凭据。该漏洞影响 4.5.x（未安装 2016 安全补丁）、4.6.4 之前版本、5.0.2.27475 之前版本及 5.1.0.162300841 之前版本。攻击者无需身份认证，但需诱使用户点击恶意链接，CVSS 评分 6.1，危害等级中危。"
published = "2017-05-03T10:59:00Z"
remediation = "升级 Opsview Monitor Pro 至 5.1.0.162300841 及以上版本，或 5.0.2.27475、4.6.4.162391051 及以上版本；4.5.x 分支须安装 2016 年安全补丁。如无法升级，在反向代理层对 /login 的 back 参数进行白名单校验，仅允许内部合法跳转域名。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Opsview Monitor Pro 登录页面开放重定向漏洞"
updated = "2026-06-17T00:39:32Z"

