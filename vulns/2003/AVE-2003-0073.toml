[basic]
description = "Apache 2.0.47 之前版本的 prefork MPM（多进程处理模块）在处理 accept 系统调用返回的特定错误时存在缺陷，未能正确进行异常处理。未经身份认证的远程攻击者可通过向目标 Apache 服务器发送大量精心构造的连接请求，触发 accept 错误处理逻辑中的异常路径，导致服务器进程崩溃或资源耗尽，造成拒绝服务。该漏洞影响 Apache 2.0 系列至 2.0.47 之前的所有版本，攻击复杂度低，无需认证即可远程触发。"
published = "2003-08-18T04:00:00Z"
remediation = "立即将 Apache HTTP Server 升级至 2.0.47 或更高版本（官方已停止维护 2.0 系列，建议升级至当前受支持的 2.4.x 版本）。如无法升级，可在配置中限制 Listen 指令仅绑定必要端口，并通过防火墙限制对 Apache 端口的访问来源以降低攻击面。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Apache HTTP Server 2 prefork MPM 拒绝服务漏洞"
updated = "2026-06-16T22:01:50Z"

