[basic]
description = "Joomla! 3.7.0 版本的 com_fields 组件存在 SQL 注入漏洞（CVE-2017-8917），攻击者可通过构造恶意 SQL 语句注入到数据库查询中，无需身份认证即可远程执行任意 SQL 命令，进而导致敏感数据泄露、数据篡改甚至远程代码执行。该漏洞影响 Joomla! 3.7.0 版本，已在 3.7.1 版本中修复，CVSS 评分 9.8（严重级别），攻击向量为网络远程攻击，攻击复杂度低，无需用户交互和权限认证。"
published = "2017-01-01T00:00:00Z"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
