[basic]
description = "Windows NTFS 驱动（ntfs.sys）的 NtfsQueryEaUserEaList 函数在处理文件扩展属性（EA）查询时存在整数溢出漏洞。攻击者通过 ZwSetEaFile 在 NTFS 文件上构造特制的 EA 数据结构，再利用 ZwQueryEaFile 触发溢出，覆盖相邻的内核池内存块。该漏洞影响 Windows 10 1903/1909/2004/20H2/21H1 及 Windows Server 2019/1909 等版本。攻击者需拥有本地低权限账户且无需用户交互即可利用，通过堆喷射和 WNF（Windows Notification Facility）对象可实现任意内核内存读写，最终将权限提升至 SYSTEM，完全控制目标系统。"
published = "2021-06-08T23:15:08Z"
remediation = "立即安装 Microsoft 2021 年 6 月安全更新补丁（KB5003690/KB5003697/KB5003638 等），或通过 Windows Update 自动更新至最新版本。受影响版本包括：Windows 10 Version 1809/1909/2004/20H2/21H1 各版本需升级至 10.0.17763.1999/10.0.18363.1621/10.0.19041.1052/10.0.19042.1052/10.0.19043.1052 及以上，Windows Server 2016/2019/20H2 需升级至对应构建版本，Windows 11 需升级至 KB5003690。如暂无法立即打补丁，可将 NTFS 文件系统的写入权限限制为仅管理员组（Administrators）用户，阻止低权限进程修改 NTFS 结构文件以缓解攻击面。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows NTFS 特权提升漏洞"
updated = "2026-06-17T03:52:33Z"

