[basic]
description = "Adobe Flash Player 存在边界检查漏洞（CWE-20），程序在处理特制 SWF 文件时未能正确验证内存边界，导致越界读写。远程攻击者可通过诱导用户访问恶意网页或打开包含特制 Flash 内容的文件触发该漏洞，成功利用可在受影响系统上以当前用户权限执行任意代码。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上 10.3.181.14 之前版本的 Flash Player，CVSS 评分 9.3，危害等级严重。Adobe 已在安全更新中修复此漏洞。"
published = "2011-05-13T22:55:01Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.181.14（Windows/Mac/Linux/Solaris）或 10.3.185.21（Android）以上版本。官方安全公告 APSB11-12 已提供修复。如无法升级，可在浏览器中禁用 Flash 插件或移除 Flash Player 程序以彻底消除风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 边界检查远程代码执行漏洞"
updated = "2026-06-16T23:27:46Z"

