[basic]
description = "Apple iOS 及 Safari 浏览器（6.0 之前版本）使用的 WebKit 引擎存在内存破坏漏洞。攻击者可通过构造恶意网页，触发 WebKit 处理过程中的内存越界或非法写入，导致远程代码执行或应用崩溃。该漏洞无需用户身份认证即可利用，影响 iOS 5.1.1 及更早版本以及桌面端 Safari 浏览器。Apple 已在 iOS 6.0 中修复此问题，用户应升级至最新版本以消除风险。"
published = "2012-07-25T20:55:04.570"
remediation = '立即将设备升级至 iOS 6.0 或更高版本（iPhone 3GS 及后续机型、iPad 2 及后续机型可通过 iTunes 或 OTA 方式更新），Mac 平台升级至 Safari 6.0 或更高版本。临时缓解措施：在 Safari 中禁用 JavaScript（偏好设置 → 安全 → 取消勾选"启用 JavaScript"），或使用其他浏览器访问不可信网站。'
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple iOS WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:43.057"

