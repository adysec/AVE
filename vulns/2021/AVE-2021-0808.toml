[basic]
description = "F5 BIG-IP 和 BIG-IQ 设备中的 iControl REST 管理接口存在未授权远程命令执行漏洞。由于接口缺乏有效的身份验证机制，未经身份认证的远程攻击者可通过向目标设备发送特制的 HTTP 请求，利用空的 X-F5-Auth-Token 请求头配合 Basic 认证绕过身份验证，进而调用 /mgmt/tm/util/bash 接口执行任意操作系统命令。该漏洞影响 BIG-IP 16.0.x（16.0.1.1 之前）、15.1.x（15.1.2.1 之前）、14.1.x（14.1.4 之前）、13.1.x（13.1.3.6 之前）、12.1.x（12.1.5.3 之前），以及 BIG-IQ 7.1.0.x（7.1.0.3 之前）和 7.0.0.x（7.0.0.2 之前）等版本。攻击者仅需能够通过网络访问设备的 iControl REST 接口（通常运行于管理接口的 443 端口）即可发起攻击，无需任何凭据。成功利用该漏洞可导致攻击者在设备上以高权限执行任意系统命令、创建或删除文件、禁用服务，从而完全接管设备。"
published = "2021-03-31T15:15:15Z"
remediation = "立即将 BIG-IP 升级到 16.0.1.1/15.1.2.1/14.1.4/13.1.3.6/12.1.5.3 或更高版本，BIG-IQ 升级到 7.1.0.3/7.0.0.2 或更高版本。如暂无法升级，应在管理接口防火墙上限制仅受信任的 IP 地址可访问 443 端口，或临时禁用 iControl REST 服务以降低被利用风险。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "F5 BIG-IP BIG-IQ iControl REST 未授权远程代码执行漏洞"
updated = "2026-06-17T03:38:09Z"

