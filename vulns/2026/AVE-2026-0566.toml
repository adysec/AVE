[basic]
description = "Pheditor 2.0.4 终端功能存在命令白名单绕过漏洞。该功能仅通过前缀匹配检查用户提交的命令是否以允许的命令开头，随后将完整命令字符串传递给 `shell_exec()` 执行，但未过滤 `$()` 等 shell 命令替换语法。已认证且拥有终端权限的攻击者可利用此缺陷，在允许命令后附加命令替换载荷（如 `ls$(whoami)`）绕过白名单限制，以 Web 服务器用户身份执行任意系统命令。该漏洞影响 Pheditor 2.0.4 版本，CVSS 评分 7.2，危害等级高。建议避免将用户输入直接传入 `shell_exec()`，改用精确命令匹配或参数数组方式执行进程。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级 Pheditor 至 2.0.5 或更高版本（若已发布）。如无补丁版本，手动修改 `pheditor.php` 中终端命令处理逻辑：将前缀匹配改为精确命令名匹配（`$command === $value`），并在 `shell_exec()` 前使用 `escapeshellcmd()` 对整个命令字符串转义，同时增加对 `$()`、`` ` ``、`|` 等 shell 元字符的全面拦截。若业务不需要终端功能，建议在配置中将 `TERMINAL_COMMANDS` 留空或直接禁用该功能。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Pheditor Pheditor 终端命令白名单绕过漏洞"
updated = "2026-01-01T00:00:00Z"

