[basic]
description = 'guzzlehttp/psr7 是一个 PHP PSR-7 HTTP 消息库实现。在 2.12.3 版本之前，Uri::assertValidHost() 方法未能正确拒绝包含权限分隔符（/、?、#、@、\）、内嵌端口（如 host:8080）或格式错误的 IPv6 括号（如 [::1 或 ::1]）的 URI 主机组件，导致 Uri::getHost() 返回的值与 URI 的实际权限部分不一致。攻击者若能够控制部分或全部主机输入，可利用此缺陷构造特制 URI 绕过主机白名单/黑名单检查、SSRF 防护、Cookie 作用域或代理绕过决策，造成基于主机的访问控制绕过、服务端请求伪造或 Host 头混淆攻击。该漏洞影响 guzzlehttp/psr7 及依赖其的 guzzlehttp/guzzle 库，已在 2.12.3 版本中修复。'
published = "2026-07-08T17:17:26Z"
remediation = '立即将 guzzlehttp/psr7 升级至 2.12.3 或更高版本（composer require guzzlehttp/psr7:^2.12.3）。如无法立即升级，在将不可信主机输入传入 Uri 构造函数或 withHost() 前，手动校验并过滤含 / ? # @ \ 冒号或括号不匹配的主机值，且勿将 getHost() 返回值直接用于安全决策。'
score = 4.2
severity = "MEDIUM"
sources = ["ghsa"]
title = "guzzlehttp psr7 主机验证绕过漏洞"
updated = "2026-07-17T14:29:51Z"

