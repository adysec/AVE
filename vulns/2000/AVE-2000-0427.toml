[basic]
description = "tags.<value>rpc.lockd 是 Linux 系统中用于管理网络文件锁定的 RPC 服务。Red Hat Linux 6.1、6.2 及更早版本（包括 7.0）中的 rpc.lockd 服务存在输入验证缺陷，远程攻击者可通过发送构造异常的畸形请求触发该漏洞，导致服务崩溃或系统拒绝服务。该漏洞影响范围广泛，Debian 2.1/2.2、Mandrake 6.0/6.1/7.0 及 RedHat 6.x 等主流发行版均受波及。攻击者无需任何身份认证即可在远程发起攻击，利用方式简单直接，只需向目标主机的 rpc.lockd 服务端口发送特制畸形请求，即可使服务异常终止，造成系统拒绝服务。CVSS 评分 5.0，危害等级中等。"
published = "1994-12-19T05:00:00Z"
remediation = "升级至已修复的内核或 nfs-utils 软件包（Red Hat Linux 7.0 及以后版本，或应用对应版本的 RHSA 安全勘误）。如暂无法打补丁，临时禁用 NFS 服务或在防火墙层面限制对 rpc.lockd 端口（TCP/UDP 1024）的外部访问，并重启系统以释放被占用的端口。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Red Hat Linux rpc.lockd 拒绝服务漏洞"
updated = "2026-06-16T21:51:53Z"

