[basic]
description = "PVote 1.9 之前版本（包括 1.0 和 1.5）的 ch_info.php 存在授权验证缺陷，远程未认证攻击者可直接向该脚本提交 newpass 和 confirm 参数并设置为相同的新密码，从而绕过权限控制任意修改管理员密码并获取后台特权。该漏洞攻击向量为网络、攻击复杂度低、无需身份认证，CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），影响机密性、完整性和可用性。攻击者仅需构造包含新密码的 HTTP 请求直接调用 ch_info.php 即可完成利用，无需任何前置条件或用户交互。"
published = "2002-06-18T04:00:00Z"
remediation = "立即升级 PVote 至 1.9 或更高版本，该版本修复了 ch_info.php 未授权修改管理员密码的漏洞。若暂时无法升级，可通过 Web 服务器配置（如 Apache/Nginx）禁止直接访问 ch_info.php，或在应用层添加权限校验，仅允许已认证的管理员会话调用该脚本。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "PVote 1.0/1.5 未经授权管理密码修改漏洞"
updated = "2026-06-16T21:57:43Z"

