[basic]
description = "fshd (fsh daemon) 是 Debian GNU/Linux 系统中的远程 Shell 守护进程。该服务在处理文件写入时未对符号链接进行充分验证，本地攻击者可利用符号链接攻击（symlink attack）将 fshd 写入的文件重定向到其他用户的文件，从而覆盖或篡改目标文件内容。成功利用该漏洞可导致其他用户的文件被恶意修改，影响系统文件完整性和用户数据安全。攻击者需要具备本地登录权限才能创建符号链接并触发该漏洞，进而对系统造成未经授权的数据破坏。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 Debian 系统中 fsh 软件包至 1.0.post.1-3potato 或更高版本，该版本已修复 fshd 守护进程中的符号链接漏洞。可通过执行 apt-get upgrade fsh 应用官方安全更新，并重启 fshd 服务使修复生效。若无法立即升级，建议临时禁用 fshd 服务（使用 update-rc.d -f fshd remove）以消除攻击面。具体修复细节请参考 Debian 安全公告 DSA-2000-113。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Debian GNU/Linux fshd 本地文件覆盖漏洞"
updated = "2026-06-16T21:53:13Z"

