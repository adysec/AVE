[basic]
description = "Windows 数字媒体组件存在越界读取漏洞，该漏洞源于对内存边界检查不充分。具有低权限的攻击者需物理访问目标系统方可利用此漏洞，成功利用可导致权限提升，获取系统级访问权限，从而完全控制受影响系统。该漏洞影响多个 Windows 版本，Microsoft 已在 2025 年 1 月安全更新中修复。"
published = "2025-01-14T18:15:35Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 KB5049981（适用于 Windows 10 22H2/21H2，更新后版本号为 19044.5371/19045.5371）或 KB5050008（适用于 Windows Server 2019，更新后版本号为 17763.6775）。可通过 Windows Update 自动获取更新，也可从 Microsoft Update Catalog 手动下载安装。该漏洞需要物理访问权限，如无法立即打补丁，应限制对受影响系统的本地访问权限。"
score = 6.6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows Digital Media 特权提升漏洞"
updated = "2026-06-17T08:42:50Z"

