[info]
author = "AVE"
description = "检测 WordPress Newspaper 主题（tagDiv）6.4-6.7.1 版本是否安装。通过访问 /wp-content/themes/Newspaper/style.css 提取版本号，若版本在 6.4 至 6.7.1 之间则判定存在权限访问控制缺失漏洞（CVE-2016-10972），该漏洞允许未认证攻击者通过 td_ajax_update_panel 接口提升权限至管理员。"
id = "POC-AVE-2016-0050"
name = "WordPress Newspaper Theme Privilege Escalation PoC"
severity = "critical"
tags = ["ave-2016-0050"]
vuln_id = [
    "CVE-2016-10972",
    "AVE-2016-0050",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/wp-content/themes/Newspaper/style.css"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Newspaper"]
