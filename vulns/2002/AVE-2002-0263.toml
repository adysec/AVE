[basic]
description = "teTeX 软件包中的 dvips PostScript 转换器在处理打印作业时，不安全地调用 system() 函数且未对输入进行充分验证。远程未认证攻击者可通过提交包含恶意字体指令的特制 PostScript 打印作业，触发 dvips 执行任意系统命令，从而在目标系统上获得命令执行权限。该漏洞影响使用 teTeX 软件包的 Linux 发行版（如 Red Hat Linux、Debian、Mandrake、Conectiva 等）中的打印服务组件，攻击向量为网络打印服务（如 LPD、CUPS）接收恶意打印任务，无需用户交互即可远程触发，CVSS 7.5 分（AV:N/AC:L/Au:N/C:P/I:P/A:P），影响机密性、完整性和可用性。"
published = "2002-10-28T05:00:00Z"
remediation = "建议升级 teTeX 至 2.0.2 及以上版本（包含 dvips 5.92a 修复版本），或升级至 TeX Live 2003 及以上版本。若无法立即升级，可在打印服务器配置中禁用 dvips 的 -R 选项（禁止外部命令执行），或在打印队列配置中限制仅允许受信任的字体文件，禁止处理未受信的 PostScript 打印作业。临时缓解措施：在防火墙层面限制打印服务端口（如 515/tcp、631/tcp）仅允许受信任 IP 访问。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "teTeX tetex dvips 命令执行漏洞"
updated = "2026-06-16T21:58:13Z"

