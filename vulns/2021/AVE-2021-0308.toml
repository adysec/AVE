[basic]
description = "该漏洞为 Chromium 浏览器 Blink 渲染引擎中的释放后使用（Use After Free）漏洞。当用户使用受影响版本的 Google Chrome 访问恶意网页时，攻击者可通过构造特制的 HTML 页面触发该漏洞，导致堆内存损坏，进而可能实现任意代码执行。该漏洞影响 Google Chrome 89.0.4389.128 之前的所有版本，攻击者无需权限即可通过网络远程利用，且用户只需访问攻击者控制的网页即可触发，利用条件简单，危害等级高。"
published = "2021-04-26T17:15:08.213"
remediation = "立即将 Google Chrome 升级至 89.0.4389.128 或更高版本，可通过 Chrome 菜单「帮助」→「关于 Google Chrome」自动检查并安装更新。如为 Chromium 衍生浏览器（如 Microsoft Edge、Brave），请同步升级至对应最新稳定版本。若暂无法立即更新，建议暂时避免访问未知网站或启用 Chrome 的安全浏览功能以降低被 crafted HTML 页面利用的风险。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome Blink 释放后使用漏洞"
updated = "2026-06-17T03:35:02.093"

