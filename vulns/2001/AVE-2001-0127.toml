[basic]
description = "Joe Text Editor 2.8 存在本地权限提升与任意命令执行漏洞。该编辑器在启动时会在当前工作目录（CWD）中搜索 .joerc 配置文件，而非仅从用户主目录加载配置。在多用户系统或共享目录环境中，攻击者可预先放置包含恶意命令的 .joerc 特洛伊木马文件，当其他用户从该目录执行 joe 编辑器时，恶意配置将被自动加载并执行，从而获取目标用户的权限或执行任意命令。该漏洞无需身份认证，攻击复杂度低，CVSS v2 评分 4.6，危害等级中等，主要影响 Linux/Unix 多用户环境。"
published = "2001-05-03T04:00:00Z"
remediation = "建议升级 Joe 编辑器到 2.9.5 或更高版本，该版本已修复当前工作目录（CWD）中 .joerc 配置文件的任意命令执行漏洞。如暂无法升级，可临时将 JOE 的配置文件路径设置为仅从 $HOME/.joerc 和 /usr/local/lib/joerc 读取，或通过修改启动脚本强制指定 -rc 参数指向系统级配置文件，避免在当前目录中加载未受信的 .joerc。此外，应避免在共享或世界可写目录中执行 joe 命令，并定期检查系统是否存在恶意 .joerc 文件。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Joseph Allen Joe Text Editor 任意命令执行漏洞"
updated = "2026-06-16T21:54:02Z"

