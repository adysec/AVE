[basic]
description = 'Internet Explorer 5.5 和 6.0 在 Windows 2000 系统上处理 FTP 链接时存在跨站脚本漏洞。当用户启用了"为 FTP 站点启用文件夹视图"和"在文件夹中启用 Web 内容"选项后，IE 会通过 ftp.htt 文件来渲染 FTP 站点的目录内容。由于该文件未对 FTP URL 中的主机名部分进行充分的过滤和转义，远程攻击者可在 FTP 服务器的主机名中嵌入恶意的脚本代码或 HTML。当用户访问攻击者构造的特制 FTP URL 时，恶意脚本将在用户的浏览器中执行，从而窃取用户的 Cookie、会话令牌等敏感信息，或对用户执行其他恶意操作。攻击者无需任何身份认证即可实施攻击，但需要用户主动点击恶意链接。'
published = "2002-12-31T05:00:00Z"
remediation = '建议立即安装 Internet Explorer 的最新累积安全更新（MS02-047 补丁 Q323759），或通过 Windows Update 自动更新至 IE 5.5 SP2 / IE 6.0 SP1 及以上版本。如无法立即打补丁，可打开 Internet 选项，在高级设置中禁用"启用文件夹视图以显示 FTP 站点"和"在文件夹中启用 Web 内容"选项，或直接删除 %systemroot%\system32\ftp.htt 文件作为临时缓解措施。'
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer 5/6 FTP Web View 跨站点脚本漏洞"
updated = "2026-06-16T22:00:34Z"

