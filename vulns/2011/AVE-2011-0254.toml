[basic]
description = "Google Chrome 17.0.963.46 之前版本中存在释放后使用（Use-after-free）漏洞，该漏洞源于 Cascading Style Sheets（CSS）标记序列处理过程中的内存管理错误。远程攻击者可通过构造特制的 CSS 内容诱导用户访问恶意网页，触发已释放内存的访问，导致浏览器崩溃拒绝服务，或可能造成其他未明影响。攻击需要用户交互，降低了利用难度。"
published = "2012-02-09T04:10:29Z"
remediation = "立即升级 Google Chrome 至 17.0.963.46 或更高版本，该版本已修复 CSS 标记序列处理中的释放后重用漏洞。如使用 Apple Safari，请升级至 6.0 或更高版本。无法立即升级时，可禁用 JavaScript 或使用内容安全策略（CSP）作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome CSS 标记序列释放后使用漏洞"
updated = "2026-06-16T23:34:13Z"

