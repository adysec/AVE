[basic]
description = "McAfee WebShield SMTP 4.5 存在安全绕过漏洞，远程攻击者可通过在附件文件名中包含扩展 ASCII 字符，绕过邮件内容过滤规则，使得恶意附件得以通过安全网关进入内部网络。该漏洞影响 McAfee WebShield SMTP 4.5 版本，CVSS 评分 7.5，危害等级高。攻击者无需身份认证即可远程利用，成功利用后可导致机密性、完整性和可用性部分受损。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 McAfee WebShield SMTP 至 4.5 以上版本，或迁移至 McAfee 后续替代产品（如 McAfee Email Gateway）。如无法升级，在邮件安全策略中配置对附件文件名含扩展 ASCII 字符的邮件进行隔离或拦截，并启用深度内容检测规则。同时建议在网络边界部署独立反垃圾邮件网关作为补充防护。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "McAfee WebShield SMTP 安全绕过漏洞"
updated = "2026-06-16T21:53:12Z"

