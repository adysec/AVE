[basic]
description = "WordPress promobar插件（版本低于1.1.1）存在多个跨站脚本（XSS）漏洞。该漏洞源于程序对用户输入的数据未进行充分的过滤与转义处理，攻击者可利用该漏洞向页面中注入恶意JavaScript代码。当管理员或其他用户访问受影响的页面时，注入的恶意脚本会在浏览器中执行，导致敏感信息泄露、会话劫持或页面内容篡改。攻击者无需身份认证即可发起攻击，但需要诱使用户点击恶意链接或访问特制页面。CVSS评分6.1，危害等级中等。"
published = "2019-08-20T16:15:12Z"
remediation = "立即将 WordPress promobar 插件升级至 1.1.1 或更高版本，该版本已修复多个跨站脚本漏洞。如无法立即更新，可暂时停用该插件，或通过 Web 应用防火墙（WAF）添加规则过滤恶意脚本注入请求作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "BestWebSoft WordPress Promobar插件跨站脚本漏洞"
updated = "2026-06-17T01:13:02Z"

