[basic]
description = "Linux 内核 CIFS 客户端模块在处理 acdirmax 挂载选项时存在整数溢出漏洞。用户提供的 acdirmax 参数类型为 u32，在未进行上限验证前被转换为 jiffies 时间单位，可能导致整数溢出。具有 CIFS 文件系统挂载权限的本地低权限攻击者可构造特制的超大 acdirmax 值触发该漏洞，造成内核崩溃或拒绝服务，影响系统可用性。"
published = "2025-04-01T16:15:27Z"
remediation = "升级 Linux 内核至包含修复的版本：Debian 12 (bookworm) 升级到 6.1.133-1 或更高版本，Debian 11 (bullseye) 需通过 bullseye-security 源升级到 6.1.137-1~deb11u1，Ubuntu 22.04 LTS 升级到 5.15.0-142.152 或更高版本，Ubuntu 24.04 LTS 升级到 6.8.0-84.84 或更高版本。临时缓解措施：避免在挂载 CIFS/SMB 文件系统时使用 acdirmax 挂载参数，或将其值限制在安全范围内。长期建议：持续关注 Linux 内核安全更新，及时应用包含 commit 5b29891f91dfb8758baf1e2217bef4b16b2b165b 修复的内核版本。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 CIFS 整数溢出漏洞"
updated = "2026-06-17T08:44:43Z"

