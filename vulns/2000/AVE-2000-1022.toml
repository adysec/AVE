[basic]
description = 'Metertek pagelog.cgi 存在目录遍历漏洞，攻击者可通过向脚本的 "name" 或 "display" 参数发送包含点点序列 (`../`) 的恶意请求，利用程序对输入验证不足和路径拼接不安全的漏洞，从而实现读取服务器上的任意文件。该漏洞影响所有部署 Metertek pagelog.cgi 的用户，攻击者无需身份验证即可远程触发，利用路径拼接技巧绕过访问控制，获取系统敏感文件，包括用户凭据、数据库配置、源代码等机密信息，可能导致进一步系统渗透和数据泄露。漏洞根源在于应用程序缺乏对用户输入的有效过滤和路径规范化处理，导致攻击者能够构造出包含目录遍历序列的路径，最终实现获取目标系统文件内容的恶意目的。'
published = "2000-12-19T05:00:00.000"
remediation = "建议立即更新 Metertek pagelog.cgi 到最新官方补丁版本。如无法直接获取补丁，请禁用 CGI 执行权限并删除或重命名 pagelog.cgi 文件以彻底修复此漏洞。作为临时缓解措施，可在 Web 服务器配置中限制访问 pagelog.cgi 目录，仅允许 trusted IP 地址访问。"
score = 6.4
severity = "MEDIUM"
sources = ["epss"]
title = "Metertek pagelog.cgi 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:52:48.903"

