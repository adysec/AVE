[basic]
description = "RealNetworks RealPlayer 的 RealAudio 编解码器存在内存破坏漏洞，远程攻击者可通过构造特制的 RealMedia 文件中的音频流触发堆内存损坏，导致任意代码执行或拒绝服务。该漏洞影响 RealPlayer 11.0~11.1、RealPlayer SP 1.0~1.1.4、Mac 版 11.0~12.0.0.1444 及 Linux 版 11.0.2.1744，攻击者只需诱使用户打开恶意媒体文件即可触发，无需额外认证，CVSS 评分 9.3，危害严重。"
published = "2010-12-14T16:00:04Z"
remediation = "立即升级 RealPlayer 至 12.0.1.609 或更高版本。Windows 用户可通过 RealPlayer 内置更新功能（帮助→检查更新）获取最新版，或从 RealNetworks 官网下载安装包覆盖安装。Linux 用户应升级至 11.0.2.1744 以上版本。如无法立即升级，建议在浏览器中禁用 RealPlayer 插件，并避免打开来源不明的 .rm/.ra 媒体文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer RealAudio编解码器堆内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:24:41Z"

