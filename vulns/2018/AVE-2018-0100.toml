[basic]
description = "Microsoft COM for Windows 在处理序列化对象时存在安全漏洞，未能正确验证反序列化数据，导致远程代码执行。该漏洞属于不安全的反序列化（CWE-502），攻击者可通过诱导用户打开特制文件或访问恶意网站触发漏洞，在目标系统上以当前用户权限执行任意代码。影响范围包括 Windows 7、Windows Server 2008/2012/2016、Windows 8.1、Windows 10 及 Windows RT 8.1 等多个版本。利用需要用户交互，但无需身份认证，CVSS 评分 8.8，危害等级高。Microsoft 已在 2018 年 5 月安全更新中修复此漏洞。"
published = "2018-05-09T19:29:00Z"
remediation = "立即安装 Microsoft 2018 年 5 月安全更新，通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载对应版本累积更新。受影响系统包括 Windows 7、Windows Server 2008/2012/2016、Windows 8.1、Windows 10 及 Windows RT 8.1。如无法立即打补丁，可配置 COM 对象权限限制非管理员调用，或禁用 Microsoft COM 在 Internet Explorer 中的实例化作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft COM for Windows 远程代码执行漏洞"
updated = "2026-06-17T01:31:44Z"

