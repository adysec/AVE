[basic]
description = "IBM Informix Web Datablade 3.x 及 4.1 版本存在目录遍历漏洞，远程攻击者可通过向目标服务器发送特制的 HTTP 请求，利用路径遍历符（如 ../）绕过访问限制，读取服务器上任意文件。该漏洞影响 IBM Informix Web Datablade 全系列版本，攻击者无需身份认证即可利用，可能导致敏感信息泄露。目前官方已发布安全公告，建议升级至最新版本或应用补丁。"
published = "2001-11-22T00:00:00Z"
remediation = "升级到 IBM Informix 的受支持版本（如 Informix 11.7 及以上），其内置 Web 服务已不再使用独立的 Web DataBlade 组件。如无法升级，在 Web 服务器（如 Apache）层面配置 URL 重写规则，拦截包含 `../` 的 LO 参数请求；或在 ifx CGI 前部署反向代理，对 LO 参数做路径规范化校验，拒绝包含 `..` 的输入。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "IBM Informix Web Datablade 目录遍历漏洞"
updated = "2001-11-22T00:00:00Z"

