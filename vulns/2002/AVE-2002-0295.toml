[basic]
description = "Sun Cobalt RaQ XTR 2.0/3.0/4.0 管理界面中的 MultiFileUploadHandler.php 组件存在身份认证绕过漏洞。攻击者可通过在系统上创建本地符号链接指向临时文件，随后请求 MultiFileUpload.php 接口，利用符号链接攻击绕过身份验证机制，从而实现对任意文件的覆盖写入。该漏洞影响 Cobalt RaQ XTR 相关版本，攻击者需具备本地用户权限且能通过符号链接操纵文件系统，可导致系统配置被篡改或权限提升。"
published = "2002-08-12T04:00:00Z"
remediation = "由于 Cobalt RaQ XTR 及其相关版本（2.0/3.0/4.0）已停止维护，建议通过禁用或删除管理接口中的 MultiFileUpload.php 脚本来消除风险。若必须使用，应将 Web 服务器运行权限限制为最低，并禁用系统层面的符号链接创建权限，防止攻击者通过 symlink 覆盖系统关键文件。"
score = 3.7
severity = "LOW"
sources = ["exploitdb"]
title = "Sun Cobalt RaQ XTR 身份认证绕过漏洞"
updated = "2026-06-16T21:57:25Z"

