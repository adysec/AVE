[info]
author = "AVE"
description = "检测目标服务器上 CVSWeb 1.80 的 cvsweb CGI 脚本是否存在不安全的 Perl open 函数调用漏洞。攻击者利用 CVS 仓库写入权限创建含 shell 元字符的文件名，当 cvsweb 显示目录列表时触发命令执行。PoC 通过访问 cvsweb 目录列表页面验证 CGI 脚本是否可访问。"
id = "POC-AVE-2000-0524"
name = "CVSWeb 1.80 CGI 远程命令执行漏洞 PoC"
severity = "high"
tags = [
    "cve-2000-0670",
    "cvsweb",
    "rce",
]
vuln_id = [
    "CVE-2000-0670",
    "AVE-2000-0524",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi-bin/cvsweb/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "cvsweb",
    "CVSWeb",
    "CVS Repository",
]
