[basic]
description = "OpenOffice.org Impress 组件在处理 Truevision TGA（TARGA）图像文件时存在堆缓冲区溢出漏洞。攻击者可通过构造恶意的 TGA 文件嵌入 ODF 或 Microsoft Office 文档中，诱使用户在受影响版本（OpenOffice.org 2.x 及 3.3 之前版本）中打开，触发堆缓冲区溢出，导致应用程序崩溃或远程代码执行。CVSS 评分 9.3，危害严重，无需身份认证即可远程利用。"
published = "2011-01-28T22:00:05Z"
remediation = "升级 OpenOffice.org 至 3.3 或更高版本，该版本已修复 TGA 文件解析中的堆缓冲区溢出漏洞。如无法立即升级，避免打开来源不明的 ODF 或 Office 文档，并在邮件网关层面拦截可疑的 TGA 附件。Linux 发行版用户可通过包管理器（如 apt upgrade openoffice.org 或 yum update openoffice.org）安装安全更新。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apache OpenOffice Impress TGA图像处理堆缓冲区溢出漏洞"
updated = "2026-06-16T23:25:13Z"

