[basic]
description = "TIS Firewall Toolkit (FWTK) 中的 x-gw 组件存在格式化字符串漏洞，本地攻击者可通过向 display name 参数提交特制的格式化字符串触发该漏洞，导致任意代码执行。攻击者需拥有本地访问权限，成功利用后可完全控制受影响系统，CVSS 评分 7.2，危害等级高。"
published = "2000-12-19T05:00:00.000"
remediation = "建议立即应用 TIS Firewall Toolkit (FWTK) 官方补丁（参见 Bugtraq 2000 年 10 月公告）。由于 FWTK 已停止维护，强烈建议迁移至现代防火墙方案（如 Linux iptables/nftables 或 BSD pf）。临时缓解措施：限制本地用户对 x-gw 二进制文件的执行权限，移除其 setuid/setgid 位，并严格限制可登录系统的用户范围。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "TIS Firewall Toolkit 格式化字符串代码执行漏洞"
updated = "2026-06-16T21:52:50.270"

