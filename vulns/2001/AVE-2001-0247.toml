[basic]
description = "Red Hat Linux 6.2 系统内置的 inetd 超级服务程序在处理内部服务（如 chargen、daytime、echo 等）的 TCP 连接时，未能正确关闭已建立的套接字描述符。未经身份认证的远程攻击者可通过连续向目标主机发起大量针对这些内部服务的连接请求，导致系统套接字资源被耗尽，从而使 inetd 无法再处理新的连接请求，最终造成拒绝服务。该漏洞影响运行 Red Hat Linux 6.2 且启用 inetd 服务的系统，攻击者无需任何凭据即可在远程触发，CVSS 评分 5.0，危害等级为中等。"
published = "2001-06-02T04:00:00Z"
remediation = "应用 Red Hat 官方安全公告 RHSA-2001:006 发布的 inetd 补丁包，使用 up2date 或 yum 命令升级 inetd 软件包至修复版本。如无法立即打补丁，临时缓解措施为编辑 /etc/inetd.conf 文件，注释或删除 chargen、daytime、echo、discard 等非必需内部服务行，保存后执行 killall -HUP inetd 重启 inetd 进程使配置生效。鉴于 Red Hat Linux 6.2 已停止官方支持，建议长期迁移至受支持的 Red Hat Enterprise Linux 版本以彻底消除安全风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Red Hat Linux 6.2 inetd 拒绝服务漏洞"
updated = "2026-06-16T21:54:04Z"

