[basic]
description = "PHP 5.3.x 至 5.3.3 版本中 phar 扩展的 stream.c 文件存在格式化字符串漏洞，由于 phar_stream_flush 函数对 phar:// URI 处理不当，导致错误信息被传递至 php_stream_wrapper_log_error 函数时未正确过滤格式化字符串。远程攻击者可通过构造特制的 phar:// URI 触发该漏洞，从而读取进程内存中的敏感信息，甚至可能执行任意代码。此漏洞源于 CVE-2010-2094 的不完整修复。"
published = "2010-09-28T18:00:02Z"
remediation = "升级 PHP 至 5.3.4 或更高版本，该版本已修复 phar_stream_flush 函数中的格式字符串漏洞。如无法立即升级，可在 php.ini 中禁用 phar 扩展（extension=phar.so 前加分号注释），并避免在 Web 应用中处理用户提交的 phar:// URI。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "PHP PHP 5.3.x phar扩展phar_stream_flush格式化字符串漏洞"
updated = "2026-06-16T23:21:49Z"

