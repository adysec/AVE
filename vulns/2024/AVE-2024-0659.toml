[basic]
description = "Linux 内核 IMX JPEG 驱动程序的 detach_pm() 函数中存在空指针解引用漏洞。该问题源于代码未正确检查 jpeg->pd_dev[i] 是否为错误指针（ERR_PTR），而是仅检查了非 NULL 条件，导致将错误指针传递给 pm_runtime_suspended() 函数时触发内核崩溃（Oops）。本地攻击者可通过加载特定的 JPEG 解码设备并触发驱动卸载流程来利用此漏洞，造成拒绝服务（系统崩溃）。该漏洞影响 Linux 内核多个版本，CVSS 评分 5.5，危害等级中等。"
published = "2025-02-27T02:15:10Z"
remediation = "立即更新 Linux 内核至包含修复 commit 的版本：Ubuntu 22.04 LTS 升级至 linux-image-5.15.0-140-generic（5.15.0-140.150）或更高版本；Ubuntu 20.04 LTS 升级至 linux-image-5.15.0-140-lowlatency（5.15.0-140.150~20.04.1）；Debian 11 应用 DLA-4102 安全更新。执行 `sudo apt update && sudo apt upgrade` 后重启系统生效。如无法立即更新，可通过禁用 imx-jpeg 内核模块（`sudo modprobe -r imx-jpeg`）作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel IMX JPEG 驱动空指针解引用漏洞"
updated = "2026-06-17T08:14:21Z"

