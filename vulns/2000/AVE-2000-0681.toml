[basic]
description = "Pegasus Mail 3.12 版本在处理 mailto: 协议链接时存在缺陷。远程攻击者可以通过构造一个包含特定 -F 参数的嵌入式 URL 链接，诱导受害者点击，从而触发软件的文件转发功能，导致攻击者能够以附件形式读取或获取受害者计算机上的任意本地文件。该漏洞影响使用 Pegasus Mail 3.12 的用户，攻击条件为受害者触发特制链接，可能导致敏感信息泄露。"
published = "2000-12-19T05:00:00.000"
remediation = "建议将 Pegasus Mail 升级至 3.13 或更高版本，以修复 mailto 协议处理逻辑。若无法升级，建议在客户端设置中禁用不必要的外部协议链接处理，或在接收可疑邮件时避免点击包含特殊参数（如 -F）的 URL 链接。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "David Harris Pegasus Mail 3.12 任意文件读取漏洞"
updated = "2026-06-16T21:52:47.510"

