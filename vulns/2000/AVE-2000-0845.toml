[basic]
description = "BSD 及 Linux 系统 lpr 软件包中的行式打印机守护进程（lpd）存在权限提升漏洞。本地攻击者可通过利用 lpd 调用 sendmail 时传递任意命令行参数（如使用 -C 选项指定自定义配置文件）的方式，以 root 权限执行恶意代码。该漏洞影响多种 Linux 发行版及 BSD 系统，CVSS 评分为 10.0，危害等级严重。攻击者需拥有本地系统访问权限，无需认证即可利用，成功后可完全控制目标系统。"
published = "2000-01-08T05:00:00Z"
remediation = "立即升级 lpr 软件包至修复版本：Red Hat Linux 用户安装 RHSA-2000-002 提供的更新 lpr RPM 包；Debian 用户升级至 lpr 0.48-2000.01.09 及以上版本；SGI IRIX 用户应用补丁 20021104-01-P。如无法立即升级，可限制本地用户对 lpd 的访问权限，移除 lpr 的 setuid 位（chmod u-s /usr/bin/lpr），并确保 sendmail 调用时使用受限制的命令行参数。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Linux lpr 行式打印机守护进程本地权限提升漏洞"
updated = "2026-06-16T21:53:24Z"

