[basic]
description = "Linux 内核 2.4.20 之前版本中的 ixj 电话卡驱动程序存在缓冲区溢出漏洞。本地攻击者可利用该漏洞通过向驱动程序发送特制的请求触发缓冲区溢出，导致系统部分机密性、完整性和可用性受损。攻击需要本地系统访问权限，攻击复杂度较低，CVSS 评分 4.6，危害等级中危。"
published = "2004-03-03T05:00:00Z"
remediation = "升级 Linux 内核至 2.4.20 或更高版本以修复 ixj 电话卡驱动中的缓冲区溢出漏洞。Red Hat 用户可安装 RHSA-2004-044 或 RHSA-2004-106 提供的更新内核包。如无法立即升级，可通过 `rmmod ixj` 卸载 ixj 驱动模块，或在 `/etc/modprobe.d/` 中添加 `blacklist ixj` 禁止自动加载作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux ixj 电话卡驱动缓冲区溢出漏洞"
updated = "2026-06-16T21:59:34Z"

