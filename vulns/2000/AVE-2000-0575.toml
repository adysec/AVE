[basic]
description = "PHP-Nuke 1.0 及 2.5 版本中的 admin.php3 管理页面存在权限验证绕过漏洞。该漏洞源于程序未正确验证管理员密码，远程攻击者无需提供 aid 或 pwd 参数即可直接访问管理后台，从而获取管理员权限。攻击者只需向目标服务器发送特制的 URL 请求即可利用，无需身份认证，可导致敏感信息泄露、页面篡改甚至完全控制网站。"
published = "2000-10-20T04:00:00.000"
remediation = "立即升级 PHP-Nuke 至 2.5 以上版本，或修改 admin.php3 源码，在文件开头添加会话认证检查逻辑，验证 aid 和 pwd 参数非空且与数据库存储的哈希值匹配。如无法升级，建议在 Web 服务器（如 Apache）层面对 admin.php3 路径添加 IP 白名单或 HTTP 基本认证作为临时缓解措施。由于 PHP-Nuke 已停止维护，强烈建议迁移至仍在安全更新的 CMS 平台。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "PHP-Nuke 管理权限提升漏洞"
updated = "2026-06-16T21:52:23.560"

