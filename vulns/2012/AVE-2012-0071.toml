[basic]
description = "该漏洞是针对WebKit引擎的跨站脚本（XSS）漏洞，影响使用该引擎的Apple Safari和iOS等浏览器。攻击者可通过向目标发送包含恶意Web脚本或HTML的请求，利用未修复的WebKit解析漏洞实现代码注入。该漏洞影响Safari 5.1.4及更早版本，以及iOS 5.1之前的版本，攻击者无需身份验证即可远程触发，在浏览器渲染网页过程中执行恶意脚本，可窃取用户会话、劫持用户会话或执行其他恶意操作。此类攻击通常通过精心 crafted的网页实现，用户访问受控网站时自动触发，攻击过程透明且难以察觉。该漏洞被归类为CWE-79类型安全漏洞，CVSS评分4.3，表明其安全影响中等，具有网络攻击面，攻击复杂度适中。该漏洞已在Microsoft和Apple的安全更新中得到修复，建议用户立即更新到最新版本以获取保护。"
published = "2012-03-08T22:55:01Z"
remediation = "建议立即升级 Apple iOS 至 5.1 或更高版本，或将 Safari 浏览器升级至 5.1.4 及以上版本。如暂时无法升级，可在浏览器设置中禁用 JavaScript 作为临时缓解措施，并避免访问不可信网站。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari 跨站脚本漏洞"
updated = "2026-06-16T23:37:52Z"

