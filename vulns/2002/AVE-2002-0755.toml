[basic]
description = "QNX 实时操作系统（RTOS）4.25 和 6.1.0 中的 phgrafx-startup 及 phrafx 程序在执行系统命令前未正确降权，保留了较高权限。本地已登录用户可通过修改 PATH 环境变量，将其指向包含恶意 crttrap 程序的目录，使这些高权限进程加载并执行攻击者控制的命令，从而实现本地权限提升。该漏洞影响 QNX RTOS 4.25 和 6.1.0 版本，CVSS 评分 7.2，危害等级高，攻击者无需额外身份认证即可在本地环境中获取提升的权限并执行任意系统命令。"
published = "2002-12-31T05:00:00Z"
remediation = "将 QNX RTOS 升级至官方已修复 phgrafx-startup 和 phrafx 权限降权问题的后续版本，并确认这两个程序在调用 system() 前已执行 setuid(getuid()) 正确降权。如暂时无法升级，可执行 chmod u-s /usr/photon/bin/phgrafx-startup /usr/photon/bin/phrafx 移除 setuid 位，或限制普通用户的 PATH 环境变量以阻止恶意 crttrap 程序被加载，作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "QNX RTOS 本地权限提升漏洞"
updated = "2026-06-16T22:00:32Z"

