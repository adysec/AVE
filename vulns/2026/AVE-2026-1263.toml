[basic]
description = "标签之间。<value>MSI Center 的 NTIOLib_X64.sys 驱动程序中存在来源验证不当漏洞（CWE-346），由于驱动未充分验证命令来源，攻击者可利用此缺陷在受影响的安装上提升权限。该漏洞影响安装了 MSI Center 的 Windows 系统，攻击者需首先在目标系统上获得执行低权限代码的能力，随后可通过特制输入触发漏洞，最终以 SYSTEM 上下文执行任意代码，实现本地权限提升。CVSS 评分为 7.8，危害等级为高。"
published = "2026-07-29T20:17:12.980"
remediation = "升级 MSI Center 到 2.0.69.0 或更高版本以修复 NTIOLib_X64.sys 驱动的命令来源验证缺陷。如无法立即更新，可暂时卸载 MSI Center 或通过组策略限制普通用户对驱动程序的加载权限作为临时缓解。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "MSI Center NTIOLib_X64 驱动本地权限提升漏洞"
updated = "2026-07-31T04:17:24.730"

