[basic]
description = "PHP 3.x 和 4.x 版本的错误日志记录机制存在格式化字符串漏洞，由于未对用户输入的格式化字符串进行适当过滤和清理，远程未授权攻击者可通过构造恶意格式化字符串触发错误消息写入日志，利用格式化字符串漏洞实现任意代码执行。该漏洞影响 PHP 3.0.16、4.0.2 等早期版本，CVSS 评分 10.0（严重），攻击向量为网络远程、低复杂度、无需认证，可导致机密性、完整性、可用性完全丧失。攻击者可通过 Web 请求注入包含格式化说明符（如 %n、%s、%x 等）的参数，诱导 PHP 记录错误日志时处理这些格式化字符串，从而控制程序执行流程或读写内存任意地址，最终获取服务器控制权。"
published = "2000-12-19T05:00:00Z"
remediation = "建议立即升级 PHP 至 3.0.17 或 4.0.3 及以上版本（已修复该格式化字符串漏洞）。若无法立即升级，可在 php.ini 中设置 display_errors=Off 和 log_errors=Off 禁用错误显示与记录，并在 Web 服务器层面限制对错误日志文件的写入权限作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "PHP PHP 格式化字符串漏洞"
updated = "2026-06-16T21:52:52Z"

