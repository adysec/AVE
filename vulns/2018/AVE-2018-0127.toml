[basic]
description = "Zoho ManageEngine OpManager 12.3 Build 123196 之前版本中存在 SQL 注入漏洞。该漏洞源于 /oputilsServlet 接口未进行身份认证，远程攻击者可直接构造恶意请求获取 API 密钥，进而通过 /api/json/device/setManaged 接口的 name 参数注入恶意 SQL 语句，导致数据库敏感信息泄露。攻击者还可利用获取的 API 密钥通过 Firewall Analyzer 的 /api/json/v2/admin/addUser 接口添加管理员账户，实现未授权访问。该漏洞无需任何权限即可远程利用，影响范围广泛。"
published = "2018-09-21T03:29:00Z"
remediation = "建议立即将 Zoho ManageEngine OpManager（及配套 Firewall Analyzer）升级至 12.3 Build 123196 或更高版本，该版本已修复 /oputilsServlet 接口未授权访问及 /api/json/device/setManaged 参数 SQL 注入问题。如暂时无法升级，请在防火墙或 Web 应用防火墙（WAF）层面将 /oputilsServlet 与 /api/json 路径的未授权外部访问阻断，限制仅内部可信网段可访问管理接口，同时排查系统是否已存在异常管理员账户并立即删除。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Zoho ManageEngine OpManager SQL注入漏洞"
updated = "2026-06-17T01:45:37Z"

