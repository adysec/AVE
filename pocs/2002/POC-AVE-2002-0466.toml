[info]
author = "AVE"
description = "Opera 6.0.1及6.0.2版本任意文件泄漏漏洞验证。通过HTTP服务部署包含换行符的input type=file标签的恶意HTML页面，当目标使用受影响版本Opera访问时，可静默上传客户端本地文件。"
id = "POC-AVE-2002-0466"
name = "Opera 6.0.1/6.0.2 Arbitrary File Disclosure PoC"
severity = "medium"
tags = [
    "cve-2002-0898",
    "opera",
    "file-disclosure",
]
vuln_id = [
    "CVE-2002-0898",
    "AVE-2002-0466",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["200"]
