[basic]
description = "Linux 内核网络团队（team）驱动中存在字符串选项验证不足漏洞（CWE-908）。由于 TEAM_OPTION_TYPE_STRING 类型选项在处理用户通过 netlink 套接字传入的数据时未确保字符串以空字符（nul byte）结尾，导致内核代码在调用字符串格式化函数（如 vsnprintf）时读取未初始化内存，触发 KMSAN 报告的 uninit-value 错误。具有低权限的本地攻击者可通过构造恶意的 netlink 消息向 team 接口发送特制选项设置请求，成功利用该漏洞可导致内核信息泄露或系统拒绝服务。该漏洞影响使用受影响内核版本的 Linux 系统，攻击者需具备本地访问权限和低级别系统权限即可触发。上游已在补丁中强制校验用户数据包含空字符以修复此问题。"
published = "2025-02-27T03:15:19.553"
remediation = "升级内核到Red Hat Enterprise Linux 9.3版本或更高版本，以获取包含RHSA-2025:20518安全更新；或者立即应用相应的内核安全补丁。如果无法立即应用补丁，可临时限制对team网络设备的非授权访问，并确保所有网络操作都经过适当的权限验证。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel team 驱动 TEAM_OPTION_TYPE_STRING 输入验证不当漏洞"
updated = "2026-06-17T08:44:16.603"

