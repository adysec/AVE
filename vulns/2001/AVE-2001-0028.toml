[basic]
description = 'tags.<value>Cat Soft Serv-U FTP Server 2.4/2.5版本存在目录遍历漏洞（CWE-22），在2.5i之前版本中，未经身份认证的远程攻击者可通过向服务器发送特制的CD命令，在路径中追加类似"/..%20."的遍历字符串，突破FTP根目录限制，读取服务器上的任意文件。该漏洞利用方式简单，无需认证即可触发，可能导致敏感配置文件、凭证信息等被泄露。CVSS评分为5.0，危害等级中等。'
published = "2001-02-16T05:00:00.000"
remediation = '立即将 Serv-U FTP Server 升级至 2.5i 或更高版本，该版本已修复目录遍历漏洞。若无法立即升级，可临时在 FTP 服务配置中禁用 CD 命令或限制用户主目录权限，阻止用户通过 `cd \..%20.` 等特殊路径跳出 FTP 根目录。同时在防火墙层面限制 FTP 端口（21）的访问来源，仅允许受信任的 IP 地址连接，以降低被利用的风险。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Cat Soft Serv-U FTP Server FTP目录遍历漏洞"
updated = "2026-06-16T21:53:34.147"

