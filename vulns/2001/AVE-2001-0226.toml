[basic]
description = "PHP Apache 模块 4.0.4 及更早版本存在安全绕过漏洞。远程攻击者无需认证即可向未受 .htaccess 限制的页面发送特制的畸形 HTTP 请求，导致 PHP 错误地将访问控制规则应用于后续请求的页面，从而绕过 .htaccess 的访问限制，获取受限资源的读取权限。该漏洞影响运行 mod_php 的 Apache Web 服务器，CVSS 评分 5.0，危害等级中危。"
published = "2001-03-12T05:00:00.000"
remediation = "建议升级 PHP Apache 模块至 4.0.5 或更高版本。Red Hat 用户应安装 RHSA-2000-136 提供的更新包；Debian 用户应用 DSA-020 安全更新；Mandrake 用户安装 MDKSA-2001-013 补丁。如无法升级，可在 Apache 配置中禁用 PHP 的 .htaccess 覆盖功能（AllowOverride None）作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "PHP Apache 模块 .htaccess 访问限制绕过漏洞"
updated = "2026-06-16T21:53:40.240"

