[basic]
description = "NLnet Labs Unbound 解析器 1.24.1 及之前版本存在域名劫持漏洞，攻击者可在 DNS 响应中注入未经请求的 NS 资源记录集（RRSet）及其对应地址记录，利用碎片攻击或数据包伪造等方式，诱使解析器更新域名的授权委派信息，从而实现域名劫持。该漏洞影响使用 Unbound 作为 DNS 解析器的各类系统，攻击者需处于同一网络段（邻近网络）才能利用，CVSS 评分 5.7，危害等级中危。Unbound 1.24.1 已通过清理非请求 NS RRSet 部分缓解该问题，1.24.2 进一步增强了清理机制。"
published = "2025-10-22T13:15:29Z"
remediation = "升级 Unbound 至 1.24.2 或更高版本，该版本在 1.24.1 的基础上额外修复了 YXDOMAIN 和非引用 nodata 响应中的混杂 NS 记录问题。如无法立即升级，可在 Unbound 配置中启用 `scrub: yes` 并配置 `qname-minimisation: yes` 以降低缓存投毒风险，同时在网络边界部署 DNSSEC 验证并过滤非预期的 DNS 响应包。"
score = 5.7
severity = "MEDIUM"
sources = ["msrc"]
title = "NLnet Labs Unbound 域名劫持漏洞"
updated = "2026-06-17T08:30:23Z"

