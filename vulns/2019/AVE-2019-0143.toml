[basic]
description = "tags.<value>Rumpus FTP Web File Manager 8.2.9.1 的登录页面存在反射型跨站脚本（XSS）漏洞。攻击者可构造包含恶意 JavaScript 代码的链接，诱使已登录的管理员或终端用户点击该链接。当用户在浏览器中打开此恶意链接时，注入的脚本将在用户会话上下文中执行，从而窃取会话令牌、Cookie 或其他敏感信息。该漏洞影响 Rumpus FTP Web File Manager 8.2.9.1 及可能的其他受影响版本，CVSS 评分为 6.1，危害等级为中等。攻击条件为：目标系统运行受影响版本的 Rumpus FTP Web File Manager，且受害者需登录系统并点击攻击者构造的恶意链接。"
published = "2019-12-16T16:15:11.737"
remediation = "升级 Maxum Rumpus FTP Web File Manager 至厂商最新版本（访问 https://www.maxum.com/Rumpus/Download.html 下载），修复登录页面反射型跨站脚本漏洞。对无法立即升级的环境，在 Web 服务器或反向代理层对请求参数进行输入过滤，拦截包含 `<script>`、`onload`、`javascript:` 等关键字的恶意载荷，降低被利用风险。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Rumpus FTP Web File Manager 跨站脚本漏洞 漏洞"
updated = "2026-06-17T02:26:34.480"

