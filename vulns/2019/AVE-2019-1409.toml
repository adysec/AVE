[basic]
description = "QNAP Photo Station 的 video.php 文件存在不当访问控制漏洞，远程未经身份认证的攻击者可通过特制 HTTP 请求直接访问本应受限的后端接口，无需任何权限即可在目标系统上执行任意代码。该漏洞影响多版本 QNAP NAS 设备上的 Photo Station，CVSS 评分 9.8，危害等级严重。攻击者只需知道目标设备的网络地址即可远程触发，无需用户交互。QNAP 已发布安全更新修复此漏洞，建议用户升级 Photo Station 至最新版本。"
published = "2019-12-05T17:15:12Z"
remediation = "根据 QNAP 官方安全公告 NAS-201911-25，请按以下版本对应升级 Photo Station：QTS 4.4.1 升级至 6.0.3 及以上、QTS 4.3.4-4.4.0 升级至 5.7.10 及以上、QTS 4.3.0-4.3.3 升级至 5.4.9 及以上、QTS 4.2.6 升级至 5.2.11 及以上。操作路径：QTS Web 管理界面 → App Center → 已安装应用 → Photo Station → 检查更新。如无法立即升级，可在防火墙或反向代理层面限制对 /photo/ 路径的匿名访问作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "QNAP Photo Station 远程代码执行漏洞"
updated = "2026-06-17T02:40:14Z"

