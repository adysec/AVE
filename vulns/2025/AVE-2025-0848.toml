[basic]
description = "Microsoft Purview 存在服务端请求伪造（SSRF）漏洞（CWE-918），授权攻击者可利用该漏洞向内部网络资源发送特制请求，从而越权读取敏感信息。攻击者需具备有效身份认证，无需用户交互即可通过网络远程利用。该漏洞影响 Microsoft Purview 数据治理与合规服务，CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞，建议用户尽快安装补丁。"
published = "2025-01-09T22:15:29Z"
remediation = "Microsoft 已通过服务端更新修复 Microsoft Purview 中的 SSRF 漏洞，用户无需手动操作，Purview 服务会自动更新至修复版本。作为深度防御措施，建议在 Purview 扫描规则中限制出站网络目标，仅允许访问白名单内的内部服务端点，并启用网络隔离策略防止 SSRF 横向移动。同时监控 Purview 的异常出站请求日志，及时发现利用尝试。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Purview 服务器端请求伪造信息泄露漏洞"
updated = "2026-06-17T08:43:15Z"

