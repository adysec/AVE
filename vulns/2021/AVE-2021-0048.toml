[basic]
description = "Microsoft Enhanced Cryptographic Provider 存在特权提升漏洞，本地攻击者可利用加密服务提供程序中的权限校验缺陷，通过执行特制应用程序提升至 SYSTEM 权限。该漏洞影响 Windows 10、Windows Server 2019/2022 等版本，CVSS 评分 5.2（中危），攻击向量为本地、需低权限、无需用户交互。成功利用可导致权限提升、敏感信息泄露及系统完整性破坏。Microsoft 已于 2021 年 6 月补丁周二发布安全更新修复此漏洞。"
published = "2021-06-08T23:15:08Z"
remediation = "安装 Microsoft 2021 年 6 月安全更新（Windows 10 对应 KB5003635/KB5003637，Windows Server 对应 KB5003646），将受影响操作系统升级至以下构建版本：Windows 10 1809 升级至 10.0.17763.1999，Windows 10 1909 升级至 10.0.18363.1621，Windows 10 21H1 升级至 10.0.19043.1052，Windows Server 2016 升级至 10.0.14393.4467，Windows Server 2019 升级至 10.0.17763.1999，Windows Server 20H2 升级至 10.0.19042.1052。可通过 Windows Update 自动更新或手动下载对应 KB 补丁安装。如暂无法立即打补丁，建议临时限制低权限用户访问 Microsoft Enhanced Cryptographic Provider 的调用权限，并监控系统中异常权限提升行为。"
score = 5.2
severity = "MEDIUM"
sources = ["kev"]
title = "Microsoft Enhanced Cryptographic Provider 特权提升漏洞"
updated = "2026-06-17T03:51:26Z"

