description = "CVE-2001-0083是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-02-12T05:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-097 发布的补丁（KB Q281256），该补丁修复了 Windows Media Unicast Service 的内存泄漏问题。Windows Media Services 4.1 用户可直接在受影响系统上安装此补丁；Windows 2000 用户可等待 Windows 2000 SP3 发布后升级以获取修复。Windows Media Services 4.0 用户需单独安装对应版本的补丁，无法通过其他产品服务包获取。安装补丁后重启 Windows Media Services 服务以确保生效。"
