[basic]
description = "SquirrelMail 1.2.10、1.2.9及更早版本的read_body.php文件中存在跨站脚本(XSS)漏洞。远程攻击者无需身份认证，可通过在mailbox或passed_id参数中注入恶意脚本和HTML代码发起攻击。当用户访问包含恶意构造参数的邮件页面时，注入的脚本将在受害者的浏览器中以当前用户权限执行，导致Cookie泄露、会话劫持、敏感邮件内容窃取或页面内容篡改等危害。该漏洞影响所有使用受影响版本SquirrelMail的Web邮件系统，攻击条件为攻击者能够诱使或强制用户访问包含恶意构造URL的页面。利用方式为构造包含JavaScript代码的特殊URL并发送给目标用户，一旦用户点击链接即可触发漏洞执行。Debian、Red Hat等发行版已发布安全公告和补丁修复此问题。"
published = "2002-12-18T05:00:00Z"
remediation = "建议立即升级到 SquirrelMail 1.4.20 或更高版本，该版本修复了 read_body.php 中的 XSS 漏洞。升级时请确保同时更新所有依赖组件，包括 PHP 版本要求为 5.6+。如无法立即升级，可在 Apache/Nginx 配置中添加参数 `AcceptPathInfo=OFF` 和 `Options -MultiViews` 以缓解 XSS 风险，并严格验证 mailbox 和 passed_id 参数输入。"
score = 6.8
severity = "MEDIUM"
sources = ["redhat"]
title = "SquirrelMail SquirrelMail 跨站脚本漏洞"
updated = "2026-06-16T21:59:08Z"

