[basic]
description = "pam_mysql（MySQL 可插拔认证模块）0.4.7 之前版本在构造 SQL 语句时未正确过滤用户输入，存在 SQL 注入漏洞。远程攻击者无需认证即可利用该漏洞，通过向目标系统发送特制的认证请求触发注入，从而获取数据库中的明文密码或密码哈希值。该漏洞影响所有使用 pam_mysql 0.4.7 之前版本的系统，CVSS 评分 7.5，危害等级高。建议升级至 0.4.7 或更高版本以修复此漏洞。"
published = "2000-12-19T05:00:00Z"
remediation = "升级 pam_mysql 至 0.4.7 或更高版本，该版本修复了用户输入未正确过滤导致的 SQL 注入问题。如无法立即升级，可在 PAM 配置中暂时禁用 pam_mysql 模块，改用其他认证方式（如 pam_unix）作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "pam_mysql 可插拔认证模块SQL注入漏洞"
updated = "2026-06-16T21:52:51Z"

