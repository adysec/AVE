[basic]
description = "Windows 2000 Telnet 服务在处理用户身份信息时存在信息泄露漏洞，当接收到格式错误的用户标识（userid）时，服务会返回不同的响应，使攻击者能够推断系统中是否存在特定用户账户（如 Guest 账户）。该漏洞影响 Windows 2000 系统的 Telnet 服务组件，未经身份认证的远程攻击者可利用此漏洞探测目标系统中用户账户的存在性，或绕过域名验证直接登录 Telnet 服务器，进而可能获取对服务器的未授权访问。攻击复杂度低，无需身份认证即可远程利用，CVSS 评分 7.5，危害等级中高。"
published = "2001-07-21T04:00:00Z"
remediation = """
标签中。

我选择：
<value>安装 Microsoft 安全公告 MS01-031 发布的补丁。由于 Windows 2000 已终止扩展支持，建议立即升级到受支持的 Windows 版本（如 Windows Server 2019/2022 或 Windows 10/11）并安装最新安全更新。如暂时无法升级，应立即禁用 Telnet 服务：依次打开"控制面板→管理工具→服务"，找到 Telnet 服务，将其启动类型设置为"已禁用"并停止服务；同时在边界防火墙或 Windows 防火墙中阻断 TCP 23 端口的入站访问，以限制攻击面。"""
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Windows 2000 Telnet 服务信息泄露漏洞"
updated = "2026-06-16T21:54:08Z"

