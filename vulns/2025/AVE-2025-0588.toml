[basic]
description = "PHP getimagesize() 函数在多块模式读取图片（如通过 php://filter）时，由于 php_read_stream_all_chunks() 函数存在缓冲区指针未前移的缺陷，导致未初始化的堆内存尾部字节残留并泄露至 APPn 段（如 APP1），造成敏感堆内存信息泄露。该漏洞影响 PHP 8.1.34 之前版本、8.2.30 之前版本、8.3.29 之前版本、8.4.16 之前版本及 8.5.1 之前版本，CVSS 4.0 评分 6.3（中危）。攻击者可通过网络远程触发，攻击复杂度高、无需权限和用户交互，成功利用可泄露服务器敏感堆内存数据，影响目标服务器机密性。PHP 官方已在 8.1.34、8.2.30、8.3.29、8.4.16、8.5.1 版本中修复该漏洞，建议尽快升级修复。"
published = "2025-12-27T20:15:40Z"
remediation = "建议立即升级 PHP 到 8.1.34、8.2.30、8.3.29、8.4.16 或 8.5.1 及以上版本。若暂时无法升级，可在 php.ini 中禁用 php://filter 流包装器（disable_functions=php://filter），或避免在 getimagesize() 中使用 php://filter 读取多块图像数据，作为临时缓解措施。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "PHP Group PHP getimagesize 内存信息泄漏漏洞"
updated = "2026-06-17T08:35:27Z"

