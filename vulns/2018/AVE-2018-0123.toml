[basic]
description = "LG SuperSign CMS 的 qsr_server/device/getThumbnail 接口中 sourceUri 参数存在代码注入漏洞（CWE-94）。远程攻击者无需身份认证即可通过构造特制的 HTTP 请求向该参数注入恶意代码，从而在服务器端执行任意命令，完全控制目标系统。该漏洞影响 LG SuperSign EZ CMS 2.5 及更早版本，CVSS 评分 9.8，危害等级严重。目前已有公开的 Exploit-DB 利用代码，攻击门槛极低。"
published = "2018-09-21T17:29:07Z"
remediation = "立即升级 LG SuperSign CMS 至官方修复版本（高于 2.5），或升级 SuperSignEZ 至高于 1.3 的版本。如无法升级，在防火墙层面限制对 9080 端口的访问，仅允许受信任管理 IP 连接；同时部署 WAF 规则拦截对 `/qsr_server/device/getThumbnail` 路径的请求，并对 `sourceUri` 参数中的命令执行特征（如 `;`、`|`、`$()` 等 shell 元字符）进行过滤。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "LG SuperSign CMS 远程代码执行漏洞"
updated = "2026-06-17T01:45:28Z"

