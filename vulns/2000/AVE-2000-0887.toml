[basic]
description = "Network Associates WebShield SMTP 4.5 版本在处理邮件地址时存在输入验证缺陷。远程攻击者可通过向 SMTP 服务发送特制的邮件地址请求，触发程序异常导致服务崩溃或资源耗尽，从而实现拒绝服务（DoS）攻击。该漏洞影响 WebShield SMTP 4.5 及相关版本，攻击者无需身份认证即可在网络环境下触发，直接导致邮件过滤服务不可用，影响系统稳定性。"
published = "2000-10-20T00:00:00Z"
remediation = "建议立即将 Network Associates WebShield 升级至 4.6 或更高版本，或迁移至更现代的邮件过滤网关。若无法立即升级，应在防火墙层面限制 SMTP 端口（TCP 25）的访问来源，仅允许受信任的 IP 地址连接以缓解潜在的拒绝服务攻击。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "McAfee WebShield SMTP 拒绝服务漏洞"
updated = "2000-10-20T00:00:00Z"

