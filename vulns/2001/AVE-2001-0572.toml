[basic]
description = "Microsoft PowerPoint 2000 的文件加载器解析机制存在缓冲区溢出漏洞。攻击者可通过诱使用户打开特制的 PowerPoint 文件触发该漏洞，导致攻击者能够以当前用户权限执行任意代码。该漏洞需要本地访问且利用复杂度较高，但一旦成功利用可完全控制受影响系统。受影响的版本包括 Microsoft PowerPoint 2000，用户应安装 Office 2000 相关安全更新进行修复。"
published = "2001-02-12T05:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS01-002 提供的补丁：PowerPoint 97 用户下载补丁（FamilyID: 30789303-25B1-482F-BFE5-5A47C7DB2EDC），PowerPoint 2000 用户升级至版本 9.0.4190 或安装对应补丁（FamilyID: 5C011C70-47D0-4306-9FA4-8E92D36332FE）。如无法打补丁，避免打开来源不明的 .ppt 文件，并禁用 PowerPoint 中文件解析器的 ActiveX 控件作为临时缓解措施。"
score = 6.2
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft PowerPoint 2000 缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:53:28Z"

