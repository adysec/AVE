[basic]
description = "MIT Kerberos 5（krb5）1.2.7 及更早版本的密钥分发中心（KDC）存在数组越界读取漏洞（Array Overrun）。已通过身份认证的远程攻击者可通过向同一域内的 KDC 发送特制的协议请求触发该漏洞，导致 KDC 进程崩溃，造成拒绝服务。该漏洞影响 Kerberos 5 1.2.7 及之前版本，CVSS 评分 5.0，危害等级中危。Red Hat 将其标记为重要（Important）安全漏洞，建议用户升级至修复版本。"
published = "2003-04-02T05:00:00Z"
remediation = "升级 MIT Kerberos 5 至 1.2.8 或更高版本。Red Hat 用户安装 RHSA-2003:051/RHSA-2003:052 提供的更新包；Debian 用户安装 DSA-266 提供的更新包；Solaris 用户安装 Sun 补丁 54042-1。如无法升级，可应用 MIT 官方补丁 MITKRB5-SA-2003-005-patch 修复 krb5 主体名处理中的数组越界问题，并在 KDC 上限制仅受信任的认证客户端可发起请求以降低攻击面。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "MIT Kerberos 5 KDC 数组越界读取拒绝服务漏洞"
updated = "2026-06-16T22:01:27Z"

