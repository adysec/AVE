[basic]
description = "SGI IRIX 操作系统的 Telnet 守护进程 (telnetd) 存在格式字符串漏洞，影响 IRIX 5.2 至 6.1 版本。漏洞原理是 telnetd 在处理 IAC-SB-TELOPT_ENVIRON 请求时，未对用户注入的 RLD 环境变量进行格式字符串清理，导致攻击者可构造恶意格式字符串实现任意代码执行。攻击条件为远程未授权，攻击者仅需向目标发送包含超长 RLD 变量的特制 Telnet 协议数据包即可触发。CVSS 评分 10.0 (AV:N/AC:L/Au:N/C:C/I:C/A:C)，危害等级为严重，可导致系统完全沦陷。ExploitDB 已公开利用代码 (EDB-ID: 20149)。"
published = "2000-10-20T04:00:00Z"
remediation = "立即升级到最新的IRIX 6.x补丁包（建议>=6.5），关闭不必要的telnet服务，或通过修改telnet服务器源代码修复格式字符串处理漏洞，避免在IAC-SB-TELOPT_ENVIRON请求中使用用户控制的RLD变量。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Silicon Graphics IRIX TelnetD 格式字符串漏洞"
updated = "2026-06-16T21:52:22Z"

