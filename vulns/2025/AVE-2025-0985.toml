[basic]
description = "tags as requested.<value>Linux 内核 LoongArch 架构的 IP 校验和优化代码中存在越界读取漏洞。提交 69e3a6aa6be2 为 64 位系统添加的校验和优化功能在处理负数长度时会发生未定义移位操作，导致越界读取内核内存数据。本地低权限攻击者可通过构造特制的网络报文触发该漏洞，读取内核堆内存中的敏感信息，造成信息泄露或系统崩溃。该漏洞影响采用 LoongArch 架构且运行受影响版本 Linux 内核的系统，攻击者需具备本地访问权限并拥有低权限账户才能成功利用。该问题与 ARM64 架构上类似的校验和代码漏洞（由提交 8bd795fedb84 修复）属同一类型缺陷，CVSS 评分为 7.3（高危）。"
published = "2025-02-27T03:15:19.763"
remediation = "升级 Linux 内核至已修复版本：6.6.79、6.12.16、6.13.4 或 6.14-rc3 及以上。受影响版本包括 6.4.x 至 6.6.78、6.7.x 至 6.12.15 以及 6.13.0 至 6.13.3。如使用企业发行版，请通过包管理器安装对应内核安全更新（如 Debian bookworm 升级至 6.12.16-1）。如无法立即升级，可临时通过 sysctl 限制 LoongArch 架构上网络数据包处理路径，减少攻击面，但根本解决方案仍是升级内核。上游修复提交为 6287f1a8c16138c2ec750953e35039634018c84a，补丁在 arch/loongarch/lib/csum.c 中增加了负长度边界检查。"
score = 7.3
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 LoongArch IP 校验和代码缓冲区越界读取漏洞"
updated = "2026-07-30T06:21:30.987"

