[basic]
description = "WordPress 的 ScoreMe 主题（2016-04-01 及之前版本）存在反射型跨站脚本漏洞（XSS），由于对搜索参数 `s` 的输入过滤不严，攻击者可将恶意 JavaScript 代码注入 URL 中。当已登录的低权限用户点击特制链接时，恶意脚本会在用户浏览器中执行，可能导致会话 Cookie 窃取、页面内容篡改或重定向至钓鱼站点。该漏洞 CVSS 评分 5.4，危害等级中危，需用户交互触发。"
published = "2019-09-17T15:15:12Z"
remediation = "该漏洞源于 ScoreMe 主题未对 `s` 参数进行过滤导致反射型 XSS。由于该主题自 2016 年后已停止更新维护，建议立即更换为官方仍在维护的 WordPress 主题（如 Twenty Twenty-Four）。如无法更换主题，可编辑主题的 `search.php` 文件，对 `$_GET['s']` 参数使用 `esc_html()` 或 `wp_kses_post()` 函数进行输出转义处理，同时在 WordPress 后台「设置→讨论」中关闭「使用关键词搜索」功能作为临时缓解措施。"
score = 5.4
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress ScoreMe 主题跨站脚本漏洞"
updated = "2026-06-17T00:40:46Z"

