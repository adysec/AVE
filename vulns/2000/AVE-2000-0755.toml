[basic]
description = "Serv-U FTP Server 2.5.x 存在暴力破解绕过漏洞。该软件内置了防暴力破解机制（anti-hammering），用于限制同一 IP 的多次登录尝试。然而，远程攻击者可先以有效用户身份（如匿名用户）成功登录，随后利用已建立的会话绕过该限制机制，对服务器上其他用户的密码进行暴力猜解。攻击者无需身份认证即可实施该攻击，成功后可获取其他用户的 FTP 访问权限，进而读取、写入或删除服务器上的文件，导致敏感信息泄露或服务器被进一步控制。"
published = "2000-12-11T05:00:00Z"
remediation = "升级 Serv-U FTP Server 至 3.0 及以上版本，该版本修复了反暴力破解绕过漏洞。如无法升级，建议禁用匿名登录、在防火墙层面限制 FTP 端口（默认 21）的源 IP 范围、配置系统级账户锁定策略（连续 5 次失败后锁定 30 分钟），并启用详细日志审计以监控异常登录行为。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Cat Soft Serv-U FTP Server 暴力破解漏洞"
updated = "2026-06-16T21:53:00Z"

