[basic]
description = "DC Shop 1.002 beta 版本存在配置缺陷，默认情况下将敏感文件（包括 orders.txt 和 auth_user_file.txt）存储于 cgi-bin 目录中。攻击者无需身份验证即可通过 HTTP GET 请求直接访问这些文件。攻击者可利用此漏洞获取用户凭证、交易订单等敏感数据，威胁网站系统安全。该漏洞影响 Windows 及 Web 应用环境，CVSS 评分 6.92，危害等级较高。攻击者可借助简单网络请求实施信息泄露，破坏系统保密性。（≥50字）"
published = "2001-12-06T05:00:00Z"
remediation = '立即将 DCShop 敏感文件（orders.txt、auth_user_file.txt）移出 cgi-bin 目录至 Web 不可访问路径；在 Web 服务器配置中添加拒绝访问 *.txt 文件的规则（如 Apache 使用 <Files "*.txt"> Require all denied </Files>）；若官方仍有更新版本请升级至最新版，否则建议更换成熟电商系统。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "DC Scripts DCShop Beta 1.0 02 文件泄露漏洞"
updated = "2026-06-16T21:55:01Z"

