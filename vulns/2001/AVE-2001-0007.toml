[basic]
description = "ISC BIND 8.2.x 版本在处理事务签名（TSIG）的代码中存在堆缓冲区溢出漏洞。未经身份验证的远程攻击者可通过向目标 DNS 服务器发送特制的 TSIG 请求数据包触发该溢出，由于 BIND 以 root 权限运行，成功利用后可获得目标系统的 root 权限，实现完全接管。该漏洞影响 BIND 8.2.x 全系列版本，攻击复杂度低且无需任何认证凭据，CVSS 评分 10.0，危害等级严重。攻击者可通过构造畸形 TSIG 记录覆盖内存关键区域，最终执行任意代码或造成服务拒绝。ISC 已发布安全公告建议升级至 BIND 9.x 或应用相应补丁。"
published = "2001-02-12T05:00:00Z"
remediation = "建议立即将 BIND 升级到 8.2.2 或更新版本以修复 TSIG 堆缓冲区溢出漏洞。若无法立即升级，可临时禁用 TSIG 签名验证功能，或通过防火墙限制对 DNS 端口的访问，仅允许可信 IP 进行交互。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "ISC BIND 8 TSIG 远程堆缓冲区溢出漏洞"
updated = "2026-06-16T21:53:29Z"

