[basic]
description = "SAP Internet Graphics Server（IGS）存在XML外部实体（XXE）注入漏洞。由于IGS在处理XMLCHART功能时未正确验证XML外部实体，远程未经身份认证的攻击者可通过向目标系统发送特制的XML请求触发该漏洞，导致IGS服务拒绝服务（不可用）。该漏洞影响SAP IGS 7.20、7.20EXT、7.45、7.49及7.53版本，CVSS评分7.5，危害等级高。SAP已发布安全补丁修复此漏洞。"
published = "2018-02-14T12:29:01Z"
remediation = "立即应用 SAP Security Note 2525222 提供的补丁，将 SAP Internet Graphics Server (IGS) 升级至修复版本。SAP 已于 2018 年 2 月 Patch Day 发布该安全补丁，修复了 IGS 7.20、7.20EXT、7.45、7.49、7.53 版本中 XMLCHART 组件对 XML 外部实体（XXE）校验不严的问题。可通过 SAP Launchpad 下载补丁并参照 Note 说明进行安装。如无法立即打补丁，可在网络层面限制对 IGS XMLCHART 端口的非授权访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "SAP Internet Graphics Server XML外部实体注入漏洞"
updated = "2026-06-17T01:55:37Z"

