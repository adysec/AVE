[basic]
description = "XMB（eXtreme Message Board）论坛 1.6x 及更早版本中存在跨站脚本（XSS）漏洞。远程攻击者无需身份认证即可通过在 IMG 标签中插入恶意脚本代码，当其他用户浏览包含该恶意 IMG 标签的页面时，脚本将在其浏览器中自动执行，导致攻击者可以窃取用户会话 Cookie、发起钓鱼攻击或以受害用户身份执行任意操作。该漏洞影响 XMB Forum 1.6 pre-beta 及之前版本，CVSS 评分 7.5，危害等级高。"
published = "2002-06-25T04:00:00Z"
remediation = "升级 XMB 论坛至 1.9.8 或更高版本（访问 https://www.xmbforum2.com/ 下载），该版本已验证不受此漏洞影响。如无法立即升级，需在论坛配置中过滤用户输入内容，对 `[img]` 标签内的 `javascript:` 等协议和 HTML 事件处理器（如 onerror、onload）做严格转义处理，禁止在 IMG 标签中插入可执行脚本。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "XMB Forum 跨站脚本漏洞"
updated = "2026-06-16T21:57:12Z"

