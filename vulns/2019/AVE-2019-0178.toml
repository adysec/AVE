[basic]
description = "YouPHPTube Encoder 的 /objects/getImageMP4.php 接口存在命令注入漏洞，base64Url 参数未对用户输入进行充分过滤。未经身份认证的远程攻击者可构造包含恶意操作系统命令的请求，利用该漏洞在服务器上执行任意代码，导致服务器被完全控制。该漏洞影响 YouPHPTube Encoder 2.3 版本，CVSS 评分 9.8，危害等级严重。"
published = "2019-10-25T18:15:11Z"
remediation = "将 YouPHPTube Encoder 升级至 2.4 或更高版本，或迁移至 AVideo-Encoder 7.0 及以上版本；如暂无法升级，可在 Web 服务器配置中禁止外部直接访问 /objects/getImageMP4.php，并检查服务器日志排查是否存在历史攻击痕迹。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "YouPHPTube Encoder 远程命令执行漏洞"
updated = "2026-06-17T02:37:10Z"

