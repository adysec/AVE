[basic]
description = "Fission 在 v1.25.0 之前的版本中，`pkg/utils/utils.go` 的 `SanitizeFilePath` 函数通过 `strings.HasPrefix` 校验路径是否位于安全目录下，但该方法仅执行词法匹配而未校验路径分隔符边界。攻击者可通过在共享卷中预先创建或控制一个以安全目录名开头的兄弟目录（例如使用 `/packages-extra` 绕过对 `/packages` 的限制），从而实现路径穿越。该漏洞影响 builder 的 Clean 处理器以及 fetcher 的 Fetch 和 Upload 处理器，允许具有相关权限的租户在预期安全目录之外进行读写操作。此问题已在 v1.25.0 版本中通过引入 `os.Root` 强制执行内核级目录限制而修复。"
published = "2026-06-10T18:17:13Z"
remediation = "建议立即将 Fission 升级至 v1.25.0 或更高版本。该版本通过引入 `os.Root` 机制替代了存在缺陷的 `SanitizeFilePath` 函数，从内核层面强制执行目录禁锢，彻底解决了路径遍历导致的文件逃逸问题。"
score = 3.6
severity = "LOW"
sources = ["ghsa"]
title = "Fission 路径遍历漏洞"
updated = "2026-06-17T10:57:43Z"

