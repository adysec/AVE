[basic]
description = "Lucent/ORiNOCO WaveLAN 无线网卡在 WEP（有线等效保密）加密协议中使用可预测的初始化向量（IV）值。该漏洞的原理是：这些无线网卡在加密数据帧时生成的 IV 值缺乏足够的随机性，攻击者可通过被动监听无线网络流量，快速收集足够数量的加密数据包，利用 IV 的预测性推算出 WEP 密钥，进而解密截获的所有无线通信内容。影响范围涵盖所有使用 Lucent/ORiNOCO WaveLAN 系列网卡的设备，包括配套的无线接入点和客户端设备。攻击条件为：攻击者需处于目标无线网络的信号覆盖范围内，无需任何身份认证即可被动捕获流量；攻击过程对目标网络无侵入行为，属于被动监听型利用方式。攻击者通过抓包工具收集数万至数十万个数据包即可在短时间内完成密钥还原，从而实现对无线通信的完整解密和中间人攻击。"
published = "2001-01-01T05:00:00Z"
remediation = "将受影响的 Lucent/ORiNOCO WaveLAN 无线网卡更换为支持 WPA2（802.11i）或 WPA3 加密标准的新款无线设备，因为该网卡固件无法修复 WEP 协议的弱 IV 生成缺陷。如无法立即更换硬件，应在无线路由器上禁用 WEP 并启用 WPA2-PSK 或 WPA2-Enterprise 加密，同时通过 IPsec VPN 或 OpenVPN 隧道传输敏感数据作为临时缓解措施。此外，建议启用 802.1X 认证、关闭 SSID 广播并在防火墙上实施 MAC 地址白名单，以进一步降低被窃听的风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Lucent ORiNOCO WaveLAN 网卡 WEP 初始化向量可预测漏洞"
