[basic]
description = "bftpd 1.0.13 FTP 服务器存在缓冲区溢出漏洞。远程攻击者无需身份认证即可通过发送超长的 SITE CHOWN 命令触发该漏洞，导致拒绝服务并可能执行任意命令。该漏洞影响运行 bftpd 1.0.13 版本的服务器系统，CVSS 评分为 10.0，危害等级严重。攻击条件宽松，仅需网络可达即可利用。"
published = "2001-02-12T05:00:00.000"
remediation = "升级到 bftpd 1.0.14 或更高版本以获取修复。配置`/etc/bftpd.conf`，将`AllowAnonymous=YES`修改为`NO`并限制登录用户。临时缓解措施：在防火墙中阻止未知端口的 inbound 连接，直到完成升级。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "bftpd FTP服务器 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:53:35.400"

