[basic]
description = "tags. The flaw stems from improper initialization of the $CONF array in common.inc.php, which leaves the password reduced to a single character, making it trivial for unauthenticated remote attackers to guess the SiteKey and hijack administrative access to phpWebLog.<value>phpWebLog 0.4.2 版本的 common.inc.php 文件未正确初始化 $CONF 数组，导致管理员密码被意外设置为单个字符，SiteKey 可被轻易猜解。未经身份认证的远程攻击者无需任何凭据，即可通过该漏洞获得 phpWebLog 后台管理权限，进而控制博客系统的文章发布、用户管理及配置修改等敏感操作。该漏洞影响所有运行 phpWebLog 0.4.2 版本的站点，CVSS 评分 7.5，危害等级高。"
published = "2001-02-16T05:00:00.000"
remediation = "建议升级 phpWebLog 至 0.4.3 或更高版本（修复了 $CONF 数组初始化缺陷），若无法升级请手动修补 common.inc.php：在 SiteKey 赋值前显式初始化 $CONF['SiteKey'] 为强随机字符串（≥32字符），同时在 Web 服务器层面（如 Apache .htaccess）限制 admin 目录仅允许可信 IP 访问，并启用 HTTPS 防止凭证窃听。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "phpWebLog 管理员认证绕过漏洞"
updated = "2026-06-16T21:53:38.010"

