[basic]
description = "Ruby on Rails 的 Sprockets 静态资源管理库存在路径遍历漏洞，攻击者可通过构造特制的 HTTP 请求，利用 Sprockets 在解析资源路径时的目录穿越缺陷，读取 Web 应用根目录之外的服务端任意文件（如配置文件、源码等敏感信息）。该漏洞影响 Sprockets 2.12.4 及更低版本、3.7.1 及更低版本、4.0.0.beta7 及更低版本，攻击无需身份认证，远程即可利用，CVSS 评分 7.5，危害等级高。官方已在后续版本中修复此漏洞。"
published = "2018-06-26T19:29:00.343"
remediation = "升级 Sprockets 至 3.7.2 或 4.0.0.beta8 及以上版本，该漏洞已在对应版本中修复。如无法立即升级，可在生产环境禁用 Sprockets 的静态文件服务器功能，或配置 Web 服务器（如 Nginx）限制对 `/assets/` 路径的请求，阻止包含 `../` 等路径遍历特征的 URL。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Ruby on Rails Sprockets 任意文件读取漏洞"
updated = "2026-06-17T01:57:47.087"

