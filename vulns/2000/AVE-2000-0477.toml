[basic]
description = "Cisco Secure PIX Firewall 存在 TCP RST 数据包伪造验证绕过漏洞。该防火墙在收到 TCP Reset (RST) 数据包时，未能正确识别 forged（伪造）数据包，导致远程攻击者可以发送特制的 TCP RST 数据包，使防火墙错误地将该数据包判定为合法连接终止请求，从而强制关闭正常建立的 TCP 连接。受影响版本包括 PIX Firewall 2.7、3.x、4.x 及 5.x。攻击者无需认证凭据，只要能够向防火墙发送网络数据包即可发起攻击。成功利用该漏洞将导致合法网络连接被中断，造成部分服务不可用（Denial of Service），影响业务连续性。CVSS 向量为 AV:N/AC:L/Au:N/C:N/I:N/A:P，表明攻击可通过网络远程发起、复杂度低、无需身份验证，主要影响为部分可用性丧失。"
published = "2000-03-20T05:00:00.000"
remediation = "Cisco 已于 2000 年 6 月发布安全公告修复此漏洞，受影响版本（PIX Firewall 2.7/3.x/4.x/4.2/5.1/5.2/5.3）均应升级至无此缺陷的最终维护版本（如 PIX 5.3(3) 及更高版本，或直接迁移至 Cisco ASA 5500 系列/Firepower 受支持发行版）。若当前设备仍在运行上述受影响版本，建议立即执行软件升级并验证版本号。若确因业务无法立即升级，可在边界路由器或上游交换机上启用 TCP SYN 监测与异常 RST 报文丢弃策略，限制外部来源的 TCP RST 报文速率，以减少 forged TCP Reset 导致的合法连接被强制中断的风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Cisco PIX防火墙 TCP RST伪造漏洞"
updated = "2026-06-16T21:52:06.677"

