[basic]
description = 'Free Java Web Server 1.0 存在目录遍历漏洞，由于服务器未对用户提交的文件路径参数进行有效过滤和验证，远程未经身份认证的攻击者可通过构造包含 ".." (点点) 路径遍历序列的 HTTP 请求，突破 Web 根目录限制，读取服务器文件系统中的任意敏感文件（如配置文件、源代码、系统文件等）。该漏洞影响 Free Java Web Server 1.0 版本，CVSS 评分 5.0（中等），攻击向量为网络、攻击复杂度低、无需认证、仅影响机密性。攻击者可直接利用该漏洞获取服务器敏感信息，进一步渗透内网或组合其他漏洞实施攻击。'
published = "2001-05-03T04:00:00Z"
remediation = '建议立即停止使用已停止维护的 Free Java Web Server 1.0，迁移至 Tomcat 或 Jetty 等现代化 Java Web 容器。若无法立即迁移，应在前端部署 WAF 或反向代理，配置 URL 过滤规则拦截所有包含 ".. " 或 "%2e%2e" 的请求路径，以阻断目录遍历攻击。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Free Java Web Server 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:53:50Z"

