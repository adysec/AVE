[basic]
description = "标签之间。<value>Solaris 8 操作系统中的 pam_ldap 认证模块存在严重安全漏洞，远程攻击者可通过提供空密码绕过系统身份认证机制。该漏洞影响使用 LDAP 目录服务的 Solaris 8 系统，攻击者无需任何凭据即可获取未授权访问权限，从而进一步危及系统的机密性、完整性和可用性。CVSS 评分达到满分 10.0，危害等级为严重。攻击者仅需通过网络向目标系统的登录认证服务发送空密码即可利用此漏洞，实现无认证登录并获得系统权限。"
published = "2001-05-03T04:00:00Z"
remediation = "建议立即安装 Sun Microsystems 发布的 Solaris 8 安全补丁 111308-01 或更高版本修复版本（可通过 `patchadd` 命令安装）。如暂时无法打补丁，可编辑 `/etc/pam.conf` 配置文件，在 pam_ldap 模块行添加 `use_first_pass` 参数强制要求密码输入，或临时禁用 pam_ldap 认证改用本地账户认证作为缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Sun Solaris 8 pam_ldap 身份验证绕过漏洞"
updated = "2026-06-16T21:53:59Z"

