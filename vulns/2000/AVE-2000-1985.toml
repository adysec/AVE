[basic]
description = "CiscoSecure ACS Server 2.4(2)及更早版本中存在缓冲区溢出漏洞，远程攻击者可通过向目标系统发送特制的超大TACACS+数据包触发该漏洞，导致目标服务进程崩溃从而引发拒绝服务，在特定条件下还可实现任意命令执行。该漏洞影响CiscoSecure ACS Server 2.4(2)及之前版本，CVSS评分10.0，危害等级严重。攻击者无需身份认证即可远程利用，攻击复杂度低。"
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 CiscoSecure ACS Server 至 2.4(3) 或更高版本，该补丁由 Cisco 在安全公告 cisco-sa-20001005-acs 中发布。如无法立即升级，可在网络边界防火墙或路由器 ACL 中限制对 TACACS+ 服务端口（TCP/UDP 49）的访问，仅允许受信任的管理网段 IP 连接。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Cisco CiscoSecure ACS Server TACACS+报文处理缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:03.797"

