[basic]
description = "该漏洞源于GNU ed编辑器在处理文件时存在设计缺陷。GNU ed工具在写入文件时未妥善验证文件路径，导致攻击者可通过创建精心设计的符号链接诱骗程序覆盖其他用户的重要文件。具体攻击过程为：攻击者首先创建指向目标文件（如/etc/passwd、/etc/shadow等）的符号链接，随后在执行GNU ed操作时，程序会意外地将编辑内容写入到被符号链接指向的文件中，从而破坏文件完整性、窃取敏感数据，甚至获取系统控制权。该漏洞影响所有使用GNU ed的Linux系统用户，具有较高的系统危害性。攻击者无需网络连接，仅需本地权限即可实施攻击，对系统安全构成严重威胁。同时，由于该漏洞破坏系统文件完整性，可能导致系统崩溃或权限提升，进而影响整个系统的可用性和机密性。目前安全维护人员建议及时更新GNU ed至安全版本，并限制普通用户对敏感文件的访问权限。相关安全补丁已在GNU最新版本中修复，使用GNU ed的系统管理员应立即进行版本升级。最终，本次漏洞虽然不属于极高危，但由于其影响面广且可导致严重后果，因此仍需高度重视并采取相应防护措施。"
published = "2001-01-09T05:00:00Z"
remediation = "建议立即升级 GNU ed 至 0.2-18.1 或更高版本（当前主流发行版已提供 1.22+），Debian 执行 `apt update && apt install --only-upgrade ed`，RHEL/CentOS 执行 `yum update ed`，Fedora 执行 `dnf update ed`。若暂时无法升级，避免在 /tmp 等世界可写目录使用 ed 编辑他人文件，禁止以 root 权限运行 ed 编辑非受信文件，为共享目录配置 sticky bit（`chmod +t /tmp`）防止符号链接攻击。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "GNU ed 符号链接攻击文件覆盖漏洞"
updated = "2026-06-16T21:53:13Z"

