[basic]
description = "Mozilla Firefox 在解析 XUL 文档时存在释放后重用（Use-After-Free）漏洞。当用户禁用 JavaScript 的情况下，攻击者可通过构造特制的 XUL 文档触发已释放内存的访问，导致浏览器崩溃或执行任意代码。该漏洞影响 Firefox 3.6.18 之前版本及 4.x 至 4.0.1、Thunderbird 3.1.11 之前版本、SeaMonkey 2.0.14 之前版本。攻击者需要诱导用户访问恶意页面，利用难度较高（需禁用 JS），但成功利用后可完全控制受影响的系统。Mozilla 已在 2011 年 6 月的安全更新中修复此漏洞。"
published = "2011-06-30T16:55:05Z"
remediation = "升级 Mozilla Firefox 至 3.6.18 及以上版本（或 4.0.2+），Thunderbird 升级至 3.1.11 及以上版本，SeaMonkey 升级至 2.0.15 及以上版本。如无法立即升级，可在浏览器中启用 JavaScript（禁用 JavaScript 是触发条件之一）并禁用 XUL 文档执行权限作为临时缓解措施。"
score = 7.6
severity = "HIGH"
sources = ["tenable"]
title = "Mozilla Firefox XUL文档释放后使用远程代码执行漏洞"
updated = "2026-06-16T23:31:12Z"

