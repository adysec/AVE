[basic]
description = "splitvt 1.6.5 之前版本存在多处缓冲区溢出漏洞。该软件在终端窗口分割功能中未对用户输入数据进行充分边界检查，本地攻击者可通过向程序传递特制的命令行参数触发栈缓冲区溢出，覆盖返回地址或函数指针，从而劫持进程控制流执行任意代码。攻击者需拥有本地系统访问权限，无需身份认证即可利用，成功利用后可获取与目标进程相同的权限，实现权限提升。该漏洞 CVSS 评分 7.2，危害等级高，影响所有运行 splitvt 1.6.5 之前版本的系统。"
published = "2001-03-12T05:00:00Z"
remediation = "升级 splitvt 至 1.6.5 或更高版本，该版本修复了多个缓冲区溢出漏洞。如无法升级，建议限制本地用户对 splitvt 的访问权限，或移除 setuid 位以降低提权风险。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "splitvt 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:53:40Z"

