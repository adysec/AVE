[basic]
description = "sudo 1.6.0 至 1.6.3p7 版本在调用 mail 程序时未正确清理环境变量，导致本地用户可通过修改环境变量（如 PATH、IFS 等）改变 mail 程序的调用方式，从而以 root 权限执行任意代码。该漏洞为本地提权漏洞，攻击者需拥有系统本地访问权限，利用难度较低。受影响的系统包括各 Linux 发行版中上述版本的 sudo 软件包。建议升级至 sudo 1.6.4 及以上版本修复。"
published = "2002-01-31T05:00:00.000"
remediation = "立即升级 sudo 至 1.6.4 或更高版本，该版本修复了调用 mail 程序前未正确清理环境变量的问题。对于 Debian 系统，安装 DSA-101 对应的安全更新包。如无法立即升级，可在 sudoers 中设置 `Defaults !mail_always` 和 `Defaults !mail_badpass` 禁用邮件通知功能作为临时缓解措施，或限制可执行 sudo 的用户列表。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "Sudo sudo 环境变量未正确清理导致本地权限提升漏洞"
updated = "2026-06-16T21:56:38.867"

