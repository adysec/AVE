[basic]
description = "Dansie Shopping Cart 3.04 及更早版本存在隐私泄露漏洞，购物车程序会将用户敏感凭据（如登录账号密码）自动发送至开发者控制的电子邮箱地址，属于后门型隐私窃取缺陷。攻击者无需认证即可远程利用（AV:N/AC:L/Au:N），仅通过正常访问受影响购物车页面即可触发数据外泄，导致用户机密性严重受损（C:P/I:N/A:N），CVSS 评分 5.0（中危）。该漏洞影响所有部署 Dansie Shopping Cart 3.04 或更早版本的电商站点，用户注册、登录、下单等操作均会导致凭据被开发者窃取。建议立即升级至官方修复版本或更换购物车系统，并强制重置所有用户密码。"
published = "2000-12-31T05:00:00Z"
remediation = "立即停用 Dansie Shopping Cart 3.04 及所有早期版本，迁移到现代安全支付网关系统或支持安全更新的电子商务平台。如无法立即迁移，可立即禁用购物车扩展功能并移除敏感信息自动发送配置，以防止用户凭证泄露。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Dansie Shopping Cart 信息泄露漏洞"
updated = "2026-06-16T21:53:27Z"

