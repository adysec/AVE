[basic]
description = "Better Auth 的组织插件（organization plugin）中 `acceptInvitation`、`rejectInvitation`、`getInvitation` 和 `listUserInvitations` 四个邀请接收端点依赖 `session.user.email` 与 `invitation.email` 的字符串匹配来验证邀请者身份，但未强制要求邮箱已验证。当应用使用 `emailAndPassword: { enabled: true }` 且未启用 `requireEmailVerification` 时，攻击者可先用受害者的邮箱地址注册一个未经身份验证的账户并自动登录，随后获取组织管理员发出的邀请链接中的 `invitationId`，即可冒充受害者接受该邀请，以被邀请角色加入目标组织并读取组织范围内的敏感数据。该漏洞影响所有使用 better-auth 组织插件且未配置邮箱验证要求的应用程序，CVSS 评分为 7.7（高危）。修复方案为升级至 better-auth 1.6.11 或更高版本，该版本默认启用 `requireEmailVerificationOnInvitation` 并在所有四个端点中强制校验 `emailVerified` 状态。"
published = "2026-07-15T18:16:47Z"
remediation = "升级 better-auth 到 1.6.11 或更高版本，该版本默认启用 requireEmailVerificationOnInvitation 并对所有邀请端点增加已验证邮箱校验。如暂时无法升级，应在 organization 插件选项中设置 requireEmailVerificationOnInvitation: true，在 emailAndPassword 配置中启用 requireEmailVerification: true，并在组织邀请路由层添加中间件强制要求 session.user.emailVerified 为 true。"
score = 7.7
severity = "HIGH"
sources = ["ghsa"]
title = "Better Auth better-auth 组织插件未授权邀请接受漏洞"
updated = "2026-07-21T13:41:03Z"

