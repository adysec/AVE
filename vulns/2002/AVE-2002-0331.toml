[basic]
description = "Pine 4.44 及更早版本在处理邮件头部的 From 字段时存在堆内存破坏漏洞。远程攻击者无需身份认证，只需向目标用户发送一封包含大量连续双引号字符的 From 头部电子邮件，即可触发 Pine 邮件客户端在解析该头部时发生堆损坏，导致程序崩溃并产生核心转储且重启失败，从而造成拒绝服务。根据 SecurityFocus 分析，该漏洞理论上存在执行任意代码的可能性。该漏洞影响运行 Pine 4.x 系列邮件客户端的 Linux/Unix 系统。"
published = "2002-12-11T05:00:00Z"
remediation = "立即升级 Pine 至 4.44 以上版本。Red Hat Linux 用户可安装 RHSA-2002:270/RHSA-2002:271 提供的更新包；Mandrake 用户安装 MDKSA-2002:084 更新；Conectiva 用户安装公告 000551 对应更新。如无法升级，可在邮件服务器或 MTA 层面过滤 From 头中大量连续引号字符的畸形邮件作为临时缓解。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "华盛顿大学 Pine 堆溢出远程拒绝服务漏洞"
updated = "2026-06-16T21:59:06Z"

