[basic]
description = "tags.<value>Cisco Secure PIX 防火墙 5.2(2) 及更早版本中的 mailguard 功能未能正确限制对 SMTP 命令的访问。未经身份认证的远程攻击者可通过在发送受限命令之前先发送 DATA 命令的方式，绕过 SMTP 内容过滤机制，从而执行本应被限制的 SMTP 命令。该漏洞影响 Cisco PIX 防火墙 4.x 和 5.x 系列设备，攻击者无需任何凭证即可远程利用，可能导致邮件内容过滤策略被绕过，进而造成信息泄露或邮件滥用等风险。CVSS 评分 7.5，危害等级为高。"
published = "2000-12-11T05:00:00Z"
remediation = "建议立即升级Cisco PIX Firewall到支持修复的版本（如5.2(3)及以上或4.3(2)及以上），并重新配置邮件网关功能以确保在处理邮件正文之前验证RCpt To命令是否已发送；如无法立即打补丁，可临时通过访问控制列表禁止使用DATA命令 bypassing安全策略。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Cisco PIX防火墙 SMTP内容过滤规避漏洞"
updated = "2026-06-16T21:52:59Z"

