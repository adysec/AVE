[basic]
description = "Linux PAM SMB 模块（pam_smb）1.1.6 及更早版本在向远程服务进行身份认证时存在缓冲区溢出漏洞。攻击者可通过构造恶意认证请求触发溢出，在目标系统上以 PAM 服务权限执行任意代码。该漏洞影响使用 pam_smb 进行 SMB 认证的 Linux 系统，CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），属于高危远程代码执行漏洞。攻击无需身份认证即可发起，利用条件为目标系统启用了 pam_smb 且暴露认证接口。ExploitDB 已公开远程溢出利用代码（EDB-ID: 89）。"
published = "2003-10-20T04:00:00Z"
remediation = "立即升级 pam_smb 模块到 1.1.7 或更高版本，可从 Samba 官方 FTP 站点 https://www.samba.org/samba/ftp/pam_smb/ 下载补丁包覆盖安装。如无法立即升级，应编辑 /etc/pam.d/login 等配置文件，注释或删除包含 auth required /lib/security/pam_smb_auth.so 的行，禁用该模块后重启相关服务。同时关注各 Linux 发行版安全公告，安装官方提供的更新软件包（如 Debian DSA-374、Red Hat RHSA-2003:262）。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Linux PAM SMB 模块远程认证缓冲区溢出漏洞"
updated = "2026-06-16T22:02:38Z"

