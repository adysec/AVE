[basic]
description = "Windows 2000 系统监视器（System Monitor）ActiveX 控件存在缓冲区溢出漏洞，远程攻击者可通过在 HTML 源码中构造超长的 LogFileName 参数触发该漏洞，导致任意命令执行。攻击者只需诱导用户访问恶意网页即可完成利用，无需任何身份认证。该漏洞 CVSS 评分 10.0，危害等级严重，可导致攻击者完全控制目标系统。"
published = "2000-12-11T05:00:00Z"
remediation = '安装 Microsoft 安全公告 MS00-097 对应补丁，或为 System Monitor ActiveX 控件 (CLSID: {1F87137D-5B1C-4A1C-9B1C-2B2A1C9B1C2B}) 设置 kill bit 禁用。在 Internet Explorer 中将 Internet 区域安全级别设为"高"并禁用 ActiveX 控件和插件。如不使用 System Monitor 功能，可删除 sysmon.ocx 文件或通过注册表禁用该控件。'
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Microsoft Windows 2000 System Monitor ActiveX 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:00Z"

