[basic]
description = "Arm 处理器在多款 CPU 核心（包括 Neoverse V3/V2/V1/N2/N1、Cortex-X925/X4/X3/X2/X1/A710/A78/A77/A76 等）的硬件实现中存在竞态条件漏洞。由于 TLBI（TLB 失效操作）完成并不能保证受影响的内存访问操作也已完成，攻击者可在 TLBI 执行与内存访问完成之间利用竞态窗口，向更高异常等级（如 EL3/EL2）所拥有的资源执行写入操作，从而突破权限隔离边界。该漏洞无需身份认证即可远程利用，攻击复杂度低，可导致机密性和完整性严重受损，CVSS 评分 9.1，危害等级严重。受影响的厂商需通过微码更新或固件补丁修复此问题。"
published = "2026-06-09T10:16:33Z"
remediation = "建议立即更新系统内核至已修复版本：RHEL 8 升级至 kernel-4.18.0-553.140.1.el8_10，RHEL 9 升级至 kernel-5.14.0-687.22.1.el9_8，RHEL 10 升级至 kernel-6.12.0-211.30.1.el10_2；Xen 用户升级至包含 XSA-493 补丁的版本。同时更新 ARM 固件至官方文档 112137 中指定的修复版本，启用 speculative barrier 相关缓解措施。如无法立即打补丁，可在虚拟化环境中禁用受影响 CPU 核心的 SMT 作为临时缓解。"
score = 9.1
severity = "CRITICAL"
sources = ["msrc"]
title = "Arm 多款处理器内存访问竞态条件权限提升漏洞"
updated = "2026-07-23T08:10:00Z"

