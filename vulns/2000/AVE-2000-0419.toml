[basic]
description = "BEA WebLogic Express 3.1.8/4/5 及其基础版本 WebLogic 5.1.0 存在源代码泄露漏洞。该漏洞源于系统默认配置中 servlet 处理 `/file/` 开头的请求时，未经任何安全检查就直接显示源代码文件的内容，导致攻击者能够轻易获取应用程序的源代码。这种安全缺陷允许未经身份验证的远程攻击者通过简单地向目标系统发送包含 `/file/` 前缀的HTTP请求，直接访问服务器上的源代码文件，从而暴露了系统的内部实现细节和潜在的敏感信息。这不仅破坏了信息的保密性，还可能为攻击者提供进一步攻击系统的信息支持。该漏洞影响范围广泛，攻击条件简单，利用方式直接，严重威胁了Web应用的安全性和信息保护。官方安全公告中已确认此漏洞的存在，并建议用户更新到最新补丁版本以修复此问题。"
published = "2000-06-21T04:00:00Z"
remediation = "升级至 BEA WebLogic 6.0 或更高版本（已修复该默认配置问题）；或在 web.xml 中移除/禁用默认 servlet 的 /file/* 映射；临时缓解可在 Web 服务器/防火墙层面拦截所有以 /file/ 开头的请求路径。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "BEA Systems WebLogic Express 源代码泄露漏洞"
updated = "2026-06-16T21:51:52Z"

