[basic]
description = "Apple iTunes 在 10.7 之前版本使用的 WebKit 渲染引擎存在内存破坏漏洞。该漏洞源于 WebKit 在处理恶意构造网页内容时的内存管理缺陷，未经身份认证的远程攻击者可通过诱导用户访问特制网站触发该漏洞。成功利用后可导致应用程序崩溃造成拒绝服务，或在特定条件下实现任意代码执行，从而完全控制受影响系统。所有使用受影响版本 iTunes 的用户在浏览恶意网页时均面临安全风险。Apple 已在后续版本中修复此漏洞。"
published = "2012-09-13T10:30:21.243"
remediation = '将 Apple iTunes 升级至 10.7 或更高版本以修复 WebKit 内存损坏漏洞。对于 Windows XP/Vista/7 系统，可通过 iTunes 菜单栏的"帮助"→"检查更新"进行升级；如无法立即升级，应避免访问不可信网站并禁用 iTunes 中的网页浏览功能作为临时缓解措施。'
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:46.787"

