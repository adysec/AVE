[basic]
description = "Mozilla Firefox 3.0.x 早于 3.0.18 版本、3.5.x 早于 3.5.8 版本以及 SeaMonkey 早于 2.0.3 版本存在安全绕过漏洞。由于浏览器未正确处理 application/octet-stream 内容类型的安全防护机制，当攻击者通过 embed 元素将服务端以 Content-Type: application/octet-stream 返回的 SVG 文档嵌入网页时，浏览器仍会将其作为 SVG 渲染执行。远程攻击者可利用此缺陷绕过同源策略（SOP），在包含嵌入 SVG 的页面中执行任意 JavaScript 脚本，进而实施跨站脚本攻击（XSS），窃取用户敏感信息。CVSS 评分 4.3，危害等级中等。"
published = "2010-02-22T13:00:02Z"
remediation = "立即升级 Firefox 至 3.0.18 或 3.5.8 及以上版本，SeaMonkey 升级至 2.0.3 及以上版本。如暂时无法升级，可临时禁用浏览器对 SVG 内容的自动渲染，或通过 Web 应用防火墙过滤用户上传的 SVG 文件，并在服务器端严格校验文件 Content-Type，防止攻击者上传恶意 SVG 脚本绕过同源策略实施跨站脚本攻击。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox 和 SeaMonkey 同源策略绕过跨站脚本漏洞"
updated = "2026-06-16T23:15:36Z"

