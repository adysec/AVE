[basic]
description = "vLLM 0.12.0 至 0.24.0 之前版本中存在可达断言漏洞（CWE-617），位于 GPUModelRunner 的 _init_mrope_positions 方法中。当攻击者向 /v1/completions 端点发送仅包含 prompt_embeds 的请求且使用 M-RoPE（多维旋转位置编码）模型时，EngineCore 中的断言 assert req_state.prompt_token_ids is not None 失败，导致进程致命崩溃，整个服务器应用关闭。任何有权访问 /v1/completions 端点的远程用户均可构造特制 JSON 请求触发此拒绝服务攻击，无需额外前置条件。该漏洞影响所有使用 M-RoPE 模型的 vLLM 部署，已在 0.24.0 版本中修复。"
published = "2026-07-06T21:16:57Z"
remediation = "立即升级 vLLM 至 0.24.0 或更高版本（含修复 commit 470229c3）。如无法立即升级，在启动服务时移除 `--enable-prompt-embeds` 参数，或通过反向代理限制 `/v1/completions` 端点仅允许受信用户访问，避免未授权远程用户发送纯 prompt_embeds 载荷触发断言崩溃。"
score = 7.1
severity = "HIGH"
sources = ["ghsa"]
title = "vLLM M-RoPE模型提示嵌入拒绝服务漏洞"
updated = "2026-07-07T19:02:37Z"

