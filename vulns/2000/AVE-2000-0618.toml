[basic]
description = "Windows 2000 telnet 客户端默认自动尝试 NTLM 身份认证，远程攻击者可通过构造恶意的 telnet:// URL 链接诱导目标用户访问，从而捕获并重放 NTLM 挑战/响应数据包，实现身份认证绕过。该漏洞影响 Windows 2000 系统，攻击者无需身份认证即可利用，CVSS 评分 7.5，危害等级高。微软至今未发布官方补丁，建议禁用 telnet 客户端或限制 NTLM 自动认证行为。"
published = "2000-11-14T05:00:00Z"
remediation = """
tags.

Let me write the remediation based on the actual Microsoft security bulletin data I fetched.<value>立即安装 Microsoft 安全公告 MS00-067 提供的官方补丁（下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=0D0032E7-259D-4F68-BF08-B0A7CAA1FD1C），该补丁会在向非信任区域发送 NTLM 凭据前弹出警告提示。如无法安装补丁，可在 telnet 客户端中执行 `unset ntlm` 命令永久禁用 NTLM 默认认证，同时在边界防火墙/路由器上阻止入站远程登录服务（如 TCP 139/445/23/3389）以降低凭据重放风险。"""
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Microsoft Windows 2000 Telnet 客户端 NTLM 身份认证凭据泄露漏洞"
updated = "2026-06-16T21:52:33Z"

