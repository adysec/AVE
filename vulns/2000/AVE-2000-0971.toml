[basic]
description = 'Netegrity SiteMinder 4.11 之前版本存在认证绕过漏洞。远程攻击者通过在请求 URL 后附加 "$/FILENAME.ext"（其中 ext 为 .ccc、.class 或 .jpg）即可绕过身份认证机制，未经授权访问受保护的资源。该漏洞无需身份验证即可远程利用，攻击复杂度低，可导致敏感信息泄露或系统被非法访问。'
published = "2000-11-14T05:00:00Z"
remediation = '立即升级 Netegrity SiteMinder 至 4.11 或更高版本，该版本已修复 URL 认证绕过漏洞。如无法立即升级，可在 Web 服务器（IIS/Apache）层面配置 URL 重写规则，拦截包含 "$/" 及 .ccc/.class/.jpg 后缀的请求路径，并限制对受保护资源的直接 URL 访问。'
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Netegrity SiteMinder 安全绕过漏洞"
updated = "2026-06-16T21:52:35Z"

