[basic]
description = "PHP-Nuke 5.4 及更早版本中的 sql_layer.php 脚本包含调试功能，但未对调试特性的访问进行权限限制，仅管理员可调用的调试接口实际对所有用户开放。未经身份认证的远程攻击者可通过在 index.php 和 modules.php 的请求中设置 sql_debug 参数来启用 SQL 调试模式，从而获取 PHP-Nuke 执行的所有 SQL 查询语句及其相关信息。该漏洞影响以 MySQL、PostgreSQL、mSQL、Interbase、Sybase 等多种数据库为后端的 PHP-Nuke 4.x 和 5.x 版本，CVSS 评分为 5.0（中危）。泄露的 SQL 查询信息可能包含数据库结构、表名、字段名等敏感数据，攻击者可利用这些信息进一步构造针对网站及其后数据库的注入攻击或其他恶意操作。"
published = "2002-12-31T05:00:00Z"
remediation = "立即升级 PHP-Nuke 至 5.5 或更高版本以修复此漏洞。若暂时无法升级，可编辑 sql_layer.php 文件，移除或注释掉 sql_debug 参数相关的调试输出代码，或通过 .htaccess 配置文件禁止外部访问包含 sql_debug 参数的请求。同时建议检查服务器访问日志，确认是否存在该漏洞被利用的记录。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "PHP-Nuke SQL 查询信息泄露漏洞"
updated = "2026-06-16T22:00:31Z"

