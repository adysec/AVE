[basic]
description = "D-Link DCS-2530L（固件版本低于1.06.01 Hotfix）和DCS-2670L（固件版本至2.02）网络摄像头的ddns_enc.cgi接口存在命令注入漏洞。已认证的攻击者可通过向该CGI脚本发送特制的HTTP请求，在设备端注入并执行任意系统命令，从而完全控制目标设备。该漏洞允许攻击者以设备权限执行任意命令，可能导致敏感信息泄露、设备配置篡改或作为跳板攻击内网其他主机。攻击者只需具备设备Web管理界面的低权限账户即可远程利用，无需用户交互，危害等级高。"
published = "2020-09-02T16:15:12.690"
remediation = "DCS-2530L 用户通过 Mydlink 手机 App 升级固件至 v1.07.00 Hotfix；DCS-2670L 用户从 D-Link 官网下载并更新固件至 v2.03.00 Hotfix；DCS-4603/4622/4701E/4703E/4705E/4802E 系列用户下载对应 Hotfix 固件手动更新。DCS-P703 已停止服务，建议停用并更换设备。如无法立即升级，可在防火墙或路由器层面限制对设备 80/443 端口的远程访问，仅允许受信任内网 IP 访问设备管理界面。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "D-Link DCS-2530L及DCS-2670L网络摄像头命令注入漏洞"
updated = "2026-06-17T03:06:20.840"

