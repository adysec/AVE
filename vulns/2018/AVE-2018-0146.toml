[basic]
description = "Wowza Streaming Engine 4.7.4.01 的 REST API 存在路径遍历漏洞（CWE-22），未经身份认证的远程攻击者可通过发送精心构造的 HTTP 请求，绕过路径限制遍历服务器目录结构并读取任意敏感文件。该漏洞无需用户交互、攻击复杂度低、网络远程可利用，CVSS 3.1 评分 9.1（严重），影响机密性与可用性。攻击者可利用此漏洞获取服务器配置文件、源代码、日志等敏感信息，进而导致进一步攻击。受影响版本为 4.7.4.01，建议升级至官方修复版本。"
published = "2019-03-21T16:00:30Z"
remediation = "升级 Wowza Streaming Engine 至 4.7.5.02 或更高版本以修复目录遍历漏洞。具体操作：访问 Wowza 官网下载最新版安装包（https://www.wowza.com/downloads/streaming-engine），停止服务后覆盖安装，重启服务并验证 /enginemanager/server/logs/download 接口不再接受 ../ 路径遍历参数。若无法立即升级，可在反向代理层拦截包含 ../ 的 logName 参数请求作为临时缓解。"
score = 9.1
severity = "CRITICAL"
sources = ["nuclei"]
title = "Wowza Media Systems Wowza Streaming Engine 目录遍历漏洞"
updated = "2026-06-17T01:49:13Z"

