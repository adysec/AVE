[basic]
description = '标签之间。<value>GoAhead Web Server 2.0及2.1版本存在目录遍历漏洞。未经身份认证的远程攻击者可通过在HTTP GET请求中构造包含"../"路径穿越序列的特制请求，访问并读取服务器文件系统上的任意文件。该漏洞影响部署了受影响版本GoAhead Web Server的所有系统，攻击者无需身份验证即可利用此漏洞获取敏感配置文件、密码文件或其他机密数据，造成信息泄露风险。'
published = "2001-05-03T04:00:00Z"
remediation = "建议立即升级 GoAhead WebServer 至 2.1.1 或更高版本，该版本已修复目录遍历漏洞。若暂时无法升级，可在 Web 服务器配置中启用路径规范化检查，禁止 URL 中出现 ../ 序列，或在反向代理/防火墙层面拦截包含目录遍历 payload 的请求作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "GoAhead Web Server 2.0/2.1 目录遍历漏洞"
updated = "2026-06-16T21:53:55Z"

