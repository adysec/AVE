[basic]
description = "RSA ACE Server 4.1 及更早版本存在拒绝服务漏洞。远程攻击者无需身份认证即可通过向目标服务器的认证端口发送大量特制 UDP 数据包，导致服务器资源耗尽、认证服务响应缓慢甚至完全崩溃，合法用户无法正常进行身份验证。该漏洞利用方式简单，攻击者只需具备网络访问能力即可实施，影响范围包括使用 RSA ACE Server 进行双因素认证的企业网络环境。厂商已发布安全更新修复此漏洞。"
published = "2000-06-08"
remediation = "立即从 RSA 官方 FTP 下载并应用 DOS 补丁包（参见 ftp://ftp.securid.com/support/outgoing/dos/readme.txt），将 RSA ACE/Server 升级至 4.1 及以上已修复版本。如无法升级，在防火墙上限制对服务器认证端口（默认 UDP 5500）的访问来源 IP，仅允许受信任的 ACE Agent 地址通信，并配置速率限制以缓解 UDP 泛洪攻击。该产品已停止支持，建议迁移至 RSA SecurID 新一代认证平台。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "RSA ACE Server 认证UDP数据包泛洪拒绝服务漏洞"
updated = "2000-06-08"

