[basic]
description = "vSphere Client（HTML5）的 vCenter Server 插件存在服务器端请求伪造（SSRF）漏洞，由于对 URL 的验证不当，攻击者可通过向 vCenter Server 插件发送特制的 POST 请求，诱使服务器向内部或外部系统发起未授权请求，导致敏感信息泄露。该漏洞影响 VMware vCenter Server 7.x（7.0 U1c 之前）、6.7（6.7 U3l 之前）和 6.5（6.5 U3n 之前）版本，以及 VMware Cloud Foundation 4.x（4.2 之前）和 3.x（3.10.1.2 之前）版本。攻击者只需获得对目标服务器 443 端口的网络访问权限，无需身份认证即可利用此漏洞。"
published = "2021-02-24T17:15:15Z"
remediation = "将 VMware vCenter Server 升级至 7.0 U1c 或更高版本、6.7 U3l 或更高版本、6.5 U3n 或更高版本；VMware Cloud Foundation 升级至 4.2 或更高版本、3.10.1.2 或更高版本。如无法立即升级，应在网络边界防火墙限制仅可信 IP 可访问 vCenter Server 443 端口作为临时缓解措施。"
score = 5.3
severity = "MEDIUM"
sources = ["kev"]
title = "VMware vCenter Server 服务端请求伪造漏洞"
updated = "2026-06-17T03:36:28Z"

