[basic]
description = "arpwatch 2.1a4 在特定配置下存在符号链接攻击漏洞。本地攻击者可通过在临时目录中创建恶意符号链接，诱使 arpwatch 以特权进程身份向攻击者指定的任意文件写入数据，从而实现任意文件覆盖。该漏洞利用条件较高，需要攻击者拥有本地访问权限且系统配置存在缺陷，影响范围有限，仅对文件完整性造成部分破坏。"
published = "2001-03-12T05:00:00Z"
remediation = "将 arpwatch 升级至 2.1a10 或更高版本（该版本已使用 mkstemp 替代不安全的 mktemp 创建临时文件，消除符号链接竞争条件）。如无法升级，可将 arpwatch 临时文件目录改为仅 root 可写的私有目录（如 /var/lib/arpwatch/tmp），并确保 /tmp 分区挂载了 nosuid、noexec 选项以降低利用风险。"
score = 1.2
severity = "LOW"
sources = ["cve"]
title = "ARPWatch 2.1a4 本地符号链接攻击任意文件写入漏洞"
updated = "2026-06-16T21:53:44Z"

