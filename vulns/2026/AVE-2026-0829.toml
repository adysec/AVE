[basic]
description = "Socket.IO 的 Engine.IO 组件在处理轮询传输时存在资源未正确释放漏洞（CWE-404）。未经身份认证的远程攻击者可通过向 Engine.IO 协议 v4 的轮询端点发送 Content-Type 为 application/octet-stream 的无效二进制 POST 请求触发该漏洞。服务端在检测到传输错误后未能正确关闭对应的 HTTP 响应连接，导致每个精心构造的请求都会消耗一个服务端 socket/文件描述符。攻击者可重复发起大量此类请求，耗尽服务器可用 HTTP 连接、socket 或文件描述符等资源，造成拒绝服务，阻止合法客户端正常连接。该漏洞影响 engine.io 4.1.0 至 6.6.7 之前版本，CVSS 评分 7.5，危害等级高。官方已在 engine.io 6.6.7 版本中修复，修复方式为明确拒绝无效的二进制轮询 POST 请求并正确关闭响应连接。"
published = "2026-07-08T16:16:33Z"
remediation = '升级 engine.io 至 6.6.7 或更高版本：`npm install engine.io@^6.6.7`。如无法立即升级，可在反向代理/WAF 层拦截 Engine.IO v4 轮询 POST 请求中 `Content-Type: application/octet-stream` 的请求，或配置仅使用 WebSocket 传输：`transports: ["websocket"]`，并实施 IP 速率限制和连接数限制。'
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Socket.IO Engine.IO 轮询传输连接耗尽拒绝服务漏洞"
updated = "2026-07-13T15:07:44Z"

