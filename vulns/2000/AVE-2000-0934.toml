[basic]
description = "Microsoft Money 的密码保护功能存在敏感信息明文存储漏洞。该软件将用户账户密码以明文形式存储在本地文件系统中，未进行任何加密或哈希处理。具有物理访问权限的攻击者可通过直接读取本地存储文件获取用户密码，进而完全控制受害者的财务数据。该漏洞影响 Microsoft Money 多个版本，攻击复杂度低，无需身份认证即可利用，对系统机密性、完整性和可用性均造成严重影响。"
published = "2000-10-20T04:00:00.000"
remediation = "安装 Microsoft 安全公告 MS00-061 提供的补丁，通过 Microsoft Money 的「更新 Internet 信息」功能自动下载安装。安装补丁后应立即更改账户密码。如无法安装补丁，可在 Windows NT/2000 系统上将 Money 数据文件所在目录的 NTFS 权限设置为仅允许授权用户访问，作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Money 密码明文存储漏洞"
updated = "2026-06-16T21:52:27.560"

