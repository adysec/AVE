[basic]
description = "SuSE Linux 6.4 默认 Apache 1.3.12 配置存在源代码泄露漏洞，默认配置将 /cgi-bin-sdb/ 目录映射为 CGI 脚本目录，远程未授权攻击者可通过将请求 URL 中的 /cgi-bin/ 替换为 /cgi-bin-sdb/ 直接读取 CGI 脚本源代码。该漏洞影响 SuSE Linux 6.4 默认安装的 Apache 1.3.12，CVSS 5.0（中危），攻击复杂度低、无需认证、远程可利用，攻击者可获取 CGI 脚本源码进而分析业务逻辑、发现硬编码凭证或其他漏洞。SUSE 已发布补丁修复该配置缺陷，建议升级 Apache 或修改 httpd.conf 禁用 cgi-bin-sdb 别名。"
published = "2000-11-14T05:00:00.000"
remediation = "升级 Apache 至 1.3.13 或更高版本，或升级 SuSE Linux 至 6.4 以上版本；若暂无法升级，请编辑 httpd.conf 删除或注释掉 /cgi-bin-sdb/ 别名配置，并在 <Directory /cgi-bin> 中添加 Options -Indexes 禁止目录浏览，同时配置 AddHandler cgi-script .cgi .pl 确保 CGI 脚本被执行而非显示源码"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "SUSE Linux Apache 源代码泄露漏洞"
updated = "2026-06-16T21:52:38.250"

