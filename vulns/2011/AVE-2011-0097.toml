[basic]
description = "Adobe Flash Player 10.3.183.5之前版本存在内存破坏漏洞（CWE-119），远程攻击者可通过构造特制的SWF文件诱导用户访问触发该漏洞，导致任意代码执行或拒绝服务。该漏洞影响Windows、Mac OS X、Linux、Solaris及Android平台上的Flash Player，以及Windows和Mac OS X上的Adobe AIR。攻击无需身份认证，用户仅需打开恶意构造的Flash文件即可被利用，危害严重，CVSS评分10.0。"
published = "2011-08-10T22:55:01Z"
remediation = "立即将 Adobe Flash Player 升级至 10.3.183.5 或更高版本（Windows/Mac/Linux/Solaris），Android 设备升级至 10.3.186.3 或更高版本；Adobe AIR 升级至 2.7.1 或更高版本。由于 Adobe 已于 2020 年 12 月 31 日终止 Flash Player 支持，建议彻底卸载 Flash Player 并移除浏览器插件，改用 HTML5 等现代替代方案。如暂时无法卸载，可在浏览器设置中禁用 Flash 自动运行，并通过企业组策略禁止加载 Flash 内容。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:31:17Z"

