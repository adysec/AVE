[basic]
description = "Windows 远程桌面网关（RD Gateway）存在类型混淆（Type Confusion）漏洞，攻击复杂度较高，未经身份认证的远程攻击者可通过向目标 RD Gateway 服务发送特制网络请求触发该漏洞，导致目标系统服务崩溃并拒绝服务。该漏洞影响启用远程桌面网关功能的 Windows Server 及桌面版本，CVSS 评分 5.9，危害等级中危。Microsoft 已在 2025 年 1 月安全更新（KB5049983）中修复此漏洞。"
published = "2025-01-14T18:15:34Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新：Windows Server 2022 安装 KB5049983，Windows Server 2025 安装 KB5050009，Windows Server 23H2 安装 KB5049984。可通过 Windows Update 自动更新或从 Microsoft Update Catalog 下载独立包。临时缓解措施：在防火墙层面限制对 RD Gateway 端口（默认 443/TCP）的访问，仅允许受信任源 IP 连接。"
score = 5.9
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows Remote Desktop Gateway（RD 网关）拒绝服务漏洞"
updated = "2026-06-17T08:42:49Z"

