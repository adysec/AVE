[basic]
description = "sharutils 工具包中的 uudecode 程序在处理解码后的文件名时，未检查该文件名是否为管道文件或符号链接，导致攻击者可通过构造恶意的 uuencoded 文件，诱使目标用户解码后触发符号链接指向任意文件，实现文件覆盖或命令执行。该漏洞影响 sharutils 4.2.1 之前版本，CVSS 评分 7.2，危害等级高。攻击者需要本地访问权限，但无需身份认证，利用复杂度低。"
published = "2002-05-29T04:00:00Z"
remediation = "升级 sharutils 至 4.2.1 及以上版本。Red Hat 用户安装 RHSA-2002:065 更新，Mandrake 用户安装 MDKSA-2002:052 更新，Caldera OpenLinux 用户安装 CSSA-2002-040.0 更新。如无法升级，避免对不可信 uuencode 文件执行 uudecode 解码操作。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "GNU sharutils uudecode 任意文件覆盖与代码执行漏洞"
updated = "2026-06-16T21:56:56Z"

