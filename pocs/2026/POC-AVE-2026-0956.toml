[info]
author = "ave"
description = "验证 FlytoHub Flyto2 Core 是否存在任意文件写入漏洞。该漏洞位于 image.download 和相关文件写入模块，攻击者可通过特制参数将任意 HTTP 响应内容写入进程可访问的任意文件系统路径，绕过 FLYTO_SANDBOX_DIR 沙盒限制。"
id = "POC-AVE-2026-0956"
name = "CVE-2026-67429 任意文件写入漏洞 PoC"
severity = "critical"
tags = ["ave-2026-0956"]
vuln_id = [
    "CVE-2026-67429",
    "AVE-2026-0956",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/vuln-path"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
