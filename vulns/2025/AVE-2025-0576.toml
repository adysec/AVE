[basic]
description = "Google Chrome 浏览器的 Loader 组件中存在一个类型转换错误（Bad Cast）漏洞。当远程攻击者成功攻破渲染进程后，可以通过诱导用户访问精心构造的 HTML 页面，触发该漏洞导致堆损坏（Heap Corruption）。该漏洞影响 143.0.7499.41 之前的 Google Chrome 版本，攻击者可利用此缺陷在受影响系统中实现潜在的内存破坏或权限提升。建议用户尽快升级至官方发布的最新版本以消除安全风险。"
published = "2025-12-02T19:15:48Z"
remediation = "建议立即将 Google Chrome 浏览器升级至 143.0.7499.41 或更高版本（如 143.0.7499.146）。用户可通过浏览器设置中的“关于 Google Chrome”检查更新并自动安装最新补丁，以修复 Loader 中由于错误类型转换导致的堆损坏漏洞。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome 浏览器 Loader 组件堆损坏漏洞"
updated = "2026-06-17T08:34:38Z"

