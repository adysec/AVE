[basic]
description = "Microsoft Edge（基于 Chromium）存在欺骗漏洞，由于对用户界面元素的验证不充分，攻击者可通过诱导用户点击特制链接或与恶意页面交互，在浏览器地址栏或安全指示器中显示虚假内容，从而实施网络钓鱼或身份欺骗攻击。该漏洞影响 133.0.3065.51 之前版本的 Microsoft Edge（Chromium-based），攻击复杂度低，无需特权，但需要用户交互。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-06T23:15:08Z"
remediation = "立即将 Microsoft Edge 升级至 133.0.3065.51 或更高版本，可通过 Edge 内置更新工具（设置→关于 Microsoft Edge→检查更新）或从官网下载安装。如无法立即更新，可在浏览器设置中启用「增强安全模式」并避免点击来源不明的链接。企业用户可通过组策略配置自动更新策略强制推送补丁。"
score = 4.4
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Edge（基于Chromium）欺骗漏洞"
updated = "2026-06-17T08:42:56Z"

