[basic]
description = "IBM Net.Data 7.0 的 db2www 组件中的 document.d2w CGI 程序存在路径泄露漏洞。远程攻击者无需身份认证，通过向该程序发送一个不存在的命令参数，即可触发服务器返回包含物理路径的错误信息，从而泄露 Web 服务器的绝对路径。该信息可被攻击者用于进一步探测系统目录结构，为后续攻击提供信息支撑。攻击条件简单，仅需目标开放 HTTP 服务且运行 Net.Data 组件。"
published = "2001-01-09T05:00:00.000"
remediation = "IBM Net.Data 产品已停止支持，官方不再提供安全补丁。建议立即将 Net.Data 升级到 7.0 以上版本（如 7.1），或迁移至 IBM HTTP Server 等替代产品。如无法升级，可在 Web 服务器层面配置访问控制，限制对 document.d2w CGI 程序的访问，仅允许授权 IP 段访问，或在 httpd.conf 中添加 RewriteRule 拒绝所有对 document.d2w 的请求。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "IBM Net.Data 完整路径泄露漏洞"
updated = "2026-06-16T21:53:10.103"

