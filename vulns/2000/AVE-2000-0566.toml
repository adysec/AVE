[basic]
description = "eEye Digital Security IRIS 1.01 beta 版本存在拒绝服务漏洞，远程攻击者可通过向目标系统发送大量 UDP 连接请求，导致 IRIS 网络监控服务耗尽系统资源而崩溃。该漏洞影响 IRIS 1.01 beta 及更早版本，攻击者无需身份认证即可远程触发，CVSS 评分 5.0，危害等级中等。此外，IRIS 1.0.1 及 SpyNet CaptureNet 3.0.12 还存在远程缓冲区溢出漏洞，攻击者可利用精心构造的数据包实现远程代码执行。"
published = "2000-10-20T04:00:00.000"
remediation = "eEye IRIS 1.01 beta 已停止维护，官方未发布安全补丁。建议立即卸载该软件，改用 Wireshark（原 Ethereal）等仍在维护的开源网络分析工具。如因特殊原因必须继续使用，应在防火墙规则中限制对该主机的 UDP 连接速率，并仅允许可信来源 IP 访问。该漏洞通过大量 UDP 连接触发堆内存溢出导致拒绝服务，攻击者无需认证即可远程利用。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "eEye Digital Security IRIS 1.01 UDP 连接拒绝服务漏洞"
updated = "2026-06-16T21:52:22.280"

