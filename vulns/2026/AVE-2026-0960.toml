[basic]
description = "MCP Ruby SDK 的 StreamableHTTP 传输实现中存在会话所有权验证缺失漏洞。攻击者通过窃取有效的会话 ID，无需身份认证即可向目标服务器发送工具调用请求，服务器未验证会话 ID 与请求者的绑定关系，直接执行恶意工具调用并将响应注入受害者的 SSE 流中。该漏洞影响使用 Ruby MCP SDK 0.23.0 之前版本的服务端应用，攻击者可在受害者不知情的情况下执行未授权操作，属于静默会话劫持攻击。官方已在 v0.23.0 版本中修复此漏洞。"
published = "2026-07-29T20:17:12Z"
remediation = "立即将 mcp gem 升级至 0.23.0 或以上版本（`gem update mcp`），该版本已实现会话 ID 与用户身份的绑定验证。如无法立即升级，可在应用层对每个会话绑定用户认证信息（如 JWT token），并在处理 POST /messages/:session_id 请求时校验会话所有者身份，拒绝未授权会话的 tool call 请求。"
score = 8.3
severity = "HIGH"
sources = ["ghsa"]
title = "MCP Ruby SDK 会话会话中毒漏洞"
updated = "2026-07-30T19:30:33Z"

