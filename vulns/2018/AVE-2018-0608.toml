[basic]
description = "QNAP QTS 在 Web 页面生成时对用户输入的转义处理不当，存在反射型跨站脚本（XSS）漏洞（CWE-79）。远程未认证攻击者可通过构造恶意 Web 请求诱导管理员点击，在受害者浏览器中执行任意 JavaScript 代码，窃取会话凭证、篡改页面内容或发起进一步攻击。该漏洞影响 QTS 4.4.2.1231 build 20200302 之前版本、4.4.1.1201 build 20200130 之前版本、4.3.6.1218 build 20200214 之前版本、4.3.4.1190 build 20200107 之前版本、4.3.3.1161 build 20200109 之前版本及 4.2.6 build 20200109 之前版本。CVSS 3.1 评分 6.1（中危），攻击向量为网络、攻击复杂度低、无需权限但需用户交互、范围改变、机密性与完整性影响较低、可用性无影响。QNAP 已在上述版本中修复该漏洞，建议用户尽快升级至修复版本。"
published = "2020-10-28T18:15:12Z"
remediation = "立即升级 QNAP QTS 至修复版本：QTS 4.4.2.1231 (build 20200302)、4.4.1.1201 (build 20200130)、4.3.6.1218 (build 20200214)、4.3.4.1190 (build 20200107)、4.3.3.1161 (build 20200109) 或 4.2.6 (build 20200109)。登录 QTS 管理界面，进入「控制台」→「系统」→「固件更新」→「检查更新」并安装。若暂时无法升级，建议在防火墙层面限制 NAS 管理端口 (默认 8080/443) 仅允许可信 IP 访问，并启用 HTTPS 强制加密传输。"
score = 6.1
severity = "MEDIUM"
sources = ["kev"]
title = "QNAP QTS 跨站脚本漏洞"
updated = "2026-06-17T01:50:10Z"

