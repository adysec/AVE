[basic]
description = "WordPress Zip Attachments 插件 1.5.1 之前版本的 download.php 文件中存在目录遍历漏洞。攻击者无需身份认证即可通过向 za_file 参数传入 `../` 等路径穿越序列，绕过路径限制读取服务器上的任意文件，如 wp-config.php 等敏感配置文件。该漏洞影响所有使用该插件的 WordPress 站点，攻击复杂度低且无需用户交互，可导致敏感信息泄露。建议用户立即升级至 1.5.1 或更高版本。"
published = "2016-01-08T20:59:01Z"
remediation = "立即将 Zip Attachments 插件升级至 1.5.1 或更高版本（该版本修复了 download.php 中 za_file 参数未正确过滤 ../ 路径遍历的问题）。由于该插件已于 2025 年 10 月因安全问题从 WordPress 官方仓库下架，建议彻底卸载该插件并寻找替代方案。如暂时无法卸载，可在服务器 Web 配置（如 .htaccess 或 Nginx 规则）中拦截对 /wp-content/plugins/zip-attachments/download.php 的访问请求作为临时缓解措施。"
score = 8.6
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress Zip Attachments插件目录遍历漏洞"
updated = "2026-06-17T00:27:44Z"

