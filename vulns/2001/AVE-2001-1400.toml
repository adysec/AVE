[basic]
description = "CVE-2001-0318是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-06-02T04:00:00Z"
remediation = "立即将 ProFTPD 升级至 1.2.0rc3 或更高正式版本（如 1.2.0/1.2.1/1.3.x），以修复 main.c 中 log_pri() 函数的格式字符串漏洞（Bug #434）。对于 Debian 系统，安装 debian-security archive 中的修复包（DSA-029），执行 apt-get update && apt-get install proftpd；对于 Mandrake/Mandriva 系统，应用 MDKSA-2001-021 安全更新；对于 Conectiva 系统，应用公告 000380 补丁。如暂无法升级，可在防火墙层限制 FTP 控制连接的来源 IP，或临时禁用匿名 FTP 访问，以减少攻击面。升级后需重启 proftpd 进程（service proftpd restart 或 systemctl restart proftpd），并确认版本号已更新。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "ProFTPD 格式字符串远程代码执行漏洞"
updated = "2026-06-16T21:54:05Z"

