remediation = "建议立即升级 Microsoft IIS 远东版至 4.0 Service Pack 6a 或 5.0 Service Pack 2 及以上版本，并安装微软发布的 MS01-006 安全更新补丁（Q277873）。如无法立即升级，可在 IIS 中配置 URLScan 3.0 规则拦截包含双字节字符前导字节的畸形 URL 请求，同时禁用不必要的脚本映射扩展作为临时缓解措施。"
