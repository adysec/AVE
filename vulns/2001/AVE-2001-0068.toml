[basic]
description = "WebMaster ConferenceRoom 1.8.1 存在一处拒绝服务（Denial of Service，DoS）漏洞。攻击者可以利用 IRC 服务器与服务器克隆（克隆实体）之间的好友关系（Buddy Relationship）机制，向目标服务器发送特制的数据包，触发该漏洞导致服务崩溃或进入异常状态，进而造成目标系统不可正常响应。鉴于该漏洞利用难度不高且可通过网络远程触发，攻击条件相对简单，主要影响使用 WebMaster ConferenceRoom 1.8.1 及 1.8 开发者版本搭建的在线会议服务，威胁其可用性。由于此类会议服务常面向公网开放，远程攻击者无需认证即可发起攻击，可能造成服务中断，影响正常用户会话。"
published = "2001-03-26T05:00:00Z"
remediation = "建议升级到 ConferenceRoom 1.8.1 之后发布的修复版本（如 1.8.2 及以上），若官方已停止维护则停止该服务的对外暴露。可操作的临时缓解措施：在防火墙或网关层面限制来自不可信来源对该 IRC 服务端口（默认 6667 及监听端口）的连接访问，或仅允许受信任 IP 白名单访问，以阻断远程攻击者建立 buddy 关系从而触发拒绝服务。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "WebMaster ConferenceRoom 1.8.1 拒绝服务漏洞"
updated = "2026-06-16T21:53:49Z"

