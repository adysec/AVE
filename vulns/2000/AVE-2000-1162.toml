[basic]
description = "标签中输出。<value>Oracle Internet Application Server (IAS) 3.0.7 及更早版本中，端口监听器（port listener）和 modplsql 模块的默认配置存在安全缺陷。未经身份认证的远程攻击者可通过向目标服务器发送特制的 HTTP 请求，访问 Database Access Descriptor (DAD) 文件，从而获取特权数据库信息，造成敏感数据泄露。该漏洞利用门槛低，攻击者无需凭据即可在网络可达条件下发起攻击。受影响版本包括 Oracle IAS 3.0.7 及之前所有版本，CVSS 向量显示该漏洞主要影响系统保密性。"
published = "2000-12-31T05:00:00.000"
remediation = "建议立即升级 Oracle Internet Application Server 到 3.0.8 或更高版本以获取安全补丁，或修改 DAD 文件配置中认证和权限控制项，将数据库访问权限限制为特定用户并禁用匿名访问；如无法立即升级，可通过防火墙封锁对 modplsql 端口的直接HTTP访问，并在应用服务器中添加 IP地址白名单以限制攻击面。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Oracle Internet Application Server 未授权信息泄露漏洞"
updated = "2026-06-16T21:53:26.260"

