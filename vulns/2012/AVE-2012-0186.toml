[basic]
description = "Google Chrome 18.0.1025.168 之前版本的 XML 解析器中存在释放后使用（Use-After-Free）漏洞。远程攻击者可构造特制的 XML 内容，诱使用户通过 Chrome 浏览器访问恶意页面，触发已释放内存的访问，导致浏览器崩溃拒绝服务，或可能实现任意代码执行。该漏洞影响所有 Chrome 18.0.1025.168 之前版本，CVSS 评分 6.8，危害等级中危。Google 已在 Chrome 18.0.1025.168 版本中修复此漏洞。"
published = "2012-05-01T10:12:04.283"
remediation = "升级 Google Chrome 至 18.0.1025.168 或更高版本，可通过 Chrome 内置更新程序自动检查更新。对于 Apple iOS 设备，升级至 iOS 6.0 或更高版本，通过设置→通用→软件更新完成升级。如无法立即更新，可禁用 JavaScript 解析作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome XML解析器释放后使用漏洞"
updated = "2026-06-16T23:39:40.330"

