[basic]
description = "BSD libutil 库中的 pw_error 函数存在格式化字符串漏洞，本地攻击者可通过在 chpass 或 passwd 等命令中提交特制的畸形密码字符串触发该漏洞，导致以 root 权限执行任意代码。该漏洞影响多个 BSD 系统版本，CVSS 评分 7.2，危害等级高。攻击者需拥有本地账户即可利用，无需其他特殊权限。"
published = "2000-12-19T05:00:00.000"
remediation = "建议立即升级 BSD libutil 库至包含格式字符串漏洞修复的版本（如 FreeBSD 3.5.1 及以上、OpenBSD 2.8 及以上），或应用对应 BSD 发行版的安全补丁。如无法升级，可通过移除 chpass/passwd 等受影响命令的 setuid root 权限作为临时缓解措施：`chmod u-s /usr/bin/chpass /usr/bin/passwd`。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "BSD libutil pw_error 函数格式化字符串本地权限提升漏洞"
updated = "2026-06-16T21:52:55.813"

