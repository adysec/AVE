[info]
author = "ave"
description = "检测 Sophos XG Firewall 设备 userportal 登录页面是否存在，该页面存在预认证 SQL 注入漏洞（CVE-2020-12271），攻击者可利用该漏洞窃取本地用户凭据并实现远程代码执行"
id = "POC-AVE-2020-0309"
name = "Sophos XG Firewall Pre-Auth SQL Injection PoC"
severity = "critical"
tags = ["ave-2020-0309"]
vuln_id = [
    "CVE-2020-12271",
    "AVE-2020-0309",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/userportal/webpages/myaccount/login.jsp"
protocol = "http"

[poc.requests.headers]
User-Agent = "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/80.0.3984.0 Safari/537.36"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["loginstylesheet"]
