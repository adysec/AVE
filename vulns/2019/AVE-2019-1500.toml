[basic]
description = "QNAP QTS 操作系统存在输入验证错误漏洞，远程未经身份认证的攻击者可通过向目标设备发送特制的网络请求触发该漏洞，导致任意代码注入执行。该漏洞影响多款 QNAP NAS 设备上的 QTS 操作系统，CVSS 评分 9.8，危害等级严重，攻击无需用户交互及特殊权限。QNAP 已发布安全更新修复此漏洞，建议用户升级至最新版本。"
published = "2019-12-05T17:15:13Z"
remediation = "立即将 QTS 升级至 4.4.1 build 20190918 及以上版本（或 4.3.6 build 20190919 及以上版本），并将 Photo Station 升级至对应版本（QTS 4.4.1 需 Photo Station 6.0.3+，QTS 4.3.4-4.4.0 需 5.7.10+，QTS 4.3.0-4.3.3 需 5.4.9+，QTS 4.2.6 需 5.2.11+）。升级路径：以管理员身份登录 QTS → 控制面板 → 系统 → 固件更新 → 检查更新；Photo Station 通过 App Center 搜索并点击更新。如无法立即升级，建议在防火墙上限制对 NAS 管理端口（默认 8080/443）的互联网访问，仅允许可信内网 IP 连接。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "QNAP QTS 输入验证错误漏洞"
updated = "2026-06-17T02:40:14Z"

