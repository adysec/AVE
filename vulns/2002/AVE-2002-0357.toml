[basic]
description = "Portable Network Graphics（PNG）图像处理库 libpng 1.2.5 及更早版本在计算 PNG 图像行缓冲区偏移量时存在缺陷，导致缓冲区溢出。未经身份认证的远程攻击者可构造特制的 PNG 图像文件，利用该漏洞向目标系统发送恶意图片，触发 libpng 库中的缓冲区溢出，从而造成应用程序崩溃（拒绝服务），并在特定条件下可能执行任意代码。该漏洞影响所有使用受影响版本 libpng 库的应用程序及操作系统组件，攻击者无需任何认证即可通过网络发起攻击，利用方式简单，危害较大。libpng 开发团队已在后续版本中修复该偏移量计算问题。"
published = "2002-12-26T05:00:00Z"
remediation = "` tags.<value>升级 libpng 至 1.2.6 或更高版本，建议使用最新的 1.6.x 稳定分支（当前为 1.6.58）。对于使用 libpng 的应用程序，重新编译并链接到修复后的库。如无法立即升级，可临时限制对不受信任 PNG 文件的访问，或使用 pngcheck 等工具对上传的 PNG 图像进行验证，拒绝处理包含畸形行数据的图像。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "libpng PNG库 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:59:10Z"

