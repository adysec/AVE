[basic]
description = "Apple iTunes 使用的 WebKit 引擎存在内存破坏漏洞，未经身份认证的远程攻击者可通过诱导用户访问恶意网页触发该漏洞，导致任意代码执行或应用程序崩溃。该漏洞影响 iTunes 10.7 之前的版本，CVSS 评分为 6.8，危害等级中等。攻击条件为受害者需访问包含恶意内容的网站，利用方式是通过构造特殊的网页内容触发 WebKit 内存处理错误，进而实现代码执行或服务拒绝。"
published = "2012-09-13T10:30:20.290"
remediation = "立即将 Apple iTunes 升级至 10.7 或更高版本，该版本修复了 WebKit 组件的内存破坏漏洞。建议通过 iTunes 内置的「检查更新」功能或 Apple 官方下载页面获取最新安装包，并重启应用程序以完成修复。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:42.087"

