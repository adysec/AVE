[basic]
description = "Red Hat Linux 系统中 gkermit 文件传输工具被错误地设置了 setgid uucp 权限，导致普通用户在执行 gkermit 时继承 uucp 组的特权。本地攻击者无需任何身份认证即可利用此配置缺陷，通过 gkermit 修改 uucp 用户组拥有的文件，进而可能提升权限或破坏系统文件完整性。该漏洞影响 Red Hat Linux 发行版，攻击前提是拥有本地 shell 访问权限，CVSS 评分 4.6，危害等级中危。"
published = "2000-06-21T04:00:00Z"
remediation = "立即移除 gkermit 二进制文件的 setgid 权限位：执行 `chmod g-s /usr/bin/gkermit` 取消 setgid uucp 设置，防止本地用户利用该权限修改 uucp 用户拥有的文件。如环境仍在使用 Red Hat Linux，建议升级到已修复此问题的更新版本或迁移至受支持的企业级 Linux 发行版。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Red Hat Linux gkermit 文件修改漏洞"
updated = "2026-06-16T21:52:05Z"

