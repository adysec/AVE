[basic]
description = "CVE-2021-21220 是 Google Chrome 浏览器 JavaScript 引擎 V8 中存在的不可信输入验证不足漏洞。该漏洞源于 V8 引擎在 x86_64 架构上对 JIT 编译生成的指令进行优化时，未对不受信任的输入进行充分验证，攻击者通过构造特制的 HTML 页面并诱导用户使用浏览器访问，即可在渲染进程中触发堆内存破坏（heap corruption），进而实现远程代码执行。攻击无需身份认证且难度较低，但需用户交互（访问恶意页面）。该漏洞影响 Chrome 89.0.4389.128 之前的所有版本，CVSS 评分 8.8，危害等级为高危。该漏洞已被公开利用，且已被 CISA 列入已知被利用漏洞目录（KEV），建议用户尽快升级浏览器至最新版本以修复此漏洞。"
published = "2021-04-26T17:15:08Z"
remediation = "建议立即升级到 Google Chrome 89.0.4389.128 或更高版本（可自动修复 89.0.4389.127 及更早版本的漏洞）。该漏洞为 V8 引擎对不可信输入验证不足导致的堆破坏，攻击者可通过精心构造的 HTML 页面触发，进而实现远程代码执行，且已被列入 CISA KEV 已知被利用漏洞目录，风险极高。若暂时无法升级，应避免访问不可信网站与打开可疑链接，并在企业环境中通过组策略或管理软件强制推送 Chrome 安全更新，同时检测浏览器版本确认已处于 89.0.4389.128 以上版本。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome V8 模块不可信输入验证不足导致的堆破坏远程代码执行漏洞"
updated = "2026-06-17T03:35:03Z"

