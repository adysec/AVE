[basic]
description = "GNU Mailman 2.0.x 版本在管理员登录页面以及 Pipermail 索引摘要页面中存在跨站脚本（XSS）漏洞。由于程序未能对用户输入的内容进行充分的过滤和转义，远程攻击者可通过构造包含恶意脚本的特制请求，诱导管理员访问相关页面，从而在管理员的浏览器上下文中执行任意 JavaScript 代码。该漏洞影响 Mailman 2.0.11 之前的所有版本，可能导致管理员会话被窃取、页面内容被篡改或敏感信息泄露。"
published = "2002-06-18T04:00:00Z"
remediation = "tags as required.<value>立即升级 GNU Mailman 至 2.0.11 或更高版本，该版本修复了管理员登录页面与 Pipermail 索引摘要中的 XSS 漏洞。升级后，在配置文件 mailman.cfg 中设置 `DEFAULT_URL_PATTERN` 和 `HTML_FILTER_ON` 以启用输入过滤。在完成升级前，可临时禁用 Pipermail 索引摘要功能（修改 `DEFAULT_EMAIL_STYLE` 或移除 `/ Pipermail` 路径映射），并对管理员登录页面的所有用户输入进行 HTML 实体编码，防范恶意脚本注入。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "GNU Mailman 跨站脚本漏洞"
updated = "2026-06-16T21:57:20Z"

