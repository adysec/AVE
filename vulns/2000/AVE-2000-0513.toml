[basic]
description = "alt-n 公司 WorldClient 2.1 标准版所集成的 WDaemon Web 服务器存在目录遍历漏洞。远程攻击者无需身份认证即可通过向服务器发送包含 `..`（点点）序列的特制 HTTP 请求，突破路径限制读取服务器上的任意文件，导致敏感信息泄露。该漏洞影响 WorldClient 2.1 标准版，攻击条件低，仅需网络可达即可利用。"
published = "2000-07-12T04:00:00.000"
remediation = '立即升级 WorldClient 至 2.1 以上版本，或升级至 MDaemon 最新版（该漏洞已在后续版本修复）。如无法升级，在 Web 服务器或反向代理层配置 URL 过滤规则，拦截包含 `../` 或 `..\` 的请求路径，并限制 Web 进程对文件系统的访问权限，仅允许读取 Web 根目录下的文件。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "alt-n WorldClient 目录遍历漏洞"
updated = "2026-06-16T21:52:12.680"

