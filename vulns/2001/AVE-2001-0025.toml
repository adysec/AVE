[basic]
description = "CVE-2001-0051是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-02-16T05:00:00.000"
remediation = "立即修改 IBM DB2 Universal Database 6.1 的默认账户密码：Windows 平台将 db2admin 密码改为高强度随机值，Linux 平台将 db2inst1、db2as、db2fenc1 的密码 ibmdb2 全部替换为强密码。删除或禁用所有非必要的默认账户。通过防火墙限制数据库端口（50000/DB2）的入站访问，仅允许可信 IP 连接。升级至 DB2 6.1 Fix Pack 及以上版本以获取官方安全补丁。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "IBM DB2 通用数据库默认密码远程未授权访问漏洞"
