[basic]
description = "HP-UX 11.00 及更早版本中 auto_parms 和 set_parms 程序存在远程代码执行与拒绝服务漏洞，未经身份认证的远程攻击者可通过发送特制参数触发缓冲区溢出或命令注入，导致在目标系统上以 root 权限执行任意命令或导致服务拒绝。该漏洞影响 HP-UX 11.00 及更早版本，CVSS 评分 10.0（CVSS:AV:N/AC:L/Au:N/C:C/I:C/A:C），攻击向量为网络、攻击复杂度低、无需认证、机密性/完整性/可用性均完全丧失，危害等级为严重。攻击者无需身份认证即可远程发起攻击，利用方式为向易受攻击的 auto_parms/set_parms 服务发送精心构造的恶意参数载荷。HP 已发布安全补丁修复该漏洞，建议用户尽快升级至修复版本。"
published = "2001-01-09T05:00:00.000"
remediation = "建议升级至 HP-UX 11.00 补丁 PHNE_19501 或 PHNE_19502 及以上版本，或升级至 HP-UX 11i v1 (11.11) 及以上版本。若无法立即升级，可暂时禁用 auto_parms 和 set_parms 服务，或在防火墙层面限制对相关服务端口的访问作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "HP HP-UX 远程代码执行漏洞"
updated = "2026-06-16T21:53:12.257"

