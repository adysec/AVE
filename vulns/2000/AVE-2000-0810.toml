[basic]
description = 'Unify eWave ServletExec AS v3.0C 存在JSP源代码泄露漏洞。该漏洞的原理是攻击者可以通过构造特定的HTTP请求，在请求路径末尾添加特殊字符（如"."、"+"或"%20"）来绕过服务器对JSP页面的编译执行，直接获取JSP源文件内容。此漏洞影响使用ServletExec 3.0C版本的应用服务器，攻击者无需身份认证即可远程触发。攻击条件为目标服务器运行受影响版本的ServletExec并允许外部HTTP访问。利用方式为攻击者向目标发送包含特殊后缀字符的HTTP请求，服务器将JSP文件以源代码形式返回，导致敏感信息泄露，包括数据库连接信息、业务逻辑代码等，可能被进一步利用进行二次攻击。'
published = "2001-01-09T05:00:00.000"
remediation = "升级到 Unify eWave ServletExec AS v3.0D 或更高版本，修复了通过特殊字符结尾 HTTP 请求读取 JSP 源代码的漏洞。如无法立即更新，可通过防火墙配置阻止包含 '.'、'+' 或 '%20' 等字符的 HTTP 请求，并禁用过期 ServletExec 服务。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Unify eWave ServletExec JSP源代码泄露漏洞"
updated = "2026-06-16T21:53:10.633"

