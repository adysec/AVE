[basic]
description = "OpenBSD、NetBSD 等多款 BSD 系统自带的 eeprom 程序存在格式字符串漏洞。由于程序在处理用户输入时未对格式字符串参数进行正确过滤，本地攻击者可通过向 eeprom 程序传递特制的格式字符串参数触发该漏洞，导致内存越界读写，从而提升至 root 权限。该漏洞影响 OpenBSD、NetBSD 及其他基于 BSD 的操作系统，攻击者需拥有本地访问权限，无需额外认证即可利用，危害等级高。"
published = "2000-12-19T05:00:00Z"
remediation = "立即应用 OpenBSD 官方补丁：下载 ftp://ftp.openbsd.org/pub/OpenBSD/patches/2.7/common/028_format_strings.patch 并按照说明编译安装修复后的 eeprom 程序。如无法打补丁，建议升级到 OpenBSD 2.8 及以上版本，或移除 eeprom 的 setuid 位以限制本地提权风险。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "OpenBSD NetBSD eeprom 格式字符串漏洞"
updated = "2026-06-16T21:52:56Z"

