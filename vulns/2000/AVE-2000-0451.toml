[basic]
description = "Sybergen SyGate 2.0 及 3.11 版本在处理 DNS UDP 数据包时存在缺陷，远程攻击者无需身份认证即可向目标系统的内部网络接口发送特制的畸形 DNS UDP 数据包，触发服务崩溃或停止响应，导致拒绝服务。该漏洞利用难度低，攻击者只需构造恶意 DNS 请求包即可实施攻击，影响 SyGate 网关产品的网络可用性。官方已发布修复版本，建议用户升级至最新版。"
published = "2000-06-30T04:00:00Z"
remediation = "Sybergen Sygate 2.0/3.11 已停止维护且厂商已不存在，无法通过官方补丁修复。建议立即迁移至仍在安全支持周期内的防火墙产品（如 Windows Defender 防火墙、第三方企业防火墙等），并在迁移完成前在网关/路由器层面过滤入站畸形 DNS UDP 数据包，阻止外部对内部接口的 DNS 协议访问。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Sybergen Sygate DNS UDP数据包拒绝服务漏洞"
updated = "2026-06-16T21:52:01Z"

