[basic]
description = "American Power Conversion (APC) PowerChute 的 HTTP 管理服务使用了硬编码的默认用户名和密码，远程攻击者可通过网络利用这些默认凭据直接登录管理后台，获取系统的完全控制权限。该漏洞影响 APC PowerChute 系列产品，攻击者无需任何特殊权限即可实施攻击，CVSS 评分 9.0，危害等级严重。厂商建议用户立即修改默认凭据或限制管理端口的网络访问。"
published = "2000-12-31T05:00:00Z"
remediation = "立即修改 APC PowerChute HTTP 管理服务的默认用户名和密码，使用强密码策略（至少 12 位含大小写字母、数字和特殊字符）。在防火墙层面限制仅允许受信任的管理 IP 段访问 PowerChute 的 Web 管理端口（默认 80/443），禁止从公网直接访问。由于该产品已停止维护，建议迁移至 Schneider Electric 当前支持的替代管理平台（如 EcoStruxure IT）。"
score = 9
severity = "CRITICAL"
sources = ["cve"]
title = "APC PowerChute 默认凭据远程访问漏洞"
updated = "2026-06-16T21:53:27Z"

