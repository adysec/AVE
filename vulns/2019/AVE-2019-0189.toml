[basic]
description = "Zarafa WebAccess 是一款企业级 Web 邮件客户端，该漏洞存在于 Zarafa Webapp 2.0.1.47791 及更早版本中，属于未经身份验证的反射型跨站脚本（XSS）漏洞。攻击者无需任何认证即可构造包含恶意 JavaScript 代码的特制 URL，诱使已登录 Zarafa WebAccess 的用户点击该链接后，恶意脚本将在用户浏览器上下文中执行，从而窃取会话令牌、篡改页面内容或执行其他恶意操作。该产品目前已停止维护，部分原 Zarafa 用户已迁移至相关产品 Kopano。成功利用的前提是攻击者能够诱导目标用户访问包含恶意脚本的 URL，且目标用户已在浏览器中处于 Zarafa WebAccess 的登录状态。"
published = "2019-04-11T19:29:01Z"
remediation = "建议立即升级 Zarafa Webapp 至 2.0.1.47791 之后的修复版本，或迁移至官方继任产品 Kopano Groupware。若暂时无法升级，可在 Web 应用防火墙（WAF）层面拦截包含 `<svg/onload=`、`<script>` 等 XSS 特征的恶意请求参数；同时在应用层对 `fccc` 等输入参数实施严格的 HTML 实体编码输出与 CSP 策略限制内联脚本执行。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Zarafa WebAccess 跨站脚本漏洞"
updated = "2026-06-17T02:40:16Z"

