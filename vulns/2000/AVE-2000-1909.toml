[basic]
description = 'Windows 2000 系统监视器(System Monitor)ActiveX 控件存在缓冲区溢出漏洞，远程攻击者可通过在 HTML 源码中构造超长的 LogFileName 参数触发该漏洞，导致任意命令执行。该漏洞无需身份认证即可远程利用，攻击者只需诱导用户访问恶意网页即可完成攻击，CVSS 评分 10.0，危害等级严重。微软将此漏洞归类为"ActiveX 参数验证"漏洞，影响 Windows 2000 系统。'
published = "2000-12-11T05:00:00.000"
remediation = "安装微软 MS00-085 安全更新（KB278511），下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=19B2BF01-BA79-47D6-9372-79A9FFF9663B。如无法安装补丁，在 IE 安全设置中将 Internet 区域 ActiveX 控件启用选项改为「禁用」，并安装 Outlook 安全更新将邮件阅读区域设为受限站点以阻止 HTML 邮件调用 ActiveX 控件。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Microsoft Windows 2000 System Monitor ActiveX 控件缓冲区溢出漏洞"
updated = "2026-06-16T21:53:00.920"

