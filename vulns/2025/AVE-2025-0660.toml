[basic]
description = "Windows Telephony Service（电话服务API）存在堆缓冲区溢出漏洞（CWE-122），攻击者可通过向目标系统发送特制请求触发内存损坏，导致远程代码执行。该漏洞影响多个Windows版本，CVSS评分8.8，危害等级高。利用需用户交互（如点击恶意链接），成功后可获取系统控制权。Microsoft已在2025年2月安全更新（KB5051974等）中修复。"
published = "2025-02-11T18:15:31Z"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新（KB5051974），适用于受影响版本的 Windows。可通过 Windows Update 自动获取更新，或从 Microsoft 更新目录手动下载安装。如无法立即打补丁，建议禁用 Telephony 服务（TapiSrv）并限制网络侧对 RPC 端口的访问作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:42:45Z"

