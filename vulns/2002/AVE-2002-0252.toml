[basic]
description = 'Tarantella Enterprise 3 在安装过程中创建了一个名为"spinning"的临时文件，该文件以可预测的方式生成且权限配置不当。本地攻击者可通过创建指向目标文件的符号链接（symlink），利用该临时文件的原子性替换特性，将任意文件覆盖为攻击者指定的内容。此漏洞影响 Tarantella Enterprise 3 的安装系统，攻击条件为攻击者需具备本地访问权限，利用方式简单，无需特殊权限即可触发文件覆盖，可能导致系统配置文件被篡改或关键数据被破坏。'
published = "2002-05-31T04:00:00Z"
remediation = "升级到 Tarantella Enterprise 3.1 或更高版本，或通过 Oracle Secure Global Desktop 替代产品。安装前确保 /tmp 目录无恶意符号链接，并以非 root 用户运行安装程序。"
score = 1.2
severity = "LOW"
sources = ["exploitdb"]
title = "Tarantella Enterprise 3 - Symbolic Link 漏洞"
updated = "2026-06-16T21:57:09Z"

