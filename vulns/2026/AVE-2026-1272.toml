[basic]
description = "Open WebUI 在验证用户提交的 URL 时，通过 DNS 解析主机名并拒绝私有、回环及链路本地地址，但后续 HTTP 客户端在建立连接时再次解析该主机名，导致存在校验与使用时间差（TOCTOU）漏洞。已认证攻击者若控制所提交主机名的权威 DNS 服务，可在验证阶段返回公网地址、在连接阶段返回内网地址，从而绕过 SSRF 防护机制，使服务器向内部网络发起请求。该漏洞影响 0.11.0 之前的所有版本，攻击者可利用 URL 检索、聊天图片获取、图片编辑及 OAuth 头像获取等入口，访问云实例元数据、回环管理接口或内部服务，部分路径会将响应返回给攻击者，OAuth 路径还会将访问令牌泄露给内网目标。"
published = "2026-08-04T21:16:36.703"
remediation = "立即升级 Open WebUI 至 v0.11.0 或更高版本，该版本将 URL 验证从预先解析改为连接层验证，通过 requests 传输适配器解析主机名并绑定同一已验证地址，aiohttp 解析器同步执行全局 IP 检查，从而阻断 DNS 重绑定绕过。若暂时无法升级，可在反向代理层面限制对外部未授权 DNS 的解析，并禁用非必要的 OAuth 头像自动更新功能（设置 OAUTH_UPDATE_PICTURE_ON_LOGIN=false）以缩小攻击面，同时监控实例元数据端点 169.254.169.254 的异常访问。"
score = 6.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Open WebUI DNS重绑定SSRF绕过漏洞"
updated = "2026-08-05T15:16:53.070"

