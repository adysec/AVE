[info]
author = "ave"
description = "Helix GNOME Updater（helix-update）0.5及更早版本存在竞态条件漏洞，本地用户可在root开始安装软件包前创建/tmp/helix-install目录，从而将任意RPM包以root权限安装到本地系统，实现权限提升。"
id = "POC-AVE-2000-0874"
name = "CVE-2000-0722 PoC"
severity = "medium"
tags = ["ave-2000-0874"]
vuln_id = [
    "CVE-2000-0722",
    "AVE-2000-0874",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/tmp/helix-install"
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["root:"]
