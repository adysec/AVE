[info]
author = "AVE"
description = "检测 Avaya Argent Office DNS 服务是否运行于 UDP 53 端口，确认存在 CVE-2001-1259 拒绝服务漏洞的攻击面"
id = "POC-AVE-2001-0498"
name = "CVE-2001-1259 PoC"
severity = "medium"
tags = ["cve-2001-1259"]
vuln_id = [
    "CVE-2001-1259",
    "AVE-2001-0498",
]

[poc]
logic = "all"

[[poc.requests]]
dns_type = "A"
path = "{{Hostname}}"
protocol = "dns"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["IN"]
