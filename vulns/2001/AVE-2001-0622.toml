[basic]
description = 'HP HP-UX 11.04 及更早版本的 inetd 服务存在拒绝服务漏洞。当服务器使用 "swait" 状态时，远程攻击者无需身份认证即可利用该漏洞，通过发送特制请求导致 inetd 服务进入异常状态，从而造成服务崩溃或无法响应正常请求。该漏洞影响 HP-UX 11.04 及之前版本，CVSS 评分 5.0，危害等级中危。建议用户升级到不受影响的版本或应用厂商发布的安全补丁。'
published = "2001-02-12T05:00:00Z"
remediation = "升级 HP-UX 系统至 11.04 之后的安全版本，或应用 HP 安全公告 HPSBUX0101-136 中提供的补丁。如无法升级，可在 inetd 配置中禁用不必要的服务，并通过防火墙限制对 inetd 服务的网络访问以降低风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "HP HP-UX 11.04 inetd 拒绝服务漏洞"
updated = "2026-06-16T21:53:40Z"

