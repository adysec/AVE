[basic]
description = "RealNetworks RealPlayer 的 Cook 音频编解码器存在堆缓冲区溢出漏洞。当解析 Real Audio 文件中 cook 音频编解码器信息时，未对 subbands 字段数量进行正确边界检查，攻击者可构造包含大量 subbands 的恶意 Real Audio 文件，诱使用户打开后触发堆缓冲区溢出，导致远程代码执行。该漏洞影响 RealPlayer 11.0 至 11.1、RealPlayer SP 1.0 至 1.1.5、Mac RealPlayer 11.0 至 12.0.0.1444 及 Linux RealPlayer 11.0.2.1744 版本，CVSS 评分 9.3，危害严重。用户需升级至 RealPlayer 12.0.1.609 及以上版本修复。"
published = "2010-12-14T16:00:04Z"
remediation = "建议立即升级 RealPlayer 至 12.0.1.609 或更高版本（Windows/Mac/Linux 统一版本号）。若无法立即升级，可卸载 RealPlayer 并改用其他播放器，或在防火墙层面禁止 RealPlayer 访问网络以防止恶意 Real Audio 文件触发漏洞。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer 堆 corrupt 代码执行漏洞"
updated = "2026-06-16T23:24:40Z"

