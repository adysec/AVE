[basic]
description = "Apple QuickTime 7.7.2 之前版本在 Windows 平台上处理 TeXML 文件时存在多个基于栈的缓冲区溢出漏洞。远程攻击者可向目标用户发送特制的 TeXML 文件，当用户使用 QuickTime 打开该恶意文件时，触发栈缓冲区溢出，导致攻击者能够在受影响系统上执行任意代码或造成应用程序崩溃。该漏洞无需身份认证，攻击复杂度中等，CVSS 评分 9.3，危害等级严重。Metasploit 框架已集成该漏洞的利用模块，进一步降低了利用门槛。Apple 已发布 QuickTime 7.7.2 版本修复此漏洞。"
published = "2012-05-16T10:12:56Z"
remediation = "立即升级 Apple QuickTime 至 7.7.2 或更高版本，该版本已修复 TeXML 文件处理中的多个栈缓冲区溢出漏洞。由于 Apple 已停止对 Windows 版 QuickTime 的支持，建议在无法升级的环境中彻底卸载 QuickTime，或禁用浏览器中的 QuickTime 插件，同时避免打开来源不明的 TeXML 及多媒体文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime TeXML文件处理栈缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T23:38:02Z"

