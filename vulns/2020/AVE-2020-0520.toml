[basic]
description = "Oracle WebLogic Server 控制台（Console）组件存在未授权远程代码执行漏洞。未经身份认证的远程攻击者可通过 HTTP 协议访问受影响的 WebLogic 控制台，利用该漏洞无需任何权限即可完全接管目标服务器，获取对机密性、完整性和可用性的完全控制。该漏洞影响 WebLogic Server 10.3.6.0.0、12.1.3.0.0、12.2.1.3.0、12.2.1.4.0 及 14.1.1.0.0 等多个版本，CVSS 评分 9.8，危害等级严重。攻击复杂度低，无需用户交互，且漏洞已被广泛利用。Oracle 已在 2020 年 10 月关键补丁更新（CPU）中修复此漏洞，建议用户立即升级至修复版本。"
published = "2020-11-02T21:15:24.493"
remediation = "立即升级至 Oracle 2020 年 10 月关键补丁更新（CPU）对应版本：10.3.6.0.0 升级至 10.3.6.0.190716 以上，12.1.3.0.0 升级至 12.1.3.0.200929 以上，12.2.1.3.0 升级至 12.2.1.3.200929 以上，12.2.1.4.0 升级至 12.2.1.4.200929 以上，14.1.1.0.0 升级至 14.1.1.0.200929 以上。如无法立即升级，可在 Web 前端或 WAF 层面限制对 /console/、/console/css/ 等路径的访问，仅允许可信 IP 访问 WebLogic 管理控制台。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Oracle WebLogic Server Console 远程代码执行漏洞"
updated = "2026-06-17T02:55:25.783"

