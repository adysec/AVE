[basic]
description = "BIND 4 的 nslookupComplain() 函数中存在格式串漏洞，攻击者无需身份认证即可通过向 DNS 服务器发送包含恶意格式串的特制响应数据包触发该漏洞。该漏洞影响 ISC BIND 4.x 版本，可导致远程攻击者获得 root 权限，进而完全控制目标 DNS 服务器。攻击者可通过构造恶意的 DNS 查询与响应，利用格式串漏洞覆盖内存关键数据，最终实现权限提升和远程代码执行。"
published = "2001-02-12T05:00:00.000"
remediation = "建议立即将 BIND 4 升级至 4.9.8 或更高版本以修复 nslookupComplain() 函数中的格式串漏洞。由于 BIND 4 已终止生命周期且后续不再接收安全更新，强烈建议迁移至当前受支持的 BIND 9 最新稳定版。如短期内无法完成升级，可在防火墙层面限制外部对 DNS 服务的访问，仅允许可信来源发起查询，并监控 named 进程的异常日志输出作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "ISC BIND 4 nslookupComplain() 格式串溢出漏洞"
updated = "2026-06-16T21:53:29.393"

