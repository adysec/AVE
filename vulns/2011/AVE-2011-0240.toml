[basic]
description = "Google Chrome 15.0.874.102 之前版本中存在释放后使用（Use-after-free）漏洞，位于 WebKit 引擎处理编辑操作与未知插件的交互过程中。远程攻击者可诱使用户访问特制网页，在浏览器释放内存后继续访问已释放的对象，导致程序崩溃或可能执行任意代码。该漏洞无需身份认证，但需要用户交互（如点击或拖拽操作），CVSS 评分 6.8，危害等级中危。"
published = "2011-10-25T19:55:01Z"
remediation = "将 Google Chrome 升级至 15.0.874.102 或更高版本（Chrome 会自动检查更新，也可通过 chrome://settings/help 手动触发更新）。使用 Apple Safari 的用户应升级至 5.1.4 或更高版本。如无法立即升级，可禁用浏览器中未知插件（plug-in）的自动加载功能作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 释放后使用漏洞"
updated = "2026-06-16T23:34:06Z"

