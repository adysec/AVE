[basic]
description = "CVE-2000-0880是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2000-11-14T05:00:00.000"
remediation = "立即以 root 执行 chmod 600 $LPHOME/system/lpdprocess 并 chown 为 LPPlus 运行用户，禁止普通用户改写 PID 文件；同时对 $LPHOME/bin/dcclpdshut、dccshut、dccbkstshut 及对应启动程序去掉 setuid（chmod u-s）并限制仅管理员可执行（chmod 750）。若仍使用 LPPlus 3.2.2/3.3，升级到厂商后续修复版本或迁移至现代打印管理方案；临时可卸载/禁用 dcclpdser 相关服务并限制本地普通用户登录。"
score = 3.6
severity = "LOW"
sources = ["epss"]
title = "LPPlus lpdprocess 文件全局可写权限导致拒绝服务漏洞"
updated = "2026-06-16T21:52:39.750"

