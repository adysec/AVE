[basic]
description = "tags.<value>Windows NT 4.0 的 MTS 包管理注册表键存在默认权限配置错误，本地用户可利用该权限缺陷安装或修改任意的 Microsoft Transaction Server（MTS）包，从而提升权限并获取系统控制权。该漏洞影响 Windows NT 4.0 系统，攻击者无需远程访问权限即可在本地触发，利用方式简单，危害等级较高。Microsoft 后续已发布安全更新修复此权限配置问题。"
published = "2001-02-16T05:00:00.000"
remediation = '应用微软安全公告 MS00-095 提供的修复工具 regacl40，运行命令 "regacl40 -v" 修正注册表键 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Transaction Server\Packages 权限为 "Administrators、System、Creator Owner: 完全控制"。同时该工具还会修复 MS00-008 和 MS00-024 涉及的其他注册表权限问题。若无法立即运行工具，可使用 regedt32 手动将该键及其子键权限设置为仅允许管理员组、SYSTEM 和创建者所有者完全控制，移除其他用户的写入权限。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Windows NT 4.0 MTS包管理注册表权限漏洞"
updated = "2026-06-16T21:53:33.340"

