[basic]
description = "Norton AntiVirus 5.00.01C 与 Novell NetWare 客户端配合使用时存在自动保护服务重启失败漏洞。当第一个用户注销系统后，防毒软件的自动保护服务未能正确重新启动，导致后续登录的用户失去实时病毒防护能力。攻击者可在无防护状态下利用该缺陷绕过病毒检测机制，使系统暴露于恶意软件感染风险中。该漏洞无需特殊权限即可触发，影响范围涉及使用 Norton AntiVirus 与 Novell NetWare 客户端的网络环境。"
published = "2000-10-20T04:00:00.000"
remediation = "升级到Norton AntiVirus 5.00.01C之后的安全版本，或手动重启自动防护服务以确保用户注销后防护功能正常生效。建议迁移至受支持的现代防病毒解决方案。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Symantec Norton AntiVirus Novell Netware客户端自动防护失效漏洞"
updated = "2026-06-16T21:52:29.560"

