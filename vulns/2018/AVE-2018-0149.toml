[basic]
description = "PHP Proxy 3.0.3 存在本地文件包含漏洞，由于程序未对 `index.php` 中 `q` 参数传入的路径进行有效过滤和身份验证，未经认证的远程攻击者可通过构造 `index.php?q=file:///` 形式的 URI 读取服务器上的任意文件，导致敏感信息泄露。该漏洞攻击复杂度低，无需任何权限，仅需网络访问即可利用。"
published = "2018-11-22T20:29:00Z"
remediation = "立即将 php-proxy-app 升级到 v4.0.0 或更高版本（通过 `composer update` 或重新执行 `composer create-project athlon1600/php-proxy-app`）。v4.0.0 已重构 URL 处理逻辑，移除了对 `file://` 协议的解析支持。如无法升级，在 Web 服务器（Nginx/Apache）层面添加规则拦截包含 `q=file://` 的请求，或在 `index.php` 入口处校验 `$_GET['q']` 参数禁止 `file://` 协议前缀。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "PHP Proxy 本地文件包含漏洞"
updated = "2026-06-17T01:49:20Z"

