[basic]
description = "标签之间。<value>Mozilla Firefox 4.x 至 5.x、SeaMonkey 2.x 早于 2.3 版本以及 Thunderbird 6.0 之前版本的浏览器引擎中，Ogg 格式读取器存在内存安全漏洞。远程攻击者可通过向目标系统发送特制构造的 Ogg 媒体文件触发该漏洞，导致内存损坏，进而引发应用程序崩溃（拒绝服务）或可能执行任意代码。该漏洞无需身份验证即可从远程利用，攻击条件简单，危害等级达到 CVSS 满分 10.0。"
published = "2011-08-18T18:55:01Z"
remediation = "立即将 Mozilla Firefox 升级至 6.0 或更高版本（SeaMonkey 升级至 2.3，Thunderbird 升级至 6.0），该补丁修复了 Ogg 读取器中的内存破坏漏洞。如暂时无法升级，可在浏览器设置中禁用媒体自动播放功能或关闭 Ogg/Vorbis 格式支持作为临时缓解措施，同时启用操作系统 DEP 数据执行防护以降低被利用风险。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird 浏览器引擎远程代码执行漏洞"
updated = "2026-06-16T23:32:23Z"

