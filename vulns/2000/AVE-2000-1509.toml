[basic]
description = "该漏洞存在于 Conectiva Linux 发行版中 OpenLDAP 1.2.11 之前的版本。其核心原理是 logrotate 脚本在执行日志轮转操作时，会向内核日志守护进程 (klogd) 发送一个不正确的信号，导致该守护进程被意外终止。攻击者可以通过触发该脚本的执行逻辑，在无需身份验证的情况下远程导致系统日志服务崩溃，从而造成拒绝服务（DoS）影响并掩盖攻击痕迹。"
published = "2000-10-20T04:00:00Z"
remediation = "升级 Conectiva Linux 中的 OpenLDAP 至 1.2.11 或更高版本。若无法立即升级，请检查并修改 /etc/logrotate.d/openldap 配置文件，确保其发送给 klogd 的信号为正确指令，以防止内核日志守护进程被误杀。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Conectiva Linux OpenLDAP logrotate脚本拒绝服务漏洞"
updated = "2026-06-16T21:52:23Z"

