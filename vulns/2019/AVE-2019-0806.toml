[basic]
description = "Cisco Small Business RV320 和 RV325 双千兆 WAN VPN 路由器的 Web 管理界面存在访问控制错误漏洞。该漏洞源于对特定 URL 的访问控制不当，未经身份认证的远程攻击者可通过 HTTP 或 HTTPS 连接目标设备并请求特定 URL，从而下载路由器配置文件或详细的诊断信息，导致敏感信息泄露。CVSS 评分 7.5，危害等级高。Cisco 已发布固件更新修复此漏洞。"
published = "2019-01-24T16:29:00Z"
remediation = "立即将 Cisco RV320/RV325 固件升级至 1.4.2.22 或更高版本，可从 Cisco 官网 Software Center 下载。如无法升级，在防火墙 > 通用设置中禁用远程管理功能，关闭 WAN 口 Web 管理界面以降低暴露面。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Cisco Small Business RV320和RV325 访问控制错误漏洞"
updated = "2026-06-17T02:28:58Z"

