[basic]
description = "Windows Win32k 内核组件存在内存对象处理不当的特权提升漏洞。攻击者可在本地执行恶意程序或脚本，通过向 Win32k 子系统发送特制请求触发该漏洞，在无需用户交互、仅需低权限账户的前提下，将自身权限提升至 SYSTEM 级别并获得完整的系统控制权。该漏洞影响 Windows 7、Windows 8.1、Windows Server 2008 R2、Windows Server 2012 R2 等版本，CVSS 评分 7.8，危害等级高。利用该漏洞可导致敏感信息泄露、系统被完全接管等严重后果，Microsoft 已在 2019 年 4 月发布的安全更新中修复此漏洞。"
published = "2019-04-09T03:29:00Z"
remediation = "立即安装 Microsoft 2019 年 4 月安全更新（April 2019 Patch Tuesday），通过 Windows Update 或 Microsoft Update Catalog 手动下载并安装对应操作系统的补丁。Windows 7 SP1、Windows Server 2008 R2、Windows Server 2008、Windows 8.1、Windows Server 2012、Windows Server 2012 R2 用户需安装 KB4493448。Windows 10 用户需安装 KB4493472。如暂时无法打补丁，可临时禁用 Win32k 相关的窗口管理接口以降低被利用风险。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Win32k 特权提升漏洞"
updated = "2026-06-17T02:08:56Z"

