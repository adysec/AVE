[basic]
description = "Jakarta Tomcat 3.1 默认配置中未对 /admin 管理控制台进行访问限制，远程攻击者无需身份认证即可直接调用管理 Servlet，通过添加根目录上下文（Context）实现任意文件读取。该漏洞可导致敏感配置文件、源代码等机密信息泄露，影响 Tomcat 3.1 及更早版本。攻击者只需网络可达目标服务器的 8080 端口即可利用，攻击复杂度低。"
published = "2000-07-20T04:00:00Z"
remediation = '升级 Jakarta Tomcat 至 3.2 及以上版本，该版本默认限制 /admin 上下文访问。如无法升级，编辑 server.xml 移除 <Context path="/admin" .../> 配置项，或在 web.xml 中为 /admin 路径添加 IP 访问限制（<security-constraint>），仅允许受信任管理 IP 访问。同时删除 $CATALINA_HOME/webapps/admin 目录以彻底移除管理控制台。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Apache Tomcat 管理控制台任意文件读取漏洞"
updated = "2026-06-16T21:52:14Z"

