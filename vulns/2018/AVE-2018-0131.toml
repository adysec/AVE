[basic]
description = "Kubernetes Dashboard 在 1.10.1 版本之前存在身份验证绕过漏洞（CWE-306）。由于 Dashboard 未对关键功能实施有效的身份验证检查，未经身份认证的远程攻击者可直接访问 Dashboard 的 Service Account 凭据，进而读取集群内的敏感 Secret 信息。攻击者无需任何权限，仅需网络可达目标 Kubernetes Dashboard 服务即可触发。该漏洞影响所有低于 1.10.1 的 Kubernetes Dashboard 版本，CVSS 评分 7.5，危害等级高。官方已在 v1.10.1 版本中通过 PR #3289 和 #3400 修复此问题。"
published = "2019-01-03T01:29:00Z"
remediation = "立即升级 Kubernetes Dashboard 至 v1.10.1 或更高版本，该版本修复了默认 Service Account 的权限绕过问题。如无法立即升级，可通过 RBAC 限制 kubernetes-dashboard  Service Account 的权限，仅授予必要的最小权限，并禁用 Dashboard 的匿名访问。同时建议在集群入口处配置网络策略或反向代理认证，限制对 Dashboard 服务的直接访问。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Kubernetes Dashboard 身份验证绕过漏洞"
updated = "2026-06-17T01:46:55Z"

