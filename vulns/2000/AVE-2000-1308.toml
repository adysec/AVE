[basic]
description = 'Internet Explorer 5.x 在解析 HTML 文档中 ActiveX OBJECT 标签引用的 Microsoft Access 数据库文件时，不会向用户发出安全警告，导致远程攻击者可通过构造特制网页诱导用户访问，从而在用户不知情的情况下执行任意命令。该漏洞被称为 "IE Script" 漏洞，CVSS 评分 7.5，影响范围广泛，攻击者无需身份认证即可利用，危害等级高。'
published = "2000-06-27T04:00:00Z"
remediation = '安装 Microsoft 安全公告 MS00-049 提供的更新补丁，升级 Internet Explorer 至 5.01 Service Pack 2 或更高版本。如无法立即打补丁，可在 Internet 区域安全设置中将 ActiveX 控件和插件设为"禁用"，并将 Internet 区域安全级别设为"高"以阻止 ActiveX OBJECT 标签自动加载 Access 数据库文件。'
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Microsoft Internet Explorer 5.x ActiveX OBJECT 标记远程代码执行漏洞"
updated = "2026-06-16T21:52:04Z"

