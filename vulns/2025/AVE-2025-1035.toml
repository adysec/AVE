[basic]
description = "tags, as per the required format.<value>Linux 内核的 ftrace 功能在 function_stat_show() 函数中实现函数执行时间统计时，存在除零漏洞。当计算函数执行时间标准差的公式中分母表达式 x * (x - 1) * 1000 在 32 位或 64 位架构下取模运算结果为零时，会触发除零操作，导致内核产生异常或系统崩溃。该漏洞影响使用 ftrace 功能的 Linux 内核版本，攻击者需要具备本地登录权限才能触发，无需用户交互。攻击者可通过读取 ftrace 函数统计文件，在特定条件下使内核产生除零异常，造成系统宕机或进程终止，影响系统可用性。该漏洞不会导致代码执行或信息泄露。CVSS 评分为 5.5，危害等级为中等。"
published = "2025-04-01T16:15:20Z"
remediation = "将 Linux 内核升级至已修复版本。对于各稳定分支，上游修复提交为 a1a7eb89ca0b，已回植至 5.4.291、5.10.237、5.15.179、6.1.130、6.6.81、6.12.18、6.13.6 及后续版本。主流发行版方面：Debian bullseye 请升级至 5.10.237-1（DLA-4178-1），Debian bookworm 升级至 6.1.133-1（DSA-5900-1），Ubuntu 22.04 LTS 升级至内核 5.15.0-1081.87 或更高，Ubuntu 20.04 LTS 升级至 5.4.0-1146.156 或更高，Ubuntu 24.04 LTS 升级至 6.8.0-1036.40 或更高。执行 apt update && apt upgrade linux-image-$(uname -r) 完成升级后重启系统。若当前运行的是自定义编译内核，请从 https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git 拉取对应 stable 分支最新代码重新编译安装。如无法立即升级内核，作为临时缓解措施可通过 echo 0 > /sys/kernel/debug/tracing/function_profile_enabled 禁用 ftrace 函数统计功能，阻止触发除零错误的代码路径执行。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 ftrace 除零漏洞"
