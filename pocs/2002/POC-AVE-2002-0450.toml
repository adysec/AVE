[info]
author = "ave"
description = "此漏洞存在于 Microsoft Windows 经典版本（95/98/2000/NT 4.0）中的 HTML 帮助系统。攻击者可以通过构造包含恶意 HTML Help ActiveX 控件调用（clsid:adb880a6-d8ff-11cf-9377-00aa003b7a11）的 HTML 文档，利用 WinHlp32.exe 中 Item 参数长度验证不足导致的缓冲区溢出漏洞，从而在目标系统上以当前用户权限执行任意代码。漏洞触发条件为受害者打开或预览包含恶意 ActiveX 调用的 HTML 页面（如网页、HTML 电子邮件或 .chm 文件），无需身份认证即可远程利用。"
id = "POC-AVE-2002-0450"
name = "CVE-2002-0823 WinHlp32.exe 缓冲区溢出"
severity = "high"
tags = ["ave-2002-0450"]
vuln_id = [
    "CVE-2002-0823",
    "AVE-2002-0450",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/vuln-path"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["vulnerable_string"]
