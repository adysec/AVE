[basic]
description = "Alt-N MDaemon 3.1.1 及更早版本的 WebConfig 组件存在堆溢出漏洞，远程攻击者可通过向目标系统发送特制的超长 URL 请求触发堆缓冲区溢出，导致服务拒绝服务，在特定条件下可能执行任意代码。该漏洞影响 MDaemon 3.1.1 及之前版本，CVSS 评分 7.5，危害等级高。厂商已发布更新版本修复此漏洞。"
published = "2000-12-11T05:00:00.000"
remediation = "立即升级到 MDaemon 3.1.12 或更高版本，官方补丁下载地址为 ftp://ftp.altn.com/MDaemon/Release/md312.exe。如无法立即升级，可在防火墙或主机层面限制对 TCP 端口 3000（Worldclient）和 3001（Webconfig）的外部访问，仅允许可信 IP 连接，以降低被远程利用的风险。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Alt-N MDaemon WebConfig 堆溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:59.267"

