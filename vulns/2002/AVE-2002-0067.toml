[basic]
description = "TightVNC 1.2.6 之前版本存在安全绕过漏洞。该漏洞的根源在于 TightVNC 在处理多个客户端连接时，为所有连接生成相同的挑战字符串（challenge string）。未经身份认证的远程攻击者可以通过嗅探网络流量获取其他用户与服务器之间的挑战和响应数据，利用这些窃取的信息绕过 VNC 身份验证机制，无需知道目标用户的密码即可建立 VNC 连接并控制远程桌面。该漏洞影响所有运行 TightVNC 1.2.6 之前版本的 Windows、Linux 等操作系统上的 TightVNC 服务端，攻击者只要能够监听服务器与客户端之间的网络通信即可实施攻击，利用条件简单且无需特殊权限。"
published = "2002-12-11T05:00:00Z"
remediation = "立即升级到 TightVNC 1.2.6 或更高版本，该版本修复了重复使用相同质询字符串导致的认证绕过漏洞。如无法立即升级，可在防火墙中限制 VNC 端口（默认 5900/TCP）仅允许可信 IP 访问，或强制通过 SSH 隧道加密传输 VNC 流量，以防止攻击者嗅探网络中的认证质询与响应数据。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "TightVNC 远程桌面 VNC 认证绕过漏洞"
updated = "2026-06-16T21:59:07Z"

