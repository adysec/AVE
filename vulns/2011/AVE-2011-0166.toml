[basic]
description = "Mozilla Firefox 4.x 至 5 版本及 SeaMonkey 2.x（2.3 之前）在实现内容安全策略（CSP）违规报告时存在敏感信息泄露漏洞。由于在处理特定重定向导致的主机解析错误时，浏览器未能从违规报告的请求头中移除 Proxy-Authorization 凭据，导致攻击者可以通过读取这些报告获取用户的代理认证信息。远程攻击者可通过诱导用户访问精心构造的恶意网页触发该行为，从而窃取敏感的身份验证凭据。"
published = "2011-08-18T18:55:01Z"
remediation = "建议将 Mozilla Firefox 升级至 6.0 或更高版本，SeaMonkey 升级至 2.3 或更高版本。通过更新浏览器内核可修复 CSP 违规报告中敏感凭据泄露的问题。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox 敏感信息泄露漏洞"
updated = "2026-06-16T23:32:22Z"

