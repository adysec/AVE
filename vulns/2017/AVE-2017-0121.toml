[basic]
description = "PhpCollab 是一个广泛应用于东东南亚地区的免费开源协同管理系统，在 2.5.1 及更早版本中存在严重的文件上传漏洞。攻击者只需在系统中拥有认证用户权限，即可通过 clients/editclient.php 文件上传带有可执行扩展名的恶意文件到 logos_clients 目录中，并通过直接请求这些文件来获取执行权限，从而实现在目标服务器上的任意代码执行。攻击者可以控制任意文件上传路径和文件名，绕过系统验证机制上传 Webshell 文件，并通过 Web 服务器直接访问这些恶意文件，从根本上破坏系统的安全运行。该漏洞影响 PhpCollab 2.5.1 及所有更早版本的用户，攻击者无需特殊权限，只需常规认证即可触发漏洞，CVSS 评分高达 8.8，严重威胁系统安全。"
published = "2017-10-03T01:29:03Z"
remediation = '建议立即升级 PhpCollab 至 2.5.2 或更高版本；若无法升级，请在 Web 服务器配置中禁止 logos_clients/ 目录执行 PHP 脚本（Apache 用 .htaccess 添加 php_flag engine off，Nginx 用 location ~ \.php$ { deny all; }），同时在 editclient.php 上传逻辑中严格限制允许上传的文件扩展名（仅允许 jpg/png/gif）并校验 MIME 类型，必要时在 WAF 层面拦截带可执行后缀的上传请求作为临时缓解。'
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "PhpCollab PhpCollab 2.5.1 任意文件上传漏洞"
updated = "2026-06-17T01:21:46Z"

