[basic]
description = 'Windows Media Services 4.0 和 4.1 中的 Windows Media Unicast Service（单播服务）在处理特定类型连接关闭时未能正确释放已分配的内存资源，导致内存泄漏。远程攻击者无需身份认证即可通过向目标服务器发送大量被截断的连接请求，逐步耗尽系统可用内存，最终造成 Windows Media 服务崩溃或拒绝服务。该漏洞被微软命名为"Severed Windows Media Server Connection"漏洞，影响运行 Windows Media Services 4.0 和 4.1 的服务器系统，CVSS v2.0 评分为 5.0，危害等级中危。微软已在安全公告 MS00-097 中发布修复补丁。'
published = "2001-02-12T00:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS00-097 提供的补丁（下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=C5892A8F-F300-4DBA-8A44-1ADFD78EE177）。Windows Media Services 4.1（Windows 2000）用户可将系统升级至 Windows 2000 SP3 及以上版本，该修复已包含在 SP3 中。Windows Media Services 4.0 用户需单独安装对应补丁。临时缓解措施：在无法打补丁时，可在防火墙上限制对 Windows Media Unicast Service 端口（通常为 TCP 1755）的访问，仅允许可信来源连接；如服务因攻击耗尽资源，可重启 Windows Media Unicast Service 恢复服务。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows Media Services 4.0/4.1 内存泄漏拒绝服务漏洞"
updated = "2001-02-12T00:00:00Z"

