[basic]
description = "该漏洞源于 Microsoft Qlib 的 fit 函数对用户输入缺乏充分的数据验证，攻击者可构造恶意输入触发不安全的反序列化操作，导致远程代码执行。受影响的产品为 Microsoft Qlib，攻击者需诱使目标用户访问恶意网页或打开恶意文件方能利用，成功利用后可在 root 权限上下文中执行任意代码，具有较高的安全风险。建议用户将 Microsoft Qlib 升级至已修复此问题的安全版本。"
