[basic]
description = "Linux 内核 VRF（虚拟路由转发）子系统的 l3mdev_l3_out() 函数存在释放后使用漏洞。该函数在 raw_sendmsg() 等网络发送路径中被调用时未持有 RCU 读锁，导致本地低权限攻击者可通过发送特制网络数据包触发释放后使用，从而可能实现本地特权提升或造成拒绝服务。该漏洞影响使用 Linux 内核 VRF 功能的多款发行版，CVSS 评分 7.8，危害等级高。受影响版本包括但不限于 Red Hat Enterprise Linux 9、SUSE Linux Enterprise 15 等，各厂商已在 2025 年安全更新中修复此漏洞。"
published = "2025-02-27T03:15:19.970"
remediation = "升级 Linux 内核至以下修复版本之一：5.4.291、5.10.235、5.15.179 或 6.1.129 及更高版本（具体取决于所使用的稳定分支）。各 Linux 发行版已发布安全更新，Debian 用户应安装 2025 年 3 月和 5 月 LTS 公告中的修复内核，Red Hat Enterprise Linux 9 用户应安装 RHSA-2025:20518 公告中的更新内核，SUSE Linux Enterprise 15 用户应安装 SUSE-SU-2025:1177-1 公告中的补丁。如无法立即升级内核，可通过 sysctl 或内核启动参数禁用 VRF 功能作为临时缓解措施，或通过 kernel.livepatch 应用实时补丁。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 VRF 释放后使用漏洞"
updated = "2026-06-17T08:44:17.250"

