[basic]
description = "Apache Struts2 框架在 2.3 至 2.3.34 及 2.5 至 2.5.16 版本中存在远程命令执行漏洞（S2-057）。当 alwaysSelectFullNamespace 配置为 true 时（可由用户或 Convention 插件触发），攻击者可通过构造无命名空间的请求结果或使用未设置 value 和 action 的 url 标签，结合上层包的无命名空间或通配符命名空间配置，注入并执行任意 OGNL 表达式。该漏洞影响使用受影响版本的所有 Apache Struts2 Web 应用，攻击者无需身份认证即可远程利用，CVSS 评分 8.1，危害等级高。Apache 官方已在 2.18.3 和 2.5.17 版本中修复此漏洞，建议用户立即升级。"
published = "2018-08-22T13:29:00Z"
remediation = "立即升级 Apache Struts 至 2.3.35（2.3.x 分支）或 2.5.17（2.5.x 分支），两个版本均包含完整的漏洞修复且预计不存在向后兼容性问题。如因业务原因无法立即升级，可采取临时缓解措施：在 struts.xml 中确保所有 package 元素显式配置 namespace 属性，为所有 result 定义设置 namespace，并在 JSP 的 url 标签中强制填写 value 或 action 属性；同时将 alwaysSelectFullNamespace 设为 false（除非必须为 true）。升级后若日志出现 ArrayList 被排除的 WARN，需在 struts.xml 中定义 struts.excludedPackageNames 常量，排除 ognl.、javax.、freemarker.core. 等相关包。"
score = 8.1
severity = "HIGH"
sources = ["nuclei"]
title = "Apache Struts2 远程代码执行漏洞"
updated = "2026-06-17T01:36:34Z"

