[info]
author = "AVE"
description = "检测 Lotus Domino 服务器是否在 HTTP 响应头中泄露系统版本、操作系统类型和构建日期等敏感信息"
id = "POC-AVE-2000-1150"
name = "Lotus Domino HTTP 响应头信息泄露 PoC"
severity = "medium"
tags = [
    "cve-2000-1215",
    "lotus-domino",
    "information-disclosure",
]
vuln_id = [
    "CVE-2000-1215",
    "AVE-2000-1150",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = [
    "Lotus-Domino",
    "Server: Lotus",
    "Domino/5.0",
    "OS=",
    "Release=",
]
