[basic]
description = "蜂网互联（ifw8）企业级路由器 ROM v4.31 存在凭据泄露漏洞，其 Web 管理接口中的 action/usermanager.htm 页面未做任何访问权限控制，导致页面 HTML 源码中明文硬编码了管理员账号密码（CWE-798）。未经身份认证的远程攻击者只需向目标设备发送一次 HTTP GET 请求即可直接访问该页面，通过解析响应源码中的 pwd 字段提取明文密码，进而完全接管路由器管理权限。该漏洞影响所有运行 v4.31 固件的 ifw8 FR6 系列企业级路由器，攻击条件极低，无需登录凭证、无需用户交互，网络可达即可利用，CVSS v3.1 评分 7.5，危害等级高。"
published = "2019-09-14T16:15:10Z"
remediation = "联系蜂网互联（ifw8）官方技术支持获取修复该漏洞的最新固件版本并升级。在官方固件发布前，建议在防火墙或访问控制列表中限制路由器管理界面仅允许可信 IP 地址访问，修改默认管理员密码为高强度密码，并通过反向代理或 WAF 规则拦截对 /action/usermanager.htm 的外部直接访问请求，以临时缓解凭据泄露风险。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "蜂网互联 企业级路由器 凭据泄露漏洞"
updated = "2026-06-17T02:22:06Z"

