[basic]
description = "Microsoft SQL Server Reporting Services（SSRS）存在远程代码执行漏洞，其根本原因是 SSRS 在处理页面请求时对 ASP.NET ViewState 数据进行不安全的反序列化操作。攻击者可通过向 SSRS 实例的 ReportViewer.aspx 页面提交特制的恶意 ViewState 载荷，触发 LosFormatter 反序列化机制，从而在目标服务器上执行任意系统命令。该漏洞影响 Microsoft SQL Server 2012 SP4、2014 SP3 以及 2016 SP2（CU/GDR）等多个版本，CVSS v3.1 评分为 8.8，危害等级为高危。成功利用此漏洞需要攻击者具备目标服务器的低权限凭据或匿名访问权限，攻击复杂度低且无需用户交互。攻击者可通过 NTLM 认证或匿名方式访问 ReportServer/pages/ReportViewer.aspx 路径，将包含 ysoserial 生成的 TypeConfuseDelegate 恶意载荷注入到 __VIEWSTATE 字段中，通过 POST 请求发送至目标服务器触发反序列化，最终获得与 SSRS 服务进程同等权限的远程代码执行能力。该漏洞已在野外被广泛利用，CISA 已将其列入已知被利用漏洞目录，Microsoft 已于 2020 年 2 月发布安全更新进行修复。"
published = "2020-02-11T22:15:13Z"
remediation = "立即安装 Microsoft 2020 年 2 月安全更新修复此 SSRS ViewState 反序列化 RCE 漏洞：SQL Server 2016 SP2 CU11 安装 KB4535706，SP2 GDR 安装 KB4532097；SQL Server 2014 SP3 CU4 安装 KB4535288，SP3 GDR 安装 KB4532095；SQL Server 2012 SP4 GDR 安装 KB4532098。补丁可通过 Windows Update 自动安装，或从 Microsoft Update Catalog 下载离线包手动部署。如暂时无法打补丁，可在防火墙层面限制 SSRS 服务端口（默认 80/443）仅允许可信 IP 访问，或在 Reporting Services 配置中禁用不必要的扩展插件以降低攻击面。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "Microsoft SQL Server Reporting Services 远程代码执行漏洞"
