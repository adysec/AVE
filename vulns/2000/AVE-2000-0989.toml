[basic]
description = "MailForm 2.0 是一款 Perl 编写的网页表单处理 CGI 脚本。该脚本在处理文件附件的 XX-attach_file 参数时缺乏严格的输入验证，允许远程攻击者通过构造包含服务器上任意文件路径的 HTTP 请求参数，使脚本将目标文件内容以邮件附件形式回显给攻击者。该漏洞属于任意文件读取漏洞，影响所有部署了 MailForm 2.0 版本的网站。攻击者无需身份认证，仅需向目标服务器发送带有 XX-attach_file 参数的请求即可触发漏洞，进而读取服务器上任何具有读取权限的文件，包括系统配置文件、密码文件或网站源代码等敏感信息。厂商未提供明确的修复版本，建议用户移除该脚本或实施输入过滤等缓解措施。"
published = "2000-11-14"
remediation = '建议立即将受影响的 MailForm 2.0（mailform.pl）升级至 2.1 或更高版本，该版本已修复 XX-attach_file 参数缺乏输入验证的缺陷。如暂无可用补丁，须在 mailform.pl 源码中对 XX-attach_file 参数进行过滤，禁止传入包含 "../" 或绝对路径的字符串，并将附件目录严格限定为 web 服务器根目录之外的上传专用文件夹，通过 chroot 或 chdir 限制脚本可访问的文件系统范围。同时建议在 Web 服务器（如 Apache）配置中使用 .htaccess 或访问控制规则，限制 mailform.pl 的脚本执行权限，避免将表单处理功能暴露在公网。如果该软件已停止维护，最稳妥的缓解措施是彻底移除 mailform.pl，改用仍在积极维护的现代化表单处理方案。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Ranson Johnson mailform 任意文件读取漏洞"
updated = "2000-11-14"

