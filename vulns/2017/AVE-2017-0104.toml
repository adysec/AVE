[basic]
description = "WordPress Formidable Form Builder 插件（版本低于 2.05.03）存在存储型跨站脚本漏洞，源于对表单提交中 `after_html` 等多个参数缺乏充分的输入清理与输出转义。未经身份认证的远程攻击者可利用该漏洞注入任意 Web 脚本，当管理员或其他用户访问受影响页面时脚本自动执行，导致敏感信息窃取、会话劫持或恶意操作。该漏洞影响广泛部署的 WordPress 站点，CVSS 评分 8.3，危害等级高。"
published = "2024-10-16T07:15:05Z"
remediation = "立即将 WordPress Formidable Forms 插件更新至 2.05.03 或更高版本。在 WordPress 管理后台的插件页面点击「更新」即可自动升级。如无法立即更新，可临时禁用该插件作为缓解措施。该版本修复了表单预览功能中 after_html/before_html 参数导致的存储型 XSS 以及 display-frm-data 短代码中的 SQL 注入漏洞。"
score = 8.3
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress Formidable Form Builder插件 存储型跨站脚本漏洞"
updated = "2026-06-17T01:15:22Z"

