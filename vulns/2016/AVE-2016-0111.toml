[basic]
description = "Google Chrome V8 引擎中的 Array.prototype.concat 实现未正确考虑元素数据类型，远程攻击者可通过构造特制的 JavaScript 代码触发越界读取漏洞。该漏洞影响 Chrome 49.0.2623.108 之前的所有版本，攻击者只需诱使用户访问恶意网页即可触发，可能导致浏览器崩溃（拒绝服务）或潜在的其他危害。Google 已在 Chrome 49.0.2623.108 版本中修复此漏洞。"
published = "2016-03-29T10:59:00Z"
remediation = "升级 Google Chrome 至 49.0.2623.108 或更高版本，该版本已修复 V8 引擎中 Array.prototype.concat 实现的越界读取漏洞。各发行版用户请及时安装对应安全更新：Debian 用户安装 DSA-3531，Ubuntu 用户安装 USN-2955-1，Red Hat 用户安装 RHSA-2016:0525，openSUSE 用户安装 openSUSE-SU-2016:1059。如无法立即升级，可在 chrome://settings/content/javascript 中禁用 JavaScript 作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome V8 远程代码执行漏洞"
updated = "2026-06-17T00:42:19Z"

