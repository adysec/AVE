[basic]
description = "c-client IMAP 客户端（用于 imap-2002b 和 Pine 4.53）在处理恶意 IMAP 服务器返回的超大 literal 值和邮箱大小时存在整数符号错误和整数溢出漏洞。远程攻击者可通过搭建恶意 IMAP 服务器向客户端发送特制的大尺寸数据触发该漏洞，导致客户端崩溃（拒绝服务）或执行任意代码。该漏洞影响 imap-2002b 及 Pine 4.53 等使用 c-client 库的邮件客户端软件，CVSS 评分 7.5，危害等级高。"
published = "2003-06-16T04:00:00Z"
remediation = "升级 imap-2002b 至 imap-2002c 或更新版本，Pine 用户升级至 4.58 或更高版本。Red Hat 系统安装 RHSA-2005-015 或 RHSA-2005-114 提供的更新包；Debian 系统安装 DSA-309 提供的更新。如无法立即升级，避免连接不可信的 IMAP 服务器，并在客户端网络层面限制出站 IMAP 连接作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "University of Washington c-client IMAP 客户端整数溢出拒绝服务与远程代码执行漏洞"
updated = "2026-06-16T22:01:55Z"

