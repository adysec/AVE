[basic]
description = "Lotus Domino 服务器 5.0.8 版本的默认配置会在 HTTP 响应头中包含系统版本、操作系统类型及构建日期等敏感信息。远程攻击者无需任何身份认证，仅通过发送正常的 HTTP 请求即可从返回头中获取这些信息，进而利用收集到的系统版本信息实施针对性攻击。该漏洞属于信息泄露类型，虽不直接导致代码执行，但可为后续攻击提供情报支撑。建议升级至更高版本或手动配置隐藏 HTTP 头中的系统信息。"
published = "2001-09-19T04:00:00Z"
remediation = "升级 Lotus Domino 至 5.0.9 或更高版本，该版本已修复默认在 HTTP 响应头中泄露系统信息的问题。如无法升级，可在 Domino 服务器配置文档中设置 HTTP 响应头过滤规则，移除 Server 头中的版本、操作系统和构建日期信息，或通过反向代理（如 Nginx、Apache）在转发响应前重写或剥离 Server 头字段。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "IBM Lotus Domino 信息泄露漏洞"
updated = "2026-06-16T21:53:23Z"

