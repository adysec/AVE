[basic]
description = "Linux 内核 ath11k 无线驱动在处理监视器目标环（monitor destination ring）时存在无限循环漏洞。当驱动从硬件接收无效的 buf_id 时，无法获取对应的有效缓冲区，导致目标环处理陷入死循环，进而引发内核崩溃（RCU stall）。本地攻击者可通过低权限访问触发该条件，造成拒绝服务。该漏洞影响使用 WCN6855、QCN9074 等芯片的 Linux 系统，CVSS 评分 5.5，危害等级中等。"
published = "2025-04-16T15:15:53Z"
remediation = "立即升级 Linux 内核至 6.14.2、6.12.68 或 6.6.122 及以上版本（含对应稳定分支修复）。Ubuntu 25.04 用户更新至 linux-image-6.14.0-22-generic (6.14.0-22.22) 并重启系统。无法立即升级时，可卸载 ath11k 内核模块（modprobe -r ath11k_pci）禁用受影响无线网卡驱动作为临时缓解。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel ath11k 无线驱动拒绝服务漏洞"
updated = "2026-06-17T08:14:37Z"

