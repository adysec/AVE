[basic]
description = "KMCIS CaseAware 的 login.php 页面中存在反射型跨站脚本（XSS）漏洞，用户参数（usr）在传递至查询字符串时未经过充分的过滤与转义处理。远程攻击者可构造包含恶意 JavaScript 代码的特制 URL，诱使已登录用户点击，从而在目标浏览器会话中执行任意脚本，窃取会话凭证或发起钓鱼攻击。该漏洞影响 KMCIS CaseAware 相关版本，CVSS 评分 6.1，危害等级中危。"
published = "2017-05-01T14:59:00Z"
remediation = "对 login.php 中 usr 参数的所有用户输入进行严格的 HTML 实体编码和输出转义，使用白名单过滤机制禁止特殊字符。建议在 Web 应用防火墙（WAF）层面添加针对 XSS 的检测规则，拦截包含 &lt;script&gt;、onerror 等恶意载荷的请求。由于 KMCIS 已停止维护，建议迁移至其他受支持的案件管理系统。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "KMCIS CaseAware login.php 反射型跨站脚本漏洞"
updated = "2026-06-17T01:20:53Z"

