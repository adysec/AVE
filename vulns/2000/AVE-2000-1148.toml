[basic]
description = "Apache HTTP Server 在使用 mod_rewrite 模块配置重写规则或使用 mod_vhost_alias 模块实现大规模名称虚拟主机时存在文件泄漏漏洞。远程攻击者无需身份验证，通过发送特制的 HTTP 请求即可绕过访问控制，读取服务器上的任意敏感文件。该漏洞影响 Apache 1.3.9 等早期版本，CVSS 评分 5.0，危害等级中等，可导致服务器敏感信息泄露。Apache 已在 2000 年 1 月发布的 1.3.11 版本中修复此问题。"
published = "1999-08-20T04:00:00Z"
remediation = "将 Apache httpd 升级至 1.3.11 或更高版本，该版本已修复 mass virtual hosting 下的文件泄漏问题。升级前建议先备份配置文件。如暂无法升级，可临时禁用 mod_rewrite 和 mod_vhost_alias 模块，或使用 RewriteCond 限制允许访问的文件路径，并检查 DocumentRoot 内是否存在不必要的敏感文件暴露。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Apache httpd mod_rewrite模块文件泄漏漏洞"
updated = "2026-06-16T21:53:22Z"

