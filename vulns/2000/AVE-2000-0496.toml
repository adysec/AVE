[basic]
description = "Texas Imperial Software 出品的 WFTPD 及 WFTPD Pro 2.41 版本中存在拒绝服务漏洞。远程攻击者可通过 FTP RESTART (REST) 命令结合 STORE UNIQUE (STOU)、STORE (STOR) 或 APPEND (APPE) 等写入命令，将数据写入文件末尾之外的位置或向不存在的文件执行写入操作，导致 FTP 服务崩溃或产生异常行为。攻击无需身份认证，仅需网络访问目标 FTP 服务的 21 端口即可触发，CVSS 评分 6.4，危害等级中危。"
published = "2000-07-21T04:00:00.000"
remediation = "升级 WFTPD/WFTPD Pro 至 2.41 RC11 之后的最新修补版本（如已停止维护则迁移至 FileZilla Server 或 vsftpd 等替代方案）。临时缓解措施：在防火墙限制 FTP 端口（21）仅允许受信任 IP 访问，并禁用匿名写入权限（限制 STOU/STOR/APPE 命令）。"
score = 6.4
severity = "MEDIUM"
sources = ["epss"]
title = "Texas Imperial Software WFTPD REST命令文件写入越界拒绝服务漏洞"
updated = "2026-06-16T21:52:10.753"

