[basic]
description = 'Element InstantShop 的 add_2_basket.asp 页面存在参数篡改漏洞。攻击者可通过修改提交的隐藏表单变量 "price" 的值，以任意价格将商品加入购物车，实现低价购买高价商品。该漏洞无需身份认证即可远程利用，攻击者只需拦截并篡改 HTTP 请求中的 price 参数即可完成攻击，可能导致商家遭受经济损失。CVSS 评分 7.5，危害等级高，影响 Element InstantShop 购物车组件。'
published = "2000-12-11T05:00:00.000"
remediation = "Element InstantShop 已停止维护，建议立即迁移至其他受支持的电子商务平台。如无法迁移，需对 add_2_basket.asp 添加服务端价格校验逻辑，禁止信任客户端提交的隐藏表单字段 price，所有价格信息应从服务端数据库或会话中读取，并在提交订单时重新验证价格一致性。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Element InstantShop 购物车价格篡改漏洞"
updated = "2026-06-16T21:52:56.810"

