remediation = '''
tags.<value>[id]
ave_id = "AVE-2000-00001"
aliases = ["CVE-2000-0656"]

[basic]
title = "AnalogX Proxy 缓冲区溢出拒绝服务漏洞"
description = "AnalogX Proxy 4.04及更早版本中存在缓冲区溢出漏洞。远程攻击者无需认证即可通过向FTP代理服务发送超长USER命令（约370字节），触发边界条件错误导致代理服务崩溃，造成拒绝服务。该漏洞同样影响SMTP代理（HELO命令）和POP3代理（USER命令），攻击者只需建立TCP连接并发送特制载荷即可触发。"
severity = "MEDIUM"
score = 5.0
sources = ["cve"]
published = "2000-07-25"
updated = "2000-07-25"
remediation = "升级至AnalogX Proxy 4.5或更高版本。官方在4.5版本中修复了该缓冲区溢出问题，4.6版本确认不受影响。可从AnalogX官方网站（http://www.analogx.com/contents/download/network/proxy.htm）下载更新。若无法升级，建议限制对代理服务的网络访问。"

