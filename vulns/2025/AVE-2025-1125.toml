[basic]
description = "Linux 内核 ASoC 子系统的 imx-card 音频驱动中存在空指针解引用漏洞。当 `imx_card_probe()` 函数通过 `devm_kasprintf()` 动态分配内存失败时，该函数未对返回值进行 NULL 检查，直接使用返回的指针会导致空指针解引用，从而引发系统崩溃或内核 panic。该漏洞影响使用 imx-card 音频驱动的 Linux 内核版本，攻击者需要具备本地系统访问权限和低级别用户权限，无需用户交互即可触发，主要危害为系统可用性中断。CVSS 评分为 5.5，危害等级为中等。"
published = "2025-04-16T15:16:00Z"
remediation = "建议将 Linux 内核升级至已修复该漏洞的最新稳定版本。对于 Debian 12 用户，请执行 `apt-get update && apt-get upgrade` 安装 DSA-5907-1 安全更新；Ubuntu 25.04 用户请通过 USN-7594-1 更新内核。如无法立即升级，可尝试禁用受影响的 imx-card 相关驱动模块以缓解风险。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 ASoC imx-card 空指针解引用漏洞"
updated = "2026-06-17T08:44:58Z"

