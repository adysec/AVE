[basic]
description = "iPlanet Web Server 4.x 的 SHTML 日志记录功能存在缓冲区溢出漏洞，远程攻击者可通过向服务器提交包含超长文件名的 .shtml 文件请求触发该漏洞，导致缓冲区溢出，进而实现任意命令执行。该漏洞影响 iPlanet Web Server 4.x 系列版本，CVSS 评分 10.0，危害等级严重。攻击者无需身份认证即可远程利用，且无需用户交互，可完全控制目标服务器。"
published = "2000-12-11T05:00:00Z"
remediation = "该漏洞影响已停止维护的 iPlanet Web Server 4.x，官方已不再提供安全更新。建议升级到 Oracle iPlanet Web Server 7.x 或更高版本，或迁移至其他受支持的 Web 服务器产品。如无法升级，应在网络层面限制对服务器的未授权访问，并禁用 SHTML 日志记录功能。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "iPlanet Web Server SHTML 日志记录缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:06Z"

