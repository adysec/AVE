[basic]
description = "tags.<value>Oops! WWW 代理服务器 1.4.6 版本（可能影响其他版本）存在堆缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标代理服务器发送特制请求，触发反向 DNS 查询获取超长主机名或域名，导致堆缓冲区溢出，从而可执行任意系统命令并完全控制目标服务器。该漏洞影响部署了 Oops! 代理服务器的各类网络环境，攻击者可利用该漏洞在无需任何凭据的情况下获取服务器的完全控制权限，CVSS 评分高达 10.0，危害等级为严重。ExploitDB 已公开相关利用代码，攻击者可直接复现利用。"
published = "2001-02-12T05:00:00.000"
remediation = '立即升级 oops WWW 代理服务器至 1.4.7 或更高版本以修复堆缓冲区溢出漏洞。如无法获取更新版本，应在启动代理时添加"-r"参数禁用反向 DNS 查询功能，从而阻断攻击者利用长主机名触发溢出的路径。同时通过防火墙规则限制代理服务器的访问来源，仅允许受信任的内部网络连接，并将服务监听端口改为非标准端口以降低被扫描到的风险。若系统允许，建议将 oops 替换为仍在积极维护的 Squid 或 Nginx 代理方案，彻底消除该漏洞风险。'
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Oops! WWW Proxy Server 堆缓冲区溢出漏洞"
updated = "2026-06-16T21:53:31.220"

