[basic]
description = "Linux内核NBD（网络块设备）子系统存在释放后使用（UAF）漏洞。攻击者可通过重新连接已断开的NBD设备触发该漏洞，具体过程为：nbd_genl_disconnect()在刷新recv_work并释放初始引用后，nbd_genl_reconfigure()又重新将recv_work加入队列，随后原始引用被释放，最终recv_work回调触发对已释放内存的访问，导致内核崩溃或权限提升。该漏洞影响使用NBD模块的Linux内核系统，本地攻击者可利用此漏洞实现内核级代码执行。CVSS评分为7.8，危害等级为高危。"
published = "2025-02-27T02:15:16.833"
remediation = "升级 Linux 内核至以下版本或更高版本以修复 CVE-2025-21731：5.4.291、5.10.235、5.15.179、6.1.129、6.6.76、6.12.13、6.13.2 或 6.14。升级后重启系统使新内核生效。若无法立即升级，可在系统层面禁用 NBD（Network Block Device）模块以临时缓解风险：执行 `modprobe -r nbd` 卸载 nbd 内核模块，或通过 GRUB 内核参数 `nbd.disable=1` 阻止模块加载。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux内核 NBD 断开重连释放后使用漏洞"
updated = "2026-07-14T13:17:22.003"

