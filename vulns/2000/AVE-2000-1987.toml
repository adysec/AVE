[basic]
description = "iCal 2.1 Patch 2 的 GUI 安装程序在执行过程中会通过 `xhost +` 命令禁用 X 服务器的访问控制，导致任何远程攻击者均可无需认证即可连接到目标系统的 X 服务器，实时监控 X Windows 事件（如键盘输入、鼠标操作、窗口内容），从而窃取敏感信息并获取系统权限。该漏洞影响 iCal 2.1 Patch 2 版本，CVSS 评分 10.0，危害等级严重。官方尚未发布补丁，建议用户避免使用 GUI 安装方式或手动限制 X 服务器访问。"
published = "2000-12-11T05:00:00Z"
remediation = "安装 iCal 2.1 Patch 2 后立即执行 `xhost -` 恢复 X 服务器访问控制，或手动编辑安装脚本移除 `xhost +` 命令后再执行安装。建议升级到不受影响的版本，并在防火墙中限制 6000/TCP（X11 端口）仅允许可信来源访问。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "iCal 2.1 Patch 2 GUI权限提升漏洞"
updated = "2026-06-16T21:53:05Z"

