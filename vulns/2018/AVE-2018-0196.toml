[basic]
description = "WordPress插件Site Editor存在本地文件包含漏洞，影响1.1.1及以下版本。未经身份认证的远程攻击者可通过向editor/extensions/pagebuilder/includes/ajax_shortcode_pattern.php文件的ajax_path参数发送特制请求，利用绝对路径遍历读取服务器上的任意文件内容。该漏洞利用门槛低，攻击者无需登录即可直接发起攻击，可能导致敏感信息泄露。"
published = "2018-03-19T14:29:00.363"
remediation = "建议立即升级 WordPress Site Editor 插件至 1.1.2 或更高版本（已修复该 LFI 漏洞）。若无法升级，请通过 WordPress 后台禁用并删除该插件，或在 Web 应用防火墙（WAF）中添加规则拦截包含 `ajax_path` 参数且路径含 `../` 的请求，同时在 `.htaccess` 中禁止访问 `editor/extensions/pagebuilder/includes/ajax_shortcode_pattern.php` 文件作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress Site Editor插件 本地文件包含漏洞"
updated = "2026-06-17T02:03:06.323"

