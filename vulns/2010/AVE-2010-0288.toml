[basic]
description = "WebKit 渲染引擎在处理网页元素焦点切换时存在释放后使用漏洞，内存管理不当导致已释放内存被重复引用。未经身份认证的远程攻击者可通过构造包含恶意 JavaScript 代码的网页，诱导用户访问后触发该漏洞，实现任意代码执行或导致应用程序崩溃。该漏洞影响 Safari 5.0.1 之前版本（Mac OS X 10.5/10.6 及 Windows 平台）、Safari 4.1.1 之前版本（Mac OS X 10.4 平台），以及 webkitgtk 1.2.6 之前版本。攻击者仅需通过浏览器访问恶意页面即可完成利用，无需用户交互或身份认证，CVSS 评分 9.3，危害等级严重。"
published = "2010-07-30T20:30:01Z"
remediation = "升级 Apple Safari 到 5.0.1（Mac OS X 10.5/10.6 及 Windows）或 4.1.1（Mac OS X 10.4）；若使用 WebKitGTK，请升级到 1.2.6 或更高版本。临时缓解措施可暂时禁用 WebKit 的 element focus 相关功能，或通过浏览器安全设置限制不受信任网站的 JavaScript 执行权限。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit use-after-free 远程代码执行漏洞"
updated = "2026-06-16T23:19:18Z"

