[basic]
description = "Splunk 7.0.1 及之前版本的 server-info 端点存在信息泄露漏洞，源于该端点缺乏访问控制检查。未经身份认证的远程攻击者可向目标 Splunk 实例发送包含 `__raw/services/server/info/server-info?output_mode=json` 参数的 HTTP 请求，直接获取服务器敏感信息（如许可证密钥、版本号、构建号等配置详情）。该漏洞影响 Splunk 7.0.1 及更早版本，攻击者无需身份认证、无需用户交互即可远程利用，CVSS 3.0 评分 5.3（中危），主要影响机密性。Splunk 已在 7.0.2 版本中修复该漏洞，建议用户升级至 7.0.2 或更高版本并限制管理端口访问。"
published = "2018-06-08T12:29:00Z"
remediation = "建议立即升级 Splunk 至 7.0.2 或更高版本（官方已在 7.0.2 修复该信息泄漏漏洞）。若暂时无法升级，可在 Web 服务器或防火墙层面配置规则拦截包含 __raw/services/server/info/server-info 路径的请求，或在 Splunk Web 配置中限制对 /services/server/info/server-info 端点的匿名访问权限。同时建议轮换可能已泄露的许可证密钥等敏感信息。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "Splunk Server-Info 信息泄露漏洞"
updated = "2026-06-17T01:35:52Z"

