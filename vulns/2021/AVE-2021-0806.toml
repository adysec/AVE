[basic]
description = "Citrix ShareFile Storage Zones Controller 存在不恰当的访问控制漏洞（CWE-284），版本 5.11.20 之前受影响。未经身份认证的远程攻击者可利用该缺陷绕过鉴权，直接访问存储区域控制器的管理接口，进而完全接管存储区域控制器，实现远程代码执行。该漏洞攻击向量为网络（AV:N），攻击复杂度低（AC:L），无需权限（PR:N）和用户交互（UI:N），CVSS 3.1 基础评分 9.8（CRITICAL），影响机密性、完整性和可用性均为高。CISA 已将其列入已知被利用漏洞目录，建议立即升级至 5.11.20 或更高版本。"
published = "2021-09-23T13:15:08Z"
remediation = "立即将 Citrix ShareFile Storage Zones Controller 升级到 5.11.20 或更高版本，升级前完整备份系统配置与数据库。升级完成后，将管理控制台和 API 接口访问限制为仅允许可信内部网络 IP，关闭不必要的对外端口，并在边界防火墙部署规则阻断针对 Storage Zones Controller 的未授权访问。如暂无法立即升级，应临时隔离该服务的外部暴露，仅通过 VPN 或零信任网关访问管理界面，同时持续监控异常登录、文件上传及管理员权限变更行为。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Citrix ShareFile 存储区域控制器 远程代码执行漏洞"
updated = "2026-06-17T03:38:04Z"

