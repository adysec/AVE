[basic]
description = "Windows 数字媒体组件存在越界读取漏洞（CWE-125）。需要物理接触目标设备的低权限本地攻击者可利用该漏洞实现特权提升。该漏洞影响 Windows 10、Windows 11 及 Windows Server 等多个版本的系统，CVSS 评分 6.6（中危）。攻击无需用户交互且攻击复杂度低，成功利用后攻击者可完全访问系统敏感数据、篡改系统文件并导致系统拒绝服务。"
published = "2025-01-14T18:15:59Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 (KB5050061)，可通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。受影响版本包括 Windows 10/11 全系列及 Windows Server 2008/2012/2016/2019/2022/2025，各版本对应修复版本号见 MSRC 公告。如无法立即打补丁，建议限制本地物理访问权限，因为该漏洞需要物理访问 (AV:P) 且攻击者需具备低权限账户。"
score = 6.6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 数字媒体特权提升漏洞"
updated = "2026-06-17T08:43:08Z"

