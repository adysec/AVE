[basic]
description = "` tags.<value>Linux 内核 hns3 网络驱动程序中存在竞争条件漏洞。该漏洞源于杂项向量在请求中断时被自动启用，但服务任务尚未初始化完成，两者之间存在时间窗口。若在此窗口期内有中断被触发，系统将输出警告信息甚至导致系统不稳定。该漏洞影响搭载华为 hns3 网卡的 Linux 系统，攻击者需具备本地访问权限并具有一定操作复杂度才能触发，主要危害为系统可用性降低。Linux 内核社区已通过禁用自动启用杂项向量的方式修复此问题。"
published = "2025-01-19T11:15:10.733"
remediation = "Linux 内核 hns3 驱动存在竞争条件漏洞（CVE-2025-21651），在中断请求与杂项向量初始化之间存在时间窗口，可能导致内核警告甚至系统不稳定。建议立即升级 Linux 内核至 6.12.10 或更高版本（含 6.13+），以包含 commit 98b1e3b27734139c76295754b6c317aa4df6d32e 的修复。对于 Ubuntu 22.04 LTS 等仍受影响的发行版，请执行 apt update && apt upgrade 安装最新内核补丁。如暂无法升级内核，可在 /etc/modprobe.d/ 中添加 blacklist hns3 临时禁用该驱动模块（仅在不使用该网卡时适用），或升级至 Ubuntu 24.04 LTS 获取已修复的 6.8.0-1025.29 内核。"
score = 4.7
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Kernel hns3 网络驱动竞争条件拒绝服务漏洞"
updated = "2026-06-17T08:43:56.243"

