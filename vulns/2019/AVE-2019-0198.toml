[basic]
description = 'Reolink 多款网络摄像头产品（RLC-410W、C1 Pro、C2 Pro、RLC-422W、RLC-511W）固件版本 1.0.227 及之前版本存在操作系统命令注入漏洞（CWE-78）。漏洞位于设备的 "TestEmail" 测试邮件功能中，经过身份认证的管理员用户可在 addr1 参数中注入 Shell 元字符，利用输入验证缺陷将恶意命令拼接进入系统调用，最终以 root 权限在设备上执行任意操作系统命令。攻击向量为网络远程利用（CVSS 3.1 AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H，评分 7.2 HIGH），需具备管理员登录凭据，无需用户交互。成功利用可导致设备完全沦陷，攻击者可窃取视频流、篡改配置、植入后门或将设备纳入僵尸网络，影响监控系统的机密性、完整性与可用性。官方已发布固件更新修复该漏洞，建议用户尽快升级至最新版本并修改默认弱口令。'
published = "2019-04-08T17:29:00Z"
remediation = "立即升级 Reolink 设备固件到最新版本（≥1.0.228），具体方法是通过设备 Web 界面或官方 APP 进行在线更新；同时关闭设备的 TestEmail 功能或限制仅从可信网络访问；如无法立即更新，建议在路由器层面禁用与设备相关的服务端口，并使用防火墙规则限制对设备的非管理访问，以降低被利用的风险。"
score = 7.2
severity = "HIGH"
sources = ["kev"]
title = "Reolink 多款IPC摄像头 操作系统命令注入漏洞"
updated = "2026-06-17T02:12:05Z"

