[basic]
description = "Last Lines 2.0 的 lastlines.cgi 脚本存在目录遍历漏洞，攻击者可通过在 $error_log 参数中注入 '..' 序列绕过路径限制，实现任意文件读取。该漏洞无需身份认证即可远程利用，影响运行 Last Lines 2.0 的 Web 服务器，可导致敏感系统文件、配置文件及应用源码泄露，CVSS 评分 5.0（中危），属于路径遍历类漏洞（CWE-22）。"
published = "2001-12-30T05:00:00Z"
remediation = '立即删除或禁用 lastlines.cgi 脚本（Last Lines 2.0 已停止维护，无官方补丁）。若必须保留，需在 Web 服务器层面配置访问控制：1) 限制 CGI 目录仅允许可信 IP 访问；2) 在脚本中添加输入验证，过滤 $error_log 中的 ../ 序列及命令注入字符（; | &）；3) 使用 open(FILE, "<$unix_dir/$error_log") 显式指定只读模式防止命令执行；4) 以最低权限运行 Web 服务器进程，限制文件系统读取范围。'
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Last Lines Last Lines 2.0 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:55:48Z"

