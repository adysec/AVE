[basic]
description = "WordPress 的 Subscriber 插件（由 BestWebSoft 开发）1.3.5 之前版本存在多个存储型跨站脚本漏洞。已登录认证的攻击者可在 `bws_panel` 管理页面的 `category` 参数中注入恶意 JavaScript 代码，当管理员或其他用户访问受影响页面时脚本自动执行，可能导致会话 Cookie 窃取、管理员权限劫持或恶意操作。该漏洞影响所有使用 Subscriber 插件的 WordPress 站点，CVSS 评分 6.1，危害等级中危。用户需升级至 1.3.5 或更高版本修复。"
published = "2019-08-12T16:15:13Z"
remediation = '立即将 WordPress "Subscriber by BestWebSoft" 插件升级至 1.3.5 或更高版本。登录 WordPress 后台，进入「插件」→「已安装插件」，找到 "Subscriber" 插件点击「更新」；若无法自动更新，可从 WordPress 官方插件仓库（https://wordpress.org/plugins/subscriber/#developers）手动下载最新版本覆盖安装。升级前建议备份数据库和插件文件。'
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress subscriber 插件跨站脚本漏洞"
updated = "2026-06-17T01:12:59Z"

