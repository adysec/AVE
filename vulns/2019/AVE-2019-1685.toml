[basic]
description = "Sitecore CMS 7.0 至 7.2 及 Sitecore XP 7.5 至 8.2 的 Sitecore.Security.AntiCSRF（anti CSRF）模块存在反序列化漏洞。未经身份认证的远程攻击者可在 HTTP POST 请求的 __CSRFTOKEN 参数中注入恶意的序列化 .NET 对象，当服务器端对该参数进行反序列化处理时触发任意代码执行。该漏洞无需认证、利用复杂度低，攻击者可直接获取服务器权限并完全控制目标系统。CVSS 评分 9.8，危害等级严重。Sitecore 官方已发布安全补丁修复该漏洞。"
published = "2019-05-31T21:29:06Z"
remediation = "立即升级 Sitecore XP 至 8.2 Update-7 或更高版本（8.x 分支），或升级至 9.0 Update-2 或更高版本（9.x 分支）。若无法立即升级，可通过 WAF 规则拦截包含序列化 .NET 对象的 __CSRFTOKEN POST 参数请求，或在 IIS 中禁用受影响的 AntiCSRF 模块相关端点（/sitecore/shell/Applications/Security/CreateNewUser/CreateNewUser.aspx 等）作为临时缓解措施。参考 Sitecore 官方补丁 KB0334035 获取完整修复包。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Sitecore CMS 和 Sitecore XP 反序列化远程代码执行漏洞"
updated = "2026-06-17T02:44:46Z"

