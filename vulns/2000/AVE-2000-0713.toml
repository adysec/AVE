[basic]
description = 'Oatmeal Studios Mail File 1.10 中的 mailfile.cgi CGI 程序存在任意文件读取漏洞。远程攻击者无需身份认证即可通过 POST 请求向 "filename" 参数传入目标文件名，服务器读取该文件后将其内容通过电子邮件发送至 "email" 参数指定的地址，导致敏感信息泄露。该漏洞影响 MailFile 1.10 版本，攻击复杂度低，危害中等。'
published = "2000-12-19T05:00:00.000"
remediation = "立即删除或禁用 mailfile.cgi 脚本，或限制仅授权 IP 可访问该 CGI 目录。如仍需使用 MailFile 功能，建议升级到已修复此漏洞的最新版本，或在 Web 服务器层面对 filename 参数进行输入验证过滤。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Oatmeal Studios MailFile 1.10 任意文件读取漏洞"
updated = "2026-06-16T21:52:53.800"

