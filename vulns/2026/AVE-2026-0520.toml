[basic]
description = "Linux 内核 IIO DAC 驱动 ad3552r-hs 中存在越界写入漏洞。函数 ad3552r_hs_write_data_source 调用 simple_write_to_buffer() 后，错误地使用用户请求写入的字节数 count 而非实际写入字节数作为数组索引进行空字符截断，当 count 超过 64 字节栈缓冲区大小时触发栈上越界写入。本地低权限攻击者可通过向设备节点写入特制数据触发此漏洞，导致系统崩溃或权限提升。该漏洞影响 Linux 内核多个版本，CVSS 评分 7.8，危害等级高。"
published = "2026-02-04T17:16:20Z"
remediation = "立即更新 Linux 内核至包含修复 commit（参考 iio: backend: fix out-of-bound write 的类似修复模式）的版本。Ubuntu 24.04 LTS 用户升级至 linux-image-6.17.0-1021-azure 或等待对应 generic 内核更新；其他发行版用户更新至内核版本 >= 6.17（含对应补丁）。如无法立即更新，可通过移除 ad3552r-hs 内核模块（modprobe -r ad3552r-hs）并禁用相关 IIO 设备节点访问作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Linux Kernel IIO DAC ad3552r-hs 驱动越界写入漏洞"
updated = "2026-06-17T10:20:52Z"

