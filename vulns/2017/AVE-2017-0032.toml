[basic]
description = "DokuWiki 至 2017-02-19b 版本中存在跨站脚本（XSS）漏洞，位于 doku.php 页面的 at 参数（即 DATE_AT 变量）中。攻击者可通过构造特制的 URL 并诱导已登录用户点击，在用户浏览器中执行任意 JavaScript 代码，导致敏感信息泄露或会话劫持。该漏洞无需身份认证即可触发，但需要用户交互，影响所有使用受影响版本的 DokuWiki 实例。"
published = "2017-08-06T03:29:00Z"
remediation = "立即升级 DokuWiki 至包含 commit 6057f47 的版本（2017-02-19b 之后的任何版本），该提交在 doku.php 中对 $DATE_AT 变量输出添加了 htmlspecialchars() 转义，可有效防御反射型 XSS。如无法立即升级，可在 Web 服务器（Nginx/Apache）层面添加 WAF 规则，拦截包含 <script> 等恶意标签的 at 参数请求，或修改 inc/html.php 中 msg() 函数的输出逻辑，对用户输入进行 HTML 实体编码。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "DokuWiki doku.php 跨站脚本攻击漏洞"
updated = "2026-06-17T01:03:32Z"

