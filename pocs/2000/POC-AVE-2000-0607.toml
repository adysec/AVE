[info]
author = "AVE"
description = "Mobius DocumentDirect for the Internet 1.2 ddicgi.exe 缓冲区溢出漏洞检测。通过发送超长 User-Agent 参数的 HTTP 请求触发缓冲区溢出，验证目标是否存在该漏洞。"
id = "POC-AVE-2000-0607"
name = "CVE-2000-0828 PoC"
severity = "critical"
tags = ["ave-2000-0607"]
vuln_id = [
    "CVE-2000-0828",
    "AVE-2000-0607",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/scripts/ddicgi.exe"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["overflow"]
