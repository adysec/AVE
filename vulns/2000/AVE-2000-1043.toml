[basic]
description = "Windows 95/98/98SE 系统的 NetBIOS 客户端存在拒绝服务漏洞。远程攻击者可通过修改文件共享服务返回未知驱动程序类型，导致目标系统的 NetBIOS 客户端崩溃，造成拒绝服务。该漏洞攻击复杂度较高，需要特定网络条件配合，影响范围限于 Windows 95/98/98SE 系列操作系统，CVSS 评分 2.6，危害等级低。"
published = "2000-12-11T05:00:00.000"
remediation = 'Windows 95/98/98SE 已停止支持，建议升级至 Windows 2000 或更高版本。临时缓解措施：在网卡属性中取消"Microsoft 网络的文件和打印机共享"绑定，或在防火墙阻断 UDP 137-138、TCP 139 端口以阻止外部 NetBIOS 流量。'
score = 2.6
severity = "LOW"
sources = ["cve"]
title = "Microsoft Windows 95/98 NetBIOS Client 拒绝服务漏洞"
updated = "2026-06-16T21:52:57.060"

