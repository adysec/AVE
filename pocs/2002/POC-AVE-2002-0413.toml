[info]
author = "AVE"
description = "检测 SquirrelMail 1.2.3 之前版本 read_body.php 中 IMG 标签 javascript: URL 的 XSS 漏洞。通过访问 SquirrelMail 登录页面确认应用存在，并检测版本信息。"
id = "POC-AVE-2002-0413"
name = "CVE-2002-1649 PoC"
severity = "medium"
tags = ["cve-2002-1649"]
vuln_id = [
    "CVE-2002-1649",
    "AVE-2002-0413",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/src/login.php"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["SquirrelMail"]
