[basic]
description = ".NET 运行时密码学层（CryptoNative_GetX509NameInfo）在解析 X.509 证书时存在类型混淆漏洞（CWE-843）。攻击者可构造特制证书，利用类型混淆导致运行时内存访问异常，触发拒绝服务。该漏洞无需认证即可通过网络远程触发，影响 .NET 8/9/10 在 Linux 和 macOS 平台上的所有架构版本，CVSS 评分 7.5，危害等级高。Microsoft 已在 2026 年 7 月安全更新中修复此漏洞。"
published = "2026-07-14T18:18:35Z"
remediation = "将 .NET 运行时升级到已修复版本：.NET 8.0 升级到 8.0.29 或更高，.NET 9.0 升级到 9.0.18 或更高，.NET 10.0 升级到 10.0.10 或更高。可通过 `dotnet --info` 查看当前版本，通过 NuGet 更新 Microsoft.NetCore.App.Runtime 包引用，或通过 Visual Studio 更新 .NET SDK。自包含部署的应用需重新编译并重新部署。重启应用使更新生效。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Microsoft .NET X.509证书解析拒绝服务漏洞"
updated = "2026-07-22T21:18:01Z"

