[basic]
description = "Cisco PIX防火墙5.1.4版本在配置AAA认证并向TACACS+服务器转发认证请求时，对大量并发认证请求处理不当，未经身份认证的远程攻击者可通过向设备发送大量认证请求触发拒绝服务漏洞，导致防火墙认证服务中断。该漏洞影响Cisco PIX Firewall 515和520设备，CVSS评分5.0，危害等级中危。攻击者无需任何凭据即可在网络上发起利用，造成设备可用性部分受损。"
published = "2001-06-18T04:00:00Z"
remediation = "升级 Cisco PIX Firewall OS 至 5.1.5 或更高版本以修复此漏洞。如暂时无法升级，可在 PIX 防火墙上配置 access-list 限制仅允许受信主机访问 TACACS+ 服务器，或临时禁用 aaa authentication 配置作为缓解措施。具体操作：登录 PIX 管理界面，执行 show version 确认当前版本，通过 Cisco 官网下载 PIX OS 5.1.5 更新包并上传至设备，使用 write memory 保存配置后重启设备完成升级。若业务必须使用 TACACS+ 认证且无法立即升级，应配置 access-list 仅允许 TACACS+ 服务器源 IP 通过，并在防火墙上应用 inbound 方向过滤，阻断来自非授权主端的认证请求。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Cisco PIX 防火墙 TACACS+ 认证请求泛滥拒绝服务漏洞"
