[basic]
description = "HP-UX VVOS 10.24 和 11.04 版本中，TGA 的 NSAPI 插件以及 Java Servlet 代理存在拒绝服务漏洞。由于 NSAPI 插件在处理特定请求时缺少有效的资源控制机制，远程攻击者无需任何身份认证，即可利用该漏洞发送特制请求，导致服务器 CPU 利用率异常升高，进而耗尽系统资源，造成 Web 服务拒绝服务。该漏洞攻击复杂度低、无需认证即可远程触发，主要影响通过 NSAPI 插件承载 TGA 与 Java Servlet 代理功能的目标主机。"
published = "2000-12-19T05:00:00Z"
remediation = "立即升级 HP VVOS 到支持修复该漏洞的最新版本（建议使用 11.04 服务包更新）。如果无法立即更新，建议通过 HP-UX 系统管理界面禁用 TGA 和 Java Servlet 代理的 NSAPI 插件模块，同时在系统中启用核心保护模式并限制进程并行数，以缓解高 CPU 利用率的拒绝服务影响。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "HP-UX VVOS NSAPI 插件拒绝服务漏洞"
updated = "2026-06-16T21:52:52Z"

