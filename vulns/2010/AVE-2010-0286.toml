[basic]
description = "PHP 5.3.2 和 5.3.3 版本中，set_magic_quotes_runtime 函数与 MySQLi 扩展的 mysqli_fetch_assoc 函数存在交互缺陷。当启用 magic_quotes_runtime 时，该函数未能正确处理通过 mysqli_fetch_assoc 获取的数据，导致此前版本中已被正确过滤的恶意输入可绕过转义机制，使得上下文相关的攻击者更容易通过精心构造的输入实施 SQL 注入攻击，威胁数据库安全。"
published = "2011-01-18T20:00:10Z"
remediation = "升级 PHP 至 5.3.4 或更高版本，该版本修复了 set_magic_quotes_runtime 与 mysqli_fetch_assoc 的交互问题。如无法升级，在 php.ini 中设置 magic_quotes_runtime = Off 并改用参数化查询（Prepared Statements）替代 mysqli_fetch_assoc 直接处理用户输入。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "PHP MySQLi扩展set_magic_quotes_runtime函数SQL注入漏洞"
updated = "2026-06-16T23:25:22Z"

