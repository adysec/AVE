[basic]
description = "libsoup 库是 GNOME 和 WebKit 应用广泛使用的 HTTP 通信库，其 HTTP/2 异步消息队列处理中存在状态同步缺失缺陷。当网络操作在特定时间窗口被取消时，内部消息队列项因缺少状态检查而被重复释放（double-free），导致堆释放后使用（use-after-free）内存访问。攻击者可远程发送特制的 HTTP/2 读取和取消序列触发此漏洞，造成目标应用崩溃，属于拒绝服务攻击。该漏洞影响 libsoup 3.6.5 及之前版本，CVSS 评分 7.5，危害等级高。"
published = "2025-10-23T10:15:32Z"
remediation = """
