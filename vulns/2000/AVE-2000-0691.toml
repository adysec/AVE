[basic]
description = "Cisco Catalyst 3500 XL 系列交换机的 Web 配置接口存在未授权命令执行漏洞。当设备未设置 enable 密码时，远程攻击者无需任何身份认证，只需向目标交换机的 Web 管理界面发送包含 /exec/ 目录的特制 URL 请求，即可在设备上以最高权限执行任意系统命令。攻击者可利用该漏洞完全控制受影响交换机，进而窃取网络流量、修改配置或发起进一步内网攻击。该漏洞 CVSS 评分 10.0，危害等级严重，影响所有未设置 enable 密码的 Catalyst 3500 XL 交换机。"
published = "2000-12-19T05:00:00Z"
remediation = "立即为 Catalyst 3500 XL 交换机配置 enable 密码（全局配置模式下执行 `enable secret <密码>`），防止未授权访问 /exec/ 目录。如无需 Web 管理功能，建议在全局配置模式下使用 `no ip http server` 关闭 HTTP 服务；若必须保留，应使用 `ip http access-class <ACL编号>` 限制仅允许管理网段 IP 访问，并在接口上配置 ACL 过滤对 80 端口的非授权访问。该设备已停止支持，建议尽快迁移至受支持的 Cisco 交换机型号。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Cisco Catalyst 3500 XL 任意命令执行漏洞"
updated = "2026-06-16T21:52:49Z"

