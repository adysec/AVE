[basic]
description = "Sambar Web Server 5.2 beta 1 之前版本存在脚本源代码泄露漏洞。远程攻击者可通过向服务器发送以空格和空字符结尾的特制 URL，利用 DOS 设备名称（如 CON、NUL 等）触发该漏洞，导致服务器端脚本（如 .asp、.pl 等）源代码被直接泄露，或造成拒绝服务（资源耗尽）。攻击无需身份认证，通过网络即可远程利用，危害中等。该漏洞已有公开 PoC 可利用。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 Sambar Server 至 5.2 beta 1 或更高版本，该版本修复了通过 URL 末尾添加空格和空字符绕过脚本源码保护的问题。如无法升级，可在 Web 服务器前端部署反向代理（如 Nginx），过滤包含空字节（%00）的畸形请求 URL。"
score = 6.4
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Sambar Sambar Server 脚本源代码泄露漏洞"
updated = "2026-06-16T21:58:02Z"

