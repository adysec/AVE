[basic]
description = 'Apple iOS 5 之前版本中的 Safari 浏览器存在跨站脚本（XSS）漏洞，该漏洞源于对 HTTP "Content-Disposition: attachment" 头处理不当。远程攻击者可通过构造带有该响应头的恶意文件，诱使用户访问包含该文件的网页，从而在用户浏览器中注入并执行任意 HTML 或 JavaScript 脚本，导致敏感信息泄露。攻击者需诱导用户访问恶意服务器提供的文件，攻击复杂度较高。'
published = "2011-10-14T10:55:10Z"
remediation = "升级至 Apple iOS 5 或更高版本（iOS 5 于 2011 年 10 月发布，修复了 Safari 对 Content-Disposition: attachment 标头处理不当导致的 XSS 漏洞）。如无法升级，可在 Web 服务器端对用户上传文件强制设置 Content-Disposition: inline 并过滤 Content-Type 响应头中的危险字符，同时启用 X-Content-Type-Options: nosniff 缓解风险。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iOS Safari 跨站脚本漏洞"
updated = "2026-06-16T23:33:16Z"

