[basic]
description = "OpenSSL 0.9.6d 及更早版本、0.9.7-beta2 及更早版本在 64 位平台上处理整数的 ASCII 表示时存在缺陷，未能正确转换大整数，导致缓冲区溢出。远程攻击者无需认证即可向受影响服务发送特制数据触发该漏洞，造成拒绝服务，甚至可能执行任意代码。该漏洞影响大量使用 OpenSSL 的系统和应用，CVSS 评分 7.5，危害等级高。"
published = "2002-08-12T04:00:00Z"
remediation = "升级到 OpenSSL 0.9.6e 或 0.9.7-beta3 及以上版本。各 Linux 发行版用户应安装厂商提供的安全更新：Red Hat 安装 RHSA-2002:155 补丁，Debian 安装 DSA-136 补丁，SuSE 安装 SuSE-SA:2002:027 补丁。Apple Mac OS X 用户应安装 Apple 发布的安全更新。如无法立即升级，可在网络边界限制对受影响服务的访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "OpenSSL 64位平台整数ASCII表示处理远程代码执行漏洞"
updated = "2026-06-16T21:57:52Z"

