[basic]
description = 'Flowise 是一款用于构建大语言模型流程的拖放式用户界面工具。在 3.1.0 版本之前，该软件的 AccountService 类中的 resetPassword 方法未对密码重置令牌进行有效性校验，未检查令牌是否实际生成。默认情况下，用户账户的重置令牌为 null 值或在历史密码重置后为空字符串。未经身份认证的远程攻击者只需获取目标用户的邮箱地址，即可向 "/api/v1/account/reset-password" 端点发送包含 null 或空字符串重置令牌的伪造请求，将该用户的登录密码重置为任意值，从而绕过认证机制完全接管账户。该漏洞影响 Flowise 3.1.0 以下的所有版本，CVSS 评分为 7.7，危害等级高。FlowiseAI 已在 3.1.0 版本中修复此漏洞。'
published = "2026-04-23T20:16:16.270"
remediation = "立即将 Flowise 升级到 3.1.0 或更高版本，该版本已修复 AccountService.resetPassword 方法中未校验密码重置令牌是否实际生成的逻辑缺陷。如暂时无法升级，可通过反向代理或防火墙规则限制对 /api/v1/account/reset-password 端点的外部访问，或在 Flowise 配置中临时禁用密码重置功能以阻止攻击者利用 null 或空字符串令牌绕过认证。升级完成后，应强制所有用户重新设置密码，并检查系统中是否存在异常的密码重置日志。"
score = 7.7
severity = "HIGH"
sources = ["zdi"]
title = "FlowiseAI Flowise 密码重置认证绕过漏洞"
updated = "2026-06-17T10:46:25.653"

