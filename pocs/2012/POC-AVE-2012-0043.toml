[info]
author = "AVE"
description = "通过特制SVG文件触发Mozilla Firefox/Thunderbird/SeaMonkey的SVG过滤器实现中的越界读取漏洞，验证进程内存信息泄露"
id = "POC-AVE-2012-0043"
name = "CVE-2012-0456 PoC"
severity = "medium"
tags = ["cve-2012-0456"]
vuln_id = [
    "CVE-2012-0456",
    "AVE-2012-0043",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cve-2012-0456-poc.svg"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "feTurbulence",
    "feDisplacementMap",
    "feDiffuseLighting",
]
