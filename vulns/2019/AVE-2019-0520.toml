[basic]
description = "Google Chrome 78.0.3904.87 之前版本的 WebAudio 组件中存在释放后使用（Use-after-free）漏洞。远程攻击者可构造特制的 HTML 页面，诱使用户访问后触发堆内存破坏，导致任意代码执行。该漏洞影响 Windows/Mac/Linux 全平台 Chrome 浏览器，CVSS 评分 8.8，危害等级高。Google 已在 Chrome 78.0.3904.87 版本中修复此漏洞，建议用户及时更新。"
published = "2019-11-25T15:15:33Z"
remediation = "立即将 Google Chrome 升级至 78.0.3904.87 或更高版本，可通过 Chrome 菜单「帮助」→「关于 Google Chrome」自动检查更新。使用 Electron 框架的应用需升级至 electron@6.1.4 或 electron@7.0.1 及以上版本。如无法立即更新，可禁用 WebAudio 功能（通过组策略或企业策略配置 DisableWebAudio 为 true）作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome WebAudio 释放后使用远程代码执行漏洞"
updated = "2026-06-17T02:17:17Z"

