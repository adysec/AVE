[basic]
description = "GNU Screen 3.9.5 及更早版本中存在格式字符串漏洞。该漏洞源于程序在处理 vbell_msg 初始化变量时，未能对用户提供的输入进行严格验证，导致攻击者可以通过在输入中注入特定的格式化字符来触发漏洞。本地用户可以通过利用此缺陷读写内存数据，在特定配置环境下可进一步实现权限提升，最终获取系统的 root 最高权限。该漏洞影响所有运行受影响版本 Screen 的系统，攻击条件为攻击者需拥有本地账户访问权限。"
published = "2000-12-19T05:00:00.000"
remediation = "建议将 GNU Screen 升级到 4.0 或更高版本，以修复 vbell_msg 变量中的格式字符串漏洞。对于无法立即升级的系统，建议限制低权限用户对 screen 程序的执行权限，或通过系统审计工具监控异常的特权提升行为。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "GNU Screen 格式字符串漏洞"
updated = "2026-06-16T21:52:43.420"

