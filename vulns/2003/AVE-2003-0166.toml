[basic]
description = "tags.<value>GNU C 库（glibc）2.2.4 及更早版本中的 getifaddrs 函数存在权限校验缺陷，未对来自用户空间的 netlink 消息来源进行充分验证。本地攻击者无需身份认证即可向内核 netlink 接口发送伪造消息，冒充其他用户触发该漏洞，导致系统服务拒绝。该漏洞影响使用受影响 glibc 版本的 Linux 系统，攻击者需具备本地访问权限，通过构造恶意的 netlink 消息即可造成进程崩溃或系统不稳定。"
published = "2003-12-15T05:00:00Z"
remediation = "建议将 GNU libc (glibc) 升级至 2.2.5 或更高版本。对于使用 Linux 发行版的用户，请通过系统包管理器（如 apt-get 或 yum）更新 glibc 库到最新安全补丁版本并重启受影响的服务。"
score = 4.9
severity = "MEDIUM"
sources = ["redhat"]
title = "GNU glibc getifaddrs 函数本地拒绝服务漏洞"
updated = "2026-06-16T22:03:05Z"

