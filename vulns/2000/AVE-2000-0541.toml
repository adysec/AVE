[basic]
description = "Auction Weaver 1.0.2 及更早版本的 CGI 脚本在处理 `fromfile` 参数时未正确过滤 shell 元字符，远程攻击者可通过向目标服务器发送特制的 HTTP 请求注入任意系统命令，导致远程命令执行。该漏洞无需身份认证，攻击复杂度低，可完全控制目标系统。CVSS 评分 10.0，危害等级严重。Exploit-DB 上已有公开利用代码。"
published = "2000-10-20T04:00:00.000"
remediation = "立即升级 Auction Weaver 至 1.03 或更高版本；如厂商已停止维护，则彻底删除 auctionweaver.cgi 脚本或移除该 CGI 程序的执行权限（chmod -x），并在 Web 服务器层面限制对 /cgi-bin/ 目录的访问来源。同时对所有 CGI 输入参数进行严格的特殊字符过滤，禁止 shell 元字符（; | & ` $）传入 fromfile 参数。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "CGI Script Center Auction Weaver 远程命令执行漏洞"
updated = "2026-06-16T21:52:16.543"

