[basic]
description = "D-Link多款路由器产品（DIR-880L、DIR-868L、DIR-865L、DIR-860L特定固件版本及之前版本）的soap.cgi组件中存在操作系统命令注入漏洞（CWE-78）。攻击者可通过向SOAP接口的service参数发送恶意构造的命令注入载荷，在无需身份认证、无需用户交互的情况下远程执行任意操作系统命令，完全控制设备。该漏洞CVSS 3.1评分9.8（严重），攻击向量为网络、攻击复杂度低、无需权限、无需用户交互，对机密性、完整性、可用性均造成高危害。攻击者只需向目标路由器的SOAP接口发送包含shell命令注入载荷的SOAP请求即可实现远程代码执行，已被CISA列入已知被利用漏洞目录。D-Link官方已发布固件更新修复该漏洞，建议用户尽快升级至修复版本固件。"
published = "2018-03-06T20:29:00.987"
remediation = "建议立即升级受影响 D-Link 路由器至最新固件版本：DIR-880L 升级至 1.08B04 及以上版本，DIR-868L 升级至 FW112b04 及以上版本，DIR-65L 升级至 1.08.B01 及以上版本，DIR-860L 升级至 FW110b04 及以上版本。登录路由器管理界面（默认 http://192.168.0.1 或 http://dlinkrouter.local），在「工具」→「固件升级」中上传官网下载的对应固件版本进行升级。如暂时无法升级，建议在防火墙层面封禁 WAN 侧对 SOAP 服务端口（通常为 80/443）的访问，或在路由器管理界面关闭「远程管理」功能并禁用 SOAP 服务作为临时缓解措施。请访问 D-Link 官方支持页面（https://support.dlink.com/）下载对应型号最新固件。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "D-Link 多款路由器 操作系统命令注入漏洞"
updated = "2026-06-17T02:01:58.547"

