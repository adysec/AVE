[basic]
description = "F5 BIG-IP 设备的 Traffic Management User Interface（TMUI，又称 Configuration utility）存在远程代码执行漏洞。由于未对用户输入进行严格校验，攻击者可通过构造恶意请求执行目录遍历操作，上传或读取敏感文件，进而获取系统权限并执行任意代码。该漏洞影响 BIG-IP 15.0.0-15.1.0.3、14.1.0-14.1.2.5、13.1.0-13.1.3.3、12.1.0-12.1.5.1 及 11.6.1-11.6.5.1 版本，无需身份认证即可远程利用，CVSS 评分 9.8，危害等级严重。攻击者仅需向目标设备的 TMUI 页面发送特制 HTTP 请求即可触发漏洞，实现完全系统控制。"
published = "2020-07-01T15:15:15Z"
remediation = "标签中。<value>升级F5 BIG-IP到不受影响版本：15.x升级至15.1.0.4或更高，14.1.x升级至14.1.2.6，13.1.x升级至13.1.3.4，12.1.x升级至12.1.5.2，11.6.x升级至11.6.5.2。如暂无法升级，通过管理界面访问列表限制TMUI仅允许可信IP访问，或在防火墙上阻断外部对TMUI端口的访问。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "F5 BIG-IP TMUI 远程代码执行漏洞"
updated = "2026-06-17T03:22:25Z"

