[basic]
description = "tags as required.<value>grpc-go 的 xDS RBAC 授权引擎（internal/xds/rbac）和 HTTP/2 传输服务器实现（internal/transport）中存在多个安全漏洞。在 xDS RBAC 授权绕过漏洞中，当构建 gRPC RBAC 策略时，不支持的 Metadata 和 RequestedServerName 规则被静默忽略并视为空操作，导致授权检查失效，未经授权的远程客户端可访问受保护的 gRPC 服务。在 HTTP/2 拒绝服务漏洞中，客户端快速发起大量流创建请求后立即发送 RST_STREAM 终止流，可绕过 HTTP/2 Rapid Reset 缓解机制的阈值检查，导致目标系统 CPU 资源耗尽。此外，当 xDS RBAC 策略中的 NOT 规则包裹不支持的字段时，递归匹配器生成过程返回空值，触发运行时 panic 导致 gRPC 服务器进程崩溃。攻击者可通过发送特制的 xDS 配置或恶意构造的 HTTP/2 流重置序列在远程触发这些漏洞，无需身份认证。"
published = "2026-01-01T00:00:00Z"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
