[basic]
description = 'Oops WWW Proxy Server 1.5.2 及更早版本的 HTML 解析代码中存在缓冲区溢出漏洞。远程攻击者可通过向目标代理服务器发送大量双引号（"）字符的特制 HTTP 请求触发该漏洞，导致缓冲区溢出，进而实现任意代码执行。攻击者无需身份认证即可远程利用，CVSS 评分 10.0，危害等级严重。成功利用后可完全控制受影响服务器，造成数据泄露、服务中断等严重后果。'
published = "2001-02-12T05:00:00Z"
remediation = "立即停止使用已停止维护的 oops WWW proxy server（1.5.2 及更早版本），迁移至活跃维护的代理服务器如 Squid 或 Nginx。如临时无法迁移，在防火墙上限制对代理服务端口（默认 3879/TCP）的访问来源，仅允许可信 IP 段连接，并部署入侵检测规则（如 Snort）监控针对大量双引号字符的异常请求。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Oops Proxy Server HTML解析缓冲区溢出漏洞"
updated = "2026-06-16T21:53:31Z"

