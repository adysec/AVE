[basic]
description = "Microsoft SQL Server 及 Microsoft SQL Server Desktop Engine (MSDE) 的 xp_updatecolvbm 函数存在缓冲区长度校验不当漏洞。该函数在调用 SQL Server 扩展存储过程（XP）API 中的 srv_paraminfo 函数前，未对缓冲区长度进行充分限制。经过身份验证的本地攻击者可利用此漏洞构造超长参数，触发缓冲区溢出，导致拒绝服务或在目标系统上执行任意命令。此漏洞影响 SQL Server 7.0/2000 及对应版本的 MSDE，危害等级为中等，CVSS 评分 4.6。Microsoft 已发布安全补丁修复此漏洞，建议用户升级至最新版本。"
published = "2001-01-09T05:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-092 提供的补丁：SQL Server 7.0 用户需在 Service Pack 2 基础上安装此补丁（后续将包含于 Service Pack 3）；SQL Server 2000 用户直接安装此补丁（后续将包含于 Service Pack 1）。同时检查所有调用 srv_paraminfo() 的第三方扩展存储过程（XP），确保其在调用前分配了足够大小的缓冲区，防止缓冲区溢出。如无法立即打补丁，建议限制对 SQL Server 的登录访问权限，仅允许受信任用户连接。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft SQL Server 及 MSDE 扩展存储过程参数解析缓冲区溢出漏洞"
updated = "2026-06-16T21:53:06.987"

