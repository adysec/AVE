[basic]
description = "DbgPrint 函数是 Windows NT 系统中用于驱动程序调试消息输出的关键接口，该函数在处理调试消息时存在格式化字符串漏洞。当本地用户能够通过 DebugMessage 等方式向 DbgPrint 函数传递包含格式化字符串说明符的特制输入时，可触发内存读取或写入操作，进而执行任意代码。该漏洞影响使用 DbgPrint 输出调试信息的部分 Windows NT 驱动程序，攻击者利用此漏洞可在本地系统上提升自身权限，最终获得系统级控制权。CVSS 评分 7.2，危害等级较高。"
published = "2001-05-03T04:00:00Z"
remediation = "建议将操作系统升级至 Windows 2000 或更高版本，以获得内核 API 的安全增强。对于仍在使用 Windows NT 4.0 的旧系统，应禁用系统调试模式（Debug Mode）并限制普通用户调用 DebugMessage 相关接口，从而切断漏洞触发路径。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Windows NT 本地权限提升漏洞"
updated = "2026-06-16T21:54:01Z"

