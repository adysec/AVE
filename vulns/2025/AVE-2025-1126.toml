[basic]
description = "Linux内核的9p文件系统模块存在空指针解引用漏洞。当9p文件系统以posixacl选项挂载，且父目录设置了默认ACL（访问控制列表）时，v9fs_vfs_mkdir_dotl()函数中v9fs_fid_add()调用将fid指针置空后，后续v9fs_set_create_acl()仍期望非空指针，导致内核空指针解引用。具有本地目录创建权限的攻击者可通过在受影响挂载点下执行mkdir操作触发此漏洞，造成系统崩溃或拒绝服务。该漏洞影响使用9p文件系统并启用posixacl选项的Linux内核版本，CVSS评分为5.5。"
published = "2025-04-16T15:16:01Z"
remediation = "升级 Linux 内核至已修复版本：6.12.23、6.13.11、6.14.2 或 6.15 及以上版本。对于 Ubuntu 24.04 LTS 系统，请安装内核版本 6.8.0-86.87 或更高版本；Debian 12 (bookworm) 用户应关注官方安全更新以获取后向移植补丁。如短期内无法升级内核，可在挂载 9p 文件系统时移除 posixacl 挂载选项（例如将 mount 命令中的 -o posixacl 改为 -o noacl），作为临时缓解措施防止触发空指针解引用崩溃。同时建议定期执行 apt update && apt upgrade 以获取最新的安全补丁。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux内核 9P文件系统 空指针解引用漏洞"
updated = "2026-06-17T08:44:58Z"

