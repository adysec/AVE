[basic]
description = "Pi3Web 1.0.1 web 服务器中的 tstisapi.dll ISAPI 扩展存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标服务器发送超长 URL 的方式触发该溢出，导致服务器进程崩溃并造成拒绝服务，在特定条件下甚至可能被利用执行任意系统命令。该漏洞影响 Pi3Web 1.0.1 版本，攻击者只需通过网络向目标 Web 服务发送特制请求即可完成利用，无需任何认证凭据或特殊交互条件，利用门槛较低，危害等级为中等。"
published = "2001-05-03T04:00:00Z"
remediation = "由于 Pi3Web 1.0.1 的 tstisapi.dll 存在缓冲区溢出漏洞且该软件已停止维护，建议迁移至 Apache 或 Nginx 等现代 Web 服务器。如暂时无法替换，应升级到 Pi3Web 2.0.3 并在配置中禁用 tstisapi.dll ISAPI 扩展，同时在前端防火墙或反向代理层限制 URL 长度不超过 2048 字符，监控包含异常长 URL 的请求。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Pi3Web 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:54:03Z"

