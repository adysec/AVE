[basic]
description = "Linux内核NFS子系统中，nfs_release_folio()函数存在死锁漏洞。当kcompactd内存压缩守护进程触发页面回写时，该函数会递归调用nfs_wb_folio()，通过NFS循环挂载回传到NFSD层，最终导致kcompactd进程被无限期阻塞。攻击者需在受影响系统上具有本地低权限访问权限，并通过触发内存压缩与NFS页面回写的竞态条件来利用此漏洞，造成系统可用性完全丧失（拒绝服务）。该漏洞影响使用NFS的Linux内核版本，CVSS评分5.5，危害等级为中等。"
published = "2025-04-01T16:15:21Z"
remediation = "升级 Linux 内核至修复版本：Ubuntu 24.04 LTS 升级至 6.8.0-84.84 或更高，Ubuntu 24.10 升级至 6.11.0-28.28 或更高，RHEL/SUSE 等发行版应用对应安全更新。上游内核 6.6.83、6.12.19、6.13.7 及 6.14 之后版本已包含修复（commit ab0727d6e2196）。如无法立即升级，可临时在 /etc/fstab 的 NFS 挂载项中添加 noac 或 actimeo=0 参数禁用回写，或通过 sysctl vm.min_free_kbytes 调低内存阈值以减少 kcompactd 触发频率，但可能影响 I/O 性能。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 NFS 拒绝服务漏洞"
updated = "2026-06-17T08:44:34Z"

