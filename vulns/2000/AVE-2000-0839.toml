[basic]
description = "Netscape PublishingXpert 2.0/2.2/2.5 版本的错误处理页面 PSCOErrPage.htm 存在路径遍历漏洞，该页面未对 errPagePath 参数进行充分输入验证。未经身份认证的远程攻击者可通过向目标服务器发送包含特制 errPagePath 参数的 HTTP 请求，读取服务器上的任意文件内容，例如 /etc/passwd 等系统敏感信息。该漏洞影响 Solaris 平台，已知受影响版本包括 SunOS 5.6 和 SunOS 5.5.1，利用复杂度低，无需任何身份认证即可远程利用。由于 CGI 脚本以非 root 权限运行，攻击者无法读取需要 root 权限的敏感文件，但仍可导致信息泄露，进一步为后续攻击提供系统环境信息。厂商已在 PublishingXpert 2.5 SP2 中修复此漏洞。"
published = "2001-08-31T04:00:00Z"
remediation = "升级至 Netscape PublishingXpert 2.5 SP2 或 iPlanet PublishingXpert 2.5.2 版本，该版本修复了 PSCOErrPage.htm 中 errPagePath 参数未对输入进行校验即可读取任意文件的缺陷。升级后需验证 PSCOErrPage.htm 的 errPagePath 参数不再接受外部传入的文件路径，仅允许指向内部错误页面。如短期内无法升级，应在防火墙或反向代理层过滤对 PSCOErrPage.htm 的 errPagePath 参数请求，阻止攻击者通过该参数指定任意文件路径进行读取，并限制该页面的对外访问权限。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Netscape PublishingXpert 任意文件读取漏洞"
updated = "2026-06-16T21:53:21Z"

