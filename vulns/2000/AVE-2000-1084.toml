[basic]
description = "tags.<value>Java开发工具包（JDK）1.2.2_05及更早版本中的Java运行环境存在安全缺陷，未受信任的Java类可调用被禁止的类，从而绕过Java沙箱限制。攻击者可在目标系统上执行未授权操作，影响使用受影响JDK版本的应用程序。该漏洞利用条件为攻击者能够向目标部署恶意Java类，CVSS评分为5.1，危害等级中等。"
published = "2001-01-09T05:00:00.000"
remediation = "立即将 JDK 升级至 1.2.2_06 或更高版本，该版本已修复 Java 沙箱绕过漏洞。如无法立即升级，可在 Java 安全策略文件（java.policy）中禁用 Runtime.getRuntime().exec() 等敏感权限，限制不受信任的类加载行为。同时配置 SecurityManager 并启用详细审计日志，监控异常类调用行为。"
score = 5.1
severity = "MEDIUM"
sources = ["avd"]
title = "Sun Java Development Kit (JDK) Java类沙箱逃逸漏洞"
updated = "2026-06-16T21:53:08.667"

