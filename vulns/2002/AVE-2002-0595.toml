[basic]
description = "OmniHTTPd Web 服务器存在多个跨站脚本（XSS）漏洞，未经身份认证的远程攻击者可通过构造包含恶意脚本的 URL，诱骗用户访问受影响页面的方式，将脚本或 HTML 代码注入 Web 页面。该漏洞影响 OmniHTTPd 1.1、2.0.x 及 2.4 版本的示例应用文件，包括 test.php、test.shtml 和 redir.exe，攻击条件要求受害者在已登录会话的情况下点击恶意链接。成功利用后，攻击者可窃取用户 Cookie、会话令牌或页面内容，进而冒充用户身份执行未授权操作，影响数据保密性与完整性。建议移除或禁用服务器中的示例应用程序文件，并升级至 OmniHTTPd 官方已修复该漏洞的安全版本，同时对所有用户输入进行严格过滤和输出编码。"
published = "2003-06-09T04:00:00.000"
remediation = "删除 OmniHTTPd 安装目录下 test.php、test.shtml 和 redir.exe 等示例文件，或通过服务器配置禁用对示例应用程序的访问。由于 OmniHTTPd 已停止维护且厂商未发布修复补丁，建议迁移到 Apache 或 Nginx 等持续更新的 Web 服务器作为永久解决方案。如无法立即迁移，可在防火墙或反向代理层面拦截对 /test.shtml、/test.php、/redir.exe 等示例路径的访问作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Omnicron OmniHTTPd 跨站脚本漏洞"
updated = "2026-06-16T21:59:21.660"

