[basic]
description = "PHP-Address 0.2e 及之前版本中的 globals.php 存在远程文件包含漏洞。当 PHP 的 allow_url_fopen 和 register_globals 选项启用时，未经身份认证的远程攻击者可通过向 LangCookie 参数传递恶意 URL，实现远程文件包含，进而执行任意 PHP 代码。该漏洞影响 PHP-Address 0.2f 之前的所有版本，CVSS 评分 7.5，危害等级高。官方已发布 0.2f 版本修复此漏洞。"
published = "2002-10-04T04:00:00.000"
remediation = "升级 PHP Address 至 0.2f 或更高版本。在 php.ini 中设置 allow_url_fopen = Off 和 register_globals = Off 以禁用危险配置。如无法升级，在 Web 服务器层面（如 .htaccess 或 Nginx 配置）对 LangCookie 参数进行输入过滤，阻止包含远程 URL 的请求。同时建议迁移至仍在维护的替代方案。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "PHP Address 远程文件包含漏洞"
updated = "2026-06-16T21:58:27.117"

