[basic]
description = "Citrix SD-WAN 10.2.3之前版本及NetScaler SD-WAN 10.0.8之前版本存在SQL注入漏洞。未经身份认证的远程攻击者无需任何权限即可通过网络向受影响设备发送特制的HTTP请求，利用该漏洞注入恶意SQL语句，从而绕过认证机制、窃取敏感数据或执行任意数据库操作。由于CVSS评分高达9.8且攻击复杂度低，该漏洞危害严重，可能导致设备完全失陷。"
published = "2019-07-16T18:15:12Z"
remediation = "将 Citrix SD-WAN 升级至 10.2.3 及以上版本，将 NetScaler SD-WAN 升级至 10.0.8 及以上版本。如无法立即升级，应在网络层面限制对 SD-WAN 管理接口的访问，仅允许受信任 IP 连接，并启用 Web 应用防火墙规则拦截 SQL 注入请求。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Citrix SD-WAN SQL注入漏洞"
updated = "2026-06-17T02:15:52Z"

