[basic]
description = "Microsoft Outlook 邮件客户端在处理富文本格式（RTF）文件的 winmail.dat 附件时存在信息泄露漏洞。由于程序在解析该附件时未能对发送端路径进行脱敏处理，导致发送者机器的物理路径被包含在附件中。未经身份认证的远程攻击者可通过发送包含特制 winmail.dat 附件的邮件，诱导目标用户打开，从而获取发送端的系统文件路径信息。该漏洞影响早期的 Outlook 版本，可被用于辅助侦察发送方的系统环境，进而提升后续攻击的精准度。"
published = "2000-10-20T04:00:00Z"
remediation = "建议将 Microsoft Outlook 升级至 2002 及以上版本。对于无法升级的极旧版本，可通过在邮件设置中禁用“富文本格式 (RTF)”附件的自动解析，或在企业网关层面过滤包含 winmail.dat 附件的异常邮件以降低信息泄露风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Outlook 物理路径信息泄露漏洞"
updated = "2026-06-16T21:52:24Z"

