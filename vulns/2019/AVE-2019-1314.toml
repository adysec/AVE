[basic]
description = "Google Chrome 72.0.3626.121 之前版本中的 Blink 渲染引擎的 FileReader 组件存在释放后重用（Use-After-Free）漏洞。远程攻击者可通过构造特制的 HTML 页面诱导用户访问，触发已释放内存对象的非法访问，导致浏览器崩溃或潜在的越界内存访问。该漏洞影响 Windows/Mac/Linux 全平台 Chrome 浏览器，已被 CISA 列入已知被利用漏洞目录，且有 Metasploit 公开利用模块，实际攻击风险较高。Google 已在 2019 年 3 月发布的 Chrome 72.0.3626.121 版本中修复此漏洞。"
published = "2019-06-27T17:15:13Z"
remediation = "立即将 Google Chrome 升级至 72.0.3626.121 或更高版本（Chrome 会自动检查更新，也可访问 chrome://settings/help 手动触发更新）。对于基于 Chromium 的浏览器（如 Edge、Brave），同步更新至对应修复版本。由于该漏洞已被 CISA 列入已知被利用漏洞目录，建议启用 Chrome 自动更新功能并确保企业环境中通过组策略强制推送浏览器更新。"
score = 6.5
severity = "MEDIUM"
sources = ["kev"]
title = "Google Chrome FileReader 释放后使用漏洞"
updated = "2026-06-17T02:38:12Z"

