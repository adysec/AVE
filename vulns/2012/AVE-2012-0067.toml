[basic]
description = "Oracle MySQL Server 的 GIS Extension 子组件中存在未明漏洞。已认证的远程攻击者可通过向受影响 MySQL 服务器发送特制的 GIS 相关查询请求，利用该漏洞导致数据库服务拒绝服务。该漏洞影响 MySQL 5.1.62 及更早版本、5.5.23 及更早版本，CVSS 评分 4.0，危害等级中低。Oracle 已在 2012 年 7 月的关键补丁更新中修复此漏洞。"
published = "2012-07-17T22:55:01Z"
remediation = "升级 MySQL 至 5.1.63 或 5.5.24 及以上版本。如无法立即升级，可在 my.cnf 中禁用 GIS 相关存储引擎（如禁用 SPATIAL 索引功能），或通过防火墙限制对 MySQL 端口的访问，仅允许可信 IP 连接以降低攻击面。"
score = 4
severity = "MEDIUM"
sources = ["tenable"]
title = "Oracle MySQL Server GIS Extension 拒绝服务漏洞"
updated = "2026-06-16T23:37:30Z"

