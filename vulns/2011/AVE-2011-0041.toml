[basic]
description = "Adobe Flash Player 10.2.152.26 之前版本中存在内存破坏漏洞，由于对特定 ActionScript 3 对象的构造函数缺乏正确的类型检查，远程攻击者可通过诱导用户访问恶意构造的网页或打开特制的 Flash 文件触发该漏洞，成功利用可导致任意代码执行或拒绝服务。该漏洞无需身份认证即可远程利用，影响 Windows、macOS、Linux 等多平台，CVSS 评分 9.3，危害等级严重。Adobe 已在安全更新 10.2.152.26 中修复此漏洞。"
published = "2011-02-10T16:00:32Z"
remediation = "立即升级 Adobe Flash Player 至 10.2.152.26 或更高版本（官方安全公告 APSB11-02）。Windows 用户可通过 Adobe 官网下载安装，Linux 用户应用 Red Hat RHSA-2011-0206/0259/0368 或 SUSE 对应补丁。由于 Adobe Flash Player 已于 2020 年底停止支持，建议彻底卸载 Flash Player 并迁移至 HTML5 标准，从根本上消除此类内存破坏漏洞风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:27:40Z"

