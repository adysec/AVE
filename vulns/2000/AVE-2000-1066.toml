[basic]
description = 'Mandrake Linux 7.0 和 7.1 版本的 Xsession 文件默认配置中存在安全漏洞，系统使用 "xhost +localhost" 命令绕过了 Xauthority 访问控制机制，导致本地用户无需认证即可连接到 X 服务器。攻击者可通过监听 X Windows 事件来窃取键盘输入、截取屏幕内容等敏感信息，从而获取系统权限。该漏洞影响 Mandrake Linux 7.0 和 7.1 版本，攻击者需要拥有本地访问权限，利用难度较低，可造成机密性、完整性和可用性的完全丧失。'
published = "2000-12-11T05:00:00Z"
remediation = "删除 `/etc/X11/xdm/Xsession` 或 `/etc/X11/xinit/xinitrc` 中的 `xhost +localhost` 行，改用 `xauth` 机制进行 X11 访问控制；升级至 Mandrake Linux 7.2 及以上版本，该版本已移除此不安全默认配置；如无法升级，在 `/etc/X11/xdm/Xaccess` 中限制 XDMCP 来源地址。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Mandrake Linux Xsession 默认配置 Xauthority 访问控制绕过漏洞"
updated = "2026-06-16T21:53:04Z"

