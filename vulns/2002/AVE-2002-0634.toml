[basic]
description = "ION Script 1.4 中的 ion-p.exe 存在目录遍历漏洞。远程攻击者无需身份认证即可通过构造包含 C: 盘符或 ..（点号序列）的 page 参数，读取目标服务器上的任意文件。该漏洞影响 ION Script 1.4 版本，攻击者利用此漏洞可获取服务器上的敏感配置文件和系统文件信息。CVSS 评分为 5.0，危害等级为中等。"
published = "2003-03-31T05:00:00.000"
remediation = "建议立即更新至ION Script 2.0或更高版本以获取正式补丁修复目录遍历漏洞。如无法立即更新，可通过Web应用防火墙禁用page参数或限制路径深度，以及在服务器配置文件中设置AllowOverride None以防止目录穿越攻击。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "ION Script 目录遍历远程文件泄露漏洞"
updated = "2026-06-16T21:59:33.187"

