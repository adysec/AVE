description = "Microsoft Azure MCP AzureCliService 组件存在命令注入漏洞，攻击者可通过发送特制请求在未经验证的情况下执行任意系统命令。该漏洞源于 azure-cli-mcp 组件在使用用户提供的字符串执行系统调用前缺乏适当的输入验证，远程攻击者无需身份认证即可利用该漏洞在 MCP 服务器上下文中执行任意代码，从而完全控制受影响系统。该漏洞影响 Microsoft Azure 的 azure-cli-mcp 组件。"
