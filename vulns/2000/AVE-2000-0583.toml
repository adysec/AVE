[basic]
description = "RobTex Viking Server 1.0.6 Build 355 及更早版本（低于 1.06-370）存在缓冲区溢出漏洞。远程攻击者无需身份认证即可通过网络向目标服务器发送超长的 HTTP GET 请求，或构造超长的 Unless-Modified-Since、If-Range、If-Modified-Since 请求头，触发缓冲区溢出，导致服务拒绝响应或执行任意代码。该漏洞 CVSS 评分 7.5，危害等级高，Exploit-DB 上已有公开利用代码。"
published = "2000-10-20T04:00:00.000"
remediation = "立即升级至 RobTex Viking Server 1.06-370 或更高版本（该版本已修复缓冲区溢出问题）。由于 RobTex 已停止维护，强烈建议迁移至现代受支持的 Web 服务器（如 Apache HTTP Server 或 Nginx）作为长期解决方案。若无法立即迁移，可在网络边界防火墙或反向代理层面限制 HTTP 请求头部长度（建议不超过 4096 字节），以降低被利用风险。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "RobTex Viking Server 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:27.317"

