[basic]
description = "Oracle MySQL Server的线程池（Thread Pooling）组件存在拒绝服务漏洞，未经身份认证的远程攻击者可通过网络利用多种协议向目标服务器发送特制请求，触发该漏洞导致MySQL服务挂起或频繁可重复崩溃，造成完全拒绝服务（DOS）。该漏洞影响MySQL Server 8.0.39及更早版本、8.4.2及更早版本以及9.0.1及更早版本。由于攻击无需身份验证且攻击复杂度低，攻击者可在用户无感知的情况下远程利用此漏洞。CVSS 3.1基础评分为7.5，危害等级为高。"
published = "2025-01-21T21:15:17Z"
remediation = "建议立即将 MySQL Server 升级到 8.0.40、8.4.3 或 9.1.0 及更高版本，或应用 Oracle 2025 年 1 月关键补丁更新（CPU）以修复线程池组件中的资源分配缺陷。如无法立即升级，可通过防火墙或安全组限制对 MySQL 端口 3306 的网络访问，仅允许可信源 IP 连接，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Oracle MySQL Server 拒绝服务漏洞"
updated = "2026-06-17T08:43:40Z"

