[basic]
description = "Zope 2.2.0 至 2.2.4 版本存在安全绕过漏洞，其未能正确对 DTML 方法对象等对象构造器的遗留名称执行安全注册，导致访问控制机制被绕过。未经身份认证的远程攻击者可利用该漏洞执行未授权操作，包括未经许可的读取、修改或删除服务器上的敏感数据。该漏洞影响 Zope 2.2.0 至 2.2.4 的所有版本，攻击复杂度低，无需身份验证即可远程利用，CVSS 评分为 7.5，危害等级高。"
published = "2000-12-16T05:00:00Z"
remediation = "建议升级 Zope 到 2.2.5 或更高版本，该版本已修复 DTML 方法对象的安全注册绕过问题。若暂时无法升级，可在 Web 应用防火墙层面限制对 DTML 方法的直接访问，或禁用不必要的 DTML 方法对象作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Zope 2.2.x Web 应用服务器安全绕过漏洞"
updated = "2026-06-16T21:53:23Z"

