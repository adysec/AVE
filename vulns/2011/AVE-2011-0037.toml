[basic]
description = "Adobe Flash Player 10.2.152.26 之前版本存在内存破坏漏洞（CWE-119）。该漏洞源于程序对畸形媒体内容处理不当，导致内存越界读写。远程攻击者可通过诱导用户访问恶意网页或打开特制的 Flash 文件触发该漏洞，成功利用可导致任意代码执行或拒绝服务。攻击无需身份认证，但需要用户交互（如点击链接或打开文件），CVSS 评分 9.3，危害等级严重。Adobe 已在 Flash Player 10.2.152.26 版本中修复此漏洞。"
published = "2011-02-10T16:00:32Z"
remediation = "立即将 Adobe Flash Player 升级至 10.2.152.26 或更高版本。对于已停止支持的 Flash Player 版本，建议彻底卸载 Flash Player 组件，并在浏览器中禁用 Flash 插件（在 Chrome 中进入 chrome://settings/content/flash 设为禁止，在 IE 中通过管理加载项禁用 Shockwave Flash Object）。由于 Adobe 已于 2020 年 12 月 31 日停止 Flash 支持，强烈建议移除所有 Flash 组件并迁移至 HTML5 方案。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏漏洞"
updated = "2026-06-16T23:27:39Z"

