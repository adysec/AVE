[basic]
description = "Phorum 3.0.7 的 upgrade.php3 脚本存在未授权访问漏洞，未经身份验证的远程攻击者可通过该脚本直接修改 Phorum 论坛数据库中的特定数据表。该漏洞位于论坛升级功能页面，攻击者无需任何账号凭据即可利用。由于升级脚本未对访问请求进行身份验证且缺乏输入校验机制，攻击者只需向目标站点发送特制请求即可篡改数据库内容，从而破坏论坛数据的完整性和一致性。该漏洞影响所有使用 Phorum 3.0.7 版本的站点，CVSS 评分为 5.0，攻击复杂度低，可完全远程利用。"
published = "2000-12-31T05:00:00Z"
remediation = "立即删除或限制 upgrade.php3 文件的访问权限（例如通过 .htaccess 仅允许本地 IP 访问，或直接删除该文件），并升级 Phorum 至 3.0.8 或更高版本。由于 Phorum 已停止维护，建议迁移至仍在维护的论坛软件（如 phpBB、FluxBB 或 Discourse）。如无法立即升级，应在防火墙或 Web 服务器层面对 /upgrade.php3 实施访问控制，仅允许管理员 IP 访问，并检查数据库是否存在异常数据变更。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Phorum upgrade.php3 数据库篡改漏洞"
updated = "2026-06-16T21:53:25Z"

