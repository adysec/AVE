[basic]
description = "Fortech Proxy+ 存在安全绕过漏洞，远程攻击者可通过 Telnet 代理重定向连接，绕过管理服务的访问限制，导致未授权访问管理功能。影响 Fortech Proxy+ 相关版本，CVSS 评分 5.0（中等），攻击向量为网络、攻击复杂度低、无需认证、仅影响完整性。攻击者无需认证即可通过 Telnet 代理转发连接绕过管理接口访问控制，实现未授权管理访问。"
published = "2000-06-26T04:00:00.000"
remediation = "建议将 Fortech Proxy+ 升级至厂商发布的安全修复版本（参考 http://www.proxyplus.cz 补丁公告），或禁用 telnet 代理功能以阻止攻击者重定向连接至管理服务。如无法立即升级，应在防火墙或路由器层面禁止外部主机访问 Proxy+ 管理服务端口，仅允许可信内部 IP 访问。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Fortech Proxy+ 安全绕过漏洞"
updated = "2026-06-16T21:52:04.870"

