[basic]
description = "Google Chrome V8 引擎存在类型混淆漏洞（CWE-843），攻击者可通过构造恶意 HTML 页面诱导用户访问，触发 V8 引擎中的类型混淆导致堆损坏，进而实现远程代码执行。该漏洞影响 Google Chrome 142.0.7444.59 之前的所有版本，CVSS 3.1 评分 8.8（HIGH），攻击向量为网络（AV:N），攻击复杂度低（AC:L），无需特权（PR:N），但需要用户交互（UI:R），可导致高机密性、完整性和可用性影响（C:H/I:H/A:H）。攻击者需诱导受害者访问精心构造的恶意网页即可触发漏洞，Google 已在 Chrome 142.0.7444.59 版本中修复该漏洞，用户应尽快升级至最新版本。"
published = "2025-11-18T00:15:47Z"
remediation = "建议立即将 Google Chrome 升级至 142.0.7444.59 或更高版本（通过 Chrome 菜单→帮助→关于 Google Chrome 自动更新），或在企业环境中通过组策略强制推送更新。若暂时无法升级，可在浏览器设置中禁用 JavaScript 作为临时缓解措施，但会影响网页功能。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 类型混淆导致堆损坏漏洞"
updated = "2026-06-17T08:33:42Z"

