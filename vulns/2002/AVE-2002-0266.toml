[basic]
description = "IconBoard论坛软件存在跨代理脚本攻击漏洞，该漏洞源于软件在处理图片标签时未对包含JavaScript代码的代理属性进行充分验证。攻击者可通过在帖子或回复中嵌入特制的<img>标签，注入恶意JavaScript代码，利用该漏洞实现远程代码执行。该漏洞影响IconBoard 2.17、3.0和3.1等多个版本，且无需身份验证即可远程触发，可窃取其他用户的Session Cookie，导致身份盗用和权限劫持等安全问题。该漏洞涉及论坛核心功能，影响面广，评估为安全严重等级。"
published = "2002-06-25T04:00:00Z"
remediation = "建议立即升级 IkonBoard 到 3.1.1 或更高版本（官方已修复该 XSS 漏洞）。若无法立即升级，可在管理后台禁用帖子中的 HTML/IMG 标签功能，或在论坛配置中启用 HTML 标签过滤/白名单机制，禁止 IMG 标签中的 javascript: 伪协议。同时建议在 Web 服务器层面配置 CSP 策略（Content-Security-Policy: default-src 'self'; img-src 'self' data:; script-src 'self'），禁止内联脚本执行作为临时缓解措施。定期检查论坛帖子内容，清理包含恶意 IMG 标签的历史数据。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "伊科论坛 IkonBoard 跨站脚本攻击"
updated = "2026-06-16T21:57:13Z"

