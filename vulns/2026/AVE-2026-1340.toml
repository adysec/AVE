[basic]
description = "Microsoft Office 的 URI 协议处理器存在输入验证不充分漏洞，未经身份认证的远程攻击者可通过构造特制的 URI 链接诱导用户访问恶意页面或打开恶意文件，从而触发该漏洞。漏洞原理是 Office 在处理 URI 协议时未对输入进行严格校验，导致当前用户的 NTLM 认证响应信息被远程攻击者获取并泄露。受影响产品为 Microsoft Office，该漏洞需要用户交互才能成功利用（AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:N/A:N），CVSS 评分 4.3，危害等级为中等。攻击者可利用泄露的 NTLM 响应进行后续的中间人或重放攻击，进而获取更多敏感信息。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
