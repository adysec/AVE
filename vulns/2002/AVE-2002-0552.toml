[basic]
description = "Microsoft Internet Explorer 5/6、Konqueror 2.2.2/3.0 及 Weblogic Server 5/6/7 等产品在处理 X.509 数字证书链时未正确验证 Basic Constraints 扩展字段，导致远程攻击者可通过构造特制的无效证书链欺骗客户端或服务器对证书有效性的校验，实现身份伪造。该漏洞影响 Windows 98、Windows NT 4.0 等系统，攻击者无需身份认证即可在远程向目标发送恶意签发的证书，利用证书验证缺陷执行任意代码或进行中间人攻击，CVSS 评分 7.5，危害等级较高。建议用户及时安装厂商安全更新以修复证书校验逻辑。"
published = "2002-12-11T05:00:00.000"
remediation = '安装 Microsoft 安全公告 MS02-050 对应补丁 Q329115（2002 年 11 月 20 日修订版），受影响系统包括 Windows 98/98SE/Me、Windows NT 4.0 及终端服务器版、Windows 2000、Windows XP；Windows 2000 SP4 用户若已安装 Internet Explorer 6.0 SP1，须额外安装 2003 年 11 月更新的 SP4 安全补丁。Mac 产品（Microsoft Office、Internet Explorer for Mac、Outlook Express for Mac）须分别下载对应平台独立补丁，不可通用。安装后重启系统，Windows 平台可通过注册表路径 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Updates\ 下对应版本目录验证 Q329115 是否成功安装，Windows 98/NT 4.0 可使用 Qfecheck.exe 工具确认。如暂时无法打补丁，应在所有网络通信中手动核验数字证书链的 Basic Constraints 字段，拒绝任何自签名或来源不明的证书，并密切监控 CryptoAPI 调用的异常行为。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft Windows 数字证书校验远程代码执行漏洞"
updated = "2026-06-16T21:58:53.537"

