[basic]
description = "SuSE Linux 的 linuxnfs/knfsd 软件包中的 rpc.kstatd 服务存在字符串解析错误漏洞，远程攻击者无需身份认证即可利用该缺陷向目标系统发送特制请求触发缓冲区溢出，成功利用后可获取 root 权限，完全控制受影响系统。该漏洞影响 SuSE Linux 及其他使用相关 nfs 软件包的 Linux 发行版，CVSS 评分 10.0，危害等级严重。"
published = "2000-10-20T04:00:00.000"
remediation = "立即安装 SuSE 安全公告 SUSE Security Announcement 58 提供的更新包，升级 linuxnfs/knfsd 至修复版本。如无法升级，可停止 rpc.kstatd 服务（`/etc/init.d/rpc.kstatd stop`）并在防火墙限制对 RPC 端口（111/TCP/UDP）的访问，仅允许可信来源连接。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "SuSE Linux linuxnfs/knfsd rpc.kstatd 权限提升漏洞"
updated = "2026-06-16T21:52:30.447"

