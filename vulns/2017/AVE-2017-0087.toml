[basic]
description = "WordPress Stop User Enumeration 插件（版本 1.3.7 及更早）存在反射型跨站脚本（XSS）漏洞。该插件用于阻止用户枚举攻击，但在处理 `author` 参数时未对用户输入进行充分的过滤与转义。未经身份认证的远程攻击者可通过向目标站点发送特制的 URL（如 `/?author=1<script>alert(1)</script>`），诱使受害者点击后，在受害者浏览器中执行任意 JavaScript 或 HTML 代码。成功利用可导致会话劫持、钓鱼攻击、网站篡改等危害。攻击无需认证，仅需用户交互（点击链接）。该漏洞 CVSS 评分 6.1，危害等级中危。厂商已在 1.3.8 版本中修复此漏洞。"
published = "2019-08-21T12:15:10Z"
remediation = "升级 WordPress stop-user-enumeration 插件至 1.3.8 或更高版本。登录 WordPress 后台，进入「插件」→「已安装插件」，找到 Stop User Enumeration 并点击「更新」。如已无法自动更新，请从 WordPress 插件目录重新下载安装。该版本修复了未授权用户枚举及跨站脚本漏洞。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress stop-user-enumeration插件跨站脚本漏洞"
updated = "2026-06-17T01:13:03Z"

