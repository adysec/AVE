[basic]
description = "Oracle MySQL Server 的 Server Optimizer 组件中存在未明漏洞，远程认证用户可通过向受影响数据库发送特制查询请求，利用查询优化器处理过程中的异常，导致 MySQL 服务进程崩溃或拒绝服务。该漏洞影响 MySQL 5.1.62 及更早版本、5.5.22 及更早版本，攻击者需拥有数据库有效账户，无需高权限即可远程触发，CVSS 评分 4.0，危害等级中低。Oracle 已在 2012 年 7 月关键补丁更新中修复此漏洞。"
published = "2012-07-17T22:55:01.350"
remediation = "将 MySQL 升级至 5.1.63 及以上版本（5.1 分支）或 5.5.23 及以上版本（5.5 分支），该漏洞已在 Oracle Critical Patch Update July 2012 中修复。可通过 My Oracle Support 获取对应补丁（参考 Note 1455387.1）。临时缓解措施：在防火墙层面限制仅允许受信主机访问 MySQL 3306 端口，并避免向非受信用户授予数据库连接权限。"
score = 4
severity = "MEDIUM"
sources = ["tenable"]
title = "Oracle MySQL Server Server Optimizer 拒绝服务漏洞"
updated = "2026-06-16T23:40:06.130"

