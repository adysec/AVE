[basic]
description = 'AnyDesk 的"发送支持信息"功能存在链接跟随漏洞（CWE-59）。本地攻击者首先需在目标系统上获得低权限代码执行能力，随后通过创建目录交接点（junction）滥用该服务创建任意文件，最终可导致系统拒绝服务。该漏洞影响 AnyDesk 远程桌面软件，CVSS 评分 5.5，危害等级中危。攻击者需具备本地访问权限，无法远程利用。'
published = "2026-07-13T22:16:45Z"
remediation = "升级 AnyDesk 至 9.0.4 以上版本（如厂商后续发布安全更新）。若无法升级，限制低权限用户对 AnyDesk 的访问，通过组策略或 AppLocker 禁止非管理员运行 AnyDesk，并监控 %TEMP% 和 %PROGRAMDATA% 目录下的异常符号链接创建行为。"
score = 5.5
severity = "MEDIUM"
sources = ["zdi"]
title = "AnyDesk 支持信息发送功能链接跟随拒绝服务漏洞"
updated = "2026-07-14T20:59:52Z"

