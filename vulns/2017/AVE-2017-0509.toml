[basic]
description = "SAP NetWeaver Application Server Java 7.5 的 scheduler/ui/js/ffffffffbca41eb4/UIUtilJavaScriptJS 组件存在目录遍历漏洞。远程攻击者无需身份认证即可在 URL 查询字符串中构造 `../` 序列绕过路径限制，读取服务器上的任意文件，包括配置文件、密码文件等敏感信息。该漏洞在 2017 年 8 月已被野外利用，影响范围广泛。SAP 已发布安全公告 2486657 修复此漏洞。"
published = "2017-08-07T20:29:01.120"
remediation = "立即应用 SAP Security Note 2486657 提供的补丁，登录 SAP 支持门户 (https://me.sap.com/notes/3476549) 下载并安装对应版本的更新。如无法立即打补丁，可在 Web 应用防火墙 (WAF) 层面配置规则拦截包含 `..` 的查询字符串请求，或限制对 `/scheduler/ui/js/` 路径的未授权访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "SAP NetWeaver Application Server 目录遍历漏洞"
updated = "2026-06-17T01:03:42.877"

