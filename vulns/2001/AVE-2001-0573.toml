[basic]
description = "Windows 2000 终端服务中的远程桌面协议（RDP）在处理特制的畸形数据包时存在缺陷，未经身份认证的远程攻击者可通过向目标系统的 3389 端口发送构造的恶意 RDP 数据包，触发服务处理异常，导致终端服务崩溃或停止响应，造成拒绝服务。该漏洞影响 Windows 2000 Terminal Service 版本，攻击无需任何认证，攻击复杂度低，但仅影响服务可用性，不涉及数据机密性和完整性。"
published = "2001-02-12T05:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS01-006 提供的补丁（KB Q286132），下载地址为 https://www.microsoft.com/download/details.aspx?FamilyId=583C219C-5893-4889-96C0-59D354C6B7A7。该修复已包含在 Windows 2000 Service Pack 2 中，建议升级至 SP2 或更高版本。如无法立即打补丁，可在防火墙层面阻止对 TCP 端口 3389（RDP 端口）的外部访问，或禁用不需要的终端服务功能作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows 2000 Terminal Service RDP 拒绝服务漏洞"
updated = "2026-06-16T21:53:29Z"

