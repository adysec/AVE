[basic]
description = "tags.<value>DriveLock 服务存在目录遍历漏洞，攻击者无需身份认证即可利用。漏洞位于监听 TCP 4568 端口的 Web 服务，由于对用户提供的路径参数缺乏充分校验，攻击者可构造恶意路径请求，读取服务账户上下文下的敏感文件信息。该漏洞影响 DriveLock 所有受影响版本，CVSS 评分为 5.3（中等），攻击复杂度低，无需用户交互。"
published = "2026-07-29T20:17:05.777"
remediation = "立即将 DriveLock 升级至厂商发布的最新版本，该版本已修复路径遍历漏洞（CVE-2026-5489）。如暂时无法升级，请在防火墙或网络层限制对 TCP 4568 端口的入站访问，仅允许可信 IP 范围访问。同时检查 DriveLock Web 服务运行账户的权限，确保其仅具备最小必要文件系统访问权限，避免攻击者通过路径遍历获取服务账户上下文中的敏感文件。"
score = 5.3
severity = "MEDIUM"
sources = ["zdi"]
title = "DriveLock 目录遍历信息泄露漏洞"
updated = "2026-07-30T14:18:46.477"

