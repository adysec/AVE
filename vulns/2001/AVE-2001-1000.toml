[basic]
description = "Watchguard Firebox II 防火墙存在权限提升漏洞。攻击者通过访问存储有哈希密码短语的文件获取密码哈希值，并在后续认证过程中复用这些哈希值完成身份验证，从而将原本仅具有只读权限的账户提升为具有读写权限及管理员权限。该漏洞影响使用 Watchguard Firebox II 防火墙系统的用户，攻击者无需身份认证即可远程利用此漏洞，成功利用后可完全控制防火墙设备。"
published = "2001-03-26T05:00:00Z"
remediation = "由于 Watchguard Firebox II 已停止维护且该漏洞属于严重设计缺陷，建议立即停止使用该型号硬件并升级至当前厂商支持的 Firebox 系列防火墙。在更换硬件前，应通过 ACL 严格限制管理界面的访问权限，防止未经授权的用户访问系统文件。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Watchguard Firebox II 防火墙 权限提升漏洞"
updated = "2026-06-16T21:53:52Z"

