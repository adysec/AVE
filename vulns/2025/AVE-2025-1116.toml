[basic]
description = "Linux 内核 arcnet 网络驱动的 com20020pci_probe() 函数存在空指针解引用漏洞（CWE-476）。当 devm_kasprintf() 内存分配失败返回 NULL 时，代码未进行空指针检查直接解引用，导致内核崩溃拒绝服务。影响 Linux 内核 4.19.x、5.4.x、5.10.x、5.15.x、6.1.x、6.6.x 等长期支持版本及 6.7-6.14 主线版本，需包含 com20020 PCI 网卡驱动的系统均受影响。攻击向量为本地（AV:L），需低权限（PR:L）且无需用户交互（UI:N），本地攻击者可通过触发驱动探测过程（如插入恶意 PCI 设备或加载模块）引发内核 panic，导致系统完全不可用（可用性影响 HIGH），CVSS 3.1 评分 5.5（MEDIUM）。"
published = "2025-04-16T15:15:58Z"
remediation = "升级 Linux 内核至修复版本：5.4 系列升级到 5.4.292 及以上、5.10 系列升级到 5.10.236 及以上、5.15 系列升级到 5.15.180 及以上、6.1 系列升级到 6.1.134 及以上、6.6 系列升级到 6.6.87 及以上、6.12/6.13/6.14 系列分别升级到 6.12.23/6.13.11/6.14.2 及以上；Debian 12 用户安装 linux 包 6.1.135-1 或更高版本，Debian 11 用户安装 5.10.237-1 或更高版本；Ubuntu 22.04 LTS 用户升级到 5.15.0-142.152，Ubuntu 24.04 LTS 用户升级到 6.8.0-86.87。临时缓解措施：若无法立即升级内核，可通过 modprobe 禁用 com20020pci 模块（执行 rmmod com20020pci 或修改 /etc/modprobe.d/ 添加 blacklist com20020pci），防止该驱动被加载触发空指针解引用，但需注意此操作会影响基于 ARCNET 接口的网络设备正常使用。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 arcnet 驱动空指针解引用漏洞"
updated = "2026-06-17T08:44:56Z"

