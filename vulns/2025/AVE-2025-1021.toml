[basic]
description = "Linux 内核 GTP 网络驱动中存在列表损坏漏洞。由于 `gtp_net_exit_batch_rtnl()` 函数在处理网络命名空间清理时可能对同一 GTP 设备重复调用删除操作，导致 `gtp_dellink()` 被触发两次，在启用 `CONFIG_DEBUG_LIST` 的情况下会触发 `list_del()` 异常并导致内核崩溃。该漏洞影响运行 Linux 内核 GTP 驱动的系统，攻击者需在本地具备创建网络命名空间和 GTP 设备的权限，通过构造跨命名空间的 GTP 设备场景即可触发拒绝服务，造成系统不稳定或重启。"
published = "2025-03-12T10:15:19Z"
remediation = "建议升级 Linux 内核至 6.13 或更高版本，该版本已合并修复提交 eb28fd76c0a0（gtp: Destroy device along with udp socket's netns dismantle）。对于 Ubuntu 22.04 LTS，请升级内核至 5.15.0-1081.87 或更新版本；对于 Ubuntu 20.04 LTS，请升级至 5.4.0-1146.156 或更新版本。可通过 apt update && apt upgrade linux-image 完成升级并重启系统。若无法立即升级，请避免在不同网络命名空间之间创建 GTP 设备，或临时通过 sysctl 限制网络命名空间清理频率以降低触发概率。升级后请验证内核版本号包含上述修复版本。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 GTP 网络命名空间清理列表损坏漏洞"
updated = "2026-06-17T08:44:28Z"

