[basic]
description = "Mozilla Firefox 4.x至11.0、Firefox ESR 10.x至10.0.4、Thunderbird 5.0至11.0、Thunderbird ESR 10.x至10.0.4及SeaMonkey 2.9之前版本的浏览器引擎中存在多处内存安全漏洞。远程攻击者可通过构造特制的Web页面，诱使用户访问后触发内存破坏，导致浏览器崩溃或拒绝服务，在特定条件下可实现任意代码执行。该漏洞无需身份认证即可远程利用，攻击复杂度低，CVSS评分10.0，危害等级严重。Mozilla已在Firefox 12.0、Thunderbird 12.0及SeaMonkey 2.9版本中修复此漏洞。"
published = "2012-04-25T10:10:17Z"
remediation = "升级 Firefox 至 12.0 及以上版本，Firefox ESR 升级至 10.0.4 及以上版本；升级 Thunderbird 至 12.0 及以上版本，Thunderbird ESR 升级至 10.0.4 及以上版本；升级 SeaMonkey 至 2.9 及以上版本。无法立即升级时，可禁用 JavaScript（在 about:config 中将 javascript.enabled 设为 false）作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 浏览器引擎内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:20Z"

