[basic]
description = 'Postfix 1.1.11 及更早版本存在"bounce scans"（弹回扫描）拒绝服务漏洞。远程攻击者可通过向本地 Postfix 邮件服务器发送一封目标收件人地址中包含目标 IP 地址、服务名及"!"分隔符的特制邮件，利用 Postfix 投递失败后产生弹回消息（bounce message）的机制，诱使 Postfix 尝试通过 SMTP 与目标主机的指定端口建立连接，从而实现对内网或其他外部主机的端口扫描，或被利用发起拒绝服务攻击。该漏洞影响运行旧版 Postfix 的邮件服务器，攻击者无需身份认证即可远程触发，攻击复杂度低。'
published = "2003-08-27T04:00:00Z"
remediation = '立即升级 Postfix 到 1.1.12 或更高版本：可从 postfix.org 下载源码包编译安装，或通过系统包管理器（如 apt-get upgrade postfix、yum update postfix）直接更新。若无法立即升级，可在 main.cf 中配置 smtpd_sender_restrictions = check_sender_access regexp:/etc/postfix/bounce_scan，并在 /etc/postfix/bounce_scan 中添加 "!/ REJECT Bounce scan attempt not allowed" 规则，以拦截含感叹号的恶意发件人地址；同时通过防火墙规则限制 Postfix 仅向可信 SMTP 目标发起出站连接，减少被用于 bounce 扫描的风险。'
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Wietse Venema Postfix SMTP 拒绝服务漏洞"
updated = "2026-06-16T22:02:15Z"

