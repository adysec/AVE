[basic]
description = "Linux 内核 AMD 显示驱动（drm/amd/display）中存在除零漏洞。由于分母变量未初始化为非零默认值，当这些变量未被赋予其他值时，将触发除零错误（DIVIDE_BY_ZERO），导致内核崩溃，造成拒绝服务。该漏洞由 Coverity 静态分析工具发现，攻击者需要具有本地低权限访问才能触发，影响系统可用性。Linux 内核上游已通过将分母默认值初始化为 1 的方式修复此问题。"
published = "2025-02-10T16:15:37Z"
remediation = "建议立即更新 Linux 内核至包含提交 e2c4c6c10542 的版本。Ubuntu 24.04 LTS 用户应升级至 linux-image-6.11.0-1013-azure 或更新版本（USN-7448-1）；Ubuntu 24.10 用户升级至同版本。其他发行版用户应更新至主线内核 6.13 或厂商提供的包含该补丁的稳定内核版本。更新后需重启系统生效。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 DRM/AMD 显示子系统除零错误漏洞"
updated = "2026-06-17T08:14:18Z"

