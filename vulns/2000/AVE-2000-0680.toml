[basic]
description = "该漏洞存在于 Microsoft Windows Media Player 7 的 OCX 控件中。由于该控件在处理嵌入对象时未能在所有情况下正确关闭，导致支持 RTF 格式的邮件客户端在加载包含该特制 OCX 控件的邮件时，可能触发拒绝服务（DoS）状态，导致应用程序崩溃或系统响应失效。攻击者可通过发送精心构造的电子邮件附件诱导目标用户打开，从而实现远程攻击。"
published = "2000-12-19T05:00:00.000"
remediation = "建议将 Windows Media Player 升级至 8.0 或更高版本，或更新至更新的 Windows 操作系统以获得补丁支持。如必须使用旧版本，请在邮件客户端设置中禁用 RTF 格式解析，或通过注册表禁用该 OCX 控件的自动运行，以防止通过恶意邮件触发拒绝服务攻击。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows Media Player 7 OCX 控件拒绝服务漏洞"
updated = "2026-06-16T21:52:47.363"

