[basic]
description = "Extent Technologies RBS ISP 2.5 Web 服务器存在目录遍历漏洞，远程攻击者可通过向 Image 参数传递 `../`（点点斜线）序列绕过路径限制，读取服务器上的任意敏感文件（如配置文件、密码文件等）。攻击无需身份认证，仅需向目标服务器发送特制的 HTTP 请求即可触发，危害中等。该漏洞已有公开 PoC 利用代码。"
published = "2000-12-11T05:00:00.000"
remediation = "Extent RBS ISP 2.5 已停止维护，官方未发布补丁。建议立即迁移至 Apache 或 Nginx 等现代 Web 服务器；若无法迁移，在应用层对 Image 参数严格过滤 `../` 等目录遍历序列，并配置防火墙限制端口 8002 仅对可信 IP 开放。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Extent Technologies RBS ISP 目录遍历漏洞"
updated = "2026-06-16T21:53:01.183"

