[basic]
description = "Apple Safari 浏览器在 6.0 版本之前未正确处理密码输入元素的 autocomplete 属性，当网页明确禁止自动填充时，浏览器仍会自动填写已保存的密码。攻击者可利用无人值守的工作站，通过已自动填充密码的页面绕过身份验证机制，获取未授权的访问权限。该漏洞影响 Apple iOS 5.1.1 及更早版本中的 Safari 浏览器，CVSS 评分 5.0，危害等级中等。"
published = "2012-07-25T19:55:01Z"
remediation = '升级 Apple Safari 至 6.0 或更高版本（OS X 用户通过 Software Update 或从 support.apple.com/kb/HT5400 下载安装）；iOS 设备用户升级至 iOS 6.0 或更高版本（设置→通用→软件更新）。如无法立即升级，可在 Safari 偏好设置中禁用自动填充密码功能（偏好设置→自动填充→取消勾选"用户名和密码"），并要求用户在使用完毕后手动锁定工作站。'
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari 密码自动填充认证绕过漏洞"
updated = "2026-06-16T23:38:03Z"

