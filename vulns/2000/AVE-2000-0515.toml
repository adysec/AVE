[basic]
description = "AnalogX SimpleServer:WWW 1.06 及更早版本存在目录遍历漏洞。该 Web 服务器在处理 URL 路径时未对目录跳转序列（..）进行充分过滤和规范化，攻击者可通过在 HTTP 请求中使用 URL 编码的点号（%2E%2E/）构造特殊的路径遍历序列，绕过服务器的路径校验机制，从而读取服务器主机上的任意文件（如系统配置文件、密码文件等敏感信息）。该漏洞无需身份认证即可利用，CVSS 评分 5.0，影响所有使用 AnalogX SimpleServer:WWW 1.06 及以下版本搭建 Web 服务的系统。利用方式为向目标服务器发送包含编码路径遍历的 HTTP 请求，例如通过 GET 请求访问如 /%2E%2E/%2E%2E/%2E%2E/etc/passwd（Unix）或 %2E%2E/%2E%2E/%2E%2E/win.ini（Windows）等路径来读取目标系统上的任意文件内容。"
published = "2000-07-26T04:00:00.000"
remediation = "立即升级到 AnalogX SimpleServer:WWW 1.07 或更高版本（最新版为 1.24），该版本已修复 %2E 编码的目录遍历漏洞。从官网 http://www.analogx.com/contents/download/network/sswww.htm 下载更新。如无法升级，可在 Web 服务器前端部署反向代理或 WAF，拦截包含 %2E%2E 或类似编码的路径遍历请求。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "AnalogX SimpleServer:WWW 目录遍历漏洞"
updated = "2026-06-16T21:52:13.153"

