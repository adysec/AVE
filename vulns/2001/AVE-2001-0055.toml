[basic]
description = "SSH1 协议实现中的 CRC-32 补偿攻击检测器存在整数溢出漏洞，远程攻击者无需身份认证即可向目标 SSH 服务器或客户端发送特制数据包，触发整数溢出绕过 CRC-32 校验检测机制，进而实现远程任意命令执行。该漏洞影响 SSH 1.2.x 及早期版本，CVSS 评分 10.0，危害等级严重。攻击者只需网络可达即可利用，无需任何权限，完全控制目标系统。"
published = "2001-03-12T05:00:00Z"
remediation = "立即停止使用 SSH 协议第一版 (SSH-1)，升级至 OpenSSH 3.0 及以上版本（默认使用 SSH-2 协议，不受此漏洞影响）。如无法升级，在 sshd_config 中设置 Protocol 2 禁用 SSH-1 协议。Cisco CSS 11000 系列用户需升级至 WebNS 4.01 B42s、4.10 22s、5.0 B11s 或 5.01 B6s 及以上版本。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "SSH1 CRC-32 补偿攻击检测器整数溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:45Z"

