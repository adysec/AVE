[basic]
description = "Mozilla 浏览器引擎在实现 JavaScript 时存在内存安全漏洞，导致内存破坏。远程攻击者可通过诱导用户访问特制的恶意网页或加载特制内容，利用该漏洞触发应用程序崩溃（拒绝服务），或在特定条件下实现远程代码执行。该漏洞影响 Mozilla Firefox 4.x 至 5 版本、Thunderbird 6.0 之前版本以及 SeaMonkey 2.x（2.3 之前）版本。攻击条件为受害者加载由攻击者控制的恶意脚本或内容。"
published = "2011-08-18T18:55:01Z"
remediation = "将 Firefox 升级到 6.0 或更高版本、SeaMonkey 升级到 2.3 或更高版本、Thunderbird 升级到 6.0 或更高版本，浏览器引擎的 JavaScript 崩溃漏洞即可得到修复。如短期内无法升级，可在 Firefox 中通过 about:config 禁用 JavaScript（将 javascript.enabled 设为 false）作为临时缓解措施，或在邮件客户端中关闭 HTML 邮件和远程内容自动加载功能，以降低网页或邮件中的恶意 JavaScript 引发崩溃的风险。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird 远程代码执行漏洞"
updated = "2026-06-16T23:32:23Z"

