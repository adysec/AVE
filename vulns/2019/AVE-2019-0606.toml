[basic]
description = "Internet Explorer 的脚本引擎在处理内存中对象时存在释放后使用（Use-After-Free）漏洞，远程攻击者可通过构造特制的网站诱导用户访问，触发 JScript 引擎在 toJSON 回调过程中对已释放内存的引用，从而在当前用户权限下执行任意代码。攻击成功可完全控制受影响的系统，安装程序、查看/更改/删除数据或创建新账户。该漏洞需要用户交互（点击链接），影响 Internet Explorer 9/10/11 等版本，Microsoft 已在 2019 年 11 月安全更新中修复。"
published = "2019-11-12T19:15:14Z"
remediation = "立即安装 Microsoft 2019 年 11 月安全更新（对应 Windows 各版本的累积更新 KB 编号不同，如 Windows 10 为 KB4525232），或通过 Windows Update 自动获取更新。该漏洞已被 CISA 列入已知被利用漏洞目录，建议优先修复。如无法立即打补丁，可禁用 Internet Explorer 脚本引擎或通过组策略限制 IE 使用范围作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Internet Explorer 脚本引擎内存损坏漏洞"
updated = "2026-06-17T02:28:35Z"

