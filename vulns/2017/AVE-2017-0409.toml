[basic]
description = "Cisco IOS 12.2 至 15.6 版本及 IOS XE 软件的 DHCP 中继子系统存在缓冲区溢出漏洞，CVSS 评分 9.8，危害等级严重。未经身份认证的远程攻击者可通过向受影响设备发送特制的 DHCPv4 数据包触发该漏洞，成功利用可在目标系统上执行任意代码并获得完全控制权，或导致系统重载引发拒绝服务。该漏洞源于 DHCP 中继子系统对 DHCPv4 报文处理时边界检查不严导致的缓冲区溢出。Cisco 已发布安全更新修复此漏洞，受影响用户应尽快升级至修复版本。"
published = "2017-09-29T01:34:49Z"
remediation = "立即升级受影响的 Cisco IOS 至 15.7(3)M 或更新版本，Cisco IOS XE 升级至 16.3.1 或更新版本。可通过 Cisco IOS Software Checker 工具查询具体修复版本号。如无法立即升级，建议在设备上移除 DHCP relay 配置（no ip helper-address），或配置 ACL 限制 DHCPv4 报文仅来自可信源。该漏洞已被 CISA 列入已知被利用漏洞目录，需优先处置。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Cisco IOS和IOS XE Software DHCP中继子系统缓冲区溢出漏洞"
updated = "2026-06-17T01:02:57Z"

