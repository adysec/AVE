[basic]
description = "Microsoft Windows Media Services 4.0 及 4.1 版本的 Unicast Service 存在竞争条件漏洞。远程攻击者可通过向目标服务器发送特制的畸形请求，利用该竞争条件导致 Windows Media Unicast Service 服务崩溃，造成拒绝服务。该漏洞无需身份认证即可远程触发，但利用复杂度较高（需精确时序控制），影响 Windows Media Services 4.0/4.1 版本。Microsoft 已发布安全公告并建议用户安装相应补丁。"
published = "2000-11-14T05:00:00Z"
remediation = "建议立即安装 Microsoft 安全公告 MS00-064 提供的补丁。Windows Media Services 4.1 用户直接下载安装补丁（https://www.microsoft.com/download/details.aspx?FamilyId=BF954D4E-3C89-47EF-92E6-5030288731EF）；Windows Media Services 4.0 用户需先升级至 4.1 版本再安装补丁。如无法立即打补丁，可在防火墙层面禁用或限制对 UDP/TCP 1755 端口的访问作为临时缓解措施。"
score = 2.6
severity = "LOW"
sources = ["avd"]
title = "Microsoft Windows Media Services Unicast Service 拒绝服务漏洞"
updated = "2026-06-16T21:52:35Z"

