[basic]
description = "util-linux 软件包中的 setpwnam.c 函数在修改 /etc/passwd 文件时未正确锁定临时文件，存在竞争条件漏洞。本地攻击者可通过 chfn、chsh 等工具程序利用已打开的文件描述符发起复杂的竞争条件攻击，从而提升至 root 权限。该漏洞影响 Red Hat Linux 7.3 及更早版本以及其他使用 util-linux 的操作系统，CVSS 评分 6.2，攻击复杂度较高，需要本地访问权限。"
published = "2002-08-12T04:00:00Z"
remediation = "立即升级 util-linux 软件包至修复版本。Red Hat Linux 用户应参照 RHSA-2002:132（适用于 6.2/7.0/7.1）或 RHSA-2002:137（适用于 Enterprise Linux 2.1）安全公告，通过 up2date 或 rpm 更新 util-linux 软件包。其他发行版用户应联系厂商获取对应补丁或升级至包含修复的 util-linux 2.11y 及以上版本。"
score = 6.2
severity = "MEDIUM"
sources = ["redhat"]
title = "Red Hat Linux util-linux setpwnam 竞态条件本地权限提升漏洞"
updated = "2026-06-16T21:57:50Z"

