[info]
author = "ave"
description = "Microsoft Outlook Express 持续邮件浏览器链接漏洞验证，通过特制 HTML 邮件中的 JavaScript 建立持久化浏览器链接，监视用户邮件内容"
id = "POC-AVE-2000-0505"
name = "CVE-2000-0653 Microsoft Outlook Express Persistent Mail-Browser Link PoC"
severity = "medium"
tags = [
    "cve-2000-0653",
    "outlook-express",
    "information-disclosure",
]
vuln_id = [
    "CVE-2000-0653",
    "AVE-2000-0505",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Outlook Express"]
