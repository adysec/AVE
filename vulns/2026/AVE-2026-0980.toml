[basic]
description = "netfoil 项目存在日志注入漏洞（CWE-117），域名在被写入日志前未经过允许字符验证，攻击者可通过构造包含恶意字符的域名向日志中注入任意数据。远程攻击者具备低权限即可利用，无需用户交互。当日志被后续系统（如日志分析工具、监控告警系统）处理时，注入的恶意内容可能导致日志伪造、告警误报或进一步攻击。该漏洞影响 github.com/tinfoil-factory/netfoil 所有版本（<0.3.0），已在 0.3.0 版本中修复。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
