[basic]
description = "HP JetDirect 打印服务器 FTP 服务在处理畸形 FTP quote 命令时存在输入验证缺陷，远程未授权攻击者可向目标 FTP 端口发送畸形命令导致服务崩溃拒绝服务。影响 HP JetDirect 打印服务器固件版本 G.08.20、H.08.20 及更早版本，CVSS 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），攻击者无需认证即可通过网络发送恶意 FTP 命令触发拒绝服务。HP 已发布固件更新修复该漏洞，建议升级至 H.08.21 或更高版本。"
published = "2000-07-19T04:00:00Z"
remediation = "将 HP JetDirect 固件升级到高于 G.08.20 / H.08.20 的版本以修复畸形 FTP quote 命令导致的拒绝服务；若无法立即升级，在打印机管理界面或 telnet/Web 配置中关闭 JetDirect FTP 服务，并在防火墙/ACL 上阻断对打印机 TCP 21 端口的入站访问，必要时对受影响设备断电重启以恢复服务。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "HP JetDirect FTP 服务拒绝服务漏洞"
updated = "2026-06-16T21:52:09Z"

