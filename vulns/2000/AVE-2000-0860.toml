[basic]
description = "Cisco GSR 系列路由器（运行 IOS 11.2(15)GS1A 至 11.2(19)GS0.2 及部分 12.0 版本）的快速以太网/千兆以太网线卡在处理线卡故障时存在安全绕过漏洞。由于设备未能正确处理线卡失效状态，远程攻击者无需身份认证即可利用该漏洞绕过 ACL 访问控制列表的过滤规则，或强制接口停止转发数据包，导致拒绝服务。该漏洞影响 Cisco 12008、12012、12016 等 GSR 系列路由器，CVSS 评分 5.0，危害等级中等。Cisco 已发布 IOS 更新修复此问题。"
published = "2000-10-20T04:00:00Z"
remediation = "升级 Cisco IOS 至 12.0(5)SP 及更高版本，或升级至 11.2(19)GS0.3 及以上版本。如无法立即升级，可在受影响接口上配置 ACL 日志监控异常流量，并部署冗余链路以降低单接口因线卡故障导致转发中断的风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Cisco Gigabit Switch Router 安全绕过漏洞"
updated = "2026-06-16T21:52:17Z"

