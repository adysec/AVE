[basic]
description = "GetSimpleCMS 3.3.13 的 admin/index.php 页面存在开放重定向漏洞。攻击者可通过构造包含恶意 redirect 参数的 URL，诱导用户在已登录目标站点管理后台的状态下点击该链接，浏览器将自动跳转至攻击者控制的外部恶意站点。由于重定向过程经过目标站点，用户往往误以为所访问的链接可信，从而成为钓鱼攻击、凭据窃取或社会工程攻击的受害目标。该漏洞利用无需身份认证，攻击条件简单，仅需用户执行一次点击操作即可触发，在钓鱼邮件或即时消息场景中危害显著。CVSSv3 评分 6.1，危害等级中等。"
published = "2019-03-22T00:29:00Z"
remediation = "将 GetSimpleCMS 升级至 3.3.16 或更高版本，该版本移除了 admin/index.php 中 $_GET['redirect'] 参数的任意跳转处理，从而修复开放重定向漏洞。如无法立即升级，可手动编辑 admin/inc/configuration.php 文件，将 $cookie_redirect 直接硬编码为 'pages.php'，不再从 $_GET['redirect'] 读取用户可控的跳转地址，以此作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "GetSimpleCMS 开放重定向安全漏洞"
updated = "2026-06-17T02:44:50Z"

