[basic]
description = "标签之间。<value>Oracle 8i数据库服务器8.1.5版本的TNS Listener（tnslsnr）组件存在缓冲区溢出漏洞。本地攻击者可通过向tnslsnr进程传递超长命令行参数（超过2132字节）触发栈缓冲区溢出，覆盖函数返回地址并执行任意代码。该漏洞影响Linux平台上的Oracle 8i数据库，攻击者成功利用后将以oracle用户权限执行任意指令，导致系统机密性、完整性和可用性完全受损。CVSS评分为7.2，危害等级为高。"
published = "2002-12-31T05:00:00Z"
remediation = "升级至 Oracle 8i 8.1.7 或更高版本并应用 Oracle 安全补丁 CPUOct2002 (补丁号 2520507)，或迁移至受支持的 Oracle 10g/11g 版本。若暂时无法升级，请在 listener.ora 中设置 ADMIN_RESTRICTIONS_LISTENER=ON 禁用动态注册，并通过操作系统层面限制 oracle 用户对 tnslsnr 可执行文件的写入权限（chmod 750 $ORACLE_HOME/bin/tnslsnr），同时配置防火墙阻断非受信任主机对 1521 端口的本地访问。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Oracle 8i TNS Listener 本地命令参数缓冲区溢出漏洞"
updated = "2026-06-16T21:59:56Z"

