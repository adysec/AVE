[basic]
description = "Coder 工作区应用代理在解析目标应用时优先信任 `X-Forwarded-Host` 请求头而非真实的 `Host` 请求头，且未对该头进行任何中间件过滤或校验，同时该头在浏览器端 JavaScript 发起的 `fetch()` 请求中可被任意设置。攻击者通过控制共享工作区应用，在页面中植入恶意 JavaScript，向受害者私有应用的子域名发送带有伪造 `X-Forwarded-Host` 头的同站请求，由于应用会话 Cookie 作用域为通配符父域名，浏览器会自动附加受害者 Cookie，导致服务器按攻击者控制的请求头路由但使用受害者 Cookie 鉴权，从而跨应用读取受害者私有应用的响应数据。利用前提包括启用子域名应用路由（通配符主机名）、受害者访问攻击者共享应用、且上游反向代理未剥离 `X-Forwarded-Host` 头。该漏洞影响 Coder 多个版本，已在 v2.29.17、v2.32.7、v2.33.8 和 v2.34.2 中修复。"
published = "2026-07-08T01:16:27Z"
remediation = "立即升级 Coder 至以下修复版本：v2.34.2、v2.33.8、v2.32.7 或 v2.29.17（ESR）。如无法立即升级，在上游反向代理（如 Nginx、HAProxy）中配置剥离或覆盖不可信请求的 X-Forwarded-Host 头，并确保子域名应用路由（通配符主机名）仅对受信任网络启用。"
score = 5.8
severity = "MEDIUM"
sources = ["ghsa"]
title = "Coder Coder 工作区应用子域名路由信任未认证 X-Forwarded-Host 头漏洞"
updated = "2026-07-08T19:43:14Z"

