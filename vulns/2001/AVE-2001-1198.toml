[basic]
description = "标签之间。<value>HPUX 11 FTP服务器存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过创建超长路径名并调用STAT命令触发该漏洞，导致远程执行任意命令。该漏洞影响HPUX 11系统的FTP服务，CVSS评分9.8，危害等级严重。"
published = "2001-06-18T04:00:00Z"
remediation = "立即安装 HP-UX 安全补丁 PHSS_20271（适用于 HP-UX 11.00）或升级到 HP-UX 11.11 及更高版本以修复 FTP 服务 glob 缓冲区溢出漏洞。如暂时无法打补丁，可通过 /etc/inetd.conf 注释或删除 ftp 服务行并执行 inetd -c 重启 inetd 进程以临时禁用 FTP 服务，同时在防火墙层面限制对 TCP 21 端口的访问。"
score = 9.8
severity = "CRITICAL"
sources = ["epss"]
title = "HP-UX 11 FTP 服务器缓冲区溢出远程命令执行漏洞"
updated = "2026-06-16T21:53:57Z"

