[basic]
description = "SGI Performance Co-Pilot (PCP) 2.1.x/2.2 版本中的 pmpost 程序存在符号链接漏洞，本地攻击者可通过在 PCP 日志目录（PCP_LOG_DIR）中对 NOTICES 文件创建恶意符号链接，利用 pmpost 程序以特权写入任意文件，从而实现本地权限提升。该漏洞影响 PCP 2.2.1-3 之前版本，CVSS 评分 7.2（AV:L/AC:L/Au:N/C:C/I:C/A:C），攻击需要本地访问权限且无需认证，可导致机密性、完整性、可用性完全丧失。SGI 已在 PCP 2.2.1-3 版本中修复该漏洞，建议升级至修复版本。"
published = "2001-12-06T05:00:00Z"
remediation = "建议立即升级 SGI Performance Co-Pilot (PCP) 至 2.2.1-3 或更高版本修复 pmpost 符号链接漏洞。具体操作步骤：1. 从 SGI 官方补丁站点 ftp://patches.sgi.com/support/free/security/advisories/20010601-01-A 获取官方补丁包；2. 停止 PCP 相关服务（如 pcp、pmcd、pmlogger 等）；3. 解压并安装补丁包到系统中；4. 重启 PCP 服务使补丁生效；5. 验证 pmpost 程序不再存在符号链接攻击漏洞。若无法立即升级，可临时移除 pmpost 的 setuid 位（chmod u-s /usr/share/pcp/bin/pmpost）或限制 PCP_LOG_DIR 目录权限防止符号链接攻击作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "SGI Performance Co-Pilot pmpost 符号链接权限提升漏洞"
updated = "2026-06-16T21:55:01Z"

