[basic]
description = "AzeoTech DAQFactory 21.1 及之前版本中存在类型混淆（Type Confusion）漏洞。攻击者通过构造特制的 .ctl 控制文件，诱使目标用户打开该文件后，可触发类型混淆漏洞，导致在目标系统上执行任意代码。该漏洞影响 DAQFactory 全系列旧版本，CVSS 评分 8.4，危害等级高。攻击需要用户交互（打开恶意文件），但无需任何权限，适用于本地攻击场景，可造成机密性、完整性和可用性的完全丧失。"
published = "2026-06-18T19:16:22Z"
remediation = "立即将 AzeoTech DAQFactory 升级至 21.1 以上版本（如有新版发布）。如无法升级，采取以下缓解措施：禁止打开来源不明的 .ctl 文件；将 .ctl 文件存放目录权限设置为仅管理员可写入；在加载外部文档时启用安全模式（Safe Mode）；为工程文档设置编辑密码以防止未授权修改。"
score = 8.4
severity = "HIGH"
sources = ["zdi"]
title = "AzeoTech DAQFactory 类型混淆远程代码执行漏洞"
updated = "2026-07-15T15:25:43Z"

