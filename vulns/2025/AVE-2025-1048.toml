[basic]
description = "Linux内核HID子系统的hid-steam驱动在设备移除过程中存在use-after-free漏洞。当hid-steam设备被卸载时，用于拦截hidraw访问的client_hdev资源需要被清理，该过程可能触发延迟工作来重新附加输入设备；尽管清理操作会取消延迟工作，但这一操作在client_hdev本身释放之前执行，导致释放后的资源被重新调度引用，形成释放后重用条件。攻击者需要具备本地低权限访问权限（PR:L），并通过物理或虚拟方式触发hid-steam设备的插拔操作来利用该竞争条件，成功利用后可导致系统崩溃或在内核上下文中执行任意代码，实现本地权限提升（C:H/I:H/A:H）。该漏洞影响所有使用hid-steam驱动的Linux内核版本。"
published = "2025-04-01T16:15:23Z"
remediation = "升级 Linux 内核到修复版本：6.6.83、6.12.19 或 6.13.7 及以上。Debian/Ubuntu 执行 apt upgrade linux-image-*，RHEL/CentOS 执行 dnf update kernel，Arch Linux 执行 pacman -Syu linux。升级后重启系统验证 uname -r 显示新版本号。如暂无法升级，可临时执行 modprobe -r hid_steam 卸载该驱动模块以消除风险。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux hid-steam 设备驱动程序 use-after-free 漏洞"
updated = "2026-06-17T08:44:37Z"

