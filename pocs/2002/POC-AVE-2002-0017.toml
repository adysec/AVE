[info]
author = "ave"
description = "验证目标系统是否使用存在MD5校验和计算缺陷的perl-Digest-MD5模块（版本2.16-2.19），该模块在处理UTF-8编码数据时会生成错误的MD5摘要，导致完整性验证可被绕过。"
id = "POC-AVE-2002-0017"
name = "CVE-2002-0703 PoC"
severity = "high"
tags = ["ave-2002-0017"]
vuln_id = [
    "CVE-2002-0703",
    "AVE-2002-0017",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
