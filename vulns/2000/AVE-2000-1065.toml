[basic]
description = "HP OpenView Network Node Manager (NNM) 6.1 及更早版本中的数据库配置脚本存在权限许可与访问控制不当漏洞。由于相关脚本对文件权限设置不当，本地攻击者可利用不安全的文件权限访问或修改数据库配置脚本，从而提升自身权限至更高等级，实现机密性、完整性和可用性的部分破坏。攻击者需拥有本地系统访问权限，无需身份认证即可利用该漏洞。"
published = "2000-12-11T05:00:00Z"
remediation = "升级 HP OpenView NNM 至 6.2 或更高版本以修复数据库配置脚本权限缺陷。如无法升级，手动收紧 NNM 数据库配置脚本（位于 $OV_HOME/conf 目录）的文件权限，仅允许 root 用户读写执行（chmod 700），移除其他用户的写权限。同时限制可登录服务器的本地用户范围，移除不必要的用户账号。该产品已停止维护，建议迁移至受支持的网络管理解决方案。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "HP OpenView Network Node Manager 本地权限提升漏洞"
updated = "2026-06-16T21:53:04Z"

