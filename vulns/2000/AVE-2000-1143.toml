[basic]
description = "Check Point FireWall-1 防火墙软件存在拒绝服务漏洞，其 TCP 端口 264 缺少流量控制机制。未经身份认证的远程攻击者可通过向目标系统持续发送大量数据包发起泛洪攻击，导致设备 CPU 占用率急剧升高，造成防火墙服务中断、网络流量处理延迟或完全停止响应。该漏洞影响部署了 FireWall-1 的安全网关和管理服务器，攻击者无需任何凭据即可在远程利用此漏洞，利用方式简单且效果直接。"
published = "2001-08-31T04:00:00Z"
remediation = "升级到 Check Point FireWall-1 FP1 或更高版本，该版本已修复端口 264 洪水攻击导致的高 CPU 消耗问题。如无法立即升级，请在 FireWall-1 管理控制台中的 Security Policy 内添加规则：对来自外部不可信网络的 TCP 端口 264 流量设置连接数限制和速率限制，或直接禁止外部对端口 264 的访问。同时启用 FireWall-1 的 DoS 防护功能（包括 SYN 攻击防护和连接速率限制），并持续监控防火墙 CPU 使用率，一旦发现异常升高立即阻断源 IP。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Check Point Firewall-1 拒绝服务漏洞"
