[basic]
description = "希捷 Seagate NAS OS 4.3.15.1 版本的 echo-server.html 页面存在开放重定向漏洞（CWE-601），未对 'state' URL 参数进行充分验证。未经身份认证的远程攻击者可构造包含恶意目标 URL 的 'state' 参数，诱骗用户点击特制链接，导致浏览器将用户重定向至攻击者控制的任意网站。攻击成功时，HTTP Referer 请求头中的敏感信息（如会话令牌、内部 URL 等）可能泄露给攻击者，进而被用于网络钓鱼、凭据窃取或恶意软件分发等后续攻击。该漏洞影响 Seagate NAS OS 4.3.15.1 版本，攻击向量为网络，攻击复杂度低，无需权限，但需要用户交互（点击恶意链接）才能触发，CVSS v3.0 基础评分 6.1，危害等级中等。"
published = "2019-05-13T13:29:00Z"
remediation = "建议升级 Seagate NAS OS 至 4.3.16.0 或更高版本（含修复补丁），通过 NAS 管理界面“系统更新”手动安装或开启自动更新。若暂无法升级，可在防火墙层面限制 NAS 管理端口（默认 80/443）仅允许可信 IP 访问，并禁用不必要的 Web 服务功能作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "希捷 NAS OS 开放重定向漏洞"
updated = "2026-06-17T01:37:30Z"

