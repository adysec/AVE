[basic]
description = "Amcrest IPM-721S 摄像头固件 V2.420.AC00.16.R.20160909 版本存在未授权信息泄漏漏洞，未经身份认证的远程攻击者可通过向设备发送特制 HTTP 请求，直接读取并下载存储于设备内的管理员账户配置信息，进而获取明文或哈希密码。该固件中的 sonia 进程在处理文件路径别名时，将 Web 路径 /current_config 映射至设备内部存储目录 /mnt/mtd/Config，该目录下包含 Account1、Account2、Sha1Account1 等敏感配置文件。攻击者无需任何凭据，仅需构造访问路径 http://目标IP/current_config/Sha1Account1 即可直接下载包含管理员哈希密码在内的账户配置数据，进而实现账户接管或进一步渗透内网。该漏洞影响 Amcrest IPM-721S 网络摄像头产品，由于攻击不需要身份认证且可直接远程触发，CVSS 评分为 9.8，危害等级为严重。"
published = "2019-07-03T20:15:10Z"
remediation = "立即将Amcrest IPM-721S摄像头固件升级至V2.420.AC00.16.R.20160909之后的最新版本，以修复未授权访问/current_config/Sha1Account1路径导致的管理员凭据泄露漏洞。如无法立即升级，可在网络边界防火墙中禁止外部IP访问摄像头的HTTP/HTTPS管理端口（80/443），并启用网络访问控制列表（ACL）限制仅授权网段可访问设备，同时修改设备默认管理员密码。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Amcrest IPM-721S 未授权信息泄露漏洞"
updated = "2026-06-17T01:26:00Z"

