[basic]
description = "Open WebUI 登录接口 `/api/v1/auths/signin` 存在基于响应时间差异的账户枚举漏洞。当用户邮箱存在于数据库中时，后端会执行 bcrypt 密码哈希比对（耗时约 180ms）；若邮箱不存在则直接返回（耗时约 5ms）。未认证的远程攻击者可通过测量登录请求的响应时间差异，枚举出已注册的合法账户邮箱，进而针对确认存在的账户进行密码喷洒攻击。该漏洞源于认证流程中未对不存在的邮箱执行恒定的哈希比对操作，属于典型的侧信道信息泄露。影响 Open WebUI 0.10.0 之前版本。"
published = "2026-07-09T17:17:02Z"
remediation = "立即升级 Open WebUI 至 v0.10.0 或更高版本，该版本在邮箱不存在时也会执行 bcrypt 哈希比较，消除响应时间差异。如无法立即升级，可在反向代理层（如 Nginx）对 /api/v1/auths/signin 端点添加统一延迟中间件，并启用 MFA 以降低账户枚举后的密码喷射攻击风险。"
score = 5.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Open WebUI 登录接口响应时间侧信道账户枚举漏洞"
updated = "2026-07-10T18:30:58Z"

