[basic]
description = "Apple Safari 6.0 之前版本使用的 WebKit 引擎中存在内存破坏漏洞，远程攻击者可通过诱导用户访问特制网站触发该漏洞，成功利用可导致任意代码执行或应用程序崩溃。该漏洞源于 WebKit 在处理畸形网页内容时存在内存处理错误，攻击者无需身份认证即可远程利用，CVSS 评分 9.3，危害严重。Apple 已在 Safari 6.0 版本中修复此漏洞。"
published = "2012-07-25T20:55:01.667"
remediation = "立即将 Apple Safari 升级至 6.0 及以上版本（Apple 于 2012 年 7 月 25 日发布 Safari 6.0 修复了该漏洞），同时确保 iOS 设备升级至 iOS 6.0 及以上。如无法升级，可禁用 JavaScript 解析或使用内容安全策略（CSP）限制不可信网页加载作为临时缓解。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit内存破坏漏洞"
updated = "2026-06-16T23:39:40.197"

