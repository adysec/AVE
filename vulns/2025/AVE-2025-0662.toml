[basic]
description = "Windows 恢复环境代理（Windows Recovery Environment Agent）存在不当访问控制漏洞，由于对系统资源的权限管理不严，具有物理访问权限的攻击者可通过在目标系统上运行特制程序触发该漏洞，从而将权限提升至 SYSTEM 级别，进而完全控制受影响系统。该漏洞影响多个 Windows 版本，CVSS 评分 6.1，危害等级中危。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:31Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 KB5049981（适用于 Windows 10 21H2/22H2，OS Builds 19044.5371 和 19045.5371），或通过 Windows Update 获取最新累积更新。该漏洞影响 Windows 恢复环境代理，需同时确保 WinRE 映像已更新（可通过 `reagentc /enable` 检查状态后，运行 `DISM /Online /Cleanup-Image /StartComponentCleanup /ResetBase` 更新 WinRE 分区）。由于攻击需要物理访问（AV:P），作为临时缓解措施，应限制对目标设备的物理接触并启用 BitLocker 和 Secure Boot。"
score = 6.1
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows Recovery Environment Agent 特权提升漏洞"
updated = "2026-06-17T08:42:45Z"

