[basic]
description = "tags.<value>pypiserver 1.2.5 及以下版本存在 CRLF（回车换行）注入漏洞。当用户在 URI 中插入 %0d%0a 字符序列时，未经身份认证的远程攻击者可在 HTTP 响应中注入任意首部字段，进而可能触发跨站脚本（XSS）攻击。该漏洞影响使用受影响版本部署简易 PyPI 服务器的用户，攻击者无需预先认证即可通过构造恶意 URI 发起攻击，在用户浏览器中执行任意 JavaScript 代码或篡改 HTTP 响应头，导致信息泄露或会话劫持等危害。"
published = "2019-01-25T04:29:00Z"
remediation = "将 pypiserver 升级到 1.2.6 或更高版本。执行 pip install --upgrade pypiserver 完成升级，或指定版本 pip install pypiserver==1.2.6。如暂无法升级，可在反向代理（如 Nginx）中配置过滤 URI 里的 %0d%0a（CRLF）字符作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "pypiserver 简易 PyPI 服务器 CRLF 注入漏洞"
updated = "2026-06-17T02:39:42Z"

