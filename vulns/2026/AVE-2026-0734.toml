[basic]
description = "X.Org X 服务器在 XKB（X 键盘扩展）兼容性映射处理过程中存在整数下溢与越界读取漏洞，未对输入数据进行充分的边界验证，导致服务器可读取超出预期内存范围的数据。具有 X11 服务器访问权限的本地或远程攻击者可发送特制的恶意请求触发该漏洞，从而泄露敏感内存信息或导致 X 服务器崩溃，造成拒绝服务。该漏洞影响运行 X.Org X 服务器及相关 XWayland 组件的 Linux 发行版系统，CVSS 评分为 6.1（中危），攻击条件要求攻击者具备 X11 显示服务器的访问权限。"
published = "2026-05-05T16:16:11Z"
remediation = "立即升级 xorg-server 至 21.1.22 或更高版本，升级 xwayland 至 24.1.10 或更高版本以修复 CheckModifierMap() 函数中的越界读取漏洞。Debian 用户可通过 apt 执行 apt update && apt upgrade xorg-server xwayland 获取修复版本（bookworm 版本为 2:21.1.7-3+deb12u12，sid 版本为 2:21.1.22-1）；RHEL/CentOS 用户应通过 yum update xorg-x11-server 安装最新安全更新。若无法立即升级，应在防火墙中禁用 TCP 端口 6000（iptables -A INPUT -p tcp --dport 6000 -j DROP）以阻止未授权客户端通过网络访问 X11 服务器，同时以 -nolisten tcp 参数启动 X 服务器禁止远程 TCP 连接，作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["zdi"]
title = "Xorg Xorg X服务器 XKB修饰符映射处理越界读取漏洞"
updated = "2026-06-17T10:38:25Z"

