[basic]
description = "Firefox 及 Thunderbird 的 JavaScript 引擎 JIT 组件存在误编译漏洞（CWE-843 类型混淆、CWE-733 编译器优化移除），攻击者通过构造恶意 JavaScript 代码可触发 JIT 编译器生成错误代码，导致内存损坏并实现远程代码执行。该漏洞影响 Firefox 149 以下版本、Firefox ESR 115.34 和 140.9 以下版本，以及 Thunderbird 149 和 140.9 以下版本。攻击者需诱导用户访问恶意网页或打开包含恶意脚本的邮件内容，在浏览器沙箱内以用户权限执行任意代码。Mozilla 已在 Firefox 149、Firefox ESR 115.34、Firefox ESR 140.9、Thunderbird 149 和 Thunderbird 140.9 中修复此漏洞。"
published = "2026-03-24T13:16:05Z"
remediation = "升级 Firefox 至 149 或更高版本（Firefox 148 及更早版本不会获得修复），Firefox ESR 115 升级至 115.34 或更高版本，Firefox ESR 140 升级至 140.9 或更高版本；Thunderbird 升级至 149 或 140.9 或更高版本。如无法立即升级，可在 about:config 中将 javascript.options.jit 设置为 false 禁用 JIT 编译作为临时缓解措施，但这会影响网页性能。"
score = 9.8
severity = "CRITICAL"
sources = ["zdi"]
title = "Mozilla Firefox 和 Thunderbird JavaScript 引擎远程代码执行漏洞"
updated = "2026-07-15T02:22:50Z"

