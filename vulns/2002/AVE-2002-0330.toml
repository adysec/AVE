[basic]
description = "Linux 内核 2.4.20 及更早版本以及 2.5.x 版本在 x86 系统上运行时，其仿真模式未能正确清除 TF（陷阱标志）和 NT（嵌套任务）EFLAGS 标志位，导致本地用户可通过触发仿真模式导致系统挂起，造成拒绝服务攻击。该漏洞影响 x86 架构下的 Linux 内核 2.4.20 及更早版本以及 2.5.x 开发版本，攻击者需具备本地用户权限即可利用，通过触发仿真模式使系统挂起，导致拒绝服务，CVSS 评分 2.1（低危），主要影响系统可用性。"
published = "2002-12-11T05:00:00Z"
remediation = "建议立即升级 Linux 内核到 2.4.21 或更高版本，或升级到已修补的 2.5.x 稳定版本（如 2.5.45 及以上）。Red Hat 用户可安装 RHSA-2002:267 补丁，Debian 用户可升级至 kernel-image-2.4.21 或更高版本。若暂时无法升级内核，可通过限制本地用户登录权限、禁用不必要的本地账户或在内核启动参数中禁用 VM86 模拟模式作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Linux 内核 拒绝服务漏洞"
updated = "2026-06-16T21:59:06Z"

