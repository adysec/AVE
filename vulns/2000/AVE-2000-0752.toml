[basic]
description = "Cisco PIX Firewall 5.2(2) 版本在处理 FTP 被动模式（PASV）请求时存在信息泄露漏洞。远程未认证攻击者可通过向防火墙后的 FTP 服务器发送大量 PASV 请求泛洪服务器，导致防火墙在建立被动模式连接时的响应中泄露内部 FTP 服务器的真实内网 IP 地址。该漏洞影响 Cisco Secure PIX Firewall 5.2(2) 版本，CVSS 评分 5.0（中等严重度），攻击向量为网络、攻击复杂度低、无需认证，仅影响机密性部分泄露。攻击者可利用泄露的内网 IP 地址进行内网拓扑探测、针对性攻击或绕过防火墙访问控制。Cisco 已发布修复版本修复此漏洞，建议升级至修复版本或配置 FTP 检查功能限制 PASV 响应。"
published = "2000-12-11T05:00:00.000"
remediation = "建议升级 Cisco PIX Firewall 至 5.2(3) 或更高版本，或迁移至 Cisco ASA 系列防火墙。若无法立即升级，可在防火墙配置中禁用 FTP PASV 模式检查（no fixup protocol ftp 21），或在边界防火墙配置 ACL 限制仅允许可信源访问 FTP 服务端口（TCP 21）作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Cisco PIX Firewall 5.2 PASV 模式 FTP 内部地址泄露漏洞"
updated = "2026-06-16T21:53:00.030"

