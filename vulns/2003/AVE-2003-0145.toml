[basic]
description = "SANE（Scanner Access Now Easy）后端组件 sane-backends 1.0.7 及更早版本中，saned 守护进程在处理 SANE_NET_INIT RPC 调用时未对连接主机的 IP 地址进行校验，导致攻击者能够绕过 saned.conf 配置文件中设置的 IP 访问控制列表，从任意网络地址发起远程 RPC 请求。该漏洞影响所有部署了受影响版本网络扫描服务的系统，未经身份认证的远程攻击者无需任何凭据即可利用此漏洞访问扫描设备或获取敏感信息，造成未授权访问和数据泄露风险。CVSS 评分为 7.5，危害等级高。"
published = "2003-09-22T04:00:00Z"
remediation = "升级 sane-backends 至 1.0.8 或更高版本（已修复 IP 地址校验缺陷），同时在 saned.conf 中严格配置 allow_from 限制可连接的客户端 IP 范围，并在防火墙层面仅允许受信任网络访问 saned 端口（默认 6566/tcp）。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "sane sane-backends IP地址验证绕过漏洞"
updated = "2026-06-16T22:02:48Z"

