[basic]
description = "Linux 内核 PowerPC 架构的代码补丁（code-patching）基础设施在分配文本补丁区域时，错误地将该区域标记为 VM_ALLOC 标志。VM_ALLOC 标志专用于 vmalloc() 分配的内存，而 text_area_cpu_up() 所分配的区域并非 vmalloc 内存，实际通过 map_kernel_page() 按需直接映射，并无对应的 VM 标志表示此使用方式，应不传递任何标志以使该区域立即可用。在启用 KASAN（内核地址消毒器）的 PowerPC 平台（如 PowerMac G4）上，当内核执行 BPF JIT 编译或代码补丁操作时，KASAN 会将该区域标记为无效内存（KASAN_VMALLOC_INVALID），导致在 copy_to_kernel_nofault 等内存复制操作中触发越界访问报告，造成系统崩溃或拒绝服务。该漏洞影响 Linux 内核 6.13-rc6 及之前版本，CVSS 评分为 5.5（中等）。"
published = "2025-03-12T10:15:19Z"
remediation = "升级 Linux 内核至以下已修复版本之一：5.4.291、5.10.235、5.15.179、6.1.130、6.6.80、6.12.17 或 6.13.5 及更高版本。修复提交为 d262a192d38e，将 arch/powerpc/lib/code-patching.c 中 text_area_cpu_up() 函数调用的 get_vm_area(PAGE_SIZE, VM_ALLOC) 改为 get_vm_area(PAGE_SIZE, 0)，消除 KASAN 对文本修补区域的错误标记。如无法立即升级，可通过内核启动参数禁用 KASAN 作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Kernel PowerPC 代码补丁权限提升漏洞"
updated = "2026-06-17T08:44:29Z"

