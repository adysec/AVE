[basic]
description = "PHP 5.3.4 之前版本的 Standard PHP Library (SPL) 扩展中 SplFileInfo::getType 函数在 Windows 平台上未能正确检测符号链接，由于缺少 FILE_ATTRIBUTE_REPARSE_POINT 检查，导致 stat 结构存在跨平台差异。本地攻击者可利用此漏洞发起符号链接攻击，通过创建恶意符号链接诱导目标程序访问并操作非预期文件，从而造成敏感信息泄露、权限提升或文件破坏。攻击者需要具备本地系统访问权限，利用难度中等。"
published = "2011-02-02T22:00:02Z"
remediation = "升级 PHP 至 5.3.4 或更高版本。Windows 环境下，SplFileInfo::getType 函数在 5.3.4 之前无法正确检测符号链接，攻击者可利用跨平台 stat 结构差异实施符号链接攻击。建议立即更新 PHP 版本，并在 Windows 服务器上启用 FILE_ATTRIBUTE_REPARSE_POINT 检查机制。如无法升级，可通过禁用 SPL 扩展中涉及符号链接解析的功能作为临时缓解措施。"
score = 4.4
severity = "MEDIUM"
sources = ["tenable"]
title = "PHP SPL扩展SplFileInfo::getType符号链接处理漏洞"
updated = "2026-06-16T23:28:00Z"

