[basic]
description = "Microsoft Edge（基于 Chromium）存在权限提升漏洞，源于对某些页面资源的访问控制（CWE-284）实现不当。远程攻击者可通过诱导用户访问特制的恶意网页，利用该漏洞绕过 Edge 的安全限制，获取本应受限的敏感信息（如浏览器内部数据或其他源的内容），导致机密性受损。该漏洞影响 132.0.2957.115 之前版本的 Microsoft Edge，攻击复杂度低，无需提前获取用户权限，但需要用户交互配合。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-17T20:15:30Z"
remediation = "立即将 Microsoft Edge 升级至 132.0.2957.115 或更高版本。可通过浏览器访问 edge://settings/help 触发自动检查更新并安装。企业用户可通过 Microsoft Intune 或组策略批量推送更新。如无法立即升级，可在 Edge 中启用「站点隔离」(Site Isolation) 和「增强安全模式」(enhanced-security-mode) 作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Edge 基于 Chromium 的特权提升漏洞"
updated = "2026-06-17T08:42:43Z"

