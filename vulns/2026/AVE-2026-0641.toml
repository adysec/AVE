[basic]
description = "ASP.NET Core SignalR 存在资源无限制分配漏洞（CWE-770），源于 Stateful Reconnect 功能在处理客户端重连请求时未对资源分配进行有效限制。未经身份认证的远程攻击者可通过向目标服务器发送大量精心构造的 Stateful Reconnect 请求，耗尽服务器资源，导致其他合法用户无法正常使用 SignalR 服务，形成拒绝服务。该漏洞影响 .NET 8、.NET 9 和 .NET 10 版本中使用 SignalR 且启用了 Stateful Reconnect 的应用程序，CVSS 评分 7.5，危害等级高。Microsoft 已在 2026 年 7 月安全更新中发布修复版本。"
published = "2026-07-14T17:17:10Z"
remediation = "将 Microsoft.AspNetCore.App.Runtime 包升级到修复版本：.NET 10.0 升级至 10.0.6，.NET 9.0 升级至 9.0.15，.NET 8.0 升级至 8.0.26。运行 `dotnet --info` 确认当前版本，通过 NuGet 包管理器或 Visual Studio 更新对应包引用。如无法立即升级，可在 SignalR 连接中禁用 Stateful Reconnect 功能作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Microsoft ASP.NET Core SignalR 拒绝服务漏洞"
updated = "2026-07-22T21:17:56Z"

