[basic]
description = "WordPress Localize My Post 插件 1.0 版本中存在目录遍历漏洞，位于 ajax/include.php 文件的 file 参数。未经身份认证的攻击者可通过向该参数传递 ../ 路径序列实现目录穿越，读取服务器上任意文件，导致敏感信息泄露。攻击无需任何权限，利用方式简单，仅需发送特制 HTTP 请求即可触发。"
published = "2018-09-24T22:29:01Z"
remediation = '立即删除 WordPress 插件目录 wp-content/plugins/localize-my-post/ 彻底移除该插件，该插件已被官方下架且不再维护。如暂时无法删除，在 .htaccess 中添加 RewriteRule ^wp-content/plugins/localize-my-post/ajax/include\.php - [F,L] 拒绝直接访问存在漏洞的 include.php 文件，并尽快迁移至其他本地化替代插件。'
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress Localize My Post插件目录遍历漏洞"
updated = "2026-06-17T01:44:03Z"

