[basic]
description = "Microsoft Windows NT 4.0 和 Windows 2000 系统中的 NetBIOS 名称服务器（NBNS）协议存在欺骗漏洞。NBNS 协议在设计上未实现身份认证机制，远程攻击者可伪造 Name Conflict 或 Name Release 类型的 UDP 数据报并发送给目标系统，诱导 NBNS 错误地释放或冲突已注册的 NetBIOS 名称记录，从而导致合法主机名称解析失败，造成拒绝服务。该漏洞影响 Windows NT 4.0 及 Windows 2000 操作系统中的 NetBIOS 名称解析服务，CVSS 评分为 5.0，攻击者仅需网络可达且无需任何认证即可利用此漏洞发起攻击。"
published = "2000-07-27T04:00:00Z"
remediation = "立即安装微软安全更新 KB244941（适用于 Windows 2000）；Windows NT 4.0 用户需升级至 Windows 2000 或更高版本。如无法立即修补，在防火墙或路由器上阻断 UDP 137 端口（NetBIOS Name Service）的入站流量，仅允许内网可信主机访问该端口。同时建议关闭不必要的 NetBIOS over TCP/IP 设置（网络连接属性 → Internet 协议 → 高级 → WINS → 禁用 NetBIOS），并将系统迁移至受支持的 Windows 版本（如 Windows Server 2022 或 Windows 11）。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Windows NT 4.0/2000 NetBIOS Name Server 拒绝服务漏洞"
updated = "2026-06-16T21:52:14Z"

