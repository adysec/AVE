[basic]
description = "Netscape 和 Mozilla 浏览器在处理 jar: URL 引用的 .jar 文件时，解压缩过程中存在堆缓冲区溢出漏洞。远程攻击者可构造包含畸形 .jar 文件的恶意 jar: URL，诱导用户访问或自动加载，触发解压缩时的堆缓冲区溢出，实现远程任意代码执行。该漏洞影响 Netscape 及早期 Mozilla 版本浏览器，CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），攻击向量为网络远程、低复杂度、无需认证，成功利用可导致任意代码执行，攻击者可完全控制受害主机。攻击条件为用户访问包含恶意 jar: URL 的页面或邮件，利用方式为构造畸形 JAR 文件触发堆溢出实现代码执行。"
published = "2002-11-29T05:00:00Z"
remediation = "升级到 Netscape Navigator 4.79 或 Mozilla 1.7.12 或更高版本，更新 NSS/NSPR 安全补丁至 ≥2006-03-01，更新安全库 NSS 3.28.4+ 以修复缓冲区溢出漏洞。如需立即修复，可在浏览器中禁用 jar: 协议或限制 jar 文件处理。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Mozilla Firefox 堆缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:59:05Z"

