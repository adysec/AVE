[basic]
description = "WordPress GTranslate 插件在 2.8.52 及之前版本中存在反射型跨站脚本（XSS）漏洞。当站点开启了 hreflang 标签功能并使用子域名或子目录付费选项时，未经身份认证的远程攻击者可通过构造恶意链接，将 JavaScript 代码注入到页面响应中。当用户点击该特制链接后，恶意脚本将在其浏览器中执行，导致会话劫持、敏感信息窃取或页面内容篡改等后果。该漏洞影响使用 GTranslate 插件的 WordPress 网站，攻击条件为插件已启用 hreflang 标签功能且采用付费子域名/子目录模式，攻击复杂度低，无需认证即可实施。建议升级至 GTranslate 2.8.52 或更高版本以修复此漏洞。"
published = "2020-04-20T01:15:11Z"
remediation = "升级 WordPress GTranslate 插件至 2.8.52 或更高版本，该版本已修复通过构造恶意链接触发的反射型跨站脚本漏洞。对于使用付费子域名或子目录选项且启用了 hreflang 标签的站点，如无法立即升级，可暂时在 GTranslate 设置中关闭 hreflang 标签功能作为缓解措施，并避免点击来源不明的翻译链接。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress GTranslate 反射型跨站脚本漏洞"
updated = "2026-06-17T02:51:04Z"

