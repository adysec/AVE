[basic]
description = "Synacor Zimbra Collaboration Suite（ZCS）的 ZmMailMsgView.getAttachmentLinkHtml 函数存在跨站脚本（XSS）漏洞。该漏洞源于程序在处理邮件附件的 Content-Location HTTP 头时未正确过滤特殊字符，导致攻击者可在邮件附件中注入恶意 HTML 或 JavaScript 代码。当用户查看包含恶意附件的邮件时，注入的脚本将在用户浏览器中执行，造成敏感信息泄露或会话劫持。攻击者只需向目标用户发送特制邮件即可触发，无需身份认证，但需要用户交互（查看邮件）。该漏洞影响 ZCS 8.7 Patch 1 之前版本及 8.8.x 系列中 8.8.7 之前版本，CVSS 评分 6.1，危害等级中危。"
published = "2018-03-27T16:29:00Z"
remediation = "立即升级至 Zimbra Collaboration 8.7.11 Patch 1 或 8.8.7 及以上版本。升级前可在邮件网关层过滤包含异常 Content-Location 头的邮件附件作为临时缓解措施，同时建议限制用户预览 HTML 格式邮件以降低被攻击风险。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Synacor Zimbra Collaboration 跨站脚本漏洞"
updated = "2026-06-17T02:02:24Z"

