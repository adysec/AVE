[basic]
description = "tags asrequested.<value>File Browser 是一个用于上传、删除、预览、重命名和编辑指定目录内文件的文件管理界面。在 2.63.16 版本之前，仅拥有 Create 权限的作用域非管理员用户可通过上传失败清理路径中的符号链接跟随漏洞，删除其作用域之外的任意文件（包括其他租户数据和应用程序自身数据库）。ScopedFs.RemoveAll 是唯一跳过其他方法强制执行的符号链接守卫的解引用操作。直接上传处理器在失败清理期间对用户控制的路径执行 RemoveAll，仅受 Perm.Create 门控。如果用户作用域内已存在逃逸目录符号链接，经过身份验证的仅创建权限用户可删除作用域外目标，绕过 ScopedFs 边界和 Perm.Delete 门控。该漏洞是对 CVE-2026-54094 的不完整修复，CVSS 评分 8.2，危害等级高。官方已在 2.63.16 版本中修复。"
published = "2026-06-25T19:16:43Z"
remediation = "立即升级 File Browser 至 v2.63.16 或更高版本，该版本在 ScopedFs.Remove 和 ScopedFs.RemoveAll 方法中增加了 symlink 路径解析守卫（guard），防止上传失败清理时沿符号链接删除范围外文件。如无法立即升级，可临时移除用户作用域内所有非预期的符号链接，并监控 /api/resources 路径的 POST 请求日志。"
score = 8.2
severity = "HIGH"
sources = ["ghsa"]
title = "File Browser 路径遍历任意文件删除漏洞"
updated = "2026-06-26T04:17:46Z"

