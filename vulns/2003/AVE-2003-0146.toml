[basic]
description = "saned 是 SANE（Scanner Access Now Easy）后端中的网络守护进程，用于通过网络共享扫描仪设备。sane-backends 1.0.7 及更早版本中的 saned 在客户端连接意外断开时未能及时进行异常处理，导致程序访问无效内存地址并触发段错误（segmentation fault）。未经身份认证的远程攻击者可通过向目标系统发送网络连接请求后主动断开连接触发该漏洞，造成拒绝服务。该漏洞影响多个 Linux 发行版中的 sane-backends 软件包，攻击者无需身份认证即可远程利用，攻击复杂度低。CVSS v2 评分为 7.5，危害等级为高。"
published = "2003-09-22T04:00:00Z"
remediation = "立即升级 sane-backends 至 1.0.8 或更高版本，安装各发行版对应安全更新（如 Debian woody 升级至 1.0.7-4、Red Hat 应用 RHSA-2003-278/285 补丁）。如暂无需远程扫描功能，请停止 saned 守护进程并禁止其开机自启；作为临时缓解措施，可通过防火墙规则仅允许受信任的 IP 地址访问 saned 默认 TCP 端口 6566，阻断外部恶意连接。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "sane-backends 远程拒绝服务漏洞"
updated = "2026-06-16T22:02:48Z"

