[basic]
description = "该漏洞涉及QNAP QTS在网络页面生成过程中对用户输入进行转义处理不当，导致跨站脚本（XSS）攻击可持续性。攻击者在网络端无需管理员权限，但需要用户与受害者配合操作，通过精心构造的恶意输入触发漏洞，实现JavaScript代码的执行，从而窃取敏感信息、篡改网站内容或破坏系统完整性。此类攻击需要用户与受害者进行特定的操作配合才能完成，但能够在改变原有权限范围的情况下突破安全控制，造成高保密性、高完整性和高可用性影响，CVSS评分8.0。"
published = "2020-10-28T18:15:12Z"
remediation = "建议立即升级 QNAP QTS 至以下任一修复版本：QTS 4.4.2.1270 (build 20200410)、QTS 4.4.1.1261 (build 20200330)、QTS 4.3.6.1263 (build 20200330)、QTS 4.3.4.1282 (build 20200408)、QTS 4.3.3.1252 (build 20200409) 或 QTS 4.2.6 (build 20200421) 及以上版本。升级前请备份重要数据，通过 Control Panel → System → Firmware Update 进行在线更新或手动下载固件升级。若暂时无法升级，可在防火墙层面限制 NAS 管理界面仅允许可信 IP 访问，并启用 HTTPS 强制加密访问作为临时缓解措施。"
score = 8
severity = "HIGH"
sources = ["kev"]
title = "威联通 QTS 跨站脚本漏洞"
updated = "2026-06-17T01:50:09Z"

