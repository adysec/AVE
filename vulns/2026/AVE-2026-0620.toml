[basic]
description = "ForgeKeep nebula-mesh 项目在启用 OIDC 认证时，`GET /ui/oidc/login` 端点未进行身份认证且未注册在速率限制路由组内。未经身份认证的远程攻击者可向该端点发送大量请求，每次请求都会在服务端内存中创建并存储一个有效期为 10 分钟的随机 OIDC 状态值，且服务端未对状态总数或请求速率进行限制，导致内存无限增长，最终造成拒绝服务。该漏洞影响 nebula-mesh v0.2.0 至 v0.4.0 版本，已在 v0.5.0 中修复。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级到 nebula-mesh v0.5.0 或更高版本。如无法立即升级，在 `internal/web/web.go` 中将 `GET /ui/oidc/login` 路由注册移入已受 `auth` 速率限制的路由组内，或在 `HandleLogin` 函数入口处增加全局 OIDC 状态上限（如最大 1000 条）和单客户端速率限制，超出时返回 429 状态码拒绝请求。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "ForgeKeep nebula-mesh OIDC 登录端点未授权内存状态耗尽漏洞"
updated = "2026-01-01T00:00:00Z"

