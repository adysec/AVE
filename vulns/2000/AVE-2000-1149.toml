[basic]
description = 'tags.<value>Apache Tomcat 3.1 之前版本中的 source.jsp 文件存在目录遍历漏洞。未经身份认证的远程攻击者可通过向 source.jsp 传递包含 ".." (dot dot) 序列的参数，构造特殊 HTTP 请求读取服务器上的任意文件。该漏洞影响 Apache Tomcat 3.1 之前的所有版本，CVSS 评分 5.0，危害等级中危。Apache 已在 Tomcat 3.1 及后续版本中移除了存在漏洞的 source.jsp 文件并修复了此问题。'
published = "2002-03-22T05:00:00Z"
remediation = 'tags.<value>建议立即升级 Apache Tomcat 至 3.1 版本或更高版本，该版本已修复 source.jsp 目录遍历漏洞。若暂时无法升级，可通过 Web 应用防火墙 (WAF) 规则拦截包含 ".." 路径遍历序列的请求，或在 Tomcat 配置中禁用 source.jsp 文件访问作为临时缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Apache Tomcat 目录遍历漏洞"
updated = "2026-06-16T21:53:23Z"

