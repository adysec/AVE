[basic]
description = "WordPress Social Warfare 插件 3.5.3 之前版本存在存储型跨站脚本漏洞，攻击者可通过向 wp-admin/admin-post.php 的 swp_debug=load_options 参数中的 swp_url 参数注入恶意 JavaScript 代码，当管理员访问后台页面时触发执行，导致敏感信息泄露或会话劫持。该漏洞无需认证即可利用，已在 2019 年 3 月被野外利用，影响 Social Warfare 及 Social Warfare Pro 版本。"
published = "2019-03-24T15:29:00.243"
remediation = "立即将 Social Warfare 插件升级至 3.5.3 或更高版本（在 WordPress 后台插件页面检查更新或手动下载安装）。如无法立即升级，可删除或重命名插件目录中的 admin-post.php 文件，或在 Web 应用防火墙（WAF）层面添加规则拦截包含 swp_debug=load_options 参数的请求作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["kev"]
title = "WordPress Social Warfare 插件 存储型跨站脚本漏洞"
updated = "2026-06-17T02:44:58.130"

