[basic]
description = "Apple Mac OS X 10.6.x 版本 10.6.5 之前的 QuickTime 在处理 GIF 图像数据时存在未初始化内存访问漏洞。远程攻击者可通过诱导用户打开精心构造的恶意 GIF 文件，触发未初始化内存访问，导致任意代码执行或应用程序崩溃拒绝服务。该漏洞影响 Mac OS X 10.6.x 版本（10.6.5 之前），CVSS 评分 6.8（AV:N/AC:M/Au:N/C:P/I:P/A:P），属于中等严重度漏洞。攻击者需诱导用户打开恶意 GIF 文件才能触发漏洞，攻击向量为网络，攻击复杂度中等，无需认证即可利用。Apple 已在 Mac OS X 10.6.5 更新中修复此漏洞。"
published = "2010-11-16T22:00:16Z"
remediation = '立即升级 QuickTime 至 7.6.9 或更高版本，或将 Mac OS X 10.6.x 升级至 10.6.5 及以上版本（通过 Apple 菜单 → "软件更新" 安装 Security Update 2010-007）。若暂时无法升级，请勿打开不可信来源的 GIF 图像文件，并禁用浏览器自动打开 GIF 功能作为临时缓解措施。'
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "苹果 QuickTime 媒体文件处理内存访问漏洞"
updated = "2026-06-16T23:23:33Z"

