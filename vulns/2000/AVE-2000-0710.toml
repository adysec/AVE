[basic]
description = 'tags.<value>Anaconda Foundation Directory 的 apexec.pl 脚本存在目录遍历漏洞，远程攻击者可通过构造包含".."（点号）的路径参数绕过目录访问限制，读取服务器上的任意文件。该漏洞影响 1.4 至 1.8 版本的 Anaconda Foundation Directory，由于无需身份认证且利用条件简单，攻击者仅需向目标发送特制 HTTP 请求即可获取敏感文件内容，如系统配置文件、密码文件等，可能导致敏感信息泄露。'
published = "2000-12-19T05:00:00Z"
remediation = "升级 Anaconda Foundation Directory 至 2.0 或更高版本，该版本已修复 apexec.pl 中对 template 参数未过滤 ../ 路径遍历序列的安全缺陷。如暂无法升级，应立即在 Web 服务器配置中禁用或移除 cgi-bin 目录下的 apexec.pl 脚本，或在 Apache 配置中使用 <Location> 指令限制对该脚本的访问；同时可在防火墙或 WAF 规则中拦截包含 ../ 或 %00 特征的请求参数，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Anaconda Foundation Directory apexec.pl 目录遍历漏洞"
updated = "2026-06-16T21:52:53Z"

