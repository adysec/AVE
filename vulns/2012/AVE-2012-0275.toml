[basic]
description = "Safari 6.0 之前的 Apple Safari 浏览器所使用的 WebKit 渲染引擎存在内存破坏漏洞。未经身份认证的远程攻击者可通过诱导用户访问一个特制恶意网页来触发该漏洞，导致应用程序崩溃（拒绝服务）或在目标系统上执行任意代码。该漏洞影响运行旧版本 Safari 的 macOS 和 iOS 设备，攻击者无需任何凭据即可在网络可达条件下完成利用。Apple 已在 2012 年 7 月发布的安全更新中将 Safari 升级至 6.0 版本以修复此问题。"
published = "2012-07-25T20:55:02Z"
remediation = '立即将 Apple Safari 升级至 6.0 或更高版本，macOS Lion 系统同步升级至 OS X v10.7.4，macOS Mountain Lion 升级至 OS X v10.8，以获取 WebKit 内存损坏问题的官方补丁。临时缓解措施包括：启用 Safari 安全浏览功能、禁用自动打开"安全"文件下载选项、避免访问未知网站，或在网络边界部署 Web 应用防火墙拦截恶意网页请求。'
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:32Z"

