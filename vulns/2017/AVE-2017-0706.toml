[basic]
description = "Google Chrome V8 JavaScript引擎存在类型混淆漏洞，攻击者可通过构造恶意HTML页面触发该漏洞。在V8中，类型检查和处理逻辑存在缺陷，导致 JavaScript对象的类型验证失败。当引擎尝试对混淆后的对象执行类型特定操作时，可能会导致内存控制破坏或代码执行优化破坏。该漏洞影响所有Windows、Linux和Mac操作系统上的Chrome 59.0.3071.86之前版本，以及Android版本59.0.3071.92之前版本。攻击者无需认证即可远程触发漏洞，用户只需访问恶意网站即可触发，绕过沙盒保护，实现远程代码执行。该漏洞可用于链式攻击，结合其他漏洞利用，完全破坏进程隔离，实现本地代码执行。该漏洞的CVSS评分8.8，危害等级严重。谷歌已在2017年7月更新中修复此漏洞，用户需及时更新Chrome浏览器以获取保护。"
published = "2017-10-27T05:29:00Z"
remediation = "立即升级 Google Chrome 到最新稳定版本（当前 124.0.6367.201 或更高版本），最低要求使用 118.0.6027.0 或更高版本，以获取修复的 V8 引擎。Windows 用户通过 chrome://settings/help 手动检查更新，或在 Windows Update 中启用“选择可选更新”。Linux 用户使用软件管理器更新谷歌Chrome包。macOS 用户通过 Chrome 菜单“关于 Google Chrome”自动更新。如无法立即更新，可删除或禁用 Flash 插件 (`chrome://settings/content/flash`) 并使用沙盒模式运行 (`chrome://settings/security`)，同时对可信网站启用严格的 SameSite-Cookie 设置以缓解潜在利用风险。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome V8 类型混淆漏洞"
updated = "2026-06-17T01:19:51Z"

