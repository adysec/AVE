[basic]
description = "HP OpenView OmniBack II A.03.50版本存在远程命令执行漏洞，攻击者可通过向目标系统TCP 5555端口发送特制的协议数据包触发该漏洞。漏洞原理在于OmniBack II服务对客户端请求缺乏充分的输入验证和身份认证，攻击者利用目录遍历技术（如/../../../bin/sh）结合服务参数传递机制，在无需任何凭据的情况下执行任意操作系统命令。该漏洞影响HP 11.x及更早版本中运行的OmniBack II备份软件，Unix和Windows平台均受影响。攻击者仅需网络可达目标OmniBack服务，即可获取服务器权限，进而访问敏感数据、篡改备份内容或进一步渗透内网。该漏洞已于2001年2月由安全研究人员DiGiT发现，并已公开Metasploit利用模块。"
published = "2001-06-02T04:00:00Z"
remediation = "建议升级 HP OpenView OmniBack II 至 A.03.51 或更高版本，该版本已修复 OmniInet 服务的身份验证绕过漏洞。具体操作：联系 HP 官方支持获取对应平台的安全补丁包，按照 HP 安全公告 HPSBUX0102-142 的指引安装补丁，补丁会修复 OmniInet 服务（TCP 5555 端口）对客户端请求缺少身份验证的问题。如暂无法升级，可在防火墙层限制对 OmniBack 客户端 5555 端口的访问，仅允许受信任的备份服务器 IP 连接，作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "HP OpenView OmniBack II 命令执行漏洞"
updated = "2026-06-16T21:54:04Z"

