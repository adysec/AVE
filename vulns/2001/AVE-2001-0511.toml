[basic]
description = "Linux 内核 2.2.19 之前版本的 CPIA（Color Processor Interface ASIC）驱动中存在差一错误（Off-by-one）漏洞。本地攻击者利用该漏洞可越界写入内核内存，导致内核内存数据被篡改，破坏系统完整性。攻击者需具备本地系统访问权限和低权限用户身份，无需用户交互即可触发。该漏洞影响 Linux 内核 2.2.19 之前的所有版本，CVSS 评分 5.5，危害等级中等。"
published = "2001-04-17T04:00:00Z"
remediation = "升级 Linux 内核至 2.2.19 或更高版本以修复 CPIA 驱动中的差一错误（off-by-one）。如无法升级内核，可卸载 cpia 内核模块（`rmmod cpia`）并在 `/etc/modprobe.d/` 中添加黑名单配置 `blacklist cpia` 禁止自动加载，同时限制本地用户对摄像头设备的访问权限。"
score = 5.5
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux kernel CPIA驱动差一错误漏洞"
updated = "2026-06-16T21:56:10Z"

