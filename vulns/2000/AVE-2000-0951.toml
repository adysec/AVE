[basic]
description = "CVE-2000-0802是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2000-10-20T04:00:00Z"
remediation = '立即卸载或停止 BAIR 程序。打开"HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run"，删除名为"BAIR Secure"的注册表启动项即可永久关闭 BAIR 拦截。同时重启系统后重新启动 regedit，并重置 IE Internet 选项中的代理设置。若需长期保障，建议升级使用内置于 Windows 的家长控制或第三方权限管理工具替代此存在缺陷的第三方拦截软件。'
score = 3.6
