[basic]
description = "MQTT broker 存在身份认证缺失漏洞（CWE-306），该服务仅依赖防火墙限制外部访问而未实施身份验证机制。未经身份认证的远程攻击者若能访问 MQTT broker（例如绕过防火墙规则或从内部网络发起连接），即可直接连接并操控 broker，进而完全接管目标设备，造成数据泄露、设备被控等严重后果。该漏洞影响依赖 MQTT 通信的物联网设备及工业控制系统，CVSS v4.0 评分 9.3，危害等级严重。"
published = "2026-07-30T07:16:56Z"
remediation = "建议立即将 Phoenix Contact CHARX SEC-3000/3050/3100/3150 充电控制器固件升级至 1.9.1 版本（2026年8月12日前发布）。升级前请从官网下载区获取对应型号固件包。如无法立即升级，必须将设备部署在封闭工业网络内，并在边界防火墙严格限制 MQTT 端口（默认 1883/8883）仅允许受信 IP 访问，同时禁用不必要的远程管理服务。"
score = 9.3
severity = "CRITICAL"
sources = ["zdi"]
title = "Phoenix Contact CHARX SEC-3150 MQTT broker 身份验证缺失漏洞"
updated = "2026-07-30T14:31:21Z"

