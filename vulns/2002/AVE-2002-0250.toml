[basic]
description = "Phusion WebServer 1.0 在处理 HTTP 请求时存在缓冲区溢出漏洞，未对用户提交的 URL 字段进行充分的长度边界检查。远程攻击者可通过发送超长的 HTTP 请求 URL 字段，使服务器栈缓冲区溢出，从而造成拒绝服务或执行任意代码。由于 Phusion WebServer 在 Windows 系统上通常以 SYSTEM 权限运行，攻击者可借此获取目标主机的完全控制权。该漏洞影响 Phusion WebServer 1.0 版本，攻击无需身份认证，只需向目标 80 端口发送特制的超长 URL 请求即可触发。目前已有公开 PoC 可供验证。"
published = "2002-05-31T04:00:00Z"
remediation = "将 Phusion WebServer 从 v1.0 升级至 v1.0.7 或更高版本，该版本修复了 URL 解析中的缓冲区溢出问题。升级后，在 Phusion WebServer 配置文件中添加 URL 长度限制指令（如设置 MaxUriLen 为 2048 字节），拒绝超出长度的 HTTP 请求。同时在 Windows 防火墙中配置入站规则，仅允许受信任的 IP 地址访问 Web 服务器默认端口（TCP 80），以降低被远程利用的风险。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Phusion WebServer 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:57:09Z"

