[basic]
description = "Windows Win32k 组件在处理内存对象时存在权限提升漏洞，具体表现为 SetImeInfoEx 函数存在 NULL 指针解引用缺陷。具有低权限账户的本地攻击者需能够在目标系统上执行应用程序，通过向系统发送特制请求触发该漏洞，可在内核上下文中执行任意代码从而获取 SYSTEM 权限。该漏洞影响 Windows 7、Windows Server 2008 及 Windows Server 2008 R2 等版本，成功利用后可完全控制受影响系统。"
published = "2018-05-09T19:29:01.277"
remediation = "立即安装 Microsoft 2018 年 5 月安全更新 KB4100480（Windows 7 SP1 / Windows Server 2008 R2 SP1）或 KB4100481（Windows Server 2008 SP2），通过 Windows Update 自动更新或手动下载安装。安装后重启系统使补丁生效。如无法立即打补丁，可通过组策略禁用 Win32k 组件的非必要对象访问权限作为临时缓解措施，并部署 Microsoft Defender ATP 检测规则监控 SetImeInfoEx 异常调用。"
score = 7
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Win32k 特权提升漏洞"
updated = "2026-06-17T02:04:17.890"

