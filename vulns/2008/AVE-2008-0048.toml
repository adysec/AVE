[basic]
description = "Adobe Flash Player ActiveX 控件存在未指明信息泄露漏洞，影响 Windows 平台上 9.0.124.0 及更早版本的 Flash Player。攻击者可通过未知攻击向量远程获取敏感信息，该漏洞仅影响 ActiveX 控件而非 Mozilla 浏览器插件。CVSS 评分为 7.1，攻击复杂度中等，无需身份认证即可利用。攻击者可通过恶意网页或电子邮件中的 Flash 内容触发漏洞，导致用户计算机上的敏感信息泄露。"
published = "2008-11-10T14:12:55Z"
remediation = "立即升级 Adobe Flash Player 至 10.0.12.36 或更高版本，具体操作为：通过 Windows 控制面板卸载旧版 Flash Player，然后访问 Adobe 官网下载最新安装包进行安装；对于企业环境可通过 Adobe  Flash Player  Administration Kit 批量部署。如暂无法升级，可在 Internet Explorer 中禁用 ActiveX 控件运行或限制 Flash 内容的自动播放作为临时缓解措施。"
score = 7.1
severity = "HIGH"
sources = ["tenable"]
title = "Adobe Flash Player ActiveX 信息泄露漏洞"
updated = "2026-06-16T22:58:36Z"

