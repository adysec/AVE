[basic]
description = 'Apache 1.3.6 上运行的 PHP 3.x 存在路径遍历文件泄露漏洞。远程攻击者可通过向目标服务器发送包含编码反斜杠序列 "%5c" 的畸形路径遍历请求（如 `..%5c`），绕过输入过滤机制，读取 Web 服务器上的任意文件（如 `/etc/passwd` 等敏感文件）。该漏洞源于 PHP 对路径分隔符的编码处理不当，导致 `..` 路径穿越检测被绕过。攻击者无需身份认证即可利用，CVSS 评分 5.0，危害等级中危。受影响版本为 Apache 1.3.6 配合 PHP 3.x。'
published = "2001-02-16T05:00:00Z"
remediation = "升级 PHP 至 4.0 或更高版本，该漏洞在 PHP 4.0 中已修复。如无法升级，可在 Apache 配置中禁用 PHP 3 的路径参数传递功能，或对用户输入进行严格的路径规范化过滤。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Apache HTTP Server PHP 3 任意文件读取漏洞"
updated = "2026-06-16T21:53:32Z"

