[basic]
description = "osTicket 是一款开源技术支持工单系统。在 1.10.7 之前版本及 1.12.x 1.12.1 之前版本中，setup/install.php 存在存储型跨站脚本漏洞。由于应用程序的 firstname 和 lastname 字段未对用户输入进行任何过滤和转义，攻击者可在这些字段中插入恶意脚本代码并提交保存，当其他管理员或用户访问包含恶意数据的页面时，脚本将在受害者浏览器中执行，进而导致会话 Cookie 被盗取或其他恶意操作。"
published = "2019-08-07T17:15:12Z"
remediation = "tags.<value>升级 osTicket 至 1.10.7 或 1.12.1 及以上版本，以修复 setup/install.php 中对 firstname 和 lastname 字段输入过滤不足导致的存储型跨站脚本漏洞。若短期内无法完成版本升级，可在 Web 服务器层面对 setup/install.php 实施访问控制，仅允许可信 IP 访问安装页面，作为临时缓解措施降低攻击面。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Enhancesoft osTicket 跨站脚本漏洞"
updated = "2026-07-10T18:20:35Z"

