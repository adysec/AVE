[basic]
description = "WebKit 是 Apple iTunes 中使用的 Web 渲染引擎，CVE-2012-3606 存在于该引擎的内存处理过程中。远程攻击者可构造包含恶意代码的网页，当用户使用受影响版本的 iTunes 访问该网页时，触发 WebKit 内存损坏漏洞（CWE-119），导致应用程序崩溃或执行任意代码。该漏洞影响 Apple iTunes 10.7 之前的所有版本，攻击者无需身份认证即可在目标系统上执行任意指令或造成拒绝服务。CVSS 评分为 9.3，危害等级为高危。"
published = "2012-09-13T10:30:19.087"
remediation = "立即将 Apple iTunes 升级至 10.7 或更高版本，该版本修复了 WebKit 中的内存破坏问题。Mac 用户同时应将 Safari 升级至 6.0.1 或更高版本。如暂无法升级，应避免在 iTunes 内访问未知网站，并可通过防火墙限制 iTunes 的网络访问作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple iTunes WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:33.877"

