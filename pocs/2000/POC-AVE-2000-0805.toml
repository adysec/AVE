[info]
author = "ave"
description = "通过构造包含超长 HREF 属性的恶意 .asx 文件，验证 Windows Media Player 7.0 在处理该文件时是否存在缓冲区溢出漏洞"
id = "POC-AVE-2000-0805"
name = "Microsoft Windows Media Player 7.0 .ASX 缓冲区溢出漏洞 PoC"
severity = "high"
tags = ["ave-2000-0805"]
vuln_id = [
    "CVE-2000-1113",
    "AVE-2000-0805",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.asx"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["ASX"]
