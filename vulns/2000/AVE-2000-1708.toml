[basic]
description = "Global 3.55 及更早版本中自带的 global.cgi CGI 程序存在命令注入漏洞，远程攻击者可通过向该 CGI 程序发送包含 shell 元字符（如分号、管道符等）的特制 HTTP 请求，在目标 NetBSD 系统上以 Web 服务器权限执行任意系统命令。该漏洞无需身份认证即可远程利用，攻击复杂度低，可导致服务器完全被控制。受影响的系统包括运行 Global 3.55 及更早版本的 NetBSD 平台。"
published = "2000-12-19T05:00:00.000"
remediation = """立即将 Global 软件包升级至 4.0.1 或更高版本。在 NetBSD 系统上执行：`cd pkgsrc/devel/global && make clean && make install`。如无法立即升级，可编辑 `HTML/cgi-bin/global.cgi` 第 35 行，将 `$pattern =~ s/'//g;` 改为 `$pattern =~ s/"//g;` 作为临时缓解措施。"""
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "NetBSD Global CGI 远程代码执行漏洞"
updated = "2026-06-16T21:52:50.543"

