[info]
author = "ave"
description = "检测 Google Chrome 浏览器在处理浮点元素时是否存在 use-after-free 漏洞。通过向目标 Chrome 浏览器发送特制的网络数据包，触发 Chrome 浏览器进程崩溃或可能被利用执行任意代码。"
id = "POC-AVE-2011-0207"
name = "CVE-2011-3078 Google Chrome Use-After-Free PoC"
severity = "medium"
tags = ["ave-2011-0207"]
vuln_id = [
    "CVE-2011-3078",
    "AVE-2011-0207",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/media/flashes/{{RandomString}}"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["exception"]
