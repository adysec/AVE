[basic]
description = "CVE-2000-1204是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2000-10-13T04:00:00Z"
remediation = "升级 Apache HTTP Server 至 1.3.14 或更高版本，该版本已修复 mod_vhost_alias 模块的 CGI 源代码泄露问题。同时将 cgi-bin 目录移出 DocumentRoot 目录，避免其位于 Web 可访问的文档根目录下。若暂无法升级，可通过调整虚拟主机配置禁用 mod_vhost_alias 模块，或将 cgi-bin 路径重新映射至 Web 不可访问的目录作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Apache HTTP Server mod_vhost_alias 模块 信息泄露漏洞"
