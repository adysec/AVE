[basic]
description = "Bugzilla 2.14 之前版本未对 sanitycheck.cgi 脚本的访问进行权限限制，导致本地攻击者可通过大量发送请求至该脚本，消耗服务器 CPU 资源，造成拒绝服务。该漏洞影响 Bugzilla 2.14 之前所有版本，攻击者需拥有本地访问权限，利用门槛较低，危害等级低。"
published = "2001-09-10T04:00:00Z"
remediation = "升级 Bugzilla 至 2.14 或更高版本，该版本限制了对 sanitycheck.cgi 的访问权限。如无法升级，可在 Web 服务器层（如 Apache/Nginx）对 sanitycheck.cgi 路径添加 IP 白名单或认证机制，防止未授权用户频繁请求导致 CPU 资源耗尽。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Bugzilla sanitycheck.cgi 拒绝服务漏洞"
updated = "2026-06-16T21:56:12Z"

