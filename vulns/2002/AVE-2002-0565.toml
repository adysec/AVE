[basic]
description = 'Northern Solutions Xeneo Web Server 2.1.0.0、2.0.759.6 及 2.1.5 之前版本存在拒绝服务漏洞。远程攻击者无需身份认证即可通过向服务器发送包含 "%" 编码字符的恶意 GET 请求 URI，触发服务器解析异常导致进程崩溃，造成服务不可用。该漏洞攻击复杂度低，仅需网络可达即可利用，CVSS 评分 5.0，危害等级中等。'
published = "2002-11-12T05:00:00.000"
remediation = '将 Xeneo Web Server 升级至 2.1.5 或更高版本（官方建议直接升级至最新版 2.1.6.0，下载地址 http://www.northernsolutions.com/downloads/xeneo_php_setup.exe），以修复对含 "%" 字符的畸形 URI 请求处理不当导致的拒绝服务漏洞。如暂时无法升级，可在服务器前端部署过滤型代理，拦截包含 "%" 的异常 HTTP 请求作为临时缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Northern Solutions Xeneo Web Server 编码URL请求拒绝服务漏洞"
updated = "2026-06-16T21:59:00.037"

