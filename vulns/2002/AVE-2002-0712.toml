[basic]
description = "Dispair 0.1 和 0.2 版本的 Web 管理界面存在远程命令执行漏洞。由于程序未对用户提交的表单字段进行充分的输入验证和过滤，未经身份认证的远程攻击者可以在相关表单字段中注入任意 Shell 命令并执行，从而完全控制运行 Dispair 的目标服务器。该漏洞影响所有使用受影响版本部署 Dispair IRC 跳板服务的用户，CVSS 评分 10.0，危害等级为严重。攻击者无需任何凭据即可利用该漏洞，在网络可达的前提下直接获取目标系统的完整操作系统权限，造成机密性、完整性和可用性的全面损失。"
published = "2002-12-31T05:00:00Z"
remediation = "立即将 Dispair 升级至 0.3 版本，下载地址为 http://www.contactor.se/~dast/dispair/dispair.cgi?file=dispair-0.3.tar.gz&dir=&view=CHANGES，0.3 版本已修复表单字段中的命令注入漏洞。如暂时无法升级，应在 Web 服务器（如 Apache/Nginx）配置中对 dispair.cgi 脚本的访问进行限制，或临时下线该 CGI 脚本以阻止攻击者通过表单字段注入任意 Shell 命令。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Dispair 远程命令执行漏洞"
updated = "2026-06-16T22:00:12Z"

