[basic]
description = "Google Chrome 20.0.1132.43 之前版本的 CSS（层叠样式表）实现中存在一处释放后重用（Use-after-free）漏洞，具体位于对 :first-letter 伪元素的处理逻辑中。远程攻击者可通过构造特制的 CSS 内容诱导用户访问，触发已释放内存的非法访问，导致浏览器崩溃（拒绝服务），在特定条件下可能实现任意代码执行。该漏洞无需身份认证即可远程利用，影响所有使用 WebKit 引擎的 Google Chrome 旧版本，Apple Safari 等浏览器也受波及。Google 已于 2012 年 6 月 26 日发布的 Chrome 稳定版更新中修复此漏洞。"
published = "2012-06-27T10:18:39Z"
remediation = "升级 Google Chrome 至 20.0.1132.43 或更高版本，该版本修复了 CSS :first-letter 伪元素释放后重用漏洞。如无法立即升级，可禁用 JavaScript 或使用 NoScript 等扩展限制 CSS 伪元素渲染作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome CSS :first-letter 释放后重用漏洞"
updated = "2026-06-16T23:42:10Z"

