[basic]
description = "GRUB2 的 UDF 文件系统模块存在堆缓冲区溢出漏洞。当从磁盘读取数据时，该模块使用用户可控的数据长度元数据来分配内部缓冲区，在遍历磁盘扇区过程中错误地假设每次读取大小始终小于分配的缓冲区大小，但这一假设无法保证。攻击者可通过挂载特制的恶意文件系统镜像触发该漏洞，导致堆缓冲区溢出，造成关键数据损坏，进而实现任意代码执行，从而绕过 Secure Boot 安全启动保护机制。该漏洞影响所有使用受影响版本 GRUB2 的系统，攻击者需要物理访问或诱导用户重启系统加载恶意镜像，CVSS 评分 7.8，危害等级高。"
published = "2025-03-03T15:15:16Z"
remediation = "立即将 GRUB2 升级至包含 2025 年 2 月安全补丁的版本（>2.12），或安装各发行版提供的对应安全更新（如 Red Hat 相关补丁）。同时更新 shim 引导加载器至包含最新 SBAT 吊销数据的版本，使用 `mokutil --sbatpolicy` 应用吊销策略以防止旧版 GRUB2 被加载。如无法立即更新，可在 UEFI 固件设置中启用 Secure Boot 并确保 SBAT 策略生效作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "GNU GRUB2 UDF文件系统模块堆缓冲区溢出漏洞"
updated = "2026-06-30T00:16:50Z"

