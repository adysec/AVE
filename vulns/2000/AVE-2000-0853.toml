[basic]
description = "GCC 和 G++ 编译器 3.3.3 及更早版本中的 -ftrapv 编译选项未能正确处理所有类型的整数溢出情况，导致使用该选项编译的应用程序在运行时仍可能因整数溢出而存在安全漏洞。攻击者可利用此缺陷触发未定义行为，导致程序崩溃或潜在的信息泄露、权限提升。该漏洞影响范围广泛，涉及所有使用受影响 GCC/G++ 版本编译的应用程序，攻击条件低，无需身份认证即可远程利用。"
published = "2000-11-01T05:00:00.000"
remediation = "建议将 gcc 和 g++ 升级至 3.4.0 或更高版本，该版本已修复 libgcc2.c 中 __mulvsi3、__mulvdi3、__subvsi3、__subvdi3 及 __absvdi2 等整数溢出检测例程的错误实现，使 -ftrapv 选项能正确拦截有符号整数溢出。如短期内无法升级，请勿依赖 -ftrapv 作为整数溢出防护手段，改用编译器警告（-Woverflow）及代码层面的显式边界检查进行缓解。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "GNU GCC 编译器整数溢出漏洞"
updated = "2026-06-16T21:53:24.397"

