[info]
author = "AVE"
description = "检测 Adobe Flash Player 10.3.183.10 之前版本的安全控制绕过漏洞，攻击者可获取敏感信息"
id = "POC-AVE-2011-0105"
name = "CVE-2011-2429 PoC"
severity = "high"
tags = [
    "cve-2011-2429",
    "flash",
    "adobe",
]
vuln_id = [
    "CVE-2011-2429",
    "AVE-2011-0105",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/crossdomain.xml"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["cross-domain-policy"]
