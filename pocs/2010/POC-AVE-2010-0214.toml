[info]
author = "AVE"
description = "检测 Adobe Flash Player ActionIf 整数处理拒绝服务漏洞。通过检查 Flash Player 版本是否低于修复版本（9.0.289.0 或 10.1.102.64）来判断是否存在漏洞。该漏洞可导致拒绝服务或任意代码执行。"
id = "POC-AVE-2010-0214"
name = "CVE-2010-3639 PoC"
severity = "critical"
tags = ["cve-2010-3639"]
vuln_id = [
    "CVE-2010-3639",
    "AVE-2010-0214",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Adobe Flash Player"]
