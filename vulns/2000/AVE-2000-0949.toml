[basic]
description = "gnome-lokkit 防火墙软件包在版本 0.41 及更早版本中存在安全绕过漏洞。攻击者无需任何身份验证即可向目标系统发送特制的网络请求，绕过防火墙验证机制，从而访问那些原本不应开放的系统端口或服务。该漏洞的攻击难度较低，可通过简单的网络请求即可触发，可能导致部分机密信息泄露、系统完整性破坏以及服务可用性降低。漏洞影响典型场景包括未正确配置防火墙策略的用户主机，攻击者可利用此漏洞获取对目标系统的部分控制权限。本漏洞的 CVSS 评分高达 7.5，反映了其对网络安全构成的严重威胁。该漏洞已在后续的 gnome-lokkit 更新中得到了修复。"
published = "2000-10-20T04:00:00Z"
remediation = "升级 gnome-lokkit 到 0.41 或更高版本（如通过包管理器执行 `yum update gnome-lokkit` 或 `apt-get install gnome-lokkit=0.41*`）。若无法立即升级，请手动检查 iptables 规则确保未开放非预期端口，或临时使用 `iptables -P INPUT DROP` 设置默认拒绝策略并显式放行所需服务端口。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Gnome Lokkit 防火墙安全绕过漏洞"
updated = "2026-06-16T21:52:29Z"

