[basic]
description = "Oracle Secure Global Desktop 4.4 管理控制台中的 helpwindow.jsp 页面存在反射型跨站脚本漏洞。未经身份认证的远程攻击者可通过向 windowTitle 等参数注入恶意脚本代码，当管理员点击特制链接时，脚本将在浏览器中执行，导致敏感信息泄露或会话劫持。该漏洞影响 Oracle Secure Global Desktop 4.4 版本，CVSS 评分 6.1，危害等级中危。Oracle 已在后续 5.4 版本中修复此漏洞。"
published = "2018-12-13T19:29:00Z"
remediation = "升级 Oracle Secure Global Desktop 至 5.4 或更高版本，该漏洞已在 5.4 版本中修复。如无法立即升级，可在 Web 服务器或反向代理层面限制对 `/sgdadmin/faces/com_sun_web_ui/help/helpwindow.jsp` 路径的访问，仅允许受信任管理 IP 访问管理控制台，并对所有输入参数进行 HTML 编码输出以缓解 XSS 风险。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Oracle Secure Global Desktop 4.4 跨站脚本攻击漏洞"
updated = "2026-06-17T01:49:18Z"

