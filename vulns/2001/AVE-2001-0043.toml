[basic]
description = "Brian Stanback bslist.cgi 1.0 邮件列表脚本存在远程命令执行漏洞，该脚本在用户提交的 email 地址参数中未对 shell 元字符（如分号、管道符等）进行过滤，攻击者可在 email 字段中嵌入恶意命令，通过 CGI 接口直接调用系统 shell 执行任意操作系统命令。该漏洞影响 bslist.cgi 1.0 版本，攻击者无需任何身份认证即可远程利用，仅需构造包含特殊字符的 HTTP 请求即可获取服务器控制权限，CVSS 评分高达 10.0，危害等级为严重。"
published = "2001-02-12T05:00:00Z"
remediation = "由于 bslist.cgi 1.0 已停止维护且无官方补丁，建议立即从 Web 服务器中删除该脚本，并替换为现代邮件列表管理软件（如 Mailman 或 phpList）。如暂时无法替换，应在 Apache/Nginx 配置中禁用 CGI 执行权限或通过 .htaccess 禁止访问 bslist.cgi，同时部署 Web 应用防火墙过滤邮件地址字段中的分号、管道符等 shell 元字符，并将 Web 服务器运行用户权限降至最低以限制攻击影响范围。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Brian Stanback bslist.cgi 远程命令执行漏洞"
updated = "2026-06-16T21:53:39Z"

