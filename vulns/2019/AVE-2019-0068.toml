[basic]
description = "Lansweeper IT资产管理软件在7.1.117.4版本之前存在未授权SQL注入漏洞（CWE-89）。攻击者可通过向`/WidgetHandler.ashx?MethodName=Sort&ID=1`端点发送包含恶意SQL语句的特制HTTP GET请求，利用`row`和`column`参数在无需身份认证的情况下直接向后台数据库注入任意SQL查询，导致攻击者能够窃取敏感数据、获取数据库信息甚至完全控制整个Lansweeper系统。该漏洞影响所有部署了受影响版本Lansweeper的服务器，CVSS评分为9.1，危害等级严重。厂商已在后续版本中修复此漏洞，建议用户升级至7.1.117.4或更高版本以消除安全风险。"
published = "2019-08-12T17:15:11Z"
remediation = "立即升级 Lansweeper 至 7.1.117.4 或更高版本，该版本已修复未授权 SQL 注入漏洞。如无法立即升级，可在 WAF 或反向代理层配置规则，拦截对 `/WidgetHandler.ashx` 路径中 `row` 和 `column` 参数包含 SQL 语句的请求，并限制对 Lansweeper Web 控制台的网络访问范围。"
score = 9.1
severity = "CRITICAL"
sources = ["nuclei"]
title = "Lansweeper 未授权SQL注入漏洞"
updated = "2026-06-17T02:16:47Z"

