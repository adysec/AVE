[basic]
description = "Windows IP Helper 组件存在拒绝服务漏洞，该漏洞源于对特制网络数据包的处理不当，导致系统资源被过度消耗。未经身份认证的远程攻击者可通过向目标系统发送精心构造的恶意网络请求，触发 IP Helper 服务进入无限循环或资源耗尽状态，造成目标系统服务不可用。该漏洞影响多个 Windows 版本，包括 Windows 10、Windows 11 及 Windows Server 系列。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞，CVSS 评分 7.5，危害等级高。"
published = "2025-01-14T18:15:35Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新。Windows 10/11 用户通过 Windows Update 自动更新即可；Windows Server 用户需安装 KB5050061（Windows Server 2008 SP2）或对应版本的累积更新。各版本修复后的最低版本号：Windows 10 1507 ≥ 10.0.10240.20890、Windows 10 1607/Server 2016 ≥ 10.0.14393.7699、Windows 10 1809/Server 2019 ≥ 10.0.17763.6775、Windows 11 22H2 ≥ 10.0.22621.4751、Windows 11 23H2 ≥ 10.0.22631.4751、Windows 11 24H2/Server 2025 ≥ 10.0.26100.2894、Server 2022 ≥ 10.0.20348.3091。如无法立即打补丁，可在防火墙层面限制对 IP Helper 相关端口的访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows IP Helper 拒绝服务漏洞"
updated = "2026-06-17T08:42:50Z"

