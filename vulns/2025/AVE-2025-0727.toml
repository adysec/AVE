[basic]
description = "Windows MapUrlToZone 功能存在安全功能绕过漏洞，该函数负责将 URL 映射到对应的安全区域（Internet、本地 Intranet、受信任站点等）。攻击者可利用特制 URL 诱导用户点击，导致 MapUrlToZone 将恶意 URL 错误归类到权限更高的安全区域，从而绕过区域隔离策略，造成低度机密性泄露。攻击复杂度低，无需特权，但需要用户交互。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:46Z"
remediation = "安装 Microsoft 2025 年 1 月安全更新 (KB5050061)：Windows 10 1507 升级至 10.0.10240.20890 及以上，Windows 10 22H2 升级至 10.0.19045.5371 及以上，Windows 11 24H2 升级至 10.0.26100.2894 及以上，Windows Server 2022 升级至 10.0.20348.3091 及以上。可通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。临时缓解措施可配置 Internet Explorer 安全区域为高等级并限制从不受信任来源打开链接。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows MapUrlToZone 安全功能绕过漏洞"
updated = "2026-06-17T08:42:56Z"

