[basic]
description = "tags.<value>Jelsoft vBulletin 2.0.0 至 2.2.8 版本中的 global.php 文件存在跨站脚本（XSS）漏洞，远程攻击者可通过操纵 $scriptpath 或 $url 变量向网页注入恶意脚本或 HTML 代码。该漏洞影响基于 vBulletin 搭建的论坛系统，攻击者无需身份认证即可在用户浏览器端执行任意 JavaScript 代码，进而窃取会话 Cookie、劫持用户账户或进行钓鱼攻击。攻击者通常通过构造包含恶意脚本的 URL 链接并诱骗用户点击来实施攻击，利用门槛较低且影响范围广泛。建议管理员及时升级至 vBulletin 最新版本以消除安全隐患。"
published = "2002-12-31T05:00:00Z"
remediation = "立即升级 vBulletin 至 2.3.0 或更高版本以修复 global.php 中 $scriptpath 和 $url 变量的跨站脚本漏洞。若暂无法升级，应在 Web 服务器中部署 WAF 规则过滤 URL 参数中的尖括号与脚本标签，或手动编辑 global.php 对 $scriptpath 与 $url 变量调用 htmlspecialchars() 或 strip_tags() 进行输出编码，同时启用内容安全策略（CSP）头限制内联脚本执行。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Jelsoft vBulletin 2.0/2.2.x global.php 跨站脚本漏洞"
updated = "2026-06-16T22:00:18Z"

