[basic]
description = "Linux内核NFC NCI（NFC控制器接口）子系统中存在越界写入漏洞（CWE-787）。nci_hci_create_pipe()函数中的pipe变量为来自网络的u8类型，当其值超过127时，调用方nci_hci_connect_gate()将发生内存损坏。攻击者可通过发送携带非法pipe值（大于127）的特制NFC数据包，在无需身份认证的条件下触发该漏洞，导致内存破坏、权限提升或系统崩溃。该漏洞影响存在缺陷代码的Linux内核版本，CVSS评分为8.8（高危），攻击条件为物理接近目标设备（NFC通信范围）。Linux发行版已发布补丁，通过在nci_hci_create_pipe()中添加边界检查来修复此问题。"
published = "2025-02-27T03:15:14.130"
remediation = "建议立即升级 Linux 内核至以下修复版本之一：5.4.291、5.10.235、5.15.179、6.1.129、6.6.78、6.12.14、6.13.3 或 6.14 及以上版本。该漏洞位于 net/nfc/nci/hci.c 的 nci_hci_create_pipe() 函数中，缺乏对网络传入 pipe 变量（u8）的边界检查，导致越界写内存损坏。若无法立即升级内核，可通过禁用 NFC 子系统作为临时缓解措施：执行 `modprobe -r nci` 卸载 NCI 模块，或在内核启动参数添加 `module_blacklist=nci` 禁止加载；亦可通过防火墙层面限制 NFC 相关的 HCI 通信端口（通常为 2042/TCP 及 2043/TCP）以阻断攻击路径。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 NFC NCI 越界写入漏洞"
updated = "2026-07-30T06:21:21.823"

