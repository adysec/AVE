[basic]
description = "技嘉（GIGABYTE）多款产品中的 GDrv 底层驱动程序（gdrv.sys）存在权限访问控制缺陷。该驱动暴露了 ring0 级别的 memcpy 类似功能，允许具有低权限的本地攻击者通过 DeviceIoControl 调用 IOCTL 0xC3502808 向内核内存任意写入数据，进而覆盖 HalDispatchTable 指针劫持执行流，注入令牌窃取 shellcode 实现权限提升至 SYSTEM。该漏洞影响 GIGABYTE APP Center v1.05.21 及更早版本、AORUS GRAPHICS ENGINE 1.57 之前版本、XTREME GAMING ENGINE 1.26 之前版本及 OC GURU II v2.08。攻击者只需本地低权限账户即可完成利用，无需用户交互，CVSS 评分 7.8，危害等级高。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），存在在野利用。"
published = "2018-12-21T23:29:00Z"
remediation = "立即将 GIGABYTE APP Center 升级至 19.0422.1 或更高版本，AORUS GRAPHICS ENGINE 升级至 1.57 或更高版本，XTREME GAMING ENGINE 升级至 1.26 或更高版本，卸载 OC GURU II v2.08。如无法更新，建议禁用 GDrv 驱动加载或移除相关设备的驱动程序权限作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "技嘉 APP Center / AORUS GRAPHICS ENGINE / XTREME GAMING ENGINE / OC GURU II 驱动程序本地权限提升漏洞"
updated = "2026-06-17T01:49:06Z"

