[basic]
description = "Linux 内核 ATM（异步传输模式）子系统中的 MPOA_cache_impos_rcvd() 函数存在空指针解引用漏洞。当该函数接收特定消息时，若 entry 和 holding_time 参数同时为 NULL，现有代码未对此场景进行校验，导致 NULL 指针被传入 eg_cache_put() 函数并在内部被解引用，从而触发内核崩溃。该漏洞影响 Linux 内核的 ATM 子系统，攻击者需具备本地访问权限且拥有低权限账户即可触发，无需任何用户交互，最终导致目标系统拒绝服务。上游已在新版本内核中修复该问题。"
published = "2025-04-16T05:15:31Z"
remediation = "建议将 Linux 内核升级至修复版本：5.4.292、5.10.236、5.15.180、6.1.133、6.6.86、6.12.22、6.13.10 或 6.14.1 及以上版本。对于 Debian 11 系统可执行 apt update && apt install linux-image-$(uname -r) 安装 DLA-4178-1 安全更新；SUSE 系统应执行 zypper patch 应用 SUSE-SU-2025:01964-1；Ubuntu 25.04 系统应执行 apt upgrade linux-image 应用 USN-7594-1。如暂无法升级，可通过 echo 0 > /proc/sys/net/atm/mpoad_enable 或内核启动参数 atm.nopol=1 禁用 ATM MPOA 协议作为临时缓解措施，避免触发空指针解引用导致内核崩溃。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 ATM 子系统 NULL 指针解引用漏洞"
updated = "2026-06-17T08:44:51Z"

