[basic]
description = "Tiny Personal Firewall 1.0 及 2.0 版本（即 ZoneAlarm Pro 1.0/2.x）存在出站数据包绕过漏洞。本地用户可通过非 Windows 协议适配器构造非标准 TCP 数据包，从而绕过防火墙的出站过滤规则，导致受保护的计算机在用户未授权的情况下向外发送数据。该漏洞攻击条件要求攻击者具有本地系统访问权限，利用难度低，仅影响系统完整性，不涉及机密性和可用性。CVSS 评分 2.1，危害等级低。"
published = "2001-12-31T05:00:00Z"
remediation = "该漏洞为 2001 年披露的旧版个人防火墙设计缺陷，Tiny Personal Firewall 1.0/2.0 及 ZoneAlarm Pro 1.0/2.x 均已停止维护，厂商不再提供安全更新。建议立即卸载上述过期版本，升级至 ZoneAlarm 最新版本（当前为 ZoneAlarm Extreme Security）或改用 Windows 内置防火墙（Windows Defender Firewall），并启用出站规则默认阻止模式。同时限制本地管理员权限，仅授予可信用户，防止非标准协议适配器被用于构造绕过数据包。"
score = 2.1
severity = "LOW"
sources = ["exploitdb"]
title = "ZoneAlarm Tiny Personal Firewall 本地过滤绕过漏洞"
updated = "2026-06-16T21:56:29Z"

