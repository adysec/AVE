[info]
author = "ave"
description = "验证简体中文版 Windows 2000 IME 权限提升漏洞，本地用户通过触发 IME 状态识别机制绕过安全限制获取特权"
id = "POC-AVE-2000-1019"
name = "CVE-2000-0933 PoC"
severity = "medium"
tags = ["ave-2000-1019"]
vuln_id = [
    "CVE-2000-0933",
    "AVE-2000-1019",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
