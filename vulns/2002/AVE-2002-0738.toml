[basic]
description = "Icecast 1.3.12 版本的 list_directory 函数存在目录遍历信息泄露漏洞。远程攻击者可在 GET 请求中注入 .. 路径遍历字符来探测服务器文件系统，若目标目录存在则返回正常响应，若不存在则返回不同错误信息，通过差异比较可推断服务器上任意目录是否存在。该漏洞无需身份认证即可利用，影响所有开启目录列表功能的 Icecast 1.3.12 实例，可导致敏感文件路径与服务器目录结构泄露，CVSS 评分 5.0，危害等级中等。建议升级至 Icecast 后续修复版本并关闭不必要的目录浏览功能。"
published = "2002-12-31T05:00:00Z"
remediation = '升级 Icecast 服务器到 1.3.13 或更高版本，该版本修复了 list_directory 函数中未正确过滤目录遍历字符（..）的漏洞。如暂无法立即升级，可在 icecast.xml 配置文件中通过 `<directory>` 配置项禁用目录列表功能，并在前端反向代理（如 Nginx 或 Apache）中添加安全规则，拦截包含 ".." 及 URL 编码遍历字符的 HTTP 请求路径作为临时缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Xiph.org Icecast 目录遍历信息泄露漏洞"
updated = "2026-06-16T22:00:25Z"

