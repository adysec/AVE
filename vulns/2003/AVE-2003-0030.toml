[basic]
description = "tcpdump 3.6.2 及更早版本中的 RADIUS 协议解析器存在拒绝服务漏洞。远程攻击者可向目标系统发送特制的 RADIUS 数据包，将报文头长度字段设置为 0，触发解析器进入无限循环，导致 tcpdump 进程崩溃。该漏洞无需身份认证即可远程利用，影响 LBL tcpdump 3.4 至 3.6.2 版本，CVSS 评分 5.0，危害等级中危。建议升级至 tcpdump 3.7 及以上版本修复此漏洞。"
published = "2003-03-03T05:00:00Z"
remediation = "升级 tcpdump 至 3.7 及以上版本。各发行版用户：Debian 安装 dsa-261 更新，Red Hat 安装 RHSA-2003:032/033/214 更新，Mandrake 安装 MDKSA-2003:027 更新。如无法升级，可在网络边界过滤来自 RADIUS 端口（1812/1813/UDP 1645/1646）的可疑报文作为临时缓解。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "LBL tcpdump RADIUS 解析器无限循环拒绝服务漏洞"
updated = "2026-06-16T22:01:30Z"

