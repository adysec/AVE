[basic]
description = "` tags.<value>Electron 框架在处理自定义协议处理器返回的 ProtocolResponse 时存在资源隔离绕过漏洞。当自定义协议处理器返回包含 url 但未指定 session 的 ProtocolResponse 时，Electron 会通过默认会话（defaultSession）发起上游请求，而非使用处理该协议的会话。这导致原本应隔离的会话分区之间可能重用缓存响应，从而绕过会话隔离机制。使用 ProtocolResponse.url 但省略 ProtocolResponse.session、且依赖独立会话隔离内容的应用程序受影响，而显式设置 session 或不依赖跨会话隔离内容的应用程序不受影响。攻击者可通过控制响应缓存内容，在隔离的会话分区之间实现信息泄露或跨会话数据污染。该漏洞影响 Electron 40.x 至 42.x 版本，已在 40.10.6、41.9.1、42.5.1 和 43.0.0 版本中得到修复。"
published = "2026-08-05T16:17:04Z"
remediation = "建议将 Electron 升级至 40.10.6、41.9.1、42.5.1 或 43.0.0 等已修复版本。对于使用 ProtocolResponse.url 的应用，须在代码中显式设置 ProtocolResponse.session 字段，使上游请求通过对应会话的缓存而非默认会话。如无法立即升级，可修改应用代码为每个 ProtocolResponse 指定 session，以临时隔离不同会话间的缓存响应。"
score = 5.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "Electron 框架会话隔离绕过信息泄露漏洞"
updated = "2026-08-05T18:17:15Z"

