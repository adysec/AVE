[basic]
description = "佳能 imageCLASS MF654Cdw 等多款小型办公多功能打印机的通讯录属性标签处理功能中存在基于栈的缓冲区溢出漏洞。该漏洞源于程序在处理特制的 Address Book 属性标签数据时未正确验证输入长度，导致栈缓冲区溢出。在 Pwn2Own 大赛中已证实，网络相邻的未经认证攻击者可通过向受影响打印机发送特制数据包触发该漏洞，成功利用可在目标设备上以设备权限执行任意代码。该漏洞影响佳能多款打印机系列，包括 Satera LBP670C、Satera MF750C、Color imageCLASS LBP630C/MF650C 等型号的 v06.02 及更早版本固件，CVSS 评分 9.3，危害等级严重。"
published = "2026-01-16T00:16:28Z"
remediation = "立即将受影响设备（Canon imageCLASS MF654Cdw 及 Satera LBP670C/MF750C、Color imageCLASS LBP630C/MF650C 系列、i-SENSYS LBP630C/MF650C 系列等）固件升级至 v06.02 之后的最新版本。请访问 Canon 官方支持网站（https://www.canon-europe.com/support/product-security/）下载对应型号的最新固件。如无法立即升级，可在网络层面限制打印机仅接受受信任管理主机的访问，并在防火墙中隔离打印机子网，禁止非授权设备直接通信。"
score = 9.3
severity = "CRITICAL"
sources = ["zdi"]
title = "Canon imageCLASS MF654Cdw 打印机地址簿属性标签处理栈缓冲区溢出远程代码执行漏洞"
updated = "2026-06-17T08:35:35Z"

