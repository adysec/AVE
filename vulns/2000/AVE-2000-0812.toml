[basic]
description = 'IBM AIX 4.3.x 及更早版本中的 setsenv 命令存在缓冲区溢出漏洞。本地攻击者可通过向 setsenv 命令传入过长的"x="参数触发堆栈缓冲区溢出，从而在受影响系统上执行任意命令。该漏洞影响 AIX 4.x 系列操作系统，攻击者需要具备本地登录权限或本地 shell 访问权限才能利用此漏洞。成功利用后，攻击者可在系统上下文中执行任意代码，可能导致敏感数据泄露、权限提升或系统被进一步控制，CVSS 评分为 4.6。'
published = "2001-01-09T05:00:00Z"
remediation = "安装 IBM 官方 APAR 补丁 IY08812（AIX 4.3.x）或 IY10721（AIX 4.2.x），或升级至 AIX 4.3.3 及更高版本。临时缓解措施可执行命令 `chmod u-s /usr/bin/setsenv` 移除该程序的 setuid 位，限制普通用户执行权限，并定期审查系统 setuid/setgid 程序列表。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "IBM AIX setsenv 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:53:11Z"

