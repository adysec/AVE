[basic]
description = "Apple Safari 浏览器使用的 WebKit 引擎存在内存破坏漏洞，远程攻击者可通过构造恶意网页触发该漏洞，导致任意代码执行或拒绝服务（内存损坏与应用崩溃）。该漏洞影响 Safari 6.0 之前的版本，CVSS 评分 9.3，危害等级严重。攻击条件为受害者访问包含特制内容的网页即可触发，无需身份认证。漏洞涉及对 TIFF、PNG、JPEG 图像及 ImageIO 组件的处理缺陷。Apple 已在 Safari 6.0 中修复此问题。"
published = "2012-07-25T20:55:04.133"
remediation = "tags.<value>立即将Apple Safari升级至6.0及以上版本，或将iOS升级至iOS 6。Apple已发布安全更新修复WebKit内存破坏漏洞，升级后可阻止远程攻击者通过恶意网站执行任意代码或造成拒绝服务。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit内存破坏漏洞"
updated = "2026-06-16T23:43:41.090"

