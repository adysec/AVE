[basic]
description = "Red Hat Linux 5.2 系统中的 Glint 工具存在符号链接（symlink）攻击漏洞。本地攻击者可通过在临时目录中创建恶意符号链接，诱使 Glint 以特权身份写入攻击者指定的任意文件，导致系统文件被覆盖破坏，进而引发拒绝服务或权限提升。该漏洞利用条件为拥有本地普通用户权限，无需用户交互，CVSS 评分 7.2，危害等级高。"
published = "2000-12-19T05:00:00.000"
remediation = "立即安装 Red Hat 发布的 RHSA-2000-062 安全更新，升级 glint 程序包至修复版本。如无法立即更新，可移除 glint 的 setuid 位（chmod u-s /usr/bin/glint）以阻止本地用户通过符号链接攻击覆盖任意文件，同时限制不可信用户的本地登录权限作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Red Hat Linux Glint 符号链接攻击任意文件写入漏洞"
updated = "2026-06-16T21:52:48.080"

