[basic]
description = "Atlassian Jira 的 ManageFilters.jspa 资源由于权限检查机制不完善，导致身份验证不足。远程攻击者无需进行身份验证，即可通过向该接口发送特制请求，利用权限校验漏洞枚举系统内的合法用户名。该漏洞影响 Jira 7.13.3 之前版本以及 8.0.0 至 8.1.1 之间的版本。攻击者可通过此方式获取用户列表，为后续的社会工程学攻击或账户暴力破解提供关键信息，从而威胁系统安全性。"
published = "2019-05-22T18:29:00.740"
remediation = "将 Atlassian Jira Server/Data Center 升级至 7.13.3 或 8.1.1 及更高版本：若当前运行 7.x 分支，请升级至 7.13.3；若运行 8.0.x/8.1.0，请升级至 8.1.1。如暂时无法升级，可在反向代理或防火墙层面限制对 /secure/ManageFilters.jspa 路径的匿名外部访问作为临时缓解措施。升级前请在测试环境中验证兼容性，并参考 Atlassian 官方安全公告 JRASERVER-69244 获取详细说明。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "Atlassian Jira 信息泄露漏洞"
updated = "2026-06-17T02:35:06.270"

