[basic]
description = 'Big Brother System and Network Monitor 1.5c2 版本之前的 bbd server 存在远程代码执行漏洞。该漏洞源于服务器在处理用户输入时未能正确过滤 shell 元字符 "&"，攻击者可通过在网络请求中注入该元字符使服务器执行任意的系统命令。漏洞利用无需身份验证，仅需通过网络访问存在缺陷的 bbd 服务即可，攻击者可借此实现远程命令执行，进而控制目标主机系统、窃取敏感数据或继续横向渗透。CVSS 向量为 AV:N/AC:L/Au:N/C:P/I:P/A:P，评分为 7.5，危害等级为高。'
published = "2000-12-19T05:00:00Z"
remediation = "升级 Big Brother System and Network Monitor 至 1.5c2 或更高版本，修复 bbd 服务器的命令注入漏洞。升级前请备份当前配置文件。升级完成后重启 bbd 服务并验证补丁生效。如无法立即升级，可通过防火墙限制对 bbd 服务器默认端口 1999 的远程访问，仅允许受信任主机连接。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "BossenBrood 大学网络监控 远程命令执行漏洞"
updated = "2026-06-16T21:52:53Z"

