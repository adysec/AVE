[basic]
description = "GIMP 的 JP2（JPEG 2000）文件解析器存在堆溢出漏洞。该漏洞源于程序在处理特制 JP2 文件时，未对用户提供数据的长度进行充分校验就将其复制到堆缓冲区中，导致缓冲区溢出。攻击者可构造恶意 JP2 文件，当目标用户使用 GIMP 打开该文件或通过浏览器访问包含恶意内容的网页时，即可在 GIMP 进程的上下文中执行任意代码，完全控制受影响系统。此漏洞影响 GIMP 的多个版本，CVSS v3.1 评分为 7.8（高危），攻击向量为本地，需要用户交互才能触发利用。"
published = "2026-04-11T01:16:16Z"
remediation = "建议立即将 GIMP 升级至 3.2.4 或更高版本，该版本已修复 JP2 文件解析中的堆缓冲区溢出漏洞（CVE-2026-4152）。如暂时无法升级，应避免打开来自不受信任来源的 JP2（JPEG 2000）文件，可在沙箱环境或容器中运行 GIMP 以限制利用影响，同时在邮件网关和文件下载处过滤恶意 JP2 文件。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "GIMP JP2文件解析堆溢出远程代码执行漏洞"
updated = "2026-07-15T02:22:38Z"

