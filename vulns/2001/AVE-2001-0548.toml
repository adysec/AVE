[basic]
description = "PostNuke 0.62至0.64版本的article.php文件中存在SQL注入漏洞，远程攻击者可通过向user参数注入恶意SQL语句绕过身份认证机制，未经授权即可登录系统后台。该漏洞影响PostNuke 0.62、0.63及0.64版本，攻击者无需任何前置认证条件，仅需构造特制的HTTP请求即可利用，CVSS评分7.5，危害等级高。目前官方已发布修复版本，建议用户升级至最新版。"
published = "2001-10-13T04:00:00Z"
remediation = "升级 PostNuke 至 0.65 或更高版本（该版本修复了 article.php 中 user 参数未过滤导致的 SQL 注入漏洞）。由于 PostNuke 项目已停止维护，建议迁移至受支持的 CMS 系统（如 WordPress 或 Drupal）。临时缓解措施：在 Web 服务器层面（如 .htaccess 或 Nginx 规则）拦截包含 article.php?save=1 且 user 参数含单引号或 base64 编码特征的请求。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "PostNuke 0.62-0.64 article.php SQL注入漏洞"
updated = "2026-06-16T21:56:19Z"

