[basic]
description = "IPSwitch IMail 的 Web Messaging 守护进程存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向目标发送超长的 HTTP GET 请求（HTTP/1.0）触发该漏洞，导致任意代码执行。该漏洞影响 IPSwitch IMail 7.12 之前的所有版本（包括 6.x、7.0、7.1 等），CVSS 评分 7.5，危害等级高。"
published = "2002-10-04T04:00:00Z"
remediation = "立即升级 IPSwitch IMail 至 7.12 或更高版本，该版本已修复 Web Messaging 守护进程中的缓冲区溢出漏洞。如无法立即升级，可在防火墙或反向代理层面限制对 Web Messaging 服务端口（通常为 8383）的访问，仅允许可信 IP 连接，并监控异常长度的 HTTP GET 请求。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "IPSwitch IMail Web Messaging 缓冲区溢出漏洞"
updated = "2026-06-16T21:58:40Z"

