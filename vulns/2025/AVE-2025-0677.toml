[basic]
description = "Windows Kerberos 存在拒绝服务漏洞，未经身份认证的远程攻击者可向目标系统的 Kerberos 服务发送特制请求，触发资源消耗（CWE-400），导致服务不可用。该漏洞影响多个 Windows 版本，CVSS 评分 7.5，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:33Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新（KB5050004），通过 Windows Update 或 Microsoft Update Catalog 获取。受影响版本包括 Windows Server 2012/2012 R2/2016/2019/2022/2025，更新后各版本对应内核版本号分别为 6.2.9200.25273、6.3.9600.22371、10.0.14393.7699、10.0.17763.6775、10.0.20348.3091、10.0.26100.2894。如无法立即打补丁，可在防火墙或网络层面限制对 Kerberos 服务（TCP/UDP 88）的未授权网络访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Kerberos 拒绝服务漏洞"
updated = "2026-06-17T08:42:48Z"

