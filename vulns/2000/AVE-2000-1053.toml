[basic]
description = "Ultraseek（原名 Inktomi Search）3.1 及 3.1.10 版本搜索引擎存在拒绝服务漏洞。远程攻击者无需身份认证，通过向目标服务器发送特制的畸形 URL 请求，可导致搜索引擎服务崩溃或停止响应，造成正常用户无法访问搜索功能。该漏洞利用方式简单，攻击成本低，影响运行上述版本的所有搜索服务实例。"
published = "2000-12-11T05:00:00.000"
remediation = "升级 Ultraseek/Inktomi Search 至 4.0.0 或更高版本。Solaris 用户可从 ftp://ftp.ultraseek.com/pub/InktomiSearch/4.0.0/ 下载对应 tar 包；Windows NT 用户下载 InktomiSearch-winnt-4.0.0.exe 安装；Linux 用户下载 RPM 或 tar.gz 包升级。如无法升级，可在防火墙或主机层面限制对默认端口 8765 的访问，仅允许可信 IP 连接。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Inktomi Ultraseek 3.1/3.1.10 搜索软件畸形URL拒绝服务漏洞"
updated = "2026-06-16T21:52:59.020"

