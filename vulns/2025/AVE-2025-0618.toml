[basic]
description = "PHP 流式 HTTP 包装器在处理用户提供的 HTTP 标头时，对行尾字符的验证存在不足。当应用程序通过 PHP 的流式 HTTP 包装器发送包含用户可控内容的 HTTP 标头时，攻击者可通过注入特殊构造的行尾字符，导致部分标头（如 Basic Authentication 授权标头）被省略或错误解析。该漏洞影响 PHP 8.1.32 之前、8.2.28 之前、8.3.19 之前及 8.4.5 之前的所有版本。成功利用该漏洞可能导致身份验证绕过，使攻击者无需凭据即可访问受保护的资源。CVSS 评分 6.3，危害等级中等。"
published = "2025-03-30T06:15:14Z"
remediation = "立即将 PHP 升级至以下修复版本：PHP 8.1.x 升级到 8.1.32 及以上，PHP 8.2.x 升级到 8.2.28 及以上，PHP 8.3.x 升级到 8.3.19 及以上，PHP 8.4.x 升级到 8.4.5 及以上。若无法立即升级，可通过禁用 PHP 配置中不必要的 stream HTTP wrapper（如 php.ini 中设置 allow_url_fopen=Off）作为临时缓解措施，并检查所有传入 HTTP 请求头中的换行符（CRLF），过滤或拒绝包含异常换行序列的请求头。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "PHP Stream HTTP Wrapper 标头验证不足导致基本认证头遗漏漏洞"
updated = "2026-06-17T08:39:41Z"

