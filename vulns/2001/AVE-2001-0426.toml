[basic]
description = "SpeechD 0.54 及更早版本在与 Festival 或 rsynth 语音合成包配合使用时，存在 shell 元字符注入漏洞。本地攻击者可通过向 SpeechD 进程传递包含特殊 shell 元字符的恶意参数触发该漏洞，导致以 SpeechD 进程权限执行任意命令。该漏洞影响 SpeechD 0.54 及之前所有版本，CVSS 评分 7.2，危害等级高。攻击者需具备本地系统访问权限，利用复杂度低，成功利用后可完全控制受影响的 SpeechD 服务。"
published = "2001-09-11T04:00:00Z"
remediation = "升级 SpeechD 至 0.54 以上版本（若厂商已停止维护则建议彻底移除 speechd 软件包）。如无法升级，可采取以下缓解措施：1) 移除 /dev/speech 设备的 setuid 权限，避免以 root 身份运行；2) 严格限制对 /dev/speech 设备的访问权限，仅允许受信任用户访问；3) 在 speechd 配置中禁用 shell 元字符传递功能，对输入进行严格过滤。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "SpeechD 任意命令执行漏洞"
updated = "2026-06-16T21:55:18Z"

