[basic]
description = "TelCondex SimpleWebServer 2.06.20817 存在输入验证缺陷，其 HTTP 请求处理模块未对客户端提交的 GET 请求长度进行有效限制。当远程攻击者向服务器发送超长 HTTP GET 请求时，服务器无法正确处理该异常输入，导致程序崩溃或服务中断。该漏洞影响运行 Windows 平台的 TelCondex SimpleWebServer 2.0.6 版本，攻击者无需身份认证即可在网络上远程发起攻击，利用方式为向目标服务器发送包含大量冗余字符的特制 HTTP GET 请求，造成拒绝服务，需要手动重启服务才能恢复。"
published = "2002-12-31T05:00:00Z"
remediation = "由于 TelCondex SimpleWebServer 2.06.20817 已停止维护多年，官方未发布补丁。建议立即迁移至受支持的 Web 服务器（如 Nginx、Apache 或 IIS）。如暂时无法替换，可在服务器前部署反向代理或防火墙规则限制 HTTP GET 请求长度，例如在 Apache 层设置 `LimitRequestFieldSize` 参数或在 Nginx 层设置 `client_header_buffer_size` 与 `large_client_header_buffers` 过滤超长请求，并在防火墙层面阻断异常长度的入站 HTTP 请求作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "TelCondex SimpleWebServer 长HTTP GET请求拒绝服务漏洞"
updated = "2026-06-16T22:00:16Z"

