[basic]
description = "Linux内核2.2.x至2.2.19及2.4.x至2.4.9版本中存在ptrace权限提升漏洞。本地攻击者可通过在setuid/setgid程序（如newgrp）上调用ptrace，利用其调用非特权程序时的权限提升机制，劫持控制流获取root权限。该漏洞影响Linux内核2.2和2.4早期版本，CVSS评分7.2（高危），攻击向量为本地，低攻击复杂度，无需认证即可完全控制系统机密性、完整性和可用性。攻击者需具备本地账户权限，通过ptrace附加到setuid程序，在其执行非特权子进程时实现提权。"
published = "2001-10-18T04:00:00Z"
remediation = "建议立即升级 Linux 内核至 2.2.20 或 2.4.10 及以上版本（如 Red Hat 7.1 更新内核至 kernel-2.4.9-31 或更高版本）。若无法立即升级内核，可通过设置内核参数 kernel.yama.ptrace_scope=1 限制 ptrace 权限，或移除非必要的 setuid/setgid 程序权限位作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Linux Kernel Ptrace/Setuid Exec 权限提升漏洞"
updated = "2026-06-16T21:56:09Z"

