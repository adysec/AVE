[basic]
description = "Malwarebytes Anti-Malware 的 Malwarebytes 服务存在不受控搜索路径元素漏洞，由于服务会从非安全位置加载文件，导致本地攻击者可在已获取低权限代码执行能力的前提下，通过特制文件劫持搜索路径并提升权限，最终在 SYSTEM 上下文中执行任意代码。该漏洞影响 Malwarebytes Anti-Malware 的受影响安装版本，攻击者无需用户交互即可完成利用，可造成完全的系统权限提升与机密性、完整性及可用性损失。官方已在 1.0.6.31 版本中修复该漏洞。"
published = ""
