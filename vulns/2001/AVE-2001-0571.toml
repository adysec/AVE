[basic]
description = 'tags.<value>Microsoft IIS 4.0 和 5.0 存在文件片段读取漏洞，未经身份认证的远程攻击者可通过在目标 URL 后追加 "%3F+.htr" 字符串，将可执行 Web 服务器程序文件交由 .HTR ISAPI 扩展进行解析，从而读取文件的源代码内容。该漏洞影响运行 IIS 4.0 和 5.0 的 Windows NT/2000 服务器，攻击者无需任何凭据即可在网络上远程发起利用。成功利用后，攻击者可获取 ASP 等脚本文件的源代码，导致敏感信息泄漏，包括数据库连接字符串、业务逻辑代码等机密数据外泄。Microsoft 已在后续安全更新中修复此漏洞。'
published = "2001-02-12T05:00:00Z"
remediation = '安装 Microsoft 安全补丁 KB285985（IIS 4.0 适用 Windows NT 4.0 SP5/6a，IIS 5.0 适用 Windows 2000 Gold/SP1/SP2），或升级系统至 Windows 2000 SP3 / Windows NT 4.0 SP7；首选缓解措施为禁用 .HTR 映射：打开 Internet Services Manager，右键 Web 服务器→属性→主属性→WWW 服务→编辑→主目录→配置，在应用程序映射中移除 .HTR 条目并确认。临时无法打补丁时，建议在 IIS 中删除 %systemroot%\system32\inetsrv\iisadmpwd 等默认 .HTR 脚本目录。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft IIS 文件片段泄漏漏洞"
updated = "2026-06-16T21:53:28Z"

