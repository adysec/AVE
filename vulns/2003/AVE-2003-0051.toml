[basic]
description = "MySQL 3.23.55 及更早版本存在权限提升漏洞。由于 mysqld 进程以 root 权限启动后创建的文件权限为全局可写（world-writeable），已拥有 MySQL 数据库访问权限的攻击者可利用 SELECT INTO OUTFILE 语句将恶意配置写入 my.cnf 等 MySQL 配置文件，诱使 MySQL 在重启后以 root 身份执行任意代码，从而获得系统 root 权限。该漏洞攻击复杂度低，无需认证即可通过网络触发，影响所有 MySQL 3.23.55 及之前版本。"
published = "2003-03-24T05:00:00Z"
remediation = "立即升级 MySQL 至 3.23.56 或更高版本。Red Hat 用户应安装 RHSA-2003:093/RHSA-2003:094 提供的更新包；Debian 用户应用 DSA-303 安全更新；Mandriva 用户安装 MDKSA-2003:057 更新。临时缓解措施：确保 MySQL 数据目录权限为 750 且属主为 mysql 用户，禁止 mysql 用户对 my.cnf 等配置文件具有写权限，并在 my.cnf 中设置 `secure_file_priv` 限制 SELECT INTO OUTFILE 的导出目录。"
score = 9
severity = "CRITICAL"
sources = ["redhat"]
title = "MySQL mysqld 本地权限提升漏洞"
updated = "2026-06-16T22:01:39Z"

