[info]
author = "ave"
description = "检测 Microsoft Internet Explorer 5.5/6.0 跨域安全模型绕过漏洞，通过缓存对象绕过浏览器跨域限制访问本地系统"
id = "POC-AVE-2002-0567"
name = "CVE-2002-1254 PoC"
