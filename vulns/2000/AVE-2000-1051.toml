[basic]
description = "Webteachers Webdata 存在任意文件读取漏洞。具有有效 Webdata 账户的远程攻击者可通过向系统发送特制的导入请求，将服务器上的任意文件导入 WebData 数据库中，从而读取目标文件内容。该漏洞影响 Webteachers Webdata 所有受影响版本，攻击者无需身份认证即可利用，CVSS 评分 5.0，危害等级中等。攻击条件要求攻击者拥有有效账户，但利用难度较低，可导致敏感信息泄露。"
published = "2000-12-11T05:00:00Z"
remediation = "Webteachers 已针对此漏洞发布补丁，建议立即升级到最新版本。如无法升级，可在 Web 服务器（如 Apache/IIS）配置中限制对 Webdata 数据库导入功能的访问，仅允许受信任 IP 访问，并移除所有非必要账户的 Webdata 数据库导入权限。由于该产品已停止维护，强烈建议迁移至其他受支持的 Web 内容管理方案。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Webteachers Webdata 任意文件读取漏洞"
updated = "2026-06-16T21:52:58Z"

