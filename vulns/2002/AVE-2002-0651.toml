[basic]
description = "Monkey HTTP Daemon 的 method.c 文件中 Post_Method 函数存在输入验证不当漏洞。当远程攻击者向目标服务器发送包含无效或缺失 Content-Length 头部的 POST 请求时，该函数无法正确处理此类异常输入，导致 HTTP 守护进程崩溃，从而引发拒绝服务攻击。该漏洞影响 Monkey HTTP Daemon 0.5.0 及更早版本，攻击者无需任何身份认证即可远程触发，CVSS 评分为 5.0，危害等级为中危。漏洞本质属于 CWE-20 类型（不当输入验证），攻击者仅需构造恶意 POST 报文即可破坏服务可用性，但不会造成数据泄露或篡改。"
published = "2002-12-31T05:00:00.000"
remediation = "建议将 Monkey HTTP Daemon 升级至 0.5.1 或更高版本，以修复 method.c 中 Post_Method 函数对 Content-Length 头部处理不当导致的拒绝服务漏洞。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Monkey HTTP Daemon 无效POST请求拒绝服务漏洞"
updated = "2026-06-16T21:59:44.840"

