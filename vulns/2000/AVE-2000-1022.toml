[basic]
description = 'Metertek pagelog.cgi 存在目录遍历漏洞，远程攻击者可通过向 "name" 或 "display" 参数提交包含 `..`（点点）序列的恶意请求，绕过路径限制读取服务器上的任意文件。该漏洞影响使用 pagelog.cgi 的 Metertek 产品，攻击者无需身份认证即可利用，可能导致敏感信息泄露。CVSS 评分 6.4，危害等级中危。'
published = "2000-12-19T05:00:00.000"
remediation = '立即删除或禁用服务器上的 pagelog.cgi 脚本，该脚本已停止维护且无安全补丁。如业务必须使用，修改脚本对 name 和 display 参数进行严格过滤，拒绝包含 ".." 或 "/" 的输入，并限制文件读取路径为指定目录。部署 Web 应用防火墙（WAF）拦截目录遍历攻击载荷作为临时缓解措施。'
score = 6.4
severity = "MEDIUM"
sources = ["avd"]
title = "Metertek pagelog.cgi 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:52:48.903"

