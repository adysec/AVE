[basic]
description = "Guzzle（PHP HTTP 客户端）的 CookieJar 组件在处理 Cookie 的 Domain 属性时存在安全缺陷。当 Cookie 的 Domain 被设置为 IPv4 字面量（如 `192.168.0.1`）、IPv6 字面量（如 `[::1]`）或裸数值（如 `1` 表示 `0.0.0.1`）时，`SetCookie::matchesDomain()` 错误地对其应用了子域名后缀匹配规则而非精确主机匹配，导致作用域为 IP 地址的 Cookie 会被发送到名称以该 IP 值为后缀的任意主机（如 `evil.192.168.0.1`）。攻击者可通过控制 DNS 解析或在内网/容器/开发环境中诱导用户访问仿冒主机，实现跨主机 Cookie 泄露、Cookie 注入或会话固定攻击。该漏洞影响 Guzzle 7.12.3 之前的所有版本，已在 7.12.3 版本中修复。"
published = "2026-07-08T17:17:26Z"
remediation = "立即将 guzzlehttp/guzzle 升级至 7.12.3 或更高版本（composer require guzzlehttp/guzzle ^7.12.3）。如无法升级，避免在不同信任级别的主机间复用同一 CookieJar 实例，为每个主机或信任边界使用独立的 CookieJar，或对不可信主机的请求禁用 Cookie 处理（不设置 `cookies => true`），同时避免将 Cookie 的 Domain 属性设为 IP 地址或裸数字值。"
score = 4.7
severity = "MEDIUM"
sources = ["ghsa"]
title = "Guzzle PHP HTTP 客户端 Cookie 跨主机泄露与注入漏洞"
updated = "2026-07-13T14:01:39Z"

