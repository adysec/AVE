[basic]
description = "Mutt 邮件客户端 RFC822 地址解析器存在缓冲区溢出漏洞，攻击者可通过发送包含不当终止注释或短语的地址列表触发缓冲区溢出，导致远程代码执行。该漏洞影响 Mutt 1.2.5.1 之前版本及 1.3.x 分支中 1.3.25 之前版本，CVSS 评分 7.5（高危），攻击向量为网络、攻击复杂度低、无需认证，可导致机密性、完整性、可用性均受影响。攻击者只需发送精心构造的邮件地址列表即可触发漏洞，无需用户交互即可在目标系统上以当前用户权限执行任意命令。Mutt 已在 1.2.5.1 和 1.3.25 版本中修复该漏洞，用户应升级至修复版本。"
published = "2002-02-27T05:00:00Z"
remediation = "建议立即升级 mutt 至 1.2.5.1 版本或 1.3.25 及以上版本（通过包管理器执行 `apt-get upgrade mutt` 或 `yum update mutt` 等）。若无法立即升级，可临时在 mailcap 配置中禁用自动解析 RFC822 地址列表功能，或在防火墙层面限制非信任来源的邮件连接作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Mutt Mutt 远程代码执行漏洞"
updated = "2026-06-16T21:56:34Z"

