[basic]
description = "这是一个影响 Langroid 框架的身份验证漏洞。当应用程序为不信任的用户启用了聊天界面时，如果工具被配置为 `use=False, handle=True`，系统仍然不会对消息发送者进行验证。攻击者可以直接通过聊天接口发送原始工具 JSON，绕过 LLM 的控制，直接触发工具处理器。攻击者无需登录凭据即可执行通过 `handle=True` 注册但 `use=False` 隐藏的工具。Langroid 允许工具处理与 LLM 相同的消息，攻击者可以利用这种设计缺陷，发送构成有效工具 JSON 的聊天消息，从而访问受保护的功能。这可能导致未授权的文件读取、写入或数据库查询，甚至可能访问内部编排工具。尽管 `use=False` 的设置暗示工具对最终用户不可用，但漏洞的存在意味着用户实际上可以直接调用这些工具。这对依赖 Langroid 开发的应用程序构成了严重安全风险，可能导致数据泄露、系统入侵或进一步的服务破坏。"
published = "2026-07-10T00:16:33Z"
remediation = "建议立即升级 Langroid 至 0.65.3 或更高版本（pip install -U langroid）。如暂时无法升级，可在应用层添加消息来源校验，仅允许 Entity.LLM 来源的消息触发工具调用，拦截 Entity.USER 直接发送的工具 JSON 负载。"
score = 8.1
severity = "HIGH"
sources = ["ghsa"]
title = "Langroid Langroid handle_message() 缺少发送者校验导致用户注入工具调用漏洞"
updated = "2026-07-10T15:49:19Z"

