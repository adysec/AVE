[info]
author = "ave"
description = "向目标服务器发送 GET 请求访问 /perl/ 路径，检测是否返回目录列表内容，验证 Apache mod_perl 默认配置下的目录可浏览漏洞。"
id = "POC-AVE-2000-0648"
name = "Mandrake Linux Apache mod_perl 目录泄露漏洞 PoC"
severity = "medium"
tags = ["ave-2000-0648"]
vuln_id = [
    "CVE-2000-0883",
    "AVE-2000-0648",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/perl/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Index of /perl",
    "<title>Index of /perl",
    "Parent Directory",
]
