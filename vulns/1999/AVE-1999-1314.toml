[basic]
description = "classifieds.cgi 是 Greg Matthews 开发的 Classifieds.cgi 1.0 在线分类广告脚本，其在处理 CGI 表单时存在严重安全缺陷：脚本在隐藏变量中接收用户提交的参数并将其作为系统命令直接执行，且缺乏必要的输入过滤与校验。远程攻击者只需能够访问目标 Web 服务器上的该 CGI 接口，即可通过在表单的隐藏字段中构造并注入任意命令，诱使服务器以 Web 进程权限执行这些命令，从而实现任意命令执行甚至完全接管服务器。该漏洞攻击条件极为简单、无需任何身份认证，CVSS 评分为 10.0，被广泛收录于公开的 Metasploit 与 Exploit-DB 利用代码中，风险极高。"
published = "1999-12-15T05:00:00Z"
remediation = "该 classifieds.cgi 脚本（Greg Matthews Classifieds.cgi 1.0）已停止维护且无官方补丁，建议立即从 Web 服务器删除或禁用该 CGI 脚本，改用经过维护的现代开源分类广告系统替代。若业务短期无法替换，可在 Apache/Nginx 层面通过 Location/Directory 指令拒绝访问该脚本路径，并仅允许受信来源 IP 访问；同时配置 WAF 规则拦截对隐藏变量（hidden variable）的畸形输入、关闭服务器对 CGI 的全局执行权限，并定期审计访问日志中可疑的命令拼接请求。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Greg Matthews Classifieds.cgi 任意命令执行漏洞"
updated = "2026-06-16T21:49:21Z"

