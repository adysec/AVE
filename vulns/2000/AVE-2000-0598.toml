[basic]
description = "IRIX 6.x 操作系统的 XFS 文件系统中的 truncate() 函数存在权限检查缺失漏洞。由于系统在调用 truncate() 函数时未正确验证用户对目标文件的访问权限，导致本地普通用户能够截断（清空）任意文件的內容，包括系统关键文件。攻击者只需拥有本地 shell 访问权限即可利用该漏洞，无需任何特殊权限。成功利用后，攻击者可破坏系统文件完整性，导致系统服务异常或拒绝服务。该漏洞影响 IRIX 6.2、6.3 和 6.4 版本。"
published = "2000-10-20T04:00:00.000"
remediation = "建议升级 IRIX 至 6.5 或更高版本，该版本修复了 xfs truncate() 权限检查缺陷。如无法升级，可通过 chmod 限制 xfs 文件系统上关键目录的写权限，并移除受影响的 setuid 程序。对于已停止维护的 IRIX 系统，建议迁移至受支持的 Linux 或 BSD 平台。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "SGI IRIX xfs 文件系统 truncate 函数本地权限检查漏洞"
updated = "2026-06-16T21:52:30.190"

