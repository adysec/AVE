[basic]
description = "skk（Simple Kana to Kanji conversion program）12.1及更早版本，以及基于skk的ddskk包，在创建临时文件时未采取安全措施，导致本地攻击者可通过符号链接或竞争条件覆盖系统上的任意文件。该漏洞影响使用上述软件的Unix/Linux系统，攻击者需要具备本地用户权限才能利用，可通过精心构造的文件名和时序控制，将临时文件指向敏感系统文件，从而修改文件内容或权限，进而可能获得提权或其他进一步攻击的基础。"
published = "2003-08-18T04:00:00Z"
remediation = "升级 skk 至 12.2 或更高版本，或升级 ddskk 至 12.1.cvs.20030622-1 之后的版本，修复临时文件不安全创建漏洞。Debian 系统应安装 DSA-343 安全更新（skk 版本 ≥10.62a-6、ddskk 版本 ≥12.1.cvs.20030622-1）；Red Hat Enterprise Linux 系统应应用 RHSA-2003:242 安全补丁。如暂无法升级，可将环境变量 TMPDIR 设置为私有目录（如 $HOME/tmp）并确保目录权限为 700，以临时降低被本地用户符号链接攻击的风险。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "ddskk 临时文件不安全创建任意文件覆盖漏洞"
updated = "2026-06-16T22:02:23Z"

