[basic]
description = "Infopulse GateKeeper 3.5 及更早版本存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过向目标服务发送超长字符串触发该漏洞，导致任意命令执行。该漏洞影响 Infopulse GateKeeper 3.5 及之前所有版本，CVSS 评分 7.5，危害等级高，且已有公开的远程利用代码。"
published = "2000-07-13T04:00:00Z"
remediation = "立即升级 Infopulse GateKeeper 至 3.6 或更高版本。如无法立即升级，在防火墙层面限制对 TCP 端口 2000 的访问，仅允许可信 IP 连接，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
