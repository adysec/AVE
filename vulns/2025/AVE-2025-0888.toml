[basic]
description = "Oracle MySQL Server 存在关键资源权限分配不当漏洞（CWE-732），位于 Server: DML 组件。受影响版本包括 MySQL 8.0.0-8.0.41、8.4.0-8.4.4 和 9.0.0-9.2.0。拥有高权限并具备网络访问权限的攻击者，可通过多种协议向 MySQL 服务发送特制请求，触发该漏洞导致服务进程反复崩溃或无限期挂起，造成完全拒绝服务。攻击复杂度低，无需用户交互，CVSS 3.1 评分 4.9（可用性影响）。"
published = "2025-04-15T21:15:53Z"
remediation = "建议立即升级 MySQL Server 到 8.0.42、8.4.5 或 9.2.1 及以上版本（对应各分支修复版本）。若暂时无法升级，可通过限制数据库高权限账号的网络访问来源（如仅允许可信 IP 连接）、启用 skip-networking 本地模式或配置防火墙阻断非必要的 3306 端口访问作为临时缓解措施。参考 Oracle 官方 CPU 2025 年 4 月补丁公告及各发行版安全通告（ALSA-2025:16046、RHSA-2025:15699、RLSA-2025:16861）应用对应补丁包。"
score = 4.9
severity = "MEDIUM"
sources = ["msrc"]
title = "Oracle MySQL Client 拒绝服务漏洞"
updated = "2026-06-17T08:43:46Z"

