[basic]
description = "Linux 内核在 hwpoison 与内存热插拔（memory_hotplug）子系统中存在锁定顺序错误漏洞。当对已被标记为硬件错误（hwpoisoned）的页进行下线操作时，代码在调用 try_to_unmap 函数解除页映射之前未提前持有 folio 锁，违反了该函数的前置条件。具有本地低权限访问权限的攻击者可通过触发内存块离线操作，在内核中触发 BUG 断言，导致系统崩溃或内核 panic，从而造成拒绝服务。该漏洞影响受影响的 Linux 内核版本，CVSS 评分为 5.5，危害等级为中等。Linux 内核社区已通过修复提交解决此问题，在解除映射前添加了必要的 folio 锁定操作。"
published = "2025-04-01T16:15:23Z"
remediation = '立即升级 Linux 内核至包含修复 commit 3926b572fd07、576a2f4c437c、629dfc6ba543、93df6da64b0 或 af288a426c3 的稳定版本，受影响版本范围包括 3.16.65 至 3.17、4.4.170 至 4.5、4.9.150 至 4.10、4.14.93 至 4.15、4.19.15 至 4.20、4.20.2 至 6.1.140、6.2 至 6.6.92、6.7 至 6.12.19、6.13 至 6.13.7，修复后版本包括 6.6.92、6.12.19、6.13.7 及更高版本。如无法立即升级且不需要内存热插拔功能，可通过在启动参数中添加 "mhp=disable" 或在 sysfs 中禁用 memory_block_device 来临时缓解，同时限制本地特权用户访问权限。'
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel hwpoison 與 memory_hotplug 不當鎖定導致拒絕服務漏洞"
updated = "2026-06-17T08:44:38Z"

