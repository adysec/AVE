[basic]
description = "Babel 多语言网站系统存在开放重定向漏洞。攻击者可通过构造包含恶意 URL 的 newurl 参数发送给 redirect.php 页面，诱使受害者点击特制链接后，将用户重定向至任意外部站点。该漏洞源于程序未对重定向目标 URL 进行充分校验，可被用于钓鱼攻击、规避安全策略或传播恶意内容。攻击条件低，无需身份认证，但需用户交互。CVSS 评分 6.1，危害等级中危。"
published = "2019-07-16T14:15:11Z"
remediation = '由于 Babel 模块已停止维护且无官方补丁，建议立即从 CMS Made Simple 站点中删除该模块（在 CMSMS 管理后台的"模块管理"中卸载 Babel，或直接删除 modules/babel/ 目录）。如因业务需要暂时保留，可修改 modules/babel/redirect.php，在 newurl 参数处理前添加白名单校验：仅允许跳转到本站域名下的 URL，拒绝所有外部域名重定向；同时可在 Web 服务器（Nginx/Apache）层面添加重写规则，拦截对 /modules/babel/redirect.php 的访问并返回 403。'
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Babel 开放重定向漏洞"
updated = "2026-06-17T02:09:56Z"

