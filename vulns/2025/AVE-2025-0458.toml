[basic]
description = "Google Chrome（Mac 版）Storage 组件存在不恰当实现漏洞，远程攻击者可通过特制视频文件诱导用户访问，导致域名欺骗攻击。攻击者能够伪造受信任域名，使用户误信恶意内容来自合法来源。该漏洞影响 Mac 版 Chrome 141.0.7390.54 之前版本，攻击复杂度低，无需特权，但需用户交互触发。Google 已在 Chrome 141.0.7390.54 版本中修复此漏洞。"
published = "2025-11-06T22:15:39Z"
remediation = "升级 Google Chrome 至 141.0.7390.54 及以上版本（Mac 平台），或升级 Microsoft Edge、Brave 等基于 Chromium 的浏览器至对应修复版本。Linux 发行版用户更新 chromium 包至 141.0.7390.122 及以上版本。无法立即升级时，避免打开来源不明的视频文件以降低被攻击风险。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome Storage 实现不当导致域名欺骗漏洞"
updated = "2026-06-17T08:29:52Z"

