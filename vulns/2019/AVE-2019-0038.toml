[basic]
description = "WordPress Google Maps 插件（wp-google-maps）7.11.18 之前版本中存在 SQL 注入漏洞，位于 includes/class.rest-api.php 文件的 REST API 端点中。该插件在构建 SELECT 查询语句时未对字段名进行正确过滤和转义，导致未经身份认证的远程攻击者可通过构造特制的 HTTP 请求，利用 REST API 路由 `/wpgmga/v1/markers` 的 `fields` 参数注入恶意 SQL 语句，从而窃取数据库中敏感信息（如用户凭据）、篡改数据或执行未授权操作。该漏洞影响范围广泛，CVSS 评分 9.8，危害等级严重。"
published = "2019-04-02T18:30:20Z"
remediation = "建议立即将 WP Google Maps 插件升级至 7.11.18 或更高版本（该版本已修复 REST API 未对字段名进行过滤导致的 SQL 注入问题），可在 WordPress 后台「插件」页面点击更新，或从插件官网下载最新版手动上传覆盖安装。升级完成后在「设置 → 固定链接」中点击保存以刷新重写规则，并清除 WordPress 及 CDN 缓存。若暂时无法升级，可通过 Web 应用防火墙（WAF）或安全插件拦截包含危险 SQL 关键字的 REST API 请求，同时建议在服务器上限制 wp-google-maps REST 接口的外部访问，并检查访问日志中是否存在异常 SQL 注入请求；长期使用期间应定期备份数据库，以降低被利用造成数据泄露或篡改的风险。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "CodeCabin WP Go Maps WordPress 插件 SQL 注入漏洞"
updated = "2026-06-17T02:11:31Z"

