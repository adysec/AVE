[basic]
description = "台达电子 ASDA-Soft 软件在解析 PAR 文件时存在基于堆栈的缓冲区溢出漏洞（CWE-121），由于未对用户提供的 PAR 文件数据进行充分的边界检查，攻击者可构造特制的恶意 PAR 文件，通过社会工程学手段诱使目标用户打开该文件，触发栈缓冲区溢出，进而导致远程代码执行。该漏洞影响 Delta Electronics ASDA-Soft 产品，CVSS 评分 7.8，危害等级高。攻击需要用户交互，无法远程直接利用。"
published = "2026-01-27T04:16:03Z"
remediation = "立即升级 Delta ASDA-Soft 至 v7.2.2.0 或更高版本，可从 Delta 下载中心获取（https://downloadcenter.deltaww.com/en-US/DownloadCenter?v=1&q=asda-soft）。临时缓解措施：不打开来源不明的 .par 文件或邮件附件，将控制系统网络与业务网络隔离，部署防火墙并限制非必要端口访问。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Delta Electronics ASDA-Soft PAR文件解析基于堆栈的缓冲区溢出远程代码执行漏洞"
updated = "2026-06-17T10:15:39Z"

