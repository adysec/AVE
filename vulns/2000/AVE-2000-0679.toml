[basic]
description = 'SmartWin CyberOffice Shopping Cart 2（又名 CyberShop）存在价格修改漏洞。远程攻击者可通过拦截并修改订单提交请求中的 "Price" 隐藏表单变量值，以任意价格完成商品购买。该漏洞源于服务端未对用户提交的价格参数进行有效性校验，攻击者无需身份认证即可利用，可能导致商家遭受经济损失。CVSS 评分 7.5，危害等级高。'
published = "2000-12-19T05:00:00Z"
remediation = "建议立即在服务端对商品价格进行二次校验，禁止信任客户端提交的隐藏表单字段值，所有价格计算必须在服务端会话中完成。如无法修改代码，建议迁移至受支持的电商平台（如 WooCommerce、Magento），并对购物车提交数据实施 HMAC 签名验证防止篡改。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Smartwin Technology CyberOffice Shopping Cart 2.0 价格修改漏洞"
updated = "2026-06-16T21:52:46Z"

