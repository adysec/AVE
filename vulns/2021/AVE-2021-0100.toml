remediation = "立即将设备升级至 iPadOS 14.4.2 或更高版本（iOS 14.4.2 / iOS 12.5.2 / watchOS 7.3.3），通过「设置」→「通用」→「软件更新」手动检查并安装最新安全补丁。升级前可临时缓解：在 Safari 浏览器中禁用 JavaScript 或限制不受信任的网页访问，避免访问可疑链接以降低被利用风险。"
