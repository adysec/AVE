[basic]
description = "SSH 1.2.27 在启用 Kerberos 认证支持时，会将 Kerberos 票据缓存文件创建在登录用户的当前工作目录中，而非安全的临时目录。当用户的家目录挂载在 NFS 网络文件系统上时，远程攻击者可通过嗅探网络流量获取该票据缓存文件，进而窃取用户的 Kerberos 身份凭证，实现未授权访问。该漏洞影响 SSH 1.2.27 版本，CVSS 评分 7.2，危害等级高。"
published = "2000-07-05T04:00:00Z"
remediation = '升级至 SSH 1.2.28 或更高版本（该版本已修复 KRB5CCNAME 环境变量误设为 "none" 的问题）。如无法升级，可手动修改 sshd.c 第 4296 行，将 `if (ticket)` 改为 `if (ticket && strcmp("none", ticket))`，避免将 KRB5CCNAME 设为 "none"。临时缓解措施：禁用 Kerberos 认证支持（编译时不加 --with-kerberos5），或避免将用户主目录放在 NFS 等网络文件系统上。'
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "SSH Kerberos认证支持票据缓存嗅探漏洞"
updated = "2026-06-16T21:52:01Z"

