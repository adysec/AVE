[basic]
description = "tags. Let me provide the analysis first, then the value.<value>Microsoft IIS 5.0 及更早版本在应用 MS01-014 和 MS01-016 安全补丁后引入了内存泄漏漏洞。未经身份认证的远程攻击者可通过向目标服务器连续发送大量特制 HTTP 请求触发该漏洞，导致 Web 服务进程内存无法被正确释放而持续增长，最终耗尽系统可用内存资源，造成 IIS 服务拒绝响应。该漏洞影响已安装相关补丁的 IIS 5.0 及更早版本系统，攻击条件宽松，攻击者无需任何身份认证凭据即可在远程网络位置发起利用，主要危害为服务可用性受损，无法导致数据泄露或篡改。"
published = "2001-06-27T04:00:00Z"
remediation = '安装 Microsoft 2001 年 5 月发布的 IIS 5.0 累积安全补丁 MS01-026（KB293826），该补丁修复了 MS01-014 和 MS01-016 补丁引入的内存泄漏问题。如已安装后续更新，可直接安装 Windows 2000 Service Pack 3 或更高版本，或应用 MS01-044 累积补丁以彻底消除此漏洞。安装后验证注册表项 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Updates\Windows 2000\SP2\Q293826 是否存在。如无法立即安装补丁，可临时通过限制对 IIS 服务的并发连接数或定期重启 IIS 服务来缓解内存泄漏导致的拒绝服务风险。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft IIS 5.0 内存泄漏拒绝服务漏洞"
