[basic]
description = "DomainMOD 4.11.01 及之前版本中存在跨站脚本漏洞，位于 `assets/add/dns.php` 页面的 Profile Name 或 notes 字段。由于程序未对用户输入进行充分过滤和转义，拥有管理员权限的认证攻击者可构造恶意 JavaScript 载荷注入这些字段。当其他管理员用户访问该页面时，恶意脚本将在浏览器中执行，导致敏感信息泄露或会话劫持。攻击需高权限认证且依赖用户交互，CVSS 评分 4.8，危害等级中危。"
published = "2018-12-06T19:29:00Z"
remediation = "升级 DomainMOD 至 4.11.02 及以上版本，该版本已修复 assets/add/dns.php 中 Profile Name 和 notes 字段的 XSS 漏洞。如无法立即升级，可在服务器端对这两个输入字段实施严格的 HTML 实体编码转义（如 PHP 的 htmlspecialchars($input, ENT_QUOTES, 'UTF-8')），并配置 WAF 规则拦截包含 `<script>` 等危险标签的请求。"
score = 4.8
severity = "MEDIUM"
sources = ["nuclei"]
title = "DomainMOD up to 4.11.01 跨站脚本漏洞"
updated = "2026-06-17T01:50:06Z"

