[info]
author = "ave"
description = "验证目标浏览器是否允许JavaScript通过window.createPopup()创建无边框色块窗口，从而实施钓鱼欺骗攻击"
id = "POC-AVE-2001-0546"
name = "CVE-2001-1410 PoC"
severity = "medium"
tags = ["ave-2001-0546"]
vuln_id = [
    "CVE-2001-1410",
    "AVE-2001-0546",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["createPopup"]
