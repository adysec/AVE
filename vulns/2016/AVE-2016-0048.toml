[basic]
description = "WordPress mail-masta 插件 1.0 版本中存在输入验证错误漏洞，该插件中的 `count_of_send.php` 和 `csvexport.php` 两个文件未对用户传入的文件路径参数进行有效过滤，导致远程攻击者可在无需认证的情况下，通过构造包含路径遍历序列（如 `../`）的特制请求，实现本地文件包含攻击，从而读取服务器上的任意敏感文件（如 `/etc/passwd`、`wp-config.php` 等）。该漏洞影响 WordPress mail-masta 插件 1.0 版本，CVSS 评分 7.5，危害等级高。"
published = "2019-09-16T12:15:10Z"
remediation = "该插件已于 2014 年 9 月从 WordPress 官方仓库下架且不再维护，建议立即从 WordPress 后台插件管理中删除 mail-masta 插件，并替换为其他仍在维护的邮件营销插件（如 MailPoet 或 Newsletter）。同时检查服务器上是否存在该插件的残留文件（如 wp-content/plugins/mail-masta/），手动删除以彻底消除本地文件包含风险。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress mail-masta插件本地文件包含漏洞"
updated = "2026-06-17T00:40:41Z"

