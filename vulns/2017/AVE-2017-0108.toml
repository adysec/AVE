[basic]
description = "Microsoft Office 2010 SP2、2013 SP1 及 2016 版本在处理内存对象时存在远程代码执行漏洞。攻击者可通过构造特制的 Office 文档（如 Word、Excel 文件）并诱使用户打开，触发内存处理错误，从而在当前用户上下文中执行任意代码。该漏洞无需身份认证，但需要用户交互（打开恶意文件）。该漏洞已被 CISA 列入已知被利用漏洞目录，实际攻击中常被用于鱼叉式钓鱼邮件投递恶意文档，实现初始入侵。Microsoft 已于 2017 年 5 月安全更新中修复此漏洞。"
published = "2017-05-09T00:00:00Z"
remediation = "立即安装 Microsoft 2017 年 5 月安全更新：Office 2010 SP2 安装 KB3191937，Office 2013 SP1 安装 KB3191932，Office 2016 安装 KB3191938。可通过 Windows Update 自动获取或从 Microsoft 下载中心手动安装。如无法立即打补丁，建议在邮件网关层面拦截包含 OLE 对象的可疑文档，并提醒用户不要打开来源不明的 Office 文件。"
score = 5
severity = "MEDIUM"
sources = ["kev"]
title = "Microsoft Office 远程代码执行漏洞"
updated = "2017-05-09T00:00:00Z"

