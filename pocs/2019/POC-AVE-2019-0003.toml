[info]
author = "ave"
description = "验证 Apache HTTP Server 2.4.17-2.4.38 版本是否存在本地权限提升漏洞。由于该漏洞为 LPE，本 PoC 验证前提为攻击者已上传利用脚本，通过请求该脚本并观察其内存操作状态来验证漏洞触发可行性。"
id = "POC-AVE-2019-0003"
name = "CVE-2019-0211 Apache Root Privilege Escalation PoC"
severity = "high"
tags = ["ave-2019-0003"]
vuln_id = [
    "CVE-2019-0211",
    "AVE-2019-0003",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/carpediem.php"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Triggering UAF"]
