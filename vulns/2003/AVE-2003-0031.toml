[basic]
description = "file 命令的 readelf.c 中 tryelf() 函数存在缓冲区溢出漏洞。当用户使用 file 命令解析特制的 ELF 文件时，攻击者可通过在 ELF 头部设置过大的 e_shentsize 字段值触发栈溢出，从而以当前用户权限执行任意代码。该漏洞影响 file 3.x 及更早版本，攻击者需要诱使用户对恶意 ELF 文件执行 file 命令才能利用，CVSS 评分 4.6，危害等级中危。"
published = "2003-03-18T05:00:00Z"
remediation = "立即升级 file 程序包至修复版本：Red Hat Linux 安装 RHSA-2003:086/087 提供的 file-3.41-5.7 及以上版本，Debian 安装 DSA-260 提供的 file_3.41-4woody2 及以上版本，NetBSD 应用 SA2003-003 补丁，Ubuntu 升级至 4.16-0ubuntu3.2 及以上版本。如无法升级，避免对不可信 ELF 文件执行 file 命令，并限制普通用户运行 file 的权限。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "file 命令 readelf.c 缓冲区溢出代码执行漏洞"
updated = "2026-06-16T22:01:31Z"

