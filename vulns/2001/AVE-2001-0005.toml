[basic]
description = "Borland/Inprise InterBase 4.0、5.0 及 6.0 版本的数据库服务器内置了一个隐藏的后门账户（Backdoor Account），该账户带有已知的默认凭据。由于这些版本在安装时硬编码了该特权账户且无法通过常规手段清除，未经身份认证的远程攻击者可利用该后门账户直接登录数据库服务器，并通过调用存储过程（stored procedures）对服务器上的任意文件进行覆盖或写入操作，进而导致任意文件覆盖、数据篡改乃至系统完全受控。由于该漏洞无需任何认证即可远程触发，CVSS 评分为 10.0，危害等级为严重。受影响范围覆盖 Borland/Inprise InterBase 4.0 至 6.0 全系列版本，未进行相应版本升级或后门账户清理的部署环境均存在被入侵风险。"
published = "2001-02-12T05:00:00.000"
remediation = '由于该漏洞自 Interbase 6.0 之前版本就存在已知的后门账户（用户名 "politically"、密码 "correct"），建议立即升级到受支持的版本或应用厂商提供的安全补丁。具体操作：1) 联系 Borland/Embarcadero 获取该漏洞的官方补丁并部署，或升级至不再包含默认后门的版本；2) 若无法立即升级，需通过配置文件或数据库用户管理禁用或删除名为 "politically" 的后门账户，并删除对应的存储过程权限；3) 限制弱口令账户 Min 与 Politically 的登录，在防火墙/访问控制层仅允许可信 IP 访问 Interbase 服务端端口（默认 3050），禁止远程执行存储过程；4) 针对远程攻击者可利用存储过程覆盖任意文件的特性，撤销 guest/后门账户对文件系统相关存储过程的执行权限。'
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Borland/Inprise Interbase 数据库服务器后门账号漏洞"
updated = "2026-06-16T21:53:28.833"

