[basic]
description = "标签中。<value>WordPress ultimate-faqs 插件的 Functions/EWD_UFAQ_Import.php 文件存在身份验证缺失漏洞（CWE-306）。该漏洞影响 ultimate-faqs 插件 1.8.24 及以下版本，未经身份验证的远程攻击者可通过直接发送特制导入请求，利用该选项导入功能篡改网站配置或数据。由于该导入操作未对请求来源进行身份验证校验，任何网络可达的攻击者均可轻松触发，CVSS 评分 7.5，危害等级高。"
published = "2019-10-07T23:15:10.080"
remediation = "升级 ultimate-faqs 插件到 2.4.13 或更高版本，该版本已修复导入功能的身份验证绕过漏洞。如无法立即升级，请在 WordPress 后台临时禁用 ultimate-faqs 插件，或通过 .htaccess 限制对 wp-admin/admin-ajax.php 的未授权访问，以阻断未认证的选项导入请求。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress ultimate-faqs插件未授权选项导入漏洞"
updated = "2026-06-17T02:23:31.450"

