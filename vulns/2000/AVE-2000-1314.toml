[basic]
description = "Linux 系统中的 tnef 程序在处理 TNEF 编码的压缩附件时存在任意文件写入漏洞。由于 tnef 解压附件时未对压缩包中的绝对路径名进行有效过滤和校验，远程攻击者可以构造特制的 TNEF 格式邮件附件，其中包含指向目标系统任意路径的文件名，当受害者使用 tnef 程序解压该附件时，攻击者即可将文件写入任意目录，覆盖系统关键文件，导致拒绝服务或权限提升。该漏洞 CVSS 评分 10.0，危害等级严重，攻击者无需身份认证即可远程利用。"
published = "2000-07-10T04:00:00Z"
remediation = "升级 tnef 程序至 1.0.3 及以上版本，该版本已修复 TNEF 解压时跟随绝对路径覆盖任意文件的问题。如无法升级，避免使用 tnef 直接处理来自不可信来源的 TNEF 附件，或在沙箱/容器环境中解压 TNEF 文件，并确保运行 tnef 的用户权限最小化（不使用 root 运行）。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "SUSE Linux Tnef 任意文件写入漏洞"
updated = "2026-06-16T21:52:06Z"

