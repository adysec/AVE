[basic]
description = "Fortinet FortiWeb 管理界面存在整数溢出或回绕漏洞（CWE-190），具有高权限的已认证攻击者可通过向目标设备的管理接口发送特制的 HTTP 请求触发该漏洞，导致系统拒绝服务。该漏洞影响 FortiWeb 8.0.0 至 8.0.3、7.6.0 至 7.6.6 以及 7.0/7.2/7.4 全版本，CVSS 评分 4.9，危害等级中危。Fortinet 已在 FG-IR-26-108 安全公告中发布修复方案，建议用户升级至 8.0.4 或 7.6.7 及以上版本。"
published = "2026-04-14T16:16:45Z"
remediation = "升级 FortiWeb 至以下已修复版本：8.0.x 升级至 8.0.4 及以上，7.6.x 升级至 7.6.7 及以上；7.0/7.2/7.4 全版本受影响，建议迁移至已修复版本。如无法立即升级，可在网络防火墙层面限制管理界面的可信来源 IP 访问作为临时缓解措施。"
score = 4.9
severity = "MEDIUM"
sources = ["zdi"]
title = "Fortinet FortiWeb 整数溢出拒绝服务漏洞"
updated = "2026-06-17T10:42:37Z"

