[basic]
description = "Hackney 包（Erlang HTTP 客户端库）1.21.0 之前版本存在服务器端请求伪造（SSRF）漏洞。漏洞根源在于 URI 内置模块与 hackney 对 URL 的解析不一致：URI 模块正确解析 `http://127.0.0.1?@127.2.2.2/` 的主机为 127.0.0.1，但 hackney 错误地将主机识别为 127.2.2.2/。攻击者可利用此差异构造特制 URL，绕过基于 URI 函数的主机检查机制，诱使服务端向内部网络发起请求，可能导致敏感信息泄露或内网探测。该漏洞影响所有使用 hackney 且依赖 URI 函数进行主机校验的 Erlang 应用，CVSS 评分 2.9，危害等级低。"
published = "2025-02-11T05:15:14Z"
remediation = "将 hackney 升级至 1.21.0 或更高版本（`mix deps.update hackney` 或更新 `rebar.lock` 中 hackney 版本约束）。如无法立即升级，在调用 hackney 前自行对 URL 进行二次解析校验，确保 URI.parse/1 与 hackney 实际请求的目标主机一致，避免依赖单一 URL 解析结果做安全判断。"
score = 2.9
severity = "LOW"
sources = ["msrc"]
title = "Hackney hackney 服务器端请求伪造（SSRF）漏洞"
updated = "2026-06-17T08:38:36Z"

