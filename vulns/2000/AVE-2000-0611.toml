[basic]
description = "FreeBSD ports 软件包中的 apsfilter 组件未能正确读取用户过滤器配置文件，存在本地权限提升漏洞。本地攻击者可通过构造恶意的过滤器配置文件，在触发 apsfilter 处理打印任务时以 lpd 用户身份执行任意命令，从而获取系统敏感信息、修改数据或造成服务中断。该漏洞攻击复杂度低，无需身份认证，但需要本地访问权限。"
published = "2000-06-07T04:00:00Z"
remediation = "升级 FreeBSD Ports 中的 apsfilter 软件包至修复版本（2000 年 6 月后发布的版本），可通过 `portsupgrade apsfilter` 或 `pkg_add -r apsfilter` 更新。如无法升级，限制本地用户对 lpd 打印系统的访问权限，移除非必要用户对打印过滤器配置文件的写入权限，并确保 lpd 服务仅运行在受信任环境中。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "FreeBSD apsfilter 本地代码执行漏洞"
updated = "2026-06-16T21:51:56Z"

