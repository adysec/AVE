[basic]
description = "Phoenix Contact CHARX SEC-3150 存在命令注入漏洞（CWE-77），由于系统配置处理中对特殊元素不当中和，未经身份认证的远程攻击者可向系统配置接口注入恶意命令，随后以 root 权限执行。攻击向量为网络（AV:N），攻击复杂度低（AC:L），无需任何权限（PR:N）且无需用户交互（UI:N），CVSS 4.0 评分 9.3（CRITICAL）。成功利用该漏洞可导致目标设备完全被控，影响机密性、完整性与可用性。受影响产品为 CHARX SEC-3150 固件版本低于 1.9.1 的型号。该设备通常部署在电动汽车充电基础设施中，用于 OCPP 协议通信，具有较高的网络可达性。"
published = "2026-07-30T07:16:59.443"
remediation = "Phoenix Contact 已发布固件版本 1.9.1 修复此漏洞，受影响设备（CHARX SEC-3000、SEC-3050、SEC-3100、SEC-3150）应立即升级至 FW 1.9.1，可前往对应产品网页的下载区域获取更新固件。如无法立即打补丁，应将设备部署在封闭工业网络中并通过防火墙限制外部访问，仅允许可信管理主机对 TCP 5001 端口（CharxSystemConfigManager 服务）发起连接，以阻止未认证远程攻击者利用命令注入漏洞。"
score = 9.3
severity = "CRITICAL"
sources = ["zdi"]
title = "Phoenix Contact CHARX SEC-3000 命令注入漏洞"
updated = "2026-07-30T15:16:37.673"

