[basic]
description = "tags.<value>VolanoChatPro 聊天服务器在安装过程中将配置文件设置为全局可读权限，并以明文形式存储服务器管理员密码。未经身份验证的本地用户可以通过读取该配置文件获取管理员凭据，进而获得服务器上的更高权限。该漏洞影响所有使用默认安装配置的 VolanoChatPro 服务器实例。攻击者需要具备对服务器的本地访问权限，能够读取配置文件内容后即可利用此漏洞实现权限提升。"
published = "2001-01-09T05:00:00Z"
remediation = "立即将 VolanoChatPro 升级至厂商发布的安全修复版本，并将存储管理员密码的配置文件权限修改为 600（仅服务运行账户可读可写）。同时将配置文件中明文存储的管理员密码替换为加密哈希值，或通过独立的凭据管理系统进行集中管控。如暂时无法升级，应将配置文件移至仅管理员可访问的目录，并通过文件系统 ACL 严格限制其他本地用户的读取和执行权限。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Volano ChatPro 权限提升漏洞"
updated = "2026-06-16T21:53:15Z"

