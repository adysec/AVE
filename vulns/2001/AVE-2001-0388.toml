[basic]
description = "标签中。<value>iBill 密码管理系统的 CGI 脚本 ibillpm.pl 存在弱密码漏洞，该脚本使用客户的 MASTER_ACCOUNT 名称加上两个小写字母作为默认认证密码。由于 MASTER_ACCOUNT 可以从站点注册页面的 HTML 隐藏表单字段中公开获取，远程攻击者无需身份认证即可在有限密码空间（最多 676 种组合）内通过暴力破解方式猜解出正确的认证密码。攻击成功后，攻击者可通过该 CGI 脚本向目标服务器的 .htpasswd 文件发送特制 POST 请求，执行添加用户、删除用户或修改密码等操作，从而完全控制网站的用户认证体系并进行未授权访问。该漏洞影响以默认配置部署 iBill 密码管理系统 CGI 脚本的网站。"
published = "2001-12-06T05:00:00Z"
remediation = "建议立即升级 iBill 密码管理系统至最新版本（建议升级至 2001 年 12 月后发布的修复版本），并立即修改 MASTER_ACCOUNT 默认主账户密码为强密码（≥12 位含大小写数字特殊字符）。若无法立即升级，请在 Web 服务器层面（如 Apache/.htaccess）限制 ibillpm.pl 仅允许受信 IP 访问，并禁用弱密码生成逻辑，强制启用强密码策略。同时检查 .htpasswd 文件是否已被篡改，必要时重置所有账户密码。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "iBill iBill Management Script 弱硬编码密码漏洞"
updated = "2026-06-16T21:55:04Z"

