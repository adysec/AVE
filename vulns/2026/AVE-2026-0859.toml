[basic]
description = "OpenTelemetry JavaScript 的 `@opentelemetry/propagator-jaeger` 组件中存在拒绝服务漏洞。`JaegerPropagator.extract()` 方法在解码 HTTP 请求头 `uber-trace-id` 和 `uberctx-*` 时调用 `decodeURIComponent()` 但未处理解码异常，未经身份认证的远程攻击者可通过发送包含畸形百分号编码值（如裸 `%`）的 HTTP 请求触发未捕获的 `URIError`，导致使用 `JaegerPropagator` 作为全局传播器的 Node.js 进程崩溃退出，造成拒绝服务。该漏洞影响所有启用了 Jaeger 传播器的 OpenTelemetry JavaScript 应用，CVSS 评分 7.5，危害等级高。官方已在 `@opentelemetry/propagator-jaeger` 2.9.0 版本中修复。"
published = "2026-07-08T17:17:27Z"
remediation = "将 @opentelemetry/propagator-jaeger 升级至 2.9.0 或更高版本，该版本已忽略无法解码的标头值而非抛出异常。如无法立即升级，可在反向代理（如 nginx、Envoy）或 API 网关层过滤并剥离入站请求中的 uber-trace-id 和 uberctx-* 标头，仅允许受信任的上游服务传递这些标头。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "OpenTelemetry JavaScript JaegerPropagator 拒绝服务漏洞"
updated = "2026-07-10T18:56:03Z"

