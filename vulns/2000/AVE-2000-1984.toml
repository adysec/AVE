[basic]
description = 'Lotus Domino 5.0.4 及更早版本的 SMTP 服务存在缓冲区溢出漏洞，远程攻击者通过在 "MAIL FROM" 命令中构造超长的 ENVID 关键字参数，可触发缓冲区溢出，导致服务崩溃拒绝服务，甚至可能执行任意代码。该漏洞影响 Lotus Domino Mail Server 和 Domino Enterprise Server 等产品，CVSS 评分 10.0，危害等级严重。攻击者无需身份认证即可通过网络远程利用，建议升级到更高版本修复。'
published = "2000-12-11T05:00:00Z"
remediation = "升级至 Lotus Domino 5.0.5 或更高版本，该版本已修复 SMTP 服务中 MAIL FROM 命令 ENVID 参数的缓冲区溢出问题。如无法立即升级，可在防火墙或网络层面限制对 Domino SMTP 端口（默认 25/TCP）的访问，仅允许可信邮件服务器连接，以降低远程利用风险。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Lotus Domino SMTP 服务缓冲区溢出漏洞"
updated = "2026-06-16T21:53:02Z"

