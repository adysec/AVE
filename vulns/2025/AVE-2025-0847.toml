[basic]
description = "Microsoft Azure Health Bot 存在服务器端请求伪造（SSRF）漏洞，经过身份认证的攻击者可利用该漏洞向内部网络资源发送特制请求，绕过安全机制实现权限提升。该漏洞源于对用户输入的 URL 验证不充分，导致攻击者能够以服务端身份访问内部系统。影响范围包括 Azure Health Bot 服务相关部署，CVSS 评分 8.3，危害等级高。攻击者需拥有有效凭据方可利用，无需用户交互。Microsoft 已在 2025 年 4 月安全更新中修复此漏洞。"
published = "2025-04-01T01:15:17Z"
remediation = '立即登录 Azure 门户，确认 Azure Health Bot 服务实例已自动更新至最新版本（Microsoft 已于服务端修复此 SSRF 漏洞，无需手动打补丁）。在 Azure 门户中导航至 Health Bot 实例的"网络"设置，启用"受信任服务"访问限制，配置出站网络规则仅允许访问白名单内端点，并禁用不必要的内部 API 调用权限以降低 SSRF 影响面。'
score = 8.3
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Azure Health Bot 服务端请求伪造导致特权提升漏洞"
updated = "2026-06-17T08:43:15Z"

