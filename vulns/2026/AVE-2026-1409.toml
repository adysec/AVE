[basic]
description = "Electron 框架存在输入验证不当漏洞，其窗口选项未经过滤便被应用到新创建的 BrowserWindow 中。当不受信任的网页内容能够调用 window.open() 且应用程序未通过 setWindowOpenHandler 覆盖子窗口选项时，攻击者可在 features 字符串中传入特制参数，控制部分本应特权化的窗口选项，使主进程访问攻击者指定的本地文件路径或网络路径，从而导致信息泄露或进一步利用。该漏洞影响使用 Electron 构建的桌面应用程序，Electron 已在 39.8.8、40.9.0、41.2.1 及 42.0.0-beta.3 版本中修复此问题，开发者应对不受信任内容限制 window.open() 调用或显式设置 overrideBrowserWindowOptions 进行规避。"
published = "2026-08-05T17:16:54Z"
remediation = "升级 Electron 至修复版本：39.x 用户升级至 39.8.8，40.x 用户升级至 40.9.0，41.x 用户升级至 41.2.1，42.x beta 用户升级至 42.0.0-beta.3。如无法立即升级，在主进程中通过 `setWindowOpenHandler` 对不可信内容返回 `{ action: 'deny' }` 禁用 `window.open()`，或显式设置 `overrideBrowserWindowOptions` 强制指定所有子窗口选项，防止网页内容控制特权窗口参数。"
score = 5.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Electron 桌面应用框架 未授权访问漏洞"
updated = "2026-08-05T19:17:39Z"

