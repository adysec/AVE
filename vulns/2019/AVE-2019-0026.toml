[basic]
description = "Apache Struts2 框架 2.0.0 至 2.5.20 版本中存在强制双重 OGNL 表达式求值漏洞（S2-059），当标签属性中使用了未经过滤的用户输入时，攻击者可通过构造恶意的 OGNL 表达式触发该漏洞，实现远程代码执行。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响范围广泛，CVSS 评分 9.8，危害等级为严重。官方已在 2.5.22 版本中修复此漏洞。"
published = "2020-09-14T17:15:09Z"
remediation = "立即升级 Apache Struts 至 2.5.22 或更高版本，该版本进一步限制了强制双重 OGNL 求值带来的攻击面。如无法立即升级，启用主动 OGNL 表达式注入防护（在 struts.xml 中设置 struts.ognl.enableExpressionEvaluation=false），并严格避免在标签属性中使用 %{...} 或 ${...} 语法引用未经校验的用户输入，仅允许在 value 属性中使用 EL 表达式。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Apache Struts2 远程代码执行漏洞"
updated = "2026-06-17T02:08:02Z"

