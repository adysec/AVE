[basic]
description = "ActionScript 虚拟机 2（AVM2）abcFile 解析器存在整数溢出漏洞，攻击者可通过构造包含超大 intrf_count 值的恶意 AVM2 文件（如 SWF 文件），向目标系统发送特制数据包触发该漏洞，导致越界指针解引用，进而引发应用程序崩溃或远程代码执行。该漏洞影响 Adobe Flash Player 9.x 低于 9.0.246.0 版本、10.x 低于 10.0.32.18 版本以及 Adobe AIR 低于 1.5.2 版本，攻击者无需身份认证即可通过网络远程利用，危害严重。"
published = "2009-07-31T19:30:00Z"
remediation = "立即升级 Adobe Flash Player 至 9.0.246.0（9.x 分支）或 10.0.32.18（10.x 分支），Adobe AIR 至 1.5.2 或更高版本。如暂无法升级，可在浏览器设置中禁用 Flash 插件运行，或通过组策略限制 SWF 文件的下载与自动打开，避免访问不可信网站。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player AVM2 解析器整数溢出漏洞"
updated = "2026-06-16T23:08:14Z"

