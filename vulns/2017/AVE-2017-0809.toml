[basic]
description = "NETGEAR DGN2200 系列路由器 dnslookup.cgi 接口存在 OS 命令注入漏洞，远程认证用户可通过向该接口发送特制的 HTTP POST 请求，在 host_name 字段中注入 shell 元字符（如分号、管道符等）来执行任意操作系统命令。该漏洞影响固件版本 10.0.0.50 及更早的 DGN2200v1/v2/v3/v4 设备，CVSS 评分 8.8，危害等级高。攻击者需先获取设备管理凭据，利用难度较低，成功利用后可完全控制目标路由器，进而窃取网络流量、发起中间人攻击或作为跳板攻击内网其他主机。NETGEAR 已发布固件更新修复此漏洞。"
published = "2017-03-06T02:59:00Z"
remediation = "NETGEAR DGN2200 系列设备已停止支持，官方不再发布固件更新。建议立即将设备从网络中断开并更换为仍在支持周期内的路由器。如无法立即更换，可在路由器管理界面中将 dnslookup.cgi 的访问权限限制为仅内网管理 IP，并在防火墙上阻断来自外网的 80/443 端口对设备管理页面的访问作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "NETGEAR DGN2200 远程代码执行漏洞"
updated = "2026-06-17T01:22:10Z"

