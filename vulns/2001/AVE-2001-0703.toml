[basic]
description = "PHP-Nuke 4.4.1a 存在身份验证绕过漏洞，其 user.php 脚本在处理 saveuser 操作符时未对用户身份进行充分验证。未经身份认证的远程攻击者只需成功猜测目标用户的UID，即可通过构造包含 saveuser 操作符的请求调用 user.php，进而修改该用户的邮箱地址并获取其密码。该漏洞影响 PHP-Nuke 4.4.1a 版本，攻击者利用此漏洞可接管用户账户，造成敏感信息泄露。"
published = "2001-05-03T04:00:00Z"
remediation = "升级至 PHP-Nuke 5.0 或更高版本（官方已修复该漏洞）；若无法升级，请删除或重命名 user.php 文件，或在 Web 服务器层面配置访问控制禁止直接调用 user.php?op=saveuser 接口，同时强制所有用户修改密码并启用 HTTPS 传输加密。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "PHP-Nuke 远程越权修改用户邮箱并获取密码漏洞"
updated = "2026-06-16T21:54:02Z"

