[basic]
description = "D-Link DIR-859 无线路由器固件版本 1.05 及 1.06B01 Beta01 的 UPnP 服务中存在操作系统命令注入漏洞。未经身份认证的远程攻击者可在连接到本地网络后，向 UPnP 服务的 /gena.cgi 端点发送特制的 HTTP SUBSCRIBE 请求，从而以 root 权限在目标设备上执行任意系统命令。攻击者利用该漏洞可完全控制路由器，进而窃取网络流量、发起中间人攻击或将设备纳入僵尸网络。CVSS 评分 9.8，危害等级严重。D-Link 已发布固件更新修复此漏洞。"
published = "2019-12-30T17:15:19Z"
remediation = "立即将 DIR-859 固件升级至 v1.07b03_beta 或更高版本。升级需分两步：先通过设备 Web 管理界面刷入中间固件 DIR859_FW107b02beta01_20190125_j1o9_middle.bin，再刷入最终固件 DIR859_FW107b03_jbli_beta.bin。如设备已停止支持无法获取补丁，建议立即停用该设备并更换为受支持的新型号，同时在防火墙层面限制对 UPnP 服务（端口 1900/5000）的 LAN 侧访问作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "D-Link DIR-859 路由器 UPnP 远程命令执行漏洞"
updated = "2026-06-17T02:24:17Z"

