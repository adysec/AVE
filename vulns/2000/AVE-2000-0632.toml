[basic]
description = "Kerberos 4 的 KDC（密钥分发中心）程序中的 kerb_err_reply 函数在处理 e_msg 变量时存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标 KDC 服务发送特制的请求触发该溢出，导致目标系统服务崩溃，造成拒绝服务。该漏洞影响 Kerberos 4 协议实现，CVSS 评分 5.0，危害等级中等。"
published = "2000-06-09T04:00:00Z"
remediation = "立即升级 MIT Kerberos 5 至 1.2 及以上版本，或为 krb5-1.0.x/1.1.x 应用 MIT 官方补丁（krb4kdc_10x_patch.txt / krb4kdc_111_patch.txt），补丁修改 kerberos_v4.c 中 kerb_err_reply 函数的 e_msg 缓冲区处理，将 strcat 替换为 strncat 并增加长度校验。若使用 MIT Kerberos 4 Patch 10，应用 krb4kdc_krb4p10_patch.txt 补丁。Red Hat 用户安装 RHSA-2000-031 提供的更新包。KTH-krb4 用户升级至 0.10 及以上版本。如无法立即打补丁，可在网络层面限制对 KDC 端口的访问作为临时缓解。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "MIT Kerberos 4 KDC 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:51:58Z"

