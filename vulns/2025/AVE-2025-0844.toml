[basic]
description = "Microsoft Excel 存在远程代码执行漏洞，由于软件在处理特制文件时未正确验证内存中的对象，导致攻击者可通过诱导用户打开恶意构造的 Excel 文件来触发漏洞。成功利用该漏洞的攻击者可在目标系统上以当前用户权限执行任意代码，实现数据窃取、恶意软件安装或系统控制。该漏洞需用户交互（打开恶意文件），CVSS 评分 7.8，危害等级高。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞，建议用户立即安装更新。"
published = "2025-02-11T18:15:36.773"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新：Excel 2016 升级至 16.0.5487.1000 及以上版本，Office Online Server 升级至 16.0.10416.20058 及以上版本，Mac 版 Office LTSC 升级至 16.94.25020927 及以上版本。Microsoft 365 及 Office 2019/2021/2024 LTSC 用户通过 https://aka.ms/OfficeSecurityReleases 获取更新。临时缓解措施：不要打开来自不可信来源的 Excel 文件，启用受保护视图和文件阻止策略。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Excel 远程代码执行漏洞"
updated = "2026-06-17T08:43:14.657"

