[basic]
description = "Big Brother（BB）网络监控系统 1.5d3 之前版本中的 bb-hist.sh、bb-histlog.sh、bb-hostsvc.sh、bb-rep.sh、bb-replog.sh 及 bb-ack.sh 等多个脚本存在信息泄露漏洞。远程攻击者无需认证即可通过向 HISTFILE 参数指定目标文件路径，探测服务器上任意文件是否存在以及获取用户 ID 信息，导致敏感信息泄露。该漏洞影响 Big Brother 1.5d3 之前所有版本，CVSS 评分 5.0，危害等级中危。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 Big Brother 至 1.5d3 或更高版本，该版本已修复 HISTFILE 参数导致的文件存在性泄露问题。如无法升级，可在 Web 服务器层面对 bb-hist.sh、bb-rep.sh 等脚本的访问添加 IP 白名单限制，或移除这些脚本的 Web 可执行权限作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "BB4 Big Brother Network Monitor 文件存在性信息泄露漏洞"
updated = "2026-06-16T21:53:19Z"

