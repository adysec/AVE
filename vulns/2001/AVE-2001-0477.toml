[basic]
description = "XFree86 X11R6 3.3.2 版本中的 xman 手册浏览器存在缓冲区溢出漏洞。本地攻击者可通过设置超长 MANPATH 环境变量触发缓冲区溢出，覆盖内存中的关键数据，从而获取目标系统的 root 权限。该漏洞影响 XFree86 X11R6 3.3.2 及更早版本，攻击者需要拥有本地系统访问权限，无需身份认证即可利用，CVSS 评分 7.2，危害等级高。"
published = "2001-07-11T04:00:00Z"
remediation = "升级 XFree86 至 4.0 及以上版本，或迁移至 X.Org 替代 XFree86。如无法升级，移除 xman 的 setuid 权限（chmod u-s /usr/X11R6/bin/xman）以消除本地提权风险，并限制不可信用户对系统的本地访问权限。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "XFree86 X11R6 xman MANPATH 环境变量缓冲区溢出漏洞"
updated = "2026-06-16T21:55:44Z"

