[basic]
description = "xlockmore 和 xlockf 屏幕锁定程序在处理用户提供的格式字符串时存在安全缺陷，未对通过 -d 参数传入的格式字符串进行正确过滤和清理。本地攻击者可利用该格式字符串漏洞，向 xlock 程序提交特制的格式字符串参数，触发内存读写异常，从而以 root 权限执行任意代码，实现本地权限提升。该漏洞影响 xlockmore 及 xlockf 系列版本，攻击者需拥有本地系统访问权限，无需身份认证即可利用。"
published = "2000-10-20T04:00:00.000"
remediation = "立即升级 xlockmore 至 4.17 或更高版本，或安装对应发行版的安全补丁（Debian 已于 2000-08-16 发布安全更新，FreeBSD 也已提供补丁）。如无法立即升级，可临时移除 xlock 二进制文件的 setuid 权限（chmod u-s /usr/X11R6/bin/xlock）以消除本地提权风险。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "David Bagley xlockmore/xlockf 格式字符串漏洞"
updated = "2026-06-16T21:52:25.817"

