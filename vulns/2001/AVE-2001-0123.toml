[basic]
description = "Apache HTTP Server 1.3.11 至 1.3.20 版本的 mod_usertrack 模块在生成会话 ID 时使用了可预测的信息，包括主机 IP 地址、系统时间和服务器进程 ID。本地攻击者通过观察或获取这些可预测因素，能够推算出其他用户（如管理员）的会话 ID，从而在未授权的情况下劫持会话并绕过身份认证机制。该漏洞影响范围有限，攻击者需具备本地系统访问权限，CVSS 评分 2.1，危害等级低。"
published = "2001-12-31T05:00:00Z"
remediation = "Apache 1.3.x 已于 2010 年停止维护，官方不再发布安全更新。建议立即升级至 Apache 2.4.x 或更高版本。如无法升级，可在 httpd.conf 中注释或删除 `LoadModule usertrack_module` 行以禁用 mod_usertrack 模块，改用基于数据库或 Redis 的会话管理方案。若必须使用 mod_usertrack，设置 `CookieStyle Cookie` 并配合 `CookieTracking on` 限制其使用范围，同时确保服务器通过 NTP 同步时间并避免在公网暴露会话 ID。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Apache HTTP Server mod_usertrack 可预测 Session ID 安全绕过漏洞"
updated = "2026-06-16T21:56:27Z"

