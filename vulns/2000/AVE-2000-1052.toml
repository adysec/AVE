[basic]
description = "shred 1.0 文件安全擦除工具存在文件覆盖逻辑缺陷，该工具在打开目标文件进行覆写时未能正确设置打开模式，且在写入后未及时刷新缓冲区，导致实际磁盘数据未被真正替换。本地攻击者可利用此漏洞，通过磁盘扫描或文件恢复工具还原已被 shred 处理过的敏感文件，造成信息泄露。该漏洞影响 Linux/Unix 系统中使用 shred 1.0 版本的环境，攻击者需具备本地系统访问权限，攻击复杂度低。"
published = "2000-12-11T05:00:00Z"
remediation = '立即停止使用 shred 1.0，该软件已不再维护。修复方法：将 shred.c 中 overwrite() 函数的 fopen 参数从 "w" 改为 "r+"（避免打开时截断文件），并在 fclose() 前添加 sync() 调用确保缓冲区刷新到磁盘。建议改用 GNU coreutils 中的 shred（shred --remove 命令）或 wipe 等维护中的安全删除工具替代。'
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "GNU Coreutils shred 文件覆写失败导致信息泄露漏洞"
updated = "2026-06-16T21:52:58Z"

