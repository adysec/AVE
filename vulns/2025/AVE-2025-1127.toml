[basic]
description = "Linux内核spufs_create_context()函数中存在引用计数泄漏漏洞。该漏洞源于2008年泄漏修复遗漏了一种边界情况：当进程尝试设置CPU亲和性（affinity）且spufs_mkdir()调用失败时，代码未正确释放neighbor对象的引用，导致内核内存无法被回收。该漏洞影响包含SPUFS文件系统支持的Linux内核版本，攻击者需要具备本地访问权限和低权限用户身份即可触发，无需用户交互。持续触发该漏洞可导致内核内存泄漏，造成系统资源耗尽和拒绝服务。"
published = "2025-04-16T15:16:01Z"
remediation = "升级 Linux 内核至已修复版本：Ubuntu 24.04 LTS 升级到 6.8.0-86.87、22.04 LTS 升级到 6.8.0-86.87~22.04.1、20.04 LTS 升级到 5.15.0-142.152（需 Ubuntu Pro）、18.04 LTS 升级到 5.4.0-218.238（需 Ubuntu Pro）；Debian 12 (bookworm) 升级到 6.1.135-1、Debian 11 (bullseye) 升级到 6.1.137-1~deb11u1。临时缓解措施：通过 chmod 700 /spu 限制普通用户对 SPU 文件系统的访问权限，或在内核启动参数中禁用 spufs 模块（若硬件支持）。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 SPUFS 内存泄漏漏洞"
updated = "2026-06-17T08:44:59Z"

