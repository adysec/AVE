[info]
author = "AVE"
description = "检测目标是否运行 Microsoft Excel 相关服务，通过 HTTP 请求识别 Excel 产品存在性，辅助判断漏洞影响范围"
id = "POC-AVE-2025-0844"
name = "CVE-2025-21381 Microsoft Excel 远程代码执行漏洞 PoC"
severity = "high"
tags = ["ave-2025-0844"]
vuln_id = [
    "CVE-2025-21381",
    "AVE-2025-0844",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["excel"]
