[basic]
description = "Windows Win32k 内核组件在处理内存对象时存在特权提升漏洞，本地攻击者可通过构造恶意调用触发内存对象处理逻辑错误，从低权限提升至 SYSTEM 权限。该漏洞影响 Windows 7/8.1/10 及 Server 2008 R2/2012/2016/2019 等版本，CVSS 3.1 评分 7.8 (HIGH)，攻击向量为本地、低攻击复杂度、低权限、无需用户交互，成功利用可导致系统完全被攻陷（机密性/完整性/可用性均高影响）。该漏洞已被列入 CISA 已知被利用漏洞目录，野外存在活跃利用，ExploitDB (46920) 及多个 GitHub 仓库均有公开 PoC/EXP 代码，Microsoft 已于 2019 年 4 月安全更新中修复。"
published = "2019-04-09T21:29:01Z"
remediation = "建议立即安装微软 2019 年 4 月安全更新（KB4493472、KB4493467、KB4493448 等对应版本补丁），通过 Windows Update 自动更新或从 Microsoft Update Catalog 手动下载对应系统版本补丁（Win7 SP1/Server 2008 R2 安装 KB4493472，Win8.1/Server 2012 R2 安装 KB4493467，Win10 1809/Server 2019 安装 KB4493448）。无法立即打补丁时，可通过组策略禁用 Win32k.sys 相关字体解析功能或限制普通用户运行未受信程序作为临时缓解。建议尽快部署补丁并重启系统生效。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Win32k 特权提升漏洞"
updated = "2026-06-17T02:08:56Z"

