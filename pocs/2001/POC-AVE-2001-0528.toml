[info]
author = "ave"
description = "检测 Bugzilla 登录页面是否使用 GET 方式提交表单，导致用户名和密码暴露在 URL 查询参数中，可被 Web 服务器日志记录或肩窥窃取"
id = "POC-AVE-2001-0528"
name = "Bugzilla 2.14 之前版本 URL 凭据泄露 PoC"
severity = "high"
tags = ["ave-2001-0528"]
vuln_id = [
    "CVE-2001-1403",
    "AVE-2001-0528",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/query.cgi"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Bugzilla",
    "query.cgi",
    "bug_id",
]
