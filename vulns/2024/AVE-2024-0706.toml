[basic]
description = 'Howyar 的 UEFI 应用程序 "Reloader"（32位和64位版本）存在安全功能绕过漏洞，其硬编码路径允许加载并执行未经数字签名的软件。本地攻击者利用管理员权限可将未签名的恶意 UEFI 应用放入该固定路径，从而绕过 Secure Boot 安全启动机制，在系统启动早期阶段执行任意未授权代码，完全破坏平台的可信启动链。该漏洞影响使用 Howyar Reloader 的 Windows 系统，CVSS 评分 8.2，危害等级高。'
published = "2025-01-14T14:15:34Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新（包含 KB5049981），该更新已将存在漏洞的 reloader.efi（哈希值 cdb7c90d3ab8833d5324f5d8516d41fa990b9ca721fe643fffaef9057d9f9e48 和 e9e4b5a51f6a5575b9f5bfab1852b0cb2795c66ff4b28135097cba671a5491b9）加入 UEFI 吊销列表（dbx）。同时将 Howyar SysReturn 升级至 10.2.023_20240919 及以上版本，Greenware GreenGuard 升级至 10.2.023-20240927 及以上版本，Radix SmartRecovery 升级至 11.2.023-20240927 及以上版本，Sanfong EZ-back System 升级至 10.3.024-20241127 及以上版本，WASAY eRecoveryRX 升级至 8.4.022-20241127 及以上版本，CES NeoImpact 升级至 10.1.024-20241127 及以上版本，SignalComputer HDD King 升级至 10.3.021-20241127 及以上版本。在 Windows 上以管理员权限运行 PowerShell 命令 `[System.Text.Encoding]::ASCII.GetString((Get-SecureBootUEFI db).bytes) -match 'Microsoft Corporation UEFI CA 2011'` 检查是否受影响，以及 `[BitConverter]::ToString((Get-SecureBootUEFI dbx).bytes) -replace '-' -match 'cdb7c90d3ab8833d5324f5d8516d41fa990b9ca721fe643fffaef9057d9f9e48'` 检查保护是否生效。在 Linux 上使用 `dbxtool --list | grep 'cdb7c90d3ab8833d5324f5d8516d41fa990b9ca721fe643fffaef9057d9f9e48'` 确认吊销已应用。作为临时缓解措施，限制对 EFI 系统分区（ESP）的写入权限，仅允许管理员访问，并启用安全产品对 ESP 文件修改的监控告警。"
score = 8.2
severity = "HIGH"
sources = ["msrc"]
title = "Howyar UEFI Reloader 安全启动绕过漏洞"
updated = "2026-06-17T08:19:54Z"

