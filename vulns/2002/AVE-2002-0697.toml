[basic]
description = "CGIscript.net csMailto.cgi 程序将用户反馈信息导出到 Web 文档根目录下可被直接访问的文件中，导致未经身份认证的远程攻击者可通过直接请求该文件路径获取网站收集的敏感信息。该漏洞影响所有部署并使用该 CGI 脚本来处理表单反馈的网站，攻击条件要求目标系统在 Web 根目录下存在由 csMailto.cgi 生成的反馈文件且未做访问控制。攻击者无需任何凭据，仅通过构造直接的文件访问 URL 即可读取反馈内容，CVSS v2 评分为 5.0，属于中等危重级别。该漏洞最早于 2002 年 4 月被公开披露。"
published = "2002-08-12T04:00:00Z"
remediation = "立即删除或禁用服务器上的 csMailto.cgi 脚本，并检查 Web 文档根目录及子目录，彻底清除由该脚本导出的反馈文件。如业务确有表单反馈需求，应改用其他安全的 CGI 程序，并将输出目录设置为 Web 根目录之外的不可直接访问路径，同时通过 Web 服务器配置禁止对 .cgi 目录的匿名访问。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "CGIscript.net csMailto 信息泄露漏洞"
updated = "2026-06-16T21:58:04Z"

