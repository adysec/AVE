[basic]
description = "Windows 系统的 Win32k 内核组件在处理内存对象时存在缺陷，未经充分验证即可操作内存对象，攻击者可利用此漏洞实现权限提升。该漏洞影响 Windows 7 SP1、Windows Server 2008/2008 R2 SP2/SP1 等多个版本，CVSS 评分 7.8，危害等级为高。攻击者需在目标系统上拥有低权限账户，无需用户交互即可在本地触发漏洞，通过构造特制请求利用内存处理缺陷将权限提升至 SYSTEM 级别，从而完全控制受影响系统。该漏洞已有公开利用代码，CISA 已将其列入已知被利用漏洞目录，Microsoft 已在 2019 年 7 月安全更新中发布修复补丁。"
published = "2019-07-15T19:15:21Z"
remediation = "立即安装 Microsoft 2019 年 7 月安全更新（月度安全汇编），该更新修复了 Win32k 组件的内存对象处理缺陷。受影响系统包括 Windows 7 SP1、Windows Server 2008 SP2 及 Windows Server 2008 R2 SP1，应通过「设置 → 更新与安全 → Windows 更新 → 检查更新」下载并安装对应版本的累积更新补丁（详见 https://portal.msrc.microsoft.com/en-US/security-guidance/advisory/CVE-2019-1132）。如暂无法安装补丁，可采取临时缓解措施：限制普通用户在目标系统上的本地登录权限，避免在受信任环境中运行来源不明的应用程序，通过本地安全策略禁用或卸载高风险字体驱动文件（如 eot、otf 等），并在系统启动配置中启用驱动签名强制执行（执行 bcdedit /set testsigning off 命令），以降低漏洞被利用的风险。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Win32k 特权提升漏洞"
updated = "2026-06-17T02:27:53Z"

