[basic]
description = "PHP IMAP 扩展的 imap_do_open 函数存在双重释放漏洞，攻击者可通过精心构造的 IMAP 连接参数触发内存损坏，导致拒绝服务甚至任意代码执行。影响 PHP 5.2.15 之前的 5.2.x 版本和 5.3.4 之前的 5.3.x 版本。攻击者需能发起 IMAP 连接请求，无需身份认证即可远程利用。该漏洞源于 IMAP 扩展在处理连接时对内存资源管理不当，重复释放同一内存块导致堆损坏。"
published = "2010-12-07T22:00:02Z"
remediation = "立即升级PHP到安全版本：如果使用PHP 5.2.x，请升级到5.2.15或更高版本；如果使用PHP 5.3.x，请升级到5.3.4或更高版本。升级时，请确保关闭不必要的IMAP函数或限制对imap_do_open的访问，同时更新相关PHP扩展到最新安全补丁版本。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "PHP IMAP扩展双重释放拒绝服务漏洞"
updated = "2026-06-16T23:24:12Z"

