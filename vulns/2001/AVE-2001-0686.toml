[basic]
description = "bftpd 1.0.13 存在缓冲区溢出漏洞，远程攻击者可通过向 FTP 服务发送超长的 SITE CHOWN 命令触发该漏洞，导致目标服务崩溃（拒绝服务），并可能进一步利用该漏洞执行任意命令。该漏洞影响 bftpd 1.0.13 及更早版本，攻击无需身份认证，CVSS 评分 10.0，危害等级严重。建议用户升级至最新版本以修复此漏洞。"
published = "2001-02-12T05:00:00Z"
remediation = "立即升级 bftpd 至 1.0.14 或更高版本（当前最新稳定版为 6.7），该漏洞已在后续版本中修复。从 https://sourceforge.net/projects/bftpd/files/bftpd/ 下载新版源码编译安装。如无法升级，可在 ftp 配置文件中禁用 SITE CHOWN 命令，或在防火墙限制对 FTP 服务端口的访问。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "bftpd 1.0.13 SITE CHOWN 命令缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:35Z"

