[basic]
description = "QNX Voyager Web Server 2.01B 版本（随 QNX 405 演示光盘发布）中的 Embedded Resource Manager 存在信息泄露漏洞。远程攻击者无需身份认证即可通过访问 embedded.html 页面获取系统敏感统计信息，如 CPU 使用率、内存状态、进程列表等。该漏洞利用条件简单，攻击者只需能够网络访问目标服务器的 HTTP 服务即可实施，可能导致系统内部信息暴露，为进一步攻击提供情报支持。"
published = "2000-12-19T05:00:00Z"
remediation = "QNX Voyager webserver 2.01B 已停止维护，建议升级到受支持的 QNX 版本或替换为其他 Web 服务器。如无法升级，可在 Web 服务器配置中限制对 embedded.html 页面的访问，或通过防火墙规则限制对 80 端口的非授权访问。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "QNX Voyager Webserver 敏感信息泄露漏洞"
updated = "2026-06-16T21:52:43Z"

