[basic]
description = "ISC DHCPD（DHCP 守护进程）3.0 至 3.0.1rc8 版本中，动态 DNS 更新功能的日志记录模块（print.c）存在格式字符串漏洞。当启用 NSUPDATE 选项时，远程恶意 DNS 服务器可通过在 DNS 响应中注入特制格式字符串，触发该漏洞，导致任意代码执行。攻击者无需身份认证即可远程利用，CVSS 评分 10.0，危害等级严重。受影响的系统需升级至 ISC DHCPD 3.0.1rc9 或更高版本以修复此漏洞。"
published = "2002-07-26T04:00:00Z"
remediation = "立即升级 ISC DHCPD 至 3.0.1rc9 或更高版本，该版本已修复 print.c 中动态 DNS 日志记录的格式字符串漏洞。各发行版用户请安装对应安全补丁：Caldera OpenLinux (CSSA-2002-028)、Mandrake Linux (MDKSA-2002-037)、SuSE Linux (SuSE-SA:2002:019)。如无法立即升级，可在 dhcpd.conf 中注释或移除 `ddns-update-style` 和 `ddns-updates` 相关配置以禁用 NSUPDATE 功能，并在防火墙层面限制 DHCPD 仅与受信任的 DNS 服务器通信作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "ISC DHCPD 远程格式字符串漏洞"
updated = "2026-06-16T21:57:58Z"

