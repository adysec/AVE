[basic]
description = "MERCUR MailServer 的 Control-Service 组件存在缓冲区溢出漏洞，远程攻击者可通过向该服务发送超长密码字符串触发缓冲区溢出，导致任意代码执行。该漏洞影响 MERCUR MailServer 3.3/4.0/4.2 版本，CVSS 评分 7.5，危害等级高。攻击者无需身份认证即可远程利用，成功利用后可完全控制受影响系统。"
published = "2002-10-04T04:00:00Z"
remediation = "立即将 MERCUR MailServer 升级至 4.2.0.0 以上版本（如 4.3 或更高），或迁移至仍在维护的邮件服务器软件。如无法升级，在防火墙层面将控制服务端口（TCP 32000）限制为仅允许受信任管理 IP 访问，并禁用不必要的远程管理功能。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "MERCUR MailServer Control-Service 缓冲区溢出漏洞"
updated = "2026-06-16T21:58:40Z"

