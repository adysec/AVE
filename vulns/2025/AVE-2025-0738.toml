[basic]
description = "Microsoft Edge（基于 Chromium）存在类型混淆（Type Confusion）远程代码执行漏洞，漏洞源于 Chromium 内核在处理特定对象时未能正确验证类型，导致内存访问越界。远程攻击者可通过构造特制的恶意网页并诱使用户在受影响浏览器中访问，成功利用该漏洞可在当前用户上下文中执行任意代码，导致敏感信息泄露。该漏洞影响 Microsoft Edge 133.0.3065.51 之前版本，CVSS 评分 6.5，危害等级中危。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-06T23:15:09Z"
remediation = "立即将 Microsoft Edge 升级至 133.0.3065.51 或更高版本。可通过浏览器内置更新（设置→关于 Microsoft Edge→检查更新）自动下载安装，或从 Microsoft 官网手动下载最新稳定版。企业用户可通过组策略配置自动更新策略，确保终端及时接收安全补丁。作为临时缓解措施，可配置浏览器安全策略禁用不信任的扩展程序，并提醒用户勿点击可疑链接。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Edge 远程代码执行漏洞"
updated = "2026-06-17T08:42:58Z"

