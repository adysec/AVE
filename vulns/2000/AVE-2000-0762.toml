[basic]
description = 'tags.<value>Allaire JRun 3.0 是一款 Java Servlet 服务器。该服务器在处理 HTTP 请求时存在目录泄露漏洞。攻击者通过在请求路径的起始位置添加额外的斜杠（即"前导斜杠"），可绕过正常访问控制，直接访问服务器 WEB-INF 目录下的敏感文件。该目录通常存放 web.xml 配置文件、类文件及其他不应对外公开的应用程序资源。漏洞影响安装了 Allaire JRun 3.0 版本的系统，攻击者无需身份认证即可远程发起利用，可导致敏感配置信息泄露，进而为后续攻击提供信息支持。'
published = "2000-12-11T05:00:00Z"
remediation = "建议立即升级到 Allaire JRun 3.0 SP1 或更高版本，该版本修复了额外的斜杠导致的目录泄露漏洞。如无法立即升级，可通过Web应用服务器配置文件中禁用对WEB-INF目录的直接访问作为临时缓解措施。此外，确保禁用所有未使用的servlet并验证应用服务器的安全配置，防止路径遍历攻击。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Allaire JRun 3 目录泄露漏洞"
updated = "2026-06-16T21:53:03Z"

