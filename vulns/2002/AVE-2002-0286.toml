[basic]
description = "Ecometry SGDynamo 5.32、6.1 及 7.0 版本的 sgdynamo.exe 模块存在跨站脚本（XSS）漏洞。该漏洞的原理是程序在处理 HTTP 请求时，未对 HTNAME 参数输入的内容进行严格的过滤与转义，导致远程攻击者可以通过构造包含恶意 JavaScript 代码的特定 URL，诱导目标用户访问并触发脚本执行。攻击者可借此在受害者的浏览器上下文中运行任意代码，从而导致敏感 Cookie 泄露、会话劫持或页面篡改。影响范围覆盖上述所有受影响版本，攻击条件为目标用户点击攻击者发送的恶意链接。"
published = "2002-05-29T04:00:00Z"
remediation = "由于该产品版本过旧且厂商已停止维护，建议立即停止使用 Ecometry SGDynamo 5.32/6.1/7.0 版本。若必须继续运行，应在 Web 应用防火墙 (WAF) 或反向代理层配置过滤规则，拦截包含 `<script>` 标签或恶意 JavaScript 伪协议的 `HTNAME` 参数请求，以缓解跨站脚本攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Ecometry Sgdynamo 跨站脚本攻击漏洞"
updated = "2026-06-16T21:57:18Z"

