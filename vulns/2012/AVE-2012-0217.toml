[basic]
description = "Mozilla Firefox/Thunderbird/SeaMonkey 的 Gecko 布局引擎中 ElementAnimations::EnsureStyleRuleFor 函数存在内存安全漏洞。远程攻击者可通过构造恶意网页诱导用户访问，触发缓冲区过度读取、错误指针解引用及堆缓冲区溢出，导致拒绝服务或可能执行任意代码。该漏洞影响 Firefox 4.x 至 13.0、Firefox ESR 10.0.6 之前版本、Thunderbird 5.0 至 13.0、Thunderbird ESR 10.0.6 之前版本及 SeaMonkey 2.11 之前版本，CVSS 评分 9.3，危害等级严重。Mozilla 已在 Firefox 14.0 及相应更新中修复此漏洞。"
published = "2012-07-18T10:26:48.737"
remediation = "升级 Firefox 至 14.0 及以上版本，Firefox ESR 升级至 10.0.6 及以上版本；Thunderbird 升级至 14.0 或 ESR 10.0.6 及以上版本；SeaMonkey 升级至 2.11 及以上版本。如无法立即升级，可在浏览器中禁用 JavaScript 并启用内容安全策略（CSP）作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 内存安全远程代码执行漏洞"
updated = "2026-06-16T23:40:38.943"

