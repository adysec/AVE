[basic]
description = "Microsoft Windows Media Player 7.0 在处理 Active Stream Redirector（.ASX）文件时存在缓冲区溢出漏洞。远程攻击者可通过诱使目标用户打开特制的 .ASX 文件，触发内存缓冲区边界溢出，进而执行任意命令。该漏洞影响安装 Windows Media Player 7.0 的 Windows 系统，攻击条件宽松，无需身份认证即可远程利用，攻击复杂度低，成功利用可导致攻击者在目标系统上执行任意代码，造成信息泄露、权限提升或系统控制等严重后果。Microsoft 已在后续安全更新中修复该漏洞，建议用户升级到最新版本以消除风险。"
published = "2001-01-09T05:00:00.000"
remediation = "安装 Microsoft 安全公告 MS00-090 发布的补丁，该补丁对 .ASX 文件解析器实施正确的边界检查以消除缓冲区溢出。Windows Media Player 6.4 用户可从 https://www.microsoft.com/download/details.aspx?FamilyId=9B94D3F0-9CF3-4A5F-8215-A221DDD923B0 下载补丁，Windows Media Player 7 用户可从 https://www.microsoft.com/download/details.aspx?FamilyId=BAF62356-D717-4B8F-97E0-299A7697A083 下载对应版本补丁，详细安装步骤参见 Microsoft 知识库文章 KB280419。如无法立即安装补丁，可临时通过 Internet Explorer 安全区域设置禁用 Internet 区域的 ActiveX 控件自动调用，以阻止恶意 .ASX 文件被自动打开执行；同时避免打开来源不明的 .ASX 文件，不要预览或双击未经验证的 Active Stream Redirector 文件。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Microsoft Windows Media Player 7.0 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:10.483"

