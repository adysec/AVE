[basic]
description = "QSSL Voyager 2.0 1B Web 服务器存在目录遍历漏洞，该漏洞存在于 QNX 405 演示磁盘附带的 Voyager Web 服务器中。远程攻击者无需身份认证即可通过向目标发送包含 `..`（点点）序列的特制 HTTP 请求，利用路径遍历技术突破目录限制，读取服务器文件系统上的任意文件，导致敏感信息泄露。攻击条件低，仅需网络可达即可利用。"
published = "2000-12-19T05:00:00.000"
remediation = "QSSL Voyager 2.01B 为 QNX 405 演示光盘附带的演示用途 Web 服务器，不应用于生产环境。建议立即移除或禁用 Voyager Web 服务器，改用支持安全配置的正式 Web 服务器产品。如必须使用，应在防火墙层面限制对 Web 服务端口（默认 80）的访问来源，仅允许可信 IP 访问。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "QSSL Voyager 2.0 1B 目录遍历漏洞"
updated = "2026-06-16T21:52:43.710"

