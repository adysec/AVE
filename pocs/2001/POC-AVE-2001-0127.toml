[info]
author = "ave"
description = "验证 Joe Text Editor 2.8 的 .joerc 本地命令执行漏洞。该编辑器在当前工作目录搜索 .joerc 配置文件而非仅从用户主目录加载，攻击者可在共享目录放置恶意 .joerc 文件，当其他用户从该目录执行 joe 时，恶意配置中的命令将被自动执行，导致任意命令执行与本地权限提升。"
id = "POC-AVE-2001-0127"
name = "CVE-2001-0289 Joe Text Editor .joerc Local Command Execution PoC"
severity = "medium"
tags = ["ave-2001-0127"]
vuln_id = [
    "CVE-2001-0289",
    "AVE-2001-0127",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
