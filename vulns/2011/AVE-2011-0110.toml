[basic]
description = "Adobe Flash Player 存在内存破坏漏洞，由于程序在处理未指定向量时未能正确验证内存边界，导致内存损坏。远程攻击者可通过诱导用户访问恶意网页或打开特制文件触发该漏洞，成功利用后可实现任意代码执行或拒绝服务。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上的 Flash Player 10.3.183.11 之前版本和 11.1.102.55 之前版本，以及 Adobe AIR 3.1.0.4880 之前版本，CVSS 评分 10.0，危害等级严重。Adobe 已发布安全更新修复此漏洞。"
published = "2011-11-11T16:55:01Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.11 或 11.1.102.55 及以上版本，Adobe AIR 升级至 3.1.0.4880 及以上版本。如无法升级，在浏览器中禁用 Flash 插件或使用 Chrome 内置 Flash 的自动更新功能。由于 Adobe Flash 已于 2020 年底停止支持，建议彻底卸载 Flash Player 并迁移至 HTML5 技术栈。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:31:21Z"

