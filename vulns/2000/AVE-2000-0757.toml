[basic]
description = "BlackBoard CourseInfo 4.0 存在身份验证漏洞，无法对用户进行有效验证，导致攻击者可直接调用支持的 CGI 程序（如 user_update_passwd.pl 和 user_update_admin.pl）等安全组件，绕过认证机制来篡改 CourseInfo 数据库中的信息并获取更高的系统权限。该漏洞影响 BlackBoard 4.0 及更高版本，攻击者在本地或远程均可利用相关 CGI 程序未经授权访问系统，窃取敏感信息或进一步横向移动，造成严重的权限管理风险。漏洞 CVSS 评分 7.5，危害等级高。"
published = "2000-07-18T04:00:00Z"
remediation = "建议立即升级 BlackBoard CourseInfo 至 4.0.1 或更高版本（已修复 CGI 认证绕过漏洞），或在 Web 服务器层面通过 .htaccess 或 web.config 限制 user_update_passwd.pl、user_update_admin.pl 等 CGI 脚本仅允许授权 IP 访问，同时在应用层添加严格的用户身份验证与权限校验，临时缓解可禁用相关 CGI 脚本执行权限。立即联系 BlackBoard（现 Anthology）获取官方补丁包。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "BlackBoard CourseInfo 4.0 认证绕过导致权限提升和数据库信息修改漏洞"
updated = "2026-06-16T21:52:08Z"

