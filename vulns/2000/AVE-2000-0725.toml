[basic]
description = "Hilgraeve HyperTerminal 6.0 的 Telnet 客户端存在缓冲区溢出漏洞，远程攻击者可通过向目标系统发送超长 telnet URL 触发该漏洞，导致任意命令执行。该漏洞影响 Windows 98、Windows ME 及 Windows 2000 系统，攻击者无需身份认证即可远程利用，危害严重。目前已公开的 ExploitDB 条目提供了完整的利用代码。"
published = "2000-12-19T05:00:00Z"
remediation = "立即卸载或禁用 Hilgraeve HyperTerminal 组件，该软件已停止维护且不再有安全更新。对于仍运行 Windows 98/ME/2000 的系统，应升级至受支持的 Windows 版本（如 Windows 10/11），并在升级前通过组策略或注册表禁用 Telnet 协议关联，避免自动触发 telnet:// URI 处理。如业务必须使用终端模拟功能，建议替换为第三方维护的替代方案（如 PuTTY 或 MobaXterm）。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Hilgraeve HyperTerminal Telnet 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:55Z"

