[basic]
description = "kdbg 1.1.0 至 1.2.8 版本存在本地权限提升漏洞，该程序未对 .kdbgrc 配置文件实施权限检查。.kdbgrc 作为 kdbg 调试器的用户配置文件，存储了自定义运行参数，程序在启动时会自动读取并执行其中嵌入的指令。本地攻击者可在目标用户的目录下修改此配置文件并注入恶意命令，当该用户随后启动 kdbg 时，程序会在用户权限下自动执行这些命令，从而实现任意代码执行。该漏洞影响所有运行受影响版本 kdbg 的 Linux 系统，CVSS 评分 4.6，危害等级较低。攻击者必须具备目标主机的本地访问权限才能利用此漏洞，在多人共享的 KDE 桌面环境中风险尤为突出。"
published = "2003-09-07T04:00:00Z"
remediation = "升级到 KDbg 1.2.9 或更高版本，该版本修复了 .kdbgrc 文件权限检查缺失问题，可防止本地用户在程序所在目录为世界可写时注入恶意命令。Ubuntu 用户可通过 apt 更新到 kdbg 2.0.2-1ubuntu1 或更高版本。如无法立即升级，可临时将调试程序所在目录的权限设为仅所有者可写，并确保 .kdbgrc 文件不被其他用户写入，以降低被注入恶意命令的风险。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "KDE kdbg 本地代码执行漏洞"
updated = "2026-06-16T22:02:34Z"

