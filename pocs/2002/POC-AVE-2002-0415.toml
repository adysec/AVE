[info]
author = "ave"
description = "检测 IBM AIX 系统上 lsmcode 诊断工具是否存在，该工具在处理超长 LSMCODE 环境变量时存在本地缓冲区溢出漏洞（CVE-2002-0747），攻击者可通过设置超长环境变量触发栈溢出，实现本地权限提升至 root"
id = "POC-AVE-2002-0415"
name = "IBM AIX lsmcode LSMCODE 环境变量本地缓冲区溢出 PoC"
severity = "critical"
tags = ["ave-2002-0415"]
vuln_id = [
    "CVE-2002-0747",
    "AVE-2002-0415",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/usr/lpp/diagnostics/bin/lsmcode"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = ".+"
type = "regex"
