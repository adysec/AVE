[basic]
description = 'tags.<value>Caucho Resin 1.2.2 存在目录遍历漏洞，远程攻击者无需身份认证即可通过向服务器发送包含 "\.."（点号点号）序列的特制 URL 请求，突破 Web 根目录限制读取服务器上的任意文件。该漏洞影响运行 Caucho Resin 1.2.2 版本的 Web 服务器，攻击者可利用此漏洞获取敏感配置文件、密码文件等系统文件内容，造成信息泄露。由于攻击复杂度低且无需任何认证凭据，攻击者只需构造包含目录遍历序列的 HTTP 请求即可成功利用。'
published = "2001-05-03T04:00:00Z"
remediation = '将 Caucho Resin 从 1.2.2 升级至 1.2.3 或更高版本，该版本已修复 URL 路径中 "\.."（点号）未过滤导致的目录遍历漏洞。若短期内无法升级，可在前端 Web 服务器（如 Apache 或 Nginx）层配置规则，拦截请求 URL 中包含 ".." 或 "%2e%2e" 字符的请求，作为临时缓解措施。由于 Resin 1.2.x 已停止维护且存在多个已知安全缺陷，建议尽快迁移至 Resin 当前受支持的稳定版本（如 Resin 4.x 或 5.x），并定期应用安全补丁。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Caucho Resin 目录遍历漏洞"
