[info]
author = "AVE"
description = "Mozilla/Netscape 浏览器 URL 空字符注入 Cookie 窃取漏洞验证。通过构造包含十六进制编码空字符（%00）的链接，检测浏览器是否错误解析跨域 URL 导致 Cookie 泄露。"
id = "POC-AVE-2002-0421"
name = "CVE-2002-2013 PoC"
severity = "medium"
tags = ["cve-2002-2013"]
vuln_id = [
    "CVE-2002-2013",
    "AVE-2002-0421",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["%00"]
