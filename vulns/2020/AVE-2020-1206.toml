[basic]
description = "Oracle WebLogic Server 的 Core 组件存在 Java 反序列化漏洞，该漏洞是对 CVE-2020-2555 安全补丁的绕过。未经身份认证的远程攻击者可通过 T3 或 IIOP 协议向目标服务器发送特制的序列化数据，利用 ReflectionExtractor 或 MvelExtractor/UniversalExtractor 构造新的 Gadget Chain 绕过反序列化黑名单，最终在服务器上执行任意代码并完全接管 WebLogic Server。该漏洞影响 Oracle WebLogic Server 10.3.6、12.1.3、12.2.1.3 和 12.2.1.4 版本，CVSS 评分 9.8，攻击复杂度低，无需用户交互，只要攻击者能够通过网络访问目标服务器的 T3 或 IIOP 端口即可利用。"
published = "2020-04-15T14:15:33.513"
remediation = "立即升级到最新版本的Oracle Weblogic Server（12.2.1.4.0或更高版本），并应用最新的安全补丁。通过Weblogic控制台禁用不必要的T3协议服务，或配置防火墙仅允许受信任IP地址访问Weblogic端口。如无法立即升级，建议将Weblogic服务移出互联网直接部署于内部网络，并开启详细访问日志以监控异常行为。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Oracle WebLogic Server T3 协议远程代码执行漏洞"
updated = "2026-06-17T03:13:10.183"

