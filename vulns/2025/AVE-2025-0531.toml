[basic]
description = "Google Chrome V8 JavaScript引擎存在实现不当漏洞（CWE-787 越界写入），攻击者可通过诱导用户访问精心构造的恶意HTML页面触发堆损坏，进而可能实现远程代码执行。该漏洞影响 Google Chrome 142.0.7444.137 之前版本，CVSS 3.1 评分 8.8（HIGH），攻击向量为网络、攻击复杂度低、无需权限但需要用户交互、影响机密性/完整性/可用性均为高。攻击者需诱导受害者访问恶意页面即可触发漏洞，Google 已在 Chrome 142.0.7444.137 版本中修复此漏洞。"
published = "2025-11-10T20:15:39Z"
remediation = "建议立即升级到 Google Chrome 142.0.7444.137 或更高版本，如无法立即更新，可通过 Windows Update 启用自动更新功能进行补丁安装。如需临时缓解措施，可在防火墙层面阻止不安全的 Web 页面渲染功能。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 实现不当导致堆缓冲区溢出漏洞"
updated = "2026-06-17T08:32:51Z"

