[basic]
description = "Galacticomm Worldgroup Web Server 3.20 及更早版本存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过发送超长 HTTP GET 请求触发该漏洞，导致服务拒绝服务甚至执行任意代码。该漏洞源于 Web 服务器对 HTTP 请求长度缺乏边界检查，攻击者可构造恶意长请求溢出缓冲区，破坏程序控制流。CVSS 评分 10.0（严重级），影响系统的机密性、完整性和可用性，攻击者可完全控制受影响服务器。"
published = "2002-06-25T04:00:00Z"
remediation = "建议立即停止使用 Galacticomm Worldgroup 3.20 及更早版本，迁移至现代维护中的 Web 服务器软件（如 Apache、Nginx 或 IIS），该软件厂商已停业无官方补丁。临时缓解措施：在防火墙层面限制 Web 服务端口（默认 80/443）仅允许可信 IP 访问，或在 WAF/反向代理层配置规则拦截超长 HTTP GET 请求（URL 长度 > 2048 字符），并监控异常流量。建议尽快完成业务迁移至受维护的现代平台。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Galacticomm Worldgroup Web Server 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:57:14Z"

