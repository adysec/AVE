[basic]
description = "Apache 1.3.12 在 SuSE Linux 6.4 默认配置中启用了 WebDAV 模块，远程未认证攻击者可通过发送 PROPFIND HTTP 请求方法遍历并列举服务器上任意目录内容，导致敏感目录结构信息泄露。该漏洞影响搭载 SuSE Linux 6.4 默认 Apache 1.3.12 的服务器，CVSS 评分 5.0（中等），攻击向量为网络、攻击复杂度低、无需认证、仅影响机密性。攻击者仅需发送恶意构造的 PROPFIND 请求即可枚举目录结构，获取敏感文件路径信息，进而辅助后续攻击。建议升级 Apache 版本或禁用不必要的 WebDAV 模块并限制 PROPFIND 方法访问。"
published = "2000-11-14T05:00:00.000"
remediation = "升级 Apache 至 1.3.14 或更高版本（已修复 WebDAV 默认开启问题），或在 httpd.conf 中注释掉 LoadModule dav_module 和 LoadModule dav_fs_module 以禁用 WebDAV 模块；若必须使用 WebDAV，请在 <Directory> 配置中添加 <Limit PROPFIND> Require all denied </Limit> 限制 PROPFIND 方法访问，并配置防火墙限制 WebDAV 端口仅允许受信 IP 访问"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Apache HTTP Server 1.3.12 WebDAV 目录遍历漏洞"
updated = "2026-06-16T21:52:38.377"

