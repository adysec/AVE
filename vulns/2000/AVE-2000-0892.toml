[basic]
description = "SuSE linuxnfs/knfsd 包中的 rpc.kstatd 服务存在字符串解析错误漏洞，远程未授权攻击者可通过发送特制的 RPC 请求触发缓冲区溢出或格式化字符串漏洞，进而以 root 权限执行任意代码。该漏洞影响 SuSE Linux 及其他使用 knfsd 包的 Linux 发行版，CVSS 评分 10.0（AV:N/AC:L/Au:N/C:C/I:C/A:C），属于最高危级别。攻击者无需任何身份认证即可远程利用，直接获取系统最高权限，建议立即升级至修复版本或禁用 rpc.kstatd 服务。"
published = "2000-10-20T04:00:00Z"
remediation = "立即升级到SuSE Linux Enterprise Server的7.0 SP3或更高版本，该版本修复了rpc.kstatd中的字符串解析漏洞。升级后确保使用root用户启动kstatd服务，并通过修改/etc/nfs/kstatd.conf文件禁用不安全的远程访问功能。如无法立即升级，可临时在防火墙上阻止源端口111的入站流量以缓解风险。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "SUSE knfsd rpc.kstatd 权限提升漏洞"
updated = "2026-06-16T21:52:30Z"

