[basic]
description = "Mistune Python Markdown 解析器在核心强调语法解析中存在算法复杂度漏洞（CWE-407）。默认配置下，解析器在处理长序列的 `**x**`（加粗）或 `***x***`（加粗+斜体）强调对时，会从每个潜在起始位置向前扫描匹配的结束标记，导致解析时间复杂度达到 O(N²)。未经身份认证的远程攻击者可通过提交 40KB 的恶意 Markdown 文本触发该漏洞，使服务器 CPU 占用率飙升（8000 次重复约 4.3 秒），结合并发请求可造成服务拒绝。该漏洞影响 Mistune 3.3.0 之前的所有版本，无需任何插件即可利用。"
published = "2026-07-08T17:17:28.183"
remediation = "升级 mistune 至 3.3.0 或更高版本（`pip install --upgrade mistune`）。如无法立即升级，可在调用 `mistune.create_markdown()` 前对用户输入长度设置上限（如限制输入不超过 10KB），或使用 CommonMark 兼容解析器（如 markdown-it-py）替代。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Mistune Markdown 解析器强调语法解析拒绝服务漏洞"
updated = "2026-07-09T19:39:58.870"

