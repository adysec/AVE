[basic]
description = "Prompty 加载器在解析 .prompty 文件前沿的 ${file:...} 引用时，未强制限制解析路径在授权目录内，导致路径遍历漏洞。攻击者可构造包含 ${file:../../../etc/passwd} 或 ${file:/etc/passwd} 等恶意路径的提示文件，诱导应用加载不可信的 .prompty 文件，触发任意文件读取，泄露进程可访问的本地敏感文件。影响 PyPI prompty ≤2.0.0b1、npm @prompty/core ≤2.0.0-beta.1、crates.io prompty ≤2.0.0-beta.1、NuGet Prompty.Core ≤2.0.0-beta.1，修复版本分别为 2.0.0b2/2.0.0-beta.2。CVSS 7.5 HIGH，网络攻击向量，低复杂度，无需权限与用户交互，高机密性影响。修复版本默认限制文件引用仅能解析在提示文件目录树内，绝对路径、.. 遍历、符号链接逃逸均被拒绝。"
published = "2026-07-16T16:19:12Z"
remediation = "升级 PyPI prompty 到 2.0.0b2 或更高版本，升级 npm @prompty/core 到 2.0.0-beta.2 或更高版本，升级 crates.io prompty 到 2.0.0-beta.2 或更高版本，升级 NuGet Prompty.Core 到 2.0.0-beta.2 或更高版本。升级后验证文件参考扩展已应用 canonicalization 验证，防止路径遍历。此外，请检查当前 .prompty 配置文件是否限制了 allowed_roots，确定合理的根目录，限制 ${file:...} 引用范围。请优先升级到修正版本，对无法立即升级的系统，请先进行网络层访问控制，将 .prompty 文件解析权限定为可信目录作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "微软 Prompty 任意文件读取漏洞"
updated = "2026-07-17T14:17:24Z"

