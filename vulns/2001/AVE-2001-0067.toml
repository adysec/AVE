[basic]
description = "CVE-2001-0173是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-05-03T04:00:00Z"
remediation = "建议将 qDecoder 库升级到 6.0 或更高版本（当前稳定版为 9.x），并重新编译依赖该库的 CGI 程序（如 CrazyWWWBoard、CrazySearch）以链接新库。如暂无法立即升级，可在 Web 服务器层通过 nginx 或 Apache 配置拒绝 Content-Type 头中 boundary 参数超过 254 字符的 multipart/form-data 请求，或在防火墙中限制对受影响 CGI 脚本的访问，同时将受影响服务运行在 chroot 或容器中以限制攻击影响范围。"
