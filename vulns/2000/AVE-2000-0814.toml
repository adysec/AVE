[basic]
description = "IBM AIX 4.3.x 及更早版本中的 enq 命令存在缓冲区溢出漏洞。enq 命令在处理 -M 参数时未对输入长度进行有效边界检查，本地用户通过向 -M 参数传递超长字符串可触发缓冲区溢出，从而覆盖内存中的关键数据，最终导致任意代码执行。该漏洞影响 IBM AIX 4.3.x 及之前版本，攻击者需拥有本地系统访问权限，利用难度较低。成功利用后攻击者可获取目标系统的完全控制权限，实现任意命令执行。目前已存在公开的本地利用程序（ExploitDB ID: 20454），进一步降低了利用门槛。"
published = "2001-01-09T05:00:00Z"
remediation = "立即安装 IBM 针对 APAR IX69619 发布的 PTF 补丁，或升级 AIX 系统至 4.3.3 Maintenance Level 及以上版本。如无法立即升级，可通过移除 enq 命令的 setuid 权限（chmod u-s /usr/bin/enq）作为临时缓解措施，但可能影响打印队列管理功能。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "IBM AIX enq 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:53:11Z"

