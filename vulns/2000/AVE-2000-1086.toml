[basic]
description = 'PTlink IRCD 3.5.3 及 PTlink Services 1.8.1 存在拒绝服务漏洞。远程攻击者无需身份认证即可通过网络向目标服务器发送特制的 "mode +owgscfxeb" 和 "oper" 命令，触发服务器内部处理异常，导致 IRC 服务进程崩溃，造成拒绝服务。该漏洞影响运行 PTlink IRCD 3.5.3 及 PTlink Services 1.8.1 的服务器，攻击条件低，仅需网络可达即可实施。'
published = "2001-01-09T05:00:00.000"
remediation = "升级 PTlink IRCD 至 3.5.4 或更高版本（若厂商已停止维护，建议迁移至 UnrealIRCd 或 InspIRCd 等活跃维护的 IRC 守护进程）。如无法立即升级，可在 IRC 服务器配置中限制 `/oper` 命令的访问来源（仅允许受信 IP 段），并禁用 `mode +owgscfxeb` 组合模式的解析，或通过防火墙规则限制对 IRC 端口的非必要访问作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "PTlink IRCD 及 Services 拒绝服务漏洞"
updated = "2026-06-16T21:53:09.077"

