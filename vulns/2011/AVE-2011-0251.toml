[basic]
description = "Google Chrome 17.0.963.46之前版本存在粘贴事件后剪贴板监控漏洞。远程攻击者可通过诱导用户执行粘贴操作，利用该漏洞监控剪贴板内容，导致敏感信息泄露。该漏洞影响Google Chrome 17.0.963.46之前的所有版本，攻击者无需身份认证即可通过远程方式利用，CVSS评分7.5，危害等级高。Google已在Chrome 17.0.963.46版本中修复此漏洞。"
published = "2012-02-09T04:10:28Z"
remediation = "升级 Google Chrome 至 17.0.963.46 或更高版本，可通过 Chrome 内置自动更新机制或访问 google.com/chrome 下载安装。如无法立即升级，可在浏览器设置中禁用 JavaScript 对剪贴板的访问权限作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome 粘贴事件剪贴板监控漏洞"
updated = "2026-06-16T23:34:12Z"

