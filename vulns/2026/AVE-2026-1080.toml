[basic]
description = "Apex One/SEP agent存在来源验证漏洞（CWE-346），攻击者可利用该漏洞在已安装受影响版本的系统中提升本地权限。该漏洞源于进程保护通信机制中的来源验证不足，攻击者首先需要在目标系统上获得低权限代码执行能力，然后通过特制请求绕过来源验证，与CVE-2026-45207类似但存在于不同的进程保护通信机制中，最终实现权限提升至管理员级别。该漏洞影响Trend Micro Apex One及Symantec Endpoint Protection (SEP) agent的相关版本，CVSS评分为7.8，危害等级为高。攻击者成功利用后可完全控制受影响系统，窃取敏感数据或进一步横向移动。"
published = "2026-05-21T14:16:47Z"
remediation = "立即升级到 TrendAI Apex One/SEP 安全 Agent 14.0.20731 或更高版本；在已安装 SP1 的 Apex One 服务器上应用 SP1 CP Build 18012 或在新安装时应用 SP1 Build 17079，并访问 TrendAI 下载中心获取所需服务包，应用补丁后立即验证安装是否成功并重启系统以确保补丁生效。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Trend Micro Apex One/SEP agent 本地权限提升漏洞"
updated = "2026-07-23T16:10:00Z"

