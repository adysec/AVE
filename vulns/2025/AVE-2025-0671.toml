[basic]
description = "Windows Internet 连接共享（ICS）组件存在越界读取漏洞（CWE-125），由于对特制网络数据包的处理不当，导致内存越界读取。位于同一相邻网络的未经身份认证的攻击者可向目标系统的 ICS 服务发送特制数据包，触发拒绝服务（DoS）条件，导致目标系统停止响应或崩溃。该漏洞影响多个 Windows 版本，CVSS 评分 6.5，危害等级中危。Microsoft 已在 2025 年 2 月安全更新（5051974）中修复此漏洞。"
published = "2025-02-11T18:15:31Z"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新 KB5051974（适用于 Windows 10 22H2/21H2，OS Builds 19044.5487 和 19045.5487），可通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载安装。如无法立即打补丁，可在防火墙中禁用入站 ICS 相关流量（端口 53/67-68/138-139/445 等），并限制局域网内对 ICS 服务的访问作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Internet Connection Sharing (ICS) 拒绝服务漏洞"
updated = "2026-06-17T08:42:47Z"

