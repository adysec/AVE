[basic]
description = "BiblioWeb Web Server 2.0 存在目录遍历漏洞，未经身份认证的远程攻击者可通过在 HTTP GET 请求中发送包含 ..（点点点）或 ...（点点点）的恶意路径，绕过服务器文件访问限制，读取服务器上任意文件。该漏洞影响 BiblioWeb 2.0 版本，CVSS 评分为 5.0，危害等级中等。攻击者无需任何认证即可利用此漏洞获取服务器上的敏感配置文件或源代码。"
published = "2001-05-03T04:00:00.000"
remediation = '立即将 BiblioWeb Server 2.0 升级至厂商发布的最新版本（如有）；若无法升级，在 Web 服务器配置中禁用目录列表并设置根目录为仅允许访问的静态资源目录，通过正则表达式过滤所有包含 ".." 或 "..." 的 HTTP GET 请求路径；运行服务时使用最小权限账户，限制其对文件系统的访问范围；在前端部署反向代理或 WAF，拦截所有路径遍历特征请求。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "BiblioWeb BiblioWeb Server 2.0 目录遍历漏洞"
updated = "2026-06-16T21:53:55.120"

