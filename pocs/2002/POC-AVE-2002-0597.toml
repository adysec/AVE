[info]
author = "ave"
description = "验证 L-Forum 2.4 search.php 的 SQL 注入漏洞，通过向 search 参数提交 SQL 注入 payload，若响应中存在 UNION 查询结果则判定目标存在该漏洞。攻击者无需认证即可远程利用，可获取数据库敏感信息。"
id = "POC-AVE-2002-0597"
name = "Leszek Krupinski L-Forum 2.4 search.php SQL注入漏洞 PoC"
severity = "high"
tags = ["ave-2002-0597"]
vuln_id = [
    "CVE-2002-1457",
    "AVE-2002-0597",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/search.php"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["1'"]
