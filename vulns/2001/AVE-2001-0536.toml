[basic]
description = "cgiCentral WebStore 400 的 ws_mail.cgi 脚本存在任意命令执行漏洞，该脚本在处理 kill 参数时直接将用户输入传递给 system() 函数执行，未对 shell 元字符进行任何过滤或转义。具有 WebStore 管理员认证权限的远程攻击者可通过在 kill 参数中注入 shell 元字符（如分号），在 Web 服务器上执行任意系统命令。成功利用该漏洞可导致攻击者完全控制服务器主机，窃取敏感数据或进一步渗透内网。此外，若与认证绕过漏洞（Bugtraq ID 2860）结合使用，远程未授权攻击者也可能借此获得服务器访问权限。该漏洞影响 WebStore 400 及 400CS 版本 4.14，CVSS 评分为 7.5，危害等级为高。cgiCentral 已发布安全更新修复此漏洞，管理员应升级到最新版本并加强对管理员账户的权限管控。"
published = "2001-06-12T04:00:00Z"
remediation = "建议立即停用或删除 cgiCentral WebStore 400 中的 ws_mail.cgi 脚本，该脚本通过 kill 参数直接调用 system() 导致任意命令执行。若业务必须保留，请在 Web 服务器层面配置规则拦截包含分号、反引号、$()、管道符等 Shell 元字符的 kill 参数请求，并将管理员后台访问限制为可信 IP 范围（如内网 IP 或 VPN 网段）。鉴于该产品已停止维护多年，强烈建议尽快迁移至现代维护中的电商平台（如 Magento、Shopify、WooCommerce 等），并在迁移前部署 WAF 规则针对性防护该 CGI 接口。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "cgiCentral WebStore 400 远程代码执行漏洞"
updated = "2026-06-16T21:56:05Z"

