[basic]
description = "tags as specified.<value>GNU elfutils 0.192 的 eu-readelf 组件存在内存破坏漏洞，位于 libdw_alloc.c 中的 __libdw_thread_tail 函数在处理参数 w 时存在内存管理错误，可导致堆缓冲区溢出。该漏洞影响使用 elfutils 0.192 版本处理 ELF 二进制文件及 DWARF 调试信息的各类 Linux 发行版和应用程序。攻击者可通过网络向目标发送特制 ELF 文件，诱导用户使用 eu-readelf 工具打开恶意文件，从而操纵参数 w 触发内存损坏，进而可能导致拒绝服务或任意代码执行。由于攻击复杂度较高且需满足特定交互条件，利用难度较大，但漏洞利用细节已公开披露。GNU 官方已通过提交 2636426a091bd6c6f7f02e49ab20d4cdc6bfc753 修复了该问题，建议受影响用户尽快升级至最新版本。"
published = "2025-02-16T15:15:09Z"
remediation = "建议立即升级 GNU elfutils 至包含修复补丁 2636426a091bd6c6f7f02e49ab20d4cdc6bfc753 的版本（≥0.192 修复版）。各发行版用户请通过包管理器更新：SUSE 用户应用 SUSE-SU-2025:4092-1 补丁包；Ubuntu 用户应用 UBUNTU-CVE-2025-1352 更新；Siemens RUGGEDCOM RST2428P 用户升级至 V4.0 以上版本（参考 https://cert-portal.siemens.com/productcert/html/ssa-253495.html）。如暂无法升级，可临时限制非受信 ELF 文件的 eu-readelf 处理操作，避免处理来源不明的二进制文件。也可从 https://sourceware.org/bugzilla/attachment.cgi?id=15923 下载官方补丁手动编译修复。"
score = 2.3
severity = "LOW"
sources = ["msrc"]
title = "GNU elfutils eu-readelf libdw_alloc.c __libdw_thread_tail 内存破坏漏洞"
updated = "2026-06-17T08:38:57Z"

