[basic]
description = "RealNetworks RealPlayer 在处理 RMX 文件格式时，其 RMX 头部解析存在堆缓冲区溢出漏洞。攻击者可构造包含恶意头部字段值的特制 RMX 媒体文件，当用户使用受影响版本的 RealPlayer 打开该文件时，触发堆缓冲区溢出，导致远程代码执行。该漏洞影响 RealPlayer 11.0 至 11.1、RealPlayer SP 1.0 至 1.1.5 及 RealPlayer Enterprise 2.1.2/2.1.3 版本，CVSS 评分 9.3，危害等级严重。攻击者可通过诱导用户访问恶意网站或打开恶意媒体文件实施攻击。"
published = "2010-12-14T16:00:04Z"
remediation = "升级 RealPlayer 至 12.0.1.609 或更高版本。访问 real.com 下载最新版安装包覆盖安装。如无法升级，在浏览器中禁用 RealPlayer 浏览器插件（npjpi*.dll 和 rmoc3260.dll），并配置防火墙阻止 RealPlayer 对外发起网络连接作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer RMX 文件头堆缓冲区溢出漏洞"
updated = "2026-06-16T23:24:41Z"

