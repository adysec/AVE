[basic]
description = "McAfee WebShield SMTP 4.5 邮件安全网关存在内容过滤绕过漏洞。该产品作为企业邮件边界防护设备，负责扫描进出邮件中的病毒和恶意附件。漏洞原理在于其邮件解析模块在处理附件文件名时未正确过滤扩展 ASCII 字符，导致内容过滤规则失效。远程攻击者无需任何身份认证，只需向目标网关发送一封包含恶意附件的电子邮件，并在附件文件名中嵌入扩展 ASCII 字符，即可使病毒、蠕虫等恶意代码绕过检测并进入受保护的内网。该漏洞影响运行 WebShield SMTP 4.5 版本的所有设备，CVSS 评分 7.5，危害等级高。攻击者可利用此漏洞实施邮件传播型恶意软件攻击，对企业邮件系统造成严重威胁。"
published = "2001-01-09"
remediation = "升级 McAfee WebShield SMTP 至后续安全版本，并安装官方提供的邮件过滤规则补丁。在邮件网关配置中启用附件名规范化检测规则，严格过滤包含扩展 ASCII 字符（字符编码大于 127）的附件名称，拒绝或剥离此类附件。如无法立即升级，可在 SMTP 网关前置一层内容过滤设备，配置正则规则拦截附件名中出现 0x80-0xFF 范围字符的邮件，同时启用邮件头深度解析以还原被混淆的附件真实名称。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Trend Micro Webshield SMTP 安全绕过漏洞"
updated = "2001-01-09"

