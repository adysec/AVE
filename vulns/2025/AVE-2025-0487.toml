[basic]
description = "GNU Binutils 2.45 版本的 ldmisc.c 文件中 vfinfo 函数存在越界读取漏洞。本地攻击者可通过构造特制的输入文件触发该漏洞，导致进程读取超出缓冲区边界的内存数据，可能造成敏感信息泄露或程序崩溃。该漏洞攻击复杂度低，需本地访问权限，无需用户交互。"
published = "2025-10-16T16:15:37Z"
remediation = "立即将 GNU Binutils 升级至 2.45 以上版本，应用补丁 16357（https://sourceware.org/bugzilla/attachment.cgi?id=16357）。如使用 Siemens SIMATIC S7-1500 CPU 1518-4 PN/DP MFP，请升级固件至 V3.1.6 或更高版本。无法升级时，限制本地用户对链接器的交互式调用权限作为临时缓解。"
score = 1.9
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils ldmisc.c vfinfo 越界读取漏洞"
updated = "2026-06-17T08:31:15Z"

