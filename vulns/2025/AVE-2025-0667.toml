[basic]
description = "Windows Connected Devices Platform Service (Cdpsvc) 存在拒绝服务漏洞，该漏洞源于服务对特制请求的处理不当，导致未受控制的资源消耗（CWE-400）。未经身份认证的远程攻击者可通过网络向目标系统发送特制请求，利用该漏洞导致 Cdpsvc 服务停止响应，造成拒绝服务。该漏洞影响多个 Windows 版本，CVSS 评分 7.5，危害等级高。Microsoft 已在 2025 年 1 月安全更新（补丁号 5049981）中修复此漏洞。"
published = "2025-01-14T18:15:32Z"
remediation = "安装 Microsoft 2025 年 1 月安全更新 (KB5049981)，可通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载。如无法立即打补丁，可在防火墙或网络边界限制对 Cdpsvc 服务端口的访问，并监控异常网络流量作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Connected Devices Platform Service (Cdpsvc) 拒绝服务漏洞"
updated = "2026-06-17T08:42:46Z"

