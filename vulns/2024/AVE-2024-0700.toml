[basic]
description = "Linux 内核 BPF（Berkeley Packet Filter）子系统中存在尾调用导致数据包指针失效的安全漏洞。当 BPF 程序通过尾调用（tail call）跳转到另一个 BPF 程序时，原程序持有的数据包指针（packet pointer）未正确失效，攻击者可利用此缺陷构造特制的 BPF 程序序列，在指针失效后继续访问已释放或重新分配的内存区域，导致越界读取或释放后使用（Use-After-Free）。本地攻击者若具备加载 BPF 程序的权限（如非特权 BPF 已启用），可通过精心构造的 BPF 程序触发该漏洞，造成系统崩溃或潜在的信息泄露。该漏洞影响 Linux 内核各发行版本，Red Hat 评估为中等严重性。"
published = "2025-05-05T00:00:00Z"
remediation = "立即升级 Linux 内核至以下安全版本：6.6 LTS 分支升级到 6.6.90 及以上，6.12 分支升级到 6.12.9 及以上，或直接升级到 6.13 及以上版本。对应修复提交为 f1692ee23dca、1c2244437f9a、1a4607ffba35。如无法立即升级，可通过禁用 BPF 程序中的尾部调用来临时缓解，但建议优先完成内核升级。"
score = 5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Kernel BPF 尾部调用数据包指针失效漏洞"
updated = "2025-05-05T00:00:00Z"

