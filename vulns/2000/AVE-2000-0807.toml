[basic]
description = "Windows NT 和 Windows 2000 系统中，Shell 可执行文件 Explorer.exe 的注册表项使用了相对路径名，而非绝对路径。本地攻击者可在 %Systemdrive% 目录下放置一个名为 Explorer.exe 的特洛伊木马程序，当系统启动或调用 Shell 时，会优先加载该恶意文件而非系统目录下的合法 Explorer.exe，从而导致任意代码执行。该漏洞影响 Windows NT 和 Windows 2000 操作系统，攻击者需要具备本地访问权限才能利用，CVSS 评分 4.6，危害等级中危。Microsoft 已发布安全公告 MS00-052 修复此漏洞。"
published = "2000-07-25T04:00:00.000"
remediation = '安装 Microsoft Security Bulletin MS00-052 对应补丁（Windows NT 4.0: Q259728 / Windows 2000: Q259729），可通过 Windows Update 获取。如无法安装补丁，可修改注册表将 Explorer.exe 路径改为绝对路径：将 HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\Shell 值从 "Explorer.exe" 改为 "C:\Windows\System32\Explorer.exe"；同时移除 %Systemdrive% 目录下非法的 Explorer.exe 文件，并限制普通用户对系统盘根目录的写入权限。'
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows NT/2000 Explorer.exe 相对路径本地权限提升漏洞"
updated = "2026-06-16T21:52:13.030"

