[basic]
description = "Microsoft Data Access Components (MDAC) 的远程数据服务 (RDS) 组件中的 msadcs.dll 存在堆缓冲区溢出漏洞。远程攻击者可通过向目标 IIS 服务器发送特制的 HTTP 请求（包含超长 Content-Type 头）到 Data Stub 处理程序，触发堆缓冲区溢出，从而在目标系统上以 IUSR_<计算机名> 账户权限执行任意代码。该漏洞影响 MDAC 2.1 至 2.6 版本及 Internet Explorer 5.01 至 6.0，Microsoft 已在 MS02-065 安全公告中发布补丁修复。"
published = "2002-11-29T05:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS02-065 提供的补丁 (Q329414)，或升级 MDAC 至 2.7 及以上版本（Windows XP 自带版本不受影响）。对于无法立即打补丁的 IIS 服务器，可使用 IIS Lockdown Tool 禁用 RDS 组件，或部署 URLScan 工具限制非 ASCII 请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft MDAC RDS DataStub 堆缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:58:48.130"

