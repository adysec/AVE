[basic]
description = "AOL Instant Messenger (AIM) 4.8 beta 及更早版本存在目录遍历漏洞，远程攻击者可通过建立 Direct Connection 并发送包含特定 SRC 属性的 IMG 标签，利用路径遍历序列（如 ../）在目标系统上创建任意文件并执行命令。该漏洞无需身份认证即可远程触发，影响完整性，CVSS 评分 5.0（中等危害），主要影响使用受影响 AIM 版本的 Windows 用户。攻击者可借此写入恶意脚本或可执行文件，进而实现代码执行。"
published = "2002-06-18T04:00:00.000"
remediation = '建议立即升级至 AOL Instant Messenger 4.8 正式版或更高版本（已修复该目录遍历漏洞）。若无法升级，请在 AIM 设置中禁用 "Direct Connection" 直接连接功能，并在防火墙层面阻断非受信 IP 的 AIM 文件传输端口（默认 5190/443）作为临时缓解措施。由于 AIM 已于 2017 年停止运营，强烈建议迁移至现代即时通讯软件（如 Signal、Telegram、企业微信等）以彻底消除风险。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "AOL 即时通讯软件 目录遍历漏洞"
updated = "2026-06-16T21:57:44.170"

