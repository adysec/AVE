[basic]
description = "XFree86 的 libX11.so 动态链接库存在不可信搜索路径漏洞。当该库被用于 setuid 或 setgid 程序时，本地攻击者可通过设置恶意的 LD_PRELOAD 环境变量，使其指向包含恶意代码的共享库模块，从而在程序运行时被加载执行，实现本地权限提升至 root。该漏洞影响 XFree86 系列版本，攻击者需拥有本地系统访问权限，无需身份认证即可利用，CVSS 评分 7.2，危害等级高。"
published = "2003-03-03T05:00:00Z"
remediation = "立即升级 XFree86 至修复版本：Red Hat Linux 用户安装 RHSA-2003-066 提供的更新包，Red Hat 7.x/8.x 用户安装 RHSA-2003-067 提供的更新包；SuSE Linux 用户安装 SuSE 2002 年 9 月安全公告中提供的 xfree86 更新。临时缓解措施：在 setuid/setgid 程序执行前清除 LD_PRELOAD 环境变量，或通过 /etc/ld.so.preload 白名单机制限制动态库加载路径。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "XFree86 libX11.so 本地权限提升漏洞"
updated = "2026-06-16T21:59:23Z"

