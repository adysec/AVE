[basic]
description = "Windows 更新堆栈（Windows Update Stack）存在链接跟随漏洞（CWE-59），由于对文件访问前的符号链接解析处理不当，本地已授权攻击者可利用此漏洞在目标系统上提升权限。攻击者通过创建恶意的符号链接，诱导 Windows 更新堆栈在处理更新时错误地跟随链接访问高权限文件或目录，从而获得 SYSTEM 级别的执行权限。该漏洞影响多个 Windows 版本，CVSS 评分 7.8，危害等级高。Microsoft 已在 2025 年 4 月安全更新中修复此漏洞。"
published = "2025-04-08T18:15:45Z"
remediation = '安装 Microsoft 2025 年 4 月安全更新，各版本对应修复版本：Windows 10 1507 升级至 10.0.10240.20978，Windows 10 1607/Server 2016 升级至 10.0.14393.7969，Windows 10 1809/Server 2019 升级至 10.0.17763.7136，Windows 10 21H2 升级至 10.0.19044.5737，Windows 10 22H2 升级至 10.0.19045.5737，Windows 11 22H2 升级至 10.0.22621.5189，Windows 11 23H2 升级至 10.0.22631.5189，Windows 11 24H2 升级至 10.0.26100.3775，Server 2022 升级至 10.0.20348.3453。可通过 Windows Update 自动更新或 Microsoft Update Catalog 手动下载。临时缓解措施：限制低权限用户对 C:\Windows\Temp 及 Windows Update Stack 相关目录的写入权限，并监控符号链接创建行为。'
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Process Activation 本地权限提升漏洞"
updated = "2026-06-17T08:42:45Z"

