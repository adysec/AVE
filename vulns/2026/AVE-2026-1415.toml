[basic]
description = "rclone serve restic 存在路径遍历漏洞，其 WithRemote 中间件未正确拒绝以 `../` 开头的 URL 路径。由于 Go 的 `path.Clean` 会保留前导父路径组件，攻击者可通过在请求中使用 `../` 或 URL 编码的 `%2e%2e` 绕过路径校验，从而访问配置目录之外的文件。该漏洞影响 rclone v1.40.0 至 v1.74.4，当操作员通过 REST 服务发布后端子目录且攻击者能够访问该端点时，可对 WebDAV、FTP、HTTP、Memory 及 SFTP 后端实施路径逃逸，进而读取、创建、覆盖或删除超出设定根目录的对象，CVSS 评分为 8.6。"
published = "2026-08-05T21:16:58Z"
remediation = "立即将 rclone 升级至 v1.75.0 或更高版本以修复路径验证缺陷。如暂无法升级，应停止使用 rclone serve restic 发布后端子目录，或将 REST 端点限制在本地回环地址 (127.0.0.1) 监听，避免暴露于不受信任的网络。"
score = 8.6
severity = "HIGH"
sources = ["ghsa"]
title = "rclone serve restic 路径遍历漏洞"
updated = "2026-08-06T14:16:42Z"

