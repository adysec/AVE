[basic]
description = "Linux modutils 2.3.x 包中的 modprobe 工具存在命令注入漏洞，其通过 popen() 调用 echo 程序时未对用户输入进行转义处理，导致攻击者可在模块名称参数中嵌入 shell 元字符以执行任意命令。该漏洞影响使用 modutils 2.3.9 及相近版本的 Linux 系统，攻击者需具备本地用户权限且目标系统启用了 kmod 内核模块自动加载机制（如 RedHat Linux 7.0 中的 ping 程序在请求不存在的设备时会触发 modprobe）。攻击者利用此漏洞可获取 root 权限，从而完全控制系统。CVSS 评分为 7.2，危害等级为高危。"
published = "2001-01-09T05:00:00.000"
remediation = "立即将 modutils 软件包升级至 2.3.10 或更高版本，该版本已对 modprobe 的参数进行 shell 元字符转义处理，修复了 popen() 执行 echo 时未过滤用户输入的缺陷。若无法立即升级，可临时移除 ping 等 SUID 程序的 setuid 位以阻断内核通过 request_module() 触发 modprobe 的攻击路径，或在系统层面限制非特权用户调用 modprobe 的权限。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Linux modutils modprobe 任意命令执行漏洞"
updated = "2026-06-16T21:53:08.130"

