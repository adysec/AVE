[basic]
description = 'Claude Code 的工作树处理机制存在路径混淆漏洞，允许攻击者创建名为 ".git" 的工作树并导航到沙箱上下文之外的工作树，从而发起 Git 目录混淆攻击。通过利用符号链接操纵和工作树操作期间的 git fsmonitor 执行，攻击者可以覆盖用户主目录中的文件（如 .zshenv），导致在 macOS Seatbelt 沙箱限制之外执行任意代码。成功利用此漏洞需要用户克隆包含提示注入内容的恶意仓库并针对该仓库运行 Claude Code。该漏洞影响 Claude Code 2.1.38 至 2.1.163 版本，CVSS 评分 7.7，危害等级高。'
published = "2026-06-29T15:16:41Z"
remediation = "立即将 Claude Code 升级至 2.1.163 或更高版本。使用 Claude Code 自动更新功能的用户已自动修复；手动更新的用户请运行 `npm update @anthropic-ai/claude-code -g` 或重新安装最新版本。在升级完成前，避免在不可信仓库上运行 Claude Code，并检查 .zshenv 等关键配置文件是否被篡改。"
score = 7.7
severity = "HIGH"
sources = ["ghsa"]
title = "Anthropic Claude Code 工作树路径混淆沙箱逃逸漏洞"
updated = "2026-06-30T16:17:39Z"

