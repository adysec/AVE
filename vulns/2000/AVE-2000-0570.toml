[basic]
description = "NAI Net Tools PKI Server 1.0 的 strong.exe 程序在处理 HTTPS 端口请求时存在缓冲区溢出漏洞。远程攻击者可以通过在 HTTPS 请求中发送一个超长的 URL 触发该漏洞，导致程序崩溃或执行任意命令。该漏洞影响 HotFix 3 之前的 1.0 版本，攻击条件为目标系统开放 HTTPS 服务且可被远程访问，利用方式为构造特定长度的恶意 URL 载荷，从而实现对目标服务器的远程代码执行。"
published = "2000-10-20T04:00:00Z"
remediation = "建议将 NAI Net Tools PKI Server 1.0 升级至 HotFix 3 或更高版本，以修复 strong.exe 在处理 HTTPS 请求时的缓冲区溢出漏洞。如无法立即升级，建议在网络防火墙上限制对该服务 HTTPS 端口的访问，或使用 Web 应用防火墙 (WAF) 拦截超长 URL 请求。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "NAI Net Tools PKI Server 1.0 strong.exe 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:52:23Z"

