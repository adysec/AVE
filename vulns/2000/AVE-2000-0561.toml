[basic]
description = "tags.<value>GWScripts News Publisher 1.0 的 news.cgi 存在认证绕过漏洞，程序在处理 addAuthor 参数添加作者时未进行有效的身份验证，仅通过检查 HTTP Referer 头是否指向 news.cgi 来判断请求合法性。远程攻击者可构造 POST 请求，将 Referer 设置为 news.cgi 的 URL，从而绕过认证机制，向作者索引文件（author.file）中写入任意用户名和密码的新作者账户。该漏洞影响 GWScripts News Publisher 1.0 及之前版本，攻击无需任何身份认证即可利用，CVSS 评分为 5.0，危害等级中等。"
published = "2000-10-20T04:00:00Z"
remediation = "升级 GWScripts News Publisher 至已修复版本；在服务器端禁用对 Referer 头的认证依赖，为 news.cgi 的 addAuthor 接口部署独立的访问控制列表（ACL）并限制来源 IP，同时为作者管理功能添加独立的用户身份验证。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "GWScripts News Publisher 未授权添加作者漏洞"
updated = "2026-06-16T21:52:20Z"

