[basic]
description = "skilo add 命令在安装技能时存在符号链接跟随漏洞。该命令递归复制技能目录时，对符号链接的处理存在不一致：使用 file_type() 检测时不跟随符号链接，但使用 copy() 复制时却会解引用符号链接。攻击者可构造包含符号链接的恶意技能仓库，当用户通过 skilo add 安装来自不受信任来源的技能时，程序会跟随符号链接读取任意本地文件（如 SSH 密钥、云凭证、配置文件等）并将其内容写入技能目录，导致敏感信息泄露。该漏洞影响 skilo 0.5.0 至 0.11.0 版本，CVSS 评分 5.0，危害等级为中等。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
