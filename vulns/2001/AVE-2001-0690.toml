[basic]
description = "HP MPE/iX 6.5及更早版本中的NM debug功能在处理断点时存在安全缺陷，未经充分身份验证的本地攻击者可以利用该缺陷精心构造并发送恶意断点请求，从而绕过系统安全限制并提升自身权限至高特权级别。该漏洞影响运行受影响版本的所有HP MPE/iX系统，攻击者需要具备本地访问权限即可在低复杂度条件下完成利用，成功利用后可完全控制系统敏感数据和关键服务。"
published = "2001-05-03T04:00:00Z"
remediation = "升级到 HP MPE/iX 6.5 之后的安全补丁版本或更新发行版，并通过设置文件权限（如 chmod 700 /SYS/NM）限制普通用户对 NM debug 调试器的执行访问。如无法立即升级，应暂时禁用或移除调试器的 SUID 权限，仅允许授权用户通过组权限访问调试工具，防止本地未授权用户利用断点机制获取超级用户权限。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "HP MPE/iX 权限提升漏洞"
updated = "2026-06-16T21:53:59Z"

