[basic]
description = "ProFTPD 1.2.0rc2 存在内存泄漏漏洞（CWE-401），远程攻击者无需身份认证即可通过向目标 FTP 服务器连续发送大量 USER 命令触发该漏洞，导致服务器进程内存持续增长而无法释放，最终引发拒绝服务。若服务器配置不当，发送 SIZE 命令同样可以触发内存泄漏。该漏洞影响运行 ProFTPD 1.2.0rc2 版本的 Linux/Unix 系统，攻击者只需建立到 FTP 服务端口 21 的 TCP 连接并重复发送特制 FTP 命令，即可耗尽服务器内存资源，使合法用户无法正常使用 FTP 服务。ExploitDB 已有公开 PoC（EDB-ID: 241）验证该漏洞可利用性。"
published = "2001-03-12T05:00:00Z"
remediation = "建议立即升级 ProFTPD 至 1.2.0 正式版或更高版本（如 1.2.1/1.2.2 等），修复内存泄漏缺陷。若暂时无法升级，可在 proftpd.conf 中设置 `MaxLoginAttempts 3` 限制 USER 命令尝试次数，并配置 `TimeoutLogin 30` 缩短登录超时时间，减少恶意连接占用内存；同时在防火墙层面限制单 IP 并发 FTP 连接数（如 iptables: `-A INPUT -p tcp --dport 21 -m connlimit --connlimit-above 10 -j REJECT`），缓解拒绝服务攻击。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "ProFTPD 1.2.0rc2 内存泄漏拒绝服务漏洞"
updated = "2026-06-16T21:53:44Z"

