[basic]
description = "Linux内核Open vSwitch子系统的ovs_vport_cmd_fill_info()函数存在use-after-free（UAF）漏洞。该函数可在未持有RTNL锁或RCU读锁的情况下被调用，导致vport对象的引用计数被不当释放后仍被使用。具有本地访问权限的低权限攻击者可通过发送特制的Open vSwitch网络配置请求触发此漏洞，利用UAF实现本地权限提升，执行任意内核代码并完全控制系统。该漏洞影响多个Linux发行版，CVSS评分为7.8。"
published = "2025-02-27T03:15:16.757"
remediation = "将 Linux 内核升级至修复版本：5.4.291、5.10.235、5.15.179、6.1.129、6.6.79、6.12.16 或 6.13.4 及之后版本，以消除 ovs_vport_cmd_fill_info() 函数中的 use-after-free 漏洞。如无法立即升级，可通过系统更新工具（如 yum update kernel、apt upgrade linux-image）应用各发行版的安全补丁，或暂时卸载 Open vSwitch 内核模块作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 Open vSwitch 使用后释放漏洞"
updated = "2026-06-17T08:44:12.830"

