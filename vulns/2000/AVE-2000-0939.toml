[basic]
description = "Zope 2.2.0 至 2.2.4 版本存在安全注册绕过漏洞。由于对 DTML 方法对象等旧式对象构造函数的名称未正确执行安全注册机制，导致远程攻击者可在无需认证的情况下利用该漏洞绕过权限检查，执行未授权操作，造成机密性、完整性和可用性部分受损。该漏洞 CVSS 评分 7.5，危害等级高，攻击复杂度低，影响范围广。"
published = "2000-12-16T05:00:00Z"
remediation = "升级 Zope 至 2.3.0 或更高版本，该版本修复了 DTML 方法对象等构造函数遗留名称的安全注册问题。如无法升级，在 Zope 管理界面中审查并移除所有未使用的 DTML 方法对象，限制可调用构造函数的用户角色权限。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Zope Zope 安全绕过漏洞"
updated = "2026-06-16T21:53:23Z"

