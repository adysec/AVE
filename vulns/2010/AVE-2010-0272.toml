[basic]
description = "RealNetworks RealPlayer 的 Upsell.htm、Main.html 和 Custsupport.html 组件存在跨域脚本漏洞，由于对用户输入验证不充分，远程攻击者可通过诱导用户访问特制网页，向 RealOneActiveXObject 进程注入恶意代码，从而绕过 Internet Explorer 的本地计算机区域安全限制，加载任意 ActiveX 控件。该漏洞影响 RealPlayer 11.0~11.1、RealPlayer SP 1.0~1.1.5 及 RealPlayer Enterprise 2.1.2/2.1.3 版本，攻击者无需身份认证即可实施攻击，CVSS 评分 4.3，危害等级中危。"
published = "2010-12-14T16:00:04Z"
remediation = "立即升级 RealPlayer 至 12.0.1.609 或更高版本，该版本已修复跨域脚本绕过漏洞。如无法升级，可禁用 RealPlayer 浏览器 ActiveX 控件（在 IE 管理加载项中禁用 RealOneActiveXObject），并将 Internet 区域安全级别设为高，同时禁用本地 HTML 文件执行 ActiveX 脚本的权限。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "RealNetworks RealPlayer 跨域脚本执行漏洞"
updated = "2026-06-16T23:24:41Z"

