[basic]
description = "Xitami 2.5b Web 服务器在安装时默认将 testcgi.exe 程序放置在 cgi-bin 目录下，远程攻击者无需任何身份认证即可通过网络直接访问该 CGI 程序，从而获取 Web 服务器的敏感配置信息（如系统路径、目录结构、环境变量等）。该漏洞影响 Xitami 2.5b 版本，攻击复杂度低，危害中等，可能导致进一步的信息收集和渗透攻击。"
published = "2000-12-31T05:00:00Z"
remediation = "删除 Xitami 安装目录下 cgi-bin 中的 testcgi.exe 文件，或将其重命名为非可执行扩展名。如使用 Xitami 2.5c 或更高版本，请升级至最新版。在 Web 服务器前端配置访问控制规则，限制对 cgi-bin 目录的匿名访问，仅允许受信任 IP 范围访问该目录。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Xitami testcgi.exe 敏感信息泄露漏洞"
updated = "2026-06-16T21:53:25Z"

