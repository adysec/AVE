[basic]
description = "Windows Telephony Service（电话服务）存在释放后使用（Use-After-Free）漏洞，远程攻击者可通过诱导用户访问恶意网站或打开特制文件触发该漏洞，导致在目标系统上以服务权限执行任意代码。该漏洞影响多个 Windows 版本，CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞，用户需安装更新 KB5051987 或对应版本补丁。"
published = "2025-02-11T18:15:38.907"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新：Windows 10/11 用户安装 KB5051974，Windows Server 用户安装 KB5051987（或热补丁 KB5052105），其他受影响版本安装 KB5052072。可通过 Windows Update 自动获取更新，或从 Microsoft 更新目录网站手动下载。如无法立即打补丁，可在防火墙层面限制 TAPI 服务的网络暴露面，并禁用不必要的电话服务（TapiSrv）以降低攻击面。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:43:17.427"

