[basic]
description = "Windows Telephony Server（电话服务）存在双重释放（Double Free）内存破坏漏洞，CVSS 评分 8.8，危害等级高。未经身份认证的远程攻击者可通过向目标系统发送特制的请求触发该漏洞，成功利用可在目标系统上以 SYSTEM 权限执行任意代码，完全控制受影响系统。攻击需要用户交互（如诱导用户点击恶意链接或打开恶意文件），但无需任何特权。该漏洞影响多个 Windows 版本，Microsoft 已在 2025 年 2 月安全更新（KB5051974）中修复。"
published = "2025-02-11T18:15:31Z"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新 KB5051974（Windows 10 22H2 更新至 OS Build 19045.5487，Windows Server 2019 更新至 KB5052000 OS Build 17763.6893），可通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。如无法立即打补丁，建议在防火墙层面限制对 TAPI 服务（RPC 端口 135/TCP 及动态 RPC 端口范围）的入站访问，并禁用不必要的 Telephony 服务作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Telephony Server 远程代码执行漏洞"
updated = "2026-06-17T08:42:45Z"

