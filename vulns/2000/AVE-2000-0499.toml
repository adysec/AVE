[basic]
description = "Texas Imperial Software WFTPD 2.4.1 在处理 FTP RENAME 命令时存在逻辑缺陷，本地攻击者可在未执行 RENAME FROM（RNFR）命令的情况下直接发送 RENAME TO（RNTO）命令，导致 FTP 服务进程崩溃，造成拒绝服务。该漏洞影响 WFTPD 及 WFTPD Pro 2.41 版本，攻击者只需拥有 FTP 服务器的本地访问权限即可触发，无需身份认证。Exploit-DB 已公开该漏洞的利用代码。"
published = "2000-07-11T04:00:00.000"
remediation = "升级 WFTPD 至 2.42 或更高版本，该版本已修复 RNFR 命令前置检查缺失导致的拒绝服务问题。如无法升级，可在 FTP 服务器配置中禁用 RENAME 命令（RNFR/RNTO），或通过防火墙/WAF 过滤包含 RNTO 的 FTP 命令序列作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Texas Imperial Software WFTPD 2.4.1 拒绝服务漏洞"
updated = "2026-06-16T21:52:11.140"

