[basic]
description = "Linux 内核 2.4.18-pre9 及更早版本中，netfilter 子系统的 IRC 连接跟踪辅助模块存在安全绕过漏洞。该模块在处理传入的 IRC DCC（直接客户端连接）请求时，未正确设置 conntrack 期望掩码，导致防火墙连接跟踪机制被欺骗。未经身份认证的远程攻击者可通过发送特制的 DCC 数据包，绕过 iptables/netfilter 设定的访问控制规则，访问本应被拦截的网络服务。该漏洞影响所有启用 netfilter 防火墙功能的 Linux 2.4.18-pre9 及更早内核版本，CVSS 评分 7.5，危害等级高。"
published = "2002-03-08T05:00:00Z"
remediation = '将Linux内核升级至2.4.18-pre9或更高版本，该版本已修复IRC DCC连接跟踪辅助模块的conntrack元组掩码错误。补丁由Harald Welte提交，修正了ip_conntrack_irc.c中掩码设置，将源IP从任意匹配改为仅匹配实际发起DCC请求的内部IP地址。若无法立即升级内核，可在内核配置中移除CONFIG_IP_NF_TARGET_CONNTACK IRC模块（通过设置CONFIG_IP_NF_TARGET_CONNTACK=n重新编译内核），或在内核运行时卸载ip_conntrack_irc模块（执行rmmod ip_conntrack_irc），以彻底消除攻击面。同时检查防火墙规则，避免使用"-m state --state RELATED -j ACCEPT"这种 overly permissive的规则，改为针对特定端口的精确放行策略。'
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Linux kernel IRC连接跟踪辅助模块 防火墙绕过漏洞"
updated = "2026-06-16T21:56:41Z"

