[basic]
description = "Windows 消息队列（MSMQ）组件中存在双重释放（Double Free）漏洞（CWE-415），已认证的攻击者可通过向目标系统发送特制的消息队列请求触发该漏洞，导致在内核上下文中实现权限提升。该漏洞影响 Windows 消息队列服务，攻击者需具备本地低权限账户即可利用，无需用户交互。成功利用后攻击者可获取 SYSTEM 权限，完全控制受影响系统。Microsoft 尚未发布官方安全更新。"
published = "2026-05-12T18:17:05Z"
remediation = "建议立即安装 Microsoft 2026 年 5 月安全更新，通过 Windows Update 自动获取或访问 https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-33838 手动下载对应版本补丁。受影响版本包括 Windows 10/11 及 Windows Server 2012/2016/2019，修复版本分别为 10.0.14393.9140（Win10 1607/Server 2016）、10.0.17763.8755（Win10 1809/Server 2019）、10.0.19044.7291（Win10 21H2）、10.0.19045.7417（Win10 22H2）、10.0.22631.7079（Win11 23H2）、10.0.26100.8457（Win11 24H2）、10.0.26200.8457（Win11 25H2）、10.0.28000.2113（Win11 26H1）。如无法立即打补丁，可在不影响业务的情况下禁用 MSMQ 服务（services.msc 中停止 Message Queuing 服务）作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Microsoft Windows 消息队列 (MSMQ) 双重释放特权提升漏洞"
updated = "2026-06-17T10:38:11Z"

