[basic]
description = "Zoho ManageEngine Desktop Central 在 10.0.474 版本之前存在 Java 反序列化远程代码执行漏洞。攻击者可通过 FileStorage 类的 getChartImage 方法向 CewolfServlet 和 MDMLogUploaderServlet servlets 发送包含不可信数据的序列化对象，触发服务端反序列化过程并执行任意代码。该漏洞无需身份认证，攻击者通过网络即可远程利用，攻击复杂度低且无需用户交互。成功利用可导致攻击者完全控制目标服务器，造成严重的数据泄露和系统破坏风险。"
published = "2020-03-06T17:15:12Z"
remediation = '立即升级到 10.0.479 或更高版本（2020年3月7日发布），补丁下载地址为 https://www.manageengine.com/products/desktop-central/service-packs.html；若无法立即升级，可手动编辑 \ManageEngine\DesktopCentral_Server\webapps\DesktopCentral\WEB-INF\web.xml，删除 MDMLogUploaderServlet 和 CewolfServlet 的 servlet-mapping 与 servlet 配置，随后重启 Endpoint Central 服务作为临时缓解措施。'
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Zoho ManageEngine Desktop Central 反序列化远程代码执行漏洞"
updated = "2026-06-17T02:47:27Z"

