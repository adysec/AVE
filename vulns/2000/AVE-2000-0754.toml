[basic]
description = "ISC BIND 8.1 版本的 host 命令存在远程缓冲区溢出漏洞，攻击者可通过发送超长的 AXFR 区域传送响应数据触发栈缓冲区溢出，从而在目标系统上以 BIND 进程权限执行任意代码。该漏洞影响 ISC BIND 8.1 及早期版本，CVSS 评分 10.0（AV:N/AC:L/Au:N/C:C/I:C/A:C），属于严重级别。攻击条件为：目标 DNS 服务器开启 AXFR 区域传送功能且允许未授权查询，攻击者无需认证即可远程利用。利用方式为构造恶意的超长 AXFR 响应包，覆盖返回地址指向 shellcode，实现远程代码执行。ISC 已在后续版本中修复此漏洞，建议升级至 BIND 8.2.3 或更高版本，并限制 AXFR 仅允许受信任的从服务器查询。"
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 ISC BIND 至 8.1.2 或更高版本（如 8.2.x/9.x 系列），官方已在 8.1.2 修复该 AXFR 缓冲区溢出漏洞。若暂时无法升级，请在 named.conf 中添加 allow-transfer { trusted_ips; }; 限制区域传送仅限受信 IP，或在防火墙层面禁止非信任源对 TCP/53 端口的 AXFR 请求，作为临时缓解措施。建议尽快升级至 BIND 9.x 长期支持版本以获得持续安全更新。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "ISC BIND 8.1 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:53:00.257"

