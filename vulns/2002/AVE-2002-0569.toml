[basic]
description = "Rational ClearCase 4.1 及 2002.05 等版本在 371 端口处理网络数据包时存在拒绝服务漏洞。未经身份验证的远程攻击者可通过向目标系统的 371 端口发送特制数据包触发该漏洞，导致服务进程崩溃。该漏洞利用门槛极低，攻击者可借助 nmap 等端口扫描工具向该端口发送探测包即可触发，造成软件配置管理服务中断，影响开发团队的版本管理与协同工作。"
published = "2002-12-11T05:00:00Z"
remediation = "Rational 于 2002 年 11 月发布了针对受影响版本的补丁：ClearCase 2002.05/Solaris 用户应安装 clearcase_p2002.05.00-12 和 clearcase_p2002.05.00-15；ClearCase 4.1 用户因官方提供的 4.1 补丁经测试仍无法修复该问题，建议直接升级到更新版本。如无法立即升级，可在防火墙或 iptables 中限制非必要来源对 TCP 371 端口的访问，并监控 albd_server 进程状态，崩溃后及时重启 ClearCase 服务。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "IBM Rational ClearCase 4.1 端口扫描拒绝服务漏洞"
updated = "2026-06-16T21:59:06Z"

