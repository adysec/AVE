[basic]
description = 'WFTPD（Winsock FTPd）3.00及2.41版本在启用"限制到家目录"选项时存在目录遍历漏洞。攻击者可通过向FTP服务发送包含"/../"序列的特制路径请求，绕过目录限制访问服务器上的任意文件。该漏洞源于程序对用户输入路径的过滤不严，未正确处理目录跳转符，导致本地用户可读取家目录之外的文件系统内容，造成敏感信息泄露。攻击条件为FTP服务启用了家目录限制功能，攻击者需拥有有效FTP账户。'
published = "2001-01-09T05:00:00.000"
remediation = '立即升级 WFTPD 至 3.01 或更高版本，该版本已修复 "/../" 目录遍历问题。如无法升级，在 WFTPD 配置中启用 "Restrict to home directory" 的同时，禁用对上级目录的符号链接访问，并在防火墙限制 FTP 服务仅对可信 IP 开放。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Texas Imperial Software WFTPD 目录遍历漏洞"
updated = "2026-06-16T21:53:08.937"

