[basic]
description = "X.Org X服务器的XKB按键类型请求验证存在整数下溢缺陷，本地攻击者可通过发送特制的XKB兼容性映射请求触发越界内存访问。该漏洞允许攻击者读取进程内存中的敏感信息，或导致X服务器崩溃造成拒绝服务；在特定配置下可能实现更高影响的利用。攻击需要本地访问权限，攻击复杂度低，无需用户交互，CVSS 7.8高危评级。"
published = "2026-04-23T16:16:24Z"
remediation = "立即升级受影响的 Xwayland 或 tigervnc 软件包：Red Hat Enterprise Linux 9 升级到 tigervnc-1.15.0-6.el9_7.1 或 xorg-x11-server-Xwayland 24.1.5-6.el10_1；Red Hat Enterprise Linux 10 升级到 xorg-x11-server-Xwayland 24.1.5-6.el10_1。如无法立即升级，可暂时通过限制 X 客户端访问或禁用不必要的 Xwayland 服务作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "X.Org X Server XKB 越界内存访问漏洞"
updated = "2026-07-15T02:20:29Z"

