[basic]
description = "Red Hat Linux 6.2 的 diskcheck.pl 脚本存在符号链接攻击漏洞，本地用户可通过预测临时文件路径并创建恶意符号链接，诱导脚本以特权写入或覆盖任意系统文件。该漏洞源于脚本创建临时文件时未验证文件是否为符号链接，本地攻击者利用竞争条件将临时文件指向关键系统文件（如 /etc/passwd），导致权限提升或系统文件损坏。影响 Red Hat Linux 6.2 系统，CVSS 2.1 低危（本地攻击、低复杂度、部分完整性影响），攻击者需具备本地账户权限才可利用。"
published = "2000-10-20T04:00:00Z"
remediation = "建议立即应用 Red Hat 官方安全公告 RHSA-2000:122 发布的补丁，该补丁修复了 Red Hat Powertools 6.2 及 7.0 中 DiskCheck 脚本的符号链接攻击漏洞。可通过 Red Hat 网络自动更新功能获取并安装该安全更新。若无法立即应用补丁，可暂时删除或禁用 /etc/cron.hourly/diskcheck.pl 脚本，或手动修改脚本中的临时文件创建逻辑，使用 mktemp 命令生成随机文件名并设置严格文件权限，避免直接写入固定路径的临时文件。同时应对 /tmp 目录设置粘滞位（chmod +t /tmp），限制普通用户在该目录中创建指向其他文件的符号链接，从而缓解临时文件竞争条件被利用的风险。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "Red Hat DiskCheck 任意文件写入漏洞"
updated = "2026-06-16T21:52:19Z"

