[basic]
description = "Open WebUI 在 0.9.6 至 0.11.0 版本中存在不安全的直接对象引用漏洞（CWE-639）。`sync_knowledge_cleanup` 接口在验证 URL 中指定知识库的写入权限后，直接处理请求体中的目录和文件 ID，但未校验这些对象是否实际属于该知识库。具有某知识库写入权限的普通用户（如所有者、协作者或管理员）可利用此缺陷，通过构造包含其他知识库目录或文件 UUID 的请求，删除目标知识库的目录结构并移除文件向量嵌入，导致相关文档从检索结果中静默消失，同时破坏对应文档的基于文件聊天功能，而不会向攻击者泄露任何目标内容。该漏洞已于 0.11.0 版本修复。"
published = "2026-08-04T21:16:37Z"
remediation = "立即升级 Open WebUI 至 v0.11.0 或更高版本，该版本已在 sync cleanup 端点中补充知识库归属校验，目录和文件操作均限制在 URL 指定的知识库范围内。如暂时无法升级，应在管理后台限制普通用户的知识库写入权限，或关闭跨用户知识库共享功能，仅允许知识库所有者本人拥有写权限，以阻断未授权操作路径。"
score = 4.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Open WebUI 知识库同步清理越权删除漏洞"
updated = "2026-08-05T15:17:10Z"

