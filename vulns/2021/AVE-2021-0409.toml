[basic]
description = "VMware vCenter Server 的 vSphere Client (HTML5) 中存在远程代码执行漏洞，源于 vCenter Server 插件未对上传文件进行严格校验。未经身份认证的远程攻击者只要能访问目标系统 443 端口，即可利用该漏洞向服务器上传恶意文件并执行任意命令，最终获取底层操作系统的最高权限。该漏洞影响 VMware vCenter Server 7.x（7.0 U1c 之前）、6.7（6.7 U3l 之前）、6.5（6.5 U3n 之前）以及 VMware Cloud Foundation 4.x（4.2 之前）和 3.x（3.10.1.2 之前）等版本，CVSS 评分为 9.8，危害等级严重。攻击者可利用此漏洞完全控制受影响的 vCenter Server 基础设施。"
published = "2021-02-24T17:15:15Z"
remediation = '立即将 vCenter Server 升级至修复版本：7.0 升级至 7.0 U1c（Build 17327517），6.7 升级至 6.7 U3l（Build 17138064），6.5 升级至 6.5 U3n（Build 17590285）；Cloud Foundation 4.x 升级至 4.2，3.x 升级至 3.10.1.2。如暂无法升级，可作为临时缓解措施：通过 SSH 登录 vCSA（或 RDP 登录 Windows 版 vCenter），备份 /etc/vmware/vsphere-ui/compatibility-matrix.xml，在其中添加 &lt;PluginPackage id="com.vmware.vrops.install" status="incompatible"/&gt; 后将 vROPs 插件标记为不兼容，再执行 service-control --stop vsphere-ui && service-control --start vsphere-ui 重启服务，验证 /ui/vropspluginui/rest/services/checkmobregister 返回 404 即生效。注意：在 vCenter High Availability（VCHA）环境中，上述操作须同时在 active 和 passive 节点上执行。'
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "VMware vCenter Server 远程代码执行漏洞"
updated = "2026-06-17T03:36:28Z"

