description = "Gitea 的 Debian 包注册表解析器存在两处独立可组合利用的拒绝服务漏洞。第一处为无限制解压漏洞：解析器在处理上传的 `.deb` 文件时，解压 `control.tar.gz` 后通过 `TeeReader` 将整个未压缩流复制到 `strings.Builder` 中，未对读取数据量设任何限制。由于 DEFLATE 压缩算法在重复输入下压缩比可超过 100:1，攻击者可构造仅 83 MB 的恶意 `.deb` 载荷，解压后膨胀至 16 GB 以上，在内容校验前即耗尽服务器内存。第二处为 O(N²) 字符串拼接漏洞：Description 字段的续行在循环中使用 `+=` 拼接，Go 字符串不可变性导致每次拼接都重新分配并复制整个累积内容，500000 行续行即可产生约 250 GB 的累计复制开销，使 CPU 饱和、GC 陷入密集回收循环。任何拥有包注册表写入权限的认证用户，通过单次上传请求即可触发完全拒绝服务。"
