[basic]
description = "itetris/xitetris 1.6.2 及更早版本在运行过程中依赖 PATH 环境变量查找并执行 gunzip 程序，未对可执行文件路径进行严格校验，导致存在特权任意命令执行漏洞。攻击者可通过修改自身 PATH 环境变量，使其指向包含恶意 gunzip 程序的自定义目录，从而以 root 权限执行任意系统命令。该漏洞影响运行 itetris 或 xitetris 1.6.1/1.6.2 版本的本地系统，CVSS 评分为 7.2，危害等级为高危。由于漏洞利用仅需本地访问权限，无需额外身份认证，攻击者可利用该漏洞完全控制目标系统。"
published = "2001-02-12T05:00:00.000"
remediation = "立即将 itetris 二进制的 setuid 位去除，执行 chmod u-s /usr/local/bin/itetris，阻止程序以 root 权限运行；如仍需要使用，应从源码编译并将 system() 调用中的 gunzip 替换为绝对路径 /bin/gunzip，避免依赖 PATH 环境变量；若该游戏无业务必要，建议直接卸载以彻底消除风险。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Itetris xitetris 特权任意命令执行漏洞"
updated = "2026-06-16T21:53:37.890"

