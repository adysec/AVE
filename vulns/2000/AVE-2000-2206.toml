[basic]
description = "American Power Conversion (APC) PowerChute 的 HTTP 服务存在默认凭据漏洞，未对管理员账户进行强制密码修改提示。远程攻击者无需身份认证即可通过 Web 界面使用预设的默认用户名和密码登录系统，进而获取管理员权限。该漏洞影响部署了 APC PowerChute 电源管理软件的服务器及网络设备，攻击者可利用默认凭据控制 UPS 管理接口，导致未经授权的系统访问和配置篡改，严重时可中断关键业务系统的电力管理。"
published = "2000-12-31T05:00:00Z"
remediation = "请立即升级 APC PowerChute到最新版本，删除默认管理员凭据。编辑<code>/opt/apcps/etc/passwd</code>文件，移除<code>admin</code>用户的默认密码或设置强密码；同时更新<code>/opt/apcps/etc/web.conf</code>配置文件，禁用HTTP Basic Auth认证，建议对Web管理端口进行防火墙限制，仅开放内部网络访问。通过SNMP community string强制变更，使用强密码策略（包含大小写字母、数字、特殊字符），并在每台设备上启用日志记录审计功能记录所有登录尝试，定期监控安全日志以检测异常访问。"
score = 9
severity = "CRITICAL"
sources = ["epss"]
title = "American Power Conversion PowerChute 默认凭据未授权访问漏洞"
updated = "2026-06-16T21:53:27Z"

