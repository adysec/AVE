[basic]
description = "Rxvt 2.6.1/2.6.2 的 tt_printf 函数存在缓冲区溢出漏洞，本地用户可通过向该程序传递超长的 -T 或 -name 命令行参数触发缓冲区溢出，导致攻击者能够以当前用户权限执行任意代码或提升至更高权限。该漏洞影响 Rxvt 2.6.1 及 2.6.2 版本，攻击前提是拥有本地系统访问权限，利用难度较低，CVSS 评分 4.6，危害等级中危。"
published = "2001-06-15T04:00:00Z"
remediation = "升级 rxvt 至 2.6.3 或更高版本，该版本已修复 tt_printf 函数缓冲区溢出问题。如无法升级，建议限制本地用户对 rxvt 的 SUID 权限，移除 setuid bit：`chmod u-s /usr/bin/rxvt`，或替换为 rxvt-unicode (urxvt) 等维护中的终端模拟器。"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Rxvt rxvt 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:55:32Z"

