[basic]
description = "ConnectWise ManagedITSync（Kaseya VSA 集成组件）存在未授权 SQL 注入漏洞。攻击者无需身份认证即可通过 Kaseya VSA Web 接口访问 ManagedIT.asmx 页面，执行任意 SQL 读写操作，直接获取 VSA 数据库完全控制权。2019 年 2 月该漏洞已被在野利用，攻击者通过注入恶意 SQL 下载并执行勒索软件，加密所有由 VSA 服务器管理的终端设备数据。该漏洞影响所有使用 ConnectWise ManagedITSync 集成的 Kaseya VSA 版本，CVSS 评分 9.8，危害等级严重。"
published = "2019-02-05T06:29:00Z"
remediation = "该产品（ConnectWise ManagedITSync for Kaseya VSA）已停止维护（End-of-Life），无安全补丁可用。建议立即从 Kaseya VSA 服务器上禁用或卸载 ManagedITSync 集成组件，并在防火墙层面限制对 ManagedIT.asmx 页面的外部访问。如业务依赖该功能，应迁移至受支持的替代方案。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "ConnectWise ManagedITSync Kaseya VSA 集成未授权SQL注入漏洞"
updated = "2026-06-17T01:12:41Z"

