[basic]
description = "Kubernetes 存在命名空间终止期间的竞争条件漏洞（CWE-362），当命名空间被删除时，对象删除顺序未定义，网络策略可能在受其保护的 Pod 之前被删除，导致恶意或已遭入侵的 Pod 能够绕过网络策略施加的访问限制。攻击者利用此时间窗口可实现对集群内其他 Pod 的未授权网络访问，造成机密性影响。该漏洞 CVSS 评分 3.1，危害等级低，攻击复杂度高，需相邻网络访问权限。建议升级至修复版本以消除竞争条件窗口。"
published = "2025-03-20T17:15:37Z"
remediation = "此漏洞暂无官方修复版本。缓解措施：1) 删除命名空间前，先手动删除该命名空间下的所有 Pod 及工作负载资源，确保网络策略在 Pod 之后被清理；2) 使用社区提供的 network-policy-finalizer 控制器（github.com/kubernetes-sigs/network-policy-finalizer）为网络策略添加 finalizer，防止其在所保护的 Pod 删除前被提前清理。"
score = 3.1
severity = "LOW"
sources = ["msrc"]
title = "Kubernetes 命名空间终止期间网络策略绕过漏洞"
updated = "2026-06-17T08:20:31Z"

