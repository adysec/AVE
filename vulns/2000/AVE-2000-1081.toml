[basic]
description = "Microsoft IIS 远东版（4.0 和 5.0）在处理双字节字符编码时存在输入验证缺陷。攻击者可通过向服务器发送包含双字节字符前导字节的畸形 URL 请求，绕过 IIS 的脚本解析机制，导致本应被服务器解析执行的 ASP 等脚本文件以源代码形式直接泄露给客户端。攻击条件简单，无需身份认证，仅需发送特制 HTTP 请求即可触发。该漏洞可能导致网站源代码、数据库连接字符串等敏感信息泄露，为进一步攻击提供信息基础。"
published = "2001-02-12T05:00:00.000"
remediation = "立即在 IIS 管理器中删除 .HTR 脚本映射：打开 Internet 服务管理器 → 右键网站 → 属性 → 主属性 → WWW 服务 → 编辑 → 主目录 → 配置 → 删除 .HTR 条目。如业务必须保留 .HTR 功能，则安装 MS01-004 安全更新补丁（IIS 4.0 需 Windows NT 4.0 SP5/SP6a，IIS 5.0 需 Windows 2000 Gold/SP1/SP2）。同时建议将 Web 目录与系统盘分离，限制 IUSR_machinename 账户权限。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft IIS远东版双字节编码畸形URL远程源代码泄露漏洞"
updated = "2026-06-16T21:53:07.667"

