[basic]
description = "Linux 内核 BPF 子系统中存在一处竞态条件漏洞，源于 BPF map 的 freeze_mutex 在 mmap 操作期间被不当持有。该互斥锁原本用于防止 map_freeze() 与带有可写权限的内存映射操作之间发生冲突，但实现方式在持有锁的同时执行完整的 mm 和 VMA 操作，导致锁持有时间过长，且可能引发死锁。本地低权限攻击者若具备对该系统的有限访问权限，可通过精心构造的 BPF map 内存映射请求触发该竞争条件，导致系统不可用（高可用性影响）。该漏洞影响使用 BPF 功能的 Linux 内核版本，需通过更新内核至修复版本解决。"
published = "2025-03-12T10:15:18Z"
remediation = "升级 Linux 内核至已修复版本：5.10.237、5.15.181、6.1.135、6.6.80、6.12.17 或 6.13.5 及更高版本，可通过发行版包管理器执行更新（如 apt upgrade linux-image、yum update kernel），或直接应用上游补丁 271e49f8a58e。如暂时无法升级，可通过 sysctl 设置 kernel.unprivileged_bpf_disabled=1 及 kernel.kptr_restrict=2 限制未授权 BPF 操作作为临时缓解。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux内核 BPF 拒绝服务漏洞"
updated = "2026-07-14T13:17:24Z"

