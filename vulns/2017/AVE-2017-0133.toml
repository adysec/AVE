[basic]
description = "Atlassian Jira OAuth插件存在服务器端请求伪造（SSRF）漏洞。攻击者可利用IconUriServlet servlet在无需认证的情况下通过发送伪造的请求访问内部网络资源，甚至可能触发XSS攻击。该漏洞影响版本1.3.0-1.9.11（不含1.9.12）和2.0.0-2.0.3（不含2.0.4）的产品。攻击者可构造恶意请求利用SSRF漏洞探测内网服务、读取敏感文件（如AWS元数据）、甚至实现远程代码执行。该漏洞具有较高的安全风险，需立即关注并修复。"
published = "2017-08-23T19:29:00Z"
remediation = "升级 Atlassian OAuth Plugin 到 1.9.12 或 2.0.4 及以上版本修复 SSRF 漏洞（参考 Atlassian 官方修复 OAUTH-344：https://ecosystem.atlassian.net/browse/OAUTH-344）。如无法立即升级，可禁用 OAuth 插件或在防火墙层面限制 Jira 服务器对内网地址（如 169.254.169.254、127.0.0.1、内网段）的访问作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Atlassian Jira OAuth 插件 SSRF 漏洞"
updated = "2026-06-17T01:28:15Z"

