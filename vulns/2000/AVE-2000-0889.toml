[basic]
description = "该漏洞存在于 Microsoft Windows 95 和 Windows 98 的 IPX 协议实现中。由于系统在处理特定 IPX 格式的数据包时缺乏足够的校验，远程攻击者可以通过向目标系统发送一个源地址为广播地址的特制 IPX Ping 数据包（即畸形 IPX Ping 包）来触发此漏洞。攻击者无需通过身份验证即可在网络层实施攻击，这将导致目标系统崩溃或服务不可用，造成拒绝服务（DoS）影响。"
published = "2000-10-20T04:00:00Z"
remediation = "建议禁用 Windows 95/98 系统中的 IPX/SPX 协议栈以消除攻击面。具体操作为：进入“控制面板”→“网络”→“协议”选项卡，选中“IPX/SPX 协议”并将其删除。对于必须使用该协议的旧环境，建议升级至 Windows 2000 或更高版本操作系统。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Windows 95/98 IPX 协议拒绝服务漏洞"
updated = "2026-06-16T21:52:23Z"

