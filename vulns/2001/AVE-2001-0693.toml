[basic]
description = "Moby Netsuite Web Server 1.02 存在缓冲区处理不当漏洞，远程攻击者可通过向目标服务器发送超长 HTTP 请求触发该漏洞，造成拒绝服务，并可能借此执行任意系统命令。该漏洞影响 Moby Netsuite Web Server 1.02 版本，攻击者无需身份认证即可在远程位置发起攻击，通过构造包含异常长字段的 HTTP 请求报文即可利用。该漏洞 CVSS 评分为 2.1，危害等级较低。"
published = "2001-05-03T04:00:00Z"
remediation = "建议将 Moby Netsuite Web Server 1.02 升级至最新可用版本以修复该漏洞。若无法立即升级，应在服务器前端部署反向代理（如 Nginx）并限制 HTTP 请求头与请求体的大小（例如设置 client_max_body_size 与 large_client_header_buffers），同时在防火墙层面仅允许必要的 IP 访问该服务端口，减少远程攻击面。作为临时缓解措施，可在网络边界部署入侵检测系统拦截超长 HTTP 请求。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Moby Netsuite Web Server 拒绝服务漏洞"
updated = "2026-06-16T21:54:00Z"

