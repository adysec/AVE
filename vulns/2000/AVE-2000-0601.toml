[basic]
description = "SGI IRIX 操作系统 5.3 至 6.5.10 版本的 InPerson 组件中 inpview 程序存在竞争条件与符号链接攻击漏洞。该程序在运行过程中创建名为 .ilmpAAA 的临时文件时，未对文件名冲突及符号链接攻击进行有效防护，攻击者可利用可预测的临时文件名提前创建指向敏感系统文件的符号链接，在 inpview 以高权限执行并写入该文件时触发竞争条件，从而将符号链接指向的文件内容覆盖或篡改，实现本地权限提升。该漏洞影响 SGI IRIX 5.3 至 6.5.10 版本，仅需本地系统访问权限即可利用，无需额外身份认证，但由于需要把握临时文件创建的精确时机，攻击复杂度较高。成功利用后可导致攻击者获取系统更高权限，进而对系统机密性、完整性和可用性造成部分影响。"
published = "2000-10-20T04:00:00Z"
remediation = "升级 SGI IRIX 至 6.5.11 或更高版本以修复 inpview 符号链接竞争条件漏洞（SGI 安全公告 2000-11-01-I）。如无法立即升级，可将 /usr/lib/InPerson/inpview 的 SUID 位移除（chmod u-s /usr/lib/InPerson/inpview）或直接删除该文件以阻止利用，同时对 /var/tmp 目录设置粘滞位（chmod 1777 /var/tmp），防止普通用户创建指向敏感文件的符号链接，作为临时缓解措施。"
score = 3.7
severity = "LOW"
sources = ["avd"]
title = "SGI IRIX InPerson inpview 竞态条件漏洞"
updated = "2026-06-16T21:52:30Z"

