[basic]
description = "Samba 2.0.7 的 Web 管理工具 SWAT（Samba Web Administration Tool）存在符号链接漏洞。本地攻击者可通过在 cgi.log 日志文件路径上创建符号链接，诱使 SWAT 以 root 权限写入日志，从而覆盖系统任意文件。该漏洞利用条件为攻击者拥有本地访问权限，无需身份认证即可实施攻击，可导致敏感文件被破坏或权限提升。CVSS 评分 7.2，危害等级高。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 Samba 至 2.0.8 或更高版本，该版本已修复 SWAT 对 cgi.log 文件的符号链接检查。如无法升级，可移除 SWAT 的 setuid 权限（chmod -s /usr/sbin/swat），或禁用 SWAT 服务（注释掉 /etc/inetd.conf 中 swat 行并重启 inetd）。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Samba SWAT 符号链接漏洞"
updated = "2026-06-16T21:52:48.227"

