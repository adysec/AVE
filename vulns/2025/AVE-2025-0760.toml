[basic]
description = "Windows 地理位置服务（Geolocation Service）存在权限管理不当漏洞（CWE-284），低权限认证用户可通过网络向受影响系统发送特制请求，利用该服务对位置信息的访问控制缺陷，导致系统位置数据等敏感信息被未授权读取。攻击者无需用户交互即可远程触发，但需事先获得有效登录凭据。该漏洞影响 Windows 10/11 及 Windows Server 多个版本，CVSS 评分 6.5，危害等级中危。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:52Z"
remediation = "安装 Microsoft 2025 年 1 月安全更新 (KB5049981)，该更新修复了 Windows 地理位置服务 (Geolocation Service) 的信息泄露漏洞。可通过 Windows Update 自动获取并安装更新，或从 Microsoft 更新目录网站手动下载。如无法立即打补丁，建议限制低权限用户对地理位置服务的网络访问作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 地理位置服务信息泄露漏洞"
updated = "2026-06-17T08:43:02Z"

