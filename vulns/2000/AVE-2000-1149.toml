[basic]
description = "Apache Tomcat 3.1 之前版本中的 source.jsp 存在目录遍历漏洞，远程攻击者通过在 source.jsp 的参数中构造 `..`（点点）序列进行路径穿越，可读取服务器上的任意文件，导致敏感信息泄露。攻击无需身份认证，仅需网络访问即可利用，危害中等。厂商已在新版本中修复此漏洞。"
published = "2002-03-22T05:00:00Z"
remediation = """
The user wants me to generate a remediation field for CVE-2000-1210. Based on the NVD data, this is a directory traversal vulnerability in Apache Tomcat before 3.1. The fix is to upgrade to Tomcat 3.1 or later. I need to provide actionable steps in Chinese, at least 20 characters.

Let me craft a proper remediation field.<value>升级 Apache Tomcat 至 3.1 或更高版本，该版本已修复 source.jsp 中的目录遍历漏洞。如无法立即升级，可删除或禁用 source.jsp 文件，并在 Web 服务器层配置 URL 过滤规则，拦截包含 `..` 路径穿越特征的请求。同时限制 Tomcat 对敏感系统目录的访问权限。"""
score = 5
severity = "MEDIUM"
