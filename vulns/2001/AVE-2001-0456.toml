[basic]
description = "Digital UNIX（Tru64 UNIX）4.0G 及更早版本中的 msgchk 工具存在符号链接漏洞。msgchk 在读取用户 MH 邮件配置文件 .mh_profile 时未对符号链接进行安全检查，攻击者可在本地创建一个将 .mh_profile 指向任意目标文件的符号链接，当受害者执行 msgchk 命令时，程序会跟随该符号链接读取目标文件内容，导致攻击者能够获取目标文件的第一行数据。该漏洞需要本地访问权限，攻击条件为攻击者可在 msgchk 用户的主目录下创建符号链接，利用方式简单，属于低危信息泄露漏洞。"
published = "2001-09-10T04:00:00Z"
remediation = "由于 msgchk 以 setuid root 权限运行时可通过 .mh_profile 符号链接读取任意文件首行，请立即使用 chmod 命令移除 /usr/bin/mh/msgchk 的 setuid 位（chmod u-s /usr/bin/mh/msgchk），以消除提权风险。同时审查所有用户主目录，删除指向敏感文件的 .mh_profile 符号链接（find ~ -name .mh_profile -type l -delete）。长期方案为将系统从 Digital Unix 4.0G 升级至 Tru64 UNIX 5.0 或更高版本，该版本已修复此符号链接漏洞。如无法升级操作系统，可考虑禁用 MH 邮件系统或限制 msgchk 的执行权限。"
score = 2.1
severity = "LOW"
sources = ["exploitdb"]
title = "Compaq Digital UNIX msgchk 符号链接漏洞"
updated = "2026-06-16T21:55:34Z"

