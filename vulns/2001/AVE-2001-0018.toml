[basic]
description = "HomeSeer 1.4.29 之前版本存在目录遍历漏洞，远程攻击者可通过在 URL 中包含 `..`（点点）序列符绕过访问限制，读取服务器上的任意文件。该漏洞源于程序对用户提供的路径输入缺乏充分的过滤与验证，攻击者无需身份认证即可通过网络远程利用，导致敏感信息泄露。利用方式简单，仅需构造包含目录遍历序列的特制 HTTP 请求即可实现。"
published = "2001-02-16T05:00:00Z"
remediation = "立即将 HomeSeer 升级至 1.4.29 或更高版本，该版本修复了 URL 中 `..` 目录遍历的问题。如无法升级，建议在 Web 服务器或反向代理层配置规则，拦截包含 `../` 或 `..%2f` 等路径遍历特征的请求，并限制 HomeSeer Web 服务仅监听内网接口，避免暴露到公网。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "keware technologies HomeSeer 1.4 目录遍历漏洞"
updated = "2026-06-16T21:53:32Z"

