[basic]
description = "Windows 通用日志文件系统（CLFS）驱动程序存在内存对象处理不当的权限提升漏洞。本地攻击者可通过在目标系统上运行特制应用程序触发该漏洞，获得 SYSTEM 权限执行任意代码，实现完全控制受影响系统。该漏洞影响 Windows 7 至 Windows 10 及 Windows Server 2008 R2 至 Server 2019 等多个版本，CVSS 评分 7.8，危害等级高。攻击者需具备本地登录权限，无需用户交互即可利用。"
published = "2019-09-11T22:15:14Z"
remediation = "安装 Microsoft 2019 年 9 月安全更新（Windows 10 1903 对应 KB4515384，1809 对应 KB4512578，1803 对应 KB4512501，Windows 7/8.1 对应 KB4512486），或通过 Windows Update 自动更新。无法立即打补丁时，限制低权限用户登录受影响的系统作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows 通用日志文件系统驱动程序权限提升漏洞"
updated = "2026-06-17T02:28:05Z"

