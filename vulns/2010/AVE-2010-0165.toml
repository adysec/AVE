[basic]
description = "Apple QuickTime 7.6.9 之前版本在 Windows 平台上处理 Track Header（tkhd）原子时存在堆缓冲区溢出漏洞。远程攻击者可构造包含特制 tkhd 原子的恶意媒体文件，诱使用户打开后触发堆内存越界写入，导致应用程序崩溃或任意代码执行。该漏洞影响所有 QuickTime 7.6.9 以下版本，CVSS 评分 9.3，危害等级严重。用户需升级至 QuickTime 7.6.9 或更高版本以修复此漏洞。"
published = "2010-12-09T20:00:16Z"
remediation = "立即将 Apple QuickTime 升级到 7.6.9 或更高版本，该版本通过改进边界检查修复了 tkhd atom 堆缓冲区溢出问题。Windows 用户可通过 Apple 软件更新或访问 http://support.apple.com/kb/HT4447 下载安装。如无法立即升级，建议在浏览器中禁用 QuickTime 插件，并避免打开来源不明的媒体文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime Track Header原子堆缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T23:18:31Z"

