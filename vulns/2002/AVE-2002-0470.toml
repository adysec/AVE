[basic]
description = "Nullsoft SHOUTcast 1.8.9 及 1.8.12 之前版本存在远程缓冲区溢出漏洞。经过身份验证的远程 DJ 用户可通过向服务器发送包含超长值的 icy- 开头头部字段，触发栈缓冲区溢出，导致任意代码执行。攻击者需拥有 DJ 权限，CVSS 评分 7.5，危害等级高。"
published = "2002-10-04T04:00:00Z"
remediation = "升级 Nullsoft SHOUTcast 至 1.8.12 或更高版本，该版本修复了 icy- 头部处理中的缓冲区溢出问题。如无法升级，可在服务器防火墙限制仅允许受信任 IP 连接 SHOUTcast 管理端口，并限制 DJ 账户的访问权限作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Nullsoft SHOUTcast 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:58:22Z"

