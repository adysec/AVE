[basic]
description = 'PHP PDO PostgreSQL 驱动在启用 PDO::ATTR_EMULATE_PREPARES 时，预处理语句参数包含无效字符序列（如 \x99）会导致引用函数 PQescapeStringConn 返回 NULL，进而引发 pdo_parse_params() 函数空指针解引用。该漏洞影响 PHP 8.1.34 以前、8.2.30 以前、8.3.29 以前、8.4.16 以前及 8.5.1 以前版本，攻击者可通过构造恶意预处理参数触发段错误导致服务崩溃，造成拒绝服务，CVSS 评分 8.2（高危）。'
published = "2025-12-27T20:15:40Z"
remediation = '升级 PHP 至以下修复版本：PHP 8.1.x ≥ 8.1.34、PHP 8.2.x ≥ 8.2.30、PHP 8.3.x ≥ 8.3.29、PHP 8.4.x ≥ 8.4.16、PHP 8.5.x ≥ 8.5.1（参考 SUSE-SU-2026:20146-1 公告）。修复后在 php.ini 中设置 `pdo_pg emulate_prepares = Off` 以禁用模拟预处理模式，从而规避 PQescapeStringConn 返回 NULL 导致空指针解引用的问题。若无法立即升级，可在应用层对用户输入进行字符集过滤，剔除或转义无效字节序列（如 \x99 等非 UTF-8 字符），防止其进入 PDO PostgreSQL 驱动的参数化处理流程。'
score = 8.2
severity = "HIGH"
sources = ["msrc"]
title = "PHP PDO PostgreSQL 空指针解引用拒绝服务漏洞"
updated = "2026-06-17T08:35:28Z"

