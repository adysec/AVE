[basic]
description = "IBM Tivoli Management Framework 3.7.1 中的 Tivoli Lightweight Client Framework (LCF) HTTP 接口在安装时将 http_disable 参数默认设置为 0，导致远程认证用户可通过操纵日志文件绕过 Tivoli Endpoint Configuration 数据文件的权限控制，实现未授权访问和修改。该漏洞影响 Tivoli Management Framework 3.7.1 版本，攻击者需拥有有效认证凭据，CVSS 评分 9.0，危害等级高。"
published = "2000-12-31T05:00:00Z"
remediation = "IBM Tivoli Management Framework 3.7.1 已停止维护，官方不再提供安全补丁。建议立即在 LCF 配置文件（通常位于安装目录的 lcf/lcfd.ini 或 lcf/lcf.runtime）中将 http_disable 参数设置为 1 以禁用 HTTP 接口，并重启 LCF 守护进程。同时，在防火墙上限制对 Tivoli 管理端口（默认 9495/9496）的访问，仅允许受信任的管理员 IP 连接。长远方案为迁移至受支持的 IBM Tivoli 替代产品或采用现代统一端点管理平台。"
score = 9
severity = "CRITICAL"
sources = ["cve"]
title = "IBM Tivoli Management Framework 安全绕过漏洞"
updated = "2026-06-16T21:53:26Z"

