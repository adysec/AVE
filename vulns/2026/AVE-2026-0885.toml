[basic]
description = "Dify AI Workflow 的 AppInitializer 组件在处理 OAuth 认证流程时存在开放重定向漏洞。由于未对 oauth_redirect_url 参数进行充分校验，远程攻击者可构造恶意 URL 诱导用户点击，将用户重定向至攻击者控制的恶意站点，从而窃取敏感信息或实施钓鱼攻击。该漏洞需要用户交互才能触发，攻击者须诱使用户访问恶意页面。影响 Dify AI Workflow 相关版本，CVSS 评分 5.4，危害等级中危。"
published = "2026-07-29T20:17:02Z"
remediation = "立即将 Dify 升级至 v1.14.1 或更高版本（最新为 v1.16.1），该版本包含多项安全加固。如无法立即升级，在反向代理层配置白名单规则，仅允许 OAuth 回调跳转到可信域名列表，拒绝所有未在白名单中的重定向目标；同时在 Dify 的 OAuth 配置中严格校验 `oauth_redirect_url` 参数，禁止跳转到外部不可信站点。"
score = 5.4
severity = "MEDIUM"
sources = ["zdi"]
title = "Dify AI Workflow 开放重定向漏洞"
updated = "2026-07-30T14:19:24Z"

