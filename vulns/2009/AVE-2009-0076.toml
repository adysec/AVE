[basic]
description = "tags.<value>Adobe Flash Player（9.0.246.0 之前版本及 10.x 10.0.32.18 之前版本）和 Adobe AIR（1.5.2 之前版本）存在空指针引用漏洞。攻击者可通过构造恶意 SWF 内容或诱骗用户访问包含特制 Flash 内容的网页，触发空指针解引用，导致应用程序崩溃或远程代码执行。该漏洞影响 Windows、Mac OS X 及 Linux 平台上的 Flash Player 和 AIR 运行时，攻击者无需身份认证即可在受害者系统上执行任意代码，完全控制受影响主机。Adobe 已发布安全公告 APSB09-10，建议用户升级至 Flash Player 9.0.246.0 或 10.0.32.18 及 AIR 1.5.2 以修复此漏洞。"
published = "2009-07-31T19:30:00Z"
remediation = "立即将 Adobe Flash Player 升级至 9.0.246.0（Flash Player 9.x）或 10.0.32.18（Flash Player 10.x）及更高版本，Adobe AIR 升级至 1.5.2 及更高版本。如无法立即升级，可在浏览器中禁用 Flash Player 插件或启用点击保护（Click-to-Play）功能作为临时缓解措施，避免访问不可信的网页内容。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player AIR 空指针引用远程代码执行漏洞"
updated = "2026-06-16T23:08:14Z"

