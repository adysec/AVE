[basic]
description = "Nuxt 框架的内部 island renderer 端点（`/__nuxt_island/...`）存在 CPU 耗尽漏洞。该端点在验证 URL 中的 hash 之前，会先完整读取、解析并哈希攻击者控制的 JSON body 内容，导致未验证的计算浪费。未经身份认证的远程攻击者无需提供有效 hash，只需向 `/__nuxt_island/<name>_<anything>.json` 发送包含大型 JSON body（如约 4.6 MB 或 15 万个键值对）的 POST 请求，即可触发 destr 解析和 ohash 哈希计算。由于 Nitro 运行在单事件循环上，这会耗尽 CPU 资源并延迟所有并发请求，低频率的恶意请求即可导致服务器性能严重降级甚至停滞。该漏洞影响 Nuxt 3.1.0 至 3.21.10 以及 4.5.1 之前的版本，CVSSv3.1 评分为 7.5。"
published = "2026-08-05T22:17:08Z"
remediation = "标签包裹。<value>将 Nuxt 升级至 3.21.10（3.x 分支）或 4.5.1（4.x 分支），新版本在 island handler 中对 `/__nuxt_island/` 路径强制执行请求体大小限制（413）和 JSON 嵌套深度限制（400）。如暂无法升级，可在 Nginx/Caddy 等反向代理层对该路径设置请求体大小限制（如 `client_max_body_size 1m`），或禁用服务器组件作为临时缓解。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Nuxt Nuxt.js 框架 CPU 耗尽拒绝服务漏洞"
updated = "2026-08-06T14:16:44Z"

