[basic]
description = "OpenClaw 的 Canvas 网关端点存在路径遍历漏洞，由于在处理用户提供的路径参数时缺乏充分的验证，导致攻击者可在文件操作中使用恶意构造的路径。经过身份认证的远程攻击者可通过向受影响版本的 OpenClaw 发送特制的请求，利用该漏洞读取服务账户权限下的任意文件，造成敏感信息泄露。该漏洞影响 OpenClaw 2026.2.21 之前的所有版本，CVSS 评分 6.5，危害等级中危。"
published = "2026-04-11T01:16:15.837"
remediation = "立即升级 OpenClaw 至 2026.2.21 或更高版本（commit 39816e6），该版本已在 canvas 工具的 a2ui_push 处理器中对 jsonlPath 参数添加了路径规范化与目录白名单校验。如无法立即升级，可在网关前置反向代理（如 Nginx）中配置规则，拦截对 /tools/invoke 接口中 jsonlPath 参数包含 ../ 或绝对路径的请求，同时限制网关进程的文件系统访问权限（如使用容器只读文件系统或 seccomp 策略）。"
score = 6.5
severity = "MEDIUM"
sources = ["zdi"]
title = "OpenClaw Canvas 路径穿越信息泄露漏洞"
updated = "2026-06-17T10:44:00.600"

