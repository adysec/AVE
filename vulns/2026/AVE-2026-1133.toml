[basic]
description = "Format Plugins 1.1.2 及更早版本存在基于堆的缓冲区溢出漏洞（CWE-122）。当用户打开特制恶意文件时，格式插件在处理文件格式解析过程中触发堆内存越界写入，攻击者可在当前用户上下文中执行任意代码。该漏洞影响所有使用受影响版本格式插件的系统，CVSS v3.1 评分为 7.8（高危），攻击向量为本地访问，利用需用户交互（受害者必须打开恶意文件）。成功利用可能导致敏感信息泄露、系统被完全控制等严重后果。"
published = "2026-06-09T21:17:25.143"
remediation = "建议立即将 Adobe Format Plugins 升级到 1.1.3 或更高版本，可访问 https://helpx.adobe.com/security/products/formatplugins/apsb26-65.html 获取补丁。如无法立即升级，应避免打开来源不明的恶意文件，并禁用相关格式插件的自动预览功能以降低被攻击风险。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Adobe Format Plugins 基于堆的缓冲区溢出漏洞"
updated = "2026-07-23T09:10:00.113"

