[basic]
description = "WebActive HTTP Server 1.00 存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向服务器发送超长 URL 请求触发该漏洞，导致服务器进程崩溃，造成拒绝服务。该漏洞影响 WebActive HTTP Server 1.00 版本，攻击复杂度低，仅需网络访问即可利用，无需用户交互，危害等级中危。"
published = "2000-07-12T04:00:00Z"
remediation = "该漏洞影响 WebActive HTTP Server 1.00，该产品已停止维护，建议立即迁移至其他受支持的 Web 服务器（如 Apache HTTP Server、Nginx 等）。迁移前可在反向代理或 WAF 层面限制 URL 长度不超过 2048 字节，并过滤包含大量连续字符的畸形请求作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "WebActive HTTP Server 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:10Z"

