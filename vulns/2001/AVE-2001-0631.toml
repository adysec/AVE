[basic]
description = "Oracle XSQL Servlet 1.0.3.0 及更早版本存在远程代码执行（RCE）漏洞。攻击者可构造恶意的 XSL 样式表，通过 xml-stylesheet 参数将 XSQL 服务器重定向到攻击者控制的其它来源，使服务器在处理该样式表时解析并执行其中包含的任意 Java 代码，从而在服务器端以 Oracle 进程权限执行恶意操作。该漏洞影响 Oracle 8i（含 8.1.7.x）等产品中启用的 XSQL Servlet 组件，攻击者无需认证即可远程触发，危害等级中危（CVSS 5.0）。成功利用后攻击者可读取或篡改数据、窃取敏感信息、破坏系统完整性，甚至进一步控制受影响的服务器。"
published = "2001-03-12T00:00:00Z"
remediation = """建议立即安装 Oracle 数据库 8.1.7.x 的补丁集（Patch Set），并升级 XSQL Servlet 到 Oracle 官方发布的最新版本（如修补程序类别更新），因为 Oracle 8.1.7 系列已停止官方支持，最好整体升级到受支持的 Oracle9i 及以上版本。同时对 XSQL Servlet 所有接收外部输入参数的 URL 进行严格过滤与编码，转义输出中的 `<`、`>`、`"`、`'`、`&` 等敏感字符，并校验请求中的参数长度与字符集。若无法立即升级，可在 Web 服务器（如 Apache/IIS）或反向代理层为 /xsql 相关路径配置输入验证规则，并启用 Web 应用防火墙（WAF）拦截 XSS 载荷作为临时缓解措施。"""
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Oracle 8.1.7 XSQL Servlet 跨站脚本攻击漏洞"
updated = "2001-03-12T00:00:00Z"

