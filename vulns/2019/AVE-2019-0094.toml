[basic]
description = "WordPress 的 Woody ad snippets 插件在 2.2.5 版本之前，其 admin/includes/class.import.snippet.php 文件中的选项导入功能未进行身份验证，导致未经身份验证的远程攻击者可以直接发送特制的导入请求，将包含跨站脚本（XSS）载荷的恶意选项写入网站配置。当具有管理员权限的用户访问包含这些恶意选项的页面时，存储的 XSS 代码被执行，攻击者可借此进一步提升权限或在服务器上执行任意代码，最终实现远程代码执行。该漏洞影响所有使用受影响版本插件的 WordPress 站点，CVSS v3.1 评分为 8.8，危害等级为高。"
published = "2019-09-03T07:15:10Z"
remediation = "立即将 Woody ad snippets 插件升级到 2.2.5 或更高版本。由于该插件原作者已停止维护并因安全问题从 WordPress 官方仓库下架，建议直接卸载旧版 woody-ad-snippets / display-widgets 插件，改用由 Themeisle 接手的 Woody Code Snippets（insert-php）最新版本（当前 2.7.6）。升级前请先检查 WordPress 数据库中是否存在未经授权的 snippets 或管理员账户，并清理插件设置页中的导入配置，防止残留的 XSS 或远程代码执行入口被利用。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress Woody ad snippets 插件未认证选项导入漏洞"
updated = "2026-06-17T02:21:13Z"

