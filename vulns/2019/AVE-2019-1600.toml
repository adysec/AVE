[basic]
description = "iOS 和 macOS 系统中的 cfprefsd 组件存在内存损坏漏洞（CWE-787 越界写入），由于对输入验证不足导致。本地攻击者可通过诱使用户打开恶意应用程序触发该漏洞，成功利用可在目标系统上以内核权限执行任意代码，实现权限提升。该漏洞影响 iOS 12.1.4 之前版本及 macOS Mojave 10.14.3 补充更新之前版本，CVSS 评分 7.8，危害等级高。Apple 已在 2019 年 2 月发布的安全更新中修复此漏洞。"
published = "2019-12-18T18:15:22Z"
remediation = "立即将 iPhone/iPad 升级至 iOS 12.1.4 或更高版本（设置 > 通用 > 软件更新），将 Mac 升级至 macOS Mojave 10.14.3 Supplemental Update（系统偏好设置 > 软件更新）。该漏洞已被 Google Project Zero 发现并确认存在在野利用，无法立即升级时建议限制不可信应用的安装与运行，并启用系统完整性保护（SIP）。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Apple iOS 和 macOS cfprefsd 内存损坏权限提升漏洞"
updated = "2026-06-17T02:40:23Z"

