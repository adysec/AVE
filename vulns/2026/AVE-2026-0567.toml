[basic]
description = "nimiq-primitives 库中的 TrieProof::verify 函数存在 panic 漏洞，当 TrieProofNode 的 child_index 方法对等长键执行 unwrap 操作时，若收到包含两个相同键的 TrieProofNode 的恶意 TrieChunk，会导致程序崩溃。远程攻击者只需作为状态同步源向正在同步的节点发送特制的 TrieChunk 数据包，即可在密码学证明验证之前触发 panic，造成节点临时崩溃重启。该漏洞影响 core-rs-albatross ≤ 1.5.1 版本，攻击者需要被选为受害者的同步对等节点，危害等级低，已在 1.6.0 版本中修复。"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 core-rs-albatross 升级至 1.6.0 或更高版本（commit 41d35ace），该版本在 child_index 中增加了等长密钥拒绝逻辑，避免 panic。如无法升级，仅允许与受信节点建立状态同步连接，避免恶意对等体发送特制 TrieChunk 触发崩溃。"
score = 3.5
severity = "LOW"
sources = ["ghsa"]
title = "Nimiq core-rs-albatross TrieProof 验证拒绝服务漏洞"
updated = "2026-01-01T00:00:00Z"

