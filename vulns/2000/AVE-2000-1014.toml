[basic]
description = "Aplio PRO 电话系统的 authenticate.cgi CGI 程序存在命令注入漏洞。未经身份认证的远程攻击者可通过向密码参数中注入 shell 元字符，触发 CGI 程序执行任意系统命令。该漏洞影响运行 Aplio PRO 的 VoIP 系统，攻击者可借此获取服务器控制权。CVSS 评分为 7.5，危害等级为高危。"
published = "2000-12-19T05:00:00.000"
remediation = "升级到 Aplio PRO 2.0.33 之后的修复版本（厂商已发布补丁），或禁用 authenticate.cgi CGI 接口。若无法升级，在 Web 服务器层面禁用或移除 authenticate.cgi，通过 WAF 规则拦截包含 shell 元字符（如 ; | & $ `）的 password 参数请求，并将 Aplio PRO 管理接口从公网移除，仅允许内网管理访问。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Aplio PRO 远程代码执行漏洞"
updated = "2026-06-16T21:52:46.530"

