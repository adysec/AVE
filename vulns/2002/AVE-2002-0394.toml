[basic]
description = "SurfControl SuperScout WebFilter for Windows 2000 的 Web Reports Server 组件中的 SimpleBar.dll 存在 SQL 注入漏洞。远程攻击者无需身份认证即可通过向 RunReport 选项传递特制的 SQL 查询参数，利用该漏洞执行任意 SQL 语句，导致数据库中的敏感信息泄露、数据篡改或进一步获取系统控制权。该漏洞影响 SurfControl SuperScout WebFilter 系列产品，攻击复杂度低，已有公开利用代码。"
published = "2002-10-10T04:00:00Z"
remediation = "该漏洞影响 SurfControl SuperScout WebFilter 3.0 的 Web Reports Server 组件（SimpleBar.dll），厂商已停止维护该产品且不再发布安全补丁。建议立即采取以下措施：1）在防火墙层面限制对 Web Reports Server 默认端口 TCP 8888 的访问，仅允许受信任的管理员 IP 地址；2）如业务仍需要 Web 过滤功能，应迁移至仍在安全更新支持期内的替代方案（如 Forcepoint Web Security 或同类产品）；3）检查并删除服务器上不再使用的 SimpleBar.dll 及相关报表 DLL 文件，以彻底消除攻击面。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "SurfControl SuperScout WebFilter SQL注入漏洞"
