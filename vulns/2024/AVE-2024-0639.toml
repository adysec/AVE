[basic]
description = "Linux 内核 Microchip PCI1xxxx 系列芯片的 GPIO 驱动程序中存在 IRQ 处理缺陷，当本地攻击者在访问 GPIO 寄存器值的同时触发 GPIO 中断时，驱动程序使用 generic_handle_irq 函数处理嵌套中断，导致中断上下文混乱，进而引发内核崩溃（kernel panic）。该漏洞影响 Linux 内核 6.1 至 6.13-rc6 版本，攻击者需具备本地低权限访问能力，通过精心构造的 GPIO 中断触发条件即可造成系统拒绝服务。Linux 内核社区已通过将 generic_handle_irq 替换为 handle_nested_irq 修复此问题。"
published = "2025-01-19T00:00:00Z"
remediation = "将 Linux 内核升级至 6.1.125、6.6.72 或 6.12.10 及以上版本，对应补丁已合入主线。Debian 12 用户应用 DSA-5860 安全更新（`apt update && apt upgrade`），Ubuntu 用户安装 USN-7381-1 更新后重启。如无法立即升级，可在 BIOS 中禁用板载 Microchip PCI1xxxx 控制器作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Microchip PCI1xxxx GPIO 中断处理内核崩溃漏洞"
updated = "2025-01-19T00:00:00Z"

