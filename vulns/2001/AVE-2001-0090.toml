[basic]
description = "FreeBSD 3.5.1/4.2 的 elvis 文本编辑器端口（ja-elvis 和 ko-helvis）存在缓冲区溢出漏洞。本地用户可通过向 elvrec 程序发送超长输入数据，触发缓冲区溢出，从而获得 root 权限。该漏洞影响 FreeBSD 3.5.1 和 4.2 版本，攻击条件为攻击者需具有本地账户访问权限。CVSS 评分为 7.2，危害等级为高危。"
published = "2001-06-02T04:00:00.000"
remediation = "立即将 ja-elvis 升级至 1.8.4_1 版本或 ko-helvis 升级至 1.8h2_1 版本，可通过 `pkg upgrade ja-elvis` 或 `pkg upgrade ko-helvis` 完成。若无法立即升级，可临时执行 `chmod u-s /usr/local/bin/elvrec` 移除 elvrec 的 suid root 权限以缓解风险，待升级完成后恢复。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "FreeBSD elvrec 权限提升漏洞"
updated = "2026-06-16T21:53:54.440"

