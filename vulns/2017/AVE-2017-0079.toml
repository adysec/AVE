[basic]
description = "WordPress 的 bws-linkedin 插件（版本低于 1.0.5）存在多处跨站脚本（XSS）漏洞。该漏洞源于插件对用户输入数据缺乏充分的过滤与转义处理，攻击者可通过向受影响页面注入恶意 JavaScript 脚本，当管理员或其他用户访问特制链接时，脚本在浏览器中执行，导致敏感信息泄露、会话劫持或恶意操作。攻击无需身份认证，但需要用户交互（点击链接），影响使用该插件的 WordPress 站点。"
published = "2019-08-21T19:15:12Z"
remediation = "将 WordPress 的 bws-linkedin 插件升级至 1.0.5 或更高版本。登录 WordPress 后台 → 插件 → 已安装插件 → 找到 bws-linkedin → 点击「更新」；或通过 FTP 删除旧版本后上传最新版。如无法立即更新，可暂时停用该插件作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress bws-linkedin插件跨站脚本漏洞"
updated = "2026-06-17T01:13:01Z"

