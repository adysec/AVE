[basic]
description = "Pileup 1.2 之前版本中存在缓冲区溢出漏洞，本地攻击者可通过向 /usr/bin/pileup 程序提供超长的命令行参数或超长的 callsign 参数触发缓冲区溢出，导致攻击者能够获取 root 权限。该漏洞影响 Debian 2.2 系统，攻击者需拥有本地访问权限，无需身份认证即可利用，CVSS 评分 7.2，危害等级高。"
published = "2001-07-23T04:00:00Z"
remediation = "升级 Pileup 至 1.2 或更高版本以修复缓冲区溢出漏洞。如无法升级，可移除 /usr/bin/pileup 的 SUID 位（chmod u-s /usr/bin/pileup）以消除本地提权风险，或卸载 pileup 软件包（apt-get remove pileup）。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Debian Pileup 缓冲区溢出本地权限提升漏洞"
updated = "2026-06-16T21:55:21Z"

