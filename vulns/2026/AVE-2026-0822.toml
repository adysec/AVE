[basic]
description = "Open WebUI 是一款可扩展、功能丰富且用户友好的自托管 AI 平台。其 WEB_FETCH_FILTER_LIST（服务端网页抓取的允许/阻止列表）存在主机名匹配缺陷：is_string_allowed 函数使用 str.endswith() 进行匹配，且调用时传入的是完整 URL 而非主机名。攻击者可通过在 URL 路径中添加目标域名绕过阻止列表（如 !internal.example.com 无法匹配带路径的 URL），或利用非标签边界匹配绕过允许列表（如 evilcorp.com 匹配 corp.com）。已认证用户可利用此漏洞访问管理员意图阻止的公开可解析主机，造成受限的 SSRF 信息泄露。该漏洞在 Open WebUI 0.10.0 版本中修复。"
published = "2026-07-09T17:17:03Z"
remediation = "立即升级 Open WebUI 至 v0.10.0 或更高版本（对应 commit 087878ce8）。如无法升级，在 `WEB_FETCH_FILTER_LIST` 中同时配置主机名和完整 URL 路径作为临时缓解，并确保 `ENABLE_RAG_LOCAL_WEB_FETCH` 保持关闭（默认值）以启用 SSRF 防护层。"
score = 4.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Open WebUI WEB_FETCH_FILTER_LIST 主机过滤绕过漏洞"
updated = "2026-07-10T17:39:40Z"

