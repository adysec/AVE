[basic]
description = "Mozilla Bonsai 1.3 是 Mozilla 开发的 CVS 查询工具，用于追踪 CVS 代码仓库的变更历史。该漏洞存在于 cvslog.cgi、cvsview2.cgi 和 multidiff.cgi 等 CGI 脚本中，这些脚本在处理特定错误条件时会将 Bonsai 工具的绝对路径名泄露到错误消息中。未经身份认证的远程攻击者只需向目标服务器发送特制请求触发这些 CGI 脚本的异常处理流程，即可获取服务器上的完整文件路径信息。路径泄露虽然本身不直接导致代码执行，但会暴露服务器的目录结构、部署配置等敏感信息，为后续针对性攻击（如结合其他路径遍历或文件包含漏洞）提供有利条件。该漏洞影响部署了 Mozilla Bonsai 1.3 版本的 Web 服务器，CVSS v2 评分为 5.0，危害等级为中等，攻击条件为网络可达且无需身份认证。"
published = "2003-04-02T05:00:00Z"
remediation = "升级 Mozilla Bonsai 至已修复该漏洞的版本，或应用 Bugzilla bug 187230 对应的补丁，该补丁从 cvslog.cgi、cvsview2.cgi 和 multidiff.cgi 的错误信息中移除了绝对路径泄露。临时缓解措施：在 Web 服务器配置中关闭这些 CGI 脚本的详细错误输出，或通过 .htaccess 限制仅允许内网访问 Bonsai 工具，避免外部攻击者获取服务器物理路径信息。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Bonsai 路径信息泄露漏洞"
updated = "2026-06-16T22:01:39Z"

