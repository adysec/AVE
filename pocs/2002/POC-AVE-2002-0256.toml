[info]
author = "ave"
description = "检测目标系统上是否存在受 CVE-2002-0311 影响的 SCOAdminReg.cgi 二进制文件。该文件在处理 -c 参数时未正确过滤 Shell 元字符，可导致低权限用户执行任意命令并获取 root 权限"
id = "POC-AVE-2002-0256"
name = "CVE-2002-0311 PoC"
severity = "critical"
tags = ["ave-2002-0256"]
vuln_id = [
    "CVE-2002-0311",
    "AVE-2002-0256",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/cgi-bin/admin/scoadminreg.cgi"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
