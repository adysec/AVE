[basic]
description = "IBM OS/2 Warp 4.5 系统自带的 FTP 服务器存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向服务器发送超长的用户名（username）字符串触发该漏洞，导致 FTP 服务进程崩溃，造成拒绝服务。该漏洞影响 OS/2 Warp 4.0/4.2/4.3/4.5 等版本，CVSS 评分 5.0，危害等级中等。目前官方已停止对该系统的支持，建议用户迁移至其他受支持的操作系统。"
published = "2000-10-20T04:00:00.000"
remediation = "立即安装 IBM 发布的 TCP/IP v4.3 for OS/2 修复补丁 IC27721（下载地址：ftp://ftp.software.ibm.com/ps/products/tcpip/fixes/v4.3os2/ic27721/README），该补丁修复了 FTP 服务器对超长用户名处理不当导致的拒绝服务问题。如无法立即打补丁，可在防火墙层面限制对 FTP 端口（21/TCP）的访问来源，仅允许可信 IP 连接。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "IBM OS/2 Warp 4.5 FTP Server 拒绝服务漏洞"
updated = "2026-06-16T21:52:25.567"

