[basic]
description = "Apple iTunes 10.7之前版本所集成的WebKit浏览器引擎存在内存破坏漏洞。远程攻击者可通过构造恶意网站，在用户使用受影响版本iTunes访问该网站时触发内存破坏，导致任意代码执行或应用程序崩溃（拒绝服务）。该漏洞影响所有安装了iTunes 10.7以下版本的Windows和Mac系统用户，攻击条件为用户必须访问攻击者控制的恶意网页，利用方式为通过特制网页内容触发WebKit组件中的内存错误，成功利用后可完全控制受影响系统。"
published = "2012-09-13T10:30:19Z"
remediation = '建议将 Apple iTunes 升级至 10.7 或更高版本，该版本通过改进 WebKit 内存处理机制修复了多个内存损坏问题。用户可在 iTunes 中依次点击"帮助"→"检查更新"进行升级，或从 Apple 官网下载最新版 iTunes 安装程序覆盖安装。如企业环境无法立即升级，建议通过防火墙或代理服务器拦截对恶意网站的访问，并临时限制 iTunes 内嵌浏览器访问外部网页，直至完成版本升级。'
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:34Z"

