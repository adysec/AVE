[basic]
description = "SAP NetWeaver Application Server Java 7.5 的 scheduler/ui/js/ffffffffbca41eb4/UIUtilJavaScriptJS 组件存在目录遍历漏洞。远程攻击者无需身份认证即可通过向受影响路径发送包含 `..`（点点）序列的恶意查询字符串，绕过路径限制读取服务器上的任意文件，导致敏感信息泄露。该漏洞已在 2017 年 8 月被野外利用，影响范围广泛。CVSS 评分 7.5，危害等级高。SAP 已在安全公告 2486657 中提供修复补丁。"
published = "2017-08-07T20:29:01Z"
remediation = "立即应用 SAP Security Note 2486657 对应的补丁包。对于 SAP NetWeaver Application Server Java 7.5，需升级至包含该 Note 的 Support Package 或更高版本。如无法立即打补丁，可在反向代理或 WAF 层面添加规则，拦截包含 `../` 的请求路径，特别是针对 `/scheduler/ui/js/` 路径的目录遍历攻击。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "SAP NetWeaver Application Server Java 目录遍历漏洞"
updated = "2026-06-17T01:03:42Z"

