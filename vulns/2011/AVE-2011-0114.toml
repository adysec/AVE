[basic]
description = "Adobe Flash Player 及 Adobe AIR 存在未指定的内存破坏漏洞（CWE-119）。攻击者可通过诱导用户访问特制的恶意网页或打开恶意文件，触发内存破坏，导致远程代码执行或拒绝服务。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上的 Flash Player 10.3.183.11 之前版本、11.x 系列 11.1.102.55 之前版本以及 AIR 3.1.0.4880 之前版本，CVSS 评分 10.0，危害等级严重。Adobe 已发布安全更新修复此漏洞。"
published = "2011-11-11T16:55:01Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.11 或 11.1.102.55 及以上版本（Windows/Mac/Linux/Solaris），Android 版升级至 11.1.102.59 及以上，Adobe AIR 升级至 3.1.0.4880 及以上。由于 Flash Player 已于 2020 年底停止支持并禁用，建议彻底卸载 Flash Player 组件，避免遗留安全风险。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏漏洞"
updated = "2026-06-16T23:31:22Z"

