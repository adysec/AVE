[basic]
description = "NI LabVIEW 在加载特制的 .lvclass 文件时存在越界写入漏洞，由于对畸形 LVCLASS 文件内容缺乏充分的边界检查，攻击者可构造恶意 .lvclass 文件并诱使用户在 LabVIEW 中打开，触发内存损坏，导致信息泄露或任意代码执行。该漏洞影响 NI LabVIEW 2026 Q1 (26.1.0) 及更早版本，CVSS 评分 8.5，危害等级高。攻击需要用户交互，无法远程直接利用，但结合钓鱼等手段可造成较大危害。NI 官方已发布安全公告，建议用户升级至修复版本。"
published = "2026-04-07T20:16:24Z"
remediation = "建议立即升级 LabVIEW：2026 Q1 用户升级至 Patch 1 或更高版本，2025 Q3 用户升级至 Patch 4 或更高版本，2024 Q3 用户升级至 Patch 6 或更高版本，2023 Q3 用户升级至 Patch 9 或更高版本。可通过 NI Package Manager 或 NI 软件下载页面获取更新。2022 及更早版本已停止主流支持，建议升级到受支持的最新版本。在无法立即升级的情况下，避免打开来源不明的 .lvclass 文件。"
score = 8.5
severity = "HIGH"
sources = ["zdi"]
title = "NI LabVIEW 越界写入漏洞"
updated = "2026-07-24T23:10:00Z"

