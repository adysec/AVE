[basic]
description = 'LocalWEB2000 HTTP 服务器存在目录遍历漏洞，未经身份认证的远程攻击者可通过在 HTTP GET 请求中注入 ".."（点线）路径遍历序列，绕过服务器对 Web 根目录的访问限制，进而读取目标系统上的任意文件。该漏洞影响 LocalWEB2000 1.1 版本，攻击者仅需向服务器发送特制的包含目录跳转序列的 HTTP 请求即可触发，无需任何凭据或特殊配置，可能导致敏感配置文件、密码文件等系统文件泄露。'
published = "2001-03-26T05:00:00.000"
remediation = '鉴于 LocalWEB2000 1.1 已是一款过时且厂商已停止维护的 HTTP 服务器，建议立即升级到受支持的 HTTP 服务器（如 IIS、Apache 或 Nginx）。如短期内无法替换，应在防火墙或反向代理层面配置规则，拦截含有 ".." 或 URL 编码 "%2e%2e" 的 HTTP GET 请求，并严格限制 Web 根目录外的文件访问权限。同时建议在服务器上部署 Web 应用防火墙（WAF），启用目录穿越攻击检测规则，实时监控并阻断异常请求。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "LocalWEB2000 HTTP服务器 目录遍历漏洞"
updated = "2026-06-16T21:53:50.760"

