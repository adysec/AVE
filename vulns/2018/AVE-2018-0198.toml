[basic]
description = "Spring Data Commons 存在属性绑定器远程代码执行漏洞（CVE-2018-1273），漏洞源于对特殊元素的中和不当（CWE-94），影响 1.13 至 1.13.10、2.0 至 2.0.5 及更早不受支持版本。未经身份认证的远程攻击者可向 Spring Data REST 的 HTTP 资源接口或基于投影的请求负载绑定机制发送特制的请求参数，触发属性绑定器中的代码注入，导致远程代码执行。该漏洞 CVSS 评分 9.8，危害等级严重，无需用户交互即可利用，影响大量使用 Spring Data Commons 的 Java Web 应用。"
published = "2018-04-11T13:29:00.290"
remediation = "立即升级 Spring Data Commons 至修复版本：2.x 分支升级至 2.0.6 及以上版本，1.x 分支升级至 1.13.11 及以上版本。如使用 Spring Boot，对应升级 Spring Boot 版本至 2.0.1+ 或 1.5.11+ 即可自动引入修复后的依赖。若暂时无法升级，可通过 Spring Security 为 Spring Data REST 端点启用认证和授权，限制未授权用户访问，作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Spring Data Commons 远程代码执行漏洞"
updated = "2026-06-26T18:44:14.703"

