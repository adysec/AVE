[basic]
description = "BTT Software SNMP Trap Watcher 1.16 存在缓冲区溢出漏洞，远程攻击者可通过向目标系统发送特制的超长字符串 trap 消息触发该漏洞，导致目标程序缓冲区溢出，造成拒绝服务，甚至可能执行任意命令。该漏洞无需身份认证即可远程利用，CVSS 评分 7.5，危害等级高。受影响版本为 SNMP Trap Watcher 1.16，建议用户升级至最新版本或停止使用该软件。"
published = "2001-08-31T04:00:00.000"
remediation = "建议立即升级 SNMP Trap Watcher 至最新版本 1.41（官网下载地址 http://www.bttsoftware.co.uk/snmptrap.html），该版本已修复 1.16 中的缓冲区溢出漏洞。如无法升级，可在防火墙或主机层面限制 UDP 端口 162 的入站流量，仅允许受信任的 SNMP 管理端发送 Trap 数据包，以降低远程攻击面。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "BTT Software SNMP Trap Watcher 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:21.023"

