[basic]
description = "Windows Telephony Service（电话服务）在处理特定远程过程调用（RPC）请求时存在堆缓冲区溢出漏洞（CWE-122）。未经身份认证的远程攻击者可通过向目标系统发送特制的 RPC 消息触发该漏洞，成功利用可在目标系统上以 SYSTEM 权限执行任意代码。攻击需要用户交互（如诱导用户访问恶意服务器），影响 Windows 10/11 及 Windows Server 多个版本。CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:41Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新：Windows Server 2025 安装 KB5050004，Windows Server 2022 安装 KB5049983，Windows Server 23H2 安装 KB5049984，Windows 11 安装 KB5050021，Windows 10 安装 KB5049981。可通过 Windows Update 自动获取更新，或从 Microsoft Update Catalog 手动下载安装。如无法立即打补丁，建议在防火墙层面限制对 TAPI 服务（Svchost.exe 托管的 Telephony 服务）的远程访问，并禁用不必要的 RPC 暴露端口作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:42:52Z"

