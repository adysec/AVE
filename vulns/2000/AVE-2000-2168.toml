[basic]
description = "Microsoft Windows 98/NT 4.0/2000/XP 的域名解析器默认配置将 QueryIpMatching 参数设置为 0，导致系统接受来自未查询主机的 DNS 更新响应，从而允许远程攻击者向目标系统注入伪造的 DNS 记录实施缓存投毒攻击。攻击者无需认证即可通过网络发送恶意 DNS 响应包，将合法域名解析指向恶意 IP 地址，进而实现中间人攻击、钓鱼或流量劫持。该漏洞影响广泛且利用门槛低，CVSS 评分 9.8，危害等级严重。"
published = "2000-04-14T04:00:00Z"
remediation = '将注册表 `HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters` 下的 `QueryIpMatching` DWORD 值修改为 `1`，强制 Windows 仅接受来自其主动查询的 DNS 服务器的响应。对于 Windows 2000 SP4 及之后版本，安装最新累积安全更新。对于已停止支持的 Windows 98/NT 4.0/XP，建议立即升级到受支持的操作系统版本，并在网络边界部署 DNS 过滤和源地址验证规则作为缓解措施。'
score = 9.8
severity = "CRITICAL"
sources = ["cve"]
title = "Microsoft Windows DNS 客户端缓存投毒漏洞"
updated = "2026-06-16T21:53:24Z"

