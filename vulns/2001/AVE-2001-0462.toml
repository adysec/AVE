[basic]
description = "EFTP Server 2.0.7.337 存在目录遍历漏洞，远程认证用户可通过在 LIST、QUOTE SIZE 和 QUOTE MDTM 命令参数中注入 `..`（点点）序列来遍历服务器目录结构，从而泄露服务器上的敏感文件与目录信息。攻击者只需拥有有效认证凭据即可利用该漏洞，无需其他特殊权限。该漏洞影响 EFTP Server 2.0.7.337 版本，CVSS 评分 7.5，危害等级高，可导致敏感信息泄露，为后续攻击提供铺垫。目前官方已发布更新版本修复此问题。"
published = "2001-09-12T04:00:00Z"
remediation = "EFTP 2.0.7.337 已停止维护且厂商官网已失效，建议立即停止使用该软件，迁移至仍受支持的 FTP 服务器（如 vsftpd、ProFTPD 或 FileZilla Server）。如无法立即迁移，可在 FTP 服务端配置中限制 LIST、QUOTE SIZE、QUOTE MDTM 命令的执行权限，同时在防火墙层面将 FTP 端口（默认 21）的访问源 IP 限制为可信白名单，并禁用匿名或弱认证账户。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "EFTP Server 2.0.7.337 目录遍历漏洞"
updated = "2026-06-16T21:55:36Z"

