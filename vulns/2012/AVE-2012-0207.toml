[basic]
description = "Mozilla Firefox 4.x至12.0、Firefox ESR 10.x至10.0.5、Thunderbird 5.0至12.0、Thunderbird ESR 10.x至10.0.5及SeaMonkey 2.10之前版本存在信息泄露漏洞。本地用户可通过构造包含.lnk快捷方式文件的HTML文档并在IFRAME元素中加载，利用Windows或Samba网络共享机制读取目标系统中的敏感信息。该漏洞源于浏览器未正确限制对.lnk文件的跨域访问，CVSS评分2.9，危害等级低。"
published = "2012-06-05T23:55:01Z"
remediation = "升级 Firefox 至 13.0 及以上版本，Firefox ESR 升级至 10.0.5 及以上版本；Thunderbird 升级至 13.0 及以上版本，Thunderbird ESR 升级至 10.0.5 及以上版本；SeaMonkey 升级至 2.10 及以上版本。如无法立即升级，在受影响的浏览器中禁用 IFRAME 加载 .lnk 文件功能，或通过组策略限制网络共享中 .lnk 文件的自动加载。"
score = 2.9
severity = "LOW"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey .lnk 文件信息泄露漏洞"
updated = "2026-06-16T23:40:37Z"

