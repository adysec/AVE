[basic]
description = "SugarCRM 3.5.1 的 phprint.php 文件存在跨站脚本（XSS）漏洞，攻击者可通过在查询字符串中构造恶意参数名（即 $key 变量）注入任意 JavaScript 代码。当管理员或其他用户访问包含恶意参数的 URL 时，脚本将在浏览器中执行，导致敏感信息泄露、会话劫持等危害。攻击无需身份认证，但需要用户交互（点击链接），CVSS 评分 6.1，危害等级中危。"
published = "2018-01-16T20:29:00Z"
remediation = "升级 SugarCRM 至 6.5.26 及以上版本，该漏洞在后续版本中已修复。如无法升级，在 phprint.php 中对 `$_GET` 的 key 参数进行 HTML 实体编码后再拼入 URL，或移除 phprint.php 中对 `$_GET` key 的直接拼接逻辑，改用白名单方式过滤参数名。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "SugarCRM 3.5.1 phprint.php 跨站脚本漏洞"
updated = "2026-06-17T02:00:38Z"

