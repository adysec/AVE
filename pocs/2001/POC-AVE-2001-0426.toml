[info]
author = "ave"
description = "检测 SpeechD /dev/speech 设备文件是否存在，确认本地命令注入攻击面。SpeechD 在处理写入 /dev/speech 的输入时未正确过滤 shell 元字符，导致本地攻击者可执行任意命令。"
id = "POC-AVE-2001-0426"
name = "SpeechD 0.54 任意命令执行漏洞 PoC"
severity = "high"
tags = ["ave-2001-0426"]
vuln_id = [
    "CVE-2001-0956",
    "AVE-2001-0426",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/dev/speech"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [""]
