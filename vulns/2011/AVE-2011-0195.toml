[basic]
description = "Google Chrome 18.0.1025.142 之前版本在处理文本片段（text fragments）时存在越界读漏洞。远程攻击者可通过构造特制的网页内容，利用该漏洞触发越界内存读取，导致浏览器崩溃或拒绝服务。该漏洞影响使用受影响版本Chrome的所有用户，攻击无需身份认证即可触发。CVSS评分为6.8，属于中等危害等级。"
published = "2012-03-30T22:55:01Z"
remediation = '建议立即将 Google Chrome 升级至 18.0.1025.142 或更高版本，该修复已在 2012 年 3 月 28 日 Chrome 稳定版发布公告中提供，通过 Chrome 菜单中的"关于 Google Chrome"自动检查更新即可安装。如无法立即升级，可临时避免点击或访问包含不合法文本片段参数的恶意链接，以降低越界读取导致崩溃或信息泄露的风险。Safari 用户则应升级至 Safari 6.0 或更高版本以修复相关问题。'
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 越界读漏洞"
updated = "2026-06-16T23:32:32Z"

