[basic]
description = "BSD类操作系统（包括FreeBSD 4.5及更早版本、Apple Mac OS X 10.x、OpenBSD 2.x、Solaris 2.5/2.6/7.0/8等）的exec C库函数存在标准I/O文件描述符关闭漏洞。本地未授权用户可先关闭标准输入（fd 0）、标准输出（fd 1）或标准错误（fd 2）的文件描述符，随后当setuid进程执行I/O操作时，系统会复用这些已关闭的描述符号去打开受限文件（如/etc/passwd），导致setuid进程在不知情的情况下对受保护文件进行读写，从而绕过权限限制获取敏感信息或提权。该漏洞仅需本地登录权限即可利用，无需网络访问，影响范围覆盖多个主流BSD类操作系统，CVSS评分为7.2，危害等级为高危。"
published = "2002-07-03T04:00:00Z"
remediation = "升级 FreeBSD 到 4.4-RELEASE-p17 或更高版本、4.5-RELEASE-p10 或更高版本，或应用到 4.6-STABLE，然后重新编译内核以应用安全补丁。具体步骤是：下载对应的 SA-02:23 补丁，从 /usr/src 目录运行 patch 命令，重新配置并编译内核，最后重启系统以激活修复。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "FreeBSD 等BSD系统 标准I/O文件描述符关闭权限提升漏洞"
updated = "2026-06-16T21:57:41Z"

