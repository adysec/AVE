[basic]
description = "Internet Explorer 存在内存对象处理不当的信息泄漏漏洞。攻击者可通过诱导用户访问特制网站触发该漏洞，成功利用后可检测目标系统磁盘上是否存在特定文件，导致敏感信息泄露。该漏洞影响 Windows 系统中的 Internet Explorer 11，攻击需要用户交互（如点击链接），CVSS 评分 6.5，危害等级中危。Microsoft 已在 2019 年 3 月安全更新中修复此漏洞。"
published = "2019-03-05T23:29:02Z"
remediation = "安装 Microsoft 2019 年 3 月安全更新（适用于 Internet Explorer 11 的累积更新 KB4489873），可通过 Windows Update 自动获取。对于 Windows 10 系统，安装累积更新 KB4489886。无法立即打补丁时，可将 Internet Explorer 安全区域设置为「高」并禁用活动脚本，同时限制用户以管理员权限运行 IE 浏览器以降低风险。"
score = 6.5
severity = "MEDIUM"
sources = ["kev"]
title = "Microsoft Internet Explorer 信息泄露漏洞"
updated = "2026-06-17T02:08:40Z"

