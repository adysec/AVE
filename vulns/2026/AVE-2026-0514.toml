[basic]
description = "QVR Pro 存在关键功能身份验证缺失漏洞（CWE-306），未经身份认证的远程攻击者无需任何权限即可利用该漏洞绕过身份验证机制，直接访问系统敏感功能并获取完全控制权限。该漏洞影响 QVR Pro 各版本，CVSS 评分 9.3，危害等级严重。QNAP 已在 QVR Pro 2.7.4.14 及后续版本中修复此漏洞，建议用户立即升级。"
published = "2026-03-20T17:16:44Z"
remediation = "立即将 QVR Pro 升级至 2.7.4.14 或更高版本，可通过 QNAP App Center 或手动下载安装包更新。如无法立即升级，建议在防火墙/反向代理层面限制对 QVR Pro 管理端口的公网访问，仅允许可信 IP 连接，并启用 QNAP 的访问保护功能（如 IP 白名单、双因素认证）作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["zdi"]
title = "QNAP QVR Pro 关键功能身份验证绕过漏洞"
updated = "2026-06-17T10:20:34Z"

