[basic]
description = "Avaya Argent Office 存在拒绝服务漏洞，远程攻击者可通过向目标系统的 DNS 端口（UDP 53）发送无载荷的空数据包，导致服务进程崩溃或停止响应。该漏洞无需身份认证即可远程触发，攻击复杂度低，影响 Avaya Argent Office 通信系统的正常可用性。ExploitDB 上已有公开的利用代码，攻击者可直接使用。"
published = "2001-08-07T04:00:00Z"
remediation = "该产品已于多年前停止支持，Avaya 不再提供安全补丁。建议在网络边界防火墙或 ACL 中阻止向该设备 UDP 53 端口发送非授权 DNS 流量，仅允许受信任的内部 DNS 服务器与其通信。如业务允许，应尽快将 Avaya Argent Office 替换为受支持的现代通信系统，从根本上消除风险。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Avaya Argent Office DNS 数据包拒绝服务漏洞"
updated = "2026-06-16T21:55:54Z"

