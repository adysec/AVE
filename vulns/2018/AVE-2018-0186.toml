[basic]
description = "ZEIT Next.js 4.2.2 及之前版本存在目录遍历漏洞，位于 /_next 请求命名空间下。远程未经身份认证的攻击者可通过向目标服务器发送特制的 HTTP 请求，利用路径遍历技术突破目录限制，读取服务器上任意文件（如配置文件、源代码等），导致敏感信息泄露。该漏洞攻击复杂度低，无需用户交互，CVSS 评分 7.5，危害等级高。官方已在 4.2.3 版本中修复此漏洞。"
published = "2018-01-24T10:29:01Z"
remediation = "立即将 Next.js 升级至 4.2.3 或更高版本，执行 `npm install next@latest --save` 命令更新依赖。该版本完全向后兼容，所有用户均应升级。如使用 canary 通道，执行 `npm install next@canary --save`。若无法立即升级，可在反向代理或 WAF 层面添加规则，拦截包含 `..` 路径遍历特征的 `/_next` 请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "ZEIT Next.js 路径遍历漏洞"
updated = "2026-06-17T02:01:28Z"

