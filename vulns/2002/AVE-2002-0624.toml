[basic]
description = "CVE-2002-1522是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2003-04-02T05:00:00.000"
remediation = "升级到 Cooolsoft PowerFTP Server 最新版本（若厂商仍提供更新），或替换为当前维护的 FTP 服务软件（如 FileZilla Server）。在服务器配置中限制 FTP USER 命令的最大参数长度，截断超长用户名输入。通过主机防火墙仅允许可信 IP 访问 FTP 端口（默认 21），禁用匿名访问以缩小攻击面。将 FTP 服务以低权限账户运行，避免使用 SYSTEM 或 Administrator 权限启动服务。"
