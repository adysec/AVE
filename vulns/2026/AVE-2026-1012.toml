[basic]
description = "tags.<value>GIMP PSP文件解析存在堆溢出漏洞，未经身份认证的远程攻击者可通过发送特制的PSP图像文件诱导目标用户打开，触发内存缓冲区溢出并执行任意代码。该漏洞源于程序在解析PSP文件时未对用户提供的文件数据长度进行充分验证便将其复制到堆缓冲区中，导致缓冲区溢出。攻击者利用此漏洞可在当前进程上下文中执行任意代码，CVSS评分7.8，危害等级高。该漏洞影响GIMP 2.8.22-1之前的版本，用户需主动打开恶意文件才能触发攻击，厂商已在2.8.22-1版本中修复此漏洞。"
published = "2026-04-11T01:16:16Z"
remediation = "立即将 GIMP 升级至包含修复提交 98cb1371fd4e22cca75017ea3252dc32fc218712 的版本（GIMP 3.0.8 之后发布的版本均包含该补丁）。对于 RHEL/CentOS 用户，可通过 `yum update gimp` 安装修复版本 gimp-2.8.22-26.module+el8。如暂无法升级，临时缓解措施为：避免打开来源不明的 PSP 文件，在防火墙或邮件网关中拦截 .psp 文件类型的附件下载，直至完成版本更新。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "GIMP PSP文件解析堆溢出远程代码执行漏洞"
updated = "2026-07-15T02:22:38Z"

