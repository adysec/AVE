[basic]
description = "Kubelet 是 Kubernetes 集群中运行在每个节点上的核心代理组件，负责管理容器生命周期。CVE-2024-9042 是 Kubelet 在 Windows 节点上的命令注入漏洞，由于对用户输入验证不充分（CWE-20），拥有集群管理权限的攻击者可通过特制请求向 Kubelet 注入恶意命令，在 Windows 工作节点上以 Kubelet 进程权限执行任意命令，导致节点被完全控制。该漏洞影响所有运行受影响 Windows 版本的 Kubernetes 工作节点，攻击复杂度较高且需要高权限，但一旦利用成功可导致节点机密性和完整性完全丧失。Microsoft 和 Kubernetes 社区已发布安全更新修复此漏洞。"
published = "2025-03-13T17:15:34Z"
remediation = "升级 Kubelet 到 v1.32.1 或更高版本以获取修复。如果无法立即升级，从防火墙禁用 Windows 节点入站网络流量或隔离受影响的节点作为临时缓解措施。"
score = 5.9
severity = "MEDIUM"
sources = ["msrc"]
title = "Kubernetes Kubelet Windows 命令注入漏洞"
updated = "2026-06-17T08:23:50Z"

