[basic]
description = "Linux 内核 HID 多点触控驱动中的 mt_input_configured 函数在调用 devm_kasprintf() 分配内存时未对返回值进行空指针检查，当内存分配失败时函数返回 NULL，导致内核空指针解引用错误，引发系统崩溃拒绝服务。该漏洞需要本地低权限访问，攻击难度低，影响 Linux 内核多个发行版版本。"
published = "2025-02-27T03:15:12Z"
remediation = "立即更新 Linux 内核至以下已修复版本：5.4.291、5.10.235、5.15.179、6.1.129、6.6.79、6.12.16 或 6.13.4 及以上。各发行版用户请安装对应安全更新：Ubuntu 安装 USN-7510/7511/7540/7640/7703 系列更新，Debian 安装 DLA-4102/4178 更新。Siemens SIMATIC S7-1500 MFP 用户请参考 SSA-019113/SSA-265688 安装补丁。如无法立即更新，可卸载或禁用相关 HID 多点触控驱动模块（hid-multitouch）作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 HID 多点触控驱动空指针解引用漏洞"
updated = "2026-07-14T13:17:15Z"

