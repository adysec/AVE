[basic]
description = "HP-UX 11.0 系统中的 /bin/cu 程序存在缓冲区溢出漏洞。该程序在处理通过 -l 命令行参数指定的设备路径时，未能对输入长度进行有效边界检查，攻击者可传递超长字符串触发栈缓冲区溢出，进而覆盖返回地址并执行任意代码。此漏洞仅影响本地已登录用户，攻击者无需额外身份验证即可在具有普通权限的账户下利用此漏洞获取 root 权限。利用方式为通过构造包含 shellcode 和偏移量的超长字符串作为 -l 参数调用 /bin/cu，覆盖函数返回地址并跳转至嵌入的 shellcode，最终获得系统最高权限。HP-UX 11.00 版本受此漏洞影响，CVSS 评分为 7.2，危害等级为高。"
published = "2000-12-11T05:00:00.000"
remediation = "升级 HP-UX 到 11.11 或更高版本（包含安全补丁），并应用最新的 HP-UX 安全更新。通过 HP-UX software configurator 或 HP-UX Manageability package禁用不必要的cu服务。使用sed脚本限制cu命令行参数长度，最大支持512字符。运行HP-UX Security Vault进行漏洞扫描，如发现权限提升风险则紧急修补。对-legacy应用程序进行程序代码审计，修正缓冲区溢出缺陷。使用execattr.conf配置用户执行权限，限制普通用户对/bin/cu的使用权限。如无法立即升级，可将cu命令从PATH中移除或设为不可执行，并部署HP-UX Intrusion Detection System进行持续监控。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "HP HP-UX 11.0 cu 本地缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:53:00.150"

