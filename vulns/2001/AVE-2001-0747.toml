[basic]
description = "标签之间。<value>Compaq web-enabled management 软件内置的 HTTP 服务器存在安全绕过漏洞，可被滥用为通用代理服务器。未经身份认证的远程攻击者可通过管理端口 2301 利用该漏洞，绕过访问限制并转发请求至受限网络区域。该漏洞影响 Foundation Agents、Survey、Power Manager、Availability Agents、Intelligent Cluster Administrator 及 Insight Manager 等多个管理组件，攻击者可借此探测内网服务、绕过防火墙规则或实施横向移动，CVSS 评分 7.5，危害等级高。"
published = "2001-06-18T04:00:00Z"
remediation = "应用 Compaq 官方发布的安全补丁，修复 Insight Manager、Power Manager、Availability Agents、Intelligent Cluster Administrator、Foundation Agents 及 Survey 等 web-enabled management 软件中 HTTP 服务器在 2301 端口充当通用代理服务器的缺陷。补丁获取地址为 http://www.compaq.com/products/servers/management/mgtsw-advisory.html。如暂时无法安装补丁，应在防火墙或路由器上限制对 TCP 2301 端口的访问，仅允许受信任的管理网段 IP 连接；若业务不需要远程管理功能，可直接禁用 Insight Manager 及相关管理组件的 HTTP 服务作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Compaq Web-Enabled Management 访问控制绕过漏洞"
updated = "2026-06-16T21:54:11Z"

