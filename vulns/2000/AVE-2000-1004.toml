[basic]
description = 'PhotoAlbum 项目的 getalbum.php 存在目录遍历漏洞，未授权远程攻击者可通过在请求中构造 ".."（点号穿透）路径遍历序列，绕过文件访问限制读取服务器上的任意文件。该漏洞影响 PhotoAlbum 0.9.9 之前的所有版本，攻击条件宽松且无需身份验证，利用门槛极低，攻击者可借此获取包含数据库凭证、配置文件等敏感信息，从而进一步危害服务器安全。'
published = "2000-12-19T05:00:00.000"
remediation = "将 PhotoAlbum 升级至 0.9.9 或更高版本，此版本已修复 getalbum.php 中的路径遍历漏洞。升级前请备份相册配置目录与图片数据，升级后确认 getalbum.php 对 album 参数进行了输入过滤，阻止 .. 等路径穿越字符。如无法立即升级，可临时通过 Web 服务器配置（如 Apache 的 RewriteRule 或 Nginx 的 location 限制）禁用对 getalbum.php 的访问权限，仅允许内部网段访问。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "phpphotoalbum PhotoAlbum 任意文件读取漏洞"
updated = "2026-06-16T21:52:43.583"

