[basic]
description = "Netscape Messaging Server 4.15p1 的 POP3 服务器在处理用户认证时存在信息泄露漏洞。当用户输入错误的用户名和错误的密码时，服务器会返回不同的错误提示信息，远程攻击者无需身份认证即可利用该差异枚举系统中的有效用户账户，进而收集有效的电子邮件地址用于垃圾邮件发送。该漏洞利用难度低，攻击者只需通过 POP3 协议发送认证请求即可实施探测，影响运行 Netscape Messaging Server 4.15p1 的系统。"
published = "2000-12-19T05:00:00.000"
remediation = "建议升级到 Netscape Messaging Server 4.15p2 或更高补丁版本，该版本已统一认证失败错误信息，不再区分用户名无效与密码错误。由于该产品已停止维护，长期方案应迁移至受支持的邮件服务器（如 Oracle Communications Messaging Server 或开源方案 Dovecot/Postfix）。如无法立即升级，可在 POP3 端口（110）前部署反向代理，统一返回通用认证失败提示。同时建议在网络层面限制 POP3 服务的访问来源 IP，仅允许可信网段连接。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Netscape Messaging Server POP3 用户信息枚举漏洞"
updated = "2026-06-16T21:52:51.613"

