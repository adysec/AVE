[basic]
description = "iWeb Hyperseek 2000 的 hsx.cgi 程序存在目录遍历漏洞，远程攻击者无需身份认证即可通过向 show 参数注入 ..（点号）序列绕过目录访问限制，从而读取服务器上的任意文件和目录内容。该漏洞影响 iWeb Hyperseek 2000 的所有版本部署，攻击者利用此漏洞可获取敏感配置文件、密码文件等关键信息，进而为后续攻击提供数据支持。CVSS 评分为 5.0，危害等级为中等，建议升级至修复版本或删除受影响 CGI 程序。"
published = "2001-06-02T04:00:00.000"
remediation = '联系 iWeb Systems（邮箱 info@iwebsys.com）获取官方补丁并升级 hsx.cgi 至修复版本，修复程序会对 show 参数中的 ../ 及 %00 等路径遍历字符进行过滤。如无法获取补丁，临时缓解措施：在 Web 服务器层面对 /cgi-bin/suche/hsx.cgi 的 show 参数做输入校验，禁止包含 ../、%00 等特殊字符的请求，或在防火墙/WAF 规则中拦截包含 "hsx.cgi?show=" 且含有多层 ../ 的请求路径。长期建议停用 Hyperseek 2000 并迁移至受支持的搜索产品。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "iWeb Hyperseek 2000 目录遍历漏洞"
