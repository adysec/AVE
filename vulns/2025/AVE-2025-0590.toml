[basic]
description = "这是一个针对 PHP PDO Firebird 驱动的 SQL 注入漏洞，攻击者通过在引用字符串中插入 NUL 字节来绕过输入验证和参数化查询机制。在受影响的 PHP 版本中，当 Firebird 数据库驱动处理包含 NUL 字节的 quoted 字符串时，会导致字符串解析异常，攻击者可以利用这一点将恶意的 SQL 代码注入到查询中。该漏洞影响广泛的 PHP 版本（包括 8.2.x 之前版本、8.3.x 之前版本、8.4.x 之前版本和 8.5.x 之前版本），攻击者无需任何权限即可远程触发漏洞，只需向目标系统发送包含 NUL 字节的有效载荷的数据库查询请求即可利用此漏洞，成功后可以读取、修改或删除数据库中的敏感数据，甚至可能导致远程代码执行，威胁数据库安全和系统完整性。微软及 PHP 安全团队已发布安全补丁修复此漏洞，用户应及时更新到相关安全版本以获取保护。"
published = "2026-05-10T00:00:00Z"
remediation = '建议立即升级 PHP 到以下修复版本：PHP 8.2.x 升级至 8.2.31+，PHP 8.3.x 升级至 8.3.31+，PHP 8.4.x 升级至 8.4.21+，PHP 8.5.x 升级至 8.5.6+。若使用 PHP 8.0/8.1 可应用 centminmod 提供的补丁（php80-cve-2025-14179.patch / php81-cve-2025-14179.patch）。临时缓解：禁用 pdo_firebird 扩展（php.ini 中注释 extension=pdo_firebird），或在应用层过滤输入中的 NUL 字符（\0）。'
score = 5
severity = "MEDIUM"
sources = ["msrc"]
title = "PHP PDO Firebird SQL注入漏洞"
updated = "2026-05-10T00:00:00Z"

