[info]
author = "AVE"
description = "检测目标系统上是否存在易受 CVE-2002-0838 影响的 GV 系列 PDF/PostScript 查看器（gv/ggv），通过检查二进制文件存在性及版本信息判断漏洞是否可能被利用"
id = "POC-AVE-2002-0026"
name = "CVE-2002-0838 PoC"
severity = "medium"
tags = ["ave-2002-0026"]
vuln_id = [
    "CVE-2002-0838",
    "AVE-2002-0026",
]

[poc]
logic = "any"

[[poc.requests]]
path = "/usr/bin/gv"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = ".+"
type = "regex"

[[poc.requests]]
path = "/usr/bin/ggv"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = ".+"
type = "regex"
