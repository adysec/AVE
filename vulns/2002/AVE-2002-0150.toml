[basic]
description = "Squid 代理服务器 2.4 STABLE4 之前版本以及 2.5/2.6 系列至 2002 年 3 月 12 日发布的版本中存在基于堆的缓冲区溢出漏洞。远程攻击者可通过向目标 Squid 服务器发送特制的压缩 DNS 响应数据包触发该漏洞，导致服务拒绝（DoS），在特定条件下可能实现远程代码执行（RCE）。该漏洞影响广泛部署的 Squid 代理服务，CVSS 评分 7.5，危害等级高。建议用户升级至 Squid 2.4 STABLE4 或更高版本以修复此漏洞。"
published = "2002-03-26T05:00:00.000"
remediation = "立即升级 Squid 至 2.4.STABLE6 或更高版本。如无法升级，可下载并应用官方补丁 squid-2.4.STABLE4-rfc1035_compressed_reply.patch（http://www.squid-cache.org/Versions/v2/2.4/bugs/）。临时缓解措施：使用 --disable-internal-dns 重新编译 Squid，切换为外部 DNS 解析，但注意此方式可能影响性能。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Squid 代理服务器压缩 DNS 响应堆缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:56:55.003"

