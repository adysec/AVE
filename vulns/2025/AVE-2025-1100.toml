[basic]
description = "Linux kernel 的 media: streamzap USB 红外接收器驱动中存在竞争条件漏洞。在设备断开连接时，streamzap_disconnect() 函数错误地先调用 rc_unregister_device() 释放 dev->raw 指针并置为 NULL，再调用 usb_kill_urb() 等待进行中的 URB 请求完成。如果 streamzap_callback() 回调处理程序尚未结束，设备断开操作可能导致对已释放内存的空指针解引用访问，触发内核通用保护错误和系统崩溃。该漏洞需要攻击者具有本地低权限访问，且在高复杂度的设备断开条件下才能触发，主要影响系统的可用性。"
published = "2025-04-16T15:15:55Z"
remediation = "升级 Linux 内核至包含修复的稳定版本：上游主线 5.15.181、6.1.134、6.6.87、6.12.23、6.13.11、6.14.2 及更高版本均已包含补丁；主流发行版请安装对应安全更新，如 Debian 11 (bullseye) 升级至 5.10.237-1 或更高，Debian 12 (bookworm) 升级至 6.1.135-1 或更高，Ubuntu 22.04 LTS 升级至 5.15.0-144.157 或更高，Ubuntu 24.04 LTS 升级至 6.8.0-86.87 或更高，Ubuntu 24.10 升级至 6.11.0-28.28 或更高，Ubuntu 25.04 升级至 6.14.0-22.22 或更高。如暂时无法升级内核，可临时卸载或黑名单 streamzap 驱动（执行 rmmod streamzap 或向 /etc/modprobe.d/ 添加 blacklist streamzap），并避免在系统运行期间频繁热插拔 USB StreamZap 红外接收器。"
score = 4.7
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 StreamZap 驱动竞争条件拒绝服务漏洞"
updated = "2026-06-17T08:44:52Z"

