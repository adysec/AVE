[basic]
description = "FreeBSD 4.1.1 及更早版本（以及其他基于 BSD 的操作系统）的 TCP/IP 协议栈在生成初始序列号（ISN）时使用了不充分的随机数生成器，导致 ISN 可被预测。远程攻击者无需身份认证即可通过预测 TCP 连接序列号，伪造 TCP 会话，实施会话劫持或中间人攻击，危害系统通信安全。"
published = "2000-12-19T05:00:00Z"
remediation = "升级 FreeBSD 至 4.1.1-STABLE 或 3.5.1-STABLE 及以上版本；或下载官方补丁替换内核中 tcp_seq.h 和 tcp_subr.c 的 random() 调用为 arc4random() 后重新编译内核并重启。临时缓解措施：禁用基于地址认证的 rlogin/rsh/rexec 服务，在网络边界实施源地址过滤，或启用 IPSEC 对 TCP 连接进行认证。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "FreeBSD TCP初始序列号可预测漏洞"
updated = "2026-06-16T21:52:45Z"

