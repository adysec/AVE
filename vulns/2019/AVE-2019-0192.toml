[basic]
description = "Optergy Proton/Enterprise 设备存在输入验证错误漏洞，由于未对用户提供的重定向 URL 进行充分校验，远程攻击者可构造包含恶意站点的特制链接，诱导已登录用户点击后将其重定向至攻击者控制的外部网站。该漏洞影响 Optergy Proton 和 Enterprise 等版本的建筑自动化与门禁控制系统，攻击者利用此低复杂度漏洞可发起钓鱼攻击、窃取用户凭据或配合其他社会工程学手段进行进一步渗透。成功利用需要用户主动点击攻击者提供的链接，无需身份认证。"
published = "2019-07-01T20:15:11Z"
remediation = "联系 Optergy 技术支持获取修复此漏洞的安全补丁并升级到最新固件版本，确保 Proton/Enterprise BMS 固件版本高于 2.3.0a。同时修改 updating.jsp 中对 url 参数的实现，对用户提供的重定向目标进行输入验证，仅允许跳转到预定义的白名单域名，拒绝所有外部不可信 URL 的重定向请求。如无法立即升级，请在防火墙或反向代理层面阻止对 updating.jsp 的未授权访问，并将 BMS 系统与互联网隔离，仅允许可信内网段访问管理界面，同时启用 WAF 规则拦截包含外部域名参数的重定向请求作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Optergy Proton/Enterprise 开放重定向漏洞"
updated = "2026-06-17T02:40:22Z"

