[basic]
description = "NVIDIA NVTabular 存在不安全的反序列化漏洞（CWE-502），攻击者可通过向受影响系统提交特制的序列化数据触发该漏洞，导致远程代码执行、数据篡改及信息泄露。该漏洞影响 NVIDIA NVTabular 产品，攻击者需具备本地访问权限及低权限条件方可利用，无需用户交互。CVSS 评分 7.8，危害等级高。建议用户及时关注 NVIDIA 官方安全公告并升级至修复版本。"
published = "2026-06-02T17:16:27Z"
remediation = "立即将 NVIDIA NVTabular 更新至 GitHub 仓库 NVIDIA-Merlin/NVTabular 的 commit 08e0633（对应 2026-03-12 之后版本），可通过 `git pull && git checkout 08e0633` 升级。由于该漏洞源于不安全反序列化（CWE-502），如无法立即更新，应限制本地用户对 NVTabular 数据加载接口的访问权限，并避免加载不可信的序列化数据文件。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "NVIDIA NVTabular 不安全反序列化漏洞"
updated = "2026-07-22T19:10:00Z"

