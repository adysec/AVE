[basic]
description = "Debian Internet Message（IM）141-18及更早版本存在以不安全方式创建临时文件的漏洞。该软件使用可预测的文件和目录名称，本地攻击者可利用 impwagent 组件创建的临时目录获取未授权的目录权限，或通过 immknmz 组件覆盖和创建任意文件，导致权限提升或系统文件被篡改。攻击者需拥有本地系统访问权限，无需认证即可利用，CVSS 评分 2.1，危害等级低。"
published = "2003-01-17T05:00:00Z"
remediation = "升级 im 软件包至修复版本：Debian Woody 升级到 141-18.1，Debian Sid 升级到 1:141-20。该漏洞源于 impwagent 和 immknmz 使用可预测的临时文件名，本地用户可利用此漏洞越权访问目录或覆盖任意文件。如无法立即升级，可通过设置严格的临时目录权限（如 chmod 0700 /tmp）并限制本地非授权用户登录作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Debian Internet Message 不安全临时文件创建漏洞"
updated = "2026-06-16T21:59:14Z"

