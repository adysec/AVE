[basic]
description = "Oracle WebCenter Sites 是 Oracle Fusion Middleware 的组件，其 Advanced UI 子组件存在认证绕过漏洞。未经身份验证的远程攻击者若具备网络访问权限，可通过 HTTP 协议向目标发送特制请求绕过身份验证机制，从而获取对 Oracle WebCenter Sites 的未授权访问。成功利用该漏洞可导致攻击者访问敏感数据或完全控制目标站点上的所有可访问内容。该漏洞影响 Oracle WebCenter Sites 12.2.1.3.0 版本，攻击复杂度低，无需交互，网络可达即可利用，CVSS v3 基础评分 8.6，危害等级高。"
published = "2019-04-23T19:32:49.257"
remediation = "立即安装 Oracle 2019 年 4 月 Critical Patch Update 补丁，升级 Oracle WebCenter Sites 12.2.1.3.0 Advanced UI 组件至该 CPU 包含的安全修复版本。访问 My Oracle Support 搜索补丁号 28909398（针对 WebCenter Sites 12.2.1.3.0 的 2019 年 4 月 CPU 补丁包），下载并按照 Oracle 官方文档应用补丁。如无法立即打补丁，可在防火墙或反向代理层限制对 WebCenter Sites Advanced UI 的 HTTP 访问，仅允许可信 IP 段访问，并在完成补丁后立即恢复访问策略。"
score = 8.6
severity = "HIGH"
sources = ["nuclei"]
title = "Oracle WebCenter Sites 认证绕过漏洞"
updated = "2026-06-17T02:34:08.557"

