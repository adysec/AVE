[basic]
description = 'UoW Pine 4.21 及更早版本的自动邮件检查组件在处理邮件头部信息时存在缓冲区溢出漏洞。远程攻击者可以通过发送一封包含超长 "From:" 头部字段的特制邮件，触发该组件在解析时发生内存溢出，从而在目标系统上执行任意命令。该漏洞影响所有运行受影响版本且开启自动检查功能的 Pine 客户端，具有较高的远程利用风险。'
published = "2000-12-19T05:00:00.000"
remediation = '建议立即停止使用陈旧的 Pine 4.21 及更早版本，迁移至安全性更高的现代邮件客户端（如 Thunderbird）。若无法迁移，可通过邮件网关或防火墙过滤并拦截包含超长 "From:" 头部字段的异常邮件，以缓解远程缓冲区溢出攻击风险。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "University of Washington Pine 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:52:44.540"

