[basic]
description = "Luracast Restler 3.0.0 及之前版本中 public/examples/resources/getsource.php 存在目录遍历漏洞。远程攻击者无需认证即可通过 file 参数传入包含路径遍历序列（如 ../）的恶意请求，读取服务器上任意文件，导致敏感信息泄露。该漏洞影响 TYPO3 的 restler 扩展 1.7.1 之前版本，CVSS 评分 7.5，危害等级高。"
published = "2017-10-15T19:29:00Z"
remediation = "将 TYPO3 的 restler 扩展升级到 1.7.1 或更高版本（从 https://extensions.typo3.org/extension/download/restler/1.7.1/zip/ 下载）。如使用独立版 Luracast Restler，升级到 3.0.0 以上版本。若无法立即升级，删除或限制对 public/examples/resources/getsource.php 的访问权限，在 Web 服务器（如 Apache/Nginx）中添加规则阻止对该路径的请求。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Luracast Restler 目录遍历漏洞"
updated = "2026-06-17T01:07:41Z"

