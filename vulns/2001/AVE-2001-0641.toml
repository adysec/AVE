[basic]
description = "VShell SSH gateway 1.0.1及更早版本存在格式化字符串漏洞，未经身份认证的远程攻击者可通过在登录时提交包含格式化字符串说明符的特制用户名触发该漏洞，从而在目标系统上执行任意命令。该漏洞影响使用受影响版本SSH网关的所有系统，攻击者无需事先获取账户凭据，只需通过网络连接到SSH服务即可发起攻击并实现远程代码执行。"
published = "2001-06-02T04:00:00Z"
remediation = "立即停止使用 VShell SSH gateway 1.0.1 及更早版本，由于该软件已停止维护且存在严重的远程代码执行漏洞，建议将其替换为 OpenSSH 或其他现代安全加密传输协议软件。若必须短期维持运行，请通过防火墙严格限制 SSH 端口的访问源 IP。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "VShell SSH网关 格式字符串远程代码执行漏洞"
updated = "2026-06-16T21:53:46Z"

