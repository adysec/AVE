[info]
author = "ave"
description = "通过在 HTTP 响应头中设置 Content-Length 为 0，验证 VirusWall 是否会跳过内容扫描从而允许潜在恶意负载通过。"
id = "POC-AVE-2002-0301"
name = "Trend Micro InterScan VirusWall Content-Length Scan Bypass PoC"
severity = "high"
tags = ["ave-2002-0301"]
vuln_id = [
    "CVE-2002-0440",
    "AVE-2002-0301",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = ["Content-Length: 0"]
