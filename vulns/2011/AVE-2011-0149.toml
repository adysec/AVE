[basic]
description = "Google Chrome 14.0.835.163 之前版本在处理层叠样式表（CSS）令牌序列时存在缺陷，未能正确处理“陈旧节点”，导致远程攻击者可通过构造恶意 CSS 内容触发内存损坏，造成拒绝服务或可能执行任意代码。该漏洞影响 Chrome 14.0.835.163 之前所有版本，CVSS 6.8 分（中高危），攻击向量为网络、攻击复杂度中等、无需认证，可导致机密性、完整性、可用性部分受损。攻击者需诱导受害者访问包含恶意 CSS 的网页，通过浏览器渲染引擎解析特制 CSS 令牌序列触发漏洞。Google 已在 Chrome 14.0.835.163 版本中修复该漏洞。"
published = "2011-09-19T12:02:56Z"
remediation = "建议立即将 Google Chrome 升级至 14.0.835.163 或更高版本。可通过 Chrome 菜单 → 帮助 → 关于 Google Chrome 自动检查更新并重启浏览器完成升级。若无法立即更新，可暂时禁用浏览器的 CSS 解析相关实验性功能（chrome://flags 中禁用实验性 CSS 特性），或使用浏览器扩展阻止加载不可信站点的 CSS 文件作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "谷歌 Chrome 浏览器 样式表处理漏洞"
updated = "2026-06-16T23:32:07Z"

