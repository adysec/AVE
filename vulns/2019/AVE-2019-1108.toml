[basic]
description = "D-Link DWL-2600AP 无线接入点固件版本 4.2.0.15 Rev A 的 Web 管理界面中存在 OS 命令注入漏洞。已通过身份验证的攻击者可利用 Save Configuration 功能，在 admin.cgi?action=config_save 请求的 configBackup 或 downloadServerip 参数中注入 shell 元字符，从而在设备上以 root 权限执行任意系统命令。该漏洞影响 DWL-2600AP 系列设备，CVSS 评分 7.8，危害等级高。厂商尚未发布官方修复补丁，建议限制管理界面的网络访问范围以降低风险。"
published = "2020-03-05T15:15:11Z"
remediation = "立即将 DWL-2600AP Rev A 固件升级至 v4.2.0.17（下载地址：ftp://ftp2.dlink.com/PRODUCTS/DWL-2600AP/REVA/DWL-2600AP_REVA_FIRMWARE_v4.2.0.17.zip）。如无法升级，可在 Web 管理界面中限制可访问 admin.cgi 的管理员 IP 来源，并禁用不必要的配置备份/恢复功能作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "D-Link DWL-2600AP OS命令注入漏洞"
updated = "2026-06-17T02:30:35Z"

