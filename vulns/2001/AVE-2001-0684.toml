[basic]
description = "Easycom/Safecom Print Server Web 服务 404.590 及更早版本存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过向目标设备发送特制的超长 URL 或超长 HTTP 请求头（如 Host: 字段）触发缓冲区溢出，进而执行任意系统命令。该漏洞影响运行受影响版本打印服务器软件的设备，攻击者无需任何凭据即可在远程利用此漏洞，CVSS 评分 7.5，危害等级为高危。"
published = "2001-06-02T04:00:00Z"
remediation = "建议将 Easycom/Safecom Print Server 固件升级至厂商发布的修复版本（高于 404.590），以消除 Web 服务中的缓冲区溢出漏洞。如厂商已停止支持该产品，建议在网络边界通过防火墙或访问控制列表（ACL）限制对打印服务器 Web 管理界面的访问，仅允许可信管理 IP 访问 HTTP 端口，或禁用该 Web 服务作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Easycom Safecom Print Server Web 服务缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:58Z"

