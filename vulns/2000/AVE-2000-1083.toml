[basic]
description = "SonicWALL SOHO Firewall 4.0 及 5.0 版本的 Web 管理服务器存在拒绝服务漏洞。远程攻击者无需认证即可通过向目标设备的 HTTP 服务发送空 GET 或 POST 请求，触发服务处理异常，导致 Web 管理界面崩溃或无法响应合法请求。该漏洞影响 SonicWALL SOHO 系列防火墙设备，攻击条件简单，仅需网络可达即可实施，CVSS 评分 5.0，危害等级中等。"
published = "2001-01-09T05:00:00.000"
remediation = "升级到SonicWALL官方发布的安全固件版本。由于SonicWALL SOHO 4.0/5.0已停止支持，建议升级到受支持的SonicWALL防火墙型号并安装最新固件，同时限制对防火墙管理界面的网络访问。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "SonicWALL SOHO Firewall 4.0/5.0 Web Access HTTP 请求拒绝服务漏洞"
updated = "2026-06-16T21:53:08.543"

