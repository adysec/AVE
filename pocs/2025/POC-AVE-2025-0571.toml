[info]
author = "ave"
description = "验证Google Chrome密码模块不当实现导致的认证绕过漏洞：攻击者通过物理接触设备，利用密码模块实现缺陷绕过身份验证，获取未经授权的访问权限。验证方式检查受影响版本Chrome的密码存储是否存在可被物理访问绕过的认证缺陷。"
id = "POC-AVE-2025-0571"
name = "CVE-2025-13640 PoC"
severity = "low"
tags = ["ave-2025-0571"]
vuln_id = [
    "CVE-2025-13640",
    "AVE-2025-0571",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
