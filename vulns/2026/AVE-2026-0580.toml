[basic]
description = "Anyquery 的 Server 模式存在本地文件读取漏洞，由于未对 SQLite 虚拟表模块（如 csv_reader、log_reader）进行输入验证和访问控制，未经身份认证的远程攻击者可通过 MySQL 协议连接到服务器端口，执行 CREATE VIRTUAL TABLE 语句创建指向系统敏感文件（如 /etc/passwd、~/.ssh/id_rsa）的虚拟表，从而读取任意本地文件，导致系统配置和凭据等敏感信息泄露。该漏洞影响 Anyquery 的 Server 模式，CVSS 评分 7.5，危害等级高。官方建议通过实现沙箱机制（如 --restrict-paths 参数）限制文件读取操作到指定目录以修复此漏洞。"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 Anyquery 升级到 v0.4.5 或更高版本，该版本引入了服务端沙箱机制，限制虚拟表模块仅能访问指定安全目录。如无法立即升级，可在启动服务时使用 `--host 127.0.0.1` 仅绑定本地回环地址，并通过防火墙限制 8070 端口的入站访问，防止未授权远程连接。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Julien040 Anyquery 服务模式 SQLite 虚拟表模块本地文件读取漏洞"
updated = "2026-01-01T00:00:00Z"

