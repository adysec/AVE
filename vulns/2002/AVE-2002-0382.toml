[basic]
description = "PostgreSQL 7.2.3 及之前版本中存在多处缓冲区溢出漏洞，具体位于 circle_poly、path_encode 和 path_add 函数中，可能由整数溢出引发。攻击者可通过向受影响系统发送特制请求触发缓冲区溢出，导致拒绝服务，甚至可能执行任意代码。该漏洞需拥有有效数据库登录权限方可利用，攻击复杂度低，CVSS 评分 6.5，危害等级中等。"
published = "2003-01-17T05:00:00Z"
remediation = "升级 PostgreSQL 至 7.2.4 或更高版本，该版本修复了 circle_poly、path_encode 和 path_add 函数中的缓冲区溢出漏洞。Debian 用户可参考 DSA-165 安装安全更新，Red Hat 用户可应用 RHSA-2003-001 提供的补丁包。由于 7.2 系列已停止维护，建议迁移至仍在安全支持期内的 PostgreSQL 最新稳定版。"
score = 6.5
severity = "MEDIUM"
sources = ["redhat"]
title = "PostgreSQL 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:59:15Z"

