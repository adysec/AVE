[basic]
description = "Microsoft Excel 存在安全功能绕过漏洞，该漏洞源于对不可信数据的反序列化处理不当（CWE-502）。攻击者可通过社会工程手段诱导用户打开特制的 Excel 文件，绕过 Excel 的安全保护机制（如受保护视图和宏安全警告），在用户系统上执行任意代码。该漏洞影响多个 Microsoft Office 版本，CVSS 评分 7.8，危害等级高。成功利用该漏洞需要用户交互，但无需任何特权，可导致机密性、完整性和可用性全面受损。Microsoft 已在 2025 年 1 月安全更新中发布补丁修复此漏洞。"
published = "2025-01-14T18:16:02.150"
remediation = "建议立即通过 Windows Update 或 Microsoft Update 安装 2025 年 1 月安全更新，或访问 https://aka.ms/OfficeSecurityReleases 手动下载并安装适用于 Microsoft 365 Apps for Enterprise 和 Office LTSC 2024 的最新补丁。该漏洞涉及反序列化不可信数据，建议同时启用 Office 受保护视图和文件验证功能作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Excel 安全功能绕过漏洞"
updated = "2026-06-17T08:43:12.020"

