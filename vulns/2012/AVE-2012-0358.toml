[basic]
description = "WebKit 是 Apple Safari 浏览器所使用的网页渲染引擎，该漏洞存在于 Safari 6.0 版本之前的所有发行版中。由于 WebKit 在处理网页内容时存在内存破坏问题，远程攻击者可构造一个恶意的网页，当用户使用受影响的 Safari 浏览器访问该网页时，会触发内存损坏，进而导致远程代码执行或应用程序崩溃（拒绝服务）。该漏洞无需任何身份认证，攻击者只需将恶意网页链接发送给目标用户并诱使其点击访问即可完成攻击，攻击复杂度为中等。成功利用后，攻击者可在用户系统上执行任意代码，完全窃取数据、篡改文件或进一步控制整个系统，对用户隐私和数据安全造成严重威胁。Apple 已在 Safari 6.0 版本中修复了此漏洞，建议用户升级至最新版本以消除安全风险。"
published = "2012-07-25T20:55:04.773"
remediation = "将 Apple Safari 升级至 6.0 或更高版本，或将 iOS 设备升级至 6.0 或更高版本。Apple 已通过改进 WebKit 内存处理机制修复了此漏洞。如无法立即升级，请避免访问不可信网站，并禁用浏览器 JavaScript 执行作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:43.550"

