[basic]
description = "Pterodactyl Wings 游戏服务器管理面板的配置文件解析器存在不受控制的资源消耗漏洞（CWE-400）。parser.go 中的 JSON、YAML、XML 等配置文件解析器未对文件大小进行限制或校验，拥有本地低权限的攻击者或运维人员可通过创建或上传一个超大的非 file 类型解析配置文件，导致 Wings 进程在解析该文件时耗尽内存（OOM），造成服务拒绝。该漏洞影响所有使用非 file 解析器配置的 egg 用户，CVSS 评分 5.5，危害等级中危。官方已在 1.13.0 版本中修复此问题。"
published = "2026-07-31T16:17:06Z"
remediation = "立即升级 Wings 至 v1.13.0 或更高版本，该版本已对配置文件解析器添加文件大小限制。如无法立即升级，可在所有 egg 配置中将非 `file` 类型的解析器（json/yaml/xml）改为 `file` 类型，避免直接解析用户上传的配置文件内容；同时在系统层面通过 cgroups 或 systemd 的 `MemoryMax` 限制 wings 进程的最大内存使用量，防止 OOM 导致服务中断。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Pterodactyl Wings 配置文件解析资源耗尽漏洞"
updated = "2026-07-31T17:16:33Z"

