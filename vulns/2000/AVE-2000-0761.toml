[basic]
description = 'Lotus Domino 5.0.2c及更早版本的ESMTP服务存在多处缓冲区溢出漏洞。远程攻击者无需身份认证，通过向目标服务器的ESMTP服务发送特制的超长"RCPT TO"、"SAML FROM"或"SOML FROM"命令，即可触发缓冲区溢出，导致服务拒绝响应，甚至执行任意代码。该漏洞CVSS评分10.0，危害等级严重，影响Lotus Domino Enterprise Server 5.0.1/5.0.2/5.0.3及Mail Server系列版本。目前已存在公开的远程缓冲区溢出利用代码。'
published = "2000-12-11T05:00:00Z"
remediation = "立即升级 Lotus Domino 至 5.0.3 或更高版本，该版本已修复 ESMTP 服务中 RCPT TO、SAML FROM、SOML FROM 命令的缓冲区溢出问题。如无法升级，可在 SMTP 网关或防火墙上限制对 Domino 服务器 25/TCP 端口的访问，仅允许可信邮件服务器连接，并禁用不必要的 ESMTP 扩展命令以降低攻击面。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Lotus Domino ESMTP 服务远程缓冲区溢出漏洞"
updated = "2026-06-16T21:53:02Z"

