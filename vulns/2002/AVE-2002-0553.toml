[basic]
description = 'Microsoft Internet Explorer 5.01 至 6.0 存在跨域帧脚本执行漏洞。当 IE 窗口打开属于不同域或安全区域的子窗口时，浏览器安全机制未能有效阻止父窗口访问子窗口内的 frame 或 iframe 元素。未经身份认证的远程攻击者可构造恶意网页，通过将子窗口中 frame 或 iframe 的 URL 设置为 javascript: 协议并附带任意脚本代码的方式，在受限的安全区域或域上下文中执行任意 JavaScript 代码，从而读取和执行本地系统文件，甚至可在 "My Computer" 安全区域内执行脚本。攻击者只需诱导用户访问包含恶意代码的网页即可触发该漏洞，可导致敏感信息泄露及本地代码执行。'
published = "2002-12-11T05:00:00Z"
remediation = '安装 Microsoft 安全公告 MS02-047 累积安全补丁（知识库文章 Q323759），该补丁修复了 Internet Explorer 5.01、5.5 及 6.0 中通过 frame/iframe 元素及 JavaScript 跨域执行本地脚本的漏洞。对于 Windows 2000 系统，确保 IE 5.01 已安装 Service Pack 2 或更高版本；对于 IE 5.5，需安装 Service Pack 1 或 Service Pack 2；IE 6.0 则需安装 Gold 版本补丁。补丁安装后需重启系统，验证方式为在 IE 中打开"帮助"→"关于 Internet Explorer"，确认 Q323759 已出现在更新版本列表中。若无法立即安装补丁，建议将已知不可信网站添加到"受限站点区域"，并在该区域禁用 ActiveX 脚本和 Java 小程序作为临时缓解措施；同时升级到 Internet Explorer 6.0 Service Pack 1 或更新版本的浏览器，以获得包含此修复的完整累积更新。由于该浏览器版本已停止支持，最彻底的解决方案是迁移至 Microsoft Edge 或其他受支持的现代浏览器。'
score = 6.8
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer IFrame/Frame 跨站脚本执行漏洞"
updated = "2026-06-16T21:58:54Z"

