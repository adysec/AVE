[basic]
description = "Oracle WebLogic Server 的 WLS 核心组件存在反序列化漏洞，攻击者可通过网络向目标服务器发送特制的 T3 协议请求，触发 Java 对象的反序列化过程，从而在服务器上执行任意命令。该漏洞影响 Oracle Fusion Middleware 的 WebLogic Server 10.3.6.0、12.1.3.0、12.2.1.2 和 12.2.1.3 版本。攻击者无需身份认证即可利用此漏洞，成功后可获取服务器的完全控制权，导致机密性、完整性和可用性全部受损。CVSS 3.1 评分为 9.8（严重等级），攻击复杂度低、无需用户交互。已知有多个公开 PoC 和 EXP 可供利用，包括 Metasploit 模块和多个 GitHub 上的复现脚本。"
published = "2018-04-19T02:29:00.457"
remediation = "建议安装 Oracle 2018 年 4 月关键补丁更新（CPU）中针对 CVE-2018-2628 的安全补丁：10.3.6.0 升级至 10.3.6.0.181104 或更高版本，12.1.3.0 升级至 12.1.3.0.181104 或更高版本，12.2.1.2 升级至 12.2.1.2.181104 或更高版本，12.2.1.3 升级至 12.2.1.3.181104 或更高版本。如无法立即打补丁，可在防火墙层面仅允许可信来源访问 WebLogic T3 协议端口（默认 7001），阻断外部 T3 流量作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Oracle WebLogic Server WLS核心组件反序列化漏洞"
updated = "2026-06-17T01:55:57.647"

