[basic]
description = "Linux 内核 SCSI storvsc 驱动在 Hyper-V 虚拟化环境中存在资源限速缺失漏洞。当 hypervisor 出现持续性错误时，该驱动会针对失败的 I/O 操作大量输出警告日志，导致内核日志缓冲区被淹没且 CPU 利用率被耗尽，进而使虚拟机无法正常进行故障排查和运行，造成拒绝服务。影响范围包括运行在 Hyper-V 上的 Linux 虚拟机及使用 storvsc 半虚拟化 SCSI 驱动的内核版本。攻击条件为攻击者需具备本地访问权限，并能在 hypervisor 侧制造或利用持续性错误来触发日志洪泛。攻击者可借此对目标 VM 发起拒绝服务攻击，阻塞系统管理员的排查工作，严重时可导致虚拟化业务中断。"
published = "2025-02-10T16:15:38Z"
remediation = "将 Linux 内核升级至已修复版本：5.15.178、6.1.128、6.6.75、6.12.12、6.13.1 或 6.14 及以上版本。对于主流发行版，Debian bookworm 请升级至内核 6.1.128-1 或更高，Ubuntu 22.04 LTS 请升级至 5.15.0-135.146 或更高，Ubuntu 24.04 LTS 请升级至 6.8.0-62.65 或更高，CentOS/RHEL 9 请升级至 kernel-6.6.75 或更高。使用 `uname -r` 确认当前内核版本，受影响范围为 4.5 至上述修复版本之间的所有内核。如无法立即升级内核，可在 Hyper-V 宿主机端排查并修复 storvsc 后端存储的持续性错误，从根源上消除触发条件，作为临时缓解措施。该漏洞存在于 drivers/scsi/storvsc_drv.c 中，仅影响通过 Hyper-V 虚拟化运行的 Linux 虚拟机，补丁通过 rate limit 机制限制了 storvsc 驱动在 I/O 失败时的内核日志输出频率。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 SCSI storvsc 拒绝服务漏洞"
updated = "2026-06-17T08:44:01Z"

