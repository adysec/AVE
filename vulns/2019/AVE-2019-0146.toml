[basic]
description = "TOTOLINK 及多家厂商路由器管理界面（基于 Realtek APMIB 0.11f 与 Boa 0.94.14rc21）存在关键功能认证机制缺失漏洞（CWE-306）。远程攻击者无需任何身份认证即可直接访问路由器管理接口，获取包含管理员用户名和密码在内的敏感配置信息。该漏洞影响 TOTOLINK A3002RU、A702R、N301RT、N302R、N300RT、N200RE、N150RT、N100RE 等多个型号，以及 Rutek、Sapido、CIK、KCTVJEJU、Fibergate、Hi-Wifi、HCN、T-broad、Coship、IO-Data 等品牌的路由器固件版本。攻击者利用此漏洞可窃取管理员凭据，进而完全控制路由器设备，篡改网络配置或监听内网流量。修复建议：升级至厂商发布的最新固件版本，并修改默认管理员密码。"
published = "2020-01-27T18:15:12.790"
remediation = "立即访问 TOTOLINK 官方网站 totolink.net/support 下载并升级路由器固件至最新版本，A3002RU 升级至 2.0.0 以上版本，A702R 升级至 2.1.3 以上版本，N301RT 升级至 2.1.6 以上版本，N302R/N300RT/N150RT/N100RE 升级至 3.4.0 以上版本，N200RE 升级至 4.0.0 以上版本。升级前建议通过路由器管理界面禁用远程管理功能，仅允许内网访问管理端口（如 80/443），并在防火墙层面限制对路由器管理接口的访问。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "TOTOLINK 路由器 关键功能认证机制缺失漏洞"
updated = "2026-06-17T02:27:17.987"

