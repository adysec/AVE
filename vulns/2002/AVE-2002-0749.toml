[basic]
description = "WoltLab Burning Board 1.1.1 存在跨站脚本攻击（XSS）漏洞，其原理是论坛软件对 message 参数未进行充分的输入过滤与输出编码。远程攻击者可利用此漏洞在帖子中注入任意 Web 脚本或 HTML 代码，并通过构造包含恶意 BBCode [URL] 标签的链接实施攻击。该漏洞影响使用该版本搭建的所有在线论坛站点。攻击条件要求：攻击者需先诱骗已通过 Cookie 方式认证的合法用户点击特制链接，用户浏览器将在其会话上下文中执行注入的恶意脚本，导致攻击者得以代表用户执行发帖、修改签名等非预期操作。利用方式为构造 exploit.php 重定向脚本，在 message 参数中嵌入 IMG 等 BBCode 标签指向恶意资源，诱导用户触发。"
published = "2002-12-31T05:00:00Z"
remediation = "建议升级至 WoltLab Burning Board 2.0 或更高版本（现更名为 WoltLab Suite），该版本已修复此 XSS 漏洞。若无法立即升级，需在 Web 应用防火墙（WAF）配置针对 message 参数的 XSS 过滤规则，拦截包含 <script>、onerror、javascript: 等特征的恶意载荷；同时在应用层对所有用户输入实施 HTML 实体编码输出，禁用危险的 HTML 标签与事件处理器。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "WoltLab Burning Board 跨站脚本攻击漏洞"
updated = "2026-06-16T22:00:30Z"

