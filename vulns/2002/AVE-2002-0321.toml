[basic]
description = "Citrix NFuse 1.6 及更早版本（含 1.51）的 launch.jsp 和 launch.asp 页面存在跨站脚本漏洞，根因是 getLastError 方法返回结果未进行转义引用，导致攻击者可通过 NFuse_Application 参数注入恶意脚本。远程未认证攻击者可诱导受害者访问构造的恶意链接，在受害者浏览器上下文中执行任意脚本，窃取会话凭证、劫持会话或执行敏感操作。该漏洞影响 Citrix NFuse 1.6 及更早版本，CVSS 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），攻击复杂度低、无需认证、网络远程可利用，影响机密性、完整性和可用性。Citrix 已发布补丁修复该漏洞，建议升级至修复版本并启用输出编码防护。"
published = "2002-08-12T04:00:00Z"
remediation = "立即升级 Citrix NFuse 至 1.6 之后的最新稳定版本（建议升级至 Citrix NFuse 1.7 或更高版本，从 Citrix 官方下载安全补丁补丁包），在升级前暂时通过 Web 应用防火墙 (WAF) 拦截包含 NFuse_Application 参数的恶意脚本载荷，并在 launch.jsp/launch.asp 中对 getLastError 返回值进行 HTML 实体编码输出以防止 XSS 注入，同时配置 Web 服务器拦截包含 script 标签和事件处理器的请求参数，禁用不必要的 NFuse 功能模块以缩小攻击面。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Citrix NFuse 跨站脚本攻击漏洞"
updated = "2026-06-16T21:57:34Z"

