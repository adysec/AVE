[basic]
description = "GNU Binutils 的 ld 组件中 libbfd.c 文件的 bfd_putl64 函数存在内存损坏漏洞。攻击复杂度较高，利用难度较大，但已有公开的 PoC 利用代码。远程攻击者可利用特制的二进制文件触发该漏洞，导致目标系统上的应用程序崩溃或潜在的内存数据破坏。该漏洞影响 GNU Binutils 2.43 版本，CVSS 评分 6.3，危害等级中危。补丁提交为 75086e9de1707281172cc77f178e7949a4414ed0，建议用户及时更新至修复版本。"
published = "2025-02-11T07:15:29Z"
remediation = "立即应用补丁提交 75086e9de1707281172cc77f178e7949a4414ed0，将 GNU Binutils 升级至 2.45 或更高版本。SUSE 用户可参考 SUSE-SU-2025:4096-1 安全公告执行系统更新，NetApp 用户参考 ntap-20250411-0008 公告进行修复。如无法立即更新，建议限制对 ld 组件的远程访问作为临时缓解措施。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "GNU Binutils ld 组件内存损坏漏洞"
updated = "2026-06-17T08:38:32Z"

