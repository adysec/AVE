[basic]
description = "DriveLock Web 服务（默认监听 TCP 6067 端口）存在路径遍历漏洞，攻击者无需身份认证即可通过构造恶意路径参数触发文件操作，利用 CWE-22 路径遍历缺陷读取服务器上的敏感信息。该漏洞影响 DriveLock 所有受影响版本，攻击者可通过发送特制的 HTTP 请求携带恶意 path 参数实现远程信息泄露。"
published = "2026-07-29T20:17:06.020"
remediation = "tags.<value>立即将 DriveLock 升级至 25.2.4 或更高版本，该版本已修复路径遍历漏洞。若无法立即升级，可在防火墙层面禁止外部网络访问 TCP 6067 端口作为临时缓解措施，并启用网络访问控制列表（ACL）限制仅允许可信 IP 访问该服务。"
score = 7.5
severity = "HIGH"
sources = ["zdi"]
title = "DriveLock 路径遍历信息泄露漏洞"
updated = "2026-07-30T14:18:46.477"

