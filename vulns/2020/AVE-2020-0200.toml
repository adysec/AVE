[basic]
description = "Tenda AC15 AC1900 路由器固件 15.03.05.19 版本的 goform/setUsbUnload 接口存在操作系统命令注入漏洞。未经身份认证的远程攻击者可通过向该接口发送包含恶意构造 deviceName 参数的 POST 请求，在目标设备上执行任意系统命令，完全控制路由器。该漏洞影响使用上述版本固件的设备，CVSS 评分 9.8，危害等级严重。攻击者无需任何凭据即可利用此漏洞获取路由器最高权限，进而操控网络流量或进一步渗透内网。"
published = "2020-07-13T19:15:12Z"
remediation = "立即升级 Tenda AC15 AC1900 路由器固件至官方修复版本（高于 15.03.05.19 的最新版本），登录路由器管理界面，进入系统工具→固件升级，下载并安装 Tenda 官方发布的 AC15 最新固件包完成升级。如暂无法立即升级，请在管理界面中关闭远程管理功能，设置 Web 管理界面仅允许内网 IP 访问，禁止从 WAN 侧访问路由器 80 端口，同时修改默认管理员密码并禁用不必要的 UPnP 功能以降低攻击面。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "腾达 AC15 AC1900 路由器远程命令注入漏洞"
updated = "2026-06-17T02:48:48Z"

