[basic]
description = "Active Directory 联合身份验证服务（AD FS）存在欺骗漏洞，该漏洞与跨站请求伪造（CSRF）相关。未经身份认证的远程攻击者可通过诱导已登录用户访问恶意构造的链接或网页，利用该漏洞在目标用户的浏览器上下文中执行未授权的操作，导致敏感信息泄露。攻击者需要用户交互才能利用此漏洞，影响 Windows 系统的 AD FS 组件。Microsoft 已在 2025 年 1 月安全更新（KB5049983）中修复此漏洞。"
published = "2025-01-14T18:15:31Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新（KB5049983），该更新修复了 Windows Server 2016（版本 10.0.14393.7699）、Windows Server 2019（版本 10.0.17763.6775）、Windows Server 2022（版本 10.0.20348.3091）及 Windows Server 2025（版本 10.0.26100.2894）上的 AD FS 欺骗漏洞。可通过 Windows Update 自动获取更新，或从 Microsoft 更新目录网站手动下载安装。如无法立即打补丁，可限制对 AD FS 服务器的网络访问并启用增强型跨站请求伪造（CSRF）防护措施作为临时缓解。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Active Directory Federation Server 欺骗漏洞"
updated = "2026-06-17T08:42:44Z"

