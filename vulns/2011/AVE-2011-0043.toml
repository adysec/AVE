[basic]
description = "Adobe Flash Player 10.2.152.26之前版本存在内存破坏漏洞（CWE-119）。远程攻击者可通过诱使用户访问恶意构造的SWF文件或网页，触发Flash播放器在处理未指定向量时的内存破坏，成功利用该漏洞可在目标系统上执行任意代码或导致拒绝服务。该漏洞无需身份认证即可远程利用，CVSS评分9.3，危害等级严重。Adobe已在2011年2月发布安全更新修复此漏洞。"
published = "2011-02-10T16:00:33Z"
remediation = "立即升级 Adobe Flash Player 至 10.2.152.26 或更高版本。Windows/Mac/Linux 用户从 Adobe 官网或通过产品内更新机制获取；Linux 发行版用户通过各自包管理器安装对应更新（如 Red Hat 参照 RHSA-2011-0206/RHSA-2011-0259/RHSA-2011-0368）。如无法升级，在浏览器中禁用 Flash 插件或启用 click-to-play 机制作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏漏洞"
updated = "2026-06-16T23:27:44Z"

