[basic]
description = "Linux 内核 CIFS 文件系统驱动在处理 acregmax 挂载选项时存在整数溢出漏洞。用户提供的 u32 类型 acregmax 参数在转换为内核时间单位 jiffies 时未进行上限验证，攻击者可构造超大数值触发整数溢出。该漏洞影响使用 CIFS 文件系统的 Linux 内核版本，需要本地用户具备挂载文件系统的权限方可利用。成功利用可能导致系统可用性受损或拒绝服务。CVSS 评分 5.5，危害等级中等。Linux Verification Center 通过 SVACE 发现该漏洞，内核维护者已在补丁中修复此问题。"
published = "2025-04-01T16:15:27Z"
remediation = "升级 Linux 内核至修复版本（5.15.180、6.1.132、6.6.84、6.12.20、6.13.8 及以后版本），或应用 kernel.org 相关补丁（commit a1335162、dd190168 等）。如暂无法升级内核，可临时避免使用 acregmax 挂载选项，并限制普通用户挂载 CIFS 文件系统的权限以降低风险。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux内核 CIFS 整数溢出漏洞"
updated = "2026-06-17T08:44:43Z"

