[basic]
description = "n8n-MCP 是一款为 AI 助手提供 n8n 节点文档和操作功能的 MCP 服务器。在多租户 HTTP 模式下，由于授权检查不完善，已认证的租户可能访问默认作用域中的工作流版本备份，而非被限制在其自身租户作用域内。攻击者需具备低权限认证身份，利用高复杂度的网络请求绕过租户隔离，导致敏感工作流配置信息泄露或备份被删除。该漏洞影响 n8n-MCP ≤2.57.3 版本，单租户和 stdio 模式不受影响。"
published = "2026-07-15T21:16:55Z"
remediation = "升级 n8n-mcp 至 2.57.4 或更高版本，该版本在 multi-tenant 模式下强制要求完整租户上下文校验。如无法立即升级，可通过防火墙/反向代理限制 HTTP 端点的网络访问，仅允许受信调用者连接；或改用 stdio 模式运行以消除 multi-tenant HTTP 攻击面。"
score = 4.2
severity = "MEDIUM"
sources = ["ghsa"]
title = "n8n n8n-MCP 多租户HTTP模式授权不当信息泄露漏洞"
updated = "2026-07-17T17:11:08Z"

