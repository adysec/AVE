[basic]
description = "MCP Ruby SDK 的 stdio 传输层（MCP::Server::Transports::StdioTransport 和 MCP::Client::Stdio）在读取换行符分隔的 JSON-RPC 帧时，使用 IO#gets 方法且未设置字节长度限制。攻击者可通过持续发送不含换行符的数据流，使 gets 方法无限累积字符串内容，最终耗尽进程内存导致服务崩溃（DoS）。该漏洞影响 mcp gem 0.23.0 之前的所有版本，CVSS 评分 6.2，危害等级中危。修复方式为升级至 0.23.0 版本，或对 gets 调用添加 4 MiB 的最大行长度限制。"
published = "2026-07-29T20:17:10.790"
remediation = "立即将 mcp gem 升级至 0.23.0 或更高版本（`gem update mcp`）。如无法升级，在调用 `StdioTransport` 和 `Client::Stdio` 的代码中为 `IO#gets` 添加第二个参数限制最大读取字节数（建议 4MB），并捕获超限异常关闭连接。对于 HTTP-to-stdio 桥接部署，在转发层增加帧长度校验。"
score = 6.2
severity = "MEDIUM"
sources = ["ghsa"]
title = "MCP Ruby SDK stdio 传输无限制行缓冲区导致内存耗尽拒绝服务漏洞"
updated = "2026-07-30T19:30:33.710"

