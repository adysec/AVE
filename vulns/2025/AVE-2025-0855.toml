[basic]
description = "Microsoft SharePoint Server 存在欺骗漏洞，具有低权限的认证攻击者可通过网络向目标 SharePoint 服务器发送特制请求，并诱导高权限用户点击恶意链接，触发跨站脚本（XSS）攻击，从而窃取受害者会话凭证或以受害者身份执行未授权操作，导致机密性高影响和完整性低影响。该漏洞影响多个 SharePoint Server 版本，攻击复杂度低，无需特殊权限组合即可利用。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:16:03Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新：SharePoint Enterprise Server 2016 升级至 16.0.5483.1001，SharePoint Server 2019 升级至 16.0.10416.20041，SharePoint Server Subscription Edition 升级至 16.0.17928.20356。可通过 Microsoft Update 或 WSUS 自动部署。临时缓解措施可限制对 SharePoint 站点的可信用户访问。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft SharePoint Server 欺骗漏洞"
updated = "2026-06-17T08:43:16Z"

