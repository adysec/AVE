[basic]
description = 'Intelbras NPLUG 1.0.0.14 无线中继器存在身份认证绕过漏洞，攻击者仅需在 Cookie 中设置名为 "admin:" 的值即可绕过 Web 管理界面的身份验证，直接获得管理员权限访问。该漏洞源于设备对会话 Cookie 验证逻辑缺陷，未正确校验用户身份凭证。影响范围为运行该固件版本的 Intelbras NPLUG 无线中继设备。攻击条件为：目标设备 Web 管理界面暴露在网络可达范围内，无需用户交互或前置认证。利用方式为构造包含 "admin:" Cookie 名的 HTTP 请求直接访问管理后台，可导致设备配置被篡改、网络流量被劫持或固件被植入恶意代码。CVSS 3.0 评分 8.1（高危），向量为 AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H。'
published = "2018-10-10T21:29:01Z"
remediation = "建议立即更新 Intelbras NPLUG 无线重复器设备固件到最新支持版本，获取官方认证修复补丁；同时关闭设备 Web 管理界面远程访问功能，如需远程管理请通过VPN连接；此外应更改默认管理员密码并启用强密码策略，以防止攻击者利用 cookie 认证绕过漏洞非法访问设备控制面板。"
score = 8.1
severity = "HIGH"
sources = ["nuclei"]
title = "Intelbras NPLUG 认证绕过漏洞"
updated = "2026-06-17T01:37:48Z"

