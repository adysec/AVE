[info]
author = "ave"
description = "检测 Microsoft IIS 4.0 ISAPI .ASP 解析机制缓冲区溢出，通过构造超长 LANGUAGE 参数触发漏洞"
id = "POC-AVE-2000-0824"
name = "CVE-2000-1147 Microsoft IIS 4.0 ISAPI Buffer Overflow PoC"
severity = "high"
tags = ["ave-2000-0824"]
vuln_id = [
    "CVE-2000-1147",
    "AVE-2000-0824",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/test.asp"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [500]
type = "status"
