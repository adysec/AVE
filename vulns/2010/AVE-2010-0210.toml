[basic]
description = "OpenOffice.org 2.x 和 3.3 之前版本的 oowriter 组件中 WW8DopTypography::ReadFromMem 函数存在多处 off-by-one 错误，在处理 Microsoft Word .DOC 文件中特制的排版信息时触发越界写入，导致堆内存破坏。远程攻击者可诱导用户打开恶意构造的 Word 文档触发该漏洞，造成应用程序崩溃或执行任意代码。该漏洞影响 OpenOffice.org 2.x 及 3.3 之前的所有版本，CVSS 评分 9.3，危害严重。"
published = "2011-01-28T22:00:05Z"
remediation = "立即升级至 OpenOffice.org 3.3 或更高版本。各 Linux 发行版用户可通过包管理器更新：Ubuntu 执行 `sudo apt-get update && sudo apt-get upgrade openoffice.org`，Debian 参考 DSA-2151，Red Hat 用户安装 RHSA-2011-0181/0182 提供的更新。如无法立即升级，避免打开来自不可信来源的 Word .doc 文件，并考虑使用 LibreOffice 作为替代方案。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apache OpenOffice 越界写入远程代码执行漏洞"
updated = "2026-06-16T23:22:48Z"

