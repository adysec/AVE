[basic]
description = "Linux 内核 vsock/bpf 子系统中存在空指针解引用漏洞。当 socket 的 transport 指针为 NULL 时（例如 connect() 调用失败后），vsock_bpf_recvmsg() 函数未对 transport 进行空值检查就调用 vsock_connectible_has_data()，导致内核发生空指针解引用并触发 Oops 崩溃。该漏洞影响所有启用 vsock/bpf 功能的 Linux 内核版本，攻击者需要具有本地低权限访问权限，通过构造 connect() 失败场景并随后发起 recvmsg 系统调用来触发漏洞，最终导致系统拒绝服务。"
published = "2025-01-31T12:15:28.160"
remediation = "升级 Linux 内核至修复版本：运行 6.6 系列的系统升级至 6.6.74 或更高版本，6.7 至 6.11 系列升级至 6.12.11 或更高版本，6.13 候选版升级至 6.13 稳定版。该漏洞为 vsock/bpf 子系统空指针解引用，无法通过配置规避，必须安装包含补丁 commit 58e586c30d0b 的内核版本。主流发行版用户可通过系统包管理器安装对应安全更新：Ubuntu/Debian 执行 apt upgrade linux-image，RHEL/CentOS 执行 dnf update kernel，SUSE 执行 zypper patch。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 vsock/bpf 空指针解引用拒绝服务漏洞"
updated = "2026-06-17T08:43:58.803"

