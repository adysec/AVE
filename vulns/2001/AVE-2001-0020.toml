[basic]
description = "APC UPS 守护进程 apcupsd 将其进程 ID 保存到一个全局可写的文件中，导致本地攻击者可以通过修改该 PID 文件中的进程 ID 值来终止任意进程，从而造成本地拒绝服务。该漏洞影响运行 apcupsd 3.7.2 版本的 APC UPS 设备及相关 Linux/UNIX 系统，攻击者只需具备本地系统访问权限即可利用，无需身份认证。通过向 apcupsd.pid 文件写入目标进程 ID，可导致受保护的服务或关键进程被意外终止，影响系统可用性。ExploitDB 上已有公开的利用代码（EDB-ID: 251），建议升级 apcupsd 至安全版本并限制 PID 文件的访问权限。"
published = "2001-02-16T05:00:00Z"
remediation = "建议升级 apcupsd 至 3.8.0 或更高版本（官方已修复该 PID 文件权限问题）。若暂时无法升级，可将 apcupsd.pid 文件权限修改为 644（chmod 644 /var/run/apcupsd.pid）并确保以非 root 低权限用户运行守护进程，防止本地用户篡改 PID 导致拒绝服务。"
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "APC UPS apcupsd 本地拒绝服务漏洞"
updated = "2026-06-16T21:53:32Z"

