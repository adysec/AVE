[basic]
description = "SonicWALL SOHO 防火墙 4.0/5.0 版本的 Web 服务器在认证页面处理用户名字段时存在输入验证缺陷，未对用户名长度进行有效限制。远程攻击者无需身份认证即可通过提交超长用户名字符串触发缓冲区溢出，导致 Web 服务进程崩溃，进而造成防火墙管理接口拒绝服务，影响网络正常通信。该漏洞攻击门槛低，仅需发送特制 HTTP 请求即可触发，CVSS v2 评分 5.0。"
published = "2001-01-09"
remediation = "升级 SonicWALL SOHO Firewall 固件至厂商修复版本（5.0.0 以上补丁版），该产品已停止支持，建议更换为受支持的 SonicWALL 新一代防火墙设备。如无法立即升级，可在 Web 管理界面配置访问控制列表（ACL），限制仅信任 IP 可访问管理页面，并在认证页面启用请求长度限制以缓解长用户名攻击。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "SonicWALL SOHO Firewall 4.0/5.0 Web服务器拒绝服务漏洞"
updated = "2001-01-09"

