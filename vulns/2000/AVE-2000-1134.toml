[basic]
description = "FreeBSD telnetd 服务在处理 TERMCAP 环境变量时，会读取并解析攻击者指定的文件内容。未经身份认证的远程攻击者可在连接 Telnet 服务时，将 TERMCAP 环境变量设置为一个极大文件的路径，导致服务器在解析该文件过程中消耗大量内存和 CPU 资源，从而引发拒绝服务。该漏洞影响 FreeBSD 4.2 及更早版本（包括 3.0、3.5.1、4.0、4.1、4.1.1），攻击者无需账号凭证，只要能够通过网络访问目标系统 23 端口即可触发。成功利用后目标系统资源将被耗尽，导致合法用户无法正常使用 Telnet 服务，严重时可造成系统不稳定或宕机。FreeBSD 官方在后续版本中已修复此漏洞，建议升级并限制 Telnet 服务的网络访问范围。"
published = "2001-01-09T05:00:00Z"
remediation = "升级到 FreeBSD 4.2-RELEASE 或更高版本，该版本已修复 telnetd 对 TERMCAP 环境变量未加验证的问题。若无法立即升级，可在 /etc/inetd.conf 中注释掉 telnet 服务行并重启 inetd，或通过 TCP wrappers（/etc/hosts.allow）及防火墙（ipfw）仅允许受信任的主机访问 23 端口作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "FreeBSD Telnet 守护进程环境变量拒绝服务漏洞"
updated = "2026-06-16T21:53:20Z"

