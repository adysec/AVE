[basic]
description = "BBC Education Betsie 1.5.11 及更早版本的 Text to Speech Internet Enhancer（Betsie）中的 parserl.pl 脚本存在跨站脚本（XSS）漏洞。远程攻击者可通过向 parserl.pl 发送特制的恶意请求，注入任意 Web 脚本或 HTML 代码，当其他用户访问受影响的页面时脚本将在其浏览器中执行，导致敏感信息泄露或会话劫持。攻击无需身份认证但需诱导用户交互，影响范围较广。"
published = "2002-10-04T04:00:00.000"
remediation = "升级 BBC Education Betsie 至 1.5.11 以上版本（如官方已不再维护，建议彻底移除 Betsie 软件或禁用 parserl.pl 脚本）。若无法升级，在 parserl.pl 中对用户输入参数进行 HTML 实体编码过滤，对 <script>、<img> 等危险标签做转义处理，同时在 Web 服务器（如 Apache）层面配置 ModSecurity WAF 规则拦截 XSS 攻击载荷。"
score = 6.8
severity = "MEDIUM"
sources = ["exploitdb"]
title = "BBC Education Betsie parserl.pl 跨站脚本漏洞"
updated = "2026-06-16T21:58:33.183"

