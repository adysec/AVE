[basic]
description = "Apple iOS/iPadOS/macOS/watchOS/tvOS 存在竞争条件漏洞（CWE-667），源于内核锁机制不当，攻击者可在本地通过恶意应用程序利用竞争窗口提升权限至内核级。该漏洞影响 iOS 14.4、iPadOS 14.4、macOS Big Sur 11.2、watchOS 7.3、tvOS 14.4 及 Catalina/Mojave 安全更新前版本，CVSS 3.1 评分 7.0（HIGH，AV:L/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H），Apple 确认该漏洞已被在野利用，需尽快升级至修复版本。"
published = "2021-04-02T18:15:21.373"
remediation = "立即将 iPadOS 升级至 14.4 或更高版本，将 iOS 升级至 14.4 或更高版本，或将 macOS Big Sur 升级至 11.2。对于无法立即升级的设备，可安装 Apple 发布的安全更新（Security Update 2021-001，适用于 Catalina 和 Mojave）。在企业环境中，可通过移动设备管理（MDM）策略强制推送更新，并临时限制不受信任的应用程序安装权限以降低被利用风险。"
score = 7
severity = "HIGH"
sources = ["kev"]
title = "Apple iPadOS 特权提升漏洞"
updated = "2026-06-17T03:32:33.030"

