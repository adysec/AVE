[basic]
description = "Apache HTTP Server 1.3.12 及更早版本中的 mod_rewrite 模块存在任意文件读取漏洞。当配置中的 RewriteRule 目标路径包含正则表达式反向引用时，规则在展开后可能映射到任意文件名；远程攻击者无需身份认证，可构造特制 HTTP 请求触发该规则，从而读取服务器上任意文件内容，造成敏感信息泄露。影响启用了此类重写规则的 Apache 1.3.x 站点，CVSS 2.0 评分 5.0（中危），已在 Apache HTTP Server 1.3.14 中修复。"
published = "2000-12-19T05:00:00.000"
remediation = "将 Apache HTTP Server 升级至 1.3.14 或更高版本（Apache 1.3 已于 2010 年停止支持，建议迁移至当前受支持的 2.4.x 版本）。如无法立即升级，临时缓解措施：移除或修改所有包含正则表达式反向引用（$N 或 %N）的 RewriteRule 指令，禁止在 RewriteRule 目标中使用正则引用，或临时禁用 mod_rewrite 模块，同时限制 Web 服务器进程对敏感目录和文件的访问权限。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Apache HTTP Server mod_rewrite 任意文件读取漏洞"
updated = "2026-06-16T21:52:45.083"

