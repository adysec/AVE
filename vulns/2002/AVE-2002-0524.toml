[basic]
description = "SmartMax MailMax 4.8 的 POP3 服务组件（popmax）存在缓冲区溢出漏洞。远程攻击者可通过向该服务发送超长的 USER 命令参数触发缓冲区溢出，导致任意代码执行。该漏洞影响 SmartMax MailMax 4.8 版本，攻击者无需身份认证即可利用，CVSS 评分 7.5，危害等级高。目前已存在公开的利用代码，建议用户立即升级至不受影响的版本。"
published = "2002-10-04T04:00:00Z"
remediation = "SmartMax MailMax 已停止维护且厂商已不存在，无法通过补丁修复。建议立即将 MailMax 升级或迁移至其他仍在维护的邮件服务器软件（如 hMailServer、MailEnable 等）。如无法立即迁移，可在防火墙层面将 POP3 端口（110/TCP）的访问权限限制为仅允许受信任的内部 IP，禁止来自外网的任何连接，以降低远程利用风险。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "SmartMax MailMax Popmax 缓冲区溢出漏洞"
updated = "2026-06-16T21:58:38Z"

