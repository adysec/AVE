[basic]
description = "基于Chromium的Microsoft Edge存在输入验证不当漏洞。未经身份认证的远程攻击者可通过网络向目标用户发送特制网页内容，当用户使用Microsoft Edge浏览器访问恶意页面或打开恶意文件时触发该漏洞，绕过浏览器内置安全功能限制。该漏洞影响Microsoft Edge浏览器早期版本（低于148.0.3967.70），攻击者需要诱使用户点击恶意链接或访问恶意网站才能利用，攻击成功后可导致浏览器安全防护措施失效，为后续攻击创造条件。Microsoft已在2026年5月15日安全更新中修复此漏洞。"
published = "2026-05-18T18:17:37.897"
remediation = '建议立即将 Microsoft Edge (Chromium-based) 升级至 148.0.3967.70 或更高版本。可通过设置 → 关于 Microsoft Edge 触发自动更新，或访问 https://www.microsoft.com/edge 下载最新安装包手动升级。如暂时无法更新，建议启用 Edge 的"增强安全模式"并在组策略中限制非受信站点的脚本执行作为临时缓解措施。'
score = 5.4
severity = "MEDIUM"
sources = ["zdi"]
title = "Microsoft Edge (Chromium-based) 安全功能绕过漏洞"
updated = "2026-06-17T10:52:08.377"

