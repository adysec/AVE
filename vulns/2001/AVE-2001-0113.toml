[basic]
description = "KICQ 1.0 IRC 客户端在解析 URL 时未对 shell 元字符进行有效过滤，存在任意命令执行漏洞。远程攻击者无需身份认证，可通过构造包含 shell 元字符的特制 URL 并诱导目标点击或访问，触发命令注入，进而在受害者系统上执行任意操作系统命令。该漏洞影响 KICQ 1.0.0 及后续可能受影响的版本，攻击者仅需网络可达即可发起利用。CVSS 评分 7.5，危害等级较高。"
published = "2001-05-03T04:00:00Z"
remediation = "由于 KICQ 1.0 已停止维护且无官方补丁，建议立即停止使用该客户端并迁移至 HexChat 或 WeeChat 等现代安全替代品。若必须运行，请将其部署在隔离的沙箱环境中，并严格限制其网络出站权限以防止远程命令执行。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "KICQ IRC客户端 远程命令执行漏洞"
updated = "2026-06-16T21:54:00Z"

