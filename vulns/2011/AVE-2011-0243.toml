[basic]
description = "Google Chrome 16.0.912.63之前版本中存在正则表达式匹配越界读取漏洞。远程攻击者可通过构造特制的网页内容，诱使目标用户访问，触发浏览器在正则表达式匹配过程中发生越界内存读取，导致信息泄露或拒绝服务。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响所有未更新的Chrome浏览器用户。Google已在16.0.912.63版本中修复此漏洞。"
published = "2011-12-13T21:55:00Z"
remediation = "升级 Google Chrome 至 16.0.912.63 或更高版本。Ubuntu 用户可通过更新 chromium-browser 包至 17.0.963.56~r121963 系列版本修复。企业环境应通过组策略强制推送 Chrome 自动更新，或使用集中管理工具统一升级。如无法立即升级，可限制用户访问不可信网站作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 正则表达式越界读取漏洞"
updated = "2026-06-16T23:34:07Z"

