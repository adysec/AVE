[basic]
description = "nCipher HSM（硬件安全模块）的 swinit 工具存在权限控制缺陷，当用户显式禁用 Operator Card Set（操作员卡集）恢复功能时，该工具未能正确执行禁用操作，导致该恢复功能仍处于启用状态。攻击者可利用此缺陷在无需认证的情况下远程访问并恢复操作员卡集，进而获取存储在 HSM 中的应用程序密钥。该漏洞影响使用 nCipher HSM 且启用了 swinit 工具的系统，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:P/I:N/A:N），属于中等危害级别的信息泄露漏洞。攻击者只需网络访问权限即可发起攻击，无需用户交互或特权认证。"
published = "2001-02-12T05:00:00.000"
remediation = "立即升级 nCipher 软件至修复版本（参考厂商公告 http://active.ncipher.com/updates/advisory.txt），该版本已正确禁用 Operator Card Set 恢复功能。如无法升级，可在初始化安全世界（Security World）后手动检查 swinit 配置中 Operator Card Set recovery 选项是否已彻底关闭，并定期审计 HSM 日志确认无异常恢复操作。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "nCipher swinit 操作员卡组恢复功能绕过漏洞"
updated = "2026-06-16T21:53:37.227"

