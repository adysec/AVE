[basic]
description = "Google Chrome V8 JavaScript 引擎在实例化新 JavaScript 对象时计算所需分配大小存在整数溢出漏洞（CWE-190），远程攻击者可构造特制 HTML 页面诱导用户访问，触发堆破坏（heap corruption），可能导致任意代码执行。该漏洞影响 Chrome 65.0.3325.146 之前版本，CVSS 评分 8.8，危害等级高危。Google 已在 Chrome 65 版本中修复此漏洞。"
published = "2018-11-14T15:29:01Z"
remediation = "升级 Google Chrome 至 65.0.3325.146 或更高版本（Chrome 会自动检查更新，也可通过 chrome://settings/help 手动触发更新）。基于 Chromium 的浏览器用户应更新至对应版本（如 Debian stretch 升级 chromium-browser 至 66.0.3359.117-1~deb9u1）。无法立即升级时，可禁用 JavaScript（chrome://settings/content/javascript）作为临时缓解措施，但会影响正常网页功能。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome V8 整数溢出漏洞"
updated = "2026-06-17T02:01:16Z"

