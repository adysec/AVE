[basic]
description = "OpenBSD 2.x 及更早版本的内置 FTP 守护进程 ftpd 中的 glob() 函数存在缓冲区溢出漏洞。该漏洞源于 BSD 系列 FTP 服务器在处理文件名通配符模式（glob pattern）时未对包含花括号 {} 序列的超长输入进行边界检查，导致 g_opendir、g_lstat、g_stat 以及 glob0 缓冲区等多个函数发生堆栈溢出。未经身份验证的远程攻击者可通过向 FTP 服务器发送包含超长 {} 通配符模式的恶意 FTP 命令（如 LIST、NLST、STAT 等触发 glob 函数调用的命令），利用缓冲区溢出执行任意系统命令，完全接管目标服务器。该漏洞影响 OpenBSD 2.x 至 2.7 版本，CVSS 评分 10.0，危害等级严重，攻击条件简单，无需认证即可利用。"
published = "2001-06-18T04:00:00Z"
remediation = "建议立即升级 OpenBSD 到 2.8 或更高版本，该版本已修复 glob(3) 库中的缓冲区溢出及 ftpd 对 glob 调用的限制问题。若暂无法升级完整版本，可依次应用官方补丁：在 /usr/src 目录执行 patch -p0 &lt; 025_glob.patch 修复 glob 库，再进入 libexec/ftpd 执行 make obj &amp;&amp; make depend &amp;&amp; make &amp;&amp; make install，并重建 libc：cd /usr/src/lib/libc &amp;&amp; make -DNOMAN install；如无需 FTP 服务，可通过注释 inetd.conf 中 ftp 行或移除 /etc/inetd.conf 中的 ftp 条目禁用 ftpd 作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "OpenBSD ftpd glob() 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:53:57Z"

