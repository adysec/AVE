[basic]
description = "Apple 多个操作系统中的字体解析组件存在内存破坏漏洞，由于对字体数据的输入验证不足，攻击者可通过诱导用户打开包含恶意构造字体的文件或网页，触发内存损坏，导致任意代码执行。该漏洞影响 macOS Big Sur 11.0.1、iOS 14.2、iPadOS 14.2、watchOS 7.1 等多个版本，CVSS 评分 7.8，危害等级高。Google Project Zero 曾报告该漏洞已在野外被利用，Apple 已在 2020 年 11 月的安全更新中修复。"
published = "2020-12-08T21:15:13.827"
remediation = "立即升级至以下修复版本：macOS Big Sur 11.0.1、iOS/iPadOS 14.2、watchOS 7.1、tvOS 14.2；旧版本用户安装 Security Update 2020-006 (High Sierra/Mojave) 或 Catalina 10.15.7 Supplemental Update。如无法升级，避免在受影响设备上打开来源不明的字体文件，并启用系统完整性保护 (SIP) 以降低利用风险。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Apple 多款产品字体处理任意代码执行漏洞"
updated = "2026-06-17T03:09:53.467"

