[basic]
description = "Cisco IOS 和 IOS XE 软件的 Internet 密钥交换版本 2（IKEv2）模块存在拒绝服务漏洞。该漏洞源于受影响设备在处理特定 IKEv2 数据包时存在缺陷，未经身份认证的远程攻击者可通过向目标设备发送特制的 IKEv2 数据包触发此漏洞，导致设备 CPU 利用率飙升、产生回溯消息甚至设备重载，造成拒绝服务。该漏洞影响 Cisco IOS 15.0 至 15.6 及 IOS XE 3.5 至 16.5 版本，设备无需配置任何 IKEv2 特定功能，只要启用 ISAKMP 即受影响，广泛涉及 LAN-to-LAN VPN、远程访问 VPN、DMVPN 及 FlexVPN 等多种 VPN 场景。CVSS 评分 7.5，危害等级高。"
published = "2017-09-29T01:34:48Z"
remediation = "立即升级到受支持版本 Cisco IOS 15.7(2)M5 或 Cisco IOS XE 16.6.1 或更高版本，这些版本包含了对 CSCvc41277漏洞的修复。如无法立即升级，可通过配置限制 IKEv2 流量速率（每秒不超过100个交易单元）并在防火墙上弃用不安全的IKEv2 Cryptographic Algorithms以作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "思科 IOS/IOS XE IKEv2 拒绝服务漏洞"
updated = "2026-06-17T01:02:56Z"

