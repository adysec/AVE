[basic]
description = "X.org Server 与 Xwayland 的 glamor 字体图集模块在处理 PCX 字体时存在堆缓冲区溢出漏洞。攻击者利用 SetFont 函数中缺失的字形边界检查，通过 X 连接向 X 服务器发送特制的 PCX 字体数据，可触发堆缓冲区溢出。该漏洞影响 xorg-server 21.2.24 之前版本及 xwayland 24.1.13 之前版本。本地攻击者需具备 X 连接权限，利用此漏洞可导致远程代码执行或权限提升。CVSS 评分为 8.5，危害等级为高危。"
published = "2026-07-08T09:16:29.800"
remediation = '立即升级 xorg-server 至 21.1.24 或更高版本，升级 xwayland 至 24.1.13 或更高版本。Debian/Ubuntu 用户执行 apt update && apt install xorg-server xwayland，Red Hat/CentOS 用户执行 yum update xorg-x11-server-common 或 dnf update xorg-x11-server-common。临时缓解措施：禁用 glamor 加速后端（在 xorg.conf 中设置 Option "Accel" "NoAccel"），或通过 Xorg 配置限制 SetFontPath 路径仅指向可信字体目录，防止加载恶意 PCF 字体。修复详情参见 https://gitlab.freedesktop.org/xorg/xserver/-/commit/fbf7bac22e2c6bd627fb042742a23318263edae1。'
score = 8.5
severity = "HIGH"
sources = ["zdi"]
title = "X.Org Server xwayland glamor字体堆缓冲区溢出漏洞"
updated = "2026-07-09T19:49:51.483"

