[basic]
description = "SuSE Linux 6.x 及 7.0 版本中自带的 in.identd 身份识别服务存在空指针解引用漏洞。未经身份认证的远程攻击者可通过向目标系统的 ident 服务端口（TCP 113）发送特制超长请求，触发服务程序访问空指针导致进程崩溃，造成拒绝服务。该漏洞影响 SuSE Linux 6.x 及 7.0 版本，CVSS 评分 5.0，危害等级中危。"
published = "2001-01-09T05:00:00.000"
remediation = "升级 SuSE Linux 至 7.1 或更高版本，该版本已修复 in.identd 长请求导致空指针崩溃的问题。如无法升级，可编辑 /etc/inetd.conf 注释掉 auth 服务行（#auth stream tcp nowait root /usr/sbin/in.identd in.identd -l），然后重启 inetd 以禁用 ident 服务作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "SuSE Linux identd 服务拒绝服务漏洞"
updated = "2026-06-16T21:53:09.733"

