[basic]
description = "SANE（Scanner Access Now Easy）后端 sane-backends 中的 saned 网络守护进程用于通过 TCP 端口共享扫描仪设备。当 sane-backends 1.0.7 及更早版本（部分发行版公告提及影响至 1.0.10）启用调试消息功能时，saned 在处理意外断开的网络连接时未能正确对字符串进行空字符截断，导致缓冲区中的字符串未正常终止。未经身份认证的远程攻击者只需向运行 saned 服务的目标主机建立网络连接后立即断开，即可触发该缺陷，使 saned 进程发生段错误（segmentation fault）并崩溃，造成扫描仪服务不可用的拒绝服务后果。该漏洞影响系统可用性，攻击复杂度低，无需权限即可远程利用。"
published = "2003-09-22T04:00:00Z"
remediation = "建议立即将 sane-backends 升级到 1.0.11 或更高版本，Debian 用户可通过 `apt-get update && apt-get install sane-backends` 安装 DSA-379 修复版本 1.0.7-4。作为临时缓解措施，可在 saned 配置文件中禁用调试消息（debug 选项设为 off），或通过防火墙限制外部对 saned 端口（TCP 6566）的访问，防止未授权连接触发调试日志输出导致崩溃。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "SANE sane-backends 远程拒绝服务漏洞"
updated = "2026-06-16T22:02:49Z"

