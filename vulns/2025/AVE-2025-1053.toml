[basic]
description = "Linux内核蓝牙管理接口的mgmt_device_connected()函数中存在空指针解引用漏洞。该函数在处理蓝牙设备连接管理事件时，未对内存分配函数mgmt_alloc_skb()的返回值进行空指针检查。当系统内存不足导致该函数返回NULL时，后续代码直接使用该空指针将触发空指针解引用，造成内核崩溃或系统拒绝服务。该漏洞影响运行受波及Linux内核版本的设备，攻击者需要具有本地访问权限，且需要一定的系统权限，无需用户交互即可触发。成功利用该漏洞可导致内核panic，使系统无法正常提供服务。"
published = "2025-04-01T16:15:24Z"
remediation = "建议立即将 Linux 内核升级至修复版本。上游 kernel 6.14-rc6 及以后版本已包含补丁 commit d8df010f72b8，该补丁在 mgmt_device_connected() 函数中为 mgmt_alloc_skb() 的返回值增加了空指针检查。Debian 12 (bookworm) 用户请安装 linux-image 6.1.133-1 或更高版本 (DSA-5900-1)；Ubuntu 24.04 LTS 用户请升级至 6.8.0-84.84 或更新版本；Ubuntu 24.10 用户请升级至 6.11.0-28.28。如无法立即升级，可临时禁用蓝牙管理接口（通过 sysfs 或 udev 规则限制本地蓝牙设备访问）以降低空指针解引用导致的本地拒绝服务风险。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 Bluetooth 空指针解引用拒绝服务漏洞"
updated = "2026-06-17T08:44:39Z"

