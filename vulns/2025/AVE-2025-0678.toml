[basic]
description = "Windows MapUrlToZone 功能存在安全功能绕过漏洞（CWE-41），该函数用于将 URL 映射到对应的安全区域（Internet/Intranet/受信任站点等）。攻击者可构造特制 URL 或文件，诱导用户点击后绕过安全区域限制，使本应归入低信任 Internet 区域的内容被错误地视为高信任区域来源，导致攻击者能够读取本不应被访问的受限信息。该漏洞攻击复杂度低，无需认证，但需要用户交互，影响 Windows 多个版本。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:33Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新：Windows 10 21H2/22H2 安装 KB5049981（OS Build 19044.5371 / 19045.5371），Windows 11 22H2/23H2 安装 KB5050008（OS Build 22621.4751 / 22631.4751），Windows 11 24H2 安装 KB5050009（OS Build 26100.2894），Windows Server 2019 安装 KB5050008（OS Build 17763.6775），Windows Server 2022 安装 KB5049983（OS Build 20348.3091）。可通过 Windows Update 自动获取更新，或从 Microsoft 更新目录网站手动下载。该漏洞需要用户交互（点击恶意链接），建议同时教育用户不要点击来源不明的 URL。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows MapUrlToZone 安全功能绕过漏洞"
updated = "2026-06-17T08:42:48Z"

