[basic]
description = "Netscape 6 和 Mozilla 1.0 RC1 及更早版本中存在缓冲区溢出漏洞，远程攻击者可通过向目标用户发送包含超长频道名称的特制 IRC URI 触发该漏洞，导致浏览器崩溃（拒绝服务），且可能在受影响系统上以用户权限执行任意代码。攻击条件为用户点击恶意链接，无需额外认证，危害等级高。"
published = "2002-06-18T04:00:00Z"
remediation = "tags.<value>升级到 Mozilla 1.0 正式版或更高版本，或升级到 Netscape 6.2.3 及以上版本。对于 Conectiva Linux 用户，可安装厂商提供的安全更新补丁（公告 ID 000490）。由于该产品已停止维护，建议迁移至现代浏览器如 Firefox 或 Chrome。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Netscape 6 和 Mozilla IRC URI 通道名缓冲区溢出漏洞"
updated = "2026-06-16T21:57:44Z"

