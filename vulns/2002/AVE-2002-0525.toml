[basic]
description = 'Cobalt Qube 3.0 的 splashAdmin.php 存在目录遍历漏洞，本地用户或远程攻击者可通过在 sessionId Cookie 中注入 ".."（点点）序列指向备用会话文件，从而绕过身份认证机制，获取 Qube 管理员权限。该漏洞 CVSS 评分 10.0，危害等级严重，攻击者无需身份验证即可远程利用，完全控制目标系统。'
published = "2002-10-04T04:00:00Z"
remediation = "立即升级 Cobalt Qube 3.0 至厂商发布的安全更新版本，该补丁通过 ISS X-Force 渠道发布（参考 BID 5297）。如无法升级，在 Web 服务器（Apache）层面配置访问控制，限制对 /splashAdmin.php 的访问来源 IP，仅允许受信任管理 IP 段访问；同时在反向代理或防火墙上添加规则，过滤 sessionId cookie 中的 `../` 目录遍历序列。由于 Cobalt Qube 产品已停止维护，建议迁移至受支持的服务器平台。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Cobalt Qube 3.0 目录遍历认证绕过漏洞"
updated = "2026-06-16T21:58:38Z"

