[basic]
description = "Arm Mali GPU 内核驱动存在资源管理错误漏洞，由于 GPU 内存操作处理不当，导致释放后使用（use-after-free），攻击者可利用此漏洞实现权限提升或信息泄露。该漏洞影响 Bifrost r0p0 至 r28p0（修复版本 r29p0 之前）、Valhall r19p0 至 r28p0（修复版本 r29p0 之前）以及 Midgard r4p0 至 r30p0 等版本。攻击者需要已获得本地低权限访问，通过特制应用或利用本地提权漏洞触发该漏洞，可在无需用户交互的情况下实现内核级代码执行或读取敏感内核内存信息。"
published = "2021-05-10T15:15:07Z"
remediation = "安装设备制造商发布的最新 Android 系统安全补丁，以获取修复后的 Mali GPU 内核驱动版本。Arm 已发布补丁：Bifrost 和 Valhall 架构需升级至 r29p0 或更高版本，Midgard 架构需升级至 r31p0 或更高版本。设备厂商应将补丁合入系统固件并推送 OTA 更新，用户应及时更新系统。如无法立即打补丁，可通过应用层限制对 GPU 资源的访问请求来降低利用风险。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Arm Mali GPU 内核驱动权限提升漏洞"
updated = "2026-06-17T03:46:43Z"

