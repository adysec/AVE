[info]
author = "AVE"
description = "检测目标 Kaseya CwWebService ManagedIT.asmx 页面是否存在未授权访问及 SQL 注入漏洞"
id = "POC-AVE-2017-0606"
name = "CVE-2017-18362 PoC"
severity = "critical"
tags = ["ave-2017-0606"]
vuln_id = [
    "CVE-2017-18362",
    "AVE-2017-0606",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/KaseyaCwWebService/ManagedIT.asmx"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "ManagedIT.asmx?op=",
    "ExecuteSQLQuery",
]
