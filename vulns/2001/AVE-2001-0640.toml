[basic]
description = 'Windows 98 和 Windows Me 系统附带的 Plus! 组件中，"压缩文件夹"（Compressed Folders）功能的密码保护选项存在安全缺陷。该功能在用户为 ZIP 压缩文件夹设置密码保护后，会将密码信息以明文形式写入系统临时文件，导致具有本地访问权限的任何用户均可直接读取该文件并恢复密码。攻击者无需特殊权限或身份认证，只需具备对目标系统的本地登录访问权，即可通过读取系统存储的密码文件获取压缩文件夹的密码，进而绕过密码保护机制直接访问其中的受保护内容。该漏洞影响所有使用 Plus! for Windows 98 和 Windows Me 压缩文件夹密码保护功能的用户，可导致敏感数据泄露。'
published = "2001-05-03T04:00:00Z"
remediation = '应用微软安全公告 MS01-019 补丁（KB252694），并删除 C:\Windows\dynazip.log 文件以清除已记录的密码。对于 Windows Me 系统，验证 zipfldr.dll 版本为 5.50.4213.1600；对于 Plus! 98，验证 zipfldr.dll 版本为 5.0.518.20（非日语系统）或 5.0.526.20（日语/NEC 系统）。鉴于 Windows 98/Me 已停止支持，建议升级至受支持的操作系统并使用具有强访问控制机制的文件加密方案替代压缩文件夹密码保护功能。'
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "微软 Windows Plus! 压缩文件夹密码泄露漏洞"
updated = "2026-06-16T21:53:46Z"

