[basic]
description = "QHora QuRouter 存在通信通道限制不当漏洞（CWE-923），攻击者通过物理接触目标设备，可绕过预期的端点访问控制机制，获取本应仅授予原始管理端口的特权权限。该漏洞影响 QuRouter 2.6.x 系列固件版本，CVSS 3.1 评分 6.8（中危），攻击向量为物理访问（AV:P），攻击复杂度低，无需身份认证，成功利用后可导致机密性、完整性和可用性全面受损。该漏洞由 Team DDOS 在 Pwn2Own 2025 大赛中报告，QNAP 已在 QuRouter 2.6.3.009 及更高版本中修复。"
published = "2026-03-21T00:00:00Z"
remediation = "立即将 QHora QuRouter 固件升级至 2.6.3.009 或更高版本，可通过 QNAP 官方下载中心或设备管理后台获取更新。同时限制设备物理接触，将路由器放置在受控上锁机柜中，禁用未使用的管理端口，并修改默认管理员密码。详细补丁信息请参考安全公告 QSA-26-12。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "QHora QuRouter 权限提升漏洞"
updated = "2026-03-21T00:00:00Z"

