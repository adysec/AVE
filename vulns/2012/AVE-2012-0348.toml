[basic]
description = "Apple iTunes 10.7 之前版本使用的 WebKit 组件存在内存破坏漏洞。远程攻击者无需身份认证即可通过诱导用户访问特制的恶意网站，利用该漏洞触发内存错误，导致任意代码执行或应用程序崩溃。该漏洞影响使用 iTunes 的 Mac OS X 系统，攻击条件为用户访问包含恶意内容的网页即可触发。"
published = "2012-09-13T10:30:20.323"
remediation = "升级 Apple iTunes 至 10.7 或更高版本，该版本已修复 WebKit 组件中的内存破坏漏洞。macOS 用户可通过 Mac App Store 自动更新 iTunes，或手动下载最新安装包。若无法立即升级，可在 Safari 浏览器中禁用 JavaScript 作为临时缓解措施，降低被恶意网页利用的风险。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:42.237"

