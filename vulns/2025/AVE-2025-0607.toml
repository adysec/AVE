[basic]
description = "qs 库（版本 < 6.14.1）的 arrayLimit 选项在解析查询字符串时存在一致性缺陷：该选项仅对索引式数组表示法（如 a[0]=1&a[1]=2）强制执行长度限制，却未对括号式表示法（a[]=1&a[]=2）进行同样的校验。攻击者可通过构造大量括号式数组参数（如 a[]=x 重复数千次），绕过 arrayLimit 限制导致内存耗尽，引发 HTTP DoS。默认参数 parameterLimit=1000 在一定程度上缓解了风险，但显式设置高 parameterLimit 时风险显著增加。影响范围为使用 qs 解析用户输入的 Node.js 应用，攻击条件为攻击者可控制查询字符串输入，利用方式为发送包含大量括号式数组参数的 HTTP 请求。"
published = "2025-12-29T23:15:42Z"
remediation = "升级 qs 解析模块到 6.14.1 或更高版本，直接修复 arrayLimit 检查缺失 bug。立即应用安全补丁以确保对 bracket 符号（a[]=1&a[]=2）应用相同 arrayLimit 限制。如果无法立即更新，可通过在应用启动时设置参数限制 (parameterLimit=1000) 或手动验证数组长度作为临时缓解措施。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "qs 解析库 数组限制绕过导致内存耗尽"
updated = "2026-06-17T08:37:31Z"

