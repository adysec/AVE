[basic]
description = "PHP GD 图形库及 base64_encode 函数存在整数溢出漏洞。当 PHP 版本低于 4.3.3 时，攻击者可构造恶意图像数据或超长字符串触发整数溢出，进而导致缓冲区溢出，实现任意代码执行。该漏洞影响广泛部署的 PHP 服务器，攻击者可未经身份验证从网络远程发起攻击，无需任何交互即可完全控制系统。CVSS 评分 10.0，危害等级严重。"
published = "2003-11-17T05:00:00Z"
remediation = "建议立即将 PHP 升级至 4.3.3 或更高版本，以修复 base64_encode 及 GD 库中的整数溢出漏洞。升级前请备份现有配置文件及网站数据，下载官方安全版本后替换 PHP 二进制文件并重启 Web 服务器。若短期内无法升级，可临时禁用 GD 扩展或限制使用 base64 编码相关函数，并在防火墙层面限制对 PHP 页面的未授权访问。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "PHP base64_encode 及 GD 库整数溢出漏洞"
updated = "2026-06-16T22:03:06Z"

