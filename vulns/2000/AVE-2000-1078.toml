[basic]
description = "Microsoft SQL Server 2000 及 SQL Server Desktop Engine (MSDE) 中的 xp_printstatements 扩展存储过程存在缓冲区长度验证缺陷。攻击者在具备本地访问权限且无需认证的情况下，可向该函数传递超长参数，触发缓冲区溢出或不当解析，从而导致拒绝服务或以 SQL 服务进程权限执行任意命令。该漏洞影响所有未安装相应安全更新的 SQL Server 2000/MSDE 版本。"
published = "2001-01-09T05:00:00.000"
remediation = "立即升级至 Microsoft SQL Server 2005 或更高版本（推荐 SQL Server 2019/2022），SQL Server 2000 已终止支持无法获取官方补丁。临时缓解措施：通过 sp_dropextendedproc 'xp_printstatements' 删除或禁用该扩展存储过程，或在 SQL Server 配置中禁用未使用的 XP 组件。迁移时务必备份数据库并验证应用兼容性。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft SQL Server 扩展存储过程参数解析漏洞"
updated = "2026-06-16T21:53:07.200"

