[basic]
description = "Windows NT 4.0 Terminal Server 的 RegAPI.DLL 组件存在缓冲区溢出漏洞。远程攻击者可通过向终端服务器登录接口提交超长的用户名，触发 RegAPI.DLL 在处理登录请求时的栈缓冲区溢出，从而在目标系统上以系统权限执行任意命令。该漏洞无需身份认证即可远程利用，攻击复杂度低。受影响的系统为 Windows NT 4.0 Terminal Server 版本。Microsoft 已发布安全公告 MS00-087 提供修复补丁。"
published = "2001-01-09"
remediation = "立即安装 Microsoft 安全公告 MS00-087 提供的补丁（下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=74C3848B-8B3A-4151-B79D-F8FE3A2AE3AB）。如无法立即打补丁，在防火墙/路由器层面阻止外部对 TCP 端口 3389 的访问，仅允许已知可信 IP 建立终端服务连接。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows NT 4.0 Terminal Server 缓冲区溢出远程代码执行漏洞"
updated = "2001-01-09"

