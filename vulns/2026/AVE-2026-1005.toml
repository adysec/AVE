[basic]
description = "GIMP 在处理特制 PSD 文件时存在整数溢出漏洞。由于解析 PSD 文件过程中对用户提供的数据缺乏足够的边界验证，攻击者可触发整数溢出并在缓冲区分配前造成内存损坏，进而在当前进程上下文中执行任意代码。该漏洞影响安装了受影响版本 GIMP 的系统，攻击者需要诱使目标用户打开恶意 PSD 文件或访问包含恶意文件的网页才能成功利用。CVSS v3.1 评分为 7.8，危害等级为高。"
published = "2026-04-11T01:16:16Z"
remediation = "建议将 GIMP 升级至 2.8.22-1 或更高版本，以修复 PSD 文件解析中的整数溢出漏洞。Amazon Linux 2 用户可执行 `sudo yum update --advisories ALAS2GIMP-2026-014 gimp` 应用官方安全补丁；Ubuntu/Debian 用户可执行 `sudo apt-get update && sudo apt-get install --only-upgrade gimp`。如暂时无法升级，应避免打开来源不明的 PSD 文件，并在系统防火墙或邮件网关中拦截 .psd 附件下载，作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "GIMP PSD文件解析整数溢出远程代码执行漏洞"
updated = "2026-07-15T02:22:38Z"

