[basic]
description = "SunShop 购物车系统（SunShop Shopping Cart）1.5 至 2.5 版本存在跨站脚本（XSS）漏洞。其新客户注册功能未能对用户名、地址等注册表单字段进行充分的输入验证与输出编码，属于存储型 XSS（User-Embedded Scripting）。远程攻击者无需身份认证即可在注册字段中注入恶意脚本，当管理员在后台查看注册客户信息时脚本于管理员浏览器中执行，攻击者可借此窃取管理员会话 Cookie 并获取管理权限，进而完全控制该购物车系统。"
published = "2002-07-03T04:00:00Z"
remediation = "tags.<value>建议立即将 SunShop 购物车系统升级至 2.5 之后的修复版本（如 3.0 及以上版本），以修复新客户注册功能中缺少输入过滤的缺陷；如暂时无法升级，应在注册表单的姓名、地址、邮箱等字段对用户输入进行严格校验，过滤并去除 `<script>` 等危险 HTML 标签，并对输出进行 HTML 实体编码；同时关闭后台对注册字段 HTML 内容的解析支持，限制管理员的默认权限，防止存储型 XSS 窃取会话导致权限提升。此外，可在 Web 层部署应用防火墙对请求负载中的脚本特征进行拦截作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Turnkey Solutions SunShop 购物车系统跨站脚本漏洞"
updated = "2026-06-16T21:57:39Z"

