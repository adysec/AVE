[basic]
description = "Koha 开源图书馆管理系统 3.14.x 至 3.20.1 版本存在目录遍历漏洞（CWE-22），远程攻击者无需身份认证即可通过向 `/cgi-bin/koha/svc/virtualshelves/search` 或 `/cgi-bin/koha/svc/members/search` 接口的 `template_path` 参数中注入 `..%2f`（URL 编码的路径穿越序列）绕过目录访问限制，实现读取服务器上任意文件，导致敏感配置信息和数据库凭证泄露。受影响的版本包括 3.14.16 之前、3.16.12 之前、3.18.08 之前及 3.20.1 之前的所有版本。"
published = "2018-10-19T00:00:00Z"
remediation = "立即将 Koha 升级至 3.14.16、3.16.12、3.18.08 或 3.20.1 及以上版本。如无法升级，在 Web 服务器（Apache/Nginx）层面配置规则拦截 URL 中 template_path 参数包含 ..%2f 或 %2e%2e%2f 的请求，同时限制 /cgi-bin/koha/svc/ 路径仅允许授权用户访问。"
score = 5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Koha 3.20.1 目录遍历任意文件读取漏洞"
updated = "2018-10-19T00:00:00Z"

