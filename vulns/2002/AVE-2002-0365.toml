[basic]
description = "MySQL 数据库的 COM_CHANGE_USER 命令在处理认证切换响应时存在内存损坏漏洞，未经身份认证的远程攻击者可通过向目标 MySQL 服务发送超长响应数据包触发缓冲区溢出，进而实现远程代码执行。该漏洞影响 MySQL 3.x 早于 3.23.54 版本以及 4.x 至 4.0.6 版本，CVSS 评分 7.5。攻击者无需预先获取数据库凭据，只需网络可达目标数据库服务即可发起利用，可能导致数据库服务器完全被控或敏感数据泄露。"
published = "2002-12-23T05:00:00.000"
remediation = "将 MySQL 升级至安全版本：3.x 系列升级至 3.23.54 或更高版本，4.x 系列升级至 4.0.7 或更高版本，以修复 COM_CHANGE_USER 命令中因缺乏边界检查导致的内存损坏漏洞。若暂时无法升级，应在防火墙或访问控制层面限制对 MySQL 3306 端口的访问，仅允许可信来源连接，并避免使用具有高权限的数据库账户。Linux 发行版用户可安装对应安全更新，如 Red Hat RHSA-2002:288、Debian DSA-212 及 Mandrake MDKSA-2002:087 提供的补丁包。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "MySQL 3.23.x/4.0.x COM_CHANGE_USER 远程代码执行漏洞"
updated = "2026-06-16T21:59:12.440"

