[basic]
description = "WordPress GraceMedia Media Player 插件 1.0 版本存在本地文件包含漏洞，其 `templates/files/ajax_controller.php` 文件中使用未过滤的 `$_GET['cfg']` 参数直接调用 `require_once()`，攻击者可通过在请求参数中注入路径遍历序列（如 `../../../../etc/passwd`）读取服务器上的任意敏感文件。该漏洞影响使用该插件的所有 WordPress 站点，且无需身份认证即可远程利用。成功利用可导致服务器配置文件、数据库凭证等敏感信息泄露，进而引发数据泄漏、网站被篡改乃至服务器完全被控制等严重后果。该漏洞 CVSS 评分为 9.8，危害等级为严重。"
published = "2019-05-13T22:29:01Z"
remediation = '立即从 WordPress 管理后台卸载并删除 GraceMedia Media Player 插件（该插件已于 2019 年 3 月 17 日因安全漏洞被官方下架，无可用修复版本）。如确需媒体播放功能，应安装替代插件（如 MediaElement.js、Compact WP Audio Player 等）。临时缓解措施包括：在 Web 应用防火墙（WAF）中配置规则拦截包含 `../` 或 `..\` 的 `cfg` 参数请求，或通过 Nginx/Apache 配置文件拦截对 `gracemedia-media-player/templates/files/ajax_controller.php` 的直接访问。'
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress GraceMedia Media Player 插件本地文件包含漏洞"
updated = "2026-06-17T02:44:03Z"

