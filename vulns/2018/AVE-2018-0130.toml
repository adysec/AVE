[basic]
description = "WPML（sitepress-multilingual-cms）插件 3.6.3 及之前版本中，process_forms 功能对 theme-localization.php 页面的 locale_file_name_ 参数（如 locale_file_name_en）缺乏充分的输入过滤与转义，导致存在反射型跨站脚本漏洞。已登录认证的攻击者可构造恶意 URL 诱使管理员点击，在目标浏览器中执行任意 HTML 或 JavaScript 代码，窃取会话凭证或执行恶意操作。该漏洞影响 WordPress 站点上所有使用 WPML 插件的环境，CVSS 评分 6.1，危害等级中危。"
published = "2018-10-08T22:29:00Z"
remediation = "立即将 WPML（sitepress-multilingual-cms）插件升级到 4.0 或更高版本。该漏洞在 3.6.3 及之前版本中存在，升级到 4.0 后 locale_file_name_ 参数已得到正确转义处理。由于该插件已从 WordPress.org 官方仓库下架，需从 wpml.org 官网获取最新版本。如无法立即升级，可在 WordPress 后台移除 wp-admin/admin.php 中 theme-localization.php 页面的访问权限，或通过 .htaccess 限制对该页面的访问。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress WPML 插件跨站脚本漏洞"
updated = "2026-06-17T01:46:44Z"

