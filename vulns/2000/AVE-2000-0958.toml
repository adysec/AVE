[basic]
description = "Auction Weaver 1.0至1.04版本的表单字段名验证存在路径遍历漏洞。远程攻击者无需身份认证即可通过向表单字段提交包含`..`（点点）序列的特制请求，突破目录限制实现任意文件与目录删除。该漏洞利用方式简单，仅需构造恶意HTTP请求即可触发，可导致目标网站数据丢失或服务不可用。"
published = "2000-12-19T05:00:00.000"
remediation = "立即停止使用 Auction Weaver 1.0-1.04，将网站迁移至受支持的现代拍卖系统。若短期无法迁移，应对 Web 服务器配置访问控制规则，限制对 Auction Weaver 脚本目录的外部访问，并在 Web 应用防火墙（WAF）中启用路径遍历防护规则拦截包含 `..` 的请求参数。同时对服务器上所有用户上传目录设置只读权限，防止恶意删除操作生效。迁移前务必备份所有数据。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "CGI Script Center Auction Weaver 目录遍历任意文件删除漏洞"
updated = "2026-06-16T21:52:31.680"

