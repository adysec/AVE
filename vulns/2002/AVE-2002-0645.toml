[basic]
description = "tags.<value>HP Tru64 UNIX 5.1a、5.1、5.0a、4.0g 和 4.0f 版本中的 su、chsh、passwd、chfn、dxchpwd 等多个系统工具及 C 标准库 libc 存在缓冲区溢出漏洞。本地低权限用户可通过环境变量触发堆栈溢出，进而获取 root 权限。该漏洞影响 Tru64 UNIX 4.0f 至 5.1a 等多个版本，CVSS 评分 7.2。攻击者需在目标系统上拥有本地账户访问权限，通过向受影响的程序传递特制环境变量即可实现权限提升。"
published = "2002-08-01T04:00:00.000"
remediation = "立即应用 HP/Compaq 官方安全补丁：Tru64 UNIX 5.1A 安装 T64V51AB2-C0041400-14950，5.1 安装 T64V51B19-C0136900-14951，5.0A 安装 T64V50AB17-C0018404-14949，4.0G 安装 T64V40GB17-C0010404-14948，4.0F 安装 DUV40FB18-C0067403-14947，补丁可从 ftp.support.compaq.com 下载。若补丁不可用，升级到 Tru64 UNIX 5.1B 或更高版本。作为临时缓解，执行 sysconfig -q proc executable_stack 检查可执行栈状态，若启用则通过 sysconfig -s proc executable_stack=0 禁用可执行栈，并严格限制本地非授权用户登录权限，仅允许可信账户访问 su、chsh、passwd、chfn、dxchpwd 等敏感命令。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "HP Tru64 UNIX su 本地堆栈溢出漏洞"
updated = "2026-06-16T21:59:39.770"

