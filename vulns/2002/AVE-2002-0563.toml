[basic]
description = "QNX Neutrino RTOS 6.2.0 的应用程序打包器（Application Packager）在提升权限状态下运行时，通过 PATH 环境变量查找并执行 cp 程序，存在非显式路径执行漏洞。本地攻击者可通过修改 PATH 环境变量，将其指向恶意的 cp 程序，从而在特权进程上下文中执行任意代码，实现本地权限提升。该漏洞影响 QNX Neutrino RTOS 6.2.0 版本，CVSS 评分 7.2，危害等级高，攻击者需具备本地系统访问权限。"
published = "2002-11-12T05:00:00.000"
remediation = "升级 QNX Neutrino RTOS 至 6.2.1 或更高版本，该版本已修复 packager 未使用完整路径调用外部程序的问题。如无法立即升级，可执行 `chmod -s $(which packager)` 移除 packager 二进制文件的 setuid 位，以消除本地提权风险。同时限制非授权用户对系统的本地访问权限，降低内部威胁。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "QNX Neutrino RTOS 应用程序打包器路径劫持权限提升漏洞"
updated = "2026-06-16T21:58:59.427"

