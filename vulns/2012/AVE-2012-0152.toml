[basic]
description = "Adobe Flash Player 在处理 MP4 文件格式时存在内存破坏漏洞。攻击者可通过构造特制的 MP4 文件，诱导用户使用受影响的 Flash Player 打开，触发内存越界写入，导致远程代码执行或拒绝服务。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上的 Flash Player 10.3.183.15 之前版本及 11.x 系列 11.1.102.62 之前版本，CVSS 评分 9.3，危害等级严重。Adobe 已在 2012 年 2 月安全更新中修复此漏洞。"
published = "2012-02-16T19:55:01Z"
remediation = "将 Adobe Flash Player 升级至 10.3.183.15 或 11.1.102.62 及以上版本（Windows/Mac/Linux/Solaris），Android 2.x/3.x 升级至 11.1.111.6，Android 4.x 升级至 11.1.115.6。如无法升级，可在浏览器中禁用 Flash 插件或卸载 Flash Player 以彻底消除风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player MP4解析内存破坏漏洞"
updated = "2026-06-16T23:38:11Z"

