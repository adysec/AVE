[basic]
description = "Windows 电话服务（Telephony Service）在处理特定远程过程调用（RPC）请求时存在堆缓冲区溢出漏洞（CWE-122）。未经身份认证的远程攻击者可通过向目标系统发送特制的 RPC 报文触发该漏洞，成功利用可在目标系统上以 SYSTEM 权限执行任意代码。攻击复杂度低，但需要用户交互（如诱导用户访问恶意服务器），影响 Windows 10/11 及 Windows Server 多个版本。CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:39.157"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新 (KB5051987)，或通过 Windows Update 自动获取更新。对于无法立即打补丁的系统，可在组策略中禁用 TAPI 服务 (Telephony) 并限制对 RPC 端口的网络访问作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:43:17.613"

