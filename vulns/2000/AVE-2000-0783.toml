[basic]
description = "Microsoft SQL Server 7.0/2000 及 MSDE 1.0/2000 中的 xp_peekqueue 扩展存储过程存在缓冲区溢出漏洞。该函数在调用 SQL Server API 中的 srv_paraminfo 函数前未正确限制缓冲区长度，导致攻击者可通过向 xp_peekqueue 传入特制参数触发缓冲区溢出，进而造成拒绝服务或执行任意命令。攻击者需要拥有本地登录权限才能利用此漏洞，无法远程直接利用。Microsoft 至今未发布官方补丁，建议禁用不必要的扩展存储过程或限制相关权限以降低风险。"
published = "2001-01-09T05:00:00Z"
remediation = "安装 Microsoft 安全公告 MS00-092 提供的更新补丁，或升级至 SQL Server 2000 Service Pack 2 及以上版本。如无法立即打补丁，可禁用不必要的扩展存储过程 xp_peekqueue 作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft SQL Server 2000/MSDE xp_peekqueue 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:07Z"

