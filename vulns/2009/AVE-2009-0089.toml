[basic]
description = "Apple iPhone OS 3.0 及 3.0.1 版本的 UIKit 组件存在密码信息泄露漏洞。当用户在密码输入界面删除字符并撤销删除操作时，被删除的字符会短暂显示在屏幕上。物理上接近设备的攻击者可以通过观察用户此操作过程来获取密码字符，从而窃取设备解锁密码。该漏洞影响 iPhone 和 iPod touch 设备，CVSS 评分较低但存在实际信息泄露风险。"
published = "2009-09-10T21:30:01Z"
remediation = "升级 iPhone OS 至 3.1 或更高版本以修复此漏洞，该版本已修复密码撤销输入时字符短暂可见的问题。如无法立即升级，建议在公共场合使用设备时避免输入敏感密码，或遮挡屏幕防止旁人窥视。"
score = 2.1
severity = "LOW"
sources = ["tenable"]
title = "Apple iPhone OS 密码信息泄露漏洞"
updated = "2026-06-16T23:10:14Z"

