[basic]
description = "Linux内核中Marvell Prestera MVPP2网络驱动存在竞争条件漏洞，其解析器TCAM/SRAM内存及影子副本在并发修改时未受原子操作保护。TCAM与SRAM表通过索引寄存器间接访问，多核CPU同时执行mvpp2_set_rx_mode()函数时可能发生写入跨越多个行或空闲行重复分配的TOCTOU错误，导致TCAM内存损坏。该漏洞影响搭载Marvell Prestera网络设备的Linux系统，需要本地低权限访问权限并在多核环境下触发并发操作。成功利用可破坏MVPP2_PE_MAC_UC_PROMISCUOUS条目，使分类器单元丢弃所有传入单播流量，造成网络拒绝服务，表现为rx_classifier_drops计数器异常增长。"
published = "2025-04-16T15:15:59Z"
remediation = "升级 Linux 内核至已修复该漏洞的版本。具体修复版本包括：Debian 12 (bookworm) 升级到 linux-image 6.1.135-1 或更高版本（参考 DSA-5907-1）；Debian 11 (bullseye) 通过 Debian LTS 升级到 linux-6.1 6.1.137-1~deb11u1（参考 DLA-4193-1）；Ubuntu 24.04 LTS 升级到 6.8.0-86.87，Ubuntu 22.04 LTS 升级到 5.15.0-142.152 或 6.8.0-86.87~22.04.1，Ubuntu 20.04 LTS 升级到 5.15.0-142.152~20.04.1（需 Ubuntu Pro）；SUSE Linux Enterprise 15 SP6 应用安全更新 SUSE-SU-2025:01964-1。可通过各发行版包管理器执行升级，例如 Debian/Ubuntu 执行 apt update && apt upgrade linux-image，随后重启系统加载新内核。若当前环境存在无法立即升级内核的特殊情况，可临时限制对 mvpp2 网络接口的并发访问权限，降低多核同时触发 TCAM 写入冲突的风险。修复补丁的官方提交记录为 96844075226b，已在 Linux 6.15-rc1 及后续稳定版本中合入。"
score = 4.7
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux内核 mvpp2网络驱动 竞争条件TCAM内存腐败漏洞"
updated = "2026-07-14T13:17:30Z"

