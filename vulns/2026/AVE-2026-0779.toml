[basic]
description = "veraPDF 验证模型存在 XML 外部实体注入（XXE）漏洞（CWE-611），漏洞位于 validation-model 模块的 DictionaryKeysHelper.java 文件中 getRichTextStringOrStreamEntryStringRepresentation() 方法内。由于 DocumentBuilderFactory 使用默认配置，未禁用 DOCTYPE 声明和外部实体解析，远程攻击者只需向目标系统提交一个包含恶意富文本（/RC 或 /RV）条目的特制 PDF 文件，即可在解析时触发外部实体扩展，将服务器本地文件内容反射到验证报告中，导致任意文件读取和服务器端请求伪造（SSRF）。该漏洞影响 veraPDF-validation 1.25.73 至 1.30.2 及 1.31.71 之前的所有版本，CVSS 评分 8.7，危害等级高。官方已在 1.30.2 和 1.31.71 版本中修复。"
published = "2026-07-29T16:17:53Z"
remediation = "立即将 veraPDF-validation 升级至 1.30.2 或 1.31.71 及以上版本。如无法升级，可参考 OWASP XXE Prevention Cheat Sheet，在 DictionaryKeysHelper.java 的 DocumentBuilderFactory 中显式设置 FEATURE_SECURE_PROCESSING=true、disallow-doctype-decl=true 并禁用外部实体解析（http://apache.org/xml/features/disallow-doctype-decl 和 http://apache.org/xml/features/nonvalidating/load-external-dtd），同时设置自定义 EntityResolver 返回空内容。"
score = 8.7
severity = "HIGH"
sources = ["ghsa"]
title = "veraPDF veraPDF-validation XML外部实体注入漏洞"
updated = "2026-07-30T19:23:14Z"

