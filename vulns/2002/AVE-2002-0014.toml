[basic]
description = "OpenSSL 0.9.6d及之前版本、0.9.7-beta2及之前版本的ASN.1库存在拒绝服务漏洞。远程攻击者可通过向目标系统发送特制的无效编码数据触发该漏洞，导致OpenSSL服务进程崩溃，造成拒绝服务。该漏洞影响大量使用OpenSSL的服务器和应用，攻击者无需身份认证即可远程触发，攻击成本低。RedHat将该漏洞评为重要(important)级别。厂商已发布更新修复此漏洞。"
published = "2002-08-12T04:00:00.000"
remediation = "升级 OpenSSL 至 0.9.6e 或 0.9.7-beta3 及以上版本。RedHat 用户可参考 RHSA-2002:160/RHSA-2002:161/RHSA-2002:164 安装对应补丁包。Debian 用户可参考 DSA-136 更新。无法立即升级时，可在网络边界过滤异常 ASN.1 编码流量，或限制 OpenSSL 服务端口（443/636等）仅对可信来源开放。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "OpenSSL ASN.1 库拒绝服务漏洞"
updated = "2026-06-16T21:57:53.240"

