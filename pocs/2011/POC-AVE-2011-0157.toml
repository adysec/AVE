[info]
author = "ave"
description = "WebKit 引擎在处理特定网页内容时存在内存破坏漏洞，未经身份认证的远程攻击者可通过诱导用户访问恶意网页利用该漏洞在受害者设备上执行任意代码或导致拒绝服务。该漏洞影响 iOS 5.1 之前版本及 iTunes 10.6 之前版本的浏览器组件。"
id = "POC-AVE-2011-0157"
name = "Apple WebKit 内存损坏远程代码执行漏洞 PoC"
severity = "critical"
tags = ["ave-2011-0157"]
vuln_id = [
    "CVE-2011-2871",
    "AVE-2011-0157",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc/test.html"
protocol = "http"

[poc.requests.headers]
User-Agent = "Mozilla/5.0 (iPhone; CPU iPhone OS 5_0 like Mac OS X) AppleWebKit/534.46 (KHTML, like Gecko) Version/5.1 Mobile/9A334 Safari/7534.48.3"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["webkit"]
