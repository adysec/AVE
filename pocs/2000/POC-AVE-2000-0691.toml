[info]
author = "ave"
description = "验证Cisco Catalyst 3500 XL交换机Web配置界面的/exec/目录是否可被未认证访问，若返回命令行执行页面或命令执行结果，则存在任意命令执行漏洞"
id = "POC-AVE-2000-0691"
name = "CVE-2000-0945 PoC"
severity = "critical"
tags = ["ave-2000-0691"]
vuln_id = [
    "CVE-2000-0945",
    "AVE-2000-0691",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/exec/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "exec",
    "command",
    "shell",
]
