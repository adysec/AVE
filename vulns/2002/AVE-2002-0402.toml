[basic]
description = "vqSoft vqServer 1.9.x 的演示脚本（如 respond.pl）存在跨站脚本（XSS）漏洞。远程攻击者可通过向演示脚本的参数中注入恶意脚本代码，诱使用户点击特制链接后，在用户浏览器中执行任意脚本，导致敏感信息泄露、会话劫持等危害。攻击无需身份认证，利用方式简单，影响 vqServer 1.9、1.9.30、1.9.47 及 1.9.55 版本。"
published = "2002-08-12T04:00:00Z"
remediation = "建议立即删除或禁用 vqServer 自带的演示 CGI 脚本目录（如 `/cgi/vq/demos/`），特别是 `respond.pl` 等未对用户输入做过滤的脚本。如业务需要保留该功能，应在 Web 服务器层面（如反向代理或防火墙）对 CGI 参数进行严格的输入过滤和输出编码，防止恶意脚本注入。由于 vqServer 已停止维护多年，建议迁移至仍受支持的 Web 服务器（如 Apache、Nginx）并重写相关功能。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "vqSoft vqServer 演示脚本跨站脚本漏洞"
updated = "2026-06-16T21:58:01Z"

