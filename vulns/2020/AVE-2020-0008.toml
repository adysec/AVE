[basic]
description = "Microsoft .NET Framework 远程代码执行注入漏洞（CVE-2020-0646）存在于 SharePoint 工作流功能中。当 .NET Framework 未能正确验证通过 `webpartpages.asmx` 服务的 `ValidateWorkflowMarkupAndCreateSupportObjects` SOAP 接口提交的 XOML（XAML Object Model）工作流标记输入时，攻击者可通过构造恶意的 XOML 载荷，利用 `CallExternalMethodActivity` 的 `MethodName` 属性注入代码执行原语，从而在服务器上执行任意系统命令。该漏洞影响安装了 .NET Framework 3.0/3.5/4.x 各版本的 Windows 7、8.1、10 及 Windows Server 2008 至 2019 等系统，CVSS v3.1 评分高达 9.8（严重）。攻击者无需身份验证即可通过网络向 SharePoint 站点发送特制的 SOAP 请求触发漏洞，实现远程代码执行并完全控制目标服务器。Microsoft 已于 2020 年 2 月安全更新中修复此漏洞，CISA 亦将其列入已知被利用漏洞目录。"
published = "2020-01-14T23:15:33Z"
remediation = "立即安装 Microsoft 2020 年 1 月安全更新，修复 .NET Framework 远程代码执行漏洞（CVE-2020-0646）。受影响系统请根据版本安装对应累积更新：.NET Framework 4.8 安装 KB4534132，4.7.2 安装 KB4534276，4.6.2/4.7/4.7.1 安装 KB4534273，3.5/4.5.2 安装 KB4534276；或通过 Windows Update 自动更新至最新补丁。SharePoint 环境还需同步应用 SharePoint 安全更新（KB4490031）。临时缓解措施：在防火墙层限制对 SharePoint/_layouts/ 路径的外部访问，禁用不必要的 Workflow Manager 服务，并将 .NET Framework 应用程序的 AppPool 权限降级为最低权限运行，同时启用 IIS 请求筛选以拦截含危险 XOML 标记的入站请求。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Microsoft SharePoint 远程代码执行漏洞"
updated = "2026-06-17T02:46:15Z"

