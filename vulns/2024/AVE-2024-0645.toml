[basic]
description = "Linux 内核 SCTP 协议实现中的 sctp_association_init() 函数存在整数溢出漏洞。当系统管理员将 net.sctp.max_autoclose 参数设置为 UINT_MAX 时，该函数中的自动关闭超时计算会触发整数溢出，导致内核崩溃。具有低权限的本地攻击者可利用此漏洞造成拒绝服务（系统崩溃），影响可用性。该漏洞影响所有使用受影响 Linux 内核版本的发行版，包括 Debian 11、Ubuntu 20.04/24.04 LTS 等。"
published = "2025-01-21T12:15:27Z"
remediation = "升级 Linux 内核至以下已修复版本：5.4.289、5.10.233、5.15.176、6.1.124、6.6.70、6.12.9 及以上。Debian 11 用户请安装 DLA-4075-1 安全更新；Ubuntu 24.04 用户请安装 USN-7381-1 更新。如无法立即升级，可通过 sysctl 设置 net.sctp.max_autoclose=0 禁用 SCTP 自动关闭功能作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Kernel SCTP 整数溢出漏洞"
updated = "2026-06-17T08:14:16Z"

