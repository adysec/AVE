[basic]
description = "PlanetIntra 2.5 的 pi 程序存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过发送特制数据触发该溢出，进而在目标系统上执行任意命令。该漏洞影响运行 PlanetIntra 2.5 版本的服务器，攻击者无需认证即可通过网络远程利用，CVSS 评分为满分 10.0，危害等级严重。"
published = "2001-05-03T04:00:00Z"
remediation = "建议立即应用 SAFER Security Bulletin 010125.EXP.1.12 提供的官方补丁修复 PlanetIntra 2.5 `pi` 程序的缓冲区溢出漏洞。若厂商已发布更新版本，请升级到修复后的版本。如无法立即获取补丁，应在防火墙或边界设备上限制对 `pi` 程序端口的访问，仅允许可信 IP 连接，并禁用不必要的远程访问功能作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "PlanetIntra pi 程序 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:53Z"

