[basic]
description = "Qualcomm Snapdragon 系列芯片的 Adreno GPU 驱动在处理多进程同时访问的内存映射时存在释放后使用漏洞。本地低权限攻击者可通过在受影响设备上执行特制应用程序触发该漏洞，在无需用户交互的情况下实现权限提升或执行任意代码，从而完全控制设备。该漏洞影响 Snapdragon Auto、Compute、Connectivity、Consumer IOT、Industrial IOT、Mobile、Voice & Music 及 Wearables 等多款产品，CVSS 评分 8.4，危害等级高。"
published = "2021-05-07T09:15:08.243"
remediation = '受影响设备应立即升级至 Android 2021 年 5 月安全补丁级别（2021-05-01 SPL）或更高版本，该补丁包含 Qualcomm 2021 年 5 月安全公告中针对 Adreno GPU 驱动程序的修复（patch CL: d236d315145f8250523ce9e14897d62e5d6639fc 与 ec3c8cf016991818ca286c4fd92255393c211405），修复了 kgsl_gpumem_vm_close 中多进程共享映射的 use-after-free 问题。Android 终端用户可通过系统设置中的"系统更新"或 OTA 方式安装最新安全更新；设备厂商应在固件中集成 Qualcomm May-2021-Bulletin 补丁并推送至下游设备。如暂时无法完成系统升级，建议限制设备物理接触权限，避免运行不受信任的应用程序，并启用 SELinux 强制模式以降低利用风险。'
score = 8.4
severity = "HIGH"
sources = ["kev"]
title = "高通 Snapdragon Adreno GPU 内存映射释放后使用漏洞"
updated = "2026-06-17T03:32:47.910"

