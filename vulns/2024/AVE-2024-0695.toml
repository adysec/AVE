[basic]
description = "Linux 内核 JFS 文件系统在 extAlloc 和 extRecord 函数中调用 txBeginAnon 前缺少只读挂载检查，具有本地低权限的攻击者可通过对只读挂载的 JFS 文件系统执行写操作触发该漏洞，导致内核崩溃引发拒绝服务。该漏洞影响各 Linux 发行版内核，CVSS 评分 5.5，危害等级中等。各 Linux 发行版已发布安全更新修复此问题。"
published = "2025-04-16T15:15:53Z"
remediation = "立即更新 Linux 内核至包含该补丁的版本：主线内核升级至 6.14 及以上版本；Ubuntu 25.04 用户升级至 linux-image-6.14.0-22-generic (6.14.0-22.22) 或更高版本，运行 `sudo apt update && sudo apt upgrade` 后重启系统。如无法立即升级，避免在只读挂载的 JFS 文件系统上执行写操作，或改用其他文件系统（如 ext4）作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux JFS 文件系统只读检查缺失导致拒绝服务漏洞"
updated = "2026-06-17T08:14:37Z"

