[basic]
description = "WebKit 引擎在处理特定网页内容时存在内存破坏漏洞。该漏洞影响 iOS 5.1 之前版本以及 iTunes 10.6 之前版本。远程攻击者可通过诱导用户访问一个精心构造的恶意网站，触发内存损坏，从而在目标设备上执行任意代码或导致应用程序崩溃（拒绝服务）。攻击条件为用户使用受影响的浏览器访问攻击者控制的恶意页面，利用方式为通过恶意脚本触发 WebKit 的内存管理缺陷。"
published = "2012-03-08T22:55:01Z"
remediation = "建议将 Safari 浏览器升级至 5.1.4 或更高版本，同时将 iTunes 更新至 10.6 或更高版本。对于 iOS 用户，请确保系统版本升级至 iOS 5.1 及以上，以安装 WebKit 内存破坏漏洞的正式补丁。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:32:09Z"

