[basic]
description = "OpenTelemetry Java Instrumentation 的 RMI 上下文传播载荷读取器在解析时仅限制了上下文条目数量，但未限制从数据流中读取的字符串总大小。攻击者若能访问已启用 RMI 插桩的 Java 虚拟机上的 RMI 端点，可发送超大的上下文传播载荷，导致 JVM 在读取载荷时分配过量内存，最终引发拒绝服务。该漏洞仅影响启用了 RMI 插桩且 RMI 端点可网络访问的部署环境，影响版本为 2.27.0 之前的所有版本。"
published = "2026-07-01T22:16:50Z"
remediation = "立即升级 OpenTelemetry Java Instrumentation 至 2.27.0 或更高版本。如无法立即升级，可临时禁用 RMI 插桩（`-Dotel.instrumentation.rmi-enabled=false`），或在网络层面限制对 RMI 端点的访问，仅允许受信来源连接。"
score = 5.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "OpenTelemetry Java Instrumentation RMI上下文传播拒绝服务漏洞"
updated = "2026-07-06T16:58:10Z"

