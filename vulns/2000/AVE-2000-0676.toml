[basic]
description = 'Armada Design Master Index 1.0 的 search.cgi CGI 脚本存在目录遍历漏洞，远程攻击者无需身份认证即可通过在 catigory 参数中注入 "../" 路径遍历序列，绕过访问限制读取服务器上的任意文件（如 /etc/passwd 等敏感文件）。该漏洞影响 Armada Master Index 所有版本，已有公开的 Exploit-DB PoC 利用代码，对系统机密性构成严重威胁。'
published = "2000-12-19"
remediation = "该产品已停止维护，无官方补丁。建议立即删除或禁用 `/cgi-bin/search/search.cgi` 脚本，或通过 Web 服务器（如 Apache）配置访问控制，仅允许可信 IP 访问该路径。同时可在 `search.cgi` 中对 `catigory` 参数做路径规范化过滤，拒绝包含 `../` 的输入。作为替代方案，可迁移至其他仍在维护的搜索程序。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Armada Design Master Index 1.0 目录遍历漏洞"
updated = "2000-12-19"

