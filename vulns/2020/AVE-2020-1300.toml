[basic]
description = "Sophos Cyberoam OS 的 WebAdmin 管理界面存在 SQL 注入漏洞，影响截至 2020 年 12 月 4 日的所有版本。未经身份认证的远程攻击者可通过向 WebAdmin 发送特制构造的 SQL 查询语句，绕过身份验证并执行任意 SQL 命令，从而获取数据库中存储的敏感信息，甚至可能通过堆叠查询进一步获取服务器权限。该漏洞利用网络可达性即可触发，无需用户交互或凭据，攻击复杂度低，危害严重。 Sophos 已发布安全公告及修复补丁，建议受影响用户尽快升级至最新版本以消除风险。"
published = "2020-12-11T17:15:13.480"
remediation = "建议立即停止使用 Sophos Cyberoam OS（已停止维护 EoL/EoS）并更换为受支持的防火墙产品。如暂时无法替换，必须在防火墙层面限制 WebAdmin 管理界面仅允许受信任 IP 访问，并在边界部署 WAF 拦截 SQL 注入攻击载荷。受影响版本为 2020-12-04 及之前，若仍有后续固件请升级至最新版本。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Sophos Cyberoam OS WebAdmin 远程SQL注入漏洞"
updated = "2026-06-17T03:11:27.680"

