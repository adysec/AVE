[basic]
description = "SmartFTP Daemon 0.2 存在目录遍历访问控制漏洞。本地攻击者可通过上传特制的用户配置文件，并在文件名中使用 `..`（点点）路径遍历攻击，绕过文件访问限制，从而访问或读取服务器上的任意文件。该漏洞仅影响 SmartFTP Daemon 0.2 版本，攻击者需具备本地访问权限，利用难度较低，但危害仅限于敏感信息泄露，无法实现代码执行或权限提升。"
published = "2000-06-13T04:00:00Z"
remediation = "SmartFTP Daemon 0.2 已停止维护多年，官方不再提供安全更新。建议立即卸载 SmartFTP Daemon 0.2，升级至受支持的 FTP 服务器软件（如 vsftpd、ProFTPD 或 FileZilla Server 最新版）。如无法立即替换，可在服务器本地限制 SmartFTP Daemon 进程的文件系统访问权限，禁止非授权用户上传配置文件，并监控 .. 路径穿越攻击行为。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "SmartFTP SmartFTP Daemon 0.2 目录遍历漏洞"
updated = "2026-06-16T21:52:00Z"

