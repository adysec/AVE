[basic]
description = "Adobe Flash Player 9.0.124.0 及更早版本在使用 Mozilla 浏览器时，对 jar: URL 的解释处理存在不当行为。攻击者可通过构造恶意的 jar: URL 链接并嵌入网页中的 Flash 内容，诱导用户访问受影响的 Flash 页面，从而绕过同源策略获取敏感信息，例如本地文件系统中的数据或跨域请求内容。该漏洞仅影响 Mozilla 浏览器（如 Firefox）中的 Flash Player 插件，不影响 ActiveX 控件版本。攻击者需要诱导用户主动访问包含恶意 Flash 内容的网页才能成功利用。CVSS 评分 4.3，危害等级中危。Adobe 已于 2008 年 11 月发布 APSB08-20 安全公告修复此问题，受影响用户应升级 Flash Player 至最新版本。"
published = "2008-11-10T14:12:55Z"
remediation = "建议立即升级 Adobe Flash Player 至 10.0.12.36 或 9.0.151.0 及更高版本，具体操作：Windows 用户访问 Adobe 官网下载最新 Flash Player 安装程序并运行安装；Mac 用户通过系统软件更新或 Adobe 官网获取更新；Linux 用户应更新发行版软件源中的 flashplugin-nonfree 包至已包含安全修复的版本。如无法立即升级，可暂时禁用 Mozilla 浏览器中的 Flash Player 插件作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Adobe Flash Player Mozilla 浏览器 jar: URL 信息泄露漏洞"
updated = "2026-06-16T22:58:36Z"

