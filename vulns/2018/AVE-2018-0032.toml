[basic]
description = "Dolibarr 在 7.0.2 版本之前存在跨站脚本（XSS）漏洞。该漏洞源于 `adherents/cartes/carte.php` 页面对 `foruserlogin` 参数的输入校验不足，导致远程攻击者可以通过构造特制的恶意 URL，在受害者的浏览器中注入并执行任意 JavaScript 脚本或 HTML 代码。攻击者可利用此漏洞窃取用户会话 Cookie、进行页面篡改或实施钓鱼攻击。该漏洞影响所有低于 7.0.2 的 Dolibarr 版本，攻击条件为诱导用户访问含有恶意参数的链接。"
published = "2018-05-22T20:29:01Z"
remediation = "建议立即将 Dolibarr 升级到 7.0.2 或更高版本。若无法立即升级，可通过在 Web 应用防火墙（WAF）中配置过滤规则，拦截请求路径包含 adherents/cartes/carte.php 且 foruserlogin 参数中含有 HTML 标签或脚本字符的恶意请求。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Dolibarr 跨站脚本漏洞"
updated = "2026-06-17T01:33:29Z"

