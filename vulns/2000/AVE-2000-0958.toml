[basic]
description = 'Auction Weaver 1.0至1.04版本存在路径遍历漏洞，由于未对表单字段名称进行充分验证，远程攻击者可通过向CGI脚本提交包含".."（点点）序列的特制请求，利用目录遍历技术删除服务器上的任意文件及目录。该漏洞无需身份认证即可远程利用，攻击复杂度低，可导致目标系统文件完整性受损及服务不可用。厂商未提供官方补丁，建议升级或迁移至其他产品。'
published = "2000-12-19T05:00:00Z"
remediation = "立即停用 Auction Weaver 1.0~1.04 版本，该产品已停止维护无官方补丁。作为替代方案，迁移至其他仍在维护的拍卖系统。如无法立即替换，在 Web 服务器层面配置 URL 重写规则，拦截包含 `..` 或路径遍历特征的请求；同时限制 Web 服务器运行账户对文件系统的写入权限，仅允许写入必要目录，防止任意文件删除。作为临时缓解措施，可移除 Auction Weaver CGI 脚本的执行权限。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "CGI Script Center Auction Weaver 路径遍历任意文件删除漏洞"
updated = "2026-06-16T21:52:31Z"

