[basic]
description = "Flyto2 Core 自动化与 AI 代理工作流执行内核的 HTTP 模块（http.get、http.request、http.batch）存在服务器端请求伪造（SSRF）漏洞。这些模块仅对初始 URL 进行 SSRF 安全检查，但在使用 aiohttp 默认的 allow_redirects=True 跟随重定向时，未对每个跳转的 Location 进行重新验证。攻击者可托管一个公共 URL 并使其 302 重定向到内部地址（如云元数据服务、内网服务），从而绕过 SSRF 防护读取内部响应内容，导致敏感信息泄露。该漏洞影响 2.26.7 之前的所有版本，CVSS 评分 8.5，危害等级高。攻击者需具备低权限即可远程利用，无需用户交互。"
published = "2026-07-29T19:16:51Z"
remediation = "立即升级 Flyto2 Core 至 v2.26.7 或更高版本，该版本在 commit 0a0a528 中修复了 SSRF 重定向绕过问题。如无法立即升级，可在调用 http.get/http.request/http.batch 时手动设置 allow_redirects=False，并对每个 Location 重定向目标调用 validate_url_with_env_config 重新校验后再跟进。"
score = 8.5
severity = "HIGH"
sources = ["ghsa"]
title = "Flyto2 Core flyto-core HTTP重定向SSRF漏洞"
updated = "2026-07-30T16:41:25Z"

