[basic]
description = "ASUS Business Manager 存在外部控制文件名或路径漏洞（CWE-73），本地低权限用户可通过篡改进程间通信（IPC）消息的方式，向应用程序传递恶意构造的文件路径或名称，从而以 SYSTEM 权限执行任意代码。该漏洞影响安装了 ASUS Business Manager 的 Windows 系统，攻击者需具备本地登录权限，无需用户交互即可完成利用。成功利用后，攻击者可获得系统最高权限，完全控制目标主机。ASUS 已发布安全更新修复此漏洞，建议用户尽快升级至修复版本。"
published = "2026-07-03T03:16:23Z"
remediation = '立即升级 ASUS Business Manager 至 v3.0.38.0 以上的安全补丁版本，请访问 https://www.asus.com/security-advisory 下载对应版本的 Security Update for ASUS Business Manager 并安装；升级完成后重启 ASUS Business Manager 服务使补丁生效。若暂时无法安装补丁，可通过 Windows 服务管理器将 ASUS Business Manager 服务启动类型设置为"手动"并停止运行，以阻止本地低权限用户通过 IPC 消息触发任意代码执行，作为临时缓解措施。'
score = 8.5
severity = "HIGH"
sources = ["zdi"]
title = "华硕 Business Manager 外部控制文件路径任意代码执行漏洞"
updated = "2026-07-06T18:56:27Z"

