[info]
author = "ave"
description = "AVE-2001-0087 verification"
id = "POC-AVE-2001-0087"
name = "PoC for AVE-2001-0087"
severity = "medium"
tags = ["ave-2001-0087"]
vuln_id = [
    "AVE-2001-0087",
    "CVE-2001-0215",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi-bin/phf"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
status = [200]
