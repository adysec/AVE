[basic]
description = "Windows 电话服务（Telephony Service）存在堆缓冲区溢出漏洞，远程攻击者可通过向目标系统发送特制的 RPC 请求触发该漏洞，成功利用可在目标系统上以 SYSTEM 权限执行任意代码。攻击需要用户交互（如点击恶意链接或打开特制文件），但无需身份认证。该漏洞影响多个 Windows 版本，包括 Windows 10/11 及 Windows Server 系列。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞，CVSS 评分 8.8，危害等级高。"
published = "2025-02-11T18:15:30Z"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新（KB5051987），或通过 Windows Update 自动获取更新。对于无法立即打补丁的系统，可在组策略中禁用 TAPI 服务（Telephony Service）作为临时缓解措施，或在网络边界限制对 RPC 端口的访问。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:42:44Z"

