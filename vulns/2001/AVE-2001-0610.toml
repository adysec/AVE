[basic]
description = "CGI Script Center Subscribe Me LITE 2.0 及更早版本存在身份验证绕过漏洞。subscribe.pl 脚本在处理删除邮件列表用户操作时未进行任何身份验证，远程攻击者无需认证即可通过直接调用 subscribe.pl 并传入目标邮箱地址作为参数，删除任意邮件列表用户。该漏洞影响 Subscribe Me LITE 2.0 及之前所有版本，攻击复杂度低，仅需知道目标邮箱地址即可实施攻击，可能导致邮件列表用户数据被批量删除，破坏邮件列表服务的正常运作。"
published = "2001-02-12T05:00:00Z"
remediation = "立即升级 Subscribe Me LITE 至 2.0 以上版本（若厂商已停止维护，建议迁移至其他受支持的邮件列表管理软件）。临时缓解措施：在 Web 服务器配置中为 subscribe.pl 添加 HTTP 基本认证（如 Apache .htaccess 配置 `AuthType Basic` 和 `Require valid-user`），或通过防火墙/反向代理限制对 subscribe.pl 的访问来源 IP。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "CGI Script Center Subscribe Me LITE 未授权访问漏洞"
updated = "2026-06-16T21:53:37Z"

