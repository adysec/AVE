[basic]
description = "Drupal 核心存在远程代码执行漏洞（Drupalgeddon2），由于多个子系统对用户输入验证不充分，未经身份认证的远程攻击者可通过向目标站点发送特制的 HTTP POST 请求，在默认或常见模块配置下触发该漏洞，实现任意 PHP 代码执行。该漏洞影响 Drupal 7.58 之前版本、8.3.9 之前的 8.x 版本、8.4.6 之前的 8.4.x 版本及 8.5.1 之前的 8.5.x 版本，CVSS 评分 9.8，危害等级严重。攻击无需认证，利用复杂度低，已出现大量公开 PoC 和自动化利用工具，曾被 CISA 列入已知被利用漏洞目录。官方已在 2018 年 3 月发布安全更新修复此漏洞，建议立即升级至修复版本。"
published = "2018-03-29T07:29:00Z"
remediation = "立即升级 Drupal 至 7.58、8.3.9、8.4.6 或 8.5.1 及以上版本。如无法立即升级，可临时禁用 PHP 的 `drupal_render` 相关表单处理功能，或在 Web 应用防火墙（WAF）层面添加规则拦截包含 `q=user/password&name[#post_render][]=printf&name[#type]=markup` 等特征的恶意请求。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Drupal Drupalgeddon2 远程代码执行漏洞"
updated = "2026-06-17T02:03:25Z"

