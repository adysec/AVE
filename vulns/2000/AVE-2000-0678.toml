[basic]
description = "SmartWin CyberOffice Shopping Cart 2（CyberShop）默认安装时将 `_private` 目录权限设置为全局可读，远程攻击者无需认证即可通过 HTTP 直接访问该目录下的敏感文件（如数据库配置、用户信息等），导致信息泄露。该漏洞影响 SmartWin CyberOffice Shopping Cart 2 版本，攻击复杂度低，无需特殊权限即可利用。"
published = "2000-12-19T05:00:00.000"
remediation = "立即将 CyberOffice Shopping Cart 安装目录下的 _private 目录权限修改为 700 或 750，仅允许 Web 服务运行账户访问；同时在 Web 服务器（如 Apache/IIS）配置中禁止直接访问 _private 目录（如添加 Deny from all 规则或 .htaccess 限制）。如已不再使用该产品，建议将敏感数据迁移至 Web 根目录之外存储。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "SmartWin CyberOffice Shopping Cart 2 默认配置信息泄露漏洞"
updated = "2026-06-16T21:52:46.800"

