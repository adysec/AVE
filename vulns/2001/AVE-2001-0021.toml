[basic]
description = "标签之间。<value>Cisco Catalyst 4000、5000 和 6000 系列交换机在 Telnet 认证过程中存在内存泄漏漏洞。远程攻击者无需身份验证，通过连续发送多次失败的 Telnet 认证尝试即可触发该漏洞，导致系统无法正确释放内存资源，使设备内存逐步耗尽。该漏洞影响运行 Cisco CatOS 5.5.4a 及以下版本的上述系列交换机。攻击者利用脚本或工具向目标 Telnet 端口发起大量认证失败请求，反复触发内存泄漏，最终导致设备拒绝服务，无法处理新的连接请求或正常运行。"
published = "2001-02-16T05:00:00Z"
remediation = "升级 Cisco CatOS 至 5.5(5) 或更高版本以修复 Telnet 认证内存泄漏漏洞。如暂无法升级，应禁用 Telnet 服务并改用 SSH 进行远程管理，同时在交换机上配置访问控制列表（ACL）仅允许可信管理网段访问设备管理端口，以减少攻击面。"
score = 7.8
severity = "HIGH"
sources = ["epss"]
title = "Cisco Catalyst 交换机 Telnet 认证内存泄露拒绝服务漏洞"
updated = "2026-06-16T21:53:32Z"

