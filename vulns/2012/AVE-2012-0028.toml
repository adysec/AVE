[basic]
description = "Horde Groupware 的 FTP 服务器曾被入侵，攻击者在官方发布的 Horde 3.3.12 版本中植入了后门代码（下载时间介于 2011 年 11 月 15 日至 2012 年 2 月 7 日之间）。未经身份认证的远程攻击者可通过向受影响的 Horde 应用发送特制的 HTTP 请求触发该后门，从而在目标服务器上执行任意 PHP 代码，实现完全控制。该漏洞影响范围广，危害严重，Metasploit 框架已提供对应的利用模块。"
published = "2012-09-26T00:00:00Z"
remediation = "立即停止使用从官方 FTP 下载的 Horde 3.3.12、Horde Groupware 1.2.10 及 Horde Groupware Webmail Edition 1.2.10（2011年11月至2012年2月期间下载的版本），升级至 Horde 3.3.13、Horde Groupware 1.2.11 或 Horde Groupware Webmail Edition 1.2.11 及以上版本。Horde 4 系列不受影响，无需操作。升级前检查 Horde 目录中是否存在 `$m[1]($m[2])` 后门特征码，如发现则立即隔离服务器并重新安装。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Horde Groupware 后门任意PHP代码执行漏洞"
updated = "2012-09-26T00:00:00Z"

