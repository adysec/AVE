[basic]
description = 'Microsoft Office 2000 (Excel 和 PowerPoint) 及 PowerPoint 97 的 ActiveX 控件被错误标记为"安全供脚本使用", 导致远程攻击者可通过构造恶意网页或 HTML 邮件, 诱使用户在 Internet Explorer 或 Outlook 等邮件客户端中打开, 利用 VBA SaveAs 函数强制将任意文件保存到目标系统任意路径, 实现任意文件写入。该漏洞影响安装了 Office 2000 或 PowerPoint 97 的 Windows 系统, 攻击者只需诱导用户访问恶意页面或打开恶意邮件即可触发, 无需用户交互即可实现任意文件写入, 进而可能植入恶意脚本、启动项或覆盖系统文件实现代码执行。CVSS 7.5 分, 影响范围广泛, 微软已发布补丁修复。Microsoft 已发布安全公告 MS00-043 修复此漏洞。'
published = "2000-06-27T04:00:00.000"
remediation = '立即升级到 Microsoft Office 2003 或更高版本（建议升级至 Office 2016/2019/365），并将 Internet Explorer 升级至 IE 6 或更高版本（建议迁移至 Microsoft Edge）。若无法立即升级，请立即应用微软安全公告 MS00-043（KB268744）提供的 Office 2000 安全补丁包，并在注册表 HKEY_CURRENT_USER\Software\Microsoft\Office\11.0\Excel\Security 中设置 VBAWarnings=2 禁用 VBA 宏，或通过组策略禁用 ActiveX 控件运行、限制 VBA SaveAs 方法权限，同时在网络边界部署入侵防御系统阻断恶意 HTML 页面投递。若仍需使用 Office 2000，建议隔离至离线环境并禁用 Outlook/IE 的 HTML 邮件渲染功能作为缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Internet Explorer 5.01, Excel 2000, PowerPoint 2000 ActiveX 对象执行漏洞"
updated = "2026-06-16T21:52:04.747"

