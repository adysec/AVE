[basic]
description = "MIT Kerberos 4 的 KDC（密钥分发中心）程序存在双重释放（double-free）内存漏洞。远程攻击者无需身份认证即可向目标 KDC 服务器发送特制请求，触发内存重复释放操作，导致程序崩溃或服务不可用，造成拒绝服务。该漏洞影响 Kerberos 4.0、Kerberos 5 1.0、5 1.1.1 及 5-1.1 版本，CVSS 评分 5.0，危害等级中危。建议升级至已修复版本或应用厂商提供的补丁。"
published = "2000-06-09T04:00:00Z"
remediation = "升级 MIT Kerberos 至 krb5-1.2 及以上版本，或为 krb5-1.0.x/krb5-1.1.x 应用 MIT 官方补丁（krb4kdc_10x_patch.txt / krb4kdc_111_patch.txt），补丁下载地址 https://web.mit.edu/kerberos/www/advisories/index.html。KTH-krb4 用户升级至 0.10 及以上版本。Red Hat 用户安装 RHSA-2000-031 提供的更新包。如无法立即升级，可在 KDC 上禁用 Kerberos 4 兼容模式作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "MIT Kerberos KDC 双重释放拒绝服务漏洞"
updated = "2026-06-16T21:51:58Z"

