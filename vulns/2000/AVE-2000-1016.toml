[basic]
description = "WQuinn QuotaAdvisor 4.1 存在目录遍历信息泄露漏洞。本地用户可通过在目标共享上运行报告功能，列出服务器上的目录和文件列表，导致敏感信息泄露。攻击者需具有本地访问权限，无需身份认证即可利用该漏洞获取系统文件结构信息，为后续攻击提供情报支持。该漏洞影响 WQuinn QuotaAdvisor 4.1 版本，CVSS 评分 2.1，危害等级低。"
published = "2000-12-19T05:00:00Z"
remediation = '由于 WQuinn QuotaAdvisor 4.1 已停止维护且无官方补丁，建议立即卸载该软件并迁移至其他受支持的磁盘配额管理工具（如 Microsoft 文件服务器资源管理器 FSRM）。如无法卸载，应严格限制软件安装目录（默认 Program Files\WQuinn\）的 NTFS 权限，仅允许管理员组读取和执行；同时通过组策略或注册表禁用非管理员用户运行报告功能的权限，并在共享文件夹上设置最小必要权限（去除 Everyone 组的读取权限）。'
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "WQuinn QuotaAdvisor 目录文件信息泄露漏洞"
updated = "2026-06-16T21:52:47Z"

