[basic]
description = "PostgreSQL 7.2 版本的 lpad 和 rpad 字符串函数存在缓冲区溢出漏洞。攻击者通过向这两个函数传递超长字符串参数，可触发缓冲区边界越界写，进而导致数据库服务崩溃拒绝服务，或在内核版本和编译环境有利条件下实现任意代码执行。该漏洞影响运行 PostgreSQL 7.2 及相关早期版本的生产系统，攻击条件要求攻击者拥有对数据库的本地访问权限或具备执行任意 SQL 语句的权限（如通过 Web 应用注入）。攻击者无需事先认证即可通过构造恶意 SQL 查询语句，利用 lpad 或 rpad 函数的长参数触发溢出，实现服务中断或获取数据库服务器控制权限。"
published = "2002-09-24T04:00:00.000"
remediation = "将 PostgreSQL 从 7.2 升级至 7.2.2 或更高版本，该版本修复了 lpad()、rpad() 函数在处理长字符串时的缓冲区溢出问题。如暂无法升级，应避免在启用多字节字符集（UNICODE、EUC_JP、EUC_CN、EUC_KR、EUC_TW、MULE_INTERNAL）的数据库中调用 lpad() 和 rpad() 函数，并限制数据库访问权限，仅允许可信用户连接，因为该漏洞利用需要有效的数据库登录凭据。如不需要多字节支持，可在编译 PostgreSQL 时禁用多字节字符集功能作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "PostgreSQL lpad/rpad 缓冲区溢出拒绝服务代码执行漏洞"
updated = "2026-06-16T21:58:29.290"

