[basic]
description = "Opera 浏览器 11.50 之前版本在处理包含大量停止点的 CSS 渐变时，其 CANVAS 元素、SVG 和 CSS 实现存在资源管理错误，远程攻击者可通过构造恶意网页诱导用户访问，触发浏览器应用程序崩溃导致拒绝服务。该漏洞影响 Opera 11.50 之前所有版本，攻击者无需身份认证即可远程利用，仅需用户访问包含恶意 CSS 渐变的网页即可触发拒绝服务，CVSS 评分 5.0（中等危害）。"
published = "2011-07-01T10:55:02Z"
remediation = '建议立即升级 Opera 浏览器至 11.50 或更高版本（访问 https://www.opera.com/download 官方下载最新版）。无法立即升级时，可暂时禁用浏览器的 Canvas/SVG 渲染功能（在 opera:config 中禁用 "Enable Canvas" 和 "Enable SVG" 选项）或改用其他浏览器作为临时缓解措施，避免访问不可信网站。企业环境可通过组策略或软件分发系统统一推送 Opera 11.50+ 更新包强制升级全网终端。'
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera Opera Web Browser 远程拒绝服务漏洞"
updated = "2026-06-16T23:31:39Z"

