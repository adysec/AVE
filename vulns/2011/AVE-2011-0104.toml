[basic]
description = "Adobe Flash Player 存在逻辑错误漏洞（CWE-20），远程攻击者可通过诱导用户访问恶意网页或打开特制的 Flash 文件触发该漏洞，导致远程代码执行或浏览器崩溃。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上 10.3.183.10 之前版本（Android 为 10.3.186.7 之前），无需身份认证即可利用，CVSS 评分 9.3，危害严重。Adobe 已在安全更新中修复此漏洞。"
published = "2011-09-22T03:38:38Z"
remediation = "升级 Adobe Flash Player 至 10.3.183.10 及以上版本（Windows/Mac/Linux/Solaris）或 10.3.186.7 及以上版本（Android）。由于 Flash Player 已停止维护，建议彻底卸载 Flash Player 并迁移至 HTML5 标准，同时在浏览器中禁用 Flash 插件作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 逻辑错误远程代码执行漏洞"
updated = "2026-06-16T23:31:18Z"

