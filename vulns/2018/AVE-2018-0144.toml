[basic]
description = "WordPress Ninja Forms 插件 3.3.18 之前版本的 includes/Admin/Menus/Submissions.php（提交页面）存在反射型跨站脚本漏洞，由于对 begin_date、end_date、form_id 参数缺乏充分的输入验证与输出编码，远程攻击者可构造包含恶意 JavaScript 代码的 URL 诱导管理员点击，在管理员浏览器上下文中执行任意脚本，可窃取会话 Cookie、篡改页面内容或发起进一步攻击。该漏洞影响所有使用受影响版本 Ninja Forms 插件的 WordPress 站点，CVSS 3.0 评分 6.1（中危），攻击向量为网络、攻击复杂度低、无需权限但需用户交互、范围改变、机密性和完整性影响较低。升级至 3.3.18 或更高版本可修复此漏洞。"
published = "2018-11-15T06:29:00Z"
remediation = "立即升级WordPress Ninja Forms插件到3.3.18或更高版本，这包含官方安全补丁修复XSS漏洞；更新后访问插件设置页面，确认“提交”功能中的表单验证已启用，并禁用不需要的表单字段；如无法立即更新，可临时通过导入安全规则的Web应用防火墙规则过滤包含恶意脚本的提交请求，阻止XSS攻击载荷；定期备份网站数据和插件配置，以便在紧急情况下快速恢复安全版本"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Ninja Forms 插件跨站脚本漏洞"
updated = "2026-06-17T01:49:04Z"

