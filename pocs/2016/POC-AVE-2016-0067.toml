[info]
author = "AVE"
description = "通过向 __debugging_center_utils___.php 的 log 参数注入系统命令，检测目标是否存在未授权远程代码执行漏洞"
id = "POC-AVE-2016-0067"
name = "NUUO NVRmini2/NVRsolo/ReadyNAS Surveillance 远程代码执行漏洞 PoC"
severity = "critical"
tags = [
    "cve-2016-5674",
    "rce",
    "nuuo",
    "nvr",
]
vuln_id = [
    "CVE-2016-5674",
    "AVE-2016-0067",
]

[poc]
logic = "any"

[[poc.requests]]
