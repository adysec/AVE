[basic]
description = "Joomla! 的 Jtag Members Directory 组件 5.3.7 版本中存在任意文件下载漏洞。该漏洞源于组件对 `download_file` 参数缺乏充分的过滤与验证，未经身份认证的远程攻击者可通过构造特制的 HTTP 请求，利用目录遍历技术下载服务器上的任意文件，包括配置文件、数据库凭证等敏感信息。攻击无需任何权限或用户交互，仅需目标系统安装受影响组件即可实施。CVSS 评分 7.5，危害等级高，可能导致敏感信息泄露，进一步扩大攻击面。"
published = "2018-01-29T05:29:00.447"
remediation = "立即卸载 Jtag Members Directory 5.3.7 组件，替换为官方维护的替代组件。如必须使用，在 Joomla! 后台扩展管理中将该组件禁用，并在 .htaccess 中添加 `RewriteCond %{QUERY_STRING} download_file= [NC]` `RewriteRule .* - [F]` 规则阻止任意文件下载请求。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Joomla! Jtag Members Directory 任意文件下载漏洞"
updated = "2026-06-17T02:01:10.703"

