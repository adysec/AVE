[basic]
description = "ispell 在 3.1.20 版本之前存在符号链接（symlink）攻击漏洞。该漏洞源于 ispell 在处理临时文件时未对文件路径进行充分的安全校验，攻击者可通过创建指向目标用户文件的符号链接，使 ispell 在写入临时文件时覆盖其他用户的文件。该漏洞影响 ispell 3.1.20 之前的所有版本。攻击条件为攻击者需具有本地用户权限，利用方式是在 ispell 生成临时文件时预先创建指向目标文件的符号链接，从而诱导 ispell 将内容写入目标文件，实现文件覆盖。CVSS 评分为 1.2，危害等级较低。"
published = "2001-06-21T04:00:00Z"
remediation = "将系统上的 ispell 升级至 3.1.20 或更高版本。对于 Red Hat 系统，安装 Red Hat errata RHSA-2001:074 提供的更新包；对于 Mandrake 系统，应用 MDKSA-2001:058 安全更新；对于 Debian/Ubuntu 系统，执行 apt-get install --only-upgrade ispell 更新至发行版提供的修复版本。如因业务原因无法立即升级，可采取以下临时缓解措施：将 /tmp 目录权限设置为 1777（确保粘滞位生效，防止用户删除或覆盖他人文件），为 ispell 进程设置专用的私有临时目录（通过环境变量 TMPDIR=/var/tmp/ispell 或类似安全路径），并使用 umask 0077 限制临时文件创建权限，同时限制本地非特权用户对 ispell 的 SUID/SGID 执行权限。"
score = 1.2
severity = "LOW"
sources = ["redhat"]
title = "ispell 临时文件符号链接攻击文件覆盖漏洞"
updated = "2026-06-16T21:55:56Z"

