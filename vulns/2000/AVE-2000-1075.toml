[basic]
description = "Id Software Quake 1.0 及 ProQuake 1.01 及更早版本存在拒绝服务漏洞，远程攻击者可通过向目标服务器发送特制的空 UDP 数据包，导致游戏服务器进程崩溃或停止响应。该漏洞无需身份认证即可利用，攻击者只需构造一个不含有效载荷的畸形 UDP 报文即可触发，影响所有运行上述版本 Quake 服务器的系统。"
published = "2000-11-01T05:00:00.000"
remediation = "升级到 ProQuake 1.01 以上版本（如已不可获取，建议迁移至 QuakeWorld 或 ezQuake 等现代服务端实现）。如无法升级，在防火墙层面限制 UDP 26000 端口的访问来源，仅允许可信 IP 连接，以阻止远程空 UDP 包触发的拒绝服务攻击。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Id Software Quake 1/ProQuake UDP 数据包拒绝服务漏洞"
updated = "2026-06-16T21:53:06.547"

