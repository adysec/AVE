[basic]
description = "Grav CMS 1.3.0 之前版本中的 system/src/Grav/Common/Twig/Twig.php 存在反射型跨站脚本（XSS）漏洞。远程攻击者可通过向 admin/tools 路径的 PATH_INFO 参数注入恶意 Web 脚本或 HTML 代码，当管理员访问特制链接时触发执行，导致敏感信息泄露或会话劫持。攻击无需身份认证但需用户交互，CVSS 评分 6.1，危害等级中危。官方已在 1.3.0 版本中修复此漏洞。"
published = "2018-03-19T21:29:00.940"
remediation = "立即将 Grav CMS 升级至 1.3.0 或更高版本（建议使用最新稳定版）。可通过 Grav 官方 GPM 包管理器执行命令 `bin/gpm selfupgrade` 完成升级，或直接从 https://getgrav.org/downloads 下载最新版本覆盖安装。如暂时无法升级，应限制对 /admin/tools 路径的未授权访问，例如在 Web 服务器层（Nginx/Apache）添加访问控制规则，仅允许可信 IP 访问后台管理面板，以阻止攻击者通过 PATH_INFO 注入恶意脚本。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Grav CMS 跨站脚本漏洞"
updated = "2026-06-17T01:59:53.197"

