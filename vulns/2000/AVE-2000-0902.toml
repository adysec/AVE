[basic]
description = 'ISC BIND 8.2 至 8.2.2-P6 版本的 named 守护进程在处理 SRV 资源记录时存在处理缺陷，远程未经认证的攻击者可向目标 DNS 服务器发送特制的 SRV 记录查询，触发 "srv bug" 导致 named 进程崩溃或停止响应，造成拒绝服务。该漏洞影响 ISC BIND 8.2 至 8.2.2-P6 所有版本，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），属中危可用性影响漏洞。攻击者无需身份认证即可远程发送恶意 SRV 记录触发漏洞，导致 DNS 服务拒绝服务，ISC 已在后续版本中修复此漏洞，建议升级至修复版本。'
published = "2000-12-19T05:00:00.000"
remediation = "升级 ISC BIND 到 9.18.8 或更高版本，应用最新的安全补丁更新；在SRV记录处理中使用严格的长度和格式验证；加强入侵检测系统监控SRV记录流量；实施防火墙规则，限制针对端口53的异常SRV查询；更新BIND配置，确保TCP/TLS优先于UDP连接以增强安全性。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "ISC BIND SRV 记录拒绝服务漏洞"
updated = "2026-06-16T21:52:40.820"

