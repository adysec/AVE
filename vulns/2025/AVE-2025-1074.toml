[basic]
description = "tags.<value>Linux 内核蓝牙子系统的 L2CAP 模块中存在 slab-use-after-free 漏洞。当 HCI 同步命令释放 l2cap_conn 结构体后，HCI 接收数据工作队列仍会引用该已释放的内存并向上层发送数据，从而触发竞争条件。攻击者需在蓝牙通信范围内，无需任何权限且无需用户交互即可触发该漏洞，造成内存损坏，进而可能实现本地特权提升或任意代码执行。该漏洞影响所有启用蓝牙功能的 Linux 内核版本，CVSSv3.1 评分为 8.8。"
published = "2025-04-01T16:15:28Z"
remediation = "建议立即升级 Linux 内核到 6.6.84、6.12.20、6.13.8 或更高版本，相关补丁已通过 commit 7790a79c6fce、b4f82f9ed43a、c96cce853542、f8094625a591 修复 L2CAP 蓝牙模块的 use-after-free 问题。如无法立即升级，可通过执行 rmmod bluetooth 或向 /etc/modprobe.d/disable-bluetooth.conf 添加 blacklist bluetooth 禁用蓝牙内核模块作为临时缓解措施，直至完成内核更新。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核蓝牙 L2CAP 释放后使用漏洞"
updated = "2026-07-30T06:22:00Z"

