[basic]
description = "Lorex 2K Indoor Wi-Fi Security Camera 设备管理服务器存在证书验证不当漏洞（CWE-295）。该漏洞源于设备管理功能未能正确验证服务器提供的证书，导致网络相邻的攻击者可在无需用户交互的情况下，利用中间人攻击等手段绕过证书校验，结合其他漏洞在 root 权限上下文中执行任意代码。受影响产品为 Lorex 2K Indoor Wi-Fi Security Camera 系列，CVSS 评分 7.5，危害等级高。厂商已发布固件更新修复此漏洞。"
published = "2026-07-13T22:16:45Z"
remediation = "厂商尚未发布官方固件更新。建议立即采取以下缓解措施：(1) 在路由器/交换机上为摄像头设备启用 802.1X 端口认证，限制仅授权设备可接入局域网；(2) 在防火墙上设置 ACL 规则，禁止摄像头与除 NVR/管理端外的其他内网设备通信；(3) 将摄像头固件升级至厂商后续发布的最新版本（关注 https://www.lorex.com/support）；(4) 如非必要，将摄像头隔离在独立 VLAN 中，避免与核心业务网络直连。"
score = 7.5
severity = "HIGH"
sources = ["zdi"]
title = "Lorex 2K Indoor Wi-Fi Security Camera 设备管理服务器证书验证不当漏洞"
updated = "2026-07-14T16:45:45Z"

