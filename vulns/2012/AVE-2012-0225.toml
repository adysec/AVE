[basic]
description = "Mozilla Firefox 4.x至13.0、Thunderbird 5.0至13.0及SeaMonkey 2.11之前版本中的QCMS颜色管理库实现中，qcms_transform_data_rgb_out_lut_sse2函数存在越界读取漏洞。当处理特制的颜色配置文件（color profile）时，程序未能正确验证输入数据的边界，导致在SSE2优化路径中发生越界内存读取。远程攻击者可通过构造恶意的颜色配置文件，诱使用户在受影响浏览器中打开包含该配置文件的图片或网页，从而触发越界读取操作，导致进程内存中的敏感信息泄露。该漏洞无需身份认证即可远程利用，攻击复杂度低，CVSS评分5.0，危害等级中危。"
published = "2012-07-18T10:26:48Z"
remediation = "升级 Firefox 至 14.0 及以上版本、Thunderbird 至 14.0 及以上版本、SeaMonkey 至 2.11 及以上版本。无法立即升级时，可在浏览器设置中禁用色彩管理功能（gfx.color_management.enabled 设为 false）作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey QCMS颜色管理库越界读取漏洞"
updated = "2026-06-16T23:40:40Z"

