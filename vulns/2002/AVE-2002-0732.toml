[basic]
description = "GoAhead WebServer 2.1 在处理 HTTP GET 请求时存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标服务器发送包含大量子目录的特制长 HTTP GET 请求触发该溢出，进而在服务器上执行任意代码。该漏洞影响所有部署 GoAhead WebServer 2.1 版本的嵌入式设备及 Web 服务器，攻击者成功利用后即可完全控制目标系统，获取敏感信息或进一步横向渗透。攻击条件为攻击者能够访问目标服务器的 Web 服务端口，且无需任何凭据即可发起利用。"
published = "2002-12-31T05:00:00Z"
remediation = "建议立即升级至 GoAhead Web Server 2.2 版本（厂商 Embedthis 官方安全更新版，完整回溯修复了所有已知 CVE 漏洞并保持与 2.1.8 版 100% API 兼容）。若暂时无法升级，可在 Web 应用防火墙（WAF）层面配置规则拦截包含超长路径或大量子目录的 HTTP GET 请求（如限制 URL 路径最大长度为 2048 字符、子目录层级不超过 20 层），并在反向代理（如 Nginx/Apache）层添加 `limit_req_zone` 限制单 IP 请求频率作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "GoAhead WebServer 2.1 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T22:00:21Z"

