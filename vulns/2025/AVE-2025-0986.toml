[basic]
description = "Linux 内核 VXLAN 虚拟扩展局域网子系统中存在空指针解引用漏洞。vxlan_init() 函数在初始化时未对 vxlan_vnigroup_init() 的返回值进行检查，当该函数初始化失败时，后续 vxlan_vnigroup_uninit() 会在释放资源时访问空指针，触发一般保护错误导致内核崩溃。该漏洞影响启用了 VXLAN 功能的 Linux 内核版本，具有本地低权限（LUSER）即可触发的特点。攻击者可通过向系统发送特制的 VXLAN 网络接口创建请求触发该漏洞，造成目标系统拒绝服务（内核 panic）。CVSS 评分 5.5，危害等级中危。"
published = "2025-02-27T03:15:19.870"
remediation = "升级 Linux 内核至已修复版本：6.6.79、6.12.16、6.13.4 或 6.14 及更高版本。各发行版用户应安装对应安全更新，如 Debian 请跟进 DLA-4102，Red Hat Enterprise Linux 请跟进 RHSA-2025:20518，Ubuntu 请跟进 USN-7703-1。如暂无法升级，可在防火墙层面限制本地用户创建 VXLAN 网络接口的权限，以降低空指针解引用导致内核崩溃的风险。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 VXLAN 空指针解引用漏洞"
updated = "2026-06-17T08:44:17.070"

