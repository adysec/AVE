[basic]
description = "Windows Media Player 7.0 中的 WMP ActiveX 控件存在跨域验证绕过漏洞，远程攻击者可通过在 Internet Explorer 中构造特制的 javascript URL 链接，诱使用户点击后绕过框架域验证机制，在用户浏览器上下文中执行任意命令。该漏洞影响 Windows Media Player 7.0 及关联的 IE 版本，攻击者无需身份认证即可远程利用，危害等级高。目前已有公开 PoC 代码，建议用户升级至更高版本或禁用相关 ActiveX 控件。"
published = "2001-06-02T04:00:00.000"
remediation = '立即卸载 Windows Media Player 7.0，升级到 Windows Media Player 9 或更高版本。如无法升级，在 Internet Explorer 中设置 killbit 禁用 WMP ActiveX 控件（CLSID: 22D6F312-B0F6-11D0-94AB-0080C74C7E95），方法：在注册表 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer\ActiveX Compatibility 下新建对应 CLSID 项，将 Compatibility Flags DWORD 值设为 0x400。同时将 Internet 区域安全级别设为高，禁用 ActiveX 脚本执行。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Windows Media Player 7.0 ActiveX 远程代码执行漏洞"
updated = "2026-06-16T21:53:45.787"

