[basic]
description = "Google Chrome 142.0.7444.59 之前版本的 V8 JavaScript 引擎存在越界读取漏洞（CWE-125）。远程攻击者可通过构造特制的 HTML 页面诱导用户访问，触发 V8 引擎在处理 JavaScript 对象时发生越界内存读取，导致敏感信息泄露。该漏洞攻击复杂度低，无需身份认证，但需要用户交互（点击链接），CVSS 评分 4.3，危害等级中危。Google 已在 Chrome 142.0.7444.59 版本中修复此漏洞。"
published = "2025-11-10T20:15:38Z"
remediation = '升级 Google Chrome 至 142.0.7444.59 及以上版本，可通过 Chrome 设置中的"关于 Chrome"自动更新。Fedora 42 用户执行 `sudo dnf update` 更新至 142.0.7444.162。如无法立即更新，可禁用 JavaScript 作为临时缓解措施。'
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome V8 越界读取漏洞"
updated = "2026-06-17T08:32:23Z"

