[basic]
description = "CGit 1.2.1 之前版本中的 cgit_clone_objects 函数存在目录遍历漏洞。当 `enable-http-clone=1` 配置项未关闭时，未经身份认证的远程攻击者可通过向目标 CGit 实例发送特制的 HTTP 请求，在 URL 路径中构造 `../` 序列遍历目录，例如访问 `/cgit/cgit.cgi/git/objects/?path=../` 即可读取服务器上任意文件。该漏洞影响所有启用 HTTP Clone 功能的 CGit 部署，CVSS 评分 7.5，危害等级高。攻击者无需任何权限即可远程利用，获取服务器敏感信息。目前官方已在 CGit 1.2.1 版本中修复此问题，建议用户升级或关闭 `enable-http-clone` 选项。"
published = "2018-08-03T19:29:00Z"
remediation = "升级 CGit 至 1.2.1 或更高版本（当前最新为 1.3.1），从 https://git.zx2c4.com/cgit/ 下载源码重新编译部署。如无法立即升级，在 CGit 配置文件（通常为 /etc/cgitrc）中将 `enable-http-clone=1` 改为 `enable-http-clone=0` 以禁用 HTTP 克隆功能，同时在 Web 服务器（Nginx/Apache）层面添加访问规则，拒绝外部对 `/git/objects/` 路径的请求。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "CGit 目录遍历漏洞"
updated = "2026-06-17T01:41:52Z"

