[basic]
description = "ApostropheCMS 的 @apostrophecms/file 模块在启用 prettyUrls 功能时，使用未经校验的 HTTP Host 请求头构造上游代理 URL，导致存在服务端请求伪造（SSRF）漏洞。未经身份认证的远程攻击者可通过向目标系统发送特制的 Host 标头，诱使服务器向内部网络任意主机发起 HTTP 请求，实现内网拓扑探测、响应码/响应时间差异分析及代理/WAF 404 页面信息泄露。该漏洞影响 apostrophe ≤ 4.30.0 版本，CVSS 评分 3.7，危害等级低，截至公告发布时无已知修复版本。"
published = "2026-06-12T21:16:24Z"
remediation = "目前无官方补丁版本。临时修复措施：1) 在 `modules/@apostrophecms/file/index.js` 中将 `proxyUrl` 构建方式从 `req.get('host')` 改为 `self.apos.baseUrl`，使用服务端可信绝对基址替代请求 Host 头；2) 在 `lib/stream-proxy.js` 中对 `fetch` 目标 URL 添加白名单校验，仅允许已配置的站点域名或 CDN 域名；3) 如业务允许，临时关闭 `prettyUrls: false` 禁用漂亮 URL 功能。"
score = 3.7
severity = "LOW"
sources = ["ghsa"]
title = "ApostropheCMS @apostrophecms/file 模块未授权服务端请求伪造漏洞"
updated = "2026-06-17T10:57:58Z"

