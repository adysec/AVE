[basic]
description = "Apple Mac OS X 10.7.4 之前版本的 QuickTime 在处理特制 MPEG 文件中的音频流时存在整数下溢漏洞。远程攻击者可向目标用户发送恶意构造的 MPEG 文件，诱导用户在 QuickTime 中打开后触发缓冲区下溢，导致任意代码执行或应用程序崩溃。攻击需要用户交互，但无需身份认证，危害严重。"
published = "2012-05-11T03:49:59.137"
remediation = "立即将 Apple QuickTime 升级至 7.7.2 或更高版本（Windows 平台），或安装 OS X Lion v10.7.4 更新及 Security Update 2012-002（Mac OS X 10.6.8 及 Lion 平台）。如无法立即升级，建议在浏览器中禁用 QuickTime 插件，避免自动解析来自不可信来源的 MPEG 文件。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Mac OS X QuickTime MPEG文件整数下溢漏洞"
updated = "2026-06-16T23:38:01.663"

