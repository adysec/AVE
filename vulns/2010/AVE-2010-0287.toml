[basic]
description = "Apple Safari 浏览器存在跨站脚本（XSS）漏洞，影响 Safari 4.1.1 之前版本（Mac OS X 10.4）及 Safari 5.0.1 之前版本（Mac OS X 10.5 至 10.6 和 Windows 平台）。该漏洞源于 Safari 对 RSS 订阅内容的解析处理不当，远程攻击者可通过构造恶意的 RSS feed 向目标用户推送包含任意 JavaScript 脚本或 HTML 代码的内容，当用户使用受影响版本的 Safari 浏览该 RSS 订阅源时，脚本将在用户浏览器上下文中执行，导致会话劫持、敏感信息窃取或网页篡改等后果。攻击条件较为宽松，无需用户交互即可在浏览恶意 RSS 内容时触发利用，CVSS 评分 4.3，危害等级为中等。Apple 已在后续版本中修复该漏洞，受影响用户应升级至 Safari 5.0.1 或更高版本。"
published = "2010-07-30T20:30:01Z"
remediation = "升级 Safari 浏览器至 5.0.1 或更高版本（Mac OS X 10.5-10.6 及 Windows 系统），或升级至 4.1.1 或更高版本（Mac OS X 10.4 系统），以修复 RSS feed 中的跨站脚本漏洞。如暂时无法升级，可禁用 Safari 的 RSS 订阅自动加载功能，避免访问不可信 RSS 源作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari 跨站脚本漏洞"
updated = "2026-06-16T23:19:18Z"

