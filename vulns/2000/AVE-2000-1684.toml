Let me write a clean Chinesedescription.XMail POP3 服务器 0.59 版本之前存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过向 POP3 服务（默认端口 110）发送超长的 USER 命令参数触发栈缓冲区溢出，导致任意代码执行。该漏洞攻击复杂度低，无需用户交互，CVSS 评分 10.0，危害等级严重，可被远程利用完全控制目标系统。

<value>XMail POP3 服务器 0.59 版本之前存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过向 POP3 服务（默认端口 110）发送超长的 USER 命令参数触发栈缓冲区溢出，导致任意代码执行。该漏洞攻击复杂度低，无需用户交互，CVSS 评分 10.0，危害等级严重，可被远程利用完全控制目标系统。"""
