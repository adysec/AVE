[basic]
description = "Microsoft Excel 存在释放后使用（Use After Free）漏洞，CWE-416。攻击者可通过诱导用户打开特制的 Excel 文件触发该漏洞，成功利用后可实现远程代码执行，获取与当前用户相同的系统权限，从而完全控制受影响的系统。该漏洞影响 Microsoft 365 Apps for Enterprise、Excel 2016、Office 2019、Office LTSC 2021/2024（含 Mac 版本）及 Office Online Server 等多个产品版本。攻击需要用户交互（打开恶意文件），无需额外权限，CVSS 评分 7.8，危害等级高。Microsoft 已在 2025 年 2 月安全更新中发布补丁修复此漏洞。"
published = "2025-02-11T18:15:37Z"
remediation = "建议立即安装 Microsoft 2025 年 2 月安全更新。Excel 2016 用户升级至 16.0.5487.1000 及以上版本；Office LTSC for Mac 2021/2024 升级至 16.94.25020927 及以上版本；Office Online Server 升级至 16.0.10416.20058 及以上版本；Microsoft 365 订阅用户通过 Office 更新通道自动获取修复。临时缓解措施：不要打开来自不可信来源的 Excel 文件，启用受保护视图和文件阻止策略。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Excel 远程代码执行漏洞"
updated = "2026-06-17T08:43:15Z"

