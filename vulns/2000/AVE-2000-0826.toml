[basic]
description = "RobinHood 1.1 Web 服务器 RHConsole 组件存在缓冲区溢出漏洞，远程攻击者可通过向目标系统发送超长 HTTP 请求触发该漏洞，导致服务进程崩溃，造成拒绝服务。该漏洞影响 BeOS r5 pro 及更早版本中运行的 RobinHood 1.1 Web 服务器，攻击者无需身份认证即可远程利用，CVSS 评分 5.0，危害等级中危。"
published = "2001-01-09T05:00:00.000"
remediation = "该漏洞影响 BeOS r5 pro 及更早版本上的 RobinHood 1.1 Web 服务器，该产品已停止维护且无官方补丁。建议立即迁移至其他受支持的 Web 服务器（如 Apache 或 Nginx），并在网络边界防火墙配置规则，限制入站 HTTP 请求长度不超过 4000 字节，同时过滤对 TCP 80 端口的异常长连接请求以缓解拒绝服务攻击。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "BeOS RobinHood 1.1 RHConsole HTTP请求拒绝服务漏洞"
updated = "2026-06-16T21:53:16.393"

