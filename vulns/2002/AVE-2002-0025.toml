[basic]
description = "nss_ldap 的 DNS SRV 记录解析代码存在缓冲区溢出漏洞，在 nss_ldap-198 之前版本中，远程攻击者可通过向目标系统发送特制的 DNS SRV 响应触发该漏洞，导致目标服务崩溃引发拒绝服务，甚至可能实现任意代码执行。该漏洞影响所有使用 nss_ldap 且未升级到 198 版本的 Linux/Unix 系统，攻击者无需认证即可远程触发。"
published = "2002-08-12T04:00:00Z"
remediation = "立即升级 nss_ldap 至 198 或更高版本（libnss-ldap 包对应 Debian 修复版本为 199-1）。在 Red Hat Enterprise Linux 中通过 `yum update nss_ldap` 更新，Debian/Ubuntu 通过 `apt-get update && apt-get install libnss-ldap` 更新。如无法立即升级，可在防火墙限制对 LDAP 服务器的访问来源 IP，并监控 DNS SRV 查询流量异常。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "nss_ldap DNS SRV 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:58:12Z"

