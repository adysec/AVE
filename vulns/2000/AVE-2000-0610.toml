[basic]
description = "SGI IRIX WorkShop 中的 cvconnect 工具存在任意文件写入漏洞。本地攻击者可通过向 cvconnect 传递特制参数，利用其对文件路径的校验缺陷，将恶意内容写入系统任意文件，从而覆盖关键配置文件或可执行文件，实现权限提升。该漏洞攻击复杂度低，无需认证即可利用，影响系统机密性、完整性和可用性。SGI 已发布安全补丁修复此漏洞。"
published = "2000-06-20T04:00:00Z"
remediation = "立即应用 SGI 安全公告 20000601-01-P 中提供的补丁，升级 cvconnect 组件至修复版本。如无法打补丁，限制本地用户对 cvconnect 的访问权限，仅授权可信用户使用该工具，并监控 /tmp 等可写目录的异常文件创建行为。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "SGI IRIX WorkShop cvconnect 任意文件写入漏洞"
updated = "2026-06-16T21:51:56Z"

