[basic]
description = "Microsoft Windows 10 内核存在内存权限提升漏洞，未经身份验证的本地低权限用户可通过构造恶意应用程序触发该漏洞，实现向 SYSTEM 权限的特权提升。该漏洞的影响范围包括 Windows 10 Gold 及 Windows 10 初始版本（x86 与 x64 架构），攻击者仅需在目标系统上以普通用户身份运行特制程序即可利用，无需额外权限。成功利用后，攻击者可在内核级别执行任意代码，完全控制受影响系统，进而安装程序、查看或修改敏感数据、创建具有完全管理权限的账户，对系统机密性和完整性造成严重威胁。该漏洞 CVSS v3 评分为 7.8（高危），并被 CISA 列入已知被利用漏洞目录，已在真实攻击中被广泛利用。Microsoft 在 2015 年 12 月发布的安全公告 MS15-135 中提供了修复补丁，受影响用户应尽快安装该安全更新以消除风险。"
published = "2015-12-09T11:59:56Z"
remediation = "安装 Microsoft 2015 年 12 月安全更新 MS15-135，对应 KB3119075（Windows Vista/7/8/Server 2008/Server 2012）或 KB3116869（Windows 10），可通过 Windows Update 自动获取，亦可在 Microsoft Update Catalog 手动下载安装。如暂时无法打补丁，建议在防火墙或组策略中限制本地低权限用户运行未签名或任意来源应用程序的权限，以降低本地提权攻击成功概率。该漏洞已被 CISA 列入已知被利用漏洞目录，建议优先安排补丁部署。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows 内核内存特权提升漏洞"
updated = "2026-06-17T00:30:30Z"

