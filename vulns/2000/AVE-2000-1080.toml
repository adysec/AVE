[basic]
description = "Microsoft SQL Server 2000 及 SQL Server Desktop Engine (MSDE) 中的 xp_SetSQLSecurity 扩展存储过程函数在调用 srv_paraminfo API 前未正确限制缓冲区长度，存在缓冲区溢出漏洞。本地攻击者可通过向该函数传递特制参数触发缓冲区溢出，导致服务拒绝响应或执行任意命令。该漏洞无需身份认证即可利用，但需要本地访问权限，CVSS 评分 4.6，危害等级中危。Microsoft 尚未发布官方补丁。"
published = "2001-01-09T05:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS00-092 提供的补丁。SQL Server 7.0 用户需先升级至 Service Pack 2 再安装补丁；SQL Server 2000 用户可直接安装补丁，后续补丁将包含在 Service Pack 1 中。如无法立即打补丁，可将 SQL Server 服务账号配置为普通用户权限（非管理员），以限制利用成功后代码的执行权限；同时在防火墙层面限制对 SQL Server 端口的访问，仅允许受信任主机连接。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft SQL Server 2000 扩展存储过程参数解析缓冲区溢出漏洞"
updated = "2026-06-16T21:53:07Z"

