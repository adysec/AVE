[basic]
description = "Windows 内核在处理内存对象时存在权限提升漏洞（CWE-787 越界写入），由于内核未能正确验证对象操作的内存边界，导致低权限攻击者可在本地系统上通过执行特制应用程序触发该漏洞，成功利用后可获取 SYSTEM 权限并执行任意代码。该漏洞影响所有受支持的 Windows 版本，包括 Windows 7 至 Windows 10 及 Windows Server 2008 至 2019。攻击者需具备本地登录权限，无法远程利用。Microsoft 已在 2020 年 4 月安全更新中修复此漏洞。"
published = "2020-04-15T15:15:21Z"
remediation = "立即安装 Microsoft 2020 年 4 月安全更新。Windows 10 1909/1903 用户安装 KB4549951，Windows 7/8.1/Server 等版本安装对应月度安全更新。如无法立即打补丁，可通过配置 AppLocker 或 Windows Defender Application Control 限制 CSRSS 对不受信任的 SxS 清单的访问，并启用 Credential Guard 缓解提权风险。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows 内核特权提升漏洞"
updated = "2026-06-17T03:00:15Z"

