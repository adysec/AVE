[basic]
description = 'BOA Web Server 0.94.8.2 及更早版本存在目录遍历漏洞。远程攻击者无需身份认证，通过向服务器发送特制的 GET 请求，使用 "%2E"（即 URL 编码的点号）替代普通 "." 符号构造路径穿越序列，即可绕过服务器对目录遍历的检测，实现任意文件读取。该漏洞可导致服务器敏感信息泄露（如配置文件、密码文件等），严重威胁系统安全。由于攻击复杂度低且无需任何权限，该漏洞在互联网上被广泛利用。'
published = "2000-12-19T05:00:00.000"
remediation = "建议立即将 BOA Web Server 升级至 0.94.14 或更高版本（该系列最终修复版本），或彻底更换为仍在维护的 Nginx/Apache Web 服务器。如无法升级，可在 Web 服务器前端部署反向代理，过滤包含 `%2e` 等编码路径遍历特征的 GET 请求，或在 BOA 源码中手动禁用 `../` 及 URL 编码变种的路径解析。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "BOA Web Server 目录遍历漏洞"
updated = "2026-06-16T21:52:46.130"

