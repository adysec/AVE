[info]
author = "ave"
description = "通过发送恶意构造的邮件消息至目标邮件服务，验证是否存在越界写入漏洞，检测邮件处理组件是否受影响"
id = "POC-AVE-2020-0021"
name = "CVE-2020-9818 PoC"
severity = "high"
tags = ["ave-2020-0021"]
vuln_id = [
    "CVE-2020-9818",
    "AVE-2020-0021",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/api/mail/process"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["vulnerable"]
