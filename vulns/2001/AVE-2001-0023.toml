[basic]
description = "WatchGuard SOHO Firewall 2.2.1 及更早版本存在拒绝服务漏洞，远程攻击者无需身份认证即可通过向目标设备发送大量 HTTP GET 请求，耗尽设备处理资源，导致防火墙服务崩溃或无法响应正常流量。该漏洞利用门槛低，攻击者只需发送大量 GET 请求即可触发，影响设备可用性。Exploit-DB 上已有公开利用代码，攻击者可轻易实施拒绝服务攻击。"
published = "2001-02-16T05:00:00Z"
remediation = "升级 WatchGuard SOHO Firewall 固件至 2.2.2 或更高版本以修复此漏洞。如暂时无法升级，可在防火墙管理界面配置 HTTP 连接数限制规则，对单条会话的并发 GET 请求数设置阈值（如每分钟不超过 30 个连接），并启用连接速率限制功能，以减缓大量 GET 请求对设备内存资源的耗尽，防止防火墙重启或完全停止服务。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "WatchGuard SOHO Firewall 拒绝服务漏洞"
updated = "2026-06-16T21:53:33Z"

