[info]
author = "AVE"
description = "Apache 1.3 before 1.3.25 and Apache 2.0 before 2.0.46 do not filter terminal escape sequences from access logs, allowing attackers to inject escape sequences via HTTP requests that may execute when logs are viewed in vulnerable terminal emulators."
id = "POC-AVE-2003-0027"
name = "CVE-2003-0083 PoC"
severity = "medium"
tags = [
    "cve-2003-0083",
    "ave-2003-0027",
]
vuln_id = [
    "CVE-2003-0083",
    "AVE-2003-0027",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    200,
    301,
    302,
    401,
    403,
]
type = "status"
