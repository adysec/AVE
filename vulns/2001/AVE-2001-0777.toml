[basic]
description = "IBM Lotus Domino R5 服务器（5.06 之前版本）与 Domino Client（5.05 之前版本）的 HTML 解析器存在缓冲区溢出漏洞。远程攻击者可通过向目标 Domino 服务发送包含畸形字体大小（font size）声明指令的特制 HTML 内容触发该溢出，导致堆栈数据被覆盖，从而造成服务拒绝（Denial of Service）并在特定条件下可能执行任意命令。该漏洞影响范围为使用 Lotus Domino R5 系列的企业邮件与协作平台，攻击者无需任何身份认证即可在远程网络位置发起利用，攻击复杂度低。由于 CVSS v2 评分达 10.0（完全机密性、完整性及可用性影响），危害等级极为严重。受影响用户应升级至 Domino Server 5.06 及 Domino Client 5.05 或更高版本以消除此风险。"
published = "2001-03-12T05:00:00.000"
remediation = "立即将 Lotus Domino Server 升级至 5.06 或更高版本，Domino Client 升级至 5.05 或更高版本，以修复 HTML 解析器中因畸形字体大小说明符导致的缓冲区溢出漏洞。如无法立即升级，可在邮件路由器上配置规则拦截包含异常 FONT 标签的入站邮件，同时限制 Domino 服务的网络暴露范围，仅允许可信来源访问 HTTP 和 SMTP 端口，并持续关注 IBM/Lotus 官方安全公告获取后续补丁更新。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "IBM Lotus Domino R5 服务器和客户端 HTML 解析器缓冲区溢出漏洞"
updated = "2026-06-16T21:53:42.810"

