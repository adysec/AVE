[basic]
description = "Drupal avatar_uploader 模块 v7.x-1.0-beta8 版本中存在路径遍历漏洞。该模块的 view.php 文件未对用户身份进行有效验证，也未对文件路径参数进行充分的过滤与清理，导致未经身份认证的远程攻击者可通过构造包含 ../ 等目录跳转序列的恶意请求，读取服务器上的任意文件（如配置文件、敏感数据等）。该漏洞攻击复杂度低，无需用户交互，仅需网络访问即可利用，CVSS 评分 7.5，危害等级高。Exploit-DB 已公开 PoC 利用代码。"
published = "2018-04-04T15:29:00Z"
remediation = '''立即卸载或禁用 Drupal avatar_uploader 模块（路径：管理→扩展），该模块已停止维护且无安全更新。如必须使用，在 view.php 中对 `$_GET['file']` 参数添加 `basename()` 过滤和 `preg_replace('/\.\./', '', $path)` 路径遍历防护，并限制文件读取目录为 `./uploads/`。建议迁移至 Drupal 官方 File 模块或 Image 模块替代头像上传功能。'''
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Drupal avatar_uploader 任意文件读取漏洞"
updated = "2026-06-17T02:06:13Z"

