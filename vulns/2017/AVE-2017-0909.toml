[basic]
description = "Cisco IOS 和 IOS XE 的 SNMP 协议实现存在缓冲区溢出漏洞（CWE-119）。该漏洞源于受影响代码区域在处理特制 SNMP 数据包时未正确验证边界，导致缓冲区溢出。经过身份认证的远程攻击者通过向目标设备发送特制的 SNMP 数据包，可触发该漏洞，导致目标系统重载或远程执行任意代码，从而完全控制设备。攻击者需知晓 SNMP 只读团体字符串（SNMPv2c 及更早版本）或用户凭据（SNMPv3）。该漏洞影响所有 SNMP 版本（1、2c 和 3），CVSS 评分 8.8，危害等级高。Cisco 已发布安全更新修复此漏洞。"
published = "2017-07-17T21:29:00Z"
remediation = "立即升级至 Cisco IOS Software Checker 中对应版本的最新修复版本（访问 https://sec.cloudapps.cisco.com/security/center/selectIOSVersion.x 查询具体修复版本号）。如无法立即升级，可在全局配置模式下使用 snmp-server view 命令禁用受影响 MIB（包括 ADSL-LINE-MIB、ALPS-MIB、CISCO-AUTH-FRAMEWORK-MIB 等 10 个 MIB），并限制仅允许可信管理站访问 SNMP 服务。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS和IOS XE SNMP远程代码执行漏洞"
updated = "2026-06-17T01:22:55Z"

