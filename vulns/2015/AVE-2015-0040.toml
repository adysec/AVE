[basic]
description = "Xceedium Xsuite 的 opm/read_sessionlog.php 存在目录遍历漏洞，远程攻击者无需身份认证即可通过 logFile 参数传入 ....//（四点双斜杠）序列绕过路径过滤，读取服务器上的任意文件，导致敏感信息泄露。该漏洞影响 Xceedium Xsuite 2.4.4.5 及更早版本，CVSS 评分 5.0，危害等级中危。目前官方已停止维护，建议用户迁移至替代产品。"
published = "2015-08-13T14:59:05Z"
remediation = "立即升级 Xceedium Xsuite 至 2.4.4.6 或更高版本（该版本已于 2015 年 8 月 17 日前发布）。对于已更名为 CA Privileged Access Manager 的产品，建议升级至 3.0.0 或更高版本以修复所有已知漏洞。如无法立即升级，可在 Web 服务器（如 Apache）层面配置访问控制规则，限制对 `/opm/read_sessionlog.php` 路径的访问，仅允许可信 IP 段访问管理后台。"
score = 5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Xceedium Xsuite 目录遍历漏洞"
updated = "2026-06-17T00:27:41Z"

