[basic]
description = "MySQL 数据库引擎使用了一种弱身份认证方法，该方法在认证过程中会泄露密码哈希信息，远程攻击者无需身份认证即可通过网络嗅探或中间人攻击捕获认证数据包，进而通过离线暴力破解或字典攻击恢复明文密码。该漏洞影响 MySQL 3.23.x 及更早版本，攻击者获得密码后可完全控制数据库系统，造成数据泄露、篡改或破坏。利用该漏洞无需特殊权限，仅需能够监听目标 MySQL 服务与客户端之间的网络通信即可实施攻击。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 MySQL 至 4.1.0 及以上版本，新版本使用更安全的 41 位哈希认证协议替代旧版弱认证。如无法升级，在 my.cnf 中设置 old_passwords=0 禁用旧密码格式，并将所有用户密码重新设置为新格式哈希。同时限制数据库服务仅对可信 IP 开放。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "MySQL 数据库引擎 弱认证信息泄露漏洞"
updated = "2026-06-16T21:52:54.300"

