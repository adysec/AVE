[basic]
description = "ZyXEL Prestige 681 和 1600 SDSL 路由器在处理畸形 IP 数据包时存在拒绝服务漏洞。远程攻击者无需认证即可通过两种方式触发：一是发送 IP 头部声明的长度小于实际数据包大小的畸形报文，二是发送分片重组后总大小超过 64KB 的畸形分片包。当路由器处理这些异常数据包时，IP 分片重组模块出现逻辑错误，导致设备崩溃或重启，无法正常提供网络服务。该漏洞影响 ZyXEL Prestige 681 和 1600 系列 SDSL 路由器，攻击者只需向目标路由器发送特制网络报文即可实施攻击，无需任何身份认证。"
published = "2001-12-14T05:00:00Z"
remediation = "该漏洞影响已停产二十余年的 Zyxel Prestige 681/1600 SDSL 路由器，厂商未发布任何补丁。建议立即将设备更换为受支持的现代型号；若无法更换，可在上游防火墙配置规则丢弃入站的分片 IP 包（如 iptables -A INPUT -f -j DROP），或限制 DSL 接口上分片包的重组缓冲区大小以缓解 DoS 风险。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "ZyXEL Prestige 681/1600 SDSL 路由器 IP 分片重组拒绝服务漏洞"
updated = "2026-06-16T21:55:47Z"

