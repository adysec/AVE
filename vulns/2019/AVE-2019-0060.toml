[basic]
description = "Citrix SD-WAN Center 和 NetScaler SD-WAN Center 存在 OS 命令注入漏洞，CVE 编号 CVE-2019-12987。该漏洞源于对用户输入验证不严格（CWE-78），未经身份认证的远程攻击者可通过向受影响设备的管理接口发送特制请求，在系统上下文中注入并执行任意操作系统命令。攻击者无需任何权限或用户交互即可利用该漏洞，CVSS 评分 9.8，危害等级严重。成功利用可导致目标系统完全受控，造成信息泄露、数据篡改或服务中断。受影响版本包括 Citrix SD-WAN 10.2.3 之前版本及 NetScaler SD-WAN 10.0.8 之前版本。Citrix 已在 2019 年 7 月发布安全更新修复此漏洞，建议用户立即升级至修复版本。"
published = "2019-07-16T18:15:12Z"
remediation = "立即将 Citrix SD-WAN 升级到 10.2.3 或更高版本，将 NetScaler SD-WAN 升级到 10.0.8 或更高版本。补丁可通过 Citrix 官方支持站点（support.citrix.com）获取。如无法立即升级，建议在网络边界防火墙限制对 SD-WAN Center 管理界面的访问，仅允许受信任的管理 IP 连接，并禁用非必要的管理端口暴露在公网。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Citrix SD-WAN Center 和 NetScaler SD-WAN Center 命令注入漏洞"
updated = "2026-06-17T02:15:51Z"

