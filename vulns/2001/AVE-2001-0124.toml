[basic]
description = "Robin Twombly A1 HTTP Server 1.0a 存在目录遍历漏洞，未经身份认证的远程攻击者可通过在 HTTP GET 请求中使用 ..（点号）序列构造特制请求，绕过服务器路径访问限制，读取服务器上的任意敏感文件。该漏洞利用复杂度低，攻击者无需身份验证即可在远程发起攻击，成功利用后将导致敏感信息泄露，影响服务器文件系统的保密性。"
published = "2001-05-03T04:00:00Z"
remediation = "该漏洞影响已停止维护的 A1 HTTP Server 1.0a，官方未发布补丁。建议立即停止使用 A1 HTTP Server，迁移至仍在维护的 HTTP 服务器软件（如 Apache httpd、Nginx 或 Caddy）。若短期内无法替换，应在反向代理层（如 Nginx）配置 URL 规范化规则，拒绝包含 ../ 或 %2e%2e%2f 序列的请求，并关闭目录列表功能，同时限制 Web 根目录的读写权限，仅授予 Web 服务运行账户最小必要权限。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Robin Twombly A1 HTTP Server 目录遍历漏洞"
updated = "2026-06-16T21:54:01Z"

