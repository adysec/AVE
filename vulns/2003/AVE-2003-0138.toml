[basic]
description = "OpenSSH 3.7.1 之前版本在多个模块中存在缓冲区管理错误，包括 buffer.c 文件中的 buffer_init 和 buffer_free 函数，以及 channels.c 文件中的一个独立函数。未经身份认证的远程攻击者可以通过向目标 SSH 服务发送特制的网络数据包来触发这些缓冲区管理错误，成功利用后可能导致目标系统崩溃（拒绝服务）或执行任意代码。该漏洞影响所有运行受影响版本 OpenSSH 的类 Unix 系统，由于 SSH 服务通常监听在 22 端口且面向公网开放，攻击者无需凭据即可远程发起攻击，危害等级较高。建议管理员升级至 OpenSSH 3.7.1 或更高版本以修复此漏洞。"
published = "2003-10-06T04:00:00Z"
remediation = "建议立即将 OpenSSH 升级至 3.7.1 或更高版本，可从 https://www.openssh.com/ 下载安全补丁并重新编译安装。如暂时无法升级，可通过防火墙限制对 SSH 端口（22/tcp）的外部访问，或修改 sshd_config 禁用 Protocol 1 仅使用 Protocol 2 作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "OpenBSD OpenSSH 缓冲区管理错误远程代码执行漏洞"
updated = "2026-06-16T22:02:39Z"

