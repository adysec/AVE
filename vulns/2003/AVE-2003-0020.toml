[basic]
description = "MySQL 3.23.55 之前版本的 mysqld 中存在双重释放（double-free）漏洞。已拥有 MySQL 访问权限的攻击者可通过调用 mysql_change_user 函数触发该漏洞，导致服务崩溃，造成拒绝服务。该漏洞影响 MySQL 3.23.55 之前的所有版本，攻击者需具备数据库登录权限方可利用，无需身份认证即可触发。"
published = "2003-02-19T05:00:00Z"
remediation = "立即将 MySQL 升级至 3.23.55 或更高版本。Red Hat 用户安装 RHSA-2003:093/RHSA-2003:094/RHSA-2003:166 提供的更新包；Debian 用户应用 DSA-303 安全更新；Mandrake 用户安装 MDKSA-2003:013 补丁。如无法升级，通过防火墙限制 MySQL 端口（默认 3306）仅允许受信 IP 访问，并严格管理数据库用户权限，避免向不可信用户开放 mysql_change_user 操作权限。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "MySQL MySQL mysql_change_user 双释放拒绝服务漏洞"
updated = "2026-06-16T22:01:27Z"

