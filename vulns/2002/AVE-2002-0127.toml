[basic]
description = 'OpenLDAP 2.0 至 2.0.19 版本的 slapd 守护进程存在访问控制缺陷，本地用户及 2.0.8 之前的匿名用户可对访问控制列表执行不含任何值的 "replace" 操作，导致 OpenLDAP 删除本应受 ACL 保护的非强制属性。攻击者无需认证即可通过网络远程利用该漏洞，造成目标系统敏感属性被篡改或删除，影响数据的完整性和可用性。CVSS 评分 7.5，危害等级高。'
published = "2002-01-31T05:00:00Z"
remediation = "立即升级 OpenLDAP 至 2.0.20 或更高版本，可从 http://www.openldap.org/software/download/ 获取。如无法升级，可应用补丁 http://www.openldap.org/devel/cvsweb.cgi/servers/slapd/acl.c.diff?r1=1.27.2.18&r2=1.27.2.19 修复 slapd 的 ACL 检查逻辑。临时缓解措施：限制匿名用户绑定权限，在 slapd.conf 中将匿名用户访问控制设为 read 级别。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "OpenLDAP slapd 访问控制绕过漏洞"
updated = "2026-06-16T21:56:39Z"

