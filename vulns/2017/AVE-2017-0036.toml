[basic]
description = 'Apache CouchDB 在 1.7.0 之前版本及 2.x 系列 2.1.1 之前版本中存在 JSON 解析差异导致的权限提升漏洞。由于 Erlang 与 JavaScript 两种 JSON 解析器对重复键的处理方式不同，攻击者可通过向 _users 文档提交包含重复 "roles" 键的 JSON 数据，利用第二个 roles 键通过写入授权检查，而第一个 roles 键用于后续用户权限判定，从而将普通用户权限提升为 _admin 管理员权限。该漏洞无需身份认证即可远程利用，CVSS 评分 9.8，危害严重。结合 CVE-2017-12636（远程命令执行漏洞），非管理员用户可获得服务器操作系统级命令执行权限。'
published = "2017-11-14T20:29:00Z"
remediation = "升级到 Apache CouchDB 1.7.0 及以上版本，或 2.x 系列升级到 2.1.1 及以上版本。如无法立即升级，可在反向代理层限制 `_users` 和 `_admin` 端点的外部访问，仅允许受信任内网 IP 连接 CouchDB 的 5984 端口。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Apache CouchDB 越权创建管理员漏洞"
updated = "2026-06-17T01:03:42Z"

