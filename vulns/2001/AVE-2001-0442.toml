[basic]
description = "GNU findutils 中的 locate 命令在处理旧格式文件名数据库（locatedb）时存在内存写入漏洞。当 locatedb 文件中包含越界偏移量的条目时，locate 会向任意进程内存写入数据，导致本地攻击者可利用精心构造的 locatedb 文件触发该漏洞，从而提升权限至 root。该漏洞影响 Slackware 7.1 和 8.0 系统上的 findutils 4.1 版本，攻击者需具备本地用户权限并能够控制 locatedb 文件内容。成功利用后攻击者可完全控制目标系统。"
published = "2001-08-31T04:00:00Z"
remediation = "立即升级 GNU findutils 至 4.1.20 或更高版本（ftp.gnu.org/gnu/findutils/ 可下载），该版本修复了 locate 处理旧格式 locatedb 时越界偏移写入任意进程内存的问题。Slackware 用户应升级至 7.1/8.0 之后的安全更新版本。临时缓解措施：限制普通用户对 locatedb 数据库文件的写入权限，并确保数据库仅由受信进程生成。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "GNU findutils locate 任意命令执行漏洞"
updated = "2026-06-16T21:55:27Z"

