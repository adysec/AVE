[basic]
description = "华盛顿大学 c-client 库（被 pine 等邮件客户端使用）在处理邮件头 X-Keywords 时存在缓冲区溢出漏洞。远程攻击者无需身份认证，通过向目标发送特制的包含超长 X-Keywords 头的邮件即可触发该漏洞，导致缓冲区溢出，进而实现任意代码执行。该漏洞影响使用 c-client 库的 pine 及其他相关邮件程序，CVSS 评分 7.5，危害等级高。"
published = "2000-11-14T05:00:00.000"
remediation = "升级华盛顿大学 c-client 库至 2000 年 11 月之后发布的修复版本（如 imap-2000c 及以上），或应用针对 X-Keywords 头部长度检查的补丁。使用 pine 的用户应同步升级至与修复后 c-client 库链接的版本。如无法立即升级，可在邮件网关/MTA 层面过滤或截断超长 X-Keywords 头部作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "University of Washington c-client 库缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:52:35.527"

