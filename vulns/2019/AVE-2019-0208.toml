[basic]
description = "Pulse Secure Pulse Connect Secure (PCS) 存在路径遍历漏洞，未经身份认证的远程攻击者可通过向目标设备发送特制的 URI 请求，利用目录遍历技术读取服务器上的任意文件，包括系统配置文件、用户凭据、VPN 会话密钥等敏感信息。该漏洞影响 PCS 8.2R12.1 之前版本、8.3R7.1 之前版本及 9.0R3.4 之前版本，CVSS 评分 10.0，危害等级严重。攻击无需任何认证即可远程触发，且已出现大规模在野利用。厂商 Pulse Secure 已发布安全更新修复此漏洞。"
published = "2019-05-08T17:29:00.630"
remediation = "立即升级 Pulse Connect Secure 至以下安全版本：8.2R12.1、8.3R7.1 或 9.0R3.4 及以上。如无法立即升级，可在 Pulse Secure 设备上配置访问控制策略，限制外部 IP 对 /dana/ 路径的访问，并启用 Web Application Firewall 规则拦截包含 `../` 的 URI 请求作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["nuclei"]
title = "Pulse Secure Pulse Connect Secure 任意文件读取漏洞"
updated = "2026-06-17T02:13:04.277"

