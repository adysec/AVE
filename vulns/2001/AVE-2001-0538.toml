[basic]
description = "cgiCentral WebStore 400 的 WSSecurity.pl 认证脚本存在身份认证绕过漏洞。远程攻击者通过向该脚本提供一个已存在的文件名，可利用空字符截断或路径遍历（../）技术绕过管理员身份验证，从而未授权访问 WebStore 管理后台。攻击者无需任何凭证即可远程利用该漏洞，成功利用后可获取管理员权限，进而控制整个 WebStore 应用。该漏洞影响 cgiCentral WebStore 400 版本，CVSS 评分 7.5，危害等级高。"
published = "2001-06-12T04:00:00Z"
remediation = "该产品（cgiCentral WebStore 400）已停止维护且不再提供安全更新，建议立即迁移至受支持的现代购物车系统。如无法立即迁移，可采取以下缓解措施：在 Web 服务器配置中限制对 ws_mail.cgi 及 WSSecurity.pl 的访问，仅允许受信 IP 调用；删除或重命名 Statistics/ 目录下的可写文件；在 CGI 入口处过滤 %00（空字节）和 ../ 等路径遍历字符。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "cgiCentral WebStore 400 管理员身份认证绕过漏洞"
updated = "2026-06-16T21:56:05Z"

