[basic]
description = "Apple QuickTime 在处理 FlashPix 图像数据时存在未初始化内存访问漏洞。由于程序未能正确初始化内存位置，远程攻击者可构造特制的 FlashPix 文件，通过诱导用户打开该恶意文件触发漏洞，导致任意代码执行或应用程序崩溃（拒绝服务）。该漏洞影响 Mac OS X 10.6.x 至 10.6.5 之前版本中的 QuickTime 组件，攻击者无需身份认证，需用户交互配合。"
published = "2010-11-16T22:00:16Z"
remediation = "立即将 Mac OS X 升级至 10.6.5 或更高版本，同时将 QuickTime 升级至 7.6.9 或更高版本。可通过 Apple 菜单的「软件更新」功能自动获取更新，或从 Apple 支持网站下载安装。如无法立即升级，建议在浏览器中禁用 QuickTime 插件，并避免打开来源不明的 FlashPix 图片文件。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple QuickTime FlashPix 图像处理未初始化内存访问漏洞"
updated = "2026-06-16T23:23:33Z"

