[basic]
description = "Apple iOS/macOS 存在逻辑处理缺陷漏洞，攻击者可通过发送特制的网络数据包或利用浏览器引擎的缺陷触发该漏洞。未经身份认证的远程攻击者可在目标设备上执行任意代码。该漏洞影响 iOS 14.4 之前的版本、iPadOS 14.4 之前的版本以及 macOS Big Sur 11.2 之前的版本。Apple 已在后续安全更新中修复此漏洞，且 CISA 已确认该漏洞被在野利用。"
published = "2021-04-02T19:15:20.663"
remediation = "立即将 iOS/iPadOS 升级至 14.4 或更高版本，将 macOS Big Sur 升级至 11.2 或更高版本，或为 Catalina/Mojave 安装安全更新 2021-001。该漏洞为 WebKit 远程代码执行漏洞且已被证实存在野外主动利用，Apple 已发布补丁修复逻辑问题导致的权限绕过。建议在升级前临时禁用 Safari 浏览器并关闭 WebKit 相关服务以降低攻击面，升级后重启设备确保补丁生效。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Apple iOS 远程代码执行漏洞"
updated = "2026-06-17T03:32:41.847"

