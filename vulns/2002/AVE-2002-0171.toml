[basic]
description = "YaBB（Yet Another Bulletin Board）1 Gold SP1及更早版本存在跨站脚本漏洞。由于对用户提交的论坛消息中IMG标签内的Javascript代码编码形式过滤不严，远程攻击者可在论坛帖子中嵌入经过编码的恶意脚本代码。当其他用户浏览该帖子时，脚本会在受害者浏览器中执行，攻击者可借此窃取用户的Cookie认证凭据，实现会话劫持。攻击者无需身份认证即可通过构造特制的论坛消息触发该漏洞，影响范围广泛。"
published = "2002-03-25T05:00:00Z"
remediation = "升级 YaBB 至 1 Gold SP 1 之后的补丁版本，该版本已修复 IMG 标签中编码 JavaScript 的过滤问题。由于 YaBB 已停止维护，建议迁移至其他活跃维护的论坛软件（如 phpBB、Discourse）。临时缓解措施可在论坛配置中禁用 IMG BBCode 功能，或在 Web 应用防火墙层面对包含 `javascript:` 协议的 IMG 标签请求进行拦截。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "YaBB 跨站脚本漏洞"
updated = "2026-06-16T21:56:49Z"

