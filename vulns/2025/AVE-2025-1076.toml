[basic]
description = "Linux 内核中 Hyper-V 帧缓冲（hyperv_fb）驱动程序存在释放后使用漏洞。当 Hyper-V 帧缓冲设备被解绑时，驱动程序强制释放帧缓冲，若该帧缓冲仍在使用中会触发内核警告并导致资源泄漏。本地低权限攻击者可通过反复绑定/解绑帧缓冲设备触发该漏洞，造成内核内存损坏，进而实现本地权限提升或系统拒绝服务。该漏洞影响所有使用 Hyper-V 虚拟显卡的 Linux 内核版本，CVSS 评分 7.8，危害等级高。攻击者需要具有本地登录权限并能够加载/卸载内核模块。修复方式为将帧缓冲释放操作移至 fb_ops.fb_destroy 回调函数，由帧缓冲框架优雅处理释放流程，并使用 devm_register_framebuffer 替代手动注册/注销。"
published = "2025-04-01T16:15:28Z"
remediation = "建议立即升级 Linux 内核至 6.6.30、6.8.9、6.9.1 或更高版本（包含修复提交 fbdev: hyperv_fb: Allow graceful removal of framebuffer）。各发行版用户请安装对应安全更新：Ubuntu 22.04/24.04 执行 `apt update && apt install linux-image-generic`，RHEL/CentOS 执行 `yum update kernel`，Debian 执行 `apt update && apt install linux-image-amd64`。无法立即升级时，可在 Hyper-V 虚拟机中禁用 framebuffer 设备（`echo 0 > /sys/bus/vmbus/devices/*/remove` 卸载 hyperv_fb 模块）作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 fbdev hyperv_fb 本地权限提升漏洞"
updated = "2026-07-30T06:22:01Z"

