[basic]
description = "Linux 内核 PCI/ASPM 子系统中存在释放后使用（Use-After-Free，CWE-416）漏洞。在 PCIe 交换机上游端口的 multifunction 设备（MFD）场景中，当移除非 function 0 的设备时，ASPM 链路状态被过早释放，导致该链路仍作为下游端口的 parent_link 被引用，形成悬垂指针。攻击者可在具备本地低权限的条件下，通过热插拔操作以特定顺序移除设备触发该漏洞，造成系统崩溃（GPF）或潜在权限提升。该漏洞影响多个 Linux 内核版本（如 5.4.x、5.10.x 系列），CVSS 评分 7.8，危害等级高。"
published = "2025-04-16T15:15:53Z"
remediation = "立即更新 Linux 内核至以下已修复版本：主线 ≥ 6.5，或稳定分支 ≥ 5.4.292、5.10.236、5.15.180、6.1.134、6.3.13、6.4.4（对应各 LTS 分支）。如无法立即升级，可在 BIOS 层面禁用 ASPM（Active State Power Management）作为临时缓解措施，但可能影响 PCIe 设备功耗管理。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 PCI/ASPM 释放后使用漏洞"
updated = "2026-07-16T12:16:43Z"

