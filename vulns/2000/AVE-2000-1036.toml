[basic]
description = "Bardon Data Systems WinU 1.0 至 5.1 版本存在硬编码后门密码漏洞。该软件的管理界面预设了一个未公开的后门密码，远程攻击者无需正常认证即可通过该密码直接登录管理后台，进而完全控制并修改系统配置。攻击者只需知道目标 WinU 服务的网络地址即可发起攻击，无需任何用户交互或特殊权限。该漏洞影响范围广泛，可导致敏感信息泄露、服务配置被篡改等严重后果。"
published = "2000-12-19T05:00:00Z"
remediation = "WinU 已停止维护且厂商网站已不可访问，建议立即迁移至其他受支持的 FTP/管理工具（如 FileZilla Server 或 ProFTPD）。如因业务原因必须继续使用 WinU，应在防火墙层面将管理端口（默认 21）的访问来源限制为可信 IP 段，并确保该软件不暴露在公网环境中。同时检查并修改 WinU 的默认后门密码，避免攻击者利用已知后门凭据获取管理权限。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Bardon Data Systems WinU 后门密码漏洞"
updated = "2026-06-16T21:52:55Z"

