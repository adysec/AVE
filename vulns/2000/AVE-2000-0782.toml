[basic]
description = "Microsoft SQL Server 7.0/2000 及 Microsoft SQL Server Desktop Engine (MSDE) 1.0/2000 中的 xp_showcolv 扩展存储过程函数存在缓冲区溢出漏洞。该函数在调用 SQL Server 扩展存储过程 API 中的 srv_paraminfo 函数之前，未正确限制缓冲区长度，导致攻击者可通过向 xp_showcolv 传递特制参数触发缓冲区溢出，进而造成服务拒绝或执行任意命令。攻击者需要具有本地登录权限才能利用此漏洞，无法远程直接利用。"
published = "2001-01-09T05:00:00Z"
remediation = "安装 Microsoft 安全公告 MS00-092 提供的补丁：SQL Server 7.0 用户应先安装 Service Pack 2 再应用补丁（后续 SP3 已包含此修复）；SQL Server 2000 用户直接应用补丁（后续 Service Pack 1 已包含此修复）。MSDE 1.0 和 MSDE 2000 用户同样安装对应补丁。如无法安装补丁，作为临时缓解措施，可撤销对受影响扩展存储过程（xp_showcolv 等）的 EXECUTE 权限，或限制仅允许受信管理员账户连接数据库。"
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "Microsoft SQL Server xp_showcolv 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:06Z"

