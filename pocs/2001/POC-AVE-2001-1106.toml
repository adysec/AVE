[info]
author = "ave"
description = "验证 wwwwais 网关程序是否存在缓冲区溢出漏洞，通过发送包含超长 QUERY_STRING 的 HTTP GET 请求检测目标是否受影响。"
id = "POC-AVE-2001-1106"
name = "CVE-2001-0223 PoC"
severity = "critical"
tags = ["ave-2001-1106"]
vuln_id = [
    "CVE-2001-0223",
    "AVE-2001-1106",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi-bin/wwwwais"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "500",
    "Internal Server Error",
    "Segmentation fault",
    "buffer overflow",
]
