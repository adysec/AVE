[basic]
description = "TransSoft Broker FTP Server 3.0.x 及 4.0.x 版本在用户认证处理过程中存在缓冲区溢出漏洞。远程攻击者无需身份验证，即可通过向 FTP 服务发送超长用户名或命令参数触发该溢出，导致缓冲区边界被破坏。成功利用该漏洞可造成 FTP 服务拒绝服务崩溃，并在特定条件下可能进一步执行任意系统命令，从而完全控制目标服务器。该漏洞影响运行 TransSoft Broker FTP Server 早期版本的 Windows/Linux 系统，只要 FTP 端口对外暴露，攻击者即可通过网络远程发起利用。TransSoft 已在 4.3.0.1 及后续版本中修复此问题。"
published = "2001-01-09T05:00:00.000"
remediation = "建议将 TransSoft Broker FTP Server 升级至 4.3.0.1 或更高版本以修复缓冲区溢出漏洞。如无法立即升级，应在防火墙或网络层面限制 FTP 服务（端口 21）的访问来源，仅允许可信 IP 连接，并禁用匿名登录功能作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "TransSoft Broker FTP Server 用户名缓冲区溢出漏洞"
updated = "2026-06-16T21:53:10.893"

