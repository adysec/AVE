[basic]
description = "Linux 内核中的 strncpy 函数实现在非 x86 架构上（如 ARM、MIPS、PowerPC、SPARC 等）存在信息泄露漏洞。与标准 C 库中 strncpy 会在复制字符串后将缓冲区剩余部分用零字符填充不同，Linux 2.4.x 和 2.5.x 内核的自有 strncpy 实现未对缓冲区进行零填充，导致缓冲区末尾残留之前的内核内存数据。众多内核驱动程序错误地依赖了 C 库中 strncpy 的零填充语义，攻击者可通过向目标系统发送特制网络请求触发受影响的内核代码路径，利用此差异将内核空间中的少量内存数据泄露至用户空间，从而可能获取加密密钥、密码或其他敏感信息。该漏洞无需身份认证即可远程利用，但每次泄露的数据量较小，实际获取关键信息的概率有限。Red Hat 在 RHSA-2004-188 安全公告中发布了修复补丁，Ubuntu 6.06 LTS 和 6.10 亦通过内核更新 2.4.27-12 解决了该问题。该漏洞 CVSS 评分为 5.0（中危）。"
published = "2003-08-18T04:00:00Z"
remediation = "建议将 Linux 内核升级至 2.4.22 或更高版本，该版本已修复非 x86 架构下 strncpy 函数未对缓冲区进行 %NUL 填充导致的信息泄露问题。对于仍在使用 2.4 系列内核的系统（如 Ubuntu 6.06 LTS/6.10），应升级至 kernel-source-2.4.27-12 或更高版本；Red Hat Enterprise Linux 用户应安装 RHSA-2004-188 安全补丁。如无法立即升级内核，可临时通过系统调用过滤或禁用非必要用户态程序访问敏感内核接口来降低风险。升级后需重启系统以加载新内核。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux 内核 信息泄露漏洞"
