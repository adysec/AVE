[basic]
description = "tags.<value>Adobe Flash Player 9.0.124.0 及更早版本在解析跨域策略文件（crossdomain.xml）时存在访问控制绕过漏洞。该漏洞源于 Flash Player 未能正确解释策略文件内容，导致远程攻击者可绕过非根域安全策略限制，使 Flash 内容能够访问其他域原本受保护的资源。当用户访问包含恶意 Flash 内容的网页时，攻击者可通过构造特殊的策略文件或 Flash 应用程序，诱使 Flash Player 错误解析域策略，从而实现跨域数据窃取或未授权访问。该漏洞影响所有在浏览器中启用 Flash 插件的用户，攻击者无需身份验证即可在受害者浏览器中执行恶意操作，造成敏感信息泄露。"
published = "2008-11-10T14:12:55Z"
remediation = "立即将 Adobe Flash Player 升级至 9.0.151.0 或更高版本，可通过访问 https://get.adobe.com/flashplayer/ 下载官方最新安装包。升级前建议先关闭浏览器，完成后重启浏览器以确保新版本生效。对于浏览器内嵌 Flash 的版本（如 Firefox、Chrome、Safari），需同时更新浏览器插件。如无法立即升级，可在浏览器设置中禁用 Flash 插件作为临时缓解措施，或通过防火墙规则阻止 Flash 内容的远程加载。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Adobe Flash Player 策略文件解析绕过访问控制漏洞"
updated = "2026-06-16T22:58:36Z"

