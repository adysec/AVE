[basic]
description = "` tags.<value>GNU C 库（glibc）2.1.3 版本在处理 LD_PRELOAD 环境变量时存在权限验证缺陷。当 SUID 或 SGID 程序运行时，glibc 未对 /etc/ld.so.cache 中预加载的共享库进行 SUID/SGID 权限校验，导致本地攻击者可利用该漏洞加载非特权库文件，进而覆盖任意系统文件，实现本地权限提升。该漏洞影响配置了 SUID/SGID 的应用程序，攻击者需具备本地登录权限，通过设置 LD_PRELOAD 指向恶意共享库即可触发。攻击者可借此获取更高权限，对系统机密性与完整性造成威胁。"
published = "2001-03-26T05:00:00.000"
remediation = "升级 glibc 至 2.1.4 或更高版本以修复 LD_PRELOAD 权限验证缺陷。临时缓解措施包括：清理 /etc/ld.so.cache 中非 SUID/SGID 的库条目，限制本地用户对该文件及 /lib、/usr/lib 目录的写权限，并在安全策略中禁用 SUID/SGID 程序对 LD_PRELOAD 环境变量的继承。确保系统及时应用厂商安全更新。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "GNU glibc LD_PRELOAD 本地权限提升漏洞"
updated = "2026-06-16T21:53:48.020"

