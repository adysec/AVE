[basic]
description = "glFTPD 1.23 及更早版本中存在拒绝服务漏洞。远程攻击者无需身份认证即可通过 FTP 的 LIST 命令，向服务器发送包含大量星号（*）字符的特殊参数，导致服务器 CPU 资源被耗尽，造成拒绝服务。该漏洞利用方式简单，仅需具备网络访问能力即可触发，影响所有运行 glFTPD 1.x 版本的服务器系统。"
published = "2001-08-31T04:00:00Z"
remediation = "升级至 glFTPD 2.0 或更高版本，该版本已修复 LIST 命令参数中大量星号导致的 CPU 耗尽问题。如无法升级，可在服务端配置中限制 LIST 命令参数长度或禁用通配符扩展作为临时缓解措施。由于该软件已停止维护，建议迁移至 actively maintained 的 FTP 服务器软件（如 vsftpd、ProFTPD）。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "glFTPD 1.23 LIST命令拒绝服务漏洞"
updated = "2026-06-16T21:55:19Z"

