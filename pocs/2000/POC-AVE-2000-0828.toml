[info]
author = "ave"
description = "验证 Microsys CyberPatrol 注册信息是否以弱编码或明文在网络中传输，检测信用卡号等敏感数据的保护机制"
id = "POC-AVE-2000-0828"
name = "Microsys CyberPatrol Insecure Registration PoC"
severity = "medium"
tags = ["ave-2000-0828"]
vuln_id = [
    "CVE-2000-1173",
    "AVE-2000-0828",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/register"
protocol = "http"

[poc.requests.body]
content = "CARD=4111111111111111&EMAIL=test@test.com&EXP=1225&NAME=Test+User&ADDR1=123+Main+St&CITY=Anytown&PHONE=5551234"
type = "form"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "CyberPatROL/4.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "z",
    "{",
    "x",
    "y",
]

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "EMAIL",
    "CARD",
    "NAME",
]
