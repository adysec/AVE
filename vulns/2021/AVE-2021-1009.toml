[basic]
description = "Microsoft Exchange Server 存在服务端请求伪造（SSRF）漏洞（CWE-918），攻击者无需身份认证即可向 Exchange 的 Cafe（前端代理服务）发送特制的 HTTP 请求，将任意请求转发至 Exchange 后端服务，从而绕过认证机制获取敏感信息。该漏洞影响 Exchange Server 2013/2016/2019 版本，CVSS 评分高达 9.1，危害等级严重。在 ProxyLogon 利用链中，该漏洞可与 CVE-2021-26857（.NET 反序列化）及 CVE-2021-27065（任意文件写入）等漏洞组合利用，最终实现未经身份验证的远程代码执行。CISA 已将其列入已知被利用漏洞目录（KEV），证实其在野被活跃利用并关联勒索软件攻击。Microsoft 已在 2021 年 3 月安全更新中修复此漏洞，受影响用户应立即安装安全补丁。"
published = "2021-03-03T00:15:12Z"
remediation = "立即安装 Microsoft 2021 年 3 月安全更新 KB5000871（Exchange 2013 需先安装 CU 23，Exchange 2016 需先安装 CU 19 或 CU 18，Exchange 2019 需先安装 CU 8 或 CU 7），或升级到包含该修复的 Exchange 2016 CU 20 / Exchange 2019 CU 9。如无法立即打补丁，可先在 IIS 中配置 URL 重写规则阻断外部发起的 SSRF 请求，或使用 Exchange 本地缓解工具 EOMT（https://aka.ms/eomt）进行临时缓解。补丁安装后需检查 Exchange HttpProxy 日志中 AnchorMailbox 含 ServerInfo~ 模式的访问记录，排查是否存在被利用痕迹，并使用 Microsoft Safety Scanner（MSERT）扫描服务器上的 WebShell。"
score = 9.1
severity = "CRITICAL"
sources = ["kev"]
title = "Microsoft Exchange Server 服务器端请求伪造漏洞"
updated = "2026-06-17T03:43:51Z"

