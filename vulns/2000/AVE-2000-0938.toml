[basic]
description = "CA ARCServeIT Client Agent 6.62 的 uagentsetup 组件存在临时文件权限检查缺陷，该组件在将临时文件移动至 agent.cfg 配置文件前未验证文件存在性与所有权，导致本地攻击者可通过在移动操作前篡改临时文件内容，实现任意命令执行并完全控制受影响系统。该漏洞影响 ARCServeIT Client Agent 6.62 版本，攻击向量为本地，攻击复杂度低，无需身份认证，可造成机密性、完整性、可用性完全丧失，CVSS 评分 7.2（高危）。"
published = "2000-10-20T04:00:00Z"
remediation = "立即升级到 ARCServeIT Client Agent 6.62 的最新版本（或更高版本），以获取官方修复。临时文件应使用安全建立方式，如使用 `tmpfile()` 函数或在建立后立即验证其权限。强制要求临时文件必须由 root 所有者并具有严格的权限限制（如 0700）。部署时使用文件完整性监控工具，验证 agent.cfg 文件的哈希值。生产环境中应禁用对临时目录的写访问权限，并应用 AppArmor/SELinux 安全策略以限制命令执行。定期备份配置，并在更新后验证备份的完整性。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Computer Associates ARCServeIT Client Agent 本地代码执行漏洞"
updated = "2026-06-16T21:52:28Z"

