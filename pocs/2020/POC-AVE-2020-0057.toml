[info]
author = "ave"
description = "检测 Spring Framework 是否存在 SpEL 注入漏洞"
id = "POC-AVE-2020-0057"
name = "Spring Framework SpEL Injection PoC"
severity = "high"
tags = ["cve-2020-11981"]
vuln_id = [
    "CVE-2020-11981",
    "AVE-2020-0057",
]

[poc]
logic = "all"

