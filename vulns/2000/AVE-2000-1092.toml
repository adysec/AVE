[basic]
description = "602Pro LAN SUITE 2000.0.1.33 之前版本中的远程 Web 管理组件（webprox.dll）存在缓冲区溢出漏洞。远程攻击者可通过向目标系统发送超长 GET 请求触发该漏洞，导致拒绝服务，甚至可能执行任意代码。该漏洞影响 602Pro LAN SUITE 2000.0.1.33 之前版本，CVSS 评分 7.5，危害等级高。厂商已发布补丁修复此漏洞。"
published = "2001-01-09T05:00:00Z"
remediation = "立即升级 602Pro LAN SUITE 至 2000.0.1.33 或更高版本，该版本修复了 webprox.dll 中处理 GET 请求时的缓冲区溢出问题。如无法升级，在防火墙中限制对远程 Web 管理端口（默认 80/8080）的访问，仅允许可信 IP 连接，并禁用不必要的 Web 管理功能。该产品已停止维护，建议迁移至仍在安全更新的替代方案。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "602Pro LAN SUITE 远程Web管理组件缓冲区溢出漏洞"
updated = "2026-06-16T21:53:10Z"

