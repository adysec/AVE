[basic]
description = "BearShare 2.2.2及更早版本存在目录遍历漏洞，攻击者无需认证即可通过构造包含连续点号字符序列的URL发起攻击。该漏洞是传统..（点 dot）路径遍历攻击的变体形式，远程攻击者利用此漏洞可突破目录访问控制，读取服务器上的敏感文件。攻击条件宽松，仅需网络可达且无需身份验证，攻击复杂度低。受影响范围为BearShare 2.2.2及之前所有版本，成功利用可导致敏感信息泄露，危害等级为中危。"
published = "2001-06-27T04:00:00Z"
remediation = "建议立即升级到 BearShare 2.3 或更高版本以修复目录遍历漏洞。如无法升级，应在防火墙或路由器层面阻断来自外部的 BearShare 端口连接（通常为 TCP 6346），仅允许受信任的内网节点访问。同时，在运行 BearShare 的计算机上限制应用程序对敏感文件和系统目录的读取权限，避免运行于管理员账户下。若业务无需继续使用 BearShare，建议直接卸载该软件以彻底消除风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "BearShare 目录遍历漏洞"
updated = "2026-06-16T21:54:10Z"

