[info]
author = "ave"
description = "验证 safeurl 库是否允许访问未屏蔽的 IPv6 内部地址段（64:ff9b:1::/48、5f00::/16、3fff::/20、100:0:0:1::/64），检测 SSRF 防护绕过漏洞 CVE-2026-54452"
id = "POC-AVE-2026-0530"
name = "Doyensec safeurl IPv6 CIDR Blacklist Bypass PoC"
severity = "medium"
tags = [
    "cve-2026-54452",
    "ssrf",
    "safeurl",
    "ipv6-bypass",
]
vuln_id = [
    "CVE-2026-54452",
    "AVE-2026-0530",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["200"]
