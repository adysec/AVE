[basic]
description = "HP JetDirect 打印机网卡固件 x.08.20 及更早版本的 IP 协议实现中存在拒绝服务漏洞。远程攻击者无需身份认证即可通过网络向目标打印机发送特制的畸形 IP 数据包，触发固件 IP 处理模块解析异常，导致打印机崩溃或停止响应。该漏洞影响 HP JetDirect 系列打印机网卡，攻击条件简单，仅需目标打印机网络可达即可实施攻击，CVSS 评分 5.0，危害等级中危。"
published = "2000-12-11T05:00:00.000"
