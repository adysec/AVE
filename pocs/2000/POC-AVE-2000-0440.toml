[info]
author = "AVE"
description = "检测 KDE 1.1.2 KApplication 配置文件管理漏洞，通过检查 KDE 配置目录是否存在且可写，验证本地攻击者能否通过符号链接攻击覆盖任意文件以提升权限"
id = "POC-AVE-2000-0440"
name = "KDE KApplication 配置文件管理本地权限提升漏洞 PoC"
severity = "high"
tags = [
    "cve-2000-0530",
    "kde",
    "local-privilege-escalation",
    "symlink",
]
vuln_id = [
    "CVE-2000-0530",
    "AVE-2000-0440",
]

[poc]
logic = "all"

[[poc.requests]]
path = "~/.kde"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = ".+"
type = "regex"
