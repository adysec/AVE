[basic]
description = "Microsoft Office 存在安全功能绕过漏洞，该漏洞源于 Office 安全机制（CWE-693）的防护不足。攻击者可通过诱导用户打开特制的 Office 文件，利用该漏洞绕过 Office 的安全防护功能（如受保护的视图、宏安全策略等），从而在用户系统上执行未经授权的操作，导致系统完整性及可用性受到高影响。该漏洞攻击复杂度低，无需特权，但需要用户交互。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:16:00.607"
remediation = '建议立即安装 Microsoft 2025 年 1 月安全更新，通过 Microsoft Update 或访问 https://aka.ms/OfficeSecurityReleases 获取最新补丁。Office 2016 用户需升级至 16.0.5483.1001 及以上版本；Office 2019/LTSC 2021/LTSC 2024 及 Microsoft 365 Apps 用户请安装对应渠道的最新安全更新。临时缓解措施：在组策略中启用"受保护视图"并禁用来自不受信任来源的宏执行。'
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Office 安全功能绕过漏洞"
updated = "2026-06-17T08:43:09.593"

