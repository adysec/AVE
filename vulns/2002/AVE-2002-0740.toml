[basic]
description = 'Perception LiteServe 2.0 至 2.0.1 版本存在 CGI 源代码泄露漏洞。该漏洞源于服务器在处理 HTTP 请求时对路径的验证不当，攻击者通过在请求的 CGI 脚本路径末尾添加一个尾部点号（"."），即可绕过服务器对脚本执行的限制，直接获取 CGI 脚本的原始源代码内容。该漏洞影响运行 LiteServe 的 Web 服务器，攻击者无需身份认证，只要能够通过网络访问目标服务器的 CGI 程序，即可通过构造特制的 HTTP 请求读取敏感源代码，可能导致数据库凭证、业务逻辑等敏感信息泄露，进而为后续攻击提供便利。'
published = "2002-12-31T05:00:00Z"
remediation = '建议立即迁移至 Apache HTTP Server 2.4+、Nginx 1.18+ 或 IIS 10+ 等现代 Web 服务器。若必须继续使用，请在前端部署 WAF（如 ModSecurity）添加规则拦截以点号结尾的 URL 请求（正则：\.\s*$），同时在 LiteServe 配置中禁用 CGI 功能（注释掉 cgi-isapi 别名映射），并限制 Web 目录执行权限防止源码泄露。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Perception LiteServe 2.0 CGI 源代码泄露漏洞"
updated = "2026-06-16T22:00:25Z"

