[info]
author = "AVE"
description = "通过 HTTP 请求检测目标是否存在 Windows MapUrlToZone 安全区域绕过漏洞。MapUrlToZone 是 Windows 中用于将 URL 映射到安全区域的组件，存在认证绕过漏洞，攻击者可利用此漏洞绕过安全区域限制。"
id = "POC-AVE-2025-0780"
name = "CVE-2025-21321 Windows MapUrlToZone Auth Bypass PoC"
severity = "critical"
tags = [
    "cve-2025-21321",
    "windows",
    "auth-bypass",
    "mapurltozone",
]
vuln_id = [
    "CVE-2025-21321",
    "AVE-2025-0780",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["windows"]
