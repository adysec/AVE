[info]
author = "AVE"
description = "检测目标服务器是否托管了利用 CVE-2017-0199 漏洞的恶意 RTF 文档。该漏洞通过 RTF 文档中的 OLE2Link 对象触发 Windows HTA 处理程序下载并执行远程代码。"
id = "POC-AVE-2017-0077"
name = "CVE-2017-0199 PoC"
severity = "high"
tags = [
    "cve-2017-0199",
    "rce",
    "office",
    "rtf",
]
vuln_id = [
    "CVE-2017-0199",
    "AVE-2017-0077",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/exploit.rtf"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    '{\rtf1',
    "objdata",
    "OLE2Link",
]
