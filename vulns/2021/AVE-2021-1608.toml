[basic]
description = "Apple macOS 系统的透明性、同意与控制（TCC）框架存在权限验证缺陷，攻击者可利用该漏洞绕过用户已授予的隐私偏好设置。受影响版本包括 macOS Big Sur 11.4 之前的所有版本以及 macOS Catalina 10.15.x。攻击者只需在目标系统上运行特制恶意应用程序，即可在未经用户授权的情况下访问摄像头、麦克风、位置信息、通讯录等隐私敏感资源，造成敏感信息泄露。Apple 已确认该漏洞存在野外利用，并在 macOS Big Sur 11.4 及 Security Update 2021-005 Catalina 中修复。"
published = "2021-09-08T15:15:15Z"
remediation = '升级 macOS 至 Big Sur 11.4 或更高版本。进入"系统偏好设置"→"软件更新"，点击"立即升级"完成 macOS Big Sur 11.4 安全更新的安装。如暂时无法升级，可在"系统偏好设置"→"安全性与隐私"→"隐私"选项卡中，逐一审查各应用的隐私权限，手动移除可疑应用的访问授权，作为临时缓解措施。Apple 已确认此漏洞可能已被积极利用，建议尽快完成系统更新。'
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Apple macOS 隐私偏好设置权限绕过漏洞"
updated = "2026-06-17T03:50:44Z"

