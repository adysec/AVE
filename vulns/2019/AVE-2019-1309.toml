[basic]
description = "FortiOS 存在默认配置缺陷导致的 LDAP 中间人攻击信息泄露漏洞。由于系统未对 LDAP 服务启用严格身份验证，处于同一子网的未认证远程攻击者可冒充 LDAP 服务器，截获客户端与服务器之间的敏感认证信息，如用户凭证等。该漏洞影响 FortiOS 多个版本，攻击者仅需与目标设备处于同一局域网即可实施攻击，无需任何身份认证或用户交互。CVSS v3.1 评分为 6.5（MEDIUM），攻击向量为邻接网络，影响机密性但不影响完整性与可用性。"
published = "2020-08-14T16:15:16Z"
remediation = "1. 升级至 FortiOS 6.2.1 或更高版本，全新安装时 server-identity-check 默认启用。2. 若从 6.0.3–6.2.0 升级至 6.2.1+，升级前后必须手动启用 LDAP server-identity-check，否则升级本身无法消除该漏洞。3. 登录 CLI 执行：config user ldap → edit <ldap-server> → set ca-cert <证书名称> → set secure ldaps → set server-identity-check enable，确保 LDAP 服务器证书已正确配置且通信使用 LDAPS。4. 如暂无法升级，可在网络层通过防火墙隔离 LDAP 服务器所在网段，阻止同网段未授权主机访问，作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Fortinet FortiOS LDAP 服务器身份验证绕过信息泄露漏洞"
updated = "2026-06-17T02:37:54Z"

