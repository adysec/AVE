[basic]
description = "perlshop.cgi是一个Perl编写的购物车CGI脚本，存在敏感信息泄露漏洞。漏洞原理是该脚本将客户的敏感信息（包括订单详情、个人资料等）存储在Web服务器根目录下的目录和文件中，未设置有效的访问控制机制。影响范围包括所有部署了该脚本的Web服务器。攻击条件为未经身份认证的远程攻击者能够通过网络访问目标服务器的HTTP服务。利用方式简单，攻击者仅需直接构造HTTP请求访问敏感文件路径，即可无需认证窃取客户隐私数据，造成信息泄露。"
published = "2005-05-02T04:00:00Z"
remediation = "立即将 perlshop.cgi 的敏感数据目录（客户信息、订单文件）移出 Web 根目录至不可通过 HTTP 直接访问的路径；在 Web 服务器配置中添加拒绝访问该目录的规则（如 Apache 用 `Require all denied`，Nginx 用 `deny all`）；若无法移动目录，请升级至 perlshop 修复版本或更换为现代购物车系统（如 Magento、OpenCart），并在防火墙层面限制仅受信 IP 访问管理后台。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "perlshop.cgi 敏感信息泄露漏洞"
updated = "2026-06-16T21:50:18Z"

