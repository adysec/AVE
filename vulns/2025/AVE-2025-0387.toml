[basic]
description = "Google Chrome（Windows 版）的全屏模式实现存在不当逻辑漏洞（CWE-290）。远程攻击者可通过构造特制的 HTML 页面，在用户浏览时利用该漏洞绕过浏览器的全屏安全提示机制，实施用户界面（UI）欺骗攻击。攻击成功后，用户可能误将恶意页面内容视为系统原生界面或可信内容，从而在不知情的情况下泄露敏感信息或执行非预期操作。该漏洞影响 Chrome 132.0.6834.83 之前的所有 Windows 版本，攻击条件为诱导用户访问恶意构造的网页，无需额外权限。Chromium 安全评级为中等，CVSS 评分 6.5。"
published = "2025-01-15T11:15:10Z"
remediation = "立即将 Google Chrome 升级至 132.0.6834.83 或更高版本，可通过 Chrome 菜单 > 帮助 > 关于 Google Chrome 自动检查更新。企业用户应通过组策略推送更新至全终端。该漏洞允许攻击者通过特制 HTML 页面实施 UI 欺骗，升级后可彻底修复全屏实现中的不当逻辑。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome 全屏实现不当导致界面欺骗漏洞"
updated = "2026-06-17T08:26:28Z"

