[basic]
description = "Google Chrome 15.0.874.120 之前版本中存在释放后使用（Use-After-Free）漏洞，位于编辑功能相关组件中。远程攻击者可诱使用户访问恶意构造的网页并执行特定编辑操作，触发已释放内存的引用，导致浏览器崩溃拒绝服务，或可能实现任意代码执行。该漏洞影响 Google Chrome 全平台版本，CVSS 评分 6.8，危害等级较高。"
published = "2011-11-11T11:55:02Z"
remediation = "立即将 Google Chrome 升级至 15.0.874.120 或更高版本，该版本于 2011 年 11 月发布，修复了编辑功能中的释放后重用漏洞。使用 Apple Safari 的用户应升级至 5.1.4 或更高版本。如无法升级，可禁用 JavaScript 或使用其他浏览器作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 编辑功能释放后使用漏洞"
updated = "2026-06-16T23:34:07Z"

