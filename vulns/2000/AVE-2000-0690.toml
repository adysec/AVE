[basic]
description = "CGI Script Center News Update 1.1 存在管理员密码修改验证绕过漏洞，该漏洞源于程序在密码修改操作时未正确验证原始管理员密码。远程未认证攻击者无需知道原管理员密码，即可直接通过发送特制的密码修改请求任意修改管理员密码，导致管理员账户被接管。该漏洞影响 News Update 1.1 版本，CVSS 3.1 评分 9.8（CRITICAL），攻击向量为网络、攻击复杂度低、无需权限、无需用户交互，机密性/完整性/可用性均受严重影响。攻击者可直接提交修改密码请求绕过原密码验证，实现管理员账户劫持。CVE 编号 CVE-2000-0944，CVE 编号分配机构于 2000-12-19 发布，ExploitDB 存在公开 PoC (EDB-179)。"
published = "2000-12-19T05:00:00.000"
remediation = "建议立即升级 News Update 至 1.2 或更高版本（如有官方修复版本），或迁移至现代化、维护中的新闻管理系统（如 WordPress 等）。若无法升级，请立即实施以下缓解措施：1) 在 Web 服务器层面（如 Apache/.htaccess 或 Nginx location）限制 admin 管理目录仅允许可信 IP 访问；2) 在密码修改逻辑中强制要求验证原密码，并在 CGI 脚本中添加服务端原密码校验逻辑；3) 为管理界面启用 HTTPS 并强制基于 IP 的访问控制列表（ACL）；4) 定期审核管理员账户，启用强密码策略并定期轮换。"
score = 9.8
severity = "CRITICAL"
sources = ["epss"]
title = "CGI Script Center News Update 1.1 密码变更验证漏洞"
updated = "2026-06-16T21:52:49.477"

