[basic]
description = "ypbind 3.3 存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过网络向运行 ypbind 服务的系统发送特制请求触发该漏洞，成功利用可导致缓冲区溢出，进而获得目标系统的 root 权限，实现完全控制。该漏洞影响使用 NIS（网络信息服务）协议且运行 ypbind 3.3 版本的 Unix/Linux 系统，CVSS 评分 10.0，危害等级严重。由于 ypbind 通常以 root 权限运行，攻击者利用后可直接获取系统最高权限，造成机密性、完整性和可用性的完全丧失。"
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 ypbind 至 3.3 之后的安全修复版本。Caldera 用户安装 CSSA-2000-039.0 补丁，Mandrake 用户安装 MDKSA-2000-064 更新，SuSE 用户应用 2000-10-27 发布的 ypbind 安全补丁。如业务不需要 NIS 服务，建议直接卸载 ypbind 软件包（rpm -e ypbind 或 apt-get remove ypbind）以彻底消除攻击面。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Sun ypbind 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:53:01.910"

