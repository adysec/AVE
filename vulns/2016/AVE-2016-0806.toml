[basic]
description = "Adobe Flash Player 存在释放后使用（Use-After-Free）漏洞，远程攻击者可通过诱导用户访问特制的恶意网页或打开恶意文件触发该漏洞，成功利用可在受影响系统上执行任意代码。该漏洞影响 Windows 和 OS X 平台上的 Flash Player 23.0.0.205 之前版本以及 Linux 平台上的 11.2.202.643 之前版本，CVSS 评分 8.8，危害等级高。Adobe 已在 2016 年 10 月安全更新中修复此漏洞，且该漏洞已在野外被积极利用。"
published = "2016-11-01T22:59:00Z"
remediation = "立即升级 Adobe Flash Player 至 23.0.0.205（Windows/macOS）或 11.2.202.643（Linux）及以上版本。由于 Adobe Flash 已于 2020 年底停止支持，建议彻底卸载 Flash Player 并迁移至 HTML5 以彻底消除风险。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Adobe Flash Player 释放后使用漏洞"
updated = "2026-06-17T00:53:36Z"

