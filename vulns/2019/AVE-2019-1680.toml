[basic]
description = "Apple iTunes for Windows 中的 WebKit 组件存在类型混淆（Type Confusion）漏洞，CWE-843。该漏洞源于 JavaScriptCore 引擎的 `createRegExpMatchesArray` 函数在处理特制网页内容时未能正确验证对象类型，导致内存处理不当。远程攻击者可诱导用户访问恶意构造的网页，触发类型混淆，从而在当前进程上下文中实现任意代码执行。受影响的版本包括 iTunes for Windows 12.9.3 及更早版本、iOS 12.2 之前版本、Safari 12.1 之前版本等。攻击需要用户交互（如点击恶意链接），但无需身份认证，CVSS 评分 8.8，危害等级高。Apple 已在 iOS 12.2、tvOS 12.2、watchOS 5.2、Safari 12.1、iTunes 12.9.4 for Windows 及 iCloud for Windows 7.11 中修复此漏洞。"
published = "2019-12-18T18:15:22Z"
remediation = "升级 iTunes for Windows 至 12.9.4 或更高版本，升级 iCloud for Windows 至 7.11 或更高版本，升级 Safari 至 12.1 或更高版本。iOS 设备升级至 12.2 或更高版本。如无法立即升级，可禁用 WebKit 解析不可信网页内容作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Apple iTunes for Windows WebKit 类型混淆远程代码执行漏洞"
updated = "2026-06-17T02:42:03Z"

