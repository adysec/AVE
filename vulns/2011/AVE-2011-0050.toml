[basic]
description = "Adobe Flash Player 10.3.181.14之前的Windows、Mac OS X、Linux及Solaris版本以及10.3.185.21之前的Android版本中存在内存破坏漏洞（CWE-119）。远程攻击者可通过诱导用户访问特制网页或打开恶意Flash文件，触发未指定向量的内存破坏，成功利用后可导致任意代码执行或拒绝服务。该漏洞无需身份认证，攻击复杂度中等，CVSS评分9.3，危害等级严重。Adobe已在2011年5月安全更新中发布修复版本。"
published = "2011-05-13T22:55:01Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.181.14 及以上版本（Windows/Mac/Linux/Solaris）或 10.3.185.21 及以上版本（Android）。由于 Adobe 已于 2020 年底停止支持 Flash Player，建议彻底卸载 Flash Player 并移除浏览器插件，改用 HTML5 替代方案，从根本上消除风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏漏洞"
updated = "2026-06-16T23:27:46Z"

