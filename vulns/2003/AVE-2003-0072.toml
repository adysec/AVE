[basic]
description = "Linux NFS utils 套件（nfs-utils）中 mountd 组件的 xlog 函数存在差一错误（Off-by-one）漏洞，版本低于 1.0.4 均受影响。远程攻击者可通过向 mountd 发送不含换行符的特定 RPC 请求触发该漏洞，导致拒绝服务，在特定条件下可能实现远程代码执行。该漏洞影响面广，CVSS 评分 9.8，危害等级严重。"
published = "2003-08-18T04:00:00.000"
remediation = 'The user wants me to generate a remediation field for CVE-2003-0252. This is an off-by-one error in the xlog function of mountd in nfs-utils before 1.0.4. The fix is to upgrade to nfs-utils 1.0.4 or later. Let me provide a specific, actionable remediation in Chinese with at least 20 characters.<value>立即将 nfs-utils 升级至 1.0.4 或更高版本。如无法升级，在 /etc/hosts.deny 中添加 "mountd: ALL" 并在 /etc/hosts.allow 中仅放行可信 IP，同时在防火墙层面限制对 RPC 端口 (111/TCP/UDP) 和 mountd 端口的访问。'
score = 9.8
severity = "CRITICAL"
sources = ["redhat"]
title = "Linux nfs-utils mountd 越界写入远程代码执行漏洞"
updated = "2026-06-16T22:01:50.363"

