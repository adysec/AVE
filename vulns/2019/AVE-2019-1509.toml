[basic]
description = "Nexus Repository Manager 3 是一款广泛使用的软件仓库管理程序。该产品在 3.15.0 及之前版本中，coreui_Component 模块的 /service/extdirect 接口存在访问控制缺陷，未经身份认证的远程攻击者可通过向该接口发送特制的 POST 请求，在 data 参数中注入 JEXL（Java Expression Language）表达式，利用 OrientDB 自定义函数功能触发任意代码执行。攻击者借助 Java 反射机制调用 Runtime.exec() 方法，可在目标服务器上以应用权限执行任意操作系统命令，从而完全控制服务器。该漏洞影响 Nexus Repository Manager 3.6.2 至 3.14.0 所有 OSS 及 Pro 版本，利用条件极为宽松，无需任何身份认证且攻击复杂度低，CVSS 评分高达 9.8，危害等级严重。Sonatype 已在 3.15.0 版本中修复此漏洞。"
published = "2019-03-21T17:29:01Z"
remediation = "立即将 Sonatype Nexus Repository Manager 3 升级到 3.15.0 或更高版本，以修复 coreui_Component 组件的访问控制缺陷。升级前请务必备份实例数据与配置，升级后验证匿名访问及敏感接口的权限设置，确保未授权用户无法调用脚本执行功能。如暂时无法升级，建议通过反向代理或防火墙限制对 /service/rest 等管理端点的外部访问，阻断未授权请求。参考链接：https://support.sonatype.com/hc/en-us/articles/360017310793-CVE-2019-7238-Nexus-Repository-Manager-3-Missing-Access-Controls-and-Remote-Code-Execution-February-5th-2019"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Sonatype Nexus Repository Manager 3 远程命令执行漏洞"
updated = "2026-06-17T02:40:18Z"

