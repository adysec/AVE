[basic]
description = "Adobe Acrobat Reader 存在越界写入漏洞（CWE-787），攻击者可构造恶意 PDF 文件诱导用户打开，当受害者在受影响的 Acrobat Reader 版本（24.001.30365、26.001.21651 及更早版本）中打开该文件时，漏洞被触发，导致在当前用户上下文中执行任意代码。该漏洞需要用户交互才能利用，影响 Windows 系统上安装受影响版本 Acrobat Reader 的用户，CVSS 评分 7.8，危害等级为高。"
published = "2026-06-09T21:17:20.837"
remediation = 'tags.<value>立即将 Adobe Acrobat Reader 升级到 24.001.30383 或 26.001.21662 及更高版本，通过 Adobe 帮助菜单中的"检查更新"功能或访问 Adobe 官网手动下载安装安全补丁。如暂无法立即升级，可在系统组策略中禁用 PDF 文件自动打开功能，并配置浏览器安全扩展阻止未知来源的 PDF 文件下载，以降低被利用风险。'
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Adobe Acrobat Reader 越界写入远程代码执行漏洞"
updated = "2026-07-23T09:10:00.113"

