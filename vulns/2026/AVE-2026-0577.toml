[basic]
description = "Flask-Reuploaded扩展存在文件名大小写不对称漏洞，攻击者可通过在name参数中提供混杂大小写的文件名（如“shell.PHP”）绕过安全验证。当应用程序使用扩展名拒绝列表时，默认上传路径会将文件名转换为小写形式（如“shell.php”），而name参数的重写路径会保留原始大小写（如“shell.PHP”），导致安全检查逻辑失效。由于某些操作系统和服务器（如Windows、macOS、Apache）对文件扩展名不区分大小写，攻击者能够上传被拒绝的危险文件类型（如PHP文件）。这导致攻击者可能在服务器上存储恶意脚本并执行代码，最终获得远程代码执行权限。该漏洞影响版本1.5.0及更早版本，是CVE-2026-27641漏洞的未修复变体，包含CWE-434（不受限制的危险文件类型上传）和CWE-178（大小写处理不当）攻击向量，评分7.0-7.3，等级为高危，对运行差异化大小写处理的Web服务器构成严重威胁。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级 Flask-Reuploaded 至 1.5.1+ 版本（待发布），或手动修补 flask_uploads.py:344 行将 `extension(basename)` 改为 `extension(basename).lower()` 以统一大小写校验；临时缓解可改用 allowlist（如 IMAGES）替代 denylist（AllExcept(SCRIPTS)），因 allowlist 采用默认拒绝策略不受大小写绕过影响。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Flask flask_uploads 扩展名安全检查缺陷"
updated = "2026-01-01T00:00:00Z"

