[basic]
description = "Grub2 的 romfs 文件系统模块在处理符号链接查找时存在整数溢出漏洞。该模块使用用户可控的文件系统几何参数来确定内部缓冲区大小，但未正确检查整数溢出，导致 grub_malloc() 分配的内存小于预期。当调用 grub_disk_read() 读取符号链接数据时，触发堆越界写入，可破坏 GRUB 内部关键数据结构。攻击者需具备本地高权限并构造恶意的 romfs 文件系统，成功利用后可绕过 Secure Boot 保护机制实现任意代码执行。"
published = "2025-03-03T18:15:30Z"
remediation = "升级 GRUB 至 2.14 或更高版本（上游已合入 romfs 符号链接整数溢出修复）；如无法升级，应用厂商安全补丁（Red Hat 已通过 RHSA 修复，执行 yum update grub2）；启用 Secure Boot 并确保 grub2 签名验证生效，禁用不受信任的自定义文件系统镜像加载作为临时缓解措施。"
score = 6.4
severity = "MEDIUM"
sources = ["msrc"]
title = "GNU GRUB2 romfs 文件系统符号链接处理整数溢出漏洞"
updated = "2026-06-30T00:16:50Z"

