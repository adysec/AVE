[basic]
description = "tags in the output.<value>SquirrelMail 的 read_body.php 存在跨站脚本（XSS）漏洞，攻击者可通过 mailbox 和 passed_id 参数向页面注入恶意脚本与 HTML 代码。该漏洞影响 SquirrelMail 1.2.10 及更早版本，无需身份认证即可触发。远程攻击者诱导已登录用户访问特制链接，即可在其浏览器中执行任意脚本，窃取会话令牌或执行其他恶意操作。CVSS 评分 6.8，危害等级中等。"
published = "2002-12-18T05:00:00.000"
remediation = "立即升级 SquirrelMail 至 1.4.4 或更高版本，该漏洞已在上游版本中对 read_body.php 的 mailbox 和 passed_id 参数添加了输入过滤验证，从而修复跨站脚本注入问题。使用 Debian woody 的系统可应用 Debian 安全公告 DSA-220 并升级至 squirrelmail 1.2.6-1.3；使用 Debian unstable 的系统请升级至 1:1.3.2-2；Red Hat Enterprise Linux 用户请安装 Red Hat 安全公告 RHSA-2003-042 中的补丁；Ubuntu 6.06 LTS dapper 用户升级至 1.4.6-1ubuntu0.1、Ubuntu 6.10 edgy 升级至 1.4.8-1ubuntu0.1、Ubuntu 7.04 feisty 升级至 1.4.9a-1ubuntu0.1。如因业务限制暂无法升级，可临时在 Web 服务器配置中对 read_body.php 的请求参数严格过滤，禁止包含 &lt;script&gt; 及 javascript: 伪协议的请求，并严格限制 Web 服务器对临时数据目录的写入权限，以降低攻击面。"
score = 6.8
severity = "MEDIUM"
sources = ["redhat"]
title = "SquirrelMail read_body.php 跨站脚本漏洞"
updated = "2026-06-16T21:59:08.307"

