[basic]
description = 'PHP-Nuke 5.6 及之前版本的 modules.php 中存在 SQL 注入漏洞。已通过身份认证的远程攻击者可通过向 "bio" 参数注入恶意 SQL 语句，操纵后端数据库，实现数据篡改、权限提升等操作。该漏洞影响 PHP-Nuke 6.0 之前的所有版本，CVSS 评分 7.5，危害等级高。'
published = "2002-11-12T05:00:00Z"
remediation = "升级 PHP-Nuke 至 6.0 或更高版本，该版本已修复 modules.php 中 bio 参数的 SQL 注入漏洞。如无法升级，在 modules.php 中对所有用户输入（特别是 bio 参数）使用 addslashes() 或数据库驱动提供的参数化查询进行过滤，并限制普通用户对敏感数据库操作的权限。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "PHP-Nuke 5.6 modules.php SQL注入漏洞"
updated = "2026-06-16T21:58:59Z"

