[basic]
description = "Google Chrome 的 V8 JavaScript 引擎存在越界读取漏洞，远程攻击者可通过构造特制的 HTML 页面诱导用户访问，触发 V8 引擎中的越界内存访问，导致机密性、完整性和可用性均受到严重影响。该漏洞影响 Google Chrome 134.0.6998.88 之前版本，CVSS 评分 8.8，危害等级高。用户需升级至 Chrome 134.0.6998.88 或更高版本以修复此漏洞。"
published = "2025-03-10T21:15:40.857"
remediation = "升级 Google Chrome 至 134.0.6998.88 或更高版本。基于 Chromium 的浏览器（如 Edge、Brave）应更新至对应最新版本。无法立即升级时，可禁用 V8 JIT（通过启动参数 `--js-flags=--jitless`）作为临时缓解措施，但会显著影响性能。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 越界读取漏洞"
updated = "2026-06-17T09:06:24.227"

