[basic]
description = "Microsoft 消息队列（MSMQ）服务存在拒绝服务漏洞。该漏洞源于 MSMQ 组件对特制网络请求的处理不当，未经身份认证的远程攻击者可通过向目标系统的 MSMQ 服务（默认端口 1801）发送精心构造的数据包，触发无限循环或资源耗尽，导致 MSMQ 服务停止响应，造成拒绝服务。该漏洞影响多个 Windows 版本，CVSS 评分 7.5，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:50Z"
remediation = '立即安装 Microsoft 2025 年 1 月安全更新 (KB5050061)，或通过 Windows Update 自动获取更新。受影响版本包括 Windows 10/11 及 Windows Server 2008~2025 全系列，各版本修复后的具体版本号见 MSRC 公告。如无法立即打补丁，可在不需要 MSMQ 服务的系统上通过"控制面板 → 程序和功能 → 打开或关闭 Windows 功能"取消勾选"Microsoft 消息队列 (MSMQ)"以禁用该组件，或在防火墙层面阻止外部对 TCP 端口 1801 的访问作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft 消息队列 (MSMQ) 拒绝服务漏洞"
updated = "2026-06-17T08:43:00Z"

