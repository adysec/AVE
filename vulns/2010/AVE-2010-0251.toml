[basic]
description = "Apple QuickTime 7.6.9 之前版本在处理 QuickTime 虚拟现实（QTVR）影片文件中的全景原子（panorama atom）时存在整数符号错误（Integer Signedness Error），远程攻击者可构造特制的 QTVR 影片文件，诱导用户打开后触发内存破坏，导致应用程序崩溃或任意代码执行。该漏洞影响 Windows 和 macOS 平台上的 QuickTime 7.6.9 及更早版本，CVSS 评分 9.3，危害严重。攻击者需通过社会工程手段诱使用户访问恶意文件，无需身份认证即可远程利用。"
published = "2010-12-09T20:00:17Z"
remediation = "立即升级 Apple QuickTime 至 7.6.9 或更高版本。由于 Apple 已停止对 Windows 版 QuickTime 的安全支持，建议在 Windows 系统上彻底卸载 QuickTime，改用其他支持的媒体播放器。如无法卸载，可在浏览器中禁用 QuickTime 插件，并避免打开来源不明的 .mov/.qtvr 文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime QTVR 全景原子整数符号错误远程代码执行漏洞"
updated = "2026-06-16T23:23:33Z"

