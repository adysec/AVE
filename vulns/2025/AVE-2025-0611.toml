[basic]
description = "lief-project LIEF ELF 二进制解析器在解析二进制文件时存在空指针取消引用漏洞。攻击者可通过向目标系统提供特制的 ELF 二进制文件触发该漏洞，导致程序崩溃。该漏洞影响 LIEF 项目 0.17.1 及更早版本，攻击需在本地环境下执行且需要低权限。CVE-2025-15504 的 CVSS 评分为 1.9，危害等级较低。lief-project 已在 0.17.2 版本中修复此漏洞，用户应及时升级以获取防护。"
published = "2026-01-10T12:15:49Z"
remediation = "建议立即升级 lief-project LIEF 至 0.17.2 或更高版本（修复提交：81bd5d7ea0c390563f1c4c017c9019d154802978）。若暂时无法升级，可避免解析不可信的 ELF 二进制文件，或在沙箱环境中运行解析器以限制本地攻击影响。"
score = 1.9
severity = "LOW"
sources = ["msrc"]
