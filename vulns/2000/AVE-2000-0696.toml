[basic]
description = "Novell BorderManager 3.0 和 3.5 版本存在安全绕过漏洞，攻击者通过在请求的 URL 中对特定字符进行编码，可绕过系统的 URL 过滤机制。该漏洞无需身份认证即可被远程利用，攻击者发送经过编码的恶意 URL 请求即可绕过内容过滤规则，访问被禁止的资源或执行未授权操作。CVSS 评分为 5.8，危害等级为中等。"
published = "2000-07-05T04:00:00.000"
remediation = "建议升级至 Novell 官方提供的修复补丁或最新 Support Pack；同时需在代理服务器配置中启用 URL 规范化检查，对请求路径先做完全 URL 解码再匹配黑白名单规则，防止编码绕过。由于 Novell BorderManager 已停止技术支持多年，强烈建议迁移至受支持的现代安全网关或代理产品（如 Squid、Palo Alto Networks 等）作为根本解决方案。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Novell BorderManager URL过滤安全绕过漏洞"
updated = "2026-06-16T21:52:03.947"

