[basic]
description = "Adobe Flash Player 在 Windows、Mac OS X、Linux、Solaris 及 Android 平台上，当配合 Internet Explorer 浏览器使用时，存在跨域策略绕过漏洞。该漏洞源于 Flash Player 未能正确执行跨域安全策略检查，远程攻击者可通过构造恶意网站，诱使用户访问，从而绕过同源策略限制，实现跨域读取敏感数据或执行未授权操作。攻击条件为用户使用 IE 浏览器访问攻击者控制的恶意网站，无需额外认证，危害严重。"
published = "2011-11-11T16:55:01Z"
remediation = "升级 Adobe Flash Player 至 10.3.183.11/11.1.102.55（Windows/Mac/Linux/Solaris）或 11.1.102.59（Android），Adobe AIR 升级至 3.1.0.4880 及以上版本。由于 Flash Player 已于 2020 年底停止支持，建议彻底卸载 Flash Player 并迁移至 HTML5 技术栈；如必须使用，可在浏览器中启用点击播放策略并限制仅访问可信站点。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 跨域策略绕过漏洞"
updated = "2026-06-16T23:31:22Z"

