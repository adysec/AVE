[basic]
description = "ATEN Unizon 的 RpcProvider 类存在缺失认证的漏洞（CVE-2026-5057）。由于 RpcProvider 在允许访问功能之前未进行身份验证验证，未经身份认证的远程攻击者可通过网络直接向目标系统发送恶意请求，利用该漏洞创建拒绝服务条件，导致受影响系统无法正常提供服务。该漏洞影响 ATEN Unizon Service，CVSS 评分为 7.5（高危），攻击无需身份认证，利用门槛较低。"
published = "2026-07-29T20:17:05.497"
remediation = "立即将 ATEN Unizon Service 升级至 V2.7.263.001，该版本已修复 RpcProvider 未授权访问漏洞。在升级前，可采取以下临时缓解措施：将 TCP 1829 端口通过网络防火墙或访问控制列表限制为仅允许可信主机访问；若 Unizon Service 非必需，可暂时禁用该服务以消除攻击面。升级完成后验证服务版本号确认为 V2.7.263.001，并重新启用服务。"
score = 7.5
severity = "HIGH"
sources = ["zdi"]
title = "ATEN Unizon RpcProvider 缺失认证拒绝服务漏洞"
updated = "2026-07-30T14:19:24.857"

