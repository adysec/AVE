[basic]
description = "WinSMTP 1.06f 及 2.x 版本存在缓冲区溢出漏洞。远程攻击者可通过向 SMTP 服务发送超长的 USER 或 HELO 命令触发缓冲区溢出，导致服务崩溃拒绝服务。该漏洞 CVSS 评分 10.0，攻击复杂度低，无需身份认证即可远程利用，危害等级严重。受影响版本包括 WinSMTP 1.06f 和 2.x 系列，建议用户升级至最新版本或限制 SMTP 服务访问来源。"
published = "2000-11-14T05:00:00.000"
remediation = "立即停止使用已停止维护的 WinSMTP 1.06f 及 2.x 版本，迁移至受支持的 SMTP 服务器软件（如 Exchange Server、Postfix 等）。在无法立即迁移的情况下，在网络边界防火墙配置访问控制规则，限制对 SMTP 端口（25/TCP）的访问来源，仅允许可信 IP 连接。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Jack De Winter WinSMTP 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:33.727"

