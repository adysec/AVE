[basic]
description = 'Unify eWave ServletExec JSP/Java servlet 引擎 3.0C 及更早版本存在拒绝服务漏洞。当远程攻击者向目标服务器发送包含 "/servlet/" 字符串的特制 URL 时，若 ServletExec servlet 已在运行，该请求会触发异常，导致服务无法正常处理请求。攻击者无需任何身份认证即可利用此漏洞，攻击条件仅需目标服务器开放网络访问并运行受影响版本的 ServletExec。成功利用将造成服务中断，影响基于该引擎的 Web 应用可用性。'
published = "2000-12-11T05:00:00Z"
remediation = "立即升级 ServletExec 到 3.0E 或更高版本，可从 servletexec.com 下载补丁安装。升级前先停止 ServletExec 引擎，安装完成后重启 web 服务器并确认 /servlet/ServletExec 路径不再触发 BindException。临时缓解措施：在 web 服务器层面过滤包含 /servlet/ 的请求路径，限制对 ServletExec 管理接口的访问。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Unify eWave ServletExec 3.0c 拒绝服务漏洞"
updated = "2026-06-16T21:52:59Z"

