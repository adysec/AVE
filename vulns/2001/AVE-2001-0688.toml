[basic]
description = "Windows 2000 加密文件系统（EFS）在加密文件后未能正确销毁原始文件备份及临时文件，导致加密文件的明文内容可能被恢复。该漏洞影响 Windows 2000 系统上所有使用 EFS 功能加密的文件，攻击者需具备本地访问权限（如物理接触或已入侵的受限账户），无需身份验证即可利用。攻击者可通过磁盘恢复工具或直接读取系统临时目录中残留的未加密备份文件，获取原始敏感数据，造成机密信息泄露。"
published = "2001-06-02T04:00:00Z"
remediation = "建议立即安装 Windows 2000 Service Pack 2 或更高版本（KB296316），该补丁修复了 EFS 加密过程中临时备份文件 efs0.tmp 未彻底清除的问题，确保加密完成后明文临时文件被安全覆写而非仅标记为可用。临时缓解措施：对于敏感文件，应在已加密的文件夹内直接创建新文件，而非先创建明文文件再加密，以避免生成明文临时备份；同时使用 BitLocker 或其他全盘加密方案对整个磁盘进行加密，防止通过磁盘工具直接读取残余明文数据。由于 Windows 2000 已终止支持，强烈建议迁移至仍在接收安全更新的 Windows 版本。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Microsoft Windows 2000 EFS 敏感信息泄露漏洞"
updated = "2026-06-16T21:53:59Z"

