[basic]
description = "多种 SNMP 实现在处理 SNMPv1 trap 消息时存在权限验证缺陷，远程攻击者无需身份认证即可通过发送特制的 SNMPv1 trap 数据包触发漏洞，导致目标系统拒绝服务或获取最高权限。该漏洞由 PROTOS c06-SNMPv1 测试套件发现并验证，影响大量厂商的 SNMP 实现，CVSS 评分 10.0，危害等级严重。由于 SNMP 协议广泛应用于网络设备管理，攻击者可利用此漏洞完全控制受影响设备。"
published = "2002-02-13T05:00:00Z"
remediation = "立即联系设备厂商获取 SNMPv1 协议栈安全补丁并升级。如 Cisco 设备请升级至修复 SNMP 畸形消息的 IOS 版本，Compaq Tru64 UNIX 用户安装对应 ERP 补丁包。临时缓解措施：在边界防火墙上过滤 UDP 端口 161 和 162 的入站流量；如业务允许，直接禁用 SNMPv1 服务或升级至 SNMPv3；修改所有设备的默认 SNMP 团体字符串（public/private）；将 SNMP 管理流量隔离到独立管理 VLAN 或 VPN 中。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "多厂商 SNMP 实现 SNMPv1 Trap 处理远程代码执行漏洞"
updated = "2026-06-16T21:56:35Z"

