[basic]
description = "Apple QuickTime 7.6.9 之前版本在处理 Sorenson 编码影片文件、PICT 文件、FlashPix 图像以及 QTVR（QuickTime 虚拟现实）影片文件中的全景原子时存在内存破坏漏洞。远程攻击者可向用户发送特制的恶意媒体文件，诱使用户在受影响系统上打开该文件，触发内存损坏，导致应用程序崩溃或任意代码执行。该漏洞无需身份认证即可利用，但需要用户交互（打开恶意文件），CVSS 评分 9.3，危害严重。"
published = "2010-12-09T20:00:17Z"
remediation = "立即升级 Apple QuickTime 至 7.6.9 或更高版本。由于 Apple 已于 2016 年停止对 QuickTime for Windows 的支持，建议在 Windows 系统上彻底卸载 QuickTime 并改用其他兼容媒体播放器；macOS 用户应确保系统已更新至最新版本以获得安全修复。如无法卸载，避免打开来源不明的 PICT 文件，并禁用浏览器 QuickTime 插件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime PICT文件处理内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:23:33Z"

