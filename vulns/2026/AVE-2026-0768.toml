[basic]
description = "Thumbor 是一款开源图片缩略图服务，其 `convolution` 滤镜在处理用户传入的 `columns` 参数时，未校验该值是否大于 0 即直接将其作为除数传入 C 扩展层进行取模和除法运算。当攻击者构造 `columns=0` 的恶意请求时，C 扩展层触发除零异常（SIGFPE），导致 Thumbor 进程崩溃，造成远程拒绝服务。若服务启用了 `/unsafe/` URL 模式，未经认证的攻击者可远程触发该漏洞；若未启用，则需要攻击者持有有效签名 URL。该漏洞影响 Thumbor 7.8.0 之前的所有版本，CVSS 评分 7.5，危害等级高。"
published = "2026-07-31T19:17:09Z"
remediation = "立即升级 Thumbor 至 7.8.0 或更高版本（https://github.com/thumbor/thumbor/releases/tag/7.8.0），该版本已在 C 扩展层对 columns 参数增加零值校验。如无法立即升级，可在 Thumbor 配置中移除 `convolution` 过滤器或禁用 `/unsafe/` URL 模式（设置 `ALLOW_UNSAFE_URL=False`），并严格限制签名 URL 的发放范围仅限可信方。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Globo Thumbor 卷积滤镜除零错误导致远程拒绝服务漏洞"
updated = "2026-07-31T22:17:02Z"

