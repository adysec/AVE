[basic]
description = "Zlib 1.1.4 压缩库中的 gzprintf 函数存在缓冲区溢出漏洞。当 zlib 在编译时未启用 vsnprintf 安全函数，或使用 vsnprintf 截断过长输入时，攻击者可通过向 gzprintf 传递特制超长字符串触发栈缓冲区溢出，导致程序崩溃（拒绝服务）或可能执行任意代码。该漏洞影响所有使用 zlib 1.1.4 版本且未正确配置编译选项的应用程序，攻击者无需身份认证即可远程触发，CVSS 评分 7.5，危害等级高。"
published = "2003-03-07T05:00:00Z"
remediation = "建议立即将 zlib 升级至 1.2.2 或更高版本（当前最新为 1.3.2），该版本已使用安全的 vsnprintf 替代存在溢出的 vsprintf。如无法升级，可在编译时确保系统支持 vsnprintf 并定义 HAVE_VSNPRINTF，同时避免向 gzprintf() 传递超长不可信输入作为格式参数。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Zlib 1.1.4 gzprintf 缓冲区溢出漏洞"
updated = "2026-06-16T22:01:32Z"

