[basic]
description = "SonicWall SMA100 设备中存在路径遍历漏洞，位于 handleWAFRedirect CGI 处理程序中。未经身份认证的远程攻击者可通过向目标设备发送特制的 HTTP 请求，利用目录遍历技术读取服务器上的任意文件，导致敏感信息泄露。该漏洞影响 SMA100 系列设备，CVSS 评分 7.5，危害等级高。SonicWall 已发布安全更新修复此漏洞，建议用户及时升级至最新版本。"
published = "2019-12-19T01:15:10Z"
remediation = "立即将 SonicWall SMA100 固件升级至 9.0.0.4 或更高版本（对应安全公告 SNWLID-2019-0018）。如无法立即升级，可在管理界面禁用 handleWAFRedirect CGI 功能，并在防火墙上限制对 SMA100 管理端口的非信任来源访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "SonicWall SMA100 路径遍历漏洞"
updated = "2026-06-17T02:40:39Z"

