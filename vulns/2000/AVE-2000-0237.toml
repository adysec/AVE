[basic]
description = "Panda Security 3.0 存在安全绕过漏洞。当软件禁用注册表编辑功能后，本地用户仍可通过直接执行 .reg 注册表文件或使用其他未授权方法绕过此限制，从而修改系统注册表并获取更高权限。该漏洞攻击复杂度低，无需身份认证，但需要本地访问权限，影响系统的完整性。Panda Security 3.0 用户受此漏洞影响。"
published = "2000-04-17T04:00:00Z"
remediation = 'Panda Security 3.0 已停止技术支持，建议立即升级到受支持的 Panda Security 最新版本。如无法升级，可通过组策略或注册表禁用 .reg 文件的默认关联执行（将 HKEY_CLASSES_ROOT\.reg 的默认值改为 txtfile），并限制用户对注册表编辑器的访问权限（设置 HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Policies\System 下 DisableRegistryTools=1），同时移除用户对注册表文件的写入权限作为临时缓解措施。'
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "Panda Security 3.0 本地权限提升漏洞"
updated = "2026-06-16T21:51:21Z"

