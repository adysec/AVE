[basic]
description = "radare2 存在一个严重的越界写入漏洞（Out-of-bounds Write），具体表现为堆缓冲区溢出或越界读取。攻击者可以通过构造恶意文件并引导受害者使用 5.9.9 之前的 radare2 版本进行分析，触发该内存损坏漏洞。由于该漏洞允许在堆内存中执行非法写入，可能导致目标程序崩溃或实现远程代码执行（RCE）。该漏洞影响所有 5.9.9 之前的版本，CVSS 评分高达 10.0，具有极高的危害性。"
published = "2025-02-28T04:15:09Z"
remediation = "建议将 radare2 升级至 5.9.9 或更高版本。对于使用 Linux 发行版包管理器的用户，请运行相应的更新命令（如 dnf update 或 apt-get upgrade）以安装由发行版维护的最新补丁版本。"
score = 10
severity = "CRITICAL"
sources = ["msrc"]
title = "radareorg radare2 堆缓冲区溢出越界写入漏洞"
updated = "2026-06-17T08:39:42Z"

