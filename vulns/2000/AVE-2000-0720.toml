[basic]
description = 'Nevis Systems All-Mail 1.1 存在缓冲区溢出漏洞，远程攻击者可通过向 SMTP 服务发送超长的 "MAIL FROM" 或 "RCPT TO" 命令触发栈溢出，导致任意命令执行。该漏洞无需身份认证即可远程利用，CVSS 评分 10.0，危害等级严重，可完全控制目标服务器。受影响版本为 All-Mail 1.1，建议升级至最新版本或应用厂商补丁。'
published = "2000-12-19T05:00:00Z"
remediation = "立即停止使用 Nevis Systems All-Mail 1.1，该产品已停止维护且无安全补丁可用。建议迁移至受支持的邮件服务器软件（如 Postfix、Exim 或 Microsoft Exchange），并在迁移完成前在边界防火墙上阻断对 SMTP 端口（25/TCP）的外部访问作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Nevis Systems All-Mail 1.1 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:54Z"

