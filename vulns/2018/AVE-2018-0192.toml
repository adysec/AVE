[basic]
description = 'Enhancesoft osTicket 1.10.2 之前版本的 /scp/index.php 页面存在跨站脚本（XSS）漏洞。由于对 "sort" 参数缺乏充分的过滤与转义处理，远程攻击者可构造恶意 URL 诱使已登录的管理员用户点击，导致任意 Web 脚本或 HTML 在用户浏览器中执行。攻击者无需身份认证即可发起攻击，但需要用户交互配合。成功利用可窃取会话 Cookie、篡改页面内容或发起钓鱼攻击，影响系统机密性与完整性。CVSS 评分 6.1，危害等级中危。'
published = "2018-03-27T17:29:00Z"
remediation = "升级 osTicket 至 1.10.2 或更高版本，该版本已修复 /scp/index.php 中 sort 参数的 XSS 问题。如无法立即升级，可在 Web 应用防火墙（WAF）层面添加规则过滤 sort 参数中的 <script>、onerror 等恶意 HTML/JS 关键字，并对用户输入进行 HTML 实体编码。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Enhancesoft osTicket 跨站脚本攻击漏洞"
updated = "2026-07-10T18:20:35Z"

