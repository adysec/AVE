[basic]
description = "Android内核中的binder.c文件内binder_transaction函数存在不正确的边界检查缺陷，攻击者可利用此漏洞触发越界写入操作。该漏洞影响Android内核，本地低权限攻击者无需额外执行权限、也无需任何用户交互即可构造特制binder事务数据包向目标系统发送，成功利用后可实现本地权限提升，从普通应用权限escalation至系统root权限，完全控制受影响设备。Google已在2020年3月Android安全公告中发布修复补丁，该漏洞已被CISA列入已知被利用漏洞目录（KEV），野外已有实际利用记录。"
published = "2020-03-11"
remediation = "立即安装 Android 2020 年 3 月安全更新（安全补丁级别 2020-03-01），该更新已修复 binder.c 中边界检查不正确的越界写入漏洞。Pixel 系列设备可通过「设置 → 系统 → 高级 → 系统更新」检查并安装；其他 Android 设备请联系厂商获取对应安全更新。由于该漏洞已被 CISA 列入已知被利用漏洞目录，建议优先完成更新，无法立即更新的设备应限制非必要应用的安装来源并避免授予可疑应用权限以降低本地提权风险。"
score = 5
severity = "MEDIUM"
sources = ["kev"]
title = "Google Android Binder 越界写入权限提升漏洞"
updated = "2020-03-11"

