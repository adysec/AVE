[basic]
description = "OpenBSD su程序存在格式字符串漏洞，本地攻击者可通过向su程序传入包含格式化占位符特制参数的恶意shell命令触发该漏洞，进而获取root权限。该漏洞影响OpenBSD及可能其他基于BSD的操作系统，成功利用后可完全控制系统。攻击者需具备本地登录权限，通过精心构造包含格式字符串的shell参数，利用程序未正确过滤用户输入中的格式化字符（如%x、%n等）的缺陷，读取或覆盖任意内存内容，最终实现本地权限提升至root。"
published = "2000-12-19T05:00:00Z"
remediation = "立即应用 OpenBSD 官方安全补丁 028_format_strings.patch（ftp://ftp.openbsd.org/pub/OpenBSD/patches/2.7/common/028_format_strings.patch），进入 /usr/src 目录执行 patch -p0 < 028_format_strings.patch，随后重新编译并安装 libutil 及 su 程序；临时缓解措施可执行 chmod u-s /usr/bin/su 移除 setuid 位以阻断本地提权路径；长期建议升级至 OpenBSD 2.8 或更高版本。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "OpenBSD su 程序格式字符串漏洞"
updated = "2026-06-16T21:52:56Z"

