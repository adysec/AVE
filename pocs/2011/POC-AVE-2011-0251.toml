[info]
author = "ave"
description = "检测目标Chrome浏览器是否存在粘贴事件后剪贴板监控漏洞(CVE-2011-3953)。通过构造包含paste事件监听器的HTML页面，诱导用户执行粘贴操作后读取剪贴板内容，验证浏览器是否允许网页监控剪贴板数据。"
id = "POC-AVE-2011-0251"
name = "Google Chrome Paste Event Clipboard Monitoring PoC"
severity = "high"
tags = ["ave-2011-0251"]
vuln_id = [
    "CVE-2011-3953",
    "AVE-2011-0251",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc-cve-2011-3953.html"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["clipboardData"]
