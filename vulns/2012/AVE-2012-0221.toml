[basic]
description = "Mozilla Firefox 4.x 至 13.0、Firefox ESR 10.x 至 10.0.6、Thunderbird 5.0 至 13.0、Thunderbird ESR 10.x 至 10.0.6 及 SeaMonkey 至 2.11 版本的解析器工具类在处理 RSS feed 中 description 元素内的 EMBED 元素时存在跨站脚本漏洞。远程攻击者可构造恶意的 RSS feed，诱使用户订阅或访问，当浏览器解析该 feed 时，EMBED 元素中的恶意脚本会在用户浏览器上下文中执行，导致敏感信息泄露、会话劫持等危害。攻击无需用户交互，仅需用户浏览恶意 RSS 内容即可触发。"
published = "2012-07-18T10:26:48.860"
remediation = "升级Firefox至14.0及以上版本、Firefox ESR至10.0.6及以上版本、Thunderbird至14.0及以上版本、Thunderbird ESR至10.0.6及以上版本、SeaMonkey至2.11及以上版本。无法立即升级时，可禁用RSS feed订阅功能或配置浏览器禁止自动解析RSS feed中的EMBED元素作为临时缓解措施。各Linux发行版用户可通过系统包管理器安装对应安全更新（如Red Hat RHSA-2012-1088、Ubuntu USN-1509-1/USN-1510-1）。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey RSS Feed跨站脚本漏洞"
updated = "2026-06-16T23:40:39.797"

