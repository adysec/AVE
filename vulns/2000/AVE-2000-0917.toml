[basic]
description = "O'Reilly WebSite Pro 2.3.7 版本在安装时将 uploader.exe 程序赋予所有用户执行权限，导致远程攻击者可直接调用该程序创建并执行任意文件。该漏洞源于安装程序未正确配置文件权限，攻击者无需身份认证即可远程调用 uploader.exe 上传并执行恶意文件，可导致服务器完全沦陷。影响 O'Reilly WebSite Pro 2.3.7 版本，CVSS 评分 7.5（高危），攻击向量为网络、攻击复杂度低、无需认证，可造成机密性、完整性、可用性部分影响。攻击者仅需向服务器发送针对 uploader.exe 的请求即可实现任意文件上传与执行，建议升级至修复版本或限制 uploader.exe 执行权限。"
published = "2000-10-20T04:00:00Z"
remediation = "建议立即升级至 O'Reilly WebSite Pro 2.5 或更高版本（官方已发布修复补丁，参考 SecurityFocus BID 1611 供应商公告），或迁移至 IIS/Apache/Nginx 等现代 Web 服务器。若无法立即升级，请立即执行以下缓解措施：1) 删除或重命名 WebSite Pro 安装目录下的 uploader.exe 文件；2) 在 Web 服务器配置中禁止对 uploader.exe 的所有 HTTP 请求访问；3) 使用文件系统 ACL 移除 Everyone 用户对 uploader.exe 的执行权限（仅保留 SYSTEM/Administrators 读取）；4) 在防火墙/WAF 层面拦截针对 /uploader.exe 路径的请求。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "O'Reilly WebSite Pro 任意文件上传与执行漏洞"
updated = "2026-06-16T21:52:26Z"

