[basic]
description = "Linux 内核 ksmbd 多通道 SMB 服务器存在会话释放后使用（use-after-free）漏洞。在会话建立与 ksmbd_sessions_deregister 之间产生竞态条件，导致会话对象在连接被添加到会话的通道列表之前即被释放，攻击者可能利用该时序窗口执行任意代码。该漏洞影响启用了 ksmbd 的 Linux 内核版本，CVSS v3.1 评分为 8.8（高危），攻击向量为网络，攻击复杂度低，所需权限为低权限，无需用户交互即可触发。成功利用可导致机密性、完整性和可用性均受到严重影响。"
published = "2025-04-16T15:15:56Z"
remediation = "上游 Linux 内核已在 6.1.134、6.6.87、6.12.23、6.13.11、6.14.2 版本中修复该漏洞。Debian 12 用户应升级至 DSA-5907-1 公告对应的内核版本；Ubuntu 24.04 LTS 用户升级至 linux-image-6.8.0-86-generic，22.04 LTS 用户升级至 linux-hwe-6.8 6.8.0-86.87~22.04.1 或 linux-hwe-6.11 6.11.0-28.28~24.04.1。RHEL/CentOS 用户需关注红帽安全公告并安装对应内核 errata 更新。如短期无法打补丁，可在防火墙中禁用 SMB 多通道连接（设置 max_channels=1）或暂时关闭 ksmbd 服务作为临时缓解措施，并通过 `uname -r` 确认当前内核版本低于受影响的 5.15 至 6.14.2 区间后及时安排重启。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 ksmbd 多通道连接会话释放后重用漏洞"
updated = "2026-06-17T08:44:54Z"

