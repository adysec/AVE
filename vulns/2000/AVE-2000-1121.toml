[basic]
description = "NAI Sniffer Agent 在身份验证过程中采用了 Base64 编码而非安全的加密算法。由于 Base64 编码可以通过简单的解码操作将其还原为明文，不具备任何加密强度。攻击者在能够嗅探网络流量的条件下，可以通过截获身份验证数据包并对编码内容进行解码，从而轻松获取用户的明文用户名和密码。该漏洞影响所有使用此认证机制的 NAI Sniffer Agent 版本，导致攻击者可非法接管账户，造成严重的信息泄露和权限提升风险。"
published = "2001-01-09T05:00:00Z"
remediation = "建议立即停止使用 NAI Sniffer Agent 及其相关组件。若必须运行，应在受信任的隔离网络中部署，并配置 VPN 或 SSH 隧道对管理流量进行强加密，以防止凭据在传输过程中被截获。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "NAI Sniffer Agent 认证信息加密弱点"
updated = "2026-06-16T21:53:16Z"

