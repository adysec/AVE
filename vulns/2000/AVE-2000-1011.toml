[basic]
description = "IMP 2.2 及更早版本存在任意文件读取与删除漏洞。由于程序在处理附件时未对隐藏表单变量 attachment_name 进行严格的校验，远程未经身份认证的攻击者可通过篡改该变量，诱使服务器将目标系统上的任意敏感文件作为附件发送至攻击者端，或执行文件删除操作。该漏洞影响所有运行受影响版本的 IMP 服务器，可能导致关键系统配置、用户信息等敏感数据泄露，严重威胁系统安全性。"
published = "2000-12-19T05:00:00.000"
remediation = '建议立即停止使用 IMP 2.2 及更早版本，迁移至现代安全的邮件管理系统。若必须继续使用，需在代码层对 attachment_name 隐藏表单变量进行严格的路径过滤，禁止包含 "../" 等路径遍历字符，以防止攻击者读取或删除任意文件。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "IMP 2.2及更早版本 任意文件读取与删除漏洞"
updated = "2026-06-16T21:52:44.810"

