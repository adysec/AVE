[basic]
description = "Microsoft Office 的公式编辑器组件（EQNEDT32.EXE）在处理 OLE 对象时存在栈缓冲区溢出漏洞，远程攻击者可通过向用户发送特制的 Office 文档并诱导其打开，成功利用该漏洞可在当前用户上下文中执行任意代码。该漏洞影响 Microsoft Office 2007 Service Pack 3、2010 Service Pack 2、2013 Service Pack 1 及 Office 2016 等多个版本，CVSS 评分 7.8，危害等级高。攻击无需身份认证，但需要用户交互（打开恶意文档）。该漏洞已被广泛利用于 APT 攻击和勒索软件投放场景，CISA 已将其列入已知被利用漏洞目录（KEV）。Microsoft 已在 2017 年 11 月安全更新中修复此漏洞。"
published = "2017-11-15T03:29:01Z"
remediation = '立即安装 Microsoft 2017 年 11 月安全更新（对应 Office 版本：Office 2007 SP3 安装 KB4011604，Office 2010 SP2 安装 KB4011610，Office 2013 SP1 安装 KB4011611，Office 2016 安装 KB4011239），或通过 Windows Update 自动获取更新。如无法立即打补丁，可通过注册表禁用 Equation Editor 组件：以管理员身份运行 `reg add "HKLM\SOFTWARE\Microsoft\Office\Common\COM Compatibility\{0002CE02-0000-0000-C000-000000000046}" /v "Compatibility Flags" /t REG_DWORD /d 0x400 /f`，阻止 EQNEDT32.EXE 加载。'
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Office 公式编辑器远程代码执行漏洞"
updated = "2026-06-17T01:02:31Z"

