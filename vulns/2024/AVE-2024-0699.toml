[basic]
description = "Linux 内核 BPF 子系统中存在一个安全漏洞。当 BPF 验证器处理全局子程序调用时，会根据子程序的 changes_pkt_data 属性决定是否使当前状态中的所有包指针失效。扩展程序（EXT）在替换全局子程序时，若其 changes_pkt_data 属性与被替换的子程序不兼容，验证器可能错误地处理包指针状态，导致内核状态不一致。本地攻击者可通过加载特制的 BPF 程序利用此漏洞，造成系统拒绝服务（可用性影响为高）。该漏洞影响 Linux 内核 5.6 至 6.6.89 及 6.7 至 6.12.24 版本，CVSS 评分 5.5，危害等级中等。"
published = "2025-05-05T15:15:53Z"
remediation = "升级到包含 bpf 安全修复的 Linux 内核版本，具体版本取决于具体的内核分支和安全维护计划。检查内核版本和安全更新公告（如 Red Hat、Ubuntu、Debian 等厂商的补丁列表），并更新到包含 bpf verifier changes_pkt_data 检查功能的版本。如无法立即更新，可临时限制 BPF 程序加载权限或使用安全配置来缓解风险。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 BPF 扩展程序 changes_pkt_data 属性校验漏洞"
updated = "2026-06-17T08:14:38Z"

