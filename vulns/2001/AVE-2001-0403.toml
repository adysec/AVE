[basic]
description = "xinetd 2.1.8 及更早版本以默认 umask 0 运行，导致通过 xinetd 启动的应用程序在未自行设置安全 umask 的情况下创建的所有文件均具有过于宽松的权限（默认 0666）。本地攻击者可利用此漏洞读取或篡改由 xinetd 下运行的服务所产生的日志文件、临时文件或其他数据文件，造成敏感信息泄露或数据完整性破坏。该漏洞影响所有使用 xinetd 作为超级服务的 Linux/Unix 系统，攻击条件为攻击者需拥有本地系统访问权限，CVSS 评分 3.6，危害等级低。Debian、Red Hat、Mandrake 等主流发行版均已发布安全公告并修复此问题，建议用户升级 xinetd 至最新版本。"
published = "2001-07-10T04:00:00Z"
remediation = "将 xinetd 升级到 2.1.8.8p3 或更高版本，该版本将默认 umask 值从 0 更改为安全的 022，防止由 xinetd 托管的应用程序在未自行设置 umask 时创建全局可读写的文件。对于无法立即升级的系统，可在 xinetd.conf 配置文件中通过 umask 指令显式设置 umask 为 022，或在受 xinetd 托管的应用程序启动脚本中通过 umask 命令设置安全权限掩码。同时建议检查 /tmp 等目录下是否存在由 SWAT 等工具创建的可被其他用户读取或修改的敏感文件，发现后立即删除并重新设置安全权限。Debian 用户应安装 xinetd_2.1.8.8.p3-1.1 安全更新包。"
score = 3.6
severity = "LOW"
sources = ["redhat"]
title = "xinetd 缺省umask设置不安全导致本地用户文件读写漏洞"
updated = "2026-06-16T21:56:02Z"

