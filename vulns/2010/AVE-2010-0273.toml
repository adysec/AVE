[basic]
description = "RealNetworks RealPlayer 在处理 IVR 文件头时存在基于堆的缓冲区溢出漏洞。攻击者可构造特制的 IVR 文件，当用户使用受影响版本的 RealPlayer（包括 Windows 版 11.0 至 11.1、RealPlayer SP 1.0 至 1.1.5 以及 Linux 版 11.0.2.1744）打开该恶意文件时，触发堆缓冲区溢出，导致攻击者能够以当前用户权限执行任意代码。该漏洞无需身份认证，仅需诱导用户访问恶意媒体文件即可利用，CVSS 评分 9.3，危害严重。"
published = "2010-12-14T16:00:04Z"
remediation = "立即升级 RealPlayer 至 12.0.1.609 或更高版本，该版本已修复 IVR 文件头解析中的堆缓冲区溢出漏洞。如无法升级，可在浏览器中禁用 RealPlayer 插件，并避免打开来源不明的 .ivr/.rm/.ra 媒体文件作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer IVR文件头堆缓冲区溢出漏洞"
updated = "2026-06-16T23:24:41Z"

