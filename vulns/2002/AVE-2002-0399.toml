[basic]
description = "Microsoft Windows NT/2000/XP 的 SMB（服务器消息块）协议实现中存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标系统发送特制的 SMB_COM_TRANSACTION 数据包，请求 NetShareEnum、NetServerEnum2 或 NetServerEnum3 服务，触发栈缓冲区溢出，导致系统崩溃或拒绝服务。CVSS 评分 7.5，攻击复杂度低，无需认证即可远程利用，影响 Windows NT 4.0、Windows 2000 及 Windows XP 等版本。"
published = "2002-09-24T04:00:00Z"
remediation = "安装 Microsoft 安全公告 MS02-045 对应的补丁程序。对于 Windows NT 4.0/2000/XP，可通过 Windows Update 获取更新。由于这些系统已停止支持，建议升级到受支持的 Windows 版本（如 Windows 10/11）；若无法升级，在防火墙和路由器上阻止 TCP 端口 139 和 445 以阻断外部 SMB 流量，并限制局域网内对共享资源的访问权限。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft Windows SMB 网络共享提供程序缓冲区溢出漏洞"
updated = "2026-06-16T21:58:00Z"

