[basic]
description = "Blue Coat Systems（原 CacheFlow）CacheOS 产品存在跨站脚本（XSS）漏洞，影响 Client Accelerator 4.1.06、Security Gateway 2.1.02 及 Server Accelerator 4.1.06 版本。远程攻击者可通过向目标设备发送包含恶意 HTML 或脚本代码的 URL 请求一个不存在的域名，当设备返回错误页面时，攻击者注入的代码会在浏览器中执行，导致敏感信息泄露或会话劫持。攻击无需认证，CVSS 评分 4.3，危害等级中危。"
published = "2002-10-04T04:00:00Z"
remediation = """升级到 CacheOS 4.1.07 或更高版本（官方补丁见 http://download.cacheflow.com/release/CA/4.1.00-docs/CACacheOS41fixes.htm）。该产品已停止维护，建议迁移至受支持的 Web 缓存/代理产品。如无法升级，在反向代理或 WAF 层对 Host 头及 URL 中的特殊字符（< > " ' &）进行 HTML 编码过滤，防止未解析域名错误页反射 XSS。"""
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Blue Coat Systems CacheOS 跨站脚本漏洞"
updated = "2026-06-16T21:58:39Z"

