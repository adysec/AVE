[basic]
description = "Anaconda Foundation Directory 1.4 至 1.9 版本中存在目录遍历漏洞。远程攻击者可通过向 apexec.pl 脚本发送包含 `..`（点点）序列的特制请求，利用路径遍历攻击绕过目录限制，读取服务器上的任意文件。该漏洞源于程序未对用户输入的路径参数进行充分过滤和校验，导致攻击者可以访问 Web 根目录之外的文件系统内容。CVSS 评分 5.0，危害等级中危，攻击复杂度低且无需身份认证，但仅影响机密性。"
published = "2000-12-19T05:00:00Z"
remediation = "建议升级 Anaconda Foundation 至 1.9 或更高版本，该版本已修复 apexec.pl 的目录遍历问题。如无法升级，修改 apexec.pl 源码，对用户输入参数过滤 `../` 等路径遍历字符，或限制脚本仅允许访问指定目录下的文件。若业务不需要，可直接删除或禁用 apexec.pl 脚本。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Anaconda Foundation Directory 目录遍历漏洞"
updated = "2026-06-16T21:52:53Z"

