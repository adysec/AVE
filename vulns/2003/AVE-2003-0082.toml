[basic]
description = "Ethereal 0.9.11 及之前版本中存在多处整数溢出漏洞，具体位于 Mount 和 PPP 解析器中。远程攻击者无需身份认证即可通过发送特制的网络数据包触发该漏洞，导致解析器崩溃从而引发拒绝服务，在特定条件下可能进一步实现任意代码执行。该漏洞影响所有使用受影响版本的 Ethereal 网络协议分析软件，CVSS 评分 7.5，危害等级高。"
published = "2003-06-09T04:00:00Z"
remediation = "升级 Ethereal 至 0.9.12 或更高版本。Debian Woody 用户安装 ethereal 0.9.4-1woody4 安全更新。如无法升级，在协议解析设置中禁用 Mount 和 PPP 协议解析器，并在网络边界过滤未知或恶意网络流量作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Ethereal 多个解析器整数溢出远程代码执行漏洞"
updated = "2026-06-16T22:02:03Z"

