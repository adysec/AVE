[basic]
description = 'Gogs 0.11.66 及之前版本的文件会话提供器（file.go）中存在会话验证缺陷，由于未正确校验会话 ID，远程未经身份认证的攻击者可通过构造包含 ".." 路径遍历序列的恶意会话文件，绕过身份认证机制，伪造任意用户会话实现登录。成功利用后攻击者可获取目标系统管理员权限，进而实现远程代码执行。该漏洞影响所有使用文件会话存储的 Gogs 实例，攻击无需任何前置条件，危害严重。'
published = "2018-11-04T05:29:00Z"
remediation = "立即升级 Gogs 至 0.12.0 或更高版本，该版本修复了 session 文件路径遍历导致任意用户登录的问题。如无法升级，在 `app.ini` 中将 `[session] PROVIDER` 从 `file` 切换为 `db` 或 `redis`，并重启 Gogs 服务。同时确保 Gogs 运行环境最小权限，避免攻击者通过其他途径写入 session 文件。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Gogs 会话ID验证不当远程代码执行漏洞"
updated = "2026-06-17T01:48:07Z"

