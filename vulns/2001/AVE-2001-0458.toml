[basic]
description = "Cisco IOS 12.0 至 12.2.1 版本存在 UDP 拒绝服务漏洞。远程攻击者无需身份认证即可通过向目标路由器或交换机发送大量 UDP 数据包触发该漏洞，导致设备 CPU 资源耗尽、网络服务中断。该漏洞影响 Cisco 多款路由器和交换机，攻击条件简单，仅需网络可达即可实施。Cisco 已发布安全公告建议用户升级至 12.2.2 及以上版本修复此漏洞。"
published = "2001-07-24T04:00:00Z"
remediation = "升级 Cisco IOS 至 12.2.2 或更高版本以彻底修复此漏洞。如无法立即升级，可在边界路由器上配置 ACL 限制入站 UDP 流量速率（使用 committed access rate 或 control plane policing），并禁用不必要的 UDP 服务（如 echo/chargen）。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Cisco IOS UDP 拒绝服务漏洞"
updated = "2026-06-16T21:55:34Z"

