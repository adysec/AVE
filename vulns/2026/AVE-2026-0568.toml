[basic]
description = "Nimiq 区块链项目的 core-rs-albatross 组件中 nimiq-primitives 库的 KeyNibbles::Add 方法存在越界 panic 漏洞。当恶意对等节点作为状态同步源向同步节点发送特制的 TrieChunk 证明时，其中 TrieNodeChild 的 suffix 与父 key 拼接后超过固定的 63 字节数组边界，Add 方法在未检查组合长度的情况下直接进行越界切片索引，导致 panic 崩溃。攻击者只需成为受害节点的同步对等端即可触发，无需提供有效证明，崩溃后节点可自动重启重新同步。该漏洞影响 core-rs-albatross <= 1.5.1 版本，已在 1.6.0 版本中修复。"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 core-rs-albatross 升级至 1.6.0 或以上版本（commit eabfc3e2），该版本在 KeyNibbles 拼接时增加了最大长度检查，防止越界 panic。如无法立即升级，仅允许与受信节点建立状态同步连接，避免恶意节点发送特制 TrieChunk 触发崩溃。"
score = 3.5
severity = "LOW"
sources = ["ghsa"]
title = "Nimiq core-rs-albatross nimiq-primitives 反序列化证明中 KeyNibbles 越界 panic 拒绝服务漏洞"
updated = "2026-01-01T00:00:00Z"

