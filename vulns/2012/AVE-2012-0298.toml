[basic]
description = "Apple iTunes 10.7及更早版本中使用的WebKit存在内存破坏漏洞，远程攻击者可通过向用户推送包含恶意构造内容的网页，触发WebKit内存损坏，进而执行任意代码或导致应用程序崩溃，造成拒绝服务。该漏洞攻击向量为网络，攻击复杂度中等，无需身份认证即可利用，对用户隐私和数据安全构成严重威胁。"
published = "2012-09-13T10:30:19Z"
remediation = "建议立即升级 Apple iTunes 到 10.7 或更高版本，以修复 WebKit 内存破坏漏洞。 iTunes 10.7 通过改进内存处理修复了该问题。在 Windows 系统上可通过 iTunes 官网下载 10.7 版本安装包进行原地升级。在无法立即升级的情况下，建议通过防火墙或安全软件屏蔽 iTunes 对未知网站的访问，避免浏览可疑网站引发内存破坏漏洞导致的任意代码执行风险。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:36Z"

