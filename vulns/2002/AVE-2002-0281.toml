[basic]
description = "The Bat! 1.53d、1.54beta 及其他部分版本在处理邮件附件时存在拒绝服务漏洞。该漏洞的原理在于软件未能正确过滤附件文件名中的 MS-DOS 设备名称（如 CON, PRN, AUX 等），当远程攻击者诱导用户打开包含此类特制文件名的附件时，会导致应用程序崩溃并触发拒绝服务（DoS）。影响范围涵盖使用受影响版本的 The Bat! 客户端用户，攻击者可通过发送恶意电子邮件实现远程触发，从而导致目标客户端无法正常运行。"
published = "2002-06-25T04:00:00Z"
remediation = "升级 The Bat! 客户端至 1.54 正式版或更高版本。若无法立即升级，建议在软件设置中禁用附件自动预览，或通过邮件网关过滤掉包含 MS-DOS 保留设备名（如 CON, PRN, AUX 等）的异常附件。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Rit Research Labs The Bat! 拒绝服务漏洞"
updated = "2026-06-16T21:57:14Z"

