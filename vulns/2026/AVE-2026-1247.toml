[basic]
description = 'undici 的缓存拦截器在处理格式异常的 Cache-Control private 指令时存在两个安全缺陷。一是当上游服务器返回包含畸形限定 private 指令（如 `private=""` 或 `private=","`）的响应时，该响应会被错误地存入默认共享缓存，随后被具有相同缓存键的其他请求获取，导致敏感响应体和头部（包括 Set-Cookie）泄露给不同用户。二是当 Cache-Control 头部同时包含非限定 private 指令和限定 private 指令（如 `public, max-age=60, private, private="hdr"`）时，缓存控制解析器会抛出未捕获的 TypeError，导致请求失败甚至进程终止。该漏洞影响所有以共享模式（含默认配置）使用 `interceptors.cache()` 的应用程序。攻击者需控制上游返回畸形 Cache-Control 头部，且后续请求匹配相同缓存键时无 Vary 头部分隔，即可触发信息泄露；若返回混合指令则可使服务崩溃。undici 7.0.0 至 7.29.0 之前及 8.0.0 至 8.9.0 之前的版本均受影响，升级至 7.29.0 或 8.9.0 可修复该漏洞。'
published = "2026-07-29T17:16:50.503"
remediation = "建议升级 undici 至 7.29.0 或 8.9.0 版本（执行 npm install undici@7.29.0 或 npm install undici@8.9.0），修复缓存拦截器对私有 Cache-Control 指令处理不当导致的信息泄露及进程崩溃问题。如暂无法升级，应将 cache 拦截器的共享缓存模式改为 type: 'private' 私有缓存，或对受影响域名临时禁用缓存功能，确保用户特定响应不会通过共享缓存返回给其他用户。"
score = 7.4
severity = "HIGH"
sources = ["ghsa"]
title = "Node.js undici 跨用户信息泄露和解析时崩溃漏洞"
updated = "2026-08-04T14:17:59.003"

