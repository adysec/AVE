[basic]
description = 'Boa Webserver 0.94.14rc21 版本中的 /cgi-bin/wapopen 程序存在路径遍历漏洞，攻击者可通过 GET 请求向 FILECAMERA 变量注入 "../.." 路径遍历序列，以 root 权限读取服务器任意文件。该漏洞实为系统集成商问题（如特定摄像头设备），Boa 核心代码本身不包含 wapopen 程序及 FILECAMERA 变量处理代码。CVSS 3.1 评分 7.5（HIGH），攻击向量为网络，攻击复杂度低，无需权限与用户交互，机密性影响高。攻击者可远程无需认证即可读取敏感文件（如 /etc/passwd、配置文件等），导致敏感信息泄露。ExploitDB (42290) 及多个 Nuclei 模板已公开 PoC 验证脚本。受影响设备为集成了易受攻击 wapopen CGI 程序的嵌入式设备（如特定 IP 摄像头）。'
published = "2017-06-24T02:29:00Z"
remediation = '建议立即升级受影响设备（摄像头/IoT设备）固件至厂商发布的最新版本，修复Boa Webserver 0.94.14rc21中/cgi-bin/wapopen的FILECAMERA参数路径遍历漏洞。若厂商未发布补丁，立即在Web服务器层面禁用/cgi-bin/wapopen CGI脚本，或在Web应用防火墙配置规则拦截包含"../"路径遍历载荷的FILECAMERA参数请求，同时限制CGI目录访问权限仅允许必要IP访问。'
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Boa Web Server 0.94.14rc21 任意文件访问漏洞"
updated = "2026-06-17T01:29:00Z"

