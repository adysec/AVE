[info]
author = "ave"
description = "SaltStack Salt API command injection vulnerability verification"
id = "POC-AVE-2019-0122"
name = "PoC for AVE-2019-0122"
severity = "medium"
tags = [
    "ave-2019-0122",
    "cve-2019-17418",
]
vuln_id = [
    "CVE-2019-17418",
    "AVE-2019-0122",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/run"
protocol = "http"

[poc.requests.body]
type = "form"

[poc.requests.headers]
Accept = "application/json"
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "return",
    "success",
]
