[basic]
description = "Bugzilla 2.14.1 之前版本的 doeditvotes.cgi 脚本存在信息泄露漏洞，远程攻击者可利用该漏洞获取敏感信息，进而更容易对登录系统发起攻击。该漏洞影响所有使用受影响版本 Bugzilla 的站点，攻击者无需身份认证即可远程利用，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:P/I:N/A:N），属于中等危害级别的信息泄露类漏洞。升级至 Bugzilla 2.14.1 或更高版本可修复此问题。"
published = "2002-01-31T05:00:00Z"
remediation = "升级 Bugzilla 至 2.14.1 或更高版本（官方下载：https://www.bugzilla.org/download/），或在 Web 服务器层面限制 doeditvotes.cgi 访问权限（如 Apache 使用 Require ip 限制内网 IP），并确保登录页面启用 HTTPS 防止凭据泄露。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Mozilla Bugzilla 信息泄露漏洞"
updated = "2026-06-16T21:56:35Z"

