[info]
author = "ave"
description = "检测 GNU Mailman 2.0.12 之前版本订阅功能中的跨站脚本漏洞，通过向 subscribe 页面的 info 参数注入恶意脚本代码，验证是否存在反射型 XSS"
id = "POC-AVE-2002-0275"
name = "GNU Mailman 2.0.x Subscribe XSS PoC"
severity = "high"
tags = ["ave-2002-0275"]
vuln_id = [
    "CVE-2002-0855",
    "AVE-2002-0275",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/mailman/subscribe/ml-name"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<script>document.location"]
