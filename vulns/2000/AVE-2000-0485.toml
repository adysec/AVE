[basic]
description = "Stalker CommuniGate Pro 3.2.5 及更早版本的 Web 管理界面存在路径遍历漏洞。远程攻击者无需身份认证即可通过向管理接口发送包含 `..` 的恶意请求，读取服务器上的任意文件，导致敏感信息泄露。该漏洞利用方式简单，攻击门槛低，影响 CommuniGate Pro 邮件服务器系统的机密性。"
published = "2000-04-03T04:00:00.000"
remediation = "升级 CommuniGate Pro 至 3.3.0 或更高版本，该漏洞已在后续版本中修复。如无法升级，在防火墙或反向代理层面限制对 Web 管理接口（默认端口 8000）的访问来源 IP，仅允许受信任的管理员网段连接，并禁用目录遍历所需的 `../` 序列。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Stalker CommuniGate Pro 3.2.5及更早版本 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:52:09.323"

