[basic]
description = 'Linux 内核 ACPI nfit 子系统中存在类型转换漏洞。在 `acpi_nfit_ctl()` 函数中，用户提供的 64 位字段 `call_pkg->nd_family` 在被截断为 32 位整型后才进行范围校验，若该值的低 32 位为零而高 32 位非零，则截断后变为无效值 0，可绕过 `NVDIMM_BUS_FAMILY_MAX` 检查并传入 `to_nfit_bus_uuid()` 函数，触发 "only secondary bus families can be translated" 警告并可能导致未定义行为。该漏洞影响 Linux 内核的 ACPI 设备内存接口（nfit）模块，攻击者需具备本地低权限访问权限才能通过特制系统调用触发。成功利用可能导致内核信息泄露或权限提升。CVSS v3.1 评分为 7.1，危害等级为高。'
published = "2025-04-16T15:15:57Z"
remediation = '将 Linux 内核升级至以下已修复版本之一：5.10.236、5.15.180、6.1.134、6.6.87、6.12.23、6.13.11 或 6.14.2。Debian 12 用户需安装 DSA-5907 安全更新，Ubuntu 25.04 用户需安装 USN-7594-1 安全更新。若短期内无法升级内核，可通过内核模块黑名单禁用 acpi_nfit 驱动模块，或在内核启动参数中添加 "acpi=nofit" 临时规避，但此措施可能导致 NVDIMM 持久内存设备无法被内核正确管理，仅建议作为临时应急方案。'
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 ACPI NFIT 模块类型转换错误漏洞"
updated = "2026-07-30T06:22:05Z"

