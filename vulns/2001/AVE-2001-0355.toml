[basic]
description = "Fetchmail 5.8.17 之前版本中存在符号整数索引漏洞，远程恶意的 IMAP 或 POP/POP3 服务器可通过在 LIST 请求的响应中返回负数索引值，触发内存越界写入，导致覆盖任意内存区域，攻击者可能借此实现权限提升。攻击条件为受害者使用 Fetchmail 连接并信任恶意邮件服务器，无需额外认证即可触发，CVSS 评分 10.0，危害等级严重。"
published = "2001-08-31T04:00:00Z"
remediation = "将 fetchmail 升级至 5.8.17 或更高版本。Debian 用户应安装 DSA-071 提供的更新包，Red Hat 用户安装 RHSA-2001-103 更新，Mandrake 用户安装 MDKSA-2001-072 更新。如无法立即升级，可在邮件服务器配置中禁用 LIST 命令的负索引响应，或限制 fetchmail 仅连接可信的 IMAP/POP3 服务器。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Fetchmail POP3/IMAP 负整数索引远程代码执行漏洞"
updated = "2026-06-16T21:55:24Z"

