[basic]
description = "MATE Desktop Atril Document Viewer 在解析 EPUB 文件时存在堆缓冲区溢出漏洞，漏洞源于程序在处理 EPUB 文件中的 XML 属性时未对用户提交的数据长度进行充分验证，导致数据写入堆缓冲区时发生越界。未经身份认证的远程攻击者可通过诱导目标用户访问恶意页面或打开特制的恶意 EPUB 文件来触发该漏洞，进而以当前进程的权限在目标系统上执行任意代码。该漏洞影响 MATE Desktop Atril Document Viewer 1.26.x 及更早版本，CVSS 评分为 7.8（高危），攻击者需用户交互配合即可完成利用。MATE 桌面团队已在 Atril 1.26.4 和 1.28.6 版本中修复此漏洞，修复详情参见 GitHub 合并请求 #700。"
published = "2026-01-01"
remediation = "立即将 MATE Desktop Atril Document Viewer 升级至 1.26.4 或 1.28.6 及以上版本，修复 EPUB 文件解析中的堆缓冲区溢出漏洞。升级后请勿打开来源不明的 EPUB 文件，临时缓解措施为在文件管理器中禁用自动预览 EPUB 文件功能。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "MATE Desktop Atril Document Viewer EPUB 文件解析堆溢出远程代码执行漏洞"
updated = "2026-01-01"

