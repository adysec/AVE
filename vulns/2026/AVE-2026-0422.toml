[basic]
description = "tags.<value>Sharp 内容管理框架的快速创建命令功能中，创建和存储端点未强制执行任何授权检查。已认证的 Sharp 用户即使对特定实体没有创建权限，只要该实体配置了快速创建命令处理器，即可绕过授权层，获取创建表单或提交新记录。该漏洞影响 Sharp 9.0.0 至 9.22.3 版本，CVSS 评分 4.3，危害等级中等。修复方案为升级至 9.22.3 版本或更新，并在升级前移除或禁用相关实体列表上的快速创建命令处理器。"
published = "2026-06-10T22:17:01Z"
remediation = "将 code16/sharp 升级到 9.22.3 或更高版本。如暂无法升级，可在受影响实体的列表页面中移除或禁用 Quick Creation Command 处理器（quickCreationCommandHandler()），以阻止未授权用户通过创建和存储端点绕过权限检查。"
score = 4.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "code16 Sharp 授权绕过漏洞"
updated = "2026-07-23T09:10:00Z"

