[basic]
description = "HP-UX 操作系统中的 lpspooler 组件（属于 PrinterMgmt.LP-SPOOL 文件集）存在缓冲区溢出漏洞。本地攻击者可利用该漏洞向 lpspooler 发送特制的输入数据触发缓冲区溢出，从而获取目标系统的提升权限。该漏洞影响 HP-UX 11.0 及更早版本，CVSS 评分 4.6，攻击者需拥有本地系统访问权限方可利用，无需用户交互即可完成提权操作。"
published = "2000-12-19T05:00:00.000"
remediation = "立即安装 HP 官方补丁 PHCO_21240（适用于 HP-UX 11.0）或更新版本的对应补丁，修复 lpspooler 中的缓冲区溢出问题。如无法立即打补丁，可临时移除 lpspooler 的 setuid 权限：chmod u-s /usr/bin/lpspooler，并限制本地用户对打印系统的访问权限。同时建议升级到 HP-UX 11.11 或更高版本，该版本已修复此漏洞。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "HP HP-UX lpspooler 缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:52:52.357"

