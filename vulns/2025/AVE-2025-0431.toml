[basic]
description = "Eclipse Paho Go MQTT v3.1 库（paho.mqtt.golang）1.5.0 及之前版本存在整数截断漏洞。当传入的 UTF-8 编码字符串长度超过 65535 字节时，库在将 int64/int32 类型长度值转换为 int16 时未进行溢出检查，导致写入的数据量超出长度字段指示范围。攻击者可通过向 MQTT 服务器发送特制的超长 UTF-8 字符串（如主题字段），造成数据包结构损坏或敏感数据泄露（例如主题内容泄露到 PUBLISH 消息体中）。该漏洞影响所有使用受影响库的 MQTT 客户端应用，CVSS 评分 6.3，危害等级中危。"
published = "2025-12-02T09:15:46Z"
remediation = "立即将 paho.mqtt.golang 升级至 v1.5.1 或更高版本，该版本已修复整数截断导致的协议走私漏洞。如无法立即升级，可在应用层对 MQTT 主题和负载长度进行校验，拒绝长度超过 65535 字节的 UTF-8 字符串输入，并限制单个 PUBLISH 报文的数据量。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Eclipse Paho Go MQTT 库整数截断导致数据泄露漏洞"
updated = "2026-06-17T08:28:29Z"

