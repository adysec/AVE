[basic]
description = "Zope 2.2.4 之前版本在计算本地角色时存在安全缺陷，由于角色权限计算逻辑不完善，已认证用户可通过构造特殊请求绕过预设的访问控制限制，获取本不应拥有的管理权限。成功利用该漏洞可导致攻击者完全控制受影响系统，实现任意操作。该漏洞影响 Zope 2.2.4 以下所有版本，CVSS 评分 7.2，危害等级高。"
published = "2001-03-12T05:00:00.000"
remediation = "升级 Zope 至 2.2.4 或更高版本，该版本修复了本地角色计算不当导致的权限绕过问题。如无法立即升级，应严格限制用户对 Zope 管理界面的访问权限，并审查所有用户角色分配，确保最小权限原则。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Zope Zope 安全绕过漏洞"
updated = "2026-06-16T21:53:42.550"

