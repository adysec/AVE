[basic]
description = "Bitdefender Total Security 和 Internet Security 的 Windows 版本中，File Shredder 模块存在文件访问前链接解析不当（link following）漏洞。该漏洞由 CWE-59 引起，攻击者可利用符号链接（Symbolic Links）在竞争条件（Race Condition）下触发，使得权限较低的本地用户通过构造符号链接并利用时间差竞争，在文件 shredder 操作过程中将恶意符号链接指向敏感系统文件，从而将符号链接指向的任意文件删除或覆盖，最终实现权限提升至 SYSTEM 级别。该漏洞影响 Bitdefender Total Security 及 Internet Security 早于 27.0.58.315 版本的所有 Windows 平台安装，CVSS 4.0 评分 7.0（高危），需本地登录且具备低权限访问，配合被动用户交互即可完成利用，对系统机密性、完整性和可用性均造成严重影响。"
published = "2026-07-14T08:16:24.000"
remediation = '将 Bitdefender Total Security 和 Internet Security 升级至 27.0.58.315 或更高版本，官方已通过自动更新修复该漏洞。若暂时无法更新，可依次打开 Bitdefender 控制面板进入"设置"→"通用"→"更新"，手动触发病毒库和引擎更新，并确保"自动更新"处于开启状态。对于无法立即打补丁的系统，可通过在 Windows 安全策略中限制低权限用户对 Bitdefender File Shredder 模块相关目录的写入权限作为临时缓解措施，减少符号链接竞争条件被利用的风险。'
score = 7
severity = "HIGH"
sources = ["zdi"]
title = "Bitdefender Total Security 和 Internet Security 符号链接竞争条件权限提升漏洞"
updated = "2026-07-15T05:17:25.330"

