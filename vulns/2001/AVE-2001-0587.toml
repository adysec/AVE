[basic]
description = 'Microsoft Windows 2000 域控制器的"配置您的服务器"工具在安装目录服务还原模式（DSRM）时未设置密码，导致该账户使用空白密码。攻击者需具备物理访问权限，通过重启服务器进入 DSRM 模式即可绕过身份验证，安装恶意程序或获取域控系统的完全控制权。该漏洞影响 Windows 2000 Server 域控制器，CVSS 评分为 7.2，危害等级为高危。'
published = "2001-02-12T05:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-099 提供的补丁（支持 Windows 2000 Server/Advanced Server Gold 版和 SP1），补丁会将目录服务还原模式和恢复控制台密码同步为管理员密码；补丁包含 SETPWD 工具，运行 SETPWD 可手动重置这两个模式的密码为强密码；或升级到 Windows 2000 SP2，安装过程会自动完成密码同步。若无法立即打补丁，须严格限制域控制器物理访问权限，仅授权管理员接触服务器机房。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Windows 2000 目录服务储存模式空白密码漏洞"
updated = "2026-06-16T21:53:33.457"

