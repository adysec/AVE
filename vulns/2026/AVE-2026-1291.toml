[basic]
description = "Docker Desktop 的 grpcfuse 内核模块存在无界递归漏洞。当容器在绑定挂载的宿主机目录上创建深度嵌套的目录结构并触发 dentry 失效事件时，grpcfuse 模块会陷入无限递归，导致内核虚拟机（VM）panic，最终使宿主机系统崩溃或拒绝服务。该漏洞影响 Docker Desktop 4.33.0 至 4.75.x 所有版本（覆盖 Windows、macOS 和 Linux 平台），CVSS v4.0 评分为 8.2（高危）。攻击者需要在容器内具备执行权限，通过构造多层嵌套目录并触发文件系统事件即可利用此漏洞造成宿主机内核恐慌。Docker 已在 4.76.0 版本中修复该问题。"
published = "2026-06-02T22:16:17Z"
remediation = "立即将 Docker Desktop 升级到 4.76.0 或更高版本，该版本已修复 grpcfuse 内核模块中因深度嵌套目录导致的无限递归问题。如无法立即升级，可暂时避免在 bind mount 的宿主机目录中创建深度嵌套的目录结构，或通过设置禁用 gRPC FUSE 文件共享功能作为临时缓解措施。"
score = 8.2
severity = "HIGH"
sources = ["zdi"]
title = "Docker Desktop grpcfuse 无界递归拒绝服务漏洞"
updated = "2026-07-22T19:10:00Z"

