[basic]
description = "McAfee Total Protection（MTP）16.0.30 之前版本存在任意进程执行漏洞，由于软件在权限管理实现上存在缺陷，本地低权限用户可通过触发特定操作绕过 MTP 自我保护机制，以提升后的权限执行任意代码。该漏洞需要攻击者具有本地系统访问权限，且需要目标用户进行某种交互操作才能成功利用，影响 Windows 系统上安装 McAfee Total Protection 的个人及企业用户。一旦利用成功，攻击者可在系统上下文中执行任意命令，导致系统完全被控制，造成敏感数据泄露、关键文件篡改或勒索软件部署等严重后果。CVSS 评分 8.2（HIGH），CWE-269  improper Privilege Management。McAfee 已在 16.0.30 版本中修复该漏洞。"
published = "2021-02-10T11:15:12Z"
remediation = "立即升级 McAfee Total Protection 至 16.0.30 或更高版本：打开 MTP 客户端，依次进入「菜单」→「检查更新」下载并安装最新版本，重启系统使补丁生效。如暂时无法升级，可在 Windows 组策略中限制本地非管理员用户的交互登录权限，降低本地用户利用该漏洞提权的风险。"
score = 8.2
severity = "HIGH"
sources = ["kev"]
title = "McAfee Total Protection 任意进程执行漏洞"
updated = "2026-06-17T03:38:57Z"

