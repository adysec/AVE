[basic]
description = "SSLeay 和 OpenSSL 0.9.6b 之前的伪随机数生成器（PRNG）存在安全缺陷，远程攻击者可以通过获取其生成的小量伪随机数输出来推断 PRNG 的内部状态信息，进而预测未来生成的伪随机数序列。由于 SSL/TLS 协议严重依赖 PRNG 生成会话密钥、随机数等安全敏感数据，攻击者成功预测后可能导致加密通信被解密、数字签名被伪造或实施中间人攻击，从而泄露敏感信息。该漏洞影响所有使用受影响版本 SSLeay 和 OpenSSL 的应用与服务，攻击者无需身份认证即可在网络中远程发起利用，OpenSSL 0.9.6b 版本已修复此问题。"
published = "2001-07-10T04:00:00Z"
remediation = "立即升级 OpenSSL 至 0.9.6b 或更高版本，替换受影响的 libcrypto 库文件；若系统存在静态链接该库的二进制文件，需重新编译这些程序。对于使用 pkgsrc 或发行版包管理的用户，安装 openssl-0.9.6b 或更新版本（如 NetBSD 的 openssl-0.9.6nb1）。升级后验证应用程序是否仍使用旧版库，必要时重启相关服务以加载新库。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "SSLeay和OpenSSL 伪随机数生成器信息泄露漏洞"
updated = "2026-06-16T21:55:39Z"

