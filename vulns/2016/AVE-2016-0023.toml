[basic]
description = "hdw-tube WordPress 插件 1.2 版本中存在反射型跨站脚本漏洞（CWE-79），由于对用户输入参数缺乏有效的过滤与转义处理，远程攻击者可构造恶意 URL 诱使用户点击，导致恶意脚本在受害者浏览器中执行，造成信息泄露或会话劫持。攻击需用户交互，无需身份认证，影响使用该插件的 WordPress 站点。"
published = "2016-10-10T20:59:11Z"
remediation = "该插件已停止维护，建议立即从 WordPress 后台插件管理中删除 hdw-tube 插件，或手动删除 /wp-content/plugins/hdw-tube/ 目录。如仍需视频功能，可替换为受支持的替代插件（如 YouTube Embed 等）。同时配置 Web 应用防火墙（WAF）规则拦截包含恶意脚本参数的请求作为临时缓解。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress hdw-tube 插件反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:44Z"

