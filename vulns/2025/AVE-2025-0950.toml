[basic]
description = "Linux内核RDMA/mlx5驱动存在竞态条件漏洞，在ODP MR（按需分页内存区域）注销过程中，硬件端已释放lkey，但并发任务仍可能对同一已释放lkey调用mlx5_ib_invalidate_range()进行范围失效操作，导致UMR QP产生CQE错误并进入错误状态。该漏洞影响使用RDMA/mlx5驱动的Linux内核系统，攻击者需具备本地访问权限及高权限凭证，利用条件较为复杂，主要导致系统可用性受损，可能引发内核崩溃或RDMA服务中断。"
published = "2025-02-27T03:15:13.820"
remediation = "升级Linux内核到包含 RDMA/MLX5 ODP MR 修复的版本：Ubuntu 6.8 或更高版本（含 6.8.0-36），或 Debian 6.1 或更高版本，升级到 Linux kernel 6.8.12+ 或 6.12.6+，或者更新到 Red Hat Enterprise Linux 9.4+ / Rocky Linux 9.4+。Ubuntu 用户可通过 `sudo apt update && sudo apt install linux-generic-hwe-6.8` 完成升级。如果无法立即更新，建议通过 `sysctl -w kernel.dmesg_restrict=1` 限制 dmesg 信息，并避免在多任务环境下使用涉及 RDMA 的应用程序作为临时缓解措施。"
score = 4.7
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux内核 mlx5 RDMA 竞争条件导致CQE错误漏洞"
updated = "2026-06-17T08:44:08.880"

