[basic]
description = 'Jodit 编辑器（npm 包）在 4.12.18 版本之前存在原型污染漏洞。其 `Jodit.configure()` 方法及内部 `ConfigMerge`/`ConfigProto` 辅助函数在合并用户提供的配置选项时，未对 `__proto__`、`constructor`、`prototype` 等原型污染键进行过滤。攻击者可通过在 `controls` 等普通对象选项下嵌套恶意载荷（如 `{"__proto__":{"polluted":"yes"}}`）来污染 `Object.prototype`，导致属性注入、逻辑绕过、拒绝服务等安全问题。该漏洞影响所有将用户可控配置传入 `Jodit.configure()` 的应用，CVSS 评分 6.3，危害等级中危。已在 4.12.18 版本中修复。'
published = "2026-07-01T21:17:03Z"
remediation = "立即将 jodit 升级至 4.12.18 或更高版本，该版本在 ConfigMerge 和 ConfigProto 中过滤了 `__proto__`、`constructor`、`prototype` 等原型污染键。如无法升级，在调用 `Jodit.configure()` 前对用户传入的配置对象做深度递归过滤，移除所有以 `__proto__`、`constructor`、`prototype` 为键的属性。同时避免将未经过滤的用户输入直接传入 `Jodit.configure()`。"
score = 6.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Jodit Jodit 编辑器原型污染漏洞"
updated = "2026-07-02T15:17:04Z"

