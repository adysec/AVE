[basic]
description = "Apache Tomcat 的 CGI Servlet 在 Windows 平台且 enableCmdLineArguments 启用时，由于 JRE 传递命令行参数到 Windows 的方式存在缺陷，导致远程代码执行漏洞。攻击者可通过向 CGI 脚本发送特制参数触发命令注入，实现任意命令执行。该漏洞影响 Tomcat 7.0.0~7.0.93、8.5.0~8.5.39、9.0.0.M1~9.0.17 版本，CVSS 评分 8.1，危害等级高。CGI Servlet 默认关闭，enableCmdLineArguments 在 9.0.x 默认关闭。Apache 已发布新版修复。"
published = "2019-04-15T15:29:00Z"
remediation = "升级 Apache Tomcat 至 9.0.19 及以上、8.5.40 及以上或 7.0.94 及以上版本。如无法升级，在 conf/web.xml 中删除 CGI Servlet 定义或将其注释掉，并确保 catalina.properties 中 enableCmdLineArguments 参数保持默认关闭状态（false）。Windows 环境下切勿启用该参数。"
score = 8.1
severity = "HIGH"
sources = ["nuclei"]
title = "Apache Tomcat CGIServlet 远程代码执行漏洞"
updated = "2026-06-17T02:08:02Z"

