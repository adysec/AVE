[basic]
description = "标签之间。<value>WordPress ThemeREX Addons插件在2020年3月9日之前的版本中，对/trx_addons/v2/get/sc_layout REST API端点缺乏访问控制。由于includes/plugin.rest-api.php文件在处理请求时，将用户可控的sc参数直接传入trx_addons_rest_get_sc_layout函数执行，未经身份认证的远程攻击者可通过发送特制HTTP请求利用该漏洞，在目标服务器上执行任意PHP代码，最终导致服务器被完全控制。该漏洞影响所有使用受影响版本插件的WordPress网站，CVSS评分为9.8，危害等级为严重。"
published = "2020-03-10T00:15:10Z"
remediation = "立即升级 ThemeREX Addons 插件到 2020-03-09 或更高版本以修复未授权代码执行漏洞。如暂时无法升级，应在 WordPress 后台停用该插件作为临时缓解措施，或在 Nginx 与 Apache 配置中添加规则拒绝外部对 /trx_addons/v2/get/sc_layout REST API 端点的访问。升级完成后需全面检查网站根目录及插件目录是否存在异常 PHP 文件，及时清除攻击者可能已植入的后门与 Webshell。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress ThemeREX Addons 未授权代码注入漏洞"
updated = "2026-06-17T02:47:34Z"

