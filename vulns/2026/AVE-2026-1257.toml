[basic]
description = "Progress Software 的 LoadMaster、ECS Connection Manager、Object Scale Connection Manager 以及 MOVEit WAF 存在授权验证不当漏洞。攻击者在拥有低权限的已认证账户条件下，可通过利用该漏洞将自身权限提升至 root 级别，从而实现对受影响设备的完全控制。该漏洞影响上述产品的所有相关版本，攻击条件为需要具备基础认证权限，危害等级为高危（CVSS 8.0）。"
published = "2026-07-27T13:18:22.327"
remediation = "立即将 LoadMaster 升级至 7.2.63.3 或更高版本（或 7.2.54.19 分支的修复版本），ECS Connection Manager、Object Scale Connection Manager 及 MOVEit WAF 同步升级至 7.2.63.3 或更高版本。如暂无法升级，应在管理界面访问控制列表中限制 enablexroot API 端点的访问权限，仅允许可信管理 IP 段调用该接口，并启用 WAF 规则对 /enablexroot 路径的请求进行告警拦截，同时检查系统日志中是否存在非授权用户调用 enablexroot 的记录，发现异常立即隔离受影响设备。"
score = 8
severity = "HIGH"
sources = ["zdi"]
title = "Progress Software LoadMaster 权限提升漏洞"
updated = "2026-07-28T16:22:01.443"

