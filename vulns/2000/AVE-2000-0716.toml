[basic]
description = "Microsoft NetMeeting 3.0.1 的桌面共享功能存在拒绝服务漏洞。当远程桌面共享启用时，未经身份认证的远程攻击者可通过向 NetMeeting 监听端口发送特制的空字节序列，触发目标系统 CPU 资源被大量占用，导致服务响应缓慢或完全不可用。该漏洞攻击复杂度低，无需任何认证即可远程触发，影响 Microsoft NetMeeting 3.0.1 及 4.4.3385 等版本。Exploit-DB 已公开 PoC 利用代码（ID: 20289），攻击者可轻易复现该攻击。"
published = "2000-12-19T05:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS00-077 提供的补丁：Windows 2000 用户下载 https://www.microsoft.com/download/details.aspx?FamilyId=DD418CE9-699F-4D62-8282-5C4337BE5785，Windows NT 4.0 用户下载 https://www.microsoft.com/download/details.aspx?FamilyID=26c9da7c-f778-4422-a6f4-efb8abba021e。如无法打补丁，在防火墙上阻断 TCP 端口 1720 以阻止外部攻击，并禁用 NetMeeting 远程桌面共享功能作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft NetMeeting 远程桌面共享拒绝服务漏洞"
updated = "2026-06-16T21:52:54Z"

