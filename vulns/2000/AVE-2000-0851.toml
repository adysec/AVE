[basic]
description = 'Computer Associates InoculateIT 4.53 的 Microsoft Exchange 代理在处理邮件时存在病毒检测绕过漏洞。当 SMTP 邮件头中缺少 "From" 字段时，该代理无法正确识别邮件附件中携带的病毒，导致恶意附件被放行。远程攻击者可通过构造缺少 From 头的特制邮件绕过病毒扫描机制，将病毒文件投递到目标系统，从而突破安全防护。该漏洞影响 InoculateIT 4.53 版本，攻击复杂度低，无需身份认证即可远程利用。'
published = "2000-12-31T05:00:00Z"
remediation = "该漏洞影响的产品 Computer Associates InoculateIT Agent for Exchange Server 已停止维护多年，官方不再提供安全更新。建议立即迁移至受支持的邮件安全解决方案（如 Microsoft Defender for Office 365、Broadcom Symantec Email Security.cloud 等），并配置 Exchange Server SMTP 接收连接器，启用地址标头验证规则，拒绝缺少 From 字段的入站邮件，同时部署网络层邮件过滤网关作为额外防护层。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Computer Associates InoculateIT Exchange代理 病毒防护绕过漏洞"
updated = "2026-06-16T21:53:27Z"

