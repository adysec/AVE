[basic]
description = "Mandrake Linux 的 usermode 用户模式数据包存在安全漏洞，本地攻击者利用该漏洞可导致系统重启或关机，造成拒绝服务。该漏洞源于 usermode 包对用户权限检查不严，允许无特权的本地用户执行本应仅限 root 用户操作的重启或关机命令。攻击者只需拥有本地 shell 访问权限即可触发，无需身份认证，但无法远程利用。该漏洞影响 Mandrake Linux 多个版本，CVSS 评分 2.1，危害等级低。"
published = "2000-07-18T04:00:00Z"
remediation = "升级 usermode 包至修复版本（Mandrake Linux 用户应安装 RHSA-2000-053 公告提供的更新包），或从受影响系统中移除 usermode 包的 suid 权限位：执行 chmod u-s /usr/bin/reboot /usr/bin/halt 移除不必要的 setuid 权限，限制可执行关机命令的用户组。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "Mandrake Linux usermode 本地拒绝服务漏洞"
updated = "2026-06-16T21:52:09Z"

