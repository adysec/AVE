[basic]
description = "NI LabVIEW 在加载恶意构造的 .lvlib 文件时存在越界写入漏洞（CWE-787），由于程序未对文件数据边界进行充分校验，攻击者可通过诱导用户打开特制的 .lvlib 库文件触发内存损坏，导致敏感信息泄露或任意代码执行。该漏洞影响 LabVIEW 2026 Q1（26.1.0）及之前版本，攻击需要用户交互，CVSS 评分 8.5，危害等级高。建议用户尽快升级至最新版本。"
published = "2026-04-07T20:16:24Z"
remediation = "建议立即将 NI LabVIEW 升级至以下对应修补版本：LabVIEW 2026 Q1 用户升级至 Patch 1 或更高版本，LabVIEW 2025 用户升级至 2025 Q3 Patch 4 或更高版本，LabVIEW 2024 用户升级至 2024 Q3 Patch 6 或更高版本，LabVIEW 2023 用户升级至 2023 Q3 Patch 9 或更高版本。可通过 NI Package Manager 或 NI 官方软件下载页面获取更新。如无法立即升级，应避免打开来源不明的 .lvlib 项目库文件，并限制 LabVIEW 对不可信文件的访问权限。"
score = 8.5
severity = "HIGH"
sources = ["zdi"]
title = "NI LabVIEW LVLIB文件解析越界写入漏洞"
updated = "2026-07-24T23:10:00Z"

