[basic]
description = "PHP 3及4版本在实现文件上传功能时存在安全漏洞，攻击者可通过在上传表单中隐藏与内部PHP脚本变量名相同的表单字段，绕过系统验证，从而读取服务器上任意文件。该漏洞影响PC及4（已废弃版本），对系统保密性构成中度威胁。攻击者无需身份验证即可远程利用此漏洞，攻击复杂度较低，可导致目标系统敏感文件被窃取或泄露。截至2024年，本漏洞评估值为5.0（CVSS v2.0评分：5.0），根据NVD原始报告于2000年11月14日首次披露，至今已有24年历史，但针对旧版PHP系统的残留部署仍值得关注。该漏洞因涉及PHP早期版本历史遗留问题，成熟PoC技术较多，但现代PHP版本（7.0+）已修复此缺陷，建议升级到当前版本并彻底删除已废弃的PHP 3/4代码库。"
published = "2000-11-14T05:00:00.000"
remediation = "立即升级到PHP 5.6或更高版本（PHP 7.x/8.x已包含所有安全修复），或切换到支持的操作系统/webapp主机。如无法立即升级，请通过开发配置禁用不安全的文件上传功能，在php.ini中将`file_uploads`设置为`off`并在.htaccess中添加`php_value expose_php off`等临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "PHP PHP 3/4 版本 任意文件读取漏洞"
updated = "2026-06-16T21:52:37.143"

