[basic]
description = "IBM AIX 4.3.x 及更早版本的 enq 命令存在缓冲区溢出漏洞。该漏洞源于 enq 命令在处理长 -M 参数时未对输入长度进行有效边界检查，导致栈缓冲区溢出。攻击者可通过向 enq 命令传递超长的 -M 参数触发该漏洞，进而在本地系统上执行任意命令，完全控制系统。该漏洞影响本地用户，无需身份认证即可利用，CVSS 评分 7.2，危害等级高。IBM 已通过相应安全更新修复此漏洞。"
published = "2001-01-09T05:00:00.000"
remediation = "安装 IBM 官方安全补丁：AIX 4.3.x 用户应用 APAR IY08143，AIX 4.2.x 用户应用 APAR IY08287，可从 IBM 技术支持站点下载对应修复包并安装。如无法立即打补丁，临时缓解措施为移除 /usr/bin/enq 的 SUID 位：执行命令 chmod u-s /usr/bin/enq，并限制本地用户对该命令的访问权限，以减少被本地用户利用的风险。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "IBM AIX enq 命令缓冲区溢出漏洞"
updated = "2026-06-16T21:53:11.570"

