[basic]
description = "GNU Enscript 1.6.1 及之前版本在创建临时文件时未采取安全的文件命名机制，存在符号链接攻击漏洞。本地攻击者可通过在目标系统上预创建指向任意文件的符号链接，诱使 Enscript 在处理文件时覆盖攻击者指定的任意文件，导致敏感数据破坏或权限提升。攻击条件为拥有本地用户权限，无需交互即可利用。"
published = "2002-01-31T05:00:00Z"
remediation = "升级 GNU Enscript 至 1.6.2 或更高版本。Debian 系统执行 apt-get install enscript 更新至修复版本（参考 DSA-105）；Red Hat 系统应用 RHSA-2002:012 更新；Mandrake 系统安装 MDKSA-2002:010 补丁。临时缓解措施：避免以特权用户身份运行 enscript，或设置更严格的 umask 限制临时文件权限。"
score = 3.6
severity = "LOW"
sources = ["redhat"]
title = "GNU Enscript 符号链接攻击漏洞"
updated = "2026-06-16T21:56:39Z"

