[basic]
description = "Google Chrome 18.0.1025.151 之前的版本存在同源策略（Same Origin Policy）绕过漏洞，根因是浏览器在处理跨源 IFRAME 元素的替换操作时源验证不充分。远程攻击者可构造恶意网页，诱导用户访问后通过替换 IFRAME 元素等向量绕过浏览器的同源隔离机制，进而读取或操作其他源的页面数据，导致敏感信息泄露，并可能进一步篡改页面内容。该漏洞影响 Apple iOS 5.1.1 及更早版本内置的 WebKit 内核以及 Chrome 等多个平台，攻击条件要求用户主动访问恶意构造的页面，CVSS 评分为 6.8，危害等级中等偏上。Google 已在 Chrome 18.0.1025.151 版本中修复此问题。"
published = "2012-04-05T22:02:07Z"
remediation = "立即升级 Google Chrome 至 18.0.1025.151 及以上版本（Stable Channel 2012 年 4 月 4 日更新），企业环境可通过组策略强制推送该版本并禁用旧版本升级检查绕过；同时将 Apple iOS/Safari 升级至 6.0 及以上版本以修复 WebKit 内核缺陷。若无法立即升级，可在浏览器或 Web 应用中设置严格内容安全策略（Content-Security-Policy，禁用 frame-src 不可信来源）、部署 X-Frame-Options: DENY 或 frame-ancestors 响应头，并启用 Site Isolation 阻止跨源 iframe 注入，以缓解同源策略绕过风险。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome WebKit 同源策略绕过漏洞"
updated = "2026-06-16T23:32:33Z"

