[basic]
description = "RealNetworks RealPlayer 11.0 至 11.1 及 RealPlayer SP 1.0 至 1.1.4 版本在 Windows 平台上处理 QCP 文件时存在整数溢出漏洞，攻击者可通过诱导用户打开精心构造的恶意 QCP 文件，触发整数溢出进而引发堆缓冲区溢出，实现远程任意代码执行。该漏洞影响 Windows 平台上受影响版本的 RealPlayer，CVSS 评分 9.3（AV:N/AC:M/Au:N/C:C/I:C/A:C），属高危漏洞，攻击者无需认证即可远程利用，成功利用可完全控制目标系统。"
published = "2010-08-30T20:00:01Z"
remediation = "建议立即升级 RealPlayer 至 SP 12.0.0.879 或更高版本（访问 real.com 下载最新版）。若无法立即升级，建议卸载 RealPlayer 或在受信任环境中禁用 QCP 文件关联，禁止打开不可信的 .qcp 文件，并在防火墙层面限制 RealPlayer 进程的网络访问作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealPlayer SP 缓冲区溢出代码执行漏洞"
updated = "2026-06-16T23:15:30Z"

