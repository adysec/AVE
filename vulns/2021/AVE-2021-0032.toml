[basic]
description = "Android MFC充电器驱动中存在竞争条件漏洞，该漏洞源于对共享资源的并发访问缺乏恰当的同步机制。在SMR MAY-2021 Release 1之前版本的Google Android系统中，本地攻击者可在radio权限已被攻破的前提下，利用该竞争条件绕过系统签名验证，执行未授权操作。成功利用该漏洞可能导致系统完整性被破坏或恶意代码执行。"
published = "2021-06-11T15:15:09Z"
remediation = '请将三星 Galaxy 设备升级至 SMR MAY-2021 Release 1 或更高版本的安全补丁，可通过"设置 → 软件更新 → 下载并安装"进行升级；受影响系统版本包括 Android 8.x（Oreo）、9.0（Pie）、10.0、11.0（R），对应 SMR 日期须为 2021 年 5 月或之后。如无法立即升级，建议通过 Knox Manage 或 MDM 策略禁用不必要的 radio 权限应用，并启用 Google Play Protect 实时扫描以降低本地提权攻击面。'
score = 6.4
severity = "MEDIUM"
sources = ["kev"]
title = "三星 Android MFC 充电驱动竞争条件绕过签名检查漏洞"
updated = "2026-06-17T03:42:00Z"

