[basic]
description = "tags.<value>Open WebUI 在 0.8.8 至 0.10.2 版本中，内联直接模型元数据在处理客户端提供的知识附件时，未将其与调用者的读取权限进行校验。已认证的任意角色用户（无需管理员权限）若知晓其他用户的文件 ID，即可通过发送携带内联模型定义及该文件知识附件的聊天请求，诱使内置知识工具返回该文件的索引内容，造成跨用户机密信息泄露。该漏洞为只读操作，不会修改或删除数据，也不会影响知识库权限及已保存工作区模型的验证。此问题在 0.11.0 版本中已修复。"
published = "2026-08-04T21:16:37Z"
remediation = "立即将 Open WebUI 升级至 0.11.0 或更高版本，该版本通过提交 305880f2e 修复了内联模型附件未经过权限校验的问题。升级前请确认当前版本处于 0.8.8 至 0.10.2 的受影响范围内。如暂无法升级，可临时禁用 function_calling 功能（设置 function_calling: legacy）或关闭 builtin_tools 能力以阻止知识工具被滥用，但仅作临时缓解，建议尽快完成版本升级。"
score = 5.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Open WebUI 内联模型知识附件跨用户文件内容泄露漏洞"
updated = "2026-08-05T16:17:02Z"

