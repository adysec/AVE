[basic]
description = "Samsung 开源图形渲染库 rlottie 存在越界写入漏洞（CWE-787），由于在处理矢量图形数据时未能正确校验缓冲区边界，导致发生缓冲区溢出。攻击者可构造恶意 Lottie 动画文件，诱导用户通过受影响的应用程序或浏览器打开，从而在目标系统上触发越界写入，造成内存损坏，可能导致信息泄露或程序崩溃引发拒绝服务。该漏洞影响 rlottie 在提交 dcfde72eae1b0464dc0dd760aec00ada6a148635 之前的版本，攻击需用户交互，本地攻击向量，CVSS 评分为 6.1（中危）。官方通过拉取请求（github.com/Samsung/rlottie/pull/589）修复该问题，建议受影响用户更新至最新版本。"
published = "2026-06-04T10:16:40Z"
remediation = "请升级 rlottie 至包含提交 dcfde72eae1b0464dc0dd760aec00ada6a148635 及其之后修复的版本，该提交修复了处理 Lottie/JSON 动画时的越界写入问题。Debian 用户可通过 `apt update && apt upgrade lottie rlottie0`（或对应包名）应用 DLA-4675-1 安全更新。由于该漏洞需用户交互打开恶意动画文件触发（CVSS 向量 UI:R），如无法及时升级，切勿打开来源不明的 Lottie/JSON 动画文件，并在涉及该库的渲染应用中做输入校验与沙箱隔离作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["zdi"]
title = "Samsung Open Source rlottie 缓冲区越界写入漏洞"
updated = "2026-07-22T20:10:00Z"

