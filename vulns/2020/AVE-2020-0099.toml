[basic]
description = "Sumavision Enhanced Multimedia Router (EMR) 3.0.4.27 的 goform/formEMR30 接口存在未授权访问漏洞，远程攻击者无需任何认证即可通过发送特制的 HTTP 请求（如 setString=new_user<*1*>administrator<*1*>123456）在设备上创建具有管理员权限的任意用户。攻击成功后，攻击者可完全控制路由器设备，窃取网络流量、修改网络配置或发起进一步内网攻击。该漏洞攻击复杂度低，无需用户交互，CVSS 评分 9.8，危害等级严重。厂商尚未发布官方修复补丁。"
published = "2020-03-11T16:15:12.007"
remediation = "立即将 Sumavision EMR 路由器固件升级至厂商提供的最新版本（如有）；若厂商已停止支持，建议更换为受支持的设备。作为临时缓解措施，在路由器管理界面禁用远程管理功能，并在网络防火墙层面限制对 TCP 端口 80/443 的访问，仅允许受信任的管理 IP 地址连接。同时监控设备日志中是否存在异常用户创建行为（如通过 goform/formEMR30 接口的 setString 请求）。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Sumavision Enhanced Multimedia Router 任意管理员用户创建漏洞"
updated = "2026-06-17T02:47:27.243"

