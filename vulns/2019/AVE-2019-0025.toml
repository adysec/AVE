[basic]
description = "Apache Tomcat 的 SSI printenv 命令存在跨站脚本（XSS）漏洞，该命令在输出用户提供的数据时未进行转义处理，导致攻击者可以构造恶意请求注入任意 JavaScript 代码。攻击者需要诱使已登录的管理员用户访问特制链接，在用户浏览器中执行恶意脚本，从而窃取会话 Cookie 或执行其他恶意操作。该漏洞影响 Apache Tomcat 7.0.0 至 7.0.93、8.5.0 至 8.5.39 以及 9.0.0.M1 至 9.0.0.17 版本。SSI 功能默认关闭，printenv 命令仅用于调试，生产环境中通常不会启用，因此实际利用条件较为受限。CVSS 评分 6.1，危害等级中危。"
published = "2019-05-28T22:29:00Z"
remediation = "建议升级至 Apache Tomcat 7.0.94、8.5.40 或 9.0.18 及更高版本，官方已在该版本中修复 printenv 命令未转义输出导致的 XSS 漏洞。若暂时无法升级，由于 SSI 默认处于禁用状态且 printenv 命令仅用于调试，应保持 SSI 禁用，并通过修改 web.xml 中 ssi-enabled 参数为 false 或删除相关的 .shtml 处理配置来彻底关闭服务端包含功能；如业务确需启用 SSI，请移除所有使用 printenv 指令的 .shtml 页面，并确保在代理或 Web 应用层对用户可控参数进行 HTML 实体转义。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Apache Tomcat SSI printenv 命令跨站脚本漏洞"
updated = "2026-06-17T02:08:01Z"

