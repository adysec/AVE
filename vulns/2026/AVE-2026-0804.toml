[basic]
description = "Pion DTLS 是使用 Go 语言实现数据报传输层安全（DTLS）协议的库。该库存在越界读取（CWE-125）漏洞，在解析精心构造的 ECDHE_PSK ServerKeyExchange 消息时，程序会因读取越界触发 panic，导致未捕获的运行时错误。攻击仅需构造并发送特制的 ECDHE_PSK 握手消息，无需身份认证即可远程触发，造成进程崩溃，从而对依赖该库的 DTLS 服务造成拒绝服务（DoS）。该漏洞影响 Pion DTLS v3.1.4 之前的所有版本，CVSS 评分为 6.3（中危）。官方已在 v3.1.4 版本中通过 GitHub pull request #839 修复，建议用户升级至 v3.1.4 或更高版本。"
published = "2026-07-01T20:17:10Z"
remediation = "建议立即升级到 Pion DTLS v3.1.4 或更高版本，该版本已修复解析精心构造的 ECDHE_PSK ServerKeyExchange 消息时触发 panic 的问题（详见 https://github.com/pion/dtls/pull/839）。在升级前暂无可用的官方缓解措施，若产品依赖 dtls 库，请同步升级 Go 依赖并重新编译部署，同时勿在不可信网络环境中运行受影响版本，以防远程拒绝服务攻击。"
score = 6.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Pion DTLS vulnerable to denial of service via panic while parsing a crafted ECDHE_PSK ServerKeyExchange message 漏洞"
updated = "2026-07-02T18:43:54Z"

