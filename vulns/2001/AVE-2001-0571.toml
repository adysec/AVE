[basic]
description = '` tags as specified.<value>Microsoft Internet Information Services（IIS）4.0 和 5.0 版本存在文件片段读取漏洞。远程攻击者无需身份认证即可向目标服务器发送包含"%3F+.htr"后缀的恶意请求，该请求会被服务器的.HTR ISAPI扩展错误处理，导致可执行Web程序的源代码被当作普通文本文件返回并暴露给攻击者。此漏洞影响所有使用受影响版本IIS的Windows服务器，攻击者通过利用该漏洞可以获取Web应用程序的敏感源代码信息，进而可能发现更多安全缺陷或获取数据库连接凭据等机密数据，造成信息泄露风险。CVSS 评分 5.0，危害等级为中等。'
published = "2001-02-12T05:00:00.000"
remediation = '首选措施为在 IIS 中彻底禁用 .HTR 脚本映射：打开 Internet Services Manager，右键点击目标 Web 服务器，依次选择「属性」→「主属性」→「WWW 服务」，点击「编辑」→「主目录」→「配置」，在「应用程序扩展」列表中找到 .HTR 条目并移除，确认后重启 IIS 服务使配置生效。对于 IIS 4.0（Windows NT 4.0 SP5/SP6a）和 IIS 5.0（Windows 2000 Gold/SP1/SP2），若业务确实需要保留 .HTR 功能，则需安装 Microsoft 安全公告 MS01-004 补丁 KB285985（IIS 4.0 下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=A8270ADC-A836-4B32-A7AF-9E7BE14845A5；IIS 5.0 下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=04FAB0BC-D950-4E64-8672-2731756B72FE）。补丁安装后可通过注册表验证：IIS 4.0 检查键值 HKLM\software\Microsoft\Windows NT\CurrentVersion\Hotfix\Q285985 是否存在；IIS 5.0 检查 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Updates\Windows 2000\SP3\Q285985。该补丁同时覆盖了 MS00-031 和 MS00-044 公告中描述的 HTR 相关漏洞。此外，建议在 IIS 中一并移除 .IDQ、.IDA、.HTW 等不必要的脚本映射，以降低攻击面，具体可参考 Microsoft IIS 4.0 安全检查清单（https://www.microsoft.com/technet/security/chklist/iischk.mspx）。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft IIS 远程文件片段信息泄漏漏洞"
updated = "2026-06-16T21:53:28.340"

