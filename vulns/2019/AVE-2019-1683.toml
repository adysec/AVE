[basic]
description = "Zimbra Collaboration Suite 的 ProxyServlet 组件存在服务端请求伪造（SSRF）漏洞，未经身份认证的远程攻击者可利用该漏洞向内部网络发送恶意请求，结合 XML 外部实体注入（XXE）实现命令执行。该漏洞影响 Zimbra 8.6 patch 13 之前、8.7.11 patch 10 之前及 8.8.10 patch 7/8.8.11 patch 3 之前的多个版本，CVSS 评分 7.5，危害等级高。攻击者无需认证即可远程触发，利用复杂度低，已存在公开的 PoC 和 Metasploit 利用模块。"
published = "2019-04-30T18:29:08.633"
remediation = "升级 Zimbra Collaboration Suite 至 8.6 patch 13、8.7.11 patch 10、8.8.10 patch 7 或 8.8.11 patch 3 及以上版本。如无法立即升级，可在反向代理或 WAF 层面限制对 /ProxyServlet 路径的访问，并禁用不必要的 SSRF 功能入口。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Zimbra Collaboration Suite 服务端请求伪造漏洞"
updated = "2026-06-17T02:44:03.280"

