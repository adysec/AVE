[basic]
description = "tags.<value>Microsoft Windows 2000 域控制器的 Kerberos 服务存在内存泄漏漏洞。未经身份验证的远程攻击者可通过反复向目标系统的 Kerberos 服务发起 TCP 连接并在不发送任何数据的情况下立即断开连接的方式触发该漏洞，导致服务端内存持续累积无法释放，最终造成拒绝服务。该漏洞影响运行 Windows 2000 Server 的域控制器系统，攻击者无需任何凭据即可在局域网或互联网远程实施攻击，利用门槛低且效果持久。"
published = "2001-06-27T04:00:00.000"
remediation = '安装 Microsoft 安全公告 MS01-024 对应的安全补丁（知识库文章 Q294391），或将系统升级至 Windows 2000 Service Pack 3（已包含此修复），补丁适用于已安装 Service Pack 1 或 Service Pack 2 的 Windows 2000 Server、Advanced Server 和 Datacenter Server 域控制器。补丁通过使 Kerberos 服务正确识别并拒绝畸形请求来消除内存泄漏。如无法立即打补丁，应在防火墙层面阻止外部对域控制器 TCP 88 端口（Kerberos）和 TCP 464 端口（Kerberos Change/Set Password）的访问，防止未授权用户从网络外部发起利用。域内建议部署多台域控制器，当单台域控制器因攻击而耗尽内存时，其余域控制器可分担负载。安装补丁后可通过注册表项 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Updates\Windows 2000\SP2\Q294391 验证修复是否生效。注意该补丁后续已被 MS01-036 中的补丁取代，建议获取最新更新。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows 2000 Kerberos 内存泄漏拒绝服务漏洞"
updated = "2026-06-16T21:53:56.350"

