[basic]
description = "NukeViet CMS 存在服务端请求伪造（SSRF）漏洞，未经身份认证的远程攻击者可通过构造特制的 X-Forwarded-Host 和 X-Forwarded-Proto 请求头，利用 server_info_update() 函数中未经验证的 cURL 调用，诱使服务器向攻击者指定的主机发起 HTTP 请求。由于 __serverInfoUpdate 处理逻辑在身份验证之前执行，且主机名净化函数 standardizeHost() 存在端口正则绕过缺陷（如添加尾部斜杠），攻击者可实现未认证的内网主机与端口扫描，以及服务器响应缓存投毒。该漏洞影响 NukeViet CMS 多个版本，CVSS 评分 7.2，危害等级高。厂商已在后续版本中通过限制转发头来源、校验目标主机与域名白名单等方式修复。"
published = "2026-01-01T00:00:00Z"
remediation = "升级 NukeViet 至已修复版本（commit aa109b66），该版本在 `standardizeHost()` 中使用 `parse_url()` 解析主机名以绕过 `:port/` 后缀绕过漏洞，并将 `X-Forwarded-Proto` 限制为仅允许 `http`/`https` 白名单。如无法立即升级，在反向代理/Web 服务器层配置规则，剥离或覆盖客户端传入的 `X-Forwarded-Host`、`X-Forwarded-Proto`、`X-Forwarded-Port` 请求头，同时在 NukeViet 后台 `my_domains` 配置中填写站点真实域名以启用主机名校验。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "NukeViet NukeViet 预认证服务端请求伪造漏洞"
updated = "2026-01-01T00:00:00Z"

