[basic]
description = "Zope 2.2.0 至 2.2.4 版本在 Image 和 File 对象的数据更新方法上存在访问控制缺陷，未能正确实施权限保护机制。具有 DTML 编辑权限的攻击者可以通过构造恶意 DTML 模板调用这些未受保护的方法，直接修改 Image 和 File 对象的底层原始数据。该漏洞影响 Zope 2.2.0 至 2.2.4 所有版本，攻击者无需身份认证即可在网络可达的前提下利用此漏洞篡改文件内容，导致数据完整性受损。CVSS 评分为 5.0，危害等级为中等。"
published = "2000-12-18T05:00:00Z"
remediation = '建议立即升级到 Zope 2.2.5 或更高版本（该版本修复了 DTML 权限校验缺陷）。若无法立即升级，请从 Zope 官方应用 2000-12-18 发布的热修复补丁（Hotfix_2000-12-18）。临时缓解措施：严格限制 DTML 编辑权限，仅授予可信管理员；在 Zope 管理界面中移除非必要用户的 "Add DTML Methods/Objects" 权限；配置防火墙限制管理端口（默认 8080/9673）仅允许内网访问。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Zope 2.2.4 DTML 权限提升漏洞"
updated = "2026-06-16T21:53:23Z"

