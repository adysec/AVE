[basic]
description = "标签中。<value>Nuxt 4.4.0 至 4.5.1 版本存在信息泄露漏洞（CWE-524）。当页面应用了 routeRules 的 cache、swr 或 isr 配置时，Nuxt 会启用运行时负载提取并暴露 `/<page>/_payload.json` 端点。受影响版本的渲染器将 SSR 负载存储在共享缓存中，但仅以路径作为缓存键，未纳入 cookie、authorization 头或 cache.varies 维度。攻击条件为目标站点使用受影响版本的 Nuxt 且存在包含用户敏感数据的缓存页面。利用方式为：一旦已认证用户访问过受保护的缓存页面，攻击者通过发送 `GET /<page>/_payload.json` 请求，即可获取第一个用户缓存中的完整 SSR 数据，包括通过 useFetch 或 useAsyncData 加载的个人资料、租户、账单及类 token 值。HTML 响应本身仍受路由守卫保护，但提取的 JSON 负载会被未认证用户或其他已认证用户获取。建议升级至 4.5.1 或禁用 experimental.payloadExtraction，并在 CDN 层对 `/_payload.json` 实施访问控制。"
published = "2026-08-05T22:17:07Z"
remediation = "立即将 Nuxt 升级到 4.5.1 或更高版本。如暂时无法升级，可在 `nuxt.config.ts` 中设置 `experimental.payloadExtraction: false` 禁用运行时 payload 提取，使 `/_payload.json` 返回 404。请勿对渲染用户敏感 SSR 数据的页面启用 `cache`、`swr` 或 `isr` 路由规则，并在代理或 CDN 层对 `/**/_payload.json` 强制要求身份验证。升级完成后清除 CDN 或平台缓存中已存在的受保护 payload，防止历史缓存数据泄露。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Nuxt 运行时 payload 缓存信息泄露漏洞"
updated = "2026-08-06T22:18:29Z"

