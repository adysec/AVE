[basic]
description = "lv 文件查看器在处理 .lv 配置文件时存在路径搜索漏洞，程序默认从当前工作目录加载 .lv 文件而未限制搜索路径范围。本地攻击者可通过在其他目录中放置恶意的 .lv 配置文件，诱使其他 lv 用户在该目录下运行 lv 命令，从而以目标用户权限执行任意命令。该漏洞影响 lv 所有版本，攻击者需具备本地访问权限且能控制目标用户的工作目录，利用难度较低，可导致权限提升或敏感信息窃取。"
published = "2003-06-09T04:00:00Z"
remediation = "升级 lv 至修复版本：Debian 系统升级至 4.49.4-7（woody）或 4.49.5-2（unstable）及以上版本，Red Hat 系统安装 RHSA-2003-167/RHSA-2003-169 提供的更新包。如无法升级，可删除或限制用户对当前目录 .lv 文件的写入权限，或移除 lv 的 setuid 位作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "GNU lv 本地代码执行漏洞"
updated = "2026-06-16T22:01:43Z"

