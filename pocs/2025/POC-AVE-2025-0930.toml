[info]
author = "ave"
description = "验证 Linux kernel 是否存在 CVE-2025-21692 漏洞。该漏洞是 net/sched/sch_ets.c 中 ets_class_from_arg() 函数的数组越界索引问题（CWE-129），当通过 tc 命令经 netlink socket 传入 clid=0 时可导致本地权限提升。完整利用代码见 https://github.com/volticks/CVE-2025-21692-poc。"
id = "POC-AVE-2025-0930"
name = "CVE-2025-21692 Linux Kernel ETS qdisc OOB Index PoC"
severity = "high"
tags = ["ave-2025-0930"]
vuln_id = [
    "CVE-2025-21692",
    "AVE-2025-0930",
]

[poc]
logic = "any"

[[poc.requests]]
path = "/proc/version"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Linux version"]
