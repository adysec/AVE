[basic]
description = "Apple Safari 浏览器 WebKit 引擎中存在跨站脚本漏洞，由于对 location.href 属性的 URL 规范化处理不当，远程攻击者可通过构造恶意网页向用户浏览器注入任意脚本或 HTML 代码。该漏洞影响 Apple Safari 6.0 之前的所有版本，攻击者无需身份认证即可通过网络远程发起攻击。当用户访问包含恶意脚本的网页时，浏览器会在当前页面上下文中执行攻击者注入的代码，导致会话劫持、敏感信息窃取或页面篡改等危害。CVSS 评分 4.3，危害等级为中危。"
published = "2012-07-25T19:55:06.210"
remediation = "立即将 Apple Safari 浏览器升级至 6.0 或更高版本，该版本修复了 WebKit 引擎中对 location.href 属性 URL 规范化处理不当导致的跨站点脚本漏洞。如暂时无法升级，建议切换至其他现代浏览器（如 Google Chrome 或 Mozilla Firefox）访问来源不明的网页，并避免点击可疑链接或执行不受信任的脚本，以降低被攻击的风险。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari 跨站点脚本漏洞"
updated = "2026-06-16T23:43:45.210"

