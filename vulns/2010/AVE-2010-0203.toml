[basic]
description = 'OpenOffice.org（OOo）2.x及3.3之前版本中存在多个目录遍历漏洞（CWE-22）。远程攻击者可通过向XSLT JAR过滤器描述文件、扩展（OXT）文件或其他JAR/ZIP压缩包中的条目注入".."（点点）路径穿越序列，在解压过程中实现任意文件覆写。攻击者只需诱使用户打开特制的恶意文档或安装恶意扩展即可触发漏洞，无需其他认证条件。成功利用该漏洞可导致系统文件被覆盖，进而可能实现远程代码执行，CVSS评分高达9.3，危害严重。Apache OpenOffice 3.3版本已修复此问题。'
published = "2011-01-28T22:00:05Z"
remediation = "升级至 Apache OpenOffice 3.3 或更高版本，该版本修复了 ZIP/JAR 文件解压时的目录遍历问题。如无法立即升级，可在打开来源不明的 OXT、JAR 或 ZIP 文件前进行安全审查，避免解压不可信文档。Linux 用户可通过发行版包管理器（如 apt upgrade openoffice.org）更新。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apache OpenOffice 目录遍历漏洞"
updated = "2026-06-16T23:22:47Z"

