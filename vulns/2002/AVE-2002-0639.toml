[basic]
description = "SAP DB 7.3 及更早版本中的 lserver 程序在查找并执行 lserversrv 程序时，使用当前工作目录而非安全路径来定位目标程序。攻击者可在当前工作目录中创建指向 lserver 程序的符号链接（symlink），当 lserver 尝试执行 lserversrv 时，会被重定向至攻击者构造的恶意程序，从而以 lserver 的权限运行任意代码。该漏洞允许本地用户通过符号链接劫持手段获取提升的权限，危及系统安全性。攻击条件为攻击者需具备本地访问权限并在目标目录中具有创建符号链接的能力。"
published = "2004-04-15T04:00:00.000"
remediation = "升级 SAP DB 到支持修复 CVE-2002-1576 漏洞的最新版本 (7.4 或更高版本)，并修改 lserver 二进制文件的权限设置为 755，确保其所在目录不可写且不包含恶意 lserversrv 文件。如无法立即升级，可通过在 /etc/security/limits.conf 中添加 `lserver hard limit nproc 1024` 限制 lserver 进程资源，或通过在 /etc/ld.so.conf 中注释 `/lib` 路径以限制 lserver 从当前目录加载共享库，达到临时缓解效果。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "SAP SAP DB 符号链接本地权限提升漏洞"
updated = "2026-06-16T21:59:35.070"

