[basic]
description = "GNU Ghostscript 7.07 之前版本中存在未明漏洞，即使启用了 -dSAFER 安全沙箱模式，攻击者仍可通过构造恶意的 PostScript 文件，利用恶意打印作业触发任意命令执行。该漏洞影响所有运行 GNU Ghostscript 7.07 之前版本的系统，攻击者无需身份认证即可远程利用，可导致目标系统被完全控制。由于 Ghostscript 广泛用于文档处理流程中，攻击面较大。"
published = "2003-06-16T04:00:00.000"
remediation = "立即升级 GNU Ghostscript 至 7.07 或更高版本。Red Hat 用户请安装 RHSA-2003:181/RHSA-2003:182 提供的更新包；Mandriva 用户安装 MDKSA-2003:065 更新。临时缓解措施：在无法立即升级时，避免处理来源不可信的 PostScript 文件，并在打印服务中禁用 PostScript 解析或使用沙箱限制 Ghostscript 进程权限。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "GNU Ghostscript 远程代码执行漏洞"
updated = "2026-06-16T22:02:03.307"

