[info]
author = "ave"
description = "通过检测 /crowd/admin/uploadplugin.action 接口的响应状态来验证 Atlassian Crowd 是否存在未经身份验证的插件上传漏洞"
id = "POC-AVE-2019-0222"
name = "Atlassian Crowd Plugin Upload RCE PoC"
severity = "critical"
tags = ["ave-2019-0222"]
vuln_id = [
    "CVE-2019-11580",
    "AVE-2019-0222",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/crowd/admin/uploadplugin.action"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [400]
type = "status"
