[info]
author = "AVE"
description = "检测 Adobe ColdFusion 的 Apache BlazeDS AMF 网关反序列化漏洞（CVE-2017-3066），通过向 /flex2gateway/amf 发送 POST 请求验证目标是否存在该漏洞"
id = "POC-AVE-2017-0609"
name = "Adobe ColdFusion BlazeDS 反序列化漏洞 PoC"
severity = "critical"
tags = [
    "cve-2017-3066",
    "coldfusion",
    "blazeds",
    "deserialization",
]
vuln_id = [
    "CVE-2017-3066",
    "AVE-2017-0609",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/flex2gateway/amf"
protocol = "http"

[poc.requests.body]
content = "AAEAAQAAAAAAAH8JAAEAAQ=="
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-amf"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "amf",
    "flex",
]
