[basic]
description = "FreeType 字体渲染库在解析 BDF（Bitmap Distribution Format）字体文件时，其 _bdf_list_ensure() 函数存在堆缓冲区越界读取漏洞。FreeType 2.4.9 之前的所有版本均受此漏洞影响，使用受影响版本 FreeType 的应用程序（如 Mozilla Firefox Mobile 10.0.4 之前版本）同样面临风险。远程攻击者可构造一个包含特制表头的恶意 BDF 字体文件，当目标系统使用受影响的应用打开或加载该字体文件时，即可触发内存越界读取，导致应用程序崩溃或内存损坏，攻击者可能借此实现远程代码执行。该漏洞 CVSS v2 评分为 9.3，危害等级高。用户应避免打开来源不明的字体文件，并将 FreeType 升级至 2.4.9 或更高版本以消除风险。"
published = "2012-04-25"
remediation = "升级 FreeType 至 2.4.9 或更高版本。Linux 发行版用户可通过包管理器更新：Ubuntu/Debian 执行 `sudo apt-get update && sudo apt-get install freetype`，Red Hat/CentOS 执行 `sudo yum update freetype`。Mozilla Firefox Mobile 用户升级至 10.0.4 或更高版本。Apple iOS 用户升级至 iOS 6.0 或更高版本。如无法立即升级，可禁用 BDF 字体解析作为临时缓解措施。"
score = 3.5
severity = "LOW"
sources = ["tenable"]
title = "FreeType BDF字体解析堆缓冲区越界读取漏洞"
updated = "2012-04-25"

