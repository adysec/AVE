[basic]
description = "Linux 内核 exec 函数在处理进程执行时对 FS_Struct 结构中 in_exec 字段的临时使用存在逻辑缺陷。该漏洞影响 SUSE Linux Enterprise 15 SP6 RT kernel、SUSE Linux Enterprise 15 SP6 kernel 及 SUSE Linux Enterprise 15 SP7 Azure kernel 等版本，可能导致本地特权提升或系统状态混乱。攻击者需要具备本地执行权限，可通过构造特定的进程执行序列触发该缺陷，进而利用竞争条件绕过安全限制。SUSE 已在 SUSE-SU-2025:01614-1、SUSE-SU-2025:01964-1 及 SUSE-SU-2025:01967-1 安全公告中发布内核更新修复此问题。"
published = "2025-04-16T15:15:55Z"
remediation = "升级 Linux 内核至包含修复提交 753a620a7f8e 的稳定版本。SUSE Linux Enterprise 15 SP6 用户执行 zypper update kernel-default 安装内核 6.4.0-150600.23.50.1 或更高版本并重启系统；SP6 RT 内核用户安装 kernel-rt 对应更新包（SUSE-SU-2025:01964-1）；SP7 Azure 内核用户安装对应更新（SUSE-SU-2025:01967-1）。其他发行版请升级至 Linux 6.6+ 或各发行版回移该补丁的内核版本。"
score = 5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 FS_Struct in_exec 竞争条件漏洞"
updated = "2025-05-01T15:16:19Z"

