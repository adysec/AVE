[basic]
description = "rxvt 终端模拟器 2.7.8 及更早版本存在转义序列注入漏洞。攻击者可通过构造包含恶意转义序列的文件，当用户使用 rxvt 查看该文件时，终端窗口标题会被修改并回注入命令行，从而在用户终端中执行任意命令。该漏洞允许远程攻击者在无需认证的情况下利用用户交互触发，实现机密性、完整性和可用性部分受损，CVSS 评分 7.5，危害等级高。"
published = "2003-03-03T05:00:00Z"
remediation = "升级 rxvt 至 2.7.9 或更高版本。Red Hat Linux 用户可安装 RHSA-2003:054/RHSA-2003:055 提供的更新包；Mandrake Linux 用户安装 MDKSA-2003:003 更新。如无法升级，可在终端模拟器配置中禁用转义序列处理功能，或使用不受影响的终端模拟器（如 xterm）替代 rxvt。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "rxvt 终端模拟器窗口标题转义序列命令注入漏洞"
updated = "2026-06-16T22:01:27Z"

