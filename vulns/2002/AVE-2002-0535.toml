[basic]
description = 'Abyss Web Server 1.0.3 存在目录遍历漏洞，远程攻击者无需身份认证即可通过向服务器发送包含 `..\`（点-点-反斜杠）序列的 HTTP GET 请求，绕过路径限制读取服务器上的任意文件。该漏洞源于服务器对 URL 中编码的反斜杠字符处理不当，未能正确过滤目录跳转序列，导致攻击者可遍历至 Web 根目录之外，读取系统敏感文件如配置文件、密码文件等，造成信息泄露。CVSS 评分 5.0，危害等级中等。'
published = "2002-10-04T04:00:00Z"
remediation = '''
[id]
ave_id = "AVE-2002-00001"
aliases = ["CVE-2002-1079"]

[basic]
title = "Abyss Web Server 1.0.3 编码反斜杠目录遍历漏洞"
description = "Abyss Web Server 1.0.3 存在目录遍历漏洞。远程攻击者可通过向 HTTP GET 请求发送包含 URL 编码反斜杠（%5c）的 ..\\（点点反斜杠）序列，绕过 Web 根目录的路径限制，读取服务器上的任意文件。该漏洞源于服务器未能正确过滤反斜杠字符作为目录分隔符，攻击者无需身份验证即可通过网络远程利用，可能导致敏感信息泄露。"
severity = "MEDIUM"
score = 5.0
sources = ["cve", "exploitdb"]
published = "2002-10-04"
updated = "2026-06-16"
remediation = "升级到 Abyss Web Server 1.0.3.3 或更高版本。厂商 Aprelium 已发布补丁 patch1033，修复了服务器对编码反斜杠字符的路径处理逻辑，建议立即更新。"

[references]
urls = ["http://archives.neohapsis.com/archives/bugtraq/2002-08/0229.html", "http://www.aprelium.com/news/patch1033.html", "http://www.iss.net/security_center/static/9940.php", "http://www.iss.net/security_center/static/9941.php", "http://www.osvdb.org/3285", "http://www.securityfocus.com/bid/5547", "https://www.exploit-db.com/exploits/21735"]

