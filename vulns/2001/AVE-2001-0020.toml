[basic]
description = "APC UPS 监控守护进程 apcupsd 3.7.2 版本存在本地拒绝服务漏洞。该守护进程将其进程 ID 写入一个全局可写的 pid 文件（apcupsd.pid）中，本地攻击者可通过修改该文件内容，将目标进程 ID 写入其中，当 apcupsd 重启或读取该文件时，将导致任意进程被终止。攻击条件要求攻击者拥有本地系统访问权限，无需高权限即可实施攻击，影响系统可用性。"
published = "2001-02-16T05:00:00Z"
remediation = "升级 APC UPS 软件至 3.7.2 以上版本，或修改 apcupsd.pid 文件权限为仅 root 可写（chmod 644 /var/run/apcupsd.pid），并确保 apcupsd 以非 root 用户运行。如无法升级，可限制本地用户登录或使用文件系统 ACL 保护 pid 文件。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "APC UPS apcupsd 本地拒绝服务漏洞"
updated = "2026-06-16T21:53:32Z"

