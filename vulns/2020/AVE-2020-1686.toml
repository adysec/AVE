[basic]
description = "Unraid 6.8.0 存在认证绕过与任意代码执行漏洞，未经身份认证的远程攻击者可通过 Web 管理界面的路径遍历特性绕过登录认证，直接获取管理员权限。该漏洞结合不安全的 PHP extract() 函数使用方式，攻击者可通过向目标发送特制 HTTP GET 请求，构造恶意参数注入 PHP 代码并在服务器上以 root 权限执行，最终完全控制目标系统。该漏洞影响 Unraid 6.8.0 版本，CVSS 评分为 7.5，危害等级为高，且已被 CISA 列入已知被利用漏洞目录。"
published = "2020-03-16T18:15:12Z"
remediation = "建议立即升级到 Unraid 6.8.1 或更高版本以修复认证绕过漏洞。如无法立即升级，可在防火墙层面限制管理界面（端口 80/443）的访问来源IP，仅允许可信网络访问，作为临时缓解措施。升级前请先备份重要数据。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Lime Technology Unraid 认证绕过漏洞"
updated = "2026-06-17T03:22:19Z"

