[basic]
description = 'Trend Micro Virus Buster 2001 8.00 存在缓冲区溢出漏洞。远程攻击者可通过向目标系统发送包含超长"收件人"（To）地址的邮件数据包触发该漏洞，导致邮件扫描服务崩溃拒绝服务，并在特定条件下可能执行任意系统命令。该漏洞影响运行 Trend Micro Virus Buster 2001 8.00 的 Windows 系统，攻击者无需身份认证即可在复杂攻击条件下利用，成功利用将完全危及目标系统的机密性、完整性和可用性。'
published = "2001-05-03T04:00:00Z"
remediation = "立即将 Trend Micro Virus Buster 2001 升级至 8.01 版本。注册用户可通过软件内置的 intelligent update 智能更新功能自动下载补丁，需提供有效许可密钥；如使用杂志或 CD-ROM 附带的试用版，请先购买正式许可证并完成用户注册后再执行更新。临时缓解措施：配置邮件客户端或邮件服务器拒绝收包含超长 To 头字段（超过 16,000 字符）的邮件，并在防火墙层面过滤异常长度的邮件头。"
score = 7.6
severity = "HIGH"
sources = ["cve"]
title = "趋势科技 Virus Buster 2001 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:48Z"

