[basic]
description = "tags.<value>teTeX 过滤器在 1.0.7 版本之前存在临时文件竞争条件漏洞。当使用 lpr 打印 .dvi 文件时，过滤器会创建临时文件且未进行安全检查。本地攻击者可通过符号链接攻击（symlink attack）利用该漏洞，在临时文件创建后将其指向敏感目标文件，从而覆盖这些文件并获取提升的权限。该漏洞影响 teTeX 1.0.7 之前的所有版本，CVSS 评分为 6.2，属于中等危害等级。"
published = "2001-06-22T04:00:00Z"
remediation = "升级 teTeX 至 1.0.7 或更高版本，该版本修复了临时文件符号链接竞争条件漏洞。对于 Red Hat 7.0/7.1 系统，同时升级 LPRng 至 3.7.4-23 或更高版本。临时缓解措施：将 /var/lib/texmf/ 目录权限设置为 750 并确保属主为 root，禁止普通用户写入；限制 lpr 打印服务仅接受本地打印请求，关闭不必要的远程打印功能。永久修复需安装对应发行版的安全更新，Red Hat 用户可参考 RHSA-2001-102 公告，Mandrake 用户可参考 MDKSA-2001-086 公告。"
score = 6.2
severity = "MEDIUM"
sources = ["exploitdb"]
title = "teTeX 过滤器 临时文件竞争条件漏洞"
updated = "2026-06-16T21:55:12Z"

