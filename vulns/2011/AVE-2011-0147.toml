[basic]
description = "Google Chrome 浏览器文档加载器存在 use-after-free 漏洞，影响版本低于 14.0.835.163。攻击者远程可通过精心 crafted 的文档触发漏洞，该漏洞源于对已释放内存的非法访问。利用此漏洞可能导致浏览器崩溃、拒绝服务，或可能允许执行任意代码。攻击者无需身份验证即可远程发起攻击。CVSS 评分 6.8，风险等级中高。该漏洞影响 Windows、Linux 等平台的用户，用户在访问恶意网页时可能受到攻击，攻击者可利用浏览器内核漏洞进一步控制受害者系统。"
published = "2011-09-19T12:02:55Z"
remediation = "建议立即将 Google Chrome 升级至 14.0.835.163 或更高版本（当前建议直接升级至最新版 Chrome）。如无法立即升级，可临时禁用浏览器插件并限制访问不可信网站，建议通过 Chrome 设置 → 关于 Chrome 自动检查更新并重启浏览器完成修复。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 文档加载器使用后释放漏洞"
updated = "2026-06-16T23:32:06Z"

