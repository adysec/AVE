[basic]
description = "GoFiber Fiber 框架的 helmet 中间件存在安全配置错误漏洞，由于 middleware/helmet/helmet.go 第67行错误地使用 c.Protocol() 替代 c.Scheme() 来判断 HTTPS 连接，导致 Strict-Transport-Security (HSTS) 响应头永远不会被设置。该漏洞影响所有使用 helmet 中间件并配置了 HSTSMaxAge > 0 的 GoFiber 应用，攻击者可通过中间人攻击将 HTTPS 连接降级为 HTTP，从而窃取敏感信息或会话 Cookie。"
published = "2026-07-08T20:16:52Z"
remediation = '立即将 gofiber/fiber 升级到 v3.4.0 或更高版本，该版本已修复 helmet 中间件中 c.Protocol() 与 c.Scheme() 混淆的问题。若无法立即升级，可临时在反向代理层（如 Nginx/Traefik）强制添加 Strict-Transport-Security 响应头作为缓解措施。修复方法：将 middleware/helmet/helmet.go 第 67 行的 c.Protocol() == "https" 替换为 c.Scheme() == "https"，确保 HSTS 头在 TLS 连接下正确设置。'
score = 4.8
severity = "MEDIUM"
sources = ["ghsa"]
title = "GoFiber Fiber 中间件 HSTS 标头未设置漏洞"
updated = "2026-07-15T20:49:42Z"

