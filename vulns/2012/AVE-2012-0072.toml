[basic]
description = "Apple WebKit 存在跨站脚本（XSS）漏洞，影响 iOS 5.1 之前版本及 Safari 5.1.4 之前版本。远程攻击者可通过未明确的攻击向量注入任意 Web 脚本或 HTML 代码，导致在用户浏览器上下文中执行恶意脚本。该漏洞源于 WebKit 对用户输入过滤不充分，攻击者可构造恶意页面诱导受害者访问，窃取会话 Cookie、劫持用户会话或进行钓鱼攻击。CVSS 评分 4.3（AV:N/AC:M/Au:N/C:N/I:P/A:N），属中危级别。Apple 已在 iOS 5.1 及 Safari 5.1.4 中修复此漏洞，建议用户升级至最新版本。"
published = "2012-03-08T22:55:02Z"
remediation = "建议立即升级 Apple iOS 至 5.1 或更高版本，并将 Safari 升级至 5.1.4 或更高版本。若暂时无法升级，可在浏览器设置中禁用 JavaScript 作为临时缓解措施，或避免访问不可信网站以降低 XSS 攻击风险。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari 跨站脚本（XSS）漏洞"
updated = "2026-06-16T23:37:52Z"

