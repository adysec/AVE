[info]
author = "ave"
description = "验证目标服务器是否存在可触发 Netscape SmartDownload 1.3 缓冲区溢出的超长 URL。当安装了 SmartDownload 1.3 的客户端访问包含超过 271 字符超长 URL 的网页时，sdph20.dll 的 URL 解析函数会发生缓冲区溢出，导致任意代码执行。"
id = "POC-AVE-2001-0102"
name = "Netscape SmartDownload 1.3 缓冲区溢出漏洞 PoC"
severity = "high"
tags = ["ave-2001-0102"]
vuln_id = [
    "CVE-2001-0262",
    "AVE-2001-0102",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/trigger"
protocol = "http"

[poc.requests.headers]
User-Agent = "Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.0)"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["SmartDownload"]
