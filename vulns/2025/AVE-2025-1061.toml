[basic]
description = "Linux 内核 HID appleir 驱动存在空指针解引用漏洞。当使用特制畸形 USB HID 设备发送异常报告数据时，由于报告项中无有效字段导致输入设备配置失败、hidinput_connect() 返回错误，事件回调函数被触发时 input_dev 指针为空，从而在 input_event() 中触发空指针解引用。该漏洞需要本地低权限用户通过物理接触或模拟 USB HID 设备发送畸形数据方可触发，成功利用可导致系统崩溃或拒绝服务。受影响版本包括 Linux 6.13.0-rc4 等内核版本，CVSS 评分为 5.5（中危）。Linux 验证中心通过 Syzkaller 模糊测试发现该问题，修复方案是在事件回调函数中增加 HID_CLAIMED_INPUT 标志检查，在未成功申请输入设备时提前返回避免空指针解引用。"
published = "2025-04-01T16:15:25Z"
remediation = "升级 Linux 内核至 6.13-rc5 或更高稳定版本（该修复已于 2025 年 4 月合并到主线），或手动应用 commit gf097a36ef88d 之后的补丁：在 drivers/hid/hid-appleir.c 的 appleir_raw_event() 函数入口处检查 HID_CLAIMED_INPUT 标志是否设置，若未设置则提前返回，避免对空指针 input_dev 的访问。如无法立即升级内核，可通过 modprobe.blacklist=hid_appleir 禁用该模块作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 HID appleir 驱动空指针解引用漏洞"
updated = "2026-06-17T08:44:41Z"

