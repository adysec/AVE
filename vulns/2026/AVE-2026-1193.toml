[basic]
description = "tags.<value>aws-mcp-server 存在命令注入漏洞，攻击者可通过向 MCP 服务器提交恶意构造的命令字符串，在无需身份认证的情况下触发系统命令执行。该漏洞源于 aws-mcp-server 对 allowed commands 列表中用户输入字符串缺乏充分验证，导致攻击者能够注入并执行任意系统命令。受影响的版本为 aws-mcp-server 所有存在命令列表验证缺陷的版本，CVSS 评分 9.8，危害等级严重。"
published = "2026-04-11T01:16:18.293"
remediation = "立即将aws-mcp-server升级至1.0.0版本，该版本已修复命令列表验证缺陷。升级后需验证allowed commands列表配置是否仅包含必要命令，并限制MCP服务器的网络访问权限，仅允许可信来源IP连接。如暂无法升级，应在反向代理或防火墙层面限制对aws-mcp-server端点的访问，并监控异常命令执行日志。"
score = 9.8
severity = "CRITICAL"
sources = ["zdi"]
title = "aws-mcp-server 远程命令注入漏洞"
updated = "2026-06-17T10:58:22.543"

