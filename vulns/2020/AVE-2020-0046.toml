[basic]
description = "WordPress Chop Slider 3 插件（版本≤3.4）的 get_script/index.php 文件存在盲注 SQL 注入漏洞。该文件在处理 id GET 参数时，直接将用户输入拼接到 SQL 查询语句中查询 chopslider_id，未进行任何参数过滤或转义处理。未经身份认证的远程攻击者可通过构造恶意的 id 参数值，在 WordPress 数据库用户权限下执行任意 SQL 查询，从而获取数据库敏感信息（如管理员凭证、用户数据等），甚至进一步接管整个网站。该漏洞影响所有使用受影响版本 Chop Slider 3 插件的 WordPress 站点，攻击者可利用基于布尔的盲注或基于时间的盲注技术进行探测和利用，利用 sqlmap 等工具可自动化完成注入过程。CVSSv3 评分为 9.8，危害等级严重。"
published = "2020-05-08T20:15:12Z"
remediation = "立即卸载并删除 WordPress ChopSlider 3 插件（≤3.4 版本），将其目录 `wp-content/plugins/chopslider/` 从服务器上彻底移除，避免被利用。若必须使用轮播图功能，应替换为其他维护活跃的 WordPress 轮播插件（如 Smart Slider 3、MetaSlider 等），并确保新插件为最新版本。如短期内无法替换，可临时通过在 WordPress 根目录 `.htaccess` 文件中添加规则拦截对 `wp-content/plugins/chopslider/get_script/index.php` 的外部访问，具体操作为：添加 `RewriteRule ^wp-content/plugins/chopslider/get_script/ - [F,L]` 以返回 403 禁止访问，作为过渡缓解措施，同时尽快完成插件替换。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress ChopSlider 3 SQL注入漏洞"
updated = "2026-06-17T02:50:21Z"

