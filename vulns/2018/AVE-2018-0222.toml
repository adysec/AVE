[basic]
description = "腾达（Tenda）AC7、AC9、AC10系列路由器存在命令注入漏洞。攻击者无需身份认证，通过向目标设备的/goform/setUsbUnload接口发送特制HTTP请求，利用formsetUsbUnload函数对用户输入未做有效过滤直接传递给dosystemCmd函数执行，可注入任意操作系统命令。攻击者可在路由器上执行任意命令，实现完全控制设备、窃取网络流量、发起进一步内网攻击等。该漏洞影响AC7固件版本≤V15.03.06.44_CN、AC9固件版本≤V15.03.05.19(6318)_CN、AC10固件版本≤V15.03.06.23_CN，CVSS评分9.8，危害等级严重。"
published = "2018-10-30T18:29:00Z"
remediation = "升级 Tenda AC7 固件至 V15.03.06.44_CN 以上版本，AC9 固件至 V15.03.05.19(6318)_CN 以上版本，AC10 固件至 V15.03.06.23_CN 以上版本。同时建议禁用路由器的远程管理功能，限制对 Web 管理界面的访问来源，并在网络边界部署入侵检测规则拦截对 /goform/setUsbUnload 的可疑请求。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Tenda AC7/AC9/AC10 命令注入漏洞"
updated = "2026-06-17T01:41:11Z"

