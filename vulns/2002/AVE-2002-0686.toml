[basic]
description = "Sun Cobalt Raq 2/4 服务器的 service.cgi 和 alert.cgi 脚本存在跨站脚本（XSS）漏洞。未经身份认证的远程攻击者可通过构造包含恶意 JavaScript 代码的 URL 地址，当其他用户访问该链接时，脚本将在受害者浏览器中执行。该漏洞影响 Cobalt RAQ 4 及更早版本的管理界面，攻击者利用此漏洞可窃取用户会话令牌、篡改页面内容或进行钓鱼攻击。CVSS 评分为 7.5，危害等级为中高。攻击条件较为简单，无需特殊权限，攻击者仅需诱骗已登录管理员点击恶意链接即可实施攻击。"
published = "2002-06-25T04:00:00Z"
remediation = "建议立即删除或禁用 Cobalt RaQ 4 上的 service.cgi 和 alert.cgi 文件（位于 /usr/admserv/html/.cobalt/alert/ 目录），这是厂商唯一给出的临时缓解方案。由于 Sun Cobalt RaQ 产品线已停止维护（Sun 已被 Oracle 收购，Cobalt 设备 EOL），无官方补丁发布，根本解决方案是迁移至现代受支持的服务器平台。若暂时无法迁移，可在 Web 应用防火墙（WAF）配置拦截包含 <script>、javascript:、onerror 等 XSS 特征的请求参数，并限制管理接口（端口 81）仅允许受信任 IP 访问。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Sun Cobalt Raq 2/4 跨站脚本攻击漏洞"
updated = "2026-06-16T21:57:15Z"

