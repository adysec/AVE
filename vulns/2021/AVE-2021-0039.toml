[basic]
description = "Arm Trusted Firmware M（TF-M）在 1.2 及更早版本中存在跨界内存写（CWE-787）漏洞。在 NSPE 处理器模式下，非安全世界（NS world）在调用安全区函数时，由于安全处理程序（Secure Partition Manager，SPM）对输入参数的边界校验不充分，可能触发操作系统停止运行、覆盖安全世界中已受保护的敏感数据，甚至导致安全数据被打印泄漏。该漏洞影响 TF-M 1.2 及之前版本，攻击条件为本地低权限用户调用受影响的 secure functions，危害等级为中等（CVSS 3.1 评分 5.5，攻击向量为本地，影响可用性）。建议升级到 TF-M 1.2 之后的修复版本。"
published = "2021-05-25T19:15:07Z"
remediation = "建议升级 Arm Trusted Firmware-M 至 v1.3.0 或更高版本（2021年4月9日发布），该版本包含修复提交 e212ea1637a66255b44d0e7c19ebe9786ab56ccb，在 tfm_core_svcalls_ipc.c 中新增检查防止 IPC SVC 从 Handler Mode 调用。若无法立即升级，可在非安全世界（NSPE）避免在中断处理程序中调用安全函数，或改用 Library Model 而非 IPC Model，因 Library Model 在安全入口处检查 PE 模式不受此漏洞影响。"
score = 5.5
severity = "MEDIUM"
sources = ["kev"]
title = "Arm Trusted Firmware M 跨界内存写漏洞"
updated = "2026-06-17T03:45:08Z"

