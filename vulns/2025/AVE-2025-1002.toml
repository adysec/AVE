[basic]
description = "CVE-2025-21831是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2025-03-06T17:15:23Z"
remediation = "升级 Linux 内核至包含修复的版本：Ubuntu 24.04 LTS 用户请更新至 linux-image-6.8.0-58-generic (6.8.0-58.60) 或更高版本；Ubuntu 22.04 LTS HWE 用户请更新至 linux-image-6.8.0-58-lowlatency (6.8.0-58.60.1~22.04.1)；Debian 用户请更新至 6.12.94-1 (trixie) 或 6.12.15-1+ (sid/testing)。如无法立即更新内核，可在 GRUB 内核参数中添加 pcie_port_pm=off 作为临时缓解措施，此参数将禁止 PCIe 端口在系统挂起时进入 D3 低功耗状态。更新内核后重启系统，如使用 TUXEDO Sirius 16 Gen 1 且问题仍存在，请登录 TUXEDO 客户账户检查 BIOS 更新或联系官方支持获取固件更新。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 PCIe 根端口电源管理不当系统挂起漏洞"
updated = "2026-06-17T08:44:23Z"

