[basic]
description = "Koules 1.4 游戏在处理命令行参数时存在缓冲区溢出漏洞。该游戏由 Jan Hubicka 开发并使用 svgalib 图形库，当用户运行游戏时传入过长的命令行参数，可导致缓冲区边界被覆盖，进而执行任意系统命令。此漏洞为本地漏洞，攻击者需要具备目标系统的本地访问权限才能发起利用，成功利用后攻击者可获得与运行 Koules 用户相同权限的 shell，进而完全控制受影响主机。该漏洞影响安装了 Koules 1.4 的 Linux 系统，CVSS 评分为 7.2，危害等级较高。"
published = "2001-01-09T05:00:00Z"
remediation = "建议立即升级 Koules 至 Debian 1.4-28 或更高版本（已包含缓冲区溢出修复补丁 101_buffer_overflow.diff），该补丁将 koules.sndsrv.linux.c 中不安全的 strcat 替换为 snprintf 并添加边界检查。若无法升级，请执行以下缓解措施：1) 移除 koules.sndsrv.linux 二进制文件的 setuid root 权限（chmod u-s /usr/local/lib/koules/koules.sndsrv.linux）；2) 卸载 Koules 游戏或仅使用 X11 版本（不受影响）；3) 限制普通用户对该二进制文件的执行权限（chmod o-x）。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Jan Hubicka Koules 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:53:19Z"

