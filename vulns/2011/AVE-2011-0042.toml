[basic]
description = "Adobe Reader 和 Acrobat 存在内存破坏漏洞，攻击者可通过诱导用户打开特制的 PDF 文件触发内存损坏，导致远程代码执行或拒绝服务。该漏洞影响 Windows 及 Mac OS X 平台上的 Adobe Reader/Acrobat 8.x 至 10.x 版本，CVSS 评分 9.3，危害严重。用户交互是唯一攻击条件，无需额外权限即可实现完全控制。"
published = "2011-02-10T18:00:58Z"
remediation = "建议立即升级 Adobe Reader/Acrobat 至以下安全版本：10.x 用户升级至 10.0.1 及以上、9.x 用户升级至 9.4.2 及以上、8.x 用户升级至 8.2.6 及以上。Windows 用户可通过 Adobe 官网或自动更新功能获取补丁。如无法立即升级，可在浏览器中禁用 Adobe Reader 插件或使用其他 PDF 阅读器作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Reader/Acrobat 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:27:41Z"

