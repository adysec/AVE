[basic]
description = "Microsoft Internet Explorer 4.x 和 5.x 所嵌入的 Microsoft Virtual Machine（VM）存在安全绕过漏洞。该漏洞允许未签名的 Java 小程序通过 com.ms.activeX.ActiveXComponent 组件创建并使用 ActiveX 控件，从而绕过 Internet Explorer 的安全沙箱设置。远程攻击者可构造恶意网页或电子邮件，在用户浏览或打开时触发该漏洞，进而在目标系统上执行任意命令。影响版本包括 Microsoft Virtual Machine 2000/3100/3200/3300 Series 等，攻击条件为攻击者诱导用户访问恶意页面或打开恶意邮件内容，利用方式为通过网页中的恶意 Java Applet 直接调用系统 ActiveX 控件执行任意代码。"
published = "2000-12-11T05:00:00.000"
remediation = "建议立即安装 Microsoft 安全公告 MS00-075 中发布的补丁程序（对应知识库文章 Q275609），将 Microsoft Virtual Machine 升级至 build 3317 以上的安全版本，以修复 unsigned Java applet 可绕过安全限制执行任意 ActiveX 控件的漏洞。如无法立即获取补丁，应在 Internet Explorer 中禁用 Java applet 脚本执行，或受信任站点添加到受限站点区域作为临时缓解措施。注意 Microsoft Java Virtual Machine 已停止支持，建议升级至受支持的 Java 运行时环境（如 Oracle OpenJDK 或 Microsoft OpenJDK）以消除长期安全风险。"
score = 5.1
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Internet Explorer Virtual Machine ActiveX 组件任意代码执行漏洞"
updated = "2026-06-16T21:53:04.500"

