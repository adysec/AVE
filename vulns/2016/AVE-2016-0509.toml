[basic]
description = "Apple iOS 内核存在内存破坏漏洞（CVE-2016-4656），属于 Trident 漏洞利用链的核心组成部分，与 CVE-2016-4655 和 CVE-2016-4657 配合被 Pegasus 间谍软件用于越狱攻击。攻击者可通过诱导用户打开特制恶意应用程序，触发内核中的越界写入（CWE-787）导致内存破坏，从而在内核上下文中执行任意代码，完全控制目标设备。该漏洞影响 iOS 9.3.5 之前的所有版本，攻击无需越狱即可实现，危害极高。Apple 已在 iOS 9.3.5 安全更新中修复此漏洞。"
published = "2016-08-25T21:59:01Z"
remediation = "立即将 Apple iOS 升级至 9.3.5 或更高版本，该版本已修复内核内存破坏漏洞。无法立即升级时，避免安装来源不明的应用，不点击可疑链接，并在 MDM 策略中限制第三方应用安装权限作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Apple iOS 内核内存破坏漏洞"
updated = "2026-06-17T00:47:58Z"

