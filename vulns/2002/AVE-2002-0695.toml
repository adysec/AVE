[basic]
description = "CGIscript.net csMailto.cgi 程序存在输入验证不足漏洞，未经身份认证的远程攻击者可通过修改隐藏表单字段参数，将邮件发送至任意用户。该漏洞源于 csMailto 未对 form-to、form-from 和 form-results 等参数进行有效过滤，攻击者可利用这些参数将 csMailto 作为垃圾邮件代理，向任意接收者批量发送邮件。该漏洞影响部署了 CGIscript.net csMailto 脚本的网站，攻击条件仅需目标 Web 表单网络可达，无需身份认证且利用复杂度低。成功利用将导致信息泄露、垃圾邮件泛滥及服务器资源滥用，CVSS v2 评分 7.5，危害等级高。"
published = "2002-08-12T04:00:00Z"
remediation = "建议立即从 Web 服务器中删除 csMailto.cgi 脚本，或将其移出 Web 可访问目录。若需保留邮件发送功能，应改用经过安全验证的替代方案（如 PHP mail() 函数配合严格输入过滤，或主流 Web 应用程序内置的联系表单模块）。如暂时无法替换，可临时通过 Web 服务器配置文件（如 Apache 的 .htaccess 或 Nginx 配置）限制 csMailto.cgi 的访问权限，仅允许内网 IP 访问，并在防火墙层面禁止对外暴露该 CGI 脚本路径。长期解决方案为彻底停用 CGIScript.NET 的 csMailto 程序并迁移至受支持的邮件表单解决方案。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "CGIScript.NET csMailto 远程命令执行漏洞"
updated = "2026-06-16T21:58:03Z"

