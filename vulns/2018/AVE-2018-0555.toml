[basic]
description = "Paessler PRTG Network Monitor 18.2.40.1683 之前版本存在严重安全漏洞，攻击者可通过构造恶意 HTTP 请求，覆盖 /public/login.htm 中 include 指令的属性，引入 /api/addusers 接口并执行本地文件包含攻击。未经身份认证的远程攻击者仅需提供 id 和 users 参数，即可创建拥有读写权限（含管理员权限）的用户账户，实现远程代码执行与权限提升。该漏洞影响 PRTG Network Monitor 18.2.40.1683 之前所有版本，CVSS 3.1 评分 9.8（CRITICAL），攻击向量为网络、攻击复杂度低、无需权限、无需用户交互、对机密性/完整性/可用性均造成高影响。Paessler 已在 18.2.40.1683 版本中修复该漏洞，建议用户尽快升级至最新版本并限制管理接口网络访问。"
published = "2018-11-21T16:29:00.347"
remediation = "建议立即升级 PRTG Network Monitor 至 18.2.40.1683 或更高版本（官网下载最新版本）。若暂时无法升级，请在防火墙层面限制 PRTG Web 界面（默认 80/443/8080 端口）仅允许受信任管理 IP 访问，并在 Web 服务器层面禁用 /public/login.htm 中的 LFI 相关 include 指令。同时排查是否存在未授权创建的管理员账号并立即删除，启用双因子认证作为额外防护。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Paessler PRTG Network Monitor 远程未授权用户创建漏洞"
updated = "2026-06-17T01:49:15.640"

