[basic]
description = "Oracle Reports Server 6.0.8 和 9.0.2 版本中的 rwcgi60 CGI 程序存在信息泄漏漏洞。该程序默认配置下会泄露服务器完整路径名等敏感信息，远程攻击者无需身份认证即可通过发送特制 HTTP 请求获取这些信息，进而利用泄露的路径信息辅助实施进一步的攻击。该漏洞 CVSS 评分 5.0，危害等级中危。"
published = "2002-10-04T04:00:00.000"
remediation = "Oracle Reports Server 6.0.8/9.0.2 已停止维护，建议升级到 Oracle Reports 12c (12.2.1.4) 或更高版本。如无法升级，在 Web 服务器层面限制对 rwcgi60 CGI 程序的访问，仅允许受信 IP 调用，并配置 Web 服务器隐藏路径信息（如 Apache 的 ServerTokens Prod 和 ServerSignature Off）。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Oracle Reports Server 信息泄露漏洞"
updated = "2026-06-16T21:58:42.313"

