[basic]
description = "Watchguard Firebox II 防火墙存在严重的权限提升漏洞。该漏洞源于防火墙对密码哈希文件的访问控制不当，未经身份认证的远程攻击者可通过访问包含密码哈希的文件获取哈希值，并在认证过程中复用这些哈希值完成身份验证，从而获得读写权限及完全管理员权限。该漏洞影响部署 Watchguard Firebox II 防火墙的所有设备，攻击复杂度低，无需预先获取任何凭据即可完成利用。利用方式为通过网络访问目标防火墙的 Web 管理界面或其他可访问路径，读取哈希文件后利用哈希重放技术完成管理员认证，最终完全控制防火墙并篡改安全策略或进一步渗透内部网络。"
published = "2001-03-26T05:00:00Z"
remediation = "立即升级 WatchGuard Firebox II 固件至 4.5.1 或更高版本，该版本修复了只读账户可读取哈希密码文件并提升权限的问题。升级前请备份当前配置。如暂时无法升级，请在防火墙管理界面中禁用不必要的只读账户，并修改 /etc/passwd 或等效密码文件权限为仅 root 可读（chmod 600），同时限制对包含哈希密码的配置文件的 Web 管理访问，仅允许可信管理网段访问管理界面。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "WatchGuard Firebox II 权限提升漏洞"
updated = "2026-06-16T21:53:52Z"

