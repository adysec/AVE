[basic]
description = "MIT Kerberos（krb5）发行版在实现 Kerberos 协议版本 4（krb4）时存在安全弱点，当使用 triple-DES 密钥为 krb4 服务进行密钥配置时，攻击者可通过剪切粘贴攻击（cut-and-paste attack）和票据拼接（ticket splicing）技术伪造 krb4 票据，从而以未授权主体的身份通过服务认证。该漏洞影响启用 krb4 兼容模式的 MIT Kerberos 5 发行版，攻击者无需身份认证即可在远程发起攻击，成功利用后可实现对系统的未授权访问。由于 krb4 票据认证机制被绕过，攻击者能够冒充合法用户获取敏感服务权限，存在严重的安全风险。"
published = "2003-03-24T05:00:00.000"
remediation = '若使用 MIT krb5 发行版，应立即应用 2003-004 补丁包（http://web.mit.edu/kerberos/www/advisories/2003-004-krb4_patchkit.tar.gz）或升级到 krb5-1.3 及更高版本。如无需 krb4 功能，需通过 KDC 的 "-4 none" 或 "-4 disable" 参数彻底禁用 krb4，同时停止运行 krb524d 守护进程，并删除 krb4 跨域密钥。临时缓解措施包括：在所有跨域主体上设置 DISALLOW_ALL_TIX 或 DISALLOW_SVR 属性以禁用跨域认证，或停止使用 triple-DES 密钥并将 krb4 服务密钥降级为 single-DES。长期方案应将应用从 Kerberos v4 迁移至 Kerberos v5。'
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "MIT Kerberos 5 krb4 协议实现票据拼接伪造漏洞"
updated = "2026-06-16T22:01:37.633"

