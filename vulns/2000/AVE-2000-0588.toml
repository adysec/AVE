[basic]
description = "CVE-2000-0778 为微软 IIS 5.0 服务器中的一个源代码泄露漏洞。攻击者通过向目标服务器发送包含“Translate: f”头的 HTTP 请求，可以强制 IIS 服务器以汇编模式解析和返回 .ASP 文件等脚本的源代码。这一漏洞允许未经授权的远程攻击者获取敏感的应用程序源代码，威胁系统的保密性。漏洞影响 Windows 平台运行的 IIS 5.0 服务，攻击难度低且无需身份验证，CVSS 评分为 5.0（CVSS:AV:N/AC:L/Au:N/C:P/I:N/A:N），表明其主要威胁在于信息泄露。该漏洞于 2000 年 10 月 20 日首次披露，后续微软通过安全更新修复了此问题。"
published = "2000-10-20T04:00:00Z"
remediation = '建议立即升级至 IIS 6.0（Windows Server 2003）或更高版本，或安装微软安全公告 MS00-078 提供的补丁程序。若暂时无法升级，可在 IIS 管理器中禁用 WebDAV 扩展，或在防火墙/负载均衡层面拦截包含 "Translate: f" 头的 HTTP 请求作为临时缓解措施。建议尽快升级至 Windows Server 2003 SP2 及以上版本彻底修复该漏洞。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft IIS 5.0 源代码泄露漏洞"
updated = "2026-06-16T21:52:27Z"

