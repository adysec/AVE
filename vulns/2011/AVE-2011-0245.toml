[basic]
description = "Google Chrome 16.0.912.63之前版本在64位平台上的CSS实现未能正确管理属性数组，远程攻击者可通过特制网页触发内存破坏，导致浏览器崩溃拒绝服务。攻击者无需认证即可远程利用，用户只需访问恶意构造的网站即可触发漏洞。该漏洞影响所有64位平台上的Chrome浏览器，危害等级中危。"
published = "2011-12-13T21:55:01Z"
remediation = "升级 Google Chrome 至 16.0.912.63 或更高版本，该版本修复了 CSS 实现中属性数组管理不当导致的内存破坏问题。如无法立即升级，可禁用 JavaScript 或使用其他浏览器作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome CSS实现内存破坏漏洞"
updated = "2026-06-16T23:34:08Z"

