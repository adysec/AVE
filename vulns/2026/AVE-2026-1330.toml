[basic]
description = "Docker Desktop 存在 credentialHelper 目录遍历权限提升漏洞，该漏洞源于 app/settings 端点在解析 credentialHelper 值时未正确验证用户提供的路径，导致本地攻击者可通过路径遍历在文件操作中实现任意文件写入。攻击者需先逃逸容器并在 Docker Hyper-V 虚拟机中获得高权限代码执行能力，随后利用该漏洞在宿主系统上下文中提升权限并执行任意代码。影响 Docker Desktop 产品，CVSS 7.5（本地攻击、高攻击复杂度、高权限要求、无需用户交互、范围改变、高机密性/完整性/可用性影响）。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
