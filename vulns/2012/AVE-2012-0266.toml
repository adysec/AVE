[basic]
description = "WebKit 是 Apple Safari 浏览器的核心网页渲染引擎，在 Safari 6.0 之前的版本及 iOS 6.0 之前的系统中存在内存破坏漏洞。未经身份验证的远程攻击者可构造恶意网页内容，当用户使用受影响版本的 Safari 浏览器访问该网页时，即可触发内存损坏，导致远程代码执行或应用程序崩溃及拒绝服务。该漏洞影响 Mac OS X 及 iOS 平台上的 Safari 浏览器用户，攻击者无需任何认证凭据即可在目标系统上执行任意代码或造成服务中断，CVSS 基础评分为 8.8。"
published = "2012-07-25T20:55:01Z"
remediation = "建议立即将 Apple Safari 升级至 6.0 或更高版本，或通过 Mac App Store 的「软件更新」功能安装最新安全更新。iOS 用户应将设备升级至 iOS 6.0 或更高版本。若暂时无法升级，可暂时禁用 WebKit 的 JavaScript 执行作为缓解措施，并避免访问未知或恶意网站。"
score = 8.8
severity = "HIGH"
sources = ["tenable"]
title = "Apple Safari WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:31Z"

