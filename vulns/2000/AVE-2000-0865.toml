[basic]
description = "Microsoft FrontPage 2000 Server Extensions 1.1 的 shtml.exe 组件存在拒绝服务漏洞。远程攻击者可通过请求包含标准 DOS 设备名称（如 COM1、LPT1、AUX、PRN、NUL 等）的 URL，触发服务器处理异常，导致相关组件停止响应或崩溃，造成拒绝服务。该漏洞影响运行 FrontPage 2000 Server Extensions 1.1 的 Web 服务器，攻击无需身份认证，仅需发送特制 HTTP 请求即可利用，CVSS 评分 5.0，属于可用性影响类漏洞。"
published = "2000-10-20T04:00:00.000"
remediation = "建议立即安装 Microsoft FrontPage 2000 Server Extensions Service Release 1.2 (SR1.2) 或更高版本，该补丁修复了 shtml.exe 对 DOS 设备名请求的处理缺陷。如无法立即升级，可在 IIS 或反向代理层面配置 URL 过滤规则，拦截包含 CON、NUL、AUX、COM1-COM9、LPT1-LPT9 等 DOS 保留设备名的请求路径，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft FrontPage 2000 Server Extensions shtml.exe 拒绝服务漏洞"
updated = "2026-06-16T21:52:19.003"

