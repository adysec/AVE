[basic]
description = 'Mandrake Linux 7.0 和 7.1 的 Xsession 文件默认配置使用 "xhost + localhost" 命令，该命令绕过了 Xauthority 访问控制机制的安全限制。攻击者利用此漏洞，可通过本地用户身份窃听 X Window 系统事件并获取提升的权限。该漏洞影响 Mandrake Linux 7.0 和 7.1 版本，CVSS 评分为 7.2，危害等级为高。任何能够登录到目标系统的本地用户均可利用此漏洞，在无需额外身份验证的情况下提升权限。'
published = "2000-12-11T05:00:00Z"
remediation = '建议立即升级到 Mandrake Linux 7.2 或更高版本，这些版本已修复 Xsession 配置文件中的 "xhost + localhost" 命令。如无法升级，手动编辑 /etc/X11/xinit/Xsession 文件，注释或删除包含 "xhost + localhost" 的行，并确保系统使用 xauth 和 ~/.Xauthority 文件进行 X11 访问控制。如暂时无法修改配置，可通过限制本地用户对 X11 显示器的访问权限或禁用不必要的 X11 服务作为临时缓解措施。'
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Mandrake Linux Xsession 访问控制绕过漏洞"
updated = "2026-06-16T21:53:04Z"

