[basic]
description = 'XFCE 3.5.1 桌面环境默认配置存在权限提升漏洞。其 xinitrc 启动脚本中包含"xhost + localhost"命令，该命令绕过了 X Window 系统原有的 Xauthority 访问控制安全机制，导致本地主机上的所有用户均可未经身份验证直接连接到 X 服务器。此漏洞影响 XFCE 3.5.1 版本，攻击条件为攻击者需具备目标系统的本地访问权限（如已拥有本地shell账号），攻击复杂度低且无需额外认证。成功利用后，本地攻击者可通过嗅探 X Windows 会话流量获取敏感信息，并借此提升自身权限。该漏洞的 CVSS 评分为 4.6，对系统机密性、完整性和可用性均造成部分影响。'
published = "2000-12-11T05:00:00Z"
remediation = "建议将 XFCE 升级至 3.5.2 或更高版本，该版本已移除 xinitrc 中不安全的 xhost + localhost 默认配置并恢复 Xauthority 访问控制。如无法立即升级，可手动编辑 ~/.xinitrc 及 /etc/xinitrc，删除或注释掉 xhost + localhost 相关行，改用 xauth 生成并管理 X11 认证 cookie，并在启动 X 服务器时通过 -auth 参数指定安全认证文件，以阻止本地用户嗅探 X Windows 流量获取未授权访问权限。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "XFCE xinitrc 本地权限提升漏洞"
updated = "2026-06-16T21:53:04Z"

