[basic]
description = "WordPress 404-to-301 插件 2.0.3 之前版本存在 SQL 注入漏洞，攻击者可通过向目标 WordPress 站点发送特制的 HTTP 请求，利用插件对 404 错误页面跳转记录功能中未正确过滤的输入参数，注入恶意 SQL 语句。该漏洞无需身份认证即可远程利用，攻击复杂度低，成功利用后可导致数据库信息泄露、数据篡改甚至完全控制目标站点。CVSS 评分 9.8，危害等级严重。建议升级至 2.0.3 或更高版本。"
published = "2019-08-16T21:15:10Z"
remediation = "立即将 WordPress 404-to-301 插件升级至 2.0.3 或更高版本，该版本已修复未授权 SQL 注入漏洞。如无法立即升级，可暂时禁用该插件，并在 Web 应用防火墙（WAF）层面添加规则拦截包含恶意 SQL 关键字的 404 请求路径作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress 404-to-301插件SQL注入漏洞"
updated = "2026-06-17T00:36:17Z"

