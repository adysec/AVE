[basic]
description = "PHP 4.3.1 及更早版本中的透明 SID（Session ID）支持功能存在跨站脚本攻击漏洞。当 PHP 配置中的 `session.use_trans_sid` 选项启用时，PHP 会自动将会话 ID 以 `PHPSESSID` 参数的形式附加到 URL 中进行传递。由于该参数未经过滤直接输出到页面中，未经身份认证的远程攻击者可以构造包含恶意脚本代码的特制 URL，诱使用户访问该链接后，在用户浏览器中执行任意 JavaScript 脚本。该漏洞影响所有启用透明 SID 功能的 PHP 4.x 应用，攻击者利用此漏洞可窃取用户会话令牌、执行钓鱼攻击或篡改页面内容。CVSS 评分为 4.3，危害等级为中危。PHP 官方已在 4.3.2 版本中修复此漏洞，建议用户升级至最新版本并禁用不必要的透明 SID 功能以降低风险。"
published = "2003-07-24T04:00:00Z"
remediation = "升级 PHP 至 4.3.2 或更高版本以修复该漏洞。如暂无法升级，可在 php.ini 中将 session.use_trans_sid 设置为 0 禁用透明 SID 支持，并启用 session.use_only_cookies = 1 强制仅通过 Cookie 传递会话 ID，防止攻击者通过 URL 中的 PHPSESSID 参数注入恶意脚本。"
score = 4.3
severity = "MEDIUM"
sources = ["redhat"]
title = "PHP Transparent Session ID 跨站脚本攻击"
updated = "2026-06-16T22:02:12Z"

