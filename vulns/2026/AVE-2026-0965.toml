[basic]
description = "tags asrequested.<value>linuxfabrik-lib 是一个提供数据库访问、缓存、Shell 执行和 API 集成等功能的 Python 模块库。其 lib.url.fetch() 函数在跟随 HTTP 重定向时，仅由 httpx 库自动剥离 Authorization 和 Cookie 头，但其他调用方提供的认证头（如 Redfish 的 X-Auth-Token、API 密钥等）会在跨源重定向时被转发到目标服务器。恶意或可被重定向的服务器可通过返回 3xx 响应，将认证请求重定向到攻击者控制的主机，从而窃取认证凭证，导致服务端请求伪造和令牌泄露。该漏洞影响所有使用非标准认证头进行身份验证的插件，CVSS 评分 6.0，危害等级中危。"
published = "2026-07-29T20:17:12Z"
remediation = "立即将 linuxfabrik-lib 升级至 6.0.0 或更高版本（commit 6573ff9），该版本在跨源重定向时自动丢弃所有调用方提供的凭据头。如无法升级，可在调用 fetch() 时设置 follow_redirects=False 禁用重定向跟随，或在应用层手动清除 X-Auth-Token 等非标准认证头后再发起请求。"
score = 6
severity = "MEDIUM"
sources = ["ghsa"]
title = "Linuxfabrik lib 跨源重定向凭证泄露漏洞"
updated = "2026-07-30T19:27:23Z"

