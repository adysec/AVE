[info]
author = "ave"
description = "通过构造包含大量无效URL的HTML页面，诱导Opera 11.50以下版本用户访问，浏览器会为每个无效URL生成错误页面并写入磁盘，导致磁盘空间被迅速耗尽"
id = "POC-AVE-2011-0064"
name = "Opera Opera浏览器拒绝服务漏洞 PoC"
severity = "medium"
tags = ["ave-2011-0064"]
vuln_id = [
    "CVE-2011-1337",
    "AVE-2011-0064",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["200"]
