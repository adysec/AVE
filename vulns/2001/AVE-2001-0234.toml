[basic]
description = "mgetty 1.1.22 在特定配置下存在符号链接攻击漏洞。本地攻击者可通过在目标系统上创建恶意的符号链接，诱使 mgetty 进程以当前用户权限覆写任意系统文件，导致文件完整性被破坏或权限提升。该漏洞攻击复杂度较高，需要本地访问权限且依赖特定配置环境，CVSS 评分仅 1.2，危害等级低。"
published = "2001-03-12T05:00:00.000"
remediation = "升级 mgetty 至 1.1.23 或更高版本。Debian 用户执行 `apt-get update && apt-get upgrade mgetty`；Red Hat 用户安装 RHSA-2001:050 提供的更新包；Caldera 用户安装 CSSA-2001-002.0 补丁。如无法升级，确保 mgetty 临时目录（如 /var/spool/mgetty）仅 root 可写，并避免在多用户环境下使用 mgetty 的自动传真接收功能。"
score = 1.2
severity = "LOW"
sources = ["cve"]
title = "mgetty 符号链接攻击导致任意文件写入漏洞"
updated = "2026-06-16T21:53:44.993"

