[basic]
description = "Linux 内核 tegra20-emc 驱动中存在一处设备树（OF）节点引用释放后使用（Use-After-Free）漏洞。函数 tegra_emc_find_node_by_ram_code() 调用 of_find_node_by_name() 时会释放传入的设备节点引用，但该节点在后续代码中仍被继续使用，导致 UAF 问题。本地低权限攻击者可利用此漏洞触发内核内存破坏，实现权限提升，导致系统崩溃或完全控制受影响系统。该漏洞影响使用 NVIDIA Tegra20 平台及 Linux 内核的嵌入式设备和系统，CVSS 评分 7.8，危害等级高。"
published = "2025-02-27T20:16:02Z"
remediation = "立即更新 Linux 内核至包含该补丁的版本。Ubuntu 22.04 LTS 用户升级至 linux-image-5.15.0-140-generic 及以上版本（USN-7510-1）；Ubuntu 22.04 HWE 用户升级至 linux-image-6.8.0-64-generic（USN-7653-1）；Debian 11 用户安装 DLA-4102 提供的更新内核。其他发行版请更新至主线内核 6.14-rc2 及以上版本，该补丁已合入上游。更新后须重启系统生效。如无法立即更新，可限制本地用户对 Tegra20 设备的访问作为临时缓解。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux Kernel Tegra20 EMC 释放后使用漏洞"
updated = "2026-06-17T08:14:29Z"

