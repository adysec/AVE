[basic]
description = "Phantom 是一款用于音频处理的开发工具。在版本 1.3.0 及之前版本中，存在两个安全漏洞：一是当 PHANTOM_OUTPUT_DIR 环境变量未设置时（默认情况），MCP 工具接受任意绝对输出路径且未做限制，攻击者可通过向 MCP 接口发送工具调用来写入或覆盖进程用户可写的任意文件，包括 shell 启动文件（如 ~/.zshrc）或 Reaper 的 __startup.lua 脚本，从而在开发者工作站上实现本地代码执行。二是音频分离和渲染路径在解码输入音频时未设置大小和时长限制，攻击者可构造一个体积小但高度压缩的 FLAC 或 OGG 音频文件，使其解码后膨胀至数吉字节的 PCM 数据，导致内存耗尽型拒绝服务攻击，并扩大解码器漏洞（如 libsndfile CVE-2026-37555）的攻击面。攻击者需要能够向 MCP 接口发送工具调用才能触发任意文件写入漏洞，或向开发者提供恶意音频文件触发解码炸弹拒绝服务。该漏洞影响 Phantom <= 1.3.0 版本，CVSS 评分为 5.0，危害等级为中危。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
