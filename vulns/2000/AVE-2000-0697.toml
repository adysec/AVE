[basic]
description = "Sun HotJava Browser 3.0 存在任意 DOM 访问漏洞。远程攻击者可通过在命名窗口中打开特制的 `javascript:` URL，绕过浏览器的同源策略限制，跨域访问任意网页的 DOM 结构，导致敏感信息泄露。攻击无需身份认证，利用方式简单，仅需诱使用户访问恶意链接即可触发。该漏洞影响 HotJava Browser 3.0 版本，CVSS 评分 5.0，危害等级中危。"
published = "2000-12-19T05:00:00.000"
remediation = "Sun HotJava Browser 3.0 已停止维护，Oracle 不再提供安全补丁。建议立即卸载 HotJava Browser，改用现代受支持浏览器（如 Firefox、Chrome、Edge）。同时配置浏览器禁用不可信来源的 JavaScript 自动执行，并启用站点隔离功能以防止 DOM 跨窗口访问。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Sun HotJava浏览器3 任意DOM访问漏洞"
updated = "2026-06-16T21:52:51.370"

