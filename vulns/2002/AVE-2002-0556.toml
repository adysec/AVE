[basic]
description = "Prometheus 6.0 及更早版本存在远程文件包含漏洞。攻击者可通过修改 `PROMETHEUS_LIBRARY_BASE` 参数，使其指向存放恶意 PHP 代码的远程服务器，随后在 `index.php`、`install.php` 及多个 `test_*.php` 脚本中加载并执行该恶意代码，从而实现任意 PHP 代码执行。攻击无需身份认证，可远程利用，导致服务器被完全控制。该漏洞影响 Prometheus 6.0 及之前所有版本，CVSS 评分 7.5，危害等级高。"
published = "2002-11-12T05:00:00Z"
remediation = "立即停止使用 Prometheus 6.0 及更早版本，替换为其他受维护的 Web 应用框架。如无法立即替换，在 php.ini 中设置 allow_url_include = Off 和 allow_url_fopen = Off，阻止远程文件包含攻击；同时配置 Web 服务器（如 Apache）对 index.php、install.php 及 test_*.php 脚本实施访问控制，仅允许可信 IP 访问。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Jason Orcutt Prometheus 远程文件包含漏洞"
updated = "2026-06-16T21:58:56Z"

