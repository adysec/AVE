[basic]
description = "tags.<value>Cisco Catalyst 4000/5000/6000 系列交换机运行的 SSH 服务（版本 6.1）存在协议处理缺陷，当远程攻击者使用非 SSH 客户端连接到 SSH 服务端口时，会触发协议不匹配错误，导致交换机 SSH 服务崩溃或不可用，从而造成拒绝服务。该漏洞无需身份认证即可利用，影响范围为运行受影响固件版本的 Catalyst 系列交换机，主要危害为服务可用性丧失。"
published = "2001-02-12T05:00:00.000"
remediation = "升级 Cisco IOS 软件至已修复此漏洞的版本（建议 12.1(11) 或更高版本），通过 `software install` 命令或 TFTP 方式更新固件。若无需 SSH 服务，可通过 `no ip ssh` 命令关闭 SSH 以消除攻击面。如无法立即升级，可在交换机 ACL 中限制仅允许可信管理 IP 地址访问 SSH 服务（`access-list` + `ssh` 关键字），作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Cisco Catalyst 4000/5000/6000 交换机 SSH协议不匹配拒绝服务漏洞"
updated = "2026-06-16T21:53:37.117"

