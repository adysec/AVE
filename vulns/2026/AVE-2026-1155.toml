[basic]
description = "Axios 在使用 Node.js HTTP/2 适配器发送流式请求体时，`maxBodyLength` 限制配置被绕过。当应用配置了有限的 `maxBodyLength` 作为出站请求体大小上限（例如在上传代理端点将用户数据转发到上游 HTTP/2 服务时），攻击者若可控制传入的数据流，即可使应用传输超过配置限制的任意大量数据，导致出站带宽耗尽、上游配额超额及可用性下降。该漏洞影响使用 Node.js HTTP 适配器、启用 `httpVersion: 2`、请求数据以流形式传递且设置了有限 `maxBodyLength` 的应用场景；浏览器适配器不受影响，字符串、Buffer 和 ArrayBuffer 形式的请求体会在传输前被检查。攻击者无需身份认证，仅需能够控制转发到 axios 的上游流即可触发该策略绕过。"
published = "2026-01-01T00:00:00Z"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Axios HTTP/2流式上传请求绕过maxBodyLength限制漏洞"
updated = "2026-01-01T00:00:00Z"

