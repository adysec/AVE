[basic]
description = "Netscape (iPlanet) Certificate Management System 4.2 和 Directory Server 4.12 将管理员密码以明文形式存储在服务器配置文件中，属于敏感信息泄露漏洞。本地攻击者可通过直接读取配置文件获取管理员密码，进而获得服务器完全管理权限；远程攻击者在获取服务器文件读取权限后也可利用此漏洞。该漏洞影响 iPlanet 系列产品，CVSS 评分 10.0，危害等级严重。"
published = "2000-12-11T05:00:00.000"
remediation = "立即升级到受支持的最新版本（如 Oracle Directory Server Enterprise Edition 11g 或 Red Hat Directory Server 11），该版本已不再以明文存储管理密码。如无法升级，立即将 CMS 配置目录（默认 /var/netscape/server4/）权限设为仅 root 可读写（chmod 600），并启用文件完整性监控（如 AIDE/Tripwire）检测配置文件的未授权访问。同时限制管理端口的网络访问，仅允许受信任管理 IP 连接。作为临时措施，可迁移管理操作到本地控制台并禁用远程管理接口。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Netscape (iPlanet) 证书管理系统和目录服务器密码明文存储漏洞"
updated = "2026-06-16T21:53:06.060"

