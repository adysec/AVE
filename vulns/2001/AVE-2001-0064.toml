[basic]
description = "glibc 2.1.9x 及更早版本在执行 setuid/setgid 程序时，未能正确清除 RESOLV_HOST_CONF、HOSTALIASES 或 RES_OPTIONS 等环境变量，导致本地低权限用户可借助这些残留变量操控 DNS 解析器的配置行为，从而读取系统上的任意文件内容或触发命令执行。该漏洞影响使用了受影响 glibc 版本的 Linux 系统，攻击者需具备本地登录权限，无需身份认证即可利用。由于漏洞仅影响机密性（C:P），CVSS v2 评分为 2.1，危害等级较低。"
published = "2001-03-26T05:00:00.000"
remediation = "升级 glibc 至 2.2 或更高版本（如 glibc 2.2.5 及以上），该版本已修复 RESOLV_HOST_CONF/HOSTALIASES/RES_OPTIONS 环境变量在 setuid/setgid 程序中的未清理问题。临时缓解：在 /etc/profile 或用户 shell 配置中显式取消设置上述三个环境变量（unset RESOLV_HOST_CONF HOSTALIASES RES_OPTIONS），并限制普通用户对 setuid 程序的执行权限（chmod o-x /path/to/suid-binary）。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "GNU glibc 环境变量信息泄露漏洞"
updated = "2026-06-16T21:53:48.183"

