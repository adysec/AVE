[basic]
description = "Netscape Communicator 4.73 及更早版本在处理 JPEG 图片中的注释字段时存在堆溢出漏洞。当 JPEG 图片包含一个非法字段长度（值为 1）的注释块时，程序在堆内存分配和拷贝过程中发生溢出，导致内存破坏。远程攻击者可通过构造特制的 JPEG 图片，诱使用户在受影响浏览器中打开，即可触发该漏洞，造成拒绝服务或执行任意代码。该漏洞影响 Netscape Communicator 4.x 全系版本，攻击条件低，无需认证即可远程利用。"
published = "2000-07-25T04:00:00Z"
remediation = "立即升级 Netscape Communicator 至 4.74 或更高版本，该版本修复了 JPEG 注释长度字段校验缺失导致的堆溢出问题。如无法升级，建议停止使用 Netscape Communicator，改用 Mozilla Firefox 或其它现代浏览器。Linux 发行版用户可通过 Red Hat RHSA-2000-046、FreeBSD-SA-00:39 或 NetBSD-SA2000-011 提供的补丁包进行更新。临时缓解措施可在邮件/新闻客户端中禁用自动加载图片功能。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Netscape Communicator JPEG注释堆溢出漏洞"
updated = "2026-06-16T21:52:12Z"

