[basic]
description = "Winamp 是 NullSoft 公司开发的一款流行媒体播放器，其 2.64 及更早版本在处理 M3U 播放列表文件时存在缓冲区溢出漏洞。当播放列表文件中包含超长的 #EXTINF: 扩展字段时，Winamp 在解析该字段时未对输入长度进行充分校验，导致发生缓冲区溢出。远程攻击者无需身份认证即可通过向受害者发送特制的 M3U 播放列表文件（例如通过电子邮件附件、即时消息或网页链接诱使用户打开），在用户使用 Winamp 打开该恶意播放列表时触发溢出，进而执行任意命令。该漏洞影响 Winamp 2.64 及以下所有版本，由于 Winamp 在当时被广泛使用，潜在影响范围较大。用户应升级到修复版本以避免遭受攻击。"
published = "2000-07-20T04:00:00.000"
remediation = "建议立即将 NullSoft Winamp 升级至 2.81 或更高版本，该版本已修复 M3U 播放列表中 #EXTINF 扩展字段的缓冲区溢出问题。无法升级时，应避免打开来源不明的 .m3u 播放列表文件，并在防火墙层面禁止 Winamp 进程接收外部网络连接作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "NullSoft Winamp 2.64 M3U播放列表缓冲区溢出"
updated = "2026-06-16T21:52:08.083"

