[basic]
description = "Apple macOS 系统中 USD（Universal Scene Description）库存在堆缓冲区溢出漏洞，源于在将用户提供的特制数据复制到堆缓冲区之前未对数据长度进行充分验证。未经身份认证的远程攻击者可通过诱使目标用户打开恶意构造的 USD 文件或图片触发该漏洞，导致进程内存被破坏并在当前进程上下文中执行任意代码。该漏洞影响 macOS Sequoia 及 macOS Tahoe 等版本，CVSS 评分为 7.8，危害等级高。Apple 已在 macOS Sequoia 15.7.8 及 macOS Tahoe 26.6 安全更新中修复此漏洞。"
published = "2026-07-27T21:16:58Z"
remediation = "建议用户立即升级设备系统：iPhone 升级至 iOS 26.6，iPad 升级至 iPadOS 26.6，Mac 升级至 macOS Sequoia 15.7.8 或 macOS Tahoe 26.6。对于无法及时更新的设备，应避免打开来源不明的图像文件，并可通过防火墙或内容过滤策略拦截未知图片格式的入站传输作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Apple iOS macOS iPadOS 图像处理内存越界漏洞"
updated = "2026-07-28T19:31:56Z"

