[basic]
description = "Cisco PIX Firewall 5.2(2) 在处理 FTP 被动模式（PASV）请求时存在内部地址信息泄露漏洞。未经身份认证的远程攻击者可通过向目标 FTP 服务器发送大量 PASV 请求，在被动模式建立时获取服务器响应中携带的内部真实 IP 地址，从而泄露受保护网络内部的主机地址信息。该漏洞影响 Cisco Secure PIX Firewall 5.2(2) 版本，攻击者可利用此信息进一步发起针对内部网络的定向攻击。攻击条件为攻击者能够与目标 PIX 防火墙建立网络连接并发送 FTP PASV 请求，利用方式简单且无需任何认证凭据。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级 Cisco PIX Firewall 到支持安全修复的版本，建议安装 Cisco PIX Firewall 5.3 或更高版本，并启用受保护的 FTP 配置。通过 `fixup protocol ftp force-tcp` 命令强制 FTP 协商使用 TCP 连接，同时配置访问控制列表限制 PASV 命令的来源地址，防止攻击者发起 IP 地址泄露的 FTP 被动模式攻击。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "思科 PIX Firewall PASV模式FTP内部地址泄露漏洞"
updated = "2026-06-16T21:53:00Z"

