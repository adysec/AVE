[basic]
description = "Adobe Flash Player 在处理特定媒体内容时存在缓冲区溢出漏洞，由于程序对用户输入的数据边界检查不充分，远程攻击者可通过诱导用户访问恶意网页或打开特制文件触发该漏洞。成功利用后可在受影响系统上以当前用户权限执行任意代码，完全控制目标主机。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上的 Flash Player 10.3.183.5 之前版本，CVSS 评分 10.0，危害等级严重。Adobe 已在安全更新中修复此漏洞。"
published = "2011-08-10T22:55:00Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.5 及以上版本（Windows/Mac/Linux/Solaris），Android 平台升级至 10.3.186.3 及以上版本；Adobe AIR 升级至 2.7.1（桌面版）或 2.7.1.1961（Android 版）及以上版本。如无法升级，可在浏览器中禁用 Flash 插件或卸载 Flash Player 以彻底消除风险。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T23:31:17Z"

