[basic]
description = "Linux内核padata子系统中的padata_reorder函数存在释放后使用（UAF）漏洞。当加密算法被删除时，引用计数可能在进入padata_find_next之前降至零，导致已释放的内存被再次访问。攻击者可通过运行ltp测试（如pcrypt_aead01）触发该漏洞，可能导致内核崩溃或权限提升。该漏洞影响使用受影响内核版本的Linux系统，CVSS评分为7.8（高危），CWE编号为CWE-416。"
published = "2025-02-27T02:15:16.423"
remediation = "升级 Linux 内核至已修复此漏洞的版本（主线内核 6.6 及以上已包含修复补丁）。具体操作：执行 `uname -r` 确认当前内核版本，若低于 6.6 则通过发行版包管理器升级内核（如 Ubuntu 执行 `sudo apt update && sudo apt install linux-image-generic`，RHEL/CentOS 执行 `sudo yum update kernel`）。升级后重启系统并再次执行 `uname -r` 确认版本已更新。若无法立即升级内核，可在内核参数中添加 `mitigations=off` 以禁用相关并行解密功能作为临时缓解措施，但会降低系统性能。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 padata 释放后使用（UAF）漏洞"
updated = "2026-06-17T08:44:08.047"

