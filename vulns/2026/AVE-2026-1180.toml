[basic]
description = "NoMachine 在处理命令行参数时存在路径控制缺陷，未对用户提供的路径进行充分验证即执行文件操作。攻击者需先在目标系统上获得低权限代码执行能力，随后利用该漏洞将权限提升至 root，从而执行任意代码。该漏洞影响 NoMachine 桌面客户端本地用户，危害等级为高危。"
published = "2026-04-11T01:16:17.890"
remediation = "立即升级至 NoMachine 9.4.14 或 8.22.1 版本。RPM 用户执行 `rpm -Uvh <pkgName>_<pkgVersion>_<arch>.rpm`，DEB 用户执行 `dpkg -i <pkgName>_<pkgVersion>_<arch>.deb`。临时缓解措施：限制 KRB5CCNAME 环境变量指向的 Kerberos 缓存文件权限为仅所有者可读写，删除系统中不再使用的 Kerberos 票据缓存文件（klist -e 清理），并禁用 NoMachine 服务中不必要的 Kerberos 认证模块。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "NoMachine 外部控制文件路径本地提权漏洞"
updated = "2026-06-17T10:58:22.240"

