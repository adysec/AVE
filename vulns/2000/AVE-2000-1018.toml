[basic]
description = "ClearSwift MAILsweeper for SMTP 3.x 在处理 ZIP 压缩包中的损坏 CDA 文档时存在处理逻辑缺陷，导致程序挂起无响应。远程攻击者无需身份认证即可通过向目标邮件服务器发送特制的包含损坏 CDA 文件的 ZIP 附件触发该漏洞，造成拒绝服务。该漏洞影响 ClearSwift MAILsweeper for SMTP 3.x 版本，CVSS 评分 5.0，危害等级中危。"
published = "2000-12-19T05:00:00Z"
remediation = "升级到 ClearSWIFT MAILsweeper for SMTP 4.0 或更高版本，该版本已修复 ZIP 中损坏 CDA 文档导致的挂起问题。如无法升级，在邮件网关配置中启用深度内容检测，阻止 ZIP 压缩包内的 CDA 文件通过，或直接在 SMTP 代理层过滤 application/x-cda 类型的附件作为临时缓解措施。该产品已停止支持，建议迁移至 ClearSWIFT Secure Email Gateway 等现代邮件安全网关。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "ClearSwift MAILsweeper for SMTP 3.x ZIP Archive 拒绝服务漏洞"
updated = "2026-06-16T21:52:47Z"

