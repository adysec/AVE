[basic]
description = "Apache mod_auth_pgsql 认证模块 0.9.5 版本及 mod_auth_pgsql_sys 0.9.4 版本存在 SQL 注入漏洞，未经身份认证的远程攻击者可通过在用户名字段构造恶意 SQL 语句绕过身份验证并执行任意 SQL 命令。该漏洞影响使用该模块进行 PostgreSQL 数据库认证的 Apache Web 服务器，攻击者无需任何权限即可通过网络远程利用，CVSS 评分 7.5（高危），可导致数据库信息泄露、数据篡改甚至服务器完全沦陷。"
published = "2001-08-29T04:00:00Z"
remediation = "建议立即升级 mod_auth_pgsql 至 0.9.6 或更高版本，升级 mod_auth_pgsql_sys 至 0.9.5 或更高版本。若无法立即升级，请在 Apache 配置中禁用 mod_auth_pgsql 和 mod_auth_pgsql_sys 模块，或在 PostgreSQL 中为认证用户创建只读账户并限制 SQL 权限，同时在 Web 应用层面对用户名输入进行严格的参数化查询和输入验证，防止 SQL 注入。建议升级 Apache 至 2.0.39 或更高版本并使用官方认证模块替代。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Guiseppe Tanzilli 和 Matthias Eckermann mod_auth_pgsql 认证模块 SQL注入漏洞"
updated = "2026-06-16T21:56:09Z"

