[basic]
description = "Apple WebKit 引擎中存在未明内存破坏漏洞（CWE-119）。远程攻击者可构造特制网站，诱使目标用户通过 Safari 浏览器、iOS 或 iTunes 访问，WebKit 在处理恶意页面内容时发生内存损坏，导致攻击者能够在目标系统上执行任意代码或造成拒绝服务（应用崩溃）。该漏洞影响 iOS 5.1 之前版本、iTunes 10.6 之前版本及 Safari 5.1.4 之前版本，CVSS 评分 9.3，危害等级严重。攻击无需身份认证，但需要用户交互（访问恶意网站）。Apple 已在 2012 年 3 月 7 日发布的安全更新中修复此漏洞。"
published = "2012-03-08T22:55:03Z"
remediation = "将 Apple iOS 升级至 5.1 及以上版本，将 iTunes 升级至 10.6 及以上版本，将 Safari 升级至 5.1.4 及以上版本。可通过设备「设置→通用→软件更新」执行 OTA 升级，或连接 iTunes 进行更新。如无法立即升级，建议禁用 WebKit 解析不可信网页内容，并在网络边界部署 Web 过滤以阻止访问恶意站点。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:58Z"

