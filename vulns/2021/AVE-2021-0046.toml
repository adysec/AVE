[basic]
description = "Apple iOS 及 iPadOS 系统存在经典缓冲区溢出漏洞（CWE-120），由于系统在处理内存拷贝时未对输入大小进行有效边界检查，导致攻击者可以构造特制数据触发缓冲区溢出。该漏洞影响 iOS 及 iPadOS 15.2 以下所有版本，攻击者通过诱导用户在受影响设备上打开恶意应用或文件即可利用此漏洞，最终获得内核级别权限执行任意代码，完全控制设备。CISA 已将本漏洞纳入已知被利用漏洞目录。Apple 已在 iOS 15.2 及 iPadOS 15.2 安全更新中通过改进内存处理机制修复此问题，受影响用户应尽快升级至最新版本。"
published = "2021-08-24T19:15:23Z"
remediation = "立即升级 iPadOS 至 15.2 或更高版本（设置 > 通用 > 软件更新）。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），攻击者可能通过恶意应用以内核权限执行任意代码。如暂无法升级，应避免安装来自未知开发者的应用程序，并限制设备上运行不受信任的代码。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Apple iPadOS 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-17T03:51:15Z"

