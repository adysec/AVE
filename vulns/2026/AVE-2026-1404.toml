[basic]
description = "Electron 框架的扩展标签和脚本 API 未正确限制在扩展自身的会话范围内。当应用程序通过 `session.loadExtension` 加载 Chrome 扩展并依赖独立会话进行隔离时，恶意或被攻陷的扩展可跨越会话边界导航、脚本化和读取属于其他会话的窗口内容。攻击者需将恶意扩展加载到目标会话中，利用高权限和复杂的用户交互才能触发跨会话数据访问。此漏洞影响使用多会话隔离机制的所有 Electron 应用，攻击者可借此突破会话隔离限制，获取其他会话中窗口的敏感信息。Electron 已在 39.8.8、40.9.0、41.2.1 及 42.0.0-beta.3 版本中修复此问题。"
published = "2026-08-05T16:17:04Z"
remediation = "立即将 Electron 框架升级至 39.8.8、40.9.0、41.2.1 或 42.0.0-beta.3 及以上修复版本，以消除扩展 tab 及 scripting API 跨 session 边界访问的安全隐患。对于依赖 session.loadExtension 加载 Chrome 扩展并利用多 session 实现隔离的应用程序，升级后应审查扩展来源，仅加载受信任的扩展；如暂时无法升级，应避免将 session 隔离作为唯一的安全控制措施，改为在单一 session 中运行扩展或限制扩展的 host 权限范围。"
score = 6.6
severity = "MEDIUM"
sources = ["ghsa"]
title = "Electron 跨平台桌面应用扩展 API 跨会话访问漏洞"
updated = "2026-08-05T17:16:54Z"

