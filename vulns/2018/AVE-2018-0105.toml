[basic]
description = "LG SuperSign CMS 存在路径遍历漏洞，远程攻击者无需身份认证即可通过向 signEzUI/playlist/edit/upload/ 接口发送包含 `..%2f` 序列的特制 URI 请求，突破目录限制读取服务器上的任意文件，导致敏感信息泄露。该漏洞影响 LG SuperSign EZ CMS 2.5 及更早版本，CVSS 评分 8.6，危害等级高。攻击者只需能够访问目标 Web 管理界面即可利用，攻击复杂度低。"
published = "2018-09-14T21:29:04Z"
remediation = "立即将 LG SuperSign CMS 升级至厂商提供的最新版本（如有）；若产品已停止维护，建议在前置反向代理（如 Nginx/Apache）中添加规则，拦截包含 `..%2f` 或 `../` 等目录遍历特征的请求路径，同时限制 `/signEzUI/playlist/edit/upload/` 路径仅允许认证用户访问，并在 Web 服务器层面禁用不必要的目录列表功能。"
score = 8.6
severity = "HIGH"
sources = ["nuclei"]
title = "LG SuperSign CMS 文件读取漏洞"
updated = "2026-06-17T01:44:02Z"

