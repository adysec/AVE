[basic]
description = "Caldera Linux 的 gpm（通用鼠标服务）存在安全漏洞，本地攻击者利用该服务对文件操作的权限控制缺陷，可通过发送特制请求删除系统任意文件或触发拒绝服务。该漏洞影响 Caldera Linux 系统，攻击者需具备本地访问权限，无需认证即可实施攻击，CVSS 评分 3.6，危害等级低。"
published = "2000-07-27T04:00:00Z"
remediation = "立即应用 Caldera 安全公告 CSSA-2000-024.0 提供的补丁，升级 gpm 至修复版本。如无法获取官方补丁，可限制本地用户对 gpm 的访问权限，或禁用 gpm 服务（`/etc/init.d/gpm stop`）。由于 Caldera Linux 已停止支持，建议迁移至受支持的 Linux 发行版。"
score = 3.6
severity = "LOW"
sources = ["avd"]
title = "Caldera Linux gpm 本地文件删除与拒绝服务漏洞"
updated = "2026-06-16T21:52:13Z"

