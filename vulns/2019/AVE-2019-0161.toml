[basic]
description = "WordPress 高级访问管理器插件存在路径遍历漏洞，由于对 aam-media 参数缺乏充分验证，未经身份认证的远程攻击者可通过发送特制的请求利用该漏洞读取服务器上的任意文件。该漏洞影响版本 5.9.8.1 及以下版本的 Advanced Access Manager 插件，攻击者可借此获取 wp-config.php 等敏感文件内容，导致敏感信息泄露并可能进一步危及整个 WordPress 网站的安全。"
published = "2024-10-16T07:15:05.790"
remediation = "立即将 Advanced Access Manager 插件升级到 5.9.9 或更高版本，以修复 aam-media 参数路径遍历漏洞。升级方式：在 WordPress 后台的「插件」页面点击「更新」，或通过 wp-admin/update-core.php 执行更新。如短期内无法升级，可临时在网站根目录的 .htaccess 文件中添加规则拦截包含 aam-media 参数的恶意请求，例如 RewriteCond %{QUERY_STRING} aam-media [NC] 并返回 403 响应，同时限制 WordPress 插件目录的读写权限，避免敏感文件（如 wp-config.php）被未授权访问。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress 高级访问管理器 未经身份验证的任意文件读取漏洞"
updated = "2026-06-17T02:31:45.700"

