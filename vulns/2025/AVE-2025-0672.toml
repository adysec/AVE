[basic]
description = "Windows Secure Boot 安全功能存在绕过漏洞，属于访问控制缺陷（CWE-284）。具有物理访问权限的攻击者可通过在系统启动过程中绕过 Secure Boot 完整性验证机制，破坏安全启动链的信任根，从而加载未签名的恶意代码或未经授权的操作系统。该漏洞影响多个 Windows 版本，机密性影响为高，但需要攻击者具备物理接触目标设备的能力，降低了实际利用的便捷性。Microsoft 已在 2025 年 1 月安全更新（KB5049981）中修复此漏洞。"
published = "2025-01-14T18:15:32Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新：Windows 10 22H2/21H2 安装 KB5049981（OS Builds 19044.5371 / 19045.5371），Windows Server 2019 安装 KB5050008（OS Build 17763.6775），Windows 11 对应版本安装 2025 年 1 月累积更新。同时进入 UEFI 固件设置确认 Secure Boot 处于启用状态，并吊销已知不安全的第三方 UEFI 证书。"
score = 4.6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows Secure Boot 安全功能绕过漏洞"
updated = "2026-06-17T08:42:47Z"

