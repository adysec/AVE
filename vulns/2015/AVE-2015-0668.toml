[basic]
description = "IBM WebSphere 产品中存在 Java 反序列化远程代码执行漏洞。该漏洞源于 Apache Commons Collections 库中的 InvokerTransformer 类在反序列化过程中未对恶意构造的序列化对象进行安全校验，远程攻击者无需身份认证即可通过发送特制的序列化 Java 对象触发反序列化操作，在目标服务器上执行任意命令，从而完全控制服务器。该漏洞影响 IBM 多款分析、商业解决方案、认知、IT 基础设施及移动社交产品，CVSS 评分 9.8，危害等级严重。IBM 官方已发布安全公告并建议用户升级至修复版本。"
published = "2016-01-02T21:59:15Z"
remediation = "建议立即将 IBM WebSphere Application Server 升级至 8.5.5.9 及以上版本，或安装 IBM 官方临时补丁 PH04835。对于独立使用 Apache Commons Collections 的应用，升级至 3.2.2 版本（该版本移除了 InvokerTransformer 类的反序列化利用链）。如无法立即升级，可在 WebSphere 管理控制台启用 Java 反序列化过滤器（com.ibm.ws.security.serialization.filter），配置白名单限制可反序列化的类，阻止恶意序列化对象传入。同时建议在网络层部署 WAF 规则，拦截包含 Java 序列化特征（AC ED 00 05）的请求作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "IBM WebSphere 反序列化远程代码执行漏洞"
updated = "2026-06-17T00:32:33Z"

