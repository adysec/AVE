[basic]
description = "Internet Explorer 4.x 及 5.x 版本中用于调用脚本小程序（Scriptlet）的 ActiveX 控件存在文件类型渲染漏洞。该控件在处理非 HTML 文件类型时，未能正确限制渲染范围，导致攻击者可以构造恶意网页，诱使用户访问后利用该漏洞读取目标系统上的任意文件内容。攻击条件要求用户交互（如点击链接），且仅能读取文件内容而无法修改，CVSS 评分 2.6，危害等级低。受影响的系统包括 Windows 平台上使用 IE 4.x/5.x 的版本。"
published = "2000-10-20T04:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-055 提供的补丁（KB269368），该补丁可阻止 Scriptlet 组件渲染非 HTML 文件。如无法安装补丁，可将 Internet Explorer 升级至 5.5 以上版本，或在 Internet 安全区域中禁用 Active Scripting 功能作为临时缓解措施。建议升级至受支持的现代浏览器（如 Edge），该漏洞在后续版本中已彻底修复。"
score = 2.6
severity = "LOW"
sources = ["epss"]
title = "Microsoft Internet Explorer Scriptlet组件任意文件读取漏洞"
updated = "2026-06-16T21:52:26.320"

