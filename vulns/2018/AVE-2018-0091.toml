[basic]
description = "Polaris FT Intellect Core Banking 的 Core 和 Portal 模块存在开放重定向漏洞，攻击者可通过构造特制的 /IntellectMain.jsp?IntellectSystem= 参数将用户重定向至恶意外部站点，结合社会工程学诱导用户点击恶意链接，可导致钓鱼攻击或凭证窃取。该漏洞影响 Polaris FT Intellect Core Banking 9.7.1 版本，CVSS 评分 6.1，危害等级中危，攻击复杂度低且无需身份认证，但需要用户交互。"
published = "2019-04-30T19:29:02Z"
remediation = "升级 Polaris FT Intellect Core Banking 至 9.7.1 以上已修复版本；在 Web 服务器或应用层对 `/IntellectMain.jsp` 的 `IntellectSystem` 参数实施白名单校验，仅允许内部合法重定向目标 URL；部署 WAF 规则拦截包含外部域名的 `IntellectSystem` 参数请求；在代码层对重定向目标执行 URL 验证，拒绝非白名单域名。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Polaris FT Intellect Core Banking 开放重定向漏洞"
updated = "2026-06-17T01:41:54Z"

