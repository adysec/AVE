[basic]
description = "Microsoft Office 公式编辑器（Equation Editor）在处理内存中的对象时存在远程代码执行漏洞。由于公式编辑器未能正确验证对象处理过程中的内存边界，导致存在越界写入（CWE-787）问题。攻击者可利用特制的 Office 文档，通过社会工程手段诱导用户打开恶意文件触发该漏洞，进而在目标系统上执行任意代码。该漏洞影响 Microsoft Office 2007、2010、2013 及 2016 等多个版本，CVSS 评分 7.8，危害等级高。已有公开的利用工具（如 packager_exec_CVE-2018-0802.py）可在 GitHub 上获取，增加了被实际利用的风险。"
published = "2018-01-10T01:29:00Z"
remediation = '立即安装 Microsoft 2018 年 1 月安全更新 (KB4011651 等对应版本补丁)，或通过 Windows Update 自动更新。受影响版本包括 Office 2007/2010/2013/2016，Equation Editor 组件存在内存损坏漏洞，攻击者可构造恶意 Office 文档诱导用户打开触发远程代码执行。如无法立即打补丁，可禁用 Equation Editor 组件：删除或重命名 `eqnedt32.exe`（路径 `C:\Program Files\Common Files\Microsoft Shared\EQUATION`），或通过组策略禁止 Office 从 OLE 对象启动 Equation Editor。'
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Office 内存损坏远程代码执行漏洞"
updated = "2026-06-17T01:31:41Z"

