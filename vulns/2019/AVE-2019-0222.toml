[basic]
description = "Atlassian Crowd 及 Crowd Data Center 在发布版本中错误地启用了 pdkinstall 开发插件，导致未经身份认证的远程攻击者可通过向 /crowd/admin/uploadplugin.action 端点发送特制 multipart 请求上传恶意插件包，从而在目标服务器上执行任意代码，完全控制受影响系统。该漏洞影响 Crowd 2.1.0 至 3.4.4 之间的多个版本，CVSS 评分 9.8，危害等级严重。Atlassian 已在 3.0.5、3.1.6、3.2.8、3.3.5 及 3.4.4 版本中修复此漏洞。"
published = "2019-06-03T14:29:00Z"
remediation = "升级 Crowd/Crowd Data Center 至以下修复版本：3.0.x 升级至 3.0.5，3.1.x 升级至 3.1.6，3.2.x 升级至 3.2.8，3.3.x 升级至 3.3.5，3.4.x 升级至 3.4.4。如无法立即升级，可删除或禁用 pdkinstall 插件目录以防止插件上传利用。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Atlassian Crowd 及 Crowd Data Center 远程代码执行漏洞"
updated = "2026-06-17T02:13:11Z"

