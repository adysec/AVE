[basic]
description = "Samba 2.0.7 的 Web 管理工具 SWAT（Samba Web Administration Tool）存在符号链接漏洞。本地攻击者可通过在 cgi.log 日志文件上创建符号链接，诱使 SWAT 以 root 权限写入日志，从而覆盖系统任意文件，实现权限提升。该漏洞影响 Samba 2.0.7 版本，攻击者需拥有本地系统访问权限，利用难度较低，可导致完全控制目标系统。"
published = "2000-12-19T05:00:00Z"
remediation = "升级 Samba 至 2.0.8 或更高版本，该版本修复了 SWAT 写入 cgi.log 时跟随符号链接的问题。如无法升级，可删除 SWAT 的 setuid 权限（chmod -s /usr/sbin/swat），并通过 hosts allow 限制 SWAT 仅允许本地回环地址访问（在 smb.conf 的 [swat] 段中添加 hosts allow = 127.0.0.1）。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Samba SWAT 符号链接漏洞"
updated = "2026-06-16T21:52:48Z"

