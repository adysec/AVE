[basic]
description = "Microsoft 恶意软件保护引擎（MsMpEng）在处理特制文件时存在内存破坏漏洞。由于引擎的垃圾回收（GC）机制存在设计缺陷，导致释放后重用（Use-After-Free），远程攻击者可通过构造恶意文件并诱导用户打开或由 Exchange Server 自动扫描触发该漏洞，导致远程代码执行。该漏洞影响 Windows 7/8.1/10、Windows Server 2008/2012/2016 及 Exchange Server 2013/2016 等多个平台，CVSS 评分 7.8，危害等级高。Microsoft 已于 2017 年 5 月安全更新中修复此漏洞。"
published = "2017-05-26T20:29:00Z"
remediation = '立即确保 Microsoft 恶意软件保护引擎 (mpengine.dll) 升级至 1.1.13704.0 或更高版本。该更新通过 Windows Update/Microsoft Update 自动推送，通常 48 小时内完成安装；也可在受影响产品中手动执行"检查更新"强制触发。对于企业环境，应通过 WSUS/Configuration Manager 审批并部署引擎更新，确保所有终端（包括 Windows Defender、System Center Endpoint Protection、Exchange Server 2013/2016 等）均运行最新引擎版本。临时缓解措施：在无法立即更新的系统上禁用实时保护中的脚本扫描功能，但会降低防护能力。'
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Malware Protection Engine 远程执行代码漏洞"
updated = "2026-06-17T01:26:32Z"

