[basic]
description = "libxml2 在处理 XPath 表达式时存在双重释放（Double Free）漏洞（CWE-415）。当 Google Chrome 浏览器解析特制的 XPath 内容时，由于内存管理错误导致同一内存区域被释放两次，可能被远程攻击者利用。攻击者无需身份认证即可通过诱导用户访问包含恶意 XPath 内容的网页触发该漏洞，导致拒绝服务或可能执行任意代码。该漏洞影响 Google Chrome 14.0.835.163 之前的版本，CVSS 评分为 6.8，危害等级中等。"
published = "2011-09-19T12:02:55Z"
remediation = '''
升级 Google Chrome 至 14.0.835.163 及以上版本，该版本已修复 libxml2 XPath 处理中的 double-free 漏洞。对于嵌入式或服务器环境中使用的 libxml2，升级至 2.7.8 及以上版本。如无法立即更新，可在 WAF 层过滤包含畸形 XPath"""
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome libxml2 XPath处理双重释放漏洞"
updated = "2026-06-16T23:32:04.933"
