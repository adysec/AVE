[basic]
description = "GV、GGV、Gnome-GV 及 KGhostview 等多款 PostScript/PDF 预览工具在处理畸形 PDF 或 PostScript 文件时，因对 sscanf 函数的不安全调用导致栈缓冲区溢出。攻击者可构造恶意 PDF/PS 文件，诱导受害者使用受影响版本的查看器（gv 3.5.8 及更早、gvv 1.0.2 及更早、ggv 1.99.90 及更早、gnome-gv、kdegraphics 2.2.2 及更早版本中的 kghostview）打开文件，触发栈溢出并在受害者本地用户权限下执行任意代码。攻击需受害者主动打开恶意文件（本地攻击向量，CVSS 4.6 AV:L/AC:L/Au:N），利用成功可导致任意代码执行，影响机密性、完整性与可用性。ExploitDB (EDB-21872) 及多个 GitHub 仓库均有公开 PoC 代码。"
published = "2002-10-10T04:00:00.000"
remediation = "建议立即升级到以下修复版本：gv 升级至 3.5.9 或更高版本，gvv 升级至 1.0.3 或更高版本，ggv 升级至 1.99.91 或更高版本，gnome-gv 升级至 GNOME 2.0 后续修复版本，kdegraphics 中的 kghostview 升级至 2.2.3 或更高版本（对应 KDE 3.0.3+）。无法立即升级时，建议禁用浏览器自动打开 PDF/PS 文件功能，使用安全的替代查看器（如 xpdf、evince、okular）打开不可信文件，并在防火墙/邮件网关层面拦截可疑 PDF/PS 附件作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "GNOME GV 缓冲区溢出漏洞"
updated = "2026-06-16T21:58:13.880"

