[basic]
description = "cloud-init 在检测到非 x86 平台时，会向硬编码的本地 IP 地址 URL 授予 root 访问权限，构成不当认证漏洞（CWE-287）。攻击者可在同一局域网段内无需身份认证即可利用此漏洞，获取目标系统的 root 控制权，导致机密性、完整性和可用性完全丧失。该漏洞影响 cloud-init 25.1.3 之前的所有版本，CVSS 评分 8.8，危害等级高。官方已在 25.1.3 版本中通过禁用平台枚举的默认配置修复此问题。"
published = "2025-06-26T10:15:25Z"
remediation = "立即升级 cloud-init 至 25.1.3 或更高版本（https://github.com/canonical/cloud-init/releases/tag/25.1.3）。如无法升级，在 cloud.cfg 中设置 `disable_platform_enumeration: true` 以禁用平台枚举功能，并确保非 x86 平台不使用硬编码本地 IP 地址的认证方式。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Canonical cloud-init 权限提升漏洞"
updated = "2026-06-17T08:17:26Z"

