[basic]
description = "Linux 内核 USB xHCI 驱动程序中存在空指针解引用漏洞。当 USB 命令被排队到环段最后一个可用 TRB 时，入队指针会前进到后续链接 TRB 处；若该命令随后被中止，出队指针会前进到下一段的第一个 TRB。此时若无其他命令排队，xhci_handle_stopped_cmd_ring() 函数因环指针不相等而误判存在待处理命令，进而调用 xhci_mod_cmd_timer() 时传入空指针 cur_cmd 导致内核崩溃。本地攻击者需具备低权限，通过编程 USB MCU 设备持续 NAK SET_ADDRESS 阶段的状态即可稳定触发该漏洞，造成拒绝服务。CVSS 评分 5.5，危害等级中等。"
published = "2025-02-27T02:15:11Z"
remediation = "立即更新 Linux 内核至修复版本：5.4.291、5.10.235、5.15.179、6.1.129、6.6.76、6.12.13 或 6.13.2 及以上。对于 Debian 系统，安装 DLA-4178 安全更新。Siemens SIMATIC S7-1500 TM MFP 用户请参考 SSA-503939 和 SSA-265688 安全公告安装补丁。如无法立即更新，可限制本地用户对 USB 子系统的访问权限作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux USB xHCI 空指针解引用漏洞"
updated = "2026-06-17T08:14:22Z"

