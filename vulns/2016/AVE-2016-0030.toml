[basic]
description = "WordPress 的 parsi-font 插件 4.2.5 版本中存在反射型跨站脚本（XSS）漏洞，该漏洞源于程序未对用户输入进行充分的过滤与转义处理。攻击者可利用该漏洞向目标用户发送特制的恶意链接，当用户点击链接后，恶意脚本将在用户浏览器中执行，导致敏感信息泄露、会话劫持或页面内容篡改。攻击无需身份认证，但需要用户交互。该漏洞影响 WordPress parsi-font 插件 4.2.5 及可能更早版本，CVSS 评分 6.1，危害等级中危。"
published = "2016-10-10T20:59:19Z"
remediation = "立即将 parsi-font 插件升级至最新版本 5.3.1，该版本修复了已知安全漏洞。如无法升级，建议停用并删除该插件，因其已超过 3 年未更新且不再兼容最新版 WordPress。同时启用 WordPress 的 XSS 防护机制，对用户输入进行转义处理。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress parsi-font 插件反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:45Z"

