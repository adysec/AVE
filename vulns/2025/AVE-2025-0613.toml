[basic]
description = "Perl IO::Uncompress::Unzip 模块 2.215 版本之前存在异常处理缺陷，_dosToUnixTime() 函数在解析 ZIP 文件头的 DOS 日期字段时，直接调用 Time::Local::timelocal() 而未加 eval 保护。当 ZIP 头部包含格式错误的日期（如月份、日期或小时超出合法范围）时，timelocal() 会抛出异常导致程序崩溃，该异常会从 IO::Uncompress::Unzip->new() 向上传播，破坏调用者预期的错误处理流程。攻击者需具备本地访问权限并能诱导受害者解析恶意构造的 ZIP 文件，即可触发拒绝服务，CVSS 5.5（中危），影响可用性。升级至 2.215 或更高版本可修复该问题。"
published = "2026-05-27T04:16:23Z"
remediation = "建议立即升级 IO::Uncompress::Unzip 模块到 2.215 或更高版本。可通过 CPAN 执行 `cpan IO::Uncompress::Unzip` 更新，或使用系统包管理器（如 `apt-get update && apt-get install libio-uncompress-unzip-perl`、`yum update perl-IO-Compress`）安装修复版本。若无法立即升级，可在应用层添加异常捕获包装解析调用，或拒绝处理来源不可信的 ZIP 文件作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Perl IO::Uncompress::Unzip 拒绝服务漏洞"
updated = "2026-07-24T12:10:00Z"

