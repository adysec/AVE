[basic]
description = "Solaris 系统的 CDE 子进程控制服务（dtspcd）在客户端连接处理例程（libDtSvc.so.1）中存在堆缓冲区溢出漏洞（CWE-119），未经身份认证的远程攻击者仅需向目标系统的 TCP 6112 端口发送特制超长数据包即可触发该溢出，进而执行任意系统命令，完全接管受影响主机。该漏洞影响 Solaris 2.5.1 至 9 等多个版本，CVSS v2 评分为满分 10.0（AV:N/AC:L/Au:N/C:C/I:C/A:C），危害等级极其严重。攻击者无需事先获取任何用户凭据或系统权限，只要网络可达即可完成利用，实现任意代码执行、敏感信息窃取及持久化后门植入，并可作为进一步内网横向移动的跳板。"
published = "2001-12-06T05:00:00Z"
remediation = "Sun Microsystems 官方安全通告 #00214 已发布补丁：Solaris 8 请安装补丁 108949-07（SPARC）或 108950-07（x86），Solaris 7 请安装 106934-04（SPARC）或 106935-04（x86），Solaris 2.6 请安装 105669-11（SPARC）或 105670-10（x86），Solaris 2.5.1 请安装 108363-02（SPARC）或 108364-02（x86）。HP-UX 平台请按版本安装对应补丁：10.10 安装 PHSS_25785，10.20 安装 PHSS_25786，10.24 安装 PHSS_26029，11.00 安装 PHSS_25787，11.04 安装 PHSS_26030，11.11 安装 PHSS_25788。IBM AIX 4.3 请安装 APAR IY25436，AIX 5.1 请安装 APAR IY25437。Compaq Tru64 UNIX 各版本需安装对应 ERP 补丁包。如暂无法立即打补丁，可编辑 /etc/inetd.conf 注释掉 dtspcd 服务行以禁用 dtspcd，同时在防火墙层面阻断外部对 6112/tcp 端口的访问作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Sun Solaris CDE dtspcd 远程堆溢出漏洞"
updated = "2026-06-16T21:54:59Z"

