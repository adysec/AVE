[basic]
description = "Netscape PublishingXpert 2.0、2.2 及 2.5 版本（2.5 在 SP2 之前）存在路径遍历漏洞，其错误页面脚本 PSCOErrPage.htm 中的 errPagePath 参数未对用户输入进行有效过滤和验证。未经身份认证的远程攻击者可通过在 errPagePath 参数中指定目标服务器上的任意文件路径，向该 Web 应用发送恶意请求，从而读取服务器文件系统中的任意文件内容。攻击者利用此漏洞可获取配置文件、密码文件等敏感信息，进而为进一步入侵提供情报支持。该漏洞影响范围覆盖 Netscape PublishingXpert 2.0/2.2/2.5 多个版本，CVSS v2 评分 5.0，危害等级中等。Netscape 已在 2.5 SP2 中修复了此问题。"
published = "2001-08-31T04:00:00Z"
remediation = "升级 Netscape PublishingXpert 至 2.5 SP2 或更高版本以修复 PSCOErrPage.htm 路径遍历漏洞。如暂无法升级，可临时删除或限制访问 /PSUser/PSCOErrPage.htm 文件，或在 Web 服务器层面对 errPagePath 参数进行过滤，阻止包含 ../ 或绝对路径的请求，同时检查系统日志确认是否存在未授权文件读取痕迹。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Netscape PublishingXpert 本地文件读取漏洞"
updated = "2026-06-16T21:53:21Z"

