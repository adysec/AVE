[basic]
description = "Joomla! 的 PrayerCenter 3.0.2 组件存在 SQL 注入漏洞，攻击者无需认证即可通过向 sessionid 参数传入特制的恶意 SQL 语句触发该漏洞，可导致数据库中的敏感信息泄露、数据篡改甚至完全控制服务器。该漏洞影响 Joomla! PrayerCenter 3.0.2 版本，CVSS 评分 9.8，危害等级严重。目前已公开 Exploit-DB 编号 44160 的利用代码，攻击者可通过发送构造的 HTTP 请求直接利用。"
published = "2018-02-22T19:29:07.453"
remediation = "升级 PrayerCenter 组件至 3.0.6 或更高版本（Joomla 扩展目录最新版），该版本修复了 sessionid 参数未正确过滤导致的 SQL 注入问题。如无法升级，在 Joomla 全局配置中启用系统自带的输入过滤功能，或部署 WAF 规则拦截包含 SQL 关键字的 sessionid 请求参数。同时建议在 Web 服务器层面添加针对 `index.php?option=com_prayercenter` 路径的输入校验规则。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Joomla PrayerCenter 3.0.2 SQL注入漏洞"
updated = "2026-06-17T02:03:00.213"

