[basic]
description = "OpenSSH 3.7 及更早版本的 buffer.c 文件中存在缓冲管理错误，具体位于 buffer_append_space 函数。未经身份认证的远程攻击者可以通过发送特制数据包触发该漏洞，导致程序释放错误数量的内存并破坏堆内存结构，进而执行任意系统代码。该漏洞影响所有运行受影响版本 OpenSSH 的 Unix/Linux 服务器，攻击者无需账户凭证即可在目标系统上获得完全控制权限。此漏洞与 CVE-2003-0695 为不同的安全问题，均已在后续版本中得到修复。"
published = "2003-09-22T04:00:00Z"
remediation = "建议立即升级 OpenSSH 至 3.7.1 或更高版本，可通过包管理器执行 apt-get install openssh-server 或 yum update openssh-server 完成更新。若无法立即升级，应下载 OpenSSH 官方公告（https://www.openssh.com/txt/buffer.adv）中的补丁，对 buffer.c 和 channels.c 手工打补丁后重新编译安装。临时缓解措施包括在防火墙层限制 SSH 服务的访问来源，仅允许可信 IP 连接，并检查 /var/log/auth.log 是否存在异常的堆损坏或进程崩溃迹象。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "OpenSSH 远程代码执行漏洞"
updated = "2026-06-16T22:02:39Z"

