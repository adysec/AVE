[basic]
description = "Linear eMerge E3 系列门禁控制设备存在操作系统命令注入漏洞，未经身份认证的远程攻击者可通过向设备 Web 管理接口发送特制的 HTTP 请求，在输入参数中注入恶意系统命令，从而以 root 权限在目标设备上执行任意命令。该漏洞影响 eMerge E3 1.00-06 及之前版本，CVSS 评分 9.8，危害等级严重。攻击者无需任何认证即可利用，成功利用后可完全控制设备，进而窃取门禁数据、修改权限或作为跳板攻击内网。目前已公开完整的利用代码。"
published = "2019-07-02T19:15:11Z"
remediation = "立即将 Linear eMerge E3-Series 固件升级至厂商提供的最新版本（高于 1.00-06），具体固件包请联系厂商 Nortek/Nice 获取。如无法立即升级，应采取以下临时缓解措施：1）将设备从互联网断开，仅允许内网访问；2）在防火墙侧限制对设备 Web 管理端口（80/443）和 SSH 端口的访问，仅允许受信任的管理 IP；3）修改设备默认管理员密码和默认 IP 地址；4）如需远程管理，必须通过 VPN 接入内网后再访问设备。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Linear eMerge E3系列 命令注入漏洞"
