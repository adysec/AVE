[basic]
description = "Sophos SG UTM 的 WebAdmin 组件存在 OS 命令注入漏洞，未经身份认证的远程攻击者可通过向目标设备的 WebAdmin 管理界面发送特制请求触发该漏洞，成功利用可在目标系统上以 root 权限执行任意命令，完全控制受影响设备。该漏洞影响 Sophos SG UTM v9.705 MR5 之前版本、v9.607 MR7 之前版本及 v9.511 MR11 之前版本，CVSS 评分 9.8，危害等级严重。Sophos 已发布安全更新修复此漏洞。"
published = "2020-09-25T04:23:04.857"
remediation = "立即升级 Sophos SG UTM 至 v9.705 MR5、v9.607 MR7 或 v9.511 MR11 及以上版本。如无法立即打补丁，可在防火墙上限制对 WebAdmin 管理界面（默认端口 8044）的访问来源 IP，仅允许受信任的管理员 IP 段连接，并禁用公网暴露。该漏洞已被 CISA 列入已知被利用漏洞目录，应优先处置。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Sophos SG UTM 远程代码执行漏洞"
updated = "2026-06-17T03:06:37.003"

