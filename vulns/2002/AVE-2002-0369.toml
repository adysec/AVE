[basic]
description = "Microsoft SQL Server 2000 及 MSDE 2000 的 Resolution Service 存在堆缓冲区溢出漏洞。该服务监听 UDP 1434 端口，远程攻击者无需认证即可发送特制 UDP 数据包触发溢出：当数据包首字节为 0x04 时，SQL Monitor 线程会生成超长注册表键名导致缓冲区溢出；当首字节为 0x08 时，超长字符串可导致堆破坏。Slammer/Sapphire 蠕虫曾利用此漏洞在全球大规模传播，造成严重网络瘫痪。攻击者成功利用后可导致服务拒绝或远程执行任意代码。"
published = "2002-08-12T04:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS02-039 对应补丁（SQL Server 2000 Service Pack 3 或更高版本），或通过 Windows Update 安装更新。如无法立即打补丁，在防火墙或主机层面阻止 UDP 端口 1434 的入站流量，以阻断 Slammer 蠕虫利用途径。同时建议禁用 SQL Server Resolution Service 或在注册表中将 `SSRPEnabled` 设为 0 以关闭 UDP 监听。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft SQL Server 2000 Resolution Service 堆溢出漏洞"
updated = "2026-06-16T21:57:51Z"

