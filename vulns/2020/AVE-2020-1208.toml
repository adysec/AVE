[basic]
description = "PEAR Archive_Tar 组件在 1.4.10 及更早版本中存在路径遍历与文件覆盖漏洞。该组件仅对 phar 协议的 :// 文件名格式执行了清理过滤，未对其他 PHP 流包装器（如 file://）进行同等的合法性校验。未经身份认证的远程攻击者可通过构造包含 file:// 协议的恶意 TAR 文件名，覆盖目标系统上的任意文件。该漏洞影响所有使用受影响版本 Archive_Tar 处理用户上传或外部来源归档文件的 PHP 应用程序，CVSS 评分 7.8，危害等级高。"
published = "2020-11-19T19:15:11.937"
remediation = "建议升级 Pear Archive_Tar 库到 1.4.11 或更高版本，该版本修复了 stream-wrapper 攻击的路径穿越漏洞；如果无法立即更新，可通过设置 allow_url_fopen=false 禁用 file:// 等不安全流类型作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "PHP PEAR Archive_Tar 任意文件覆盖漏洞"
updated = "2026-06-17T03:10:53.810"

