[basic]
description = "Cisco RV132W ADSL2+ Wireless-N VPN 路由器和 RV134W VDSL2 Wireless-AC VPN 路由器的 Web 管理界面存在输入验证不完整漏洞（CWE-20）。未经身份认证的远程攻击者可通过向目标设备发送特制的 HTTP 请求触发该漏洞，成功利用后可实现以 root 权限执行任意代码，完全控制受影响系统，或导致设备重启造成拒绝服务。该漏洞影响运行固件版本 1.0.1.11 之前的所有 RV132W 和 RV134W 路由器，CVSS 评分 9.8，危害等级严重。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），Cisco 已在固件版本 1.0.1.11 中修复。"
published = "2018-02-08T07:29:00Z"
remediation = "立即将 Cisco RV132W 和 RV134W 路由器固件升级至 1.0.1.11 版本，固件可从 Cisco.com Software Center（产品路径：Routers > Small Business Routers > Small Business RV Series Routers）下载。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），无临时缓解措施，必须升级固件彻底修复。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Cisco RV132W/RV134W 路由器远程命令执行漏洞"
updated = "2026-06-17T01:29:37Z"

