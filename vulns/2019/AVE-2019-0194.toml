[basic]
description = "Genie Access WIP3BVAF WISH IP 3MP IR Auto Focus Bullet Camera 设备的 Web 管理界面存在目录遍历漏洞（CWE-22）。由于未对用户输入进行充分验证，未经身份认证的远程攻击者可通过发送包含路径遍历序列（如 ../）的特制 HTTP 请求，绕过访问控制读取服务器上的任意文件，例如 /etc/shadow 等敏感系统文件，导致敏感信息泄露。该漏洞影响该产品 3.x 及更早版本的固件，且该产品已停产，最终固件版本仍存在此漏洞。攻击者只需能够网络访问目标设备的 Web 界面即可发起利用，无需身份验证、无需用户交互，利用门槛较低，CVSS 评分 7.5，危害等级高。"
published = "2019-06-17T19:15:11Z"
remediation = "由于该产品已停产且最终固件版本仍存在漏洞，建议立即将设备从互联网断开或隔离至独立 VLAN，仅允许受信任 IP 访问管理界面，并在边界防火墙部署规则过滤包含 `../` 的目录遍历攻击载荷。同时应持续监控设备访问日志，如发现异常读取请求应立即封禁源 IP，并计划更换为 Genie Access 现行受支持产品线。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Genie Access WIP3BVAF 目录遍历漏洞"
updated = "2026-06-17T02:40:26Z"

