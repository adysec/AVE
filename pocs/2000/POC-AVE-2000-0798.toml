[info]
author = "ave"
description = "验证 Microsoft Windows 2000 索引服务中 ixsso.query ActiveX 控件被错误标记为可安全执行脚本，远程攻击者可通过构造恶意网页，利用该控件探测目标系统上指定文件是否存在"
id = "POC-AVE-2000-0798"
name = "Microsoft Windows 2000 Indexing Service ixsso.query ActiveX File Existence Verification PoC"
severity = "medium"
tags = ["ave-2000-0798"]
vuln_id = [
    "CVE-2000-1105",
    "AVE-2000-0798",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["ixsso"]
