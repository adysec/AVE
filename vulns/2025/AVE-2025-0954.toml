[basic]
description = "Linux内核libata-sff驱动程序存在缓冲区越界写入漏洞。ATA设备在处理SCSI_IOCTL_SEND_COMMAND ioctl调用时，当out_len参数设为0xd42且ATA命令为ATA_NOP时，ata_pio_sector()函数未能正确验证写入边界，导致数据写入到分配缓冲区之外的内存区域，覆盖随机内存内容。本地低权限攻击者可利用此漏洞实现内核内存破坏，进而提升权限或导致系统崩溃。该漏洞影响使用受影响Linux内核版本的系统，CVSS评分为7.8（高危）。"
published = "2025-02-27T03:15:14.427"
remediation = "升级 Linux 内核至已修复版本：Red Hat Enterprise Linux 9 用户更新至 kernel-5.14.0-611.5.1.el9_7（RHSA-2025:20518），SUSE Linux Enterprise Server 12 用户更新至 kernel 4.12.14-122.290（SUSE-SU-2026:0967-1）。执行 yum update kernel 或 zypper update kernel 完成更新后重启系统生效。若无法立即升级，可在 GRUB 启动参数中添加 libata.allow_tape=0 临时禁用 ATA 透传功能以降低攻击面。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux内核 libata-sff 缓冲区越界写入漏洞"
updated = "2026-07-30T06:21:21.990"

