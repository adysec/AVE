[basic]
description = "Apple QuickTime 在处理 FLIC 格式电影文件时存在缓冲区溢出漏洞（CWE-119）。该漏洞影响 Mac OS X 10.7.2 之前版本及 Windows 平台上的 QuickTime 7.7.1 之前版本。未经身份认证的远程攻击者可通过诱使用户打开或访问特制 FLIC 格式电影文件触发此漏洞，成功利用可导致远程任意代码执行或应用程序崩溃拒绝服务。由于攻击需要用户交互（打开恶意文件），攻击复杂度为中等，但利用后果严重。"
published = "2011-10-14T10:55:09Z"
remediation = "建议将 Mac OS X 升级至 10.7.2 或更高版本，并安装 Security Update 2011-006；同时将 QuickTime 升级至 7.7.1 或更高版本以修复 FLIC 文件处理的缓冲区溢出漏洞。如无法立即升级，应避免打开来历不明的 FLIC 格式电影文件作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple QuickTime FLIC文件处理缓冲区溢出漏洞"
updated = "2026-06-16T23:32:54Z"

