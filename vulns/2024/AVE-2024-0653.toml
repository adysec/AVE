[basic]
description = "libarchive 在处理 TAR 归档文件时，`archive_read_support_format_tar.c` 中的 `header_gnu_longlink` 函数存在堆缓冲区越界读取漏洞。当 TAR 文件中包含被截断的 GNU 长链接名（long linkname）时，解析逻辑未能正确处理截断边界，导致读取超出分配堆缓冲区范围的数据。本地攻击者可通过诱使用户解压特制的 TAR 归档文件触发该漏洞，造成进程崩溃或敏感信息泄露。该漏洞影响 libarchive 3.7.7 及之前版本，CVSS 评分 4.0，危害等级中危。"
published = "2025-02-16T04:15:21Z"
remediation = "建议立即将 libarchive 升级至 3.8.5 及以上版本（该版本包含 PR #2422 的修复，于 2024 年 12 月 10 日合入主线）。各发行版用户请通过官方包管理器更新：Debian/Ubuntu 执行 apt update && apt upgrade libarchive，RHEL/CentOS 执行 yum update libarchive，Alpine 执行 apk upgrade libarchive。如无法立即升级，应避免使用 bsdtar 或 libarchive 解析不受信的 TAR 归档文件，并在应用层面对输入文件进行校验。"
score = 4
severity = "MEDIUM"
sources = ["msrc"]
title = "libarchive TAR 解析堆缓冲区越界读取漏洞"
updated = "2026-06-17T08:14:20Z"

