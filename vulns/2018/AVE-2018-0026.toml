[basic]
description = "Sympa 6.2.16 及更高版本在 `wwsympa.fcgi` 登录操作的 `referer` 参数中存在 URL 重定向漏洞（CWE-601）。攻击者可以通过构造包含恶意 Data URI 的特制链接，诱导受害者访问，从而实现开放重定向以及反射型跨站脚本（XSS）攻击。该漏洞影响所有使用受影响版本的 Sympa 实例，攻击条件为受害者必须点击并跳转攻击者提供的 URL。利用此漏洞可导致受害者浏览器执行恶意脚本或被引导至钓鱼网站，从而窃取敏感信息或接管用户会话。"
published = "2018-09-06T18:29:00Z"
remediation = "建议升级 Sympa 至最新稳定版本以获取安全修复。如无法立即升级，可通过修改 wwsympa.fcgi 源代码，对 referer 参数实施严格的白名单校验，仅允许重定向至信任的本站域名，从而根治开放重定向与反射型 XSS 漏洞。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Sympa 邮件列表管理系统 开放重定向与反射型跨站脚本漏洞"
updated = "2026-06-17T01:33:04Z"

