[basic]
description = "RealNetworks RealPlayer 的 RV40 编解码器存在未指定的远程代码执行漏洞。攻击者可通过向用户发送特制的 RV40 RealVideo 视频流文件，诱导用户使用受影响版本的 RealPlayer 打开该恶意媒体文件，从而触发该漏洞。成功利用此漏洞可导致远程代码执行，完全控制目标系统。该漏洞影响 RealPlayer 11.x、14.x、15.x 及 RealPlayer SP 1.0~1.1.5 等多个版本，CVSS 评分 9.3，危害等级严重。用户应升级至 RealPlayer 15.0.2.71 及以上版本以修复此漏洞。"
published = "2012-02-08T15:55:00Z"
remediation = "立即升级 RealPlayer 至 15.0.2.72 或更高版本，该版本修复了 RV40 编解码器中的远程代码执行漏洞。如无法升级，建议卸载 RealPlayer 或使用防火墙阻止程序出站连接，并避免在浏览器中打开来自不可信来源的 RealMedia 媒体文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer RV40编解码器远程代码执行漏洞"
updated = "2026-06-16T23:38:31Z"

