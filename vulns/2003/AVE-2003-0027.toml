[basic]
description = "Apache HTTP Server 1.3.25之前版本及2.0.46之前版本的访问日志未对终端转义序列进行过滤处理，远程攻击者可通过向服务器发送包含恶意转义序列的HTTP请求，当管理员使用存在转义序列相关漏洞的终端模拟器查看日志时，这些序列会被终端模拟器解析执行，可能导致终端命令注入或信息泄露。该漏洞利用需要管理员主动查看日志文件，属于间接攻击方式，CVSS评分5.0，危害等级中等。"
published = "2003-04-02T05:00:00Z"
remediation = "升级 Apache HTTP Server 至 1.3.26 及以上版本（1.3 分支）或 2.0.46 及以上版本（2.0 分支）。如无法立即升级，可在访问日志处理管道中添加日志清洗工具（如 cat -v 或 sed 过滤转义序列），避免使用存在终端转义序列漏洞的终端模拟器查看日志。同时限制日志文件的访问权限，防止攻击者写入恶意日志条目。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Apache HTTP Server 日志终端转义序列注入漏洞"
updated = "2026-06-16T22:01:29Z"

