[info]
author = "ave"
description = "Phorum 3.0.7 管理后台 Master Settings 功能中 .langfile 参数存在目录遍历漏洞，远程管理员可通过插入 ../ 序列读取服务器任意文件。发送包含目录遍历 payload 的请求至 admin.php3，若响应中包含目标文件内容则验证漏洞存在。"
id = "POC-AVE-2000-1158"
name = "Phorum 3.0.7 目录遍历 PoC"
severity = "medium"
tags = ["ave-2000-1158"]
vuln_id = [
    "CVE-2000-1229",
    "AVE-2000-1158",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/admin.php3"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "root:",
    "bin:",
    "daemon:",
]
