[basic]
description = "Texas Imperial Software WFTPD 2.4.1 及 WFTPD Pro 2.41 存在拒绝服务漏洞。远程攻击者无需身份认证即可利用该漏洞，通过在 LIST 命令仍在执行时发送特制的 STAT 命令，导致 FTP 服务进程崩溃，造成服务不可用。该漏洞攻击复杂度低，无需任何权限，仅影响系统可用性。公开的 PoC 代码已在 ExploitDB 发布，可被直接用于攻击。"
published = "2000-07-21T04:00:00Z"
remediation = "升级至 WFTPD 2.4.1 RC11 或更高版本可修复此漏洞。由于 WFTPD 已长期停止维护，建议迁移至 FileZilla Server 或 vsftpd 等仍在更新的 FTP 服务器软件。临时缓解措施：在防火墙上限制仅允许可信 IP 访问 FTP 端口 21，并禁用匿名用户执行 STAT 命令的权限。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Texas Imperial Software WFTPD STAT/LIST 命令拒绝服务漏洞"
updated = "2026-06-16T21:52:10Z"

