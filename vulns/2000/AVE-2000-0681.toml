[basic]
description = "Pegasus Mail 3.12 存在任意文件读取漏洞。远程攻击者可通过向目标用户发送包含特制 mailto: 协议 URL 的邮件，并在 URL 中添加 -F 开关参数，诱使用户点击该链接后即可读取目标系统上的任意文件。该漏洞影响 Pegasus Mail 3.12 版本，攻击者无需身份认证即可远程利用，危害中等。由于该漏洞可导致敏感信息泄露，建议用户升级至更高版本或禁用 mailto: 协议处理中的 -F 参数。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 Pegasus Mail 至 3.12a 或更高版本，该版本已修复 mailto: 协议 -F 参数允许读取任意文件的问题。如无法升级，可在浏览器中禁用 mailto: 协议处理程序，或配置防火墙/代理服务器过滤包含 mailto: -F 的恶意请求作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "David Harris Pegasus Mail 3.12 文件转发漏洞"
updated = "2026-06-16T21:52:47.510"

