[basic]
description = "BeOS r5 pro 及更早版本的浏览器 IRC 客户端存在拒绝服务漏洞。该漏洞的原理是程序在处理 URL 时缺乏有效的长度校验，远程攻击者可以通过向目标发送包含超长 URL 的特制消息，触发程序崩溃或资源耗尽，从而导致 IRC 客户端失效或系统服务中断。该漏洞影响 BeOS 早期版本，攻击者无需身份验证即可通过网络远程触发，造成拒绝服务影响。"
published = "2001-01-09T05:00:00.000"
remediation = "升级到 BeOS 后续兼容系统 Haiku 或更新版本；或卸载系统内置 IRC 客户端，改用外部独立 IRC 软件；如无法升级，可在防火墙或本地代理层拦截包含超长 URL 的 IRC 消息以临时缓解拒绝服务风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "BeOS Browser IRC Client 远程拒绝服务漏洞"
updated = "2026-06-16T21:53:16.157"

