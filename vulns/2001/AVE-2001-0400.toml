[basic]
description = "Opera 浏览器 6.0 及更早版本存在同源策略绕过漏洞。未经身份认证的远程攻击者可构造包含恶意 JavaScript 代码的网页，利用 setTimeout 方法在目标域名新窗口打开后访问其中数据，或通过 about:cache 页面读取缓存信息，从而窃取其他域名的敏感信息，包括用户 Cookie 和网站链接等。该漏洞只需用户使用受影响版本的 Opera 浏览器访问恶意页面即可触发，无需任何权限或交互操作，攻击者可借此实施会话劫持、隐私信息窃取等进一步攻击行为。"
published = "2001-11-15T05:00:00Z"
remediation = "建议立即升级至 Opera 7.0 或更高版本，该版本修复了同源策略绕过漏洞。如无法立即升级，可在浏览器设置中禁用 JavaScript 作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Opera 浏览器 同源策略绕过信息泄露漏洞"
updated = "2026-06-16T21:55:11Z"

