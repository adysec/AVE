[basic]
description = "Microsoft WebTV for Windows 系统中的 annclist.exe 组件存在拒绝服务漏洞。远程攻击者无需身份认证，只需向目标主机的 22701 至 22705 端口发送特制的大尺寸畸形 UDP 数据包，即可触发该组件崩溃，导致服务不可用。该漏洞影响 WebTV for Windows 98/ME 等版本，CVSS 评分 5.0，危害等级中等。Microsoft 未发布官方补丁，建议用户停止使用受影响组件或采取网络访问控制措施。"
published = "2000-11-14T05:00:00.000"
remediation = "立即安装 Microsoft 官方发布的 MS00-074 安全更新补丁：Windows 98/98SE 用户下载安装 274113USA8.EXE，Windows Me 用户下载安装 274113USAM.EXE。如无法安装补丁，可在防火墙中阻止外部对 UDP 端口 22701-22705 的入站访问作为临时缓解措施。注意 WebTV for Windows 默认未安装，未安装该组件的系统不受影响。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft WebTV for Windows 拒绝服务漏洞"
updated = "2026-06-16T21:52:33.350"

