[basic]
description = "Microsoft Internet Explorer 5.01和6.0版本存在Content-Disposition处理漏洞。该漏洞源于浏览器对Content-Disposition和Content-Type HTTP头字段的解析不当，当攻击者构造包含畸形头字段的恶意文件时，浏览器会将该文件传递给操作系统进行处理而非弹出错误提示，从而导致任意代码执行。远程攻击者可利用此漏洞通过诱导用户访问恶意网页或下载特制文件来执行任意代码，进而完全控制受影响系统。该漏洞影响Internet Explorer 5.01和6.0版本，CVSS评分7.5，危害等级为高危。Microsoft已发布安全补丁修复此漏洞，建议用户尽快升级IE版本或应用安全更新以消除风险。"
published = "2002-05-29T04:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS02-027 对应的安全补丁，或升级 Internet Explorer 至 6.0 SP1 以上版本。对于无法立即升级的环境，在 Internet 区域安全级别中禁用文件下载功能，或通过组策略禁用 Content-Disposition 头处理中的自动执行逻辑。建议最终迁移至受支持的现代浏览器。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer Content-Disposition处理不当任意代码执行漏洞"
updated = "2026-06-16T21:56:58Z"

