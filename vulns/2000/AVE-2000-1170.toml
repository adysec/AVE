[basic]
description = "Novell NetWare 5.1 SP3 及更早版本中的 FTP 服务器组件 NWFTPD.nlm（低于 5.01o 版本）存在拒绝服务漏洞。当远程已认证用户先发送 RNFR 命令并故意使其失败（如指定不存在的源文件路径），随后紧接着发送 RNTO 命令时，服务器未能正确恢复或清理前序命令失败后的内部状态，导致异常终止（abend）。攻击者需首先通过 FTP 身份认证，具备基本的 FTP 操作权限，在目标网络可达的前提下即可发起攻击，造成 FTP 服务中断，影响合法用户对文件传输服务的正常使用。该漏洞 CVSS 评分为 3.5，危害等级较低。"
published = "2010-04-05T15:30:00.467"
remediation = "升级 NWFTPD.nlm 到 5.01o 或更高版本，应用 Novell 发布的 NetWare 5.1 SP3 安全补丁包。如暂时无法升级，可关闭 FTP 服务或通过防火墙限制仅允许可信内网 IP 访问 21 端口，作为临时缓解措施。"
score = 3.5
severity = "LOW"
sources = ["epss"]
title = "Novell NetWare FTP 服务器拒绝服务漏洞"
updated = "2026-06-16T21:53:27.560"

