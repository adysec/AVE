[basic]
description = 'Linux 内核 x86/microcode/AMD 子系统中，load_microcode_amd() 函数在遍历 NUMA 节点并获取 CPU mask 时，未正确处理仅包含内存节点的 CPU-less NUMA 节点。当系统存在此类节点时，函数会尝试访问空 CPU mask 的"第一个 CPU"，导致 per-CPU 数据数组索引越界。该漏洞影响配备远存器的 AMD 服务器平台，攻击者需具有管理员权限才能触发微码刷新操作。成功利用可在内核边界检查（CONFIG_UBSAN_BOUNDS）启用时触发数组越界错误，导致内存损坏或系统崩溃，影响系统可靠性。该漏洞已被修复，CVSS 评分为 7.8。'
published = "2025-04-02T13:15:43Z"
remediation = "建议立即升级 Linux 内核至以下修复版本之一：5.4.292、5.10.236、5.15.180、6.1.132、6.6.84、6.12.20 或 6.13.8 及以上版本，以修复 x86/microcode/AMD 驱动在含 CPU-less NUMA 节点系统上加载微码时的越界访问问题。可通过发行版官方仓库执行内核更新（如 Ubuntu 执行 apt install linux-image-generic、RHEL 执行 dnf update kernel），或使用包管理器自动安装安全更新。如当前无法立即升级内核，可将 CONFIG_UBSAN_BOUNDS 内核配置项设为 n 以关闭边界检查缓解内核崩溃风险，但该漏洞仍可能在某些 AMD 平台上刷新微码时引发内存损坏，建议优先完成内核升级。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 AMD 微码处理模块数组越界漏洞"
updated = "2026-06-17T08:44:47Z"

