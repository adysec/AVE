[info]
author = "ave"
description = "验证目标 Oops! WWW 代理服务器 1.4.6 版本是否存在堆缓冲区溢出漏洞。该漏洞在反向 DNS 查询阶段，当攻击者控制的反向解析主机名超过缓冲区大小时触发堆溢出，未经认证的远程攻击者可执行任意系统命令并完全控制服务器。"
id = "POC-AVE-2001-0015"
name = "CVE-2001-0029 PoC"
severity = "critical"
tags = ["ave-2001-0015"]
vuln_id = [
    "CVE-2001-0029",
    "AVE-2001-0015",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Oops"]
