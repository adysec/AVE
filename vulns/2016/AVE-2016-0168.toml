[basic]
description = "D-Link DSL-2750B 路由器固件版本 1.05 之前存在命令注入漏洞，攻击者无需身份认证即可通过向 login.cgi 页面的 cli 参数发送特制 HTTP 请求，在设备上以 root 权限执行任意系统命令。该漏洞影响所有 DSL-2750B 设备，自 2016 年至 2022 年间被广泛利用于野外攻击，CVSS 评分 9.8，危害等级严重。厂商至今未发布官方补丁，建议用户更换受影响的设备或通过防火墙限制对设备管理端口的访问。"
published = "2022-10-19T05:15:08Z"
remediation = "立即将 DSL-2750B 固件升级至 EU v1.05 或更高版本。升级前请检查设备底部标签确认硬件版本（仅 Dx 版本受影响），登录设备 Web 管理界面后通过系统升级功能上传对应固件。如设备已停产或无法获取官方固件，建议立即停止使用该设备并更换为受支持的型号，同时在网络边界防火墙中阻断对路由器 Web 管理端口（80/443）的未授权外部访问作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "D-Link DSL-2750B 命令注入漏洞"
updated = "2026-06-17T00:43:05Z"

