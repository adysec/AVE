[basic]
description = "Netgear 多款无线网络设备（包括 WN604、WN802Tv2、WNAP210v2、WNAP320、WNDAP350、WNDAP360、WNDAP660）的 boardData 系列 PHP 页面（boardData102.php、boardData103.php、boardDataJP.php、boardDataNA.php、boardDataWW.php）存在命令注入漏洞。未经身份认证的远程攻击者可通过向上述页面发送特制的 HTTP 请求，利用设备未对用户输入进行有效过滤的缺陷，在设备上以 root 权限执行任意命令。该漏洞 CVSS 评分 9.8，危害等级严重，且已有 Metasploit 公开利用模块，攻击门槛极低。厂商已在固件版本 WN604 v3.3.3 及其他设备 v3.5.5.0 中修复。"
published = "2017-04-21T15:59:00.333"
remediation = "将 WN604 固件升级至 3.3.3 及以上版本；将 WN802Tv2、WNAP210v2、WNAP320、WNDAP350、WNDAP360、WNDAP660 固件升级至 3.5.5.0 及以上版本。如无法立即升级，在受影响设备的管理界面禁用远程管理功能，并在网络边界防火墙限制对 80/443 端口的非信任来源访问。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Netgear 多款无线设备 boardData.php 未授权远程命令执行漏洞"
updated = "2026-06-17T00:42:09.427"

