[basic]
description = "Microsoft Excel 存在释放后使用（Use-After-Free）漏洞，CWE-416。攻击者可通过诱导用户打开特制的 Excel 文件触发该漏洞，成功利用可在当前用户上下文中执行任意代码，实现完全控制受影响的系统。该漏洞影响 Microsoft Excel 2016/2019/2021、Microsoft 365 Apps 及 Microsoft Office for Mac 等多个版本，CVSS 评分 7.8，危害等级高。攻击需用户交互（打开恶意文件），无法远程直接利用。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:37.157"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新（KB5002712 或对应 Office 版本更新），通过 Microsoft Update 或 Windows Update 自动获取。对于 Microsoft Office for Mac，通过 AutoUpdate 或手动下载安装 16.94.25021027 及以上版本。无法立即更新的情况下，建议禁用 Excel 中来自不受信任来源的 OLE 对象和 ActiveX 控件，并启用受保护视图。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Excel 远程代码执行漏洞"
updated = "2026-06-17T08:43:15.260"

