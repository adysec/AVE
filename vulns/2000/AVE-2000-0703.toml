[basic]
description = "HP-UX 11.00 及 10.20 版本的 crontab 命令存在符号链接跟踪漏洞。由于 crontab 的 -e 编辑选项未对临时文件进行安全验证，本地低权限用户可在编辑会话期间创建指向任意系统文件的符号链接，待退出会话后通过读取 crontab 生成错误消息时回显的内容，从而获取敏感文件信息。该漏洞利用条件简单，仅需本地登录权限即可完成，无需用户交互，攻击者可借此读取密码文件等高权限数据，造成严重信息泄露。"
published = "2000-12-19T05:00:00.000"
remediation = "升级至 HP-UX 11.00 PHNE_21465 或 PHNE_22185 补丁版本，或升级至 HP-UX 11i v1/v2 后续版本。临时缓解：限制 crontab 命令权限（chmod 750 /usr/bin/crontab），仅允许 root 和 cron 组用户执行，并审计 /var/spool/cron/crontabs 目录权限防止符号链接攻击。"
score = 5.5
severity = "MEDIUM"
sources = ["epss"]
title = "HP-UX crontab 符号链接文件覆盖漏洞"
updated = "2026-06-16T21:52:53.140"

