[basic]
description = "Apple Safari 浏览器所采用的 WebKit 引擎在处理 SVG 文档中的 font-face 和 use 元素时存在释放后使用漏洞。远程攻击者可通过构造包含恶意 SVG 元素的网页诱导用户访问，触发内存释放后继续引用，导致应用程序崩溃或远程执行任意代码，从而完全控制受害者系统。该漏洞影响 Mac OS X 10.4 至 10.6 及 Windows 平台上的 Safari 4.1.1/5.0.1 之前版本，以及 webkitgtk 1.2.6 之前版本，CVSS 评分高达 9.3，危害等级严重。攻击者无需身份认证即可在用户正常浏览网页时完成利用，造成信息泄露、系统沦陷等严重后果。"
published = "2010-07-30T20:30:02Z"
remediation = 'Mac 用户请通过"系统偏好设置 → 软件更新"升级 Safari 至 5.0.1（Mac OS X 10.5/10.6 及 Windows）或 4.1.1（Mac OS X 10.4），或安装对应 Apple 安全更新；Linux 用户请将 webkitgtk/libwebkit-1.0-2 升级至 1.2.6 及以上版本（Ubuntu/Debian 执行 apt-get install --only-upgrade libwebkit-1.0-2，RHEL/Fedora 执行 dnf update webkitgtk），更新后重启所有使用 WebKit 的应用。临时缓解措施：避免访问不受信任的网站，如无法立即打补丁，可在浏览器中禁用 SVG 内容渲染或使用非 WebKit 内核浏览器。本漏洞已被利用制作远程代码执行攻击，建议尽快修复。'
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit SVG 元素 use-after-free 远程代码执行漏洞"
updated = "2026-06-16T23:19:21Z"

