[basic]
description = "Oracle WebLogic Server 的 T3 协议存在反序列化安全漏洞。T3 协议是 WebLogic 用于 Java RMI 通信的专有协议，默认监听 7001 端口。未经身份认证的远程攻击者可通过向目标 WebLogic 服务器发送精心构造的恶意序列化数据包，触发 T3 协议在处理反序列化操作时的安全缺陷，从而在目标服务器上执行任意代码，完全控制服务器。该漏洞影响 Oracle Fusion Middleware 10.3.6.0、12.1.3.0 及 12.2.1.0 版本，CVSS 评分 9.8，危害等级严重。攻击无需任何认证或用户交互，仅需目标开放 T3 端口即可远程利用。"
published = "2016-07-21T10:13:03Z"
remediation = "立即安装 Oracle 2016 年 7 月关键补丁更新 (CPU July 2016)，通过 My Oracle Support 获取对应 WebLogic 版本的补丁包并部署。受影响版本包括 10.3.6.0、12.1.3.0 和 12.2.1.0。如无法立即打补丁，可在 WebLogic 控制台禁用 T3 协议（将 `weblogic.security.SSL.enableT3` 设为 false），或在网络防火墙层面封禁 T3 默认端口 7001 的入站连接作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Oracle WebLogic Server T3协议反序列化远程代码执行漏洞"
updated = "2026-06-17T00:45:51Z"

