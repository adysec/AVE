[basic]
description = "Fetchmail 6.0.0 及之前版本存在缓冲区溢出漏洞，远程攻击者可通过向邮件服务器发送特制的超长邮件头（readheaders 函数处理不当）或超长 Received: 头（parse_received 函数解析不当）触发缓冲区溢出，导致目标服务崩溃（拒绝服务）或执行任意代码。该漏洞影响 Fetchmail 全线旧版本，CVSS 评分 7.5，危害等级高。"
published = "2002-10-11T04:00:00Z"
remediation = "立即将 Fetchmail 升级至 6.1.0 及以上版本。Debian Woody 用户应升级至 5.9.11-6.1，Potato 用户升级至 5.3.3-4.2；Red Hat 用户安装 RHSA-2002:215 提供的更新包；Mandrake 用户安装 MDKSA-2002:063 更新。如无法升级，避免在 multidrop 模式下运行 fetchmail，并在邮件服务器上限制入站邮件头长度以降低攻击面。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Fetchmail 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:58:52Z"

