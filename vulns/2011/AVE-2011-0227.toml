[basic]
description = "Mozilla Firefox 和 Thunderbird 在处理 Shift-JIS 编码时存在跨站脚本（XSS）漏洞。由于对编码中特定无效序列的处理不当，远程攻击者可通过构造特制的 Shift-JIS 编码文本，诱使用户访问恶意页面，从而在用户浏览器中注入并执行任意 HTML 或 JavaScript 脚本。该漏洞影响 Firefox 3.6.24 之前版本及 4.x 至 7.0 版本、Thunderbird 3.1.6 之前版本及 5.0 至 7.0 版本，攻击者需诱导用户访问恶意构造的链接或页面，利用条件较为有限，危害等级为中危。"
published = "2011-11-09T11:55:03Z"
remediation = "升级 Firefox 至 3.6.24 或 8.0 及以上版本，Thunderbird 升级至 3.1.16 或 8.0 及以上版本，SeaMonkey 升级至 2.5 及以上版本。如无法立即升级，可在 Web 应用层对用户输入进行 Shift_JIS 编码校验，过滤非法的多字节序列，并设置 Content-Type 为 UTF-8 以降低 XSS 风险。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox 和 Thunderbird Shift JIS 编码跨站脚本漏洞"
updated = "2026-06-16T23:33:41Z"

