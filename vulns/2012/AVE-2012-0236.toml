[basic]
description = "Mozilla Firefox、Firefox ESR、Thunderbird、Thunderbird ESR 及 SeaMonkey 的 nsObjectLoadingContent::LoadObject 函数存在释放后使用（Use-after-free）漏洞，属于 CWE-416 类型的内存破坏缺陷。由于对象加载过程中对已释放内存的引用处理不当，远程攻击者可构造特制的网页或内容，诱导用户通过浏览器、邮件客户端等打开后触发该漏洞，造成堆内存破坏，进而导致拒绝服务或执行任意代码，完全控制受影响系统。该漏洞影响 Firefox 15.0 之前版本、Firefox ESR 10.0.7 之前版本、Thunderbird 15.0 之前版本、Thunderbird ESR 10.0.7 之前版本及 SeaMonkey 2.12 之前版本，攻击无需认证且利用难度较低，CVSS v2 评分高达 10.0，危害严重。Mozilla 已于 2012 年 8 月的安全更新中发布修复，建议用户升级至安全版本。"
published = "2012-08-29T10:56:39Z"
remediation = "该漏洞为 Mozilla Firefox、Thunderbird 与 SeaMonkey 中 nsObjectLoadingContent::LoadObject 函数的释放后使用（Use-After-Free）漏洞，可导致任意代码执行或拒绝服务。建议立即将 Mozilla Firefox 升级到 15.0 及以上版本、Firefox ESR 升级到 10.0.7 及以上版本，Thunderbird 升级到 15.0 及以上版本、Thunderbird ESR 升级到 10.0.7 及以上版本，SeaMonkey 升级到 2.12 及以上版本；可通过官方下载页获取最新安装包替换旧版本，或在受管环境中通过组策略推送升级。如暂时无法升级，可在安全策略层面限制用户仅访问受信任网站，禁止打开来历不明的 HTML 邮件及外部链接，并启用浏览器自动更新功能以便及时获取补丁，同时监控浏览器进程异常崩溃行为。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 释放后使用远程代码执行漏洞"
updated = "2026-06-16T23:40:42Z"

