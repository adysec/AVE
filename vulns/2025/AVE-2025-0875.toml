[basic]
description = "Azure AI Face Service 存在身份伪造绕过认证漏洞（CWE-290），已获得授权的攻击者可通过网络向目标服务发送特制的伪造身份认证请求，绕过服务端的身份验证机制，实现权限提升。该漏洞影响 Microsoft Azure AI Face Service 云服务，攻击者无需用户交互即可远程利用，CVSS 评分 9.9，可导致机密性、完整性和可用性全面受损，危害等级严重。"
published = "2025-01-29T23:15:33Z"
remediation = "Azure AI Face Service 为 Microsoft 独家托管云服务，Microsoft 已在服务端自动完成修复，用户无需手动操作即可获得保护。建议用户确认已使用最新版本的 Azure AI Face Service REST API（2024-02-01 或更高版本），并在客户端应用中实施额外的身份验证校验，如令牌签名验证和请求来源 IP 白名单，以降低欺骗攻击风险。"
score = 9.9
severity = "CRITICAL"
sources = ["msrc"]
title = "Microsoft Azure AI Face Service 身份认证绕过权限提升漏洞"
updated = "2026-06-17T08:43:18Z"

