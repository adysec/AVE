[basic]
description = "ISC BIND 9.8.x 版本在启用递归查询并配置响应策略区域（RPZ）包含 DNAME 或特定 CNAME 记录时，存在拒绝服务漏洞。远程攻击者可发送特制 DNS 查询请求，触发 named 守护进程崩溃，导致 DNS 服务中断。影响范围为 BIND 9.8.0、9.8.0-P1、9.8.0-P2 和 9.8.1b1 版本，攻击条件要求目标服务器同时开启递归功能并部署 RPZ 策略。该漏洞 CVSS 评分 2.6（低危），ISC 已在 9.8.0-P3 版本中修复。"
published = "2011-07-08T20:55:00Z"
remediation = "建议立即升级 ISC BIND 至 9.8.0-P3 或更高版本（如 9.8.1-P1、9.9.0 等），可从 ISC 官网下载补丁包。若暂时无法升级，可通过修改 named.conf 禁用递归查询（设置 recursion no;）或移除 Response Policy Zones (RPZ) 配置（删除 response-policy 语句）作为临时缓解措施。同时建议在防火墙层面限制 DNS 服务仅对受信网段开放，减少攻击面。"
score = 2.6
severity = "LOW"
sources = ["tenable"]
title = "ISC BIND 9 RPZ 拒绝服务漏洞"
updated = "2026-06-16T23:31:23Z"

