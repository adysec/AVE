[basic]
description = "Netscape Communicator 和 Navigator 4.75 及更早版本的 HTML 解析器存在缓冲区溢出漏洞。该漏洞的成因是 HTML 解析器在处理表单字段时，未对 password 输入框的值进行长度校验，导致远程攻击者可通过构造超长的密码值触发缓冲区溢出，进而执行任意系统命令。受影响的产品包括 Netscape Communicator 和 Navigator 浏览器系列版本。攻击者无需身份认证即可通过网络远程发起攻击，攻击复杂度较低。成功利用该漏洞后，攻击者可获得与浏览器用户相当的系统权限，造成机密性、完整性和可用性的全面损害。该漏洞 CVSS 评分为 7.5，危害等级为高危。用户应升级至 Netscape 后续安全版本以修复此漏洞。"
published = "2001-01-09T05:00:00Z"
remediation = "立即将 Netscape Communicator/Navigator 升级至 4.76 或更高版本，该版本已修复 HTML 解析器中的缓冲区溢出问题。如无法立即升级，可在浏览器配置中禁用 JavaScript 或限制表单密码字段的最大长度作为临时缓解措施，同时避免访问不受信任的网页表单。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Netscape Navigator 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:20Z"

