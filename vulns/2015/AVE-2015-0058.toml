[basic]
description = "Kentico CMS 8.2至8.2.41版本的CMSPages/GetDocLink.ashx页面存在开放重定向漏洞。远程攻击者无需身份认证，通过向link参数传入恶意URL即可将用户重定向至任意外部网站，进而实施钓鱼攻击窃取用户凭证。该漏洞利用方式简单，攻击者可通过邮件或社交工程诱导用户点击特制链接，危害较大。"
published = "2015-10-21T15:59:02Z"
remediation = "升级 Kentico CMS 至 8.2.42 或更高版本，该漏洞已在后续热修复中修复。如无法立即升级，在 Web 服务器（IIS）层面配置 URL 重写规则，对 CMSPages/GetDocLink.ashx 的 link 参数进行白名单校验，仅允许可信域名，防止开放重定向被用于钓鱼攻击。"
score = 5.8
severity = "MEDIUM"
sources = ["nuclei"]
title = "Kentico CMS 开放重定向漏洞"
updated = "2026-06-17T00:33:12Z"

