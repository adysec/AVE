[basic]
description = "Windows NT 4.0 和 Windows 2000 系统的 SMB 协议实现存在拒绝服务漏洞。远程攻击者无需身份认证即可向目标主机的 SMB 服务发送大量 SMBnegprots（SMB 协商协议）请求，且不读取服务器返回的响应数据，导致服务器端 SMB 连接资源被耗尽，无法处理新的合法连接请求，造成拒绝服务。该漏洞利用方式简单，仅需发送特制网络数据包即可触发，影响范围包括 Windows NT 4.0 和 Windows 2000 系统。"
published = "2000-12-31T05:00:00Z"
remediation = '安装 Windows 2000 Service Pack 4 或 Windows NT 4.0 Service Pack 6a 以修复 SMB 协议栈中的拒绝服务缺陷。如无法安装补丁，在边界防火墙上阻止 TCP 端口 139 和 445 的入站流量，或通过注册表禁用 SMB 服务（HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanServer\Start 设为 4）作为临时缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows NT 4.0/2000 SMB 拒绝服务漏洞"
updated = "2026-06-16T21:53:25Z"

