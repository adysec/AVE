[basic]
description = "KDE 2.2.2 及更早版本中的 Konqueror Embedded 组件未对 X.509 数字证书的通用名称（CN）字段进行有效性验证，导致未经身份认证的远程攻击者可通过中间人攻击方式伪造合法网站的 SSL/TLS 证书。当用户访问使用 HTTPS 加密的网站时，攻击者可拦截并篡改通信内容，窃取敏感数据或重定向至恶意站点，且用户无法察觉证书异常。该漏洞影响 KDE 2.2.2 及之前所有版本中的 Konqueror 嵌入式浏览器组件，CVSS 评分 7.5，危害等级为高。KDE 开发团队已在后续版本中修复此证书验证缺陷，建议用户升级至 KDE 2.2.3 或更高版本以消除安全隐患。"
published = "2003-06-16T04:00:00.000"
remediation = "建议立即升级 KDE 至 3.0.5a 或 3.1.2 及以上版本（KDE 3.0 起不受影响）；无法升级 KDE 2.2.2 的用户可应用官方补丁 post-2.2.2-kdelibs-kssl-2.diff 和 post-2.2.2-kdelibs-kio-2.diff（下载地址 ftp://ftp.kde.org/pub/kde/security_patches）。Konqueror/Embedded 用户应升级至 2003 年 5 月 16 日之后快照版本。Red Hat Linux 用户安装 RHSA-2003:192/RHSA-2003:193 更新，Debian 用户安装 DSA-361 更新，TurboLinux 用户安装 TLSA-2003:36 更新。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "KDE Konqueror Embedded X.509证书CN字段未验证中间人攻击漏洞"
updated = "2026-06-16T22:02:05.020"

