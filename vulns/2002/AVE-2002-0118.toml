[basic]
description = "Bugzilla 2.14.1 之前版本存在多处 SQL 注入漏洞，远程攻击者无需身份认证即可通过以下途径利用：向 buglist.cgi 的 sql 参数或 boolean chart 查询中的无效字段名注入恶意 SQL 代码、向 userprefs.cgi 的 mybugslink 参数注入、向 long_list.cgi 的 buglist 参数传入畸形漏洞 ID、以及向 editusers.cgi 的 value 参数注入以修改 groupset 权限。成功利用可导致数据库信息泄露、任意文件创建或权限提升，CVSS 评分 7.5，危害等级高。"
published = "2002-01-31T05:00:00Z"
remediation = "立即升级 Bugzilla 至 2.14.1 或更高版本，该版本修复了 buglist.cgi、userprefs.cgi、long_list.cgi 和 editusers.cgi 中的多处 SQL 注入漏洞。如无法立即升级，建议在 Web 服务器层（如 Apache mod_rewrite）对上述 CGI 脚本的输入参数进行严格过滤，限制特殊字符和 SQL 关键字，并移除 blessgroupset 权限用户的非必要授权。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Mozilla Bugzilla SQL注入漏洞"
updated = "2026-06-16T21:56:35Z"

