[basic]
description = "AIOHTTP 是 Python asyncio 生态下的异步 HTTP 客户端/服务器框架。在 3.14.2 版本之前，其 HTTP 解析器在处理 WebSocket 升级请求时存在请求走私漏洞（CWE-444）。当 WebSocket 升级请求携带消息体时，解析器可能在完整接收请求体之前就切换到 WebSocket 协议，导致剩余字节被当作升级后协议数据或管道化数据处理，而非正常 HTTP 请求体，攻击者可能借此走私恶意请求、绕过安全边界或污染后端缓存。该漏洞影响所有使用 aiohttp 服务端组件并处理 WebSocket 升级的应用，需要攻击者能够向目标服务器发送特制网络请求，CVSS 评分 6.3，危害等级中危。官方已在 3.14.2 版本修复此问题，建议用户尽快升级至安全版本。"
published = "2026-08-03T21:16:42Z"
remediation = "将 aiohttp 升级到 3.14.2 或更高版本，以修复 HTTP 请求走私漏洞。可通过 pip install --upgrade aiohttp 命令升级。如暂时无法升级，建议在反向代理层面禁用 WebSocket 升级功能，或配置请求体长度限制作为临时缓解措施。"
score = 6.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "aio-libs AIOHTTP WebSocket 升级 HTTP 请求走私漏洞"
updated = "2026-08-05T16:17:01Z"

