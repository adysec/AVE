[basic]
description = 'MultiHTML 1.5 是一款用于网页化的多文件浏览 CGI 脚本，存在文件读取漏洞。未经身份认证的远程攻击者可通过向目标服务器发送带有特制 "multi" 参数的 HTTP 请求，在参数中指定任意文件路径（如 /etc/passwd），即可读取服务器上的敏感文件内容。此外，该漏洞还可能允许攻击者执行任意系统命令，具体取决于服务器的配置与权限设置。该漏洞影响部署了 MultiHTML 1.5 CGI 脚本的 Web 服务器，只要攻击者能够通过网络访问该 CGI 脚本即可发起利用，无需任何认证凭据。攻击者可利用此漏洞获取服务器配置信息、用户凭据或其他敏感数据，严重时可能导致服务器完全被控制。'
published = "2000-12-19T05:00:00.000"
remediation = "立即将 MultiHTML CGI 脚本升级至 1.6 或更高版本，该版本已修复 multi 参数的文件路径验证缺陷。若无法升级，请从 Web 服务器 CGI 目录中移除 multihtml.pl 脚本以消除攻击面。同时，在 Web 服务器配置中限制 CGI 目录的执行权限，仅允许可信 IP 地址访问 /cgi-bin/ 路径，并对所有用户输入进行严格的路径遍历过滤，拒绝包含 ../ 或空字节 %00 的请求。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "MultiHTML CGI 脚本 文件泄露漏洞"
updated = "2026-06-16T21:52:44.943"

