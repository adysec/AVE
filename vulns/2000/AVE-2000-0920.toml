[basic]
description = "tags.<value>IIS 4.0 和 5.0 存在文件权限规范化漏洞，该漏洞源于服务器未能正确规范化文件路径并尊重权限层级。当父目录具有较松散权限时，IIS 会错误地允许访问某些本应受保护的文件。远程攻击者可通过向 Web 服务器发送精心 crafted 的文件访问请求，绕过访问控制机制获取服务器上的敏感文件。该漏洞影响运行 IIS 4.0 和 5.0 的 Windows 服务器，攻击者仅需网络连接即可利用，属于可直接远程利用的漏洞类型。微软随后发布了安全补丁，修复了路径规范化和权限检查机制。"
published = "2000-10-20T04:00:00.000"
remediation = '建议升级至 IIS 6.0 或更高版本，或应用微软安全公告 MS02-001 补丁。若无法升级，请在 NTFS 文件系统上为 Web 目录设置严格的 ACL 权限，移除 "Everyone" 组的写入/修改权限，仅保留必要的读取权限；同时禁用父路径访问，在 IIS 管理器中取消勾选"启用父路径"选项。'
score = 6.4
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft IIS 文件权限规范化安全绕过漏洞"
updated = "2026-06-16T21:52:26.697"

