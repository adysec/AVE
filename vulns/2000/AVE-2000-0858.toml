[basic]
description = 'Raptor GFX 配置工具 pgxconfig 在调用系统命令时使用相对路径执行 "cp" 程序，而非使用绝对路径，导致存在本地权限提升漏洞。具有本地访问权限的攻击者可通过修改 PATH 环境变量，使其指向恶意构造的 "cp" 程序，当 pgxconfig 执行系统调用时便会加载攻击者的恶意程序，从而以工具运行权限执行任意命令。该漏洞影响 Tech-Source Raptor GFX PGX32 2.3.1 版本，CVSS 评分 7.2，危害等级高，攻击者需具备本地系统访问权限方可利用。'
published = "2000-10-20T04:00:00.000"
remediation = '将 pgxconfig 工具中对 "cp" 程序的系统调用改为绝对路径 /bin/cp，避免依赖 PATH 环境变量。如无法修改程序源码，可在执行 pgxconfig 前将 PATH 环境变量设置为仅包含受信任的系统目录（如 PATH=/bin:/usr/bin），并确保当前用户不具有对系统目录的写入权限。作为临时缓解措施，可移除 pgxconfig 的 setuid 位（如适用）以限制提权风险。'
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Tech-Source Raptor GFX PGX32 配置工具本地命令执行漏洞"
updated = "2026-06-16T21:52:16.943"

