[basic]
description = "FreeBSD 5.0 及更早版本系统中的 catopen() 函数存在缓冲区溢出漏洞。本地攻击者可通过向该函数传递超长的环境变量参数触发缓冲区溢出，成功利用此漏洞可获取目标系统的 root 权限，实现完全控制受影响的 FreeBSD 系统。该漏洞攻击复杂度低，无需用户交互，但需要本地访问权限。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级 FreeBSD 系统至 5.0 以上版本，或从 ftp://ftp.FreeBSD.org/pub/FreeBSD/CERT/advisories/FreeBSD-SA-00:53.catopen.asc 获取并安装 catopen() 函数的补丁。如无法升级，可通过限制本地用户登录权限、移除 setuid 程序中对 catopen() 的依赖作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "FreeBSD catopen() 函数缓冲区溢出本地权限提升漏洞"
updated = "2026-06-16T21:52:58Z"

