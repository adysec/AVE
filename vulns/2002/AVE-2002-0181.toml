[basic]
description = "Ghostscript 6.53 之前版本中存在安全沙箱绕过漏洞。攻击者可通过构造恶意的 PostScript 文件，利用 .locksafe 或 .setsafe 操作符重置当前页面设备（pagedevice），从而绕过 Ghostscript 的安全限制机制，实现任意命令执行。该漏洞无需身份认证即可远程利用，影响所有使用受影响版本 Ghostscript 的系统，CVSS 评分 7.5，危害等级高。"
published = "2002-05-29T04:00:00Z"
remediation = "升级 Ghostscript 至 6.53 或更高版本。Red Hat 用户安装 RHSA-2002-083/RHSA-2002-123/RHSA-2003-209 更新；Caldera OpenLinux 用户应用 CSSA-2002-026.0 补丁。如无法升级，限制不可信用户对 Ghostscript 的调用权限。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Artifex Ghostscript 代码执行漏洞"
updated = "2026-06-16T21:57:17Z"

