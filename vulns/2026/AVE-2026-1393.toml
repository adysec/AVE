[basic]
description = "Ghost 是一款 Node.js 内容管理系统。在 Ghost Admin 的图片抓取功能中存在服务端请求伪造（SSRF）漏洞。当具有员工级别权限的用户通过 Ghost Admin 面板上传图片时，系统会向用户指定的 URL 发起 HTTP GET 请求以获取图片资源。由于缺乏对目标 URL 的充分校验，攻击者可构造指向内网主机的恶意 URL，使服务器向内部网络发起盲 SSRF 请求。尽管该漏洞不会返回响应内容，但攻击者可借此探测内网主机开放的端口及运行服务，进而为后续内网渗透攻击提供信息基础。该漏洞影响 Ghost 0.10.0 至 6.54.0 版本，CVSS 评分 4.1，危害等级为中危。Ghost 官方已在 6.54.1 版本中修复此问题，建议用户及时升级至最新版本。"
published = "2026-08-04T22:17:16Z"
remediation = "1. 升级 Ghost 到 v6.54.1 或更高版本，该版本已修复 SSRF 漏洞。自托管 Docker 部署的用户请拉取 Docker Hub 官方 Ghost 镜像的最新版本；使用 Ghost-CLI 安装的用户请执行官方更新流程。2. 临时缓解措施：限制 Ghost Admin 中 staff 级别用户的账户数量，仅向可信人员授予 staff 权限，缩小攻击面。3. 若无法立即升级，可在反向代理或防火墙层限制 Ghost Admin 对内部网络的出站请求，防止探测内网主机端口。"
score = 4.1
severity = "MEDIUM"
sources = ["ghsa"]
title = "Ghost 内容管理系统 服务端请求伪造漏洞"
updated = "2026-08-05T15:17:15Z"

