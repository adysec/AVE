[basic]
description = "Linux 内核 IBM Virtual Ethernet (ibmveth) 驱动中的 veth_pool_store 函数存在同步缺陷，未使用 rtnl_mutex 对函数调用进行互斥保护，导致多线程环境下可重复调用 napi_disable。具有本地权限的攻击者可通过向 /sys/devices/vio/30000002/pool*/* 路径快速写入多个状态文件，触发 veth_pool_store 与 ibmveth_close、ibmveth_open 之间的并发竞态，造成内核挂起和系统拒绝服务。该漏洞影响使用 ibmveth 网卡驱动的 Linux 内核版本，CVSS v3.1 评分 5.5，危害等级中等。"
published = "2025-04-16T15:15:58Z"
remediation = "升级 Linux 内核至包含该补丁的最新稳定版本（6.14 或各发行版安全更新）。Ubuntu 用户执行 apt update && apt upgrade linux-image，SUSE 用户执行 zypper patch --category security。如无法立即升级，可通过限制对 /sys/devices/vio/*/pool*/* 的并发写入权限或设置内核参数禁用 ibmveth 的多队列池并发操作作为临时缓解。该补丁通过 rtnl_mutex 同步 veth_pool_store 与 close/open 路径，消除多次调用 napi_disable 导致的死锁挂起。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 ibmveth 网络驱动竞争条件拒绝服务漏洞"
updated = "2026-06-17T08:44:56Z"

