[basic]
description = "Apple iTunes 10.7 之前版本所使用的 WebKit 渲染引擎存在内存破坏漏洞。远程攻击者可构造恶意网页内容，当用户使用 iTunes 浏览包含特制代码的网页时，触发内存损坏，从而导致远程代码执行或应用程序崩溃拒绝服务。该漏洞影响所有未及时更新的 iTunes 用户，攻击者无需身份认证即可通过网络发起攻击，利用中等复杂度即可成功执行任意代码或造成服务中断。"
published = "2012-09-13T10:30:19Z"
remediation = "将 Apple iTunes 升级至 10.7 或更高版本，该版本已修复 WebKit 中多个内存损坏问题。对于 iOS 设备，请升级至 iOS 6.0 或更高版本。如无法立即升级，建议暂时避免在 iTunes 中访问恶意网站，并禁用不必要的 WebKit 相关内容渲染功能作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:33Z"

