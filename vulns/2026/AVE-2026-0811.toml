[basic]
description = "Open WebUI 0.9.6 至 0.10.0 之前版本存在授权绕过漏洞（CWE-863）。`_verify_knowledge_file_access` 函数仅校验用户对文件的读取权限，而文件写入和删除路由后续通过可写模型 `meta.knowledge` 条目派生访问权限，导致拥有知识库只读权限的认证用户可将文件 ID 附加到攻击者控制的模型元数据中，从而将只读权限升级为文件写入或删除权限。攻击者需具备 Models 工作区访问权限且已通过知识库授权获得目标文件的只读权限，利用条件中等。成功利用后攻击者可重命名、覆盖或删除其他用户的文件，影响数据的完整性和可用性。该漏洞在 v0.10.0 版本中修复。"
published = "2026-07-09T17:17:01Z"
remediation = "立即升级 Open WebUI 至 v0.10.0 或更高版本（对应 commit 17df0264）。如无法升级，在反向代理层限制非管理员用户对 `POST /api/v1/files/{id}/rename`、`POST /api/v1/files/{id}/data/content/update`、`DELETE /api/v1/files/{id}` 三个端点的访问，并审查所有拥有 Models 工作区权限的用户的模型 meta.knowledge 配置，移除非本人所有的文件 ID 引用。"
score = 5.4
severity = "MEDIUM"
sources = ["ghsa"]
title = "Open WebUI 文件授权不当导致权限提升漏洞"
updated = "2026-07-10T19:59:36Z"

