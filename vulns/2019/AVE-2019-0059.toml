[basic]
description = "Citrix SD-WAN Center 和 NetScaler SD-WAN Center 存在 OS 命令注入漏洞（CWE-78）。由于对用户输入验证不当，未经身份认证的远程攻击者可通过向管理接口发送特制请求，在目标系统上以 root 权限执行任意系统命令。该漏洞影响 Citrix SD-WAN 10.2.3 之前版本及 NetScaler SD-WAN 10.0.8 之前版本，无需用户交互即可利用，CVSS 评分 9.8，危害等级严重。Citrix 官方已发布安全更新修复此漏洞。"
published = "2019-07-16T18:15:12.570"
remediation = "将 Citrix SD-WAN Center 升级至 10.2.3 或更高版本，将 NetScaler SD-WAN Center 升级至 10.0.8 或更高版本以修复命令注入漏洞。如无法立即升级，建议通过防火墙或访问控制列表限制 SD-WAN Center 管理界面的访问权限，仅允许可信网络访问，并在网络边界部署入侵检测系统监控异常命令执行行为。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Citrix NetScaler SD-WAN Center 命令注入漏洞"
updated = "2026-06-17T02:15:51.713"

