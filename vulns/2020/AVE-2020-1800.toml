[basic]
description = "Liferay Portal 7.2.1 CE GA2 及之前版本的 JSON Web Services（JSONWS）接口存在不可信数据反序列化漏洞。未经身份认证的远程攻击者可通过发送特制的 JSONWS 请求，利用 Java 对象反序列化机制触发远程代码执行，从而完全绕过身份验证并在服务器上执行任意系统命令。该漏洞影响使用受影响版本部署的 Liferay Portal 系统，攻击者无需凭据即可在目标服务器上获得与应用程序相同权限的代码执行能力，CVSS 评分 9.8，危害等级为严重。"
published = "2020-03-20T19:15:12.737"
remediation = "立即将 Liferay Portal CE 升级至 7.2.1 GA2 或更高版本（Liferay DXP 7.2 需应用 fix pack 5 或更高补丁包），以修复 JSONWS 接口中的 Java 反序列化漏洞。如暂时无法升级，应在反向代理或防火墙层拦截对 /api/jsonws/ 及 /api/jsonws/ajax 等路径的未授权外部访问，仅允许可信内网 IP 调用 JSONWS 接口，同时监控访问日志中是否存在包含恶意序列化载荷的 POST 请求。此外建议在 WAF 中部署规则，拦截 JSONWS 请求体中包含 java.lang.Runtime 或 ProcessBuilder 关键字的外部调用。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Liferay Portal JSONWS 反序列化远程代码执行漏洞"
updated = "2026-06-17T03:25:42.180"

