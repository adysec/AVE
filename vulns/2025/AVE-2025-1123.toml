[basic]
description = "Linux 内核的 Netlabel 子系统存在空指针解引用漏洞。在 netlbl_conn_setattr() 函数中，程序通过 addr->sa_family 判断地址族类型以确定后续行为；若 IPv4 socket 的 connect 系统调用传入 IPv6 地址，会触发 calipso_sock_setattr() 执行，其中代码尝试访问 inet_sk(__sk)->pinet6，但由于该 socket 为 IPv4 类型，pinet6 字段为 NULL，导致内核空指针解引用，可能造成系统崩溃或拒绝服务。该漏洞影响使用受影响内核版本的 Linux 系统，攻击者需要本地低权限访问权限，无需用户交互即可触发，主要危害为破坏系统可用性。"
published = "2025-04-16T15:15:59Z"
remediation = "升级 Linux 内核至包含补丁 commit 79e607d5bdabb16fe30d1d27fd697024b46564be 的稳定版本，如 Ubuntu 24.04 LTS 升级至 6.8.0-86.87 或更高，Ubuntu 22.04 LTS 升级至 5.15.0-142.152 或更高，Ubuntu 20.04 LTS 升级至 5.4.0-218.238 或更高；使用其他发行版请通过官方包管理器安装最新安全更新。如无法立即升级内核，可临时禁用 netlabel 的 CALIPSO 功能作为缓解措施，或限制本地低权限用户的网络连接权限以降低攻击面。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 Netlabel 空指针解引用漏洞"
updated = "2026-06-17T08:44:57Z"

