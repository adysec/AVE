[basic]
description = "Windows Ancillary Function Driver (AFD) for WinSock 存在堆缓冲区溢出漏洞，该驱动负责处理 Winsock 套接字 I/O 操作。已获得低权限的本地攻击者可利用特制的 IOCTL 调用触发堆缓冲区溢出，成功利用可将权限提升至 SYSTEM 级别，实现完全控制目标系统。该漏洞已被 CISA 列入已知被利用漏洞目录，表明已在野外被积极利用。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:40.023"
remediation = "安装 Microsoft 2025 年 2 月安全更新（补丁编号 5051974），升级受影响的 Windows 系统至最新版本。该漏洞已在 afd.sys 驱动中被积极利用，建议立即应用补丁以防止权限提升攻击。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows WinSock 辅助功能驱动程序权限提升漏洞"
updated = "2026-06-17T08:43:19.180"

