[basic]
description = "RSA ACE Server 至 4.1 版本存在认证 UDP 数据包泛洪拒绝服务漏洞。远程攻击者无需身份认证即可向目标服务器的认证服务发送大量特制 UDP 数据包，导致服务器资源耗尽，无法正常处理合法认证请求，造成服务中断。该漏洞影响 RSA ACE Server 4.1 及更早版本，攻击者只需具备网络访问能力即可实施攻击，无需特殊权限。"
published = "2000-06-08T00:00:00Z"
remediation = "立即升级 RSA ACE/Server 至 4.1 以上已修复版本，或从厂商 FTP 下载 dos/readme.txt 中提供的补丁程序安装。如无法升级，可在防火墙或网络边界限制对服务器认证端口（UDP 5500）的访问，仅允许可信客户端 IP 连接，以缓解 UDP 泛洪攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "RSA ACE Server 认证UDP数据包洪水拒绝服务漏洞"
updated = "2000-06-08T00:00:00Z"

