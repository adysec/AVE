[basic]
description = "Apache Solr 的 Config API 存在不安全的反序列化漏洞，攻击者可通过 HTTP POST 请求将 JMX 服务地址指向恶意的 RMI 服务器，触发 Solr 在反序列化 RMI 响应时执行任意代码。该漏洞影响 Apache Solr 5.0.0 至 5.5.5 及 6.0.0 至 6.6.5 版本，CVSS 评分 9.8，危害等级严重。攻击无需认证，远程即可利用，可导致服务器完全失陷。"
published = "2019-03-07T21:29:00Z"
remediation = "立即升级 Apache Solr 至 5.5.6 或 6.6.6 及以上版本。如无法立即升级，可通过启用 Solr 的认证与授权插件（RuleBasedAuthorizationPlugin）限制 Config API 的访问权限，仅允许受信管理员调用；或在反向代理/防火墙层面拦截对 /admin/configs 等 Config API 端点的外部访问，作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Apache Solr Config API JMX 服务远程命令执行漏洞"
updated = "2026-06-17T02:07:55Z"

