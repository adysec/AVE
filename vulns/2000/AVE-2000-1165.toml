[basic]
description = "tags.<value>BEA Systems WebLogic Express 和 WebLogic Server 5.1 SP1 至 SP6 版本存在安全绕过漏洞。攻击者可通过在受限的 JSP 或 Servlet 页面路径前插入多个连续的斜杠字符来绕过访问控制限制，从而直接访问本应受保护的服务器端页面。该漏洞影响 WebLogic Server 5.1 的多个服务包版本，攻击者无需身份认证即可远程利用，且利用过程简单、攻击复杂度低。成功利用后，攻击者能够绕过服务器的访问控制机制，获取受限制页面的内容或执行未经授权的操作，可能导致敏感信息泄露或权限提升。"
published = "2000-12-31T05:00:00Z"
remediation = "将 WebLogic Server 或 WebLogic Express 升级至 5.1 SP 7 或更高版本，该版本已修复 URL 中多个正斜杠字符可绕过访问控制的问题。升级前请先备份应用配置与部署描述文件，下载并安装 BEA 官方安全补丁 SecurityBEA00-0600，重启服务后验证受限的 JSP 或 Servlet 页面不再因多重斜杠而暴露。如暂时无法升级，可在 WebLogic 前端 Web 服务器（如 Apache/IIS）的 URL 重写规则中统一规范化路径，将连续正斜杠合并为单个斜杠，以阻断绕过访问控制的请求。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "BEA WebLogic 访问控制绕过漏洞"
updated = "2026-06-16T21:53:26Z"

