[basic]
description = "SuSE Linux 6.x 及 7.0 系统中的 rctab 工具存在竞争条件漏洞。rctab 在处理临时文件 rctmp 时未进行安全的原子操作，本地攻击者可通过符号链接攻击（symlink attack）在 rctab 创建临时文件前预先创建指向目标文件的符号链接，从而利用该竞争条件覆盖或创建系统任意文件，导致本地权限提升或系统文件被篡改。攻击者需要本地访问权限且利用复杂度较高，CVSS 评分 1.2。"
published = "2001-03-12T05:00:00.000"
remediation = "升级 SuSE Linux 至 7.0 以上版本，或移除 rctab 的 setuid 权限并限制仅 root 用户可执行。如无法升级，删除 rctab 工具或通过 chmod 移除其 suid 位以缓解风险。"
score = 1.2
severity = "LOW"
sources = ["cve"]
title = "SuSE Linux rctab 临时文件符号链接竞争条件漏洞"
updated = "2026-06-16T21:53:40.360"

