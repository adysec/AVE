[info]
author = "ave"
description = "通过 MSXML XMLDOM ActiveX 控件加载 file:// 协议 URL 探测本地文件是否存在，验证 CVE-2017-0022 信息泄漏漏洞"
id = "POC-AVE-2017-0005"
name = "Microsoft XML Core Services 信息泄漏漏洞 PoC"
severity = "medium"
tags = [
    "cve-2017-0022",
    "msxml",
    "information-disclosure",
]
vuln_id = [
    "CVE-2017-0022",
    "AVE-2017-0005",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["MSXML"]
