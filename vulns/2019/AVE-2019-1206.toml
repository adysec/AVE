[basic]
description = "The task asks to generate the [description] field for CVE-2019-3398. Output only the description content between <value> tags.<value>Atlassian Confluence Server 和 Data Center 的 downloadallattachments 组件存在目录遍历漏洞。由于该组件对下载附件的文件路径过滤不严，远程攻击者可在拥有向页面或博客添加附件权限、创建空间权限，或拥有空间管理员权限的情况下，通过构造包含特殊路径序列的请求利用该漏洞，将文件写入服务器的任意目录，进而可能导致远程代码执行，使攻击者完全控制服务器。该漏洞影响 Confluence 从 2.0.0 到 6.15.2 的多个版本分支（6.6.x 至 6.15.x）。该漏洞 CVSS 评分 8.8，危害等级高危，且已被纳入 CISA KEV 已知被利用漏洞目录，实际攻击风险较高。Atlassian 已在 6.6.13、6.12.4、6.13.4、6.14.3 和 6.15.3 及"
published = "2019-04-18T18:29:00Z"
remediation = "建议立即升级 Confluence Server 或 Data Center 至官方修复版本（6.6.x 升级至 6.6.13，6.12.x 升级至 6.12.4，6.13.x 升级至 6.13.4，6.14.x 升级至 6.14.3，6.15.x 升级至 6.15.2 及更高版本），可从 Atlassian 官方下载中心获取安装包并执行就地升级。升级前请备份 data 目录与数据库。若无法立即升级，作为缓解措施应严格收敛权限，仅向可信用户授予附件上传及空间管理权限，并通过反向代理或防火墙对下载附件相关接口（downloadallattachments）实施访问控制，阻断不可信来源。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Confluence downloadallattachments 目录遍历漏洞 漏洞"
updated = "2026-06-17T02:35:05Z"

