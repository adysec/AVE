[basic]
description = "Adobe Flash Player 在 10.2.152.26 之前的版本中存在多个内存破坏漏洞，攻击者可通过诱使用户访问包含特制 Flash 内容的恶意网页，利用这些漏洞执行任意代码或造成拒绝服务。该漏洞影响所有使用受影响版本 Flash Player 的用户，利用条件为用户访问恶意页面，无需身份认证即可触发远程攻击。"
published = "2011-02-10T16:00:32Z"
remediation = 'tags as requested.<value>立即升级 Adobe Flash Player 至 10.2.152.26 或更高版本。如暂时无法升级，可在浏览器中禁用 Flash 插件并启用"单击以播放"(Click-to-Play)功能，或通过组策略限制 Flash 内容仅在可信站点运行；同时部署防火墙规则阻止恶意 Flash 文件下载，并在 URL 过滤网关中屏蔽包含 Flash 内容的可疑站点作为临时缓解措施。'
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:27:39Z"

