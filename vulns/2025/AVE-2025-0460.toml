[basic]
description = "tags.<value>HAProxy 的 mjson JSON 解析库存在算法复杂度缺陷（CWE-407），远程攻击者可发送精心构造的 JSON 请求触发低效算法，导致目标服务拒绝服务。该漏洞影响使用受影响 mjson 版本的 HAProxy 部署，包括 SUSE Linux Enterprise Server 15 和 openSUSE 15 等系统。攻击无需身份认证，通过向 HAProxy 发送特制的 JSON 数据即可触发资源耗尽，造成服务不可用。"
published = "2025-11-19T10:15:45Z"
remediation = "立即将 HAProxy 升级至 2.8.16 或更高版本。该漏洞影响所有 2.4 及以上版本中集成 mjson JSON 解码器的 HAProxy，仅有升级可彻底修复。若使用 HAProxy 3.x 分支，请升级至 3.3.0 或更新版本。如暂时无法升级，可在 HAProxy 配置中对 JSON 请求体设置大小上限（如在 frontend 中添加 `tune.bufsize` 限制），或通过 WAF/反向代理层拦截包含异常大型 JSON 数值的请求，作为临时缓解措施。同时监控 NVD 和 HAProxy 官方邮件列表获取最新安全公告。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "HAProxy mjson 库拒绝服务漏洞"
updated = "2026-06-17T08:29:53Z"

