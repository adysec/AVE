[basic]
description = "Apple QuickTime 在处理 JP2 图像时存在堆缓冲区溢出漏洞，远程攻击者可向目标用户发送特制的 JP2 图片文件，当用户使用受影响版本的 QuickTime 打开该恶意文件时，触发堆缓冲区溢出，导致任意代码执行或应用程序崩溃。该漏洞影响 Mac OS X 10.6.x 及更早版本，攻击者需诱使用户访问恶意 JP2 图像方可利用。"
published = "2010-11-16T22:00:16Z"
remediation = "将 Mac OS X 升级至 10.6.5 或更高版本，该更新包含 QuickTime 7.6.9，修复了 JP2 图像处理中的堆缓冲区溢出漏洞。如无法立即升级，建议在邮件网关和 Web 代理层面拦截可疑的 JP2 文件，并教育用户不要打开来源不明的图片文件。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple QuickTime JP2图像处理堆缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T23:23:32Z"

