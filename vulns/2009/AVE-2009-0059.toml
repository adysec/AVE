[basic]
description = "GNU Troff (groff) 1.21 版本前的 contrib/pdfmark/pdfroff.sh 脚本存在符号链接攻击漏洞。该脚本在创建临时文件 pdf#####.tmp 时未进行安全检查，本地攻击者可预先创建同名符号链接指向任意目标文件，当脚本以更高权限写入临时文件时，实际会覆盖链接指向的任意文件。攻击者需具备本地系统访问权限，利用竞争条件在脚本创建临时文件前建立恶意符号链接，可导致任意文件被覆盖，影响文件完整性和可用性。受影响版本为 groff 1.21 之前版本，升级至 1.21 或更高版本可修复此漏洞。"
published = "2011-06-24T20:55:01Z"
remediation = "升级 GNU groff 到 1.21 或更高版本（如 `sudo apt-get update && sudo apt-get install groff=1.22.4-3`），或应用厂商补丁（如 Pardus 的 groff-cve-2009-5044_5080_5081.patch），临时缓解可设置 `TMPDIR` 指向私有目录并限制 `/tmp` 权限为 1777 防止符号链接攻击"
score = 3.3
severity = "LOW"
sources = ["tenable"]
title = "GNU troff 后置链接文件覆盖漏洞"
updated = "2026-06-16T23:14:53Z"

