[basic]
description = "Linux内核内存管理子系统存在安全漏洞，当使用mremap()系统调用重新映射此前已通过userfaultfd机制注册为写保护的内存区域时，若未开启UFFD_FEATURE_EVENT_REMAP功能，vma虚拟内存区标志与页表项（PTE/PMD）标志之间的清理操作存在不一致，导致uffd-wp写保护标志状态不匹配。此状态差异会在后续调用mprotect(PROT_WRITE)设置页表可写时触发page_table_check_pte_flags()内核警告，造成系统稳定性下降。该漏洞影响使用userfaultfd特性的Linux内核版本，CVSS评分为5.5。"
published = "2025-02-12T14:15:32Z"
remediation = "升级 Linux 内核至 6.12.11 或更高版本（6.12.x 系列），或升级至 6.13 及以上稳定版本。对于 RHEL 9 系统，应更新至 kernel-5.14.0-611.5.1.el9_7 或更高版本；Debian 用户应更新至 6.12.11-1（trixie）或 7.1.3-1（forky）及以上版本。如暂无法升级内核，可临时缓解：若业务无需 userfaultfd 功能，可在内核启动参数中禁用 userfaultfd 模块，或通过 seccomp 过滤器限制进程调用 mremap() 和 mprotect() 系统调用，避免触发页表标志不一致问题。更新内核后需重启系统使补丁生效。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 mremap 内存管理 拒绝服务漏洞"
updated = "2026-06-17T08:44:03Z"

