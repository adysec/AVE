[basic]
description = "BeOS r5 pro 及之前版本中集成的 Browser IRC 客户端存在拒绝服务漏洞。远程攻击者无需身份认证，可通过向目标用户发送包含超长 URL 的 IRC 消息，触发客户端解析异常导致崩溃或无法响应，造成拒绝服务。该漏洞攻击复杂度低，仅需网络访问即可利用，CVSS 评分 5.0，危害等级中等。目前官方已停止维护该操作系统，建议用户升级至不受影响的版本或更换 IRC 客户端软件。"
published = "2001-01-09T05:00:00.000"
remediation = "升级 BeOS 至 r5 pro 以上版本，或更换为第三方 IRC 客户端（如 Vision IRC）。如无法升级，可在防火墙或网关层面过滤异常长 URL 的 IRC 消息（长度超过 1024 字节的 PRIVMSG/NOTICE 消息）作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "BeOS Browser IRC Client URL 拒绝服务漏洞"
updated = "2026-06-16T21:53:16.157"

