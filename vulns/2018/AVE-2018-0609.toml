[basic]
description = "NoneCms V1.3 及更早版本中的 thinkphp/library/think/App.php 存在远程命令执行漏洞。攻击者无需身份认证即可通过构造特制的 HTTP 请求，利用 filter 参数传递恶意函数名（如 phpinfo），配合 data 参数传入参数值，实现任意 PHP 代码执行。该漏洞影响 NoneCms ≤1.3 版本，CVSS 评分 9.8，危害等级严重。官方至今未发布修复补丁，建议用户迁移至其他 CMS 系统。"
published = "2018-12-11T18:29:00Z"
remediation = "NoneCms 已停止维护，官方未发布修复补丁。建议立即迁移至其他受支持的 CMS 平台；如无法迁移，需在 Web 应用防火墙（WAF）层面拦截包含 filter 参数的 HTTP 请求，或手动修改 thinkphp/library/think/App.php 中 filter 参数的处理逻辑，禁止外部用户传入 filter 参数，同时限制 data 参数的可接受值范围。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "NoneCms ThinkPHP 远程命令执行漏洞"
updated = "2026-06-17T01:52:14Z"

