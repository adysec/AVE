[basic]
description = "Linux 内核内存控制组（memcg）子系统中存在软锁定漏洞，当 OOM（内存耗尽）cgroup 中包含大量任务（约 56000 个）时，内核在遍历这些任务的过程中会长时间占用 CPU 导致软锁定（soft lockup），系统日志显示 CPU 被卡住 23 秒以上。本地攻击者可通过低权限方式触发内存耗尽条件，使目标进程进入 OOM cgroup 并触发遍历操作，导致系统拒绝服务。该漏洞影响所有使用受影响 Linux 内核版本的发行版，CVSS 评分 5.5，危害等级中等。修复方式是在 mem_cgroup_scan_tasks 函数中每遍历 1000 次调用 cond_resched 主动让出 CPU。"
published = "2025-02-27T02:15:10Z"
remediation = "立即将 Linux 内核升级至以下修复版本：5.4.291、5.10.235、5.15.179、6.1.130、6.12.13 或 6.13.2 及以上版本。对于 Debian 系统，安装 DSA-5900-1 或 DLA-4178-1 安全更新。对于使用 Siemens SIMATIC S7-1500 MFP 设备的用户，升级 GNU/Linux 子系统至修复版本。如无法立即升级内核，可通过限制 cgroup 中进程数量或降低内存超配比（vm.overcommit_ratio）减少 OOM 触发频率作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核内存控制组 OOM 进程软锁定漏洞"
updated = "2026-07-14T13:17:14Z"

