[basic]
description = 'GoAhead Web Server 2.1.x 版本存在跨站脚本漏洞。当攻击者在 URL 中注入恶意脚本代码并请求不存在的路径时，服务器生成的"404 Not Found"错误页面未对脚本内容进行正确转义或引号包裹，导致脚本在用户浏览器中执行。远程攻击者可利用此漏洞窃取其他 Web 用户的 Cookie、会话令牌或执行恶意操作，影响 GoAhead Web Server 2.1 全系列版本。攻击无需认证，仅需诱使用户访问特制链接即可触发。'
published = "2002-07-23T04:00:00Z"
remediation = "立即升级至 GoAhead 2.2 安全更新版本（Embedthis 已发布，100% 兼容 2.1.8 API，修复了所有已知安全问题）。如无法升级，可修改 404 错误处理页面源码，对 URL 中的用户输入进行 HTML 实体编码转义（如将 `<` 替换为 `&lt;`、`>` 替换为 `&gt;`），防止脚本注入。对于新设备项目，建议迁移至 Embedthis 当前维护的 Ioto 嵌入式 Web 服务器以获得持续安全更新。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "GoAhead Web Server 2.1.x 错误页面跨站脚本漏洞"
updated = "2026-06-16T21:57:56Z"

