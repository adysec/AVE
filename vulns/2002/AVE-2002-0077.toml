[basic]
description = "Common Unix Printing System (CUPS) 1.1.14 至 1.1.17 版本在处理 HTTP 请求时存在漏洞。远程攻击者可以通过发送带有负数 Content-Length 值的请求，或在分块传输编码（chunked transfer encoding）中指定负数长度，导致 memcpy() 函数接收到负数参数，从而触发缓冲区溢出。该漏洞允许未经身份验证的远程攻击者导致服务崩溃（拒绝服务），甚至可能在目标系统上执行任意代码。"
published = "2002-12-26T05:00:00Z"
remediation = "建议立即将 CUPS 升级到 1.1.18 或更高版本，该版本修复了对负数长度 HTTP 请求头的处理逻辑。若无法立即升级，建议在防火墙或反向代理层拦截包含异常负数 Content-Length 值的 HTTP 请求，或限制仅允许受信任的 IP 地址访问 CUPS 管理接口。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "CUPS Common Unix Printing System 远程代码执行漏洞"
updated = "2026-06-16T21:59:11Z"

