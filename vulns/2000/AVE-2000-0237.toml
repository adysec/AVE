[basic]
description = "Panda Security 3.0 防病毒软件存在注册表编辑权限绕过漏洞。当管理员禁用注册表编辑器后，本地用户仍可通过直接执行 .reg 注册表文件或其他方式修改系统注册表，从而获取额外权限。该漏洞需要攻击者拥有本地访问权限，攻击复杂度低，无需身份认证即可利用，影响系统的完整性。受影响的版本为 Panda Security 3.0。"
published = "2000-04-17T04:00:00.000"
remediation = "立即安装 Panda Security 官方提供的补丁包（Avoidvulnerability.zip），该补丁修复了禁用注册表编辑后仍可通过 .reg 文件修改注册表的权限绕过问题。如无法安装补丁，可通过组策略禁止用户运行 .reg 文件（关联 regedit.exe 和 .reg 文件类型），并限制本地用户以标准用户权限运行，避免管理员权限下执行可疑注册表文件。"
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "Panda Security 3.0 注册表编辑权限提升漏洞"
updated = "2026-06-16T21:51:21.143"

