[basic]
description = "Ghost 是一款基于 Node.js 的开源内容管理系统。在 6.54.1 版本之前，任何拥有 staff 级别权限的用户均可通过 Ghost Admin API 泄露其他 staff 用户的密码哈希值。攻击者获取哈希后可在离线环境下发起密码猜测攻击，若猜测成功则可能导致账户被接管。但 Ghost 的 Device Verification 机制应能阻止攻击者使用恢复的密码登录。此外，根据所使用的数据库不同，泄露的哈希可能未保留正确的字符大小写，进一步增加了密码猜测的难度。该漏洞影响 Ghost v6.54.0 及更早版本，攻击向量为网络，攻击复杂度较高，且需要用户交互配合。"
published = "2026-08-04T22:17:16Z"
remediation = "立即将 Ghost 升级至 v6.54.1 或更高版本。Docker 部署用户可拉取最新官方镜像并重启容器；Ghost-CLI 用户执行 ghost update 完成升级。如暂时无法升级，务必为所有 staff 用户启用邮件多因素认证（Email 2FA），以降低哈希泄露后被离线破解并登录的风险。"
score = 4.8
severity = "MEDIUM"
sources = ["ghsa"]
title = "Ghost Admin API 密码哈希信息泄露漏洞"
updated = "2026-08-05T15:17:14Z"

