[basic]
description = "Microsoft Indexing Service 的 ixsso.query ActiveX 控件被错误标记为脚本安全对象，未经过充分安全审查即允许跨站脚本攻击。攻击者可在恶意网页中嵌入 JavaScript 脚本，当用户使用启用了索引服务的 Windows 2000 系统访问该网页时，iixso.query 对象会被触发，使攻击者能够远程探测目标系统上特定文件是否存在。该漏洞影响所有运行 Indexing Services 的 Windows 2000 系统，CVSS 评分为 4.3，属于中等危害等级。攻击无需身份认证，仅需诱使用户访问包含恶意脚本的网页即可成功利用。"
published = "2001-01-09T05:00:00.000"
remediation = '禁用Microsoft Indexing Service服务：通过控制面板的"管理工具"→"服务"找到Indexing Service并停止该服务。如需保留索引功能，请在Internet Explorer的"安全"设置中将ActiveX控件标记为不安全脚本，阻止ixsso.query控件在不受信任的站点中运行。同时安装Microsoft发布的安全补丁以修复Indexing Services的跨站脚本漏洞。'
score = 4.3
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Indexing Service on Win 2000 ixsso.query 跨站脚本攻击 漏洞"
updated = "2026-06-16T21:53:09.463"

