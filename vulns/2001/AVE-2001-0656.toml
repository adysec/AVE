[basic]
description = "Free Java Web Server 1.0 存在目录遍历漏洞，未经身份认证的远程攻击者可通过向服务器发送包含 ..（点号）的构造请求，绕过目录访问限制读取服务器上的任意文件。该漏洞影响所有运行 Free Java Web Server 1.0 版本的实例，攻击者无需事先获得系统权限或进行复杂交互，仅需在 URL 中使用目录遍历序列即可访问敏感配置文件、源代码等敏感信息，造成信息泄露风险。"
published = "2001-05-03T04:00:00Z"
remediation = "立即停止使用 Free Java Web Server 1.0，迁移至 Apache Tomcat 11.0、Jetty 12 或 Open Liberty 等受支持的 Java Web 服务器。如暂时无法迁移，应在反向代理层（如 Nginx、Apache httpd）过滤包含 .. 或 %2e%2e 的 URL 路径，并在服务器配置中禁用目录列表功能。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Free Java Web Server 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:53:50Z"

