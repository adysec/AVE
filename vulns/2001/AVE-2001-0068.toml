[basic]
description = "WebMaster ConferenceRoom 1.8.1 的 IRC 服务器在处理 buddy relationship（好友关系）时存在安全缺陷，远程攻击者无需身份验证即可利用 IRC 服务器与克隆服务器之间的 buddy relationship 机制发起拒绝服务攻击。该漏洞影响 WebMaster ConferenceRoom 1.8.1 版本，攻击者仅需通过网络向目标服务器发送特制的 buddy 关系请求，即可导致 IRC 服务异常终止或无法响应正常用户请求，造成服务不可用。CVSS 评分 5.0，危害等级中等。"
published = "2001-03-26T05:00:00Z"
remediation = "建议将 WebMaster ConferenceRoom 升级至 1.8.2 或更高版本以修复 buddy 关系模块的拒绝服务漏洞。如升级后仍存在问题，应在服务端配置中禁用 buddy 功能，限制 IRC 服务仅接受来自可信 IP 的连接，并在防火墙层面封堵不必要的 6667/tcp 端口访问。若厂商已停止维护，建议迁移至其他受支持的 IRC 聊天服务器软件。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Webmaster ConferenceRoom 拒绝服务漏洞"
updated = "2026-06-16T21:53:49Z"

