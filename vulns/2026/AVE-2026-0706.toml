[basic]
description = "gopacket 是 Go 语言的网络数据包处理库，版本 1.6.0 及更早版本中的 Diameter AVP 解码器存在整数下溢漏洞。该解码器在计算 AVP 数据长度时，直接执行 `dataLength := avp.Length - uint32(headerSize)` 运算，未在 Vendor 标志位被设置后校验 `avp.Length` 是否不小于 12 字节的扩展头部长度。当攻击者发送一个带有 Vendor 标志且 24 位 Length 字段值为 8、9、10 或 11 的恶意 Diameter AVP 时，该减法运算会发生 uint32 下溢，得到一个约 42.9 亿的值，并直接传递给 `make([]byte, dataLength)` 触发约 4 GiB 的未限制内存分配。攻击者只需通过 TCP 连接向运行 gopacket 的 Diameter 数据包采集器发送两个特制的 32 字节恶意 Diameter 消息，即可耗尽内存并触发 OOM-killer 终止进程，实现无需认证的远程拒绝服务攻击。该漏洞影响所有使用 gopacket Diameter 层解析网络数据包的服务，包括电信和 5G 信令监测系统。官方已在 v1.6.1 版本中通过在 Vendor 标志分支后增加 `avp.Length < headerSize` 校验修复此漏洞。"
published = "2026-07-28T17:16:51Z"
remediation = "将 github.com/gopacket/gopacket 升级到 v1.6.1 或更高版本。官方补丁在 layers/diameter_avp_decoders.go 的 decodeDiameterAVP 函数中于计算 dataLength 前增加校验：若 avp.Length < uint32(headerSize)，则返回错误，防止 uint32 下溢驱动约 4 GiB 非受控内存分配。升级命令为：go get github.com/gopacket/gopacket@v1.6.1。若暂无法升级，可在防火墙或网络层过滤 Diameter 协议（TCP/SCTP 3868 端口）的不可信来源流量，阻止恶意 AVP 消息到达解析器，作为临时缓解措施。"
score = 6.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "GoPacket gopacket Diameter AVP 解码器整数下溢远程拒绝服务漏洞"
updated = "2026-07-28T18:17:21Z"

