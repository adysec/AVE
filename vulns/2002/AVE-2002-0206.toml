[basic]
description = "mtr 0.46 及更早版本在安装为 setuid root 时存在缓冲区溢出漏洞。本地攻击者可通过向 MTR_OPTIONS 环境变量传入超长字符串触发该溢出，从而获取原始套接字访问权限。该漏洞影响 mtr 0.46 及之前版本，攻击者需拥有本地系统访问权限，CVSS 评分 2.1，危害等级低。建议升级至 mtr 0.54 或更高版本以修复此漏洞。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 mtr 至 0.54 或更高版本，该版本已包含 CVE-2002-0497 的补丁。如无法立即升级，可临时移除 mtr 的 setuid root 权限（chmod u-s /usr/sbin/mtr），以消除本地提权风险，但会限制普通用户使用 mtr 的 raw socket 功能。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "mtr 缓冲区溢出本地权限提升漏洞"
updated = "2026-06-16T21:57:33Z"

