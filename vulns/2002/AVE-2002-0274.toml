[basic]
description = 'xtell xtelld 服务在处理 TTY 参数时存在目录遍历漏洞，未对 ".." 路径遍历序列进行有效过滤。该漏洞影响 xtell 1.91.1 及更早版本，以及 2.x 分支中 2.7 版本之前的所有版本（含 2.6.1）。远程未认证攻击者可通过网络发送包含 ".." 的恶意 TTY 参数，利用目录遍历读取具有短文件名的系统文件；本地用户可进一步利用短文件名符号链接扩大读取范围，获取更多敏感文件内容。攻击无需身份认证，攻击复杂度低，主要造成信息泄露风险。'
published = "2002-06-25T04:00:00Z"
remediation = '建议立即升级 xtell 至 2.7 或更高版本（官方已在 2.7 版本修复该目录遍历漏洞），可通过包管理器升级或从官方源编译安装最新版。若暂时无法升级，可通过防火墙限制 xtelld 服务端口（默认 4224/TCP）仅允许受信 IP 访问，或在 xinetd/inetd 配置中添加 only_from 限制访问来源 IP 段；同时检查 /etc/xtelld.conf 确保 tty 参数校验严格，禁止传入包含 ".." 的参数。若服务非必须，建议暂时停止 xtelld 服务并禁用开机自启。升级后请验证版本：xtelld -v 确认版本 ≥ 2.7。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "xtell xtelld 目录遍历信息泄露漏洞"
updated = "2026-06-16T21:57:14Z"

