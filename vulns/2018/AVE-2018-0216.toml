[basic]
description = "Western Bridge Cobub Razor 0.8.0 存在物理路径泄露漏洞。攻击者无需身份认证即可通过向特定页面发送恶意 HTTP 请求，触发 PHP 错误信息回显，从而泄露服务器绝对路径等敏感信息。该漏洞影响 Cobub Razor 0.8.0 及更早版本，攻击条件低，可被用于信息收集以辅助进一步攻击。目前官方尚未发布修复补丁，建议限制错误信息显示或部署 Web 应用防火墙进行防护。"
published = "2018-03-18T00:00:00Z"
remediation = "删除或移走生产环境中的 tests/ 目录（该目录仅用于开发测试，不应部署到线上）；在 php.ini 中设置 display_errors = Off 并重启 Web 服务器，防止 PHP 错误信息泄露绝对路径；由于 Cobub Razor 0.8.0 已停止维护且官方已转向 C4J 产品，建议迁移至 C4J（https://c4j.cn）或通过 Web 服务器配置（如 Nginx 的 location /tests/ 块返回 403）手动阻断对 tests/ 目录的访问。"
score = 5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Western Bridge Cobub Razor 物理路径泄露漏洞"
updated = "2018-03-18T00:00:00Z"

