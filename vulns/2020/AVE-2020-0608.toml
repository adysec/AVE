[basic]
description = "Oracle WebLogic Server Console 组件存在远程代码执行漏洞，攻击者可通过向 /console/console.portal 接口发送特制 HTTP 请求触发该漏洞。该漏洞影响 10.3.6.0.0、12.1.3.0.0、12.2.1.3.0、12.2.1.4.0 及 14.1.1.0.0 等多个版本。虽然单独利用需要高权限，但结合 CVE-2020-14882 认证绕过漏洞可实现未授权远程代码执行，攻击者无需任何凭证即可完全接管目标 WebLogic Server，CVSS 评分 7.2，危害等级高。Oracle 已在 2020 年 10 月关键补丁更新中修复此漏洞。"
published = "2020-10-21T15:15:25.483"
remediation = "升级 Oracle WebLogic Server 至 10.3.6.0.0 及以上版本的 2020 年 10 月 CPU 补丁；如无法升级，立即删除 /console/console.portal 接口或通过访问控制列表限制 /console 路径的访问来源 IP。"
score = 7.2
severity = "HIGH"
sources = ["kev"]
title = "Oracle WebLogic Server Console 远程代码执行漏洞"
updated = "2026-06-17T02:55:44.653"

