[basic]
description = "IBB Net.Data 的 db2www CGI 程序存在缓冲区溢出漏洞，远程攻击者可通过向 PATH_INFO 环境变量提交超长字符串触发该漏洞，导致缓冲区溢出，从而在目标系统上执行任意命令。该漏洞攻击复杂度低且无需认证，利用方式简单，可导致系统被完全控制。受影响系统需谨慎部署安全补丁。"
published = "2000-10-20T04:00:00Z"
remediation = "立即升级 IBM Net.Data 至 7.0 及以上版本，该版本修复了 db2www CGI 程序在处理 PATH_INFO 环境变量时的缓冲区溢出问题。如无法升级，可在 Web 服务器层面限制对 db2www CGI 脚本的访问，仅允许受信任 IP 调用，并配置 Web 服务器对 CGI 输入参数长度进行限制。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "IBM Net.Data db2www CGI 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:14Z"

