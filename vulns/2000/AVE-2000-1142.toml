[basic]
description = "标签中输出纯文本。<value>Windows NT 系统存在信息泄露漏洞，由于 LsaQueryInformationPolicy 策略函数对空会话连接缺乏充分的权限校验，未经身份认证的远程攻击者可通过建立空会话获取域 SID（安全标识符），并利用该标识符枚举出目标域中的所有用户账户信息。该漏洞影响 Windows NT 及基于其内核的早期 Windows 系统，攻击者无需提供任何凭据，仅需通过网络连接到目标主机的 IPC$ 共享并调用相关系统函数即可完成利用。成功利用后，攻击者可获取完整的域用户列表，为后续的定向攻击和社会工程学提供关键信息支撑。"
published = "2001-08-31T04:00:00Z"
remediation = '建议立即安装 Windows NT 4.0 最新安全补丁，或升级到 Windows 2000 Service Pack 2 及以上版本。同时修改注册表限制空会话：将 HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RestrictAnonymous 设置为 1，并在防火墙层面禁用 TCP 139、445 端口的 NetBIOS 流量作为临时缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Windows NT 空会话域用户信息枚举漏洞"
updated = "2026-06-16T21:53:21Z"

