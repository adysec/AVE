[basic]
description = "wolfSSL 5.8.4之前版本中存在常量时间实现被LLVM编译器优化破坏的漏洞。由于LLVM优化过程中可能将原本设计为恒定时间执行的安全关键代码转换为非恒定时间的二进制指令，导致不同输入下的程序执行时间产生可观测的差异。具有高权限的本地攻击者可通过精确测量程序响应时间来实施时序侧信道攻击，从而泄露受保护的敏感信息。该漏洞需本地访问且攻击复杂度较高。建议升级至wolfSSL 5.8.4及以上版本修复此问题。"
published = "2025-12-11T18:16:19Z"
remediation = "升级 wolfSSL 至 5.8.4 或更高版本（该版本已通过 volatile 关键字标记常时实现变量，防止 LLVM 优化破坏常时执行）。如无法立即升级，可在编译时添加 -fno-strict-overflow、-fwrapv 等禁用 LLVM 激进优化，并确保使用 O0/O1 优化级别编译常时代码路径；同时监控 wolfSSL 官方 PR#9148 补丁，尽快合并到代码库。"
score = 1
severity = "LOW"
sources = ["msrc"]
title = "wolfSSL 常时实现 LLVM 编译优化转为非常时代码导致时序侧信道信息泄露漏洞"
updated = "2026-06-17T08:34:58Z"

