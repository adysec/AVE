[basic]
description = "PHP-Nuke 是一款流行的开源内容管理系统。其 opendir.php 脚本存在路径遍历漏洞，未经身份认证的远程攻击者可通过向 `requesturl` 参数传递包含目录遍历序列的文件名，读取服务器上的任意文件内容。该漏洞影响所有运行受影响版本 PHP-Nuke 的网站，攻击者无需凭据即可在低复杂度下利用，可能导致敏感文件（如配置文件、数据库凭证）泄露。CVSS v2 评分 5.0，危害等级中等。"
published = "2001-05-03T04:00:00Z"
remediation = 'PHP-Nuke 项目已停止官方维护多年，建议立即将 opendir.php 文件从 Web 根目录中移除或重命名，并在 Apache 配置中添加<Files "opendir.php">Require all denied</Files>规则禁止外部访问，同时在 Nginx 或防火墙层面配置禁止通过 requesturl 参数进行任意文件读取，最终迁移至仍在维护的 CMS 如 WordPress 或 Drupal 以彻底消除风险。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "PHP-Nuke opendir.php 任意文件读取漏洞"
updated = "2026-06-16T21:54:05Z"

