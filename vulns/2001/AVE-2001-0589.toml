[basic]
description = "运行CBOS 2.4.1及更早版本的Cisco路由器，其Web管理界面未对无效登录尝试进行记录，攻击者可利用此缺陷远程暴力猜测管理员密码而不会被系统检测。该漏洞影响Cisco路由器的Web管理功能，允许未经身份认证的远程攻击者通过持续尝试不同的密码组合来获取管理员权限，从而完全控制受影响设备。CVSS评分为7.5，危害等级为高危。"
published = "2001-02-16T05:00:00.000"
remediation = "建议升级 Cisco CBOS 至 2.4.2 或更高版本（可从 Cisco 官网下载对应路由器固件）。若暂时无法升级，请在路由器上配置登录失败锁定策略（如 `aaa authentication login default local` 配合 `login block-for 300 attempts 3 within 60`），并通过 ACL 限制 Web 管理接口仅允许可信管理 IP 访问（如 `access-list 10 permit 192.168.1.0 0.0.0.255` 后应用至 `ip http access-class 10`）。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Cisco CBOS路由器 未记录无效登录导致远程密码暴力破解漏洞"
updated = "2026-06-16T21:53:34.370"

