[info]
author = "ave"
description = "验证 Internet Explorer 5.5 与 6.0 文件下载安全警告绕过漏洞。目标主机使用 IE 5.5 或 6.0 浏览器访问恶意网页后，文件下载对话框中的文件名被错误呈现，使误以为文件类型安全而下载执行，导致远程代码执行。"
id = "POC-AVE-2001-0396"
name = "CVE-2001-0875 PoC"
severity = "high"
tags = ["ave-2001-0396"]
vuln_id = [
    "CVE-2001-0875",
    "AVE-2001-0396",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/vuln"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["download"]
