[basic]
description = "Cisco IOS、IOS XE、IOS XR 及 PIX 等设备的 IKEv1 协议实现存在信息泄露漏洞（BENIGNCERTAIN）。远程攻击者无需身份认证即可向目标设备发送特制的 Security Association（SA）协商请求，触发设备响应中包含未初始化内存中的敏感数据，导致内存信息泄露。该漏洞影响 Cisco IOS 12.2~12.4 及 15.0~15.6、IOS XE 至 3.18S、IOS XR 4.3.x 及 5.0.x~5.2.x、PIX 7.0 之前版本，CVSS 评分 7.5，危害等级高。攻击者利用该漏洞可获取设备配置、密钥等敏感信息，为进一步渗透提供条件。Cisco 已发布安全公告修复此漏洞。"
published = "2016-09-19T01:59:06Z"
remediation = "升级 Cisco IOS 至 15.6(1)T 及以上版本，或升级 IOS XE 至 3.19S 及以上版本，或升级 IOS XR 至 5.3.0 及以上版本。对于 PIX 设备，升级至 7.0 及以上版本。如无法立即升级，可在受影响设备的 IKEv1 配置中禁用 Security Association 协商功能，或在边界防火墙上限制 UDP 500/4500 端口的入站访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS/IOS XE/IOS XR IKEv1 信息泄露漏洞"
updated = "2026-06-17T00:50:59Z"

