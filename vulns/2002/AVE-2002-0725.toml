[basic]
description = "tags.<value>Click2Learn Ingenium Learning Management System 5.1 和 6.1 版本在存储用户密码时使用了弱加密算法，该算法为可逆加密机制，未经身份认证的远程攻击者一旦获取到数据库中存储的密码密文，即可利用该可逆算法轻松解密还原出用户明文密码。该漏洞影响所有运行上述版本系统的用户账户体系，攻击者获得明文密码后可进一步登录系统窃取敏感学习数据或提升权限，造成信息泄露与 unauthorized access，危害等级较高。"
published = "2002-12-31T05:00:00Z"
remediation = "建议将 Click2Learn Ingenium Learning Management System 升级至 6.1 以后版本（如 SumTotal LMS），官方已在新版本中改用不可逆的强加密算法（如 bcrypt/SHA-256）存储密码。若暂无法升级，应立即迁移至现代受支持的 LMS 平台。作为临时缓解措施：将 config/config.txt 等包含密码哈希的配置文件移出 Web 可访问目录，在 Web 服务器层面禁止对 config 目录的 HTTP 访问，并强制所有用户修改密码，同时启用数据库连接加密。建议同时检查是否存在 Bugtraq ID 5969 所述的关联漏洞，一并修复。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Click2Learn Ingenium 学习管理系统密码弱加密可逆泄露漏洞"
updated = "2026-06-16T22:00:17Z"

