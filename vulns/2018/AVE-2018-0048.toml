[basic]
description = "PrestaShop 的 Attribute Wizard 插件 1.6.9 版本中 `modules/attributewizardpro/file_upload.php` 文件存在不受限制的文件上传漏洞（CWE-434）。未经身份验证的远程攻击者可通过直接向服务器上传恶意的 `.phtml` 文件，绕过访问控制触发任意代码执行，导致服务器被完全控制。该漏洞影响 PrestaShop 1.4.0.1 至 1.6.1.18 版本，CVSS 评分 9.8，危害等级严重，攻击者无需任何权限即可远程利用。"
published = "2018-05-10T03:29:00Z"
remediation = '删除或禁用 PrestaShop 的 Attribute Wizard addon (attributewizardpro) 模块，检查所有可能的目录变体（如 attributewizardpro、1attributewizardpro、attributewizardpro.OLD、attributewizardpro_x），直接删除 modules/attributewizardpro/ 整个目录；同时在该目录位置创建 .htaccess 文件，写入 "RewriteEngine On\nRewriteRule \.(php|phtml|php5|pht)$ - [F]" 阻止脚本执行；对所有文件上传功能实施白名单扩展名校验，禁止上传 .php/.phtml/.php5 等可执行文件；升级 PrestaShop 至官方最新版本以确保其他已知漏洞已修复。'
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "PrestaShop Attribute Wizard 插件任意文件上传远程代码执行漏洞"
updated = "2026-06-17T01:34:58Z"

