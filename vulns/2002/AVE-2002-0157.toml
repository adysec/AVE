[basic]
description = "Red Hat Linux 6.2 至 7.2 版本中 DocBook 工具的默认样式表因启用了不安全的选项，导致存在任意文件可写漏洞。本地攻击者可通过在不可信文档中使用完整路径名作为元素标识符，将文件写入当前目录之外的位置，从而覆盖系统关键文件。该漏洞利用条件为需要本地访问权限，CVSS 评分 4.6，危害等级中危。建议用户修改默认样式表配置或升级到修复版本。"
published = "2002-05-29T04:00:00Z"
remediation = "立即安装 Red Hat 安全公告 RHSA-2002:062 提供的更新版 DocBook 样式表包。对于 Red Hat Linux 6.2 至 7.2 系统，运行 `rpm -Uvh docbook-stylesheets-*.rpm` 升级到修复版本。如无法立即打补丁，可移除默认样式表中的不安全选项（`-O` 参数），或限制不可信文档的访问权限作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "Red Hat DocBook Tools 默认样式表任意文件可写漏洞"
updated = "2026-06-16T21:56:55Z"

