[basic]
description = "Adiscon LogAnalyzer 4.1.7 之前版本的 login.php 中存在反射型跨站脚本漏洞。攻击者可通过向登录页面的 Referer 字段中注入恶意 JavaScript 代码，当管理员或用户点击特制的登录按钮时，浏览器会执行攻击者构造的恶意脚本，导致敏感信息泄露或会话劫持。该漏洞无需身份认证即可利用，但需要用户交互（点击链接），CVSS 评分 6.1，危害等级中危。升级至 4.1.7 及以上版本即可修复。"
published = "2018-12-05T21:29:00Z"
remediation = "升级到 Adiscon LogAnalyzer 4.1.7 或更高版本。如无法升级，在 Web 服务器（如 Apache/Nginx）层面添加 WAF 规则过滤 Referer 头中的恶意脚本代码，或对 login.php 的 Referer 参数进行输入验证和输出编码。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Adiscon LogAnalyzer 跨站脚本漏洞"
updated = "2026-06-17T01:50:02Z"

