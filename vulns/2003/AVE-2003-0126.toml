[basic]
description = "Perl CGI.pm 模块的 start_form() 函数存在跨站脚本攻击漏洞。该函数在处理表单 action 参数时未对用户提供的 URL 进行充分过滤，远程攻击者可通过构造包含恶意脚本的特制 URL 并诱导用户访问，将脚本注入到网页表单中。攻击者无需身份认证即可在受影响站点的用户浏览器中执行任意 JavaScript 代码，从而窃取会话令牌、Cookie 或进行其他恶意操作。该漏洞影响使用受影响版本 CGI.pm 的 Perl CGI 应用程序，攻击条件为攻击者能够向受害者发送包含恶意链接的网页或电子邮件。"
published = "2003-08-27T04:00:00Z"
remediation = "升级 Perl CGI.pm 模块至 3.05 或更高版本，通过 CPAN 执行 `cpan CGI` 或 `cpanm CGI` 命令进行更新，或在包管理器中安装对应发行版的安全补丁（如 Debian 的 DSA-371、Red Hat 的 RHSA-2003:256）。如暂时无法升级，可在调用 start_form() 时对 -action 参数手动调用 escapeHTML() 函数过滤特殊字符，或在前端对用户输入进行 HTML 实体编码，阻止脚本注入。"
score = 4.3
severity = "MEDIUM"
sources = ["redhat"]
title = "Debian Linux Perl CGI.pm 跨站脚本漏洞"
updated = "2026-06-16T22:02:31Z"

