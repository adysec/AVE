[basic]
description = "libtasn1 是用于 ASN.1 数据结构编码与解码的开源库，其 4.20.0 版本中 asn1_expend_octet_string 函数存在栈缓冲区溢出漏洞。该函数未对输入数据大小进行有效性校验，远程攻击者可通过向使用该库的应用程序发送恶意构造的 ASN.1 数据，触发栈缓冲区溢出，导致目标程序崩溃并造成拒绝服务。此漏洞攻击复杂度低，无需任何权限与用户交互，仅影响系统可用性，CVSS 评分 7.5，危害等级高。"
published = "2026-01-07T22:15:43Z"
remediation = "立即将 libtasn1 升级至 4.21.0 或更高版本（下载地址：https://ftp.gnu.org/gnu/libtasn1/libtasn1-4.21.0.tar.gz），该版本已通过 merge request !121 修复 `asn1_expend_octet_string` 函数中的栈缓冲区溢出问题。如使用 GnuTLS，需同步更新其依赖的 libtasn1 版本。无法立即升级时，可通过防火墙限制不受信任的外部 ASN.1/DER 数据输入作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "GNU libtasn1 栈缓冲区溢出漏洞"
updated = "2026-06-17T08:33:34Z"

