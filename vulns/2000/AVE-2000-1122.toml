[basic]
description = "NAI Sniffer Agent 在初始认证阶段通过明文 UDP 数据包进行身份验证通信，由于未对认证数据包进行加密或实施严格的源地址验证机制，远程攻击者可通过网络嗅侦技术截获这些明文传输的初始 UDP 认证报文，进而利用截获的信息伪造特权命令发送给目标 Sniffer Agent，成功提升在代理系统上的操作权限。该漏洞影响部署 NAI Sniffer Agent 的系统及网络监控设备，攻击者只需位于同一网络段即可监听到认证流量，且无需任何身份验证即可实施攻击，可导致攻击者获取代理的更高操作权限，进而进一步控制受监控的网络环境，存在严重的安全风险。该漏洞 CVSS 评分为 7.5，危害等级为高危。"
published = "2001-01-09T05:00:00Z"
remediation = "NAI Sniffer Agent 已停止支持且无官方补丁，建议立即停用该服务并迁移至受支持的现代网络分析工具。临时缓解措施：在防火墙上阻断 Sniffer Agent 使用的 UDP 认证端口（默认 513/514/UDP）的外部访问；将 Sniffer Agent 部署于独立网段并严格限制管理主机 IP；禁用不必要的 Distributed Sniffer Agent 远程管理功能，仅允许本地回环接口通信；若必须继续使用，可在主机层面通过 iptables 规则仅允许可信管理主机的 TCP 连接并丢弃所有 UDP 认证报文。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "NAI Sniffer Agent 权限提升漏洞"
updated = "2026-06-16T21:53:17Z"

