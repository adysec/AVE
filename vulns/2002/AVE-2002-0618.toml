[basic]
description = "Automatic File Distributor（AFD）1.2.14 及更早版本存在缓冲区溢出漏洞。本地攻击者可通过设置过长的 MON_WORK_DIR 环境变量，或向 afd、afdcmd、afd_ctrl、init_afd、mafd、mon_ctrl、show_olog、udc 等程序传递超长的 -w（workdir）命令行参数，触发栈溢出，从而提升本地权限并获得系统更高访问权限。该漏洞影响 AFD 1.2.14 及之前所有版本，利用条件为攻击者需具备目标系统的本地访问权限并能执行 AFD 相关程序，危害等级较高。"
published = "2003-04-02T05:00:00.000"
remediation = "建议立即停止使用 AFD 1.2.14 及更早版本，将其卸载并迁移至现代安全的文件分发工具。若无法立即迁移，应通过操作系统权限控制限制低权限用户调用 afd、afdcmd 等相关二进制文件，并严格审计或禁用 MON_WORK_DIR 环境变量的输入。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "AFD 工作目录本地缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:59:26.993"

