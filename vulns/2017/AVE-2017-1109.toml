[basic]
description = "海康威视（Hikvision）多款网络摄像机存在身份验证不当漏洞（CWE-287）。由于设备对用户身份验证的实现存在缺陷，未经身份认证的远程攻击者可通过直接访问特定API接口（如/onvif-http/snapshot、/System/configurationFile等）绕过登录认证，获取设备快照、配置文件等敏感信息，甚至完全接管设备控制权。该漏洞影响DS-2CD2xx2F-I、DS-2CD2xx0F-I、DS-2CD4x2xFWD、DS-2DFx等多个系列固件版本，CVSS评分9.8，危害等级严重。攻击者无需任何凭证即可利用，攻击复杂度低，已存在公开的PoC利用脚本，实际威胁极高。"
published = "2017-05-06T00:29:00.350"
remediation = "立即将受影响的 Hikvision IP Camera 固件升级至厂商提供的最新版本（受影响版本包括 DS-2CD2xx2F-I V5.2.0 build 140721 至 V5.4.0 build 160530 等全系列），升级前可通过在设备网络层面配置 IP 白名单访问控制、禁用不必要的 ONVIF 端口（默认 80/443/554/8000）以及修改默认管理员密码为强密码作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Hikvision 多款网络摄像机身份认证绕过漏洞"
updated = "2026-06-17T01:25:28.927"

