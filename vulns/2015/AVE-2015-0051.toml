[basic]
description = "Combodo iTop 2.2.0 及之前版本的 application/dashboard.class.inc.php 文件中存在跨站脚本（XSS）漏洞。远程攻击者可通过向仪表盘（Dashboard）标题字段注入恶意 Web 脚本或 HTML 代码，当管理员或其他用户访问被篡改的仪表盘页面时，注入的脚本会在浏览器中执行，导致敏感信息泄露或会话劫持。攻击无需身份认证，但需要用户交互（点击或访问恶意链接），影响系统的机密性和完整性。Combodo 已在 2.2.0-2459 版本中修复此漏洞。"
published = "2018-02-20T20:29:00Z"
remediation = "升级 Combodo iTop 至 2.2.0-2459 或更高版本，该版本已在 application/dashboard.class.inc.php 中对仪表盘标题输入进行转义处理，修复了 XSS 漏洞。如无法立即升级，可在 Web 应用防火墙（WAF）层面添加针对 dashboard 标题参数的 XSS 过滤规则作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Combodo iTop 跨站脚本攻击漏洞"
updated = "2026-06-17T00:31:02Z"

