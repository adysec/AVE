[info]
author = "AVE"
description = "Kentico CMS staging service deserialization RCE - sends crafted SOAP request to /CMSPages/StagingService.asmx with .NET deserialized payload to trigger unauthenticated remote code execution"
id = "POC-AVE-2019-0100"
name = "CVE-2019-10068 PoC"
severity = "critical"
tags = [
    "cve-2019-10068",
    "ave-2019-0100",
]
vuln_id = [
    "CVE-2019-10068",
    "AVE-2019-0100",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/CMSPages/StagingService.asmx"
protocol = "http"

[poc.requests.body]
content = '<soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><soap:Body><Sync xmlns="http://tempuri.org/"><taskData></taskData></Sync></soap:Body></soap:Envelope>'
type = "raw"

[poc.requests.headers]
Content-Type = "text/xml; charset=utf-8"
SOAPAction = "http://tempuri.org/ISyncService/Sync"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "SyncResponse",
    "taskData",
]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
