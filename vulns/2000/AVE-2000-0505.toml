[basic]
description = "Microsoft Outlook Express 存在持续邮件浏览器链接漏洞（Persistent Mail-Browser Link），远程攻击者可通过向目标用户发送特制邮件或诱导用户访问恶意网页，在用户浏览器与 Outlook Express 窗口之间建立持久化链接，从而未经授权监视用户的电子邮件内容。该漏洞影响 Outlook Express 5 及更早版本，攻击者无需身份认证即可利用，CVSS 评分 5.0，危害等级中等。攻击者还可结合 JavaScript 脚本进一步窃取邮件数据，ExploitDB 已公开相关利用代码。"
published = "2000-07-20T04:00:00.000"
remediation = "安装 Microsoft 安全公告 MS00-045 对应的更新补丁，升级 Internet Explorer 5.01 SP1 或更高版本（Outlook Express 随 IE 更新）。如无法安装补丁，可将 Internet 区域的安全级别设为「高」并禁用 Active Scripting，同时将 Outlook Express 设置为「受限站点区域」阅读邮件，以阻止 JavaScript 自动执行。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Outlook Express 持续邮件浏览器链接信息泄露漏洞"
updated = "2026-06-16T21:52:11.760"

