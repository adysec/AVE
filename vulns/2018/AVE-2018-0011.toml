[basic]
description = "Cisco IOS 及 IOS XE 软件的 Smart Install 功能存在输入验证不当漏洞，未经身份认证的远程攻击者可向目标设备 TCP 4786 端口发送精心构造的 Smart Install 消息，触发缓冲区溢出，导致设备重启造成拒绝服务、执行任意代码或触发看门狗崩溃。该漏洞影响开启 Smart Install 功能的 Cisco IOS 和 IOS XE 设备，CVSS 3.1 评分 9.8（严重），攻击向量为网络、无需认证、无需用户交互，Cisco 已发布安全公告并发布修复版本修复该漏洞（CSCvg76186）。"
published = "2018-03-28T22:29:01Z"
remediation = "立即升级到受支持版本的Cisco IOS 15.4（最低15.4（17）版本）或Cisco IOS XE 3.18SP或更高版本；关闭设备上的Smart Install功能（命令：no smart-install）；在TCP端口4786上应用ACL限制访问；部署下一代防火墙执行 Deep Packet Inspection以阻止恶意Smart Install消息。若无法立即升级，可临时通过在设备配置文件中添加“no ip http access-class”命令来缓解风险。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Cisco IOS软件远程命令执行漏洞"
updated = "2026-06-17T01:29:59Z"

