[basic]
description = "Macromedia JRun 管理服务器存在身份认证绕过漏洞，远程攻击者无需身份认证即可通过在登录表单 URL 末尾添加额外斜杠（/）绕过认证机制，直接访问管理控制台。该漏洞影响 JRun 3 和 4 版本，攻击复杂度低，无需特殊权限即可利用。成功利用后攻击者可完全控制服务器，执行任意管理操作，包括部署恶意应用、读取敏感数据等，CVSS 评分 10.0，危害等级严重。"
published = "2002-07-11T04:00:00Z"
remediation = "升级 Macromedia JRun 至 4.0 最新更新版本（Updater 5 及以上），该版本修复了 URL 路径中多余斜杠导致认证绕过的缺陷。如使用 JRun 3，应先升级至 JRun 4 再安装更新。临时缓解措施：在反向代理或防火墙层面限制对 JRun Administration Server（默认端口 8000）的访问，仅允许可信管理 IP 连接。由于 JRun 已停止维护，建议迁移至 Adobe ColdFusion 或 Tomcat 等受支持的应用服务器。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Macromedia JRun 管理后台身份认证绕过漏洞"
updated = "2026-06-16T21:57:54Z"

