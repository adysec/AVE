[basic]
description = "Apple iOS 存在跨界内存写入漏洞（CWE-787），源于 WebKit 等组件处理恶意构造的 Web 内容时状态管理不当。未经身份认证的远程攻击者可通过诱导用户访问特制网页或恶意链接，触发越界内存写入，进而实现任意代码执行。该漏洞影响 iOS 12.5.3 及更早版本、iPadOS、watchOS 等 Apple 移动操作系统，CVSS 评分 8.8。Apple 在 iOS 12.5.4 安全更新中修复了此漏洞，并已知存在在野利用报告。"
published = "2021-09-08T14:15:10Z"
remediation = '将 iPhone、iPad 或 iPod touch 升级至 iOS 12.5.4 或更高版本（依次进入"设置"→"通用"→"软件更新"），该补丁修复了 WebKit 中因处理恶意构造 Web 内容导致的内存越界写漏洞。受影响设备包括 iPhone 5s、iPhone 6、iPad Air、iPad mini 2/3 及 iPod touch（第 6 代）。如无法立即升级，应避免点击来源不明的链接或访问可疑网站，以降低被主动利用的风险。'
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Apple iOS 内存破坏远程代码执行漏洞"
updated = "2026-06-17T03:50:50Z"

