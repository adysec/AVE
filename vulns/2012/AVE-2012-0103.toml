[basic]
description = "Apple iOS 5.1 之前版本及 iTunes 10.6 之前版本中使用的 WebKit 引擎存在未明内存破坏漏洞（CWE-119），远程攻击者可通过诱导用户访问特制恶意网站触发内存损坏，导致任意代码执行或拒绝服务（应用崩溃）。该漏洞影响 Safari 5.1.4 之前版本、iOS 5.1 之前版本及 iTunes 10.6 之前版本，CVSS 评分 9.3，危害严重。攻击者无需身份认证，仅需构造恶意网页并诱使用户访问即可利用，Apple 已在 2012 年 3 月安全更新中修复。"
published = "2012-03-08T22:55:03Z"
remediation = "建议立即升级 Apple iOS 至 5.1 及以上版本、iTunes 至 10.6 及以上版本、Safari 至 5.1.4 及以上版本。无法升级时，避免在受影响设备上访问不可信网站，并禁用 JavaScript 作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple iOS 和 iTunes WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:56Z"

