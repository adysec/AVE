[basic]
description = "PHP 的 Apache2 SAPI 组件中的 `php_handler` 函数在处理 `Transfer-Encoding: chunked` 请求时，未正确管理 Apache 的 bucket brigade 数据结构，导致攻击者可通过在分块传输编码的请求体中注入恶意 HTML/JavaScript 代码触发反射型跨站脚本攻击。该漏洞影响 PHP 5.6.38 之前版本、7.0.32 之前版本、7.1.22 之前版本及 7.2.10 之前版本。攻击者无需身份认证，仅需诱使目标用户访问特制 URL 即可在用户浏览器中执行任意脚本，窃取会话凭证或实施钓鱼攻击。CVSS 评分 6.1，危害等级中危。"
published = "2018-09-16T15:29:00Z"
remediation = "升级 PHP 至 5.6.38、7.0.32、7.1.22 或 7.2.10 及以上版本，该漏洞已在 commit 23b05774 中修复。如无法立即升级，可在 Apache 配置中禁用 Transfer-Encoding: chunked 请求体传递，或部署 WAF 规则拦截含分块编码的异常请求。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "PHP Apache2 SAPI 跨站脚本攻击"
updated = "2026-06-17T01:45:20Z"

