[basic]
description = "ISC dhcrelay (DHCP 中继代理) 3.0rc9 及更早版本存在无限循环拒绝服务漏洞。远程攻击者可发送特制 BOOTP 数据包，该包被转发至广播 MAC 地址，因缺少跳数限制导致数据包在网络中无限循环转发，形成包风暴耗尽带宽资源。攻击无需身份认证，仅需网络可达即可触发，影响运行受版本的 DHCP 中继服务，可导致网络瘫痪。CVSS 评分 5.0 (AV:N/AC:L/Au:N/C:N/I:N/A:P)，属可用性影响类漏洞。"
published = "2003-02-07T05:00:00Z"
remediation = "升级 ISC DHCP 软件至 3.0.1 或更高版本。对于无法立即升级的系统，建议在网络边界防火墙或路由器上配置 ACL 规则，拦截或限制异常的 BOOTP 广播流量以缓解拒绝服务风险。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "ISC dhcrelay 无限循环拒绝服务漏洞"
updated = "2026-06-16T22:01:23Z"

