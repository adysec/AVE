[basic]
description = "Windows Win32K 子系统存在不正确的访问控制漏洞。攻击者可在本地环境中利用该漏洞，通过构造特制的应用程序或调用存在缺陷的 Win32k.sys 接口，绕过访问控制机制，从而提升自身权限并执行高权限操作。该漏洞影响 Windows 操作系统内核模式驱动组件，攻击条件为攻击者需具备本地访问权限并已登录系统。Microsoft 已在 2026 年 7 月的安全更新中修复此漏洞。"
published = "2026-07-14T17:16:59.697"
remediation = "立即安装 Microsoft 2026 年 7 月安全更新，通过 Windows Update 自动更新或手动下载对应 KB 补丁修复 Win32k 权限提升漏洞。管理员应优先在域控制器和关键服务器上部署更新，并通过 WSUS 集中管理补丁分发。未及时更新的系统应限制本地登录权限并启用 Windows Defender 攻击面减少规则作为临时缓解措施。"
score = 7
severity = "HIGH"
sources = ["zdi"]
title = "Microsoft Windows Win32k 权限提升漏洞"
updated = "2026-07-22T16:17:40.137"

