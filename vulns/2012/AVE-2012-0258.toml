[basic]
title = "Google Chrome CSS DOM 释放后重用漏洞"
description = "Google Chrome 21.0.1180.57（Mac/Linux）及 21.0.1180.60（Windows/Chrome Frame）之前版本的 CSS DOM 实现中存在释放后重用漏洞。远程攻击者可通过特制文档触发已释放内存的访问，导致拒绝服务，或可能造成其他未指明的影响（如任意代码执行）。攻击条件为诱导用户访问恶意构造的网页。"
severity = "MEDIUM"
score = 6.8
sources = ["cve", "avd", "tenable"]
published = "2012-08-06"
updated = "2024-11-20"
remediation = "升级 Google Chrome 至 21.0.1180.57（Mac/Linux）或 21.0.1180.60（Windows/Chrome Frame）及以上版本。Apple Safari 用户需升级至 6.0.3，iTunes 用户需升级至 11.0.3 以修复此漏洞。"

