[basic]
description = "ConnectWise ManagedITSync 集成组件（2017 版本及更早）在处理 Kaseya VSA 的数据库请求时存在未授权 SQL 注入漏洞。攻击者无需任何身份认证，仅需通过网络访问 Kaseya VSA Web 界面中暴露的 ManagedIT.asmx 页面，即可执行任意 SQL 查询语句（包括读写操作），从而直接获取 Kaseya VSA 数据库的完全控制权限。2019 年 2 月，该漏洞已被攻击者在野外积极利用，通过下载并执行勒索软件载荷，对 VSA 服务器管理的所有终端设备造成严重破坏。该漏洞影响所有使用 ConnectWise ManagedITSync 集成的 Kaseya VSA 环境，CVSS 评分 9.8，危害等级严重。"
published = "2019-02-05T06:29:00.233"
remediation = "该产品（ConnectWise ManagedITSync for Kaseya VSA）已停止维护，无安全补丁可用。立即在 Kaseya VSA 服务器上删除或禁用 ManagedITSync 集成组件，移除 IIS 中 ManagedIT.asmx 页面对外访问权限；在 Web 服务器（IIS）层面配置 URL 访问控制规则，阻止对 /ManagedIT.asmx 路径的匿名访问；如无法立即移除，应在防火墙或反向代理层面限制该路径仅允许受信任管理 IP 访问，并尽快迁移至受支持的 VSA 替代方案。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "ConnectWise ManagedITSync Kaseya VSA集成未授权SQL注入漏洞"
updated = "2026-06-17T01:12:41.377"

