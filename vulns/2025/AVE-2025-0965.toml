[basic]
description = "Linux内核btrfs文件系统在RAID配置下存在逻辑缺陷，代码错误地使用btrfs_set_item_key_safe()函数修改RAID stripe-tree的键值，而非采用安全的btrfs_duplicate_item()复制条目方式，导致B树结构损坏并触发内核BUG，引发系统崩溃。该漏洞影响采用btrfs RAID配置的Linux系统，具有本地低权限访问权限的攻击者可通过特定文件系统操作（如删除文件或执行压力测试工具）触发内核panic，造成拒绝服务攻击。修复方案为改用btrfs_duplicate_item()复制条目并调整键与设备物理地址，以确保树结构完整性。"
published = "2025-02-27T03:15:15.853"
remediation = "升级到包含修复的 Linux 内核版本（≥6.13.0-rc1 及以上），或从主线内核应用修复补丁。具体修复通过修改 fs/btrfs/ctree.c 文件，在 btrfs_delete_raid_extent() 函数中将 btrfs_set_item_key_safe() 调用替换为 btrfs_duplicate_item() 的安全实现。此外，如果您不依赖 btrfs RAID 条带化功能，可通过编辑 /etc/btrfs/raid-stripe-extents 配置文件将其禁用，以避免潜在的树 corruption 风险。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 Btrfs 文件系统 RAID stripe-extents 拒绝服务漏洞"
updated = "2026-06-17T08:44:11.443"

