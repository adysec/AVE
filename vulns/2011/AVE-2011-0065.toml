[basic]
description = "Apple QuickTime 在处理 PICT 文件中的 REGION 记录时存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标系统发送精心构造的 PICT 文件触发该漏洞，导致任意代码执行或应用程序崩溃。该漏洞影响 QuickTime 7.7.3 之前的所有版本，CVSS 评分为 9.3，危害等级为高危。攻击条件为受害者打开或预览恶意 PICT 文件，利用方式是通过 REGION 记录中的超长数据触发栈缓冲区溢出，从而覆盖返回地址并劫持程序执行流程。"
published = "2012-11-09T19:55:01Z"
remediation = "立即将 Apple QuickTime 升级至 7.7.3 或更高版本，可通过 Mac App Store 软件更新或访问 Apple 官网下载安装。如无法立即升级，应避免打开来源不明的 PICT 图像文件，并在浏览器中禁用 QuickTime 插件作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime PICT缓冲区溢出漏洞"
updated = "2026-06-16T23:29:14Z"

