[basic]
description = "Kubernetes ingress-nginx 控制器中存在输入验证不当漏洞（CWE-20），攻击者可通过向 Ingress 资源添加恶意的 `mirror-target` 和 `mirror-host` 注解，向 nginx 配置中注入任意指令。具有 Ingress 资源创建或更新权限的已认证攻击者利用该漏洞可在 ingress-nginx 容器上下文中执行任意代码，并窃取控制器可访问的 Secrets（默认安装下控制器可访问集群所有命名空间的 Secrets）。该漏洞影响所有 ingress-nginx 版本，CVSS 评分 8.8，危害等级高。官方已在 1.11.5 和 1.12.1 版本中修复。"
published = "2025-03-25T00:15:14Z"
remediation = "立即将 ingress-nginx 控制器升级至 v1.11.5 或 v1.12.1 及以上版本。如无法立即升级，通过 Kubernetes 准入控制器（Admission Controller）或 OPA/Gatekeeper 策略禁止使用 `mirror-target` 和 `mirror-host` 注解，并限制 ingress-nginx 控制器对集群 Secrets 的 RBAC 访问权限，仅授予必要的命名空间读取权限。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Kubernetes ingress-nginx 配置注入漏洞"
updated = "2026-06-17T08:38:22Z"

