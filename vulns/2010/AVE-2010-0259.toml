[basic]
description = "RealNetworks RealPlayer 11.0至11.1版本（含Windows、Mac及Linux平台）以及HelixPlayer 1.0.6等多款媒体播放软件的多速率音频处理模块存在堆缓冲区溢出漏洞。远程攻击者可通过构造包含恶意多速率数据的音频流文件，诱使用户在受影响播放器中打开该文件，触发堆缓冲区溢出，导致攻击者能够在目标系统上以当前用户权限执行任意代码。该漏洞CVSS评分9.3，危害等级严重，无需身份认证即可远程利用，但需要用户交互（打开恶意文件）。"
published = "2010-12-14T16:00:04Z"
remediation = "将 RealPlayer 升级至 12.0.1.609 或更高版本（RealNetworks 于 2010 年 12 月发布的安全更新）。Linux 用户应升级至 11.0.2.1744 以上版本。对于 Red Hat Enterprise Linux 4 上的 HelixPlayer，执行 `rpm -e HelixPlayer` 卸载该软件包（RHSA-2010:0981）。临时缓解措施：不要打开或播放来自不可信来源的媒体文件/流，并在浏览器中禁用 RealPlayer 相关插件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer 多速率音频处理堆缓冲区溢出漏洞"
updated = "2026-06-16T23:24:40Z"

