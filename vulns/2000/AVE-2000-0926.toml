[basic]
description = "Ghostscript 在 5.10-16 之前的版本中存在文件覆盖漏洞。该漏洞的原理在于程序在处理文件输出时未能正确验证符号链接（symlink），导致本地攻击者可以通过创建指向其他用户或系统关键文件的符号链接，诱导 Ghostscript 将输出内容写入该链接指向的目标路径。在具有本地访问权限的情况下，攻击者可利用此漏洞覆盖其他用户的合法文件或关键系统配置文件，从而实现权限提升或导致系统不稳定。"
published = "2001-01-09T05:00:00Z"
remediation = "建议将 Ghostscript 升级到 5.10-16 或更高版本以修复符号链接漏洞。在无法立即升级的环境中，可以通过配置严格的文件系统权限，限制本地低权限用户在共享临时目录中创建符号链接，从而降低被攻击的风险。"
score = 3.7
severity = "LOW"
sources = ["cve"]
title = "Ghostscript Ghostscript 符号链接导致的文件覆盖漏洞"
updated = "2026-06-16T21:53:17Z"

