[basic]
description = "Samba 2.0.7 中的 Web 管理工具 SWAT（Samba Web Administration Tool）存在登录审计日志缺失漏洞。当攻击者使用正确的用户名但错误的密码进行登录尝试时，SWAT 不会记录该失败登录事件，导致管理员无法通过日志发现暴力破解攻击行为。远程攻击者可利用此漏洞对系统用户账户进行无限制的密码暴力猜解，而无需担心被日志审计系统发现，严重威胁系统账户安全。该漏洞影响 Samba 2.0.7 版本，攻击者只需能够访问 SWAT 的 Web 管理界面即可发起攻击，无需任何身份认证。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 Samba 至 2.0.8 或更高版本，该版本已修复 SWAT 登录失败日志记录缺失的问题。如无法立即升级，可在 SWAT 服务前端部署反向代理（如 nginx）并配置访问频率限制（如 limit_req_zone），同时将 SWAT 绑定到内网 IP 而非 0.0.0.0，限制仅受信任 IP 可访问，以降低暴力破解风险。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Samba SWAT 登录失败日志缺失漏洞"
updated = "2026-06-16T21:52:48.497"

