[basic]
description = "WordPress Wechat Broadcast 插件 1.2.0 及更早版本中存在目录遍历漏洞，未经身份认证的远程攻击者可通过向 Image.php 文件的 url 参数传入包含 ../ 的恶意路径，读取服务器上的任意文件，如 wp-config.php 等敏感配置文件。该漏洞影响所有安装了该插件的 WordPress 站点，攻击无需任何认证，利用门槛极低，CVSS 评分 9.8，危害等级严重。目前已有公开的 Exploit-DB 利用代码和 Nuclei 检测模板，建议立即升级插件或移除该组件。"
published = "2018-09-24T22:29:00Z"
remediation = '立即删除或停用 Wechat Broadcast 插件（所有版本均受影响，官方已于 2018 年 10 月关闭下架且不再提供更新）。如无法立即删除，可在 Web 服务器配置中添加规则阻止对 `/wp-content/plugins/wechat-broadcast/wechat/Image.php` 的访问：Nginx 使用 `location ~ ^/wp-content/plugins/wechat-broadcast/ { deny all; }`，Apache 使用 `<DirectoryMatch "wechat-broadcast"> Require all denied </DirectoryMatch>`。'
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress Wechat Broadcast 插件目录遍历漏洞"
updated = "2026-06-17T01:44:01Z"

