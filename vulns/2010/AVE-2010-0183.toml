[basic]
description = "RealNetworks RealPlayer 在处理特制 QCP 文件时存在堆缓冲区溢出漏洞。QCP 是 Qualcomm 纯语音编码格式，RealPlayer 在解析该格式文件时未对输入数据进行充分边界检查，导致攻击者可通过构造恶意的 QCP 文件触发堆缓冲区溢出。远程攻击者只需诱使用户在受影响版本的 RealPlayer 中打开特制 QCP 文件即可利用该漏洞，可能导致任意代码执行或程序崩溃。该漏洞影响 RealPlayer 11.0 至 11.1、RealPlayer SP 1.0 至 1.1.4 以及 RealPlayer Enterprise 2.1.2 版本，CVSS 评分 9.3，危害严重。"
published = "2010-10-19T00:00:01Z"
remediation = "将 RealPlayer SP 升级至 12.0.0.879 及以上版本，RealPlayer 11.x 升级至 SP 12.0.0.879，RealPlayer Enterprise 2.1.2 安装官方 2010 年 10 月安全补丁。如无法升级，在防火墙或邮件网关中拦截未知来源的 QCP 文件，并禁用浏览器中 RealPlayer ActiveX 控件的自动播放功能。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer QCP文件解析堆缓冲区溢出漏洞"
updated = "2026-06-16T23:21:01Z"

