[basic]
description = "Netsnap网络摄像头HTTP服务器在1.2.9及之前版本中存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标设备发送超长的HTTP GET请求触发该漏洞，导致服务器执行任意命令。该漏洞影响所有运行Netsnap网络摄像头HTTP服务的设备，攻击者无需任何凭据即可获得远程控制权限，CVSS评分为7.5，危害等级较高。"
published = "2001-01-09T05:00:00Z"
remediation = "将 Netsnap 网络摄像头 HTTP 服务器升级至 1.2.9 或更高版本以修补缓冲区溢出漏洞。如厂商已停止支持且无法升级，建议替换为受支持的网络摄像头设备，并在过渡期间通过防火墙限制对 HTTP 服务端口的访问来源，仅允许受信任的管理地址访问，同时在边界设备上检测并拦截超长 GET 请求以降低被远程利用的风险。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Netsnap 网络摄像头HTTP服务器 缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:53:18Z"

