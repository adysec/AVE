aliases = ["CVE-2025-21420"]

[basic]
title = "Windows 磁盘清理工具特权提升漏洞"
description = "Windows 磁盘清理工具 (cleanmgr.exe) 存在 DLL 劫持漏洞 (CWE-59)，攻击者可在特定系统目录放置恶意 DLL，诱导高权限用户或系统进程运行磁盘清理工具时加载该 DLL，从而实现权限提升至 SYSTEM 级别。攻击者需具备本地低权限访问，无需用户交互即可触发。"
severity = "HIGH"
score = 7.8
sources = ["cve", "msrc", "github"]
published = "2025-02-11"
updated = "2025-02-11"
remediation = "安装 Microsoft 2025 年 2 月安全更新 (KB5051974)，升级至不受影响的 Windows 版本。临时缓解措施包括限制普通用户对系统目录的写入权限，并监控 cleanmgr.exe 的异常 DLL 加载行为。"

[references]
urls = ["https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-21420", "https://nvd.nist.gov/vuln/detail/CVE-2025-21420", "https://github.com/Dmitri131313/CVE-2025-21420-PoC"]

