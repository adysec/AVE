[basic]
description = "Microsoft IIS 5.0 存在一个配置漏洞，当 Index Server 启用并设置 Index 属性时，会导致安全问题。攻击者可以向服务器发送 WebDAV 搜索请求，列出 web 根目录下的文件和文件夹，而不需要身份验证。这个漏洞影响的是启用了 Index Server 的 IIS 5.0 服务器，可能会暴露服务器的文件系统结构。攻击者可以通过上述方式发现服务器目录中的敏感信息，进而可能引发额外的安全风险。漏洞的核心原因是 Index Server 配置不当，应在启用时采取严格的访问控制措施。本文讲述了 CVE-2000-0951 中关于 Microsoft IIS 5.0 配置漏洞的技术细节，CVSS 评分 5.0（中危），攻击者需要网络访问权限，但不需要身份验证。这导致攻击者可能获得目录信息，CVSS 评分中影响因子代表可能通过该漏洞泄露的信息。问题出在 IIS 5.0 中配置不当，这是 IIS 版本中固有的缺陷，需要谨慎评估和修复，以防止信息泄露风险。颁发时间为 2000-12-19。"
published = "2000-12-19T05:00:00.000"
remediation = "立即升级Microsoft IIS至6.0及以上版本，并禁用Index Server组件和目录Index属性。如无法立即升级，可在WebDAV服务中禁用目录列表功能作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "微软 IIS 5.0 目录遍历漏洞"
updated = "2026-06-16T21:52:50.413"

