[basic]
description = "HPE System Management Homepage（SMH）Windows/Linux 版本 7.6.0 及之前版本存在跨站脚本（XSS）漏洞。该漏洞源于程序对用户输入参数未进行充分的过滤与转义处理，具有低权限的远程认证攻击者可通过向 SMH Web 管理界面发送特制的 HTTP 请求，诱使目标管理员用户点击恶意链接，从而在受害者的浏览器会话中执行任意 JavaScript 脚本。成功利用该漏洞可导致敏感信息泄露、会话劫持或页面内容篡改，影响服务器的管理安全。CVSS 评分 5.4，危害等级中危。HPE 已在 SMH 7.6.1 版本中修复此漏洞。"
published = "2018-02-15T22:29:04Z"
remediation = "立即将 HPE System Management Homepage 升级至 v7.6.1 或更高版本。HPE 已发布安全公告 hpesbmu03753 提供修复包，可从 HPE 支持中心下载安装。如无法立即升级，可在防火墙或反向代理层面限制仅允许受信任 IP 访问 SMH 管理端口（默认 2381/TCP），并对管理页面启用 HTTP 严格传输安全（HSTS）和 X-Content-Type-Options 头作为临时缓解。"
score = 5.4
severity = "MEDIUM"
sources = ["nuclei"]
title = "HPE System Management Homepage 跨站脚本漏洞"
updated = "2026-06-17T01:03:28Z"

