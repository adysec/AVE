[basic]
description = 'Quikstore 在线购物车程序存在目录遍历漏洞，由于对"page"参数缺乏充分的输入验证，远程攻击者可通过在参数中注入".."(点号)路径遍历序列，绕过目录访问限制，从而读取服务器上的任意文件。攻击者无需身份认证即可利用此漏洞，仅需向运行 Quikstore 的 Web 站点发送包含特制参数的 HTTP 请求即可触发。成功利用后可获取系统敏感信息，例如配置文件、数据库凭证等，可能为后续入侵提供关键信息支撑。该漏洞影响所有部署了 Quikstore 购物车程序的站点。'
published = "2001-01-09T05:00:00Z"
remediation = '立即将 Quikstore 升级至厂商发布的修复版本（高于 2.9.10），该版本已修复 page 参数目录遍历漏洞。对无法升级的系统，可在 Web 服务器配置中添加规则，过滤请求中包含 ".." 或 "/../" 的 page 参数值，阻断路径穿越攻击。同时限制 Quikstore 运行账户的文件系统访问权限，仅授予必要的最低读取权限，避免攻击者通过目录遍历读取敏感文件。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Quikstore 购物车目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:53:20Z"

