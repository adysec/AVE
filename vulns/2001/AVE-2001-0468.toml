[basic]
description = "BSDI 3.0 和 3.1 版本内核中存在系统调用漏洞，本地用户通过执行特定指令序列可触发内核异常，导致系统崩溃重启。该漏洞为本地拒绝服务漏洞，攻击者需拥有本地访问权限，无需认证即可利用，攻击复杂度低。漏洞影响 BSDI 3.0 及 3.1 版本，CVSS 评分 2.1，危害等级低。目前已有公开的 PoC 代码，厂商未发布官方补丁。"
published = "2001-08-21T04:00:00Z"
remediation = "BSDI 3.0/3.1 已停止维护，官方不再提供安全更新。建议立即迁移至受支持的操作系统（如 FreeBSD 或 OpenBSD 最新稳定版）。如无法立即迁移，可限制不可信用户的本地登录权限，仅允许受信任的管理员账户访问系统控制台和 SSH，以降低本地攻击面。"
score = 2.1
severity = "LOW"
sources = ["exploitdb"]
title = "BSDI BSD/OS 本地内核拒绝服务漏洞"
updated = "2026-06-16T21:55:39Z"

