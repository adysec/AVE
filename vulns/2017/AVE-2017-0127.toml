[basic]
description = "Pivotal Spring Data REST 在处理 PATCH 请求时存在输入校验不足，攻击者可向受影响服务提交特制 JSON 数据（如含 SpEL 表达式的 JSON Patch），在目标服务器上执行任意 Java 代码，进而实现远程代码执行。该漏洞影响 Spring Data REST 2.6.9（Ingalls SR9）之前、3.0.1（Kay SR1）之前版本，以及 Spring Boot 1.5.9、2.0 M6 之前版本。攻击无需身份认证，通过网络发送恶意 PATCH 请求即可利用，CVSS 评分 9.8，危害等级严重。"
published = "2018-01-04T06:29:00Z"
remediation = "立即将 Spring Data REST 升级至 2.6.9（Ingalls SR9）或 3.0.1（Kay SR1）及以上版本；若使用 Spring Boot，请升级至 1.5.9 或 2.0 M6 及以上版本。无法立即升级时，可在网关/防火墙禁用对 Spring Data REST 接口的 PATCH 方法，或限制仅可信来源可访问相关 REST 端点作为临时缓解。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Pivotal Spring Data REST 远程代码执行漏洞"
updated = "2026-06-26T18:44:14Z"

