[basic]
description = "phpMyNewsletter 0.6.10 版本的 customize.php 文件存在远程文件包含漏洞。该漏洞源于程序未对用户输入的 l 参数进行充分过滤和验证，攻击者可通过构造恶意外部 URL 作为参数值，将远程 PHP 代码文件引入并执行。未经身份认证的远程攻击者只需向 customize.php 发送包含恶意链接的 l 参数请求，即可在服务器端执行任意 PHP 代码，进而获取服务器控制权、窃取敏感数据或进一步入侵内网。该漏洞影响运行 phpMyNewsletter 0.6.10 版本的所有系统，CVSS 评分为 7.5，危害等级为高。攻击者无需身份认证即可利用此漏洞，ExploitDB 已公开相关利用代码。"
published = "2002-12-31T05:00:00Z"
remediation = "由于 phpMyNewsletter 项目已停止开发维护，官方未发布针对此漏洞的补丁版本。建议立即停止使用 phpMyNewsletter，迁移至仍在维护的替代方案（如 PHPList、Listmonk、Mailtrain 等）以彻底消除风险。若短期无法替换，应在服务器 PHP 配置中设置 allow_url_include = Off 以阻止远程文件包含，并在 customize.php 的 l 参数处添加输入校验，仅允许白名单内的模板名称或使用 basename() 过滤路径遍历字符，同时审查 include/ 目录下所有通过用户输入动态包含文件的代码路径。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "phpMyNewsletter 0.6.10 远程文件包含漏洞"
updated = "2026-06-16T22:00:14Z"

