[basic]
description = "Adobe Flash Player 存在未指明的内存破坏漏洞，远程攻击者可通过诱导用户访问恶意网页或打开特制的 Flash 文件触发内存损坏，导致任意代码执行或拒绝服务。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上的 Flash Player 9.0.289 之前版本和 10.1.102.64 之前版本，CVSS 评分 9.3，危害等级严重。攻击无需身份认证，但需要用户交互（如点击恶意链接）。Adobe 已发布安全更新修复此漏洞，建议用户升级至最新版本。"
published = "2010-11-07T22:00:02Z"
remediation = "立即升级 Adobe Flash Player 至 9.0.289.0（9.x 系列）或 10.1.102.64（10.x 系列）及以上版本。由于 Adobe 已于 2020 年 12 月 31 日停止对 Flash Player 的支持并建议卸载，强烈建议彻底移除 Flash Player 组件，并在浏览器中禁用 Flash 插件，改用 HTML5 替代方案。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:23:13Z"

