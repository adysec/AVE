[basic]
description = "Pulse Connect Secure 和 Pulse Policy Secure 的管理 Web 界面存在代码注入漏洞（CWE-94），影响 9.1R8.2 以下的所有版本。已通过身份认证的攻击者可通过上传自定义模板至管理 Web 界面，触发模板引擎执行任意恶意代码，从而在服务器端获得高权限远程代码执行能力。该漏洞攻击面为网络可达的管理接口，成功利用后可完全控制设备，造成机密性、完整性和可用性均遭破坏。美国 CISA 已证实该漏洞在野被利用并列入已知被利用漏洞目录（KEV），要求联邦机构在 2021 年 4 月 23 日前完成缓解。Pulse Secure 已在 9.1R8.2 版本中修复此问题，受影响用户应尽快升级至最新安全版本。"
published = "2020-09-30T18:15:29Z"
remediation = "立即升级 Pulse Connect Secure 到 9.1R8.2 或更高版本。如无法立即升级，先下载并导入厂商提供的 XML 配置文件（SA44784）作为临时缓解措施，同时每 24 小时运行一次 Pulse Connect Secure Integrity Tool（KB44755）检查文件系统完整性；若工具检测到哈希不匹配，立即隔离设备并联系厂商进行取证分析，恢复出厂设置后重新安装最新版本，并重置所有管理员及服务账户密码。"
score = 7.2
severity = "HIGH"
sources = ["kev"]
title = "Pulse Secure Pulse Connect Secure 远程代码执行漏洞"
updated = "2026-06-17T03:26:07Z"

