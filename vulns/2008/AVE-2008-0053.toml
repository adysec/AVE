[basic]
description = "Adobe AIR 1.1 及更早版本存在跨站脚本漏洞（CWE-94）。当 AIR 应用程序从不受信任的源加载数据时，远程攻击者可通过未知攻击向量在应用程序上下文中执行不受信任的 JavaScript 代码，实现特权提升。该漏洞无需身份认证，攻击复杂度中等，可通过网络远程利用，导致敏感信息泄露或应用程序被恶意控制。"
published = "2008-11-17T22:21:27Z"
remediation = "建议立即将 Adobe AIR 升级至 1.2 或更高版本。对于开发者，应确保 AIR 应用程序在加载外部数据时对输入进行严格的校验与过滤，避免加载来自不可信源的脚本，以防止特权提升的 JavaScript 执行攻击。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Adobe AIR 远程代码执行漏洞"
updated = "2026-06-16T22:59:16Z"

