[basic]
description = "CVE-2019-9193是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2019-04-01T21:30:45Z"
remediation = "立即将 PostgreSQL 升级至最新稳定版本（推荐 12 及以上），并确保应用最新的安全补丁。如暂无法升级，应执行以下缓解措施：将普通用户从 pg_execute_server_program 预定义角色中移除；通过 pg_hba.conf 严格限制超级用户的远程登录访问，仅允许本地或受控网段连接；避免应用程序使用超级用户账号连接数据库，改用具有最小必要权限的普通账号；在操作系统层面通过 SELinux、AppArmor 等强制访问控制机制限制 PostgreSQL 进程执行外部程序的权限。同时建议启用数据库审计日志，监控 COPY PROGRAM 相关命令的执行情况。"
score = 7.2
severity = "HIGH"
sources = ["nuclei"]
title = "PostgreSQL 远程代码执行漏洞"
updated = "2026-06-17T02:43:19Z"

