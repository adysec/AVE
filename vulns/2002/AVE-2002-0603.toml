[basic]
description = "phpGB 是一个 PHP 留言板程序。login.php 文件在 phpGB 1.20 及更早版本中存在 SQL 注入漏洞，当服务器的 PHP 配置中 magic_quotes_gpc 选项未开启时，未经身份认证的远程攻击者可在登录界面的密码输入字段中注入恶意 SQL 代码，从而绕过身份验证机制并获得管理员权限。该漏洞影响所有使用受影响版本 phpGB 的网站，攻击条件要求目标服务器未启用 magic_quotes_gpc 功能，攻击者只需构造包含 SQL 语句的特制密码即可完成利用，无需任何身份凭证或前置交互。"
published = "2003-04-22T04:00:00Z"
remediation = "建议立即将 phpGB 升级至官方发布的最新修复版本。如暂无法立即升级，应在 PHP 配置文件中启用 magic_quotes_gpc 指令作为临时缓解措施，并修改 login.php 对用户密码输入使用 addslashes() 或 mysql_real_escape_string() 函数进行转义处理后再执行 SQL 查询，防止攻击者通过 SQL 注入获取管理员权限。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "phpGB 1.x login.php SQL注入漏洞"
updated = "2026-06-16T21:59:24Z"

