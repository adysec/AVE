[basic]
description = "xs4all_data_sunftp SunFTP build 9(1) 版本存在缓冲区溢出漏洞，远程未认证攻击者可通过发送超长的 GET 请求触发缓冲区溢出，导致拒绝服务或可能执行任意命令。该漏洞影响 SunFTP build 9(1) 版本，CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），攻击向量为网络、攻击复杂度低、无需认证，可导致机密性、完整性、可用性部分受损。攻击者只需向目标 FTP 服务发送畸形的超长 GET 请求即可触发漏洞，无需身份验证即可实施远程攻击，可能导致服务崩溃或在特定条件下实现远程代码执行。厂商已发布修复版本，建议升级至修复版本。"
published = "2000-11-14T05:00:00.000"
remediation = "建议立即升级 SunFTP 至 build 9(2) 或更高版本（xs4all_data 官方已发布修复版本），或升级至最新稳定版 SunFTP 2.0 以上。如无法立即升级，请在防火墙层面限制 FTP 服务（默认端口 21）仅允许可信 IP 访问，并在 FTP 服务前部署 WAF 规则拦截超长 GET 请求（Content-Length > 4096 字节）。临时缓解措施：在防火墙层面禁止匿名 FTP 访问，限制单个连接最大请求长度 ≤ 2048 字节，并监控异常长 GET 请求日志。建议尽快迁移至现代维护中的 FTP 服务器（如 vsftpd、ProFTPD 等）。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "xs4all SunFTP 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:36.647"

