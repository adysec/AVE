[basic]
description = "Windows 内核存在内存信息泄露漏洞，由于内核未正确清理内存中的敏感数据，导致低权限攻击者可通过本地访问利用该漏洞读取内核内存中的机密信息，包括系统凭证、加密密钥或其他进程的敏感数据。该漏洞影响 Windows 10/11 及 Windows Server 多个版本，CVSS 评分 5.5，危害等级中危。攻击者需具备本地系统访问权限及低权限用户身份，无需用户交互即可触发。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:56Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新 (KB5050061)，通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载安装。该漏洞为本地信息泄露，需攻击者已登录系统，建议同时遵循最小权限原则限制用户账户权限以降低风险。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 内核内存信息泄露漏洞"
updated = "2026-06-17T08:43:05Z"

