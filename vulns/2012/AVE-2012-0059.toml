[basic]
description = "Mozilla Firefox 4.x至11.0、Firefox ESR 10.x至10.0.4、Thunderbird 5.0至11.0、Thunderbird ESR 10.x至10.0.4及SeaMonkey 2.9之前版本在Windows Vista/7系统上使用的cairo-dwrite字体渲染实现存在内存破坏漏洞。该漏洞源于cairo-dwrite未正确限制字体渲染操作，远程攻击者可通过诱导用户访问恶意网页触发内存损坏，导致浏览器崩溃或执行任意代码。CVSS评分9.3，危害严重。"
published = "2012-04-25T10:10:17Z"
remediation = "将 Mozilla Firefox 升级至 12.0 及以上版本（Firefox ESR 升级至 10.0.4 及以上），Thunderbird 升级至 12.0 及以上版本（Thunderbird ESR 升级至 10.0.4 及以上），SeaMonkey 升级至 2.9 及以上版本。如无法立即升级，可在 Windows 系统中禁用 DirectWrite 字体渲染功能作为临时缓解措施：在 Firefox 地址栏输入 about:config，将 gfx.font_rendering.directwrite.enabled 设为 false。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey Cairo-Dwrite 字体渲染内存破坏漏洞"
updated = "2026-06-16T23:37:21Z"

