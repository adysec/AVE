[basic]
description = "MAILsweeper for SMTP 3.x 在处理 ZIP 压缩包内嵌的损坏 CDA 文档时存在缺陷，未能正确校验文件完整性，导致扫描进程异常挂起。未经身份认证的远程攻击者可通过向目标 SMTP 邮件网关发送包含恶意构造 ZIP 附件的邮件触发该漏洞，造成邮件过滤服务拒绝服务。该漏洞影响运行 MAILsweeper for SMTP 3.x 版本的邮件安全网关系统，攻击者无需账号权限，只需构造包含损坏 CDA 文档的 ZIP 文件并作为邮件附件发送即可使邮件处理服务停止响应。"
published = "2000-12-19T05:00:00.000"
remediation = "建议立即升级 MAILsweeper for SMTP 至 ClearSwift 发布的 4.x 版本，该版本已修复对 ZIP 压缩包内损坏 CDA 文档的处理逻辑，不再因异常文件导致终止挂起。若短期内无法完成版本升级，可在邮件网关前部署内容过滤策略，对携带 ZIP 附件的入站邮件进行格式验证，拒绝包含损坏压缩结构的邮件并阻断来自不稳定来源的连接。同时建议在防火墙层限制单连接空转超时时间，防止 SMTP 会话长期僵占用资源。升级后请验证 SMTP 解码引擎在处理含 CDA 文档 ZIP 附件时能正常释放资源并回 ACK 完成会话。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "ClearSwift MAILsweeper for SMTP ZIP归档文件拒绝服务漏洞"
updated = "2026-06-16T21:52:47.807"

