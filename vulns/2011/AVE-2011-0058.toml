[basic]
description = "Plone（基于 Zope 构建的内容管理系统）在 2.5 至 4.0 版本中存在未正确实施身份认证的漏洞。由于 Zope 将 Python 对象及其方法映射为 URL 时，未对部分敏感管理方法施加必要的权限限制，导致远程攻击者无需任何认证即可通过直接访问特定 URL，获取管理员权限、读取或创建任意内容、修改站点皮肤。攻击者可利用该漏洞完全控制受影响系统，危害严重。"
published = "2011-02-03T17:00:03Z"
remediation = "将 Plone 升级至 4.0.1 或更高版本（官方已在该版本中修复未授权访问问题）。如使用 Red Hat 发行版中的 Conga/luci 组件，请安装 RHSA-2011:0393 或 RHSA-2011:0394 提供的更新包。临时缓解措施：在反向代理层限制对 Plone 管理端口的访问，仅允许可信 IP 访问 /manage、/portal_*/ 等敏感路径。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Plone 未授权访问与权限提升漏洞"
updated = "2026-06-16T23:27:56Z"

