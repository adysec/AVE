The description needs to cover: principle (authentication bypass), impact (dotProject 0.2.1.5), attack conditions (remote, no auth needed).

Let me write a clean ≥50 char Chinese description. Output only the value content.<value>dotProject 0.2.1.5 的 index.php 存在身份认证绕过漏洞。由于程序过度信任客户端提交的认证信息，未在服务端进行可靠的会话校验，攻击者无需真实登录凭据，只需在访问目标的 HTTP 请求 Cookie 或 URL 参数中将 user_cookie 值设置为 1，即可绕过正常认证流程，以授权用户身份访问该受限应用。该漏洞影响 dotProject 0.2.1.x 及更早版本，攻击条件极为简单，任意可访问目标应用的远程攻击者均可利用，无需任何账号或认证，从而实现对系统管理功能与数据的完整访问、篡改，对机密性、完整性和可用性造成严重影响，CVSS 评分 10，危害等级严重。"""
published = "2003-04-11T04:00:00Z"
remediation = "建议立即升级 dotProject 到不再存在 user_cookie 认证绕过问题的较新版本（该漏洞影响 0.2.1.x 及更早版本，后续已修复）。若无法升级，应删除或禁止用户通过 URL 与 Cookie 传入 user_cookie 参数——在 Web 服务器（Apache/Nginx）层配置访问规则，拦截包含 user_cookie=1 的请求，同时禁止当前仅根据该参数即判定登录状态的源码逻辑。由于产品长期停止维护，强烈建议迁移到仍受支持的项目管理软件，并为该应用设置仅限内网访问、加装 Web 应用防火墙（WAF）和强制强密码等外围缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
