[basic]
description = "tags.<value>WordPress Visualizer 插件在 3.3.1 及之前版本中存在盲 SSRF 漏洞。攻击者可通过 wp-json/visualizer/v1/upload-data 接口，利用插件对远程 URL 的请求功能，诱导服务器向任意内部或外部目标发起 HTTP 请求。由于该漏洞为盲 SSRF，攻击者虽无法直接获取响应内容，但可探测内网服务、读取敏感文件或配合其他漏洞实现进一步入侵。所有使用该插件的 WordPress 站点均受影响，且无需身份认证即可利用。攻击者仅需构造恶意上传数据请求并指定目标 URL 即可触发漏洞。建议用户升级 Visualizer 插件至 3.3.1 或更高版本进行修复。"
published = "2019-09-30T16:15:11.290"
remediation = '立即将 WordPress Visualizer 插件升级至 3.3.1 或更高版本，可通过 WordPress 后台"插件"页面执行自动更新，或从 https://wordpress.org/plugins/visualizer/ 手动下载安装。如暂时无法升级补丁，建议在 Web 应用防火墙（WAF）或 CDN 安全规则中拦截对 /wp-json/visualizer/v1/upload-data 端点的 POST 请求，或临时停用 Visualizer 插件以消除攻击面。'
score = 10
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress Visualizer插件 服务器端请求伪造漏洞"
updated = "2026-06-17T02:22:59.640"

