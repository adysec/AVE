[basic]
description = "FaSTream FTP++ Server 2.0 的登录认证处理存在缓冲区溢出方面的拒绝服务漏洞。远程攻击者无需身份认证，只需向目标服务器发送包含超长用户名的 USER 命令，即可因服务器对输入长度校验不严、overflow 缓冲区而造成进程崩溃或挂起，使 FTP 服务无法继续提供访问。在特定环境下该缺陷还可能被进一步利用以执行任意命令。攻击仅需目标开放 FTP 端口即可完成，条件简单、危害较高，CVSS 2.0 评分 7.5。"
published = "2001-06-02T00:00:00Z"
remediation = "建议升级至 FaSTream FTP++ 最新版本（Beta 10 Build 3 或更高，该版本已修复同批报告的目录穿越问题，并尽量缓解此拒绝服务问题）；因该漏洞当时无专用补丁，需在网络层面加固：在防火墙或边界设备上限制对 FTP 服务端口（默认 21）的访问，仅允许可信内网主机连接，避免将服务直接暴露于公网。同时启用连接数与流量监控告警，对单会话发送超过 2048 字节的 USER 命令等异常行为进行检测与阻断，可临时限制或封禁发起超长用户名请求的源 IP，以缓解拒绝服务攻击。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "ftp++ FTP Server 拒绝服务漏洞"
updated = "2001-06-02T00:00:00Z"

