[basic]
description = "VMware vCenter Server 的 vSphere Client（HTML5）界面中，Virtual SAN Health Check 插件存在服务端请求伪造（SSRF）漏洞。由于该插件在输入验证方面存在缺陷，未经身份认证的远程攻击者可通过向目标 vCenter Server 的 443 端口发送特制请求，利用 SSRF 漏洞在底层操作系统上以 root 权限执行任意命令，最终实现完全接管服务器。该漏洞影响启用了默认 Virtual SAN Health Check 插件的 vCenter Server 7.0 及 6.7/6.5 版本，CVSS 评分 9.8，危害等级严重。攻击者仅需具备网络访问权限即可完成利用，无需任何凭据，且利用过程可在单次 HTTP 请求内完成，漏洞已被 CISA 列入已知被利用漏洞目录（KEV）。"
published = "2021-05-26T15:15:07Z"
remediation = '将 vCenter Server 升级至修复版本：7.0 升级至 7.0 U2b，6.7 升级至 6.7 U3n，6.5 升级至 6.5 U3p；如暂无法升级，在 vCenter Server Appliance 上通过 SSH 编辑 /etc/vmware/vsphere-ui/compatibility-matrix.xml，在 Matrix 节点内添加 &lt;PluginPackage id="com.vmware.vsphere.client.h5vsan" status="incompatible"/&gt; 将 Virtual SAN Health Check 插件标记为 incompatible，保存后执行 service-control --stop vsphere-ui && service-control --start vsphere-ui 重启服务，并验证 /ui/vropspluginui 路径返回 404。注意仅在 UI 中禁用插件不足以缓解漏洞，必须修改 compatibility-matrix.xml 文件。'
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "VMware vCenter Server 远程代码执行漏洞"
updated = "2026-06-17T03:36:30Z"

