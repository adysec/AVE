[basic]
description = "Apache OFBiz 的 HTTP 引擎（`/webtools/control/httpService` 端点）在处理 XML 请求时未禁用外部实体解析，存在 XML 外部实体注入（XXE）漏洞。未经身份认证的远程攻击者可通过向该端点发送包含恶意 DOCTYPE 声明的 POST 或 GET 请求，利用 `serviceName`、`serviceMode`、`serviceContext` 三个参数触发外部实体引用，从而读取服务器上的任意敏感文件（如配置文件、密码等），导致机密信息泄露。该漏洞影响 Apache OFBiz 16.11.01 至 16.11.04 版本，CVSS 评分 7.5，危害等级高，无需任何权限或用户交互即可远程利用。"
published = "2018-12-13T14:29:00Z"
remediation = "升级 Apache OFBiz 至 16.11.05 或更高版本（官方已在该版本中修复 XXE 问题），建议直接升级至最新稳定版 24.09.07。如无法立即升级，可在反向代理或防火墙层面限制对 `/webtools/control/httpService` 端点的外部访问，仅允许可信 IP 调用该接口作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Apache OFBiz XXE漏洞"
updated = "2026-06-17T02:04:08Z"

