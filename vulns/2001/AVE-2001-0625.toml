[basic]
description = "rdist 6.1.5 存在本地符号链接攻击漏洞，本地攻击者可通过在临时目录中创建恶意的符号链接，诱导 rdist 在处理文件时跟随符号链接指向任意系统文件，从而覆盖目标文件内容，造成完整性破坏。攻击条件为攻击者拥有本地访问权限且目标系统运行受影响版本的 rdist，利用难度较高，需用户交互触发。该漏洞影响 rdist 6.1.5 及可能更早版本。"
published = "2001-03-12T05:00:00.000"
remediation = "升级 rdist 至 6.1.6 或更高版本，该版本修复了 rdist 在处理临时文件时的竞态条件问题，不再在 `/tmp` 等目录中使用可预测的文件名。Mandrake Linux 用户应安装 MDKSA-2001-005 安全更新。如无法升级，限制不可信用户对系统的本地访问权限，并避免在共享环境中以 root 权限运行 rdist。"
score = 1.2
severity = "LOW"
sources = ["cve"]
title = "rdist 任意文件写入漏洞"
updated = "2026-06-16T21:53:41.363"

