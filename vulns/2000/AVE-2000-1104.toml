[basic]
description = "Lotus Notes R5 客户端 R5.0.5 及更早版本的 S/MIME 邮件处理机制存在安全缺陷，当攻击者在邮件传输过程中篡改经过 S/MIME 签名的电子邮件内容时，客户端无法向用户发出有效警告，导致用户无法察觉邮件已被修改。远程攻击者无需身份认证即可利用此漏洞实施中间人攻击，拦截并篡改邮件内容，可能造成敏感信息泄露、数据完整性破坏或进一步的社会工程攻击。该漏洞影响 Lotus Notes R5 系列客户端，CVSS 评分 7.5，危害等级高。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 Lotus Notes 客户端至 R5.0.6 或更高版本（该版本已修复 S/MIME 签名验证缺失问题）。如无法升级，建议改用支持完整 S/MIME 签名校验的邮件客户端（如 Outlook、Thunderbird），并在邮件网关层面启用 TLS 传输加密以防止中间人篡改。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Lotus Notes R5 S/MIME 邮件完整性验证绕过漏洞"
updated = "2026-06-16T21:53:14Z"

