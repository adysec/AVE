[basic]
description = "Trend Micro Apex One及Smart Protection（SEP）代理存在源验证漏洞，攻击者可利用该漏洞绕过进程保护通信机制的身份验证，从而在已获取低权限代码执行的基础上进一步提权至系统级别。该漏洞源于对进程间通信来源校验不足（CWE-346），攻击者需先在目标系统上获得低权限代码执行能力，通过构造恶意请求与受保护进程通信即可触发权限提升，最终完全控制系统。该漏洞影响Apex One及SEP代理的多个版本，CVSS评分7.8（HIGH），危害等级高。Trend Micro已在安全更新中修复此漏洞。"
published = "2026-05-21T14:16:48Z"
remediation = "立即升级 Apex One 或 Vision One SEP Agent 至官方修复版本：本地部署版升级至 SP1 CP Build 18012（现有 SP1 用户）或 SP1 Build 17079（全新安装），并确保 Agent 版本不低于 14.0.0.17079；云端服务版（Apex One as a Service / Vision One SEP）升级 Security Agent 至 build 14.0.20731。可通过 Trend Micro Download Center 下载补丁，或开启自动更新策略自动推送。如暂无法升级，应限制本地低权限账户对 Apex One NT Listener 服务的访问权限，收紧系统本地登录控制，降低攻击面。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Trend Micro Apex One 本地权限提升漏洞"
updated = "2026-07-23T16:10:00Z"

