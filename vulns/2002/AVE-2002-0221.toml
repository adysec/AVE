[basic]
description = "Faq-O-Matic 2.712 的 fom.cgi 脚本存在反射型跨站脚本漏洞，由于对 cmd 参数缺乏输入验证和输出编码，远程未认证攻击者可构造包含恶意 JavaScript 代码的 URL 诱导用户访问，脚本会被注入错误消息并在受害者浏览器中执行。该漏洞影响 Faq-O-Matic 2.6/2.7 版本，攻击向量为网络远程利用，无需身份认证，CVSS 5.0 中危级别，主要影响用户会话完整性和数据机密性，可导致会话劫持、钓鱼攻击或敏感信息窃取。受影响组件为 fom.cgi 的 cmd 参数处理逻辑，攻击载荷通过错误回显页面反射执行。"
published = "2002-05-16T04:00:00Z"
remediation = "建议迁移至活跃维护的 FAQ 系统（如 MediaWiki、DokuWiki 或 BookStack）；若必须继续使用 Faq-O-Matic，需修改 fom.cgi 对 cmd 参数实施严格输入验证（仅允许字母数字）并对输出进行 HTML 实体编码（如使用 HTML::Entities::encode_entities），同时在 Web 服务器配置中添加 Content-Security-Policy: script-src 'self' 响应头作为纵深防御。Debian 用户可参考 DSA-109 升级至 faq-o-matic_2.712-2.woody1 或更高版本。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Faq-O-Matic fom.cgi 跨站脚本攻击"
updated = "2026-06-16T21:57:02Z"

