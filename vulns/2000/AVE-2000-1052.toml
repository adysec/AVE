[basic]
description = "shred 1.0 文件安全擦除工具存在实现缺陷，在打开待覆写文件时未能正确设置文件打开模式，且覆写后未及时刷新缓冲区，导致实际数据未被替换。本地攻击者可利用该漏洞从磁盘中恢复已被 shred 处理过的敏感文件内容，造成敏感信息泄露。该漏洞影响使用 shred 1.0 版本的系统，CVSS 评分 2.1，危害等级低，需本地访问权限。"
published = "2000-12-11T05:00:00Z"
remediation = "升级 GNU coreutils 至 4.0.1 或更高版本，该版本修复了 shred 在覆写文件时未正确打开文件句柄及刷新缓冲区的问题。如无法升级，建议使用 `dd` 或 `wipe` 等替代工具进行安全文件擦除，并避免在关键场景中依赖 shred 的默认行为。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "GNU Coreutils shred 文件数据覆写不完整漏洞"
updated = "2026-06-16T21:52:58Z"

