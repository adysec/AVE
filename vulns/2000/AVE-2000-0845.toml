[basic]
description = "BSD及Linux系统中的行式打印机守护进程（lpd）存在本地权限提升漏洞。该漏洞源于lpd在调用sendmail时未对命令行参数进行充分校验，本地用户可通过构造恶意参数（如使用-C选项指定任意配置文件）诱使sendmail以root权限执行任意命令，从而获取系统最高权限。该漏洞影响多款Linux操作系统发行版，攻击者无需身份认证即可在本地利用，CVSS评分10.0，危害等级严重。"
published = "2000-01-08T05:00:00Z"
remediation = "升级 lpr 软件包至修复版本：Red Hat Linux 4.x/5.x/6.x 用户请安装 Red Hat 官方更新的 lpr-0.48 RPM 包（如 6.1 对应 lpr-0.48-1、5.2 对应 lpr-0.48-0.5.2、4.2 对应 lpr-0.48-0.4.2）。如无法立即安装补丁，可临时禁用行式打印守护进程 lpd 服务（通过 /etc/inetd.conf 注释掉相关行或执行 killall -STOP lpd），或修改 lpr.c 源码中 card() 函数，在处理 cf 文件控制信息前增加输入长度校验：若 strlen(p2) > BUFSIZ-2 则拒绝处理并退出，防止缓冲区溢出导致 sendmail 以任意参数执行。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "BSD Linux lpr 本地权限提升漏洞"
updated = "2026-06-16T21:53:24Z"

