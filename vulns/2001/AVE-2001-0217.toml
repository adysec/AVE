[basic]
description = "stunnel 3.8 及更早版本中存在格式化字符串漏洞，远程攻击者可通过向 stunnel 服务发送特制的 ident 用户名，利用格式化字符串处理缺陷执行任意代码。该漏洞源于程序未正确过滤 ident 协议中的用户名字段，导致格式化字符串函数被调用时解析恶意构造的 %n 等格式标记，从而造成内存写入。攻击者无需身份认证即可远程触发，CVSS 评分 10.0，危害等级严重。受影响的 stunnel 版本需升级至 3.9 或更高版本以修复此漏洞。"
published = "2001-02-12T05:00:00.000"
remediation = "立即升级 stunnel 至 3.9 或更高版本（3.9 于 2000-12-14 发布，修复了 ident 用户名格式化字符串漏洞）。Debian 用户应安装 DSA-009 安全更新，Red Hat 用户安装 RHSA-2000-129 更新，Conectiva 用户安装对应更新。如无法升级，可在 stunnel 配置中禁用 ident 协议支持（设置 ident = no）作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "stunnel 格式化字符串远程代码执行漏洞"
updated = "2026-06-16T21:53:34.827"

