[basic]
description = "Google Chrome 132.0.6834.83 之前版本的 Compositing（合成）组件中存在不当实现漏洞。远程攻击者可通过构造特制的 HTML 页面并诱使用户访问，利用该漏洞实施 UI 欺骗攻击，使用户误认页面内容或来源。该漏洞影响所有基于 Chromium 132.0.6834.83 之前版本的浏览器，攻击复杂度低，无需特权，但需要用户交互配合。Google 已在 Chrome 132.0.6834.83 版本中修复此漏洞。"
published = "2025-01-15T11:15:10Z"
remediation = "升级 Google Chrome 至 132.0.6834.83 或更高版本，可通过 Chrome 设置 > 关于 Chrome 自动检查更新。使用 Chromium 内核的浏览器（如 Edge、Opera）需同步更新至对应版本。Linux 发行版用户通过包管理器更新 chromium 包。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome Compositing 实现不当导致界面欺骗漏洞"
updated = "2026-06-17T08:26:30Z"

