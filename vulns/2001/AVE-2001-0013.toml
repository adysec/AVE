[basic]
description = "rp-pppoe PPPoE 客户端软件（Roaring Penguin 出品，版本 2.4 及之前）在处理 Clamp MSS 选项时存在拒绝服务漏洞。远程攻击者无需身份认证即可向目标系统发送包含零长度 TCP 选项的恶意 TCP 数据包，触发该漏洞导致 rp-pppoe 进程崩溃或停止响应，造成正常 PPPoE 连接中断。该漏洞影响 Red Hat Linux 7.0 等使用 rp-pppoe 2.4 及更早版本的系统，CVSS 评分 5.0，危害等级中等。"
published = "2001-02-12T05:00:00Z"
remediation = "升级 rp-pppoe 至 2.5 或更高版本。Red Hat 用户安装 RHSA-2000-130 提供的更新包；Mandrake 用户安装 MDKSA-2000-084 更新；Conectiva 用户安装公告 000357 对应更新。如无法升级，可在 PPPoE 配置中禁用 Clamp MSS 选项作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Roaring Penguin rp-pppoe Clamp MSS选项拒绝服务漏洞"
updated = "2026-06-16T21:53:30Z"

