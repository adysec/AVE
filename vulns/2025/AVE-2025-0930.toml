[basic]
description = "Linux 内核网络调度模块（net/sched）中的 ETS qdisc 实现存在数组越界索引漏洞。攻击者利用该漏洞需要通过 tc 命令经由 netlink socket 向内核传递特制的 tclass 配置参数，当传入的 classid（clid）为 0 时，ets_class_from_arg() 函数会错误地计算数组下标并越界访问仅含 16 个元素的 ets_class 数组，导致越界读写。成功利用可造成本地权限提升。该漏洞影响使用了 ETS（Earliest TxTime First）排队规则的内核版本，CVSS 评分为 7.8，攻击者需具备本地低权限访问权限，且无需用户交互即可触发。"
published = "2025-02-10T16:15:38.763"
remediation = "升级 Linux 内核至安全版本：5.10.234、5.15.178、6.1.128、6.6.75、6.12.12 或 6.13.1 及更高版本。补丁对 net/sched/sch_ets.c 中 ets_class_from_arg() 函数增加了 arg == 0 或 arg > nbands 的边界检查。如暂无法升级，可临时禁用 ETS qdisc 以缓解风险。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 ETS qdisc 越界索引本地权限提升漏洞"
updated = "2026-06-17T08:44:02.260"

