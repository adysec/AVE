[basic]
description = 'Microsoft SQL Server 及其相关产品（包括 SQL Server 2000、SQL Server 7.0、Data Engine (MSDE) 1.0 以及集成这些产品的第三方软件如 Visio 2000、Compaq Insight Manager 等）在安装时，默认的系统管理员账户 "sa" 密码为空。远程攻击者可通过网络连接利用此配置缺陷，在无需身份验证的情况下直接以管理员权限登录数据库。攻击者一旦进入，可执行任意 SQL 指令，并利用 xp_cmdshell 等功能在宿主机上执行系统级命令，从而获取服务器的完全控制权。该漏洞已被 Voyager Alpha Force 和 Spida 等蠕虫病毒广泛利用。'
published = "2002-08-12T04:00:00Z"
remediation = '立即为 Microsoft SQL Server、SQL Server 7.0 及 Data Engine (MSDE) 1.0 中的 "sa" 账户设置复杂强密码，或通过 SQL Server 管理工具将其禁用。同时，建议在防火墙上封禁 TCP 1433 端口，防止远程攻击者直接访问数据库服务。'
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Microsoft SQL Server 权限提升漏洞"
updated = "2026-06-16T21:53:23Z"

