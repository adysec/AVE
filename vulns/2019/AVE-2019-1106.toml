[basic]
description = "TVT NVMS-1000 网络视频监控设备存在目录遍历漏洞（CWE-22），攻击者可通过发送构造的 GET 请求，利用 `/..` 路径遍历技术绕过 Web 服务器访问控制，读取设备文件系统中任意位置的敏感文件。该漏洞无需身份认证即可远程利用，影响所有运行受影响固件的 TVT NVMS-1000 设备。攻击者可借此获取设备配置文件、日志信息及其他敏感数据，进而进一步渗透内部网络。CVSS 评分为 7.5（高危），攻击复杂度为低，无需用户交互。"
published = "2019-12-30T03:15:10.663"
remediation = "立即升级至TVT NVMS-1000最新官方固件版本以修复目录遍历漏洞。若厂商尚未发布补丁，可采取以下缓解措施：1）在Web服务器或反向代理层配置WAF规则，拦截所有包含../或..%2f的路径遍历请求；2）通过防火墙策略限制仅允许可信管理IP访问设备Web管理界面（默认端口80/443）；3）禁用设备不必要的文件访问功能，最小化攻击面。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "TVT 数码科技 NVMS-1000 目录遍历漏洞"
updated = "2026-06-17T02:29:56.823"

