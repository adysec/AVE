[basic]
description = "Abisoft Baxter IRC 客户端在 BeOS r5 pro 及更早版本中存在拒绝服务漏洞。该漏洞原理是程序在处理包含超长 URL 的消息时缺乏有效的长度校验，导致内存处理异常。远程攻击者无需身份验证，仅需向目标客户端发送包含恶意超长 URL 的消息，即可触发该漏洞，导致应用程序崩溃并产生拒绝服务（DoS）影响。该漏洞主要影响在 BeOS 平台上运行的 Baxter IRC 客户端用户。"
published = "2001-01-09T05:00:00.000"
remediation = "由于该软件已停止维护，建议用户卸载 Abisoft Baxter 或更换为现代安全的 IRC 客户端。若必须使用，可通过在 IRC 服务器端配置消息长度过滤规则，拦截包含超长 URL 的异常消息以缓解拒绝服务攻击。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Abisoft Baxter IRC 客户端 远程拒绝服务漏洞"
updated = "2026-06-16T21:53:16.020"

