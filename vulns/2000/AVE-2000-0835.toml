[basic]
description = "PGP 5.5.x 至 6.5.3 版本存在附加解密密钥（ADK）验证缺陷，攻击者可在修改受害者公钥证书后，将恶意 ADK 嵌入证书的签名部分，由于 PGP 未正确验证 ADK 是否位于证书的签名区域内，导致攻击者能够解密所有使用该被篡改证书加密的数据。该漏洞影响 PGP 全系列加密通信软件，攻击者需具备中间人篡改证书的能力，利用条件相对有限但危害严重，可导致加密通信内容完全泄露。"
published = "2000-10-20T04:00:00Z"
remediation = "立即升级 PGP 至 6.5.4 或更高版本，该版本已修复 ADK 密钥未在证书签名部分校验的问题。如无法升级，应在接收他人公钥时严格验证证书完整性，仅从可信密钥服务器（如 PGP Global Directory）获取公钥，并手动检查证书中是否包含未经授权的 ADK 子密钥。企业用户可部署 S/MIME 替代方案作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "PGP 5.5.x-6.5.3 附加解密密钥(ADK)证书验证漏洞"
updated = "2026-06-16T21:52:15Z"

