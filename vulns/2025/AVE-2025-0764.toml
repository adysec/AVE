建议立即安装 Microsoft 2025 年 1 月安全更新，至少安装 KB5050021 或 KB5050004。这些更新包含对 Windows Telephony Service 的修复，可直接缓解远程代码执行风险。如无法立即部署更新，可临时通过组策略禁用 Telephony Service 功能或限制网络访问端口 554。还应确保系统上的 Windows Defender 实时保护已启用，并应用最新病毒库。系统管理员应立即验证补丁安装状态，并使用 Windows Update 进行补充更新以确保所有相关安全修正均已应用。"""
