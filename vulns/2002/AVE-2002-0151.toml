[basic]
description = "Linux XFree86 4.2.1及之前版本的X服务器MIT-SHM扩展存在共享内存访问漏洞。本地攻击者可通过向MIT-SHM扩展发送特制请求，实现对任意共享内存的读写操作，可能导致系统拒绝服务或权限提升。该漏洞影响Caldera OpenLinux、Conectiva Linux、Debian GNU/Linux、Red Hat Linux、SGI IRIX及Sun Solaris等操作系统。攻击者需拥有本地系统访问权限，利用难度较低，CVSS评分4.6，危害等级中危。"
published = "2002-03-15T05:00:00Z"
remediation = "建议升级 XFree86 至 4.2.1-11 或更高版本。各发行版具体操作：Debian 用户安装 DSA-380 对应更新包；Red Hat 用户应用 RHSA-2003:067 提供的补丁；Caldera OpenLinux 用户安装 CSSA-2002-009.0 更新；Conectiva Linux 用户安装 CLSA-2002:529 更新；SGI IRIX 用户应用 20021001-01-P 补丁；Sun Solaris 用户安装补丁 228529-1 或 1017429.1-1。如无法立即升级，可通过禁用 MIT-SHM 扩展或限制本地用户对 X 服务器的访问权限作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "XFree86 X Server MIT-SHM扩展本地权限提升漏洞"
updated = "2026-06-16T21:56:55Z"

