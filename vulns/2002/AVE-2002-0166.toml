[basic]
description = 'EServ 2.9x（Etype Eserv 2.97）中存在认证绕过漏洞，远程攻击者通过在 URL 路径中插入 "/./" 字符串（如 http://target/protected_file././），即可绕过密码保护机制直接访问受限文件。该漏洞源于服务器对 URL 路径规范化处理不完善，未正确过滤 "//" 与 "/./" 等特殊路径序列，导致访问控制检查被绕过。攻击者无需任何身份认证，仅需网络可达目标服务器的 HTTP 服务即可利用，可导致敏感信息泄露。虽然攻击复杂度低，但仅影响文件读取权限，不涉及代码执行或数据篡改。'
published = "2002-03-25T05:00:00Z"
remediation = '建议立即升级 Eserv 至最新版本（如 3.0 以上），该版本已修复 URL 路径规范化处理缺陷。如厂商已停止维护，应迁移至其他受支持的邮件/Web 服务软件，或在前端反向代理/WAF 层面过滤包含 "/./" 的恶意请求路径作为临时缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Etype EServ 2.97 密码保护文件访问绕过漏洞"
updated = "2026-06-16T21:56:49Z"

