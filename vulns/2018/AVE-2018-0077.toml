[basic]
description = "在思科 ASA（Adaptive Security Appliance）设备web界面中，存在严重的目录遍历（CWE-22）安全漏洞。该漏洞由HTTP URL输入验证不足导致，攻击者可通过精心构造的HTTP请求对文件_list.json等路径进行目录穿透访问，获取目标设备上的敏感系统信息。攻击者无需认证即可远程利用该漏洞，轻则导致设备意外重启引发服务拒绝（DoS）故障，重则可获取未经授权的系统信息。该漏洞影响众多思科产品，包括3000 Series Industrial Security Appliance (ISA)、ASA 1000V Cloud Firewall、ASA 5500/5500-X系列防火墙、ASA Services Module等一系列产品，同时也影响运行于这些设备上的ASA Software和Firepower Threat Defense (FTD) Software版本。攻击环境方面，该漏洞仅适用于IPv4和IPv6的HTTP协议访问，攻击条件较低，实际可利用性较高，相关CVSS评分7.5，危害等级为高。该漏洞最初披露于2018年6月7日，至今仍对许多企业网络设备构成潜在威胁，攻击者可借此获取设备配置、认证信息等敏感数据，最终可能演变为更高级别的系统控制攻击。Cisco已发布安全补丁更新，用户应及时安装最新版本以获取修复。"
published = "2018-06-07T12:29:00Z"
remediation = "根据官方安全公告，应立即将受影响设备升级到支持的固定版本：对于Cisco ASA 9.1系列升级到9.1.7.29，9.2系列升级到9.2.4.33，9.3和9.5系列需迁移到9.4.4.18，9.6系列升级到9.6.4.8，9.7系列升级到9.7.1.24，9.8系列升级到9.8.2.28，9.9系列升级到9.9.2.1。对于FTD软件，6.0系列需升级到6.1.0 HotFix或更高版本，6.1系列需应用Cisco_FTD_Hotfix_EI-6.1.0.7-2.sh等特定补丁。由于该漏洞持续遭到实际攻击，因此不能采取临时缓解措施，必须立即应用这些安全更新以修复CWE-20/CWE-22路径遍历漏洞。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "思科 ASA 自适应安全设备 路径遍历漏洞"
updated = "2026-06-17T01:30:25Z"

