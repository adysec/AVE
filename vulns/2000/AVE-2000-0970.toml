[basic]
description = "Microsoft Windows Media Services 4.0 及 4.1 版本的 Unicast Service 组件存在竞争条件漏洞。远程攻击者可通过向目标服务器发送特制的畸形请求，触发单播服务中的竞态条件，导致 Windows Media Unicast Service 服务崩溃，造成拒绝服务。该漏洞攻击复杂度较高，无需身份认证即可远程触发，影响 Windows NT 4.0 等运行 Media Services 的系统。Microsoft 已发布安全公告 MS00-064 修复此漏洞。"
published = "2000-11-14T05:00:00.000"
remediation = "安装 Microsoft 安全公告 MS00-064 提供的补丁。该补丁通过加强 Windows Media Unicast Service 对畸形请求的协议检查机制，消除竞争条件触发点，防止服务崩溃。可从 Microsoft 下载中心获取补丁：https://www.microsoft.com/download/details.aspx?FamilyId=BF954D4E-3C89-47EF-92E6-5030288731EF"
score = 2.6
severity = "LOW"
sources = ["epss"]
title = "Microsoft Windows Media Services Unicast Service 竞争条件拒绝服务漏洞"
updated = "2026-06-16T21:52:35.773"

