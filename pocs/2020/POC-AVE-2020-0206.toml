[info]
author = "AVE"
description = "检测目标是否使用了存在 XSS 漏洞的 jQuery 版本（1.0.3 <= version < 3.5.0），并通过传递恶意 HTML 到 .html() 方法触发跨站脚本执行。PoC 载荷来自 ExploitDB 49767。"
id = "POC-AVE-2020-0206"
name = "jQuery 1.0.3-3.4.x XSS PoC"
severity = "medium"
tags = [
    "cve-2020-11023",
    "jquery",
    "xss",
]
vuln_id = [
    "CVE-2020-11023",
    "AVE-2020-0206",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/jquery.js"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "jQuery v1.",
    "jQuery v2.",
    "jQuery v3.0",
    "jQuery v3.1",
    "jQuery v3.2",
    "jQuery v3.3",
    "jQuery v3.4",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/jquery.min.js"
protocol = "http"

