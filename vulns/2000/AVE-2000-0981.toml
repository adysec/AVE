[basic]
description = "FreeBSD 系统自带的 listmanager 工具（版本低于 2.105.1）存在缓冲区溢出漏洞。本地攻击者可利用该漏洞向 listmanager 程序发送特制的输入数据，触发缓冲区溢出，从而覆盖进程内存空间，获取额外的系统权限。该漏洞攻击复杂度低，无需认证即可利用，成功利用后可导致机密性、完整性和可用性完全丧失，CVSS v2 评分 7.2，危害等级高。"
published = "2000-11-14T05:00:00Z"
remediation = "升级 listmanager 至 2.105.1 或更高版本。如无法升级，限制不可信用户对 listmanager 程序的本地访问权限，仅允许受信任的管理员用户执行。同时移除 listmanager 的 setuid 位（chmod u-s /path/to/listmanager）以降低提权风险。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Linux Listmanager 缓冲区溢出本地权限提升漏洞"
updated = "2026-06-16T21:52:37Z"

