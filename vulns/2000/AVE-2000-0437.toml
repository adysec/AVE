[basic]
description = "tags as specified.<value>3R Soft MailStudio 2000 2.0 及更早版本中的 mailview.cgi CGI 程序存在路径遍历漏洞。未经身份认证的远程攻击者可通过向该 CGI 脚本发送包含 ..（点号）序列的构造请求，实现目录穿越，从而读取服务器上的任意文件内容。该漏洞影响运行 MailStudio 2000 2.0 及以下版本的 web 服务器，攻击复杂度低，无需事先获取认证凭据即可成功利用。攻击者利用此漏洞可泄露敏感配置文件、密码文件等关键信息，造成信息泄露风险。"
published = "2000-06-09T04:00:00Z"
remediation = "立即升级到 MailStudio 2000 最新补丁版本，或在 Web 服务器配置中禁用 mailview.cgi 与 userreg.cgi 两个 CGI 脚本。具体操作：1) 在 Apache httpd.conf 或 IIS 中通过 RewriteRule/Apache 配置拦截包含 .. 或 %0a 的请求；2) 若无法立即升级，在防火墙或反向代理层对 /mailview.cgi 和 /userreg.cgi 实施访问控制，仅允许可信 IP 访问；3) 长期建议迁移至当前仍在维护的现代邮件系统，如 Microsoft Exchange 或开源替代方案，并定期应用安全更新。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "3R Soft MailStudio 2000 任意文件访问漏洞"
