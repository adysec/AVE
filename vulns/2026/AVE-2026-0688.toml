[basic]
description = "Pillow 图像库的 PdfParser 模块存在解压缩炸弹漏洞。在 `PdfStream.decode()` 方法中，该实现调用 `zlib.decompress()` 时使用 PDF 流长度字段的值作为 `bufsize` 参数，但 Python 的 `zlib.decompress()` 的 `bufsize` 参数只是初始缓冲区大小的提示，不是最大限制。一个精心构造的 FlateDecode 压缩流可以在 PDF 文件尺寸仅为 ~950KB 的情况下解压缩为 1GB 内存，导致运行该代码的服务器内存耗尽或崩溃。攻击者无需任何权限或用户交互，只需提交恶意 PDF 文件即可触发此漏洞。该问题影响所有使用 PIL.PdfParser 解析可信 PDF 文件的应用程序，从 Pillow 5.1.0 版本到 12.3.0 版本均存在，已在 12.3.0 版本中修复。"
published = "2026-07-14T17:17:14Z"
remediation = "升级 Pillow 到 12.3.0 或更高版本，并确保应用程序始终使用最新版本，避免使用受影响的 5.1.0 到 12.2.x 版本。如无法立即更新，可通过将最大允许解压缩大小限制设置为 200MB 进行临时缓解。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Pillow PdfParser.PdfStream 压缩炸弹型服务拒绝漏洞"
updated = "2026-07-21T15:52:40Z"

