[basic]
description = "GNU Mailman 2.0.11之前版本存在跨站脚本漏洞，远程攻击者可通过(1)管理员登录页面或(2)Pipermail索引摘要页面注入恶意脚本代码。当管理员或用户访问被注入恶意脚本的页面时，脚本会在浏览器中执行，导致敏感信息泄露、会话劫持等危害。攻击者无需身份认证即可利用该漏洞，CVSS评分7.5，危害等级高。"
published = "2002-06-18T04:00:00.000"
remediation = "立即升级 GNU Mailman 至 2.0.11 或更高版本，该版本已修复管理登录页面和 Pipermail 索引摘要中的跨站脚本漏洞。如无法立即升级，可在 Web 服务器（如 Apache/Nginx）层面配置输入过滤规则，对 admin 登录页面的 `adminpw` 参数进行严格的 HTML 实体编码，并禁用 Pipermail 归档的 HTML 摘要功能作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "GNU Mailman 跨站脚本漏洞"
updated = "2026-06-16T21:57:20.437"

