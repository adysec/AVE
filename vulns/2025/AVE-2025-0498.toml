[basic]
description = 'Keras 的 `keras.utils.get_file` API 在使用 `extract=True` 选项处理 tar 压缩包时存在路径遍历漏洞。该函数调用 Python 的 `tarfile.extractall` 方法时未启用 `filter="data"` 安全过滤机制，远程攻击者可构造包含恶意符号链接的特制 tar 归档文件，在解压过程中将任意文件写入目标文件系统的任意位置，突破预期目标文件夹的限制。此漏洞与 Python tarfile 模块的底层缺陷（CVE-2025-4517）相关，但仅升级 Python 至修复版本（如 3.13.4）仍不足，还需将 Keras 升级至 3.12 及以上版本方可完全修复。CVSS 评分 8.9，危害等级高。'
published = "2025-10-30T17:15:37Z"
remediation = '立即将 Keras 升级至 3.12.0 或更高版本（该版本在 `tarfile.extractall()` 中启用了 `filter="data"` 安全参数），同时将 Python 升级至 3.13.4 或更高版本以修复底层 tarfile 的 PATH_MAX 符号链接解析缺陷。如无法立即升级，临时缓解措施为：避免对不可信的 tar 压缩包使用 `keras.utils.get_file()` 的 `extract=True` 选项，或自行在提取前对 tar 文件进行安全过滤。'
score = 8.9
severity = "HIGH"
sources = ["msrc"]
title = "Keras keras.utils.get_file 路径遍历漏洞"
updated = "2026-06-17T08:31:38Z"

