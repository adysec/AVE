[basic]
description = "RealNetworks RealPlayer 11.0至11.1 Windows版本在处理RealMedia .IVR文件时存在数组索引错误漏洞。攻击者可通过构造特制的IVR文件，在其中包含畸形的头部信息，诱导用户使用RealPlayer打开该恶意文件，从而触发数组索引越界错误，最终导致远程代码执行。成功利用此漏洞可使攻击者在目标系统上以当前用户权限执行任意代码，完全控制受影响系统。CVSS评分9.3，危害等级严重。"
published = "2010-08-30T20:00:02Z"
remediation = "立即升级 RealPlayer 至 SP build 12.0.0.879 或更高版本（官方安全公告：http://service.real.com/realplayer/security/08262010_player/en/）。如无法升级，建议卸载 RealPlayer 或使用其他媒体播放器替代，并在浏览器中禁用 RealPlayer ActiveX 控件以降低攻击面。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer IVR文件解析数组索引错误远程代码执行漏洞"
updated = "2026-06-16T23:21:56Z"

