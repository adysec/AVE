[basic]
description = "Itetris（智能俄罗斯方块）1.6.2及更早版本的 svgalib 版由于以 setuid root 权限安装，且程序在解压字体文件时通过 system() 函数调用 gunzip，但未指定 gunzip 的绝对路径，而是信任 PATH 环境变量来定位可执行文件。本地攻击者可通过修改 PATH 环境变量，将其指向包含恶意 gunzip 程序的目录（如 /tmp），随后运行 itetris 并传入特制的 .gz 字体文件路径触发解压操作，导致恶意程序以 root 权限执行，从而获取系统完全控制权。该漏洞影响 Linux 系统上安装了 itetris 的所有环境，攻击者无需任何特权即可利用，已存在公开的利用代码。"
published = "2001-02-12T00:00:00Z"
remediation = "建议立即卸载 itetris 软件包（如已不再使用），或移除 itetris 二进制文件的 setuid root 权限：`chmod u-s /usr/local/bin/itetris`。如必须使用，可升级至官方修复版本，或通过修改源码将 gunzip 调用改为绝对路径 `/bin/gunzip` 以消除 PATH 环境变量注入风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "itetris itetris 1.6.1/1.6.2 任意命令执行漏洞"
updated = "2001-02-12T00:00:00Z"

