[basic]
description = "IBM AIX 4.3 及更早版本中 `/usr/lib/lpd/digest` 命令存在缓冲区溢出漏洞。本地低权限攻击者可通过发送超长或特制输入参数触发该溢出，从而在系统上下文中执行任意命令。由于无需身份认证且攻击复杂度低，成功利用可导致攻击者完全控制系统，包括获取 root 权限、读取敏感数据及篡改系统文件。该漏洞影响 IBM AIX 4.3.x 及更早版本，CVSS 评分为 7.2，危害等级高。ExploitDB 已公开相关利用代码，攻击者可借此实现本地提权及远程命令执行。"
published = "2001-01-09T05:00:00.000"
remediation = "安装 IBM 官方 APAR IY08143 补丁（适用于 AIX 4.3.x）或升级至 AIX 4.3.3 及更高版本。若无法立即打补丁，可执行以下临时缓解措施：以 root 身份运行 chmod u-s /usr/lib/lpd/digest 移除该文件的 setuid 位，或直接删除该二进制文件；同时通过 /etc/security/login.cfg 限制本地用户对 lpd 打印子系统的访问权限。建议将系统升级至 IBM AIX 7.x 以获得长期安全支持。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "IBM AIX 4.3 digest 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:53:11.420"

