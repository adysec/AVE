[basic]
description = "Linux 内核 bnxt_re RDMA 驱动在处理内核消费者创建的共享接收队列（SRQ）时，未正确设置 page size 和 page shift 信息，导致执行除法运算时使用错误的除数，触发内核除零错误（divide error）并引发系统崩溃。该漏洞影响使用 RDMA/ib_srq 接口的内核消费者，例如启用 use_srq 选项的 nvme target。攻击者可通过向目标系统发送特制的 RDMA 数据包触发此漏洞，导致目标系统发生内核 panic 并拒绝服务。该漏洞仅影响可用性和完整性，不涉及机密性泄露。受影响的内核版本需包含存在缺陷的 bnxt_re 驱动代码，攻击无需身份认证，远程即可利用。"
published = "2025-03-27T15:15:56Z"
remediation = "建议立即升级 Linux 内核至 6.12.18、6.13.6 或 6.14 及更高稳定版本，或应用官方补丁 commit 2cf8e6b52aecb8fbb71c41fe5add3212814031a2。Ubuntu 24.04 LTS 用户应升级至 6.8.0-84.84 或更高版本，24.10 用户应升级至 6.11.0-26.26 或更高版本。如短期内无法立即升级内核，可临时禁用 NVMe over RDMA target 的 use_srq 功能，或通过 modprobe -r bnxt_re 卸载该内核模块作为缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 bnxt_re RDMA 驱动除零错误漏洞"
updated = "2026-07-30T06:21:55Z"

