[basic]
description = "Windows 电话服务（Telephony Service）中存在堆缓冲区溢出漏洞（CWE-122），未经身份认证的远程攻击者可通过向目标系统发送特制请求触发该漏洞，导致远程代码执行。攻击者无需任何权限，但需要用户交互（如点击恶意链接或打开特制文件）才能成功利用。该漏洞影响多个 Windows 版本，CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 4 月安全更新中修复此漏洞。"
published = "2025-04-08T18:15:45Z"
remediation = "立即安装 Microsoft 2025 年 4 月安全更新。受影响版本对应的修复版本号：Windows 10 1507 升级到 10.0.10240.20978 及以上，Windows 10 1607/Server 2016 升级到 10.0.14393.7969 及以上，Windows 10 1809/Server 2019 升级到 10.0.17763.7136 及以上，Windows 10 21H2 升级到 10.0.19044.5737 及以上，Windows 10 22H2 升级到 10.0.19045.5737 及以上，Windows 11 22H2 升级到 10.0.22621.5189 及以上，Windows 11 23H2 升级到 10.0.22631.5189 及以上，Windows 11 24H2/Server 2025 升级到 10.0.26100.3775 及以上，Windows Server 2022 升级到 10.0.20348.3453 及以上，Windows Server 2022 23H2 升级到 10.0.25398.1551 及以上。可通过 Windows Update 自动更新或访问 Microsoft 更新目录手动下载。如无法立即打补丁，建议禁用不必要的电话服务（TapiSrv）并限制网络暴露面作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Telephony Service 堆缓冲区溢出远程代码执行漏洞"
updated = "2026-06-17T08:42:46Z"

