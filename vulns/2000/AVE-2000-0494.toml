[basic]
description = "Savant Web Server 2.1 及 3.0 版本存在远程缓冲区溢出漏洞。远程攻击者可通过向服务器发送超长 GET 请求触发缓冲区溢出，导致任意代码执行，完全控制目标服务器。该漏洞无需身份认证，攻击复杂度低，仅需发送特制 HTTP 请求即可利用。公开的 ExploitDB 条目（ID: 20066）提供了完整的利用代码，攻击者可据此直接实施远程入侵。"
published = "2000-07-08T04:00:00Z"
remediation = "Savant Web Server 已停止维护，无官方补丁可用。建议立即迁移至 Apache HTTP Server、Nginx 等仍在维护的 Web 服务器。临时缓解措施：在边界防火墙或反向代理上配置规则，拦截 URI 长度超过 1024 字节的 GET 请求，并限制仅允许可信 IP 访问该服务端口（默认 80）。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Michael Lamont Savant WebServer 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:52:10Z"

