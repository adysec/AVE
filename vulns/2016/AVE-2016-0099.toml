[basic]
description = "Adobe Flash Player 存在整数溢出漏洞（CWE-190），攻击者可通过构造特制的 Flash 内容诱导用户访问恶意网页或打开恶意文件触发该漏洞。由于 Flash Player 在处理内存分配时未对整数值进行有效边界检查，导致整数溢出，进而可被利用实现远程代码执行。该漏洞影响 Windows 和 OS X 平台上的 Adobe Flash Player 18.0.0.333 之前版本及 19.x 至 21.x 系列中 21.0.0.182 之前版本、Linux 平台上的 11.2.202.577 之前版本，以及 Adobe AIR 21.0.0.176 之前版本。攻击无需身份认证，但需要用户交互（如点击链接或打开文件），成功利用后可完全控制受影响的系统。Adobe 已在 2016 年 3 月安全公告中发布修复版本。"
published = "2016-03-12T15:59:25Z"
remediation = "立即升级 Adobe Flash Player 至 Windows/macOS 版 21.0.0.182 或 Linux 版 11.2.202.577 及以上版本，Adobe AIR 升级至 21.0.0.176 及以上版本。由于 Flash Player 已于 2020 年底停止支持，建议彻底卸载 Flash Player 并迁移至 HTML5 标准。如暂时无法卸载，可在浏览器中禁用 Flash 插件（Chrome: chrome://settings/content/flash；IE: 管理加载项中禁用 Shockwave Flash Object）作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Adobe Flash Player 整数溢出远程代码执行漏洞"
updated = "2026-06-17T00:41:06Z"

