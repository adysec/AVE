[basic]
description = "tags.<value>Apple CoreMedia 组件在处理 H.264 编码的电影文件时存在缓冲区溢出漏洞，影响 iTunes 10.5 之前版本以及 QuickTime 7.7.1 之前版本。未经身份认证的远程攻击者可通过诱导用户打开特制的 H.264 编码电影文件触发该漏洞，成功利用可导致应用程序崩溃或远程执行任意代码，CVSS 评分 9.3，危害等级高危。"
published = "2011-10-12T18:55:01Z"
remediation = "升级 iTunes 至 10.5 或更高版本，并升级 QuickTime 至 7.7.1 或更高版本。对于 OS X Lion 系统，请升级至 OS X Lion v10.7.2；对于 Mac OS X v10.6 系统，请安装 Security Update 2011-006。如无法立即更新，请避免打开来历不明的 H.264 编码电影文件（.mov）作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple iTunes H.264编码视频缓冲区溢出漏洞"
updated = "2026-06-16T23:32:54Z"

