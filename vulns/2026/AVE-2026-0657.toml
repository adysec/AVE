[basic]
description = "Gitea 通知 API 存在信息泄露漏洞，当用户对私有仓库的访问权限被撤销后，虽然通知响应中的 `repository` 字段被正确置空，但 `subject` 字段仍会泄露私有 Issue 或 Pull Request 的标题、状态、API 及 HTML 链接、最新评论 URL 等敏感元数据。攻击者只需在拥有访问权限时接收过通知，即可在权限撤销后通过 `GET /api/v1/notifications` 和 `GET /api/v1/notifications/threads/{id}` 接口持续监控私有仓库的活动动态。该漏洞影响 Gitea v1.26.2 及之前版本，CVSS 评分 7.5，危害等级高，已在 v1.26.4 版本中修复。"
published = "2026-07-03T21:17:05Z"
remediation = "立即升级 Gitea 至 v1.26.4 或以上版本（该版本修复了通知 API 在访问撤销后泄露私有 issue 元数据的问题）。如无法立即升级，可临时在反向代理层对 `/api/v1/notifications` 和 `/api/v1/notifications/threads/` 端点添加访问审计日志，监控异常通知读取行为，并尽快安排升级窗口完成版本更新。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Gitea 通知 API 访问撤销后泄露私有问题元数据漏洞"
updated = "2026-07-06T18:18:46Z"

