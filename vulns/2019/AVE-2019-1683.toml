[basic]
description = "Zimbra Collaboration Suite 的 ProxyServlet 组件存在服务端请求伪造（SSRF）漏洞。未经身份认证的远程攻击者可利用该漏洞，通过构造包含特定端口号的 Host 头绕过管理员权限校验，将请求代理至本地管理端口 7071。结合 Autodiscover 请求处理中的 XML 外部实体注入（XXE）漏洞，攻击者可首先读取本地配置文件获取管理员凭据，再利用 SSRF 获取全局管理员认证令牌，最终通过 ClientUploader 扩展上传 WebShell 实现远程代码执行。该漏洞影响 Zimbra Collaboration Suite 8.6 至 8.8.x 多个版本，CVSS 评分为 7.5（高危），无需用户交互即可在公开 Web 端口上完成全链路利用。"
published = "2019-04-30T18:29:08Z"
remediation = "Zimbra官方已发布安全补丁修复ProxyServlet组件的SSRF漏洞：8.6版需升级至8.6 Patch 13（该版本已停止支持，建议直接升级至8.7.11及以上长期支持版本），8.7.x需升级至8.7.11 Patch 10，8.8.x需升级至8.8.10 Patch 7或8.8.11 Patch 3。升级前请务必备份邮件数据和系统配置，执行升级包安装后需重启Zimbra服务使补丁生效，并通过浏览器访问ProxyServlet测试修复效果。如暂无法立即升级，可在防火墙层面限制对ProxyServlet组件的外部访问，或在前端反向代理层拦截包含外部URL的请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Zimbra Collaboration Suite 服务端请求伪造漏洞"
updated = "2026-06-17T02:44:03Z"

