[basic]
description = "FreeBSD 4.4 的 AIO（异步 I/O）库存在跨进程内存写入漏洞。当某些 AIO 操作在调用 execve 系统调用后仍被延迟执行时，本地攻击者可以利用这一时间差，通过精心构造的 AIO 请求覆盖新进程的内存空间，从而劫持进程执行流并提升权限。该漏洞需要本地访问权限且利用复杂度较高，但成功利用后可完全控制受影响的系统。"
published = "2001-12-10T05:00:00Z"
remediation = "升级至 FreeBSD 4.5 或更高版本，该漏洞已在 FreeBSD 4.5-RELEASE 中修复。如无法升级，可通过在内核配置中禁用 AIO 支持（options NO_AIO）并重新编译内核来缓解风险。对于仍在运行 FreeBSD 4.x 的系统，强烈建议迁移至受支持的 FreeBSD 版本（如 13.x 或 14.x）。"
score = 6.2
severity = "MEDIUM"
sources = ["exploitdb"]
title = "FreeBSD 4.4 AIO 库跨进程内存写入本地权限提升漏洞"
updated = "2026-06-16T21:55:45Z"

