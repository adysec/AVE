[info]
author = "AVE"
description = "检测 SuSE Linux Apache 是否暴露 /doc/packages 目录，导致已安装软件包信息泄露"
id = "POC-AVE-2000-0742"
name = "SuSE Linux Apache /usr/doc 目录信息泄露 PoC"
severity = "medium"
tags = ["cve-2000-1016"]
vuln_id = [
    "CVE-2000-1016",
    "AVE-2000-0742",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/doc/packages/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Index of",
    "packages",
    "Package",
]
