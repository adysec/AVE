[basic]
description = "Google Chrome V8 引擎存在堆缓冲区溢出漏洞（CWE-787），远程攻击者可构造恶意 HTML 页面，诱使用户在受影响浏览器中打开该页面，从而触发 V8 的堆越界写入并导致堆内存损坏。该漏洞影响 Google Chrome 88.0.4324.150 之前的所有版本，以及基于 Chromium 内核的浏览器（如 Microsoft Edge、Opera 等），CVSS 评分 8.8，危害等级高。成功利用可造成数据机密性、完整性和可用性的完全损失，实现远程代码执行。CISA 已将此类攻击手段标记为野外活跃利用，Google 已在 2021 年 2 月发布的安全更新中修复此漏洞，用户应升级至 Chrome 88.0.4324.150 或更高版本。"
published = "2021-02-09T16:15:12.390"
remediation = '立即将 Google Chrome 浏览器升级至 88.0.4324.150 或更高版本，可通过 Chrome 菜单"帮助">"关于 Google Chrome"自动检查并安装更新，或从 Google 官网下载最新稳定版安装包覆盖安装。若无法立即升级，建议临时切换至其他安全浏览器访问不可信网页，并在防火墙或代理层面过滤包含恶意构造数据的 HTML 页面作为临时缓解措施。'
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome V8 堆缓冲区溢出漏洞"
updated = "2026-06-17T03:34:54.850"

