[basic]
description = "Linux 内核 ipvlan 网络虚拟化驱动存在安全漏洞，`ipvlan_process_v6_outbound()` 函数在处理 IPv6 出站数据包时，错误地假设 IPv6 网络标头一定位于套接字缓冲区（skb）的线性内存区域（head）中，而未预先通过 `pskb_network_may_pull()` 确保该标头已完整拷贝到线性部分。当 skb 数据实际分散在非线性内存片段时，函数将访问未初始化的内存区域，触发 KMSAN 检测到的未初始化值读取，进而导致 IPv6 地址类型判断错误、路由查找异常或系统崩溃。该漏洞同时影响 IPv4 和 IPv6 处理路径，存在于使用 ipvlan 虚拟网络接口的 Linux 内核版本中。攻击者需要在拥有本地权限（L）的容器或网络命名空间环境中，通过发送特制的 IPv6 数据包触发此条件，从而可能造成拒绝服务（DoS）或系统不稳定等影响。Linux 内核社区已通过在 IPv4 和 IPv6 处理函数中增加 `pskb_network_may_pull()` 调用修复此问题，确保网络标头始终位于 skb 线性内存中再进行处理。"
published = "2025-03-27T15:15:57Z"
remediation = '建议将 Linux 内核升级至以下修复版本之一：上游主线 6.14-rc5 或更高版本、6.1.130、6.6.81、6.12.18、6.13.6。Debian 12 (bookworm) 用户应升级内核至 6.1.133-1 或更高版本，Debian 11 (bullseye) 用户应通过 backports 升级至 6.1.180-1~deb11u1；Ubuntu 24.04 LTS 用户应执行 apt upgrade 安装 linux 6.8.0-84.84 或更高版本（AWS 6.8.0-1039.41、Azure 6.8.0-1038.44、GKE 6.8.0-1036.40）；Ubuntu 22.04 LTS 用户应升级 linux-aws-6.8 至 6.8.0-1039.41~22.04.1 或 linux-azure-6.8 至 6.8.0-1036.42~22.04.1；Ubuntu 24.10 用户应升级至 6.11.0-26.26。如系统暂无法升级内核且业务无需使用 ipvlan 虚拟网卡功能，可通过 echo -e "blacklist ipvlan" >> /etc/modprobe.d/disable-ipvlan.conf 并执行 update-initramfs -u 禁用 ipvlan 模块作为临时缓解措施，但必须在维护窗口内完成内核升级以彻底消除漏洞。'
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 ipvlan 驱动未初始化内存读取漏洞"
updated = "2026-06-17T08:44:32Z"

