[basic]
description = "Id Software Quake 1.0/1.9 及 ProQuake 1.01 及更早版本存在 UDP 数据包处理缺陷，远程攻击者无需身份认证即可向目标服务器发送特制的空 UDP 数据包，触发服务崩溃，导致拒绝服务。该漏洞攻击复杂度低，无需用户交互，仅影响系统可用性。"
published = "2000-11-01T05:00:00Z"
remediation = "建议升级至 ProQuake 1.02 或更高版本（该版本已修复空 UDP 包处理逻辑）。对于原版 Quake 1，建议迁移至社区维护的现代源码移植版（如 QuakeSpasm、DarkPlaces），这些版本已修复此拒绝服务漏洞。如无法升级，可在网络边界防火墙或主机 iptables 层面添加规则，丢弃发往 Quake 服务端口（UDP 26000）的异常短包作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Id Software Quake 1.0/1.9 UDP Packet 拒绝服务漏洞"
updated = "2026-06-16T21:53:06Z"

