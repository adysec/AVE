[basic]
description = "Oracle WebLogic Server 的 Web Services 组件中存在 XMLDecoder 反序列化漏洞（CVE-2017-3506），远程攻击者可通过 HTTP 协议向目标服务器发送特制的 XML 数据包，触发 XMLDecoder 反序列化处理机制，导致攻击者能够未授权访问或篡改 WebLogic Server 中的关键数据。该漏洞影响 WebLogic Server 10.3.6.0、12.1.3.0、12.2.1.0、12.2.1.1 及 12.2.1.2 版本，攻击复杂度较高，但无需身份认证即可远程利用，CVSS 评分 7.4，危害等级高。Oracle 已在 2017 年 4 月关键补丁更新中修复此漏洞。"
published = "2017-04-24T19:59:03.037"
remediation = "立即安装 Oracle 2017 年 4 月关键补丁更新（CPU Apr 2017）中针对 WebLogic Server 的安全补丁，升级至 10.3.6.0 及以上、12.1.3.0 及以上、12.2.1.3 及以上版本。如无法立即打补丁，可在 Web 应用防火墙或反向代理层面拦截对 /wls-wsat/、/soa-infra/ 等 WebService 路径的 POST 请求，或删除 WebLogic 中不使用的 wls-wsat.war 部署包作为临时缓解措施。"
score = 7.4
severity = "HIGH"
sources = ["kev"]
title = "Oracle WebLogic Server XMLDecoder 反序列化漏洞"
updated = "2026-06-17T01:18:26.670"

