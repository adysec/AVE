[basic]
description = "AnalogX Proxy Server 4.04 及更早版本中存在缓冲区溢出漏洞，远程攻击者可通过向 POP3 协议发送超长的 USER 命令触发该漏洞，导致代理服务进程崩溃，造成拒绝服务。该漏洞影响 AnalogX Proxy Server 全系列早期版本，攻击者无需身份认证即可通过网络远程利用，危害等级中等。"
published = "2000-07-25T04:00:00.000"
remediation = "升级 AnalogX Proxy 至 4.05 或更高版本（最新版为 4.15），该版本已修复 SMTP/POP3/FTP 处理中的缓冲区溢出漏洞。从 analogx.com 下载最新版本覆盖安装即可。如无法升级，可在防火墙中限制对 POP3 端口的访问，仅允许可信 IP 连接。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "AnalogX Proxy Server 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:12.437"

