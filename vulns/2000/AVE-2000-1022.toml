[basic]
description = "Metertek 开发的 pagelog.cgi 存在目录遍历漏洞，远程攻击者可通过向 name 或 display 参数提交包含 `..`（点点）序列的恶意请求，绕过路径限制读取服务器上的任意文件。该漏洞源于程序未对用户输入的文件名参数进行充分的路径过滤和校验，攻击者无需身份认证即可利用，可能导致敏感信息泄露（如配置文件、密码文件等）。该漏洞影响使用 pagelog.cgi 的 Metertek 产品，CVSS 评分 6.4，危害等级中危。"
published = "2000-12-19T05:00:00.000"
remediation = '立即删除或禁用服务器上的 pagelog.cgi 脚本，该脚本已停止维护且存在目录遍历漏洞。如仍需使用日志功能，改用经过安全审计的替代方案（如 Apache 自带日志模块），并对所有用户输入参数（name/display）进行严格的路径规范化过滤，拒绝包含 ".." 或 "/" 的输入。'
score = 6.4
severity = "MEDIUM"
sources = ["cve"]
title = "Metertek pagelog.cgi 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:52:48.903"

