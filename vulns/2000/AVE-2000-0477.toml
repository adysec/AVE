[basic]
description = "Cisco Secure PIX 防火墙在处理伪造的 TCP 重置（RST）数据包时存在安全验证缺陷，远程攻击者可通过向目标防火墙发送特制的 TCP RST 数据包，伪造合法连接的中断信号，强制防火墙关闭正在进行的正常 TCP 连接，导致拒绝服务。该漏洞影响 PIX Firewall 2.7/3.x/4.x/5.x 版本，攻击无需身份认证，利用难度较低。"
published = "2000-03-20T05:00:00Z"
remediation = "升级 Cisco PIX 防火墙软件至 5.2(1) 或更高版本，该版本已正确验证 TCP RST 包的序列号，防止伪造的 RST 包中断合法连接。对于已停止支持的旧版本（2.7/3.x/4.x/5.1），建议迁移至受支持的 Cisco 安全设备（如 ASA 系列）并应用最新固件。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Cisco PIX Firewall TCP伪造RST包安全绕过漏洞"
updated = "2026-06-16T21:52:06Z"

