[basic]
description = "libX11 X 客户端库存在拒绝服务漏洞，当接收到资源掩码值为 0 的请求时，libX11 会进入无限循环导致进程挂起。攻击者无需身份认证即可通过向目标 X 服务器发送特制的资源掩码数据包触发该漏洞，造成服务不可用。该漏洞影响 Open Group X11r6 3.3.3/3.3.4/3.3.5/3.3.6/4.0 等版本，CVSS 评分为 5.0，危害等级中等。"
published = "2000-06-19T04:00:00.000"
remediation = "升级 XFree86 至 4.0.1 或更高版本（X11R6 3.3.x 用户升级至 3.3.7），修复 libX11 在处理 resource_mask 为 0 时进入无限循环的漏洞。如无法立即升级，应在防火墙或 xinetd 配置中禁用 XDMCP 服务（TCP 端口 177/UDP 端口 177），并移除 xterm、xlock、xscreensaver 等 X 客户端程序的 setuid/setgid 权限位，避免以 root 身份运行 xdm 等 X 会话管理器，阻断攻击者通过恶意 X 服务器触发无限循环或进一步利用的路径。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "X.Org X11 libX11 远程拒绝服务漏洞"
updated = "2026-06-16T21:52:07.550"

