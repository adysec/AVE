[basic]
description = "IRIX 操作系统中 /usr/bin/lpstat 工具存在缓冲区溢出漏洞。本地攻击者可通过向 -n 参数传递超长字符串触发缓冲区溢出，覆盖内存中的返回地址，从而获取 root 权限。该漏洞影响 IRIX 5.3/6.2/6.3/6.4/6.5/6.5.11 等多个版本，攻击者需拥有本地系统访问权限，无需身份认证即可利用，CVSS 评分 7.2，危害等级高。成功利用后攻击者可完全控制目标系统，执行任意代码。"
published = "2000-10-20T04:00:00.000"
remediation = "IRIX 已停止维护，SGI 不再提供安全更新。建议立即移除 /bin/lpstat 的 setuid 权限（chmod u-s /bin/lpstat），防止本地用户通过该程序提权。同时限制非授权用户登录系统，并尽快迁移至受支持的操作系统平台。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "SGI IRIX lpstat 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:52:29.807"

