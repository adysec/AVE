[basic]
description = "D-Link DIR-610 路由器存在命令注入漏洞，攻击者可通过向 command.php 脚本的 cmd 参数注入恶意操作系统命令，在无需身份认证的情况下实现远程代码执行。该漏洞影响 D-Link DIR-610 设备及其固件版本，CVSS 评分 8.8（高危），攻击复杂度低且无需用户交互。CISA 已知利用漏洞目录已收录该漏洞，厂商已停止对该产品的维护支持，建议用户更换设备或采取网络隔离措施缓解风险。"
published = "2020-07-09T13:15:10.653"
remediation = "立即停止使用 DIR-610 并更换为 D-Link 在产的支持型号（如 DIR-868L 或 DIR-890L），因该设备已于 2014 年终止支持且无后续固件补丁。若暂时无法更换，须将设备从公网移除并置于隔离 VLAN 中，禁用远程管理（WAN 端 HTTP/HTTPS 访问），修改默认管理员密码并启用 WPA3 加密，同时通过防火墙阻止对 command.php 和 cmd 参数的所有入站流量。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "D-Link DIR-610 代码注入漏洞 漏洞"
updated = "2026-06-17T03:27:50.537"

