[basic]
description = "BitchX IRC 客户端在处理邀请（INVITE）消息时未对不可信的格式字符串进行适当清理。远程攻击者可构造包含特殊格式化字符的频道名称，通过发送恶意 INVITE 消息触发拒绝服务漏洞，导致目标客户端崩溃或无法正常响应。该漏洞影响 BitchX IRC Client 1.0c16 及之前版本，攻击无需身份认证，利用门槛低，危害等级中等。"
published = "2000-07-04T04:00:00.000"
remediation = "升级 BitchX IRC Client 至 1.0c17 或更高版本（已修复格式字符串漏洞）。若暂时无法升级，可在 IRC 服务器端配置拦截包含格式化字符（如 %n、%s、%x 等）的频道名邀请，或在客户端禁用自动接受邀请功能（/SET AUTO_INVITE OFF）作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "BitchX IRC Client 格式化字符串拒绝服务漏洞"
updated = "2026-06-16T21:52:04.317"

