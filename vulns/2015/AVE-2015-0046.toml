[basic]
description = "WordPress 的 MDC YouTube Downloader 插件 2.1.0 版本中 includes/download.php 存在绝对路径遍历漏洞（CWE-22）。远程攻击者无需身份认证即可通过 file 参数传入完整绝对路径，绕过目录限制读取服务器上的任意文件，导致敏感信息泄露。攻击条件简单，仅需目标站点安装并启用该插件即可利用，CVSS 评分 7.5，危害等级高。"
published = "2017-05-23T04:29:00Z"
remediation = "立即停用并删除 MDC YouTube Downloader 插件，该插件已因安全原因从 WordPress 官方仓库下架且不再维护。如必须保留下载功能，可替换为其他活跃维护的 YouTube 下载插件（如 YouTube Embed 或 Download YouTube Videos）。若暂时无法删除，在 Web 服务器（Nginx/Apache）层面添加规则阻止对 `/wp-content/plugins/mdc-youtube-downloader/includes/download.php` 的访问，或在 WAF 中拦截包含 `file` 参数包含绝对路径（如 `/etc/`、`/var/`）的请求。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress MDC YouTube Downloader 插件 2.1.0 文件绝对路径遍历漏洞"
updated = "2026-06-17T00:29:10Z"

