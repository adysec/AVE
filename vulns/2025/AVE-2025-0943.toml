[basic]
description = "tags.<value>Linux内核VXLAN模块中vxlan_vnifilter_dump()函数存在未初始化值访问漏洞。当netlink消息载荷长度小于struct tunnel_msg结构体大小时，该函数会访问消息边界之外的字节，读取未初始化的内核内存。攻击者需具备本地访问权限，通过发送特制的netlink消息触发该漏洞，可能导致内核信息泄露或系统不稳定。该漏洞影响使用受影响Linux内核版本的系统，CVSS评分为5.5（中等），需本地访问权限且无需用户交互即可触发。"
published = "2025-02-27T02:15:15.273"
remediation = "建议立即升级 Linux 内核至已修复版本：SUSE Linux Enterprise 15 SP6 Azure 内核请应用 SUSE-SU-2025:0847-1 补丁；Debian 11 用户请安装 DLA-4102-1 中提供的内核更新；Ubuntu 22.04 LTS 用户请应用 USN-7653-1 安全更新。如无法立即更新内核，可临时禁用 VXLAN 模块（modprobe -r vxlan）或通过 sysctl 限制非特权用户访问 netlink 接口作为缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 VXLAN 未初始化值越界访问漏洞"
updated = "2026-06-17T08:44:06.397"

