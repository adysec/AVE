[basic]
description = "Sudo 在 1.9.5p2 及之前版本中存在堆缓冲区溢出漏洞（Baron Samedit），源于命令行参数解析时的 off-by-one 错误。当使用 sudoedit -s 模式并传入以单个反斜杠字符结尾的命令行参数时，可触发堆溢出，导致本地低权限用户绕过权限验证直接提升至 root 权限。该漏洞影响主流 Linux 发行版（包括 Ubuntu、Debian、CentOS、Fedora 等）中的默认 sudo 包，CVSS v3.1 评分为 7.8（高危），无需交互即可利用，且无需密码验证。攻击者可在任意普通用户账户下通过构造特制命令行参数实现完整的 root 权限获取，危害极大。"
published = "2021-01-26T21:15:12Z"
remediation = "立即将 Sudo 升级到 1.9.5p2 或 1.8.32 及更高版本，Debian/Ubuntu 系统执行 apt-get update && apt-get install --only-upgrade sudo，RHEL/CentOS 系统执行 yum update sudo，或从 https://www.sudo.ws/dist/ 下载源码编译安装。对于无法立即更新的 RHEL/CentOS 7 系统，可临时使用 systemtap 脚本拦截 sudoedit -s 调用作为缓解措施，该脚本需在每次重启后重新加载，待更新补丁后终止 systemtap 进程即可。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Sudo Sudo 堆缓冲区溢出致本地提权漏洞"
updated = "2026-06-17T04:04:45Z"

