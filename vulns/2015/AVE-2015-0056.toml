[basic]
description = "Pie Register WordPress 插件 2.0.18 及之前版本中的 pie-register.php 文件存在反射型跨站脚本（XSS）漏洞。远程攻击者无需身份认证，通过向 pie-register 页面的默认 URI 中构造恶意的 invitaion_code 参数，即可注入任意 Web 脚本或 HTML 代码。当管理员或其他用户访问该恶意链接时，脚本将在浏览器中执行，可能导致会话劫持、钓鱼攻击或敏感信息泄露。该漏洞影响所有使用 Pie Register 插件的 WordPress 站点，CVSS 评分 4.3，危害等级中危。建议升级至 2.0.19 或更高版本修复。"
published = "2015-10-16T20:59:14Z"
remediation = "立即将 Pie Register 插件升级至 2.0.19 或更高版本。在 WordPress 后台插件管理页面搜索 Pie Register 并点击更新，或从 https://wordpress.org/plugins/pie-register/ 下载最新版本手动安装。如无法立即更新，可在服务器 WAF 层添加规则过滤 invitaion_code 参数中的 HTML 标签字符作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Pie Register 插件跨站脚本漏洞"
updated = "2026-06-17T00:32:20Z"

