[basic]
description = 'Microsoft Exchange Server 5.5 在处理带有空白字符集（charset=""）的 MIME 邮件头时存在解析缺陷，远程攻击者无需身份认证即可向目标服务器发送特制的畸形 MIME 邮件，触发服务进程崩溃或资源耗尽，导致拒绝服务。该漏洞影响 Exchange 5.5 版本，攻击复杂度低，无需用户交互，CVSS 评分 5.0，危害等级中等。Microsoft 已发布安全公告和补丁修复此漏洞。'
published = "2000-12-11T05:00:00.000"
remediation = "建议立即安装 Microsoft 安全公告 MS00-082 提供的补丁。Exchange 5.5 用户可安装 Service Pack 4 消除此漏洞；Exchange 5.0 用户需安装累积更新包（同时修复 MS01-041 和 MS03-046）。补丁下载地址：https://www.microsoft.com/download/details.aspx?FamilyID=04973543-a3ce-438e-aa9d-e39ae2e2a67c。如无法打补丁，可限制 SMTP 连接来源 IP 作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Exchange Server 5.5 MIME Header 拒绝服务漏洞"
updated = "2026-06-16T21:52:57.420"

