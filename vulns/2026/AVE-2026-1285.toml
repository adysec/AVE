[basic]
description = "WatchGuard Fireware OS 的 admd 网络服务组件存在越界写入（Out-of-bounds Write）漏洞（CWE-120）。由于该组件在处理网络数据包时未对写入操作的边界进行充分校验，攻击者可构造特制数据触发越界写，导致内存破坏。位于同一局域网网段且无需任何身份验证的攻击者，可利用该漏洞在受影响设备上执行任意代码，从而完全控制防火墙设备，进一步窃取或篡改经过该设备的网络流量。该漏洞影响 Fireware OS 11.0 至 11.12.4_Update1、12.0 至 12.12 以及 2025.1 至 2026.2 等多个版本，属于高危漏洞（CVSS 4.0 评分为 7.7）。由于需要与目标处于同一本地网络网段，攻击需具备一定的网络邻近条件。建议用户及时升级至厂商发布的安全更新版本以彻底修复此漏洞。"
published = "2026-07-03T00:16:52Z"
remediation = "建议立即将 WatchGuard Firebox 的 Fireware OS 升级到修复版本：2025.1 系列升级至 2026.2.1，12.x 系列升级至 12.12.1，T15/T35 型号的 12.5.x 系列升级至 12.5.19；11.x 系列已停止支持（End of Life），无安全补丁，应迁移到受支持版本。请通过 Firebox 系统管理器升级固件并重启设备使补丁生效。由于该漏洞为同一本地网段攻击（CVSS 攻击向量为 Adjacent），在无法立即打补丁时可作为临时缓解措施：通过网络分段将可信管理网段（admd 所监听网段）与其他子网隔离，启用交换机端口 802.1X 认证并对局域网实行物理访问控制，防止攻击者接入本地网段。"
score = 7.7
severity = "HIGH"
sources = ["zdi"]
title = "WatchGuard Fireware OS admd 越界写入漏洞"
updated = "2026-07-07T05:16:55Z"

