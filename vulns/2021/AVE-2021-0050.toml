[basic]
description = "Windows 内核存在缓冲区溢出漏洞（CWE-119），本地低权限攻击者可通过向内核发送特制请求触发该漏洞，实现特权提升至 SYSTEM 级别。该漏洞攻击复杂度低，无需用户交互，成功利用后可完全控制受影响系统。影响 Windows 内核相关版本，CVSS 评分 7.8，危害等级高。攻击者需先获得目标系统的本地低权限访问，利用此漏洞可绕过安全限制获取内核级权限，进而完全接管设备。"
published = "2021-07-14T18:15:09Z"
remediation = "立即安装微软 2021 年 7 月发布的累积安全更新（例如针对 Windows 10/11 的相关 KB 补丁）。建议通过 Windows Update 自动更新或在 Microsoft Update Catalog 中下载安装对应版本的补丁。如无法立即更新，建议通过限制低权限用户的本地访问权限来降低受攻击风险。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows 内核特权提升漏洞"
updated = "2026-06-17T03:52:37Z"

