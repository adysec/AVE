[basic]
description = "OpenSSL 0.9.6i 及 0.9.7a 之前的版本在 SSLv3/TLS 协议实现中存在信息泄露漏洞，具体位于 ssl3_get_record 函数（s3_pkt.c）中。当使用不正确填充的密文块进行解密时，OpenSSL 会跳过消息认证码（MAC）的计算步骤，导致处理过程出现可测量的时间差异。未经身份认证的远程攻击者可利用该时间差异，通过主动选择密文并测量服务器响应时间来区分填充错误与 MAC 验证错误，进而逐步推导出原始明文的加密内容。该漏洞影响所有使用 CBC 模式加密的 OpenSSL 服务，包括 HTTPS、SMTPS、IMAPS 等基于 SSL/TLS 的通信服务，攻击者需多次发送特制数据包进行统计分析，最终可能实现对加密数据的完整提取。"
published = "2003-03-03T05:00:00Z"
remediation = "升级 OpenSSL 至 0.9.7a 或 0.9.6i 及以上版本，该漏洞在 s3_pkt.c 中通过修复 MAC 计算逻辑已解决。如无法立即升级，可在应用层对 TLS 响应时间引入随机延迟以缓解时序侧信道攻击，或使用支持恒定时间 MAC 校验的替代 TLS 实现（如 LibreSSL）。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "OpenSSL 0.9.x CBC错误信息泄露漏洞"
updated = "2026-06-16T22:01:28Z"

