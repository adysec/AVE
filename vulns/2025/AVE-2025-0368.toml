[basic]
description = "QNAP HBS 3 Hybrid Backup Sync 存在错误消息泄露敏感信息漏洞（CWE-209）。该漏洞源于软件在处理特定请求时生成的错误消息中包含了应用程序的敏感数据。攻击者获得本地网络访问权限后，可通过向目标设备发送特制请求触发错误消息泄露，从而读取应用程序中的敏感信息。该漏洞影响 HBS 3 Hybrid Backup Sync 26.2.0.938 之前的所有版本，CVSS 评分 7.0，危害等级高。QNAP 已在 HBS 3 Hybrid Backup Sync 26.2.0.938 及后续版本中修复此漏洞。"
published = "2026-01-02T16:17:00Z"
remediation = "立即将 QNAP HBS 3 Hybrid Backup Sync 升级至 26.2.0.938 或更高版本。升级路径：登录 QTS/QuTS hero 管理界面 → App Center → 已安装应用 → HBS 3 Hybrid Backup Sync → 检查更新。如无法立即升级，可在路由器/防火墙层面限制对 QNAP 设备 8899/8080 端口的局域网访问，仅允许受信任的管理 IP 连接。"
score = 7
severity = "HIGH"
sources = ["zdi"]
title = "QNAP HBS 3 Hybrid Backup Sync 敏感信息泄露漏洞"
updated = "2026-06-17T09:52:30Z"

