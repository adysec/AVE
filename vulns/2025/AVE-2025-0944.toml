[basic]
description = "Linux内核中的ROSE（Radio over IP）网络协议栈存在定时器竞态条件漏洞。Rose定时器在执行时仅获取套接字自旋锁，但未检查该套接字是否已被用户线程持有。当用户线程在定时器回调执行期间释放套接字时，会触发slab-use-after-free错误。未经身份认证的本地攻击者可利用此竞态条件导致内核崩溃或权限提升。该漏洞影响使用ROSE协议的Linux内核系统，CVSS评分为7.8（高危），CWE编号为CWE-362（竞态条件）。"
published = "2025-02-27T02:15:15.473"
remediation = "升级 Linux 内核至 6.14 或更高版本以包含修复提交 5de7665e0a0746b5ad7943554b34db8f8614a196；Debian 用户安装安全更新包（bullseye 5.10.237-1 / bookworm 6.1.129-1 / unstable 6.12.13-1），Ubuntu 用户安装 USN-7511-1 / USN-7540-1 安全更新，RHEL/CentOS 用户通过 yum 或 dnf 更新 kernel 包。禁用 ROSE 协议模块（modprobe -r rose）可作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 ROSE 子系统定时器与用户线程竞争条件释放后使用漏洞"
updated = "2026-07-30T06:20:39.380"

