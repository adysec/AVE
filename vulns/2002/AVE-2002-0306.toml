[basic]
description = "Qualcomm QPopper 4.0.3 及更早版本中存在一个拒绝服务漏洞。该漏洞的原理是程序在处理输入字符串时缺乏足够的长度校验，当远程攻击者发送一个超长字符串时，会导致系统陷入死循环，从而造成 CPU 资源耗尽。由于该漏洞可通过网络远程触发且无需身份验证，攻击者可轻易导致服务崩溃或系统响应缓慢。该漏洞影响 QPopper 4.0.x 系列版本。"
published = "2002-08-12T04:00:00Z"
remediation = "建议立即升级 Qpopper 至 4.0.4 或更高版本以修复死循环逻辑。由于该产品已过时，建议迁移至更为安全的现代邮件推送替代方案，或在前端部署防火墙/WAF 限制输入字符串的最大长度，以缓解拒绝服务攻击。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Qualcomm QPopper 远程拒绝服务漏洞"
updated = "2026-06-16T21:57:28Z"

