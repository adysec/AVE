[basic]
description = "Wingate 4.1 Beta A 及更早版本的日志文件服务存在目录遍历漏洞。远程攻击者无需身份认证即可通过向目标系统发送包含编码字符（如 `%2e%2e%2f`）的 HTTP GET 请求，利用 `..` 路径穿越技术绕过访问限制，读取服务器上的任意文件（如配置文件、密码文件等敏感信息）。该漏洞影响 Wingate 4.1 Beta A 及之前所有版本，CVSS 评分 5.0，危害等级中等，攻击复杂度低，仅需网络访问即可利用。"
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 WinGate 至最新版本（当前为 9.4.9），该漏洞存在于 4.1 Beta A 及更早版本的日志文件服务中，后续版本已修复目录遍历问题。如无法升级，可在 WinGate 配置中禁用日志文件服务的 HTTP 访问，或通过防火墙限制仅允许可信 IP 访问 80/8080 端口，并在反向代理层过滤包含 `..` 及 URL 编码变体（如 `%2e%2e`、`%252e%252e`）的请求路径。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Deerfield Wingate 4.1 日志服务 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:53:02.900"

