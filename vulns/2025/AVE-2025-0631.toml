[basic]
description = "Google Chrome Android 版 Selection 组件存在 UI 欺骗漏洞（CWE-451），由于对用户界面交互实现不当，远程攻击者可通过构造特制的 HTML 页面并诱导用户执行特定的 UI 手势操作，成功利用该漏洞可在目标设备上实现界面欺骗（UI Spoofing），误导用户与恶意界面交互。该漏洞影响 Android 平台 Google Chrome 134.0.6998.35 之前版本及基于 Chromium 的 Microsoft Edge 134.0.3124.51 之前版本，CVSS 评分 4.3，危害等级中危。攻击者需诱使用户主动参与特定手势交互，攻击复杂度较低但需用户交互配合。"
published = "2025-03-05T04:15:11Z"
remediation = "升级 Google Chrome for Android 至 134.0.6998.35 或更高版本，可通过 Google Play 商店检查并安装更新。使用 Microsoft Edge 的用户应升级至 134.0.3124.51 或更高版本。临时缓解措施可配置浏览器禁用不受信任来源的 HTML 页面交互，并提醒用户勿在不可信页面上执行特定 UI 手势操作。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome Android Selection 组件界面欺骗漏洞"
updated = "2026-06-17T08:40:20Z"

