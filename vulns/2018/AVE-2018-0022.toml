[basic]
description = "Cisco IOS 及 IOS XE 软件的 DHCP Option 82 封装功能存在输入验证漏洞。未经身份认证的远程攻击者可通过向受影响设备发送特制的 DHCPv4 数据包，触发堆溢出条件，导致设备重载，造成拒绝服务（DoS）。该漏洞源于软件在处理 DHCP 中继代理发来的 Option 82 信息时未进行充分的输入验证，攻击者无需任何权限即可远程利用。Cisco 已发布安全公告修复此漏洞。"
published = "2018-03-28T22:29:01Z"
remediation = "立即升级 Cisco IOS/IOS XE 至 Cisco 安全公告 cisco-sa-20180328-dhcpr1 中指定的修复版本。对于无法立即升级的设备，可在受影响的交换机上配置 DHCP snooping 并限制 DHCP relay agent 的信任端口，仅允许来自可信 relay agent 的 DHCP option 82 信息。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），需在 2022 年 3 月 17 日前完成修复。"
score = 8.6
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS/IOS XE DHCP Option 82 输入验证漏洞"
updated = "2026-06-17T01:29:59Z"

