[basic]
description = "tags.<value>Safari 浏览器存在释放后使用漏洞，攻击者通过构造恶意网页内容，在用户访问时触发内存管理缺陷，导致已释放内存被重复引用，从而实现任意代码执行。该漏洞影响 Safari 14.1 之前版本、iOS 12.5.3/iOS 14.5 之前版本、iPadOS 14.5 之前版本、watchOS 7.4 之前版本、tvOS 14.5 之前版本以及 macOS Big Sur 11.3 之前版本。由于攻击需要用户主动打开恶意链接或访问恶意网站，攻击条件为网络可达且存在用户交互。Apple 已知该漏洞可能已被积极利用，已在后续安全更新中修复此问题。"
published = "2021-09-08T15:15:13Z"
remediation = "立即升级 Safari 至 14.1 版本，iOS/iPadOS 升级至 14.5，macOS Big Sur 升级至 11.3，watchOS 升级至 7.4，tvOS 升级至 7.4。旧设备可升级 iOS 12.5.3。如无法立即更新，建议暂停使用 Safari 浏览不可信网页，改用 Chrome/Firefox 等替代浏览器，并启用浏览器的安全防护功能阻止恶意脚本执行。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Apple Safari 释放后使用漏洞"
updated = "2026-06-17T03:50:38Z"

