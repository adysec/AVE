[basic]
description = "ATEN Unizon 的 ImportDeviceList 方法存在目录遍历漏洞，攻击者在通过身份验证后，可通过向 `/rest/devices/csv` 端点提交特制的 CSV 文件，利用路径验证缺失执行任意代码，并以 SYSTEM 权限运行。该漏洞影响 ATEN 集中式 AV 管理平台，危害等级高，攻击者可借此完全控制目标服务器。"
published = "2026-06-24T22:16:50Z"
remediation = "升级 ATEN Unizon 固件至 V2.7.264.001 或更高版本以修复此漏洞，可前往 ATEN 官方支持中心安全公告页面（https://www.aten.com/global/en/supportcenter/info/security-advisory/31/）下载对应固件并执行升级。临时缓解措施：严格限制具有管理员权限的账户数量与来源 IP，避免向不可信用户开放系统访问权限，降低被利用的风险。"
score = 7.2
severity = "HIGH"
sources = ["zdi"]
title = "ATEN Unizon 目录遍历远程代码执行漏洞"
updated = "2026-06-27T19:01:46Z"

