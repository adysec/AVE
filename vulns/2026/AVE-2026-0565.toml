[basic]
description = "@andrea9293/mcp-documentation-server v1.13.0 的 Web UI/API 默认绑定到所有网络接口（0.0.0.0:3080）而非仅监听本地回环地址，且文档管理 API 端点未实施任何身份认证机制。同一局域网、虚拟机网络或容器桥接网络内的远程攻击者无需任何凭证即可访问文档管理 API，实现文档列举、内容读取、全文搜索、新增文档及删除文档等操作，可能导致 MCP 助手的本地知识库被篡改或敏感文档泄露。该漏洞源于 Express 框架的 `app.listen(PORT)` 未指定 host 参数时默认监听所有接口，且未对 API 端点添加认证中间件。"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 @andrea9293/mcp-documentation-server 升级到 v1.13.1 或更高版本（npm update @andrea9293/mcp-documentation-server），该版本已将 Web UI 默认绑定到 127.0.0.1。如无法升级，在环境变量中设置 WEB_HOST=127.0.0.1 并重启服务；同时在防火墙/iptables 层面限制 3080 端口仅允许本地访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "@andrea9293 mcp-documentation-server Web UI API 默认绑定所有网络接口且未授权访问漏洞"
updated = "2026-01-01T00:00:00Z"

