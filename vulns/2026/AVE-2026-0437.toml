[basic]
description = "brace-expansion 是 Node.js 生态中广泛使用的花括号展开库，被 minimatch、glob 等核心包间接依赖。其 `expand()` 函数通过 `max` 参数（默认 100,000）限制了展开结果的数量，但未对单个结果的长度做任何限制。攻击者通过构造大量嵌套的花括号组（如 `'{a,b}'.repeat(1500)`，约 7.5 KB 输入），使结果数量被 `max` 截断的同时每个结果字符串长度随组数线性增长，导致总输出大小达到 `max × N` 字符量级。V8 引擎在构建这些长字符串时还会保留中间 rope 引用，内存占用随组数 N 呈线性增长，最终触发不可捕获的 JavaScript 堆内存耗尽（OOM）错误，导致 Node.js 进程直接崩溃。任何将用户可控输入传递给 `brace-expansion.expand()` 或其下游调用（如 glob 模式匹配）的应用均受影响，攻击者无需高权限即可通过小体积请求实现拒绝服务攻击。"
published = "2026-01-01"
remediation = "升级 brace-expansion 至 >=2.0.2 版本（含 maxLength 参数限制），或升级依赖它的 minimatch/glob 至已修复版本。如无法立即升级，在调用 expand() 时传入显式的 max 和 maxLength 选项限制输出长度，且避免将不可信用户输入传入 brace 展开函数。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "juliangruber brace-expansion 大括号展开无限长度导致内存耗尽拒绝服务漏洞"
updated = "2026-01-01"

