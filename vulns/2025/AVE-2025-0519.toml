[basic]
description = "Google Chrome 在 Windows 平台上的 App-Bound Encryption（应用绑定加密）组件存在实现不当漏洞。本地攻击者可通过诱导用户打开恶意文件，利用该漏洞从 Chrome 进程内存中获取潜在的敏感信息，导致信息泄露。该漏洞影响 Windows 版 Google Chrome 142.0.7444.59 之前版本，CVSS 评分 5.5，危害等级中危。攻击需要用户交互且无特殊权限要求，攻击复杂度较低。"
published = "2025-11-10T20:15:38Z"
remediation = "升级 Google Chrome 至 142.0.7444.59 或更高版本，可通过 Chrome 设置 > 关于 Chrome 自动检查更新并安装。Fedora 用户执行 `sudo dnf update chromium` 更新至 142.0.7444.162。如无法立即更新，建议限制非信任用户本地访问权限作为临时缓解。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome App-Bound Encryption 实现不当导致敏感信息泄露漏洞"
updated = "2026-06-17T08:32:23Z"

