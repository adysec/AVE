[basic]
description = "Apple iOS 6.0 之前版本及 Google Chrome 15.0.874.102 之前版本所使用的 WebKit 引擎存在输入验证缺陷（CWE-20）。该漏洞源于 WebKit 对历史记录数据处理不当及对 TIFF/PNG/JPEG 图像格式解析时的内存错误，攻击者可构造恶意网页诱导用户访问，触发地址栏欺骗或内存损坏，进而导致任意代码执行。漏洞影响范围覆盖 iPhone/iPad (iOS <6.0)、Android 浏览器及桌面端 Chrome/Safari 等所有基于受影响 WebKit 版本的客户端。攻击条件为用户需主动访问恶意页面（用户交互），CVSS 评分 4.3 (AV:N/AC:M/Au:N/C:N/I:P/A:N)，属中危级别。Apple 已在 iOS 6.0 中修复，Google 已在 Chrome 15.0.874.102 中修复。"
published = "2011-10-25T19:55:00Z"
remediation = "建议立即升级 Apple iOS 至 6.0 或更高版本（通过设置 > 通用 > 软件更新在线升级，或连接 iTunes 进行完整恢复升级）。若设备不支持升级至 iOS 6.0，建议停用 Safari 浏览器并改用第三方浏览器（如 Chrome for iOS），同时避免访问不明来源的网页链接。对于桌面端 Chrome 用户，请立即升级至 15.0.874.102 或更高版本（通过 Chrome 菜单 > 关于 Google Chrome 自动检查更新）。如无法立即升级，可在网络层面部署 Web 应用防火墙（WAF）规则拦截可疑的 History API 调用，作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple WebKit 输入验证漏洞"
updated = "2026-06-16T23:32:06Z"

