[basic]
description = "tags as required.<value>Windows NT 4.0 Terminal Server 使用的 RegAPI.DLL 存在缓冲区溢出漏洞。远程攻击者无需身份认证，仅需向终端服务器发送包含超长用户名的登录请求，即可触发该缓冲区溢出，进而在目标系统上执行任意命令。该漏洞影响 Windows NT 4.0 Terminal Server 的远程登录服务，攻击条件宽松，不需要合法账户即可发起利用。通过构造特长的用户名参数，攻击者可覆盖栈内存，劫持程序执行流程，最终实现远程代码执行，对服务器安全性造成严重威胁。Microsoft 已发布安全补丁修复此漏洞，建议受影响用户尽快升级并应用相应更新。"
published = "2001-01-09T05:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS00-087 补丁程序（对应 KB 文章 Q277910），补丁通过正确处理 Terminal Server 登录时的用户名输入消除了 RegAPI.DLL 中的缓冲区溢出。同时应在防火墙或路由器上过滤 TCP 3389 端口，仅允许已知合法 IP 地址建立终端服务会话，并部署入侵检测软件以监控和阻断针对已知漏洞的攻击。对于无需从互联网访问的 Terminal Server，建议直接关闭 TCP 3389 端口的外部访问。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Microsoft Windows NT 终端服务缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:15Z"

