[basic]
description = "织梦内容管理系统（DedeCMS）5.7及更早版本中的 plus/recommend.php 文件存在 SQL 注入漏洞。攻击者可通过向该文件发送特制的 HTTP 请求，利用 PHP 的 $_FILES 超全局变量构造恶意参数，绕过输入过滤机制注入任意 SQL 语句。该漏洞无需身份认证即可远程利用，攻击成功后攻击者可执行任意 SQL 查询，导致数据库信息泄露、数据篡改甚至获取系统控制权。CVSS 评分 9.8，危害等级严重。"
published = "2017-12-18T05:29:00Z"
remediation = '''
[id]
ave_id = "AVE-2017-17731"
aliases = ["CVE-2017-17731"]

[basic]
title = "织梦DedeCMS 5.7 plus/recommend.php SQL注入漏洞"
description = "DedeCMS（织梦内容管理系统）5.7及之前版本中，plus/recommend.php文件在处理$_FILES超全局变量时存在SQL注入漏洞。攻击者可通过构造特制的_FILES[type][tmp_name]参数，利用uploadsafe.inc.php中str_replace对反斜杠的处理缺陷，配合common.inc.php的变量注册机制，在无需认证的情况下远程执行任意SQL查询，可导致管理员密码被窃取、数据库敏感信息泄露等严重后果。"
severity = "CRITICAL"
score = 9.8
sources = ["cve", "avd"]
published = "2017-12-18"
updated = "2017-12-18"
remediation = "升级到DedeCMS V5.7.37 GBK正式版20140228或更高版本，或手动修改include/uploadsafe.inc.php，删除$$_key = $_FILES[$_key]['tmp_name'] = str_replace(\"\\\\\\\\\", \"\\\\\", $_FILES[$_key]['tmp_name']);这一行，直接使用$$_key = $_FILES[$_key]['tmp_name'];即可修复。"

[references]
urls = ["https://nvd.nist.gov/vuln/detail/CVE-2017-17731", "https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2017-17731", "https://blog.csdn.net/nixawk/article/details/24982851", "https://github.com/Lucifer1993/AngelSword/blob/232258e42201373fef1f323864366dc1499581fc/cms/dedecms/dedecms_recommend_sqli.py", "https://github.com/projectdiscovery/nuclei-templates/blob/main/http/cves/2017/CVE-2017-17731.yaml", "https://www.dedecms.com/"]

