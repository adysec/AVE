[basic]
description = "KindEditor 4.1.11 版本的 php/demo.php 页面中，content1 参数存在反射型跨站脚本攻击（XSS）漏洞。该页面未对用户提交的 content1 参数进行充分过滤和转义，攻击者可通过构造包含恶意 JavaScript 代码的特制 URL，诱使目标用户访问该链接。当受害者点击并加载页面时，注入的脚本将在其浏览器上下文中执行，可导致会话劫持、敏感信息窃取或网页篡改等后果。该漏洞影响部署了 KindEditor 4.1.11 并使用其 PHP 示例页面的网站，攻击条件为攻击者能够诱导目标用户点击恶意链接，用户无需进行身份验证即可触发。"
published = "2019-02-06T21:29:00Z"
remediation = "由于 KindEditor 已停止维护且无官方补丁，建议立即迁移至其他活跃维护的富文本编辑器（如 TinyMCE、CKEditor 或作者推荐的 Lake）。若暂时无法迁移，需手动修改 php/demo.php 第 45 行附近代码，对 content1 参数使用 htmlspecialchars 函数进行 HTML 实体编码过滤，或直接删除 php/demo.php 演示文件以消除攻击面。同时部署 Web 应用防火墙拦截 XSS 攻击载荷，并启用内容安全策略（CSP）限制脚本执行来源。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "KindEditor php/demo.php 跨站脚本攻击漏洞"
updated = "2026-06-17T02:40:40Z"

