[basic]
description = "Auction Weaver CGI 脚本 1.03 及更早版本存在路径遍历漏洞，远程攻击者可通过向 catdir 参数提交 `..`（点点）序列实现目录穿越，从而读取服务器上的任意文件。该漏洞无需身份认证即可远程利用，攻击复杂度低，可导致敏感信息泄露（如配置文件、密码文件等）。由于 CGI 脚本未对用户输入的 catdir 参数进行充分的路径过滤和校验，攻击者只需构造特制的 HTTP 请求即可触发。"
published = "2000-10-20T04:00:00.000"
remediation = '立即停用 Auction Weaver CGI 脚本（auction_weaver.cgi），或从 Web 服务器中彻底删除该脚本目录。如业务必须使用，升级到 1.04 或更高版本（若厂商已停止维护则无法升级），同时在 Web 服务器（Apache/Nginx）层面配置 URL 重写规则，过滤 catdir 参数中的 `../` 和 `..\` 等目录遍历序列，并限制脚本对文件系统的访问权限，确保 Web 进程以最小权限用户运行。'
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Auction Weaver CGI 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:52:16.160"

