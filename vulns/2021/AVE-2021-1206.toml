[basic]
description = "Checkbox Survey 的 CheckboxWeb.dll 组件存在不安全的反序列化漏洞（CWE-502）。未经身份认证的远程攻击者可通过向目标服务器发送特制序列化数据，触发反序列化过程，最终在服务器上执行任意代码，完全接管系统。该漏洞影响 Checkbox Survey 7.0 之前的所有版本，攻击者无需任何凭据或用户交互即可远程利用，CVSS v3.1 评分为 9.8（严重）。CISA 已将此漏洞列入已知被利用漏洞目录，要求联邦机构在 2022 年 5 月 2 日前完成修复或移除受影响版本。"
published = "2021-05-28T00:00:00Z"
remediation = "立即将 Checkbox Survey 升级到 7.0 或更高版本，该版本已移除 ASP.NET View State 功能，不再受反序列化漏洞影响。如暂无法升级，应将 6.x 及以下版本从生产环境中彻底卸载并移除；同时建议在防火墙或 WAF 层拦截包含 _VSTATE 参数的恶意请求作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["kev"]
title = "Checkbox Survey 反序列化漏洞"
updated = "2021-05-28T00:00:00Z"

