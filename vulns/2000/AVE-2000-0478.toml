[basic]
description = "Red Hat Linux 系统中 Stanley T. Shebs Xconq 7.2.2 版本的 xconq 和 cconq 游戏程序存在缓冲区溢出漏洞。本地攻击者可通过向 USER 环境变量传入超长字符串触发缓冲区溢出，从而获取额外的系统权限。该漏洞影响 Red Hat Linux 系统，攻击者需拥有本地访问权限，利用方式简单，危害等级中等。"
published = "2000-06-22T04:00:00Z"
remediation = "建议立即升级 xconq 至 7.4.1 以上版本，或从 Red Hat 官方获取安全补丁。如无法升级，可执行 `chmod g-s /usr/bin/xconq /usr/bin/cconq` 移除 SGID games 权限位，或使用 `rpm -e xconq` 卸载该游戏程序以彻底消除风险。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Red Hat Linux Xconq 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:07Z"

