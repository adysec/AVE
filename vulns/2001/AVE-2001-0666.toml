[basic]
description = "tags.<value>BiblioWeb Web Server 2.0 存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过发送超长的 HTTP GET 请求触发该漏洞，导致服务拒绝服务甚至可能执行任意命令。该漏洞影响运行 BiblioWeb 2.0 的服务器系统，攻击条件宽松，无需认证即可远程利用，危害等级较高。"
published = "2001-05-03T04:00:00.000"
remediation = "建议升级到最新版本的 BiblioWeb 或应用安全补丁。请确认当前 2.0 版本是否存在安全更新，如果存在立即应用。如果无法立即应用补丁，可通过以下措施缓解风险：限制对 Bibliow 服务器的访问权限，配置防火墙阻止异常长的 HTTP 请求，启用服务器监控并设置请求长度限制。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "BiblioWeb Server 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:53:55.230"

