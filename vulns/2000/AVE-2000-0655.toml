[basic]
description = "GNU Screen 3.9.5 及更早版本的 vbell_msg 初始化变量中存在格式化字符串漏洞。本地攻击者可通过在该变量中注入格式化字符（如 %n、%s 等），利用格式化字符串漏洞破坏栈内存，进而提升权限获取 root 权限。该漏洞影响 GNU Screen 3.9.5 及更早版本，CVSS 评分 4.6（AV:L/AC:L/Au:N/C:P/I:P/A:P），攻击向量为本地访问，攻击复杂度低，无需身份认证，可导致机密性、完整性、可用性部分受损。攻击者需具备本地系统访问权限，通过设置恶意的 vbell_msg 环境变量或配置参数，诱导 screen 程序处理格式化字符串，实现任意代码执行并提权至 root。Jürgen Weigert 维护的 screen 终端复用器在处理可视铃铃消息时未正确验证格式化字符串，导致该漏洞存在。官方已在后续版本中修复，建议升级至修复版本或限制本地用户对 screen 配置的写入权限。"
published = "2000-12-19T05:00:00.000"
remediation = "建议升级到 screen 3.9.6 或更高版本（如 3.10），此版本修复了 vbell_msg 变量的格式字符串漏洞。立即安装最新稳定版 screen 软件包。临时缓解措施：设置 TTY 设备文件权限为 600 并限制用户可访问的设备数量，阻止攻击者通过格式字符串利用 vbell_msg 初始化变量获取 root 权限。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "GNU Screen 终端复用器 格式字符串漏洞"
updated = "2026-06-16T21:52:43.420"

