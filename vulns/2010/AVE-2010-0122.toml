[basic]
description = "Mozilla Firefox 3.0.x 3.5.x、Thunderbird 及 SeaMonkey 的浏览器引擎存在内存破坏漏洞，与 nsBlockFrame::StealFrame 函数及其他相关代码路径有关。未经身份认证的远程攻击者可通过构造特制的 Web 内容或恶意网页向目标系统发送经过特殊构造的数据，触发浏览器引擎内存损坏，导致应用程序崩溃或远程代码执行。攻击者可通过在网页中嵌入恶意脚本或诱导用户访问包含恶意数据的页面实施攻击，成功利用后可完全控制受害者系统并执行任意代码。该漏洞影响 Firefox 3.0.x 至 3.0.18 之前版本、Firefox 3.5.x 至 3.5.8 之前版本、Thunderbird 3.0.2 之前版本及 SeaMonkey 2.0.3 之前版本。"
published = "2010-02-22T13:00:02Z"
remediation = "立即将 Firefox 升级至 3.5.8/3.0.18 或 3.6 版本，Thunderbird 升级至 3.0.2，SeaMonkey 升级至 2.0.3。在完成升级前，可通过浏览器设置禁用 JavaScript 作为临时缓解措施，防止攻击者通过恶意网页执行任意代码。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox Thunderbird SeaMonkey 内存破坏拒绝服务代码执行漏洞"
updated = "2026-06-16T23:15:35Z"

