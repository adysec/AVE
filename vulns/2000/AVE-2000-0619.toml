[basic]
description = "Allaire JRun 2.3.x 的 JSP 示例文件存在访问控制缺陷，远程攻击者无需身份认证即可通过直接访问 viewsource.jsp 等示例页面，读取服务器上的任意文件内容或获取系统配置信息。该漏洞源于 JRun 默认安装时未对示例文件进行适当的权限限制，攻击者只需发送特制的 HTTP 请求即可利用，影响所有运行 Allaire JRun 2.3.x 版本的服务器，可能导致敏感信息泄露。"
published = "2000-06-22T04:00:00Z"
remediation = "立即删除 JRun 安装目录下的 `jsp/` 示例文件（特别是 `viewsource.jsp`），或通过 Web 服务器（如 IIS/Apache）的访问控制规则禁止外部访问 `/jsp/` 路径。升级到 Allaire JRun 3.0 及以上版本，该版本已移除存在漏洞的示例文件。如无法升级，在应用服务器前端部署反向代理并配置 URL 白名单，仅允许业务必需的 JSP 路径通过。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Allaire JRun 2.3.x JSP文件访问控制漏洞"
updated = "2026-06-16T21:51:57Z"

