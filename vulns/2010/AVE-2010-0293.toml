[basic]
description = "WebKit 浏览器引擎在处理 SVG 文档中的 foreignObject 元素时存在 Use-After-Free 漏洞。未经身份认证的远程攻击者可通过构造包含恶意 foreignObject 元素的 SVG 文档，诱使目标用户使用受影响版本的浏览器打开该文件，从而触发内存破坏，最终实现任意代码执行或导致应用程序崩溃拒绝服务。该漏洞影响 Apple Safari 5.0.1 及 4.1.1 之前版本（覆盖 Mac OS X 10.4、10.5、10.6 及 Windows 平台），同时也影响 WebKitGTK 1.2.6 之前版本，CVSS 评分为 9.3，危害等级高。Apple 已在 Safari 5.0.1 和 4.1.1 安全更新中修复了此漏洞。"
published = "2010-07-30T20:30:02Z"
remediation = "立即升级 Safari 至 5.0.1 或更高版本（Mac OS X 10.5/10.6），Mac OS X 10.4 用户升级至 4.1.1；Windows 用户升级 Safari 至 5.0.1。WebKitGTK 用户升级至 1.2.6 或更高版本。临时缓解措施包括在 Safari 偏好设置中禁用 JavaScript，或避免访问来源不明的网页，尤其是包含 SVG foreignObject 元素的页面。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 释放后使用远程代码执行漏洞"
updated = "2026-06-16T23:19:19Z"

