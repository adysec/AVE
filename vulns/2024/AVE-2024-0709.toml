[basic]
description = "libexpat XML解析库在处理XML文档中的递归实体扩展时存在栈溢出漏洞。当解析包含深度嵌套实体引用的特制XML文档时，libexpat会无限递归展开实体，耗尽栈空间导致程序崩溃。远程攻击者无需身份认证即可通过向目标应用提交恶意XML数据触发该漏洞，造成拒绝服务（DoS），在特定环境下可能进一步导致可利用的内存破坏。该漏洞影响libexpat 2.7.0之前的所有版本，CVSS评分7.5，危害等级高。"
published = "2025-03-14T09:15:14Z"
remediation = "升级 libexpat 至 2.7.0 或更高版本（该版本已将实体展开从递归改为迭代，彻底消除栈溢出风险）。对于无法立即升级的系统，可在 XML 解析入口处限制最大实体嵌套深度（如通过 XML_SetBillionLaughsAttackProtectionMaximumAmplification 设置放大因子上限），或在应用层对 XML 文档大小和实体引用链长度做前置校验拦截。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "libexpat expat XML实体递归扩展栈溢出漏洞"
updated = "2026-06-30T00:16:49Z"

