[basic]
description = "Apple iOS 5.1 之前版本及 iTunes 10.6 之前版本中使用的 WebKit 存在内存破坏漏洞（CWE-119），远程攻击者可通过诱导用户访问特制网站触发内存损坏，导致任意代码执行或应用程序崩溃拒绝服务。该漏洞无需身份认证，攻击复杂度中等（需用户交互），CVSS 评分 9.3，危害严重。Apple 已在 2012 年 3 月安全更新中修复此漏洞。"
published = "2012-03-08T22:55:03Z"
remediation = "升级 Apple Safari 至 5.1.4 或更高版本（通过 Apple 软件更新或手动下载安装）；升级 Apple iOS 至 5.1 或更高版本（通过 iTunes 或 OTA 更新）；升级 Apple iTunes 至 10.6 或更高版本。如无法立即升级，可配置 Web 内容过滤或禁用 JavaScript 作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:57Z"

