[basic]
description = "Apple Safari 中 WebKit 引擎在处理 HTML 表格时存在越界内存访问漏洞。由于 WebKit 对 HTML 表格元素的边界检查不充分，远程攻击者可通过诱导用户访问特制的 HTML 页面触发越界读写，成功利用后可导致任意代码执行或应用程序崩溃（拒绝服务）。该漏洞影响 Mac OS X 10.5 至 10.6 及 Windows 平台上的 Safari 5.0 之前版本，以及 Mac OS X 10.4 上的 Safari 4.1 之前版本，CVSS 评分 9.3，危害等级严重。用户需升级至 Safari 5.0 或 4.1 及以上版本以修复此漏洞。"
published = "2010-06-11T19:30:23Z"
remediation = "立即将 Apple Safari 升级至 5.0 或更高版本（Mac OS X 10.5~10.6 及 Windows 平台），Mac OS X 10.4 用户升级至 Safari 4.1 或更高版本。iTunes 用户需升级至 iTunes 9.2 以上版本。如无法立即升级，可禁用 JavaScript 或使用内容过滤代理阻止恶意 HTML 页面作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 越界内存访问远程代码执行漏洞"
updated = "2026-06-16T23:19:18Z"

