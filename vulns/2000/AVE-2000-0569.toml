[basic]
description = 'NAI Net Tools PKI Server 1.0（HotFix 3 之前版本）中的 strong.exe 程序存在目录遍历漏洞。远程攻击者可以通过向注册服务器发送包含 ".."（点点）序列的特制 HTTPS 请求，绕过路径限制，从而非法读取服务器上的任意文件。该漏洞允许未经身份验证的攻击者获取系统敏感信息，影响范围为所有未安装相应补丁的 1.0 版本实例。'
published = "2000-10-20T04:00:00Z"
remediation = '建议立即将 NAI Net Tools PKI server 升级到 HotFix 3 或更高版本。若无法立即升级，建议在 Web 服务器或防火墙层面配置过滤规则，拦截包含 ".." 等路径遍历特征的 HTTPS 请求，以缓解非法文件读取风险。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "NAI Net Tools PKI Server 目录遍历漏洞"
updated = "2026-06-16T21:52:22Z"

