[basic]
description = 'tags.<value>Tarantella Enterprise 3.00/3.01 的 ttawebtop.cgi 存在目录遍历漏洞。远程攻击者无需身份认证即可通过在 pg 参数中插入 ".."（点号）构造恶意请求，绕过目录访问限制，读取服务器上的任意文件。该漏洞影响 Tarantella Enterprise 3.00 和 3.01 版本，攻击者利用此漏洞可获取系统配置文件、敏感数据等未授权信息。'
published = "2001-12-06T05:00:00Z"
remediation = "如果使用的是 Tarantella Enterprise 3.00 或 3.01，应立即联系 Tarantella（原 SCO）获取安全补丁并升级到修复版本。如暂无法升级，应将 ttawebtop.cgi 从 /cgi-bin 目录中移除，或通过 Web 服务器配置（如 Apache 的 .htaccess 或 RewriteRule）禁止外部访问该脚本。同时可在防火墙或反向代理层拦截对 /ttawebtop.cgi 的请求作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Tarantella Enterprise 3 任意文件查看漏洞"
updated = "2026-06-16T21:54:59Z"

