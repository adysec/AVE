[basic]
description = "D-Link Central WiFiManager CWM-100 设备 1.03 r0098 版本的 MailConnect 功能存在服务端请求伪造（SSRF）漏洞。该功能本应用于检测与 SMTP 服务器的连接，但由于未对目标地址和端口进行有效限制，实际允许向任意 IP 的任意端口发起出站 TCP 连接。未经身份认证的远程攻击者可通过构造形如 `/index.php/System/MailConnect/host/127.0.0.1/port/22/secure/` 的特制 URI 触发该漏洞，利用内网探测、端口扫描等方式获取敏感信息或进一步攻击内部服务。该漏洞影响 D-Link Central WiFiManager CWM-100 设备，CVSS 评分 8.6，危害等级高。"
published = "2019-01-31T19:29:00Z"
remediation = "立即将 D-Link Central WiFiManager CWM-100 升级至 1.03R0100-Beta1 或更高版本。升级前先备份配置文件，卸载旧版本后安装新版本。如无法立即升级，可在防火墙上限制 CWM-100 服务器的出站 TCP 连接，仅允许访问指定 SMTP 服务器地址，阻止对任意 IP 和端口的出站请求，以缓解 SSRF 风险。"
score = 8.6
severity = "HIGH"
sources = ["nuclei"]
title = "D-Link Central WiFiManager CWM-100 服务器端请求伪造漏洞"
updated = "2026-06-17T01:42:41Z"

