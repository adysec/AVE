[basic]
description = 'Microsoft SQL Server 7.0/2000 及 MSDE 1.0/2000 中的 xp_showcolv 扩展存储过程函数在调用 SQL Server API 的 srv_paraminfo 函数前未正确限制缓冲区长度，存在缓冲区溢出漏洞。具有本地访问权限的攻击者可利用该漏洞触发拒绝服务或执行任意命令，此漏洞也被称为"扩展存储过程参数解析"漏洞。CVSS 评分 2.1，危害等级低，但实际利用可导致远程代码执行，影响 SQL Server 7.0/2000 及 MSDE 1.0/2000 版本。'
published = "2001-01-09T05:00:00.000"
remediation = "安装 Microsoft 安全公告 MS00-092 提供的补丁：SQL Server 7.0 用户需升级至 Service Pack 3（或先安装 SP2 后打补丁），SQL Server 2000 用户需升级至 Service Pack 1。MSDE 1.0/2000 用户同样安装对应补丁。如无法立即打补丁，可限制对 SQL Server 的登录访问权限，仅允许受信任用户连接，并确保 SQL Server 服务以普通用户权限运行而非管理员账户。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Microsoft SQL Server 7.0/2000 xp_showcolv 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:06.877"

