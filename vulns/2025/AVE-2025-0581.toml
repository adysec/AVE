[basic]
description = "该漏洞位于 Python 标准库的 `http.client` 模块中。当客户端在读取 HTTP 响应且未指定读取量时，默认行为会信任响应头中的 `Content-Length` 字段。恶意服务器可通过发送一个包含极大 `Content-Length` 值的响应，诱导客户端将大量数据加载到内存中，从而导致内存溢出（OOM）或拒绝服务（DoS）攻击。该漏洞影响使用 `http.client` 进行网络请求的 Python 应用，攻击条件为客户端与恶意服务器建立连接并接收响应。"
published = "2025-12-01T18:16:04Z"
remediation = "建议将 Python 升级至 3.11.15 或更高版本。在无法立即升级的环境中，建议在调用 http.client 读取响应时，显式指定读取字节数而非依赖默认的 Content-Length，或在应用层增加对响应体大小的严格校验以防止内存溢出。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Python http.client 内存溢出拒绝服务漏洞"
updated = "2026-06-17T08:34:50Z"

