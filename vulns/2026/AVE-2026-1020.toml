[basic]
description = "Apple CoreAudio 组件存在越界写入漏洞（CWE-119），由 TrendAI 零日倡议（ZDI-26-491）匿名研究员发现并报告。该漏洞源于 CoreAudio 在处理 APAC 音频流时缺乏对用户提供数据的充分校验，攻击者可构造恶意的音频文件或媒体流，在解析过程中触发越界写入操作，导致进程内存被破坏，从而在当前进程上下文中执行任意代码。攻击者可通过远程方式（如诱导用户访问恶意网页或打开恶意文件）利用此漏洞，且无需任何权限，仅需用户进行交互操作即可触发。该漏洞影响 iOS 26.6 及更早版本、iPadOS、macOS Sequoia 15.7.8 及更早版本、macOS Sonoma 14.8.8、macOS Tahoe 26.6、tvOS 26.6、visionOS 26.6 和 watchOS 26.6 等众多 Apple 设备。CVSS 评分 7.8（高危），Apple 已于 2026 年 7 月安全更新中通过改进内存处理和边界检查修复了此漏洞。"
published = "2026-07-27T21:16:52Z"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Apple iOS macOS 等多平台音频文件内存损坏漏洞"
updated = "2026-07-28T19:31:29Z"

