[basic]
description = "Windows Telephony Service（电话服务）存在堆缓冲区溢出漏洞（CWE-122），攻击者可通过构造特制的RPC请求触发该漏洞，在目标系统上以SYSTEM权限执行任意代码。利用该漏洞需要用户交互（如访问恶意共享或接收特制电话请求），影响Windows 10/11及Windows Server多个版本。CVSS评分8.8，危害等级高危。Microsoft已在2025年1月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:49Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新，对应补丁 KB5049981（Windows Server 2022）、KB5049983（Windows 11 23H2）、KB5049984（Windows 10 22H2）、KB5050004（Windows Server 2025）或 KB5050021（Windows 11 24H2）。可通过 Windows Update 自动更新或从 Microsoft 更新目录手动下载安装。如无法立即打补丁，建议限制外部访问 TAPI 服务端口并禁用不必要的电话服务。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:42:59Z"

