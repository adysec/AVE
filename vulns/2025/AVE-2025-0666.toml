[basic]
description = "Visual Studio Installer 存在不受控制的搜索路径元素漏洞（CWE-427），由于安装程序在加载动态链接库时未正确限制搜索路径，本地低权限攻击者可通过诱使用户执行特定操作（如打开恶意项目文件），将恶意 DLL 放置在特定目录中触发加载，从而以高权限执行任意代码，实现权限提升。该漏洞影响 Visual Studio 相关安装组件，CVSS 评分 7.3，危害等级高。Microsoft 已在 2025 年 2 月安全更新中修复。"
published = "2025-02-11T18:15:31Z"
remediation = '建议立即更新 Visual Studio Installer 至修复版本：Visual Studio 2017 升级至 15.9.70 及以上、Visual Studio 2019 升级至 16.11.44 及以上、Visual Studio 2022 v17.8 升级至 17.8.18 及以上、v17.10 升级至 17.10.11 及以上、v17.12 升级至 17.12.5 及以上。通过 Visual Studio 菜单"帮助→检查更新"或从 visualstudio.microsoft.com/downloads 下载最新安装程序。该漏洞为安装程序组件中的不受控搜索路径元素（CWE-427），低权限用户可能通过劫持 DLL 加载路径实现权限提升，无法立即更新的环境下应限制非授权用户对系统的本地交互访问。'
score = 7.3
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Visual Studio Installer 特权提升漏洞"
updated = "2026-06-17T08:42:46Z"

