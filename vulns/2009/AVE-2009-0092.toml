[basic]
description = "Apple iPhone OS（包含 iPod touch 上的 iPhone OS）中的 Mail 应用未正确验证 X.509 数字证书，导致中间人攻击者可通过伪造的 SSL 证书欺骗客户端，伪装成任意 SSL 电子邮件服务器。该漏洞影响运行 iPhone OS 3.1 之前版本的 iPhone 和 iPod touch 设备，攻击者无需身份认证即可在远程发起攻击，通过构造恶意证书截获用户的邮件通信内容，造成敏感信息泄露。Apple 已在 iPhone OS 3.1 中修复此问题。"
published = "2009-09-21T19:30:00Z"
remediation = "立即将 Apple iPhone OS 升级至 3.1 或更高版本以修复 X.509 证书验证缺陷。在升级前，应避免在不受信的公共 Wi-Fi 网络下使用 iPhone Mail 访问 SSL 邮件服务，并手动启用邮件客户端中的严格证书校验选项以降低中间人攻击风险。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Apple iPhone OS Mail 邮件SSL证书验证绕过漏洞"
updated = "2026-06-16T23:11:16Z"

