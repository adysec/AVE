[basic]
description = "OpenSSL 0.9.6d 及更早版本、0.9.7-beta2 及更早版本中的 ASN.1 库存在拒绝服务漏洞。远程攻击者可通过向目标系统发送特制的无效编码 ASN.1 数据，触发解析器在处理畸形输入时进入异常状态，导致 OpenSSL 服务进程崩溃。该漏洞影响广泛部署的 OpenSSL 加密库，攻击者无需身份认证即可远程触发，CVSS 评分 5.0，危害等级中等。厂商已发布更新版本修复此漏洞。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 OpenSSL 至 0.9.6e 及以上版本，或 0.9.7-beta3 及以上版本以修复 ASN.1 解析缺陷。如无法升级，可在网络边界部署 IDS/IPS 规则过滤异常 ASN.1 编码流量，并限制不可信来源对 OpenSSL 服务的访问。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "OpenSSL ASN.1 库拒绝服务漏洞"
updated = "2026-06-16T21:57:53Z"

