[info]
author = "AVE"
description = "验证Check Point VPN-1/FireWall-1 4.1 SP2 Fast Mode下TCP分片绕过访问控制漏洞，远程攻击者可通过畸形分片数据包绕过防火墙访问控制规则"
id = "POC-AVE-2001-0034"
name = "Check Point VPN-1/FireWall-1 Fast Mode TCP Fragment Bypass PoC"
severity = "high"
tags = ["cve-2001-0082"]
vuln_id = [
    "CVE-2001-0082",
    "AVE-2001-0034",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    200,
    301,
    302,
]
type = "status"
