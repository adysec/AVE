[basic]
description = "PrimeTek PrimeFaces 5.x 版本存在弱加密漏洞（CWE-326），攻击者可通过逆向分析 VIEW_STATE 参数的加密算法，构造恶意序列化 Java 对象并触发反序列化，从而实现远程代码执行。该漏洞无需身份认证，攻击者仅需向目标 JSF 应用发送特制的 HTTP 请求即可利用，CVSS 评分 9.8，危害等级严重。影响 PrimeFaces 5.x 全版本，官方已在后续版本中修复此加密缺陷。"
published = "2018-01-03T20:29:00.643"
remediation = "将 PrimeFaces 升级至 5.2.21 及以上版本（5.0-5.2.x 分支）或 5.3.8 及以上版本（5.3.x 分支）。该漏洞源于 PrimeFaces 视图状态加密强度不足，攻击者可构造恶意序列化数据实现远程代码执行。如无法立即升级，可在 Web 服务器或 WAF 层面拦截包含恶意 VIEW 状态参数的请求作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Primetek PrimeFaces 远程代码执行漏洞"
updated = "2026-06-17T00:59:15.417"

