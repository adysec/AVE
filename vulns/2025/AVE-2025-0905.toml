[basic]
description = 'Linux内核platform/x86/amd/pmc驱动存在电源管理回调处理逻辑缺陷。该驱动使用DEFINE_SIMPLE_DEV_PM_OPS()将amd_pmc_suspend_handler()注册为.suspend、.freeze和.poweroff三个电源管理回调，但i8042键盘控制器驱动仅将其suspend处理函数注册为.suspend回调。当系统从冻结或关机状态恢复时，PMC驱动会错误地禁用IRQ1唤醒源，而i8042并未实际启用该唤醒源，导致IRQ唤醒深度计数器降至零以下，触发内核"Unbalanced IRQ 1 wake disable"警告。该漏洞影响使用AMD x86平台并搭载i8042控制器的Linux内核系统，具有本地低权限访问权限的攻击者可在系统全新启动后直接触发休眠（S4）或冻结操作而无需先进入s2idle状态，导致内核产生不平衡IRQ警告日志，影响系统电源管理稳定性与可用性。'
published = "2025-01-19T11:15:10Z"
remediation = "升级 Linux 内核至修复版本：5.16、6.1.140、6.6.72、6.12.10 或 6.13 及更高版本。受影响版本包括 5.15.95 至 5.16、6.1.11 至 6.1.140、6.2.1 至 6.6.72 以及 6.7 至 6.12.10。可通过发行版包管理器（apt、dnf、zypper 等）更新内核，或从 kernel.org 下载编译安装对应版本，更新后重启系统以使修复生效。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 AMD PMC 驱动 唤醒管理拒绝服务漏洞"
updated = "2026-07-14T13:17:19Z"

