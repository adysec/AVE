[basic]
description = "Linux 内核 RDS（可靠数据报套接字）子系统的 sysctl 处理程序中存在空指针解引用漏洞。在处理 rds_tcp_rcvbuf 和 rds_tcp_sndbuf 参数时，代码通过 current->nsproxy 获取网络命名空间结构，但在某些场景下（如进程正在退出时执行 acct(2) 系统调用），current->nsproxy 可能为 NULL，导致内核发生空指针解引用（Oops）。该漏洞影响运行受影响 Linux 内核版本的本地系统，具有本地低权限用户可利用的特点，成功利用可导致系统崩溃或拒绝服务。CVSS v3.1 评分为 5.5，危害等级为中等。攻击者需要具备本地访问权限并运行恶意代码才能触发此漏洞。"
published = "2025-01-19T11:15:09Z"
remediation = "建议将 Linux 内核升级至 6.12.10 或更高版本（含 6.13 系列），该修复已通过内核提交 de8d6de0ee27 和 7f5611cbc487 合入主线，修复了 net/rds/tcp.c 中 RDS 子系统 sysctl 处理函数通过 current-&gt;nsproxy 获取网络命名空间时空指针解引用的问题。Ubuntu 24.04 LTS 用户应安装 linux-image-6.8.0-60.63 或更高版本（USN-7381-1），升级后需重启系统使新内核生效。对于无法立即升级的内核版本 4.6 至 6.12.9，可通过 sysctl 禁用 RDS 协议模块（执行 echo 1 &gt; /proc/sys/net/core/rds_conn_debug 或卸载 rds 内核模块）作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Kernel RDS 协议空指针解引用漏洞"
updated = "2026-06-17T08:43:53Z"

