[basic]
description = "Apache Solr 7.1 之前版本中存在 XML 外部实体注入（XXE）与远程代码执行（RCE）漏洞。攻击者可通过向 Solr 服务发送带有 deftype=xmlparser 参数的特制 XML 查询请求，利用 XML 解析器对外部实体的处理缺陷，结合 Config API 的 add-listener 命令调用 RunExecutableListener 类实现远程代码执行。该漏洞无需身份认证即可远程利用，攻击者可读取服务器任意本地文件（通过 ftp 包装器实现 Blind XXE）或执行任意系统命令，CVSS 评分 9.8，危害等级严重。Apache Solr 7.1 版本已修复此漏洞。"
published = "2017-10-14T23:29:00Z"
remediation = "立即升级 Apache Solr 至 7.1 及以上版本（Apache Lucene 同步升级至 7.1 及以上）。如无法升级，删除 RunExecutableListener 类的调用权限，禁用 XML 查询解析器（移除 deftype=xmlparser 支持），并在网络层面限制对 Solr Admin UI 和 /upload 接口的访问。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Apache Solr XML外部实体注入与远程代码执行漏洞"
updated = "2026-06-17T01:03:39Z"

