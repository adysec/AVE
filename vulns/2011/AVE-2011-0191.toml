[basic]
description = "Google Chrome 浏览器在处理区块时存在使用后释放漏洞（CVE-2011-3053），受攻击者可通过精心 crafted 数据包触发内存释放错误，导致远程代码执行或拒绝服务。该漏洞影响 Chrome 17.0.963.83 及更低版本，CVSS 评分 6.8，危害等级中度。"
published = "2012-03-22T16:55:01Z"
remediation = "建议立即升级 Google Chrome 至 17.0.963.83 或更高版本（通过 Chrome 菜单 → 关于 Chrome 自动更新，或从 google.com/chrome 官网下载最新安装包覆盖安装）。无法立即升级时，可暂时禁用 JavaScript 或使用浏览器扩展（如 NoScript）限制脚本执行，降低触发块分割 Use-after-free 的风险；企业环境可通过组策略强制推送 Chrome 更新策略（Update policy override = Always allow updates）。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 内存错误引用漏洞"
updated = "2026-06-16T23:32:31Z"

