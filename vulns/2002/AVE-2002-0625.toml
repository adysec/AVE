[basic]
description = 'tags.<value>Sun ONE Starter Kit 2.0 中的 ASTAware SearchDisk 引擎存在目录遍历漏洞。远程攻击者无需身份认证即可通过向目标系统的 6015 或 6016 端口发送包含 ".."（点号）序列的请求，或向 6017 端口发送绝对路径名，读取服务器上的任意文件。该漏洞影响 Sun ONE Starter Kit 2.0 及 ASTAware SearchDisc 3.1，CVSS 评分为 5.0，危害等级为中等。攻击者利用此漏洞可获取服务器上的敏感配置文件和源代码。'
published = "2003-04-02T05:00:00.000"
remediation = "立即将 Sun ONE Starter Kit 2.0 升级至官方发布的最新补丁版本，或禁用 ASTAware SearchDisc 引擎的远程访问功能。若无法升级，可在防火墙层面封锁端口 6015、6016 和 6017 的外部入站访问，或配置 SearchDisc 的文档根目录权限，限制其对系统根目录及敏感路径的读取能力。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Sun Sun ONE Starter Kit 2.0 / ASTAware SearchDisc 3.1 目录遍历漏洞"
updated = "2026-06-16T21:59:29.497"

