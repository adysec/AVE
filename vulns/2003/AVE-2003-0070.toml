[basic]
description = "Linux 内核 2.4 版本的 MXCSR（多媒体扩展控制与状态寄存器）处理代码存在缺陷，本地攻击者可通过向系统提交特制的畸形地址触发该漏洞，进而修改 CPU 状态寄存器内容，可能导致系统崩溃或权限提升。该漏洞影响 Linux 内核 2.4 系列版本，CVSS 评分 10.0，危害严重。RedHat 已发布安全公告并提供了修复补丁。"
published = "2003-06-16T04:00:00.000"
remediation = "立即升级 Linux 内核至 2.4.21 或更高版本。Red Hat 用户安装 RHSA-2003:187/RHSA-2003:195 提供的更新内核包；Debian 用户安装 DSA-311/DSA-312 对应的内核更新；Mandrake 用户安装 MDKSA-2003:066 更新。如无法立即升级，可通过 grsecurity/Exec-Shield 等内核加固补丁缓解利用风险。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "Linux Linux内核 MXCSR处理远程代码执行漏洞"
updated = "2026-06-16T22:01:49.980"

