[basic]
description = "Linux 内核块层 BFQ I/O 调度器存在释放后重用漏洞（CWE-416）。在调用 bfq_split_bfqq() 函数拆分请求队列后，waker_bfqq 指针指向的内存已被释放，但后续代码仍通过 bfq_init_rq() 中的 hlist_add_head 操作访问该已释放内存，导致内核 slab 被非法读写。该漏洞影响 Linux 内核 6.6 及之前版本中启用 BFQ 调度器的系统。攻击者需在本地拥有低权限访问权限（PR:L），可通过发起大量文件系统 I/O 操作（如 ext4 目录遍历或 ioctl FIEMAP）触发竞争条件，成功利用可导致权限提升、敏感数据泄露或系统拒绝服务。"
published = "2025-01-19T11:15:07.667"
remediation = '建议将 Linux 内核升级至以下已修复版本之一：5.15.177、6.1.125、6.6.72、6.11 或 6.12.10。可通过发行版包管理器执行更新，如 Debian/Ubuntu 运行 apt upgrade linux-image，RHEL/CentOS 运行 dnf update kernel。如暂无法升级，可通过内核启动参数 elevator=deadline 或 elevator=mq-deadline 禁用 BFQ 调度器，或通过 grub 设置 GRUB_CMDLINE_LINUX_DEFAULT 添加 "elevator=mq-deadline" 后运行 update-grub 并重启。'
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 BFQ I/O 调度器释放后使用漏洞"
updated = "2026-06-17T08:43:53.313"

