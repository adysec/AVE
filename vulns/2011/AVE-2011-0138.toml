[basic]
description = "Opera 11.50 之前的版本存在资源管理错误漏洞（CWE-399）。远程攻击者无需任何身份验证，即可通过向目标用户展示包含大量 OPTION 元素的恶意网页，触发浏览器在处理该 SELECT 下拉菜单元素时出现资源耗尽或内存管理错误，导致应用程序崩溃并造成拒绝服务。该漏洞影响 Opera 11.50 之前的所有桌面浏览器版本。攻击者只需构造包含大量选项的下拉菜单并诱导用户访问，即可远程触发浏览器崩溃，而用户只需正常浏览网页即可被攻击。Opera 已在 11.50 版本中修复此漏洞。"
published = "2011-07-01T10:55:02Z"
remediation = "将 Opera 浏览器升级至 11.50 或更高版本以修复此漏洞。升级后重启浏览器确保补丁生效。如暂时无法升级，可通过限制浏览器同时发起的 SELECT 元素请求数量来缓解拒绝服务风险，并禁用不必要的 HTML 选择框功能以降低被利用可能性。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera Opera Web Browser SELECT元素资源管理拒绝服务漏洞"
updated = "2026-06-16T23:31:40Z"

