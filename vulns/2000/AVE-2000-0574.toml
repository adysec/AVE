[basic]
description = "CUPS（通用Unix打印系统）1.04及更早版本存在拒绝服务漏洞，其Web管理界面中的CGI组件在处理远程攻击者发送的特制HTTP POST请求时无法正确解析输入数据，导致服务进程资源被耗尽或异常终止。该漏洞影响所有安装受影响版本CUPS的Unix/Linux系统，攻击者无需任何身份认证即可通过网络远程发起攻击，只要目标系统CUPS的HTTP接口可达即可触发。攻击者仅需向目标发送构造的CGI POST请求即可使CUPS打印服务停止响应，造成系统打印功能中断，CVSS v2评分5.0，危害等级为中危。Easy Software Products已在CUPS 1.0.5版本中发布补丁修复此漏洞，用户应尽快升级至安全版本。"
published = "2000-06-21T04:00:00Z"
remediation = "tags.<value>立即将 CUPS 升级至 1.0.5 或更高版本，该版本已修复 POST 请求拒绝服务漏洞。升级后重新启动 cupsd 服务以生效。若无法立即升级，可在 Web 服务器层面禁用对 /cgi-bin/cups/ 路径的 POST 请求作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Easy Software Products CUPS 拒绝服务漏洞"
updated = "2026-06-16T21:51:53Z"

