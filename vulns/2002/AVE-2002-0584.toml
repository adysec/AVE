[basic]
description = 'Endity.com ShoutBOX 1.2 的 board.php 文件存在跨站脚本（XSS）漏洞，远程攻击者可通过向 "site" 参数注入精心构造的恶意 HTML 或 JavaScript 代码，将任意内容注入到 shoutbox 页面中执行。该漏洞源于程序未对用户输入进行充分的过滤和转义，攻击者利用此漏洞可在受害者的浏览器中执行任意脚本，导致会话劫持、窃取 Cookie 或进行钓鱼等恶意操作。攻击者无需任何认证即可远程发起攻击，攻击复杂度低，影响该产品 1.2 及更早版本。'
published = "2003-04-11T04:00:00Z"
remediation = """tags.<value>Endity.com ShoutBOX 已停止维护，无官方补丁，建议将其下线或迁移至仍在维护的替代留言板组件。若必须继续使用，应在 board.php 中对 site 参数及所有回显内容进行严格的 HTML 实体转义（如将 < > " ' 分别转义为 &lt; &gt; &quot; &#x27;），并对 site 参数进行白名单校验（仅允许 http(s):// 开头的合法域名），同时部署 Web 应用防火墙（WAF）规则拦截包含 <script> 等标签的请求。由于该产品已多年无安全更新，最稳妥的做法是从生产环境彻底移除，或对页面所有用户可控输入统一经过 OWASP ESAPI 等转义库处理后输出。"""
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Endity.com ShoutBOX 跨站脚本（XSS）漏洞"
