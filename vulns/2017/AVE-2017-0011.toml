[basic]
description = "Microsoft Windows SMBv1 服务器在处理特制数据包时存在远程代码执行漏洞（EternalBlue/MS17-010）。攻击者可通过向目标 SMB 服务发送精心构造的恶意数据包，无需用户交互即可在目标系统上执行任意代码。该漏洞影响 Windows Vista SP2、Windows Server 2008 SP2/R2 SP1、Windows 7 SP1、Windows 8.1、Windows Server 2012 Gold/R2、Windows RT 8.1、Windows 10（1511/1607）及 Windows Server 2016 等多个版本。CVSS 评分 8.8，危害等级高。该漏洞已被广泛用于蠕虫式勒索软件传播（如 WannaCry），造成全球性安全事件。Microsoft 已在 MS17-010 安全更新中修复此漏洞。"
published = "2017-03-17T00:59:04Z"
remediation = "立即安装 Microsoft 2017 年 3 月安全更新 MS17-010（KB4012212 / KB4012213 / KB4012214 / KB4012215 / KB4012216 / KB4012606 / KB4013198），通过 Windows Update 自动更新或从 Microsoft 安全响应中心下载对应补丁。如无法立即打补丁，可通过「控制面板 → 程序和功能 → 启用或关闭 Windows 功能」取消勾选 SMB 1.0/CIFS 文件共享支持以禁用 SMBv1 协议，并在防火墙层面阻止入站 TCP 445 端口流量作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows SMBv1 远程代码执行漏洞"
updated = "2026-06-17T00:57:09Z"

