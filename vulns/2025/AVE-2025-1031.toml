[basic]
description = "Linux 内核 RDMA/mlx5 驱动中存在逻辑错误，设备内存（DM）类型的存储区域（MR）不关联用户内存（umem），但在注销 MR 的 __mlx5_ib_dereg_mr() 流程中，mlx5_free_priv_descs() 函数错误地调用了 dma_unmap_single() 来解映射一个未映射的 DMA 地址，触发内核 WARN 警告。该漏洞影响使用 Mellanox mlx5 网卡并启用 RDMA 功能的 Linux 系统，具有本地低权限攻击条件，攻击者无需用户交互即可通过 RDMA 用户空间接口（如 ibv_rc_pingpong）触发 MR 注销流程，导致内核产生警告信息并可能引发系统稳定性问题或拒绝服务。"
published = "2025-03-27T15:15:56Z"
remediation = "建议立即升级 Linux 内核至已修复版本：Ubuntu 20.04 LTS 升级至 linux-image-5.15.0-134-generic (USN-7776-1)；Ubuntu 22.04 LTS 升级至 linux-image-6.8.0-49-generic (USN-7775-1)；Ubuntu 24.04 LTS 升级至 linux-image-6.8.0-49-generic (USN-7514-1)。或通过 `apt update && apt upgrade linux-image-generic` 自动更新。如暂时无法重启，可临时禁用 RDMA/mlx5 模块（`modprobe -r mlx5_ib mlx5_core`）缓解，但会影响 InfiniBand/RDMA 功能。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 mlx5_ib 驱动拒绝服务漏洞"
updated = "2026-06-17T08:44:32Z"

