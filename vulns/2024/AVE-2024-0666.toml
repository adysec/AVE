[basic]
description = "Linux 内核 ptr_ring 环形缓冲区中存在不正确的锁操作漏洞，ptr_ring_resize_multiple() 函数在调整环形缓冲区大小时错误地屏蔽了硬中断（hard irq），而实际仅需屏蔽底半部（BH）。当通过 tun 驱动设备事件触发队列大小调整时，该操作会调用 __ptr_ring_swap_queue 进而触发 page_pool 路径中的 lockdep 检查，导致内核触发 WARNING 并可能造成拒绝服务。本地低权限攻击者可利用此漏洞导致系统崩溃，影响 Linux 内核多个版本。"
published = "2025-02-27T02:15:13Z"
remediation = "升级 Linux 内核至 6.11-rc4 及以上版本（含对应稳定版修复提交）。Ubuntu 22.04 LTS 用户运行 `sudo apt update && sudo apt install linux-image-generic` 安装 USN-7653-1 更新；SUSE Linux Enterprise 15 SP6 用户安装 SUSE-SU-2025:0847-1 内核更新包后重启系统。如无法立即升级，可在 tun 设备使用场景中避免动态调整队列大小作为临时缓解。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Kernel ptr_ring 硬中断阻塞拒绝服务漏洞"
updated = "2026-06-17T08:14:24Z"

