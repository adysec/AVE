[info]
author = "AVE"
description = "WhatsApp Desktop 0.3.9309之前版本存在持久化XSS漏洞。攻击者在WhatsApp Web中拦截消息发送流程，修改消息对象的__x_body和__x_matchedText字段为javascript:URI载荷，发送后受害者点击链接预览即触发XSS。在Electron环境下可进一步通过fetch('file:///')读取本地文件系统。"
id = "POC-AVE-2019-0999"
name = "WhatsApp Desktop 0.3.9308 Persistent XSS and Local File Read PoC"
severity = "high"
tags = [
    "cve-2019-18426",
    "xss",
    "whatsapp",
    "electron",
    "file-read",
]
vuln_id = [
    "CVE-2019-18426",
    "AVE-2019-0999",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["whatsapp"]
