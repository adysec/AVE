[basic]
description = "Jenkins 使用的 Stapler Web 框架中存在远程代码执行漏洞，位于 stapler/core/src/main/java/org/kohsuke/stapler/MetaClass.java 中。攻击者可通过构造特制 URL 调用 Java 对象中本不应被外部访问的方法，从而在目标服务器上执行任意代码。该漏洞影响 Jenkins 2.153 及更早版本、LTS 2.138.3 及更早版本，无需身份认证即可远程利用，攻击复杂度低，CVSS 评分 9.8，危害等级严重。建议用户升级至 Jenkins 2.154 或 LTS 2.138.4 及以上版本修复。"
published = "2018-12-10T14:29:01.417"
remediation = "立即升级 Jenkins 至 2.154（每周版）或 2.150.1/2.138.4（LTS 版）。如无法立即升级，可在 Jenkins 启动参数中添加 `-Dstapler.allowNullGetterAccess=false` 限制 Stapler 框架的反射调用，并严格限制匿名用户的 Overall/Read 权限作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Jenkins Stapler Web Framework 远程代码执行漏洞"
updated = "2026-06-17T01:33:11.847"

