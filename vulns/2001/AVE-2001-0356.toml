[basic]
description = "趋势科技 InterScan VirusWall for Windows NT 3.4/3.5/3.51 存在访问控制缺陷，部分 CGI 程序未对请求进行身份验证和权限限制，允许远程攻击者无需认证即可直接调用这些 CGI 程序。该漏洞使攻击者能够远程修改目标系统的安全配置，从而绕过病毒防护策略，可能导致恶意软件入侵和内部网络沦陷。CVSS 评分为 5.0，危害等级中等。"
published = "2001-10-18T04:00:00Z"
remediation = "立即升级 Trend Micro Interscan VirusWall 至官方发布的最新补丁版本，禁用或删除管理界面中不必要的 CGI 程序（如 FtpSave.dll）。在网络防火墙层面限制对 Interscan 管理端口的外部访问，仅允许授权管理 IP 段访问 CGI 目录（/interscan/cgi-bin/），并通过访问控制列表（ACL）强制要求身份验证后方可执行配置变更操作。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "趋势科技 Interscan VirusWall for Windows NT 远程重新配置漏洞"
updated = "2026-06-16T21:54:58Z"

