[basic]
description = "ManageEngine ServiceDesk 9.3.9328 版本存在任意文件下载漏洞，由于 download-snapshot URL 中的 name 参数对路径名限制不当，未经身份认证的远程攻击者可通过构造包含路径遍历序列（如 ../）的特制请求，利用该参数下载服务器上的任意文件，导致敏感信息泄露。该漏洞影响 ManageEngine ServiceDesk 9.3.9328 及可能更早版本，CVSS 评分 7.5，危害等级高。厂商已发布安全更新修复此漏洞。"
published = "2017-11-08T22:29:00Z"
remediation = "升级至 ManageEngine ServiceDesk Plus 最新版本（当前最新版为 15300，该版本已移除有漏洞的 /fosagent/repl/download-snapshot 接口）。如无法立即升级，可在反向代理或 WAF 层面添加规则，拦截对 /fosagent/repl/ 路径的访问请求，仅允许可信 IP 范围访问管理控制台，并限制应用服务器对敏感文件系统的读取权限。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "ManageEngine ServiceDesk 任意文件下载漏洞"
updated = "2026-06-17T01:01:55Z"

