[basic]
description = "Windows 2000 Server 存在端口洪泛拒绝服务漏洞，远程攻击者可通过向目标系统的多个 TCP 和 UDP 端口持续发送大量二进制零数据包，导致系统 CPU 占用率急剧升高，正常服务响应缓慢甚至完全不可用。攻击无需身份认证，仅需网络可达即可发起，利用门槛低。该漏洞影响 Windows 2000 Server 版本，CVSS 评分 5.0，危害等级中危。微软至今未发布官方补丁，建议通过防火墙限制异常流量缓解风险。"
published = "2000-06-30T04:00:00Z"
remediation = "Windows 2000 已停止安全支持，建议升级至 Windows Server 2016 或更高版本。如无法升级，可在防火墙配置入站规则，限制 TCP/UDP 端口连接速率，并对非必要端口实施白名单策略，仅允许可信 IP 访问。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Windows 2000 端口洪水拒绝服务漏洞"
updated = "2026-06-16T21:52:02Z"

