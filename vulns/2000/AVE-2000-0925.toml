[basic]
description = 'Bajie HTTP Web Server 0.30a 存在目录遍历漏洞，远程未授权攻击者可通过构造包含 "...."（四个点）的特制 URL 绕过路径限制，实现任意文件读取。该漏洞利用 "...." 作为 ".." 目录遍历的变体，突破服务器的路径规范化检查，可读取服务器文件系统中的敏感文件（如配置文件、源代码、密码文件等）。攻击条件为：目标运行 Bajie HTTP Web Server 0.30a，攻击者可通过网络直接访问 Web 服务，无需身份认证即可发起攻击。CVSS 评分 5.0（AV:N/AC:L/Au:N/C:P/I:N/A:N），属于中危漏洞，主要影响机密性。'
published = "2000-10-20T04:00:00Z"
remediation = '建议立即停止使用 Bajie HTTP web server 0.30a 并迁移至现代维护的 Web 服务器（如 Apache Tomcat、Jetty、Nginx 等）。若必须继续使用，请在 Web 服务器前部署 WAF 或反向代理（如 Nginx），配置规则拦截包含 "...."、"..%2f"、"..%5c" 等目录遍历序列的请求路径；同时在应用层实施路径规范化校验，规范化路径后校验是否在 Web 根目录下，禁止访问 Web 根目录外文件。建议尽快完成迁移，因该软件已于 2000 年停止维护，无官方补丁可用。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Bajie HTTP Web Server 目录遍历任意文件读取漏洞"
