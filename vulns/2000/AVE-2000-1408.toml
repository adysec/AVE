[basic]
description = "IBM Net.Data 的 db2www CGI 程序存在缓冲区溢出漏洞，远程攻击者可通过向目标系统发送超长的 PATH_INFO 环境变量触发该漏洞，导致缓冲区溢出，从而在服务器上以 CGI 进程权限执行任意命令。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响范围广泛，CVSS 评分 10.0，危害等级严重。"
published = "2000-10-20T04:00:00.000"
remediation = "立即将 IBM Net.Data (db2www) CGI 程序升级至官方修复版本，或彻底移除 db2www CGI 脚本并迁移至 IBM 当前支持的 Web 应用平台（如 WebSphere Liberty）。若无法立即升级，在 Web 服务器（Apache/IBM HTTP Server）层面通过 Location 指令限制对 /cgi-bin/db2www 的访问来源 IP，并启用 CGI 参数长度限制（LimitRequestLine 不超过 4096 字节）作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "IBM Net.Data db2www CGI 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:14.877"

