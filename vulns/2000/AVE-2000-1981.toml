[basic]
description = "Mandrake Linux 7.1 及更早版本（以及其他 Linux 发行版）中的 ypserv（NIS 服务）存在缓冲区溢出漏洞。当 ypserv 在编译时未启用 vsyslog() 函数时，远程攻击者无需认证即可通过网络向目标系统发送特制请求触发缓冲区溢出，成功利用可获取目标系统的 root 权限，实现完全控制。该漏洞 CVSS 评分 10.0，危害等级严重，影响范围广泛。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级 Mandrake Linux 至 7.1 以上版本，或安装 Mandrake 安全公告 MDKSA-2000:064 提供的 ypserv 补丁。如无法升级，可在 ypserv 编译时确保链接 vsyslog() 函数以消除缓冲区溢出条件；同时限制 NIS 服务仅对可信网段开放，在防火墙上阻断外部对 834/tcp 和 834/udp 端口的访问作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Mandrake Linux ypserv 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:02Z"

