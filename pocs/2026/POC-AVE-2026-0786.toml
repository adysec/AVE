[poc.requests.body]
type = "json"

[poc.requests.headers]
Accept = "application/json"
Content-Type = "application/json"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [201]
type = "status"

[[poc.requests.matchers]]
