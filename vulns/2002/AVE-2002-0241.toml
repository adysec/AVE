[basic]
description = "Ettercap 0.6.3.1 及更早版本中存在缓冲区溢出漏洞，存在于多个解码器中。当在 MTU 大于 2000 的网络上运行时，未经身份认证的远程攻击者可通过发送大型数据包触发该漏洞，从而在目标系统上执行任意代码。该漏洞影响使用 Ettercap 进行网络嗅探与中间人攻击的所有场景，危害等级高危。"
published = "2002-05-31T04:00:00Z"
remediation = "建议将 Ettercap 升级至 0.6.4 或更高版本（当前最新稳定版为 0.8.4.1），该版本已修复大 MTU 网络环境下解码器的缓冲区溢出问题。临时缓解措施：避免在 MTU 大于 2000 的网络接口（如 loopback、Token Ring、Hyperchannel）上运行 Ettercap，或在防火墙层面限制高 MTU 数据包进入运行 Ettercap 的主机。如无法立即升级，可将网络接口 MTU 强制修改为 1500 或更低以降低被利用风险。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Ettercap 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:57:07Z"

