[basic]
description = "Excon（Ruby 高性能 HTTP 1.1 客户端库）的 RedirectFollower 重定向跟随中间件存在敏感信息泄露漏洞（CWE-201）。当初始 HTTP 请求中包含 Authorization、Cookie 等敏感头部信息时，中间件在跟随重定向跳转到第三方目标服务器时未能正确剥离这些敏感头部，导致敏感凭据可能被泄露给非预期的第三方。攻击者可通过构造恶意的重定向响应，诱使使用 Excon 的客户端应用泄露其请求中的敏感头部数据。该漏洞影响 Excon 1.5.0 之前的所有版本，CVSS 评分 6.5，危害等级中危，攻击复杂度低，无需认证，但需要用户交互。"
published = "2026-07-17T20:17:26Z"
remediation = "立即将 excon 升级至 v1.5.0 或更高版本，该版本已修复 RedirectFollower 中间件未剥离敏感请求头的问题。如无法升级，可参考 commit ea89a353 将修复逻辑反向移植到自定义重定向跟随中间件中，手动添加需剥离的敏感头列表。"
score = 6.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Excon HTTP 库重定向敏感标头泄露漏洞"
updated = "2026-07-23T16:16:59Z"

