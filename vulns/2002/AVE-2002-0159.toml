[basic]
description = "Zope 2.2.0 至 2.5.1 版本中存在对象访问权限验证缺陷，系统未能正确校验具有代理角色的用户对受保护对象的访问权限，导致低权限用户可越权访问本应受限的文档内容。攻击者无需复杂条件即可利用该漏洞获取未授权访问，造成信息泄露或权限提升。CVSS 评分 7.5，危害等级高。"
published = "2002-04-22T04:00:00Z"
remediation = "立即升级 Zope 至 2.5.1 以上版本，并安装 Zope 官方提供的代理角色权限修复补丁（hotfix）。使用 Red Hat 系列发行版的用户应安装 RHSA-2002:060 提供的更新包。如无法立即升级，可在 Zope 管理界面中审查并移除不必要的代理角色分配，限制非管理员用户的代理角色使用权限。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Zope Zope 代理人角色权限绕过漏洞"
updated = "2026-06-16T21:56:55Z"

