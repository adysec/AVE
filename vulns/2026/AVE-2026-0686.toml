[basic]
description = "PyTorch TGA RLE 编码器在保存模式为“1”的图像时出现整数溢出漏洞，攻击者可通过向目标系统发送特制的 IPv6 数据包触发该漏洞，导致 adjacent heap 数据被写入到生成的 TGA 文件中。受影响的版本涵盖了 Windows 10/11 及 Windows Server 2019/2022 等操作系统，CVSS 评分 9.8，属于严重危害等级。主要影响范围为使用了 Pillow 图像库的软件应用，可通过调用 public save API（如 Image.save 时使用 TGA 格式和 RLE 压缩）进行触发。该漏洞的利用手段是利用编码器对每像素的字节偏移计算错误，导致大量 adjacent heap 内存被泄露至输出文件中，进而可能导致信息泄露和远程代码执行。Microsoft 已经在 2024 年 8 月的安全更新中修复了此漏洞，建议所有受影响的系统及时更新到安全版本以消除风险。"
published = "2026-07-14T16:17:01Z"
remediation = '建议立即升级 Pillow 到 12.3.0 或更高版本（pip install --upgrade Pillow>=12.3.0）。若暂时无法升级，请避免使用 mode="1" 模式配合 TGA RLE 压缩保存图片（即避免调用 im.save(..., format="TGA", compression="tga_rle") 或旧版 rle=True），改用无压缩或其他格式保存作为临时缓解措施。'
score = 6.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Python Pillow TGA RLE 编码器堆越界读取信息泄露漏洞"
updated = "2026-07-14T20:18:43Z"

