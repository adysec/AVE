[basic]
description = "Drupal 核心多个子系统存在远程代码执行漏洞（Drupalgeddon3），与 Drupalgeddon2 (SA-CORE-2018-002) 相关，攻击者可利用多个攻击向量在未授权或低权限条件下远程执行任意代码，导致 Drupal 站点被完全接管。影响 Drupal 7.x (<7.58) 及 8.x (<8.5.1) 版本，CVSS 3.1 评分 9.8（CRITICAL），已被 CISA 列入已知被利用漏洞目录，且已在野大规模利用，攻击者可通过构造恶意请求实现远程代码执行，建议立即升级至修复版本。"
published = "2018-07-19T17:29:00.373"
remediation = "立即升级 Drupal 到 7.58 或更高版本，或 8.6.0 或更高版本，应用官方安全补丁 SA-CORE-2018-002。如果无法立即升级，可临时通过防火墙禁用恶意上传的 PHP 文件处理，并确保对 Drupal 站点的严格的文件权限控制和定期安全扫描。立即检查已知受影响的网站版本，并应用安全更新到最新的稳定版 7.69 或 8.7.0。重要安全设置：禁用匿名用户上传权限，配置安全文件权限，部署 web 应用程序防火墙缓解攻击流量，并确保执行定期安全漏洞扫描和补丁管理。立即升级或配置缓解措施可阻止攻击者利用此漏洞执行恶意代码。立即升级或配置缓解措施可阻止攻击者利用此漏洞执行恶意代码。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Drupal Drupal 远程代码执行漏洞"
updated = "2026-06-17T02:03:26.140"

