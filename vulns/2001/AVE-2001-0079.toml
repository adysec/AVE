[basic]
description = "Informs Picserver 1.0 Web 服务器存在目录遍历漏洞，未经身份认证的远程攻击者可通过在 HTTP GET 请求中注入 `..`（点号）路径穿越序列，绕过服务器目录访问限制，读取目标系统上的任意敏感文件，如 `/etc/passwd` 等配置文件或应用源码。该漏洞利用门槛极低，攻击者仅需构造一条包含路径穿越参数的 HTTP 请求即可成功利用，且无需任何认证凭据或特殊网络环境。受影响版本为 Informs Picserver 1.0，利用后可导致服务器敏感信息泄露，危害系统机密性。CVSS 评分 5.0，危害等级中等。"
published = "2001-05-03T04:00:00Z"
remediation = "建议立即停用 Picserver 1.0 并迁移至受支持的最新版本 Web 服务器；如无法立即更换，应在服务器前端部署 WAF 或反向代理，对 HTTP 请求中的 `../`、`.../`、`%2e%2e%2f` 等路径穿越序列进行过滤阻断，并在 IIS/Apache 配置中禁用目录浏览权限，同时将网站根目录设置为独立分区并严格限制 NTFS/FAT 文件权限，防止攻击者跨目录读取系统敏感文件。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Informs Picserver 1.0 目录遍历漏洞"
updated = "2026-06-16T21:53:52Z"

