[basic]
description = "D-Link DVG-N5402SP 存在目录遍历漏洞（CWE-22），远程攻击者无需身份认证即可通过向设备的 `errorpage` 参数传入 `../` 路径穿越序列，读取设备上的任意敏感文件（如配置文件、系统密码等）。该漏洞影响固件版本 W1000CN-00、W1000CN-03 及 W2000EN-00，攻击复杂度低，无需用户交互，CVSS 评分 7.5，危害等级高。厂商未发布官方补丁，建议限制设备管理页面的网络访问权限。"
published = "2017-04-24T18:59:00Z"
remediation = "该设备已停止支持，D-Link 未发布固件补丁。建议立即将设备置于防火墙后，限制仅受信 IP 访问 8080 管理端口；或直接替换为受支持的设备。临时缓解措施：在 Web 服务器层面过滤 errorpage 参数中的 `../` 路径遍历字符。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "D-Link DVG-N5402SP 目录遍历漏洞"
updated = "2026-06-17T00:32:07Z"

