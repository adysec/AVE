[basic]
description = "Citrix ADC 和 Citrix Gateway 等产品存在输入验证不当漏洞（CWE-20），低权限用户可通过发送特制请求绕过访问控制，访问未经授权的敏感信息。该漏洞影响 Citrix ADC 13.0-58.30、12.1-57.18、12.0-63.21、11.1-64.14 及 10.5-70.18 之前版本，以及 Citrix SDWAN WAN-OP 11.1.1a、11.0.3d 及 10.2.7 之前版本。攻击者无需用户交互，在网络中即可利用此漏洞读取系统敏感配置信息。Citrix 已发布安全更新修复此漏洞。"
published = "2020-07-10T16:15:12.327"
remediation = "立即升级Citrix ADC和Citrix Gateway到13.1-50.70或更高版本，或12.1-65.18及以上版本，这些版本包含针对CVE-2020-8195的修复。如果无法立即升级，可临时禁用NITRO API接口或限制其仅对内网IP访问，作为即时的缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["kev"]
title = "Citrix ADC Gateway SDWAN WAN-OP 敏感信息泄露漏洞"
updated = "2026-06-17T03:26:01.840"

