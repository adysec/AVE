[basic]
description = "Ivanti Endpoint Manager（EPM）的 Core Server 组件在 2024 SU6 之前的版本中暴露了危险的方法接口（CWE-749），存在访问凭证泄露漏洞。该漏洞源于 Core Server 未对某些敏感方法进行充分的访问控制，使远程认证的恶意用户能够利用这些暴露的方法非法获取系统的访问凭据，从而窃取高敏感信息。攻击者无需特殊权限，仅需具备合法的远程认证身份即可发起攻击，整个攻击过程可远程通过网络完成，无需用户交互。该漏洞影响 Ivanti Endpoint Manager 2024 SU6 之前的所有版本，其 CVSS 3.1 评分为 6.5 分，危害等级为中等，主要威胁在于机密性（C:H）受到完全破坏，攻击者可借此获取受保护账户的认证信息，为后续横向移动或深入渗透提供条件。建议用户尽快升级至 2024 SU6 或更高版本以修复此漏洞。"
published = "2026-05-12T15:16:17Z"
remediation = "建议立即将 Ivanti Endpoint Manager 升级至 2024 SU6 及以上版本，该版本已修复 Core Server 暴露的危险方法，可从 Ivanti 官网（https://www.ivanti.com）下载对应补丁。升级前可采取临时缓解措施：在网络防火墙或主机防火墙层面限制对 Core Server（默认端口 443/80 及 EPM 管理端口）的访问，仅允许受信任管理网段访问；同时梳理并最小化 Core Server 的账户权限，关闭不必要的远程管理接口，并开启审计日志监控异常的凭证读取行为。"
score = 6.5
severity = "MEDIUM"
sources = ["zdi"]
title = "Ivanti Endpoint Manager 核心服务器凭证泄露漏洞"
updated = "2026-06-17T11:03:29Z"

