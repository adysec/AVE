[basic]
description = "sane-backends 1.0.7 及更早版本中的 saned（SANE 扫描仪网络守护进程）存在远程代码执行漏洞。该守护进程在处理 RPC（远程过程调用）请求时，未对接收到的 RPC 编号进行有效性校验即直接获取并处理对应参数。未经身份认证的远程攻击者可通过向目标系统发送特制的 RPC 请求，利用参数处理过程中的缺陷触发缓冲区溢出或命令注入，最终实现远程代码执行或系统控制。该漏洞影响运行较旧版本 sane-backends 的系统，攻击复杂度低，无需认证即可在网络可达条件下完成利用。"
published = "2003-09-22T04:00:00Z"
remediation = "升级 sane-backends 至 1.0.11 或更高版本，该版本已修复 saned 对 RPC 号码有效性的验证问题。临时缓解措施包括：在 saned.conf 中仅允许可信主机访问，禁用 net 后端，或在防火墙层面限制 6566/tcp 端口的入站连接。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "SANE sane-backends saned RPC 参数校验绕过远程代码执行漏洞"
updated = "2026-06-16T22:02:48Z"

