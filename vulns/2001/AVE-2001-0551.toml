[basic]
description = "phpBB 1.4.0 和 1.4.1 版本的 prefs.php 文件中存在 SQL 注入漏洞，远程已认证攻击者可通过 viewemail 参数注入任意 SQL 命令，从而执行任意 SQL 语句并获取管理员权限。该漏洞影响 phpBB 1.4.0 和 1.4.1 版本，攻击者需具备有效用户账号进行认证后，通过构造恶意的 viewemail 参数值注入 SQL 语句，绕过权限控制实现权限提升至管理员权限。CVSS 评分 4.6（中等危害），属于 SQL 注入类漏洞（CWE-89）。"
published = "2001-08-03T04:00:00Z"
remediation = "升级 phpBB 至 2.0.0 及以上版本（该版本重构了输入过滤机制，修复了 prefs.php 中的 SQL 注入问题）；如无法升级，在 prefs.php 中对 viewemail 参数进行严格的输入验证和转义处理，使用 addslashes() 或数据库专用转义函数处理用户输入，并限制 prefs.php 仅允许管理员访问。"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "phpBB 1.4 SQL注入漏洞"
updated = "2026-06-16T21:56:20Z"

