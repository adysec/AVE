[info]
author = "ave"
description = "验证 Pillow McIdasImagePlugin 在处理 McIdas AREA 格式图像时存在越界读取漏洞。攻击者构造 stride 字段远小于实际行宽的恶意 .area 文件，诱导 Pillow 加载后像素访问操作将读取映射区域外的内存。"
id = "POC-AVE-2026-0449"
name = "CVE-2026-54058 Pillow McIdas AREA 越界读取 PoC"
severity = "high"
tags = [
    "cve-2026-54058",
    "pillow",
    "mvidas",
    "oob-read",
]
vuln_id = [
    "CVE-2026-54058",
    "AVE-2026-0449",
    "GHSA-62p4-gmf7-7g93",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/tmp/cve-2026-54058-test.area"
protocol = "file"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["not an McIdas area file"]
