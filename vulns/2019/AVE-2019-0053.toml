[basic]
description = 'IceWarp Mail Server 10.4.4 及之前版本在 webmail/calendar/minimizer/index.php 接口的 style 参数处理上存在目录遍历漏洞，攻击者可通过构造包含 ..\ 等路径穿越序列的恶意请求，绕过路径限制读取服务器本地任意文件。该漏洞无需身份认证即可远程利用，影响 IceWarp 邮件服务器所有受影响版本，CVSS 3.0 评分 7.5（HIGH），攻击向量为网络、攻击复杂度低、无需权限、无需用户交互，成功利用可导致敏感文件泄露（如配置文件、系统文件等），进而可能引发后续攻击。IceWarp 官方已在后续版本中修复此漏洞，建议用户尽快升级至最新版本并限制相关接口的外部访问。'
published = "2019-06-03T17:29:01Z"
remediation = "升级 IceWarp Mail Server 至 10.4.5 或更高版本以修复该目录遍历漏洞。如暂时无法升级，可在 Web 服务器配置中通过访问控制规则拦截对 webmail/calendar/minimizer/index.php 的恶意请求，或在防火墙层限制外部对日历最小化功能的访问，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "IceWarp Mail Server 本地文件包含漏洞"
updated = "2026-06-17T02:14:55Z"

