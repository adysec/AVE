[basic]
description = "Fastream FUR HTTP Server 1.0b 存在拒绝服务漏洞。远程攻击者可通过向服务器发送超长 GET 请求，导致服务器进程崩溃或无法响应正常请求，造成服务中断。该漏洞无需身份认证即可远程触发，攻击条件简单，仅需构造特制 HTTP 请求即可利用。受影响版本为 Fastream FUR HTTP Server 1.0b，CVSS 评分 5.0，危害等级中危。"
published = "2000-11-14T05:00:00Z"
remediation = "该产品已停止维护，官方未发布补丁。建议立即替换为受支持的 HTTP 服务器（如 Apache httpd、Nginx 等），并在迁移前在网络层（防火墙/WAF）配置规则，限制 HTTP GET 请求 URI 长度不超过 1024 字节，以临时缓解拒绝服务攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Fastream FUR HTTP Server 1.0b GET请求拒绝服务漏洞"
updated = "2026-06-16T21:52:34Z"

