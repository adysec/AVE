[basic]
description = "Apple iOS 5.1 之前版本及 iTunes 10.6 之前版本中使用的 WebKit 引擎存在内存破坏漏洞（CWE-119），远程攻击者可通过诱导用户访问特制恶意网站触发该漏洞，成功利用可导致任意代码执行或应用程序崩溃拒绝服务。该漏洞影响 Safari 5.1.4 之前版本，CVSS 评分 9.3，危害严重。Apple 已在 2012 年 3 月安全更新中修复此漏洞。"
published = "2012-03-08T22:55:02Z"
remediation = "立即将 Apple Safari 升级至 5.1.4 或更高版本（Mac 用户通过 Software Update 更新），将 iOS 设备升级至 5.1 或更高版本（通过 iTunes 或 OTA 更新），将 iTunes for Windows 升级至 10.6 或更高版本。Apple 已于 2012 年 3 月 7 日发布安全更新（APPLE-SA-2012-03-07-1/2）修复此漏洞。如无法立即升级，可配置 Web 内容过滤或禁用 JavaScript 作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:55Z"

