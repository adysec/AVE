[basic]
description = "Windows 内核存在内存信息泄露漏洞，由于内核未正确管理内存对象访问权限，导致已获得低权限的本地攻击者可通过特制程序调用受影响系统调用，读取内核内存中的敏感信息，包括密码哈希、令牌等机密数据。该漏洞影响所有受支持的 Windows 10/11 及 Windows Server 版本，CVSS 评分 5.5，危害等级中危。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:56Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新（KB5050021），通过 Windows Update 自动获取或访问 Microsoft 更新目录手动下载。各受影响版本对应修复版本：Windows 10 1507 升级至 10.0.10240.20890，Windows 10 1607/Server 2016 升级至 10.0.14393.7699，Windows 10 1809/Server 2019 升级至 10.0.17763.6775，Windows 10 21H2 升级至 10.0.19044.5371，Windows 10 22H2 升级至 10.0.19045.5371，Windows 11 22H2/23H2 升级至 10.0.22621.4751 或 10.0.22631.4751，Windows 11 24H2/Server 2025 升级至 10.0.26100.2894，Server 2022 升级至 10.0.20348.3091。如无法立即打补丁，可限制本地用户登录权限并启用 Windows Defender  Credential Guard 缓解内核内存读取风险。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 内核内存信息泄露漏洞"
updated = "2026-06-17T08:43:05Z"

