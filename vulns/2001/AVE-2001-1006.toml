[basic]
description = "bing 是 Berkeley Internet Name Domain 守护进程及相关网络工具中的缓冲区溢出漏洞。该漏洞存在于工具执行反向 DNS 查询的代码路径中，当调用 gethostbyaddr 函数对远程主机地址进行反向域名解析时，获取到的主机名会被复制到一个固定大小的缓冲区中，但程序未对主机名长度进行校验。未经身份认证的远程攻击者可通过向目标系统发送带有超长主机名的特制 DNS 响应，触发反向 DNS 查询过程，从而造成缓冲区溢出并可能执行任意命令。该漏洞影响运行含受影响版本 BIND 的 Unix/Linux 系统，攻击条件为攻击者能够控制 DNS 服务器或发送特制 DNS 数据包，且目标系统配置为对攻击者可触达的地址执行反向 DNS 查找。由于可通过网络远程利用、无需身份认证即可触发、可导致完整的机密性/完整性/可用性丧失，CVSS v2 评分高达 10.0，危害等级极其严重。用户应升级至 BIND 的修复版本并限制不必要的反向 DNS 查询。"
published = "2001-03-26T05:00:00Z"
remediation = "立即升级 bing 至 1.3.5-5 或更高版本以修复缓冲区溢出漏洞。若无法立即升级，可在防火墙中禁止 bing 对外发起反向 DNS 查询作为临时缓解措施，并以非 root 权限运行该程序。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "BSD bing 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:52Z"

