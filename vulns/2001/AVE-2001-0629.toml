[basic]
description = "Solaris 2.6 及更早版本中的 exrecover 工具存在缓冲区溢出漏洞，本地用户可通过向该程序提交超长命令行参数触发缓冲区溢出，从而获得提升的权限。该漏洞影响 Solaris 2.6 及之前版本，攻击者需拥有本地系统访问权限，利用难度较低，成功利用后可获取目标系统的完全控制权（包括读取、修改和删除任意文件）。"
published = "2001-03-12T05:00:00.000"
remediation = "立即移除 /usr/lib/exrecover 的 suid 权限：chmod u-s /usr/lib/exrecover。Solaris 2.6 及更早版本已停止支持，Oracle 不再提供安全补丁，建议升级到受支持的 Solaris 11.4 或更高版本。如无法升级，可通过限制本地用户登录或使用 RBAC 替代 suid 机制作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Sun Solaris exrecover 缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:53:42.087"

