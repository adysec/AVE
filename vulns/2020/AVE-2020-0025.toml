[basic]
description = "Apple tvOS、iOS和iPadOS中的AVEVideoEncoder组件存在内存破坏漏洞（CWE-787越界写入）。攻击者可利用此漏洞通过构造特制的媒体内容触发内存越界写入，从而以内核权限执行任意代码。该漏洞影响iOS 13.6之前的版本、iPadOS 13.6之前的版本以及tvOS 13.4.8之前的版本。攻击条件为诱使目标设备播放恶意构造的媒体文件，无需额外权限即可触发。Apple已在iOS 13.6、iPadOS 13.6和tvOS 13.4.8中移除存在漏洞的代码以修复此问题。"
published = "2020-10-16T17:15:16.590"
remediation = "` tags.<value>建议立即将所有受影响的 Apple 设备升级到 iOS 13.6 及更高版本，或 iPadOS 13.6 及更高版本。对于 Apple TV 设备，请升级到 tvOS 13.4.8 或更高版本。如无法立即更新，建议通过 Apple 配置服务禁用未经验证的第三方应用安装，并关闭所有未知配置文件协议作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Apple iOS iPadOS tvOS AVVideoEncoder 任意代码执行漏洞"
updated = "2026-06-17T03:28:47.057"

