[info]
author = "ave"
description = "验证 Red Hat Linux 6.2 diskcheck.pl 符号链接攻击漏洞：本地用户创建指向系统文件的符号链接，诱使 diskcheck.pl 以特权写入临时文件，从而覆盖任意文件。"
id = "POC-AVE-2000-0869"
name = "CVE-2000-0715 PoC"
severity = "low"
tags = ["ave-2000-0869"]
vuln_id = [
    "CVE-2000-0715",
    "AVE-2000-0869",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
