[basic]
description = "标签之间。<value>eQ-3 AG Homematic CCU3 3.43.15 及更早版本存在目录遍历漏洞，未经身份认证的远程攻击者可通过 Web 界面发送特制请求利用该漏洞，读取设备文件系统中的任意文件。该漏洞影响 Homematic CCU3 中央控制单元的所有未修复版本，攻击者无需凭据即可获取敏感配置文件、密码等敏感信息。CVSS 评分 7.5，危害等级高。eQ-3 AG 已在新版本中修复此漏洞。"
published = "2019-05-13T17:29:03Z"
remediation = "升级到 eQ-3 AG 发布的 CCU3 最新固件版本（高于 3.43.15），可通过设备 Web 界面或官方下载页面获取更新包并安装。如无法立即升级，应暂时在防火墙或路由器层面限制对 CCU3 Web 界面的外部访问，仅允许受信任的 IP 地址访问 80/443 端口，以缓解目录遍历攻击风险。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "eQ-3 AG Homematic CCU3 目录遍历漏洞"
updated = "2026-06-17T02:44:14Z"

