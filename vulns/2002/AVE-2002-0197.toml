[basic]
description = "Ethereal（现 Wireshark）0.9.3 及之前版本的 X11 协议解析器中存在缓冲区溢出漏洞。远程攻击者可构造特制的 X11 数据包，在 keysyms 解析过程中触发栈缓冲区溢出，导致 Ethereal 服务崩溃（拒绝服务），并可能利用该漏洞执行任意代码。攻击无需身份认证，仅需向目标发送恶意网络流量即可触发。该漏洞影响所有使用受影响版本的 Ethereal 网络分析工具。"
published = "2002-06-18T04:00:00Z"
remediation = "升级 Ethereal 至 0.9.4 或更高版本。Debian 用户安装 dsa-130 更新，Red Hat 用户安装 RHSA-2002-036/RHSA-2002-088/RHSA-2002-170 补丁。当前用户应升级至最新版 Wireshark 以获得持续安全修复。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Ethereal X11 解析器缓冲区溢出漏洞"
updated = "2026-06-16T21:57:22Z"

