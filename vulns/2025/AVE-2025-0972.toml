[basic]
description = "Linux 内核 neighbour 子系统中的 __neigh_notify() 函数存在释放后使用漏洞。该函数可在未获取 RTNL（路由表锁）或 RCU 保护的情况下被调用，导致内核在处理邻居通知时访问已被释放的内存对象，造成释放后使用。该漏洞影响使用 Linux 内核的系统，攻击者需要本地低权限访问权限才能触发，成功利用可导致本地权限提升，获取系统内核级别的读写权限，进而完全控制受影响的主机系统。CVSS 评分 7.8（高危），攻击向量为本地、攻击复杂度低、所需权限为低权限、无需用户交互，对机密性、完整性和可用性的影响均为高。"
published = "2025-02-27T03:15:16.960"
remediation = "Linux kernel 用户应立即升级至已修复的稳定版本：5.4.291、5.10.235、5.15.179、6.1.129、6.6.79 或 6.12.16 及以上版本。Ubuntu 用户可分别升级到 20.04 的 5.4.0-216.236、22.04 的 5.15.0-140.150、24.04 的 6.8.0-78.78 或 24.10 的 6.11.0-26.26；RHEL/CentOS 用户应通过 yum/dnf update kernel 安装最新安全更新并重启系统。如暂无法升级，可通过 sysctl 限制本地用户对 neighbour 子系统的并发访问作为临时缓解，但建议尽快完成内核升级。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 neighbour 子系统释放后使用漏洞"
updated = "2026-06-17T08:44:13.207"

