[basic]
description = "Namazu 2.0.9 及更早版本存在跨站脚本（XSS）漏洞，远程攻击者可通过在 idxname 参数中指定无效索引文件，触发错误消息页面未正确过滤用户输入，从而注入并执行任意 JavaScript 脚本。该漏洞影响 Namazu 2.0.9 及之前所有版本，攻击者无需身份认证即可利用，CVSS 评分 7.5，危害等级高。成功利用可导致敏感信息窃取、会话劫持等后果。"
published = "2001-12-27T05:00:00Z"
remediation = "升级 Namazu 至 2.0.10 或更高版本（2.0.9 及更早版本存在此漏洞）。Red Hat Linux 用户可安装 RHSA-2001:162-04 提供的更新包。如无法立即升级，在 Web 服务器前端部署 WAF 规则过滤 idxname 参数中的恶意 HTML/JavaScript 字符作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Namazu 2.0.9 错误消息跨站脚本漏洞"
updated = "2026-06-16T21:56:06Z"

