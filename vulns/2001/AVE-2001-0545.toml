[basic]
description = "Cobalt Qube 3 的 WebMail 2.0.1 版本中存在 readmsg.php 文件的目录遍历漏洞，远程攻击者可通过 mailbox 参数传入 `../` 路径遍历序列，突破 Web 目录限制读取服务器任意文件。该漏洞影响使用 Cobalt Qube 设备的邮件服务系统，攻击者无需身份验证即可远程利用，严重威胁邮件系统的文件保密性。CVSS 评分 5.0，属于中危级别，攻击者可轻易利用该漏洞获取敏感服务器文件信息。（原文自 NVD 官方描述，融合本地 ExploitDB 实际技术细节）"
published = "2001-07-05T04:00:00Z"
remediation = "建议立即升级 Cobalt Qube Webmail 至 2.0.1 以上版本（建议升级至最新版本）。若无法立即升级，可在 Web 服务器配置中限制 mailbox 参数仅允许字母数字字符，禁止目录遍历字符（../），或在 Web 应用防火墙层面拦截包含目录遍历序列的请求作为临时缓解措施。建议联系 Sun Microsystems（Cobalt 产品线已归属）获取官方补丁包或迁移至现代邮件系统。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Cobalt Qube Webmail 目录遍历漏洞"
updated = "2026-06-16T21:56:12Z"

