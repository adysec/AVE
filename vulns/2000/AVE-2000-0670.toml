[basic]
description = "BOA Web Server 0.94.8.2 及更早版本存在目录遍历漏洞。漏洞原理在于服务器对 HTTP GET 请求中的路径过滤不严，攻击者可以通过将点号（.）替换为 URL 编码形式的 `%2E`，绕过简单的路径检查机制。在无需身份验证的情况下，远程攻击者可构造特殊的请求路径访问服务器根目录以外的任意文件，导致敏感信息泄露。该漏洞影响所有部署了受影响版本 BOA Web Server 的系统。"
published = "2000-12-19T05:00:00.000"
remediation = '建议立即停止使用 BOA Web Server 0.94.8.2 及更早版本，迁移至 Apache 或 Nginx 等现代且受支持的 Web 服务器。若必须维持运行，可通过在 Web 应用防火墙（WAF）中配置过滤规则，拦截包含 "%2E" 或 "..%2f" 等目录遍历特征的 HTTP 请求以缓解风险。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "BOA Web Server 任意文件访问漏洞"
updated = "2026-06-16T21:52:46.130"

