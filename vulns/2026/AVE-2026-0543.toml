[basic]
description = "websocket-driver 库在配合 permessage-deflate 扩展使用时存在资源限制绕过漏洞。该漏洞源于消息大小检查逻辑缺陷：库在 lib/websocket/driver/hybi.js 中仅根据压缩后的帧长度头校验消息大小，而非解压后的实际大小。远程攻击者无需身份认证即可通过发送特制的压缩 WebSocket 消息，使服务端或客户端接受远超配置上限的消息，导致目标系统内存和 CPU 资源被过度消耗，造成拒绝服务。该漏洞影响所有使用 websocket-driver 0.7.5 之前版本且启用了 permessage-deflate 扩展的应用，CVSS 评分 6.3，危害等级中危。"
published = "2026-07-17T21:17:08Z"
remediation = "立即将 websocket-driver 升级至 0.7.5 或以上版本（npm update websocket-driver），该版本在解压后校验消息长度以修复压缩绕过问题。如无法升级，可禁用 permessage-deflate 扩展（设置 perMessageDeflate: false）作为临时缓解措施。"
score = 6.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Faye websocket-driver 消息压缩资源限制绕过漏洞"
updated = "2026-07-23T18:14:09Z"

