[basic]
description = "NAPTHA 类拒绝服务漏洞影响多种 TCP/IP 协议栈实现，包括 Microsoft Windows 95/98/98SE/NT 4.0 等操作系统。远程攻击者无需身份认证即可通过向目标主机大量发送 TCP 连接请求并完成三次握手，但不维护自身连接状态，导致目标系统维护大量半开放连接耗尽资源，最终造成拒绝服务。该攻击方式无需特殊网络位置，攻击者仅需具备基本 TCP 通信能力即可实施，影响范围广泛。"
published = "2001-01-09T05:00:00.000"
remediation = 'Windows NT 4.0 用户应立即安装 MS00-091 安全补丁（下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=176A1B04-06A6-452C-985D-04E32679E71C），需先安装 Service Pack 6a。Windows 95/98/98SE/Me 用户无官方补丁，应在防火墙层面阻止 TCP 端口 139 的入站流量，并在不需要文件共享时禁用"文件和打印机共享"服务（参见 KB199346）。Windows 2000 不受此漏洞影响。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows 95/98/98SE/NT 4.0 TCP 连接拒绝服务漏洞"
updated = "2026-06-16T21:53:01.593"

