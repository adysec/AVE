[basic]
description = "Phorum 3.0.7 版本的管理后台 admin.php3 存在未经验证的密码修改漏洞。远程攻击者无需任何身份认证，只需向目标服务器发送特制的 HTTP 请求，设置 step、option、confirm 及 newPassword 等参数，即可直接修改管理员密码，从而获得论坛管理权限。该漏洞攻击复杂度低，无需特殊权限，可导致论坛数据被篡改或恶意控制。受影响版本为 Phorum 3.0.7。"
published = "2000-12-31T05:00:00Z"
remediation = "立即升级 Phorum 至 3.0.8 或更高版本，该漏洞已在后续版本中修复。如无法升级，在 Web 服务器（Apache/Nginx）层面对 admin.php3 添加访问控制，例如通过 .htaccess 限制仅允许特定管理 IP 访问，或设置 HTTP Basic 认证。同时检查并删除 admin.php3 中未经验证的密码修改逻辑（step=4 分支），确保密码修改操作必须校验当前管理员密码。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Phorum 3.0.7 未经验证的管理员密码更改漏洞"
updated = "2026-06-16T21:53:25Z"

