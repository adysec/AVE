[basic]
description = "CVE-2001-0205是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-05-03T04:00:00Z"
remediation = 'AOLserver 3.2 对路径中的".."进行了过滤，但未过滤"...（三个点），导致攻击者可通过构造包含".../"的 URL 读取 Web 根目录之外的任意文件。修复建议：1) 立即升级 AOLserver 至 3.3 或更高版本，新版本已修复该路径校验逻辑；2) 若暂无法升级，可在 Tcl 配置文件中添加路径过滤规则，使用 ns_adp_append 或自定义过滤器拒绝所有包含"..."的请求路径，或在前端部署反向代理（如 Nginx）对请求 URI 中的连续三个点进行拦截；3) 将 Web 根目录设置为仅包含必要文件的独立目录，并严格限制该目录的文件系统权限，防止敏感文件被读取；4) 由于 AOLserver 已停止官方维护，建议评估迁移至 Apache、Nginx 或其他持续维护的 Web 服务器。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "AOLserver 3.2 目录遍历漏洞"
updated = "2026-06-16T21:53:52Z"

