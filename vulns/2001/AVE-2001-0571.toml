[basic]
description = 'Microsoft IIS 4.0 和 5.0 版本中存在文件片段泄漏漏洞。远程攻击者通过在请求 URL 后附加 "%3F+.htr" 字符串，可触发 .HTR ISAPI 扩展解析可执行 Web 服务器程序的源文件，导致源代码泄露。攻击者无需身份认证即可通过网络远程利用该漏洞，获取敏感信息如 ASP 脚本源码，为后续攻击提供情报支撑。该漏洞影响 Windows NT 4.0 和 Windows 2000 上运行的 IIS 服务器。'
published = "2001-02-12T05:00:00Z"
remediation = "立即删除 IIS 中 .htr 脚本映射：打开 IIS 管理器 → 网站属性 → 主目录 → 配置 → 删除 .htr 映射。同时安装 Microsoft 安全更新 MS01-004（Windows 2000 补丁 Q285985），或升级至 Windows 2000 Service Pack 2 及以上版本。如无需 Web 密码修改功能，建议彻底卸载 IIS 的 HTR ISAPI 筛选器。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft IIS 文件片段泄漏漏洞"
updated = "2026-06-16T21:53:28Z"

