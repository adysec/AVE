[basic]
description = 'SmartWin CyberOffice Shopping Cart 2（又称 CyberShop）存在价格修改漏洞。远程攻击者可通过拦截并修改订单提交请求中的 "Price" 隐藏表单变量值，以任意价格完成商品购买。该漏洞源于服务端未对客户端提交的价格参数进行有效性校验，攻击者无需身份认证即可利用，影响所有使用该购物车系统的网站，可能导致商家遭受经济损失。CVSS 评分 7.5，危害等级高。'
published = "2000-12-19T05:00:00.000"
remediation = '该漏洞源于客户端隐藏表单字段"Price"可被任意篡改，服务端未做校验。修复措施：1）将价格计算逻辑移至服务端，从数据库获取商品定价而非信任客户端提交值；2）在提交订单时重新计算总价并与客户端提交值比对；3）由于 SmartWin CyberOffice Shopping Cart 2.0 已停止维护，建议迁移至受支持的购物车系统（如 Magento、WooCommerce），并对所有涉及金额的输入实施服务端校验与签名机制。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "SmartWin CyberOffice Shopping Cart 2.0 价格修改漏洞"
updated = "2026-06-16T21:52:46.943"

