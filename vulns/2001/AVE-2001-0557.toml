[basic]
description = "Windows 2000 的 RunAs 服务（runas.exe）存在命名管道劫持漏洞。当 RunAs 服务停止时，本地攻击者可在系统上创建伪造的命名管道，当其他客户端连接该服务时，攻击者能够捕获通过管道传输的明文用户名和密码。该漏洞影响 Windows 2000 系统，攻击者需具备本地系统访问权限。厂商对此存在争议，认为利用该漏洞已需要管理员权限。Exploit-DB 上已有公开的利用代码。"
published = "2001-12-31T05:00:00Z"
remediation = "建议立即升级至受支持的 Windows 版本（如 Windows 10/11 或 Windows Server 2019+），Windows 2000 已停止支持且无官方补丁。如无法升级，严格限制本地登录用户仅为受信任管理员，通过组策略禁止普通用户交互式登录；同时禁用 RunAs 服务或使用防火墙限制本地管道通信作为临时缓解措施。"
score = 3.6
severity = "LOW"
sources = ["exploitdb"]
title = "Microsoft Windows 2000 RunAs 服务命名管道劫持漏洞"
updated = "2026-06-16T21:56:25Z"

