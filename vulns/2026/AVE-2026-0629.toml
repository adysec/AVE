[basic]
description = "Kiwi TCMS 的 TestCase.extra_link 和 TestPlan.extra_link 字段设计用于存储外部资源 URL，但在 16.1 版本之前未对用户输入进行任何清理或转义处理，导致恶意用户可构造包含 JavaScript: URI 的链接并存储于这些字段中。当其他用户访问包含恶意链接的测试用例或测试计划页面时，浏览器会直接执行该 JavaScript 代码，造成存储型跨站脚本攻击。攻击者无需认证即可在目标页面中嵌入恶意脚本，窃取用户会话 Cookie 或执行其他恶意操作。官方 Docker 镜像默认启用的 Content-Security-Policy 头可阻止内联 JavaScript 执行，在一定程度上降低了实际利用风险，但修改了默认安全配置的部署环境仍可能受影响。Kiwi TCMS 团队已在 16.1 版本中修复此问题，对 extra_link 字段进行严格清理，并将已有不合规记录重置为空值。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级 Kiwi TCMS 至 16.1 或更高版本。升级后，`TestCase.extra_link` 和 `TestPlan.extra_link` 字段的用户输入将被正确清理，已有不合规数据库记录将被重置为 null。如使用 Docker 部署，拉取最新镜像 `pub.kiwitcms.eu/kiwitcms/kiwi:latest` 重新部署。如无法立即升级，确保保留默认 Content-Security-Policy 头以阻止内联 JavaScript 执行，作为临时缓解措施。"
score = 3.5
severity = "LOW"
sources = ["ghsa"]
title = "Kiwi TCMS 测试管理平台 extra_link 字段存储型跨站脚本漏洞"
updated = "2026-01-01T00:00:00Z"

