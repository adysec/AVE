[basic]
description = "Apple QuickTime 7.7.2 之前版本在处理 Sorenson 编码的媒体文件时存在缓冲区溢出漏洞。远程攻击者可向用户发送特制的恶意媒体文件，当用户使用 QuickTime 播放该文件时触发缓冲区溢出，导致任意代码执行或应用程序崩溃。该漏洞影响 Windows 平台上的 QuickTime 播放器，攻击者无需身份认证即可利用，危害严重。用户应升级至 QuickTime 7.7.2 或更高版本以修复此漏洞。"
published = "2012-05-16T10:12:58Z"
remediation = "立即将 Apple QuickTime 升级至 7.7.2 或更高版本（2012 年 5 月 15 日发布，通过 Apple 软件更新或访问 support.apple.com/kb/HT5261 获取）。由于 Apple 已停止对 Windows 版 QuickTime 的支持，建议在不必要时彻底卸载 QuickTime for Windows；如必须使用，切勿打开来源不明的 Sorenson 编码媒体文件，并在浏览器中禁用 QuickTime 插件以防止网页触发的远程利用。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime Sorenson编码文件缓冲区溢出漏洞"
updated = "2026-06-16T23:38:02Z"

