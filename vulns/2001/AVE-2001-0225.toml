[basic]
description = "fetchmail 5.5.0-2 及更早版本在 AUTHENTICATE GSSAPI 命令处理中存在安全漏洞。远程攻击者无需身份认证即可利用该漏洞，通过向运行 fetchmail 的邮件服务器发送特制的 GSSAPI 认证请求，触发内存处理异常，导致攻击者能够完全控制目标系统，实现机密信息窃取、数据篡改及服务中断。该漏洞影响所有使用受影响版本 fetchmail 的邮件代理服务，攻击复杂度低，危害等级严重。Red Hat 和 TurboLinux 已发布相关安全公告和补丁。"
published = "2001-02-12T05:00:00Z"
remediation = "升级 fetchmail 至 5.5.0-3 或更高版本。如无法立即升级，可在 fetchmail 配置文件中禁用 GSSAPI 认证（设置 `auth ssh` 或 `auth kerberos_v5` 避免使用 GSSAPI 路径），或在网络边界限制对 fetchmail 服务的访问来源 IP。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "fetchmail fetchmail GSSAPI认证远程代码执行漏洞"
updated = "2026-06-16T21:53:39Z"

