[basic]
description = "HP OpenView Network Node Manager (NNM) 6.1 及更早版本中的 OverView5 CGI 程序存在缓冲区溢出漏洞，该漏洞源于 Java SNMP MIB Browser 在解析特制对象标识符（Object ID）时未对输入长度进行充分边界检查，攻击者可通过构造恶意 SNMP MIB 请求触发缓冲区溢出。未经身份认证的远程攻击者只需向目标 NNM 服务器发送特制 SNMP 数据包即可利用此漏洞，导致 SNMP 服务进程（snmp.exe）崩溃并拒绝服务，在某些条件下攻击者还可能进一步执行任意系统命令。该漏洞影响 HP OpenView NNM 6.1 及更早版本的所有部署实例，CVSS 评分 5.0，危害等级为低。ExploitDB 已公开可用的概念验证代码，建议用户尽快安装厂商发布的安全补丁进行修复。"
published = "2000-12-11T05:00:00.000"
remediation = "升级到 HP OpenView Network Node Manager 6.2 或更高版本，修复 OverView5 CGI 程序的缓冲区溢出漏洞。如无法立即升级，可访问 HP 官方支持站点 http://support.openview.hp.com/selfsolve/patches 下载对应平台的补丁程序并安装。临时缓解措施：通过防火墙或 Web 服务器配置限制外部对 /OvCgi/OpenView5.exe 接口的访问，仅允许可信管理网段访问该 CGI 程序，阻止攻击者发送特制 SNMP 请求导致 snmp.exe 服务崩溃。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "HP OpenView Network Node Manager SNMP 远程缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:53:04.140"

