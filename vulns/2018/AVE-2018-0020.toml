[basic]
description = "Jolokia agent 1.3.7 版本在代理模式下存在 JNDI 注入漏洞。由于该版本未对用户输入的 JNDI 资源名称进行严格校验，远程未经身份验证的攻击者可通过发送特制的 HTTP 请求，诱导服务器连接到攻击者控制的恶意 RMI/LDAP 服务器，从而加载并执行任意 Java 代码，导致服务器被完全接管。此漏洞影响运行在代理模式下的 Jolokia agent 1.3.7 及其以下版本。"
published = "2018-03-14T13:29:00Z"
remediation = "建议将 Jolokia Agent 升级到 1.3.8 或更高版本。若无法立即升级，应在配置中关闭代理模式（proxy mode），或通过网络防火墙限制对 Jolokia 接口的外部访问，以防止远程攻击者利用 JNDI 注入执行代码。"
score = 8.1
severity = "HIGH"
sources = ["nuclei"]
title = "Jolokia agent JNDI 注入远程代码执行漏洞"
updated = "2026-06-17T01:32:29Z"

