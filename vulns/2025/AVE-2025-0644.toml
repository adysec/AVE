[basic]
description = "Windows Resilient File System (ReFS) 重复数据删除服务存在双重释放（Double Free）漏洞，属于权限提升类型。本地攻击者无需任何权限即可触发该漏洞，通过向 ReFS 去重服务发送特制的请求，利用堆内存双重释放条件实现权限提升，从而获取 SYSTEM 级别权限，能够执行任意代码、安装程序、查看/修改/删除数据。该漏洞攻击复杂度较高（需精确控制内存布局），影响 Windows 10/11 及 Windows Server 多个版本。Microsoft 已在 2025 年 2 月安全更新（KB5051987）中修复此漏洞。"
published = "2025-02-11T18:15:29Z"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新：Windows 11 24H2 安装 KB5051987（OS Build 26100.3194），Windows 11 23H2/22H2 安装 KB5051989（OS Builds 22621.4890/22631.4890），或通过 Windows Update 自动更新。如无法立即打补丁，可在组策略中禁用 ReFS 重复数据删除服务（DedupSvc）作为临时缓解措施。"
score = 7.4
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows ReFS 重复数据删除服务特权提升漏洞"
updated = "2026-06-17T08:42:43Z"

