description = "tags, in Chinese, ≥50 characters, covering principle, impact, attack conditions, exploitation.<value>Microsoft Windows NT 4.0 的 PPTP 服务器存在内存泄漏（Memory Leak）漏洞。根本原因在于 PPTP 服务对畸形数据包的处理存在缺陷，当服务端接收并解析此类畸形数据包时，未能正确释放已分配的内存缓冲区，导致内存持续泄漏直至耗尽。该漏洞影响 Windows NT 4.0 中随远程访问服务（RAS）一起安装的 PPTP 服务器组件，攻击面面向网络层。由于 CVSS 向量为 AV:N/AC:L（远程、低复杂度），未经身份认证的远程攻击者无需任何凭据即可构造并发送特制的畸形 PPTP 数据包来触发该漏洞。攻击者可反复发送恶意载荷，使目标服务器的内存资源被不断消耗，最终导致系统资源耗尽、拒绝服务（DoS），进而影响正常的 VPN 远程访问与服务器可用性。修复方式为应用 Microsoft 针对此问题的安全补丁，并避免在有 PPTP 服务的主机上暴露不可信网络的访问。"
published = "2001-03-12T05:00:00Z"
remediation = "建议立即安装微软针对该漏洞发布的安全公告 MS01-009 所对应的 PPTP 服务更新补丁，升级至已修复的 Windows NT 4.0 Service Pack 版本。若无法打补丁，可在防火墙或路由器上限制对 TCP 1723 端口（PPTP）的远程访问，仅允许可信 IP 建立 VPN 连接，并部署流量速率限制以缓解畸形数据包的持续冲击。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows NT 4.0 PPTP 服务器内存泄漏拒绝服务漏洞"
updated = "2026-06-16T21:53:29Z"

