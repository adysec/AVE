[basic]
description = "util-linux 软件包 2.11n 版本之前的 script 命令存在符号链接跟随漏洞（CWE-59）。本地攻击者可通过将 typescript 会话日志文件硬链接指向系统任意关键文件，诱导 root 用户执行 script 命令记录终端会话，导致脚本以 root 权限覆盖目标文件内容，实现任意文件覆盖写入。该漏洞影响 util-linux 2.11n 之前所有版本，CVSS 3.1 评分 5.5 (MEDIUM)，攻击向量为本地 (AV:L)，攻击复杂度低 (AC:L)，需要低权限 (PR:L)，无需用户交互 (UI:N)，主要影响完整性 (I:H)，机密性和可用性无影响。攻击者需具备本地账户权限并能诱导管理员执行 script 命令，利用方式为创建恶意硬链接指向敏感系统文件（如 /etc/passwd、/etc/shadow 或关键配置文件），待 root 执行 script 记录会话时覆盖目标文件导致权限提升或系统破坏。Red Hat 等发行版已在 util-linux 2.11n 及后续版本中修复该漏洞。"
published = "2001-12-31T05:00:00Z"
remediation = "建议立即升级 util-linux 至 2.11n 或更高版本（如 util-linux 2.11n、2.12 及以上版本），通过包管理器执行升级：Debian/Ubuntu 执行 `apt-get update && apt-get install util-linux`，RHEL/CentOS 执行 `yum update util-linux`。若暂无法升级，可通过限制普通用户执行 script 命令权限（`chmod 750 /usr/bin/script`）或配置 auditd 审计 script 调用作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["redhat"]
title = "util-linux script 命令本地任意文件覆盖漏洞"
updated = "2026-06-16T21:56:22Z"

