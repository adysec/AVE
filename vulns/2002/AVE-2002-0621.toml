[basic]
description = "BRU Workstation 17.0 的 xbru 组件在处理临时文件 xbru_dscheck.dd 时存在不安全创建漏洞，本地用户可通过符号链接（symlink）攻击手段，将该临时文件指向任意目标文件路径，从而覆盖目标文件内容并获取 root 权限。该漏洞影响 BRU Workstation 17.0 及可能更早版本，攻击条件为攻击者需具备本地用户账户访问权限，无需网络远程利用。CVSS 评分为 6.2，危害等级中等。利用方式为先创建一个指向敏感文件（如 /etc/passwd 或 root 可写文件）的符号链接，等待 xbru 进程写入临时文件时覆盖目标文件内容，最终实现权限提升。"
published = "2003-04-02T05:00:00.000"
remediation = "升级至 The Tolis Group 发布的 BRU Workstation 17.1 或更高版本，该版本已修复 xbru 在执行前未检查临时文件存在的问题。若无法立即升级，可临时缓解：将 xbru 程序移除 setuid 权限（chmod u-s /usr/bin/xbru），或通过防火墙规则限制本地用户对 /tmp/xbru_dscheck.dd 临时文件的写入访问，防止符号链接攻击导致任意文件被 root 权限覆盖。"
score = 6.2
severity = "MEDIUM"
sources = ["exploitdb"]
title = "BRU BRU Workstation 不安全的临时文件漏洞"
updated = "2026-06-16T21:59:28.027"

