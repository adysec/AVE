[basic]
description = "Zope 2.2.0 至 2.2.4 版本中存在安全绕过漏洞，由于对 DTML 方法对象等旧式对象构造器的安全注册处理不当，导致权限验证机制失效。远程攻击者无需身份认证即可通过网络访问利用该漏洞，绕过安全限制执行未授权操作，造成机密性、完整性和可用性部分受损。该漏洞 CVSS 评分 7.5，危害等级高，建议升级至修复版本。"
published = "2000-12-16T05:00:00Z"
remediation = "立即升级 Zope 至 2.2.5 或更高版本，该版本已修复 DTML 方法对象等旧式构造函数的安全注册问题。如无法升级，请安装 Zope 官方于 2000-12-08 发布的安全补丁（Hotfix_2000-12-08），该补丁可手动修补安全注册逻辑。Red Hat Linux 用户可通过 RHSA-2000-125 更新对应 RPM 包，Mandrake Linux 用户可通过 MDKSA-2000-083 更新。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Zope Zope 安全绕过漏洞"
updated = "2026-06-16T21:53:23Z"

