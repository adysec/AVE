[basic]
description = "ad.cgi 是由 Leif Wright 开发的 CGI 程序，其 file 参数未对用户输入进行有效过滤，远程攻击者可通过在 file 参数中注入 shell 元字符（如分号、管道符等）执行任意系统命令。该漏洞影响 ad.cgi 1.0 版本，攻击者无需身份认证即可远程利用，CVSS 评分 10.0，危害等级严重。目前官方已停止维护，建议用户立即停用该程序。"
published = "2001-02-12T05:00:00Z"
remediation = "立即删除或禁用服务器上不再维护的 ad.cgi 脚本，该软件已停止更新且无安全补丁。如业务必须使用，在 Web 服务器层面对 file 参数做严格输入过滤，禁止 shell 元字符（; | & ` $ 等）传入，并限制 CGI 执行权限为最低系统用户。建议迁移至现代受支持的广告管理方案。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Leif Wright ad.cgi 远程命令执行漏洞"
updated = "2026-06-16T21:53:30Z"

