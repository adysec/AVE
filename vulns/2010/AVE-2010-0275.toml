[basic]
description = "RealNetworks RealPlayer 11.0至11.1、RealPlayer SP 1.0至1.1.5、RealPlayer Enterprise 2.1.2及2.1.3、Linux RealPlayer 11.0.2.1744以及HelixPlayer 1.0.6等版本中存在基于堆的缓冲区溢出漏洞。该漏洞源于RealMedia文件中ImageMap数据的整数计算错误，导致在处理特制的ImageMap数据时发生堆缓冲区溢出。远程攻击者可通过诱导用户打开包含恶意ImageMap数据的RealMedia文件触发此漏洞，成功利用后可实现任意代码执行，完全控制受影响系统。CVSS评分9.3，危害等级严重。"
published = "2010-12-14T16:00:05Z"
remediation = "立即升级 RealPlayer 至 12.0.1.609 或更高版本；Linux 用户升级 HelixPlayer 至 1.0.6 以上补丁版本（参考 RHSA-2010-0981）。如无法升级，在浏览器中禁用 RealPlayer ActiveX 控件，并避免打开来源不明的 .rm/.ra 媒体文件作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer ImageMap 堆缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T23:24:42Z"

