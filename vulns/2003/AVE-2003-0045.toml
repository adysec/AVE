[basic]
description = "Kerberos 4 协议（krb4）在 Heimdal 及其他实现中存在设计缺陷，攻击者可通过选择明文攻击（chosen-plaintext attack）伪造任意域内主体（principal）的身份，从而绕过身份认证机制。该漏洞影响所有使用 Kerberos 4 协议认证的服务，攻击者无需预先认证即可实施攻击，成功利用后可获取目标系统的未授权访问权限，导致机密性、完整性和可用性受损。Heimdal 及其他受影响软件包需升级至修复版本以消除此风险。"
published = "2003-03-24T05:00:00.000"
remediation = '立即升级 MIT krb5 至 1.3 或更高版本，或应用官方补丁包 (2003-004-krb4_patchkit)。如无需 Kerberos v4 功能，以 "-4 disable" 参数重启 KDC 并停止 krb524d 服务以彻底禁用 v4 协议。如无法升级，在 KDC 上设置 DISALLOW_ALL_TIX 属性禁用所有跨域认证，并将所有 krb4 服务密钥降级为单 DES 密钥以消除三重 DES 拼接攻击风险。'
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Heimdal Kerberos 4 协议选择明文攻击身份冒充漏洞"
updated = "2026-06-16T22:01:37.493"

