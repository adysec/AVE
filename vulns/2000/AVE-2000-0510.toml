[basic]
description = "Netscape Communicator 4.73 及更早版本在处理 JPEG 图片中的注释字段时存在堆内存覆盖漏洞。当 JPEG 图片包含一个非法字段长度为 1 的注释块时，程序未能正确验证该长度值，导致堆内存被越界写入。远程攻击者可以构造特制的 JPEG 图片，通过诱导用户访问恶意网站或打开包含该图片的 HTML 邮件触发漏洞，造成拒绝服务或执行任意代码。该漏洞影响广泛使用的 Netscape 浏览器，CVSS 评分 5.0，危害等级中等。ExploitDB 已公开该漏洞的利用代码。"
published = "2000-07-25T04:00:00.000"
remediation = "升级 Netscape Communicator 至 4.74 或更高版本。Linux 用户可安装对应发行版补丁：Red Hat 用户应用 RHSA-2000-046，FreeBSD 用户安装 FreeBSD-SA-00:39 补丁，SuSE 用户参考 SuSE Security Announce 60。该产品已停止维护，建议迁移至现代浏览器（如 Firefox）以彻底消除风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Netscape Communicator JPEG注释堆溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:12.003"

