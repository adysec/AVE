[basic]
description = "libXfont2 中的 BitmapScaleBitmaps 函数存在堆缓冲区溢出漏洞，由于 32 位 size 值溢出，在处理特制字体位图数据时可触发堆内存越界写入。该漏洞影响 libXfont2 2.0.8 之前版本，攻击者若能够访问 X Server 服务，即可通过发送恶意构造的字体数据利用此漏洞，在目标系统上执行任意代码。此漏洞可导致服务器端远程代码执行，对使用受影响版本的系统造成严重安全风险。"
published = "2026-07-08"
remediation = "将 libXfont2 升级至 2.0.8 或更高版本，该补丁在 ComputeScaledProperties() 函数中增加了属性缓冲区的大小校验以防止堆溢出。对于使用 X.Org 发行版的系统，可通过系统包管理器执行更新：Ubuntu/Debian 运行 apt update && apt install libxfont2，Fedora/RHEL 运行 dnf update libXfont2。如暂时无法升级，建议在 X Server 配置中限制 PCF 字体文件来源，仅加载受信任的字体路径以降低攻击面。"
score = 7.5
severity = "HIGH"
sources = ["zdi"]
title = "X.Org libXfont2 堆缓冲区溢出漏洞"
updated = "2026-07-08"

