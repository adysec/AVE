[basic]
description = "Hubuum Rust 客户端库的诊断机制存在信息泄露漏洞。原生 reqwest::Error 值会保留完整的请求 URL，错误转换和重试耗尽过程中会保留查询参数值，HTTP 及解码错误中可包含服务器返回的消息、响应体及载荷详情。多个公共响应和模型类型的诊断实现会处理未受信任或涉及敏感信息的字段。当应用程序记录错误和响应值时，凭证、令牌、游标、过滤器、导入对象数据、任务详情及交付信息等敏感内容可能被写入日志，导致敏感数据通过日志泄露。"
published = "2026-01-01T00:00:00Z"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Hubuum hubuum_client 默认诊断敏感信息泄露漏洞"
