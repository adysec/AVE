[basic]
description = "WebKit 渲染引擎存在内存破坏漏洞，影响 Apple Safari 6.0 之前版本及依赖 WebKit 的应用程序。远程攻击者可通过构造恶意网页，在用户使用受影响浏览器访问时触发内存越界读写，导致任意代码执行或应用程序崩溃拒绝服务。攻击者无需身份认证，仅需诱导目标用户打开恶意链接即可完成利用，CVSS 评分 9.3，危害等级严重。Apple 已在 Safari 6.0 及后续安全更新中修复此漏洞。"
published = "2012-07-25T20:55:03Z"
remediation = "立即将 Mac 系统上的 Safari 浏览器升级至 6.0 或更高版本，Windows 系统上的 iTunes 升级至 10.7 或更高版本，iOS 设备升级至 iOS 6.0 或更高版本，以修复 WebKit 引擎中的内存破坏漏洞。如无法立即升级，请避免使用旧版 Safari 或 iTunes 访问不受信任的网站，并启用防火墙限制出站连接，直至完成补丁安装。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:37Z"

