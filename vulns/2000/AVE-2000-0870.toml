[basic]
description = "MDaemon 2.8 版本中的 WorldClient 邮件客户端存在会话 ID 泄露漏洞。当用户点击邮件中的 URL 链接时，WorldClient 会将当前会话 ID 附加在 HTTP 请求的 Referer 字段中发送给目标网站。攻击者可通过诱导用户访问恶意网站或已控制的第三方站点，从 Referer 头中截获会话 ID，进而劫持用户的邮件会话，未经授权读取受害者的电子邮件内容。该漏洞利用条件要求用户交互（点击链接），且攻击者需能接收 HTTP 请求的 Referer 信息。"
published = "2000-10-20T04:00:00.000"
remediation = "升级 MDaemon 至 3.0 或更高版本，该版本已修复 WorldClient 在 HTTP Referer 头中泄露会话 ID 的问题。如无法升级，可在反向代理或 Web 服务器层面配置规则过滤出站请求中的 Referer 头，或禁用 WorldClient Webmail 功能作为临时缓解措施。"
score = 2.6
severity = "LOW"
sources = ["epss"]
title = "MDaemon WorldClient 会话ID泄露漏洞"
updated = "2026-06-16T21:52:19.890"

