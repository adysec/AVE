[basic]
description = "Adobe Flash Player 10.2.152.26之前版本中存在内存破坏漏洞，远程攻击者通过向未指定的ActionScript方法传递特制参数，导致该参数被用作对象指针，从而触发内存破坏，成功利用可导致远程代码执行或拒绝服务。攻击者无需身份认证即可通过网络远程触发该漏洞，影响范围广泛。Adobe已在安全更新中修复此漏洞。"
published = "2011-02-10T16:00:32Z"
remediation = "立即升级 Adobe Flash Player 至 10.2.152.26 或更高版本。对于无法升级的环境，可在浏览器中禁用 Flash 插件或卸载 Flash Player。由于 Adobe 已于 2020 年 12 月 31 日停止对 Flash Player 的支持，建议彻底移除 Flash 组件并迁移至 HTML5 方案。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player ActionScript方法内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:27:37Z"

