[basic]
description = "Embedthis GoAhead Web服务器 3.6.5 之前版本的 cgiHandler 函数在处理 CGI 请求时，将不受信任的 HTTP 请求参数直接用于初始化 CGI 脚本的环境变量。攻击者可在启用 CGI 功能且 CGI 程序为动态链接的场景下，通过构造包含 LD_PRELOAD 等特殊参数名的 HTTP 请求，结合 glibc 动态链接器的特性，将恶意共享对象文件放入 POST 请求体并通过 /proc/self/fd/0 引用，从而实现远程命令执行。该漏洞影响 GoAhead 2.5 至 3.6.5 版本，CVSS 评分 8.1，危害等级高，攻击复杂度较高但无需认证即可远程利用。"
published = "2017-12-12T19:29:00.207"
remediation = '立即升级 Embedthis GoAhead 至 3.6.5 或更高版本，该版本在 cgiHandler 函数中过滤了 LD_PRELOAD 等危险环境变量。如无法升级，在 CGI 程序入口处调用 unsetenv("LD_PRELOAD") 清除该变量，或在 Web 服务器反向代理层面拦截包含 LD_PRELOAD 参数的请求作为临时缓解措施。'
score = 8.1
severity = "HIGH"
sources = ["kev"]
title = "Embedthis GoAhead CGI 远程命令执行漏洞"
updated = "2026-06-17T01:11:15.933"

