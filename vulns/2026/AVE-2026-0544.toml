[basic]
description = "Apple WebKit 存在内存处理漏洞（CWE-119/CWE-120），由于 WebKit 在处理恶意构造的网页内容时存在边界检查不足，导致内存越界读写。远程攻击者可诱导用户访问特制的恶意网页，在无需身份认证的情况下触发该漏洞，成功利用后可导致目标进程崩溃或实现任意代码执行，造成机密性、完整性和可用性全面受损。该漏洞影响 Safari 26.5 以下版本、iOS 18.7.9/iPadOS 18.7.9 以下版本、macOS Tahoe 26.5 以下版本、tvOS 26.5、visionOS 26.5、watchOS 26.5 及 Linux 平台 webkit2gtk 未更新版本，CVSS 评分 8.8，危害等级高危。"
published = "2026-05-11T21:18:51Z"
remediation = "立即将 Apple 设备升级至以下修复版本：Safari 26.5、iOS 18.7.9 及 iPadOS 18.7.9、macOS Tahoe 26.5、tvOS 26.5、visionOS 26.5、watchOS 26.5。SUSE Linux SLES12 用户需将 webkit2gtk3 更新至 2.52.4 或更高版本。无法立即升级时，建议禁用 WebKit 解析不可信网页内容作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "Apple WebKit 内存处理远程代码执行漏洞"
updated = "2026-07-15T02:19:16Z"

