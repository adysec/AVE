[basic]
description = "Cisco IOS 和 IOS XE 软件的自主网络功能存在访问控制漏洞，未经身份认证的相邻攻击者可通过发送特制的自主网络协议数据包，触发受影响设备的自主节点重载，导致拒绝服务（DoS）攻击。该漏洞影响 Cisco IOS Software 和 Cisco IOS XE Software 的 Denali-16.2.1 和 Denali-16.3.1 版本，CVSS 评分 6.5（中危），攻击向量为相邻网络，攻击复杂度低，无需权限和用户交互，主要影响系统可用性。"
published = "2017-08-07T06:29:00Z"
remediation = "由于 Cisco 未发布修复该漏洞的软件更新且无官方临时缓解措施，建议采取以下措施：1) 若业务不需要 Autonomic Networking 功能，在全局配置模式下执行 `no autonomic` 命令禁用该功能并保存配置重启设备；2) 在二层网络部署 802.1X 和端口安全机制，限制未授权设备接入同一广播域；3) 通过接入控制列表 (ACL) 限制相邻网络设备对 ACP 通道的访问，仅允许受信任管理设备通信；4) 持续关注 Cisco PSIRT 公告以获取未来可能的补丁发布。"
score = 6.5
severity = "MEDIUM"
sources = ["kev"]
title = "Cisco IOS/IOS XE Autonomic Networking 访问控制漏洞"
updated = "2026-06-17T01:22:45Z"

