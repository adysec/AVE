[basic]
description = "Sonatype Nexus Repository Manager 3.21.2 之前的版本存在 JavaEL 注入漏洞。未经充分身份验证的远程攻击者可通过向目标系统发送特制的恶意请求，在应用程序上下文中注入 Java 表达式语言（EL）代码，从而在目标服务器上执行任意操作系统命令。该漏洞影响使用受影响版本部署的仓库管理系统，攻击者成功利用后可完全控制系统，导致机密泄露、数据篡改及服务中断。由于存在公开可用的 Metasploit 利用模块，该漏洞被 CISA 列入已知被利用漏洞目录。建议立即升级至 3.21.2 或更高版本以修复此问题。"
published = "2020-04-01T19:15:14Z"
remediation = "建议将 Nexus Repository Manager 升级至 3.21.2 或更高版本，该版本已修复 JavaEL 注入漏洞。升级前请备份仓库数据及配置文件，升级后验证实例正常运行。如暂无法升级，建议在反向代理或防火墙层限制对 Nexus Repository 管理界面的访问，仅允许可信 IP 访问，以降低被远程利用的风险。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "Sonatype Nexus Repository Manager Java EL 注入远程代码执行漏洞"
updated = "2026-06-17T02:47:28Z"

