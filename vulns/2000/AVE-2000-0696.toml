[basic]
description = "Novell BorderManager 3.0 及 3.5 版本存在 URL 过滤绕过漏洞。远程攻击者可通过在请求 URL 中对特殊字符进行编码（如 URL 编码），绕过 BorderManager 的 URL 过滤规则，访问本应被拦截的受限资源。该漏洞无需身份认证即可远程利用，攻击复杂度低，仅影响系统完整性，不涉及机密性和可用性。受影响的系统包括运行 Novell BorderManager 3.0 和 3.5 的服务器。"
published = "2000-07-05T04:00:00Z"
remediation = "Novell BorderManager 3.0/3.5 已停止技术支持，无官方补丁。建议立即升级至受支持的替代产品（如 Novell Access Manager 或第三方安全网关）。若无法升级，可在代理服务器或防火墙上配置 URL 规范化规则，对 % 编码、双编码及 Unicode 编码的 URL 进行解码后重新检测，同时启用深度包检测（DPI）过滤绕过尝试。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Novell BorderManager URL过滤绕过漏洞"
updated = "2026-06-16T21:52:03Z"

