[basic]
description = "CVE-2019-3398是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2019-04-18T18:29:00.970"
remediation = "1. 版本修复：立即升级 Confluence Server 至安全版本。若当前为 6.6.x 分支，升级至 6.6.13 或更高版本；若为 6.12.x 分支，升级至 6.12.4 或更高版本；若为 6.13.x 分支，升级至 6.13.4 或更高版本；若为 6.14.x 分支，升级至 6.14.3 或更高版本；若为 6.15.x 分支，升级至 6.15.2 或更高版本。升级前务必备份 Confluence 主目录与数据库。2. 临时缓解：在升级完成前，可通过反向代理（如 Nginx/Apache）限制对 /downloadallattachments 资源的访问，或限制仅有受信任 IP 可访问 Confluence 实例，以降低被利用风险。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "Atlassian Confluence 目录遍历漏洞"
updated = "2026-06-17T02:35:05.863"

