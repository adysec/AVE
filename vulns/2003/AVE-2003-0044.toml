[basic]
description = "LPRng 打印系统中的 psbanner 工具存在不安全临时文件处理漏洞。本地攻击者可通过在 /tmp/before 临时文件上创建符号链接，利用 psbanner 以提升的权限写入任意文件，导致本地权限提升或敏感文件被覆盖。攻击条件为拥有本地系统访问权限，无需身份认证即可利用。该漏洞影响 LPRng 各版本，CVSS 评分 2.1，危害等级低。"
published = "2003-05-05T04:00:00Z"
remediation = "升级 LPRng 至 3.8.28 或更高版本。Debian 用户安装 DSA-285 对应更新包（apt-get update && apt-get upgrade lprng）；Red Hat 用户安装 RHSA-2003:142 对应更新。临时缓解措施：删除 psbanner 的 setuid 位（chmod u-s /usr/bin/psbanner），或限制本地用户对 /tmp/before 文件的写权限。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "LPRng psbanner 任意文件写入漏洞"
updated = "2026-06-16T22:01:37Z"

