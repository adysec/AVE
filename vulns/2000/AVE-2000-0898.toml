[basic]
description = "HP-UX 11.00 系统中的 newgrp 命令存在权限提升漏洞。该漏洞的原理在于 newgrp 命令在处理组切换逻辑时未能正确验证用户权限，导致本地攻击者可以通过执行该命令触发权限管理缺陷，从而在目标系统上获取特权账户权限。此漏洞影响范围仅限拥有本地账户访问权限的用户，攻击条件为本地登录，通过特定参数调用 newgrp 即可实现权限提升，对系统安全性构成威胁。"
published = "2000-10-20T04:00:00Z"
remediation = "建议将 HP-UX 11.00 系统升级至最新的补丁版本，或安装由 HP 发布的针对 newgrp 命令的安全修复补丁。对于无法立即升级的系统，可以通过修改文件权限或使用 sudo 策略限制普通用户调用 newgrp 命令，以消除本地权限提升风险。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "HP HP-UX newgrp 命令本地权限提升漏洞"
updated = "2026-06-16T21:52:24Z"

