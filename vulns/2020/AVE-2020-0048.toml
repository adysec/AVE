[basic]
description = "Paessler PRTG Network Monitor 在 20.1.57.1745 之前的版本中存在信息泄漏漏洞。未经身份认证的远程攻击者可通过向目标系统发送包含 type=probes 参数的 HTTP 请求（例如访问 login.htm 或 index.htm），获取运行中的探针信息及服务器内部状态，包括 CPU 使用率、内存占用、Windows 版本和内部统计数据等敏感信息。该漏洞影响所有暴露 PRTG Web 界面的实例，攻击者无需任何凭据即可完成探测，可能导致攻击面扩大和后续针对性攻击。"
published = "2020-04-05T00:15:11Z"
remediation = "立即将 PRTG Network Monitor 升级到 20.1.57.1745 或更高版本，该版本已修复未授权访问漏洞，在 Web 界面入口处增加了身份验证校验。如暂无法升级，应在防火墙或反向代理层面限制对 PRTG 服务器外部访问，仅允许可信管理网段的 IP 访问 login.htm 和 index.htm，阻断未授权的 type=probes 探测请求，以此作为临时缓解措施。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "Paessler PRTG Network Monitor 信息泄漏漏洞"
updated = "2026-06-17T02:50:22Z"

