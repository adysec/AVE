[basic]
description = "Recourse ManTrap 1.6.1 在构建 chroot 环境时试图隐藏其运行状态，但该环境中根目录的 inode 编号高于正常值，攻击者可通过计算该 inode 值来识别出当前是否处于 chroot 环境中。该漏洞主要影响使用 ManTrap 1.6.1 的系统，攻击者无需身份验证即可对目标主机进行局部信息搜集，泄露 chroot 环境的存在，从而为进一步攻击提供情报支持。尽管该漏洞不会直接导致权限提升或服务中断，但它为攻击者提供了重要的系统架构信息，可能被用于规避安全措施或定位更多高级漏洞。CVSS 评分 2.1，危害等级低，涉及的CWE类型为其他（NVD-CWE-Other），发布时间为 2001 年 1 月 9 日，该漏洞至今仍存在，部分软件产品仍在使用 ManTrap 1.6.1 版本，需及时进行版本升级或配置加固以避免相关安全风险。"
published = "2001-01-09T05:00:00.000"
remediation = "建议升级至 Recourse ManTrap 2.0 或更高版本，该版本修复了 chroot 环境 Inode 泄露问题。若无法升级，建议停止使用 ManTrap 1.6.1 并迁移至现代蜜罐解决方案（如 Cowrie、Dionaea 或现代欺骗防御平台），并在网络层面限制对蜜罐系统的非必要访问权限。若必须继续使用，建议在网络层面限制对蜜罐系统的本地访问权限，并监控异常 Inode 查询行为作为缓解措施。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Recourse ManTrap 1.6.1 根目录 Inode 泄露漏洞"
updated = "2026-06-16T21:53:14.993"

