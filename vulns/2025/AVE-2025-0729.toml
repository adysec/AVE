[basic]
description = "Microsoft 消息队列（MSMQ）服务存在资源消耗漏洞，该漏洞源于对特制消息请求的处理不当，导致系统资源被过度消耗。未经身份认证的远程攻击者可通过网络向目标系统的 MSMQ 服务发送精心构造的数据包，触发资源耗尽条件，导致 MSMQ 服务停止响应，造成拒绝服务。该漏洞影响多个 Windows 版本，CVSS 评分 7.5，危害等级高危。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:46Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新 (KB5050061)，通过 Windows Update 或 WSUS 自动获取。各版本对应修复版本号：Windows 10/11 需升级至 10.0.10240.20890/19044.5371/22621.4751/26100.2894 等；Windows Server 需升级至 10.0.17763.6775/20348.3091/26100.2894 等。如无法立即打补丁，可在防火墙中阻止入站 MSMQ 流量（TCP 端口 1801）作为临时缓解措施，或禁用 Message Queuing 服务。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft 消息队列 (MSMQ) 拒绝服务漏洞"
updated = "2026-06-17T08:42:57Z"

