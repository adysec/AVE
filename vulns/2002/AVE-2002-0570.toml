[basic]
description = "tags.<value>BizDesign ImageFolio 2.x 及 3.0.1 及更早版本存在跨站脚本（XSS）漏洞。远程攻击者无需身份认证，即可通过向 imageFolio.cgi 的 direct 参数或 nph-build.cgi 脚本中注入恶意脚本代码，当其他用户访问包含恶意脚本的页面时，脚本会在其浏览器中以当前用户身份执行。攻击者可借此窃取会话令牌、执行未授权操作或重定向用户至恶意网站。该漏洞影响所有使用受影响版本部署的 Web 站点。"
published = "2002-12-11T05:00:00Z"
remediation = """立即升级至 ImageFolio 3.1 或更高版本（若厂商确已发布修复补丁），并确保 `nph-build.cgi` 和 `imageFolio.cgi` 中的 `direct` 及 `step` 参数对用户输入进行严格过滤，移除或转义 HTML 特殊字符（`<`、`>`、`"`、`'`、`&`）。如厂商已停止维护且无法获取补丁，建议迁移至持续更新的图库系统，并在 Web 服务器或前端 WAF 层面配置规则拦截含 `<script>`、`javascript:`、`onload=`、`onerror=` 等特征的 XSS 载荷作为临时缓解措施。"""
score = 6.8
severity = "MEDIUM"
sources = ["exploitdb"]
title = "BizDesign ImageFolio 跨站脚本攻击漏洞"
updated = "2026-06-16T21:59:07Z"

