[basic]
description = "高通 Eudora 5 邮件客户端的 MIME 多部分边界解析模块存在缓冲区溢出漏洞。远程攻击者可构造包含超长边界字符串的多部分 MIME 邮件，诱导受害者接收并解析该邮件，触发栈缓冲区溢出，从而在用户上下文中执行任意代码。该漏洞影响 Eudora 5.1.1 及 5.0-J 版本（Windows 平台），CVSS 评分 7.5（高危），攻击向量为网络、低复杂度、无需认证，可导致机密性、完整性、可用性均受损。"
published = "2002-08-12T04:00:00Z"
remediation = "建议立即升级至 Eudora 6.0 或更高版本（已修复该边界字符串缓冲区溢出），或迁移至现代邮件客户端如 Thunderbird/Outlook。若必须继续使用旧版本，可在邮件网关层面配置 MIME 边界长度限制（如限制 boundary 参数不超过 256 字符），并禁用自动预览/自动解析多部分 MIME 消息功能以阻断攻击向量。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Qualcomm Eudora 5 MIME MultiPart Boundary 缓冲区溢出漏洞"
updated = "2026-06-16T21:58:13Z"

