[basic]
description = 'Penelope 在处理 Unix 远程会话下载时，由于未对接收到的 tar 归档成员路径进行有效校验，导致存在路径遍历漏洞。攻击者可通过构造包含 "../" 等路径遍历字符的恶意 tar 归档文件，在操作员执行 download 命令下载时，将文件写入到预期下载目录之外的任意位置。该漏洞影响 0.19.3 之前的版本，攻击者可利用此漏洞覆盖操作员机器上的关键配置文件（如 ~/.penelope/peneloperc），进而实现远程代码执行。该漏洞主要影响使用 Unix 下载路径的操作员，CVSS 评分 5.9。'
published = "2026-07-29T16:17:52Z"
remediation = "建议立即将 Penelope 升级至 v0.20.0 或更高版本。该版本通过在解压前对存档成员路径进行显式验证并拒绝不安全路径，从根源上解决了路径穿越漏洞。"
score = 5.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "Penelope Shell Handler 路径穿越导致任意文件写入漏洞"
updated = "2026-07-29T18:16:53Z"

