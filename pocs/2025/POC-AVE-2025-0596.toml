[info]
author = "ave"
description = "验证 libsoup 库在处理 HTTP 请求时，当请求包含多个重复的 Host: 头字段时，库会取最后一个 Host 值进行服务端处理，而前端代理通常使用第一个 Host 值进行路由转发。通过构造携带两个 Host 头的 HTTP 请求，可观察到代理与后端主机解析不一致的行为，从而验证 HTTP 请求走私漏洞。"
id = "POC-AVE-2025-0596"
name = "CVE-2025-14523 PoC"
severity = "high"
tags = ["ave-2025-0596"]
vuln_id = [
    "CVE-2025-14523",
    "AVE-2025-0596",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
