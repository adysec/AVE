[basic]
description = "Linux 内核 BPF（Berkeley Packet Filter）子系统中存在安全漏洞。BPF 验证器在处理全局子程序中的辅助函数调用时，未能正确遍历全局子程序以跟踪数据包指针的失效状态。当全局子程序调用 bpf_skb_pull_data 等会改变数据包数据的辅助函数后，调用者状态中的数据包指针未被正确标记为无效，导致后续仍可使用已失效的指针访问数据包内存。本地攻击者可通过加载特制的 BPF 程序利用此漏洞，造成内核内存越界访问，导致系统崩溃或拒绝服务。该漏洞影响 Linux 内核多个版本，CVSS 评分 5.5，危害等级中等。"
published = "2025-05-05T15:15:53Z"
remediation = "立即升级 Linux 内核至 6.6.90、6.12.25 或 6.13 及以上版本，对应补丁提交为 79751e9227a5、1d572c60488b、51081a3f25c7。如无法立即升级，可通过 SELinux 或 AppArmor 限制 BPF 程序的加载权限，仅允许受信进程加载 BPF 程序作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Kernel BPF 全局函数数据包指针验证绕过漏洞"
updated = "2026-06-17T08:14:37Z"

