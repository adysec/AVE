[basic]
description = "FreeBSD 5.0 及更早版本中的 catopen 函数存在环境变量注入漏洞，本地攻击者可通过精心设置 LANG 环境变量，诱使系统加载任意路径的恶意消息目录文件，从而读取系统上的任意文件。该漏洞源于 catopen 函数未对用户提供的 LANG 环境变量进行充分过滤和路径限制，导致攻击者可以利用目录遍历技术访问受保护的系统文件。由于攻击者需要本地系统访问权限，且无需身份认证即可利用，CVSS 评分 7.2，危害等级高。成功利用该漏洞可导致敏感信息泄露，包括密码文件、配置文件等，进而可能提升权限或扩大攻击面。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级 FreeBSD 系统至 5.0 之后的安全修复版本，或应用 FreeBSD-SA-00:53 安全公告提供的 catopen 补丁。如无法升级，可通过限制本地用户设置 LANG 环境变量的权限作为临时缓解措施，或使用强制访问控制机制（如 jail 或 sandbox）限制本地用户对任意文件的读取能力。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "FreeBSD catopen 函数本地任意文件读取漏洞"
updated = "2026-06-16T21:52:58Z"

