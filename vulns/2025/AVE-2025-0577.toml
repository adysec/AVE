[basic]
description = "Google Chrome 浏览器在 V8 JavaScript 引擎中存在一个竞态条件漏洞（CWE-362）。由于 V8 引擎在处理并发请求时缺乏适当的同步机制，远程攻击者可以通过诱导用户访问一个精心构造的 HTML 页面，在特定执行时序下触发竞态条件，从而导致堆内存损坏（Heap Corruption）。该漏洞的影响范围包括 143.0.7499.41 版本之前的 Google Chrome 浏览器，成功利用后可能导致远程代码执行（RCE）或使攻击者获得目标系统的更高权限。攻击条件为用户需通过浏览器加载恶意网页，且需满足特定的并发执行时序。"
published = "2025-12-02T19:15:48Z"
remediation = "建议将 Google Chrome 浏览器升级至 143.0.7499.41 或更高版本。对于 Fedora 用户，请更新至 chromium-143.0.7499.146 及 cef-143.0.10+g8aed01b 版本以修复 v8 引擎中的竞态条件漏洞。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 引擎竞态条件导致堆损坏漏洞"
updated = "2026-06-17T08:34:38Z"

