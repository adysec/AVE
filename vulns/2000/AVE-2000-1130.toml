[basic]
description = "Netsnap webcam HTTP server 1.2.9 之前版本存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过网络向目标服务器发送超长 GET 请求，触发缓冲区溢出，从而执行任意命令。该漏洞影响所有使用 Netsnap webcam HTTP server 的系统，攻击者只需构造特制的 HTTP 请求即可完成利用，CVSS 评分 7.5，危害等级高。"
published = "2001-01-09T05:00:00.000"
remediation = "立即升级 Netsnap webcam HTTP 服务器至 1.2.9 或更高版本，该版本已修复处理 GET 请求时的缓冲区长度检查缺陷。如无法升级，可在网络边界防火墙或反向代理层限制对 webcam 服务端口（默认 80）的访问，仅允许受信 IP 连接，以降低远程利用风险。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Netsnap Webcam HTTP Server 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:18.430"

