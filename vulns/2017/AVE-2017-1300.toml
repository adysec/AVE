[basic]
description = "Apache Struts 2.1.x 和 2.3.x 的 Struts 1 插件存在远程代码执行漏洞（S2-048），由于对传递给 ActionMessage 的原始消息中的恶意字段值处理不当，导致 OGNL 表达式注入。未经身份认证的远程攻击者可通过发送包含恶意 OGNL 表达式的特制字段值，在无需用户交互的情况下远程执行任意代码，完全控制目标服务器。该漏洞影响使用 Struts 1 插件的 Apache Struts 2.1.x 和 2.3.x 版本，CVSS 3.1 评分 9.8（严重），攻击向量为网络、攻击复杂度低、无需权限和用户交互，机密性、完整性、可用性影响均为高。攻击者可通过发送精心构造的 HTTP 请求触发 OGNL 表达式注入，执行任意系统命令。Apache Struts 官方已发布安全公告修复该漏洞，建议升级至 2.3.32 或 2.5.10.1 及以上版本。"
published = "2017-07-10T16:29:00Z"
remediation = "立即升级 Apache Struts 到 2.3.34 或更高版本（或 2.5.x 系列），移除已废弃的 Struts 1 插件；如无法立即更新，可临时禁用非必要的 Struts 处理类并配置白名单 URL 模式以阻止恶意字段；同时监控关键服务日志以发现异常行为。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Apache Struts 2 Struts 1 插件 远程代码执行漏洞"
updated = "2026-06-17T01:28:55Z"

