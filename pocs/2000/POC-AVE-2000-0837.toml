[info]
author = "AVE"
description = "检测目标服务器上是否存在 PHF CGI 程序，该程序存在缓冲区溢出漏洞（CVE-2000-1186），远程攻击者可执行任意命令"
id = "POC-AVE-2000-0837"
name = "PoC for AVE-2000-0837"
severity = "high"
tags = ["cve-2000-1186"]
vuln_id = [
    "CVE-2000-1186",
    "AVE-2000-0837",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi-bin/phf"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "PHF",
    "CGI",
]
