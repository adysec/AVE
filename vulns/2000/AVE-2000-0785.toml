[basic]
description = "Microsoft IIS Phone Book 服务（phbk.dll）存在缓冲区溢出漏洞。远程攻击者无需身份认证即可通过向目标系统的 Phone Book 服务发送特制的 HTTP 请求，触发缓冲区溢出，从而在目标系统上执行任意命令。该漏洞影响 Microsoft IIS 4.0 和 IIS 5.0 等版本，CVSS 评分 10，危害等级极高。Microsoft 已在 MS00-094 安全公告中发布修复补丁。"
published = "2001-01-09T05:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-094 发布的补丁。Windows NT 4.0 用户从 https://www.microsoft.com/download/details.aspx?FamilyId=37B1473A-33E6-446A-BD16-39B85548CCC6 下载并安装；Windows 2000 用户从 https://www.microsoft.com/download/details.aspx?FamilyId=C2EFB014-BC57-4CAF-AD28-4E3E735E1934 下载并安装。也可通过 Windows Update 自动更新获取该补丁。安装后重启 IIS 服务即可生效。若未安装 Phone Book 服务则不受影响，可考虑卸载该可选组件以彻底消除风险。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Microsoft IIS Phone Book 服务缓冲区溢出漏洞"
updated = "2026-06-16T21:53:07.557"

