[info]
author = "ave"
description = "检测Adobe Flash Player在处理特制MP4文件时的内存破坏漏洞。通过HTTP服务端发送恶意MP4文件，触发Flash Player在处理SequenceParameterSetNALUnit时的栈缓冲区溢出。"
id = "POC-AVE-2011-0083"
name = "Adobe Flash Player MP4 SequenceParameterSetNALUnit 内存破坏漏洞 PoC"
severity = "critical"
tags = [
    "cve-2011-2140",
    "adobe-flash",
    "memory-corruption",
]
vuln_id = [
    "CVE-2011-2140",
    "AVE-2011-0083",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/exploit.mp4"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["ftyp"]
