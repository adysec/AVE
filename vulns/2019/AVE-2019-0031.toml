[basic]
description = "Timesheet Next Gen 1.5.3 及更早版本的登录页面 login.php 第 40 行和第 54 行存在反射型跨站脚本（XSS）漏洞。攻击者可通过构造包含恶意 JavaScript 代码的 redirect 参数，诱使受害者点击特制 URL 后，在受害者浏览器中执行任意 HTML 和 JavaScript 代码，导致会话劫持、钓鱼攻击或敏感信息窃取。攻击无需认证，但需用户交互，CVSS 评分 6.1，危害等级中危。"
published = "2019-07-17T21:15:11Z"
remediation = '升级 Timesheet Next Gen 至 r506 或更高版本，该版本已完全移除 login.php 中的 redirect 参数，消除了反射型 XSS 注入点。如无法升级，手动编辑 login.php，删除第 40 行 `$redirect = isset($_REQUEST["redirect"]) ? $_REQUEST["redirect"] : "";` 及第 54 行 `<input type="hidden" name="redirect" value="<?php echo $redirect; ?>" />`，并将第 48 行 `header("Location: $_REQUEST[redirect]");` 替换为 `gotoStartPage();`。'
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Timesheet Next Gen 跨站脚本漏洞"
updated = "2026-06-17T02:09:56Z"

