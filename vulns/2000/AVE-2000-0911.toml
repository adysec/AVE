[basic]
description = "Intel Express 500 系列交换机在 IP 数据包处理逻辑中存在缺陷，远程攻击者无需任何身份认证即可向目标设备发送特制畸形 IP 数据包触发该漏洞，导致交换机拒绝服务、网络服务中断。该漏洞影响运行 2.63 和 2.64 版本的 Intel Express 500 系列交换机，攻击者可利用该缺陷使目标设备停止转发数据包，进而导致整个网络的可用性受到严重影响。攻击条件极为宽松，攻击者仅需通过网络向目标交换机发送畸形 IP 数据包即可完成攻击，无需任何凭证或特殊权限，危害等级为中等，CVSS v2 评分 5.0。"
published = "2000-10-20T04:00:00Z"
remediation = "联系 Intel 获取 Express 500 系列交换机固件修复版本并升级到已修复此问题的更新版本（高于 2.64），修复该漏洞后畸形 IP 报文将不再导致交换机瘫痪。如暂时无法获得固件更新，建议在网络边界部署入侵检测系统（IDS）或防火墙规则，过滤含有畸形 IP 选项或异常长度的入站数据包，以阻止攻击者向交换机发送恶意构造报文。同时定期查阅 Intel 安全公告获取补丁发布信息。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Intel Express 500 系列交换机畸形IP数据包拒绝服务漏洞"
updated = "2026-06-16T21:52:25Z"

