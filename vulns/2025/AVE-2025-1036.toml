[basic]
description = "Linux内核跟踪子系统（ftrace）存在释放后使用漏洞。当攻击者通过sysfs接口向跟踪事件写入特制的hist触发器命令并触发注册失败时，已添加到named_triggers链表中的数据项未被正确移除即被释放，导致内核出现释放后使用。具有低权限的本地攻击者可利用此漏洞造成内核崩溃或提权执行任意代码。该漏洞影响配置了CONFIG_FTRACE的Linux内核版本，CVSS评分7.8，危害等级高。"
published = "2025-04-01T16:15:20Z"
remediation = "建议立即升级 Linux 内核至 6.12.10、6.11.21、6.6.74、6.1.129 或更高版本（包含修复提交 8c7b3f7e1a2d）。通过发行版官方渠道安装更新：Debian/Ubuntu 执行 apt update && apt install linux-image-generic，RHEL/Fedora 执行 dnf update kernel，SUSE 执行 zypper patch。若无法立即升级，可临时禁用内核 tracing 功能：echo 0 > /proc/sys/kernel/ftrace_enabled，或卸载不必要的 tracefs 挂载点（umount /sys/kernel/tracing）以降低攻击面。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux kernel 跟踪子系统 use-after-free 漏洞"
updated = "2026-07-30T06:21:56Z"

