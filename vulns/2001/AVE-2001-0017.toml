[basic]
description = "KTH Kerberos IV 实现中存在任意代理使用漏洞，本地用户可通过设置 krb4_proxy 环境变量指定恶意代理服务器，从而伪造代理响应并劫持 Kerberos 认证流量。攻击者利用此漏洞可获取系统最高权限，影响所有使用 KTH Kerberos IV 的系统。攻击条件为拥有本地访问权限，无需身份认证即可触发，CVSS 评分 7.2，危害等级高。"
published = "2001-02-16T05:00:00Z"
remediation = "立即停止使用已停止维护的 KTH Kerberos IV 软件，迁移至 MIT Kerberos 或 Heimdal 等仍在积极维护的 Kerberos 实现。如无法立即迁移，可通过系统安全策略限制本地用户设置 krb4_proxy 环境变量的能力，并严格审计所有本地用户对 Kerberos 代理配置的修改行为。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "KTH Kerberos 4 任意代理使用漏洞"
updated = "2026-06-16T21:53:31Z"

