[basic]
description = "MySQL 数据库在 Windows 平台上的二进制发行版本（3.23.2 至 3.23.52 及 3.20.32、3.22.x、3.23.x 等版本）存在弱默认配置漏洞，root 账户密码在安装后默认为空（NULL）。未经身份认证的远程攻击者无需任何凭据即可直接连接目标服务器的 MySQL 服务，以 root 权限登录数据库系统，进而获取对数据库的完全控制权，可执行任意 SQL 语句、读取敏感数据、篡改或删除数据。该漏洞影响所有使用受影响版本且未手动修改默认 root 密码的 MySQL 安装实例，攻击者仅需通过网络访问 MySQL 默认 3306 端口，使用 root 用户名和空密码即可完成利用。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 MySQL 到 3.23.53 或更高版本，该版本修复了 Windows 二进制发行版的默认空 root 密码配置。若无法立即升级，需立即登录 MySQL 执行 SET PASSWORD FOR 'root'@'localhost' = PASSWORD('强密码') 设置 root 密码，并在 my.cnf 或 my.ini 中配置 bind-address = 127.0.0.1 限制仅本地监听，同时在防火墙中阻断 3306 端口的公网访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "MySQL 空 Root 密码弱默认配置漏洞"
updated = "2026-06-16T22:00:01Z"

