[basic]
description = "Progress Telerik UI for ASP.NET AJAX 的 RadAsyncUpload 组件存在任意文件上传漏洞。该组件未对用户上传文件进行充分限制，远程未经身份认证的攻击者可通过构造特制的 HTTP 请求，绕过文件类型检查，上传包含恶意代码的 .NET 程序集文件至服务器，进而实现远程代码执行。该漏洞影响 R2 2017 SP2 之前的所有版本，CVSS 评分 9.8，危害等级严重。攻击无需任何权限和用户交互，利用复杂度低，已被 CISA 列入已知被利用漏洞目录，多个黑客组织曾利用此漏洞入侵目标系统。"
published = "2017-08-23T17:29:00Z"
remediation = '立即升级到 R1 2020（2020.1.114）或更高版本，这是唯一能同时防御 CVE-2017-11357、CVE-2019-18935 等已知漏洞的版本。在 web.config 的 appSettings 中添加 `<add key="Telerik.Web.DisableAsyncUploadHandler" value="true" />` 禁用内置上传处理程序，并按照 RadAsyncUpload 安全文档配置加密密钥。如无法立即升级，可下载对应版本的官方安全补丁包替换 Telerik.Web.UI 程序集作为临时缓解措施。'
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Progress Telerik UI for ASP.NET AJAX 任意文件上传漏洞"
updated = "2026-06-17T01:01:41Z"

