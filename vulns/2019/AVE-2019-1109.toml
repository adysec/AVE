[basic]
description = "Android 内核 binder 驱动中存在释放后使用（Use-After-Free）漏洞，当 binder 线程退出时，binder_proc 结构体未能正确同步引用计数，导致已释放的内存可被攻击者操控。本地攻击者可通过安装恶意应用或结合远程网络漏洞触发该漏洞，实现从应用层到 Linux 内核的权限提升，获取系统最高控制权。该漏洞影响 Android 多个版本，已有公开的 Metasploit 利用模块和独立 EXP 代码，CVSS 评分 7.8，危害等级高。Google 已在 2019 年 10 月安全公告中发布补丁修复。"
published = "2019-10-11T19:15:10Z"
remediation = "立即安装 Android 2019 年 11 月安全公告中的内核补丁，对应 Linux 内核主线 commit 7bada55ab50797b1f5f6c9d2c69a2e3fe0d4b2a9。对于 Android 10 及以下版本，升级至包含此补丁的 2019-11-05 或更新安全补丁级别（SPL）。若无法立即更新系统，可卸载不可信应用并限制 adb 调试权限作为临时缓解，但该漏洞可通过本地恶意应用无用户交互触发，建议优先完成内核升级。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Google Android 内核 Binder 驱动释放后使用权限提升漏洞"
updated = "2026-06-17T02:33:27Z"

