[basic]
description = "ISC BIND 是互联网上广泛使用的域名服务器软件，CVE-2001-0012 存在于 BIND 4.x（4.9.3 至 4.9.7）及 BIND 8.x（8.2 至 8.2.2p7）版本中，属于内存信息泄漏漏洞。该漏洞源于 BIND 在处理特制 DNS 查询请求时，对输入数据缺乏充分校验，导致服务器内存中的敏感信息（包括环境变量）可被远程攻击者直接读取。由于该漏洞攻击向量为网络可达（AV:N）、攻击复杂度低（AC:L）、无需身份认证（Au:N），攻击者仅需向目标 DNS 服务器发送恶意构造的 DNS 查询数据包，即可在无需任何凭据或用户交互的情况下触发信息泄漏，获取服务器内存中存储的敏感配置信息。受影响范围涵盖运行上述版本 BIND 的各类 Unix/Linux 系统，包括 Red Hat Linux 5.2、6.2、7.0 等发行版。该漏洞已于 2001 年 2 月由 CERT/CC 发布公告 CA-2001-02 进行预警，ISC 官方同步发布了补丁版本，Debian（DSA-026）及 Red Hat（RHSA-2001-007）等主流 Linux 发行版亦随之推送了安全更新，管理员应及时升级 BIND 至修复版本以消除此风险。"
published = "2001-02-12T05:00:00Z"
remediation = "建议立即将 ISC BIND 升级至 8.2.2 或更高版本。若无法立即升级，可通过防火墙限制对 DNS 端口（UDP/TCP 53）的访问权限，或通过配置 BIND 仅允许受信任的 IP 地址进行查询，以降低内存信息泄漏的风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "ISC BIND 远程敏感信息泄漏漏洞"
updated = "2026-06-16T21:53:29Z"

