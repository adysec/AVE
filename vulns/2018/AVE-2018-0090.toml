[basic]
description = "LOYTEC LGATE-902 楼宇自动化网关的 /webui/file_guest 接口存在路径遍历漏洞（CWE-22）。未经身份认证的远程攻击者可通过向目标设备发送特制的 HTTP 请求，利用 ../ 序列遍历目录，读取服务器上的任意敏感文件（如配置文件、密码等）。该漏洞影响 LGATE-902 固件版本 6.4.1 及更早版本，CVSS 评分 7.5，危害等级高。攻击无需任何权限，仅需网络可达即可利用，可能导致系统配置泄露和进一步渗透。"
published = "2019-06-28T18:15:10Z"
remediation = "立即将 LOYTEC LGATE-902 固件升级至 6.4.2 或更高版本，该版本已修复 `/webui/file_guest` 路径遍历漏洞。如无法立即升级，可在网络层面限制对设备 80/443 端口的访问，仅允许受信任的管理 IP 连接，并禁用不必要的 Web 管理接口暴露到公网。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "LOYTEC LGATE-902 路径遍历漏洞"
updated = "2026-06-17T01:41:53Z"

