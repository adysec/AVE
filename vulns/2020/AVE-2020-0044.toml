[basic]
description = "Microsoft Server Message Block 3.1.1 (SMBv3) 协议在处理特制压缩数据包时存在整数溢出漏洞，未经身份认证的远程攻击者可通过向目标系统的 SMBv3 服务端口（445）发送精心构造的压缩 SMB 数据包触发该漏洞，导致远程代码执行。该漏洞无需用户交互即可被利用，且具备蠕虫传播特性，影响 Windows 10 版本 1903/1909 及 Windows Server 版本 1903/1909。攻击者成功利用后可获取目标系统的完全控制权限，安装恶意程序、查看/篡改数据或创建新账户。Microsoft 已于 2020 年 3 月安全更新中修复此漏洞，补丁编号为 ADV200005。"
published = "2020-03-12T16:15:15Z"
remediation = '立即安装 Microsoft 2020 年 3 月安全更新（Windows 10 1903/1909 对应 KB4551762，Windows Server 1903/1909 对应对应补丁），或通过 Windows Update 自动更新。如无法立即打补丁，可通过 PowerShell 执行 `Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters" DisableCompression -Type DWORD -Value 1` 禁用 SMBv3 压缩功能作为临时缓解措施，无需重启。'
score = 10
severity = "CRITICAL"
sources = ["kev"]
title = "Microsoft Windows SMBv3 远程代码执行漏洞"
updated = "2026-06-17T02:46:38Z"

