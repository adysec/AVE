[basic]
description = "glftpd 1.18 的 privpath 指令存在安全绕过漏洞，允许远程攻击者利用文件名自动补全功能绕过目录访问限制，访问未授权的文件和目录。该漏洞影响 glftpd 1.18 及之前版本，CVSS 评分 10.0，危害等级极高。攻击者无需任何身份认证即可发起攻击，通过构造特殊文件名触发补全机制，从而绕过 privpath 指令定义的路径访问控制，可能导致敏感文件泄露或系统未授权访问。开发者应在官方渠道确认后升级至修复版本，并严格配置 privpath 指令限制可访问路径。"
published = "2000-06-26T04:00:00.000"
remediation = "升级 glftpd 至 v2.16 或更高版本，该版本已修复 privpath 指令的文件名补全绕过问题。升级前请备份 glftpd.conf 配置文件和用户数据库。如无法立即升级，应在 glftpd.conf 中注释或删除 privpath 相关配置项，同时在防火墙层限制 FTP 服务的访问源地址，仅允许可信 IP 连接，以临时缓解目录访问绕过风险。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "glftpd FTP服务器 访问控制绕过漏洞"
updated = "2026-06-16T21:52:03.443"

