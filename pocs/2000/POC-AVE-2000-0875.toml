[info]
author = "ave"
description = "验证 Helix GNOME Updater helix-update 0.5 及更早版本临时目录创建不当漏洞，检测是否可创建空的系统配置文件"
id = "POC-AVE-2000-0875"
name = "CVE-2000-0723 PoC"
severity = "low"
tags = ["ave-2000-0875"]
vuln_id = [
    "CVE-2000-0723",
    "AVE-2000-0875",
]

[poc]
logic = "any"

[[poc.requests]]
path = "/etc/config.d/bashrc"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [""]

[[poc.requests]]
path = "/etc/config.d/csh.cshrc"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [""]

[[poc.requests]]
path = "/etc/rc.config"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [""]
