[basic]
description = "Cobbler 的 XMLRPC API（`/cobbler_api`）端点在验证安全令牌时存在缺陷，导致访问控制失效。远程未经身份验证的攻击者可通过网络连接发送特制的请求，绕过权限检查实现权限提升。攻击者可利用此漏洞操纵系统数据、窃取敏感信息，甚至通过 API 接口收割 LDAP 凭据。该漏洞影响 Cobbler 2.6.11 及 2.0.0 以上的多个版本。"
published = "2018-08-20T20:29:01Z"
remediation = "建议将 Cobbler 升级至 2.6.12 或更高版本。若无法立即升级，应通过防火墙限制 /cobbler_api 接口的访问权限，仅允许可信的内部管理 IP 访问，以防止远程未经授权的权限提升攻击。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Cobbler XMLRPC API 访问控制不当导致权限提升漏洞"
updated = "2026-06-17T01:32:43Z"

