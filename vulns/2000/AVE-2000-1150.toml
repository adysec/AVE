[basic]
description = "tags as requested.<value>Lotus Domino 服务器 5.0.8 的默认配置中，HTTP 响应头会泄露系统信息（包括软件版本号、底层操作系统类型及构建日期），未经身份认证的远程攻击者只需向目标服务器发送普通的 HTTP 请求并检查响应头，即可获取这些敏感的系统信息。攻击者利用收集到的信息可以进一步了解目标环境，为后续针对性攻击（如寻找已知版本对应的公开漏洞利用代码）提供情报支持。该漏洞影响所有使用默认配置的 Lotus Domino 5.0.8 服务器，攻击条件简单，无需任何认证或特殊网络权限，CVSS 评分 5.0，危害等级为中等。"
published = "2001-09-19T04:00:00Z"
remediation = "将 Lotus Domino 服务器升级至 Release 5.0.2 或更高版本，该版本已移除 HTTP 响应头中的服务器版本、操作系统及构建日期信息。如暂无法升级，可在 Internet Site 文档的 Web 配置中禁用 HTTP 头信息显示，或在防火墙与反向代理层配置规则过滤 Server、X-Lotus-Domino 等响应头字段，以阻止敏感信息泄露给远程攻击者。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "IBM Lotus Domino 信息泄露漏洞"
updated = "2026-06-16T21:53:23Z"

