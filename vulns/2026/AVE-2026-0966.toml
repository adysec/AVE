[basic]
description = "OpenSSL 的 TLS 客户端在处理 OCSP 装订响应时存在双重释放漏洞。当 OCSP stapling 功能启用且 TLS 客户端连接到恶意服务器时，攻击者可通过 status_request 扩展发送精心构造的 OCSP 装订响应，在证书验证路径中触发双重释放，导致堆内存损坏。成功利用可造成拒绝服务，在特定复杂环境下也可能实现代码执行。该漏洞默认情况下 OCSP stapling 未启用，利用需要客户端主动连接恶意服务器等较高交互条件，但拒绝服务影响易于实现。OpenSSL 已在后续版本中修复此问题。"
published = "2026-06-09T17:17:05.437"
remediation = "立即升级 OpenSSL：4.0 系列升级至 4.0.1，3.6 系列升级至 3.6.3。该漏洞仅影响 OpenSSL 4.0.0 和 3.6.0~3.6.2 版本，3.5 及更早版本不受影响。若无法立即升级，确保客户端未启用 OCSP Stapling（默认关闭），即不设置 X509_V_FLAG_OCSP_RESP_CHECK 标志位，可避免触发双重释放。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "OpenSSL TLS OCSP 装订双重释放漏洞"
updated = "2026-07-23T08:10:00.137"

