[basic]
description = "Citrix StoreFront Server 存在 XML 外部实体注入（XXE）漏洞。攻击者可通过向受影响版本的 StoreFront 服务器发送特制的 XML 请求，利用服务器对 XML 外部实体的处理缺陷，读取服务器上的任意文件或发起服务端请求伪造攻击。该漏洞影响 Citrix StoreFront Server 1903 之前版本、7.15 LTSR CU4（3.12.4000）之前版本及 7.6 LTSR CU8（3.0.8000）之前版本，攻击者无需身份认证即可远程利用，CVSS 评分 7.5，危害等级高。Citrix 已发布安全更新修复此漏洞。"
published = "2019-08-29T19:15:13Z"
remediation = "升级 Citrix StoreFront Server 至 1903 及以上版本；若使用 7.15 LTSR 需升级至 CU4 (3.12.4000) 及以上；若使用 7.6 LTSR 需升级至 CU8 (3.0.8000) 及以上。同时禁用 XML 外部实体解析功能，限制应用程序对外部资源的访问权限。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Citrix StoreFront Server XML外部实体注入漏洞"
updated = "2026-06-17T02:17:04Z"

