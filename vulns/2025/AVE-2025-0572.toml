[basic]
description = "GNU elfutils 0.192 版本的 eu-readelf 组件中存在一个缓冲区溢出漏洞。该漏洞位于 `readelf.c` 文件的 `process_symtab` 函数中，当攻击者通过特定参数（如 D/a）操纵输入时，会导致内存缓冲区溢出。由于该漏洞需要本地访问权限，攻击者需在目标系统上拥有执行权限或诱导用户处理恶意 ELF 文件。成功利用此漏洞可能导致程序崩溃或在特定条件下实现本地代码执行。目前该漏洞已公开，建议用户及时更新补丁以修复此安全问题。"
published = "2025-02-17T00:15:09Z"
remediation = "建议立即应用官方发布的补丁（Patch ID: 5e5c0394d82c53e97750fe7b18023e6f84157b81）以修复 readelf.c 中的缓冲区溢出漏洞。对于使用发行版的用户，请通过包管理器（如 apt, yum, dnf）将 GNU elfutils 升级至最新安全版本。在无法立即更新的环境中，建议限制对受影响二进制文件的本地执行权限，以降低攻击风险。"
score = 4.8
severity = "MEDIUM"
sources = ["msrc"]
title = "GNU elfutils eu-readelf readelf.c process_symtab 缓冲区溢出漏洞"
updated = "2026-06-17T08:38:59Z"

