[basic]
description = "Kubernetes Kubelet 组件的健康检查端口（healthz）未经身份认证即暴露了 /debug/pprof 调试端点。攻击者可通过该端点获取 Kubelet 内部内存地址、配置信息等敏感数据，或实施有限的拒绝服务攻击。该漏洞影响 Kubernetes 1.15.0 之前、1.14.4 之前、1.13.8 之前及 1.12.10 之前的版本，默认配置下不暴露该端点，但若用户启用了 healthz 端口且未进行访问控制，则面临信息泄漏风险。CVSS 评分 8.2，危害等级高。"
published = "2019-08-29T01:15:11.367"
remediation = "立即升级 Kubernetes 至 v1.15.0、v1.14.4、v1.13.8 或 v1.12.10 及以上版本。如无法立即升级，可在 kubelet 启动参数中添加 `--profiling=false` 禁用性能分析端点，或在网络层面限制对 kubelet 健康检查端口（10250/10255）的访问，仅允许受信来源连接。"
score = 8.2
severity = "HIGH"
sources = ["nuclei"]
title = "Kubernetes kubelet /debug/pprof 信息泄漏漏洞"
updated = "2026-06-17T02:12:36.930"

