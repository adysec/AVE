[basic]
description = "PHP Arena paFileDB 1.1.3 至 3.0 版本的 pafiledb.php 脚本存在跨站脚本攻击漏洞。远程攻击者可通过 rate、email 或 download 等动作的查询字符串注入任意 HTML 和 JavaScript 代码。当 Web 用户访问攻击者构造的恶意链接时，注入的脚本将在 paFileDB 站点的安全上下文中执行，从而窃取用户会话 Cookie 或执行其他恶意操作。该漏洞无需身份验证即可远程触发，影响所有部署了受影响版本 paFileDB 的网站。"
published = "2002-12-31T05:00:00Z"
remediation = "建议立即将 paFileDB 替换为仍在维护的文件管理系统（如 H5AI 或 FileRun）。如暂时无法替换，应手动修改 pafiledb.php，对 rate、email、download 三个动作的 query string 参数调用 htmlspecialchars() 进行输出编码过滤，并在 Apache/Nginx 层面通过 ModSecurity 或 WAF 规则拦截 XSS 攻击载荷，同时禁用不必要的 Email To Friend 功能以缩小攻击面。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "PHP Arena paFileDB 跨站脚本攻击漏洞"
updated = "2026-06-16T22:00:19Z"

