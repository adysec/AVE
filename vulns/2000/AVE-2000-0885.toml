[basic]
description = "Becky! Internet Mail 客户端在处理邮件回复时存在缓冲区溢出漏洞，攻击者可向目标系统发送包含超长 Content-Type: MIME 头部的恶意邮件。当用户回复受感染邮件时，邮件客户端会在处理大量数据时导致内存缓冲区溢出，进而触发程序崩溃或拒绝服务。该漏洞影响 Becky! Internet Mail 客户端 1.26.03 及更早版本，攻击者无需认证即可远程利用这一漏洞，导致应用程序无法正常运行。漏洞 CVSS 评分 5.0，危害等级为中级。尽管这是一个拒绝服务漏洞，但在特定环境下，攻击者可能结合其他技术实现代码执行。"
published = "2000-10-20T04:00:00Z"
remediation = "立即升级 Becky! Internet Mail 客户端到 1.26.04 或更高版本，从中获取修复缓冲区溢漏洞的补丁。如无法立即更新，可通过邮件客户端设置禁用 MHTML 格式回复功能，或在系统中启用邮件内容长度限制和 MIME 头检测，防止过长内容类型触发溢出。(≥20字)"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Becky! Internet Mail 邮件客户端 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:22Z"

