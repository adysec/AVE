[basic]
description = "Netscape Communicator 未能正确限制不可信实体创建 ServerSocket 对象，导致远程攻击者可通过恶意 Java Applet 在受害者系统上创建监听套接字，从而建立后门服务器。该漏洞被称为 Brown Orifice，攻击者无需身份认证即可远程利用，实现信息泄露、数据篡改及服务中断。影响 Sun JDK 1.1.x 及 Sun JRE 1.1.x 版本。"
published = "2000-10-20T04:00:00.000"
remediation = '立即禁用浏览器中的 Java applet 支持：在 Netscape Communicator 中进入"编辑→首选项→高级"，取消勾选"启用 Java"。如使用 Sun JDK/JRE 1.1.x，应升级至 JDK 1.4 及以上版本（已移除不可信 applet 创建 ServerSocket 的能力）。对于仍依赖旧版 JDK 的环境，可在系统防火墙中限制出站连接，阻止恶意 applet 建立反向连接。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Sun JDK 1.1.x / JRE 1.1.x Java Applet 未授权侦听套件漏洞"
updated = "2026-06-16T21:52:19.250"

