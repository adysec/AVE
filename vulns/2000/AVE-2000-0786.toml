[basic]
description = 'alex heiphetz Group 开发的 EZshopper 2.0 及 3.0 版本中的 loadpage.cgi CGI 程序存在目录遍历漏洞。远程攻击者无需身份认证，通过在 file 参数的目标文件名前插入 "/" 字符，即可遍历并读取 EZshopper 数据目录中的任意文件，导致敏感信息泄露。该漏洞利用方式简单，攻击条件低，CVSS 评分 5.0，危害等级中等。'
published = "2001-01-09T05:00:00.000"
remediation = '该产品已停止维护，官方不再提供安全更新。建议立即停用 EZshopper 2.0/3.0，迁移至其他仍在维护的电商平台。如无法立即替换，可在 Web 服务器层面配置 URL 重写规则，拦截对 loadpage.cgi 的请求，或限制 file 参数仅允许字母数字字符，禁止包含 "/" 或 "../" 等目录遍历序列。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "alex heiphetz Group EZshopper 目录遍历漏洞"
updated = "2026-06-16T21:53:07.783"

