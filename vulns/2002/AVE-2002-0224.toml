[basic]
description = "ScrollKeeper 0.3 到 0.3.11 版本中的 scrollkeeper-get-cl 函数存在不安全的临时文件处理漏洞。攻击者可利用符号链接攻击机制，在用户执行 ScrollKeeper 操作时，创建指向任意目标文件的符号链接。当 vulnerable 函数尝试写入临时文件时，实际会写入到目标文件的位置，导致本地用户能够任意创建和覆盖文件。该漏洞主要影响 Linux 系统中安装了 ScrollKeeper 软件包的用户，可能导致文件权限提升或系统文件破坏。攻击者无需网络权限，仅需本地访问权限即可发起攻击，利用难度较低。此类漏洞常被用作本地提权攻击的初始破坏手段，可进一步获取系统控制权或安装恶意软件。Microsoft Security Response Center 已确认此漏洞，并建议用户升级到最新版本的 ScrollKeeper，彻底修复此安全问题。"
published = "2002-10-04T04:00:00Z"
remediation = "建议将 ScrollKeeper 升级至 0.3.14-11ubuntu6 或更高版本（该版本已修复 scrollkeeper-get-cl 中 scrollkeeper-tempfile.x 临时文件的符号链接攻击，通过安全的临时文件创建方式替代可预测的文件名）。对于 Debian/Ubuntu 系统，可通过 apt 执行 apt update && apt upgrade scrollkeeper 完成升级。如暂时无法升级，可临时设置环境变量 TMPDIR 指向非共享的 /var/tmp 以外目录（如 /home/user/tmp），并确保该目录具有严格访问权限（chmod 700），以降低本地用户通过符号链接创建和覆写文件的风险。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "ScrollKeeper 不安全临时文件名本地文件覆盖漏洞"
updated = "2026-06-16T21:57:53Z"

