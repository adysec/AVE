[basic]
description = "Linux 内核 WiFi 子系统的 cfg80211 模块中存在释放后使用漏洞。当 wiphy_work 任务已排队但尚未执行时，若 wiphy_free 被调用则会提前释放 wiphy 内存，导致后续 wiphy_work 执行时访问已释放的内存区域，引发内存损坏、信息泄露或权限提升。该漏洞影响 Linux 内核 WiFi 驱动，攻击者需具有本地低权限访问权限，通过竞争条件触发 wiphy 释放与 work 执行的时间差来利用，最终可能导致内核拒绝服务或代码执行。"
published = "2025-04-01T16:15:29Z"
remediation = "升级 Linux 内核至修复版本：Debian 12 (bookworm) 升级至 6.1.133-1 或更高版本，Ubuntu 24.04 LTS 升级至 6.8.0-84.84 或更高版本，RHEL/CentOS 升级至内核 6.1.132 / 6.6.84 / 6.12.20 / 6.13.8 或更高版本。如无法立即升级，可通过防火墙或 sysctl 禁用无线网络驱动自动加载作为临时缓解措施，执行 `modprobe -r cfg80211` 或在内核启动参数中添加 `nowiphy` 禁用无线子系统，随后重启系统并确认内核版本号。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 cfg80211 释放后使用漏洞"
updated = "2026-06-17T08:44:45Z"

