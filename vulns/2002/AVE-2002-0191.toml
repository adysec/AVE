[basic]
description = "Microsoft IIS 4.0/5.0/5.1 的 HTTP 错误页面存在跨站脚本（XSS）漏洞。当 IIS 返回自定义错误页面时，未对用户提供的输入进行充分过滤和转义，远程攻击者可通过向目标服务器发送特制的恶意请求，在错误页面中注入任意 HTML 或 JavaScript 脚本。当其他用户访问该错误页面时，注入的脚本将在其浏览器中执行，导致敏感信息泄露、会话劫持或钓鱼攻击。攻击者无需身份认证，仅需诱使用户访问特制链接即可触发该漏洞。"
published = "2002-04-22T04:00:00Z"
remediation = "安装 Microsoft 安全公告 MS02-018 提供的累积补丁 (Q319733)，该补丁修复了 IIS 4.0/5.0/5.1 中 HTTP 错误页面的跨站脚本漏洞。如无法立即打补丁，可使用 IIS Lockdown Tool 禁用不必要的功能，并部署 URLScan 工具过滤恶意请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft IIS 4.0/5.0/5.1 HTTP 错误页面跨站脚本漏洞"
updated = "2026-06-16T21:56:53Z"

