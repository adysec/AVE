[basic]
description = "ISC BIND 8.2 至 8.2.2-P6 版本的 named 服务在处理 SRV 记录时存在拒绝服务漏洞。远程攻击者无需身份认证，只需向目标 DNS 服务器发送特制的 SRV 记录即可触发该漏洞，导致 named 服务崩溃或进入异常状态，造成正常的 DNS 解析服务中断。该漏洞利用条件简单，攻击门槛低，影响范围广泛。"
published = "2000-12-19T05:00:00Z"
remediation = "立即升级 ISC BIND 至 8.2.2-P7 或更高版本。Red Hat 用户应安装 RHSA-2000:107 提供的更新包；Debian 用户应应用 2000-11-12 发布的安全更新。如无法立即升级，可在 named.conf 中限制 SRV 记录查询来源，或使用 iptables 限制对 DNS 端口 53 的访问作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "ISC BIND SRV 记录处理拒绝服务漏洞"
updated = "2026-06-16T21:52:40Z"

