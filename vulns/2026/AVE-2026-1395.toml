[basic]
description = "tags only.<value>Ghost 是一款基于 Node.js 的开源内容管理系统。其自定义主题上传功能存在路径遍历漏洞（CWE-22），漏洞源于 LocalStorageBase 存储模块及主题存储名称处理逻辑未对上传文件路径进行充分校验，导致具备管理员权限的 staff 用户可绕过限制将文件写入 uploads 目录之外的任意位置，进而篡改配置文件或植入恶意脚本以改变安装环境的行为。攻击者需先以具备主题上传权限的账号登录，利用特制主题包中构造的路径穿越文件名触发漏洞。该漏洞影响 Ghost v0.10.0 至 v6.54.0 所有版本，CVSS 评分为 6.6（中危），官方已在 v6.54.1 版本中修复，建议用户及时升级。"
published = "2026-08-04T22:17:17Z"
remediation = "建议立即将 Ghost 升级至修复版本 v6.54.1 或更高版本（受影响版本为 v0.10.0 至 v6.54.0）。Docker 用户执行 `docker pull ghost:6.54.1` 拉取新镜像并重新创建容器完成升级；通过 Ghost-CLI 部署的用户运行 `ghost update` 命令升级。如无法立即升级，应临时禁用或仅允许受信任管理员上传自定义主题，并审查主题 ZIP 包中是否包含路径穿越特征（如 `../`）的文件条目，防止恶意主题写入 uploads 目录之外。升级前请备份数据库与主题文件，升级后验证主题上传功能正常。"
score = 6.6
severity = "MEDIUM"
sources = ["ghsa"]
title = "Ghost 主题上传路径遍历漏洞"
updated = "2026-08-05T15:17:15Z"

