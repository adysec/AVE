[basic]
description = "Red Hat Linux 系统中的 xconq 和 cconq 游戏程序存在缓冲区溢出漏洞，由于程序在处理 DISPLAY 环境变量时未正确限制输入长度，本地攻击者可通过向该环境变量传入超长字符串触发缓冲区溢出，导致程序执行异常。成功利用此漏洞的本地攻击者可获取额外的系统权限，实现权限提升，影响系统的机密性、完整性和可用性。该漏洞攻击复杂度低，无需身份认证，但需要本地访问权限。"
published = "2000-06-22T04:00:00Z"
remediation = "立即升级 xconq/cconq 到已修复该缓冲区溢出漏洞的版本（如 xconq 7.2.1 及以上），或从 Red Hat 官方获取对应安全补丁。由于 Red Hat Linux 6.x/7.x 已停止维护，建议升级到受支持的现代 Red Hat Enterprise Linux 发行版。临时缓解措施：移除 xconq 和 cconq 二进制文件的 setuid 权限（chmod u-s /usr/bin/xconq /usr/bin/cconq），并在启动脚本中对 DISPLAY 环境变量长度做限制校验。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Red Hat Linux xconq/cconq 游戏程序缓冲区溢出漏洞"
updated = "2026-06-16T21:52:07Z"

