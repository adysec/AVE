[basic]
description = "tags.<value>Google Chrome Android 版 Omnibox（地址栏）存在不当实现漏洞。当用户被诱骗执行特定的 UI 手势操作时，攻击者可通过恶意构造的 HTML 页面欺骗用户界面，导致 UI 欺骗攻击。该漏洞影响 Google Chrome Android 平台 142.0.7444.137 之前的所有版本。攻击者需通过社会工程手段诱使用户在恶意网页上执行特定手势操作才能触发漏洞利用。成功利用后，攻击者可伪造浏览器界面元素，误导用户输入敏感信息或点击恶意链接，造成钓鱼攻击或信息泄露风险。由于该漏洞需要用户交互且访问复杂度较高，Chromium 安全团队将其评级为中等严重性。Google 已在 Chrome 142.0.7444.137 版本中修复此漏洞，用户应尽快更新至最新版本以消除安全风险。"
published = "2025-11-10T20:15:40Z"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
score = 4.2
