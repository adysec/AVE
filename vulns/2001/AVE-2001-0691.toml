[basic]
description = "NetBSD 1.5及更早版本、OpenBSD 2.8及更早版本中的i386_set_ldt系统调用在启用USER_LDT内核选项时，未对段调用门的目标地址进行充分验证。本地攻击者可通过在本地描述表(LDT)中创建调用门并指定任意内核地址作为目标，从而获取root权限。该漏洞影响启用USER_LDT选项的系统，攻击者需具备本地访问权限，利用系统调用机制绕过内核安全校验实现权限提升。"
published = "2001-05-03T04:00:00Z"
remediation = "NetBSD 用户应立即升级至 NetBSD 1.6 或更高版本，或应用 NetBSD-SA2001-002 安全公告中提供的内核补丁并重新编译内核。OpenBSD 用户应升级至 OpenBSD 2.9 或更高版本，如短期内无法升级，请修改内核配置文件，禁用 USER_LDT 选项后重新编译内核，并重启系统使配置生效。如该选项并非必要，也可通过调整内核配置完全移除 USER_LDT 功能作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "NetBSD 操作系统 LDT 权限提升漏洞"
updated = "2026-06-16T21:53:59Z"

