[basic]
description = "rsync 2.4.6、2.3.2 及更早版本的 I/O 函数中存在有符号数与无符号数混合使用的符号错误漏洞。远程攻击者无需身份认证即可向 rsync 客户端或服务器发送特制数据，触发符号错误导致缓冲区溢出，进而造成拒绝服务或在目标系统上执行任意代码。该漏洞影响范围广泛，CVSS 评分 10.0，危害等级为严重。"
published = "2002-02-27T05:00:00Z"
remediation = "立即将 rsync 升级至 2.5.1 或更高版本。各发行版操作：Debian 用户运行 apt-get upgrade rsync 安装 DSA-106 提供的更新包；Red Hat 用户安装 RHSA-2002-018 提供的更新 RPM；FreeBSD 用户通过 ports 升级 net/rsync 或安装 FreeBSD-SA-02:10 补丁；SuSE 用户安装 SUSE Security Announcement 2002:Jan:0003 提供的更新。如无法立即升级，可在防火墙限制对 rsync 服务端口（默认 873/TCP）的访问，仅允许可信来源连接。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "rsync rsync I/O符号错误远程代码执行漏洞"
updated = "2026-06-16T21:56:39Z"

