[basic]
description = "Android 内核 eventpoll.c 中的 ep_loop_check_proc 函数存在释放后使用（Use-After-Free）漏洞。攻击者可在无需用户交互和额外执行权限的情况下，通过本地访问触发该漏洞，导致内存损坏并实现本地权限提升。该漏洞影响 Android 内核版本，CVSS 评分为 7.8（高危），攻击者可利用此漏洞获取更高的系统权限，进而控制受影响的 Android 设备。"
published = "2021-12-15T19:15:14.917"
remediation = "升级至 Android 2021 年 11 月安全补丁级别或更高版本，该补丁修复了 Android 内核 eventpoll.c 中 ep_loop_check_proc 函数的释放后使用漏洞。具体操作：进入设备设置 → 系统 → 系统更新，检查并安装最新的 Android 安全补丁；若为开发者或设备制造商，请从 Android 开源项目（AOSP）获取 2021-11-01 安全公告中的内核补丁并重新编译内核。无法立即更新时，建议禁用不必要的本地应用权限以降低被利用风险。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Google Android 资源管理错误漏洞"
updated = "2026-06-17T03:30:51.917"

