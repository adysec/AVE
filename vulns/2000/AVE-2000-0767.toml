[basic]
description = "HP OpenView Network Node Manager 6.1 及更早版本的 OverView5 CGI 程序存在缓冲区溢出漏洞，远程未认证攻击者可通过发送特制的 SNMP 请求触发该漏洞，导致 SNMP 服务拒绝服务，甚至可能在目标系统上执行任意命令。该漏洞源于 Java SNMP MIB Browser 对象标识符解析处理不当，攻击者无需身份验证即可远程利用，影响网络管理系统的可用性与完整性，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），属于中等危害级别。"
published = "2000-12-11T05:00:00Z"
remediation = "建议升级 HP OpenView Network Node Manager 至 6.2 或更高版本（已修复该缓冲区溢出）。若无法升级，可在 Web 服务器层面禁用 OverView5 CGI 程序（删除或重命名 cgi-bin/OV5 目录），并在防火墙限制 SNMP 服务（UDP 161/162）仅允许受信管理主机访问，临时缓解拒绝服务风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Hewlett-Packard OpenView Network Node Manager (NNM) 6.1 及以上版本缓冲区溢出导致SNMP服务拒绝服务漏洞"
updated = "2026-06-16T21:53:04Z"

