[basic]
description = "CVE-2011-3043 是 WebKit 浏览器引擎中的 use-after-free（释放后重用）内存安全漏洞。Google Chrome 17.0.963.65 之前版本、Apple Safari 6.0 之前版本及 Apple iTunes 10.6.3 等使用 WebKit 渲染引擎的产品均受影响。攻击者可通过构造包含弹性盒子（flexbox）与浮动元素（floating elements）的特制网页，在页面渲染过程中触发对已释放内存对象的重复引用，导致浏览器崩溃或可能进一步执行任意代码。该漏洞利用无需身份认证，攻击者只需诱使用户访问恶意网页即可触发，CVSS 评分 6.8。用户升级至最新版本可彻底消除此风险。"
published = "2012-03-05T19:55:01Z"
remediation = "升级至 Google Chrome 17.0.963.65 或更高版本，或升级至 Apple iOS 6.0 及以上版本。禁用浏览器中的 JavaScript 执行可降低被利用风险，同时建议启用浏览器沙箱保护机制以隔离潜在攻击。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple WebKit 使用后释放漏洞"
updated = "2026-06-16T23:32:29Z"

