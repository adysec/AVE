[basic]
description = "OpenSSH 2.9.9 至 3.3 版本的 sshd 组件在处理挑战响应认证（ChallengeResponseAuthentication）时存在整数溢出漏洞（CWE-190）。当 OpenSSH 启用 SKEY 或 BSD_AUTH 认证方式时，远程攻击者无需身份认证即可向目标系统发送特制的认证请求触发整数溢出，导致堆内存破坏，最终实现远程代码执行。攻击者可借此完全控制受影响服务器，安装恶意程序、窃取数据或创建后门。该漏洞影响范围广泛，危害等级严重，CVSS 评分 9.8。"
published = "2002-07-03T04:00:00Z"
remediation = "立即升级 OpenSSH 至 3.4 或更高版本。如无法升级，在 sshd_config 中设置 ChallengeResponseAuthentication no 和 PAMAuthenticationViaKbdInt no 禁用挑战响应认证，或启用 UsePrivilegeSeparation yes 以限制提权影响。"
score = 9.8
severity = "CRITICAL"
sources = ["redhat"]
title = "OpenSSH sshd 整数溢出远程代码执行漏洞"
updated = "2026-06-16T21:57:50Z"

