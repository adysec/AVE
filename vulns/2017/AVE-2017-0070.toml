[basic]
description = "WordPress 的 contact-form-to-db 插件（版本低于 1.5.7）存在多个跨站脚本（XSS）漏洞。该漏洞源于插件未对用户输入的数据进行充分过滤和转义，导致攻击者可通过向表单字段中注入恶意 JavaScript 代码，当管理员或其他用户查看已提交的表单数据时触发执行。攻击者无需身份认证，仅需诱使用户点击恶意链接或访问特制页面即可实施攻击，可导致敏感信息泄露、会话劫持或页面内容篡改。该漏洞影响所有使用 contact-form-to-db 插件且版本低于 1.5.7 的 WordPress 站点，CVSS 评分 6.1，危害等级中危。"
published = "2019-08-13T17:15:13Z"
remediation = "立即将 WordPress 的 contact-form-to-db 插件升级至 1.5.7 或更高版本。如无法升级，可在 WordPress 后台禁用该插件，或通过 Web 应用防火墙（WAF）添加规则拦截包含恶意脚本的 POST 请求作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress contact-form-to-db 插件跨站脚本漏洞"
updated = "2026-06-17T01:12:57Z"

