[basic]
description = "Google Chrome V8 JavaScript 引擎存在类型混淆漏洞（CWE-843），影响 142.0.7444.59 之前版本。攻击者可构造恶意 HTML 页面，诱导受害者访问触发 V8 引擎中的类型混淆，进而导致堆内存损坏。攻击向量为网络（AV:N），攻击复杂度低（AC:L），无需权限（PR:N），但需要用户交互（UI:R），成功利用可导致高机密性、完整性、可用性影响（C:H/I:H/A:H），CVSS 3.1 评分 8.8（HIGH）。攻击者需诱导用户访问精心构造的恶意网页即可触发漏洞，可能导致远程代码执行。Google Chrome 142.0.7444.59 及更高版本已修复此漏洞。"
published = "2025-11-18T00:15:48Z"
remediation = '立即升级 Google Chrome 至 142.0.7444.59 或更高版本（通过设置→关于 Chrome 自动更新）。若暂时无法升级，可在 chrome://flags 中启用 "Site Isolation" 并禁用 JavaScript 作为临时缓解措施，或使用浏览器隔离/沙箱方案限制渲染进程权限。'
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 类型混淆漏洞"
updated = "2026-06-17T08:33:43Z"

