[basic]
description = "Linux 内核 2.2.x 至 2.2.19 及 2.4.x 至 2.4.9 版本中的 ptrace 系统调用存在权限提升漏洞。本地用户可利用 ptrace 附加到正在执行 setuid 或 setgid 程序的进程上，当该程序（如 newgrp）内部调用非特权程序时，ptrace 的控制权可被继承，从而以高权限执行任意代码，实现从普通用户到 root 的权限提升。攻击者需具备本地 shell 访问权限，无需认证即可完全控制系统。该漏洞 CVSS 评分 7.2，危害等级高。"
published = "2001-10-18T04:00:00.000"
remediation = "升级 Linux 内核至 2.4.10 及以上版本或 2.2.20 及以上版本，该漏洞已在后续内核版本中修复。如无法升级内核，可移除受影响系统上 setuid/setgid 程序（如 newgrp）的 suid 位作为临时缓解：`chmod u-s /usr/bin/newgrp`。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "Linux Kernel 2.2/2.4 ptrace/setuid 本地权限提升漏洞"
updated = "2026-06-16T21:56:09.853"

