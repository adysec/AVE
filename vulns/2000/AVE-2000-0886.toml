[basic]
description = "Becky! Internet Mail 客户端 1.26.04 及早期版本在处理转发邮件时存在缓冲区溢出漏洞，攻击者可构造包含超长 Content-Type MIME 头部的恶意邮件，诱导受害者转发该邮件时触发缓冲区溢出，导致客户端崩溃拒绝服务。该漏洞影响 Becky! Internet Mail 1.26.04 及更早版本，CVSS 评分 5.0（中等），攻击向量为网络，攻击复杂度低，无需身份认证，仅需用户转发恶意邮件即可触发拒绝服务，影响可用性。"
published = "2000-10-20T04:00:00Z"
remediation = "建议立即升级 Becky! Internet Mail 客户端至 1.26.05 或更高版本（官网 https://www.rimarts.co.jp/software/becky/ 下载最新版）。若暂时无法升级，建议配置邮件客户端禁止自动转发带有异常长 Content-Type 头的邮件，或在邮件网关层面拦截 Content-Type 头超长的 MIME 消息作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "RimArts Becky! Internet Mail 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:22Z"

