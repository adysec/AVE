[basic]
description = "Haakon Nilsen 开发的简单集成发布系统（SIPS）0.2.4 之前版本存在一个未明确指明的严重安全缺陷。根据 CVSS 评分 10.0 及向量分析（AV:N/AC:L/Au:N/C:C/I:C/A:C），该漏洞可被远程攻击者通过网络利用，攻击复杂度低，无需身份认证即可实现完全的机密性、完整性和可用性破坏。由于厂商未公开具体技术细节，该漏洞的确切原理和攻击向量尚不明确，但影响范围涉及 SIPS 0.2.4 之前所有版本，危害等级极高。"
published = "2000-12-31T05:00:00Z"
remediation = "升级 SIPS 至 0.2.4 或更高版本，该版本已修复此严重安全缺陷。由于 SIPS 项目已停止维护多年，建议同时评估迁移至其他仍在维护的发布系统（如 WordPress、Joomla 等），并确保服务器仅暴露必要端口和服务，实施最小权限原则。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Haakon Nilsen SIPS 未指明严重安全漏洞"
updated = "2026-06-16T21:53:26Z"

