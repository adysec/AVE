[basic]
description = "HP JetDirect 打印卡固件 X.08.20 及更早版本（包括 X.08.04、X.08.05）的 LPD（Line Printer Daemon）打印服务存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过网络向目标设备的 LPD 服务端口发送特制的恶意数据包，触发缓冲区溢出，导致打印服务崩溃或设备无响应，从而造成拒绝服务。该漏洞影响运行受影响固件版本的 HP JetDirect 打印卡设备，攻击条件简单，无需用户交互或权限认证，利用门槛低，可直接影响企业办公环境中网络打印服务的可用性。"
published = "2000-12-11T05:00:00Z"
remediation = "下载并安装 HP Jetdirect 固件升级程序（http://www.hp.com/cposupport/networking/software/allhpjd3.exe.html），升级到至少 X.08.21 版本以修复 LPD 服务缓冲区溢出漏洞。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "HP Jetdirect LPD 服务缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:53:04Z"

