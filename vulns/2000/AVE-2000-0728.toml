[basic]
description = "BSD libutil 库中的 pw_error 函数存在格式化字符串漏洞，本地攻击者可通过在 chpass 或 passwd 等命令中提交特制的畸形密码字符串触发该漏洞，导致以 root 权限执行任意代码。该漏洞影响多个 BSD 系统版本，CVSS 评分 7.2，危害等级高。攻击者需拥有本地账户即可利用，无需交互，Exploit-DB 已公开利用代码。"
published = "2000-12-19T05:00:00.000"
remediation = "升级到已修复此格式字符串漏洞的 BSD 版本（如 OpenBSD 2.8 之后、FreeBSD 4.2 之后），或安装对应发行版的安全补丁。如无法升级，可通过限制本地用户对 chpass/passwd 等 setuid 命令的访问权限作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "BSD libutil pw_error 格式化字符串本地权限提升漏洞"
updated = "2026-06-16T21:52:55.813"

