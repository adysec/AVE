[basic]
description = "Netscape 6 及 Mozilla 1.0 RC1 及更早版本中存在信息泄露漏洞。远程攻击者可通过在层叠样式表（CSS）页面中使用 LINK 元素，该元素会触发 HTTP 重定向，从而判断客户端系统上是否存在特定文件。攻击原理是利用浏览器对 CSS 中 LINK 标签的处理机制，当引用的外部资源存在时浏览器会发起 HTTP 请求，攻击者通过观察重定向行为即可推断目标文件是否存在。该漏洞无需用户交互即可利用，攻击者仅需诱导用户访问恶意构造的网页即可探测客户端文件系统信息，可能导致敏感文件路径泄露，为进一步攻击提供信息基础。"
published = "2002-06-18T04:00:00Z"
remediation = "升级到 Mozilla 1.0 及以上版本，或升级到 Netscape 7.0 及以上版本。Red Hat 已发布 RHSA-2002-192 和 RHSA-2003-046 安全公告提供修复补丁，用户可通过 Red Hat 官方渠道获取更新。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Netscape Mozilla 浏览器 CSS LINK 元素信息泄露漏洞"
updated = "2026-06-16T21:57:44Z"

