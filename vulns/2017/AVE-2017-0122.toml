[basic]
description = "paintballrefjosh MaNGOSWebV4 4.0.8 版本前存在反射型跨站脚本攻击漏洞，漏洞位于 install/index.php 文件的 step 参数处理逻辑中。由于缺乏输入验证和输出编码，攻击者可构造包含恶意脚本的 step 参数值，诱导用户访问特制链接触发反射型 XSS 攻击。该漏洞影响 MaNGOSWebV4 4.0.8 之前版本（paintballrefjosh 分支），CVSS 3.1 评分 6.1（MEDIUM），攻击向量为网络（AV:N），攻击复杂度低（AC:L），无需权限（PR:N）但需要用户交互（UI:R），作用域改变（S:C），机密性和完整性影响低（C:L/I:L），可用性无影响（A:N）。攻击者需诱导管理员或用户点击恶意链接，在用户浏览器中执行任意 JavaScript 代码，可窃取会话 Cookie、执行敏感操作或钓鱼攻击。修复版本为 4.0.8，建议升级至最新版本并实施输入验证与输出编码防护。"
published = "2017-03-05T20:59:00Z"
remediation = "建议立即升级 MaNGOSWebV4 至 4.0.8 或更高版本（https://github.com/paintballrefjosh/MaNGOSWebV4/releases/tag/4.0.8）。如暂时无法升级，可在 Web 应用防火墙（WAF）层面拦截 install/index.php 的 step 参数中的脚本载荷，或临时禁用安装页面访问作为缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "paintballrefjosh MaNGOSWebV4 反射型跨站脚本攻击漏洞"
updated = "2026-06-17T01:22:25Z"

