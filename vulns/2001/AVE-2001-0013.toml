[basic]
description = "Roaring Penguin rp-pppoe 2.4及更早版本的PPPoE客户端在Clamp MSS选项处理上存在拒绝服务漏洞。远程攻击者无需身份认证，通过向目标系统发送带有零长度TCP选项的特制TCP数据包即可触发该漏洞，导致客户端服务异常终止或崩溃。该漏洞影响使用rp-pppoe作为PPPoE拨号客户端的Linux系统，攻击复杂度低，仅需网络可达即可利用。攻击成功后将造成部分服务不可用，但不影响系统机密性和完整性。"
published = "2001-02-12T05:00:00.000"
remediation = "升级 rp-pppoe 到 ≥2.5 版本以获取 Clamp MSS 选项修复，或编译最新代码并应用针对 CVE-2001-0026 的安全补丁，同时确保禁用实验性 TCP 选项以缓解该拒绝服务漏洞。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Roaring Penguin rp-pppoe 拒绝服务漏洞"
updated = "2026-06-16T21:53:30.870"

