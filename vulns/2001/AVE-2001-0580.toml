[basic]
description = "FoolProof Security 3.9 存在安全绕过漏洞。该软件旨在限制用户执行特定程序，但本地攻击者可通过从其他来源下载被限制的可执行文件并重命名后绕过执行限制。攻击者利用该漏洞可在受限环境中运行未授权的程序，破坏系统安全策略。攻击条件为拥有本地访问权限，无需身份认证即可利用，CVSS 评分 7.2，危害等级高。"
published = "2001-02-16T05:00:00Z"
remediation = "建议立即卸载 FoolProof 3.9，更换为受支持的终端安全管控软件（如 Microsoft AppLocker 或第三方应用程序白名单方案）。如无法立即更换，可通过操作系统组策略限制非管理员用户下载可执行文件，并启用 Windows SRP（软件限制策略）或类似机制阻止未授权程序运行。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "FoolProof Security 3.9 本地安全绕过漏洞"
updated = "2026-06-16T21:53:31Z"

