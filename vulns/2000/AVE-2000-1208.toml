[basic]
description = "HP OpenView Network Node Manager 6.1 的 Alarm 服务（OVALARMSRV，监听于 2345 端口）存在缓冲区溢出漏洞。远程攻击者无需身份认证即可向该服务发送特制的网络数据包，触发缓冲区溢出，从而在目标系统上以服务进程权限执行任意命令。该漏洞影响 HP OpenView Network Node Manager 6.1 版本，CVSS 评分 10.0，危害等级严重。厂商已发布安全公告并建议升级至修复版本。"
published = "2000-06-06T04:00:00Z"
remediation = "升级 HP OpenView Network Node Manager 至 6.1 Patch 1 或更高版本，该补丁修复了 OVALARMSRV 服务（端口 2345）中的缓冲区溢出漏洞。如无法立即升级，在防火墙上阻止对 TCP 端口 2345 的入站访问，并限制仅允许受信任的管理主机连接该服务。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "HP OpenView Network Node Manager 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:51:59Z"

