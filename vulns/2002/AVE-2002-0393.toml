[basic]
description = "shadow-utils 20000902 版本的补丁导致 useradd 命令在创建用户邮箱存储文件时，将文件权限设置为 660（属主和同组用户均可读写），而非更安全的权限模式。本地攻击者只需与目标用户处于同一用户组，即可读取或修改该用户的 incoming 邮件，导致敏感信息泄露或邮件内容被篡改。该漏洞影响 RedHat 等使用 shadow-utils 的 Linux 发行版，CVSS 评分 3.6，危害等级低，利用条件要求攻击者已拥有本地账户且与目标用户同组。"
published = "2003-03-03T05:00:00Z"
remediation = "立即升级 shadow-utils 到修复版本。Red Hat 用户安装 RHSA-2003:057/RHSA-2003:058 提供的更新包，Mandrake 用户安装 MDKSA-2003:026 更新。如无法升级，手动将 /var/spool/mail 目录下新建用户的邮箱文件权限改为 600（仅所有者可读写），或在 useradd 后通过脚本执行 chmod 600 /var/spool/mail/$USER 修正权限。"
score = 3.6
severity = "LOW"
sources = ["redhat"]
title = "RedHat shadow-utils useradd 邮箱存储文件权限设置漏洞"
updated = "2026-06-16T21:59:27Z"

