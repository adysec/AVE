[basic]
description = "xpdf PDF 查看器 0.91 及之前版本存在符号链接攻击漏洞，本地用户可通过创建恶意符号链接欺骗 xpdf 写入任意文件，导致任意文件覆盖。该漏洞源于 xpdf 在处理临时文件时未正确验证符号链接，本地攻击者可利用竞争条件将符号链接指向敏感系统文件，导致任意文件覆盖，影响机密性、完整性和可用性（CVSS 7.2，CVSS:AV:L/AC:L/Au:N/C:C/I:C/A:C）。攻击者需具备本地访问权限，通过构造恶意符号链接诱导 xpdf 写入关键系统文件实现权限提升或破坏系统。受影响版本为 xpdf 0.91 之前版本，升级至 0.91 或更高版本可修复该漏洞。"
published = "2000-10-20T04:00:00Z"
remediation = "立即将 xpdf 升级至 0.91 或以上版本以修复 symlink 任意文件写入漏洞；升级前可临时限制对 xpdf 的本地执行权限作为缓解措施"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Xpdf xpdf 任意文件写入漏洞"
updated = "2026-06-16T21:52:21Z"

