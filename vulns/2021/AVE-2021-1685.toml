[basic]
description = "该漏洞为整数溢出类型（CWE-190），源于 Apple 系统在处理恶意构造的网页内容时输入验证不足。攻击者可通过诱骗用户使用 Safari 浏览器访问包含恶意代码的网页，在 iOS 15.2 之前、iPadOS 15.2 之前、macOS Monterey 12.1 之前、tvOS 15.2 之前及 watchOS 8.3 之前的设备上触发整数溢出，进而实现任意代码执行，完全控制受影响设备。Apple 已在 iOS 15.2、iPadOS 15.2、macOS Monterey 12.1、Safari 15.2、tvOS 15.2 和 watchOS 8.3 中修复此问题。"
published = "2021-08-24T19:15:21Z"
remediation = '升级到 iOS 15.2、iPadOS 15.2、macOS Monterey 12.1、Safari 15.2、tvOS 15.2 或 watchOS 8.3 及更高版本。前往"设置"→"通用"→"软件更新"安装系统更新，或在 Safari 中通过"偏好设置"→"通用"→"软件更新"升级 Safari。如无法立即更新，请避免点击未知链接或打开不可信的网页内容，临时缓解攻击风险。'
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Apple iOS 和 iPadOS 整数溢出远程代码执行漏洞"
updated = "2026-06-17T03:51:12Z"

