[basic]
description = "WordPress Nevma Adaptive Images 插件 0.6.67 之前版本中存在任意文件删除漏洞。该插件通过 adaptive-images-script.php 处理图片请求时，未对 $_REQUEST['adaptive-images-settings'] 参数进行充分过滤，允许未经身份认证的远程攻击者通过 HTTP GET 请求直接覆盖插件内部配置变量。攻击者可利用该漏洞控制 source_file、cache_dir、request_uri 等参数，结合插件缓存清理机制构造恶意路径，实现删除服务器上任意文件（如 wp-config.php），进而结合本地文件包含（LFI）漏洞实现远程代码执行。CVSS 评分 7.5，危害等级高，攻击复杂度低，无需用户交互。"
published = "2019-07-21T18:15:11Z"
remediation = "立即将 WordPress 插件 Adaptive Images 升级到 0.6.67 或更高版本（当前最新为 0.6.73）。在 WordPress 后台「插件」页面找到 Adaptive Images，点击「更新」即可。如无法立即更新，可临时停用该插件，或删除插件目录下 adaptive-images-script.php 中第 62-65 行对 `$_REQUEST['adaptive-images-settings']` 的全局变量覆盖逻辑，阻止攻击者通过请求参数注入任意配置。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress Nevma Adaptive Images插件任意文件删除漏洞"
updated = "2026-06-17T02:17:56Z"

