[basic]
description = 'Cisco IOS 12.0 至 12.1 版本的 HTTP 服务器存在输入验证缺陷，当处理包含特殊构造的 "?/" 字符串的 URL 请求时，由于未对畸形输入进行正确过滤，导致 HTTP 服务进程崩溃并触发设备重载。本地攻击者可通过向目标路由器或交换机的 HTTP 管理接口发送特制请求实施拒绝服务攻击，造成网络设备中断服务。该漏洞影响 Cisco IOS 12.0 至 12.1 系列版本，CVSS 评分 5.0，危害等级中危。Cisco 已发布安全公告建议用户禁用 HTTP 服务或升级至修复版本。'
published = "2000-12-19T05:00:00.000"
remediation = '升级 Cisco IOS 至 12.1(5) 及以上版本，该漏洞已在后续版本中修复。如无法升级，可在 HTTP 服务器配置中禁用对 "?/" 特殊 URL 的解析，或通过访问控制列表（ACL）限制对 HTTP 管理接口的访问来源 IP。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Cisco IOS HTTP Server 拒绝服务漏洞"
updated = "2026-06-16T21:52:54.663"

