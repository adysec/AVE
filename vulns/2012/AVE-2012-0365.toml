[basic]
description = "WebKit 在 Apple Safari 6.0 之前版本中的拖放事件处理存在安全缺陷，远程攻击者可构造恶意网页诱使用户执行拖放操作。由于浏览器未正确验证拖放数据的来源，同源策略被绕过，攻击者借此可窃取其他域名下的敏感信息。该漏洞影响 Safari 5.x 及更早版本，攻击条件要求用户主动将来自恶意站点的内容拖放到可信页面，属于用户辅助型攻击，利用成功后可能导致跨域数据泄露。"
published = "2012-07-25T19:55:06.007"
remediation = "升级 Safari 至 6.0 或更高版本（需运行 OS X Lion v10.7.4 或更新系统，或安装 Security Update 2012-005）。开启系统自动更新以获取后续安全补丁。如暂无法升级，临时避免在 Safari 中从不可信网站拖放文本内容至其他网页或应用，以降低跨源信息泄露风险。"
score = 5.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari 拖放事件跨域安全策略绕过漏洞"
updated = "2026-06-16T23:43:44.470"

