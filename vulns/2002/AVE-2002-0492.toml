[basic]
description = "Geeklog 1.3.5 及更早版本存在多处跨站脚本（XSS）漏洞。远程攻击者无需身份认证即可通过以下三个入口注入恶意脚本：日历事件链接字段中的 url 变量、index.php 中的 topic 参数、comment.php 中的 title 参数。当管理员或其他用户访问被注入恶意脚本的页面时，脚本将在浏览器中执行，可能导致敏感信息泄露、会话劫持或钓鱼攻击。攻击者只需构造特制的 HTTP 请求即可触发，攻击复杂度低。"
published = "2002-10-04T04:00:00Z"
remediation = '建议立即升级 Geeklog 至 1.3.6 或更高版本，该版本已修复 calendar event 的 url 参数、index.php 的 topic 参数及 comment.php 的 title 参数的 XSS 过滤缺陷。如无法升级，需在应用层对所有用户输入进行 HTML 实体编码（如将 `<` `>` `"` `&` 转义），并设置 Content-Security-Policy 头限制脚本执行。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Geeklog 1.3.5 跨站脚本漏洞"
updated = "2026-06-16T21:58:28Z"

