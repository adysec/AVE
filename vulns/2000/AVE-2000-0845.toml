[basic]
description = "标签之间。<value>BSD及Linux系统中的行式打印机守护进程(lpd)存在权限提升漏洞。该漏洞源于lpd在调用sendmail发送打印作业通知时，未对命令行参数进行有效验证。本地低权限用户可通过构造特殊参数（例如使用-C选项指定恶意配置文件）使sendmail以root权限执行任意命令。此漏洞影响多个Linux和BSD发行版，攻击者只需具备本地登录权限即可利用，成功利用后可完全控制系统root账户，造成严重的安全风险。CVSS评分为10.0，危害等级为严重。"
published = "2000-01-08T05:00:00.000"
remediation = "建议立即升级 lpr 包至已修复版本：Red Hat Linux 用户安装 RHSA-2000-002 提供的更新包；Debian 用户升级至 lpr 0.48 或更高版本；SGI 用户应用 20021104-01-P 补丁。如无法升级，可移除 lpd setuid 权限（chmod u-s /usr/bin/lpr）并限制本地用户对 sendmail 的调用，作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "BSD/Linux lpr 本地权限提升漏洞"
updated = "2026-06-16T21:53:24.513"

