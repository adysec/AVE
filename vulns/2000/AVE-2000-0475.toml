[basic]
description = "LeafDigital LeafChat 1.7 IRC 客户端存在拒绝服务漏洞，远程 IRC 服务器可通过快速发送大量错误消息导致客户端崩溃或无法响应。攻击者只需控制或伪造 IRC 服务器即可触发该漏洞，无需身份认证。该漏洞影响 LeafChat 1.7 版本，CVSS 评分 5.0，危害等级中危。受影响的用户应升级到更高版本或限制 IRC 服务器连接来源。"
published = "2000-06-25T04:00:00Z"
remediation = "升级到 leafChat 2.0 或更高版本（最新版为 v2.5），该漏洞已在后续版本中修复。如无法升级，可在 IRC 客户端设置中限制错误消息显示频率，或通过防火墙仅允许连接可信 IRC 服务器以降低攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "LeafDigital LeafChat 1.7 拒绝服务漏洞"
updated = "2026-06-16T21:52:05Z"

