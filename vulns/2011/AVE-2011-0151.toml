[basic]
description = "Google Chrome 14.0.835.163 之前版本在处理表格样式时存在释放后使用漏洞，攻击者可通过构造包含恶意表格样式的网页，诱导用户访问触发释放后使用内存错误，导致浏览器崩溃拒绝服务，甚至可能执行任意代码。该漏洞影响 Google Chrome 14.0.835.163 之前所有版本，CVSS 评分 7.5（高危），攻击向量为网络、攻击复杂度低、无需认证、可造成部分机密性/完整性/可用性影响。Google 已在 Chrome 14.0.835.163 版本中修复此漏洞，用户升级至该版本或更高版本即可修复。"
published = "2011-09-19T12:02:56Z"
remediation = "建议立即升级 Google Chrome 至 14.0.835.163 或更高版本（当前版本已远超该版本，建议直接升级至最新稳定版）。如无法立即升级，可暂时禁用 JavaScript 或使用浏览器扩展禁用表格样式渲染作为临时缓解措施，并避免访问不可信网站。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome 释放后使用漏洞"
updated = "2026-06-16T23:32:08Z"

