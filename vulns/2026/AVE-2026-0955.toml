[basic]
description = "Trend Micro Apex One 和 Symantec Endpoint Protection (SEP) 代理存在来源验证漏洞（CWE-346），攻击者通过绕过对用户输入或外部数据来源的完整性校验，可在已安装受影响代理的系统上实现本地权限提升。该漏洞影响 Apex One 及 SEP agent 的多个版本，CVSS 评分为 7.8（高危），攻击向量为本地（AV:L），攻击复杂度低（AC:L），所需权限为低权限（PR:L），无需用户交互（UI:N）。利用条件要求攻击者首先获得在目标系统上执行低权限代码的能力（例如通过已登录的本地会话或已控终端），随后即可利用该来源验证缺陷绕过安全机制，将权限提升至高权限级别，从而完全控制受影响系统。Trend Micro 已在 2026 年 5 月发布安全公告并修复该漏洞，建议受影响用户及时升级至最新版本。"
published = "2026-05-21T14:16:45Z"
remediation = "将 Apex One（本地部署版）升级至 SP1 CP Build 18012（已有 SP1 用户）或 SP1 Build 17079（全新安装），并将 Security Agent 升级至至少 14.0.0.17079；将 Apex One as a Service 或 Vision One Standard Endpoint Protection (SEP) 的 Security Agent 升级至 build 14.0.20731。如暂时无法升级，可限制对关键系统的远程访问权限并收紧本地账户权限，降低低权限代码执行风险。升级完成后重启 Apex One NT Listener 服务使修复生效。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Trend Micro Apex One/SEP 权限提升漏洞"
updated = "2026-07-23T16:10:00Z"

