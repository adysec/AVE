[basic]
description = "Citrix NetScaler SD-WAN 设备中的 Session ID Cookie 输入验证存在严重漏洞，该设备支持在 9.1.2.26.561201 及更早版本上运行。攻击者无需任何身份验证即可远程向目标系统发送包含恶意 cookie 的 HTTP 请求，该 cookie 名称为 CGISESSID（CloudBridge 设备上则为 CAKEPHP）。由于系统未能对 cookie 的输入进行适当验证和清理，攻击者可以嵌入恶意命令的会话标识符，服务器在处理这些 cookie 时会直接将其传送到操作系统 shell 中执行解析，导致攻击者在设备上获得 root 权限并执行任意 shell 命令，从而完全控制目标设备。该漏洞的 CVSS 评分高达 9.8，评级为严重（CRITICAL），攻击向量为网络远程攻击，攻击复杂度低，无需用户交互即可利用，且对保密性、完整性和可用性都造成了严重影响。尽管微软和Citrix已发布了安全补丁，但许多部署了旧版本设备的用户仍可能面临风险，攻击者可以利用这些遗留设备发动进一步的网络攻击或将其作为跳板渗透到内部网络。2023年，当局已将该漏洞列入已知被利用的漏洞目录（KEV），表明其已被广泛利用在现实攻击中，安全管理员应立即对受影响设备进行紧急更新，以确保设备运行在最新版本，以消除此危险的 session cookie 处理漏洞带来的安全隐患。"
published = "2017-07-20T04:29:00.423"
remediation = "立即升级 NetScaler SD-WAN 至 9.2 及以上版本，或 CloudBridge 至对应修复版本（参考 Citrix 安全公告 CTX225990）。如无法立即升级，在管理界面所在网络边界配置防火墙规则，限制仅可信 IP 访问管理端口（默认 443），并监控针对 /login 路径的异常 CGISESSID/CAKEPHP Cookie 请求。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Citrix NetScaler SD-WAN 命令注入漏洞"
updated = "2026-06-17T01:22:08.357"

