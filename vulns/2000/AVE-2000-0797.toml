[basic]
description = "BSDi 3.0/4.0 中的 rcvtty 工具在执行脚本前未正确降级权限，本地攻击者可利用此缺陷，在命令行中指定一个特制的木马脚本，使该脚本以提升的权限运行，从而获取系统高级访问权限。该漏洞影响 BSDi 3.0 和 BSDi 4.0 所有版本，CVSS 评分为 7.2，属于高危级别的本地权限提升漏洞。攻击者需具备目标系统的本地账户访问权限才能触发该漏洞。"
published = "2001-01-09T05:00:00.000"
remediation = "立即升级 BSDi 操作系统至 4.1 或更高版本，该版本已修复 rcvtty 未正确降权的问题。如无法立即升级，可临时移除 /usr/contrib/mh/lib/rcvtty 的 setgid 权限（chmod g-s /usr/contrib/mh/lib/rcvtty），并限制该文件仅 root 可执行，以阻止本地用户利用该漏洞提升权限至 tty 组。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "BSDi BSD 3.0/4.0 rcvtty[mh] 本地权限提升漏洞"
updated = "2026-06-16T21:53:09.207"

