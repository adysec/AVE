[basic]
description = "GIMP 图像处理软件在解析 TIF 文件时存在整数溢出漏洞，由于程序未对用户提供的文件数据进行充分验证，导致在分配内存缓冲区前发生整数溢出。远程攻击者可诱导用户访问恶意网页或打开特制的 TIF 文件触发该漏洞，成功利用可在当前进程上下文中执行任意代码，完全控制受影响的系统。该漏洞 CVSS 评分 7.8，危害等级高，影响所有使用受影响版本的 GIMP 用户。GIMP 官方已通过提交 ad32d22 在 GitLab 仓库中修复此漏洞。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级 GIMP 至包含 commit ad32d22c 的版本（预计 3.2.5+），或手动应用该补丁到 file-tiff-load.c 中 load_contiguous 和 load_separate 函数，将 g_malloc 替换为 g_try_malloc 并添加整数溢出检查。临时缓解措施：不要打开来源不明的 TIF 文件。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "GIMP TIF文件解析整数溢出远程代码执行漏洞"
updated = "2026-01-01T00:00:00Z"

