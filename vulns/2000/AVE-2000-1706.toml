[basic]
description = "GNU CFEngine 1.6.0a11 之前版本中的 cfd 守护进程存在格式化字符串漏洞，远程攻击者无需身份认证即可通过向 CAUTH 命令发送特制的格式化字符，利用该漏洞执行任意命令。该漏洞影响范围广泛，CVSS 评分 10.0，可导致目标系统机密性、完整性和可用性完全丧失，危害等级为严重。"
published = "2000-12-19T05:00:00.000"
remediation = "立即升级 GNU CFEngine 至 1.6.0a11 或更高版本。Mandrake Linux 用户应安装 MDKSA-2000-061 安全更新；NetBSD 用户应应用 SA2000-013 公告中的补丁。由于该漏洞允许远程攻击者通过 CAUTH 命令中的格式化字符串执行任意代码，且 CVSS 10.0 为最高严重等级，建议在无法立即升级时，在网络层面限制对 cfd 守护进程（默认端口 5308）的访问，仅允许可信主机连接。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "GNU CFEngine cfd守护进程格式化字符串远程代码执行漏洞"
updated = "2026-06-16T21:52:49.857"

