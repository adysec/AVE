[basic]
description = "Linux 内核在启动阶段通过 efi_mokvar_table_init() 函数处理 UEFI 固件提供的 MOKvar（Machine Owner Key variable）配置表时，存在映射逻辑缺陷。该函数在遍历表条目以确定表大小的循环中，每次迭代都将整个 mokvar 表重新映射到内存。由于内核 early_ioremap() 机制对早期内存映射存在大小限制，当 mokvar 表增长至超过一定尺寸时，映射操作将失败并触发内核警告及栈回溯，导致系统启动过程中出现不可预期的行为。该漏洞影响使用 UEFI 启动并启用 Secure Boot 相关功能的 Linux 内核版本。攻击条件方面，该漏洞需要本地低权限访问权限，攻击者可在系统启动阶段通过使 mokvar 表异常膨胀来触发映射失败，进而引发系统拒绝服务，影响系统可用性。"
published = "2025-03-27T15:15:54Z"
remediation = "建议将 Linux 内核升级至已修复的稳定版本：5.10.x 系列升级至 5.10.235 或更高版本，6.6.x 系列升级至 6.6.83 或更高版本，6.12.x 系列升级至 6.12.18 或更高版本，6.13.x 系列升级至 6.13.6 或更高版本。可通过发行版官方包管理器执行内核更新（如 Debian/Ubuntu 使用 apt install linux-image-<version>，RHEL/CentOS 使用 yum update kernel），更新后重启系统以加载新内核。如短期内无法升级，可在 UEFI 启动配置中禁用 MOK（Machine Owner Key）变量加载作为临时缓解措施，但此操作会影响安全启动的密钥管理功能，需在测试环境中验证后再实施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel EFI MOKvar 表映射拒绝服务漏洞"
updated = "2026-06-17T08:44:30Z"

