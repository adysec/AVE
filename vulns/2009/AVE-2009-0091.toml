[basic]
description = "Apple iPhone OS 3.1 之前版本的 Telephony 组件在处理 SMS 到达通知时存在空指针解引用漏洞。远程攻击者无需认证即可向目标设备发送特制的恶意 SMS 消息触发该漏洞，导致设备电话服务中断或系统崩溃，造成拒绝服务。该漏洞影响所有运行 iOS 3.1 以下版本的 iPhone 和 iPod touch 设备。"
published = "2009-09-10T21:30:01Z"
remediation = "升级到 iPhone OS 3.1 或更高版本，可通过 iTunes 连接设备后选择「检查更新」进行系统升级。如暂无法立即升级，建议在「设置」>「信息」中关闭 iMessage 或短信通知，或启用「仅限通讯录」接收模式，以阻止陌生号码发送的特制 SMS 消息触发空指针解引用，作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["tenable"]
title = "Apple iPhone OS 拒绝服务漏洞"
updated = "2026-06-16T23:10:16Z"

