[basic]
description = "Windows 后台智能传输服务（BITS）存在权限提升漏洞，由于该服务在处理符号链接时未正确验证路径，导致攻击者可以利用符号链接劫持机制实现权限提升。本地攻击者通过诱使用户打开特制文件或访问恶意网站触发 BITS 操作，即可在目标系统上以 SYSTEM 权限执行任意代码，实现从低权限用户到系统最高权限的提权。该漏洞影响 Windows 7 至 Windows 10 及 Windows Server 2008 至 2019 等多个版本，CVSS 评分 7.8，危害等级高。Microsoft 已在 2020 年 3 月安全更新中修复此漏洞，建议用户立即安装补丁。"
published = "2020-03-12T16:15:15.203"
remediation = "立即安装 Microsoft 2020 年 3 月安全更新：Windows 10 v1909/v1903 安装 KB4540673，v1809 安装 KB4538461，v1803 安装 KB4540689，v1709 安装 KB4540681，v1607 安装 KB4540688，v1507 安装 KB4540693；Windows 7 SP1/Server 2008 R2 安装 KB4540688（需 ESU）；Windows 8.1/Server 2012 R2 安装 KB4540686。也可通过 Windows Update 自动获取更新。由于该漏洞已遭在野利用且被纳入勒索软件攻击链，建议优先安排补丁部署，无法立即打补丁的终端可限制非管理员用户登录权限作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Background Intelligent Transfer Service 权限提升漏洞"
updated = "2026-06-17T02:46:36.767"

