[info]
author = "ave"
description = "向 Lilikoi Ceilidh 2.60 发送大量 POST 请求，耗尽服务器资源导致拒绝服务。通过发送 POST 请求验证目标是否运行 Ceilidh 服务。"
id = "POC-AVE-2000-0643"
name = "Lilikoi Ceilidh POST请求拒绝服务漏洞 PoC"
severity = "medium"
tags = ["ave-2000-0643"]
vuln_id = [
    "CVE-2000-0555",
    "AVE-2000-0643",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/ceilidh"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Ceilidh",
    "ceilidh",
]
