[basic]
description = "tags.<value>Yealink Device Management（亿联设备管理系统）3.6.0.20 版本在 /sm/api/v1/firewall/zone/services 接口中对用户提交的命令参数缺少必要的特殊元素转义处理，构成命令注入漏洞（CWE-78）。未经身份认证的远程攻击者无需任何凭据即可向该接口发送特制的 HTTP 请求，在目标系统上以 root 最高权限执行任意系统命令，从而完全接管设备、读取或篡改敏感配置，并可作为跳板发起进一步内网攻击。该漏洞可利用条件简单（网络可达即可、无需认证、无需高复杂度交互），CVSS 3.1 评分高达 9.8（AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H），危害等级为严重，受影响用户应尽快升级到修复版本并限制管理接口的对外暴露。"
published = "2021-10-15T18:15:07Z"
remediation = "建议将 Yealink DM 升级到厂商官方修复版本 3.6.0.30 或更高版本（从 Yealink 官网下载安装包并更新 release note 确认）。升级前请先将 DM 管理端口（默认 443/tcp，nginx 对外服务）以及 smserver 服务端口 9600/tcp 通过防火墙/WAF 仅授权给可信任的管理网段，禁止暴露于公网；同时在接入层限制对 /premise/front/getPingData、/sm/api/v1/firewall/zone/services 等路径的访问并设置强访问控制，防止未授权攻击者通过 SSRF 链式利用该命令注入漏洞以 root 权限执行任意命令。请同步核查服务器是否已被入侵，检查进程与敏感文件，必要时重装系统。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Yealink 设备管理（Device Management）命令注入漏洞"
updated = "2026-06-17T03:45:08Z"

