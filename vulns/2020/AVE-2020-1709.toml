[basic]
description = "CVE-2020-7247是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2020-01-29T16:15:12Z"
remediation = "升级 OpenSMTPD 至 6.6.2 或更高版本，以修复 smtp_mailaddr 函数中输入验证逻辑缺陷。如无法立即升级，应在防火墙或访问控制层面限制 SMTP 服务的访问来源，仅允许可信 IP 连接，并审查 /etc/mail/smtpd.conf 默认配置，删除或注释掉不必要的未授权访问规则，同时启用 SMTP 会话日志监控异常 MAIL FROM 命令。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "OpenBSD OpenSMTPD 远程代码执行漏洞"
