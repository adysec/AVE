[basic]
description = "Becky! Internet Mail 客户端 1.26.03 及更早版本存在缓冲区溢出漏洞，当用户回复包含超长 Content-type MIME 头的恶意邮件时，远程攻击者可利用该漏洞触发缓冲区溢出，导致目标邮件客户端崩溃，造成拒绝服务。攻击者无需身份认证，只需构造特制邮件并诱导用户回复即可触发。该漏洞影响 Becky! Internet Mail 1.26.03 及之前版本，CVSS 评分 5.0，危害等级中等。"
published = "2000-10-20T04:00:00.000"
remediation = "立即升级 Becky! Internet Mail 至 1.26.04 或更高版本，该版本已修复 Content-type MIME 头处理中的缓冲区溢出问题。如无法升级，建议在邮件网关或客户端中配置过滤规则，拦截含有超长 Content-type 字段的邮件，并避免直接回复来源不可信的邮件。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Becky! Internet Mail 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:22.417"

