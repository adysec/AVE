[basic]
description = "Hosting Controller 1.4 的 imp_rootdir.asp 页面存在命令执行漏洞，远程攻击者无需身份认证即可通过直接向 imp_rootdir.asp 发送特制 HTTP 请求，修改 ftp、owwwPath、oftpPath 等参数，从而复制或删除服务器上的任意文件及目录。该漏洞影响 Hosting Controller 1.4 版本，CVSS 评分 10.0，危害等级严重，攻击复杂度低，可导致服务器完全受控。"
published = "2002-08-12T04:00:00Z"
remediation = "立即删除或重命名 imp_rootdir.asp 文件，或限制该文件的访问权限（如设置 NTFS 权限仅允许管理员访问）。升级到 Hosting Controller 最新版本（如 2.0 以上），并在 IIS 中配置 URL 授权规则，阻止对 imp_rootdir.asp 的匿名访问。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Hosting Controller 1.4 导入根目录命令执行漏洞"
updated = "2026-06-16T21:58:06Z"

