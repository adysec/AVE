[basic]
description = "CGI Script Center News Update 1.1 在管理员密码修改功能中存在身份验证绕过漏洞。该软件未对原始管理员密码进行有效验证，导致远程攻击者无需知道当前密码即可直接修改管理员密码。攻击者只需向目标系统发送特制的密码修改请求，即可完全接管系统管理权限。该漏洞影响范围广泛，利用门槛极低，无需任何身份认证即可远程触发，危害严重。ExploitDB 已公开该漏洞的利用代码（ID: 179）。"
published = "2000-12-19T05:00:00.000"
remediation = "立即停止使用 CGI Script Center News Update 1.1，替换为受支持的内容管理系统（如 WordPress、Drupal 等）。如无法立即替换，在 Web 服务器（Apache）中通过 .htaccess 或 httpd.conf 对 /cgi-bin/newsup.pl 路径添加 IP 白名单和 HTTP 基本认证，限制仅授权管理员可访问密码修改功能；同时移除 newsup.pl 的 setuid/setgid 权限，确保 CGI 目录权限为 755 且属主为非 root 用户。"
score = 9.8
severity = "CRITICAL"
sources = ["avd"]
title = "CGI Script Center News Update 管理员密码修改漏洞"
updated = "2026-06-16T21:52:49.477"

