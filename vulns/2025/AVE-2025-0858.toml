description = """
` 标签中。

描述结构：
- 开头：说明 Microsoft Account 存在授权缺失漏洞（CWE-862）
- 原理：服务端对权限检查不完整
- 影响范围：Microsoft Account 服务
- 攻击条件：未经身份认证的远程攻击者，无需用户交互，攻击复杂度低，通过网络发送特制请求即可提升权限
- 结果：可获取比预期更高的权限级别，访问敏感信息或执行未授权操作

让我写一个流畅的中文描述：

Microsoft Account 服务存在授权缺失漏洞（CWE-862），由于服务端对用户权限检查不完整，未经身份认证的远程攻击者无需任何凭据即可通过网络向 Microsoft Account 服务发送特制网络请求，绕过权限校验实现特权提升。该漏洞影响 Microsoft Account 所有版本，攻击复杂度低且无需用户交互，成功利用可导致攻击者获取比预期更高的权限级别，进而访问敏感信息或执行未授权操作。

检查一下字数：大约130字，符合≥50字要求。
