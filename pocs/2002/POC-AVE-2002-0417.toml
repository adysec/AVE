[info]
author = "AVE"
description = "部署 CGI 脚本向 stderr 写入 4075 字节数据触发 Apache 2.0.39/2.0.40 mod_cgi 读写死锁，验证服务是否因死锁导致挂起"
id = "POC-AVE-2002-0417"
name = "Apache HTTP Server mod_cgi 拒绝服务漏洞 PoC"
severity = "high"
tags = [
    "cve-2002-1850",
    "apache",
    "dos",
    "mod_cgi",
]
vuln_id = [
    "CVE-2002-1850",
    "AVE-2002-0417",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi-bin/stderr_dos.cgi"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["hello world"]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
