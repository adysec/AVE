[basic]
description = "Linux 内核 2.4 系列在 execve 系统调用处理过程中，fs/proc/base.c 里 env_start 和 env_end 指针的初始化存在竞争条件。攻击者可在多个进程并发执行 execve 时，通过精确的时间差竞争在指针初始化完成前访问/proc 文件系统，从而读取 SUID 可执行文件内容，也可能导致系统崩溃（拒绝服务）。该漏洞仅影响本地已登录用户，利用难度较高（需竞态条件触发），CVSS v3 评分 1.2，危害等级低。Red Hat 将其评为重要级别，ExploitDB 及多个 GitHub 仓库已公开 PoC 利用代码。"
published = "2003-08-27T04:00:00Z"
remediation = "建议将 Linux 内核升级至 2.4.21 或更高版本。如果无法立即升级内核，可以通过限制普通用户执行具有 SUID 权限的敏感可执行文件，或在系统层面禁用不必要的 SUID 程序来缓解本地攻击风险。"
score = 1.2
severity = "LOW"
sources = ["redhat"]
title = "Linux 内核 2.4 execve() 系统调用竞争条件漏洞"
updated = "2026-06-16T22:02:14Z"

