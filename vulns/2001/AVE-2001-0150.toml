[basic]
description = "Ikonboard 2.1.7b 及更早版本的 help.cgi 脚本中存在目录遍历漏洞，未经身份认证的远程攻击者可在 helpon 参数中构造 ..（点号）路径穿越序列，读取服务器上的任意敏感文件（如配置文件、密码文件等）。该漏洞影响运行 Ikonboard 2.1.7b 及以下版本的网站，攻击者无需任何认证凭据即可通过网络远程利用，攻击复杂度低、成功率高，可导致服务器敏感信息泄露。根据 CVSS v2 评分 5.0，危害等级为中等，建议将 Ikonboard 升级至修复该漏洞的安全版本。"
published = "2001-06-27T04:00:00Z"
remediation = '建议立即升级到 IkonBoard 2.1.8 或更高版本（官方已修复该目录遍历漏洞）。若无法升级，可通过以下方式缓解：1) 编辑 help.cgi，在处理 helpon 参数前增加输入验证：移除空字节（\0）、过滤 ../ 路径遍历序列、限制文件扩展名为 .dat；2) 若不使用帮助功能，直接删除或重命名 help.cgi 禁用该脚本；3) 在 Web 应用防火墙（WAF）层面添加规则拦截包含 ../ 或 %00 的 helpon 参数请求；4) 确保 Web 服务器进程以最小权限运行，限制其可读文件范围。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "IkonBoard 目录遍历远程文件泄露漏洞"
updated = "2026-06-16T21:54:09Z"

