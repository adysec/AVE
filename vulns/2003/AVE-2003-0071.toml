[basic]
description = "ypserv NIS 服务器 2.7 之前版本存在拒绝服务漏洞，远程攻击者可通过向服务器发送一个不响应的 TCP 客户端请求，导致 ypserv 进程阻塞，从而造成服务不可用。该漏洞影响运行 ypserv NIS 服务的系统，攻击者无需身份认证即可通过网络触发，属于低复杂度攻击。建议升级至 ypserv 2.7 或更高版本以修复此漏洞。"
published = "2003-07-24T04:00:00.000"
remediation = "将 ypserv NIS 服务器升级至 2.7 或更高版本。Red Hat 用户安装 RHSA-2003-173 或 RHSA-2003-201 提供的更新包；Mandriva 用户安装 MDKSA-2003:072 更新；TurboLinux 用户安装 TLSA-2003-43 更新。如无法立即升级，可在防火墙上限制对 ypserv 端口（TCP/UDP 111 及 32770-32890）的访问，仅允许受信任的 NIS 客户端连接。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "ypserv NIS Server 拒绝服务漏洞"
updated = "2026-06-16T22:01:50.220"

