[info]
author = "ave"
description = "验证 Apple iTunes 10.6 及之前版本中 WebKit 引擎的内存破坏漏洞。攻击者通过构造包含恶意 JavaScript 的网页，诱导用户访问后触发内存越界写入，导致任意代码执行或浏览器崩溃。该漏洞利用需用户交互，目标系统需运行受影响版本的 iTunes。"
id = "POC-AVE-2012-0349"
name = "CVE-2012-3673 PoC"
severity = "medium"
tags = ["ave-2012-0349"]
vuln_id = [
    "CVE-2012-3673",
    "AVE-2012-0349",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "status"
status = [200]
type = "status"
