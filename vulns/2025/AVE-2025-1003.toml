[basic]
description = "标签之间。<value>Linux内核IOMMU VT-d子系统的domain_remove_dev_pasid()函数存在空指针解引用漏洞。当该函数无法找到指定的设备地址空间标识符（pasid）时，代码仅触发WARN_ON_ONCE警告，但随后仍尝试使用返回的NULL指针，导致内核空指针异常。该漏洞影响启用Intel VT-d I/O虚拟化技术的Linux系统，攻击者需要具备本地低权限访问权限，可通过构造特定的设备PasID移除操作序列触发该漏洞，造成系统崩溃或潜在的权限提升，严重影响系统可用性与安全稳定性。"
published = "2025-03-06T17:15:23Z"
remediation = "建议立即升级 Linux 内核至修复版本：主流稳定版请升级到 6.12.57 或 6.13.3 及以上版本；Debian 12 (bookworm) 用户请安装 6.1.176-1 或更高版本内核包；Ubuntu 24.04 LTS 用户请安装 6.8.0-106.106 或更高版本内核包。如运行 Ubuntu 22.04 LTS 且使用 AWS 优化内核，请升级到 6.8.0-1050.53~22.04.1；若使用 Azure 优化内核，请升级到 6.8.0-1051.57。临时缓解措施：通过启动参数 `intel_iommu=off` 禁用 VT-d IOMMU（仅适用于确认不需要 IOMMU 的场景，会导致设备透传功能失效）。升级后需重启系统并验证当前运行内核版本是否已包含 commit 60f030f7418d3f1d94f2fb207fe3080e1844630b 的修复。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 IOMMU VT-d 空指针解引用漏洞"
updated = "2026-06-17T08:44:24Z"

