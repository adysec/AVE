[basic]
description = "Apache HTTP Server 1.3.x 至 1.3.24 及 2.0.x 至 2.0.36 版本在处理分块编码（chunked encoding）HTTP 请求时存在整数溢出漏洞。由于服务器对分块数据块大小字段的计算存在错误，远程攻击者无需身份认证即可通过向目标服务器发送特制的分块编码 HTTP 请求触发该漏洞，导致服务器使用错误的内存大小进行数据读写，进而造成拒绝服务（如进程崩溃）或任意代码执行。该漏洞影响范围广泛，且已有 Metasploit 框架集成利用模块，攻击者可远程利用，危害严重。"
published = "2002-07-03T04:00:00.000"
remediation = "建议立即将 Apache HTTP Server 升级至修复版本：1.3.x 系列升级至 1.3.26 或更高版本，2.0.x 系列升级至 2.0.37 或更高版本。由于 1.3.x 和 2.0.x 均已停止维护，强烈建议迁移至当前受支持的 Apache 2.4.x 最新稳定版（如 2.4.62+）。若无法立即升级，可在反向代理或 WAF 层面配置规则，过滤 Transfer-Encoding: chunked 请求头中畸形的分块大小值，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Apache HTTP Server Chunked 编码远程代码执行漏洞"
updated = "2026-06-16T21:57:21.037"

