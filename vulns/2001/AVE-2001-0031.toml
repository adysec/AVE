[basic]
description = "Technote 2000/2001 的 print.cgi 存在目录遍历漏洞，程序未对 board 参数中的路径进行有效过滤与净化。攻击者可通过在 board 参数中插入 ..（点号）序列，绕过目录限制读取服务器上的任意文件。该漏洞无需身份认证即可远程利用，影响 Technote 2000 和 Technote 2001 版本，CVSS 评分为 5.0，危害等级中等。攻击者发送构造特殊的 HTTP 请求即可触发文件泄露，可能导致敏感配置文件、源代码等被非法获取。"
published = "2001-02-12T05:00:00.000"
remediation = "升级到 Technote 最新版本以获取修复补丁；若无可用补丁，在 print.cgi 中对 board 参数进行输入校验，过滤或拒绝包含 ../ 的请求路径；将 Web 服务器进程的文件访问权限限制为最小必要范围，避免以 root 权限运行；并在 Web 服务器层配置规则，拦截对 print.cgi 的异常路径请求。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Technote print.cgi 目录遍历文件泄露漏洞"
updated = "2026-06-16T21:53:36.450"

