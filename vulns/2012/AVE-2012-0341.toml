[basic]
description = "tags.<value>Apple Safari 使用的 WebKit 引擎存在内存破坏漏洞，远程攻击者可通过构造恶意网页触发该漏洞，在用户浏览器中执行任意代码或导致拒绝服务（内存损坏与应用崩溃）。该漏洞影响 Safari 6.0 之前的所有版本，攻击无需身份认证，用户仅需访问恶意网站即可被利用。CVSS 评分 9.3，危害等级严重。"
published = "2012-07-25T20:55:04.227"
remediation = "立即将 Apple Safari 升级至 6.0 或更高版本。macOS 用户需升级至 OS X Mountain Lion 10.8，iOS 设备需升级至 iOS 6。升级后重启浏览器以确保 WebKit 内存处理机制已更新，阻止攻击者通过构造恶意网页触发内存破坏漏洞。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:41.333"

