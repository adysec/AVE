[basic]
description = "Mailman 2.0beta3 和 2.0beta4 版本中的 wrapper 程序未能正确过滤不受信任的格式化字符串，存在格式化字符串漏洞。本地攻击者可通过向 wrapper 程序传递特制的格式化字符串参数触发该漏洞，利用格式化字符串写入任意内存地址，从而获取目标系统的提升权限。该漏洞影响 Mailman 2.0beta3 及 2.0beta4 版本，攻击者需拥有本地访问权限，CVSS 评分 4.6，危害等级中危。"
published = "2000-10-20T04:00:00Z"
remediation = "升级 Mailman 至 2.0 正式版或更高版本（2.0beta3/2.0beta4 的 wrapper 程序存在格式化字符串漏洞）。Red Hat 已发布安全公告 RHSA-2000:030，建议安装对应补丁包。如无法立即升级，可限制本地用户对 mailman wrapper 程序的执行权限作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "GNU Mailman 格式化字符串漏洞导致本地权限提升"
updated = "2026-06-16T21:52:17Z"

