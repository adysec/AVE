[basic]
description = 'Raptor GFX 配置工具中的 pgxconfig 程序在调用系统命令时使用了相对路径来执行 "cp" 程序，而非绝对路径。本地攻击者可通过修改 PATH 环境变量，将恶意程序命名为 "cp" 并置于优先搜索路径中，当 pgxconfig 执行时即可触发任意命令执行。该漏洞影响 Tech-Source Raptor GFX PGX32 2.3.1 版本，攻击者需拥有本地系统访问权限，CVSS 评分 7.2，危害等级高。'
published = "2000-10-20T04:00:00Z"
remediation = "升级 Raptor GFX PGX32 至 2.3.2 及以上版本，该版本已将 pgxconfig 中对 cp 的调用改为绝对路径 /bin/cp。如无法升级，可手动修改 pgxconfig 脚本，将所有系统命令调用改为绝对路径，并确保 PATH 环境变量中不含不可信目录。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Tech-Source Raptor GFX PGX32 配置工具本地任意命令执行漏洞"
updated = "2026-06-16T21:52:16Z"

