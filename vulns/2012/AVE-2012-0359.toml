[basic]
description = "Apple Safari 浏览器所采用的 WebKit 渲染引擎存在多处内存破坏漏洞，影响 Safari 6.0 之前的所有版本。远程攻击者可通过构造恶意网页，向目标用户发送包含特制 Web 内容的链接，当用户使用受影响版本的 Safari 访问该网页时，触发 WebKit 中的内存越界读写，导致应用程序崩溃或远程代码执行。该漏洞影响 macOS 和 iOS 平台上的 Safari 浏览器，攻击条件为攻击者能够诱导用户打开恶意网页链接，无需身份认证即可在目标系统上执行任意代码或造成拒绝服务。Apple 已在 iOS 6.0 和 Safari 6.0 中修复此漏洞。"
published = "2012-07-25T20:55:04.820"
remediation = '将 Apple Safari 浏览器升级至 6.0 或更高版本以修复 WebKit 内存损坏漏洞。Mac 用户可通过"系统偏好设置"中的"软件更新"或 App Store 下载并安装 Safari 6.0 及 OS X Lion v10.7.4 安全更新；iOS 用户需升级至 iOS 6.0 或更高版本。如暂时无法升级，建议暂时使用其他浏览器访问不可信网站，并禁用 Safari 的 JavaScript 执行功能作为临时缓解措施。iOS 设备可通过 iTunes 连接电脑进行系统升级，或直接在设备上进入"设置"→"通用"→"软件更新"完成升级。'
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:43.670"

