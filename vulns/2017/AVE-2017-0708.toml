[basic]
description = "NETGEAR多款路由器（R8500、R8300、R7000、R6400、R7300、R7100LG、R6300v2、WNDR3400v3、WNR3500Lv2、R6250、R6700、R6900、R8000）Web管理界面存在管理员密码信息泄露漏洞。漏洞原理是Web管理服务器在用户取消认证且未启用密码恢复功能时，会重定向到暴露密码恢复令牌的页面。攻击者可通过构造请求访问/passwordrecovered.cgi?id=TOKEN页面，在未启用密码恢复功能时直接获取管理员密码。攻击条件为：远程管理选项开启，或攻击者可访问路由器LAN/WLAN网络。若已启用密码恢复功能则利用失败，且该限制持久化（即使后续禁用恢复功能仍需回答安全问题）。CVSS 3.1评分8.1（HIGH），影响机密性、完整性、可用性均为高影响。ExploitDB已公开PoC（CVE-2017-5521），Nuclei等扫描器已收录检测模板。"
published = "2017-01-17T09:59:00.333"
remediation = '立即升级 NETGEAR 路由器固件至官方发布的修复版本（R8500/R8300/R7000/R6400/R7300/R7100LG/R6300v2/WNDR3400v3/WNR3500Lv2/R6250/R6700/R6900/R8000 均需升级至官方 2017 年 1 月后发布的固件版本）。若暂时无法升级，请立即在路由器管理界面启用"密码恢复"功能并设置安全问题，同时在"远程管理"设置中禁用"启用远程管理"选项，并在防火墙层面限制仅允许可信 LAN/WLAN IP 访问管理端口（默认 80/443/8080）。'
score = 8.1
severity = "HIGH"
sources = ["kev"]
title = "NETGEAR 多款路由器 管理员密码泄露漏洞"
