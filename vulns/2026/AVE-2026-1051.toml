[basic]
description = "Phoenix Contact CHARX SEC-3150 电动汽车充电控制器固件存在操作系统命令注入漏洞（CWE-78）。未经身份认证的远程攻击者在能够控制 OCPP 后端并绕过防火墙限制的前提下，可通过特制请求向设备注入恶意系统命令，以有限用户 charx-oa 身份执行任意操作系统命令，导致充电服务中断。该漏洞影响固件版本低于 1.9.1 的 CHARX SEC-3150，CVSS 评分 8.8，危害等级高。"
published = "2026-07-30T07:16:57.950"
remediation = "立即将受影响的 CHARX SEC-3000、SEC-3050、SEC-3100 及 SEC-3150 充电控制器固件升级至 1.9.1 或更高版本。升级操作：登录设备 Web 管理界面，进入系统维护→固件更新页面，上传 Phoenix Contact 官方发布的 1.9.1 固件包并确认安装，完成后重启设备并验证版本号。若暂无法立即升级，应在网络边界防火墙中限制 OCPP 后端对设备端口的访问，仅放行受信任的充电管理服务器 IP，同时关闭不必要的 Modbus TCP 服务端口以缩小攻击面。Phoenix Contact 已在安全公告 VDE-2026-008 中确认修复固件最迟于 2026 年 8 月 12 日前在官网产品下载页面发布。"
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "Phoenix Contact CHARX SEC 远程命令注入漏洞"
updated = "2026-07-30T14:31:21.447"

