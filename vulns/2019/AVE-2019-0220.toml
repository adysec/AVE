[basic]
description = "WordPress 的 WPGraphQL 插件（版本 0.2.3 及以下）在 registerUser 变更中缺少关键身份验证机制，导致未经身份验证的远程攻击者能够利用 GraphQL API 注册具有管理员权限的新用户账户。该漏洞源于插件在处理用户注册请求时未正确校验调用者权限，只要目标站点开启了新用户注册功能，攻击者即可通过发送特制的 GraphQL 请求直接创建管理员账户，从而完全控制 WordPress 站点。此漏洞影响使用受影响版本 WPGraphQL 插件的所有 WordPress 站点，CVSS v3.0 评分为 9.8，危害等级为严重（CRITICAL）。WPGraphQL 官方已在 0.3.0 版本中修复此问题，用户应尽快升级插件至最新版本，并在升级前检查站点是否存在异常管理员账户。"
published = "2019-06-10T18:29:01Z"
remediation = '立即将 WordPress WPGraphQL 插件升级至 v0.3.0 或更高版本，该版本已修复 registerUser mutation 的访问控制缺陷。如暂时无法升级，请在 WordPress 设置中关闭"允许任何人注册"选项，或通过防火墙/WAF 规则限制对 /graphql 端点的未授权访问，以阻断攻击者利用该漏洞注册管理员账户。'
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress WPGraphQL 访问控制错误漏洞"
updated = "2026-06-17T02:44:46Z"

