[basic]
description = "Windows 系统中的 AppX 部署服务 (AppXSVC) 在处理硬链接时存在漏洞，导致未经授权的低权限用户能够通过精心构造的硬链接欺骗机制提升系统权限。该漏洞影响 Windows 10/11、Windows Server 2019/2022 等多个版本，攻击者无需用户交互即可通过本地访问利用此漏洞，实现对系统关键资源的完全控制。CVSS 评分 7.8，威胁等级为高级，涵盖机密性、完整性和可用性高风险。微软已在 2020 年 8 月累积更新中修复此漏洞，建议用户及时安装安全更新以增强系统安全性。"
published = "2019-07-15T19:15:21Z"
remediation = "立即安装 Microsoft 2019 年 7 月安全更新补丁。Windows 10 版本 1903/1909 安装 KB4507453，Windows 10 旧版本（1809 安装 KB4507469，1803 安装 KB4507466，1709 安装 KB4507455，1703 安装 KB4507456），Windows 7/8.1/服务器系统安装 7 月累计更新 KB4507449 或安全专用更新 KB4507465。可通过 Windows Update 自动检测并安装更新。如无法立即打补丁，可通过组策略禁用 AppX 应用程序部署服务（路径为 Computer Configuration → Administrative Templates → Windows Components → App Package Deployment → DisableAppXDeployment），同时限制非管理员用户执行 PowerShell 脚本权限，并监控 AppXSVC 服务的异常行为。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "微软 Windows 硬链接特权提升漏洞"
updated = "2026-06-17T02:27:53Z"

