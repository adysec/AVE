[basic]
description = "Silicon Graphics IRIX 6.2/6.3/6.4 操作系统中，xfs 文件系统下的 truncate() 函数未能正确验证文件操作权限，导致本地攻击者可通过调用该函数删除系统中任意文件的内容。该漏洞允许已获得本地访问权限的普通用户越权操作，无需额外认证即可破坏关键系统文件或用户数据，严重威胁系统完整性与可用性。CVSS 评分高达 10.0（CRITICAL 级），属于最高危害等级。受影响版本包括 IRIX 6.2、6.3、6.4，建议升级至修复版本或应用 SGI 官方补丁。"
published = "2000-10-20T04:00:00Z"
remediation = "建议升级至 IRIX 6.5.22 或更高版本（含安全补丁 SGI-2000-0011），或安装 SGI 发布的 xfs 文件系统专用补丁（patchID 1000798-01）。若无法升级，可通过挂载参数 `noexec,nosuid,nodev` 限制 xfs 分区权限，并严格控制本地用户账号权限作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Silicon Graphics IRIX xfs truncate() 特权检查漏洞"
updated = "2026-06-16T21:52:30Z"

