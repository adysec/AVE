[basic]
description = "HP-UX 11.0 及 11.11 系统中的 swverify 及其他相关程序存在缓冲区溢出漏洞，本地攻击者可通过向命令行参数传递超长字符串触发缓冲区溢出，从而获取目标系统的 root 权限。该漏洞影响 HP-UX 11.0 和 11.11 版本，攻击者需要拥有本地系统访问权限，无需认证即可利用，CVSS 评分 7.2，危害等级高。Exploit-DB 上已有公开利用代码（EDB-ID: 482），攻击者可通过编译执行该 PoC 实现本地权限提升。"
published = "2001-09-03T04:00:00Z"
remediation = "立即安装 HP 官方安全补丁（参考 HP 安全公告 HPSBUX0201-179），升级 swinstall/swverify 至修复版本。如无法打补丁，可移除 swverify 和 swinstall 的 SUID 位（chmod 755 /usr/sbin/swverify /usr/sbin/swinstall），限制本地普通用户执行这些特权程序。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "HP-UX swverify 缓冲区溢出本地权限提升漏洞"
updated = "2026-06-16T21:55:20Z"

