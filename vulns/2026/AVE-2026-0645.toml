[basic]
description = "Gitea 的 Remember-Me 自动登录令牌验证逻辑存在安全缺陷，当攻击者窃取用户的 Remember-Me 令牌并用于认证时，系统虽能检测到令牌哈希不匹配，但仅删除受害者本地的 Cookie，未从数据库中删除已被攻陷的令牌记录，导致攻击者已建立的活跃会话持续有效且不会被撤销。攻击者可通过窃取令牌绕过身份验证，长期维持对受害者账户的未授权访问。该漏洞影响 Gitea 所有使用 Remember-Me 功能的版本，CVSS 评分 9.8，危害等级严重。官方已发布安全更新修复此问题。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级 Gitea 至 v1.27.0 或更高版本（对应 commit de4b8277e9cb576f2315fb03b5ab6478b42a1d31 和 f69e15afe7496cc62e96dab244629c69eb31a7bf）。如无法立即升级，建议在反向代理层对 `/user/login` 端点添加速率限制，并强制所有用户登出后重新登录以清除已有 Remember-Me 令牌。"
score = 9.8
severity = "CRITICAL"
sources = ["ghsa"]
title = "Gitea Remember-Me令牌验证缺陷导致攻击者会话未失效漏洞"
updated = "2026-01-01T00:00:00Z"

