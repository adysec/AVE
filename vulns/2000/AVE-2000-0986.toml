[basic]
description = "Eudora 邮件客户端在生成虚拟名片（VCF）时，会将发件人主机的绝对路径信息嵌入其中，导致本地文件路径泄露。攻击者无需身份验证即可通过接收特制的 VCF 文件获取目标系统的目录结构信息，为后续攻击提供情报支持。该漏洞影响使用 Eudora 邮件客户端的用户，CVSS 评分为 5.0，危害等级中等。"
published = "2000-11-14T05:00:00.000"
remediation = "由于 Eudora 邮件客户端已于 2006 年停止维护，官方不再发布安全补丁，建议立即停止使用 Eudora，迁移至持续维护的邮件客户端（如 Mozilla Thunderbird、Microsoft Outlook 等）以彻底消除该漏洞。如短期内无法完成迁移，可在 Eudora 中依次点击「Tools→Settings→Mail Addressing」取消勾选「Include my vCard with messages」选项，阻止客户端在邮件中包含含绝对路径的虚拟通行证（VCF）文件，并在后续通信中避免使用包含本地路径信息的邮件签名或 VCF 附件。同时，组织内应通过邮件网关或防火墙策略拦截 .vcf 附件的外发，以降低内部主机路径信息被外部获取的风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Eudora 邮件客户端 VCF 虚拟卡信息泄露漏洞"
updated = "2026-06-16T21:52:38.987"

