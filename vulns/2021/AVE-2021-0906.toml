[basic]
description = "标签之间。<value>Nagios XI 5.7.5版本存在操作系统命令注入漏洞，位于/usr/local/nagiosxi/html/includes/configwizards/cloud-vm/cloud-vm.inc.php文件中。由于该文件对经过身份认证的用户可控输入未进行适当的特殊字符转义和清理，攻击者可通过发送单个特制HTTP请求将恶意命令注入到服务器操作系统中。该漏洞需要攻击者拥有合法账户凭据，利用后可导致服务器被完全控制，执行任意系统命令并获取敏感数据。CVSS评分8.8，危害等级高。"
published = "2021-02-15T13:15:12Z"
remediation = "立即将 Nagios XI 升级到 5.8.0 或更高版本（当前最新稳定版），以修复 /usr/local/nagiosxi/html/includes/configwizards/cloud-vm/cloud-vm.inc.php 中的 OS 命令注入漏洞。如暂无法升级，应在防火墙或反向代理层面限制对 /nagiosxi/config/monitoringwizard.php 的访问，仅允许可信管理 IP 访问，并禁用 cloud-vm 配置向导功能作为临时缓解措施。升级后请验证版本号为 xi-5.8.0 或更高，并检查该文件中的用户输入是否已正确过滤。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Nagios Nagios XI 操作系统命令注入漏洞"
updated = "2026-07-09T13:39:54Z"

