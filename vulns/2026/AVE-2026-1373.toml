[basic]
description = "Flowise 是一款通过拖拽方式构建大语言模型流程的用户界面工具。在 3.1.3 及之前版本中，OAuth2 令牌刷新接口（`POST /api/v1/oauth2-credential/refresh/:credentialId`）被错误地列入 `WHITELIST_URLS` 白名单，导致该接口无需身份验证即可被任意用户访问。攻击者获取到有效的凭证 ID 后，即可直接调用该刷新接口，服务端会解密存储的 OAuth 凭证（包含 clientId、clientSecret 和 refresh_token），向配置的 OAuth 提供商发起刷新请求，并将新获取的 access_token 直接返回在响应体中。攻击者由此可窃取受害者的 OAuth2 访问令牌，进而完全访问受害者在 Google、Microsoft、GitHub 等第三方平台上的关联账户和数据，同时还可通过大量刷新请求耗尽刷新令牌配额实施拒绝服务攻击。"
published = "2026-08-04T20:16:54Z"
remediation = "立即升级 Flowise 至 3.1.3 或更高版本，该版本已从 WHITELIST_URLS 中移除 OAuth2 token refresh 端点并要求身份验证。若无法立即升级，可编辑 packages/server/src/utils/constants.ts，将 /api/v1/oauth2-credential/refresh/:credentialId 从 WHITELIST_URLS 常量中删除，并在 packages/server/src/routes/oauth2/index.ts 的对应路由处理器中添加认证中间件检查，确保仅授权用户可调用该接口。同时建议轮转所有已暴露 OAuth2 凭证的 clientSecret 和 refresh_token，并审查服务日志以确认是否存在未授权访问记录。"
score = 9.2
severity = "CRITICAL"
sources = ["ghsa"]
title = "Flowise OAuth2 令牌刷新端点未授权访问漏洞"
updated = "2026-08-05T20:17:16Z"

