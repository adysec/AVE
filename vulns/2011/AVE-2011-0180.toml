[basic]
description = "Apple iOS 5.1.1 及更早版本的 WebKit 引擎存在使用后释放漏洞，源于在处理 TIFF、PNG、JPEG 图像及 ImageIO 框架时存在多处内存错误。攻击者可构造恶意图片或网页诱导用户访问，触发内存损坏实现任意代码执行。同时影响 Google Chrome 17.0.963.65 之前版本，源于匿名块分割时对未指定变量的不当类型转换，远程攻击者可通过精心构造的文档触发拒绝服务或潜在代码执行。攻击条件为用户访问恶意网页或查看恶意图片，无需认证即可远程触发，CVSS 评分 6.8（中高危），影响 iOS 设备及旧版 Chrome 浏览器用户。Apple 在 iOS 6.0 中修复，Google 在 Chrome 17.0.963.65 中修复。"
published = "2012-03-05T19:55:01Z"
remediation = "建议立即升级 Apple iOS 至 6.0 或更高版本（通过设置 > 通用 > 软件更新或 iTunes 更新），升级 Google Chrome 至 17.0.963.65 或更高版本（通过菜单 > 帮助 > 关于 Google Chrome 自动更新），升级 Safari 至 6.0 或更高版本。如无法立即升级 iOS，可暂时禁用 Safari 浏览器并使用第三方浏览器（如 Chrome for iOS）作为临时缓解措施，同时避免访问不可信网站。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iOS WebKit UAF漏洞"
updated = "2026-06-16T23:32:28Z"

