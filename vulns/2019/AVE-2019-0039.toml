[basic]
description = "BlogEngine.NET 3.3.7.0 版本的文件管理器 API 存在目录遍历漏洞，由于对 path 参数过滤不严，认证后的远程攻击者可通过构造包含 ../ 等特殊字符的路径参数，突破目录限制访问服务器上的任意文件，导致敏感信息泄露。攻击者可进一步利用泄露的凭据或配置信息扩大攻击面。该漏洞 CVSS 评分 7.1，危害等级高，影响所有运行 BlogEngine.NET 3.3.7.0 的系统。"
published = "2019-07-03T16:15:10.770"
remediation = '''
[id]
ave_id = "AVE-2019-10717"
aliases = ["CVE-2019-10717"]

[basic]
title = "BlogEngine.NET 文件管理器接口目录遍历漏洞"
description = "BlogEngine.NET 3.3.7.0 及之前版本中，/api/filemanager 接口的 path 参数未正确过滤 ../ 等路径遍历序列，导致已认证攻击者可通过构造特制的 path 参数实现目录遍历，越权读取服务器上的任意文件。攻击者只需拥有普通用户权限即可利用，无需特殊网络条件。"
severity = "HIGH"
score = 7.1
sources = ["cve", "avd"]
published = "2019-07-03"
updated = "2019-07-03"
remediation = "升级到 BlogEngine.NET 3.3.8.0 或更高版本，该版本在 FileManagerRepository.cs 中增加了 SanitizePath 方法，过滤了 ..、\\、%2F 等危险字符。如无法升级，建议在反向代理层限制 /api/filemanager 接口的访问权限。"

