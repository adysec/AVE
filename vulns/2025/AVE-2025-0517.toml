[basic]
description = "Google Chrome 浏览器的 PageInfo 组件中存在释放后使用（Use-After-Free）漏洞，该漏洞源于对已释放内存对象的错误引用。攻击者可通过构造特制的 HTML 页面并诱使用户执行特定的 UI 手势交互，触发对已释放内存的访问，导致堆内存破坏。成功利用此漏洞可能导致敏感信息泄露、服务拒绝或远程代码执行。该漏洞影响 Google Chrome 142.0.7444.59 之前的所有版本，攻击需要用户交互配合（如点击恶意链接或访问恶意网页），降低了利用门槛，但危害等级较高。"
published = "2025-11-10T20:15:38Z"
remediation = "升级 Google Chrome 至 142.0.7444.59 或更高版本（Fedora 用户升级至 142.0.7444.162），可通过 Chrome 内置更新程序或访问 google.com/chrome 下载安装。如无法立即更新，可在浏览器中启用安全浏览（Safe Browsing）并避免点击可疑链接或与不可信页面交互。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome PageInfo 释放后使用漏洞"
updated = "2026-06-17T08:32:22Z"

