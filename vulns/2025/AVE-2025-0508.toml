[basic]
description = "Google Chrome 的 V8 JavaScript 引擎存在类型混淆（Type Confusion）漏洞，属于 CWE-843 类型。远程攻击者可通过构造特制的 HTML 页面，诱使目标用户访问后触发 V8 引擎对对象类型判断错误，导致攻击者能够实现越界读写操作。该漏洞影响 Google Chrome 142.0.7444.59 之前的所有版本，以及基于 Chromium 的 Microsoft Edge 等浏览器。攻击者需要诱导用户点击恶意链接或访问恶意网页，成功利用后可实现任意内存读写，进而可能执行任意代码。CVSS 评分 8.8，危害等级高。Google 已在 Chrome 142.0.7444.59 版本中修复此漏洞。"
published = "2025-11-10T20:15:35Z"
remediation = "立即将 Google Chrome 升级至 142.0.7444.59 及以上版本（通过 Chrome 设置 > 关于 Chrome > 自动检查更新）。使用 Microsoft Edge 的用户升级至 142.0.3595.53 及以上版本。Fedora 42 用户执行 sudo dnf update 更新至 chromium 142.0.7444.162。如无法立即更新，可禁用 JavaScript 作为临时缓解措施（Chrome 设置 > 隐私与安全 > 网站设置 > JavaScript > 禁止）。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 类型混淆远程代码执行漏洞"
updated = "2026-06-17T08:32:21Z"

