[basic]
description = "Ipswitch IMail 6.0.5 在 SMTP AUTH 命令处理中存在拒绝服务漏洞，远程攻击者无需身份认证即可通过发送长度介于 80 至 136 字节之间的 base64 编码用户密码触发该漏洞，导致邮件服务中断。该漏洞影响运行 Ipswitch IMail 6.0.5 版本的邮件服务器，攻击者利用特制载荷可使 SMTP 服务崩溃或无法响应正常请求，造成服务不可用。"
published = "2001-02-16T05:00:00.000"
remediation = "建议立即升级 Ipswitch IMail 至 6.0.6 或更高版本（厂商已发布修复该 SMTP AUTH 拒绝服务漏洞的补丁），若暂时无法升级，可在防火墙层面限制仅信任 IP 访问 SMTP 端口（默认 25），或临时禁用 SMTP AUTH 认证功能作为缓解措施。参考厂商公告：http://www.ipswitch.com/Support/IMail/news.html 及 Bugtraq 披露：http://archives.neohapsis.com/archives/bugtraq/2000-12/0071.html"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "IPSwitch IMail SMTP AUTH 命令拒绝服务漏洞"
updated = "2026-06-16T21:53:32.360"

