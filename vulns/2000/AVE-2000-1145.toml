[basic]
description = "CVE-2000-1203是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-08-20T04:00:00Z"
remediation = "建议立即升级 Lotus Domino SMTP 服务器至 5.0.9 或更高版本（推荐直接升级到 Domino 6.0 或更高），该版本已修复邮件退信循环漏洞。同时在服务器配置文档中开启 SMTP 发件人地址验证，拒绝来自本地回环地址（127.0.0.1）的伪造退信信封；在 SMTP 进程设置中启用邮件循环检测功能并设定最大循环次数限制（建议不超过 10 次），防止退信邮件触发无限循环耗尽 CPU；关闭对本地不存在用户的自动退信响应，或配置退信发送速率和数量上限，有效阻止攻击者通过伪造 bounce@[127.0.0.1] 地址导致拒绝服务。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "IBM Lotus Domino SMTP Server 拒绝服务漏洞"
updated = "2026-06-16T21:53:22Z"

