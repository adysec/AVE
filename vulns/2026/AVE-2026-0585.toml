[basic]
description = "Kiwi TCMS 账户确认端点存在开放重定向漏洞（CWE-601），由于对 next 参数缺乏有效校验，未经身份认证的远程攻击者可构造特制 URL，将受害者重定向至任意外部恶意域名。由于 Kiwi TCMS 通常部署为工程和 QA 团队的内部工具，来自受信任组织域名的重定向链接具有高度隐式信任，攻击者可借此发起钓鱼攻击，窃取用户凭据或分发恶意软件，且可绕过基于域名白名单的邮件安全过滤机制。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级至 Kiwi TCMS 16.1 或更高版本，该版本已移除 Confirm 视图中未经验证的 ?next= 参数处理，彻底消除开放重定向风险。如无法立即升级，可在反向代理（如 Nginx）层面配置规则，拦截或剥离 /confirm/ 路径的 next 查询参数作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Kiwi TCMS 账户确认端点开放重定向漏洞"
updated = "2026-01-01T00:00:00Z"

