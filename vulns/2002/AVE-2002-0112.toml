[basic]
description = "groff 1.16 及更早版本的预处理器中存在缓冲区溢出漏洞，远程攻击者可通过 LPRng 打印系统中的 lpd 服务利用该漏洞获取提升权限。该漏洞源于 groff 预处理器对输入数据缺乏边界检查，攻击者可通过发送精心构造的打印作业触发缓冲区溢出，进而执行任意代码并提升权限。该漏洞影响 groff 1.16 及更早版本，CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），攻击向量为网络，攻击复杂度低，无需认证，影响机密性、完整性和可用性。攻击者需能访问 LPRng 打印服务（通常端口 515），通过提交恶意打印任务触发溢出实现提权。建议升级至 groff 1.17 或更高版本，或禁用不必要的 lpd 服务。"
published = "2002-02-27T05:00:00Z"
remediation = "升级到 groff 1.20 或更高版本，该版本修复了 CVE-2002-0003 的缓冲区溢出漏洞。对于 LPRng 打印系统，请确保使用集成了安全补丁的最新版本（如 1.23 以上）并重新配置预处理器以禁用不安全的输入处理模式。如无法立即升级，可通过 iptables 阻止对 lpd 端口的特定输入或临时替换 preproc 命令文件。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "GNU groff 预处理器缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:56:34Z"

