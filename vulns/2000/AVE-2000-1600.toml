[basic]
description = 'Rapidstream 2.1 Beta VPN 设备中的 SSH 守护进程（sshd）存在硬编码的"rsadmin"管理员账户，该账户密码为空且无法修改。未经身份认证的远程攻击者可直接使用该账户通过 SSH 协议登录到目标设备，并在系统权限下执行任意操作系统命令。该漏洞影响 Rapidstream VPN 设备的 2.1 Beta 版本，由于利用门槛极低且无需任何权限，攻击者可借此完全控制目标设备，从而进一步渗透内部网络。'
published = "2000-10-20T04:00:00Z"
remediation = "升级 Rapidstream VPN 设备至受厂商支持的正式稳定版本，删除或禁用硬编码的 rsadmin 账户，为所有 SSH 管理账户设置高强度密码并启用账户锁定策略，通过防火墙或 ACL 限制 SSH 仅允许可信管理网段访问。若设备已停止维护，建议迁移至现代受支持的 VPN 解决方案。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Rapidstream VPN appliance 远程代码执行漏洞"
updated = "2026-06-16T21:52:28Z"

