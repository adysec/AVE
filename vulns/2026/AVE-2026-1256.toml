[basic]
description = 'fast-uri 在 4.1.1 及更早版本中仅识别双正斜杠 `//` 作为 URI 授权符，当引用使用反斜杠序列（`\\`、`/\` 或 `\/`）替代 `//` 时，该序列会被当作路径的一部分解析，而非授权符。然而 Node.js 原生的 WHATWG URL 解析器将反斜杠 `\` 与正斜杠 `/` 同等处理（针对 http、https、ws、wss、ftp、file 等特殊方案），导致两个解析器从相同输入中提取出不同的主机地址。依赖 fast-uri 执行基于主机的策略检查（如白名单/黑名单过滤、SSRF 防护、重定向验证、出站代理路由）的应用程序，在将同一 URL 传入 Node URL 或 fetch() 等消费者时会遭遇策略与使用之间的不一致，攻击者可利用此差异将请求导向非预期的目标主机。该漏洞影响所有使用受影响版本 fast-uri 进行 URL 解析与策略检查的 Node.js 应用程序，攻击者无需身份认证即可在网络上发起攻击。建议升级至 fast-uri 4.1.2、3.1.5 或 2.4.4 版本进行修复。'
published = "2026-07-31T15:16:27.983"
remediation = "立即升级 fast-uri 至安全版本：v4 分支升级至 4.1.2，v3 分支升级至 3.1.5，v2 分支升级至 2.4.4。在 package.json 中修改依赖版本并执行 npm install fast-uri@4.1.2，或运行 npm update fast-uri 完成升级后重启 Node.js 应用程序。如因业务依赖无法立即升级，可在应用层对传入 URL 进行预处理，使用正则表达式将反斜杠统一替换为正斜杠后再交由 fast-uri 解析，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "fast-uri URI 解析主机混淆漏洞"
updated = "2026-07-31T18:17:13.383"

