[basic]
description = "Gitea 议题与评论附件更新接口未校验附件 UUID 所属仓库，存在跨仓库附件重链接漏洞。已认证攻击者若获知受害者附件 UUID，可通过议题或评论编辑接口将该附件重链接至攻击者可控仓库的议题或评论中，使后续附件访问权限校验使用攻击者仓库的授权上下文，从而越权读取受害者私有附件内容。攻击者无需对受害者仓库具有写入权限，仅需通过日志、浏览器历史、通知内容等渠道获取附件 UUID 即可实施攻击。该漏洞影响 Gitea v1.27.0-dev 及包含当前附件更新逻辑的版本，目前官方尚未发布修复补丁。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级 Gitea 至 v1.27.0 或更高版本（对应 PR #38406/#38426，commit de4b8277）。如无法立即升级，可临时限制 issue/comment 编辑权限仅授予可信用户，并监控 /attachments/{uuid} 路由的异常跨仓库访问日志。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Gitea 跨仓库附件重链接致私有附件内容泄露漏洞"
updated = "2026-01-01T00:00:00Z"

