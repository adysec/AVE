[basic]
description = "Google Chrome（WebKit 引擎）在处理 SVG use 元素时存在释放后重用漏洞（CWE-416）。当程序释放内存后未正确清除指针，攻击者可构造特制的 SVG 文档，通过诱导用户访问恶意页面触发对已释放内存的访问，导致浏览器崩溃（拒绝服务），在特定内存布局下可能实现任意代码执行。该漏洞影响 Google Chrome 17.0.963.65 之前版本，远程攻击者无需身份认证即可利用，CVSS 评分 6.8，危害等级高危。"
published = "2012-03-05T19:55:01Z"
remediation = '立即将 Google Chrome 升级至 17.0.963.65 或更高版本，Chrome 浏览器会自动检查更新，也可通过"关于 Google Chrome"菜单手动触发更新。使用 Apple Safari 的用户应升级至 Safari 6.0 或更高版本，Apple iOS 用户应升级至 iOS 6.0 或更高版本。基于 WebKit 的第三方应用也需更新到包含该修复的版本。openSUSE 用户可参考 openSUSE-SU-2012:0374 安装对应更新。'
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome SVG use元素释放后使用漏洞"
updated = "2026-06-16T23:32:28Z"

