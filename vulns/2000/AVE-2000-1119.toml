[basic]
description = "RobinHood 1.1 Web 服务器中的 RHDaemon 组件存在拒绝服务漏洞，该漏洞影响 BeOS r5 pro 及更早版本。远程攻击者无需身份认证即可通过向目标服务器发送超长的 HTTP 请求，导致 RHDaemon 进程崩溃或资源耗尽，从而使 Web 服务不可用。攻击条件简单，只需网络可达即可触发，无需特殊权限。该漏洞 CVSS 评分 5.0，危害等级中等，仅影响服务可用性，不涉及数据机密性和完整性。"
published = "2001-01-09T05:00:00.000"
remediation = "BeOS 已停止维护，RobinHood 1.1 不再有官方补丁。建议立即停止在生产环境中使用 BeOS 及 RobinHood 服务，迁移至受支持的操作系统与 Web 服务器（如 Apache/Nginx）。如无法立即迁移，可在网络边界防火墙或反向代理层面限制 HTTP 请求长度（如设置最大请求行不超过 4096 字节），以缓解长请求导致的拒绝服务攻击。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "BeOS RobinHood 1.1 RHDaemon 远程HTTP请求拒绝服务漏洞"
updated = "2026-06-16T21:53:16.517"

