[basic]
description = "这是一个与 Windows AppX 部署服务 (AppXSVC) 中硬链接处理不当相关的权限提升漏洞。当 AppXSVC 处理硬链接时未能正确验证时，攻击者能够利用这个缺陷来提升系统权限。该漏洞源于对硬链接的未授权访问和操作，攻击者只需要具备最低限度的系统权限即可触发。通过精心构造的硬链接，攻击者可以绕过安全机制，获取更高的系统访问权限，包括用户、管理员或服务权限，具体提升程度取决于系统配置和当前服务账户的权限。该漏洞影响所有安装了 Windows AppX 部署服务的 Windows 版本，尤其在企业环境中，由于大量使用应用商店应用，可能导致更严重的权限提升风险。攻击者可以利用此漏洞破坏系统完整性，获取敏感信息或进一步执行恶意操作。该漏洞的攻击条件包括：攻击者必须在系统上拥有最低限度的本地访问权限，具备识别和利用硬链接弱点的能力。通过发送特制的硬链接请求到 AppXSVC 服务，攻击者可以触发权限提升过程。通常情况下，攻击者会先收集系统的服务账户信息，找到相关的硬链接路径和权限控制点，然后通过精心构造的硬链接引发异常路径解析，最终导致系统以更高的权限执行攻击者的恶意代码。该漏洞的 CVSS 评分为 7.8，等级为 HIGH，表明它是一个中等复杂的漏洞，需要一定的攻击技能，但一旦成功，可能会给系统带来严重的后果。微软已经在 2019 年的补丁中修复了这个漏洞，建议所有 Windows 用户及时更新系统。相关的安全补丁和详细的技术信息可以在微软安全更新目录中找到。"
published = "2019-04-09T21:29:01Z"
remediation = "建议立即安装 Microsoft 2019 年 4 月安全更新（KB4493470 / KB4493472 / KB4493441 等，对应 Windows 10 版本），或升级至 Windows 10 版本 1809（内部版本 17763）及以上版本。如无法立即打补丁，可暂时禁用 AppX Deployment Service (AppXSVC) 服务作为临时缓解：以管理员身份运行 `sc config AppXSvc start= disabled` 并重启服务或重启系统，但这会影响 UWP 应用安装/更新功能，打补丁后务必恢复为自动启动（`sc config AppXSvc start= auto`）。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "微软 Windows AppX 部署服务硬链接权限提升漏洞"
