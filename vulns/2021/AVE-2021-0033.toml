[basic]
description = "CVE-2021-1498是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2021-05-06T13:15:10.537"
remediation = "立即应用 Cisco HyperFlex HX Data Platform 的安全更新和补丁。请访问 Cisco 官方安全门户 (https://www.cisco.com/c/en/us/support/security-vulnerabilities/hyperflex.html)，下载并安装最新的固件版本 v4.5.2a 或更高版本。具体步骤包括：登录 HyperFlex HX 管理界面 → 导航到“系统” → 选择“软件更新” → 点击“检查更新” → 安装可用补丁。此外，建议禁用外部访问端口 80 的 `/storfs-asup` 端点，或通过防火墙限制访问源 IP。实施主机防火墙规则，阻止对 tomcat8 用户的非授权命令执行。最后，定期备份系统配置，并在安全事件后审查访问日志以检测可疑的活动。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Cisco HyperFlex HX Data Platform Web管理界面OS命令注入漏洞"
