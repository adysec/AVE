[basic]
description = "CVE-2000-1209是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2002-08-12T04:00:00Z"
remediation = '立即为 SQL Server 和 MSDE 的 "sa" 账户设置高强度密码，使用 sp_password 系统存储过程或企业管理器修改默认空密码；安装微软安全补丁 KB313418（SQL Server 7.0）或 KB321081（SQL Server 2000），或升级至 SQL Server 2000 Service Pack 1 及以上版本；禁用 xp_cmdshell、xp_dirtree 等危险扩展存储过程；通过防火墙限制 1433 端口的访问，仅允许可信 IP 连接数据库服务。'
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Microsoft SQL Server 及 MSDE 默认空口令权限提升漏洞"
updated = "2026-06-16T21:53:23Z"

