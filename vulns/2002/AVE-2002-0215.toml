[basic]
description = "Nortel Alteon ACEdirector WebOS 9.0 的服务器负载均衡（SLB）和基于 Cookie 的持久连接功能存在信息泄露漏洞。当客户端与后端 Web 服务器建立 HTTP 连接后，攻击者通过构造半关闭（half-closed）的 HTTP 会话，可导致 ACEdirector 在转发数据包时未能将后端服务器真实 IP 地址替换为虚拟 IP 地址，从而泄露后端服务器的真实 IP。远程攻击者无需认证即可利用此漏洞获取目标内网服务器 IP 信息，为进一步渗透提供攻击面。"
published = "2002-05-16T04:00:00Z"
remediation = "升级 Nortel Alteon ACEdirector WebOS 至 9.0 以上已修复版本，或应用 ISS 提供的安全补丁。如无法升级，可禁用 Cookie-Based Persistence 功能，并在防火墙上限制对 ACEdirector 管理接口的访问来源，同时配置虚拟 IP 地址映射规则防止真实 IP 泄露。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Nortel ACEdirector WebOS 服务器真实IP地址泄露漏洞"
updated = "2026-06-16T21:56:59Z"

