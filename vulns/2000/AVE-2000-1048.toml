[basic]
description = "FreeBSD 5.0 及更早版本中的 catopen 函数存在任意文件读取漏洞，由于该函数在处理 LANG 环境变量时未对路径进行充分校验，导致本地攻击者可通过设置恶意的 LANG 环境变量，诱使 catopen 函数读取系统上任意文件。该漏洞影响 FreeBSD 5.0 及之前版本，攻击者需拥有本地访问权限，无需额外认证即可利用，可导致敏感信息泄露。CVSS 评分 7.2，危害等级高。"
published = "2000-12-11T05:00:00Z"
remediation = "` tags. Let me provide the correct remediation text based on the FreeBSD-SA-00:53 advisory I fetched.<value>升级 FreeBSD 系统至 4.1-STABLE（2000-08-22 之后）或 3.5-STABLE（2000-09-07 之后）版本，或参照 FreeBSD-SA-00:53 补丁修改 libc 源码后重新编译（cd /usr/src/lib/libc && patch < 补丁文件 && make all && make install）。然后下载运行 scan_locale.sh 扫描所有 setuid/setgid 二进制文件，对使用了 catopen() 的静态链接程序重新编译或移除 setuid 权限，动态链接程序在重编译 libc 后自动修复。临时缓解措施：移除或限制可疑 setuid/setgid 二进制文件的执行权限。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "FreeBSD catopen 函数本地任意文件读取漏洞"
updated = "2026-06-16T21:52:58Z"

