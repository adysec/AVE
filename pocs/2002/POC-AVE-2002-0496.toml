[info]
author = "AVE"
description = "验证 Windows XP 帮助与支持中心 HCP URI 处理程序任意文件删除漏洞。通过构造包含 hcp: 协议链接的 HTML 页面，诱导用户点击后触发 uplddrvinfo.htm 页面删除任意文件。"
id = "POC-AVE-2002-0496"
name = "CVE-2002-0974 PoC"
severity = "medium"
tags = ["cve-2002-0974"]
vuln_id = [
    "CVE-2002-0974",
    "AVE-2002-0496",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["hcp:"]
