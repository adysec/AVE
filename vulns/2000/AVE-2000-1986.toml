[basic]
description = "Poll It 2.0 投票 CGI 脚本存在远程命令执行漏洞，其 pollit.cgi 中的 poll_options 参数未经过滤即被传入 Perl 的 open() 函数。由于 open() 调用时未对 $poll_options 变量使用文件重定向符，攻击者可在参数值中插入管道符（|）等 shell 元字符，从而在 Web 服务器上执行任意操作系统命令。该漏洞影响所有使用 Poll It 2.0 的网站，攻击者无需事先获取管理密码即可利用。攻击者可通过构造类似 action=add_option&add_option=1&poll_options=echo+内容 的恶意 CGI 请求触发漏洞，实现网页篡改、文件写入或敏感信息窃取。攻击者在野已被广泛利用进行网站页面篡改，同时该版本还存在信息泄露问题，投票者 IP 地址可通过 pollit_files/ips.txt 被直接下载获取。"
published = "2000-12-11T05:00:00Z"
remediation = "升级到 Poll It 2.01 或更高版本，该版本将 ReadForm 函数调用移至变量声明之前，防止 CGI 输入覆盖 poll_options 等内部变量，从而阻断 shell 元字符注入路径。如厂商已停止维护且无法升级，建议立即删除 pollit.cgi 脚本，或在 Web 服务器配置中通过访问控制列表限制该脚本仅允许本地访问，同时在防火墙或 WAF 规则中过滤 poll_options 参数中的管道符（|）、分号（;）、反引号（`）及美元符号（$）等 shell 元字符作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Poll It poll_it_pro 远程代码执行漏洞"
updated = "2026-06-16T21:53:05Z"

