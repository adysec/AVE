[basic]
description = "Half-Life 专用服务器（build 3104 及更早版本）存在格式化字符串漏洞，远程攻击者可通过系统控制台或 rcon 接口向 changelevel 命令中注入格式化字符串，导致任意代码执行。该漏洞影响所有运行受影响版本的 Half-Life 专用服务器，CVSS 评分 10.0，危害等级严重。攻击者无需身份认证即可远程利用，可完全控制目标服务器。Valve 已发布更新修复此漏洞。"
published = "2000-12-19T05:00:00Z"
remediation = "立即将 Half-Life 专用服务器升级至 build 3104 之后的版本（Valve 已发布补丁修复该格式化字符串漏洞）。如无法立即升级，应在防火墙层面限制对服务器 UDP/TCP 27015 端口的非信任来源访问，并禁用 rcon 远程控制功能或设置强 rcon 密码，防止未授权攻击者通过控制台或 rcon 接口注入恶意格式化字符串。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Valve Half-Life Dedicated Server 格式化字符串远程代码执行漏洞"
updated = "2026-06-16T21:52:52Z"

