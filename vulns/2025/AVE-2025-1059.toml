[basic]
description = "Linux 内核 ksmbd 模块的 SMB 协议实现中存在越界读取漏洞（CWE-125）。当 ksmbd 解析安全描述符（parse_sec_desc）时，若 osidoffset、gsidoffset 和 dacloffset 偏移量超出 smb_ntsd 结构体大小，将触发 slab-out-of-bounds；同时 SID 校验过程中未正确检查 subauth 数组大小，导致攻击者可读取内核内存中的敏感数据。该漏洞影响运行较新 Linux 内核且启用 ksmbd 服务的系统（如 Ubuntu 22.04/24.04 LTS 等），CVSS 评分 8.8（高危）。具有低权限的远程攻击者可通过构造恶意的 SMB 协议数据包触发越界读取，获取主机敏感信息。厂商已发布补丁修复此问题，建议升级至包含修复的内核版本。"
published = "2025-04-01T16:15:25Z"
remediation = '升级 Linux 内核至已修复版本：主线内核请升级至 6.6.83、6.12.19、6.13.7 或 6.14 及以上版本；Ubuntu 24.04 LTS 用户请升级至 6.8.0-84.84，Ubuntu 24.10 用户请升级至 6.11.0-28.28。如暂无法升级内核，可通过在启动参数中添加 "ksmbd.enabled=0" 或使用 modprobe 加载参数禁用 ksmbd 模块（echo "options ksmbd enabled=0" > /etc/modprobe.d/ksmbd.conf），以临时消除 SMB 服务端的攻击面，随后安排内核升级。Ubuntu 22.04 LTS 标准内核目前暂无修复补丁，建议升级至较新内核系列或联系 Canonical 获取支持。'
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux ksmbd 越界读取漏洞"
updated = "2026-07-30T06:21:58Z"

