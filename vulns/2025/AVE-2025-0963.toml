[basic]
description = "Linux内核的brcmfmac无线网卡驱动存在空指针解引用漏洞。驱动在probe过程中调用of_property_read_string_index()读取设备树属性时未检查返回值，当属性不存在时临时变量tmp保持未初始化状态，随后被作为随机指针传递给devm_kstrdup()，触发内核空指针访问导致系统崩溃。该漏洞影响使用brcmfmac驱动的Linux设备（如MacBookPro14,3），攻击者需具备本地访问权限或能触发udev-worker等内核线程操作，利用门槛较低。CVSS评分为5.5（中等），危害等级中等。"
published = "2025-02-27T03:15:15.647"
remediation = "升级到 Linux 内核 6.12 或更高版本，其中包含对 brcmfmac 驱动的补丁修复 CVE-2025-21750；或者至少升级到 6.11-rc1 及以上版本，该版本修复了未检查 of_property_read_string_index() 返回值的缺陷。通过内核更新确保 brcmf_of_probe() 函数正确处理属性不存在的情况，避免了传递未初始化的指针给 devm_kstrdup() 导致的崩溃。或者，如果无法立即更新内核，请确保在编译内核时启用 CONFIG_DEBUG_KERNEL 或 CONFIG_DEBUG_VM，以捕获此类崩溃并排查驱动层问题。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 brcmfmac WiFi 驱动未检查of_property_read_string_index()返回值导致空指针解引用崩溃"
updated = "2026-06-17T08:44:11.167"

