[basic]
description = "McKesson Pathways Homecare 6.5 对用户名和密码采用弱加密算法存储，本地攻击者可通过读取 pwhc.ini 配置文件中的加密凭据，利用弱加密的脆弱性还原明文密码，从而获取更高权限。该漏洞影响 McKesson Pathways Homecare 6.5 版本，攻击者需具备本地系统访问权限及低权限用户身份，无需用户交互即可利用。CVSS 评分 7.8，危害等级高。"
published = "2001-12-31T05:00:00Z"
remediation = "立即限制对 pwhc.ini 文件的访问权限，仅允许系统管理员账户读取该文件（如设置 NTFS 权限为 SYSTEM 和 Administrators 完全控制，拒绝普通用户读取）。由于 McKesson Pathways Homecare 6.5 已停止维护，建议升级到支持强加密（如 AES-256）的最新版本或替换为其他合规的医疗信息管理系统。如无法升级，应使用组策略限制本地用户登录到运行该软件的终端，并启用 Windows 审核策略监控对 pwhc.ini 的异常访问。"
score = 7.8
severity = "HIGH"
sources = ["exploitdb"]
title = "McKesson Pathways Homecare 弱密码加密导致本地权限提升漏洞"
updated = "2026-06-16T21:56:28Z"

