[basic]
description = "tags.<value>Exim MTA 在 4.87 至 4.91 版本中存在远程代码执行漏洞，根因是 src/deliver.c 中 deliver_message() 函数对收件人地址验证不当。未经身份认证的远程攻击者可通过构造恶意的收件人地址参数，在邮件投递过程中注入并执行任意系统命令。该漏洞影响广泛部署的 Exim 邮件服务器，CVSS 评分 9.8（严重），攻击向量为网络、攻击复杂度低、无需权限和用户交互。成功利用可导致服务器完全沦陷，攻击者获取最高权限执行任意代码。Exim 官方已在 4.92 版本修复此漏洞，建议尽快升级至 4.92 或更高版本。"
published = "2019-06-05T14:29:11Z"
remediation = "立即升级 Exim 至 4.92 或更高版本（官方已修复该漏洞）。若暂时无法升级，可在 exim.conf 中添加 `smtp_accept_max_nonmail = 0` 限制非邮件命令，并配置防火墙仅允许受信 IP 访问 25 端口作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Exim 邮件服务器 远程代码执行漏洞"
updated = "2026-06-17T02:10:21Z"

