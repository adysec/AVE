[basic]
description = "Microsoft Exchange Server 存在特权提升漏洞，攻击者无需身份认证即可通过向目标服务器发送特制的网络请求，利用 Exchange Server 处理邮件或协议解析时的权限控制缺陷，将自身权限提升至系统管理员级别。该漏洞影响 Microsoft Exchange Server 多个版本，CVSS 评分为 7.4（高危），攻击复杂度高但无需用户交互，远程即可触发。攻击者可借此获取服务器上的敏感邮件数据并篡改系统配置。Microsoft 已在 2018 年 11 月的安全更新中修复此漏洞，建议管理员及时安装补丁。"
published = "2018-11-14T01:29:01Z"
remediation = "立即安装 Microsoft 2018 年 12 月安全更新：Exchange Server 2010 安装 KB4465477，Exchange Server 2013 安装 KB4465743，Exchange Server 2016 安装 KB4465463，Exchange Server 2019 安装 KB4465455。如无法立即打补丁，可临时在 Exchange 服务器前端禁用 Outlook Web Access（OWA）或限制 Exchange Web Services（EWS）的外部访问，并通过防火墙规则仅允许受信任的内部 IP 访问 EWS 端口，以减缓攻击面。"
score = 7.4
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Exchange Server 特权提升漏洞"
updated = "2026-06-17T02:05:08Z"

