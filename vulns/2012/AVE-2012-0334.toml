[basic]
description = "tags.<value>Apple iTunes 使用的 WebKit 引擎存在内存破坏漏洞，攻击者可通过构造恶意网页触发该漏洞，在用户访问时实现远程代码执行或导致应用程序崩溃（拒绝服务）。该漏洞影响 iTunes 10.7 之前的版本，攻击条件为用户访问包含恶意代码的网站即可触发，无需额外身份认证。"
published = "2012-09-13T10:30:20.137"
remediation = '立即将 Apple iTunes 升级至 10.7 或更高版本，该版本修复了 WebKit 内存破坏漏洞。可通过 iTunes 内置的"帮助 > 检查更新"功能自动检测并安装更新，或从 Apple 官方支持页面（support.apple.com/kb/HT5485）手动下载最新安装包。对于暂时无法升级的系统，建议在主机防火墙中阻止对不可信网站的 HTTP/HTTPS 访问，仅允许经过白名单审核的域名，以降低被利用的风险。'
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:40.400"

