[basic]
description = "Red Hat Linux 6.2 系统中的 restore 工具（0.4b15 及更早版本）存在不安全的路径处理漏洞。该工具在执行过程中信任 RSH 环境变量所指定的路径名，未对路径进行合法性验证。本地攻击者可通过修改 RSH 环境变量使其指向自身控制的恶意程序（特洛伊木马），当 restore 工具以 root 权限执行时会调用该恶意程序，从而获取系统 root 权限。该漏洞影响 Red Hat Linux 6.2 系统中所有使用该版本 restore 工具的用户，攻击条件为攻击者拥有本地访问权限。利用方式为修改 RSH 环境变量并触发 restore 命令执行，最终实现本地权限提升至 root。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 restore 软件包至已修复版本，或升级至 Red Hat Linux 更新的受支持版本。临时缓解措施：以 root 权限编辑 /etc/profile 及所有用户 shell 配置文件，取消 RSH 环境变量的默认设置，执行 unset RSH 或 export RSH=/usr/bin/rsh 将其固定为安全路径。同时通过 chmod 移除 restore 二进制文件的 SUID 权限，仅允许 root 用户直接执行该程序，防止普通用户利用该漏洞提升权限至 root。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "RedHat Red Hat Linux 6.2 restore 环境变量信任本地提权漏洞"
updated = "2026-06-16T21:53:12Z"

