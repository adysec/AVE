[basic]
description = 'FTGate 邮件服务器的 POP3 服务存在用户枚举漏洞。当远程攻击者向 POP3 服务发送无效的 USER 命令时，服务器会返回 "-ERR" 错误码，而有效用户名则返回不同的响应，攻击者可据此枚举有效邮箱账户，进而实施暴力密码破解攻击。该漏洞无需身份认证即可远程利用，攻击复杂度低，可能导致邮箱账户信息泄露。影响运行 FTGate 邮件服务器的系统。'
published = "2000-12-31T05:00:00Z"
remediation = "FTGate POP3 服务器已于 2000 年后停止维护，官方不再提供安全更新。建议立即迁移至受支持的邮件服务器（如 Dovecot、Microsoft Exchange 或 Zimbra）。如无法立即迁移，可在防火墙层面将 TCP 端口 110 限制为仅允许受信任的内部 IP 访问，并在 POP3 服务配置中启用失败延迟机制（如每次认证失败后延迟 3-5 秒），以减缓暴力破解速度。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "FTGate POP3 服务器用户枚举漏洞"
updated = "2026-06-16T21:53:26Z"

