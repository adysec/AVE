[basic]
description = ".NET 和 Visual Studio 存在堆缓冲区溢出漏洞（CWE-122），由于 .NET 运行时在处理特制输入时未正确验证堆内存边界，攻击者可通过诱导用户打开恶意文件或访问特制网站触发该漏洞，成功利用可在目标系统上以当前用户权限执行任意代码。该漏洞攻击复杂度较高（AC:H），需要用户交互（UI:R），但无需身份认证，影响 .NET 6.0/8.0/9.0 及 Visual Studio 2022 等版本。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:30Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新：将 .NET 9.0 升级至 9.0.1 或更高版本，将 .NET 8.0 升级至 8.0.12 或更高版本，将 .NET 6.0 升级至 6.0.36 或更高版本；同时通过 Visual Studio Installer 将 Visual Studio 2022 更新至最新版本（v17.12.x 或 v17.13.x）。如无法立即打补丁，可限制用户打开来自不可信来源的解决方案文件，并启用 Windows Defender Attack Surface Reduction (ASR) 规则以阻止 Office 应用程序创建子进程作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft .NET 和 Visual Studio 远程代码执行漏洞"
updated = "2026-06-17T08:42:41Z"

