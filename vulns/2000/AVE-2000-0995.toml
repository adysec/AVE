[basic]
description = "Lotus Notes 5.02 之前版本存在默认执行控制列表（ECL）配置缺陷，远程攻击者可通过向目标用户发送包含恶意程序的电子邮件附件，当用户打开邮件时该程序自动执行，导致任意代码执行。该漏洞影响 Lotus Notes 5.02 之前所有版本，CVSS 评分 7.5，危害等级高。攻击者无需身份认证即可远程利用，且无需用户交互以外的额外条件，可完全控制受影响的系统。"
published = "2001-07-21T04:00:00Z"
remediation = '立即升级 Lotus Notes 至 5.02 或更高版本，该版本修复了默认 ECL 允许自动执行邮件附件的缺陷。如无法升级，请在用户首选项中手动收紧 ECL 安全策略，将"允许自动执行"设置为禁用，并禁止非信任来源的嵌入式代码运行。同时建议在邮件服务器层面过滤可疑附件类型（如 .exe、.vbs、.js），并加强用户安全意识培训，不打开来历不明的邮件附件。'
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "IBM Lotus Notes 默认 ECL 远程代码执行漏洞"
updated = "2026-06-16T21:52:41Z"

