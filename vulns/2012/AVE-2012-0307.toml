[basic]
description = "tags.<value>Apple Safari浏览器使用的WebKit渲染引擎存在内存破坏漏洞。由于WebKit在处理恶意构造的网页内容时存在内存管理错误，远程攻击者可通过诱骗用户访问特制网页触发该漏洞，导致远程代码执行或应用程序崩溃拒绝服务。攻击者无需身份认证即可在目标系统上执行任意代码，完全控制受影响设备。该漏洞影响Safari 6.0以下版本，包括Mac OS X和iOS系统中的Safari浏览器。"
published = "2012-07-25T20:55:03Z"
remediation = "建议立即将 Apple Safari 浏览器升级至 6.0 或更高版本，iOS 设备升级至 6.0 或更高版本，可通过 Mac App Store 或系统设置中的软件更新功能自动安装。如无法立即升级，可临时禁用不必要的 Web 脚本执行并启用安全浏览模式作为缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:36Z"

