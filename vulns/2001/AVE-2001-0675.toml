[basic]
description = "Microsoft Word 2002 及更早版本在处理富文本格式（RTF）文档时存在安全缺陷。当RTF文档链接至一个包含嵌入宏的模板文件时，Word会无任何提示地自动执行该模板中的宏代码。攻击者可构造恶意RTF文档，诱使用户打开，从而在用户不知情的情况下执行任意宏命令，进而获取敏感信息或控制用户系统。该漏洞影响Word 2000及先前版本，攻击条件简单，仅需用户打开特制文档即可触发。"
published = "2001-06-27T04:00:00Z"
remediation = '标签之间。<value>立即升级 Microsoft Word 至 2002 或更高版本，或安装微软对应安全更新补丁。如暂时无法升级，可将 Word 宏安全级别设置为"高"并禁用所有宏，关闭 RTF 文档中外部模板链接功能，同时在邮件网关和文件服务器部署杀毒软件实时扫描含 RTF 附件的文件。'
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Word RTF模板宏执行漏洞"
updated = "2026-06-16T21:53:56Z"

