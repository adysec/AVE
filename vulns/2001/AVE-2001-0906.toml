[basic]
description = "Windows CE 3.0.9348 版本使用的 TCP 初始序列号（ISN）生成算法可被预测，远程攻击者无需身份认证即可利用该漏洞实施 TCP 连接欺骗或劫持。通过预测目标主机的 ISN 值，攻击者能够伪造合法 TCP 连接，进而截获、篡改或注入网络流量，造成数据泄露或会话劫持。该漏洞影响运行 Windows CE 3.0.9348 的设备，攻击者只需与目标在同一网络可达范围内即可发起攻击。Microsoft 已发布安全更新修复此问题。"
published = "2001-01-01T05:00:00.000"
remediation = "建议将 WinCE 3.0 升级至 4.0 或更高版本以修复 TCP 序列号生成算法。对于无法升级的遗留设备，应在网络边界部署防火墙或 IDS 监控异常 TCP 握手，或通过 ACL 严格限制可访问该设备的源 IP 地址。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Windows CE TCP 初始序列号预测漏洞"
updated = "2026-06-16T21:53:47.133"

