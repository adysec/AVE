[basic]
description = "Linux 内核 dm-flakey 设备映射器 target 的 corrupt_bio_byte 可选功能存在内存损坏漏洞。由于向 bio_init 传递了不正确的参数，攻击者可利用此漏洞在本地触发越界写入（CWE-787），导致内存损坏。该漏洞影响 Linux 内核 6.5 至 6.6.84、6.7 至 6.12.20、6.13 至 6.13.8 以及 6.14-rc1 至 rc6 等版本。攻击者需要低权限本地访问权限即可利用此漏洞，成功利用后可导致系统内存被破坏，进而可能泄露敏感数据、提升权限或造成拒绝服务。CVSS v3.1 评分为 7.8，危害等级为高。"
published = "2025-04-02T00:00:00Z"
remediation = "建议将 Linux 内核升级至 6.6.84、6.12.20、6.13.8 或更高版本以修复此漏洞，上游补丁提交为 57e9417f69839cb10f7ffca684c38acd28ceb57b。如暂时无法升级内核，应停止使用 dm-flakey 设备映射器的 corrupt_bio_byte 功能，并在启动参数或 dmsetup 配置中移除该选项以降低被利用风险。对于使用 Ubuntu 等发行版的用户，建议安装对应内核安全更新（如 USN-7765-1）。"
score = 5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 dm-flakey 内存损坏漏洞"
updated = "2025-04-02T00:00:00Z"

