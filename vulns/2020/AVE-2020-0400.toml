[basic]
description = "FortiOS SSL VPN 存在身份认证绕过漏洞（CWE-287），源于用户名大小写处理逻辑缺陷。攻击者只需将用户名中的字母大小写进行变换（如将 `admin` 改为 `Admin`），即可在未提供 FortiToken 双因素认证第二因子的情况下成功登录 SSL VPN 门户。该漏洞影响 FortiOS 6.4.0、6.2.0~6.2.3、6.0.9 及以下版本，CVSS 评分 9.8，危害等级严重。攻击者无需身份凭证即可远程利用，成功后可完全控制目标系统，窃取敏感数据或部署恶意软件。Fortinet 已在 2020 年 7 月安全公告 FG-IR-20-028 中修复此漏洞。"
published = "2020-07-24T23:15:12Z"
remediation = "立即升级 FortiOS 至 6.4.1 及以上、6.2.4 及以上或 6.0.10 及以上版本。如无法立即升级，在 CLI 中执行 `config user local` → `edit <用户名>` → `set username-case-sensitivity disable` → `next` → `end`，禁用用户名大小写敏感性匹配，防止攻击者通过修改用户名大小写绕过 FortiToken 双因素认证。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Fortinet FortiOS SSL VPN 认证绕过漏洞"
updated = "2026-06-17T02:52:20Z"

