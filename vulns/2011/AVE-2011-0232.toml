[basic]
description = "Mozilla Firefox 8.0 之前版本及 Thunderbird 8.0 之前版本在 Mac OS X 系统上与 Intel 集成 GPU 的驱动程序存在交互缺陷，远程攻击者可通过 WebGL 纹理构造特制向量，利用 GPU 内存行为绕过同源策略，窃取跨域图像数据，导致敏感信息泄露。攻击无需认证，复杂度低，仅需诱使用户访问恶意网页即可触发。"
published = "2011-11-09T11:55:03Z"
remediation = "升级 Mozilla Firefox 至 8.0 及以上版本，或升级 Thunderbird 至 8.0 及以上版本。如无法立即升级，可在浏览器中禁用 WebGL 功能（在 about:config 中将 webgl.disabled 设为 true）作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird WebGL 跨源图像信息泄露漏洞"
updated = "2026-06-16T23:33:41Z"

