[basic]
description = "SunRPC 派生的 XDR（外部数据表示）库（包括 libnsl、libc、glibc、dietlibc 等）中的 xdrmem_getbytes() 等函数存在整数溢出漏洞。远程未认证攻击者可通过在长度字段中发送特制的整数值触发溢出，进而在目标系统上执行任意代码。该漏洞影响广泛使用上述库的 Unix/Linux 系统及相关网络服务，CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），攻击复杂度低、无需认证、可导致机密性、完整性和可用性部分受损，与 CVE-2002-0391 为不同漏洞。"
published = "2003-03-25T05:00:00Z"
remediation = "建议立即升级 glibc 至 2.3.2 或更高版本（如 Red Hat Enterprise Linux 3/4 请安装 glibc-2.3.2-95.30 及以上 RPM 包），同步更新 libnsl、dietlibc 等衍生库。若暂时无法升级，可在网络边界部署 WAF 规则过滤异常 XDR 长度字段，并在应用层添加整数溢出检查（如在调用 xdrmem_getbytes 前验证 length 参数不超过合理上限）。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "GNU glibc 整数溢出导致代码执行漏洞"
updated = "2026-06-16T22:01:22Z"

