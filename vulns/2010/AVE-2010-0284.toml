[basic]
description = "PHP GD扩展中的imagepstext()函数存在栈缓冲区溢出漏洞。当向该函数传递包含大量抗锯齿步进（anti-aliasing steps）参数的恶意数据时，可触发栈缓冲区溢出，导致应用程序崩溃，造成拒绝服务。该漏洞影响PHP 5.2.15之前版本及5.3.4之前版本，攻击者无需认证即可远程触发，但仅能造成服务不可用，无法实现代码执行。"
published = "2011-01-18T20:00:10Z"
remediation = "将 PHP 升级至 5.2.15 或 5.3.4 及以上版本，该漏洞已在 PHP 5.3.4 中通过修复 GD 扩展 imagepstext() 函数的栈缓冲区边界检查得到解决。如无法立即升级，可在 php.ini 中禁用 GD 扩展（extension=gd.so 前加 ; 注释）作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "PHP GD扩展栈缓冲区溢出漏洞"
updated = "2026-06-16T23:25:22Z"

