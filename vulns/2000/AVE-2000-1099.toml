[basic]
description = "Bill Kendrick 开发的 GBook 留言簿 CGI 程序（gbook.cgi）存在命令注入漏洞，远程攻击者可通过向 _MAILTO 表单变量中注入 shell 元字符（如分号、管道符等）执行任意系统命令。该漏洞影响 GBook 所有版本，攻击者无需身份认证即可利用，可导致服务器被完全控制。建议升级到最新版本或对用户输入进行严格过滤。"
published = "2001-01-09T05:00:00Z"
remediation = "立即停用 gbook.cgi 或升级到已修复版本。如无法升级，编辑 gbook.cgi 源码，在 `_MAILTO` 变量传递给 shell 命令前使用 Perl 的 `quotemeta()` 函数或正则替换过滤掉 `;` `|` `&` `` ` `` `$` `(` `)` 等 shell 元字符，并启用 Perl taint 模式（在脚本首行添加 `#!/usr/bin/perl -T`）。作为临时缓解措施，在 Web 服务器配置中限制 gbook.cgi 的执行权限或直接移除该脚本。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Bill Kendrick GBook 远程命令执行漏洞"
updated = "2026-06-16T21:53:12Z"

