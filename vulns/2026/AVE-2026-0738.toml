[basic]
description = "Apache HTTP Server 的 mod_proxy_ajp 模块中 ajp_msg_get_string 函数存在缺失空终止检查导致的堆缓冲区过度读取漏洞。攻击者可通过发送特制的 AJP 请求触发越界读取，泄露服务器内存中的敏感信息。该漏洞影响 Apache HTTP Server 2.4.66 及之前版本，CVSS 评分 5.3（中危），攻击向量为网络、低复杂度、无需权限和用户交互。建议升级至 2.4.67 版本修复。"
published = "2026-05-04T14:16:33Z"
remediation = "建议立即升级 Apache HTTP Server 到 2.4.67 或更高版本以修复 mod_proxy_ajp 中的堆缓冲区过度读取漏洞。若暂时无法升级，可在配置文件中禁用 mod_proxy_ajp 模块（注释掉 LoadModule proxy_ajp_module），或在防火墙层面限制 AJP 端口（默认 8009）仅允许受信任的后端服务器访问作为临时缓解措施。"
score = 5.3
severity = "MEDIUM"
sources = ["zdi"]
title = "Apache HTTP Server mod_proxy_ajp 堆缓冲区过度读取漏洞"
updated = "2026-06-17T10:38:28Z"

