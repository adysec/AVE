[basic]
description = "LBL tcpdump 3.6.x 版本（3.7 之前）的 BGP 协议解析模块存在数据拷贝缺陷，远程攻击者无需认证即可发送特制的 BGP 数据包触发该漏洞，导致 tcpdump 进程崩溃拒绝服务。该漏洞影响所有运行受影响版本 tcpdump 的系统，攻击向量为网络远程利用，攻击复杂度低，CVSS 评分 7.5（HIGH）。升级至 tcpdump 3.7 或更高版本可修复此问题。"
published = "2002-12-23T05:00:00Z"
remediation = "升级到tcpdump 3.7或更高版本以修复BGP解码例程中的缓冲区复制问题。该版本修复了CVE-2002-1350中的漏洞，可防止攻击者通过精心构造的BGP数据包导致tcpdump崩溃。如果无法立即升级，可在命令行中启用'--disable-bgp'选项以临时禁用BGP解码功能。此外，建议更新到最新的维护版本以获取所有安全补丁，并在网络环境中部署入侵检测系统以监控异常BGP流量。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "LBL tcpdump 3.6.x BGP Dissector 拒绝服务漏洞"
updated = "2026-06-16T21:59:09Z"

