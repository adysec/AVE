[basic]
description = "Pulse Secure Pulse Connect Secure（PCS）的 Application Launcher 页面存在跨站脚本（XSS）漏洞。攻击者可利用该漏洞向页面注入恶意脚本，当管理员或其他用户访问受影响的页面时，脚本会在浏览器中执行，导致敏感信息泄露或会话劫持。攻击无需身份认证，但需要用户交互（点击恶意链接）。该漏洞影响 PCS 8.3.x（低于 8.3R7.1）和 9.0.x（低于 9.0R3）版本，CVSS 评分 6.1，危害等级中危。"
published = "2019-05-08T17:29:00Z"
remediation = "升级 Pulse Connect Secure 至 8.3R7.1 或 9.0R3 及以上版本。如无法立即升级，可在管理界面禁用 Application Launcher 页面，或通过 Web 应用防火墙（WAF）添加规则过滤恶意脚本参数作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Pulse Secure Pulse Connect Secure 跨站脚本漏洞"
updated = "2026-06-17T02:13:03Z"

