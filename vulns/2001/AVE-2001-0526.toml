[basic]
description = 'Qualcomm Eudora 5.1 邮件客户端存在隐藏附件执行漏洞。当用户启用"使用 Microsoft Viewer"选项且禁用"允许 HTML 内容中的可执行文件"选项时，远程攻击者可向目标用户发送特制 HTML 邮件，通过将表单伪装为图片链接诱导用户点击，从而触发表单执行并访问邮件中嵌入的附件，最终导致任意代码执行。该漏洞影响 Eudora 5.1 版本，攻击者无需身份认证即可远程利用，危害严重。'
published = "2001-05-29T04:00:00Z"
remediation = '升级到 Eudora 6.0 及以上版本，该版本已修复通过 HTML 邮件表单触发隐藏附件执行的问题。如无法升级，请在 Eudora 设置中关闭"Use Microsoft Viewer"选项（Tools → Options → Viewing Mail → Use Microsoft Viewer），并禁止在 HTML 内容中执行可执行文件。由于 Qualcomm 已停止维护 Eudora，建议迁移至 Thunderbird 等仍在安全更新的邮件客户端。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Qualcomm Eudora 5.1 隐藏附件远程代码执行漏洞"
updated = "2026-06-16T21:56:02Z"

