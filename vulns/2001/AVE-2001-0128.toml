[basic]
description = "a2ps 4.14 及更早版本中的 lib/routines.h 文件 tempname_ensure 函数存在不安全的临时文件创建漏洞（CWE-59），spy_user 函数及其他可能函数调用该函数时未正确验证临时文件路径真实性，导致本地攻击者可通过在临时目录创建恶意符号链接，劫持临时文件写入操作，从而修改攻击者可访问的任意文件。该漏洞影响 GNU a2ps 4.14 及更早版本，攻击向量为本地（AV:L），攻击复杂度低（AC:L），无需认证（Au:N），仅影响完整性（I:P），CVSS 评分 2.1（LOW 级）。"
published = "2014-04-05T21:55:06Z"
remediation = "建议升级 a2ps 至 4.15 或更高版本（已修复 tempname_ensure 函数的不安全临时文件创建漏洞）。若无法升级，请应用各发行版提供的补丁：Debian 请应用 deb_2892 补丁，Gentoo 应用 a2ps-4.14-CVE-2001-1593.patch，Frugalware 应用 CVE-2001-1593.patch，pkgsrc 用户应用 patch-CVE-2001-1593_1。临时缓解措施：设置 TMPDIR 环境变量指向仅当前用户可写的目录（如 /tmp/user_$UID），并设置 sticky bit（chmod 1777 /tmp/user_$UID），防止本地用户通过符号链接攻击临时文件。建议通过包管理器升级：Debian/Ubuntu 执行 apt update && apt upgrade a2ps，Gentoo 执行 emerge -u a2ps，Fedora/RHEL 执行 dnf update a2ps。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "GNUA2PS 不安全文件创建漏洞"
updated = "2026-06-16T21:56:33Z"

