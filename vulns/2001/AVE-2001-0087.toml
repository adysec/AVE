[basic]
description = "Martin Hamilton ROADS 2.3 的 search.pl 程序存在文件泄露漏洞，攻击者无需身份认证即可通过向 search.pl 发送请求，在 form 参数中指定任意文件名并以空字节（null byte）终止文件名，从而读取服务器上的任意文件。该漏洞影响 ROADS 2.3 及可能的其他版本，攻击条件宽松，只需网络可达即可利用。攻击者可通过构造恶意请求获取服务器上的敏感配置文件、源代码或其他敏感信息，造成信息泄露。CVSS 评分为 5.0，危害等级为中等。"
published = "2001-06-02T04:00:00.000"
remediation = "升级到最新版本的ROADS（≥2.3.1）并应用安全补丁，删除或禁用search.pl程序的form参数文件读取功能。如无法立即升级，可通过修改配置文件禁用特定文件类型扩展名，并限制null字节过滤处理。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Martin Hamilton ROADS 2.3 文件泄露漏洞"
updated = "2026-06-16T21:53:53.877"

