[basic]
description = "KTH Kerberos IV 实现中存在任意代理使用漏洞，本地用户可通过设置 krb4_proxy 环境变量来指定一个非预期的替代代理服务器。攻击者可利用此机制生成伪造的 Kerberos 代理响应，从而绕过正常的身份验证流程并可能提升系统权限。该漏洞影响 KTH Kerberos 4 相关版本，攻击条件要求攻击者已具备目标系统的本地访问权限。由于漏洞利用仅需本地账户且无需复杂配置，潜在风险等级较高，可能导致攻击者获得系统范围内的完整控制权限。"
published = "2001-02-16T05:00:00Z"
remediation = "建议立即停止使用 KTH Kerberos 4，迁移至 MIT Kerberos 5（最新版 1.21+）或 Heimdal Kerberos（最新版 7.8+）。若必须继续使用旧版本，需在所有 Kerberos 服务启动脚本中显式取消设置 krb4_proxy 环境变量（unset krb4_proxy），并在防火墙层面封锁非受信主机对 Kerberos 端口（88/tcp、88/udp、749/tcp、750/udp、464/tcp、464/udp）的访问。同时配置 telnet/SSH 等服务禁止接受客户端传递的环境变量（SSH 设置 PermitUserEnvironment no，telnetd 禁用 ENVIRON 选项）。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "KTH Kerberos 4 任意代理使用权限提升漏洞"
updated = "2026-06-16T21:53:31Z"

