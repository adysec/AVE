[basic]
description = "Windows 98 和 Windows Me 的 Plus! 组件中压缩文件夹功能的密码保护选项存在信息泄露漏洞。该功能在设置密码保护时会将密码信息以明文或可恢复形式写入系统文件，本地攻击者可通过读取该文件获取压缩文件夹的访问密码，从而绕过保护机制访问受保护的压缩文件夹内容。攻击条件要求攻击者具有本地系统访问权限，无需特殊权限即可实施。Microsoft 未针对此漏洞发布官方补丁，建议用户避免在受影响的系统上使用压缩文件夹密码保护功能。"
published = "2001-05-03T04:00:00.000"
remediation = '安装 Microsoft 安全公告 MS01-019 提供的补丁，该补丁可阻止密码被写入磁盘。安装后务必手动删除 `C:\Windows\dynazip.log` 文件以清除已记录的密码。验证方法：检查 `zipfldr.dll` 版本——Plus! 98 系统应为 5.0.518.20（日文 NEC 版为 5.0.526.20），Windows Me 系统应为 5.50.4213.1600。如无法安装补丁，避免使用压缩文件夹密码保护功能，或改用 Windows 2000 及以上版本系统。'
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Microsoft Plus! for Windows 98/Me 压缩文件夹密码泄露漏洞"
updated = "2026-06-16T21:53:46.237"

