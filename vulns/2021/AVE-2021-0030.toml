[basic]
description = "Google Android DSP 驱动程序在 SMR Mar-2021 Release 1 之前版本中存在边界检查不当漏洞，攻击者可利用该缺陷实现越界内存访问。该漏洞源于 DSP 驱动未对输入数据长度进行有效校验，导致内存写入操作超出分配缓冲区范围，可能触发内存破坏、信息泄露或任意代码执行。影响搭载受影响 Android 版本且使用特定 DSP 硬件的移动设备，CVSS 3.1 评分 6.1（中危），攻击向量为物理接触（AV:P），需高权限（PR:H）且攻击复杂度高（AC:H），无需用户交互。成功利用可导致设备机密性、完整性、可用性均遭高度破坏。Google 已在 2021 年 3 月安全公告中发布修复补丁，建议用户及时更新至 SMR Mar-2021 Release 1 或更高版本。"
published = "2021-03-26T19:15:12Z"
remediation = '建议通过三星设备"设置→软件更新"菜单将系统固件升级至 SMR Mar-2021 Release 1 或更高版本，以修复 DSP 驱动程序边界检查不当导致的越界内存访问漏洞。受影响设备为搭载 Exynos 980/9830/2100 芯片组的 Android 10.0/11.0 三星移动设备，用户应开启自动下载更新或手动检查系统更新推送，也可通过 Samsung Smart Switch 进行离线刷机升级至最新固件。如设备已停止官方支持且无法获取补丁，建议立即停止使用该设备处理敏感业务数据，同时在网关和防火墙层面严格限制来自不可信来源的需经 DSP 处理的媒体文件传输，以降低被利用的风险。CISA 已将此漏洞列入已知被利用漏洞目录，联邦机构须在 2023 年 7 月 20 日前完成修复。'
score = 6.1
severity = "MEDIUM"
sources = ["kev"]
title = "Google Android DSP 驱动越界内存访问漏洞"
updated = "2026-06-17T03:41:57Z"

