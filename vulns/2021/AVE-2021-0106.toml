[basic]
description = "SonicWall SSL-VPN SMA100 系列设备存在 SQL 注入漏洞（CWE-89），未经身份认证的远程攻击者可通过向目标设备发送特制请求执行恶意 SQL 查询，从而获取设备中存储的用户名、密码哈希及其他会话相关信息。该漏洞影响 SMA100 固件 10.x 多个版本（包括 SMA200、SMA210、SMA400、SMA410 及 SMA500v 等型号的对应版本），攻击复杂度低，无需用户交互即可远程利用。由于 VPN 设备通常作为企业网络访问入口，凭证泄露可导致攻击者进一步横向移动并接管内网资源。CISA 已将本漏洞列入已知被利用漏洞目录（KEV），CVSS v3.1 评分为 9.8（严重等级），危害极大。SonicWall 已在 10.2.0.5-d-29sv 及后续版本中修复该问题，建议受影响用户立即升级固件。"
published = "2021-02-04T06:15:13.817"
remediation = "立即升级 SonicWall SMA100 固件至 10.2.0.5-d-29sv 或更高版本（通过 MySonicWall 账户下载）。若暂时无法升级，请在防火墙策略中限制 SSL-VPN 管理端口（默认 4433）仅允许受信 IP 访问，并启用 WAF 规则拦截 SQL 注入载荷（如单引号、UNION SELECT 等特征）作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "SonicWall SSL-VPN SMA100 SQL注入漏洞"
updated = "2026-06-17T03:33:08.860"

