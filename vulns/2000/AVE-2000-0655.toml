[basic]
description = "GNU Screen 3.9.5 及更早版本中存在格式化字符串漏洞。本地攻击者可通过在 vbell_msg 初始化变量中插入特制的格式化字符，触发该漏洞，导致攻击者能够以 root 权限执行任意代码，实现本地权限提升。攻击条件为需要本地用户身份访问系统，无需认证即可利用，危害较大。"
published = "2000-12-19T05:00:00Z"
remediation = "建议升级 GNU Screen 至 3.9.6 或更高版本。如无法立即升级，可移除 screen 二进制文件的 setuid root 权限位作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "GNU screen 格式化字符串本地权限提升漏洞"
updated = "2026-06-16T21:52:43Z"

