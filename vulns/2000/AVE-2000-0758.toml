[basic]
description = "Extent Technologies RBS ISP 2.5 Web 服务器存在目录遍历漏洞。远程攻击者可通过向 Image 参数传递 `../` 等路径遍历序列，绕过访问限制读取服务器上的任意敏感文件（如配置文件、系统文件等）。该漏洞无需身份认证即可利用，攻击复杂度低，影响运行 RBS ISP 2.5 版本的 Web 服务器，可能导致敏感信息泄露。"
published = "2000-12-11T05:00:00Z"
remediation = "该产品（Extent RBS ISP 2.5）已停止维护，建议立即迁移至现代受支持的 Web 服务器（如 Apache/Nginx/IIS）。若无法立即迁移，可在反向代理或 WAF 层面添加规则，拦截 Image 参数中包含 `../` 的请求，并限制端口 8002 仅允许可信 IP 访问。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Extent Technologies RBS ISP 目录遍历漏洞"
updated = "2026-06-16T21:53:01Z"

