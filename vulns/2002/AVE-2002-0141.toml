[basic]
description = "Apache mod_ssl 2.8.7-1.3.23 之前版本及 Apache-SSL 1.3.22+1.46 之前版本的 dbm 和 shm 会话缓存代码中，i2d_SSL_SESSION 函数未正确初始化内存，存在缓冲区溢出漏洞。远程攻击者无需身份认证，可通过提交由可信 CA 签发的超长客户端证书，触发产生大型序列化会话数据，从而利用该漏洞执行任意代码。该漏洞影响运行 mod_ssl 的 Apache HTTP Server，CVSS 评分 7.5，危害等级高。"
published = "2002-03-15T05:00:00.000"
remediation = "升级 Apache mod_ssl 至 2.8.7-1.3.23 及以上版本，或 Apache-SSL 至 1.3.22+1.46 及以上版本。如无法立即升级，可在 httpd.conf 中禁用 SSL 会话缓存（SSLSessionCache none）作为临时缓解措施，并限制仅接受由可信 CA 签发的客户端证书。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Apache mod_ssl 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:56:44.093"

