[basic]
description = "Mistune 是一款 Python Markdown 解析器，其 Include 指令在检测文件包含循环时仅检查直接自引用（即 a.md 不能包含自身），但未检测间接循环引用。攻击者可通过上传两个相互包含的 Markdown 文件（如 a.md 包含 b.md，b.md 包含 a.md），触发无限制递归调用，导致 Python 栈溢出并抛出 RecursionError，最终使渲染进程崩溃，造成拒绝服务。该漏洞影响 Mistune 3.3.0 之前的所有版本，攻击者无需身份认证即可利用，仅需具备上传 Markdown 文件的权限。官方已在 3.3.0 版本中修复此问题。"
published = "2026-07-08T17:17:28Z"
remediation = "升级 Mistune 至 3.3.0 或更高版本（pip install --upgrade mistune）。如无法立即升级，可在应用中禁用 Include 指令（移除 RSTDirective([Include()]) 插件注册），或在使用前对用户上传的 Markdown 文件进行循环引用检测。"
score = 5.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Mistune Markdown 解析器 Include 指令相互递归包含拒绝服务漏洞"
updated = "2026-07-09T19:30:14Z"

