[basic]
description = "Adobe Flash Player 在处理特定数据时存在整数溢出漏洞（CWE-189），远程攻击者可通过诱导用户访问恶意构造的网页或打开特制的 Flash 文件触发该漏洞，导致任意代码执行。受影响的版本包括 Windows、Mac OS X、Linux 及 Solaris 平台上低于 10.3.181.14 的 Flash Player，以及 Android 平台上低于 10.3.185.21 的版本。攻击无需身份认证，用户交互仅需正常浏览或打开文件即可触发，CVSS 评分 9.3，危害严重。Adobe 已于 2011 年 5 月发布安全更新修复此漏洞。"
published = "2011-05-13T22:55:01Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.181.14 及以上版本（Windows/Mac/Linux/Solaris）或 10.3.185.21 及以上版本（Android）。由于 Adobe Flash Player 已于 2020 年底停止支持并结束生命周期，建议彻底卸载 Flash Player 组件，并在浏览器中禁用 Flash 插件，同时移除系统残留的 Flash 相关文件（如 Windows 下运行 kb4577586 更新），以彻底消除该漏洞及所有 Flash 历史漏洞风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 整数溢出远程代码执行漏洞"
updated = "2026-06-16T23:27:45Z"

