[basic]
description = "WordPress 的 Van Ons WP GDPR Compliance（wp-gdpr-compliance）插件在 1.4.3 版本之前存在远程代码执行漏洞。该漏洞的根本原因是插件在处理数据库查询时错误地使用了 $wpdb->prepare() 函数的输入处理逻辑，导致对用户可控参数的转义与绑定过程存在缺陷，攻击者提交的恶意数据未被正确参数化处理而是被直接拼接入 SQL 查询，从而能够注入并执行任意代码。该漏洞攻击条件简单，未认证的远程攻击者无需任何权限，通过网络即可发起攻击，无需用户交互，在 2018 年 11 月已被发现在野利用。攻击者可借此获得目标站点的高权限访问，进一步窃取数据、篡改网页内容或植入后门，造成机密性、完整性和可用性的全面破坏。CVSS 评分为 9.8，危害等级为严重，官方建议立即升级到 1.4.3 及以上版本以修复该缺陷。"
published = "2018-11-12T17:29:00Z"
remediation = '立即将 WordPress 站点中的 Van Ons WP GDPR Compliance（wp-gdpr-compliance）插件升级至 1.4.3 或更高版本，该版本修复了因 $wpdb->prepare() 输入处理不当导致的任意代码执行问题（该漏洞已在 2018 年 11 月遭野外利用）。升级前请备份数据库与插件目录，并在 WordPress 管理后台"插件"页面点击"立即更新"；同时检查是否已安装且激活 1.4.3 及以上版本。作为缓解措施，若暂无法升级，应停用该插件，并通过防火墙或访问控制规则限制对含有该插件相关功能的挂载点（如任意 PHP 文件上传/执行路径）的外网访问，同时排查是否存在已被入侵的迹象（异常文件、可疑挂载进程及非预期管理员账号），及时清除作为临时管控手段。'
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress Van Ons WP GDPR Compliance 插件任意代码执行漏洞"
updated = "2026-06-17T01:48:58Z"

