[basic]
description = 'SiYuan 是一款开源个人知识管理系统，其 `/api/icon/getDynamicIcon` 接口在路由层被标记为"不需要鉴权"，未经验证即可访问。当攻击者传入 `type=8` 参数及有效的块 ID 时，该接口会调用 Go 模板渲染函数，其中注册了 `querySQL` 和 `queryBlocks` 两个模板函数，可对底层 SQLite 数据库执行任意 SELECT 查询。网络可达的未认证攻击者只需获取一个有效的块 ID（可通过共享文档链接、Referer 头或浏览器历史泄露），即可窃取所有笔记内容、标签、资源引用和块属性等敏感数据。该漏洞影响 SiYuan 3.7.0 之前所有版本，已在 3.7.0 版本中修复。'
published = "2026-06-24T22:16:48Z"
remediation = "立即升级 SiYuan 至 v3.7.0 或更高版本，该版本已修复 /api/icon/getDynamicIcon 接口的模板注入问题。如无法立即升级，可在反向代理层（如 Nginx）添加规则拦截对 /api/icon/getDynamicIcon 的未授权访问，或限制 SiYuan 服务仅监听 127.0.0.1 而非 0.0.0.0，避免暴露到网络。"
score = 5.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "SiYuan 动态图标接口未授权模板注入致SQLite数据泄露漏洞"
updated = "2026-06-25T14:16:46Z"

