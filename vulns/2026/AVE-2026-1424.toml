[basic]
description = "Nuxt DevTools 在开发模式下通过 Vite HMR WebSocket 暴露双向 RPC 通道，该通道缺乏身份认证机制。任何能够访问 Vite HMR 端口的客户端均可直接调用 RPC 方法，无需令牌、握手或来源验证。其中 `updateOptions()` 和 `openInEditor()` 等方法未执行 `ensureDevAuthToken` 检查，攻击者可通过链式调用先通过 `updateOptions('behavior', { openInEditor: '<command>' })` 设置任意命令，再调用 `openInEditor()` 触发 `launch-editor` 包执行该命令，从而在开发者主机上执行任意程序。HMR 端口可通过同主机进程、局域网（当使用 `nuxi dev --host` 绑定）或被开发者访问的恶意网站（浏览器允许跨域打开 HMR WebSocket）到达。该漏洞仅影响开发环境，生产构建不会运行 DevTools。受影响的 `@nuxt/devtools` 版本已在 3.3.1 中修复，建议升级至该版本并避免在不受信任的网络中运行开发服务器。"
published = "2026-08-05T22:17:08Z"
remediation = "立即将 @nuxt/devtools 升级至 3.3.1 或更高版本（执行 npm install @nuxt/devtools@latest 并更新 lockfile 后重启项目）；如暂无法升级，请在 nuxt.config.ts 中添加 devtools: { enabled: false } 以禁用 DevTools，并严禁使用 nuxi dev --host 在非本机或不可信网络环境中启动开发服务器。"
score = 9.6
severity = "CRITICAL"
sources = ["ghsa"]
title = "Nuxt DevTools 未认证远程代码执行漏洞"
updated = "2026-08-07T05:17:03Z"

