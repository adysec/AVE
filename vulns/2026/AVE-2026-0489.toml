[basic]
description = """SiYuan（思源笔记）开源知识管理系统 3.7.0 之前版本中，属性视图（数据库）单元格渲染器 genAVValueHTML 在 text、url、phone、mAsset 四个分支中未对单元格内容进行 HTML 转义处理。具有工作空间写入权限的攻击者可通过同步机制植入包含恶意载荷的单元格数据（如 `</textarea><img src=x onerror="...">`），当受害者打开包含该行的块属性面板时，载荷突破标签边界执行任意 JavaScript。在 Electron 桌面端因启用 nodeIntegration:true，XSS 可链式升级为远程代码执行（RCE），通过 require('child_process') 执行系统命令。该漏洞 CVSS 9.9，危害等级严重，影响所有通过同步机制共享工作空间的用户，已在 3.7.0 版本修复。"""
published = "2026-06-24T22:16:48Z"
remediation = '立即升级 SiYuan 至 3.7.0 或更高版本，该版本已对 `genAVValueHTML` 中 text、url、phone、mAsset 四个分支的单元格内容进行 HTML 转义，阻止注入。可通过应用内"设置→关于→检查更新"或从官方 GitHub releases 页面下载最新安装包进行升级。升级前建议备份工作区目录（含 `data/storage/av/` 下的 AV 文件），清除已存在的恶意单元格数据。若暂时无法升级，可在防火墙或反向代理层限制对 `/api/av/getAttributeView` 和 `/api/av/updateAttrViewCell` 接口的外部访问，仅允许可信客户端调用，降低攻击面。'
score = 9.9
severity = "CRITICAL"
sources = ["ghsa"]
title = "SiYuan 思源笔记 属性视图存储型XSS到远程代码执行漏洞"
updated = "2026-06-26T00:16:53Z"

