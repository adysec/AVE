[basic]
description = "BEA Systems WebLogic Express 和 WebLogic Server 5.1 SP1-SP6 版本存在访问控制绕过漏洞。远程攻击者无需身份认证，通过在受限 JSP 或 Servlet 页面的 URL 路径中插入多个连续的正斜杠（/）字符，即可绕过服务器的访问控制机制，未经授权访问受限资源。该漏洞可导致敏感信息泄露、页面内容被篡改等安全风险，影响范围广泛。"
published = "2000-12-31T05:00:00Z"
remediation = "升级 BEA WebLogic Server / WebLogic Express 至 5.1 SP7 或更高版本，补丁可从 ftp://ftpna.bea.com/pub/releases/patches/SecurityBEA00-0600.zip 获取。如无法立即升级，可在 Web 服务器或反向代理层配置规则，拒绝包含连续多个斜杠（//）的 URL 请求，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "BEA WebLogic Server 访问控制绕过漏洞"
updated = "2026-06-16T21:53:26Z"

