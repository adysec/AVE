[info]
author = "ave"
description = "验证 Pulse Connect Secure 身份验证绕过漏洞（CVE-2021-22893），检测目标是否允许未授权访问 API 端点"
id = "POC-AVE-2021-0708"
name = "Pulse Connect Secure Authentication Bypass PoC"
severity = "critical"
tags = ["ave-2021-0708"]
vuln_id = [
    "CVE-2021-22893",
    "AVE-2021-0708",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/api/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Pulse"]
