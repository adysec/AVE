[basic]
description = "GNU userv 1.0.0 及更早版本在执行文件描述符交换操作时存在安全缺陷，导致 USERV_GROUPS 和 USERV_GIDS 环境变量被损坏。该漏洞影响 GNU userv 套件，攻击条件为攻击者需拥有目标系统的本地访问权限。本地用户可利用此缺陷篡改环境变量，绕过系统原有的访问控制限制，从而获得不应具备的权限。由于漏洞触发无需额外认证且利用复杂度低，存在较高的安全风险。"
published = "2000-10-20T04:00:00.000"
remediation = "升级至 GNU userv 1.0.1 或更高版本，该版本修复了文件描述符交换算法中的越界引用问题，可防止 USERV_GROUPS 和 USERV_GIDS 环境变量被篡改。受影响用户应尽快通过 GNU FTP 站点或 Debian 安全更新（Debian 2.1/slink 和 potato 架构已提供 userv_1.0.1 预编译包）获取修复版本并重新编译安装。如无法立即升级，可应用官方补丁修改 servexec.c 中 fdarray 边界检查逻辑（增加 fdarray[fd].realfd >= 0 判断）后重新编译部署作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "GNU userv 文件描述符交换错误本地安全绕过漏洞"
updated = "2026-06-16T21:52:28.680"

