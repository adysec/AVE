[basic]
description = "Apache 1.3.20 for Windows 与 PHP 组合部署时，若将 ScriptAlias 配置为指向 c:/php/，php.exe 会被暴露于 Web 可访问路径下。未经身份认证的远程攻击者可通过构造 HTTP 请求访问 php.exe，并在查询字符串中附带任意文件名路径，从而读取服务器上的敏感文件内容。由于攻击者可能利用此方式执行任意程序，该漏洞不仅导致信息泄露，还可能进一步造成服务器权限被完全控制。该漏洞影响使用 Windows 平台、Apache 1.3.20 及对应 PHP 配置的 Web 服务器。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 Apache 至 1.3.21 或更高版本，同时升级 PHP 至 4.2.3 或更高版本。修改 httpd.conf 移除或限制 ScriptAlias /php/ 指向 c:/php/ 的配置，改用 Action/AddType 方式处理 PHP 文件。在防火墙层面拦截包含 php.exe 的异常请求作为临时缓解。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Apache 1.3.20 (Win32) PHP.exe 远程文件泄露漏洞"
updated = "2026-06-16T22:00:31Z"

