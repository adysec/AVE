[basic]
description = 'ProFTPD 的 mod_sqlpw 模块存在密码缓存未重置漏洞。当已认证用户通过 "user" 命令切换账户时，该模块未清除先前缓存的密码，导致攻击者可利用残留的认证凭据以其他用户身份执行操作。攻击者只需拥有合法账户即可利用此漏洞，无需额外权限，可导致权限提升，获取其他用户的访问权限。该漏洞影响 ProFTPD 使用 mod_sqlpw 模块的版本，CVSS 评分 7.5，危害等级高。'
published = "2001-02-12T05:00:00Z"
remediation = "升级 ProFTPD 至 1.2.1 或更高版本，该版本修复了 mod_sqlpw 模块在 user 命令切换账户时未重置缓存密码的问题。如无法升级，可在 proftpd.conf 中移除 mod_sqlpw 模块加载（`LoadModule mod_sqlpw.c` 注释掉），或通过 `AllowOverride` 限制普通用户执行 SITE 和 USER 命令。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "ProFTPD mod_sqlpw 模块权限提升漏洞"
updated = "2026-06-16T21:53:30Z"

