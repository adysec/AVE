[basic]
description = "Check Point VPN-1/FireWall-1 4.1及更早版本存在封装数据包重传安全绕过漏洞。该漏洞源于防火墙错误地重传封装的FWS数据包，即使这些数据包并非来自合法的FWZ客户端，也会被转发处理。远程攻击者无需认证即可利用此漏洞，通过发送特制的封装数据包绕过防火墙安全策略，导致未授权网络访问、信息泄露或服务中断。攻击复杂度低，影响系统机密性、完整性和可用性。"
published = "2000-11-14T05:00:00.000"
remediation = "tags.<value>升级 Check Point VPN-1/FireWall-1 至 4.1 SP2 或更高版本，该版本修复了未授权 FWZ 客户端封装包重传问题。如无法立即升级，可在防火墙上配置访问控制规则，仅允许可信源地址发起 FWZ 连接，并禁用不必要的封装协议端口。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Check Point VPN-1/FireWall-1 封装数据包重传安全绕过漏洞"
updated = "2026-06-16T21:52:31.053"

