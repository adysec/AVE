[basic]
description = "FreeBSD 及其他类 Unix 操作系统的 procfs 文件系统存在权限访问控制绕过漏洞。本地攻击者可通过在 jail 监狱环境中利用 procfs 对进程文件系统的特殊访问权限，绕过 jail 的访问控制限制，获取额外的系统权限，实现权限提升。该漏洞攻击复杂度低，无需身份认证即可利用，可导致机密性、完整性和可用性完全丧失。受影响系统需启用 procfs 且运行 jail 环境。"
published = "2001-02-12T05:00:00Z"
remediation = "建议升级至 FreeBSD 4.2-RELEASE 之后或 3.5.1-RELEASE 之后的已修复版本，或应用 FreeBSD-SA-00:77 安全公告中的 procfs 补丁。临时缓解措施：不要在 jail 环境中挂载 procfs 文件系统，或在 jail 启动脚本中移除 procfs 挂载项，以阻断本地用户通过 procfs 绕过 jail 访问控制提权。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "FreeBSD procfs 本地权限提升漏洞"
updated = "2026-06-16T21:53:35Z"

