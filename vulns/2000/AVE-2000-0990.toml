[basic]
description = "mailto CGI 脚本存在命令注入漏洞，远程攻击者可通过向 emailadd 表单字段中注入 shell 元字符（如管道符、分号等）执行任意系统命令。该漏洞影响使用 mailto CGI 脚本的 Web 服务器，攻击者无需身份认证即可远程利用，可导致服务器被完全控制、敏感信息泄露或进一步横向移动。由于 CGI 脚本未对用户输入进行充分过滤，攻击者只需构造特制的 HTTP 请求即可触发。"
published = "2000-11-14T05:00:00Z"
remediation = "立即删除或禁用服务器上存在漏洞的 mailto CGI 脚本，停止使用该脚本处理邮件表单提交。改用经过输入验证的邮件发送程序（如使用 PHP 的 mail() 函数配合 filter_var 对 email 参数做严格过滤），对所有用户输入中的 shell 元字符（; | & ` $ ( ) { } < >）进行转义或拒绝。如无法替换脚本，在 Web 服务器配置中限制该 CGI 脚本的执行权限，并禁用 CGI 目录的 Execute 权限。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Web 服务器 mailto CGI 脚本远程命令执行漏洞"
updated = "2026-06-16T21:52:39Z"

