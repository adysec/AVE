[basic]
description = "WebKit 引擎的 CSS 计数器（counters）功能存在内存破坏漏洞。Apple Safari 5.0.1 之前版本（Mac OS X 10.5 至 10.6 及 Windows 平台）、4.1.1 之前版本（Mac OS X 10.4 平台）以及 webkitgtk 1.2.6 之前版本均受影响。未经身份认证的远程攻击者可通过向目标用户发送包含特制 HTML 文档的链接并诱使其使用受影响浏览器打开，触发 WebKit 对 CSS counters 处理过程中的内存损坏，导致应用程序崩溃（拒绝服务）或在受影响系统上执行任意代码。该漏洞利用无需用户交互，仅需诱导用户访问恶意网页即可完成攻击。Apple 已在 Safari 5.0.1 和 4.1.1 安全更新中修复此漏洞。"
published = "2010-07-30T20:30:02Z"
remediation = "立即升级 Apple Safari 至 5.0.1（适用于 Mac OS X 10.5-10.6 及 Windows）或 4.1.1（适用于 Mac OS X 10.4），WebKitGTK 用户升级至 1.2.6 或更高版本。升级前可临时启用浏览器的安全模式并避免访问不受信任的网站，以降低远程代码执行风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:19:19Z"

