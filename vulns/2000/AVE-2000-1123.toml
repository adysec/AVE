[basic]
description = "Network Associates（现为McAfee）Sniffer Agent 3.0.10 版本的登录功能存在拒绝服务漏洞。该漏洞的原理是服务端在处理登录请求时未对请求频率实施适当限制或对异常输入进行充分验证，导致远程攻击者无需身份认证即可通过持续发送大量恶意构造的登录请求耗尽系统资源，最终触发服务崩溃。影响范围包括运行 Sniffer Agent 3.0.10 版本且暴露相关服务的网络监控和管理系统。攻击条件方面，攻击者只要能通过网络访问目标主机的 Sniffer Agent 服务端口，即可在无需任何凭据的情况下发起攻击。利用方式简单直接，攻击者仅需编写脚本或使用工具向目标服务持续发送海量登录请求，即可造成拒绝服务，影响网络监控和管理功能的正常运行。"
published = "2001-01-09T05:00:00Z"
remediation = "建议立即升级到 Network Associates Sniffer Agent 3.0.11 或更高版本（厂商已发布缓冲区溢出修复补丁）。若无法升级，请在防火墙层面禁止非受信 IP 访问 Sniffer Agent 管理端口（默认 TCP 666），并禁用不必要的远程登录功能。如业务允许，建议停用该组件并迁移至现代网络分析工具（如 Wireshark、Zeek），该产品已停止维护且存在多个未修复漏洞。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Network Associates Sniffer Agent 登录拒绝服务漏洞"
updated = "2026-06-16T21:53:17Z"

