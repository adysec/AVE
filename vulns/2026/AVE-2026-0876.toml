[basic]
description = "WatchGuard Fireware OS 管理 Web UI 存在路径遍历漏洞（CWE-22），具有高权限的认证攻击者可通过向管理界面发送特制的 HTTP 请求，利用不充分的路径过滤机制突破目录限制，在 Firebox 文件系统上写入任意文件。该漏洞影响 Fireware OS 11.0 至 11.12.4_Update1、12.0 至 12.12 及 2025.1 至 2026.2 版本，CVSS 评分 8.6，危害等级高。攻击者需具备管理权限方可利用，成功利用后可写入恶意文件导致设备配置篡改或进一步权限提升。"
published = "2026-07-03T00:16:50.497"
remediation = '建议立即升级 Fireware OS 至修复版本：2025.1 系列升级至 2026.2.1，12.x 系列升级至 12.12.1，12.5.x 系列（T15/T35 型号）升级至 12.5.19。Fireware OS 11.x 已终止支持，须升级至受支持版本。可通过 WatchGuard System Manager 或 Web UI 的"系统升级"功能安装对应固件。如无法立即升级，建议限制管理 Web UI 仅对受信任内部 IP 开放访问，并在防火墙上配置访问控制列表（ACL）限制管理端口（默认 8080/8443）的暴露范围。'
score = 8.6
severity = "HIGH"
sources = ["zdi"]
title = "WatchGuard Fireware OS Management Web UI 路径遍历任意文件写入漏洞"
updated = "2026-07-10T12:58:52.963"

