[basic]
description = 'IBM AIX 4.3.x 及更早版本中 setsenv 命令存在缓冲区溢出漏洞，本地用户可通过向 "x=" 参数传递过长字符串触发溢出，进而执行任意命令并可能提升至 root 权限。该漏洞影响 AIX 4.3.x 及更早版本，CVSS 评分 4.6（本地攻击、低复杂度、无需认证、部分机密性/完整性/可用性影响）。攻击者需具备本地账户权限，通过构造超长参数触发栈溢出实现代码执行。IBM 已发布修补程序修复该漏洞。'
published = "2001-01-09T05:00:00.000"
remediation = "建议立即升级 IBM AIX 至 4.3.3 或更高版本，或安装 IBM 官方发布的 APAR IY13658 补丁修复 setsenv 缓冲区溢出漏洞。若无法立即升级，可通过移除 /usr/bin/setsenv 的 setuid 位（chmod u-s /usr/bin/setsenv）或限制普通用户执行权限（chmod 700 /usr/bin/setsenv）作为临时缓解措施，防止本地用户利用缓冲区溢出提权。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "IBM AIX 4.x setsenv 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:11.277"

