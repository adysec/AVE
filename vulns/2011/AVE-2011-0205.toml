[basic]
description = "Google Chrome浏览器在18.0.1025.151版本之前存在使用后释放漏洞。该漏洞源于浏览器在处理样式应用命令（style-application commands）时存在内存管理错误， Specifically，当网页通过脚本操作CSS样式相关接口时，程序在完成样式应用后错误地释放了仍在使用的内存对象，导致后续访问已释放内存而引发使用后释放问题。攻击者可以通过诱导用户访问特制的网页或嵌入恶意脚本的页面来触发该漏洞，从而导致浏览器拒绝服务（崩溃）或潜在的内存破坏，从而可能实现任意代码执行。影响范围广泛，涵盖Google Chrome浏览器的多个版本，CVSS评分为6.8（中危）。攻击条件为远程攻击，攻击者无需本地权限，但需要诱导用户访问恶意网页。Google已在Chrome 18.0.1025.151版本中发布安全更新修复了此漏洞，用户应立即升级至最新版本。"
published = "2012-04-05T22:02:07.997"
remediation = "立即升级 Google Chrome 浏览器至 18.0.1025.151 或更高版本。在 Windows 系统中，打开 Chrome 菜单 → 帮助 → 关于 Google Chrome，启用自动更新功能，浏览器将自动下载并安装最新安全补丁。对于企业环境，建议通过 Google Chrome 企业版组策略模板（GoogleUpdatePolicy）配置为强制自动更新，或从 Google 官方网站下载最新安装包进行批量部署。如无法立即升级，可在网络层面限制用户访问不可信网页，防止远程攻击代码执行。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 基于style命令的释放后使用漏洞"
updated = "2026-06-16T23:32:36.487"

