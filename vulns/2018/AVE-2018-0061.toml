[basic]
description = "Apache Tomcat 默认 Servlet 存在开放重定向漏洞。当用户请求目录路径（如 `/foo`）时，Tomcat 默认 Servlet 会返回重定向到目录（如 `/foo/`），在此过程中若未对用户构造的特殊 URL 进行校验，攻击者可利用该漏洞将重定向目标指向任意外部 URI。该漏洞影响 Apache Tomcat 7.0.23 至 7.0.90、8.5.0 至 8.5.33 以及 9.0.0.M1 至 9.0.11 版本，攻击者无需身份认证，仅需诱导用户点击特制 URL 即可触发重定向至攻击者控制的恶意站点，从而实施钓鱼攻击或绕过访问控制限制。CVSS 评分 4.3，危害等级中等。"
published = "2018-10-04T13:29:00Z"
remediation = "建议将 Apache Tomcat 升级至修复版本：7.0.91、8.5.34 或 9.0.12 及更高版本。如暂时无法升级，可在前置反向代理（Nginx/Apache httpd）中配置规则校验 Location 响应头格式，拦截重定向至外部 URI 或非法路径的请求，并将 default servlet 的目录读权限设为 readonly 作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "Apache Tomcat 默认重定向漏洞"
updated = "2026-06-17T01:36:35Z"

