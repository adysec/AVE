[basic]
description = "Microsoft SQL Server 2000 及 Microsoft Desktop Engine (MSDE) 2000 的数据库一致性检查器 (DBCC) 存在缓冲区溢出漏洞。具有 db_owner 或 db_ddladmin 数据库角色的用户可通过向 DBCC 命令传递特制参数触发缓冲区溢出，从而在服务器进程中执行任意代码。该漏洞需要攻击者已获得数据库内较高权限，CVSS 评分 7.5，危害等级高。Microsoft 已在安全更新中修复此漏洞。"
published = "2002-08-12T04:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS02-038 提供的 SQL Server 2000 安全更新补丁，或升级至 SQL Server 2000 Service Pack 3 (SP3) 及以上版本。如无法立即打补丁，应从 db_owner 和 db_ddladmin 角色中移除不必要的用户，并限制 DBCC 命令的执行权限以降低风险。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft SQL Server 2000 数据库一致性检查器缓冲区溢出漏洞"
updated = "2026-06-16T21:57:51Z"

