[basic]
description = "Oracle MySQL Server 的 SQL 解析器（Server: Parser）组件存在资源消耗管理不当漏洞（CWE-400）。受影响版本包括 8.0.0 至 8.0.41、8.4.0 至 8.4.4 及 9.0.0 至 9.2.0。远程低权限攻击者可通过网络利用多种协议向目标服务器发送特制的 SQL 请求，触发解析器异常，导致 MySQL Server 进程挂起或频繁崩溃，造成完全拒绝服务。该漏洞利用复杂度较低且无需用户交互，攻击者无需身份认证即可在较短时间内完成利用，严重影响数据库服务的可用性和业务连续性。"
published = "2025-04-15T21:15:47Z"
remediation = "立即安装 Oracle MySQL 的最新安全补丁：MySQL Server 用户升级到 8.0.42 或更高版本，或 8.4.5 或更高版本，MySQL Client 用户升级到 8.0.23 或更高版本。如果无法立即更新，建议在防火墙上拉黑异常或高频的 MySQL 连接端口，降低被利用风险。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Oracle MySQL 客户端 C API 拒绝服务漏洞"
updated = "2026-06-17T08:43:46Z"

