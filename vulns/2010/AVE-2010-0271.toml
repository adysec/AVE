[basic]
description = "RealNetworks RealPlayer 的 RealAudio 编解码器存在内存破坏漏洞，远程攻击者可通过构造特制的 RealMedia 音频流文件，诱导用户使用受影响版本播放器打开，触发堆内存损坏，导致远程代码执行或拒绝服务。该漏洞影响 RealPlayer 11.0~11.1、RealPlayer SP 1.0~1.1.4、Mac RealPlayer 11.0~12.0.0.1444 及 Linux RealPlayer 11.0.2.1744 版本，CVSS 评分 9.3，危害严重。攻击无需身份认证，但需用户交互（打开恶意文件）。"
published = "2010-12-14T16:00:04.837"
remediation = "立即将 RealPlayer 升级至 12.0.1.609 或更高版本，该版本已修复此漏洞。对于无法升级的旧系统，建议禁用浏览器中的 RealPlayer 插件，并避免打开来源不明的 .rm/.ra 媒体文件。也可在网络层面阻止对不可信来源的 RealMedia 流媒体访问作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer RealAudio编解码器内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:24:41.420"

