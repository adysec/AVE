[basic]
description = "traceroute-nanog 6.0 至 6.1.1 版本的 get_origin() 函数存在本地缓冲区溢出漏洞。该函数位于 traceroute.c 中，负责解析 WHOIS 响应的域名信息，但在解析过程中未对缓冲区长度进行 adequate 边界检查。攻击者可通过设置 RA_SERVER 和 RA_SERVICE 环境变量，将 traceroute 的 WHOIS 查询重定向至攻击者控制的恶意 DNS 服务器。该服务器返回特制构造的超长 WHOIS 响应数据，在 get_origin() 函数中使用 strncpy() 复制到 100 字节的 tmp4[] 缓冲区时触发溢出，进而覆盖栈上的 EBP 与返回地址。通过精心构造的 off-by-two 攻击技术，攻击者可将执行流程重定向至存储在环境变量中的 Shellcode，最终在本地获得 root 权限。该漏洞在 SuSE Linux 7.x 及 8.0 等系统上已被验证可被利用，CVSS 评分为 7.2。"
published = "2002-12-23T05:00:00Z"
remediation = "升级到 traceroute-nanog 6.1.1-1.3 或更高版本（如 6.3.10-2），该版本在 get_origin() 函数中增加了对 WHOIS 响应数据的边界检查，修复了 strcpy 无边界复制导致的栈溢出问题。Debian 用户可通过 apt-get upgrade 安装 DSA-254 安全更新，SuSE/Novell 用户应安装对应厂商发布的 2002_043 安全补丁。如系统自带标准 traceroute 或 tracepath 工具，建议直接停用 traceroute-nanog 并切换至系统原生工具以彻底消除风险。临时缓解措施：卸载 traceroute-nanog 或设置其二进制文件权限为 000 禁止执行。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "traceroute-nanog 6 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:59:10Z"

