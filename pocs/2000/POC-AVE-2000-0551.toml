[info]
author = "AVE"
description = "检测 HP-UX 11.00 系统上 net.init RC 脚本的不安全临时文件创建漏洞。通过检查 /tmp/stcp.conf 是否可被符号链接攻击利用，验证本地攻击者能否覆写任意系统文件。"
id = "POC-AVE-2000-0551"
name = "HP-UX net.init RC Script 本地文件覆盖漏洞 PoC"
severity = "high"
tags = ["ave-2000-0551"]
vuln_id = [
    "CVE-2000-0702",
    "AVE-2000-0551",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/tmp/stcp.conf"
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["root:"]
