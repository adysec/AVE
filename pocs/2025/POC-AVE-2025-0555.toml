[info]
author = "ave"
description = "验证 Google Chrome V8 类型混淆漏洞（CVE-2025-13223），通过构造恶意 HTML 页面触发 V8 引擎类型混淆导致堆损坏"
id = "POC-AVE-2025-0555"
name = "CVE-2025-13223 PoC"
severity = "high"
tags = ["ave-2025-0555"]
vuln_id = [
    "CVE-2025-13223",
    "AVE-2025-0555",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "CVE-2025-13223",
    "V8",
    "TypeConfusion",
    "TypedArray",
    "heap",
]
