[basic]
description = "Atrium Software Mercur Mail Server 3.30 的 SMTP 服务中存在缓冲区溢出漏洞，由于对 EXPN 命令参数长度缺乏边界检查，远程未经身份认证的攻击者可向目标服务器发送超长的 EXPN 命令，导致栈缓冲区溢出，进而覆盖返回地址实现任意代码执行。该漏洞影响 Atrium Software Mercur Mail Server 3.30 版本，CVSS 评分 10.0（严重级别），攻击向量为网络、攻击复杂度低、无需认证、对机密性/完整性/可用性均造成完全影响。攻击者利用该漏洞可在服务器进程上下文中执行任意系统命令，完全控制邮件服务器主机。"
published = "2001-05-03T04:00:00Z"
remediation = "建议立即迁移至现代受支持的邮件服务器（如 Postfix、Exchange、Zimbra 等），Atrium Mercur Mail Server 3.30 早已停止维护且无官方补丁。若短期无法迁移，请在防火墙层面封锁 SMTP 端口 (25/587) 仅允许可信 IP 访问，并在邮件服务器配置中禁用 EXPN 命令功能（若支持），或部署 SMTP 协议层 WAF 过滤超长 EXPN 命令作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Atrium Software Mercur Mail Server EXPN 缓冲区溢出漏洞"
updated = "2026-06-16T21:54:01Z"

