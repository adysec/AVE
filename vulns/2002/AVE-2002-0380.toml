[basic]
description = "PostgreSQL 7.2.2 之前版本中的 repeat() 函数存在基于堆的缓冲区溢出漏洞。远程攻击者可通过向该函数传入特制参数，使其生成超长字符串触发堆缓冲区溢出，进而导致任意代码执行。该漏洞影响所有 PostgreSQL 7.2.2 之前版本，CVSS 评分 7.5，危害等级高。攻击者无需身份认证即可远程利用，成功利用后可完全控制目标数据库系统。"
published = "2003-01-17T05:00:00Z"
remediation = "升级 PostgreSQL 至 7.2.2 或更高版本，该版本修复了 repeat() 函数中的堆缓冲区溢出漏洞。如无法立即升级，可在应用层限制 repeat() 函数的输入字符串长度，或通过反向代理/WAF 过滤恶意请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "PostgreSQL repeat 函数堆缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:59:15Z"

