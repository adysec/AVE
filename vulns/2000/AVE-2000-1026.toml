[basic]
description = "pam_mysql（MySQL 可插拔认证模块）0.4.7 之前版本在构造 SQL 语句时未正确过滤用户输入，存在 SQL 注入漏洞。远程攻击者无需认证即可利用该漏洞，通过特制输入注入恶意 SQL 代码，导致数据库返回明文密码或哈希值，造成敏感信息泄露。该漏洞影响广泛使用 pam_mysql 进行 MySQL 认证的 Linux 系统。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 pam_mysql 至 0.4.7 或更高版本，该版本已修复 SQL 语句中用户输入未正确过滤的问题。如无法升级，可在 PAM 配置中禁用 pam_mysql 模块，改用其他认证方式（如 pam_unix 或 pam_ldap）作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "MySQL pam_mysql SQL注入漏洞"
updated = "2026-06-16T21:52:51.233"

