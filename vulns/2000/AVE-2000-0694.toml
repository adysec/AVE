[basic]
description = "Shambala Server 4.5 存在拒绝服务漏洞，远程攻击者可通过建立 TCP 连接后立即关闭该连接，导致服务器处理异常连接状态时资源耗尽或进程崩溃，造成服务不可用。该漏洞攻击复杂度低，无需身份认证即可远程触发，影响服务器正常运行。目前已有公开 PoC 利用代码。"
published = "2000-12-19T05:00:00Z"
remediation = "Shambala Server 4.5 已停止维护，官方不再提供补丁。建议立即停止使用该版本，迁移至受支持的替代产品（如 Apache HTTP Server 或 Nginx）。如无法立即替换，可在网络防火墙或主机层面配置规则，仅允许可信 IP 访问 Shambala 服务端口，并部署入侵检测系统监控异常连接行为。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Evolvable Shambala Server 4.5 拒绝服务漏洞"
updated = "2026-06-16T21:52:50Z"

