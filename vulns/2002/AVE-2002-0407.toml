[basic]
description = "B2 2.0.6pre2 及更早版本中 b2edit.showposts.php 文件存在远程文件包含漏洞。该漏洞源于程序在特定配置下未能正确加载 b2config.php 文件，导致 $b2inc 变量可被外部控制。远程攻击者无需身份认证即可通过构造恶意 URL 向 $b2inc 参数传入指向远程服务器上恶意程序的地址，从而在目标服务器上执行任意 PHP 代码，实现完全控制服务器、窃取数据或进行横向渗透。攻击复杂度低，仅需网络访问即可触发。"
published = "2002-08-12T04:00:00Z"
remediation = "B2 已停止维护多年，建议立即迁移至 WordPress 等持续更新的博客平台。若暂时无法迁移，可手动修改 b2edit.showposts.php 文件，在文件开头添加 `$b2inc = dirname(__FILE__) . '/b2config.php';` 以硬编码配置文件路径，防止通过 URL 参数 `b2inc` 引入远程文件。同时将 `allow_url_include` 和 `allow_url_fopen` 在 php.ini 中设为 Off。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "B2 b2edit.showposts.php 远程文件包含漏洞"
updated = "2026-06-16T21:58:02Z"

