[basic]
description = "CVE-2002-1527是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2003-04-02T05:00:00.000"
remediation = "立即升级到 EMU Webmail 5.1 或更高版本，该版本已修复 emumail.cgi 的正则表达式错误处理逻辑。若无法升级，执行以下缓解措施：1) 在 Web 服务器配置中禁用详细错误信息显示（Apache 设置 `Options -Indexes` 并关闭 `ServerTokens`，Nginx 设置 `server_tokens off` 并配置 `error_page` 拦截），阻止路径信息通过错误页面泄露；2) 在 `.htaccess` 或 Nginx 配置中添加 URL 重写规则，拒绝包含 `script` 字符串的请求访问 emumail.cgi；3) 在应用层移除或重命名 emumail.cgi 若不再使用；4) 部署 WAF 规则拦截对 emumail.cgi 的异常请求。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "EmuMail 5.0 Web根目录完整路径泄露漏洞"
updated = "2026-06-16T21:59:29.710"

