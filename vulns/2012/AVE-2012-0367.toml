[basic]
description = "Apple Safari 6.0 之前版本所采用的 WebKit 渲染引擎在处理层叠样式表（CSS）属性值时存在输入验证缺陷，来源跟踪机制不够完善，导致未经身份认证的远程攻击者可通过构造包含特殊 CSS 属性值的恶意网站，诱使用户访问后绕过浏览器的同源策略（Same Origin Policy），实现跨站点信息泄露。该漏洞影响运行 OS X Lion v10.7.4 及更早版本的 Safari 浏览器，攻击者利用此漏洞可读取其他源站点的敏感数据。Apple 已在 2012 年 7 月发布的安全更新中通过改进来源跟踪机制修复此问题。"
published = "2012-07-25T19:55:06.087"
remediation = '建议将 Apple Safari 升级至 6.0 或更高版本以修复该 CSS 跨域绕过漏洞。Mac 用户可通过 Mac App Store 或系统偏好设置中的软件更新功能安装最新版本 Safari。对于 iOS 设备，应升级至 iOS 6.0 或更高版本。如暂时无法立即升级，建议避免访问不受信任的网站，并在 Safari 偏好设置中启用"安全"选项中的"禁止弹出窗口"和"启用欺诈网站警告"功能作为临时缓解措施，同时考虑使用其他现代浏览器替代旧版 Safari。'
score = 5.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari CSS处理跨域漏洞"
updated = "2026-06-16T23:43:44.710"

