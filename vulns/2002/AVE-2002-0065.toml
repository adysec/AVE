[basic]
description = "Safe.pm 是 Perl 语言中用于创建安全沙箱（safe compartment）以执行不可信代码的模块。该漏洞存在于 Safe.pm 2.0.7 及更早版本中，且仅在 Perl 5.8.0 及更早版本环境下触发。攻击者可在 safe compartment 内重新定义子例程参数变量 @_，由于该变量在 Safe::reval 和 Safe::rdo 的连续调用之间未得到正确重置，攻击者可借此突破沙箱限制，执行原本受限制的代码操作。该漏洞影响所有使用旧版 Safe.pm 运行不可信 Perl 脚本的系统环境。攻击者需具备在沙箱中执行 Perl 代码的权限，并利用 @_ 变量的重新定义逐步逃逸安全边界，从而可能导致权限提升或数据泄露。RedHat 将其定级为中等危险。升级至 Safe.pm 更新版本可修复此问题。"
published = "2002-12-11T05:00:00Z"
remediation = "立即升级 Perl 至 5.8.0-14 或更高版本（Debian unstable/woody），该版本包含 Safe.pm 2.0.8 修复补丁，修复了 Safe::reval 和 Safe::rdo 中因 @_ 变量未重置导致的沙箱逃逸漏洞。若无法立即升级，可在 Perl 配置中禁用 Safe::reval 和 Safe::rdo 的使用，或在应用层对用户输入进行严格过滤，防止攻击者通过重定义 @_ 变量突破沙箱隔离。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "Perl Safe.pm 沙箱逃逸漏洞"
updated = "2026-06-16T21:59:06Z"

