[basic]
description = "Microsoft Windows 2000 的 Telnet 服务在创建命名管道时使用了可预测的名称，且未对命名管道进行正确验证。本地低权限攻击者可通过预先创建具有相同可预测名称的命名管道，并将恶意程序与该管道关联，当 Telnet 服务访问该管道时即被触发，从而以系统权限执行任意命令。该漏洞影响 Windows 2000 系统，属于本地权限提升漏洞，攻击者需先获得目标系统的本地访问权限才能利用。成功利用后，攻击者可获得与 Telnet 服务相当的系统级权限，进而完全控制目标主机。"
published = "2001-07-21T04:00:00Z"
remediation = "建议立即为 Windows 2000 应用安全补丁 Q299553（MS01-031），或升级至 Windows 2000 Service Pack 3 以获得完整修复。如暂时无法打补丁，应禁用 Telnet 服务（TlntSvr）并在防火墙中限制 23 端口访问作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows 2000 Telnet 服务本地代码执行漏洞"
updated = "2026-06-16T21:54:08Z"

