[basic]
description = "Intel Express 500 系列交换机在处理特制的畸形 ICMP 数据包时存在拒绝服务漏洞。远程攻击者无需身份认证即可向目标交换机发送精心构造的 ICMP 报文，触发 CPU 崩溃，导致交换机无法正常转发网络流量，造成网络服务中断。攻击条件简单，仅需网络可达即可发起攻击，无需特殊权限。该漏洞影响 Intel Express 500 系列交换机固件版本 2.63 及 2.64。"
published = "2000-11-14T05:00:00Z"
remediation = "该产品已停止支持且无官方补丁，建议升级到最新固件版本或更换为受支持的交换机设备。如无法升级，可在网络边界配置ACL过滤畸形ICMP报文作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Intel Express 500系列交换机 ICMP畸形报文 拒绝服务漏洞"
updated = "2026-06-16T21:52:39Z"

