[basic]
description = "HiNet LP5100 IP电话的Web管理服务存在缓冲区溢出漏洞，远程攻击者可通过向该服务发送超长GET请求触发缓冲区溢出，导致拒绝服务，甚至可能执行任意命令。该漏洞影响HiNet LP5100 IP电话设备，CVSS评分10.0，危害等级严重。攻击者无需身份认证即可通过网络远程利用，攻击复杂度低。"
published = "2000-12-19T05:00:00Z"
remediation = "立即将 HiNet LP5100 IP-Phone 的 Web 管理服务从公网断开，仅允许内网可信 IP 访问管理端口（默认 80）。该产品已停止维护，建议更换为受支持的 IP-PBX 设备。如无法更换，在防火墙上添加规则阻止外部对管理端口的 GET 请求，并限制请求长度。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "HiNet LP5100 IP-phone Web管理服务缓冲区溢出漏洞"
updated = "2026-06-16T21:52:52Z"

