[basic]
description = "McAfee WebShield SMTP 4.5 邮件安全网关在处理畸形格式的收件人（Recipient）字段时存在输入验证缺陷，远程攻击者无需身份认证即可通过向目标 SMTP 服务器发送特制的电子邮件，触发解析异常导致服务崩溃，造成拒绝服务。该漏洞影响 Network Associates WebShield SMTP 4.5 版本，攻击复杂度低，仅需网络访问即可利用，无需用户交互。"
published = "2001-01-09T05:00:00.000"
remediation = "McAfee WebShield SMTP 4.5 已停止维护，官方不再提供安全更新。建议立即升级至受支持的邮件安全网关产品（如 McAfee Email Gateway 或同类替代方案）。如无法升级，可在 SMTP 网关或防火墙上配置规则，过滤收件人地址中包含连续 `%20` 编码空格的异常邮件，并限制 SMTP 端口的访问来源 IP。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "McAfee WebShield SMTP 4.5 收件人字段拒绝服务漏洞"
updated = "2026-06-16T21:53:12.690"

