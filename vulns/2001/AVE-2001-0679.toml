[basic]
description = "Netscape Enterprise Server 3.x 的 Web 发布功能存在拒绝服务漏洞，远程攻击者可通过发送 REVLOG 命令触发该漏洞，导致服务器资源耗尽或服务崩溃，造成拒绝服务。该漏洞影响 Netscape Enterprise Server 3.0 及 3.x 版本，攻击者无需身份认证即可远程利用，攻击复杂度低，仅影响可用性（CVSS 5.0，AV:N/AC:L/Au:N/C:N/I:N/A:P）。攻击者只需向目标服务器发送特制的 REVLOG 请求即可触发漏洞，无需用户交互或特权访问。"
published = "2001-06-02T04:00:00.000"
remediation = "升级到 Netscape Enterprise Server 4.0 或更高版本，应用 2001 年 1 月 25 日的 SAFER 安全公告 (010125.DOS.1.5) 中提供的补丁，或在必要时临时禁用 Web Publishing 功能以缓解 REVLOG 命令滥用风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Netscape Enterprise Server Web Publishing REVLOG 命令拒绝服务漏洞"
updated = "2026-06-16T21:53:57.950"

