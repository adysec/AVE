[basic]
description = "Debian GNU/Linux 中 elvis-tiny 文本编辑器 1.4-10 版本之前存在符号链接攻击漏洞，本地用户可通过创建指向其他用户文件的符号链接，诱导 elvis-tiny 在编辑临时文件时覆盖目标文件，导致文件完整性破坏。该漏洞影响 Debian GNU/Linux 及可能其他 Linux 发行版中的 elvis-tiny 编辑器，攻击向量为本地访问，无需身份认证，攻击复杂度低，CVSS 评分 4.6（AV:L/AC:L/Au:N/C:P/I:P/A:P），危害等级中等。攻击者可利用此漏洞覆盖其他用户文件，可能导致权限提升或数据破坏。建议升级至 elvis-tiny 1.4-11 或更高版本，或改用 vim/nano 等安全编辑器替代。"
published = "2001-01-09T05:00:00Z"
remediation = "立即升级 elvis-tiny 到至少 1.4-11 版本， Debian 用户可通过 `apt-get update && apt-get install --only-upgrade elvis-tiny` 执行升级。如系统无 elvis-tiny 包，可安装 vim/nano 等安全文本编辑器替代方案。如无法立即打补丁，可通过修改默认权限 (`chmod 755 /usr/bin/elvis-tiny`) 和移除必要符号链接访问权等方法进行缓解。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Debian GNU/Linux elvis-tiny 文件覆盖漏洞"
updated = "2026-06-16T21:53:13Z"

