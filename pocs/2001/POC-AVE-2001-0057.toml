[info]
author = "AVE"
description = "通过Internet Explorer访问恶意网页，利用GetObject Javascript函数与htmlfile ActiveX对象读取目标系统任意文件"
id = "POC-AVE-2001-0057"
name = "CVE-2001-0149 PoC"
severity = "medium"
tags = ["cve-2001-0149"]
vuln_id = [
    "CVE-2001-0149",
    "AVE-2001-0057",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["GetObject"]
