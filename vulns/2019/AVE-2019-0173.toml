[basic]
description = "WordPress Meta Box 插件（版本低于 4.16.3）存在访问控制错误漏洞，源于该插件对管理后台 AJAX 请求（wp-admin/admin-ajax.php?action=rwmb_delete_file）中 attachment_id 参数的校验缺失，未能确保请求方具备相应的文件删除权限。已登录的普通用户可通过构造特制的 AJAX 请求向该接口提交任意附件 ID，从而删除目标 WordPress 站点中的文件，造成文件完整性破坏。该漏洞利用无需用户交互，CVSS 评分 6.5，危害等级中等，官方已在 4.16.3 版本中修复此问题。"
published = "2019-08-09T13:15:12Z"
remediation = "建议立即将 WordPress Meta Box 插件升级至 4.16.3 及以上版本，官方已修复通过 admin-ajax.php?action=rwmb_delete_file 接口的越权文件删除漏洞。升级前可通过 WordPress 后台「插件→更新」或手动覆盖 /wp-content/plugins 下的 meta-box 目录完成。若无法立即升级，作为临时缓解措施，可在站点防火墙或 .htaccess/WAF 规则中阻止非登录用户访问 admin-ajax.php 接口，并限制对该 action 的调用权限；同时审计 wp_postmeta 等数据目录权限，仅保留站点管理员具备文件删除入口。建议定期备份数据库及上传目录，降低数据被恶意删除造成的损失。"
score = 6.5
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Meta Box插件任意文件删除漏洞"
updated = "2026-06-17T02:19:01Z"

