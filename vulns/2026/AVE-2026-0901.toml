description = "tags. I can briefly analyze but final answer must be in tags. The output format says I can analyze briefly but final answer must be in tags. To be safe I'll just output the tags with content.<value>ZDI-26-479（CVE-2026-18274）是 Heimdall Data Database Proxy（数据库代理产品）中 uploadJar 方法存在的目录遍历漏洞。该漏洞原理在于程序处理用户可控路径时未进行充分校验便直接将其用于文件操作，攻击者可构造包含路径穿越序列的恶意路径提交给 uploadJar 接口，在目标系统目录之外写入或覆盖任意文件，进而以高权限执行任意代码，对机密性、完整性和可用性均造成高影响。该漏洞可被远程攻击者利用，但利用前须具备有效认证凭据（高权限账号），攻击复杂度低且无需用户交互，CVSS 3.1 评分 7.2，危害等级为高。该漏洞由 ZDI 于 2026 年 7 月 29 日以公告 ZDI-26-479 公开披露。"
published = "2026-01-01T00:00:00Z"
remediation = "建议立即将 Heimdall Data Database Proxy 升级至修复版本 25.03.01.24（详见 https://www.heimdalldata.com/release-notes），以修复 uploadJar 方法中因未对用户可控路径进行校验而导致的目录遍历远程代码执行漏洞。在无法及时升级前，应限制可访问管理接口（uploadJar 功能）的账号权限，仅授予受信任管理员，并对暴露数据库代理的管理端口实施网络访问控制（如仅允许内网可信 IP 访问），同时启用日志审计监控异常的文件上传行为。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "Heimdall Data Database Proxy uploadJar 目录遍历远程代码执行漏洞"
