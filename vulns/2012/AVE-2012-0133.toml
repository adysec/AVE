[basic]
description = "Apple Mac OS X 的 QuickTime 组件在处理特制 MPEG 文件时存在整数溢出漏洞。由于对 MPEG 文件中的某些数据字段长度验证不足，攻击者可通过诱导用户打开恶意 MPEG 文件触发整数溢出，导致堆内存破坏，最终实现远程代码执行或应用程序崩溃。该漏洞影响 QuickTime 7.7.2 之前版本及 Mac OS X 10.7.4 之前系统，攻击者需诱使用户访问恶意网站或打开恶意媒体文件，CVSS 评分 6.8，危害等级中危。Apple 已在 Mac OS X 10.7.4 更新中修复此漏洞。"
published = "2012-05-11T03:49:59.107"
remediation = "升级到 Mac OS X 10.7.4 及以上版本，或升级 QuickTime 到 7.7.2 及以上版本。如无法立即升级，建议不要打开来源不明的 MPEG 文件，并禁用浏览器 QuickTime 插件作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Mac OS X QuickTime MPEG处理整数溢出漏洞"
updated = "2026-06-16T23:38:01.543"

