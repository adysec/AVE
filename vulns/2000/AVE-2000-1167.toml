[basic]
description = "Dansie Shopping Cart 3.04 及更早版本存在隐私信息泄露漏洞。当用户在该购物车系统中执行注册、下单等操作时，应用程序会将用户的敏感信息（包括用户名和密码等凭据）以明文形式通过电子邮件发送到由产品开发人员控制的邮箱地址，而非存储在本地或受保护的数据库中。由于该漏洞通过网络即可触发，无需任何身份认证，攻击复杂度低，任何远程用户均可利用该漏洞获取系统内其他用户的凭据信息，进而造成用户隐私数据泄露和账号被盗用的风险。该漏洞影响所有使用 Dansie Shopping Cart 3.04 及更早版本的网站，攻击者无需具备任何特殊权限即可利用此缺陷窃取用户敏感信息。"
published = "2000-12-31T05:00:00Z"
remediation = "立即升级到 Dansie Shopping Cart 的最新补丁版本（2000 年 4 月发布），该补丁已移除向开发者邮箱发送用户凭证的后门代码。如无法获取补丁，应彻底停用该软件并迁移至其他受支持的购物车系统。同时审查服务器访问日志与邮件发送记录，确认是否存在凭证泄露，并强制要求所有注册用户更改密码。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Dansie Shopping Cart 信息泄露漏洞"
updated = "2026-06-16T21:53:27Z"

