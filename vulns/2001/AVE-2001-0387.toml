[basic]
description = 'Info-ZIP UnZip 5.42 及更早版本存在目录遍历漏洞，攻击者可构造包含 ".." 路径序列的恶意压缩包，诱导用户解压时利用路径穿越跳出预期目录，覆盖系统任意文件。该漏洞原理为解压过程未充分校验文件名路径，允许相对路径穿越。影响范围为所有使用受影响版本 UnZip 的系统，CVSS 2.1 分（本地攻击、低复杂度、无需认证、部分完整性影响）。攻击条件要求受害者手动解压恶意压缩包，利用方式为通过精心设计的文件名实现任意文件写入，可能导致配置文件篡改、权限提升或植入后门。'
published = "2001-07-12T04:00:00Z"
remediation = "升级 Info-ZIP UnZip 至 6.0 或更高版本。如暂时无法升级，应仅解压受信任来源的 ZIP 文件，并使用 unzip 的 -d 参数指定安全的解压目录，避免使用相对路径包含 .. 的压缩包；同时可在脚本中预先检查压缩包内文件名，拒绝包含目录遍历字符的条目。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Info-ZIP UnZip 目录遍历任意文件写入漏洞"
updated = "2026-06-16T21:55:56Z"

