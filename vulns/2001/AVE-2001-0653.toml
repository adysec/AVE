[basic]
description = 'Allaire JRun 3.0 存在目录遍历及敏感文件信息泄露漏洞。远程攻击者可通过向目标服务器发送包含特殊字符"."的畸形URL，绕过访问控制机制，列出WEB-INF目录下的文件列表并读取web.xml配置文件内容。该漏洞无需身份认证即可利用，攻击复杂度低，成功利用后可获取应用程序敏感配置信息，为后续攻击提供辅助。受影响版本为Allaire JRun 3.0，攻击者只需通过网络访问目标JRun服务器即可实施攻击。'
published = "2001-05-03T04:00:00Z"
remediation = '立即将 Allaire JRun 3.0 升级至 3.1 或更高版本以修复漏洞。如暂时无法升级，可在前端部署 URL 过滤规则，拦截包含连续点号（如 ".." 或 "%2e%2e"）的畸形请求，防止攻击者枚举 WEB-INF 目录内容；同时建议在 web.xml 中配置 <security-constraint> 对 /WEB-INF/* 路径实施访问限制。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Allaire JRun 畸形URL目录信息泄露漏洞"
updated = "2026-06-16T21:53:49Z"

