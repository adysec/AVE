description = "CVE-2020-1380是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2020-08-17T19:15:14.553"
remediation = '建议立即安装 Microsoft 2020 年 8 月安全更新：Windows 10 2004 版安装 KB4566782，Windows 10 1909/1903 版安装 KB4565351，Windows Server 2019/Windows 10 1809 版安装 KB4565349，Windows 8.1/Server 2012 R2 安装 KB4571703，或通过 Windows Update 自动获取补丁。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），须优先修复。若暂无法打补丁，可通过组策略将 Internet 区域安全级别设为"高"并禁用 ActiveX 控件和活动脚本，同时限制 JScript/VBScript 仅在信任站点执行，作为临时缓解措施。'
