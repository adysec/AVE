[info]
author = "ave"
description = "验证目标是否受WebKit内存破坏漏洞影响，通过构造恶意HTML触发内存越界访问"
id = "POC-AVE-2012-0332"
name = "CVE-2012-3655 PoC"
severity = "high"
tags = ["ave-2012-0332"]
vuln_id = [
    "CVE-2012-3655",
    "AVE-2012-0332",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/test.html"
protocol = "http"

[poc.requests.headers]
User-Agent = "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_8) AppleWebKit/536.26 (KHTML, like Gecko) Version/6.0 Safari/536.26"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
