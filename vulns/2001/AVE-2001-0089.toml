[basic]
description = "标签之间。<value>PALS Library System WebPALS 1.0 的 pals-cgi 程序存在目录遍历漏洞。该漏洞源于程序对 documentName 参数缺乏有效过滤，未经身份认证的远程攻击者可通过在参数中插入路径穿越序列（如 ../）突破 Web 根目录限制，从而读取服务器文件系统中的任意文件内容。该漏洞无需身份验证即可远程利用，CVSS 评分 5.0，危害等级为中等。攻击者可借此获取敏感配置文件、数据库凭证及其他机密信息，对系统信息安全构成威胁。该漏洞已在 ExploitDB 上公开利用代码，编号为 20631。"
published = "2001-06-02T04:00:00Z"
remediation = '由于 WebPALS 1.0 已停止维护且无官方补丁，建议立即禁用或删除服务器上的 pals-cgi CGI 脚本。如业务暂时无法下线，应在 Web 服务器层面对 documentName 参数进行严格输入过滤，禁止传入包含 ".." 或绝对路径的请求，并在 Web 服务器配置中限制 CGI 脚本的执行权限与可访问目录范围。同时建议在防火墙或 WAF 中拦截包含目录遍历特征的 HTTP 请求。长远来看，应将系统迁移至当前受支持的现代化图书馆管理系统。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "PALS Library System WebPALS 1.0 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:53:54Z"

