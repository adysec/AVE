[info]
author = "AVE"
description = "检测 Adobe Flash Player 21.0.0.226 及更早版本中的 DeleteRangeTimelineOperation 类型混淆漏洞。通过 HTTP 服务向目标浏览器发送 Flash 版本检测页面，若检测到 Flash 版本 ≤ 21.0.0.226 则判定存在漏洞"
id = "POC-AVE-2016-0408"
name = "CVE-2016-4117 Adobe Flash Player 类型混淆漏洞检测 PoC"
severity = "critical"
tags = [
    "cve-2016-4117",
    "flash",
    "type-confusion",
    "rce",
]
vuln_id = [
    "CVE-2016-4117",
    "AVE-2016-0408",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc-ave-2016-0408.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["21.0.0"]
