[basic]
description = "Apple iTunes 使用的 WebKit 引擎存在内存破坏漏洞，版本 prior to 10.7 受影响。远程攻击者可通过构造恶意网页，诱使用户访问后触发内存错误，导致任意代码执行或应用程序崩溃。该漏洞利用条件为攻击者需诱导目标用户访问特制网站，影响范围包括使用受影响版本 iTunes 的 Mac OS X 系统用户。"
published = "2012-09-13T10:30:20.370"
remediation = "立即将 Apple iTunes 升级至 10.7 或更高版本以修复 WebKit 内存破坏漏洞。如暂时无法升级，应避免访问来源不明的恶意网页，防止攻击者通过构造网页触发漏洞导致任意代码执行。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes 内存破坏漏洞"
updated = "2026-06-16T23:43:42.377"

