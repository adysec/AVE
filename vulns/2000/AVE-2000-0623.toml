[basic]
description = "Tigris 远程访问服务器 11.5.4.22 之前版本存在 Radius 计费信息记录缺陷，当用户首次登录认证失败后再次成功登录时，系统未能正确记录 Radius 计费日志，导致安全审计信息不完整。远程攻击者可利用此漏洞绕过登录审计追踪，掩盖未授权访问行为，影响系统的可追溯性和合规性。该漏洞 CVSS 评分 5.0，攻击复杂度低，无需认证即可远程利用。"
published = "2000-06-13T04:00:00Z"
remediation = "升级 Tigris 远程访问服务器至 11.5.4.22 或更高版本。该版本修复了用户首次登录认证失败后再次成功登录时 Radius 计费信息记录不完整的问题。如无法立即升级，可在 Radius 服务器端启用详细日志审计，监控异常认证行为作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Tigris 远程访问服务器登录认证绕过漏洞"
updated = "2026-06-16T21:51:57Z"

