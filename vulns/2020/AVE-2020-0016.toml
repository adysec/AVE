[basic]
description = "标签之间。<value>趋势科技Apex One和Worry-Free Business Security 10.0 SP1在Microsoft Windows平台上存在不当访问控制漏洞。攻击者通过操纵特定产品文件夹可临时禁用安全防护功能，并滥用Windows系统特定函数实现特权升级。成功利用该漏洞需攻击者首先获得在目标系统上执行低权限代码的能力。该漏洞影响运行受影响版本Windows系统的设备，其中Windows 10 1909（OS Build 18363.719）及更高版本已缓解硬链接问题，而之前版本均受影响。攻击者可借此获取系统更高权限，进一步实施恶意操作。"
published = "2020-09-01T19:15:11.870"
remediation = "立即将趋势科技 Apex One 升级至 Build 11480、OfficeScan 升级至 Build 11480、Worry-Free Business Security 10.0 SP1 升级至最新补丁包（通过产品控制台的更新服务或官网下载中心获取）。同时将 Windows 10 升级至 1909 版本（OS Build 18363.719）及以上以启用硬链接缓解机制。如无法立即打补丁，可在组策略中禁用 SeCreateSymbolicLinkPrivilege 权限作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "趋势科技 Apex One 及 Worry-Free Business Security 不当访问控制权限提升漏洞"
updated = "2026-06-17T03:05:45.430"

