[basic]
description = "Van Dyke SecureCRT SSH 客户端 3.4.6 之前版本及 4.0 beta 3 之前版本存在缓冲区溢出漏洞。当客户端连接至恶意 SSH 服务器时，服务器可发送超长的 SSH1 协议版本字符串触发该漏洞，导致客户端程序崩溃或执行任意代码。攻击者只需搭建恶意的 SSH 服务器并诱导用户连接即可完成利用，无需身份认证。Metasploit 框架已集成该漏洞的利用模块，危害等级高。"
published = "2002-10-04T04:00:00Z"
remediation = "升级 Van Dyke SecureCRT 至 3.4.6 或 4.0 Beta 3 及以上版本，该漏洞在后续版本中已修复。如无法升级，可禁用 SSH1 协议支持，仅使用 SSH2 连接服务器，或限制 SecureCRT 仅连接可信的 SSH 服务器以降低被攻击风险。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Van Dyke SecureCRT SSH1 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:58:39Z"

