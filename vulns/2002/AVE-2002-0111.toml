[basic]
description = "STunnel 3.22 之前版本的客户端模式下存在格式字符串漏洞。当 stunnel 作为客户端连接 smtp、pop 或 nntp 服务时，恶意远程服务器可通过在协议协商过程中发送特制的格式字符串数据包触发该漏洞，导致任意代码执行。攻击者无需身份认证即可远程利用，危害严重。受影响的版本包括 stunnel 3.22 之前的所有 3.x 版本。"
published = "2002-01-31T05:00:00Z"
remediation = "立即将 stunnel 升级至 3.22 或更高版本，该版本修复了客户端协商协议中的格式字符串漏洞。若无法立即升级，可临时禁用 stunnel 的 SMTP/POP/NNTP 客户端模式，仅保留服务端模式或在防火墙层面限制出站 SMTP(25)、POP(110)、NNTP(119) 连接的目标来源，待升级完成后恢复完整功能。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "STunnel 客户端格式字符串漏洞"
updated = "2026-06-16T21:56:34Z"

