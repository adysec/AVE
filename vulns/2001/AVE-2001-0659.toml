[basic]
description = "Debian GNU/Linux 中的 sash（简单 shell）工具在 3.4-4 版本之前存在权限提升漏洞。该程序在处理文件复制时未能正确保护 /etc/shadow 文件的权限，导致其被设置为全局可读（world-readable）。具有低权限的本地攻击者可通过密码破解方式获取系统中的用户哈希凭据，进而提升至高权限并完全控制目标系统。该漏洞影响 Debian 系统上安装有旧版本 sash 的场景，攻击者需具备本地访问权限才能触发。Debian 已在后续版本中修复此问题，通过确保 /etc/shadow 在克隆过程中保持适当的权限限制。"
published = "2001-03-26T05:00:00Z"
remediation = "立即将 Debian GNU/Linux 系统中的 sash 软件包升级至 3.4-4 或更高版本，具体操作为：执行 apt-get update && apt-get install sash 完成升级。升级后需验证 /etc/shadow 文件权限为 640（属主 root 可读写、组 shadow 可读），执行 ls -l /etc/shadow 确认。如暂无法升级，应临时禁用普通用户对 sash 的 SUID 执行权限，执行 chmod 0755 $(which sash) 或通过 dpkg --purge sash 移除该软件包以消除风险。升级完成后建议审计系统密码文件访问记录，排查是否存在历史未授权读取行为。"
score = 7.8
severity = "HIGH"
sources = ["cve"]
title = "Debian Linux sash 权限提升漏洞"
updated = "2026-06-16T21:53:51Z"

