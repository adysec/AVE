[basic]
description = "Apple Mac OS X 10.2 中 Terminal.app 处理 telnet:// 协议链接时存在命令注入漏洞，Terminal 1.3 版本未对 URL 中的 Shell 元字符进行有效过滤和转义。攻击者可构造包含分号、反引号、$() 等 Shell 元字符的恶意 telnet:// 链接，诱导用户点击后，Terminal.app 会在解析链接时将嵌入的命令作为本地 Shell 命令执行，导致任意代码执行。该漏洞影响 Mac OS X 10.2 系统，CVSS 评分 7.2（本地攻击向量，低复杂度，无需认证，完全影响机密性/完整性/可用性），属于 CWE-78 操作系统命令注入类型。利用条件为攻击者需诱导受害者点击恶意链接，通常通过邮件、网页或即时通讯软件传播。由于 Terminal.app 默认关联 telnet:// 协议，用户点击链接即自动启动终端并执行注入命令，无需额外交互。"
published = "2002-12-31T05:00:00Z"
remediation = "立即通过 Mac OS X 软件更新功能升级 Terminal 至 1.3.1 或更高版本，或安装 Apple 2002 年 9 月发布的安全更新包；也可直接升级操作系统至 Mac OS X 10.2.1 或后续版本。如暂时无法升级，应避免点击网页、邮件中来源不明的 telnet:// 链接，并在 Terminal 偏好设置中关闭自动打开链接功能，限制此类协议在终端中的自动执行。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Apple Mac OS X 10.2 Terminal.app 远程命令执行漏洞"
updated = "2026-06-16T22:00:15Z"

