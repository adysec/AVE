[basic]
description = "Windows DNS 服务器存在严重远程代码执行漏洞（代号 SigRed），由于 DNS 服务在处理特制 DNS 查询请求时存在整数溢出缺陷，未经身份认证的远程攻击者可向目标 DNS 服务器发送恶意构造的 DNS 响应包触发堆溢出，从而实现远程代码执行。该漏洞影响 Windows Server 2008 至 2019 全系列版本，CVSS 评分 10.0，危害等级严重，且已被 CISA 列入已知被利用漏洞目录。Microsoft 已于 2020 年 7 月安全更新中修复此漏洞，建议立即安装补丁或启用注册表缓解措施。"
published = "2020-07-14T23:15:13Z"
remediation = '立即安装 Microsoft 2020 年 7 月安全更新（KB4569509 或后续累积更新），该补丁已修复 Windows DNS Server 在处理请求时的远程代码执行漏洞。如无法立即打补丁，可设置注册表缓解措施：在 HKLM\SYSTEM\CurrentControlSet\Services\DNS\Parameters 下新建 DWORD 值 TcpReceivePacketSize，数据设为 0xFF00（十进制 65280），然后以管理员身份运行 `net stop dns && net start dns` 重启 DNS 服务。该缓解措施限制入站 TCP DNS 响应包最大为 65280 字节，可阻断利用超大响应包触发的堆溢出攻击。补丁安装后应移除该注册表修改。'
score = 10
severity = "CRITICAL"
sources = ["kev"]
title = "Microsoft Windows DNS 服务器远程代码执行漏洞"
