[basic]
description = "GNU Binutils 2.43 版本的 ld 组件中的 xmemdup.c 文件存在内存泄漏漏洞。该漏洞源于 xmemdup 函数在处理内存分配时未正确释放已分配的内存，导致资源泄漏。远程攻击者可通过构造特制的二进制文件触发该漏洞，但攻击复杂度较高且利用难度较大。成功利用可能导致目标系统资源耗尽，影响程序稳定性。该漏洞 CVSS 评分仅 2.3，危害等级低。GNU 官方已在 master 分支修复此问题，建议用户升级至修复版本。"
published = "2025-02-10T17:15:18Z"
remediation = "升级 GNU Binutils 至 2.45 或更高版本，从 binutils master 分支拉取包含 xmemdup 内存泄漏修复的最新代码重新编译。SUSE Linux 用户可通过 zypper 安装 SUSE-SU-2025:4096-1 更新至 2.45 版本。如无法立即升级，可在 ld 链接过程中避免处理不可信二进制文件作为临时缓解措施。"
score = 2.3
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils ld 组件 xmemdup 内存泄漏漏洞"
updated = "2026-06-17T08:38:28Z"

