[basic]
description = "Netscape Directory Server 4.12 及更早版本存在缓冲区溢出漏洞，该漏洞在处理特制收件人字段时触发，未经身份认证的远程攻击者可通过发送包含异常构造收件人字段的数据包来利用此漏洞，导致服务拒绝或执行任意命令。漏洞影响 Netscape Directory Server 4.12 及更早版本，攻击者无需凭据即可远程利用，CVSSv2 评分为 7.5。"
published = "2001-06-02T04:00:00Z"
remediation = "建议立即将 Netscape Directory Server 升级到 4.13 或更新版本（或迁移至 iPlanet Directory Server 5.x/后续版本），并安装厂商发布的安全补丁以修复 malformed recipient 字段的缓冲区溢出漏洞。如暂时无法升级，应在网络边界通过防火墙或 ACL 限制对目录服务端口（默认为 LDAP 389/TCP 和 LDAPS 636/TCP）的访问，仅允许可信 IP 发起连接，从而降低被远程利用的风险。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Netscape Directory Server 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:47Z"

