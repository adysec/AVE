[basic]
description = 'Apache HTTPD 2.4.0 至 2.4.29 版本中的 `<FilesMatch>` 指令存在正则表达式解析绕过漏洞。由于正则表达式中 `$` 锚点不仅匹配字符串结尾，还可匹配换行符 `\n`，攻击者可通过在恶意文件名末尾附加换行符（如 `\x0A`，对应 URL 编码 `%0a`）构造特制文件名（例如 `shell.php%0a`），使 `<FilesMatch \.php$>` 规则将文件名判定为以 `.php` 结尾，从而绕过服务器对上传文件类型的拦截策略，将 PHP 文件上传至服务器并执行，最终导致远程代码执行或未授权访问。该漏洞影响 Apache HTTP Server 2.4.0 至 2.4.29 版本，攻击者可于远程发起攻击，无需身份认证，但需攻击者能上传文件且服务器启用了基于 `<FilesMatch>` 的文件类型过滤，攻击复杂度较高。'
published = "2018-03-26T15:29:00Z"
remediation = '升级 Apache httpd 至 2.4.30 及以上版本，该版本修复了 <FilesMatch> 中 $ 锚点匹配换行符的问题。如无法立即升级，可将文件上传目录的 <FilesMatch> 规则改为使用 \z 替代 $ 作为结尾锚点，或在应用层对上传文件名做换行符（%0a、%0d）过滤与校验。'
score = 8.1
severity = "HIGH"
sources = ["nuclei"]
title = "Apache HTTPD 换行解析漏洞"
updated = "2026-06-17T01:08:09Z"

