[basic]
description = 'Phorum 3.0.7 的 auth.php3 文件中存在后门漏洞，攻击者只需在 HTTP 请求中将 PHP_AUTH_USER 参数设置为 "boogieman" 即可绕过身份验证，从而访问本应受限的 Web 页面。该漏洞利用门槛极低，无需任何认证即可远程触发，导致敏感信息泄露。影响运行 Phorum 3.0.7 的 Web 服务器，攻击者可通过构造特制 HTTP 请求直接利用。'
published = "2000-12-31T05:00:00Z"
remediation = '立即升级 Phorum 至 3.0.8 或更高版本，该版本已移除 auth.php3 中的硬编码后门密码。如无法升级，手动编辑 auth.php3 文件，删除或注释掉对 `PHP_AUTH_USER` 参数值为 "boogieman" 的认证绕过逻辑。临时缓解措施可在 Web 服务器（Apache/Nginx）层面配置规则，拦截包含 `PHP_AUTH_USER=boogieman` 的 HTTP 请求。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Phorum 3.0.7 auth.php3 后门访问漏洞"
updated = "2026-06-16T21:53:25Z"

