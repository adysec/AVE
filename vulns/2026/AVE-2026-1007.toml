[basic]
description = "GIMP（GNU图像处理程序）在解析ANI动画光标文件时存在整数溢出漏洞。由于缺乏对用户提供数据的充分验证，攻击者可通过构造特制的ANI文件，在缓冲区分配前触发整数溢出，进而在当前进程上下文中执行任意代码。该漏洞影响GIMP的多个版本，攻击者需诱导用户打开恶意ANI文件或访问包含恶意内容的网页才能成功利用。CVSS评分为7.8，危害等级为高。"
published = "2026-04-11T01:16:16Z"
remediation = "建议立即升级 GIMP 至 3.2.4 或更高版本，该版本已修复 ANI 文件解析过程中的整数溢出漏洞。用户应避免打开来源不明的 ANI 动画光标文件，直到完成软件升级。组织管理员可通过软件分发系统批量推送安全更新，或临时禁用 ANI 文件导入功能作为缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "GIMP ANI 文件解析整数溢出远程代码执行漏洞"
updated = "2026-07-15T02:22:38Z"

