[basic]
description = "Windows 2000 Professional 的 Telnet 服务在处理不完整连接请求时未能正确终止会话，远程攻击者可通过连接到 Telnet 服务器但不发送任何输入数据，导致服务资源耗尽而拒绝服务。该漏洞无需身份认证即可利用，攻击条件简单，影响 Windows 2000 系列系统，CVSS 评分 5.0，属于中危漏洞。"
published = "2001-01-09T05:00:00.000"
remediation = "Microsoft 已发布 Windows 2000 Service Pack 1 及后续更新修复此漏洞，请升级至 Windows 2000 SP1 或更高版本。如无法升级，建议在服务管理器中禁用 Telnet 服务（services.msc → Telnet → 停止并禁用），或通过防火墙阻止 TCP 23 端口入站连接作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows 2000 Telnet Service 拒绝服务漏洞"
updated = "2026-06-16T21:53:10.223"

