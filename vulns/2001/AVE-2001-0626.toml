[basic]
description = "getty_ps 2.0.7j 版本中存在本地权限提升漏洞，由于程序在处理文件操作时未正确验证符号链接，本地攻击者可通过创建恶意符号链接诱导目标程序覆盖系统任意文件，导致敏感文件被篡改或系统服务异常。该漏洞攻击复杂度高，需本地用户权限，CVSS 评分 1.2，危害等级低。"
published = "2001-03-12T05:00:00Z"
remediation = "升级 getty_ps 至 2.0.7j 之后的安全版本，或替换为 util-linux 中的 agetty 替代。如无法升级，可限制本地用户对 /tmp 等可写目录的访问权限，并启用文件系统保护机制（如将 /tmp 挂载为 noexec/nodev）以降低 symlink 攻击风险。"
score = 1.2
severity = "LOW"
sources = ["cve"]
title = "getty_ps 2.0.7j 符号链接攻击任意文件写入漏洞"
updated = "2026-06-16T21:53:41Z"

