[basic]
description = "macOS 内核存在内存管理缺陷导致的信息泄露漏洞。由于内核内存管理机制对内存布局信息的访问控制不足，本地攻击者可通过运行恶意应用程序读取内核内存布局数据，从而获取敏感内核信息。该漏洞有助于攻击者绕过内核地址空间布局随机化（KASLR）等安全机制，为后续提权攻击提供信息支撑。攻击者无需获取用户权限或用户交互即可利用，但需要本地访问能力。Apple 已在 macOS Sequoia 15.7.5、macOS Sonoma 14.8.5 及 macOS Tahoe 26.4 中修复此漏洞。"
published = "2026-03-25T01:17:06Z"
remediation = "立即将 macOS 升级至 Sequoia 15.7.5、Sonoma 14.8.5 或 Tahoe 26.4 及以上版本（通过系统设置 > 软件更新安装）。该漏洞通过改进内存管理修复了内核内存布局泄露问题，本地无权限应用可读取内核内存布局信息。如无法立即升级，建议限制不可信应用的安装与运行，并启用 macOS 的 Gatekeeper 和 SIP（系统完整性保护）以降低攻击面。"
score = 6.2
severity = "MEDIUM"
sources = ["zdi"]
title = "Apple macOS 内核内存信息泄露漏洞"
updated = "2026-06-17T10:17:42Z"

