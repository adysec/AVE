[basic]
description = "Recourse ManTrap 1.6.1 蜜罐系统存在隐藏进程泄露漏洞，由于系统未能正确隐藏进程信息，本地攻击者可通过对比 kill 命令执行结果与 /proc 文件系统中的进程列表差异，推断出系统为蜜罐环境。该漏洞影响 Recourse ManTrap 1.6.1 版本，CVSS 2.1 评分（本地访问/低复杂度/无需认证/部分机密性影响），属低危漏洞。攻击者需具备本地访问权限，通过对比进程列表差异即可识别蜜罐环境，从而规避检测或调整攻击策略。Recourse Technologies 已发布更新版本修复此问题。"
published = "2001-01-09T05:00:00.000"
remediation = "建议升级至 Recourse ManTrap 2.0 或更高版本（已停止维护，建议迁移至现代蜜罐解决方案如 Cowrie、Dionaea 或 Conpot）。若必须继续使用，可通过配置 /proc 文件系统权限（mount -o remount,hidepid=2 /proc）隐藏进程列表，并限制本地账户登录权限，仅允许必要的管理账户访问蜜罐系统。建议部署网络层面的访问控制，限制仅授权 IP 访问蜜罐服务端口。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Recourse ManTrap 1.6.1 隐藏的进程泄露"
updated = "2026-06-16T21:53:14.330"

