[basic]
description = "Adobe Flash Player 10.3.183.11之前版本及11.x系列11.1.102.55之前版本（Windows/Mac OS X/Linux/Solaris平台）以及11.1.102.59之前版本（Android平台）和Adobe AIR 3.1.0.4880之前版本中存在未指定的内存破坏漏洞（CWE-119）。攻击者可通过构造特制的Flash内容，远程触发内存破坏，导致任意代码执行或拒绝服务。该漏洞无需认证即可远程利用，CVSS评分10.0，可完全破坏系统机密性、完整性和可用性。"
published = "2011-11-11T16:55:01Z"
remediation = "升级 Adobe Flash Player 至 10.3.183.11 及以上版本（桌面）或 11.1.102.55 及以上版本，Android 版升级至 11.1.102.59 及以上版本；同时升级 Adobe AIR 至 3.1.0.4880 及以上版本。如无法升级，可在浏览器中禁用 Flash 插件或使用 Chrome 内置 PepperFlash 自动更新。由于 Flash 已于 2020 年底停止支持，建议彻底卸载 Flash Player 并迁移至 HTML5。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:31:21Z"

