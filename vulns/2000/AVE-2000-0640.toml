[basic]
description = 'IPFilter 防火墙（3.4.3 及更早版本）存在竞争条件漏洞，当管理员配置了重叠的 "return-rst"（返回RST复位包）与 "keep state"（保持连接状态）规则时，两种规则在状态维护逻辑上产生冲突。远程攻击者可利用该竞争条件，在防火墙规则处理的竞态窗口期间绕过访问控制限制，实现对受保护资源的未授权访问。攻击者无需认证，仅需从网络侧向目标系统发起特定连接请求即可触发该漏洞，CVSS 评分 2.6（低危），主要影响系统完整性。该漏洞已于 2000 年公开披露，建议用户升级至修复后的 IPFilter 版本或调整防火墙规则以避免重叠配置。'
published = "2000-05-26T04:00:00Z"
remediation = '立即升级 IPFilter 至 3.4.4 或更高版本（最终版 5.1.2），从 https://www.phil.uu/~ipfilter/ 下载源码编译安装。若无法立即升级，应在防火墙规则中避免同时使用 "return-rst" 与 "keep state" 重叠规则——将两者拆分为独立规则链或重新排列规则顺序使其不产生状态竞争。对于仍在运行旧版 IPFilter 的系统，建议迁移到 pf（OpenBSD Packet Filter）作为替代方案，pf 在主流 BSD 系统中已默认集成且不存在此竞争条件。'
score = 2.6
severity = "LOW"
sources = ["avd"]
title = "IPFilter 防火墙 竞态条件安全绕过漏洞"
updated = "2026-06-16T21:51:59Z"

