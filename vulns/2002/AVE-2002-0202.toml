[basic]
description = "Linux 内核 2.4.18 及更早版本 x86 系统中的 iBCS（Intel 二进制兼容规范）例程存在安全漏洞，位于 arch/i386/kernel/traps.c 文件中。本地用户可通过二进制兼容接口（lcall 指令）向任意进程发送信号，从而终止目标进程，导致拒绝服务。攻击条件为拥有本地系统访问权限，无需高权限即可利用，影响系统内所有用户进程的可用性。该漏洞 CVSS v2 评分 3.6，危害等级低，Red Hat 和 Debian 均已发布安全公告修复此问题。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 Linux 内核至 2.4.19 及以上版本。Debian 系统可安装对应 DSA-311/DSA-312/DSA-332/DSA-336/DSA-442 安全更新；Red Hat 系统可应用 RHSA-2002:158 提供的补丁。如无法升级内核，可禁用 iBCS 二进制兼容模块（ibcs）作为临时缓解措施。"
score = 3.6
severity = "LOW"
sources = ["redhat"]
title = "Linux Kernel 2.4.18 iBCS二进制兼容接口本地任意进程终止漏洞"
updated = "2026-06-16T21:57:25Z"

