[basic]
description = "Google Chrome 浏览器 Extensions API 存在不当实现漏洞（CWE-451），攻击者可构造特制的 Chrome 扩展程序，诱骗用户执行特定的 UI 交互手势，从而利用该扩展实施界面欺骗（UI Spoofing）攻击。攻击者需要先诱导用户安装恶意扩展并完成特定交互操作，攻击条件较为受限。该漏洞影响 Chrome 133.0.6943.53 之前版本及基于 Chromium 的 Microsoft Edge 等浏览器，CVSS 评分 6.3，危害等级中危。"
published = "2025-02-04T19:15:32Z"
remediation = "立即将 Google Chrome 升级至 133.0.6943.53 或更高版本（通过 chrome://settings/help 自动检查更新）；使用 Microsoft Edge 的用户需升级至 133.0.3065.51 或更高版本。临时缓解措施：在浏览器扩展管理页面禁用所有非官方来源的扩展程序，并启用「增强安全保护」模式。基于 Chromium 的其他浏览器（如 Brave、Opera、Vivaldi）请关注厂商同步更新。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome Extensions API 界面伪造漏洞"
updated = "2026-06-17T08:26:30Z"

