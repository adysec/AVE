[basic]
description = "mpg321 是一款开源的 MP3 音频播放器，其 0.2.9 之前版本存在多处缓冲区溢出漏洞。攻击者可通过向该程序提供超长的 URL 参数（包括命令行选项、HTTP 请求或 FTP 请求中的 URL）触发缓冲区溢出，导致远程代码执行。该漏洞 CVSS 评分 10.0，危害等级严重，攻击者无需身份认证即可利用，影响范围广泛。目前厂商已发布新版本修复此漏洞，建议用户升级至 mpg321 0.2.9 或更高版本。"
published = "2002-05-31T04:00:00Z"
remediation = "立即将 mpg321 升级至 0.2.9 或更高版本。该版本修复了通过命令行参数、HTTP 请求及 FTP 请求中长 URL 触发的缓冲区溢出问题。如无法升级，建议移除 mpg321 或限制其网络访问权限，避免向不可信来源传递超长 URL 参数。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "mpg321 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:57:07Z"

