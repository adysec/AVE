[info]
author = "ave"
description = "检测 Microsoft SharePoint Server 欺骗漏洞（CVE-2025-21393），通过发送 HTTP 请求识别 SharePoint 服务并验证是否存在跨站脚本攻击风险"
id = "POC-AVE-2025-0855"
name = "CVE-2025-21393 SharePoint Spoofing PoC"
severity = "medium"
tags = ["ave-2025-0855"]
vuln_id = [
    "CVE-2025-21393",
    "AVE-2025-0855",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "sharepoint",
    "Microsoft SharePoint",
    "_spPageContextInfo",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/_layouts/15/start.aspx"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "sharepoint",
    "Microsoft SharePoint",
]
