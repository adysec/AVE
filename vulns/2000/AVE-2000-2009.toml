[basic]
description = "Microsoft Exchange 2000 安装程序存在硬编码凭据漏洞。安装Exchange 2000时，系统会自动创建一个具有已知默认密码的用户账户，该密码被硬编码在安装程序中。攻击者一旦获得对服务器的访问权限（无论是在安装期间还是之后），都能利用该默认账户登录并获取管理员级别的权限。该漏洞影响微软Exchange 2000服务器版本，攻击者可通过该用户账户完全控制Exchange服务器环境，包括创建邮箱、修改系统设置、访问所有用户邮件数据，甚至进一步部署恶意代码或窃取敏感信息，从而对企业通信安全造成严重威胁。该漏洞基于CWE-798分类，属于典型的利用硬编码凭据进行权限提升攻击类型。"
published = "2001-01-09T05:00:00.000"
remediation = "立即升级 Microsoft Exchange 2000 至 Rev. A 版本或更高版本（应用微软发布的安全补丁 Q279749）。若暂时无法升级，请立即删除安装过程中创建的默认用户账户或修改其默认密码，并限制该账户的网络访问权限。建议通过 Windows Update 或微软下载中心获取并安装 Exchange 2000 Service Pack 1 及后续安全更新补丁。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Exchange 2000 默认密码权限提升漏洞"
updated = "2026-06-16T21:53:14.187"

