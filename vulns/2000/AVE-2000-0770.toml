[basic]
description = "Poll It CGI 2.01 及更早版本的管理后台存在认证绕过漏洞。远程攻击者无需知道真实管理员密码，只需在登录请求中将 entered_password 和 admin_password 参数设置为相同值，即可绕过身份验证机制，直接访问管理功能。攻击者利用该漏洞可获取敏感配置信息或篡改投票数据，对系统机密性和完整性造成部分影响。该漏洞攻击复杂度低，无需任何权限即可远程利用。"
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 Poll It CGI 至 2.02 或更高版本。如厂商已停止维护，应彻底删除 pollit.cgi 脚本或将其从 Web 服务器中移除。临时缓解措施：在 Web 服务器配置（如 Apache 的 .htaccess）中添加访问控制，仅允许受信 IP 访问 pollit.cgi，并移除该脚本的执行权限（chmod -x pollit.cgi）。"
score = 6.4
severity = "MEDIUM"
sources = ["cve"]
title = "Poll It CGI 2.0 认证绕过漏洞"
updated = "2026-06-16T21:53:05.270"

