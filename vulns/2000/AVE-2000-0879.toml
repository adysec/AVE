[basic]
description = "xpdf PDF 阅读器 0.91 之前版本在处理 PDF 文档中嵌入的 URL 时，未对 URL 中的 shell 元字符进行正确过滤和转义，存在命令注入漏洞。远程攻击者可构造特制的 PDF 文件，在其中嵌入包含 shell 元字符的恶意 URL，当用户使用受影响版本的 xpdf 打开该 PDF 并点击其中的链接时，xpdf 会调用系统浏览器打开该 URL，导致 shell 元字符被解析执行，从而在用户系统上执行任意命令。该漏洞影响 xpdf 0.91 之前所有版本，CVSS 评分 7.6，危害等级高，攻击复杂度较高（需要用户交互），但成功利用后可完全控制受影响的系统。"
published = "2000-10-20T04:00:00.000"
remediation = "升级 xpdf 至 0.91 或更高版本，该版本修复了 URL 中 shell 元字符的过滤问题。如无法升级，可在系统层面禁用 PDF 浏览器内嵌 URL 自动打开功能，或使用其他 PDF 阅读器（如 Evince、Okular）替代。同时建议对用户输入的 PDF 文件来源进行严格审查，避免打开来源不明的 PDF 文档。"
score = 7.6
severity = "HIGH"
sources = ["epss"]
title = "xpdf PDF查看器远程代码执行漏洞"
updated = "2026-06-16T21:52:21.320"

