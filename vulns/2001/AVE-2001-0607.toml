[basic]
description = "HP-UX 11.0 及更早版本中的 Kermit 通信软件存在缓冲区溢出漏洞。由于软件在处理输入数据时缺乏足够的边界检查，本地攻击者可以通过向该软件发送特制的输入数据，触发缓冲区溢出，从而导致系统崩溃引发拒绝服务（DoS），或者在特定条件下以高权限执行任意系统命令，从而获取系统的完全控制权。"
published = "2001-02-12T05:00:00.000"
remediation = "立即安装 HP 针对 Kermit 缓冲区溢出漏洞发布的安全补丁（参考 HP 安全公告 HPSBUX0012-148），将 Kermit 升级至修复版本。如无法立即打补丁，可移除 Kermit 二进制文件的 setuid 权限（chmod u-s /usr/bin/kermit），并限制不可信本地用户的交互式登录作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "惠普 HP-UX Kermit 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:37.670"

