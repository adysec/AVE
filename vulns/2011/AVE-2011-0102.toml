[basic]
description = "Adobe Flash Player 在 ActionScript 虚拟机（AVM）组件中存在基于栈的缓冲区溢出漏洞，攻击者可通过构造特制的 Flash 内容触发栈溢出，从而在受害者系统上执行任意代码。该漏洞影响 Windows、Mac OS X、Linux、Solaris 平台上版本低于 10.3.183.10 的 Flash Player，以及 Android 平台上版本低于 10.3.186.7 的 Flash Player。攻击者仅需诱使用户访问包含恶意 SWF 文件的网页即可触发，无需用户交互授权，CVSS 评分 9.3，危害等级为高危。Adobe 已于 2011 年 9 月发布安全更新修复此漏洞，建议用户尽快升级至 10.3.183.10 及以上版本。"
published = "2011-09-22T03:38:38Z"
remediation = "立即彻底卸载 Adobe Flash Player（该软件已于 2020 年 12 月 31 日终止支持，不再提供安全更新），使用 Adobe 官方卸载工具清理残留组件，并移除浏览器中的 Flash 插件。如业务依赖 Flash 内容，应尽快迁移至 HTML5、WebAssembly 或 WebGL 等现代替代技术方案。对于仍需运行遗留 Flash 应用的场景，建议在隔离网络环境中通过虚拟机运行，并禁止外网访问以降低风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player AVM栈缓冲区溢出漏洞"
updated = "2026-06-16T23:31:18Z"

