[basic]
description = "PHP array_merge() 函数存在堆缓冲区溢出漏洞，源于 zend_hash_num_elements() 预计算元素数量时发生整数溢出。当打包数组的总元素数超过 32 位限制或 HT_MAX_SIZE 时，预计算溢出导致内存分配不足，进而触发堆缓冲区溢出，可能导致内存损坏、服务崩溃，影响服务器完整性和可用性。影响 PHP 8.1.34 前版本、8.2.30 前版本、8.3.29 前版本、8.4.16 前版本及 8.5.1 前版本。攻击者可通过构造超大数组调用 array_merge() 触发漏洞，攻击向量为网络 (AV:N)，攻击复杂度高 (AC:H)，无需权限 (PR:N) 和用户交互 (UI:N)，CVSS 3.1 评分 6.5 (MEDIUM)，影响完整性 (I:L) 和可用性 (A:H)。PHP 官方已在 8.1.34、8.2.30、8.3.29、8.4.16、8.5.1 版本中修复该漏洞，建议尽快升级至修复版本。"
published = "2025-12-27T20:15:40Z"
remediation = "建议立即升级 PHP 到以下安全版本：PHP 8.1 升级至 8.1.34+、PHP 8.2 升级至 8.2.30+、PHP 8.3 升级至 8.3.29+、PHP 8.4 升级至 8.4.16+、PHP 8.5 升级至 8.5.1+。旧版本 PHP 7.2/7.3 可应用 centminmod 提供的补丁（php7234-cve-2025-14178.patch / php7331-cve-2025-14178.patch）。若无法立即升级，可通过限制 array_merge() 处理的数组大小（避免超过 32 位限制）或在应用层限制数组元素总数作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "PHP array_merge() 函数堆缓冲区溢出漏洞"
updated = "2026-06-17T08:35:27Z"

