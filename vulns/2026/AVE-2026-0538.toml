[basic]
description = "Adobe Acrobat Reader 存在释放后使用漏洞，影响版本包括 24.001.30307、24.001.30308、25.001.21265 及更早版本。攻击者可构造恶意 PDF 文件，诱导受害者打开后触发内存释放后重用错误，导致在当前用户上下文中执行任意代码。该漏洞利用需要用户交互（打开恶意文件），CVSS 评分 7.8（HIGH），攻击向量为本地，完整性/机密性/可用性均受高影响。"
published = "2026-03-10T22:16:18Z"
remediation = "立即升级 Adobe Acrobat Reader 至最新版本：Acrobat Reader DC Continuous 用户升级到 25.001.21288 及以上版本，Acrobat Classic 用户升级到 24.001.30356 及以上版本。可通过「帮助 > 检查更新」自动安装，或从官网下载完整安装包。临时缓解措施：在受信任环境中禁用 PDF 文件的自动打开行为，避免打开来源不明的 PDF 文档，并启用 Adobe Reader 的受保护视图（编辑 > 首选项 > 安全性（增强）> 启动时启用增强安全功能）。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Adobe Acrobat Reader 释放后使用漏洞"
updated = "2026-06-17T10:26:57Z"

