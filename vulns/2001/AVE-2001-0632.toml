[basic]
description = "Trend Micro InterScan VirusWall 3.6.x 及更早版本在卸载产品时未正确处理符号链接，而是直接跟随指向的目标文件路径执行操作。本地低权限攻击者可预先创建指向系统关键文件的符号链接，当管理员执行产品卸载操作时，卸载程序会跟随该符号链接并覆盖目标文件，从而破坏系统文件完整性。该漏洞仅影响本地已登录用户，攻击需要较高复杂度（需配合管理员执行卸载流程），CVSS 评分 1.2，危害等级低。"
published = "2001-03-12T05:00:00Z"
remediation = "升级 Interscan VirusWall 至 Trend Micro 发布的修复版本（3.6.x 之后的版本），或应用 Trend Micro 官方安全补丁以消除卸载过程中跟随符号链接的风险。若无法立即升级，应暂时以 root 权限运行卸载程序，并在卸载前确保卸载目录下不存在任何可疑符号链接，同时限制普通本地用户对系统关键目录的写入权限，以降低符号链接攻击面。"
score = 1.2
severity = "LOW"
sources = ["cve"]
title = "趋势科技 Interscan VirusWall 任意文件写入漏洞"
updated = "2026-06-16T21:53:43Z"

