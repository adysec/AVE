[basic]
description = "Linux 内核 UDP 协议栈存在条件竞争漏洞。当 UDP socket 通过 connect() 更改本地地址时，在地址变更完成但哈希表（包括二次哈希和四元组哈希）尚未更新的时间窗口内，查找操作可能无法找到该 socket，导致后续数据报无法送达。攻击者可通过在目标系统上构造并发 UDP 通信场景触发此竞态条件，造成 UDP 数据包丢失并触发 ICMP 端口不可达错误，最终导致拒绝服务。该漏洞影响 Linux 内核多个版本，CVSS 评分 4.7，危害等级中危。Linux 内核社区已通过合入补丁修复此问题。"
published = "2025-02-27T02:15:10Z"
remediation = "升级 Linux 内核至 6.12.13、6.13.2 或 6.14 及以上版本，其中已合入 udp rehash 竞态修复补丁。对于无法立即升级的系统，可限制 UDP 应用使用 connect() 绑定地址的场景，或通过内核实时补丁 (kpatch/kgraft) 加载修复补丁作为临时缓解。"
score = 4.7
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Kernel UDP 套接字地址变更与重哈希竞争条件漏洞"
updated = "2026-06-17T08:14:21Z"

