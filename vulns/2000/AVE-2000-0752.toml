[basic]
description = "Cisco Secure PIX Firewall 5.2(2) 版本在处理 FTP 被动模式（PASV）请求时存在内部地址泄露漏洞。远程攻击者可通过向目标 FTP 服务器发送大量 PASV 请求，强制服务器在被动模式建立时在响应中包含其真实内部 IP 地址，从而绕过防火墙的地址转换（NAT）保护机制获取目标服务器的真实内网地址。该漏洞可能导致攻击者进一步探测内网拓扑结构，为后续攻击提供信息基础。攻击无需认证，仅需网络访问权限即可利用，CVSS 评分 5.0，危害等级中危。"
published = "2000-12-11T05:00:00Z"
remediation = "升级 Cisco PIX Firewall 软件至 5.2(3) 或更高版本，该版本修复了 FTP PASV 模式响应中未正确转换内部 IP 地址的问题。如无法立即升级，可在 PIX 配置中使用 `fixup protocol ftp 21` 命令确保 FTP 检查引擎正常工作，并考虑禁用不必要的 FTP 被动模式连接或限制外部发起的 FTP 数据连接。作为深度防御，可在边界 ACL 中限制对内部 FTP 服务器的外部访问。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Cisco Secure PIX Firewall PASV 模式 FTP 内部地址泄露漏洞"
updated = "2026-06-16T21:53:00Z"

