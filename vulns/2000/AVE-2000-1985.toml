[basic]
description = "CiscoSecure ACS Server 2.4(2) 及更早版本在处理 TACACS+ 协议数据包时存在缓冲区溢出漏洞。远程攻击者无需身份验证即可通过向目标系统发送特制的超大 TACACS+ 数据包触发该漏洞，成功利用可导致服务拒绝，并可能进一步执行任意系统命令，从而完全控制受影响设备。该漏洞影响部署 CiscoSecure ACS Server 的网络设备，CVSS 评分 10.0，危害等级为严重。"
published = "2000-12-11T05:00:00.000"
remediation = "将 CiscoSecure ACS Server 从 2.4(2) 及更早版本升级到 2.4(3) 或更高版本，该版本修复了 TACACS+ 数据包处理中的缓冲区溢出漏洞。如无法立即升级，应在防火墙或路由器上配置访问控制列表（ACL），仅允许受信任的 TACACS+ 客户端源 IP 访问服务器的 UDP/TCP 49 端口，作为临时缓解措施。升级后请重启 CiscoSecure ACS 服务并验证 TACACS+ 认证功能正常运行。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Cisco CiscoSecure ACS Server 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:03.797"

