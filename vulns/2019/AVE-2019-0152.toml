[basic]
description = "tags.<value>WordPress Laborator Neon 主题 2.0 存在跨站脚本（XSS）漏洞，攻击者可通过向 `data/autosuggest-remote.php` 端点的 `q` 参数注入恶意脚本代码，触发浏览器执行任意 JavaScript。该漏洞影响使用 Laborator Neon 主题的 WordPress 网站，攻击条件为诱使已登录用户点击精心构造的恶意链接，利用用户浏览器的同源策略绕过机制在受害页面中注入恶意内容。CVSS 评分为 6.1（中等），危害等级中等。"
published = "2019-12-30T18:15:16.857"
remediation = "建议立即升级 Laborator Neon 主题至修复版本；若无更新，建议更换为官方维护的现代主题。临时缓解措施为手动修改 data/autosuggest-remote.php 文件，对 q 参数调用 esc_html() 或 sanitize_text_field() 函数进行严格过滤。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Laborator Neon 主题 跨站脚本漏洞"
