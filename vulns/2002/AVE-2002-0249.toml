[basic]
description = "Bugzilla 2.14 版本（2.14.2 之前）及 2.16 版本（2.16rc2 之前）存在权限绕过漏洞。由于系统未正确处理浏览器生成的 URL 编码字段名，当攻击者通过 buglist.cgi 提交包含 URL 编码字段名的 HTTP 请求时，某些字段会被错误识别为未设置状态，从而导致缺陷（bug）的组访问权限被意外移除。未经身份认证的远程攻击者可利用此漏洞，绕过 Bugzilla 的访问控制机制，获取本不应被授权的缺陷信息或执行未授权操作。该漏洞影响部署了受影响版本 Bugzilla 缺陷跟踪系统的组织，CVSS v3 评分 7.5，危害等级为高。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 Bugzilla 至 2.14.2 或更高版本（2.16 分支升级至 2.16rc2 或更高版本），并应用官方补丁修复 URL 编码字段名解析问题。如无法立即升级，可配置 Web 服务器在转发请求前对 buglist.cgi 的 URL 参数进行解码预处理，确保浏览器传入的 %2D 格式字段名被正确识别。Red Hat 用户应安装 RHSA-2002:109 安全更新以修复受影响软件包。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Mozilla Bugzilla URL编码访问控制绕过漏洞"
updated = "2026-06-16T21:58:10Z"

