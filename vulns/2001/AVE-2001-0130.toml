[basic]
description = 'tags as required.<value>War FTP Daemon 1.67.04 中存在目录遍历漏洞，未经身份认证的远程攻击者可通过发送包含 "dir *./../.." 的特殊 FTP 命令绕过目录访问限制，列出服务器目录内容并可能读取敏感文件。该漏洞影响运行 War FTP 1.67.04 版本的所有系统，攻击者无需凭证即可利用，主要危害为信息泄露。攻击者通过 FTP 协议向目标服务器发送特制的目录遍历命令即可触发漏洞，获取服务器文件系统的目录结构和文件内容。'
published = "2001-05-03T04:00:00Z"
remediation = '建议立即停止使用 War FTPd 1.67.04，并迁移至支持现代安全标准的 FTP 服务器软件（如 FileZilla Server 或 ProFTPD）。若必须临时使用，请在服务器端配置严格的根目录限制（Chroot），禁止用户通过 ".." 等路径指令访问根目录以外的文件系统。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Jarle Aase War FTP 目录遍历漏洞"
updated = "2026-06-16T21:54:02Z"

