[basic]
description = "标签包裹输出。<value>SonicOS 存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过向防火墙发送特制恶意请求触发该漏洞，造成拒绝服务并可能执行任意代码。该漏洞影响 SonicOS Gen 6 的 6.5.4.7、6.5.1.12、6.0.5.3 版本、SonicOSv 6.5.4.v 版本以及 Gen 7 的 7.0.0.0 版本。攻击者无需任何凭据且无需用户交互即可远程利用，CVSS 评分 9.8，危害等级严重。"
published = "2020-10-12T11:15:12Z"
remediation = "建议立即升级SonicOS到最新版本7.0.0.1或更高版本。如无法立即升级，可临时封禁SonicOS防火墙管理端口（如443、4430等）以阻止远程攻击；同时强化访问控制，仅允许授权管理端连接，并启用SonicOS的入侵防护功能以检测缓冲区溢出攻击。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "SonicWall SonicOS 防火墙远程缓冲区溢出远程代码执行漏洞"
updated = "2026-06-17T03:20:57Z"

