[basic]
description = "Apple Safari 6.0 之前版本（含 Safari 5.1.7 及更早版本）所使用的 WebKit 渲染引擎存在内存破坏漏洞。远程攻击者可通过构造恶意网页，触发 WebKit 在解析网页内容时发生内存损坏，导致应用程序崩溃或远程代码执行。该漏洞影响 macOS 和 iOS 平台上的 Safari 浏览器，攻击者无需任何认证即可通过网络向目标用户发送包含恶意代码的网页，诱导用户访问即可实施攻击。Apple 已在 2012 年 7 月发布的安全公告中修复此漏洞，建议用户升级至 Safari 6.0 或更高版本。"
published = "2012-07-25T20:55:02Z"
remediation = "建议立即升级 Safari 至 6.0 或更高版本（随 OS X 10.8 Mountain Lion 发布），或通过“软件更新”安装 Apple 2012-003 安全补丁（APPLE-SA-2012-07-25-1）。若无法立即升级，可暂时禁用 JavaScript 并避免访问不可信网站作为缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:32Z"

