[info]
author = "ave"
description = "检测 Agora.CGI 3.x/4.0 调试模式下 cart_id 参数反射型 XSS 漏洞。通过向 /store/agora.cgi 发送包含 <SCRIPT> 标签的 cart_id 参数，验证服务器是否将未过滤的脚本代码回显到响应页面中。"
id = "POC-AVE-2001-0485"
name = "Agora.CGI Debug Mode Cross-Site Scripting PoC"
severity = "medium"
tags = ["ave-2001-0485"]
vuln_id = [
    "CVE-2001-1199",
    "AVE-2001-0485",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/store/agora.cgi"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<SCRIPT>alert(document.domain)</SCRIPT>"]
