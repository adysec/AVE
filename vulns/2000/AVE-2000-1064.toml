[basic]
description = "CiscoSecure ACS Server 2.4(2)及更早版本存在LDAP认证绕过漏洞。当后端LDAP服务器允许空密码时，远程攻击者无需有效凭据即可通过向CiscoSecure ACS服务器发送空密码认证请求，绕过LDAP身份验证机制，从而未授权访问受保护的网络资源。该漏洞影响CiscoSecure ACS Server 2.4(2)及之前版本，攻击者无需身份认证即可远程利用，可能导致未授权访问、敏感信息泄露及权限提升等严重后果。"
published = "2000-12-11T05:00:00.000"
remediation = "升级 CiscoSecure ACS Server 至 2.4(3) 或更高版本，该版本已修复空密码 LDAP 认证绕过问题。同时配置后端 LDAP 服务器（如 OpenLDAP、Active Directory）拒绝空密码/空字符串绑定请求，在 LDAP 服务器策略中启用密码最小长度检查并禁用匿名绑定。若无法立即升级，在防火墙上限制对 ACS 服务器 TCP 389/636 端口的访问来源，仅允许受信任的管理网段连接。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Cisco Secure ACS Server LDAP 认证绕过漏洞"
updated = "2026-06-16T21:53:03.910"

