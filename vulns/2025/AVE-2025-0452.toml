[basic]
description = "Google Chrome for Android 的 Omnibox（地址栏）存在实现不当漏洞（CWE-290），远程攻击者可通过构造特制的 HTML 页面，在无需用户交互的情况下欺骗 Omnibox 显示虚假的 URL 内容，导致用户误判当前访问的网站身份。该漏洞影响 Chrome for Android 141.0.7390.54 之前版本，攻击者可利用此漏洞实施钓鱼攻击或诱导用户泄露敏感信息，对机密性造成高影响，对完整性造成低影响，CVSS 评分 8.2，危害等级高危。Google 已在 Chrome 141.0.7390.54 版本中修复此漏洞。"
published = "2025-11-06T22:15:38Z"
remediation = "立即将 Android 端 Google Chrome 升级至 141.0.7390.54 或更高版本（通过 Google Play 商店更新）；Linux 发行版用户更新至 chromium-141.0.7390.122 或更高版本。临时缓解措施可禁用不可信来源的 HTML 页面渲染或使用安全浏览器内核替代。"
score = 8.2
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome Android 版 Omnibox 不当实现漏洞"
updated = "2026-06-17T08:29:51Z"

