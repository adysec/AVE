[basic]
description = "Nuxt Server Islands 通过 `/__nuxt_island/` 端点接收组件属性。当应用程序的 Server Island 组件将攻击者可控的属性直接传递至 Vue 动态组件解析机制（`<component :is>`、`resolveDynamicComponent` 或 `h()`）时，攻击者可通过发送纯字符串值而非组件定义的方式，实例化全局注册的任意 Vue 组件或原生 HTML 元素（如 `iframe`）。该漏洞无需启用 `vue.runtimeCompiler`，仅需通过 `as` 等属性即可触发动态组件解析。使用 `@nuxt/ui`（基于 reka-ui）等提供多态 `as`/`asChild` 属性的组件库的应用程序受影响尤为明显，因为未声明的属性会通过属性透传机制自动落入根元素的动态组件解析路径。影响版本包括 Nuxt 3.1.0 至 3.21.10 以及 4.0.0 至 4.5.1。攻击者可利用此漏洞导致敏感信息泄露或构建恶意用户界面，但无法通过此向量直接执行任意 JavaScript。Nuxt 已在 3.21.10 和 4.5.1 版本中通过拒绝顶级 `as` 岛属性（返回 HTTP 400）修复该问题。"
published = "2026-08-05T22:17:08Z"
remediation = "建议立即将 Nuxt 升级至 3.21.10 或 4.5.1 版本，补丁版本会拒绝通过 /__nuxt_island/ 端点传递顶级 as 属性，阻断通过动态组件解析的未授权实例化攻击路径。若暂无法升级，应在 server island 组件中显式声明所接受的 props，并设置 inheritAttrs: false，防止未声明的 as 属性透传到根组件；同时避免将敏感组件注册为全局组件。此外，禁止将未受信的 island props 直接传入 <component :is>、resolveDynamicComponent 或 h()，应改为通过白名单映射导入的组件定义。"
score = 4.8
severity = "MEDIUM"
sources = ["ghsa"]
title = "Nuxt 框架 Server Island 未授权动态组件实例化漏洞"
updated = "2026-08-06T16:16:53Z"

