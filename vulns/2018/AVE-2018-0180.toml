[basic]
description = "WordPress 的 Oturia Smart Google Code Inserter 插件 3.5 版本之前存在认证绕过漏洞。该插件的 smartgooglecode.php 文件中的 saveGoogleCode() 函数未对当前请求进行用户身份验证，导致任何未经认证的攻击者可通过 sgcgoogleanalytic 参数向 WordPress 所有页面注入任意 JavaScript 或 HTML 代码。攻击者无需任何权限，仅需构造特制 HTTP 请求即可利用该漏洞，成功利用可在目标站点上执行任意脚本，窃取用户会话 Cookie、重定向至恶意站点或篡改页面内容，CVSS 评分 9.8，危害等级严重。"
published = "2018-01-01T06:29:00.217"
remediation = "立即将 Oturia Smart Google Code Inserter 插件升级到 3.5 或更高版本，该版本在 smartgooglecode.php 的 saveGoogleCode() 函数中增加了权限检查，阻止未授权用户修改插入代码。如无法升级，可暂时禁用该插件，或通过 Web 服务器配置（如 .htaccess）限制对 /wp-content/plugins/smart-google-code-inserter/ 目录的访问。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Oturia WordPress Smart Google Code Inserter 插件认证绕过漏洞"
updated = "2026-06-17T01:57:49.750"

