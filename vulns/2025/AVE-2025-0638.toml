[basic]
description = ".NET、.NET Framework 及 Visual Studio 存在远程代码执行漏洞。该漏洞源于相关组件在解析特制的 .NET 程序集（assembly）时对输入数据校验不充分，导致内存内容被错误处理，攻击者可通过诱导用户打开恶意项目文件或编译并加载包含缺陷的代码，进而在目标系统上以当前用户权限执行任意代码。成功利用该漏洞可导致信息泄露、权限提升乃至完全控制受影响系统。攻击前提是受害用户需先打开或执行攻击者提供的恶意文件或程序集，攻击展现了较高的复杂度评估而非高。Microsoft 已发布安全更新缓解，建议用户及时应用相关修复程序并避免打开不可信来源的文件。"
published = "2025-01-14T18:15:30Z"
remediation = '请立即安装 Microsoft 2025 年 1 月安全更新，升级 .NET/.NET Framework/Visual Studio 至包含修复的版本：.NET 8.0 升级到 8.0.13 及以上、.NET 9.0 升级到 9.0.4 及以上，.NET Framework 安装对应 "January 2025" 更新 KB；Visual Studio 通过检查更新升级到已修复的 2022 17.x 最新版本。可通过 nuget.org 下载补丁包或使用 dotnet-install 脚本更新运行时/SDK，Windows 用户使用 Windows Update 自动获取 .NET Framework 补丁。若无法立即升级，限制信任边界访问，仅运行来自可信来源的未验证输入内容，并在部署环境降低攻击面，同时关注 Microsoft 公告 3212824 以获取更新。'
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft .NET、.NET Framework 及 Visual Studio 远程代码执行漏洞"
updated = "2026-06-17T08:42:42Z"

