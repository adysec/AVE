[basic]
description = "WordPress wsecure 插件 2.4 之前版本中存在远程代码执行漏洞，该插件在 wsecure-config.php 文件的 publish 参数中未对用户输入进行有效过滤，导致攻击者可通过在参数中注入 shell 元字符实现远程命令执行。攻击者需拥有 WordPress 后台的发布权限（低权限），无需用户交互即可通过网络远程触发。成功利用该漏洞可导致目标网站被完全控制，造成数据泄露、网站篡改等严重后果。"
published = "2019-09-16T13:15:10Z"
remediation = "立即将 WordPress wsecure 插件升级至 2.4 或更高版本，该版本修复了 wsecure-config.php 中 publish 参数未正确过滤 shell 元字符导致的远程代码执行漏洞。如无法升级，可删除或重命名 wsecure 插件目录下的 wsecure-config.php 文件，并禁用该插件。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress wsecure插件 远程代码执行漏洞"
updated = "2026-06-17T00:40:42Z"

