[basic]
description = "Windows 2000系统在处理硬件断点时存在安全漏洞，当本地用户通过全局调试寄存器设置硬件断点时，会引发系统异常，导致其他进程终止并破坏资源完整性。该漏洞影响Windows 2000操作系统，攻击者无需远程认证即可通过操控硬件断点触发系统异常，从而造成拒绝服务和权限提升，严重威胁系统安全。"
published = "2001-05-24T04:00:00Z"
remediation = '建议立即升级到受支持的 Windows 版本（如 Windows 10/11 或 Windows Server 2019/2022），Windows 2000 已于 2010 年 7 月终止支持，不再接收安全更新。如无法升级，通过本地安全策略限制非管理员用户的交互式登录权限，并在组策略中移除 Users 组的"调试程序"特权（SeDebugPrivilege），防止低权限用户设置硬件断点触发异常导致系统崩溃或提权。'
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Windows 2000 调试寄存器本地权限提升漏洞"
updated = "2026-06-16T21:56:05Z"

