[basic]
description = "Mozilla Firefox 3.6.26之前版本及4.x至9.0版本、Thunderbird 3.1.18之前版本及5.0至9.0版本、SeaMonkey 2.7之前版本中存在内存破坏漏洞。该漏洞源于nsChildView数据结构初始化不当，远程攻击者可通过诱使用户打开特制的Ogg Vorbis音频文件触发内存破坏，导致拒绝服务（应用程序崩溃）或可能执行任意代码。攻击无需身份认证，CVSS评分10.0，危害等级严重。"
published = "2012-02-01T16:55:01Z"
remediation = "升级 Firefox 至 3.6.26 或 10.0 及以上版本，Thunderbird 升级至 3.1.18 或 10.0 及以上版本，SeaMonkey 升级至 2.7 及以上版本。可通过各产品内置自动更新功能或从官网下载最新版安装。如无法立即升级，建议禁用 Ogg Vorbis 相关插件或使用内容安全策略限制媒体文件解析作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/SeaMonkey/Thunderbird Ogg Vorbis 文件解码内存破坏漏洞"
updated = "2026-06-16T23:37:16Z"

