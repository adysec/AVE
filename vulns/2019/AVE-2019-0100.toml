[basic]
description = "Kentico CMS 的 staging 服务存在安全头验证缺陷，未经身份认证的远程攻击者可向该服务发送特制请求绕过初始认证，触发对用户可控 .NET 对象的反序列化操作，进而实现远程代码执行。该漏洞影响 Kentico 9.x、10.0.x（低于 10.0.52）、11.0.x（低于 11.0.48）及 12.0.x（低于 12.0.15）版本，CVSS 评分 9.8，危害等级严重。攻击无需任何权限或用户交互，仅需通过网络发送特制 HTTP 请求即可利用。"
published = "2019-03-26T18:29:00.403"
remediation = "立即将 Kentico 升级至 12.0.15、11.0.48、10.0.52 或对应 9.x 修复版本，官方已修复 staging 服务对安全头的验证缺陷。如无法立即升级，可在反向代理或防火墙层面限制对 staging 服务端口的未授权访问，并禁用 .NET 反序列化不受信任的输入。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Kentico CMS 反序列化远程代码执行漏洞"
updated = "2026-06-17T02:10:09.030"

