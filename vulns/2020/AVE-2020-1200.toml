[basic]
description = "Apple XNU 内核中存在内存初始化漏洞，由于接收 Mach 消息时对消息 trailer 元素大小的计算存在错误，当请求无效的 trailer 元素组合时，内核会返回未初始化的内存数据，导致攻击者可以从 kalloc 内存池中泄露残留的内核数据。该漏洞影响 iOS 14.1 及更早版本、iPadOS 14.2 及更早版本、macOS Catalina 10.15.7 及更早版本、watchOS 7.1 及更早版本等多款 Apple 产品。攻击条件为攻击者需在目标设备上执行恶意应用程序，通过精心构造 Mach 消息并请求特定的 trailer 元素，即可触发该信息泄露漏洞。利用方式为攻击者首先使用带外端口描述符来填充 kalloc 大小类中的内核指针，随后释放这些内存分配并重新分配为 Mach 消息，在接收消息时触发漏洞以读取目标指针的值，通过调整消息大小可逐字节泄露内核内存地址，该漏洞曾被用于 iOS 漏洞链中配合 Safari 远程代码执行漏洞实现完整的攻陷过程。Apple 已在 iOS 14.2、iPadOS 14.2、macOS Big Sur 11.0.1、macOS Catalina 10.15.7 更新及 watchOS 7.1 等版本中修复此漏洞。"
published = "2020-12-08T21:15:13Z"
remediation = "建议立即升级至 Apple 已发布的安全更新版本：iOS 14.2、iPadOS 14.2、macOS Big Sur 11.0.1、macOS Catalina 10.15.7 Supplemental Update、Security Update 2020-006（High Sierra 与 Mojave）、watchOS 7.1、watchOS 6.2.9、watchOS 5.3.9 或 iOS 12.4.9，具体选择对应设备当前系统版本的安全更新。如设备暂不支持最新系统，应通过「设置」>「通用」>「软件更新」立即安装可用更新。若因合规或业务原因无法立即升级，可在 MDM 或配置描述文件中限制安装来源为 App Store 已知开发者，并禁用未签名 App 执行，同时启用沙盒与系统完整性保护（SIP）以降低内核内存泄露风险。对于无法打补丁的旧设备，建议评估是否通过网络访问控制限制其暴露面，避免运行来自不可信来源的应用。"
score = 5.5
severity = "MEDIUM"
sources = ["kev"]
title = "Apple 多款产品 内存初始化信息泄露漏洞"
updated = "2026-06-17T03:09:55Z"

