[basic]
description = "Allaire JRun 2.3.3 的 Java Servlet 引擎存在跨站脚本注入与远程代码执行缺陷，属于高危漏洞。其原理在于 com.livesoftware.jrun.plugins.JSP Servlet 组件在编译处理 JSP 代码时未对用户输入进行充分过滤与校验，远程攻击者可通过跨站脚本（CSS）方式向目标服务器提交特制的恶意 JSP 代码，随后直接调用该 JSP Servlet 使其在服务器端被编译并执行，从而实现任意代码执行。该漏洞影响 Allaire JRun 2.3.x 系列版本，攻击者无需任何认证，仅需具备基本的网络访问能力即可远程触发，攻击复杂度低。一旦被成功利用，攻击者可完全控制受影响服务器，CVSS 评分高达 10.0，危害等级为严重，建议尽快升级至 JRun 3.0 或更高版本以彻底修复。"
published = "2000-12-11T05:00:00Z"
remediation = """
The task is to generate the [remediation] field for CVE-2000-1053. The current remediation field is failing validation because it's considered empty. I need to output the value between <value></value> tags. Should be ≥20 chars Chinese, specific actionable steps, mention fixing version (JRun 3.0).

The current remediation content is actually good but has some stray "tags." prefix and `<value>` wrapper text pollution. Let me produce a clean version.<value>建议立即升级至 Allaire JRun 3.0 或更高版本，2.3.3 及更早版本已不再提供安全维护。若无法立即升级，请采取以下缓解措施：在 Web 容器与应用层启用输出编码过滤，对传入参数中的 `<script>`、`javascript:` 等危险字符进行转义或拦截；通过防火墙配置仅允许受信任 IP 访问管理接口，限制 com.livesoftware.jrun.plugins.jsp 端点的访问来源；关闭不必要的 JSP 直接访问路径，并排查、清理由跨站脚本攻击（CSS）注入的恶意 JSP 文件，阻止任意代码在服务器端编译执行。</value>"""
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Allaire JRun 2.3.x JSP Servlet 跨站脚本攻击漏洞"
