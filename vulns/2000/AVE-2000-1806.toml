[basic]
description = "Half Life 专用服务器（build 3104 之前版本）存在缓冲区溢出漏洞，远程攻击者可通过向服务器发送超长的 rcon 命令触发该漏洞，导致任意代码执行。该漏洞影响所有低于 build 3104 的 Half Life 专用服务器版本，CVSS 评分 10.0，危害等级严重。攻击者无需身份认证即可利用该漏洞完全控制目标服务器，建议用户立即升级至 build 3104 或更高版本。"
published = "2000-12-19T05:00:00Z"
remediation = "立即将 Half-Life 专用服务器升级至 build 3104 或更高版本，该版本修复了 rcon 命令处理中的缓冲区溢出问题。如无法升级，可在服务器防火墙中限制 rcon 端口的访问来源 IP，仅允许受信任的管理员 IP 连接，并禁用不必要的 rcon 功能以降低攻击面。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Valve Half-Life Dedicated Server 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:52Z"

