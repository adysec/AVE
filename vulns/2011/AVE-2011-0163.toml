[basic]
description = "Mozilla Firefox/Thunderbird 等产品中的 ANGLE（Almost Native Graphics Layer Engine）库存在堆溢出漏洞，该漏洞位于 WebGL 实现中。攻击者可通过发送特制的 WebGL 着色器程序或利用浏览器引擎中的未指定向量触发堆溢出，无需身份认证即可在目标系统上远程执行任意代码。影响范围包括 Firefox 4.x 至 5 版本、Thunderbird 6.0 之前版本、SeaMonkey 2.x 2.3 之前版本及其他可能使用 ANGLE 库的产品，CVSS 评分 10，危害等级极高。"
published = "2011-08-18T18:55:01Z"
remediation = "立即升级至 Firefox 7、Thunderbird 7 或 SeaMonkey 2.4 版本以修复 ANGLE 库堆溢出漏洞。升级方法：打开浏览器或邮件客户端，进入设置菜单选择「关于」或「帮助→关于」，系统将自动检查并安装最新版本。如暂时无法升级，可在浏览器设置中禁用 WebGL 功能（about:config 中将 webgl.disabled 设为 true）以降低被利用风险。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird ANGLE库堆溢出漏洞"
updated = "2026-06-16T23:32:22Z"

