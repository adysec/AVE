[basic]
description = "Apache 2.0至2.0.39版本在Windows、OS2及Netware平台上存在路径泄露漏洞。远程攻击者可通过发送对.var文件的请求，服务器返回的错误消息中会泄露服务器完整路径名；或通过触发脚本（子进程）无法执行时的错误消息获取路径信息。该漏洞导致敏感信息泄露，攻击者无需认证即可利用，影响范围广泛。"
published = "2002-09-05T04:00:00Z"
remediation = "升级至 Apache HTTP Server 2.0.40 或更高版本（官方于 2002-08-09 发布此修复版本）。如无法立即升级，可在 httpd.conf 中禁用 multiviews 选项（Options -MultiViews），并移除 .var 类型映射文件或将其访问权限限制为仅本地可读；同时确保 cgi 脚本目录无多余可执行脚本，以降低路径泄露风险。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Apache HTTP Server 2.0 路径信息泄露漏洞"
updated = "2026-06-16T21:57:52Z"

