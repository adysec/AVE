[basic]
description = "Icecast 1.3.10 及之前版本存在多个缓冲区溢出漏洞，远程未认证攻击者可通过发送特制的网络数据包触发缓冲区溢出，导致服务拒绝（崩溃）或执行任意代码。该漏洞源于 Icecast 对用户输入缺乏边界检查，攻击者无需身份验证即可远程利用，攻击复杂度低，可导致服务器完全受控，影响服务的机密性、完整性和可用性，CVSS 评分 7.5（HIGH）。受影响版本为 Icecast 1.3.10 及之前版本，建议升级至 1.3.10 或更高版本修复该漏洞。"
published = "2001-03-13T05:00:00Z"
remediation = "立即升级到 Icecast 2.x 或更高版本（当前支持的安全分支）。如果无法立即升级，可在防火墙上限制对 Icecast 端口的访问，并禁用匿名或未认证的流发布功能作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Icecast Icecast 缓冲区溢出拒绝服务代码执行漏洞"
updated = "2026-06-16T21:55:51Z"

