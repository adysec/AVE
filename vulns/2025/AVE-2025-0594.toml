[basic]
description = "Google Chrome Android 版本 143.0.7499.110 之前版本的工具栏实现不当，存在域名欺骗漏洞（CWE-1021）。远程攻击者可通过构造恶意 HTML 页面，利用工具栏对源站域名显示逻辑的缺陷，诱导用户误信恶意页面为合法站点，实施钓鱼攻击。攻击需用户交互（UI:R），攻击复杂度低（AC:L），无需权限（PR:N），仅影响机密性（C:L），CVSS 4.3 中危。影响 Chrome Android 版本 < 143.0.7499.110，Google 已在 143.0.7499.110 版本修复，用户升级即可防护。"
published = "2025-12-12T20:15:40Z"
remediation = "建议立即将 Android 版 Google Chrome 升级至 143.0.7499.110 或更高版本（通过 Google Play 商店更新）；openSUSE 用户请将 Chromium 升级至 143.0.7499.109 或更高版本（执行 `sudo zypper update chromium`）。临时缓解：避免点击不明链接，访问敏感网站时仔细核对地址栏域名，防止域名欺骗攻击。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome Android 工具栏实现不当导致域名欺骗漏洞"
updated = "2026-06-17T08:35:49Z"

