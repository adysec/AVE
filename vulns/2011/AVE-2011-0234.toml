[basic]
description = "Mozilla Firefox 4.x 至 7.0 及 Thunderbird 5.0 至 7.0 版本中存在内部权限检查漏洞。程序在访问控制过程中未正确检查 NoWaiverWrapper 包装器的使用情况，导致 Web 内容可绕过安全限制获取提升的权限。远程攻击者可通过构造特制的恶意网站诱导用户访问，成功利用后可突破浏览器的同源策略和沙箱机制，在受害者浏览器上下文中执行任意代码或窃取敏感信息。该漏洞 CVSS 评分 9.3，危害等级严重，影响 Firefox 和 Thunderbird 两大产品线。"
published = "2011-11-09T11:55:04Z"
remediation = "升级 Mozilla Firefox 至 8.0 及以上版本，或升级 Mozilla Thunderbird 至 8.0 及以上版本。对于无法立即升级的系统，可配置内容安全策略（CSP）限制脚本执行，并禁用 JavaScript 作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox 和 Thunderbird 代码注入漏洞"
updated = "2026-06-16T23:33:42Z"

