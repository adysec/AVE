[basic]
description = "Oracle 8.1.6 中的 oidldapd 组件存在缓冲区溢出漏洞，本地攻击者可通过向 connect 命令行参数传递超长字符串触发缓冲区溢出，从而获得提升的权限。该漏洞影响 Oracle Internet Directory 2.0.6 及 Oracle 8.1.6 版本，CVSS 评分 4.6，危害等级中危。攻击者需拥有本地系统访问权限方可利用，成功利用后可导致权限提升、机密性/完整性/可用性部分受损。Exploit-DB 已公开该漏洞的利用代码。"
published = "2000-12-19T05:00:00Z"
remediation = "升级 Oracle 数据库至 8.1.7 或更高版本，该漏洞已在后续版本中修复。如无法升级，可移除 oidldapd 二进制文件的 setuid 权限（chmod u-s $ORACLE_HOME/bin/oidldapd），防止普通用户通过缓冲区溢出获取 oracle 用户权限。同时限制仅受信数据库管理员可本地登录服务器。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Oracle Oracle Internet Directory oidldapd 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:52:55Z"

