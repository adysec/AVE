[basic]
description = "Microsoft Windows Media Services 4.0/4.1 的 Windows Media Encoder 组件存在拒绝服务漏洞（MS00-038），远程未认证攻击者可通过发送畸形编码器请求触发该漏洞，导致服务拒绝服务。该漏洞影响 Windows Media Services 4.0 和 4.1 版本，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），攻击复杂度低、无需认证、仅影响可用性。攻击者只需向目标服务器发送特制的畸形编码器请求即可触发拒绝服务，导致服务停止响应。Microsoft 已发布安全公告 MS00-038 修复此漏洞，建议升级至修复版本或应用补丁。ExploitDB 已公开 PoC 代码（EDB-ID: 19974）。"
published = "2000-05-30T04:00:00Z"
remediation = "立即安装微软安全公告 MS00-038 提供的安全补丁（针对 Windows Media Services 4.0/4.1），或直接升级到 Windows Media Services 9.0 及以上版本。如暂时无法打补丁，请在防火墙层面禁止 1755 端口（MMS 协议默认端口）的外部访问，并在 IIS 中禁用 Windows Media 相关 ISAPI 扩展作为临时缓解措施。建议尽快升级至 Windows Media Services 9.0 系列以彻底修复该拒绝服务漏洞。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Windows Media Services 拒绝服务漏洞"
updated = "2026-06-16T21:51:51Z"

