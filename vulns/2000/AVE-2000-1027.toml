[basic]
description = "glibc2 动态链接器在处理 setuid 程序时未正确清除 LD_DEBUG_OUTPUT 和 LD_DEBUG 环境变量，导致本地攻击者可通过符号链接攻击利用调试输出功能覆写系统任意文件。攻击者需拥有本地账户权限，且目标程序为 setuid 二进制文件，攻击复杂度较高。成功利用可导致本地文件被恶意覆盖，进而可能实现权限提升或系统破坏。该漏洞影响使用 glibc2 的 Linux 系统。"
published = "2000-12-19T05:00:00Z"
remediation = "升级 glibc 至 2.2 及以上版本（该漏洞在 glibc 2.1.3 及后续版本中已修复）。对于现代 Linux 发行版，通过包管理器更新至最新 glibc 版本即可：Debian/Ubuntu 执行 `apt update && apt upgrade libc6`，RHEL/CentOS 执行 `yum update glibc`。如无法升级，避免在受影响的系统上授予不可信用户本地访问权限。"
score = 1.2
severity = "LOW"
sources = ["cve"]
title = "GNU glibc2 LD_DEBUG环境变量未清除导致本地文件覆盖漏洞"
updated = "2026-06-16T21:52:51Z"

