[basic]
description = "socomec DIRIS A-40 设备 Web 管理界面存在敏感信息泄露漏洞（CWE-200），固件版本 48250501 之前受影响。攻击者可通过向目标设备发送 HTTP GET 请求访问 `/password.jsn` 路径，无需身份认证即可获取管理员明文密码，进而完全控制设备。该漏洞影响所有暴露了 Web 管理界面的 DIRIS A-40 设备，攻击条件简单，仅需网络可达即可利用。CVSS v3.1 评分为 9.8（严重），攻击复杂度低，无需交互，成功利用后可完全破坏设备机密性、完整性与可用性。厂商已发布固件更新修复此问题。"
published = "2019-10-09T16:15:14Z"
remediation = "立即将 Socomec DIRIS A-40 设备固件升级至 48250501 或更高版本，该补丁已修复 /password.jsn 端点明文泄露管理员凭据的漏洞。升级后重新配置设备凭据并启用强密码策略。若无法立即升级，应在网络边界对设备管理 Web 界面的访问 IP 实施严格 ACL 限制，仅允许受信任的管理网段访问，降低被远程利用的风险。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Socomec DIRIS A-40 密码泄露漏洞"
updated = "2026-06-17T02:21:13Z"

