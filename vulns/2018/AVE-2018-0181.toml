[basic]
description = "Atlassian JIRA 的 Issue Collector 组件在自定义字段错误消息处理中存在跨站脚本（XSS）漏洞。当用户向自定义字段提交无效值时，系统未对错误消息中的用户输入进行充分过滤和转义，导致远程攻击者可通过构造特制的请求在错误消息中注入任意 HTML 或 JavaScript 代码。攻击者无需身份认证即可触发该漏洞，但需要诱导目标用户访问包含恶意载荷的页面。成功利用后，攻击者可在受害者浏览器会话中执行任意脚本，窃取会话令牌、伪造页面内容或执行其他恶意操作。该漏洞影响 JIRA 7.6.6 之前、7.7.0 至 7.7.4 之前、7.8.0 至 7.8.4 之前以及 7.9.0 至 7.9.2 之前的版本。"
published = "2018-05-14T13:29:03.507"
remediation = "升级 Jira 至 7.6.6、7.7.4、7.8.4 或 7.9.2 及以上版本。如无法立即升级，可在反向代理或 WAF 层面对 /rest/collectors/ 路径的请求添加输入过滤规则，拦截包含 <script> 等 HTML 标签的请求参数。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Atlassian Jira Issue Collector 跨站点脚本漏洞"
updated = "2026-06-17T01:59:52.880"

