[basic]
description = "tags.<value>Savant Web Server 3.1 存在拒绝服务漏洞，由于服务器在处理 HTTP 请求时对 Content-Length 头部字段缺乏有效校验，未经身份认证的远程攻击者可通过发送包含负值 Content-Length 的特制 HTTP GET 请求触发该漏洞，导致服务器进程崩溃并拒绝服务。该漏洞影响运行 Savant Web Server 3.1 的所有系统，攻击者无需任何凭据或特殊网络条件，只需能够访问目标服务器的 HTTP 端口即可完成攻击利用。"
published = "2002-12-31T05:00:00Z"
remediation = "由于 Savant Web Server 3.1 官方未发布针对此漏洞的安全补丁且软件已停止维护，建议立即将 Web 服务迁移至 Nginx、Apache 或 IIS 等主流服务器。如暂时无法替换，可在前端部署反向代理（如 Nginx）过滤 HTTP 请求中 Content-Length 为负值的异常请求，并在防火墙或 WAF 中配置规则拦截包含负 Content-Length 头的访问。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Savant Web Server 3.1 畸形 Content-Length 拒绝服务漏洞"
updated = "2026-06-16T22:00:07Z"

