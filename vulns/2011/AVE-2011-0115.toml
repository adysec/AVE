[basic]
description = "Adobe Flash Player 在处理特定 SWF 文件时存在缓冲区溢出漏洞。由于程序对用户输入的数据边界检查不充分，攻击者可通过诱导用户访问恶意网页或打开特制的 Flash 文件触发该漏洞，成功利用可在目标系统上执行任意代码，完全控制受影响系统。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上的 Flash Player 10.3.183.11 之前版本和 11.x 系列 11.1.102.55 之前版本，以及 Adobe AIR 3.1.0.4880 之前版本，CVSS 评分 10.0，危害等级严重。Adobe 已发布安全更新修复此漏洞，建议用户升级至最新版本。"
published = "2011-11-11T16:55:01Z"
remediation = "升级 Adobe Flash Player 至 10.3.183.11 或 11.1.102.55 及以上版本（Windows/Mac/Linux/Solaris），Android 平台升级至 11.1.102.59 及以上版本；同时升级 Adobe AIR 至 3.1.0.4880 及以上版本。如无法立即升级，可在浏览器中禁用 Flash 插件或使用 Chrome 内置 Flash 沙箱机制缓解风险。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 缓冲区溢出漏洞"
updated = "2026-06-16T23:31:22Z"

