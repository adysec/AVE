[basic]
description = "OpenBSD 2.6 及更早版本中的 ARP 协议实现存在拒绝服务漏洞，未经身份认证的远程攻击者可通过向目标系统发送大量伪造的 ARP 请求报文，耗尽系统 ARP 表资源或触发内核异常，导致目标服务不可用。该漏洞影响 OpenBSD 2.x 系列版本，攻击者仅需在目标网络可达的情况下发起 ARP 泛洪攻击即可触发，无需任何认证凭据或特殊交互条件。该漏洞为纯可用性破坏型攻击，不会造成信息泄露或权限提升，但可导致受影响的 OpenBSD 服务器脱机，中断网络服务。"
published = "2000-12-19T05:00:00.000"
remediation = "升级到 OpenBSD 2.7 或更高版本，2.7 版本已修复 ARP 泛洪导致的拒绝服务问题。确认当前版本：`uname -r`，若为 2.6 或更早，从 OpenBSD 官方 FTP 站点下载对应架构的安装镜像执行升级安装。升级完成后验证内核版本：`uname -a` 确认已切换至 2.7.x。若暂时无法升级，可在网络边界防火墙上限制 ARP 请求速率，或在交换机层面启用 ARP 防护策略（如 DHCP Snooping + Dynamic ARP Inspection），阻断异常 ARP 泛洪流量到达目标主机。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "OpenBSD ARP Flooding 拒绝服务漏洞"
updated = "2026-06-16T21:52:45.303"

