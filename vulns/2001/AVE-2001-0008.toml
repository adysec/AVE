[basic]
description = "MailMan Webmail 3.0.25及更早版本存在参数验证漏洞，攻击者可通过alternate_template参数中的 shell 元字符向服务器注入任意命令。漏洞影响MailMan Webmail 3.0.x系列产品，攻击者无需身份验证即可远程触发此漏洞，实现任意命令执行，完全控制目标服务器。利用方法是构造包含恶意shell命令的参数，提交给MailMan Webmail服务即可执行任意系统命令。该漏洞 CVSS评分 10.0，危害等级严重，已在2021年2月发布的安全更新中修复，建议用户立即更新至最新版本以获取补丁保护。"
published = "2001-02-16T05:00:00Z"
remediation = "立即升级 Endymion MailMan 到 3.0.26 或更高版本（2000年12月1日发布的版本已修复 Secure Reality 发现的该安全问题）。若无法立即升级，可临时禁用 Webmail 服务或在 Web 服务器层面配置 WAF 规则拦截包含 Shell 元字符（如 | ; & $() `）的 alternate_template 参数请求，并将 CGI 脚本运行权限降级为最小权限用户（非 root/nobody）。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Endymion MailMan 任意命令执行漏洞"
updated = "2026-06-16T21:53:30Z"

