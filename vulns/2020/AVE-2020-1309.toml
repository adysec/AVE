[basic]
description = "Cisco AnyConnect Secure Mobility Client for Windows 的安装程序组件存在目录路径处理不当漏洞。经本地身份验证的攻击者可利用该漏洞将用户提供的文件复制到具有系统级别权限的系统目录中。攻击者通过在 Windows 系统上创建恶意文件并利用此漏洞将其复制到系统目录，可实现 DLL 预加载、DLL 劫持等相关攻击，最终获取系统级别权限。该漏洞需要攻击者拥有目标 Windows 系统的有效本地凭据才能利用。"
published = "2020-02-19T20:15:15Z"
remediation = "将 Cisco AnyConnect Secure Mobility Client for Windows 升级至 4.8.02042 或更高版本。升级前请确认目标系统已具备足够内存并满足新版本的硬件及软件兼容性要求，升级操作可通过 AnyConnect 的自动更新机制或手动下载最新安装包完成。升级后重启 Cisco AnyConnect 服务以确保修复生效。由于该漏洞的安装程序组件在处理目录路径时存在缺陷，且官方未提供任何临时缓解措施，必须通过版本升级彻底修复。如无法立即升级，应限制对受影响 Windows 系统的本地用户访问权限，降低被本地攻击者利用的风险。"
score = 6.5
severity = "MEDIUM"
sources = ["kev"]
title = "Cisco AnyConnect Secure Mobility Client for Windows 本地权限提升漏洞"
updated = "2026-06-17T03:17:28Z"

