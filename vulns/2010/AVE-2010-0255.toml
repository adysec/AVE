[basic]
description = "Apple QuickTime 7.6.9 之前版本在处理特制影片文件时存在整数溢出漏洞（CWE-189）。远程攻击者可向目标用户发送恶意构造的影片文件，当用户使用 QuickTime 打开该文件时，触发整数溢出导致内存破坏，进而实现任意代码执行或造成应用程序崩溃。该漏洞影响所有 QuickTime 7.6.9 之前版本，CVSS 评分 9.3，危害严重。攻击无需身份认证，仅需用户交互（打开恶意文件）即可触发。"
published = "2010-12-09T20:00:17Z"
remediation = "立即将 Apple QuickTime 升级至 7.6.9 或更高版本，该版本修复了处理畸形 movie 文件时的整数溢出漏洞。如无法升级，可在浏览器中禁用 QuickTime 插件，并避免打开来源不明的 .mov/.avi/.mp4 等媒体文件。对于 Windows 系统，还可通过组策略限制 QuickTime 对用户目录的写入权限作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime 整数溢出远程代码执行漏洞"
updated = "2026-06-16T23:23:58Z"

