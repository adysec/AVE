[basic]
description = "Google Chrome 17.0.963.46 之前版本中存在一处释放后使用（Use-after-free）漏洞，位于 CSS 标记序列（token-sequence）数据的错误处理逻辑中。远程攻击者可通过构造特制的 CSS 样式表数据触发该漏洞，成功利用后可导致浏览器崩溃（拒绝服务）或可能执行任意代码。攻击无需用户交互，仅需诱使用户访问恶意网页即可触发。该漏洞影响所有低于 17.0.963.46 版本的 Google Chrome 浏览器。"
published = "2012-02-09T04:10:29Z"
remediation = '立即将 Google Chrome 升级至 17.0.963.46 或更高版本。用户可通过 Chrome 菜单中的"关于 Google Chrome"自动检查并安装更新。由于该版本已过于陈旧，建议直接升级到受支持的最新 Chrome 版本（如 114+），以确保获得所有后续安全修复。如无法升级浏览器，可考虑使用其他现代浏览器（如 Firefox、Edge）作为临时替代方案。'
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome CSS token-sequence数据处理释放后使用漏洞"
updated = "2026-06-16T23:34:13Z"

