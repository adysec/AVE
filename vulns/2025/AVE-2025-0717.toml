[basic]
description = "Windows 数字媒体组件存在越界读取漏洞（CWE-125），攻击者通过物理接触目标设备并以低权限运行特制程序即可触发该漏洞。成功利用后，攻击者可实现权限提升至内核级别，完整控制系统，造成机密性、完整性和可用性的全面损失。该漏洞影响范围极广，覆盖 Windows 10 全系列版本（1507 至 22H2）、Windows 11 全系列版本（22H2 至 24H2），以及 Windows Server 2008 至 2025 等多个服务器版本。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞，建议受影响用户尽快安装安全补丁。"
published = "2025-01-14T18:15:44Z"
remediation = '建议立即安装 Microsoft 2025 年 1 月累计安全更新（KB5050021 Windows 10/11、KB5050009 Windows Server 2016/2019/2022、KB5050061 Windows Server 2008 SP2 ESU）以修复该漏洞。先安装最新 Servicing Stack Update KB5050682 再应用安全更新。若暂时无法打补丁，可通过组策略禁用 "Windows Media Player Network Sharing Service" 服务（WMPNetworkSvc）作为临时缓解措施，降低攻击面。'
score = 6.6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 数字媒体特权提升漏洞"
updated = "2026-06-17T08:42:55Z"

