[basic]
description = "Mozilla Firefox 4.x至13.0版本以及Firefox ESR 10.x至10.0.6版本在处理feed:URL时未能正确建立安全上下文，远程攻击者可通过构造特制的feed:javascript:URL绕过跨站脚本（XSS）防护机制，在用户浏览器中执行任意JavaScript脚本。攻击者可通过诱导用户点击恶意链接触发该漏洞，导致敏感信息泄露或会话劫持。该漏洞影响范围广泛，CVSS评分4.3，危害等级中危。Mozilla已在Firefox 14.0及Firefox ESR 10.0.6版本中修复此漏洞。"
published = "2012-07-18T10:26:49Z"
remediation = "升级 Mozilla Firefox 至 14.0 及以上版本，或 Firefox ESR 至 10.0.6 及以上版本。各 Linux 发行版用户可通过包管理器安装安全更新，如 Red Hat 执行 `yum update firefox` 安装 RHSA-2012:1088，Ubuntu 执行 `apt-get install --only-upgrade firefox` 安装 USN-1509-1/2，openSUSE 用户安装 openSUSE-SU-2012:0893 安全更新。无法立即升级时，可在浏览器中禁用 JavaScript 或使用 NoScript 等扩展阻止 feed:javascript: 协议执行作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox feed:URL跨站脚本漏洞"
updated = "2026-06-16T23:40:41Z"

