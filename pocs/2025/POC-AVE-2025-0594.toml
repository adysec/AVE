[info]
author = "ave"
description = "验证 Chrome Android 版本 < 143.0.7499.110 是否存在工具栏域名欺骗漏洞。该漏洞由于实现不当，可能允许远程攻击者通过构造恶意 HTML 页面，诱导用户误信恶意页面为合法站点，实施钓鱼攻击。验证方式：使用 craft HTTP 页面触发工具栏错误显示域名。"
id = "POC-AVE-2025-0594"
name = "Google Chrome Android 工具栏域名欺骗漏洞 PoC"
severity = "medium"
tags = ["ave-2025-0594"]
vuln_id = [
    "CVE-2025-14373",
    "AVE-2025-0594",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["chromium"]
