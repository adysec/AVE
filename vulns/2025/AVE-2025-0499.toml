[basic]
description = "Python 标准库 xml.dom.minidom 模块在构建嵌套 XML 元素时，调用 appendChild() 等依赖 _clear_id_cache() 的方法会导致算法复杂度呈二次方增长。当处理深度嵌套的 XML 文档时，该缺陷会消耗大量 CPU 资源，造成服务可用性下降。攻击者可通过提交特制的深度嵌套 XML 文档触发此漏洞，导致拒绝服务。该漏洞影响 Python 3.x 系列版本，CVSS 评分 6.3，危害等级中等。"
published = "2025-12-03T19:15:55Z"
remediation = "升级 Python CPython 至 3.10.20、3.11.15、3.12.13、3.13.11、3.14.2 或 3.15.0a3 及以上版本，这些版本已修复 _clear_id_cache() 的二次复杂度问题。如无法立即升级，可在应用层限制 XML 文档嵌套深度作为临时缓解措施。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Python CPython xml.dom.minidom 节点 ID 缓存清除二次复杂度算法缺陷导致拒绝服务漏洞"
updated = "2026-06-17T08:31:41Z"

