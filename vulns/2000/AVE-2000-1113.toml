[basic]
description = "tags format as specified.<value>Recourse ManTrap 1.6 蜜罐系统中存在拒绝服务漏洞，攻击者可利用该产品对 /proc/self 目录路径处理不当的缺陷，通过在 /proc/self 目录及其父目录之间反复切换并执行 ls、pwd 等命令，触发应用程序异常终止，导致服务无法正常响应，从而造成系统可用性部分丧失。该漏洞影响 Recourse ManTrap 1.6 及 1.6.1 版本。攻击条件要求攻击者已在目标主机上拥有本地访问权限，但无需任何身份认证即可实施攻击。利用成功仅会影响服务的可用性，不会造成敏感信息泄露或数据完整性破坏。Recourse Technologies 已就该漏洞发布安全公告，建议受影响用户升级至修复版本。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 ManTrap 至最新可用版本以修复该漏洞。若暂时无法升级，可通过修改系统配置限制普通用户对 /proc/self 目录的访问权限，或使用 chroot/容器隔离运行 ManTrap 以限制攻击面。作为临时缓解措施，可调整文件系统挂载选项屏蔽对 /proc 敏感目录的遍历访问。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Recourse ManTrap 1.6 拒绝服务漏洞"
updated = "2026-06-16T21:53:15Z"

