[basic]
description = "Atlassian Jira 在 7.6 至 8.3.2 之前版本中存在授权校验缺陷，其 /rest/issueNav/1/issueTable 资源未正确验证用户权限，允许未经身份验证的远程攻击者通过发送特制的 JQL 查询请求枚举系统有效用户名。攻击者仅需向目标 Jira 实例的 issueTable 接口提交包含 projectsLeadByUser() 等函数的 POST 请求，即可根据响应状态码区分用户名是否存在：返回 400 状态码表示用户不存在，返回 200 状态码则表示用户有效。该漏洞影响 Atlassian Jira Server 7.6 至 8.3.2 之前的多个版本，CVSSv3 评分为 5.3（中危），可导致用户信息泄露，为后续定向攻击提供有价值的情报。"
published = "2019-08-23T14:15:11Z"
remediation = "将 Atlassian Jira 升级至 8.3.2 或更高版本，该版本修复了 /rest/issueNav/1/issueTable 资源的授权检查缺陷。如暂时无法升级，可在反向代理或 WAF 层拦截对 /rest/issueNav/1/issueTable 的未授权访问请求，仅允许经过身份验证的用户调用该接口。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "Atlassian Jira 未授权用户名枚举漏洞"
updated = "2026-06-17T02:42:00Z"

