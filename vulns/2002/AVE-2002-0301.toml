[basic]
description = "Trend Micro InterScan VirusWall 3.5 和 3.6 版本的 HTTP 代理服务存在内容扫描绕过漏洞。当系统启用“若 Content-Length 为 0 则跳过扫描”选项时，恶意 Web 服务器可通过在 HTTP 响应头中设置 Content-Length 为 0，诱导代理服务器跳过安全扫描，而后续的 HTTP 客户端在处理时往往会忽略该头部并接收实际载荷。攻击者可利用此机制将恶意代码或病毒绕过防火墙检测传输至目标客户端，导致内部网络安全防御失效。"
published = "2002-07-26T04:00:00Z"
remediation = "进入 InterScan VirusWall 配置界面，禁用“Skip scanning if Content-length equals 0”选项，强制所有 HTTP 请求经过扫描以防止绕过；建议升级至厂商发布的最新安全补丁版本。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "趋势科技 InterScan VirusWall Content-Length 扫描绕过漏洞"
updated = "2026-06-16T21:57:27Z"

