[basic]
description = "AvantFAX 3.3.3 版本存在跨站脚本攻击（XSS）漏洞，由于对默认 URI 中的参数名未进行充分过滤，攻击者可通过构造包含 Script 元素的任意参数名并发送到目标站点，在受害用户的浏览器中执行恶意 JavaScript 代码。该漏洞影响部署 AvantFAX 3.3.3 的所有在线传真管理系统，攻击条件为需要诱骗具有管理员权限的认证用户点击包含精心构造 URI 的链接，成功利用后可导致管理员会话令牌被窃取、会话劫持及敏感数据泄露等风险。攻击者无需身份认证即可向默认 URI 提交恶意参数，利用方式可引用公开 PoC 模板进行验证和检测。"
published = "2018-01-10T18:29:01Z"
remediation = "立即将 AvantFAX 升级至 3.3.7 或更高版本，该版本修复了参数名中注入 SCRIPT 标签导致的跨站脚本漏洞。若暂无法升级，请在应用层对所有 HTTP 请求参数名进行 HTML 实体编码与输入过滤，拒绝包含尖括号及 script 关键字的参数请求。同时在 Web 服务器中启用 Content-Security-Policy 响应头（设置 default-src 'self'，script-src 'self'），并在应用程序层面为会话 Cookie 添加 HttpOnly 与 Secure 属性，以降低 XSS 攻击造成的会话劫持与信息泄露风险。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "AvantFAX Script Parameter 跨站脚本攻击漏洞"
updated = "2026-06-17T01:12:03Z"

