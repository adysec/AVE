[basic]
description = "Microsoft AutoUpdate (MAU) 存在权限管理不当漏洞，该工具作为 macOS 平台上 Microsoft 系列应用（如 Office）的自动更新组件，以高权限运行。本地低权限攻击者可利用 MAU 对更新文件或进程间通信的权限校验缺陷，通过构造恶意更新包或劫持 MAU 的更新流程，将自身权限提升至 root 级别，从而完全控制系统。该漏洞攻击复杂度低，无需用户交互，影响所有使用 MAU 的 macOS 系统。Microsoft 已在相关安全更新中修复此漏洞。"
published = "2025-01-14T18:16:01Z"
remediation = "将 Microsoft AutoUpdate for Mac 升级到 4.76 或更高版本。macOS 用户可通过 Microsoft AutoUpdate 内置更新功能（菜单栏 → 帮助 → 检查更新）自动获取修复版本，也可从 https://go.microsoft.com/fwlink/?linkid=830196 手动下载最新安装包。如无法立即更新，建议限制受影响 Mac 系统的本地登录用户权限，仅允许受信任的管理员账户操作。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft AutoUpdate (MAU) 特权提升漏洞"
updated = "2026-06-17T08:43:11Z"

