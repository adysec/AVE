[basic]
description = "WordPress 的 social-login-bws 插件 0.2 版本之前存在跨站脚本（XSS）漏洞。该漏洞由于插件未对用户输入进行充分的过滤与转义处理，导致攻击者可通过向登录页面注入恶意脚本代码，当管理员或其他用户访问受影响页面时脚本自动执行，从而窃取会话 Cookie、劫持用户会话或重定向至恶意站点。攻击者需诱使用户点击特制链接，无需身份认证即可触发，CVSS 评分 6.1，危害等级中危。"
published = "2019-08-12T16:15:13Z"
remediation = "升级 social-login-bws 插件至 0.2 或更高版本。在 WordPress 后台插件管理页面搜索 social-login-bws 并点击「更新」即可。如无法升级，可暂时禁用该插件并启用 Web 应用防火墙（WAF）规则过滤 XSS 攻击载荷作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Social Login by BestWebSoft插件跨站脚本漏洞"
updated = "2026-06-17T01:12:59Z"

