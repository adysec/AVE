[basic]
description = "Google Chrome V8 引擎存在类型混淆漏洞 (CWE-843)，攻击者可通过诱导用户访问精心构造的恶意 HTML 页面触发堆损坏，进而实现远程代码执行。该漏洞影响 Google Chrome 140.0.7339.185 之前版本及 Fedora 42 的 Chromium 软件包，CVSS 3.1 评分 9.8 (CRITICAL)，攻击向量为网络、攻击复杂度低、无需权限和用户交互，影响机密性、完整性和可用性均为高。攻击者仅需构造恶意网页诱导受害者访问即可触发漏洞，利用 V8 引擎类型混淆导致的堆损坏实现远程代码执行。Google 已在 Chrome 140.0.7339.185 版本中修复，Fedora 42 用户需更新至 140.1.15^chromium140.0.7339.207 版本修复。"
published = "2025-09-24T17:15:39Z"
remediation = "立即将 Google Chrome/Chromium 升级至 140.0.7339.185 或更高版本（Fedora 42 用户更新至 140.1.15^chromium140.0.7339.207）；如暂时无法升级，可在浏览器设置中禁用 JavaScript 或启用站点隔离作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["msrc"]
title = "Google Chrome V8 类型混淆漏洞"
