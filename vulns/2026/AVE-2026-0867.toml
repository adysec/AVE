[basic]
description = "Mistune Python Markdown 解析器的 Admonition 指令中存在跨站脚本（XSS）漏洞。在 `src/mistune/directives/admonition.py` 的 `render_admonition()` 函数中，`:class:` 选项的值未经转义直接拼接至 HTML class 属性中，导致即使启用了 `HTMLRenderer(escape=True)` 安全模式，攻击者仍可通过构造恶意的 class 参数注入任意 HTML 属性或 JavaScript 代码。该漏洞影响 Mistune 3.2.1 之前的所有版本，攻击者无需身份认证，仅需诱使用户解析包含恶意 Admonition 指令的 Markdown 内容即可触发，属于低交互低权限的存储型/反射型 XSS 攻击。"
published = "2026-07-08T17:17:28Z"
remediation = "立即将 mistune 升级至 3.2.1 或更高版本（pip install --upgrade mistune）。如无法升级，在调用 Admonition 指令前对 :class: 参数值进行 HTML 转义处理，或禁用 Admonition 扩展作为临时缓解措施。"
score = 5.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Mistune Admonition 指令未转义类选项跨站脚本漏洞"
updated = "2026-07-09T19:38:07Z"

