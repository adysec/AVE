[basic]
description = "MIT Kerberos V5 1.2.5 之前版本的 libkrb5 库中的 chk_trans.c 文件存在未知漏洞，当不同 Kerberos 领域配置了相同的跨领域共享密钥时，攻击者可以利用该漏洞从一个领域冒充其他领域的用户进行身份认证。该漏洞影响所有使用 MIT Kerberos V5 1.2.5 之前版本的系统，CVSS 评分 7.5，危害等级高。攻击者无需身份认证即可远程利用，可导致权限提升、信息泄露和中间人攻击。建议升级至 MIT Kerberos V5 1.2.5 或更高版本以修复此漏洞。"
published = "2003-02-19T05:00:00Z"
remediation = "升级 MIT Kerberos V5 至 1.2.5 或更高版本。如无法立即升级，在跨域信任配置中严格限制共享密钥的使用范围，仅对必要的 realm 对启用 inter-realm 认证，并定期轮换跨域共享密钥以降低被冒充风险。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "MIT Kerberos V5 跨域用户欺骗漏洞"
updated = "2026-06-16T22:01:26Z"

