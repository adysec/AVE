[basic]
description = "WinRAR 5.61 及之前版本中 UNACEV2.dll 处理 ACE 格式文件名字段时存在路径遍历漏洞。攻击者可构造恶意 ACE 压缩包，通过特定文件名模式（如包含路径遍历序列）绕过解压目标文件夹限制，将文件写入任意绝对路径。攻击需诱导用户打开或解压恶意 ACE 文件（需用户交互），成功利用可实现任意文件写入，进而植入启动项、计划任务或覆盖系统文件实现远程代码执行。影响 WinRAR 5.61 及之前所有版本，CVSS 3.1 评分 7.8（HIGH），CVE-2018-20250 已被 CISA 列入已知被利用漏洞目录。WinRAR 5.70 版本已修复该漏洞，建议用户升级至最新版本并避免打开不可信压缩包。"
published = "2019-02-05T20:29:00Z"
remediation = "立即升级 WinRAR 至 5.70 版本或更高版本（官方已移除有漏洞的 UNACEV2.dll），或从官网 https://www.win-rar.com/download.html 下载最新版安装覆盖。若暂时无法升级，请卸载 WinRAR 或在杀毒软件/防火墙中禁止打开 .ace 文件，并避免打开来源不明的压缩包。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "RARLAB WinRAR 路径遍历漏洞"
updated = "2026-06-17T01:52:33Z"

