[basic]
description = "Apple iTunes 10.7之前版本中集成的WebKit组件存在内存破坏漏洞。远程攻击者可构造恶意网页，当用户使用iTunes访问该网页时，触发WebKit渲染引擎的内存损坏，进而导致任意代码执行或应用程序崩溃。该漏洞攻击向量为网络，攻击复杂度中等，无需身份认证即可远程利用，对用户隐私和系统安全造成严重威胁。Apple已在后续安全更新中修复此漏洞。"
published = "2012-09-13T10:30:20.637"
remediation = "建议立即将 Apple iTunes 升级至 10.7 或更高版本，iOS 设备升级至 iOS 6.0 或更高版本。如暂时无法升级，可在防火墙或代理服务器层面过滤恶意网站访问，并避免点击未知链接或打开不可信的网页内容。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:43.793"

