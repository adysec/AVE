[basic]
description = "CVS 1.10.8 版本服务器存在访问控制缺陷，未对用户创建 Checkin.prog 或 Update.prog 程序进行充分限制。拥有 CVS 提交权限的远程攻击者可利用该漏洞，在服务器上创建或植入特洛伊木马程序，随后通过执行 CVS commit 操作触发这些程序的自动执行，从而在目标系统上以 CVS 服务器进程权限执行任意命令。该漏洞影响 CVS 1.10.8 及可能更早版本，CVSS 评分 7.2，危害等级高。目前已存在公开的利用代码。"
published = "2000-10-20T04:00:00Z"
remediation = "立即升级 CVS 服务器至 1.11.x 或更高版本（该漏洞在 1.11 中已修复）。如无法升级，在 CVSROOT 配置文件中移除或注释掉 Checkin.prog 和 Update.prog 功能，并限制仅信任用户拥有 CVSROOT 目录写入权限。同时建议通过 SSH 隧道封装 CVS pserver 通信，避免远程未授权访问。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "CVS Kit CVS Server 1.10.8 Checkin.prog 任意程序创建漏洞"
updated = "2026-06-16T21:52:15Z"

