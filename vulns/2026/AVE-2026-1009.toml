description = "Netfoil 域名过滤机制存在绕过漏洞。攻击者可构造包含多个DNS问题的恶意请求，其中第一个问题使用合法域名，从而绕过域名过滤器。该漏洞影响 netfoil 低于 0.3.0 的版本。攻击需要本地访问权限以构造恶意DNS请求，且依赖目标DoH服务器支持处理包含多个问题的请求，无需身份认证即可触发过滤绕过。"
