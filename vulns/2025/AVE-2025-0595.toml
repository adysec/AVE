[basic]
description = "GLib Input/Output 子系统在 `escape_byte_string()` 函数的属性转义过程中存在整数溢出漏洞。当处理来自文件系统或远程系统的恶意属性值时，函数会对输入进行长度计算并分配内存，但验证逻辑存在缺陷，可能导致整数运算结果溢出为负数或过大。在内存分配时，正数溢出会分配过小的缓冲区，而负数溢出会触发异常内存分配。攻击者可构造特制的属性值以触发此漏洞，在目标系统中获取拒绝服务（DoS）或试图实现进一步攻击。该漏洞影响基于 GLib 的 Linux 发行版（如 Ubuntu、Fedora 等）中所有使用 GIO 进行文件/网络属性处理的应用。攻击者无需身份验证即可远程触发，直接通过向目标系统发送包含恶意属性值的网络包或上传恶意文件实现，CVSS 评分 6.5，危害等级中度。国内厂商已发布安全补丁，建议用户升级到 GLib 2.70.3+ 或以上版本获取修复。"
published = "2025-12-11T07:16:00Z"
remediation = "建议立即升级 GLib 至 2.70.3 或更高版本（参考 Red Hat 安全公告 RHSA-2026:15953 等多个勘误）。若暂无法升级，可通过编译选项禁用有问题的 GIO 属性转义功能，或在网络层面限制对处理文件系统扩展属性服务的访问，作为临时缓解措施。详见 GNOME 官方修复提交：https://gitlab.gnome.org/GNOME/glib/-/issues/3845"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "GLib GIO 整数溢出导致堆缓冲区溢出漏洞"
updated = "2026-07-13T17:16:31Z"

