[basic]
description = "这是一个影响 Max Feoktistov Small HTTP Server 2.03 及更早版本的拒绝服务漏洞。当远程攻击者向服务器发送指向不包含 index.html 文件的目录的 URL 时，服务器会在处理过程中持续分配内存，但无法在请求完成后释放这些内存。这种持续的内存消耗会导致系统资源逐渐耗尽，最终使服务器崩溃或无法响应。攻击者无需任何权限即可通过简单的 HTTP 请求触发这一漏洞，使 Web 服务不可用，严重影响了依赖该服务器软件的在线服务。该漏洞通过发起持续的目录遍历请求，以低成本实现高危害的 DoS 攻击，特别危险。"
published = "2001-01-09T05:00:00.000"
remediation = "建议升级到 Small HTTP Server 2.04 或更高版本，该版本修复了内存泄漏问题。配置修改：限制同时处理的请求数量，启用请求队列控制，将最大并发连接数设置为 10 以内。如需立即缓解，可在服务器配置中启用 `DirectoryIndex check` 功能，强制所有请求必须存在索引文件，通过拒绝非索引文件请求来防止攻击。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Max Feoktistov Small HTTP Server HTTP 请求拒绝服务漏洞"
updated = "2026-06-16T21:52:42.860"

