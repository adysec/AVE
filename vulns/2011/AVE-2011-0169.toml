[basic]
description = "Mozilla Firefox 4.x 至 5 版本及 SeaMonkey 2.x（2.3 之前）在处理 JAR 文件数字签名时存在实现缺陷，未能有效防止未签名的 JavaScript 代码调用已签名的代码。远程攻击者可通过诱导用户访问精心构造的恶意网站，利用此缺陷绕过同源策略（SOP），使其未签名脚本能够继承已签名 JAR 文件的权限和身份，从而实现特权提升并窃取敏感数据。该漏洞 CVSS 评分 9.3，危害等级为严重。"
published = "2011-08-18T18:55:02Z"
remediation = "建议立即将 Mozilla Firefox 升级至 6.0 或更高版本，SeaMonkey 升级至 2.3 或更高版本。对于无法立即升级的系统，建议禁用不必要的第三方插件，并避免访问来源不明的恶意网页以降低被利用风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 未签名脚本安全绕过漏洞"
updated = "2026-06-16T23:32:23Z"

