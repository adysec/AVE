[basic]
description = "MyHelpDesk 20020509 版本存在跨站脚本（XSS）漏洞。远程攻击者可通过工单创建时的标题（Title）或描述（Description）字段注入恶意脚本，也可通过 index.php 的 id 参数结合 tickettime、ticketfiles、updateticketlog 操作，或在编辑工单时的更新区域注入恶意代码。当其他用户访问受影响的页面时，注入的脚本将在其浏览器中执行，导致用户会话劫持、敏感信息泄露等危害。攻击无需身份认证，仅需诱使用户访问特制链接即可触发。"
published = "2002-10-04T04:00:00Z"
remediation = """MyHelpDesk 已停止维护，官方未发布安全补丁。建议在 index.php 及所有工单处理脚本中对 Title、Description 及 id 参数使用 PHP 的 htmlspecialchars() 函数进行 HTML 实体转义，过滤 < > " ' & 等特殊字符。同时建议迁移到仍受维护的替代工单系统（如 osTicket 或 Zammad）。"""
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "MyHelpDesk 20020509 跨站脚本漏洞"
updated = "2026-06-16T21:58:24Z"

