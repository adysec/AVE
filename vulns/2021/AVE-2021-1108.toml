[basic]
description = "Microsoft Exchange Server 存在服务端请求伪造（SSRF）及远程代码执行漏洞，属于 ProxyLogon 利用链组件。攻击者可构造特制的 Exchange 请求，利用 Exchange Control Panel（ECP）中的文件写入功能绕过身份认证，通过 Exchange 服务器向内网发起代理请求，最终实现任意文件写入和远程代码执行。该漏洞影响 Microsoft Exchange Server 2013/2016/2019 及 Exchange Online 本地部署及混合部署模式，无需预先身份认证即可利用。攻击条件为目标 Exchange 服务器可直接从互联网访问，攻击者仅需发送特制 HTTP 请求即可触发漏洞，成功利用后可完全控制 Exchange 服务器，获取域管权限，窃取邮件数据并在内网横向移动。"
published = "2021-03-03T00:15:12Z"
remediation = "立即安装 Microsoft 2021 年 3 月安全更新 KB5000871。Exchange Server 2019 需先安装累积更新 CU8（版本号 15.02.0792.010 或更高）后安装此更新；Exchange Server 2016 需先安装累积更新 CU19（版本号 15.01.2176.009 或更高）；Exchange Server 2013 需先安装累积更新 CU23（版本号 15.00.1497.012 或更高）。Exchange Server 2010 已停止支持，建议迁移至受支持的版本。如无法立即安装更新，可在防火墙或 IIS URL Rewrite 中限制对 Exchange Control Panel (ECP) 和 /rpc/ 路径的外部访问作为临时缓解。安装后重启 Exchange 相关服务以确保更新生效。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Exchange Server 路径遍历远程代码执行漏洞"
updated = "2026-06-17T03:44:13Z"

