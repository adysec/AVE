[basic]
description = "Authentix Authentix100 存在URL路径解析安全绕过漏洞，远程攻击者通过在受保护目录的URL中插入一个点号（.）即可绕过身份认证机制，未经授权访问受限资源。该漏洞源于服务器对URL路径的规范化处理不当，未能正确过滤或校验用户输入的路径分隔符。攻击者无需任何凭证即可通过网络远程利用此漏洞，导致敏感信息泄露，CVSS评分5.0，危害等级中危。"
published = "2001-01-09T05:00:00Z"
remediation = "升级到 Authentix100 5.3 或更高版本，该版本修复了 URL 路径解析中的点号绕过问题。由于升级免费，用户应从 http://www.flicks.com/authentix100 获取最新版本。如无法升级，可在 IIS 层面配置 URL 重写规则，拒绝包含异常路径分隔符的请求。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Authentix Authentix100 安全绕过漏洞"
updated = "2026-06-16T21:53:13Z"

