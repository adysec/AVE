[info]
author = "ave"
description = "验证目标是否存在Apple WebKit/JavaScriptCore类型混淆漏洞(CVE-2021-1789)，通过构造恶意网页内容触发越界读取并执行任意代码"
id = "POC-AVE-2021-0077"
name = "CVE-2021-1789 PoC"
severity = "high"
tags = ["ave-2021-0077"]
vuln_id = [
    "CVE-2021-1789",
    "AVE-2021-0077",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
