[basic]
description = "MidiCart ASP 购物车系统存在敏感信息泄露漏洞。该软件将存储购物车数据的 midicart.mdb 数据库文件直接放置于 Web 根目录下，且未对该文件设置访问控制或权限限制。由于 Web 服务器可被远程访问，任何未授权攻击者只需利用 Web 浏览器或简单工具直接请求该数据库文件的 URL，即可将其完整下载到本地。midicart.mdb 中保存了购物车系统的核心业务数据，包括客户的姓名、地址、联系方式、订单信息以及支付相关等敏感资料，攻击者据此可窃取大量客户隐私信息，进而用于身份冒用、精准钓鱼或金融欺诈等后续攻击。该漏洞攻击条件简单，无需任何认证、可利用性高，属于典型的信息泄露（CWE-200）问题，CVSS 评分 5.0，危害等级为中危。厂商通过不将敏感数据库置于可被公开访问的目录下并加强访问控制即可有效缓解该风险。"
published = "2003-04-11T04:00:00.000"
remediation = "建议立即将 midicart.mdb 数据库文件移出 Web 根目录（如放到上级目录或 Web 根目录之外空间），并在 Web 服务器（IIS/ASP 目录配置）中显式禁止下载访问 *.mdb/*.asa 等敏感文件类型，同时启用并检查数据库目录连接字符串与新位置保持一致。升级到受支持的 MidiCart 最新安全版本或替换为不含此缺陷的产品版本。此外，关闭 Web 根目录的目录浏览（Directory Browsing）功能，避免攻击者枚举文件路径，并对 Web 服务器执行最小权限且定期备份数据库作为临时缓解。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Midicart ASP - Remote Customer Information Retrieval 漏洞"
