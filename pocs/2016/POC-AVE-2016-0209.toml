[info]
author = "ave"
description = "通过构造特制网页，利用 res:// 和 mhtml: 协议处理器探测目标系统上任意文件是否存在。验证 IE 9-11 及 Internet Messaging API 的信息泄漏漏洞。"
id = "POC-AVE-2016-0209"
name = "Microsoft Internet Explorer Messaging API Information Disclosure PoC"
severity = "medium"
tags = ["ave-2016-0209"]
vuln_id = [
    "CVE-2016-3298",
    "AVE-2016-0209",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "Mozilla/5.0 (Windows NT 6.1; Trident/7.0; rv:11.0) like Gecko"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "res://",
    "mhtml:",
]
