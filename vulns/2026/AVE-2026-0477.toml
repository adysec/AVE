[basic]
description = "G DATA Total Security 的备份服务（Backup Service）存在符号链接跟随漏洞（CWE-59: Improper Link Resolution Before File Access）。本地攻击者首先需要在目标系统上获得低权限代码执行能力，然后通过创建恶意的符号链接，利用备份服务以 SYSTEM 权限删除任意文件，最终实现权限提升并在 SYSTEM 上下文中执行任意代码。该漏洞影响 G DATA Total Security 版本 25.5.20.121 之前的所有版本，CVSS 评分 7.8，危害等级高。厂商已在 25.5.20.121 版本中修复此漏洞。"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 G DATA Total Security 升级至 25.5.20.121 或更高版本。如无法立即升级，可限制低权限用户对 Backup Service 相关目录的写入权限，并监控符号链接创建行为作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "G DATA Total Security 备份服务符号链接跟随本地权限提升漏洞"
updated = "2026-01-01T00:00:00Z"

