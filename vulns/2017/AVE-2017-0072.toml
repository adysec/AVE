[basic]
description = "WordPress custom-search-plugin 插件（版本低于 1.36）存在多处跨站脚本（XSS）漏洞。该漏洞源于插件未对用户输入进行充分的过滤与转义处理，攻击者可通过构造特制的恶意链接或表单数据，诱使已登录的管理员用户点击，从而在目标站点的管理后台上下文中执行任意 JavaScript 代码。攻击者可利用该漏洞窃取管理员会话 Cookie、篡改页面内容或植入恶意后门，危害站点数据安全。攻击条件为需要目标用户交互（点击链接），无需身份认证即可触发。"
published = "2019-08-13T17:15:13Z"
remediation = "立即将 WordPress Custom Search by BestWebSoft 插件升级至 1.36 或更高版本（当前最新版为 1.52）。该漏洞已在 1.36 版本中修复，升级后可在 WordPress 后台「插件」页面检查更新并一键升级。如无法立即升级，可暂时禁用该插件，或通过 Web 应用防火墙（WAF）规则过滤 `bws_panel` 页面 `category` 参数中的 `<script>` 等危险字符作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress custom-search-plugin插件跨站脚本漏洞"
updated = "2026-06-17T01:12:57Z"

