[basic]
description = "Adobe Flash Player 及 Adobe AIR 存在内存破坏漏洞（CWE-119）。攻击者通过构造特制的 Flash 内容，诱使用户访问恶意网页或打开恶意文件，触发内存损坏，导致远程代码执行或拒绝服务。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上的 Flash Player 10.3.183.5 之前版本及 AIR 2.7.1 之前版本，CVSS 评分 10.0，危害等级严重。Adobe 已在 2011 年 8 月安全公告中发布更新修复此漏洞。"
published = "2011-08-10T22:55:01Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.5 及以上版本（Windows/Mac/Linux/Solaris）或 10.3.186.3 及以上版本（Android），同时升级 Adobe AIR 至 2.7.1 及以上版本。由于 Adobe Flash Player 已于 2020 年底停止支持，建议彻底卸载 Flash Player 并迁移至 HTML5 技术栈；如业务必须使用，可在浏览器中启用 click-to-play 机制并限制仅访问可信站点。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏漏洞"
updated = "2026-06-16T23:31:18Z"

