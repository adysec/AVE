[info]
author = "ave"
description = "通过 HTTP 服务向目标发送包含超长 LogFileName 参数的 HTML 页面，触发 Windows 2000 System Monitor ActiveX 控件缓冲区溢出，验证远程代码执行漏洞的存在。"
id = "POC-AVE-2000-1909"
name = "Microsoft Windows 2000 System Monitor ActiveX 控件缓冲区溢出漏洞 PoC"
severity = "critical"
tags = ["ave-2000-1909"]
vuln_id = [
    "CVE-2000-1034",
    "AVE-2000-1909",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["LogFileName"]
