[basic]
description = "Flowise 在 3.1.3 版本之前存在跨工作区凭据不安全的直接对象引用（IDOR）漏洞。其 openai-assistants-vector-store 相关端点接受客户端可控的 `credential` 参数，服务端仅按凭据 ID 加载并使用解密后的凭据，未校验该凭据是否属于当前调用者的工作区。在多租户环境中，拥有 assistants:* 权限的低权限用户若获知其他工作区的 credentialId，即可直接调用目标工作区的 OpenAI 密钥，进而未授权读写或删除该工作区的向量存储与文件，并造成受害者 OpenAI 账户的计费损失。攻击者只需构造携带目标凭据 ID 的请求即可利用该漏洞。Flowise 已在 3.1.3 版本中修复此问题。"
published = "2026-08-04T19:16:54Z"
remediation = "将 Flowise 升级到 3.1.3 或更高版本以修复该漏洞。在升级前，可通过在 Flowise 管理界面中审查各工作区存储的 OpenAI 凭证，移除不再需要的凭证，并检查 OpenAI 账户的 API 调用日志以确认是否存在跨工作区未授权使用情况；若发现异常使用，立即轮换受影响工作区的 OpenAI API 密钥并启用 API 使用告警。"
score = 7.1
severity = "HIGH"
sources = ["ghsa"]
title = "Flowise 跨工作区凭证越权访问漏洞"
updated = "2026-08-05T16:17:02Z"

