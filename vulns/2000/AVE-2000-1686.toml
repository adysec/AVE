[basic]
description = "pam_smb 和 pam_ntdom 可插拔认证模块（PAM）存在缓冲区溢出漏洞，远程攻击者可通过向目标系统发送包含超长用户名的登录请求触发缓冲区溢出，导致任意代码执行。该漏洞影响使用 SMB 认证的 Unix/Linux 系统，CVSS 评分 10.0，危害等级严重。攻击者无需身份认证即可远程利用，且无需用户交互，利用复杂度低。"
published = "2000-11-14T05:00:00.000"
remediation = "升级 pam_smb 和 pam_ntdom 模块至已修复版本（如 Linux-PAM 0.75+），或应用对应 Linux 发行版安全补丁。如无法升级，可在 PAM 配置中禁用 pam_smb/pam_ntdom 模块，改用安全的认证方式（如 LDAP/Kerberos）替代 SMB 认证。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Linux PAM pam_smb 和 pam_ntdom 模块缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:34.967"

