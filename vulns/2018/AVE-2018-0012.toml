[basic]
description = "Cisco IOS、IOS XE 和 IOS XR 软件的链路层发现协议（LLDP）子系统中存在格式化字符串漏洞。该漏洞源于 LLDP 报文处理过程中对用户输入格式化字符串过滤不严，未经身份认证的相邻攻击者可通过向受影响设备发送特制的 LLDP 数据包触发该漏洞，成功利用可导致设备拒绝服务（DoS）或实现任意代码执行，获取设备高权限控制。CVSS 评分 8.0，危害等级高。Cisco 已发布安全更新修复此漏洞。"
published = "2018-03-28T22:29:01Z"
remediation = "升级 Cisco IOS/IOS XE 至 Cisco 于 2018 年 3 月 28 日发布的修复版本（如 15.6(3)M 及后续维护版），或升级 Cisco IOS XR 至 5.1.3 及以上版本（4.x/5.0 系列建议迁移至 5.3.4）。该漏洞无变通缓解措施，必须通过软件升级修复。在无法立即升级时，可在受影响的接口上执行 `no lldp enable` 全局关闭 LLDP 功能以消除攻击面。"
score = 8
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS Software、IOS XE Software和IOS XR Software LLDP子系统格式化字符串漏洞"
updated = "2026-06-17T01:30:00Z"

