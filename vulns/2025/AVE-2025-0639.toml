[basic]
description = "Microsoft Dynamics 365 Sales 存在服务端请求伪造（SSRF）漏洞，CWE-918。已获得授权的攻击者可利用该漏洞向内部网络资源发送特制请求，绕过访问控制，实现权限提升。攻击者需具备低权限并诱使用户交互（如点击链接），即可利用该漏洞读取内部端点敏感信息或执行未授权操作。该漏洞影响 Microsoft Dynamics 365 Sales 相关版本，CVSS 评分 8.7，危害等级高。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-06T23:15:08Z"
remediation = "此漏洞影响 Microsoft Dynamics 365 Sales 云服务，微软已在服务端完成修复，用户无需执行任何操作。如使用自托管版本，请确保已安装 2025 年 2 月安全更新或升级至最新受支持版本，并在网络层面限制 Dynamics 365 对外部资源的出站请求以缓解 SSRF 风险。"
score = 8.7
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Dynamics 365 Sales 服务端请求伪造特权提升漏洞"
updated = "2026-06-17T08:42:42Z"

