[basic]
description = "Linux 内核 2.4.1 至 2.4.11 版本的 Netfilter MAC 模块存在安全漏洞。当系统配置 Netfilter 基于 MAC 地址进行过滤时，远程攻击者可通过发送特制的小包绕过过滤规则，导致系统安全检查失效，可能影响数据的机密性、完整性和可用性。该漏洞源于内核 MAC 地址处理逻辑中的边界检查不足，攻击者无需认证即可远程利用，CVSS 评分 7.5。Linux 社区已在后续内核版本中修复此漏洞，建议用户升级至 2.4.12 或更高版本以获取完整保护。"
published = "2001-12-31T05:00:00Z"
remediation = "建议立即升级 Linux 内核至 2.4.12 或更高版本（受影响版本为 2.4.1 至 2.4.11）。Red Hat 用户可应用 RHSA-2003-195 安全更新（kernel-2.4.20-8 及以上）。如无法立即升级内核，可暂时在 iptables 中禁用 MAC 地址过滤规则（删除使用 -m mac 的规则）作为临时缓解措施，并改用 IP 地址或端口过滤替代。建议尽快安装发行版提供的内核安全补丁包并重启系统使其生效。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Linux Netfilter MAC地址过滤绕过漏洞"
updated = "2026-06-16T21:56:31Z"

