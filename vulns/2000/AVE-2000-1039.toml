[basic]
description = "OpenBSD 的 su 程序存在格式字符串漏洞，由于程序在处理用户提供的 shell 参数时未正确验证格式字符串，导致本地攻击者可通过向 su 程序传递特制的畸形 shell 参数触发该漏洞。成功利用此漏洞的攻击者可获得 root 权限，实现本地权限提升。该漏洞影响 OpenBSD 及可能其他基于 BSD 的操作系统，攻击者需拥有本地系统访问权限方可利用。"
published = "2000-12-19T05:00:00Z"
remediation = "立即应用 OpenBSD 官方补丁：下载并安装 ftp://ftp.openbsd.org/pub/OpenBSD/patches/2.7/common/028_format_strings.patch，或升级到包含该补丁的 OpenBSD 版本（2.8 及以上）。如无法立即升级，限制本地用户对 su 程序的访问权限，仅允许受信任用户组使用 su 命令作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "OpenBSD su程序格式字符串漏洞"
updated = "2026-06-16T21:52:56Z"

