[info]
author = "ave"
description = "验证 Apple Safari 6.0 之前版本在密码输入元素设置 autocomplete=off 时仍自动填充已保存密码的漏洞"
id = "POC-AVE-2012-0147"
name = "Apple Safari 密码自动填充认证绕过漏洞 PoC"
severity = "medium"
tags = ["ave-2012-0147"]
vuln_id = [
    "CVE-2012-0680",
    "AVE-2012-0147",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["autocomplete"]
