[basic]
description = "Linux 内核中的高级音频体系结构（ASoC）SOF（Sound Open Firmware）stream-ipc 组件在 sof_ipc_msg_data() 函数中存在空指针解引用漏洞。该函数在处理 IPC 消息数据时，未正确检查 sps->cstream 指针是否为 NULL，错误地假设当 sps->stream 为 NULL 时 sps->cstream 必然不为空，攻击者可利用此缺陷在特定条件下触发空指针解引用，导致系统崩溃或拒绝服务。该漏洞影响 Linux 内核的 ASoC SOF 音频子系统，需要本地访问权限且需要具备相应的用户权限才能触发，主要威胁系统可用性。受影响版本包括集成 SOF 音频驱动且使用相关 IPC 消息处理路径的内核版本。"
published = "2025-03-12T10:15:17Z"
remediation = "建议将 Linux 内核升级至已修复版本：6.6.80、6.12.17、6.13.5 或 6.14 及以上版本。对于 Ubuntu 24.04 LTS，应安装内核版本 6.8.0-78.78 或更高；Ubuntu 24.10 应安装 6.11.0-26.26 或更高。Debian/Red Hat 等发行版用户请关注各自安全公告并安装对应内核更新包。如当前无法立即升级内核，且系统未使用 Sound Open Firmware (SOF) 音频功能，可在内核启动参数中添加 `snd_sof_intel_hda_common.disable=1` 禁用 SOF 驱动作为临时缓解措施，但这会影响高端音频编解码器功能。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 ASoC SOF 空指针解引用漏洞"
updated = "2026-06-17T08:44:25Z"

