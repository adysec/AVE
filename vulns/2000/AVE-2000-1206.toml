[basic]
description = "Cmail 2.4.7 的 Web 管理界面存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向目标系统发送超长 GET 请求触发缓冲区溢出，导致任意命令执行，可完全控制受影响服务器。该漏洞影响 Cmail 2.4.7 及可能更早版本，CVSS 评分 10.0，危害等级严重。厂商已发布修复版本，建议升级至最新版。"
published = "2000-06-05T04:00:00Z"
remediation = "立即升级 Cmail 至 2.4.7 以上已修复版本，或联系厂商 Computalynx 获取安全补丁。由于该产品已停止维护，建议迁移至受支持的邮件服务器软件（如 Exchange、Postfix），并在网络边界防火墙限制对 Cmail Web 管理接口（默认 80/8000 端口）的访问来源 IP，仅允许受信任的管理网段连接。同时可在反向代理或 WAF 中配置规则，拦截超长 GET 请求以作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Cmail 2.4.7 Web界面缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:51:59Z"

