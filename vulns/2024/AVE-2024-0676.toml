[basic]
description = "Linux 内核 ASoC 子系统中 SOF Intel HDA-DAI 驱动存在空指针解引用漏洞。当音频拓扑（topology）为聚合放大器创建 DAI widget 数量不足时，CPU DAI 无法关联到有效的 widget，在参数处理过程中访问空指针导致内核崩溃。本地低权限攻击者可利用此漏洞触发拒绝服务（系统崩溃），影响使用 Intel HDA 音频设备的 Linux 系统。Red Hat 已通过 RHSA-2025:20518 安全公告修复。"
published = "2025-02-27T03:15:12Z"
remediation = "升级 Linux 内核至 6.12.14、6.13.3 或 6.14 及以上版本，其中已包含对 hda-dai 中 DAI widget 空指针解引用的修复。RHEL 9 用户可安装 RHSA-2025:20518 提供的 kernel-5.14.0-611.5.1.el9_7 更新包，安装后重启系统生效。如无法立即升级，可在拓扑配置中避免为聚合放大器使用不匹配的 DAI widget 数量作为临时规避措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 ASoC SOF Intel HDA-DAI 空指针解引用漏洞"
updated = "2026-06-17T08:14:27Z"

