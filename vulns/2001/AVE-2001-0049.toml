[basic]
description = "Solaris 7 及更早版本中的 arp 命令在处理 -f 参数时存在缓冲区溢出漏洞。本地攻击者可通过构造超长的 -f 参数值触发该溢出，进而在目标系统上执行任意命令。该漏洞影响 Solaris 7 及其早期版本以及 Solaris 8-beta，攻击者需要具备本地登录权限才能利用此漏洞，成功利用后可获得系统的完全控制权，危害等级较高。"
published = "2001-03-12T05:00:00.000"
remediation = "建议升级至 Solaris 8 及以上版本并安装 Sun 官方补丁 108993-01 (针对 Solaris 7) 或 108994-01 (针对 Solaris 8)。若无法立即升级，可通过 RBAC 限制 arp 命令执行权限：编辑 /etc/user_attr 移除普通用户的 arp 执行授权，或使用 chmod 700 /usr/sbin/arp 仅允许 root 执行作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Sun Solaris arp 命令本地缓冲区溢出漏洞"
updated = "2026-06-16T21:53:41.017"

