[basic]
description = "Microsoft SharePoint Server 存在远程代码执行漏洞，源于对用户输入验证不当（CWE-20），攻击者可构造恶意文件诱导用户打开，触发代码执行。该漏洞影响 SharePoint Server 多个版本，CVSS 3.1 评分 7.8（HIGH），攻击向量为本地（AV:L），需用户交互（UI:R）但无需权限（PR:N），成功利用可完全控制服务器的机密性、完整性和可用性。Microsoft 已于 2025 年 1 月发布安全更新修复此漏洞。"
published = "2025-01-14T18:16:00.227"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新：SharePoint Enterprise Server 2016 升级至 16.0.5483.1001，SharePoint Server 2019 升级至 16.0.10416.20041，SharePoint Server Subscription Edition 升级至 16.0.17928.20356。可通过 Microsoft Update 或 Windows Server Update Services (WSUS) 自动部署。如无法立即打补丁，建议限制对 SharePoint 服务器的本地访问权限，并禁用不必要的用户交互功能作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft SharePoint Server 远程代码执行漏洞"
updated = "2026-06-17T08:43:09.363"

