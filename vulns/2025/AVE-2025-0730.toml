[basic]
description = "Windows Cloud Files Mini Filter Driver 存在缓冲区过度读取（CWE-126）漏洞，低权限攻击者可在本地登录系统后运行特制程序，利用该驱动对内存数据的错误边界检查触发越界读取，从而将进程权限提升至 SYSTEM 级别。成功利用后可完全控制受影响系统，执行任意代码、安装程序、查看/修改/删除数据。该漏洞影响所有受支持的 Windows 10/11 及 Windows Server 版本，CVSS 评分 7.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复。"
published = "2025-01-14T18:15:46Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新（Windows 10 对应 KB5049981，Windows 11 对应相应累积更新），或通过 Windows Update 自动获取更新。由于该漏洞需本地低权限访问，建议同时限制非授权用户的本地登录权限作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Cloud Files Mini Filter Driver 特权提升漏洞"
updated = "2026-06-17T08:42:57Z"

