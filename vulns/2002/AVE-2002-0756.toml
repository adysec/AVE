[basic]
description = "QNX RTOS 6.1.0 的 phlocale 和 pkg-installer 工具存在本地缓冲区溢出漏洞。phlocale 程序在处理 ABLANG 环境变量时未对输入长度进行边界检查，pkg-installer 在处理 -u 命令行选项时同样存在未限制长度的字符串拷贝，攻击者可通过构造超长输入溢出栈缓冲区并覆盖返回地址，从而在系统上执行任意代码。该漏洞影响 QNX RTOS 6.1.0 版本，仅需本地登录权限即可利用，成功利用后可获得与受影响进程相同的权限，进而完全控制系统。CVSS 评分为 7.2，危害等级为高危。Exploit-DB 上已有公开的本地利用代码可供参考。"
published = "2002-12-31T05:00:00Z"
remediation = "建议升级至 QNX RTOS 6.2 或更高版本以修复该缓冲区溢出漏洞。若无法立即升级，应限制本地普通用户执行 pkg-installer 的权限，并严格控制 ABLANG 等环境变量的输入长度，以防止通过恶意构造的参数触发溢出。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "QNX RTOS 6.1 PKG-Installer 本地缓冲区溢出漏洞"
updated = "2026-06-16T22:00:32Z"

