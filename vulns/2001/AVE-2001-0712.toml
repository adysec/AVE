[basic]
description = "FreeBSD 4.1.1 及更早版本中的 sort 命令使用可预测的临时文件名，且未正确处理临时文件已存在的情况。本地攻击者可通过在排序过程中创建同名符号链接或文件，将 sort 的输出重定向至其他文件或目录，导致 sort 程序崩溃，进而引发服务拒绝漏洞。该漏洞也可能对依赖 sort 命令的安全敏感脚本造成影响，导致脚本执行失败或产生非预期行为。攻击者需具备目标系统的本地访问权限即可利用此漏洞，无需身份认证，利用条件简单，影响范围涵盖使用受影响版本 FreeBSD 及部分其他操作系统的服务器和终端设备。"
published = "2001-06-02T04:00:00Z"
remediation = "将受影响的 FreeBSD 系统升级至 4.2-RELEASE 或更高版本（4.2-STABLE、3.5-STABLE 修正日期之后版本），漏洞已在 FreeBSD 4.2 发布前修复。如无法立即升级，可从 ftp://ftp.FreeBSD.org/pub/FreeBSD/CERT/patches/SA-01:13/ 下载对应版本补丁，执行 # cd /usr/src/gnu/usr.bin/sort && patch -p < /path/to/patch && make depend && make all install 进行修复。FreeBSD 4.1.1-STABLE 已于 2000-11-11 修正，FreeBSD 3.5-STABLE 已于 2001-01-01 修正，建议通过 freebsd-update 或 ports 方式及时更新 sort 组件。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "FreeBSD sort 命令不安全的临时文件拒绝服务漏洞"
updated = "2026-06-16T21:54:04Z"

