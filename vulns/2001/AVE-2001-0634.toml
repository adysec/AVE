[basic]
description = "wu-ftpd 2.6.1-6 之前版本中的 privatepw 程序存在任意文件写入漏洞。本地攻击者可通过符号链接（symlink）攻击，在程序处理临时文件时诱导其向攻击者控制的路径写入数据，从而覆盖系统任意文件。该漏洞攻击复杂度较高，需要本地用户权限，且无法直接获取机密信息或造成拒绝服务，但可破坏系统文件完整性，为后续提权攻击创造条件。CVSS 评分 1.2，危害等级低。"
published = "2001-03-12T05:00:00Z"
remediation = "立即升级 wu-ftpd 至 2.6.1-6 或更高版本。Debian 用户可通过 apt-get update && apt-get upgrade wu-ftpd 安装安全更新 DSA-016；Mandrake 用户安装 MDKSA-2001-001 更新包。如无法升级，可移除 privatepw 程序的 setuid 权限（chmod u-s /usr/sbin/privatepw）作为临时缓解措施。"
score = 1.2
severity = "LOW"
sources = ["cve"]
title = "WU-FTPD wu-ftpd privatepw 符号链接攻击致任意文件写入漏洞"
updated = "2026-06-16T21:53:44Z"

