[basic]
description = "Windows NT 4.0 及 Windows 2000 系统中，SNMP Parameters 注册表项的默认权限配置不当，未对远程用户进行充分访问控制。未经身份认证的远程攻击者可通过网络访问目标系统的注册表，读取并可能修改 SNMP 团体字符串（community strings）。获取团体字符串后，攻击者能够进一步利用 SNMP 协议收集敏感网络配置信息、设备拓扑及系统参数，或在具备修改权限的情况下篡改网络配置，造成信息泄露及网络管理层面的安全风险。该漏洞影响 Windows NT 4.0 及 Windows 2000 平台，CVSS 评分为 4.6，危害等级为中危。"
published = "2001-02-16T05:00:00.000"
remediation = '安装 Microsoft 安全公告 MS00-095 发布的修复工具 regacl40，对 Windows NT 4.0 注册表项 HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\SNMP\Parameters\PermittedManagers 和 ValidCommunities 及其子项设置权限，仅允许 Administrators、System 和 Creator Owner 完全控制，移除其他用户的读取权限。若系统不需要 SNMP 服务，请在控制面板中直接卸载 SNMP 组件。同时建议升级到受支持的 Windows 版本，或在远程注册表（Winreg）键上禁用远程访问权限以降低风险。'
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows SNMP 服务注册表权限信息泄露漏洞"
updated = "2026-06-16T21:53:33.223"

