[basic]
description = "Linux 内核 powerpc/pseries 子系统的 IOMMU 动态 DMA 窗口（DDW）实现中存在内存管理缺陷。Power Hypervisor 可能分配与 DDW 范围重叠的 MMIO 窗口，但内核代码未正确将这些 MMIO 页面标记为保留，导致 IOMMU 在该范围内映射 DMA 缓冲区，引发内存访问冲突。该漏洞源于两个编码问题：一是索引变量使用 int 类型而地址为 unsigned long，导致位图设置时出现负值；二是 DMA 偏移量已按页对齐处理，但 MMIO 地址（64 位）未进行页对齐转换。本地攻击者可通过触发特定硬件探测流程（如 be2net 网卡驱动加载）利用此漏洞，导致系统内核崩溃（OOPS），造成拒绝服务。该漏洞影响 Linux 内核 6.4.0 及之前版本，CVSS 评分 5.5，危害等级中等。"
published = "2025-02-27T02:15:13Z"
remediation = "建议立即将 Linux 内核升级至 6.12.13、6.13.2 或 6.14 及以上版本，包含提交 7043d58ecd13 的修复。对于无法立即升级的 PowerVM LPAR 环境，可在引导参数中添加 iommu=nobypass 禁用 IOMMU bypass 作为临时缓解措施，但会降低 DMA 性能。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel PowerPC pSeries IOMMU 内存越界访问导致系统崩溃漏洞"
updated = "2026-06-17T08:14:24Z"

