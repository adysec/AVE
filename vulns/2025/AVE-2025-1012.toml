[basic]
description = "Linux 内核 ibmvnic 网络驱动程序存在释放后使用漏洞。该驱动在将数据包缓冲区成功发送至 VIOS（虚拟 I/O 服务器）后，仍尝试读取 skb（套接字缓冲区）结构体的 len 字段以递增 tx_bytes 统计值，但 VIOS 可能在发送后随时触发中断释放该内存，导致在读取 skb->len 与释放内存之间存在竞争条件。该漏洞影响使用 ibmvnic 驱动程序的 Linux 内核版本，主要波及 IBM PowerVM 虚拟化环境中的虚拟机网络接口。攻击者无需身份认证即可远程利用，在 LPM（实时分区迁移）期间竞争窗口显著增大，成功利用可能导致内核信息泄露、拒绝服务或权限提升，危害等级高，CVSS 评分 8.6。"
published = "2025-03-12T10:15:18Z"
remediation = "建议将 Linux 内核升级至修复版本：Debian 12 升级到 6.1.133-1，Debian 11 需通过 linux-6.1 包升级到 6.1.137-1~deb11u1，Ubuntu 22.04 LTS 升级到 6.8.0-1035.37~22.04.1，Ubuntu 20.04 LTS 升级到 5.15.0-1102.111~20.04.1，Ubuntu 18.04/16.04/14.04 ESM 用户需升级到对应 ESM 内核版本（如 5.4.0-1156.163~18.04.1 或 4.15.0-1195.210~16.04.1）。Red Hat 用户请安装 RHSA-2025:20518 或 RHSA-2025:20095 公告中的内核更新。如使用自定义内核，请应用包含 commit 501ac6a7e21b82e05207c6b4449812d82820f306 的补丁并重新编译。如短期内无法升级，可在启动参数中添加 ibmvnic.disable=1 禁用该网卡驱动作为临时缓解。"
score = 8.6
severity = "HIGH"
sources = ["msrc"]
title = "Linux内核 ibmvnic网络驱动 释放后使用漏洞"
updated = "2026-07-30T06:21:41Z"

