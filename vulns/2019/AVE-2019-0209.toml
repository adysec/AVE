[basic]
description = "Pulse Secure Pulse Connect Secure 及 Pulse Policy Secure 的管理员 Web 界面存在命令注入漏洞（CWE-78）。未经充分授权的攻击者可通过已认证的管理员账户，向 Web 界面提交包含恶意操作系统命令的输入，从而在目标服务器上执行任意系统命令。该漏洞影响 Pulse Connect Secure 9.0RX（9.0R3.4 之前）、8.3RX（8.3R7.1 之前）、8.2RX（8.2R12.1 之前）、8.1RX（8.1R15.1 之前）以及 Pulse Policy Secure 9.0RX（9.0R3.2 之前）、5.4RX（5.4R7.1 之前）、5.3RX（5.3R12.1 之前）、5.2RX（5.2R12.1 之前）、5.1RX（5.1R15.1 之前）等多个版本。CVSS 评分为 7.2（高危），攻击者需具备管理员身份认证后方可利用。"
published = "2019-04-26T02:29:00Z"
remediation = "立即升级 Pulse Connect Secure 至 9.0R3.4、8.3R7.1、8.2R12.1 或 8.1R15.1 及以上版本，或将 Pulse Policy Secure 升级至 9.0R3.2、5.4R7.1、5.3R12.1、5.2R12.1、5.1R15.1 及以上版本。升级前可临时限制管理界面访问来源 IP，并启用多因素认证以降低被利用风险。"
score = 7.2
severity = "HIGH"
sources = ["kev"]
title = "Pulse Secure Pulse Connect Secure VPN 任意命令执行漏洞"
updated = "2026-06-17T02:13:07Z"

