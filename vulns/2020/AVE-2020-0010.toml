[basic]
description = "Microsoft 浏览器（Internet Explorer 和 Edge）在处理内存对象访问时存在远程代码执行漏洞。攻击者可构造特制网站，通过诱导用户访问触发内存损坏，从而在当前用户上下文中执行任意代码。若当前用户拥有管理员权限，攻击者可完全控制受影响的系统，进而安装程序、查看/更改/删除数据或创建新账户。利用该漏洞需要用户交互（如点击恶意链接），且攻击复杂度较高，CVSS 评分 4.2。Microsoft 已通过修改浏览器处理内存对象的方式修复此漏洞。"
published = "2020-09-11T17:15:14Z"
remediation = "立即安装 Microsoft 2020 年 9 月安全更新（KB4571687 或对应版本累积更新），可通过 Windows Update 自动获取。该更新修改了浏览器处理内存中对象的方式，从根本上修复此漏洞。对于无法立即打补丁的系统，可配置 IE 增强安全配置（IE ESC）并限制用户仅访问受信任站点作为临时缓解措施。"
score = 4.2
severity = "MEDIUM"
sources = ["kev"]
title = "Microsoft 浏览器远程代码执行漏洞"
updated = "2026-06-17T02:46:53Z"

