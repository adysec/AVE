[basic]
description = "PHP HTTP 流包装器（http stream wrapper）的标头解析器在处理 HTTP 响应时未能正确处理折叠标头（folded headers），导致响应解析错误。攻击者可通过构造包含折叠标头的恶意 HTTP 响应，使 PHP 应用程序误解析响应内容，从而使用错误的标头、MIME 类型等信息，可能绕过安全策略或导致信息泄露。该漏洞影响 PHP 8.1.32 之前、8.2.28 之前、8.3.19 之前及 8.4.5 之前的版本，攻击者无需身份认证即可远程触发，但攻击复杂度较高（需控制 HTTP 服务器或中间人攻击），CVSS 评分 6.3，危害等级中危。"
published = "2025-03-29T06:15:36Z"
remediation = "升级 PHP 至 8.1.32、8.2.28、8.3.19 或 8.4.5 及以上版本。Debian 用户可参考 debian-lts-announce/2025/03/msg00014 应用安全更新。NetApp 用户参考 ntap-20250523-0008 安装对应补丁。如无法立即升级，可在应用层对 HTTP 响应头进行严格校验，过滤包含折叠空白字符（如换行后空格/制表符）的头部字段。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "PHP HTTP流包装器折叠标头解析不当漏洞"
updated = "2026-06-17T08:38:37Z"

