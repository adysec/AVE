[basic]
description = "该漏洞位于 KDE 2.x 的 telnet 协议处理子系统（KIO 组件中的 telnet.protocol）。攻击者可通过向目标系统发送特制的 URL 利用此漏洞，在本地或远程执行任意恶意代码。此安全问题影响 KDE 2.1 及后续所有版本，存在于 telnet 协议实现中对 URL 参数的验证不足，允许攻击者绕过安全控制，通过 KIO 子系统获取对目标系统的未授权访问权限。"
published = "2002-11-29T05:00:00Z"
remediation = "建议立即升级 KDE 至 2.2.2 或更高版本（或升级至 KDE 3.x 系列），该版本已修复 telnet KIO 子系统的任意代码执行漏洞。若无法立即升级，请在系统防火墙层面禁止 telnet:// 协议处理，或在 KDE 控制中心禁用 telnet KIO 模块（kcontrol → 网络 → 协议 → 禁用 telnet），并限制本地用户对 telnet.protocol 文件的执行权限（chmod 000 /usr/lib/kde2/telnet.protocol）。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "KDE telnet KIO 子系统 代码执行漏洞"
updated = "2026-06-16T21:59:03Z"

