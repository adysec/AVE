[basic]
description = "Atlassian Confluence Server和Data Center中的Widget Connector宏存在服务器端模板注入(SSTI)漏洞。未经身份认证的远程攻击者可通过向目标实例发送特制的JSON请求到`/rest/tinymce/1/macro/preview`接口，构造恶意Velocity模板参数触发服务器端模板注入，从而实现路径遍历读取服务器任意文件，并进一步执行任意代码导致服务器完全沦陷。该漏洞影响Confluence Server 6.6.12之前、6.7.0至6.12.2、6.13.0至6.13.2及6.14.0至6.14.1等多个版本，CVSS评分9.8，危害等级严重。"
published = "2019-03-25T19:29:01.647"
remediation = "标签中。<value>立即升级 Confluence Server 到安全版本：6.6.x 升级至 6.6.12，6.7.0-6.12.x 升级至 6.12.3，6.13.0-6.13.x 升级至 6.13.3，6.14.0 升级至 6.14.2。如暂无法升级，可在管理后台禁用 Widget Connector macro 作为临时缓解措施。升级前务必备份 Confluence 数据。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Atlassian Confluence Widget Connector Macro 服务端模板注入漏洞"
updated = "2026-06-17T02:35:05.567"

