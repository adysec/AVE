[basic]
description = "Sendmail 邮件传输代理存在缓冲区溢出漏洞，影响 5.79 至 8.12.7 版本。该漏洞源于 headers.c 文件中 crackaddr 函数在处理发件人与收件人头部注释字段时，未对格式化地址进行边界校验，导致缓冲区溢出。未经身份认证的远程攻击者可通过向目标系统发送包含特制格式化地址字段的邮件，触发该缓冲区溢出，进而在目标系统上执行任意代码。由于该漏洞位于核心邮件处理路径，且攻击者无需任何凭据即可利用，因此可被远程攻击者完全控制易受攻击的 Sendmail 服务器，造成极其严重的危害。"
published = "2003-03-07T05:00:00Z"
remediation = "立即将 Sendmail 升级至 8.12.8 或更高版本以修复 headers.c 中 crackaddr() 函数的缓冲区溢出漏洞。从 5.79 至 8.12.7 的所有版本均受影响，升级前请先从 https://www.sendmail.org 下载最新稳定版源码并重新编译安装。如无法立即升级，可在 sendmail.cf 配置文件中设置 `O PrivacyOptions=restrictqrun` 以限制队列访问，或在防火墙层对 SMTP 端口 25 的入站连接实施严格的源 IP 白名单过滤，同时限制外部主机通过 SMTP 提交过长或包含特殊格式的邮件头字段，以临时降低被远程利用的风险。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Sendmail 头处理缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:59:07Z"

