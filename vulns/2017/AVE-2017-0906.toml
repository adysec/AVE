[basic]
description = "Cisco IOS 和 IOS XE 系统的 SNMP 实现存在缓冲区溢出漏洞，源于受影响代码区域对 SNMP 数据包处理不当。远程认证攻击者可通过向目标设备发送特制的 SNMP 数据包触发缓冲区溢出，导致设备重载或远程代码执行，从而完全控制目标系统。该漏洞影响所有 SNMP 版本（v1、v2c 和 v3），攻击者需掌握 SNMP 只读团体字符串（v2c 及更早版本）或用户凭据（SNMPv3）方可利用。仅定向发送至受影响系统的流量可用于触发该漏洞。Cisco 已发布安全更新修复此漏洞。"
published = "2017-07-17T21:29:00Z"
remediation = "升级 Cisco IOS/IOS XE 至 Cisco 安全公告 cisco-sa-20170629-snmp 中指定的修复版本（使用 Cisco IOS Software Checker 查询对应版本）。如无法立即升级，可在全局配置模式下使用 snmp-server view NO_BAD_SNMP iso included 创建视图，逐一排除 ADSL-LINE-MIB、CISCO-BSTUN-MIB 等 10 个受影响 MIB，再通过 snmp-server community mycomm view NO_BAD_SNMP RO 限制 SNMP 只读访问。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS和IOS XE SNMP远程代码执行漏洞"
updated = "2026-06-17T01:22:54Z"

