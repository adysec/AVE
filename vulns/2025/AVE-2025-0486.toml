[basic]
description = "GNU Binutils 2.45 版本的 prdbg.c 文件中的 tg_tag_type 函数存在未检查返回值漏洞。该函数在处理调试信息时未对返回值进行有效性验证，可能导致程序在特定输入下出现异常行为。攻击者需要本地访问系统并具备低权限，通过构造特制的二进制文件触发该漏洞，造成受影响程序拒绝服务。由于该漏洞利用代码已公开，攻击门槛较低，可能被用于本地拒绝服务攻击。"
published = "2025-10-16T14:15:34Z"
remediation = "升级 GNU Binutils 至 2.45 之后已修复该问题的版本（关注 sourceware.org bug #33448 的补丁提交）。对于 SIMATIC S7-1500 CPU 1518-4 PN/DP MFP V3.1.5 用户，目前尚无官方修复，建议关注西门子安全公告 SSA-082556 的更新，并限制对受影响设备的本地访问权限作为临时缓解措施。"
score = 1.9
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils prdbg.c 未检查返回值漏洞"
updated = "2026-06-17T08:31:15Z"

