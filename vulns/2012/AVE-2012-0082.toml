[basic]
description = "Apple iOS 5.1 之前版本、iTunes 10.6 之前版本以及 Safari 5.1.4 之前版本所使用的 WebKit 引擎中存在内存破坏漏洞（CWE-119）。远程攻击者可通过诱导用户访问特制网站触发内存损坏，导致任意代码执行或应用程序崩溃。攻击无需身份认证，但需要用户交互（访问恶意网站），CVSS 评分为 9.3，危害等级严重。Apple 已在 2012 年 3 月发布的安全更新中修复此漏洞。"
published = "2012-03-08T22:55:02Z"
remediation = "将 Safari 升级至 5.1.4 或更高版本，将 iOS 升级至 5.1 或更高版本，将 iTunes 升级至 10.6 或更高版本。对于无法升级的系统，可禁用 JavaScript 解析功能或使用内容安全策略（CSP）限制不可信网页的加载作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:54Z"

