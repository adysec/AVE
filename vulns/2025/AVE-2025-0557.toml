[basic]
description = 'Python 标准库 tarfile 模块在处理 GNU LONGNAME/LONGLINK 多块成员时，错误地将 AREGTYPE (\x00) 块规范化为 DIRTYPE，导致精心制作的 tar 归档文件被 tarfile 模块解析为目录类型，而其他标准 tar 实现将其解析为普通文件，造成解析不一致。该漏洞影响使用 Python tarfile 模块解析 tar 文件的应用程序，攻击者需在本地控制 tar 文件内容并诱导受害者使用受影响 Python 版本解析，利用解析差异可能绕过路径校验或触发逻辑错误。CVSS 2.0 (LOW)，本地攻击、高攻击复杂度、需低权限、无用户交互，仅造成低完整性影响。Python 官方已在相关版本中修复该规范化逻辑缺陷。'
published = "2026-03-12T18:16:21Z"
remediation = "建议立即升级 Python 到 3.11.15、3.12.10 或 3.13.2 及以上版本（含修复补丁 42d754e、72dde10、7ad3093、9a23b75、ae99fe3、d109507）。若暂时无法升级，可临时禁用 tarfile 模块处理 GNU 格式长文件名/长链接的 tar 包，或在解压前使用 tar -tvf 校验归档完整性，禁止解压不可信来源的 tar 归档文件。"
score = 2
severity = "LOW"
sources = ["msrc"]
title = "Python CPython tarfile 模块目录类型标准化绕过漏洞"
updated = "2026-06-17T08:34:11Z"

