[basic]
description = "Allaire JRun 2.3.x 服务器的 JSP Servlet 组件 com.livesoftware.jrun.plugins.jsp 存在跨站脚本攻击漏洞，未经身份认证的远程攻击者可通过跨站脚本攻击方式向服务器注入恶意 JSP 代码，并直接调用 com.livesoftware.jrun.plugins.JSP servlet 进行编译和执行，从而在服务器端执行任意代码。该漏洞影响 Allaire JRun 2.3.x 系列版本，攻击者无需任何凭据即可在远程服务器上执行任意系统命令，完全控制目标服务器，造成严重的信息泄露、数据破坏及服务器沦陷风险。CVSS 评分为 10.0，危害等级为严重。"
published = "2000-12-11T05:00:00.000"
remediation = '立即升级到 Allaire JRun 4.0 或更高版本，因为 JRun 2.3.x 已经停止维护且存在多个严重安全漏洞。可在官方网站下载最新版本（http://www.allaire.com/products/jrun）。升级后必须修改 JSP servlet 配置，禁用路径遍历功能，限制文件访问权限到 Web 根目录。使用绝对路径访问 JSP 文件，并确保部署的 JSP 文件经过彻底的安全扫描。此外，建议部署 Web 应用防火墙 (WAF) 过滤包含 "/servlet/../" 的恶意请求，并定期监控服务器日志以检测可疑的 JSP 编译行为。'
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Allaire JRun 2.3.x JSP Servlet 跨站脚本远程代码执行漏洞"
updated = "2026-06-16T21:53:03.580"

