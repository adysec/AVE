[basic]
description = "BEA WebLogic Server 的代理插件存在缓冲区溢出漏洞，远程攻击者可通过向目标服务器发送包含超长 .JSP 扩展名的特制 URL 请求触发该漏洞，导致缓冲区溢出，进而实现任意代码执行。该漏洞影响 BEA WebLogic Server 多个版本，CVSS 评分 10.0，危害等级严重，攻击者无需身份认证即可远程利用。"
published = "2000-10-20T04:00:00.000"
remediation = "升级到 Oracle WebLogic Server 12.2.1.4 及以上受支持版本，该漏洞在后续版本中已修复。如无法升级，在反向代理或 WAF 层面过滤包含超长 .JSP 后缀的 URL 请求作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "BEA WebLogic Server 代理插件缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:15.377"

