[basic]
description = "Adobe Flash Player 存在整数溢出漏洞（CWE-190），攻击者可通过构造特制的恶意内容诱导用户访问，触发内存整数溢出，导致任意代码执行。该漏洞影响 Windows/Mac OS X/Linux/Android 及 Adobe AIR 等多个平台的 Flash Player 版本（Windows/Mac 上低于 10.3.183.20 和 11.3.300.257，Linux 上低于 10.3.183.20 和 11.2.202.236，Android 2.x/3.x 上低于 11.1.111.10，Android 4.x 上低于 11.1.115.9，以及 Adobe AIR 低于 3.3.0.3610），CVSS 评分 9.3，危害等级严重。攻击者无需身份认证，通过诱导用户打开恶意网页或文件即可触发漏洞，实现完全控制目标系统。Adobe 已发布安全更新修复此漏洞。"
published = "2012-06-09T00:55:01.067"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.20（Windows/Mac）或 11.3.300.257（Windows/Mac 11.x）、11.2.202.236（Linux 11.x），Adobe AIR 升级至 3.3.0.3610。鉴于 Adobe Flash Player 已于 2020 年底停止支持，建议彻底卸载 Flash Player 并迁移至 HTML5 标准，同时在浏览器中禁用 Flash 插件作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 整数溢出远程代码执行漏洞"
updated = "2026-06-16T23:40:50.390"

