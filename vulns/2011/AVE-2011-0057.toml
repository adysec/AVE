[basic]
description = "Adobe Flash Player 在处理 ActionScript 长数组对象时存在整数溢出漏洞。远程攻击者可通过诱导用户访问包含恶意 SWF 文件的网页触发该漏洞，成功利用可在受影响系统上以当前用户权限执行任意代码。该漏洞影响 Windows、Mac OS X、Linux、Solaris 平台上 10.3.181.14 之前版本以及 Android 平台上 10.3.185.21 之前版本的 Flash Player，CVSS 评分 9.3，危害等级严重。Adobe 已发布安全更新修复此漏洞。"
published = "2011-05-31T20:55:01Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.181.14 及以上版本（Windows/Mac/Linux/Solaris）或 10.3.185.21 及以上版本（Android）。由于 Adobe 已于 2020 年底停止 Flash Player 支持并发布 EOL 公告，建议彻底卸载 Flash Player 并迁移至 HTML5 标准，同时在浏览器中禁用 Flash 插件作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 整数溢出远程代码执行漏洞"
updated = "2026-06-16T23:27:46Z"

