[basic]
description = 'tags.<value>CGIForum 1.0 的 cgiforum.pl 脚本存在目录遍历漏洞。该脚本在处理"thesection"参数时未对用户输入进行充分过滤，远程攻击者无需任何身份认证，即可通过构造包含".."（点号点号）序列的特制参数值，突破可访问目录的边界，进而读取 Web 服务器上任意目标文件的内容，如系统配置文件、源代码或包含敏感信息的文件，造成敏感数据泄露。该漏洞利用方式简单，攻击者只要能够访问运行 cgiforum.pl 的 Web 服务即可触发，对机密性造成影响。'
published = "2001-01-09T05:00:00Z"
remediation = "立即升级 CGIForum 至最新版本，或迁移至其他仍在维护的论坛系统。如无法升级，修改 cgiforum.pl 中 thesection 参数处理逻辑，对用户输入进行路径规范化过滤，移除所有 ../ 及 %00 空字节截断字符，仅允许字母数字和下划线组成的合法 section 名称。同时配置 Web 服务器（Apache/Nginx）禁止 CGI 目录的路径遍历访问。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Markus Triska CGIForum 1.0 目录遍历漏洞"
updated = "2026-06-16T21:53:18Z"

