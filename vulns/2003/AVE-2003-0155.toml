[basic]
description = "Fetchmail 是一款广泛使用的开源邮件检索工具，用于通过 POP3、IMAP 等协议从邮件服务器收取邮件并转发到本地邮件投递系统。版本 6.2.4 及更早版本在处理邮件内容时，对长行数据的动态内存分配存在缺陷。当远程攻击者向运行受影响版本 Fetchmail 的系统发送特制的超长行邮件时，程序在解析邮件正文或头部的过程中无法正确分配足够的内存缓冲区，导致内存访问错误或缓冲区溢出，最终引发程序崩溃。该漏洞的影响范围涵盖使用 Fetchmail 5.9.0 至 6.2.4 版本的各类 Unix/Linux 系统，包括但不限于 Red Hat、Debian、Fedora 等主流发行版。攻击者无需身份认证，只需向目标用户的邮箱发送一封包含异常长行的恶意邮件即可触发漏洞，无需任何交互操作，攻击条件简单且可远程实施。成功利用后将导致 Fetchmail 进程异常终止，造成邮件服务中断（拒绝服务），但不会导致代码执行或数据泄露。攻击条件包括：目标系统运行受影响版本的 Fetchmail、攻击者能够向目标邮箱发送邮件（通过公开 SMTP 中继或已知邮件地址），且目标系统在收到邮件后自动触发 Fetchmail 收取。"
published = "2003-11-17T05:00:00Z"
remediation = "升级到 fetchmail 6.2.5 或更高版本。Fetchmail 6.2.4 及更早版本在处理邮件中长行时存在内存分配错误，远程攻击者可构造包含超长行的恶意邮件导致程序崩溃。建议通过系统包管理器或源码编译升级至 6.2.5 及以上版本，如无法立即升级，可在防火墙或邮件网关层面过滤包含异常长行的入站邮件作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Fetchmail 邮件处理内存分配拒绝服务漏洞"
updated = "2026-06-16T22:02:50Z"

