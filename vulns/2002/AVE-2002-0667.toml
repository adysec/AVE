[basic]
description = "IBM AS/400 系统的 System Request 菜单存在权限配置缺陷，未经充分授权的本地用户可通过访问 System Request 功能并查看系统中类型为 USRPRF 的对象名称，从而枚举出有效的用户账户列表。该漏洞导致敏感的用户账户信息泄露，攻击者无需身份认证即可获取系统内的合法用户名，为后续的暴力破解或针对性攻击提供重要线索。该漏洞影响 IBM AS/400 及其所运行的 OS/400 操作系统，攻击者需具备对目标系统的本地访问权限方可利用。IBM 已发布相关安全公告建议管理员通过配置对象级权限或禁用不必要的 System Request 功能来缓解此问题。"
published = "2002-12-31T05:00:00Z"
remediation = "建议管理员通过修改对象权限，限制非特权用户对 USRPRF（用户配置文件）类型对象的读取和列出权限；同时建议升级 OS/400 操作系统至最新补丁版本以修复系统菜单的权限控制缺陷。"
score = 2.1
severity = "LOW"
sources = ["exploitdb"]
title = "IBM AS/400 用户账户名称信息泄露漏洞"
updated = "2026-06-16T21:59:53Z"

