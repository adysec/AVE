[basic]
description = "Internet Explorer 的 MSHTML 引擎存在类型混淆（Type Confusion，CWE-843）漏洞，攻击者可通过构造特制的网页或文件诱导用户打开，触发内存损坏，从而在当前用户上下文中实现远程代码执行。成功利用该漏洞可获取目标系统的机密性、完整性和可用性控制权。该漏洞影响所有受支持的 Windows 系统中默认安装的 Internet Explorer 11 组件，攻击复杂度低且无需提前获取权限，但需要用户交互配合。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:57.170"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新：Windows Server 2025 安装 KB5050009，Windows Server 2022 安装 KB5049983，Windows Server 23H2 安装 KB5049984。可通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载。由于 Internet Explorer 已停止支持，建议卸载 IE 并迁移至 Microsoft Edge 的 IE 兼容模式；如无法立即打补丁，可配置组策略禁用 IE 作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Internet Explorer 远程代码执行漏洞"
updated = "2026-06-17T08:43:06.437"

