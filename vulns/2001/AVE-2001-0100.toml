[basic]
description = "FaSTream FTP++ Server 2.0 存在目录遍历漏洞，未经身份认证的远程攻击者可通过在 FTP 的 ls 命令中注入驱动器盘符（如 C:）来突破服务器设定的 FTP 根目录限制，进而列出服务器上任意目录的文件内容。该漏洞影响运行 Windows 系统的 FaSTream FTP++ 2.0 版本，攻击者无需凭据即可在匿名或已认证连接下发起利用，可导致敏感文件信息泄露。CVSS v2 评分为 5.0，危害等级为中危。"
published = "2001-06-02"
remediation = "升级 FaSTream FTP++ 至 Beta 10 Build 3 或更高版本，该版本已修复目录遍历漏洞。如无法立即升级，应在防火墙中限制 FTP 端口（默认 21）的访问权限，仅允许可信 IP 连接，并启用服务器日志监控检测异常目录访问请求。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Fastream FTP++ 目录遍历漏洞"
updated = "2001-06-02"

