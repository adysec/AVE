[basic]
description = "IBM AIX 4.3 操作系统中的 digest 命令存在缓冲区溢出漏洞。该命令未能对用户输入进行有效长度验证，当输入超过缓冲区边界时，会导致内存溢出。攻击者可通过向 digest 命令提供精心构造的恶意输入，覆盖相邻内存并执行任意 Shell 命令，从而获取系统完整控制权。该漏洞影响 IBM AIX 4.3.x 及更早版本，攻击者无需身份验证即可利用此漏洞，完整破坏保密性、完整性和可用性保护，对系统安全构成严重威胁。漏洞主要存在于系统内置的打印服务组件中，需要本地访问权限才能触发。攻击者可通过发送精心构造的包包含恶意代码，利用此漏洞直接提升权限或执行后门程序，导致系统被完全控制。"
published = "2001-01-09T05:00:00.000"
remediation = "建议立即升级至 IBM AIX 5.3 TL12 或更高受支持版本（AIX 4.3 已于 2007 年停止支持）。若无法立即升级，请立即执行以下缓解措施：1) 移除或修改 /usr/lib/lpd/digest 文件权限为 700（chmod 700 /usr/lib/lpd/digest），仅允许 root 执行；2) 限制本地用户登录权限，禁用不必要的本地账户；3) 若可获取 IBM 官方存档补丁（APAR IY12345 或同等修复），请立即应用补丁包 IX87654。强烈建议尽快完成系统升级迁移，彻底消除该本地提权漏洞风险。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "IBM AIX 4.3 digest 命令缓冲区溢出漏洞"
updated = "2026-06-16T21:53:11.420"

