[basic]
description = "Drupal 核心在处理上传文件时未对文件名进行充分过滤和转义，导致攻击者可通过上传包含特殊扩展名的文件绕过 MIME 类型检查，使文件被服务器错误解析为 PHP 脚本执行。该漏洞影响 Drupal Core 7.x 至 9.x 多个版本分支，攻击者需拥有上传文件的权限（如管理员或特定角色），利用方式简单且危害严重，可导致远程代码执行、网站被完全控制。Drupal 官方已在 7.74、8.8.11、8.9.9 及 9.0.8 版本中修复此漏洞。"
published = "2020-11-20T16:15:15.433"
remediation = "升级 Drupal Core 至安全版本：7.x 升级到 7.74 及以上，8.8.x 升级到 8.8.11 及以上，8.9.x 升级到 8.9.9 及以上，9.0.x 升级到 9.0.8 及以上。如无法立即升级，可在服务器配置中禁用 PHP 执行权限的上传目录（如 `sites/default/files`），并配置 Web 服务器（Apache/Nginx）禁止解析上传目录中的 PHP 文件。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Drupal Drupal Core 文件上传安全漏洞"
updated = "2026-06-17T02:53:32.867"

