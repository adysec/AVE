[basic]
description = "Logging operator 在渲染 Fluentd 配置时未对 CRD 中的字符串（如 Flow 资源的 record_transformer.records 值）进行转义处理，导致具有 Flow 资源创建权限的攻击者可通过在记录值中注入换行符和 Fluentd 配置指令，闭合当前配置块并插入包含 @type exec 插件的恶意 <match **> 块，从而在 Fluentd 聚合器容器中执行任意命令。该漏洞影响 Logging operator 6.6.0 之前的所有版本，CVSS 评分 9.9，危害等级严重。攻击者仅需在受监控命名空间内具备 Flow 和 Output 资源的创建权限即可触发利用，在 AWS EKS 等云环境中还可进一步通过 IMDS 获取节点元数据，造成横向移动风险。官方已在 6.6.0 版本中修复此漏洞。"
published = "2026-07-29T17:16:52Z"
remediation = "立即将 Logging operator 升级至 v6.6.0 或更高版本，该版本已修复 Fluentd 配置渲染器未转义 CRD 值的问题。如无法立即升级，可在 Fluentd 配置中禁用 @type exec 插件（通过设置环境变量 FLUENTD_DISABLE_EXEC_PLUGIN=true），并严格限制 Flow/Output 资源的创建权限至受信命名空间。"
score = 9.9
severity = "CRITICAL"
sources = ["ghsa"]
title = "Kube-Logging Logging operator Fluentd 配置注入远程代码执行漏洞"
updated = "2026-07-30T14:16:59Z"

