[basic]
description = "基于 Chromium 的 Microsoft Edge 浏览器存在类型混淆（Type Confusion）远程代码执行漏洞（CWE-843）。攻击者可通过构造特制的恶意网页，诱使用户在受影响版本的 Edge 浏览器中访问该页面，成功利用此漏洞可在当前用户上下文中执行任意代码，完全控制受影响的系统。该漏洞影响 Microsoft Edge 133.0.3065.51 之前的所有版本，CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 2 月安全更新中发布修复版本。"
published = "2025-02-06T23:15:09Z"
remediation = "立即将 Microsoft Edge 升级至 133.0.3065.51 或更高版本，可通过 Edge 设置 > 关于 Microsoft Edge 检查更新自动安装。企业环境可通过组策略配置自动更新或使用 Microsoft Endpoint Manager 批量推送更新。如无法立即升级，可配置 Edge 以增强安全模式运行并限制用户访问不可信网站作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Edge (Chromium-based) 远程代码执行漏洞"
updated = "2026-06-17T08:43:09Z"

