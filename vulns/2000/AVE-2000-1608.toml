[basic]
description = "Norton AntiVirus 5.00.01C 配合 Novell Netware 客户端时，在首个用户注销系统后未能正确重启自动防护服务，导致防毒保护失效。该漏洞影响运行该组合环境的系统，攻击者可在用户注销后利用防护空窗期植入恶意代码或执行任意操作，CVSS 评分 10.0（AV:N/AC:L/Au:N/C:C/I:C/A:C），属远程可利用的严重缺陷。"
published = "2000-10-20T04:00:00Z"
remediation = "建议升级 Norton AntiVirus 至 5.00.01D 或更高版本（Symantec 官方补丁修复了首次用户注销后自动防护服务无法重启的问题），或通过 Symantec LiveUpdate 安装 2000 年 10 月发布的安全更新。若暂时无法升级，可在 Novell Netware 客户端登出脚本中添加 `navapw32.exe /restart` 命令强制重启自动防护服务作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "诺顿 诺诺瑞客户端防毒自动保护失效漏洞"
updated = "2026-06-16T21:52:29Z"

