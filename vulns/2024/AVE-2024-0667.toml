[basic]
description = "Linux 内核网络调度子系统中的 SFQ（随机公平队列）调度器存在数组索引越界漏洞。当 SFQ 队列限制被设置为 1 时，第二个数据包入队被丢弃后队列尾指针未正确清空，导致后续出队操作中对空槽位进行减计数引发整数下溢，进而触发数组越界访问，造成内核崩溃。本地攻击者可通过低权限构造特定网络流量触发该漏洞，导致系统拒绝服务。该漏洞影响 Linux 内核 5.10 及之前版本，CVSS 评分 5.5，危害等级中等。"
published = "2025-02-27T02:15:13Z"
remediation = "立即更新 Linux 内核至以下已修复版本：5.4.297+、5.10.239+、5.15.186+、6.1.129+、6.6.76+、6.12.13+ 或 6.13.2+。可通过各发行版包管理器安装更新（如 apt install linux-image 或 yum update kernel）后重启。对于使用 SFQ qdisc 的场景，避免将 limit 设为 1，建议 limit≥2。Siemens SIMATIC S7-1500 CPU 1518(F)-4 PN/DP MFP V3.1.5 用户应升级至 V3.1.6。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Kernel SFQ 队列调度器数组越界访问拒绝服务漏洞"
updated = "2026-06-17T08:14:24Z"

