[basic]
description = "WordPress 的 custom-admin-page 插件（BestWebSoft 开发）0.1.2 之前版本存在跨站脚本（XSS）漏洞。该漏洞源于插件对用户输入的 category 参数缺乏充分的过滤与转义处理，导致攻击者可在 admin.php?page=bws_panel 页面中注入恶意脚本。已登录认证的攻击者可通过构造特制的 URL 诱使管理员点击，从而在受害者浏览器中执行任意 JavaScript 代码，可能导致会话劫持、敏感信息窃取或后台恶意操作。攻击者无需提升权限，但需受害者交互触发。升级至 0.1.2 及以上版本即可修复。"
published = "2019-08-13T17:15:13Z"
remediation = "升级 WordPress 的 custom-admin-page 插件至 0.1.2 或更高版本。在 WordPress 后台 → 插件页面找到该插件并点击「更新」，或从 https://wordpress.org/plugins/custom-admin-page/ 下载最新版手动上传覆盖。如无法立即更新，可暂时禁用该插件作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress custom-admin-page插件 跨站脚本漏洞"
updated = "2026-06-17T01:12:57Z"

