[basic]
description = "PostgreSQL libpq 客户端库函数中存在整数环绕（CWE-190）漏洞，攻击者可通过向使用 libpq 的应用程序发送特制输入，触发多个 libpq 函数中的整数环绕，导致内存分配大小不足，进而写入超出边界数百兆字节的数据，最终造成应用程序段错误崩溃。该漏洞影响 PostgreSQL 18.1 之前、17.7 之前、16.11 之前、15.15 之前、14.20 之前以及 13.23 之前的所有版本。攻击条件为无需身份认证的网络可达，利用方式为发送精心构造的输入数据触发整数环绕，属于中等严重程度漏洞。"
published = "2025-11-13T13:15:45Z"
remediation = "建议立即升级 PostgreSQL 到修复版本：18.1、17.7、16.11、15.15、14.20、13.23 或更高版本。使用 Linux 发行版（如 SUSE SLES）的用户请应用供应商安全补丁（如 SUSE-SU-2026:20193-1）。如无法立即升级，建议在网络层限制 PostgreSQL 客户端连接来源，限制 libpq 接收的输入数据大小，或使用连接池器（如 PgBouncer）配合输入长度校验作为临时缓解措施。"
score = 5.9
severity = "MEDIUM"
sources = ["msrc"]
title = "PostgreSQL libpq 整数环绕导致缓冲区溢出漏洞"
updated = "2026-06-17T08:33:00Z"

