[basic]
description = "nfs-utils 软件包中的 rpc.statd 守护进程在处理远程过程调用时，未能正确过滤不受信任的格式字符串参数，存在格式字符串漏洞。远程攻击者无需身份认证即可通过网络向目标系统发送特制的 RPC 请求，利用该漏洞以 root 权限执行任意代码。该漏洞影响 Conectiva 4.x/5.x、Debian 2.x、RedHat 6.x、S.u.S.E 6.x/7.0 及 Trustix 1.x 等多个 Linux 发行版，CVSS 评分 10.0，危害等级严重。"
published = "2000-07-16T04:00:00.000"
remediation = "立即安装各发行版厂商提供的 nfs-utils 安全更新：Red Hat 用户应用 RHSA-2000:043 更新 nfs-utils 至修复版本；Caldera 用户应用 CSSA-2000-025；Debian/Conectiva/SuSE/Trustix 用户升级 nfs-utils 到各自厂商提供的补丁版本。如无法立即升级，可在 /etc/hosts.deny 中添加 `rpc.statd: ALL` 限制访问来源，或在防火墙层面阻断 111 (portmap) 和 2049 (nfs) 端口的非信任访问作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Linux 多平台 rpc.statd 远程格式字符串漏洞"
updated = "2026-06-16T21:52:13.413"

