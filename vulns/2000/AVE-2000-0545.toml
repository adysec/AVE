[basic]
description = "Cisco TACACS+（tac_plus）服务器存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过发送携带超长长度字段的畸形数据包触发该漏洞，导致目标设备拒绝服务。该漏洞影响运行TACACS+服务的Cisco IOS设备，攻击条件为无需认证即可从网络远程发起请求，利用方式简单直接。CVSS评分为5.0，危害等级为中等。"
published = "2000-05-30T04:00:00Z"
remediation = "Cisco 已发布针对 tac_plus 服务器缓冲区溢出漏洞的安全补丁，建议立即升级 tac_plus 至修复该漏洞的版本，或升级受影响 Cisco IOS 版本至包含补丁的发布版本。同时应在网络边界通过访问控制列表限制仅可信管理网段可访问 TACACS+ TCP 49 端口，如临时无法打补丁，可在边界防火墙上阻断外部对该端口的访问作为缓解措施。若网络中未使用 TACACS+ 认证服务，建议在路由器与交换机上禁用相关认证配置以消除风险暴露面。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Cisco TACACS+ tac_plus 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:51:50Z"

