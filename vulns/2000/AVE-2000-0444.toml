[basic]
description = "Linux 系统上 BSD mailx 8.1.1-10 版本中的 mail 命令存在缓冲区溢出漏洞。本地攻击者可通过向 -c（抄送）参数传递超长字符串触发缓冲区溢出，导致程序崩溃或执行任意代码，从而获取目标系统的 root 权限。该漏洞影响运行 BSD mailx 8.1.1-10 的 Linux 发行版，攻击者需拥有本地用户权限即可利用，无需交互操作。"
published = "2000-08-08T04:00:00Z"
remediation = "升级 mailx 至修补后的版本（如 Debian 于 2000-06-05 发布的安全更新），或替换为不受影响的现代版本（如 Heirloom mailx 或 s-nail）。临时缓解措施：限制本地用户对 mailx 的 SUID 执行权限，移除不必要的 SUID 位。该漏洞通过超长 -c 参数触发缓冲区溢出，仅本地用户可利用，建议优先通过包管理器更新系统邮件客户端。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "BSD mailx 缓冲区溢出本地权限提升漏洞"
updated = "2026-06-16T21:51:58Z"

