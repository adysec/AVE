[basic]
description = "QNX RTOS 6.1.0 的定时器实现存在缺陷，本地低权限用户可通过创建大量具有1毫秒间隔的定时器触发系统资源耗尽，导致系统挂起拒绝服务。在特定条件下该漏洞还可能被利用执行任意代码。攻击者需要具备目标系统的本地访问权限，无需额外身份认证即可触发漏洞。成功利用将导致系统不可用，影响运行 QNX 6.1.0 的嵌入式设备及实时系统。"
published = "2002-12-31T05:00:00Z"
remediation = "升级到 QNX Neutrino RTOS 6.1.1 或更高版本（如 6.2.x、6.3.x、6.4.x、6.5.x），厂商已在后续版本中修复了定时器实现缺陷。若无法立即升级，应通过文件系统权限限制本地用户对定时器相关系统调用（TimerCreate、TimerSettime）的访问，或仅允许可信用户登录系统作为临时缓解措施。建议向 QNX 官方支持门户申请该版本的安全补丁。"
score = 2.1
severity = "LOW"
sources = ["exploitdb"]
title = "QNX RTOS 6.1 TimeCreate 本地拒绝服务漏洞"
updated = "2026-06-16T22:00:25Z"

