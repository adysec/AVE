[basic]
description = "Jenkins Script Security Plugin 1.49 及更早版本中存在沙箱绕过漏洞，位于 src/main/java/org/jenkinsci/plugins/scriptsecurity/sandbox/groovy/GroovySandbox.java 文件中。具有提供沙箱化脚本权限的攻击者可利用该漏洞绕过沙箱限制，在 Jenkins 主节点 JVM 上执行任意代码，导致远程代码执行。该漏洞影响 Jenkins Script Security Plugin 全系列低版本，攻击者需具备 Jenkins 的低权限账户才能触发，无需用户交互。CVSS 评分 8.8，危害等级高，建议用户升级至 Script Security Plugin 1.50 或更高版本修复。"
published = "2019-01-22T14:29:00.267"
remediation = "立即将 Jenkins Script Security Plugin 升级至 1.50 或更高版本，同时将 Pipeline: Groovy Plugin 升级至 2.61.1 以上、Pipeline: Declarative Plugin 升级至 1.3.4.1 以上。如无法立即升级，可在 Jenkins 系统配置中禁用未受信任的 SCM 仓库中的 Jenkinsfile 执行，并严格限制 Overall/Read 权限的授予范围作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "Jenkins Script Security Plugin 远程代码执行漏洞"
updated = "2026-06-17T02:09:30.830"

