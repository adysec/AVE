[basic]
description = "node-tar 是 Node.js 生态中广泛使用的 tar 归档文件操作库。在 7.5.18 之前的版本中，其 tar.replace() 接口在扫描现有归档文件时，会解析每个 tar 文件头的条目大小字段。攻击者可以构造一个校验和合法的 tar 文件头，将条目大小编码为负值（如 -512），导致扫描器在计算下一个条目的偏移量时出现错误，使得扫描位置无法前进，反复解析同一个文件头，陷入无限循环。调用 tar.replace() 处理攻击者可控的 tar 归档文件时，工作进程将被永久挂起，造成拒绝服务。该漏洞无需身份认证，远程攻击者通过网络即可触发，影响所有使用 node-tar 且调用 replace 接口的 Node.js 应用。建议升级至 7.5.18 或更高版本修复。"
published = "2026-07-08T16:16:33.990"
remediation = "立即将 node-tar 升级至 7.5.18 或更高版本（`npm install tar@^7.5.18`）。如无法升级，避免对不可信的 tar 存档调用 `tar.replace()` API，改用 `tar.extract()` 等不受影响的接口，并在调用前对存档进行校验。"
score = 8.7
severity = "HIGH"
sources = ["ghsa"]
title = "node-tar tar 拒绝服务漏洞"
updated = "2026-07-10T18:54:12.670"

