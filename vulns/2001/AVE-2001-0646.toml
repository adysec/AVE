[basic]
description = "Cisco AP340 无线基站生成的 TCP 初始序列号（ISN）具有可预测性，远程攻击者可通过分析并预测该序列号来伪造或劫持目标设备的 TCP 连接。该漏洞影响 Cisco Aironet AP340 系列无线接入点，攻击者无需身份认证即可在局域网或远程发起 TCP 会话劫持攻击，进而可能窃听通信数据、注入恶意数据包或中断合法连接。利用此漏洞需要攻击者能够接收到目标设备的网络流量以分析 ISN 生成模式，随后利用预测出的 ISN 值构造伪造的 TCP 数据包实现连接劫持。"
published = "2001-01-01T05:00:00Z"
remediation = "建议升级 Cisco Aironet AP340 固件至 12.01T 或更高版本（需通过 Cisco.com 下载对应 IOS 镜像并通过 TFTP 刷写）。若无法立即升级，可在网络边界部署 TCP 序列号随机化防护（如启用防火墙的 TCP ISN 随机化功能），并限制对 AP 管理接口的访问仅允许受信管理网段。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Cisco Aironet AP340 TCP 初始序列号预测漏洞"
updated = "2026-06-16T21:53:47Z"

