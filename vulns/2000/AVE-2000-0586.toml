[basic]
description = "tags.<value>Internet Explorer 4.x 和 5.x 存在 SSL 证书验证漏洞，当通过图片或框架连接服务器时，浏览器未能正确验证 SSL 证书的所有内容。攻击者可构造恶意 SSL 证书，通过嵌入恶意图片或框架的页面诱导用户访问，绕过证书验证实施中间人攻击或欺骗攻击。该漏洞影响 IE 4.x 和 5.x 版本，CVSS 评分 2.6，攻击复杂度高，仅影响机密性。"
published = "2000-06-05T04:00:00Z"
remediation = '升级至 Internet Explorer 6.0 或更高版本（含 SP1 补丁），或安装微软发布的安全更新 MS00-039 (Q260581)。若无法升级，可在 Internet 选项→安全→自定义级别中禁用"跨框架/图片的 SSL 证书验证"功能，或通过组策略禁止在非信任区域加载 HTTPS 内容作为临时缓解措施。'
score = 2.6
severity = "LOW"
sources = ["avd"]
title = "Microsoft Internet Explorer SSL证书验证漏洞"
updated = "2026-06-16T21:51:54Z"

