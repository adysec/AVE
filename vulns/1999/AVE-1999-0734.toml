[basic]
description = "classifieds.cgi 是 Classifieds.cgi 1.0 这一 CGI 程序的脚本，该脚本对用户输入参数的处理缺乏安全校验，未正确过滤或转义列目录、读文件等操作传给操作系统的外壳命令，从而在拼接执行系统命令时引入了注入风险。由于任意输入参数可直接拼接并传递给底层 shell 进行解析执行，任何能够访问该脚本的远程用户都可以利用此缺陷，通过在请求参数中注入管道符、重定向符等列元字符（shell metacharacters）构造恶意指令，实现任意文件的读取，进而可能导致服务器敏感信息泄露，破坏数据的机密性与完整性。该漏洞攻击条件低，无需身份认证即可触发，属于典型的命令注入类安全缺陷。攻击者可构造特殊请求，通过 web 服务器调用 classifieds.cgi 并注入包含元字符内容来执行任意命令或读取任意文件，从而获取目标系统上的敏感数据。"
published = "1999-12-15T05:00:00Z"
remediation = "该漏洞源于老旧 CGI 脚本 classifieds.cgi 对用户输入的处理存在缺陷，允许攻击者通过 shell 元字符（如 |、;、$()）拼接系统命令实现任意文件读取。由于该脚本年代久远且原作者已停止维护，无安全补丁可升级，建议采取以下措施：1) 立即从 Web 目录（如 cgi-bin 目录）中移除或重命名该脚本，彻底停止对外提供服务，同时排查是否还有其他类脚本可被调出；2) 对 CGI 程序（尤其是本脚本）一律不做任何 shell 命令拼接处理，改用参数化调用或禁止通过函数 exec/system 执行用户输入；3) 在 Web 服务器层面对 CGI 目录做白名单限制，仅允许必要的可信脚本访问，并限制运行 CGI 的用户权限为最低权限账号（不可读取 /etc/passwd 等敏感文件）；4) 在网络层面通过防火墙/WAF 拦截包含管道符、分号等特殊字符的 CGI 请求参数。若业务仍依赖该类功能，应改用现代方案重新实现并立即升级。由于系统过于陈旧，更好的方案是彻底弃用该脚本并迁移至受支持的较新平台。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Greg Matthews Classifieds.cgi 命令注入任意文件读取漏洞"
updated = "2026-06-16T21:49:21Z"

