[basic]
description = "Windows 错误报告 (WER) 服务在处理错误报告文件时存在 DACL（自主访问控制列表）配置缺陷，导致低权限本地用户可通过构造恶意错误报告文件，利用 WER 服务以 SYSTEM 权限写入任意文件，进而实现本地权限提升。该漏洞影响 Windows x86/x64 多个版本（含 Windows 10/Server 2016/2019 等），CVSS 3.1 评分 7.8 (HIGH)，攻击向量为本地 (AV:L)，攻击复杂度低 (AC:L)，需低权限 (PR:L)，无需用户交互 (UI:N)，机密性/完整性/可用性均高影响 (C:H/I:H/A:H)。攻击者仅需本地普通用户权限，即可利用 WER 处理错误报告时的 DACL 缺陷写入任意文件实现提权至 SYSTEM 权限。该漏洞已被列入 CISA 已知被利用漏洞目录 (KEV)，ExploitDB (EDB-46917) 及多个 GitHub 仓库均有公开 PoC/EXP 代码，Microsoft 已于 2019 年 5 月补丁周二发布修复补丁。"
published = "2019-05-16T19:29:00Z"
remediation = "立即安装 Microsoft Windows 2020 年 2 月安全更新 (KB4522osocial)，或通过 Windows Update 自动更新以修复错误报告服务 DAC 权限配置。如无法立即打补丁，可临时停止错误报告服务并禁止目标主机访问互联网以缓解风险。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows 错误报告特权提升漏洞"
updated = "2026-06-17T02:09:03Z"

