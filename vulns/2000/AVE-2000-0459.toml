[basic]
description = "OpenBSD ftpd、NetBSD ftpd、ProFTPd 及 Opieftpd 等 FTP 服务器在调用 setproctitle（又称 set_proc_title）函数时，未能正确过滤不可信格式字符串，存在格式化字符串漏洞。远程攻击者可通过向目标 FTP 服务器发送特制的包含格式化字符串占位符（如 %n、%s）的请求，利用该漏洞触发内存越界读写，导致服务崩溃拒绝服务或在目标系统上执行任意命令。攻击无需身份认证，通过网络即可发起，影响范围广泛。"
published = "2000-07-07T04:00:00Z"
remediation = "升级 OpenBSD ftpd 至 2.7 及以上版本，NetBSD ftpd 应用 NetBSD-SA2000-009 安全公告中的补丁，ProFTPd 升级至 1.2.0rc2 及以上版本，Opieftpd 安装厂商提供的格式字符串修复补丁。如无法立即升级，可在 inetd 配置中禁用匿名 FTP 访问并限制可登录用户范围作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "OpenBSD ftpd 等 FTP 服务器 setproctitle 格式化字符串漏洞"
updated = "2026-06-16T21:52:01Z"

