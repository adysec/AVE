[basic]
description = "Linux 内核的 binfmt_flat（平坦二进制格式加载器）中存在整数溢出漏洞，影响 32 位系统。在计算 `full_data` 大小时，`data_len + relocs * sizeof(unsigned long)` 的运算中，`relocs` 重定位计数未经过充分校验，导致整数溢出，进而可能造成内存分配错误或越界访问。本地攻击者可通过加载特制的平坦格式二进制文件触发此漏洞，导致系统拒绝服务（内核崩溃）。虽然大多数大小和计数被限制在 256MB 以内，但 `relocs` 字段的校验缺失使得 32 位系统上的计算仍可能出错。该漏洞 CVSS 评分 5.5，危害等级中等，影响 Linux 内核多个版本。"
published = "2025-02-27T03:15:11Z"
remediation = "更新 Linux 内核至以下已修复版本：5.4.291、5.10.235、5.15.179、6.1.129、6.6.78、6.12.14 或 6.13.3 及以上。Ubuntu 用户安装 USN-7540-1/USN-7511-1/USN-7640-1/USN-7510-1/USN-7653-1 更新；Debian 用户安装 DLA-4178-1/DLA-4102-1 更新。无法立即更新时，可通过禁用 binfmt_flat 模块（`chmod -x /usr/bin/flat`）临时缓解。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Kernel binfmt_flat 整数溢出漏洞"
updated = "2026-06-17T08:14:26Z"

