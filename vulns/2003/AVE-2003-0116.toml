[basic]
description = "up2date 是 Red Hat Linux 用于从 Red Hat Network 下载并安装软件包的系统更新工具。该工具在 3.0.7 和 3.1.23 版本中存在缺陷：其未能正确验证所下载 RPM 包的 GPG 签名，导致未经认证的远程攻击者能够在 Red Hat Network 遭到入侵（如 DNS 劫持或中间人攻击）的情况下，诱使目标系统安装经过篡改的未签名软件包，进而可能在其中植入恶意代码，破坏系统完整性。该漏洞的攻击需要依赖对软件分发渠道的劫持作为前提条件，攻击复杂度较低，CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），可对机密性、完整性及可用性造成部分影响。"
published = "2003-08-27T04:00:00Z"
remediation = "建议立即将 up2date 升级至官方修复版本：Red Hat 已通过公告 RHSA-2003:244 发布更新包，其中 Red Hat Enterprise Linux 2.1 的修复版本为 up2date-3.1.23-2，Red Hat Linux 8.0/9 的修复版本为 up2date-3.0.7-3，升级后可正确验证 RPM 包的 GPG 签名。可通过 `up2date up2date` 命令或下载修复 RPM 手动安装完成升级。如暂时无法升级，应在网络层面限制客户端仅从可信的 Red Hat 官方服务器获取更新，并在安装 RPM 前手工执行 `rpm -K` 校验 GPG 签名，拒绝签名不符的包。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Red Hat up2date 软件包管理工具 RPM GPG 签名校验缺失漏洞"
updated = "2026-06-16T22:02:24Z"

