[basic]
description = "Google Chrome 的 V8 JavaScript 引擎存在类型混淆漏洞（CWE-843），攻击者可构造特制的 HTML 页面诱导用户访问，触发 V8 引擎在处理对象类型时发生混淆，导致堆内存损坏，进而实现远程代码执行。该漏洞影响 Chrome 134.0.6998.88 之前的所有版本，CVSS 评分 8.8，危害等级高。用户需升级至最新版本以修复此漏洞。"
published = "2025-03-10T21:15:40Z"
remediation = "立即将 Google Chrome 升级至 134.0.6998.88 或更高版本，可通过 Chrome 设置 > 关于 Chrome > 自动检查更新完成升级。Debian 12 用户请执行 `apt update && apt upgrade chromium` 安装 DSA-5877-1 安全更新。如无法立即打补丁，可在浏览器中启用严格站点隔离（chrome://flags/#enable-site-isolation）并禁用 V8 JIT 作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 类型混淆漏洞"
updated = "2026-06-17T08:40:20Z"

