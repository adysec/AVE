[basic]
description = "curl 在使用 libssh 进行基于 SSH 的 SCP 或 SFTP 传输时，当请求进行公钥认证时，会错误地仍然尝试使用本地运行的 SSH agent 进行询问和认证，即使未设置 agent 也会发生此行为。该漏洞属于不当认证（CWE-287），攻击者可利用此缺陷在特定条件下绕过认证机制。影响使用 libssh 作为 SSH 后端的 curl 版本，CVSS 3.1 评分 3.1（LOW），攻击向量为网络（AV:N），攻击复杂度高（AC:H），无需权限（PR:N），需要用户交互（UI:R），范围未改变（S:U），仅对完整性造成低影响（I:L），无机密性和可用性影响。攻击前提是目标系统正在使用 curl 进行基于 libssh 的 SSH 传输且启用了公钥认证，攻击者需诱导用户发起受影响的传输操作。"
published = "2026-01-08T10:15:47Z"
remediation = "建议立即升级curl到支持补丁的最新版本（curl 8.10.0或更高版本），或直接应用现有的dhi-cve-2025-15224-libssh-publickey-auth补丁至curl代码库，并在SSH客户端配置中禁用对SSH代理的自动信任，强制要求手动指定密钥文件路径和密码。"
score = 3.1
severity = "LOW"
sources = ["msrc"]
title = "curl libssh 密钥短语绕过漏洞"
updated = "2026-06-17T08:37:24Z"

