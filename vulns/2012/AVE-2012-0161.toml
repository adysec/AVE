[basic]
description = "RealNetworks RealPlayer 在处理 RealAudio 音频流时存在远程代码执行漏洞，具体源于对 coded_frame_size 值的验证不充分。远程攻击者可构造特制的 RealAudio 音频文件，诱导用户使用受影响版本的 RealPlayer 打开，触发内存破坏，最终导致任意代码执行。该漏洞影响 RealPlayer 11.x、14.x、15.x（低于 15.02.71）及 RealPlayer SP 1.0~1.1.5 版本，CVSS 评分 9.3，危害严重。"
published = "2012-02-08T15:55:00Z"
remediation = "升级 RealPlayer 至 15.0.2.72 或更高版本，该版本修复了 RealAudio 音频流中 coded_frame_size 解析导致的远程代码执行漏洞。如无法立即升级，建议在浏览器中禁用 RealPlayer 插件，并避免打开来源不明的 .rm/.ra 媒体文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer RealAudio coded_frame_size 远程代码执行漏洞"
updated = "2026-06-16T23:38:31Z"

