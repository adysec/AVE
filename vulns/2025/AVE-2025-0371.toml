[basic]
description = "QNAP QHora 路由器存在弱身份验证漏洞（CWE-1390），攻击者获得本地网络访问权限后，可利用该漏洞绕过身份验证机制，获取设备敏感信息。该漏洞影响 QHora 系列路由器，CVSS 评分 4.0，危害等级中危。厂商已在 QuRouter 2.6.2.007 及后续版本中修复此漏洞，建议用户及时升级固件。"
published = "2026-03-20T17:16:42Z"
remediation = "立即将 QNAP QHora 路由器固件升级至 QuRouter 2.6.2.007 或更高版本。如无法立即升级，可在路由器管理界面关闭不必要的本地管理服务，并在网络层面限制对路由器管理端口的访问（仅允许受信任的管理 IP），同时启用 MAC 地址过滤以降低本地网络攻击面。"
score = 4
severity = "MEDIUM"
sources = ["zdi"]
title = "QNAP QHora 弱身份验证漏洞"
updated = "2026-06-17T09:52:31Z"

