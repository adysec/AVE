[basic]
description = "Google Chrome Windows 版本 142.0.7444.137 之前版本的 Views 组件存在不当实现漏洞 (CWE-269)。攻击者在已攻破渲染进程的前提下，诱导用户访问精心构造的 HTML 页面，即可利用 Views 组件的权限管理缺陷实现权限提升，进而完全控制浏览器进程。该漏洞影响 Windows 平台 Chrome 142.0.7444.137 之前版本及 Fedora 42 等发行版对应版本，CVSS 3.1 评分 7.5 (HIGH)，攻击向量为网络 (AV:N)，需用户交互 (UI:R) 且攻击复杂度高 (AC:H)，但成功利用可导致高机密性/完整性/可用性影响 (C:H/I:H/A:H)。Google 已在 142.0.7444.137 版本修复，Fedora 等发行版已推送 142.0.7444.162 更新修复。"
published = "2025-11-10T20:15:39Z"
remediation = "建议立即升级 Google Chrome Windows 版本至 142.0.7444.137 或更高版本（Fedora 用户升级至 142.0.7444.162），通过 Chrome 菜单 → 帮助 → 关于 Google Chrome 自动更新。若无法立即更新，可临时禁用 JavaScript 或启用站点隔离作为缓解措施，并限制不可信网站访问。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "谷歌 Chrome Windows 版本基于 HTML 页面的特权升级漏洞"
updated = "2026-06-17T08:32:51Z"

