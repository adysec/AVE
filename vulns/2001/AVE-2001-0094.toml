[basic]
description = "标签之间。<value>mICQ 0.4.6 及更早版本存在缓冲区溢出漏洞，程序在处理远程发送的超长 Description 字段时未对输入长度进行充分边界检查，导致栈缓冲区溢出。未经身份认证的远程攻击者可通过向目标用户发送包含特制超长 Description 字段的 ICQ 消息触发此漏洞，从而造成拒绝服务，并可能进一步执行任意命令。该漏洞影响所有使用受影响版本 mICQ 客户端的用户，攻击复杂度低、无需认证即可利用，CVSS 评分满分，危害等级严重。"
published = "2001-03-26T05:00:00Z"
remediation = "建议立即升级 mICQ 至各发行版安全修复后的版本（Debian 参考 DSA-012、Red Hat 参考 RHSA-2001:005、FreeBSD 参考 SA-01:14.micq）。如当前使用的发行版仍携带此漏洞，请通过包管理器执行系统更新获取修复后的 mICQ 版本。如 mICQ 已无后续安全维护且发行版不再提供补丁，强烈建议彻底卸载 mICQ 并迁移至 Pidgin、Miranda NG 等仍在维护的替代 ICQ 客户端。如无法立即卸载或升级，可在防火墙层面阻断 ICQ 服务器端口 4000 的入站 UDP 连接，作为临时缓解措施，限制仅向可信 ICQ 服务器建立连接。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "mICQ 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:53:55Z"

