[info]
author = "AVE"
description = "通过 HTTP 请求检测目标系统是否为 Windows，辅助判断是否存在 Windows Kernel Streaming WOW Thunk 服务驱动程序信息泄露漏洞（CVE-2025-21375）"
id = "POC-AVE-2025-0838"
name = "CVE-2025-21375 Windows Kernel Info Disclosure PoC"
severity = "high"
tags = ["cve-2025-21375"]
vuln_id = [
    "CVE-2025-21375",
    "AVE-2025-0838",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["windows"]
