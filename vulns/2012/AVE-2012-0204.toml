[basic]
description = "Mozilla Firefox 12.0、Thunderbird 12.0 及 SeaMonkey 2.9 的 Windows 版更新服务程序 Updater.exe 存在不可信搜索路径漏洞。本地攻击者可将恶意构造的 wsock32.dll 文件放置于应用程序目录中，当 Updater.exe 加载该动态链接库时，恶意代码将以系统服务权限执行，导致本地权限提升。攻击者需具备本地访问权限，利用难度中等，但成功利用后可完全控制目标系统。"
published = "2012-06-05T23:55:01.733"
remediation = "升级 Firefox 至 14.0 及以上版本、Thunderbird 至 14.0 及以上版本、SeaMonkey 至 2.11 及以上版本，或升级至 Firefox ESR 10.0.6 / Thunderbird ESR 10.0.6。无法立即升级时，移除应用程序目录中非预期的 wsock32.dll 文件，并限制应用程序目录的写入权限为仅管理员可写。"
score = 6.9
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey Windows Updater服务DLL劫持本地特权提升漏洞"
updated = "2026-06-16T23:40:36.997"

