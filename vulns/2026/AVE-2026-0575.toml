[basic]
description = "mcp-memory-keeper 的 context_import 函数未对用户传入的 filePath 参数进行路径限制，直接将参数传递给 fs.readFileSync 读取文件。攻击者可通过 ../ 路径遍历或绝对路径方式读取服务器进程可访问的任意文件，包括其他用户的导出会话、JSON 凭据文件、.env 环境变量、SSH 密钥及 /etc/passwd 等敏感信息。JSON 文件会被完整解析并导入会话后通过 context_get 获取；非 JSON 文件则通过 JSON.parse 抛出的 SyntaxError 消息泄露文件前导字节。在典型 MCP 部署场景中，服务器运行在开发者机器上，攻击面包括提示注入的 LLM 代理或恶意 MCP 客户端。该漏洞已在 0.13.0 版本中修复。"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 mcp-memory-keeper 升级至 0.13.0 或以上版本（npm update mcp-memory-keeper）。该版本通过 realpathSync 将文件读取限制在服务端专属导出目录内，并阻止了 ../ 路径穿越、绝对路径及符号链接逃逸。此漏洞无纯配置缓解方案，必须升级版本。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "mcp-memory-keeper context_import 任意文件读取漏洞"
updated = "2026-01-01T00:00:00Z"

