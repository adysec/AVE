[basic]
description = '标签之间。<value>BEA Systems WebLogic Server 4.0.x、4.5.x 及 5.1.x 版本（5.1.0 之前）存在缓冲区溢出漏洞。远程攻击者无需身份认证，只需向服务器发送一个以 ".." 字符串开头的超长 URL，即可触发缓冲区溢出，进而执行任意系统命令，完全控制目标服务器。'
published = "2001-02-12T05:00:00.000"
remediation = '立即将 BEA WebLogic Server 升级至 5.1.0 或更高版本，该补丁已修复处理以 ".." 开头的 URL 请求时的缓冲区溢出漏洞。如暂时无法升级，应在防火墙或反向代理层拦截所有以 ".." 开头且长度异常的 URL 请求，作为临时缓解措施。'
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "BEA Systems WebLogic Server 双点缓冲区溢出漏洞"
updated = "2026-06-16T21:53:39.093"

