[basic]
description = "Safari 及 WebKit 浏览器引擎的即时编译（JIT）JavaScript 存根处理存在重入漏洞，远程攻击者可构造恶意 HTML 网页，在用户使用受影响的 Safari 版本（Mac OS X 10.4 至 10.6 及 Windows 平台早于 4.1.1/5.0.1 版本，以及 WebKitGTK 早于 1.2.6 版本）浏览该网页时触发此漏洞，导致应用程序崩溃或远程执行任意代码。该漏洞利用无需身份认证，攻击者通过诱骗用户访问特制网页即可实施攻击，CVSS 评分为 9.3，危害等级为严重。"
published = "2010-07-30T20:30:02Z"
remediation = '建议 Mac OS X 和 Windows 用户立即将 Safari 升级至 5.0.1 版本（Mac OS X 10.4 用户升级至 4.1.1），通过 Safari 的"软件更新"或 Apple 官网下载安装。Linux 发行版中使用的 WebKitGTK 应升级至 1.2.6 或更高版本。如短期内无法升级，可临时在 Safari 偏好设置中禁用 JavaScript 执行，并避免访问不可信网站，以降低被 crafted HTML 文档攻击的风险。'
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit JavaScript JIT 重新进入远程代码执行漏洞"
updated = "2026-06-16T23:19:20Z"

