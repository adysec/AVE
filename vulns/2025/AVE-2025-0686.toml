[basic]
description = "Windows 数字媒体组件存在越界读取漏洞，该漏洞源于 Windows Digital Media 在处理特定媒体文件时未正确验证内存边界，导致越界读取。具有低权限的本地攻击者可通过物理访问目标系统，利用特制的媒体文件触发该漏洞，成功利用后可提升至 SYSTEM 权限，实现机密性、完整性和可用性的完全破坏。该漏洞影响所有受支持的 Windows 10/11 及 Windows Server 版本，CVSS 评分 6.6，危害等级中危。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:34Z"
remediation = "安装 Microsoft 2025 年 1 月安全更新 (KB5050061)，该更新已修复 Windows Digital Media 的权限提升漏洞。可通过 Windows Update 自动获取更新，或从 Microsoft Update Catalog 手动下载安装。如无法立即打补丁，建议将受影响的 Windows Media 组件运行在最低权限用户账户下，并限制非管理员用户对数字媒体组件的访问。"
score = 6.6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 数字媒体特权提升漏洞"
updated = "2026-06-17T08:42:49Z"

