[basic]
description = "Splatt Forum 3.0 存在跨站脚本（XSS）漏洞，远程攻击者可在论坛帖子中构造特制的 [img] 图片标签，通过在标签属性中插入闭合引号及恶意脚本代码，当其他用户浏览该帖子时脚本自动执行，导致攻击者能够窃取用户会话 Cookie、伪造页面内容或执行其他恶意操作。该漏洞无需身份认证即可利用，攻击复杂度低，影响 Splatt Forum 3.0 所有版本。"
published = "2002-10-04T04:00:00.000"
remediation = "Splatt Forum 已停止维护，无官方补丁。建议立即升级到 Splatt Forum 3.0.1 或更高版本（如存在）；若无法升级，修改 forum 源码中处理 [img] 标签的代码，对 src 属性值进行 HTML 实体编码（htmlentities）并过滤双引号及 onerror/onload 等事件处理器。长期方案：迁移至仍受支持的论坛软件（如 phpBB、Simple Machines Forum）。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Splatt Forum 3.0 IMG标签HTML注入跨站脚本漏洞"
updated = "2026-06-16T21:58:27.773"

