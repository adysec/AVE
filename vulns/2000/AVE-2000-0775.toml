[basic]
description = 'iPlanet Certificate Management System 4.2 及 Directory Server 4.12 存在目录遍历漏洞。未经身份认证的远程攻击者可在 Agent、End Entity 或 Administrator 服务中通过注入 ".."（点号点号）路径遍历序列，绕过目录访问限制读取服务器上的任意敏感文件。该漏洞影响范围涵盖使用上述版本的组织机构目录服务，攻击者无需凭据即可在低复杂度条件下完成利用，可能导致内部配置文件、证书私钥等机密信息泄露。'
published = "2000-12-11T05:00:00.000"
remediation = "立即应用 iPlanet 官方补丁 0122（http://www.iplanet.com/downloads/patches/0122.html）修复目录遍历漏洞，或升级 iPlanet Directory Server 至 4.14 及以上版本。如暂时无法打补丁，可在防火墙层禁用 Agent 服务（8100/tcp）和 End Entity 服务（443/tcp）的对外访问，并限制 Administrator 服务端口仅允许内网管理地址访问。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "iPlanet Directory Server 4.12 目录遍历漏洞"
updated = "2026-06-16T21:53:05.947"

