[basic]
description = "MediaHouse Software Statistics Server LiveStats 5.2 版本存在远程缓冲区溢出漏洞（CVE-2000-0776）。该漏洞源于服务器在处理超长 HTTP GET 请求时未正确验证输入长度，导致栈缓冲区溢出。未经身份认证的远程攻击者可通过发送精心构造的超长 HTTP GET 请求触发漏洞，在目标系统上以服务器进程权限执行任意代码。受影响版本为 MediaHouse Statistics Server 5.02x（LiveStats 5.2），运行于 Windows 平台。攻击向量为网络远程攻击（CVSS AV:N），攻击复杂度低（AC:L），无需认证（Au:N），可导致机密性、完整性、可用性部分受损（C:P/I:P/A:P），CVSS v2 基础评分 7.5（HIGH）。攻击者可借此完全控制服务器、窃取敏感数据或进一步渗透内网。建议立即升级至厂商发布的修复版本，或在无法升级时通过 WAF 限制 HTTP 请求长度、限制服务端口访问来源等方式缓解风险。"
published = "2000-10-20T04:00:00Z"
remediation = "立即升级到 MediaHouse Statistics Server 的支持版本或应用最早 patches，避免使用 LiveStats 5.2 及其 5.02x 版本。在不可立即打补丁的情况下，应限制对 Statistics Server 端口的访问并部署 WAF 实现 HTTP 请求长度限制，避免攻击者利用缓冲区溢出漏洞执行任意命令。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "MediaHouse Software Statistics Server LiveStats 5.2 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:52:27Z"

