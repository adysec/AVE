[basic]
description = "WordPress 的 tidio-form 插件 1.0 版本中存在反射型跨站脚本（XSS）漏洞，该漏洞源于程序未对用户输入进行充分的过滤与转义处理。攻击者可通过向目标用户发送特制的恶意链接，诱使用户点击后，在浏览器中执行任意 JavaScript 代码，导致敏感信息泄露或会话劫持。攻击无需身份认证，但需要用户交互。该漏洞影响 tidio-form 1.0 版本，CVSS 评分 6.1，危害等级中危。"
published = "2016-10-10T20:59:30Z"
remediation = "立即在 WordPress 后台删除 tidio-form 插件（已关闭下架且不再维护），或手动删除 /wp-content/plugins/tidio-form/ 目录。如业务必须保留表单功能，可安装替代插件（如 Contact Form 7、WPForms），同时在 Web 应用防火墙（WAF）侧添加规则拦截对 tidio-form 相关路径的恶意查询参数，过滤 <script> 等 XSS 载荷。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress tidio-form 插件反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:46Z"

