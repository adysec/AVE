[info]
author = "AVE"
description = "检测目标 IIS 服务器是否存在 msadcs.dll（RDS DataStub 组件），该组件存在堆缓冲区溢出漏洞（CVE-2002-1142），远程攻击者可通过特制 HTTP 请求触发远程代码执行"
id = "POC-AVE-2002-0544"
name = "Microsoft MDAC RDS DataStub msadcs.dll 存在性检测 PoC"
severity = "high"
tags = [
    "cve-2002-1142",
    "ms02-065",
    "iis",
    "mdac",
    "rds",
]
vuln_id = [
    "CVE-2002-1142",
    "AVE-2002-0544",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/msadcs.dll"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "MSADC",
    "RDS",
    "DataFactory",
    "Handler",
]

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/msadcs.dll"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "MSADC",
    "RDS",
    "DataFactory",
    "Handler",
]
