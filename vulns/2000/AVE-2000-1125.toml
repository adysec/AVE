[basic]
description = "ghostscript 在 5.10-16 及之前版本中存在代码执行漏洞。由于程序在处理空的 LD_RUN_PATH 环境变量时，会到当前目录中搜索共享库文件，本地用户可在其他用户执行 ghostscript 的工作目录中放置特洛伊木马库文件。当其他用户从该目录运行 ghostscript 时，程序会加载恶意库，导致以该用户权限执行任意命令，造成权限提升和系统入侵。"
published = "2001-01-09T05:00:00Z"
remediation = "将 ghostscript 升级至 5.10-16 或更高版本，该版本已修复 LD_RUN_PATH 环境变量为空时在当前目录搜索共享库的缺陷。如无法立即升级，可设置 LD_RUN_PATH 环境变量为非空值（如 export LD_RUN_PATH=/usr/lib），或在启动 ghostscript 前使用 unset LD_RUN_PATH 命令清除该环境变量，防止从当前目录加载恶意共享库。建议同时检查系统中是否存在可疑的 .so 文件并清理，避免本地用户通过放置特洛伊木马库实现权限提升。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Artifex Ghostscript 本地代码执行漏洞"
updated = "2026-06-16T21:53:17Z"

