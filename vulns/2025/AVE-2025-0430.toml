[basic]
description = "Google Chrome 的 ANGLE 图形抽象层存在堆缓冲区溢出漏洞，远程攻击者可通过构造恶意的网络流量诱导用户访问，触发堆内存损坏，导致任意代码执行。该漏洞影响 Chrome 140.0.7339.185 之前版本，CVSS 评分 8.8，危害等级高。用户需交互（如访问恶意网页）方可利用，成功利用可完全控制受影响的浏览器进程。"
published = "2025-09-24T17:15:39Z"
remediation = "立即升级 Google Chrome 至 140.0.7339.185 及以上版本（Chrome 设置 > 关于 Chrome > 自动检查更新）。使用 Chromium 内核的浏览器（如 Edge、Brave）请同步更新至对应版本。Linux 发行版用户更新 chromium 包至 140.0.7339.207 或更高版本。无法立即升级时，可禁用 WebGL 作为临时缓解措施（chrome://flags/#disable-webgl）。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome ANGLE 堆缓冲区溢出漏洞"
updated = "2026-06-17T08:28:26Z"

