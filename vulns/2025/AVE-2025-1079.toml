[basic]
description = "Linux 内核 ice 网络驱动中 aRFS（accelerated Receive Flow Steering）功能存在内存泄漏漏洞。当系统执行 VSI（Virtual Station Interface）重置操作时，VSI 重新配置流程会重复分配 aRFS 对象内存，但未先释放此前已分配的资源，导致内核内存泄漏持续累积。该漏洞影响使用 Intel ice 系列网卡的 Linux 内核系统，攻击者需具备本地低权限才能触发重置操作。攻击者可通过反复触发网卡重置事件，使系统内存被持续占用而无法释放，在资源受限的环境中可能引发拒绝服务。CVSS 评分为 5.5，危害等级为中危。"
published = "2025-04-01T16:15:29Z"
remediation = "升级 Linux 内核至 5.10.236、5.15.180、6.1.132、6.6.84 或 6.12.20 及以后版本，修复 ice 驱动在 VSI 重置时 aRFS 结构体重复分配导致的内存泄漏。如无法立即升级，可通过 ethtool -K <网卡名> ntupri off 临时禁用加速接收流控，或避免频繁触发 ice 网卡链路重置，以缓解内存持续泄漏风险。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Intel Linux 内核 ice 驱动 aRFS 内存泄漏漏洞"
updated = "2026-06-17T08:44:45Z"

