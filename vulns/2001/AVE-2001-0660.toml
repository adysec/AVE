[basic]
description = "FreeBSD 3.x 和 4.x 版本中，inetd 内置的 ident 服务器（RFC1413 协议实现）在运行过程中错误地使用了 root 用户的组权限而非实际连接用户的组权限，导致未经身份认证的远程攻击者可以读取系统中 wheel 组可访问文件的前 16 字节内容。该漏洞影响所有未修复的 FreeBSD 3.x 和 4.x 版本，攻击者只需向目标主机 113 端口发送 ident 协议请求即可触发，无需任何身份验证。成功利用可能导致敏感配置文件或密钥材料的片段泄露，进而辅助后续攻击。FreeBSD 已在 2000 年 11 月和 2001 年 1 月分别发布针对 4.x 和 3.x 版本的补丁修复此问题。"
published = "2001-05-03T04:00:00.000"
remediation = '将受影响的 FreeBSD 系统升级至 4.2-STABLE 或更高版本（或 3.5-STABLE 及其后续版本），以获取修复后的 inetd 代码。若暂无法升级，可编辑 /etc/inetd.conf 注释掉所有以 "auth" 开头的 ident 服务行，然后执行 killall -HUP inetd 重启 inetd 以禁用 ident 服务器作为临时缓解。也可从 ftp://ftp.FreeBSD.org/pub/FreeBSD/CERT/patches/SA-01:11/ 下载对应版本的 inetd 补丁，在 /usr/src/usr.sbin/inetd 目录下执行 patch -p 后重新编译安装并重启 inetd。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "FreeBSD inetd ident server 信息泄露漏洞"
updated = "2026-06-16T21:53:51.610"

