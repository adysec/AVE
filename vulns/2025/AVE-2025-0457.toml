[basic]
description = "Google Chrome 的 V8 JavaScript 引擎中存在差一错误（Off-by-one）漏洞，CWE-193。远程攻击者可通过构造特制的 HTML 页面诱导用户访问，触发越界内存读取，导致敏感信息泄露。该漏洞影响 Chrome 141.0.7390.54 之前版本，攻击无需身份认证但需用户交互，CVSS 评分 4.3，危害等级中危。Google 已在 Chrome 141.0.7390.54 版本中修复此漏洞。"
published = "2025-11-06T22:15:39Z"
remediation = "立即将 Google Chrome 升级至 141.0.7390.54 或更高版本，可通过 Chrome 菜单 > 帮助 > 关于 Google Chrome 检查并自动更新。基于 Chromium 的浏览器（如 Microsoft Edge、Opera、Brave）需同步更新至对应版本。Fedora 43 用户应更新至 chromium 141.0.7390.122。如无法立即更新，可禁用 JavaScript 作为临时缓解措施（在 Chrome 设置 > 隐私和安全 > 网站设置 > JavaScript 中关闭），但会影响正常浏览功能。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome V8 越界内存读取漏洞"
updated = "2026-06-17T08:29:52Z"

