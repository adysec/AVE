[basic]
description = "HP-UX VVOS 10.24 及 11.04 版本中 TGA 和 Java Servlet 代理的 NSAPI 插件存在拒绝服务漏洞。远程攻击者无需身份认证即可通过发送特制请求触发该漏洞，导致目标系统 CPU 资源被大量消耗，造成服务不可用。该漏洞 CVSS 评分 5.0，攻击复杂度低，影响系统可用性，需及时安装厂商补丁修复。"
published = "2000-12-19T05:00:00.000"
remediation = "HP-UX VVOS 10.24 和 11.04 已停止技术支持，建议立即升级至受支持的 HP-UX 11i 版本（如 11.31）并安装最新补丁包。如无法升级，可在 Web 服务器配置中禁用 NSAPI TGA 和 Java Servlet proxy 插件，或在网络边界防火墙阻断对 NSAPI 端口（默认 80/443）的非信任来源访问，以降低 CPU 耗尽型拒绝服务攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "HP HP-UX VVOS NSAPI Plugin 拒绝服务漏洞"
updated = "2026-06-16T21:52:52.230"

