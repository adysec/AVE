[info]
author = "AVE"
description = "检测 Merit AAA RADIUS Server 上 rlmadmin 符号链接漏洞。通过检查 rlmadmin 可执行文件是否存在来判断目标是否安装了受影响版本。实际利用需本地执行符号链接攻击读取任意文件。"
id = "POC-AVE-2001-0436"
name = "CVE-2001-1000 PoC"
severity = "low"
tags = ["cve-2001-1000"]
vuln_id = [
    "CVE-2001-1000",
    "AVE-2001-0436",
]

[poc]
logic = "any"

[[poc.requests]]
path = "/usr/private/etc/rlmadmin"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = ".+"
type = "regex"
