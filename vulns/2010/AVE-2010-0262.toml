[basic]
description = "RealNetworks RealPlayer 的 drv2.dll（RV20 解压缩模块）中存在堆内存破坏漏洞。远程攻击者可通过向目标用户发送特制的 RV20 视频流，其中包含精心构造的未指定长度字段值，触发堆内存损坏，导致拒绝服务或远程代码执行。该漏洞影响 RealPlayer 11.0 至 11.1、RealPlayer SP 1.0 至 1.1.5、RealPlayer Enterprise 2.1.2 和 2.1.3、Linux RealPlayer 11.0.2.1744 以及 HelixPlayer 1.0.6 等版本，CVSS 评分 9.3，危害等级严重。用户需升级至 RealPlayer 12.0.1.609 或更高版本以修复此漏洞。"
published = "2010-12-14T16:00:04Z"
remediation = "立即升级 RealPlayer 至 12.0.1.609 或更高版本。RealNetworks 已于 2010 年 12 月发布安全更新修复此漏洞。由于 RealPlayer 已停止维护，建议彻底卸载 RealPlayer 并改用 VLC 等替代播放器，同时在浏览器中禁用 RealPlayer 相关 ActiveX 插件和 NPAPI 插件以防止远程利用。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer RV20 解析堆内存破坏代码执行与拒绝服务漏洞"
updated = "2026-06-16T23:24:40Z"

