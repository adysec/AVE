[basic]
description = "` tags as requested.<value>Solaris 操作系统的 snmpXdmid 守护进程负责将 SNMP 消息映射为 DMI（桌面管理接口）事件，该进程在处理 SNMP indication 事件时存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标系统发送包含超长 indication 字段的特制 SNMP 数据包触发此漏洞，从而在受影响系统上执行任意命令。该漏洞影响 Solaris 2.6、7.0 及 8.0 版本，CVSS 评分 10.0（严重等级），攻击复杂度低且无需任何认证凭据，可导致目标系统被完全接管。"
published = "2001-05-03T04:00:00.000"
remediation = "建议立即停止并禁用 Solaris 系统的 snmpXdmid 守护进程，或升级至受支持的更高版本操作系统。若必须保留该服务，请在网络防火墙上配置访问控制列表（ACL），封禁 UDP 161 端口，仅允许受信任的管理终端访问以缓解远程攻击风险。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Sun Solaris snmpXdmid 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:56.230"

