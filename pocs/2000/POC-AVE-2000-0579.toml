[info]
author = "ave"
description = '验证 Apache Tomcat 3.1 路径信息泄露漏洞。向服务器请求一个不存在的 JSP 文件，若响应中包含服务器物理路径信息（如 JSP file "/path/to/file.jsp" not found），则说明存在路径信息泄露漏洞。'
id = "POC-AVE-2000-0579"
name = "Apache Tomcat 3.1 Path Revealing PoC"
severity = "medium"
tags = ["ave-2000-0579"]
vuln_id = [
    "CVE-2000-0759",
    "AVE-2000-0579",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/nonexistent_ave_poc_579.jsp"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["JSP file"]

[[poc.requests.matchers]]
expect = true
status = [404]
type = "status"
