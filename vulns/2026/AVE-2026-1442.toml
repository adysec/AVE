[basic]
description = "guzzlehttp/guzzle 在 7.15.1 及更早版本中存在信息泄露漏洞，位于 RedirectMiddleware 组件。当启用可选的 allow_redirects.referer 设置时，中间件在进行同方案重定向（如 HTTPS 到 HTTPS）时，会将原始请求 URI 中 '#' 之后的片段（fragment）复制到生成的 Referer 请求头中。控制重定向目标的攻击者能够从传入的 Referer 头中读取该片段，从而可能将一次性登录凭据、访问令牌、状态值或其他敏感客户端数据泄露给原本不应接收这些信息的服务器。该 referer 设置默认处于禁用状态。此漏洞影响 Guzzle 7.x 系列早于 7.15.1 的版本，需要攻击者控制重定向目标且应用启用了 referer 选项才能被利用，CVSSv3.1 评分为 5.4，危害等级中等。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Guzzle HTTP 客户端重定向中间件信息泄露漏洞"
