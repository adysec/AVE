[basic]
description = "Apple Safari 6.0.1 之前版本存在一个逻辑缺陷，当用户将 HTTPS URL 粘贴到地址栏时，浏览器在某些情况下会错误地将该请求通过明文 HTTP 协议发送而非 HTTPS。这一安全绕过漏洞导致用户访问的敏感数据在传输过程中可被同一网络中的攻击者通过嗅探手段截获。该漏洞影响 Safari 浏览器早期版本，攻击条件要求用户手动操作（粘贴 URL），且攻击者需处于网络中间位置才能窃听通信内容。Apple 已在 Safari 6.0.1 中修复此问题。"
published = "2012-09-20T21:55:02Z"
remediation = "建议立即升级 Safari 浏览器至 6.0.1 或更高版本，Apple 已通过改进 URL 处理逻辑修复该问题。如暂无法升级，可避免直接在地址栏粘贴 URL，改用手动输入或书签方式访问，并仔细核对地址栏锁图标确保连接安全。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari URL处理安全绕过漏洞"
updated = "2026-06-16T23:43:47Z"

