[basic]
description = "Netscape Enterprise Server 的 Web Publishing 功能存在目录遍历与信息泄露漏洞。该漏洞允许未经身份认证的远程攻击者通过向目标服务器发送 INDEX 命令，列出 Web 服务器根目录下的任意目录及其文件列表，从而泄露敏感目录结构信息。此漏洞影响 Netscape Enterprise Server 3.0、4.0 及更早版本，攻击者无需任何凭证即可在网络上发起探测，获取网站目录架构、发现隐藏文件或敏感路径，为后续渗透攻击提供依据。CVSSv2 评分为 5.0，危害等级中等，攻击条件宽松，远程攻击者仅需通过网络访问服务器 Web 端口即可完成利用。"
published = "2001-06-02T04:00:00.000"
remediation = "Netscape Enterprise Server 已停止维护且无后续安全更新，建议立即迁移至当前受支持的 Web 服务器（如 Apache HTTP Server、Nginx 或 Microsoft IIS）。如短期内无法完成迁移，应在管理控制台（Admin Console）中禁用 Web Publishing 功能，并修改 obj.conf 配置文件移除 INDEX 方法映射，阻止未授权用户通过 INDEX 请求枚举目录结构。此外，应在防火墙或反向代理层限制对 Web Publishing 端口的访问，仅允许可信 IP 访问管理接口，以降低目录信息泄露风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Netscape Enterprise Server INDEX 命令目录信息泄露漏洞"
updated = "2026-06-16T21:53:57.843"

