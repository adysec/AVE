[basic]
description = "Cisco IOS 及 IOS XE 软件的 DHCP Option 82 封装功能存在输入验证不完善漏洞。该漏洞源于受影响软件在处理 DHCP 中继代理发送的 DHCPv4 报文中的 Option 82 信息时，未能进行充分的输入验证。未经身份认证的远程攻击者可通过向目标设备发送特制的 DHCPv4 数据包触发此漏洞，导致设备重载，造成拒绝服务（DoS）。该漏洞影响大量 Cisco 交换机及路由器产品，CVSS 评分 8.6，危害等级高。Cisco 已发布安全公告修复此漏洞。"
published = "2018-03-28T22:29:01Z"
remediation = "立即升级到 Cisco IOS/IOS XE 的修复版本。使用 Cisco IOS Software Checker（https://tools.cisco.com/security/center/selectIOSVersion.x）查询当前版本对应的修复版本号。对于 Cisco IOS 15.x 系列，升级至 15.2(4a)EA5 或 15.2(6)E0a 及更高版本；对于 Cisco IOS XE 系列，升级至对应修复版本。如无法立即升级，建议在受影响的 DHCP relay 接口上禁用 option 82 封装功能（no ip dhcp relay information policy encapsulate）作为临时缓解措施，但思科官方声明无有效变通方案，最终仍需升级。"
score = 8.6
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS/IOS XE DHCP Option 82 拒绝服务漏洞"
updated = "2026-06-17T01:30:00Z"

