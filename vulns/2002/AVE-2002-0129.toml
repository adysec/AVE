[basic]
description = "CIPE VPN 软件包 1.3.0-3 之前版本存在拒绝服务漏洞，远程攻击者可通过向目标系统发送特制的畸形短数据包触发该漏洞，导致 CIPE VPN 服务崩溃。该漏洞影响 CIPE VPN 1.3.0-3 之前所有版本，CVSS 评分 5.0，危害等级中等。攻击者无需认证即可远程利用，攻击复杂度低，但仅影响系统可用性。Debian 已在安全公告 DSA-104 中发布修复补丁，建议用户升级至 1.3.0-3 及以上版本。"
published = "2002-01-31T05:00:00Z"
remediation = "立即升级 CIPE VPN 至 1.3.0-3 或更高版本。Debian 用户可通过 `apt-get update && apt-get upgrade cipe` 命令更新。如无法升级，可在防火墙上配置规则过滤发往 CIPE 端口的畸形 UDP 短包，或限制可访问 CIPE 服务的源 IP 范围作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Olaf Titz CIPE 畸形数据包拒绝服务漏洞"
updated = "2026-06-16T21:56:39Z"

