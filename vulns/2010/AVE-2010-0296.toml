[basic]
description = "tags.<value>WebKit 引擎在处理 JavaScript 字符串对象时存在基于堆的缓冲区溢出漏洞，远程攻击者可通过构造包含恶意 JavaScript 代码的网页，诱导用户使用受影响版本的 Safari 浏览器访问该页面，触发堆内存越界写操作，从而在浏览器进程上下文中执行任意代码或导致应用程序崩溃拒绝服务。该漏洞影响 Mac OS X 10.4 至 10.6 平台上的 Safari 4.1.1 及更早版本，以及 Windows 平台上的 Safari 5.0.1 及更早版本，攻击者无需身份认证，仅需诱使用户浏览恶意网页即可完成利用。"
published = "2010-07-30T20:30:02Z"
remediation = "升级 Safari 至 5.0.1 或更高版本（Mac OS X 10.5/10.6 及 Windows 用户），或升级至 4.1.1（Mac OS X 10.4 用户）。如无法立即升级，可临时禁用 Safari 的 JavaScript 功能，并避免访问不受信任的网站，以降低远程攻击者通过恶意网页触发 WebKit 堆缓冲区溢出并执行任意代码的风险。Mac 用户可通过 Apple 菜单中的软件更新自动获取补丁，Windows 用户可通过 Safari 内置更新功能或 Apple 支持网站下载安全版本。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit JavaScript 堆缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T23:19:20Z"

