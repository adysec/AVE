[basic]
description = "Windows 2000 域控制器存在拒绝服务漏洞，远程攻击者无需身份认证即可通过向目标系统发送大量畸形服务请求触发该漏洞。该漏洞影响 Windows 2000 Server、Advanced Server 及 Datacenter Server 的域控制器角色，攻击者通过构造并持续发送畸形服务请求包发起洪水攻击，可导致目标系统资源耗尽或服务中断，造成拒绝服务。Microsoft 已针对该漏洞发布安全补丁，受影响用户建议升级至 Windows 2000 Service Pack 3 或更高版本。"
published = "2001-07-21T04:00:00Z"
remediation = "立即为受影响的 Windows 2000 Server、Advanced Server 或 Datacenter Server 域控制器安装 Microsoft 安全补丁 Q287397（MS01-011），或升级至 Windows 2000 Service Pack 3（内置该修复）；同时确保域控制器已在防火墙层面限制外部直接访问，仅允许内部网络发起请求，以临时缓解攻击面。若无法立即打补丁，建议在防火墙规则中阻断对应端口的公网访问作为过渡缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows 2000 消息请求泛洪拒绝服务漏洞"
updated = "2026-06-16T21:53:29Z"

