[basic]
description = "织梦内容管理系统（DedeCMS）5.7 SP2 版本中 `include/datalistcp.class.php` 文件的 `GetPageList` 函数存在反射型跨站脚本（XSS）漏洞。该函数在生成模板底部分页导航列表时未对 `PATH_INFO` 参数进行充分的过滤与转义处理，导致攻击者可通过向 `/member/index.php`、`/member/pm.php`、`/member/content_list.php` 或 `/plus/feedback.php` 等页面构造特制的恶意 URL 注入任意 JavaScript 代码。当管理员或普通用户点击该恶意链接后，浏览器会执行攻击者构造的恶意脚本，可能导致会话令牌窃取、后台操作劫持或敏感信息泄露。攻击无需身份认证，但需诱使用户点击链接，CVSS 评分 6.1，危害等级中危。"
published = "2018-10-23T18:29:00Z"
remediation = "立即升级 DedeCMS 至最新版 V5.7.88（2022-01-28 发布），从 GitHub 官方仓库下载覆盖更新。如无法升级，手动编辑 include/datalistcp.class.php 中 GetPageList 函数，对 PATH_INFO 参数使用 htmlspecialchars() 进行 HTML 实体编码转义，防止恶意脚本注入。同时建议在 Web 服务器（Nginx/Apache）层面添加 WAF 规则，拦截包含 <script> 等敏感关键词的 URL 请求。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "织梦 DedeCMS 5.7 SP2 跨站脚本攻击漏洞"
updated = "2026-06-17T01:47:35Z"

