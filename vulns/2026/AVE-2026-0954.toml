[basic]
description = "Flyto2 Core 是一款用于自动化和 AI 代理工作流的执行内核。该产品的多个 HTTP 输出模块（包括 core.api.http_get、core.api.http_post、graphql.query、graphql.mutation、monitor.http_check、notification.discord.send_message、notification.slack.send_message、notification.teams.send_message、ai.vision_analyze、verify.visual_diff、browser.proxy_rotate 及 agent/llm 内联 base_url 分支）在向外部发送请求时，未调用项目自带的 SSRF 防护函数 validate_url_with_env_config，导致经过身份认证的工作流作者可构造包含云实例元数据地址（169.254.169.254）、回环地址或 RFC1918 内网地址的请求，从而对内网服务或云元数据端点发起服务端请求伪造攻击。攻击者可利用此漏洞窃取云实例的 IAM 凭据或读取/写入内部网络中的敏感资源，影响版本为 2.26.7 之前的所有版本，CVSSv3.1 评分为 8.5。"
published = "2026-07-29T19:16:52Z"
remediation = "立即升级 Flyto2 Core 至 2.26.7 或更高版本，补丁已对受影响模块统一加入 validate_url_with_env_config 校验。若无法立即升级，可在反向代理或防火墙层出站规则中拦截对 169.254.169.254、127.0.0.1/8 及 RFC1918 内网地址的请求，并关闭不需要的外联模块权限作为临时缓解。"
score = 8.5
severity = "HIGH"
sources = ["ghsa"]
title = "Flytohub Flyto2 Core 服务端请求伪造漏洞"
updated = "2026-07-30T16:41:25Z"

