[basic]
description = "Apple Safari 浏览器所采用的 WebKit 渲染引擎存在内存破坏漏洞，远程攻击者可构造恶意网页，在用户使用 Safari 浏览器访问时触发内存损坏，导致应用程序崩溃或远程执行任意代码。该漏洞影响 Safari 6.0 之前的所有版本，攻击者无需身份认证即可通过网络向目标系统发送特制内容发起利用。Apple 已在 Safari 6.0 版本中修复此漏洞，用户应升级至最新版本以确保安全。"
published = "2012-07-25T20:55:03.867"
remediation = "升级 Apple Safari 到 6.0 或更高版本。对于 OS X Lion 用户，请安装 Safari 6 更新（需 OS X Lion v10.7.4），可通过 Mac App Store 或系统偏好设置中的软件更新功能获取。如暂时无法升级，建议避免访问不可信网站，并考虑暂时改用其他浏览器作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:38.960"

