[basic]
description = "CVE-2003-0594是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2004-04-15T04:00:00Z"
remediation = "升级至 Mozilla 1.4.2 或更高版本（Firefox 0.9.2/0.9.3、Thunderbird 0.7.2/0.7.3 及后续版本），或通过系统包管理器安装各 Linux 发行版安全更新（Red Hat RHSA-2004:112、Mandrake MDKSA-2004:021）。如无法立即升级，可在浏览器隐私设置中临时禁用 Cookies 以阻止攻击者利用 Cookie 路径遍历窃取会话信息，但会影响正常网站登录功能。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Mozilla 浏览器 Cookie 访问限制绕过漏洞"
updated = "2026-06-16T22:02:29Z"

