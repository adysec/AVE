[basic]
description = "Xpdf 2.01 及更早版本、xpdf-i 以及 CUPS 1.1.18 之前版本中的 pdftops 组件存在整数溢出漏洞。本地攻击者可通过构造包含大量元素的 ColorSpace 条目的特制 PDF 文件触发该溢出，导致任意代码执行。该漏洞影响范围包括 Xpdf 和 CUPS 打印系统，攻击者需具备本地访问权限，利用难度较低，成功利用后可完全控制目标系统。"
published = "2003-01-02T05:00:00Z"
remediation = "升级 CUPS 至 1.1.18 及以上版本，升级 Xpdf 至 2.02 及以上版本。如无法立即升级，可限制本地用户对 pdftops 工具的访问权限，或移除 cups-pdf 组件以降低攻击面。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "Xpdf pdftops 整数溢出本地代码执行漏洞"
updated = "2026-06-16T21:59:13Z"

