[basic]
description = "Sambar Server 4.4 及 5.0 版本中存在文件覆盖漏洞，远程攻击者可通过向服务器发送特制的 pagecount 请求，利用该功能对服务器上的任意文件进行覆盖写入。攻击者无需身份认证即可触发此漏洞，成功利用后可导致网站页面被篡改、敏感文件被覆盖或进一步执行任意代码。该漏洞影响 Sambar Server 4.4 和 5.0 版本，攻击条件简单，危害较大。"
published = "2001-07-22T00:00:00Z"
remediation = "升级 Sambar Server 至 5.0 beta 5 或更高版本，该版本已修复 pagecount CGI 的路径遍历问题。如无法升级，删除或禁用 /session/pagecount 脚本，或在 Web 服务器层面配置 URL 重写规则过滤 page 参数中的 `../` 序列作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Sambar Server 4.4/5.0 pagecount 文件覆盖漏洞"
updated = "2001-07-22T00:00:00Z"

