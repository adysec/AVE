[basic]
description = "Linux 内核 RISC-V 架构的稀疏 vmemmap 模型中存在越界读取漏洞。当 phys_ram_base 未按内存 section 大小对齐时，vmemmap 虚拟地址计算会产生低于 VMEMMAP_START 的错误地址，导致内核在初始化 struct page 时访问非法内存区域。本地低权限攻击者可利用此漏洞读取敏感内核内存信息或触发系统崩溃，造成机密性泄露和拒绝服务。该漏洞影响所有使用稀疏 vmemmap 模型的 RISC-V Linux 内核版本，CVSS 评分 7.1，危害等级高。"
published = "2025-01-21T13:15:09Z"
remediation = "立即升级 Linux 内核至以下修复版本：5.10.258、6.1.140、6.6.72、6.12.10 及以上版本，或合入对应稳定分支补丁（commit 043503044280、92f08673d3f1、a4a7ac3d2660、d2bd51954ac8、f754f27e98f8）。对于 Debian/Ubuntu 系统，安装对应安全更新（DSA-5925、USN-7381-1、USN-7514-1）。该漏洞为本地利用，无法立即打补丁时可通过限制本地用户登录作为临时缓解措施。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux Linux 内核 RISC-V 架构 vmemmap 地址越界读取漏洞"
updated = "2026-06-17T08:14:17Z"

