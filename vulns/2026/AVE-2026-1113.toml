[basic]
description = "Adobe Acrobat Reader 存在释放后使用（Use After Free）漏洞（CWE-416），受影响版本包括 24.001.30365、26.001.21651 及更早版本。当用户在 Windows 或 macOS 系统上打开攻击者精心构造的恶意 PDF 文件时，程序在释放内存后仍继续访问已释放的内存区域，可导致在当前用户上下文中执行任意代码。该漏洞利用需要用户手动打开恶意文件，攻击者通常通过钓鱼邮件或社会工程手段诱导受害者打开文件。成功利用后，攻击者可在当前用户权限下执行任意代码，进而窃取敏感数据、安装恶意软件或完全控制受影响系统。Adobe 已在 24.001.30383 和 26.001.21662 版本中修复此漏洞。"
published = "2026-06-09T21:17:21Z"
remediation = "请立即将 Adobe Acrobat Reader 更新至以下安全版本：连续发行版（Continuous Track）升级至 26.001.21662 或更高版本，经典发行版（Classic Track）升级至 24.001.30383 或更高版本。可通过 Acrobat Reader 菜单中的「帮助」→「检查更新」自动获取补丁，或前往 Adobe 官网手动下载安装。如因业务连续性原因无法立即更新，可临时在系统防火墙或邮件网关处拦截 .pdf 附件下载与打开，并启用 Acrobat Reader 的「受保护模式」以及「增强安全」功能，限制 JavaScript 执行与外部内容访问，以降低任意代码执行风险。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Adobe Acrobat Reader 释放后使用代码执行漏洞"
updated = "2026-07-23T09:10:00Z"

