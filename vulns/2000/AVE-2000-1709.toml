[basic]
description = "Evolvable Shambala Server 4.5 存在明文密码存储漏洞，服务器将用户密码以明文形式存储在本地文件系统中，未采用任何加密或哈希处理。本地攻击者可通过读取服务器配置文件或数据库文件直接获取明文密码，进而利用获取的凭证登录服务器管理后台，完全控制服务器。该漏洞影响 Shambala Server 4.5 版本，攻击条件低，危害严重。"
published = "2000-12-19T05:00:00.000"
remediation = "立即升级 Shambala Server 至支持密码加密存储的最新版本；如厂商已停止维护，应迁移至其他受支持的服务器软件。临时缓解措施：严格限制服务器配置文件访问权限（仅管理员可读），启用操作系统级磁盘加密保护静态数据，并定期审计密码文件访问日志。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Evolvable Shambala Server 4.5 明文密码漏洞"
updated = "2026-06-16T21:52:50.810"

