[basic]
description = "Linux kernel cgroup/cpuset 子系统中，cpuset_write_resmask() 函数调用 kernfs_break_active_protection 解除 kernfs 活跃保护机制，当进程向 cpuset.cpus 写入的同时，另一个进程执行 cgroup rmdir 删除操作，两者并发触发 kernfs 引用计数不一致，导致内核产生警告并可能引发死锁。该漏洞影响使用 cgroup cpuset 控制器的 Linux 系统，攻击者需具备本地低权限用户身份，通过在写入 cpuset 配置与删除 cgroup 之间制造竞态窗口来触发。该问题可导致系统稳定性下降或拒绝服务，Linux 内核已通过移除 kernfs_break_active_protection 调用修复此问题。"
published = "2025-01-19T11:15:08.890"
remediation = "建议立即升级到 Linux 内核 6.13 或更高版本，该版本修复了 cgroup/cpuset 中的 kernfs 活动中断警告。升级时请检查内核版本，确保版本号 ≥6.13。如无法立即升级，可临时修改 /etc/modules 配置以禁用 cpuset 内核模块以缓解风险。升级后需重启系统以使修复生效，具体补丁请参考 kernel.org 提供的修复提交。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel cgroup cpuset 不当锁定拒绝服务漏洞"
updated = "2026-06-17T08:43:53.667"

