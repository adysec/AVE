[basic]
description = '标签中。<value>Lotus Domino 5.0.4 及更早版本的 SMTP 邮件服务存在缓冲区溢出漏洞，远程攻击者无需身份认证即可利用。攻击者通过向目标服务器发送包含超长 ENVID 关键字的"MAIL FROM"命令即可触发溢出，导致服务拒绝服务并可能执行任意系统命令。该漏洞影响广泛部署的 Domino 邮件服务器系统，CVSS 评分高达 10.0，危害等级为严重。'
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 Lotus Domino 至 5.0.5 或更高版本（如 5.0.12、6.0.1 等），修复 SMTP 服务缓冲区溢出。若无法立即升级，可在防火墙层面限制仅受信 IP 访问 25 端口，或在 Domino 配置中禁用 SMTP 服务的 ENVID 关键字支持（在 notes.ini 中设置 SMTPDisableEnvid=1），并启用入侵检测系统监控异常 MAIL FROM 命令长度。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "IBM Lotus Domino SMTP 服务缓冲区溢出漏洞"
updated = "2026-06-16T21:53:02.750"

