[basic]
description = "MySQL数据库在3.23.31及更早版本中存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过向目标MySQL服务发送特制的网络请求触发该溢出，导致数据库服务崩溃拒绝服务，并在特定攻击条件下可能获取系统权限执行任意代码。该漏洞影响MySQL 3.22.x和3.23.x等多个早期版本，CVSS评分7.5。"
published = "2001-01-23T05:00:00.000"
remediation = "立即升级 MySQL 至 3.23.31 或更高版本以修复该缓冲区溢出漏洞。Debian 用户安装 DSA-013 补丁包，Red Hat 用户安装 RHSA-2001:003 补丁包，Mandrake 用户安装 MDKSA-2001-014 补丁包。如无法立即升级，可在防火墙中限制 3306 端口仅对可信网络开放，并在 MySQL 配置文件中设置 skip-networking 或 bind-address = 127.0.0.1 禁止外部连接，同时使用带权限的用户账号连接数据库。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "MySQL 缓冲区溢出漏洞"
updated = "2026-06-16T21:55:56.693"

