[basic]
description = "PHP 4.x 的 SafeMode（安全模式）存在任意文件执行漏洞。由于 safe_mode 对文件操作函数的权限检查不完善，攻击者可通过构造特制的 PHP 脚本绕过安全模式限制，在目标服务器上执行任意系统命令或读取敏感文件。该漏洞影响 PHP 4.x 全系列版本，攻击者只需能够上传 PHP 文件或控制部分文件内容即可触发利用，危害较大。官方已在后续版本中修复此问题。"
published = "2001-06-30T00:00:00Z"
remediation = "升级 PHP 至 4.1.2 或更高版本（官方下载 php-4.1.2.tar.gz），该版本修复了 mail() 函数第 5 个参数未正确过滤 shell 元字符的问题。Red Hat 用户可安装 RHSA-2002-102/RHSA-2002-129/RHSA-2003-159 安全更新。临时缓解措施：在 php.ini 中设置 safe_mode=Off 或通过 disable_functions 禁用 mail() 函数。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "PHP PHP 4.x SafeMode 任意文件执行漏洞"
updated = "2001-06-30T00:00:00Z"

