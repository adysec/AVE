[basic]
description = 'GNU tar 1.13.19 及更早版本存在目录遍历漏洞，攻击者可构造包含 ".." 路径遍历序列的恶意 tar 归档文件，诱导本地用户解压时触发路径遍历，导致任意文件被覆盖写入。该漏洞影响所有使用受影响 tar 版本的 Linux/Unix 系统，攻击条件为本地用户拥有解压 tar 文件权限且被诱导解压恶意构造的归档文件。攻击者通过在 tar 文件中嵌入包含目录遍历序列（如 "../../etc/passwd"）的文件名，在受害者解压时突破目录限制，覆盖系统关键文件导致权限提升或系统破坏。CVSS 2.1 分值（本地访问/低复杂度/无需认证/部分完整性影响），建议升级至 GNU tar 1.13.20 或更高版本修复。'
published = "2001-07-12T04:00:00Z"
remediation = "立即升级 GNU tar 到 1.13.20 或更高版本（如 1.14+），该版本已修复目录遍历漏洞。临时缓解：使用 --no-same-owner --no-same-permissions 选项解压，避免以 root 身份解压不可信 tar 包，或使用 --strip-components=1 剥离路径前缀防止目录遍历写入任意文件。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "GNU tar 目录遍历任意文件写入漏洞"
updated = "2026-06-16T21:55:55Z"

