[basic]
description = "Microsoft 消息队列（MSMQ）服务存在空指针解引用漏洞，由于对特制网络数据包的处理不当，未经身份认证的远程攻击者可通过向目标系统的 MSMQ 服务发送精心构造的恶意数据包，触发空指针解引用导致服务崩溃，造成拒绝服务。该漏洞影响多个 Windows 版本，CVSS 评分 7.5，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:49Z"
remediation = "安装 Microsoft 2025 年 1 月安全更新（KB5050061）。Windows Server 2008 SP2 用户需先安装服务堆栈更新 KB5050682，再安装安全更新 KB5050061。其他 Windows 版本通过 Windows Update 自动获取更新。如无法立即打补丁，可在防火墙中阻止 MSMQ 服务端口（TCP 1801）的入站流量作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft 消息队列 (MSMQ) 拒绝服务漏洞"
updated = "2026-06-17T08:42:59Z"

