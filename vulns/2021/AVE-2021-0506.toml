[basic]
description = "VMware vRealize Operations Manager 是一款用于数据中心和混合云运维管理的平台。该产品 API 接口在 8.4 版本之前存在服务端请求伪造（SSRF）漏洞。具有目标系统网络访问权限的恶意攻击者可通过构造特制的 API 请求，利用该漏洞诱使服务器向内部资源发起未授权请求，从而窃取管理员凭据。该漏洞无需身份认证即可触发，影响部署了受影响版本 VMware vRealize Operations Manager 的企业环境。成功利用后可获取高权限凭据，进而横向移动并控制整个运维管理平台。VMware 已发布安全更新修复此漏洞，建议用户升级至 8.4 或更高版本。"
published = "2021-03-31T18:15:14Z"
remediation = "立即将 VMware vRealize Operations Manager 升级到 8.5.0 版本以彻底修复 CVE-2021-21975 SSRF 漏洞。若无法立即升级，8.4.0 版本应安装 VMware KB85383 补丁获取完整修复，8.3.0 及更早版本可参考 VMSA-2021-0004 中对应的 workaround KB 文章（如 KB83210、KB83095 等）进行临时缓解。7.0.0 及 6.7.0 版本无计划补丁，建议尽快迁移至受支持版本。同时应在网络边界限制对 vRealize Operations Manager API 的访问，仅允许受信任的管理网段访问，以降低被远程利用的风险。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "VMware vRealize Operations Manager 服务端请求伪造漏洞"
updated = "2026-06-17T03:36:29Z"

