[basic]
description = "Apache Solr 5.0.0 至 8.3.1 版本中的 VelocityResponseWriter 组件存在模板注入远程命令执行漏洞。攻击者可通过两种方式利用：一是通过配置集 API 上传包含恶意 Velocity 模板的可信配置集（需认证权限）；二是在 Solr 配置中启用 `params.resource.loader.enabled` 参数后，通过 HTTP 请求参数直接传入恶意 Velocity 模板。成功利用后可在目标服务器上以 Solr 进程权限执行任意命令，获取服务器控制权。该漏洞影响范围广泛，CVSS 评分 7.5，危害等级高。Apache 官方在 Solr 8.4 版本中移除了参数资源加载器，并限制仅可信配置集可渲染模板，建议用户升级至 8.4 或更高版本。"
published = "2019-12-30T17:15:19Z"
remediation = "立即升级 Apache Solr 至 8.4.0 或更高版本，该版本已彻底移除 params.resource.loader 功能。如无法升级，在 solrconfig.xml 中禁用 VelocityResponseWriter 的 params.resource.loader.enabled 参数，并确保仅允许受信用户上传 configset。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Apache Solr Velocity 模版注入远程代码执行漏洞"
updated = "2026-06-17T02:24:09Z"

