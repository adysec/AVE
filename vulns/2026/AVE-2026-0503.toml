[basic]
description = "GIMP 在处理 LBM 格式文件时存在堆缓冲区溢出漏洞，由于程序未对文件中的特定字段进行充分的大小校验，攻击者可构造特制的 LBM 文件诱导用户打开，触发堆缓冲区溢出，进而实现远程代码执行。该漏洞影响 GIMP 多个版本，CVSS 评分 7.8，危害等级高。用户交互是触发该漏洞的必要条件，攻击者需通过社会工程学手段诱骗目标打开恶意文件。"
published = "2026-07-01T00:00:00Z"
remediation = "升级 GIMP 至 3.2.0 及以上版本（推荐最新 3.2.4），该漏洞已在提交 b4d41182 中修复。Debian 用户升级至 3.2.4-3，Ubuntu 用户等待官方更新。临时缓解措施：不要打开来源不明的 .lbm/.ilbm 文件，在文件关联中取消 GIMP 默认打开此类格式。"
score = 3.5
severity = "LOW"
sources = ["zdi"]
title = "GIMP LBM文件解析堆缓冲区溢出远程代码执行漏洞"
updated = "2026-07-01T00:00:00Z"

