[basic]
description = "Munica Corporation 的 NetSQL 1.0 存在远程缓冲区溢出漏洞，攻击者可通过向 6500 端口发送特制的超长 CONNECT 参数触发缓冲区溢出，导致远程代码执行。该漏洞无需身份认证即可远程利用，CVSS 评分为 10.0，危害等级严重，可完全控制目标系统。Exploit-DB 上已有公开的利用代码。"
published = "2001-06-16T04:00:00Z"
remediation = "Munica Corporation NetSQL 1.0 已停止维护，官方不再提供安全补丁。建议立即卸载 NetSQL 并迁移至其他受支持的数据库软件；如无法立即卸载，在防火墙/网络边界处将 TCP 端口 6500 加入黑名单，仅允许可信 IP 访问，并监控该端口的异常流量。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Munica Corporation NetSQL 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:55:42Z"

