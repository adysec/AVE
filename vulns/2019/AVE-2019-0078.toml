[basic]
description = "cosenary 开发的 Instagram-PHP-API（又称 Instagram PHP API V2）存在跨站脚本（XSS）漏洞，该库被 WordPress 的 UserPro 插件所集成，影响 UserPro 4.9.32 及以下版本。漏洞位于 example/success.php 页面的 error_description 参数处，未经身份认证的远程攻击者可通过构造包含恶意 JavaScript 代码的 payload，诱使管理员或用户访问包含该参数的 URL，在受害者浏览器中执行任意脚本，进而实现会话劫持、敏感信息窃取或网站内容篡改。该漏洞利用无需身份认证且攻击复杂度低，CVSS 评分 6.1。"
published = "2019-09-04T20:15:10Z"
remediation = "升级 WordPress 站点上的 UserPro 插件到最新版本（当前 4.9.33 或更高版本），这修复了 example/success.php 中的 XSS 漏洞。通过 WordPress 控制面板 → 更新 → 可用更新中自动应用所有插件更新。如果无法立即更新，可临时通过编辑 wp-config.php 文件添加 `define('WP_LOSTPASS_HANDLER', 'disable');` 以禁用易受攻击的 API 功能作为缓解措施。同时，确保所有 WordPress 核心文件和主题都保持在最新版本，并禁用不需要的插件以减少攻击面。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress UserPro 插件 跨站脚本漏洞"
updated = "2026-06-17T02:18:29Z"

