[basic]
description = "MySQL 数据库 COM_CHANGE_USER 命令存在密码验证绕过漏洞。由于服务器仅将攻击者提供的密码与实际密码的首字符进行比对，而非完整比较整个密码字符串，远程攻击者无需身份认证即可通过暴力破解手段快速猜中密码首字符，进而逐步获得数据库访问权限并提升权限。该漏洞影响 MySQL 3.x 3.23.54 之前版本及 4.x 4.0.6 之前版本，攻击者向目标发送特制的 COM_CHANGE_USER 命令即可发起利用。"
published = "2002-12-23T05:00:00Z"
remediation = "立即将 MySQL 服务器升级至 3.23.54 或更高版本（3.x 系列）以及 4.0.6 或更高版本（4.x 系列），以修复 COM_CHANGE_USER 命令仅比较密码第一个字符的漏洞。在无法立即升级时，应在 MySQL 配置中启用 `validate_password_policy=MEDIUM` 强制所有用户使用至少 8 字符的复杂密码，并在防火墙或访问控制列表中限制对 3306 端口的远程访问，仅允许可信 IP 连接。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "MySQL COM_CHANGE_USER 密码长度认证绕过漏洞"
updated = "2026-06-16T21:59:12Z"

