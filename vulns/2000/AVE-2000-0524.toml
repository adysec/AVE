[basic]
description = "CVSWeb 1.80 存在不安全的 Perl `open()` 函数调用漏洞。该函数在处理用户输入时未对管道符 `|` 进行过滤，远程攻击者可通过向 `open()` 传入特制参数执行任意系统命令。攻击者无需身份认证即可利用此漏洞，成功利用可完全控制目标服务器。该漏洞影响 CVSWeb 1.80 及可能更早版本，已有公开的 Exploit-DB 利用代码。"
published = "2000-07-12T00:00:00Z"
remediation = "升级 CVSWeb 到 1.86 或更高版本以修复不安全的 perl open 函数调用。如无法立即升级，可临时卸载 cvsweb 或在 Web 服务器配置中限制 cvsweb.cgi 仅对可信用户开放访问。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "CVSWeb 1.80 Perl open 函数远程代码执行漏洞"
updated = "2000-07-12T00:00:00Z"

