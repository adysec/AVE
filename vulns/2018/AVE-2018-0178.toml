[basic]
description = "node-srv 是一个 Node.js 静态文件服务模块，其 URL 路径处理存在路径遍历漏洞。由于未对用户请求的 URL 进行充分校验，攻击者可通过构造包含 ../ 等特殊字符的路径，绕过目录限制读取服务器上任意已知路径的文件内容。该漏洞影响所有使用 node-srv 模块的 Node.js 应用，攻击者只需具有网络访问权限且无需认证即可利用，导致敏感信息泄露。CVSS 评分 6.5，危害等级中危。"
published = "2018-06-07T02:29:07.973"
remediation = '升级 node-srv 至最新版本 3.0.3，该版本已修复 URL 路径校验缺失问题。如无法升级，在应用层对用户请求的 URL 进行规范化校验，拒绝包含 `../` 或 `..\\` 等目录遍历序列的路径，并限制文件访问范围到指定根目录。建议迁移至其他活跃维护的静态文件服务模块（如 serve-handler）以长期规避风险。'
score = 6.5
severity = "MEDIUM"
sources = ["nuclei"]
title = "node-srv 路径遍历漏洞"
updated = "2026-06-17T01:57:42.650"

