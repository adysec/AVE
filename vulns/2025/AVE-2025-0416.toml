[basic]
description = "Python 标准库 `urllib.parse` 模块中的 `urlsplit` 和 `urlparse` 函数存在输入验证缺陷，错误地允许域名中包含方括号字符，违反了 RFC 3986 规范（方括号仅应用于 IPv6/IPvFuture 地址定界）。这导致 Python URL 解析器与其他符合规范的解析器产生解析差异，攻击者可构造包含方括号的特制 URL 绕过安全检测机制（如 SSRF 防护、访问控制列表），造成安全策略失效。该漏洞影响 Python 3.x 系列版本，无需认证即可远程利用，CVSS 评分 6.3，危害等级中危。"
published = "2025-01-31T18:15:38Z"
remediation = "立即将 Python 升级至包含修复的版本：3.13.2 及以上、3.12.9 及以上、3.11.11 及以上、3.10.16 及以上或 3.9.21 及以上。SUSE Linux 用户可通过 zypper update python3 升级至 3.13.5。如无法立即升级，可在调用 urllib.parse.urlsplit/urlparse 前自行校验域名中不含方括号字符，或使用符合 RFC 3986 的第三方 URL 解析库作为临时缓解措施。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Python CPython 标准库 URL 解析器域名方括号解析差异漏洞"
updated = "2026-06-17T08:27:24Z"

