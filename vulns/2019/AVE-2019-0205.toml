[basic]
description = "HotelDruid 2.3.0 版本存在跨站脚本攻击（XSS）漏洞，攻击原理为应用程序未对用户输入进行充分过滤与转义。该漏洞影响 creaprezzi.php、tabella3.php、personalizza.php 和 visualizza_tabelle.php 等多个文件中的 nsextt、cambia1、mese_fine、origine 及 anno 等参数。攻击者无需认证即可通过网络远程构造包含恶意 JavaScript 代码的请求，诱骗已登录管理员或用户点击特制链接，从而在受害者浏览器中执行任意脚本，可能导致会话劫持、敏感信息泄露或管理员权限被窃取。CVSS 3.0 评分为 6.1，危害等级为中危。"
published = "2019-05-17T15:29:00Z"
remediation = "建议立即将 HotelDruid 升级至 2.3.1 或更高版本（当前最新为 3.0.8），该版本修复了 creaprezzi.php、tabella3.php、personalizza.php 及 visualizza_tabelle.php 中 nsextt、cambia1、mese_fine、origine、anno 等参数未做输出编码导致的跨站脚本漏洞。升级方式：从 SourceForge（https://sourceforge.net/projects/hoteldruid/files/）下载对应版本压缩包，替换 Web 目录下的 HotelDruid 文件并执行数据库升级脚本。如无法立即升级，可在 Apache/Nginx 层面配置 WAF 规则，拦截含有 `<script>`、`onmouseover`、`onload` 等关键词的 GET/POST 请求参数，作为临时缓解措施。同时建议审查系统中 creaprezzi.php、tabella3.php、personalizza.php、visualizza_tabelle.php 的访问日志，确认是否存在历史攻击痕迹。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "HotelDruid 酒店管理系统 跨站脚本攻击漏洞"
