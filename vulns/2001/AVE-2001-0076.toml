[basic]
description = "Apple QuickTime Player 4.1.2（日文版）的浏览器插件存在缓冲区溢出漏洞。攻击者可在网页中嵌入带有超长 HREF 参数的 EMBED 标签，当用户访问包含该恶意标签的网页时，QuickTime 插件会加载并处理该标签，从而触发缓冲区溢出，使远程攻击者得以在目标系统上执行任意命令。该漏洞影响运行 Windows 系统的 QuickTime Player 4.1.2 日文版本，CVSS 评分为 7.6。由于攻击需要用户主动访问恶意网页，交互性条件较高，但一旦利用成功，攻击者可完全控制受影响系统。"
published = "2001-05-03T04:00:00Z"
remediation = "建议将 Apple QuickTime 升级到 4.1.3 或更高版本，以修复缓冲区溢出漏洞。如果不再需要使用该软件，建议直接从 Windows 控制面板中将其卸载，以彻底消除攻击面。"
score = 7.6
severity = "HIGH"
sources = ["epss"]
title = "Apple QuickTime Player 远程代码执行漏洞"
updated = "2026-06-16T21:53:51Z"

