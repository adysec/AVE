[basic]
description = "明尼苏达大学（UMN）Gopherd 2.x 的 Halidate 函数存在缓冲区溢出漏洞。远程攻击者无需身份认证，通过向目标系统发送包含超长 ticket 值的 DES 密钥生成请求（GDESkey），即可触发栈缓冲区溢出，导致任意代码执行。该漏洞影响 UMN Gopherd 2.x 系列版本，CVSS 评分 10.0，危害等级严重，攻击复杂度低，可完全控制目标系统。"
published = "2000-10-20T04:00:00.000"
remediation = """
The user wants me to generate a remediation field for CVE-2000-0743. This is a buffer overflow in UMN Gopherd 2.x from the year 2000. The product is long obsolete. I need to provide actionable Chinese remediation advice.

Let me craft a practical remediation that:
1. States the product is end-of-life
2. Recommends upgrading/migrating
3. Provides specific steps

The NVD references mention "Patch" tags, but the software is from 2000 and likely discontinued. The practical advice would be to decommission or replace the service.UMN Gopherd 2.x 已停止维护多年，无官方安全更新。建议立即停用 UMN Gopherd 并迁移至现代替代方案（如 PyGopherd 或 go-gopher）。如无法立即替换，在防火墙层面将 gopher 端口（默认 70/TCP）的访问限制为仅受信 IP 段，并禁用 GDESkey 功能以降低攻击面。"""
