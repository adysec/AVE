[basic]
description = "Apple Safari 浏览器所采用的 WebKit 渲染引擎存在内存破坏漏洞，影响 Safari 6.0 之前版本以及 Apple iOS 6.0 之前版本。远程攻击者可通过构造恶意网站向目标用户发送特制 Web 内容，触发 WebKit 在处理网页渲染过程中的内存损坏，最终实现任意代码执行或导致浏览器应用程序崩溃。该漏洞利用无需身份认证，攻击者只需诱导用户访问恶意链接即可完成攻击，受影响范围包括桌面端 Safari 浏览器及移动端 iOS 设备。Apple 已在 iOS 6.0 和 Safari 6.0 安全更新中修复此漏洞，CVSS 评分 9.3，危害等级严重。"
published = "2012-07-25T20:55:03.493"
remediation = "Mac OS X 用户应立即升级 Safari 至 6.0 版本（需运行 OS X Lion v10.7.4 或更高版本），或安装 Apple 2012 年 7 月 25 日发布的安全更新（Safari 6.0 for Lion），该版本通过改进 WebKit 内存管理机制修复了多处内存破坏漏洞。iOS 用户应将设备升级至 iOS 6.0，覆盖设备包括 iPhone 3GS 及后续机型、iPod touch（第 4 代）及后续机型、iPad 2 及后续机型，iOS 6.0 同样通过改进 WebKit 内存处理消除了该漏洞。如暂时无法升级，可在 Safari 中禁用 JavaScript 执行并避免访问不受信任的网站，以降低远程代码执行风险。此外，Windows 用户应升级 Safari 至 6.0（通过 iTunes 10.7 或直接下载 Safari 6 for Windows）。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:37.810"

