[basic]
description = "Internet Explorer 5.0 至 5.5 版本中存在框架域名验证漏洞（Frame Domain Verification），浏览器窗口内用于验证框架来源域名的函数未能正确执行跨域检查，导致远程攻击者可通过构造包含恶意框架的网页，诱使目标用户使用受影响的 IE 浏览器访问后，绕过同源策略限制，跨域读取客户端本地文件系统中的敏感信息。该漏洞攻击复杂度较高，需要用户交互配合，仅影响机密性，不造成数据篡改或服务中断。"
published = "2001-02-16T05:00:00.000"
remediation = "安装 Microsoft 安全公告 MS00-093 对应的补丁程序，或升级 Internet Explorer 至 6.0 及以上版本。如无法升级，可在 Internet 区域中禁用「启用跨框架浏览子域」选项，并将受信任站点区域设置为高安全级别以降低风险。"
score = 2.6
severity = "LOW"
sources = ["cve"]
title = "Microsoft Internet Explorer 跨域框架验证绕过漏洞"
updated = "2026-06-16T21:53:38.450"

