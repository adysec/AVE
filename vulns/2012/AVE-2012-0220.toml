[basic]
description = "Mozilla Firefox 15.0 之前版本、Thunderbird 15.0 之前版本以及 SeaMonkey 2.12 之前版本中存在一个安全漏洞，由于未阻止通过 Object.defineProperty 方法遮蔽 location 对象（即 window.location），远程攻击者可通过涉及插件的向量利用该漏洞实施跨站脚本（XSS）攻击。攻击者可以绕过同源策略，在受害者的浏览器上下文中执行任意脚本代码，窃取会话凭证或执行恶意操作。该漏洞无需用户交互即可触发，CVSS 评分 4.3，危害等级中危。"
published = "2012-08-29T10:56:39.737"
remediation = "升级 Mozilla Firefox 至 15.0 及以上版本、Thunderbird 至 15.0 及以上版本、SeaMonkey 至 2.12 及以上版本。如无法立即升级，可在浏览器中禁用 JavaScript 并安装 NoScript 等扩展阻止不可信脚本执行，以降低 XSS 攻击风险。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox/SeaMonkey/Thunderbird Location对象遮蔽跨站脚本漏洞"
updated = "2026-06-16T23:40:39.610"

