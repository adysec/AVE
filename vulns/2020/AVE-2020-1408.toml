[basic]
description = "Cisco Adaptive Security Appliance（ASA）Software 和 Cisco Firepower Threat Defense（FTD）Software 的 Web 服务接口存在目录遍历漏洞。由于对 HTTP 请求中的 URL 缺乏充分的输入验证，未经身份认证的远程攻击者可以通过向受影响设备发送包含目录遍历字符序列的特制 HTTP 请求，读取目标设备 Web 服务文件系统中的任意敏感文件。该漏洞影响配置了 WebVPN 或 AnyConnect 功能的 ASA 和 FTD 设备，CVSS 评分 7.5，危害等级高。成功利用该漏洞可使攻击者获取设备上的敏感配置文件等信息，但无法访问 ASA 或 FTD 系统文件及底层操作系统文件。"
published = "2020-07-22T20:15:11.970"
remediation = "立即升级 Cisco ASA Software 至对应分支首个修复版本（9.6 升级至 9.6.4.42、9.8 升级至 9.8.4.20、9.9 升级至 9.9.2.74、9.10 升级至 9.10.1.42、9.12 升级至 9.12.3.12、9.13 升级至 9.13.1.10、9.14 升级至 9.14.1.10），或升级 Cisco FTD Software 至 6.2.3.16、6.4.0.10、6.5.0.5、6.6.0.1 等修复版本；对于受 FMC 或 FDM 管理的设备，请通过相应管理界面执行升级并在升级后重新应用访问控制策略。该漏洞尚无配置层面的变通方案，如无法立即升级，可在 Cisco Firepower 传感器上启用 Snort 规则 54598 至 54601（SRU 2020-07-22-001）以检测和拦截利用尝试。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Cisco ASA/FTD 目录遍历文件读取漏洞"
updated = "2026-06-17T03:18:18.790"

