[basic]
description = "Google Chrome（Android 版本）的 WebGPU 组件存在越界写入漏洞，该漏洞源于对 GPU 内存边界检查不充分。远程攻击者可通过构造特制的 HTML 页面诱导用户访问，触发越界内存写入，导致程序崩溃或任意代码执行。该漏洞影响 142.0.7444.137 之前版本的 Chrome for Android，CVSS 评分 8.8，危害等级高。攻击需要用户交互（点击链接），但无需身份认证，攻击复杂度低。"
published = "2025-11-10T20:15:39Z"
remediation = "tags.<value>建议立即升级 Google Chrome 到 142.0.7444.162 或更高版本以修复此 WebGPU 中的越界写入漏洞。如无法立即更新，可通过 Chrome 命令行参数 `--disable-webgpu` 强制禁用 WebGPU 功能作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome WebGPU 越界写入漏洞"
updated = "2026-06-17T08:32:51Z"

