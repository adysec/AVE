[basic]
description = "IBM AIX 4.3.x 及更早版本的 setclock 命令存在栈缓冲区溢出漏洞，本地攻击者可通过向 setclock 命令传递超长参数触发溢出，覆盖返回地址并执行任意 Shellcode，从而获取完整系统控制权限。该漏洞影响 IBM AIX 4.3.x 及更早版本，攻击者需具备本地登录权限且无需身份认证，CVSS 评分 7.2（高危），成功利用可完全破坏系统机密性、完整性和可用性。IBM 已发布补丁修复该漏洞，建议尽快升级至修复版本。"
published = "2001-01-09T05:00:00Z"
remediation = "立即升级 IBM AIX 至 4.3.3 或更高版本（建议升级至 AIX 5.1 或更高版本），并应用 IBM 安全补丁 IY17034 (AIX 4.3.3) 或 IY17035 (AIX 4.2.1)。临时缓解措施：移除 /usr/sbin/setclock 的 setuid 位（chmod u-s /usr/sbin/setclock），或通过 sudo 限制普通用户执行该命令。如无法升级，建议限制本地用户登录权限并启用审计监控 setclock 执行记录。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "IBM AIX setclock 缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:53:11Z"

