[basic]
description = "Keycloak 13.0.0 之前的版本存在服务端请求伪造（SSRF）漏洞。该漏洞源于 OIDC 认证流程中对 request_uri 参数的URL验证不充分，未经身份认证的远程攻击者可通过构造包含恶意 request_uri 的 OIDC 请求，强制 Keycloak 服务器向任意未验证的目标 URL 发起出站请求，从而探测内网服务、访问敏感资源或进一步渗透内网。该漏洞攻击复杂度低，无需交互即可利用，Keycloak 12.0.1 等所有 13.0.0 之前的版本均受此漏洞影响。"
published = "2020-12-15T20:15:14Z"
remediation = '升级到 Keycloak 13.0.0 或更高版本以修复此漏洞。对正在使用 Red Hat Single Sign-On 的用户，应升级至 7.4.5 版本（相关修复见 RHSA-2021:0318、RHSA-2021:0319、RHSA-2021:0320 及 RHSA-2021:0327）。如暂无法立即升级，可在 Keycloak 管理控制台中将使用 OIDC 协议的客户端设置为禁用"Validate Signature"选项，或在客户端配置中移除 request_uri 参数的使用，以阻止攻击者利用该参数发起服务端请求伪造攻击。同时建议在网络层限制 Keycloak 服务器对内部敏感资源的访问。'
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "Red Hat Keycloak 服务端请求伪造漏洞"
updated = "2026-06-17T02:48:24Z"

