[basic]
description = "Microsoft Surface 设备固件存在输入验证不当漏洞（CWE-20），导致安全功能绕过。攻击者需位于同一邻接网络，在攻击复杂度较高且需要用户交互的条件下，利用特制的请求绕过设备的安全机制，成功利用后可导致机密性、完整性和可用性全面受损。该漏洞影响 Surface Go、Surface Hub、Surface Laptop Go、Surface Laptop Go 3、Surface Pro、Surface Pro 8、Surface Pro 9 ARM、Surface Laptop 3/4 及 Surface Windows Dev Kit 等多款设备。Microsoft 已在 2025 年 2 月安全更新中发布修复补丁。"
published = "2025-02-11T18:15:30Z"
remediation = "立即通过 Windows Update 或 Microsoft Surface 应用安装 2025 年 2 月发布的 Surface 固件和驱动程序更新。在 Surface 设备上进入设置 > Windows 更新 > 检查更新，确保所有 Surface 固件更新均已安装。同时确认设备已启用 Secure Boot（UEFI 设置 > 安全 > Secure Boot > 启用），并确保 BitLocker 已开启以保护启动完整性。企业环境可通过 Microsoft Intune 或 WSUS 统一推送 Surface 固件更新包。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Surface 安全功能绕过漏洞"
updated = "2026-06-17T08:42:44Z"

