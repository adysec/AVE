[basic]
description = "Windows NTFS 文件系统存在访问控制缺陷漏洞（CWE-284），由于 NTFS 对文件夹内容的访问权限校验不充分，已通过身份认证的攻击者可利用该漏洞在未获得目录列表权限的情况下，通过构造特制的文件系统操作请求，间接枚举目标文件夹中的文件路径信息，导致敏感文件路径泄露。该漏洞攻击复杂度低，无需用户交互，CVSS 评分 6.5，危害等级中危。Microsoft 已在 2025 年 4 月安全更新中修复此漏洞。"
published = "2025-04-08T18:15:45Z"
remediation = "立即安装 Microsoft 2025 年 4 月安全更新。受影响版本及修复版本：Windows 10 1507 升级到 10.0.10240.20978 及以上；Windows 10 1607/Server 2016 升级到 10.0.14393.7969；Windows 10 1809/Server 2019 升级到 10.0.17763.7136；Windows 10 21H2 升级到 10.0.19044.5737；Windows 10 22H2 升级到 10.0.19045.5737；Windows 11 22H2 升级到 10.0.22621.5189；Windows 11 23H2 升级到 10.0.22631.5189；Windows 11 24H2/Server 2025 升级到 10.0.26100.3775；Server 2022 升级到 10.0.20348.3453。可通过 Windows Update 自动获取更新，或从 Microsoft 更新目录网站手动下载安装。如无法立即打补丁，建议对受影响的 NTFS 卷启用访问控制列表（ACL）严格限制低权限用户的目录遍历操作，并监控异常的文件路径枚举行为。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows NTFS 信息泄露漏洞"
updated = "2026-06-17T08:42:44Z"

