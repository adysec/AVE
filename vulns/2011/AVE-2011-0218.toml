[basic]
description = "Apple iOS 5.0.1 之前版本中 CoreGraphics 组件所集成的 FreeType 字体渲染引擎存在越界写入漏洞（CWE-787）。远程攻击者可通过向目标设备发送包含特制字体的文档（如 PDF 或网页），在字体解析过程中触发内存破坏，导致任意代码执行或拒绝服务。攻击无需身份认证但需要用户交互（打开恶意文档），影响 iOS 3.0 至 5.0 版本。Apple 已在 iOS 5.0.1 更新中修复此漏洞。"
published = "2011-11-11T18:55:01Z"
remediation = "升级 Apple iOS 至 5.0.1 或更高版本，该版本修复了 CoreGraphics 中 FreeType 字体处理的内存破坏漏洞。如无法立即升级，建议避免在 iOS 设备上打开来源不明的文档文件，并禁用 Safari 自动字体渲染功能作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple iOS CoreGraphics FreeType 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:33:17Z"

