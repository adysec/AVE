[basic]
description = "MySQL 和 MariaDB 在特定环境下存在身份认证绕过漏洞。该漏洞源于 sql/password.c 中密码令牌比较函数的返回值检查不完善，当运行在某些特定 memcmp 函数实现的系统上时，memcmp 可能因字节比较的整数溢出而返回非预期结果（零值）。远程攻击者无需知道正确密码，只需在登录过程中反复使用同一错误密码进行认证尝试，即可在约 256 次尝试内使令牌比较意外成功，从而绕过身份验证机制，获取数据库的完全访问权限，实现数据的未授权读取、修改或删除。该漏洞影响 MySQL 5.1.63 之前版本、5.5.24 之前版本、5.6.6 之前版本，以及 MariaDB 5.1.62/5.2.12/5.3.6/5.5.23 之前版本，CVSS 评分 5.1，危害等级中危。Oracle 和 MariaDB 官方已在后续版本中修复此漏洞。"
published = "2012-06-26T18:55:05.083"
remediation = "升级 MySQL 至 5.1.63、5.5.24 或 5.6.6 及以上版本，MariaDB 升级至 5.1.62、5.2.12、5.3.6 或 5.5.23 及以上版本。如无法立即升级，可在应用层增加登录失败次数限制和延迟策略，降低暴力重试认证的成功率。"
score = 5.1
severity = "MEDIUM"
sources = ["tenable"]
title = "Oracle MySQL 身份认证绕过漏洞"
updated = "2026-06-16T23:41:02.110"

