[basic]
description = 'Avirt Mail 4.0 和 4.2 版本在处理 SMTP 协议的 "RCPT TO" 和 "MAIL FROM" 命令时存在缓冲区溢出漏洞。远程攻击者无需身份认证即可向目标邮件服务器发送超长的邮件地址参数，触发缓冲区溢出，导致服务崩溃（拒绝服务），并可能进一步利用该漏洞执行任意代码。该漏洞 CVSS 评分为 10.0，危害等级为严重，影响所有运行 Avirt Mail 4.0 及 4.2 的系统。'
published = "2000-12-19T05:00:00.000"
remediation = "立即升级至 Avirt Mail 4.3 或更高版本，该版本已修复对 SMTP 命令输入长度的校验。如厂商已停止维护，建议迁移至其他受支持的邮件服务器软件（如 Postfix、Exim）。临时缓解措施：在 SMTP 代理或防火墙层面限制 MAIL FROM 和 RCPT TO 命令参数长度不超过 256 字符。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Avirt Mail 远程拒绝服务漏洞"
updated = "2026-06-16T21:52:53.017"

