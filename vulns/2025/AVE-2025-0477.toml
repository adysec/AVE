[basic]
description = 'wcurl 工具存在路径遍历漏洞，当 URL 中包含百分号编码的斜杠（`/` 或 `\`）时，攻击者可诱使用户下载特制 URL，导致输出文件被保存到当前目录之外的非预期位置。该漏洞仅影响 wcurl 命令行工具，攻击者需诱骗用户访问恶意 URL 方可利用，CVSS 评分 4.6，危害等级中危。建议用户升级至修复版本以消除此漏洞。'
published = "2026-02-25T08:16:18Z"
remediation = "升级 curl 至 8.18.0 及以上版本（wcurl 2025.11.09 已修复此漏洞）。如无法立即升级，使用 wcurl 时添加 `--no-decode-filename` 参数禁用百分号解码，或始终通过 `-o` 显式指定输出文件名，避免路径遍历风险。"
score = 4.6
severity = "MEDIUM"
sources = ["msrc"]
title = "curl wcurl 路径遍历漏洞"
updated = "2026-06-17T08:30:42Z"

