[basic]
description = "Microsoft Internet Explorer 的 MSHTML 引擎中存在释放后重用（use-after-free）漏洞，具体位于 `mshtml!CElement::ie9_removeAttributeNodeInternal` 函数中。当调用 `removeAttributeNode` 时，代码先计算节点在属性数组中的索引，随后在索引使用前触发用户可控的回调函数，但未验证回调执行后索引是否仍然有效。攻击者可利用 `clearAttributes` 在回调中修改后备存储缓冲区，导致属性被重复释放，进而触发 Double-Free。该漏洞影响安装 KB4601319 及之前版本的系统，远程攻击者只需诱导用户使用 Internet Explorer 访问恶意网页即可触发。攻击者利用该漏洞可实现类型混淆，通过 Scripting.Dictionary 与 VBArray 对象泄露内存地址，并结合 ArrayBuffer 伪造获得任意读写权限，最终绕过 Control Flow Guard 实现远程代码执行。该漏洞曾被朝鲜黑客用于针对安全研究人员的定向攻击，CISA 已将其列入已知被利用漏洞目录并确认与勒索软件活动有关。Microsoft 于 2021 年 3 月通过 KB5000802 安全更新修复了此漏洞。"
published = "2021-03-11T16:15:13Z"
remediation = '安装 Microsoft 2021 年 3 月安全更新（KB5000802/KB5000808/KB5000842 等累积更新，具体 KB 号取决于操作系统版本），或通过 Windows Update 自动更新修复。如无法立即打补丁，可在组策略中启用"仅允许使用增强安全配置"（Enterprise Mode Site List）并禁用 Internet Explorer 11 作为临时缓解措施，同时建议迁移至 Microsoft Edge 浏览器，该浏览器不受此漏洞影响。'
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Internet Explorer 内存损坏漏洞"
updated = "2026-06-17T03:43:21Z"

