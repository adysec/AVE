[basic]
description = "Brian Dorricott MAILTO 的 mailto.exe 程序（1.0.9 及更早版本）存在隐藏表单字段可被恶意修改的安全漏洞。远程攻击者无需身份认证即可通过修改 sendto、email、server、subject 及 resulturl 等隐藏表单字段的值，利用该程序作为邮件中继代理发送垃圾邮件。该漏洞影响 MAILTO 1.0.9 及之前所有版本，攻击者只需构造特制的 HTTP 请求即可利用，攻击门槛低，可导致邮件服务器被滥用、垃圾邮件泛滥及信息泄露。"
published = "2001-12-11T05:00:00Z"
remediation = "立即删除或禁用服务器上的 mailto.exe CGI 脚本，该软件已停止维护且无安全更新可用。如业务需要表单转邮件功能，改用支持服务器端参数校验的现代邮件网关组件，并对 SMTP 服务器启用身份认证和发送频率限制。作为临时缓解措施，在 Web 服务器配置中限制 mailto.exe 的执行权限，仅允许受信来源 IP 访问。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Brian Dorricott MAILTO 未经授权邮件服务器使用漏洞"
updated = "2026-06-16T21:55:46Z"

