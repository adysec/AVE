[basic]
description = "Opera Web Browser 11.50 之前版本中 Array.prototype.join 方法存在资源管理错误漏洞，攻击者可通过构造包含初始空洞的非数组对象，触发 join 方法处理异常导致浏览器应用程序崩溃，造成拒绝服务。该漏洞影响 Opera 11.50 之前所有版本，攻击者无需身份认证即可通过网络远程诱导用户访问恶意网页触发漏洞，CVSS 评分 5.0（中危），主要影响可用性。Opera 已在 11.50 版本中修复该漏洞，用户升级至 11.50 或更高版本即可修复。"
published = "2011-07-01T10:55:02Z"
remediation = '建议立即将 Opera 浏览器升级至 11.50 及以上版本，可通过 Opera 官网 (https://www.opera.com/) 下载最新版本安装包覆盖安装，或在浏览器菜单中选择"关于 Opera"触发自动更新。若暂时无法升级，建议暂停使用 Opera 浏览器访问不可信网站，改用 Chrome、Firefox 等已修补浏览器作为临时替代方案。'
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera Web Browser 远程拒绝服务漏洞"
updated = "2026-06-16T23:31:39Z"

