[basic]
description = "Trillian 0.73 和 0.74 版本的 IRC 组件在处理用户离开频道的 PART 消息时存在逻辑缺陷。当消息中未指定频道名称，或指定的频道并非用户当前所在的频道时，客户端会因异常处理不当而崩溃。远程攻击者仅需控制一个恶意 IRC 服务器，待 Trillian 用户连接后发送特制 PART 消息即可触发拒绝服务，攻击无需身份认证且条件简单。"
published = "2003-04-02T05:00:00Z"
remediation = "建议升级 Trillian 到 0.75 或更高版本（官方已修复该 IRC PART 消息解析缺陷），下载地址：https://www.trillian.im/get/。若暂时无法升级，可在防火墙层面阻断非受信 IRC 服务器的连接，或在 Trillian 设置中禁用 IRC 协议支持作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Cerulean Studios Trillian 0.74 IRC 客户端拒绝服务漏洞"
updated = "2026-06-16T21:59:25Z"

