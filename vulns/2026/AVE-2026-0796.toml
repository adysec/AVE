[basic]
description = "DSSRF 是一个 Node.js 库，提供 SSRF 防御检测功能。其 `is_url_safe` 函数在配置 1.1.1.1 作为 DNS 解析器时存在安全缺陷：当 1.1.1.1 返回 NXDOMAIN 时，`dns.resolve4` 不返回地址且未触发 `dns.lookup` 回退机制，导致 `localhost` 被误判为安全地址。攻击者可通过构造特定域名使 DNS 解析失败，绕过 SSRF 防护，向内网服务发起请求，造成服务器端请求伪造攻击。该漏洞影响 1.5.0 之前版本，已在 1.0.5 版本中修复。"
published = "2026-07-31T18:17:17Z"
remediation = "立即将 dssrf 升级到 1.0.5 或更高版本。该版本在 `resolve_all_records` 函数中增加了 `dns.lookup` 回退机制，当 `dns.resolve4` 返回空结果时通过 `dns.lookup` 二次解析，避免因 DNS 返回 NXDOMAIN 导致 SSRF 绕过。如无法立即升级，可在应用层强制将 `dns.setServers` 配置为支持 localhost 解析的 DNS 服务器，或在 SSRF 检测前额外校验目标主机名是否为内网地址。"
score = 8.7
severity = "HIGH"
sources = ["ghsa"]
title = "dssrf DNS 解析绕过导致服务端请求伪造漏洞"
updated = "2026-07-31T18:17:17Z"

