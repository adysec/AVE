[basic]
description = "Microsoft Outlook 97/98/2000 及 Outlook Express 4.0/5.0 的邮件头解析组件存在缓冲区溢出漏洞。远程攻击者可通过向目标用户发送包含超长 Date 字段的恶意邮件触发该漏洞，导致任意代码执行。攻击者可在邮件中嵌入精心构造的 Date 头数据，当 Outlook 或 Outlook Express 解析畸形邮件头时触发栈溢出，从而控制受影响系统。该漏洞无需用户交互，仅需打开或预览邮件即可触发，危害较大。"
published = "2000-07-18T04:00:00Z"
remediation = "建议立即安装 Microsoft 安全公告 MS00-043 提供的补丁，或执行 Internet Explorer 5.01 Service Pack 1 的默认安装以更新 Inetcomm.dll 组件。Windows 2000 用户如已安装 IE 5.5，可安装 MS00-043 补丁或降级至 IE 5.01 SP1。Outlook 用户若仅使用 MAPI 协议风险较低，但仍建议安装补丁以防范其他关联漏洞（MS00-045/MS00-046）。如无法立即打补丁，可将 Outlook 切换为仅使用 MAPI 协议作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Outlook / Outlook Express 邮件头Date字段缓冲区溢出漏洞"
updated = "2026-06-16T21:52:00Z"

