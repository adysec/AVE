[basic]
description = "Sitecore 内容管理系统（CMS）的 anti CSRF 模块中存在反序列化不可信数据漏洞（CWE-502）。经过身份认证的攻击者可通过向受影响系统发送包含特制序列化 .NET 对象的 HTTP POST 参数，触发不安全的反序列化操作，从而在目标服务器上执行任意代码。该漏洞影响 Sitecore 9.1 及之前版本，攻击者需拥有有效凭据方可利用，但无需用户交互。成功利用可导致服务器完全受控，造成机密性、完整性和可用性全面受损。官方已发布安全更新修复此漏洞。"
published = "2019-05-31T21:29:06Z"
remediation = "立即将 Sitecore CMS/XP 升级到 9.1 Update-1 或更高版本（9.2/9.3/10.x）。如无法立即升级，可在 web.config 中禁用 AntiCSRF 模块（移除或注释 Sitecore.Security.AntiCSRF 相关配置），或在反向代理/WAF 层对 HTTP POST 参数 __CSRFTOKEN 添加反序列化内容过滤规则，阻止攻击载荷传递。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Sitecore anti CSRF 模块反序列化远程代码执行漏洞"
updated = "2026-06-17T02:44:46Z"

