[basic]
description = "QNAP HBS 3 Hybrid Backup Sync 存在外部控制文件名或路径漏洞（CWE-73），攻击者通过本地网络访问目标设备后，可利用该漏洞控制文件操作路径，实现任意文件读取或修改。该漏洞影响 HBS 3 Hybrid Backup Sync 系列产品，CVSS 评分 7.0，危害等级高。攻击者无需身份认证即可在本地网络环境中触发，可能导致敏感数据泄露或系统文件被篡改。QNAP 已在 HBS 3 Hybrid Backup Sync 26.2.0.938 及更高版本中修复此漏洞。"
published = "2026-01-02T16:17:00Z"
remediation = "立即将 HBS 3 Hybrid Backup Sync 升级至 26.2.0.938 或更高版本，可通过 QNAP App Center 或官方下载页面获取更新。如无法立即升级，建议在防火墙层面限制对 HBS 服务的局域网访问，仅允许受信任 IP 连接，并禁用不必要的文件共享端口。"
score = 7
severity = "HIGH"
sources = ["zdi"]
title = "QNAP Systems HBS 3 Hybrid Backup Sync 文件路径控制漏洞"
updated = "2026-07-25T11:10:00Z"

