[info]
author = "ave"
description = "验证Taylor UUCP 1.0.6中uuxqt组件未能正确过滤危险长选项的漏洞，本地用户可通过uux命令的--config选项指定恶意配置文件实现权限提升"
id = "POC-AVE-2001-0333"
name = "Taylor UUCP 1.0.6 Argument Handling Privilege Escalation PoC"
severity = "high"
tags = ["ave-2001-0333"]
vuln_id = [
    "CVE-2001-0873",
    "AVE-2001-0333",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["uucp"]
