[basic]
description = "Tarantella Enterprise 3.11 之前版本中存在目录遍历漏洞，位于 `/tarantella/cgi-bin/secure/ttawlogin.cgi` 脚本中。未经身份认证的远程攻击者可通过向 `pg` 参数传入 `../../` 等路径穿越序列，绕过访问限制读取服务器上的任意文件（如 `/etc/passwd`），导致敏感信息泄露。该漏洞无需任何权限即可远程利用，攻击复杂度低，影响 Oracle Tarantella Enterprise 全系列 3.11 以下版本。"
published = "2018-12-05T22:29:00Z"
remediation = "该产品已由 Oracle 终止支持（EOL），官方不再提供安全更新。建议立即升级到 Tarantella Enterprise 3.11 或更高版本（如仍可获得）；若无法升级，应在 Web 服务器或反向代理层配置访问控制规则，限制对 `/tarantella/cgi-bin/secure/ttawlogin.cgi` 的访问，仅允许可信 IP 段访问，并部署 WAF 规则拦截包含 `../` 或 `./` 路径遍历特征的请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Tarantella Enterprise 目录遍历漏洞"
updated = "2026-06-17T01:49:48Z"

