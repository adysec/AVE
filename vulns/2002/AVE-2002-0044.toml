[basic]
description = "Canna 3.5b2 及更早版本中的 `irw_through` 函数存在缓冲区溢出漏洞。本地攻击者可以通过构造特殊的输入触发该漏洞，导致内存缓冲区溢出，从而在 `bin` 用户权限下执行任意恶意代码。该漏洞影响范围为 Canna 3.5b2 及其之前的所有版本，攻击条件为攻击者需具备本地系统访问权限。利用此漏洞可导致系统权限提升或敏感数据被篡改。"
published = "2002-12-18T05:00:00Z"
remediation = "建议立即停止使用 Canna 3.5b2 及更早版本，由于该软件已停止维护，请迁移至安全的替代方案。如必须运行，应通过限制本地用户权限或使用 chroot/容器等沙箱环境隔离，防止本地用户利用缓冲区溢出漏洞获取 bin 用户权限。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "Canna 3.5b2 及早期版本 缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:58:51Z"

