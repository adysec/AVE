[basic]
description = "Apache HTTP Server 的 mod_proxy 模块在配置为反向代理时，对 RewriteRule 和 ProxyPassMatch 指令的模式匹配处理存在输入验证缺陷（CWE-20）。远程攻击者可通过构造包含 @ 符号的畸形 URI，利用 HTTP/0.9 协议发送特制请求，绕过代理限制将请求转发至内部网络服务器，导致内网信息泄露。该漏洞影响 Apache HTTP Server 2.0.x 至 2.0.64 及 2.2.x 至 2.2.18 版本，是 CVE-2011-3368 修复不完整所致，CVSS 评分 4.3，危害等级中危。"
published = "2011-11-30T04:05:58Z"
remediation = "升级 Apache HTTP Server 至 2.2.18 或更高版本（2.0.x 用户升级至 2.0.65 以上）。如无法立即升级，在反向代理配置中避免将 RewriteRule 或 ProxyPassMatch 与 HTTP/0.9 协议结合使用，并在 ProxyRequests 指令中限制允许转发的目标地址范围，仅允许代理到可信内部网段。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apache HTTP Server mod_proxy 反向代理安全绕过漏洞"
updated = "2026-06-16T23:33:40Z"

