[basic]
description = "Poll It 2.01及更早版本中的pollit.cgi脚本将投票数据文件存放在Web文档根目录下，远程攻击者无需认证即可通过直接访问数据文件路径获取敏感信息，包括投票统计、用户提交数据等。攻击条件简单，仅需知道数据文件路径即可利用。"
published = "2000-12-11T05:00:00.000"
remediation = "立即将 Poll It 的数据文件目录（默认为 pollit_files）移出 Web 文档根目录，例如移至 /var/www/pollit_data/，并修改 pollit.cgi 中对应的数据路径变量。同时配置 Web 服务器（Apache/Nginx）添加拒绝规则，禁止外部直接访问 /pollit_files/ 路径下的任何文件。由于该 CGI 脚本已长期无人维护，建议彻底替换为仍在安全更新的投票系统（如 LimeSurvey 或 Drupal Poll 模块）。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Poll It pollit.cgi 信息泄露漏洞"
updated = "2026-06-16T21:53:05.393"

