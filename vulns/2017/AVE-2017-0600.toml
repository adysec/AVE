[basic]
description = "Embedthis GoAhead Web Server 3.6.5 之前版本中存在远程命令执行漏洞。该漏洞源于 cgi.c 文件中的 cgiHandler 函数在处理 CGI 请求时，使用不受信任的 HTTP 请求参数初始化 CGI 脚本的环境变量。攻击者可利用 glibc 动态链接器的特性，通过构造特殊的参数名（如 LD_PRELOAD）并结合 /proc/self/fd/0 引用自身 POST 的共享对象载荷，实现远程命令执行。该漏洞影响启用 CGI 功能且 CGI 程序为动态链接的 GoAhead 服务器，CVSS 评分 8.1，危害等级高。攻击无需身份认证，但需要 CGI 功能开启且攻击复杂度较高。"
published = "2017-12-12T19:29:00Z"
remediation = "立即升级 Embedthis GoAhead 至 3.6.5 或更高版本（官方 commit 6f786c1）。如无法升级，在 CGI 程序中禁用动态链接（编译时使用 `-static`），或在 Web 服务器层面过滤 `LD_PRELOAD`、`LD_LIBRARY_PATH` 等危险环境变量，同时禁用不必要的 CGI 功能。"
score = 8.1
severity = "HIGH"
sources = ["nuclei"]
title = "Embedthis GoAhead 远程命令执行漏洞"
updated = "2026-06-17T01:11:15Z"

