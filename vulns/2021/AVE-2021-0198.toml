[basic]
description = "SonicWall SMA100 系列安全远程访问设备内置 Apache httpd 服务器的 mod_cgi 模块在处理环境变量时存在基于栈的缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标设备发送特制的 HTTP 请求，触发 mod_cgi 模块对超长环境变量的错误处理，从而造成栈内存覆盖并可能以 'nobody' 用户身份执行任意代码。该漏洞影响 SMA 200、210、400、410 及 500v 等型号设备的 10.2.0.8-37sv、10.2.1.1-19sv、10.2.1.2-24sv 及更早版本的固件，CVSS v3.1 评分为 9.8，危害等级严重。攻击者无需任何凭据即可在网络层远程利用该漏洞获取设备控制权限，对使用该设备作为企业远程接入网关的组织造成严重安全风险。"
published = "2021-12-08T10:15:07.750"
remediation = "立即将SonicWall SMA 200/210/400/410/500v设备固件升级至10.2.1.7-20sv或更高版本，漏洞存在于10.2.0.8-37sv、10.2.1.1-19sv、10.2.1.2-24sv及更早版本的Apache httpd mod_cgi模块环境变量处理中。升级前请登录设备管理界面下载对应型号的最新固件，通过系统>固件上传完成更新。若暂时无法升级，应在边界防火墙限制对SMA100 HTTPS管理端口的访问，仅允许可信管理网段连接，降低被远程利用的风险。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "SonicWall SMA100 堆栈缓冲区溢出漏洞"
updated = "2026-06-17T03:33:11.327"

