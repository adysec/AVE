[basic]
description = "NetcPlus BrowseGate 2.80 在解析 HTTP 请求时对 Authorization 和 Referer 等 MIME 头未实施长度校验，未经身份认证的远程攻击者可通过向目标发送超长的 HTTP 请求头触发缓冲区溢出或内存耗尽，导致拒绝服务，并可能进一步执行任意系统命令。该漏洞影响运行 BrowseGate 2.80 的服务器，攻击者无需任何凭据，仅需网络可达即可构造恶意请求完成攻击利用。"
published = "2000-12-19T05:00:00.000"
remediation = "由于 NetcPlus BrowseGate 2.80 是一款极旧的过时软件且厂商已停止维护，建议立即停止使用该软件，并迁移至 Nginx、Apache 或 Squid 等现代且受支持的 HTTP 代理软件，以根除 MIME 头部溢出漏洞。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "NetcPlus BrowseGate 2.80 拒绝服务与远程命令执行漏洞"
updated = "2026-06-16T21:52:44.407"

