[basic]
description = "IPSwitch IMail 的 Web Calendaring 服务（iwebcal）在处理 HTTP POST 请求时存在不完整请求处理缺陷，当攻击者发送一个缺少 Content-Length 字段的 HTTP POST 请求时，服务无法正确解析请求边界，导致服务进程崩溃，造成拒绝服务。该漏洞影响 IPSwitch IMail 6.x 及 7.0.x 版本，攻击者无需认证即可远程触发，CVSS 评分 5.0，危害等级中等。目前厂商已发布更新版本修复此问题。"
published = "2002-10-04T04:00:00Z"
remediation = "升级 IPSwitch IMail 至 7.2 或更高版本（该版本已修复 iwebcal 服务对畸形 HTTP POST 请求的处理逻辑）。如无法升级，可在防火墙或主机层面限制对 TCP 8484 端口的访问，仅允许可信 IP 连接；若业务不需要 Web 日历功能，可直接禁用 iwebcal 服务以消除攻击面。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "IPSwitch IMail Web Calendaring 服务拒绝服务漏洞"
updated = "2026-06-16T21:58:41Z"

