[basic]
description = "Microsoft WebTV for Windows 系统中的 annclist.exe 组件存在拒绝服务漏洞。远程攻击者无需身份认证，可通过向目标主机的 22701 至 22705 端口发送特制的大尺寸畸形 UDP 数据包，导致 annclist.exe 进程崩溃，造成服务不可用。该漏洞影响 WebTV for Windows 98/ME 版本，攻击复杂度低，无需用户交互，但仅造成可用性影响。Exploit-DB 上已有公开的 PoC 利用代码。"
published = "2000-11-14T05:00:00Z"
remediation = "该漏洞影响已停止支持的 Microsoft WebTV for Windows，官方不再提供安全更新。建议在防火墙或主机层面阻止对 UDP 端口 22701-22705 的入站访问；如无需使用 WebTV 功能，建议直接卸载该组件以彻底消除风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft WebTV for Windows annclist.exe UDP报文拒绝服务漏洞"
updated = "2026-06-16T21:52:33Z"

