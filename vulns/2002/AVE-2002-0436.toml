[basic]
description = 'PHP 4.3.0 之前版本的 IMAP 扩展中存在拒绝服务漏洞，该漏洞位于 imap_header 函数处理邮件头部的过程中。远程攻击者可通过向目标服务器发送一封包含大量 "To" 收件人地址的恶意电子邮件，触发 rfc822_write_address 函数在处理超长地址列表时发生内部错误，导致 PHP 进程崩溃或资源耗尽，造成拒绝服务。攻击无需身份认证，仅需通过网络发送特制邮件即可触发，影响 PHP 4.3.0 之前所有版本。'
published = "2002-12-31T05:00:00Z"
remediation = "升级 PHP 至 4.3.0 或更高版本，该版本修复了 imap_header 函数在处理大量收件人地址时触发 rfc822_write_address 错误导致拒绝服务的问题。如无法立即升级，可在邮件服务器端限制单封邮件的收件人数量（如每封不超过 100 个 To 地址），并禁用 PHP IMAP 扩展中不必要的邮件解析功能作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "PHP IMAP imap_header 函数拒绝服务漏洞"
updated = "2026-06-16T22:00:51Z"

