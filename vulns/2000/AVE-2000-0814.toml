[basic]
description = "IBM AIX 4.3.x 及更早版本的 enq 命令存在缓冲区溢出漏洞。本地用户可通过向 enq 命令传递过长的 -M 参数触发缓冲区溢出，从而在目标系统上执行任意命令。该漏洞影响 IBM AIX 4.3.x 及更早所有版本，由于 enq 命令通常需要本地访问权限，攻击者需具备目标系统的本地用户身份才能利用此漏洞。IBM AIX 是 IBM 公司的 Unix 操作系统，广泛应用于企业级服务器环境。CVSS 评分为 7.2，危害等级为高危。"
published = "2001-01-09T05:00:00.000"
remediation = "升级 IBM AIX 到 v6.1 TL7 SP3 (6100-07-03-1233) 或更高版本，或 v7.1 TL4（7100-04-02-1187）及以上版本。本地安全补丁 {5573-021} 修复了 enq 缓冲区溢出漏洞。若无法立即升级，请在 /etc/security/user 配置文件中锁定 enq 命令权限，对 -M 参数进行长度限制，并禁止 root 执行 enq 命令。紧急缓解措施：禁用所有本地用户对 enq 命令的使用，将 enq 二进制文件移至安全位置，在内核级别阻止对 enq 命令的访问。GitHub 安全公告证实此漏洞已在上述服务包中修复。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "IBM AIX 4.x 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:11.570"

