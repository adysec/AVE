[basic]
description = "Google Chrome 在 20.0.1132.43 之前版本存在 use-after-free（释放后重用）内存错误引用漏洞。当浏览器渲染使用了 CSS 计数器（Cascading Style Sheets counters）特性的文档时，由于对计数器布局的处理不当，可能在已释放的内存区域执行引用操作，导致内存损坏。未经身份认证的远程攻击者可通过诱导用户访问包含特制 CSS 计数器的恶意网页来触发该漏洞，造成浏览器崩溃（拒绝服务）或在特定条件下实现任意代码执行。该漏洞影响所有使用受影响版本 Chrome 的用户，攻击条件简单，仅需用户访问恶意网页即可触发。Google 已在 Chrome 20.0.1132.43 版本中修复此问题，建议用户升级至最新版本。"
published = "2012-06-27T10:18:38.540"
remediation = '建议将 Google Chrome 升级至 20.0.1132.43 或更高版本以修复此漏洞，可通过 Chrome 菜单"关于 Google Chrome"自动检测并安装更新。如无法立即升级，可临时避免访问使用 CSS counters 特性的未知网页，并禁用 Chrome 的 JavaScript 执行功能作为缓解措施，直至完成版本升级。'
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome CSS计数器布局释放后重用漏洞"
updated = "2026-06-16T23:42:09.420"

