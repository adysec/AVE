[basic]
description = "WordPress twitter-plugin 插件（版本低于 2.55）存在跨站脚本漏洞（XSS）。该漏洞源于插件对用户输入的数据缺乏充分的过滤与转义处理，攻击者可利用该漏洞在页面中注入恶意脚本。未经身份认证的远程攻击者可通过诱使用户点击特制链接触发漏洞，导致恶意脚本在用户浏览器中执行，从而窃取 Cookie、会话令牌或重定向用户至恶意站点。该漏洞影响所有使用 twitter-plugin 插件且版本低于 2.55 的 WordPress 站点，CVSS 评分 6.1，危害等级中危。"
published = "2019-08-12T16:15:13Z"
remediation = "立即将 WordPress twitter-plugin 插件升级至 2.55 或更高版本。如无法立即更新，可在 WordPress 后台禁用该插件，并启用 WordPress 自带的 Jetpack 或第三方社交媒体分享插件作为替代。同时建议在 Web 应用防火墙（WAF）层面添加针对 XSS 的过滤规则，对用户输入内容进行 HTML 实体编码转义。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Twitter插件跨站脚本漏洞"
updated = "2026-06-17T01:12:59Z"

