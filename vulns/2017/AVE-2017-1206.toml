[basic]
description = "Microsoft Office 在处理内存中的对象时存在远程代码执行漏洞，该漏洞源于 Office 对复合标识符（Composite Moniker）对象的错误处理。攻击者可通过构造特制的 Office 文档（如 PPT、DOC 等），通过邮件或网页等方式诱使用户打开恶意文件触发漏洞，成功利用可在当前用户上下文中执行任意代码。该漏洞影响 Microsoft Office 2007/2010/2013/2016 等多个版本，已被实际在野利用，属于高危漏洞。Microsoft 已在 2017 年 7 月安全更新中发布补丁修复。"
published = "2017-07-11T21:29:01Z"
remediation = "立即安装 Microsoft 2017 年 7 月安全更新 (MS17-022)，对应知识库文章 KB3213654，可通过 Windows Update 或 Microsoft 更新目录获取。对于无法立即打补丁的系统，可在 Office 受信任设置中禁用所有 ActiveX 控件，并启用受保护视图以降低通过邮件附件传播的风险。同时建议在邮件网关层面拦截包含 OLE 对象的可疑文档附件。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Office 远程代码执行漏洞"
updated = "2026-06-17T01:26:35Z"

