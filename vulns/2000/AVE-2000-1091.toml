[basic]
description = "Windows 2000 Professional 系统的 Telnet 服务存在拒绝服务漏洞，该服务未能正确终止不完整的连接尝试。未经身份认证的远程攻击者可向目标系统的 Telnet 服务端口发起 TCP 连接，但在建立连接后不发送任何输入数据即可触发漏洞，导致服务无法正常处理后续连接请求，最终造成拒绝服务。该漏洞影响 Windows 2000 Professional 的 Telnet 服务组件，攻击者只需从网络可达位置向目标 23 端口发起连接并保持静默，即可使服务陷入等待状态，消耗系统资源并拒绝合法用户的远程管理访问。"
published = "2001-01-09T05:00:00.000"
remediation = "Microsoft 已针对此漏洞发布安全补丁，受影响系统应安装 Windows 2000 Service Pack 2 或更高版本累积更新以修复 Telnet 服务连接处理缺陷。如无法立即安装补丁，可暂时禁用 Telnet 服务以缓解风险：依次打开「控制面板」→「管理工具」→「服务」，找到「Telnet」服务并将启动类型设为「已禁用」。建议优先将系统升级至受支持的 Windows 版本，以彻底消除安全风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows 2000 Telnet Service 拒绝服务漏洞"
updated = "2026-06-16T21:53:10.223"

