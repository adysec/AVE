[basic]
description = "Apache Tomcat 3.1 存在路径信息泄露漏洞。当远程攻击者向服务器请求一个不存在的 URL 或 JSP 文件时，Tomcat 会生成包含服务器物理文件路径信息的错误消息并返回给攻击者。该漏洞无需身份验证即可触发，攻击者仅需构造针对不存在资源的 HTTP 请求即可获取服务器目录结构等敏感信息。泄露的物理路径可被攻击者用于进一步渗透测试和定向攻击。该漏洞影响运行 Apache 下的 Jakarta Tomcat 3.1 版本，CVSS 评分为 6.4（MEDIUM）。"
published = "2000-10-20T04:00:00Z"
remediation = "建议立即将 Apache Tomcat 3.1 升级至 3.2 或更高版本以修复该路径信息泄露漏洞，由于 Tomcat 3.x 已停止维护，生产环境应迁移至当前受支持的稳定版本（如 Tomcat 9.0.x/11.0.x）。若暂时无法升级，可在 web.xml 中通过 error-page 元素配置自定义 404 错误页面，将不存在的 JSP 请求重定向至通用错误页，避免在响应中暴露物理路径；同时在防火墙或反向代理层过滤对不存在 JSP 文件的异常请求，限制错误信息对外泄露。"
score = 6.4
severity = "MEDIUM"
sources = ["avd"]
title = "Apache Tomcat 3.1 路径信息泄露漏洞"
updated = "2026-06-16T21:52:25Z"

