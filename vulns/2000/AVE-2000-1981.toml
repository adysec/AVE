[basic]
description = "ypserv 是 Mandrake Linux 系统中 NIS（网络信息服务）的守护进程。Mandrake Linux 7.1 及更早版本中的 ypserv 在未使用 vsyslog() 函数编译时存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向 ypserv 发送特制网络请求触发该缓冲区溢出，从而在目标系统上以 root 权限执行任意代码，完全控制受影响的 Linux 系统。该漏洞也可能影响其他未使用 vsyslog() 函数编译的 Linux 发行版。"
published = "2000-12-11T05:00:00.000"
remediation = "升级到支持 vsyslog() 函数的 Mandrake Linux 8+ 版本，或应用官方 ypserv 安全补丁（如CVE-2000-1042修复程序），并确保 NIS 服务仅监听本地网络接口，同时禁用不必要的 NIS 映射查询功能。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Mandrake Linux ypserv 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:02.053"

