[basic]
description = "OpenOffice.org（OOo）Impress模块中的simpress.bin组件在处理PowerPoint文档中的字典属性项整数值时存在整数截断错误，导致堆缓冲区溢出。远程攻击者可通过向受影响系统发送特制的PowerPoint文档触发此漏洞，成功利用可在目标系统上执行任意代码或导致应用程序崩溃。该漏洞影响OpenOffice.org 2.x及3.x系列3.3之前的所有版本，攻击无需身份认证，仅需诱导用户打开恶意文件即可触发。"
published = "2010-08-25T20:00:17Z"
remediation = "立即升级到 OpenOffice.org 3.3 或更高版本，该版本已修复 Impress 模块中 simpress.bin 处理 PowerPoint 文档字典属性项时的整数截断堆缓冲区溢出漏洞。如无法升级，建议迁移至 Apache OpenOffice 4.x 或 LibreOffice 3.3.4 以上版本，并避免打开来源不明的 PowerPoint 文件。Linux 用户可通过系统包管理器安装安全更新（如 Ubuntu 执行 apt-get update && apt-get upgrade openoffice.org）。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apache OpenOffice Impress PowerPoint文档解析堆缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T23:21:47Z"

