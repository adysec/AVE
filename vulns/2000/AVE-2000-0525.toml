[basic]
description = "Roxen WebServer 2.0.69 之前版本存在空字节注入漏洞，远程攻击者通过在 URL 中插入空字符（%00）可绕过访问限制，列出目录内容并读取服务器端源代码文件。该漏洞利用方式简单，无需身份认证即可远程触发，影响服务器的机密性。厂商已发布新版本修复此问题。"
published = "2000-07-21T04:00:00.000"
remediation = "立即升级 Roxen WebServer 至 2.0.69 或更高版本，该版本已修复空字节（%00）URL 解析漏洞。如无法升级，可在 Web 服务器前端部署反向代理（如 Nginx/Apache），配置规则拦截包含 %00 空字节的请求 URL，或使用 WAF 规则过滤含有空字节编码的路径访问请求。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Roxen WebServer 空字符请求文件目录泄露漏洞"
updated = "2026-06-16T21:52:14.087"

