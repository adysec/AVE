[basic]
description = "AOL Instant Messenger（AIM）4.8.2790 版本存在目录遍历漏洞。远程攻击者可构造包含特殊路径的恶意链接，通过在链接的 href 属性中指定本地或远程可执行程序的路径，诱骗用户点击后即可触发该程序执行。该漏洞影响 AOL Instant Messenger 4.8.2790 版本，攻击者无需身份认证即可利用，但需要用户交互（点击恶意链接），可导致在受影响系统上执行任意程序，造成信息泄露或进一步入侵。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 AOL Instant Messenger 至 4.8.2790 以外的任意版本，或彻底卸载 AIM 并迁移至替代即时通讯软件。由于 AIM 已于 2017 年停止服务且不再接收安全更新，建议立即从系统中移除该程序。临时缓解措施：在防火墙或系统 Hosts 文件中禁用 AIM 相关 URL 协议处理，阻止 aim:// 链接的自动执行。"
score = 2.6
severity = "LOW"
sources = ["exploitdb"]
title = "AOL Instant Messenger 本地文件执行漏洞"
updated = "2026-06-16T22:00:06Z"

