[basic]
description = "Solaris 7.0/8 的 Sunsolve CD 软件包中的 sscd_suncourier.pl CGI 脚本存在命令注入漏洞。该漏洞的原理是脚本在处理 email address 参数时未能对输入进行严格过滤，导致远程攻击者可以通过在参数中构造 shell 元字符（如分号、反引号等）来注入恶意命令。攻击条件为目标系统部署了受影响的 CGI 脚本且可从网络访问。一旦利用成功，攻击者可以在目标服务器上执行任意系统命令，从而导致系统完全被接管，危害等级极高。"
published = "2002-07-26T04:00:00Z"
remediation = "建议直接删除 Solaris 7.0/8 Sunsolve CD 中过时的 SSCD_SunCourier.pl CGI 脚本以消除风险。若必须保留，应修改脚本代码，对 email 参数使用正则表达式进行严格过滤，禁止包含 shell 元字符（如 ; | & ` $），或将调用 shell 的函数替换为不经过 shell 解析的 API。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Sun Solaris 7.0/8 Sunsolve CD SSCD_SunCourier.pl CGI 脚本任意命令执行漏洞"
updated = "2026-06-16T21:57:26Z"

