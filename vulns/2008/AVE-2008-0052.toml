[basic]
description = "Adobe Flash Player 10.x 10.0.12.36 之前版本及 9.x 9.0.151.0 之前版本存在多个未指明的输入验证错误漏洞。远程攻击者可通过未知攻击向量利用这些输入验证缺陷执行任意代码。该漏洞影响广泛使用的 Flash Player 版本，攻击者需诱使用户访问包含恶意 Flash 内容的网页，在用户浏览器中执行任意指令，从而完全控制受影响系统。CVSS 评分 9.3，危害等级严重。"
published = "2008-11-17T22:21:26Z"
remediation = "立即升级 Adobe Flash Player 至 9.0.151.0（9.x 版本）或 10.0.12.36（10.x 版本）及以上版本，或安装 Adobe 安全公告 APSB08-22 中发布的补丁。如无法立即升级，可在浏览器中禁用 Flash 插件、启用点击播放（Click-to-Play）功能，并限制使用 Flash 访问不受信任的网站作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 远程代码执行漏洞"
updated = "2026-06-16T22:58:37Z"

