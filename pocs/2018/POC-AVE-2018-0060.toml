[info]
author = "ave"
description = "CVE-2018-11759 PoC verification request targeting Apache Struts S2-052 RCE"
id = "POC-AVE-2018-0060"
name = "PoC for AVE-2018-0060"
severity = "medium"
tags = ["ave-2018-0060"]
vuln_id = [
    "AVE-2018-0060",
    "CVE-2018-11759",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/struts/hello.action"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Hello"]
