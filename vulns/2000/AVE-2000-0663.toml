[basic]
description = "NetcPlus BrowseGate 2.80 存在缓冲区溢出漏洞，远程未授权攻击者可通过发送包含超长 Authorization 或 Referer MIME 头的 HTTP 请求触发缓冲区溢出，导致拒绝服务并可能执行任意代码。该漏洞影响 NetcPlus BrowseGate 2.80 版本，攻击者无需认证即可远程发起攻击，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），属于拒绝服务类漏洞，攻击复杂度低，仅影响可用性。"
published = "2000-12-19T05:00:00.000"
remediation = "立即升级 BrowseGate 至 v2.80.001 版本，该版本已由 NetCPlus 官方修复 HTTP Authorization 与 Referer 长头导致的拒绝服务漏洞。如暂时无法升级，可在 BrowseGate 代理配置中限制 HTTP 请求头大小，或在防火墙层面拦截异常的 long Authorization/Referer 头报文作为临时缓解措施。同时监控 brwgate.exe 服务状态，发现异常崩溃时重启服务恢复功能。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "NetcPlus BrowseGate 2.80 缓冲区溢出导致拒绝服务和任意代码执行漏洞"
updated = "2026-06-16T21:52:44.407"

