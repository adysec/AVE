[basic]
description = "GNU Binutils 的 objdump 工具中 disassemble_bytes 函数存在栈缓冲区溢出漏洞。攻击者可通过向目标系统提供特制的二进制文件，触发对 buf 参数的越界写入操作，导致栈缓冲区溢出，可能造成程序崩溃或敏感信息泄露。该漏洞影响 GNU Binutils 2.43 及之前版本，攻击复杂度较高，远程攻击需诱导用户处理恶意构造的文件。升级至 2.44 版本可修复此漏洞。"
published = "2025-01-29T20:15:35Z"
remediation = "升级 GNU Binutils 到 2.44 版本（包含修复补丁 baac6c221e9d69335bf41366a1c7d87d8ab2f893），或在旧版本上通过禁用 aarch64 架构的 '-z gcs=implicit' 参数作为临时缓解措施。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "GNU Binutils objdump 堆栈缓冲区溢出漏洞"
updated = "2026-06-17T08:27:14Z"

