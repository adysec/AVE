[basic]
description = "Opera浏览器11.50之前的版本中，DOM实现存在未指定的漏洞。远程攻击者可通过构造包含恶意内容的网页（如live.com示例），触发浏览器DOM处理异常，导致应用程序崩溃并造成拒绝服务。该漏洞无需身份认证即可利用，攻击者只需诱导受害者访问特制网页即可触发，影响所有使用受影响版本Opera浏览器的用户。"
published = "2011-07-01T10:55:02Z"
remediation = "建议立即将 Opera 浏览器升级至 11.50 或更高版本，该版本已修复 DOM 实现中的拒绝服务漏洞。升级方式：通过 Opera 菜单栏选择「帮助」>「检查更新」自动更新，或访问 opera.com/download 下载 11.50+ 完整安装包，Windows、Mac 及 Linux 平台均有对应版本。如短期内无法升级，应避免访问不可信来源的网页，可在浏览器设置中禁用 JavaScript 作为临时缓解措施，限制对受损 DOM 处理的触发路径，降低崩溃风险。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera Web Browser DOM 实现远程拒绝服务漏洞"
updated = "2026-06-16T23:31:40Z"

