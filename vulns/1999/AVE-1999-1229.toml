[basic]
description = "BNBSurvey 组件中的 survey.cgi 脚本存在远程命令注入漏洞。该脚本在处理用户提交的参数时未对输入中的 shell 元字符（如管道符、分号等）进行过滤和校验，而是将可控数据直接拼接到系统命令中执行，攻击者无需身份认证即可利用。远程攻击者只需向目标 Web 服务器发送包含恶意元字符的特制 HTTP 请求，即可在服务器上以 Web 服务进程权限执行任意系统命令，进而读取敏感文件、修改网站内容、上传恶意程序，甚至获取服务器控制权。该漏洞攻击条件宽松、利用方式简单，在当时广泛部署 BNBSurvey 的站点上影响面极大，CVSS 评分为 10.0，危害等级为严重。建议使用该组件的用户立即升级补丁或彻底禁用相关 CGI 脚本。"
published = "1998-12-03T05:00:00Z"
remediation = "tags.<value>该漏洞源于 BNBSurvey 的 survey.cgi 脚本未对用户提交的参数进行过滤，将输入直接拼入 shell 命令，攻击者通过注入 |、&、;、$、` 等元字符实现远程任意命令执行。建议立即从 Web 目录中删除或停用该 CGI 脚本，若业务必需，应升级到修复了输入校验问题的官方版本或改用受支持的同类调查软件；无法升级时，需重写脚本对参数做白名单校验、剥离所有 shell 元字符，并配置 Web 服务器仅允许可信目录执行 CGI、以最小权限账户运行服务。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "BNB BNBSurvey 远程代码执行漏洞"
updated = "2026-06-16T21:49:21Z"

