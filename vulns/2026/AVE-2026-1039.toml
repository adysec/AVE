[basic]
description = "tags format.<value>Apple App Store Server Python 库的 SignedDataVerifier 组件在启用在线证书吊销检查时，其 OCSP 验证逻辑未对响应的时间有效性窗口进行校验。具体而言，`_ChainVerifier.check_ocsp_status()` 方法仅验证 OCSP 响应的签名和 CertID 匹配，但未检查 producedAt、thisUpdate 或 nextUpdate 等 freshness 字段。攻击者可重放已过期的 OCSP GOOD 响应，使库继续将已被吊销的证书视为有效。该漏洞影响 app-store-server-library 0.2.0 至 3.1.1 版本，远程攻击者无需认证即可利用，通过发送携带过期 OCSP GOOD 响应的 JWS 对象绕过证书吊销检查。"
published = "2026-01-01T00:00:00Z"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
