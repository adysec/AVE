[basic]
description = "Windows Internet Connection Sharing (ICS) 组件存在越界读取漏洞，CVSS 评分 6.5，危害等级中危。该漏洞源于 ICS 服务在处理特制网络数据包时未正确验证输入边界，导致越界内存读取。位于同一相邻网络的未经身份认证的远程攻击者可通过向目标系统发送特制的网络数据包触发该漏洞，导致 ICS 服务崩溃并拒绝服务。该漏洞影响 Windows 10、Windows 11 及 Windows Server 多个版本，Microsoft 已在 2025 年 2 月安全更新中修复。"
published = "2025-02-11T18:15:32Z"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新 KB5051974（OS Builds 19044.5487 / 19045.5487），可通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。该更新修复了 Windows 10 21H2 和 22H2 中 Internet 连接共享 (ICS) 组件的拒绝服务漏洞。如无法立即打补丁，可在网络层面限制对 ICS 服务的邻接网络访问，或禁用 Internet 连接共享功能作为临时缓解措施。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows Internet Connection Sharing (ICS) 拒绝服务漏洞"
updated = "2026-06-17T08:42:47Z"

