[basic]
description = "JSmol2WP WordPress 插件 1.07 版本中的 jsmol.php 文件存在反射型跨站脚本漏洞，攻击者可通过 data 参数注入恶意 Web 脚本或 HTML 代码。当用户访问特制链接时，恶意脚本将在浏览器中执行，导致敏感信息泄露、会话劫持等危害。攻击无需身份认证，但需要用户交互点击链接，CVSS 评分 6.1，危害等级中危。"
published = "2018-12-25T21:29:00Z"
remediation = "立即在 WordPress 后台停用并删除 JSmol2WP 插件 1.07 版本，该插件已因安全漏洞被官方关闭且不再维护。如必须使用 JSmol2WP 功能，可改用其他活跃维护的分子结构可视化替代插件（如 MolView 或 ChemDoodle），并在 Web 应用防火墙（WAF）中添加规则过滤 jsmol.php 的 data 参数中的恶意 HTML/JavaScript 负载作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress JSmol2WP Plugin 跨站脚本漏洞"
updated = "2026-06-17T01:52:53Z"

