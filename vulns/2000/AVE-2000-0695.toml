[basic]
description = "Cisco Virtual Central Office 4000（VCO/4K）版本 5.1.3 在 SNMP MIB 中使用弱加密算法存储用户名和密码，攻击者若获取到 SNMP 社区名（community name），即可利用该弱加密机制破解密码，从而获取设备的合法用户凭据并提升权限。该漏洞影响 Cisco VCO/4K 5.1.3 版本，CVSS 评分 7.5，危害等级为高。由于 SNMP 社区名在配置不当的网络环境中容易泄露，攻击者可通过远程访问 SNMP 接口进行凭据提取和破解，进而控制受影响的网络设备。"
published = "2000-12-19T05:00:00.000"
remediation = "立即升级 Cisco VCO/4K 到修复该漏洞的后续版本。如无法升级，应采取以下缓解措施：（1）修改 SNMP community string 为强随机字符串，避免使用默认值；（2）在路由器和防火墙上配置 ACL，仅允许可信管理 IP 访问 SNMP 端口（UDP 161）；（3）启用 SNMPv3 并配置认证和加密（authPriv 模式），替代不安全的 SNMPv2c；（4）限制对 SNMP MIB 敏感对象的访问权限，关闭不必要的 MIB 子树。建议同时联系 Cisco TAC 获取针对 VCO/4K 的补丁或迁移方案。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Cisco Virtual Central Office 4000 SNMP MIB 弱加密存储用户名密码致信息泄露漏洞"
updated = "2026-06-16T21:52:50.940"

