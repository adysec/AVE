[basic]
description = "标签之间。<value>Atlassian Jira的ConfigurePortalPages.jspa接口中的searchOwnerUserName参数存在跨站脚本(XSS)漏洞。远程攻击者无需身份验证即可向该参数注入任意HTML或JavaScript代码，当管理员或用户访问包含恶意payload的页面时，脚本将在受害者浏览器中执行。该漏洞影响Jira 7.13.3之前版本以及8.0.0至8.1.1之前的版本，攻击者可利用此漏洞窃取用户会话凭证、篡改页面内容或执行未经授权的操作。CVSS v3评分6.1，危害等级中等。Atlassian已在7.13.3和8.1.1版本中修复此漏洞，建议用户升级至安全版本。"
published = "2019-05-22T18:29:00.787"
remediation = "升级 Jira Server/Data Center 至 7.13.3（7.x 分支）或 8.1.1（8.x 分支）及以上版本，官方补丁已修复 ConfigurePortalPages.jspa 中 searchOwnerUserName 参数的跨站脚本漏洞。如无法立即升级，可在反向代理或 WAF 层对该参数进行输入过滤，并对 ConfigurePortalPages.jspa 实施访问控制，限制仅可信来源可访问，以降低被注入恶意脚本的风险。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Atlassian Jira 跨站脚本漏洞"
updated = "2026-06-17T02:35:06.380"

