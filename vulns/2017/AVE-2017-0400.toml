[basic]
description = "Cisco IOS 软件 12.4 至 15.6 版本的通用工业协议（CIP）功能实现存在多个安全漏洞。该漏洞源于设备对特制 CIP 数据包的解析不当，未经身份认证的远程攻击者可通过向目标设备发送特制的 CIP 数据包触发此漏洞，成功利用可导致设备重载，造成拒绝服务（DoS）条件。该漏洞影响大量 Cisco IOS 设备，CVSS 评分 7.5，危害等级高。目前 Cisco 已发布安全公告修复此漏洞。"
published = "2017-09-29T01:34:48Z"
remediation = "立即登录 Cisco.com 使用 Cisco IOS Software Checker 工具查询当前 IOS 版本对应的修复版本，将设备升级至包含 CSCvc43709 修复的 Cisco IOS 版本（如 15.7+ 或对应 Train 的最新安全修复版）。由于该漏洞已在野被积极利用，升级前可在网络边界 ACL 中拒绝目的 UDP 端口 2222 和 44818 的入站流量作为临时缓解措施，但最终必须完成版本升级。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS Common Industrial Protocol CIP 数据包解析拒绝服务漏洞"
updated = "2026-06-17T01:02:56Z"

