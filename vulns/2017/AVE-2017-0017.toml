[basic]
description = "jqueryFileTree 是一个基于 jQuery 的文件树浏览组件，其 2.1.5 及更早版本存在目录遍历漏洞。由于程序未对用户传入的路径参数进行充分过滤和校验，远程攻击者无需身份认证即可通过构造包含 `../` 等特殊字符的请求，遍历服务器上的任意目录并读取敏感文件（如配置文件、数据库凭证等），导致敏感信息泄露。该漏洞影响广泛，CVSS 评分 7.5，危害等级高。建议升级至最新版本或对路径参数进行严格的白名单校验。"
published = "2017-11-17T18:29:00Z"
remediation = "升级至 2.1.5 以上版本（如存在），但该项目已归档不再维护，建议手动修补 PHP 连接器脚本：在 jqueryFileTree.php 中获取 dir 参数后，使用 realpath() 解析绝对路径，并校验其是否以允许的根目录前缀开头，拒绝包含 ../ 的路径。同时限制连接器脚本仅可通过内部网络访问，或在 Web 服务器（如 Nginx/Apache）中添加访问控制规则，仅允许特定来源 IP 请求该脚本。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "jqueryFileTree 目录遍历漏洞"
updated = "2026-06-17T00:58:51Z"

