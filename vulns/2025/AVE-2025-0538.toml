[basic]
description = "PgBouncer 1.25.1 之前版本的 auth_query 连接处理器中存在不受信任的搜索路径漏洞 (CWE-426)。未经身份认证的远程攻击者可在 PostgreSQL 认证阶段，通过在 StartupMessage 中注入恶意的 search_path 参数，劫持 auth_query 查询的搜索路径，从而执行任意 SQL 语句。该漏洞影响 PgBouncer 1.25.1 之前的所有版本，CVSS 3.1 评分 7.5 (HIGH)，攻击向量为网络 (AV:N)，攻击复杂度高 (AC:H)，需要低权限 (PR:L)，无需用户交互 (UI:N)，可导致机密性、完整性、可用性均受到高度影响 (C:H/I:H/A:H)。攻击者需具备数据库连接权限，通过构造恶意的 search_path 参数劫持搜索路径，在认证阶段注入并执行任意 SQL 代码，可能导致数据库数据泄露、篡改或破坏。PgBouncer 1.25.1 已修复此漏洞，建议尽快升级至 1.25.1 或更高版本。"
published = "2025-12-03T19:15:55Z"
remediation = "建议立即升级 PgBouncer 至 1.25.1 或更高版本（官方已发布修复版本）。若暂时无法升级，可通过以下方式临时缓解：1) 在 pgbouncer.ini 中禁用 auth_query（设为空或注释掉），改用 auth_file 或 auth_type=trust/md5/scram-sha-256 等不依赖 auth_query 的认证方式；2) 在防火墙层面限制 PgBouncer 监听端口（默认 6432）仅允许受信任客户端 IP 访问；3) 确保 PostgreSQL 端口（默认 5432）不直接暴露在公网。升级后请重启 PgBouncer 服务使配置生效。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "PgBouncer auth_query 搜索路径不受信任漏洞"
updated = "2026-06-17T08:33:00Z"

