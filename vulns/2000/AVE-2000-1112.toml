[basic]
description = "Recourse ManTrap 1.6 版本存在本地安全绕过漏洞，攻击者在获取系统 root 权限后，可利用 crash、fsdb 等系统调试工具读取 /dev/mem 内存设备及原始磁盘设备，从而识别正在运行的 ManTrap 蜜罐进程或篡改系统中的任意数据文件。该漏洞影响部署了 Recourse ManTrap 1.6 的安全监控环境，攻击条件为攻击者已具备目标主机的 root 访问权限。成功利用该漏洞可绕过 ManTrap 的安全隔离机制，导致攻击者获取敏感进程信息或破坏关键数据文件完整性，CVSS 评分为 4.6，危害等级为中等。"
published = "2001-01-09T05:00:00Z"
remediation = "Recourse Technologies 已发布 Mantrap 2.0 修复此漏洞，建议立即联系厂商升级至该版本。但 'crash' 工具漏洞在 2.0 版本中仍未修复，攻击者仍可通过该工具识别 cage 外进程并获取 PID 以终止 cage 进程。临时缓解措施包括：在 cage 内移除或限制 crash 和 fsdb 工具的使用权限，通过访问控制列表限制对 /dev/mem 和原始磁盘设备的读取，将蜜罐系统严格隔离于生产网络并配置防火墙规则，同时启用远程日志记录并监控 rti_??? 进程的异常终止事件。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Recourse ManTrap 本地信息泄露与任意文件修改漏洞"
updated = "2026-06-16T21:53:15Z"

