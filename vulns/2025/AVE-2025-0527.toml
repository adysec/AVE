[basic]
description = "这是针对QEMU虚拟机中e1000网络设备的一个栈缓冲区溢出漏洞。问题源于虚拟机在环回模式下处理短数据帧时，设备接收代码仍然可以调用e1000_receive_iov()函数，导致缓冲区发生溢出并可能导致主机端QEMU进程崩溃进而引发拒绝服务攻击。该漏洞影响在环回模式下运行QEMU KVM的Linux主机系统，CVSS评分6.2，危害等级为中危。攻击者可以通过向目标系统发送特制的IPv4/IPv6短数据帧触发此漏洞，实现对目标虚拟机进程的控制和破坏。"
published = "2025-10-31T22:15:32Z"
remediation = "将 QEMU 升级至上游修复版本：v8.2.2、v10.0.7、v10.1.3 或 v10.2.0 及以上（该漏洞自 v8.1.0-rc0 引入）。各发行版请安装对应安全更新：Ubuntu 升级至 1:8.2.2+ds-0ubuntu1.13 或 1:10.1.0+ds-5ubuntu2.4；Debian bookworm/trixie 升级至 1:7.2+dfsg-7+deb12u18 或 1:10.0.7+ds-0+deb13u1 及以上版本。如暂无补丁可临时缓解：在 libvirt XML 或 QEMU 启动参数中将虚拟网卡类型从 e1000 替换为 virtio-net，或禁用不依赖于 e1000 的 guest 环回网络功能，以消除触发栈溢出的代码路径。"
score = 6.2
severity = "MEDIUM"
sources = ["msrc"]
title = "QEMU e1000 网络设备 堆栈缓冲区溢出漏洞"
updated = "2026-06-30T00:16:51Z"

