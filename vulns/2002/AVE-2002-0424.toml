[basic]
description = "Linux 系统下的 SimpleInit 2.0.2 存在文件描述符泄露漏洞。SimpleInit 在创建子进程前未关闭已打开的读写 FIFO 文件描述符，导致子进程可通过该描述符向父进程 SimpleInit 发送恶意指令，从而以 root 权限执行任意程序。攻击者需拥有本地访问权限，利用难度较低，可完全控制目标系统。该漏洞影响 Richard Gooch SimpleInit 2.0.2 及可能更早版本。"
published = "2002-08-12T04:00:00Z"
remediation = "立即升级 simpleinit 至 2.0.3 或更高版本，该版本在 fork 子进程前关闭 /dev/initctl 的读写文件描述符。如无法升级，可手动修改 simpleinit 源码，在 fork() 调用前添加 close(3) 关闭 FIFO 描述符后重新编译。对于仍使用 simpleinit 的旧系统，建议迁移至 systemd 或 sysvinit 等现代 init 系统以彻底消除此风险。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Richard Gooch SimpleInit 文件描述符未关闭导致本地权限提升漏洞"
updated = "2026-06-16T21:58:05Z"

