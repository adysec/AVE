[basic]
description = "OpenSSH SSH客户端2.3.0之前版本未正确禁用X11转发或agent转发功能，恶意SSH服务器可利用此漏洞获取客户端X11显示访问权限并窥探X11事件，或获取ssh-agent的访问权限，导致敏感信息泄露。攻击者只需搭建恶意SSH服务器并诱导用户连接即可实施攻击，无需任何认证，CVSS评分7.5，危害等级高。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 OpenSSH 客户端至 2.3.0 或更高版本，该版本默认禁用 X11 转发和 agent 转发。如无法升级，连接不可信 SSH 服务器时使用 `-x` 参数禁用 X11 转发、使用 `-a` 参数禁用 agent 转发，或在 `~/.ssh/config` 中设置 `ForwardX11 no` 和 `ForwardAgent no` 作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "OpenSSH SSH客户端 X11转发与agent转发权限访问漏洞"
updated = "2026-06-16T21:53:18Z"

