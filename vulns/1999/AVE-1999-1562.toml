[basic]
description = "Windows 2000 系统 IIS 5.0 所加载的 Internet Printing ISAPI 扩展（.printer）存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标服务器发送超长打印请求，触发该扩展中的缓冲区溢出，从而在系统层面以 root 权限执行任意代码。该漏洞影响运行 Windows 2000 SP1/SP2 并启用了 IIS 5.0 的服务器，攻击者仅需通过网络访问服务器的打印扩展接口即可发起利用，无需任何凭据。由于 CVSS 评分为满分 10.0，危害等级为严重，Microsoft 已在后续安全更新中修复此漏洞。"
published = "2001-06-27T04:00:00Z"
remediation = '安装 Microsoft 安全更新 Q296576（该修复已包含于 Windows 2000 Service Pack 2），可通过 Microsoft 下载中心或 Windows Update 自动获取 MS01-023 补丁并安装。如短期内无法安装补丁，应立即通过组策略禁用 Internet Printing：依次展开计算机配置→管理模板→打印机，将"基于 Web 的打印"设置为"已禁用"，并在 Internet 信息服务管理器中移除 .printer ISAPI 扩展映射；同时如非必要可在防火墙层面阻断 80/443 端口对该服务器的访问，以限制攻击面。'
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Microsoft Windows 2000 ISAPI 扩展缓冲区溢出漏洞"
updated = "2026-06-16T21:53:56Z"

