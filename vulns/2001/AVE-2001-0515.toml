[basic]
description = "Linux 内核 2.2.19 之前版本的 getsockopt 和 setsockopt 系统调用存在符号错误（signedness error）漏洞。本地攻击者可通过向受影响系统调用传递特制的负值参数触发该漏洞，导致内核内存访问异常，进而引发系统崩溃或拒绝服务。该漏洞需要攻击者拥有本地用户权限，无法远程利用，影响范围包括早期 Linux 内核版本。"
published = "2001-04-17T04:00:00Z"
remediation = "立即升级 Linux 内核至 2.2.19 或更高版本。Red Hat 用户可安装 RHSA-2001:047 提供的更新内核 RPM 包；Debian 用户应升级到 DSA-047 中指定的内核版本。如无法立即升级，可通过限制本地用户登录、禁用受影响系统调用（getsockopt/setsockopt）的 setuid 程序执行作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Linux Kernel getsockopt 和 setsockopt 符号错误拒绝服务漏洞"
updated = "2026-06-16T21:56:11Z"

