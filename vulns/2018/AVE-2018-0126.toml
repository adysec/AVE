[basic]
description = "JCK Editor 6.4.4 组件 for Joomla! 中存在 SQL 注入漏洞，位于 jtreelink/dialogs/links.php 文件的 parent 参数。未经身份认证的远程攻击者可通过向目标系统发送特制的 HTTP 请求，在 parent 参数中注入恶意 SQL 语句，从而实现对后端数据库的任意查询与操作，导致敏感数据泄露、数据篡改甚至完全控制服务器。该漏洞无需任何权限或用户交互即可利用，危害严重。"
published = "2018-09-20T14:29:00Z"
remediation = "立即卸载或禁用 JCK Editor 6.4.4 组件，该组件已停止维护且无官方补丁。如必须使用编辑器功能，替换为其他受支持的 Joomla 编辑器扩展（如 JCE、TinyMCE）。临时缓解措施：在 Web 应用防火墙（WAF）或 .htaccess 中添加规则，拦截对 /plugins/editors/jckeditor/plugins/jtreelink/dialogs/links.php 的请求，并对 parent 参数进行严格的输入过滤，禁止包含 UNION、SELECT 等 SQL 关键字。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Joomla JCK Editor 6.4.4 SQL注入漏洞"
updated = "2026-06-17T01:45:36Z"

