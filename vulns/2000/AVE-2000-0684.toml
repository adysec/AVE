[basic]
description = "` tags.<value>Samba 2.0.7 中的 Web 管理工具 SWAT 在安装时将 cgi.log 日志文件设置为全局可读权限，本地攻击者可利用该漏洞读取日志文件中记录的用户名、密码等敏感信息，导致信息泄露。攻击条件为拥有系统本地访问权限，无需身份认证即可读取该文件，危害等级较低。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 Samba 至 2.0.8 或更高版本。如无法升级，手动修改 cgi.log 文件权限为 600（仅属主可读写）：chmod 600 /path/to/samba/swat/cgi.log；同时限制 SWAT 仅允许受信任管理员访问，可通过防火墙或 hosts allow 配置实现。"
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "Samba SWAT 日志文件信息泄露漏洞"
updated = "2026-06-16T21:52:48.367"

