[basic]
description = "Mozilla Firefox 4.x至11.0、Thunderbird 5.0至11.0及SeaMonkey 2.9之前版本的浏览器引擎中存在内存破坏漏洞，该漏洞源于jsval.h及js::array_shift函数在处理JavaScript数组操作时存在内存安全缺陷。远程攻击者可诱使用户访问特制网页，触发断言失败及内存破坏，导致浏览器崩溃或实现任意代码执行。攻击无需用户交互，仅需用户通过受影响浏览器访问恶意构造的页面即可触发，危害严重。"
published = "2012-04-25T10:10:17Z"
remediation = "升级 Mozilla Firefox 至 12.0 及以上版本、Thunderbird 至 12.0 及以上版本、SeaMonkey 至 2.9 及以上版本。对于无法立即升级的系统，可禁用 JavaScript（在 Firefox 中设置 about:config → javascript.enabled = false）作为临时缓解措施，但会严重影响正常功能，建议优先完成版本升级。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 浏览器引擎内存破坏漏洞"
updated = "2026-06-16T23:37:21Z"

