[info]
author = "ave"
description = "检测 BEA WebLogic 5.1.x PageCompileServlet 未授权访问漏洞，通过直接调用 Servlet 编译执行任意 JHTML 文件"
id = "POC-AVE-2000-0537"
name = "BEA WebLogic PageCompileServlet 远程代码执行漏洞 PoC"
severity = "critical"
tags = ["ave-2000-0537"]
vuln_id = [
    "CVE-2000-0685",
    "AVE-2000-0537",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/servlets/PageCompileServlet"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "PageCompileServlet",
    "Compile",
    "jhtml",
]
