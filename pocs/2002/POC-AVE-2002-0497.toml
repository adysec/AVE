[info]
author = "AVE"
description = "检测 Microsoft Internet Explorer 4.0-6.0 XML Datasource Applet 文件泄露漏洞。远程攻击者可通过构造恶意网页，利用 com.ms.xml.dso.XMLDSO.class 小程序将 base URL 指向本地系统，绕过同源策略读取任意文件。"
id = "POC-AVE-2002-0497"
name = "Microsoft Internet Explorer XML Datasource Applet File Disclosure PoC"
severity = "medium"
tags = ["ave-2002-0497"]
vuln_id = [
    "CVE-2002-0976",
    "AVE-2002-0497",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["com.ms.xml.dso.XMLDSO.class"]
