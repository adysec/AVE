[basic]
description = "D-Link DNS-320 网络存储设备 login_mgr.cgi 脚本存在操作系统命令注入漏洞，未经身份认证的远程攻击者可通过向该脚本发送特制的 HTTP 请求，在目标设备上以 root 权限执行任意系统命令。该漏洞影响 DNS-320 至 2.05.B10 版本，CVSS 评分 9.8，危害等级严重。攻击者无需任何认证即可利用，可完全控制设备，导致数据泄露、设备被控或作为跳板发起进一步攻击。厂商至今未发布官方修复补丁。"
published = "2019-09-16T12:15:10Z"
remediation = "D-Link DNS-320 已停产（End-of-Life），D-Link 不再提供修复该漏洞的固件更新。CISA 强制要求立即将该设备从网络中断开并停止使用。如无法立即替换，可在防火墙层面将设备管理端口（80/443/8080）仅限内网可信 IP 访问，并禁止设备对外发起出站连接，作为临时缓解措施。建议尽快更换为仍在厂商支持周期内的 NAS 设备。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "D-Link DNS-320 操作系统命令注入漏洞"
updated = "2026-06-17T02:21:36Z"

