[basic]
description = "VMware vCenter Server 的 Analytics 服务（客户体验改进计划组件）存在任意文件上传漏洞。未经身份认证的远程攻击者若可通过 443 端口访问 vCenter Server，即可向 Analytics 服务上传特制的 JSP webshell 文件至服务器 inetpub 目录，最终在 vCenter Server 上执行任意代码，获取服务器控制权。该漏洞影响 VMware vCenter Server 6.5/6.7/7.0 等多个版本，CVSS 评分 9.8，危害等级严重。攻击者只需拥有目标服务器的网络可达性，即可利用该漏洞实现未授权远程代码执行。"
published = "2021-09-23T12:15:07Z"
remediation = "立即升级 vCenter Server 到 7.0 U2c 或更高版本（vSphere 7.0），或升级到 6.7 U3o（vSphere 6.7 Virtual Appliance）。如暂时无法升级，可通过编辑 VCSA 上的文本文件实施 KB85717 临时缓解措施，或使用 VAMI 防火墙限制 443 端口的网络访问，仅允许受信任的管理员 IP 连接。同时检查 vCenter Server 是否已在野外被利用，并审计系统是否存在入侵迹象。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "VMware vCenter Server Analytics 服务任意文件上传漏洞"
updated = "2026-06-17T03:36:32Z"

