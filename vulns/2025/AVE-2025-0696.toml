[basic]
description = "Windows Telephony Service（电话服务）存在堆缓冲区溢出漏洞（CWE-122），远程攻击者可通过向目标系统发送特制的RPC请求触发该漏洞，导致远程代码执行。攻击无需身份认证但需要用户交互（如诱导用户点击恶意链接），成功利用后可获取系统权限，完全控制受影响主机。该漏洞影响多个Windows版本，CVSS评分8.8，危害等级高。Microsoft已在2025年1月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:36Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新（对应 KB5049984 适用于 Windows 11 24H2、KB5050021 适用于 Windows 10 22H2、KB5049981 适用于 Windows Server 2022 等版本），或通过 Windows Update 自动获取更新。如无法立即打补丁，可在防火墙或组策略中限制 TAPI 服务的网络访问，并禁用不必要的电话服务（TapiSrv）作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:42:51Z"

