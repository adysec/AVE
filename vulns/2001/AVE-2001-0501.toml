[basic]
description = "Pragma InterAccess 4.0 build 5 中的 telnet95.exe 组件存在缓冲区溢出漏洞，远程攻击者可通过向 TCP 端口 23 发送大量特制字符触发该漏洞，导致 telnetd 服务进程崩溃，造成拒绝服务。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响运行 Pragma InterAccess TelnetD Server 4.0 的系统。"
published = "2001-06-06T04:00:00Z"
remediation = "该产品 Pragma InterAccess 4.0 已停止维护且无官方补丁。建议立即卸载该软件，迁移至支持 Windows 10/11 的现代 Telnet 服务器（如 Microsoft 内置 Telnet 服务或第三方开源实现）。临时缓解措施：在防火墙或路由器上限制外部 IP 对端口 23 的访问，仅允许受信任的管理地址连接。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Pragma Systems InterAccess TelnetD Server 4.0 拒绝服务漏洞"
updated = "2026-06-16T21:55:55Z"

