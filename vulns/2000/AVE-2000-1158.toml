[basic]
description = 'Phorum 3.0.7 存在目录遍历漏洞，远程管理员可通过在 Master Settings 管理功能的默认 .langfile 名称字段中插入 ".."（点点）序列，绕过路径限制读取服务器上的任意文件。该漏洞源于程序未对用户输入的文件名进行充分的路径过滤，攻击者利用管理后台权限即可读取系统敏感文件，导致信息泄露。影响 Phorum 3.0.7 版本。'
published = "2000-12-31T05:00:00Z"
remediation = '升级 Phorum 至 3.0.8 或更高版本，该版本已修复 Master Settings 管理功能中 default.langfile 字段的路径遍历问题。如无法升级，应在 Web 服务器层面限制 admin.php3 的访问来源 IP，仅允许受信任的管理员 IP 访问后台管理页面，同时在应用层对 langfile 参数做严格的路径合法性校验，禁止包含 "../" 等目录跳转序列。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Phorum 3.0.7 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:53:25Z"

