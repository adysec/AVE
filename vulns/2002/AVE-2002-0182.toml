[basic]
description = "pam_ldap PAM LDAP 模块（版本 144 之前）的日志记录功能中存在格式化字符串漏洞。远程攻击者可通过在配置文件名称中注入特制的格式化字符串，在调用日志函数时触发该漏洞，导致任意代码执行。该漏洞影响使用 pam_ldap 模块进行 LDAP 认证的 Linux/Unix 系统，CVSS 评分 7.5，危害等级高。攻击者无需身份认证即可远程利用，可获取系统控制权或造成拒绝服务。"
published = "2002-05-29T04:00:00Z"
remediation = "升级 pam_ldap 模块至 144 或更高版本。Red Hat 用户安装 RHSA-2002:084/141/175/180 更新包；Mandrake 用户安装 MDKSA-2002:075 更新；Caldera OpenLinux 用户安装 CSSA-2002-041.0.txt 补丁。如无法升级，限制对 LDAP 认证服务的配置文件写入权限作为临时缓解。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "pam_ldap PAM LDAP 模块格式字符串远程代码执行漏洞"
updated = "2026-06-16T21:57:18Z"

