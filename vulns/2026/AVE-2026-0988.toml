[basic]
description = "Better Auth 存在会话残留漏洞，当配置了 `secondaryStorage`（如 Redis 等外部会话缓存）且 `session.storeSessionInDatabase` 为 `false` 时，admin 插件的 `removeUser`、anonymous 插件的自删除端点及 after-link 钩子、`@better-auth/scim` 的 `DELETE /scim/v2/Users/:userId` 四个用户删除接口在调用 `deleteUser` 前未先调用 `deleteSessions` 清除会话，导致已删除用户的会话数据仍保留在二级存储中，攻击者可在会话 TTL（默认 7 天）内继续使用原有会话 cookie 进行认证，获取已删除用户的读写权限。该漏洞无需认证即可利用，影响使用 Better Auth 且配置了二级会话存储的所有应用。"
published = "2026-01-01T00:00:00Z"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Better Auth 用户删除后会话未失效漏洞"
updated = "2026-01-01T00:00:00Z"

