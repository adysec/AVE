[basic]
description = "HPE Integrated Lights-Out 4（iLO 4）远程管理固件存在认证绕过与代码执行漏洞，版本低于 2.53 均受影响。未经身份认证的远程攻击者可利用该漏洞绕过登录认证，直接添加新的管理员账户并获取 iLO 管理接口的完全控制权限，进而执行任意代码、修改系统配置或窃取敏感信息。攻击无需用户交互，CVSS 评分 10.0，危害等级严重。HP 已在 iLO 4 固件 2.53 版本中修复此漏洞。"
published = "2018-02-15T22:29:04Z"
remediation = "立即将 HPE Integrated Lights-out 4 (iLO 4) 固件升级至 2.53 或更高版本。升级路径：登录 iLO Web 界面 → 固件更新 → 上传 2.53 及以上版本固件文件。如无法立即升级，可在网络层面限制对 iLO 管理端口（默认 443/80）的访问，仅允许受信任的管理 IP 段连接，并禁用 iLO 的远程控制台功能作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["nuclei"]
title = "HPE Integrated Lights-out 4 权限提升和远程代码执行漏洞"
updated = "2026-06-17T01:03:28Z"

