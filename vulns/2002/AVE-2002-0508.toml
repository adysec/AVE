[basic]
description = "Summit Computer Networks Lil' HTTP Server 2.2 中集成的 PowerBASIC urlcount.cgi 脚本存在跨站脚本（XSS）漏洞。远程攻击者可通过向 urlcount.cgi 发送包含恶意脚本的特制请求，当服务器 REPORT 功能输出原始请求内容时，由于未对用户输入进行有效过滤，导致恶意脚本在浏览器中执行。攻击者可借此窃取用户会话 Cookie、钓鱼或执行其他恶意操作，影响 Lil' HTTP Server 2.2 及更早版本。该漏洞无需身份认证即可利用，CVSS 评分 7.5，危害等级高。"
published = "2002-10-04T04:00:00.000"
remediation = "立即停止使用已停止维护的 Summit Computer Networks Lil' HTTP Server，迁移至活跃维护的 Web 服务器（如 Apache HTTP Server 或 Nginx）。临时缓解措施：删除或重命名服务器上的 urlcount.cgi 脚本文件，或在 Web 服务器配置中限制对 urlcount.cgi 的访问权限（如仅允许本地 IP 访问），同时禁用 REPORT 功能以防止 XSS 攻击。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Summit Computer Networks Lil' HTTP Server 跨站脚本漏洞"
updated = "2026-06-16T21:58:33.400"

