[basic]
description = "RealJukebox 2（1.0.2.340 及 1.0.2.379 版本）与 RealOne Player Gold（6.0.10.505 版本）在处理 RFS 皮肤文件时存在缓冲区溢出漏洞。由于 skin.ini 配置文件中的 CONTROLnImage 参数未对输入长度进行有效边界检查，远程攻击者可构造包含超长值的恶意皮肤文件，通过网页或 HTML 邮件等方式诱使用户打开，触发栈缓冲区溢出，覆盖返回地址并劫持程序执行流程，最终在用户权限下执行任意代码。CVSS 评分 7.5，危害等级高。"
published = "2002-10-04T04:00:00Z"
remediation = "立即卸载 RealJukebox 2（1.0.2.340/1.0.2.379）及 RealOne Player Gold（6.0.10.505），这些产品已停止技术支持多年，不存在官方补丁。作为替代方案，升级到 RealNetworks 后续安全版本（如 RealPlayer SP 或更高版本），并在浏览器中禁用 RealPlayer 插件，同时配置防火墙阻止对外发起异常连接。若业务必须使用，建议在隔离沙箱环境中运行，且不要打开来源不明的 .rfs 皮肤文件。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Real Networks RealJukebox 和 RealOne Player 缓冲区溢出漏洞"
updated = "2026-06-16T21:58:34Z"

