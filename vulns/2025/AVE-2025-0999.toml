[basic]
description = "Linux 内核 Xilinx UART PS（cdns_uart）串口驱动中存在不当锁定漏洞，可在特定竞态条件下引发系统死锁。具体而言，cdns_uart_isr 中断处理函数与 cdns_uart_console_write 控制台写函数之间存在循环锁依赖：CPU 0 在中断上下文中持有 port lock 并调用 printk，而 CPU 1 在执行 console_write 时尝试获取同一把锁。此前的修复尝试通过在 port->sysrq 未设置时不加锁来规避，但若 cdns_uart_console_write 在 sysrq 标志位设置前运行，仍会尝试获取 port lock，从而导致死锁。具有本地低权限访问权限的攻击者可通过触发 SysRq 功能或制造串口中断与控制台输出的竞态条件，使系统进入不可用状态，造成拒绝服务（DoS）影响。该漏洞影响使用 Xilinx Zynq MPSoC UART 控制器且运行受影响 Linux 内核版本的嵌入式设备及服务器系统，CVSS 评分为 5.5。"
published = "2025-02-27T20:16:04Z"
remediation = "建议将 Linux 内核升级至已修复的稳定版本：6.1.129、6.6.78、6.12.14 或更高版本。具体而言，运行 5.15 系列内核的系统应升级到 6.1.129 或更新版本，6.6 系列升级到 6.6.78 或更新版本，6.12 系列升级到 6.12.14 或更新版本。Debian 11 用户可通过 apt 安装 DLA-4102-1 安全更新（linux-6.1 包），Ubuntu 22.04 LTS 用户应应用 USN-7653-1 内核补丁。作为临时缓解措施，可在 /etc/sysctl.conf 中添加 kernel.sysrq=0 并执行 sysctl -p 禁用 SysRq 功能，防止触发循环锁依赖导致死锁。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 Xilinx UARTPS 串口驱动 improper locking 死锁漏洞"
updated = "2026-06-17T08:44:22Z"

