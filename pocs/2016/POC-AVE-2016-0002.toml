[info]
author = "ave"
description = "验证目标是否存在 Microsoft Silverlight 5 负偏移量对象头解析漏洞，通过构造特制页面触发解码阶段内存破坏"
id = "POC-AVE-2016-0002"
name = "CVE-2016-0034 PoC"
severity = "high"
tags = ["ave-2016-0002"]
vuln_id = [
    "CVE-2016-0034",
    "AVE-2016-0002",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/silverlight/exploit.html"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
