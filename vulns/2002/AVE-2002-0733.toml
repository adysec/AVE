[basic]
description = "PHP 4.2.3 的 phpinfo 函数存在跨站脚本（XSS）漏洞。远程攻击者无需身份认证，可通过向使用 phpinfo 函数的页面（如 soinfo.php）的查询字符串中注入任意 Web 脚本或 HTML 代码来利用此漏洞。当用户访问包含恶意构造 URL 时，攻击者可在受害者浏览器中执行任意脚本，从而窃取会话 Cookie、重定向用户或进行其他基于客户端的攻击。该漏洞影响所有使用受影响版本 PHP 且公开了 phpinfo 页面的 Web 应用程序。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 PHP 至 4.3.0 或更高版本（或迁移至 PHP 5.x），并在 php.ini 中设置 disable_functions=phpinfo 禁用 phpinfo 函数；生产环境必须删除或严格限制访问 phpinfo.php 等探针文件，配置 Web 服务器拦截包含脚本标签的查询字符串请求。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "PHP 4 phpinfo 跨站脚本漏洞"
updated = "2026-06-16T22:00:22Z"

