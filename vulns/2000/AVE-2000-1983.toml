[basic]
description = "SuSE Linux 发行版中的 ypbind-mt（多线程 NIS/黄页绑定守护进程）存在格式化字符串漏洞。该漏洞源于程序在处理客户端请求时，将未经净化的用户可控数据直接作为格式化字符串参数传递给 printf 系列函数，攻击者可通过注入 %n、%x 等格式化字符串序列覆写内存数据并劫持程序执行流程。未经身份认证的远程攻击者仅需向目标主机的 ypbind-mt 服务发送特制网络数据包即可触发该漏洞，进而在系统权限上下文中执行任意代码，最终获得 root 权限并完全控制受影响主机。该漏洞影响 SuSE 6.2 及其他部分 Linux 操作系统版本，CVSS 评分 10.0，危害等级为严重。"
published = "2000-12-11T05:00:00.000"
remediation = "建议升级 SuSE Linux 到 7.0 及以上版本，或安装 SuSE 官方发布的 ypbind-mt 修补补丁（ftp://ftp.suse.com/pub/suse/i386/update/6.2/rpm/ypbind-mt-1.14-13.i386.rpm）。若无法立即升级，请停用 ypbind 服务（/etc/init.d/ypbind stop 并 chkconfig ypbind off），并在防火墙层面封锁 111/TCP/UDP 端口（rpcbind/portmap）防止远程攻击。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "SuSE ypbind-mt 格式化字符串漏洞"
updated = "2026-06-16T21:53:02.340"

