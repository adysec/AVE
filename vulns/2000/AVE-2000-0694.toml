[basic]
description = "tags.<value>Evolvable Shambala Server 4.5 存在拒绝服务漏洞，未经身份认证的远程攻击者可通过向目标服务器发送并立即关闭 TCP 连接的方式触发该漏洞，导致服务器服务中断或崩溃。该漏洞影响运行 Shambala Server 4.5 的系统，CVSS 评分为 5.0，危害等级为中等。攻击无需复杂条件，仅需网络可达即可利用。"
published = "2000-12-19T05:00:00.000"
remediation = "建议立即升级 Evolvable Shambala Server 至 4.5 以上版本（建议升级至最新版本），或在防火墙层面限制非信任 IP 访问 Shambala Server 服务端口（默认 80/443），并在防火墙层面启用连接频率限制（如 iptables -A INPUT -p tcp --dport 80 -m connlimit --connlimit-above 50 -j DROP）作为临时缓解措施，同时联系厂商 Evolvable 获取官方补丁包进行升级。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Evolvable Shambala Server 4.5 远程拒绝服务漏洞"
updated = "2026-06-16T21:52:50.670"

