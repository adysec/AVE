[basic]
description = "Nokia IP440 防火墙与 VPN 设备的 Voyager Web 管理服务器存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标设备的 Web 管理界面发送构造的超长 URL 请求触发该漏洞，利用低复杂度即可实现拒绝服务攻击，并在特定条件下可能进一步执行任意系统命令，导致设备完全失陷。该漏洞影响采用 Voyager Web 管理界面的相关固件版本。"
published = "2001-06-02T04:00:00Z"
remediation = "由于该产品已停止支持且官方未提供补丁，建议将 Nokia IP440 防火墙迁移至受支持的替代平台（如 Nokia 后续产品或主流下一代防火墙），从根本上消除漏洞。如短期内无法替换，应立即通过防火墙规则或接口 ACL 限制 Voyager Web 管理服务器的访问源，仅允许来自受信任内网地址的 HTTPS 访问，禁止任何外部网络直接访问 Web 管理端口，并启用 SSH 或串口控制台作为唯一管理通道，临时降低被远程利用的风险。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Nokia IP440 Voyager Web 管理服务器缓冲区溢出漏洞"
updated = "2026-06-16T21:54:03Z"

