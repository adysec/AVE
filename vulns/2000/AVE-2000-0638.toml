[basic]
description = "Tridia DoubleVision 3.07.00 版本包含一个 dvtermtype 函数的缓冲区溢出漏洞。当用户输入过长的终端类型参数时，该漏洞允许本地攻击者溢出缓冲区并执行任意代码，最终获得系统root权限。该漏洞通常存在于软件的终端类型解析模块，输入长度未经过有效验证。攻击者可构造特殊格式的长终端类型字符串触发缓冲区溢出，利用溢出后的内存区域执行自身命令以获取 Elevated 权限。这一漏洞影响 Tridia DoubleVision 3.0 系列应用程序在各种 Unix/Linux 系统上的用户，可能导致整个系统安全受到威胁。该漏洞最早于 2000 年 11 月被公开，属于互联网安全初期的经典缓冲区溢出漏洞。攻击者需要本地访问权限才能利用该漏洞进行攻击，并且一旦成功利用即可获得对主机系统的完全控制权。"
published = "2000-11-14T05:00:00.000"
remediation = "建议立即卸载 Tridia DoubleVision 3.0 7.00 并迁移至现代远程管理工具（如 TeamViewer、AnyDesk 或 SSH/RDP）。若必须保留，请限制本地用户对 dvtermtype 可执行文件的执行权限（chmod 700），并限制终端类型参数长度。建议迁移至受支持的远程管理方案。禁用或卸载该过时软件是唯一彻底修复方案。厂商 Tridia 已停止维护该产品，无官方补丁可用。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Tridia DoubleVision 3.07.00 缓冲区溢出本地权限提升漏洞"
updated = "2026-06-16T21:52:37.840"

