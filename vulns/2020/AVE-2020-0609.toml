[basic]
description = "Sophos XG Firewall 17.x 至 v17.5 MR12 版本中存在缓冲区溢出漏洞，该漏洞源于 HTTP/S Bookmarks 功能在处理客户端无代理访问请求时未对输入数据大小进行正确检查。未经身份认证的远程攻击者可通过向受影响设备发送特制的 HTTP 请求触发缓冲区溢出，导致远程代码执行，从而完全控制目标防火墙设备。该漏洞 CVSS 评分 9.8，危害等级严重，影响所有运行 v17.x 版本的 Sophos XG Firewall。Sophos 已发布热修复补丁 HF062020.1 修复此漏洞。"
published = "2020-06-29T18:15:12Z"
remediation = "Sophos已发布热补丁HF062020.1，所有运行v17.x版本的XG Firewall应立即安装该热修复补丁。如无法立即打补丁，可在防火墙管理界面配置访问控制策略，仅允许可信IP地址访问HTTPS 4444端口，并禁用不必要的HTTP/S Bookmarks无客户端访问功能作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Sophos XG Firewall 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-17T02:55:59Z"

