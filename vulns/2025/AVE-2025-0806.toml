[basic]
description = "Windows 部署服务（WDS）存在拒绝服务漏洞，其根本原因在于 WDS 组件对特制请求的验证机制不完善。本地低权限攻击者需诱导高权限用户执行特定操作，在满足高攻击复杂度条件下，可利用该漏洞触发目标系统服务崩溃或资源耗尽，导致拒绝服务。该漏洞影响 Windows Server 多个版本，CVSS 评分 6.0，危害等级中等。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:33.497"
remediation = "建议立即安装 Microsoft 2025 年 2 月安全更新 (KB5051974)，或通过 Windows Update 自动更新。如无法立即打补丁，可在不需要时禁用 Windows 部署服务 (WDS)：以管理员身份运行 `dism /online /Disable-Feature /FeatureName:WindowsDeploymentServices` 作为临时缓解措施。"
score = 6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 部署服务拒绝服务漏洞"
updated = "2026-06-17T08:43:09.710"

