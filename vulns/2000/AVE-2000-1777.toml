[basic]
description = "Netscape Messaging Server 4.15 Patch 2 的 IMAP 服务组件在处理 LIST 命令时存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向目标服务器的 IMAP 端口发送特制的超长 LIST 命令触发栈溢出，导致任意代码执行。该漏洞 CVSS 评分 10.0，可完全控制受影响系统，危害严重。建议升级至不受影响的版本或应用厂商补丁。"
published = "2000-12-19T05:00:00.000"
remediation = "Netscape Messaging Server 4.15 Patch 2 已停止维护，官方不再提供安全更新。建议立即迁移至受支持的邮件服务器（如 Exchange Server、Postfix 或 Dovecot）。在迁移完成前，可在防火墙上限制 IMAP 端口（143/TCP）仅允许受信任 IP 访问，并禁用不必要的 IMAP 服务以降低攻击面。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Netscape Messaging Server IMAP 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:51.743"

