[basic]
description = "Adobe ColdFusion 2023.18、2025.6 及更早版本存在路径遍历漏洞（CWE-22）。未经身份认证的远程攻击者无需用户交互即可利用该漏洞，通过构造特制的路径参数绕过目录限制，读取服务器上的任意敏感文件（如配置文件、密码文件等），导致敏感信息泄露。该漏洞攻击复杂度低，影响范围广，CVSS 评分 8.6，危害等级高。Adobe 已发布安全更新修复此漏洞。"
published = "2026-04-14T22:16:29Z"
remediation = "立即升级 Adobe ColdFusion 至 2023 Update 19 或 2025 Update 7 及以上版本，可通过 ColdFusion 管理后台的 Administrator > System Information > Updates 检查并安装最新安全更新。如无法立即升级，在 Web 服务器或 WAF 层配置规则，限制对 `..`、`%2e%2e` 等路径遍历特征的 URL 请求，并禁用不必要的文件访问接口作为临时缓解措施。"
score = 8.6
severity = "HIGH"
sources = ["zdi"]
title = "Adobe ColdFusion 路径遍历任意文件读取漏洞"
updated = "2026-07-25T11:10:00Z"

