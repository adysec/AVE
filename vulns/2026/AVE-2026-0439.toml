[basic]
description = "aws-smithy-http-server 是 Amazon 基于 Rust 语言开发的 HTTP 服务端框架，其默认 serve() 路径缺少连接超时、头部读取超时以及并发连接数上限的限制。未经身份认证的远程攻击者可通过建立大量连接并发送不完整的 HTTP 请求（Slowloris 攻击方式），持续占用服务器套接字和任务资源，导致服务端资源耗尽，造成拒绝服务。该漏洞影响 aws-smithy-http-server ≤ 0.66.4 版本，CVSS 评分 8.7，危害等级高。官方已在 0.66.5 版本中修复此问题。"
published = "2026-07-23T19:16:53Z"
remediation = '立即将 aws-smithy-http-server 升级至 0.66.5 或更高版本。该版本已添加连接超时、header 读取超时及并发连接数上限。如使用 AWS SDK for Rust 或基于 smithy-rs 的自定义服务，请更新 Cargo.toml 中依赖声明至 `aws-smithy-http-server = ">=0.66.5"` 后重新编译部署。无其他有效缓解措施。'
score = 8.7
severity = "HIGH"
sources = ["ghsa"]
title = "Amazon aws-smithy-http-server 慢速拒绝服务漏洞"
updated = "2026-07-23T20:17:07Z"

