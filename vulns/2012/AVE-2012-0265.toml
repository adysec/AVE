[basic]
description = "tags.<value>Apple Safari 6.0 之前版本所使用的 WebKit 渲染引擎存在内存破坏漏洞。远程攻击者可通过构造恶意网站向目标用户发起攻击，当用户使用受影响版本的 Safari 浏览器访问该网站时，浏览器在解析网页内容过程中触发内存损坏，可导致应用程序崩溃或远程执行任意代码。该漏洞影响 macOS 和 iOS 平台上所有使用受影响 WebKit 版本的 Safari 浏览器，攻击者无需事先获取目标系统凭据，只需诱骗用户打开恶意网页即可完成利用，CVSS 评分 9.3，危害等级严重。"
published = "2012-07-25T20:55:01Z"
remediation = "升级 Apple Safari 浏览器至 6.0 版本（需 OS X Lion v10.7.4 或更高版本），或安装 Apple 2012 年 7 月 25 日发布的安全更新（APPLE-SA-2012-07-25-1）。iOS 用户应升级至 iOS 6.0。临时缓解措施：避免访问未知或恶意网站，不点击可疑链接。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:31Z"

