[basic]
description = "Cisco CBOS 2.4.1 及更早版本的路由器在处理 ICMP Echo（ping）数据包时存在拒绝服务漏洞。未经身份认证的远程攻击者可通过向目标设备发送超大的 ICMP Echo 数据包触发该漏洞，导致路由器崩溃或重启，进而造成网络服务中断。该漏洞影响运行 Cisco CBOS 2.4.1 及以前版本的 Cisco 600 系列路由器，利用条件宽松，无需认证即可远程触发，CVSS 评分为 5.0，危害等级为中等。"
published = "2001-02-16T05:00:00.000"
remediation = "升级 Cisco CBOS 2.4.1 到 2.4.3 或更高版本固件，获取完整的 ICMP 处理修复。立即下载并安装 Cisco 发布的 2001 年 8 月安全更新。对于无法立即更新的设备，建议在路由器上配置入站 ACL 过滤，阻止超过 100 字节的 ICMP Echo 数据包进入受影响的接口，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "思科 CBOS ICMP Echo 拒绝服务漏洞"
updated = "2026-06-16T21:53:34.493"

