[basic]
description = "Namazu 2.0.7 及更早版本的 namazu.cgi 中存在跨站脚本漏洞，远程攻击者可通过 lang 参数注入恶意 JavaScript 脚本，当其他用户访问时该脚本在浏览器中执行，导致敏感信息泄露、会话劫持等危害。攻击无需身份认证，仅需诱使用户访问特制 URL 即可触发。该漏洞影响 Namazu 2.0.7 及此前版本，CVSS 评分 7.5，危害等级高。"
published = "2001-11-25T05:00:00Z"
remediation = "升级 Namazu 至 2.0.8 或更高版本（该版本修复了 namazu.cgi 中 lang 参数的 XSS 问题）。如无法升级，在 Web 服务器层对 lang 参数进行严格的输入过滤和输出编码，阻止包含 <script> 等 HTML 标签的请求。由于 Namazu 已停止维护，建议迁移至其他活跃的全文检索引擎。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Namazu namazu.cgi 跨站脚本漏洞"
updated = "2026-06-16T21:56:05Z"

