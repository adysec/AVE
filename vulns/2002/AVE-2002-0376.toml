[basic]
description = "PHP 4.1.2 至 4.3.0 版本中的 wordwrap 函数存在堆缓冲区溢出漏洞。该函数在处理超长字符串时未正确检查边界，导致堆内存越界写入。远程攻击者无需身份认证即可通过向该函数传递特制参数触发溢出，造成拒绝服务或执行任意代码。该漏洞影响广泛部署的 PHP 环境，危害等级高。"
published = "2003-01-17T05:00:00Z"
remediation = '升级 PHP 至 4.3.0 或更高版本，该漏洞在 PHP 4.3.0 中已修复。如无法立即升级，可在 php.ini 中禁用 wordwrap 函数（disable_functions = "wordwrap"）作为临时缓解措施，或限制用户输入传递给 wordwrap 的字符串长度。'
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "PHP wordwrap 函数堆缓冲区溢出漏洞"
updated = "2026-06-16T21:59:15Z"

