[basic]
description = "tags.<value>rclone 在 1.75.0 版本之前存在 FTP 命令参数 CRLF 注入漏洞。当使用手动配置且省略 Ctl/CrLf 的自定义编码时，FTP 文件名中的原始回车换行符可在路径被插入行式 FTP 控制信道前被恢复，而依赖库 github.com/jlaffaye/ftp 通过 textproto.Conn.Cmd 格式化参数时不会拒绝 CR 或 LF 字符，导致攻击者通过构造包含 CRLF 注入序列的文件名，在受害者将文件同步或复制到更高权限 FTP 目标时注入独立的已认证 FTP 命令。默认编码包含 Ctl 防护因此不受影响，利用前提是攻击者能在源命名空间创建文件、受害者使用自定义编码配置且向更高权限的 FTP 目标执行复制或同步操作，攻击复杂度较高。成功利用可导致以 FTP 账户权限执行任意文件系统命令，已演示可删除其他文件路径，造成完整性与可用性损失。"
published = "2026-08-05T21:16:58Z"
remediation = "立即将 rclone 升级至 1.75.0 或更高版本，该版本已在 backend/ftp/ftp.go 中对 FTP 命令参数进行 CR/LF 过滤。如无法立即升级，请将 FTP 编码配置恢复为默认值（包含 Ctl 保护），避免使用 Slash 等会恢复原始换行符的自定义编码方案，并在防火墙或访问控制层面限制低权限源目录向高权限 FTP 目标执行复制/同步操作。"
score = 6.4
severity = "MEDIUM"
sources = ["ghsa"]
title = "rclone FTP 命令参数 CRLF 注入漏洞"
updated = "2026-08-06T22:18:29Z"

