[info]
author = "ave"
description = "验证 AIX 4.2/4.3 版本 netstat 命令的 -Zi 选项访问控制缺陷，检测是否允许本地用户清除网络接口统计信息。"
id = "POC-AVE-2000-0644"
name = "CVE-2000-0873 PoC"
severity = "low"
tags = ["ave-2000-0644"]
vuln_id = [
    "CVE-2000-0873",
    "AVE-2000-0644",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
