[basic]
description = "Google Chrome 密码模块存在不当实现漏洞，版本 prior to 143.0.7499.41 受影响。攻击者需通过物理接触设备，利用密码模块的实现缺陷绕过身份验证机制，从而获取未经授权的访问权限。该漏洞危害等级较低，攻击条件要求攻击者具备设备的物理访问权限，无需网络交互或特权提升即可触发。"
published = "2025-12-02T19:15:48Z"
remediation = "升级 Google Chrome 至 143.0.7499.41 或更高版本以修复密码模块认证绕过漏洞。Fedora/RHEL 用户可更新 chromium 包至 143.0.7499.146（参考 rhbz#2423482）。在无法立即升级的情况下，限制物理访问权限并启用操作系统登录认证作为临时缓解措施。"
score = 3.5
severity = "LOW"
sources = ["msrc"]
title = "Google Chrome 密码模块不当实现导致的认证绕过漏洞"
updated = "2026-06-17T08:34:30Z"

