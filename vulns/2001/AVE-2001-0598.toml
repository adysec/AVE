[basic]
description = "Debian GNU/Linux 系统中 dialog 工具（0.9a-20000118-3bis 之前版本）存在任意文件写入漏洞。本地攻击者可通过符号链接攻击（symlink attack）方式，诱使 dialog 在处理临时文件时覆盖系统任意文件，导致本地权限提升或系统文件被破坏。该漏洞攻击复杂度低，无需身份认证，但需要本地访问权限，CVSS 评分 2.1，危害等级低。"
published = "2001-02-12T05:00:00.000"
remediation = "升级 dialog 至 0.9a-20000118-3bis 或更高版本，该版本已修复临时文件创建时的符号链接竞态问题。如无法立即升级，应避免在多用户环境下以 root 权限运行 dialog 脚本，并确保临时目录（/tmp）设置了 sticky 位（chmod +t /tmp）以防止符号链接攻击。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Debian GNU/Linux dialog 符号链接攻击导致任意文件写入漏洞"
updated = "2026-06-16T21:53:35.877"

