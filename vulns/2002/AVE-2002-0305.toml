[basic]
description = "PHProjekt 3.1 和 3.1a 版本中的 filemanager_forms.php 文件存在远程文件包含漏洞。由于 lib_path 参数未经过滤直接引入外部文件，未经身份认证的远程攻击者可以通过构造恶意 URL 并传入该参数，远程包含并执行任意 PHP 代码。该漏洞影响使用 PHProjekt 3.1/3.1a 版本的项目管理系统的用户，攻击者无需任何凭据即可在目标服务器上执行恶意脚本，可能导致服务器被完全控制、敏感数据泄露或进一步内网渗透。"
published = "2002-08-12T04:00:00Z"
remediation = "建议将 PHProjekt 升级至 3.2 或更高版本以修复此漏洞。若无法立即升级，应在 php.ini 配置文件中将 allow_url_include 选项设置为 Off，以禁止远程文件包含，并对 filemanager_forms.php 中的 lib_path 参数实施严格的白名单校验。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "PHProjekt 3.1 远程文件包含漏洞"
updated = "2026-06-16T21:57:28Z"

