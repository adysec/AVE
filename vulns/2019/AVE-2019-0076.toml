[basic]
description = "Pallets Werkzeug 是一款广泛应用于 Python Web 开发的基础工具库，其 SharedDataMiddleware 组件在 Windows 平台下对包含驱动器盘符（如 C:）的文件路径处理不当，导致攻击者可通过构造包含 Windows 驱动器格式路径的目录遍历请求，绕过路径安全检查，读取服务器上受限目录中的任意文件内容。该漏洞影响 0.15.5 版本之前的所有 Werkzeug 版本，攻击者无需身份认证即可远程利用，当目标服务器运行在 Windows 环境下并启用了静态文件服务时，即可通过发送特制的 HTTP 请求触发路径遍历，造成敏感信息泄露。Pallets 官方已在 0.15.5 版本中修复此问题。"
published = "2019-07-28T13:15:10.597"
remediation = "立即将 Pallets Werkzeug 升级至 0.15.5 或更高版本（执行 pip install --upgrade werkzeug）。若暂无法升级，建议临时禁用 Windows 环境下 SharedDataMiddleware 的静态文件托管功能，或在前端反向代理层过滤含盘符（如 C:）的请求路径，并在防火墙或 WAF 中阻断路径穿越特征。同时排查 Flask 等依赖框架的版本兼容性，确保依赖链整体修复。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Pallets Werkzeug SharedDataMiddleware 目录遍历漏洞"
updated = "2026-06-17T02:18:12.010"

