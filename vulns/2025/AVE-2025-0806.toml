[basic]
description = "Windows 部署服务（WDS）存在不当链接解析漏洞（CWE-59），由于服务在处理文件路径时未能正确验证符号链接，本地攻击者可通过诱导已登录用户访问恶意构造的符号链接文件，触发服务对目标文件的不当访问，导致服务进程崩溃或资源耗尽，造成拒绝服务。该漏洞攻击复杂度较高，需要低权限和用户交互，影响 Windows 10/11 全系列及 Windows Server 2012/2016/2019/2022/2025 等多个版本。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新（KB5051974），可通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。此更新修复了 Windows 部署服务（WDS）中因不当处理链接文件导致的拒绝服务漏洞。如无法立即打补丁，建议在不需要 WDS 的服务器上禁用 Windows 部署服务（通过服务管理器停止 WDSService），或在防火墙层面限制对 WDS 端口（UDP 67/68、TCP 135/445）的访问作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 部署服务拒绝服务漏洞"
updated = "2025-02-11"

