[basic]
description = "Infinite InterChange 3.6.1 的 Web 管理界面存在拒绝服务漏洞，远程攻击者无需身份认证即可通过向目标系统发送特制的大尺寸 POST 请求，导致应用程序崩溃。该漏洞源于 Web 接口未对 POST 请求体大小进行有效限制，当处理超大数据量时触发内存分配失败或缓冲区溢出，造成服务进程异常终止。攻击者只需具备网络访问能力即可实施攻击，无需任何权限或用户交互。Exploit-DB 已公开 PoC 利用代码，危害等级中等。"
published = "2001-02-12T05:00:00.000"
remediation = "建议升级 Infinite InterChange 至 3.61 以上版本，或联系厂商获取安全补丁。如无法升级，可在 Web 服务器或反向代理层面限制 POST 请求体大小（如限制为 1MB），并配置 WAF 规则拦截超长 POST 请求以缓解拒绝服务攻击。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Infinite InterChange 3.6.1 Web 接口 POST 请求拒绝服务漏洞"
updated = "2026-06-16T21:53:38.980"

