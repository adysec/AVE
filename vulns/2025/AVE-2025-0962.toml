[basic]
description = "Linux内核ROSE（AMPR Radio Over IP）网络子系统中的rose_bind()函数未正确加锁，导致多线程并发调用bind()时触发软锁死（soft lockup）。本地攻击者可利用此竞争条件造成内核挂起，影响系统可用性。该漏洞影响启用了ROSE协议支持的Linux内核版本，CVSS评分为5.5（中等），需本地访问权限即可触发。补丁已在内核源码中修复，通过为rose_bind()添加适当的套接字锁机制来避免并发访问冲突。"
published = "2025-02-27T03:15:15.543"
remediation = '升级 Linux 内核至已修复版本：5.4.291、5.10.235、5.15.179、6.1.129、6.6.78、6.12.14、6.13.3 或 6.14 及以上。若无法立即升级内核，可通过禁用 ROSE 网络协议模块缓解：在 /etc/modprobe.d/rose.conf 中添加 "install rose /bin/true" 或 "blacklist rose"，然后执行 "update-initramfs -u" 并重启系统。使用 modprobe -r rose 可临时卸载该模块。'
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 ROSE 协议软锁定漏洞"
updated = "2026-06-17T08:44:11.040"

