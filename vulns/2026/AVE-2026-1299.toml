[basic]
description = 'Angular 编译器国际化（i18n）管道存在跨站脚本（XSS）漏洞。Angular 虽通过标准属性验证机制（validateAttribute/validateProperty）禁止直接绑定事件处理程序属性（如 onclick、onerror），但 i18n 元数据收集路径允许使用 i18n-on* 属性（如 i18n-onerror）将此类属性标记为待翻译，从而绕过安全验证。该漏洞影响 Angular 20.3.27 之前、21.2.19 之前及 22.0.1 之前的所有版本。当攻击者能够控制或影响应用程序本地化过程中使用的翻译文件时，可将模板中无害的静态事件处理程序（如 onerror="void 0"）替换为任意可执行 JavaScript 代码，进而在受影响应用程序的域名上下文内执行任意脚本，导致会话劫持、窃取用户敏感数据或在用户不知情的情况下执行未授权操作。'
published = "2026-08-03T17:16:45Z"
remediation = "立即将 Angular 升级至 20.3.27、21.2.19 或 22.0.1 版本以修复 i18n 管道中 `i18n-on*` 事件处理属性的 XSS 注入漏洞。同时检查项目模板文件，移除所有静态事件处理属性（如 `onerror`、`onclick`）上的 `i18n-on*` 标记，并确保翻译文件仅来自可信来源，防止被篡改为恶意脚本。"
score = 7.6
severity = "HIGH"
sources = ["ghsa"]
title = "Angular i18n 跨站脚本漏洞"
updated = "2026-08-03T22:16:52Z"

