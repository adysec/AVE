[basic]
description = "Cisco Adaptive Security Appliance（ASA）和 Firepower Threat Defense（FTD）的 Web 服务接口存在跨站脚本（XSS）漏洞，由于对用户输入缺乏充分验证，未经身份认证的远程攻击者可构造恶意链接，诱使受影响设备的 Web 服务用户点击，从而在浏览器上下文中执行任意脚本代码或窃取敏感信息。该漏洞仅影响启用了特定 AnyConnect 和 WebVPN 配置的设备，攻击者无需凭据即可在用户浏览器中运行 JavaScript，进而劫持会话、篡改页面内容或获取凭据。"
published = "2020-10-21T19:15:18Z"
remediation = "升级到修复版本以消除漏洞：Cisco ASA Software 9.8 升级至 9.8.4.34、9.9 升级至 9.9.2.85、9.12 升级至 9.12.4.13、9.13 升级至 9.13.1.21、9.14 升级至 9.14.2.8、9.15 升级至 9.15.1.15；Cisco FTD Software 6.4.0 升级至 6.4.0.12、6.5.0 升级至 6.5.0.5、6.6.0 升级至 6.6.4、6.7.0 升级至 6.7.0.2。ASA 9.7 及更早版本和 9.10 已停止维护，须迁移至受支持的修复版本。FTD 设备通过 FMC 或 FDM 界面完成升级后需重新应用访问控制策略。该漏洞仅影响启用了 AnyConnect IKEv2（含 client-services）或 WebVPN（含 Clientless SSL VPN）的配置，可在设备上执行 show running-config 确认是否存在 crypto ikev2 enable client-services 或 webvpn enable 配置项来判断受影响程度。由于公开利用代码已存在且正被积极利用，建议在边界设备上部署 Snort 规则 57856 和 57857 检测攻击流量。该漏洞无可用缓解措施，升级软件版本是唯一修复方式。"
score = 6.1
severity = "MEDIUM"
sources = ["kev"]
title = "思科 Adaptive Security Appliance 和 Firepower Threat Defense 跨站脚本漏洞"
updated = "2026-06-17T03:18:38Z"

