[basic]
description = "Qt SVG 模块 qsvghandler.cpp 存在使用后释放漏洞，解析器在处理非结构化节点的 <pattern> 元素时，会在创建后删除该节点但后续仍可能访问已释放内存，导致使用后释放漏洞。攻击者可通过诱导用户打开精心构造的恶意 SVG 文件触发该漏洞，导致拒绝服务攻击。该漏洞影响 Qt 5/6 SVG 模块（如 Qt 5.15.x、Qt 6.x 相关版本），CVSS 4.0 评分 9.4（严重），攻击向量为本地，攻击复杂度低，无需权限和用户交互，可导致高机密性、完整性、可用性影响。Qt 官方已发布补丁修复，用户应尽快升级到修复版本。受影响产品包括 Qt5 qtsvg、Qt6 qtsvg 等相关模块。"
published = "2025-10-03T16:16:16Z"
remediation = "建议立即升级 Qt SVG 模块至 5.15.17 或 6.7.3 及以上版本（含微软 Azure Linux 回港补丁 qtsvg-5.15.17-CVE-2025-10729.patch）。若暂时无法升级，可在应用层禁止解析外部 SVG 文件，或在网络层拦截包含 <pattern> 非结构化节点的 SVG 内容作为临时缓解。"
score = 9.4
severity = "CRITICAL"
sources = ["msrc"]
title = "Qt SVG 无用漏洞导致拒绝服务"
updated = "2026-06-17T08:28:51Z"

