[basic]
description = "Open WebUI 终端代理存在身份认证绕过漏洞。在 `backend/open_webui/routers/terminals.py` 中，HTTP 路径将用户 ID 以未签名的 `X-User-Id` 标头转发至上游，攻击者可直接伪造该标头冒充任意用户；WebSocket 路径未对 `session_id` 参数进行校验与 URL 编码，攻击者可通过注入特殊字符篡改上游 URL 中的 `user_id` 查询参数，使后端协调器解析为其他用户的终端作用域。已认证的普通用户可利用此漏洞越权访问其他用户的终端会话，结合共享聊天中泄露的会话 ID 可附加到目标用户的实时 PTY。该漏洞影响 Open WebUI 0.10.0 之前版本，CVSS 评分 8.0，危害等级高。"
published = "2026-07-09T17:17:03Z"
remediation = "立即升级 Open WebUI 至 v0.10.0 或更高版本（该版本已对 session_id 进行 URL 编码校验并废弃无签名的 X-User-Id 转发机制）。如无法立即升级，可在反向代理层（如 Nginx）添加规则过滤请求路径中携带的 `?`、`#`、`&` 等特殊字符，并限制终端代理上游仅接受来自可信来源的请求。"
score = 8
severity = "HIGH"
sources = ["ghsa"]
title = "Open WebUI 终端代理用户身份认证绕过漏洞"
updated = "2026-07-10T15:22:04Z"

