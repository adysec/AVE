[basic]
description = "SGI IRIX系统的分布式图形库守护进程（dgld）在TCP 5232端口上提供远程查询服务，且未对访问者进行身份认证或访问控制。未经身份认证的远程攻击者可向目标主机的5232端口发送探测请求，并通过服务响应的特征识别出目标系统为SGI IRIX操作系统。该漏洞导致系统指纹信息泄露，攻击者可利用该信息进一步针对SGI系统展开定向攻击与渗透。该漏洞影响开启了dgld服务且端口5232可被远程访问的SGI IRIX系统，攻击条件简单，无需任何凭据即可远程触发。"
published = "2001-02-16T05:00:00.000"
remediation = "建议立即禁用 SGI IRIX 系统上的 dgld 服务：执行 `chkconfig dgld off` 或编辑 `/etc/inetd.conf` 注释掉 dgld 服务行并重启 inetd 进程。在防火墙层面封锁 TCP 5232 端口（`iptables -A INPUT -p tcp --dport 5232 -j DROP`）。SGI IRIX 已停止维护无官方补丁，建议尽快迁移至受支持的操作系统（如 Linux）。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "SGI IRIX 信息泄露漏洞"
updated = "2026-06-16T21:52:41.487"

