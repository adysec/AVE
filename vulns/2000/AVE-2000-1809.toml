[basic]
description = "IIS 4.0 和 5.0 的 ASP 页面在安全 (HTTPS) 和不安全 (HTTP) Web 会话中发送相同的 Session ID cookie，导致系统未能有效隔离不同安全级别的会话标识。当用户首次登录安全会话，然后访问不安全会话时，两个会话将共享相同的会话标识符。这使得远程攻击者能够通过拦截并重用该会话标识符 cookie，成功劫持用户的安全 Web 会话。该漏洞攻击者可以在远程无需身份验证的情况下触发，对用户机密数据造成部分泄露、会话状态被篡改以及服务可用性受到部分影响。漏洞影响范围覆盖所有使用 IIS 4.0 和 5.0 的 ASP 应用程序，攻击条件为用户在安全和不安全网络之间切换时系统未正确处理会话标识，利用方式为攻击者截获并重用跨安全级别的会话标识符。CVSS 评分 7.5，等级高，代表严重的 Web 会话安全风险。"
published = "2000-12-19T05:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS00-080 提供的补丁：IIS 4.0 和 IIS 5.0 分别下载对应版本修补程序；补丁启用后 ASP 页面将支持将 Session ID Cookie 标记为 Secure 属性，防止其在非加密 HTTP 页面传输泄露。若暂时无法打补丁，可在 IIS 中为 HTTPS 站点配置独立会话标识，或强制全站 HTTPS 并禁用 HTTP 访问，从源头消除同一 Cookie 跨安全/非安全页面传输的风险。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "微软 IIS Web 会话劫持安全漏洞"
updated = "2026-06-16T21:52:52Z"

