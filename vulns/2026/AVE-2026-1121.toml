[basic]
description = "Guzzle PHP HTTP 客户端库的 RedirectMiddleware 存在信息泄露漏洞。当启用可选的 allow_redirects.referer 设置时，该中间件在跟随同方案重定向（如 HTTPS 到 HTTPS）的过程中，会将原始请求 URI 中的片段标识符（即 URL 中 # 之后的部分）复制到生成的 Referer 请求头中。URI 片段通常由客户端本地处理而不作为 HTTP 请求目标的一部分发送至服务器，但受影响版本的 Guzzle 会在重定向时将其重新引入 Referer 头。攻击者若控制重定向目标地址，即可通过请求日志或应用代码读取该片段内容，若其中包含一次性登录密钥、访问令牌、状态值或其他敏感客户端数据，这些信息将被泄露至原本不应接收它的服务器。该漏洞影响 guzzlehttp/guzzle 7.15.1 之前的所有版本，利用条件要求应用程序显式启用 allow_redirects.referer 设置、向带有敏感片段标识符的 URI 发送请求，并跟随至不可信目标的同方案重定向，攻击者无需身份认证即可在远程获取敏感信息。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
