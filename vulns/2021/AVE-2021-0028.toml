[basic]
description = "三星 SMR (Samsung Mobile Release) 在 2021 年 3 月版本之前的 dpu 驱动程序中存在文件描述符处理不当漏洞。由于 dpu 驱动对文件描述符的错误实现，攻击者可利用该缺陷触发内存破坏，导致内核崩溃（kernel panic），造成拒绝服务。该漏洞需要物理访问权限（AV:P）、高攻击复杂度（AC:H）和高权限（PR:H），无需用户交互。影响三星设备 SMR Mar-2021 Release 1 之前版本，CVSS 3.1 评分 6.1（中危），属于 Use After Free（CWE-416）和异常条件处理不当（CWE-703）类型。三星已在 2021 年 3 月发布的 SMR 版本中修复此漏洞。"
published = "2021-03-26T19:15:12Z"
remediation = '将三星移动设备升级至 SMR Mar-2021 Release 1 或更高版本的 Security Maintenance Release 安全更新，该补丁修复了 DPU 驱动中文件描述符处理的错误实现，消除了内存损坏导致内核恐慌的漏洞。受影响设备包括运行 Android O(8.x)、P(9.0)、Q(10.0)、R(11.0) 并搭载部分 Exynos 芯片组的机型，可通过"设置 → 软件更新"或通过 Samsung Kies/PC 伴侣下载并安装最新固件更新。如暂无法立即完成更新，应避免将设备交予不受信任的人员使用，以降低本地高权限攻击者利用此漏洞触发内核恐慌的风险。该漏洞已于 2022 年 11 月被 CISA 列入已知被利用漏洞目录（KEV），建议尽快完成更新。'
score = 6.1
severity = "MEDIUM"
sources = ["kev"]
title = "三星 SMR DPU 驱动内存损坏漏洞"
updated = "2026-06-17T03:41:57Z"

