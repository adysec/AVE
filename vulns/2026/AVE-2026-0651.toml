[basic]
description = "Gitea 自托管 Git 服务中组织级别的 Actions API 存在跨仓库信息泄露漏洞。`GET /api/v1/orgs/{org}/actions/runs` 和 `GET /api/v1/orgs/{org}/actions/jobs` 接口仅通过 `reqOrgMembership()` 进行权限校验，未对组织内各仓库进行独立的访问控制检查。任何组织成员（即使未被授予任何仓库权限）均可枚举该组织下所有仓库（包括私有仓库）的 workflow 运行记录和任务信息，泄露仓库名称、分支名、commit SHA、工作流文件名、参与者身份等敏感元数据。攻击者可利用查询参数（如 `?branch=`、`?head_sha=`、`?actor=`）构建搜索预言机，对私有仓库的 CI 活动进行全量探测。该漏洞影响 Gitea 开发版 main 分支（commit b7e95cc48c），对应 OWASP API3:2023 类别。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级 Gitea 至 v1.27.0 或更高版本。如无法立即升级，可在反向代理层对 `/api/v1/orgs/{org}/actions/runs` 和 `/api/v1/orgs/{org}/actions/jobs` 路径添加访问控制，仅允许组织管理员访问。同时审查组织内所有成员的权限分配，确保低权限成员无法通过组织级 API 枚举私有仓库的 CI 运行信息。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Gitea 组织级 Actions API 跨仓库信息泄露漏洞"
updated = "2026-01-01T00:00:00Z"

