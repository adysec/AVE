[basic]
description = "HP-UX Support Tools Manager (STM) A.22.00 版本存在符号链接攻击漏洞。本地攻击者可通过创建指向目标文件的恶意符号链接，诱使 STM 将日志写入 tool_stat.txt 时覆盖系统任意文件，导致权限提升或破坏系统完整性。攻击需本地用户权限，利用难度低。"
published = "2001-02-12T05:00:00.000"
remediation = "建议升级 HP-UX Support Tools Manager (STM) 至 A.22.01 或更高版本以修复符号链接问题。如无法升级，可临时移除 STM 相关二进制文件的 setuid 权限（`chmod u-s /opt/stm/bin/*`），并限制 tool_stat.txt 日志文件所在目录仅允许 root 用户写入，同时在 /tmp 目录设置粘滞位（sticky bit）防止本地符号链接攻击。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "HP-UX Support Tools Manager 本地文件写入漏洞"
updated = "2026-06-16T21:53:37.007"

