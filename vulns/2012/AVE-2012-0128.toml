[basic]
description = "Apple iTunes 10.6 之前版本中使用的 WebKit 组件存在内存破坏漏洞。当用户通过 iTunes 浏览商店时，中间人攻击者可通过篡改网络流量触发该漏洞，导致内存损坏和应用程序崩溃，进而实现远程代码执行。攻击者需要能够拦截并修改用户与 iTunes Store 之间的通信，攻击复杂度较高，但成功利用后可完全控制目标系统。"
published = "2012-03-08T22:55:04.073"
remediation = "立即将 Apple iTunes 升级至 10.6 或更高版本（Apple 官方安全更新 APPLE-SA-2012-03-07-1）。如无法立即升级，建议在受控网络环境中启用 HTTPS 流量检测，避免在不可信网络中使用 iTunes Store 浏览功能，并限制 iTunes 对外部 WebKit 内容的加载权限作为临时缓解措施。"
score = 7.6
severity = "HIGH"
sources = ["tenable"]
title = "Apple iTunes WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:59.423"

