[basic]
description = "Linux netkit 包中的 telnet 守护进程（telnetd）在 0.16 版本之前存在认证绕过漏洞。当 telnetd 以 -L 命令行选项启动时，远程攻击者无需提供有效凭证即可绕过身份验证机制，直接获得系统访问权限。该漏洞影响所有运行易受版本 telnetd 且启用 -L 选项的 Linux 系统，CVSS 评分 7.5（高危），攻击向量为网络、攻击复杂度低、无需认证、可造成部分机密性/完整性/可用性影响。攻击者只需建立到目标 telnet 服务的连接，即可利用此缺陷绕过登录认证，进而执行任意命令或进一步渗透内网。"
published = "2001-08-31T04:00:00Z"
remediation = "升级 netkit-telnet 至 0.16 或更高版本，或彻底禁用 telnetd 服务改用 SSH。若必须保留 telnet，请在启动参数中移除 -L 选项，并在防火墙层面限制 23 端口仅允许受信 IP 访问。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Caldera OpenLinux netkit-telnet 认证绕过漏洞"
updated = "2026-06-16T21:53:21Z"

