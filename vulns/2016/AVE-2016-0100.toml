[basic]
description = "NETGEAR WNR2000v5 路由器在 /apply.cgi?/lang_check.html 接口的 hidden_lang_avi 参数存在栈缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向受影响设备发送特制的 HTTP 请求触发该溢出，导致远程代码执行，完全控制目标路由器。该漏洞 CVSS 评分 9.8，危害等级严重，且已有公开的 Metasploit 利用模块，攻击门槛低。NETGEAR 官方未发布安全更新修复此漏洞，建议用户更换不受影响的设备型号或采取访问控制等缓解措施。"
published = "2017-01-30T04:59:00Z"
remediation = "NETGEAR 已不再为 WNR2000v5 提供安全更新，建议立即更换为受支持的设备。如无法更换，请关闭路由器的远程管理功能（禁用 WAN 端 Web 访问），并将管理界面仅绑定到内网可信 IP；同时在防火墙规则中阻止外网对 TCP 80/443 端口的访问，以降低被远程利用的风险。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "NETGEAR WNR2000v5 路由器缓冲区溢出漏洞"
updated = "2026-06-17T00:39:12Z"

