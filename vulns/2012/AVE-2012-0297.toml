[basic]
description = "WebKit 渲染引擎在 Apple iTunes 10.7 及更早版本中存在内存破坏漏洞，远程攻击者可通过构造恶意网站向目标系统发送特制网页内容触发该漏洞，成功利用后可导致应用程序崩溃拒绝服务或在目标系统上执行任意代码。该漏洞的利用无需身份认证，攻击者只需诱使用户使用存在漏洞的 iTunes 版本访问恶意网页即可完成攻击。Apple 已在 iTunes 10.7 版本中修复此漏洞，建议受影响用户升级至安全版本。"
published = "2012-09-13T10:30:19Z"
remediation = "将 Apple iTunes 升级至 10.7 或更高版本，Safari 升级至 6.0.1 或更高版本，以修复 WebKit 内存破坏漏洞。临时缓解措施：避免访问未知或恶意网站，不点击可疑链接，降低远程代码执行风险。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes 内存破坏漏洞"
updated = "2026-06-16T23:43:35Z"

