[basic]
description = "Apple iTunes 10.7 之前版本中内嵌的 WebKit 组件存在内存破坏漏洞，远程攻击者可通过诱导用户访问精心构造的恶意网站触发该漏洞，导致任意代码执行或拒绝服务（应用崩溃）。该漏洞影响 Windows 和 Mac 平台上的 iTunes 10.7 之前版本，CVSS v2 评分 6.8（中危），攻击向量为网络，攻击复杂度中等，无需认证即可利用。Apple 已于 2012 年 9 月发布安全更新（APPLE-SA-2012-09-12-1）修复此漏洞，用户应升级至 iTunes 10.7 或更高版本。"
published = "2012-09-13"
remediation = "建议立即将 Apple iTunes 升级至 10.7 或更高版本以修复该 WebKit 内存破坏漏洞。升级路径：打开 iTunes，依次点击菜单栏「帮助」→「检查更新」，按提示完成安装。对于 iOS 设备，需将系统升级至 iOS 6.0 及以上版本（进入「设置」→「通用」→「软件更新」）。若暂时无法升级，应避免使用 iTunes 访问或打开未知来源的网页及媒体文件，并可在防火墙或代理层面过滤恶意 Web 内容作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes 内存破坏漏洞"
updated = "2012-09-13"

