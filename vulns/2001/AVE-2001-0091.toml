[basic]
description = "tags.<value>FreeBSD 3.5.1/4.2 的 ports 软件包 xklock（ja-xklock 2.7.1 及更早版本）中存在缓冲区溢出漏洞。攻击者利用该漏洞可在本地系统上提升权限至 root，从而获得对系统的完全控制权。该漏洞影响 FreeBSD 3.5.1 和 4.2 版本，CVSS 评分为 7.2，危害等级为高危。"
published = "2001-06-02T04:00:00.000"
remediation = "建议卸载系统中的 xklock 软件包（<2.7.1 版本），并将其从 FreeBSD 端口中清除。使用 `pkg_delete xklock` 命令卸载后执行 `make deleteall` 清理端口残余文件。如果需要保留功能，建议升级到 FreeBSD 4.3/5.0 版本，这些版本包含针对此漏洞的修复。临时缓解措施是在系统中设置 `security.bsd.px protection` 配置项，启用系统调用参数验证，以防止任意代码执行。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "FreeBSD xklock 缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:53:54.553"

