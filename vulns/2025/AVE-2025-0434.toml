[basic]
description = "axboe fio 3.41 及之前版本的 options.c 文件中 str_buffer_pattern_cb 函数存在空指针解引用漏洞（CWE-404），攻击者可通过本地构造恶意输入参数触发空指针解引用，导致 fio 进程崩溃造成拒绝服务。该漏洞影响 fio 3.41 及之前所有版本，攻击向量为本地（AV:L），需低权限（PR:L）且无需用户交互（UI:N），攻击复杂度低（AC:L），CVSS 4.0 评分 1.9（低危），主要影响可用性（VA:L）。利用代码已公开（GitHub Issue #1982 及 poc.zip），攻击者可在本地执行 PoC 触发崩溃。建议升级至 fio 3.41 以上版本或应用官方补丁（如 Ubuntu CVE-2025-10823 补丁、Xilinx meta-openembedded 补丁）修复该漏洞。"
published = "2025-09-23T00:15:36Z"
remediation = "升级到 axboe fio 版本 3.42 或更高版本，其中包含对 CVE-2025-10823 的修复。具体操作：1) 从官网或 distribution 升级到最新稳定版 2) 系统中无现成包时，克隆官方仓库代码并打下游补丁以修复 options.c 中的 str_buffer_pattern_cb 空指针问题 3) 如果无法立即升级，临时缓解措施为运行测试时禁用修改可能引发空指针行为的特定 pattern pattern 使用选项，并在/usr/include 目录下设置 TMPDIR 环境变量以隔离测试临时文件；由于该漏洞仅在本地环境下触发，仅需确保用户权限控制，限制 test user 到非 root 用户，运行测试时避免使用 untrusted 输入，该方案可作为完整版号发布前的短期替换方案。"
score = 1.9
severity = "LOW"
sources = ["msrc"]
title = "axboe fio 空指针解引用漏洞"
