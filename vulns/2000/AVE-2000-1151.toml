[basic]
description = "AIX 4.3.0 系统中的 portmir 组件存在缓冲区溢出漏洞，该漏洞源于 echo_error 例程在处理输入时未正确限制缓冲区边界。本地攻击者可通过向 portmir 发送特制的输入数据触发缓冲区溢出，从而破坏系统锁文件并获取 root 权限。该漏洞影响 AIX 4.3.0 版本，CVSS 评分 7.2，危害等级高。攻击者需拥有本地系统访问权限方可利用。"
published = "2000-01-27T05:00:00Z"
remediation = "立即安装 IBM AIX 4.3.0 的 APAR#IY07832 补丁包，可通过 IBM Fix Central 搜索 IY07832 下载并应用。如无法立即打补丁，可临时移除 portmir 命令的 setuid 权限（chmod -s /usr/bin/portmir），并限制 /etc/locks 目录的写入权限，仅允许 root 用户访问。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "IBM AIX portmir 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:24Z"

