[basic]
description = "Oracle BI Publisher（原 XML Publisher）组件存在目录遍历漏洞。该漏洞影响 Oracle Fusion Middleware 的 11.1.1.9.0、12.2.1.3.0 和 12.2.1.4.0 版本。具有高权限且可通过网络访问的远程攻击者，可通过 HTTP 协议向目标服务器发送包含目录遍历序列的特制请求，成功利用后可未授权访问关键业务数据或完全获取 BI Publisher 可访问的所有敏感数据，造成信息泄露。CVSS 3.0 基础评分为 4.9，危害等级为中等。"
published = "2019-04-23T19:32:49.913"
remediation = "立即安装 Oracle 2019 年 4 月 Critical Patch Update (CPU) 以修复 CVE-2019-2588。受影响版本为 11.1.1.9.0、12.2.1.3.0 和 12.2.1.4.0，可通过 My Oracle Support (MOS Note 23075893) 下载对应补丁程序包并按照 Fusion Middleware Patch Availability Document 指引进行安装。若为 11.1.1.9.0 版本用户，建议直接升级至 12.2.1.4.0 或更高受支持版本。在补丁应用前，可通过防火墙限制对 BI Publisher HTTP/HTTPS 端口的访问作为临时缓解措施，仅允许可信管理 IP 访问，且务必在非生产环境先行验证补丁兼容性。"
score = 4.9
severity = "MEDIUM"
sources = ["nuclei"]
title = "Oracle BI Publisher 目录遍历漏洞"
updated = "2026-06-17T02:34:09.860"

