[basic]
description = "Mandrake Linux 7.1及更早版本中的 ypserv（NIS 服务）存在格式化字符串漏洞。当 ypserv 在编译时未启用 vsyslog() 函数时，程序未能正确过滤用户可控输入中的格式化字符串占位符（如 %n、%s 等），远程攻击者可通过向 ypserv 发送特制的格式化字符串请求触发该漏洞，实现任意内存写入，从而获取 root 权限。该漏洞影响 Mandrake Linux 6.1/7.0/7.1 等多个版本，CVSS v2 评分 10.0，危害严重，无需身份认证即可远程利用。"
published = "2000-12-11T00:00:00Z"
remediation = "立即安装 Mandrake Linux 官方安全补丁 MDKSA-2000-064，将 ypserv 升级至修复了格式化字符串漏洞的版本。如无法升级，确保 ypserv 编译时启用 vsyslog() 函数（添加编译选项 -DHAVE_VSYSLOG），并在防火墙层面限制对 ypserv 服务（TCP/UDP 834 端口）的访问，仅允许受信任的 NIS 客户端连接。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Mandrake Linux ypserv 格式化字符串漏洞"
updated = "2000-12-11T00:00:00Z"

