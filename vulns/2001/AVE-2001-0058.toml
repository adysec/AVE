[basic]
description = "Internet Explorer 5.0.1/5.5/6.0 存在 Telnet 客户端文件覆盖漏洞。浏览器在处理 telnet:// 协议链接时，会将网页指定的命令行参数直接传递给 Telnet 客户端执行。如果用户系统安装了 Microsoft Services for Unix（SFU）2.0，其 Telnet 客户端在创建会话转录文件时会根据攻击者控制的参数生成文件，导致文件被覆盖或在客户端系统上执行任意命令。攻击者需构造包含恶意 telnet:// 链接的网页并诱使用户点击，利用无需身份验证，可造成信息泄露、文件覆盖及远程代码执行等危害。"
published = "2001-06-02T04:00:00Z"
remediation = '安装 Microsoft 针对 Internet Explorer 5.01/5.5 发布的安全更新 Q286043（MS01-015），或通过 Windows Update 自动安装该补丁。如无法立即打补丁，可通过注册表编辑器移除 Telnet 异步可插入协议（APP），禁止 IE 启动 Telnet 会话。如已安装 Services for Unix 2.0，建议卸载该版本或升级到不受影响的 IE 6 及以上版本。升级后可通过 IE 的"帮助"→"关于 Internet Explorer"确认 Q286043 出现在更新版本列表中。'
score = 5.1
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Internet Explorer Telnet 客户端远程命令执行漏洞"
updated = "2026-06-16T21:53:46Z"

