[basic]
description = "Internet Explorer 脚本引擎在处理内存对象时存在内存损坏漏洞（CWE-787）。远程攻击者可通过诱导用户访问特制的恶意网页，利用脚本引擎在处理特定对象时的内存管理缺陷触发该漏洞。该漏洞影响 Internet Explorer 9、10 及 11 版本，攻击者一旦成功触发即可在目标系统上实现远程代码执行（RCE），导致攻击者获得系统权限并执行任意指令。"
published = "2018-08-15T17:29:06Z"
remediation = "建议立即安装微软 2018 年 8 月的安全更新（针对 IE 9/10/11），通过 Windows Update 自动更新或手动下载安装对应版本的补丁。作为临时缓解措施，建议用户避免访问不可信的恶意网页，或在企业环境中强制启用增强型安全配置 (ESC) 限制脚本执行。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Internet Explorer 脚本引擎内存损坏远程代码执行漏洞"
updated = "2026-06-17T02:04:43Z"

