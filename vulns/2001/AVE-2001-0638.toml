[basic]
description = "Linuxconf 1.23r 及更早版本中的 vpop3d 程序存在符号链接攻击漏洞。本地攻击者可通过创建恶意符号链接，诱使 vpop3d 程序以提升的权限写入攻击者指定的任意文件，从而导致系统文件被覆盖或破坏。该漏洞利用条件要求攻击者拥有本地系统访问权限，且 vpop3d 程序以高权限运行。成功利用后可能导致系统服务异常或权限提升。CVSS 评分 1.2，危害等级低。"
published = "2001-03-12T05:00:00Z"
remediation = "升级 linuxconf 至 1.19r2-4 及以上版本（Immunix OS 7.0-beta 对应补丁包 linuxconf-1.19r2-4_StackGuard_2），或安装 MandrakeSoft 安全公告 MDKSA-2001-011 提供的更新。如无法升级，确保 /tmp 目录挂载时使用 sticky 位（chmod 1777 /tmp）并启用 nosuid 选项，同时限制本地用户对 /tmp 的符号链接创建权限作为临时缓解措施。"
score = 1.2
severity = "LOW"
sources = ["cve"]
title = "Immunix Linuxconf vpop3d 任意文件写入漏洞"
updated = "2026-06-16T21:53:45Z"

