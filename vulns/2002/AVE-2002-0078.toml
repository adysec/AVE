[basic]
description = "Common Unix Printing System (CUPS) 1.1.14 至 1.1.17 版本的 jobs.c 文件在处理选项字符串时未正确使用 strncat 函数调用，导致存在基于栈的缓冲区溢出漏洞。远程未经身份认证的攻击者可通过向目标 CUPS 服务发送特制的打印作业请求触发该漏洞，成功利用可实现在目标系统上以 lp 用户权限执行任意代码。该漏洞影响 Linux 及类 Unix 系统中运行 CUPS 1.1.14-1.1.17 版本的系统，攻击无需用户交互，危害严重。"
published = "2002-12-26T05:00:00Z"
remediation = "立即升级 CUPS 至 1.1.18 或更高版本。各发行版对应补丁：Red Hat 安装 RHSA-2002:295 更新，Debian 安装 DSA-232 更新，Mandrake 安装 MDKSA-2003:001 更新。如无法升级，可在 cupsd.conf 中限制 IPP 访问来源（Allow from 内网段），并禁用未授权的远程打印队列添加功能以降低攻击面。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "Common Unix Printing System (CUPS) 作业处理缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:59:11Z"

