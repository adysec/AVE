[basic]
description = "MCP Ruby SDK 中的 StreamableHTTPTransport 组件在默认配置下不会过期会话，每次成功的 initialize 请求都会创建一个新的 ServerSession 对象并永久保留，仅通过客户端主动发送 HTTP DELETE 才能释放。未经身份认证的远程攻击者可反复发送初始化请求并立即断开连接，导致服务器内存中堆积大量 ServerSession 对象直至耗尽，造成拒绝服务。该漏洞影响 mcp gem 0.23.0 之前的所有版本，已在 0.23.0 版本中修复。"
published = "2026-07-29T20:17:11.960"
remediation = "立即升级 mcp gem 至 v0.23.0 或以上版本，该版本已修复默认 session 永不过期问题。如无法立即升级，可在初始化 StreamableHTTPTransport 时显式设置 session_idle_timeout 参数（如 1800 秒），并添加 max_sessions 上限限制（如 1000），同时在反向代理层限制单 IP 的 POST 请求频率以缓解攻击。"
score = 5.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "MCP Ruby SDK 会话未过期导致内存耗尽漏洞"
updated = "2026-07-30T19:30:33.710"

