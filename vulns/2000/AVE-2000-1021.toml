[basic]
description = "Samba 2.0.7 中的 Web 管理工具（SWAT）存在拒绝服务漏洞，远程攻击者可通过向目标系统发送特制的非标准 URL 的 GET HTTP 请求，导致 SWAT 服务进程崩溃并强制重启，从而造成服务不可用。该漏洞影响 Samba 2.0.7 版本，攻击无需身份认证，通过网络即可触发，危害等级中等。建议升级到不受影响的版本以修复此漏洞。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 Samba 至 2.0.8 或更高版本，该版本已修复 SWAT 模块对畸形 URL 请求的处理逻辑。如无法立即升级，可临时禁用 SWAT 服务（删除或重命名 /etc/xinetd.d/swat 配置文件后重启 xinetd），或在防火墙层面限制对 SWAT 默认端口 901 的访问，仅允许受信任管理 IP 连接。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Samba SWAT 非标准URL远程拒绝服务漏洞"
updated = "2026-06-16T21:52:48.757"

