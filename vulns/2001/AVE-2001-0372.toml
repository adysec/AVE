[basic]
description = "Elm 邮件客户端（2.5.5 及更早版本）存在缓冲区溢出漏洞。远程攻击者可通过发送包含超长 Message-ID 头部的特制电子邮件触发该漏洞，无需身份认证即可在目标系统上执行任意代码。该漏洞影响所有使用 Elm 2.5.5 及之前版本的用户，攻击条件宽松，利用方式简单，危害等级较高。漏洞于 2002 年 4 月 1 日由 NVD 正式发布。"
published = "2002-04-01T05:00:00Z"
remediation = "立即升级到 Elm 2.14 或更高版本，完全修复缓冲区溢出漏洞；修改 /etc/elm/elm.rc 文件，禁用自动加载主题功能并限制 Message-ID 头部长度至 1024 字节以下；如无法立即升级，可通过 iptables 策略阻止源端口 143 的SMTP流量进行临时缓解"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Elm 2.5.5 缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:55:43Z"

