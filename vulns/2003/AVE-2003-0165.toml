[basic]
description = "Zebra 0.93b 及更早版本、以及 Quagga 0.95 之前的版本存在拒绝服务漏洞。该漏洞源于本地用户能够伪造其他用户身份向内核 netlink 接口发送特制消息，触发资源管理错误（CWE-399），导致路由服务进程异常终止或系统不可用。攻击者需具备目标系统的本地访问权限，无需额外身份认证即可发起攻击。该漏洞影响运行上述版本 Zebra 或 Quagga 路由软件的 Unix/Linux 系统，成功利用将导致路由服务中断，进而影响网络连通性和数据传输。"
published = "2003-12-15T05:00:00Z"
remediation = "将 Zebra 升级至 0.94 或更高版本，或迁移至 Quagga 0.95 及以上版本，以修复内核 netlink 接口允许本地用户伪造消息导致拒绝服务的漏洞。Red Hat 系统应安装 RHSA-2003-305、RHSA-2003-307、RHSA-2003-315 安全更新，Debian 系统应应用 DSA-415 安全公告补丁。如暂时无法升级，可通过限制本地用户对路由守护进程的访问权限或禁用不必要的 netlink 接口通信作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Zebra 及 Quagga 路由守护进程拒绝服务漏洞"
updated = "2026-06-16T22:03:05Z"

