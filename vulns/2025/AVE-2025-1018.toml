[basic]
description = "Linux 内核 drop_monitor 模块存在资源初始化顺序不当漏洞。当 drop_monitor 以内核模块形式加载时，若在 spinlock 自旋锁完成初始化之前收到 netlink NET_DM_CMD_START 消息，会触发使用未初始化内存的错误，导致内核出现 spinlock bad magic BUG 并引发系统崩溃或内核 panic。该漏洞影响运行受影响 Linux 内核版本并使用 drop_monitor 内核模块的系统，CVSS 评分 5.5，危害等级中等。本地低权限攻击者可在模块加载窗口期内发送特制的 netlink 消息触发此漏洞，造成拒绝服务。Linux 内核社区已将资源初始化移至 generic netlink 族注册之前以修复此问题。"
published = "2025-03-12T10:15:19Z"
remediation = "tags.<value>建议立即升级 Linux 内核至已修复版本：5.4.291、5.10.235、5.15.179、6.1.130、6.6.80、6.12.17 或 6.13.5 及更高版本。该漏洞位于 net/core/drop_monitor.c，因 drop_monitor 内核模块在 generic netlink family 注册之前未完成 spinlock 初始化，导致本地低权限用户可在模块加载期间触发竞态条件，造成内核崩溃（拒绝服务）。如暂无法立即升级，可执行 rmmod drop_monitor 卸载该模块，或将 blacklist drop_monitor 写入 /etc/modprobe.d/disable-drop-monitor.conf 阻止其自动加载作为临时缓解。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel drop_monitor 未初始化资源拒绝服务漏洞"
updated = "2026-06-17T08:44:28Z"

