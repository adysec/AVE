[basic]
description = "Mozilla Firefox、Thunderbird 及 SeaMonkey 的 gfxTextRun::CanBreakLineBefore 函数中存在释放后使用漏洞。未经身份认证的远程攻击者可通过构造特制的恶意内容触发该漏洞，导致堆内存损坏，进而执行任意代码或造成应用程序拒绝服务。该漏洞影响 Firefox 15.0 之前版本、Firefox ESR 10.0.7 之前版本、Thunderbird 15.0 之前版本、Thunderbird ESR 10.0.7 之前版本以及 SeaMonkey 2.12 之前版本。攻击者通过诱导用户浏览恶意网页或打开恶意邮件即可利用此漏洞，无需任何身份验证且攻击复杂度低，CVSS 评分 10.0，危害等级严重。"
published = "2012-08-29T10:56:40Z"
remediation = "立即将 Firefox 升级至 15.0 或更高版本，Firefox ESR 升级至 10.0.7 或更高版本，Thunderbird 升级至 15.0 或更高版本，Thunderbird ESR 升级至 10.0.7 或更高版本，SeaMonkey 升级至 2.12 或更高版本。如暂无法升级，建议暂时禁用 JavaScript 并避免访问未知网站作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/SeaMonkey/Thunderbird 远程代码执行漏洞"
updated = "2026-06-16T23:40:43Z"

