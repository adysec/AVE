[basic]
description = "Better Auth 的 @better-auth/sso 插件存在授权绕过漏洞，POST /sso/register 端点在注册 SSO 提供者时仅检查调用者是否具有组织成员身份，但未验证其是否具备管理员或所有者角色。攻击者利用此漏洞可在未获管理员授权的情况下，将恶意 OIDC 或 SAML 身份提供者绑定到其所属组织，随后通过 /sso/callback/{providerId} 回调将 IdP 断言的用户自动添加至目标组织，默认角色为成员。若组织配置了 organizationProvisioning.defaultRole 为 admin，攻击者还可创建具有管理员权限的用户。该漏洞影响 @better-auth/sso 版本 1.2.10 至 1.6.10（含），已在 1.6.11 版本中修复。"
published = "2026-07-15T18:16:47Z"
remediation = "立刻升级 @better-auth/sso 至 1.6.11 或更高版本，该版本在 registerSSOProvider 中补充了对调用者管理员或所有者角色的校验逻辑。若暂无法立即升级，可临时将 sso 插件配置中的 providersLimit 设为 0 以禁止新增 SSO 提供者，同时通过 organizationProvisioning.defaultRole 配置限制自动用户配置默认角色为最低权限，确保仅可信管理员可开通 SSO 登录。"
score = 7.1
severity = "HIGH"
sources = ["ghsa"]
title = "Better Auth SSO 权限绕过漏洞"
updated = "2026-07-21T15:38:36Z"

