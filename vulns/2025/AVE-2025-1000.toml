[basic]
description = 'Linux 内核 fbdev omap 驱动的 LCD DMA 中断处理程序在原子上下文中执行时调用了可能导致睡眠的互斥锁函数（如 clk_prepare_lock），当触摸屏与帧缓冲设备同时使用时，在 Nokia 770 等采用 OMAP 处理器的设备上会触发 "BUG: scheduling while atomic" 内核 panic，导致系统崩溃或拒绝服务。该漏洞影响运行受影响内核版本的本地用户，攻击者需要具备本地访问权限，通过触发 LCD DMA 中断处理流程即可利用该漏洞，造成系统不可用。CVSS 评分 5.5，危害等级为中危。'
published = "2025-02-27T20:16:04Z"
remediation = "升级 Linux 内核至修复版本（如 6.1.129、6.6.79、6.12.16、6.13.4 或更高版本），该补丁将 LCD DMA 中断处理程序改为 threaded IRQ 以修复原子上下文中的调度问题。Ubuntu 22.04/24.04 LTS 用户应执行标准系统更新并重启计算机。注意内核 ABI 变更后需重新编译并安装所有第三方内核模块，或在防火墙/启动参数中暂时禁用 framebuffer 驱动作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 OMAP fbdev LCD DMA 驱动调度错误拒绝服务漏洞"
updated = "2026-06-17T08:44:22Z"

