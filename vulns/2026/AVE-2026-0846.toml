[basic]
description = "protobufjs 在解析 .proto 文件中的选项名称时存在无限循环漏洞。该库在解析过程中通过逐个读取 schema token 直到遇到 `=` 号来提取选项名，但未对输入结束进行边界检查。攻击者可以构造一个声明了选项但提前结束的恶意 .proto 文件，通过 `parse`、`Root.load` 或 `Root.loadSync` 等 API 触发解析，导致解析器陷入无限循环。由于 Node.js 采用单线程事件循环模型，该漏洞会造成事件循环阻塞，使进程无法响应任何其他请求，直至被外部终止，从而导致拒绝服务。攻击者无需身份认证即可远程利用，影响使用 protobufjs 7.6.5 之前版本及 8.6.6 之前版本的应用。建议升级至 7.6.5 或 8.6.6 及以上版本修复。"
published = "2026-07-08T16:16:34.363"
remediation = "将 protobufjs 升级至 7.6.5 或 8.6.6 及以上版本。如无法立即升级，避免解析来自不可信来源的 .proto 文件；若必须解析，将解析操作隔离到独立子进程或 Worker 线程中并设置超时机制，防止解析卡死阻塞主事件循环。"
score = 5.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "protobufjs .proto 选项解析无限循环拒绝服务漏洞"
updated = "2026-07-10T18:53:14.377"

