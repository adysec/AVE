[basic]
description = "Mozilla Firefox 4.x 至 5 版本、Thunderbird 6.0 之前版本及 SeaMonkey 2.x（2.3 之前）的浏览器引擎中存在多个内存安全漏洞。远程攻击者可通过诱导用户访问精心构造的恶意网页，触发内存损坏，导致应用程序崩溃或在目标系统上执行任意代码。该漏洞影响范围广泛，由于涉及内存管理缺陷，攻击者能够在未经身份验证的情况下实现远程代码执行，具有极高的安全风险。"
published = "2011-08-18T18:55:01Z"
remediation = "建议将 Mozilla Thunderbird 升级至 6.0 或更高版本，Mozilla Firefox 升级至 6.0 或更高版本，SeaMonkey 升级至 2.3 或更高版本，以修复浏览器引擎中的内存破坏漏洞并防止远程代码执行。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 浏览器引擎内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:32:22Z"

