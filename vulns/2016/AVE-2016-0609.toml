[basic]
description = "Cisco ASA（Adaptive Security Appliance）及 PIX 防火墙设备在处理无效 CLI 命令时存在本地权限提升漏洞（EPICBANANA）。具有低权限的本地攻击者可通过向受影响设备发送特制的无效 CLI 命令，利用命令注入漏洞以更高权限执行任意代码，从而完全控制目标系统。该漏洞影响 ASA 5500/5500-X、PIX 及 FWSM 系列设备上 8.4(1) 之前版本的软件，CVSS 评分 7.8，危害等级高。Cisco 已发布安全公告（Bug ID CSCtu74257）建议用户升级至 8.4(1) 或更高版本以修复此漏洞。"
published = "2016-08-18T18:59:01Z"
remediation = "建议升级 Cisco ASA 软件至 8.4(1) 及以上版本，或安装 Cisco 针对 CSCtu74257 发布的安全补丁。同时限制 CLI 管理访问权限，仅允许受信管理员登录，并启用 AAA 认证与命令授权审计。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Cisco ASA/PIX 本地权限提升漏洞"
updated = "2026-06-17T00:50:54Z"

