[basic]
description = "Internet Explorer 5.0 至 5.5 中用于调用 scriptlet 的 ActiveX 控件存在安全缺陷，该控件会以原始文件形式而非 HTML 格式渲染内容，导致未经身份认证的远程攻击者可通过构造恶意网页诱使用户访问，从而读取目标系统上的任意文件。该漏洞属于变体的 Scriptlet Rendering 漏洞，CVSS 评分 2.6，攻击条件较苛刻，需要用户主动访问恶意页面才能触发。"
published = "2001-02-16T05:00:00.000"
remediation = "安装 Microsoft 安全更新补丁 KB279328（IE 5.01 SP1）或 KB279329（IE 5.5 SP1），或直接升级到 IE 5.5 SP2 / IE 5.01 SP2。如暂无法打补丁，可在 Internet 安全区域禁用 ActiveX 控件及脚本执行作为临时缓解措施。"
score = 2.6
severity = "LOW"
sources = ["epss"]
title = "Microsoft Internet Explorer 任意文件读取漏洞"
updated = "2026-06-16T21:53:38.340"

