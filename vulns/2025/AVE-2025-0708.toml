[basic]
description = "Windows 数字媒体组件存在越界读取漏洞，具有低权限的攻击者通过物理方式访问目标系统后，可利用特制应用程序触发该漏洞，实现权限提升至 SYSTEM 级别。该漏洞影响 Windows 10/11 及 Windows Server 多个版本，CVSS 评分 6.6，危害等级中危。成功利用此漏洞的攻击者可获取系统完全控制权，包括读取敏感数据、修改系统配置及执行任意操作。Microsoft 已在 2025 年 1 月安全更新中发布修复补丁。"
published = "2025-01-14T18:15:42Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 (KB5050061)，可通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。受影响版本包括 Windows 10/11 及 Windows Server 2008 至 2025 全系列，更新后各版本对应修复版本号：Win10 1507 需升级至 10.0.10240.20890、Win10 1607/Server 2016 需升级至 10.0.14393.7699、Win10 1809/Server 2019 需升级至 10.0.17763.6775、Win11 22H2/23H2 需升级至 10.0.22621.4751 或 10.0.22631.4751、Win11 24H2/Server 2025 需升级至 10.0.26100.2894。如无法立即打补丁，建议限制物理访问权限以降低本地提权攻击面。"
score = 6.6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 数字媒体特权提升漏洞"
updated = "2026-06-17T08:42:53Z"

