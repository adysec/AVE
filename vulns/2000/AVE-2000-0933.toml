[basic]
description = "htDig 是一款用于网站全文搜索的开源索引和检索工具，其 htsearch 程序在处理用户请求时存在信息泄露漏洞。远程攻击者无需身份验证，即可通过向 htsearch 程序发送包含恶意 config 参数的 HTTP 请求，该参数用于指定 htDig 的配置文件路径。当请求一个不存在的配置文件时，htsearch 会向客户端返回详细的错误消息，其中包含服务器物理文件系统的完整路径信息。该漏洞影响 htDig 3.2 beta、3.1.6、3.1.5 及更早版本，利用方式简单直接，攻击者仅需构造一个带有无效 config 参数的 URL 即可触发。成功利用后，攻击者可获取服务器文件路径等敏感信息，为后续针对性的路径遍历、文件包含或其他攻击提供重要依据，进而可能进一步威胁 Web 服务器的整体安全。建议用户尽快升级至修复版本并检查配置文件访问权限设置。"
published = "2001-08-31T04:00:00Z"
remediation = "建议将 htDig 升级至 3.2 beta 之后的稳定版本。若无法升级，可通过 Web 服务器（如 Apache）配置自定义错误页面，屏蔽详细的服务器端错误信息，防止物理路径泄露。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "htDig htsearch 信息泄露漏洞"
updated = "2026-06-16T21:53:20Z"

