[basic]
description = "SafeInstall CLI 0.10.1 及之前版本的 agent guard 存在 shell 命令解析缺陷，无法正确识别部分包管理器和注册中心运行器命令，攻击者可构造特制的 shell 命令绕过守卫的 deny/ask 响应机制。该漏洞影响 SafeInstall CLI 0.10.1 及之前版本，攻击条件需诱使编码代理执行攻击者影响的指令并发出特制 shell 命令，成功利用后恶意包或运行器会以开发者账户权限执行，影响本地源代码、凭证和开发资源的机密性、完整性和可用性。"
published = ""
