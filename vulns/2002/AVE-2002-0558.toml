[basic]
description = "ISC BIND 8.3.x 至 8.3.3 版本存在拒绝服务漏洞。远程攻击者可通过向 DNS 服务器发送包含超大 UDP 负载的 OPT 资源记录（EDNS0）的特定子域名查询请求，触发断言失败导致 BIND 进程异常终止，造成服务不可用。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响运行上述版本 BIND 的 DNS 服务器系统。ExploitDB 已公开 PoC 利用代码。"
published = "2002-11-29T05:00:00.000"
remediation = "升级 ISC BIND 至 8.3.4 或更高版本（8.3.x 系列已停止维护，建议迁移至 BIND 9.x 系列）。如无法立即升级，可在防火墙或网络边界限制对 DNS 服务器的外部访问，仅允许可信源发起 DNS 查询，并限制 UDP 大包通过以缓解风险。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "ISC BIND 8.3.x OPT记录大UDP载荷拒绝服务漏洞"
updated = "2026-06-16T21:58:57.277"

