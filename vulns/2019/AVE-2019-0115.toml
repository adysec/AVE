[basic]
description = "WordPress 插件 Motors - Car Dealer & Classified Ads（motors-car-dealership-classified-listings）1.4.0 及以下版本的 includes/options.php 文件存在数据真实性验证不足漏洞。由于该文件在处理选项更新时未对请求进行有效的身份认证和完整性校验，未经身份验证的远程攻击者可直接发送特制 HTTP 请求修改插件配置选项，导致网站功能被篡改或内容被注入。该漏洞影响使用该插件的 WordPress 网站，攻击者可利用其进行配置篡改、内容劫持等恶意操作。CVSS 评分为 6.5，危害等级为中等。"
published = "2020-02-24T19:15:13Z"
remediation = "立即将 Motors – Car Dealer & Classified Ads 插件升级到 1.4.1 或更高版本（当前最新 1.4.114），官方在 1.4.1 中已修复 includes/options.php 的选项修改验证缺失问题。升级路径：进入 WordPress 后台「插件」→「已安装的插件」，找到 Motors – Car Dealership & Classified Listings 并点击「立即更新」。如后台无更新提示，可下载最新 zip 包后通过「上传插件」覆盖安装。临时缓解措施：在网站根目录 .htaccess 或 Nginx 配置中，限制对 /wp-admin/admin-ajax.php 和 includes/options.php 的未认证 POST 请求，阻断未授权选项修改。"
score = 6.5
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Motors Car Dealer & Classified Ads 插件身份验证绕过漏洞"
updated = "2026-06-17T02:23:30Z"

