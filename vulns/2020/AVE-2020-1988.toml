[basic]
description = "Adobe Acrobat和Reader存在使用后释放（use-after-free）漏洞，影响2020.009.20074及之前版本、2020.001.30002、2017.011.30171及之前版本以及2015.006.30523及之前版本。攻击者可通过诱导用户打开特制的PDF文件触发该漏洞，在当前进程中执行任意代码。CVSS评分为7.8，属于高危漏洞。"
published = "2020-08-19T14:15:13.407"
remediation = '立即将 Adobe Acrobat/Reader 升级至 2020.009.20075 或更高版本（2020 分支）、2017.011.30172 或更高版本（2017 分支）、2015.006.30524 或更高版本（2015 分支），这些版本已修复 use-after-free 漏洞。通过 Adobe Creative Cloud 自动更新或手动下载安装最新安全补丁。临时缓解措施：在 Adobe Reader 中禁用 JavaScript（编辑 → 首选项 → JavaScript → 取消勾选"启用 Acrobat JavaScript"），可阻止利用链触发，但会降低部分表单功能。确保操作系统和所有软件保持最新，及时应用安全更新。'
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Adobe Acrobat和Reader 使用后释放远程代码执行漏洞"
updated = "2026-06-17T03:28:26.997"

