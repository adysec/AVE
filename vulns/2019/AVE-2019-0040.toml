[basic]
description = "Nimble Streamer 3.0.2-2 至 3.5.4-9 版本存在目录遍历漏洞（CWE-22）。攻击者可在 HTTP 请求 URL 中构造 `../` 序列，绕过路径限制访问服务器上任意文件，如 `/etc/passwd` 等敏感系统文件。该漏洞源于软件对用户输入的文件路径缺乏充分的规范化处理，未正确限制路径名。攻击者只需拥有低权限会话（如有效的 nimblesessionid），即可通过特制的 HTTP GET 请求远程利用，无需用户交互。成功利用可导致敏感信息泄露，影响系统机密性。Softvelum 官方建议升级至 3.5.4-9 以上版本修复。"
published = "2019-08-22T15:15:12.093"
remediation = "立即将 Nimble Streamer 升级至 3.5.4-10 或更高版本，该版本已修复文件路径过滤不严导致的目录遍历问题。如无法立即升级，可在 Web 服务器或反向代理层配置请求路径白名单，拦截包含 `../` 的 URL 请求，并限制 `nimblesessionid` 参数中特殊字符的传入。"
score = 6.5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Nimble Streamer 目录遍历漏洞"
updated = "2026-06-17T02:12:07.383"

