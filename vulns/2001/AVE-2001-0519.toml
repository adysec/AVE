[basic]
description = "Linux 内核 2.2.19 之前版本的 System V (SYS5) 共享内存实现存在释放后重用漏洞。本地攻击者可通过系统调用操作共享内存段，在内存被释放后仍能访问并修改该内存区域的内容，导致内核内存损坏。攻击者需要拥有本地系统访问权限，无需身份认证即可利用此漏洞，可能造成系统数据完整性破坏。该漏洞影响 Linux 2.2.19 之前的所有内核版本。"
published = "2001-04-17T04:00:00Z"
remediation = "立即升级 Linux 内核至 2.2.19 或更高版本，该版本已修复 System V 共享内存释放后使用问题。如无法升级，可禁用 System V 共享内存（sysctl -w kernel.sysvshm_enabled=0）或限制本地用户对 shmget/shmat 系统调用的访问权限作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Linux Linux内核 System V共享内存释放后使用漏洞"
updated = "2026-06-16T21:56:11Z"

