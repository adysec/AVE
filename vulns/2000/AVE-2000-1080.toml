[basic]
description = "Microsoft SQL Server 2000及SQL Server Desktop Engine（MSDE）中的xp_SetSQLSecurity函数在调用srv_paraminfo函数前未正确限制缓冲区长度，导致扩展存储过程参数解析漏洞。未经身份认证的本地攻击者可利用此漏洞触发拒绝服务或执行任意命令。该漏洞影响SQL Server 2000和MSDE相关版本，CVSS评分为4.6，危害等级中等。Microsoft已发布安全公告修复此问题，建议用户及时升级至已修补版本。"
published = "2001-01-09T05:00:00.000"
remediation = "立即安装微软安全公告 MS00-092 对应的补丁程序（KB280380），或升级至 SQL Server 2000 Service Pack 1 / SQL Server 7.0 Service Pack 3。补丁通过确保扩展存储过程在调用 srv_paraminfo() 前分配足够大小的缓冲区来修复缓冲区溢出漏洞。同时，将 SQL Server 服务账户配置为普通用户而非管理员账户，以限制漏洞被利用后的权限提升风险。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft SQL Server 2000 扩展存储过程参数解析拒绝服务漏洞"
updated = "2026-06-16T21:53:07.447"

