[basic]
description = "Sun Java Web Server 管理模块存在远程代码执行漏洞。攻击者可通过向管理模块上传恶意 Java 代码，然后请求以 /servlet/ 开头的 URL 调用 com.sun.server.http.pagecompile.jsp92.JspServlet，从而在服务器上执行任意命令。该漏洞无需身份认证即可远程利用，CVSS 评分 10.0，可导致服务器完全被控制，影响范围包括 Sun Java Web Server 所有受影响版本。"
published = "2000-11-14T05:00:00.000"
remediation = "立即安装 Sun 安全公告 #197 提供的补丁，或升级到 Sun Java Web Server 的修复版本。如产品已停止支持（EOL），建议迁移至 Oracle iPlanet Web Server 或 Apache Tomcat 等受支持产品，并在防火墙层面限制对管理模块（/servlet/）的访问。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Sun Java Web Server 代码执行漏洞"
updated = "2026-06-16T21:52:31.923"

