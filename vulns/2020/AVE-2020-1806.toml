[basic]
description = "Citrix ADC 和 Citrix Gateway 存在访问控制不当漏洞，未经身份认证的远程攻击者可通过发送特制 HTTP 请求访问系统中特定 URL 端点，绕过正常身份验证流程获取敏感配置信息。该漏洞影响 Citrix ADC 和 Citrix Gateway 的多个版本（13.0-58.30 之前、12.1-57.18 之前、12.0-63.21 之前、11.1-64.14 之前及 10.5-70.18 之前版本），以及 Citrix SDWAN WAN-OP 的 11.1.1a 之前、11.0.3d 之前和 10.2.7 之前版本。攻击者无需任何凭据即可在低复杂度条件下远程利用此漏洞，成功利用可能导致系统敏感信息泄露，CVSS 评分 6.5。Citrix 官方已发布对应版本的安全更新修复此访问控制缺陷。"
published = "2020-07-10T16:15:12Z"
remediation = "立即升级 Citrix ADC 和 Citrix Gateway 至 13.0-58.30、12.1-57.18、12.0-63.21、11.1-64.14 或 10.5-70.18 及更高版本，Citrix SDWAN WAN-OP 升级至 11.1.1a、11.0.3d 或 10.2.7 及更高版本。如无法立即升级，建议在防火墙或反向代理层面限制对 NetScaler IP (NSIP) 的访问，仅允许可信 IP 访问相关 URL 端点，并监控日志中未经授权的访问尝试。"
score = 6.5
severity = "MEDIUM"
sources = ["kev"]
title = "Citrix ADC 及 Gateway 身份认证绕过漏洞"
updated = "2026-06-17T03:26:01Z"

