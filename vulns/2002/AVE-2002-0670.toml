[basic]
description = 'Microsoft IIS 5.0 中的 CodeBrws.asp 脚本存在目录遍历漏洞。攻击原理是：IIS 的 Unicode 解析机制将十六进制编码的 "%c0%ae%c0%ae" 错误解释为路径分隔符 ".."，从而绕过目录访问限制。未经身份认证的远程攻击者可通过向该脚本发送包含恶意编码路径的请求，读取服务器上任意文件的源代码，进而获取数据库连接字符串、配置文件等敏感信息，为后续入侵提供线索。该漏洞影响安装 IIS 5.0 的 Windows 2000 服务器，攻击条件仅需目标服务器开启 IIS 服务且 CodeBrws.asp 可访问，无需身份验证即可直接利用，危害等级为中等。'
published = "2002-12-31T05:00:00Z"
remediation = '立即为受影响的 Windows 2000 系统安装 Microsoft 安全公告 MS02-062 累积补丁（KB327696），或升级至 Windows 2000 Service Pack 4 / Windows XP Service Pack 2，以上版本已包含该漏洞修复。如无法立即安装补丁，可先运行 IIS 锁定工具（IIS Lockdown Tool）禁用示例脚本，或手动删除 IIS 示例站点中的 CodeBrws.asp 文件（路径 /IISSamples/sdk/asp/docs/CodeBrws.asp），同时配置 URLScan 工具阻止包含 "%c0%ae" 的 Unicode 编码请求，并在防火墙层面限制外部对 /IISSamples 虚拟目录的访问，以防止攻击者通过该脚本泄露服务器源代码和目录结构信息。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "微软 IIS 5.0 CodeBrws.asp 源代码泄漏漏洞"
updated = "2026-06-16T21:59:54Z"

