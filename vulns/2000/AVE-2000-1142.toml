[basic]
description = "Windows NT 系统的本地安全认证（LSA）服务存在信息泄露漏洞。未经身份验证的远程攻击者可通过建立空会话（null session）的方式，调用 LsaQueryInformationPolicy 策略函数获取域安全标识符（SID），并利用该 SID 枚举出目标域中的所有用户账户信息。该漏洞无需任何身份认证即可利用，攻击者仅需能够网络访问运行 Windows NT 的域控制器或成员服务器的 IPC$ 共享端口（TCP 445/139），即可在不被察觉的情况下完整获取域用户列表，为后续的密码破解、权限提升或横向渗透攻击奠定基础。此漏洞影响所有启用空会话连接的 Windows NT 系统，CVSS v2 评分为 5.0（中等），主要危害为机密信息泄露。"
published = "2001-08-31T04:00:00Z"
remediation = '安装 Microsoft Windows NT 4.0 安全补丁（Security Bulletin MS01-044，适用于 Service Pack 6a），或通过 Windows Update 自动更新。如无法立即打补丁，可通过注册表限制空会话：将 HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\LSA 下的 RestrictAnonymous 值设为 1（或 2 以完全禁用匿名枚举），并删除 NullSessionShares 和 NullSessionPipes 注册表项，然后重启系统。作为临时缓解措施，在防火墙或路由器上阻断 TCP 139、445 和 UDP 137、138 端口，阻止外部攻击者建立空会话。建议同时升级到 Windows 2000 或更高版本以获得完整防护。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows NT 域用户信息泄露漏洞"
updated = "2026-06-16T21:53:21Z"

