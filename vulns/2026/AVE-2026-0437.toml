[basic]
description = "brace-expansion 库的 expand() 函数在展开大括号表达式时，仅限制了结果数量（默认 max=100,000）而未限制单个结果的长度。攻击者可通过构造大量嵌套的大括号组（如 '{a,b}'.repeat(1500)），使每个结果字符串随组数线性增长，导致内存消耗呈 max×N 量级膨胀，最终触发 V8 引擎不可捕获的致命内存溢出错误，造成 Node.js 进程崩溃。该漏洞影响所有使用 brace-expansion 直接或间接（通过 minimatch/glob 等）处理用户输入大括号模式的应用，CVSS 评分 7.5，危害等级高危。攻击者仅需发送约 7.5 KB 的恶意输入即可触发拒绝服务，且由于是致命错误而非可捕获异常，try/catch 无法防护。"
published = "2026-01-01T00:00:00Z"
remediation = "升级 brace-expansion 至 5.0.8 或更高版本，该版本新增 `maxLength` 选项（默认 4,000,000），在输出构建循环中限制单次 `expand()` 调用的总字符数，防止内存耗尽。如无法立即升级，调用 `expand()` 时传入显式的 `max` 和 `maxLength` 选项限制结果数量和总长度，并避免将不可信用户输入传递给 `expand()` 或 glob 大括号模式。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "juliangruber brace-expansion 大括号展开无限制长度导致内存耗尽拒绝服务漏洞"
updated = "2026-01-01T00:00:00Z"

