[basic]
description = "SonicWALL SOHO Firewall 4.0/5.0 版本的 Web 管理界面存在拒绝服务漏洞。远程攻击者无需身份认证，通过向目标设备发送特制的空 GET 或 POST HTTP 请求，可导致 Web 服务器进程崩溃，造成管理界面不可用，影响设备正常管理。该漏洞攻击复杂度低，无需用户交互，仅需网络访问即可触发。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 SonicWALL SOHO 防火墙固件至 5.0.0.3 及以上版本（该漏洞在 5.0.0.3 中修复）。如无法升级，在防火墙管理界面中关闭 Web 管理功能（仅通过串口或 SSH 管理），或在网络层面限制对防火墙 Web 管理端口（默认 80/443）的访问来源 IP，仅允许受信任的管理员 IP 连接。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "SonicWALL SOHO Firewall 4.0/5.0 Web服务器空请求拒绝服务漏洞"
updated = "2026-06-16T21:53:08Z"

