[basic]
description = "WebKit引擎存在内存破坏漏洞，攻击者可通过构造恶意网页触发该漏洞，在目标系统上执行任意代码或导致拒绝服务（内存损坏和应用程序崩溃）。该漏洞影响iOS 5.1之前版本及iTunes 10.6之前版本，无需用户交互即可利用，CVSS评分9.3，危害等级严重。Apple已在2012年3月安全更新中修复此漏洞。"
published = "2012-03-08T22:55:01Z"
remediation = "升级 Safari 浏览器至 5.1.4 或更高版本；将 iOS 设备系统升级至 5.1 或更高版本；将 iTunes 客户端升级至 10.6 或更高版本。安装 Apple 2012 年 3 月发布的安全更新（APPLE-SA-2012-03-07-1 及 APPLE-SA-2012-03-07-2）以修复 WebKit 内存破坏漏洞。临时缓解措施包括避免访问不可信网站、禁用 WebKit 渲染的第三方插件，并启用 XSS 筛选器降低跨站脚本攻击风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple iOS 及 iTunes WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:32:09Z"

