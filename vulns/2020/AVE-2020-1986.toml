[basic]
description = "ZyXEL NAS 操作系统存在预认证命令注入漏洞，设备固件版本 5.21 及之前版本中的 weblogin.cgi CGI 程序未对用户名参数进行充分过滤与转义，攻击者可在 HTTP POST 或 GET 请求的 username 字段中嵌入恶意命令字符，从而在 Web 服务器进程权限下执行任意系统命令。由于 ZyXEL 设备包含 setuid 权限工具，攻击者可借此提升权限至 root，实现完全控制。该漏洞无需身份认证即可利用，攻击者可通过直接连接目标设备或诱导用户访问恶意网页等方式触发漏洞，影响 NAS326、NAS520、NAS540、NAS542 等多个型号，已被收录于 CISA 已知利用漏洞目录。"
published = "2020-03-04T20:15:10.750"
remediation = "立即将所有受影响 ZyXEL NAS 设备（NAS326、NAS520、NAS540、NAS542）升级到 ZyXEL 官方发布的最新固件版本 5.21 或更高版本，升级后必须禁用默认匿名管理员账户并修改默认密码。如无法立即升级，可通过防火墙规则阻止对设备 wan 口 80/443 端口的外部访问，并在设备 Web 界面删除或禁用易受攻击的 username 参数处理功能。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "ZyXEL NAS 操作系统预认证命令注入漏洞"
updated = "2026-06-17T03:27:24.760"

