[basic]
description = "RealNetworks RealPlayer 的 rjrmrpln.dll 组件在处理媒体文件中的逻辑流时，未能正确验证 Name Value Property (NVP) 元素内容，导致堆缓冲区交互过程中存在输入验证缺陷。远程攻击者可通过构造包含恶意 NVP 元素的特制媒体文件，诱使用户在受影响版本（RealPlayer 11.0~11.1、RealPlayer SP 1.0~1.1.4、RealPlayer Enterprise 2.1.2）中打开，从而触发堆缓冲区溢出，实现远程代码执行。攻击成功后，攻击者可获取与当前用户相同的系统权限，完全控制目标主机。该漏洞 CVSS 评分 9.3，危害等级严重，无需身份认证即可利用，但需要用户交互（如打开恶意文件）。"
published = "2010-10-19T00:00:01Z"
remediation = "立即升级 RealPlayer 至 SP 12.0.0.879 或更高版本（RealPlayer 11.x 用户应升级至 12.x 系列），RealPlayer Enterprise 2.1.2 用户请联系厂商获取安全补丁。如无法立即升级，建议在浏览器中禁用 RealPlayer ActiveX 控件，或通过组策略限制 rjrmrpln.dll 的加载，同时避免打开来源不明的媒体文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer 堆缓冲区验证远程代码执行漏洞"
updated = "2026-06-16T23:23:26Z"

