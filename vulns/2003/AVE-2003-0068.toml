[basic]
description = "Linux 内核 2.4.20 及更早版本中的 ioperm 系统调用未能正确限制进程权限，导致本地普通用户可调用 ioperm() 获取对特定 I/O 端口的读写访问权限。攻击者利用此漏洞可绕过权限检查直接操作硬件设备，进而实现权限提升或敏感信息泄露。攻击前提是拥有本地系统访问权限，无需身份认证即可触发。"
published = "2003-06-16T04:00:00.000"
remediation = "立即升级 Linux 内核至 2.4.21 或更高版本，该版本已修复 ioperm 系统调用权限检查不严的问题。如无法升级内核，可通过 SELinux 或 grsecurity 等强制访问控制机制限制本地用户调用 ioperm 的权限，或在系统层面移除不需要的 setuid 二进制文件以降低本地提权风险。"
score = 3.6
severity = "LOW"
sources = ["redhat"]
title = "Linux Kernel ioperm 系统调用权限提升漏洞"
updated = "2026-06-16T22:01:49.670"

