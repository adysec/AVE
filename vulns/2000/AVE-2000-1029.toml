[basic]
description = "OpenBSD 2.7 的 IPsec 实现中存在空数据包处理缺陷，远程攻击者可通过向目标系统发送特制的空 AH（认证头）或 ESP（封装安全载荷）数据包触发该漏洞，导致 IPsec 协议栈崩溃，造成拒绝服务。攻击无需认证，攻击复杂度低，CVSS 评分 5.0，危害等级中等。受影响的系统包括 OpenBSD 2.7 版本，建议升级至更新版本以修复此问题。"
published = "2000-12-19T05:00:00.000"
remediation = "立即升级至 OpenBSD 2.8 或更高版本。如无法升级，可下载 OpenBSD 2.7 errata 024 补丁（https://ftp.openbsd.org/pub/OpenBSD/patches/2.7/common/024_esp.patch），以 root 执行 `patch -p0 < 024_esp.patch && cd /sys && make config && make && make install && reboot` 重新编译内核。临时缓解措施可在 IPsec 策略中过滤空 AH/ESP 数据包。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "OpenBSD IPsec 空 AH/ESP 数据包拒绝服务漏洞"
updated = "2026-06-16T21:52:51.863"

