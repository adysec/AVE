[basic]
description = "Windows Search 服务存在权限提升漏洞，由于该服务对用户输入的对象验证不足，低权限攻击者可登录目标系统后通过运行特制程序触发漏洞，利用该漏洞获取 SYSTEM 权限。成功利用此漏洞的攻击者可执行任意代码，并完全控制受影响系统。该漏洞影响多个 Windows 版本，Microsoft 已在 2025 年 1 月安全更新中修复。"
published = "2025-01-14T18:15:50Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 (KB5049981)，或通过 Windows Update 自动更新。如无法立即打补丁，可在服务管理控制台 (services.msc) 中将 Windows Search 服务启动类型改为「禁用」并停止该服务，作为临时缓解措施。注意禁用搜索服务会影响文件搜索功能。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Search Service 特权提升漏洞"
updated = "2026-06-17T08:43:00Z"

