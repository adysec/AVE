[basic]
description = 'Recourse ManTrap 1.6 蜜罐系统通过修改内核，使 /proc 目录列表中的 ".." 条目不再显示。未经身份认证的攻击者可以通过列出 /proc 目录并检测 ".." 条目的缺失，判断其正在与蜜罐环境交互而非真实生产系统。该漏洞影响使用 ManTrap 1.6 的蜜罐部署，攻击者只需具备基本系统访问权限即可通过简单的目录枚举操作识别蜜罐，从而规避监控或误导分析。'
published = "2001-01-09T05:00:00Z"
remediation = "升级到 Recourse ManTrap 2.0 版本，修复内核修改 /proc 列表隐藏目录条目的问题。由于 2.0 版本仍无法修复 crash 工具导致的进程枚举漏洞，部署 cage 后应立即禁用 cage 内的 crash 等调试工具，限制 cage 进程对外部进程的枚举权限，关闭不必要的调试接口，确保日志进程（rti_*）不被 cage 内进程终止，并设置内核级别的进程可见性限制，防止攻击者通过 /proc 目录枚举判断 honeypot 环境。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "Recourse ManTrap 蜜罐检测信息泄露漏洞"
updated = "2026-06-16T21:53:14Z"

