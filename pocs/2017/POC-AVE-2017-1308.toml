[info]
author = "ave"
description = "检测 DotNetNuke (DNN) CMS Cookie 反序列化 RCE 漏洞。通过发送特殊 Cookie 载荷到 /__ 端点来触发对象序列化漏洞。当目标系统使用受影响的 DNN 版本（< 9.1.1）并启用个人资料功能时，此漏洞可导致远程代码执行。"
id = "POC-AVE-2017-1308"
name = "CVE-2017-9822 PoC"
severity = "high"
tags = ["ave-2017-1308"]
vuln_id = [
    "CVE-2017-9822",
    "AVE-2017-1308",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/__"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "[extensions]",
    "for 16-bit app support",
]

[[poc.requests.matchers]]
expect = true
status = [404]
type = "status"
