[info]
author = "AVE"
description = "检测Mozilla Firefox 4.x至13.0及ESR 10.x至10.0.6版本中feed:javascript:URL跨站脚本漏洞"
id = "POC-AVE-2012-0230"
name = "CVE-2012-1965 PoC"
severity = "medium"
tags = ["ave-2012-0230"]
vuln_id = [
    "CVE-2012-1965",
    "AVE-2012-0230",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = [
    "Firefox/4.",
    "Firefox/5.",
    "Firefox/6.",
    "Firefox/7.",
    "Firefox/8.",
    "Firefox/9.",
    "Firefox/10.",
    "Firefox/11.",
    "Firefox/12.",
    "Firefox/13.0",
]
