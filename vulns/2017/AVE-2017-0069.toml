[basic]
description = "WordPress 的 contact-form-plugin 插件（版本低于 4.0.6）存在多个跨站脚本（XSS）漏洞。该漏洞源于插件未能对用户输入的数据进行充分的过滤与转义处理，导致攻击者可通过构造恶意的表单数据或参数注入任意 JavaScript 代码。当管理员或其他用户访问受影响的页面时，恶意脚本将在浏览器中执行，可能导致敏感信息泄露（如会话 Cookie）、页面内容篡改或钓鱼攻击。攻击者需要诱使用户点击恶意链接或访问特制页面，无需身份认证即可触发，影响范围涉及该插件的所有使用版本。"
published = "2019-08-13T17:15:13Z"
remediation = "升级 WordPress contact-form-plugin 至 4.0.6 或更高版本。如无法立即升级，可在 WordPress 后台禁用该插件，或通过 Web 应用防火墙（WAF）添加规则过滤 XSS 攻击载荷作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress contact-form-plugin插件跨站脚本漏洞"
updated = "2026-06-17T01:12:56Z"

