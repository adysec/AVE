[basic]
description = "ChakraCore 脚本引擎在处理内存对象时存在类型混淆漏洞。攻击者可以通过精心构造的 JavaScript 代码，在 JIT（即时编译）优化过程中触发 InitializeNumberFormat 或 InitializeDateTimeFormat 函数的类型推断错误，导致内存损坏。当受害者通过浏览器访问恶意网页时，攻击者可利用此漏洞实现远程代码执行。该漏洞影响使用 ChakraCore 的产品（如早期 Microsoft Edge），攻击条件为用户交互且需执行特定脚本，CVSS 评分为 7.5，危害等级为高。"
published = "2018-07-11T00:29:01Z"
remediation = "建议立即将 Microsoft Edge 或 Internet Explorer 浏览器更新至 2018 年 7 月的安全补丁版本。具体操作为通过 Windows Update 检查并安装最新的累积更新，或手动下载并安装对应的 KB 安全更新包以修复 ChakraCore 引擎的内存损坏漏洞。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Microsoft ChakraCore 脚本引擎远程代码执行漏洞"
updated = "2026-06-17T02:04:35Z"

