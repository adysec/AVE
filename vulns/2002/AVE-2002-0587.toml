[basic]
description = "Achievo 0.7.0 至 0.9.1 版本（不含 0.8.2）中的 class.atkdateattribute.js.php 文件存在远程文件包含与命令执行漏洞。攻击者可通过构造包含恶意 URL 的 config_atkroot 参数，在目标服务器启用 PHP allow_url_fopen 配置的情况下，将远程恶意 PHP 代码引入服务器并执行任意命令，从而完全控制目标系统。该漏洞无需身份认证即可被远程利用，CVSS v2 评分 7.5，危害等级为高危。受影响版本涵盖 Achievo 0.7.0、0.7.1、0.8.0、0.8.1、0.9.0 及 0.9.1，攻击者可借此获取服务器权限、窃取敏感数据或进一步渗透内网。建议升级至 0.8.2 或更新版本以修复该漏洞。"
published = "2003-04-11T04:00:00Z"
remediation = "建议将 Achievo 升级至 0.8.2 或更高版本（0.8.2 已修复该远程文件包含漏洞）。如无法立即升级，可在 PHP 配置文件 php.ini 中将 allow_url_fopen 设置为 Off，以阻止远程 URL 被当作文件包含；同时需验证 class.atkdateattribute.js.php 中 config_atkroot 参数的输入，确保其仅指向本地路径，不得传入外部 URL。升级完成后重启 Web 服务使配置生效。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Achievo 0.7/0.8/0.9 远程文件包含命令执行漏洞"
updated = "2026-06-16T21:59:19Z"

