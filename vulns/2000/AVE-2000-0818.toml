[basic]
description = "HP-UX 10.20 操作系统的资源监控服务 registrar 存在本地任意文件读取漏洞。该漏洞原理是 registrar 在记录日志时未对日志文件路径进行安全校验，本地攻击者可先将原始 registrar.log 日志文件重命名，再创建指向任意目标文件的符号链接，使 registrar 将日志信息追加写入该目标文件并设置全局可读权限。攻击条件为拥有本地系统访问权限，利用方式简单，可导致任意文件被读取或篡改，造成敏感信息泄露。CVSS 评分 3.6，危害等级低。"
published = "2001-01-09T05:00:00.000"
remediation = "立即应用 HP 官方安全补丁 PHNE_22779（适用于 HP-UX 10.20），或升级至已修复该漏洞的 HP-UX 11.00 及以上版本。如无法打补丁，可执行以下缓解措施：(1) 将 /etc/opt/resmon/log 目录权限改为 750 或更严格，防止非授权用户执行 mv 操作；(2) 在 /etc/inetd.conf 中注释 registrar 服务行并重启 inetd 以禁用该服务；(3) 使用 chmod 644 确保 registrar.log 文件创建时权限安全，并定期审计日志目录的符号链接。"
score = 3.6
severity = "LOW"
sources = ["epss"]
title = "HP HP-UX registrar 本地任意文件读取漏洞"
updated = "2026-06-16T21:53:12.403"

