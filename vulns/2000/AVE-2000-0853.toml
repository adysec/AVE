[basic]
description = "GCC 和 G++ 编译器 3.3.3 及更早版本中提供的 `-ftrapv` 编译选项存在整数溢出检测不完整的安全缺陷。该选项本应在检测到有符号整数加法、减法、乘法溢出时触发陷阱并调用 abort() 终止程序，但 libgcc 运行时库中的溢出检测例程（如 `__mulvsi3`、`__subvsi3` 等）实现了错误的检测算法，无法正确识别所有有符号整数溢出情形，尤其是乘法溢出在大量情况下无法被捕获。这意味着开发者使用 `-ftrapv` 选项编译应用程序后，误以为其已受到溢出保护，但实际上程序仍可能存在整数溢出漏洞。攻击者可利用这些未被检测到的溢出条件触发缓冲区溢出、内存损坏或远程代码执行等安全问题。该漏洞影响所有使用 3.3.3 及更早版本 GCC/G++ 编译并依赖 `-ftrapv` 选项进行溢出保护的应用，补丁已于 2003 年 7 月 6 日提交并包含在 GCC 3.4.0 版本中。"
published = "2000-11-01T05:00:00Z"
remediation = "升级 gcc/g++ 至 3.4.0 或更高版本，该漏洞的修复补丁已于 2003 年 7 月 6 日由 Roger Sayle 提交并随 3.4.0 发布。临时缓解措施为在编译时移除 -ftrapv 选项，改用编译器内置函数（如 __builtin_add_overflow）或在应用代码中手动校验算术运算结果，避免依赖存在缺陷的 -ftrapv 机制检测有符号整数溢出。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "GNU GCC g++ 编译器整数溢出防护不足漏洞"
updated = "2026-06-16T21:53:24Z"

