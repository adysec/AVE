[info]
author = "AVE"
description = "DNN (DotNetNuke) 9.2至9.2.2版本使用弱加密算法保护输入参数，攻击者可构造恶意DNNPersonalization Cookie触发.NET反序列化实现远程代码执行。通过发送包含ExpandedWrapper/ObjectDataProvider载荷的Cookie，利用FileSystemUtils.WriteFile读取服务器文件。"
id = "POC-AVE-2018-0508"
name = "DotNetNuke 9.2 - 9.2.2 弱加密与Cookie反序列化RCE PoC"
severity = "high"
tags = [
    "cve-2018-18325",
    "dotnetnuke",
    "deserialization",
    "rce",
    "kev",
]
vuln_id = [
    "CVE-2018-18325",
    "AVE-2018-0508",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/__"
protocol = "http"

[[poc.requests.matchers]]
condition = "and"
expect = true
part = "body"
type = "word"
words = [
    "[extensions]",
    "for 16-bit app support",
]

[[poc.requests.matchers]]
expect = true
status = [404]
type = "status"
