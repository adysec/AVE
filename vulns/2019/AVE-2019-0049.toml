[basic]
description = "Deltek Maconomy 2.2.5 存在路径遍历漏洞，攻击者可通过在 WS.macx1.W_MCS/ 的 PATH_INFO 参数中使用绝对路径遍历（如 /etc/passwd）实现本地文件包含。未经身份认证的远程攻击者可通过构造特制的 HTTP 请求，读取服务器上的任意敏感文件，包括配置文件、密码文件等。该漏洞影响 Deltek Maconomy 2.2.5 版本，CVSS 评分 9.8，危害等级严重。目前官方尚未发布修复补丁，建议限制对 MaconomyWS.macx1.W_MCS 接口的访问权限。"
published = "2019-05-24T14:29:00.387"
remediation = "升级 Deltek Maconomy 至最新版本（云客户已自动包含补丁）；本地部署用户需在每个受影响组件的配置文件的 SearchPath 段中添加 ErrorScript = errorscript.ms，并将 errorscript.ms 脚本放置于 SearchPath 指定目录中，无需重启服务。同时建议在 Web 服务器层面配置 URL 重写规则，过滤 PATH_INFO 中的绝对路径遍历字符（如 /etc/passwd、../），限制 cgi-bin/Maconomy 目录仅允许合法脚本访问。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Deltek Maconomy 路径遍历漏洞"
updated = "2026-06-17T02:14:26.040"

