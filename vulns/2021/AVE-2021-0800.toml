[basic]
description = "Pulse Connect Secure（后更名为 Ivanti Connect Secure）是一款广泛使用的 SSL VPN 远程接入设备。该漏洞存在于 9.1R11.4 及之前版本的设备中，由于管理员 Web 界面对档案上传缺乏充分的限制检查，未经充分授权的认证管理员可通过上传恶意构造的压缩包文件触发代码注入，进而在设备上执行任意文件写入操作。攻击者需要以具有管理员权限的身份登录设备管理界面，然后上传特制压缩文件即可利用此漏洞。成功利用后，攻击者可在设备上写入 WebShell 并获取持久化访问权限，对设备的机密性、完整性和可用性造成严重影响。该漏洞在野外已被广泛利用，CISA 已将其列入已知被利用漏洞目录（KEV），并要求联邦机构紧急修复。厂商已在 9.1R11.4 版本中修复此漏洞，受影响用户应尽快升级至安全版本并运行完整性检查工具确认系统未被植入恶意文件。"
published = "2021-05-27T12:15:07Z"
remediation = "将 Pulse Connect Secure 升级至 9.1R11.4 或更高版本，以修复管理界面中恶意构造的压缩包文件上传漏洞。升级前使用 Pulse Connect Secure Integrity Tool（https://kb.pulsesecure.net/articles/Pulse_Secure_Article/KB44755）对设备进行完整性校验，检测文件系统哈希是否异常，若发现哈希不匹配须立即断开网络并上报事件。如暂无法升级，可导入厂商提供的 XML 配置文件（https://kb.pulsesecure.net/pkb_mobile#article/l:en_US/SA44784/s）作为临时缓解措施，并持续每 24 小时运行完整性工具监控。同时重置所有管理员账户密码，检查设备上是否存在未授权上传的文件，并在防火墙层限制对管理界面的访问。"
score = 7.2
severity = "HIGH"
sources = ["kev"]
title = "Pulse Secure Pulse Connect Secure 代码注入漏洞"
updated = "2026-06-17T03:37:59Z"

