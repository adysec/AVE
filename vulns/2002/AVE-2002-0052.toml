[basic]
description = "GNU tar 1.13.19 至 1.13.24 版本中存在符号链接漏洞，由于安全审查机制被错误禁用，导致在解压特殊构造的 tar 归档文件时，攻击者可以通过嵌入的符号链接将文件写入任意路径。远程攻击者可诱导用户解压恶意 tar 包，实现任意文件覆盖，进而可能导致系统文件被篡改或权限提升。该漏洞攻击复杂度低，无需认证即可利用，仅影响数据完整性。"
published = "2002-10-28T05:00:00Z"
remediation = "升级到 GNU tar 1.13.25 或更高版本，该版本重新启用了符号链接安全检查，可防止 tar 解包时跟随符号链接覆盖任意文件。如无法立即升级，应避免使用受影响版本（1.13.19 至 1.13.24）解压不受信任的 tar 归档，或解压前手动检查归档中是否包含可疑的符号链接条目作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "GNU tar 符号链接攻击导致任意文件写入漏洞"
updated = "2026-06-16T21:58:56Z"

