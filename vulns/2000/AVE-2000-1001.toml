[basic]
description = "Small HTTP Server 2.01 存在一个服务端包含漏洞，该版本无法正确处理包含空值字符的 SSI 标签。当攻击者向 HTML 文件中插入包含空字符的特制 SSI 标签时，服务器因 SSI 处理机制中的错误输入验证和不完善错误处理而崩溃，导致拒绝服务。该漏洞影响本地用户和潜在远程攻击者，攻击者可通过上传包含特制空字节 SSI 指令的 HTML 文件利用此弱点。问题源于SSI处理模块缺乏对输入数据的有效验证和合理的错误处理，使得服务器易受损坏 disrupting normal web service operations 的攻击。"
published = "2001-01-09T05:00:00.000"
remediation = "建议立即升级Small HTTP Server到1.0或更高版本，该版本修复了SSI标签解析的空值处理漏洞。如无法直接升级，可编辑配置文件禁用SSI功能（删除`enable_ssi=1`）、限制SSI使用或限制`parse`配置为白名单。这样可以阻止空值SSI标签的解析并防止服务崩溃。直接升级到1.1或更高版本提供完整的漏洞修复并改善服务器稳定性。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Small HTTP Server 2.01版本 服务拒绝漏洞"
updated = "2026-06-16T21:52:43.003"

