[basic]
description = "Apple QuickTime Player 4.1.2（日文版）浏览器插件在处理网页中的 EMBED 标签时，若 HREF 参数长度过长则触发缓冲区溢出漏洞。未经身份认证的远程攻击者可构造包含特制 HREF 参数的恶意网页，诱使目标用户访问后即可在用户系统上执行任意命令。该漏洞影响运行 Windows 系统的 QuickTime Player 4.1.2（日文版）用户，攻击者需要诱导用户用浏览器打开包含恶意 EMBED 标签的网页才能利用成功，CVSS 评分 7.6，危害等级高危。攻击者成功利用后可完全控制用户系统，窃取敏感数据或进一步横向移动。"
published = "2001-05-03T04:00:00Z"
remediation = "建议立即卸载 Apple QuickTime for Windows（苹果已于 2016 年停止支持并不再提供安全更新），改用 VLC Media Player 或 MPC-HC 等现代播放器替代。若业务强依赖 QuickTime，可升级至 QuickTime 7.7.9（Windows 最后一个版本，官网已下架，需从可信镜像站获取），并在浏览器中禁用 QuickTime 插件（IE：Internet 选项 → 程序 → 管理加载项 → 禁用 QuickTime Plug-in；Chrome/Firefox：地址栏输入 about:addons 禁用相关插件）。临时缓解：在防火墙层面阻断来自非信任站点的 .mov/.qt 文件下载，或部署网络层 IPS 规则拦截包含超长 HREF 参数的 EMBED 标签流量。"
score = 7.6
severity = "HIGH"
sources = ["cve"]
title = "Apple QuickTime Player 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:53:51Z"

