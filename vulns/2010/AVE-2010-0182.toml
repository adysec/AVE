[basic]
description = "Apple Safari 浏览器中 WebKit 引擎的 CSS 实现未能正确处理 :visited 伪类，攻击者可通过构造特制的 HTML 文档，利用 CSS 样式查询机制探测用户已访问过的网站链接。该漏洞属于信息泄露类型，攻击者无需身份认证即可远程利用，但需要用户使用受影响的 Safari 浏览器访问恶意页面。该漏洞影响 Mac OS X 10.4/10.5/10.6 及 Windows 平台上的 Safari 4.1 以下及 5.0 以下版本，CVSS 评分 4.3，危害等级中危。"
published = "2010-06-11T19:30:23Z"
remediation = "升级 Apple Safari 至 5.0 及以上版本（Mac OS X 10.5~10.6 及 Windows 平台）或 4.1 及以上版本（Mac OS X 10.4 平台），该更新修复了 WebKit 中 CSS :visited 伪类导致的信息泄露问题。如无法立即升级，可禁用 JavaScript 或使用无痕浏览模式作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari WebKit CSS :visited 伪类信息泄露漏洞"
updated = "2026-06-16T23:20:25Z"

