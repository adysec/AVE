[basic]
description = "Linux 系统中的 gpm（General Purpose Mouse）程序存在拒绝服务漏洞。本地攻击者可通过向 /dev/gpmctl 设备发送大量 STREAM 套接字连接，导致 gpm 服务资源耗尽而崩溃，从而无法正常处理鼠标输入事件。该漏洞影响 OpenLinux 2.3/2.4、RedHat 6.0/6.1 及 SCO eServer 2.3 等版本，CVSS 评分 2.1，危害等级低。攻击者需具有本地系统访问权限，无法远程利用。"
published = "1999-11-23T05:00:00Z"
remediation = "建议立即安装 Red Hat 发布的 RHSA-2000-045 安全更新，升级 gpm 程序至修复版本。如无法升级，可通过限制本地用户对 /dev/gpmctl 设备的访问权限作为临时缓解措施，或在不需要鼠标支持的服务器上直接卸载 gpm 软件包（rpm -e gpm）。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "Linux gpm 程序拒绝服务漏洞"
updated = "2026-06-16T21:51:56Z"

