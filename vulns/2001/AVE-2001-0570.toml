[basic]
description = "Microsoft Office 2000、Windows 2000 及 Windows Me 中的 Web Extender Client (WEC) 组件未正确应用 Internet Explorer 安全设置处理 NTLM 认证请求，导致远程攻击者可通过诱导用户访问恶意 Web 页面，在用户不知情的情况下触发 NTLM 认证，从而窃取用户的 NTLM 凭据，进而可能破解获取明文密码。该漏洞影响范围广泛，攻击复杂度低，无需身份认证即可远程利用，主要威胁在于凭据泄露。"
published = "2001-02-12T05:00:00Z"
remediation = "安装 Microsoft 安全公告 MS01-001 对应补丁：若使用 Office 2000，优先安装 Office 2000 补丁（需先安装 SR-1a）；若未安装 Office 2000 但使用 Windows 2000，安装 Windows 2000 补丁或升级至 Service Pack 2；若使用 Windows Me，安装 Windows Me 补丁。临时缓解措施：在边界防火墙阻止远程登录服务，避免浏览不可信网站及打开来源不明的 HTML 邮件。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Web Extender Client NTLM 认证凭据泄露漏洞"
updated = "2026-06-16T21:53:28Z"

