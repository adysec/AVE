[basic]
description = "bsguest.cgi 留言簿脚本 1.0 版本在处理用户输入的电子邮件地址时，未对 shell 元字符（如管道符、分号等）进行有效过滤，导致远程攻击者可通过向该脚本提交特制的恶意邮件地址参数注入任意系统命令。攻击者无需身份认证即可远程利用该漏洞，成功利用后可完全控制目标服务器，执行任意命令，造成信息泄露、数据篡改或服务中断等严重后果。该漏洞 CVSS 评分 10.0，危害等级为严重，Exploit-DB 上已有公开利用代码。"
published = "2001-02-12T05:00:00.000"
remediation = "立即删除或禁用 bsguest.cgi 脚本，该软件已停止维护且无安全更新。如必须使用，需在 email 字段中过滤 shell 元字符（如 `;` `|` `&` `$` `` ` ``），使用 `escapeshellcmd()` 或正则白名单校验输入，并将 Web 服务器以最低权限用户运行以限制命令执行影响范围。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Brian Stanback bsguest.cgi 远程命令执行漏洞"
updated = "2026-06-16T21:53:39.200"

