[basic]
description = "BEA WebLogic 5.1.x 的 PageCompileServlet 未正确限制访问权限，导致远程攻击者可直接调用该 Servlet 编译并执行任意 Java JHTML 代码。攻击者无需身份认证，仅需通过网络向目标服务器发送特制请求即可触发该漏洞，实现远程代码执行，完全控制服务器。该漏洞影响 BEA WebLogic 5.1.x 系列版本，CVSS 评分 10.0，危害等级严重。Oracle 已在后续版本中修复此问题，建议升级至不受影响版本。"
published = "2000-10-20T04:00:00Z"
remediation = "升级到 BEA WebLogic 5.1.x 的补丁版本（参考 BEA 安全公告 security_000731），限制 PageCompileServlet 的访问权限，仅允许受信任的管理员 IP 访问该 Servlet，并在 Web 服务器层禁用对 *.jhtml 文件的直接请求和编译功能。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "BEA WebLogic PageCompileServlet 未授权访问致远程命令执行漏洞"
updated = "2026-06-16T21:52:15Z"

