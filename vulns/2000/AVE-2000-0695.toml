[basic]
description = "Cisco Virtual Central Office 4000（VCO/4K）5.1.3 版本使用弱加密算法在 SNMP MIB 中存储用户名和密码。攻击者无需身份认证，只需知道 SNMP 共同体名称（community name），即可远程破解加密的凭据并获取系统权限。该漏洞影响运行 VCO/4K 5.1.3 版本的 Cisco 设备，攻击者通过 SNMP 协议远程利用即可获取敏感账户信息并提升权限，危害等级为高危。"
published = "2000-12-19T05:00:00.000"
remediation = "立即将 Cisco Virtual Central Office 4000（VCO/4K）软件从 5.1.3 或更早版本升级至 5.1.4 或更高版本，该版本已采用强加密算法替代原有的简单替换密码存储方式。升级前若无法立即打补丁，可临时在 SNMP 配置中禁用只读社区字符串（read-only community string），或限制仅允许受信任的管理站 IP 地址访问设备的 SNMP 服务，以降低密码被远程检索的风险。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Cisco Virtual Central Office 4000 SNMP MIB 弱加密凭据泄露漏洞"
updated = "2026-06-16T21:52:50.940"

