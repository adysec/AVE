[basic]
description = "CVE-2001-0320是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-05-03T04:00:00Z"
remediation = '立即将 PHP-Nuke 升级至 5.0 或更高版本，新版本已修复 bb_smilies.php 和 bbcode_ref.php 中对 username 参数未做空字符及 .. 路径遍历过滤的安全缺陷。如暂时无法升级，可对 bb_smilies.php 和 bbcode_ref.php 中接收 username 参数的位置，在 PHP 逻辑中去除 \0 空字节并过滤掉 .. 和 ../ 等路径遍历字符后再传入后续处理；同时建议修改 php.ini 中 magic_quotes_gpc 为 On，或在业务代码层面统一对 username 变量调用 stripslashes() 和 str_replace() 清理特殊字符，以阻止攻击者利用路径穿越读取服务器任意文件并获取管理员权限。'
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "PHP-Nuke 4.4 任意文件读取漏洞"
