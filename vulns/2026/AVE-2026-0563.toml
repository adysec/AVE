[basic]
description = "ViewComponent 是 Ruby on Rails 中用于构建可复用、可测试视图组件的框架。其 `ViewComponent::Base#around_render` 方法存在 HTML 安全绕过漏洞（CWE-79），当 `around_render` 返回包含用户可控数据的字符串时，会绕过正常 `#call` 方法的转义机制，直接输出原始 HTML，导致跨站脚本攻击（XSS）。攻击者可在低权限条件下，通过构造恶意载荷触发 XSS，窃取会话凭证、执行越权操作或进行钓鱼攻击。`ViewComponent::Collection#render_in` 会进一步放大风险，将各条目结果拼接后标记为 `html_safe`，使未转义的恶意内容被浏览器直接执行。该漏洞影响 ViewComponent 4.0.0 至 4.12.0 版本，CVSS 评分 8.7，危害等级高。官方已在 4.12.0 版本中修复。"
published = "2026-07-17T21:17:09Z"
remediation = "立即升级 ViewComponent 至 v4.12.0 或更高版本（执行 `bundle update view_component`），该版本已修复 `around_render` 的 HTML 安全绕过问题。如无法立即升级，应避免在 `around_render` 中返回用户可控内容，并对返回值手动调用 `ERB::Util.html_escape` 进行转义处理；同时避免在集合渲染中使用 `.html_safe` 拼接未经过安全边界的组件输出。"
score = 8.7
severity = "HIGH"
sources = ["ghsa"]
title = "ViewComponent view_component around_render HTML安全绕过跨站脚本漏洞"
updated = "2026-07-23T18:04:52Z"

