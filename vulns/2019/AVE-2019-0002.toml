[basic]
description = "Apache Solr 的 DataImportHandler (DIH) 模块在处理 `dataConfig` 参数时存在安全缺陷。由于 DIH 配置允许包含脚本，攻击者可以通过在请求中直接传递恶意配置内容，利用 DIH 管理界面的调试模式触发远程命令执行。该漏洞影响 Apache Solr 8.2.0 之前的版本。攻击者需能够访问 Solr 的 DIH 接口，通过发送包含特制脚本的 `dataConfig` 参数，即可在服务器上执行任意系统命令，导致服务器权限被完全接管。"
published = "2019-08-01T14:15:13Z"
remediation = '建议将 Apache Solr 升级至 8.2.0 或更高版本。在 8.2.0 及以上版本中，默认禁用了通过 dataConfig 参数加载配置的功能；如确需使用，需将 Java 系统属性 "enable.dih.dataConfigParam" 设置为 true。此外，应限制 DIH 管理界面的访问权限，防止未授权用户触发漏洞。'
score = 7.2
severity = "HIGH"
sources = ["kev"]
title = "Apache Solr DataImport Handler 远程命令执行漏洞"
updated = "2026-06-17T02:07:55Z"

