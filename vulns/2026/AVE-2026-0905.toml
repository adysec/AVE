[basic]
description = "Directus 是一个用于管理 SQL 数据库内容的实时 API 和 App 仪表板。在 12.0.0 版本之前，当启用响应缓存（CACHE_ENABLED=true）时，缓存键派生函数仅包含 version、path、query 和 accountability.user，而缺少 share、role、roles、admin、app、policies 等授权上下文。由于 Directus 的共享令牌和匿名请求都会将 user 字段置为 null，导致不同共享或匿名客户端请求相同 URL 和查询时，会命中相同的缓存键，从而获取到经过权限过滤的缓存响应而无需重新评估权限。攻击者只需构造与目标共享相同的 URL 请求即可利用此漏洞，实现跨共享的机密信息泄露。该漏洞影响启用缓存功能的所有 Directus 版本，CVSS 评分 8.6，危害等级高。官方已在 12.0.0 版本中修复此问题。"
published = "2026-07-15T15:16:48Z"
remediation = "升级 Directus 至 v12.0.0 或更高版本（对应 commit 7ba4efb975）。如无法立即升级，临时缓解措施：将 `CACHE_ENABLED` 设为 `false` 禁用响应缓存，或配置 `CACHE_AUTO_PURGE` 并缩短 `CACHE_TTL` 至 60 秒以下以缩小泄露窗口。"
score = 8.6
severity = "HIGH"
sources = ["ghsa"]
title = "Directus 缓存键未分段导致授权绕过漏洞"
updated = "2026-07-28T15:46:30Z"

