[basic]
description = "Google Chrome 浏览器 V8 JavaScript 引擎的 Turboshaft 优化编译器存在类型混淆漏洞，具体位于 WasmGCTypeAnalyzer 组件对单块循环（single-block loop）的 WebAssembly GC 类型分析过程中。该漏洞由 V8 引入的 WasmGC Turboshaft 优化功能所触发，通过 Chrome 遥测功能（Finch trial, `V8WasmTurboshaft`）以 100% 概率向 Chrome 128 至 131 版本推送。攻击者利用精心构造的 WebAssembly GC 代码，在循环中操纵 Wasm 结构体（struct）局部变量类型，使得类型分析器误判变量类型，从而在后续的类型转换中产生类型混淆，实现内存地址泄漏与伪造对象（addrOf/fakeObj ）原语，最终可逃离 Chrome 渲染进程沙箱并执行任意代码。该漏洞无需身份认证，攻击者远程构造恶意 HTML 页面诱使用户用受影响的 Chrome 版本打开即可触发，影响 Google Chrome 128 至 131 版本中所有未修复（低于 131.0.6778.264）的安装实例，CVSS v3.1 评分为 8.8，危害等级高。Google 已于 2025 年 1 月发布 Chrome 131.0.6778.264 版本修复此漏洞，建议用户立即升级。该漏洞同时也影响 Microsoft Edge 等基于 Chromium 的浏览器。"
published = "2025-01-08T19:15:38Z"
remediation = "立即升级 Google Chrome 至 131.0.6778.264 或更高版本，基于 Chromium 的浏览器（如 Microsoft Edge、Brave、Opera）需同步更新至各自对应修复版本。可通过 Chrome 设置 > 关于 Chrome > 自动检查更新完成升级，或从官网下载安装包手动更新。无法立即升级时，可禁用 V8 JIT 编译作为临时缓解措施（通过启动参数 --jitless），但会显著影响性能。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 类型混淆漏洞"
updated = "2026-06-17T08:26:13Z"

