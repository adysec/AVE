[basic]
description = "Windows 95/98/98SE/NT 4.0 等操作系统的 TCP/IP 协议栈存在拒绝服务漏洞（即 NAPTHA 类攻击）。远程攻击者无需认证即可向目标主机发送大量 TCP 连接请求，完成三次握手后不维护连接状态，导致目标系统维护大量半开连接耗尽内存和连接表资源，最终造成系统拒绝服务。该漏洞影响 Windows 95/98/98SE/NT 4.0 及多种 TCP/IP 协议栈实现，CVSS 评分 5.0，危害等级中危。"
published = "2001-01-09T05:00:00Z"
remediation = "Windows NT 4.0 用户应立即安装 Microsoft 安全公告 MS00-091 提供的补丁（KB275567），下载地址为 https://www.microsoft.com/download/details.aspx?FamilyId=176A1B04-06A6-452C-985D-04E32679E71C。Windows 95/98/98SE/Me 用户应在防火墙层面阻止入站 TCP 端口 139（NBT），并禁用文件和打印机共享服务。Windows 2000 不受此漏洞影响。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows TCP/IP 连接洪水拒绝服务漏洞"
updated = "2026-06-16T21:53:01Z"

