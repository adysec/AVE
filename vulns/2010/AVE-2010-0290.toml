[basic]
description = "WebKit 引擎在处理文本节点动态修改时存在内存破坏漏洞（CWE-119），未正确管理内存导致缓冲区溢出。该漏洞影响 Apple Safari 5.0.1 之前版本（Mac OS X 10.5 至 10.6 及 Windows 平台）、Safari 4.1.1 之前版本（Mac OS X 10.4）以及 webkitgtk 1.2.6 之前版本。远程攻击者无需身份认证，只需通过向目标用户发送或诱使其访问包含特制 HTML 文档的网页即可触发漏洞。成功利用可导致浏览器应用程序内存损坏和崩溃（拒绝服务），并可能在特定条件下执行任意代码，CVSS v2 评分为 9.3，危害等级严重。"
published = "2010-07-30T20:30:01Z"
remediation = "Mac OS X 和 Windows 用户应立即升级 Safari 至 5.0.1（Mac OS X 10.5/10.6 及 Windows）或 4.1.1（Mac OS X 10.4），通过 Apple 软件更新或 Safari 官网下载安装。WebKitGTK 用户（如 Ubuntu 9.10/10.04/10.10）应将 libwebkit-1.0-2 升级至 1.2.5-0ubuntu0.9.10.1、1.2.5-0ubuntu0.10.10.1 或 1.2.5-0ubuntu0.10.04.1 及以上版本，执行 apt-get update && apt-get upgrade 后重启所有使用 WebKit 的应用程序。如暂时无法打补丁，应避免使用 Safari 或基于 WebKitGTK 的浏览器访问不可信网站，并启用防火墙或代理过滤恶意 HTML 内容作为临时缓解。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:19:19Z"

