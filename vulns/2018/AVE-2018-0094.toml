[basic]
description = 'tecrail Responsive FileManager 9.13.4 之前版本中的 /filemanager/ajax_calls.php 存在路径遍历漏洞。该漏洞源于程序使用外部输入构造路径名时未正确过滤 ".." 序列，导致攻击者可通过构造特制的路径参数突破目录限制，实现任意文件读取。攻击者无需身份认证即可远程利用，影响范围广泛。成功利用该漏洞可读取服务器上的敏感文件，如配置文件、数据库凭证等，导致信息泄露。CVSS 评分 7.5，危害等级高。'
published = "2018-08-24T19:29:01Z"
remediation = "将 tecrail Responsive FileManager 升级至 9.13.4 或更高版本，该版本已修复 /filemanager/ajax_calls.php 中未正确过滤 ../ 序列导致的目录遍历问题。如无法立即升级，在 Web 服务器（如 Nginx/Apache）配置中限制 /filemanager/ 目录的访问权限，仅允许可信 IP 访问，并禁用对 ajax_calls.php 的直接外部请求。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "tecrail Responsive FileManager 路径遍历漏洞"
updated = "2026-06-17T01:42:43Z"

