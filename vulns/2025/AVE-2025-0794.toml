[basic]
description = "Windows 加密信息泄露漏洞（CVE-2025-21336）存在于 Windows 加密服务组件中，属于 CWE-203 可观测差异类漏洞。攻击者可通过本地访问向 Windows 加密子系统发送特制请求，利用加密服务在处理不同输入时产生的可观测行为差异（如响应时间、错误消息或返回值的细微差别），逐步推导出内存中的敏感加密材料（如密钥材料、证书数据或密码哈希）。该漏洞影响范围广泛，涵盖 Windows 10 多个版本（1507/1607/1809/21H2/22H2）、Windows 11 多个版本（22H2/23H2/24H2）以及 Windows Server 2008 至 2025 等多个服务器版本。成功利用该漏洞需要攻击者已在目标系统本地获得低权限访问，且攻击复杂度较高，但由于其影响范围为变更范围且对保密性影响为高，可能导致敏感加密数据泄露，进而被用于进一步横向移动或特权提升。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞，受影响用户应安装对应安全更新（如 Windows 10 22H2 需升级至 10.0.19045.5371 及以上版本，Windows 11 23H2 需升级至 10.0.22631.4751 及以上版本）。"
published = "2025-01-14T18:15:59Z"
remediation = "安装 Microsoft 2025 年 1 月安全更新 KB5050061（Security-only update），该更新适用于 Windows Server 2008 SP2。通过 Microsoft Update Catalog 下载独立安装包，或通过 WSUS 同步推送。安装前须先安装最新的服务栈更新 (SSU) KB5050682。如无法立即打补丁，限制本地用户对加密 API 的访问权限作为临时缓解措施。"
score = 5.6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 加密信息泄露漏洞"
updated = "2026-06-17T08:43:08Z"

