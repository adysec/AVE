[basic]
description = "wolfSSL TLS 1.3 服务器实现中存在定时侧信道漏洞，该漏洞源于服务器在验证 PSK（Pre-Shared Key）binder 时使用了非常量时间的比较方法。攻击者可通过精确测量服务器处理 PSK binder 的响应时间差异，推断出 PSK binder 的有效字节信息，从而进行侧信道分析攻击。该漏洞影响使用 wolfSSL 库且启用了 TLS 1.3 PSK 认证模式的服务端，需要攻击者具备网络访问能力和低级别权限（如可发起 TLS 握手的合法客户端），并能执行主动攻击（AT:P）。由于 CVSS 评分仅为 2.3（低危），实际利用难度较高，但在特定高安全性场景下仍可能构成威胁。wolfSSL 已在后续版本中修复此漏洞，采用常量时间比较函数替代原有实现。"
published = "2025-11-21T23:15:44Z"
remediation = "升级 wolfSSL 至 5.8.4 或更高版本，该版本已包含 PR #9223 的修复，将 PSK binder 验证从非常量时间的 XMEMCMP 替换为 ConstantCompare。可通过源码编译安装最新稳定版，或从 wolfSSL 官方下载页面获取 5.8.4+ 版本包。若无法立即升级，可在 TLS 服务端配置中禁用 PSK 密码套件作为临时缓解措施，避免使用 TLS 1.3 PSK 模式进行身份验证。"
score = 2.3
severity = "LOW"
sources = ["msrc"]
title = "wolfSSL wolfSSL PSK Binder 验证定时侧信道信息泄露漏洞"
updated = "2026-06-17T08:31:26Z"

