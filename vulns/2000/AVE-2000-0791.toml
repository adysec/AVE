[basic]
description = 'Microsoft Enterprise Manager 的 Data Transformation Service (DTS) 包中的"已注册服务器"对话框存在密码泄露漏洞。本地攻击者可通过访问该对话框获取数据库连接密码，属于"DTS 密码"漏洞的变种。攻击者需要拥有本地系统访问权限，利用该漏洞可获取敏感凭据信息，进而可能导致进一步的未授权访问。该漏洞影响 Microsoft Enterprise Manager 相关版本，CVSS 评分 4.6，危害等级中危。'
published = "2000-07-11T04:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-041 提供的补丁（Intel 平台：DTSUIi.exe；Alpha 平台：dtsuia.exe），下载地址为 https://download.microsoft.com/download/sql70/DTSPWFix/7.0/WIN98/EN-US/DTSUIi.exe。同时应改用 Windows 身份验证替代在 DTS 包或 Enterprise Manager 中存储用户名和密码，遵循最小权限原则限制 MSDB 数据库的 Guest 访问权限，并严格控制 DTS 包的所有者权限以防止未授权用户查看属性页。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Enterprise Manager DTS密码泄露漏洞"
updated = "2026-06-16T21:52:11.880"

