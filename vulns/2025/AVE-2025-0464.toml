[basic]
description = "GNU Binutils 2.45 的链接器组件（bfd/elflink.c 文件中的 bfd_elf_gc_record_vtentry 函数）存在越界读取漏洞。当处理特制的 ELF 文件时，程序未能正确验证虚函数表条目记录的内存边界，导致攻击者可利用该缺陷读取越界内存数据。该漏洞需要本地访问权限，攻击者可通过向受影响系统提交恶意构造的 ELF 文件触发。成功利用可导致敏感信息泄露，影响系统机密性。CVSS 评分 1.9，危害等级低。补丁已由官方发布，建议用户及时更新至修复版本。"
published = "2025-10-07T22:15:34Z"
remediation = "立即应用上游补丁 047435dd988a3975d40c6626a8f739a0b2e154bc，该补丁在 bfd/elflink.c 的 bfd_elf_gc_record_vtentry 函数中增加了 addend > 1u << 28 的边界检查，防止越界读取。SUSE Linux 用户应安装 SUSE-SU-2025:4096-1 安全更新。如无法立即打补丁，可在链接时避免使用 -z gcs=implicit 选项作为临时缓解措施。"
score = 1.9
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils 链接器越界读取漏洞"
updated = "2026-06-17T08:30:24Z"

