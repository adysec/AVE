[info]
author = "ave"
description = "通过向目标发送 HTTP GET 请求并检测响应中是否包含 'excel' 关键字，验证目标是否涉及 Microsoft Excel 服务或页面，从而辅助判断 CVE-2025-21394 释放后使用远程代码执行漏洞的潜在影响面。"
id = "POC-AVE-2025-0856"
name = "CVE-2025-21394 Microsoft Excel RCE PoC"
severity = "high"
tags = ["ave-2025-0856"]
vuln_id = [
    "CVE-2025-21394",
    "AVE-2025-0856",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE-PoC/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["excel"]
