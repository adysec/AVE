[basic]
description = "Microsoft Internet Explorer 5.5 及 6.0 版本存在跨域安全模型绕过漏洞。远程攻击者可通过精心构造的网页利用缓存方法和对象绕过浏览器的跨域限制，从而访问本地系统或其他域中的敏感信息，甚至可能在用户系统上执行任意代码。该漏洞无需身份认证，用户仅需访问恶意网页即可触发，危害较大。微软已在后续安全更新中修复此漏洞。"
published = "2002-12-11T05:00:00Z"
remediation = '立即安装 Microsoft 安全公告 MS02-066 提供的累积补丁 Q328970，该补丁修复了 IE 5.5/6.0 中跨域安全验证绕过漏洞。建议进一步升级至 MS02-068 补丁（已包含本补丁全部修复）。如无法安装补丁，可启用 Microsoft 知识库文章 810687 中描述的注册表键限制 HTML Help 中的快捷方式作为临时缓解措施，同时在 IE 安全设置中将 Internet 区域安全级别设为"高"，并禁用"允许跨域浏览窗口导航"选项。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer 跨域安全模型绕过漏洞"
updated = "2026-06-16T21:59:00Z"

