[basic]
description = "Linux 内核 USB 小工具 f_tcm（Target Core Module）驱动存在双重释放（Double Free）漏洞。该漏洞源于驱动在处理 SCSI 命令时过早释放了命令结构体内存，未等待感知状态（sense status）的完成回调。当攻击者通过本地权限触发 USB Gadget 存储功能时，已释放的内存可能被重复释放，导致内核内存损坏。本地攻击者可利用此漏洞实现权限提升或导致系统崩溃（拒绝服务）。该漏洞影响 Linux 内核 6.x 及更早版本，CVSS 评分 7.8，危害等级为高。攻击需要本地用户权限，无需认证，成功利用可获取高完整性与机密性影响。Linux 内核上游已通过延迟释放命令至状态完成回调后修复此问题，各发行版（Ubuntu、Debian 等）已在安全更新中集成补丁。"
published = "2025-03-06T16:15:51Z"
remediation = "立即升级 Linux 内核到以下已修复版本：5.4.291、5.10.235、5.15.179、6.1.129、6.6.76、6.12.13 或 6.13.2 及以上版本。Debian 11 用户请安装 DLA-4178-1 安全更新，Ubuntu 用户请安装 USN-7540-1（18.04）、USN-7640-1（20.04）或 USN-7653-1（22.04）更新。如无法立即升级，可在不影响业务的情况下禁用 USB Gadget 存储功能模块（f_tcm）作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux kernel USB Gadget f_tcm 双重释放漏洞"
updated = "2026-06-17T08:14:31Z"

