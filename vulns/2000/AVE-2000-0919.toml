[basic]
description = "SuSE Linux 6.2/6.3/6.4/7.0 系统中的 ypbind-mt 组件存在格式字符串漏洞。当该服务以调试模式运行时，日志记录函数会泄漏文件描述符，导致未经身份认证的远程攻击者可以触发该漏洞，造成拒绝服务攻击。该漏洞影响 SuSE Linux 多个版本，攻击者可通过网络发送特制的数据包利用此漏洞，导致系统服务不可用。漏洞 CVSS 评分 10.0，危害等级极高。攻击者无需任何权限即可远程触发，仅需向目标系统发送特定的数据包即可引发服务崩溃。"
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 ypbind 至修复版本（Mandrake Linux 升级至 ypbind-3.3-25mdk 及 ypserv-1.3.9-4mdk，SuSE Linux 升级至对应安全更新版本）。如无法立即升级，避免以 debug 模式运行 ypbind-mt，并在防火墙上限制对 ypbind 服务端口（默认 32768-32789 UDP）的访问作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Novell SuSE ypbind-mt 拒绝服务漏洞"
updated = "2026-06-16T21:53:01.743"

