[basic]
description = "Guzzle 是一个可扩展的 PHP HTTP 客户端库。在 7.15.2 之前和 8.0.0 版本中，SetCookie::matchesDomain() 方法在处理非标准书写的 IP 地址（如十六进制格式 0x7f000001、百分号转义格式 192.168.0.%31 等）时，未能正确识别其为 IP 字面量，导致 cookie 的 Domain 属性保留子域名作用域。当应用程序启用 cookie 支持，并使用这些非标准格式寻址源站，且存在以该格式结尾的子域名时，攻击者可利用此漏洞：攻击者控制的服务器可向客户端发送带有 Domain=0x7f000001 的 Set-Cookie 响应头，该 cookie 随后会被添加到指向真实地址 127.0.0.1 的请求中，导致会话标识符或令牌泄露给非预期的主机，或使攻击者能够劫持会话、篡改应用状态。该漏洞影响使用 Guzzle 处理 cookie 的 PHP 应用程序，但仅在使用非标准 IP 格式寻址且存在同后缀子域名的网络环境中可被利用。"
published = "2026-08-03T21:16:42Z"
remediation = "立即升级 Guzzle 至 7.15.2 或 8.0.1 版本，官方补丁已修复非规范 Cookie 域名的子域范围匹配漏洞。如暂无法升级，应为每个主机或信任边界使用独立的 CookieJar，避免在多个主机间共享；禁止使用 0x 前缀十六进制、八进制或百分号转义的 IP 地址形式访问源站，统一使用标准点分十进制格式（如 127.0.0.1）；在请求传入 Guzzle 前及每次重定向时，拒绝包含百分号转义字节或非 ASCII 字节的主机名，以关闭相关攻击面。"
score = 6.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Guzzle HTTP 客户端 Cookie 子域范围绕过会话泄露漏洞"
updated = "2026-08-04T16:16:28Z"

