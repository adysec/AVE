[basic]
description = "Bugzilla 2.14 之前版本存在安全绕过漏洞，由于对机密 bug 的访问权限控制不严，远程攻击者可通过向 process_bug.cgi、show_activity.cgi、showvotes.cgi、showdependencytree.cgi、showdependencygraph.cgi、showattachment.cgi 或 describecomponents.cgi 等脚本发送特制的 bug id 参数，绕过查看权限限制，越权访问本应受限的机密漏洞信息，导致敏感数据泄露。该漏洞影响所有 Bugzilla 2.14 之前版本，无需身份认证即可远程利用。"
published = "2001-09-10T04:00:00Z"
remediation = "升级 Bugzilla 至 2.14 或更高版本，该版本修复了通过修改 process_bug.cgi、show_activity.cgi 等 CGI 参数绕过权限检查的问题。如无法立即升级，可在 Web 服务器层（如 Apache/Nginx）对上述 CGI 脚本添加访问控制，限制仅授权用户可访问。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Bugzilla 安全绕过漏洞"
updated = "2026-06-16T21:56:12Z"

