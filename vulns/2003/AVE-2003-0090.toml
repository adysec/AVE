[basic]
description = "Ethereal（现 Wireshark）网络协议分析仪的 DCERPC（DCE/RPC）协议解析器存在内存消耗型拒绝服务漏洞。未经身份认证的远程攻击者通过网络向运行受影响版本（Ethereal 0.9.12 及更早版本）的目标主机发送包含特制畸形 NDR 字符串的数据包，即可触发协议解析器异常，导致程序内存被大量消耗直至崩溃或无法正常工作，造成拒绝服务。该漏洞影响使用 Ethereal 进行网络流量监控、安全审计及协议分析的场景，攻击条件简单，仅需目标系统正在解析包含恶意 DCE/RPC 流量的网络数据即可被利用。"
published = "2003-07-24T04:00:00Z"
remediation = "建议立即升级到 Ethereal 0.9.13 或更高版本（该版本已修复 DCERPC 协议解析器中的 NDR 字符串内存消耗漏洞），或迁移到 Wireshark 最新稳定版。如暂时无法升级，应避免使用 Ethereal 分析来自不受信任网络的数据包，并以普通用户权限而非 root/Administrator 身份运行程序，同时限制程序可访问的文件来源。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Ethereal DCERPC 协议解析器拒绝服务漏洞"
updated = "2026-06-16T22:02:11Z"

