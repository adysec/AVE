[basic]
description = "Citrix Systems Workspace App for Windows 1904 之前版本存在访问控制错误漏洞（CWE-284），由于程序未正确实施访问控制策略，未经身份认证的远程攻击者可通过网络利用该漏洞，无需用户交互即可利用。攻击成功后，攻击者可完全控制目标系统，获取敏感信息、修改数据或执行任意操作，导致机密性、完整性和可用性完全受损。该漏洞 CVSS 评分 9.8，危害等级严重，影响所有运行 Citrix Workspace App 1904 之前版本的 Windows 系统。"
published = "2019-05-22T17:29:00Z"
remediation = "立即将 Citrix Workspace App for Windows 升级至 1904 或更高版本（原 Citrix Receiver 用户应迁移至 Workspace App）。该漏洞已被 CISA 列入已知被利用漏洞目录且用于勒索软件攻击，无法立即升级时建议在网络边界限制对 Citrix 服务的非必要访问，并监控异常连接行为。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Citrix Systems Workspace App 访问控制错误漏洞"
updated = "2026-06-17T02:13:18Z"

