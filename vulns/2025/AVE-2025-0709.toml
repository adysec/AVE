[basic]
description = "Windows 电话服务（Telephony Service）中存在堆缓冲区溢出漏洞（CWE-122），未经身份认证的远程攻击者可通过向目标系统发送特制请求触发该漏洞，成功利用后可实现远程代码执行，获取系统完全控制权限。攻击需要用户交互（如点击恶意链接或打开特制文件），CVSS 评分 8.8，危害等级高。该漏洞影响多个 Windows 版本，Microsoft 已在 2025 年 1 月安全更新中修复。"
published = "2025-01-14T18:15:42Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 (KB5049984)，可通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载。对于无法立即打补丁的系统，可在防火墙策略中限制 TAPI 服务的网络访问，并禁用不必要的电话服务 (Telephony Service) 以降低攻击面。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:42:53Z"

