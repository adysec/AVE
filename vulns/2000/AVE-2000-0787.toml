[basic]
description = 'AOL Instant Messenger（AIM）在 4.3.2229 之前的版本中存在缓冲区溢出漏洞，远程攻击者可通过向目标用户发送包含超长"goim"命令的特制 `aim://` 链接触发该漏洞，从而在受影响系统上执行任意代码。该漏洞影响 AIM 3.5.1856、4.0、4.1.2010、4.2.1193 等多个版本，攻击者无需身份认证，仅需诱使用户点击恶意链接即可远程利用。'
published = "2001-01-09T05:00:00Z"
remediation = '升级 AOL Instant Messenger 至 4.3.2229 或更高版本。该版本修复了通过畸形 "goim" 命令触发缓冲区溢出的问题。由于 AOL 已停止维护 AIM 服务，建议迁移至其他受支持的即时通讯软件。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "AOL Instant Messenger 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:53:07Z"

