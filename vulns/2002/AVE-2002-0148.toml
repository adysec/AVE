[basic]
description = "Solaris 操作系统的 cachefsd（缓存文件系统守护进程）中的 cfsd_calloc 函数存在基于堆的缓冲区溢出漏洞。远程攻击者无需身份认证，通过向目标系统发送包含超长目录名和缓存名称的特制请求，触发堆缓冲区溢出，可导致任意代码执行。该漏洞影响 Solaris 2/7/8/9 等多个版本，CVSS 评分为 10.0，危害等级为严重。攻击者利用此漏洞可完全控制受影响系统，实现远程代码执行，造成系统被完全接管。"
published = "2002-05-29T04:00:00Z"
remediation = "立即安装 Sun Alert 44309 提供的对应 Solaris 版本的 cachefsd 补丁。对于 Solaris 2.6/7/8/9，可通过 SunSolve 网站下载并安装补丁。如无法立即打补丁，可在 inetd.conf 中注释 cachefsd 服务行并重启 inetd 以禁用该服务，或在网络边界防火墙封禁对 cachefsd 端口（默认 100235/TCP）的访问作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Sun Solaris cachefsd 远程堆溢出漏洞"
updated = "2026-06-16T21:56:37Z"

