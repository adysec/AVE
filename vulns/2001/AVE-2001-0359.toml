[basic]
description = "GNU groff 的 pic 预处理工具中存在格式化字符串漏洞，远程攻击者可通过向目标系统发送特制的 plot 命令，利用格式化字符串说明符绕过 -S 安全选项，从而执行任意命令。该漏洞影响 groff 1.16.1 及更早版本、jgroff 1.15 之前版本，CVSS 评分 7.5，危害等级高。攻击者无需身份认证即可远程利用，成功利用后可完全控制受影响系统。"
published = "2001-07-26T04:00:00Z"
remediation = "升级 groff 至 1.17 及以上版本，或安装对应发行版安全补丁（Debian DSA-072）。如无法升级，避免将 groff/pic 暴露给不可信输入，不在 LPD 打印服务中直接处理用户提交的 plot 文件，并禁用 groff -S 选项的远程调用。对于 jgroff 用户，升级至 1.15 及以上版本。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "GNU groff pic 格式化字符串漏洞"
updated = "2026-06-16T21:55:25Z"

