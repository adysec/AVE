[basic]
description = "Apache Tomcat 3.x 和 4.x 版本的 JSP 引擎在处理 WPrinterJob().pageSetup(null,null) 调用时存在拒绝服务漏洞。拥有 Web 页面发布权限的攻击者可通过上传或部署包含恶意 JSP 代码的页面触发该漏洞，导致 Tomcat 服务引擎崩溃，造成拒绝服务。该漏洞无需身份认证即可远程利用，影响 Apache Tomcat 3.x 及 4.0.3 及更早版本。"
published = "2002-10-04T04:00:00Z"
remediation = "升级到 Apache Tomcat 9.0.x 或更高版本（Tomcat 4.x 已停止支持，不再发布安全更新）。在生产环境中禁止非授权用户上传或部署 JSP 文件，删除默认的 examples 和 manager 示例应用目录。同时配置安全管理器（SecurityManager）限制 JSP 引擎调用系统打印相关 API 的权限。如无法立即升级，在反向代理层限制对 JSP 文件的写入和部署接口的访问。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Apache Tomcat JSP Engine 拒绝服务漏洞"
updated = "2026-06-16T21:58:25Z"

