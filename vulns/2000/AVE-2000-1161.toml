[basic]
description = "Phorum 3.0.7 的 read.php3 及其他脚本中存在 SQL 注入漏洞，远程攻击者无需认证即可通过 sSQL 参数向数据库注入恶意 SQL 查询语句，导致数据库信息泄露、数据篡改或进一步获取系统控制权。攻击条件低，仅需目标系统运行 Phorum 3.0.7 且 Web 应用可被网络访问即可实施注入攻击。"
published = "2000-12-31T05:00:00Z"
remediation = "升级 Phorum 至最新版本（当前为 6.0.4），该版本已修复 SQL 注入漏洞并支持 PHP 8。如无法升级，对所有用户输入参数（尤其是 sSQL 参数）进行严格的参数化查询或使用 prepared statements，禁止直接拼接 SQL 语句；同时在应用层对输入内容进行白名单过滤，移除单引号、分号、注释符等 SQL 特殊字符。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Phorum 3.0.7 SQL注入漏洞"
updated = "2026-06-16T21:53:26Z"

