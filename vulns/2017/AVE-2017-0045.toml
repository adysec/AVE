[basic]
description = "tags.<value>WSO2 Data Analytics Server 3.1.0 版本的 add_collection_ajaxprocessor.jsp 页面存在反射型跨站脚本漏洞（CWE-79），攻击者可通过向该页面发送包含恶意脚本的 collectionName 或 parentPath 参数，在受害者浏览器中注入并执行任意 JavaScript 代码。该漏洞无需身份认证即可触发，攻击条件宽松，影响所有使用受影响版本的 WSO2 Data Analytics Server 用户，可能导致会话劫持、凭据窃取或钓鱼攻击等后续危害。"
published = "2017-09-21T18:29:00Z"
remediation = "立即将 WSO2 Data Analytics Server 从 3.1.0 升级至 3.2.0 或更高版本以修复 XSS 漏洞。在无法升级前，可对 collectionName 和 parentPath 参数进行输入过滤与输出编码，限制管理控制台访问来源 IP 作为临时缓解措施。"
score = 4.8
severity = "MEDIUM"
sources = ["nuclei"]
title = "WSO2 Data Analytics Server 3.1.0 add_collection_ajaxprocessor.jsp 参数跨站脚本攻击"
updated = "2026-06-17T01:06:34Z"

