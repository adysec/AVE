[basic]
description = "Linux 系统的 lpd（行式打印机守护进程）在 lpr 软件包中对客户端进行身份验证时，通过反向 DNS 解析获取本地主机名，并将其与 gethostname 返回的打印服务器主机名进行比较以决定是否允许访问。由于该验证逻辑存在缺陷，未经身份认证的远程攻击者可通过修改自身 IP 地址对应的 DNS 反向解析记录，将主机名伪装成受信任的打印服务器主机名，从而绕过访问控制限制。该漏洞影响 RedHat 6.1、IRIX 6.5.18 等多个 Linux/UNIX 操作系统的 lpr 包，攻击者利用后可执行任意命令，CVSS 评分高达 10.0，危害等级严重。"
published = "2000-01-08T05:00:00Z"
remediation = "建议立即升级 lpr 包至修复版本（RedHat 6.1 升级至 lpr-0.48-1 或更高版本，IRIX 6.5.18 应用 SGI 安全补丁 1738）。若无法升级，请在防火墙层面封锁 TCP 515 端口（lpd 服务端口），并在 /etc/hosts.lpd 中严格限制允许连接的打印服务器主机名，禁止依赖反向 DNS 解析进行认证。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "RedHat Linux lpd 身份认证绕过漏洞"
updated = "2026-06-16T21:53:24Z"

