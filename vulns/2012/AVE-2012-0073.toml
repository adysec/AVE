[basic]
description = "该漏洞是 WebKit 引擎存在的跨站脚本（XSS）漏洞，影响使用该引擎的 Apple Safari 浏览器和 iOS 系统。攻击者可通过构造恶意网站并利用 drag-and-drop 操作在用户浏览器中注入任意 JavaScript 或 HTML 代码，实现跨站脚本攻击。漏洞影响 Safari 版本低于 5.1.4 的用户，以及 iOS 版本低于 5.1 的设备。攻击者仅需诱导受害者访问精心 crafted 的网站并执行拖放操作即可触发漏洞，导致受害者浏览器执行恶意脚本，可能窃取会话 cookie、执行任意操作或获取敏感信息。基于 CVSS 4.3 评分（AV:N/AC:M/Au:N/C:N/I:P/A:N），该漏洞被评估为中危等级。Apple 已在后续版本中修复了此安全问题，建议用户升级到支持版本以获取保护。"
published = "2012-03-08T22:55:02Z"
remediation = "升级 Safari 至 5.1.4 或更高版本，或将 iOS 升级至 5.1 及以上版本。临时缓解措施：在 Safari 偏好设置中禁用 JavaScript，或避免在不可信网站上进行拖拽操作。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple WebKit 跨站脚本漏洞"
updated = "2026-06-16T23:37:53Z"

