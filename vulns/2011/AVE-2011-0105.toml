[basic]
description = "Adobe Flash Player 10.3.183.10之前版本存在安全限制绕过漏洞。该漏洞源于Flash Player未能正确实施安全策略控制，攻击者可通过诱导用户访问恶意网站或打开特制Flash文件，利用未指定的向量绕过预期的访问限制，从而获取敏感信息。攻击无需身份认证，远程低复杂度即可触发，影响Windows、Mac OS X、Linux、Solaris及Android平台。Adobe已在10.3.183.10版本中修复此漏洞。"
published = "2011-09-22T03:38:38Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.10 及以上版本（Windows/Mac/Linux/Solaris）或 10.3.186.7 及以上版本（Android）。由于 Flash Player 已终止支持，建议彻底卸载 Flash Player 并迁移至 HTML5 标准，同时在浏览器中禁用 Flash 插件作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Adobe Flash Player 安全限制绕过信息泄露漏洞"
updated = "2026-06-16T23:31:18Z"

