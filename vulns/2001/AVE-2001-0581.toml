[basic]
description = "BroadVision One-To-One Enterprise 存在路径信息泄露漏洞，远程攻击者可通过向服务器请求一个不存在的 .JSP 文件名，触发应用程序在错误响应中泄露底层物理文件路径。该漏洞影响所有部署 BroadVision One-To-One Enterprise 平台的 Web 应用系统，攻击者无需身份认证即可远程利用。攻击者仅需发送简单的 HTTP 请求即可获取服务器文件系统的物理路径信息，进而结合目录遍历或文件读取漏洞，实现对服务器敏感文件的定向访问，导致服务器内部结构、配置文件路径及部署环境等关键信息泄露，为后续渗透攻击提供重要参考依据。"
published = "2001-02-16T05:00:00.000"
remediation = "升级 BroadVision One-To-One Enterprise 至厂商发布的最新补丁版本，并在应用服务器配置中禁用详细错误信息输出，将自定义错误页面设置为不显示物理路径。如无法立即升级，可在前端 Web 服务器（如 Apache 或 IIS）中配置 ErrorDocument 或自定义错误页面，拦截包含路径信息的错误响应，防止攻击者通过请求不存在 .JSP 文件获取服务器物理路径。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "BroadVision One-To-One Enterprise 路径信息泄露漏洞"
updated = "2026-06-16T21:53:31.450"

