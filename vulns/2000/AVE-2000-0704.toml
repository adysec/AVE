[basic]
description = "cURL 6.1 至 7.4 版本及 curl-ssl 6.0-1.2 之前版本存在远程缓冲区溢出漏洞，攻击者可通过构造恶意请求强制生成超长错误消息触发缓冲区溢出，从而在目标系统上执行任意命令。该漏洞影响所有使用受影响版本 cURL 库的应用程序，无需身份认证即可远程利用，CVSS 评分 10.0 属于严重级别。攻击者只需向运行易受攻击 cURL 版本的服务发送特制请求即可触发漏洞，建议升级至 cURL 7.4 或更高版本，以及 curl-ssl 6.0-1.2 或更高版本修复此漏洞。"
published = "2000-12-19T05:00:00Z"
remediation = "立即升级 cURL 至 6.0-1.1 及以上版本，或升级 curl-ssl 至 6.0-1.2 及以上版本。若暂时无法升级，可在防火墙层面限制非受信来源的 HTTP/HTTPS 请求访问受影响服务，或禁用不必要的 cURL 网络调用功能作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "cURL cURL 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:52:53Z"

