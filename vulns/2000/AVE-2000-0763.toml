[basic]
description = "该漏洞存在于 Sun Java web server 2.0 及更早版本的默认配置中。这些版本允许攻击者上传 Java 代码到服务器，通过 `board.html` 界面直接调用 JSP 编译器servlet来执行任意命令，从而完全控制目标服务器。该漏洞影响早期Java网络服务器产品，攻击者无需任何权限即可远程利用这一漏洞。攻击者首先通过web界面上传恶意Java源代码，然后利用系统的JSP编译功能来执行这些代码，没有安全验证机制。这导致攻击者能够在目标服务器上执行任意命令，窃取敏感数据、破坏系统或利用该漏洞进一步攻击内部网络。 CVSS评分7.5表明该漏洞的安全影响较严重。尽管该漏洞已非常古老，但它体现了一个基本的Web应用安全原则：应用服务器不应允许未经授权的代码上传和直接编译执行的默认行为。攻击者可以轻易地在目标系统上建立后门，或利用上传的恶意代码进行数据窃取或系统破坏。该漏洞提醒开发者应严格限制代码上传和执行的权限，即使在开发或测试环境中也不应允许这种直接的代码执行机制存在。"
published = "2000-07-12T04:00:00.000"
remediation = "立即迁移至 Apache Tomcat 10.1 / Jetty 12 / Undertow 等现代 Servlet 容器；若必须维持旧环境，立即删除 webapps/ROOT/board.html 并删除/禁用 JSP 编译 Servlet（jspc/servlet），在防火墙层面禁止外部访问管理端口与文件上传目录，并部署 WAF 规则拦截 .jsp/.java 上传请求。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Sun Java System Web Server 远程代码执行漏洞"
updated = "2026-06-16T21:52:08.707"

