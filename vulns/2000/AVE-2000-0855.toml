[basic]
description = "OpenSSL 0.9.6 及更早版本在生成 RSA 密钥时，crypto/rsa/rsa_gen.c 文件对超过表达式大小的 C 语言按位移位操作处理不当，导致在 64 位 HP-UX 平台上生成的加密密钥强度被削弱。未经身份认证的远程攻击者可利用该漏洞，通过触发系统生成弱 RSA 密钥来绕过加密保护机制，破坏 TLS/SSL 等安全通信的保密性，实现中间人攻击或敏感数据窃取。该漏洞影响使用受影响版本 OpenSSL 的服务和应用。"
published = "2016-05-05T01:59:00Z"
remediation = "将 OpenSSL 升级至 0.9.6 或更高版本，该版本已修复 crypto/rsa/rsa_gen.c 中 64 位 HP-UX 平台上按位移位操作的缺陷。如暂无法升级，可在 64 位 HP-UX 系统上临时禁用 OpenSSL 的 RSA 密钥生成功能，或通过防火墙限制对 SSL/TLS 服务的远程访问以降低风险。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "OpenSSL RSA密钥生成不当漏洞"
updated = "2026-06-16T21:53:27Z"

