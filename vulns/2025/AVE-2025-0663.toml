[basic]
description = "Windows 路由和远程访问服务（RRAS）存在缓冲区过度读取（Buffer over-read）漏洞，属于 CWE-126 类型。未经身份认证的远程攻击者可通过向目标系统发送特制的网络请求触发该漏洞，导致越界读取内存中的敏感信息，造成机密性泄露。该漏洞攻击复杂度低，无需特殊权限，但需要用户交互配合。CVSS 评分 6.5，危害等级中危。Microsoft 已在 2025 年 4 月安全更新中发布补丁修复此漏洞。"
published = "2025-04-08T18:15:45Z"
remediation = "建议立即安装 Microsoft 2025 年 4 月安全更新。各版本对应补丁：Windows Server 2008 SP2 升级至 6.0.6003.23220 以上，Server 2008 R2 SP1 升级至 6.1.7601.27670 以上，Server 2012 升级至 6.2.9200.25423 以上，Server 2012 R2 升级至 6.3.9600.22523 以上，Server 2016 升级至 10.0.14393.7969 以上，Server 2019 升级至 10.0.17763.7136 以上，Server 2022 升级至 10.0.20348.3453 以上，Server 2025 升级至 10.0.26100.3775 以上。也可通过 Windows Update 自动获取更新。如无法立即打补丁，可在防火墙层面限制对 RRAS 服务的远程访问，仅允许受信 IP 连接。"
score = 6.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 路由和远程访问服务 (RRAS) 缓冲区过度读取信息泄露漏洞"
updated = "2026-06-17T08:42:45Z"

