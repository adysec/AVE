[basic]
description = "Adobe Flash Player 存在内存破坏漏洞（CWE-119），远程攻击者可通过向用户发送特制的 SWF 文件触发该漏洞。由于 Flash Player 在处理畸形 SWF 文件时存在内存处理缺陷，攻击者可利用该漏洞实现任意代码执行或导致目标程序崩溃拒绝服务。攻击条件仅需用户使用受影响版本浏览器或播放器打开恶意 SWF 文件，无需额外认证。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上的 Adobe Flash Player 10.3.183.5 之前版本及 Adobe AIR 2.7.1 之前版本，CVSS 评分 9.3，危害严重。"
published = "2011-08-15T21:55:01Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.5 及以上版本（Windows/Mac/Linux/Solaris）或 10.3.186.3 及以上版本（Android），同时升级 Adobe AIR 至 2.7.1 及以上版本。如无法升级，在浏览器中禁用 Flash 插件或配置组策略禁止 Flash 执行，并避免打开来源不明的 SWF 文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏漏洞"
updated = "2026-06-16T23:31:18Z"

