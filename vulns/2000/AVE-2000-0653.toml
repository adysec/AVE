[basic]
description = "Max Feoktistov Small HTTP Server 2.03 及更早版本存在内存泄漏漏洞。远程攻击者可通过反复请求一个不包含 index.html 文件的目录 URL，导致服务器内存持续消耗且请求完成后无法释放，最终造成拒绝服务。攻击无需身份认证，通过网络即可触发，利用门槛低。该漏洞影响 Small HTTP Server 2.03 及之前所有版本，CVSS 评分 5.0，危害等级中危。"
published = "2001-01-09T05:00:00Z"
remediation = "建议立即升级 Small HTTP Server 至 2.03 以上版本，或停止使用该已停止维护的软件，改用 Apache HTTP Server、Nginx 等活跃维护的 Web 服务器。如无法升级，可在反向代理层面限制单个 IP 的请求频率作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Max Feoktistov Small HTTP Server 拒绝服务漏洞"
updated = "2026-06-16T21:52:42Z"

