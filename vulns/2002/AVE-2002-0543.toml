[basic]
description = "phpWebSite 0.8.2 及更早版本中的 modsecurity.php 1.10 及更早版本存在 PHP 文件包含漏洞。远程攻击者可通过构造恶意 inc_prefix 参数，指向外部服务器上的恶意 PHP 代码，导致任意 PHP 代码执行。攻击者无需身份认证即可利用该漏洞，完全控制目标网站服务器，窃取敏感数据或植入后门。该漏洞 CVSS 评分 7.5，危害等级高，影响范围广泛。"
published = "2002-10-04T04:00:00Z"
remediation = "升级到 phpWebSite 0.8.3 或更高版本，该版本已修复 `modsecurity.php` 中 `inc_prefix` 参数未正确过滤远程路径的问题。如无法升级，在 `modsecurity.php` 和 `catalog/inludes/include_once.php` 中对 `inc_prefix` 参数做白名单校验，仅允许本地路径前缀（如 `./` 或 `include/`），禁止包含 `http://` 或 `ftp://` 开头的远程 URL。由于 phpWebSite 已停止维护，建议迁移至其他活跃维护的 CMS 系统（如 WordPress 或 Drupal）以持续获得安全更新。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "phpWebSite 0.8.2 PHP文件包含漏洞"
updated = "2026-06-16T21:58:47Z"

