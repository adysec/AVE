[basic]
description = "Net CheckBO 1.56 是一款网络监控与端口检测工具，该软件在运行时会开放多个 TCP 端口用于监听服务。然而，该版本存在拒绝服务漏洞，其漏洞原理在于软件对监听端口的输入数据缺乏合理的速率限制和缓冲区溢出保护。未经身份认证的远程攻击者仅需向目标主机上 CheckBO 程序所监听的 TCP 端口持续发送大量字符数据（即端口洪水攻击），即可导致程序因资源耗尽而无法正常处理合法请求，进而造成服务中断或程序崩溃。该漏洞影响 TheNet CheckBO 1.56 版本，攻击条件极为宽松，攻击者无需任何身份认证凭据，也无需复杂的利用代码，仅需基本的网络连接能力即可发起攻击，可通过简单的网络工具（如 telnet 或自定义脚本）向目标端口持续发送数据完成利用，最终导致目标系统的网络监控服务不可用，CVSS v2 评分为 5.0，危害等级为中等。"
published = "2001-07-02T00:00:00Z"
remediation = "升级 The Net CheckBO 至最新版本以修复 TCP 端口洪泛拒绝服务漏洞。若厂商未发布补丁，应在防火墙或边界路由器上对软件监听的 TCP 端口配置连接速率限制规则，使用 iptables recent 模块或 connlimit 限制单 IP 连接数，并部署 IDS/IPS 检测异常 TCP 洪水流量。同时建议将服务绑定至内部网络接口或通过 VPN 限制访问来源，减少暴露面。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Net CheckBo 1.56 TCP 端口泛洪拒绝服务漏洞"
updated = "2001-07-02T00:00:00Z"

