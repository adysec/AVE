[basic]
description = "Windows 内核存在整数溢出漏洞（CWE-131），由于对输入数据长度校验不当导致计算缓冲区大小时发生溢出。本地攻击者可在获得低权限后通过运行特制程序触发该漏洞，在内核上下文中执行任意代码，实现权限提升至 SYSTEM 级别。该漏洞影响 Windows 10/11 及 Windows Server 多个版本，CVSS 评分 7.8，危害等级高。Google Project Zero 已公开技术分析，表明该漏洞曾在野外被利用。Microsoft 已在 2020 年 11 月安全更新中修复。"
published = "2020-11-11T07:15:18Z"
remediation = "立即安装 Microsoft 2020 年 11 月安全更新（KB4586781 或 KB4586793），通过 Windows Update 或 Microsoft Update Catalog 获取。该漏洞已被在野利用，无法立即打补丁时建议限制本地用户登录权限并启用 Windows Defender 攻击面减少（ASR）规则。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows 内核本地特权提升漏洞"
updated = "2026-06-17T02:58:39Z"

