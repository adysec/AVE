[basic]
description = "Vim 6.0 及 6.1 版本（可能包括其他版本）的 modeline 功能中存在 libcall 特性未正确沙箱化的问题。当用户使用 vim 编辑恶意构造的文件时，攻击者可通过 modeline 中的 libcall 调用执行任意系统命令，例如通过 mutt 邮件客户端触发。该漏洞利用条件为攻击者需诱使用户打开恶意文件，影响范围涉及 Vim 6.x 系列版本，可导致任意命令执行，危害较大。"
published = "2002-12-23T05:00:00Z"
remediation = "升级 Vim 至 6.2 及以上版本，该版本已对 modeline 中的 libcall 功能实施沙箱隔离。如无法升级，在 vimrc 中设置 set modelines=0 禁用 modeline 解析，或设置 set secure 启用安全模式限制 modeline 执行权限。Red Hat 用户可安装 RHSA-2002:297 提供的修补版 vim-6.1-5.8，Solaris 用户安装 Sun 补丁 55700。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "Vim vim 模型行libcall功能任意命令执行漏洞"
updated = "2026-06-16T21:59:12Z"

