[basic]
description = "Windows MapUrlToZone 函数存在路径等价性解析不当漏洞（CWE-41），该函数用于将 URL 映射到 Internet、本地 Intranet、受信任站点等安全区域。未经身份认证的攻击者可通过网络诱导用户访问特制 URL，利用路径解析缺陷绕过安全区域检查机制，导致本应归入受限区域的 URL 被错误归类为低风险区域，造成机密性低度影响。攻击需用户交互，无需提前获取权限。Microsoft 已在 2025 年 3 月安全更新中修复。"
published = "2025-03-11T17:16:20Z"
remediation = "建议立即安装 Microsoft 2025 年 3 月安全更新。各受影响版本对应修复版本号：Windows 10 1507 升级至 10.0.10240.20947、Windows 10 1607/Server 2016 升级至 10.0.14393.7876、Windows 10 1809/Server 2019 升级至 10.0.17763.7009、Windows 10 21H2 升级至 10.0.19044.5608、Windows 10 22H2 升级至 10.0.19045.5608、Windows 11 22H2 升级至 10.0.22621.5039、Windows 11 23H2 升级至 10.0.22631.5039、Windows 11 24H2 升级至 10.0.26100.3476、Server 2022 升级至 10.0.20348.3270、Server 2025 升级至 10.0.26100.3403。可通过 Windows Update 自动获取更新，或从 Microsoft 更新目录网站手动下载安装。临时缓解措施：限制不受信任来源对 URL 解析功能的调用，避免用户从不受信来源打开链接。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows MapUrlToZone 安全功能绕过漏洞"
updated = "2026-06-17T08:42:53Z"

