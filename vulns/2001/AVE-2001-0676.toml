[basic]
description = "Windows Media Player 7 及更早版本在处理 Internet 快捷方式时存在安全设计缺陷。该软件将包含 HTML 内容的 Internet 快捷方式文件存储在用户临时文件夹中，并使用固定文件名而非 Internet Explorer 的标准缓存机制来管理这些文件。由于快捷方式文件被存储在固定位置，攻击者可以预先知晓其存储路径和文件名，并通过诱骗用户打开恶意媒体文件的方式，使快捷方式中的 HTML 内容在本地计算机安全区域（Local Computer Zone）而非受限的 Internet 区域（Internet Zone）中执行。在本地计算机安全区域中运行的脚本拥有更高的权限，攻击者可借此读取目标系统上的敏感文件，造成信息泄露。该漏洞影响 Windows Media Player 7 及更早版本，攻击者无需身份认证即可通过网络远程发起攻击，攻击复杂度低。Microsoft 已在 MS01-029 安全公告中发布补丁修复此问题。"
published = "2001-06-27T04:00:00Z"
remediation = "安装 Microsoft 安全公告 MS01-029 补丁，Windows Media Player 6.4 用户应下载并安装安全更新补丁，Windows Media Player 7 用户应升级到 Windows Media Player 7.1 版本。补丁通过随机化临时文件夹中的 Internet 快捷方式文件名来修复漏洞。如暂时无法升级，可在 Internet Explorer 安全区域设置中限制 ActiveX 控件和插件的自动运行，并谨慎点击可疑链接或打开来源不明的 HTML 邮件。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "微软 Windows Media Player 区域安全绕过漏洞"
updated = "2026-06-16T21:53:57Z"

