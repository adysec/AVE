[basic]
description = "佳能激光打印机和小型办公多功能一体机在处理 XPS 字体 fpgm 数据时存在缓冲区溢出漏洞（CWE-787），该漏洞源于对特制 XPS 文档中字体程序（fpgm）数据长度校验不充分，导致越界写入。网络相邻的攻击者无需身份认证即可向受影响设备发送特制的打印作业或 XPS 文件触发该漏洞，成功利用可导致设备拒绝服务或远程代码执行。该漏洞影响佳能日本、美国、欧洲市场多个系列打印机固件 v06.02 及更早版本，CVSS 4.0 评分 9.3，危害等级严重。该漏洞在 Pwn2Own 大赛中被公开披露，厂商已发布安全公告 CP2026-001 并提供固件更新修复。"
published = "2026-01-16T00:16:27Z"
remediation = "立即将受影响设备（Satera LBP670C/MF750C系列、Color imageCLASS LBP630C/MF650C系列、imageCLASS LBP230系列/MF450系列、i-SENSYS LBP630C/MF650C系列等）的固件升级至 v06.02 之后的版本。请访问 https://psirt.canon/advisory-information/cp2026-001/ 或 https://canon.jp/support/support-info/260115vulnerability-response 下载对应型号的最新固件。在无法立即升级的情况下，建议在网络层面限制打印机仅对受信任的管理端开放打印服务端口，并将打印机部署在独立 VLAN 中，避免与不受信网络直接连通。"
score = 9.3
severity = "CRITICAL"
sources = ["zdi"]
title = "佳能 imageCLASS 等多款打印机 TTF 解析越界写入远程代码执行漏洞"
updated = "2026-06-17T08:35:35Z"

