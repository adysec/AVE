[basic]
description = "Apache Win32 版本（1.3.24 之前及 2.0.x 系列 2.0.34-beta 之前）在处理批处理文件（.bat/.cmd）请求时存在 OS 命令注入漏洞。由于服务器未对传递给 shell 解释器（cmd.exe）的参数进行过滤，远程攻击者可通过在请求参数中插入管道符（|）等 shell 元字符，将任意系统命令附加到批处理文件执行流程中。攻击者无需身份认证即可远程利用，且 Windows 平台上的 Apache 通常以 SYSTEM 权限运行，成功利用可导致目标服务器被完全控制。该漏洞影响范围广泛，已有公开利用代码（Exploit-DB 21350）。"
published = "2002-03-21T05:00:00Z"
remediation = "升级 Apache 至 1.3.24 及以上版本，或 2.0.34-beta 及以上版本。如无法升级，移除 CGI 目录下的 .bat/.cmd 脚本，或在 Web 应用防火墙中过滤传递给批处理脚本的管道符 | 等 shell 元字符。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Apache Win32 批处理文件远程命令执行漏洞"
updated = "2026-06-16T21:56:41Z"

