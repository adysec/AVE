[basic]
description = "VERITAS Cluster Server（VCS）1.3.0 在 Solaris 系统上存在本地拒绝服务漏洞。该漏洞源于 lltstat 命令的 -L 选项在参数处理上存在缺陷，任何本地低权限用户均可通过向 lltstat 命令传递 -L 选项触发系统内核异常，进而导致系统 panic（内核崩溃）并引发拒绝服务。攻击者需具备对目标 Solaris 系统的本地访问权限，可通过 SSH 登录或物理终端访问等途径获得操作权限后执行该命令，利用过程无需身份认证且操作简单，仅需一条命令即可使整个高可用集群节点崩溃，严重影响业务连续性。Veritas 已在新版本中修复该问题，建议用户升级至安全版本并限制不必要的本地命令访问权限。"
published = "2001-05-03T04:00:00Z"
remediation = "建议立即将 VERITAS Cluster Server (VCS) 从 1.3.0 升级至 1.3.1 或更高版本，以修复 `lltstat` 命令 `-L` 选项导致系统 panic 的本地拒绝服务漏洞。如暂无法升级，可临时修改 `/etc/passwd` 中相关用户的 shell 为受限 shell，或通过文件系统权限将 `/opt/VRTSvcs/bin/lltstat` 设置为仅 root 可执行，限制普通用户直接调用该命令，同时监控系统日志中 VCS 相关进程的异常崩溃记录，待维护窗口期完成版本升级。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "VERITAS Cluster Server 拒绝服务漏洞"
updated = "2026-06-16T21:54:01Z"

