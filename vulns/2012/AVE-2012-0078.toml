[basic]
description = "Apple iOS 5.1 之前版本及 iTunes 10.6 之前版本中使用的 WebKit 引擎存在内存破坏漏洞（CWE-119）。远程攻击者可诱导用户访问特制网站，触发 WebKit 内存处理缺陷，导致内存损坏和应用程序崩溃，成功利用可实现任意代码执行。该漏洞影响 Safari 5.1.4 之前版本、iOS 5.1 之前版本及 iTunes 10.6 之前版本，CVSS 评分 9.3，危害严重。攻击者无需身份认证，仅需诱使用户访问恶意网页即可触发，攻击复杂度中等。"
published = "2012-03-08T22:55:02Z"
remediation = "将 Safari 升级至 5.1.4 或更高版本（Mac OS X 及 Windows 平台），将 iOS 升级至 5.1 或更高版本（iPhone/iPad/iPod touch），将 iTunes 升级至 10.6 或更高版本（Windows 平台）。上述更新均于 2012 年 3 月由 Apple 官方发布，可通过 Apple 软件更新功能或访问 support.apple.com 下载安装。如无法立即升级，建议禁用 JavaScript 并避免访问不可信网站作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:53Z"

