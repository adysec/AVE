[basic]
description = "Progress Database 8.3D 和 9.1C 版本中存在本地缓冲区溢出漏洞，漏洞存在于 _proapsv、_mprosrv、_mprshut、orarx、sqlcpp、_probrkr、_sqlschema 和 _sqldump 等多个组件中。本地攻击者可通过向受影响组件提交特制的输入数据触发缓冲区溢出，从而以数据库进程权限执行任意代码。攻击条件要求攻击者拥有本地系统访问权限，无需身份认证即可利用，CVSS 评分 7.2，危害等级高。"
published = "2001-10-05T04:00:00Z"
remediation = "建议立即升级至 Progress OpenEdge 12.8 或更高版本（当前最新 LTS 版本为 12.8，创新版本为 13.0），该漏洞影响 Progress Database 8.3D 和 9.1C，已超过 20 年未获安全支持。如无法升级，应限制本地用户对受影响二进制文件（_proapsv、_mprosrv、sqlcpp 等）的执行权限，仅授权可信用户访问数据库服务器。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Progress Software Progress Database 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:55:38Z"

