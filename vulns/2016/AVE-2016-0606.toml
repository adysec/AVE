[basic]
description = "多款NETGEAR路由产品（包括R6250、R6400、R6700、R7000、R8000等型号）的cgi-bin接口存在命令注入漏洞，远程攻击者可通过向目标路由器的CGI脚本路径中注入shell元字符（如分号、管道符等）执行任意系统命令。该漏洞源于设备对用户输入的路径参数过滤不严，攻击者无需认证即可利用，结合CSRF攻击可诱导管理员点击恶意链接触发利用，导致设备完全受控。CVSS评分8.8，危害等级高。受影响固件版本需升级至各型号对应的Beta版及以上。"
published = "2016-12-14T16:59:00.350"
remediation = "将受影响的 NETGEAR 路由器固件升级至以下版本或更新：R6250 ≥ 1.0.4.6、R6400 ≥ 1.0.1.18、R6700 ≥ 1.0.1.14、R7000 ≥ 1.0.7.6、R7100LG ≥ 1.0.0.28、R7300DST ≥ 1.0.0.46、R7900 ≥ 1.0.1.8、R8000 ≥ 1.0.3.26。如无法立即升级，可在路由器管理界面禁用远程管理，并限制仅信任 IP 访问管理页面，同时避免在登录状态下访问不可信链接。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "NETGEAR 多款路由器命令注入漏洞"
updated = "2026-06-17T00:50:44.547"

