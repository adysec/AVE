[basic]
description = "phpAuction 是一款基于 PHP 的在线拍卖系统，其 login.php 页面存在未授权管理员创建漏洞。远程攻击者无需任何认证，可直接向 login.php 发送带有 action=insert 参数的 HTTP 请求，并提交自定义用户名，该请求会将攻击者指定的用户名直接写入 adminUsers 数据库表，从而创建管理员账户。成功利用后攻击者可获得后台管理权限，完全控制拍卖系统。该漏洞影响 phpAuction 1.x 及 2.x 版本，CVSS 评分 7.5，危害等级高。"
published = "2002-10-04T04:00:00Z"
remediation = "升级 phpAuction 至厂商发布的修复版本（参见 http://www.phpauction.org/viewnew.php?id=5）。由于该软件已停止维护多年，建议立即迁移至其他受支持的拍卖系统。临时缓解措施可在 Web 服务器（Apache/Nginx）层面对 /admin/login.php 添加 IP 白名单或 HTTP 基本认证，并删除或重命名 login.php 文件中的 action=insert 处理逻辑。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "PHPAuction phpAuction 未授权管理访问漏洞"
updated = "2026-06-16T21:58:31Z"

