[basic]
description = "Endress+Hauser WirelessHART Fieldgate SWG70 3.x 版本存在路径遍历漏洞，攻击者可通过向 fcgi-bin/wgsetcgi 脚本的 filename 参数传递包含 ../ 等目录跳转序列的恶意请求，绕过路径限制读取服务器上的任意文件。该漏洞影响 WirelessHART Fieldgate SWG70 3.0 及后续版本，攻击者无需身份认证即可远程利用，可能导致敏感配置文件泄露。厂商已发布安全更新建议升级至修复版本。"
published = "2018-09-07T22:29:01Z"
remediation = "立即联系 Endress+Hauser 技术支持获取并升级 WirelessHART Fieldgate SWG70 固件至最新版本（该漏洞影响 3.x 全版本，厂商已发布修复固件）。在无法立即升级的情况下，在防火墙或反向代理层面限制对 fcgi-bin/wgsetcgi 接口的访问，仅允许受信任的管理 IP 访问设备 Web 管理界面，并对 filename 参数实施严格的路径白名单校验，禁止包含 ../ 等目录遍历序列。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "Endress+Hauser WirelessHART Fieldgate SWG70 路径遍历漏洞"
updated = "2026-06-17T01:43:37Z"

