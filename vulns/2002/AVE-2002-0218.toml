[basic]
description = "Tarantella Enterprise 3 3.01至3.20版本的安装脚本中存在竞争条件漏洞。安装脚本在执行前创建了一个全局可写的临时 gunzip 程序，本地攻击者可在该程序创建后、执行前的短暂时间窗口内修改其内容，从而以 root 权限执行任意命令，完全控制受影响的系统。攻击需要本地访问权限且利用复杂度较高。"
published = "2002-05-16T04:00:00Z"
remediation = "升级 Tarantella Enterprise 3 至 3.20 以上版本（厂商安全公告 bulletin-04 提供补丁）。如无法升级，安装前手动设置 TMPDIR 为仅 root 可写的安全目录（如 /root/tmp），并确保安装过程中无其他本地用户登录系统。该产品已停止维护，建议迁移至受支持的替代产品。"
score = 6.2
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Tarantella Enterprise 3 安装脚本 gunzip 竞争条件漏洞"
updated = "2026-06-16T21:57:00Z"

