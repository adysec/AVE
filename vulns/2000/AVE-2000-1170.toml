[basic]
description = "CVE-2000-1246是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2010-04-05T15:30:00Z"
remediation = "建议将 Novell NetWare 5.1 的 NWFTPD.nlm 升级至 5.01o 或更高版本，该补丁已包含在 NetWare 5.1 SP3 中，可修复 FTP 服务器在处理 RNFR 失败后 RNTO 命令时的异常崩溃问题。如无法立即升级，可临时通过防火墙限制 FTP 服务的访问来源，仅允许可信 IP 地址连接，以降低被远程认证用户触发拒绝服务的风险。"
