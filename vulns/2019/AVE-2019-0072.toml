[basic]
description = "Quasar 是一个基于 Vue.js 的前端框架，其 2.20.1 及之前版本中公开导出的 `extend()` 工具函数存在原型污染漏洞。当使用 `extend(true, target, source)` 进行深度合并时，攻击者控制的对象的键会被递归复制到目标对象中，但未对 `__proto__`、`constructor`、`prototype` 等原型污染关键属性进行过滤，导致攻击者可将恶意属性写入 `Object.prototype`。攻击者可通过向受影响应用传递包含 `__proto__` 属性的特制对象，实现原型链污染。该漏洞影响所有使用 Quasar 2.20.1 版本且将用户可控对象传入 `extend(true, ...)` 的应用，可能导致逻辑绕过、不安全默认选项注入、拒绝服务等安全风险。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Quasar 框架 extend 工具原型污染漏洞"
