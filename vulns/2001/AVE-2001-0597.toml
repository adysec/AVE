[basic]
description = "Mac OS Runtime for Java (MRJ) 2.2.3 存在安全绕过漏洞，远程攻击者可通过向用户发送恶意 Java applet，利用 ARCHIVE 参数绕过 CODEBASE 安全限制，读取目标系统上任意文件。攻击需要用户使用受影响版本的 MRJ 访问恶意网页，且攻击复杂度较高。该漏洞影响 Mac OS 平台上的 MRJ 2.2.3 版本，可导致敏感信息泄露。"
published = "2001-02-12T05:00:00.000"
remediation = "立即卸载 Mac OS Runtime for Java (MRJ) 2.2.3 及更早版本，该产品已停止技术支持。在浏览器中禁用 Java applet 支持，或移除 Java 浏览器插件。如业务必须使用 Java，请迁移至 Apple 官方推荐的现代 Java 运行时环境（如 Oracle Java 8+），并配置安全策略限制 applet 的文件系统访问权限。"
score = 2.6
severity = "LOW"
sources = ["cve"]
title = "Apple Mac OS Runtime for Java 文件读取漏洞"
updated = "2026-06-16T21:53:35.767"

