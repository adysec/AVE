[basic]
description = "Solaris 8 的 FTP 守护进程（ftpd）存在堆溢出漏洞，归类为 CWE-131 缓冲区大小计算错误。远程攻击者无需身份验证，即可构造超长路径名并向目标 FTP 服务发送 LIST 命令，触发 ftpd 中的 glob 函数生成超长字符串，导致堆缓冲区溢出，进而执行任意系统命令。该漏洞影响运行 Solaris 8 的系统，CVSS v3.1 评分 9.8（严重），攻击者只需能够访问目标 FTP 端口即可发起攻击，无需用户交互或凭据。CERT/CC 发布了 CA-2001-07 安全公告，Sun Microsystems 已发布补丁修复此漏洞。"
published = "2001-06-18T04:00:00.000"
remediation = "立即安装各厂商安全补丁：Solaris 8 用户应通过 SunSolve 获取 Sun Alert 001926 对应补丁（x86 平台 108527 系列、SPARC 平台 108528 系列），HP-UX 11.00 用户应安装 HPSBUX0106-160 安全公告中的 PHSS_24296/PHSS_24297 补丁，SGI IRIX 6.5.x 用户应升级至 6.5.21 或应用 20010601-01-P 公告对应补丁。如无法立即打补丁，可临时禁用 FTP 守护进程（Solaris 执行 `svcadm disable ftp` 或修改 `/etc/inetd.conf` 注释 ftp 行后重启 inetd，HP-UX 执行 `/sbin/init.d/ftpd stop` 并注释 `/etc/inetd.conf` 中 ftp 条目），同时建议在防火墙上阻断外部对 TCP 21 端口的访问，仅允许可信源使用 FTP 服务。"
score = 9.8
severity = "CRITICAL"
sources = ["cve"]
title = "Sun Solaris 8 FTP 服务堆溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:57.727"

