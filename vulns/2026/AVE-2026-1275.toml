[basic]
description = "Quest NetVault Backup 的 NVBUDashboard 组件在处理 JSON-RPC 消息时存在 SQL 注入漏洞。由于未对用户输入的字符串进行充分验证便直接用于构造 SQL 查询，远程攻击者可通过发送特制的 JSON-RPC 请求将恶意 SQL 代码注入数据库查询，进而以 NETWORK SERVICE 权限上下文执行任意代码，实现远程代码执行。该漏洞影响 Quest NetVault Backup 的受感染安装版本，虽然利用需要身份认证，但现有认证机制可被绕过，攻击者可借此完全控制目标系统。CVSSv3.1 评分为 8.8，危害等级严重。"
published = "2026-06-25T00:17:47.823"
remediation = "建议立即将 Quest NetVault Backup 升级至 14.0.2 或更高版本，该版本已修复 NVBUDashboard JSON-RPC 消息处理中的 SQL 注入漏洞。如暂无法升级，应在防火墙或反向代理层面仅允许受信任的 IP 地址访问 NVBUDashboard 接口，并禁用不必要的远程管理功能以降低被利用风险。"
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "Quest NetVault Backup NVBUDashboard SQL注入远程代码执行漏洞"
updated = "2026-06-26T02:03:53.620"

