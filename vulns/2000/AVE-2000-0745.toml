[basic]
description = "标签之间。<value>Top Layer AppSwitch 2500 应用交付控制器在处理 ICMP 数据包时存在拒绝服务漏洞，远程攻击者无需身份认证即可向目标设备发送畸形构造的 ICMP 数据包触发服务中断。该漏洞影响运行 AppSwitch 2500 固件的设备，攻击条件仅需目标在网络层可达且无需任何凭据。攻击成功后将导致设备可用性受损，合法用户可能无法正常访问受保护的后端服务。厂商已发布安全更新修复此问题，建议用户升级固件版本。"
published = "2000-07-19T04:00:00.000"
remediation = "立即在网络边界防火墙处过滤所有来源异常的 ICMP 包（如 oversized ICMP、fragmented ICMP），在 TopLayer AppSwitch 2500 上关闭不必要的 ICMP 类型（如 echo-reply、timestamp-reply），降低被利用发起拒绝服务攻击的风险。由于厂商 TopLayer 已于 2000 年代初期被 Foundry Networks 收购且该设备年代久远，建议将 AppSwitch 2500 替换为受支持的现代交换机以彻底消除此风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "TopLayer AppSwitch 2500.0 ICMP Packet 拒绝服务漏洞 漏洞"
updated = "2026-06-16T21:52:07.427"

