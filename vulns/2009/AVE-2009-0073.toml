[basic]
description = "WebKit 在处理 HTML 文档中的数字字符引用（numeric character references）时存在内存破坏漏洞。攻击者可精心构造包含畸形数字字符引用的 HTML 文档，诱导用户通过受影响的浏览器（Safari 4.0.2 之前版本、iPhone OS 3.1 之前版本、iPod touch 3.1.1 之前版本、KDE KHTML 及 QtWebKit 等）访问，从而触发内存损坏，导致应用崩溃并造成拒绝服务，或进一步利用该漏洞在受影响设备上执行任意代码，完全控制目标系统。攻击仅需用户访问恶意网页即可触发，无需额外权限，危害严重。Apple 建议升级至 Safari 4.0.2、iPhone OS 3.1 及以上版本以修复此漏洞。"
published = "2009-07-09T17:30:00Z"
remediation = "建议立即升级到已修复版本：Safari 用户升级至 4.0.2 或更高版本；iPhone/iPod touch 用户通过 iTunes 升级至 iPhone OS 3.1（iPod touch 为 3.1.1）及以上；使用 KDE 的系统升级 kdelibs 到包含修复的版本（如 4.3.0 以上），并升级 Qt 至 QtWebKit 修复后的版本（4.5.3 以上）。如暂时无法升级，可避免在设备上访问不受信任的网页及邮件中的外部链接，仅浏览信任站点，并通过配置 Web 代理过滤可疑 HTML 内容以降低被利用风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 数字字符引用处理内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:07:55Z"

