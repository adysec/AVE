[basic]
description = "HP-UX 11.0 的 net.init RC 脚本（S008net.init）存在不安全临时文件创建漏洞。本地攻击者可通过在 /tmp/stcp.conf 与目标文件之间建立符号链接，诱导系统在启动网络服务时以 root 权限覆写任意系统文件，导致权限提升或系统崩溃。攻击条件为拥有本地 shell 访问权限，无需额外认证，CVSS 评分 7.2，危害等级高。"
published = "2000-10-20T04:00:00.000"
remediation = "立即将 /etc/rc.config.d 中的 CLEAR_TMP 参数设置为 0 以禁用启动时自动清理临时文件功能，防止 net.init 脚本在重启时跟随符号链接覆盖任意文件。同时安装 HP 官方安全补丁（参考 HP 安全公告 HPSBUX0008-120），升级到修复后的 HP-UX 版本。如无法立即打补丁，可在 /sbin/rc2.d/S008net.init 脚本中增加对 /tmp/stcp.conf 的符号链接检查，在写入前使用 rm -f /tmp/stcp.conf 删除已有链接后再创建临时文件。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "HP HP-UX net.init RC 脚本本地文件覆盖漏洞"
updated = "2026-06-16T21:52:18.083"

