[basic]
description = "D-Link 多款路由器（DWR-116、DWR-512、DWR-712、DWR-912、DWR-921、DWR-111）的 httpd 服务器中存在 OS 命令注入漏洞（CWE-78）。已认证的攻击者可通过向 chkisg.htm 页面的 Sip 参数注入特制的 shell 命令，在设备上以 root 权限执行任意代码，从而完全控制设备。该漏洞攻击复杂度低，无需用户交互，CVSS 评分 8.8，危害等级高。"
published = "2018-10-17T14:29:00Z"
remediation = "立即将受影响的 D-Link 路由器固件升级到厂商发布的最新版本。如官方已停止支持（DWR-116/512/712/912/921/111 系列均已停产），应更换为仍在安全更新期内的设备。临时缓解措施：在路由器管理界面关闭远程管理功能，并在防火墙中限制仅信任 IP 可访问 80/443 端口，禁止从 WAN 侧访问管理页面。"
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "D-Link 多款路由器 httpd 服务 shell 命令注入漏洞"
updated = "2026-06-17T01:34:43Z"

