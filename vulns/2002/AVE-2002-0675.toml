[basic]
description = "Zeus Web Server 4.0 至 4.1r2 版本的 Administration Server 管理界面存在跨站脚本（XSS）漏洞。远程已认证攻击者可通过向 index.fcgi 的 section 参数注入任意 Web 脚本或 HTML 代码，在管理员浏览器中执行任意 JavaScript 代码。该漏洞影响使用 Zeus Web Server 4.0/4.1 系列版本的管理员，攻击者需先获得管理界面的有效认证凭据，随后通过构造包含恶意脚本的 URL 诱使管理员点击，即可窃取会话令牌、篡改服务器配置或执行进一步的攻击操作。建议用户升级至 Zeus Web Server 4.1r2 之后的修复版本，并严格限制管理界面的访问控制。"
published = "2002-12-31T05:00:00Z"
remediation = "建议立即将 Zeus Web Server 升级至 4.1r3 或更高版本，该版本已修复 index.fcgi 中 section 参数的跨站脚本过滤问题。如当前仍运行 4.0 或 4.1r2，应优先替换为仍在支持周期内的 Zeus Traffic Manager 或其他主流 Web 服务器。临时缓解措施包括：在防火墙或反向代理层对 /apps/web/index.fcgi 的 section 参数进行输入过滤，拦截包含 &lt;script&gt;、javascript: 等危险字符的请求；同时强制管理界面仅允许内网或 VPN 访问，禁用公网直接暴露端口 9090，并定期检查管理账号会话超时配置，降低未授权访问风险。"
score = 1.9
severity = "LOW"
sources = ["exploitdb"]
title = "Zeus Web Server 跨站点脚本漏洞"
updated = "2026-06-16T21:59:58Z"

