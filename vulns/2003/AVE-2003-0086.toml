[basic]
description = 'OpenSSH 3.6.1 及更早版本存在安全绕过漏洞。当系统通过数字 IP 地址限制主机访问且禁用 VerifyReverseMapping 选项时，远程攻击者可通过构造包含目标数字 IP 地址的反向 DNS 主机名，从该系统连接目标主机，从而绕过 "from=" 和 "user@host" 地址限制策略，实现未经授权的访问。该漏洞影响所有运行受影响 OpenSSH 版本的 Unix/Linux 系统，攻击者无需身份认证即可利用，危害较大。'
published = "2003-07-02T04:00:00.000"
remediation = "升级 OpenSSH 至 3.7 或更高版本（2003-09-16 发布），该版本已修复此漏洞并将 VerifyReverseMapping 替换为 UseDNS 选项。如无法立即升级，建议启用 VerifyReverseMapping 选项，并避免使用纯数字 IP 地址作为主机访问限制条件，改用主机名方式进行限制。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "OpenSSH OpenSSH 主机访问限制绕过漏洞"
updated = "2026-06-16T22:02:06.543"

