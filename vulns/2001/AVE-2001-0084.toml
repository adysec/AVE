[basic]
description = "SilverPlatter WebSPIRS 是一款文献信息检索系统，其 3.1 及 3.3.1 版本存在目录遍历漏洞。攻击者无需身份认证，即可通过向 sp.nextform 参数注入 ..（点号斜杠）路径穿越序列，读取服务器上的任意敏感文件，例如系统配置文件、用户数据或数据库连接信息。该漏洞利用门槛低，仅需构造恶意的 HTTP 请求即可成功，无需交互即可触发，对使用 WebSPIRS 的服务器构成严重信息泄露风险。攻击者成功利用后可进一步分析系统架构并发动后续渗透攻击。"
published = "2001-06-02T04:00:00Z"
remediation = "建议立即升级至 SilverPlatter WebSPIRS 后续修复版本（如 3.3.2 或更高版本），在 Web 服务器层面配置输入过滤规则拦截 sp.nextform 参数中的 ../ 等目录遍历序列，同时限制应用进程对敏感目录的读取权限，部署 WAF 规则拦截包含路径穿越特征的请求。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "SilverPlatter WebSPIRS 目录遍历漏洞"
updated = "2026-06-16T21:53:53Z"

