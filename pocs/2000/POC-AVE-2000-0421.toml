[info]
author = "ave"
description = "Microsoft IIS 4.0/5.0 .printer ISAPI Extension Buffer Overflow (Code Red) verification"
id = "POC-AVE-2000-0421"
name = "CVE-2000-0504 PoC"
severity = "high"
tags = ["cve-2000-0504"]
vuln_id = [
    "CVE-2000-0504",
    "AVE-2000-0421",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/NULL.printer"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [500]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "ISAPI",
    "extension",
    "buffer",
    "overflow",
]
