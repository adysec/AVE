[basic]
description = "Apple Safari 6.0 之前版本所使用的 WebKit 渲染引擎存在内存破坏漏洞，远程攻击者可通过向用户发送构造的恶意网页，在用户使用受影响版本的 Safari 浏览器访问时触发该漏洞，导致远程代码执行或应用程序崩溃拒绝服务。该漏洞影响 OS X 平台上的 Safari 浏览器以及 iOS 6.0 之前的移动设备，攻击者无需任何身份认证即可利用此漏洞在目标系统上执行任意代码或造成内存损坏，危害等级严重。Apple 已在 Safari 6.0 及 iOS 6.0 安全更新中修复此问题。"
published = "2012-07-25T20:55:02Z"
remediation = "建议立即升级 Apple Safari 至 6.0 或更高版本（OS X 10.8 Mountain Lion 内置，或通过 Mac App Store 单独安装 Safari 6.0 更新）；iOS 设备请升级至 iOS 6.0。如暂无法升级，应避免使用 Safari 访问不受信任的网站，并考虑临时禁用 WebKit 相关脚本执行或改用其他浏览器作为缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:35Z"

