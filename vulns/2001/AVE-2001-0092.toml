[basic]
description = "Brightstation Muscat 1.0 的 Muscat Empower CGI 程序对 DB 参数缺乏有效校验，远程攻击者可通过向该参数发送特制无效请求，触发应用程序在错误响应中泄露服务器的绝对路径信息。该漏洞影响 Brightstation Muscat 1.0 版本，攻击者无需任何身份认证即可在远程发起利用，通过构造包含畸形 DB 参数的 HTTP 请求触发路径泄露，从而获取服务器文件系统结构、Web 根目录路径等敏感信息，为后续进一步渗透攻击提供有利条件。"
published = "2001-06-02T04:00:00Z"
remediation = "建议立即升级至 Brightstation Muscat 最新版本或迁移至受支持的替代产品。若无法升级，可在 Web 服务器配置中禁用 Muscat Empower CGI 程序（删除或重命名相关 .cgi 文件），并配置自定义错误页面避免泄露绝对路径。同时在 WAF/防火墙层面拦截包含 DB 参数的异常请求作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Brightstation Muscat 路径信息泄露漏洞"
updated = "2026-06-16T21:53:54Z"

