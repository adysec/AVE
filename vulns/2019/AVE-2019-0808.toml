[basic]
description = "vBulletin 5.x 至 5.5.4 版本中存在一处代码注入漏洞，位于 ajax/render/widget_php 路由的 widgetConfig[code] 参数。未经身份认证的远程攻击者可直接向目标发送特制的 HTTP 请求，在无需任何权限的情况下注入并执行任意 PHP 代码，从而完全控制服务器。该漏洞利用难度低，公开的 Metasploit 模块和 PoC 脚本已在互联网广泛传播，导致大规模自动化攻击。影响所有未升级的 vBulletin 5.x 论坛系统，CVSS 评分 9.8，危害等级严重。"
published = "2019-09-24T22:15:13Z"
remediation = "立即升级 vBulletin 至 5.5.5 及以上版本，官方已在 5.5.5 中修复了 ajax/render/widget_php 路由中 widgetConfig[code] 参数未授权访问导致的代码注入问题。如无法立即升级，可在 Web 服务器（Nginx/Apache）层面添加规则拦截对 /ajax/render/widget_php 的 POST 请求，或部署 WAF 规则过滤 widgetConfig[code] 参数中的 PHP 代码特征（如 assert、eval、system 等函数调用）。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "vBulletin 5.x widgetConfig 远程代码执行漏洞"
updated = "2026-06-17T02:22:44Z"

