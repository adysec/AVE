[basic]
description = "Linux 内核 Google Virtual Ethernet (gve) 驱动中存在空指针解引用漏洞。当网络接口处于 down 状态时，对 XSK (AF_XDP) 池执行启用或禁用操作会导致 RX 队列指针为 NULL，从而触发空指针解引用，造成系统崩溃。本地低权限攻击者可利用此漏洞发起拒绝服务攻击。该漏洞影响使用 gve 驱动的 Linux 内核系统，CVSS 评分 5.5，危害等级中等。Linux 内核社区已通过补丁修复，在操作 XSK 池前增加队列存在性检查以防范此问题。"
published = "2025-01-21T12:15:26Z"
remediation = "立即升级 Linux 内核至 6.6.70、6.12.9 或 6.13 及以上版本。Ubuntu 24.04 LTS 用户可通过 `apt update && apt install linux-image-6.11.0-1011-lowlatency` 安装 USN-7381-1 更新后重启系统。如无法立即升级，避免在网络接口 down 状态下操作 XSK（AF_XDP）池的启用或禁用，作为临时规避措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel gve 驱动空指针解引用漏洞"
updated = "2026-06-17T08:14:15Z"

