[basic]
description = "Atlassian Jira 7.13.1 之前版本中的 WallboardServlet 资源存在跨站脚本（XSS）漏洞。远程攻击者无需身份认证即可通过 cyclePeriod 参数注入任意 HTML 或 JavaScript 代码，当管理员或其他用户访问被恶意构造的页面时，攻击者可在用户浏览器中执行恶意脚本，窃取会话凭证或执行未授权操作。该漏洞需用户交互触发，CVSS 评分 6.1，危害等级中危。"
published = "2019-05-03T20:29:00Z"
remediation = "升级 Jira 至 7.13.1 或更高版本，该版本已修复 WallboardServlet 中 cyclePeriod 参数的 XSS 注入问题。如无法立即升级，可在反向代理或 WAF 层添加规则，对 /rest/wallboard/ 路径下 cyclePeriod 参数进行 HTML 特殊字符过滤，或限制该接口仅允许管理员 IP 访问。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Atlassian Jira WallboardServlet 跨站脚本漏洞"
updated = "2026-06-17T01:53:33Z"

