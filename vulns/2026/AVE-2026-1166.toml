[basic]
description = "X.Org X服务器与Xwayland在CreateSaverWindow()函数中存在释放后使用（UAF）漏洞。攻击者可在本地更改窗口属性并强制激活屏幕保护程序，触发对已释放内存的读取操作，从而导致信息泄露。该漏洞影响X.Org X服务器及Xwayland组件，CVSS评分为5.5（中等），攻击条件为本地访问、低复杂度、需具备一定权限且无需用户交互。Debian、Red Hat及Ubuntu等发行版的相关软件包均受影响。"
published = "2026-06-05T12:16:39.927"
remediation = '升级 xorg-server 至修复版本：Debian trixie 用户执行 `apt update && apt install xorg-server=2:21.1.16-1.3+deb13u3`；其他发行版请升级至 xorg-server 21.1.23 或更高版本（上游已修复）。若无法立即升级，可临时禁用 X 屏幕保护程序以降低攻击面：编辑 `/etc/X11/xorg.conf` 或创建 `/etc/X11/xorg.conf.d/20-saver.conf`，添加 `Option "blank time" "0"` 和 `Option "standby time" "0"`，随后重启 X 服务或系统。同时限制 X11 客户端连接权限，避免不受信任的客户端访问 X Server。修复后验证：运行 `xorg-server --version` 确认版本号，确认 `/var/log/Xorg.0.log` 中无 CreateSaverWindow 相关告警。'
score = 5.5
severity = "MEDIUM"
sources = ["zdi"]
title = "X.Org X服务器 CreateSaverWindow() use-after-free 信息泄露漏洞"
updated = "2026-08-05T00:17:04.400"

