[basic]
description = "Sun RPC 实现中的 xdr_array 函数存在整数溢出漏洞，远程攻击者可通过向运行 RPC 服务的系统（如 rpc.cmsd 和 dmispd）发送大量参数的恶意 RPC 请求触发该漏洞，导致缓冲区溢出，进而实现远程代码执行。该漏洞影响使用基于 SunRPC 代码的 libc、glibc 及 dietlibc 等库的操作系统，CVSS 评分 9.8，危害等级严重。攻击无需身份认证，利用复杂度低，影响系统机密性、完整性和可用性。"
published = "2002-08-12T04:00:00Z"
remediation = "Linux 系统应升级 glibc 至 2.2.5-12（Debian）或安装 RHSA-2002-166（Red Hat）；MIT Kerberos 5 升级至 krb5-1.2.6 或打补丁 MITKRB5-SA-2002-001；OpenAFS 升级至 1.2.6；FreeBSD 安装 SA-02:34 补丁；NetBSD 升级至 1.6 或打 SA2002-011 补丁；OpenBSD 应用 012_xdr 补丁；Apple Mac OS X 安装 Security Update 2002-08-23；Windows 安装 MS02-057 补丁（仅 Services for Unix 3.0）。临时缓解措施：禁用不必要的 RPC 服务（如 rpc.cmsd、dmispd、kadmind），在防火墙上封锁 RPC 端口 111/TCP 和 111/UDP。"
score = 9.8
severity = "CRITICAL"
sources = ["redhat"]
title = "Sun RPC XDR库xdr_array函数整数溢出远程代码执行漏洞"
updated = "2026-06-16T21:57:20Z"

