[basic]
description = "WebKit内核在Apple iOS和iTunes产品中存在严重内存破坏漏洞。攻击者可通过精心 crafted 的网站触发漏洞，实现远程代码执行或导致应用程序崩溃。受影响的产品包括iOS 5.1以前的版本和iTunes 10.6以前的版本。该漏洞采用低级利用技术，攻击者无需任何权限即可远程发动攻击。漏洞影响范围广泛，因为WebKit是多款Apple产品的基础组件。攻击条件相对简单，只需要受害者访问恶意网站即可触发，该漏洞评估基于CVSS 9.3评分，属于危急等级。攻击者可完全控制受影响应用程序，窃取敏感数据，或破坏系统完整性。该漏洞属于CWE-119类型的内存控制错误，目前已在2012年3月发布的的安全更新中修复，建议用户尽快更新至安全版本。"
published = "2012-03-08T22:55:01Z"
remediation = "立即更新 Apple iOS 至 5.1.1 或更高版本，并更新 iTunes 至 10.6.2 或更高版本，以获取针对 WebKit 中该内存破坏漏洞的修复。升级后请验证补丁已生效。如无法立即更新，可临时通过修改 Safari 的网络设置白名单机制来限制网页访问，降低被利用风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "苹果 Safari WebKit 内存破坏漏洞"
updated = "2026-06-16T23:32:08Z"

