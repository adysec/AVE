[basic]
description = "Zope 2.2.0 至 2.2.4 版本中存在权限保护缺陷，Image 和 File 对象的数据更新方法未正确进行权限校验，导致拥有 DTML 编辑权限的攻击者可越权修改这些对象的原始数据。攻击者无需身份认证即可通过网络远程利用该漏洞，影响数据的完整性和系统安全。该漏洞 CVSS 评分 5.0，危害等级中等，建议升级至修复版本。"
published = "2000-12-18T05:00:00Z"
remediation = "立即安装 Zope 官方于 2000-12-18 发布的安全热修复补丁（Hotfix_2000-12-18），或升级至 Zope 2.2.5 及以上版本。Debian 用户应应用 DSA-007 安全更新，Red Hat 用户应安装 RHSA-2000-135 提供的更新包。如无法立即升级，应严格限制 DTML 编辑权限的授予范围，仅对可信用户开放。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Zope 2.2.4 DTML权限提升漏洞"
updated = "2026-06-16T21:53:23Z"

