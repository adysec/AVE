[basic]
description = "Adobe Flash Player 10.2.152.26 之前版本中存在字体解析漏洞，该漏洞源于程序在处理特制字体文件时存在未指定的解析错误。远程攻击者可通过诱导用户访问包含恶意字体的网页或打开特制文档，触发该漏洞导致任意代码执行。攻击成功后可完全控制受影响的系统，安装程序、查看/更改/删除数据或创建新账户。该漏洞影响 Adobe Flash Player 10.2.152.26 及更早版本，CVSS 评分 9.3，危害等级严重。Adobe 已在 2011 年 2 月发布的安全更新中修复此漏洞。"
published = "2011-02-10T16:00:32Z"
remediation = "立即将 Adobe Flash Player 升级至 10.2.152.26 或更高版本。Adobe 已于 2011 年 2 月发布安全公告 APSB11-02 修复此漏洞。Linux 用户可通过发行版包管理器更新（如 Ubuntu 升级至 10.2.152.27，Red Hat 安装 RHSA-2011:0206 更新）。由于 Adobe 已停止对 Flash Player 的支持，建议彻底卸载 Flash Player 并迁移至 HTML5 方案。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 字体解析远程代码执行漏洞"
updated = "2026-06-16T23:27:40Z"

