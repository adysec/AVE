[basic]
description = "PuTTY 0.53 等 SSH2 客户端及服务器在处理超大尺寸的数据包或字段时存在输入验证不足漏洞（CWE-20），未经身份认证的远程攻击者可通过向目标 SSH 服务发送特制的畸形数据包触发缓冲区溢出，进而导致目标系统崩溃（拒绝服务）或执行任意代码。该漏洞影响使用 PuTTY 0.53 版本及存在类似 SSH 协议解析缺陷的其他 SSH2 客户端/服务器，攻击者无需任何凭据即可在建立 SSH 连接后利用，危害极大。CVSS 评分 10.0，严重等级为严重。"
published = "2002-12-23T05:00:00.000"
remediation = """
tags. Let me make sure my answer is clean and follows the format.

Wait, I should also check if the current TOML structure has any issues I need to be aware of. Looking at the current TOML, the remediation field is malformed with triple quotes and backticks inside. I just need to provide the replacement value.

Let me finalize the remediation text. I want it to be accurate, specific, and actionable.基于 PuTTY 变更日志，0.53b（2002-11-12 发布）已修复 Rapid7 SSHredder 测试套件发现的此漏洞（CERT 公告 CA-2002-36）。

<value>升级 PuTTY 到 0.53b 或更高版本，PuTTY 已在 0.53b 中修复由 Rapid7 SSHredder 测试套件发现的 SSH2 数据包处理缓冲区溢出漏洞（CERT 公告 CA-2002-36）。对于其他受影响的 SSH2 客户端或服务器，应联系厂商获取安全补丁。如无法立即升级，应避免连接不受信任的 SSH 服务器，并通过防火墙限制 SSH 服务的出站连接，同时启用 SSH 协议版本 2 的严格模式以降低风险。"""
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
