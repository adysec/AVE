[basic]
description = "Adobe ColdFusion 的 Apache BlazeDS 库存在 Java 反序列化漏洞（CWE-502），攻击者可通过向目标服务器发送特制的序列化数据包触发该漏洞，无需身份认证即可实现远程代码执行。该漏洞影响 ColdFusion 2016 Update 3 及更早版本、ColdFusion 11 Update 11 及更早版本、ColdFusion 10 Update 22 及更早版本，CVSS 评分 9.8，危害等级严重。攻击者只需网络可达即可利用，无需任何权限或用户交互，已有公开的 Exploit-DB 及 GitHub PoC 代码，实际威胁极高。Adobe 官方已发布安全更新修复此漏洞。"
published = "2017-04-27T14:59:00Z"
remediation = "升级 Adobe ColdFusion 至 2016 Update 4、ColdFusion 11 Update 12 或 ColdFusion 10 Update 23 及以上版本。如无法立即升级，可在 ColdFusion 管理后台禁用 BlazeDS 远程访问，或通过防火墙限制 /flex2gateway/ 和 /messagebroker/ 路径的外部访问。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Adobe ColdFusion 反序列化漏洞"
updated = "2026-06-17T01:17:26Z"

