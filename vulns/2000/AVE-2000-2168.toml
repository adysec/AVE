[basic]
description = "Windows 操作系统默认域名解析器配置存在缺陷，QueryIpMatching 参数默认设置为 0，导致系统会接受来自未主动查询过的主机发送的 DNS 更新响应。未经身份认证的远程攻击者可利用此漏洞向目标系统发送特制的 DNS 更新数据包，对 DNS 缓存进行投毒，将域名解析结果篡改为攻击者控制的恶意服务器地址。该漏洞影响 Windows 98、Windows NT 4.0、Windows 2000 及 Windows XP 等多个版本，CVSS 评分 9.8，危害等级严重。攻击者成功利用后可将用户访问流量重定向至恶意服务器，进而实施中间人攻击、网络钓鱼或恶意软件分发，威胁用户上网安全。"
published = "2000-04-14T04:00:00Z"
remediation = '立即应用微软官方补丁：Windows 2000/XP 安装 MS02-015 或后续安全更新；Windows NT 4.0 安装对应修补程序。同时通过注册表强制启用 IP 地址匹配：打开 regedit，导航至 HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Dnscache\Parameters，创建/修改 DWORD 值 QueryIpMatching 设为 1。重启 DNS 客户端服务或重启系统生效。若无法立即打补丁，可在防火墙层面限制非授权 DNS 服务器响应（仅允许已知 DNS 服务器的 UDP 53 端口入站），并部署 DNSSEC 验证作为长期缓解措施。'
score = 9.8
severity = "CRITICAL"
sources = ["avd"]
title = "Microsoft Windows DNS 缓存投毒漏洞"
updated = "2026-06-16T21:53:24Z"

