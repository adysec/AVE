[basic]
description = "Samba 2.0.7 中的 SWAT（Samba Web 管理工具）在安装时将 cgi.log 日志文件设置为全局可读权限，导致本地攻击者可读取该日志文件中记录的用户名、密码等敏感信息。该漏洞仅需本地低权限用户即可利用，攻击条件简单，影响系统机密性。由于日志文件权限配置不当，攻击者无需特殊权限即可获取管理员或其他用户的认证凭据，进而可能提升权限或横向移动。"
published = "2000-12-19T05:00:00.000"
remediation = "立即升级 Samba 至 2.0.8 或更高版本，该版本已修复 SWAT 日志文件权限问题。如无法升级，手动修改 cgi.log 文件权限为 600（仅属主可读写），并确保 SWAT 日志目录权限为 700，防止本地用户读取敏感信息。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Samba SWAT 日志文件权限信息泄露漏洞"
updated = "2026-06-16T21:52:48.367"

