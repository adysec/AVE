[basic]
description = "Apple Safari 和 iPhone OS 中的 WebKit 引擎存在国际域名（IDN）同形异义字（homoglyph）欺骗漏洞。由于 WebKit 对 Unicode 字符和国际化域名的黑名单过滤不完整，远程攻击者可构造包含与合法字符视觉相似的 Unicode 同形字符的域名，使浏览器地址栏显示的 URL 看似来自可信站点，实则指向攻击者控制的恶意网站，从而实施钓鱼攻击。该漏洞影响运行 iPhone OS 3.1 之前版本的 iPhone 及 iPod touch，也影响 Safari 4.0.3 之前的桌面版本。攻击条件为受害者通过易受攻击的 Safari 浏览器访问攻击者精心构造的恶意 URL，攻击者无需事先认证即可远程发起钓鱼攻击，成功利用后可导致用户敏感信息（如账号密码）被窃取。Apple 已在 iPhone OS 3.1 及 Safari 4.0.3 中修复此漏洞。"
published = "2009-08-12T19:30:00Z"
remediation = "建议将 Safari 浏览器升级至 4.0.3 或更高版本，iPhone/iPod touch 设备升级至 iPhone OS 3.1 或更高版本以彻底修复该漏洞。如暂时无法升级，应警惕包含 Unicode 同形异义字符（Homoglyphs）的网址，手动核对浏览器地址栏显示的域名与目标站点是否完全一致，避免点击可疑链接，以降低钓鱼攻击风险。如需确认设备版本与更新状态，可访问 Apple 官方支持网站查询对应机型的可用系统更新。"
score = 5.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Safari iPhone OS 域名欺骗漏洞"
updated = "2026-06-16T23:08:59Z"

