[basic]
description = 'Opera 浏览器 11.50 之前版本中存在一个未明确说明的严重漏洞，被官方描述为"中等严重问题"。该漏洞允许远程攻击者通过未知攻击向量完全破坏目标系统的机密性、完整性和可用性，无需任何身份认证。由于厂商未公开具体技术细节，该漏洞的具体触发机制和利用方式尚不明确，但 CVSS v2 评分为 10.0（满分），表明其潜在危害极大。Opera 公司在 11.50 版本中修复了此问题。'
published = "2011-07-01T10:55:02Z"
remediation = "升级 Opera 浏览器至 11.50 或更高版本，该版本已修复此未明漏洞。用户可通过 Opera 内置自动更新功能或访问官网下载最新版本进行更新。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Opera 浏览器 未明远程代码执行漏洞"
updated = "2026-06-16T23:31:38Z"

