[basic]
description = 'FreeBSD 4.1.1 及更早版本中的 ppp 网络实用程序未能正确执行"nat deny_incoming"命令所配置的访问控制规则，导致远程攻击者能够绕过该限制直接连接到目标系统。该漏洞影响使用 ppp 建立网络连接并启用 NAT 地址转换功能的 FreeBSD 主机，攻击者无需经过身份认证，只要网络可达即可利用此缺陷发起未经授权的 TCP/IP 连接，进而可能进一步渗透系统内部网络或访问受限服务，造成敏感信息泄露或后续攻击入口的暴露。'
published = "2001-01-09T00:00:00Z"
remediation = "升级 FreeBSD 系统至 4.2-RELEASE 或更高版本以修复 ppp 的 nat deny_incoming 绕过问题。如暂无法升级，可执行如下操作：下载并应用官方补丁 ppp.patch，进入 /usr/src/usr.sbin/ppp 目录执行 patch -p < /path/to/ppp.patch，然后运行 make depend && make all install 重新编译安装。临时缓解措施是在 PPP 网关上启用 ipfw(8) 或 ipf(8) 防火墙，配置规则拒绝所有未明确允许的外部传入连接，以弥补 ppp NAT 过滤失效的风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "FreeBSD ppp 访问控制绕过漏洞"
updated = "2001-01-09T00:00:00Z"

