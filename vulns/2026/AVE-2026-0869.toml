[basic]
description = 'Mistune Python Markdown 解析器的 block_parser.py 中存在算法复杂度缺陷，在处理大量重复或不同的参考链接定义时，解析时间呈二次方增长（O(N²)）。攻击者无需身份认证即可通过提交包含大量重复参考链接定义的恶意 Markdown 文档（如 5000 个 [a]: u\n 定义耗时约 1.1 秒，10000 个约 4.5 秒），导致目标系统 CPU 资源耗尽，造成拒绝服务。该漏洞影响 Mistune 3.3.0 之前的所有版本，已在 3.3.0 版本中修复。'
published = "2026-07-08T17:17:28Z"
remediation = "立即将 mistune 升级至 3.3.0 或更高版本（`pip install --upgrade mistune`）。如无法升级，在调用 `mistune.create_markdown()` 前对用户输入的 Markdown 文档大小进行限制（建议不超过 10KB），并设置超时时间（如 2 秒）以防止 CPU 耗尽。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Mistune Markdown 解析器 时间复杂度攻击漏洞"
updated = "2026-07-09T19:29:34Z"

