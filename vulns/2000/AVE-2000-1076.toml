[basic]
description = "Microsoft SQL Server 及 MSDE 中的 xp_enumresultset 扩展存储过程存在缓冲区长度校验缺陷，调用 srv_paraminfo API 前未正确限制缓冲区长度，导致本地攻击者可通过构造恶意参数触发缓冲区溢出，造成拒绝服务或执行任意代码。该漏洞影响 SQL Server 7.0/2000 及 MSDE 1.0/2000 版本，CVSS 评分 4.6（中等），攻击需本地访问权限，利用方式为调用易受攻击的扩展存储过程传入超长参数。Microsoft 已发布安全公告 MS01-018 提供补丁修复。"
published = "2001-01-09T05:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-092 发布的补丁，下载地址为 https://docs.microsoft.com/en-us/security-updates/securitybulletins/2000/ms00-092。SQL Server 7.0 用户可将补丁应用于 Service Pack 2 之后，或直接升级至 SQL Server 7.0 Service Pack 3；SQL Server 2000 用户可将补丁应用于当前版本，或升级至 SQL Server 2000 Service Pack 1。MSDE 1.0 和 MSDE 2000 用户同样需要安装此补丁。安装后参照 Microsoft Knowledge Base 文章 Q280380（https://support.microsoft.com/default.aspx?scid=kb;en-us;280380）验证补丁是否生效，确认相关文件大小和创建日期与 KB 文章一致。同时检查 SQL Server 服务账户是否遵循最小权限原则，避免以管理员身份运行。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft SQL Server 及 MSDE 扩展存储过程参数解析缓冲区溢出漏洞"
updated = "2026-06-16T21:53:06.773"

