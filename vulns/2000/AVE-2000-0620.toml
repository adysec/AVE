[basic]
description = "Sambar Server 4.3 及 4.4 Beta 3 版本的 search.dll ISAPI Search 组件存在目录遍历漏洞。远程攻击者无需身份认证即可通过向查询参数中指定任意目录路径，利用 Search CGI 功能读取服务器上的敏感文件与目录列表。该漏洞源于程序未对用户输入的查询参数进行充分的路径过滤与校验，导致攻击者可越权访问受限目录。CVSS 评分 5.0，危害等级中等，影响系统机密性。"
published = "2000-11-14T05:00:00Z"
remediation = "立即升级 Sambar Server 至 5.0 及以上版本（该漏洞已在后续版本修复），或彻底移除/禁用 search.dll ISAPI 扩展。如无法升级，在 Web 服务器层面配置 URL 过滤规则，拦截对 /search.dll 的请求，或限制 query 参数仅允许合法字符（拒绝空字节 %00 和路径分隔符 /）。建议迁移至 Apache 或 Nginx 等现代受支持 Web 服务器。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Sambar Server Search CGI 目录遍历漏洞"
updated = "2026-06-16T21:52:33Z"

