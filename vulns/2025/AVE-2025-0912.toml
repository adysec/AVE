[basic]
description = "Linux 内核中的 filemap 组件存在整数截断漏洞，在 32 位内核环境下，folio_seek_hole_data() 函数在处理文件偏移量时错误地将 64 位偏移量截断为 32 位。当具有本地访问权限的已认证攻击者在受影响的系统上向 XFS 文件系统执行写操作时，可能触发无限循环，导致系统拒绝服务。该漏洞影响运行 32 位内核的 Linux 系统，需要本地登录权限才能利用，CVSS 评分 5.5，危害等级中等。"
published = "2025-01-31T12:15:27Z"
remediation = "建议立即将 Linux 内核升级至已修复此漏洞的稳定版本（如针对 SLES 15 SP6 或 Ubuntu 20.04/22.04 的最新补丁版本）。具体操作为执行系统更新命令（如 `sudo apt update && sudo apt upgrade` 或 `zypper update`）并重启服务器以加载新内核。在无法立即升级的情况下，建议避免在 32 位内核环境中使用 XFS 文件系统进行大规模数据写入操作。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 filemap 64位偏移量截断导致无限循环漏洞"
updated = "2026-06-17T08:43:58Z"

