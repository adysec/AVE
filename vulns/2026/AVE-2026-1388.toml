[basic]
description = "Open WebUI 内置知识搜索功能允许已认证用户选择用于检索知识文件的正则表达式模式。当模式包含正则元字符时，系统使用 Python 回溯式 re 引擎对每个文件的每一行执行匹配，且全程未设置执行时间限制。攻击者可构造特殊的回溯正则模式（如 (x|x)*y），配合上传的短文本文件，使单个 CPU 核心长时间满载并阻塞事件循环，导致同一 worker 上的其他用户请求无法得到响应；默认配置下（UVICORN_WORKERS=1）整实例将不可用。该漏洞影响 0.9.6 至 0.11.0 版本，CVSS 评分为 6.5。攻击前提为：默认配置、任意已认证用户（无需提升权限）、用户可上传并读取文件，且需诱导模型调用含攻击模式的知识搜索工具。Open WebUI 已在 0.11.0 版本中将 re 引擎替换为支持超时的 regex 引擎，并设置 2 秒匹配超时以修复此问题。"
published = "2026-08-04T21:16:38Z"
remediation = "立即将 Open WebUI 升级至 0.11.0 或更高版本，可通过 GitHub Releases 页面下载最新安装包或更新 Docker 镜像至 v0.11.0。升级后无需额外配置，系统自动使用 regex 引擎并启用 2 秒匹配超时限制，从根本上阻断正则回溯导致的 CPU 耗尽攻击。如暂时无法升级，可在防火墙或反向代理层限制 knowledge-search 工具接口的访问权限，仅允许受信 IP 调用，以降低被任意认证用户利用的风险。"
score = 6.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Open WebUI 正则表达式回溯拒绝服务漏洞"
updated = "2026-08-05T15:17:12Z"

