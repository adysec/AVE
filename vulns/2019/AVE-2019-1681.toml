[basic]
description = "CVE-2019-8605 是 Apple XNU 内核中 `in6_pcbdetach` 函数存在释放后使用（Use-After-Free）漏洞。当处理 IPv6 套接字拆卸流程时，由于对已释放的指针对象未正确清理，导致悬垂指针被再次引用。本地攻击者可通过运行特制应用程序触发该漏洞，利用悬垂指针实现内核态内存破坏，进而提升至 root 权限执行任意代码。该漏洞影响 macOS 10.14.5 之前版本及 iOS 12.3 之前版本，已有公开利用代码（ExploitDB 46892），Apple 在 HT210118 安全公告中修复。"
published = "2019-12-19T00:00:00Z"
remediation = "立即将 macOS 升级至 10.14.5 或更高版本（High Sierra/Sierra 用户安装 Security Update 2019-003），将 iOS 升级至 12.3 或更高版本。该漏洞位于 XNU 内核 IPv6 协议栈的 in6_pcbdetach 函数中，无有效临时缓解措施，必须通过系统更新彻底修复。"
score = 5
severity = "MEDIUM"
sources = ["kev"]
title = "Apple macOS/iOS XNU 内核释放后使用漏洞"
updated = "2019-12-19T00:00:00Z"

