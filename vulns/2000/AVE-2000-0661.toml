[basic]
description = "Moreover.com 的 cached_feed.cgi 脚本（版本 4.July.00）存在目录遍历漏洞。由于该脚本在处理 category 或 format 参数时未对输入进行严格过滤，远程未经身份验证的攻击者可以通过在请求参数中构造特殊的点点斜杠（../）路径序列，绕过预设的目录限制，从而读取服务器上的任意敏感文件。此漏洞影响使用该特定版本脚本的服务，可能导致系统关键配置或用户数据泄露。"
published = "2000-12-19T05:00:00.000"
remediation = '由于该漏洞年代久远且产品已停止维护，建议在 Web 应用防火墙 (WAF) 或服务器配置中拦截包含 "../" 的恶意请求；在代码层面，应对 cached_feed.cgi 的 category 和 format 参数实施严格的输入校验，过滤掉所有路径遍历字符，并确保文件读取操作仅限于指定的安全目录内。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Moreover.com cached_feed.cgi 脚本目录遍历文件泄露漏洞"
updated = "2026-06-16T21:52:44.133"

