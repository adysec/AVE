[basic]
description = "RealNetworks RealPlayer 的 ActiveX 控件中存在多处堆缓冲区溢出漏洞。当 RealPlayer 处理特制的 .smil 文件参数时，tfile、pnmm 和 cdda 协议处理器未能正确验证输入长度，导致堆缓冲区溢出。远程攻击者可通过构造恶意的 .smil 参数，诱导用户访问恶意网页或打开恶意媒体文件，从而触发该漏洞，实现远程代码执行。受影响的版本包括 RealPlayer 11.0 至 11.1 以及 RealPlayer SP 1.0 至 1.1.4。该漏洞 CVSS 评分为 9.3，危害等级严重。"
published = "2010-10-19T00:00:01Z"
remediation = "立即升级 RealPlayer SP 至 12.0.0.879 或更高版本，该版本修复了多个 ActiveX 协议处理程序（tfile、pnmm、cdda）中的堆缓冲区溢出漏洞。如无法升级，建议卸载 RealPlayer 或禁用相关 ActiveX 控件，在浏览器中设置 killbit 以阻止 RealPlayer ActiveX 控件的自动加载。对于企业环境，可通过组策略禁用 CLSID 相关的 ActiveX 控件。由于 RealPlayer 已停止维护，建议迁移至其他受支持的媒体播放器。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer ActiveX控件堆缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T23:23:26Z"

