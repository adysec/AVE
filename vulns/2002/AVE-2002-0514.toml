[basic]
description = "Working Resources BadBlue 1.7.3 Enterprise/Personal 版本存在拒绝服务漏洞。远程攻击者无需认证即可向目标服务器发送一个不带 URI 的 HTTP GET 请求，触发服务器崩溃导致拒绝服务。该漏洞攻击复杂度低，无需特殊权限即可利用，影响 BadBlue 1.7.3 系列版本。"
published = "2002-10-04T04:00:00.000"
remediation = '建议立即将 BadBlue 升级至 2.0 或更高版本（1.7.3 及更早版本均受影响）。若厂商已停止支持无法升级，应迁移至其他受支持的 Web 服务器（如 Apache HTTP Server、Nginx）。临时缓解措施：在反向代理或 Web 应用防火墙（WAF）层面拦截不含 URI 路径的畸形 GET 请求（如匹配 "GET HTTP/1" 的请求行），并在网络层面限制对 BadBlue 服务端口的访问来源。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Working Resources BadBlue HTTP GET 请求拒绝服务漏洞"
updated = "2026-06-16T21:58:35.020"

