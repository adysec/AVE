[basic]
description = "WordPress tidio-gallery 插件 1.1 版本中存在反射型跨站脚本攻击（XSS）漏洞，该漏洞位于插件处理用户输入时未进行充分的过滤与转义。远程攻击者可构造包含恶意 JavaScript 代码的 URL，诱使用户点击后，恶意脚本将在用户浏览器中执行，导致敏感信息泄露或页面内容篡改。攻击无需身份认证，但需要用户交互（点击链接），CVSS 评分 6.1，危害等级中危。"
published = "2016-10-10T20:59:31Z"
remediation = "该插件已于 2014 年 9 月从 WordPress 官方仓库下架且不再维护，无安全更新可用。建议立即在 WordPress 后台卸载 tidio-gallery 插件，并删除所有相关文件。如必须保留使用，可在 Web 应用防火墙（WAF）中添加规则过滤 ?galleryId= 等参数中的 <script> 等 XSS 载荷作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress tidio-gallery 插件反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:46Z"

