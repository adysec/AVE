[basic]
description = "Pi-hole Web 管理界面（AdminLTE）v4.3.2 存在命令注入漏洞（CWE-78），攻击者需先获取管理员仪表板的认证权限，随后通过构造恶意的 DHCP 静态租约条目，将任意系统命令注入到 Pi-hole 的 DNS 配置处理流程中。该漏洞影响 Pi-hole v4.3.2 及之前版本，攻击者可在目标服务器上执行操作系统级命令，进而篡改整个网络的 DNS 解析结果、劫持流量或进一步横向渗透。官方已在 v4.3.3 版本中修复此问题，建议用户立即升级。"
published = "2020-05-29T19:15:10.983"
remediation = "立即将 Pi-hole AdminLTE 升级至 v4.3.3 或更高版本，该版本已修复 DHCP 静态租约构造导致的远程代码执行漏洞。如无法立即升级，可在 Pi-hole 管理界面中禁用 DHCP 服务或限制仅允许可信 IP 访问管理面板，以降低被利用风险。"
score = 7.2
severity = "HIGH"
sources = ["kev"]
title = "Pi-hole Pi-hole Web 远程代码执行漏洞"
updated = "2026-06-17T03:26:59.643"

