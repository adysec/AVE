[basic]
description = "tags.<value>Opera 浏览器在 11.50 版本之前存在资源管理缺陷。当攻击者通过注入脚本设置 IFRAME 元素的 SRC 属性时，浏览器未能正确处理该请求，导致应用程序崩溃并造成拒绝服务。同时，浏览器在生成错误页面时存在缺陷，若连续请求无效 URL，最终会导致主机磁盘空间被占满、浏览器崩溃且错误文件被遗留。攻击者无需身份认证即可通过网络远程触发该漏洞，影响 Opera 浏览器 11.49 及之前版本。"
published = "2011-07-01T10:55:02Z"
remediation = "立即将 Opera 浏览器升级至 11.50 或更高版本，该版本已修复 IFRAME 元素 SRC 属性注入导致的拒绝服务漏洞。如无法立即升级，可在浏览器设置中禁用 JavaScript 或限制 IFRAME 加载作为临时缓解措施，同时避免访问不可信网页以降低被利用风险。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera 浏览器 iframe 拒绝服务漏洞"
updated = "2026-06-16T23:31:40Z"

