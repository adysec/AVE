[basic]
description = "Grafana 7.0.1 之前版本存在存储型跨站脚本漏洞，攻击者可通过仪表盘快照功能注入恶意 JavaScript 代码。该漏洞源于用户提交的快照数据在渲染前未经过充分清洗，已认证攻击者可构造包含恶意脚本的快照，诱导管理员或其他用户访问时触发代码执行，导致会话劫持、敏感信息窃取或进一步攻击。影响 Grafana 6.x 及 7.0.0 版本，CVSS 评分 5.4（中等），需升级至 7.0.1 或更高版本修复。"
published = "2020-07-28T00:00:00Z"
remediation = "升级到 Grafana 6.7.2 或更高版本以修复该漏洞。在 Grafana 6.7.2 中，官方对 dashboard snapshot 的 originalUrl 字段进行了输入过滤，阻止了 JavaScript 代码的注入。请前往 Grafana 官网下载 6.7.2 或更高版本并替换现有安装。如暂时无法升级，可临时限制创建 dashboard snapshot 的权限，仅向可信用户开放 snapshot 功能，阻止攻击者利用 originalUrl 字段注入恶意脚本。"
score = 5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Grafana Snapshot 存储型跨站脚本漏洞"
updated = "2020-07-28T00:00:00Z"

