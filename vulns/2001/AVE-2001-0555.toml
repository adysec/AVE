[basic]
description = "Mountain Network Systems WebCart 8.4 的 webcart.cgi 脚本存在命令执行漏洞，远程攻击者可通过向 NEXTPAGE 参数注入 shell 元字符（如管道符、分号等）触发该漏洞，在服务器上以 Web 服务进程权限执行任意系统命令。该漏洞影响 WebCart 8.4 版本，攻击无需身份认证，利用复杂度低，可导致敏感信息泄露、网站篡改或进一步渗透内网。ExploitDB 已公开该漏洞的利用代码。"
published = "2001-12-31T05:00:00Z"
remediation = "立即删除或禁用 webcart.cgi 脚本，或限制其仅允许内部访问。在 Web 服务器层面（如 Apache mod_rewrite 或 WAF 规则）过滤 NEXTPAGE 参数中的 shell 元字符（; | & ` $）。建议迁移至受支持的现代电子商务平台，因 Mountain Network Systems 已停止维护 WebCart 产品。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Mountain Network Systems WebCart 8.4 命令执行漏洞"
updated = "2026-06-16T21:56:23Z"

