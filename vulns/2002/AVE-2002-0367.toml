[basic]
description = "MySQL 3.x 至 3.23.54 及 4.x 至 4.0.6 版本的 libmysqlclient 客户端库中的 read_rows 和 read_one_row 函数未正确验证特定响应中的长度字段，存在缓冲区溢出漏洞。远程攻击者可通过向 MySQL 服务器发送特制的恶意响应数据包触发该漏洞，导致服务拒绝响应，甚至可能执行任意代码。该漏洞影响范围广泛，CVSS 评分 7.5，危害等级高。"
published = "2002-12-23T05:00:00Z"
remediation = "升级 MySQL 至 3.23.55 及以上版本（3.x 分支）或 4.0.7 及以上版本（4.x 分支），该漏洞在 libmysqlclient 的 read_rows/read_one_row 函数中修复了长度字段校验问题。如无法立即升级，可在网络边界限制对 MySQL 端口的访问（默认 3306 端口），仅允许可信来源连接。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "MySQL libmysqlclient 客户端库拒绝服务与远程代码执行漏洞"
updated = "2026-06-16T21:59:12Z"

