[basic]
description = "CS&T CorporateTime for the Web 存在用户枚举漏洞，由于登录失败时对无效用户名和无效密码返回不同的错误提示，远程攻击者可通过尝试登录并观察错误信息差异枚举出服务器上的有效用户名。该漏洞影响 CS&T CorporateTime Web 版本，CVSS 评分 5.0（中等），攻击向量为网络，攻击复杂度低，无需认证，仅影响机密性。攻击者可利用该漏洞枚举有效用户名，配合密码猜测或社会工程学进一步攻击账户。厂商已发布补丁修复该漏洞，建议升级至修复版本并统一登录失败提示信息。"
published = "2000-12-11T05:00:00.000"
remediation = "修复建议：1. 修改登录验证逻辑，实现统一错误处理：当用户名不存在或密码错误时，返回相同通用的错误信息（例如“用户名或密码错误”），这样无法区分有效用户名和无效密码。2. 部署CS&T CorporateTime Web最新安全补丁包v3.2.1或更高版本，该版本修复了错误消息泄露漏洞。3. 启用账号锁定保护：连续失败登录3次后，账号自动锁定30分钟，需要人工恢复。4. 增加验证码验证：登录时要求输入图形验证码，进一步防止自动化暴力攻击。5. 配置服务器日志记录所有登录尝试，包括IP地址和时间戳，方便安全审计。6. 如无法立即部署补丁，可通过修改Web服务器配置文件，禁用对登录页面的匿名访问，确保只有认证用户才能访问登录页面，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "CS&T CorporateTime 蛮力攻击漏洞"
