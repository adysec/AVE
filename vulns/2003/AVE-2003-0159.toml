[basic]
description = "OpenSSL 0.9.6k 的 ASN.1 解析器在处理畸形 ASN.1 序列时存在递归调用过深漏洞。未经身份认证的远程攻击者可通过向目标系统发送特制的畸形 ASN.1 序列触发该漏洞，导致程序栈溢出而崩溃，造成拒绝服务。该漏洞主要影响运行 OpenSSL 0.9.6k 的 Windows 平台，攻击者可向启用客户端证书认证的 SSL/TLS 服务器发送恶意构造的证书请求以实施攻击。OpenSSL 官方已在 2003 年 11 月发布安全更新，建议升级至 0.9.6l 或 0.9.7c 版本修复此问题。"
published = "2003-12-01T05:00:00Z"
remediation = "将 OpenSSL 升级至 0.9.6l 或 0.9.7c 版本，并重新编译所有静态链接 OpenSSL 库的应用程序。安装更新后需重启所有使用 OpenSSL 功能的服务或系统。受影响的 Windows 平台用户应优先升级至 0.9.7c。如暂时无法升级，可在防火墙或 WAF 层面过滤畸形 ASN.1 序列的 SSL/TLS 握手报文作为临时缓解。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "OpenSSL ASN.1 解析器递归调用拒绝服务漏洞"
updated = "2026-06-16T22:03:04Z"

