[basic]
description = "Quarkus 是一款用于构建云原生应用的 Java 框架，其基于路径的 HTTP 授权策略存在路径规范化绕过漏洞。攻击者可通过在请求路径中注入编码分号（%3B）绕过安全层的矩阵参数过滤，从而未经授权访问受保护的 API 端点；同时可利用编码斜杠（%2F）或反斜杠（%5C）绕过静态资源路径策略，访问受保护文件。根本原因在于安全层使用 normalizedPath() 进行部分解码后，pathWithoutMatrixParams() 仅搜索字面分号而无法识别编码后的 %3B，导致策略匹配失效。该漏洞影响 Quarkus 多个版本，CVSS 评分 7.5，危害等级高，攻击者无需认证即可远程利用。"
published = "2026-06-19T21:17:02Z"
remediation = "立即升级 Quarkus 至 3.37.0、3.36.3、3.33.2.1/3.33.3、3.27.4.1/3.27.5 或 3.20.6.2 及以上版本。如无法立即升级，可在反向代理层（如 Nginx/HAProxy）对请求路径进行完整 URL 解码后校验，拦截包含 `%3B`、`%2F`、`%5C` 的路径请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Red Hat Quarkus 路径规范化认证授权绕过漏洞"
updated = "2026-07-30T12:18:59Z"

