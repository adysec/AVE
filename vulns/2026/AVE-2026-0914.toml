[basic]
description = """goshs 是一款功能丰富的单二进制文件服务器，其 v2.1.3 版本中 sftpserver.go 的密码处理器使用了 `Username != "" && Password != ""` 条件判断，当管理员以 `-b 'admin:' -sftp` 启动且未启用 `-fkf` 参数时，密码为空导致两个 SFTP 认证处理器均未设置，gliderlabs/ssh 库检测到所有处理器为空后自动启用无客户端认证模式。未经身份认证的远程攻击者可利用此缺陷直接通过 SFTP 协议连接目标服务器，实现未授权文件读取、写入、删除和重命名操作，严重威胁数据机密性和完整性。该漏洞是 CVE-2026-40884 的不完全修复，后者仅拦截了用户名为空的情况，而根本原因（`&&` 条件）仍存在于代码中。CVSS 评分 9.1，危害等级严重。已在 goshs v2.1.4 版本中修复。"""
published = "2026-07-28T23:17:10.077"
remediation = "升级 goshs 至 v2.1.4 或更高版本，该版本修复了 sftpserver.go 中密码处理器的 `&&` 条件判断逻辑。如无法立即升级，避免使用 `-b 'user:' -sftp` 格式（即密码为空）的启动参数，或启用 `-fkf` 密钥认证参数作为临时缓解措施。"
score = 9.1
severity = "CRITICAL"
sources = ["ghsa"]
title = "goshs SFTP 空密码认证绕过漏洞"
updated = "2026-07-30T19:19:45.637"

