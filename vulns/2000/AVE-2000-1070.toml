[basic]
description = "HP JetDirect 打印服务器网卡固件 X.08.20 及更早版本中的 LPD（行式打印机守护进程）服务存在缓冲区溢出漏洞。该漏洞源于 LPD 服务在处理特制的打印请求时未对输入数据进行正确的边界检查，导致攻击者可通过网络向目标设备的 515 端口发送精心构造的数据包触发缓冲区溢出，造成 LPD 服务崩溃或拒绝服务。攻击者无需任何认证即可远程利用，攻击复杂度低，影响 HP JetDirect 系列打印服务器网卡固件版本 X.08.04、X.08.05 及 X.08.20。"
published = "2000-12-11T05:00:00.000"
remediation = "升级 HP JetDirect 打印机网卡固件至 x.08.20 以上版本。HP 官方已发布修复固件，可从 HP 支持网站下载更新，以修复 LPD 服务中的缓冲区溢出漏洞，防止远程拒绝服务攻击。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "HP JetDirect LPD服务缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:53:04.820"

