[basic]
description = "Linux 内核 hns3 网络驱动存在空指针解引用漏洞（CWE-476）。HIP08 设备未注册 ptp 设备，导致 hdev->ptp 指针为 NULL，但数据发送流程仍会尝试使用 SKBTX_HW_TSTAMP 标志设置硬件时间戳信息，从而触发内核崩溃。该漏洞影响使用 hns3 驱动的华为网络设备，本地低权限攻击者可通过发送带有 1588 协议时间戳标志的特制数据包触发此漏洞，导致系统拒绝服务。CVSS v3.1 评分为 5.5，危害等级为中等。"
published = "2025-01-19T11:15:10Z"
remediation = "升级 Linux kernel 至 6.12.10 或更高稳定版本（含 6.13.x 主线版），该漏洞修复补丁已随内核稳定版发布。受影响版本范围为 5.14 至 6.12.9 及 6.13 候选版本。Ubuntu 22.04/24.04 LTS、Debian 12 等发行版用户应安装系统提供的最新内核更新。如暂时无法升级且系统使用 HIP08 网卡，可临时通过 ethtool 或 sysfs 禁用该网卡的 PTP 硬件时间戳功能，或通过 iptables 过滤 IEEE 1588 报文（UDP 端口 319/320），以降低触发内核空指针崩溃的风险。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 hns3 网络驱动空指针解引用拒绝服务漏洞"
