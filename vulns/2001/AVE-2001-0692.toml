[basic]
description = "pgp4pine 是 Pine 邮件客户端的 PGP 加密接口工具。该漏洞存在于版本 1.75-6 中，其原理在于程序通过 Gnu Privacy Guard (GnuPG) 获取公钥进行邮件加密时，未能正确校验该公钥的有效期状态。当用户意外选择了已过期的公钥对邮件进行加密时，系统不会发出警告或阻止发送，而是将原本应加密的邮件内容以明文形式直接传输，导致敏感信息在传输过程中泄露。该漏洞影响所有使用 pgp4pine 进行 PGP 加密通信的用户，利用需要较高攻击条件，攻击者需通过公钥替换或污染等方式诱使受害者使用过期密钥。成功利用该漏洞将破坏邮件通信的保密性，造成敏感信息暴露。"
published = "2001-05-03T04:00:00Z"
remediation = "升级 pgp4pine 至高于 1.75-6 的最新版本。在 GnuPG 配置中启用密钥过期检查，定期通过 gpg --list-keys --check-sigs 验证公钥有效期，避免使用已过期密钥加密邮件。临时缓解措施：停用 pgp4pine，改用其他支持密钥有效性验证的 PGP 邮件客户端，或在发送加密邮件前手动确认所选公钥未过期。"
score = 2.6
severity = "LOW"
sources = ["cve"]
title = "pgp4pine 公钥过期验证绕过信息泄露漏洞"
updated = "2026-06-16T21:54:00Z"

