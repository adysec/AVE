[basic]
description = "Glarysoft Glary Utilities 的磁盘清理功能存在链接跟随（Link Following）本地权限提升漏洞。该漏洞源于 Disk Clean 组件在处理文件删除操作时未正确验证符号链接，允许已获得低权限代码执行能力的本地攻击者通过创建目录链接（junction）诱使服务以 SYSTEM 权限删除任意文件。攻击者可利用此漏洞将权限提升至 SYSTEM 并执行任意代码。攻击需要本地访问及低权限用户交互，CVSS 评分 7.3，危害等级高。"
published = "2026-07-13T22:16:45Z"
remediation = "立即升级 Glary Utilities 至最新版本（≥6.45，2026-07-20 发布），该版本可能已修复 Disk Clean 功能中的符号链接跟随漏洞。如无法升级，建议限制非管理员用户对 Glary Utilities 的访问权限，或移除 Disk Clean 工具的执行权限作为临时缓解措施。"
score = 7.3
severity = "HIGH"
sources = ["zdi"]
title = "Glarysoft Glary Utilities 链接跟随本地权限提升漏洞"
updated = "2026-07-14T16:45:45Z"

