[basic]
description = "GNU Screen 3.9.11的Braille模块存在缓冲区溢出漏洞。当编译配置中启用了HAVE_BRAILLE选项时，该模块对输入数据缺乏足够的边界检查，本地攻击者可通过向screen程序传递特制的过长字符串数据触发缓冲区溢出，进而覆盖进程内存并执行任意代码。该漏洞影响Unix及Linux平台上的GNU Screen 3.9.x版本，攻击者成功利用后可实现本地权限提升。"
published = "2002-04-23T04:00:00.000"
remediation = "升级到 GNU Screen 3.9.15 或更高版本。如无法立即升级，重新编译 screen 时在配置文件中禁用 HAVE_BRAILLE 选项（configure 时添加 --disable-braille 或不定义 HAVE_BRAILLE），并重新编译安装。临时缓解措施：确认当前 screen 二进制文件未启用 Braille 支持，避免本地用户触发缓冲区溢出执行任意代码。"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "GNU Screen 3.9.x Braille模块 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:59:38.143"

