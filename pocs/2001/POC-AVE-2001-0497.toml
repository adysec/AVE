[info]
author = "ave"
description = "检测 Apache mod_auth_pgsql 0.9.5 及更早版本或 mod_auth_pgsql_sys 0.9.4 及更早版本是否安装在目标服务器上，通过检查 HTTP Server 响应头中的模块版本号判断是否存在已知的 SQL 注入漏洞"
id = "POC-AVE-2001-0497"
name = "CVE-2001-1379 PoC"
severity = "high"
tags = [
    "cve-2001-1379",
    "sql-injection",
    "apache",
    "mod_auth_pgsql",
]
vuln_id = [
    "CVE-2001-1379",
    "AVE-2001-0497",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = [
    "mod_auth_pgsql/0.",
    "mod_auth_pgsql_sys/0.",
]
