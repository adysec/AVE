[basic]
description = "SuSE Linux 6.x 及 7.0 版本中自带的 in.identd 身份识别服务存在空指针解引用漏洞。远程攻击者无需身份认证即可向目标系统的 ident 服务发送超长请求，触发服务程序访问空指针导致进程崩溃，造成拒绝服务。该漏洞攻击复杂度低，无需特殊权限即可远程利用，影响 SuSE Linux 6.x 和 7.0 全系列版本。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 SuSE Linux 至 7.1 或更高版本，该版本已修复 in.identd 长请求导致空指针崩溃的问题。如无法升级，可执行 `rcidentd stop && chkconfig identd off` 关闭 identd 服务（非必需服务），并在防火墙使用 `iptables -A INPUT -p tcp --dport 113 -j DROP` 阻断外部 ident 请求。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "SuSE Linux in.identd 拒绝服务漏洞"
updated = "2026-06-16T21:53:09Z"

