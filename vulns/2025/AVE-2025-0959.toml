[basic]
description = "Linux内核中的brcmfmac无线网卡驱动存在空指针解引用漏洞。当设备被移除或内核模块被卸载时，brcmf_del_if()函数会将drvr->if2bss[ifidx]更新为无效值，随后brcmf_txfinalize()在处理残留的flowring skb时，brcmf_get_ifp()可能返回NULL，导致对ifp->ndev->stats.tx_errors的写入操作触发空指针解引用。攻击者需具备本地访问权限并触发设备移除或模块卸载操作，在特定条件下可导致内核崩溃或权限提升。该漏洞影响使用brcmfmac驱动的Linux系统，CVSS评分为5.5，危害等级中等。修复方案为升级Linux内核至已修复此问题的版本。"
published = "2025-02-27T03:15:15.037"
remediation = "立即升级 Linux 内核至已修复版本：6.13.3、6.12.14 或 6.6.78 及以上。Ubuntu 用户通过 `sudo apt update && sudo apt upgrade linux-image-generic` 更新至 USN-7540-1 通告中列出的修复版本；Debian 用户通过 `sudo apt update && sudo apt upgrade` 更新至 DLA-4178-1 或 DLA-4102-1 通告中的修复包。更新后重启系统生效。若无法立即升级，可临时禁用 brcmfmac 模块（`sudo modprobe -r brcmfmac`）作为缓解措施，但会导致 WiFi 功能不可用。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 brcmfmac 空指针解引用漏洞"
updated = "2026-06-17T08:44:10.443"

