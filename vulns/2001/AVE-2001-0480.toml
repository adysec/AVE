[basic]
description = "Microsoft IIS 5.0 存在 Content-Length 字段处理不当导致的拒绝服务漏洞。远程攻击者可通过向目标服务器发送特制的 HTTP 请求，其中 Content-Length 值被设置为远大于实际请求体大小的数值，导致 IIS 无法正常超时关闭该连接，从而耗尽服务器连接池资源，造成后续正常请求无法被处理。该漏洞影响 Microsoft IIS 5.0 版本，攻击者无需身份认证即可通过网络远程触发，CVSS 评分 5.0，危害等级中危。利用方式简单，已有公开 PoC 代码。"
published = "2001-12-11T05:00:00Z"
remediation = "安装 Microsoft 2001 年 8 月发布的 IIS 5.0 累积安全更新 (MS01-044)，该补丁修复了虚假 Content-Length 导致的拒绝服务问题。对于仍运行 Windows 2000 的系统，建议升级至受支持的操作系统版本（如 Windows Server 2019/2022）及对应 IIS 版本。如无法升级，可在 IIS 管理器中禁用不必要的 HTTP 扩展功能，并在网络边界防火墙配置连接速率限制和超时策略以缓解攻击。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft IIS 5.0 Content-Length 字段拒绝服务漏洞"
updated = "2026-06-16T21:55:45Z"

