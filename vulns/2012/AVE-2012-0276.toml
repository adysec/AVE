[basic]
description = "WebKit 渲染引擎存在内存破坏漏洞，远程攻击者可通过构造恶意网站向 Apple Safari 浏览器发送特制内容，触发 WebKit 内存错误，导致应用程序崩溃或执行任意代码。该漏洞影响 Apple Safari 6.0 之前版本，攻击者无需身份验证即可利用，攻击复杂度为中等，需诱使用户访问恶意网页。成功利用可实现远程代码执行，完全危及目标系统的机密性、完整性和可用性。"
published = "2012-07-25T20:55:02.227"
remediation = "立即将 Apple Safari 升级到 6.0 或更高版本，或安装 OS X Mountain Lion 系统安全更新（APPLE-SA-2012-07-25-1）。iOS 用户需升级到 iOS 6.0 或更新版本。如暂无法立即升级，建议临时更换为其他浏览器浏览网页，并在 Safari 偏好设置中禁用自动打开安全或不安全文件选项，同时避免访问未知或恶意网站。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:33.103"

