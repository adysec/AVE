[basic]
description = "Windows Kerberos 安全功能存在绕过漏洞，具有低权限的本地攻击者可利用该漏洞绕过 Kerberos 的身份验证与安全保护机制，从而访问本应受保护的系统资源，导致机密性和完整性受到高影响。该漏洞攻击复杂度低，无需用户交互即可利用，影响多个 Windows 版本。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:52.270"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新 (KB5049981)，或通过 Windows Update 自动更新。受影响版本包括 Windows 10 (1507/1607/1809/21H2/22H2)、Windows 11 (22H2/23H2/24H2) 及 Windows Server (2016/2019/2022/2025)，对应各版本最低修复版本号分别为 10.0.10240.20890、10.0.14393.7699、10.0.17763.6775、10.0.19044.5371、10.0.19045.5371、10.0.22621.4751、10.0.22631.4751、10.0.26100.2894、10.0.20348.3091、10.0.25398.1369。如无法立即打补丁，建议限制本地用户对 Kerberos 凭据缓存文件的访问权限，并监控异常的身份验证请求。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Kerberos 安全功能绕过漏洞"
updated = "2026-06-17T08:43:02.150"

