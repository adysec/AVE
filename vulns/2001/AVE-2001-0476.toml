[basic]
description = "Samsung ML-85G GDI 打印机驱动中的 ml85p 组件（版本 0.2.0 之前）存在不安全临时文件创建漏洞。本地攻击者可通过在临时文件目录中创建符号链接，利用驱动程序创建临时文件时的竞态条件，将任意文件覆盖为目标临时文件，从而实现权限提升或系统破坏。该漏洞需要攻击者具有本地系统访问权限，攻击复杂度较高，但一旦成功可导致机密性、完整性和可用性完全丧失。"
published = "2001-07-17T04:00:00Z"
remediation = "升级 ml85p 驱动至 0.2.0 或更高版本，该版本已修复不安全临时文件创建问题。如无法升级，可限制本地用户对 /tmp 目录的写权限，或使用 `umask 077` 并设置 `TMPDIR` 环境变量指向仅当前用户可写的临时目录作为临时缓解措施。"
score = 6.2
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Samsung ML-85G 打印机驱动不安全临时文件创建漏洞"
updated = "2026-06-16T21:55:44Z"

