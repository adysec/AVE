[basic]
description = "Google Chrome 80.0.3987.122 之前的版本存在 V8 JavaScript 引擎类型混淆漏洞。攻击者通过向目标系统发送精心构造的 HTML 网页，可以触发 V8 引擎内部类型判断错误的漏洞，导致堆内存控制失衡，最终实现远程代码执行。该漏洞影响 Windows、macOS、Linux 等平台，攻击者无需身份验证即可远程利用，只要用户访问恶意网页即可触发。漏洞 CVSS 评分 8.8，属于高危等级。Google 已在 Chrome 80.0.3987.144 版本中修复了此漏洞，建议用户及时更新。"
published = "2020-02-27T23:15:12Z"
remediation = '建议立即将 Google Chrome 升级至 80.0.3987.122 或更高版本，可通过浏览器菜单"帮助"→"关于 Google Chrome"自动检测并安装更新。如无法立即升级，可临时启用浏览器沙箱隔离机制，并避免访问未知网站，降低被恶意 crafted HTML 页面远程攻击的风险。同时建议启用 Windows Defender 或杀毒软件实时防护，拦截相关利用代码的执行。'
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome V8 类型混淆远程代码执行漏洞"
updated = "2026-06-17T03:23:18Z"

