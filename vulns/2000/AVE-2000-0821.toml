[basic]
description = "多种 Unix 系统（包括 tcsh、csh、sh、bash）的 shell 程序在处理 here-document（<< 重定向）时存在符号链接竞争条件漏洞。本地攻击者可通过创建符号链接指向其他用户的可写文件，利用 shell 在处理临时文件时未正确检查符号链接的缺陷，诱使目标用户执行包含恶意重定向的脚本，从而覆盖其他用户的任意文件。该漏洞影响 HP-UX、RedHat、SCO、IRIX、Mandriva、Apple Mac OSX 等多种 Unix 系统，CVSS 评分 7.2，危害等级高。"
published = "2001-01-09T05:00:00Z"
remediation = "建议立即升级受影响 shell 到已修复版本：Red Hat Linux 用户安装 RHSA-2000-117/RHSA-2000-121 提供的更新包；Debian 用户参照 DSA-20001111a 升级 shell 包；FreeBSD 用户应用 SA-00:76 补丁；Caldera 用户安装 CSSA-2000-042/CSSA-2000-043 更新；Mandrake 用户升级至 MDKSA-2000-069/MDKSA-2000-075 对应版本。如无法立即升级，可通过 umask 限制临时目录权限、避免在多用户环境下使用未信任的 here-document 重定向作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "多种Unix Shell 程序 Here-Document 符号链接文件覆盖漏洞"
updated = "2026-06-16T21:53:13Z"

