[basic]
description = "CGI-World Poll It 2.0 存在内部变量覆盖漏洞，远程攻击者可通过向 data_dir 参数传递恶意文件名，绕过访问限制读取服务器上的任意文件。该漏洞影响 Poll It 2.0 版本，攻击者无需身份认证即可利用，可能导致敏感信息泄露。CVSS 评分 7.5，危害等级高。目前已有公开 PoC 利用代码。"
published = "2000-07-04T04:00:00Z"
remediation = "立即停止使用 Poll It 2.0 CGI 脚本，该软件已停止维护且无官方补丁。如必须使用，编辑 Poll_It_SSI_v2.0.cgi 文件，在脚本开头添加 `use CGI qw(:standard);` 并改用 `param()` 函数获取参数，禁止直接使用环境变量或 `QUERY_STRING` 解析用户输入；同时在 Web 服务器（Apache/Nginx）层面配置 `RewriteRule ^/cgi-bin/pollit/ - [F]` 拒绝访问该目录作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "CGI-World Poll It 2.0 任意文件读取漏洞"
updated = "2026-06-16T21:52:03Z"

