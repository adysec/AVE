[basic]
description = "Debian 系统中 top 程序存在格式字符串漏洞，本地攻击者可通过在 top 的 kill 或 renice 功能中传入特制的格式字符串参数，利用该漏洞实现权限提升，获取 root 权限。该漏洞影响 Debian 系统及使用该版本 top 程序的 Linux 发行版，攻击者需拥有本地访问权限，无需身份认证即可利用，危害等级高。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级 Debian 系统上的 procps 或 top 软件包至修复版本（如 3.2.8-1 及以上）。对于已停止维护的旧版 Debian，建议升级至仍受支持的操作系统版本。如无法升级，可通过限制本地用户对 top 命令的 SUID 权限作为临时缓解措施：`chmod 755 /usr/bin/top` 移除 SUID 位，阻止非授权用户利用该漏洞提权。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Debian top 格式字符串本地权限提升漏洞"
updated = "2026-06-16T21:52:56Z"

