[basic]
description = "WebKit 浏览器引擎存在内存破坏漏洞，攻击者可通过诱导用户访问精心构造的恶意网站触发该漏洞。由于 WebKit 在处理特定网页内容时未正确验证内存边界，导致越界读写或使用已释放内存，远程攻击者可利用此缺陷执行任意代码或导致应用程序崩溃拒绝服务。该漏洞影响 Apple iOS 5.1 之前版本及 iTunes 10.6 之前版本，CVSS 评分 9.3（严重），攻击向量为网络、攻击复杂度中等、无需身份认证、机密性/完整性/可用性均受高危影响。用户仅需访问恶意页面即可触发，无需额外交互条件。Apple 已在 2012 年 3 月发布的安全更新 APPLE-SA-2012-03-07-1 和 APPLE-SA-2012-03-07-2 中修复此漏洞，建议升级至 iOS 5.1 或 iTunes 10.6 及以上版本。"
published = "2012-03-08T22:55:02Z"
remediation = "升级 Safari 至 5.1.4 或更高版本；升级 iOS 至 5.1 或更高版本；升级 iTunes 至 10.6 或更高版本。可通过 Apple 软件更新或访问 support.apple.com/kb/HT5142 下载对应安全补丁安装。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏漏洞"
updated = "2026-06-16T23:37:53Z"

