[basic]
description = 'SonicWall Email Security 10.0.9.x版本存在路径遍历漏洞（CWE-22）。该漏洞位于邮件安全网关的Web管理界面中，已通过身份验证的高权限攻击者可通过构造包含目录遍历序列（如"../../"）的特殊HTTP请求，绕过访问控制读取远程主机上的任意文件，包括敏感配置文件、系统凭据及其他机密数据。攻击者须具备合法登录凭据且拥有高权限账户，方可利用此漏洞，因此利用门槛较高。该漏洞仅影响信息的保密性，不会直接影响系统完整性和可用性，CVSS评分4.9，危害等级为中等。SonicWall已发布安全更新修复此漏洞。'
published = "2021-04-20T12:15:12.587"
remediation = "请将 SonicWall Email Security 升级至 10.0.9.6173（虚拟设备及 Windows 版本）或 10.0.9.6177（硬件设备 3300/4300/5000/5050/7000/7050/8300/9000）以修复路径遍历漏洞。升级前请备份邮件安全配置，升级后重启服务并验证管理界面正常运行。如暂无法立即升级，可通过限制管理员账号登录来源 IP 并禁用非必要的用户账户作为临时缓解措施，限制具备高级权限账户的登录来源以降低被利用风险。"
score = 4.9
severity = "MEDIUM"
sources = ["kev"]
title = "SonicWall Email Security 路径遍历漏洞"
updated = "2026-06-17T03:33:09.773"

