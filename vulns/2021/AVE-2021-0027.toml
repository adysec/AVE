[basic]
description = "Samsung Android设备存在授权机制不正确漏洞，sec_log文件（/proc/sec_log）在SMR MAR-2021 Release 1之前版本的访问控制过于宽松。攻击者可通过向ARM Mali GPU驱动的HWCNT接口发送无效ioctl命令触发内核WARN_ON断言，将包含task_struct和sys_call_table地址的敏感内核信息写入内核日志。Samsung自定义的dumpstate服务进一步将日志内容复制至/data/log/sec_log.log，使得system_app等本地低权限应用无需额外权限即可读取这些敏感信息。泄露的地址信息可被用于破坏KASLR保护并进一步获取任意内核读写能力。该漏洞影响搭载Exynos芯片的Android 8.0至10.0版本设备，Samsung已在SMR MAR-2021安全更新中修复此问题。"
published = "2021-03-26T19:15:12Z"
remediation = "三星官方已于 SMR MAR-2021 Release 1 中修复此漏洞。受影响设备应立即进入「设置→软件更新」下载并安装 2021 年 3 月或更新的安全补丁，确保安全补丁级别不低于 MAR-2021 Release 1；对于无法及时更新的设备，可通过 Knox 移动 Enrollment 或 MDM 策略将未打补丁的三星 Android 8.x–10.0 Mali GPU 设备标记为不合规并限制其访问敏感资源。企业管理员可访问 security.samsungmobile.com 查询对应机型的补丁状态。更多信息请参阅三星安全公告 SAR-SEC-2021-002。"
score = 6.2
severity = "MEDIUM"
sources = ["kev"]
title = "Samsung Android 内核信息泄露漏洞"
updated = "2026-06-17T03:41:57Z"

