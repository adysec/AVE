[basic]
description = "iCal 2.1 Patch 2 中的 csstart 程序存在本地搜索路径劫持漏洞。该程序在运行时会在当前工作目录中搜索 cshttpd 程序，而非使用绝对路径调用系统程序。本地攻击者可在可写目录中放置恶意的特洛伊木马 cshttpd 程序，然后从该目录调用 csstart，导致恶意程序以 root 权限执行，实现本地权限提升。攻击者需要具有本地系统访问权限。"
published = "2000-12-11T05:00:00Z"
remediation = "升级到 iCal 2.1 Patch 2 之后的版本，该漏洞已在后续版本中修复。如无法升级，确保 csstart 脚本运行时当前工作目录不受不可信用户控制，避免将可写目录置于 PATH 中，并限制普通用户对 cshttpd 程序的写入权限作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "iCal csstart 本地搜索路径特权提升漏洞"
updated = "2026-06-16T21:53:05Z"

