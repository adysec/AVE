[basic]
description = "Linux 内核的 ksmbd 组件在处理 SMB2 LOCK 操作请求时存在逻辑错误。当锁计数大于 1 时，代码错误地使用了旧的 flags 值，而未使用 smb_lock 结构体中的正确 flags。该漏洞导致错误处理例程中的 locks_free_lock 函数触发 bug-on trap，进而引发内核崩溃，造成系统拒绝服务。具有本地低权限访问权限的攻击者可通过构造并发送特制的 SMB2 LOCK 请求触发此漏洞，影响使用 ksmbd 的 Linux 系统。"
published = "2025-04-01T16:15:25Z"
remediation = "将 Linux 内核升级至已修复该缺陷的稳定版本：Debian 12 (bookworm) 升级到 6.1.180-1 或更高版本，Debian 11 (bullseye) 升级到 5.10.262-1，Ubuntu 24.04 LTS 升级到 6.8.0-1036.40 或更高版本，Ubuntu 22.04 LTS 升级到包含该修复的 6.8.0-1051.57~22.04.1 版本。升级后执行 reboot 使新内核生效。如短期内无法升级内核且 ksmbd 服务非必需，可通过 systemctl stop ksmbd 临时停止 ksmbd 服务，或在防火墙层面限制 445 端口的 SMB 访问来源作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 ksmbd SMB2_LOCK 不当锁定拒绝服务漏洞"
updated = "2026-06-17T08:44:40Z"

