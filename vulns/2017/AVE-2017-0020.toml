[basic]
description = "phpLDAPadmin 1.2.3 及更低版本在 htdocs/entry_chooser.php 文件中存在跨站脚本攻击漏洞。攻击者可通过向表单的 form、element、rdn 或 container 参数提交恶意 payloads 注入未经验证的 JavaScript 代码，导致受害者浏览器执行这些脚本。当受害者访问包含恶意载荷的页面时，攻击者可能窃取会话 Cookie、执行账户操作或收集敏感用户信息。该漏洞影响所有运行 phpLDAPadmin <=1.2.3 的系统，攻击者无需认证即可发起攻击，但需要诱使受害者打开包含恶意 JavaScript 的页面。由于漏洞仅影响浏览器执行用户输入的脚本，因此主要集中在低风险范围，但其潜在危害不可小觑。phpLDAPadmin 1.2.4 及以上版本已修复此漏洞，建议立即更新至最新版本以确保安全。"
published = "2017-07-08T12:29:00Z"
remediation = "建议升级至 phpLDAPadmin GitHub 最新开发版（含 PR #50 修复），或手动修补 htdocs/entry_chooser.php 对 form/element/rdn/container 参数进行 htmlspecialchars 转义。若无法升级，可通过 Web 应用防火墙拦截包含 <script> 等 XSS 特征的参数值，或在 Web 服务器配置 CSP 策略限制内联脚本执行，临时限制 phpLDAPadmin 仅允许受信 IP 访问。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "phpLDAPadmin entry_chooser.php 跨站脚本攻击漏洞"
updated = "2026-06-17T01:01:13Z"

