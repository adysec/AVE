[basic]
description = "Windows 内核存在内存信息泄露漏洞，由于内核未能正确限制对内存对象的访问权限，导致低权限攻击者可利用该漏洞读取内核内存中的敏感信息，包括系统凭证、进程数据等机密内容。攻击者需具备本地系统访问权限并登录后方可利用此漏洞，无需用户交互。该漏洞影响 Windows 10/11 及 Windows Server 等多个版本，Microsoft 已在 2025 年 1 月安全更新中修复。"
published = "2025-01-14T18:15:55.880"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新（KB5050004），可通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载。受影响版本包括 Windows 10/11 多个版本及 Windows Server 2012–2025，更新后内核版本将提升至修复版本（如 Win11 24H2 ≥ 10.0.26100.2894）。临时缓解措施：限制低权限用户本地登录，并监控内核内存访问异常行为。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 内核内存信息泄露漏洞"
updated = "2026-06-17T08:43:05.147"

