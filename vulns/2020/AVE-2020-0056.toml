[basic]
description = "Apache Unomi 存在远程代码执行漏洞，由于对用户输入验证不足，攻击者可在条件判断中注入 OGNL 脚本表达式，进而调用 JDK 中的静态 Java 类执行任意系统命令。该漏洞影响 Apache Unomi 多个版本，攻击者无需身份认证即可通过网络远程发起利用，且攻击过程无需用户交互。成功利用后，攻击者能够以运行 Java 进程的权限在目标服务器上执行任意代码，完全控制服务器，CVSS 评分 9.8，危害等级为严重。"
published = "2020-06-05T15:15:10Z"
remediation = "Apache Unomi 用户应立即升级到 1.5.1 或更高版本以修复此 OGNL 脚本注入漏洞。升级前请备份配置文件及 Elasticsearch 数据，下载 1.5.1 发行版替换旧版本并重启服务。如暂时无法升级，可通过反向代理或防火墙限制对 Unomi REST API 的访问，仅允许可信 IP 访问 context.json 端点，以降低被远程利用的风险。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Apache Unomi OGNL 表达式注入远程代码执行漏洞"
updated = "2026-06-17T02:51:10Z"

