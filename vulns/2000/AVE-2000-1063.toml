[basic]
description = "Allaire JRun 2.3 服务器中的 SSIFilter Servlet 存在访问控制缺陷，远程攻击者无需身份认证即可直接调用该 Servlet，从而获取服务器上可执行文件（如 JSP、CFM 等）的源代码。该漏洞导致敏感业务逻辑和配置信息泄露，攻击者可据此进一步分析系统弱点。受影响的版本为 JRun 2.3，攻击复杂度低，仅需发送特制 HTTP 请求即可利用。"
published = "2000-12-11T05:00:00Z"
remediation = "升级至 Allaire JRun 3.0 或更高版本，该版本已修复 SSIFilter servlet 未授权访问源码的问题。如无法升级，在 web.xml 中移除或注释 SSIFilter servlet 的映射配置，并限制对 /servlet/SSIFilter 路径的访问。同时确保服务器不将 JSP 等可执行文件置于可公开直接访问的目录下。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Allaire JRun 服务器源代码泄露漏洞"
updated = "2026-06-16T21:53:03Z"

