[basic]
description = "stunnel 4.0.3 及更早版本存在信号处理器竞争条件漏洞。程序在处理 SIGCHLD 信号时，信号处理器与主程序并发访问子进程计数器，存在竞态条件，可导致计数器状态不一致，进而使 stunnel 进程崩溃。攻击者无需较高权限，只需使大量子进程在特定时机快速退出以触发竞态窗口，即可导致服务进程异常终止，造成拒绝服务。该漏洞影响 stunnel 4.0.3 及更早版本，CVSS 评分 1.2，危害等级较低，建议升级至 4.0.4 或更高版本修复。"
published = "2003-05-12T04:00:00Z"
remediation = "建议立即将 stunnel 升级到 4.0.4 或更高版本（该版本修复了 SIGCHLD 信号处理器的竞态条件，避免子进程计数器不一致导致崩溃）。若使用较新的红帽系发行版，请安装 RHSA-2003-221 与 RHSA-2003-223 提供的更新包。在无法立即升级的情况下，可通过限制本地可登录用户、仅对可信主机开放 stunnel 监听的 TLS 端口，并监控进程异常退出日志作为临时缓解措施。"
score = 1.2
severity = "LOW"
sources = ["redhat"]
title = "stunnel SIGCHLD信号处理程序竞争条件拒绝服务漏洞"
updated = "2026-06-16T21:59:33Z"

