[basic]
description = "标签中。<value>WordPress Rank Math 插件（版本 1.0.40.2 及之前）存在权限提升漏洞，其 REST API 端点 rankmath/v1/updateMeta 缺少身份验证与授权检查，未经身份认证的远程攻击者可通过该端点直接更新任意 WordPress 用户元数据，包括为现有用户提升或吊销管理员权限，从而实现未授权权限提升。该漏洞影响所有使用 Rank Math 插件的 WordPress 站点，攻击条件为目标站点安装了受影响的 Rank Math 插件版本且允许 REST API 访问，攻击者无需任何凭据即可利用该漏洞完成权限提升，危害等级严重，CVSS 评分 9.8。"
published = "2020-04-07T17:15:13Z"
remediation = "升级 Rank Math SEO 插件到 1.0.41 或更高版本以修复该漏洞。在 WordPress 后台进入「插件」→「已安装插件」，找到 Rank Math SEO 并点击「更新」，或在「仪表盘」→「更新」中批量更新所有插件。更新完成后验证插件版本号已升至 1.0.41 及以上，并确认 rankmath/v1/updateMeta REST API 端点已不再允许未授权访问。如暂时无法更新，可临时通过 .htaccess 或防火墙规则拦截对 /wp-json/rankmath/v1/updateMeta 的外部访问作为缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress Rank Math 插件权限提升漏洞"
updated = "2026-06-17T02:50:19Z"

