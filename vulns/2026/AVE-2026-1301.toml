[basic]
description = "ATEN Unizon 产品的 writeFileToHttpServletResponse 方法存在路径遍历漏洞，源于对用户提供的路径参数缺乏有效验证直接用于文件操作。未经身份认证的远程攻击者可构造包含目录遍历序列（如 ../）的恶意路径参数，绕过访问控制读取服务器文件系统中的任意敏感文件，泄露信息权限为 SYSTEM 级别。该漏洞影响 ATEN Unizon 相关版本，CVSS 3.0 评分 7.5（HIGH），攻击向量为网络、攻击复杂度低、无需权限、无需用户交互，属于 CWE-22 路径遍历类型漏洞。"
published = "2026-06-24T22:16:50Z"
remediation = "建议立即将 ATEN Unizon 固件升级至 V2.7.264.001 或更高版本以修复该路径遍历漏洞。升级前请备份当前配置，升级后验证 /rest/history/report/getFile 端点的访问行为已恢复正常。如暂时无法升级，应在防火墙或边界设备上限制对 ATEN Unizon Web 管理界面的外部访问，仅允许受信任的内部 IP 段访问该服务，并部署入侵检测规则监控对 /rest/history/report/getFile 的路径遍历请求（包含 ../ 等遍历序列）。"
score = 7.5
severity = "HIGH"
sources = ["zdi"]
title = "ATEN Unizon 路径遍历信息泄露漏洞"
updated = "2026-06-27T19:00:50Z"

