[basic]
description = "Mobius DocumentDirect for the Internet 1.2 的 ddicgi.exe 组件存在缓冲区溢出漏洞，远程攻击者可通过向目标系统发送特制的超长 User-Agent 参数触发该漏洞，导致缓冲区溢出，从而执行任意命令。该漏洞影响 Mobius DocumentDirect for the Internet 1.2 版本，CVSS 评分 10.0，危害等级严重。攻击者无需身份认证即可远程利用，已有公开的 Exploit-DB 利用代码。"
published = "2000-11-14T05:00:00Z"
remediation = "Mobius DocumentDirect for the Internet 1.2 已停止维护，官方未发布补丁。建议立即卸载该产品，或至少升级到不受影响的最新版本。如无法卸载，可在 Web 服务器或反向代理层面添加规则，过滤 User-Agent 头中超过 256 字节的异常请求，并限制 ddicgi.exe 的执行权限为最低账户。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Mobius DocumentDirect for the Internet 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:52:33Z"

