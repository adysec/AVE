[basic]
description = "Cisco IOS XE 软件中 BGP over EVPN 功能存在输入验证不当漏洞。由于在处理 BGP Inclusive Multicast Ethernet Tag Route 或 BGP EVPN MAC/IP Advertisement Route 更新报文时，IP 地址长度字段计算错误，导致未认证的远程攻击者可在已建立的 BGP 会话中向目标设备发送特制的 BGP 报文，触发设备重载或破坏 BGP 路由表，造成拒绝服务（DoS）和网络不稳定。该漏洞影响所有支持 BGP EVPN 配置的 Cisco IOS XE 16.3 之前版本，若设备未配置 EVPN 则不受影响。CVSS 评分 5.9，危害等级中危。"
published = "2018-03-27T09:29:00Z"
remediation = "建议立即将 Cisco IOS XE 软件升级至 16.3 或更高版本，该版本已修复 BGP EVPN 报文处理中的输入验证缺陷。如无法立即升级，可在未使用 EVPN 功能的设备上移除 EVPN 配置以消除攻击面，同时通过访问控制列表（ACL）限制 BGP 对等体的连接来源，仅允许可信 IP 建立 BGP 会话。"
score = 5.9
severity = "MEDIUM"
sources = ["kev"]
title = "Cisco IOS XE BGP EVPN 拒绝服务漏洞"
updated = "2026-06-17T01:03:06Z"

