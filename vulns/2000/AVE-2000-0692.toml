[basic]
description = 'LBNL Traceroute 1.4a5 及更早版本的 savestr 函数存在堆溢出漏洞。该工具因使用原始套接字通常以 setuid root 权限安装，攻击者可通过向 traceroute 传递特制的 "-g" 参数触发漏洞：savestr 函数使用预分配内存而非动态分配，第一次调用后指针被释放，第二次调用时用户数据被写入未分配内存区域，随后 free() 操作在无效的 malloc 头部上执行。本地攻击者可精心构造恶意 malloc 头部数据，利用堆内存破坏覆盖函数指针等关键内存区域，从而以 root 权限执行任意代码，实现本地权限提升。该漏洞影响 Linux 等多平台系统，CVSS v2 评分 7.2，危害等级高。'
published = "2000-12-19T00:00:00Z"
remediation = "升级 LBNL traceroute 至 1.4a6 或更高版本。各发行版用户：Debian 安装 20001013 安全更新，Red Hat 安装 RHSA-2000:078 更新，Caldera 安装 CSSA-2000-034.0 补丁，Mandrake 安装 MDKSA-2000:053 更新，TurboLinux 安装 2000-10-25 安全公告对应补丁。如无法升级，移除 traceroute 的 setuid 权限（chmod u-s /usr/sbin/traceroute）作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "劳伦斯伯克利实验室 Traceroute 堆缓冲区溢出权限提升漏洞"
updated = "2000-12-19T00:00:00Z"

