[basic]
description = "tags.<value>curl在处理OAuth2 bearer token时存在跨协议重定向漏洞。当使用HTTP(S)传输并执行跨协议重定向到IMAP、LDAP、POP3或SMTP协议的URL时，curl可能错误地将bearer token传递给新的目标主机。影响范围为curl 7.33.0至8.17.0版本，攻击条件为攻击者需构造包含用户名组件的跨协议重定向请求，且目标需启用对非HTTP协议的重定向。攻击者可借此窃取OAuth2认证令牌。该漏洞在curl 8.18.0版本中已修复。"
published = "2026-01-08T10:15:46Z"
remediation = "建议立即将 curl 升级至 8.18.0 或更高版本，修复跨协议重定向时 OAuth2 bearer token 泄露问题。若无法立即升级，可通过在 curl 配置中禁用跨协议重定向（仅允许 HTTP/HTTPS/FTP 重定向）或避免在请求中使用 OAuth2 bearer token 作为临时缓解措施。"
score = 5.3
severity = "MEDIUM"
sources = ["msrc"]
title = "curl 跨协议重定向 OAuth2 Bearer Token 泄露漏洞"
updated = "2026-06-17T08:36:04Z"

