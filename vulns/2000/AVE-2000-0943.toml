[basic]
description = "iputils 工具包中的 ping 命令存在缓冲区溢出漏洞，其 outpack 或 buf 变量在处理 ICMP 数据包时未正确检查边界，导致本地攻击者可通过构造特制的 ICMP 请求触发缓冲区溢出，从而获得提升的权限。该漏洞影响 Red Hat Linux 6.2 至 7J 及其他发行版中 iputils 20001010 之前版本，攻击者需拥有本地系统访问权限，无需认证即可利用，成功利用后可获取目标系统的部分机密性、完整性和可用性控制权。"
published = "2000-10-18T04:00:00Z"
remediation = "升级 iputils 至 20001010 或更高版本。Red Hat Linux 用户可通过 RHN 更新或手动安装更新后的 iputils RPM 包。如无法升级，可移除 ping 的 SUID 位（chmod u-s /bin/ping）以消除本地提权路径，但会限制普通用户使用 ping 功能。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Red Hat iputils ping 缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:53:23Z"

