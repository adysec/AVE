[info]
author = "ave"
description = "检测 Heimdall Data Database Proxy 的 generateFileContent 函数 CRLF 注入漏洞(CVE-2026-12357)。通过访问管理界面确认目标运行 Heimdall 服务，并检查版本是否低于修复版本 25.03.01.24。"
id = "POC-AVE-2026-0466"
name = "Heimdall Data Database Proxy CRLF Injection RCE PoC"
severity = "high"
tags = ["ave-2026-0466"]
vuln_id = [
    "CVE-2026-12357",
    "AVE-2026-0466",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Heimdall"]
