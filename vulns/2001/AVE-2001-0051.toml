[basic]
description = "eXtropia bbs_forum.cgi 1.0 存在目录遍历漏洞。远程攻击者可通过在 file 参数中注入 .. (点 dot) 路径遍历序列，绕过目录访问限制读取服务器上的任意文件。该漏洞无需身份认证即可利用，攻击者只需向目标 CGI 脚本发送精心构造的 HTTP 请求即可获取敏感系统文件内容，严重时可能导致信息泄露。建议立即升级至安全版本或移除该危险 CGI 脚本。"
published = "2001-03-12T05:00:00Z"
remediation = "由于 eXtropia bbs_forum.cgi 已停止维护且无官方补丁，建议立即将其替换为仍在维护的论坛软件（如 Discuz!、phpBB 或 ModernBB），或在 Web 服务器（如 Apache/Nginx）配置中禁止访问该 CGI 脚本。若短期内无法替换，应在脚本入口处对 read 参数进行输入过滤，拦截包含 ../ 或 %2e%2e%2f 等目录穿越字符的请求，并限制 Web 服务器进程的文件系统访问权限（如 chroot  jailed 环境），以降低攻击者可读取敏感文件的风险。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "eXtropia bbs_forum.cgi 目录遍历漏洞"
updated = "2026-06-16T21:53:41Z"

