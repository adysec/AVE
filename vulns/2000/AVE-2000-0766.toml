[basic]
description = '微软 IIS 3.0/4.0/5.0 中包含的一个管理脚本（源自 IIS 3.0）存在拒绝服务漏洞，被称为"缺失目录浏览器参数"漏洞。该脚本在被访问时未验证是否提供了特定必需参数，远程未经身份验证的攻击者可直接发送 HTTP 请求访问该脚本，触发异常导致 IIS 服务崩溃或系统资源耗尽，造成拒绝服务。受影响版本包括 IIS 3.0、4.0 及 5.0，主要影响运行这些 IIS 版本的 Windows 服务器。攻击无需身份验证，可远程发起，CVSS 评分 5.0（MEDIUM），攻击向量为网络、攻击复杂度低、无需认证、仅影响可用性。微软于 2000 年 7 月发布安全公告 MS00-044 发布补丁修复此漏洞，建议升级至 IIS 5.0 SP4 或更高版本，或应用对应补丁，亦可通过删除 .HTR 脚本映射或限制 /scripts/iisadmin 目录访问权限缓解风险。'
published = "2000-07-14T04:00:00Z"
remediation = "安装 Microsoft 安全公告 MS00-044 发布的补丁程序，修复 IIS 管理脚本缺失参数时进入死循环的问题。升级至 IIS 5.0 SP4 或更高版本，或在 IIS 4.0 上应用对应补丁。若无需 HTR 功能，直接删除 .HTR 脚本映射以彻底消除风险。补丁安装后，修改 IIS 虚拟目录 /scripts/iisadmin 的 NTFS 权限，仅允许 Administrators 组访问，阻止远程用户通过目录浏览脚本获取服务器文件结构信息。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "微软 IIS 3.0/4.0/5.0 管理脚本拒绝服务漏洞"
updated = "2026-06-16T21:52:08Z"

