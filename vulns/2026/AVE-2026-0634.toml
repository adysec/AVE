[basic]
description = "Craft CMS 是一款内容管理系统（CMS），其 Twig 沙箱白名单中包含了 `dataUrl()` 函数，导致存在敏感信息泄露漏洞。该漏洞源于 Craft CMS 4.x 和 5.x 版本中，`dataUrl()` 函数被列入 Twig 沙箱白名单，且 `Html::dataUrl()` 方法未对点文件（如 `.env`）进行过滤检查。拥有 `utility:system-messages` 权限的非管理员控制面板用户可在系统邮件模板中嵌入文件读取载荷，当邮件发送时，服务器会读取目标文件（如 `.env`）并以 base64 编码的数据 URL 形式嵌入邮件正文中。攻击者通过获取 `.env` 文件中的数据库密码、`CRAFT_SECURITY_KEY` 及第三方 API 密钥，可伪造会话令牌并升级为完全管理员账户接管。该漏洞影响 Craft CMS 4.0.0-RC1 至 4.18.0 之前版本及 5.0.0-RC1 至 5.10.0 之前版本，CVSS 评分 6.0，危害等级中危。攻击条件为：目标站点至少有一个非管理员用户被授予了 `utility:system-messages` 权限，且已配置邮件发送功能。官方已在 4.18.0 和 5.10.0 版本中修复此漏洞。"
published = "2026-07-02T00:16:44Z"
remediation = "立即升级 Craft CMS 至 4.18.0 或 5.10.0 及以上版本（GitHub PR #18559）。如无法立即升级，在 `src/config/twig-sandbox.php` 中将 `dataUrl` 从 `allowedFunctions` 数组中移除，并审查所有非管理员用户的 `utility:system-messages` 权限分配。"
score = 6
severity = "MEDIUM"
sources = ["ghsa"]
title = "Craft CMS dataUrl 函数沙箱逃逸致敏感文件泄露漏洞"
updated = "2026-07-02T15:17:06Z"

