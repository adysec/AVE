[basic]
description = "Electron 框架中 `webContents.openDevTools()` 的 `mode` 参数未经过滤即被 DevTools 前端直接使用，攻击者若能控制该参数值，即可在 DevTools 上下文中注入并执行恶意 JavaScript 代码。在未启用沙箱的配置下，DevTools 上下文拥有 Node.js 权限，攻击者可借此实现任意代码执行。该漏洞影响所有基于 Electron 构建的桌面应用，前提是应用接受不可信输入并传递给 `openDevTools()` 的 `mode` 参数，或嵌入了可由不可信内容调用 `openDevTools()` 的 `<webview>`。受影响版本包括 39.8.7 之前、40.9.0 之前、41.2.0 之前以及 42.0.0-beta.1 之前的 Electron 版本。攻击者需具备一定交互条件（需触发 DevTools 开启且参数可控），成功利用后可绕过应用沙箱限制，获取底层系统权限。官方已在 39.8.7、40.9.0、41.2.0 和 42.0.0-beta.1 版本中修复此问题，建议用户升级至安全版本，并仅向 `openDevTools()` 传递预定义的安全 dock 模式值。"
published = "2026-08-05T18:17:15Z"
remediation = "升级 Electron 至修复版本：39.x 系列升级至 39.8.7、40.x 系列升级至 40.9.0、41.x 系列升级至 41.2.0、42.x 系列升级至 42.0.0-beta.1 或更高版本。如暂时无法升级，应仅向 openDevTools() 的 mode 参数传入白名单值（right、bottom、undocked、detach），禁止将 openDevTools 暴露给不可信内容，并在应用中禁用 webview 对 DevTools 的调用。"
score = 5.7
severity = "MEDIUM"
sources = ["ghsa"]
title = "Electron DevTools JavaScript 注入漏洞"
updated = "2026-08-06T05:17:09Z"

