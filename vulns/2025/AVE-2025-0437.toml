[basic]
description = "Google Chrome 的 V8 JavaScript 引擎存在整型溢出漏洞，远程攻击者可通过诱导用户访问特制的 HTML 页面触发该漏洞，导致堆破坏，进而实现任意代码执行。该漏洞影响 Google Chrome 140.0.7339.207 之前版本，以及基于 Chromium 的 Microsoft Edge、Fedora 等衍生软件。攻击无需身份认证，但需要用户交互（点击恶意链接或访问恶意网页），CVSS 评分 8.8，危害等级高。Google 已在 Chrome 140.0.7339.207 版本中修复此漏洞。"
published = "2025-09-24T17:15:39Z"
remediation = '立即将 Google Chrome 升级至 140.0.7339.207 及以上版本，基于 Chromium 的浏览器（如 Microsoft Edge、Brave）升级至对应修复版本。Fedora 42 用户执行 `sudo dnf update chromium` 升级至 140.0.7339.207。无法立即升级时，可禁用 V8 JIT 编译（`--js-flags="--jitless"`）作为临时缓解措施。'
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 引擎整型溢出漏洞"
updated = "2026-06-17T08:29:13Z"

