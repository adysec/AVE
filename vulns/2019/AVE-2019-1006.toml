[basic]
description = "TeamViewer Desktop 至 14.7.1965 版本存在加密密钥硬编码漏洞，自 v7.0.43148 起所有客户安装均使用相同的共享 AES 密钥加密配置数据。本地攻击者若获知该密钥，可解密存储在注册表或配置文件中的受保护信息。在 v9.x 之前版本中，攻击者可进一步解密无人值守访问密码，从而绕过远程登录访问控制，实现远程登录系统及无界面文件浏览。当前版本虽更改了无人值守访问密码的存储方式，但 OptionsPasswordAES 仍使用同一共享密钥。该漏洞需要攻击者已拥有系统本地会话或能访问离线存储的配置文件，CVSS 评分 7.0，危害等级高。"
published = "2020-02-07T16:15:10Z"
remediation = '立即升级 TeamViewer 至 v15 或更高版本（v15 改用订阅制账户认证，不再使用存在共享 AES 密钥的注册表项）。如无法升级，在 TeamViewer 设置中禁用"无人值守访问"的静态密码功能，改用"轻松访问"（基于账户认证的动态密码）；同时避免将 TeamViewer 配置导出为 .reg 文件存储到共享目录或云端。对于企业环境，建议通过组策略限制对注册表项 HKCU\Software\TeamViewer 的读取权限作为临时缓解措施。'
score = 7
severity = "HIGH"
sources = ["kev"]
title = "TeamViewer Desktop 远程登录访问控制绕过漏洞"
updated = "2026-06-17T02:25:42Z"

