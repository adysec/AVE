[basic]
description = 'TYPSoft FTP Server 0.85 存在目录遍历漏洞，未经身份认证的远程攻击者可通过发送特制 FTP 命令读取服务器上的任意文件。攻击者可在 GET 命令中使用 ".."（两个点）序列，或在 CWD 命令中使用 "..."（三个点）序列，突破服务器设定的 FTP 根目录限制，从而遍历到上层目录并下载敏感文件。该漏洞影响使用 0.85 版本的所有 TYPSoft FTP Server 部署实例，攻击复杂度低，无需任何认证凭据即可利用。成功利用后，攻击者可泄露系统配置文件、密码文件或其他敏感数据，对服务器信息安全构成威胁。'
published = "2001-05-03T04:00:00Z"
remediation = 'TYPSoft FTP Server 0.85 存在目录遍历漏洞，且该软件已停止维护、不再提供安全更新，建议尽快迁移至 actively maintained 的 FTP 服务器（如 vsftpd、ProFTPD 或 FileZilla Server）以彻底消除风险。如短期内无法替换，可采取以下缓解措施：在防火墙层面限制 FTP 端口（21 及被动模式端口）仅对可信 IP 开放；在服务器配置中启用 chroot 功能将用户权限限制在 FTP 根目录下，禁止访问系统敏感目录；禁用匿名登录并强制使用强密码认证；在 IDS/日志监控中检测包含 ".." 或 "..." 的 FTP 命令，发现异常访问及时阻断。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "TYPSoft FTP Server 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:54:02Z"

