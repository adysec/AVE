[basic]
description = "Yahoo! Messenger 5.0.0.1064 及更早版本存在缓冲区溢出漏洞。远程攻击者可通过向目标用户发送特制的 ymsgr:// URI 链接，在 call、sendim、getimv、chat、addview、addfriend 等协议处理函数中触发缓冲区溢出，导致任意代码执行。攻击者需要诱使用户点击恶意链接，成功利用后可完全控制受影响的系统。"
published = "2002-07-26T04:00:00Z"
remediation = "升级 Yahoo! Messenger 至 5.0.0.1064 以上版本以修复缓冲区溢出漏洞。由于 Yahoo! Messenger 已于 2018 年停止服务且不再受支持，建议彻底卸载该软件，改用其他受支持的即时通讯工具（如 Slack、Telegram 等），从根本上消除风险。"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Yahoo! Messenger 5.0 缓冲区溢出漏洞"
updated = "2026-06-16T21:56:37Z"

