[basic]
description = "Microsoft Internet Explorer 5.01/5.5/6.0 的 XML 数据岛（data-island）功能中存在信息泄露漏洞。远程攻击者可通过构造一个包含恶意 `src` 属性的 HTML 页面，利用 `<script>` 标签的 XML 数据岛能力将 URL 重定向到本地文件，从而读取目标系统上的任意 XML 文件及其他类型文件的部分内容。攻击无需身份认证，仅需诱使用户访问恶意网页即可触发，CVSS 评分 5.0，危害等级中危。该漏洞影响 IE 5.01/5.5/6.0 版本。"
published = "2002-09-24T04:00:00Z"
remediation = "安装 Microsoft 安全公告 MS02-047 提供的 Internet Explorer 累积补丁（KB323759），将 IE 升级至 5.01 Service Pack 3、5.5 Service Pack 2 或 6.0 最新累积更新版本。如无法立即打补丁，可在 IE 安全设置中将「对标记为可安全执行脚本的 ActiveX 控件执行脚本」设为禁用，或使用组策略限制 XML data-island 功能。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer XML 数据岛重定向文件泄漏漏洞"
updated = "2026-06-16T21:57:51Z"

