[basic]
description = "Adobe Acrobat Reader 存在释放后使用（Use After Free）漏洞，攻击者可构造恶意 PDF 文件诱骗用户打开，在文档解析过程中触发对已释放内存对象的引用，从而在当前用户上下文中执行任意代码。该漏洞影响 24.001.30365、26.001.21651 及更早版本，成功利用可导致敏感数据泄露或系统被完全控制。利用此漏洞需要用户交互，即受害者必须主动打开攻击者提供的恶意文件。Adobe 已在 24.001.30383 和 26.001.21662 版本中修复该漏洞。"
published = "2026-06-09T21:17:21.833"
remediation = "建议立即升级 Adobe Acrobat Reader 至安全版本：连续发行版（Continuous Track）升级至 26.001.21662 或更高版本，经典发行版（Classic Track）升级至 24.001.30383 或更高版本。升级方式为打开 Acrobat Reader，选择「帮助」→「检查更新」，或通过 Adobe 桌面应用程序管理器下载安装 APSB26-63 安全更新。如暂时无法升级，应避免打开来源不明的 PDF 文件，并在邮件网关和文件服务器中部署 PDF 文件类型过滤策略，以降低攻击面。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Adobe Acrobat Reader 释放后使用漏洞"
