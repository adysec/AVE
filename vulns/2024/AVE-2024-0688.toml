[basic]
description = "Linux 内核 team 网络驱动中存在不正确的锁处理漏洞。当将已作为其他 team 设备下层端口的网络设备（如 VLAN 子接口）再次添加为 team 设备成员时，内核未进行充分检查，导致 team_lock_key 被递归加锁，引发死锁。本地低权限攻击者可通过构造特定的网络设备配置序列触发此条件，造成系统拒绝服务。该漏洞影响 Linux 内核 6.13-rc2 及之前版本，CVSS 评分 5.5，危害等级中等。"
published = "2025-03-06T16:15:53Z"
remediation = "立即将 Linux 内核升级至以下已修复版本：5.4.291、5.10.235、5.15.179、6.1.129、6.6.76、6.12.13 或 6.13.2 及以上。Debian 用户请参照 DLA-4178-1 和 DLA-4102-1 公告更新内核包。如无法立即升级，避免将已作为 VLAN/bridge 下层的网络设备添加到 team 接口中，防止触发递归锁死锁。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel team 子设备添加死锁拒绝服务漏洞"
updated = "2026-06-17T08:14:34Z"

