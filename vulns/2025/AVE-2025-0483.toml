[basic]
description = "GNU Binutils 2.43 版本的 ld 组件在处理 ELF 文件的异常帧信息时，bfd/elf-eh-frame.c 文件中的 _bfd_elf_write_section_eh_frame 函数存在内存损坏漏洞。攻击者可通过向目标系统提供特制的 ELF 文件触发该漏洞，导致程序崩溃或潜在的内存数据破坏。该漏洞攻击复杂度较高，远程攻击难度较大，但已有公开利用代码。建议用户及时应用补丁修复。"
published = "2025-02-11T08:15:31Z"
remediation = "升级 GNU Binutils 至 2.44 或更高版本。SUSE 用户可通过 SUSE-SU-2025:4096-1 更新至 2.4 版本。在 aarch64 架构上不要启用 `-z gcs=implicit` 链接选项作为临时缓解措施。"
score = 2.3
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils ld 组件内存损坏漏洞"
updated = "2026-06-17T08:38:32Z"

