[basic]
description = "Fortinet FortiWeb 存在越界写入漏洞（CWE-787），受影响版本包括 FortiWeb 8.0.0 至 8.0.3、7.6.0 至 7.6.6 以及 7.4.0 至 7.4.11。具有高权限的远程攻击者可通过向目标设备发送特制的 HTTP 请求触发该漏洞，成功利用后可实现任意代码或命令执行，完全控制受影响系统。该漏洞 CVSS 评分 7.2，危害等级高，建议用户尽快升级至修复版本。"
published = "2026-04-14T23:16:29.633"
remediation = "建议立即将 FortiWeb 升级至修复版本：8.0.x 升级至 8.0.4 及以上、7.6.x 升级至 7.6.7 及以上、7.4.x 升级至 7.4.12 及以上。如无法立即升级，应严格限制管理接口仅对可信 IP 开放，并启用多因素认证以降低攻击面。"
score = 7.2
severity = "HIGH"
