[basic]
description = "tags.<value>IMP Webmail（Horde 项目的一部分）2.2.6 及更早版本中的 status.php3 脚本存在跨站脚本（XSS）漏洞。远程攻击者可通过构造恶意 URL 并向 message 参数注入 JavaScript 代码，诱骗已登录用户访问该页面，从而在用户浏览器中执行恶意脚本并窃取其会话 Cookie。攻击者利用获取的会话 Cookie 即可劫持其他用户会话，无需密码即可登录目标账户，查看、转发或删除邮件内容，甚至获取邮件中存储的敏感个人信息。该漏洞影响 Horde IMP 2.2.x 系列，攻击条件为攻击者能够诱导已认证用户点击恶意链接，利用门槛较低。"
published = "2001-12-06T05:00:00Z"
remediation = "立即升级到 Horde IMP 2.2.7 版本，该版本已修复 status.php3 中的跨站脚本漏洞。升级方式：从 ftp://ftp.horde.org/pub/imp/ 下载 imp-2.2.7.tar.gz 并覆盖安装，或使用 patch-imp-2.2.6-2.2.7.gz 补丁进行热修复。同时配置 session.cookie_httponly=1 和 session.use_strict_mode=1 以增强会话 cookie 安全性，临时缓解措施还包括在 Web 服务器层面禁用 status.php3 的 GET 参数传递。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Horde IMP 跨站脚本会话劫持漏洞"
updated = "2026-06-16T21:55:06Z"

