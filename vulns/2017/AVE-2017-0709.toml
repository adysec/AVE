[basic]
description = "Apache Struts2 的 Jakarta Multipart 解析器在处理文件上传请求时存在异常处理缺陷，远程攻击者可通过向服务器发送特制的 Content-Type、Content-Disposition 或 Content-Length HTTP 头，触发 OGNL 表达式注入，从而在目标服务器上执行任意系统命令。该漏洞影响 Struts2 2.3.5 至 2.3.31 及 2.5 至 2.5.10 版本，CVSS 评分 9.8，危害等级严重。攻击无需任何认证，攻击复杂度低，已在 2017 年 3 月被大规模野外利用。"
published = "2017-03-11T02:59:00Z"
remediation = "立即升级 Apache Struts 2 至 2.3.32（2.3.x 分支）或 2.5.10.1（2.5.x 分支）及以上版本。如无法立即升级，可部署 WAF 规则拦截包含恶意 Content-Type 头部的请求，或禁用 Jakarta Multipart 解析器并切换至其他文件上传实现方式。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Apache Struts2 Jakarta Multipart 解析器远程命令执行漏洞"
updated = "2026-06-17T01:20:54Z"

