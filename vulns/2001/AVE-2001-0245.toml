[basic]
description = "Analog 是一款用于分析 Web 服务器日志的工具，该软件在 4.16 及更早版本中处理 ALIAS 命令时存在缓冲区溢出漏洞。未经身份认证的远程攻击者可以通过发送包含超长 ALIAS 命令字符串的请求触发该漏洞，导致缓冲区溢出并进而执行任意系统命令。由于攻击者无需事先认证即可远程利用，且能够完全控制受影响系统的机密性、完整性和可用性，CVSS 评分达到满分 10.0，危害等级为严重。建议用户立即升级到 4.16 或更高版本以修复此漏洞。"
published = "2001-05-03T04:00:00Z"
remediation = "建议立即将 Analog 软件升级至 4.16 或更高版本，以修复 ALIAS 命令处理长字符串时的缓冲区溢出漏洞。对于无法立即升级的系统，建议在防火墙中限制对该服务的外部访问，或暂时禁用相关 ALIAS 功能以降低风险。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Analog 网站日志分析软件 ALIAS 命令缓冲区溢出漏洞"
updated = "2026-06-16T21:54:03Z"

