[basic]
description = "Windows 高级本地过程调用（ALPC）机制存在特权提升漏洞。其原理是由于 Windows 在处理 ALPC 调用时存在逻辑处理不当，导致攻击者能够通过发送特制的本地请求，在内核空间触发漏洞从而实现从低权限用户到系统最高权限（SYSTEM）的提升。该漏洞影响范围广泛，包括 Windows 7、Windows 8.1、Windows 10 以及 Windows Server 2008/2012/2016 等多个版本。攻击者仅需在目标系统上获得低权限的本地访问权限，即可通过运行恶意利用程序触发该漏洞，从而完全控制受影响的系统。"
published = "2018-09-13T00:29:04Z"
remediation = "建议立即安装 Microsoft 2018 年 9 月的安全更新（累积更新 KB4038... 系列），或通过 Windows Update 自动更新到最新补丁版本。对于受影响的 Windows 7、8.1 及 Windows Server 各版本，请确保安装对应的 OS 累积更新以修复 ALPC 句柄处理缺陷。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows ALPC 特权提升漏洞"
updated = "2026-06-17T02:04:52Z"

