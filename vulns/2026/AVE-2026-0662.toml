[basic]
description = "Gitea Actions 的分叉 Pull Request 工作流程审批门存在永久绕过漏洞。`ifNeedApproval()` 函数在判断是否需要审批时，仅检查触发用户在该仓库中是否有任意历史审批记录，而未限定 Pull Request、提交 SHA 或时间窗口。攻击者只需让维护者一次性批准其首个分叉 PR 的无害工作流，即可永久获得该仓库的 CI 执行权限，此后提交的任何恶意工作流均无需再次审批即可在 Runner 上任意执行代码。该漏洞影响所有 Gitea v1.20.0 及之后版本（含 main 分支最新提交），CVSS 评分 8.9（高危）。攻击条件为：攻击者需拥有可分叉目标仓库的已认证账户，且目标仓库已启用 Actions 并运行了 Actions Runner。修复方案尚未发布。"
published = "2026-07-03T21:17:05Z"
remediation = "升级到 Gitea v1.26.4 或更高版本以彻底修复此漏洞。如暂无法升级，可在 app.ini 中设置 [actions] ENABLED = false 禁用 Actions 功能，或通过仓库设置拒绝所有 fork pull request，并移除已注册的外部运行器。对于已存在外部 PR 历史的仓库，建议撤销所有外部贡献者的 Actions 执行权限并重新审核其历史 PR。"
score = 8.9
severity = "HIGH"
sources = ["ghsa"]
title = "Gitea Actions 分叉 PR 工作流审批门绕过漏洞"
updated = "2026-07-06T18:18:46Z"

