[basic]
description = "Digilent DASYLab 存在越界写入漏洞，由于程序在加载恶意构造的文件时未正确校验数据边界，导致内存损坏。攻击者可通过诱使用户打开特制的 .DASYLab 项目文件触发该漏洞，成功利用后可实现信息泄露或任意代码执行。该漏洞影响所有版本的 Digilent DASYLab，CVSS 评分 8.5，危害等级高。目前官方尚未发布安全更新，建议用户避免打开来源不明的 DASYLab 文件。"
published = "2026-03-13T19:53:57Z"
remediation = "目前官方尚未发布安全补丁，Digilent 建议用户保持良好的网络安全意识，避免打开任何来自不可信来源的 DASYLab 文件。由于该漏洞需要用户交互（打开恶意文件）且无法远程利用，作为临时缓解措施，建议在组织内部禁用 DASYLab 对未知来源 .DASYLab 项目文件的自动加载功能，并通过组策略限制非授权用户安装或运行 DASYLab 软件。"
score = 8.5
severity = "HIGH"
sources = ["zdi"]
title = "Digilent DASYLab 越界写入漏洞"
updated = "2026-06-17T10:11:41Z"

