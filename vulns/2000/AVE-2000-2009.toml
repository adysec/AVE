[basic]
description = "Microsoft Exchange 2000 Server 在初始安装过程中会自动创建一个具有预设密码的用户账户。由于该密码为公开已知的默认凭据，未经身份认证的远程攻击者可以直接使用此账户登录 Exchange 服务器，进而获得提升的权限并执行管理操作。该漏洞影响 Exchange 2000 Server 的初始安装版本（Rev. A 之前），攻击者无需任何前提条件即可在网络上发起利用，可能导致邮件数据泄露、账户接管或进一步的域环境渗透。"
published = "2001-01-09T05:00:00Z"
remediation = "安装 Microsoft Security Bulletin MS00-088 官方补丁，或升级至 Exchange 2000 Server SP1 及以上版本以彻底修复该漏洞。如无法立即打补丁，应通过 Active Directory 用户和计算机管理工具删除或禁用 EUSR_EXSTOREEVENT 账户并修改其密码，同时在防火墙层面限制对 Exchange 服务器的远程访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Microsoft Exchange 2000 权限提升漏洞"
updated = "2026-06-16T21:53:14Z"

