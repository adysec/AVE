[basic]
description = "Apple iTunes 使用的 WebKit 引擎存在内存破坏漏洞，远程攻击者可通过构造恶意网站向用户发送特制网页内容触发该漏洞，导致远程代码执行或应用程序崩溃。该漏洞影响 Apple iTunes 10.7 之前的所有版本，攻击者无需身份认证即可在用户访问恶意站点时利用此漏洞。Apple 已在 2012 年 9 月发布的安全更新中修复了此问题，建议用户升级至最新版本。"
published = "2012-09-13T10:30:20.777"
remediation = '立即将 Apple iTunes 升级至 10.7 或更高版本，Apple 于 2012 年 9 月 12 日在安全公告 APPLE-SA-2012-09-12-1 中修复了此漏洞（HT5485）。可通过 iTunes 菜单栏中的"检查更新"功能自动下载安装，或从 Apple 官网手动下载完整安装包覆盖安装。如暂无法升级，建议暂时避免使用 iTunes 浏览或点击来源不明的网页链接，并已在防火墙或代理层面过滤恶意网站的 WebKit 相关请求，作为临时缓解措施。'
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple iTunes 远程代码执行漏洞"
updated = "2026-06-16T23:43:44.190"

