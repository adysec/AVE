[basic]
description = "WatchGuard SOHO Firewall 1.6 及 2.1.3 版本在处理 IP 分片数据包时存在安全缺陷，远程攻击者无需身份认证即可通过网络向目标设备发送大量特制的 IP 分片数据包，导致防火墙连接中断并停止转发数据包，最终引发拒绝服务。该漏洞影响 WatchGuard SOHO Firewall 系列产品，攻击者只需具备网络访问能力即可发起攻击，CVSS 评分 5.0，危害等级中危。"
published = "2001-02-12T05:00:00.000"
remediation = "建议立即升级至 WatchGuard Firebox 系列最新固件版本（如 FireOS 12.10 或更高版本），并禁用防火墙的 IP 分片重组功能。若设备已停止维护无法升级，请在网络边界部署入侵防御系统（IPS）拦截异常分片流量，并将旧设备隔离至受管网段，限制其对外暴露面。建议联系 WatchGuard 官方技术支持确认最新固件版本及升级路径，完成设备替代或固件升级后验证分片攻击是否仍可复现。如暂无法替代设备，可在上游路由器配置 ACL 限制异常分片包转发，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "WatchGuard SOHO Firewall IP Fragmentation 拒绝服务漏洞"
updated = "2026-06-16T21:52:42.733"

