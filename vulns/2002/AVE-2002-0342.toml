[basic]
description = "OpenSSH 在启用 Kerberos/AFS 支持且开启 KerberosTgtPassing 或 AFSTokenPassing 选项时，存在缓冲区溢出漏洞。该漏洞影响 OpenSSH 2.9.9 之前版本及 3.2.1 之前的 3.x 版本。已通过身份认证的远程或本地攻击者可利用此漏洞执行任意代码并提升权限，CVSS 评分 7.5（高危），攻击向量为网络、低复杂度、无需认证、部分机密性/完整性/可用性影响。"
published = "2002-06-18T04:00:00Z"
remediation = "升级 OpenSSH 至 2.9.9 或 3.2.1 及以上版本。若无法立即升级，请编辑 /etc/ssh/sshd_config 将 KerberosTgtPassing 和 AFSTokenPassing 设为 no，并重启 sshd 服务；或在编译时禁用 Kerberos/AFS 支持（--without-kerberos --without-afs）。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "OpenSSH OpenSSH 2.x/3.x Kerberos 4 TGT/AFS Token 缓冲区溢出漏洞"
updated = "2026-06-16T21:57:42Z"

