[basic]
description = "tags.<value>Phorum 3.0.7 版本的 admin.php3 脚本存在未验证的密码更改漏洞。远程攻击者无需身份认证，仅需发送构造的 HTTP 请求即可修改管理员密码。漏洞原理在于 admin.php3 在处理 step、option、confirm 和 newPssword 等变量时未进行权限验证，导致攻击者通过设置这些变量直接完成密码更改流程。该漏洞影响所有使用 Phorum 3.0.7 版本的论坛系统，攻击者只需知道目标站点地址即可在无需登录的情况下重置管理员密码，进而获得论坛完全控制权。攻击条件为攻击者能够向目标服务器发送 HTTP 请求，利用方式为向 admin.php3 发送包含新密码参数的 POST 或 GET 请求即可成功篡改管理员凭据。"
published = "2000-12-31T05:00:00Z"
remediation = "立即将 Phorum 升级到 6.0.4 或更高版本以修复此漏洞。如暂无法升级，应在 Web 服务器配置（如 Apache .htaccess 或 Nginx 配置）中限制对 admin.php3 的外部访问，仅允许可信 IP 访问。同时应立即修改管理员密码，并检查服务器访问日志中是否存在异常的 admin.php3 请求（如包含 step=4&amp;option=pass 参数的请求）。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Phorum 3.0.7 未授权管理员密码更改漏洞"
updated = "2026-06-16T21:53:25Z"

