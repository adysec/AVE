[basic]
description = "IBM AIX 4.3.0 操作系统中 portmir 工具存在缓冲区溢出漏洞。由于 echo_error 例程未对输入长度进行有效边界检查，本地攻击者可通过发送超长数据触发缓冲区溢出，进而覆盖内存数据、破坏锁文件内容，最终获得系统 root 权限。该漏洞影响运行 AIX 4.3.0 版本的服务器，CVSS 评分为 7.2，危害等级高。攻击者需要具备本地登录权限或 shell 访问能力才能利用此漏洞，成功利用后可完全控制目标系统。"
published = "2000-01-27T05:00:00Z"
remediation = "IBM 已发布 APAR IY07832 修复补丁，AIX 4.3.0 系统管理员应立即应用该补丁以修复 portmir 命令 echo_error 例程中的缓冲区溢出漏洞。具体操作：通过 IBM AIX 官方支持渠道获取并安装 APAR IY07832 补丁包，安装完成后重启系统使修复生效。如无法立即应用补丁，应通过文件权限设置限制普通用户对 portmir 命令的执行权限，或暂时移除 /etc/locks 目录下非必要锁文件的写权限，以降低本地用户提权风险。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "IBM AIX portmir 本地缓冲区溢出提权漏洞"
updated = "2026-06-16T21:53:24Z"

