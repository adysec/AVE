[basic]
description = "Sun Java Virtual Machine（JVM）中的 java.security.AccessController 类存在空指针处理缺陷，未经身份认证的远程攻击者可通过向目标系统提供恶意构造的 Java 程序，调用 doPrivileged 方法时传入 null 参数，触发 JVM 发生段错误（Segmentation Violation）并崩溃，从而导致拒绝服务。该漏洞影响运行 Sun JRE 1.2.2 和 1.3.1 版本的系统和应用程序，攻击者无需事先获得任何凭据或权限即可在远程触发，攻击复杂度低，可导致服务中断。Sun Microsystems 在后续版本中修复了此缺陷。"
published = "2002-12-31T05:00:00Z"
remediation = "建议将受影响版本的 Sun Java 运行时环境（JRE）升级至已修复该漏洞的版本。JRE 1.3.1 用户应升级至 JDK 1.3.1_02 或更高版本，JRE 1.2.2 用户应升级至 JDK 1.2.2_010 或更高补丁版本，JRE 1.4 及后续版本不受此漏洞影响。如当前运行环境为旧版本且无法立即升级，可考虑在应用层增加对 Java 程序调用的输入校验，确保向 AccessController.doPrivileged() 方法传入非空参数，或在边界防火墙层面限制对运行 Java 应用的端口的未授权访问，以降低被远程拒绝服务攻击的风险。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Sun JRE 1.2.2/1.3.1 doPrivileged 拒绝服务漏洞"
