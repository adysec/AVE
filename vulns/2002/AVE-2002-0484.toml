[basic]
description = 'SeaNox Devwex 1.2002.0601 之前版本存在目录遍历漏洞。远程攻击者可通过向目标系统发送包含 `..\`（点点反斜杠）序列的特制 HTTP 请求，利用该漏洞读取 Web 服务器上的任意文件，导致敏感信息泄露。攻击无需身份认证，仅需网络访问目标 Web 服务即可触发。该漏洞 CVSS 评分 5.0，危害等级中危。目前已有公开的 PoC 利用代码。'
published = "2002-10-04T04:00:00Z"
remediation = '立即升级 SeaNox Devwex 至 1.2002.0601 或更高版本，该版本已修复目录遍历漏洞。如无法升级，在 Web 服务器配置中禁用 `..\` 路径序列，或部署 WAF 规则拦截包含 `..\` 的 HTTP 请求路径作为临时缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "SeaNox Devwex 目录遍历漏洞"
updated = "2026-06-16T21:58:26Z"

