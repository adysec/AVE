[basic]
description = "NetBSD 系统中的 mopd（维护操作协议加载守护进程）存在缓冲区溢出漏洞，远程攻击者可通过向目标系统发送包含超长文件名的特制请求触发缓冲区溢出，导致任意代码执行。该漏洞影响 NetBSD 操作系统，CVSS 评分 7.5，危害等级高。攻击者无需身份认证即可远程利用，建议用户升级至修复版本或禁用受影响服务。"
published = "2000-10-20T04:00:00.000"
remediation = "立即升级 NetBSD 系统上的 mopd 守护进程至打过补丁的版本，补丁位于 http://cvsweb.netbsd.org/bsdweb.cgi/basesrc/usr.sbin/mopd/mopd/process.c.diff?r1=1.7&r2=1.8；OpenBSD 用户安装对应版本补丁（参见 http://www.openbsd.org/errata.html#mopd）；Red Hat Linux 用户安装 RHSA-2000-050 提供的更新包；FreeBSD 用户应用安全公告中的补丁。临时缓解措施可在无法立即升级时禁用 mopd 服务或限制仅受信任主机访问 UDP 端口 150。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "NetBSD mopd 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:24.187"

