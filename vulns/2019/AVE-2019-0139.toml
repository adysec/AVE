[basic]
description = "SibSoft Xfilesharing 2.5.1 及之前版本存在文件上传漏洞，攻击者可通过向 cgi-bin/up.cgi 端点上传任意文件（如包含短代码的 .html 文件），在目标服务器上执行恶意代码。该漏洞无需身份认证即可利用，攻击条件宽松，仅需向服务器发送特制的 HTTP 请求即可触发。结合 CVE-2019-18951 可实现远程代码执行，严重威胁服务器安全。影响范围包括所有使用 SibSoft Xfilesharing 2.5.1 及以下版本的网站服务器。Microsoft 并未直接修复此漏洞，需由 SibSoft 官方发布补丁或升级至修复版本。"
published = "2019-11-13T23:15:11.590"
remediation = "立即将 SibSoft Xfilesharing 升级至 2.5.2 及以上版本，该版本修复了 cgi-bin/up.cgi 任意文件上传漏洞。如无法立即升级，可采取以下缓解措施：1) 删除或重命名 cgi-bin/up.cgi 文件以禁用上传功能；2) 在 Web 服务器配置中禁止访问 /cgi-bin/ 目录；3) 部署 Web 应用防火墙（WAF）规则，拦截包含 multipart/form-data 上传请求且目标路径为 up.cgi 的流量；4) 限制上传文件扩展名白名单，拒绝 .html、.php、.jsp 等可执行文件类型的上传请求。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "SibSoft Xfilesharing 文件上传漏洞"
