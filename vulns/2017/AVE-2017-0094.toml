[basic]
description = "WordPress 的 Error Log Viewer 插件（由 BestWebSoft 开发）1.0.6 版本之前存在多处跨站脚本（XSS）漏洞。该漏洞源于插件在 bws_panel 管理页面的 category 参数中未对用户输入进行充分的过滤与转义，导致已认证的攻击者可以构造包含恶意 JavaScript 代码的 URL，诱使具有管理员权限的用户点击后，在目标浏览器中执行任意脚本代码，从而窃取会话 Cookie、伪造页面内容或执行其他恶意操作。攻击者需要先获取 WordPress 站点的低权限账号，且需要受害者主动交互（点击链接），攻击复杂度较低。该漏洞影响范围较广，CVSS 评分 6.1，危害等级中危。厂商已在 1.0.6 版本中修复此问题。"
published = "2019-08-22T00:00:00Z"
remediation = "立即更新 WordPress error-log-viewer 插件至官方最新版本。如无更新版本或无法升级，在 WordPress 后台禁用该插件，同时配置 Web 应用防火墙（WAF）规则拦截包含恶意脚本的请求参数，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress error-log-viewer插件跨站脚本漏洞"
updated = "2019-08-22T00:00:00Z"

