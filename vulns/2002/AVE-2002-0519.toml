[basic]
description = "SunPS iRunbook 2.5.2 的 none.php 页面存在任意文件读取漏洞，远程攻击者无需认证即可通过向该脚本的传入参数传递绝对路径，读取服务器上的任意文件，包括配置文件、敏感数据等。该漏洞影响 Sun i-Runbook 2.5.2 版本，CVSS 评分 10.0，危害等级严重。攻击者只需构造特制 HTTP 请求即可利用，无需特殊权限。"
published = "2002-10-04T04:00:00Z"
remediation = "SunPS iRunbook 2.5.2 已于 2002 年停止支持，无官方补丁。建议立即将该系统从公网隔离，仅允许受信内网 IP 访问；在 Web 服务器（如 Apache/Nginx）层面配置 `none.php` 文件的访问控制规则，拒绝外部对 `/cgi-bin/none.php` 的直接请求；同时移除或重命名 `none.php` 文件以彻底消除入口。如业务可迁移，建议升级至仍在维护的替代产品。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Sun i-Runbook 任意文件读取漏洞"
updated = "2026-06-16T21:58:36Z"

