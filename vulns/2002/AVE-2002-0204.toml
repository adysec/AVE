[basic]
description = 'Microsoft Internet Explorer 5.01、5.5 及 6.0 版本中存在本地信息泄露漏洞（MS02-023）。远程攻击者可通过构造包含恶意 CSS 脚本的网页，利用 stylesheet 对象的 cssText 属性读取目标系统上包含 "{" 字符的任意文件内容。攻击者无需身份认证，只需诱使用户访问恶意网页即可触发该漏洞，导致敏感信息泄露。Microsoft 已在安全公告 MS02-023 中发布相关补丁修复此问题。'
published = "2002-05-29T04:00:00Z"
remediation = "安装 Microsoft 安全公告 MS02-023 提供的补丁，升级 Internet Explorer 至最新版本。对于无法立即打补丁的环境，可禁用 Active Scripting 或使用组策略限制样式表对象的 cssText 属性访问作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer CSS 本地信息泄露漏洞"
updated = "2026-06-16T21:56:58Z"

