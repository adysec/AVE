[basic]
description = "CERN Proxy Server（W3C CERN httpd 3.0）存在跨站脚本攻击（XSS）漏洞。远程攻击者可通过构造包含恶意脚本的链接指向不存在的页面，当用户访问该链接时，代理服务器在返回的错误页面中会原样插入该链接名称，导致恶意脚本在用户浏览器中执行。攻击者利用该漏洞可窃取用户会话 Cookie、重定向用户至恶意网站或篡改页面内容。该漏洞影响所有使用 W3C CERN HTTPd 3.0 代理服务的系统，攻击者无需身份认证即可实施攻击，只需诱使目标用户点击恶意构造的链接即可完成利用。建议升级至安全版本或打补丁修复。"
published = "2002-08-12T04:00:00Z"
remediation = "建议将 CERN HTTPd 3.0 Proxy 替换为 Apache、Nginx 等仍在维护的现代 Web 服务器或代理软件，因为 CERN HTTPd 已停止开发且未发布针对此漏洞的补丁。如短期内无法替换，应在代理前端部署 Web 应用防火墙（WAF），过滤错误页面中回显的 URL 参数，阻止 HTML 及 SCRIPT 标签注入，同时修改 Proxy 错误页面模板，对用户提供的 URL 进行 HTML 实体编码后再输出，防止跨站脚本执行。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "W3C CERN HTTPd 3.0 Proxy 跨站脚本攻击漏洞"
updated = "2026-06-16T21:59:20Z"

