[basic]
description = "GNU Binutils 2.45 的链接器组件（bfd/elflink.c）中的 get_link_hash_entry 函数存在越界读取漏洞。本地攻击者可通过向受影响系统提交特制的 ELF 文件触发该漏洞，导致链接器进程读取超出预期边界的内存数据，可能造成敏感信息泄露或程序崩溃。该漏洞攻击复杂度低，需要本地用户权限，无需用户交互。GNU Binutils 2.46 版本已修复此问题。"
published = "2025-10-07T23:15:33Z"
remediation = "升级 GNU Binutils 至 2.46 或更高版本，官方补丁提交为 aeaaa9af6359。各发行版用户请安装对应安全更新：SUSE Linux 用户安装 SUSE-SU-2025:4096-1 更新，Ubuntu/Debian 用户通过 apt upgrade binutils 更新，RHEL/CentOS 用户通过 yum update binutils 更新。如无法升级，避免在链接过程中使用不受信任的目标文件作为输入。"
score = 1.9
severity = "LOW"
sources = ["msrc"]
title = "GNU Binutils 链接器越界读取漏洞"
updated = "2026-06-17T08:30:24Z"

