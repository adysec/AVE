[basic]
description = "Windows 在处理身份验证请求时存在权限提升漏洞。由于 Windows 未正确验证身份验证请求的输入，本地攻击者可通过登录目标系统并运行特制的应用程序来触发该漏洞，成功利用后可获取 SYSTEM 权限，从而完全控制受影响系统。该漏洞影响所有受支持的 Windows 版本，攻击者需具备有效凭据和本地访问权限，攻击复杂度较低。Microsoft 已在 2019 年 10 月安全更新中修复此漏洞。"
published = "2019-10-10T14:15:16Z"
remediation = "立即安装 Microsoft 2019 年 10 月安全更新：Windows 8.1/Server 2012 R2 用户安装 KB4520005（月度汇总）或 KB4519990（仅安全更新）；Windows 10 用户安装 KB4517389；Windows Server 2019 用户安装 KB4519338。可通过 Windows Update 自动获取更新，或从 Microsoft Update Catalog 手动下载安装。该漏洞需本地用户登录后利用，无法立即打补丁时，应限制非管理用户的本地登录权限并启用 Windows Defender 应用程序控制以降低攻击面。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows 特权提升漏洞"
updated = "2026-06-17T02:28:22Z"

