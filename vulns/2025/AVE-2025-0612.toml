[basic]
description = "AWS Amplify Studio 的 amplify-codegen-ui 包在表达式绑定处理组件架构属性时缺乏输入验证，导致经认证的用户可通过创建或修改组件，在组件渲染和构建过程中执行任意 JavaScript 代码。该漏洞影响 2.20.2 及更早版本，攻击者需具备组件创建或修改权限，利用方式为注入恶意表达式实现远程代码执行。CVSS 评分 9.0（严重），建议升级至 2.20.4 版本修复。"
published = "2025-05-05T19:15:57Z"
remediation = "升级 amplify-codegen-ui 包到 2.20.4 或更高版本（执行 npm install @aws-amplify/codegen-ui@latest 或 yarn upgrade @aws-amplify/codegen-ui），并确保所有分叉或衍生代码均已应用修复补丁。"
score = 9
severity = "CRITICAL"
sources = ["ghsa"]
title = "AWS Amplify Studio 输入验证缺陷导致任意代码执行漏洞"
updated = "2026-07-29T16:17:47Z"

