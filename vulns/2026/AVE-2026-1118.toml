[basic]
description = "tags.<value>Adobe Acrobat Reader 存在释放后使用漏洞（CWE-416），由于程序在释放内存后未正确清除指针引用，攻击者可通过构造特制的恶意 PDF 文件诱骗用户打开，从而在当前用户上下文中执行任意代码。该漏洞影响 Acrobat Reader 24.001.30365、26.001.21651 及更早版本，攻击者需诱骗用户打开恶意文件才能成功利用，CVSS 评分 7.8，危害等级为高。"
published = "2026-06-09T21:17:21Z"
remediation = "立即将 Adobe Acrobat Reader 升级至以下修复版本：24.x 分支升级至 24.001.30383 或更高版本，26.x 连续版本升级至 26.001.21662 或更高版本，详细说明参见 Adobe 安全公告 APSB26-63（https://helpx.adobe.com/security/products/acrobat/apsb26-63.html）。可通过 Acrobat Reader「帮助」→「检查更新」功能自动完成升级，或前往 Adobe 官网手动下载安装最新版本。如暂时无法完成升级，应提高安全警惕，不打开来源不明的 PDF 文件，同时在邮件网关和终端防护系统层面对 PDF 附件进行病毒扫描，并在浏览器中禁用 PDF 自动打开功能，以降低受攻击面。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Adobe Acrobat Reader 释放后使用远程代码执行漏洞"
updated = "2026-07-23T09:10:00Z"

