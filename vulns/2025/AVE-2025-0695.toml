[basic]
description = "Windows 电话服务（Telephony Service）在处理特制请求时存在堆缓冲区溢出漏洞（CWE-122），远程攻击者可通过向受影响系统发送恶意构造的请求触发该漏洞，成功利用可在目标系统上以服务权限执行任意代码，实现完全控制。攻击者需要诱导用户执行特定操作（如点击恶意链接或打开特制文件）以触发漏洞利用条件。该漏洞影响 Windows 10/11 全系列版本及 Windows Server 2008/2012/2016/2019/2022/2025 等多个版本，CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞，建议用户安装更新 KB5049984 等对应补丁。"
published = "2025-01-14T18:15:36Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 (KB5049984)。受影响 Windows 版本对应的更新包括 KB5049983、KB5050004、KB5050021、KB5049981，请通过 Windows Update 或 Microsoft Update Catalog 下载安装。如无法立即打补丁，可在防火墙或终端上禁用 TAPI 服务 (Telephony Service) 作为临时缓解措施，但需评估业务影响。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:42:51Z"

