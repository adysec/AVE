[basic]
description = "Evince 文档查看器的 DVI 后端中 VF 字体解析器存在数组索引错误漏洞。该漏洞源于对 VF 字体文件中数组边界检查不足，攻击者可通过构造恶意的 VF 字体文件并嵌入 DVI 文档中，诱使用户通过 Evince 或缩略图预览器打开该文档，触发函数指针覆盖，导致任意代码执行。成功利用此漏洞可完全控制受影响系统，CVSS 评分 7.6，危害等级高。该漏洞影响 Evince 2.32 及更早版本。"
published = "2011-01-07T19:00:17Z"
remediation = "建议立即升级 Evince 至 2.30.3 及以上版本（Debian 用户安装 DSA-2357-1 更新至 2.30.3-2，RHEL 6 用户安装 RHSA-2011:0009 更新至 evince-2.28.2-14.el6_0.1）。避免打开来源不明的 DVI 文件，不安装不可信字体文件。如无法升级，可禁用 Evince 的 DVI 后端渲染功能作为临时缓解措施。"
score = 7.6
severity = "HIGH"
sources = ["tenable"]
title = "GNOME Evince VF字体解析器远程代码执行漏洞"
updated = "2026-06-16T23:21:08Z"

