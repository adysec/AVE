[basic]
description = "I-gear 3.5.7 及更早版本在处理日志条目时存在缺陷，当 URL 长度超过 255 字符时无法正确解析，导致报告生成错误。攻击者可通过构造超长 URL 的恶意请求触发该漏洞，造成日志记录和报告功能异常，影响系统的可用性。该漏洞可远程利用，无需身份认证，攻击复杂度低，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），主要影响 I-gear 服务的日志记录和报告模块。"
published = "2000-12-11T05:00:00.000"
remediation = "升级 I-gear 至 3.5.7 以上版本，该版本已修复对超长 URL（超过 255 字符）日志处理不当的问题。如厂商已停止维护无法升级，可在 Web 服务器或反向代理层限制请求 URL 长度不超过 255 字符，并配置日志输入过滤规则，拒绝或截断超长 URL 条目，防止日志记录功能被异常数据干扰导致报表错误。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "I-gear 超长URL日志输入验证漏洞"
updated = "2026-06-16T21:52:57.537"

