[basic]
description = 'tags.<value>MDaemon 是一款邮件服务器软件，其附带的 WorldClient 5.0.5.0 及更早版本中的 WorldClient.cgi 脚本存在目录遍历漏洞。该漏洞源于 Attachments 参数未对用户输入进行充分过滤，攻击者可在参数值中使用 ".."（点号点号）序列进行目录跳转。由于攻击需具备本地访问权限，本地用户可利用此漏洞删除服务器上的任意文件，从而造成数据丢失或系统服务中断。该漏洞影响范围涵盖 MDaemon 5.0.5.0 及更早版本，CVSS v2 评分为 7.2，危害等级为高。Alt-N Technologies 已在后续版本中修复了此漏洞，建议用户升级至最新版本。'
published = "2002-12-31T05:00:00Z"
remediation = '建议立即升级 Alt-N Technologies MDaemon 至 5.0.6 或更高版本，该版本已修复 WorldClient.cgi 中的目录遍历漏洞。若暂时无法升级，可在 Web 服务器层面配置输入验证规则，拦截 Attachments 参数中包含 ".." 路径遍历序列的请求，同时限制 WorldClient 进程对文件系统的写入/删除权限至最小必要目录。'
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "MDaemon WorldClient 任意文件删除漏洞"
updated = "2026-06-16T21:59:54Z"

