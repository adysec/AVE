[basic]
description = "Apple Safari 6.0 之前的版本中，WebKit 引擎存在内存破坏漏洞。未经身份认证的远程攻击者可通过构造恶意网站，利用该漏洞触发内存 corruption，导致任意代码执行或拒绝服务（应用崩溃）。该漏洞影响使用 WebKit 引擎的 Safari 浏览器版本，CVSS 评分 9.3，危害等级严重。攻击条件为用户访问特制的恶意网页即可触发，无需额外交互。"
published = "2012-07-25T20:55:04.273"
remediation = "立即将 Apple Safari 升级至 6.0 或更高版本，以修复 WebKit 内存破坏漏洞。升级后重启浏览器确保补丁生效。如无法立即升级，可在 Safari 设置中禁用 JavaScript 作为临时缓解措施，降低被利用风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:41.460"

