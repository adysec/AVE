[basic]
description = "这是Gitea的一个漏洞，影响用户可以使用仓库写权限通过网页版发布编辑表单绕过发布附件类型允许列表。通过向目标系统发送包含修改的发布表单数据，可将现有的允许的文件（如.zip,.tar.gz）重命名为禁止的扩展名（如.e的、html。js、svg）。这允许攻击者将其标记为发布版本附件分发的恶意软件文件、提供相关服务的链接、带有存储区XSS的HTML/SVG文件等。这种情况导致发布的附件类型控制失效，可能被非授权者获取或下载不安全的文件，还可能泄露业务数据和个人信息，严重威胁系统的安全性。该漏洞影响Gitea v1.26.1及以上版本，随着发布的附件类型允许列表的严格程度的提高，这种漏洞越容易受到影响。"
published = "2026-01-01T00:00:00Z"
remediation = "建议立即升级至 Gitea 1.27.0 或更高版本（含 PR #32151 同类修复），并在 app.ini 中确保 [repository.release] ALLOWED_TYPES 已正确配置允许列表。若暂无法升级，可临时在反向代理层拦截 /releases/edit/* 路径下的 attachment-edit-* 表单字段，或收紧仓库写入权限仅限可信用户，作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Gitea 发布附件扩展名允许列表绕过漏洞"
updated = "2026-01-01T00:00:00Z"

