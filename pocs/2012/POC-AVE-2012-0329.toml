[info]
author = "ave"
description = "验证Apple iTunes WebKit内存破坏漏洞，远程攻击者可通过构造恶意网页触发内存 corruption，导致任意代码执行或应用崩溃拒绝服务"
id = "POC-AVE-2012-0329"
name = "CVE-2012-3652 PoC"
severity = "medium"
tags = ["ave-2012-0329"]
vuln_id = [
    "CVE-2012-3652",
    "AVE-2012-0329",
]

[poc]
