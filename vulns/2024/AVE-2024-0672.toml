[basic]
description = "Linux 内核 PCI DWC 子系统中存在 BAR 配置验证缺失漏洞。pci_epc_set_bar() 函数在更新 BAR 的映射物理地址时，未充分校验新 BAR 的大小和标志位是否与已有配置一致。攻击者可在具备低权限的本地条件下，通过调用 set_bar() 设置与现有 BAR 配置不同的尺寸，导致 iATU 地址转换范围小于主机已确定的 BAR 大小。当主机读取超出新 BAR 范围的内存时，数据将绕过地址转换直接透传，可能读取到不属于当前 struct pci_epf_bar 的内核内存，造成敏感信息泄露。该漏洞影响使用 DesignWare PCIe 控制器的 Linux 内核系统，CVSS 评分 5.5，危害等级中危。"
published = "2025-02-27T03:15:11Z"
remediation = "建议立即将 Linux 内核升级至 6.12.14 及以上版本（或 6.13.3、6.14），包含提交 b5cacfd06706 的补丁。Ubuntu 22.04 LTS 用户可安装 linux-image-6.8.0-64-generic 版本（USN-7653-1）。如无法立即升级，可限制本地用户对 PCIe EP 功能驱动（drivers/pci/controller/dwc/pcie-designware-ep.c）的访问作为临时缓解。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel PCI dwc ep BAR 大小/标志变更检查缺失漏洞"
updated = "2026-06-17T08:14:25Z"

