[basic]
description = "Microsoft Office OneNote 存在远程代码执行漏洞，由于软件在处理特制 OneNote 文件时未正确验证输入数据，导致内存损坏。攻击者可通过诱导用户打开恶意构造的 OneNote 文档触发该漏洞，成功利用可在目标系统上以当前用户权限执行任意代码。该漏洞攻击复杂度低，无需额外权限，但需要用户交互。影响 Microsoft Office 相关版本，CVSS 评分 7.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:16:04.190"
remediation = "建议立即将 Microsoft OneNote for Mac 升级至 16.92.24120731 及以上版本，Office LTSC for Mac 2021/2024 升级至 16.93.25011212 及以上版本。可通过 Microsoft AutoUpdate（打开任意 Office 应用 → 帮助 → 检查更新）或从 Microsoft 官网下载最新安装包进行更新。临时缓解措施：不要打开来自不可信来源的 .one 文件，并在打开前通过 Gatekeeper 确认文件签名有效性。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Office OneNote 远程代码执行漏洞"
updated = "2026-06-17T08:43:17.007"

