[basic]
description = "Windows Win32k 组件存在内存对象处理不当导致的特权提升漏洞（CVE-2019-0797）。该漏洞源于 Win32k.sys 内核驱动程序在处理内存中的对象时未正确验证对象属性，导致本地攻击者可通过构造恶意调用触发内存破坏，从而将权限从低权限用户提升至 SYSTEM 权限。该漏洞影响 Windows 7/8.1/10 及对应 Server 版本（含 Server 2008 R2/2012/2012 R2/2016/2019），CVSS 3.1 评分 7.8（HIGH），攻击向量为本地（AV:L），攻击复杂度低（AC:L），需低权限（PR:L），无需用户交互（UI:N），机密性/完整性/可用性均高影响（C:H/I:H/A:H）。攻击者需已获得本地低权限访问权限，通过调用特定 Win32k 系统调用（如 NtUserSetWindowLongPtr 等）触发内核对象类型混淆或 Use-After-Free，实现任意代码执行并提权至 SYSTEM。该漏洞与 CVE-2019-0808 为不同漏洞，微软已于 2019 年 4 月补丁日（KB4493472 等）发布补丁修复。已知在野利用样本存在（CISA KEV 目录收录），建议尽快安装对应补丁补丁（KB4493472/KB4493475 等）。"
published = "2019-04-09T03:29:00Z"
remediation = "建议立即安装 Microsoft 2019 年 4 月安全更新（KB4493470 等对应补丁），通过 Windows Update 自动更新或手动下载安装对应版本补丁（Windows 7/Server 2008 R2 安装 KB4493472，Windows 8.1/Server 2012 R2 安装 KB4493467，Windows 10/Server 2016/2019 安装对应累积更新）。若无法立即打补丁，可临时禁用不必要的 Win32k 系统调用或限制本地用户权限作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows Win32k 特权提升漏洞"
updated = "2026-06-17T02:08:55Z"

