[basic]
description = "BSD 系统 lpr/lpd 打印服务存在格式字符串漏洞，位于 printjob.c 文件中 startprinting() 函数的 syslog 调用不当，直接使用了来自 checkremote() 函数的格式化字符串参数。本地低权限用户可通过构造包含格式说明符的特制输入触发该漏洞，向系统日志输出恶意数据并篡改内存，从而获取 root 级别权限。该漏洞影响基于 BSD 的 lpr/lpd 软件包，攻击者需具备本地访问权限即可利用，CVSS v3 评分 7.2，危害等级高。攻击者可借此实现对目标系统的完全控制，进而进一步渗透内网或横向移动。"
published = "2002-08-12T04:00:00Z"
remediation = '建议更新 NetBSD 系统至已修复该漏洞的安全版本。对于仍在使用旧版 lpd 服务的系统，应修改 printjob.c 中的 startprinting() 函数，将 syslog() 调用改为使用固定格式字符串（如 syslog(LOG_ERR, "%s", message)）以消除格式化字符串漏洞，或直接禁用不必要的 lpd 服务以降低风险。'
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "NetBSD lpr/lpd 打印服务格式字符串本地权限提升漏洞"
updated = "2026-06-16T21:53:23Z"

