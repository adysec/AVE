[basic]
description = "Oracle MySQL Server 的 Optimizer 组件存在权限管理不当漏洞（CWE-732），具有高权限账号的网络攻击者可通过多种网络协议向目标服务器发送特制请求触发该漏洞，导致数据库服务异常终止或持续挂起，造成完全拒绝服务。该漏洞影响 MySQL Server 8.0.0-8.0.41、8.4.0-8.4.4 及 9.0.0-9.2.0 版本，CVSS 3.1 基础评分为 4.9，危害等级中等。攻击者需要具备高权限凭据，攻击复杂度低，且无需用户交互即可完成利用。Oracle 已在 2025 年 4 月关键补丁更新中修复该漏洞。"
published = "2025-04-15T21:15:53.557"
remediation = "立即升级Oracle MySQL到8.0.42及以上版本或9.2.1及以上版本，这是修复CVE-2025-21581漏洞的安全更新版本。通过mysqlupgrade命令完成升级，然后重启MySQL服务确保补丁生效。如需缓解风险，可临时将optimizer_debug_level系统变量设置为0以降低优化器组件的攻击面，并在防火墙中限制高权限用户访问MySQL端口（默认3306）。对于8.0.x系列用户，建议直接升级至8.0.42或更高版本以获得完整修复；9.0.x系列用户应至少升级至9.2.1版本。"
score = 4.9
severity = "MEDIUM"
sources = ["msrc"]
title = "Oracle MySQL 查询优化器拒绝服务漏洞"
