[basic]
description = "Telnet客户端存在信息泄露漏洞，受影响的Telnet客户端在处理telnet: URL或连接恶意Telnet服务器时，会自动向远程服务器发送本地环境变量，导致敏感信息泄露。攻击者可通过诱导用户点击恶意telnet: URL或连接到恶意Telnet服务器，获取客户端环境变量中的敏感信息（如路径、用户名等）。该漏洞影响支持环境变量自动发送功能的Telnet客户端，攻击需要用户交互（点击链接或连接服务器），攻击复杂度较高，CVSS评分2.6，仅影响机密性，不影响完整性和可用性。"
published = "2001-07-21T04:00:00.000"
remediation = "建议升级 Telnet 客户端至修复环境变量泄露的版本（如 OpenSSH 替代 Telnet），在客户端配置中禁用 ENVIRON 选项协商（设置 set env off），在浏览器中禁用 telnet: URL 协议处理程序，建议全面弃用 Telnet 改用 SSH 协议进行远程管理。"
score = 2.6
severity = "LOW"
sources = ["epss"]
title = "OpenBSD Telnet客户端 信息泄露漏洞"
updated = "2026-06-16T21:52:41.357"

