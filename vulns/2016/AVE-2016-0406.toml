[basic]
description = 'SAP NetWeaver Java AS 存在目录遍历漏洞，远程攻击者无需身份认证即可通过向 CrashFileDownloadServlet 的 fileName 参数传入 `..\`（点反斜杠）序列绕过路径限制，实现任意文件读取。该漏洞影响 SAP NetWeaver AS Java 7.1 至 7.5 版本，可导致敏感配置文件、源代码等机密信息泄露。攻击者只需发送特制 HTTP 请求即可利用，无需特殊权限，CVSS 评分 7.5，危害等级高。SAP 已在安全公告 2234971 中发布修复补丁。'
published = "2016-04-07T23:59:10Z"
remediation = '立即应用 SAP Security Note 2234971 对应的补丁包。对于 SAP NetWeaver AS Java 7.1-7.5，通过 SAP Solution Manager 或 SAP Launchpad 下载并安装最新 Support Package 或补丁。如无法立即打补丁，可在 Web 应用防火墙（WAF）层面拦截包含 `..\` 路径遍历特征的请求，并限制对 CrashFileDownloadServlet 的访问权限作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "SAP NetWeaver AS Java 目录遍历漏洞"
updated = "2026-06-17T00:46:39Z"

