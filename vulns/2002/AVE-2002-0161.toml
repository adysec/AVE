[basic]
description = "Icecast 1.x 流媒体服务器中的 AVLLib 组件存在缓冲区溢出漏洞，远程攻击者可通过向目标服务器发送特制的超长 HTTP GET 请求（来自 MP3 客户端）触发该漏洞，导致缓冲区溢出，进而实现远程代码执行。该漏洞影响 Icecast 1.3.11 及更早版本，CVSS 评分 7.5，危害等级高。攻击者无需身份认证即可利用此漏洞，完全控制受影响服务器。目前官方已发布修复版本，建议用户升级至 Icecast 1.3.12 或更高版本。"
published = "2002-04-22T04:00:00Z"
remediation = "立即升级至 Icecast 2.x 系列最新版本（当前为 2.5.0），Icecast 1.x 全系列（≤1.3.11）已停止维护且存在多处缓冲区溢出漏洞。如无法升级，可在源码 `src/client.c` 的 `client_login()` 函数入口处添加长度检查：`if(strlen(expr) > 8000) return;` 后重新编译部署，或在网络边界限制对 Icecast 服务端口（默认 8000/8001）的访问来源。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Xiph.Org Icecast 1.x AVLLib缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:56:56Z"

