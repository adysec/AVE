[basic]
description = "eXtropia bbs_forum.cgi 1.0 存在目录遍历漏洞，远程攻击者无需身份认证即可通过向 file 参数提交 `../` 等路径穿越序列，突破 Web 根目录限制读取服务器上的任意文件，导致敏感信息泄露。结合 CGI 环境特性，攻击者还可进一步利用该漏洞实现任意命令执行。该漏洞影响 eXtropia bbs_forum.cgi 1.0 版本，攻击复杂度低，危害较大。"
published = "2001-03-12T05:00:00.000"
remediation = "立即停止使用并移除 eXtropia bbs_forum.cgi 1.0 脚本，该软件已停止维护且不再提供安全更新。如必须保留论坛功能，应替换为其他受支持的论坛软件。临时缓解措施包括：在 Web 服务器层限制对该 CGI 脚本的访问（如通过 Apache 的 Location 指令仅允许可信 IP 访问），并在反向代理或 WAF 层面过滤 `read` 参数中的 `../` 路径穿越序列及 shell 元字符（如 `;`、`|`、`` ` ``），同时确保 Web 服务器以最低权限用户（如 nobody）运行并限制其可读文件范围。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "eXtropia bbs_forum.cgi 1.0 目录遍历漏洞"
