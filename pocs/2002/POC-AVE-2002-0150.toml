[info]
author = "ave"
description = "检测目标 Squid 代理服务器版本是否在受影响范围内（2.4 STABLE4 之前，或 2.5/2.6 在 2002-03-12 之前的分发版本），通过发送 HTTP 请求检查 Server 响应头中的版本信息"
id = "POC-AVE-2002-0150"
name = "Squid 代理服务器远程堆缓冲区溢出漏洞 PoC"
severity = "high"
tags = [
    "cve-2002-0163",
    "squid",
    "buffer-overflow",
]
vuln_id = [
    "CVE-2002-0163",
    "AVE-2002-0150",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Squid"]
