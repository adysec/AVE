[basic]
description = "DB4Web 3.4 和 3.6 版本中的 db4web_c 及 db4web_c.exe 程序存在路径遍历文件泄漏漏洞。未经身份认证的远程攻击者可通过构造特制的 HTTP 请求，在请求参数中使用以盘符（如 C:）、双斜杠绝对路径（如 //absolute/path）或点号序列（如 ..）等形式指定文件名，从而绕过目录访问限制，读取目标服务器上的任意文件内容。该漏洞影响使用受影响版本 DB4Web 的 Web 服务器，攻击者无需登录凭据即可发起利用。成功利用可能导致敏感配置文件、源代码或系统文件泄露，造成信息安全隐患。攻击者仅需向目标 Web 服务器发送单次特制 HTTP 请求即可完成利用，利用门槛较低。"
published = "2003-04-22T04:00:00.000"
remediation = '立即应用 DB4Web 官方补丁：访问 http://www.db4web.de/download/homepage/hotfix/readme_en.txt 下载并安装针对 3.4/3.6 版本的安全补丁，修复 db4web_c 及 db4web_c.exe 中的目录遍历漏洞。如补丁无法获取，应在 Web 服务器（如 Apache/IIS）的配置中对 db4web_c 和 db4web_c.exe 脚本所在路径实施访问控制，仅允许来自内部可信网络的请求，并阻止包含 "C:"、双斜杠 "//" 及多级点号 ".." 的请求参数通过。同时建议在网络边界部署 WAF 规则拦截包含目录遍历特征的 URL 请求。长期应评估迁移至受支持的数据库 Web 管理工具，因为 DB4Web 厂商已停止运营且版本过时。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "DB4Web 3.4/3.6 文件泄漏漏洞"
updated = "2026-06-16T21:59:24.753"

