[basic]
description = "WordPress File Manager 插件（wp-file-manager）6.9 版本之前存在未经授权的文件上传漏洞。该插件包含一个不安全的 elFinder 连接器示例文件，攻击者可将其重命名为 .php 后缀，从而绕过上传限制，向 wp-content/plugins/wp-file-manager/lib/files/ 目录上传任意 PHP 文件并远程执行代码。攻击者无需身份认证即可通过 HTTP 请求利用该漏洞，CVSS 评分 10.0，危害等级严重。该漏洞在 2020 年 8 月至 9 月期间已被广泛利用于野外攻击。"
published = "2020-09-09T16:15:12Z"
remediation = "立即将 WordPress 的 wp-file-manager 插件升级到 6.9 或更高版本。如无法立即升级，可临时禁用该插件，或删除 wp-content/plugins/wp-file-manager/lib/ 目录下的 elFinder 连接器文件（connector.minimal.php.dist 等），并在服务器层面限制 /wp-content/plugins/wp-file-manager/lib/files/ 目录的 PHP 执行权限。"
score = 10
severity = "CRITICAL"
sources = ["kev"]
title = "WordPress wp-file-manager 文件上传远程代码执行漏洞"
updated = "2026-06-17T03:06:35Z"

