[basic]
description = "Squid 2.3 及更早版本在某些配置下存在符号链接攻击漏洞。本地攻击者可通过创建恶意的符号链接，诱使 Squid 代理服务在写入临时文件时覆盖系统任意文件，导致本地文件被篡改或破坏。该漏洞需要攻击者拥有本地系统访问权限，且 Squid 配置中使用了不安全的临时文件处理方式，攻击条件较为受限，CVSS 评分 1.2，危害等级低。"
published = "2001-03-12T05:00:00.000"
remediation = "升级到 Squid 2.4 及以上版本以修复临时文件符号链接攻击漏洞。Debian 用户可参考安全公告 DSA-019 通过 apt-get update && apt-get upgrade 更新 squid 软件包；Mandrake Linux 用户可参考 MDKSA-2001-003 更新至修复版本。如无法立即升级，应避免在 Squid 配置中使用不安全临时目录，并限制本地用户对 Squid 临时文件目录的写入权限。"
score = 1.2
severity = "LOW"
sources = ["cve"]
title = "Squid Squid 本地符号链接攻击任意文件写入漏洞"
updated = "2026-06-16T21:53:45.107"

