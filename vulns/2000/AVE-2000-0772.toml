[basic]
description = "Netscape iCal 2.1 Patch 2（即 iPlanet iCal）在安装时将大量文件设置为全局可写权限，本地攻击者可利用此漏洞将 iplncal.sh 程序替换为特洛伊木马，从而修改 iCal 配置并在目标系统上以 iCal 进程权限执行任意命令。攻击者需要本地系统访问权限，无需特殊权限即可利用，CVSS 评分 7.2，危害等级高。"
published = "2000-12-11T05:00:00.000"
remediation = "立即将 iPlanet iCal 升级至 2.1 Patch 3 或更高版本。如无法升级，以 root 身份执行 `chmod -R o-w /opt/iPlanet/iCal/` 移除全局写权限，并检查 `iplncal.sh` 等关键脚本的属主和权限是否为 `root:root` 且仅属主可写（权限 755）。同时限制可登录服务器的本地用户范围，防止非授权用户替换可执行文件。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Netscape iPlanet iCal iplncal.sh 本地权限提升漏洞"
updated = "2026-06-16T21:53:05.613"

