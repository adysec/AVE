[basic]
description = "CVS Kit CVS Server 1.10.8 客户端存在路径信任漏洞，客户端未对 CVS 服务器提供的路径名进行验证，恶意服务器可通过发送特制路径名强制客户端创建任意文件。该漏洞影响 CVS 1.10.8 版本客户端，攻击者需具备本地访问权限并诱导用户连接恶意 CVS 服务器，利用方式为服务端向客户端传递包含目录遍历序列的路径名，导致客户端在非预期位置写入文件，破坏文件系统完整性，CVSS 评分 2.1，属低危本地漏洞。"
published = "2000-10-20T04:00:00.000"
remediation = "建议升级 CVS 至 1.11.0 或更高版本（1.11 版本修复了客户端对服务器路径名的盲目信任问题），或迁移至 Subversion/Git 等现代版本控制系统。若暂时无法升级，请限制 CVS 服务器仅允许受信任网络访问，并在客户端配置中禁用不安全的路径处理选项。"
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "CVS Kit CVS Server 1.10.8 任意文件创建漏洞"
updated = "2026-06-16T21:52:15.130"

