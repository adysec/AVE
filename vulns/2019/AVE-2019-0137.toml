[basic]
description = "Strapi 内容管理系统在 3.0.0-beta.17.5 之前的版本中，密码重置功能存在授权绕过漏洞。攻击者无需任何身份认证即可通过向 Auth.js 端点发送特制的密码重置请求，绕过密码重置令牌验证机制，从而重置任意用户的密码并获取账户控制权。该漏洞影响所有使用受影响 Strapi 版本的部署实例，CVSS 评分 9.8，危害等级严重。攻击条件仅为网络可达目标服务，利用方式简单直接，已有 Metasploit 模块和多个公开 PoC 可供验证。修复方案为升级 Strapi 至 3.0.0-beta.17.5 或更高版本。"
published = "2019-11-07T22:15:10.570"
remediation = "立即将 Strapi 升级至 v3.0.0-beta.17.5 或更高版本，该版本修复了密码重置接口的授权绕过问题。如无法立即升级，可在反向代理层限制对 /auth/password/reset 端点的未认证访问，并启用 IP 访问控制策略临时缓解。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Strapi CMS 授权问题漏洞"
updated = "2026-06-17T02:25:23.883"

