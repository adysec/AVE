[basic]
description = "WordPress ajax-random-post 插件 2.00 版本存在反射型跨站脚本漏洞（Reflected XSS），攻击者可通过构造特制的 URL 将恶意 JavaScript 代码注入目标页面，当受害者点击该链接时，恶意脚本在浏览器中执行，导致攻击者窃取会话 Cookie、劫持用户会话或重定向至钓鱼页面。该漏洞无需身份认证，攻击复杂度低，但需要用户交互（点击链接）。CVSS 评分 6.1，危害等级中危。建议升级插件至最新版本或禁用该插件以消除风险。"
published = "2016-10-10T20:59:01Z"
remediation = "立即停用并删除 ajax-random-post 插件 2.00 版本，该插件已停止维护且不再更新。建议使用其他经过安全审计的随机文章展示插件替代，如 WordPress 官方推荐的 Random Posts 插件。同时启用 Web 应用防火墙（WAF）规则拦截常见的反射型 XSS 攻击载荷，并对用户输入参数进行严格的 HTML 实体编码输出。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress ajax-random-post 插件反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:43Z"

