[basic]
description = "Ghost 内容管理系统存在服务端请求伪造（SSRF）漏洞，源于 Webmentions 等功能的输入验证不足。未经身份认证的远程攻击者可滥用该功能，向 Ghost 服务器内部网络中的主机发起受限的 HTTP 请求，从而探测内网资产信息。该漏洞影响 Ghost 6.26.0 至 6.54.0 版本，攻击复杂度较高且无需用户交互，成功利用后攻击者无法获取响应数据，但可借助请求行为推断内网服务存在性。此问题已在 Ghost 6.54.1 版本中得到修复。"
published = "2026-08-05T16:17:03Z"
remediation = "tags.<value>立即将 Ghost 升级至 v6.54.1 或更高版本。Docker 部署请更新 Docker 镜像并重启容器；Ghost-CLI 部署请运行 ghost update 命令完成升级。临时缓解措施：在反向代理层或防火墙规则中禁用 Webmentions 功能，或限制 Ghost 服务器对内部网络的出站 HTTP 请求，防止攻击者利用 SSRF 探测内网资产。"
score = 4
severity = "MEDIUM"
sources = ["ghsa"]
title = "Ghost 内容管理系统 服务端请求伪造漏洞"
updated = "2026-08-06T15:17:25Z"

