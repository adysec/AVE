[basic]
description = "Hilgraeve HyperTerminal 6.0 的 Telnet 组件存在缓冲区溢出漏洞，远程攻击者可通过向目标系统发送超长 telnet URL 触发该漏洞，导致任意代码执行。该漏洞影响 Windows 98、ME 及 Windows 2000 系统，CVSS 评分 7.5，危害等级高。攻击者无需身份认证即可远程利用，已有公开 PoC 可用。"
published = "2000-12-19T05:00:00.000"
remediation = '立即安装 Microsoft 安全公告 MS00-079 提供的补丁：Windows 98/ME 用户下载并安装 KB274548 更新包，Windows 2000 用户下载并安装 KB276471 更新包。如无法安装补丁，可在 Windows 2000 上取消将 HyperTerminal 注册为默认 Telnet 客户端，通过修改注册表 HKEY_Classes_Root\telnet\shell\open 命令回退到命令行 telnet.exe。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Hilgraeve HyperTerminal Telnet 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:55.553"

