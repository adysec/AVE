[basic]
description = "w3m 0.3.2 存在跨站脚本（XSS）漏洞，在渲染框架（frame）中的 HTML 标签时未进行适当的转义处理。远程攻击者可构造包含恶意脚本或 HTML 的页面，当用户访问该页面时，脚本将在浏览器上下文中执行，从而获取用户的文件或 Cookie 信息。该漏洞影响 w3m 0.3.2 及之前版本，攻击条件为受害者需访问攻击者构造的恶意网页，利用方式为诱导用户点击或访问嵌入恶意内容的页面。CVSS 评分为 4.3，危害等级中等。"
published = "2002-12-11T05:00:00Z"
remediation = "升级到 w3m 0.3.2.1 或更高版本，该版本修复了 frame 内容未正确转义 HTML 标签导致的跨站脚本漏洞。如无法立即升级，建议在防火墙或代理层面过滤恶意网页内容，或暂时避免使用 w3m 浏览不可信站点。"
score = 4.3
severity = "MEDIUM"
sources = ["redhat"]
title = "w3m HTML标签跨站脚本漏洞"
updated = "2026-06-16T21:59:07Z"

