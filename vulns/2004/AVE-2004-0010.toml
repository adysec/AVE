[basic]
description = "RXGoogle.cgi 搜索脚本存在跨站脚本（XSS）漏洞，由于软件未能正确过滤用户输入，攻击者可通过 query 参数注入恶意 HTML/JavaScript 脚本。该漏洞影响部署了 RXGoogle.CGI 1.0/2.5 版本的 Web 服务器，未经身份认证的远程攻击者只需构造包含恶意脚本的 URL 并诱导用户访问，即可在受害者浏览器中以受信任站点的身份执行任意 JavaScript 代码，从而窃取基于 Cookie 的身份验证凭据、劫持用户会话或发起其他攻击。"
published = "2004-11-23T05:00:00Z"
remediation = """立即从 Web 服务器中移除 rxgoogle.cgi 脚本文件，改用 Google Programmable Search Engine 等经过维护的现代搜索替代方案。如短期内无法下线，应在 Web 服务器配置层对 query 参数实施严格输入过滤，禁止传入 &lt;、&gt;、/、'、" 等 HTML/JavaScript 元字符，并对脚本输出进行 HTML 实体编码，同时启用 X-XSS-Protection: 1; mode=block 响应头及 Content-Security-Policy 响应头，将脚本执行来源限制为同源，以阻断跨站脚本注入路径。"""
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "RXGoogle.CGI 跨站脚本漏洞"
updated = "2026-06-16T22:05:15Z"

