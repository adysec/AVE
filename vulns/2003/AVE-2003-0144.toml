[basic]
description = "标签中输出。<value>Stunnel 3.24及4.00版本存在特权文件描述符泄露漏洞。该软件在调用listen()系统调用获取的特权文件描述符处理不当，导致本地攻击者能够获取到该文件描述符并利用其劫持Stunnel服务器进程。成功利用后，攻击者可接管服务器会话、监听原本受SSL/TLS加密保护的通信流量，甚至进一步获取服务器权限。该漏洞影响配置为使用OpenSSL进行加密传输的Stunnel服务，攻击条件为攻击者需具备目标系统的本地访问权限，利用复杂度低且无需身份认证。Red Hat已将其评级为重要安全漏洞。"
published = "2003-10-20T04:00:00Z"
remediation = "建议将 Stunnel 升级至 4.01 或更高版本。如果无法立即升级，可通过限制本地非特权用户的权限，或使用 chroot 环境隔离 Stunnel 进程，以防止本地攻击者访问并劫持泄露的文件描述符。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "Stunnel 守护进程劫持漏洞"
updated = "2026-06-16T22:02:44Z"

