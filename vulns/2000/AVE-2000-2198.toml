[basic]
description = "IBM Tivoli Management Framework 3.7.1 中的 Tivoli Lightweight Client Framework (LCF) 存在安全绕过漏洞。该组件的 HTTP 接口在安装时默认将 http_disable 参数设置为零（即启用状态），远程已认证用户可通过操纵日志文件的方式绕过 Tivoli Endpoint Configuration 数据文件的访问权限限制，从而未经授权读取或修改敏感配置文件。该漏洞影响 IBM Tivoli Management Framework 3.7.1 版本，攻击者需通过身份认证后方可利用，利用方式涉及对日志文件进行未明确说明的操纵操作。"
published = "2000-12-31T05:00:00Z"
remediation = "升级 IBM Tivoli Management Framework 至已修复此漏洞的版本，并确认 Tivoli Lightweight Client Framework (LCF) 的 http_disable 参数已设置为 1（禁用 HTTP 接口），可通过修改 lcf.cfg 配置文件或在 Tivoli 管理控制台中将 HTTP 服务设置为禁用状态实现。同时建议在防火墙层限制对 LCF 管理端口的访问，仅允许受信任的管理主机连接，并检查 Tivoli Endpoint Configuration 数据文件的权限设置，确保普通用户无法通过 HTTP 接口读取或修改敏感配置文件。"
score = 9
severity = "CRITICAL"
sources = ["epss"]
title = "IBM Tivoli Management Framework 安全绕过漏洞"
updated = "2026-06-16T21:53:26Z"

