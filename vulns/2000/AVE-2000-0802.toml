[basic]
description = "Microsoft Windows Media Player 7.0 支持自定义皮肤（.wms）文件，该类文件可包含恶意脚本代码。当用户打开特制的 .wms 皮肤文件时，嵌入的脚本会在本地计算机的上下文中执行，导致攻击者获取与当前用户相同的系统权限，可执行任意命令、读取或修改文件。该漏洞需要用户交互（打开恶意文件），影响 Windows Media Player 7.0 用户。Microsoft 已在 MS00-090 安全公告中发布补丁修复此问题。"
published = "2001-01-09T05:00:00.000"
remediation = '立即安装 Microsoft 安全公告 MS00-090 提供的补丁：Windows Media Player 7 用户下载 https://www.microsoft.com/download/details.aspx?FamilyId=BAF62356-D717-4B8F-97E0-299A7697A083 的补丁包，Windows Media Player 6.4 用户下载 https://www.microsoft.com/download/details.aspx?FamilyId=9B94D3F0-9CF3-4A5F-8215-A221DDD923B0 的补丁包。如无法安装补丁，可在 Windows 资源管理器中取消注册 .wmd 和 .wmz 文件关联（查看→选项→文件类型→删除"Windows Media Player 皮肤包"和"Windows Media Player 下载包"），并在 IE 安全设置中禁用 Internet 区域的 ActiveX 控件作为临时缓解措施。'
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows Media Player 7.0 任意脚本执行漏洞"
updated = "2026-06-16T21:53:10.350"

