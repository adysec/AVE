[basic]
description = "Windows 数字媒体组件存在越界读取漏洞（CWE-125），具有低权限的本地攻击者通过物理方式访问目标系统后，利用特制的数字媒体文件触发该漏洞，可导致权限提升，获取系统最高控制权。该漏洞影响 Windows 10/11 及 Windows Server 多个版本，CVSS 评分 6.6，危害等级中危。攻击者需具备物理访问能力及低权限账户，无需用户交互即可完成利用，成功后可完全控制受影响的系统，窃取敏感信息、安装恶意程序或创建高权限账户。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:45Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 (KB5050061)，该补丁修复了 Windows 数字媒体组件的越界读取漏洞。各受影响版本对应修复版本号：Windows 10 1507 升级至 10.0.10240.20890，Windows 10 1607/Server 2016 升级至 10.0.14393.7699，Windows 10 1809/Server 2019 升级至 10.0.17763.6775，Windows 10 21H2 升级至 10.0.19044.5371，Windows 10 22H2 升级至 10.0.19045.5371，Windows 11 22H2/23H2 升级至 10.0.22621.4751/22631.4751，Windows 11 24H2/Server 2025 升级至 10.0.26100.2894，Server 2022 升级至 10.0.20348.3091。可通过 Windows Update 自动获取更新，或从 Microsoft 更新目录网站手动下载安装。由于该漏洞需要物理访问才能利用，无法立即打补丁时可限制对受影响系统的物理接触作为临时缓解措施。"
score = 6.6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 数字媒体特权提升漏洞"
updated = "2026-06-17T08:42:56Z"

