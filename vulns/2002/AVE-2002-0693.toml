[basic]
description = "Bonobo 中的 efstools 工具存在命令行参数缓冲区溢出漏洞。当该工具以 setuid 权限安装时，本地攻击者可通过向程序传递超长的命令行参数触发缓冲区溢出，进而执行任意代码。此漏洞影响 Mandrake Linux 7/8/9 及 RedHat Linux 6.x/7 等发行版，攻击者需具备本地系统访问权限，利用该漏洞可获取本地用户权限提升或执行恶意代码，CVSS 评分 4.6，危害等级中低。"
published = "2002-12-31T05:00:00Z"
remediation = "立即升级 Bonobo efstools 软件包至修复该缓冲区溢出的版本；或通过 chmod 移除 efstools 的 setuid 权限位，阻止本地用户利用长命令行参数执行任意代码。如暂时无法升级，可在系统中禁用或删除 setuid 权限的 efstools 工具作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Bonobo efstools 命令行参数缓冲区溢出漏洞"
updated = "2026-06-16T22:00:06Z"

