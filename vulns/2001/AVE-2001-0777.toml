[basic]
description = "Lotus Domino R5 服务器和客户端的 HTML 解析器存在缓冲区溢出漏洞。远程攻击者无需身份验证，可通过向目标系统发送包含畸形字体大小说明符的特制 HTML 内容触发该漏洞，导致缓冲区溢出，从而引发拒绝服务或远程代码执行。该漏洞影响 Domino R5 Server 5.05 及更早版本、Domino R5 Client 5.04 及更早版本，CVSS 评分为 10.0，危害等级严重。攻击者成功利用后可完全控制受影响系统。"
published = "2001-03-12T00:00:00Z"
remediation = "建议将 Lotus Domino R5 服务器及客户端升级至厂商发布的最新修复补丁版本，或整体迁移至更高版本的 HCL Domino。若无法立即升级，应在防火墙层面限制对 Domino 服务器端口的外部访问，仅允许受信任的 IP 地址连接，以缓解远程缓冲区溢出导致的拒绝服务风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "IBM Lotus Domino R5 服务器和客户端缓冲区溢出拒绝服务漏洞"
updated = "2001-03-12T00:00:00Z"

