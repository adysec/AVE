[basic]
description = "Mozilla Firefox 4.x至11.0、Firefox ESR 10.x至10.0.4、Thunderbird 5.0至11.0、Thunderbird ESR 10.x至10.0.4及SeaMonkey 2.9之前版本中存在跨站脚本（XSS）漏洞。该漏洞源于对ISO-2022-KR和ISO-2022-CN字符集的解码处理存在缺陷，多字节字符集中的特定字节可破坏后续字节，导致攻击者能够注入任意Web脚本或HTML代码。远程攻击者可通过构造特制的恶意链接或页面，诱使用户访问，在用户浏览器中执行恶意脚本，窃取Cookie、会话令牌等敏感信息。该漏洞利用需用户交互，CVSS评分4.3，危害等级中危。"
published = "2012-04-25T10:10:17Z"
remediation = "升级 Firefox 至 12.0 及以上版本，Firefox ESR 升级至 10.0.4 及以上版本；Thunderbird 升级至 12.0 及以上版本，Thunderbird ESR 升级至 10.0.4 及以上版本；SeaMonkey 升级至 2.9 及以上版本。无法立即升级时，可在浏览器中禁用 ISO-2022-KR 和 ISO-2022-CN 字符集支持作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 字符集解码跨站脚本漏洞"
updated = "2026-06-16T23:37:22Z"

