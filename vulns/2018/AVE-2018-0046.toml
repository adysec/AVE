[basic]
description = """
The current description field is empty/invalid (it has some garbled content). I need to generate a proper Chinese description for CVE-2018-10822 based on the NVD data and other pre-search information.

Let me synthesize the information:
- D-Link routers (DWR-116, DIR-140L, DIR-640L, DWR-512, DWR-712, DWR-912, DWR-921, DWR-111)
- Directory traversal vulnerability in web interface (httpd server)
- Attack vector: send `GET /uir` with `/..` or `//` in the HTTP request
- Allows reading arbitrary files
- CVSS 7.5 HIGH
- This exists because of incorrect fix for CVE-2017-6190
- Unauthenticated, network-based, no user interaction needed

Let me write a good Chinese description.D-Link 多款路由器（DWR-116、DIR-140L、DIR-640L、DWR-512、DWR-712、DWR-912、DWR-921、DWR-111）的 web 管理界面 httpd 服务存在目录遍历漏洞。该漏洞源于对 CVE-2017-6190 的修复不完善，未经身份认证的远程攻击者可通过向 HTTP 请求的 `/uir` 路径后附加 `/..` 或 `//` 构造恶意 URL，遍历服务器文件系统并读取任意敏感文件（如配置文件、密码哈希等）。CVSS 评分 7.5，危害等级高，影响固件版本 DWR-116 至 1.06、DIR-140L/DIR-640L 至 1.02、DWR-512/DWR-712/DWR-912/DWR-921 至 2.02、DWR-111 至 1.01。"""
published = "2018-10-17T14:29:00Z"
remediation = "D-Link 仅对 DWR-116 和 DWR-111 提供了固件补丁，建议登录 D-Link 官方支持网站下载并升级到最新固件版本；对于 DIR-140L、DIR-640L、DWR-512、DWR-712、DWR-912、DWR-921 等已停止支持（EOL）的设备，厂商不再发布更新，建议立即更换为仍在支持周期内的路由器型号。临时缓解措施：在路由器管理界面中禁用远程 Web 管理功能，并在网络防火墙层面限制对路由器 80/443 端口的访问来源，仅允许受信任的内部 IP 访问。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "D-Link 多款路由器 httpd 服务目录遍历漏洞"
updated = "2026-06-17T01:34:43Z"

