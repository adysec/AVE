[basic]
description = "Quest KACE System Management Appliance 8.0.318 的 '/common/run_cross_report.php' 脚本中 'fmt' 参数存在跨站脚本（XSS）漏洞。未经身份验证的远程攻击者可通过构造恶意的 fmt 参数值，诱导用户点击包含恶意脚本的链接，在受害者浏览器中执行任意 JavaScript 代码，可导致会话劫持、凭证窃取或代表用户执行操作。该漏洞影响 Quest KACE SMA 8.0.318 版本，CVSS 3.0 评分 6.1（中危），攻击向量为网络，攻击复杂度低，无需权限但需要用户交互，影响范围扩大，机密性和完整性影响较低。"
published = "2018-05-31T18:29:00Z"
remediation = "升级 Quest KACE System Management Appliance 到支持安全补丁的版本（8.0.318安全更新或更高版本），并在系统管理界面中启用XSS防护功能，禁用run_cross_report.php脚本的调试模式，同时对所有用户输入的'fmt'参数进行HTML实体编码和严格验证，并确保页面输出采用适当的内容安全策略（CSP）以阻止XSS攻击。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Quest KACE 系统管理设备 跨站脚本漏洞"
updated = "2026-06-17T01:35:18Z"

