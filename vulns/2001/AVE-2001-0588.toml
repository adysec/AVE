[basic]
description = "CVE-2001-0055是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-02-16T05:00:00.000"
remediation = "升级到包含 SYN 保护功能的 CBOS 2.4.2 或更高版本固件，启用 SYN Cookie 功能并配置 SYN 分页限制，通过路由器访问控制列表（ACL）阻止异常的 SYN 洪水流量，如果可能的话关闭不必要的外部 TCP 端口以减少暴露面。还可以配置路由器启用 TCP 同步ookie支持（enable tcpsyncookie）并设置 SYN 连接速率限制，以阻止慢速 SYN 攻击破坏系统资源。临时缓解措施是在防火墙中限制进入 Cisco 600 路由器的 SYN 流量或启用基于端口的流量过滤。详见 Cisco 官方发布的 2001 年 4 月安全公告，建议立即部署最新固件以获得完整修复。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Cisco CBOS TCP SYN 拒绝服务漏洞"
updated = "2026-06-16T21:53:34.257"

