[basic]
description = "Allaire ColdFusion Server 4.5.1及更早版本的管理员登录页面存在拒绝服务漏洞。远程攻击者无需身份认证即可通过向登录密码字段提交超长字符串，导致ColdFusion Administrator服务进程崩溃，造成拒绝服务。该漏洞影响ColdFusion Server 2.0/3.x/4.x系列版本，攻击条件简单，仅需网络可达即可触发，CVSS评分5.0，危害等级中等。官方已发布安全更新修复此问题。"
published = "2000-06-07T04:00:00Z"
remediation = "升级 ColdFusion Server 至 4.5.1 以上版本，或安装厂商当时发布的安全补丁。由于该产品已停止维护，建议迁移至 Adobe 官方支持的现代 ColdFusion 版本（如 2023 或 2021 系列）。作为临时缓解措施，在防火墙上限制对 ColdFusion Administrator 登录页面的访问来源 IP，仅允许受信任的管理网段访问。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Allaire ColdFusion Server 管理员登录拒绝服务漏洞"
updated = "2026-06-16T21:51:57Z"

