[basic]
description = "Oracle Internet Application Server（IAS）3.0.7 及更早版本中的 mod_sql 组件存在 SQL 注入漏洞。远程攻击者可通过构造特制的 URL 查询字符串，将恶意 SQL 语句注入到数据库查询中，从而绕过身份验证、篡改或窃取数据库中的敏感数据。该漏洞影响所有使用受影响版本 Oracle IAS 的 Web 应用程序，攻击者无需身份认证即可在未授权的情况下执行任意 SQL 命令，对数据库的机密性、完整性和可用性造成威胁。CVSS v3 评分为 7.5，危害等级为中等。"
published = "2000-12-31T05:00:00Z"
remediation = "建议将 Oracle Internet Application Server (IAS) 升级至 3.0.8 或更高版本，并同步更新 mod_sql 模块。若无法立即升级，应在 Web 服务器前端部署 WAF 过滤 URL 查询字符串中的 SQL 关键字（如 SELECT, UNION, DROP 等），或在应用程序层对 mod_sql 接收的输入参数进行严格的类型检查与转义处理。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Oracle Internet Application Server mod_sql SQL注入漏洞"
updated = "2026-06-16T21:53:26Z"

