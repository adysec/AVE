[info]
author = "ave"
description = "检测LPPlus中dccscan二进制文件是否存在且可读，验证本地用户是否可能利用该程序读取任意文件。"
id = "POC-AVE-2000-0647"
name = "LPPlus dccscan Unprivileged Read PoC"
severity = "low"
tags = ["ave-2000-0647"]
vuln_id = [
    "CVE-2000-0881",
    "AVE-2000-0647",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/usr/local/bin/dccscan"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = ".+"
type = "regex"
