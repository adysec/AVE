[basic]
description = "Opera浏览器11.50之前的版本在处理数据URI、错误页面和文本节点选择等功能时存在多重安全漏洞。攻击者可远程发送精心 crafted 的IPv6数据包或触发特定场景（如文本节点选择、已关闭弹出窗口、IFRAME元素等），导致浏览器无法处理引发应用程序崩溃和拒绝服务。漏洞影响范围涵盖所有Opera浏览器11.50之前的桌面及移动设备版本，涉及的攻击表面非常广泛，包括但不限于打印功能、JavaScript执行、渲染路径、音频/视频处理、Canvas绘制、CSS文件、表单布局、Web Workers等15+关键功能模块。攻击者无需任何认证即可执行，攻击复杂性较低，风险主要集中在系统可用性层面。虽然该漏洞目前主要表现为应用程序崩溃，但同时也存在潜在的远程代码执行风险。CVSS评分为5.0（A:P），表明该漏洞严重影响系统稳定性，可能为更高级别的攻击行为埋下隐患。Microsoft等浏览器厂商已陆续针对这些安全问题发布了多个紧急更新，并建议用户尽快升级到最新版本以获取保护。Opera Web Browser系列漏洞（CVE-2011-2610~CVE-2011-2627）是一系列与Web渲染引擎相关的安全问题（CWE-119）、弱点类型（WASC-31）和威胁范型（WASC-41）等安全问题总括，受到攻击者特别关注，被广泛用于Web应用安全研究和测试。​是浏览器安全开发中一个典型的议题，常被用作Web浏览器安全预警预警系统的基准案例，涉及安全策略、开发规范、部署实施、事件响应、技术研究、管理策略和安全文化等诸多层面安全建设。​ Linux（Ubuntu，CentOS），Windows等操作系统用户均需关注。​​​"
published = "2011-07-01T10:55:02Z"
remediation = "建议立即将 Opera 浏览器升级至 11.50 及以上版本，可通过官网 https://www.opera.com/download 下载最新安装包进行覆盖安装。如暂时无法升级，可禁用 JavaScript 并避免访问不可信网站作为临时缓解措施，减少触发崩溃的攻击面。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera Opera Web Browser 远程拒绝服务漏洞"
updated = "2026-06-16T23:31:39Z"

