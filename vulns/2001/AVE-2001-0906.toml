[basic]
description = "Windows CE 3.0.9348 在生成 TCP 初始序列号（ISN）时使用可预测的算法，导致远程攻击者无需身份认证即可预测目标系统的 TCP 序列号。攻击者可通过发送伪造的 TCP 数据包或实施会话劫持，冒充合法用户与目标建立连接或接管现有 TCP 会话，进而窃取敏感数据、注入恶意流量或中断服务。该漏洞影响运行 Windows CE 3.0.9348 的嵌入式设备，攻击条件为攻击者能够与目标设备进行网络通信，利用方式为预测序列号后构造特制 TCP 包完成连接欺骗或劫持，CVSS 评分 7.5，危害等级高。"
published = "2001-01-01T05:00:00Z"
remediation = "Microsoft 已在后续版本的 Windows Embedded Compact 中修复此 TCP ISN 可预测性问题。受影响设备应升级至受支持的 Windows Embedded Compact 版本，或联系 OEM 厂商获取补丁更新。如无法立即升级，建议在边界防火墙层面对 Windows CE 设备的入站 TCP 连接进行严格限制，仅允许受信任的源 IP 地址访问，以降低 TCP 连接被欺骗或劫持的风险。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Windows CE TCP 初始序列号预测漏洞"
updated = "2026-06-16T21:53:47Z"

