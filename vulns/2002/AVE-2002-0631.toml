[basic]
description = "Alt-N MDaemon POP3 服务器（6.0.7 及更早版本）存在缓冲区溢出漏洞。远程攻击者可通过发送超长的 DELE 或 UIDL 命令参数触发该漏洞，无需身份认证即可导致目标服务拒绝服务（DoS）。该漏洞影响运行 MDaemon 6.0.x 系列版本的邮件服务器，攻击者利用此漏洞可使 POP3 服务崩溃，中断邮件收发功能。"
published = "2003-03-31T05:00:00.000"
remediation = "立即将 Alt-N MDaemon 升级至 6.0.8 或更高版本，该版本修复了 POP3 服务器命令的参数边界检查缺陷。如无法立即升级，可在 POP3 服务前端部署防火墙规则，限制来自不可信网络的 110 端口访问，或临时禁用 POP3 服务以降低暴露面。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Alt-N MDaemon POP Server 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:59:31.017"

