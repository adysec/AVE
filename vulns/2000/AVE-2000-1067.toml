[basic]
description = 'XFCE 3.5.1 默认配置中，xinitrc 程序包含 "xhost +localhost" 命令，该命令绕过了 Xauthority 访问控制机制，允许所有本地连接无需认证即可访问 X 服务器。本地攻击者可利用此缺陷嗅探 X Window 通信流量，窃取键盘输入、屏幕截图等敏感信息，从而获取系统权限提升。该漏洞影响 XFCE 3.5.1 版本，攻击者需拥有本地系统访问权限方可利用。'
published = "2000-12-11T05:00:00Z"
remediation = '升级到 XFCE 3.5.2 或更高版本以移除 xinitrc 中的 "xhost + localhost" 命令。如无法立即升级，可手动编辑 /usr/X11R6/lib/X11/xinit/xinitrc 或 ~/.xinitrc 文件，删除或注释掉包含 "xhost + localhost" 的行，阻止本地用户绕过 Xauthority 访问控制机制。'
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "XFCE xinitrc 默认配置权限提升漏洞"
updated = "2026-06-16T21:53:04Z"

