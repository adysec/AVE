[basic]
description = "MicroStrategy MicroStrategy Library组件存在反射型跨站脚本漏洞（XSS），未经身份验证的远程攻击者可通过构造包含恶意脚本的URL参数，诱导已登录用户点击该链接，从而在用户浏览器中执行任意JavaScript代码。该漏洞影响MicroStrategy 11.1.3之前的所有版本，利用条件为攻击者需诱使用户访问特制的恶意链接，且用户须处于已登录状态。攻击者可在受害者的浏览器会话中窃取敏感信息或执行恶意操作。"
published = "2019-11-14T14:15:11.803"
remediation = "立即升级 MicroStrategy Library 至 11.1.3 或更高版本以修复反射型跨站脚本漏洞。临时缓解措施：在 Web 应用防火墙（WAF）中启用 ModSecurity CRS 941100、941130、941160 等 XSS 检测规则，过滤 URL 参数及请求体中的 <script>、onerror、javascript: 等恶意载荷；在应用层对所有用户可控输入实施 HTML 实体编码（输出编码）；在 HTTP 响应头中添加 Content-Security-Policy: script-src 'self' 以禁止内联脚本执行，降低 XSS 攻击成功率。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "MicroStrategy MicroStrategy Library 反射型跨站脚本漏洞"
updated = "2026-06-17T02:25:38.610"

