[basic]
description = 'Debian 系统中 top 工具存在格式字符串漏洞，由于 top 程序在处理 "kill" 或 "renice" 功能时未正确验证用户输入的格式字符串参数，导致本地攻击者可通过构造特制的格式字符串触发该漏洞。攻击者利用该漏洞可覆盖任意内存地址，从而获取 root 权限，实现完全控制目标系统。该漏洞影响 Debian 系统，攻击者需拥有本地访问权限，无需身份认证即可利用，危害等级高。'
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 top 程序至修复版本：Debian 用户升级 procps 包至 1.02-8 或更高版本；FreeBSD 用户应用 SA-00:62 补丁；OpenBSD 2.7 用户应用 028_format_strings 补丁。如无法升级，可限制本地用户对 top 的 SUID 执行权限作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Debian top 格式字符串本地权限提升漏洞"
updated = "2026-06-16T21:52:56.410"

