[basic]
description = "Samba 2.2.8 之前版本中的注册表文件写入代码存在条件竞争漏洞。本地攻击者可通过利用 chown 操作中的竞态条件，在特定时间窗口内替换临时文件，从而覆盖系统上的任意文件。该漏洞需要本地访问权限且利用复杂度较高，攻击成功后仅影响文件完整性，不涉及机密性和可用性。受影响的 Samba 版本包括 2.2.8 之前的所有版本。"
published = "2003-03-31T05:00:00Z"
remediation = "升级 Samba 至 2.2.8 或更高版本。各发行版用户安装对应安全更新：Debian 安装 DSA-262 补丁，Red Hat 安装 RHSA-2003:095/096 更新。如无法立即升级，可在 smb.conf 中配置 hosts allow 限制访问来源，或在防火墙层面阻断 TCP 139/445 端口的非授权访问作为临时缓解措施。"
score = 1.2
severity = "LOW"
sources = ["redhat"]
title = "Samba 竞争条件导致本地任意文件覆盖漏洞"
updated = "2026-06-16T22:01:29Z"

