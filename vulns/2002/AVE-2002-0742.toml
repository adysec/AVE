[basic]
description = "PHP-Nuke 是一款流行的开源内容管理系统，其附加组件 PHPToNuke.php 1.0 版本中存在跨站脚本（XSS）漏洞。攻击者可通过向 `phptonuke.php` 脚本的 `filnavn` 参数注入任意 Web 脚本或 HTML 代码，当管理员或其他用户访问包含恶意脚本的页面时，脚本将在其浏览器中执行，从而窃取会话Cookie、重定向用户至恶意网站或篡改页面内容。该漏洞影响所有使用 PHPToNuke 附加组件的 PHP-Nuke 站点，攻击条件为攻击者能够向目标站点发送包含恶意脚本的请求并诱使受害者访问。CVSS v2 评分为 4.3，危害等级为中等。"
published = "2002-12-31T05:00:00Z"
remediation = "建议立即停用 PHP-Nuke AddOn PHPToNuke.php 1.0 并迁移至现代 CMS 系统。如必须继续使用，需在 phptonuke.php 中对 filnavn 参数实施严格输入过滤（htmlspecialchars 编码输出、白名单校验），并在 Web 应用防火墙配置 XSS 防护规则拦截恶意脚本注入。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "PHP-Nuke PHPToNuke 跨站脚本漏洞"
updated = "2026-06-16T22:00:26Z"

