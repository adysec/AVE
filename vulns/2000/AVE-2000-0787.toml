[basic]
description = 'AOL Instant Messenger 4.3.2229之前版本存在缓冲区溢出漏洞，远程攻击者可通过向目标发送超长的"goim"命令触发该漏洞，导致任意代码执行。该漏洞影响AOL Instant Messenger 3.5.1856、4.0、4.1.2010、4.2.1193等多个版本，攻击者无需身份认证即可远程利用，CVSS评分7.5，危害等级高。'
published = "2001-01-09T05:00:00.000"
remediation = '立即升级 AOL Instant Messenger 至 4.3.2229 或更高版本，该版本已修复通过超长 "goim" 命令触发缓冲区溢出的漏洞。如无法升级，建议在防火墙处过滤 AIM 协议流量（TCP 5190 端口），并禁用客户端对 aim:// 协议处理器的自动调用以降低攻击面。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "AOL Instant Messenger 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:07.890"

