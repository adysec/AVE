[basic]
description = "uWSGI 在 2.0.17 之前版本中，当使用 --php-docroot 选项时未正确校验 DOCUMENT_ROOT 路径，导致存在目录遍历漏洞。未经身份认证的远程攻击者可通过向目标服务器发送特制的 HTTP 请求，利用路径穿越符（如 ../）绕过文档根目录限制，读取服务器上任意文件（如配置文件、源代码等），造成敏感信息泄露。该漏洞无需任何权限即可远程利用，攻击复杂度低，影响广泛部署的 uWSGI 应用服务器。"
published = "2018-02-26T22:29:00Z"
remediation = "升级 uWSGI 至 2.0.17 或更高版本，该版本已修复 --php-docroot 选项下 DOCUMENT_ROOT 路径校验不严导致的目录遍历漏洞。Debian 用户可参考 DSA-4142 通过 apt update && apt upgrade 获取安全更新。如无法立即升级，应避免使用 --php-docroot 参数，或通过 Web 服务器访问控制规则限制对敏感路径的访问。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "uWSGI PHP 目录遍历漏洞"
updated = "2026-06-17T02:03:13Z"

