[basic]
description = "DomainMOD 4.11.01 及更早版本在资产编辑页面的 IP 地址管理功能中存在存储型跨站脚本（XSS）漏洞。该漏洞源于 assets/edit/ip-address.php 文件对 ipid 参数的处理缺少充分的输入过滤与输出编码，攻击者可通过向该参数注入恶意 JavaScript 脚本，在目标用户浏览器中执行任意脚本代码，从而窃取会话 Cookie、执行越权操作或篡改页面内容。该漏洞利用无需身份认证前置条件之外的特殊权限，但需诱使已登录的管理员用户访问特制的恶意链接方可触发，攻击复杂度较低。CVSS 评分为 6.1，危害等级为中等，建议升级至修复版本并对 ipid 参数进行严格校验。"
published = "2018-11-09T19:29:00Z"
remediation = '''
` markers embedded. The validator says remediation is empty (probably because of the format issue - the field is a multiline string starting with `"""tags.已确认修复版本...` which is invalid TOML).

Wait, actually the issue is the current remediation field is malformed - it starts with `tags.已确认修复版本` which is a TOML key error (the `tags.` prefix). The validator flagged remediation as empty. I need to output just the field value between <value>...
'''
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "DomainMOD 跨站脚本漏洞"
