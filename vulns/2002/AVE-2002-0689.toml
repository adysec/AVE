[basic]
description = "sendform.cgi 1.44 及更早版本存在目录遍历漏洞。未经身份认证的远程攻击者可以通过向 BlurbFilePath 参数传递包含目录遍历序列的文件路径，从而读取服务器上的任意文件内容。该漏洞影响部署了 sendform.cgi 脚本的 Web 服务器，攻击者无需任何凭据即可在存在该脚本的服务器上执行任意文件读取操作，可能导致敏感配置文件、源代码或系统文件泄露。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 sendform.cgi 至 1.45 或更高版本，该版本已修复 BlurbFilePath 参数中的目录遍历漏洞。如暂无法升级，可在 Web 服务器配置中禁用 sendform.cgi 脚本执行权限，或通过文件系统权限限制脚本对敏感目录的访问。临时缓解措施还包括在防火墙或 WAF 规则中拦截包含 ../ 或 %2e%2e%2f 等目录穿越字符的请求。"
score = 6.4
severity = "MEDIUM"
sources = ["tenable"]
title = "开源 sendform.cgi 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:57:59Z"

