[basic]
description = "SquirrelMail 1.2.3 之前版本的 read_body.php 存在跨站脚本（XSS）漏洞。远程攻击者可通过在 IMG 标签中嵌入 javascript: 协议的 URL，在用户浏览邮件时触发恶意 JavaScript 代码执行。攻击者无需身份认证，仅需向目标用户发送包含恶意构造 HTML 内容的邮件即可完成攻击。该漏洞可导致会话劫持、敏感信息窃取等危害，影响所有运行 SquirrelMail 1.2.3 之前版本的服务器。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 SquirrelMail 至 1.2.3 或更高版本，该版本修复了 read_body.php 中对 IMG 标签中 javascript: URL 的过滤缺失问题。如无法升级，可在 Web 服务器层（如 Apache/Nginx）配置输入过滤规则，拦截包含 `javascript:` 协议的请求参数。"
score = 4.3
severity = "MEDIUM"
sources = ["redhat"]
title = "SquirrelMail SquirrelMail 跨站脚本漏洞"
updated = "2026-06-16T21:59:43Z"

