[basic]
description = ".NET 运行时存在堆缓冲区溢出漏洞（CWE-122），攻击者可通过诱导用户打开特制文件或访问恶意服务器触发该漏洞，在目标系统上实现远程代码执行。该漏洞影响 .NET 9.0 及之前版本，攻击复杂度较高且需要用户交互，但成功利用后可完全控制受影响系统，造成机密性、完整性和可用性全面受损。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:30Z"
remediation = "该漏洞无有效缓解因素，必须通过升级修复。建议将所有 .NET 9.0 运行时和 SDK 升级到 9.0.1（SDK 9.0.100）：先运行 `dotnet --info` 确认当前版本，然后从 https://dotnet.microsoft.com/download/dotnet-core/9.0 下载安装 .NET 9.0.1 Runtime 或 9.0.100 SDK，安装后重启全部应用使更新生效；使用 Visual Studio 的开发者应一并更新 Visual Studio 以同步升级 .NET SDK。若项目通过 NuGet 引用受影响的 Microsoft.NetCore.App.Runtime.* 系列包，请将包引用更新到 9.0.1。已发布为自包含（self-contained）部署的应用同样受影响，必须用修复后的运行时重新编译并重新部署。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft .NET 远程代码执行漏洞"
updated = "2026-06-17T08:42:41Z"

