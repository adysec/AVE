[basic]
description = "BEA Systems WebLogic Express 和 WebLogic Server 5.1 SP1 至 SP6 版本存在访问控制绕过漏洞。该漏洞源于服务器对 URL 路径未进行充分规范化处理，未经身份认证的远程攻击者可通过在受限 JSP 页面或 Servlet 资源的 URL 中插入多个连续正斜杠（//）字符，绕过访问控制机制直接访问受保护的资源页面。该漏洞影响运行 WebLogic 5.1 SP1-SP6 的所有实例，攻击者无需凭据即可在无需任何交互的情况下远程利用，成功利用后可获取受限页面的敏感信息或执行未授权操作，CVSS v3 评分为 7.5（HIGH），危害等级较高。"
published = "2000-12-31T05:00:00Z"
remediation = "建议将 WebLogic Server 5.1 SP1-SP6 或 WebLogic Express 5.1 SP1-SP6 升级至 WebLogic Server 5.1 SP7 或 WebLogic Express 5.1 SP7。升级前请先从 BEA 官方 FTP (ftp://ftpna.bea.com/pub/releases/patches/SecurityBEA00-0600.zip) 下载安全补丁 SecurityBEA00-0600 并按 BEA 官方文档完成安装。如暂无法升级，可在 WebLogic 前端 Web 服务器（如 Apache/IIS）的 URL 重写规则中配置将包含多个连续正斜杠的请求统一标准化为单个斜杠，或通过防火墙限制对受保护 JSP/servlet 路径的间接访问，以临时缓解漏洞利用风险。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "BEA Systems WebLogic Server 访问控制绕过漏洞"
updated = "2026-06-16T21:53:26Z"

