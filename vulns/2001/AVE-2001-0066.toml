[basic]
description = "CVE-2001-0172是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-03-26T05:00:00Z"
remediation = "升级 SuSE Linux 7.0 的内核包至修复了 ReiserFS 缓冲区溢出问题的版本（如 SuSE-SA:2001:006 公告对应的内核更新包），或手动应用 reiserfs 模块补丁以修复长目录名处理时的栈缓冲区溢出。如无法立即升级，可临时通过 umount 卸载所有 ReiserFS 分区并挂载为只读，防止本地用户利用长目录名触发内核崩溃或代码执行；同时限制本地用户对 ReiserFS 文件系统的写入权限，仅允许受信任账户创建目录，并在 /etc/fstab 中将 reiserfs 分区挂载选项加上 nosuid 和 nodev 以降低提权风险。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "SuSE Linux ReiserFS 3.5.28 缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:53:48Z"

