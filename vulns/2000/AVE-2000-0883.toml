[basic]
description = 'Worm HTTP 服务器存在目录遍历漏洞，远程攻击者可通过构造包含 ".." (点点) 序列的 HTTP 请求路径，绕过 Web 根目录限制，遍历服务器文件系统读取任意敏感文件（如系统配置文件、源代码、密码文件等）。该漏洞源于 Worm HTTP 服务器对用户提交的路径参数缺乏规范化校验与边界检查，攻击者无需身份认证即可远程利用，仅需向目标服务器发送包含目录遍历序列的 HTTP GET 请求即可实现任意文件读取。该漏洞影响 Worm HTTP 服务器相关版本，CVSS 评分 5.0 (AV:N/AC:L/Au:N/C:P/I:N/A:N)，属于中危信息泄露漏洞，攻击复杂度低、无需认证、仅影响机密性。攻击者可利用此漏洞获取服务器敏感配置、源代码或系统文件，进而辅助进一步渗透攻击。建议升级至修复版本或在 Web 服务器层面配置路径规范化与访问控制策略进行缓解。'
published = "2000-10-20T04:00:00Z"
remediation = "建议立即升级至修复目录遍历漏洞的 Worm HTTP Server 修补版本（如 1.0.1 及以上），或迁移至 Apache/Nginx 等现代 Web 服务器。若无法升级，可在 Web 服务器前部署 WAF 规则拦截包含 ../ 等路径遍历字符的请求，同时配置 Web 服务器根目录限制（chroot/jail）限制文件系统访问范围，并禁用目录浏览功能。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Worm HTTP Server 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:52:21Z"

