[basic]
description = "PHP 的 DOM 和 SimpleXML 扩展在通过 libxml 流请求 HTTP 资源时，当目标资源发生重定向（redirect），会使用错误的内容类型（Content-Type）头来确定返回文档的字符编码。这导致解析器使用错误的字符集解析文档，可能造成 XML/HTML 文档被错误解析，从而绕过安全验证机制。攻击者可通过构造特制的重定向响应，诱导 PHP 应用错误解析文档内容，绕过输入验证或安全策略。该漏洞影响 PHP 8.1.32 之前、8.2.28 之前、8.3.19 之前及 8.4.5 之前的多个版本，CVSS 评分 6.3，危害等级中危。"
published = "2025-03-30T06:15:13Z"
remediation = "建议立即将 PHP 升级至 8.1.32、8.2.28、8.3.19 或 8.4.5 及以上版本。如使用源码编译，可从 php.net 下载最新版本重新编译安装；如使用包管理器，CentOS/RHEL 执行 `yum update php`，Ubuntu/Debian 执行 `apt update && apt upgrade php`。若无法立即升级，可在应用层对 HTTP 重定向响应手动校验 Content-Type 头部的 charset 参数，拒绝非预期的字符集声明。"
score = 6.3
severity = "MEDIUM"
sources = ["msrc"]
title = "PHP libxml DOM 和 SimpleXML 扩展 HTTP 重定向时内容类型标头处理不当漏洞"
updated = "2026-06-17T08:38:37Z"

