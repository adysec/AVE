[basic]
description = "Adobe Flash Player 10.3.183.5之前版本（Windows/Mac OS X/Linux/Solaris）及10.3.186.3之前版本（Android）存在同源策略绕过漏洞。远程攻击者可通过特制SWF文件触发该跨站信息泄露漏洞，绕过同源策略限制，获取目标站点敏感信息。攻击无需用户认证，仅需诱使用户访问恶意构造的Flash内容即可触发。Adobe AIR 2.7.1之前版本同样受影响。"
published = "2011-08-10T22:55:00Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.5 及以上版本（Windows/Mac/Linux/Solaris），Android 平台升级至 10.3.186.3 及以上版本；同时升级 Adobe AIR 至 2.7.1 及以上版本（Windows/Mac）或 2.7.1.1961 及以上版本（Android）。如无法升级，可在浏览器中禁用 Flash 插件或启用 click-to-play 机制作为临时缓解措施。"
score = 6.4
severity = "MEDIUM"
sources = ["tenable"]
title = "Adobe Flash Player 同源策略绕过漏洞"
updated = "2026-06-16T23:30:46Z"

