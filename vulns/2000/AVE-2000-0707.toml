[basic]
description = "iMesh 1.02 版本存在缓冲区溢出漏洞，由于对 iMesh 端口接收的数据长度缺乏边界检查，远程未认证攻击者可向目标端口发送超长字符串触发栈缓冲区溢出，进而覆盖返回地址实现远程任意代码执行。该漏洞影响 iMesh 1.02 版本，CVSS 评分 7.5（HIGH），攻击向量为网络远程、攻击复杂度低、无需认证即可触发，成功利用可导致目标系统机密性、完整性和可用性部分受损。攻击者仅需向目标主机的 iMesh 服务端口发送精心构造的超长数据包即可触发漏洞，无需用户交互即可实现远程代码执行。官方已停止维护，建议停用该软件或升级到修复版本。"
published = "2000-06-29T04:00:00.000"
remediation = "建议立即卸载 iMesh 1.02 及更早版本，该软件已长期停止维护且无官方补丁。如无法卸载，请在防火墙层面封锁 iMesh 服务端口（默认 TCP 端口），并禁用该应用程序的网络访问权限作为临时缓解措施。建议迁移至现代、仍在维护的 P2P 客户端或合法流媒体服务。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "iMesh imesh 缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:52:05.000"

