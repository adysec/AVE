[basic]
description = "Mozilla Firefox 4.x至11.0、Firefox ESR 10.x至10.0.4之前、Thunderbird 5.0至11.0、Thunderbird ESR 10.x至10.0.4之前以及SeaMonkey 2.9之前版本的docshell实现中存在跨站脚本（XSS）漏洞。远程攻击者可通过构造特制的页面加载请求，利用短路径页面加载（short-circuited page loads）机制绕过同源策略，在用户浏览器中注入并执行任意Web脚本或HTML代码，导致敏感信息泄露、会话劫持或钓鱼攻击。该漏洞属于通用型XSS（UXSS），攻击者只需诱使用户访问恶意页面即可触发，无需其他认证条件。"
published = "2012-04-25T10:10:17Z"
remediation = "升级 Mozilla Firefox 至 12.0 及以上版本，Firefox ESR 升级至 10.0.4 及以上版本，Thunderbird 升级至 12.0 及以上版本，Thunderbird ESR 升级至 10.0.4 及以上版本，SeaMonkey 升级至 2.9 及以上版本。无法立即升级时，可在浏览器中禁用 JavaScript 并启用 NoScript 等扩展作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox docshell 通用跨站脚本漏洞"
updated = "2026-06-16T23:37:22Z"

