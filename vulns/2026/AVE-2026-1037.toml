[basic]
description = "Craft CMS 的 FieldsController::actionRenderCardPreview() 方法存在行为注入远程代码执行漏洞。该方法将 fieldLayoutConfig POST 参数直接传递给 Fields::createLayout()，未调用 Component::cleanseConfig() 进行清理，导致攻击者可通过在配置数组中注入带 on 前缀的事件处理键（如 on init）触发 Yii2 事件机制，进而执行任意 PHP 代码并可能获取服务器敏感信息（如数据库凭据和 CRAFT_SECURITY_KEY）。该漏洞与已修复的 GHSA-4484-8v2f-5748、GHSA-qx2q-q59v-wf3j 及 GHSA-2fph-6v5w-89hh 属于同一漏洞模式。攻击者需具备 Craft CMS 控制面板管理员权限，且 allowAdminChanges 配置需启用，通过向 /admin/actions/fields/render-card-preview 发送构造的 POST 请求即可利用该漏洞，漏洞影响 Craft CMS 的受影响版本，CVSSv3.1 评分 5.0（中危）。官方已在修复版本中通过添加 cleanseConfig() 调用阻断该攻击链。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Pixel & Tonic Craft CMS Yii2 事件注入远程代码执行漏洞"
