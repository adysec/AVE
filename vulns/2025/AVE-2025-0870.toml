[basic]
description = "Windows Telephony Service（电话服务API，TAPI）存在堆缓冲区溢出漏洞（CWE-122），由于服务在处理特制RPC请求时未正确验证输入数据长度，导致堆内存越界写入。远程攻击者可通过向目标系统发送精心构造的RPC消息触发该漏洞，成功利用可在目标系统上以SYSTEM权限执行任意代码。攻击者需诱导用户连接到恶意RPC服务器或触发特定操作（需用户交互），无需身份认证即可发起攻击。该漏洞影响Windows 10、Windows 11及Windows Server 2019/2022等多个版本，CVSS评分8.8，危害等级高。Microsoft已在2025年1月安全更新（补丁编号5049981/5049983/5049984/5050004/5050021）中修复此漏洞。"
published = "2025-01-14T18:16:04Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 KB5049984（Windows Server 2022/Windows 11 21H2）或对应版本的累积更新，通过 Windows Update 自动获取。如无法立即打补丁，可在组策略中禁用 Telephony 服务（TapiSrv）并将远程过程调用（RPC）访问限制在受信任网络段内作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:43:17Z"

