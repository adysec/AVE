[basic]
description = "Microsoft SQL Server 2000 及 SQL Server Desktop Engine (MSDE) 中的 xp_proxiedmetadata 函数在调用 SQL Server 扩展存储过程 API 中的 srv_paraminfo 函数之前，未能正确限制缓冲区长度。攻击者可利用此缺陷发送特制的参数数据，触发缓冲区溢出，从而造成拒绝服务或执行任意命令。该漏洞影响 SQL Server 2000 和 MSDE 所有版本，无需身份认证即可利用，CVSS 评分为 4.6，危害等级较低。"
published = "2001-01-09T05:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-092 补丁（KB Q280380）。SQL Server 2000 用户升级至 SQL Server 2000 SP1，SQL Server 7.0 用户升级至 SQL Server 7.0 SP3，或直接下载并安装 MS00-092 补丁。补丁通过确保所有扩展存储过程在调用 srv_paraminfo() 前分配足够大小的缓冲区来修复缓冲区溢出问题。安装后重启 SQL Server 服务以生效。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft SQL Server 扩展存储过程参数解析缓冲区溢出漏洞"
updated = "2026-06-16T21:53:07.320"

