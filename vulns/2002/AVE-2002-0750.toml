[basic]
description = 'BrowseFTP 1.62 FTP 客户端存在基于栈的缓冲区溢出漏洞。当用户使用 BrowseFTP 客户端连接远程 FTP 服务器时，若该服务器返回超长的 FTP "220" 欢迎消息，客户端程序未能对消息长度进行充分校验，导致栈缓冲区溢出。未经身份认证的远程攻击者可通过构造恶意的 FTP 服务器，向 BrowseFTP 客户端发送包含超长 220 响应消息的数据包触发该溢出，从而在客户端机器上执行任意代码，完全控制用户主机。该漏洞影响运行 Windows 操作系统的 BrowseFTP 1.62 客户端，攻击者还可利用此漏洞导致客户端程序崩溃。公开漏洞利用代码已由安全研究员 Kanatoko 在 ExploitDB（EDB-21201）上发布，利用门槛较低，危害严重。'
published = "2002-12-31T05:00:00Z"
remediation = "BrowseFTP 1.62 已停止维护且未发布修复版本，建议立即卸载该软件并替换为 FileZilla、WinSCP 等主流 FTP 客户端。如短期内无法替换，应通过防火墙规则限制 BrowseFTP 仅连接可信的内部 FTP 服务器，禁止其访问外部未知 FTP 服务，并监控网络异常连接行为作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "BrowseFTP Client 1.62 远程缓冲区溢出漏洞"
updated = "2026-06-16T22:00:30Z"

