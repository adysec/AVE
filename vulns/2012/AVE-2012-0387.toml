[basic]
description = 'Apple Safari 6.0.1 之前版本的 Form Autofill 功能存在逻辑错误，未将自动填充字段严格限制在 Autofill 弹出窗口所包含的字段集合内。远程攻击者可构造恶意网页，诱使用户在 Safari 中访问，从而获取 Address Book 通讯录中未包含在自动填充弹出窗口内的"Me"卡片敏感信息。该漏洞影响所有使用 Safari 6.0 及以下版本的 macOS 和 iOS 用户，攻击无需身份认证，攻击复杂度中等，CVSS 评分 4.3。'
published = "2012-09-20T21:55:02Z"
remediation = "升级 Safari 至 6.0.1 或更高版本；对于 OS X Lion 系统请升级至 OS X Lion v10.7.5，对于 OS X Mountain Lion 系统请升级至 OS X Mountain Lion v10.8.2（随附 Safari 6.0.1）。临时缓解措施：在 Safari 偏好设置-自动填充中关闭表单自动填充功能，避免在不可信网站上使用自动填充。也可通过软件更新功能安装 Apple 2012 年 9 月发布的安全更新。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "苹果 Safari 自动填充信息泄露漏洞"
updated = "2026-06-16T23:43:47Z"

