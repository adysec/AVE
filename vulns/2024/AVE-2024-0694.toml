[basic]
description = "Linux 内核 JFS 文件系统在 `jfs_truncate_nolock()` 函数中缺少对只读模式的检查，当文件系统以只读方式挂载时执行截断操作，会因日志指针（log）为空而触发空指针解引用，导致内核崩溃引发拒绝服务。本地低权限攻击者可通过挂载只读 JFS 文件系统并触发特定文件操作来利用此漏洞，影响使用 JFS 的 Linux 内核各发行版本。该漏洞 CVSS 评分 5.5，危害等级中等。"
published = "2025-04-16T15:15:53Z"
remediation = "立即更新 Linux 内核至 6.14.2 或更高版本（含 6.15+），该漏洞已在提交 f605bc3e162f 和 b5799dd77054 中修复。Ubuntu 25.04 用户应安装 USN-7594-1 更新（linux-image-6.14.0-22-generic 6.14.0-22.22）。其他发行版请参照各自厂商公告更新内核包。如无法立即更新，可通过限制本地用户对 JFS 文件系统的写入权限作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux JFS 文件系统只读截断检查缺失漏洞"
updated = "2026-06-17T08:14:37Z"

