[basic]
description = "PostgreSQL 7.2.2 之前版本的日期解析器存在缓冲区溢出漏洞，攻击者通过向目标系统提交超长日期字符串（datetime 输入），可触发缓冲区溢出，导致数据库服务拒绝服务，在特定条件下可能执行任意代码。该漏洞需要本地或低权限访问，攻击复杂度较低，成功利用后可获取目标系统的部分机密性、完整性和可用性。建议升级至 PostgreSQL 7.2.2 或更高版本以修复此漏洞。"
published = "2003-01-17T05:00:00Z"
remediation = "升级 PostgreSQL 至 7.2.2 或更高版本，该版本已修复 date parser 中处理超长日期字符串时的缓冲区溢出问题。如无法立即升级，可在应用层对日期输入做长度校验，限制日期字符串不超过 32 字节。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "PostgreSQL 日期解析器缓冲区溢出漏洞"
updated = "2026-06-16T21:59:15Z"

