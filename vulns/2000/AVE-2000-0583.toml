[basic]
description = "RobTex Viking Server 1.0.6 Build 355 及之前版本存在缓冲区溢出漏洞。远程攻击者无需身份认证即可通过发送超长的 HTTP GET 请求，或构造过长的 Unless-Modified-Since、If-Range、If-Modified-Since 请求头，触发服务器缓冲区溢出，从而造成拒绝服务或执行任意命令。该漏洞影响运行 RobTex Viking Server 1.0.6 Build 355 及之前版本的所有服务器，CVSS 评分为 7.5，危害等级较高。"
published = "2000-10-20T04:00:00Z"
remediation = "升级 RobTex Viking Server 至 1.0.6 Build 370 或更高版本。Build 370 是官方首个修复此缓冲区溢出漏洞的版本，消除了 HTTP GET 请求及 Unless-Modified-Since、If-Range、If-Modified-Since 等头部字段的越界写入问题。如无法立即升级，临时措施为在防火墙或反向代理层对 HTTP 请求行及上述头部的长度进行限制，拒绝超长请求，并尽量将 Viking Server 仅对内网暴露，减少远程攻击面。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "RobTex Viking Server 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:27Z"

