[basic]
description = 'DomainMOD 4.11.01 版本中的 assets/add/category.php 页面存在跨站脚本（XSS）漏洞。具有管理员权限的攻击者可在"分类名称"（Category Name）或"利益相关者"（Stakeholder）字段中注入恶意脚本代码，当其他管理员访问受影响页面时脚本自动执行，导致敏感信息泄露或会话劫持。该漏洞需高权限用户交互触发，CVSS 评分 4.8，危害等级中危。'
published = "2018-12-10T09:29:00Z"
remediation = "升级 DomainMOD 至 4.12.0 或更高版本，该版本已对 category.php 中 Category Name 和 Stakeholder 字段进行输入转义处理。如无法立即升级，可在 Web 服务器（如 Apache/Nginx）层面添加 WAF 规则，拦截包含 `<script>`、`onerror=` 等 XSS 载荷的 POST 请求到 `/assets/add/category.php` 路径，同时启用 Content-Security-Policy 响应头限制内联脚本执行。"
score = 4.8
severity = "MEDIUM"
sources = ["nuclei"]
title = "DomainMOD 4.11.01 assets/add/category.php 跨站脚本攻击"
updated = "2026-06-17T01:52:09Z"

