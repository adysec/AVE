[basic]
description = "Multisoft FlagShip 4.4 安装权限漏洞：FlagShip 软件包中的 FSserial、FlagShip_c 和 FlagShip_p 程序被设置为全局可写权限，本地攻击者可利用该缺陷将恶意木马程序替换这些可执行文件，从而在目标系统上以受影响用户的权限执行任意代码。攻击者需要拥有本地系统访问权限，利用难度较高，但成功利用后可完全控制受影响系统。建议用户立即修复文件权限设置。"
published = "2000-10-20T04:00:00.000"
remediation = '立即以 root 身份执行 `chmod 755 /usr/bin/FSserial /usr/bin/FlagShip_c /usr/bin/FlagShip_p` 移除全局可写权限，仅保留所有者读写执行权限。同时检查系统内其他 FlagShip 相关二进制文件权限，确保无类似配置缺陷。建议使用 `find / -type f -perm -o+w -exec ls -la {} \;` 定期扫描全局可写文件，防止被植入木马。'
score = 6.2
severity = "MEDIUM"
sources = ["epss"]
title = "Multisoft FlagShip 4.4 本地权限提升漏洞"
updated = "2026-06-16T21:52:20.517"

