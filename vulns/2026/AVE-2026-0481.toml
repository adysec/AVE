[basic]
description = "Autel MaxiCharger AC Elite Home 电动汽车充电桩的 USB 接口存在认证绕过漏洞。该设备暴露的 USB 接口在访问功能前未进行身份验证，物理接触攻击者可通过连接 USB 设备直接绕过系统认证机制，获取设备管理权限。该漏洞影响 Autel MaxiCharger AC Elite Home 系列产品，CVSS 评分 4.3，危害等级中危。攻击者需物理接触目标设备方可利用，无需任何认证。厂商已在固件版本 V1.40.81 中修复此漏洞。"
published = "2026-01-01T00:00:00Z"
remediation = "立即将 Autel MaxiCharger AC Elite Home 的固件升级至 V1.40.81 或更高版本。升级路径：通过设备管理界面或 Autel 官方应用检查并安装固件更新。如无法立即升级，应限制对充电桩 USB 接口的物理访问，将设备部署在受控区域，防止未授权人员接触 USB 端口。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "Autel MaxiCharger AC Elite Home USB认证绕过漏洞"
updated = "2026-01-01T00:00:00Z"

