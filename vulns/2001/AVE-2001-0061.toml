[basic]
description = "AT&T WinVNC（Virtual Network Computing）客户端 3.3.3r7 及更早版本存在缓冲区溢出漏洞。远程攻击者可搭建恶意 VNC 服务器，当目标客户端连接该服务器时，服务器发送特制的 RFB 协议连接失败数据包（rfbConnFailed），并在其中携带超长的原因字符串（reason string）。客户端在处理该数据包时未对字符串长度进行充分边界检查，导致栈缓冲区溢出。成功利用该漏洞可在目标系统上执行任意代码，且无需身份认证。该漏洞影响 RealVNC 3.3.7 及以下版本，攻击条件要求目标客户端主动连接到攻击者控制的恶意 VNC 服务器，利用复杂度较高但危害严重，可完全破坏目标系统的机密性、完整性和可用性。"
published = "2001-05-03T04:00:00.000"
remediation = "升级到 RealVNC/WinVNC 3.3.7 或更高版本，该版本已修复 `_vstprintf` 调用中未限制缓冲区长度的缺陷。对于无法立即升级的系统，可临时采取以下缓解措施：在防火墙中限制对 VNC 客户端发起主动连接的外部 IP，避免客户端连接到不可信服务器；或修改源码中 `vncviewer/vnc_winsrc/Log.cpp` 文件，将 `_vstprintf(line, format, ap)` 替换为 `_vsntprintf(line, sizeof(line) - sizeof(TCHAR), format, ap)` 以限制字符串写入长度，重新编译后部署。"
score = 7.6
severity = "HIGH"
sources = ["cve"]
title = "AT&T WinVNC 客户端缓冲区溢出漏洞"
updated = "2026-06-16T21:53:47.753"

