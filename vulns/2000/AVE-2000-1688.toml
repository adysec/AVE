[basic]
description = "WatchGuard SOHO 防火墙的 HTTP 服务器在访问控制方面存在严重漏洞，无法正确限制对管理功能的访问权限，例如密码重置或系统重启等操作。攻击者可通过网络发起请求，未经授权地访问这些管理员功能，从而导致系统拒绝服务或执行未经授权的操作。该漏洞影响范围广泛，由于攻击者无需任何权限即可利用，且可以获取完全控制权和数据访问权限，因此其危害非常严重。CVSS 评分达到 10.0，表明该漏洞的危险程度极高。这类漏洞的存在，严重威胁了防火墙的安全性，可能导致整个网络架构暴露在攻击者的掌控之下。"
published = "2001-02-12T05:00:00.000"
remediation = "立即将 WatchGuard SOHO 防火墙升级至当前在售的 WatchGuard Firebox 系列运行最新版 Fireware 操作系统，彻底消除旧版固件未作认证绑定的 HTTP 管理接口漏洞。如无法立即更换硬件，应暂时通过接口级访问控制列表将管理界面的 HTTPS（443 端口）访问来源限制为可信管理网段内指定 IP，关闭一切不必要的外部管理监听端口，并在 WatchGuard System Manager 中启用强密码策略、设置会话超时及登录失败锁定机制，以阻断未经授权的远程管理访问路径。同时建议将此防火墙纳入 WatchGuard Cloud 持续监控管理流量的异常登录行为。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "WatchGuard SOHO 防火墙管理功能访问控制漏洞"
updated = "2026-06-16T21:52:41.627"

