[basic]
description = "Solaris AnswerBook2 的 dwhttpd Web 服务器管理接口未对 CGI 脚本进行正确的身份验证检查，远程攻击者无需认证即可直接调用 /cgi-bin/admin/admin 脚本，通过构造特定参数（如 command=add_user）添加管理账户，从而获取管理界面访问权限。该漏洞允许攻击者读取日志文件、管理内容，影响 Solaris 系统上 AnswerBook2 1.4.4 及之前版本，CVSS 评分 7.5，危害等级高。"
published = "2000-10-20T04:00:00Z"
remediation = "立即安装 Sun 安全公告 #00196 提供的补丁：SPARC 平台安装 110011-02，x86 平台安装 110012-02，并将 AnswerBook2 升级至 v1.4.2 或更高版本。如无法立即打补丁，可在防火墙层面限制对 8888 端口的访问，仅允许可信 IP 连接，并禁用 /cgi-bin/admin/admin CGI 脚本的执行权限作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Sun Solaris AnswerBook2 管理接口认证绕过漏洞"
updated = "2026-06-16T21:52:17Z"

