[info]
author = "ave"
description = "crontab predictable temp file allows local users to inject cron jobs"
id = "POC-AVE-2000-0793"
name = "PoC for AVE-2000-0793"
severity = "medium"
tags = ["ave-2000-0793"]
vuln_id = [
    "CVE-2000-1096",
    "AVE-2000-0793",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/var/spool/cron"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["cron"]
