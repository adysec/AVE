[basic]
description = '''ASUS GT-AC2900 和 Lyra Mini 无线路由器的管理员应用程序在处理未经身份验证用户的远程输入时存在认证绕过漏洞。该漏洞源于 router/httpd/httpd.c 中的 handle_request 函数以及 web_hook.o 中的 auth_check 函数未正确校验空字符输入，攻击者可通过发送包含特制空字符（'\0'）值的请求，使其与设备默认值匹配，从而绕过身份验证机制，未授权访问路由器管理界面。该漏洞影响 GT-AC2900 固件版本 3.0.0.4.386.42643 之前以及 Lyra Mini 固件版本 3.0.0.4_384_46630 之前的所有版本，包括已停止支持的 EOL 版本。攻击者无需身份认证即可远程利用此漏洞，在启用 WAN 远程访问的情况下，可通过互联网直接发起攻击，获取管理员权限后完全控制路由器配置、窃取网络流量或进一步攻击内网设备。CVSS 评分为 9.8，危害等级严重。'''
published = "2021-05-06T15:15:07Z"
remediation = "立即将 ASUS GT-AC2900 路由器升级至固件版本 3.0.0.4.386_42643 或更高版本，将 ASUS Lyra Mini 升级至固件版本 3.0.0.4_384_46630 或更高版本，以修复认证绕过漏洞。如暂无法升级，请在路由器管理界面的「外部网络 (WAN)」设置中禁用远程访问功能，或通过防火墙规则限制 WAN 侧对管理端口的访问，作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "华硕 GT-AC2900 身份验证绕过漏洞"
updated = "2026-06-17T03:52:42Z"

