[basic]
description = "QNX Voyager Web 服务器 2.01B（包含在 QNX 4.05 演示盘中）的 Embedded Resource Manager 存在信息泄露漏洞。由于 `embedded.html` 页面未对访问权限进行有效限制，远程攻击者无需身份验证，仅需通过 Web 浏览器访问该特定页面，即可读取到系统的敏感统计信息。该漏洞影响部署了此特定版本 Web 服务器的 QNX 4.05 系统，可能导致系统内部运行状态及敏感配置信息泄露。"
published = "2000-12-19T05:00:00.000"
remediation = "建议停止在生产环境中使用 QNX 4.05 演示版中的 Voyager Webserver 2.01B。若必须运行，应在 Web 服务器配置中删除或限制对 embedded.html 页面的访问权限，或通过防火墙阻断外部对该服务端口的访问以防止敏感系统统计信息泄露。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "QNX Voyager Webserver 敏感信息泄露漏洞"
updated = "2026-06-16T21:52:43.980"

