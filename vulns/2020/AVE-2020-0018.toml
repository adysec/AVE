[basic]
description = "Cisco IOS XR Software 的距离向量多播路由协议（DVMRP）功能存在内存耗尽漏洞。该漏洞源于对 Internet Group Management Protocol（IGMP）数据包的队列管理不足，未经身份认证的远程攻击者可通过向受影响设备发送特制的 IGMP 流量来消耗其进程内存。成功的利用可导致内存耗尽，进而引发其他进程的不稳定，这些进程可能包括但不限于内部和外部路由协议。该漏洞影响运行受影响 IOS XR 软件版本的 Cisco 设备，CVSS v3.1 评分为 8.6，危害等级为高。"
published = "2020-08-29T16:15:09.797"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
score = 8.6
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS XR Software DVMRP 内存耗尽漏洞"
updated = "2026-06-17T03:18:36.940"

