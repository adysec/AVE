[basic]
description = "Ericsson-LG iPECS NMS 30M 网络管理系统存在路径遍历漏洞，攻击者无需身份认证即可通过向 `/ipecs-cm/download?filename=../` 接口发送特制的 URL 请求，利用 `../` 路径穿越符读取服务器上的任意文件，导致敏感信息泄露。该漏洞影响 iPECS NMS 30M 版本，CVSS 评分 7.5，危害等级高。攻击者只需网络可达即可远程利用，无需任何权限或用户交互。"
published = "2018-08-15T17:29:00Z"
remediation = "立即将 Ericsson-LG iPECS NMS 30M 升级至不受影响的最新版本（如已停产则迁移至替代产品）。如无法升级，在反向代理或 WAF 层面添加规则，拦截对 /ipecs-cm/download?filename= 路径中包含 ../ 的请求；同时限制管理界面仅允许受信任内网 IP 访问，并禁用不必要的文件下载功能。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Ericsson-LG iPECS NMS 30M 路径遍历漏洞"
updated = "2026-06-17T01:42:06Z"

