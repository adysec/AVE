[basic]
description = "BeOS r5 pro 及更早版本中运行的 PostMaster 1.0 存在拒绝服务漏洞。该漏洞源于程序在处理请求消息时，未能对包含的 URL 长度进行严格校验，导致远程攻击者可以通过发送一个包含超长 URL 的特制消息触发崩溃。攻击者无需身份验证即可通过网络远程利用此漏洞，导致 PostMaster 服务中断并不可用，影响系统的可用性。"
published = "2001-01-09T05:00:00.000"
remediation = "由于 Postmaster 1.0 及 BeOS 平台已极其陈旧且无官方补丁，建议直接停止运行该服务。若必须使用，请在网络边界防火墙或反向代理中配置 URL 长度限制（如限制在 2048 字节以内），以拦截包含超长 URL 的恶意请求，防止触发拒绝服务攻击。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Kenny Carruthers Postmaster 1.0 (BeOS) URL 拒绝服务漏洞"
updated = "2026-06-16T21:53:16.270"

