[basic]
description = "Melange Chat System 2.0.2 Beta 2 存在多处缓冲区溢出漏洞，远程或本地攻击者可通过向聊天服务器发送超长数据触发该漏洞，导致服务器崩溃（拒绝服务）并可能进一步执行任意代码。漏洞成因在于程序对用户输入缺乏充分的边界检查，具体攻击路径包括：通过 `/yell` 命令传入超长参数、在 `/etc/melange.conf` 配置文件中写入超长行内容、以及通过超长文件名等方式均可触发溢出。该漏洞的利用条件简单，攻击者无需进行身份认证，攻击复杂度低，影响所有运行受影响版本 Melange Chat Server 的实例。由于该软件目前已停止官方支持，受影响系统无法获得官方补丁，建议管理员迁移至替代的聊天服务器软件。"
published = "2002-07-03T04:00:00Z"
remediation = "该漏洞存在于 Melange Chat System 2.02 的 /yell 命令及配置文件中，由于 Christian Walter 已停止对该软件的维护且不再提供补丁，建议立即停用 Melange Chat System，迁移至受持续维护的替代聊天服务器软件（如 IRCd 或现代即时通讯平台）。如短期内无法完成迁移，应在防火墙或访问控制设备上禁止外部网络访问 Melange Chat 服务端口，并对 melange.conf 配置文件中的长行内容实施输入校验与长度限制，以降低缓冲区溢出被利用的风险。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Melange Chat System 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:57:39Z"

