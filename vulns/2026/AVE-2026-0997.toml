[basic]
description = "Flowise 是一款用于构建自定义大语言模型流程的拖拽式用户界面，其 3.1.0 之前版本的 CSV_Agents 类中存在沙箱逃逸漏洞。该漏洞源于 CSV Agent 节点在评估 LLM 生成的 Python 脚本时缺乏适当的沙箱隔离机制，未经身份认证的远程攻击者可通过向使用 CSV Agent 节点的聊天流发送精心构造的提示词，利用提示注入技术诱导大语言模型生成恶意 Python 脚本，从而在 Flowise 服务器上执行任意系统命令。攻击者已可在 Flowise 3.1.2 版本上通过 Pyodide 代码注入获得 root 权限的 Meterpreter 反向 Shell，危害等级严重，CVSS 评分 9.2。建议升级至 3.1.0 或更高版本以修复此漏洞。"
published = "2026-04-23T20:16:14Z"
remediation = "立即升级 Flowise 到 3.1.0 或更高版本以修复此漏洞。如暂时无法升级，应禁用或删除所有使用 CSV Agent 节点的 chatflow，并通过防火墙或反向代理限制只有可信 IP 才能访问 Flowise 管理界面与 API，同时监控服务器是否存在异常 Python 进程或可疑出站连接。"
score = 9.2
severity = "CRITICAL"
sources = ["zdi"]
title = "Flowise CSV Agent 远程代码执行漏洞"
updated = "2026-06-17T10:46:24Z"

