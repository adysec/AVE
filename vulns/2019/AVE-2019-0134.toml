description = "CVE-2019-18393是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2019-10-24T11:15:10.513"
remediation = "升级到 Openfire 4.4.3 或更高版本以修复目录遍历漏洞。升级后，系统属性 plugins.servlet.allowLocalFileReading 默认值为 false，可阻止通过插件 Servlet 访问 Openfire 主目录之外的本地文件。如需临时缓解，可在防火墙层面限制对外部网络对 Openfire 管理端口的访问。"
