[basic]
description = 'Microsoft IIS 5.0 存在一个特殊 HTTP 请求头处理漏洞（"Specialized Header"），远程攻击者无需任何身份认证，只需向目标服务器发送一个包含 "Translate: f" 头的 HTTP GET 请求，即可绕过 IIS 的脚本引擎处理流程，导致服务器直接返回 .asp、.asa 及其他脚本文件的原始源代码而非执行结果。该漏洞可泄露数据库连接字符串、业务逻辑代码及管理员凭据等敏感信息，为后续攻击提供跳板。受影响版本为 Windows 2000 上运行的 IIS 5.0（未安装 SP1 的系统）。'
published = "2000-10-20T04:00:00.000"
remediation = '立即安装 Windows 2000 Service Pack 1（SP1）以彻底修复此漏洞，或安装 MS00-058 安全更新补丁（KB256888）。如无法升级，可在 IIS 管理器中禁用 .ASP 以外的脚本映射（如 .HTR、.IDQ 等不必要扩展），并在网络防火墙或 WAF 层面拦截包含 "Translate: f" 头部的 HTTP 请求作为临时缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft IIS 5.0 Translate:f 头源代码泄露漏洞"
updated = "2026-06-16T21:52:27.690"

