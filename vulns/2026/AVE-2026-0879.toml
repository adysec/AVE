[basic]
description = "MCP Python SDK（PyPI 包名 mcp）的已弃用 WebSocket 服务端传输（`mcp.server.websocket.websocket_server`）在建立 WebSocket 握手时未对 `Host` 和 `Origin` 头部进行任何校验，导致跨源 WebSocket 连接缺乏服务端验证机制。远程攻击者可诱导用户访问恶意网页，通过浏览器发起跨源 WebSocket 升级请求，与目标 MCP 服务器完成 `initialize` 握手后，枚举并调用服务器暴露的工具和资源，造成敏感信息泄露或未授权操作。该漏洞影响 1.28.1 之前的所有版本，CVSS 评分 7.6，危害等级高。"
published = "2026-07-15T21:16:55Z"
remediation = "升级 MCP Python SDK 至 1.28.1 或更高版本，并在调用 `websocket_server()` 时传入 `TransportSecuritySettings` 参数，设置 `enable_dns_rebinding_protection=True` 并配置 `allowed_hosts` / `allowed_origins` 白名单。建议迁移至 Streamable HTTP 传输方式，通过 `FastMCP` 自动启用来源验证保护。如无法升级，可在反向代理层（如 Nginx）添加 `Host` 和 `Origin` 头校验规则，拒绝非白名单来源的 WebSocket 握手请求。"
score = 7.6
severity = "HIGH"
sources = ["ghsa"]
title = "MCP Python SDK WebSocket 服务器传输缺少 Host/Origin 验证漏洞"
updated = "2026-07-17T18:07:38Z"

