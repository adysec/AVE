[basic]
description = "CUPS（Common UNIX Printing System）Internet Printing Protocol（IPP）实现在 1.1.19 之前版本中存在未知漏洞，远程攻击者可通过向目标系统的 IPP 端口（TCP 631）发送特制输入数据，触发无限循环（busy loop），导致 CPU 资源被大量消耗，造成拒绝服务。该漏洞影响 Easy Software Products 开发的 CUPS 1.1.18 及更早版本，CVSS v2 评分为 5.0（中等危害）。攻击者无需任何身份认证，只要能够通过网络访问目标系统的 IPP 端口即可发起攻击，利用方式简单且攻击条件要求极低。建议用户升级到 CUPS 1.1.19 或更高版本以消除此漏洞风险。"
published = "2003-12-01T05:00:00Z"
remediation = "标签之间。<value>立即将 CUPS 升级至 1.1.19 或更高版本，该版本已修复 IPP 实现中的 busy loop 拒绝服务漏洞。如暂无法升级，应在防火墙中配置规则仅允许可信 IP 访问 TCP 631 端口（IPP），或暂时禁用 IPP 服务以降低风险。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Easy Software Products CUPS IPP 拒绝服务漏洞"
updated = "2026-06-16T22:02:50Z"

