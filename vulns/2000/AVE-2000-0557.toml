[basic]
description = "IBM WebSphere Application Server 3.0.2 存在大小写处理不当的源代码泄露漏洞（CWE-178）。由于服务器在处理 JSP 文件请求时未正确区分文件扩展名的大小写，当攻击者使用大写的 .JSP 扩展名构造恶意 URL 发起请求时，服务器不会将请求转发给 JSP 引擎进行编译执行，而是直接将原始 JSP 源代码以纯文本形式返回给客户端。该漏洞影响运行在 IBM WebSphere 3.0.2 上的所有基于 JSP 的 Web 应用程序，攻击者无需任何身份认证即可远程利用。通过发送特制的包含大写扩展名的 URL，攻击者可获取 JSP 源文件内容，从而暴露应用程序中的数据库连接字符串、业务逻辑代码、硬编码凭证等敏感信息，进而为进一步攻击提供情报支持。该漏洞 CVSS v3.1 评分为 7.5（HIGH），攻击向量为网络，攻击复杂度低，无需权限和用户交互。"
published = "2000-06-08T04:00:00Z"
remediation = "建议立即升级 IBM WebSphere Application Server 至 3.0.2.1 版本或更高版本，或应用 IBM 发布的修复补丁包。若暂无法升级，可在 Web 服务器层面配置大小写不敏感的 JSP 扩展名映射，或在 Web 服务器/防火墙层面拦截大写 .JSP 后缀请求，防止 JSP 源代码泄露。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "IBM WebSphere server 源代码泄露漏洞"
updated = "2026-06-16T21:51:51Z"

