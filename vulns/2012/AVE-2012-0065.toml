[basic]
description = "Mozilla Firefox 4.x至11.0、Firefox ESR 10.x至10.0.4、Thunderbird 5.0至11.0、Thunderbird ESR 10.x至10.0.4及SeaMonkey 2.9之前版本存在地址栏欺骗漏洞。当用户通过HTTPS加载无效的RSS或Atom XML内容时，远程攻击者可利用该漏洞伪造地址栏显示，诱导用户访问恶意站点，导致钓鱼攻击。攻击者无需身份认证，通过社会工程学手段诱使用户点击恶意链接即可触发。该漏洞影响范围广泛，CVSS评分4.3，危害等级中危。"
published = "2012-04-25T10:10:17Z"
remediation = "升级 Mozilla Firefox 至 12.0 及以上版本，Firefox ESR 升级至 10.0.4 及以上版本；Thunderbird 升级至 12.0 及以上版本，Thunderbird ESR 升级至 10.0.4 及以上版本；SeaMonkey 升级至 2.9 及以上版本。无法立即升级时，建议禁用 RSS/Atom 自动加载功能或使用内容安全策略（CSP）限制外部资源加载作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 地址栏欺骗漏洞"
updated = "2026-06-16T23:37:22Z"

