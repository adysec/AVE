[basic]
description = 'Linux 内核 uprobes 子系统的 `uprobe_write_opcode()` 函数在处理共享零页（zeropage）时存在缺陷。当本地低权限用户通过 `userfaultfd` 的 `UFFDIO_ZEROPAGE` 操作将零页映射到进程地址空间，并利用 BPF uprobe 多链接功能触发 uprobe 断点写入时，内核 RSS 计数和页面引用计数会出现不一致，导致 "Bad page state" 和 "Bad rss-counter state" 错误，最终引发系统崩溃或内核 panic。该漏洞影响启用 uprobes 功能的 Linux 内核版本，攻击者需要本地访问权限，成功利用可造成拒绝服务。'
published = "2025-03-27T15:15:56Z"
remediation = "升级 Linux 内核至以下已修复版本之一：6.1.130、6.6.81、6.12.18、6.13.6 或 6.14 及以上版本。可通过系统包管理器执行更新，例如 Debian/Ubuntu 使用 apt install linux-image-$(uname -r) 安装最新内核包后重启系统。若暂时无法升级内核，可通过 sysctl 限制 bpf_uprobe_multi_link 的使用权限，仅允许特权用户加载 BPF uprobe 程序，以降低本地特权进程利用该漏洞触发内核崩溃的风险。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel uprobes 拒绝服务漏洞"
updated = "2026-06-17T08:44:31Z"

