[basic]
description = "Microsoft Internet Explorer 10/11 及 Microsoft Edge 浏览器的 mshtml.dll 中的 Layout::MultiColumnBoxBuilder::HandleColumnBreakOnColumnSpanningElement 函数存在类型混淆（Type Confusion）漏洞。远程攻击者可通过构造恶意的 CSS 令牌序列和操作 TH 元素的 JavaScript 代码，诱使用户访问特制网页触发该漏洞，成功利用后可实现远程代码执行，获取与当前用户相同的系统权限。该漏洞影响 Windows 7/8.1/10 及 Windows Server 2008/2012/2016 等平台，CVSS 评分 8.1，危害等级高。微软已于 2017 年 3 月安全更新中修复。"
published = "2017-02-26T23:59:00Z"
remediation = "立即安装 Microsoft 2017 年 3 月 Internet Explorer 累积安全更新 MS17-006（KB4013073）。Windows 7 SP1 用户安装 KB4012215（月度汇总）或 KB4012204（仅安全更新）；Windows 8.1 用户安装 KB4012216（月度汇总）或 KB4012204（仅安全更新）；Windows 10 用户安装 KB4012606（RTM）/KB4013198（1511）/KB4013429（1607）累积更新；Windows Server 2012 安装 KB4012217（月度汇总）或 KB4012204（仅安全更新）；Windows Server 2012 R2 安装 KB4012216（月度汇总）或 KB4012204（仅安全更新）；Windows Server 2016 安装 KB4013429 累积更新。如无法立即打补丁，可启用 Internet Explorer 增强安全配置（ESC）或使用 EMET 缓解工具降低风险。"
score = 8.1
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Internet Explorer/Edge 类型混淆远程代码执行漏洞"
updated = "2026-06-17T00:56:57Z"

