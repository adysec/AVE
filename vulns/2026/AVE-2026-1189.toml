[basic]
description = "aws-mcp-server 存在命令注入漏洞，其具体缺陷在于对允许命令列表的处理过程中，未对用户提供的字符串进行充分验证即直接用于执行系统调用。未经身份认证的远程攻击者可利用此漏洞在 MCP 服务器上下文中执行任意代码，从而获取服务器控制权。该漏洞影响 aws-mcp-server 的受影响版本，CVSS 评分为 9.8，危害等级严重。"
published = "2026-01-01"
