[basic]
description = "CVE-2002-1349是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2002-12-18T05:00:00.000"
remediation = "立即访问 Trend Micro 官方知识库（http://kb.trendmicro.com/solutions/solutionDetail.asp?solutionId=12982）下载并安装对应版本的补丁程序，修复 pop3trap.exe 缓冲区溢出漏洞。受影响版本包括 PC-cillin 2000、2002 和 2003，安装补丁后重启计算机使修复生效。如暂时无法获取补丁，可暂时禁用邮件扫描功能 pop3trap.exe 作为临时缓解措施，并避免使用本地 POP3 代理服务。"
