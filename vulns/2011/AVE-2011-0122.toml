[basic]
description = "Opera 浏览器 11.50 之前版本未正确限制 data: URI 的使用，存在跨站脚本（XSS）漏洞。远程攻击者可通过构造特制的恶意网站，诱使用户访问后利用 data: URI 在目标浏览器上下文中注入并执行任意 JavaScript 代码，导致敏感信息泄露或会话劫持。攻击需用户交互（点击链接），影响使用 Opera 11.50 之前版本的所有系统。"
published = "2011-07-01T10:55:02Z"
remediation = "升级 Opera 浏览器至 11.50 或更高版本。Opera 11.50 修复了 data: URI 处理不当导致的跨站脚本漏洞。如无法立即升级，可配置浏览器禁用 data: URI 的脚本执行权限，或使用 NoScript 类扩展限制不可信站点的脚本运行作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera Opera 浏览器 data:URI 跨站脚本漏洞"
updated = "2026-06-16T23:31:38Z"

