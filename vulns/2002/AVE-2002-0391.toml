[basic]
description = "OpenLDAP 2.2.0 及更早版本中的 slapd 守护进程在处理被拒绝的复制请求时，创建日志文件存在条件竞争漏洞。具有本地系统访问权限的攻击者可通过操纵文件创建与写入的时间窗口，利用该竞态条件覆盖系统上任意文件，导致本地文件完整性受损。该漏洞攻击复杂度较高，需要攻击者具备本地用户权限且精确控制时间窗口，CVSS 评分仅 1.2，危害等级低。"
published = "2003-02-19T05:00:00Z"
remediation = "升级 OpenLDAP 至 2.2.0 以上版本。Debian 用户安装 openldap2 2.0.0-5 及以上版本（DSA-227）；Red Hat 用户安装 RHSA-2003:040 提供的更新包；SuSE 用户应用 advisory 2002_047_openldap2 补丁。如无法升级，限制本地用户对 slapd 日志目录的写入权限，并禁用复制日志功能（replication logging）作为临时缓解。"
score = 1.2
severity = "LOW"
sources = ["redhat"]
title = "OpenLDAP slapd 本地竞态条件任意文件写入漏洞"
updated = "2026-06-16T21:59:27Z"

