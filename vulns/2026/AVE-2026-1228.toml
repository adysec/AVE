[basic]
description = "Labcenter Electronics Proteus 软件在解析 PDSPRJ 文件时存在类型混淆漏洞，由于缺乏对用户提交数据的充分验证，攻击者可通过构造恶意 PDSPRJ 文件或诱导用户访问恶意页面来触发该漏洞。成功利用后，攻击者可在当前进程上下文中执行任意代码，实现远程代码执行。该漏洞需要用户交互操作，用户必须打开恶意文件或访问恶意页面才能触发。CVSS 评分为 7.8（高危），影响范围涵盖受影响的 Proteus 安装版本。"
published = "2026-04-11T01:16:18.830"
remediation = "立即将 Labcenter Proteus 升级至官网最新版本（已发布全新 64 位架构版本），受影响版本为 8.17 SP5 及更早版本。因厂商已宣布该软件停止维护（EOL），若无法升级，请在邮件网关和 Web 代理层面屏蔽 PDSPRJ 文件扩展名的传入，限制 Proteus 软件的执行权限仅允许授权用户运行，并通过网络分段隔离运行该软件的终端，阻断来自不可信网络的访问。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Labcenter Proteus PDSPRJ文件解析类型混淆远程代码执行漏洞"
updated = "2026-06-17T10:59:07.487"

