[basic]
description = "Google Chrome 16.0.912.63之前版本中存在越界读取漏洞，该漏洞源于程序未能正确解析SVG文档。远程攻击者可通过向目标用户发送特制的SVG文件，诱使其在受影响浏览器中打开，触发越界内存读取，导致浏览器崩溃拒绝服务。该漏洞影响Chrome 16.0.912.63之前所有版本，CVSS评分5.0，危害等级中危。Google已在Chrome 16.0.912.63版本中修复此漏洞。"
published = "2011-12-13T21:55:01Z"
remediation = "升级 Google Chrome 至 16.0.912.63 及以上版本（2011年12月稳定版更新已修复）。Apple 用户需将 Safari 升级至 5.1.4 以上、iTunes 升级至 10.6 以上、iOS 升级至 5.1 以上。如无法升级，可禁用 JavaScript 对 SVG 的解析或通过内容安全策略（CSP）限制 SVG 加载作为临时缓解。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome SVG解析越界读取漏洞"
updated = "2026-06-16T23:34:08Z"

