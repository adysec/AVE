[basic]
description = 'Webmin 0.91 版本的 edit_action.cgi 脚本存在目录遍历漏洞，攻击者通过在参数中使用".."（点号）序列即可突破 Web 根目录限制，访问或修改服务器上的任意敏感文件，从而获取系统提权。该漏洞影响未修复的 Webmin 管理界面，由于 Webmin 通常以 root 权限运行，未经身份认证的远程攻击者可直接利用此漏洞读取 /etc/passwd 等关键系统文件或写入恶意脚本，最终完全控制目标服务器。CVSS 评分 10.0，危害等级严重，受影响版本需立即升级至安全版本并审查相关 CGI 脚本的文件访问权限。'
published = "2001-12-17T05:00:00Z"
remediation = '建议立即将 Webmin 升级到最新稳定版本（1.x 或 2.x 系列）以彻底修复此目录遍历漏洞。若无法升级，可通过 Web 服务器配置限制对 edit_action.cgi 的访问，或部署 WAF 拦截请求参数中包含 ".." 的非法遍历路径。'
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Webmin Directory 目录遍历漏洞"
updated = "2026-06-16T21:55:47Z"

