[basic]
description = "RealNetworks RealPlayer 的 Internet Explorer 插件中存在一个未指明漏洞，具体涉及 ActiveX 控件在处理多个浏览器窗口打开时的异常行为。远程攻击者可通过诱导用户访问恶意网页，触发该 ActiveX 控件的未定义操作，导致完全控制受影响的系统。该漏洞影响 Windows 平台上的 RealPlayer 11.0 至 11.1 及 RealPlayer SP 1.0 至 1.1.4 版本，CVSS 评分 9.3，危害严重。由于漏洞细节未公开，建议用户升级至 RealPlayer 12.0.0.879 或更高版本以修复此问题。"
published = "2010-08-30T20:00:02Z"
remediation = "建议立即升级 RealPlayer SP 至 12.0.0.879 或更高版本，该版本已修复 ActiveX 控件中与多浏览器窗口相关的未指明漏洞。如无法立即升级，可考虑在 IE 中禁用 RealPlayer ActiveX 控件或更换其他媒体播放器作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer IE 插件 ActiveX 控件远程代码执行漏洞"
updated = "2026-06-16T23:21:56Z"

