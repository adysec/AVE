[basic]
description = "Hassan Consulting shopping cart 1.18 版本的 shop.cgi 程序由于在处理 page 参数时缺乏足够的输入验证，导致存在目录遍历漏洞。远程未经身份验证的攻击者可以通过构造包含 “..” 路径序列的特制请求，绕过文件系统访问限制，从而读取服务器上的任意敏感文件。该漏洞影响所有运行该受影响版本的系统，可能导致机密信息泄露，攻击条件为网络可达且目标服务开启。"
published = "2000-12-19T05:00:00.000"
remediation = '建议立即停止使用过时的 Hassan Consulting shopping cart 1.18 软件。如必须维持运行，请在 Web 服务器配置中对 shop.cgi 的请求参数实施严格过滤，拦截包含 ".." 等目录遍历特征的输入，或通过部署 WAF 拦截路径穿越攻击请求。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Hassan Consulting Shopping Cart 1.18 目录遍历漏洞"
updated = "2026-06-16T21:52:46.263"

