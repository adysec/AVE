[basic]
description = 'Apache HTTP Server 1.3.x 至 1.3.26 及 2.0 至 2.0.42 版本的默认错误页面存在跨站脚本漏洞。当 UseCanonicalName 设置为 "Off" 且启用通配符 DNS 支持时，远程攻击者可通过构造恶意的 Host 头向默认错误页面注入恶意脚本代码。当其他用户访问受影响的错误页面时，恶意脚本会在受害者浏览器中执行，导致会话劫持、凭证窃取或恶意操作。该漏洞影响 Apache 1.3.x 至 1.3.26 及 2.0 至 2.0.42 版本，攻击者需诱导受害者访问包含恶意 Host 头的错误页面，CVSS 评分 6.8（中等危害），Apache 2.0.43 及 1.3.27 已修复此漏洞。'
published = "2002-10-11T04:00:00.000"
remediation = "立即升级 Apache HTTP Server 到安全版本：至少升级到 1.3.27 或 2.0.45，并确保启用 UseCanonicalName 和禁用通配符 DNS 支持。如无法立即升级，可通过服务器配置禁用通配符 DNS 功能并禁用默认错误页面解析以临时缓解风险。验证升级后 Apache 服务状态，确保补丁已生效。"
score = 6.8
severity = "MEDIUM"
sources = ["redhat"]
title = "Apache HTTP Server 跨站脚本攻击漏洞"
updated = "2026-06-16T21:58:14.310"

