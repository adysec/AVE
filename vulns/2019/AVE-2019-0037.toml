[basic]
description = "ZZZCMS zzzphp v1.6.3 的 plugins/ueditor/php/controller.php 文件中存在代码注入漏洞，远程攻击者可通过构造特制的 HTTP 请求，在 catchimage 功能的 source[] 参数中传入恶意 .php 文件 URL，由于 inc/zzz_file.php 文件对远程文件类型检查不严，导致攻击者能够远程执行任意 PHP 代码。该漏洞无需身份认证，攻击复杂度低，CVSS 评分 9.8，危害等级严重，可导致服务器完全被控制。"
published = "2019-03-30T13:29:00.467"
remediation = "立即升级 zzzphp 至最新版本（v1.6.3 之后的安全版本）。如无法升级，在 `inc/zzz_file.php` 中增加对 `source[]` 参数的文件类型白名单校验，禁止直接请求 `.php` 后缀的远程文件；同时限制 `plugins/ueditor/php/controller.php` 的 `catchimage` 动作仅允许特定图片扩展名（jpg/png/gif），并配置 Web 应用防火墙拦截包含 `source[]=http` 的可疑请求。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "ZZZCMS zzzphp 代码注入漏洞"
updated = "2026-06-17T02:11:26.270"

