[basic]
description = "Caldera/SCO OpenServer 5.0.5 和 5.0.6 版本中的 scoadmin 工具存在符号链接漏洞。本地攻击者可通过在临时文件上实施符号链接攻击，利用程序对临时文件的不安全处理，覆盖系统任意文件，例如通过操作日志文件实现权限提升或破坏系统完整性。该漏洞攻击复杂度低，但需要本地访问权限，CVSS 评分 2.1，危害等级低。"
published = "2002-10-04T04:00:00Z"
remediation = "建议立即升级到 SCO OpenServer 5.0.7 或更高版本，该版本已修复 scoadmin 临时文件的不安全创建问题。如无法升级，可移除 scoadmin 的 setuid/setgid 权限位（chmod u-s /opt/K/SCO/Unix/5.0.6aHw/usr/bin/scoadmin），限制本地普通用户执行该程序，或通过文件系统 ACL 限制 /tmp 目录下符号链接攻击。"
score = 2.1
severity = "LOW"
sources = ["exploitdb"]
title = "Caldera OpenServer SCOAdmin 符号链接漏洞"
updated = "2026-06-16T21:58:19Z"

