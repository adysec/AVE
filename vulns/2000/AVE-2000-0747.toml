[basic]
description = "Alabanza Control Panel 3.0 的 nsManager.cgi CGI 程序存在未授权访问漏洞，该管理面板未对管理命令的访问设置密码验证，导致远程攻击者无需任何身份认证即可直接通过 HTTP 请求调用管理接口，进而修改域名 DNS 记录、劫持域名解析或篡改网站配置。攻击者只需知道目标面板地址即可利用，攻击门槛极低，可导致机密性、完整性和可用性均受部分影响。该漏洞影响 Alabanza Control Panel 3.0 版本，CVSS 评分 7.5，危害等级高。"
published = "2000-12-11T05:00:00.000"
remediation = "立即在 Web 服务器（Apache/IIS）层面对 /cp/rac/nsManager.cgi 路径添加 HTTP 基本认证或 IP 白名单限制，仅允许管理员 IP 访问。同时删除或重命名 nsManager.cgi 文件，改用支持身份验证的替代管理方案。如无法升级，建议在防火墙上限制对 80/443 端口上 /cp/rac/ 路径的外部访问，仅放行可信管理网段。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Alabanza Control Panel 3.0 未授权访问漏洞"
updated = "2026-06-16T21:52:59.573"

