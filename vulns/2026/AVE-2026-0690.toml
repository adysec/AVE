[basic]
description = "Pillow 是一个 Python 图像处理库。其 JPEG2000 解码模块在处理分块（tiled）图像时存在缺陷：`total_component_width` 变量在遍历所有图像块时持续累加，而非对每个块独立重置，导致后续块的 `tile_bytes` 计算值异常增大，进而通过 `realloc` 不断扩展解码缓冲区，最终造成内存耗尽。攻击者只需向目标应用发送精心构造的多块 JPEG2000 图像文件，调用 `Image.open(...).load()` 即可触发该漏洞，导致服务拒绝（DoS）。该漏洞影响 Pillow 8.2.0 至 12.2.0 版本，已在 12.3.0 版本中修复。"
published = "2026-07-14T16:17:02Z"
remediation = "tags.<value>将 Pillow 升级至 12.3.0 或更高版本以修复此漏洞，可使用 pip install --upgrade 'Pillow>=12.3.0' 命令进行升级。如因业务原因暂时无法升级，建议在应用层对用户上传的 JPEG2000 图像进行格式校验，拒绝处理包含过多瓦片的图像文件，并对图像解码进程设置内存使用上限（如通过 resource.setrlimit 限制 RSS）作为临时缓解措施。"
score = 8.7
severity = "HIGH"
sources = ["ghsa"]
title = "Pillow JPEG2000 分块解码拒绝服务漏洞"
updated = "2026-07-21T19:17:12Z"

