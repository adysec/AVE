[basic]
description = "Red Hat Linux umb-scheme 3.2-11 软件包安装时将文件权限设置为全局可写，导致本地攻击者可修改这些文件并可能提权至完全控制系统。该漏洞影响安装了 umb-scheme 3.2-11 包的 Red Hat Linux 系统，攻击者需具备本地访问权限且无需认证，利用复杂度低，成功利用可导致系统机密性、完整性和可用性完全丧失（CVSS 7.2，AV:L/AC:L/Au:N/C:C/I:C/A:C）。Red Hat 已发布修复补丁修正文件权限配置。"
published = "2000-10-20T04:00:00Z"
remediation = "建议立即升级 umb-scheme 到 Red Hat 官方修复版本（如 umb-scheme-3.2-12 或更高版本），可通过 Red Hat Network 或官方 FTP 下载更新包安装。若暂无法升级，请立即执行 chmod o-w /usr/lib/umb-scheme/* 移除所有 umb-scheme 目录及文件的全域写权限，或使用 chmod 755 递归修正目录权限，防止本地用户通过写入恶意文件提权。建议同时应用 Red Hat Linux 官方安全公告 RHSA-2000:062 相关补丁包。临时缓解可限制普通用户对 /usr/lib/umb-scheme 目录的写入权限。升级后请验证文件权限为 755/644 且属主为 root:root。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Red Hat Linux umb-scheme 世界可写文件漏洞"
updated = "2026-06-16T21:52:19Z"

