[basic]
description = "QNX RTOS 4.25（QNX4）的多个系统工具存在硬链接与符号链接跟随漏洞。本地攻击者可通过 monitor 的 -f 参数、dumper 的 -d 参数、crttrap 的 -c 参数或 Watcom 示例工具，在低权限条件下利用符号链接攻击，以目标程序权限覆盖任意系统文件，导致本地权限提升或系统文件破坏。该漏洞影响 QNX4 全版本，CVSS 评分 5.5，危害等级中等。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 QNX RTOS 至 4.25 之后的安全修复版本，或应用 QNX 官方提供的补丁。如无法升级，可移除 monitor、dumper、crttrap 等受影响工具的 setuid 权限（chmod u-s /usr/bin/monitor /usr/bin/dumper /usr/bin/crttrap），并限制本地非授信用户登录系统以降低攻击面。"
score = 5.5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "QNX RTOS 4.25 符号链接跟随任意文件修改漏洞"
updated = "2026-06-16T21:58:08Z"

