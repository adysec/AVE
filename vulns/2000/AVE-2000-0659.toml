[basic]
description = "QNX 405 演示光盘中搭载的 Voyager Web Server 2.01B 存在敏感信息泄露漏洞。该服务器将 Web 客户端敏感信息存储在 Web 文档根目录下的 .photon 目录中，远程攻击者无需身份认证即可通过直接访问该目录获取这些敏感信息，导致用户数据泄露。CVSS 评分 5.0，危害等级中等。"
published = "2000-12-19T05:00:00Z"
remediation = "该漏洞源于 QSSL Voyager 2.01B Web 服务器将客户端敏感信息存储在 Web 根目录下的 .photon 目录中。建议立即升级 Voyager Web 服务器至最新版本，或更换为其他受支持的 Web 服务器（如 Apache、Nginx）。如无法升级，应删除或限制 .photon 目录的 Web 访问权限，在 Web 服务器配置中禁止目录列表，并将敏感数据移出 Web 可访问路径。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "QSSL Voyager Web服务器敏感信息泄露漏洞"
updated = "2026-06-16T21:52:43Z"

