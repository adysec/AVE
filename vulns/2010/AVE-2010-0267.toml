[basic]
description = "RealPlayer 包含一个未指明的 RA5 文件解析堆缓冲区溢出漏洞。该漏洞影响 RealNetworks RealPlayer 11.0 至 11.1 版本、RealPlayer SP 1.0 至 1.1.4 版本、RealPlayer Enterprise 2.1.2 版本、Mac RealPlayer 11.0 至 12.0.0.1444 版本、Linux RealPlayer 11.0.2.1744 版本，并可能影响 HelixPlayer 1.0.6 及其他版本。攻击者无需身份验证即可远程向目标系统发送特制的 RA5 文件，触发该漏洞，导致堆内存被破坏，可能实现远程代码执行或导致系统崩溃。该漏洞涉及的CWE分类为堆缓冲区溢出（CWE-119）， CVSS 评分 9.3，严重威胁等级。通过精确的内存操作和精心构造的文件格式，攻击者能够绕过常规安全检测，最终夺取控制权。"
published = "2010-12-14T16:00:04Z"
remediation = "建议立即升级RealPlayer到12.0.1.609或更高版本以获取完整补丁修复RA5文件解析的堆溢出漏洞。如无法立即升级，可暂时禁用RealPlayer的媒体文件预览功能以降低风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer RA5文件堆缓冲区溢出漏洞"
updated = "2026-06-16T23:24:40Z"

