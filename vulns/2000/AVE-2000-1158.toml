[basic]
description = 'Phorum 3.0.7 存在目录遍历漏洞，远程管理员可在 Master Settings 管理功能的默认 .langfile 名称字段中注入".."（点号）路径遍历序列，从而绕过文件路径校验读取服务器上的任意文件，该文件内容会直接通过 admin.php3 页面回显给攻击者。该漏洞影响 Phorum 3.0.7 版本，攻击者需先获得 Phorum 管理员身份，通过网络即可发起利用，无需额外权限或复杂交互，利用门槛较低。成功利用可导致服务器敏感文件（如配置文件、密码文件等）泄露，危害系统机密性。CVSS 向量为 AV:N/AC:L/Au:N/C:P/I:N/A:N，评分为 5.0，危害等级中等。'
published = "2000-12-31T05:00:00Z"
remediation = '建议将 Phorum 升级至 3.0.8 或更高版本以修复目录遍历漏洞。若无法升级，可通过在 Web 服务器（如 Apache）配置中对 admin.php3 设置严格的访问控制列表 (ACL)，或使用安全模块（如 mod_security）拦截包含 "../" 序列的请求作为缓解措施。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Phorum 目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:53:25Z"

