[basic]
description = "Apple iOS 系统内置的 WebKit 浏览器引擎在处理 JavaScript 的 `defineProperties` 方法时，对 `not_number` 属性的处理存在 use-after-free（释放后使用）漏洞，导致内存破坏。远程攻击者可通过构造恶意网页，诱导用户访问后触发该漏洞，实现任意代码执行或拒绝服务攻击，无需用户交互或认证。该漏洞影响 iOS 9.3.5 之前的所有版本，曾被 NSO Group 的 Pegasus 间谍软件利用（Trident 攻击链之一），用于在目标设备上实现越狱并植入监控软件，同时该漏洞也影响 Nintendo Switch 浏览器。Apple 已在 iOS 9.3.5 安全更新中修复此漏洞。"
published = "2016-08-25T21:59:02Z"
remediation = "立即将 iOS 升级至 9.3.5 或更高版本（设置 → 通用 → 软件更新），该版本修复了 WebKit 内存破坏漏洞。如无法立即升级，可暂时禁用 Safari 的 JavaScript 执行（设置 → Safari → 高级 → JavaScript 关闭），或使用第三方浏览器并启用内容拦截功能作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Apple iOS WebKit 内存破坏漏洞"
updated = "2026-06-17T00:47:58Z"

