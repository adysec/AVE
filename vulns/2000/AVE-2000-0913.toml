[basic]
description = "Microsoft Office 2000 的 HTML 解释器存在缓冲区溢出漏洞，攻击者可通过在 HTML 文档中嵌入超长的 object 对象标签触发该溢出，从而在目标系统上执行任意命令。该漏洞影响 Microsoft Word 2000、Excel 2000 及 PowerPoint 2000 等办公套件组件。当用户使用受影响版本的 Office 打开包含恶意构造 HTML 内容的文档时，HTML 解释器因未对 object 标签长度进行充分边界检查而导致缓冲区溢出，攻击者可借此获得与当前用户同等权限的远程代码执行能力，进而进一步读取敏感数据、篡改文件或控制系统。该漏洞无需身份认证即可通过网络进行远程利用，利用需攻击者诱使用户打开特制文档。Microsoft 已在安全公告 MS00-056 中发布补丁以修复此问题。"
published = "2000-10-20T04:00:00Z"
remediation = '立即将 Microsoft Office 2000 升级至 Office 2000 Service Pack 3 (SP3)，该补丁修复了 HTML 解释器中的对象标签缓冲区溢出漏洞。如无法立即升级，可在 Office 应用程序中禁用 HTML 对象标签的自动解析功能，通过注册表设置 HKEY_CURRENT_USER\Software\Microsoft\Office\9.0\Common\Security\DisableHTMLObjectTag 值为 1 作为临时缓解措施，并禁止打开来源不明的 Office 文档。'
score = 5.1
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Office 2000 HTML对象标签缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:52:26Z"

