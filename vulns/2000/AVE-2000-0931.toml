[basic]
description = "tags.<value>Red Hat Linux 7.x 及 6.x 系统中的 pam_localuser PAM 模块存在缓冲区溢出漏洞。该模块用于本地用户认证时将用户名复制到固定大小的缓冲区，由于缺少足够的边界检查，攻击者可构造超长字符串导致缓冲区溢出，进而覆盖内存中的关键数据。该漏洞影响使用 pam_localuser 模块的 Red Hat Linux 6.x 和 7.x 系列版本。攻击条件为攻击者需获得本地系统访问权限，可通过构造特制的输入数据触发溢出，成功利用后可能获得系统 root 权限，实现本地权限提升，对系统的机密性、完整性和可用性造成严重影响。"
published = "2001-01-09T05:00:00Z"
remediation = "建议升级 pam 软件包到修复版本（Red Hat 7.0 需更新至 pam-0.75-3 及以上，Red Hat 6.x/7.x 请安装对应 RHSA 勘误公告中的 pam 更新包）。可通过 Red Hat Network 或 `rpm -Uvh pam-*.rpm` 手动安装补丁包后重启相关服务。由于 pam_localuser 模块是本地登录认证的关键组件，该漏洞可导致本地权限提升，受影响系统均为已停止维护的老版本，强烈建议迁移至仍受支持的操作系统版本，避免长期暴露风险。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Red Hat Linux pam_localuser 模块缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:53:20Z"

