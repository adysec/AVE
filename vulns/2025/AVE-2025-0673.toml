[basic]
description = "Windows BitLocker 存在信息泄露漏洞，具有物理访问权限的攻击者在满足高复杂度攻击条件的情况下，可能通过特定硬件调试接口或内存分析技术绕过 BitLocker 加密保护，读取本应受保护的系统卷中的敏感数据。该漏洞影响 Windows 10、Windows 11 及 Windows Server 各版本，CVSS 评分 4.2，危害等级中危。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:32Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新 (KB5049984)，通过 Windows Update 或 Microsoft Update Catalog 获取。如无法立即打补丁，可在 BitLocker 加密完成后移除页面文件中的敏感数据残留，或限制对系统卷的物理访问权限作为临时缓解措施。"
score = 4.2
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows BitLocker 信息泄露漏洞"
updated = "2026-06-17T08:42:47Z"

