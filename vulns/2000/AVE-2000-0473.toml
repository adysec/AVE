[basic]
description = "BitchX IRC 客户端在处理 /INVITE 命令时存在格式化字符串漏洞，远程攻击者可通过向运行 BitchX 的受害者发送特制的 INVITE 消息触发该漏洞，导致客户端崩溃或拒绝服务。该漏洞影响 BitchX 1.0c16 及更早版本，攻击者无需认证即可利用，危害等级中危。"
published = "2000-07-04T00:00:00Z"
remediation = "建议立即升级 BitchX 至 1.0c16 之后的修复版本，或应用 Red Hat 发布的 RHSA-2000-042 补丁、Caldera 发布的 CSSA-2000-022.0 补丁。如无法升级，可在 IRC 客户端配置中禁用自动接受 INVITE 请求，或暂时改用其他 IRC 客户端（如 irssi、hexchat）作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "BitchX IRC Client /INVITE 格式化字符串拒绝服务漏洞"
updated = "2000-07-04T00:00:00Z"

