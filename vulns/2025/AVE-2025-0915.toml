[basic]
description = "Linux kernel vsock/virtio 子模块存在空指针解引用漏洞。当 vsock socket 被解除分配或重新分配给另一个传输层时，内核仍会处理已接收的数据包，导致访问 `vsk->transport` 指针时发生空指针解引用。本地低权限攻击者可通过发送信号中断第一次 connect() 调用，并利用第二次 connect() 失败的时机触发该漏洞。成功利用可导致内核崩溃（拒绝服务）或潜在的权限提升，影响所有使用 virtio-vsock 的 Linux 系统，包括虚拟机及容器环境。该漏洞已在后续内核版本中修复。"
published = "2025-01-31T12:15:28.053"
remediation = "升级 Linux 内核至修复版本：5.15.177、6.1.127、6.6.74、6.12.11 或更高版本。对于主流发行版，Debian 12/Ubuntu 22.04 用户请安装 linux-image-5.15.0-1080 及对应更新，RHEL/CentOS 用户请应用 kernel-4.18.0-553.el8 或更高版本更新包。如暂时无法升级内核，可通过 sysctl 限制本地用户对 vsock 的访问或禁用 virtio-vsock 设备作为临时缓解措施。建议同时监控系统中 vsock 相关进程的异常行为，限制本地未授权用户的代码执行机会。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 vsock/virtio 空指针解引用漏洞"
updated = "2026-07-30T06:18:13.990"

