[basic]
description = "Linux 内核中 RDMA/CXGB4 驱动存在整数溢出漏洞，在 32 位系统上，攻击者可通过 process_responses() 接口控制 gl->tot_len 变量，当将其与 sizeof(struct cpl_pass_accept_req) 及 sizeof(struct rss_header) 相加时可能触发整数回绕，导致内核内存破坏。本地低权限攻击者可利用该漏洞造成系统拒绝服务。该漏洞影响 Linux 内核 rdma/cxgb4 驱动相关版本，CVSS 评分 5.5，危害等级中等。"
published = "2025-02-27T02:15:10Z"
remediation = "立即升级 Linux 内核至以下已修复版本：5.4.291、5.10.235、5.15.179、6.1.129、6.6.76、6.12.13 或 6.13.2 及以上。对于无法立即升级的系统，可限制本地用户对 RDMA cxgb4 设备的访问权限，或通过内核模块黑名单禁用 cxgb4 驱动（/etc/modprobe.d/blacklist-cxgb4.conf 中添加 blacklist cxgb4）作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Kernel RDMA cxgb4 驱动整数溢出漏洞"
updated = "2026-07-14T13:17:14Z"

