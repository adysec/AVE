[basic]
description = "NetWin dMailWeb 和 cwMail 2.6g 及更早版本存在拒绝服务漏洞，远程攻击者可通过发送超长用户名参数触发缓冲区溢出或资源耗尽，导致邮件服务崩溃拒绝服务。漏洞影响 Windows/Linux 平台部署的 NetWin 邮件服务器，攻击者无需身份认证即可通过网络远程利用，仅需构造包含超长用户名字段的登录请求即可导致服务不可用，CVSS 评分 5.0（中等严重度），影响可用性。"
published = "2000-06-21T04:00:00.000"
remediation = "建议立即升级NetWin DMailWeb/CWMail到最新安全补丁版本，安装供应商发布的官方修复程序；同时对Web应用服务配置用户名长度限制（建议为255字节以下），并启用Web应用防火墙过滤超长用户名参数。如无法立即升级，可临时禁用DMailWeb服务或限制其网络访问端口，仅开放必要的服务功能以缓解风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "NetWin dMailWeb/CWMail 拒绝服务漏洞"
updated = "2026-06-16T21:52:06.220"

