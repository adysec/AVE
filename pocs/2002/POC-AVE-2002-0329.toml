[info]
author = "ave"
description = "phpGroupWare 0.9.12 及更早版本在 magic_quotes_gpc 禁用时存在 SQL 注入漏洞，通过构造恶意 SQL 语句注入到数据库查询中，绕过输入过滤机制，远程攻击者可无需认证直接操作后端数据库"
id = "POC-AVE-2002-0329"
name = "CVE-2002-0536 PoC"
severity = "high"
tags = ["ave-2002-0329"]
vuln_id = [
    "CVE-2002-0536",
    "AVE-2002-0329",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/phpgroupware/"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["phpGroupWare"]
