[basic]
description = "xinetd 2.3.4 版本在启动子服务时错误地泄露了信号管道的文件描述符给子进程，导致由 xinetd 启动的服务可通过操作该泄露的管道文件描述符造成拒绝服务攻击。该漏洞影响 xinetd 2.3.4 版本，攻击条件为本地攻击者能够控制或启动由 xinetd 管理的服务进程，攻击者可通过向泄露的信号管道写入数据导致 xinetd 主进程异常终止或服务中断，造成拒绝服务影响，CVSS 评分 2.1，属于本地低权限拒绝服务漏洞。"
published = "2002-09-05T04:00:00Z"
remediation = "建议升级 xinetd 至 2.3.5 或更高版本（如 xinetd-2.3.5-1 或更新版本），该版本已修复信号管道文件描述符泄漏漏洞。若暂无法升级，可通过在 xinetd.conf 中为相关服务设置 `instances = 1` 限制并发实例数，或在防火墙层面限制对 xinetd 管理服务的访问，作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "xinetd 服务拒绝服务漏洞"
updated = "2026-06-16T21:58:18Z"

