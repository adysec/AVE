[basic]
description = "Apple iTunes 10.7 之前版本所使用的 WebKit 组件存在内存破坏漏洞。远程攻击者可通过诱骗用户访问恶意构造的网站，触发 WebKit 在解析网页内容时的内存错误，导致任意代码执行或应用程序崩溃。该漏洞影响处理 TIFF、PNG、JPEG 等图像格式及相关图形组件的多个子系统，攻击者无需身份认证即可在用户系统上执行任意代码，造成严重的安全危害。"
published = "2012-09-13T10:30:19Z"
remediation = '建议将 Apple iTunes 升级至 10.7 或更高版本以修复该漏洞，可通过 iTunes 的"检查更新"功能或直接从 Apple 官网下载最新版本安装。对于 Windows 用户，建议同时安装 Apple Software Update 以确保所有 Apple 组件均获得安全更新。如暂时无法升级，应避免使用 iTunes 访问不受信任的网站内容，并配置防火墙限制 iTunes 对恶意站点的访问。'
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:39Z"

