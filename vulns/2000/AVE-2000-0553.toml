I need to write a proper Chinese description that:
- Explains the buffer overflow principle
- Mentions affected products (SGI Omron WorldView Wnn / WorldView 6.5/Wnn4 4.2)
- Mentions attack conditions (remote, no authentication needed)
- Is ≥50 characters

Let me write the description and put it in <value> tags.<value>SGI Omron WorldView Wnn 存在缓冲区溢出漏洞，攻击者可通过向目标系统发送特制的长 JS_OPEN、JS_MKDIR 或 JS_FILE_INFO 命令字符串触发溢出，从而执行任意命令。该漏洞影响 WorldView 6.5/Wnn4 4.2 Asian Language Server 系统，允许未经身份认证的远程攻击者直接利用，无需任何权限即可触发。漏洞利用后可导致机密性、完整性和可用性同时丧失，CVSS 评分 10.0，危害等级极为严重。"""
