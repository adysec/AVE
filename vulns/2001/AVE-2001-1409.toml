[basic]
description = "Microsoft IIS 5.0 的 FTP 服务存在拒绝服务漏洞，其根本原因在于 CWE-131 缓冲区大小计算错误。IIS 5.0 及更早版本中的 FTP 服务在处理通配符序列（如 * 或 ?）进行文件名匹配与展开时，未正确限制展开后字符串的最大长度，导致生成超长的内部字符串并消耗大量内存或缓冲区空间。未经身份认证的远程攻击者只需向目标 FTP 服务发送包含恶意构造的通配符序列的 FTP 命令（如 LIST、NLST 或 STAT 等），即可触发该漏洞，使 FTP 服务进程异常终止或系统资源耗尽，造成 FTP 服务不可用，进而影响依赖 IIS 承载的 Web 站点的正常文件传输与维护。该漏洞影响运行 IIS 5.0 的 Windows 2000 及 Windows XP 等操作系统，CVSS v3.1 评分为 7.5，危害等级为高。Microsoft 已在 MS01-026 安全公告中发布补丁修复此问题。"
published = "2001-06-27T04:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS01-026 累积安全补丁，IIS 5.0 系统对应 KB293826，IIS 4.0 系统对应 KB295534，并升级至 Windows 2000 Service Pack 3 或更高版本以获取永久修复。若无法立即打补丁，可在防火墙或 IIS 管理器中限制 FTP 服务（端口 21）的访问来源 IP，禁用匿名 FTP 登录，或暂时关闭 FTP 服务以进行临时缓解。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft IIS 5.0 FTP 服务拒绝服务漏洞"
updated = "2026-06-16T21:54:07Z"

