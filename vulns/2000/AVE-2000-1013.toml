[basic]
description = "KDE 1.1.2 中的终端模拟器 kvt 存在格式化字符串漏洞，本地攻击者可通过在 DISPLAY 环境变量中注入特制的格式化字符（如 %n），触发格式化字符串漏洞，从而以 kvt 进程权限执行任意命令。该漏洞影响 KDE 1.1.2 及可能更早版本，攻击者需拥有本地系统访问权限，CVSS 评分 7.2，危害等级高。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 KDE 至 2.0 及以上版本（kvt 在 KDE 2.0 中已修复此格式字符串漏洞），或直接替换终端模拟器为 Konsole（KDE 2.0 起默认终端）。如无法升级 KDE，可移除 kvt 的 setuid 权限（`chmod -s /opt/kde/bin/kvt`）并限制本地用户设置 DISPLAY 环境变量中的格式化字符，作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "KDE kvt 格式化字符串本地代码执行漏洞"
updated = "2026-06-16T21:52:45.863"

