[basic]
description = "Ethereal（现Wireshark）0.9.3之前版本中的GIOP（通用ORB间协议）解析器存在内存消耗拒绝服务漏洞。远程攻击者无需身份认证，可通过向目标系统发送特制的GIOP协议数据包，触发解析器在处理时分配大量内存，导致系统内存资源耗尽，造成服务拒绝。该漏洞攻击复杂度低，影响Ethereal 0.9.0至0.9.3版本，CVSS评分5.0，危害等级中等。"
published = "2002-06-18T04:00:00Z"
remediation = "立即升级 Ethereal 至 0.9.3 或更高版本。各发行版对应补丁：Debian 安装 DSA-130 安全更新，Red Hat 安装 RHSA-2002:036/RHSA-2002:088/RHSA-2002:170 更新，Caldera OpenLinux 安装 CSSA-2002-037.0 更新。如无法升级，可在网络边界部署入侵检测规则，对 GIOP 协议流量进行深度包检测并拦截异常长度的 CORBA 请求报文，以缓解内存耗尽风险。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Ethereal GIOP解析器内存消耗拒绝服务漏洞"
updated = "2026-06-16T21:57:22Z"

