[info]
author = "ave"
description = "检测 Google Chrome V8 JavaScript 引擎类型混淆漏洞（CVE-2020-6418）。通过向目标浏览器发送包含恶意 JavaScript 代码的 HTML 页面，触发 V8 引擎内部类型判断错误，导致堆内存控制失衡。该漏洞影响 Chrome 80.0.3987.122 之前版本，攻击者无需身份验证即可远程利用。参考：ExploitDB 48186、GitHub anvbis/chrome_v8_ndays。"
id = "POC-AVE-2020-1700"
name = "CVE-2020-6418 Chrome V8 Type Confusion PoC"
severity = "high"
tags = ["ave-2020-1700"]
vuln_id = [
    "CVE-2020-6418",
    "AVE-2020-1700",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
