[basic]
description = "Linux 内核 drm/v3d 显示驱动中存在漏洞，作业执行完成后未将设备中的对应作业指针设置为 NULL。当本地低权限用户卸载该驱动时，内核会误认为相关作业仍处于活动状态并触发告警，可能导致系统不稳定或内存安全问题。该漏洞影响使用 V3D GPU 的 Linux 内核版本，攻击者需要具备本地访问权限并拥有低权限账户即可触发，无需用户交互，成功利用可对系统造成拒绝服务或信息泄露风险。"
published = "2025-02-12T14:15:32.787"
remediation = "升级 Linux 内核至已包含修复补丁的稳定版本：5.4.290、5.10.234、5.15.177、6.1.127、6.6.74 或 6.12.11 及更高版本。Debian 用户应安装 DLA-4075-1 安全更新，Ubuntu 22.04 LTS 应升级至 5.15.0-1077.83 或更高版本，Ubuntu 20.04 LTS 应升级至 5.4.0-1142.153 或更高版本。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux kernel drm/v3d 本地权限提升漏洞"
updated = "2026-07-30T06:19:18.900"

