[info]
author = "AVE"
description = "通过构造包含 file:// 协议 URL 的恶意 HTML 页面，利用 META refresh 自动重定向机制，在 Mac OS 8/9 系统的 IE 5.1 及更早版本中绕过安全检查执行本地 AppleScript"
id = "POC-AVE-2002-0192"
name = "Apple Mac OS Internet Explorer 本地脚本执行漏洞 PoC"
severity = "high"
tags = ["ave-2002-0192"]
vuln_id = [
    "CVE-2002-0153",
    "AVE-2002-0192",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["file:///Macintosh"]
