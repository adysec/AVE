[basic]
description = "Odoo 8.0 版本（20160726 及之前）及 9.0 版本存在 CWE-601 开放重定向漏洞，由于对用户输入的重定向 URL 缺乏充分验证，远程攻击者可构造恶意链接诱导用户点击，将受害者重定向至恶意站点以窃取敏感信息（如会话凭证、个人信息）。该漏洞 CVSS 3.0 评分 5.4（中危），攻击向量为网络（AV:N），攻击复杂度低（AC:L），无需权限（PR:N）但需用户交互（UI:R），影响机密性与完整性（C:L/I:L），不影响可用性。攻击者可通过钓鱼邮件、恶意链接等方式诱导用户点击，利用开放重定向跳转至钓鱼页面窃取敏感数据。受影响版本为 Odoo 8.0 ≤ 20160726 及 9.0 版本，官方已发布修复版本修复该输入验证缺陷。"
published = "2019-05-22T20:29:00Z"
remediation = "建议立即升级 Odoo 至 8.0-20160726 之后的版本或 9.0 后续修复版本（如 9.0-20170726 及以上），通过官方渠道下载最新安全补丁包并应用。若暂时无法升级，可在 Nginx/Apache 反向代理层配置重定向白名单，限制仅允许跳转至可信域名，或在 odoo.conf 中设置 list_db = False 限制数据库列表泄露，同时在防火墙层面限制管理后台访问源 IP。定期检查 Odoo 官方安全公告（https://www.odoo.com/page/security）获取最新补丁信息。"
score = 5.4
severity = "MEDIUM"
sources = ["nuclei"]
title = "Odoo 开放重定向漏洞"
updated = "2026-06-17T01:21:21Z"

