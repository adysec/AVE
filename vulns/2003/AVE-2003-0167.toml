[basic]
description = "PHP 4.3.3 之前的版本中存在缓冲区溢出漏洞。远程未经身份认证的攻击者可以通过向目标服务器发送特制的请求，触发程序在处理输入数据时产生缓冲区溢出，导致内存损坏。该漏洞的影响范围涵盖所有受影响的 PHP 版本，攻击者可利用此漏洞在目标系统上实现远程代码执行（RCE）或造成拒绝服务（DoS）攻击，使服务器崩溃。由于攻击门槛低且无需任何账户权限，其危害等级被评定为最高级。"
published = "2003-11-17T05:00:00Z"
remediation = "` tags.<value>立即将 PHP 升级至 4.3.3 或更高版本（含 4.3.4 等后续补丁版本）。如暂时无法升级，可在 Web 服务器层面通过防火墙或 .htaccess 规则限制对 PHP 解释器的直接访问，同时禁用不必要的 PHP 扩展模块以减少攻击面，待条件允许时尽快完成版本升级。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "PHP 远程缓冲区溢出漏洞"
updated = "2026-06-16T22:03:06Z"

