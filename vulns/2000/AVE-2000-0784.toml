[basic]
description = "WFTPD 及 WFTPD Pro 2.41 版本存在信息泄露漏洞。当文件正在传输过程中，远程未经身份认证的攻击者可通过执行 STATUS（STAT）命令，获取服务器上该文件的真实完整路径名。攻击者无需任何权限即可利用此漏洞，导致敏感路径信息泄露，为进一步攻击（如目录遍历、文件访问）提供便利。该漏洞影响 WFTPD 2.41 及 WFTPD Pro 2.41 版本，CVSS 评分 5.0，危害等级中危。"
published = "2000-07-21T04:00:00.000"
remediation = "升级 WFTPD 至 2.4.1RC11 或更高版本，该版本修复了 STAT 命令泄露路径、STAT/LIST 导致崩溃、REST 命令越界写入及 MLST 未认证崩溃等多个漏洞。如无法升级，建议在防火墙限制对 FTP 端口（21）的访问，仅允许可信 IP 连接。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Texas Imperial Software WFTPD 路径信息泄露漏洞"
updated = "2026-06-16T21:52:10.887"

