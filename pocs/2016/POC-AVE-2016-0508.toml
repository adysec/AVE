[info]
author = "AVE"
description = "通过 Metasploit HTTP 服务投递 WebKit UAF 利用代码，检测目标 iOS 设备是否存在 CVE-2016-4655 内核信息泄露漏洞。PoC 模拟 Pegasus 攻击链中的 WebKit 利用阶段，通过 JavaScript 触发 use-after-free 漏洞读取内核内存。"
id = "POC-AVE-2016-0508"
name = "Apple iOS Kernel Information Disclosure PoC"
severity = "medium"
tags = ["cve-2016-4655"]
vuln_id = [
    "CVE-2016-4655",
    "AVE-2016-0508",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "WebKit",
    "JavaScriptCore",
]
