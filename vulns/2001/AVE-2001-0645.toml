[basic]
description = "Cisco 340 系列 Aironet 无线接入点在固件 11.01 版本中对 WEP 加密的实现存在设计缺陷：其未充分使用 24 位初始化向量（IV）中可用的全部比特位，导致实际参与加密运算的有效 IV 空间大幅缩减。攻击者可在无需身份认证的情况下，通过被动截获无线网络流量，利用缩减后的 IV 密钥空间对 WEP 密钥实施暴力破解，大幅降低破解难度和时间成本。该漏洞影响运行固件 11.01 的 Cisco 340 系列 Aironet 接入点，成功利用可导致攻击者获取 WEP 加密密钥，进而解密无线通信数据，威胁无线网络的机密性。"
published = "2001-01-01T05:00:00Z"
remediation = "立即将 Cisco 340 系列 Aironet 接入点固件升级至 11.01 之后的修复版本。由于 WEP 协议本身存在本质缺陷且该设备已过时，强烈建议直接更换支持 WPA2/WPA3 标准的现代无线设备，停止使用 WEP 加密以彻底消除暴力破解风险。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Cisco 340系列 Aironet无线接入点 WEP加密信息泄露漏洞"
updated = "2026-06-16T21:53:47Z"

