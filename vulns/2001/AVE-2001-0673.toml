[basic]
description = "tags.<value>crontab程序在运行过程中存在临时文件替换漏洞，本地用户可在crontab编辑临时文件时，通过替换该临时文件为指向其他用户crontab文件的符号链接，读取其他用户的定时任务内容。该漏洞影响所有使用crontab功能的Unix/Linux系统，攻击条件为具备本地用户账户，利用方式为在crontab运行期间替换其临时文件，从而获取其他用户的计划任务信息，可能泄露系统维护脚本中的敏感凭据。"
published = "2001-03-26T05:00:00.000"
remediation = "升级 cron 到 vixie-cron 4.1 或更高版本；Debian 系统执行 apt-get install cron 安装 3.0pl1-108 或更高版本。如无法立即升级，可通过编辑 /etc/cron.allow 限制允许使用 crontab 的用户列表，仅保留必要的系统账户，并对 /tmp 目录确保已设置 sticky bit（权限 1777），以降低符号链接替换攻击的成功率。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Linux cron crontab 文件泄露漏洞"
updated = "2026-06-16T21:53:56.117"

