[basic]
description = "SGI IRIX 6.2 系统中 libgl.so 图形库存在缓冲区溢出漏洞，本地用户可通过设置过长的 HOME 环境变量，在调用 gmemusage 或 gr_osview 等程序时触发栈溢出，从而执行任意代码并获取 root 权限。该漏洞属于本地提权类漏洞，攻击者需拥有系统本地访问权限，利用条件为能控制环境变量并运行受影响程序。CVSS 评分 7.2（AV:L/AC:L/Au:N/C:C/I:C/A:C），影响机密性、完整性和可用性均为完全级别。SGI 已发布补丁修复此漏洞，建议升级至修复版本或限制受影响程序的执行权限。"
published = "2000-10-20T04:00:00Z"
remediation = '升级到 SGI IRIX 6.5 或更高版本，应用 IRIX61500-73-014 及以上版本的补丁以修复 libgl.so 缓冲区溢出漏洞。具体操作步骤：1）停止系统并重新启动到单用户模式；2）安装最新安全补丁包 IRIX61500-73-014；3）验证补丁安装成功，检查 /lib/libgl.so 文件的时间戳和校验和；4）使用 `strings /lib/libgl.so | grep "Buffer overflow"` 命令验证补丁生效；5）重新启动系统以应用补丁。如果无法立即升级，建议通过 `limits` 文件限制 HOME 环境变量长度，设置为最大 1024 字符；或者编辑 sudoers 文件，禁止普通用户执行 gmemusage、gr_osview 等受影响程序；或者在内核命令行中添加 `home=L128` 参数以限制 HOME 变量长度。'
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "SGI IRIX libgl.so 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:29Z"

