[basic]
description = "Windows 电话服务（Telephony Service）存在堆缓冲区溢出漏洞（CWE-122），未经身份认证的远程攻击者可通过网络向目标系统发送特制请求触发该漏洞，成功利用可在目标系统上以服务权限执行任意代码。该漏洞影响多个 Windows 版本，CVSS 评分 8.8，危害等级高。攻击复杂度低，无需权限但需用户交互。Microsoft 已在 2025 年 4 月安全更新中修复此漏洞。"
published = "2025-04-08T18:15:45Z"
remediation = "立即安装 Microsoft 2025 年 4 月安全更新（对应各 Windows 版本的累积更新 KB 编号），或通过 Windows Update 自动获取更新。受影响版本的最低修复版本号：Windows 10 1507 需升级至 10.0.10240.20978，Windows 10 22H2 需升级至 10.0.19045.5737，Windows 11 24H2 需升级至 10.0.26100.3775，Windows Server 2022 需升级至 10.0.20348.3453。如无法立即打补丁，可在防火墙或网络层面限制对 TAPI 服务的网络访问，并禁用不必要的电话服务（TapiSrv）以降低攻击面。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务堆缓冲区溢出远程代码执行漏洞"
updated = "2026-06-17T08:42:48Z"

