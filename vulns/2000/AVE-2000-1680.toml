[basic]
description = "Microsoft Network Monitor (Netmon) 的 HTTP 协议解析器存在缓冲区溢出漏洞，远程攻击者可通过向受影响的 Netmon 服务发送特制的畸形 HTTP 数据触发该漏洞，导致缓冲区溢出，从而在目标系统上执行任意代码。该漏洞影响 Microsoft Network Monitor 的多个版本，攻击者无需身份认证即可远程利用，CVSS 评分 7.5，危害等级高。Microsoft 已在相关安全更新中修复此漏洞。"
published = "2000-12-19T05:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-083 提供的更新补丁，该补丁修复了 Network Monitor HTTP 协议解析器中的缓冲区溢出漏洞。如无法立即打补丁，可在防火墙层面阻止未经授权的网络流量访问运行 Netmon 的系统，并限制仅允许受信任主机连接。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Network Monitor HTTP协议解析器缓冲区溢出漏洞"
updated = "2026-06-16T21:52:32.303"

