[info]
author = "ave"
description = "检测 Icecast 1.3.7/1.3.8beta2 及更早版本中的 print_client() 格式字符串漏洞。远程攻击者可通过客户端连接触发该漏洞，利用格式说明符在服务器上执行任意命令。本 PoC 通过 HTTP 响应头验证目标是否为 Icecast 服务器。"
id = "POC-AVE-2001-0075"
name = "CVE-2001-0197 Icecast print_client() Format String PoC"
severity = "critical"
tags = ["ave-2001-0075"]
vuln_id = [
    "CVE-2001-0197",
    "AVE-2001-0075",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = ["Icecast"]
