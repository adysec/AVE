[basic]
description = "tags.<value>OctoberCMS 是一个基于 Laravel PHP 框架开发的内容管理系统。在受影响的 october/system 软件包版本中，攻击者能够向目标站点发起账户密码重置请求，随后通过精心构造的特制 HTTP 请求绕过身份认证机制，直接获取目标账户的访问权限。该漏洞本质上是认证机制设计不当（CWE-287），攻击者无需事先掌握账户凭据，也无需用户交互，即可远程劫持任意注册用户的账户会话。成功利用后，攻击者可获得账户的完整访问权限，进而导致敏感信息泄露或后台内容被篡改。该漏洞影响所有使用受影响版本 OctoberCMS 搭建的网站，CVSS 评分为 8.2，危害等级为高。官方已在 Build 472 及 v1.1.5 版本中发布补丁修复此问题。"
published = "2021-08-26T19:15:07Z"
remediation = "立即将 october/system 包升级至 Build 472（1.0.472）或 v1.1.5，或通过 Composer 执行 composer update october/system 命令。若暂时无法升级，可手动应用 octobercms/library 的提交 016a297b 与 5bd1a28 进行补丁修复。建议同时启用多因素认证插件、修改默认后台 URL（config/cms.php 中的 backend URL）并限制后台访问 IP，以降低被利用风险。"
score = 8.2
severity = "HIGH"
sources = ["kev"]
title = "OctoberCMS 账户密码重置身份验证不当漏洞"
updated = "2026-06-17T03:53:20Z"

