[basic]
description = "iWeb Hyperseek 2000 搜索引擎软件中的 hsx.cgi CGI 程序存在目录遍历漏洞。未经身份认证的远程攻击者可通过向目标服务器发送特制请求，在 `show` 参数中构造 `../`（点号斜杠）序列绕过目录访问限制，读取服务器上任意文件和目录内容。由于该参数未对用户输入进行有效过滤和校验，攻击者可通过逐级向上跳转目录的方式访问 Web 根目录之外的文件，例如读取 `/etc/passwd` 等系统敏感文件，导致服务器配置信息和系统用户信息泄露。该漏洞利用条件简单，攻击者仅需向目标发送一个包含目录遍历字符的 HTTP GET 请求即可成功利用，无需认证凭据，网络可达即可触发。iWeb Hyperseek 2000 的安装版本均受此漏洞影响，建议升级至已修复该问题的版本或打上官方安全补丁。"
published = "2001-06-02T04:00:00Z"
remediation = "标签之间。<value>联系 iWeb Systems（info@iwebsys.com）获取官方修复补丁并升级到修复后的 Hyperseek 版本。由于该软件已停止维护且年代久远，建议迁移至现代搜索引擎替代产品。临时缓解措施：在防火墙或 Web 服务器层对 /cgi-bin/suche/hsx.cgi 的 show 参数进行过滤，阻断含 ../ 和 %00 的请求；或通过访问控制列表限制对 cgi-bin 目录的远程访问，禁用不必要的 CGI 执行权限。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "iWeb Hyperseek 2000 目录遍历漏洞"
updated = "2026-06-16T21:53:58Z"

