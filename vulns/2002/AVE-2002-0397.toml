[basic]
description = "Microsoft Internet Explorer 5.5 和 6.0 版本在处理浏览器窗口中的框架时未能正确验证其所属域，导致同源策略被绕过。远程攻击者可通过构造恶意网页，利用 OBJECT 标签跨域读取客户端本地文件或调用可执行对象，造成敏感信息泄露或任意代码执行。攻击者只需诱导用户访问特制页面即可触发，无需任何身份认证。"
published = "2002-09-24T04:00:00Z"
remediation = "升级到 Internet Explorer 6.0 Service Pack 1 或更高版本，该漏洞已在后续更新中修复。如无法升级，建议禁用 ActiveX 控件和脚本的跨域访问权限，或将 Internet 区域安全级别设置为「高」以阻止跨框架脚本执行。长期缓解措施建议迁移至现代浏览器（如 Microsoft Edge、Chrome、Firefox），因 IE 已停止安全支持。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft Internet Explorer 同源策略绕过漏洞"
updated = "2026-06-16T21:58:00Z"

