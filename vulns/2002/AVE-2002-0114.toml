[basic]
description = "XChat 1.8.7 及更早版本（包括 1.4.2 和 1.4.3 的默认配置）存在 IRC 命令注入漏洞。远程攻击者可通过向目标用户发送包含编码字符的 PRIVMSG 消息触发 CTCP PING 请求，当目标客户端启用了 percascii 变量时，响应中的编码字符会被展开解析，导致攻击者能够以其他客户端身份执行任意 IRC 命令。该漏洞影响广泛部署的 XChat IRC 客户端，攻击者无需身份认证即可远程利用，可造成会话劫持、消息伪造等危害。"
published = "2002-06-25T04:00:00.000"
remediation = "升级 XChat 至 1.8.8 或更高版本以修复 CTCP PING 编码字符扩展漏洞。Debian 用户可参考 DSA-099 通过 apt-get update && apt-get upgrade 获取补丁，Red Hat 用户可安装 RHSA-2002-005 提供的更新包。临时缓解措施：在 XChat 设置中将 percascii 变量设为 0 以禁用编码字符扩展功能。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "XChat CTCP Ping 远程 IRC 命令执行漏洞"
updated = "2026-06-16T21:56:34.710"

