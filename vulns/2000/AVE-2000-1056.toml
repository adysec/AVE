[basic]
description = "HP-UX 11.0 及 HP Tru64 UNIX 4.0f 至 5.1a 系统中的 dtterm 终端模拟器在处理 `-tn` 选项参数时存在缓冲区溢出漏洞。攻击者作为本地用户，可通过向该程序传递超长的 `-tn` 参数触发缓冲区溢出，进而执行任意代码。该漏洞利用条件要求攻击者拥有本地登录权限，成功利用可导致权限提升或完全控制系统。由于该漏洞影响 HP-UX 与 Tru64 UNIX 等关键业务服务器操作系统，建议用户及时安装 HP 官方安全补丁以修复此问题。"
published = "2000-12-11T05:00:00.000"
remediation = "对于受影响的 HP-UX 11.0 及 Tru64 UNIX 4.0f 至 5.1a 系统，建议升级至 HP-UX 11i 或 Tru64 UNIX 5.1a 之后的官方补丁版本（参考 HP Security Bulletin SRB0039W），应用修复后的 dtterm 程序以消除 -tn 选项的缓冲区溢出漏洞。若短期内无法升级，可临时通过 `chmod 750 /usr/dt/bin/dtterm` 限制普通用户执行 dtterm，或使用 `chmod u-s /usr/dt/bin/dtterm` 移除 setuid 位以降低本地提权风险，并配合防火墙规则限制本地终端服务的未授权访问。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "HP HP-UX Tru64 UNIX dtterm 终端模拟器缓冲区溢出漏洞"
updated = "2026-06-16T21:53:00.490"

