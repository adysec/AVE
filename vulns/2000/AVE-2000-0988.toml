[basic]
description = 'WFTPD 和 WFTPD Pro 2.41 RC12 版本存在服务器全路径名泄露漏洞。攻击者可向 FTP 服务器发送特定的 "%C" 命令，触发服务器返回包含完整系统路径的错误信息，导致敏感的文件系统结构被公开。该漏洞影响 Windows 等操作系统的 WFTPD 服务器，攻击者无需任何权限即可远程执行，利用简单。 CVSS 评分 5.0，危害等级中低，主要涉及信息泄露（CWE-200），可能为进一步攻击提供信息支撑。目前微软及厂商已发布补丁修复此问题，建议及时更新到安全版本。'
published = "2000-11-14T05:00:00Z"
remediation = "立即升级到最新版本的FTP服务器软件（如FileZilla Server 1.0+或vsftpd 3.0+），或直接更换为支持安全更新的云端FTP服务。如无法立即升级，可通过防火墙禁用FTP服务端口21或限制访问源IP来临时缓解风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Texas Imperial Software WFTPD 全路径名泄露漏洞"
updated = "2026-06-16T21:52:39Z"

