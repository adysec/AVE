[basic]
description = "WQuinn QuotaAdvisor 4.1 在处理存储在备用数据流（ADS）中的文件时，未能正确记录文件实际大小，导致本地用户可通过将文件写入 NTFS 备用数据流来绕过磁盘配额限制。攻击者只需拥有本地系统访问权限即可利用此漏洞，无需特殊权限，影响运行 WQuinn QuotaAdvisor 4.1 的 Windows 系统。"
published = "2000-12-19T05:00:00Z"
remediation = '升级 WQuinn QuotaAdvisor 至 4.1 以上已修复此漏洞的版本；如厂商已停止维护，建议改用 Windows 内置磁盘配额管理（NTFS 配额），在卷属性中启用配额限制并勾选"拒绝将磁盘空间给超过配额限制的用户"。同时启用文件系统审计策略，监控 NTFS 备用数据流（ADS）的创建行为，通过 PowerShell 定期扫描可疑 ADS 文件。作为临时缓解措施，限制用户对卷的写入权限以减少 ADS 滥用风险。'
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "WQuinn QuotaAdvisor 安全绕过漏洞"
updated = "2026-06-16T21:52:47Z"

