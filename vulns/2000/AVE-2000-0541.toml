[basic]
description = "Auction Weaver CGI 脚本 1.02 及更早版本中存在命令注入漏洞，远程攻击者可通过向 fromfile 参数传递包含 shell 元字符（如管道符、分号等）的特制请求，利用 CGI 脚本未对用户输入进行有效过滤的缺陷，在服务器上以 Web 进程权限执行任意系统命令。该漏洞无需身份认证即可远程利用，攻击复杂度低，可导致目标系统完全失陷，包括数据窃取、恶意软件植入等严重后果。目前已有公开的 Exploit-DB 利用代码。"
published = "2000-10-20T04:00:00Z"
remediation = "立即删除或禁用 Auction Weaver CGI 脚本（auction.pl），或升级到已修复此漏洞的最新版本。如业务必须使用，需在脚本入口处对 fromfile 参数进行严格过滤，禁止传入 `;&|`$(){}` 等 shell 元字符，并限制脚本仅允许特定用户通过 .htaccess 访问。建议迁移至其他仍在维护的拍卖系统。作为网络层缓解措施，可在 WAF 或反向代理上配置规则拦截包含 shell 元字符的 fromfile 参数请求。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "CGI Script Center Auction Weaver 远程命令执行漏洞"
updated = "2026-06-16T21:52:16Z"

