[basic]
description = "Oracle WebLogic Server 的 wls9-async 组件存在反序列化远程代码执行漏洞。攻击者无需认证即可通过 HTTP 协议向目标服务器发送精心构造的 SOAP 请求包，触发反序列化操作，从而在服务器端执行任意命令，完全控制目标系统。该漏洞影响 WebLogic 10.3.6.0.0 和 12.1.3.0.0 版本，CVSS 评分 9.8，危害等级严重。Oracle 官方已发布安全补丁修复此漏洞。"
published = "2019-04-26T19:29:00Z"
remediation = "立即升级 Oracle WebLogic Server 至 10.3.6.0.180116 或 12.1.3.0.190416 及以上版本。如无法升级，删除 _async 目录下的 wls9_async_response.war 和 wls9_async_request.war 文件并重启服务；或在 Web 应用防火墙（WAF）层面拦截包含 _async/ 路径的 HTTP 请求，同时禁用 Web 服务组件中不必要的异步通信功能。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Oracle WebLogic Server wls9-async 组件远程代码执行漏洞"
updated = "2026-06-17T02:34:26Z"

