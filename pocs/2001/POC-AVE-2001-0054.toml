[info]
author = "AVE"
description = "检测目标是否托管了利用 Windows Media Player 7.0 .wmz 皮肤文件执行任意 Java 小程序的恶意页面。攻击者通过 IFRAME 加载恶意 skin.wmz 文件到已知路径，再通过 applet 标签的 codebase 参数执行其中的 Java 代码。"
id = "POC-AVE-2001-0054"
name = "Microsoft Windows Media Player 7.0 .wmz Arbitrary Java Applet PoC"
severity = "medium"
tags = [
    "cve-2001-0137",
    "windows-media-player",
    "wmz",
    "java-applet",
]
vuln_id = [
    "CVE-2001-0137",
    "AVE-2001-0054",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/wmp2.wmz"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "PK",
    "application/zip",
]
