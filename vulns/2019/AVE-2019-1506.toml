[basic]
description = "QNAP Photo Station 存在路径遍历漏洞（CWE-22），远程攻击者可在无需认证的情况下，通过向目标系统发送特制的 HTTP 请求，利用对文件名或路径参数的外部控制，实现目录穿越，从而读取或修改系统任意文件。该漏洞影响 QNAP NAS 设备上的 Photo Station 应用，CVSS 评分 9.8，危害等级严重。QNAP 已发布安全更新修复此漏洞，建议用户升级 Photo Station 至最新版本。"
published = "2019-12-05T17:15:13Z"
remediation = "立即将 QTS 系统更新至 QTS 4.4.1 build 20190918 及以上版本（或 QTS 4.3.6 build 20190919 及以上版本），并将 Photo Station 更新至对应版本：QTS 4.4.1 用户升级至 Photo Station 6.0.3 及以上、QTS 4.3.4~4.4.0 用户升级至 5.7.10 及以上、QTS 4.3.0~4.3.3 用户升级至 5.4.9 及以上、QTS 4.2.6 用户升级至 5.2.11 及以上。更新方法：以管理员身份登录 QTS，进入「控制台」→「系统」→「固件更新」执行 Live Update，或在 App Center 中搜索 Photo Station 点击更新。如无法立即更新，建议在防火墙上限制对 NAS 管理端口（8080/443）和 Photo Station 服务的公网访问，仅允许可信 IP 连接。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "QNAP Photo Station 路径遍历漏洞"
updated = "2026-06-17T02:40:14Z"

