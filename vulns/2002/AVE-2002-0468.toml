[basic]
description = 'phpBB 2.0.0 的 [IMG] 标签存在跨站脚本（XSS）漏洞。攻击者通过在 [IMG] 标签中构造包含 http:// 和双引号（"）的恶意 URL，可绕过 phpBB 的安全检查，终止 HTML IMG 标签的 src 参数并注入任意 JavaScript 脚本。当其他用户浏览包含该恶意帖子的页面时，脚本将在其浏览器中执行，导致攻击者可以窃取会话 Cookie、伪造页面内容或执行其他恶意操作。攻击者无需身份认证，仅需在论坛帖子中插入特制的 IMG 标签即可触发。'
published = "2002-10-04T04:00:00Z"
remediation = '升级 phpBB 至 2.0.1 或更高版本（Debian 确认修复版本为 2.0.6c-1），该版本修复了 [IMG] 标签中对用户输入的双引号过滤不严问题。如无法升级，可在 phpBB 的 bbcode 解析函数中增加对 `"` 和 `http://` 组合模式的过滤，或禁用自定义 IMG 标签功能。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "phpBB 2.0.0 IMG标签HTML注入跨站脚本漏洞"
updated = "2026-06-16T21:58:21Z"

