[basic]
description = "CVE-2002-1281是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2002-11-29T05:00:00Z"
remediation = "立即升级到 KDE 3.0.5 版本。如无法升级，可从 ftp://ftp.kde.org/pub/kde/security_patches/ 下载 post-3.0.4-kdelibs-kio-misc.patch 补丁应用到 KDE 3.0.4 系统。临时缓解措施：删除 KDE 安装目录下 share/services/ 及用户主目录 .kde/share/services/ 中的 rlogin.protocol 文件，重启 KDE 会话以禁用该受影响的 KIO 子协议。"
score = 7.5
