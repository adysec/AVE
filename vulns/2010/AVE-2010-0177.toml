[basic]
description = "Apple Safari 浏览器使用的 WebKit 渲染引擎中存在释放后重用（Use-After-Free）漏洞，远程攻击者可通过诱导用户访问包含特制字体的恶意网页触发该漏洞。成功利用后，攻击者可获取目标系统的完全控制权限，实现任意代码执行或导致应用程序崩溃拒绝服务。该漏洞影响 Mac OS X 10.4 至 10.6 及 Windows 平台上的 Safari 浏览器，CVSS 评分 9.3，危害严重。Apple 已在 Safari 5.0/4.1 版本中修复此漏洞。"
published = "2010-06-11T19:30:23Z"
remediation = "立即将 Apple Safari 升级至 5.0 或更高版本（Mac OS X 10.4 用户升级至 Safari 4.1 或更高版本），该版本修复了 WebKit 字体处理中的释放后重用漏洞。可通过 Mac OS X 系统自带的软件更新功能（Apple 菜单 → 软件更新）或从 Apple 官网下载最新版 Safari 安装包完成升级。对于已停止支持的老旧系统（Mac OS X 10.5/10.6），建议迁移至受支持的操作系统版本以获得持续安全更新。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 字体处理释放后重用远程代码执行漏洞"
updated = "2026-06-16T23:19:17Z"

