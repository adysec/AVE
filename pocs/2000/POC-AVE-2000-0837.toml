[info]
author = "ave"
description = "验证目标服务器是否存在 phf CGI 程序缓冲区溢出漏洞（CVE-2000-1186）。通过向 /cgi-bin/phf 发送 HTTP GET 请求，检测服务器是否返回该脚本的响应页面，从而判断有漏洞的 CGI 组件是否存在。"
id = "POC-AVE-2000-0837"
name = "Apache HTTP Server phf CGI 缓冲区溢出漏洞 PoC"
severity = "high"
tags = ["ave-2000-0837"]
vuln_id = [
    "CVE-2000-1186",
    "AVE-2000-0837",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/cgi-bin/phf"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["phf"]
