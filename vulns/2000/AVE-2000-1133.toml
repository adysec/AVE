[basic]
description = "tags.<value>Linux 平台的 socks5 服务器存在缓冲区溢出漏洞，攻击者可通过发送超长的连接请求触发溢出，从而在目标系统上执行任意命令。该漏洞无需身份认证即可利用，影响运行 socks5 服务的 Linux 服务器系统，CVSS 评分为 7.2，危害等级为高危。"
published = "2001-01-09T05:00:00Z"
remediation = "立即升级所部署的 SOCKS5 服务器（如 dante 1.2.0a 及以上版本）至厂商最新稳定版，修改配置文件将服务监听地址限制为 127.0.0.1 内网地址，并使用 iptables 防火墙仅允许可信 IP 访问 TCP 1080 端口作为临时缓解。若业务无需 SOCKS5 代理服务，建议直接停止相关进程并从系统启动项中移除。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Linux SOCKS5 服务器缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:19Z"

