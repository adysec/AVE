[basic]
description = "Opsview Monitor Pro 存在路径遍历漏洞，未经身份认证的远程攻击者可通过向目标系统发送特制的 HTTP GET 请求，利用 `%252f`（双重 URL 编码）绕过路径过滤机制，实现目录遍历攻击。该漏洞影响 Opsview Monitor Pro 5.1.0.162300841 之前版本、5.0.2.27475 之前版本、4.6.4.162391051 之前版本及未安装 2016 安全补丁的 4.5.x 系列版本，可导致攻击者读取服务器上的任意敏感文件，造成信息泄露。CVSS 评分 7.5，危害等级高。"
published = "2017-05-03T10:59:00Z"
remediation = "升级 Opsview Monitor Pro 至 5.1.0.162300841 及以上版本，或 5.0.2.27475、4.6.4.162391051 版本；4.5.x 用户须安装 2016 年安全补丁。该漏洞利用双重 URL 编码绕过（%252f 替代 /）实现目录遍历，如无法立即升级，可在反向代理或 WAF 层面添加规则拦截包含 %252f 的 HTTP GET 请求路径。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Opsview Monitor Pro 路径遍历漏洞"
updated = "2026-06-17T00:39:32Z"

