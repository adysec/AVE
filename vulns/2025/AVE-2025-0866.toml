[basic]
description = "Microsoft Visual Studio 2022 存在不当访问控制漏洞（CWE-284），由于对资源权限的校验不充分，低权限攻击者可通过诱导已登录用户打开特制文件或执行恶意操作，在本地系统上下文中实现权限提升，从而获取对机密性、完整性和可用性的高影响。该漏洞影响 Visual Studio 2022 17.12.0 至 17.12.3 版本，攻击复杂度低，但需要用户交互。Microsoft 已在 2025 年 1 月安全更新中发布修复，建议用户升级至 17.12.4 及以上版本。"
published = "2025-01-14T18:16:04Z"
remediation = '立即将 Microsoft Visual Studio 2022 升级至 17.12.4 或更高版本，可通过 Visual Studio 菜单"帮助"→"检查更新"获取最新安全更新，或从 visualstudio.microsoft.com/downloads 下载安装。如无法立即更新，建议限制低权限用户登录受影响系统，并避免在 Visual Studio 中打开来自不可信来源的解决方案文件。'
score = 7.3
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Visual Studio 特权提升漏洞"
updated = "2026-06-17T08:43:17Z"

