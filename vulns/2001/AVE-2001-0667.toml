[basic]
description = "tags.<value>Chili!Soft ASP for Linux 在 3.6 版本之前存在权限提升漏洞。该漏洞源于程序在继承模式下运行脚本时，未能正确设置组权限，导致攻击者可通过构造恶意 ASP 脚本获取提升的权限。此漏洞影响运行 Chili!Soft ASP 的 Linux 服务器，攻击者只需上传并执行恶意脚本即可触发，无需特殊身份认证。由于 CVSS 评分为 7.2，属于高危级别。"
published = "2001-05-03T04:00:00.000"
remediation = "立即将 Chili!Soft ASP for Linux 升级至 3.6 版本，该版本修复了继承模式下组权限未正确设置的缺陷。升级后重启 ASP 服务，并检查所有 ASP 脚本的组权限配置，确保仅授权用户可执行敏感脚本。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Chili!Soft ASP for Linux 权限提升漏洞"
