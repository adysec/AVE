[basic]
description = "FreeBSD 5.0 及更早版本中的 setlocale 函数存在任意文件读取漏洞。本地攻击者可通过设置 LANG 环境变量为特制路径，触发 setlocale 函数读取系统上的任意文件内容。该漏洞源于 setlocale 在处理环境变量时未对路径参数进行充分校验，导致攻击者能够读取 /etc/master.passwd 等敏感文件，进而可能获取系统凭据或敏感信息。攻击条件要求攻击者拥有本地访问权限，无需额外认证即可利用。"
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 FreeBSD 系统至 4.1-STABLE 或 3.5-STABLE（2000-09-07 之后版本），或手动修补 libc 源码：下载 FreeBSD-SA-00:53 补丁，以 root 执行 `cd /usr/src/lib/libc && patch < 补丁文件 && make all && make install` 重新编译 libc。修补后运行 `sh scan_locale.sh ./test_locale.sh /` 扫描所有 setuid/setgid 二进制文件，对检测出的静态链接程序移除其 setuid/setgid 权限（`chmod u-s <文件>`）或直接删除，动态链接程序在重编 libc 后自动修复。临时缓解措施：限制可登录系统的用户范围，移除可疑 setuid 二进制文件的 `o+x` 权限。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "FreeBSD setlocale 函数本地任意文件读取漏洞"
updated = "2026-06-16T21:52:58.290"

