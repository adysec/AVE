[basic]
description = "该漏洞属于缓存凭据泄露漏洞。Internet Explorer 5.5 之前的版本在处理安全网站时，会将缓存的用户凭据错误地转发给同一网站上的非安全页面。远程攻击者可以通过监控与 Web 服务器的连接，在用户访问非安全页面时截获并获取这些敏感凭据。该漏洞影响所有使用 IE 5.5 之前版本的客户端，攻击条件为用户在同一站点内从安全页面跳转至非安全页面，导致凭据在明文传输中被窃取。"
published = "2000-12-19T05:00:00Z"
remediation = "建议将 Internet Explorer 升级至 5.5 或更高版本。对于无法立即升级的旧系统，建议在浏览器设置中禁用“自动完成”凭据保存功能，或在网站管理端强制所有页面使用 HTTPS 协议以防止凭据在非加密通道中传输。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Internet Explorer 凭据泄露漏洞"
updated = "2026-06-16T21:52:54Z"

