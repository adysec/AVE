[basic]
description = "pyasn1 的 BER 解码器（被 CER 和 DER 编解码器共用）在解析长格式标签 ID 时，通过循环累加续传字节且未对标签 ID 大小设置上限，攻击者可构造特制的 ASN.1 数据包触发该漏洞。CPU 消耗随输入大小呈二次增长，约 1 MB 的恶意输入即可导致超过一分钟的 CPU 占用；在 Python 3.11+ 上，超大的标签 ID 还会在格式化错误消息时触发未捕获的 ValueError 异常，绕过调用方预期的 PyAsn1Error 异常处理。任何解码不可信 BER/CER/DER 输入的应用均受影响。该漏洞已在 pyasn1 0.6.4 版本中修复。"
published = "2026-07-14T17:17:14.750"
remediation = "升级 pyasn1 至 0.6.4 或更高版本（pip install --upgrade pyasn1）。如无法立即升级，在调用 decode() 前限制不可信输入的大小（如限制为 1MB），并在应用层捕获所有异常类型（包括 ValueError）以防止绕过错误处理逻辑。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "pyasn1 BER/CER/DER 解码器拒绝服务漏洞"
updated = "2026-07-21T14:37:52.160"

