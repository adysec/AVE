[basic]
description = "Open WebUI 终端 WebSocket 路由在 `backend/open_webui/routers/terminals.py` 中的 `_resolve_authenticated_connection` 辅助函数自行处理首条消息的 JWT 认证，未复用 HTTP 终端的依赖链，也未应用 `get_verified_user` 所执行的已验证用户角色门控。当用户账户状态为 `pending`（已注册但未审批，或已批准后被停用并降级回 `pending`）时，即使 HTTP 终端路由会正确拒绝该账户，WebSocket 路径仍允许其建立交互式终端会话，从而绕过账户审批边界。攻击者需持有该 `pending` 账户的有效 JWT 令牌（停用后令牌默认有效期为四周且未被撤销）及终端服务器 ID，且目标部署中至少配置了一个终端服务器且访问权限涵盖该账户所属组或公开读取。受影响版本为 0.8.8 至 0.11.0 之前的所有构建，攻击者可借此在终端环境中获得交互式 shell、文件浏览及终端支持的工具访问权限。该问题已在 v0.11.0 中修复，通过将令牌解码、撤销检查、用户查找及角色校验统一到 `get_verified_user_by_token` 辅助函数中，确保 WebSocket 与 HTTP 路由共享同一角色定义，消除两条代码路径之间的一致性问题。"
published = "2026-08-04T21:16:37Z"
remediation = "建议将 Open WebUI 升级至 v0.11.0 或更高版本。升级后，系统将统一 WebSocket 和 HTTP 路由的角色验证逻辑，彻底修复未批准账户可非法访问终端会话的问题。"
score = 6.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Open WebUI 未批准账户 WebSocket 认证绕过终端会话漏洞"
updated = "2026-08-05T19:17:37Z"

