[basic]
description = "Linux 内核的 RAVB 以太网驱动（drivers/net/ethernet/renesas/ravb_main.c）在系统挂起（suspend）与恢复（resume）路径中缺少对 rtnl 锁的持有。当系统执行休眠/唤醒操作时，ravb_open、ravb_close 以及 WOL（唤醒局域网）相关操作未在 rtnl 锁保护下执行，可能与正在进行的 ndo（网络设备操作）例程产生并发冲突，并触发内核的 RCU 使用警告（lockdep_rcu_suspicious），最终导致内核发出竞态告警甚至行为异常。该漏洞影响使用 Renesas RAVB 网卡驱动的 Linux 内核（如基于 r9a08g045、RAVB SMARC 等 Renesas 平台的系统），以及受影响的 Ubuntu 22.04 LTS 等发行版内核包。攻击前提为本地用户或攻击者能使目标系统进入并退出挂起状态来触发该竞态；触发后可能破坏内核同步逻辑，削弱系统稳定性并降低正常运行状态的安全性。利用方式为构造系统级电源管理（挂起/恢复）场景以驱动网卡驱动路径，从而复现并利用该并发缺陷。该漏洞 CVSS 评分 7.8，危害等级为高，需在挂起/恢复路径中确保 rtnl 锁被正确持有。"
published = "2025-02-27T20:16:02Z"
remediation = "建议升级 Linux 内核到包含该修复的稳定版本（如 6.13 系列中应用此补丁的版本），Red Hat 修复为 RHSA 公告对应内核包，Ubuntu 22.04/24.04 用户请安装 USN-7653-1 中列出的更新内核包（`apt update && apt install linux-generic`）。若暂无法升级内核，可临时停止在 RAVB 网卡（eth0 所在 Renesas 平台）上执行频繁挂起/恢复操作，并避免系统休眠往返以规避触发条件，待补丁就绪后尽快重启生效。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux Kernel RAVB 以太网驱动 本地权限提升漏洞"
updated = "2026-07-30T06:21:32Z"

