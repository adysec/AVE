[basic]
description = "better-auth 的 oidc-provider 和 mcp 插件在注册 OAuth 客户端时未对 redirect_uris 的 URL scheme 进行验证，攻击者可在客户端注册时提交 javascript: 协议的重定向地址并存储。当授权服务器在同意授权页面的响应中返回该恶意重定向地址时，若前端页面将其赋值给 window.location.href 等导航目标，就会在授权服务器源内执行攻击者注入的 JavaScript 代码，导致存储型 DOM 跨站脚本漏洞。该漏洞影响 better-auth 1.6.12 及更早稳定版、所有 1.7.0-beta 预发布版本。攻击者需在应用启用动态客户端注册的前提下，先注册恶意客户端，再诱骗已登录用户访问攻击者构造的授权链接并点击同意，即可窃取用户会话令牌并完成账户劫持。该漏洞攻击复杂度较高，CVSS 评分 5.0，危害等级为中危。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
