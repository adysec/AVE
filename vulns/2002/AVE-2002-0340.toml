[basic]
description = """
` tags mixed in. The validation found "description 字段为空" and "remediation 字段为空" - probably because the format is malformed (contains literal `tags.` and `<value>` text that breaks TOML parsing).

My task is to output only the description field value between `<value>` tags.

Let me write a clean Chinese description ≥50 characters covering:
- 漏洞原理: SQL injection
- 影响范围: IBM Informix Web DataBlade 4.12 / 4.1x
- 攻击条件: remote, no authentication

The description should not have the `tags.` prefix or embedded `<value>` markers - just clean text.

Output only the description value, no extra content besides maybe brief analysis. The instructions say final answer must be within `<value>..."""
published = "2002-07-03T04:00:00Z"
remediation = """
` wrapper. I need to output only the field value between <value> tags.

The current remediation content is decent but has the "tags." prefix problem. I need to produce a clean version, ≥20 characters Chinese, with specific actionable steps.

Let me write a clean remediation without the "tags." prefix and without nested <value> tags.<value>该产品为 2002 年发布的 IBM Informix Web DataBlade 4.12，早已停止技术支持，厂商补丁已不适用，应优先采取升级迁移与访问控制相结合的缓解措施。具体操作：1) 尽快将 Informix Web DataBlade 迁移升级至受支持的数据库版本或改用受支持的 Web 数据访问中间件（如 IBM 新一代 Web 服务方案），替换存在漏洞的 webdriver 组件；2) 在 Web 服务器层（Apache/IIS）对 webdriver 所在 URL 路径配置访问控制列表（ACL），仅允许受信任内网来源 IP 访问，并启用基础身份认证限制非法访问；3) 对所有传入 webdriver 的 HTTP 请求参数执行严格输入校验与参数化查询处理，过滤单引号等 SQL 注入特殊字符；4) 为 Web DataBlade 连接数据库使用最小权限账号，严禁以 informix 等高权限用户运行该组件，降低注入攻击成功后的数据泄露影响范围。"""
