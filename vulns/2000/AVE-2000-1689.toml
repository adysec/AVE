[basic]
description = "WatchGuard SOHO 防火墙 HTTP 服务器存在缓冲区溢出漏洞，远程未授权攻击者可通过发送超长的 HTTP GET 请求触发缓冲区溢出，导致拒绝服务并可能执行任意代码。该漏洞影响 WatchGuard SOHO 防火墙 HTTP 服务组件，CVSS 评分 10.0（CVSS:AV:N/AC:L/Au:N/C:C/I:C/A:C），危害等级严重。攻击者无需认证即可远程发送畸形长 GET 请求触发缓冲区溢出，导致服务崩溃拒绝服务，甚至可能实现远程代码执行完全控制设备。WatchGuard 已发布固件更新修复该漏洞，建议用户升级至修复版本固件。"
published = "2001-02-12T05:00:00.000"
remediation = "建议立即升级 WatchGuard SOHO 防火墙固件至 5.0.23 或更高版本（官方已发布修复补丁），或通过 Web 管理界面禁用 HTTP 管理接口（仅保留 HTTPS 管理）。若无法立即升级，可在边界防火墙层面封禁来自非信任网段的 HTTP 端口（默认 80 端口）访问，并限制管理接口仅允许受信任管理 IP 访问，作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "WatchGuard SOHO Firewall HTTP 服务缓冲区溢出漏洞"
updated = "2026-06-16T21:52:41.840"

