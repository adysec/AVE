[basic]
description = "IBM AS/400 Firewall R440 的 Web 管理接口存在拒绝服务漏洞。远程攻击者无需身份认证即可通过网络向目标设备发送一个空的 GET 请求，触发该接口处理异常，导致防火墙服务崩溃或停止响应，造成网络防护功能失效。攻击条件简单，仅需目标开放 Web 管理端口即可实施。该漏洞 CVSS 评分 5.0，属于中危，影响 IBM AS/400 Firewall R440 版本。厂商已发布安全更新修复此问题。"
published = "2000-12-11T05:00:00.000"
remediation = "建议升级 IBM AS/400 Firewall 至 R440 后续修复版本或迁移至受支持的防火墙产品。若无法升级，请在防火墙策略中禁止外部 IP 访问 Web 管理接口（默认端口），仅允许可信内网管理 IP 访问；同时在网络边界部署入侵防御系统（IPS）拦截空 GET 请求攻击流量。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "IBM AS/400 Firewall 空GET请求拒绝服务漏洞"
updated = "2026-06-16T21:53:01.453"

