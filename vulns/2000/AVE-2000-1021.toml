[basic]
description = "Samba 2.0.7 Web 管理工具 (SWAT) 存在拒绝服务漏洞，远程未授权攻击者可通过反复向 HTTP GET 请求发送非标准 URL，强制 SWAT 服务重启，导致拒绝服务。该漏洞影响 Samba 2.0.7 版本的 Web 管理界面，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），属于可用性影响。攻击者无需认证即可远程发起攻击，通过持续发送畸形 URL 请求耗尽服务资源导致服务重启拒绝服务。Samba 官方已发布更新版本修复该漏洞，建议升级至 2.0.7 以上版本。"
published = "2000-12-19T05:00:00.000"
remediation = '建议立即升级 Samba 至 2.0.8 或更高版本以修复 SWAT Web 管理工具的 URL 拒绝服务漏洞。若无法立即升级，可通过防火墙限制对 SWAT 管理端口（默认 901 端口）的访问，仅允许受信任的内网管理 IP 访问；或在 Samba 配置文件 smb.conf 中设置 "swat disable = yes" 禁用 SWAT 服务，改用命令行工具管理 Samba 服务。参考修复公告：http://archives.neohapsis.com/archives/bugtraq/2000-10/0430.html'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Samba 2.0.7 Web Administration Tool URL 拒绝服务漏洞"
updated = "2026-06-16T21:52:48.757"

