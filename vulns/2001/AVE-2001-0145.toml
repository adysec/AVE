[basic]
description = "tags.<value>Bugzilla 2.4/2.6/2.8/2.10 版本存在任意命令执行漏洞。攻击者可在用户名中嵌入 shell 元字符，当该用户名通过 Bugzilla_login cookie 传入 post_bug.cgi 或通过 who 参数传入 process_bug.cgi 时，系统未对输入进行充分过滤，导致攻击者注入的命令被服务器执行。该漏洞影响所有默认配置的 Bugzilla 实例，未经身份认证的远程攻击者即可利用，可导致服务器被完全控制，CVSS 评分为 7.5。"
published = "2001-06-27T04:00:00Z"
remediation = """立即升级 Bugzilla 至 2.12 或更高版本，升级前务必备份数据库与 localconfig 文件，升级后运行 checksetup.pl 完成配置更新，并访问 sanitycheck.cgi 确认系统健康状态。如暂无法升级，可手动修改 process_bug.cgi、post_bug.cgi 与 createattachment.cgi 中的 system() 调用，将字符串形式改为参数列表形式（如 system("./processmail", $num, $::FORM{'who'})），避免 shell 解释元字符；同时限制 Web 服务器进程权限至最低必要级别，禁止访问 data/、shadow/ 目录及 localconfig 文件，并在防火墙层面限制对 Bugzilla CGI 脚本的访问来源。"""
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Mozilla Bugzilla 远程命令执行漏洞"
updated = "2026-06-16T21:54:06Z"

