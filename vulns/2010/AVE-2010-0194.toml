[basic]
description = "RealNetworks RealPlayer 11.0至11.1及RealPlayer SP 1.0至1.0.1版本中存在数组索引错误漏洞。远程攻击者可通过向目标用户发送特制的RealMedia .IVR文件，利用畸形的IVR指针索引触发该漏洞，导致任意代码执行。攻击者无需身份认证，只需诱导用户打开恶意媒体文件即可完成利用，CVSS评分9.3，危害严重。"
published = "2010-10-19T00:00:01Z"
remediation = "升级 RealPlayer 至 12.0.0.879 或更高版本，该版本修复了 IVR 文件解析中的数组索引错误。如无法升级，建议卸载 RealPlayer 或禁用浏览器中的 RealPlayer ActiveX 控件，并避免打开来源不明的 .IVR 媒体文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer IVR文件数组索引错误远程代码执行漏洞"
updated = "2026-06-16T23:21:56Z"

