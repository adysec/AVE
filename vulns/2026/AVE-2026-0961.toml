[basic]
description = "Trend Micro Apex One 及 SEP 安全代理中存在源验证漏洞（CWE-346），攻击者需首先获得目标系统上的低权限代码执行能力，随后利用该漏洞绕过进程保护机制，实现本地权限提升。该漏洞与 CVE-2026-34927 类似但存在于不同的进程保护机制中，影响 Apex One 本地部署版（14.0.0.17079 之前版本）及 SaaS 版（14.0.20731 之前版本）。成功利用后可获取系统级权限，完全控制受影响的机密性、完整性和可用性。Trend Micro 已发布安全公告并提供修复版本。"
published = "2026-05-21T14:16:45.710"
remediation = "立即将 Apex One (on-prem) 升级至 SP1 CP Build 18012（现有 SP1 用户）或 SP1 Build 17079（全新安装），确保 Security Agent 版本 ≥ 14.0.0.17079；Apex One as a Service / Vision One SEP 用户将 Security Agent 升级至 build 14.0.20731。补丁可从 Trend Micro Download Center 获取。临时缓解措施：限制低权限用户对受影响主机的本地访问，审核并收紧远程访问策略。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Trend Micro Apex One/SEP 代理源验证漏洞导致本地权限提升"
updated = "2026-07-23T16:10:00.137"

