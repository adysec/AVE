[info]
author = "ave"
description = "检测 RealServer /admin/includes/ URL 内存内容泄露漏洞"
id = "POC-AVE-2000-0836"
name = "CVE-2000-1181 PoC"
severity = "medium"
tags = ["ave-2000-0836"]
vuln_id = [
    "CVE-2000-1181",
