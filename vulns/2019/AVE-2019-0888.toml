[basic]
description = "Exim 邮件服务器 4.92 至 4.92.2 版本中的 string.c 文件存在堆缓冲区溢出漏洞。远程未经身份认证的攻击者可通过向目标服务器发送特制的超长 EHLO 命令触发该漏洞，导致堆内存越界写入，进而实现远程代码执行。该漏洞影响所有运行受影响版本 Exim 的邮件服务器，CVSS 评分 9.8，危害等级严重。建议用户立即升级至 Exim 4.92.3 或更高版本以修复此漏洞。"
published = "2019-09-27T21:15:10Z"
remediation = "立即升级 Exim 至 4.92.3 或更高版本。源码可从 https://ftp.exim.org/pub/exim/exim4/ 下载编译，或通过 Git 拉取 tag exim-4.92.3（commit 478effbfd9c3cc5a627fc671d4bf94d13670d65f）。各发行版用户请安装对应安全更新：Debian 运行 apt-get install exim4 更新至 DSA-4536 修复版本，Ubuntu 运行 apt-get update && apt-get install --only-upgrade exim4 安装 USN-4141-1 更新，Fedora 通过 dnf update exim 安装修复包，Gentoo 执行 emerge --sync && emerge -u exim 应用 GLSA 202003-47。官方确认除升级外无其他有效缓解措施，必须尽快修复。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Exim 邮件服务器堆缓冲区溢出远程代码执行漏洞"
updated = "2026-06-17T02:22:58Z"

