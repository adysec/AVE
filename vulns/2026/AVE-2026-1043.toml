[basic]
description = "网络配置脚本存在权限提升漏洞（CWE-78），低权限本地用户可通过该脚本执行任意系统命令并获取 root 权限，导致完全系统沦陷。攻击者需在目标系统上拥有低权限账户登录权限，利用该脚本的输入验证缺陷注入恶意命令，从而绕过权限限制以 root 身份执行任意操作。该漏洞影响使用该网络配置脚本的系统，CVSS 评分 8.5，危害等级高。攻击成功后可导致攻击者完全控制目标系统，窃取敏感数据或进一步横向移动。"
published = "2026-07-30T07:16:57.540"
remediation = "Phoenix Contact 已发布固件版本 1.9.1 修复此漏洞，受影响设备应立即升级至该版本。升级前请确保设备处于受保护的工业内网中，并通过防火墙严格限制外部对设备管理端口的访问。若无法立即完成固件升级，应暂时限制对设备的本地物理和 SSH 访问权限，仅允许授权管理员登录，以降低低权限本地用户利用网络配置脚本注入系统命令提权至 root 的风险。"
score = 8.5
severity = "HIGH"
sources = ["zdi"]
title = "Phoenix Contact CHARX SEC 系列网络配置脚本命令注入漏洞"
updated = "2026-07-30T14:31:21.447"

