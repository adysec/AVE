[basic]
description = "tags.<value>Alabanza Control Panel 是一款用于管理网站托管服务的控制面板软件。该软件存在认证绕过漏洞，其 nsManager.cgi CGI 程序在处理域名管理请求时未对用户身份进行有效验证，远程攻击者无需提供密码即可直接访问管理命令。攻击者可利用此漏洞未经授权修改目标系统上的域名信息，包括更改域名解析记录、重定向流量或干扰正常服务运行。该漏洞影响使用 Alabanza Control Panel 3.0 版本的服务器，攻击条件为目标服务器运行该控制面板且暴露 nsManager.cgi 接口，攻击者仅需向该 CGI 程序发送特制请求即可完成利用，无需事先获取凭据或进行复杂交互。"
published = "2000-12-11T05:00:00Z"
remediation = "Alabanza Control Panel 3.0 的 nsManager.cgi 程序存在身份验证绕过漏洞，远程攻击者无需密码即可修改域名及 MX、CNAME 记录。建议立即联系 Alabanza 厂商获取安全补丁或升级版本；如厂商已停止支持，应在 Apache 或 IIS 中通过访问控制规则限制对 /cp/rac/nsManager.cgi 的外部访问，并将域名管理操作迁移至支持身份验证的 cPanel、Plesk 或其他主流控制面板。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Alabanza Control Panel 未授权修改域名信息漏洞"
updated = "2026-06-16T21:52:59Z"

