[basic]
description = "CVE-2001-1028是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-05-28T04:00:00Z"
remediation = "立即将 man 命令升级到 1.6 或更高版本，该版本已修复 ultimate_source 函数中的缓冲区溢出漏洞。如无法立即升级，可临时限制本地用户对 man 命令的执行权限，通过 chmod 移除普通用户的 sudo 权限或使用 PAM 模块进行访问控制。同时检查系统中是否存在恶意构造的 man 页面文件，删除或隔离来源不明的 man 手册文件以降低被利用风险。"
score = 7.2
