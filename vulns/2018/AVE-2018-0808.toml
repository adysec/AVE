[basic]
description = "TIBCO JasperReports Server 等产品的 Spring Web Flow 组件存在路径遍历漏洞（CWE-22），已通过身份认证的攻击者可构造恶意请求遍历目录并读取 Web 应用关键配置文件（如数据库连接字符串、加密密钥、管理员凭证等），导致敏感信息泄露。该漏洞影响 TIBCO JasperReports Server 6.4.2 及之前版本、JasperReports Server Community Edition 6.4.2 及之前版本、JasperReports Server for ActiveMatrix BPM、Jaspersoft for AWS 等多个版本，CVSS 评分 8.8，危害等级高。攻击者只需拥有有效账户即可利用，无需额外权限，ExploitDB 上已有公开利用代码。TIBCO 已发布安全更新修复此漏洞，建议用户升级至修复版本。"
published = "2018-04-17T18:29:00Z"
remediation = "建议按照以下对应关系升级修复：JasperReports Server 6.2.4 及更早版本升级至 6.2.5 或更高；6.3.0/6.3.2/6.3.3 版本升级至 6.3.4 或更高；6.4.0/6.4.2 版本升级至 6.4.3 或更高。社区版、ActiveMatrix BPM 版及所有 AWS 版本（含 Multi-Tenancy 和 Reporting and Analytics）均升级至 6.4.3 或更高。如无法立即升级，可在反向代理或 WAF 层对 /flow.html 的 page 参数实施白名单校验，禁止包含 ../ 等目录遍历序列，并限制低权限用户对 WEB-INF 目录及配置文件的访问。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "TIBCO JasperReports Server Spring Web Flow 路径遍历信息泄露漏洞"
updated = "2026-06-17T02:00:17Z"

