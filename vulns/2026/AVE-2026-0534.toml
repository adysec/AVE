[basic]
description = "Windows 内核（Secure Kernel）中存在双重释放（Double Free）漏洞（CWE-415），已获得授权的本地攻击者可通过向受影响的 Windows 系统发送特制的系统调用，触发内核对象的内存双重释放，进而实现权限提升至 SYSTEM 级别。该漏洞影响 Windows 内核的虚拟安全模式（VSM）组件，攻击者需具备本地登录权限方可利用。CVSS 评分 7.8，危害等级高。微软尚未发布官方安全更新，但已有公开 PoC 代码可供参考。"
published = "2026-04-14T18:16:54Z"
remediation = "立即安装 Microsoft 2026 年 4 月安全更新（对应 CVE-2026-26179 的 Windows Secure Kernel 修复补丁），可通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载。该漏洞位于 Windows Secure Kernel (VTL1) 中，攻击者需已在目标系统上获得高权限代码执行能力方可利用。如无法立即打补丁，建议限制本地高权限用户的登录范围，并启用 Credential Guard 和 Device Guard 等基于虚拟化的安全功能作为深度防御措施。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Microsoft Windows Kernel 双释放本地权限提升漏洞"
updated = "2026-06-17T10:25:53Z"

