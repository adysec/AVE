[basic]
description = "这是一个利用使用后释放漏洞攻击 Microsoft Office Visio 的远程代码执行漏洞。攻击者通过向目标系统发送精心 crafted 的 Visio 文件，利用程序在处理特定文件时出现的内存使用后释放漏洞，触发缓冲区溢出或代码执行。攻击无需身份验证，只需诱骗受害者打开恶意文件即可，而攻击复杂度较低。当漏洞被利用时，攻击者可以完全控制受影响系统，执行任意代码，窃取敏感数据，甚至破坏系统完整性。该漏洞影响各种 Windows 版本上的 Microsoft Office Visio 产品，CVSS 评分高达 7.8（高级别），危害极其严重。微软已发布安全更新修复此漏洞，用户应及时安装补丁以确保系统安全。"
published = "2025-01-14T18:16:00Z"
remediation = "建议立即通过 Microsoft 官方安全更新渠道（https://aka.ms/OfficeSecurityReleases）安装 2025 年 1 月发布的 Visio 安全更新。Microsoft 365 Apps for Enterprise 用户应确保通过 Microsoft 365 更新通道获取最新版本；Office 2019/LTSC 2021/LTSC 2024 用户需安装对应版本的安全更新补丁。如无法立即打补丁，可配置组策略禁止从网络位置打开 Visio 文件，并提醒用户不要打开来源不明的 Visio 文档作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Office Visio 远程代码执行漏洞"
updated = "2026-06-17T08:43:09Z"

