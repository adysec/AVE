[basic]
description = "Postaci 是用于 PostgreSQL 数据库的前端 Web 应用程序，其 1.1.2 和 1.1.3 版本中的 deletecontact.php 脚本存在 SQL 注入漏洞。该程序未对用户输入进行充分的字符过滤，未正确过滤分号等特殊字符，导致未经身份认证的远程攻击者可以通过构造恶意的 SQL 语句作为输入参数提交到 deletecontact.php，从而在数据库层面执行任意 SQL 查询。攻击者利用此漏洞可绕过身份验证、篡改或窃取数据库中的敏感数据，甚至进一步提升权限控制。该漏洞影响范围涵盖使用 Postaci 前端管理 PostgreSQL 数据库的系统，CVSS v3 评分为 7.5，危害等级为高。攻击者只需通过网络向目标系统发送特制的 HTTP 请求即可触发漏洞，利用门槛较低。"
published = "2001-03-26T05:00:00Z"
remediation = "修复 deletecontact.php 中的 SQL 注入漏洞：对所有用户输入使用 pg_escape_string() 或改用 pg_query_params() 参数化查询，禁止直接将 $_GET/$_POST 变量拼入 SQL 语句。Postaci 项目已停止维护且无官方补丁，建议迁移至仍在维护的 Webmail 系统（如 Roundcube）。临时缓解措施可在 Apache/Nginx 层配置 WAF 规则，拦截对 deletecontact.php 的 SQL 关键字注入请求。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Postaci 邮件系统 deletecontact.php SQL注入漏洞"
updated = "2026-06-16T21:53:52Z"

