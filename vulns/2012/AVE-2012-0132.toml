[basic]
description = "Apple Mac OS X 10.7.4 之前版本的 QuickTime 在处理渐进式下载影片文件中的音频采样表时存在缓冲区溢出漏洞。远程攻击者可诱导用户访问恶意构造的影片文件，触发该漏洞导致任意代码执行或应用程序崩溃。该漏洞影响 Mac OS X 10.7.4 及更早版本，CVSS 评分 6.8，危害等级中危。用户需升级至 Mac OS X 10.7.4 或更新版本以修复此漏洞。"
published = "2012-05-11T03:49:59Z"
remediation = "升级 Mac OS X 至 10.7.4 或更高版本（通过软件更新或下载组合更新），该版本已包含修复后的 QuickTime。Windows 用户升级 QuickTime 至 7.7.2 或更高版本。如无法立即升级，可在浏览器中禁用 QuickTime 插件，并避免打开来源不明的媒体文件。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Mac OS X QuickTime 音频采样表处理缓冲区溢出漏洞"
updated = "2026-06-16T23:38:01Z"

