[basic]
description = 'IPSWITCH IMail 6.04 及更早版本的 Web 服务器存在目录遍历漏洞，远程未认证攻击者可通过构造包含 ".." 目录遍历序列的恶意 HTTP 请求，绕过路径限制读取或删除服务器上任意文件。该漏洞源于 Web 服务器对文件路径参数缺乏有效的路径规范化和边界检查，攻击者无需身份认证即可远程利用，攻击复杂度低，CVSS 评分 6.4（中危），影响机密性与完整性，可导致敏感文件泄露或关键系统文件被删除，影响 IPSWITCH IMail 6.04 及更早版本。'
published = "2000-10-20T04:00:00Z"
remediation = "建议立即升级 Ipswitch IMail 至 6.05 或更高版本以修复目录遍历漏洞。若无法立即升级，请在防火墙层面限制 IMail Web 服务器端口 (默认 80/443) 仅允许可信 IP 访问，或暂时禁用 Web 邮件服务功能作为临时缓解措施。建议同时检查服务器文件系统权限，限制 Web 服务进程对敏感目录的读写权限。"
score = 6.4
severity = "MEDIUM"
sources = ["avd"]
title = "思必奇 IMail 6.x 文件附件漏洞"
updated = "2026-06-16T21:52:27Z"

