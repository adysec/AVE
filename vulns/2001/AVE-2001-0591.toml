[basic]
description = "Cisco 600 系列路由器上运行的 CBOS 2.4.1 及更早版本的 Web 管理接口存在输入验证缺陷，远程攻击者无需认证即可通过向目标设备发送一个末尾不含空格字符的特制 URL 请求触发拒绝服务，导致设备无法正常响应。该漏洞影响 Cisco 600 系列路由器，CVSS 评分 5.0，危害等级中等。目前官方已发布修复建议，建议用户升级至 CBOS 2.4.2 或更高版本。"
published = "2001-02-16T05:00:00Z"
remediation = "升级 Cisco 600 系列路由器 CBOS 至 2.4.2 或更高版本，该版本已修复 URL 解析异常导致的拒绝服务问题。如无法立即升级，可在路由器访问控制列表（ACL）中限制对 Web 管理界面的访问来源 IP，仅允许受信任的管理地址连接，降低攻击面。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Cisco CBOS Web 接口拒绝服务漏洞"
updated = "2026-06-16T21:53:34Z"

