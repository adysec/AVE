[info]
author = "ave"
description = "验证 Microsoft Windows Media Player 7 .wmz 皮肤文件任意 Java 小程序执行漏洞。攻击者通过 IFRAME 加载恶意 .wmz 皮肤文件到已知目录，随后通过 JavaScript setTimeout 打开包含 APPLET 标签的第二页，引用本地已下载的 Java 类文件执行任意代码。PoC 检测恶意 HTML 页面中是否包含 IFRAME 引用 .wmz 文件及 setTimeout 跳转的第二阶段页面。"
id = "POC-AVE-2001-0054"
name = "CVE-2001-0137 PoC"
severity = "medium"
tags = ["ave-2001-0054"]
vuln_id = [
    "CVE-2001-0137",
    "AVE-2001-0054",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<IFRAME",
    ".wmz",
]

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "setTimeout",
    "wmp7-3a.html",
]
