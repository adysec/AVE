[info]
author = "ave"
description = "通过构造包含恶意 src 属性的 XML 数据岛 HTML 页面，检测目标是否可被用于读取本地文件。该漏洞影响 IE 5.01/5.5/6.0。"
id = "POC-AVE-2002-0368"
name = "Microsoft Internet Explorer 5/6 XML Redirect File Disclosure PoC"
severity = "medium"
tags = [
    "cve-2002-0648",
    "ie",
    "xml",
    "file-disclosure",
]
vuln_id = [
    "CVE-2002-0648",
    "AVE-2002-0368",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<xml"]
