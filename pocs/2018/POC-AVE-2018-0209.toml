[info]
author = "AVE"
description = "检测 Fortinet FortiOS/FortiProxy SSL VPN Web 门户是否存在堆缓冲区溢出漏洞（CVE-2018-13383）。通过访问 SSL VPN 登录页面识别设备型号与固件版本，判断是否属于受影响版本范围。"
id = "POC-AVE-2018-0209"
name = "Fortinet FortiOS SSL VPN 堆缓冲区溢出漏洞 PoC"
severity = "medium"
tags = [
    "cve-2018-13383",
    "fortinet",
    "fortios",
    "ssl-vpn",
    "heap-overflow",
]
vuln_id = [
    "CVE-2018-13383",
    "AVE-2018-0209",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/remote/login"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "FortiGate",
    "Fortinet",
    "SSL VPN",
]
