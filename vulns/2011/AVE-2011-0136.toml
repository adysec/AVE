[basic]
description = "Opera Web Browser 在 11.50 版本之前存在 SVG BiDi 实现中的未指定漏洞。远程攻击者可通过发送特制的恶意网页内容（涉及 SVG 双向文本渲染），触发浏览器处理错误，导致应用程序崩溃或无响应，造成拒绝服务。该漏洞影响所有使用 Opera 11.50 之前版本的桌面用户，攻击条件为受害者访问包含恶意 SVG 内容的网页，无需身份认证即可触发。Microsoft 并未发布此漏洞的修复补丁，用户需升级至 Opera 11.50 或更高版本以消除风险。"
published = "2011-07-01T10:55:02Z"
remediation = "立即将 Opera 浏览器升级至 11.50 或更高版本，该版本修复了 SVG BiDi 实现中的拒绝服务漏洞。升级后重启浏览器即可消除漏洞影响。如无法立即升级，可在浏览器设置中禁用 SVG 渲染作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera Opera浏览器 SVG BiDi 拒绝服务漏洞"
updated = "2026-06-16T23:31:40Z"

