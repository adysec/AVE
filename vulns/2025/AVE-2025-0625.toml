[basic]
description = "Google Chrome（Chromium 内核）Profiles 组件中存在释放后使用（Use After Free）漏洞，对应 CWE-416。攻击者可通过诱使用户安装恶意扩展程序，随后借助特制的 HTML 页面触发堆损坏，导致远程代码执行或信息泄露。该漏洞影响 134.0.6998.35 之前版本的 Google Chrome，以及基于 Chromium 的 Microsoft Edge 等浏览器。攻击需用户交互（安装扩展+访问恶意页面），CVSS 评分 8.8，危害等级高危。Google 已在 Chrome 134.0.6998.35 版本中修复此漏洞。"
published = "2025-03-05T04:15:11Z"
remediation = "立即将 Google Chrome 升级至 134.0.6998.35 及以上版本，Microsoft Edge 升级至 134.0.3124.51 及以上版本。可通过浏览器内置「关于」页面检查更新并自动安装。对于无法立即升级的环境，建议禁用第三方扩展安装权限，并在组策略中设置 ExtensionInstallBlockList 为 * 以阻止所有未授权扩展加载。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome Profiles 释放后使用漏洞"
updated = "2026-06-17T08:40:20Z"

