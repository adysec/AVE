[basic]
description = "Ultraboard 2000 2.11 默认安装时会将 Skins、Database 和 Backups 目录设置为全局可写权限。本地攻击者无需身份验证即可修改这些目录中的敏感信息，或在其中插入并执行 CGI 程序，进而借助 Web 服务器权限执行任意代码。该漏洞影响 Ultraboard 2000 2.11 及之前版本，攻击者只需获得目标系统的本地访问权限即可利用，利用方式简单且无需复杂操作，可能导致论坛数据泄露、网站被篡改或服务器被完全控制。"
published = "2001-03-12T05:00:00Z"
remediation = "由于Ultraboard 2000原始厂商已停止运营且未发布补丁版本，请立即对安装目录下的Skins、Database和Backups目录执行权限修复：运行chmod 755 $(find /path/to/ub2k/cgi -perm 777)将世界可写权限（777）改为755，禁止普通用户写入。若无法使用find命令，需逐一修正上述三个目录的权限。此外，建议迁移至受支持的论坛系统，避免因软件已停止维护而持续暴露于其他未修复漏洞风险中。"
score = 2.1
severity = "LOW"
sources = ["tenable"]
title = "Ultraboard 2000 目录权限配置不当漏洞"
updated = "2026-06-16T21:53:44Z"

