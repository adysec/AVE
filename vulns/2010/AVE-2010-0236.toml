[basic]
description = "RealNetworks RealPlayer 的 RichFX 组件存在栈缓冲区溢出漏洞。攻击者可构造特制的媒体文件，诱使用户在受影响版本的 RealPlayer 中打开，触发栈缓冲区溢出，从而实现远程代码执行，完全控制目标系统。该漏洞影响 RealPlayer 11.0 至 11.1、RealPlayer SP 1.0 至 1.1.4 以及 RealPlayer Enterprise 2.1.2 版本，CVSS 评分 10.0，无需认证即可远程利用，危害严重。用户应及时升级至 RealPlayer SP 12.0.0.879 或更高版本以修复此漏洞。"
published = "2010-10-19T00:00:01Z"
remediation = "立即升级 RealPlayer SP 至 12.0.0.879 或更高版本，RealPlayer 11.x 用户升级至 12.0.0.879，RealPlayer Enterprise 2.1.2 用户联系厂商获取安全补丁。如无法升级，建议卸载 RichFX 组件或在防火墙中阻止 RealPlayer 访问不可信来源的媒体文件。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer RichFX 组件栈缓冲区溢出漏洞"
updated = "2026-06-16T23:23:26Z"

