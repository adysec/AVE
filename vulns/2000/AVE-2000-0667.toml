[basic]
description = "LPRng 3.6.24 版本在 use_syslog() 函数中存在格式化字符串漏洞。远程攻击者可以通过向目标服务发送经过特殊设计的恶意请求，触发该函数在处理日志记录时将用户输入直接作为格式化字符串解析。由于缺乏对输入内容的过滤，攻击者能够利用此漏洞在目标系统上执行任意命令，导致系统权限被完全接管。该漏洞影响所有运行 LPRng 3.6.24 版本的系统，且攻击无需身份认证即可远程触发，危害等级极高。"
published = "2000-12-19T05:00:00.000"
remediation = "建议立即将 LPRng 升级至 3.6.25 或更高版本，以修复 use_syslog() 函数中的格式字符串漏洞。若无法升级，可通过配置禁用 syslog 日志记录，或在防火墙中限制 LPRng 服务（TCP 515 端口）的外部访问权限作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "LPRng 远程命令执行漏洞"
updated = "2026-06-16T21:52:45.720"

