[basic]
description = "Microsoft IIS 4.0 和 5.0 中的 FrontPage 服务器扩展（FPSE）存在拒绝服务漏洞。远程攻击者可通过向目标服务器提交特制的畸形 Web 表单，触发 FPSE 在处理表单数据时发生异常，导致 IIS 服务进程崩溃或停止响应，造成拒绝服务。该漏洞无需身份认证即可远程利用，攻击复杂度低，影响运行 IIS 4.0/5.0 且启用了 FrontPage 服务器扩展的 Windows 服务器系统。Microsoft 已在安全公告 MS00-100 中发布相关补丁修复此漏洞。"
published = "2001-02-12T05:00:00Z"
remediation = "IIS 4.0 用户应立即安装微软安全公告 MS00-100 提供的补丁 Q280322i.EXE，或升级至 Windows NT 4.0 Service Pack 7；IIS 5.0 用户应安装对应补丁或升级至 Windows 2000 Service Pack 2。如无需 FrontPage Server Extensions 功能，建议通过命令 `fpsrvadm -o uninstall -p all` 将其卸载以彻底消除风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft IIS 4.0/5.0 FrontPage Server Extensions 拒绝服务漏洞"
updated = "2026-06-16T21:53:38Z"

