[basic]
description = "Opera 6.0.1 及 6.0.2 版本存在任意文件泄漏漏洞。远程攻击者可通过构造包含换行符的 `<input type=file>` 标签值，诱使受害者访问恶意网页，从而在无需用户交互的情况下静默上传客户端本地任意文件。该漏洞利用方式简单，攻击者仅需诱导用户浏览恶意站点即可窃取敏感文件，影响范围涉及使用上述版本 Opera 浏览器的所有用户。"
published = "2002-10-04T04:00:00Z"
remediation = "升级 Opera 浏览器至 6.0.3 或更高版本，该版本已修复 input type=file 标签换行符绕过导致任意文件上传的问题。如无法升级，可禁用 JavaScript 或使用 NoScript 类扩展阻止自动表单提交，同时在浏览器安全设置中关闭「允许网页自动上传文件」选项作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Opera 6.0.1/6.0.2 任意文件泄漏漏洞"
updated = "2026-06-16T21:58:21Z"

