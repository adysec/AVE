[basic]
description = "Google Chrome 浏览器所集成的 V8 JavaScript 引擎存在输入验证漏洞（CWE-125），远程未经身份认证的攻击者可通过构造恶意网页或 JavaScript 代码触发引擎中的无效读取操作，导致浏览器崩溃或拒绝服务。该漏洞影响 Google Chrome 17.0.963.83 之前的所有版本，攻击者无需任何凭据即可通过网络向目标浏览器发送特制内容触发漏洞，攻击复杂度中等。V8 引擎在处理 JavaScript 代码时未能正确验证内存读取边界，攻击者利用此漏洞可使浏览器进程异常终止，造成拒绝服务攻击。"
published = "2012-03-22T16:55:01Z"
remediation = "立即将Google Chrome升级至17.0.963.83或更高版本以修复V8引擎无效读取漏洞。如无法立即打补丁，可通过浏览器设置禁用JavaScript作为临时缓解措施，阻止攻击者利用该漏洞触发拒绝服务。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome V8 JavaScript 引擎无效读取导致拒绝服务漏洞"
updated = "2026-06-16T23:32:32Z"

