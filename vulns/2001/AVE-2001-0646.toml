[basic]
description = "Cisco Aironet AP340 无线接入点基站在建立 TCP 连接时生成的初始序列号（ISN）可被预测，导致远程攻击者能够伪造或劫持已建立的 TCP 会话。该漏洞影响使用 Cisco AP340 系列无线基站的网络环境，攻击者无需身份认证即可利用可预测的 ISN 发起 TCP 会话劫持攻击，进而截获敏感数据、注入恶意流量或中断合法通信。CVSS 评分 4.6，危害等级为中等。Cisco 已通过固件更新修复了 ISN 随机化问题。"
published = "2001-01-01T05:00:00.000"
remediation = "建议立即更新 Cisco Aironet AP340 固件至支持随机 TCP 初始化序列号生成的版本（如 v12.5 或更高版本）。如无法立即更新，可通过配置设备禁用易受攻击的 TCP 连接模式，或在网络边界部署 IPsec 隧道以保护流经 AP340 的所有 TCP 会话流量，从源头防止序列号预测攻击。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Cisco Aironet AP340 TCP序列号可预测漏洞"
updated = "2026-06-16T21:53:47.250"

