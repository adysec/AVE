[basic]
description = "Linux 内核 virtio-blk 驱动在系统挂起过程中存在死锁漏洞。提交 4ce6e2db00de 将队列暂停（quiesce）替换为队列冻结（freeze）以排空正在传输的 I/O 请求，但冻结操作会阻塞 bio_queue_enter() 调用，若挂起上下文中触发该调用则导致死锁。本地攻击者可通过触发系统挂起操作利用此漏洞，造成拒绝服务（系统崩溃）。该漏洞影响所有使用 virtio-blk 的 Linux 内核版本，CVSS 评分 5.5，危害等级中危。"
published = "2025-01-21T13:15:09Z"
remediation = "立即升级 Linux 内核至以下已修复版本：5.4.289+、5.10.233+、5.15.176+、6.1.123+、6.6.69+、6.12.8+ 或包含提交 92d5139b9114 的更新内核。对于使用 virtio-blk 的虚拟化环境，如无法立即升级，可在系统休眠前手动卸载相关 virtio-blk 设备模块（rmmod virtio_blk），休眠完成后再重新加载，以避免因队列冻结导致的死锁。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 virtio-blk 驱动系统挂起时队列冻结不当导致拒绝服务漏洞"
updated = "2026-06-17T08:14:17Z"

