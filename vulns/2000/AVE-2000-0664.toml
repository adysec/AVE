[basic]
description = "Pine 4.21及更早版本的自动邮件检查组件存在缓冲区溢出漏洞。远程攻击者可通过向目标用户发送包含超长 From 头的恶意邮件，触发缓冲区溢出，从而在受害者系统上执行任意命令。攻击者无需身份认证，只需诱使用户使用 Pine 客户端接收并处理恶意邮件即可触发。该漏洞影响 UoW Pine 4.0.4、4.10、4.21 等版本，CVSS 评分 7.5，危害等级高。目前已存在公开的远程利用代码。"
published = "2000-12-19T05:00:00Z"
remediation = "立即升级 Pine 邮件客户端至 4.22 或更高版本。各发行版用户：FreeBSD 用户更新 pine4 port 至 4.21_1；Red Hat 用户安装 RHSA-2000:102 提供的更新包；Mandrake 用户安装 MDKSA-2000:073 补丁。如无法升级，建议卸载 Pine 改用其他邮件客户端（如 Mutt），或禁用自动检查新邮件功能作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "University of Washington Pine 邮件自动检查组件 From 字段缓冲区溢出漏洞"
updated = "2026-06-16T21:52:44Z"

