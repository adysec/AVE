[basic]
description = "Check Point FireWall-1 防火墙产品存在拒绝服务漏洞，未经身份认证的远程攻击者可通过向目标设备的 264 端口发送大量数据包（即泛洪攻击）来触发该漏洞。由于 FireWall-1 在处理到达 264 端口的异常高流量时缺乏适当的速率限制和资源保护机制，攻击者发送的数据包洪流会持续占用目标系统大量 CPU 资源，导致防火墙性能急剧下降甚至完全停止响应网络流量，从而造成合法用户的网络访问中断，影响范围包括所有部署了受影响版本 Check Point FireWall-1 的企业网络边界安全防护。该漏洞利用条件极为简单：攻击者仅需在网络中能够访问目标 FireWall-1 的 264 端口即可发起攻击，无需任何身份验证凭据，攻击复杂度低，危害等级中等。Check Point 已通过发布安全更新修复了该漏洞，管理员应尽快升级至修复版本，并考虑在网络边界对 264 端口实施访问控制限制以降低被利用的风险。"
published = "2001-08-31T04:00:00.000"
remediation = "升级到 Check Point 已修复该漏洞的 FireWall-1 后续版本（FireWall-1 4.1 SP8 或更高版本），并确保已应用最新安全补丁包。在边界路由器或上游设备上配置 ACL 规则，阻断外部对端口 264 的未授权访问。如无法立即升级，可在防火墙层面设置速率限制（rate limiting）以控制流入端口 264 的数据包速率，并启用异常流量检测告警。建议同时检查 FireWall-1 日志中是否存在来自单一源 IP 的大规模连接请求，及时封禁可疑来源。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Check Point FireWall-1 拒绝服务漏洞"
