[basic]
description = "Gitea 仓库迁移功能存在服务端请求伪造（SSRF）漏洞。Gitea 1.25.4 在仓库迁移接口（POST /api/v1/repos/migrate）中正确验证了初始 URL，阻止了指向 127.0.0.1 等内网地址的请求。然而，当初始 URL 指向攻击者控制的服务器并返回 HTTP 302 重定向到内网地址时，Gitea 会跟随重定向而不进行二次验证。拥有普通用户权限的攻击者可利用此漏洞，以 Gitea 服务器为代理访问仅限本地或内网访问的服务，包括内部 Git 仓库、云元数据端点（169.254.169.254）、内部 API 及数据库等，导致敏感信息泄露。该漏洞影响 Gitea 1.25.4 及之前版本，CVSS 评分 6.5，危害等级中危。"
published = "2026-07-03T21:17:05Z"
remediation = "立即升级 Gitea 至 v1.26.4 或更高版本，该版本已合入 PR #38108 的修复，在跟随 HTTP 重定向时重新校验目标地址是否属于内网/回环地址。如无法立即升级，可在反向代理层配置规则，阻止 Gitea 服务器对外发起指向内网地址的 HTTP 请求，或临时禁用仓库迁移功能。"
score = 6.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Gitea Gitea 仓库迁移HTTP重定向服务器端请求伪造漏洞"
updated = "2026-07-06T18:18:46Z"

