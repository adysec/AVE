[basic]
description = "WordPress 的 WP Mailster 插件 1.5.5 之前版本中存在跨站脚本（XSS）漏洞，位于取消订阅处理模块。未经身份认证的远程攻击者可通过向 `view/subscription/unsubscribe2.php` 页面的 `mes` 参数注入恶意脚本代码，当管理员或其他用户访问包含恶意 payload 的链接时，脚本将在浏览器中执行，导致敏感信息泄露或会话劫持。攻击无需认证，但需用户交互（点击链接），影响使用该插件的 WordPress 站点。"
published = "2017-12-07T00:29:00Z"
remediation = "立即将 WP Mailster 插件升级至 1.5.5 或更高版本。如无法立即升级，可在 WordPress 后台禁用 WP Mailster 插件，或通过 Web 应用防火墙（WAF）规则拦截对 /view/subscription/unsubscribe2.php 的 mes 参数请求。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress WP Mailster 插件跨站脚本漏洞"
updated = "2026-06-17T01:10:49Z"

