[basic]
description = "Adobe Experience Manager（AEM）6.0 至 6.5 版本存在表达式语言注入漏洞（CWE-917），由于系统对表达式语言语句中使用的特殊元素转义处理不恰当，未经身份认证的远程攻击者可通过发送特制的 HTTP 请求注入恶意表达式语言代码。成功利用该漏洞可导致敏感信息泄露，攻击者可读取服务器端内存中的敏感配置、凭据或其他机密数据。该漏洞利用复杂度低，无需用户交互，攻击者可远程发起利用，影响部署了受影响版本 AEM 的所有实例。Adobe 已在后续安全更新中修复该漏洞，建议用户升级至最新版本。"
published = "2020-01-15T17:15:14Z"
remediation = "Adobe 官方安全公告 APSB20-01 已发布修复补丁。受影响用户应立即升级 Adobe Experience Manager 至 6.5.3.0 或更高版本，运行 6.4 及更早版本的用户需安装 Adobe 提供的对应 Service Pack。临时缓解措施：在防火墙或反向代理中限制对 AEM 实例的网络访问，仅允许可信 IP 访问 Author 和 Publish 环境，或暂时禁用 DAM 的 metadataeditor.external.html 组件以阻断攻击路径。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Adobe Experience Manager 表达式语言注入漏洞"
updated = "2026-06-17T02:22:19Z"

