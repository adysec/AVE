[basic]
description = "Windows 2000 Telnet Server 存在拒绝服务漏洞，远程攻击者无需身份认证即可通过向目标服务器的 Telnet 端口（默认 23）发送持续不断的二进制零字节流，导致 Telnet 服务进程崩溃，造成系统拒绝服务。该漏洞影响 Microsoft Windows 2000 系统，攻击条件低，无需用户交互，但仅影响服务可用性，不涉及数据泄露或权限提升。Exploit-DB 已公开 PoC 利用代码。"
published = "2000-06-30T04:00:00Z"
remediation = "安装微软 MS00-050 安全公告对应的补丁（KB Q267843），下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=24468975-8D52-485D-B018-4DA017799788。如无法立即打补丁，可在服务管理器中禁用 Telnet Server 服务（默认未启用）作为临时缓解措施。"
score = 5
severity = "MEDIUM"
