[basic]
description = '这是一个针对 mongo-express < 0.54.0 版本的严重远程命令执行漏洞。该漏洞利用了 `toBSON()` 函数处理用户输入时滥用 `vm` 依赖的不安全性，允许攻击者在不安全的环境中执行任意 Node.js 代码。攻击者无需身份验证即可远程发送精心构造的 POST 请求到 `/checkValid` 端点，通过 JavaScript 代码注入实现 RCE。受影响系统包括所有使用默认认证 `admin:pass` 的 Mongo Express 实例，攻击者可完全控制目标服务器、窃取敏感数据或将服务器用于进一步攻击。漏洞由 `vm` 依赖的不安全性引发，攻击者通过发送如 `document=this.constructor.constructor("return process")().mainModule.require("child_process").execSync("touch /tmp/success")` 的 payload 到 `/checkValid` 端点实现利用。CVSS 评分高达 9.9，评级为严重（CRITICAL）。'
published = "2019-12-24T22:15:11Z"
remediation = "立即将 mongo-express 升级至 0.54.0 或更高版本（npm install mongo-express@latest）。若暂时无法升级，请在应用层限制对管理接口的访问权限（如仅允受信 IP 访问 / 启用强认证），并在网络层通过防火墙禁止非必要的外部访问 mongo-express 端口（默认 8081）。"
score = 9.9
severity = "CRITICAL"
sources = ["kev"]
title = "mongo-express mongo-express 远程命令执行漏洞"
updated = "2026-06-17T02:11:36Z"

