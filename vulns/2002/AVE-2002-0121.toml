[basic]
description = "SNMPv1 协议实现中存在严重的请求处理漏洞，远程未经身份认证的攻击者可通过向目标设备发送特制的 GetRequest、GetNextRequest 或 SetRequest SNMP 消息触发该漏洞，导致目标系统拒绝服务或获取完全控制权限。该漏洞影响大量厂商的 SNMP 实现，包括 Cisco IOS 11/12 等广泛部署的网络设备，CVSS 评分 10.0，危害等级严重。芬兰 Oulu 大学开发的 PROTOS c06-SNMPv1 测试套件已公开验证该漏洞的存在。"
published = "2002-02-13T05:00:00Z"
remediation = "建议将 Cisco IOS 升级至 12.0(22)S、12.1(13)E 或 12.2(8)T 及更高版本（具体版本视平台而定），或安装 Cisco 于 2002 年 2 月发布的 SNMP 安全补丁。如无法立即升级，可在网络边界防火墙过滤 UDP 端口 161 和 162 以阻断外部 SNMP 流量，同时配置 ACL 限制 SNMP 仅允许受信任的管理站 IP 访问，并修改默认 SNMP community 字符串（public/private）为复杂随机值。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Cisco IOS SNMPv1 请求处理拒绝服务漏洞"
updated = "2026-06-16T21:56:35Z"

