[basic]
description = 'Unify eWave ServletExec AS v3.0C 存在 JSP 源代码泄露漏洞。远程攻击者无需身份认证，通过向目标服务器发送以特殊字符（如 "."、"+" 或 "%20"）结尾的 HTTP 请求，即可绕过 Servlet 容器的编译执行机制，直接读取 JSP 页面的原始源代码。该漏洞可导致攻击者获取 Web 应用的后端逻辑、数据库连接信息、硬编码凭证等敏感数据，为后续攻击提供信息支撑。攻击条件简单，无需特殊权限，危害中等。'
published = "2001-01-09T05:00:00.000"
remediation = "升级到 Unify ServletExec AS 3.0E 或更高版本，该版本已修复 JSP 源代码泄露问题。如无法升级，可在 Web 服务器前端配置 URL 重写规则，拦截以 `.`、`+`、`%20` 结尾的请求，或限制对 JSP 文件的直接访问权限。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Unify eWave ServletExec 3 JSP源代码泄露漏洞"
updated = "2026-06-16T21:53:10.633"

