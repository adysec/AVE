[basic]
description = "VTE（虚拟终端模拟器）在处理特定转义序列时存在命令注入漏洞。gnome-terminal 2.0/2.2 默认使用的 VTE 允许攻击者通过构造特殊的字符转义序列修改终端窗口标题，并将标题内容回插到用户终端的命令行中。当用户使用 cat、less 等命令查看包含恶意转义序列的文件时，该序列会被终端解析执行，导致攻击者在用户权限下执行任意命令。攻击者可借此窃取敏感信息、修改文件或执行其他恶意操作。该漏洞无需认证，远程攻击者可通过诱使用户访问恶意文件触发。"
published = "2003-03-03T05:00:00Z"
remediation = "升级 VTE 库至 0.11.10 及以上版本（Debian/Ubuntu 执行 `apt-get install libvte9`，Red Hat 执行 `yum update vte`）。如无法升级，可在终端模拟器配置中禁用窗口标题转义序列处理，或使用不受影响的终端模拟器（如 xterm）替代 gnome-terminal。"
score = 6.8
severity = "MEDIUM"
sources = ["redhat"]
title = "GNOME VTE 终端模拟器代码执行漏洞"
updated = "2026-06-16T22:01:27Z"

