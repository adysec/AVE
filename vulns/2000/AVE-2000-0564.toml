[basic]
description = "IRIX 5.2 至 6.1 版本中的 TelnetD 服务存在格式字符串漏洞，远程攻击者无需身份认证即可通过向目标系统的 telnet 服务发送特制的 IAC-SB-TELOPT_ENVIRON 请求，在 RLD 变量中注入超长格式字符串，触发格式化函数对用户可控数据的不当解析，最终实现任意命令执行。该漏洞 CVSS 评分 10.0，可导致攻击者完全控制受影响系统，危害极为严重。"
published = "2000-10-20T04:00:00.000"
remediation = "立即安装 SGI 官方安全补丁 20000801-02-P（可从 ftp://sgigate.sgi.com/security/20000801-02-P 获取），该补丁修复了 telnetd 对用户注入格式字符串处理不当的问题。如无法立即打补丁，可在 inetd 配置中禁用 telnet 服务（注释掉 telnet 行后重启 inetd），并在网络边界防火墙封禁 TCP 23 端口作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "SGI IRIX TelnetD 环境变量格式字符串远程代码执行漏洞"
updated = "2026-06-16T21:52:22.137"

