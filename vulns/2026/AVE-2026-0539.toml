[basic]
description = "Adobe ColdFusion 2023.18、2025.6及更早版本中存在输入验证不当漏洞（CWE-20）。未经身份认证的远程攻击者无需用户交互即可利用该漏洞，通过构造特制的请求绕过安全机制，导致未授权访问，破坏系统完整性。该漏洞影响广泛部署的 ColdFusion 应用服务器，CVSS 评分 7.5，危害等级高。Adobe 已发布安全更新修复此漏洞。"
published = "2026-04-14T22:16:29Z"
remediation = "立即升级 ColdFusion 至 2023.19 或 2025.7 及以上版本（参考 Adobe 安全公告 APSB26-38）。如无法立即升级，可在 ColdFusion 管理后台限制外部用户对受影响功能的访问，并启用输入验证过滤规则作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["zdi"]
title = "Adobe ColdFusion 输入验证安全特性绕过漏洞"
updated = "2026-07-25T11:10:00Z"

