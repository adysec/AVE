[info]
author = "ave"
description = "通过HTTP检测目标Flash Player版本是否低于10.1.102.64，该版本存在ActionScript类型混淆漏洞，可导致远程代码执行"
id = "POC-AVE-2010-0229"
name = "Adobe Flash Player 内存破坏远程代码执行漏洞 PoC"
severity = "critical"
tags = ["ave-2010-0229"]
vuln_id = [
    "CVE-2010-3654",
    "AVE-2010-0229",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "flash",
    "Flash",
]
