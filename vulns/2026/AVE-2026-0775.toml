[basic]
description = "sanitize-html 是一个 Node.js HTML 清理库，其 `allowedSchemesAppliedToAttributes` 默认仅包含 `['href', 'src', 'cite']`，但 HTML 规范定义了 `action`、`formaction`、`data`、`poster`、`background` 等 10 余个可接受 URI 的属性，这些属性均未被纳入默认验证列表。当开发者配置允许非默认标签（如 `form`）及对应属性（如 `action`）时，`javascript:` 等危险 URI 方案会绕过 `naughtyHref()` 函数检查，导致跨站脚本攻击（XSS）。攻击者可通过构造特制的表单或媒体元素，在用户提交表单或加载资源时执行任意 JavaScript 代码。该漏洞影响 sanitize-html v1.18.0 至 v2.17.2 版本，CVSS 评分 5.4，需非默认配置方可利用，常见于允许用户生成表单内容的 CMS 平台和富文本编辑器中。"
published = "2026-06-12T21:16:24Z"
remediation = "立即将 sanitize-html 升级至 2.17.5 或更高版本（npm update sanitize-html）。如无法升级，在配置中将 `allowedSchemesAppliedToAttributes` 扩展为 `['href', 'src', 'cite', 'action', 'formaction', 'data', 'poster', 'background', 'ping', 'xlink:href', 'dynsrc', 'lowsrc']`，并避免在 `allowedTags` 中启用 `form`、`object`、`video` 等含 URI 属性的标签。同时可部署 CSP 头 `form-action 'none'` 作为纵深防御。"
score = 5.4
severity = "MEDIUM"
sources = ["ghsa"]
title = "sanitize-html URI方案验证不完整导致跨站脚本漏洞"
updated = "2026-06-17T10:57:58Z"

