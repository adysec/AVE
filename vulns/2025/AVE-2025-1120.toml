[basic]
description = "Linux 内核的 UDP 协议栈实现中存在整数溢出漏洞。当应用程序通过 setsockopt() 系统调用将套接字的 SO_RCVBUF 选项设置为 INT_MAX 时，在 udp_destruct_common() 函数释放套接字接收队列时会累积 skb->truesize，随后将总大小传递给 udp_rmem_release() 函数进行内存核算调整。由于该函数接受有符号整数参数，总大小发生回绕导致溢出，使得 sk->sk_forward_alloc 变为负数，最终导致 UDP 内存使用量持续增长且永不释放。攻击者可通过本地低权限运行恶意程序，反复创建并关闭设置了超大接收缓冲区的 UDP 套接字，触发内核 UDP 内存核算泄漏，造成系统内存耗尽并引发间歇性数据包丢弃，影响系统网络服务的可用性。"
published = "2025-04-16T15:15:59Z"
remediation = "升级 Linux 内核至包含修复补丁的稳定版本。上游修复已合入各稳定分支：5.4 系列请升级至 5.4.301 或更高版本，5.10 系列请升级至 5.10.246，5.15 系列请升级至 5.15.195，6.1 系列请升级至 6.1.134，6.6 系列请升级至 6.6.87，6.12 系列请升级至 6.12.23，6.13 系列请升级至 6.13.11，6.14 系列请升级至 6.14.2。主流发行版用户可通过系统包管理器更新：Ubuntu 22.04 LTS 升级至 5.15.0-170.180，Ubuntu 24.04 LTS 升级至 6.8.0-86.87，Ubuntu 24.10 升级至 6.11.0-28.28，Ubuntu 25.04 升级至 6.14.0-22.22。Debian 12 用户请安装 dsa-5907 公告中的更新内核。如当前运行版本仍受影响且无法立即升级，可临时通过 sysctl 限制 UDP 接收缓冲区大小以降低触发风险：执行 echo 16777216 > /proc/sys/net/ipv4/udp_rmem_min 将最低接收缓冲区限制调低，避免应用程序设置过大 SO_RCVBUF 触发整数溢出。重启后可通过 cat /proc/net/sockstat | grep UDP 确认 UDP mem 字段不再异常增长。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 UDP 内存管理整数溢出漏洞"
updated = "2026-06-17T08:44:57Z"

