[basic]
description = "Windows VBScript 引擎在处理内存对象时存在越界写入漏洞（CWE-787）。远程攻击者可通过诱导用户访问包含特制 VBScript 代码的恶意网页，利用内存损坏漏洞在目标系统中执行任意代码。该漏洞广泛影响 Windows 7、Windows 8.1、Windows 10 以及 Windows Server 2008/2012/2016 等多个版本，攻击条件为用户需在浏览器中运行受影响的 VBScript 引擎。"
published = "2018-05-09T19:29:02Z"
remediation = "立即安装微软 2018 年 5 月发布的累积安全更新（针对不同系统版本，如 Windows 10 或 Server 2016），或通过 Windows Update 自动更新至最新补丁版本。作为临时缓解措施，建议禁用或限制 Internet Explorer 中 VBScript 的执行权限，或切换至 Edge 浏览器以降低被攻击风险。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows VBScript 引擎远程代码执行漏洞"
updated = "2026-06-17T02:04:24Z"

