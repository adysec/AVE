[basic]
description = "Mozilla Firefox 4.x至12.0、Firefox ESR 10.x至10.0.6、Thunderbird 5.0至12.0、Thunderbird ESR 10.x至10.0.6及SeaMonkey 2.10之前版本中的证书警告页面（about:certerror）存在点击劫持漏洞。中间人攻击者可通过在恶意页面中嵌入IFRAME元素，诱使用户在不知情的情况下为无效证书添加例外，从而绕过HTTPS证书验证机制，实施中间人攻击窃取敏感信息。该漏洞利用需要用户交互，CVSS评分4.0，危害等级中危。"
published = "2012-07-18T10:26:49Z"
remediation = "升级 Firefox 至 14.0 及以上版本，Firefox ESR 升级至 10.0.6 及以上版本，Thunderbird 升级至 ESR 10.0.6 及以上版本，SeaMonkey 升级至 2.10 及以上版本。如无法立即升级，可在 Web 服务器或反向代理层为 about:certerror 页面添加 X-Frame-Options: DENY 响应头，禁止页面被嵌入 iframe，作为临时缓解措施。"
score = 4
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 点击劫持漏洞"
updated = "2026-06-16T23:40:41Z"

