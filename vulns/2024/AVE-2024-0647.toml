[basic]
description = "Linux 内核 exfat 文件系统驱动中存在无限循环漏洞（CWE-835），当文件系统被恶意构造导致簇链中的某个簇指向自身时，exfat_readdir() 函数在遍历目录项时无法正确递增 dentry 计数器，导致循环无法正常退出。该漏洞使得 s_lock 无法释放，进而引发 exfat_sync_fs() 等其他任务挂起，造成系统拒绝服务。攻击者需要本地低权限访问，通过挂载特制的 exfat 文件系统镜像即可触发该漏洞，影响所有使用受影响 Linux 内核版本的系统。"
published = "2025-01-21T13:15:08Z"
remediation = "升级 Linux 内核至 6.13 及以上版本（commit fee873761bd9）。Debian 用户：bullseye 升级至 5.10.259-1，bookworm 升级至 6.1.177-1，trixie 升级至 6.12.96-1。Ubuntu 24.04 LTS 用户：更新至 linux-image-6.11.0-1011-lowlatency（USN-7381-1）。临时缓解措施：避免挂载来源不可信的 exFAT 文件系统镜像。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Kernel exfat 文件系统无限循环拒绝服务漏洞"
updated = "2026-06-17T08:14:16Z"

