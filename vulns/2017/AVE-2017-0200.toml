Oracle WebLogic Server 的 WLS Security 组件中存在 XMLDecoder 反序列化漏洞。受影响版本包括 10.3.6.0.0、12.1.3.0.0、12.2.1.1.0 和 12.2.1.2.0。攻击者无需身份认证，即可通过网络发送特制的 T3 协议数据包触发反序列化，导致远程代码执行并完全接管 WebLogic Server。该漏洞利用条件简单（网络访问、无需认证、无需用户交互），CVSS 3.1 评分 7.5（HIGH），危害严重。

