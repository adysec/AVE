[basic]
description = "Fortinet FortiOS 及 FortiProxy 的 SSL VPN Web 门户存在堆缓冲区溢出漏洞。该漏洞源于在代理网页时未能正确处理 JavaScript href 数据，导致已登录用户的 SSL VPN Web 服务异常终止。攻击者需具备低权限且通过网络远程触发，影响 FortiOS 6.0.0 至 6.0.4、5.6.0 至 5.6.10、5.4.0 至 5.4.12、5.2.14 及更早版本，以及 FortiProxy 2.0.0、1.2.8 及更早版本。CVSS 评分 4.3，危害等级中危。"
published = "2019-05-29T18:29:00Z"
remediation = "升级 FortiOS 至 6.0.5/5.6.11/5.4.13/5.2.15 及以上版本，FortiProxy 升级至 1.2.9 及以上版本。如无法立即升级，可临时禁用 SSL-VPN 服务（执行 config vpn ssl settings → unset source-interface），并为 SSL-VPN 用户启用双因素认证作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["kev"]
title = "Fortinet FortiOS SSL VPN 堆缓冲区溢出漏洞"
updated = "2026-06-17T01:39:18Z"

