[basic]
description = "GnuPG 1.2.2 之前版本中的密钥验证代码在处理包含多个用户 ID 的密钥时存在逻辑缺陷，错误地将所有用户 ID 中最高可信度赋值为整个密钥的有效性等级。远程攻击者可通过向目标用户发送精心构造的、包含不可信用户 ID 的密钥，绕过 GnuPG 对非可信路径用户 ID 的警告机制，诱导加密方使用不可信密钥进行加密通信，导致机密信息泄露。该漏洞影响所有 GnuPG 1.2.2 之前版本，CVSS 评分 10.0，危害等级严重。"
published = "2003-05-27T04:00:00.000"
remediation = "立即升级 GnuPG 至 1.2.2 或更高版本。各发行版用户：Red Hat 执行 `up2date gnupg` 或安装 RHSA-2003:175/176 更新包；Debian/Ubuntu 执行 `apt-get update && apt-get install gnupg`；Gentoo 执行 `emerge --sync && emerge -u gnupg`；Mandriva 安装 MDKSA-2003:061 更新。如无法升级，避免使用多 User ID 的 GPG 密钥进行加密操作，并手动验证每个 User ID 的信任链。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "GNU GnuPG 多用户ID密钥可信路径验证漏洞"
updated = "2026-06-16T22:01:51.030"

