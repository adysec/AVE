[basic]
description = "Apache Spark 2.1.0至2.1.2、2.2.0至2.2.1以及2.3.0版本中存在反射型跨站脚本（XSS）漏洞。恶意攻击者可构造指向Spark集群Web UI的作业和阶段信息页面的特制URL，诱使用户访问后，可在用户浏览器中执行任意JavaScript脚本，窃取用户视角下的Spark UI敏感信息。虽然Chrome和Safari等现代浏览器可拦截此类攻击，但Firefox等浏览器无法有效防御。攻击者需具备低权限且依赖用户交互，CVSS评分5.4，危害等级中危。"
published = "2018-07-12T13:29:00Z"
remediation = "2.1.x 用户升级至 Apache Spark 2.1.3 或更高版本，2.2.x 用户升级至 2.2.2 或更高版本，2.3.x 用户升级至 2.3.1 或更高版本。如无法立即升级，可在反向代理或 WAF 层面过滤包含恶意脚本参数的 Spark UI 请求 URL，并限制 Spark UI 仅对内网可信网络开放，避免暴露到公网。"
score = 5.4
severity = "MEDIUM"
sources = ["nuclei"]
title = "Apache Spark URL 跨站脚本漏洞"
updated = "2026-06-17T02:04:06Z"

