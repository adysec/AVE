[info]
author = "ave"
description = "Phusion WebServer 1.0 在处理 HTTP 请求时存在缓冲区溢出漏洞，未对 URL 字段进行充分长度检查。远程攻击者通过发送超长 URL 的 GET 请求，使服务器栈缓冲区溢出，造成拒绝服务或远程代码执行。攻击无需身份认证，目标通常以 SYSTEM 权限运行，影响 Phusion WebServer 1.0 在 Windows 上的所有版本。"
id = "POC-AVE-2002-0250"
name = "CVE-2002-0289 Phusion WebServer Remote Buffer Overflow PoC"
severity = "medium"
tags = ["ave-2002-0250"]
vuln_id = [
    "CVE-2002-0289",
    "AVE-2002-0250",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[[poc.requests.matchers]]
expect = false
part = "body"
status = [0]
type = "status"
