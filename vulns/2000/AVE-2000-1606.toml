[basic]
description = "Microsoft Word 的邮件合并功能存在安全漏洞，当用户打开包含恶意 Visual Basic for Applications（VBA）脚本的 Access 数据库作为邮件合并数据源时，Word 不会在执行前向用户弹出安全警告或提示，导致 VBA 脚本在用户无感知的情况下自动执行。远程攻击者可以构造特制的 Access 数据库文件，通过邮件合并功能诱导用户打开，从而在目标系统上以当前用户权限执行任意命令。该漏洞影响 Microsoft Word 多个版本，CVSS v2 评分为 10.0，危害等级严重。Microsoft 已在安全公告 MS00-071 中发布相关修复措施。"
published = "2000-10-20T04:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-071 提供的补丁：Word 2000 用户下载并安装 KB274226 补丁，Word 97 用户下载并安装 KB272749 补丁。该补丁会强制对 Word 文件中 Access 邮件合并数据源进行区域检查，当检测到文件来自 Internet 或受限站点区域时将弹出对话框提示用户。如无法立即打补丁，可在防火墙层面阻止出站 TCP 端口 135-139 和 445，阻断远程 Access 数据库的 UNC 访问路径；同时教育用户不要打开来自不可信来源的 Word 邮件合并附件或链接。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Microsoft Word 邮件合并工具代码执行漏洞"
updated = "2026-06-16T21:52:28.940"

