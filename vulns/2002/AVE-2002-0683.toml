[basic]
description = "NPDS 4.8 存在跨站脚本（XSS）漏洞，源于该系统对新闻帖子中的 HTML 代码过滤不严，远程攻击者可在新闻消息中注入恶意 JavaScript 脚本（例如通过 IMG 标签的 SRC 属性嵌入 javascript: 伪协议代码）。当其他用户浏览包含恶意脚本的新闻帖子时，该脚本将在用户浏览器中以目标网站的上下文执行，导致会话劫持、Cookie 窃取或页面内容篡改等后果。该漏洞影响基于 PHP 的 NPDS 4.8 版本，攻击者无需身份认证即可远程利用，CVSS 评分为 4.3，危害等级为中等。"
published = "2002-12-31T05:00:00Z"
remediation = "立即升级 NPDS 到最新可用版本以修复此漏洞。如暂无官方补丁，应在新闻发布模块对用户提交内容实施严格的 HTML 过滤与 JavaScript 标签移除，确保所有动态输出进行 HTML 实体编码，并在 Web 服务器前端部署 Web 应用防火墙以拦截包含 &lt;script&gt;、onerror 等特征的恶意请求。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "NPDS 4.8 News Message 跨站脚本攻击漏洞"
updated = "2026-06-16T22:00:00Z"

