[basic]
description = "Windows Installer 存在特权提升漏洞，源于其对特权操作权限管理不当（CWE-269）。本地低权限攻击者可通过运行特制的恶意应用程序触发该漏洞，利用 Windows Installer 服务以 SYSTEM 权限执行任意代码，从而完全控制目标系统。该漏洞影响所有受支持的 Windows 版本，CVSS 评分 7.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中发布补丁修复此漏洞。"
published = "2025-01-14T18:15:49Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新。Windows 11 24H2/23H2 用户安装 KB5050021，Windows 11 22H2 用户安装 KB5050021，Windows 10 22H2 用户安装 KB5049981，Windows Server 2025/2022/2019 用户安装对应月度安全更新。可通过 Windows Update 自动获取更新，或从 Microsoft Update Catalog 手动下载安装。如无法立即打补丁，建议限制本地用户权限，避免非授权用户交互式登录系统。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Installer 特权提升漏洞"
updated = "2026-06-17T08:42:59Z"

