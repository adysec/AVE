[basic]
description = "dnsmasq 的 extract_name() 函数存在堆缓冲区溢出漏洞，未经身份认证的远程攻击者可通过向目标系统发送特制的 DNS 请求触发该漏洞，导致堆缓冲区溢出，从而注入虚假 DNS 缓存条目，将合法域名解析重定向至攻击者控制的 IP 地址，实现 DNS 缓存投毒攻击，或造成拒绝服务。该漏洞影响 dnsmasq 2.92 及之前版本，CVSS 评分 7.3，危害等级高。各发行版已发布安全更新修复此漏洞，建议用户升级至 dnsmasq 2.93 或应用对应补丁。"
published = "2026-05-11T18:16:31Z"
remediation = "立即升级 dnsmasq 至 2.93 或更高版本。如无法升级，可应用 OpenWrt/iStoreOS 等发行版提供的 CVE-2026-2291 补丁（001-CVE-2026-2291.patch）。Pi-hole 用户需升级 FTL 至 v6.6.2 或更高版本。openSUSE 用户安装 openSUSE-SU-2026:21192-1 安全更新。作为临时缓解措施，可在网络边界限制对 DNS 服务的访问并监控异常 DNS 响应。"
score = 7.3
severity = "HIGH"
sources = ["zdi"]
title = "dnsmasq extract_name() 堆缓冲区溢出漏洞"
updated = "2026-07-20T21:16:46Z"

