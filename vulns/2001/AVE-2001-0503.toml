[basic]
description = "PHP 4.0.0 至 4.0.4 版本中 Apache 模块存在配置隔离缺陷，当管理员为某个虚拟主机设置 `engine = off` 禁用 PHP 引擎时，该配置可能错误地影响同一 Apache 实例上的其他虚拟主机，导致其他虚拟主机的 PHP 解析功能被意外禁用。攻击者可通过向受影响的虚拟主机发送请求，使 Apache 直接返回 PHP 脚本的源代码而非执行结果，从而泄露敏感信息（如数据库凭据、业务逻辑等）。该漏洞无需身份认证即可远程利用，攻击复杂度低，主要影响共享主机环境。官方建议升级至 PHP 4.0.5 或更高版本修复此问题。"
published = "2001-01-12T05:00:00Z"
remediation = "升级 PHP 至 4.0.5 或更高版本（如 4.0.6、4.1.0 等），在 httpd.conf 中为每个虚拟主机单独配置 php_admin_flag engine on/off 而非全局 engine off，或使用 php.ini 中的 open_basedir 限制脚本访问路径作为缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "PHP Apache模块 源代码泄露漏洞"
updated = "2026-06-16T21:56:10Z"

