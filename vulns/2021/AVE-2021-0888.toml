[basic]
description = "Nagios XI 版本 xi-5.7.5 存在操作系统命令注入漏洞。该漏洞位于 /usr/local/nagiosxi/html/includes/configwizards/windowswmi/windowswmi.inc.php 文件中，由于对经过身份认证的用户可控输入未进行充分的特殊字符过滤和转义处理，攻击者可通过构造恶意的 HTTP 请求，将任意系统命令注入到服务器执行。成功利用该漏洞可在 Nagios XI 服务器上以 Web 服务权限执行任意命令，进而完全控制服务器。该漏洞影响所有部署了受影响版本 Nagios XI 的系统，攻击者需首先获得 Nagios XI 的有效账户凭据，随后通过单次 HTTP 请求即可触发命令注入，CVSS 评分为 8.8，危害等级为高危。"
published = "2021-02-15T13:15:12Z"
remediation = "建议立即升级 Nagios XI 至 5.8.0 或更高版本（修复版本于 2021-01-15 发布）。若暂时无法升级，可临时禁用 Windows WMI 配置向导功能，或在 Web 应用防火墙层面拦截包含 shell 元字符（如 ;、|、&）的 plugin_output_len 参数请求。同时建议限制 Nagios XI 管理界面仅允许受信 IP 访问，并启用最小权限原则为运维账号分配权限。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Nagios Nagios XI 操作系统命令注入漏洞"
updated = "2026-07-09T13:39:49Z"

