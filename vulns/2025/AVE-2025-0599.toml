[basic]
description = "tags.<value>Google Chrome（Chromium）V8 JavaScript引擎在WebGPU模块中存在释放后使用（Use After Free）漏洞，攻击者可通过构造恶意HTML页面触发堆内存损坏。未经身份认证的远程攻击者可在用户浏览器中执行任意代码。该漏洞影响Google Chrome 143.0.7499.147之前版本及Microsoft Edge 143.0.3650.96之前版本，CVSS评分为8.8，危害等级为高危。"
published = "2025-12-16T23:15:44Z"
remediation = "升级 Google Chrome 至 143.0.7499.147 或更高版本，Microsoft Edge 至 143.0.3650.96 或更高版本。Linux 用户通过包管理器将 chromium 更新至 143.0.7499.146 及以上版本（rhbz#2423482）。临时缓解措施：在Chrome中通过 chrome://flags/#enable-unsafe-webgpu 禁用 WebGPU 功能，或在企业环境中通过组策略（GPO）限制 WebGPU API 访问权限。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome WebGPU 释放后使用漏洞"
updated = "2026-06-17T08:36:31Z"

