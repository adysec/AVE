[basic]
description = "Windows 内核权限提升漏洞（CVE-2016-0040）影响 Windows Vista SP2、Windows Server 2008 SP2/2008 R2 SP1 和 Windows 7 SP1 等版本。该漏洞源于微软 Windows 内核的内存访问控制保护机制缺陷，攻击者可通过精心构造的应用程序触发内核漏洞，绕过权限验证，实现对系统功能的未经授权控制，达到提权目的。用户无需额外权限即可通过恶意软件触发漏洞，漏洞利用过程可能涉及加载恶意驱动、触发内核调用、绕过安全检查等技术手段，最终导致攻击者获取系统管理员或内核级权限，能够任意读取/修改系统文件，安装后门，窃取敏感信息或破坏系统稳定性。该漏洞 CVSS 评分 7.8（危 重级），危害等级严重。微软已在后续安全更新中修复此漏洞，建议用户及时更新操作系统以获取最新补丁。"
published = "2016-02-10T11:59:06Z"
remediation = "建议立即安装 Microsoft 2016 年 2 月安全更新 MS16-016 (KB3124280)，适用于 Windows 7 SP1、Windows Server 2008 R2 SP1、Windows Vista SP2、Windows Server 2008 SP2。通过 Windows Update 自动更新或从 Microsoft Update Catalog 手动下载安装对应补丁包。如无法立即打补丁，可暂时禁用本地用户账户的非必要权限、限制非管理员用户运行可执行文件、启用 Windows Defender 实时防护并部署 CVE-2016-0040 对应的 YARA 检测规则作为临时缓解措施。建议尽快通过 WSUS/WSUS Offline/SCCM 推送补丁至全网资产，并使用 Microsoft Baseline Security Analyzer (MBSA) 验证补丁安装状态。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows 内核 权限提升漏洞"
