[basic]
description = "BeOS 平台上的 Baxter IRC 客户端（r5 pro 及更早版本）存在拒绝服务漏洞。远程攻击者可通过向目标用户发送包含超长 URL 的消息，导致 Baxter IRC 客户端崩溃或无法响应，从而造成拒绝服务。攻击无需身份认证，攻击复杂度低，但仅影响 BeOS 系统上使用该 IRC 客户端的用户。该漏洞 CVSS 评分为 5.0，属于中危漏洞，目前尚无官方补丁发布。"
published = "2001-01-09T05:00:00.000"
remediation = "立即停止使用 BeOS r5 pro 及更早版本上的 Baxter IRC 客户端，改用其他支持 BeOS 的 IRC 客户端（如 Vision IRC）。由于 BeOS 已停止维护且厂商不再提供安全更新，建议将系统迁移至 Haiku OS 或使用其他现代操作系统，并在网络层面配置防火墙规则限制 IRC 端口的异常长 URL 流量作为临时缓解。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Abisoft Baxter IRC客户端 BeOS平台 URL远程拒绝服务漏洞"
updated = "2026-06-16T21:53:16.020"

