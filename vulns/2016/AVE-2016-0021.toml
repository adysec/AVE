[basic]
description = "hdw-tube WordPress 插件 1.2 版本中存在反射型跨站脚本（XSS）漏洞，该漏洞源于程序未对用户输入进行充分的过滤与转义处理。攻击者可利用该漏洞构造特制的恶意 URL，诱使已登录管理员或普通用户点击，从而在目标浏览器中执行任意 JavaScript 代码，实现窃取会话 Cookie、篡改页面内容或发起其他恶意操作。攻击无需身份认证，但需要用户交互，影响使用该插件的 WordPress 站点。"
published = "2016-10-10T20:59:10Z"
remediation = "立即在 WordPress 后台停用并彻底删除 hdw-tube 插件（该插件已于 2016 年 4 月关闭下架，不再维护）。如仍需视频功能，请替换为其他仍在维护的视频库插件。若无法立即删除，可在主题 functions.php 中添加 add_filter('the_content', 'esc_html') 对输出内容转义，并配置 Content-Security-Policy 响应头限制内联脚本执行作为临时缓解。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress hdw-tube 插件 1.2 反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:44Z"

