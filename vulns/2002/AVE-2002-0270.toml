[basic]
description = "Apache HTTP Server 自带的 ApacheBench (ab) 基准测试工具 ab.c 存在缓冲区溢出漏洞。该漏洞源于 ab.c 对 HTTP 响应长度缺乏边界检查，恶意 Web 服务器可通过发送超长 HTTP 响应触发栈缓冲区溢出，导致 ApacheBench 客户端拒绝服务甚至远程代码执行。受影响版本包括 Apache 1.3.27 之前版本和 Apache 2.0.43 之前版本。攻击条件为攻击者控制恶意 Web 服务器，诱导受害者使用 ab 工具对其进行基准测试。攻击者构造超长 HTTP 响应载荷覆盖返回地址或函数指针，实现任意代码执行，CVSS 7.5 高危。Apache 已在 1.3.27 和 2.0.43 版本中修复此漏洞，建议升级至修复版本。"
published = "2002-10-11T04:00:00Z"
remediation = "建议立即升级 Apache HTTP Server 至 1.3.27 或 2.0.43 及以上版本（Apache 1.3.x 用户升级至 1.3.27，Apache 2.x 用户升级至 2.0.43）。升级方法：从 Apache 官网（https://httpd.apache.org/download.cgi）下载对应版本源码包或二进制包，按官方文档编译安装或使用系统包管理器升级（如 apt upgrade apache2 / yum update httpd）。若暂时无法升级，可暂时禁用或移除 ApacheBench (ab) 工具，或在受信网络环境下使用，避免连接恶意 Web 服务器触发缓冲区溢出。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Apache HTTP Server ApacheBench 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:58:14Z"

