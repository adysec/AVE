[basic]
description = "Microsoft Office SharePoint 在网页生成过程中存在输入中和不当的跨站脚本（XSS）漏洞。授权攻击者可在网络环境中利用该漏洞实施欺骗攻击，通过构造恶意网页内容诱导已认证用户执行非预期操作。该漏洞影响 Microsoft Office SharePoint Server 相关版本，CVSS 评分 7.3，危害等级为高危。攻击需要用户交互且攻击者需具备一定权限，利用方式包括注入恶意脚本实现会话劫持或钓鱼欺骗。"
published = "2026-07-14T18:18:19.063"
remediation = "立即将 Microsoft SharePoint Server 升级至以下修复版本：SharePoint Server 2016 升级到 16.0.5561.1001 及以上，SharePoint Server 2019 升级到 16.0.10417.20175 及以上，SharePoint Server Subscription Edition 升级到 16.0.19725.20434 及以上。升级前建议在测试环境验证补丁兼容性，升级后重启 SharePoint 服务并验证 XSS 防护生效。如暂时无法升级，可在 Web 应用程序网关层启用请求验证与输出编码作为临时缓解措施。"
score = 7.3
severity = "HIGH"
sources = ["zdi"]
title = "Microsoft Office SharePoint 跨站脚本漏洞"
updated = "2026-07-16T14:24:03.443"

