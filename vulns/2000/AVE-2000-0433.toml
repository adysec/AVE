[basic]
description = "Stelian Pop 版本 0.4 dump 工具中的 restore 程序存在缓冲区溢出漏洞。该程序在处理超长磁带文件名时，由于未进行有效边界检查，导致堆栈缓冲区溢出，使攻击者能够劫持控制流并执行任意命令。该漏洞影响 Stelian Pop 版本 0.4b17 及更早版本。攻击者只需在本地提供一个特定长度的磁带文件名即可触发，不需要任何身份验证即可完全破坏目标系统的机密性、完整性和可用性。（≈65字）"
published = "2000-06-07T04:00:00Z"
remediation = '根据 Red Hat Bugzilla #11880 中的安全公告，建议立即升级到 Red Hat Linux 的 dump 升级版本或获取最新的 dump 软件包修复。您可以运行 "yum update dump" 或从 Red Hat 官网上下载并安装最新的 dump 软件包版本（当前版本高于 0.4b15-1）。如果无法立即升级，建议通过限制用户对 /tmp 目录的写权限并配置系统调用过滤器来缓解风险。'
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Stelian Pop dump 包 restore 子程序缓冲区溢出漏洞"
updated = "2026-06-16T21:51:54Z"

