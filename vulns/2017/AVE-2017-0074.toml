[basic]
description = "WordPress social-buttons-pack 插件（版本 < 1.1.1）存在跨站脚本（XSS）漏洞。该插件未能对用户输入进行充分过滤与转义，攻击者可通过向受影响页面注入恶意 JavaScript 代码，诱使已登录管理员或用户点击特制链接后，在浏览器中执行任意脚本。成功利用该漏洞可导致会话劫持、页面内容篡改、敏感信息泄露等危害。攻击无需身份认证，但需要用户交互（点击链接），CVSS 评分 6.1，危害等级中危。"
published = "2019-08-12T16:15:13Z"
remediation = "升级 WordPress social-buttons-pack 插件至 1.1.1 或更高版本。登录 WordPress 后台 → 插件 → 已安装插件 → 找到 social-buttons-pack → 点击更新。如已删除该插件，重新安装最新版即可修复 XSS 漏洞。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress social-buttons-pack插件跨站脚本漏洞"
updated = "2026-06-17T01:12:59Z"

