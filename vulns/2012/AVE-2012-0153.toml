[basic]
description = "Adobe Flash Player 存在安全绕过漏洞，攻击者可通过诱导用户访问特制网页或打开恶意文件，利用未指定的向量绕过 Flash 的安全沙箱和访问限制机制，在用户浏览器上下文中执行任意操作。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上的 Flash Player 10.3.183.15 之前版本和 11.1.102.62 之前版本，CVSS 评分 9.3，危害严重。攻击无需身份认证，但需要用户交互（如点击链接或打开文件）。Adobe 已在 2012 年 2 月安全公告 APSB12-03 中发布更新修复此漏洞。"
published = "2012-02-16T19:55:01.193"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.15 或 11.1.102.62 及以上版本（Windows/Mac/Linux）；Android 2.x/3.x 升级至 11.1.111.6，Android 4.x 升级至 11.1.115.6。如无法升级，可在浏览器中禁用 Flash 插件或卸载 Flash Player 以彻底消除风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 安全绕过漏洞"
updated = "2026-06-16T23:38:11.817"

