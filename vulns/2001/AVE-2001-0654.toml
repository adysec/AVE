[basic]
description = '''
Check Point Firewall-1 4.1 防火墙在启用有限IP许可证模式下存在拒绝服务漏洞，远程攻击者无需身份认证即可向防火墙内部接口发送大量伪造源地址的IP数据包，触发控制台输出大量警告消息并持续消耗CPU资源，最终导致设备性能下降或服务中断。该漏洞影响使用有限IP许可证部署的 Firewall-1 4.1 版本，攻击复杂度低且易于利用，CVSS 评分 5.0，危害等级为中危。"""
```

Ah, the description field in the current TOML is malformed - it contains extra text like "标签之间。\n\n最终答案：\n<value>..." which is likely why the validator reports it as empty or invalid. The description should just be the pure text value.

The user wants me to output only the <value>...
'''
published = "2001-03-26T05:00:00Z"
remediation = "升级到 Check Point FireWall-1 NG (Next Generation) 或更高版本，该版本已修复 limited-IP 许可证对伪造源 IP 数据包的处理缺陷。如暂无法立即升级，应在防火墙外部接口配置严格的 anti-spoofing 规则，启用反向路径过滤 (RPF) 阻止来自外部的伪造内网源地址数据包进入内部接口，同时在路由器层面配置 uRPF (Unicast Reverse Path Forwarding) 或静态 ARP 条目限制内部接口可通信的源 IP 范围，并调整 syslog 告警阈值以降低 CPU 负载。"
