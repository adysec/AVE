[basic]
description = 'Kootenay Web KW Whois 1.0 CGI 程序存在远程命令执行漏洞，由于程序未对用户输入的 "whois" 参数进行有效过滤，远程攻击者可通过在参数中注入 shell 元字符（如分号、管道符等）执行任意系统命令。该漏洞影响 Kootenay Web KW Whois 1.0 版本，CVSS 评分 10.0，危害等级严重。攻击者无需身份认证即可远程利用，获取服务器完全控制权。目前已存在公开的 Exploit-DB 利用代码。'
published = "2000-12-19T05:00:00Z"
remediation = "立即删除或禁用 KW Whois 1.0 CGI 脚本（通常位于 cgi-bin/whois 目录下），该产品已停止维护且无官方补丁。如业务必须使用，需在 CGI 脚本入口处对 whois 参数进行严格过滤，禁止传入 `;` `|` `&` `$` `` ` `` 等 shell 元字符，仅允许字母、数字、点号和连字符，并考虑以非特权用户运行 Web 服务以限制命令执行影响范围。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Kootenay Web Inc KW Whois 1.0 远程命令执行漏洞"
updated = "2026-06-16T21:52:49Z"

