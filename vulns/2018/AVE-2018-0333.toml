[basic]
description = "NUUO NVRmini 系列网络视频录像机（NVR）的 `upgrade_handle.php` 接口存在 OS 命令注入漏洞。未经身份认证的远程攻击者可通过向 `uploaddir` 参数注入 shell 元字符（如分号、管道符）构造恶意 `writeuploaddir` 命令，从而在设备上以 root 权限执行任意系统命令。该漏洞影响 NUUO NVRMini2 及同系列设备，CVSS 评分 9.8，危害等级严重。攻击者无需任何认证即可远程利用，可完全控制设备。目前已有公开的 Metasploit 利用模块，建议立即升级固件或限制管理接口的访问权限。"
published = "2018-08-04T19:29:00Z"
remediation = "NUUO 已宣布 NVRmini 2 及 NVRsolo 系列产品停止支持（EoL），不会发布安全补丁。建议立即停止使用受影响设备，迁移至受支持的替代产品。如无法立即替换，应在网络边界防火墙处阻断对设备 80/443 端口的公网访问，仅允许受信任内网 IP 访问设备 Web 管理界面，并部署 WAF 规则拦截包含 shell 元字符（如 `;` `|` `$`）的 uploaddir 参数请求以临时缓解风险。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "NUUO NVRmini 远程命令执行漏洞"
updated = "2026-06-17T01:41:54Z"

