[basic]
description = "Ethereal（现Wireshark）0.9.3之前版本的DNS协议解析器存在拒绝服务漏洞。远程攻击者可通过向目标系统发送特制的畸形网络数据包，触发DNS解析器进入无限循环，导致CPU资源被大量消耗，造成拒绝服务。该漏洞攻击条件简单，无需身份认证即可远程触发，影响Ethereal 0.9.3之前所有版本。"
published = "2002-06-18T04:00:00Z"
remediation = "升级 Ethereal 至 0.9.3 或更高版本。如无法升级，可在 DNS 解析器配置中禁用 DNS 协议解析，或使用防火墙规则过滤畸形 DNS 数据包以缓解 CPU 耗尽风险。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Ethereal DNS解析器拒绝服务漏洞"
updated = "2026-06-16T21:57:22Z"

