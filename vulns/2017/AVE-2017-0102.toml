[basic]
description = "WordPress Qards 插件（版本至 2017-10-11）中存在跨站脚本（XSS）漏洞。该漏洞源于插件在处理 html2canvasproxy.php 文件时，未对 url 参数中的远程文档内容进行充分过滤和转义，导致攻击者可以构造包含恶意 JavaScript 代码的 URL 诱导用户点击。当用户访问特制链接后，恶意脚本将在用户浏览器中执行，造成敏感信息泄露、会话劫持或页面内容篡改等危害。攻击者无需身份认证，但需要用户交互（点击链接），影响范围包括所有使用该插件的 WordPress 站点。"
published = "2019-09-10T11:15:10Z"
remediation = "该插件已从 WordPress 官方仓库下架且不再维护，无修复版本可用。建议立即删除 Qards 插件（在 WordPress 后台插件页面停用并删除 /wp-content/plugins/qards/ 目录）。如仍需类似功能，请替换为其他受支持的 WordPress 卡片/展示类插件。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Qards插件跨站脚本漏洞"
updated = "2026-06-17T01:13:10Z"

