[basic]
description = "Adobe Acrobat 4.05、Acrobat Reader、Business Tools 及 Fill In 等 PDF 处理产品中存在缓冲区溢出漏洞。攻击者可通过向 PDF 文件中的 /Registry 或 /Ordering 标识符提供超长字符串，触发栈缓冲区溢出，从而在用户打开恶意 PDF 文件时执行任意代码。该漏洞影响 Adobe Acrobat 4.05 及早期版本，攻击者需诱使用户打开特制 PDF 文件方可利用，CVSS 评分 7.6，危害等级高。"
published = "2000-10-20T04:00:00.000"
remediation = "升级 Adobe Acrobat 及 Reader 至 4.05c 或更高版本，该版本已修复 PDF 文件中 /Registry 和 /Ordering 字段的缓冲区溢出问题。如无法升级，建议禁用浏览器中 PDF 插件自动打开功能，仅使用受信任来源的 PDF 文件。"
score = 7.6
severity = "HIGH"
sources = ["epss"]
title = "Adobe Acrobat 系列产品 PDF 文件处理缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:19.503"

