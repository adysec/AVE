[basic]
description = "everythingform.cgi 是 Leif M. Wright 开发的 CGI 程序（版本 2.0），该程序在处理用户提交的 config 参数时未对 shell 元字符进行充分过滤，导致未经身份认证的远程攻击者可通过在 config 参数中注入 shell 元字符（如分号、管道符、反引号等）来执行任意操作系统命令。运行 everythingform.cgi 2.0 版本的所有 Web 服务器均受影响，攻击者无需任何身份认证，只需能够远程访问目标 Web 服务器上的该 CGI 脚本，并通过 HTTP 请求向 config 参数提交包含恶意 shell 元字符的输入即可触发漏洞。攻击者通过构造包含 shell 元字符的 HTTP 请求将 payload 嵌入 config 参数，Web 服务器执行该 CGI 脚本时会解析并执行注入的命令，从而获得服务器的命令执行权限，可进一步用于信息窃取、权限提升或作为后续攻击的跳板。该漏洞的 CVSS 评分为满分 10.0，危害程度极为严重，远程利用难度极低且影响范围广泛。"
published = "2001-02-12T05:00:00.000"
remediation = "1. 立即从 Web 服务器中移除 everythingform.cgi 文件，或将其权限修改为不可执行（如 chmod 644 并置于 cgi-bin 之外）；2. 如仍需使用，升级到 Leif M. Wright 发布的最新修正版本并确认漏洞已修复；3. 在 Web 服务器配置（如 Apache httpd.conf）中禁用对 .cgi 脚本的自动执行，或使用 suEXEC/cgiwrap 等机制限制脚本权限；4. 临时缓解措施：在防火墙或 Web 服务器层面对 /everythingform.cgi 路径实施访问控制（IP 白名单或路径阻断），并开启 CGI 执行日志监控异常请求。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Leif M. Wright everythingform.cgi 远程命令执行漏洞"
