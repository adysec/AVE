[basic]
description = "Windows 签名验证机制存在欺骗漏洞，当 Windows 未能正确验证文件签名时，攻击者可通过加载特制的未正确签名文件绕过安全功能，从而在目标系统上执行未授权的操作。该漏洞允许本地低权限攻击者利用此缺陷加载本应被阻止的恶意文件，导致机密性、完整性和可用性受到高影响。CVSS 评分 7.8，危害等级高。Microsoft 已在安全更新中通过改进文件签名验证方式修复此漏洞。"
published = "2020-08-17T19:15:14Z"
remediation = "立即安装 Microsoft 2020 年 8 月安全更新（对应 KB4566782 等月度累积更新），通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载。受影响的版本包括 Windows 7 SP1、Windows 8.1、Windows 10（1507/1607/1709/1803/1809/1903/1909/2004）、Windows Server 2008 SP2/2008 R2 SP1/2012/2012 R2/2016/2019。如无法立即打补丁，可配置组策略限制非管理员用户加载未签名文件，并启用 Windows Defender 应用程序控制（WDAC）作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows 文件签名验证欺骗漏洞"
updated = "2026-06-17T03:01:28Z"

