[basic]
description = "HP JetDirect 打印机网卡固件 x.08.20 及更早版本中的 FTP 服务存在缓冲区溢出漏洞。远程攻击者可通过向目标设备的 FTP 服务发送特制的超长请求，触发缓冲区溢出，导致 FTP 服务崩溃，造成拒绝服务。该漏洞影响 HP JetDirect X.08.04、X.08.05、X.08.20 等版本，攻击者无需认证即可远程利用，危害等级中等。"
published = "2000-12-11T05:00:00.000"
remediation = "立即将 HP JetDirect 打印机网卡固件升级至 x.08.21 或更高版本（HP 官方已发布修复固件）。如无法升级，在打印机管理界面中禁用 FTP 服务（通过 telnet 或 Web 管理页关闭 FTP 端口 21），并在网络防火墙层面限制对打印机 IP 的 21/TCP 端口访问，仅允许受信任的管理主机连接。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "HP JetDirect 打印机固件 FTP 服务缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:53:04.607"

