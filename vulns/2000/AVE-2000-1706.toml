[basic]
description = "GNU CFEngine 1.6.0a11 之前版本中的 cfd 守护进程存在格式化字符串漏洞，远程攻击者无需身份认证即可通过向 CAUTH 命令发送特制的格式化字符串参数触发该漏洞，导致任意命令执行。该漏洞 CVSS 评分 10.0，攻击复杂度低，可完全控制目标系统的机密性、完整性和可用性，危害极为严重。"
published = "2000-12-19T05:00:00.000"
remediation = "立即将 GNU CFEngine 升级至 1.6.0a11 或更高版本，该版本修复了 cfd 守护进程中 CAUTH 命令的格式化字符串漏洞。如无法立即升级，可在防火墙规则中限制对 cfd 服务端口（默认 5308）的访问，仅允许可信来源连接，并禁用 cfd 守护进程的远程管理功能作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "GNU CFEngine cfd 守护进程格式化字符串远程代码执行漏洞"
updated = "2026-06-16T21:52:49.857"

