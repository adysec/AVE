[basic]
description = "Phorum 3.0.7 版本的 read.php3 及其他脚本存在 SQL 注入漏洞。未经身份认证的远程攻击者可通过向目标系统发送包含恶意 SQL 语句的 sSQL 参数，构造特制 HTTP 请求触发漏洞，从而在数据库层面执行任意 SQL 查询。该漏洞影响所有运行受影响版本的 Phorum 论坛系统，攻击者借此可窃取敏感数据、篡改或删除数据库内容，甚至在某些条件下获取数据库服务器的控制权限。CVSS 评分 7.5，危害等级高，攻击者仅需网络可达即可利用，无需任何认证凭据。"
published = "2000-12-31T05:00:00Z"
remediation = '立即将 Phorum 升级至 3.0.7 之后的安全版本，并对所有包含 sSQL 参数的脚本（如 read.php3）实施输入过滤：在 PHP 代码中对 sSQL 参数添加 mysql_real_escape_string() 转义，禁止直接拼接用户输入到 SQL 查询语句中；如暂无法升级，可在 Apache/Nginx 配置中添加 rewrite 规则拦截包含 "sSQL" 参数的恶意请求，同时限制数据库账号权限为只读以降低被拖库风险。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Phorum 3.0.7 SQL注入漏洞"
updated = "2026-06-16T21:53:26Z"

