[basic]
description = "Google Chrome 使用的 Dawn 图形渲染组件中存在释放后使用（Use-after-free）漏洞，CWE-416。远程攻击者可通过构造特制的 HTML 页面诱导用户访问，成功利用该漏洞可导致堆内存损坏，进而实现远程代码执行或浏览器崩溃。该漏洞影响 Google Chrome 140.0.7339.185 之前版本，CVSS 评分 8.8，危害等级高，攻击复杂度低，无需身份认证，但需要用户交互。"
published = "2025-09-24T17:15:38Z"
remediation = "升级 Google Chrome 至 140.0.7339.185 及以上版本，或升级基于 Chromium 的浏览器（如 Edge、Brave）至对应修复版本。Linux 发行版用户更新 chromium 包至 140.0.7339.207 以上。无法立即升级时，可禁用 WebGPU 功能（chrome://flags/#enable-unsafe-swiftshader 或通过组策略）作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome Dawn 释放后使用漏洞"
updated = "2026-06-17T08:28:26Z"

