[basic]
description = "NetScreen Firewall 的 Web 管理界面存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过向 Web 管理界面发送超长的 URL 请求来触发该溢出，导致防火墙服务拒绝服务、无法正常处理网络流量。该漏洞影响 ScreenOS 1.73 及 2.x 版本，攻击者无需任何凭据即可在目标设备上造成服务中断，影响网络边界安全防护能力。"
published = "2001-02-12T05:00:00Z"
remediation = "建议升级 NetScreen ScreenOS 至 2.1.1 或更高版本以修复 WebUI 缓冲区溢出漏洞。如暂时无法升级，应通过访问控制列表限制 Web 管理界面仅允许可信 IP 地址访问，或改用命令行接口（CLI）进行设备管理，从而阻断远程攻击者对 WebUI 的长 URL 请求攻击路径。升级完成后需重启防火墙服务使补丁生效。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "NetScreen Firewall WebUI 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:53:28Z"

