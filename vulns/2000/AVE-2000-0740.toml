[basic]
description = "SCO Unixware 7.0 自带的 SCOhelp HTTP 服务器中的 search97.cgi CGI 脚本存在格式字符串漏洞。远程攻击者可通过向 queryText 参数提交特制的格式字符串标记（如 %s、%n 等），触发该漏洞，导致任意代码执行或信息泄露。攻击无需身份认证，仅需向目标服务器发送恶意 HTTP 请求即可利用。该漏洞影响 Unixware 7.0 系统，CVSS 评分 7.5，危害等级高。厂商已发布安全补丁修复此问题。"
published = "2000-12-11T05:00:00Z"
remediation = "该漏洞影响 SCO Unixware 7.0 的 help HTTP 服务器（search97.cgi），SCO 已停止支持该产品且不再发布补丁。建议立即禁用 search97.cgi CGI 脚本或移除 help HTTP 服务器组件；如业务必须使用，应在前端部署 Web 应用防火墙（WAF）过滤 queryText 参数中的格式字符串特征（如 %n、%s、%x），并迁移至受支持的现代 Unix/Linux 平台。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "SCO Unixware help HTTP 服务器 search97.cgi 格式字符串漏洞"
updated = "2026-06-16T21:52:58Z"

