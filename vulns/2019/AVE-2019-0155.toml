[basic]
description = "CTHthemes CityBook、TownHub 及 EasyBook 是 WordPress 主题，在处理搜索查询参数时未对用户输入进行充分转义与过滤，存在反射型跨站脚本（XSS）漏洞。攻击者可构造包含恶意脚本的搜索链接，诱导受害者点击后，脚本在受害者浏览器中执行，从而窃取会话令牌或执行任意操作。该漏洞影响 CityBook 2.3.4 之前版本、TownHub 1.0.6 之前版本及 EasyBook 1.2.2 之前版本，CVSS 评分为 6.1（中等），需用户交互触发。"
published = "2020-01-13T18:15:14.140"
remediation = "立即升级cththemes CityBook至2.3.4版本、TownHub至1.0.6版本或EasyBook至1.2.2版本。若无法立即升级，可在WAF层面拦截包含<script>、<img onerror>等XSS特征的搜索请求作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "CTHthemes CityBook 跨站脚本漏洞"
updated = "2026-06-17T02:30:12.413"

