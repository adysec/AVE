[basic]
description = "QNAP NAS 设备上的 HBS 3（Hybrid Backup Sync）应用存在授权机制不完善漏洞，未对访问接口实施充分的权限验证。未经身份认证的远程攻击者可通过网络直接向运行受影响版本的 QNAP NAS 发起请求，绕过正常登录认证流程，以管理员或高权限身份登录设备，从而完全控制 NAS 存储中的数据，执行任意操作，包括读取、篡改或删除敏感文件。该漏洞影响搭载 QTS 4.5.2、QTS 4.3.3、QTS 4.3.4、QTS 4.3.6、QuTS hero h4.5.1 以及 QuTScloud c4.5.1 至 c4.5.4 的 HBS 3 版本，CVSS 评分高达 10.0，危害等级为严重，且已被 CISA 列入已知被利用漏洞目录。QNAP 已发布更新版本修复此问题，建议用户立即升级 HBS 3 至最新版本以消除安全风险。"
published = "2021-05-13T03:15:06Z"
remediation = "立即将 QNAP NAS 上的 Hybrid Backup Sync 3 (HBS 3) 升级至安全版本：QTS 4.5.2 用户升级至 v16.0.0415，QTS 4.3.6 用户升级至 v3.0.210412，QTS 4.3.4/4.3.3 用户升级至 v3.0.210411，QuTS hero h4.5.1 与 QuTScloud c4.5.1~c4.5.4 用户升级至 v16.0.0419。如暂无法升级，可在 App Center 中禁用 HBS 3 服务，并配置防火墙规则阻止外部访问 8080 端口作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["kev"]
title = "QNAP HBS 3 未授权访问漏洞"
updated = "2026-06-17T03:46:53Z"

