[basic]
description = "X-Chat IRC 客户端 1.4.2 及更早版本存在命令执行漏洞。远程攻击者可通过在 URL 中嵌入 shell 元字符，诱使目标用户点击恶意链接，当 X-Chat 调用外部浏览器打开该 URL 时，嵌入的恶意命令将被执行。该漏洞影响 X-Chat 1.2 至 1.5 系列版本，攻击者无需身份认证即可远程利用，可能导致系统被完全控制。CVSS 评分 7.5，危害等级高。"
published = "2000-10-20T04:00:00.000"
remediation = "升级 X-Chat 至 1.5 或更高版本，该版本在启动浏览器前对 URL 中的 shell 元字符进行过滤。Red Hat Linux 用户可安装 RHSA-2000-055 提供的更新包。如无法升级，建议禁用 X-Chat 的 URL 自动打开功能，或使用其他 IRC 客户端替代。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "X-Chat IRC 客户端 URL 命令执行漏洞"
updated = "2026-06-16T21:52:28.807"

