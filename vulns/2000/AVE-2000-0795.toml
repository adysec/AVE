[basic]
description = "PostACI Webmail 1.1.3 默认安装配置将 /includes/global.inc 配置文件放置在 Web 根目录下，远程攻击者无需任何身份认证，直接通过 HTTP GET 请求即可访问该文件，导致数据库用户名、密码等敏感配置信息泄露。攻击者可利用泄露的凭据进一步入侵数据库系统，危害数据安全与系统完整性。"
published = "2001-01-09T05:00:00.000"
remediation = '将 /includes/global.inc 配置文件移出 Web 根目录（如移至 /etc/postaci/），并设置权限为 600（仅所有者可读写）。在 Apache 中通过 .htaccess 或 httpd.conf 添加 `<Files "global.inc"> Deny from all </Files>` 禁止直接访问。升级到已修复此问题的 Postaci 更高版本或迁移至其他受支持的 Webmail 系统。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Trlinux Postaci Webmail 配置文件信息泄露漏洞"
updated = "2026-06-16T21:53:08.807"

