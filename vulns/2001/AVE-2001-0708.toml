[basic]
description = "OmniHTTPd 2.07 的 statsconfig.pl 脚本存在命令注入漏洞，远程攻击者无需认证即可通过构造恶意的 mostbrowsers 参数，该参数值被直接拼接到动态生成的 Perl 脚本中执行，导致任意命令执行。攻击者可利用此漏洞完全控制目标服务器，获取系统最高权限，CVSS 评分 10.0，危害等级严重。受影响的 OmniHTTPd 2.07 版本未对该参数进行任何过滤或转义处理，攻击者只需向目标服务器的 statsconfig.pl 发送特制 HTTP 请求即可触发。"
published = "2001-03-12T05:00:00.000"
remediation = "tags.<value>OmniHTTPd 已停止维护多年，官方未发布修复此漏洞的补丁。建议立即迁移至现代 Web 服务器（如 Apache HTTP Server 或 Nginx），停止使用 OmniHTTPd 2.0.7 及更早版本。若暂时无法迁移，应在防火墙层面限制对 statsconfig.pl 脚本的远程访问，仅允许可信 IP 连接 80 端口。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Omnicron OmniHTTPd 2.07 远程命令执行漏洞"
updated = "2026-06-16T21:53:40.800"

