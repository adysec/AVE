[basic]
description = "tags.<value>MySQL 数据库在 sql_acl.cc 文件的 get_salt_from_password 函数中存在缓冲区溢出漏洞。当攻击者拥有 ALTER TABLE 权限时，可通过向 Password 字段提交超长字符串触发该溢出，进而在目标服务器上执行任意代码。该漏洞影响 MySQL 3.23.x 及 4.0.14 及更早版本，CVSS 评分为 9.8，危害等级为严重。攻击者可通过构造恶意 SQL 语句利用此漏洞，最终获得服务器的完全控制权限。"
published = "2003-09-22T04:00:00Z"
remediation = "立即升级 MySQL 至 3.23.58（3.23.x 分支）或 4.0.15（4.0.x 分支）及以上版本，此漏洞已在上述版本中修复。升级前请完整备份数据库及配置文件，停止 mysqld 服务后替换二进制文件并重启。若暂时无法升级，应在防火墙层面限制 3306 端口的远程访问，仅允许受信任的 IP 连接 MySQL；同时严格限制具有 ALTER TABLE 权限的数据库账户，禁止非必要账号访问 mysql 系统库，并在 mysql.user 表中移除不必要的用户作为临时缓解措施。"
score = 9
severity = "CRITICAL"
sources = ["redhat"]
title = "MySQL 3.23.x/4.0.x 远程缓冲区溢出漏洞"
updated = "2026-06-16T22:02:49Z"

