[basic]
description = "Sylius Mollie Plugin 存在不安全的直接对象引用（IDOR）漏洞，未经身份认证的远程攻击者可通过向 /{_locale}/thank-you 和 /{_locale}/get-code 两个端点发送包含连续整数 orderId 的请求，绕过所有权与会话校验，获取订单 tokenValue，进而通过 /{_locale}/register-after-checkout/{tokenValue} 接口查看客户姓名和邮箱等敏感个人信息。该漏洞影响 Sylius Mollie Plugin 2.2.8 之前、3.2.4 之前及 3.3.1 之前的所有版本，CVSS 评分 6.5，危害等级中危。"
published = "2026-07-30T21:18:13Z"
remediation = "立即升级 Sylius Mollie Plugin 至 v2.2.8、v3.2.4 或 v3.3.1（根据主版本选择对应修复版本）。如无法立即升级，可通过装饰器模式在项目层对 `QrCodeAction` 和 `PageRedirectController` 两个控制器添加订单所有权校验：创建 `SecureQrCodeAction` 和 `SecurePageRedirectController` 装饰类，在 `config/services.yaml` 中注册为原服务的装饰器，然后执行 `bin/console cache:clear` 清除缓存。"
score = 6.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Sylius Mollie Plugin 未授权IDOR信息泄露漏洞"
updated = "2026-07-31T16:17:12Z"

