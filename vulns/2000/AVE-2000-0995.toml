[basic]
description = "该漏洞源于 Lotus Notes 的默认邮箱执行配置 flaw，该配置导致系统在用户打开电子邮件时自动执行邮件中的附件程序 bypass 了安全验证机制。攻击者可以远程向运行旧版 Lotus Notes（低于 5.02）的系统发送包含恶意程序的电子邮件邮件，一旦受害者打开邮件，恶意程序就会自动执行，实现任意命令执行，完全控制受影响系统，窃取敏感数据，并可能进一步在网络中横向移动。该漏洞 CVSS 评分 7.5，攻击复杂度低，无需身份验证，完全暴露在网络中，可利用该漏洞进行主动攻击。"
published = "2001-07-21T04:00:00.000"
remediation = "建议立即升级 Lotus Notes 至 5.02 版本或更高版本（后续版本更名为 IBM Notes 及 HCL Notes），并在 ECL 设置中禁用自动执行附件程序的权限。如无法立即升级，可在邮件服务器层面配置附件拦截规则拦截可执行文件附件作为临时缓解措施。建议通过 HCL 官方渠道获取最新 Notes 客户端安装包进行升级部署。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Lotus Notes 远程代码执行漏洞"
updated = "2026-06-16T21:52:41.237"

