[info]
author = "ave"
description = "验证目标Chrome版本是否受PDF编解码器整数溢出漏洞影响，通过检测是否存在可触发崩溃的恶意PDF渲染行为"
id = "POC-AVE-2011-0170"
name = "CVE-2011-3015 PoC"
severity = "medium"
tags = ["ave-2011-0170"]
vuln_id = [
    "CVE-2011-3015",
    "AVE-2011-0170",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/test.pdf"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
