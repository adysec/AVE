[basic]
description = "Subscribe Me LITE 是一款 CGI 脚本程序，其管理员密码修改功能存在身份验证缺陷。远程攻击者无需任何认证，直接向 subscribe.pl 脚本发送带有 setpwd 参数的 HTTP 请求即可修改管理员密码，从而获取 Account Manager 的管理权限。该漏洞攻击复杂度低，无需用户交互，CVSS 评分 7.5，危害等级高。目前已有公开的 ExploitDB 利用代码（ID: 20177），攻击者可通过简单 HTTP 请求实现未授权密码篡改。"
published = "2000-10-20T04:00:00.000"
remediation = '立即从 CGI Script Center 官方网站下载并升级 Subscribe Me LITE 到已修复版本（厂商已在 2000 年 8 月发布补丁）。修复方式为在 subscribe.pl 脚本的 setpwd 子例程中添加 `if (-e "$passfile/password.txt")` 检查，若密码文件已存在则拒绝重置操作。如无法升级，可手动修改 subscribe.pl，在 setpwd 处理逻辑开头加入上述文件存在性校验；同时通过 Web 服务器配置（如 .htaccess）限制对 subscribe.pl 的访问来源 IP，仅允许受信任的管理员地址访问 Account Manager 管理页面。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "CGI Script Center Subscribe Me LITE 认证绕过漏洞"
updated = "2026-06-16T21:52:16.277"

