[basic]
description = "Big Brother 1.4h1 及更早版本中的 bb-hostsvc.sh 脚本存在目录遍历漏洞，远程攻击者可通过向 HOSTSVC 参数传递 `..`（点点）攻击序列读取服务器上的任意文件。该漏洞无需身份认证即可远程利用，攻击复杂度低，可导致敏感信息泄露（如密码文件、配置文件等），CVSS 评分 10.0，危害等级严重。目前厂商已停止维护，建议用户升级或迁移至替代监控方案。"
published = "2000-07-11T04:00:00Z"
remediation = "立即升级 Big Brother 至 1.4h2 或更高版本（若厂商已停止维护，建议迁移至 BB4 或 Zabbix 等替代方案）。如无法升级，删除或禁用 cgi-bin/bb-hostsvc.sh 脚本，或通过 Web 服务器（Apache/Nginx）配置访问控制列表限制该脚本仅允许可信 IP 访问，同时在反向代理或 WAF 层面过滤 HOSTSVC 参数中的 ../ 路径遍历序列。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Sean MacGuire Big Brother 目录遍历漏洞"
updated = "2026-06-16T21:52:09Z"

