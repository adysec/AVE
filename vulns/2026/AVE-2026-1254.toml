[basic]
description = "Foxit PDF 编辑器及阅读器在处理特制 PDF 文档中的 AcroForm 注释时存在释放后使用（Use After Free）漏洞。当用户在目标软件中打开包含恶意 AcroForm 注释和脚本的 PDF 文档时，文档结构异常会导致页面元素关系与内部索引状态之间产生不一致。脚本触发的文档修改过程中，对象引用有效性未得到正确维护，程序在后续页面信息查询时访问已释放的无效指针，可导致崩溃或远程代码执行。该漏洞影响 Foxit PDF 编辑器及阅读器的多个版本，攻击者需诱导用户打开恶意 PDF 文件方可利用，CVSS 评分 7.8，危害等级高，成功利用可完全控制受影响系统。"
published = "2026-04-27T12:16:24.717"
remediation = "建议立即将 Foxit PDF Reader 升级至 2026.1.1 或更高版本，将 Foxit PDF Editor 升级至 2026.1.1/14.0.4 或更高版本。可通过软件内「帮助」>「检查更新」自动升级，或前往 Foxit 官网下载完整安装包。如暂无法升级，应避免打开来源不明的 PDF 文件，并在「偏好设置」>「JavaScript」中禁用 JavaScript 执行作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Foxit PDF 编辑器/阅读器 AcroForm 注释释放后使用远程代码执行漏洞"
updated = "2026-06-17T10:59:55.963"

