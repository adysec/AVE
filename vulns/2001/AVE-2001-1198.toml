[basic]
description = "tags.<value>HP-UX 11.x 版本的 FTP 服务器存在缓冲区溢出漏洞，远程攻击者可通过构造超长路径名并向目标 FTP 服务发送 STAT 命令触发该漏洞。由于 FTP 服务器在处理 STAT 命令时会调用 glob 函数展开路径字符串，当路径名超过缓冲区边界时发生溢出，攻击者借此可在目标系统上执行任意系统命令，从而完全控制受影响的主机。该漏洞影响 HP-UX 11.x 各版本，CVSS 评分 9.8，危害等级严重。攻击者无需身份认证，只要目标 FTP 服务可达即可被直接利用，具备远程代码执行能力。"
published = "2001-06-18T04:00:00.000"
remediation = "tags.<value>立即为 HP-UX 11.x 安装惠普官方安全补丁，更新 FTP 服务程序以修复 STAT 命令中 glob 路径展开导致的缓冲区溢出问题。如无法立即升级，可临时禁用 FTP 服务，或在防火墙中限制 21 端口的访问来源，仅允许可信 IP 地址连接，以降低被远程利用的风险。"
score = 9.8
severity = "CRITICAL"
sources = ["cve"]
title = "惠普 HP-UX FTP 服务缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:57.610"

