[basic]
description = "Apple Safari 浏览器所采用的 WebKit 渲染引擎在处理 SVG 文档中 use 元素时存在内存破坏漏洞，远程攻击者可构造包含恶意 use 元素的 SVG 文档，诱导用户使用受影响版本的 Safari 打开该文档，从而触发堆内存越界访问，导致应用程序崩溃或执行任意代码。该漏洞影响 Mac OS X 10.4 至 10.6 上 Safari 4.1.1 之前版本及 Safari 5.0.1 之前版本，同时影响 webkitgtk 1.2.6 之前版本，CVSS v3 评分为 9.3，危害等级严重。由于该漏洞可通过网络远程触发且无需身份认证，攻击者可在用户浏览恶意网页或打开特制 SVG 文件时直接获得系统控制权，对机密性、完整性和可用性造成完全损害。"
published = "2010-07-30T20:30:02Z"
remediation = "Mac OS X 用户请通过「系统偏好设置」→「软件更新」将 Safari 升级至 5.0.1（Mac OS X 10.5/10.6）或 4.1.1（Mac OS X 10.4）及以上版本；Windows 用户请下载安装 Safari 5.0.1 或更高版本；Linux 用户请将 WebKitGTK+ 升级至 1.2.6 或更高版本。临时缓解措施：避免访问包含恶意 SVG 文档的不可信网站，或暂时禁用 WebKit/WebView 组件对 SVG 的渲染支持。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit SVG use 元素内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:19:20Z"

