[basic]
description = "WordPress 的 wpsolr-search-engine 插件 7.6 版本中存在反射型跨站脚本漏洞（Reflected XSS，CWE-79）。该漏洞源于程序未对用户输入进行充分的过滤与转义处理，攻击者可通过构造特制的恶意 URL 并诱使已登录的管理员或用户点击，导致恶意 JavaScript 代码在受害者浏览器中执行，从而窃取会话 Cookie、劫持用户会话或篡改页面内容。攻击无需身份认证，但需要用户交互，影响使用该插件的所有 WordPress 站点。"
published = "2016-10-10T20:59:33Z"
remediation = "立即将 wpsolr-search-engine 插件升级至最后可用版本 20.1（WordPress 后台插件页面检查更新）；由于该插件已永久关闭且不再维护，建议迁移至其他受支持的 WordPress 搜索插件（如 ElasticPress 或 SearchWP）。临时缓解措施：在 Web 应用防火墙（WAF）层面添加规则，过滤 URL 查询参数中的 `<script>`、`onerror`、`onload` 等 XSS 载荷特征，并对用户输入进行 HTML 实体编码。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress wpsolr-search-engine 插件反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:47Z"

