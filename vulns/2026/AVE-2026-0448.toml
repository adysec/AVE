[basic]
description = "n8n-MCP 在多租户 HTTP 部署模式下存在跨租户访问工作流版本备份的授权漏洞（CWE-639）。由于工作流版本历史备份未按租户隔离，已认证的攻击者可通过正常 API 请求读取其他租户的工作流快照，获取其中包含的节点凭证引用和授权标头等敏感信息，还可删除或破坏其他租户的备份数据。该漏洞影响 n8n-MCP 2.56.0 及之前版本，需满足 ENABLE_MULTI_TENANT=true 的多租户 HTTP 部署条件，CVSS 评分 9.9，危害等级严重。开发者已在 2.56.1 版本中通过实例级隔离修复此问题。"
published = "2026-07-15T21:16:54Z"
remediation = "立即升级至 n8n-mcp v2.56.1 或更高版本，该版本已隔离各租户的工作流版本历史。如无法立即升级，设置环境变量 `DISABLED_TOOLS=n8n_workflow_versions` 禁用受影响工具，或改为单租户部署（每租户独立实例与数据库），并限制 HTTP 端点仅对可信操作者开放。"
score = 9.9
severity = "CRITICAL"
sources = ["ghsa"]
title = "n8n n8n-MCP 跨租户工作流版本历史越权访问漏洞"
updated = "2026-07-18T03:16:37Z"

