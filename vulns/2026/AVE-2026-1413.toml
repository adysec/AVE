[basic]
description = 'Electron 是一个使用 JavaScript、HTML 和 CSS 编写跨平台桌面应用程序的框架。DevTools 的"在文件管理器中显示"功能存在缺陷，本应仅在文件管理器中展示目标文件，却可能直接执行该文件。攻击者若通过恶意 DevTools 扩展或其他手段在 DevTools 前端执行脚本，可在打开了 DevTools 且面向不可信内容或加载了不可信 DevTools 扩展的窗口中，利用 showItemInFolder 处理器触发任意原生代码执行，从而绕过 Electron 沙箱限制。该漏洞仅影响允许 DevTools 访问不可信内容的 Electron 应用。CVSS v3.1 评分为 6.9，危害等级为中等。官方已在 39.8.9、40.9.2、41.2.1 及 42.0.0-beta.3 版本中修复此问题。'
published = "2026-08-05T18:17:15Z"
remediation = "建议将 Electron 升级至 39.8.9、40.9.2、41.2.1 或 42.0.0-beta.3 版本以修复该漏洞。如无法立即升级，应关闭加载不可信内容窗口的 DevTools 功能，并禁止加载来源不明的 DevTools 扩展程序作为临时缓解措施。"
score = 6.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "Electron DevTools 远程代码执行漏洞"
updated = "2026-08-06T05:17:09Z"

