[basic]
description = "Linuxfabrik Monitoring Plugins 存在命令注入漏洞，当检测插件将用户提供的输入直接传递给 shell_exec 函数执行时，攻击者可通过在参数中嵌入管道符（|）等特殊字符注入任意命令。该漏洞对配置在 sudoers 文件中的插件危害尤为严重，允许控制 nagios 用户的攻击者利用 sudo 权限执行任意命令实现本地权限提升。以 restic-check 插件为例，攻击者可在 --repo 参数中注入恶意命令，shell_exec 会按管道符拆分并分别执行，导致嵌入命令被触发。Linuxfabrik 已在 linuxfabrik-lib 5.0.0 版本中修复，改用数组参数传递方式并禁用 shell 模式。"
published = "2026-01-01T00:00:00Z"
remediation = "升级 linuxfabrik-lib 至 5.0.0 或更高版本，并将 Linuxfabrik Monitoring Plugins 升级至 v5.2.0 以上版本。升级后所有插件已改用 argv 数组方式调用外部命令（shell=False），用户输入不再被 shell 解析，可彻底阻断命令注入。如无法立即升级，应从 sudoers 中移除 nagios 用户对受影响插件的免密执行权限，以限制本地提权路径。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "Linuxfabrik Monitoring Plugins 本地权限提升漏洞"
updated = "2026-01-01T00:00:00Z"

