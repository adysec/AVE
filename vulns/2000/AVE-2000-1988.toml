[basic]
description = "Netscape（iPlanet）Certificate Management System 4.2 及 Directory Server 4.12 存在管理员密码明文存储漏洞。系统将管理员密码以明文形式存储在配置文件中，本地攻击者可通过读取该文件直接获取管理员密码，进而完全控制服务器。由于受影响服务通常暴露于网络，远程攻击者若获得服务器文件读取权限（如通过其他漏洞配合），同样可实施攻击。该漏洞 CVSS 评分 10.0，危害等级严重，可导致服务器完全沦陷。"
published = "2000-12-11T05:00:00Z"
remediation = "升级到 Sun ONE Directory Server 5.0 或更高版本，该版本已修复明文存储密码问题。如无法升级，立即限制配置文件（如 admpw 等）的文件系统权限为仅管理员可读，并考虑迁移至 Oracle Directory Server Enterprise Edition 或开源替代方案 OpenDS/389 Directory Server。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Netscape iPlanet 证书管理系统和目录服务器 明文存储敏感信息漏洞"
updated = "2026-06-16T21:53:06Z"

