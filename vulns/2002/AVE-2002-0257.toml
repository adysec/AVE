[basic]
description = "Ethereal（即后来的Wireshark）0.9.4及更早版本中的SOCKS、RSVP、AFS和LMP协议解析器存在安全缺陷。未经认证的远程攻击者可通过向目标系统发送特制的畸形网络数据包，触发这些协议解析器发生核心转储（core dump），导致Ethereal进程崩溃从而引发拒绝服务。在特定条件下，攻击者可能利用解析器处理异常数据时的内存错误执行任意代码。该漏洞影响Ethereal 0.9.4及之前所有版本，CVSS评分7.5，危害等级高。"
published = "2002-08-12T04:00:00Z"
remediation = "立即将 Ethereal 升级至 0.9.5 或更高版本（Debian 系统安装 ethereal 0.9.4-1woody1 及以上版本）。该软件已更名为 Wireshark，建议迁移至最新版 Wireshark 4.x 系列以获得长期安全支持。如无法升级，可在防火墙规则中禁用对受影响端口（SOCKS 1080、RSVP 等）的未授权访问作为临时缓解。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Ethereal 多协议解析器远程拒绝服务漏洞"
updated = "2026-06-16T21:58:12Z"

