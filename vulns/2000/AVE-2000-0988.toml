[basic]
description = 'WFTPD及WFTPD Pro 2.41 RC12 FTP服务器存在信息泄露漏洞。当远程攻击者向服务器发送"%C"命令时，服务器会在错误响应消息中返回自身的完整文件系统路径名。攻击者可借此获取目标服务器的目录结构信息，为后续的目录遍历或文件读取攻击提供便利。该漏洞无需身份认证即可利用，CVSS评分为5.0，危害等级中等。'
published = "2000-11-14T05:00:00.000"
remediation = '升级 WFTPD 至 2.41 后续修复版本（该版本已不再在错误消息中返回完整服务器路径），或更换至最新版 WFTPD Pro。如暂时无法升级，可在服务器配置中禁用或限制 "%C" 自定义命令的使用，并在防火墙或 FTP 软件层面屏蔽包含路径信息的错误响应，同时将 FTP 服务运行权限降至最低。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "WFTPD WFTPD Pro 2.41 RC12 服务器全路径名泄露漏洞"
updated = "2026-06-16T21:52:39.233"

