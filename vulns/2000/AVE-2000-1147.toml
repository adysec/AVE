[basic]
description = "tags.<value>Apache HTTP Server 1.3.0 至 1.3.11 版本存在跨站脚本（XSS）漏洞。该漏洞源于 printenv CGI 脚本（printenv.pl）未对输出内容进行 HTML 编码，以及 ap_send_error_response 函数生成的错误页面（如默认 404 页面）未指定显式的字符集，同时某些 Apache 模块或核心代码生成的消息亦存在相同问题。未经身份认证的远程攻击者可利用这些漏洞，通过向目标服务器发送特制的请求，注入恶意脚本代码。当其他网站访问者查看受影响的页面（如 printenv 输出或错误页面）时，恶意脚本将在其浏览器中执行，可能导致会话劫持、Cookie 盗取、网页篡改等安全问题。攻击复杂度较低，仅需网络访问即可触发，无需身份认证，CVSS 评分 4.3，危害等级中等。"
published = "2000-02-01T05:00:00Z"
remediation = "升级 Apache HTTP Server 到 1.3.12 或更高版本。如暂时无法升级，应删除或禁用 cgi-bin 目录下的 printenv.pl 脚本，并在 httpd.conf 中通过 AddDefaultCharset UTF-8 指令为默认错误页面显式设置字符编码，同时在 Apache 配置文件中关闭 UseCanonicalName 选项以缓解错误页面 XSS。"
score = 4.3
severity = "MEDIUM"
sources = ["cve"]
title = "Apache HTTP Server printenv CGI 跨站脚本攻击漏洞"
updated = "2026-06-16T21:53:22Z"

