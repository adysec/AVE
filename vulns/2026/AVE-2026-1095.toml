[basic]
description = "部分 HP DeskJet 系列一体机打印机存在基于栈的缓冲区溢出漏洞（CWE-121）。当设备处理通过 WSD（Web Services for Devices）协议接收的特制扫描请求时，由于对输入数据的边界检查不足，攻击者可在缓冲区中写入超出预期长度的数据并覆盖相邻内存区域，从而在打印机固件上执行任意代码。该漏洞影响支持 WSD 扫描功能的 HP DeskJet All in One 设备，攻击者无需身份认证即可在局域网内发送恶意构造的 WSD 扫描请求触发漏洞，实现远程代码执行并完全控制目标设备。由于 WSD 协议允许用户在无需安装专用驱动程序的情况下直接向网络扫描仪发送扫描任务，此类设备通常部署在企业办公网络环境中，攻击者可利用该漏洞作为内网横向移动的跳板，进而访问敏感打印数据或进一步渗透内网系统。CVSS 评分为 8.7，危害等级高。"
published = "2026-04-15T15:16:42Z"
remediation = "立即将受影响设备升级至固件版本 2612A 或更高版本（受影响型号包括 HP DeskJet 2800e/4200/4200e/Ink Advantage 2800/4200/Ultra 4900 全系列一体机），可通过 HP 官方支持页面 https://support.hp.com/us-en/document/ish_14744451-14744475-16/hpsbpi04110 下载对应固件并按照说明安装。如暂时无法升级，应在防火墙或网络层面阻断不必要的 WSD（Web Services for Devices）扫描流量，限制来自不可信主机的 TCP 端口 5357（WSD 端口）访问，以降低被远程利用的风险。"
score = 8.7
severity = "HIGH"
sources = ["zdi"]
title = "HP DeskJet 一体机 WSD 扫描远程代码执行漏洞"
updated = "2026-06-17T10:57:01Z"

