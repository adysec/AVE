[basic]
description = "Ruslan Communications <Body>Builder 存在 SQL 注入漏洞，远程攻击者无需身份认证即可通过在用户名和密码字段中注入 `'--` 序列绕过认证机制，获取管理员权限。攻击者可完全控制受影响系统的数据库，导致敏感信息泄露、数据篡改或进一步渗透。该漏洞 CVSS 评分 10.0，危害严重，ExploitDB 已公开利用代码。"
published = "2002-10-04T04:00:00.000"
remediation = "立即升级 Ruslan Communications <Body>Builder 至最新版本，或联系厂商获取安全补丁。如无法升级，在应用层面对用户输入进行严格的参数化查询过滤，对 username 和 password 字段禁止包含 SQL 特殊字符（如单引号、双引号、注释符 --），并在 Web 服务器（如 IIS/Apache）的 WAF 规则中拦截包含 SQL 注入特征的请求作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Ruslan Communications Body Builder 认证绕过漏洞"
updated = "2026-06-16T21:58:26.900"

