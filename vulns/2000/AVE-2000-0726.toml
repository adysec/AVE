[basic]
description = "NetWin dMailWeb 和 cwMail 2.6i 及更早版本的 POP 服务中存在拒绝服务漏洞。远程攻击者无需任何身份认证，只需向目标服务器的 POP 端口发送一个超长的 `pophost` 参数，即可导致服务进程崩溃或进入无响应状态，造成正常的邮件服务中断。该漏洞攻击门槛低，危害中等，CVSS 评分 5.0，影响 dMailWeb 和 cwMail 2.6i 及之前的所有版本。"
published = "2000-06-21T04:00:00Z"
remediation = "该产品已停止维护，建议迁移至 NetWin 新版 WebMail 产品（https://netwinsite.com/webmail）。如无法立即迁移，可在 Web 服务器或反向代理层限制 pophost 参数长度不超过 256 字符，并在防火墙中限制仅允许可信 IP 访问 dmailweb/cwmail 服务，以降低远程 DoS 攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "NetWin DMailWeb/CWMail POP 参数远程拒绝服务漏洞"
updated = "2026-06-16T21:52:06Z"

