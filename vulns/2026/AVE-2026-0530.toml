[basic]
description = "safeurl 库的私有网络黑名单（privateNetworks）缺少新加入的 IPv6 CIDR 范围，包括 NAT64 本地使用前缀（64:ff9b:1::/48）、SRv6 SID 段（5f00::/16）、文档前缀（3fff::/20）及虚拟 IPv6 前缀（100:0:0:1::/64）。攻击者可利用这些未屏蔽的 IPv6 地址段绕过安全限制，访问本应被阻止的内部资源。该漏洞影响 safeurl 库 v0.2.4 之前版本，需攻击者能够控制目标应用请求的目标地址。升级至 v0.2.4 或禁用 IPv6 即可修复。"
published = "2026-01-01T00:00:00Z"
remediation = "升级 safeurl 至 v0.2.4 或以上版本，该版本已补充缺失的 IPv6 CIDR 范围（64:ff9b:1::/48、5f00::/16、3fff::/20、100:0:0:1::/64）。如无法立即升级，可通过调用 EnableIPv6(false) 禁用 IPv6 功能作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Doyensec safeurl IPv6 CIDR 黑名单缺失导致 SSRF 防护绕过漏洞"
updated = "2026-01-01T00:00:00Z"

