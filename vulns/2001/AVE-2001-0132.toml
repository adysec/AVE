[basic]
description = "Sapio WebReflex 1.55 自带的 HTTP 服务器（HTTPd）在处理 HTTP GET 请求时存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过向目标服务器发送包含超长 URI 的 HTTP GET 请求来触发该溢出，导致服务崩溃拒绝服务，并在特定条件下可能执行任意系统命令。该漏洞影响运行 Sapio WebReflex 1.55 版本的服务器，攻击条件极为宽松，仅需目标服务器开放 HTTP 端口且运行受影响版本即可被利用，无需任何认证凭据。ExploitDB 上已公开相关利用代码（exploits/20650），进一步提升了该漏洞被实际利用的风险。"
published = "2001-05-03T04:00:00Z"
remediation = "停止使用已停止维护的 Sapio WebReflex 1.55 版本，建议迁移至 Apache 或 Nginx 等现代安全 Web 服务器。若无法迁移，请在网络前端部署 WAF 或 IPS，配置严格的请求长度限制规则，拦截异常超长的 HTTP GET 请求以缓解漏洞利用。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Sapio WebReflex HTTP GET 请求缓冲区溢出漏洞"
updated = "2026-06-16T21:54:03Z"

