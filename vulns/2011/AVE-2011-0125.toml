[basic]
description = "Opera浏览器存在多个安全漏洞，影响版本低于11.50。攻击者可通过向目标系统发送特制的IPv6数据包或触发多个无效URL请求，利用浏览器错误处理机制导致浏览器崩溃或磁盘空间耗尽，从而实现拒绝服务攻击。尽管有报告指出可能存在远程代码执行风险，但官方评级显示主要影响是应用崩溃。攻击者无需身份验证即可远程触发此漏洞，导致浏览器无法正常工作，严重影响用户网络体验。该漏洞涉及Opera对网络内容处理机制的多重缺陷，包括错误页面生成机制、数据URI处理异常以及多个浏览器组件（如JavaScript、打印功能、CSS布局等）的解析漏洞。攻击者可通过精心构造的恶意网页或特定协议数据包触发这些漏洞，实现对受害者浏览器的控制或使其瘫痪。微软等浏览器厂商已陆续对Opera浏览器进行了安全补丁更新，用户应及时升级至支持的安全版本以获取防护。"
published = "2011-07-01T10:55:02Z"
remediation = "建议立即升级 Opera 浏览器至 11.50 或更高版本，可访问官网 https://www.opera.com/download 下载最新安装包并覆盖安装。若暂时无法升级，建议暂时禁用 JavaScript 或使用其他浏览器访问不可信网站，作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera Opera 浏览器 远程拒绝服务漏洞"
updated = "2026-06-16T23:31:39Z"

