[basic]
description = "PHPLib 团队 PHPLIB 7.2 及更早版本存在目录遍历漏洞，当 PHP 的 register_globals 设置为开启时，攻击者可通过发送 HTTP 请求操纵 $_PHPLIB[libdir]，使其指向攻击者控制的恶意代码服务器，从而执行任意脚本代码。此漏洞影响 Horde 1.2.5 及更早版本、IMP 2.2.6 及更早版本及其他使用 PHPLib 的软件包，当 register_globals 功能未关闭时，将导致远程代码执行的严重安全风险。CVSS 评分 10.0（AV:N/AC:L/Au:N/C:C/I:C/A:C），危害等级极高。Microsoft 已于 2024 年 8 月安全更新中修复此漏洞。"
published = "2001-07-21T04:00:00Z"
remediation = "升级 PHPLib 至 7.2d 或更高版本（修复了 prepend.php3 中的远程脚本执行漏洞）。在 php.ini 中设置 register_globals = Off 禁用全局变量注册，这是该漏洞的前置条件。若无法立即升级，可通过 Web 应用防火墙拦截包含 _PHPLIB[libdir] 参数的请求，或在 prepend.php3 中添加输入验证过滤 libdir 参数。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "PHPLib Team PHPLIB 7.2 远程脚本执行漏洞"
updated = "2026-06-16T21:56:08Z"

