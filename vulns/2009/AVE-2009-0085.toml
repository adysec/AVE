[basic]
description = "Apple iPhone OS 3.0 及 3.0.1 版本（含 iPod touch）的 MobileMail 组件存在信息泄露漏洞。由于系统在 Spotlight 搜索结果中未正确清除已删除电子邮件消息的索引，导致即使用户已将邮件删除，其内容仍可通过 Spotlight 搜索功能被访问和读取。攻击条件为攻击者需物理接触设备或拥有设备本地访问权限。利用方式为攻击者通过 Spotlight 搜索功能查找并读取已删除邮件中的敏感信息，可能导致个人隐私数据泄露。该漏洞影响 iPhone 和 iPod touch 设备，CVSS 评分 2.1，危害等级较低。"
published = "2009-09-10T21:30:01Z"
remediation = "建议将 Apple iPhone OS 升级至 3.1 或更高版本（iPod touch 升级至 3.1.1），以修复 Spotlight 显示已删除邮件的信息泄露问题。如无法立即升级，可暂时关闭 Spotlight 的邮件索引功能作为缓解措施。"
score = 2.1
severity = "LOW"
sources = ["tenable"]
title = "Apple iPhone OS 信息泄露漏洞"
updated = "2026-06-16T23:09:00Z"

