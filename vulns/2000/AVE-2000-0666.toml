[basic]
description = "OpenBSD 2.6 及更早版本中存在 ARP 请求洪泛拒绝服务漏洞。远程攻击者可通过向目标服务器发送大量伪造的 ARP 请求数据包，导致系统 ARP 缓存表被耗尽，无法处理合法的网络通信，从而造成拒绝服务。该漏洞攻击条件简单，无需认证即可远程触发，影响 OpenBSD 2.6 及之前版本。"
published = "2000-12-19T05:00:00Z"
remediation = "升级到 OpenBSD 2.7 或更高版本，该版本已修复 ARP 请求洪泛导致的拒绝服务问题。如无法升级，可在网络边界配置防火墙规则限制入站 ARP 请求速率，例如使用 pf 的 `max-packets` 限制或 ipf 的 `keep-state` 规则对 ARP 流量进行限速，同时将受影响的系统隔离在可信网络段内以减少攻击面。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "OpenBSD 2.6 ARP请求洪泛拒绝服务漏洞"
updated = "2026-06-16T21:52:45Z"

