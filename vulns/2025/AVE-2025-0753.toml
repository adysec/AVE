[basic]
description = "Microsoft Digest 身份验证组件存在远程代码执行漏洞，该漏洞源于 Digest 认证协议在处理特定认证请求时存在内存损坏问题。未经身份认证的远程攻击者可在无需用户交互的情况下，通过向目标系统发送特制的 HTTP 请求触发该漏洞，成功利用可在目标系统上执行任意代码。该漏洞影响多个 Windows Server 版本，CVSS 评分 8.1，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:51Z"
remediation = '立即安装 Microsoft 2025 年 1 月安全更新（KB5050061），涵盖 Windows 10/11 及 Windows Server 全系列受影响版本。可通过 Windows Update 自动获取更新，或从 Microsoft 更新目录网站手动下载安装。如无法立即打补丁，可在域控和客户端上禁用 Digest 身份验证作为临时缓解措施：在注册表 `HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\Digest` 中将 `Enabled` 设为 0，或通过组策略禁用 Digest 认证。'
score = 8.1
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Digest 身份验证远程代码执行漏洞"
updated = "2026-06-17T08:43:01Z"

