[basic]
description = "Apex One/SEP 代理存在时间检查与时间使用（TOCTOU）竞争条件漏洞。本地攻击者若已获得目标系统的低权限代码执行能力，可通过在文件或资源检查与使用操作之间插入竞争窗口，利用该漏洞绕过安全验证并将权限提升至 SYSTEM 级别。该漏洞影响 Apex One 本地部署版（低于 14.0.0.17079）及 Apex One SaaS 版（低于 14.0.20731）。成功利用可导致系统完全被控，机密性、完整性和可用性均遭严重损害，CVSS 评分 7.8（高危）。Trend Micro 已在官方安全公告 KA-0023430 中提供修复方案，建议用户升级至最新版本以消除风险。"
published = "2026-05-21T14:16:48.257"
remediation = "立即将 Apex One（本地部署版）安全代理升级至版本 14.0.0.17079（新安装）或 SP1 CP Build 18012（现有 SP1 用户），将 Apex One as a Service / Vision One SEP 安全代理升级至版本 14.0.20731 或更高版本。可通过 Apex One 控制台推送更新，或从 Trend Micro Download Center 手动下载安装最新代理补丁。如暂时无法打补丁，建议通过防火墙限制对受影响主机的本地访问权限，并审查远程访问策略以降低本地攻击面。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Trend Micro Apex One/SEP Agent 本地权限提升漏洞"
updated = "2026-07-23T16:10:00.137"

