[basic]
description = "标签包裹。<value>Infobot 是一款开源的 IRC 聊天机器人程序，其 0.44.5.3 及更早版本内置的 fortran math component（Fortran 数学计算组件）存在严重的命令注入漏洞。该漏洞的原理是组件在处理外部输入时未对 shell 元字符进行充分的过滤与转义，导致未经身份认证的远程攻击者可通过向该组件发送包含 shell 元字符的特制数据，在目标系统上执行任意操作系统命令。影响范围涵盖所有部署了 Infobot 0.44.5.3 及更早版本的服务器，由于该程序通常以较高权限运行，攻击成功后可完全控制目标主机，造成敏感数据泄露、服务中断或被作为进一步内网渗透的跳板。攻击条件极为简单，攻击者仅需网络连接到运行 Infobot 的服务器即可发起利用，无需任何身份验证凭据。CVSS v2 基础评分为满分 10.0，严重等级为高。"
published = "2001-06-02T04:00:00Z"
remediation = "建议升级 Infobot 至 0.45.3 或更高版本（0.49 及以上版本已移除存在漏洞的 fortran math 组件），可从 SourceForge（http://infobot.sourceforge.net/download.html）下载最新稳定版源码重新编译部署。若无法立即升级，应在配置文件或启动脚本中禁用 fortran math 模块，并在防火墙层面限制对 Infobot 服务的访问来源，仅允许受信任的 IRC 服务器 IP 连接，以阻断远程攻击面。同时建议在 IRC 服务端配置访问控制列表，禁止未知来源向 Infobot 发送包含 shell 元字符的恶意数学表达式请求。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Infobot 远程代码执行漏洞"
updated = "2026-06-16T21:53:55Z"

