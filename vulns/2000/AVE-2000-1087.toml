[basic]
description = 'Trend Micro InterScan VirusWall 在安装过程中会创建名为 "Intscan" 的网络共享，指向 "InterScan" 目录，但该共享的权限设置存在严重缺陷——默认授予 Everyone 组完全控制（Full Control）权限。本地攻击者可通过访问该共享，直接修改 VirusWall 程序文件（如可执行程序或配置文件），从而提升权限至系统级，实现完全控制目标系统。该漏洞攻击复杂度低，无需身份认证即可利用，影响 Trend Micro InterScan VirusWall 所有受影响的版本。'
published = "2001-01-09T05:00:00Z"
remediation = '立即移除"Intscan"网络共享，或修改其权限为仅允许管理员完全控制，删除Everyone组的完全控制权限。如Trend Micro InterScan VirusWall仍在运行，建议升级到已修复此问题的最新版本或迁移至替代产品。'
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Trend Micro InterScan VirusWall 权限提升漏洞"
updated = "2026-06-16T21:53:09Z"

