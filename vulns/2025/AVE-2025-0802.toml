[basic]
description = "Windows Web 威胁防御用户服务存在权限管理不当漏洞，导致未授权信息泄露。未经身份认证的远程攻击者可利用该服务对 Web 威胁的检测处理机制，在无需用户交互的情况下获取目标系统的敏感信息，造成机密性影响。该漏洞影响 Windows 10/11 及 Windows Server 多个版本，CVSS 评分 7.5，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:16:00Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 (KB5050021)，可通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载。安装后重启系统使修复生效。如无法立即打补丁，建议限制 Web Threat Defense 服务的网络访问权限作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Web 威胁防御用户服务信息泄露漏洞"
updated = "2026-06-17T08:43:09Z"

