[basic]
description = "Linux kernel netfilter 子系统中 nft_tunnel 模块的 geneve_opt 解析逻辑存在类型混淆导致的堆越界写入漏洞。当处理多个 NFTA_TUNNEL_KEY_OPTS_GENEVE 属性时，代码在计算下一个 geneve_opt 结构位置时未按字节单位进行指针加法，而是在加法前错误地进行类型转换，导致向堆内存越界写入数据。攻击者可在本地系统以低权限用户身份构造特制的 netlink 消息触发该漏洞，进而在内核上下文中执行任意代码，实现权限提升或拒绝服务攻击。该漏洞影响包含 netfilter 子系统且使用了 nft_tunnel 模块的 Linux 内核版本，本地攻击者可利用此漏洞获取系统 root 权限。"
published = "2025-04-16T15:15:59Z"
remediation = "将 Linux 内核升级至已修复该漏洞的稳定版本：5.10.236、5.15.180、6.1.134、6.6.87、6.12.23、6.13.11 或 6.14.2 及以上。各主流发行版应通过官方包管理器安装内核安全更新（如 Debian/Ubuntu 执行 apt upgrade linux-image，RHEL/CentOS 执行 dnf update kernel，SUSE 执行 zypper update kernel），安装后重启系统使新内核生效。如短期内无法升级，可通过 sysctl 临时禁用 nf_tables 的 tunnel 对象类型（nft add table inet test; nft delete table inet test）以降低攻击面，但此措施仅作应急使用，需尽快完成内核升级。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux kernel netfilter nft_tunnel 堆越界写漏洞"
updated = "2026-07-14T13:17:30Z"

