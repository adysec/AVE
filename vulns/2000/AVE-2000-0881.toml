[basic]
description = "FreeBSD 3.x、4.x 和 5.x 版本存在本地拒绝服务漏洞，源于内核对 ELF 可执行文件镜像头部解析时缺乏完整性校验。本地攻击者可通过构造畸形 ELF 文件头（如损坏的段头表、程序头表或异常字段值）并执行该程序，触发内核在加载 ELF 二进制时的解析异常，导致内核崩溃或拒绝服务。攻击条件为攻击者需拥有本地系统账户并能执行自定义二进制文件，利用方式为编译或手工构造畸形 ELF 可执行文件并直接运行。该漏洞影响 FreeBSD 3.x 至 5.x 全系列版本，CVSS 评分 2.1（本地访问/低复杂度/无需认证/部分可用性影响），属于本地拒绝服务漏洞，FreeBSD 官方已在后续版本中修复该漏洞。"
published = "2000-10-20T04:00:00Z"
remediation = "升级到 FreeBSD 4.1.1-STABLE 或更高版本（4.x 分支），或 5.0-CURRENT 2000 年 8 月 9 日之后的最新快照。如无法立即升级，可应用 FreeBSD-SA-00:00.elf 安全公告中发布的补丁重建内核，补丁文件可从 FreeBSD 官方档案获取。作为临时缓解措施，应避免以 root 或普通用户身份执行来源不明的 ELF 格式二进制文件，直至完成系统升级。FreeBSD 3.x 和更早版本已停止官方支持，建议迁移至受支持的稳定版本。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "FreeBSD FreeBSD 3.x/4.x/5.x ELF 映像头畸形本地拒绝服务漏洞"
updated = "2026-06-16T21:52:21Z"

