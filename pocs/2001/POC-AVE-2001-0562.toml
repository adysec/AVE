[info]
author = "ave"
description = "通过非标准TCP数据包检测Tiny Personal Firewall 1.0/2.0出站过滤绕过漏洞。使用非Windows协议适配器构造非标准TCP数据包，验证防火墙是否允许出站连接绕过过滤规则。"
id = "POC-AVE-2001-0562"
name = "ZoneAlarm Tiny Personal Firewall 出站过滤绕过 PoC"
severity = "low"
tags = ["ave-2001-0562"]
vuln_id = [
    "CVE-2001-1549",
    "AVE-2001-0562",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["HTTP/1."]
