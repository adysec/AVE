[basic]
description = 'Bugzilla 2.14 版本低于 2.14.2 以及 2.16 版本低于 2.16rc2 存在权限控制缺陷。拥有编辑权限的已认证用户能够绕过正常用户管理界面的安全限制，直接通过访问 editusers.cgi 脚本并附加 "del" 参数的方式删除系统中的其他用户账户。该漏洞的利用过程无需额外权限或复杂操作，攻击者仅需构造包含删除参数的特定请求 URL 即可在未经授权的情况下删除任意用户，造成用户数据永久丢失和系统完整性破坏。受影响管理员可通过升级至 Bugzilla 2.14.2 或 2.16rc2 及更高版本修复此安全问题。'
published = "2002-08-12T04:00:00Z"
remediation = "将Bugzilla升级至2.14.2或2.16rc2及以后版本，以修复editusers.cgi脚本中允许有编辑权限的用户删除其他用户的漏洞。如暂无法升级，可在Web服务器配置中限制editusers.cgi脚本仅对管理员用户可访问，或暂时禁用该脚本作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Bugzilla 未授权用户删除漏洞"
updated = "2026-06-16T21:58:10Z"

