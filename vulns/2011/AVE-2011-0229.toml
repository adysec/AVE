[basic]
description = "Mozilla Firefox 3.6.24之前版本及4.x至7.0版本、Thunderbird 3.1.6之前版本及5.0至7.0版本在处理包含大量函数的JavaScript文件时存在内存破坏漏洞。攻击者可借助Firebug等调试API诱导用户访问特制的JS文件，触发内存损坏导致应用程序崩溃，造成拒绝服务，甚至可能实现任意代码执行。该漏洞CVSS评分9.3，危害严重，影响Windows/Linux/macOS等多平台。"
published = "2011-11-09T11:55:03Z"
remediation = "升级 Firefox 至 3.6.24 或 8.0 及以上版本，Thunderbird 至 3.1.16 或 8.0 及以上版本，SeaMonkey 至 2.5 及以上版本。如无法立即升级，可在浏览器中禁用 JavaScript（about:config 设置 javascript.enabled 为 false）作为临时缓解措施，但会影响正常功能使用。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird JavaScript函数处理内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:33:41Z"

