[basic]
description = "tags.<value>Apple iOS、iPadOS和watchOS的Mail组件存在缓冲区错误漏洞，攻击者可通过构造恶意邮件消息触发堆内存损坏。该漏洞影响iOS 13.5及更早版本、iPadOS 13.5及更早版本、iOS 12.4.7及更早版本、watchOS 6.2.5及更早版本和watchOS 5.3.7及更早版本。攻击条件为受害者打开特制的邮件消息，无需身份认证即可触发。Apple已在后续版本中通过改进内存处理机制修复此漏洞。"
published = "2020-06-09T17:15:13.377"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
score = 4.3
severity = "MEDIUM"
sources = ["kev"]
title = "Apple iOS、iPadOS和watchOS Mail组件缓冲区错误漏洞"
