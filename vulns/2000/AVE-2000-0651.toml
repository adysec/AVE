[basic]
description = 'ISC BIND 8.2 至 8.2.2-P6 版本的 named 服务在处理压缩区域传输（ZXFR）请求时，对未缓存的权威记录查询处理存在缺陷（即 "zxfr bug"），远程未认证攻击者可发送特制的 ZXFR 请求并触发权威记录查询，导致 named 服务进程崩溃造成拒绝服务。该漏洞影响 BIND 8.2 至 8.2.2-P6 所有版本，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），攻击条件为远程网络访问且无需认证，攻击者只需构造恶意 ZXFR 请求即可触发拒绝服务，ISC 已在后续版本中修复该漏洞。ISC 官方已发布补丁修复该漏洞，建议升级至 BIND 8.2.3 或更高版本。'
published = "2000-12-19T05:00:00.000"
remediation = "立即升级 BIND 至 8.2.3 或更高版本（建议升级至 9.x 稳定版）。若暂无法升级，请在 named.conf 中添加 allow-transfer { trusted_servers; }; 限制区域传输仅允许受信服务器，并在防火墙层面限制 53/TCP 端口仅对授权 IP 开放，禁用 ZXFR 压缩传输功能。建议尽快升级至 BIND 9.16 或更高长期支持版本以彻底修复该漏洞并获得持续安全更新。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "ISC BIND 8.2 ZXFR 请求拒绝服务漏洞"
updated = "2026-06-16T21:52:40.657"

