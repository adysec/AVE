[basic]
description = "Visible Systems Razor 4.1 配置管理工具对其密码文件使用了弱加密算法，本地攻击者可利用该漏洞读取或破解密码文件，从而获取系统更高权限。该漏洞源于密码存储时未采用强加密机制，攻击者只需拥有本地访问权限即可通过分析密码文件实施权限提升攻击。CVSS 评分 4.6，危害等级中危。"
published = "2000-07-05T04:00:00Z"
remediation = "升级 Razor 至 4.1 以上版本，该版本已采用更强的密码加密机制。如无法升级，可在 Razor 配置中切换为本地操作系统认证方式，避免使用 Razor 自带的弱加密密码文件认证。同时限制 rz_passwd 文件的访问权限，仅允许 root 用户读取，防止本地非授权用户获取密码哈希。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Visible Systems Razor 配置管理工具密码文件弱加密漏洞"
updated = "2026-06-16T21:52:01Z"

