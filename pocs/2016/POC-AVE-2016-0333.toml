[info]
author = "AVE"
description = "通过构造恶意 MVG 文件，利用 ImageMagick 的 EPHEMERAL 伪协议在处理图片时删除任意文件。PoC 创建测试文件后使用 convert 处理恶意 MVG 文件，验证文件是否被删除。"
id = "POC-AVE-2016-0333"
name = "ImageMagick EPHEMERAL Arbitrary File Deletion PoC"
severity = "medium"
tags = [
    "cve-2016-3715",
    "imagetragick",
    "file-deletion",
]
vuln_id = [
    "CVE-2016-3715",
    "AVE-2016-0333",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/tmp/ave_test_2016_3715.txt"
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["ave_test_2016_3715"]
