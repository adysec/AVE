[basic]
description = "Kodi Chorus2 2.4.2 插件存在目录遍历漏洞（CWE-22），攻击者可通过在 image 路径参数中构造双重 URL 编码的路径遍历序列 %2E%2E%252e（即 ..%2f）绕过路径验证，实现任意文件读取。该漏洞影响 Kodi 媒体中心安装了 Chorus2 2.4.2 版本插件的所有版本，CVSS 3.0 评分 7.5（HIGH），攻击向量为网络（AV:N），攻击复杂度低（AC:L），无需权限（PR:N）和用户交互（UI:N），仅影响机密性（C:H）。攻击者可通过构造如 image/image%3A%2F%2F%2e%2e%252fetc%252fpasswd 的恶意请求读取服务器敏感文件（如 /etc/passwd），无需身份认证即可远程利用。官方已在后续版本中修复该路径遍历缺陷，建议升级 Chorus2 插件至最新版本或禁用该插件。"
published = "2017-02-28T18:59:00Z"
remediation = "更新 Kodi Chorus2 插件到 2.4.2 及以上版本并禁用图片加载功能。如无法立即更新，可在 Kodi 设置中禁用或卸载 Chorus2 插件，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Kodi Chorus2插件目录遍历漏洞"
updated = "2026-06-17T01:21:33Z"

