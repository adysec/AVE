[basic]
description = "Apache Tomcat 3.1 存在路径信息泄露漏洞。远程攻击者通过向 Tomcat 服务器发送一个不存在的 URL 请求，服务器返回的错误消息中会包含服务器文件系统的物理路径信息。该漏洞可被攻击者利用来探测目标系统的目录结构，为进一步攻击（如定位敏感文件、发现 Web 应用部署路径）提供信息支撑。攻击者无需身份认证即可远程触发，影响运行 Apache Tomcat 3.1 版本的服务器系统。"
published = "2000-10-20T04:00:00.000"
remediation = "升级 Apache Tomcat 至 3.2 及以上版本，该漏洞已在后续版本修复。如无法升级，修改 web.xml 配置自定义错误页面，将 404 等错误码指向通用错误页，避免暴露物理路径信息。同时可在 server.xml 中禁用调试模式输出。"
score = 6.4
severity = "MEDIUM"
sources = ["epss"]
title = "Apache Tomcat 3.1 路径信息泄露漏洞"
updated = "2026-06-16T21:52:25.317"

