[basic]
description = 'Authentix Authentix100 存在认证绕过漏洞，属于访问控制与权限管理缺陷类问题。该漏洞的原理在于 Web 服务器在处理受保护目录的 URL 路径时，未能对点号"."的插入进行严格的规范化与访问控制校验。远程攻击者无需任何身份认证，只需在指向受保护目录的 URL 中插入一个点号，即可绕过原有的认证机制，从而非法访问仅授权用户可见的敏感资源。由于该漏洞可通过简单的URL构造被利用，且影响范围涉及所有使用该产品保护目录访问控制的环境，风险较高。官方建议相关用户尽快升级修复版本，并合理配置目录访问权限以降低被利用的风险。'
published = "2001-01-09T05:00:00Z"
remediation = "由于 Authentix100 已停止维护且无官方补丁，建议采取以下缓解措施：1) 升级或迁移至厂商最新的身份认证/安全网关替代产品，避免继续使用存在漏洞的旧版本；2) 在前端 Web 服务器（如 Apache/Nginx）或反向代理层配置 URL 规范化（URL normalization）规则，拦截并重写包含「.」的敏感目录请求，将请求重定向到目录真实路径后再进行鉴权校验；3) 在应用层对请求路径做规范化处理，去除多余的「.」片段后方可匹配受保护资源；4) 在不影响业务的前提下，通过防火墙或 WAF 对含「/./」或路径遍历特征的请求进行封禁。若条件允许，应彻底废弃该旧系统，改用现代具备安全维护的认证网关。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Authentix Authentix100 认证绕过漏洞"
