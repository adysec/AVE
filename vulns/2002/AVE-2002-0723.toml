[basic]
description = "Polycom ViaVideo 2.2 和 3.0 版本的嵌入式 Web 服务器存在拒绝服务漏洞，未经身份认证的远程攻击者可通过向目标系统发送不完整的 HTTP 请求并保持连接不关闭的方式持续占用服务器资源，导致 CPU 消耗过高、服务不可用。该漏洞影响基于网络可视通信设备的管理界面，攻击者无需凭证即可利用，攻击条件简单（仅需建立 TCP 连接），在网络可达的情况下即可触发。攻击者可通过持续发送半开 HTTP 请求耗尽服务器连接池和 CPU 资源，造成合法用户无法正常访问设备管理界面，影响视频会议设备的正常管理和运维。"
published = "2002-12-31T05:00:00Z"
remediation = "立即联系 Polycom 获取 ViaVideo 2.2/3.0 安全补丁并升级设备固件至修正版本。临时缓解措施：在防火墙或网络边界设备上对 ViaVideo 的 3603 端口实施连接速率限制，禁止外部主机直接访问该端口，或配置反向代理设置 HTTP 请求超时（建议不超过 30 秒）以阻断不完整请求保持连接。补丁安装后重启设备使配置生效，并持续监控 CPU 利用率以确认恢复正常。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Polycom ViaVideo 2.2/3.0 HTTP请求耗尽拒绝服务漏洞"
updated = "2026-06-16T22:00:16Z"

