[basic]
description = "Google Chrome 17.0.963.65 之前版本在处理 HTML 表格节点（table sections）时存在 Use-After-Free（使用后释放）内存安全漏洞。远程攻击者可通过诱导用户访问精心构造的恶意网页，触发浏览器在释放表格相关 DOM 对象后继续访问已释放的内存区域，导致浏览器崩溃拒绝服务，甚至可能利用内存布局控制实现任意代码执行。该漏洞影响 Chrome 17.0.963.65 之前所有版本，攻击者需诱导用户访问恶意页面即可触发，无需用户交互即可触发漏洞利用。CVSS 评分 6.8（AV:N/AC:M/Au:N/C:P/I:P/A:P），属于中高危漏洞。Google 已在 Chrome 17.0.963.65 版本中修复此漏洞，建议用户升级至最新版本。"
published = "2012-03-05T19:55:01Z"
remediation = '立即升级 Google Chrome 到 17.0.963.65 或更高版本，关闭“使用系统默认字体”功能，并启用 Chrome 安全标签模式，通过 RTL 渲染引擎沙箱预防潜在利用。如无法立即更新，可 temporarily 将 Chrome 的“Auto-select Web Framework”设为 "None" 并禁用 PDF 嵌入预览功能作为临时缓解措施。'
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 释放后使用漏洞"
updated = "2026-06-16T23:32:29Z"

