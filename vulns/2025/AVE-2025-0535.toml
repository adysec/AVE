[basic]
description = "node-forge 1.3.1 及更早版本存在 ASN.1 解析时的解释冲突漏洞（CWE-436），未经身份认证的远程攻击者可构造恶意 ASN.1 结构，导致模式验证不同步，产生语义分歧，进而绕过下游加密验证和安全决策。该漏洞影响使用 node-forge ≤1.3.1 的所有项目，包括 openSUSE 16、Ubuntu、TeslaMate 等依赖该库的产品。攻击者无需认证、无需用户交互，通过网络即可远程发起攻击（CVSS 3.1 AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:N，评分 8.6 HIGH），主要影响完整性，可能导致证书验证绕过、签名伪造等安全决策失效。官方已在 node-forge 3.5.0 及后续版本修复，相关发行版已发布安全更新（openSUSE-SU-2026:20177-1、Ubuntu CVE-2025-12816、TeslaMate 更新等）。"
published = "2025-11-25T20:15:58Z"
remediation = "升级 node-forge 到 1.3.2 或以上版本，通过运行 `npm install node-forge@1.3.2` 或在 package.json 中修改版本号来更新。"
score = 8.6
severity = "HIGH"
sources = ["msrc"]
title = "digitalbazaar node-forge 解释冲突导致密码学验证绕过漏洞"
updated = "2026-06-17T08:32:59Z"

