[basic]
description = "Slashcode 2.0 Alpha 之前版本的默认配置中存在硬编码管理密码漏洞。远程攻击者无需身份认证即可利用该默认密码登录系统后台，获取 Slashcode 管理权限，进而可能执行任意命令，完全控制受影响服务器。该漏洞影响范围广泛，攻击条件简单，仅需网络可达即可利用，CVSS 评分 7.5，危害等级高。建议用户升级至 2.0 Alpha 或更高版本以修复此问题。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级 Slashcode 至 2.0 Alpha 或更高版本，该版本已移除默认管理员密码。如无法升级，手动修改管理员账户密码为强密码（至少 12 位含大小写字母、数字和特殊字符），并删除或禁用默认的管理员账户。同时检查服务器上是否存在使用默认凭据创建的其他账户。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Slashcode 默认管理员密码漏洞"
updated = "2026-06-16T21:52:58Z"

