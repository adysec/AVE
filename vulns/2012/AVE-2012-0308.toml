[basic]
description = "Apple Safari 浏览器所采用的 WebKit 渲染引擎存在内存破坏漏洞，影响 Safari 6.0 之前的所有版本。远程攻击者可通过构造恶意网页，利用 WebKit 在处理网页内容时的内存管理缺陷触发缓冲区溢出或内存越界访问，从而实现任意代码执行或导致浏览器崩溃拒绝服务。该漏洞攻击复杂度为中等，无需身份认证即可远程利用，对用户隐私数据及系统安全造成严重威胁。Apple 已在 Safari 6.0 及 iOS 6 安全更新中修复此问题。"
published = "2012-07-25T20:55:03.243"
remediation = "升级到 Safari 6.0 或更高版本以修复 WebKit 内存破坏漏洞。Mac 用户可通过 Mac App Store 或软件更新升级至 Safari 6.0（OS X Mountain Lion 10.8 及更高版本已包含），iOS 用户应升级至 iOS 6.0。如无法立即更新，建议暂时避免访问不受信任的网站，并在 Safari 偏好设置中禁用 JavaScript 作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:37.060"

