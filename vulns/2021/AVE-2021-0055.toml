remediation = "安装 Microsoft 2021 年 6 月安全更新，具体 KB 编号根据系统版本选择：Windows 10 2004/Server 2019 安装 KB5003174，Windows 10 20H2 安装 KB5003173，Windows 10 1909 安装 KB5003171，Windows 8.1 安装 KB5003170，Windows Server 2016 安装 KB5003172，Windows Server 2012 R2 安装 KB5003169，Windows Server 2012 安装 KB5003168，Windows 7 SP1 安装 KB5003167。如暂时无法打补丁，可通过服务管理控制台（services.msc）将 Print Spooler 服务设为禁用或手动停止，以临时缓解远程代码执行风险。"
