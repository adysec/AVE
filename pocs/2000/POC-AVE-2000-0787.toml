[info]
author = "ave"
description = "检测AOL Instant Messenger 4.3.2229之前版本通过aim:// URI协议处理程序触发的缓冲区溢出漏洞。远程攻击者可通过诱导用户访问恶意网页，利用超长aim://链接触发缓冲区溢出，导致任意代码执行。"
id = "POC-AVE-2000-0787"
name = "AOL Instant Messenger aim:// 缓冲区溢出 PoC"
severity = "high"
tags = ["ave-2000-0787"]
vuln_id = [
    "CVE-2000-1093",
    "AVE-2000-0787",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/aim-poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["aim://"]
