[basic]
description = "OpenSSL 0.9.6 和 0.9.7 版本在处理 SSL 客户端证书中的 ASN.1 输入时，未能正确追踪特定字段的字符数量。当使用 ASN.1 长格式编码时，漏洞可导致 OpenSSL 读取超出缓冲区边界的数据，进而引发程序崩溃。未经身份认证的远程攻击者可通过向使用受影响 OpenSSL 版本建立 SSL/TLS 连接的服务器提交特制客户端证书来触发此漏洞，造成拒绝服务。该漏洞影响广泛使用 OpenSSL 的 Web 服务器、邮件服务器及各种网络服务，攻击复杂度低，无需身份验证即可远程利用，仅影响可用性。CERT 在 CA-2003-26 公告中对此漏洞进行了通报，Red Hat、Debian 等主流 Linux 发行商均发布了对应的安全补丁进行修复。"
published = "2003-11-17T05:00:00Z"
remediation = "建议将 OpenSSL 升级至 0.9.6k、0.9.7c 或更高版本，以修复 ASN.1 输入处理中的缓冲区超读漏洞。对于使用 Red Hat Enterprise Linux 的系统，可安装 RHSA-2003:291 或 RHSA-2003:292 安全更新；Debian/Ubuntu 用户应升级至 openssl 0.9.8b-2ubuntu2 或 openssl097 0.9.7k-3。如无法立即升级，可临时在防火墙层面限制传入的 SSL 客户端证书大小，或禁用客户端证书认证作为缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "OpenSSL 0.9.6/0.9.7 ASN.1 拒绝服务漏洞"
updated = "2026-06-16T22:02:24Z"

