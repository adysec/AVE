[basic]
description = "Aptis Software TotalBill 3.0 的 sysgen 服务由于缺乏身份验证机制，导致远程攻击者可以通过连接该服务并直接指定需要执行的系统命令，从而在目标主机上以 root 权限执行任意代码。该漏洞影响 TotalBill 3.0 版本，攻击条件仅需网络可达 sysgen 服务端口，无需任何凭据即可实现完全系统接管，危害等级极高。"
published = "2000-10-20T04:00:00Z"
remediation = "建议立即停止使用并卸载该陈旧软件。若必须运行，请在防火墙中封禁 sysgen 服务相关端口，或配置访问控制列表（ACL）仅允许受信内网 IP 访问，以阻断远程未授权指令执行。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Aptis Software TotalBill 3.0 远程命令执行漏洞"
updated = "2026-06-16T21:52:25Z"

