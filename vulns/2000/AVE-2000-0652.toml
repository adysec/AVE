[basic]
description = "WebBBS 1.15 存在缓冲区溢出漏洞，远程攻击者可通过向目标系统发送特制的超长 HTTP GET 请求触发该漏洞，导致缓冲区溢出，进而实现任意命令执行。该漏洞影响 International Telecommunications WebBBS 1.15 版本，攻击者无需身份认证即可远程利用，CVSS 评分 7.5，危害等级高。目前厂商已停止维护该产品，建议用户迁移至其他受支持的论坛系统。"
published = "2000-06-19T04:00:00Z"
remediation = "立即停止使用 WebBBS 1.15 并迁移至受维护的论坛系统（如 phpBB、Discourse 等）。若短期内无法迁移，在 Web 服务器（Apache/Nginx）层面限制 HTTP GET 请求 URI 长度不超过 2048 字节，例如 Apache 中配置 LimitRequestLine 2048，Nginx 中设置 large_client_header_buffers 4 8k。同时将 WebBBS CGI 脚本的执行目录设置为 noexec 挂载选项，并通过 WAF 规则拦截超长 GET 请求作为临时缓解措施。该软件已于 2000 年后停止维护，无官方补丁可用。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "International Telecommunications WebBBS 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:00Z"

