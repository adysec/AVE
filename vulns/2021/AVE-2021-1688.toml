[basic]
description = "Microsoft Exchange Server 存在安全功能绕过漏洞（CVE-2021-31207），属于 CWE-434 类型。该漏洞允许已通过身份验证的攻击者绕过 Exchange 的安全防护机制，通过发送特制请求利用服务端验证逻辑缺陷，实现对安全功能的绕过。攻击向量为网络（AV:N），但需要高权限（PR:H）且攻击复杂度高（AC:H），无需用户交互（UI:N）。成功利用可导致机密性、完整性、可用性均受到高影响（C:H/I:H/A:H），CVSS 3.1 基础评分 6.6（MEDIUM）。影响范围涵盖 Microsoft Exchange Server 2013/2016/2019 累积更新版本。攻击者需先获取有效凭证，再结合其他漏洞（如 SSRF 或反序列化）组成攻击链进行利用。Microsoft 已于 2021 年 5 月发布安全更新修复此漏洞，建议尽快应用补丁并限制 Exchange 管理接口暴露面。"
published = "2021-05-11T19:15:10Z"
remediation = "立即安装 Microsoft 2021 年 5 月安全更新 KB5003435，将 Exchange Server 升级至以下对应版本：Exchange Server 2013 CU23 升级至版本 15.00.1497.018，Exchange Server 2016 CU19 升级至版本 15.01.2176.014，Exchange Server 2016 CU20 升级至版本 15.01.2242.010，Exchange Server 2019 CU8 升级至版本 15.02.0792.015，Exchange Server 2019 CU9 升级至版本 15.02.0858.012。如无法立即安装补丁，临时缓解措施包括：在 Exchange 前端 IIS 层面通过 URL Rewrite 规则禁用 /autodiscover/autodiscover.json、/autodiscover/autodiscover.json/POWERSHELL 和 /mapi/native 等 ProxyShell 攻击路径的访问，同时在网络边界防火墙限制外部对 Exchange 服务器 443 端口的直接访问，仅允许通过反向代理或 VPN 连接。可通过 Exchange Management Shell 执行 Get-ExchangeServer | Format-List Name,AdminDisplayVersion 命令验证当前版本号是否已达到上述修复版本。"
score = 6.6
severity = "MEDIUM"
sources = ["kev"]
title = "Microsoft Exchange Server 安全功能绕过漏洞"
