[info]
author = "ave"
description = "检测 Windows 2000 IIS 5.0 的 Internet Printing ISAPI 扩展（.printer）缓冲区溢出漏洞。通过向目标发送对 NULL.printer 的 HTTP GET 请求，验证 .printer ISAPI 扩展是否可被正常访问，若返回 200 则表明该扩展已启用并可能受此缓冲区溢出漏洞影响。"
id = "POC-AVE-1999-1562"
name = "CVE-2001-0241 PoC"
severity = "critical"
tags = ["ave-1999-1562"]
vuln_id = [
    "CVE-2001-0241",
    "AVE-1999-1562",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/null.printer"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
