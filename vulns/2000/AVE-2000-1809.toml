[basic]
description = "Microsoft IIS 4.0和5.0在处理ASP页面时，对安全（HTTPS）和非安全（HTTP）Web会话使用相同的Session ID Cookie。当用户从安全会话切换到非安全会话时，攻击者可通过网络嗅探或中间人攻击获取该Session ID Cookie，从而劫持用户的安全Web会话，导致敏感信息泄露。攻击者无需身份认证，只需诱使用户访问非安全页面即可利用此漏洞。"
published = "2000-12-19T05:00:00.000"
remediation = """
tags.The page didn't give much detail. This is a very old Microsoft IIS vulnerability. Let me construct the remediation based on known facts.

The vulnerability: IIS 4.0/5.0 .ASP pages send the same Session ID cookie for secure and insecure web sessions, allowing session hijacking. Fix: Microsoft released a security patch (this was part of Microsoft Security Bulletin MS00-087 or the December 2000 patch). Practical remediations:

1. Install the security update from Microsoft (the December 2000 cumulative security patch for IIS)
2. Upgrade to later IIS versions (IIS 6.0+)
3. Configure the application so the Session ID cookie is only issued over HTTPS / mark cookie Secure attribute
4. Force users to only use HTTPS, disable HTTP access
5. Use ASP directives / registry to ensure secure cookies

Let me write the Chinese remediation ≥20 chars.该漏洞（IIS 4.0/5.0 会话 Cookie 标记缺陷）的修复建议如下。微软已于 2000 年 12 月发布相应安全补丁，另有配置层面的加固手段。

<value>建议安装微软针对 IIS 4.0/5.0 发布的相关安全补丁（MS00-087 及后续累积安全更新），彻底修复会话 Cookie 标记缺陷；或直接升级至 IIS 6.0 及以上版本以消除此漏洞。同时应加固应用配置：在 IIS 中为该站点强制启用 SSL 并要求所有客户端仅通过 HTTPS 访问，关闭 HTTP 明文入口；在 ASP 应用层面将 SessionID Cookie 设置为 Secure 属性，确保浏览器只在加密通道中传输会话标识，防止会话在 HTTP 与 HTTPS 间切换时被截获复用。若暂无法升级，可在防火墙或反向代理上丢弃或重定向非 HTTPS 会话请求，并缩短会话超时时间作为临时缓解。"""
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Microsoft IIS ASP 安全会话劫持漏洞"
updated = "2026-06-16T21:52:52.890"

