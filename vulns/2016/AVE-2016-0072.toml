[basic]
description = "SPIP 3.1.2 及更早版本中的 valider_xml.php 文件存在跨站脚本（XSS）漏洞。远程攻击者可通过向 valider_xml 动作的 var_url 参数注入恶意 Web 脚本或 HTML 代码触发该漏洞，当管理员或其他用户访问被篡改的页面时，恶意脚本将在浏览器中执行，导致敏感信息泄露、会话劫持等危害。攻击无需身份认证，但需诱使用户点击恶意链接，属于反射型 XSS 漏洞。"
published = "2017-01-18T17:59:00Z"
remediation = "升级 SPIP 至 3.1.3 或更高版本，官方已在 revisions 23200-23202 中修复 valider_xml.php 中 var_url 参数未正确过滤的问题。如无法立即升级，可在 Web 服务器层面添加 WAF 规则拦截包含恶意脚本的 var_url 参数请求作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "SPIP 3.1.2 valider_xml.php 跨站脚本漏洞"
updated = "2026-06-17T00:53:52Z"

