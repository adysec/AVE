[basic]
description = "bftpd 1.0.11 中的 bftp 守护进程存在缓冲区溢出漏洞，远程攻击者可通过向 FTP 服务发送超长的 USER 命令触发该漏洞，导致目标系统拒绝服务，甚至可能执行任意代码。该漏洞影响 bftpd 1.0.11 及之前版本，攻击无需身份认证，通过网络即可远程利用，危害较高。目前官方已发布修复版本，建议用户升级至最新版本。"
published = "2000-12-19T05:00:00Z"
remediation = "立即升级 bftpd 至最新版本（当前最新为 6.7），该漏洞在后续版本中已修复。可从 https://sourceforge.net/projects/bftpd/files/bftpd/ 获取。如无法升级，可在 inetd/xinetd 配置中禁用 bftpd 服务，或在防火墙层面限制对 FTP 端口（默认 21）的访问，仅允许可信 IP 连接。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Bftpd bftpd 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:49Z"

