[basic]
description = "js-yaml 是一个 JavaScript YAML 解析与序列化库。在 5.0.0 至 5.2.0 版本中，当启用合并键（merge keys，`<<`）功能时，攻击者可通过构造包含链式映射的 YAML 文档，使解析器在处理每个新映射时枚举前一个映射继承的所有键，导致 CPU 消耗呈二次方增长（O(N²)）。仅需 N=4000 的链式映射即可造成超过 1 秒的解析延迟，文档大小不足 100KB。远程攻击者无需身份认证即可通过提交特制 YAML 文件触发此漏洞，造成服务端拒绝服务。该漏洞已在 5.2.0 版本中修复，默认限制每次解析的合并键总数不超过 10000 个。"
published = "2026-07-08T16:16:33.270"
remediation = "将 js-yaml 升级至 5.2.0 或更高版本（`npm install js-yaml@5.2.0`）。如无法升级，确保 merge 功能保持默认关闭状态（v5 中 merge 默认关闭），不要显式启用 `YAML11_SCHEMA` 或 `JSON_SCHEMA` 等包含 merge 支持的 schema，并限制解析不可信 YAML 输入。"
score = 5.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "js-yaml js-yaml YAML合并键链处理拒绝服务漏洞"
updated = "2026-07-13T15:06:34.173"

