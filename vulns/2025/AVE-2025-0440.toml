[basic]
description = "PostgreSQL 的 libpq 库中的转义函数（PQescapeLiteral、PQescapeIdentifier、PQescapeString、PQescapeStringConn）存在引号语法中和不当漏洞（CWE-149）。当应用程序使用这些函数的返回值构造 psql 交互式终端的输入时，数据库输入提供者可利用编码验证失败的文本注入恶意 SQL 语句，导致 SQL 注入攻击。此外，当客户端编码为 BIG5 且服务器编码为 EUC_TW 或 MULE_INTERNAL 时，PostgreSQL 命令行工具也存在类似问题，命令行参数来源可通过编码转换差异绕过引号转义。攻击者无需身份认证即可远程利用，但利用复杂度较高（需特定编码环境）。该漏洞影响 PostgreSQL 17.3、16.7、15.11、14.16、13.19 之前的所有版本，CVSS 评分 8.1，危害等级高，可导致数据泄露、篡改及未授权访问。"
published = "2025-02-13T13:15:09Z"
remediation = "立即升级 PostgreSQL 至 17.3、16.7、15.11、14.16 或 13.19 及以上版本。如无法立即升级，在应用程序中避免将 PQescapeLiteral() 等函数的结果直接拼接后传入 psql 交互终端，并确保 client_encoding 不使用 BIG5 编码。同时限制数据库连接来源 IP，降低攻击面。"
score = 8.1
severity = "HIGH"
sources = ["msrc"]
title = "PostgreSQL libpq 引用函数 SQL注入漏洞"
updated = "2026-06-17T08:38:22Z"

