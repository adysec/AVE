[basic]
description = "Libsoup HTTP 库在处理请求头时存在解析差异漏洞：当请求中包含多个 Host: 头字段时，库会取最后一个 Host 值进行服务端处理，而常见的前端代理（如反向代理）通常使用第一个 Host 值进行路由转发。这种前后端主机解析不一致可导致虚拟主机混淆，使攻击者通过构造携带重复 Host 头的 HTTP 请求，将请求从代理路由至一个后端，但后端将其解析为针对另一个主机的请求。该漏洞可被利用实施请求走私（Request Smuggling）、缓存投毒以及绕过基于主机名的访问控制。影响范围涵盖使用受影响 Libsoup 版本的所有应用程序与服务，尤其影响部署了前置代理的 Web 服务架构。CVSS 评分为 8.2（高危），攻击无需身份认证，通过网络即可触发。"
published = "2025-12-11T13:15:58Z"
remediation = "立即升级 libsoup 至 Red Hat 已发布修复版本：RHEL 8 用户将 libsoup 升级至 0:2.62.3-11.el8_10 或更新版本，RHEL 10 用户将 libsoup3 升级至 0:3.6.5-3.el10_1.8 或更新版本，RHEL 7 ELS 用户将 libsoup 升级至 0:2.62.2-10.el7_9 或更新版本。可通过执行 yum update libsoup 或 dnf upgrade libsoup 完成升级。若无法立即打补丁，可在反向代理层配置归一化规则，移除或去重传入请求的重复 Host 头字段，作为临时缓解措施。"
score = 8.2
severity = "HIGH"
sources = ["msrc"]
title = "GNOME Libsoup 重复主机头处理主机解析不一致漏洞"
updated = "2026-06-29T21:16:32Z"

