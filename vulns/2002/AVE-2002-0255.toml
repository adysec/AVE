[basic]
description = "Ethereal 0.9.4 及更早版本的 BGP 解析器和 WCP 解析器存在缓冲区溢出漏洞，远程攻击者可通过发送精心构造的 BGP 或 WCP 数据包触发缓冲区溢出，导致拒绝服务或任意代码执行。该漏洞影响 Ethereal（Wireshark 前身）0.9.4 及更早版本，CVSS 评分 7.5（高危），攻击向量为网络、攻击复杂度低、无需认证，可导致机密性、完整性、可用性部分受损。"
published = "2002-08-12T04:00:00Z"
remediation = "建议立即升级 Ethereal 至 0.9.5 或更高版本（后更名为 Wireshark，建议升级至最新稳定版）。若暂时无法升级，可在网络边界防火墙层面拦截 BGP（TCP 179）和 WCP 协议流量，或禁用 Ethereal 的 BGP 与 WCP 解析器插件作为临时缓解措施。建议尽快升级至 Wireshark 最新稳定版以彻底修复该缓冲区溢出漏洞。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Ethereal Ethereal 0.9.4 缓冲区溢出漏洞"
updated = "2026-06-16T21:58:12Z"

