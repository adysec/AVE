[basic]
description = "Microsoft Site Server 3.0 默认 ASP 页面存在跨站脚本（XSS）漏洞，运行在 Windows NT 4.0 平台上的 Site Server 的 Default.asp 和 formslogin.asp 页面未对用户输入进行充分过滤。未经身份认证的远程攻击者可通过构造包含恶意脚本代码的 URL，利用 Default.asp 的 ctr 参数及 formslogin.asp 的查询字符串参数注入任意 Web 脚本或 HTML 代码。当已通过 Site Server 身份验证的合法用户点击该恶意链接后，恶意脚本将在其浏览器中以 Site Server 站点的安全上下文执行，攻击者可借此窃取基于 Cookie 的身份验证凭据，进而接管用户会话并获取对 Site Server 管理界面的未授权访问权限。该漏洞影响 Microsoft Site Server 3.0 及 Commerce Edition 版本。"
published = "2002-12-31T05:00:00Z"
remediation = "由于 Microsoft Site Server 3.0 已停止支持且无官方补丁，建议迁移到受支持的现代版本（如 Microsoft SharePoint Server 或 Commerce Server）。临时缓解措施包括：对 Default.asp 和 formslogin.asp 等页面的用户输入进行严格的输入验证和输出编码，部署 Web 应用防火墙拦截恶意脚本注入，禁用或限制访问不必要的 ASP 页面。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Site Server 3.0 跨站脚本攻击漏洞"
updated = "2026-06-16T22:00:36Z"

