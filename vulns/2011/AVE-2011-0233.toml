[basic]
description = "Mozilla Firefox 和 Thunderbird 8.0 之前版本的浏览器引擎在处理 SVG mpath 元素指向非 SVG 元素的链接时存在内存破坏漏洞。远程攻击者可通过构造特制的 SVG 文档，诱使用户访问恶意网页触发该漏洞，导致浏览器崩溃拒绝服务，或可能实现任意代码执行。CVSS 评分 10.0，危害等级严重。用户应升级至 Firefox 8.0 或 Thunderbird 8.0 及以上版本。"
published = "2011-11-09T11:55:03Z"
remediation = "升级 Mozilla Firefox 至 8.0 及以上版本，或 Thunderbird 至 8.0 及以上版本。如无法立即升级，可在浏览器中禁用 SVG 支持（about:config 中设置 svg.enabled=false）作为临时缓解措施，但会影正常网页渲染功能。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird SVG mpath 元素链接处理内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:33:41Z"

