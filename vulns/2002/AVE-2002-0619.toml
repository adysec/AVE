remediation = "立即升级 WoltLab Burning Board 至 2.0 正式版或更高版本，该版本修复了 board.php 中 boardid 参数的 SQL 注入漏洞。若暂时无法升级，可在 Web 应用防火墙 (WAF) 层面配置规则拦截 boardid 参数中的 SQL 注入特征（如单引号、UNION、SELECT 等关键字），同时在 PHP 配置中开启 magic_quotes_gpc 作为临时缓解措施，并严格限制数据库账户权限，仅授予最小必要权限。"
