[basic]
description = "Microsoft Edge（基于 Chromium）的更新组件存在不受信任的搜索路径漏洞（CWE-426）。本地攻击者可通过在特定目录中放置恶意的 DLL 文件，利用 Edge 更新程序加载外部库时的路径搜索机制缺陷，以系统权限执行任意代码，实现权限提升。该漏洞影响 Microsoft Edge 132.0.2957.115 之前版本，攻击者需具备本地访问权限，无需用户交互，CVSS 评分 7.4，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-17T20:15:46Z"
remediation = '立即将 Microsoft Edge Update 升级到 1.3.195.43 或更高版本（2025 年 1 月 16 日发布），同时将 Microsoft Edge 浏览器升级到 132.0.2957.115 或更高版本（2025 年 1 月 17 日发布）。可通过 edge://settings/help 检查并自动更新，企业用户可通过 Microsoft Update 或 WSUS 批量推送。该漏洞源于 Edge Update 组件的不安全搜索路径（CWE-426），攻击者可通过在搜索路径中放置恶意 DLL 实现本地提权。临时缓解措施：限制非管理员用户对 Edge Update 安装目录（默认 %ProgramFiles(x86)%\Microsoft\EdgeUpdate\）的写入权限。'
score = 7.4
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Edge (Chromium-based) 更新特权提升漏洞"
updated = "2026-06-17T08:43:16Z"

