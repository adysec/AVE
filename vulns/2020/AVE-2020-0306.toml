[basic]
description = "Treck TCP/IP 协议栈在处理 IPv6 数据包时存在越界读取漏洞（CWE-125），由于对 IPv6 扩展头长度校验不充分，相邻网络中的未经身份认证的攻击者可通过向目标设备发送特制的 IPv6 数据包触发该漏洞，导致敏感内存信息泄露或系统崩溃。该漏洞影响 Treck TCP/IP 6.0.1.66 之前的所有版本，广泛应用于嵌入式系统和物联网设备中。Treck 公司已在 6.0.1.66 版本中修复此漏洞。"
published = "2020-06-17T11:15:10.210"
remediation = "立即将 Treck TCP/IP stack 升级至 6.0.1.66 或更高版本。Cisco 用户升级 StarOS 至 21.5.27/21.11.15/21.20.2 等修复版本；Intel 用户安装 INTEL-SA-00295 对应补丁；Dell/NetApp/Aruba 用户参考各厂商安全公告安装更新。如无法立即打补丁，可在网络边界部署 ACL 过滤异常 IPv6 流量，并禁用不必要的 IPv6 隧道功能作为临时缓解措施。"
score = 5.4
severity = "MEDIUM"
sources = ["kev"]
title = "Treck TCP/IP stack 输入验证错误漏洞"
updated = "2026-06-17T02:51:00.473"

