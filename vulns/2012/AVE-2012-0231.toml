[basic]
description = 'Mozilla Firefox 4.x至13.0版本及Firefox ESR 10.x至10.0.6版本中存在跨站脚本漏洞。由于浏览器对data:协议URL的右键菜单限制策略与javascript:协议URL不一致，攻击者可通过构造特制的data: URL诱导用户点击右键菜单中的"查看图像"、"仅显示此框架"或"查看背景图像"等选项，在目标用户浏览器上下文中执行恶意脚本，导致跨站脚本攻击。该漏洞无需用户交互以外的额外认证条件，攻击复杂度中等，可窃取用户Cookie、会话令牌或执行其他恶意操作。Mozilla已在Firefox 14及Firefox ESR 10.0.6版本中修复此漏洞。'
published = "2012-07-18T10:26:49.203"
remediation = "升级 Mozilla Firefox 至 14.0 及以上版本，或 Firefox ESR 升级至 10.0.6 及以上版本。无法立即升级时，可配置浏览器策略禁止 data: URL 在右键菜单中执行，或通过企业组策略限制 Firefox 版本回退。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox 跨站脚本漏洞"
updated = "2026-06-16T23:40:41.680"

