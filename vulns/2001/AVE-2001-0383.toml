[basic]
description = "PHP 4.0.4pl1 和 4.0.5 在安全模式下存在文件访问控制漏洞，远程攻击者可上传包含 error_log 函数的 PHP 脚本，绕过安全模式限制读取和写入 Web 服务器 UID 拥有的文件。该漏洞源于安全模式未正确限制 error_log 函数的文件操作权限，攻击者仅需上传恶意脚本即可远程利用，无需认证，攻击复杂度低。影响 PHP 4.0.4pl1 和 4.0.5 版本，CVSS 评分 6.4（中等），影响机密性和完整性，不影响可用性。攻击者可利用此漏洞读取敏感文件或写入恶意文件，进一步控制 Web 服务器。"
published = "2001-12-06T05:00:00Z"
remediation = "建议立即升级 PHP 至 4.0.6 或更高版本（推荐升级至 PHP 5.6+ / 7.x / 8.x 版本），PHP 5.3+ 已废弃安全模式，5.4+ 已彻底移除。无法立即升级时，请在 php.ini 中设置 disable_functions = error_log, fopen, fwrite, file_put_contents 禁用危险函数，并设置 open_basedir 限制 PHP 脚本仅能访问指定目录，同时设置正确的文件系统权限，确保 Web 服务器进程 UID 仅拥有必要的最小读写权限。"
score = 6.4
severity = "MEDIUM"
sources = ["redhat"]
title = "PHP PHP 4.0.4pl1/4.0.5 安全模式文件访问控制绕过漏洞"
updated = "2026-06-16T21:55:53Z"

