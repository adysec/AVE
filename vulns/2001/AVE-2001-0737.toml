[basic]
description = "Half-Life 游戏服务器存在缓冲区溢出漏洞，Sierra Half-Life build 1573 及更早版本未对客户端传入的 map 命令、exec 命令及配置文件输入进行长度校验，攻击者可通过发送超长数据触发栈缓冲区溢出，进而执行任意代码。该漏洞影响部署了受影响版本 Half-Life 服务器的运营商及私人游戏服务器，攻击者无需身份验证即可通过网络远程利用，攻击复杂度低且无需交互，CVSS 评分 7.5，危害等级高。攻击者可通过游戏客户端发送特制地图名称或执行恶意配置文件内容，在服务器端获得代码执行权限，进而控制游戏服务器或进一步渗透内网。"
published = "2001-06-27T04:00:00Z"
remediation = "建议升级 Half-Life 至 build 1574 或更高版本（如 Steam 版最新客户端），该版本修复了 map/exec 命令及配置文件的缓冲区溢出。若无法升级，可在服务器配置中限制 map/exec 命令长度，或通过防火墙仅允许受信 IP 连接 27015/TCP 端口作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Sierra Half-Life 游戏服务器缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:54:09Z"

