[basic]
description = "Big Brother (BB) Network Monitor 1.5 d2 系列中的多个脚本（bb-hist.sh、bb-histlog.sh、bb-hostsvc.sh、bb-rep.sh、bb-replog.sh 和 bb-ack.sh）存在安全漏洞。该漏洞源于对 HISTFILE 参数的意外处理，导致攻击者能够确定目标系统中文件和用户 ID 的存在性。具体而言，攻击者无需身份验证，只需向目标系统发送带有特定文件的 HISTFILE 参数请求，即可使 Big Brother 监控系统返回文件和用户 ID 的存在确认信息，从而泄露系统内部结构。漏洞影响范围广泛，不仅涉及 BB 的核心脚本文件，还涵盖了整个监控服务组件。攻击条件要求低，只要存在上述脚本，即可利用该漏洞进行信息收集。利用方式包括远程发送经构造的 HTTP 请求，当请求包含恶意 HISTFILE 参数时，监控系统将返回文件/用户 ID 的存在性确认，最终导致敏感信息泄露。该漏洞的 CVSS 评分约为 5.0，表明其主要风险在于信息泄露和系统信息收集，而非直接的系统破坏或代码执行。漏洞影响 Windows、Linux 等多种操作系统环境，尚无官方补丁修复。攻击者可利用此漏洞进行进一步的情报收集，为更严重的攻击奠定基础。"
published = "2001-01-09T05:00:00Z"
remediation = "升级 Big Brother Network Monitor 至 1.5d3 或更高版本，修复 bb-hist.sh 等脚本的 HISTFILE 参数文件存在性泄露漏洞。若暂时无法升级，可在 Web 服务器层面配置访问控制限制对 bb-hist.sh 等脚本的访问，或通过 WAF 规则拦截包含 HISTFILE 参数的请求作为临时缓解措施。建议尽快从官方渠道获取 1.5d3 或更高版本进行升级部署。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Big Brother Network Monitor 1.5 d2 HISTFILE 参数文件存在性泄露漏洞"
updated = "2026-06-16T21:53:19Z"

