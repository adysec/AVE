[basic]
description = "Apple Safari 浏览器中的 WebKit 渲染引擎存在内存破坏漏洞，远程攻击者可通过构造恶意网页向目标系统发送特制内容触发该漏洞，导致应用程序崩溃或远程代码执行。该漏洞影响 Safari 6.0 之前的所有版本，攻击者无需身份认证即可通过社会工程手段诱使用户访问恶意网站即可完成利用，成功利用后可完全控制受影响系统。Apple 已在后续安全更新中修复此漏洞。"
published = "2012-07-25T20:55:03Z"
remediation = "将 Mac OS X Lion 升级至 v10.7.4 并安装 Safari 6.0，或将 iOS 设备（iPhone 3GS 及后续机型、iPad 2 及后续机型、iPod touch 第 4 代及后续机型）升级至 iOS 6.0 或更高版本。如无法立即升级，建议临时避免使用 Safari 访问不受信任的网站，改用其他浏览器，并可在 Safari 偏好设置中禁用 JavaScript 执行作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:37Z"

