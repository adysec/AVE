[basic]
description = "Google Chrome 的 V8 JavaScript 引擎存在释放后使用（Use After Free）漏洞，CWE-416。远程攻击者可通过构造特制的 HTML 页面并诱使用户访问，触发已释放内存的非法访问，导致越界内存读取，可能泄露敏感信息。该漏洞影响 Chrome 141.0.7390.54 之前版本，攻击复杂度较高且需要用户交互，CVSS 评分 3.1，危害等级低。Google 已在 Chrome 141.0.7390.54 版本中修复此漏洞。"
published = "2025-11-06T22:15:39Z"
remediation = "升级 Google Chrome 至 141.0.7390.54 及以上版本，该版本已于 2025 年 9 月 30 日通过稳定版渠道发布。使用 Chromium 内核的浏览器（如 Microsoft Edge、Brave）应同步更新至对应修复版本。Linux 发行版用户可通过包管理器更新：`sudo apt upgrade chromium-browser`（Debian/Ubuntu）或 `sudo dnf update chromium`（Fedora）。如无法立即更新，可在浏览器设置中禁用 JavaScript（chrome://settings/content/javascript）作为临时缓解措施，但会影响正常网页功能。"
score = 3.1
severity = "LOW"
sources = ["msrc"]
title = "Google Chrome V8 释放后使用漏洞"
updated = "2026-06-17T08:29:52Z"

