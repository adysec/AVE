[basic]
description = "Revive Adserver 存在 PHP 反序列化漏洞，攻击者可通过向 XML-RPC 调用脚本发送特制 payload，在 openads.spc RPC 方法的 what 参数上触发 unserialize() 调用，从而利用 PHP 反序列化相关漏洞或 PHP 对象注入实施攻击。该漏洞影响使用 Revive Adserver 的网站实例，未经身份认证的远程攻击者无需交互即可利用，成功利用后可获取服务器权限，并向第三方网站投放恶意软件。该漏洞已在 4.2.0 版本中修复，CVSS 评分为 9.8。"
published = "2019-05-06T17:29:00Z"
remediation = "标签之间。<value>立即升级 Revive Adserver 至 4.2.0 或更高版本，该版本已修复 XML-RPC 接口的 PHP 反序列化漏洞。如暂无法升级，可通过 Web 服务器配置（如 Apache 的 <LocationMatch> 或 Nginx 的 location 块）禁用或限制对 /www/delivery/axmlrpc.php 的访问，仅允许可信 IP 访问。同时建议启用 Web 应用防火墙（WAF）规则过滤包含序列化数据的 POST 请求。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Revive Adserver XML-RPC 反序列化远程代码执行漏洞"
updated = "2026-06-17T02:37:40Z"

