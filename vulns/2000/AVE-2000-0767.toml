[basic]
description = "HP OpenView Network Node Manager (NNM) 6.1 及更早版本的 OverView5 CGI 程序中存在缓冲区溢出漏洞，在处理 Java SNMP MIB 浏览器对象 ID 解析时未正确验证输入长度，远程攻击者无需身份认证即可通过向 SNMP 服务（snmp.exe）发送特制的畸形请求触发缓冲区溢出，导致目标服务拒绝服务，甚至可能执行任意命令。该漏洞 CVSS 评分 5.0，危害等级中危，影响 HP OpenView NNM 6.1 及之前版本。"
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 HP OpenView NNM 至 6.2 及以上版本，该版本已修复 OverView5 CGI 缓冲区溢出漏洞。如无法升级，在 Web 服务器层面删除或禁用 `/OverView5` CGI 脚本，并在防火墙上限制对 SNMP 服务端口（161/UDP、162/UDP）及 NNM Web 控制台端口（默认 80/TCP）的访问，仅允许可信管理网段 IP 连接。鉴于 HP OpenView NNM 6.x 已停止技术支持，建议迁移至受支持的网络管理平台。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "HP OpenView Network Node Manager OverView5 CGI 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:04.140"

