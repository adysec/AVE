[basic]
description = "Trend Micro Apex One (on-premise) 管理控制台存在 OS 命令注入漏洞，未经身份认证的远程攻击者可利用该漏洞上传恶意代码并在目标系统上执行任意命令。该漏洞本质与 CVE-2025-54948 相同，但影响不同的 CPU 架构。攻击者无需任何认证即可通过网络触发，CVSS 评分 9.4，危害等级严重。Trend Micro 已发布安全更新修复此漏洞。"
published = "2025-08-05T13:15:29Z"
remediation = "立即将 Trend Micro Apex One (on-prem) 管理服务器升级至 SP1 CP B14081 或更高版本（2025年8月15日发布的永久性关键补丁）。如无法立即打补丁，可先部署 FixTool_Aug2025 作为临时缓解措施（注意该工具会禁用远程安装代理功能），同时限制管理控制台的公网暴露，配置源 IP 白名单访问策略。"
score = 9.4
severity = "CRITICAL"
sources = ["zdi"]
title = "Trend Micro Apex One 管理控制台操作系统命令注入漏洞"
updated = "2026-06-17T09:41:04Z"

