[basic]
description = "Fortinet FortiOS 配置备份文件中使用了硬编码加密密钥对敏感数据进行加密，具有备份文件访问权限的攻击者可利用该硬编码密钥解密备份文件中的敏感信息。受影响的数据包括用户密码（管理员密码除外）、私钥口令以及高可用性密码。该漏洞源于 CWE-798 硬编码凭证使用缺陷，攻击者无需用户交互即可通过本地或远程获取备份文件的方式实施解密攻击，导致敏感信息泄露。CVSS 评分 6.5，危害等级中危。"
published = "2019-11-21T16:15:13Z"
remediation = """
` tags. I need to write a clean, proper remediation in Chinese based on the Fortinet advisory information.

From the presearch data:
- FortiOS versions affected: 5.6.9 and below, 6.0.5 and below, 6.2.0
- The fix is to upgrade to 5.6.11+, 6.0.7+, or 6.2.1+
- Also need to enable `private-data-encryption` in config
- CISA KEV listed, so it's actively exploited

Let me write a clean remediation.<value>建议立即升级 FortiOS 至 5.6.11、6.0.7 或 6.2.1 及以上版本，然后执行 `config system global` → `set private-data-encryption enable` → `end` 启用用户自定义加密密钥。如无法立即升级，备份配置文件时必须设置密码保护，避免在非安全渠道公开配置文件内容。"""
score = 6.5
severity = "MEDIUM"
sources = ["kev"]
title = "Fortinet FortiOS 配置备份文件硬编码加密密钥信息泄露漏洞"
updated = "2026-06-17T02:39:31Z"

