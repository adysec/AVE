[basic]
description = "Samba 2.0.x 至 2.2.0a 之前版本中 smb.conf 配置文件的 %m 宏存在目录遍历漏洞。远程攻击者可通过在 NETBIOS 名称中注入 ../ 序列，使 Samba 服务器将日志文件写入任意目录，从而覆盖系统关键文件。该漏洞无需身份认证即可远程利用，攻击复杂度低，可导致目标系统完整性完全丧失。受影响版本包括 Samba 2.0.x 及 2.2 系列，CVSS 评分 10.0，危害等级严重。"
published = "2001-06-23T04:00:00Z"
remediation = "升级 Samba 至 2.2.0a 或更高版本，该版本修复了 smb.conf 中 %m 宏的目录遍历问题。如无法升级，可在 smb.conf 中移除 %m 宏的使用，或在防火墙限制 137-139/445 端口的 NETBIOS 名称请求来源。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "Samba smb.conf 目录遍历任意文件创建漏洞"
updated = "2026-06-16T21:55:42Z"

