[basic]
description = "Check Point VPN-1/FireWall-1 4.1 SP2 在启用 Fast Mode 模式下存在 TCP 分片处理漏洞。远程攻击者无需身份认证即可通过网络向目标系统发送特制的畸形分片数据包，绕过防火墙的访问控制规则，导致机密性、完整性和可用性受损。该漏洞影响 Check Point FireWall-1 4.1 SP2 版本，CVSS 评分 7.5，危害等级高。Exploit-DB 上已有公开利用代码（EDB-ID: 20519），攻击门槛较低。"
published = "2001-02-12T05:00:00Z"
remediation = '建议立即禁用 Fast Mode 功能，在防火墙策略配置中取消勾选 "Accept Fast Mode" 选项，或通过命令行执行 `fw fastmode off` 关闭该加速模式。同时升级 Check Point VPN-1/FireWall-1 至 4.1 SP3 及以上版本，该漏洞已在后续版本中修复。如无法升级，可在网络边界部署入侵检测系统，对畸形分片 TCP 报文进行拦截过滤。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Check Point VPN-1/FireWall-1 Fast Mode TCP碎片访问限制绕过漏洞"
updated = "2026-06-16T21:53:37Z"

