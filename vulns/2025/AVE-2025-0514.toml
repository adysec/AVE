[basic]
description = "Google Chrome（Windows 平台）Storage 组件存在条件竞争漏洞（CWE-362）。远程攻击者可构造特制的 HTML 页面，通过社会工程学手段诱导用户执行特定的 UI 手势操作，从而触发竞态条件，实现 UI 界面欺骗攻击。成功利用此漏洞可导致低度机密性泄露（如窃取受限存储数据）及有限的服务可用性影响。该漏洞影响 Chrome 142.0.7444.59 之前版本，攻击复杂度较高，需要用户交互配合，CVSS 评分 4.2，危害等级中危。Google 已在 Chrome 142.0.7444.59 版本中修复此漏洞。"
published = "2025-11-10T20:15:38Z"
remediation = "升级 Google Chrome 至 142.0.7444.59 或更高版本，可通过 Chrome 内置更新程序自动检查更新并重启浏览器完成升级。如无法立即更新，可在浏览器设置中禁用 JavaScript 执行作为临时缓解措施，或限制用户访问不可信网页。"
score = 4.2
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome 浏览器存储模块竞态条件 UI 欺骗漏洞"
updated = "2026-06-17T08:32:22Z"

