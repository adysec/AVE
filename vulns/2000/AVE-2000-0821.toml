[basic]
description = "多种 Unix 系统 Shell 程序（包括 tcsh、csh、sh、bash）在处理 << 重定向（即 here-document）时会跟随符号链接，导致本地用户可通过符号链接攻击覆盖其他用户的文件。该漏洞影响 Apple Mac OS X 10、HP-UX 9/10/11、Mandriva 6/7、Red Hat 5/6、SCO 5、IRIX 6 等多种 Unix/Linux 发行版的默认 Shell 环境。攻击者需具备本地账户权限，通过构造指向目标文件的符号链接并诱导 Shell 处理 here-document 重定向，即可覆盖任意用户可写文件，导致权限提升或数据破坏，CVSS 评分 7.2（本地攻击、低复杂度、无需认证、完全影响机密性/完整性/可用性）。"
published = "2001-01-09T05:00:00.000"
remediation = "建议立即安装厂商发布的安全补丁：Apple Mac OS X 升级至 10.1 版本；Tru64 UNIX 4.0D/4.0F/4.0G/5.0/5.0A/5.1/5.1A 应用对应的 ERP 早期发布补丁包（如 DUV40DB17-C0061401-12858-E-20020115.tar 等）；Solaris 升级至 8 Update 5 或更高版本并应用官方补丁；SCO OpenLinux 2.3/eServer 2.3.1/eDesktop 2.4 更新 bash 至 1.045 版、tcsh 至 1.046 版（通过 ftp.caldera.com 下载）；FreeBSD 应用 SA-00:76.tcsh-csh 补丁；SGI IRIX 应用 20011103-01-I 安全公告补丁；Conectiva Linux 升级至 MDKSA-2000-069/075 修复版。临时缓解措施：在 cron 任务和管理脚本中避免使用 << 重定向操作符；确保 /tmp 目录设置了粘滞位；限制本地用户写入敏感目录的权限；若无法立即打补丁，考虑用非易受攻击的 shell（如 ksh/pdksh）替代易受影响的 csh/bash/sh 作为默认登录 shell。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "多厂商 Unix Shell Here-document 符号链接攻击漏洞"
updated = "2026-06-16T21:53:13.380"

