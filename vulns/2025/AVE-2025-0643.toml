[basic]
description = "Microsoft Message Queuing (MSMQ) 存在资源消耗漏洞（CWE-400），未经身份认证的远程攻击者可通过网络向目标系统发送特制的 MSMQ 消息触发该漏洞，导致 MSMQ 服务消耗大量系统资源而崩溃或停止响应，造成拒绝服务。该漏洞影响 Windows 10/11 及 Windows Server 等多个版本，CVSS 评分 7.5，危害等级高。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:29Z"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新 (KB5051974)，可通过 Windows Update 自动获取或从 Microsoft 更新目录手动下载。受影响版本包括 Windows 10/11 及 Windows Server 2008~2025 全系列，更新后 MSMQ 组件版本将升级至对应修复版本（如 Windows 11 24H2 需升级至 10.0.26100.3194 以上）。如无法立即打补丁，可在不需要 MSMQ 服务的系统上通过「控制面板 → 程序和功能 → 启用或关闭 Windows 功能」禁用 Microsoft Message Queuing (MSMQ) 服务，或在防火墙层面限制 1801/TCP 端口的入站流量作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft 消息队列 (MSMQ) 拒绝服务漏洞"
updated = "2026-06-17T08:42:42Z"

