[basic]
description = "Microsoft Internet Explorer 9 至 11 版本中存在信息泄漏漏洞。当 IE 浏览器处理特制网页时，未能正确限制对进程内存中敏感数据的访问，导致攻击者可通过诱导用户访问恶意网站的方式，从浏览器进程内存中获取敏感信息。该漏洞为信息泄漏类型，攻击者需要诱使用户点击恶意链接或访问恶意网页，无法远程直接利用。Microsoft 已在 2017 年 3 月安全更新 MS17-007 中修复此漏洞。"
published = "2017-03-17T00:59:01Z"
remediation = "安装 Microsoft 2017 年 3 月安全更新 MS17-007，该更新修复了 Internet Explorer 内存信息泄露漏洞。可通过 Windows Update 自动更新，或从 Microsoft 更新目录手动下载安装。临时缓解措施：将 Internet Explorer 安全级别设为高，禁用活动脚本。建议升级到 Microsoft Edge 以获得更安全的浏览体验。"
score = 4.3
severity = "MEDIUM"
sources = ["kev"]
title = "Microsoft Internet Explorer 信息泄漏漏洞"
updated = "2026-06-17T00:56:59Z"

