[basic]
description = "tcpdump 网络抓包工具在启动时未能正确将权限降级至 pcap 用户，导致其以过高权限运行。本地攻击者可利用 tcpdump 保留的 root 权限读取敏感网络流量或执行越权操作，影响系统机密性与完整性。该漏洞需本地访问权限，攻击复杂度低，影响 Red Hat Linux 等使用 tcpdump 的系统。"
published = "2003-06-09T04:00:00Z"
remediation = "升级 tcpdump 至包含权限降级修复的版本（如 Red Hat 发行版升级至 tcpdump-3.7.1-8 及以上，Debian 升级至 tcpdump-3.7.1-1.1 及以上）。启动时使用 -Z pcap 参数显式指定降权用户，确保 tcpdump 在打开抓包设备后立即放弃 root 权限。如无法升级，避免以 root 直接运行 tcpdump，改用普通用户配合 CAP_NET_RAW 和 CAP_NET_ADMIN capabilities 运行。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "Red Hat Linux tcpdump 权限处理不当漏洞"
updated = "2026-06-16T22:01:43Z"

