[basic]
description = "Microsoft Outlook 存在欺骗漏洞，攻击者可利用邮件处理逻辑缺陷伪造发件人身份或邮件元数据，诱导受害者信任恶意邮件内容。该漏洞影响多个 Outlook 版本（含 Office 365、Outlook 2016/2019/2021 等），CVSS 5.3 中危评分。攻击条件：仅需网络访问权限，无需身份认证或用户交互即可发送特制邮件触发。利用方式：攻击者构造伪造邮件头或利用解析不一致，使 Outlook 显示虚假发件人地址、域名或安全指示器，配合社会工程学实施钓鱼、业务邮件欺诈（BEC）或恶意软件分发。Microsoft 已于 2025 年 2 月安全更新中修复此漏洞，建议尽快升级至最新版本。"
published = "2025-02-11T18:15:32Z"
remediation = "建议立即将 Microsoft Outlook for Android 升级至 4.2501.1 或更高版本，通过 Google Play 商店或 Microsoft 官方渠道获取 2025 年 2 月安全更新。若暂时无法更新，可在邮件客户端启用「仅显示受信任发件人」设置，并在企业层面部署邮件网关规则拦截伪造发件人域名的可疑邮件作为临时缓解措施。"
score = 5.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Outlook 欺骗漏洞"
updated = "2026-06-17T08:42:55Z"

