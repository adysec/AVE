[info]
author = "AVE"
description = "检测目标 PHP 版本是否低于 5.2.15 或 5.3.4，通过 X-Powered-By 或 Server 响应头判断。若版本匹配则说明存在 GD 扩展 imagepstext 栈缓冲区溢出漏洞（CVE-2010-4698），攻击者可传入超大量抗锯齿步进参数导致拒绝服务。"
id = "POC-AVE-2010-0284"
name = "PHP GD Extension imagepstext Stack Buffer Overflow PoC"
severity = "medium"
tags = [
    "cve-2010-4698",
    "php",
    "gd",
    "buffer-overflow",
    "dos",
]
vuln_id = [
    "CVE-2010-4698",
    "AVE-2010-0284",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = [
    "PHP/5.2.",
    "PHP/5.3.0",
    "PHP/5.3.1",
    "PHP/5.3.2",
    "PHP/5.3.3",
]
