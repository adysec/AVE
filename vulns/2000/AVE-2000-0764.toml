[basic]
description = "Allaire JRun 2.3.x 服务器存在跨站脚本（XSS）与任意 JSP 代码执行漏洞。未经身份认证的远程攻击者可利用该漏洞，通过 XSS 攻击向目标服务器插入并提交特制 JSP 代码，并直接调用 com.livesoftware.jrun.plugins.JSP JSP Servlet 执行该代码，从而在服务器端执行任意 Java 代码，实现完全远程代码执行。该漏洞影响 Allaire JRun 2.3.x 版本，攻击者无需任何凭据或用户交互即可利用，攻击复杂度低，可导致服务器被完全控制。CVSS 评分满分 10.0，危害等级严重。"
published = "2000-12-11T05:00:00.000"
remediation = "立即停止使用 Allaire JRun 2.3.x，迁移至受支持的现代 Java 应用服务器（如 Apache Tomcat、Jetty 或 Adobe ColdFusion 最新版本）。若短期内无法迁移，应在防火墙或反向代理层拦截对 /servlet/com.livesoftware.jrun.plugins.JSP 路径的直接访问，并对所有用户输入实施严格的 HTML 实体编码与输出过滤，防止跨站脚本脚本注入。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Allaire JRun JSP Servlet 远程代码执行漏洞"
updated = "2026-06-16T21:53:03.580"

