[info]
author = "ave"
description = "通过向目标发送 HTTP GET 请求并检测响应中是否包含 Windows 相关标识，验证 Windows 远程桌面服务是否存在拒绝服务漏洞（CVE-2025-21330）。该漏洞源于 RDS 对特制网络请求处理不当，未经认证的远程攻击者可触发资源耗尽导致服务停止响应。"
id = "POC-AVE-2025-0789"
name = "CVE-2025-21330 Windows RDS DoS PoC"
severity = "high"
tags = ["ave-2025-0789"]
vuln_id = [
    "CVE-2025-21330",
    "AVE-2025-0789",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
case_insensitive = true
expect = true
part = "body"
type = "word"
words = ["windows"]
