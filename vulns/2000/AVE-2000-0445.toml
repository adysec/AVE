[basic]
description = "Mirabilis ICQ 2000A 的 Webmail 客户端在用户登录过程中会创建临时文件，但未设置正确的文件权限且登录后未自动删除，导致临时文件以全局可读权限保留在系统中。本地攻击者可通过访问该临时文件获取用户的敏感信息（如邮件内容、会话凭证等），造成信息泄露。该漏洞攻击复杂度低，需本地访问权限，无需用户交互即可利用。"
published = "2000-06-06T04:00:00Z"
remediation = '立即删除 ICQmail 客户端登录后残留于系统临时目录（如 C:\TEMP）中的临时链接文件（.lnk 格式），该文件包含明文凭据且不会自动清除。限制临时目录的访问权限，仅允许当前用户读写。由于 Mirabilis ICQ 2000.0A 已停止维护且无安全更新，建议迁移至支持加密通信的替代即时通讯软件。'
score = 5.5
severity = "MEDIUM"
sources = ["avd"]
title = "Mirabilis ICQ 2000A 临时文件信息泄露漏洞"
updated = "2026-06-16T21:51:58Z"

