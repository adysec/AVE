[basic]
description = "WircSrv IRC Server 5.07s 的 importmotd 命令存在任意文件读取漏洞，该命令用于设置服务器每日消息（MOTD），但未对指定文件路径进行有效限制。具有 IRC 管理员权限的远程攻击者可通过发送特制的 importmotd 命令并指向目标系统上的任意文件路径，使服务器读取该文件内容并设置为 MOTD，从而泄露敏感文件信息。此漏洞影响 WircSrv IRC Server 5.07s 版本，攻击复杂度低，可被远程利用，攻击者无需额外认证即可读取服务器上的敏感文件，造成信息泄露风险。"
published = "2000-10-20T04:00:00Z"
remediation = "升级到修复了 importmotd 命令访问控制的 WircSrv 后续版本，或通过修改配置文件限制 IRC operators 对 importmotd 命令的使用权限，仅允许特权管理员执行该操作。如无法立即升级，可在防火墙或文件系统层面限制 IRC 服务器进程对 /etc/passwd 等敏感文件的读取权限，并确保服务器以最小权限账户运行。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "WircSrv IRC Server 任意文件读取漏洞"
updated = "2026-06-16T21:52:28Z"

