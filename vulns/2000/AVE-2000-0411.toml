[basic]
description = "FreeBSD 5.0、NetBSD 1.4.2 及 OpenBSD 2.7 操作系统的 setsockopt() 系统调用存在资源耗尽漏洞。本地攻击者可通过 socketpair() 函数创建大量 socket 对，再利用 setsockopt() 为每个 socket 设置极大的缓冲区大小，随后持续向这些 socket 写入大容量数据，导致内核内存被迅速耗尽，最终触发系统拒绝服务。该漏洞攻击复杂度低，无需认证即可利用，影响三个 BSD 系操作系统的多个版本。"
published = "1999-09-05T04:00:00Z"
remediation = "建议立即将 FreeBSD 升级至 5.3 及以上版本（含 setsockopt 系统调用缓冲区大小限制修复），将 NetBSD 升级至 1.5 及以上版本，将 OpenBSD 升级至 2.8 及以上版本。若无法升级，可在 /etc/login.conf 中通过设置 datasize-cur 和 datasize-max 限制进程数据段大小，并在内核参数中调低 kern.ipc.somaxconn 和 net.inet.tcp.sendbuf_max 以限制 socket 缓冲区上限，从而缓解大量 socketpair 耗尽内核内存的风险。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "FreeBSD NetBSD OpenBSD setsockopt 拒绝服务漏洞"
updated = "2026-06-16T21:51:50Z"

