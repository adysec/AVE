[basic]
description = "Windows GDI+ 存在整数溢出漏洞（CWE-190），由于 GDI+ 组件对整数运算边界处理不当，导致内存破坏。已获得低权限的本地攻击者可通过运行特制的应用程序触发该漏洞，成功利用后可在目标系统上以 SYSTEM 权限执行任意代码，实现权限提升。该漏洞影响 Windows 10、Windows 11 及 Windows Server 2019/2022 等多个版本，CVSS 评分 7.8，危害等级高危。Microsoft 已在 2025 年 1 月安全更新（KB5050061）中修复此漏洞。"
published = "2025-01-14T18:15:59.300"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新 (KB5050061)，通过 Windows Update 自动获取或手动下载安装。受影响 Windows 版本需升级至：Windows 10 22H2 ≥ 10.0.19045.5371、Windows 11 24H2 ≥ 10.0.26100.2894、Windows Server 2016 ≥ 10.0.14393.7699 等对应修复版本。Microsoft Office 用户需升级至：Office for Mac ≥ 16.93.25011212、Office for Android ≥ 16.0.18429.20000、Office for iOS ≥ 2.93.24123014。如无法立即打补丁，建议限制低权限用户登录系统，并禁用 GDI+ 相关组件的网络暴露面作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows GDI+ 远程代码执行漏洞"
updated = "2026-06-17T08:43:08.420"

