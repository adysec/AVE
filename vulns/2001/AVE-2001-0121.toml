[basic]
description = "OpenSSH 3.0.1 之前版本在启用 Kerberos V 认证时存在身份验证绕过漏洞。由于 Kerberos V 认证模块未能正确验证用户身份，远程攻击者无需有效凭据即可绕过认证机制，直接以任意用户身份登录目标系统，获取未授权访问权限。攻击者只需向目标 SSH 服务发起连接请求即可触发该漏洞，无需特殊权限或复杂前置条件。该漏洞影响所有启用 Kerberos V 认证的 OpenSSH 3.0.1 之前版本，CVSS 评分 7.5，危害等级高。建议升级至 OpenSSH 3.0.1 或更高版本以修复此漏洞。"
published = "2001-12-31T05:00:00Z"
remediation = "升级到 OpenSSH 3.0.1 或更高版本，该版本修复了 Kerberos V 认证绕过问题。如无法立即升级，在 sshd_config 中设置 `KerberosAuthentication no` 禁用 Kerberos 认证作为临时缓解措施，并限制 SSH 服务仅对可信 IP 开放。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "OpenSSH Kerberos V 认证绕过漏洞"
updated = "2026-06-16T21:56:24Z"

