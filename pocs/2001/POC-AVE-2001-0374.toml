[info]
author = "ave"
description = "检测 util-linux vipw 导致的 /etc/shadow 文件全局可读权限配置错误"
id = "POC-AVE-2001-0374"
name = "CVE-2001-1175 PoC"
severity = "high"
tags = ["ave-2001-0374"]
vuln_id = [
    "CVE-2001-1175",
    "AVE-2001-0374",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/shadow"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
