[basic]
description = "Ecartis（曾用名 Listar）1.0.0 及此前版本（2002年4月27日快照版）存在多个本地缓冲区溢出漏洞。攻击者可通过向程序传递过长的命令行参数，利用 core.c 中未正确处理输入的问题，或通过在 moderate.c、lcgi.c、fileapi.c、cookie.c、codes.c 等文件中滥用 sprintf() 函数，触发缓冲区溢出，从而获取本地特权提升。该漏洞影响使用 Ecartis 邮件列表管理系统的服务器，CVSS 评分为 4.6，危害等级为中等。"
published = "2002-08-12T04:00:00Z"
remediation = "由于 Ecartis（原名 Listar）已停止维护且无官方补丁发布，建议立即迁移至仍在维护的邮件列表管理软件（如 GNU Mailman 或 majordomo）并禁用 Ecartis 服务。如暂无法完成迁移，应立即对所有源代码中不安全的 sprintf() 调用进行替换修复：在 core.c、moderate.c、lcgi.c、fileapi.c、cookie.c、codes.c 等文件中，将所有 sprintf() 改为 snprintf() 并明确指定缓冲区大小，在 COMMAND_LINE_ARG_MAX 处对传入的命令行参数进行长度校验，限制最大输入长度为 512 字节。同时以非特权用户「listar」身份运行，禁止以 root 身份执行 ecartis 二进制文件；对 ecartis 安装目录及可执行文件设置最小权限（仅 listar 用户可读写执行），编译时添加 -fstack-protector-all -D_FORTIFY_SOURCE=2 编译选项启用栈保护，并在操作系统层面开启 ASLR 随机化内存布局以增加利用难度。长期解决方案为彻底替换为受持续安全更新的邮件列表管理平台。"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Ecartis 多个本地缓冲区溢出漏洞"
