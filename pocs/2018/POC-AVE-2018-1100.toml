[info]
author = "ave"
description = "检测目标是否存在 CVE-2018-8298 漏洞"
id = "POC-AVE-2018-1100"
name = "CVE-2018-8298 PoC"
severity = "medium"
tags = ["cve-2018-8298"]
vuln_id = [
    "CVE-2018-8298",
    "AVE-2018-1100",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/solr/admin/info/system"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["solr"]
