[basic]
description = "Ethereal（现 Wireshark）0.8.13 及早期版本的 AFS ACL 解析器存在多个缓冲区溢出漏洞。远程未认证攻击者可发送包含超长用户名字段的特制 AFS 数据包，触发缓冲区溢出，导致任意代码执行。该漏洞影响 Ethereal 0.8.13 及更早版本，CVSS 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），攻击向量为网络、攻击复杂度低、无需认证，可导致机密性、完整性、可用性部分丧失。攻击者只需向目标发送恶意构造的 AFS 数据包即可触发漏洞，ExploitDB (EDB-20414) 等已公开 PoC 代码。建议升级至 Ethereal 0.8.14 或更高版本修复该漏洞。"
published = "2001-01-09T05:00:00Z"
remediation = "建议立即升级 Ethereal 至 0.8.14 或更高版本（现更名为 Wireshark，建议升级至最新稳定版）。若无法立即升级，可在配置中禁用 AFS 协议解析器，或在防火墙层面拦截 AFS 相关流量（TCP/UDP 7000-7009 端口）作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Ethereal AFS 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:18Z"

