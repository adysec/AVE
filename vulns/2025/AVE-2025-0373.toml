[basic]
description = "QHora QuRouter 存在 SQL 注入漏洞（CWE-89），攻击者需先获取管理员账户权限，随后可通过向路由器管理接口发送特制的 SQL 查询语句，绕过输入过滤机制执行未授权的 SQL 命令，进而实现任意代码执行或系统命令执行。该漏洞影响 QHora 系列路由器，CVSS 评分 7.3，危害等级高。该漏洞已在 Pwn2Own Ireland 2025 中被演示利用。厂商已在 QuRouter 2.6.2.007 及后续版本中修复此漏洞。"
published = "2026-03-20T17:16:43Z"
remediation = "立即将 QHora 设备上的 QuRouter 固件升级至 2.6.2.007 或更高版本。可通过 QHora 管理后台的「系统更新」功能在线升级，或从 QNAP 官方下载中心获取固件手动更新。作为临时缓解措施，应严格限制管理员账户的分配范围，避免将管理员权限授予不可信用户，并启用多因素认证（MFA）增强登录安全。"
score = 7.3
severity = "HIGH"
sources = ["zdi"]
title = "QHora QuRouter SQL注入漏洞"
updated = "2026-06-17T09:52:31Z"

