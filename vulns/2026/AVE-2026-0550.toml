[basic]
description = "Windows Ancillary Function Driver for WinSock（afd.sys）存在释放后使用（Use-After-Free）漏洞。已获得低权限的本地攻击者可通过特制的系统调用触发 afd.sys 对已释放内存对象的访问，导致权限提升至 SYSTEM 级别。该漏洞攻击复杂度较高，需要攻击者具备本地登录权限，影响多个 Windows 版本。Microsoft 尚未发布官方补丁。"
published = "2026-04-14T18:17:08Z"
remediation = "立即安装 Microsoft 2026 年 4 月安全更新，各受影响版本对应修复版本号：Windows 10 1607 ≥ 10.0.14393.9060、Windows 10 1809 ≥ 10.0.17763.8644、Windows 10 21H2 ≥ 10.0.19044.7184、Windows 10 22H2 ≥ 10.0.19045.7184、Windows 11 23H2 ≥ 10.0.22631.6936、Windows 11 24H2 ≥ 10.0.26100.8246、Windows 11 25H2 ≥ 10.0.26200.8246、Windows 11 26H1 ≥ 10.0.28000.1836。可通过 Windows Update 自动获取更新，或从 Microsoft 更新目录网站手动下载安装。如无法立即打补丁，建议限制本地用户登录权限，并监控 afd.sys 异常调用行为作为临时缓解措施。"
score = 7
severity = "HIGH"
sources = ["zdi"]
title = "Microsoft Windows WinSock 辅助功能驱动程序特权提升漏洞"
updated = "2026-06-17T10:35:04Z"

