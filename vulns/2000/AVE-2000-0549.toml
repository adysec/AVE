[basic]
description = "Minicom 1.82.1 及更早版本在部分 Linux 系统中存在符号链接攻击漏洞。当用户使用 Minicom 的 capture-file（捕获文件）功能时，程序以 uucp 用户权限创建文件，但未对文件路径进行充分安全检查。本地攻击者可通过在目标路径预先创建符号链接，诱导 Minicom 将捕获内容写入任意文件，从而以 uucp 用户身份创建或覆盖系统文件，实现权限提升。该漏洞需要攻击者拥有本地系统访问权限，且目标用户需启用 capture-file 功能。"
published = "2000-10-20T04:00:00.000"
remediation = "升级 Minicom 至 1.83.0 或更高版本，该漏洞已在后续版本中修复。如无法升级，可删除 Minicom 的 setuid uucp 权限位（`chmod u-s /usr/bin/minicom`），或限制可执行 Minicom 的用户范围，仅允许受信任用户加入 uucp 组，防止本地低权限用户通过符号链接攻击创建任意文件。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Minicom Capture-file 符号链接攻击本地提权漏洞"
updated = "2026-06-16T21:52:17.570"

