[basic]
description = "Apple iOS、iPadOS 和 macOS 中的 WebKit 引擎存在整数溢出与类型混淆漏洞，攻击者可通过构造恶意网页内容触发该漏洞，在用户浏览器中执行任意代码。该漏洞影响使用 WebKit HTML 解析器的应用，包括 Apple Safari 及依赖 WebKit 进行 HTML 处理的第三方产品。未经身份认证的远程攻击者只需诱导用户访问恶意网页即可触发漏洞，CVSS 评分为 9.8（严重）。Apple 已在 macOS Big Sur 11.2、iOS 14.4、iPadOS 14.4 及 Security Update 2021-001 中修复此问题，且有报告表明该漏洞曾被实际利用于 Fugu14 越狱工具中。"
published = "2021-04-02T19:15:20.567"
remediation = "建议立即将设备升级至 iOS 14.4 或 iPadOS 14.4（适用于 iPhone 和 iPad），或将 macOS 升级至 Big Sur 11.2（适用于 Mac）。若设备无法升级至上述版本，可安装 Apple 官方发布的安全更新：Security Update 2021-001（适用于 macOS Catalina 10.15.7）或 Security Update 2021-001（适用于 macOS Mojave 10.14.6）。升级路径为：设置 → 通用 → 软件更新，下载并安装最新可用版本。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Apple iOS macOS iPadOS 远程代码执行漏洞"
updated = "2026-06-17T03:32:41.677"

