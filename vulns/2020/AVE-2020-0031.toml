[basic]
description = "rConfig 3.9.4 及之前版本的 compliancepolicyelements.inc.php 文件中存在未经身份验证的 SQL 注入漏洞。由于 rConfig 默认以明文形式存储所监控网络设备的密码，攻击者无需登录即可通过构造恶意的 searchField 参数注入 SQL 语句，直接读取数据库中被监控设备的 IP 地址、用户名及明文密码，进而实现横向移动并获得对网络设备的访问权限。该漏洞影响所有使用 rConfig 3.9.4 及更早版本的管理员，CVSS v3.1 评分 9.8，危害等级严重，已在 3.9.7 版本中修复。"
published = "2020-06-04T04:15:12Z"
remediation = "将 rConfig 升级至 3.9.7 或更高版本，该版本已修复 compliancepolicyelements.inc.php 的未认证 SQL 注入漏洞。如暂无法升级，应在 Web 服务器层面通过 .htaccess 或防火墙规则限制对 www/compliancepolicyelements.inc.php 的访问，或部署 WAF 拦截包含 UNION/SELECT 等 SQL 关键字的请求，同时将 nodes 表中存储的设备密码改为加密或哈希保存，并限制 rConfig 服务器对外访问的网络暴露面。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "rConfig rConfig 未授权SQL注入漏洞"
updated = "2026-06-17T02:47:59Z"

