[info]
author = "ave"
description = "检测目标Microsoft Office SharePoint是否存在反序列化漏洞，通过向SharePoint Web Service端点发送恶意序列化载荷并分析响应确认漏洞"
id = "POC-AVE-2026-1198"
name = "CVE-2026-50522 PoC"
severity = "critical"
tags = ["ave-2026-1198"]
vuln_id = [
    "CVE-2026-50522",
    "AVE-2026-1198",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/_vti_bin/owssvr.dll"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
Content-Type = "application/octet-stream"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
