[basic]
description = "该漏洞是 Mozilla Firefox、SeaMonkey 和 Thunderbird 浏览器中 PresShell::CompleteMove 函数存在的 use-after-free（释放后重用）内存错误引用漏洞。攻击者可通过构造恶意网页内容，在浏览器渲染页面时触发该内存错误引用，导致堆内存损坏，未经身份认证的远程攻击者即可利用该漏洞执行任意代码或造成拒绝服务。该漏洞影响 Firefox 15.0 以下版本、Firefox ESR 10.x 10.0.7 以下版本、Thunderbird 15.0 以下版本、Thunderbird ESR 10.x 10.0.7 以下版本以及 SeaMonkey 2.12 以下版本。当用户使用受影响版本的浏览器访问包含恶意代码的网页时，攻击者可在用户系统上执行任意指令，CVSS 评分为 10.0，危害等级严重。Mozilla 已在 Firefox 15.0 及 ESR 10.0.7 版本中修复此漏洞，建议用户及时升级浏览器至安全版本。"
published = "2012-08-29T10:56:40.067"
remediation = "立即将 Mozilla Firefox 升级至 15.0 或更高版本，Firefox ESR 升级至 10.0.7，Thunderbird 升级至 15.0，Thunderbird ESR 升级至 10.0.7，SeaMonkey 升级至 2.12 或更高版本。如无法立即升级，建议暂时禁用 WebGL 功能（在 about:config 中设置 webgl.disabled 为 true），并避免访问不可信的网页和邮件链接，以降低利用 PresShell::CompleteMove 中 use-after-free 漏洞执行任意代码的风险。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/SeaMonkey/Thunderbird 内存错误引用远程代码执行漏洞"
updated = "2026-06-16T23:40:43.347"

