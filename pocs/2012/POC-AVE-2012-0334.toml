[info]
author = "ave"
description = "验证Apple iTunes WebKit内存破坏漏洞是否存在，攻击者可通过构造恶意网页触发内存损坏，导致远程代码执行或应用崩溃"
id = "POC-AVE-2012-0334"
name = "CVE-2012-3657 PoC"
severity = "medium"
tags = ["ave-2012-0334"]
vuln_id = [
    "CVE-2012-3657",
    "AVE-2012-0334",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/test.html"
