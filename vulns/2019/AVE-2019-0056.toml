[basic]
description = "Shopware 5.5.8 之前版本的后端登录页面存在反射型跨站脚本（XSS）漏洞。攻击者可通过向 backend/Login 或 backend/Login/load/ URI 的查询字符串中注入恶意 JavaScript 代码，当管理员用户点击特制链接时，该脚本将在其浏览器中执行，导致敏感信息泄露或会话劫持。攻击无需身份认证，但需要用户交互（点击链接），影响 Shopware 5.5.8 之前的所有版本。"
published = "2019-06-23T23:15:09Z"
remediation = "升级 Shopware 至 5.5.8 或更高版本，该版本修复了后端登录页面 Query String 参数未正确过滤导致的反射型 XSS 漏洞。如无法立即升级，可在 Web 应用防火墙（WAF）层面添加规则，对 /backend/Login 及 /backend/Login/load/ 路径的 Query String 参数进行 HTML 特殊字符转义过滤，并限制后台管理页面仅允许可信 IP 访问以降低攻击面。"
score = 7.4
severity = "HIGH"
sources = ["nuclei"]
title = "Shopware 后台登录页面跨站脚本漏洞"
updated = "2026-06-17T02:15:45Z"

