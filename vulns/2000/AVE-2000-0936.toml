[basic]
description = "Red Hat Linux 系统中 usermode 软件包内的 userhelper 程序以 root 权限执行非 setuid 程序，但在执行前调用 setuid(0) 使实际用户 ID 与有效用户 ID 均变为 0，导致 glibc 的安全检查机制被完全绕过。由于 glibc 在处理本地化环境变量时存在格式字符串漏洞（CVE-2000-0844），攻击者可通过精心构造 LANG 或 LC_ALL 环境变量向 glibc 注入格式字符串利用代码，在 userhelper 调用非特权程序（如 kbdrate）时实现任意代码执行并获取 root 权限。该漏洞影响 Red Hat Linux 6.2/7.0 等版本，攻击者需具有目标系统的本地登录权限（如控制台登录），CVSS 评分为 7.2（高危），危害等级严重。Red Hat 已于 2000 年 9 月通过 RHSA-2000:075 安全公告发布补丁修复此漏洞。"
published = "2000-09-30T04:00:00Z"
remediation = "Red Hat Linux 系统应立即应用 RHSA-2000:075 安全公告补丁，升级 usermode 包至修复版本，并同步更新 glibc 至补丁版本。如暂无法安装补丁，可临时通过 PAM 配置禁用 userhelper 对 consolehelper 的调用，或修改 /etc/pam.d/userhelper 限制其使用范围。此外，建议将系统 LANG 和 LC_ALL 环境变量默认设置为 C 或 POSIX，避免 setuid 程序继承恶意 locale 设置，从而阻断格式化字符串漏洞的利用路径。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Red Hat Linux usermode 本地权限提升漏洞"
updated = "2026-06-16T21:53:22Z"

