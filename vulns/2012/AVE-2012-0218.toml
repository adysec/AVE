[basic]
description = "Mozilla Firefox 4.x至13.0、Firefox ESR 10.x至10.0.6、Thunderbird 5.0至13.0、Thunderbird ESR 10.x至10.0.6及SeaMonkey 2.11之前版本中的nsDocument::AdoptNode函数存在释放后使用漏洞。远程攻击者可通过诱导用户访问特制网页，利用多次节点收养操作及空文档触发该漏洞，导致堆内存损坏，造成拒绝服务或可能执行任意代码。该漏洞无需认证即可远程利用，CVSS评分10.0，危害等级严重。"
published = "2012-07-18T10:26:48Z"
remediation = "立即升级 Mozilla Firefox 至 14.0 及以上版本，Firefox ESR 升级至 10.0.6 及以上版本，Thunderbird 升级至 14.0 及以上版本，Thunderbird ESR 升级至 10.0.6 及以上版本，SeaMonkey 升级至 2.11 及以上版本。无法立即升级时，可禁用 JavaScript（在 about:config 中将 javascript.enabled 设为 false）作为临时缓解措施，或限制用户访问不可信网页。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 释放后使用漏洞"
updated = "2026-06-16T23:40:39Z"

