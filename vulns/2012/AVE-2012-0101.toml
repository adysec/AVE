[basic]
description = "Apple iOS 5.1 之前版本及 iTunes 10.6 之前版本中使用的 WebKit 引擎存在未明内存破坏漏洞（CWE-119），远程攻击者可通过诱导用户访问特制网站触发内存损坏，导致任意代码执行或拒绝服务（应用崩溃）。攻击无需身份认证，但需用户交互（访问恶意网页），CVSS 评分 9.3，危害严重。Apple 已于 2012 年 3 月发布安全更新修复此漏洞。"
published = "2012-03-08T22:55:03Z"
remediation = "升级 Apple Safari 至 5.1.4 或更高版本，升级 Apple iOS 至 5.1 或更高版本，升级 Apple iTunes 至 10.6 或更高版本。可通过 Apple 软件更新功能或访问 Apple 官网下载安装。如无法立即升级，建议避免使用受影响版本访问不可信网站。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:56Z"

