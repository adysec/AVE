[basic]
description = "mgetty 1.1.29 之前版本中的 cnd-program 组件存在缓冲区溢出漏洞。远程攻击者可通过向目标系统发送特制的 Caller ID 字符串，其中包含超长的 CallerName 参数，触发缓冲区溢出，导致目标程序崩溃造成拒绝服务，在特定条件下可能执行任意代码。该漏洞影响运行 mgetty 的各类 Unix/Linux 系统，攻击者无需身份认证即可远程触发，CVSS 评分 7.5，危害等级高。"
published = "2003-01-17T05:00:00Z"
remediation = "立即将 mgetty 升级至 1.1.29 或更高版本。Debian 系系统升级至 1.1.30-1 以上版本，Red Hat 系系统安装 RHSA-2003-008 或 RHSA-2003-036 提供的更新包。如无法升级，可在调制解调器配置中禁用 Caller ID 功能或限制 cnd-program 的输入长度作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "mgetty cnd-program 缓冲区溢出漏洞"
updated = "2026-06-16T21:59:14Z"

