[basic]
description = "Microsoft Windows Secondary Logon Service 存在缓冲区溢出漏洞，服务在处理请求句柄时未正确验证输入数据大小。本地攻击者可利用该漏洞通过构造恶意应用程序触发漏洞，获取系统管理员权限。受影响版本包括 Windows Vista SP2、Windows 7 SP1、Windows 8.1、Windows Server 2008 R2 SP1、Windows Server 2012 及 Windows 10 早期版本。该漏洞利用条件为攻击者需在目标系统上具有本地账户权限，通过运行特制应用程序实现权限提升。"
published = "2016-03-09T11:59:09Z"
remediation = '立即安装 Microsoft 2016年3月安全更新 MS16-032（对应补丁 KB3143141/KB3143142 等，视具体 Windows 版本通过 Windows Update 自动更新或手动下载安装）。如无法立即打补丁，可临时禁用 Secondary Logon 服务（运行 services.msc 找到 "Secondary Logon" 设为禁用并停止）作为临时缓解措施，但会影响需要二次登录凭据的程序运行。'
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "微软 Windows Secondary Logon 服务本地权限提升漏洞"
updated = "2026-06-17T00:36:55Z"

