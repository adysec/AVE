[basic]
description = 'MailFile 1.10 中的 mailfile.cgi CGI 程序存在任意文件泄露漏洞。远程攻击者无需身份认证即可通过 POST 请求向 "filename" 参数传入目标文件路径，服务器会将该文件内容通过邮件发送至 "email" 参数指定的地址，导致敏感信息泄露。该漏洞影响 Oatmeal Studios MailFile 1.10 版本，CVSS 评分 5.0，危害等级中危。目前厂商已停止维护，建议用户迁移至其他替代产品。'
published = "2000-12-19T05:00:00.000"
remediation = '立即删除或禁用 mailfile.cgi 脚本，该产品已停止维护且无安全更新。如必须使用，在 CGI 脚本中对 filename 参数进行严格路径白名单校验，禁止包含 "../" 等路径遍历字符，并移除 Referer 检查逻辑（可被伪造）。同时配置 Web 服务器（Apache/Nginx）限制 CGI 目录仅允许执行特定脚本，并确保 Web 进程以最小权限用户运行，降低文件泄露影响范围。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Oatmeal Studios MailFile 1.10 任意文件读取漏洞"
updated = "2026-06-16T21:52:53.800"

