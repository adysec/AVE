[basic]
description = "MDaemon 邮件服务器 Worldclient 组件（TCP 3000 端口）及 Webconfig 组件（TCP 3001 端口）存在堆溢出漏洞。远程攻击者无需身份认证即可向目标服务发送超长 URL 请求，触发堆缓冲区溢出，导致服务进程崩溃（Dr. Watson 访问违规），造成拒绝服务。由于溢出可覆盖多个寄存器且进程以 LocalSystem 权限运行，存在被利用执行任意代码以获取系统最高权限的可能性。该漏洞影响 MDaemon 3.1.1 及更早版本，厂商已在 3.1.12 版本中修复。"
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 MDaemon 至 3.1.12 或更高版本（下载地址：ftp://ftp.altn.com/MDaemon/Release/md312.exe），该版本已修复 WorldClient（TCP 3000 端口）和 WebConfig（TCP 3001 端口）中的堆溢出漏洞。如无法立即升级，可在防火墙层面限制对 TCP 3000 和 3001 端口的公网访问，仅允许可信 IP 连接，以降低被远程利用的风险。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Alt-N Mdaemon Worldclient 堆溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:59.143"

