[basic]
description = "4D WebSTAR 5.3.2 及更早版本中的 ShellExample.cgi 脚本存在路径遍历漏洞。远程攻击者无需身份认证，通过在 URL 中指定目标路径并附加星号（*）字符，即可列出服务器上的任意目录内容，导致敏感信息泄露。该漏洞影响运行 4D WebSTAR 5.3.2 及以下版本的 Web 服务器，攻击者可通过构造特殊 URL 直接访问并枚举服务器文件系统结构，获取配置文件、源代码等敏感数据，为后续进一步攻击提供信息支持。"
published = "2004-07-27T04:00:00Z"
remediation = "升级 4D WebSTAR 至 5.3.3 或更高版本，修复 ShellExample.cgi 脚本的路径遍历漏洞。如暂无法升级，请立即删除或禁用 WebSTAR 安装目录中的 ShellExample.cgi 脚本，并在 WebSTAR 管理界面中配置访问控制规则，禁止外部对该 CGI 脚本的直接访问。作为临时缓解措施，可在防火墙或反向代理层拦截包含星号（*）字符的 Web 请求路径，防止攻击者利用目录遍历列出敏感文件。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "4D WebSTAR CGI 脚本目录遍历信息泄露漏洞"
updated = "2026-06-16T22:06:11Z"

