[basic]
description = "WordPress Gift Vouchers 插件 2.0.1 及更早版本中存在 SQL 注入漏洞，攻击者可通过向 wp-admin/admin-ajax.php 发送带有恶意 template_id 参数的 wpgv_doajax_front_template 请求，无需任何身份认证即可远程执行任意 SQL 语句，导致数据库中的敏感信息泄露、数据篡改甚至完全控制网站。该漏洞影响所有使用该插件的 WordPress 站点，CVSS 评分 9.8，危害等级严重。官方尚未发布修复补丁，建议停用该插件。"
published = "2018-08-30T15:29:00Z"
remediation = "立即删除或停用 WordPress Gift Vouchers 插件至 2.0.1 及更早版本，该插件已停止维护且无安全补丁。如业务必须使用，可临时在 wp-admin/admin-ajax.php 入口处添加 WAF 规则拦截 template_id 参数中的 SQL 注入特征（如 UNION、SELECT、单引号等），并考虑迁移至其他仍在维护的礼品券插件替代方案。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress Gift Vouchers 插件 SQL注入漏洞"
updated = "2026-06-17T01:43:48Z"

