[basic]
description = "XFree86 4.3.0 的字体库中存在多个整数溢出漏洞。未经身份认证的本地或远程攻击者可通过特制字体文件或网络请求触发这些整数溢出，进而引发堆和栈缓冲区溢出攻击，最终导致系统拒绝服务或远程执行任意代码。该漏洞影响 XFree86 4.3.0 及其多个 Linux 和 Unix 发行版版本，CVSS v2 评分为 7.5（高危），攻击向量为网络可达，攻击复杂度低，无需认证即可利用。多家厂商（包括 Debian、Red Hat、Mandriva、NetBSD、SGI、Sun 及 Avaya）均已发布安全公告和补丁进行修复。"
published = "2003-10-20T04:00:00Z"
remediation = "建议升级至 XFree86 4.4.0 或更高版本（该版本包含 4.3.99.12 实验快照中的字体库整数溢出修复）。若无法立即升级，可从 XFree86 官方 FTP 下载针对 4.3.0 的源码补丁（ftp://ftp.xfree86.org/pub/XFree86/4.3.0/fixes/fontfile.diff）并重新编译安装字体模块。临时缓解措施：限制非受信字体文件的加载，在 X 服务器配置中禁用不必要的字体模块（如 freetype、xtt），仅加载受信的 bitmap 字体模块。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "XFree86 X11R6 字体库整数溢出缓冲区溢出代码执行漏洞"
updated = "2026-06-16T22:02:43Z"

