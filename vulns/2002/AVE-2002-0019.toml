[basic]
description = "该漏洞发生在 Squid 2.4.STABLE6 之前的 FTP 代理组件中，核心问题在于代理未能验证控制连接和数据连接的 IP 地址是否与实际 FTP 服务器一致。攻击者可通过向目标发起特制的 FTP 控制连接和数据连接，欺骗代理系统绕过防火墙验证机制，从而执行网络层面的伪装攻击。这意味着恶意用户无需认证即可执行网络隔离策略的破坏行为，例如通过改变数据通道的真实源地址来隐藏攻击来源，或伪造 FTP 服务器的响应以进行中间人攻击。该漏洞影响所有早于 2.4.STABLE6 版本的 Squid FTP 代理服务，攻击者可通过远程发送畸形 FTP 控制连接与数据连接的组合来触发该安全问题。目前市场上的众多旧版 Squid 产品均受到影响，建议用户尽快升级到安全版本以获取修复。"
published = "2002-07-26T04:00:00Z"
remediation = "建议立即升级 Squid 到 2.4.STABLE6 或更高版本。如无法立即升级，可在防火墙层面配置规则：仅允许 FTP 控制连接（21/tcp）与数据连接（20/tcp 或被动模式端口范围）源自同一 FTP 服务器 IP，并拒绝源 IP 不一致的 FTP 数据连接，作为临时缓解措施。建议尽快通过包管理器（如 apt upgrade squid、yum update squid）或从官网 http://www.squid-cache.org/Versions/v2/2.4/ 下载 2.4.STABLE6 及以上版本编译安装，升级后重启 squid 服务使补丁生效。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Squid FTP 代理安全绕过漏洞"
updated = "2026-06-16T21:57:59Z"

