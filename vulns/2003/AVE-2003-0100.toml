[basic]
description = 'KDE Konqueror 浏览器（KDE 3.1.2 及更早版本）未在 HTTP-Referer 头中清除包含 "user:password@host" 格式认证凭据的 URL 信息。当用户通过 Konqueror 访问包含外部链接的网页时，浏览器会在向目标站点发送的请求 Referer 头中携带完整的原始 URL，导致攻击者控制的恶意网站能够窃取 URL 中嵌入的用户名和密码等认证凭据。该漏洞影响 KDE 3.1.2 及更早版本中的 Konqueror 浏览器，攻击条件为用户需要访问攻击者控制的恶意网页且该网页中包含指向需要认证站点的链接；利用方式为攻击者通过分析 HTTP 请求中的 Referer 头获取用户提交的认证凭据，从而获得未授权访问。CVSS 评分 5.0，危害等级中等。'
published = "2003-08-27T04:00:00Z"
remediation = "建议立即升级 KDE Konqueror 至 3.1.3 版本或更高版本。KDE 2.2.2/3.0.x/3.1.x 受影响版本可从 ftp://ftp.kde.org/pub/kde/security_patches 下载对应补丁（post-2.2.2-kdelibs-http.patch、post-3.1.2-kdelibs-http.patch 等）进行临时修复。如无法立即升级，请在浏览器中避免使用形如 http://user:password@host/ 的嵌入式认证 URL，改用 KDE 身份验证对话框输入密码，以防凭据通过 HTTP Referer 头泄露给第三方网站。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "KDE Konqueror HTTP Referer认证凭证泄露漏洞"
updated = "2026-06-16T22:02:14Z"

