[basic]
description = "Google Chrome 的 HTMLMediaElement 实现存在使用后释放漏洞，攻击者可通过构造恶意网页诱导用户访问，触发内存错误引用导致浏览器崩溃或任意代码执行。该漏洞影响 Chrome 18.0.1025.151 之前版本，属于远程攻击向量，攻击复杂度中等，无需身份认证即可利用，可能造成服务拒绝、信息泄露及完整性破坏。CVSS 评分 6.8（中危），CWE-416 类型。Google 已在 Chrome 18.0.1025.151 版本中修复此漏洞，建议用户及时升级浏览器至最新版本。"
published = "2012-04-05T22:02:07Z"
remediation = "立即升级 Google Chrome 至 18.0.1025.151 或更高版本。通过浏览器菜单选择「帮助」→「关于 Google Chrome」触发自动更新，或从官网 https://www.google.com/chrome/ 下载最新安装包覆盖安装。若暂时无法升级，可在企业策略中禁用 HTML5 视频/音频播放功能作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome HTMLMediaElement 使用后释放漏洞"
updated = "2026-06-16T23:32:35Z"

