[basic]
description = "`@apostrophecms/seo` 包是 ApostropheCMS 的 SEO 插件，其 Google Analytics 跟踪 ID 和 Google Tag Manager ID 字段直接通过 JavaScript 模板字符串注入 `<script>` 标签体，未做任何转义或校验。拥有编辑器角色的用户（默认内容管理角色）可将恶意 JavaScript 代码写入这些字段，导致存储型跨站脚本攻击。该恶意脚本会在每个页面的 `<head>` 中执行，影响所有访问者，可窃取会话令牌、劫持管理员账户、分发恶意软件或实施钓鱼攻击。攻击者仅需编辑器权限即可触发，无需管理员权限。"
published = "2026-06-12T22:16:52Z"
remediation = "立即升级 @apostrophecms/seo 至最新版本；如无补丁版本，在 seo-fields-global/index.js 中对 seoGoogleTrackingId 和 seoGoogleTagManager 字段添加正则校验（/^(G-|UA-|GTM-)[A-Z0-9-]+$/i），拒绝非预期格式的输入；同时在 nodes.js 中使用 JSON.stringify 转义模板字面量中的变量值，防止脚本注入。"
score = 8.7
severity = "HIGH"
sources = ["ghsa"]
title = "ApostropheCMS @apostrophecms/seo 存储型跨站脚本漏洞"
updated = "2026-06-17T10:57:58Z"

