[basic]
description = "libxml2 在处理畸形 XPath 表达式时存在无效内存读取漏洞。攻击者可构造特制的 XML 文档，当使用 libxml2 解析该文档中的 XPath 表达式时，程序会从无效内存地址读取数据，导致应用崩溃，造成拒绝服务。该漏洞影响 libxml2 2.7.8 之前版本，被广泛集成于 Google Chrome 7.0.517.44 之前版本、Apple Safari 5.0.2 及更早版本、OpenOffice 等产品中。攻击者可通过诱导用户打开恶意 XML 文件或访问恶意网站触发漏洞，无需身份认证，攻击复杂度较高。"
published = "2010-11-17T01:00:02Z"
remediation = "将 libxml2 升级至 2.7.8 或更高版本。各受影响产品的具体修复版本：Google Chrome 升级至 7.0.517.44 及以上，Apple Safari 升级至 5.0.3 及以上，OpenOffice 升级至 3.3 及以上。Linux 用户可通过包管理器更新：Debian/Ubuntu 执行 apt-get update && apt-get upgrade libxml2，Red Hat/CentOS 执行 yum update libxml2。如无法立即升级，可在应用层对传入的 XML 文档进行 XPath 表达式合法性校验，过滤畸形 XPath 输入以降低拒绝服务风险。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "libxml2 XPath 表达式处理内存错误读取拒绝服务漏洞"
updated = "2026-06-16T23:23:58Z"

