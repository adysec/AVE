[basic]
description = "pypdf 是一个纯 Python 编写的开源 PDF 库，其 Writer 组件在处理包含线程/文章（threads/articles）结构的 PDF 文件时存在无限循环漏洞（CWE-835）。攻击者可以构造特制的 PDF 文件，当受害者使用 pypdf 库合并或处理该文件时，程序会陷入无限循环，导致拒绝服务（DoS）。该漏洞影响 pypdf 6.13.1 之前的所有版本，攻击无需身份认证，但需要本地交互（如诱导用户打开恶意 PDF）。CVSS 评分 6.9，危害等级中危。官方已在 pypdf 6.13.1 版本中修复此问题。"
published = "2026-06-22T21:16:25Z"
remediation = "建议立即升级 pypdf 到 6.13.1 及以上版本以修复无限循环漏洞。如无法立即升级，可应用来自 PR #3839 的临界修复，该修复限制了文章/线程的嵌套深度以防止无限循环。"
score = 6.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "Python PDF 库 writer 模块线程/文章处理无限循环漏洞"
updated = "2026-06-24T16:41:34Z"

