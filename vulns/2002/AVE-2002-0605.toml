[basic]
description = "DB4Web 服务器在开启详细调试消息（verbose debug messages）配置时存在服务端请求伪造（SSRF）漏洞。未经身份认证的远程攻击者可通过向目标服务器发送包含任意目标 IP 地址和端口的特制 URL 请求，利用 DB4Web 作为代理向其他系统发起 TCP 连接，通过返回的错误消息中的连接状态信息判断目标主机的端口开放情况，从而实现端口扫描和内网探测。该漏洞影响 DB4Web 3.4 和 3.6 版本，CVSS 评分 9.8，危害等级严重。攻击者仅需通过网络向目标服务器发送恶意请求即可利用此漏洞，无需任何身份认证或交互权限，成功利用可导致攻击者绕过网络边界，对内网服务进行探测。"
published = "2003-04-22T04:00:00Z"
remediation = "升级 DB4Web 至厂商发布的最新可用修复版本，并在服务器配置文件中关闭详细调试消息（verbose debug）选项。若厂商未发布修复补丁，应在防火墙中阻断 DB4Web 服务器的出站 TCP 连接，仅允许访问后端数据库的必要端口，同时将 DB4Web 部署于隔离网段并严格限制访问来源 IP，或迁移至受支持的数据库管理工具（如 Adminer）以彻底消除风险。"
score = 9.8
severity = "CRITICAL"
sources = ["exploitdb"]
title = "DB4Web 连接代理漏洞"
updated = "2026-06-16T21:59:24Z"

