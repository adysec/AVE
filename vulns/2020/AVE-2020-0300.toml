[basic]
description = "WordPress Duplicator 插件（免费版低于 1.3.28、Pro 版低于 3.8.7.1）存在路径遍历漏洞。该插件注册了一个无需身份验证的 AJAX 接口 duplicator_download，但在处理 file 参数时未做充分过滤，直接将用户可控的路径拼接至服务器目录并读取文件内容。未经身份认证的远程攻击者可通过向 /wp-admin/admin-ajax.php 发送特制 HTTP 请求，利用 ../ 路径穿越读取服务器上的任意文件，例如获取 /etc/passwd、wp-config.php 等敏感文件，进而造成信息泄露甚至获取数据库凭据。该漏洞影响所有使用该插件进行网站迁移备份的 WordPress 站点，CVSS 评分为 7.5，危害等级为高。攻击者无需登录凭据，仅需网络可达即可发起利用，且互联网上已有公开 PoC 和利用代码流传，CISA 已将本漏洞纳入已知被利用漏洞目录。"
published = "2020-04-13T22:15:10Z"
remediation = "立即将 WordPress Duplicator 插件升级到 1.3.28 或更高版本（免费版），或将 Duplicator Pro 升级到 3.8.7.1 或更高版本。如暂时无法升级，可临时禁用该插件，或在 Nginx/Apache 配置中拦截对包含 duplicator_download 和 duplicator_init 接口的未授权访问，防止路径遍历攻击。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Snap Creek Duplicator 路径遍历漏洞"
updated = "2026-06-17T02:50:42Z"

