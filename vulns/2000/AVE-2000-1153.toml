[basic]
description = "AIX 系统自带的 sysback 备份工具（4.2.1.13 之前版本）在运行时会使用相对路径而非绝对路径来查找并执行 hostname 程序。本地攻击者可通过修改 PATH 环境变量，将路径指向自己构造的恶意 hostname 程序，从而在 sysback 以高权限执行时获得权限提升，实现完全控制目标系统（机密性、完整性、可用性均受影响）。该漏洞攻击复杂度低，无需认证即可利用。"
published = "2000-12-10T05:00:00Z"
remediation = "升级 AIX sysback 至 4.2.1.13 或更高版本，该版本已修正使用相对路径调用 hostname 的问题。临时缓解措施：在系统 PATH 环境变量中移除当前目录（.）条目，确保 hostname 仅从 /usr/bin 等绝对路径调用，并限制普通用户对 PATH 的写入权限。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "IBM AIX sysback 本地权限提升漏洞"
updated = "2026-06-16T21:53:24Z"

