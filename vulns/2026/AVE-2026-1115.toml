[basic]
description = "标签之间。<value>Adobe Acrobat Reader 存在释放后使用漏洞（CWE-416），当用户打开特制的恶意 PDF 文件时，程序在已释放的内存区域进行访问，导致任意代码在当前用户上下文中执行。该漏洞影响 Windows 和 macOS 平台上的 Acrobat Reader 24.001.30365、26.001.21651 及更早版本，CVSS 评分 7.8。攻击者需诱导用户打开恶意文件才能触发利用，成功利用可完全控制受影响系统。"
published = "2026-06-09T21:17:21.357"
remediation = "立即升级 Adobe Acrobat Reader 到 24.001.30383 或 26.001.21662 及以上版本。如无法立即升级，可暂时避免打开来源不明的 PDF 文件，并在 Adobe Acrobat 中禁用 JavaScript 执行功能以降低攻击风险。同时建议通过 Adobe 官方更新通道或访问 Adobe 安全公告页面获取补丁。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Adobe Acrobat Reader 释放后使用远程代码执行漏洞"
updated = "2026-07-23T09:10:00.113"

