[basic]
description = "Synacor Zimbra Collaboration Suite (ZCS) 8.7 Patch 1 之前版本及 8.8.x 至 8.8.7 之前版本中，ZmMailMsgView.getAttachmentLinkHtml 函数存在跨站脚本（XSS）漏洞。攻击者可通过发送包含恶意 Content-Location 头的邮件附件，诱导受害者查看邮件时触发 XSS，在受害者浏览器中执行任意 JavaScript 代码。该漏洞影响 Zimbra Collaboration Suite 8.7 及 8.8.x 受影响版本，CVSS 3.1 评分 6.1（中危），攻击向量为网络（AV:N），攻击复杂度低（AC:L），无需权限（PR:N），需用户交互（UI:R），作用域改变（S:C），机密性和完整性影响低（C:L/I:L），无可用性影响（A:N）。攻击者需诱导用户查看精心构造的恶意邮件附件，利用 Content-Location 头注入恶意脚本，窃取用户会话或执行其他恶意操作。Synacor 已在 8.7 Patch 1 和 8.8.7 版本中修复该漏洞，建议升级至修复版本。CVE-2018-6882 对应 CWE-79 跨站脚本漏洞类型。"
published = "2018-03-27T16:29:00.530"
remediation = "立即将 Zimbra Collaboration Suite 升级至 8.7 Patch 1 或 8.8.7 及以上版本以修复 XSS 漏洞。如暂时无法升级，可在邮件网关层面过滤包含异常 Content-Location 头部的入站邮件作为临时缓解措施，并监控邮件附件中的链接行为。"
score = 6.1
severity = "MEDIUM"
sources = ["kev"]
title = "Synacor Zimbra Collaboration Suite Email Attachment 跨站脚本攻击"
updated = "2026-06-17T02:02:24.587"

