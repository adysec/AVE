[basic]
description = "tags.<value>Soft Lite ServerWorx 3.00 存在目录遍历漏洞，未经身份认证的远程攻击者可通过在 HTTP GET 请求的路径名中插入 ..（两个点）或 ...（三个点）等特殊字符突破目录访问限制，读取服务器上任意文件。该漏洞影响 Soft Lite ServerWorx 3.00 版本，攻击者无需身份验证即可发起利用，成功利用可导致敏感信息泄露，如配置文件、密码文件等。攻击条件为目标系统运行存在漏洞的 ServerWorx 版本且允许外部 HTTP 访问，攻击者只需构造包含目录遍历序列的恶意 URL 即可实现任意文件读取。"
published = "2001-06-02T04:00:00.000"
remediation = "建议迁移至 Apache、Nginx 或 IIS 等现代 Web 服务器。若必须继续使用，请在 Web 服务器层面配置目录访问限制，并在 WAF 中添加规则拦截包含 ../ 或 ... 的请求路径，防止目录遍历攻击。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Soft Lite ServerWorx 3.0 目录遍历漏洞"
updated = "2026-06-16T21:53:52.870"

