[basic]
description = "NETGEAR 多款路由器（包括 R8500、R8300、R7000、R6400、R7300、R7100LG、R6300v2、WNDR3400v3、WNR3500Lv2、R6250、R6700、R6900、R8000 等型号）的 Web 管理界面存在密码信息泄露漏洞。攻击者通过向 Web 管理服务器发送特制请求，可在未授权情况下获取路由器管理员密码。若远程管理选项开启，攻击者可远程利用该漏洞；否则需接入同一局域网或无线网络。具体利用方式为：访问管理面板时取消认证，若密码恢复功能未启用，页面会泄露密码恢复令牌，攻击者使用该令牌访问 /passwordrecovered.cgi?id=TOKEN 即可直接获取管理员密码。该漏洞 CVSS 评分 8.1，危害等级高，已被 CISA 列入已知被利用漏洞目录。"
published = "2017-01-17T09:59:00Z"
remediation = "立即升级受影响设备固件至修复版本：R8500升级至1.0.2.86、R8300升级至1.0.2.86、R7000升级至1.0.7.10、R6400升级至1.0.1.20、R7300DST升级至1.0.0.46、R7100LG升级至1.0.0.28、R6300v2升级至最新版、WNDR3400v3升级至1.0.1.8、WNR3500Lv2升级至1.2.0.38、R6250升级至1.0.4.8、R6700升级至1.0.1.16、R6900升级至1.0.1.16、R8000升级至1.0.3.36、R7900升级至1.0.1.12、D6220升级至1.0.0.22、D6400升级至1.0.0.56。如设备已停止支持或无固件更新，请手动启用密码恢复功能（登录路由器管理界面→管理→密码恢复→启用），并确保远程管理功能处于关闭状态（默认关闭，可在高级设置中确认）。C6300线缆调制解调器路由器需等待ISP推送固件2.01.18。"
score = 8.1
severity = "HIGH"
sources = ["nuclei"]
title = "NETGEAR 多款路由器管理员密码信息泄露漏洞"
updated = "2026-06-17T01:20:39Z"

