[basic]
description = 'Ruby on Rails 的 Action View 组件存在目录遍历漏洞，攻击者利用应用程序对 render 方法的无限制调用，在路径名中提供 ".."（点号）序列，即可绕过目录访问限制，读取服务器上的任意文件。该漏洞影响 Rails 3.2.22.1 之前、4.0.x 及 4.1.x 在 4.1.14.1 之前、4.2.x 在 4.2.5.1 之前、5.x 在 5.0.0.beta1.1 之前的版本。攻击者无需身份认证即可远程触发该漏洞，通过构造恶意请求即可实现文件读取，可能导致敏感配置信息、源代码等被泄露。'
published = "2016-02-16T02:59:06Z"
remediation = "立即将 Rails 升级至以下修复版本：Rails 3.x → 3.2.22.1，Rails 4.0.x → 4.0.x 最新补丁版，Rails 4.1.x → 4.1.14.1，Rails 4.2.x → 4.2.5.1，Rails 5.x → 5.0.0.beta1.1。同时禁止在 render 方法中使用未经校验的用户输入作为文件路径，对所有路径参数进行白名单校验与目录遍历字符（..）过滤，可在应用层中间件中统一拦截包含 .. 的请求路径作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Ruby on Rails Action View 目录遍历漏洞"
updated = "2026-06-17T00:38:09Z"

