[basic]
description = "Cisco Catalyst 3500 XL 交换机的 Web 配置界面存在认证绕过漏洞。当交换机管理员未设置操作系统启用密码时，攻击者可通过浏览器访问 Web 管理界面，发送包含 /exec/ 目录的 URL 请求，无需任何认证即可执行任意系统命令，导致交换机被完全接管。该漏洞影响所有 Cisco Catalyst 3500 XL 系列交换机，只要设备未设置管理员密码即可被利用。攻击条件为目标设备未设置管理员密码且 Web 管理界面处于开放状态。攻击方法简单直观，攻击者只需向目标交换机发送特定 URL 即可获得命令执行权限，可能导致敏感数据泄露、服务中断、网络安全隐患。"
published = "2000-12-19T05:00:00.000"
remediation = '建议立即在 Cisco Catalyst 3500 XL 交换机上配置 enable 密码（enable password 或 enable secret），并升级到修复该漏洞的 IOS 版本（12.0(5.1)WC 或更高版本）。若无法立即升级，请通过访问控制列表（ACL）限制 Web 管理界面仅允许受信任管理 IP 访问，或使用 "no ip http server" 命令禁用 HTTP 管理服务作为临时缓解措施。'
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Cisco Catalyst 3500 XL 任意命令执行漏洞"
updated = "2026-06-16T21:52:49.600"

