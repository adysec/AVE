[basic]
description = "Oracle GlassFish Server Open Source Edition 4.1 存在目录遍历漏洞（CWE-22），未经身份认证的远程攻击者可通过发送特制的 HTTP GET 请求，在路径中插入 `../` 等目录遍历序列，绕过访问限制读取服务器上的任意文件，如配置文件、密码文件等敏感信息。该漏洞无需认证即可利用，攻击复杂度低，且无需用户交互，CVSS 评分 7.5，危害等级高。攻击者可通过构造类似 `http://target/theme/META-INF/%c0%ae%c0%ae/%c0%ae%c0%ae/%c0%ae%c0%ae/%c0%ae%c0%ae/%c0%ae%c0%ae/%c0%ae%c0%ae/%c0%ae%c0%ae/%c0%ae%c0%ae/%c0%ae%c0%ae/%c0%ae%c0%ae/etc/passwd` 的请求实现任意文件读取。该漏洞影响 GlassFish Server Open Source Edition 4.1 版本，已有公开的 Metasploit 模块和 Nuclei 模板可用于检测。"
published = "2017-07-17T13:18:16Z"
remediation = "建议立即将 GlassFish Server Open Source Edition 升级至 5.0 或更高版本，该漏洞已在后续大版本中修复。如无法升级，可采取以下缓解措施：1) 使用 Web 应用防火墙（WAF）或入侵防御系统（IPS）拦截包含 `%c0%af`、`%c0%ae` 等目录遍历编码的请求；2) 将管理控制台（默认端口 4848/TCP）限制在可信网络内访问，避免暴露到公网；3) 禁用不必要的主题资源路径 `/theme/` 的访问权限。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Oracle GlassFish Server 任意文件读取漏洞"
updated = "2026-06-17T00:58:36Z"

