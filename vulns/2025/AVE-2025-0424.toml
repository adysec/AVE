[basic]
description = "Rsync 文件同步工具中存在数组索引验证缺陷，恶意客户端作为文件传输接收方时，可通过构造负数的数组索引触发堆缓冲区越界读取，导致信息泄露。攻击者需至少拥有对远程 rsync 模块的读取权限才能利用该漏洞。该漏洞影响 Rsync 3.x 系列版本，CVSS 评分 4.3，危害等级中危。官方已通过提交 797e17fc 修复此问题，建议用户升级至最新版本。"
published = "2025-11-18T15:16:25Z"
remediation = "升级 rsync 至包含 commit 797e17fc 的修复版本（如 rsync ≥ 3.4.1 且包含该补丁）。各发行版用户：Gentoo 升级至 rsync-3.4.1-r2，Alpine Linux 升级至对应修复版本，SUSE SLES12 安装 SUSE-SU-2026:2048-1 安全更新。如无法立即升级，在 rsyncd.conf 中对模块设置 `read only = yes` 并限制 `hosts allow` 仅允许可信来源连接，降低恶意客户端触发漏洞的风险。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Rsync rsync 堆缓冲区越界读取漏洞"
updated = "2026-06-17T08:27:47Z"

