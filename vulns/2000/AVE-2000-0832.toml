[basic]
description = 'YaBB 论坛系统 search.pl CGI 脚本存在目录遍历漏洞，远程未授权攻击者可通过在 "catsearch" 表单字段中提交 ".." 目录遍历序列，读取服务器上任意文件内容。该漏洞影响 YaBB 及 YaBB SE 早期版本（如 1.5.1 及 9.11.2000 版本），CVSS 评分 7.5（HIGH），攻击向量为网络、攻击复杂度低、无需认证，可导致机密性、完整性、可用性部分受损。攻击者无需认证即可通过构造恶意 catsearch 参数实现任意文件读取，进而可能获取敏感配置文件、源代码或系统文件，进一步导致权限提升或系统完全沦陷。'
published = "2001-01-09T05:00:00Z"
remediation = "升级到YaBB 2.5.1及以上版本，该版本修复了search.pl CGI脚本的目录遍历和命令执行漏洞。修改catsearch参数验证，禁用目录遍历功能。部署Web应用防火墙，限制对search.pl的访问。启用日志记录，监控可疑的catsearch参数请求。禁用未使用的CGI脚本和服务。实施强制输入过滤和路径 Sanitization。更新所有YaBB相关的组件到最新安全补丁版本。启用Web应用防火墙(WAF)，阻止常见的目录遍历攻击。实施异常检测，识别和阻止对search.pl的可疑访问模式。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "YaBB YaBB SE 目录遍历漏洞"
updated = "2026-06-16T21:53:19Z"

