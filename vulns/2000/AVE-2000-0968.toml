[basic]
description = "Digital UNIX 4.0F 系统中的 kdebug 调试守护进程（kdebugd）存在任意文件读取漏洞。远程攻击者无需身份认证即可通过网络向目标系统发送特制的初始化数据包，在其中指定任意文件的完整路径名，从而读取系统上的任意文件，包括敏感配置文件、密码文件等。该漏洞影响 Digital UNIX 4.0F 版本，CVSS 评分 6.4，危害等级中危，可能导致敏感信息泄露。"
published = "2000-11-14T05:00:00Z"
remediation = "立即停止并禁用 kdebugd 守护进程（kdebug daemon），该服务默认监听 UDP 端口，可通过 `chkconfig kdebugd off` 或删除 `/etc/inetd.conf` 中相关条目后重启 inetd 来禁用。在无法禁用的情况下，在防火墙上限制对 kdebugd 端口的访问，仅允许受信任的管理 IP 连接。Digital Unix 4.0F 已停止技术支持，建议升级到受支持的操作系统版本。"
score = 6.4
severity = "MEDIUM"
sources = ["avd"]
title = "Digital Unix kdebugd 远程任意文件读取漏洞"
updated = "2026-06-16T21:52:35Z"

