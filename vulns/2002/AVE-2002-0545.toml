[basic]
description = "Microsoft Word 95/97/98/2000/2002 及 Excel 2002 在处理文档域代码时存在信息泄露漏洞。远程攻击者可构造特制 Office 文档，利用 INCLUDETEXT 或 INCLUDEPICTURE 等域代码在文档返回给攻击者时自动插入并泄露目标系统中的敏感信息（如文件内容）。用户只需打开恶意文档即可触发，无需额外认证，攻击者可通过社会工程诱导用户打开文档实现信息窃取。"
published = "2003-04-11T04:00:00Z"
remediation = "升级到 Microsoft Office XP SP2 或更高版本，该漏洞已在 MS02-031 安全公告中修复。对于无法升级的旧版 Office（Word 95/97/98/2000/2002、Excel 2002），建议禁用文档中的域代码自动执行功能：在 Word 中依次点击「工具」→「选项」→「安全性」→勾选「打开文档时更新自动链接」，或通过组策略禁用 INCLUDETEXT/INCLUDEPICTURE 域代码。同时避免打开来自不可信来源的 Office 文档。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Word 和 Excel 域代码信息泄露漏洞"
updated = "2026-06-16T21:58:48Z"

