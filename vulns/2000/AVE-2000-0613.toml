[basic]
description = "FreeBSD Alpha 平台上缺少 /dev/random 和 /dev/urandom 随机数设备，而 OpenSSL 0.9.4 及 OpenSSH 在初始化时未正确检查这些设备是否存在，导致系统回退到弱随机数生成器产生可预测的加密密钥。攻击者可通过分析密钥空间实施暴力破解，从而解密通信内容或伪造身份认证。该漏洞影响运行于 FreeBSD Alpha 架构的系统，CVSS 评分 5.0，危害等级中等。"
published = "2000-06-12T04:00:00Z"
remediation = "升级 OpenSSL 至 0.9.5 及以上版本，升级 OpenSSH 至 2.1 及以上版本，确保代码在 `/dev/random` 不存在时能回退到 EGD（Entropy Gathering Daemon）或其他熵源。在 FreeBSD Alpha 系统上手动创建 `/dev/random` 和 `/dev/urandom` 设备节点（`mknod /dev/random c 1 8`、`mknod /dev/urandom c 1 9`），或加载内核随机数生成器模块。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "FreeBSD Alpha端口 OpenSSL 与 OpenSSH 弱密钥生成漏洞"
updated = "2026-06-16T21:51:56Z"

