[basic]
description = "Microsoft SQL Server 及 Microsoft SQL Server Desktop Engine (MSDE) 的扩展存储过程（Extended Stored Procedures）存在参数解析漏洞。漏洞位于 xp_enumresultset 函数中，该函数在调用 SQL Server API 的 srv_paraminfo 函数之前，未对缓冲区长度进行充分限制。远程攻击者可构造超长参数提交至扩展存储过程，触发缓冲区溢出，从而导致拒绝服务（服务崩溃或不可用）或在服务器上下文中执行任意命令。该漏洞影响 SQL Server 6.5/7.0 及 MSDE 1.0/2000 等早期版本，攻击条件为具备数据库连接权限，CVSS 评分 4.6，危害等级中等。"
published = "2001-01-09T05:00:00.000"
remediation = "立即安装微软安全公告 MS00-092 提供的补丁，可通过 Microsoft Download Center 或 Windows Update 获取。SQL Server 7.0 用户需安装 Service Pack 3 或在其上应用补丁；SQL Server 2000 用户需安装 Service Pack 1 或直接应用补丁。如使用第三方扩展存储过程，须按照 KB280380 的说明检查其 srv_paraminfo() 调用方式，确保在获取参数前先以不拷贝数据的模式调用以获取参数长度，再分配足够大小的缓冲区。同时遵循最佳实践，将 SQL Server 服务账户配置为普通用户而非管理员权限运行。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft SQL Server 扩展存储过程参数解析缓冲区溢出漏洞"
updated = "2026-06-16T21:53:06.773"

