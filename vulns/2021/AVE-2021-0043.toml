[basic]
description = "Apple iOS 的 WebKit 组件存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过向目标设备发送恶意构造的网页内容触发该漏洞，导致任意代码执行。该漏洞源于未对输入大小进行充分检查即执行缓冲区拷贝操作（CWE-119），攻击者可通过诱导用户访问恶意网页在无需交互的情况下实现远程代码执行。该漏洞影响 iOS 12.5.3 之前的版本，CVSS 评分 8.8，危害等级高。Apple 已知晓该漏洞可能已被积极利用，已在 iOS 12.5.3 安全更新中修复该问题。"
published = "2021-09-08T15:15:13Z"
remediation = "升级至 iOS 12.5.3 或更高版本，前往「设置」>「通用」>「软件更新」进行系统更新。受影响设备包括 iPhone 5s、iPhone 6、iPhone 6 Plus、iPad Air、iPad mini 2、iPad mini 3 及 iPod touch（第 6 代）。如暂无法立即更新，可避免访问未知或恶意网站，并使用其他浏览器作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Apple iOS WebKit 远程代码执行漏洞"
updated = "2026-06-17T03:50:39Z"

