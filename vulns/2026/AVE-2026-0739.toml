[basic]
description = "vcpkg 是一款开源的 C/C++ 包管理器。在 3.6.1#3 版本之前，其 Windows 版本的 OpenSSL 构建将 openssldir 硬编码为构建机器上的路径，导致该路径在客户机器上可被劫持。攻击者若能在该硬编码路径下植入恶意 OpenSSL 配置文件或库文件，即可在受害者运行使用该 OpenSSL 的应用程序时实现代码执行或权限提升。该漏洞影响所有使用受影响 vcpkg 版本构建的 Windows 应用程序，CVSS 评分 7.8（HIGH），攻击向量为本地（AV:L），需低权限（PR:L）且无需用户交互（UI:N）。Microsoft 已在 vcpkg 3.6.1#3 中修复此问题，建议用户升级至该版本或更高版本并重新构建应用。"
published = "2026-03-31T03:15:58Z"
remediation = "建议立即升级vcpkg到3.6.1#3或更高版本，该版本修复了OpenSSL的openssldir路径劫持问题。升级后，请确保使用新的vcpkg.toml配置文件指定正确的openssldir路径。如无法立即升级，可通过环境变量SSL_DIR设置正确目录以临时缓解风险。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Microsoft vcpkg OpenSSL路径劫持漏洞"
updated = "2026-06-17T10:38:29Z"

