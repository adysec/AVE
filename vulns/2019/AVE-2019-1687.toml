[basic]
description = "标签之间。<value>WordPress 的 social-warfare 插件在 3.5.3 及更早版本中存在存储型跨站脚本漏洞（Stored XSS）。攻击者可以利用 wp-admin/admin-post.php 接口中 swp_debug=load_options 参数所传递的 swp_url 参数，注入并存储恶意 JavaScript 脚本代码。该漏洞影响 Social Warfare 与 Social Warfare Pro 插件，攻击者无需预先认证即可构造恶意请求，当具有管理权限的用户访问相关页面时，浏览器将执行注入的脚本，导致管理员会话 Cookie 被窃取、后台控制权被劫持，甚至可进一步实现远程代码执行。此漏洞在 2019 年 3 月已被确认在野利用。"
published = "2019-03-24T15:29:00Z"
remediation = "立即将 WordPress Social Warfare 插件升级到 3.5.3 或更高版本，Social Warfare Pro 用户也需同步升级至对应补丁版本。如暂无法立即升级，应在 WordPress 后台临时禁用或直接删除该插件目录，并在 Web 应用防火墙（WAF）或服务器层面拦截包含 swp_debug 与 swp_url 参数的 HTTP 请求，同时检查网站访问日志以确认是否存在利用该漏洞的攻击痕迹。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Social Warfare 存储型跨站脚本漏洞"
updated = "2026-06-17T02:44:58Z"

