[basic]
description = "tags.<value>PassWD 1.2 存在弱加密漏洞，该软件使用简单编码而非真正加密算法来存储用户密码。当攻击者能够访问密码文件时，可以通过简单的解码方法轻易恢复明文密码。攻击者只需获取密码文件，利用弱加密算法即可解密所有密码，实现身份伪造和权限提升。该漏洞导致用户凭证完全暴露，任何使用 PassWD 1.2 的系统都面临极高安全风险。"
published = "2000-06-04T04:00:00Z"
remediation = "立即停止使用 PassWD 1.2 存储密码，迁移至支持强加密算法（如 bcrypt、Argon2）的密码管理工具。若无法立即更换，应将密码文件权限设置为仅限管理员可读（chmod 600），并尽快部署密码哈希迁移脚本，将现有弱加密密码重新哈希为安全算法。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "PassWD PassWD 1.2 弱加密存储漏洞"
updated = "2026-06-16T21:51:51Z"

