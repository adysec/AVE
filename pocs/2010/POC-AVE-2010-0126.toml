[info]
author = "ave"
description = "Apple Safari WebKit 引擎存在跨站脚本（XSS）漏洞，攻击者可通过构造畸形 URL 诱导用户访问，注入任意 Web 脚本或 HTML。该漏洞影响 Safari 5.0 之前版本（Mac OS X 10.5/10.6/Windows）及 Safari 4.1 之前版本（Mac OS X 10.4）。验证方式：构造包含恶意脚本的畸形 URL，让目标在受影响版本的 Safari 中访问，检测是否执行注入脚本。"
id = "POC-AVE-2010-0126"
name = "CVE-2010-0544 PoC"
severity = "medium"
tags = ["ave-2010-0126"]
vuln_id = [
    "CVE-2010-0544",
    "AVE-2010-0126",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/test.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["XSS"]
