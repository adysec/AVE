[info]
author = "AVE"
description = "检测Kaseya VSA的ConnectWise ManagedITSync集成中ManagedIT.asmx页面是否存在，该页面存在未授权SQL注入漏洞（CVE-2017-18362），攻击者可执行任意SQL查询"
id = "POC-AVE-2017-0606"
name = "ConnectWise ManagedITSync Kaseya VSA集成未授权SQL注入漏洞 PoC"
severity = "critical"
tags = ["ave-2017-0606"]
vuln_id = [
    "CVE-2017-18362",
    "AVE-2017-0606",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/KaseyaCwWebService/ManagedIT.asmx"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "ManagedIT.asmx?op=",
    "ExecuteSQLQuery",
]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
