[basic]
description = "Fluent Bit 日志处理工具的 in_docker 输入插件存在缓冲区溢出漏洞。其 extract_name 函数在将容器名称复制到固定大小的栈缓冲区时，未对容器名长度进行有效校验。攻击者若具备创建容器或控制容器名称的权限，可通过提交超长容器名称触发缓冲区溢出，进而导致 Fluent Bit 进程崩溃，严重情况下可执行任意代码，造成数据泄露或服务器被控。该漏洞影响部署了受影响的 Fluent Bit 版本并使用 Docker 容器监控功能的系统环境，CVSS 评分为 8.8，危害等级为高。攻击者无需用户交互即可远程利用此漏洞，因此建议受影响用户尽快升级至官方修复版本。"
published = "2025-11-24T15:15:46Z"
remediation = "建议立即升级 Fluent Bit 至安全版本：4.0.x 分支升级至 v4.0.12 或更高版本，4.1.x 及后续分支升级至 v4.1.1 或更高版本。如暂时无法升级且无需 Docker 容器日志采集，可暂时禁用 in_docker 输入插件以消除攻击面。升级后重启 Fluent Bit 服务使补丁生效。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Fluent Bit in_docker 输入插件 缓冲区溢出漏洞"
updated = "2026-06-17T08:33:18Z"

