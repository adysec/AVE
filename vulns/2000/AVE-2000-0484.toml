[basic]
description = 'Microsoft IIS 4.0 和 5.0 存在源代码片段泄露漏洞，远程攻击者通过在 URL 后附加 "+.htr" 即可触发该漏洞，这是 ".HTR 文件片段读取" 漏洞的变种。攻击者无需身份认证即可通过网络远程利用，导致服务器返回 ASP 等脚本文件的源代码片段，从而泄露数据库连接字符串、业务逻辑等敏感信息。该漏洞影响 IIS 4.0 和 5.0 版本，攻击条件简单，危害中等。'
published = "2000-07-17T04:00:00.000"
remediation = "建议立即移除 IIS 中的 .HTR 脚本映射：打开 Internet 服务管理器 → 右键网站属性 → 主属性 → WWW 服务 → 编辑 → 主目录 → 配置，删除 .HTR 条目。如业务必须保留 HTR 功能，则安装 MS00-044 补丁（已被 MS01-004 取代），同时收紧 /scripts/iisadmin 目录权限，仅允许管理员访问。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft IIS 4.0/5.0 源码片段泄露漏洞"
updated = "2026-06-16T21:52:08.837"

