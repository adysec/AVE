[basic]
description = "Astro 6.4.7 版本存在授权绕过漏洞，源于迭代 URL 解码器最大解码深度限制（10 次）与路由重写路径规范化不一致。当攻击者构造编码深度超过 11 层的特制 URL（如 /%252525252525252525252561dmin）时，中间件授权检查仅获得部分解码路径（/%61dmin），而后续路由匹配执行额外的 decodeURI() 操作后解析为受保护路径（/admin），导致绕过中间件权限校验。未经身份认证的远程攻击者可利用此漏洞访问受保护的 /admin、/api/admin、/internal 等路由，造成敏感信息泄露和未授权操作。该漏洞影响 Astro 6.4.7 版本，CVSS 评分 8.2，危害等级高。官方已在 6.4.8 版本中修复。"
published = "2026-07-08T17:17:25.937"
remediation = "立即将 Astro 升级至 6.4.8 或更高版本（该版本在解码迭代达到上限时抛出错误而非返回部分解码路径）。如无法立即升级，可在反向代理或 WAF 层面添加规则，拒绝包含超过 10 层 URL 编码的请求路径（如匹配 `%25` 重复出现 10 次以上的路径），作为临时缓解措施。"
score = 8.2
severity = "HIGH"
sources = ["ghsa"]
title = "Astro URL路径规范化不匹配授权绕过漏洞"
updated = "2026-07-09T16:29:14.203"

