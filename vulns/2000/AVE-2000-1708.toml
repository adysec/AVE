[basic]
description = "NetBSD 系统上运行的 Global 3.55 及更早版本中的 global.cgi CGI 程序存在命令注入漏洞。由于程序未对用户输入中的 shell 元字符（如分号、管道符等）进行有效过滤，远程攻击者无需身份认证即可通过向 CGI 接口发送特制 HTTP 请求，在服务器上以 Web 服务进程权限执行任意系统命令。该漏洞可导致目标系统被完全控制，包括数据窃取、恶意软件植入等严重后果，CVSS 评分 10.0，危害等级严重。"
published = "2000-12-19T05:00:00.000"
remediation = "由于该软件版本过于陈旧且已停止维护，建议立即停止使用 Global 3.55 及更早版本，迁移至现代安全的替代方案。若必须临时运行，请在防火墙或 Web 服务器配置中禁用/拦截对 global.cgi 路径的外部访问，以防止远程命令执行。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "NetBSD Global global.cgi 远程命令执行漏洞"
updated = "2026-06-16T21:52:50.543"

