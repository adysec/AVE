[basic]
description = "Google Chrome 132.0.6834.83 之前版本的 V8 JavaScript 引擎存在越界内存访问漏洞（CWE-122）。远程攻击者可通过构造特制的 HTML 页面诱导用户访问，触发 V8 引擎在处理 JavaScript 对象时发生堆内存越界读写，进而导致堆破坏，最终实现远程代码执行。该漏洞影响 Google Chrome、Microsoft Edge 及基于 Chromium 的浏览器，CVSS 评分 8.8，危害等级高危。用户需升级至 Chrome 132.0.6834.83 或更高版本以修复此漏洞。"
published = "2025-01-15T11:15:09Z"
remediation = '立即将 Google Chrome 升级至 132.0.6834.83 或更高版本（通过设置→关于 Chrome 自动检查更新）；使用 Microsoft Edge 的用户升级至 132.0.2957.115 或更高版本；基于 Chromium 的第三方浏览器请跟进厂商更新。Fedora 40 用户执行 sudo dnf update 更新 chromium 包。无法立即升级时，可启用 Chrome 的 Site Isolation 功能并禁用 V8 JIT（--js-flags="--jitless"）作为临时缓解措施。'
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 越界内存访问漏洞"
updated = "2026-06-17T08:26:28Z"

