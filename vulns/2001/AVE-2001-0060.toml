[basic]
description = "CVE-2001-0165是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-05-03T04:00:00.000"
remediation = "安装 Sun 2001 年推荐补丁集（Recommended Patch Cluster）或升级至 Solaris 9/10，补丁已修复 ximp40.so.2 库中的 arg0 参数缓冲区溢出。如无法立即打补丁，可对受影响程序移除 SUID/SGID 权限位作为临时缓解措施：chmod u-s /usr/dt/bin/dtaction /usr/dt/bin/dtprintinfo /usr/openwin/bin/sys-suspend /usr/dt/bin/dtappgather /usr/bin/admintool && chmod g-s /usr/dt/bin/dtmail /usr/openwin/bin/mailtool，防止本地用户利用长进程名参数获取 root 或 mail 权限。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Sun Solaris 7/8 ximp40 共享库缓冲区溢出漏洞"
updated = "2026-06-16T21:53:47.500"

