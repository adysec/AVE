[basic]
description = "Adobe Flash Player 的 AVM 序列化器（AvmSerializer.cpp）在处理实现 IExternalizable 接口的类时存在类型混淆漏洞。当 IExternalizable.writeExternal 方法被非函数值覆盖时，Flash Player 仍将其当作函数调用，导致方法在 ActionScript vtable 之外执行，引发内存损坏，最终可实现任意代码执行。该漏洞影响 Adobe Flash Player 18.x 至 18.0.0.252、19.x 至 19.0.0.207（Windows 和 macOS）以及 11.x 至 11.2.202.535（Linux）版本。攻击条件为受害者打开含恶意 SWF 文件的网页，无需身份认证，攻击者可通过恶意网页、电子邮件或社工手段诱使目标在浏览器或 Flash Player 中加载特制 SWF 文件即可触发。该漏洞于 2015 年 10 月已被在野利用，攻击者构造特制的 SWF 文件，利用 writeExternal 的类型混淆机制覆盖方法为变量，从而触发内存损坏并执行任意代码。Adobe 已在安全公告 APSB15-27 中发布更新版本修复此漏洞，建议用户升级至最新版 Flash Player。"
published = "2015-10-15T10:59:10Z"
remediation = '建议立即卸载 Adobe Flash Player（Adobe 已于 2020 年 12 月 31 日停止支持），从控制面板或使用官方卸载工具彻底移除，以根除攻击面。如业务必须使用，请升级至安全公告 APSB15-27 中的修复版本（Flash Player 19.0.0.245 或更高），并在所有浏览器中将 Flash 插件设为"点击运行"或彻底禁用，同时限制用户访问不可信网站及打开可疑 SWF 文件。'
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Adobe Flash Player 远程代码执行漏洞"
updated = "2026-06-17T00:32:53Z"

