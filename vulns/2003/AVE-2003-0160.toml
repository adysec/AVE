[basic]
description = "fileutils 或 coreutils 包中的 ls 命令存在整数溢出漏洞。当应用程序（如 wu-ftpd）调用 ls 并使用过大的 -w 参数时，整数溢出可被触发。该漏洞使攻击者无需身份认证即可利用，通过远程使用 ls 的应用程序发送特制的大 -w 值触发整数溢出，从而造成拒绝服务或执行任意代码。受影响范围包括使用 ls 命令的本地及远程应用程序，攻击者可在本地用户权限下远程利用该漏洞。"
published = "2003-11-17T05:00:00Z"
remediation = "升级 GNU coreutils 至 5.0 或更高版本（Debian 系列至少升级至 coreutils 5.2.1-1），以修复 ls 命令在处理 -w 宽度参数时的整数溢出漏洞。对于已安装受影响版本的 Linux 系统，可通过发行版官方安全更新通道进行升级，例如 Debian/Ubuntu 执行 apt upgrade coreutils，RHEL/CentOS 通过 yum update coreutils 应用 RHSA-2003:309 和 RHSA-2003:310 安全补丁。如暂无法立即升级，作为临时缓解措施可禁用或限制使用 wu-ftpd 等会调用 ls 的应用程序，防止攻击者通过 FTP 服务传入超大 -w 值触发整数溢出导致拒绝服务或任意代码执行。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "GNU Coreutils ls 宽度参数整数溢出漏洞"
updated = "2026-06-16T22:03:05Z"

