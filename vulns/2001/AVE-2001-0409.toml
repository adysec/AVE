[basic]
description = "Microsoft Windows XP 的帮助中心程序 helpctr.exe 存在缓冲区溢出漏洞。远程攻击者无需身份认证即可通过发送包含超长 hcp: URI 的特制请求，触发 helpctr.exe 中的缓冲区溢出，从而在目标系统上执行任意代码。该漏洞影响 Windows XP 操作系统，CVSS 评分为 7.5，属于高危级别。攻击条件宽松，仅需向目标发送恶意构造的 hcp 协议链接即可触发利用。"
published = "2001-11-21T05:00:00Z"
remediation = '建议立即安装 Microsoft 安全公告 MS02-060 对应的更新补丁，或升级至 Windows XP Service Pack 1 (SP1) 及以上版本。如无法安装补丁，可通过命令行运行 `regsvr32 /u %windir%\pchealth\helpctr\binaries\helpctr.exe` 注销 helpctr.exe 组件，或删除注册表中 `HKEY_CLASSES_ROOT\hcp` 协议处理项作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft Windows XP Help Center HCP URI 缓冲区溢出漏洞"
updated = "2026-06-16T21:55:12Z"

