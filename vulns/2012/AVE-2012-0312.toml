[basic]
description = "Apple iOS 5.1.1 及更早版本所采用的 WebKit 渲染引擎存在内存破坏漏洞，Safari 浏览器 6.0 之前版本亦受影响。远程攻击者可通过构造恶意网页，诱导用户使用存在漏洞的浏览器访问，触发 WebKit 在处理网页内容时的内存错误，最终导致远程代码执行或拒绝服务。该漏洞影响所有使用受影响版本 iOS 及 Safari 的设备，攻击条件简单，无需用户认证即可实施攻击。Apple 已在后续版本中修复此漏洞。"
published = "2012-07-25T20:55:03.417"
remediation = "建议立即将 Apple iOS 设备升级至 6.0 或更高版本，或将 Mac OS X 上的 Safari 浏览器升级至 6.0 及以上版本。如暂时无法升级，应避免访问不受信任的网站，并在 Safari 偏好设置的安全性选项中禁用 JavaScript 执行作为临时缓解措施，直至完成系统更新。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:37.567"

