[basic]
description = """
标签之间。<value>
Excite for Web Servers（EWS）1.1 存在身份验证绕过导致的权限提升漏洞。由于系统的 Architext.conf 认证文件以全局可读方式存储用户加密密码，本地用户可直接读取该文件获取密码密文，随后通过向 AT-generated.cgi 或 AT-admin.cgi 发送特制 HTTP 请求重放该加密密码，绕过正常身份验证流程获得更高权限。该漏洞影响 EWS 1.1 版本，CVSS 评分为 7.2。攻击需具备本地访问权限，且目标服务器上的 Architext.conf 文件权限配置不当（世界可读），攻击复杂度低，无需额外认证即可完成利用。"""
published = "1998-11-30T05:00:00Z"
remediation = "Excite for Web Servers (EWS) 1.1 因 Architext.conf 认证文件以全局可读方式存储加密密码，攻击者获取密码密文后重放即可获得管理员权限，同时密码加密未使用随机盐导致安全性极低。修复措施：若仍在使用该版本，应立即将 Architext.conf 文件权限改为仅限管理员用户可读（如 chmod 600），禁止全局可读或可写；修改 EWS 安装目录权限，确保仅 Web 服务器运行账户可访问；在 CGI 认证逻辑中增加会话令牌等二次校验机制，避免仅依赖加密密码进行身份验证；鉴于 EWS 1.1 为 1998 年发布的老旧产品且已停止维护，强烈建议迁移至受支持的现代 Web 服务器（如 Nginx、Apache HTTP Server 最新稳定版），并启用防火墙访问控制与最小权限原则。"
score = 7.2
severity = "HIGH"
sources = ["tenable"]
title = "Excite EWS 权限提升漏洞"
updated = "2026-06-16T21:49:39Z"

