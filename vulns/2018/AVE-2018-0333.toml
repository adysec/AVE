[basic]
description = "NUUO NVRmini 系列网络视频录像机（NVR）的 `upgrade_handle.php` 文件中存在 OS 命令注入漏洞。远程攻击者无需身份认证即可通过向 `writeuploaddir` 命令的 `uploaddir` 参数注入 shell 元字符（如分号、管道符等），在设备上以 root 权限执行任意系统命令，完全控制目标设备。该漏洞影响 NUUO NVRMini2 等型号，CVSS 评分 9.8，危害等级严重。攻击复杂度低，无需用户交互，已有公开的 Metasploit 利用模块。"
published = "2018-08-04T19:29:00.263"
remediation = "NUUO NVRmini 设备已停止支持（EOL），厂商不再提供安全更新。应立即停止使用该设备并将其替换为受支持的替代产品。若暂时无法替换，可通过防火墙限制对设备 Web 管理界面（默认端口 80/443）的访问，仅允许可信 IP 地址连接，并将设备部署在独立的管理 VLAN 中与生产网络隔离，以降低远程命令注入攻击风险。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "NUUO NVRMini2 命令注入漏洞"
updated = "2026-06-17T01:41:54.600"

