[basic]
description = "Adobe Flash Player 存在整数溢出漏洞（CWE-190），攻击者可通过构造恶意 Flash 内容在用户系统中触发整数溢出，进而实现任意代码执行。该漏洞影响 Windows、macOS 和 Linux 系统上的 Flash Player 18.0.0.324 之前版本、19.x 以及 20.0.0.267 之前的版本，同时波及 Adobe AIR 及 SDK/Compiler 20.0.0.233 之前的版本。攻击者需通过网络向目标发送恶意 SWF 或嵌入恶意 Flash 内容的网页，诱导用户通过浏览器访问，即可在无需身份认证的情况下实现远程代码执行，CVSS v3.1 评分为 8.8。CISA 已将本漏洞列入已知被利用漏洞目录，历史上曾被多起定向攻击和勒索软件组织利用，危害程度极高。"
published = "2015-12-28T23:59:19Z"
remediation = "立即升级 Adobe Flash Player 至 20.0.0.267 版本（Windows/OS X）或 11.2.202.559 版本（Linux）；升级 Adobe AIR/AIR SDK/Compiler 至 20.0.0.233 版本。因 Flash Player 已于 2020 年底停止支持，强烈建议彻底卸载 Flash Player 并迁移至 HTML5 替代方案；若暂时无法卸载，请在浏览器设置中禁用 Flash 插件或配置点击播放策略作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Adobe Flash Player和Adobe AIR整数溢出漏洞"
updated = "2026-06-17T00:34:57Z"

