[basic]
description = "Apple iTunes 10.7之前版本使用的WebKit渲染引擎存在内存破坏漏洞。远程攻击者可通过构造恶意网页诱导用户访问，触发WebKit在处理网页内容时发生内存损坏，进而执行任意代码或导致应用程序崩溃拒绝服务。该漏洞影响运行Apple iOS及macOS系统的设备，攻击者无需身份认证即可在目标系统上获得与当前用户相同的权限，CVSS评分6.8，危害等级为高危。"
published = "2012-09-13T10:30:19Z"
remediation = "立即将 Apple iTunes 升级至 10.7 或更高版本，iOS 设备升级至 6.0 或更高版本，并安装 Apple 2012 年 9 月安全更新（APPLE-SA-2012-09-12-1）。临时缓解措施包括避免在旧版 iTunes 或 Safari 中打开未知网站链接，禁用不必要的 WebKit 内容渲染，或通过防火墙限制对恶意网站的访问。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:34Z"

