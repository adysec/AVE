[basic]
description = 'W3Mail 1.0.2 版本的 sendmessage.cgi 及其他 CGI 程序存在命令注入漏洞。远程攻击者可在"撰写邮件"页面的任意输入字段中插入 shell 元字符（如分号、管道符、反引号等），未经身份验证即可在服务器端执行任意系统命令。该漏洞影响运行 W3Mail 1.0.2 及相关 CGI 程序的 Web 服务器，CVSS 评分为 7.5，危害等级高。攻击者无需预先获取账户凭据，只需通过浏览器或脚本向 CGI 接口发送包含恶意命令的请求即可利用此漏洞，成功利用可能导致服务器被完全控制、敏感信息泄露或作为跳机进一步攻击内网。'
published = "2001-10-07T04:00:00Z"
remediation = 'W3Mail 1.0.2 及更早版本存在 sendmessage.cgi 命令注入漏洞，攻击者可在"编写邮件"页面的任意字段中注入 shell 元字符执行任意系统命令。建议立即将 W3Mail 升级至厂商发布的安全补丁版本，或迁移至当前仍受维护的 Web 邮件客户端（如 SquirrelMail、Roundcube 等）。如暂时无法升级或替换，应在 Web 服务器层面禁用 W3Mail 的 CGI 执行权限，或通过 Web 应用防火墙（WAF）规则过滤 sendmessage.cgi 请求中的 shell 元字符（如分号、管道符、反引号等）作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "W3Mail W3Mail 远程代码执行漏洞"
updated = "2026-06-16T21:55:35Z"

