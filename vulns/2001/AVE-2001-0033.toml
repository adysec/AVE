[basic]
description = "Cisco Catalyst 4000/5000/6000 系列交换机的 SSH 服务存在协议不匹配拒绝服务漏洞。远程攻击者无需身份认证，只需通过非 SSH 客户端连接目标交换机的 SSH 端口（默认 22），即可触发协议协商错误，导致 SSH 服务进程崩溃或停止响应，造成拒绝服务。该漏洞影响运行 Cisco IOS 6.1 及之前版本的 Catalyst 系列交换机，攻击条件低，仅需网络可达即可实施。"
published = "2001-02-12T05:00:00Z"
remediation = "建议将 Cisco Catalyst 4000/5000/6000 系列交换机升级至 CatOS 6.2 或更高版本，该版本已修复 SSH 协议不匹配导致的设备重置问题。如无法立即升级，可在交换机 ACL 中限制 SSH 端口（TCP 22）的访问来源 IP，仅允许受信任的管理主机连接，防止非 SSH 客户端连接触发拒绝服务。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Cisco Catalyst 4000/Catalyst 5000/Catalyst 6000 SSH 协议不匹配拒绝服务漏洞"
updated = "2026-06-16T21:53:37Z"

