[basic]
description = "Apple Mac OS X 系统中的 QuickTime 组件在处理 PNG 文件时存在栈缓冲区溢出漏洞。远程攻击者可向目标用户发送特制的 PNG 图片文件，当用户使用 QuickTime 或受影响浏览器打开该恶意文件时，触发栈缓冲区溢出，导致任意代码执行或应用程序崩溃。该漏洞影响 QuickTime 7.7.2 之前版本及 Mac OS X 10.7.3 之前版本，无需用户交互即可远程利用，危害严重。Apple 已发布安全更新修复此漏洞。"
published = "2012-02-02T18:55:01Z"
remediation = "升级 QuickTime 至 7.7.2 或更高版本，并将 Mac OS X 更新至 10.7.3 或更高版本。如无法升级，建议在浏览器中禁用 QuickTime 插件，避免在未受信任的网站上打开 PNG 文件，并考虑使用第三方媒体播放器替代 QuickTime 处理多媒体内容。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Apple QuickTime PNG文件处理栈缓冲区溢出漏洞"
updated = "2026-06-16T23:33:19Z"

