[basic]
description = "Philip Chinery's Guestbook 1.1 的 guestbook.pl 存在跨站脚本（XSS）漏洞。远程攻击者可在留言簿的 Name、EMail、Homepage 等输入字段中注入恶意 JavaScript 或 HTML 代码，当管理员或其他用户查看留言时，注入的脚本将在浏览器中执行，导致敏感信息窃取、会话劫持或钓鱼攻击。该漏洞无需身份认证即可利用，攻击复杂度低，影响所有使用该版本的网站。目前已有公开的 ExploitDB 利用代码（ID: 21406）。"
published = "2002-08-12T04:00:00Z"
remediation = "该漏洞源于 Philip Chinery's Guestbook 1.1 的 guestbook.pl 脚本未对用户提交的 Name、EMail、Homepage 等字段进行 HTML 转义处理，导致攻击者可注入任意 JavaScript 或 HTML 代码。由于该软件已停止维护，建议立即在 guestbook.pl 中增加输入过滤：对 Name、EMail、Homepage、Text 字段使用 Perl 的 HTML::Entities 模块进行 encode_entities 转义，或使用正则替换 `<` 为 `&lt;`、`>` 为 `&gt;`。更彻底的方案是替换为仍受维护的留言板软件（如 Serendipity 或 WordPress 评论系统），并在 Web 服务器层面启用 Content-Security-Policy 响应头作为纵深防御。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Philip Chinery Guestbook 1.1 跨站脚本攻击漏洞"
updated = "2026-06-16T21:58:01Z"

