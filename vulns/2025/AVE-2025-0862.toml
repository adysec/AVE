[basic]
description = "Microsoft Edge（基于 Chromium）存在安全功能绕过漏洞，源于对 URL 重定向的验证不严（CWE-601）。本地攻击者可通过诱使用户点击特制链接，绕过 Edge 的安全功能限制，导致低程度的机密性、完整性和可用性受损。该漏洞影响 133.0.3065.69 之前版本的 Microsoft Edge，攻击复杂度较高且需要用户交互，CVSS 评分 4.5，危害等级中危。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-15T00:15:27Z"
remediation = "立即将 Microsoft Edge 升级至 133.0.3065.69 或更高版本，可通过浏览器内置更新（设置→关于 Microsoft Edge→检查更新）或从官网 https://www.microsoft.com/edge 下载安装。该漏洞为安全功能绕过，攻击者需本地交互触发，无法立即升级时建议禁用不必要的浏览器扩展并启用 Microsoft Defender SmartScreen 作为临时缓解措施。"
score = 4.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Edge（基于 Chromium）安全功能绕过漏洞"
updated = "2026-06-17T08:43:16Z"

