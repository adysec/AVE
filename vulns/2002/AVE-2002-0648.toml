[basic]
description = "cgiemail 1.6 的 cgicso.c 组件存在缓冲区溢出漏洞。远程攻击者可通过向运行 cgicso 脚本的服务器发送包含超长 query 参数的恶意构造 GET 请求，触发缓冲区溢出，从而造成服务拒绝（崩溃）并可能以邮件服务器权限执行任意系统命令。该漏洞利用前提是服务器允许对远程主机的查询。漏洞影响使用 cgiemail 1.6 的 Linux/Unix Web 服务器环境，CVSS v2 评分为 7.5（高危），攻击复杂度低，无需身份认证即可利用。攻击者可通过构造特制 HTTP 请求覆盖返回地址并植入 shellcode，进而在目标系统上获得远程命令执行能力。"
published = "2002-12-31T05:00:00.000"
remediation = "立即将服务器上的 cgiemail 1.6 从 Web 服务器中移除并停用，因为该软件存在未修复的缓冲区溢出漏洞且厂商未发布补丁。具体操作包括：通过 `rm` 命令删除 cgiemail 及其 cgicso 组件所在目录，同时在 Apache 或其他 Web 服务器配置中移除指向 cgiemail 的 ScriptAlias 或 AddHandler 指令并重启服务；如因业务需要暂时保留，应在 Web 服务器配置中对 cgi-bin 目录实施严格访问控制（如 IP 白名单限制），并对 cgicso.c 中处理 query 参数的 `sscanf` 或 `strcpy` 等函数增加输入长度校验，防止超长参数触发缓冲区溢出。长期方案是替换为维护状态活跃的表单邮件处理工具（如 formmail、NMS FormMail 或自行开发的后端脚本），并确保 Web 表单提交的数据在使用前均经过长度校验和过滤。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "cgiemail 1.6 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:59:43.593"

