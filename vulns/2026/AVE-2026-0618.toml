[basic]
description = "9Router 仪表盘登录速率限制器在 `src/lib/auth/loginLimiter.js` 中通过 `X-Forwarded-For` HTTP 请求头识别客户端身份，未验证该头部是否来自可信代理。远程攻击者可在每次登录尝试中伪造不同的 `X-Forwarded-For` 值，使服务端为每个请求分配新的速率限制桶，从而绕过 5 次尝试阈值和渐进式锁定机制，实现无限制的暴力破解攻击。若实例仍使用默认仪表盘密码，攻击者可成功登录获取管理员权限，访问配置的提供商凭证、API 密钥、修改认证设置并创建持久化访问令牌。该漏洞影响 9Router 0.4.80 之前版本，CVSS 评分 7.3，危害等级高。"
published = "2026-07-10T16:16:33Z"
remediation = "立即升级 9router 至 v0.4.80 或更高版本，该版本修复了登录限速器信任 X-Forwarded-For 头的问题。如无法立即升级，在反向代理层（如 Nginx）配置 `proxy_set_header X-Forwarded-For $remote_addr;` 覆盖不可信客户端传入的标头，或配置 `proxy_set_header X-Real-IP $remote_addr;` 并修改 9router 的 `getClientIp` 函数优先使用 `X-Real-IP` 而非 `X-Forwarded-For`。"
score = 7.3
severity = "HIGH"
sources = ["ghsa"]
title = "9router 登录暴力破解防护绕过漏洞"
updated = "2026-07-10T17:25:46Z"

