[info]
author = "ave"
description = "验证目标是否存在Mozilla Firefox/Thunderbird/SeaMonkey WebGL着色器缓冲区溢出漏洞。远程攻击者通过诱导用户访问包含超长着色器源代码块的恶意网页，可触发浏览器崩溃或远程任意代码执行。"
id = "POC-AVE-2011-0164"
name = "CVE-2011-2988 PoC"
severity = "critical"
tags = ["ave-2011-0164"]
vuln_id = [
    "CVE-2011-2988",
    "AVE-2011-0164",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/test-cve-2011-2988.html"
