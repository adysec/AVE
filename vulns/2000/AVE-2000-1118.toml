[basic]
description = "PostMaster 1.0 是运行在 BeOS r5 pro 及更早版本上的邮件处理软件，存在输入验证不充分的漏洞。未经身份认证的远程攻击者可通过向目标系统发送包含超长 URL 的邮件消息来触发该漏洞，导致软件在处理过程中消耗过多资源或发生异常，从而造成拒绝服务。该漏洞影响 BeOS r5 pro 及更早版本上运行的 PostMaster 1.0 邮件服务器，攻击者无需任何凭据即可从远程发起攻击，利用门槛低。CVSS 评分为 5.0，危害等级为中危。"
published = "2001-01-09T05:00:00Z"
remediation = "该软件厂商已停止维护且 BeOS 系统已停止支持，无官方补丁。建议立即将 PostMaster 替换为当前受支持的新版邮件服务器（如 Postfix、Exim 或 Sendmail），并在邮件网关处部署 URL 长度过滤规则及消息尺寸限制，以阻止超长 URL 请求作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "BeOS Postmaster URL 拒绝服务漏洞"
updated = "2026-06-16T21:53:16Z"

