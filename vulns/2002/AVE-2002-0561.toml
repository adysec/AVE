[basic]
description = "Linksys BEFSR41 EtherFast Cable/DSL 路由器在固件版本 1.42.7 之前的远程管理 Web 服务器中存在拒绝服务漏洞。未经身份认证的远程攻击者可通过向 Gozila.cgi 发送不带任何参数的 HTTP 请求，触发该 CGI 程序处理异常，导致路由器崩溃重启。该漏洞影响 BEFSR41 1.40.2/1.41/1.42.3/1.42.7 等版本，CVSS 评分 5.0，危害等级中危。攻击无需认证，仅需网络可达即可实施，利用方式简单。"
published = "2002-11-12T05:00:00.000"
remediation = "将 Linksys BEFSR41 路由器固件升级至 1.42.7 或更高版本。如无法升级，请在路由器管理界面中禁用远程管理功能（Remote Management），或将管理端口限制为仅内网 IP 访问，并配置防火墙规则阻止外部对路由器管理端口（默认 80/8080）的访问。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Linksys BEFSR41 路由器 Gozila.cgi 拒绝服务漏洞"
updated = "2026-06-16T21:58:59.197"

