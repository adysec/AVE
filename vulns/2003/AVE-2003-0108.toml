[basic]
description = "Linux内核2.2.x和2.4.x版本的/proc文件系统存在本地信息泄漏漏洞。当本地用户在执行setuid程序之前预先打开/proc/self目录下的environ、cmdline等文件条目并持有其文件描述符时，由于内核在setuid程序执行后无法修改已打开文件条目的所有权和权限，导致攻击者仍可继续读取这些文件内容。通过此方法，本地低权限用户能够获取setuid程序运行时的环境变量、命令行参数等敏感信息，进而可能导致路径信息或其他机密数据泄露。该漏洞利用方式简单，攻击者仅需具备本地登录权限即可实施，无需额外认证。"
published = "2003-08-07T04:00:00Z"
remediation = "建议将 Linux 内核升级至已修复版本：Ubuntu 用户升级至内核 2.4.27-12 或更高版本（通过 apt update && apt upgrade linux-image 安装）；Red Hat 用户应用 RHSA-2003-198、RHSA-2003-238、RHSA-2003-239 安全补丁（yum update kernel）；Debian 用户参照 DSA-423 升级 kernel-source-2.4.27。如短期内无法立即升级，可临时通过设置 /proc 挂载选项 noexec,nosuid,nodev 限制对 /proc/self 的访问，或部署系统调用过滤规则（如 seccomp、SELinux/AppArmor 策略）阻止非特权用户在 setuid 程序执行期间访问 /proc/self 敏感条目，以降低信息泄漏风险。升级后需重启系统以加载新内核，并验证运行 uname -r 确认版本号符合修复要求。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Linux Kernel 2.2.x/2.4.x /proc 文件系统本地信息泄露漏洞"
updated = "2026-06-16T22:02:19Z"

