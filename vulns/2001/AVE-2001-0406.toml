[basic]
description = "tags.<value>Linux 内核 2.2.1 至 2.2.19 及 2.4.1 至 2.4.10 版本中存在深度嵌套符号链接拒绝服务漏洞。内核在遍历或访问文件系统路径时需递归解析每一层符号链接，当攻击者在文件系统中创建大量深度嵌套的符号链接链时，内核会消耗大量 CPU 时间进行路径解析，导致系统响应严重迟缓甚至完全卡死。该漏洞仅允许本地用户利用，攻击条件为攻击者须在目标系统上拥有普通用户权限。攻击者可通过创建极端深度的符号链接树，诱使系统进程（如文件管理器、备份任务或 shell）在访问路径时触发内核长时间阻塞，从而造成拒绝服务。"
published = "2001-10-18T04:00:00Z"
remediation = "立即升级 Linux Kernel：2.2.x 系列升级至 2.2.20 或更高版本，2.4.x 系列升级至 2.4.12 或更高版本，以完全修复深层符号链接拒绝服务漏洞。如暂无法升级，2.2.19 系统可应用官方补丁 linux-2.2.19-deep-symlink.patch，该补丁通过限制单次符号链接递归跟随次数至 5 次、并在内核查找路径时增加调度点来防止调度器被长时间阻塞。临时缓解措施包括在防火墙或安全模块中限制本地用户对敏感目录的符号链接创建权限，或通过文件系统挂载选项禁止用户目录下的深层链接访问。"
score = 2.1
severity = "LOW"
sources = ["exploitdb"]
title = "Linux Kernel 2.2/2.4 深度嵌套符号链接拒绝服务漏洞"
updated = "2026-06-16T21:55:12Z"

