[basic]
description = "标签之间。<value>Adobe Flash Player 和 Adobe AIR 存在栈缓冲区溢出漏洞。Adobe Flash Player 9.0.246.0 及更早版本、10.x 10.0.32.18 及更早版本以及 Adobe AIR 1.5.2 及更早版本均受此漏洞影响。未经身份认证的远程攻击者可通过构造特制的 Flash 内容或 SWF 文件触发该漏洞，导致应用程序崩溃或远程执行任意代码。该漏洞攻击复杂度中等，CVSS 评分为 9.3，危害等级严重。Adobe 已发布安全更新修复此漏洞。"
published = "2009-07-31T19:30:00Z"
remediation = "标签之间。<value>立即升级 Adobe Flash Player 至 9.0.246.0 或 10.0.32.18 版本，升级 Adobe AIR 至 1.5.2 版本。如暂无法立即升级补丁，可在浏览器设置中禁用 Flash 内容运行，或配置浏览器安全级别为高以限制不受信任 SWF 文件的自动执行，同时避免访问未知来源的网页链接。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 和 Adobe AIR 堆栈缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T23:08:14Z"

