[basic]
description = 'FreeBSD 4.1.1 及更早版本中的 ppp 工具未能正确遵循 "nat deny_incoming" 命令配置的访问限制规则，导致远程攻击者无需任何身份认证即可通过网络绕过 NAT 防护策略，直接连接目标系统。该漏洞允许攻击者访问本应被拒绝的内部网络服务，造成信息泄露、数据篡改或服务中断等后果。攻击者只需能够向目标发送网络数据包即可触发，利用门槛极低。'
published = "2001-01-09T05:00:00Z"
remediation = "升级 FreeBSD 至 4.1.1-STABLE 或 3.5.1-STABLE 及以上版本（2000-10-30 之后）；或下载官方补丁（FreeBSD-SA-00:70）对 /usr/src/usr.sbin/ppp/nat_cmd.c 应用补丁后重新编译安装 ppp。临时缓解措施：在 PPP 网关上使用 ipfw(8) 或 ipf(8) 等真实包过滤器替代 ppp 内置的 deny_incoming 功能，按安全策略明确拒绝入站流量。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "FreeBSD ppp 工具访问控制绕过漏洞"
updated = "2026-06-16T21:53:18Z"

