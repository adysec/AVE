[basic]
description = "ATEN Unizon 的 updateWar 方法中存在加密签名验证实现不当的漏洞（CWE-347）。由于该函数未能正确验证更新包的数字签名，攻击者可在通过身份认证后，利用特制更新包在受影响系统上以 SYSTEM 权限执行任意代码。该漏洞影响 ATEN Unizon 的受影响安装版本，攻击者需具备有效账户凭据才能触发利用，一旦成功将完全控制目标系统。ATEN 已通过安全更新修复此问题。"
published = "2026-06-24T22:16:50Z"
remediation = "建议将 ATEN Unizon 固件升级至修复版本 FW V2.7.264.001 或更高版本，该版本修复了 updateWar 方法中加密签名验证不当的问题。升级前请确认当前固件版本低于 V2.7.264.001，升级后重启服务并验证运行版本。如短期内无法完成升级，应通过防火墙或访问控制列表限制对 rest/system/information 端点的访问，仅允许受信任的管理 IP 发起更新请求，以降低被高权限攻击者利用的风险。"
score = 7.2
severity = "HIGH"
sources = ["zdi"]
title = "ATEN Unizon 加密签名验证不当远程代码执行漏洞"
updated = "2026-06-27T19:02:07Z"

