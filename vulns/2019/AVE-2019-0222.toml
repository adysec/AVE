[basic]
description = "Atlassian Crowd 和 Crowd Data Center 在发布版本中错误地启用了 pdkinstall 开发插件。未经身份验证的远程攻击者可通过向目标实例发送特制的请求，利用该插件上传并安装任意恶意插件，从而在运行受影响版本的服务器上实现远程代码执行（RCE）。该漏洞影响 Crowd 2.1.0 至 3.0.5 之前、3.1.0 至 3.1.6 之前、3.2.0 至 3.2.8 之前、3.3.0 至 3.3.5 之前以及 3.4.0 至 3.4.4 之前的所有版本。"
published = "2019-06-03T14:29:00Z"
remediation = "建议将 Atlassian Crowd 或 Crowd Data Center 升级至以下修复版本：3.0.5、3.1.6、3.2.8、3.3.5 或 3.4.4。升级后将禁用在发布版本中被错误开启的 pdkinstall 开发插件，从而消除远程代码执行风险。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Atlassian Crowd 及 Crowd Data Center 插件上传远程代码执行漏洞"
updated = "2026-06-17T02:13:11Z"

