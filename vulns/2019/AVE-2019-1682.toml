[basic]
description = 'ThinkPHP 3.2.4 及之前版本存在远程命令执行漏洞，主要影响使用该框架开发的 Open Source BMS v1.1.1 等应用。漏洞原理在于 ThinkPHP 框架的路由机制允许攻击者通过构造特殊的 URL（`public//?s=index/\think\app/invokefunction&function=call_user_func_array&vars[0]=system&vars[1][]=`）直接调用框架内部的 `call_user_func_array` 函数，进而执行任意系统命令。由于漏洞利用无需身份认证，攻击条件仅为目标系统运行受影响版本的 ThinkPHP 且可通过网络访问。攻击者可利用此漏洞获取服务器权限，造成严重的信息泄露、数据篡改及服务中断等危害。该漏洞 CVSS v3.1 评分为 8.8，属于高危级别，影响的 CWE 类型包括代码注入（CWE-94）和认证绕过（CWE-306）。'
published = "2019-02-24T18:29:00Z"
remediation = '建议将 ThinkPHP 框架升级至 3.2.4 或更高版本。若无法立即升级，可通过在 WAF 防火墙中拦截包含 "invokefunction" 及 "call_user_func_array" 关键字的 HTTP 请求作为临时缓解措施。'
score = 8.8
severity = "HIGH"
sources = ["nuclei"]
title = "ThinkPHP 远程代码执行漏洞"
updated = "2026-06-17T02:43:02Z"

