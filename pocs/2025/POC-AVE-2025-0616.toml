[info]
author = "ave"
description = "验证PHP HTTP Streams包装器是否接受缺少冒号分隔符的非法响应头，攻击者可通过中间人或恶意后端返回畸形HTTP头使PHP应用接受非法头"
id = "POC-AVE-2025-0616"
name = "CVE-2025-1734 PoC"
severity = "medium"
tags = ["ave-2025-0616"]
vuln_id = [
    "CVE-2025-1734",
    "AVE-2025-0616",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.php"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["malformed_header_accepted"]
