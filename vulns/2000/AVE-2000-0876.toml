[basic]
description = "go-gnome Helix GNOME 预安装器存在不安全临时文件处理漏洞，本地攻击者可通过在 /tmp 目录中创建符号链接（symlink）指向目标文件，诱使预安装器在处理 uudecode、snarf 等临时文件时覆盖任意系统文件。该漏洞影响 go-gnome 预安装器相关版本，需本地登录权限，可导致敏感文件被篡改或系统破坏。"
published = "2000-10-20T04:00:00Z"
remediation = "建议立即卸载或升级 go-gnome/Helix GNOME 至使用安全临时文件创建的版本（如采用 mktemp 而非固定路径）。如仍需使用该软件，确保 /tmp 目录以 sticky bit 权限挂载（chmod 1777 /tmp），并为受影响用户启用严格的 umask 设置。由于该漏洞年代久远，最彻底的方案是移除 go-gnome 预安装器，改用其他 GNOME 预安装工具。"
score = 6.2
severity = "MEDIUM"
sources = ["avd"]
title = "Helix GNOME Pre-Installer 任意文件写入漏洞"
updated = "2026-06-16T21:52:20Z"

