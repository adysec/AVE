[basic]
description = "Ethereal 0.9.7 及更早版本中的 BGP 协议解析模块存在多处整数有符号性错误，远程攻击者可通过向监听网络的 Ethereal 分析工具发送精心构造的畸形 BGP（边界网关协议）消息触发拒绝服务攻击，导致目标系统进入无限循环状态，使 Ethereal 进程挂起或崩溃，从而中断网络监流和分析服务。该漏洞利用无需身份认证，攻击复杂度低，仅需网络访问权限即可被远程触发，影响范围包括所有使用受影响版本 Ethereal 软件的网络管理和安全监控场景。"
published = "2002-12-23T05:00:00Z"
remediation = "建议升级至 Ethereal 0.9.8 或更高版本（现已更名为 Wireshark），可从官网 https://www.wireshark.org/download.html 下载最新稳定版。若暂时无法升级，可在网络边界配置防火墙规则过滤异常 BGP 流量，或暂停使用 Ethereal 进行 BGP 报文分析作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Ethereal 0.9.7 BGP 协议解析器拒绝服务漏洞"
updated = "2026-06-16T21:59:09Z"

