[basic]
description = "Voyant Sonata 3.x 中的 setuid 程序 doroot 存在本地权限提升漏洞。该程序以 set-user-id(setuid) 权限运行，但在执行用户提供的命令行参数时缺乏严格的权限校验与安全校验，导致普通本地用户能够滥用该程序将任意命令以参数形式传入运行，从而以 root 权限执行任意命令，实现从普通用户到系统最高权限的权限提升。攻击者只需具备系统本地账户且可交互执行该程序即可触发，无需其他认证条件。该漏洞影响范围较大，一旦成功利用，攻击者可完全控制受影响的主机系统，造成机密性、完整性与可用性的全面丧失。根据 CVSS 评分 7.2（向量 AV:L/AC:L/Au:N/C:C/I:C/A:C），该漏洞被评定为高危级别。官方建议限制 doroot 程序的执行权限或将其移除，并尽早升级到修复了该问题的版本。"
published = "2001-03-26T05:00:00.000"
remediation = "立即升级到厂商提供的修复版本，或直接删除/移除以 root 权限运行的 setuid `doroot` 程序并撤销其 SUID 位（执行 `chmod u-s /usr/bin/doroot`），切断本地用户以 root 执行任意命令的提权通道。在无法立即修复时，应限制本地非授权用户对受影响主机的登录访问，并审查 `doroot` 的可执行权限与归属，确保仅有受信管理员可调用；同时审计系统日志中是否已有利用该程序的提权痕迹。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Voyant Sonata setuid doroot程序本地权限提升漏洞"
updated = "2026-06-16T21:53:49.003"

