[basic]
description = "Technote 2000/2001 的 print.cgi 脚本存在目录遍历漏洞，远程攻击者无需身份认证即可通过向 board 参数传递 `../` 等路径穿越序列，绕过路径限制读取服务器上的任意文件。该漏洞可导致敏感信息泄露，如配置文件、密码文件等。攻击条件简单，仅需目标系统运行 Technote 且 print.cgi 可访问，利用难度低。"
published = "2001-02-12T05:00:00.000"
remediation = '立即删除或禁用 Technote 软件包中的 print.cgi 脚本，或限制其仅允许授权用户访问。如仍需使用，在 print.cgi 中对 board 参数做严格的路径合法性校验，拒绝包含 "../" 或空字节 "%00" 的输入，并将可访问目录限定在预设的 boards 目录内。由于 Technote 产品已停止维护，建议迁移至其他仍在维护的论坛/留言板系统。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Technote print.cgi 目录遍历漏洞"
updated = "2026-06-16T21:53:36.450"

