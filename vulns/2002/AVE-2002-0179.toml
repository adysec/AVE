[basic]
description = "Netscape 6.1 及 Mozilla 0.9.7 浏览器中的 XMLHttpRequest 对象存在任意文件读取漏洞。远程攻击者可通过构造恶意网页，利用 XMLHTTP 对象发起重定向至客户端本地文件系统的 URL，再通过 responseText 属性读取返回结果，从而窃取目标系统上的任意文件内容及目录列表。该漏洞无需用户交互即可触发，攻击者仅需诱导用户访问恶意页面即可实施攻击，严重威胁用户隐私数据安全。"
published = "2002-06-25T04:00:00Z"
remediation = "该漏洞影响已停止支持的 Netscape 6.x 和 Mozilla 0.9.x 浏览器，厂商未发布官方补丁。建议立即停止使用上述已停止支持的浏览器版本，升级至 Mozilla Firefox（最新稳定版）或其它现代浏览器。如无法升级，可在浏览器中禁用 JavaScript 和 XMLHttpRequest 功能作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Netscape Mozilla XMLHttpRequest 任意文件读取漏洞"
updated = "2026-06-16T21:57:16Z"

