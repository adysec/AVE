[basic]
description = "Internet Explorer 5.5及更早版本存在跨域信息泄露漏洞，由于浏览器未能正确验证窗口内框架的域归属，远程攻击者可利用MSScriptControl.ScriptControl和GetObject方法，将本地域框架中的敏感信息发送到不同域的框架中，从而绕过同源策略读取客户端本地文件。该漏洞影响运行IE 5.5及更早版本的Windows系统用户，攻击者只需构建恶意网页并诱导用户访问即可触发，无需额外用户交互即可实现跨域数据窃取。"
published = "2001-06-27T04:00:00Z"
remediation = "立即将 Internet Explorer 升级至 6.0 SP1 或更高版本。若暂无法升级，应在 Internet 选项的安全区域中设置禁用 ActiveX 控件及插件，同时禁用 MSScriptControl.ScriptControl 和 GetObject 相关组件运行，并限制脚本对本地文件的访问权限。建议长期迁移至 Microsoft Edge 或其他现代浏览器以彻底消除风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Internet Explorer 跨域信息泄露漏洞"
updated = "2026-06-16T21:54:06Z"

