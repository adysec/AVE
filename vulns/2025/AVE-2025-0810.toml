[basic]
description = "Windows 远程桌面配置服务存在身份验证不当漏洞（CWE-287），攻击者可通过诱导已登录用户访问恶意构造的远程桌面服务器，在用户交互条件下利用该漏洞篡改远程桌面配置服务。成功利用此漏洞可导致目标系统的机密性和完整性受到高等级破坏，但攻击复杂度较高且需要用户交互。Microsoft 已在 2025 年 2 月安全更新（5051974）中修复此漏洞，影响 Windows 10/11 及 Windows Server 多个版本。"
published = "2025-02-11T18:15:33.697"
remediation = "建议立即安装 Microsoft 2025 年 2 月安全更新 (KB5051974)。各受影响版本的最低修复版本号：Windows 10 1507 升级到 10.0.10240.20915，Windows 10 1607 升级到 10.0.14393.7785，Windows 10 1809/Server 2019 升级到 10.0.17763.6893，Windows 10 21H2 升级到 10.0.19044.5487，Windows 10 22H2 升级到 10.0.19045.5487，Windows 11 22H2 升级到 10.0.22621.4890，Windows 11 23H2 升级到 10.0.22631.4890，Windows 11 24H2/Server 2025 升级到 10.0.26100.3194，Server 2022 升级到 10.0.20348.3207，Server 2022 23H2 升级到 10.0.25398.1425。如无法立即打补丁，可通过组策略限制非管理员用户对远程桌面配置服务 (Termsrv.dll) 的访问权限作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 远程桌面配置服务篡改漏洞"
updated = "2026-06-17T08:43:09.987"

