[basic]
description = "IBM WebSphere 等产品中的序列化对象接口因使用 Apache Commons Collections 库的 InvokerTransformer 类存在 Java 反序列化漏洞（CWE-502）。未经身份认证的远程攻击者可通过向目标系统发送特制的序列化 Java 对象，利用该缺陷在服务器端执行任意命令，最终实现远程代码执行。该漏洞影响 IBM 多款分析、商业解决方案、认知、IT 基础设施及移动和社交产品，攻击条件为攻击者能够访问 WebSphere 服务的相关接口并发送恶意序列化数据。"
published = "2016-01-02T21:59:15.800"
remediation = "升级到 IBM WebSphere Application Server 8.5.5.8 或更高版本（传统部署），或 Liberty 17.0.0.4 修复包（8.5.5.0–8.5.5.9）。若无法立即升级，可应用 Interim Fix PI52103 作为临时缓解。删除 ${wlp.install.dir}/dev/tools/containers 目录下 com.ibm.ws.ejb.embeddableContainer_nls_8.5.0.jar 和 com.ibm.ws.jpa.thinclient_8.5.0.jar 这两个存在反序列化风险的 Apache Commons Collections jar 包，从 Liberty Fix Pack 17.0.0.4 或更新版本重新安装修复后的 jar。确认环境中未使用 jsf-2.0、jsf-2.2、jpa-2.0 这三个可选功能以降低暴露面。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "IBM WebSphere 反序列化远程代码执行漏洞"
updated = "2026-06-17T00:32:33.670"

