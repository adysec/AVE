[basic]
description = "Apple iOS 存在释放后使用内存安全漏洞，由于内存管理机制存在缺陷，攻击者可通过构造特制的恶意 Web 内容诱导用户使用 Safari 浏览器访问，在目标设备上触发内存越界访问，从而实现任意代码执行。该漏洞影响 iPhone、iPad 及 iPod touch 等运行 iOS 12.5.4 以下版本的设备，攻击者无需预先获取设备权限即可在用户浏览恶意网页时完成攻击。Apple 已在 iOS 12.5.4 安全更新中修复此漏洞，并注意到该漏洞可能已被积极利用。"
published = "2021-09-08T14:15:10Z"
remediation = "立即将受影响的 iPhone 或 iPad 升级至 iOS 12.5.4 或更高版本，以修复 WebKit 释放后使用漏洞。受影响设备包括 iPhone 5s、iPhone 6/6 Plus、iPad Air、iPad mini 2/3 及 iPod touch（第 6 代）。如暂无法升级，请避免使用 Safari 打开未知来源的网页内容，并可通过配置描述文件限制 WebKit 渲染进程的权限作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Apple iPhone OS WebKit 释放后使用远程代码执行漏洞"
updated = "2026-06-17T03:50:50Z"

