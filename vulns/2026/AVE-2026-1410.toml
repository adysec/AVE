[basic]
description = "Electron 框架存在沙箱限制绕过漏洞。在 39.8.10、41.10.3 和 42.0.1 版本之前，未设置 allow-popups 关键字的沙箱 iframe 仍可通过 OpenURL 导航路径打开新窗口或触发 setWindowOpenHandler，且无需任何用户交互，从而绕过沙箱弹出窗口限制。该漏洞影响在沙箱 iframe 中嵌入不可信内容并依赖 allow-popups 缺失来阻止窗口创建的应用程序，未经身份认证的远程攻击者可利用此漏洞在无需用户交互的情况下绕过沙箱保护，CVSS 评分 7.2。"
published = "2026-08-05T18:17:15Z"
remediation = "升级 Electron 到修复版本 39.8.10、41.10.3 或 42.0.1（取决于当前使用的分支）。如暂无法立即升级，应在应用的 setWindowOpenHandler 中对不信任的内容返回 { action: 'deny' }，禁止通过 OpenURL 导航路径创建新窗口，并审查所有嵌入沙箱 iframe 的页面，移除或限制不受信任内容的加载。"
score = 7.2
severity = "HIGH"
sources = ["ghsa"]
title = "Electron iframe 沙箱弹出窗口限制绕过漏洞"
updated = "2026-08-05T19:17:40Z"

