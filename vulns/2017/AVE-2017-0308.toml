[basic]
description = "JBoss Application Server 5.x/6.x 中 HTTP Invoker 组件的 ReadOnlyAccessFilter 类的 doFilter 方法在反序列化操作时未对类进行限制，允许未经身份认证的远程攻击者通过向目标服务器的 HTTP 端口发送特制的序列化数据触发反序列化漏洞，进而实现远程代码执行。该漏洞影响 Red Hat Enterprise Application Platform 5.2 及多个 JBoss 版本，CVSS 评分 9.8，危害等级严重。攻击无需任何权限和用户交互，利用门槛极低，已被广泛用于挖矿木马和勒索软件传播。"
published = "2017-10-04T21:01:00Z"
remediation = "升级 JBoss 至 5.2.0 及以上安全补丁版本，或迁移至 WildFly 以彻底修复反序列化缺陷。临时缓解措施：在反向代理或防火墙上限制对 /invoker/readonly 路径的外部访问，仅允许可信 IP 调用 HTTP Invoker 服务。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Red Hat JBoss Application Server 反序列化远程代码执行漏洞"
updated = "2026-06-17T01:02:46Z"

