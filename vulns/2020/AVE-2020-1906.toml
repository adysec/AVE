[basic]
description = "Pulse Connect Secure 在 9.1R9 及之前版本的管理 Web 界面中存在不安全的 gzip 解压漏洞。已通过身份验证的攻击者可利用该漏洞上传包含恶意文件的特制 gzip 压缩包，在服务器上进行未受控的归档文件解压操作，从而实现任意代码执行。该漏洞影响使用受影响版本 Pulse Connect Secure 的远程接入设备，攻击者需要具备有效账户权限才能触发。成功利用后可完全控制设备，导致敏感数据泄露、横向移动及内网渗透。Pulse Secure 官方已在 9.1R9 版本中修复此问题，建议用户尽快升级至安全版本。"
published = "2020-10-28T13:15:13.027"
remediation = "将 Pulse Connect Secure 升级到 9.1R9 或更高版本以修复该漏洞，升级前请先保存系统配置并导出用户配置。升级完成后执行工厂重置（Factory Reset），重新导入配置并重置所有账户密码（包括管理员、服务和用户账户）。同时部署 Pulse Connect Secure Integrity Tool（KB44755）进行文件系统完整性校验，若发现哈希不匹配须立即隔离设备并上报事件。如暂无法升级，可通过导入厂商提供的 XML 配置文件（SA44784）作为临时缓解措施，限制管理员 Web 界面的访问权限。"
score = 7.2
severity = "HIGH"
sources = ["kev"]
title = "Pulse Secure Pulse Connect Secure 未受控gzip解压远程代码执行漏洞"
updated = "2026-06-17T03:26:09.063"

