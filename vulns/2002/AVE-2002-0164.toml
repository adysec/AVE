[basic]
description = "Webalizer 2.01-06 版本在配置使用反向 DNS 查询时存在缓冲区溢出漏洞。远程攻击者可通过向被监控的 Web 服务器发起连接，使用解析为超长主机名的 IP 地址触发缓冲区溢出，导致任意代码执行。该漏洞影响 Webalizer 2.01-06 版本，CVSS 评分 7.5，危害等级高。攻击者无需身份认证即可远程利用，可完全控制受影响系统。"
published = "2002-04-22T04:00:00Z"
remediation = '升级 Webalizer 到 2.01-09 或更高版本，该版本修复了反向 DNS 查询中的缓冲区溢出漏洞。若暂时无法升级，可在 Webalizer 配置文件 (webalizer.conf) 中将 DNSCache 设为 "no" 或设置 UseDNS 为 "no" 以禁用反向 DNS 解析功能，从而消除攻击面。建议同时升级到 2.01-09 后再重新启用 DNS 功能，以获得正确的日志分析结果。'
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Webalizer 2.01-06 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:56:57Z"

