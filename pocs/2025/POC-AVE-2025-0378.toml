[info]
author = "AVE"
description = "通过构造恶意的 WebAssembly GC 模块，利用 Turboshaft WasmGCTypeAnalyzer 对单块循环的类型分析缺陷触发类型混淆，构建 addrOf/fakeObj 原语，验证 Chrome V8 引擎类型混淆漏洞的存在性"
id = "POC-AVE-2025-0378"
name = "Google Chrome V8 Turboshaft WasmGCTypeAnalyzer 类型混淆漏洞 PoC"
severity = "high"
tags = [
    "cve-2025-0291",
    "v8",
    "chrome",
    "type-confusion",
    "wasm-gc",
]
vuln_id = [
    "CVE-2025-0291",
    "AVE-2025-0378",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Successfully achieved memory corruption"]
