[basic]
description = "Linuxconf 1.1.x/1.2.x 存在缓冲区溢出漏洞，在生成错误字符串时未对 LINUXCONF_LANG 环境变量的长度进行有效检查。未经身份认证的本地攻击者可利用该漏洞，通过设置超长的 LINUXCONF_LANG 环境变量触发缓冲区溢出，从而在目标系统上执行任意代码。该漏洞影响 Linuxconf 1.28r4 之前的所有版本，CVSS 评分为 7.2，危害等级为高危。攻击条件为攻击者需具备目标系统的本地用户权限，利用方式简单，只需构造包含超长语言环境变量值的请求即可触发溢出并执行任意代码。"
published = "2003-04-02T05:00:00.000"
remediation = "立即将 Linuxconf 升级至 1.28r4 或更高版本，该版本已修复 LINUXCONF_LANG 环境变量缓冲区溢出问题。升级命令：`apt-get update && apt-get install linuxconf`（Debian/Ubuntu）或 `yum update linuxconf`（RHEL/CentOS）。若无法立即升级，可临时将 LINUXCONF_LANG 环境变量限制为短字符串（如 `export LINUXCONF_LANG=C`），并移除 linuxconf 的 setuid root 权限（`chmod u-s /usr/sbin/linuxconf`）以降低被本地用户利用的风险。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Linuxconf 缓冲区溢出漏洞"
updated = "2026-06-16T21:59:27.333"

