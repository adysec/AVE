[basic]
description = "Broadcom BCM4325 和 BCM4329 Wi-Fi 芯片在处理 RSN 802.11i 信息元素时存在越界读取漏洞，由于对输入验证不充分（CWE-20），远程攻击者可通过向目标设备发送特制的 802.11i 管理帧触发该漏洞，导致设备 Wi-Fi 功能崩溃或中断，造成拒绝服务。该漏洞影响 Acer、Apple、Asus、HTC、LG、Motorola、Nokia、Samsung、Sony 等多个品牌的移动设备，CVSS 评分 7.8，危害等级高。厂商已发布固件更新修复此漏洞。"
published = "2012-11-14T12:30:58.740"
remediation = "升级 Apple iOS 至 6.1 或更高版本（适用于 iPhone 3GS、iPhone 4、iPod touch 第 4 代、iPad 2），该版本已修复 Broadcom BCM4325/BCM4329 Wi-Fi 芯片对 802.11i 信息元素的输入验证缺陷。如无法立即升级，可在 Wi-Fi 网络层面禁用 RSN IE 广播或使用 WPA2-AES 加密作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["tenable"]
title = "Broadcom BCM4325/BCM4329 Wi-Fi芯片802.11i信息元素输入验证漏洞"
updated = "2026-06-16T23:41:46.007"

