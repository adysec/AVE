[basic]
description = "Imatix Xitami 2.5b4 和 2.5b5 版本的 Errors.gsl 模板存在跨站脚本（XSS）漏洞。未经身份验证的远程攻击者可通过构造特制的 HTTP GET 请求，在 IMG 标签的 SRC 属性中嵌入 JavaScript onerror 事件，或通过 User-Agent 字段注入任意 Web 脚本或 HTML 代码。当用户访问包含恶意内容的页面时，脚本会在其浏览器中执行，可能导致会话劫持、敏感信息窃取或页面篡改。该漏洞影响所有基于 Imatix Xitami 2.5b4/2.5b5 的 Web 服务器部署，攻击条件较为宽松，无需认证即可利用。"
published = "2002-12-31T05:00:00Z"
remediation = """由于 Imatix Xitami 2.5b4/2.5b5 已停止维护且无官方补丁，建议立即迁移至主流 Web 服务器（如 Nginx 1.26+、Apache 2.4.58+ 或 Caddy 2.8+）以彻底消除风险。如短期内无法替换，可采取以下临时缓解措施：1) 在防火墙或反向代理层配置 WAF 规则，过滤 HTTP 请求中 User-Agent 字段包含 script、onerror、onload 等关键词的恶意请求；2) 禁用或替换 Errors.gsl 模板，使用静态 HTML 错误页面替代 GSL 动态模板；3) 对错误页面输出内容实施 HTML 实体编码，将 <、>、"、' 等字符转义为对应实体，防止浏览器执行注入脚本；4) 限制 Web 服务器仅接受必要来源 IP 的访问，减少暴露面。"""
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Imatix Xitami Errors.gsl 跨站脚本攻击漏洞"
updated = "2026-06-16T22:00:23Z"

