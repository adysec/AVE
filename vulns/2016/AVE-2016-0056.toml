[basic]
description = "WordPress 插件 Frontend File Manager（版本 < 4.0）和 N-Media Post Front-end Form（版本 < 1.1）存在任意文件上传漏洞。这两个插件通过 `nm_filemanager_upload_file` 和 `nm_postfront_upload_file` AJAX 操作处理文件上传时，未对上传文件的类型进行有效验证，导致未经身份认证的远程攻击者可直接向目标服务器上传任意文件（如 WebShell），进而实现远程代码执行。该漏洞影响大量使用上述插件的 WordPress 站点，CVSS 评分 9.8，危害等级严重。目前官方已发布修复版本，建议用户立即升级。"
published = "2024-10-16T08:15:02Z"
remediation = "立即将 Frontend File Manager 插件升级至 4.0 或更高版本，将 N-Media Post Front-end Form 插件升级至 1.1 或更高版本。同时，在 WordPress 后台禁用 `nm_filemanager_upload_file` 和 `nm_postfront_upload_file` AJAX 动作的未认证访问，或通过 Web 应用防火墙（WAF）规则拦截上传接口中非图片类型的文件请求作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress Frontend File Manager 和 N-Media Post Front-end Form 插件任意文件上传漏洞"
updated = "2026-06-17T00:41:03Z"

