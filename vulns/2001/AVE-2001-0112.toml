[basic]
description = "ISC INN 的 innfeed 组件存在缓冲区溢出漏洞，版本低于 2.3.0 受影响。属于 news 组的本地用户可通过向 innfeed 传递超长的 -c 命令行参数触发缓冲区溢出，从而获取提升的权限。该漏洞源于程序未对命令行参数长度进行充分校验，攻击者需具备本地 news 组访问权限方可利用，CVSS 评分 4.6，危害等级中危。"
published = "2001-04-21T04:00:00Z"
remediation = "升级 ISC INN 到 2.3.0 或更高版本以修复缓冲区溢出漏洞。若暂时无法升级，可限制 news 组用户的 innfeed 执行权限，或通过 sudo 规则禁止 news 组使用 -c 参数启动 innfeed。"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "ISC INN innfeed 命令行缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:56:17Z"

