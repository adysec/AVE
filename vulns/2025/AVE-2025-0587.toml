[basic]
description = "在util-linux库中存在一个堆缓冲区过读漏洞，具体位于setpwnam()函数。该漏洞通过处理256字节用户名时触发，当写入密码数据库的SUID登录工具日志时，导致缓冲区越界读取。攻击者需本地访问权限，通过精心构造的用户名即可触发此漏洞。漏洞影响广泛的Linux系统，因SUID登录工具写入密码文件，可能被利用实现局部权限升级，将系统权限提升到Root。通过精心构造用户名利用setpwnam()的缓冲区溢出特性，攻击者可以在系统用户环境下执行远程代码控制，威胁用户数据安全。在CVSS 3.1下的评分达到6.1，中等风险级别，建议尽快修复"
published = "2025-12-05T17:16:03Z"
remediation = "升级 util-linux 到 2.39 及以上版本以获取 upstream 修复 commit 9a36d77012c4c771f8d51eba46b6e62c29bf572a 补丁，或者直接应用 Home Assistant buildroot 发布的 CVE-2025-14104 补丁（包 0008/0009）。Ubuntu 用户请安装 USN-7187-1，Red Hat 用户请安装 RHSA-2026:1696 等安全更新包。如果无法立即升级，可通过 PAM 配置限制本地用户名长度 ≤255 字节以缓解攻击风险"
score = 6.1
severity = "MEDIUM"
sources = ["msrc"]
title = "红帽 util-linux 堆缓冲区读溢出漏洞"
updated = "2026-06-30T00:16:53Z"

