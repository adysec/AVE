[basic]
description = "Recourse ManTrap 1.6 存在拒绝服务漏洞，该漏洞源于程序在处理 `/proc/self` 目录时存在缺陷。具有本地访问权限的攻击者无需任何身份认证，通过执行一系列命令（如交替进入和退出 `/proc/self` 目录并执行 `ls`、`pwd` 等命令）即可触发该漏洞，导致目标系统服务中断或崩溃，影响系统可用性。"
published = "2001-01-09T05:00:00Z"
remediation = "立即联系 Recourse Technologies 升级到 ManTrap 2.0 或更高版本以修复此漏洞。升级前可通过配置禁止非特权用户访问 /proc/self 目录，并限制 shell 命令执行权限作为临时缓解措施。此外建议将 cages 进程的日志功能与主系统隔离，并部署独立远程日志服务器，防止攻击者通过 kill() 关闭 cages 内的日志进程导致取证数据丢失。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "Recourse ManTrap 拒绝服务漏洞"
updated = "2026-06-16T21:53:15Z"

