[basic]
description = "ISC BIND 8.2 至 8.2.2-P6 版本的 named 服务在处理压缩区域传输（ZXFR）请求时存在逻辑缺陷。远程攻击者无需认证即可向目标 DNS 服务器发送特制的 ZXFR 请求，随后对未缓存的权威记录执行名称服务查询，触发服务异常，导致 named 进程崩溃，造成拒绝服务。该漏洞影响运行 BIND 8.2 至 8.2.2-P6 版本的 DNS 服务器，CVSS 评分 5.0，危害等级中危。"
published = "2000-12-19T05:00:00Z"
remediation = "立即升级 ISC BIND 至 8.2.2-P7 或更高版本。各发行版用户请安装对应安全更新：Red Hat 安装 RHSA-2000:107 更新包，Debian 安装 20001112 安全更新，SuSE Linux 安装 2000-11-21 公告对应补丁。如无法立即升级，可在 named.conf 中使用 `allow-transfer` 指令限制仅允许受信任的从 DNS 服务器发起区域传输，并禁用递归查询（`allow-recursion`）以降低攻击面。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "ISC BIND 8.2.2 ZXFR请求 拒绝服务漏洞"
updated = "2026-06-16T21:52:40Z"

