[basic]
description = "Intel InBusiness eMail Station 1.04.87 的 POP 服务存在缓冲区溢出漏洞。远程攻击者无需身份认证，通过向目标服务的 POP 端口发送超长用户名字段，可触发缓冲区溢出，导致服务进程崩溃从而引发拒绝服务。在特定条件下，攻击者可能利用该溢出覆盖内存数据，实现任意代码执行。该漏洞影响 Intel InBusiness eMail Station 1.04.87 版本，CVSS 评分 5.0，危害等级中危，攻击复杂度低，利用门槛较低。"
published = "2000-12-19T05:00:00Z"
remediation = "Intel InBusiness eMail Station 1.04.87 已停止技术支持，建议立即将该设备从生产网络隔离或退役淘汰。如必须继续使用，应在网络防火墙层面限制仅允许可信 IP 访问 TCP 110 端口，并部署入侵检测规则监控对 POP 服务的超长 USER 命令（长度超过 256 字符的 USER 参数），同时将设备置于独立 VLAN 中最小化攻击面。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Intel InBusiness eMail Station POP服务缓冲区溢出漏洞"
updated = "2026-06-16T21:52:55Z"

