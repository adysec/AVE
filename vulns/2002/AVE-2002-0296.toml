[basic]
description = "Apache Tomcat 3.x 和 4.x 版本中默认的 DefaultServlet（org.apache.catalina.servlets.DefaultServlet）存在文件泄漏漏洞。远程攻击者无需认证即可通过直接向该 Servlet 发送特制请求，读取 Web 应用目录下的任意文件内容，包括 JSP 源代码等可能包含数据库用户名和密码等敏感信息的文件。攻击条件简单，仅需目标 Tomcat 服务器开放 HTTP 端口即可利用。"
published = "2002-10-11T04:00:00.000"
remediation = "建议升级至 Apache Tomcat 4.1.12 或 4.0.5 及以上版本，该漏洞已在上述版本中修复。由于 Tomcat 4.x 已停止维护，强烈建议升级至 Tomcat 9.0.x 或更高版本以获得持续安全更新。如无法立即升级，可在 web.xml 中移除或限制 DefaultServlet 的访问路径，或通过防火墙/反向代理限制对 /servlet/ 路径的访问作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Apache Tomcat 3/4 DefaultServlet 文件泄漏漏洞"
updated = "2026-06-16T21:58:48.793"

