[basic]
description = "Way-Board 2.0 的 way-board.cgi CGI 程序存在文件路径遍历漏洞。远程攻击者可在 `db` 参数中指定目标文件名，并在文件名末尾附加空字节（%00），利用程序对输入校验不严的缺陷，读取服务器上任意已知文件，从而可能获取服务器配置文件、密码文件等敏感信息。该漏洞影响所有对外暴露 Way-Board 2.0 CGI 程序的系统，攻击者无需认证即可在网络上直接发起利用，攻击复杂度低。CVSS 评分 5.0，危害等级中等，主要影响信息保密性。"
published = "2001-06-02T04:00:00Z"
remediation = "如 Way-Board 软件仍有在役实例，建议立即将其 CGI 脚本（way-board.cgi）从 Web 服务器中移除或下线，并迁移到当前仍活跃维护的开源论坛系统（如 phpBB、Flarum 或 Discourse）。因 Way-Board 系上世纪 Perl CGI 旧版论坛程序，官方早已停止维护，无可用补丁，唯一根治方案为全面替换。临时缓解措施：在 Apache/Nginx 配置中添加规则，禁用对 way-board.cgi 的直接访问，并在防火墙或 WAF 层面拦截含 %00（空字节）的请求参数，防止攻击者通过 db 参数读取服务器敏感文件。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Way-Board 2.0 任意文件读取漏洞"
updated = "2026-06-16T21:53:53Z"

