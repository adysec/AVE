[basic]
description = "Google Chrome 14.0.835.163 之前版本存在使用后释放漏洞，源于卸载事件处理时对已释放内存的错误引用。远程攻击者可通过构造恶意网页诱导用户访问，触发卸载事件处理逻辑中的内存错误引用，导致浏览器崩溃拒绝服务或可能执行任意代码。该漏洞影响 Windows、Linux、Mac 等平台上的 Chrome 浏览器，CVSS 6.8 分（中等严重），攻击向量为网络、攻击复杂度中等、无需认证，可导致机密性、完整性、可用性部分受损。Google 已在 Chrome 14.0.835.163 版本中修复该漏洞，用户升级至该版本或更高版本即可修复。"
published = "2011-09-19T12:02:55Z"
remediation = "建议立即将 Google Chrome 升级至 14.0.835.163 或更高版本（通过“关于 Chrome”自动更新或访问 google.com/chrome 下载最新安装包）。若暂时无法升级，可暂时禁用 JavaScript 或使用 Chrome 的“禁止网站运行 JavaScript”设置作为临时缓解措施，或改用其他浏览器访问不可信网站。企业环境可通过组策略强制推送 Chrome 更新策略至 14.0.835.163 以上版本。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 释放后使用漏洞"
updated = "2026-06-16T23:32:06Z"

