[basic]
description = "Trend Micro Apex One (2019) 与 OfficeScan XG 服务器中存在一个包含漏洞的 EXE 文件，未经身份验证的远程攻击者可利用该漏洞向受影响安装路径写入任意数据，并绕过 ROOT 登录限制。该漏洞无需任何身份认证即可远程利用，攻击者可通过发送特制请求实现任意文件写入，进而可能导致远程代码执行或权限提升。影响范围覆盖 Apex One (2019) 及 OfficeScan XG 所有受影响版本，CVSS 3.1 评分 9.8（严重级），攻击向量为网络、攻击复杂度低、无需权限、无需用户交互，机密性/完整性/可用性均受高度影响。Trend Micro 已发布安全补丁修复此漏洞，建议受影响用户尽快升级至最新版本并应用官方补丁。"
published = "2020-03-18T01:15:12.223"
remediation = "立即将 Trend Micro Apex One (2019) 升级至 14.0 最新补丁版本，并将 OfficeScan XG 升级至 12.0 最新补丁版本。同时从 https://success.trendmicro.com/solution/000245571 和 https://success.trendmicro.com/jp/solution/000244253 下载并安装官方安全补丁。临时缓解措施：在网络边界防火墙层面阻止对受影响服务器的未认证远程访问，仅允许可信 IP 段的连接。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Trend Micro Apex One OfficeScan XG 远程代码执行漏洞"
updated = "2026-06-17T03:26:37.310"

