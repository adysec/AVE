[basic]
description = "WordPress wp-payeezy-pay 插件 2.98 版本之前存在输入验证错误漏洞，该插件中的 pay.php、donate.php、donate-rec 和 pay-rec 文件未能正确过滤用户输入，导致存在本地文件包含漏洞。未经身份认证的远程攻击者可通过构造特制的 HTTP 请求，利用路径遍历技术读取服务器上的任意敏感文件，包括配置文件、数据库凭证等。该漏洞影响所有使用 wp-payeezy-pay 插件低于 2.98 版本的 WordPress 站点，CVSS 评分 9.8，危害等级严重。建议用户立即升级至 2.98 或更高版本以修复此漏洞。"
published = "2019-08-22T14:15:12Z"
remediation = "立即将 wp-payeezy-pay 插件升级至 2.98 或更高版本。该漏洞源于 pay.php、donate.php、donate-rec.php 和 pay-rec.php 文件对用户输入未做充分过滤，导致本地文件包含。如无法立即升级，可暂时禁用该插件，或通过 Web 服务器配置（如 .htaccess）限制对上述四个 PHP 文件的直接访问。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "WordPress wp-payeezy-pay插件 本地文件包含漏洞"
updated = "2026-06-17T01:53:52Z"

