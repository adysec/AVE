[info]
author = "ave"
description = "WebKit内存破坏漏洞复现验证：通过构造恶意HTML页面加载特殊处理的图像资源，触发Safari/WebKit在ImageIO组件中的内存错误，验证是否存在内存损坏或代码执行风险。"
id = "POC-AVE-2012-0350"
name = "CVE-2012-3674 PoC"
severity = "high"
tags = ["ave-2012-0350"]
vuln_id = [
    "CVE-2012-3674",
    "AVE-2012-0350",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.headers]
User-Agent = "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_8) AppleWebKit/536.30.1 (KHTML, like Gecko) Version/6.0 Safari/536.30.1"

[[poc.requests.matchers]]
expect = true
part = "status"
status = [200]
type = "status"
