[basic]
description = "EFTP FTP 服务器存在缓冲区溢出漏洞，远程未授权攻击者可通过向服务发送超长字符串触发缓冲区溢出，导致服务拒绝服务崩溃。该漏洞影响运行 EFTP 服务的 FTP 服务器，攻击无需身份认证、攻击复杂度低、可远程利用，CVSS 评分 7.5（高危），主要影响服务可用性，可能导致服务拒绝服务甚至潜在代码执行风险。"
published = "2000-11-14T05:00:00.000"
remediation = "建议立即升级 eftp 到最新版本（如有官方修复版本），或升级到支持边界检查的版本。若无法立即升级，建议在防火墙层面限制 eftp 服务端口（默认 TCP 21）仅允许可信 IP 访问，或在防火墙层面限制单次连接最大数据长度，防止超长字符串触发缓冲区溢出。建议尽快联系厂商获取官方补丁或升级至修复版本。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "EFTP 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:52:38.503"

