[basic]
description = "FtpXQ FTP服务器2.0.93版本存在目录遍历漏洞，远程攻击者可在FTP GET命令中使用..（点号）路径遍历序列绕过目录访问限制，从而读取服务器文件系统中的任意文件，造成敏感信息泄露。该漏洞无需身份认证，攻击者只需通过网络连接到目标FTP服务即可发起利用，可读取系统配置文件、密码文件等重要数据。CVSS评分5.0，危害等级中等。"
published = "2001-05-03T04:00:00Z"
remediation = "FtpXQ FTP Server 2.0.93 已多年未获官方更新且厂商不再维护，强烈建议替换为受支持的 FTP 服务器（如 FileZilla Server、vsftpd 或 Microsoft IIS FTP）。如短期内无法迁移，应将 FTP 根目录设置在非系统分区并严格限制匿名用户访问权限，同时在边界防火墙禁用 21 端口的外部直接访问，仅允许可信 IP 通过 VPN 或跳板机登录。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Datawizards FtpXQ FTP 服务器目录遍历漏洞"
updated = "2026-06-16T21:54:02Z"

