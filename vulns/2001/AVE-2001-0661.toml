[basic]
description = "CVE-2001-0201是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-03-26T05:00:00Z"
remediation = '立即对 deletecontact.php 中的 $item_id 参数进行整数类型验证，使用 intval() 或正则表达式 /^\d+$/ 过滤输入后再拼入 SQL 查询语句。临时缓解措施：将 Postaci 数据库后端从 PostgreSQL 切换至 MySQL（PHP 的 mysql_query() 函数会拒绝含分号的查询字符串，可阻止此类攻击）。如无法立即修复，建议在 Web 服务器层面通过 mod_security 或 WAF 规则拦截 deletecontact.php 请求中含分号或 UNION/SELECT 等 SQL 关键字的请求。长期方案：由于 Postaci 1.1.2/1.1.3 已停止维护且官方补丁历史不可追溯，建议迁移至 Roundcube、RainLoop 等仍在维护的开源 Webmail 系统。'
score = 7.5
