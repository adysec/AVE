[basic]
description = "WordPress 插件 defa-online-image-protector 3.3 版本存在反射型跨站脚本攻击（Reflected XSS）漏洞。该漏洞源于插件未对用户输入进行充分的过滤与转义处理，远程攻击者可通过构造特制的恶意 URL 链接，诱使已认证用户点击，从而在目标浏览器中执行任意 HTML 或 JavaScript 代码。成功利用该漏洞可导致会话劫持、敏感信息泄露或页面内容篡改。攻击无需身份认证，但需要用户交互（点击链接），影响范围包括使用该插件的 WordPress 站点。"
published = "2016-10-10T20:59:04Z"
remediation = "该插件已于 2016 年 3 月 28 日从 WordPress 官方仓库下架且不再维护，无官方补丁可用。建议立即删除 defa-online-image-protector 插件，并检查网站是否存在已被植入恶意脚本的痕迹；如仍需图片保护功能，请替换为其他仍在维护的同类插件。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress defa-online-image-protector 插件反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:43Z"

