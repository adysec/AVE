[basic]
description = "WordPress Media Library Assistant 插件在 2.82 及之前版本中存在本地文件包含漏洞。该漏洞位于 mla_gallery 功能的 link=download 参数处，攻击者可通过构造特制请求读取服务器上的敏感文件内容，导致信息泄露。漏洞无需身份认证即可远程利用，攻击复杂度低，且无需任何用户交互。成功利用后，攻击者可获取 WordPress 配置文件、数据库凭证等敏感信息，为后续进一步攻击提供便利。CVSS 评分 7.5，危害等级高。"
published = "2020-04-13T02:15:10Z"
remediation = "立即升级 Media Library Assistant 插件至 2.82 或更高版本。如暂无法升级，可临时禁用该插件，或通过 WAF 规则拦截对 mla_gallery 短码 link=download 参数的恶意请求。同时检查服务器上传目录权限，禁止 WordPress 安装目录外的本地文件读取，限制 web 服务器用户对敏感系统文件的访问。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "WordPress Media Library Assistant 本地文件包含漏洞"
updated = "2026-06-17T02:50:42Z"

