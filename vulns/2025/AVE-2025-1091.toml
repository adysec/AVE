[basic]
description = "Linux 内核蓝牙子系统中 chan_alloc_skb_cb() 函数存在空指针解引用漏洞。该函数在发生错误时应返回错误指针，但错误地返回了 NULL，导致后续代码对空指针进行解引用，可能引发本地拒绝服务。攻击者需要具备本地访问权限，并在受影响系统上拥有低权限用户身份，才能通过触发特定的蓝牙操作来利用此漏洞。成功利用可能导致系统崩溃或内核 panic，影响系统的可用性。该漏洞影响运行受影响 Linux 内核版本的本地用户，CVSS v3.1 评分为 5.5，危害等级为中等。"
published = "2025-04-03T08:15:16Z"
remediation = "升级 Linux 内核至已修复该漏洞的稳定版本：5.4.292、5.10.236、5.15.180、6.1.132、6.6.85、6.12.21 或 6.13.9 及以上版本。请通过发行版官方安全更新渠道安装对应内核补丁（如 Debian/Ubuntu 执行 apt upgrade，RHEL/CentOS 执行 yum update，或使用各发行版提供的稳定内核更新包）。如暂时无法升级内核，可在系统启动参数中禁用蓝牙模块（将 btusb、bluetooth 加入 modprobe 黑名单或内核启动参数 blacklist）作为临时缓解措施，避免系统进入可触发蓝牙 6lowpan 代码路径的攻击条件。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核蓝牙空指针解引用拒绝服务漏洞"
updated = "2026-06-17T08:44:49Z"

