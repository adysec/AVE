[basic]
description = "Laravel 框架 5.5.40 及之前版本、5.6.x 至 5.6.29 版本中存在反序列化远程代码执行漏洞。该漏洞源于框架对 X-XSRF-TOKEN 值的解密处理不当，在 Illuminate/Encryption/Encrypter.php 的 decrypt 方法中调用了不安全的 unserialize 函数，攻击者可构造恶意的序列化载荷通过 XSRF Token 传递触发反序列化，结合 phpggc 工具中的 Laravel RCE 链实现远程代码执行。利用该漏洞需要获取应用的 APP_KEY，通常难以获得，但若攻击者此前已获得特权访问或成功实施过其他攻击，则可能获取该密钥。CVSS 评分 8.1，危害等级高，影响范围广泛。"
published = "2018-08-09T19:29:00Z"
remediation = "立即将 Laravel 框架升级至 5.6.30 或更高版本（5.5.x 用户升级至 5.5.41+）。升级后 Laravel 默认禁用 Cookie 序列化，消除反序列化攻击路径。如无法立即升级，在 `app/Http/Middleware/EncryptCookies.php` 中将 `$serialize` 属性设为 `false` 以禁用 Cookie 序列化，并立即轮换 `APP_KEY` 环境变量，防止已泄露密钥被利用。同时审查服务器日志排查是否有异常反序列化行为。"
score = 8.1
severity = "HIGH"
sources = ["kev"]
title = "Laravel Laravel Framework 反序列化远程代码执行漏洞"
updated = "2026-06-17T01:42:06Z"

