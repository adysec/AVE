[basic]
description = "Adobe Flash Player 及 Adobe AIR 存在内存破坏漏洞（CWE-119）。攻击者可通过诱导用户访问特制的网页或打开恶意构造的 Flash 内容，触发未指定的内存破坏错误，导致任意代码执行或拒绝服务。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上的 Flash Player 10.3.183.11 之前版本、11.x 系列 11.1.102.55 之前版本以及 Adobe AIR 3.1.0.4880 之前版本。攻击无需身份认证，远程低复杂度即可利用，CVSS 评分 10.0，危害等级严重。Adobe 已发布安全更新修复此漏洞，建议用户升级至 Flash Player 10.3.183.11/11.1.102.55 及以上版本或 Adobe AIR 3.1.0.4880 及以上版本。"
published = "2011-11-11T16:55:01Z"
remediation = "升级 Adobe Flash Player 至 10.3.183.11（非 Android）或 11.1.102.55（Windows/Mac/Linux/Solaris）及以上版本，Android 版升级至 11.1.102.59 及以上，Adobe AIR 升级至 3.1.0.4880 及以上。由于 Adobe 已于 2020 年 12 月 31 日停止支持 Flash Player，建议彻底卸载 Flash Player 并迁移至 HTML5 标准，同时在浏览器中禁用 Flash 插件作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:31:22Z"

