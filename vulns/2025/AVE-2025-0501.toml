[basic]
title = "GNOME libsoup HTTP/2 消息队列处理中的堆释放后使用漏洞"
description = "libsoup 库是 GNOME 和 WebKit 应用广泛使用的 HTTP 通信库。其 HTTP/2 异步消息队列处理中存在状态同步缺失缺陷：当网络操作在特定时间窗口被取消时，内部消息队列项可能因缺少状态检查而被重复释放（double-free），导致堆释放后使用（use-after-free）内存访问。攻击者可远程发送特制的 HTTP/2 读取和取消序列触发此漏洞，造成目标应用崩溃，属于拒绝服务攻击。该漏洞影响 libsoup 3.6.5 及之前版本。"
severity = "HIGH"
score = 7.5
sources = ["cve", "redhat"]
published = "2025-10-23"
updated = "2026-06-29"
remediation = "升级 libsoup 至 3.6.5 以上版本，或应用 GNOME GitLab MR !481 的补丁。Red Hat 已发布 RHSA-2025:23139 和 RHSA-2025:23437 修复 RHEL 10 受影响版本。"

