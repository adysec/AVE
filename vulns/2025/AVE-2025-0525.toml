[basic]
description = "Google Chrome 浏览器 SplitView 功能存在安全 UI 不正确漏洞（CWE-451），该漏洞源于 SplitView 组件未能正确验证域名显示逻辑。远程攻击者可通过诱导用户执行特定的 UI 手势（如拖拽或点击操作），利用特制的域名实施 UI 欺骗攻击，使用户误认为正在访问合法网站。攻击者无需身份认证，但需要用户交互配合。成功利用可导致用户向攻击者控制的站点泄露低敏感信息。该漏洞影响 Google Chrome 142.0.7444.59 之前版本，Chromium 团队评定为低危，CVSS 评分 4.2。"
published = "2025-11-10T20:15:39Z"
remediation = "升级 Google Chrome 至 142.0.7444.59 及以上版本（Windows/Mac/Linux 通过 Chrome 设置→关于 Chrome→自动更新）；Fedora 用户执行 `sudo dnf update google-chrome-stable` 至 142.0.7444.162。如无法立即更新，可在浏览器中禁用第三方扩展并避免点击可疑链接作为临时缓解。"
score = 4.2
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome SplitView 安全界面绕过漏洞"
updated = "2026-06-17T08:32:24Z"

