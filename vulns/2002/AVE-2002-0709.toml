[basic]
description = "Monkey HTTP Server 0.5.0 存在跨站脚本攻击（XSS）漏洞，未经身份认证的远程攻击者可通过构造特制的 URL 或向 test2.pl 脚本发送恶意参数，向目标页面注入任意 Web 脚本或 HTML 代码。该漏洞源于应用未对用户输入进行充分的过滤与转义，导致浏览器执行攻击者注入的恶意脚本。攻击者可通过钓鱼链接诱导用户访问包含恶意脚本的 URL，从而窃取用户会话 Cookie、重定向用户至恶意网站或篡改页面内容。影响版本包括 Monkey 0.1、0.4 及 0.5，利用条件简单，攻击复杂度低，CVSS v2 评分 4.3，危害等级中等。"
published = "2002-12-31T05:00:00Z"
remediation = "升级到 Monkey HTTP Server 0.6.0 或更高版本以修复 test2.pl 跨站脚本漏洞。如无法升级，应在服务器前端部署 Web 应用防火墙过滤 URL 及 CGI 参数中的 script、javascript: 等恶意关键字，并对所有用户输入进行 HTML 实体编码后再输出到响应页面，同时删除或禁用不再需要的 test2.pl 脚本。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Monkey HTTP Server 跨站脚本攻击漏洞"
updated = "2026-06-16T22:00:10Z"

