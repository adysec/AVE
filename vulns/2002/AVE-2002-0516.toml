[basic]
description = "Oddsock Song Requester 2.1 WinAmp 插件存在拒绝服务漏洞，远程攻击者可通过向运行该插件的 WinAmp 客户端发送特制的请求，触发插件处理异常导致程序崩溃。该漏洞影响 WinAmp 配合 Oddsock Song Requester 2.1 版本的环境，攻击者无需身份认证即可利用，危害等级中危。目前已有公开的 PoC 代码，建议用户禁用该插件或升级到更高版本。"
published = "2002-10-04"
remediation = "建议立即将 Oddsock Song Requester WinAmp 插件升级至 2.2 或更高版本，该版本已修复 CGI 程序中的缓冲区溢出问题。如无法升级，可卸载该插件或删除其 CGI 相关文件（如 gen_songrequester.dll），并确保 WinAmp 不监听外部网络请求以降低攻击面。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Oddsock Song Requester 2.1 WinAmp 插件拒绝服务漏洞"
updated = "2002-10-04"

