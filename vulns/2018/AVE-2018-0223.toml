[basic]
description = "Etherpad Lite 1.6.4 之前版本存在管理员权限绕过漏洞（CWE-178：大小写处理不当）。未经身份认证的远程攻击者可通过向目标系统发送特制的 HTTP 请求，利用路径大小写差异绕过管理员权限验证，从而获取管理员面板的完全访问权限。攻击者可进一步创建管理员账户、查看或修改所有文档内容、执行系统命令，导致机密性、完整性和可用性完全丧失。该漏洞无需任何认证或用户交互，攻击复杂度低，CVSS 评分 9.8，危害等级严重。官方已在 1.6.4 版本中修复此漏洞。"
published = "2018-04-29T18:29:00.223"
remediation = "立即升级 Etherpad Lite 至 1.6.4 或更高版本（commit ffe24c3），该版本修复了未授权访问 admin 接口的权限绕过漏洞。如无法立即升级，可在反向代理层添加访问控制规则，限制 /admin 路径仅允许可信 IP 访问。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Etherpad Etherpad Lite 管理员权限绕过漏洞"
updated = "2026-06-17T02:07:16.877"

