[basic]
description = "ModbusServer 应用程序在从 MQTT 消息中间件获取数据时未对输入进行充分校验，未经身份认证的远程攻击者可通过向 MQTT 代理发布特制恶意消息，利用该注入漏洞向 ModbusServer 传输恶意载荷，从而破坏系统数据完整性和服务可用性。该漏洞影响所有运行存在缺陷版本的 ModbusServer 系统，攻击者无需任何身份凭据或用户交互，只需网络可达即可发起攻击，攻击复杂度低，危害等级高，CVSS 评分 8.8。"
published = "2026-07-30T07:16:57.110"
remediation = "立即将受影响设备固件升级至 1.9.1 或更高版本。受影响型号包括 CHARX SEC-3000、SEC-3050、SEC-3100 和 SEC-3150，固件版本低于 FW 1.9.1 均受影响。升级步骤：登录设备管理界面查看当前固件版本，从 Phoenix Contact 官方支持页面下载对应型号的 V1.9.1 固件包，通过 Web 界面或 TFTP 上传并完成升级。如暂时无法立即升级，应在防火墙规则中严格限制 ModbusServer 服务端口和 MQTT 端口的访问来源，仅允许来自受信任管理网段的 IP 连接，以阻断未授权远程攻击者向 ModbusServer 注入恶意输入的路径。"
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "Phoenix Contact CHARX SEC-3150 ModbusServer 未验证输入注入漏洞"
updated = "2026-07-30T16:17:11.620"

