[basic]
description = "LG NAS 网络存储设备存在预认证远程命令注入漏洞。未经身份认证的远程攻击者可通过拦截登录请求，在密码（password）参数中注入系统命令，在无需登录凭据的情况下直接在设备上执行任意操作系统指令。成功利用该漏洞可导致攻击者获取设备的完全控制权限，包括读取和修改存储的用户数据、添加管理员账户、导出用户数据库等，严重危害数据机密性与完整性。LG 已在后续固件版本中修复此漏洞，受影响用户应升级至最新固件并限制设备外部访问。"
published = "2018-01-01T00:00:00Z"
remediation = "立即升级LG NAS设备固件至最新版本，访问LG官方支持页面下载对应型号的最新固件并执行升级操作。如无法立即升级，可在路由器或防火墙上限制对NAS设备Web管理端口（如80、443端口）的访问，仅允许受信任的IP地址访问，同时禁用设备远程管理功能作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["nuclei"]
title = "LG NAS 远程命令注入漏洞"
updated = "2018-01-01T00:00:00Z"

