[basic]
description = "WebKit 渲染引擎在处理特定网页内容时存在内存损坏漏洞。远程攻击者可通过诱导用户访问一个经过精心构建的恶意网站，触发 WebKit 内部的内存管理缺陷，从而在目标系统上执行任意代码或导致浏览器崩溃（拒绝服务）。该漏洞影响 Apple iOS 5.1 之前的版本以及 iTunes 10.6 之前的版本。攻击条件为用户使用受影响的浏览器访问恶意页面，利用方式为通过精心设计的 HTML/JavaScript 载荷触发内存破坏。"
published = "2012-03-08T22:55:01Z"
remediation = "建议将 iOS 系统升级至 5.1 或更高版本，并将 iTunes 升级至 10.6 或更高版本。对于无法立即升级的设备，建议暂时禁用 Safari 浏览器访问不可信的第三方网站，以防止通过恶意网页触发内存损坏导致的代码执行或服务崩溃。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:32:09Z"

