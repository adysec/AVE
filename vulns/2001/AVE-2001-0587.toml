[basic]
description = 'Microsoft Windows 2000 域控制器中的"配置您的服务器"工具在安装目录服务还原模式时默认设置空白密码，具有物理访问权限的攻击者可利用该空白密码进入目录服务还原模式，绕过系统正常认证机制，从而在域控制器上安装恶意程序或执行任意配置修改。该漏洞影响 Windows 2000 域控制器系统，CVSS 评分 7.2，危害等级高。由于需要物理访问权限，攻击条件受限，但一旦利用成功可完全控制域控制器。'
published = "2001-02-12T05:00:00Z"
remediation = "立即为 Windows 2000 域控制器的目录服务还原模式（DSRM）设置强密码，使用 ntdsutil 工具或通过系统属性设置密码，密码应包含大小写字母、数字和特殊字符且长度不少于 12 位。如已升级到更高版本 Windows Server，确保 DSRM 密码与域管理员密码不同且定期更换。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Windows 2000 目录服务恢复模式空白密码漏洞"
updated = "2026-06-16T21:53:33Z"

