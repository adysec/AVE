[basic]
description = "VelotiSmart WiFi B-380 摄像头固件中的 uc-http 服务 1.0.0 存在目录遍历漏洞，远程攻击者无需身份认证即可通过向 TCP 80 端口发送特制的 HTTP 请求（如 /../../etc/passwd）读取设备任意文件，导致敏感信息泄露。该漏洞 CVSS 评分 9.8，危害等级严重，影响所有运行该固件版本的 VelotiSmart B-380 摄像头设备。攻击者可直接利用公开的 Exploit-DB 编号 45030 的 PoC 进行利用，无需任何前置条件。"
published = "2018-07-15T15:29:00Z"
remediation = "该漏洞影响 VelotiSmart WiFi B-380 摄像头，厂商已无安全更新支持。建议立即停止使用该设备并更换为受支持的替代产品；如无法更换，须在防火墙上限制 TCP 80 端口仅允许受信任内网 IP 访问，同时将设备置于独立 VLAN 中隔离，避免暴露在公网。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "VelotiSmart WiFi B-380 摄像头目录遍历漏洞"
updated = "2026-06-17T01:40:35Z"

