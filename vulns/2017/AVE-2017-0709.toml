[basic]
description = "Apache Struts2 Jakarta Multipart 解析器在处理文件上传时存在异常处理不当和错误消息生成缺陷，导致 OGNL 表达式注入漏洞（S2-045/S2-046）。远程未授权攻击者可通过构造恶意的 Content-Type、Content-Disposition 或 Content-Length HTTP 头（如包含 #cmd= 字符串），在服务器上执行任意系统命令。该漏洞影响 Apache Struts 2.3.5 至 2.3.31 及 2.5 至 2.5.10 版本，CVSS 3.1 评分 9.8（CRITICAL），攻击向量为网络、攻击复杂度低、无需权限和用户交互，机密性/完整性/可用性均为高影响。2017 年 3 月已在野利用，攻击者可直接获取服务器控制权。受影响系统需升级至 Struts 2.3.32 或 2.5.10.1 及以上版本修复。"
published = "2017-03-11T02:59:00.150"
remediation = "立即升级 Apache Struts 2 至 2.3.32 或 2.5.10.1 及以上版本（官方修复版本）。若暂时无法升级，可在 struts.xml 中将 multipart.parser 设置为 org.apache.struts2.dispatcher.multipart.JakartaStreamMultiPartRequest 切换至 Jakarta Stream 解析器规避漏洞；或在 WAF/防火墙层面拦截包含 OGNL 表达式（如 #cmd=、@java.lang.Runtime@）的 Content-Type、Content-Disposition、Content-Length 请求头；若业务不涉及文件上传，可在 struts.xml 中设置 struts.multipart.parser=jakarta-stream 并禁用文件上传功能作为临时缓解措施。建议同时部署 WAF 规则拦截恶意 OGNL 表达式载荷，并尽快完成版本升级彻底修复。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Apache Struts2 Jakarta Multipart 解析器远程命令执行漏洞（CVE-2017-5638）影响 2.3.5-2.3.31 和 2.5-2.5.10 版本"
updated = "2026-06-17T01:20:54.013"

