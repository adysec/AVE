[basic]
description = "Lynx 2.8.4 及更早版本存在 CRLF 注入漏洞。远程攻击者可通过在命令行提供的 URL 中嵌入编码的回车符（%0d）、换行符（%0a）及其他空白字符，向 HTTP 请求中注入伪造的 HTTP 头部。攻击者利用此漏洞可篡改请求内容、绕过安全策略或实施 HTTP 响应拆分攻击，影响 HTTP 请求的完整性和安全性。该漏洞攻击复杂度低，无需认证即可远程利用。"
published = "2003-02-19T05:00:00Z"
remediation = "立即升级 Lynx 至 2.8.4.1b 或更高版本。Debian 用户执行 `apt-get install lynx=2.8.3-1.1`（woody）或升级至 bullseye 及以上版本（2.9.0dev.6-3~deb11u1 已修复）；Red Hat 用户安装 RHSA-2003-029/030 提供的更新；Mandrake 用户应用 MDKSA-2003:023 补丁。如无法升级，避免在命令行中直接使用 Lynx 访问不可信 URL，或通过代理过滤 CR/LF 编码字符作为临时缓解。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "GNU Lynx 命令行 URL CRLF 注入漏洞"
updated = "2026-06-16T21:59:16Z"

