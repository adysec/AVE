[basic]
description = "mars_nwe 0.99.pl19 存在格式字符串漏洞，未经身份认证的远程攻击者可通过向目标系统发送包含格式化字符串说明符（如 %s、%n 等）的特制数据包触发该漏洞，进而在受影响系统上执行任意操作系统命令。该漏洞影响运行 mars_nwe 0.99.pl19 版本的 Linux 及 Unix 系统，CVSS v2 评分为 10.0，危害等级严重。攻击者无需事先获取系统权限即可利用此漏洞完全控制目标服务器，导致数据泄露、服务中断或系统被进一步入侵。FreeBSD 等发行版已发布安全补丁修复此问题。"
published = "2001-05-03T04:00:00Z"
remediation = '建议立即将 mars_nwe 升级到 0.99.b19_1 或更高版本以修复格式字符串漏洞。若无法立即升级，可手动修改 tools.c 文件，将所有 syslog 调用中的格式字符串参数显式指定为 "%s"，例如将 syslog(LOG_DEBUG, buf) 改为 syslog(LOG_DEBUG, "%s", buf)，并将 syslog(prio, buf) 改为 syslog(prio, "%s", buf)，然后重新编译安装。如系统未使用该服务，建议直接卸载 mars_nwe 作为临时缓解措施。'
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "mars_nwe 远程代码执行漏洞"
updated = "2026-06-16T21:53:54Z"

