[basic]
description = "Apache ActiveMQ 5.0.0至5.15.5版本的Web管理控制台queue.jsp页面存在跨站脚本漏洞（CWE-79）。由于对QueueFilter参数缺乏有效的输入过滤与转义处理，远程攻击者可构造特制的恶意URL，诱使已登录的管理员用户点击，从而在目标浏览器上下文中执行任意JavaScript脚本，窃取会话凭证、篡改页面内容或发起后续攻击。攻击无需身份认证，但需要用户交互（点击链接），影响范围广泛，CVSS评分6.1，危害等级中危。建议升级至5.15.6及以上版本修复。"
published = "2018-10-10T14:29:00Z"
remediation = "升级 Apache ActiveMQ 至 5.15.6 或更高版本，该版本修复了 queue.jsp 页面 QueueFilter 参数的 XSS 过滤缺陷。如无法立即升级，可禁用 Web 管理控制台：删除或重命名 activemq-web-console 相关 WAR 包，或在配置文件中设置 jetty.xml 的 Connector 端口仅监听内网地址，避免暴露到公网。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Apache ActiveMQ 管理控制台跨站脚本攻击"
updated = "2026-06-17T02:04:04Z"

