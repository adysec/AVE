[basic]
description = "BEA WebLogic 5.1.x 存在源代码泄露漏洞，远程攻击者通过在 URL 中插入 `/ConsoleHelp/` 路径，触发 FileServlet 解析并返回 JSP 或 Servlet 页面的源代码，而非执行后的结果。攻击者无需身份认证即可利用此漏洞获取 Web 应用敏感逻辑、数据库连接信息等，为后续攻击提供情报支撑。该漏洞影响 BEA WebLogic 5.1.x 系列版本，CVSS 评分 5.0，危害等级中等。"
published = "2000-10-20T04:00:00Z"
remediation = "升级 BEA WebLogic 至 5.1.1 及以上版本，该版本已修复 FileServlet 对 /ConsoleHelp/ 路径的访问控制缺陷。如无法立即升级，可在 Web 服务器（如 Apache、IIS）反向代理层配置规则，拦截包含 /ConsoleHelp/ 的 URL 请求；或删除 WebLogic 安装目录下的 ConsoleHelp 相关文件，并限制对 WebLogic 管理端口的网络访问。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "BEA WebLogic 源代码泄露漏洞"
updated = "2026-06-16T21:52:15Z"

