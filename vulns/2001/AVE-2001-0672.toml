[basic]
description = "SourceForge NewsDaemon 0.21b 及更早版本存在 SQL 注入漏洞，远程攻击者无需身份认证即可通过向 `user_username` 参数提交构造的畸形 SQL 查询语句，在数据库服务器上执行任意 SQL 命令，进而获取敏感数据并提升系统权限。该漏洞影响使用 NewsDaemon 搭建新闻公告服务的系统，攻击条件仅要求目标服务暴露于互联网，攻击者通过网络即可完成利用，无需任何凭据。CVSS v3 评分为 7.5，危害等级为高危。"
published = "2001-05-03T04:00:00Z"
remediation = "升级到 SourceForge NewsDaemon 0.21b 或更高版本以修复 SQL 注入漏洞。如无法立即升级，可在防火墙或 WAF 层对包含 user_username 参数的请求实施过滤，拦截包含单引号、SQL 关键字（如 UNION、SELECT）的畸形输入作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "SourceForge NewsDaemon SQL注入漏洞"
updated = "2026-06-16T21:53:56Z"

