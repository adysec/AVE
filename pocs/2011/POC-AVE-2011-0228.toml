[info]
author = "AVE"
description = "检测 Mozilla Firefox 7.0/Thunderbird 7.0 在 Windows Direct2D+Azure 图形后端下 canvas 同源策略绕过漏洞。通过加载跨域图片到 canvas 并尝试读取像素数据验证。"
id = "POC-AVE-2011-0228"
name = "Mozilla Firefox/Thunderbird Canvas SOP Bypass PoC"
severity = "low"
tags = [
    "cve-2011-3649",
    "sop-bypass",
    "canvas",
]
vuln_id = [
    "CVE-2011-3649",
    "AVE-2011-0228",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc-canvas-sop.html"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["VULNERABLE"]
