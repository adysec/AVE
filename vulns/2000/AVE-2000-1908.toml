[basic]
description = "tags.<value>eWave ServletExec 3.0C 及更早版本存在权限许可不当漏洞，其 UploadServlet Java/JSP servlet 未对访问权限做任何限制。未经身份认证的远程攻击者可直接访问该 servlet 并上传任意文件，包括恶意的 JSP 页面或可执行程序，进而利用上传的文件执行任意系统命令，完全控制目标服务器。该漏洞影响部署 eWave ServletExec 3.0C 及以下版本的 Web 应用服务器，攻击条件极低，无需凭据即可利用，CVSS 评分 10.0，危害等级为严重。"
published = "2000-12-11T05:00:00.000"
remediation = "建议立即升级到 ServletExec 3.0E 版本，下载地址为 http://www.servletexec.com/downloads/，或联系 Unify 厂商（info@unify.com / 1-800-248-6439）获取补丁。如无法立即升级，可在 Apache 或 IIS 等前端 Web 服务器中通过访问控制列表限制对 /servlet/com.unify.ewave.servletexec.UploadServlet 的访问，仅允许可信 IP 访问，或直接删除该 servlet 类文件作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "eWave ServletExec 未授权文件上传远程代码执行漏洞"
updated = "2026-06-16T21:52:59.690"

