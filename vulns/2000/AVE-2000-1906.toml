[basic]
description = "OpenBSD 及其他 BSD 衍生系统中的 talkd 服务存在格式化字符串漏洞。远程攻击者可通过向 talkd 服务发送包含格式化字符（如 %n、%s）的恶意用户名，利用该漏洞执行任意代码。攻击无需身份认证，仅需网络可达目标系统的 talkd 端口（通常为 517/tcp），危害等级严重，CVSS 评分 10.0。受影响的系统包括 OpenBSD 及可能基于 BSD 的其他操作系统。"
published = "2000-12-11T05:00:00.000"
remediation = "立即应用 OpenBSD 2.7 errata 026 提供的 talkd 源码补丁，或升级至 OpenBSD 2.8 及以上版本（该版本已包含修复）。临时缓解措施：在 /etc/inetd.conf 中注释掉 talk 行并重启 inetd 以禁用 talkd 服务，或通过防火墙限制对 talk 端口（UDP 517/518）的访问。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "OpenBSD talkd 格式化字符串远程代码执行漏洞"
updated = "2026-06-16T21:52:57.913"

