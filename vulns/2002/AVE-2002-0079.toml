[basic]
description = "Common Unix Printing System (CUPS) 1.1.14 至 1.1.17 版本中 filters/image-gif.c 组件存在零长度 GIF 图像检查缺失漏洞。远程攻击者可通过构造特制的 GIF 图像块头（chunk headers）触发该漏洞，导致任意代码执行。该漏洞影响运行 CUPS 1.1.14-1.1.17 的各类 Unix/Linux 系统，攻击者无需身份认证即可远程利用，CVSS 评分 7.5，危害等级高。厂商已发布补丁修复此问题。"
published = "2002-12-26T05:00:00Z"
remediation = "立即将 CUPS 升级至 1.1.18 或更高版本。各发行版用户请安装对应安全更新：Red Hat 用户安装 RHSA-2002:295 提供的 cups-1.1.14-15 或更新版本；Debian 用户安装 DSA-232 提供的 cupsys 更新包；Mandrake 用户安装 MDKSA-2003:001 更新。如无法升级，可在 CUPS 配置文件 /etc/cups/cupsd.conf 中禁用远程打印访问（将 Listen localhost:631 取消注释并注释掉 Port 631），或通过防火墙限制 631 端口的入站流量作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "CUPS image-gif 零长度GIF图像处理远程代码执行漏洞"
updated = "2026-06-16T21:59:11Z"

