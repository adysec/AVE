[basic]
description = "Microsoft Windows 95/98/NT/2000 系统中 CIFS 浏览器协议与 NetBIOS 实现存在交互缺陷，远程攻击者可通过向目标系统发送特制的单播或 UDP 广播数据报形式的伪造 Browse Frame 请求，利用该协议对 NetBIOS 名称缓存更新的信任机制，修改动态 NetBIOS 名称缓存条目。成功利用此漏洞可导致中间人攻击、流量重定向或服务降级，攻击者无需身份认证即可远程触发，影响范围涵盖 Windows 9x 及 NT 4.0/2000 系列操作系统。该漏洞 CVSS 评分 7.5，危害等级高，微软至今未发布官方补丁，建议禁用 NetBIOS 或通过防火墙限制 UDP 137-139 端口访问以降低风险。"
published = "2000-08-29T04:00:00.000"
remediation = "安装 Microsoft 针对此漏洞发布的安全更新（Windows 2000 用户应升级至 Service Pack 2 或更高版本，Windows NT 4.0 用户安装 Security Rollup Package）；在网络边界防火墙阻止入站 UDP 137-138 端口和 TCP 139/445 端口；在不需要 NetBIOS 的环境中禁用 NetBIOS over TCP/IP（控制面板→网络→TCP/IP 属性→WINS→禁用 NetBIOS over TCP/IP）。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Windows 95/98/NT/2000 NetBIOS 名称缓存欺骗漏洞"
updated = "2026-06-16T21:53:06.423"

