[basic]
description = "util-linux 包 2.11 之前版本中 /bin/login 的 PAM 实现存在密码条目重写漏洞。当使用 pam_limits 等特定 PAM 模块时，多次 PAM 调用之间密码条目可能被错误重写，导致一个用户的凭证泄露给另一个用户。本地攻击者可利用该漏洞获取其他用户的登录凭据，从而提升权限至受影响账户级别。该漏洞需要攻击者拥有本地系统访问权限并触发特定 PAM 调用序列，CVSS 评分 7.2，危害等级高。"
published = "2001-10-08T04:00:00Z"
remediation = "升级 util-linux 软件包至 2.11 及以上版本。Red Hat Linux 用户应安装 RHSA-2001:132 提供的更新包（util-linux-2.11-2.i386.rpm），Mandrake Linux 用户安装 MDKSA-2001:084 对应更新。旧版 /bin/login 的 PAM 实现在连续调用 PAM 模块（如 pam_limits）时会错误复用前一次认证的密码凭据，升级后可消除此跨用户凭据泄露风险。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "util-linux /bin/login PAM 实现密码凭证泄露漏洞"
updated = "2026-06-16T21:55:40Z"

