[basic]
description = "Linux 内核的 s390/ism 子系统中存在一个 use-after-free 漏洞。由于代码在调用 device_add() 后直接释放了 struct device 结构体，而没有等待内核其他部分（如 sysfs）释放对该结构体的引用，导致可能发生释放后使用问题。该漏洞影响运行受影响内核版本的 s390 架构系统，本地具有低权限的攻击者可通过特定条件触发此漏洞，利用释放后引用获得提升的权限，最终可能导致系统被完全控制。CVSS 评分 7.8，危害等级为高。"
published = "2025-03-12T10:15:18Z"
remediation = "升级 Linux 内核至修复版本：6.6.80、6.12.17、6.13.5 或 6.14 及更高版本。SUSE Linux Enterprise 15 SP6/SP7 用户应安装 SUSE-SU-2025:1177-1、SUSE-SU-2025:01967-1 或 SUSE-SU-2025:01951-1 公告中的内核更新包。Ubuntu 22.04 LTS/24.04 LTS 用户应安装 USN-7703-1 安全更新。如暂时无法升级，可通过限制本地用户访问权限（如禁用不必要的本地登录或调整 PAM 策略）作为临时缓解措施，但此措施仅降低风险，不能完全消除漏洞。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 s390/ism 驱动释放后使用漏洞"
updated = "2026-06-17T08:44:27Z"

