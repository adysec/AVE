[basic]
description = "标签中。<value>Microsoft Indexing Service 的 CiWebHitsFile 组件在处理 .htw 文件请求时，未对 CiRestriction 参数进行充分的输入验证与输出编码，导致存在跨站脚本漏洞。攻击者可通过构造包含恶意 JavaScript 脚本的 CiRestriction 参数的 .htw 请求发送给目标服务器，当用户在浏览器中访问该请求的响应页面时，恶意脚本将在用户会话上下文中执行，从而窃取会话令牌、盗取敏感信息或利用服务器信任关系进行进一步钓鱼攻击。该漏洞影响运行 Windows 2000 且启用 IIS 4/5 及 Indexing Service 的服务器，CVSS v2 评分为 5.1。"
published = "2000-12-19T05:00:00.000"
remediation = "立即安装 Microsoft 发布的安全补丁 MS00-006 (KB245030)，或升级至 Windows 2000 SP2 及以上版本。若无法立即打补丁，在 IIS 管理器中移除 .htw 扩展映射：打开 Internet 服务管理器 → 网站属性 → 主目录 → 配置 → 应用程序映射，删除 .htw 映射至 webhits.dll 的条目，重启 IIS 生效。同时在防火墙层面拦截包含 CiRestriction 参数的 .htw 请求作为临时缓解。"
score = 5.1
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft IIS 索引服务 跨站脚本漏洞"
updated = "2026-06-16T21:52:49.197"

