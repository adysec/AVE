[info]
author = "AVE"
description = "检测 PHP 4.0.5~4.1.0 safe_mode 下 mail() 函数第5个参数命令执行漏洞。通过访问常见 PHP 页面并检查响应内容中的 PHP 版本信息，判断目标是否运行在受影响版本范围内。"
id = "POC-AVE-2001-0381"
name = "PHP 4.x SafeMode mail() 5th Parameter Command Execution PoC"
severity = "high"
tags = [
    "cve-2001-1246",
    "php",
    "safe-mode",
    "mail",
]
vuln_id = [
    "CVE-2001-1246",
    "AVE-2001-0381",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/index.php"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["PHP"]

[[poc.requests]]
method = "GET"
path = "/info.php"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["PHP Version"]
