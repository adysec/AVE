[basic]
description = "Linux 内核 ksmbd（内核 SMB 服务器）中存在 use-after-free 漏洞。由于 ksmbd_work 结构体的 interim_entry 在 oplock 释放后仍可能通过链表被访问，导致释放后的内存被重复使用。攻击者若拥有有效的 SMB 客户端凭据（低权限），可通过发送特制 SMB 请求触发 oplock break 等待，进而利用已释放的内存结构执行任意代码或导致拒绝服务。该漏洞影响所有启用 ksmbd 的 Linux 内核版本，CVSS 评分 8.8，危害等级高。"
published = "2025-04-01T16:15:27Z"
remediation = "建议将 Linux 内核升级至已修复版本：稳定版 6.6.84、6.12.20、6.13.8 或 6.14 及以上版本。Ubuntu 24.04 LTS 用户可通过标准系统更新安装 linux-image-6.8.0-1036.40 或更高版本。如暂无法立即升级，可临时缓解措施为：卸载 ksmbd 内核模块（rmmod ksmbd）并禁用 SMB 服务器功能，或通过防火墙限制 SMB 端口（TCP 445）的入站访问，仅允许可信来源连接。升级后需重启系统以确保新内核生效。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 ksmbd 释放后使用漏洞"
updated = "2026-07-30T06:22:00Z"

