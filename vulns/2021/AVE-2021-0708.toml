[basic]
description = "Pulse Connect Secure 9.0R3/9.1R1 及更高版本存在身份验证绕过漏洞，该漏洞由 Windows File Share Browser 和 Pulse Secure Collaboration 功能暴露，未经身份验证的远程攻击者可利用此漏洞在 Pulse Connect Secure 网关上执行远程任意代码。漏洞根源在于释放后使用（CWE-416）与 improper authentication（CWE-287）的组合，攻击者无需任何凭据即可通过网络远程发起攻击并完全控制设备。该漏洞已在野外被积极利用，CISA 已将其纳入已知被利用漏洞目录（KEV），FireEye/Mandiant 报告了相关 APT 组织的利用行为。影响范围包括 Pulse Connect Secure 9.0R3 及以上版本和 9.1R1 及以上版本。Ivanti（原 Pulse Secure）在 2021 年 5 月发布安全更新 SA44784 修复此漏洞，建议受影响用户立即升级到修复版本并重置所有管理员和用户密码。"
published = "2021-04-23T17:15:08Z"
remediation = "升级到 Pulse Connect Secure 9.1R11.4 或更高版本，同时从 Pulse Secure 官方支持门户下载并导入 Workaround-2104.xml 以立即阻断攻击流量，该 workaround 会禁用 Windows File Share Browser、Pulse Secure Collaboration 和 License Server 功能。升级前请运行 PCS Integrity Assurance 工具检查设备是否存在入侵痕迹，并在管理界面启用 Unauthenticated Requests 日志记录，同时配置远程 Syslog 服务器以防日志被攻击者清除。"
score = 10
severity = "CRITICAL"
sources = ["kev"]
title = "Pulse Secure Pulse Connect Secure 身份验证绕过漏洞"
updated = "2026-06-17T03:37:57Z"

