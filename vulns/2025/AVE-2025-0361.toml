[basic]
description = "Synology DiskStation DS925+ 的 MailPlus 组件中 Redis 实例存在弱加密漏洞。在存储密码时，系统使用可恢复的加密格式处理凭据，导致加密强度不足。未经身份认证的网络邻近攻击者可利用此漏洞恢复敏感凭据信息，进而以 root 权限在目标设备上执行任意代码。该漏洞影响 Synology DSM、SRM、Surveillance Station 等多个产品线，CVSS 评分 8.8，危害等级高。Synology 已在安全公告 Synology_SA_26_11 中发布修复更新。"
published = "2025-01-01T00:00:00Z"
remediation = "立即将 Synology MailPlus Server 升级至修复版本：DSM 7.3 用户升级到 4.0.1-31663 或更高版本，DSM 7.2.2/7.2.1 用户升级到 4.0.1-21663 或更高版本。可通过 Package Center 手动检查更新并安装。该漏洞源于 MailPlus Redis 实例使用弱加密算法存储密码，相邻网络攻击者无需认证即可利用，获取 root 权限执行任意代码。官方未提供临时缓解措施，必须升级修复。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "Synology DiskStation DS925+ MailPlus Redis 弱密码学远程代码执行漏洞"
updated = "2025-01-01T00:00:00Z"

