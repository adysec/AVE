[basic]
description = "Internet Explorer 5.0 至 5.5 版本中存在文件上传表单漏洞，远程攻击者可通过在 HTML 表单中构造恶意的 INPUT TYPE=FILE 元素，诱使用户访问特制网页，从而读取客户端任意文件内容。该漏洞利用条件较低，攻击者只需诱导受害者打开恶意页面即可实施攻击，可能导致敏感信息泄露。由于无需用户交互即可触发文件读取操作，该漏洞在早期浏览器安全防护较弱的背景下影响广泛。"
published = "2001-02-16T05:00:00Z"
remediation = "立即升级至 Internet Explorer 6.0 或更高版本，该漏洞已在 IE 6.0 中修复。由于 IE 5.x 系列已停止技术支持，建议迁移至 Microsoft Edge 或 Chrome 等现代浏览器。如无法升级，可在浏览器安全设置中将「将文件上载到服务器时包含本地目录路径」设为禁用，并启用 Internet 区域保护模式。"
score = 2.6
severity = "LOW"
sources = ["cve"]
title = "Microsoft Internet Explorer 任意文件读取漏洞"
updated = "2026-06-16T21:53:38Z"

