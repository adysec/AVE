[basic]
description = "Node.js Adapter for Hono 存在未授权内存泄漏拒绝服务漏洞。当攻击者向 `upgradeWebSocket` 路由发起缺少或格式错误 `Sec-WebSocket-Key` 头的 WebSocket 升级请求时，握手会在建立连接前被中止，但请求的 `IncomingMessage` 仍被保留在内部映射中且待处理 Promise 永远不会被结算。由于该路由可在握手握手前以无认证方式访问，未认证攻击者可利用此缺陷持续发送大量畸形升级请求，导致内存无限制增长、最终服务不可用。该漏洞仅造成可用性影响，不涉及机密性与完整性破坏，影响所有使用 Hono 内置 WebSocket 适配器的 Node.js 版本，CVSS 评分 5，危害等级中危。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
