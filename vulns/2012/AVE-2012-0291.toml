[basic]
description = "tags.<value>WebKit 浏览器引擎存在内存破坏漏洞，未经身份认证的远程攻击者可构造恶意网站，诱使用户访问特制网页内容触发该漏洞，导致远程代码执行或应用程序崩溃造成拒绝服务。该漏洞影响 Apple Safari 6.0 之前版本、iOS 6.0 以下设备及 iTunes 10.6.3 等使用 WebKit 的产品，攻击者无需任何认证即可远程利用，攻击门槛极低，CVSS 评分 9.3，危害等级严重。"
published = "2012-07-25T20:55:02Z"
remediation = "升级至 iTunes 10.7 或更高版本（Windows），或升级至 Safari 6.0 并安装 OS X Lion v10.7.4（Mac），iOS 设备升级至 iOS 6。如无法立即升级，可暂时避免使用 Safari 或 iTunes 访问未知网站作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:35Z"

