[basic]
description = "Chromium V8 引擎存在越界内存访问漏洞，攻击者可利用特制的 JavaScript 代码触发 V8 引擎中的越界读写操作，导致信息泄露或程序崩溃。该漏洞影响基于 Chromium 的浏览器（包括 Google Chrome 及 Microsoft Edge 等），Microsoft Edge 已在 133.0.3065.69 版本中修复。NVD 标记该漏洞为不可利用，但实际攻击面取决于 V8 引擎的具体上下文。"
published = "2025-02-15T02:15:09Z"
remediation = "更新 Microsoft Edge 至 133.0.3065.69 或更高版本，更新 Google Chrome 至修复此 CVE 的对应版本。对于 Debian 12 系统，应用安全公告 DSA-5866 中的更新。如无法立即更新，可限制对不可信网页的访问作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["msrc"]
title = "Chromium V8 越界内存访问漏洞"
updated = "2025-04-04T16:15:18Z"

