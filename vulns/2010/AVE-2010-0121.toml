[basic]
description = "RealNetworks RealPlayer 11.0 至 11.1、RealPlayer SP 1.0 至 1.1.4、RealPlayer Enterprise 2.1.2 以及 Mac RealPlayer 11.0 至 12.0.0.1444 等版本在解析 AAC 文件中的频谱数据（spectral data）时存在安全缺陷，未对输入数据进行充分验证和处理。未经身份认证的远程攻击者可通过诱使用户打开或播放特制 AAC 音频文件来触发该漏洞，在受影响系统上执行任意代码或造成拒绝服务。该漏洞影响范围涵盖 Windows 和 Mac 平台的多个 RealPlayer 版本，CVSS 评分高达 10.0，危害等级为严重。RealNetworks 已在 RealPlayer 12.0.1.609 及更高版本中修复此问题。"
published = "2010-12-14T16:00:02Z"
remediation = "立即将 RealPlayer 升级至 12.0.1.609 或更高版本，升级前先结束 RealPlayer 进程并通过官网下载安装程序覆盖安装。如暂无法升级，可卸载 RealPlayer 或在浏览器中禁用 RealPlayer ActiveX 控件，同时避免打开来源不明的 AAC 音频文件，并在邮件网关和防火墙中拦截可疑多媒体附件作为临时缓解。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer AAC 谱数据解析远程代码执行漏洞"
updated = "2026-06-16T23:15:31Z"

