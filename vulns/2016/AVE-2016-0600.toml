[basic]
description = "Google Chrome 的 V8 JavaScript 引擎存在优化假设错误漏洞，由于 V8 引擎在代码优化过程中对内存操作边界检查不足，导致越界写入（CWE-787）。远程攻击者可通过诱导用户访问特制的 HTML 页面触发该漏洞，实现任意内存读写操作，进而导致远程代码执行。该漏洞影响 Linux 版 Chrome 54.0.2840.90 之前版本、Android 版 54.0.2840.85 之前版本以及 Windows/Mac 版 54.0.2840.87 之前版本，CVSS 评分 8.8，危害等级高。用户需升级 Chrome 至修复版本以消除风险。"
published = "2017-01-19T05:59:00Z"
remediation = "立即升级 Google Chrome 至 54.0.2840.90（Linux）/ 54.0.2840.85（Android）/ 54.0.2840.87（Windows/Mac）及以上版本，通过 Chrome 自动更新或官网下载安装。使用 Red Hat Enterprise Linux 6 的用户请安装 RHSA-2016-2672 提供的 chromium 更新。该漏洞已被 CISA 列入已知被利用漏洞目录，应优先修复。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Google Chrome V8 引擎远程代码执行漏洞"
updated = "2026-06-17T00:48:57Z"

