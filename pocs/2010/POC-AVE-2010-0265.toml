[info]
author = "ave"
description = "验证 RealNetworks RealPlayer 在解析恶意 AAC 文件时是否存在堆缓冲区溢出漏洞，通过发送特制 AAC 文件触发异常"
id = "POC-AVE-2010-0265"
name = "CVE-2010-4381 PoC"
severity = "high"
tags = ["ave-2010-0265"]
vuln_id = [
    "CVE-2010-4381",
    "AVE-2010-0265",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/test.aac"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
