[basic]
description = "Windows 95/98/ME 的文件和打印共享服务在验证共享密码时存在设计缺陷，仅比较密码的第一个字符而非完整密码。远程攻击者可通过发送单字节密码（匹配真实密码首字符）绕过共享访问控制，实现对受保护共享资源的未授权访问。该漏洞影响 Windows 95、Windows 98 及 Windows Me 系统，CVSS 评分 6.4，危害等级中危。由于这些系统已停止支持，用户应升级至受支持的操作系统版本。"
published = "2000-12-19T05:00:00Z"
remediation = "Windows 9x/Me 已停止支持，无官方补丁。建议立即升级至 Windows 10/11 或 Windows Server 版本；若无法升级，请在网络层面禁用文件与打印机共享服务（NetBIOS over TCP/IP），并在防火墙阻断 TCP 139/445 端口的外部访问。"
score = 6.4
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Windows 95/98/Me 文件与打印共享服务密码绕过漏洞"
updated = "2026-06-16T21:52:54Z"

