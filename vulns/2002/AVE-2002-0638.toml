[basic]
description = "tags.<value>Net-SNMP 及 ucd-snmp 4.2.3 及更早版本中的 snmpnetstat 组件存在基于堆的缓冲区溢出漏洞。攻击者可通过发送多个包含冲突 ifindex 变量的 getnextrequest PDU 消息，触发 snmpnetstat 将变量数据写入数组末尾之外的内存区域，从而在目标系统上执行任意代码。该漏洞无需身份认证即可远程利用，影响 Net-SNMP 和 ucd-snmp 的相关版本，CVSS 评分为 7.5，危害等级为高危。"
published = "2002-01-01"
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Net-SNMP snmpnetstat 远程堆溢出漏洞"
