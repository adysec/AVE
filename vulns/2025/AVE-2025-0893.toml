[basic]
description = "go-git 是一个用纯 Go 语言编写的高度可扩展的 Git 实现库。该库在 v5.13 之前的版本中存在参数注入漏洞，当使用文件传输协议时，程序会调用外部 git 二进制文件，攻击者可通过构造恶意的 URL 字段向 git-upload-pack 命令注入任意参数，从而可能导致未授权的代码执行或数据泄露。该漏洞影响所有使用受影响版本 go-git 且通过文件传输协议进行仓库操作的应用，CVSS v4.0 评分 9.2，危害等级严重。官方已在 go-git 5.13.0 版本中修复此漏洞。"
published = "2025-01-06T17:15:47Z"
remediation = "立即升级 go-git 到 v5.13.0 或更高版本，该版本已修复参数注入漏洞。对于 Go 项目，执行 go get github.com/go-git/go-git/v5@v5.13.0 更新依赖版本，或修改 go.mod 文件将 go-git 依赖版本号设为 v5.13.0 后运行 go mod tidy 重新下载依赖。对于使用其他包管理工具的项目，按对应工具更新 go-git/v5 包至 v5.13.0+。如无法立即升级，可临时在应用层对 file transport protocol 的 URL 参数进行严格白名单校验，过滤或转义包含连字符（-）等特殊字符的 URL，防止注入 git-upload-pack 恶意参数。同时建议在代码审查中排查所有使用 go-git file transport 协议克隆或操作仓库的代码路径，确认 URL 来源可信。"
score = 9.2
severity = "CRITICAL"
sources = ["msrc"]
title = "Go go-git URL 字段参数注入漏洞"
updated = "2026-06-17T08:43:51Z"

