[basic]
description = "Microsoft Access 存在释放后使用（Use-After-Free）漏洞，攻击者可通过诱导用户打开特制的 Access 数据库文件触发该漏洞，成功利用可在当前用户上下文中执行任意代码，实现完全控制受影响系统。该漏洞攻击复杂度低，无需特权，但需要用户交互配合。影响 Microsoft Office 系列产品中的 Access 组件，CVSS 评分 7.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:16:02.463"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新：Access 2016 用户升级至 16.0.5483.1001 及以上版本；Microsoft 365 Apps for Enterprise、Office 2019/2021/2024 LTSC 用户通过 aka.ms/OfficeSecurityReleases 获取更新，或启用 Windows Update 自动推送。临时缓解措施：不要打开来自不可信来源的 Access 数据库文件（.accdb/.mdb），并在受影响的 Office 版本中禁用宏执行。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Access 远程代码执行漏洞"
updated = "2026-06-17T08:43:12.237"

