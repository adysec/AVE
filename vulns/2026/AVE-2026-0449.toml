[basic]
description = "Pillow（Python 图像处理库）在处理 McIdas AREA 格式图像文件时存在越界读取漏洞。当通过文件路径加载未压缩的 McIdas AREA 图像时，攻击者可通过构造特制的图像文件头字段，将行步长（stride）设置为远小于实际行宽的值。由于 map.c 中仅校验 offset + ysize*stride 不超过缓冲区长度，未检查 stride 是否大于等于自然行宽（xsize * pixelsize），导致后续像素访问操作（如 tobytes、getpixel、convert、save）从映射区域外读取相邻进程内存，造成敏感信息泄露或触发 SIGBUS 导致拒绝服务。攻击者只需诱使用户打开恶意构造的 McIdas AREA 图像文件即可触发，无需任何认证。该漏洞影响 Pillow 12.3.0 之前的所有版本。"
published = "2026-07-14T17:17:03Z"
remediation = "立即将 Pillow 升级至 12.3.0 或更高版本（`pip install --upgrade Pillow`），该版本在 `src/map.c` 的 `PyImaging_MapBuffer` 中增加了 `stride >= im->linesize` 校验，并在 `McIdasImagePlugin.py` 中增加了对 `offset` 和 `stride` 的输入验证。如无法立即升级，可临时移除 McIdas 插件支持（删除或重命名 `PIL/McIdasImagePlugin.py`），或避免直接以文件路径方式打开用户上传的 McIdas AREA 图像。"
score = 8.3
severity = "HIGH"
sources = ["ghsa"]
title = "Python Pillow McIdas AREA 文件处理越界读取漏洞"
updated = "2026-07-15T20:08:02Z"

