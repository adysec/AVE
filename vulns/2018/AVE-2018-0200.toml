[basic]
description = "Fortinet FortiOS 和 FortiADC 存在不安全的访问控制漏洞，攻击者可通过将 LDAP 服务器连通性测试请求指向恶意 LDAP 服务器，从而获取 FortiGate 中配置的 LDAP 服务器登录凭据。该漏洞影响 FortiOS 6.0.2、5.6.7 及更早版本，以及 FortiADC 6.1.0、6.0.0~6.0.1、5.4.0~5.4.4 版本。攻击者需具备网络访问能力并搭建恶意 LDAP 服务器触发测试请求，CVSS 评分 4.3，危害等级中危。"
published = "2019-01-22T14:29:00Z"
remediation = "升级 FortiOS 至 6.0.3 及以上版本，FortiADC 升级至 6.1.1 及以上版本。如无法立即升级，在 FortiGate 管理界面中禁用 LDAP 服务器连通性测试功能，或限制仅允许可信 IP 执行 LDAP 诊断操作。"
score = 4.3
severity = "MEDIUM"
sources = ["kev"]
title = "Fortinet FortiOS 访问控制不当导致 LDAP 凭据泄露漏洞"
updated = "2026-06-17T01:39:17Z"

