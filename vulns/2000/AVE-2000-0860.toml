[basic]
description = "Cisco GSR（Gigabit Switch Router）系列路由器上运行 IOS 11.2(15)GS1A 至 11.2(19)GS0.2 及部分 12.0 版本的快速以太网/千兆以太网线卡存在安全绕过漏洞。由于设备未能正确处理线卡故障状态，远程攻击者无需认证即可利用该缺陷绕过 ACL 访问控制列表的过滤规则，或强制接口停止转发数据包，导致拒绝服务。该漏洞影响 Cisco 12008、12012、12016 等 GSR 系列路由器，CVSS 评分 5.0，危害等级中危。"
published = "2000-10-20T04:00:00.000"
remediation = "升级 Cisco IOS 至 12.0(19)GS1 或更高版本，该版本修复了线卡故障处理机制中的 ACL 绕过缺陷；如无法立即升级，可在接口配置模式下启用 `no ip unreachables` 和 `no ip redirects` 命令减少攻击面，同时部署网络访问控制策略限制对受影响 GSR 路由器管理接口的访问。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Cisco Gigabit Switch Router 安全绕过漏洞"
updated = "2026-06-16T21:52:17.820"

