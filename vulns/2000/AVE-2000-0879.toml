[basic]
description = "xpdf PDF 查看器 0.91 版本之前版本在处理嵌入式 URL 时未正确启动 Web 浏览器，未对 URL 中的 Shell 元字符进行过滤和转义，导致攻击者可通过构造包含 Shell 元字符的恶意 PDF 文件，诱导用户打开时触发任意命令执行。该漏洞影响 xpdf 0.91 之前版本，CVSS 评分 7.6（高危），攻击者需诱导受害者打开恶意 PDF 文件，通过嵌入包含 Shell 元字符的 URL 实现远程代码执行，攻击复杂度高但无需认证，可导致机密性、完整性、可用性完全丧失。"
published = "2000-10-20T04:00:00Z"
remediation = "立即升级 xpdf 到 ≥0.91 版本或更高（当前版本 ≥2024 年 release），以修复嵌入 URL 处理漏洞。升级后请验证浏览器插件功能已完全禁用或配置为不自动执行 shell 命令。"
score = 7.6
severity = "HIGH"
sources = ["avd"]
title = "Xpdf PDF查看器 命令注入漏洞"
updated = "2026-06-16T21:52:21Z"

