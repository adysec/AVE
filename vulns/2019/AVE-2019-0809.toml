[basic]
description = "D-Link 多款路由器产品（包括 DIR-655C、DIR-866L、DIR-652、DHP-1565、DIR-855L、DAP-1533、DIR-862L、DIR-615、DIR-835、DIR-825 等）的 PingTest 设备通用网关接口存在操作系统命令注入漏洞。未经身份认证的远程攻击者可通过向该接口发送特制的恶意输入，利用设备未对用户输入进行有效过滤的缺陷，注入任意系统命令并以 root 权限执行，从而导致目标设备完全沦陷。攻击者无需任何认证即可利用该漏洞，攻击复杂度低，可实现对设备的完全控制（机密性、完整性、可用性均遭破坏）。"
published = "2019-09-27T12:15:10Z"
remediation = "建议立即断开受影响 D-Link 路由器（DIR-655C、DIR-866L、DIR-652、DHP-1565、DIR-855L、DAP-1533、DIR-862L、DIR-615、DIR-835、DIR-825）与互联网的连接，这些设备均已停产且厂商不再提供固件更新。请更换为仍在支持周期内的路由器产品。如无法立即更换，须在防火墙侧禁止 WAN 口对设备 80/443 端口的访问，并在设备管理界面中禁用远程管理和 PingTest 功能，同时将设备置于内网隔离区，限制外部访问。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "D-Link 多款路由器命令注入漏洞"
updated = "2026-06-17T02:22:57Z"

