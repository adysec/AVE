[basic]
description = "Jenkins Script Security Plugin 存在沙箱绕过漏洞，该插件在 Groovy 脚本解析、编译和实例化阶段未正确应用沙箱保护机制，攻击者可构造恶意的 Groovy 脚本绕过脚本安全沙箱，在 Jenkins master JVM 上执行任意代码。该漏洞影响 Jenkins Script Security Plugin 1.53 及更早版本，同时波及依赖该插件的多个流行插件，包括 Pipeline: Groovy Plugin、Matrix Project Plugin、Email Extension Plugin、Groovy Plugin 和 Job DSL Plugin。攻击者仅需要具备 Overall/Read 权限（最低读取权限），无需管理员身份即可远程利用此漏洞，通过 Jenkins 的 HTTP 端点（如 descriptorByName CheckScript）提交恶意脚本完成攻击，导致完全失控的远程代码执行。"
published = "2019-03-08T21:29:00Z"
remediation = '将 Jenkins Script Security Plugin 升级到 1.54 或更高版本，同时将依赖脚本安全插件的 Pipeline: Groovy Plugin 升级至 2.64、Groovy Plugin 升级至 2.2、Matrix Project Plugin 升级至 1.14、Email Extension Plugin 升级至 2.65、Job DSL Plugin 升级至 1.72，以彻底修复沙箱绕过漏洞并消除关联插件中的同类风险。升级前先在测试环境中验证插件兼容性，升级后彻底重启 Jenkins 服务，并在 Jenkins 管理界面的"插件"页面确认所有相关插件均已更新至安全版本。临时缓解措施：限制 Overall/Read 权限用户的访问范围，确保只有受信任的用户能够访问 Jenkins 实例。'
score = 9.9
severity = "CRITICAL"
sources = ["kev"]
title = "Jenkins Script Security Plugin 沙箱绕过远程代码执行漏洞"
updated = "2026-06-17T02:09:34Z"

