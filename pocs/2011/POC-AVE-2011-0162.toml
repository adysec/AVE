[info]
author = "ave"
description = "验证目标是否在 Windows 上使用 Direct2D API 时存在跨源数据窃取漏洞，通过 canvas 元素检测同源策略绕过"
id = "POC-AVE-2011-0162"
name = "CVE-2011-2986 PoC"
severity = "medium"
tags = ["ave-2011-0162"]
vuln_id = [
    "CVE-2011-2986",
    "AVE-2011-0162",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Mozilla"]
