[info]
author = "AVE"
description = "检测 Microsoft 恶意软件保护引擎（MsMpEng）是否存在释放后重用漏洞。通过检查 mpengine.dll 版本是否低于修复版本 1.1.13804.0 来判断系统是否受 CVE-2017-8540 影响。"
id = "POC-AVE-2017-1198"
name = "CVE-2017-8540 PoC"
severity = "high"
tags = ["cve-2017-8540"]
vuln_id = [
    "CVE-2017-8540",
    "AVE-2017-1198",
]

[poc]
logic = "all"

[[poc.requests]]
path = 'C:\ProgramData\Microsoft\Windows Defender\Definition Updates\{68ADF7B8-9F5A-4B3A-8F3C-1F8E5C5E5B5E}\mpengine.dll'
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["1.1.13804.0"]
