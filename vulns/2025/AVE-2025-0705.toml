[basic]
description = "Windows 电话服务（Telephony Service）存在堆缓冲区溢出漏洞（CWE-122），由于程序在处理特制 RPC 请求时未正确验证输入数据长度，导致可被利用写入越界内存。未经身份认证的远程攻击者可通过诱导用户访问恶意网站或打开特制文件触发该漏洞，成功利用可在目标系统上以 SYSTEM 权限执行任意代码，实现完全控制受影响的 Windows 系统。该漏洞影响 Windows 10、Windows 11 及 Windows Server 多个版本，CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:41Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新（适用于 Windows 的更新 KB5049984 或对应版本），可通过 Windows Update 自动获取。如无法立即打补丁，可在防火墙层面限制 TAPI 服务（Telephony Service）的网络访问，并禁用不必要的远程桌面入站连接作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:42:53Z"

