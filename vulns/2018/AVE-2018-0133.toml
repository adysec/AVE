[basic]
description = "Planon 房地产与设施管理软件在 Live Build 41 之前版本中存在存储型跨站脚本（XSS）漏洞。攻击者可通过向受影响系统的输入字段注入恶意 JavaScript 代码，当管理员或其他用户访问包含恶意载荷的页面时，脚本将在受害者浏览器中执行，导致敏感信息泄露、会话劫持或页面内容篡改。该漏洞无需身份认证即可触发，但需要用户交互（点击链接或访问特定页面），CVSS 评分 6.1，危害等级中危。"
published = "2019-07-29T23:15:11Z"
remediation = "立即升级 Planon 至 Live Build 41 或更高版本，该版本已修复输入验证缺陷，阻止恶意脚本注入。如无法立即升级，在 Web 应用防火墙（WAF）层面添加规则过滤 `/<script`、`onerror=`、`onload=` 等 XSS 载荷特征，并对所有用户输入实施严格的 HTML 编码输出。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Planon 跨站脚本漏洞"
updated = "2026-06-17T01:47:31Z"

