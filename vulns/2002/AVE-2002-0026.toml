[basic]
description = "GV 系列文档查看器（包括 gv 3.5.8 及更早版本、gvv 1.0.2、ggv 1.99.90、gnome-gv 以及 kdegraphics 中的 kghostview 2.2.2 及更早版本）中存在缓冲区溢出漏洞。当用户使用受影响的查看器打开特制的 PDF 或 PostScript 文件时，程序在处理文件内容时调用了不安全的 sscanf 函数，导致缓冲区边界检查不足，可被利用执行任意代码。攻击者需要诱使用户打开恶意构造的文档文件才能触发该漏洞，本地攻击者利用此漏洞可获得与当前用户相同的权限。"
published = "2002-10-10T04:00:00Z"
remediation = "升级 gv 至 3.5.9 或更高版本，升级 kdegraphics 至 3.0.4 或更高版本。Debian 用户安装 DSA-176/179/182 对应更新包，Red Hat 用户安装 RHSA-2002:207/212/220 提供的 RPM 更新。如无法升级，可应用 KDE 官方补丁 post-2.2.2-kdegraphics-kghostview.diff 修复 kghostview 中的 sscanf 缓冲区溢出问题，并避免使用 gv/gvv/ggv 打开来源不明的 PDF 或 PostScript 文件。"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "GNU GV 及多种 PDF/PostScript 查看器缓冲区溢出漏洞"
updated = "2026-06-16T21:58:13Z"

