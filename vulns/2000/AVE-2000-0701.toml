[basic]
description = 'Avirt Mail 4.0/4.2 邮件服务器在处理 SMTP 协议的 "MAIL FROM:" 和 "RCPT TO:" 命令时存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过发送超长的命令参数触发栈溢出，导致服务拒绝甚至可能执行任意代码。该漏洞影响 Avirt Mail 4.0 和 4.2 版本，CVSS 评分 10.0 属于严重级别，攻击向量为网络、攻击复杂度低、无需认证、完整性/机密性/可用性均受严重影响。攻击者仅需建立 SMTP 连接并发送畸形的 MAIL FROM 或 RCPT TO 命令即可利用，无需用户交互。厂商已停止维护，建议迁移至其他邮件服务器软件或实施网络层访问控制缓解风险。'
published = "2000-12-19T05:00:00Z"
remediation = '''建议升级至 Avirt Mail 5.x 或更高版本，该版本修复了 'Mail From:' 和 'Rcpt To:' 命令的缓冲区溢出漏洞。具体修复步骤包括：1) 下载并安装最新版 Avirt Mail 5.x；2) 在安装完成后立即应用补丁程序；3) 验证服务已重启并加载新版本。升级后，可通过修改注册表项 HKLM\SYSTEM\CurrentControlSet\Services\AvirtMail\Parameters 中的 MaxMailCommandLength 值，将最大邮件命令长度限制为 1024 字节，以进一步降低风险。建议同时关闭不必要的端口和防火墙规则，以提供即时缓解措施。'''
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Avirt Mail 4.0/4.2 拒绝服务"
updated = "2026-06-16T21:52:53Z"

