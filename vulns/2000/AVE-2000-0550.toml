[basic]
description = "HP-UX 10.20 的 FTP 服务程序 ftpd 存在格式化字符串漏洞，远程攻击者无需身份认证即可通过向 PASS 命令发送特制的格式化字符串参数触发该漏洞，导致拒绝服务或任意代码执行。该漏洞 CVSS 评分 10.0，危害等级严重，攻击复杂度低且无需任何权限，可完全控制目标系统。HP 官方已发布安全补丁修复此漏洞。"
published = "2000-10-20T04:00:00.000"
remediation = "立即升级 HP-UX 至 11.00 或更高版本，或安装 HP 官方安全补丁：HP-UX 10.20 安装 PHCO_18345，HP-UX 11.0 安装 PHCO_18346。如无法立即升级，可在 /etc/inetd.conf 中注释掉 ftp 行并执行 inetd -c 重载配置以禁用 FTP 服务，或使用 TCP Wrapper 限制 ftpd 仅允许可信 IP 访问。补丁详情参考 HP 安全公告 HPSBUX0008-104 和 Bugtraq 2000-08-06 公告（http://archives.neohapsis.com/archives/bugtraq/2000-08/0028.html）。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "HP HP-UX FTPD 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:52:17.697"

