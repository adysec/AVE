[basic]
description = "Openfire 的 FaviconServlet.java 存在服务器端请求伪造（SSRF）漏洞，未经身份认证的远程攻击者可利用该漏洞向目标服务器发送任意 HTTP GET 请求，触发服务端对内网地址或外部恶意地址的访问，从而获取敏感信息或实现内网探测。该漏洞影响 Ignite Realtime Openfire 4.4.2 及之前所有版本，CVSS 评分为 9.8，危害等级严重。攻击者无需任何认证即可利用此漏洞，通过构造特制的请求触发服务端向指定 URL 发起 GET 请求，进而读取内网服务响应或与内部系统交互。"
published = "2019-10-24T11:15:10.590"
remediation = "立即将 Openfire 升级至 4.4.3 或更高版本，该版本已在 FaviconServlet.java 中增加响应数据类型校验，仅允许返回图像数据。升级前若无法立即打补丁，可在服务器防火墙层面禁止 Openfire 进程发起出站 HTTP 请求，或在应用层面禁用 FaviconServlet 接口以阻断 SSRF 利用路径。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Ignite Realtime Openfire 服务端请求伪造漏洞"
updated = "2026-06-17T02:24:58.317"

