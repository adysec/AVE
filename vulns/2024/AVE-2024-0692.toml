[basic]
description = "Linux 内核 btrfs 文件系统在 ordered extent（有序区间）记账过程中存在双重记账竞态条件漏洞。当 `btrfs_run_delalloc_range()` 因空间不足（-ENOSPC）等异常失败时，在块大小（4K）小于页大小（64K）的 aarch64 架构上，已分配的 ordered extent 可能被重复释放导致引用计数紊乱，进而触发内核空指针解引用和内核崩溃。本地低权限攻击者可通过触发特定写入路径利用该漏洞实施拒绝服务攻击。该漏洞影响所有使用 btrfs 且 sector size 与 page size 不匹配的 Linux 内核版本，已在主线内核中修复。"
published = "2025-03-12T10:15:16Z"
remediation = "立即将 Linux 内核升级至包含提交 72dad8e377afa（6.14-rc1 及以上）的版本，或更新至已修复的稳定版 6.12.17-1 及以上。对于使用 btrfs 文件系统的 aarch64 架构（块大小 4K、页大小 64K）环境，如无法立即升级内核，建议避免在 btrfs 上执行高并发延迟分配写入操作，或临时改用 xfs/ext4 文件系统作为缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Btrfs 双重记录竞争条件漏洞"
updated = "2026-06-17T08:14:36Z"

