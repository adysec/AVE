[basic]
description = "Ethereal 0.9.11 及更早版本中存在多个 off-by-one（差一错误）漏洞，涉及 AIM、GIOP Gryphon、OSPF、PPTP、Quake、Quake2、Quake3、Rsync、SMB、SMPP 和 TSP 等协议解析器。这些解析器未能正确使用 tvb_get_nstringz 和 tvb_get_nstringz0 函数处理输入数据，导致远程攻击者可通过发送特制的网络数据包触发缓冲区溢出，造成拒绝服务，甚至可能执行任意代码。该漏洞影响范围广泛，CVSS 评分 9.8，危害等级严重。"
published = "2003-06-09T04:00:00Z"
remediation = "立即升级 Ethereal 至 0.9.12 或更高版本。各发行版用户：Debian 安装 dsa-313 更新，Red Hat 安装 RHSA-2003:077 更新，Mandriva 安装 MDKSA-2003:067 更新。如无法升级，建议禁用 Ethereal 中对 AIM、OSPF、SMB 等存在漏洞的协议解析器，或改用 Wireshark 替代。"
score = 9.8
severity = "CRITICAL"
sources = ["redhat"]
title = "Ethereal 多协议解析器越界远程代码执行漏洞"
updated = "2026-06-16T22:02:03Z"

