[basic]
description = "tags.<value>Solaris 8 操作系统中的 FTP 守护进程（in.ftpd）存在堆溢出漏洞。当攻击者构造一个超长路径名并发送 LIST 命令时，FTP 服务会调用 glob() 函数处理该路径，由于 glob() 生成长度异常的长字符串，导致堆缓冲区溢出。未经身份验证的远程攻击者只要能够访问目标系统的 FTP 服务，即可通过发送特制的 LIST 请求触发此漏洞，进而在系统上执行任意命令。该漏洞影响运行 Solaris 8 的主机，CVSS 评分 9.8，危害等级为严重。"
published = "2001-06-18T04:00:00Z"
remediation = "建议将 Solaris 8 系统升级至最新补丁版本，或安装 Sun Microsystems 发布的针对 FTP 守护进程的安全更新。如无法立即升级，建议在 `/etc/inetd.conf` 中禁用 FTP 服务，或使用防火墙限制 21 端口的外部访问以缓解风险。"
score = 9.8
severity = "CRITICAL"
sources = ["epss"]
title = "Sun Solaris 8 FTP 守护进程远程代码执行漏洞"
updated = "2026-06-16T21:53:57Z"

