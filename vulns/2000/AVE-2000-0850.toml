[basic]
description = "Phorum 3.0.7 的 violation.php3 脚本存在参数验证缺陷，远程攻击者可通过构造 Mod 和 ForumName 参数向任意邮件地址发送邮件，将 Phorum 论坛系统滥用作垃圾邮件代理。该漏洞利用无需身份认证，攻击者仅需构造特制 HTTP 请求即可触发，影响所有运行 Phorum 3.0.7 的服务器。CVSS 评分 5.0，危害等级中危，可能导致服务器被列入黑名单或用于发送钓鱼邮件。"
published = "2000-12-31T05:00:00Z"
remediation = '立即升级 Phorum 至 3.1 及以上版本（官方已在 3.1 中修复 violation.php3 参数校验问题）。如无法升级，直接删除或重命名 violation.php3 文件，或通过 Web 服务器配置（如 .htaccess 添加 `RewriteRule ^violation\.php3 - [F,L]`）禁止外部访问该脚本。同时建议迁移至当前最新 Phorum 10.x 版本以获得持续安全支持。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Phorum Phorum 3.0.7 violation.php 任意邮件转发漏洞"
updated = "2026-06-16T21:53:26Z"

