[basic]
description = "Mozilla Firefox 4.x 至 5 版本、SeaMonkey 2.x（2.3 之前）以及 Thunderbird 6.0 之前的版本中，其浏览器引擎在实现 WebGL 功能时存在内存安全漏洞。攻击者可通过诱导用户访问包含恶意 WebGL 代码的精心构造网页，触发内存破坏，导致应用程序崩溃（拒绝服务）或在目标系统中执行任意代码。该漏洞影响范围广泛，涵盖了多款基于 Gecko 引擎的浏览器及客户端。"
published = "2011-08-18T18:55:01Z"
remediation = "建议立即将 Mozilla Thunderbird 升级至 6.0 或更高版本，Firefox 升级至 6.0 或更高版本，以及 SeaMonkey 升级至 2.3 或更高版本，以修复浏览器引擎中的内存安全漏洞并防止远程代码执行。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird 浏览器引擎内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:32:22Z"

