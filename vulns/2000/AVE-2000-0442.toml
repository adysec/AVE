[basic]
description = "BRU 备份软件中存在环境变量处理不当的安全漏洞。本地攻击者可通过设置 BRUEXECLOG 环境变量指定任意配置文件路径，导致程序以提升的权限向任意文件追加数据，从而实现本地权限提升。该漏洞影响 BRU 15.1 及 16.0 版本，攻击者需拥有本地系统访问权限，CVSS 评分 7.2，危害等级高。Exploit-DB 上已有公开利用代码。"
published = "2000-06-05T04:00:00Z"
remediation = "升级 BRU 备份软件至 16.0 之后的安全版本或更高版本，若使用 Caldera OpenLinux 系统则安装补丁包 CSSA-2000-018.0（可从 Caldera 官方安全公告获取）。临时缓解措施：(1) 移除 BRU 可执行文件的 SUID/SGID 权限，执行 chmod u-s /usr/bin/bru 取消特权位；(2) 设置环境变量过滤，在 /etc/environment 或 shell 配置文件中清除 BRUEXECLOG 变量；(3) 通过文件系统挂载选项对 /etc/passwd 等敏感文件设置不可变属性（chattr +i）以防止非授权追加写入。若软件已停用，建议卸载 BRU 并替换为现代备份工具（如 restic、borgbackup）。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "BRU 备份软件 BRUEXECLOG 环境变量本地任意文件写入漏洞"
updated = "2026-06-16T21:51:57Z"

