[basic]
description = "iptables 的 ipq_read 和 ipulog_read 函数在处理内核 netlink 接口消息时缺乏来源验证，本地未授权攻击者可伪造其他用户发送的 netlink 消息，触发 iptables 拒绝服务漏洞。该漏洞影响各类 Linux 发行版中默认部署的 iptables 数据包过滤与日志功能，攻击者需具备本地访问权限即可利用，通过发送伪造消息干扰 iptables 对数据包的正常队列读取与日志记录，导致防火墙规则或日志服务异常中断，影响网络访问控制策略的正常执行。"
published = "2003-12-31T05:00:00Z"
remediation = "建议将 Linux 内核升级至 2.4.21 或 2.6.0 以上版本，或安装发行版厂商提供的内核安全补丁。在无法立即升级内核的情况下，建议通过限制本地非特权用户对 netlink 接口的访问权限来减轻攻击风险。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux iptables 本地拒绝服务漏洞"
updated = "2026-06-16T22:03:05Z"

