[basic]
description = "MediaHouse Software Statistics Server LiveStats 5.2 存在缓冲区溢出漏洞，远程攻击者可通过向目标服务器发送超长的 HTTP GET 请求触发该漏洞，导致任意命令执行。该漏洞影响 MediaHouse Statistics Server 5.02x 版本，攻击者无需身份认证即可远程利用，CVSS 评分 7.5，危害等级高。Exploit-DB 上已有公开利用代码，攻击者可直接获取服务器控制权，造成数据泄露或服务中断。"
published = "2000-10-20T04:00:00.000"
remediation = "立即升级 MediaHouse Statistics Server 至 5.03 或更高版本。如厂商已停止支持该产品，建议迁移至其他受支持的 Web 统计服务。临时缓解措施：在 Web 服务器或网络防火墙上限制对 Statistics Server 的访问来源 IP，并部署 WAF 规则拦截长度超过 2030 字节的 HTTP GET 请求。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "MediaHouse Software Statistics Server LiveStats 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:52:27.433"

