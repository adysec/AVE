[basic]
description = "tags.<value>Quikstore Shopping Cart 的 quikstore.cgi 脚本存在输入验证错误，该脚本采用 Perl 语言编写，用于提供电子商务购物车功能。漏洞产生的原因是代码中使用了不安全的 Perl open() 函数调用形式，远程攻击者无需身份认证即可在 HTTP GET 请求的 URL 部分注入 shell 元字符（如管道符、分号、反引号等），触发 Perl 解释器执行任意系统命令。受影响的包括 Quikstore 2.11.00 之前的所有版本，攻击者可利用该漏洞以 Web 服务器或 CGI 进程的权限执行任意命令，进而完全控制服务器或窃取敏感数据。攻击条件仅需目标服务器运行存在漏洞的 Quikstore 购物车程序并允许外部 HTTP 访问，利用方式为构造包含恶意 shell 元字符的特制 GET 请求 URL。"
published = "2000-11-20T05:00:00Z"
remediation = "升级 Quikstore Shopping Cart 至 2.11.00 或更高版本，该版本已修复 quikstore.cgi 中的输入验证缺陷。如无法立即升级，应将 Web 服务器进程置于 chroot jail 中运行，并删除 Web 目录中不必要的脚本和可执行文件以限制攻击面；同时通过防火墙限制对 CGI 脚本的外部访问。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Quikstore Shopping Cart 远程代码执行漏洞"
updated = "2026-06-16T21:53:24Z"

