[basic]
description = "KTH Kerberos IV 存在任意文件写入漏洞，本地用户可通过票证文件上的符号链接攻击覆盖系统任意文件。攻击者利用 Kerberos 认证过程中创建的临时票证文件，预先建立指向目标文件的符号链接，当特权进程写入票证文件时即可实现任意文件覆盖。该漏洞攻击复杂度较高，需要本地访问权限，且仅影响文件完整性，不涉及机密性和可用性。"
published = "2001-02-16T05:00:00Z"
remediation = "建议立即安装 Red Hat 发布的 RHSA-2001-025 安全更新补丁，该补丁修复了 KTH Kerberos IV 票证文件处理中的符号链接竞争条件问题。如无法升级，可限制本地用户对 Kerberos 临时票证目录的写权限，或使用 umask 确保票证文件创建在安全目录中。由于 KTH Kerberos IV 已停止维护，建议迁移至 MIT Kerberos 或 Heimdal 等现代实现。"
score = 1.2
severity = "LOW"
sources = ["cve"]
title = "KTH Kerberos IV 任意文件写入漏洞"
updated = "2026-06-16T21:53:32Z"

