[basic]
description = "Minicom 1.82.1 及更早版本在部分 Linux 系统中存在符号链接攻击漏洞。minicom 以 setgid uucp 权限运行，在创建捕获文件时未正确检查文件路径的符号链接，本地低权限用户可通过构造符号链接诱使 minicom 在 uucp 组属主权限下创建任意文件，从而实现本地权限提升或文件篡改。该漏洞影响运行 minicom 1.82.1 及之前版本的 Linux 系统，攻击者需拥有本地系统访问权限，无需额外认证即可利用。"
published = "2000-10-20T04:00:00Z"
remediation = "升级 Minicom 至 2.0 或更高版本，该漏洞已在后续版本中修复。如无法升级，可执行 `chmod g-s /usr/bin/minicom` 移除 setgid uucp 权限位，或限制仅受信任用户使用 minicom 命令，防止本地低权限用户通过符号链接攻击创建 uucp 组属主的任意文件。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Minicom Capture-file 符号链接攻击本地提权漏洞"
updated = "2026-06-16T21:52:17Z"

