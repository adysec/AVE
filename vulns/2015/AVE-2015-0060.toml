[basic]
description = "WordPress 的 Calls to Action 插件 2.5.1 之前版本中存在多处反射型跨站脚本漏洞。远程攻击者无需身份认证即可通过向 wp-admin/edit.php 页面的 open-tab 参数或 ab-testing-call-to-action-example/ 页面的 wp-cta-variation-id 参数注入恶意 Web 脚本或 HTML 代码，当管理员访问特制链接时脚本将在浏览器中执行，导致敏感信息泄露或会话劫持。该漏洞影响 Calls to Action 插件 2.5.0 及更早版本，CVSS 评分 6.1，危害等级中危。"
published = "2017-09-11T20:29:00Z"
remediation = '立即将 WordPress Calls to Action 插件升级至 2.5.1 或更高版本。在 WordPress 后台插件管理页面搜索 "Calls to Action" 并点击更新，或手动下载最新版本替换。如无法立即升级，可暂时禁用该插件，并在 Web 应用防火墙（WAF）中添加规则过滤 `open-tab` 和 `wp-cta-variation-id` 参数中的恶意脚本内容作为临时缓解措施。'
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Calls to Action 插件跨站脚本漏洞"
updated = "2026-06-17T00:34:21Z"

