[basic]
description = "GnoRPM（GNOME RPM 包管理工具）0.95 之前版本存在符号链接攻击漏洞。本地攻击者可通过在临时目录中创建恶意符号链接，诱使 GnoRPM 在处理 RPM 包时以 root 权限覆盖或修改系统任意文件，从而实现本地权限提升。该漏洞影响 GnoRPM 0.95 之前所有版本，CVSS 评分 7.2，危害等级高。攻击者需具备本地用户权限，利用难度较低。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 GnoRPM 至 0.95 或更高版本。Red Hat Linux 用户安装 RHSA-2000-072 提供的更新包；Mandrake Linux 用户安装 MDKSA-2000-055 提供的更新包。如无法升级，避免在受影响的系统上允许不可信本地用户登录。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Red Hat GnoRPM 符号链接攻击本地提权漏洞"
updated = "2026-06-16T21:52:49.983"

