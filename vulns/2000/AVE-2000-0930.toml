[basic]
description = "Netscape Communicator 4.75 及更早版本的 HTML 解析器存在缓冲区溢出漏洞。远程攻击者可在表单密码字段中构造超长字符串，诱使用户访问包含恶意表单的网页，从而触发缓冲区溢出并在目标系统上执行任意命令。该漏洞影响所有使用旧版 Netscape Navigator 和 Communicator 的客户端及服务器系统，攻击者无需身份认证即可利用，一旦成功即可完全控制受影响主机。"
published = "2001-01-09T05:00:00Z"
remediation = "由于 Netscape Navigator 4.75 及更早版本已停止维护，建议用户立即停止使用该过时浏览器，并迁移至现代且安全的浏览器（如 Firefox 或 Chrome）。若必须在受控环境下运行，应禁用 HTML 表单中的长密码输入以缓解风险。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Netscape Communicator Navigator HTML解析器缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:20Z"

