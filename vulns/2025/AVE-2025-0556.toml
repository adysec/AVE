[basic]
description = "kube-controller-manager 在使用内置 Portworx StorageClass 时存在半盲服务端请求伪造（SSRF）漏洞。该漏洞允许已授权用户通过构造恶意 StorageClass 配置，诱导 kube-controller-manager 向控制平面主机网络中未受保护的端点（包括链路本地或环回服务）发起请求，从而泄露任意敏感信息。该漏洞影响使用内置 Portworx StorageClass 的 Kubernetes 集群，CVSS 评分 5.8（中等危害），攻击向量为网络，攻击复杂度高，需要高权限且无需用户交互，影响范围扩大至控制平面，仅影响机密性。攻击者需具备授权用户权限，通过构造恶意存储类配置触发 SSRF 实现内部端点信息泄露。建议升级至修复版本或禁用内置 Portworx StorageClass。"
published = "2025-12-14T22:15:36Z"
remediation = "建议立即升级 Kubernetes 到 1.31.0 及以上版本（已修复 Portworx in-tree 存储插件的 SSRF 漏洞），或迁移至 Portworx CSI 驱动替代 in-tree 插件。若暂时无法升级，可通过网络策略限制 kube-controller-manager 对链路本地/回环地址的访问，或在网络策略中禁止 Pod 访问 169.254.0.0/16 和 127.0.0.0/8 网段作为临时缓解措施。"
score = 5.8
severity = "MEDIUM"
sources = ["msrc"]
title = "Portworx kube-controller-manager 半盲 SSRF 漏洞"
updated = "2026-06-17T08:33:51Z"

