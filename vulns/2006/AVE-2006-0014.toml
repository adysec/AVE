[basic]
description = 'PHP 5.3.4 之前版本中存在空字节注入漏洞，由于对路径名中的 \0（空字节）字符过滤不严，攻击者可通过在文件路径中插入空字节及伪造的安全扩展名绕过访问限制，例如在 file_exists 函数参数末尾使用 .php\0.jpg 绕过文件类型检查。该漏洞影响 PHP 5.3.4 之前所有版本，攻击者无需认证即可远程利用，CVSS 评分 5.0，危害等级中等，可能导致敏感文件被非法访问。'
published = "2011-01-18T20:00:10.580"
remediation = '升级 PHP 至 5.3.4 或更高版本，该版本修复了路径名中空字符（\0）导致的安全限制绕过问题。如无法立即升级，可在应用层对用户输入的文件名进行过滤，拒绝包含空字符（\0）的路径，并对上传文件扩展名做严格白名单校验。'
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "PHP PHP 路径名NULL字节注入安全限制绕过漏洞"
updated = "2026-06-16T22:34:39.017"

