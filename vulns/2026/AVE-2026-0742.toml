[basic]
description = "Cedar-Java 是开源 Java 实现的 Cedar 策略语言，用于细粒度授权决策。其 EntityIdentifier.equals() 方法存在空引用与自身引用判断逻辑反转的漏洞，导致比较 null 时意外返回 true，比较自身时反而返回 false。该漏洞虽然不影响 Cedar 本身通过 Rust 实现的授权决策计算，但会影响直接调用该方法进行实体标识符相等性比较的集成方，可能导致策略执行出现错误判断。该漏洞影响所有 4.9.0 之前的 Cedar-Java 版本，攻击者需具备一定权限访问使用该库的应用程序方可触发。已在版本 4.9.0 中修复此问题，建议立即升级至最新版本，同时 fork 或衍生的代码也应同步合并修复补丁，对安全敏感的相等性比较可临时采用其他校验方式作为缓解措施。"
published = "2026-07-13T20:16:48Z"
remediation = "立即将 CedarJava 升级到 4.9.0 或更高版本，并检查所有 fork 或衍生代码，确保包含新的修复补丁。在升级完成前，避免在安全敏感场景中使用 EntityIdentifier.equals() 方法进行相等性比较，改用其他可靠的比较逻辑作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["ghsa"]
title = "Cedar-Java 实体标识符相等性比较错误漏洞"
updated = "2026-07-14T15:17:04Z"

