[info]
author = "ave"
description = "Jenkins CLI jar 任意文件读取漏洞，攻击者可通过 Jenkins CLI 下载恶意 jar 包并触发反序列化，实现远程代码执行。"
id = "POC-AVE-2018-0018"
name = "PoC for CVE-2018-1000129"
severity = "medium"
tags = [
    "cve-2018-1000129",
    "ave-2018-0018",
]
vuln_id = [
    "CVE-2018-1000129",
    "AVE-2018-0018",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/cliJar"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["jar"]
