[basic]
description = "ncurses 5.0 及 Red Hat Linux 中使用的 ncurses4 兼容包存在缓冲区溢出漏洞，该漏洞与物理光标移动和滚动相关的例程有关。攻击者利用此漏洞可在本地系统上提升权限，从而以更高权限执行任意代码。该漏洞影响使用 ncurses 5.0 及 ncurses4 兼容包的 Red Hat Linux 系统，CVSS 评分为 7.2，属于高危级别。本地攻击者可借助精心构造的输入触发缓冲区溢出，突破权限限制，进而控制受影响的系统。Red Hat 后续发布了安全公告（DSA-113）提供修复信息。"
published = "2002-03-08T05:00:00Z"
remediation = "升级 ncurses 至 5.2 及以上版本。Red Hat Linux 用户安装 RHSA-2002:039 提供的更新包；Debian 用户安装 DSA-113 提供的 libncurses5 更新包。如无法升级，移除 ncurses4 兼容包（ncurses-compat-libs）的 setuid 权限作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["redhat"]
title = "GNU ncurses 缓冲区溢出权限提升漏洞"
updated = "2026-07-23T18:58:25Z"

