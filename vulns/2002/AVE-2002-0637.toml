[basic]
description = "tags.<value>Apache Tomcat 4.1 存在跨站脚本（XSS）漏洞，攻击者可通过构造包含编码换行符的 URL 并请求名称中嵌入恶意脚本的 .jsp 文件，触发服务器返回包含恶意脚本的响应。未经身份认证的远程攻击者可利用此漏洞窃取用户 Cookie 或执行任意 Web 脚本。该漏洞影响 Apache Tomcat 4.1 版本，CVSS 评分为 6.8，危害等级中等。"
published = "2003-10-06T04:00:00.000"
remediation = "升级到 Apache Tomcat 5.5.x 或更高版本，该版本已修复 URL 编码换行符触发的跨站脚本漏洞。临时缓解：在前端 WAF 过滤包含 %0a/%0d 编码换行符的请求，并限制 .jsp 文件的直接访问权限。"
score = 6.8
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Apache Tomcat 跨站脚本攻击漏洞"
updated = "2026-06-16T21:59:34.050"

