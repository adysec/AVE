[basic]
description = "Zabbix 监控系统 2.2.x 版本（低于 2.2.14）及 3.0.x 版本（低于 3.0.4）的 latest.php 页面中存在 SQL 注入漏洞。该漏洞源于程序对 toggle_ids 数组参数缺乏有效的过滤和转义处理，未经身份认证的远程攻击者可通过向目标 Zabbix 服务器的 latest.php 页面发送特制的 HTTP 请求，在 toggle_ids 参数中构造恶意 SQL 语句，从而绕过认证机制执行任意 SQL 命令。成功利用该漏洞可导致攻击者窃取敏感数据（如管理员密码哈希）、篡改监控配置、甚至获取服务器操作系统控制权限。该漏洞无需任何权限即可远程触发，攻击复杂度低，CVSS 评分 9.8，危害等级为严重。"
published = "2017-02-17T02:59:10Z"
remediation = "立即升级 Zabbix 至 2.2.14 及以上版本，或 3.0.4 及以上版本。如无法立即升级，可在 Web 服务器（Nginx/Apache）层面限制对 `latest.php` 的访问，仅允许受信 IP 段访问 Zabbix 前端页面，并启用 Web 应用防火墙（WAF）拦截 SQL 注入特征请求。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Zabbix latest.php SQL注入漏洞"
updated = "2026-06-17T00:39:07Z"

