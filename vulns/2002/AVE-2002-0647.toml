[basic]
description = "RealNetworks Helix Universal Server 存在多个缓冲区溢出漏洞，未经身份认证的远程攻击者可通过发送特制网络请求触发漏洞并执行任意代码。具体利用方式包括：向目标服务器发送包含过长Transport字段的RTSP SETUP请求、发送带有超长URL参数的RTSP DESCRIBE请求，或同时发送两个包含过长参数的HTTP GET请求。该漏洞影响运行Windows平台的RealServer 8.0.2以下版本及Helix Universal Server 9.0（9.0.2.768）等版本，攻击者可利用其实现远程代码执行，危害等级为高危。"
published = "2002-12-19T05:00:00.000"
remediation = "立即升级 RealServer 至 8.0.2.299 或更高版本，升级 Helix Universal Server 至官方修复版本。临时缓解措施：在防火墙层面限制对 554/RTSP 和 80/HTTP 端口的访问，仅允许可信 IP 连接，并过滤 RTSP SETUP 与 DESCRIBE 请求中的超长参数，防止缓冲区溢出被利用。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "RealNetworks RealServer 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:59:42.637"

