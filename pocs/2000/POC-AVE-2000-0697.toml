[info]
author = "AVE"
description = "检测目标 Sun HotJava Browser 3.0 是否存在任意 DOM 访问漏洞。通过构造包含 javascript: URL 的恶意页面，在命名窗口中打开目标网页，绕过同源策略跨域读取 DOM 内容。"
id = "POC-AVE-2000-0697"
name = "Sun HotJava Browser 3 Arbitrary DOM Access PoC"
severity = "medium"
tags = [
    "cve-2000-0958",
    "dom-access",
    "hotjava",
]
vuln_id = [
    "CVE-2000-0958",
    "AVE-2000-0697",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "HotJava",
    "DOM accessed successfully",
]
