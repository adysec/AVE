[basic]
description = "IBM DB2 Universal Database 6.1 在安装过程中会创建具有默认用户名和密码的数据库账户，远程攻击者无需身份认证即可利用这些已知的默认凭据直接登录数据库系统，获取数据的读取、修改权限，甚至执行任意 SQL 命令。该漏洞影响 IBM DB2 for Linux 6.1 及 Windows NT 6.1 版本，攻击者只需知道默认账户信息即可远程利用，无需特殊权限或用户交互，危害严重。官方建议在安装后立即修改默认账户密码或禁用默认账户。"
published = "2001-02-16T05:00:00Z"
remediation = "立即修改 IBM DB2 Universal Database 中所有默认账户的密码，删除或禁用不使用的默认账户。如无法修改密码，应升级至不再使用默认凭据的 DB2 版本（7.x 及以上），并在防火墙层面限制对数据库端口的未授权访问。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "IBM DB2 Universal Database 默认账户密码漏洞"
updated = "2026-06-16T21:53:33Z"

