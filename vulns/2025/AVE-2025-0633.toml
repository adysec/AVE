[basic]
description = "ClamAV PDF 扫描引擎在处理 PDF 文件时存在缓冲区溢出漏洞（CWE-122）。由于内存缓冲区分配不当，未经身份认证的远程攻击者可通过向目标设备提交特制的 PDF 文件触发该漏洞，导致 ClamAV 扫描进程崩溃并造成拒绝服务（DoS）条件。虽然尚未被证实，但攻击者也有可能利用该缓冲区溢出漏洞以 ClamAV 进程权限执行任意代码。该漏洞影响 ClamAV 1.4.3 及之前版本，CVSS 评分 9.8，危害等级严重。"
published = "2025-06-18T18:15:23Z"
remediation = "立即将 ClamAV 升级至 1.4.3 或 1.0.9 版本（分别对应 1.4.x 和 1.0.x LTS 分支），可从 clamav.net/downloads 或 GitHub Releases 获取。如无法立即升级，可在 clamd.conf 中将 MaxFileSize 设为 1000M 以下且 MaxScanSize 设为 1024M 以下作为临时缓解措施。Debian 用户可通过 apt update && apt upgrade 安装安全更新。"
score = 9.8
severity = "CRITICAL"
sources = ["msrc"]
title = "ClamAV PDF扫描缓冲区溢出漏洞"
updated = "2026-06-17T08:41:12Z"

