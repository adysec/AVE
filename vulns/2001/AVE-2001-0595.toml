[basic]
description = 'Alt-N MDaemon 3.5.0 及更早版本中的 Webconfig、IMAP 等服务存在拒绝服务漏洞。远程攻击者可通过向目标服务发送以 "\r\n" 字符串结尾的超长 URL，触发服务崩溃或拒绝响应。该漏洞无需身份认证即可利用，影响所有运行 MDaemon 3.5.0 及之前版本的服务器，攻击者只需通过网络即可触发。'
published = "2001-02-12T05:00:00.000"
remediation = "立即升级至 Alt-N MDaemon 4.0 或更高版本，该版本修复了长 URL 处理漏洞。 alternatively，可配置服务拒绝超长 URL 请求（限制≤1024 字节），并在防火墙上启用IP协议过滤以阻止恶意长URL攻击流量。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Alt-N MDaemon 拒绝服务漏洞"
updated = "2026-06-16T21:53:35.283"

