[basic]
description = "KeyFocus KF Web Server 1.0.2 存在目录遍历漏洞，远程攻击者无需身份认证即可通过向服务器发送包含 %00（空字节）的恶意 HTTP 请求，绕过访问控制限制，列出服务器上的任意目录内容并读取受限文件。该漏洞源于服务器对用户输入路径中的空字节处理不当，导致路径检查被截断，从而泄露敏感文件信息。CVSS 评分 5.0，危害等级中危。"
published = "2002-10-04T04:00:00.000"
remediation = "立即升级 KF Web Server 至最新版本（从 http://www.keyfocus.net/kfws/support/ 下载），该漏洞已在 1.0.2 之后的版本中修复。如无法升级，在 Web 服务器前端部署反向代理或 WAF，拦截包含 %00（空字节）的 HTTP 请求；同时在 KF Web Server 的目录安全设置中，对敏感目录启用访问控制，禁止目录列表功能。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Key Focus KF Web Server 目录内容泄露漏洞"
updated = "2026-06-16T21:58:35.950"

