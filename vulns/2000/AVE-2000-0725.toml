[basic]
description = "Hilgraeve HyperTerminal 6.0 客户端在处理超长 telnet:// URL 时存在缓冲区溢出漏洞。远程攻击者可通过向目标用户发送特制的 telnet 链接，当用户点击该链接时触发缓冲区溢出，从而在目标系统上执行任意代码。该漏洞影响 Windows 98、ME 和 2000 系统上安装的 HyperTerminal 6.0 版本，CVSS 评分 7.5，危害等级高。目前该产品已停止维护，建议用户卸载 HyperTerminal 或升级到替代产品。"
published = "2000-12-19T05:00:00Z"
remediation = "安装 Microsoft 安全公告 MS00-079 提供的补丁，或升级到不受影响的 Windows XP 及以上版本。如无法打补丁，可删除或重命名 HyperTerminal 程序文件 hypertrm.exe，或通过组策略禁用 Telnet 协议处理程序关联，避免浏览器自动调用 HyperTerminal 处理 telnet:// 链接。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Hilgraeve HyperTerminal Telnet 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:55Z"

