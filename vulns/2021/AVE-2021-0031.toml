[basic]
description = "Google Android 系统中 MFC（多用途充电）驱动程序的竞争条件漏洞，导致使用后释放（Use After Free）安全问题。本地攻击者在获得 radio 权限后，可通过与内核驱动并发操作的竞争条件触发此漏洞，实现对设备内存的任意写入，最终可能导致权限提升或远程代码执行。该漏洞影响 Samsung Mobile 运行 Android 8.1/9.0/10.0/11.0 的移动设备，CVSS v3.1 评分 6.4，攻击复杂度高，需本地高权限及物理接触条件。CISA 已将 CVE-2021-25394 列入已知被利用漏洞目录。Samsung 在 2021 年 5 月安全更新（SMR MAY-2021 Release 1）中已修复此漏洞，建议受影响用户及时升级系统版本。"
published = "2021-06-11T15:15:08Z"
remediation = "立即将三星移动设备升级至 SMR MAY-2021 Release 1 或更高版本的月度安全更新，以修复 MFC charger driver 中的竞争条件漏洞。具体操作：进入「设置」→「软件更新」→「下载并安装」补丁；如无法升级，请在防火墙或内核层面限制对 MFC charger 驱动模块的未授权访问权限，并禁用不必要的 radio 相关权限，降低 radio 权限被窃取后被利用的风险。"
score = 6.4
severity = "MEDIUM"
sources = ["kev"]
title = "Samsung Android MFC charger driver 竞争条件释放后使用漏洞"
updated = "2026-06-17T03:42:00Z"

