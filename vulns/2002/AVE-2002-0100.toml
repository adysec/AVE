[basic]
description = "Wget 1.8.1 的 url_filename 函数存在缓冲区溢出漏洞，远程攻击者可通过向目标系统发送包含超长 URL 的 HTTP 请求触发该漏洞，导致 wget 进程发生段错误（segmentation fault），造成拒绝服务，在特定条件下可能实现任意代码执行。该漏洞影响 Wget 1.8.1 及更早版本，攻击者无需身份认证即可远程利用，危害较大。"
published = "2003-06-16T04:00:00Z"
remediation = "立即升级 wget 至 1.8.2 及以上版本。Debian 用户执行 apt-get update && apt-get install wget 更新至 1.8.2-3；Red Hat 用户安装 RHSA-2003:372 提供的更新包；SCO OpenLinux 用户应用 CSSA-2003-003.0 补丁。如无法升级，可在网络边界或应用层限制 URL 长度，避免传递超长 URL 触发缓冲区溢出。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "GNU wget url_filename 函数缓冲区溢出漏洞"
updated = "2026-06-16T21:59:33Z"

