[basic]
description = "Oracle WebLogic Server 的 Web Services 子组件（wls9_async_response 包）存在反序列化漏洞，未经身份认证的远程攻击者可通过网络向目标服务器发送特制的 HTTP SOAP 请求，利用反序列化过程触发任意代码执行，进而完全接管 WebLogic Server。该漏洞影响 Oracle WebLogic Server 10.3.6.0.0 和 12.1.3.0.0 版本，攻击者仅需访问 WebLogic 的 HTTP 端口（默认 7001）即可发起攻击，无需任何凭据。Oracle 已在 2019 年 4 月关键补丁更新中修复此漏洞，CISA 亦将其列入已知被利用漏洞目录，CVSS v3.1 评分 9.8，危害等级严重。"
published = "2019-04-27"
remediation = "立即升级Oracle WebLogic Server到21.1.1.0及以上版本，该版本修复了wls9-async组件命令执行漏洞。如无法立即升级，可通过控制台禁用wls9-async组件并加强认证机制作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Oracle WebLogic wls9-async 远程代码执行漏洞"
updated = "2019-04-27"

