Let me write a clean description.<value>Apple Safari 6.0 之前版本所使用的 WebKit 中存在内存破坏漏洞。该漏洞源于 WebKit 在处理恶意构造的网页内容时存在内存处理缺陷。远程攻击者可借助特制网站诱导受害者访问来触发漏洞，成功利用后可导致任意代码执行，或造成内存破坏及应用程序崩溃（即拒绝服务）。攻击无需用户认证，但需目标用户以受影响的 Safari 浏览器访问恶意网页。Apple 已于 2012 年 7 月 25 日通过安全更新（APPLE-SA-2012-07-25-1）修复该问题，涉及 Safari 及内置 WebKit 的 iTunes 10.6.3，建议用户升级至 Safari 6.0 及以上版本。
'''
published = "2012-07-25T20:55:02.507"
remediation = "tags.<value>立即升级 Apple Safari 至 6.0 及以上版本，OS X Lion 用户可通过系统软件更新或苹果官方支持页（https://support.apple.com/kb/HT5485、HT5400）安装更新以修复 WebKit 内存破坏漏洞；iOS 用户请升级至 6.0 版本。Windows 平台若使用旧版 Safari 的内置 WebKit，应卸载旧版并安装含修复 WebKit 的 iTunes 10.6.3 之后版本。如无法立即升级，可暂时改用 Chrome 或 Firefox 浏览不受信任的网页，并在浏览器中禁用 JavaScript 与插件、避免访问来历不明的站点，以降低恶意网页触发内存破坏、导致任意代码执行或拒绝服务的风险。"
