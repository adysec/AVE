[basic]
description = "PHP 4.0.5 至 4.1.0 版本在安全模式下，mail() 函数的第5个参数无法正确过滤用户输入中的 shell 元字符，导致攻击者可通过向该参数注入 shell 命令来执行任意系统命令。该漏洞影响使用安全模式的 PHP 4.x 系统，攻击者可借此在目标服务器上执行 malicious 代码。攻击条件为目标系统启用了 PHP 安全模式且 mail() 函数接收未经过 proper 过滤的第5个参数。利用方式是构造包含 shell 命令的邮件参数并调用 mail() 函数，即可触发命令执行漏洞，导致服务器安全受损。"
published = "2001-06-30T04:00:00.000"
remediation = "建议立即升级至 PHP 4.1.1 或更高版本（建议升级至 PHP 4.2.0+ 彻底移除 safe_mode）。无法升级时，在 php.ini 中设置 disable_functions = mail 禁用 mail() 函数，或设置 safe_mode = Off 关闭安全模式。临时缓解可在 Web 服务器层面（如 Apache httpd.conf）限制 mail() 第 5 参数传递，或使用 mod_security 规则拦截包含 shell 元字符的 mail() 调用。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "PHP mail() 函数命令注入漏洞"
updated = "2026-06-16T21:55:53.293"

