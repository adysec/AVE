[basic]
description = "Unify eWave ServletExec 存在大小写敏感性处理不当漏洞（CWE-178），远程攻击者可通过请求大写扩展名的 JSP URL（如 .JSP 而非 .jsp）绕过 Servlet 容器的源代码保护机制，直接获取 JSP 源代码。该漏洞影响使用 Unify eWave ServletExec 的 Web 应用服务器，CVSS 3.1 评分 7.5（HIGH），攻击向量为网络（AV:N），攻击复杂度低（AC:L），无需权限（PR:N）和用户交互（UI:N），仅影响机密性（C:H）。攻击者无需认证即可通过简单的 HTTP GET 请求获取 JSP 源代码，可能导致敏感业务逻辑、数据库连接信息、密钥等敏感信息泄露。该漏洞源于 Servlet 容器对文件扩展名大小写处理不一致，导致 JSP 编译处理被绕过，直接返回源文件内容。建议升级到修复版本或配置 Web 服务器规范化 URL 大小写处理。"
published = "2000-06-08T04:00:00Z"
remediation = "建议立即升级 Unify eWave ServletExec 至官方修复版本（建议升级至 4.2 或更高版本）。配置 Web 服务器（如 Apache/IIS）强制规范化 URL 路径大小写，或在 Servlet 容器中配置大小写不敏感的 JSP 映射。部署 WAF 规则拦截包含大写 .JSP、.Jsp 等变体扩展名的请求。配置 Web 服务器禁止直接访问 .jsp 源文件（仅允许编译后的类访问）。部署 Web 应用防火墙监控异常源码访问请求，并记录审计日志用于事后溯源。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Unify eWave ServletExec JSP源代码泄露漏洞"
updated = "2026-06-16T21:51:51Z"

