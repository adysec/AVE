[basic]
description = "Debian GNU/Linux 中 fshd（fsh daemon）存在符号链接竞争条件漏洞。该守护进程在处理文件操作时未充分验证符号链接目标路径，本地攻击者可通过在目标文件路径上预先创建符号链接，诱使 fshd 误将数据写入受害者用户的文件，实现文件覆盖。此漏洞攻击复杂度低，无需认证，可导致机密性、完整性和可用性部分受损。"
published = "2001-01-09T05:00:00Z"
remediation = "安装 fsh 1.0.post.4-1 或更高版本（该版本已修复符号链接竞争条件），可通过 Debian 安全公告 20001130 获取更新。由于 fsh 已从 Debian 仓库移除且停止维护，建议彻底卸载 fsh 并迁移至 SSH 进行远程命令执行（如 `ssh -f` 替代 `fsh`）。临时缓解措施：限制本地用户对 fshd 的调用权限，避免在多用户环境下使用 fshd。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "Debian GNU/Linux fshd 本地符号链接攻击文件覆盖漏洞"
updated = "2026-06-16T21:53:13Z"

