[basic]
description = "Linux 内核网络子系统存在引用计数管理不当漏洞。在内核套接字（kernel socket）生命周期跟踪机制中，套接字在 pernet_operations->exit() 期间被拆除时，其释放可能因 qdisc 或设备队列中仍存有待发送数据包而被延迟，导致引用计数错误并触发 use-after-free 条件。该漏洞影响所有支持网络命名空间的 Linux 内核版本，本地低权限攻击者可通过在受影响的网络命名空间中执行特制操作，利用该漏洞实现本地权限提升，获取内核级执行权限。漏洞成因在于内核未正确持有 net->passive 引用，导致网络命名空间清理过程中出现引用计数失衡。"
published = "2025-03-27T15:15:56Z"
remediation = "升级 Linux 内核至已修复版本：Ubuntu 24.04 LTS 执行 apt update && apt install linux-image-generic -y 安装 6.8.0-100.100 或更高版本后重启；Debian 13 升级至 6.13.6 以后版本；RHEL/CentOS Stream 升级至 6.14 或更高版本。临时缓解：执行 sysctl user.max_user_namespaces=0 或编辑 /etc/sysctl.conf 添加 user.max_user_namespaces=0 后执行 sysctl -p，限制非特权用户创建网络命名空间以降低本地攻击面。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核网络子系统引用计数漏洞"
updated = "2026-07-30T06:21:54Z"

