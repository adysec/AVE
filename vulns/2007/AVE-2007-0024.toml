[basic]
description = "Adobe Flash Player 9.0.47.0 至 9.0.124.0 及更早版本中的 ActionScript 3 存在安全绕过漏洞，远程攻击者可构造恶意 SWF 文件诱导用户访问，该文件利用 SecurityErrorEvent 错误响应的时间差来判断目标主机的端口开放状态，从而绕过 Flash 安全沙箱模型，导致敏感信息泄露并实现对任意主机的端口扫描。虽然 9.0.115.0 版本引入了临时缓解措施，但并未彻底修复该漏洞，攻击者无需身份认证即可在用户浏览恶意网页时触发利用，CVSS v3 评分为 5.0，危害等级为中等。"
published = "2007-08-14T00:17:00Z"
remediation = "将 Adobe Flash Player 升级至 9.0.115.0 或更高版本，该版本修复了 ActionScript 3 安全沙箱绕过漏洞，可阻止攻击者通过 SWF 文件进行端口扫描和信息泄露。对于 Windows 系统，可通过 Adobe 官方网站下载对应平台安装包覆盖安装；对于浏览器嵌入版本，需确保浏览器自动更新或手动更新浏览器自带的 Flash 插件。如当前环境仍在使用 9.0.124.0 或更早版本，强烈建议立即执行升级，因为该版本引入了完整的修复补丁而非临时规避措施。此外，Adobe Flash Player 已于 2020 年 12 月 31 日终止支持，建议评估业务是否仍依赖 Flash 内容，如有必要应迁移至 HTML5 等现代 Web 技术并彻底卸载 Flash Player，以消除潜在安全风险。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Adobe Flash Player ActionScript3 安全沙盒绕过信息泄露漏洞"
updated = "2026-06-16T22:43:48Z"

