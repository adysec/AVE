[basic]
description = "RealNetworks RealPlayer 包含一个跨区域脚本攻击漏洞，影响 ActiveX 控件中的 HandleAction 方法。攻击者可通过向目标系统发送包含本地文件的 NavigateToURL 动作利用此漏洞，在 Local Zone 中注入任意 Web 脚本或 HTML 代码。该漏洞影响 RealPlayer 11.0 至 11.1 版本、SP 1.0 至 1.1.5 版本以及 Enterprise 2.1.2 版本。利用此漏洞，攻击者可以执行恶意代码，窃取用户数据，或破坏系统安全。Microsoft 已经在安全更新中修复了此漏洞，用户应及时更新 RealPlayer 到安全版本。"
published = "2010-12-14T16:00:05Z"
remediation = "立即升级 RealPlayer 至 12.0.1.609 或更高版本，该版本修复了包括 CVE-2010-4396 在内的多个安全漏洞。如无法升级，可在浏览器中禁用 RealPlayer ActiveX 控件（将 killbit 注册表项设置为 1，CLSID 为 FDC7A535-4070-4B92-A5F6-5F5DB0B5E23D），并配置 Internet 安全区域为高等级以阻止 ActiveX 脚本执行。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "RealNetworks RealPlayer HandleAction方法跨区域脚本攻击漏洞"
updated = "2026-06-16T23:24:42Z"

