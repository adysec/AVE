[basic]
description = "FreeBSD 系统自带的 libedit 库在初始化时会在当前工作目录而非用户主目录中查找 .editrc 配置文件，存在本地权限提升漏洞。本地攻击者可通过在目标用户可能访问的共享目录（如 /tmp）中放置恶意的 .editrc 文件，当受害者在该目录下执行使用了 libedit 的程序时，恶意配置中的命令将以受害者权限执行，导致任意代码执行。该漏洞影响 FreeBSD 系统，CVSS 评分 4.6，危害等级中危。"
published = "2000-07-05T04:00:00Z"
remediation = "升级 FreeBSD 至 3.5-RELEASE 或 4.0-RELEASE 之后的安全补丁版本，或更新 libedit 库至修复该问题的版本（2000 年 7 月 FreeBSD 安全公告已提供补丁）。临时缓解措施：避免在包含不可信 .editrc 文件的目录中运行 libedit 相关程序（如 ftp、mail 等），或设置环境变量限制当前目录搜索行为。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "FreeBSD libedit 本地代码执行漏洞"
updated = "2026-06-16T21:52:04Z"

