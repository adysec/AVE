[basic]
description = "Microsoft SQL Server 2000 及 7.0 版本在使用混合模式（Mixed Mode）认证时，存在权限提升漏洞。攻击者利用数据库中的 SQL 查询方法，通过复用 sa 管理员账户的缓存连接，可在未经授权的情况下获取系统管理员权限。该漏洞影响 Windows 平台上运行 SQL Server 2000 Gold 及 7.0 的系统，具备本地访问权限的数据库用户即可触发利用。成功利用后，攻击者可完全控制数据库服务器，读取、修改或删除数据，CVSS 评分 7.2，危害等级高。Microsoft 已发布安全更新修复此漏洞，建议受影响用户尽快升级至补丁版本。"
published = "2001-07-21T04:00:00Z"
remediation = '安装 Microsoft 安全公告 MS01-032 对应的补丁程序 (KB299717)，要求 SQL Server 7.0 必须升级至 Service Pack 3 且版本号不低于 7.00.996，SQL Server 2000 必须升级至 Service Pack 1 且版本号不低于 8.00.296。如无法立即打补丁，可通过 SQL Server Enterprise Manager 依次在实例属性中取消勾选"允许即席分布式查询"(Allow Ad Hoc Distributed Queries) 作为临时缓解措施，同时强烈建议将认证模式从 Mixed Mode 切换为 Windows Authentication 模式以消除攻击面。'
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Microsoft SQL Server 权限提升漏洞"
updated = "2026-06-16T21:54:08Z"

