[basic]
description = "Linux 内核 USB gadget 子系统的 f_midi 驱动存在死锁漏洞。当使用 USB MIDI 功能时，完成处理程序 f_midi_complete 会直接调用 f_midi_transmit 函数，导致该函数被递归调用，从而尝试两次获取同一把自旋锁，引发内核死锁。该漏洞影响所有启用 USB gadget f_midi 功能的 Linux 内核版本，攻击者需在本地具有低权限且能触发 USB MIDI 数据传输，无需用户交互即可利用。成功利用后会导致内核工作队列挂起，系统可用性完全丧失，造成拒绝服务。CVSSv3.1 评分为 5.5（MEDIUM），向量为 AV:L/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H。Linux 内核维护者已通过将 f_midi_transmit 调用改为通过 queue_work() 调度至高优先级工作队列异步执行的方式修复此问题。"
published = "2025-03-12T10:15:18Z"
remediation = "建议将 Linux 内核升级至已修复版本，例如 5.4.291、5.10.235、5.15.179 或 6.1.130 及以上稳定版，以合并 commit 1f10923404705a94891e612dff3b75e828a78368 对 drivers/usb/gadget/function/f_midi.c 的补丁，该补丁通过 queue_work() 将 f_midi_transmit() 调度至高优先级工作队列，消除完成处理程序中的重入死锁。如暂无法升级内核，可通过 modprobe.blacklist=usb_f_midi 禁用 f_midi 模块作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 USB gadget f_midi 死锁漏洞"
updated = "2026-06-17T08:44:27Z"

