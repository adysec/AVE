[basic]
description = "这是一个关于 AIX 操作系统 pioout 命令的缓冲区溢出漏洞，影响 IBM AIX 4.3.x 及更早版本。通过精心构造的命令参数，攻击者可以覆盖相邻内存区域，导致程序控制流紊乱，最终实现远程代码执行。该漏洞为本地权限提升型，攻击者无需身份验证即可利用，可在目标系统中获得完全控制权限， compromising 系统的机密性、完整性和可用性。漏洞的 CVSS 评分达到 7.2 (AV:L/AC:L/Au:N/C:C/I:C/A:C)，属于高危等级。"
published = "2001-01-09T05:00:00Z"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "IBM AIX 4.3.x pioout 命令缓冲区溢出代码执行漏洞"
updated = "2026-06-16T21:53:11Z"

