[basic]
description = 'Avirt Mail 4.0 及 4.2 版本在处理 SMTP 协议的 "MAIL FROM" 和 "RCPT TO" 命令时存在缓冲区溢出漏洞。远程攻击者无需身份认证，通过向目标邮件服务器发送超长的邮件地址参数即可触发该漏洞，导致服务进程崩溃（拒绝服务），并可能利用溢出控制程序执行流程，实现任意代码执行。该漏洞 CVSS 评分 10.0，危害等级严重，影响所有运行 Avirt Mail 4.0 和 4.2 的系统。'
published = "2000-12-19T05:00:00.000"
remediation = "Avirt 官方已停止对该产品的安全支持，建议立即迁移至受支持的邮件服务器软件（如 Exchange、Postfix 等）。如无法迁移，可在网络边界防火墙限制仅允许可信 IP 访问 SMTP 端口（25/TCP），并在邮件服务器前部署 SMTP 代理/网关以过滤超长 MAIL FROM 和 RCPT TO 命令。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Avirt Mail 4.0/4.2 远程代码执行与拒绝服务漏洞"
updated = "2026-06-16T21:52:53.017"

