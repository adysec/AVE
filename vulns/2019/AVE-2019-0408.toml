[basic]
description = "Citrix SD-WAN 10.2.3 之前版本及 NetScaler SD-WAN 10.0.8 之前版本存在 SQL 注入漏洞。未经身份认证的远程攻击者可通过向受影响设备的 Web 管理界面发送特制的 HTTP 请求，在数据库查询中注入恶意 SQL 语句，从而窃取敏感配置数据、获取管理员权限甚至完全控制目标设备。该漏洞无需用户交互即可远程利用，CVSS 评分 9.8，危害等级严重。厂商已发布安全更新修复此漏洞，建议用户升级至 SD-WAN 10.2.3 或 NetScaler SD-WAN 10.0.8 及以上版本。"
published = "2019-07-16T18:15:12.930"
remediation = "将 Citrix SD-WAN 升级至 10.2.3 或更高版本，将 NetScaler SD-WAN 升级至 10.0.8 或更高版本，以修复 SQL 注入漏洞。如无法立即升级，应在防火墙或网络访问控制层面严格限制对 SD-WAN 管理界面的访问，仅允许可信管理 IP 连接，并监控 /sdwan/nitro/v1/config/get_package_file 接口的异常请求。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Citrix SD-WAN NetScaler SD-WAN SQL注入漏洞"
updated = "2026-06-17T02:15:52.113"

