[basic]
description = "ATEN Unizon 的 restoreDB 方法存在目录遍历漏洞。该漏洞源于 restoreDB 方法未对用户提供的路径进行充分验证，远程攻击者可在通过身份认证后，向目标系统发送包含路径遍历字符的特制请求，利用文件操作中的路径注入在 SYSTEM 权限下执行任意代码。该漏洞影响 ATEN Unizon 2.7.262.002 版本，攻击者无需交互即可远程利用。"
published = "2026-06-24T22:16:50Z"
remediation = "立即将 ATEN Unizon 固件升级到 V2.7.264.001 或更高版本，该版本修复了 restoreDB 目录遍历远程代码执行漏洞。如无法立即升级，应通过防火墙或访问控制列表限制 Unizon Web 界面的访问来源，仅允许可信管理网络访问，并监控 /rest/system/database/restore 端点的异常调用。"
score = 7.2
severity = "HIGH"
sources = ["zdi"]
title = "ATEN Unizon restoreDB 目录遍历远程代码执行漏洞"
updated = "2026-06-27T19:01:11Z"

