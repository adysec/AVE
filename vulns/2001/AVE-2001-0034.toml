[basic]
description = "Check Point VPN-1/FireWall-1 4.1 SP2 启用 Fast Mode 时存在 TCP 碎片包处理缺陷。未经身份认证的远程攻击者可发送特制的畸形碎片化 TCP 数据包，绕过防火墙的访问控制策略，从而获取对受保护网络资源的未授权访问。该漏洞影响运行 Check Point Firewall-1 4.1 SP2 并启用 Fast Mode 功能的设备，CVSS 评分为 7.5，属于高危等级。攻击者无需任何身份验证即可利用此漏洞，通过构造恶意的 TCP 碎片包突破网络边界防护。"
published = "2001-02-12T05:00:00.000"
remediation = "建议立即升级至 Check Point FireWall-1 4.1 SP3 或更高版本（已修复该漏洞），或在 SmartDashboard 中禁用 Fast Mode 功能（Policy > Properties > FireWall > Advanced > 取消勾选 Fast Mode）。若无法立即升级，可在边界防火墙配置丢弃异常 TCP 分片数据包的规则作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Check Point Software Firewall-1 TCP碎片访问控制绕过漏洞"
updated = "2026-06-16T21:53:37.340"

