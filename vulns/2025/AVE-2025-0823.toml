[basic]
description = "Microsoft Outlook 存在权限管理不当漏洞（CWE-641），由于对邮件中特定内容的 UI 层渲染限制不足，攻击者可通过构造特制的邮件或附件诱导用户打开，触发远程代码执行。该漏洞攻击复杂度低，无需特权，但需要用户交互。成功利用可导致机密性、完整性和可用性完全受损，攻击者可安装程序、查看/更改/删除数据或创建新账户。影响 Microsoft Outlook 多个受支持版本，Microsoft 已在 2025 年 1 月安全更新中修复。"
published = "2025-01-14T18:16:01.637"
remediation = "建议立即将 Microsoft Outlook for Mac 升级至 16.93 及以上版本，Office LTSC for Mac 2021/2024 升级至 16.93.25011212 及以上版本。可通过 Microsoft AutoUpdate（菜单栏 → 帮助 → 检查更新）或从 Microsoft 下载中心获取更新。临时缓解措施：不要打开来自不可信来源的 Office 文件，并启用 macOS 的 Gatekeeper 功能。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Outlook 远程代码执行漏洞"
updated = "2026-06-17T08:43:11.670"

