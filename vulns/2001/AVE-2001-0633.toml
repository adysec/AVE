[basic]
description = "Ultraboard 2000 2.11 默认安装后，Skins、Database 和 Backups 目录被设置为全局可写权限，导致本地攻击者无需认证即可修改敏感数据，甚至植入并执行恶意 CGI 脚本。该漏洞影响 Ultraboard 2000 2.11 版本，攻击者需拥有本地系统访问权限，利用难度低，可造成数据完整性破坏及潜在的代码执行风险。"
published = "2001-03-12T05:00:00Z"
remediation = "手动修改 Ultraboard 2000 安装目录下 Skins、Database 和 Backups 三个目录的权限为仅管理员可写（如 chmod 755），移除目录的全局可写权限，并检查是否存在被植入的恶意 CGI 脚本。建议迁移至受支持的论坛软件以获取安全更新。"
score = 2.1
severity = "LOW"
sources = ["cve"]
title = "Ultraboard Ultraboard 2000 目录权限不当漏洞"
updated = "2026-06-16T21:53:44Z"

