[basic]
description = "js-yaml 在解析流集合时存在指数级性能退化漏洞。当流序列中的条目被解析为键值对时，解析器会回退并重新解析该条目作为键；若键本身是相同形状的嵌套流序列，每一级都会被解析两次，导致总工作量为O(2^n)。攻击者可通过发送小于200字节的恶意YAML负载触发该漏洞，无需身份认证即可造成拒绝服务，单个请求可使CPU持续占用数分钟。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
