[basic]
description = "Apache Tomcat 3.0 和 3.1 版本中的 Snoop Servlet 存在信息泄露漏洞。远程攻击者无需身份认证，只需向目标服务器发送一个带有 .snp 扩展名的不存在 URL 的请求，即可触发 Snoop Servlet 输出包含系统环境变量、JVM 参数、请求头等敏感信息的调试数据。该漏洞影响运行受影响版本 Tomcat 的所有 Web 应用服务器，攻击条件极为简单——仅需目标服务器开放 HTTP 端口且部署了存在漏洞的 Tomcat 版本。成功利用后，攻击者可获取系统配置信息，为后续进一步渗透攻击提供有力参考。Apache 官方已在后续版本中移除了 Snoop Servlet 或对其访问权限进行了限制以修复此问题。"
published = "2000-10-20T04:00:00Z"
remediation = "强烈建议立即将 Tomcat 升级至 Apache 官方支持的 9.0.x 或更高版本以获得完整安全修复。若短期内无法升级，须采取以下缓解措施：第一，直接从 webapps 目录中删除整个 examples 示例应用目录；第二，若需保留 examples 应用，编辑 webapps/examples/WEB-INF/web.xml，移除 SnoopServlet 的 &lt;servlet&gt; 和 &lt;servlet-mapping&gt; 配置条目后重启 Tomcat；第三，通过 Apache HTTP Server 的 mod_jk 或 front Controller 配置，禁止外部客户端对 /examples/ 路径的访问；第四，服务器上需关闭 8007 端口的 AJP12 协议监听（该协议在 Tomcat 3.x 中默认开启且同样存在严重安全问题）。请注意，Tomcat 3.x 已于多年前停止维护，Apache 官方表示不再为该版本发布安全更新，升级至受支持的稳定版本是最彻底的解决方案。"
score = 6.4
severity = "MEDIUM"
sources = ["avd"]
title = "Apache Tomcat Snoop Servlet 信息泄露漏洞"
updated = "2026-06-16T21:52:25Z"

