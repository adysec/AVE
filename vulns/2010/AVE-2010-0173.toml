[basic]
description = "标签中。<value>Apple iTunes 9.2 之前版本中集成的 WebKit 引擎存在未指定漏洞，该漏洞可能被远程攻击者利用，通过构造恶意网页或诱使用户处理特制文件来触发。成功利用此漏洞可能导致应用程序崩溃或任意代码执行，进而完全控制受影响的系统。该漏洞影响 Windows 平台上的 iTunes 软件，CVSS 评分高达 10.0，属于严重级别安全风险。Apple 已在 iTunes 9.2 版本中修复了此漏洞。"
published = "2010-06-18T16:30:01Z"
remediation = '立即升级 Apple iTunes 至 9.2 或更高版本。Windows 用户可通过 iTunes 内置"检查更新"功能自动升级，或访问 Apple 官网下载最新版 iTunes 安装包覆盖安装。若无法立即升级，应避免使用 iTunes 访问不可信网页或打开来源不明的媒体文件，以降低被利用风险。'
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple iTunes WebKit 未指定漏洞"
updated = "2026-06-16T23:19:16Z"

