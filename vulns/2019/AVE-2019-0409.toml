[basic]
description = "Citrix SD-WAN 和 NetScaler SD-WAN 设备存在输入验证不当漏洞（CWE-78 命令注入），经过身份验证的远程攻击者可通过向管理界面发送特制请求绕过认证机制，进而注入系统命令并以 root 权限执行任意操作。该漏洞影响 Citrix SD-WAN 10.2.3 之前版本及 NetScaler SD-WAN 10.0.8 之前版本，CVSS 评分 8.8，危害等级高。攻击者利用该漏洞可完全控制目标设备，导致敏感信息泄露、系统配置篡改或服务中断。"
published = "2019-07-16T18:15:13Z"
remediation = "立即将 Citrix SD-WAN 升级至 10.2.3 或更高版本，将 NetScaler SD-WAN 升级至 10.0.8 或更高版本。如无法立即升级，在防火墙上限制对 SD-WAN 管理接口（默认端口 443/22）的访问，仅允许受信任管理 IP 连接，并禁用 WAN 侧对管理界面的直接访问作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Citrix SD-WAN Appliance 命令注入漏洞"
updated = "2026-06-17T02:15:52Z"

