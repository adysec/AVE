[basic]
description = "Quest NetVault Backup 的 viewclient 网页组件存在跨站脚本认证绕过漏洞。该漏洞源于对用户提交数据缺乏 Proper validation，远程攻击者可通过在 viewclient 网页中注入任意脚本绕过认证机制。成功利用需要用户交互，即目标用户必须访问恶意页面或打开恶意文件。攻击者可利用此漏洞结合其他安全缺陷，在 SYSTEM 上下文中执行任意代码。该漏洞影响 Quest NetVault Backup 14.0.1.7 版本，CVSS 评分为 8.8（HIGH），危害等级严重。Quest 已在 NetVault 14.0.2 版本中修复此问题。"
published = "2026-06-25T00:17:47.707"
remediation = "立即升级 Quest NetVault Backup 至 14.0.2 或更高版本，该版本已修复 viewclient 页面的跨站脚本认证绕过漏洞。升级前务必备份 NetVault 数据库与配置文件，升级后重启服务并验证 viewclient 模块可正常访问。如暂时无法升级，建议通过防火墙或反向代理限制 viewclient 网页仅对可信内网地址开放，阻止外部恶意页面或文件诱导用户访问，以降低被利用风险。"
score = 8.8
severity = "HIGH"
sources = ["zdi"]
title = "Quest NetVault Backup viewclient 跨站脚本认证绕过漏洞"
updated = "2026-06-26T20:16:42.617"

