[basic]
description = "Compaq Insight Manager 及 Management Agents 等管理软件中的 web-enabled agents 组件所包含的 cpqlogin.htm 页面存在缓冲区溢出漏洞。远程攻击者无需身份认证，通过向该页面提交超长用户名参数即可触发缓冲区溢出，进而导致任意代码执行。该漏洞 CVSS 评分 10.0，危害等级严重，影响大量 Compaq 服务器管理平台。"
published = "2001-03-12T05:00:00.000"
remediation = "立即安装 Compaq（现 HP）官方补丁，补丁下载地址见 Compaq 安全公告 http://www5.compaq.com/products/servers/management/agentsecurity.html。该漏洞影响 Compaq Management Agents 4.70 及更早版本，升级到已修复版本即可消除风险。如无法立即打补丁，在防火墙层面阻止对 TCP 端口 2301 的外部访问，仅允许受信任管理网段连接，作为临时缓解措施。该产品已停止支持，建议迁移到 HP 当前支持的服务器管理平台。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Compaq Insight Manager 管理代理 cpqlogin.htm 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:44.167"

