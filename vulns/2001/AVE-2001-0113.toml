[basic]
description = "KICQ 是一款开源的 IRC 客户端应用程序，运行于 KDE 桌面环境之上。该漏洞存在于程序处理超链接 URL 的过程中，由于未对 URL 中的 shell 元字符（如分号、管道符、反引号等）进行严格的输入验证和过滤，攻击者可以在 URL 中嵌入恶意构造的 shell 命令。当远程攻击者向 KICQ 用户发送包含此类特制 URL 的 IRC 消息后，一旦用户在客户端中点击或触发该链接，程序便会将包含 shell 元字符的 URL 传递给系统 shell 解析执行，导致任意操作系统命令以客户端用户的权限被执行。该漏洞影响 KICQ 1.0.0 版本及可能受影响的后续版本，攻击复杂度低，无需身份认证即可远程利用。成功利用该漏洞可能导致攻击者在目标主机上执行任意代码，造成敏感数据泄露、系统权限被窃取或客户端被植入后门等严重后果，CVSS v3 评分为 7.5，危害等级为高危。"
published = "2001-05-03T04:00:00Z"
remediation = "KICQ 1.0.0 存在通过 URL 执行任意命令的严重漏洞，受影响版本已停止维护且官方从未发布修复版本，建议立即停止使用 KICQ 并迁移至仍在维护的 IRC 客户端（如 irssi、WeeChat 或 Pidgin）。临时缓解措施：在 KICQ 中禁用 URL 自动打开功能，避免点击即时消息中任何来源不明的链接，并在防火墙或系统层面限制 KICQ 进程的出站网络访问权限。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "KICQ IRC 客户端任意命令执行漏洞"
updated = "2026-06-16T21:54:00Z"

