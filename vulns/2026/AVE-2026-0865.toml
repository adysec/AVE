[basic]
description = "Mistune 是一个 Python Markdown 解析库，其 Include 指令的 parse() 方法在处理用户提供的包含路径时，仅通过 os.path.join 和 os.path.normpath 进行拼接与规范化，未对最终解析路径是否仍在预期的 Markdown 目录范围内进行校验，存在路径遍历漏洞（CWE-22）。攻击者可通过在 Markdown 文件中构造包含 ../ 等路径遍历序列的 include 指令，诱使应用使用 md.read() 处理该文件，从而读取目标系统上任意文件。该漏洞影响 Mistune 3.3.0 之前的所有版本，CVSS 评分 5.9，危害等级中危。建议升级至 v3.3.0 或更高版本以修复此漏洞。"
published = "2026-07-08T17:17:28Z"
remediation = "立即将 mistune 升级至 3.3.0 或更高版本（pip install --upgrade mistune>=3.3.0）。如无法升级，在调用 Include() 时对用户传入的路径进行校验，使用 os.path.realpath 解析后判断是否在允许的基准目录内，或禁用 RSTDirective([Include()]) 插件。避免直接处理不可信的 Markdown 文件。"
score = 5.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "Mistune mistune Include指令路径遍历漏洞"
updated = "2026-07-09T19:34:54Z"

