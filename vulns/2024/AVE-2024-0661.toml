[basic]
description = "Linux 内核 UVC 视频驱动（uvcvideo）的 uvc_status_init() 函数在分配 int_urb 失败时释放了 dev->status 指针但未将其置空，导致后续 uvc_status_cleanup() 中调用 kfree() 时发生双重释放（double free）漏洞。本地低权限攻击者可利用此漏洞触发内核内存错误，导致系统崩溃或潜在权限提升。该漏洞影响 Linux 内核各发行版本，CVSS 评分 7.8，危害等级高。"
published = "2025-02-27T02:15:11Z"
remediation = "立即将 Linux 内核升级至 6.1.129、6.6.76、6.12.13 或 6.13.2 及以上版本，这些版本已包含修复提交 6c36dcd662ec。如无法升级内核，可 cherry-pick 该提交到当前内核树中，或安装各发行版对应安全更新（Debian DLA-4178、Ubuntu USN-7540-1/USN-7511-1）。临时缓解措施：禁用依赖 UVC 驱动的 USB 摄像头设备。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux kernel UVC 视频驱动双重释放漏洞"
updated = "2026-06-17T08:14:22Z"

