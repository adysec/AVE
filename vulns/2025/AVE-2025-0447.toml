[basic]
description = "Grub2 引导加载程序在启用 Secure Boot 锁定模式时存在信任边界违反漏洞（CWE-501）。由于 dump 命令未在 lockdown 模式下被正确拦截，已获得高权限的攻击者可通过本地访问执行 dump 命令读取任意内存信息，从而提取内存中的加密签名、盐值及其他敏感数据。该漏洞影响 grub2 0 至 2.12 版本，CVSS 评分 4.4，危害等级中危。Red Hat 已发布安全更新 RHSA-2025:16154 修复此问题，建议用户升级至修复版本。"
published = "2025-02-19T18:15:24Z"
remediation = "建议将 grub2 升级至修复版本：RHEL 10 升级至 grub2-2.12-15.el10_0，Debian bullseye 升级至 2.06-3~deb11u7、bookworm 升级至 2.06-13+deb12u2、sid 升级至 2.14-3。如无法立即升级，可在 UEFI 固件设置中禁用 Secure Boot 后限制物理访问权限作为临时缓解。"
score = 4.4
severity = "MEDIUM"
sources = ["msrc"]
title = "GNU GRUB2 安全启动锁定绕过漏洞"
updated = "2026-06-30T00:16:54Z"

