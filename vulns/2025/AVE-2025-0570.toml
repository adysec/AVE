[basic]
description = "Google Chrome 的 WebRTC 模块中存在不恰当的实现漏洞。远程攻击者可以通过诱导用户访问一个特制的 HTML 页面，利用该漏洞在受影响的浏览器中执行任意内存读写操作。该漏洞影响 143.0.7499.41 版本之前的 Google Chrome，攻击条件为用户需与恶意网页交互。成功利用后，攻击者可能突破浏览器沙箱或窃取敏感信息。"
published = "2025-12-02T19:15:48Z"
remediation = "建议立即将 Google Chrome 浏览器升级至 143.0.7499.41 或更高版本。用户可通过浏览器“关于 Google Chrome”页面触发自动更新，或前往官网下载最新稳定版以修复 WebRTC 实现不当导致的任意读写漏洞。"
score = 8.1
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome WebRTC 任意读写漏洞"
updated = "2026-06-17T08:34:29Z"

