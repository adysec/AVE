[basic]
description = "Google Chrome V8 引擎存在类型混淆漏洞（CWE-843），影响 Chrome 142.0.7444.175 之前版本及 Chromium 同版本。攻击者可通过诱导用户访问精心构造的恶意 HTML 页面，触发 V8 引擎中的类型混淆漏洞，导致堆内存损坏，进而实现远程代码执行。该漏洞 CVSS 3.1 评分 8.8（HIGH），攻击向量为网络（AV:N），攻击复杂度低（AC:L），无需权限（PR:N），但需要用户交互（UI:R），影响机密性、完整性和可用性均为高（C:H/I:H/A:H）。Google 已在 Chrome 142.0.7444.175 版本中修复此漏洞，建议用户尽快升级至最新版本。"
published = "2025-11-17T23:15:45Z"
remediation = "立即将 Google Chrome 升级到 142.0.7444.175 或更高版本，建议使用 Chrome 自动更新功能或通过 Windows Update 进行更新。如需立即缓解，可通过 Chrome 命令行参数 --disable-web-security 临时增强安全设置，并限制用户访问可疑网站。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "谷歌 Chrome V8 类型混淆漏洞"
updated = "2026-07-14T15:21:34Z"

