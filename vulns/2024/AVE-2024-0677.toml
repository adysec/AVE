[basic]
description = "Linux 内核蓝牙子系统的 MGMT 协议实现中存在释放后使用（Use-After-Free）漏洞，位于 `mgmt_remove_adv_monitor_sync` 函数中。当移除广告监控器时，`mgmt_pending` 结构体被释放后仍被访问，导致 slab 内存被释放后再次读取。本地攻击者可利用此漏洞造成系统崩溃或提升权限，获取敏感信息。该漏洞影响 Linux 内核蓝牙协议栈，CVSS 评分 7.8，危害等级高，攻击者需具备本地低权限访问条件。"
published = "2025-02-27T03:15:12Z"
remediation = "升级 Linux 内核至包含修复补丁（commit 26fbd3494a7d）的版本：主线内核升级至 6.14-rc1 或更高版本，Debian bookworm 升级至 6.1.129-1 或更高版本，Ubuntu 24.04 LTS 升级至 linux-image 6.8.0-64.67 或更高版本，Ubuntu 24.10 升级至 6.11.0-26.26 或更高版本。如暂时无法升级内核，可在蓝牙子系统未使用的设备上通过禁用蓝牙模块（blacklist btusb）来消除攻击面，或通过 CONFIG_BT_MGMT 编译选项关闭蓝牙管理接口以缓解风险。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核蓝牙 MGMT 模块释放后使用漏洞"
updated = "2026-06-17T08:14:27Z"

