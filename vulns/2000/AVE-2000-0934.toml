[basic]
description = "tags.<value>Microsoft Money 密码保护功能存在明文存储密码的漏洞，攻击者若能获得对系统的物理访问权限，即可读取存储的明文密码，导致敏感财务信息泄露。该漏洞影响 Microsoft Money 相关版本，CVSS 评分 7.2（本地访问/低复杂度/无需认证/完全机密性/完整性/可用性影响）。攻击者需具备物理访问权限，通过读取存储文件获取明文密码，进而窃取用户财务数据。微软已发布补丁修复该漏洞，建议用户升级至修复版本。"
published = "2000-10-20T04:00:00Z"
remediation = "立即升级到 Microsoft Money 10.0 或更高版本，该版本修复了密码明文存储问题。如无法立即升级，建议禁用无需密码即可访问 Money 的功能，并使用复杂的账户密码，避免物理访问者利用此漏洞获取 sensitive 数据。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Microsoft Money 密码泄漏漏洞"
updated = "2026-06-16T21:52:27Z"

