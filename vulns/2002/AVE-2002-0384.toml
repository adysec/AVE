[basic]
description = "GoAhead Web Server 2.1.x 存在目录遍历漏洞，远程攻击者可通过向目标服务器发送包含 URL 编码反斜杠（%5C）的 `../` 序列的 HTTP 请求，绕过路径限制读取服务器上的任意文件。该漏洞源于服务器对 URL 编码的路径分隔符处理不当，攻击者无需身份认证即可利用，可能导致敏感信息泄露。需要注意的是，此 CVE 编号已被报告为 CVE-2001-0228 的重复项。"
published = "2002-07-23T04:00:00Z"
remediation = "建议立即升级 GoAhead WebServer 至 2.2 及以上版本，该版本已修复目录遍历漏洞。如无法升级，可在 Web 服务器配置中禁用 URL 中的反斜杠编码（%5C）解析，或通过反向代理/WAF 规则过滤包含 `..%5C` 或 `%5C..` 模式的请求路径。同时限制 Web 服务进程对敏感系统目录（如 /etc、/winnt）的读取权限。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "GoAhead WebServer URL编码斜杠目录遍历漏洞"
updated = "2026-06-16T21:57:55Z"

