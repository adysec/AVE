[basic]
description = "Sendmail 8.9.0 至 8.12.3 版本在 alias、map、statistics 及 pid 等文件加锁机制上存在缺陷，本地用户可通过获取这些文件的独占锁，导致邮件传输代理进程无法正常访问关键文件，进而引发拒绝服务。该漏洞影响所有使用受影响版本 Sendmail 的 Unix/Linux 系统，攻击者需先获得本地访问权限，通过竞争条件或直接锁定上述文件即可触发服务中断，造成邮件收发功能失效。"
published = "2002-12-31T05:00:00Z"
remediation = "立即升级Sendmail至8.12.4或更高版本，修复文件锁定竞态条件漏洞。如暂无法立即升级，可将/etc/mail/aliases、/etc/mail/aliases.db、/var/log/sendmail.st及sendmail.pid文件的属主改为root并设置为仅root可写（chmod 600），同时在sendmail.cf配置文件中添加O_SafeFileEnvironment参数限制sendmail进程只能访问授权目录，以缓解本地用户获取文件排他锁导致的拒绝服务风险。"
score = 2.1
severity = "LOW"
sources = ["exploitdb"]
title = "Sendmail 文件锁定拒绝服务漏洞"
updated = "2026-06-16T22:00:07Z"

