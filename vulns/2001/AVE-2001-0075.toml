[basic]
description = "Icecast 流媒体服务器存在格式字符串漏洞，1.3.8beta2 及更早版本的 print_client 函数未正确过滤用户输入，远程攻击者可通过发送特制 HTTP 请求触发该漏洞，进而执行任意系统命令。该漏洞影响 Icecast 1.3.7 和 1.3.8 等多个版本，CVSS 评分 10.0，危害等级严重。攻击者无需身份认证即可利用，攻击复杂度低，影响范围广泛。"
published = "2001-03-26T05:00:00Z"
remediation = "立即升级 Icecast 至 1.3.9 或更高版本，该版本已修复 utility.c 中 print_client() 函数的格式字符串漏洞。如当前使用 Red Hat Linux 7.0，请安装 Red Hat 官方安全补丁 RHSA-2001:004。如暂时无法升级，应在防火墙或 iptables 中限制对 Icecast 服务端口的远程访问，仅允许可信网段连接，并停止运行 Icecast 服务直至完成版本更新。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Icecast 1.3.7/1.3.8 格式字符串远程代码执行漏洞"
updated = "2026-06-16T21:53:51Z"

