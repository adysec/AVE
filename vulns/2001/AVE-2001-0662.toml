[basic]
description = "WatchGuard Firebox II 4.5 版本的 PPTP 协议实现存在拒绝服务漏洞。攻击者无需身份认证即可远程向目标设备建立多个 PPTP 连接，并发送格式异常的 PPTP 数据包。由于系统在处理这些恶意构造的数据包时未能正确校验其格式，导致服务进程异常终止或系统资源耗尽，从而引发拒绝服务，使合法用户无法正常使用 PPTP 隧道服务。该漏洞影响运行受影响版本固件的 WatchGuard Firebox II 设备，攻击条件宽松，仅需网络可达即可实施攻击，无需任何凭证或交互。"
published = "2001-06-02T04:00:00.000"
remediation = "建议立即升级 WatchGuard Firebox II 固件至 Fireware 4.6 或更高版本，以修复 PPTP 数据包处理中的拒绝服务漏洞。如暂无法升级，应在防火墙上临时禁用 PPTP 服务（VPN），并限制外部 PPTP 端口（TCP 1723）的访问，仅允许受信任的 IP 地址通过防火墙规则进行访问控制，同时持续监控系统日志中是否存在异常 PPTP 连接请求。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "WatchGuard Firebox II PPTP 拒绝服务漏洞"
updated = "2026-06-16T21:53:52.650"

