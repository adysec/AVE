[basic]
description = "Linux 内核 2.2.19 之前版本中的 strnlen_user 函数存在未知漏洞，本地攻击者可利用该漏洞获取部分敏感信息或篡改系统数据，导致机密性和完整性受损。该漏洞需要本地用户权限才能触发，攻击复杂度较低，影响范围有限。Linux 内核社区已在 2.2.19 版本中修复此问题。"
published = "2001-04-17T04:00:00Z"
remediation = "升级 Linux 内核至 2.2.19 或更高版本，该版本修复了 strnlen_user 函数中的未知漏洞。对于无法升级内核的旧系统，建议限制本地用户访问权限，并应用发行版厂商提供的对应安全补丁（如 Debian DSA-047）。"
score = 3.6
severity = "LOW"
sources = ["redhat"]
title = "Linux kernel strnlen_user 未明漏洞"
updated = "2026-06-16T21:56:11Z"

