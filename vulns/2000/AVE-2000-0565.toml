[basic]
description = "McAfee VirusScan 4.03 存在访问控制漏洞，程序在将警报文本文件发送至 Central Alert Server 之前未正确限制对该文件的访问权限。本地攻击者可利用该漏洞在文件发送前任意篡改警报内容，篡改或伪造病毒警报信息，干扰安全监控与告警机制。该漏洞影响 McAfee VirusScan 4.03 版本，攻击者需具备本地系统访问权限，无需身份认证即可通过修改临时警报文件实现任意警报内容篡改，CVSS 评分 2.1（本地攻击、低复杂度、无需认证、部分完整性影响），属低危本地权限提升/完整性破坏漏洞。"
published = "2000-06-08T04:00:00Z"
remediation = '建议立即升级 McAfee VirusScan 至 4.5.1 或更高版本（McAfee 已发布安全补丁修复此访问控制问题），或迁移至 McAfee Endpoint Security 10.x 及以上版本。升级前请在 McAfee ePolicy Orchestrator 控制台执行“强制更新”任务，确保所有客户端自动下载并应用补丁包。若暂时无法升级，可临时在受影响系统上将 %ProgramFiles%\McAfee\VirusScan\Alerts 目录的 ACL 设置为仅 SYSTEM 和 Administrators 可写，普通用户仅保留读取权限，同时在 ePO 策略中禁用“允许本地用户修改警报文件”选项，并通过防火墙限制本地 8080 端口仅允许受信管理服务器 IP 访问，防止本地恶意篡改警报文件内容。'
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "迈克菲 VirusScan 访问控制漏洞"
updated = "2026-06-16T21:51:52Z"

