[basic]
description = "FreeBSD 4.0、4.1 及 4.1.1 版本的 getnameinfo 函数在处理 DNS 主机名时存在输入验证缺陷，远程攻击者可通过向目标系统发送超长的 DNS 主机名触发该漏洞，导致服务拒绝。该漏洞影响 FreeBSD 4.1.1 及更早版本，并可能波及其他使用相似实现的 Unix-like 操作系统。攻击者无需身份认证，只需通过网络发送特制 DNS 响应或构造包含超长主机名的网络请求即可利用此漏洞，造成目标系统 DNS 解析功能瘫痪或进程崩溃。攻击复杂度低，成功利用后可致系统可用性下降，但无法获取敏感数据或提升权限。建议用户升级至 FreeBSD 后续安全版本以修复该问题。"
published = "2000-12-11T05:00:00Z"
remediation = "将受影响的 FreeBSD 4.0/4.1/4.1.1 系统升级至 FreeBSD 4.2-RELEASE 或更高版本。如暂无法升级，可从 FreeBSD 官方安全公告 FreeBSD-SA-00:63 下载 getnameinfo.patch，执行 cd /usr/src/lib/libc && patch -p < /path/to/patch && make depend && make all install 重新编译 libc 以修复 getnameinfo 函数的 off-by-one 错误。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "FreeBSD 操作系统 DNS getnameinfo 远程拒绝服务漏洞"
updated = "2026-06-16T21:53:05Z"

