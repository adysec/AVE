[basic]
description = "FreeBSD 4.4 及更早版本中 OpenSSH 所调用的 libutil 库存在权限检查绕过漏洞。当系统读取版权文件（copyright）和欢迎文件（welcome）时，该库在验证文件读取权限前未正确丢弃特权，导致本地攻击者可通过指定替代的版权或欢迎文件路径，绕过原有的权限检查机制，实现任意文件读取。该漏洞影响 FreeBSD 4.3/4.4 系统，攻击者需拥有本地用户权限，利用难度较低，可导致敏感信息泄露。"
published = "2001-09-20T04:00:00Z"
remediation = "升级到 FreeBSD 4.5 或更高版本，该漏洞已在后续版本中修复。如无法升级，可限制本地用户对 /etc/login.conf 及相关欢迎/版权文件的写入权限，并移除 setuid 权限位作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["exploitdb"]
title = "FreeBSD OpenSSH 本地权限文件读取漏洞"
updated = "2026-06-16T21:55:26Z"

