[basic]
description = "gnuserv 3.12 之前版本（随 XEmacs 分发）在处理 X Window 系统 MIT-MAGIC-COOKIE 认证 cookie 时未对指定长度进行有效边界检查，存在缓冲区溢出漏洞（CWE-120）。未经身份认证的远程攻击者可通过发送特制的超长 cookie 数据触发堆栈缓冲区溢出，进而在目标系统上执行任意命令并获得完全控制权限；攻击者也可利用短 cookie 长度进行暴力破解以绕过认证机制。该漏洞影响所有运行受影响 gnuserv 版本的 XEmacs 环境，攻击者无需事先认证或用户交互，通过网络即可直接完成利用，CVSS v2 评分为 10.0，危害极其严重。"
published = "2001-05-03T04:00:00Z"
remediation = "升级 gnuserv 到 3.12 或更高版本，该版本修复了对 X Windows MIT-MAGIC-COOKIE Cookie 长度的缓冲区溢出问题。对于使用 XEmacs 附带的 gnuserv 的系统，应同时升级 XEmacs 至包含 gnuserv 3.12 的版本。Red Hat 用户可安装 RHSA-2001-010 和 RHSA-2001-011 安全公告补丁，Linux-Mandrake 用户应安装 MDKSA-2001-019 安全更新。如暂无法升级，可在防火墙层面限制 X11 连接来源，仅允许可信主机访问 X Window 端口，以临时缓解远程攻击风险。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "XEmacs gnuserv 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:51Z"

