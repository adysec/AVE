[basic]
description = 'Macromedia Sitespring 1.2.0 的默认错误页面脚本 500error.jsp 存在跨站脚本（XSS）漏洞。远程攻击者可通过向该页面发送特制的请求，在 "et" 参数中注入恶意脚本代码，当用户访问包含恶意参数的链接时，脚本将在用户浏览器中执行，导致敏感信息泄露或会话劫持。攻击无需身份认证，利用复杂度低，影响系统机密性、完整性和可用性。'
published = "2002-10-04T04:00:00Z"
remediation = "Macromedia 已被 Adobe 收购，Sitespring 产品已停止维护多年，官方不再提供安全更新。建议立即升级到 Adobe 当前支持的替代产品（如 Adobe Experience Manager），或迁移至其他受支持的 Web 内容管理平台。如无法迁移，可在 Web 服务器层面配置 WAF 规则过滤 500error.jsp 的 et 参数中的恶意脚本内容，或直接删除/禁用 500error.jsp 文件作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Macromedia Sitespring 1.2.0 默认错误页面跨站脚本漏洞"
updated = "2026-06-16T21:58:35Z"

