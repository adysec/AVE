[basic]
description = 'Microsoft Windows Media Player 7 及更早版本存在缓冲区溢出漏洞，攻击者可通过构造包含超长版本标签或横幅标签的特制 ASX 媒体播放列表文件，诱使目标用户用存在漏洞的播放器打开该文件，从而触发栈缓冲区溢出并在目标系统上执行任意命令。该漏洞影响 Windows Media Player 7.0 及更早版本，属于 MS00-090 安全公告中 ".ASX Buffer Overrun" 漏洞的变种，CVSS 评分 7.5，危害等级高。'
published = "2001-06-27T04:00:00.000"
remediation = '安装 Microsoft 2001 年 5 月发布的安全更新 MS01-029，Windows Media Player 6.4 用户应下载并安装对应补丁，Windows Media Player 7 用户应升级到 Windows Media Player 7.1 或更高版本。如无法立即升级，可临时启用 Internet Explorer 安全区域设置，将 Internet 区域的安全级别调至中-高，并禁用"下载已签名的 ActiveX 控件"选项，同时避免打开来源不明的 .ASX 文件或访问可疑网站。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft Windows Media Player .ASX 文件缓冲区溢出漏洞"
updated = "2026-06-16T21:53:56.930"

