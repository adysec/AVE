[basic]
description = "lpr 软件包中的行式打印机守护进程（lpd）在多个 Linux 操作系统（包括 RedHat 6.1、IRIX 6.5.18）中存在认证绕过漏洞。lpd 通过将本地机器反向解析的主机名与 gethostname 返回的打印服务器主机名进行比较来验证客户端身份，远程攻击者只需修改攻击 IP 的 DNS 反向解析记录即可绕过访问控制，无需任何身份认证即可完全控制目标打印服务，导致机密性、完整性和可用性全部丧失，CVSS 评分 10.0，危害等级严重。"
published = "2000-01-08T05:00:00Z"
remediation = "建议立即升级至 Red Hat Linux 7.0 以上版本或迁移至受支持的 RHEL 发行版（如 RHEL 8/9），IRIX 用户应升级至 6.5.19 以上版本。如无法升级，可在 /etc/hosts 中静态绑定打印服务器主机名与 IP 地址，防止 DNS 欺骗绕过认证；同时在防火墙层面限制对 TCP 端口 515（lpd）的访问，仅允许受信任的打印客户端 IP 连接；若业务中无需远程打印功能，建议直接禁用 lpd 服务（`service lpd stop && chkconfig lpd off`）。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "RedHat Linux lpd 远程命令执行漏洞"
updated = "2026-06-16T21:53:24Z"

