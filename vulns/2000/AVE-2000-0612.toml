[basic]
description = "Red Hat Linux 6.1 系统中的 tmpwatch 工具在处理目录时存在拒绝服务漏洞。tmpwatch 会为每个目录层级派生一个新的子进程，本地攻击者可通过在 /tmp 或 /var/tmp 目录下创建深度嵌套的目录结构，触发大量进程派生，消耗系统资源，导致系统响应缓慢或服务不可用。该漏洞需要本地访问权限，攻击复杂度低，影响系统可用性。"
published = "2000-11-14T05:00:00.000"
remediation = "升级 tmpwatch 软件包至修复版本，或限制 /tmp 和 /var/tmp 目录的嵌套深度不超过 20 层；也可通过 cron 定期清理深层临时目录作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "Red Hat Tmpwatch 拒绝服务漏洞"
updated = "2026-06-16T21:52:33.230"

