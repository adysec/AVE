[basic]
description = 'laravel-backup-restore 数据库恢复功能存在 OS 命令注入漏洞。该漏洞源于恢复流程在解压 ZIP 备份归档后，将 `db-dumps` 目录下的文件名直接拼接到 shell 命令字符串中（如 `mysql ... < {dumpFile}`、`gunzip -c {dumpFile}`、`psql ... < {dumpFile}`），而未对文件名进行 shell 转义处理。由于 `Illuminate\Support\Facades\Process::run(string)` 底层使用 Symfony `Process::fromShellCommandline()`，文件名中的 shell 元字符会被 `/bin/sh` 或 Windows 平台 shell 解释执行。攻击者可通过构造包含恶意文件名的备份归档，诱导管理员或自动化系统恢复该归档，从而以 PHP/Laravel 应用用户的身份执行任意系统命令，导致应用被控制、数据库凭据泄露、数据篡改及横向移动。该漏洞影响 `wnx/laravel-backup-restore` 包 v1.9.4 之前的所有版本，已在 v1.9.4 中修复。'
published = "2026-01-01T00:00:00Z"
remediation = "立即将 wnx/laravel-backup-restore 升级至 v1.9.4 及以上版本，该版本已修复数据库恢复过程中 ZIP 条目文件名未转义导致的命令注入问题。由于无配置缓解措施，升级是唯一完整的修复方案，请勿对不可信来源的备份归档执行恢复操作。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "wnx laravel-backup-restore 数据库恢复过程操作系统命令注入漏洞"
updated = "2026-01-01T00:00:00Z"

