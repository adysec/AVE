[basic]
description = "tags.<value>Microsoft Windows 95/98/NT/2000 系统在实现 CIFS 浏览器协议与 NetBIOS 协议交互时存在缓冲区溢出漏洞。远程攻击者可通过发送伪造的 Browse Frame Request 数据报（单播或 UDP 广播），篡改目标系统的动态 NetBIOS 名称缓存条目。该漏洞影响 Windows 9x/NT 4.0/2000 等版本，CVSS 评分为 7.5，危害等级为高危。攻击者无需身份认证即可利用此漏洞，触发缓冲区溢出后可能实现远程代码执行或导致系统服务中断。"
published = "2000-08-29T04:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-072 对应的补丁程序，升级 Windows 95/98/NT 4.0/2000 系统至最新可用版本。若无法立即打补丁，可在网络边界防火墙处阻断 UDP 137、UDP 138 及 TCP 139 端口的入站流量，或在受影响的系统上禁用 NetBIOS over TCP/IP 协议以降低攻击面。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Microsoft Windows NetBIOS缓冲区溢出漏洞"
updated = "2026-06-16T21:53:06.423"

