[basic]
description = "Microsoft Internet Explorer 5.01 的 WebBrowser 控件中 IFRAME 组件存在跨框架安全策略绕过漏洞。远程攻击者可通过构造恶意网页触发 NavigateComplete2 事件，绕过跨框架安全策略访问其他框架的敏感信息。该漏洞影响 Internet Explorer 5.01 版本，CVSS 评分 2.6（AV:N/AC:H/Au:N/C:P/I:N/A:N），攻击复杂度高、需用户交互、仅影响机密性。攻击者需诱导受害者访问恶意页面触发 NavigateComplete2 事件，可读取跨域框架内容导致信息泄露。Microsoft 已发布安全更新修复此漏洞，建议升级至 IE 5.01 SP1 或更高版本。"
published = "2000-06-06T04:00:00Z"
remediation = "立即停止使用 IE 5.01 及其所有版本，建议迁移到 IE 6+ 及以上版本或现代浏览器（Chrome/Firefox/Edge），并强制执行 ActiveX 和脚本控制策略以缓解此类漏洞风险"
score = 2.6
severity = "LOW"
sources = ["avd"]
title = "Microsoft Internet Explorer 跨框架安全策略绕过漏洞"
updated = "2026-06-16T21:51:52Z"

