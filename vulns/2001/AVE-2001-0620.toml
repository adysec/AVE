[basic]
description = 'MDaemon Pro 3.5.1 及更早版本存在安全绕过漏洞。本地攻击者可在密码提示框中点击"取消"按钮，再按下回车键，即可绕过"锁定服务器"安全设置，未经授权访问服务器管理功能。该漏洞利用条件低（需本地访问权限），但成功利用后可导致机密性、完整性和可用性完全丧失，CVSS 评分 7.2，危害等级高。'
published = "2001-02-12T05:00:00.000"
remediation = '升级 MDaemon Pro 至 3.5.2 或更高版本，该版本修复了在密码提示框点击取消后按回车键绕过"锁定服务器"安全设置的问题。如无法升级，建议在服务器本地安全策略中限制非管理员用户的交互式登录权限，并启用操作系统的屏幕保护程序密码保护作为临时缓解措施。'
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Alt-N MDaemon Pro 安全绕过漏洞"
updated = "2026-06-16T21:53:39.800"

