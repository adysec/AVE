[basic]
description = "bftpd 1.0.11 版本的 FTP 守护进程在处理 USER 命令时存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过发送超长的 USER 命令参数触发栈缓冲区溢出，导致拒绝服务（守护进程崩溃）甚至可能在服务器进程上下文中执行任意代码。该漏洞影响 bftpd 1.0.11 版本，攻击者无需认证即可远程发起攻击，CVSS 评分 7.5（高危），攻击向量为网络、攻击复杂度低、无需认证、可部分影响机密性/完整性/可用性。攻击者只需向 FTP 服务发送畸形的超长 USER 命令即可触发漏洞，可能导致服务崩溃或在特定内存布局下实现远程代码执行。"
published = "2000-12-19T05:00:00.000"
remediation = "升级至 bftpd 1.0.12 或更高版本修复缓冲区溢出漏洞；若暂无法升级，请在防火墙层面限制 FTP 端口（默认 21）仅对可信 IP 开放，并在 bftpd.conf 中设置 max_login_fails 限制登录尝试次数、禁用匿名登录（anonymous_enable=no）作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "bftpd bftpd 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:49.340"

