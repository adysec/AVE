[info]
author = "ave"
description = "Internet Explorer MSHTML 引擎 use-after-free 漏洞验证，通过构造包含特定 JavaScript DOM 操作的 HTML 页面触发 mshtml.dll 中的 CElement::ie9_removeAttributeNodeInternal 函数漏洞，实现远程代码执行"
id = "POC-AVE-2021-1000"
name = "CVE-2021-26411 IE MSHTML Use-After-Free PoC"
severity = "high"
tags = ["ave-2021-1000"]
vuln_id = [
    "CVE-2021-26411",
    "AVE-2021-1000",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "removeAttributeNode",
    "clearAttributes",
    "valueOf",
]
