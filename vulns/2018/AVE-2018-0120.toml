[basic]
description = "Monstra CMS 3.0.4 的 plugins/captcha/crypt/cryptographp.php 文件中 cfg 参数存在 HTTP 响应头注入漏洞（CRLF 注入，CWE-113）。远程攻击者可通过向 cfg 参数注入 CRLF 序列（%0d%0a）来插入任意 HTTP 响应头或分割响应体，结合用户交互（如点击恶意链接）可触发反射型 XSS 攻击或 HTTP 响应缓存投毒。该漏洞攻击复杂度低，无需身份认证，影响 Monstra CMS 3.0.4 版本。"
published = "2018-09-12T23:29:00Z"
remediation = '''立即升级 Monstra CMS 至 3.0.5 或更高版本（如官方已发布）。若官方未发布修复版本，手动修改 plugins/captcha/crypt/cryptographp.php，对 cfg 参数进行 CRLF 字符过滤：在接收 cfg 参数后使用 preg_replace('/[\r\n]/', '', $_GET['cfg']) 去除换行符，防止 HTTP 响应头注入。同时建议迁移至其他仍在维护的 CMS 系统，因 Monstra CMS 项目已长期未更新。'''
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Monstra CMS HTTP响应头注入漏洞"
updated = "2026-06-17T01:45:09Z"

