[basic]
description = "CVS 1.11.4 及更早版本中存在双重释放（Double-free）漏洞，远程攻击者可通过向 CVS 服务器发送特制的 Directory 请求触发该漏洞，导致堆内存损坏，进而造成拒绝服务甚至远程代码执行。该漏洞还可绕过写入权限检查，执行 Update-prog 和 Checkin-prog 命令，进一步扩大危害。攻击无需身份认证，通过网络即可完成利用。"
published = "2003-02-07T05:00:00Z"
remediation = "立即将 CVS 服务器升级至 1.11.5 或更高版本。各发行版对应操作：Red Hat Linux 安装 RHSA-2003:012/013 更新包；Debian 升级至 1.11.1p1debian-8.1（woody）或 1.10.7-9.2（potato）；FreeBSD 应用 SA-03:01 补丁。如无法立即升级，可采取临时缓解措施：在防火墙层面阻止对 TCP 2401 端口的访问，禁用匿名 CVS 访问，或将 CVS 服务器置于 chroot 隔离环境中运行以限制攻击影响范围。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "CVS 1.11.4 及之前版本 Double-Free 远程代码执行漏洞"
updated = "2026-06-16T22:01:20Z"

