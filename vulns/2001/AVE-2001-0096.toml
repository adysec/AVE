[basic]
description = "Microsoft Internet Security and Acceleration (ISA) Server 2000 的 Web Proxy 组件存在拒绝服务漏洞。由于未对超长 Web 请求进行充分验证，未经身份认证的远程攻击者可通过向目标服务器发送特定类型的超长 HTTP 请求触发该漏洞，导致服务异常或系统崩溃。该漏洞影响运行 Microsoft ISA Server 2000 的服务器，攻击者无需认证即可利用，攻击复杂度低。Microsoft 已发布安全更新修复此漏洞。"
published = "2001-07-02T04:00:00Z"
remediation = '安装 Microsoft 安全公告 MS01-021 发布的补丁（或升级到 ISA Server 2000 Service Pack 1），补丁已集成在后续 Service Pack 中，可从 Microsoft Update Catalog 下载并安装。如暂无法立即打补丁，应在 ISA Server 管理控制台中将 Web Publishing 功能保持默认禁用状态，防止外部攻击者利用；同时确保防火墙规则限制内部用户对 Web Proxy 服务的异常长 URL 请求，并在 Web Proxy 服务异常终止时通过"管理 ISA Server"服务将其重新启动，无需重启服务器。'
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "微软 ISA Server 2000 Web Proxy 拒绝服务漏洞"
updated = "2026-06-16T21:53:56Z"

