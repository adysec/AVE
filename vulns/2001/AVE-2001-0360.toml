[basic]
description = "IRIX 6.5.13f 及更早版本的 LPD（Line Printer Daemon）服务中，lpsched 进程在处理打印任务时未对用户输入进行充分的命令过滤，允许远程攻击者通过构造包含 shell 元字符（如 ;、|、` 等）的恶意打印请求，在目标系统上执行任意操作系统命令。该漏洞影响所有运行 IRIX 6.5.13f 或更早版本的 SGI IRIX 服务器，无需身份认证即可远程触发，CVSS 评分 10.0，危害等级极高。攻击者可利用此漏洞完全控制系统，窃取敏感数据或 further 渗透内部网络。目前公开 ExploitDB 上已有编号 10033 的 PoC 可供验证，但官方修复方案需升级至 IRIX 6.5.14 或后续版本。"
published = "2001-12-06T05:00:00Z"
remediation = "立即将 IRIX 操作系统升级至 6.5.24 或更高版本，该版本已修复 lpsched 中的 shell 元字符注入漏洞。如无法立即升级，可临时禁用 lpd 服务（停止 lpsched 进程并注释 /etc/inetd.conf 中的 lpd 条目），同时在主机防火墙层面限制来自外部网络的 TCP 6101/515 端口访问，仅允许受信任的管理网络段连接。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "IRIX LPD 远程命令执行漏洞"
updated = "2026-06-16T21:54:58Z"

