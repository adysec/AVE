[basic]
description = "Microsoft IIS 4.0/5.0 存在可执行文件解析漏洞，远程攻击者可通过向服务器发送特制的畸形请求，在可执行文件名后附加操作系统命令，导致服务器解析并执行任意命令。该漏洞影响 IIS 4.0 和 5.0 版本，无需身份认证即可远程利用，CVSS 评分 7.5，危害等级高。攻击者可通过 HTTP 请求构造恶意 URI 触发该漏洞，实现远程命令执行，进而控制目标服务器。"
published = "2000-12-19T05:00:00Z"
remediation = "该漏洞影响 Microsoft IIS 4.0/5.0，微软已在 2000 年发布安全公告 MS00-086 提供补丁。建议立即安装对应补丁，或升级至 Windows 2000 Service Pack 3 及以上版本。如无法升级，可在 IIS 管理器中禁用可执行文件映射中的 .exe 扩展名处理作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Microsoft IIS 4.0/5.0 Web Server 文件请求解析远程代码执行漏洞"
updated = "2026-06-16T21:52:40Z"

