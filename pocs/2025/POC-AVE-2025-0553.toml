[info]
author = "ave"
description = "该检测旨在验证Google Chrome浏览器V8引擎是否存在CVE-2025-13227类型的混淆漏洞。通过访问目标URL并分析响应内容，检测是否存在特定的漏洞特征。若检测到漏洞特征，则表示目标可能受到影响。"
id = "POC-AVE-2025-0553"
name = "Google Chrome V8 类型混淆漏洞检测"
severity = "high"
tags = ["ave-2025-0553"]
vuln_id = [
    "CVE-2025-13227",
    "AVE-2025-0553",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Google Chrome"]
