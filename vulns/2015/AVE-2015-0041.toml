[basic]
description = "Xceedium Xsuite 2.4.4.5及更早版本存在开放重定向漏洞（CWE-601）。远程攻击者可通过向 redirurl 参数中注入恶意 URL，诱使用户点击特制链接后跳转至任意外部网站，进而实施钓鱼攻击。该漏洞攻击复杂度低，无需认证，但需用户交互。成功利用可导致用户敏感信息泄露，影响数据机密性和完整性。建议升级至最新版本以修复此漏洞。"
published = "2017-09-25T17:29:00Z"
remediation = "升级 Xceedium Xsuite 至 2.4.4.6 或更高版本（该产品后更名为 CA Privileged Access Manager），建议直接升级至 CA Privileged Access Manager 3.0.0 或更高版本以修复所有已知漏洞。如无法立即升级，可在 Web 应用防火墙（WAF）层面添加规则，对 /openwin.php 的 redirurl 参数进行白名单校验，仅允许跳转到可信域名。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Xceedium Xsuite 开放重定向漏洞"
updated = "2026-06-17T00:27:41Z"

