[basic]
description = "tags.<value>GDAM123 0.933 和 0.942 版本在处理文件名参数时存在缓冲区溢出漏洞。当程序接收用户提供的超长文件名参数时，未对输入长度进行有效边界检查，导致栈缓冲区溢出。攻击者可通过构造特制的超长文件名参数传入程序，触发溢出并覆盖返回地址，从而在目标系统上执行任意代码。该漏洞影响运行上述版本 GDAM123 软件的本地用户环境，攻击者需要具备对目标主机的本地访问权限才能利用此漏洞。成功利用后，攻击者可在当前用户权限下执行任意指令，造成系统完全被控、敏感数据泄露或进一步横向渗透等严重后果。CVSS 评分 7.2，危害等级高。"
published = "2002-12-31T05:00:00Z"
remediation = "建议立即停止使用 GDAM123 0.933 和 0.942 版本，并彻底移除 setuid root 权限（该漏洞在 setuid root 安装时可被本地用户利用获取 root 权限）。如确需继续使用，应替换为受信任且持续维护的替代 MP3 播放器（如 mpg123、mpv 等），并确保以普通用户权限运行。同时检查系统中所有 SUID 二进制文件，确认 gdam123 不在其中，临时缓解措施为删除或重命名该程序可执行文件以防误用。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "GDAM123 文件名缓冲区溢出漏洞"
updated = "2026-06-16T22:00:06Z"

