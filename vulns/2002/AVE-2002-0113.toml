[basic]
description = "AT 计划任务调度程序 3.1.8 版本存在堆内存破坏漏洞。当用户通过 `at` 命令提交定时任务时，程序对畸形格式的执行时间参数处理不当，导致同一堆内存区域被重复释放（double-free），进而引发堆内存损坏。本地攻击者可通过构造特制的时间字符串触发该漏洞，实现权限提升并以目标用户身份执行任意代码。该漏洞影响 Linux/Unix 系统下的 AT 程序，CVSS 评分 7.2，危害等级高。"
published = "2002-02-27T05:00:00Z"
remediation = "立即升级 at 软件包至修复版本：Debian 2.2 (potato) 升级至 >=3.1.8-6.1，Debian 2.3 (woody) 升级至 >=3.1.8-9。执行 `apt-get update && apt-get upgrade at` 完成更新。如无法升级，可移除 at 的 setuid 位（`chmod u-s /usr/bin/at`）以消除本地提权风险，但会影响普通用户使用 at 命令。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "GNU AT 计划任务工具本地堆溢出漏洞"
updated = "2026-06-16T21:56:34Z"

