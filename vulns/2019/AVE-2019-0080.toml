[basic]
description = "Open-School 3.0 及 Community Edition 2.3 存在跨站脚本（XSS）漏洞，源于应用程序在 osv/index.php?r=students/guardians/create 页面的 id 参数处未对用户输入进行充分过滤与转义，导致未经身份认证的远程攻击者可通过构造包含恶意 JavaScript 代码的 URL 并诱导管理员或用户点击访问，从而在受害者的浏览器中执行任意脚本。该漏洞利用条件为网络可达（AV:N），攻击复杂度低（AC:L），无需身份验证（PR:N），但需要用户交互（UI:R），可对同域下的其他会话造成 Cookie 窃取、会话劫持及页面篡改等危害。影响版本为 Open-School 3.0 及 Community Edition 2.3，CVSS v3.0 评分为 6.1（MEDIUM），CWE 类型为 CWE-79（跨站脚本）。"
published = "2019-08-06T16:15:11.640"
remediation = "Open-School 官方未发布针对此漏洞的修复版本。建议在 osv/index.php?r=students/guardians/create 页面代码中对 id 参数增加输入验证，仅允许数字格式并通过 htmlspecialchars 过滤后输出；同时在 Web 服务器或 WAF 层面配置拦截包含 &lt;script&gt; 等 HTML 标签的请求，作为临时缓解措施可暂时禁用学生监护人创建功能。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Open-School 学生监护人管理功能跨站脚本漏洞"
updated = "2026-06-17T02:18:50.110"

