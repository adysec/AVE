[basic]
description = "PHP-Nuke 5.3.1 及更早版本中存在跨站脚本（XSS）漏洞，远程攻击者可通过向 user.php 的 uname 参数、modules.php 的 ttitle/letter/file 参数、submit.php 的 subject/story/storyext 参数、admin.php 的 upload 参数以及 friend.php 的 fname 参数注入恶意 Web 脚本或 HTML 代码，在受害者浏览器中执行任意脚本，导致敏感信息泄露（如会话 Cookie 窃取）。攻击者无需身份认证，仅需诱使用户点击特制链接即可触发，影响范围包括 PHP-Nuke 1.0 至 5.3.1 全系列版本。"
published = "2001-12-31T05:00:00Z"
remediation = "升级 PHP-Nuke 至 7.3 或更高版本（若仍在使用），该版本修复了 user.php、modules.php、submit.php、admin.php 和 friend.php 中多处跨站脚本漏洞。由于 PHP-Nuke 已停止维护，建议立即迁移至现代 CMS（如 WordPress 或 Joomla）。临时缓解措施：在 Web 服务器层面（如 Apache mod_security）对 uname、ttitle、letter、file、subject、story、storyext、upload、fname 等参数实施输入过滤，禁止 <script> 等 HTML 标签。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "PHP-Nuke 跨站脚本漏洞"
updated = "2026-06-16T21:56:26Z"

