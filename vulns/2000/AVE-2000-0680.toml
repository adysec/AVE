[basic]
description = "Microsoft Windows Media Player 7 的 OCX 控件存在资源释放不当漏洞，当 RTF 格式邮件中嵌入特制的 OCX 控件且未正确关闭时，可导致目标系统发生拒绝服务。攻击者可通过向受害者发送包含恶意 OCX 控件的 RTF 邮件触发该漏洞，无需用户交互即可利用。该漏洞影响 Windows Media Player 7 及支持 OCX 控件的邮件客户端，CVSS 评分 5.0，危害等级中等。"
published = "2000-12-19T05:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-068 提供的补丁，下载地址为 https://www.microsoft.com/download/details.aspx?FamilyId=69EDE8CE-86E7-4CCB-ABAC-2A1CF1C46406。该补丁修改了 Windows Media Player 7 的 OCX 控件在关闭嵌入 OCX 的 RTF 邮件时的行为。如无法安装补丁，可暂时卸载 Windows Media Player 7，或在邮件客户端中禁用 RTF 格式邮件预览，将 Outlook/Outlook Express 设置为以纯文本方式阅读邮件。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft Windows Media Player 7 OCX 控件拒绝服务漏洞"
updated = "2026-06-16T21:52:47.363"

