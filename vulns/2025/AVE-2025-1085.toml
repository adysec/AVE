[basic]
description = "tags as requested.<value>Linux 内核的 XDP 套接字（AF_XDP）子系统中存在整数溢出漏洞，位于 xp_create_and_assign_umem() 函数内。由于变量 i 和 pool->chunk_size 均为 32 位无符号整数类型，二者相乘时可能发生回绕溢出，溢出结果随后被强制转换为 64 位无符号整数，导致内存地址计算错误。攻击者可通过构造特制的 XDP 套接字操作触发该整数溢出，使两个不同的 XDP 缓冲区指向同一块内存区域，造成内存数据损坏或未定义行为，最终可能导致系统崩溃或本地拒绝服务。该漏洞需要攻击者拥有本地登录用户权限才能利用，影响运行受影响版本 Linux 内核的系统。建议用户升级至修复该漏洞的内核版本。"
published = "2025-04-03T08:15:15Z"
remediation = "建议将 Linux 内核升级至修复版本：6.1.132、6.6.85、6.12.21、6.13.9 或更高稳定版本。如无法立即升级，可通过 sysctl 或内核启动参数禁用 AF_XDP/XSK 功能作为临时缓解措施，或从 kernel.org 应用相关补丁（commit 130290f44bce0eead2b827302109afc3fe189ddd）。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux内核 xsk套接字 整数溢出漏洞"
updated = "2026-06-17T08:44:48Z"

