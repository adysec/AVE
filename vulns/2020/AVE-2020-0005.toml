[basic]
description = "Windows CryptoAPI（Crypt32.dll）在验证椭圆曲线加密（ECC）证书时存在欺骗漏洞。攻击者可通过精心构造的 ECC 公钥和曲线参数生成伪造的代码签名证书，用于签署恶意可执行文件，使其看似来自受信任的合法来源。该漏洞影响所有受支持的 Windows 版本，包括 Windows 10 和 Windows Server 2016/2019。攻击者需要诱使用户运行恶意程序（用户交互），无需身份认证即可远程利用。CVSS 评分 8.1，危害等级高。Microsoft 已在 2020 年 1 月安全更新中修复此漏洞。"
published = "2020-01-14T23:15:30Z"
remediation = "立即安装 Microsoft 2020 年 1 月安全更新（KB4534271 适用于 Windows 10 v1903/v1909，KB4534297 适用于 Windows Server 2019，KB4534273 适用于 Windows 8.1/Server 2012 R2），或通过 Windows Update 自动更新。无法立即打补丁时，可启用 Windows Defender 增强签名验证策略，并配置组策略禁止加载未签名第三方代码作为临时缓解措施。"
score = 8.1
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows CryptoAPI 椭圆曲线加密证书欺骗漏洞"
updated = "2026-06-17T02:46:08Z"

