[basic]
description = "Linux内核usbnet/ipheth驱动存在整数溢出漏洞，DPE长度检查中wDatagramIndex与wDatagramLength相加可能超过U16_MAX导致溢出，引发越界内存读取。攻击者需本地访问权限，通过构造特制的USB网络设备请求触发该漏洞，可读取内核内存中的敏感信息，造成信息泄露与权限提升风险。该漏洞影响使用ipheth驱动的Linux系统，CVSS评分为7.1，危害等级高。"
published = "2025-02-27T03:15:14.933"
remediation = "升级 Linux 内核至 6.14 或更高版本以修复 DPE 长度检查溢出漏洞。Ubuntu 用户请更新至 linux-hwe-6.8 6.8.0-64.67 或更高版本，或 linux-generic 6.11.0-26.26 或更高版本。Debian 用户请更新至 6.12 或更高版本。更新后重启系统使新内核生效。若无法立即升级，可在系统层面限制 USB 网络设备权限作为临时缓解措施。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 usbnet/ipheth 驱动 DPE长度检查整数溢出漏洞"
updated = "2026-06-17T08:44:10.293"

