[basic]
description = "IBM Planning Analytics 2.0.0至2.0.8版本存在配置覆盖漏洞，未经身份认证的远程攻击者可通过篡改服务器配置文件将认证方式修改为CAM（Cognos Access Manager）模式，进而伪造CAM认证并以管理员身份登录系统。攻击者随后可利用TM1脚本功能执行任意操作系统命令，最终获得目标服务器root或SYSTEM权限，实现完整的远程代码执行。该漏洞影响Windows及Linux平台上的Planning Analytics部署，CVSS评分为9.8，危害等级严重。攻击者仅需网络可达目标服务器管理端口即可完成利用，无需任何凭据或用户交互。IBM已在Planning Analytics 2.0.9中修复此漏洞。"
published = "2019-12-18T17:16:43Z"
remediation = "升级到 IBM Planning Analytics 2.0.9 或更高版本。该漏洞影响 2.0.0 至 2.0.8 版本，IBM 官方未提供临时缓解措施，必须安装 2.0.9 修复版本。请通过 IBM 支持门户下载补丁并按照官方指引完成升级，升级前请备份现有配置与数据。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "IBM Planning Analytics 配置覆盖未授权远程代码执行漏洞"
updated = "2026-06-17T02:36:50Z"

