[basic]
description = 'cryptography 库的 PKCS#7 EnvelopedData 解密功能存在 Bleichenbacher 预言机漏洞。在解密 RecipientInfo 的 encryptedKey 过程中，函数以多种可区分的方式报告结果，其中部分错误响应和时序差异可泄露 RSA 操作恢复的密钥确切长度。该漏洞影响 cryptography 44.0.0 至 50.0.0 版本，后端使用 OpenSSL 3.0/3.1、LibreSSL 或 BoringSSL 的应用受影响（这些库缺乏隐式拒绝机制）。攻击条件要求应用自动解密攻击者提供的 EnvelopedData 并反映解密结果，典型场景为 S/MIME 网关或邮件过滤器。攻击者可通过发送特制密文并观察不同错误反馈（如"Invalid key size (N)"）或响应时间差异，实施自适应选择密文攻击，逐步恢复内容加密密钥，最终解密敏感邮件内容。该漏洞已于 50.0.0 版本修复。'
published = "2026-08-03T22:16:52Z"
remediation = "建议将 Python cryptography 库升级至 50.0.0 或更高版本，可通过 pip install --upgrade cryptography>=50.0.0 命令完成升级。如短期内无法升级，建议临时停止对外提供自动解密外部 EnvelopedData 的功能，或通过防火墙/WAF 规则限制仅接受来自受信任来源的加密数据，以消除 Bleichenbacher 预言机攻击面。"
score = 8.2
severity = "HIGH"
sources = ["ghsa"]
title = "cryptography PKCS#7 EnvelopedData 解密侧信道信息泄露漏洞"
updated = "2026-08-04T15:16:43Z"

