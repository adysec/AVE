[basic]
description = "websocket-driver 是一个可插拔 I/O 的 WebSocket 协议处理器，其 draft 版本协议帧格式中的长度头字段允许将任意大的整数编码为高位设置为 1 的字节序列。攻击者可通过发送包含无限个 0x80 及以上字节值的消息，使服务器在 lib/websocket/driver/draft75.js 中将这些字节解析为不断增长的整数。由于 JavaScript 使用 64 位浮点数表示数值，该整数最终会超出精确表示范围导致精度丢失，进而使后续载荷被错误解析，造成消息损坏。攻击者无需身份认证即可远程触发此漏洞，影响所有使用 websocket-driver 0.7.5 之前版本的应用。该漏洞 CVSS 评分 9.2，危害等级严重，建议立即升级至 0.7.5 版本。"
published = "2026-07-17T21:17:08Z"
remediation = "立即将 websocket-driver 升级至 0.7.5 或更高版本。该版本已通过拒绝超过最大消息长度的长度头来修复此漏洞。由于无已知临时缓解措施，升级是唯一有效的修复方案。对于使用 npm 的项目，执行 `npm install websocket-driver@0.7.5`；对于直接引用的项目，从 https://github.com/faye/websocket-driver-node 获取最新版本。"
score = 9.2
severity = "CRITICAL"
sources = ["ghsa"]
title = "Faye websocket-driver 协议长度头解析整数溢出导致消息损坏漏洞"
updated = "2026-07-23T16:18:40Z"

