[basic]
description = "Microsoft 高性能计算 (HPC) Pack 存在远程代码执行漏洞，源于对关键功能缺乏身份认证（CWE-306）。已获得低权限的攻击者可通过相邻网络向受影响系统发送特制请求，在无需用户交互的情况下利用该漏洞，在目标服务器上以 HPC Pack 服务权限执行任意代码，从而完全控制目标系统。该漏洞影响 Microsoft HPC Pack 多个版本，CVSS 评分 9.0，危害等级严重。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:31Z"
remediation = "将 Microsoft HPC Pack 2016 升级到 2016.3 或更高版本，将 HPC Pack 2019 升级到 6.3.8328.0 或更高版本。补丁通过 Microsoft Update 或 Microsoft 下载中心获取。临时缓解措施：在防火墙层面限制对 HPC Pack 节点（默认端口 443/9090）的访问，仅允许受信任的管理员 IP 连接。"
score = 9
severity = "CRITICAL"
sources = ["msrc"]
title = "Microsoft 高性能计算 (HPC) Pack 远程代码执行漏洞"
updated = "2026-06-17T08:42:45Z"

