[basic]
description = "Taylor UUCP 1.06 版本的 uuxqt 组件未能正确过滤和移除危险的长选项参数，允许本地用户通过调用 uux 并使用 --config 选项指定备用配置文件来提升权限。该漏洞为本地权限提升漏洞，攻击者需先在目标系统上拥有本地账户权限，利用 uux 命令的参数处理缺陷，可绕过权限检查获取更高权限，进而在系统上执行任意操作。CVSS 评分为 7.2，属于高危级别。"
published = "2001-12-21T05:00:00Z"
remediation = "升级 Taylor UUCP 至 1.07 或更高版本以修复参数处理缺陷。Debian 用户可参考 DSA-079 安全通告更新 uucp 包，Red Hat 用户应应用 RHSA-2001:165 通告中的补丁，Caldera 用户参考 CSSA-2001-033.0，SuSE 用户参考 SuSE-SA:2001:38。临时缓解措施：移除 uuxqt 的 setuid 权限（chmod u-s /usr/sbin/uuxqt），并限制本地用户对 uux 命令的调用权限。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Taylor UUCP 1.0.6 - Argument Handling Privilege Escalation 漏洞"
updated = "2026-06-16T21:55:08Z"

