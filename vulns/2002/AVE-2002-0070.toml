[basic]
description = "wget 1.8.2-4 之前版本存在目录遍历漏洞，远程 FTP 服务器可通过构造包含绝对路径（/absolute/path）或相对路径遍历序列（..）的文件名，诱导 wget 客户端下载时以 wget 用户权限任意创建或覆盖本地文件系统中的文件。该漏洞源于 wget 在处理 FTP 服务器返回的文件名时未充分验证路径合法性，攻击者仅需控制或伪造恶意 FTP 服务器，即可在受害者执行 wget 下载命令时触发漏洞，导致任意文件写入，可能进一步实现代码执行或系统配置篡改。影响所有使用受影响版本 wget 从不可信 FTP 源下载文件的用户。CVSS 5.0（AV:N/AC:L/Au:N/C:N/I:P/A:N），建议升级至 1.8.2-4 或更高版本。"
published = "2002-12-18T05:00:00Z"
remediation = "升级 wget 到 1.8.2-4 或更高版本以获取补丁修复目录遍历漏洞，并确保安全路径验证机制生效，可在配置中启用 `--restrict-file-names=unix` 限制文件名格式，禁止包含路径遍历序列。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "GNU wget 目录遍历漏洞"
updated = "2026-06-16T21:59:08Z"

