[basic]
description = "Linux 内核 drm/amd/display 组件中存在 slab-use-after-free 漏洞。当 HDCP 功能销毁时，property_validate_dwork 延迟工作队列仍处于运行状态，导致系统在已释放的内存 slab 上执行读写操作。该漏洞影响使用 AMD GPU 显示驱动的 Linux 内核系统，具有本地访问权限的攻击者可通过竞争条件触发此漏洞，利用释放后内存访问实现权限提升或获取敏感内核信息。攻击者需具备本地登录权限，无需用户交互即可在受影响系统上执行任意代码，可能导致系统崩溃或完全被攻击者控制。该漏洞 CVSS 评分为 7.8，危害等级为高。"
published = "2025-04-01T16:15:28Z"
remediation = "建议立即升级 Linux 内核至包含修复提交 725a04ba5a95e89c89633d4322430cfbca7ce128 的版本（如 6.6.28+、6.1.85+、5.15.153+、5.10.215+ 等稳定分支对应版本）。若暂时无法升级，可通过内核参数 `amdgpu.hdcp=0` 禁用 AMD GPU HDCP 功能作为临时缓解措施，或在内核命令行添加 `module_blacklist=amdgpu` 禁用 amdgpu 模块（会导致显卡加速失效）。Debian/Ubuntu 用户可执行 `apt update && apt install linux-image-generic` 安装最新安全内核，RHEL/Fedora 用户执行 `dnf update kernel`。升级后必须重启系统生效。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 AMD GPU 显示驱动 slab-use-after-free 漏洞"
updated = "2026-06-17T08:44:44Z"

