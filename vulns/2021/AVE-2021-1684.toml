[basic]
description = "Apple GPU驱动中存在越界写入漏洞，该组件负责处理设备图形渲染及GPU相关操作，由于缺乏充分的边界检查，攻击者可通过向缓冲区外内存区域写入数据覆盖内核内存，从而获得内核级权限执行任意代码。该漏洞影响iOS 14至14.8.0版本、iPadOS 14至14.8.0版本以及iOS 15和iPadOS 15初始版本，已在iOS 14.8.1、iPadOS 14.8.1、iOS 15.1及iPadOS 15.1中修复，由安天安全实验室研究员Yinyi Wu发现。攻击条件为攻击者需在目标设备上安装恶意应用程序，并通过精心构造的输入触发GPU驱动越界写入，成功利用后可获取内核权限，完全控制设备系统。该漏洞已被CISA列入已知被利用漏洞目录（KEV），证实存在在野利用。建议用户尽快升级至安全版本。"
published = "2021-08-24T19:15:18Z"
remediation = "建议将 iOS 升级至 15.1 或更高版本，iPadOS 升级至 15.1 或更高版本；若设备不支持 15.1，可升级至 iOS 14.8.1 或 iPadOS 14.8.1。如暂无法立即升级，请在「设置」>「通用」>「设备管理」中限制仅允许安装 App Store 来源的应用，并卸载已安装的可疑第三方应用，同时避免打开来源不明的应用程序链接以降低被利用风险。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Apple iPadOS 内核越界写入远程代码执行漏洞"
updated = "2026-06-17T03:51:06Z"

