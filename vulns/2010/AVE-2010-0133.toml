[basic]
description = 'Apple QuickTime 7.6.9 之前版本在 Windows 系统上安装时，将用户配置文件中的 "Apple Computer" 目录权限设置为过于宽松的权限，导致本地低权限用户可读取该目录下的敏感文件，造成信息泄露。攻击者只需拥有本地账户登录权限即可利用，无需交互，攻击复杂度低。Apple 已发布 QuickTime 7.6.9 版本修复此问题。'
published = "2010-12-09T20:00:16Z"
remediation = '立即将 Apple QuickTime 升级至 7.6.9 或更高版本。对于 Windows 系统，同时手动修正 %UserProfile%\Apple Computer 目录的权限设置，移除 Everyone 和 Users 组的非必要访问权限，仅保留当前用户和管理员完全控制权限。如无法升级，可考虑使用组策略限制本地用户对用户配置文件中 Apple Computer 目录的读取权限作为临时缓解措施。'
score = 2.1
severity = "LOW"
sources = ["tenable"]
title = "Apple QuickTime Windows 信息泄露漏洞"
updated = "2026-06-16T23:16:20Z"

