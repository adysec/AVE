[basic]
description = "GSview 的 DSC 3.0 解析器中存在缓冲区溢出漏洞，该解析器被 KDE 1.1 及 KDE 3.0.3a 中的 KGhostView 所使用。远程攻击者可利用特制的 PostScript (.ps) 输入文件触发该溢出，导致目标系统拒绝服务，甚至可能执行任意代码。攻击无需身份认证即可远程发起，危害严重。"
published = "2002-10-28T05:00:00Z"
remediation = "建议将 KDE 升级至 3.0.4 及以上版本，该版本已修复 KGhostView 中 DSC 3.0 解析器的缓冲区溢出漏洞。无法升级时可从 ftp://ftp.kde.org/pub/kde/security_patches/ 下载对应补丁：KDE 3.0.3 应用 post-3.0.3-kdegraphics-kghostview.diff，KDE 2.2.2 应用 post-2.2.2-kdegraphics-kghostview.diff。Red Hat 用户请安装 RHSA-2002:220 更新，Mandrake 用户应用 MDKSA-2002:071，Sun 用户安装 SunSolve 补丁 101426。临时缓解措施为不要用 KGhostView 打开来源不可信的 PostScript (.ps) 或 PDF 文件。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "GSview DSC 3.0 解析器缓冲区溢出漏洞"
updated = "2026-06-16T21:58:57Z"

