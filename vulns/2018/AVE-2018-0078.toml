[basic]
description = "tags.<value>TOTOLINK A3002RU 固件 v1.0.8 的 password.htm 页面存在密码明文泄露漏洞，攻击者无需身份认证即可通过发送 GET 请求访问该页面，直接获取管理员用户的明文密码。该漏洞可被远程利用，攻击者仅需知道目标设备的 IP 地址即可触发，影响设备管理安全，可能导致管理员账户被完全接管。"
published = "2018-11-26T23:29:00Z"
remediation = "升级到TOTOLINK A3002RU最新固件版本（高于1.0.8），修复password.htm页面明文泄露管理员密码漏洞；临时缓解措施为在路由器管理界面中禁用或移除password.htm页面的公开访问权限，或通过防火墙规则禁止外部网络对路由器管理端口的HTTP访问。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "TOTOLINK A3002RU 路由器密码泄露漏洞"
updated = "2026-06-17T01:39:11Z"

