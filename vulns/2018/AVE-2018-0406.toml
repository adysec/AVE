[basic]
description = "DNN（DotNetNuke）9.2至9.2.1版本使用弱加密算法保护输入参数，攻击者可利用该加密缺陷绕过身份验证机制，通过构造特制的加密Cookie或请求参数实现反序列化攻击，进而获取目标系统的敏感信息。该漏洞无需身份验证即可远程利用，攻击复杂度低，主要影响系统的机密性，可能导致用户凭据、配置数据等敏感信息泄露。官方已在后续版本中修复此问题。"
published = "2019-07-03T17:15:10.110"
remediation = "立即升级 DNN (DotNetNuke) 至 9.2.2 或更高版本（推荐升级至最新的 10.3.x 版本），以修复弱加密算法问题。从 GitHub Releases 页面 (https://github.com/dnnsoftware/Dnn.Platform/releases) 下载更新包，按照官方升级指南完成升级。如无法立即升级，可在 Web 应用防火墙 (WAF) 层面添加规则，对包含异常加密参数的 Cookie 和请求进行拦截，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "DNN DNN Platform 弱加密算法漏洞"
updated = "2026-06-17T01:43:08.583"

