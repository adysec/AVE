[basic]
description = "Xvt 2.1 存在本地缓冲区溢出漏洞，该漏洞影响 Debian Linux 2.2 系统。本地攻击者可通过向 Xvt 程序的 -name 和 -T 命令行参数传递超长字符串触发缓冲区溢出，从而在目标系统上以当前用户权限执行任意代码。CVSS 评分 7.2，危害等级高。Debian 已发布安全公告 DSA-082 修复此漏洞。"
published = "2001-12-31T05:00:00Z"
remediation = "升级 xvt 至 2.1-13.0potato.1 或更高版本。Debian 2.2 (potato) 用户可通过 apt-get update && apt-get upgrade xvt 安装安全更新，或从 security.debian.org 下载对应架构的 deb 包手动安装。如无法升级，建议移除 xvt 的 setuid 位（chmod u-s /usr/bin/xvt）以降低本地提权风险。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "Debian Linux Xvt 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:56:30Z"

