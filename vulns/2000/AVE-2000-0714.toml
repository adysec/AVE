[basic]
description = "Windows 95/98/Me 的文件和打印共享服务存在共享级密码验证绕过漏洞。由于系统仅比对用户提供的密码与真实密码的第一个字符，远程攻击者无需知道完整密码，只需发送单字节密码即可绕过共享访问控制，实现对共享文件的未授权读取和写入。该漏洞影响 Windows 95、Windows 98 及 Windows Me 等操作系统，攻击者可在局域网环境下直接利用，无需身份认证。"
published = "2000-12-19T05:00:00.000"
remediation = "立即安装 Microsoft 官方补丁：Windows 95 用户下载并运行 273991USA5.EXE，Windows 98/98SE 用户下载并运行 273991USA8.EXE，Windows Me 用户下载并运行 273991USAM.EXE。如无法安装补丁，建议将文件共享从共享级访问控制切换为用户级访问控制（需加入 Windows NT 域），或改用 Windows NT/2000 系统作为文件服务器，避免使用密码保护的共享级访问。"
score = 6.4
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Windows 95/98/Me 文件与打印共享服务密码绕过漏洞"
updated = "2026-06-16T21:52:54.040"

