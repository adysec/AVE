[basic]
description = "Spring Data Commons 是 Spring Data 的基础模块，提供了统一的 Repository 和数据操作抽象。该漏洞源于 Spring Data Commons 在处理属性绑定时对特殊字符的过滤不当（CWE-94 代码注入）。攻击者无需身份认证，只需向 Spring Data REST 构建的 HTTP 资源接口，或通过 Spring Data 的投影机制发送投影式请求参数，即可注入恶意表达式或代码，最终在服务器端执行任意命令，导致远程代码执行（RCE）。受影响版本包括 1.13 系列（<1.13.10）、2.0 系列（<2.0.5）及旧的不受支持版本。攻击条件极低：仅需网络访问，无需用户交互。该漏洞可被用于完全控制目标服务器，危及业务系统的机密性、完整性和可用性。"
published = "2018-04-11T13:29:00Z"
remediation = "立即升级 Spring Data Commons 到 1.13.10（1.13.x 版本线）或 2.0.5（2.0.x 版本线）及更高版本；若通过 Spring Boot 管理依赖，请升级 Spring Boot 至 1.5.13（对应 1.13.x）或 2.0.5（对应 2.0.x）。同时升级 Spring Data REST 到 2.5.11、2.6.11 或 3.0.6 及以上版本。若 Spring Data REST 面向公网暴露且非业务必需，应尽快下线或通过网关/WAF 进行访问控制与参数过滤。对于使用 projection 绑定的自定义接口，务必移除或加强服务端输入校验，限制请求参数中的 SpEL 表达式注入。如暂无法升级，可在应用层拦截器中对所有请求参数进行白名单过滤，拒绝包含特殊字符（如括号、大括号、$、#、反引号等）的输入，并监控日志中是否存在异常的类型转换错误。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Spring Data Commons 远程代码执行漏洞 漏洞"
updated = "2026-06-26T18:44:14Z"

