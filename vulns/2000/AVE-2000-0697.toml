[basic]
description = "Sun HotJava Browser 3.0 存在任意 DOM 访问漏洞。该浏览器未正确实施同源策略（Same-Origin Policy）安全机制，远程攻击者可通过在具名窗口（named window）中打开 javascript: 协议的 URL，绕过浏览器安全沙箱限制，从而读取任意网页的 DOM（文档对象模型）内容。该漏洞影响所有运行 HotJava Browser 3.0 的用户，攻击者无需身份认证即可在受害者浏览器中执行 JavaScript 代码并窃取敏感信息，如 Cookie、会话令牌或其他页面中的私有数据。攻击条件为受害者需访问攻击者控制的网页或点击恶意链接，导致浏览器在具名窗口中加载 javascript: URL，进而实现跨域 DOM 数据窃取。CVSS 评分显示该漏洞通过网络即可利用，攻击复杂度低，无需认证，主要影响数据保密性。"
published = "2000-12-19T05:00:00Z"
remediation = "Sun HotJava Browser 3.0 已停止官方支持，厂商未发布安全补丁。建议立即卸载并迁移至现代浏览器（如 Mozilla Firefox、Google Chrome 或 Microsoft Edge），以避免任意 DOM 访问风险。如短期内无法替换，应在网络边界部署代理或防火墙规则，过滤包含 javascript: 协议的 URL 请求，并在所有终端禁用该浏览器作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Sun HotJava Browser 3 任意 DOM 访问漏洞"
