[basic]
description = "Phoenix Framework 1.0.0 至 1.3.0-rc.0 版本存在未经验证的重定向漏洞（CWE-601），远程攻击者可构造恶意 URL 将用户重定向至不可信的外部站点，结合社会工程学手段实施钓鱼攻击。攻击者无需认证，但需诱使用户点击恶意链接。该漏洞影响范围广，可能导致用户凭证泄露或恶意软件下载。官方建议升级至修复版本或对重定向目标进行白名单校验。"
published = "2017-11-17T21:29:00Z"
remediation = '立即升级 Phoenix Framework 至安全版本：v1.0.x 升级到 v1.0.5+，v1.1.x 升级到 v1.1.7+，v1.2.x 升级到 v1.2.3+，v1.3.0-rc.0 升级到 v1.3.0-rc.1+。在 mix.exs 中更新 phoenix 依赖后执行 `mix deps.update phoenix`。如无法升级，在 Controller 中重写 redirect/2 函数，检查 to 参数是否包含反斜杠 `\` 字符并拒绝此类请求。'
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Phoenix Framework URL重定向漏洞"
updated = "2026-06-17T00:58:51Z"

