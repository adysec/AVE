[basic]
description = "该漏洞是 Sierra Half-Life 专用服务器 build 1573 及更早版本中存在的格式字符串漏洞。当远程攻击者向服务器发送包含格式化字符串说明符（如 %s、%n）的特制 map 命令时，服务器未对输入进行适当过滤就直接将用户输入传递给格式化字符串函数，导致内存信息泄露、任意内存写入，最终可实现远程代码执行。攻击者无需身份认证即可远程利用此漏洞，仅需连接到 Half-Life 专用服务器的默认端口并发送恶意 map 命令即可触发。该漏洞影响所有运行受影响版本 Half-Life 专用服务器的系统，攻击者利用后可完全控制服务器主机。"
published = "2001-06-27T04:00:00Z"
remediation = "建议立即升级 Half-Life 专用服务器至 1.1.0.0 版本（构建号 1574 或更高），该版本修复了 map 命令中的格式化字符串漏洞。升级方法：通过 Steam 客户端验证游戏文件完整性，或从 Valve 官方下载最新专用服务器安装包（hlserver_1.1.0.0.zip）覆盖安装。若暂时无法升级，请在防火墙层面禁止非信任 IP 访问服务器 27015/TCP 端口，并在 server.cfg 中设置 sv_password 限制管理员登录，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Sierra Half-Life 专用服务器格式字符串远程代码执行漏洞"
updated = "2026-06-16T21:54:09Z"

