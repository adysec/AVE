[basic]
description = "Texas Imperial Software 开发的 WFTPD 及 WFTPD Pro 2.41 版本存在拒绝服务漏洞。本地攻击者可在未执行 RENAME FROM（RNFR）命令的情况下，直接发送 RENAME TO（RNTO）命令，触发 FTP 服务器处理异常，导致服务崩溃。该漏洞攻击复杂度低，无需身份认证即可利用，影响服务器可用性。目前已存在公开的 PoC 利用代码。"
published = "2000-07-11T04:00:00Z"
remediation = "建议升级 WFTPD/WFTPD Pro 至 2.41 RC10 之后的版本，该版本已修复未先执行 RNFR 直接执行 RNTO 导致服务崩溃的问题。由于该软件已停止维护多年，建议迁移至仍受支持的 FTP 服务器软件（如 FileZilla Server 或 vsftpd）。临时缓解措施：限制 FTP 服务的访问来源 IP，仅允许受信任用户连接。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Texas Imperial Software WFTPD 2.4.1 拒绝服务漏洞"
updated = "2026-06-16T21:52:11Z"

