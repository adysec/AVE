[basic]
description = "OpenSSH 1.2.x 系列中 scp 组件存在目录遍历漏洞。当客户端连接至恶意的 scp 服务器下载文件时，攻击者可在返回的文件名中包含 ..（点点）序列，绕过路径限制将文件写入任意目录，覆盖客户端任意文件（如 .ssh/authorized_keys）。该漏洞无需身份认证，远程攻击者只需搭建恶意 SCP 服务器并诱骗受害者使用 scp 下载文件即可触发，危害较大。"
published = "2000-12-19T05:00:00Z"
remediation = """
