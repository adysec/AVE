[basic]
description = "3Com AirConnect AP-4111 和 Symbol 41X1 无线接入点的 SNMP 代理存在不安全的简单网络管理协议配置漏洞，导致 WEP 加密密钥泄露。攻击者无需身份认证即可通过网络远程读取管理信息库（MIB）中的 WEP 密钥，该密钥本应设置为仅写入属性。具体可通过读取 IEEE 802.11b MIB 的 dot11WEPDefaultKeysTable 中的 dot11WEPDefaultKeyValue，或 Symbol MIB 的 ap128bWEPKeyTable 中的 ap128bWepKeyValue 获取密钥。该漏洞影响上述型号的无线接入点，攻击者获取 WEP 密钥后可解密无线网络流量，严重威胁网络通信机密性。"
published = "2001-07-21T04:00:00Z"
remediation = "立即将 3Com AirConnect AP-4111 和 Symbol 41X1 无线路由器升级到厂商发布的最新固件版本，修复 SNMP 代理将 WEP 密钥以可读方式暴露于 MIB 的安全缺陷。若厂商已不再提供更新补丁，应在设备管理界面中禁用 SNMP 服务，或在 SNMP 社区字符串配置中移除读写权限，仅保留只读权限。此外，将无线网络加密方式从 WEP 升级至 WPA2-PSK 或 WPA3，消除 WEP 密钥泄露带来的风险。在完成以上修复前，可通过防火墙限制 SNMP 端口（UDP 161）的访问来源，仅允许受信任的管理网段发起 SNMP 查询，防止外部攻击者直接读取 MIB 中的 WEP 密钥。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Symbol Technologies AP-4111 无线访问点 SNMP 信息泄露漏洞"
updated = "2026-06-16T21:54:09Z"

