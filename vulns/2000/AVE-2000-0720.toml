[basic]
description = 'Nevis Systems All-Mail 1.1 存在缓冲区溢出漏洞，远程攻击者可通过向 SMTP 服务发送超长的 "MAIL FROM" 或 "RCPT TO" 命令触发该漏洞，导致任意代码执行。该漏洞无需身份认证即可远程利用，攻击复杂度低，CVSS 评分 10.0，危害等级严重。受影响版本为 All-Mail 1.1，已有公开的利用代码。'
published = "2000-12-19T05:00:00Z"
remediation = "建议立即卸载 Nevis Systems All-Mail 1.1，该产品已停止维护且无安全补丁可用。迁移至仍受支持的 SMTP 服务器软件（如 Microsoft Exchange Server、hMailServer 或 MailEnable），并在防火墙层面限制对 25/TCP 端口的访问来源，仅允许受信任的邮件中继 IP 地址连接。如无法立即迁移，可在边界防火墙上添加规则阻止外部对 SMTP 端口的访问，并监控邮件服务日志中的异常长 SMTP 命令。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Nevis Systems All-Mail 1.1 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:54Z"

