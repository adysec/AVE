[basic]
description = "Google Chrome 浏览器在 14.0.835.202 版本之前处理 SVG 文本时存在缺陷，会导致“过时字体（stale font）”状态。远程攻击者可以通过构造包含特制 SVG 文本的恶意网页，在用户访问时触发该漏洞，从而导致浏览器进程崩溃（拒绝服务），或通过未知向量产生其他潜在影响。该漏洞影响早期版本的 Google Chrome，攻击条件为用户通过浏览器加载恶意 SVG 内容。"
published = "2011-10-04T20:55:01Z"
remediation = "建议立即将 Google Chrome 浏览器升级至 14.0.835.202 或更高版本，以修复 SVG 文本处理导致的拒绝服务漏洞。对于企业环境，可通过组策略或自动更新机制强制推送最新版本补丁。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome SVG文本处理拒绝服务漏洞"
updated = "2026-06-16T23:32:10Z"

