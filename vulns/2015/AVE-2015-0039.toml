[basic]
description = "Koha 图书馆管理系统 3.14.16 之前版本、3.16.12 之前版本、3.18.08 之前版本及 3.20.1 之前版本中存在目录遍历漏洞。攻击者无需身份认证即可通过向 `svc/virtualshelves/search` 或 `svc/members/search` 接口的 `template_path` 参数传入 `..%2f`（URL 编码的路径穿越序列）实现目录遍历，从而读取服务器上的任意文件。该漏洞影响范围广泛，可导致敏感信息泄露（如配置文件、数据库凭据等），CVSS 评分 7.5，危害等级高。官方已在后续版本中修复此漏洞。"
published = "2018-10-18T21:29:01.333"
remediation = "升级 Koha 至 3.14.16、3.16.12、3.18.08 或 3.20.1 及以上版本。如无法升级，在 Web 服务器（Apache/Nginx）层面添加规则，对 `svc/virtualshelves/search` 和 `svc/members/search` 路径的 `template_path` 参数进行输入过滤，拒绝包含 `..%2f` 或 `../` 的请求。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Koha 目录遍历任意文件读取漏洞"
updated = "2026-06-17T00:27:38.180"

