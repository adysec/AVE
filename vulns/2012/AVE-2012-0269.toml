[basic]
description = "WebKit 作为 Apple Safari 的核心渲染引擎，在 6.0 版本之前存在多处内存破坏漏洞。远程攻击者可通过向用户推送特制的网页内容，在用户使用受影响版本的 Safari 浏览器访问该网页时触发这些漏洞。漏洞源于 WebKit 在处理网页元素、图像（TIFF/PNG/JPEG）及 HTTP 头时的内存管理缺陷，攻击者无需身份认证即可利用。成功利用可导致远程代码执行或应用程序崩溃，影响范围包括 Mac OS X 上的 Safari 6.0 之前版本以及 iOS 6.0 之前的移动设备。攻击条件要求目标用户访问恶意网站，且攻击者可通过网络远程发起攻击。"
published = "2012-07-25T20:55:01.917"
remediation = "将 Safari 浏览器升级至 6.0 或更高版本（同时安装 OS X Lion 10.7.5 或 OS X Mountain Lion 10.8.2 系统更新），以修复 WebKit 内存破坏漏洞。如无法立即升级，可临时使用其他浏览器访问不可信网站，并避免点击陌生链接。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:32.223"

