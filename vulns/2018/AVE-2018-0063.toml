[basic]
description = "Schools Alert Management Script 存在绝对路径遍历漏洞，攻击者可通过向存在漏洞的页面发送构造的特制请求，利用路径遍历技术读取服务器上的任意文件，导致敏感信息泄露。该漏洞影响 Schools Alert Management Script 相关版本，攻击条件为需要能够访问该 Web 应用的网络接口，无需特殊权限即可利用。攻击者可结合泄露的配置文件、数据库凭据等敏感信息进一步扩大攻击面，危害较大。该漏洞已有公开利用方法，ExploitDB 已收录编号为 44874 的利用代码，建议受影响用户及时更新补丁或限制对相关页面的访问。"
published = "2018-06-09T00:00:00Z"
remediation = '建议立即弃用该脚本并迁移至其他仍在维护的校园告警管理解决方案，因官方已停止维护、无补丁可升级；若必须临时使用，应在 img.php 等文件读取入口对 view 参数实施白名单校验，仅允许读取站点固定目录内的文件，并拒绝包含 ../、..\/ 及以 / 开头的绝对路径输入；同时在 Web 服务器层禁用目录遍历访问，并通过 WAF 或重写规则拦截路径穿越载荷，最小化 Web 进程权限并限制其可读目录。'
score = 5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Schools Alert Management Script 任意文件读取漏洞"
updated = "2018-06-09T00:00:00Z"

