[basic]
description = "QEMU 的 VNC WebSocket 握手过程中存在释放后使用漏洞。当 QIOChannelWebsock 对象在等待完成握手时被释放，会导致 GSource 泄漏，后续回调触发时产生 use-after-free，从而引发拒绝服务。该漏洞影响 QEMU 2.6.0 至低于 10.1.2 的版本。攻击者无需身份认证，只需具备对 VNC WebSocket 端口的网络访问权限，即可在握手阶段完成利用。"
published = "2025-10-03T11:15:30Z"
remediation = "QEMU 上游已在 10.1.2 版本中修复此漏洞（commit 322c3c4f），建议将 QEMU 升级至 10.1.2 或更高版本。Red Hat 用户执行 `dnf update qemu-kvm` 安装 RHSA-2026 系列安全更新；Ubuntu 用户执行 `apt update && apt install --only-upgrade qemu-kvm` 应用 USN-8412-1。如无法立即升级，请在防火墙中限制 VNC WebSocket 端口仅允许可信网段访问。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "QEMU KVM VNC WebSocket 握手释放后使用拒绝服务漏洞"
updated = "2026-06-17T08:29:55Z"

