[basic]
description = "Windows 电话服务（Telephony Service）存在堆缓冲区溢出漏洞（CWE-122），攻击者可通过向目标系统发送特制的 RPC 请求触发该漏洞，导致远程代码执行。该漏洞无需身份认证即可利用，但需要用户交互（如点击恶意链接或打开恶意文件），CVSS 评分 8.8，危害等级高。成功利用后可获取目标系统的完全控制权限，实现任意代码执行。影响 Windows 10/11 及 Windows Server 多个版本。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞，对应的安全更新编号为 5049981/5049983/5049984/5050021。"
published = "2025-01-14T18:15:42Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新（KB5049984 或对应系统的累积更新），通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载。如无法立即打补丁，可在防火墙中阻止 Telephony Service 的入站连接，并禁用 TAPI 相关功能作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:42:53Z"

