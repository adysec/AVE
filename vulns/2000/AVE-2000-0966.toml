[basic]
description = "Ipswitch WinCOM LPD 1.00.90 的 LPD 服务组件存在拒绝服务漏洞。远程攻击者无需身份认证即可通过向目标系统的 LPD 端口（515）发送大量特制的 LPD 选项数据包，导致服务进程资源耗尽或崩溃，从而造成拒绝服务。该漏洞影响 WinCOM LPD 1.00.90 版本，攻击者只需具备网络访问能力即可实施攻击，利用难度较低。"
published = "2000-11-14T05:00:00Z"
remediation = "升级 Ipswitch WinCOM LPD 至 1.00.90 以上版本（如厂商已停止支持，建议迁移至现代打印服务方案）。在防火墙层面限制对 TCP 端口 515 的访问，仅允许受信任的打印客户端 IP。如无需远程打印功能，直接禁用 LPD 服务以彻底消除攻击面。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Ipswitch WinCOM LPD 拒绝服务漏洞"
updated = "2026-06-16T21:52:34Z"

