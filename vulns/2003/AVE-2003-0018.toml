[basic]
description = "XFree86 4.2.99.4 及之前版本中 xterm 终端模拟器的 DEC UDK（用户自定义键）处理功能存在拒绝服务漏洞。本地攻击者可通过向终端发送特制的字符转义序列，触发终端进入紧密循环（无限循环），导致终端无响应，造成拒绝服务。该漏洞攻击复杂度低，无需身份认证，但需要本地访问权限，仅影响系统可用性。"
published = "2003-03-03T05:00:00Z"
remediation = "升级 XFree86 至 4.3.0 及以上版本，或安装对应发行版安全更新：Red Hat Linux 用户安装 RHSA-2003-064/065/066/067 提供的更新包；Debian 用户安装 DSA-380 提供的 xfree86 更新包。如无法立即升级，可在 xterm 配置中禁用 DEC UDK 功能（设置 allowSendEvents: false）作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "XFree86 xterm DEC UDK 处理拒绝服务漏洞"
updated = "2026-06-16T22:01:27Z"

