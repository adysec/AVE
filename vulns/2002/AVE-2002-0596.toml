[basic]
description = "mIRC 6.0.2 及更早版本在脚本引擎处理 $asctime 变量时存在缓冲区溢出漏洞。攻击者可通过发送包含超长 $asctime 值的特制 IRC 消息或恶意脚本文件，触发栈缓冲区溢出，从而在目标系统上执行任意代码。该漏洞无需身份认证，攻击者可远程利用，影响所有使用受影响版本 mIRC 的用户。"
published = "2003-06-09T04:00:00.000"
remediation = "建议立即升级至 mIRC 6.03 或更高版本，该版本已修复 $asctime 标识符的缓冲区溢出漏洞。升级操作：访问 mIRC 官方网站（mirc.com）下载最新安装包，关闭正在运行的 mIRC 进程，运行安装程序完成覆盖安装。如暂时无法升级，可采取以下缓解措施：禁用脚本编辑器中的自动脚本执行功能，不加载来源不明的脚本文件，在防火墙中限制 IRC 端口的入站连接，避免在公共 IRC 频道中接收或执行未知脚本。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "mIRC mIRC 6.0 脚本引擎 ASCTime 缓冲区溢出漏洞"
updated = "2026-06-16T21:59:21.763"

