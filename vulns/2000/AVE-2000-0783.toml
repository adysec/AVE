[basic]
description = "tags.<value>Microsoft SQL Server 2000 及 SQL Server Desktop Engine（MSDE）中的 xp_peekqueue 扩展存储过程函数存在缓冲区溢出漏洞。该函数在调用 SQL Server API 的 srv_paraminfo 函数之前，未对输入缓冲区长度进行有效限制，导致攻击者可构造超长的特制参数数据触发溢出。攻击者需具备对目标 SQL Server 的访问权限（本地或远程连接），通过向 xp_peekqueue 传递恶意构造的参数即可利用此漏洞，造成拒绝服务或在目标系统上执行任意命令。该漏洞影响 Microsoft SQL Server 7.0/2000 以及 Data Engine 1.0/2000 等版本，CVSS 评分为 4.6，危害等级中等。"
published = "2001-01-09T05:00:00.000"
remediation = "建议立即安装 Microsoft 安全公告 MS00-092 发布的补丁程序。对于 SQL Server 2000，直接在现有版本上安装该补丁即可生效，该补丁也将包含在 SQL Server 2000 Service Pack 1 中；对于 SQL Server 7.0，需先安装 Service Pack 2 再打补丁，或直接升级至 SQL Server 7.0 Service Pack 3。同时应检查并限制对 xp_peekqueue 等扩展存储过程的调用权限，避免未授权用户利用该漏洞执行任意代码。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Microsoft SQL Server xp_peekqueue 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:07.090"

