[basic]
description = "CiscoSecure ACS Server 2.4(2) 及更早版本存在 LDAP 身份验证绕过漏洞。远程攻击者可在 LDAP 服务器允许空密码的情况下，向 CiscoSecure ACS Server 发送特制请求，绕过身份认证机制，无需凭据即可获取对服务器的未授权访问。该漏洞影响部署有 CiscoSecure ACS Server 2.4(2) 及更早版本的网络设备，攻击者无需任何认证凭据即可在远程发起利用，成功利用后可获取敏感信息或执行未授权操作，严重威胁网络访问控制安全，CVSS 评分 7.5，危害等级高。"
published = "2000-12-11T05:00:00.000"
remediation = "立即升级 CiscoSecure ACS Server 至 2.4(2) 之后的修复版本（建议升级至最新稳定版），并在 LDAP 服务器配置中禁用空密码认证（如设置 require_strong_passwords=yes 或同等策略），同时强制实施密码复杂度策略禁止空密码，若暂时无法升级可在网络层限制 ACS 服务仅允许受信 IP 访问。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "思科 Cisco Secure ACS Server 身份认证绕过漏洞"
updated = "2026-06-16T21:53:03.910"

