[basic]
description = "Cisco IOS 和 IOS XE 软件在处理 DHCPv4 数据包中封装的 Option 82 信息时存在输入验证不完整漏洞。未经身份认证的远程攻击者可通过向受影响设备发送特制的 DHCPv4 数据包，设备将其转发至 DHCPv4 服务器后，在处理服务器响应中封装的 Option 82 信息时触发错误，导致设备重新加载，造成拒绝服务（DoS）条件。该漏洞影响运行 Cisco IOS 和 IOS XE 软件的交换机设备，CVSS 评分 8.6，危害等级高。Cisco 已发布安全更新修复此漏洞。"
published = "2018-03-28T22:29:01Z"
remediation = "升级 Cisco IOS 至 15.2(6)E0a 及以上版本，或 Cisco IOS XE 至 15.2(4a)EA5 及以上版本。如无法立即升级，可在网络边界部署 ACL 过滤非信任 DHCP 报文，并禁用 DHCP 中继 option 82 封装功能作为临时缓解措施。"
score = 8.6
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS/IOS XE DHCPv4 Relay Reply 拒绝服务漏洞"
updated = "2026-06-17T01:30:00Z"

