[basic]
description = "Netscape Enterprise Server（运行于 NetWare 5.1 平台）存在输入验证漏洞，远程攻击者可通过向服务器发送特制的畸形 URL 请求触发该漏洞，导致目标服务崩溃（拒绝服务）或在服务器上执行任意命令。该漏洞影响 Netscape Enterprise Server 在 NetWare 5.1 上的部署版本，攻击者无需身份认证即可通过网络远程利用，CVSS 评分 7.5，危害等级高。目前官方已发布安全更新修复此漏洞。"
published = "2000-06-26T04:00:00Z"
remediation = "立即升级 NetWare 5.1 至最新 Service Pack（SP8 及以上），并安装 Netscape Enterprise Server 3.6 SP3 或更新版本。在无法升级的情况下，在 Web 服务器前端部署反向代理或 WAF，过滤包含畸形 URL 的请求，特别是含有异常编码、超长路径或特殊字符的 HTTP 请求。鉴于该产品已停止技术支持，建议迁移至受支持的 Web 服务器平台（如 Apache HTTP Server 或 Nginx）以彻底消除风险。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Netscape Enterprise Server 畸形URL远程代码执行漏洞"
updated = "2026-06-16T21:52:05Z"

