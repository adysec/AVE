[basic]
description = "Microsoft Internet Explorer 4.x 和 5.x 中内置的 Microsoft Virtual Machine (VM) 存在安全绕过漏洞，未签名的 Java 小程序可通过 com.ms.activeX.ActiveXComponent 类创建并调用 ActiveX 控件，绕过 IE 的安全沙箱限制。远程攻击者可构造恶意网页或 HTML 邮件，诱导用户访问即可在用户权限下执行任意系统命令。该漏洞影响运行 IE 4.x/5.x 且安装了 Microsoft VM 的 Windows 系统，攻击条件为用户访问恶意页面且浏览器启用 Java 支持，CVSS 评分 5.1 (AV:N/AC:H/Au:N/C:P/I:P/A:P)，属中危漏洞。"
published = "2000-12-11T05:00:00Z"
remediation = '立即升级 Microsoft VM 至 3000 系列 3317 之后的版本（如 5.00.3810），或卸载 IE 4.x/5.x 改用现代浏览器。若无法升级，在 IE 安全选项中禁用"活动脚本"与"Java 小程序脚本"，并将不可信站点加入"受限站点"区域以阻断攻击向量。Microsoft 已停止分发 Java VM，建议彻底移除并迁移至非 Java 依赖环境。'
score = 5.1
severity = "MEDIUM"
sources = ["epss"]
title = "微软 虚拟机 任意程序执行"
updated = "2026-06-16T21:53:04Z"

