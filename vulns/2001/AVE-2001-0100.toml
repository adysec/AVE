[basic]
description = "FaSTream FTP++ Server 2.0 存在目录遍历漏洞，其原理在于 FTP 服务器在处理 ls 命令时未对用户输入的路径进行充分过滤。远程攻击者无需身份认证，只需在请求的路径名中包含驱动器盘符（如 C:），即可遍历并列出服务器上的任意目录内容。该漏洞影响 FaSTream FTP++ Server 2.0 版本，攻击条件简单，只要攻击者能够连接到目标 FTP 服务并发送特制 ls 命令即可触发利用，成功后可导致服务器敏感目录及文件信息泄露。"
published = "2001-06-02T04:00:00Z"
remediation = "升级至 FaSTream FTP++ Beta 10 Build 3 或更高版本以修复目录遍历漏洞。如无法立即升级，建议关闭 FTP++ 服务器功能，或在防火墙层面限制对 FTP 端口（默认 21）的外部访问，仅允许可信 IP 连接。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "FaSTream FTP++ Server 目录遍历漏洞"
updated = "2026-06-16T21:53:58Z"

