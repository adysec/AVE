[basic]
description = "SAP NetWeaver J2EE Engine 7.40 的 UDDI（统一描述、发现与集成）服务器存在 SQL 注入漏洞。远程攻击者无需身份认证即可通过向 UDDI 服务发送特制的请求，注入任意 SQL 命令，从而实现对后端数据库的未授权访问、数据窃取、篡改甚至完全控制。该漏洞影响 SAP NetWeaver AS JAVA 7.1 至 7.5 版本，CVSS 评分 9.8，危害等级严重。SAP 已在安全公告 2101079 中发布修复补丁，建议用户升级至安全版本。"
published = "2016-02-16T15:59:00Z"
remediation = "立即应用 SAP Security Note 2101079 提供的补丁，升级 SAP NetWeaver J2EE Engine 至 7.40 对应支持包栈（Support Package Stack）的最新版本。具体操作：登录 SAP Service Marketplace → 访问 SAP Note 2101079 → 下载并部署对应 J2EE Engine 版本的补丁包。如无法立即升级，可在 SAP NetWeaver Administrator 中禁用 UDDI 服务或通过反向代理/WAF 限制对 /uddi/ 路径的外部访问作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "SAP NetWeaver J2EE Engine UDDI server SQL注入漏洞"
updated = "2026-06-17T00:43:56Z"

