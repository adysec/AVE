[basic]
description = "OpenOffice.org 2.x 及 3.3 之前版本的 oowriter 组件中，WW8ListManager::WW8ListManager 函数在处理 Microsoft Word 文档（.DOC）中用户自定义列表样式的列表层级数量时存在越界写入漏洞。远程攻击者可向目标用户发送特制的 Word 文档，诱导其打开后触发该漏洞，导致应用程序崩溃或执行任意代码。该漏洞影响 OpenOffice.org 2.x 和 3.x 全系列版本，CVSS 评分 9.3，危害严重。用户应升级至 OpenOffice.org 3.3 或更高版本以修复此漏洞。"
published = "2011-01-28T22:00:05Z"
remediation = "立即升级至 OpenOffice.org 3.3 或更高版本。对于 Apache OpenOffice，建议安装最新稳定版（如 4.1.16）。如无法升级，作为临时缓解措施，不要打开来自不可信来源的 Word 文档（.doc），并在邮件网关层面拦截可疑的 .doc 附件。Linux 发行版用户可通过官方包管理器更新至发行版提供的已修复版本。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apache OpenOffice Word文档列表处理越界写入远程代码执行漏洞"
updated = "2026-06-16T23:22:48Z"

