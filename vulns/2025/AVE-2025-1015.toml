[basic]
description = "Linux kernel 的 GENEVE（通用网络虚拟化封装）网络隧道驱动在 geneve_find_dev() 函数中存在释放后使用漏洞。当使用网络命名空间参数（如 IFLA_NET_NS_PID、IFLA_NET_NS_FD 或 IFLA_TARGET_NETNSID）配置 GENEVE 设备时，若该设备所属网络命名空间被拆除，设备结构体虽被释放但其 next 链表指针仍残留在后端 UDP socket 的网络命名空间链表中。当同一命名空间内再次创建新 GENEVE 设备时，遍历链表会访问已释放内存，触发释放后使用。本地攻击者若能创建和销毁 GENEVE 隧道设备，可借此造成内核内存损坏、拒绝服务甚至实现权限提升。"
published = "2025-03-12T10:15:18Z"
remediation = "将 Linux 内核升级至已包含该修复的稳定版本，包括 5.4.291、5.10.235、5.15.179、6.1.130、6.6.80、6.12.17、6.13.5 及更高版本。如当前系统暂无法立即升级，可通过 modprobe 黑名单或防火墙规则限制 GENEVE 隧道接口的创建操作，并在内核启动参数中禁用 geneve 模块加载，以减少 use-after-free 漏洞的触发条件。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux kernel GENEVE 释放后使用漏洞"
updated = "2026-06-17T08:44:27Z"

