[basic]
description = "Foxit PDF 编辑器/阅读器的 AcroForm 签名功能存在释放后使用漏洞。页面生命周期管理存在缺陷，当文档结构发生变化时，内部组件状态未能同步更新，导致后续操作访问已被释放的无效对象，引发程序崩溃。该漏洞影响使用 AcroForm 签名功能的 Foxit PDF 编辑器及阅读器版本，攻击者需诱骗用户打开包含恶意构造数据的 PDF 文件方可触发。攻击条件为本地访问且需用户交互，成功利用可导致应用程序拒绝服务。CVSSv3.1 评分为 5.5，危害等级中等。"
published = "2026-04-27T12:16:24.603"
remediation = "建议立即将 Foxit PDF Reader 升级至 2026.1.2.36540 或更高版本，Foxit PDF Editor 升级至 2026.1.2、14.0.5 或 13.2.5 或更高版本。如无法立即升级，请在「首选项 > 信任管理器」中启用安全阅读模式（Safe Reading Mode），并禁用 PDF 中的 JavaScript 执行，同时避免打开来源不明的 PDF 文件。企业用户可通过 Foxit 定制向导或组策略批量推送更新并锁定安全设置。"
score = 5.5
severity = "MEDIUM"
sources = ["zdi"]
title = "Foxit PDF 编辑器/阅读器 AcroForm 签名释放后使用漏洞"
updated = "2026-06-17T10:59:55.843"

