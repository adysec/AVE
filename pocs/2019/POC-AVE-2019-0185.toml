[info]
author = "ave"
description = "检测 GitLab Enterprise Edition 的 Jira 集成功能是否存在未认证盲 SSRF 漏洞，通过向 /-/jira/login/oauth/access_token 发送 POST 请求验证端点响应"
id = "POC-AVE-2019-0185"
name = "GitLab Jira 集成 服务端请求伪造漏洞 PoC"
severity = "high"
tags = ["ave-2019-0185"]
vuln_id = [
    "CVE-2019-6793",
    "AVE-2019-0185",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/-/jira/login/oauth/access_token"
protocol = "http"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
