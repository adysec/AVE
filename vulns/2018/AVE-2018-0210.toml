[basic]
description = "Apache HTTP Server 2.4.33 版本中 mod_md 模块的挑战处理程序存在空指针解引用漏洞。远程攻击者无需身份认证即可通过向目标服务器发送特制的 HTTP 请求，触发 mod_md 在处理 ACME 挑战时解引用空指针，导致 httpd 子进程因段错误崩溃，造成服务拒绝（DoS）。该漏洞仅影响 Apache HTTP Server 2.4.33 版本，已在 2.4.34 版本中修复，CVSS 评分 7.5，危害等级高。"
published = "2018-07-18T14:29:00Z"
remediation = "升级 Apache HTTP Server 至 2.4.34 或更高版本。如使用 Red Hat/CentOS，运行 `yum update httpd`；Debian/Ubuntu 运行 `apt-get update && apt-get upgrade apache2`。若无法立即升级，在 httpd.conf 中注释或移除 `LoadModule md_module modules/mod_md.so` 以禁用 mod_md 模块，重启 httpd 服务后生效。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Apache HTTP Server mod_md 空指针解引用拒绝服务漏洞"
updated = "2026-06-17T02:04:04Z"

