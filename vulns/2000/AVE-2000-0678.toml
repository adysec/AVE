[basic]
description = "SmartWin CyberOffice Shopping Cart 2.0（又称 CyberShop）默认安装时将 _private 目录设置为全局可读权限，该目录下存储了包含客户订单详情及未加密信用卡信息的 Microsoft Access 数据库文件 shopping_cart.mdb。远程攻击者无需任何身份认证，仅通过浏览器直接访问 http://target/_private/shopping_cart.mdb 即可下载该数据库，导致大量敏感客户信息泄露。该漏洞影响运行于 Windows NT 4.0 及 2000 平台上的 CyberOffice Shopping Cart 2.0 版本，CVSS 评分 5.0，危害等级中危。"
published = "2000-12-19T05:00:00.000"
remediation = '立即将 `_private` 目录权限修改为 750（仅所有者可读写执行），并在 Web 服务器（如 Apache/IIS）配置中添加规则禁止外部访问该目录，例如 Apache 下添加 `<Directory "_private"> Deny from all</Directory>`。如条件允许，将敏感数据文件移出 Web 根目录存放。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "SmartWin CyberOffice Shopping Cart 2 信息泄露漏洞"
updated = "2026-06-16T21:52:46.800"

