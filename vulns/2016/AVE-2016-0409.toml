[basic]
description = "Adobe Flash Player 21.0.0.242及之前版本中存在一个未指定的安全漏洞，远程攻击者可通过诱导用户访问恶意网页或打开特制的Flash文件触发该漏洞，无需身份认证即可在目标系统上执行任意代码，实现完全控制。该漏洞已在2016年6月被野外利用，影响Windows、macOS、Linux等多个平台。Adobe已于2016年6月16日发布安全更新修复此漏洞，建议用户立即升级至最新版本。"
published = "2016-06-16T14:59:51Z"
remediation = "立即升级 Adobe Flash Player 至 21.0.0.260 及以上版本（APSB16-18）。由于 Adobe Flash Player 已于 2020 年底停止支持并终止分发，建议彻底卸载 Flash Player，改用 HTML5 标准替代方案。如因业务兼容性暂时无法卸载，可在浏览器中启用点击播放（Click-to-Play）策略，并限制仅允许受信任站点加载 Flash 内容。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Adobe Flash Player 任意代码执行漏洞"
updated = "2026-06-17T00:47:02Z"

