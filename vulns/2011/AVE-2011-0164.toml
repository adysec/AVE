[basic]
description = "Mozilla Firefox、Thunderbird 及 SeaMonkey 的 WebGL 着色器实现中存在缓冲区溢出漏洞。远程攻击者可通过向目标发送包含超长着色器源代码块的恶意网页，触发 WebGL 字符串类的缓冲区溢出，导致应用程序崩溃或远程任意代码执行。该漏洞影响 Firefox 4.x 至 5.x、Thunderbird 6.0 之前版本以及 SeaMonkey 2.x 2.3 之前版本，CVSS v3 评分高达 10.0，危害等级严重。攻击者无需身份验证，仅需诱导受害者在浏览器中访问恶意页面即可利用此漏洞。"
published = "2011-08-18T18:55:01Z"
remediation = "立即升级 Firefox 至 6.0 或更高版本。Firefox 4.x 至 5.x 版本中的 WebGL 着色器实现存在缓冲区溢出漏洞，攻击者通过构造超长的 shader 程序源代码可导致应用程序崩溃或执行任意代码。如暂时无法升级，可通过在浏览器地址栏输入 about:config 并设置 webgl.disabled 为 true 来禁用 WebGL 功能作为临时缓解措施。Thunderbird 用户应升级至 6.0 或更高版本，SeaMonkey 用户应升级至 2.3 或更高版本。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird WebGL着色器缓冲区溢出漏洞"
updated = "2026-06-16T23:32:22Z"

