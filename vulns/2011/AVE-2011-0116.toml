[basic]
description = "Adobe Flash Player 存在基于栈的缓冲区溢出漏洞（CVE-2011-2457）。该漏洞源于 Flash Player 在处理特定 SWF 文件时未正确验证内存边界，导致栈缓冲区溢出。攻击者可通过诱导用户访问恶意网页或打开特制 Flash 文件触发该漏洞，成功利用可在目标系统上以当前用户权限执行任意代码。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上的 Flash Player 10.3.183.11 之前版本和 11.x 系列 11.1.102.55 之前版本，以及 Adobe AIR 3.1.0.4880 之前版本，CVSS 评分 10.0，危害等级严重。"
published = "2011-11-11T16:55:01Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.11 或 11.1.102.55 及以上版本（Windows/Mac/Linux/Solaris），Android 平台升级至 11.1.102.59 及以上版本；Adobe AIR 升级至 3.1.0.4880 及以上版本。如无法升级，可在浏览器中禁用 Flash 插件或使用 Chrome 内置的 PPAPI Flash 沙箱机制缓解风险。"
score = 10
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 栈溢出远程代码执行漏洞"
updated = "2026-06-16T23:31:22Z"

