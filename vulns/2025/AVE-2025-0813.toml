[basic]
description = "Windows Active Directory 域服务（AD DS）API 存在资源消耗漏洞（CWE-400），未经身份认证的远程攻击者可通过向目标域控制器发送特制的 API 请求，导致系统资源被过度消耗，从而使 Active Directory 服务停止响应，造成拒绝服务。该漏洞影响多个 Windows Server 版本，CVSS 评分 7.5，危害等级高。Microsoft 已在 2025 年 2 月安全更新中修复此漏洞。"
published = "2025-02-11T18:15:34Z"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新 (KB5051974)，通过 Windows Update 或 Microsoft Update Catalog 获取。如无法立即打补丁，可在域控制器上配置防火墙规则限制对 AD DS API 端口的非信任来源访问，并监控异常 LDAP 请求流量作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Active Directory 域服务 API 拒绝服务漏洞"
updated = "2026-06-17T08:43:10Z"

