[basic]
description = "PHP 8.1.33、8.2.29、8.3.23、8.4.10 之前版本中，fsockopen() 等函数未对主机名中的空字节进行校验。攻击者可构造包含空字节的主机名字符串，使 parse_url() 等函数对主机名的解析结果与 fsockopen() 实际连接的目标不一致，从而绕过基于主机名的访问控制检查。该漏洞利用条件较高（需攻击者能控制主机名输入且存在访问控制逻辑），CVSS 评分 3.7，危害等级低，但可能导致 SSRF 或访问控制绕过等安全问题。"
published = "2025-07-13T23:15:22Z"
remediation = '升级 PHP 至 8.1.33、8.2.29、8.3.23 或 8.4.10 及以上版本，这些版本已修复 fsockopen() 等函数对主机名中空字节的校验缺失问题。如无法立即升级，可在应用层对用户输入的主机名进行空字节过滤（如过滤 \0 字符），并避免在访问控制检查后使用 parse_url() 等函数处理未经验证的主机名。'
score = 3.7
severity = "LOW"
sources = ["msrc"]
title = "PHP 主机名空字节终止验证绕过漏洞"
updated = "2026-06-17T08:38:37Z"

