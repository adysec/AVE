[basic]
description = "Linux 内核 rtlwifi 无线网卡驱动在设备探测（probe）失败路径中存在内存泄漏和无效访问漏洞。当 init_sw_vars 初始化失败后，驱动错误地调用了 rtl_deinit_core 函数，该函数会销毁 rtl_wq 工作队列，导致后续对已销毁工作队列的访问引发无效内存访问。同时，未正确调用 rtl_pci_deinit 和 deinit_sw_vars 进行资源清理，造成内存泄漏。本地低权限攻击者可通过插入特定 Realtek 无线网卡设备触发 probe 失败路径，利用此漏洞造成系统拒绝服务。CVSS 评分 5.5，危害等级中等。"
published = "2025-03-06T16:15:52Z"
remediation = "更新 Linux 内核至包含以下提交的版本：`commit 8d450935ae7f`（移除不必要的 pci_set_drvdata）和 `commit 3d86b93064c7`（修复 probe 错误路径内存泄漏）。Ubuntu 用户安装 USN-7540-1（18.04）、USN-7511-1（22.04）、USN-7640-1（20.04）或 USN-7653-1（22.04）安全更新；Debian 11 用户安装 DLA-4178 或 DLA-4102 更新。如无法立即更新，可禁用受影响 Realtek WiFi 设备（`modprobe -r rtlwifi`）作为临时缓解措施。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel rtlwifi 驱动内存泄漏与无效访问漏洞"
updated = "2026-06-17T08:14:32Z"

