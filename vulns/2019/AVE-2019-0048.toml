[basic]
description = "GrandNode 4.40 的 LetsEncryptController.cs 中存在路径遍历漏洞。远程未认证攻击者可通过向服务器发送特制的 `LetsEncrypt/Index?fileName=` HTTP 请求，利用该漏洞读取 Web 服务器上的任意文件，导致敏感信息泄露。攻击无需任何身份认证或用户交互，仅需构造包含路径遍历序列的 fileName 参数即可触发。厂商已于 2019 年 5 月 30 日在 GrandNode 4.40 中修复此漏洞。"
published = "2019-06-05T18:29:01Z"
remediation = "升级 GrandNode 至 4.40 或更高版本，官方已于 2019 年 5 月 30 日发布补丁修复该路径遍历漏洞。如无法立即升级，可在 Web 服务器层面限制对 `LetsEncrypt/Index?fileName=` 路径的访问，并对 fileName 参数进行严格的路径合法性校验，禁止包含 `../` 等目录遍历序列。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "GrandNode 路径遍历漏洞"
updated = "2026-06-17T02:14:21Z"

