[basic]
description = 'PHPCMS 2008 的 /type.php 存在代码注入漏洞，远程攻击者无需身份认证即可通过构造特制的 HTTP 请求，向 template 参数中注入恶意 PHP 代码。该参数内容会被写入 data/cache_template/ 目录下可控文件名的 .tpl.php 缓存文件中，并拼接 "<?php function " 前缀，导致任意 PHP 代码执行。攻击者可利用此漏洞完全控制目标服务器，执行系统命令、窃取敏感数据或植入后门。影响所有使用 PHPCMS 2008 版本的网站。'
published = "2018-11-09T12:29:00Z"
remediation = "PHPCMS 2008 已停止维护，官方未发布安全补丁。建议立即升级至受支持的 CMS 版本或迁移至其他安全 CMS。若无法立即升级，可在 Nginx/Apache 中配置规则禁止外部访问 /type.php，或删除 data/cache_template/ 目录的 Web 写入权限，同时在应用层对 template 参数进行严格白名单校验，仅允许预定义模板文件名。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "PHPCMS 2008 type.php 远程代码执行漏洞"
updated = "2026-06-17T01:48:49Z"

