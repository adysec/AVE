[basic]
description = "NewAtlanta ServletExec/ISAPI 4.1 默认配置存在全路径泄漏漏洞。远程攻击者无需认证即可向 com.newatlanta.servletexec.JSP10Servlet 发送不包含文件名的直接请求，服务器会在返回的错误信息中泄露 Web 根目录的完整物理路径。该漏洞可被攻击者利用来收集目标系统的目录结构信息，为进一步攻击（如 LFI、文件遍历）提供侦察基础。CVSS 评分 5.0，危害等级中危。"
published = "2002-10-04T04:00:00Z"
remediation = "升级到 ServletExec ISAPI 4.2 或更高版本，该版本修复了未指定文件名时泄露物理路径的问题。如无法升级，可在 web.xml 中禁用 JSP10Servlet 的目录浏览功能，或在应用服务器前端配置 WAF 规则拦截对 com.newatlanta.servletexec.JSP10Servlet 的直接请求。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "NewAtlanta ServletExec ISAPI 4.1 全路径泄漏漏洞"
updated = "2026-06-16T21:58:20Z"

