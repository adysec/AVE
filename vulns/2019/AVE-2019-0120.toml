[basic]
description = "Yachtcontrol 是一款用于船舶监控与控制的 Web 应用系统。该漏洞存在于 Yachtcontrol 2019-10-06 及之前版本的 `/pages/systemcall.php` 页面中，由于未对用户输入进行身份验证和命令过滤，未经身份认证的远程攻击者可通过向 `command` 参数传递任意操作系统命令，直接在服务器上执行系统指令并获取返回结果。该漏洞影响通过荷兰 GPRS/4G 移动 IP 段公开的 Yachtcontrol Web 服务器，CVSS 评分 9.8，危害等级严重。攻击者无需任何凭据即可利用此漏洞完全控制服务器。"
published = "2019-12-10T21:15:15.597"
remediation = "立即更新 Yachtcontrol 软件到最新的安全补丁版本。Yachtcontrol 网站维护者应立即从 http://download.yachtcontrol.nl/klant/Software/ 下载并安装最新的安全更新。更新应涵盖 `/pages/systemcall.php` 中的命令执行漏洞。如果无法立即更新，建议在防火墙上禁用对 `/pages/systemcall.php?command` 参数的访问，并限制仅对可信IP地址开放该页面作为临时缓解措施。该漏洞影响所有 2019-10-06 及之前的 Yachtcontrol 版本，建议所有受影响用户尽快应用补丁。更多详细的修补丁信息可在 Yachtcontrol 官方网站 http://www.yachtcontrol.nl/en/ 获取。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Yachtcontrol 系统 未授权远程代码执行漏洞"
updated = "2026-06-17T02:23:38.010"

