[basic]
description = "Apple iTunes 10.7 之前版本所嵌入的 WebKit 浏览器引擎存在内存破坏漏洞，未经身份认证的远程攻击者可通过向用户推送或诱使其访问特制网页，在渲染恶意网页内容时触发该漏洞，进而导致任意代码执行或应用程序崩溃拒绝服务。该漏洞影响范围涵盖所有使用受影响版本 iTunes 的 Windows 及 macOS 用户，攻击条件为攻击者需通过网络向目标用户展示或传播恶意网页，无需任何身份验证凭据即可利用。Apple 已在 2012 年 9 月发布的安全公告 APPLE-SA-2012-09-12-1 中修复此漏洞，用户应将 iTunes 升级至 10.7 或更高版本以消除风险。"
published = "2012-09-13T10:30:19Z"
remediation = "立即将 Apple iTunes 升级至 10.7 或更高版本，OS X Lion 用户升级至 v10.7.5，OS X Mountain Lion 用户升级至 v10.8.2 并安装 Safari 6.0.1。如无法立即升级，请避免访问未知网站，禁用 iTunes 中的 WebKit 内容浏览功能，同时开启系统自动更新以获取后续安全补丁。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple iTunes 内存破坏漏洞"
updated = "2026-06-16T23:43:35Z"

