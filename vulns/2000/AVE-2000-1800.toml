[basic]
description = "HiNet LP5100 网络电话（IP-phone）的 Web 管理服务存在缓冲区溢出漏洞。该漏洞源于服务在处理超长 GET 请求时未正确校验输入长度，导致缓冲区被溢出。远程攻击者无需任何身份认证，仅需通过网络向目标设备的 Web 管理端口发送一个特制的超长 GET 请求即可触发此漏洞，造成服务崩溃，引发拒绝服务（DoS），且攻击者甚至可能借此在设备上执行任意命令，实现远程代码执行。该漏洞 CVSS 评分高达 10.0，向量为 AV:N/AC:L/Au:N/C:C/I:C/A:C，影响范围涉及所有使用 HiNet LP5100 IP-phone Web 管理服务的系统，危害等级严重。攻击条件仅需目标设备 Web 管理服务开放且可达，利用门槛低。"
published = "2000-12-19T05:00:00Z"
remediation = "该设备厂商已停止维护，无官方补丁，须以缓解措施为主：1) 立即在边界防火墙/路由 ACL 中限制 Web 管理端口（默认 80 端口，仅允许受信任管理网段访问，禁止来自公网的访问）；2) 在管理后台将远程管理功能关闭，改为仅本地局域网管理；3) 将设备置于 NAT 之后，不在公网暴露；4) 若必须对外提供服务，可在 Web 管理服务前部署反向代理并启用请求长度限制与入侵检测拦截超长请求；5) 升级到厂商后续硬件型号或更换支持更新的 IP 话机以彻底消除漏洞。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "HiNet LP5100 IP电话 Web管理服务缓冲区溢出漏洞"
updated = "2026-06-16T21:52:52Z"

