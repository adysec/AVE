[basic]
description = "Oracle VM VirtualBox 7.2.6 的 Core 组件存在访问控制缺陷（CWE-284），具有高权限的本地攻击者通过登录 VirtualBox 宿主机环境可利用该漏洞，成功利用后可完全接管 VirtualBox 虚拟机管理程序，实现虚拟机逃逸。由于攻击影响范围可跨越至其他产品（Scope Change），成功利用后对机密性、完整性和可用性均造成高危害。该漏洞利用难度较高，需攻击者已具备本地高权限，Oracle 已在 2026 年 4 月关键补丁更新中修复该问题。"
published = "2026-04-21T21:16:38Z"
remediation = "立即安装 Oracle 2026 年 4 月关键补丁更新（Critical Patch Update - April 2026）中针对 Oracle VM VirtualBox 的补丁，升级至包含该修复的 VirtualBox 最新版本。补丁可从 My Oracle Support 获取，对应安全公告为 https://www.oracle.com/security-alerts/cpuapr2026.html。由于该漏洞需要本地高权限登录才能利用，在无法立即打补丁的情况下，应严格限制对 VirtualBox 宿主机的本地访问权限，仅允许受信任的管理员用户登录，并审计高权限用户列表。"
score = 7.5
severity = "HIGH"
sources = ["zdi"]
title = "Oracle VM VirtualBox Core 组件权限提升漏洞"
updated = "2026-06-17T10:40:14Z"

