[basic]
description = "Style Dictionary 是一个用于创建跨平台样式的构建系统。其 `convertTokenData()` 工具函数存在原型污染漏洞。攻击者可构造包含 `__proto__` 键的恶意 token 数组，例如 `[{ key: '{__proto__.foo}', value: 'malicious' }]`，当 `convertTokenData()` 处理该数组时，会将恶意键注入 `Object.prototype`，导致全局原型链被篡改。该漏洞影响 Style Dictionary 4.3.0 至 5.4.3 版本，已在 5.4.4 版本中修复。攻击条件为：攻击者需具有对 token 数据的读写权限，且 Style Dictionary 以 `output: 'object'` 模式运行，或通过 Expand API 及 transform 生命周期间接触发。在 NodeJS 服务端应用中使用时影响严重，Web 应用中影响中等。"
published = "2026-06-24T01:16:25Z"
remediation = "升级到 style-dictionary 5.4.4 或更高版本，修复原型污染漏洞。若无法立即升级，请对 token 数据进行递归校验，过滤所有包含 `__proto__` 的键名；在使用 StyleDictionary 实例时设置 `expand: false` 以阻止第二种攻击路径。"
score = 8.8
severity = "HIGH"
sources = ["ghsa"]
title = "style-dictionary convertTokenData 原型污染漏洞"
updated = "2026-06-25T20:18:11Z"

