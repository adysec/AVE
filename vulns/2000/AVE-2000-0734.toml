[basic]
description = "eXtropia WebStore 1.0/2.0 中的 html_web_store.cgi 和 web_store.cgi CGI 程序存在目录遍历漏洞。远程攻击者可通过向 page 参数传递 `../` 等路径遍历序列，绕过访问限制读取服务器上的任意文件，导致敏感信息泄露。该漏洞无需身份认证即可利用，攻击复杂度低，影响运行 eXtropia WebStore 的 Web 服务器。"
published = "2000-12-11T05:00:00Z"
remediation = '在 html_web_store.cgi 和 web_store.cgi 中对 page 参数进行输入过滤，使用正则表达式拒绝包含 `../`、`..\` 或 `%2e%2e/` 等目录遍历序列的请求；或在 Web 服务器（Apache/Nginx）层面添加重写规则，拦截包含 `..` 的 page 参数请求。如仍使用 eXtropia WebStore，建议升级到已修复此漏洞的最新版本，或迁移至仍在维护的替代产品。'
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "eXtropia WebStore 目录遍历漏洞"
updated = "2026-06-16T21:52:57Z"

