[basic]
description = "SonicWall SMA100 设备存在 SQL 注入漏洞，未经身份认证的远程攻击者可通过向受影响设备发送特制的 HTTP 请求，利用输入验证缺陷注入恶意 SQL 语句，从而绕过认证机制获取对未授权资源的只读访问权限。该漏洞影响 SMA100 系列设备 9.0.0.3 及更早版本，CVSS 评分 7.5，危害等级高。SonicWall 已发布安全更新修复此漏洞。"
published = "2019-12-17T23:15:14Z"
remediation = '立即将 SonicWall SRA 4600 等旧款设备升级替换为受支持的 SMA 100 系列硬件，并安装 SMA 100 10.x 固件最新版本。在完成硬件替换前，启用多因素认证（MFA）作为临时缓解措施，同时在 VPN 日志中监控 "Virtual Assist Installing Customer App" 和 "python-requests" 等可疑字符串，发现异常立即阻断来源 IP。'
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "SonicWall SMA100 SQL注入漏洞"
updated = "2026-06-17T02:40:38Z"

