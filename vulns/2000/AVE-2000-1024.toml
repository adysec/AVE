[basic]
description = "Compaq Easy Access Keyboard 软件 1.3 版本存在权限提升漏洞。当系统屏幕被锁定时，该软件未能正确禁用自定义按钮的功能，导致物理接触计算机的攻击者可以通过按下这些自定义按钮来执行未授权的程序或获取系统权限。该漏洞需要攻击者具有本地物理访问条件，CVSS 评分 4.6，危害等级中危。"
published = "2000-12-19T05:00:00.000"
remediation = "立即升级 Compaq Easy Access Keyboard 软件至修复版本（revision 1723 及更高版本），该补丁可在 Compaq 官方支持站点获取。如无法立即升级，可在锁屏前手动禁用自定义按钮功能，或通过组策略限制非管理员用户对键盘自定义按钮的访问权限作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Compaq Easy Access Keyboard 权限提升漏洞"
updated = "2026-06-16T21:52:49.727"

