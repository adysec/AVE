[basic]
description = "AIX 4.3.x 及 5.1 版本中的 diagrpt 诊断工具存在任意特权程序执行漏洞。该工具使用 DIAGDATADIR 环境变量定位并执行诊断程序，本地攻击者可通过修改该环境变量指向特洛伊木马程序，从而以 root 权限执行任意代码，实现本地权限提升。攻击者需拥有本地系统访问权限，利用难度较低，可完全控制受影响系统。"
published = "2001-06-19T04:00:00Z"
remediation = "建议立即升级 AIX 系统至 IBM 官方支持的最新版本（如 AIX 7.2/7.3），该漏洞在后续版本中已修复。如无法升级，可临时移除 diagrpt 的 setuid root 权限：`chmod u-s /usr/lpp/diagnostics/bin/diagrpt`，并限制本地用户对 DIAGDATADIR 环境变量的控制权限，同时监控 `/usr/lpp/diagnostics/bin/` 目录下 cat 等命令的异常调用行为。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "IBM AIX diagrpt 本地权限提升漏洞"
updated = "2026-06-16T21:55:32Z"

