[basic]
description = "Apple iTunes 在 10.7 之前版本使用的 WebKit 渲染引擎存在内存破坏漏洞。远程攻击者可通过构造恶意网页，诱使用户使用受影响版本的 iTunes 访问该网页，触发内存损坏进而执行任意代码或导致应用程序崩溃拒绝服务。该漏洞影响 Apple iOS 6.0 之前版本及 iTunes 10.7 之前版本，攻击无需身份认证，网络可达即可利用，CVSS 评分 8.3，危害等级高。Apple 已在后续安全更新中修复此漏洞。"
published = "2012-09-13T10:30:21.057"
remediation = "立即将 Apple iTunes 升级至 10.7 或更高版本以修复 WebKit 内存破坏漏洞。打开 iTunes，依次选择「帮助」→「检查更新」自动下载并安装安全更新，或从 Apple 官网手动下载 iTunes 10.7 安装包覆盖安装。临时缓解措施：避免点击未知来源的链接，或在浏览器设置中禁用 JavaScript 执行，直至完成版本升级。"
score = 8.3
severity = "HIGH"
sources = ["tenable"]
title = "Apple iTunes 远程代码执行漏洞"
updated = "2026-06-16T23:43:46.233"

