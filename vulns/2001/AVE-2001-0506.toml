[basic]
description = "iptables 1.2.4 之前版本存在速率限制转换不准确漏洞，管理员在命令行指定的速率限制参数未能被正确转换为内核规则，导致实际流量控制偏离预期值。攻击者或普通用户可利用此缺陷绕过流量限制策略，发送超出或低于预期的网络流量，造成拒绝服务或规则失效。该漏洞影响所有使用 iptables 进行流量整形的 Linux 系统，攻击向量为网络远程利用，无需身份认证，攻击复杂度低，主要影响可用性（CVSS 5.0，AV:N/AC:L/Au:N/C:N/I:N/A:P），属于资源管理错误（CWE-770）类型。升级至 iptables 1.2.4 或更高版本可修复此问题。"
published = "2001-11-05T05:00:00Z"
remediation = "升级 iptables 至 1.2.4 或更高版本，该版本修复了命令行速率限制参数转换不准确的问题。如无法升级，可在 iptables 规则中避免使用 `-m limit` 模块的速率限制功能，改用应用层限流或硬件防火墙进行流量控制。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Netfilter iptables 速率限制转换不准确漏洞"
updated = "2026-06-16T21:56:10Z"

