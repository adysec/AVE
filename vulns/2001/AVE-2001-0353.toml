[basic]
description = "Red Hat Linux 7.0 及更早版本中 DVI 打印过滤器（dvips）的默认配置存在安全漏洞。当 lpd 守护进程调用 dvips 处理打印任务时，未以安全模式运行，导致远程攻击者可通过向目标系统的打印机服务提交特制的 DVI 文件，其中嵌入恶意命令，从而在目标主机上以 lp 权限执行任意命令。该漏洞影响 Red Hat Linux 6.2/7.0/7.1 等版本，攻击者无需身份认证即可远程利用，CVSS 评分 7.5，危害等级高。"
published = "2001-08-31T04:00:00Z"
remediation = "升级 Red Hat Linux 至 7.2 或更高版本，或在 lpd 的 dvips 打印过滤器配置中为 dvips 命令添加 `-R` 安全模式参数（如将 `dvips` 改为 `dvips -R`），禁止 DVI 文件中内嵌的恶意命令执行。同时限制 lpd 服务仅对可信来源开放，并在防火墙中过滤 TCP 515 端口。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Red Hat Linux LPD DVI打印过滤器远程命令执行漏洞"
updated = "2026-06-16T21:55:23Z"

