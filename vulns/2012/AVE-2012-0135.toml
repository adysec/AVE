[basic]
description = "Apple Mac OS X 10.7.x 之前版本的 QuickTime 在处理 JPEG2000 编码的电影文件时存在释放后使用（Use-After-Free）漏洞。远程攻击者可向目标用户发送特制的恶意 JPEG2000 编码影片文件，当用户使用 QuickTime 打开该文件时，触发已释放内存的引用，导致任意代码执行或应用程序崩溃。攻击需诱导用户访问恶意文件，无需身份认证，影响机密性、完整性和可用性。"
published = "2012-05-11T03:49:59Z"
remediation = "升级 Apple QuickTime 至 7.7.2 或更高版本（随 Mac OS X 10.7.4 更新一同发布），可通过 Apple 软件更新或从 Apple 官网下载安装。如无法立即升级，建议在浏览器中禁用 QuickTime 插件，并避免打开来源不明的 JPEG2000 编码影片文件。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Apple Mac OS X QuickTime 释放后使用漏洞"
updated = "2026-06-16T23:38:01Z"

