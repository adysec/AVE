[basic]
description = "KICQ 2.0.0b1 版本在处理畸形 ICQ 数据包时存在拒绝服务漏洞。远程攻击者无需身份认证，只需向目标系统发送特制的畸形 ICQ 消息包，即可触发程序崩溃，导致服务不可用。该漏洞源于对畸形数据包缺乏有效的边界检查和异常处理，攻击者可通过构造特定格式的 ICQ 数据包实现攻击，影响 KICQ 2.0.0b1 版本。"
published = "2002-05-16T04:00:00Z"
remediation = "KICQ 2.0.0b1 已停止维护且不再有安全更新，建议立即卸载 KICQ 并迁移至现代即时通讯客户端（如 Pidgin 或 Kopete）。如暂时无法卸载，可在防火墙层面阻止对 KICQ 监听端口（默认 1030/TCP）的外部入站访问，以降低远程攻击风险。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "KICQ 2.0.0b1 畸形ICQ报文拒绝服务漏洞"
updated = "2026-06-16T21:57:02Z"

