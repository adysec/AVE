[basic]
description = "Linux内核RDMA/mlx5子系统存在隐式ODP内存区域释放后使用漏洞。在销毁隐式ODP MR时，由于竞态条件，销毁工作可能被重复排队。第二个工作项在第一个工作已释放MR后仍会执行，导致引用计数下溢和use-after-free。攻击者需具备本地访问权限和低权限账户即可触发该漏洞，可能导致权限提升或系统崩溃。CVSS评分为7.8（高危），CWE编号为CWE-416。"
published = "2025-02-27T02:15:15.050"
remediation = "立即升级内核至已修复版本：RHEL 9 用户升级至 kernel-5.14.0-611.5.1.el9_7 或更高版本；Debian/Ubuntu 用户升级至 linux-image 6.5.0 或 6.12.13 及以上版本；上游 kernel 用户升级至 6.5.0 或之后版本。升级后必须重启系统使补丁生效。若无法立即升级，可临时禁用 RDMA/IB 用户态驱动（卸载 mlx5_ib 模块：`modprobe -r mlx5_ib`）以阻止攻击路径，但会导致 InfiniBand/RDMA 网络功能不可用，仅作为紧急缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux内核 RDMA/mlx5 使用后释放漏洞"
updated = "2026-06-17T08:44:05.723"

