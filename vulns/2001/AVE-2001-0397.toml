[basic]
description = "CVE-2001-1277是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2001-06-11T04:00:00Z"
remediation = "建议立即升级 man 软件包至 1.5i2 或更高版本以修复该漏洞。对于基于 Debian/Ubuntu 的系统，可执行 `apt-get update && apt-get install man-db`；对于基于 Red Hat/CentOS 的系统，可执行 `yum update man` 或 `dnf update man-db`。如暂时无法升级，作为临时缓解措施，可移除 man 组中不受信任用户的写入权限，或通过 `chmod o-x /usr/sbin/makewhatis` 限制非 root 用户执行 makewhatis，防止利用 shell 元字符覆盖任意文件。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "GNU man makewhatis 任意文件写入漏洞"
updated = "2026-06-16T21:55:57Z"

