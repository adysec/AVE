[basic]
description = "PINE 邮件客户端在 4.58 及更早版本中存在缓冲区溢出漏洞。远程攻击者可通过向目标用户发送包含恶意构造的 message/external-body MIME 类型内容的电子邮件，在客户端解析邮件时触发缓冲区溢出，从而执行任意代码。该漏洞利用复杂度低，攻击者无需任何身份认证即可发起远程攻击。成功利用后可导致敏感信息泄露、邮件数据篡改及客户端程序被完全控制。该漏洞影响运行 PINE 邮件客户端的 Unix/Linux 系统，用户仅需打开恶意邮件即可被攻击。建议用户升级至 PINE 4.58 或更高版本以修复此漏洞。"
published = "2003-09-17T04:00:00Z"
remediation = "立即将 Pine 邮件客户端升级至 4.58 或更高版本，该版本已修复 message/external-body MIME 类型的缓冲区溢出漏洞。如暂时无法升级，可通过修改 pinerc 配置文件禁用外部消息处理功能，或在邮件网关处过滤包含 Content-Type: message/external-body 的邮件作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Pine 邮件客户端 远程缓冲区溢出漏洞"
updated = "2026-06-16T22:02:42Z"

