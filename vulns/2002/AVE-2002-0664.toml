[basic]
description = "SSH 1至3版本（可能还包括其他版本）存在安全绕过漏洞，本地用户可通过受限shell（如rbash或rksh）执行上传脚本的方式绕过安全限制。具体利用方式为：攻击者先将恶意脚本上传至全局可写目录，再通过执行该脚本突破受限shell的访问控制，最终获得完整的shell访问权限。该漏洞影响使用受限shell环境的SSH服务器，攻击者需在目标系统上拥有本地账户访问权限。成功利用后，攻击者可突破rbash或rksh等受限shell的环境限制，获得系统完整操作权限，对服务器安全构成严重威胁。"
published = "2002-12-31T05:00:00Z"
remediation = "升级 OpenSSH 至 3.5 或更高版本（已修复此限制 Shell 逃逸问题）；配置受限 Shell 用户的主目录权限为 700，移除所有全局可写目录的写入权限；在 sshd_config 中设置 PermitUserEnvironment no 并重启 SSH 服务生效。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "SSH 1-3 受限Shell逃逸命令执行漏洞"
updated = "2026-06-16T21:59:50Z"

