[basic]
description = "Quikstore 网上购物车程序存在目录遍历漏洞，未经身份认证的远程攻击者可通过在页面请求的 page 参数中注入 .. （点号）路径穿越序列，绕过目录访问限制读取服务器上的任意文件。该漏洞影响使用 Quikstore 购物车程序的所有站点，攻击者无需账户凭证即可远程利用，攻击条件要求目标程序未对用户传入的页面参数进行路径校验和过滤。成功利用可导致服务器敏感文件（如配置文件、数据库凭证等）泄露，危害等级为中等。"
published = "2001-01-09T05:00:00Z"
remediation = '由于该软件已停止维护，建议在 Web 服务器或 WAF 层面配置过滤规则，拦截 `page` 参数中包含 `../` 或 `..\` 的请求。若仍需使用，应通过代码对 `page` 参数进行白名单校验，禁止使用相对路径访问文件。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Quikstore 购物车程序目录遍历任意文件读取漏洞"
updated = "2026-06-16T21:53:20Z"

