[basic]
description = "PostgreSQL 7.2.1 及更早版本中存在缓冲区溢出漏洞，源于对 TZ 和 SET TIME ZONE 环境变量的边界检查不充分。本地攻击者可通过向受影响系统设置特制的时区环境变量触发缓冲区溢出，导致系统拒绝服务，并可能利用该漏洞执行任意代码，获取目标系统的控制权限。该漏洞影响 PostgreSQL 7.2.1 及之前版本，需本地用户权限触发，危害等级中等。"
published = "2003-01-17T05:00:00Z"
remediation = "立即升级 PostgreSQL 至 7.2.2 或更高版本以修复 TZ 和 SET TIME ZONE 环境变量的缓冲区溢出漏洞。由于 7.2.x 系列已停止维护，建议升级至仍在支持的最新稳定版本（如 16.x/17.x）。如无法立即升级，可在操作系统层面限制不可信用户的本地登录权限，并在 pg_hba.conf 中将本地连接认证方式从 trust 改为 md5 或 scram-sha-256，同时通过 SELinux/AppArmor 限制 postgres 进程的额外权限作为临时缓解措施。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "PostgreSQL 环境变量缓冲区溢出漏洞"
updated = "2026-06-16T21:59:15Z"

