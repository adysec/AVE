[basic]
description = 'Node.js 系统信息库（npm 包 "systeminformation"）存在远程命令注入漏洞。该漏洞存在于 5.3.1 版本之前，攻击者可通过向 si.inetLatency()、si.inetChecksite()、si.services()、si.processLoad() 等函数传递构造的数组参数（而非纯字符串）触发命令注入，在目标系统上执行任意操作系统命令。该漏洞影响所有使用了 systeminformation 受影响版本的 Node.js 应用，CVSS 评分 7.1，危害等级高。攻击者需在本地环境或通过网络连接到目标应用接口才能利用此漏洞。官方已在 5.3.1 版本中修复该问题，用户应升级至最新版本，或在对服务参数进行严格验证（仅允许字符串类型输入、拒绝数组参数）以作为临时缓解措施。'
published = "2021-02-16T17:15:13Z"
remediation = "标签之间。<value>建议立即升级 systeminformation 到 5.3.1 或更高版本。如无法立即升级，可对 si.inetLatency()、si.inetChecksite()、si.services()、si.processLoad() 等函数的入参做严格类型校验，仅允许字符串类型并拒绝数组输入，以防止命令注入。"
score = 7.1
severity = "HIGH"
sources = ["kev"]
title = "sebhildebrandt systeminformation 远程命令注入漏洞"
updated = "2026-06-17T03:35:16Z"

