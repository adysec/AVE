[basic]
description = "Windows 2000 的受保护存储（Protected Store）模块在选择加密算法时存在缺陷，未能正确选取可用的最强加密方式，导致默认使用 40 位加密而非 56 位 DES 加密。该漏洞允许本地攻击者通过访问受保护存储中的敏感数据，获取使用弱加密保护的信息，从而造成信息泄露。攻击条件为攻击者需具备本地访问权限，CVSS 评分为 3.6，危害等级较低。Microsoft Windows 2000 均已受影响。"
published = "2000-06-01T04:00:00Z"
remediation = "安装 Microsoft 安全更新 MS00-032 补丁，该补丁会替换 PSBASE.DLL 模块以确保后续使用最强可用加密。补丁中包含 Keymigrt.exe 工具，需提取并运行该工具重新加密受保护存储区（Protected Store）中已有的所有敏感数据，建议系统管理员将 Keymigrt.exe 加入用户登录脚本以确保下次登录时自动执行。同时安装 Windows 2000 Service Pack 1 可获取此修复。由于 Windows 2000 已停止支持，建议升级至受支持的操作系统版本。"
score = 3.6
severity = "LOW"
sources = ["avd"]
title = "Microsoft Windows 2000 弱加密漏洞"
updated = "2026-06-16T21:51:50Z"

