[basic]
description = "WordPress 的 infusionsoft 插件 1.5.11 版本中存在反射型跨站脚本（XSS）漏洞，属于 CWE-79 类型。攻击者无需身份认证即可通过构造特制的恶意 URL，诱使目标用户点击后，恶意脚本将在用户浏览器中执行，导致敏感信息泄露或会话劫持。该漏洞影响使用该插件的所有 WordPress 站点，CVSS 评分 6.1，危害等级中危。目前官方未发布修复补丁，建议禁用该插件或实施输入过滤与输出编码等安全措施。"
published = "2016-10-10T20:59:15Z"
remediation = "立即将 WordPress 插件 Infusionsoft Gravity Forms Add-on 升级至 1.5.12 或更高版本（该版本已修复 leadscoring.php 中 ContactId 参数的反射型 XSS 问题）。由于该插件已于 2021 年 10 月关闭且不再维护，建议停用并删除该插件，迁移至官方支持的 Infusionsoft 集成方案。如暂时无法替换，在 wp-config.php 中启用 DISALLOW_UNFILTERED_HTML 常量，并安装 Web 应用防火墙拦截恶意请求。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Infusionsoft 插件反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:45Z"

