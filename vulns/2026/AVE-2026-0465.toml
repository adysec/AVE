[basic]
description = "SiYuan 是一款开源个人知识管理系统，其内核 HTTP 服务器在会话认证中间件中无条件信任所有 `chrome-extension://` 来源的请求，将任意浏览器扩展的请求赋予 `RoleAdministrator` 管理员角色权限。结合桌面版默认 `AccessAuthCode` 为空字符串的配置，任何已安装的 Chrome/Chromium 扩展（包括通过供应链攻击被攻陷的合法扩展）均可无需认证直接调用 `127.0.0.1:6806` 上的全部管理 API，实现工作区数据窃取、存储型 XSS 注入及配置篡改。该漏洞影响 SiYuan ≤ 3.6.5 版本，CVSS 评分 9.2，危害等级严重，已在 3.7.0 版本中修复。"
published = "2026-06-24T22:16:48Z"
remediation = "立即将 SiYuan 升级至 v3.7.0 或更高版本，该版本移除了对所有 chrome-extension:// Origin 的无条件信任，改为白名单验证机制。如暂时无法升级，可设置访问认证码：打开设置 → 关于 → 设置访问授权码（AccessAuthCode），使内核 API 要求 token 认证，阻止未授权扩展直接调用管理接口。同时建议审查已安装的浏览器扩展，移除不必要的或来源不明的扩展。"
score = 9.2
severity = "CRITICAL"
sources = ["ghsa"]
title = "SiYuan 思源笔记浏览器扩展 Origin 校验缺失漏洞"
updated = "2026-06-25T15:16:38Z"

