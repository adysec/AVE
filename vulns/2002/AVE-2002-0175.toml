[basic]
description = "Exim 3.34 及更早版本在处理超长的 -C（配置文件）及其他命令行参数时存在缓冲区溢出漏洞。本地攻击者可向受影响系统提交特制的超长命令行参数触发缓冲区溢出，从而获取目标系统的权限提升。该漏洞影响 Exim 3.34 及之前版本，CVSS 评分 4.6，危害等级中危。攻击者需具有本地访问权限方可利用此漏洞。"
published = "2002-05-31T04:00:00Z"
remediation = "升级 Exim 至 3.35 或更高版本。如无法升级，可应用 2xs 安全团队提供的补丁（将多处 strcpy 替换为 strncpy 并增加长度检查）。Red Hat 用户应安装 RHSA-2002:208 提供的更新包。作为临时缓解措施，限制本地用户对 Exim 二进制文件的执行权限（chmod 750 /usr/exim/bin/exim）并移除 suid 位（chmod u-s /usr/exim/bin/exim）。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "Exim 命令行参数缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:57:07Z"

