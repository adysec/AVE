[basic]
description = "Oracle Fusion Middleware 的 BI Publisher（原 XML Publisher）组件存在 XML 外部实体注入（XXE）漏洞。未经身份认证的远程攻击者可通过 HTTP 协议向受影响版本（11.1.1.9.0、12.2.1.3.0、12.2.1.4.0）的 BI Publisher 发送特制的 XML 请求，利用 XML 解析器对外部实体的处理缺陷，实现未授权读取或修改服务器上的任意文件及内部数据。该漏洞影响范围可波及其他关联产品，攻击无需任何权限或用户交互，利用复杂度低，CVSS 评分 7.2，危害等级高。Oracle 已在 2019 年 4 月关键补丁更新中修复此漏洞。"
published = "2019-04-23T19:32:51Z"
remediation = "立即登录 My Oracle Support 下载并安装 Oracle Fusion Middleware 的 2019 年 4 月关键补丁更新（CPUApr2019）中针对 BI Publisher 的安全补丁。受影响版本 11.1.1.9.0 升级至 11.1.1.9.0 对应补丁级别，12.2.1.3.0 和 12.2.1.4.0 分别升级至对应 CPU 补丁版本。如无法立即打补丁，可在网络层面限制对 BI Publisher HTTP 服务的非授权访问，仅允许可信 IP 段访问，并禁用 XML 外部实体解析功能作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["kev"]
title = "Oracle BI Publisher XML外部实体注入漏洞"
updated = "2026-06-17T02:34:13Z"

