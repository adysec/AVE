[basic]
description = "WatchGuard Fireware OS 管理 CLI 命令处理器存在越界写入漏洞（CWE-787），具有高权限的认证攻击者可通过向受影响设备发送特制的 CLI 命令触发该漏洞，导致在目标系统上执行任意代码。该漏洞影响 Fireware OS 11.0 至 11.12.4_Update1、12.0 至 12.12 以及 2025.1 至 2026.2 等多个版本，CVSS 评分 8.6，危害等级高。厂商已发布安全更新修复此漏洞，建议用户尽快升级至最新版本。"
published = "2026-07-03T00:16:50Z"
remediation = "建议立即升级 Fireware OS 至以下修复版本：2025.x 系列升级至 2026.2.1，12.x 系列升级至 12.12.1，12.5.x 系列（T15/T35 型号）升级至 12.5.19。11.x 系列已停止支持，请尽快迁移至受支持版本。可通过 WatchGuard System Manager 或 Web UI 进入「系统 > 软件管理」执行升级。该漏洞需认证后利用，建议同时严格限制管理 CLI 的访问来源 IP，仅允许受信任管理网段连接。"
score = 8.6
severity = "HIGH"
sources = ["zdi"]
title = "WatchGuard Fireware OS CLI 越界写入漏洞"
updated = "2026-07-10T13:00:36Z"

