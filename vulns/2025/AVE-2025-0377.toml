[basic]
description = "curl 在处理 .netrc 文件认证凭证与 HTTP 重定向时存在凭证泄露漏洞。当 curl 被配置为使用 .netrc 文件获取凭据，同时启用 HTTP 重定向跟随功能时，若 .netrc 文件中存在省略了登录名和密码的 default 条目，curl 会将用于第一个主机的密码泄露给重定向目标主机。攻击者可通过构造恶意重定向响应，诱使 curl 客户端泄露敏感凭证信息。该漏洞攻击复杂度较高，需要特定配置条件，CVSS 评分 3.4，危害等级低。curl 项目已在后续版本中修复此问题。"
published = "2025-02-05T10:15:22Z"
remediation = "升级 curl 和 libcurl 至 8.12.0 或更高版本（8.12.0 于 2025 年 2 月 5 日发布），该版本已修复 netrc 默认条目凭证在 HTTP 重定向时泄漏的问题。如无法立即升级，可应用补丁 commit 0e120c5b925e8ca75d5319e 和 9bee39bfed2c413b4cc 后重新编译；临时缓解措施为避免在 .netrc 中使用 default 条目与 HTTP 重定向同时使用。"
score = 3.4
severity = "LOW"
sources = ["msrc"]
title = "curl netrc 默认凭证泄露漏洞"
updated = "2026-06-17T08:25:59Z"

