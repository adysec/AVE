[basic]
description = "forget-about-shortcode-buttons WordPress 插件 1.1.1 版本中存在反射型跨站脚本漏洞（CWE-79）。攻击者无需身份认证即可通过构造恶意 URL 参数注入任意 JavaScript 代码，当目标用户点击该特制链接时，脚本将在浏览器中执行，导致敏感信息泄露或会话劫持。该漏洞影响 WordPress 环境下使用该插件的所有站点，攻击条件仅需诱导用户点击恶意链接，利用难度较低。CVSS 评分 6.1，危害等级中危。"
published = "2016-10-10T20:59:09Z"
remediation = "立即将 WordPress 插件 Forget About Shortcode Buttons 升级至 1.1.2 或更高版本（1.1.2 为安全更新，修复了反射型 XSS 漏洞）。如无法升级，可在 Web 应用防火墙（WAF）层面添加规则过滤包含 `<script>` 等恶意标签的 URL 查询参数作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress forget-about-shortcode-buttons 插件 反射型跨站脚本漏洞"
updated = "2026-06-17T00:38:44Z"

