[basic]
description = "Windows 2000 的 Internet 密钥交换（IKE）协议实现存在拒绝服务漏洞，远程攻击者无需身份认证即可向目标系统的 UDP 500 端口发送大量包含点号（.）字符的畸形数据包，导致系统 CPU 资源被耗尽，造成拒绝服务。该漏洞影响 Windows 2000 系列操作系统，攻击者只需具备网络访问能力即可发起攻击，利用门槛低。"
published = "2001-12-07T05:00:00Z"
remediation = "安装 Microsoft 安全公告 MS02-011 对应的更新补丁，或升级至 Windows XP 及以上版本。临时缓解措施：在边界防火墙上限制 UDP 500 端口的入站流量速率，或使用 IPsec 策略过滤异常 IKE 数据包。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Windows 2000 Internet Key Exchange 拒绝服务漏洞"
updated = "2026-06-16T21:55:17Z"

