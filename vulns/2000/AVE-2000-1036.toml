[basic]
description = "Bardon Data Systems WinU 1.0 至 5.1 版本存在硬编码后门密码漏洞。攻击者可通过该预设密码绕过身份认证，远程登录管理界面并修改系统配置，包括用户权限、网络设置等关键参数。该漏洞利用难度较低，只需知道默认后门密码即可实施攻击，可能导致系统被完全控制。厂商未提供官方补丁，建议升级或停止使用受影响版本。"
published = "2000-12-19T05:00:00Z"
remediation = "厂商 Bardon Data Systems 已在其官方网站（http://www.bardon.com/pwdcrack.htm）公布后门密码详情。建议用户立即停止使用 WinU 1.0 至 5.1 版本，升级至已移除后门密码的修复版本。如厂商未提供修复版本，应迁移至其他安全的远程管理替代工具。无法立即升级时，应在防火墙层面严格限制对 WinU 管理端口的网络访问，仅允许受信 IP 连接。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Bardon Data Systems WinU 后门密码漏洞"
updated = "2026-06-16T21:52:55Z"

