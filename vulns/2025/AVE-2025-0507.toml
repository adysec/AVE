[basic]
description = "Qt 公司的 Qt Quick 框架中的 Text 文本组件解析器在处理 `<img>` 标签时，未对图片的 width 和 height 属性进行有效验证，存在资源无限制分配漏洞（CWE-770）。远程攻击者可通过构造包含超大尺寸属性的恶意 `<img>` 标签的富文本内容，诱导目标用户解析该内容，导致 Qt 应用程序分配过量内存资源，最终造成界面无响应或进程崩溃。该漏洞影响 Qt 5.0.0 至 6.5.10、6.6.0 至 6.8.5 以及 6.9.0 至 6.10.0 版本，覆盖 Windows、macOS、Linux、iOS、Android 等多平台，CVSS v4.0 评分 8.7，危害等级高。攻击者无需身份认证，仅需用户浏览或加载特制文本内容即可触发拒绝服务。"
published = "2025-12-04T00:00:00Z"
remediation = "升级 Qt 至 6.5.11+、6.8.6+ 或 6.10.1+ 版本，或从 Qt 官方 Gerrit 合入补丁 https://codereview.qt-project.org/c/qt/qtdeclarative/+/687239 和 +/687766。如无法立即升级，可在应用层对用户输入的 &lt;img&gt; 标签宽高值做上限校验（如限制 width/height ≤ 4096 像素）作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["msrc"]
title = "Qt 文本组件解析器 img 标签大小验证不当漏洞"
updated = "2025-12-04T00:00:00Z"

