[basic]
description = "Google Chrome 17.0.963.65 及之前版本在处理 HTML 类属性时存在使用后释放漏洞，远程攻击者可通过诱导用户访问精心构造的恶意网页，触发浏览器渲染引擎在处理 class 属性时释放已释放的内存对象，导致浏览器崩溃拒绝服务，甚至可能执行任意代码。该漏洞影响 Chrome 17.0.963.65 之前所有版本，攻击者需诱导受害者访问恶意页面即可触发，CVSS 评分 6.8（中高危），Google 已在 Chrome 17.0.963.65 版本中修复该漏洞。"
published = "2012-03-05T19:55:01Z"
remediation = "建议立即升级 Google Chrome 至 17.0.963.65 或更高版本（可通过浏览器菜单“关于 Chrome”自动更新）。若暂时无法升级，可在设置中禁用 JavaScript 或仅允许受信任站点运行脚本作为临时缓解措施。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome 使用后释放漏洞"
updated = "2026-06-16T23:32:29Z"

