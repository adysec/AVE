[basic]
description = "Microsoft IIS 4.0/5.0 存在可执行文件请求解析漏洞（Web Server File Request Parsing 漏洞），攻击者可构造畸形 HTTP 请求，在请求的可执行文件名后附加操作系统命令（如 `cmd.exe /c dir`），IIS 解析请求时未正确过滤文件名中的命令注入，导致服务器以 SYSTEM 权限执行任意系统命令。该漏洞影响 Microsoft IIS 4.0 和 5.0 版本，CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），属于高危远程代码执行漏洞。攻击条件为：目标服务器运行受影响 IIS 版本、攻击者可远程发送 HTTP 请求、目标目录具有脚本/可执行权限。攻击者可构造如 `/scripts/..%c0%af..%c0%afwinnt/system32/cmd.exe?/c+dir` 等畸形请求实现远程命令执行，完全控制服务器。微软已发布安全公告 MS00-078 修复该漏洞，建议升级至 IIS 5.0 SP1 或更高版本并应用补丁。"
published = "2000-12-19T05:00:00.000"
remediation = "升级到 Windows NT 4.0 SP6a 或 Windows 2000 SP4（包含修复 IIS 5.0 文件请求解析漏洞的补丁），或直接使用 Windows Server 2003 及以上版本（IIS 6.0+）。作为临时缓解措施，可禁用 Web 服务器对文件扩展名的执行权限，或配置 URL 重写模块以阻止包含命令操作符的请求处理。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft IIS 4.0/5.0 可执行文件解析远程代码执行漏洞"
updated = "2026-06-16T21:52:40.523"

