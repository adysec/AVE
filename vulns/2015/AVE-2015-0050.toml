[basic]
description = "Nordex Control 2 (NC2) SCADA 系统的 Wind Farm Portal 应用存在多处跨站脚本（XSS）漏洞。攻击者可通过向受影响页面注入恶意 Web 脚本或 HTML 代码，当管理员或其他用户访问特制链接时，脚本在浏览器中执行，导致敏感信息泄露或会话劫持。攻击需诱使用户点击恶意链接，无需身份认证。该漏洞影响 NC2 16 及更早版本，CVSS 评分 6.1，危害等级中危。"
published = "2015-10-18T19:59:01Z"
remediation = "联系 Nordex 厂商获取 NC2 SCADA 补丁版本并安排升级；如无有效服务合同，可通过当地 Nordex 服务组织订购补丁。临时缓解措施：将 Wind Farm Portal 应用置于防火墙后，禁止从互联网直接访问，隔离 SCADA 网络与办公网络，远程访问必须通过 VPN 加密通道。同时对所有用户输入实施严格的输出编码和过滤，防止 XSS 注入。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Nordex Control 2 SCADA Wind Farm Portal 跨站脚本漏洞"
updated = "2026-06-17T00:30:56Z"

