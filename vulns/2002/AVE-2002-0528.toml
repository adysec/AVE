[basic]
description = "PHPWiki 1.2/1.3 的 Postnuke wiki 模块存在跨站脚本（XSS）漏洞，远程攻击者可通过向 pagename 参数注入恶意脚本代码，当其他用户访问被篡改的页面时脚本自动执行，导致用户会话劫持、敏感信息泄露或页面内容篡改。攻击者无需身份认证即可利用该漏洞，影响 PHPWiki 1.2 及 1.3 版本。Exploit-DB 已公开该漏洞的利用方法。"
published = "2002-10-04T04:00:00.000"
remediation = "升级 PHPWiki 至 1.3.4 或更高版本（Debian 对应 phpwiki 1.3.4-1），该版本修复了 pagename 参数未正确转义导致的 XSS 漏洞。如无法升级，对所有用户输入（尤其是 pagename 参数）进行 HTML 实体编码过滤，并设置 Content-Security-Policy 响应头作为纵深防御。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "PHPWiki Postnuke wiki模块跨站脚本漏洞"
updated = "2026-06-16T21:58:40.343"

