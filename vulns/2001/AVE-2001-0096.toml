[basic]
description = "tags.<value>Microsoft Internet Security and Acceleration (ISA) Server 2000 的 Web Proxy 组件存在拒绝服务漏洞。当远程攻击者向目标服务器发送包含特定类型内容的超长 Web 请求时，由于 Web Proxy 未能对输入长度进行充分校验，可导致服务异常终止或系统资源耗尽。该漏洞影响 Microsoft ISA Server 2000 的所有版本，攻击者无需身份认证即可在远程直接利用，造成代理服务中断，影响正常用户的网络访问。"
published = "2001-07-02T04:00:00.000"
remediation = '安装 Microsoft 安全公告 MS01-021 发布的补丁（KB Q295279），或升级至 ISA Server 2000 Service Pack 1 以彻底修复该漏洞。如未使用 Web Publishing 功能，建议在 ISA Server 管理控制台中保持该功能禁用，并在防火墙层面阻断外部对 Web Proxy 服务的直接访问。补丁安装成功后，可通过检查注册表项 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\FPC\Hofixes\63 验证修复状态。若服务因攻击中断，直接重启 Web Proxy 服务即可恢复，无需重启服务器。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Microsoft ISA Server 2000 Web Proxy 拒绝服务漏洞"
updated = "2026-06-16T21:53:56.570"

