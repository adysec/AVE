[basic]
description = "Electron 框架在处理外部协议 URL 请求时未正确执行 iframe 沙箱限制，沙箱化 iframe 中的恶意 web 内容可绕过沙箱边界，触发操作系统注册的外部协议处理程序并启动外部应用程序。该漏洞影响所有在沙箱化 iframe 中渲染不可信内容且默认授予 openExternal 权限的 Electron 应用（未安装 setPermissionRequestHandler 时该权限默认开启），攻击者可通过构造恶意页面诱导用户打开 Electron 应用，进而启动系统上注册的任意外部程序。Electron 已在 39.8.8、40.9.0、41.2.1 和 42.0.0-beta.3 版本中修复此漏洞。"
published = "2026-08-05T19:17:41Z"
remediation = "升级 Electron 至 39.8.8、40.9.0、41.2.1 或 42.0.0-beta.3 及更高版本。若暂无法升级，可安装 `setPermissionRequestHandler` 并明确拒绝不可信内容对 `openExternal` 权限的请求，作为临时缓解措施。"
score = 5.4
severity = "MEDIUM"
sources = ["ghsa"]
title = "Electron 沙箱绕过外部协议处理程序漏洞"
updated = "2026-08-05T20:17:17Z"

