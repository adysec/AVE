[basic]
description = "Linux 内核 ksmbd 模块的 SMB2 协议实现对创建租赁（create lease）上下文处理时存在越界读取漏洞。当客户端发送包含特制租赁上下文数据的 SMB2 CREATE 请求时，`parse_lease_state()` 函数未对数据偏移量与数据长度之和进行边界校验，导致内核可能读取请求缓冲区以外的内存内容。该漏洞影响 Linux 内核 5.15 至 6.14.2 版本（不含修复版本），攻击者无需身份认证即可通过网络向运行 ksmbd 服务的目标系统发送恶意 SMB 数据包触发漏洞，造成信息泄露或系统崩溃。CVSS 评分 8.1，危害等级高。攻击者需具备低权限网络访问条件，但无需用户交互即可完成利用。Linux 内核维护者已在 6.1.134、6.6.87、6.12.23、6.13.11 及 6.14.2 等稳定版本中发布补丁修复此问题。"
published = "2025-04-16T15:15:57Z"
remediation = "升级 Linux 内核至已修复版本，例如 6.1.134、6.6.87、6.12.23、6.13.11 或 6.14.2 及以上。Debian 12 用户升级至 linux 6.1.135-1，Ubuntu 24.04 LTS 用户升级至 linux 6.8.0-86.87。如暂无法升级，可临时执行 systemctl disable --now ksmbd 禁用 ksmbd 服务，或在防火墙阻断 445/tcp 端口访问，并在网络层限制 SMB 服务仅对受信任内网开放。若系统无需 SMB 服务器功能，可在内核配置中取消 CONFIG_SMB_SERVER 选项以彻底消除风险。"
score = 8.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 ksmbd 越界访问漏洞"
updated = "2026-07-30T06:22:05Z"

