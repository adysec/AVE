[basic]
description = "Apple Safari 浏览器在 6.0 版本之前使用的 WebKit 渲染引擎存在内存破坏漏洞。未经身份认证的远程攻击者可通过诱导用户访问恶意构造的网页，触发 WebKit 中的缓冲区溢出（CWE-119），导致任意代码执行或应用程序崩溃拒绝服务。该漏洞影响 Safari 5.1.7 及更早版本，攻击条件为攻击者需要诱使用户使用受影响的 Safari 浏览器打开特制网页，攻击复杂度为中等。成功利用后，攻击者可在用户系统上以当前用户权限执行任意代码，完全控制受影响系统。Apple 已在 Safari 6.0 中修复此漏洞。"
published = "2012-07-25T20:55:03.587"
remediation = "将 Apple Safari 浏览器升级至 6.0 或更高版本；Mac OS X Lion 用户安装 2012 年 7 月 25 日发布的 OS X Lion 10.7.4 安全更新（内含 Safari 6.0），Mountain Lion 用户升级至 10.8 或后续版本；iOS 设备将系统升级至 6.0。如无法立即升级，可在 Safari 偏好设置 → 安全性中禁用 JavaScript 作为临时缓解措施，并避免访问不受信任的网站。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 远程代码执行漏洞"
updated = "2026-06-16T23:43:38.067"

