[basic]
description = "eXtropia bbs_forum.cgi 1.0 存在目录遍历漏洞，远程未经身份认证的攻击者可通过在 file 参数中提交 ../ 序列，突破目录限制读取服务器上的任意文件。该漏洞源于程序未对用户输入的文件路径进行有效过滤和规范化处理，导致路径遍历攻击成为可能。攻击者可利用此漏洞读取敏感系统文件（如 /etc/passwd、配置文件、源代码等），获取服务器敏感信息。CVSS 评分 5.0（中危），攻击向量为网络、攻击复杂度低、无需认证、仅影响机密性。影响范围限于 eXtropia bbs_forum.cgi 1.0 版本。"
published = "2001-03-12T05:00:00.000"
remediation = "eXtropia 官方已停止对 bbs_forum.cgi 的维护，未发布修复补丁。建议立即迁移至当前仍受支持的论坛软件（如 phpBB、Discourse 等）；若短期内无法替换，应在 Web 服务器层面通过 mod_security 或 Nginx 规则拦截对 file 参数中包含 .. 及 URL 编码变体的请求，同时将该 CGI 脚本的运行权限降至最低，并限制其仅可访问必要目录。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "eXtropia bbs_forum.cgi 1.0 目录遍历漏洞"
