[basic]
description = "Common Unix Printing System (CUPS) 1.1.14 至 1.1.17 版本中存在文件描述符管理缺陷，未正确检查文件及套接字操作的返回值，导致文件描述符被持续分配而无法释放，造成系统资源耗尽。远程攻击者无需身份认证即可通过向 CUPS 服务发送特制请求触发该漏洞，最终导致拒绝服务。该漏洞影响 Linux/Unix 系统上部署的 CUPS 打印服务，CVSS 评分 7.5，危害等级高。"
published = "2002-12-26T05:00:00Z"
remediation = "立即升级 CUPS 至 1.1.18 或更高版本，该版本已修复文件描述符未正确释放的问题。如无法升级，可在 cupsd.conf 中限制远程访问，将 Listen 绑定到 127.0.0.1:631 仅允许本地访问，并在防火墙层面限制对 631 端口的入站连接作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Easy Software Products CUPS 文件描述符未正确释放拒绝服务漏洞"
updated = "2026-06-16T21:59:11Z"

