[basic]
description = "wolfSSL 在 TLS 1.3 协议的 CertificateVerify 签名算法协商过程中存在输入验证不当漏洞（CWE-20）。攻击者可通过在 TLS 握手阶段操纵客户端与服务器之间的签名算法协商过程，将签名算法降级至强度更低的算法。例如，当客户端声称支持 ECDSA P521 时，服务器可能错误地接受 ECDSA P256 作为协商结果，导致后续连接使用安全性较弱的 P256 曲线进行签名验证。该漏洞影响 wolfSSL 5.8.2 及之前版本，涵盖多种操作系统平台。虽然该漏洞被评定为低危（CVSS 2.1），但在特定场景下可能削弱 TLS 连接的加密强度，攻击者需具备高权限才能利用。建议用户及时升级 wolfSSL 至修复该漏洞的最新版本。"
published = "2025-11-21T23:15:44Z"
remediation = "升级 wolfSSL 至 5.8.4 或更高版本（2025 年 11 月 20 日发布），该版本已包含 PR #9113 的修复，在 TLS 1.3 CertificateVerify 阶段增加了对签名算法的校验，防止服务端将客户端声明的高安全级别算法（如 ECDSA P521）降级为低安全级别算法（如 ECDSA P256）。若无法立即升级，可通过编译时禁用 TLS 1.3 支持（移除 --enable-tls13 编译选项）或仅允许使用单一签名算法族来降低风险。"
score = 2.1
severity = "LOW"
sources = ["msrc"]
title = "wolfSSL TLS 1.3 CertificateVerify 签名算法降级漏洞"
updated = "2026-06-17T08:31:26Z"

