[basic]
description = "js-yaml 是一个 JavaScript YAML 解析与序列化库，其 3.0.0 至 3.15.0 版本及 4.0.0 至 4.3.0 版本中存在算法复杂度漏洞。当解析包含合并键（merge key）链的 YAML 文档时，每个新映射都需要枚举前一个映射继承的所有键，导致 N 个链式映射产生 O(N²) 次合并键访问，CPU 消耗随文档大小呈二次方增长。远程攻击者可构造特制 YAML 文件（约 4000 个链式映射即可使解析耗时超过 1 秒），触发拒绝服务。该漏洞无需身份认证，攻击复杂度低，CVSS 评分 7.5，危害等级高。官方已在 3.15.0 和 4.3.0 版本中通过限制单次解析的合并键总数（默认 10000 个）修复此问题。"
published = "2026-07-08T16:16:33Z"
remediation = "升级 js-yaml 至 3.15.0 或 4.3.0 及以上版本。npm 用户执行 `npm install js-yaml@latest`，yarn 用户执行 `yarn add js-yaml@latest`。如无法立即升级，可在解析 YAML 前限制文档大小或禁用 merge key 功能作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "js-yaml YAML 合并键链处理拒绝服务漏洞"
updated = "2026-07-13T15:05:34Z"

