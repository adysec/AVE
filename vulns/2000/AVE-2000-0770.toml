[basic]
description = "Poll It CGI 2.0 及更早版本中的 pollit.cgi 脚本存在认证绕过漏洞，远程攻击者无需知道真实管理员密码，只需在 HTTP 请求中同时提交相同的值给 entered_password 和 admin_password 两个参数，即可绕过身份验证直接访问后台管理功能。该漏洞攻击复杂度低，无需任何权限，可导致敏感信息泄露和配置被篡改。"
published = "2000-12-11T05:00:00Z"
remediation = "立即停止使用 Poll It CGI 脚本，该脚本存在多处严重安全缺陷且作者未彻底修复。如必须使用，升级到 2.01 版本（将 ReadForm 调用移至变量声明之前）可部分缓解密码绕过问题，但 admin_password 变量仍可在 2.01 中被覆盖，建议彻底替换为其他投票程序。临时缓解措施：在 Web 服务器（Apache/Nginx）配置中对 pollit.cgi 所在目录添加 IP 白名单访问控制，并移除 pollit_files 目录的 Web 可读权限。"
score = 6.4
severity = "MEDIUM"
sources = ["epss"]
title = "Poll It CGI 2.0 认证绕过漏洞"
updated = "2026-06-16T21:53:05Z"

