[basic]
description = "Apple QuickTime 在 7.7.1 之前的版本中处理 JPEG2000 编码的电影文件时存在整数溢出漏洞。未经身份验证的远程攻击者可通过诱骗用户打开特制的包含 JPEG2000 编码数据的电影文件来触发该漏洞，成功利用后可导致应用程序崩溃造成拒绝服务，或执行任意代码获取系统控制权。该漏洞影响 macOS 和 Windows 平台上的 QuickTime 播放器，CVSS 评分为 9.3，危害等级严重。Apple 已在 QuickTime 7.7.1 版本中修复此问题，建议用户尽快升级至安全版本。"
published = "2011-10-28T02:49:53Z"
remediation = "升级 QuickTime 至 7.7.1 或更高版本。Windows 用户请从 Apple 官网下载 QuickTime 7.7.1 安装程序覆盖安装；OS X Lion 用户升级至 v10.7.2；Mac OS X v10.6 用户安装 Security Update 2011-006。临时缓解措施：避免打开来历不明的 QuickTime 电影文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime 整数溢出漏洞"
updated = "2026-06-16T23:32:57Z"

