[basic]
description = "Aptana Jaxer 1.0.3.4547 版本的 wikilite 源码查看器存在路径遍历漏洞。低权限远程攻击者可通过构造包含目录遍历序列的请求，向 `tools/sourceViewer/index.html?filename=../` 发送特制 URI，从而读取服务器上的任意内部文件，造成敏感信息泄露。该漏洞利用无需用户交互，攻击者只需能够网络访问目标服务器的 Jaxer 服务即可触发，成功利用后可获取配置文件、源代码等敏感数据。"
published = "2019-08-09T13:15:11.870"
remediation = "Aptana Jaxer 项目已停止维护且未发布官方补丁，建议立即删除或禁用 aptana/tools/sourceViewer/ 目录以阻断 wikilite 源码查看器的路径遍历攻击面；如业务依赖 Samples 和 Tools 演示功能，应在 Apache/Nginx 等前端代理中配置访问控制规则，禁止外部访问 /aptana/tools/sourceViewer/index.html 路径并对 filename 参数进行严格过滤；长期方案建议迁移至其他持续维护的 Web 服务器产品。"
score = 6.5
severity = "MEDIUM"
sources = ["nuclei"]
title = "Aptana Jaxer 本地文件包含漏洞"
updated = "2026-06-17T02:18:11.037"

