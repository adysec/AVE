[basic]
description = "WebKit浏览器引擎核心组件存在未明内存破坏漏洞，攻击者可通过精心构造的网页触发利用，导致远程代码执行或应用程序崩溃。该漏洞影响基于WebKit内核的Safari浏览器及相关产品。攻击者无需身份验证即可通过恶意网站实现浏览器利用，攻击路径隐蔽且影响范围广泛。漏洞利用可能导致敏感数据泄露、系统控制权丢失等严重安全风险。Apple已确认漏洞真实性，计划在后续安全更新中提供修复，但用户应及时升级到最新版本以获取保护。"
published = "2012-03-08T22:55:01Z"
remediation = "建议立即升级 Apple iTunes 至 10.6 或更高版本（通过 Apple 软件更新或从 apple.com/cn/itunes 下载）。作为临时缓解措施，避免在不受信的网络环境（如公共 Wi-Fi）中浏览 iTunes Store，并启用系统防火墙阻止非受信网络的中间人攻击。Apple 官方安全公告参考：APPLE-SA-2012-03-07-1。"
score = 7.6
severity = "HIGH"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏漏洞"
updated = "2026-06-16T23:32:08Z"

