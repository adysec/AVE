[basic]
description = "Windows NT 系统中的 NTLM 安全支持提供程序（NTLMSSP）服务存在权限提升漏洞。该服务在处理本地过程调用（LPC）请求时未对功能号进行严格校验，导致具有本地登录权限的未经身份验证的攻击者可构造特制请求绕过安全检查，从而获取系统管理员级别访问权限。该漏洞影响 Windows NT 及后续版本中依赖 NTLMSSP 进行身份验证的系统组件，攻击者仅需具备目标主机的本地访问权限即可利用，CVSS v2 评分为 7.2，危害等级高危。"
published = "2001-03-12T05:00:00Z"
remediation = '立即安装 Microsoft 安全公告 MS01-008 对应补丁（KB280119），该补丁适用于已安装 Service Pack 6a 的 Windows NT 4.0 Workstation、Server、Enterprise Edition 及 Service Pack 6 的 Terminal Server Edition，可从 Microsoft 下载中心获取并安装。安装后验证注册表项 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Hotfix\Q280119 是否存在以确认补丁生效。如无法立即安装补丁，应通过组策略限制非特权用户的交互式登录权限，仅允许可信用户在终端登录，以降低本地用户利用此漏洞提权至系统管理员权限的风险。'
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Windows NT NTLMSSP 本地权限提升漏洞"
updated = "2026-06-16T21:53:29Z"

