[basic]
description = "大华多款数字录像机和IP摄像机的配置文件以明文或弱保护方式存储管理员密码，攻击者无需身份认证即可远程读取配置文件获取密码，随后冒充管理员身份登录设备，访问敏感监控数据并进行恶意操控。该漏洞影响大华DH-IPC-HDBW23A0RN-ZS、DH-IPC-HDBW13A0SN、DH-IPC-HDW1XXX、DH-IPC-HDW2XXX、DH-IPC-HDW4XXX、DH-IPC-HFW1XXX、DH-IPC-HFW2XXX、DH-IPC-HFW4XXX、DH-SD6CXX、DH-NVR1XXX、DH-HCVR4XXX、DH-HCVR5XXX等多款设备。由于攻击条件宽松（无需认证、网络可达即可），该漏洞被评定为严重等级。"
published = "2017-05-06T00:29:00Z"
remediation = "立即升级 Dahua 受影响设备固件至最新版本（联系 Dahua 技术支持或授权经销商获取），同时修改所有默认密码，启用高强度密码策略。将设备移至防火墙后部隔离网段，禁止从 Internet 直接访问；如需远程管理则通过 VPN 接入并启用双因素认证。定期清理配置文件中明文密码，部署后执行配置变更审计。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "大华数字录像机和IP摄像机配置文件密码漏洞"
updated = "2026-06-17T01:25:29Z"

