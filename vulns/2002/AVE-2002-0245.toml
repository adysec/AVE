[basic]
description = "CodeBlue 4 及更早版本（含 CodeBlue 5.1）的 SMTP 服务存在缓冲区溢出漏洞。程序在处理 SMTP 响应时未对输入字符串长度进行有效校验，攻击者可构造一段超长的 SMTP 响应字符串并发送至目标服务器，触发栈缓冲区溢出。该漏洞无需身份认证即可被远程利用，成功利用后可导致任意代码执行，影响范围为运行受影响版本的所有 SMTP 服务实例。"
published = "2002-05-31T04:00:00Z"
remediation = "立即停止使用 CodeBlue 并卸载该软件。CodeBlue 已于 2002 年停止维护，官方未发布修复补丁。建议替换为现代 Web 日志分析工具（如 GoAccess 或 ELK Stack）。若短期内无法卸载，应以非 root 用户运行 CodeBlue，并在防火墙层面阻止其向外部 SMTP 服务器发起出站连接（仅允许访问内部 Apache 服务器），同时对访问日志中的 SMTP 响应进行输入长度过滤。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "CodeBlue SMTP 响应缓冲区溢出漏洞"
updated = "2026-06-16T21:57:08Z"

