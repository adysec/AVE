[basic]
description = "Pegasus Mail 3.12 邮件客户端存在任意文件读取漏洞。远程攻击者可构造包含恶意 mailto: 协议链接的电子邮件，通过添加 -F 参数指定目标文件路径，当受害者点击该链接时，Pegasus Mail 会读取并转发攻击者指定的任意本地文件，导致敏感信息泄露。攻击无需身份认证，仅需诱使用户点击链接即可触发。"
published = "2000-12-19T05:00:00.000"
remediation = "立即升级 Pegasus Mail 至 3.12c 或更高版本，该版本已修复 mailto: 协议中 -F 开关可被用于读取任意文件的问题。如无法升级，可在邮件客户端中禁用 mailto: 协议处理，或在系统层面将 Pegasus Mail 从默认 mailto 处理器中移除，防止攻击者通过嵌入 URL 触发文件转发。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "David Harris Pegasus Mail 3.12 任意文件读取漏洞"
updated = "2026-06-16T21:52:47.510"

