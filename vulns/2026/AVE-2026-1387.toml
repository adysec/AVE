[basic]
description = "Open WebUI 在 0.10.0 至 0.10.2 版本中存在存储型跨站脚本漏洞。其 KaTeX 数学公式渲染器在渲染失败时，错误处理分支未对原始数学源码进行 HTML 转义，直接通过 `{@html}` 插入 DOM，导致攻击者注入的脚本在浏览者浏览器中执行。该漏洞影响所有渲染消息的界面，包括共享聊天和频道。任何已认证用户均可构造包含深层嵌套大括号的数学公式触发 KaTeX 栈溢出，并在公式中嵌入恶意脚本。当其他用户（包括管理员）打开包含该消息的共享聊天或频道时，脚本即被执行，可窃取浏览器 localStorage 中的会话令牌，进而劫持目标账户。漏洞无需管理员权限或特殊配置，只需目标用户打开恶意内容即可触发，服务器端数据不受影响。官方已在 0.11.0 版本中修复此问题，升级后可彻底消除漏洞。"
published = "2026-08-04T21:16:38Z"
remediation = "立即将 Open WebUI 升级至 0.11.0 或更高版本，该版本通过 commit bc600d3f0（PR #26718）修复了 KaTeXRenderer.svelte 中未转义的错误回退路径，可彻底消除存储型 XSS。如暂无法升级，可临时限制聊天消息的共享链接访问，并禁用第三方前端渲染或数学公式渲染功能，阻止恶意消息被其他用户浏览。"
score = 8.7
severity = "HIGH"
sources = ["ghsa"]
title = "Open WebUI KaTeX渲染器 存储型跨站脚本漏洞"
updated = "2026-08-05T16:17:02Z"

