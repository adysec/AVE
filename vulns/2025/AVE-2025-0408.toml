[basic]
description = "Grub2 的 JFS 文件系统模块在处理符号链接时存在整数溢出漏洞。攻击者可通过挂载特制的恶意 JFS 文件系统，利用文件系统几何参数中用户可控的字段触发缓冲区大小计算溢出，导致 grub_malloc() 分配的内存小于预期。随后 grub_jfs_lookup_symlink() 函数在调用 grub_jfs_read_file() 读取数据时发生堆越界写入，破坏 GRUB 内部关键数据结构，最终可实现任意代码执行并绕过 Secure Boot 保护机制。该漏洞需攻击者具有本地高权限并能够挂载恶意文件系统，CVSS 评分 6.4，危害等级中危。"
published = "2025-03-03T18:15:30Z"
remediation = "立即将 grub2 升级至包含 2025 年 2 月安全补丁集的版本（grub2 > 2.12，或各发行版对应修复版本，如 Red Hat 的 grub2-2.02-0.87.el8_9 等），同时使用 `mokutil --sbat` 更新 shim 的 SBAT 吊销数据以彻底阻断 Secure Boot 绕过。临时缓解措施：限制物理接触系统的权限，避免攻击者挂载恶意 JFS 文件系统。"
score = 6.4
severity = "MEDIUM"
sources = ["msrc"]
title = "GNU GRUB2 JFS文件系统整数溢出漏洞"
updated = "2026-06-30T00:16:50Z"

