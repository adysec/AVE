[info]
author = "ave"
description = "验证Adobe Flash Player中Sound.loadPCMFromByteArray函数的悬空指针漏洞(CVE-2016-0984)。通过HTTP请求检测目标是否可访问漏洞利用文件。"
id = "POC-AVE-2016-0033"
name = "Adobe Flash Sound.loadPCMFromByteArray Dangling Pointer PoC"
severity = "high"
tags = ["ave-2016-0033"]
vuln_id = [
    "CVE-2016-0984",
    "AVE-2016-0033",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/exploit.swf"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
