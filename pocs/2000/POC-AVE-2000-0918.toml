[info]
author = "ave"
description = "GnuPG 1.0.3 多文档签名验证绕过：构造包含多个文档的签名文件，修改第二个及后续文档内容后重新签名，验证时仅检查第一个文档签名，导致篡改内容被误判为合法。"
id = "POC-AVE-2000-0918"
name = "CVE-2000-0974 PoC"
severity = "high"
tags = ["ave-2000-0918"]
vuln_id = [
    "CVE-2000-0974",
    "AVE-2000-0918",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
