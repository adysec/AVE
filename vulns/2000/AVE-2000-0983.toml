[basic]
description = "SuSE Linux 6.4 系统自带的 Apache 1.3.12 存在 Web 服务器源码泄露漏洞。由于默认配置中 CGI 脚本目录 /cgi-bin/ 与实际可执行脚本目录 /cgi-bin-sdb/ 的映射关系处理不当，未经身份认证的远程攻击者仅通过对 URL 路径进行简单替换，将请求中的 /cgi-bin/ 改为 /cgi-bin-sdb/，即可绕过 Apache 对 CGI 脚本的限制，直接读取 CGI 脚本的源代码。该漏洞属于目录别名配置错误导致的敏感信息泄露，攻击者无需任何认证即可利用，可获取服务器上 CGI 脚本的逻辑与源码，为进一步分析并实施攻击提供便利。该漏洞影响 SuSE Linux 6.4 及使用该默认 Apache 1.3.12 配置的版本，建议升级或修正 Apache 的脚本目录映射配置，并对不可信的 CGI 脚本访问请求实施拦截以降低泄露风险。"
published = "2000-11-14T05:00:00Z"
remediation = "建议将 SuSE Linux 6.4 的 Apache 升级至 1.3.12 以上的修复版本（SuSE 官方已修复该默认配置缺陷），或安装 SuSE 发布的相应安全更新。若无法立即升级，可编辑 Apache 主配置文件 /etc/httpd/httpd.conf，删除或注释掉将 cgi 目录映射为源码下载的别名定义（尤其针对用于调试的 /cgi-bin-sdb/ 别名），并确保 /cgi-bin/ 对应的 ScriptAlias 配置启用 ExecCGI 且不允许以普通静态文件方式访问脚本源码，从配置层面阻断攻击者通过改写 URL 读取 CGI 脚本内容。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "SuSE Linux Apache 读取源代码漏洞"
updated = "2026-06-16T21:52:38Z"

