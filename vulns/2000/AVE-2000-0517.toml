[basic]
description = "GAMSoft TelSrv telnet 服务器 1.5 及更早版本存在缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向服务器发送超长的用户名数据触发该漏洞，导致 telnet 服务进程崩溃，造成拒绝服务。该漏洞影响 Windows 95/98/NT/2000 等平台上的 GAMSoft TelSrv 服务，攻击成功后服务不可用，且 DoS 攻击后可能泄露用户名与密码信息。"
published = "2000-07-17T04:00:00Z"
remediation = "升级 GAMSoft TelSrv 至 1.5 以上版本，或在防火墙/边界网关限制对 Telnet 端口（23/TCP）的访问，仅允许可信 IP 连接。如无法升级，可在服务端配置中限制用户名输入长度，或直接停止使用该 Telnet 服务并替换为 OpenSSH 等安全替代方案。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "GAMSoft TelSrv 1.5 及更早版本远程拒绝服务漏洞"
updated = "2026-06-16T21:52:13Z"

