[basic]
description = "A1 HTTP server 1.0a 存在缓冲区溢出漏洞，远程攻击者可通过向目标服务器发送超长 HTTP 请求触发该漏洞，导致应用程序崩溃引发拒绝服务，并在特定条件下可能执行任意系统命令。该漏洞影响所有使用 A1 HTTP server 1.0a 版本的系统，攻击者无需任何身份认证，只需能够通过网络访问目标服务器的 HTTP 端口即可发起攻击。由于攻击复杂度低且利用条件宽松，该漏洞具有较高的安全风险，CVSS 评分 10.0，危害等级为严重。建议用户立即升级到安全版本或更换其他稳定的 HTTP 服务器软件以修复此漏洞。"
published = "2001-05-03T04:00:00Z"
remediation = "标签之间。<value>由于A1 HTTP server 1.0a存在严重的缓冲区溢出漏洞，远程攻击者可通过发送超长HTTP请求造成拒绝服务并可能执行任意命令。建议立即升级至A1 HTTP server官方发布的后续修正版本；如无更新版本，应迁移至其他维护中的HTTP服务器（如Apache、Nginx或lighttpd）。临时缓解措施包括：在防火墙或反向代理层限制HTTP请求头及URL长度不超过2048字节，禁用TRACK、TRACE等危险HTTP方法，并监控服务器异常进程行为。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "A1 HTTP Server 1.0a 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:54:01Z"

