[basic]
description = "Hosting Controller 1.x 的 dsnmanager.asp 页面存在目录遍历漏洞，远程攻击者可通过向 RootName 参数提交包含 `..`（点点）的恶意路径，绕过访问限制读取服务器上的任意文件与目录。该漏洞无需身份认证即可利用，攻击复杂度低，可导致敏感信息泄露。受影响版本为 Hosting Controller 1.x，管理员应及时升级或限制 dsnmanager.asp 的访问权限。"
published = "2002-08-12T04:00:00Z"
remediation = "立即升级 Hosting Controller 至 2.0 或更高版本（该版本已修复 dsnmanager.asp 的路径遍历问题）。如无法升级，在 IIS 中移除或限制 dsnmanager.asp 的匿名访问权限，仅允许受信管理 IP 访问 /DSNManager/ 目录，同时在 Web 应用防火墙（WAF）层面过滤包含 `../` 的 RootName 参数请求。"
score = 6.4
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Hosting Controller DSNManager 目录遍历漏洞"
updated = "2026-06-16T21:58:06Z"

