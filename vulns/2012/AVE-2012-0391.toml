[basic]
description = "Apple iOS 6.0 以下版本的 DHCP 客户端组件中，DNAv4 协议实现存在信息泄漏漏洞。当设备连接至未加密的 Wi-Fi 网络时，系统会在 DHCP 请求包中携带此前所连接网络的设备 MAC 地址信息。未经身份认证的远程攻击者通过在同一个未加密 Wi-Fi 网络范围内进行被动嗅探，即可捕获这些包含历史网络连接信息的 DHCP 数据包，从而获取设备曾经连接过的网络位置等敏感隐私信息。该漏洞影响所有运行 iOS 5.1.1 及更早版本的 iPhone、iPad 及 iPod touch 设备，攻击者无需获取任何认证凭据或交互权限，只要位于目标设备所在局域网即可实施信息窃取。Apple 已在 iOS 6.0 中修复此问题。"
published = "2012-09-20T21:55:03Z"
remediation = "建议立即将 Apple iOS 升级至 6.0 或更高版本，通过「设置」-「通用」-「软件更新」下载安装最新系统。如暂无法升级，应避免接入未加密的 Wi-Fi 网络，或在企业移动设备管理（MDM）中配置限制设备自动加入开放无线网络，以降低敏感信息泄露风险。"
score = 3.3
severity = "LOW"
sources = ["tenable"]
title = "Apple iOS DHCP 网络信息泄露漏洞"
updated = "2026-06-16T23:43:48Z"

