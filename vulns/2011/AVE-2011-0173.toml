[basic]
description = "libpng 库的 `png_decompress_chunk()` 函数中存在一个整数溢出漏洞（CWE-190）。当程序处理精心构造的恶意 PNG 图像文件时，由于对数据长度的截断处理不当，会导致整数溢出，从而触发内存损坏。该漏洞广泛影响使用了受影响 libpng 版本的软件，包括 Google Chrome（17.0.963.56 之前版本）以及 iOS 6.0 之前的设备。远程攻击者可通过诱导用户加载特制的图像文件，在无需身份验证的情况下触发该漏洞，导致应用程序崩溃（拒绝服务）或实现远程代码执行。"
published = "2012-02-16T20:55:04Z"
remediation = "建议将 libpng 库升级至 1.4.11 或更高版本。对于 Google Chrome 用户，请升级至 17.0.963.56 及以上版本；对于 Apple iOS 用户，请升级至 iOS 6.0 或更高版本以消除该整数溢出漏洞。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "libpng 图像处理库远程整数溢出漏洞"
updated = "2026-06-16T23:32:27Z"

