[basic]
description = "Adobe Flash Player 安装程序存在不可信搜索路径漏洞（CWE-426，又称二进制植入/DLL 预加载攻击）。当用户在 Windows、Mac OS X、Linux、Android 等平台安装或更新 Flash Player 时，安装程序会在当前目录及其他可写目录中搜索可执行文件，攻击者可预先在这些目录中放置特制的恶意程序（木马可执行文件），使安装程序在搜索路径时优先加载并执行该恶意文件，从而以当前用户权限获取系统控制权，实现权限提升或代码执行。该漏洞影响 Flash Player 10.3.183.20 及 11.x 之前的所有版本，以及 Adobe AIR 3.3.0.3610 之前的版本，覆盖桌面端和移动端多个操作系统平台。CVSS 评分 9.3，危害等级严重，攻击条件为攻击者需在目标系统拥有可写目录的访问权限，可通过社会工程诱导用户下载并运行包含恶意可执行文件的安装包或指向恶意目录的快捷方式触发漏洞利用。"
published = "2012-06-09T00:55:01Z"
remediation = "将 Adobe Flash Player 升级至 10.3.183.20（Windows/Mac/Linux）、11.3.300.257（Windows/Mac）、11.2.202.236（Linux）、11.1.111.10（Android 2.x/3.x）或 11.1.115.9（Android 4.x）；同时将 Adobe AIR 升级至 3.3.0.3610。如无法立即升级，请仅从 Adobe 官方渠道下载安装程序，并避免从网络共享目录或临时目录运行 Flash Player 安装程序。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 不可信搜索路径漏洞"
updated = "2026-06-16T23:40:50Z"

