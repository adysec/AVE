[basic]
description = "Zimbra Collaboration Suite 的 Autodiscover 服务存在 XML 外部实体注入（XXE）漏洞。未经身份认证的远程攻击者可通过向 Autodiscover/Autodiscover.xml 接口发送特制的 XML 请求，利用 XXE 漏洞读取服务器上的任意文件（如配置文件、敏感数据），并可进一步结合 SSRF 漏洞实现远程代码执行。该漏洞影响 Zimbra Collaboration Suite 8.7.x 系列 8.7.11p10 之前的所有版本，无需任何身份认证即可触发，危害严重。"
published = "2019-05-29T22:29:01.507"
remediation = "立即升级 Zimbra Collaboration Suite 至 8.7.11p10 或更高版本（8.8.x 用户升级至 8.8.15 及以上），该补丁已在 bug#109129 中修复 Autodiscover servlet 的 XXE 问题。如无法立即升级，可在反向代理层限制对 /Autodiscover/Autodiscover.xml 路径的外部访问，或禁用 XML 外部实体解析功能作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Synacor Zimbra Collaboration Suite XML外部实体注入漏洞"
updated = "2026-06-17T02:44:09.363"

