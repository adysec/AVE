[basic]
description = "Google Chrome 20.0.1132.43 之前版本中存在 SVG 绘图处理相关的释放后使用（Use-After-Free）漏洞。远程攻击者可构造特制的 SVG 图形内容，诱使用户通过 Chrome 浏览器访问包含该恶意 SVG 的网页，在渲染过程中触发已释放内存的访问，导致浏览器崩溃拒绝服务，或可能进一步实现任意代码执行。该漏洞影响范围广泛，攻击条件简单，仅需用户浏览恶意页面即可触发。"
published = "2012-06-27T10:18:39.087"
remediation = "升级 Google Chrome 至 20.0.1132.43 或更高版本，可通过 Chrome 内置自动更新或访问 google.com/chrome 下载安装。使用 Apple Safari 的用户应升级至 6.0.3 或更高版本，使用 iTunes 的用户应升级至 11.0.3 或更高版本，均可通过系统软件更新或 Apple 官网获取。如无法立即升级，可禁用 JavaScript 或使用内容安全策略（CSP）限制 SVG 渲染作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Google Chrome SVG 绘图释放后使用漏洞"
updated = "2026-06-16T23:42:10.137"

