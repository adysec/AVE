[basic]
description = "PostBoard 2.0 存在跨站脚本漏洞，影响 2.0.1 及更早版本。攻击者可通过两种方式在 BBS 论坛中执行恶意脚本：首先，当 BBCode 功能启用时，攻击者可使用 [IMG] 标签注入脚本代码；其次，在主题标题中也可以嵌入恶意脚本。通过这些攻击向量，入侵者可以劫持用户会话、窃取登录凭证或执行其他非法操作，严重威胁用户账号安全和数据隐私。该漏洞 CVSS 评分 5.0，攻击复杂度低，无需认证即可远程利用，属于中危级别。尽管当前影响范围相对有限，但随着社交媒体和论坛系统的广泛应用，此类 XSS 漏洞仍可能造成严重的安全风险，尤其当系统配置允许脚本执行时风险更高。攻击者通常通过构造恶意内容，利用用户对网站信任来实施攻击。"
published = "2002-07-03T04:00:00Z"
remediation = "建议立即停用 PostBoard 2.0.1 及更早版本，迁移至现代维护中的论坛系统（如 Discourse、phpBB 3.x、Flarum 等）。若必须继续使用，请立即在后台禁用 BBCode 功能（特别是 [IMG] 标签），并在发帖标题处增加严格的 HTML 实体转义与长度限制；同时在 Web 应用防火墙（WAF）层面部署 XSS 防护规则，拦截包含 <script>、onerror、onload 等特征的请求；建议尽快完成系统迁移，彻底消除该遗留漏洞风险。更新至现代论坛系统最新稳定版，并启用 CSP 策略与 HttpOnly Cookie 防护。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "PostBoard PostBoard 2.0 跨站脚本攻击漏洞"
