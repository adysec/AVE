[basic]
description = "Gnome-lokkit 防火墙软件 0.41 之前版本存在安全绕过漏洞，由于未能正确限制对某些端口的访问权限，即使未开放任何服务，攻击者仍可远程访问这些端口。攻击者无需身份认证即可通过网络远程利用该漏洞，导致机密性、完整性和可用性部分受损，CVSS 评分 7.5，危害等级高。"
published = "2000-10-20T04:00:00.000"
remediation = "升级 gnome-lokkit 至 0.41 或更高版本。如无法立即升级，可在系统层面使用 iptables 手动配置防火墙规则，限制不必要的端口访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "GNOME gnome-lokkit 防火墙端口访问限制安全绕过漏洞"
updated = "2026-06-16T21:52:29.440"

