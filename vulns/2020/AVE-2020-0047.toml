[basic]
description = "SuperWebMailer 7.21.0.01526 的 mailingupgrade.php 脚本中 Language 参数存在代码注入漏洞，未经身份认证的远程攻击者可利用该参数向服务器注入并执行任意 PHP 代码，从而实现远程代码执行。该漏洞影响 SuperWebMailer 7.21.0.01526 及更早版本，攻击者无需登录凭据，仅需向目标站点发送特制的 HTTP 请求即可触发漏洞，完全控制服务器。CVSS 评分为 9.8，危害等级严重。"
published = "2020-07-14T20:15:11Z"
remediation = "立即升级 SuperWebMailer 至 7.40.0.01550 或更高版本，该版本已修复 mailingupgrade.php 中 Language 参数的代码注入漏洞。升级路径：登录厂商客户区下载最新安装包，覆盖现有文件后运行在线更新或重新上传安装。若无法立即升级，可在 Web 服务器层（如 Apache/Nginx）通过 rewrite 规则或防火墙拦截对 mailingupgrade.php 的访问，或临时禁用该脚本的执行权限作为缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "SuperWebMailer SuperWebMailer 代码注入漏洞"
updated = "2026-06-17T02:50:22Z"

