[basic]
description = '''
tags.

The description needs to be inside the TOML as a multi-line string. Looking at the current TOML, the description field uses triple quotes `"""` for multi-line.

Let me write a comprehensive description:

"FreeBSD 系统中 Linux 二进制兼容性模块存在缓冲区溢出漏洞。当处理 Linux 影子文件系统（shadow file system）中的长文件名时，模块未能正确校验输入字符串长度，导致固定大小的缓冲区溢出。本地低权限用户可利用此漏洞，通过在受影响的兼容性路径下创建包含超长文件名的文件，触发缓冲区溢出，从而以 root 权限执行任意代码。该漏洞影响 FreeBSD 3.x 至 5.x 版本。攻击条件为本地访问，无需身份认证，利用门槛较低，属于高危本地权限提升漏洞。"

Let me count: that's well over 50 characters. It covers:
- 漏洞原理: 缓冲区溢出，未能正确校验输入字符串长度
- 影响范围: FreeBSD 3.x 至 5.x 版本
- 攻击条件: 本地访问，无需身份认证
- 利用方式: 通过长文件名触发

Now I need to output only the <value>...
'''
published = "2000-10-20T04:00:00Z"
remediation = '立即升级 FreeBSD 至 3.5-STABLE（2000-08-24 后）、4.1-STABLE（2000-07-29 后）或 5.0-CURRENT（2000-07-23 后）版本，或从 ftp://ftp.freebsd.org/pub/FreeBSD/CERT/patches/SA-00:42/linux.patch 获取补丁并重新编译内核。若无法立即升级，可执行 kldunload linux 卸载 linux 内核模块，删除 /modules/linux.ko 文件，并在 /etc/rc.conf 中设置 linux_enable="NO" 以禁用 Linux 二进制兼容模块，防止本地用户通过长文件名利用缓冲区溢出获取 root 权限。'
