[basic]
description = "Savon 是一个 Ruby 语言的 SOAP 客户端库，其 Savon::Model 模块在调用 .all_operations 方法时，会将 WSDL 中的操作名称直接拼接为 Ruby 源代码字符串并传递给 module_eval 执行。远程攻击者若能控制 WSDL 文档中的操作名称，即可注入恶意 Ruby 代码，在应用程序进程中实现任意代码执行。该漏洞影响 Savon 0.9.8 至 2.17.2 版本，CVSS 评分 8.1，危害等级高。攻击者无需身份认证，但需要诱使目标应用解析包含恶意操作名称的 WSDL 文档。官方已在 Savon 2.17.2 版本中修复此漏洞。"
published = "2026-07-31T20:16:51Z"
remediation = "立即将 savon gem 升级至 2.17.2 或更高版本：在 Gemfile 中执行 `gem 'savon', '>= 2.17.2'` 后运行 `bundle update savon`。如无法立即升级，避免对不可信 WSDL 文档使用 `.all_operations` 方法，改用 `.operations` 并仅传入受信任的操作名称列表。"
score = 8.1
severity = "HIGH"
sources = ["ghsa"]
title = "Savon Ruby SOAP 客户端远程代码执行漏洞"
updated = "2026-07-31T20:16:51Z"

