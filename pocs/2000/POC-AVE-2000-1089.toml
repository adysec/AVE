[info]
author = "ave"
description = "验证 Midnight Commander cons.saver 符号链接文件损坏漏洞：本地攻击者创建指向目标文件的符号链接，将该链接作为 TTY 参数传递给 mc，cons.saver 未验证文件描述符是否为 TTY，导致写入操作重定向至目标文件造成数据损坏。"
id = "POC-AVE-2000-1089"
name = "CVE-2000-1108 PoC"
severity = "medium"
tags = ["ave-2000-1089"]
vuln_id = [
    "CVE-2000-1108",
    "AVE-2000-1089",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
