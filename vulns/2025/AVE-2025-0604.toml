[basic]
description = "tags.<value>libcurl 在进行基于 SSH 的 SCP 或 SFTP 文件传输时，若应用程序指定了 known_hosts 文件进行主机验证，libcurl 仍可能错误地接受连接不在该指定文件中的主机——前提是这些主机已被添加到 libssh 的全局 known_hosts 文件中。该漏洞存在于使用 libssh 后端（而非 libssh2）构建的 libcurl 版本中，根本原因在于 libssh 的 API 会在未找到指定主机时自动回退到内置的全局 known_hosts 文件进行验证。攻击者需满足高交互攻击条件，在用户发起 SSH 传输操作且全局 known_hosts 文件被攻击者预先污染的情况下，可实现对主机的欺骗性连接，从而绕过主机身份验证机制，存在中间人攻击风险。curl 官方已在 8.18.0 版本中修复此问题。"
published = "2026-01-08T10:15:47Z"
remediation = "建议立即将 curl 升级至 8.18.0 或更高版本，curl 8.18.0 修复了 libssh 后端在 SSH 文件传输时未正确验证 known_hosts 文件的问题。如无法立即升级，可将 curl 编译配置切换为使用 libssh2 后端替代 libssh 后端，或暂时避免使用 SCP 和 SFTP 协议。受影响版本为 curl 7.58.0 至 8.17.0，curl 8.18.0 已引入修复 commit adca486c125d9a6d9565b9607a19dce803。"
score = 5.3
severity = "MEDIUM"
sources = ["msrc"]
title = "curl libssh 全局 known_hosts 绕过漏洞"
updated = "2026-06-17T08:37:03Z"

