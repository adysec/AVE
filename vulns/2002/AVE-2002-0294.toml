[basic]
description = "Microsoft IIS 4.0/5.0/5.1 版本在处理身份认证请求时存在信息泄露漏洞。漏洞原理为服务器在响应认证请求时，会在特定配置下通过 Basic 认证的 realm 字段泄露被 NAT 掩盖的服务器真实 IP 地址，或在 NTLM 认证响应中泄露服务器的 NetBIOS 名称及 Windows NT 域信息。远程攻击者无需身份认证，通过发送特制的认证请求即可触发该漏洞，从而获取目标系统的敏感网络配置信息，为后续的内网渗透或暴力破解提供关键线索。"
published = "2002-08-12T04:00:00Z"
remediation = "建议将 IIS 4.0/5.0/5.1 升级至 Windows Server 2003 或更高版本的 IIS 6.0 及以上版本。若无法升级，可通过配置反向代理服务器（如 Nginx/Apache）拦截并删除响应头中的敏感 Realm 信息，或在防火墙层面限制对管理接口的访问以缓解信息泄露风险。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft IIS 4.0/5.0/5.1 身份认证方法信息泄漏漏洞"
updated = "2026-06-16T21:57:24Z"

