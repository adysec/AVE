[basic]
description = "@astrojs/rss 组件中存在 XML 注入漏洞，由于 source.title 和 enclosure.type 字段在拼接 XML 模板字符串时未进行 XML 字符转义处理，直接交由 fast-xml-parser 解析。攻击者若能够控制 RSSFeedItem 中的这两个字段值（例如通过 CMS、数据库或用户提交内容），可注入任意 XML 元素到生成的 RSS 源中，包括伪造的 <link> 指向恶意 URL，破坏源结构并导致订阅者解析到攻击者控制的内容。在 SSR 模式下，被污染的 RSS 源会在每次请求时返回给所有订阅者。该漏洞影响 @astrojs/rss 1.0.0 至 4.0.18 版本，已在 4.0.19 版本中修复。"
published = "2026-07-27T21:17:05.700"
remediation = '升级 @astrojs/rss 至 4.0.19 或更高版本：在项目根目录执行 `npm install @astrojs/rss@^4.0.19`。如无法立即升级，可在生成 RSSFeedItem 时对 `source.title` 和 `enclosure.type` 字段进行 XML 转义（如将 `<` 替换为 `&lt;`、`"` 替换为 `&quot;`），或避免使用用户可控数据填充这两个字段。'
score = 4.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Astro @astrojs/rss XML注入漏洞"
updated = "2026-07-28T16:17:16.127"

