[basic]
description = "Windows Core Messaging 组件存在不受信任指针解引用漏洞（CWE-822），由于对用户态传入的指针参数缺乏有效验证，导致攻击者可利用该漏洞在内核上下文中解引用任意内存地址。已获得低权限的本地攻击者可通过向受影响系统发送特制的 Core Messaging 消息触发此漏洞，实现权限提升至 SYSTEM 级别，从而完全控制目标系统。该漏洞影响 Windows 10/11 及 Windows Server 2019/2022 等多个版本，CVSS 评分 7.8，危害等级高。Microsoft 已在 2025 年 2 月安全更新（KB5051974）中修复此漏洞。"
published = "2025-02-11T18:15:34Z"
remediation = "立即安装 Microsoft 2025 年 2 月安全更新 KB5051974（适用于 Windows 10 22H2/21H2，OS Builds 19044.5487 和 19045.5487）或对应 Windows Server 版本的更新 KB5052000（OS Build 17763.6893）。可通过 Windows Update 自动获取更新。该漏洞需本地低权限用户交互触发，建议同时遵循最小权限原则，限制非管理员用户的本地登录权限以降低攻击面。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Core Messaging 特权提升漏洞"
updated = "2026-06-17T08:43:11Z"

