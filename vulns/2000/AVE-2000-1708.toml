[basic]
description = "NetBSD 系统上 Global 3.55 及早期版本的 global.cgi CGI 程序存在命令注入漏洞，由于对用户输入的 shell 元字符过滤不当，远程未认证攻击者可通过向 CGI 程序提交包含 shell 元字符的恶意参数，在目标系统上以 Web 服务器权限执行任意系统命令。该漏洞影响运行 Global 3.55 及更早版本的 NetBSD 系统，CVSS 评分 10.0（严重），攻击向量为网络、攻击复杂度低、无需身份认证，可导致系统完全失陷（机密性、完整性、可用性均完全丧失）。攻击者无需认证即可远程发送构造的恶意请求触发漏洞，获取服务器控制权。官方已停止维护 Global 旧版本，建议升级至最新版本或迁移至替代方案。"
published = "2000-12-19T05:00:00.000"
remediation = "建议立即升级 NetBSD 至 1.5 版本或更高版本，或升级 global 至 3.56 及以上版本。若无法立即升级，请立即禁用或删除 /cgi-bin/global.cgi 文件，或在 Web 服务器配置中禁用 CGI 执行权限作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "NetBSD Global Web服务器 CGI代码执行漏洞"
updated = "2026-06-16T21:52:50.543"

