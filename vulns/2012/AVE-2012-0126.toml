[basic]
description = "Apple iTunes 10.6 之前版本中集成的 WebKit 组件存在内存破坏漏洞，攻击者可通过中间人攻击方式在用户浏览 iTunes Store 时向目标系统发送特制数据触发该漏洞，导致远程代码执行或应用程序崩溃。该漏洞影响 Apple Safari 5.1.4 之前版本及 iTunes 10.6 之前版本，CVSS 评分 7.6，危害等级高。攻击者需要能够拦截并篡改用户与 iTunes Store 之间的网络通信，利用难度较高。Apple 已在 2012 年 3 月发布安全更新修复此漏洞。"
published = "2012-03-08T22:55:03Z"
remediation = "升级 Apple iTunes 至 10.6 或更高版本，同时升级 Safari 至 5.1.4 或更高版本。可通过 Apple Software Update 自动更新，或访问 Apple 官网下载安装最新版本。如无法立即更新，建议在网络层面限制对 iTunes Store 的中间人攻击路径作为临时缓解措施。"
score = 7.6
severity = "HIGH"
sources = ["tenable"]
title = "Apple iTunes WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:59Z"

