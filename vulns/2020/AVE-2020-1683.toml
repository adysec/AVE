[basic]
description = "Amcrest 网络摄像头及 NVR 设备在 TCP 37777 端口存在栈缓冲区溢出漏洞。经过身份验证的远程攻击者可向该端口发送特制数据包，触发缓冲区溢出，导致设备拒绝服务或执行任意代码。影响 Amcrest 及兼容 Dahua 协议的 NVR 设备。攻击者需先获得有效凭据才能利用此漏洞，利用后可能完全控制设备并进一步渗透内网。"
published = "2020-04-08T13:15:13.003"
remediation = "立即将受影响设备固件升级至安全版本：IP2M-841升级至v2.420.AC00.18.R.20200217或更高版本，IP2M-841B/IP2M-853EW/IP2M-858W/IP2M-866EW/IP2M-866W/IP4M-1053EW/1080-Lite 8CH升级至v2.623.00AC004.0.R.200316或更高版本，IP8M-2454EW/IP8M-2493EB/IP8M-2496EB/IP8M-MB2546EW/IP8M-MT2544EW/IP8M-T2499EW升级至v2.622.00AC000.0.R.200320或更高版本，IP8M-2597E升级至v2.800.00AC000.0.R.200330或更高版本，IPM-721/IPM-HX1/AMDV10814-H5升级至v2.420.AC00.18.R.20200217或更高版本。如无法立即升级，应在边界防火墙或路由器上限制TCP 37777端口的访问，仅允许可信管理网段IP地址访问该端口，以降低被远程利用的风险。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Amcrest 摄像头及NVR 堆栈缓冲区溢出漏洞"
updated = "2026-06-17T03:22:08.417"

