[basic]
description = "Gaim 0.59.1 之前的版本在帮助文档浏览器的 URL 处理机制中存在输入验证缺陷，未能有效过滤 shell 元字符。远程攻击者可通过构建包含恶意 shell 元字符的特制链接，诱导用户点击，从而在受害者系统中执行任意脚本或命令。该漏洞影响所有安装了受影响版本 Gaim 的客户端，攻击者无需身份认证即可通过社交工程手段触发，可导致受害主机的系统权限被非法获取或执行恶意指令。"
published = "2002-09-24T04:00:00Z"
remediation = "建议立即将 Gaim 客户端升级至 0.59.1 或更高版本，以修复 URL 处理程序中对 shell 元字符过滤不严导致的远程代码执行漏洞。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Gaim 聊天客户端 URL 处理任意脚本执行漏洞"
updated = "2026-06-16T21:58:31Z"

