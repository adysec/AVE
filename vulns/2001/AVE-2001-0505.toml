[basic]
description = "Ipswitch IMail 7.04 及更早版本中的 Web Calendar 组件存在缓冲区溢出漏洞。远程攻击者可通过向目标系统发送特制的超长 HTTP GET 请求触发该漏洞，导致缓冲区溢出，进而实现任意代码执行。该漏洞无需身份认证，攻击复杂度低，CVSS 评分 7.5，危害等级高。成功利用后可完全控制受影响系统，造成敏感信息泄露、系统破坏或进一步横向移动。"
published = "2001-10-12T04:00:00Z"
remediation = "升级 Ipswitch IMail 至 7.04 之后的版本，该漏洞在 Web Calendar 组件中通过超长 HTTP GET 请求触发缓冲区溢出，导致远程代码执行。由于该产品已停止维护，建议迁移至受支持的邮件服务器软件（如 Exchange、Postfix 等），并在防火墙层面限制对 Web Calendar 端口的访问作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Ipswitch IMail Web Calendar 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:55:58Z"

