[basic]
description = "CVE-2000-1072是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2000-12-11T05:00:00Z"
remediation = "建议升级至 iPlanet Calendar Server 5.0，或联系 iPlanet 支持渠道获取 iCS 2.1 Patch-04 Hotfix 补丁以修复此问题。如暂时无法安装补丁，应立即执行以下临时缓解措施：将 /opt/SUNWicsrv/cal/bin/ 目录及其下所有文件的所有者更改为 root（chown root:root /opt/SUNWicsrv/cal/bin/*），移除 iplncal.sh 脚本的世界可写权限（chmod o-w /opt/SUNWicsrv/cal/bin/iplncal.sh），确保该文件权限为仅 root 可写可执行，防止普通用户替换为木马程序。"
score = 7.2
severity = "HIGH"
