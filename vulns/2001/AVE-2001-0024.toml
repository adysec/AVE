[basic]
description = "BitchX IRC 客户端 1.0 c17 版本存在 DNS 缓冲区溢出漏洞。远程攻击者可通过向目标用户发送一个指向超长 DNS 主机名或域名的 IP 地址，当 BitchX 客户端解析该 DNS 响应时触发缓冲区溢出，导致拒绝服务，甚至可能执行任意代码。该漏洞无需身份认证即可远程利用，CVSS 评分 10.0，危害等级严重。目前已有公开的利用代码（ExploitDB ID: 20490）。"
published = "2001-02-16T05:00:00Z"
remediation = "升级 BitchX IRC 客户端至 1.0c18 或更高版本。各发行版用户请安装对应补丁：FreeBSD 安装 FreeBSD-SA-00:78 安全公告中的更新；Red Hat Linux 用户安装 RHSA-2000:126 提供的更新包；Mandrake Linux 用户安装 MDKSA-2000:079 更新。临时缓解措施：使用受信任的 DNS 服务器，避免连接不可信的 IRC 网络。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "BitchX IRC客户端DNS缓冲区溢出漏洞"
updated = "2026-06-16T21:53:33Z"

