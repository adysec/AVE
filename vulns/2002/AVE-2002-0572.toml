[basic]
description = "Melange Chat System 1.10 在 chat_InterpretData 函数中存在缓冲区溢出漏洞，远程攻击者可通过发送超长昵称（Nick）请求触发该漏洞，导致聊天服务器崩溃或执行任意代码。该漏洞源于 msgText 缓冲区未对输入长度进行充分校验，攻击者无需身份认证即可利用，利用条件简单。受影响的 Melange Chat Server 1.10 版本极易遭受拒绝服务攻击，在特定条件下也可能导致远程代码执行。建议升级至官方修复版本或关闭不必要的聊天服务端口以降低风险。"
published = "2002-12-24T05:00:00Z"
remediation = "由于 Melange Chat Server 1.10 官方已停止维护且未发布补丁，建议立即将该聊天服务替换为仍在持续更新的替代产品（如 Mattermost、Rocket.Chat 或 Zulip）。如短期内无法完成替换，应在防火墙上严格限制 6666 端口的访问来源，仅允许可信内部 IP 段连接，并在不必要时完全关闭该服务以消除攻击面。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Melange Chat Server 1.10 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:59:09Z"

