[basic]
description = "Oracle 8.1.5 数据库组件中存在缓冲区溢出漏洞，涉及 names、tnslsnr、tnsping 等多个应用程序。本地攻击者可通过设置超长 ORACLE_HOME 环境变量触发缓冲区溢出，导致权限提升，获取目标系统的敏感信息读取、数据修改或执行任意代码的能力。该漏洞攻击复杂度低，无需身份认证即可利用，影响 Oracle 8.1.5 系列版本。"
published = "2000-12-19T05:00:00Z"
remediation = "升级至 Oracle 8.1.6 或更高版本，该漏洞已在后续版本中修复。如无法升级，限制仅授权用户可登录数据库服务器，并通过系统层环境变量过滤机制（如使用 wrappers 脚本）对 ORACLE_HOME 变量长度进行校验，超过 256 字符时截断或拒绝执行。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Oracle Oracle8i 缓冲区溢出本地权限提升漏洞"
updated = "2026-06-16T21:52:54Z"

