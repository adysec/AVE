[basic]
description = "WordPress bws-testimonials 插件（版本 0.1.9 之前）存在多个跨站脚本（XSS）漏洞。该漏洞源于插件对用户输入的数据未进行充分的过滤与转义处理，攻击者可通过向受影响页面提交特制的恶意脚本载荷，当管理员或其他用户访问包含恶意内容的页面时，脚本将在浏览器中执行，导致敏感信息泄露（如会话令牌、Cookie 等）或页面内容篡改。攻击者无需身份认证即可发起攻击，但需要用户交互（如点击链接），影响范围涉及 WordPress 站点中使用了该插件的环境。"
published = "2019-08-21T13:15:11Z"
remediation = "升级 WordPress bws-testimonials 插件至 0.1.9 或更高版本。在 WordPress 后台仪表盘 → 插件 → 已安装插件中找到 bws-testimonials，点击「更新」按钮完成升级。如无法更新，可暂时停用该插件作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress bws-testimonials插件跨站脚本漏洞"
updated = "2026-06-17T01:13:05Z"

