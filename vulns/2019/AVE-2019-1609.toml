[basic]
description = "Kibana 的 Timelion 可视化组件中存在原型链污染导致的任意代码执行漏洞。攻击者在登录 Kibana 后，可通过向 Timelion 应用发送特制的请求，利用 JavaScript 原型链污染机制注入恶意代码，最终在服务器端以 Kibana 进程权限执行任意命令。该漏洞影响 Kibana 5.6.15 之前版本及 6.6.1 之前版本，CVSS 评分 10.0，危害等级严重。Elastic 官方已在 6.6.1 和 5.6.15 版本中修复此漏洞。"
published = "2019-03-25T19:29:02Z"
remediation = "立即升级 Kibana 至 6.6.1 或 5.6.15 及以上版本。如无法立即升级，在 kibana.yml 中将 timelion.enabled 设为 false 以禁用 Timelion 可视化功能，同时通过防火墙/WAF 限制对 Kibana 端口的非授权访问作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["kev"]
title = "Elastic Kibana Timelion 任意代码执行漏洞"
updated = "2026-06-17T02:40:45Z"

