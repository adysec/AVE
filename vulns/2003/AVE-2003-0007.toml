[basic]
description = "rxvt 终端模拟器 2.7.8 版本的 menuBar 功能存在命令注入漏洞。攻击者可通过向使用 menuBar 的 rxvt 会话发送特定字符转义序列，将恶意命令注入到菜单选项中，当用户点击被篡改的菜单项或终端处理该转义序列时，即可执行任意系统命令。该漏洞影响所有运行受影响版本 rxvt 的系统，攻击者无需身份认证即可通过网络远程利用，利用复杂度低。CVSS 评分 5.0，影响范围为完整性破坏，可能导致攻击者在目标系统上获得与终端用户相当的执行权限。"
published = "2003-03-03T05:00:00Z"
remediation = "建议升级 rxvt 至 2.7.9 或更高版本（已修复该转义序列注入问题）。若无法立即升级，可通过编译选项 `--disable-menubar` 禁用菜单栏功能，或在启动参数中添加 `-mb` 禁用菜单栏作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "rxvt 菜单栏转义序列命令执行漏洞"
updated = "2026-06-16T22:01:21Z"

