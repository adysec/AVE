[basic]
description = 'ProFTPD 1.2.1 及其他版本（包括 WU-FTPD 2.4/2.5/2.6、Trolltech ftpd 1.2、BeroFTPD 1.3.4）的 glob 通配符扩展功能存在拒绝服务漏洞。远程未经认证的攻击者可通过向 FTP 服务器发送包含大量通配符及特殊字符的 ls 命令（如构造多个 "*/.."、"*/.*" 或 ".*./*?/" 序列），触发服务器过度消耗 CPU 和内存资源，导致服务崩溃或无法响应正常请求。该漏洞无需身份认证即可远程利用，影响范围广泛。'
published = "2001-12-31T05:00:00Z"
remediation = "升级 ProFTPD 至 1.2.5 及以上版本（1.2.5rc1 已修复该漏洞）；WU-FTPD 升级至 2.6.2 以上，BeroFTPD 升级至 1.3.5 以上。在 proftpd.conf 中设置 MaxClients 和 MaxInstances 限制并发连接数，并限制匿名用户的目录遍历权限以降低攻击面。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "ProFTPD 1.2.1 glob 通配符拒绝服务漏洞"
updated = "2026-06-16T21:56:23Z"

