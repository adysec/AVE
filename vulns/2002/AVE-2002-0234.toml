[basic]
description = "Arescom NetDSL 1000 路由器 Telnet 服务存在远程拒绝服务漏洞，攻击者可通过向 Telnet 端口发送包含超长字符串的连接请求序列，导致大量登录失败并耗尽服务资源，最终导致 Telnet 服务停止响应。该漏洞影响 Arescom NetDSL 1000 路由器，CVSS 评分 5.0（中等危害），攻击向量为网络远程、攻击复杂度低、无需身份认证，仅影响可用性（可用性影响：部分）。攻击者无需身份认证即可远程发起攻击，通过发送大量包含超长字符串的 Telnet 连接请求触发漏洞，导致设备 Telnet 服务停止响应，造成拒绝服务。ExploitDB 已公开 PoC 代码（EDB-ID: 1464），攻击者可利用该 PoC 直接发起攻击。Arescom 官方已停止对此设备提供支持，建议用户升级固件或更换设备，或通过防火墙限制 Telnet 端口访问。"
published = "2002-05-29T04:00:00Z"
remediation = "建议立即升级 AcomNetDSL-1000 路由器固件至支持安全补丁的版本（如 V1.2.3 及以上），或通过官方升级工具进行手动升级。如无法立即升级，可通过路由.admin 禁用 Telnet 服务或在防火墙规则中限制 Telnet 端口 23 的访问频次作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Arescom NetDSL 1000 Telnet 服务远程拒绝服务漏洞"
updated = "2026-06-16T21:57:05Z"

