[basic]
description = "Microsoft SQL Server 2000 的 SQLXML ISAPI 扩展存在缓冲区溢出漏洞，远程攻击者可通过向目标服务器发送特制的 HTTP 请求，在 content-type 参数中传入超长字符串触发缓冲区溢出，导致任意代码执行。该漏洞影响 Microsoft SQL Server 2000 默认安装版本，攻击者无需身份认证即可远程利用，CVSS 评分 7.5，危害等级高危。Microsoft 已在安全公告 MS02-039 中发布补丁修复此漏洞。"
published = "2002-07-03T04:00:00Z"
remediation = "立即安装 Microsoft 安全公告 MS02-039 提供的 SQL Server 2000 安全更新补丁。如无法安装补丁，可在 IIS 中移除 SQLXML ISAPI 扩展映射（删除 .xml 扩展名到 sqlxml.dll 的映射），或限制 IIS 中 SQLXML 虚拟目录的访问权限仅允许受信 IP 地址。鉴于 SQL Server 2000 已停止支持，建议升级至 SQL Server 2019 或更高版本以获得持续安全更新。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Microsoft SQL Server 2000 SQLXML ISAPI 扩展缓冲区溢出漏洞"
updated = "2026-06-16T21:56:57Z"

