[basic]
description = "Open WebUI 在配置 Redis 的情况下，其实时通信端点（Socket.IO 连接/用户加入/频道加入/笔记加入及终端 WebSocket）在认证时仅调用 decode_token 验证 JWT 签名和过期时间，未执行 Redis 中的撤销检查（is_valid_token），导致用户注销或 OIDC 反向通道注销后已撤销的 JWT 仍可建立新的实时连接。攻击者可利用已泄露但已撤销的令牌继续访问受害者的实时频道消息、协作笔记更新及终端会话，造成敏感信息泄露和会话劫持风险。该漏洞影响 Open WebUI >=0.9.0 且 <0.10.0 且配置 Redis 的版本，已在 v0.10.0 中修复。"
published = "2026-07-09T17:17:02Z"
remediation = "升级 Open WebUI 至 v0.10.0 或更高版本，该版本在 Socket.IO 连接和终端 WebSocket 认证中增加了 Redis 撤销令牌检查。如无法立即升级，可临时禁用 Redis 的 JWT 撤销功能或限制实时 WebSocket 端点的网络访问作为缓解措施。"
score = 7.1
severity = "HIGH"
sources = ["ghsa"]
title = "Open WebUI 实时端点 JWT 撤销验证缺失漏洞"
updated = "2026-07-10T18:17:21Z"

