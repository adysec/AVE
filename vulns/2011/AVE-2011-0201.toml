[basic]
description = "Google Chrome 18.0.1025.151 之前版本的级联样式表（CSS）实现中存在使用后释放（Use-after-free）漏洞，具体位于行框（line boxes）的处理逻辑中。远程攻击者可通过构造恶意网页，诱导用户访问触发 CSS 行框处理时的内存错误引用，导致浏览器崩溃造成拒绝服务，或可能进一步实现任意代码执行。该漏洞影响所有未更新至 18.0.1025.151 版本的 Chrome 浏览器，攻击向量为网络远程，攻击复杂度中等，无需身份认证即可利用。CVSS v2 评分 6.8（AV:N/AC:M/Au:N/C:P/I:P/A:P），属于中高危漏洞。"
published = "2012-04-05T22:02:07Z"
remediation = '建议立即将 Google Chrome 升级至 18.0.1025.151 或更高版本。可通过 Chrome 菜单选择"帮助"→"关于 Google Chrome"触发自动更新，或从官网 https://www.google.com/chrome/ 下载最新安装包手动升级。若暂时无法升级，可在浏览器设置中禁用 JavaScript 作为临时缓解措施，但会影响网页功能。'
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome CSS 使用后释放漏洞"
updated = "2026-06-16T23:32:34Z"

