[basic]
description = 'tags.<value>Winsock FTPd（WFTPD）3.00 和 2.41 版本中存在目录遍历漏洞。当启用"限制在主目录"选项时，本地用户仍可通过发送包含 "/../" 字符串的请求，利用点号（..）攻击变体逃逸出主目录，从而访问受限目录外的文件。该漏洞影响 WFTPD 3.00 及 2.41 版本，CVSS 评分为 5.0，危害等级中等。攻击条件为攻击者需具备本地访问权限，利用方式为构造包含路径遍历序列的请求。'
published = "2001-01-09T05:00:00.000"
remediation = '立即将 Winsock FTPd (WFTPD) 升级至厂商发布的最新修复版本（WFTPD 3.01 或更高），该版本已修复目录遍历漏洞。若无法获取升级包，请在配置文件中禁用 "Restrict to home directory" 选项，并通过操作系统级 chroot 机制或 mount --bind 将 FTP 根目录限制在独立文件系统内，同时以最小权限账户运行 WFTPD 服务，禁止本地用户通过 /../ 路径逃逸到主目录之外。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Winsock WFTPD 目录遍历漏洞"
updated = "2026-06-16T21:53:08.937"

