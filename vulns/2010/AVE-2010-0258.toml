[basic]
description = "OpenOffice.org（OOo）Impress 组件中存在堆缓冲区溢出漏洞，源于对 PNG 文件处理时未正确校验数据边界。远程攻击者可通过构造特制的 PNG 图像嵌入 ODF 或 Microsoft Office 文档（如 PPT 文件）中，诱使目标用户打开恶意文档触发堆缓冲区溢出，导致应用程序崩溃或执行任意代码。该漏洞影响 OpenOffice.org 2.x 及 3.x 系列 3.3 之前的所有版本，CVSS 评分 9.3，危害严重。"
published = "2011-01-28T22:00:05Z"
remediation = "升级 OpenOffice.org 至 3.3 或更高版本，该版本修复了 Impress 解析 PNG 文件时的堆缓冲区溢出漏洞。如无法立即升级，可在系统层面部署入侵检测规则拦截包含畸形 PNG 的 ODF/PPT 文档，并限制用户仅打开可信来源的文档文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apache OpenOffice Impress PNG文件解析堆缓冲区溢出漏洞"
updated = "2026-06-16T23:24:26Z"

