[basic]
description = "Linux 内核 Qualcomm GCC SM6350 时钟驱动中存在空指针解引用漏洞，由于 clk_rcg2 结构体在定义了 parent 后未同步定义 parent_map，导致调用 clk_set_rate 时 qcom_find_src_index 函数访问空指针引发内核崩溃。本地低权限攻击者可利用此漏洞触发拒绝服务。CVSS 评分 5.5，危害等级中等。"
published = "2025-03-06T17:15:20Z"
remediation = "升级 Linux 内核至 5.15.179、6.1.129、6.6.78、6.12.14、6.13.3 或 6.14 及以上版本，或从 kernel.org 合入修复 commit 08b77ed7cfaac（主线）及对应稳定分支补丁。Debian 用户安装 DLA-4102-1 更新，Ubuntu 用户安装 USN-7511-1/USN-7510-1 更新。如无法立即升级，可限制本地低权限用户对时钟设备的访问作为临时缓解。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Qualcomm Linux 内核 SM6350 GCC 时钟驱动空指针解引用漏洞"
updated = "2026-06-17T08:14:34Z"

