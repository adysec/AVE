[basic]
description = "CVE-2000-0515是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2000-06-07T04:00:00Z"
remediation = "将 /etc/SnmpAgent.d/snmpd.conf 文件权限从世界可写修改为仅管理员可写，执行 chmod 600 /etc/SnmpAgent.d/snmpd.conf。同时修正 /etc/SnmpAgent.d/ 目录权限（该目录为 777 模式），执行 chmod 750 /etc/SnmpAgent.d/。将 snmpd 进程以非 root 用户（如 snmpd 用户）身份运行，避免以 root 权限启动。升级至 HP-UX 11.0 的最新安全补丁版本，HP 官方已发布针对此文件权限问题的安全修复。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "惠普 HP-UX SNMPD 文件权限漏洞"
updated = "2026-06-16T21:51:54Z"

