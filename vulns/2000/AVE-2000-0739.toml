[basic]
description = "LPRng 3.6.x 版本中 lpd 守护进程被错误地设置为 setuid root 权限，导致本地用户可利用该配置缺陷向 lpd 的跟踪和日志文件中追加任意内容。攻击者需要拥有本地系统访问权限，通过精心构造的日志追加操作可能干扰系统正常日志记录或掩盖恶意行为痕迹。该漏洞影响 LPRng 3.6.x 系列版本，CVSS 评分 2.1，危害等级低，建议升级至不受影响的版本。"
published = "2000-07-19T04:00:00Z"
remediation = "立即移除 lpd 二进制文件的 setuid root 权限：执行 `chmod u-s $(which lpd)` 取消 SUID 位，防止本地用户以 root 权限追加日志。升级 LPRng 至 3.7 及以上版本，该版本已修复默认以 setuid root 安装的问题。如无法升级，通过文件权限控制限制 lpd 仅允许 lp 组用户执行。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "LPRng lpd 本地信息泄露漏洞"
updated = "2026-06-16T21:52:06Z"

