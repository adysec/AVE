[basic]
description = "Apple iOS 5.1 之前版本及 iTunes 10.6 之前版本中使用的 WebKit 存在未明内存破坏漏洞（CWE-119）。远程攻击者可通过诱导用户访问特制网站触发内存破坏，导致任意代码执行或拒绝服务（应用崩溃）。该漏洞无需身份认证，攻击复杂度中等，CVSS 评分 9.3，危害严重。Apple 已在 iOS 5.1 和 iTunes 10.6 更新中修复此漏洞。"
published = "2012-03-08T22:55:03Z"
remediation = "立即将 Apple Safari 升级至 5.1.4 或更高版本，将 iOS 升级至 5.1 或更高版本，将 iTunes 升级至 10.6 或更高版本。对于无法升级的设备，可在浏览器中禁用 JavaScript 作为临时缓解措施，并避免访问不可信的网站。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:37:57Z"

