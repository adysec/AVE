[basic]
description = "Jakarta Tomcat 3.1 默认配置未对 /admin 上下文进行访问限制，远程攻击者无需认证即可直接调用管理 Servlet，通过添加根目录上下文实现读取服务器上任意文件。该漏洞利用复杂度低，仅需网络访问即可触发，可导致敏感信息泄露（如配置文件、源代码等）。影响所有使用默认配置的 Jakarta Tomcat 3.1 版本。"
published = "2000-07-20T04:00:00.000"
remediation = "升级至 Apache Tomcat 3.2 及以上版本（该漏洞在 3.2 中修复）。由于 Tomcat 3.x 已停止维护，建议升级至 9.0.x 或更高版本。临时缓解措施：删除或重命名 webapps/ 目录下的 admin 上下文，或在 server.xml 中为 /admin 路径配置 IP 访问限制和 HTTP 基本认证。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Apache Jakarta Tomcat 默认配置权限不当导致任意文件读取漏洞"
updated = "2026-06-16T21:52:14.210"

