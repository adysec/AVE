[basic]
description = 'WordPress Emag Marketplace Connector 插件 1.0.0 版本中 awb-meta-box.php 文件存在反射型跨站脚本漏洞。该漏洞源于对 HTTP GET 请求中 "post" 参数过滤不严，攻击者无需身份认证即可通过构造恶意 URL 并诱导已登录管理员点击，在目标浏览器中执行任意 JavaScript 代码，可窃取会话 Cookie、篡改页面内容或发起其他恶意操作。攻击条件要求用户交互（点击链接），影响范围限于浏览器端，CVSS 评分 6.1，危害等级中危。'
published = "2017-11-28T22:29:00Z"
remediation = "立即更新 Emag Marketplace Connector 插件至最新版本，或直接删除该插件。如无法更新，在 Web 应用防火墙 (WAF) 层面添加规则，对 `/wp-content/plugins/emag-marketplace-connector/templates/order/awb-meta-box.php` 路径的 `post` 参数进行 HTML 编码过滤，阻止未转义的特殊字符。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Emag Marketplace Connector Plugin 反射跨站点脚本漏洞"
updated = "2026-06-17T01:10:15Z"

