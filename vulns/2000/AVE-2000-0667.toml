[basic]
description = "LPRng 3.6.24 及之前版本的 use_syslog() 函数中存在格式化字符串漏洞，远程攻击者无需身份认证即可通过网络向目标服务发送特制的打印请求，利用格式化字符串 %n 等占位符覆写内存中的任意地址，从而执行任意命令。该漏洞影响所有运行 LPRng 3.6.24 的系统，CVSS 评分 10.0，危害等级严重。目前已存在公开的利用代码，攻击者可直接获取目标主机的完全控制权限。"
published = "2000-12-19T05:00:00.000"
remediation = "立即升级 LPRng 至 3.6.25 或更高版本，该版本修复了 use_syslog() 函数中的格式化字符串漏洞。Red Hat 用户应安装 RHSA-2000-065 提供的更新包，FreeBSD 用户应应用 FreeBSD-SA-00:56 安全公告中的补丁。如无法升级，可在 lpd 服务配置中禁用 syslog 日志记录功能，并在防火墙限制对 515/TCP 端口的访问作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "LPRng 3.6.24 格式字符串远程命令执行漏洞"
updated = "2026-06-16T21:52:45.720"

