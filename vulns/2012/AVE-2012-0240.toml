[basic]
description = "Adobe Flash Player 存在基于栈的缓冲区溢出漏洞（CWE-787）。攻击者可通过诱导用户访问特制的恶意网页或打开包含恶意 Flash 内容的文件，触发栈缓冲区溢出，从而在当前用户上下文中执行任意代码。该漏洞影响 Windows、Mac OS X、Linux 及 Android 平台上的 Flash Player 10.3.183.20 之前版本及 11.x 系列特定版本，以及 Adobe AIR 3.3.0.3610 之前版本。CVSS 评分 9.3，危害等级严重，无需身份认证即可远程利用，但需要用户交互（如点击链接或打开文件）。Adobe 已发布安全更新修复此漏洞。"
published = "2012-06-09T00:55:01.033"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.20 及以上（Windows/Mac/Linux）或 11.3.300.257 及以上（Windows/Mac 11.x）、11.2.202.236 及以上（Linux 11.x）；Android 升级至 11.1.111.10（2.x/3.x）或 11.1.115.9（4.x）；Adobe AIR 升级至 3.3.0.3610 及以上。如无法升级，在浏览器中禁用 Flash 插件或使用 Chrome 内置 Flash 沙箱隔离。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 栈溢出远程代码执行漏洞"
updated = "2026-06-16T23:40:50.267"

