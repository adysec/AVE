[basic]
description = "MetaProducts Offline Explorer 1.4 及之前版本（Service Release 2 之前）存在文件系统泄露漏洞。远程攻击者可通过在请求 URL 中指定盘符（如 C:）绕过访问限制，读取目标系统上的任意文件。该漏洞源于程序未对用户请求的路径进行充分校验，导致攻击者无需身份认证即可利用，造成敏感信息泄露。CVSS 评分 5.0，危害等级中等。"
published = "2001-02-16T05:00:00Z"
remediation = "升级 MetaProducts Offline Explorer 至 1.4 Service Release 2 或更高版本，该版本修复了 URL 中驱动器号路径遍历问题。如无法升级，可在 Web 服务器或反向代理层过滤包含盘符（如 C:、D:）的请求路径，阻止此类目录遍历攻击。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "MetaProducts Offline Explorer 任意文件读取漏洞"
updated = "2026-06-16T21:53:32Z"

