[info]
author = "ave"
description = "检测 BEA WebLogic Server 双点缓冲区溢出漏洞（CVE-2001-0098）。该漏洞影响 WebLogic Server 5.1.0 之前版本，远程攻击者无需身份认证即可通过发送以 '..' 开头的超长 URL 触发缓冲区溢出，进而执行任意系统命令，完全控制目标服务器。"
id = "POC-AVE-2001-0041"
name = "CVE-2001-0098 PoC"
severity = "critical"
tags = ["ave-2001-0041"]
vuln_id = [
    "CVE-2001-0098",
    "AVE-2001-0041",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/.."
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["WebLogic"]
