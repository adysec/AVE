[basic]
description = "标签包裹的内容。<value>Network Associates WebShield SMTP 4.5 存在拒绝服务漏洞，未经身份认证的远程攻击者可通过构造 From: 地址以句点（.）结尾的邮件触发该漏洞，导致 WebShield 不断向自身转发邮件副本，最终造成邮件服务中断或系统资源耗尽。该漏洞影响部署 WebShield SMTP 4.5 的邮件服务器，攻击条件为攻击者能够向目标发送邮件，利用方式简单且无需特殊权限。"
published = "2000-10-20T04:00:00.000"
remediation = "建议立即将 WebShield SMTP 升级至厂商发布的修复版本，并在 SMTP 网关处增加邮件头校验规则，拒绝 From: 地址以句点（.）结尾的入站邮件。如升级前无法及时部署，可在前端邮件网关或防火墙策略中对来自 WebShield 的邮件流量进行速率限制，防止循环转发耗尽资源。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Network Associates WebShield SMTP 4.5 拒绝服务漏洞"
updated = "2026-06-16T21:52:22.790"

