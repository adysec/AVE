[basic]
description = "` tags as required.<value>PHP-Nuke 6.0 的新闻消息（News Message）功能存在跨站脚本攻击（XSS）漏洞，远程攻击者可在 IMG 标签中注入 JavaScript 代码并提交为新闻内容。当其他用户浏览包含该恶意新闻的页面时，嵌入的脚本将在用户浏览器中执行，导致会话劫持、网页篡改或敏感信息泄露。该漏洞影响 PHP-Nuke 6.0 版本，攻击者无需身份认证即可远程利用，但需要目标用户访问包含恶意内容的页面才能触发利用。攻击条件为目标系统网络可达且用户具备查看新闻模块的权限，攻击者可诱导管理员或其他用户点击查看恶意页面，从而在受害者浏览器环境中执行任意脚本。"
published = "2002-12-31T05:00:00Z"
remediation = "将 PHP-Nuke 升级至 7.0 或更高版本，该版本已修复新闻消息中 IMG 标签的跨站脚本过滤问题。如暂无法升级，需修改 news 模块提交处理代码，对用户输入的新闻内容使用 PHP strip_tags() 函数移除 IMG 标签，并在输出时调用 htmlspecialchars() 进行 HTML 实体编码，同时在服务器端部署 ModSecurity 规则拦截含有 javascript: 协议的 IMG 标签请求作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "PHP-Nuke 6.0 跨站脚本漏洞"
updated = "2026-06-16T22:00:00Z"

