[basic]
description = "标签中。<value>Nuxt.js 默认以不区分大小写的方式匹配路由规则，此前 CVE-2026-53721 的修复方案在匹配路由规则前将请求路径统一转为小写，但编译进路由规则匹配器的键名未同步转换，导致含大写字母的路由规则键（如 /Admin、/Dashboard/**）无法命中，因为每次查找时路径已被折叠为小写而键名仍保持原有大小写。由于 vue-router 仍会不区分大小写地渲染对应页面，受保护页面将以无任何路由规则防护的状态直接呈现。最严重的后果是授权绕过：当 routeRules 中配置了 appMiddleware 身份验证门禁时，攻击者只需使用不同大小写组合访问受保护路径，即可绕过登录校验获取页面及其 SSR 预取数据。该漏洞同时影响 Nuxt 的客户端重定向中间件、ssr: false 决策、预渲染及 payload 处理等机制。攻击者无需身份认证，只需构造大小写变体的 URL 即可在未经授权的情况下访问受保护资源。受影响版本包括 Nuxt 3.21.7 至 3.21.10 之前的版本以及 Nuxt 4.x，官方已在 3.21.10 和 4.5.1 中修复该问题。"
published = "2026-08-05T21:16:59Z"
remediation = "1. 升级 Nuxt 至安全版本：3.x 用户升级到 3.21.10 或更高版本，4.x 用户升级到 4.5.1 或更高版本。2. 若暂无法升级，将所有 routeRules 的键及页面文件名统一改为全小写，使路由规则键与大小写不敏感的查找路径保持一致。3. 或在 nuxt.config.ts 中设置 router: { options: { sensitive: true } }，启用大小写敏感路由，使路由匹配与规则匹配对称。4. 作为临时缓解，可在服务器端通过独立 serverMiddleware 强制实施权限校验，不依赖大小写不敏感的路由规则匹配。"
score = 8.2
severity = "HIGH"
sources = ["ghsa"]
title = "Nuxt 框架路由规则混合大小写路径授权绕过漏洞"
updated = "2026-08-06T14:16:43Z"

