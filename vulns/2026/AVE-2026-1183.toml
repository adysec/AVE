[basic]
description = "NoMachine Device Server 存在不受控的搜索路径元素漏洞（CWE-427），产品从不安全的位置加载动态链接库。本地攻击者需先在目标系统上获得低权限代码执行能力，随后利用该漏洞劫持库加载过程，将权限提升至 SYSTEM 级别并执行任意代码。该漏洞影响 NoMachine 所有受影响版本，CVSS 评分为 7.8（高危），攻击条件为本地访问且需具备低权限代码执行能力。"
published = "2026-04-11T01:16:18.017"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "NoMachine Device Server 搜索路径劫持本地权限提升漏洞"
updated = "2026-06-17T10:58:22.343"

