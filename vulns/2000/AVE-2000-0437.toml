[basic]
description = "3R Soft MailStudio 2000 2.0 及更早版本中的 mailview.cgi CGI 程序存在目录遍历漏洞，远程攻击者无需身份认证即可通过构造包含 `..`（点点）序列的恶意请求，利用路径回溯技术读取服务器上的任意文件，导致敏感信息泄露。该漏洞影响 MailStudio 2000 2.0 及之前版本，攻击复杂度低，仅需发送特制 HTTP 请求即可利用。"
published = "2000-06-09T04:00:00Z"
remediation = '立即删除或禁用服务器上的 mailview.cgi 脚本，或通过 Web 服务器配置（如 Apache 的 `<Location>` 指令）限制对该脚本的访问。在无法删除的情况下，在 CGI 脚本入口处对 `..` 路径遍历字符进行严格过滤，拒绝包含 `../` 或 `..\` 的请求。建议迁移至仍在维护的邮件服务软件，如 Roundcube 或 SquirrelMail 的后续安全版本。'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "3R Soft MailStudio 2000 任意文件访问漏洞"
updated = "2026-06-16T21:51:55Z"

