[basic]
description = "Shambala Server 4.5 以明文形式存储用户密码，这是一个严重的认证信息存储安全漏洞。攻击者仅需拥有系统本地访问权限即可直接读取所有用户密码，由于密码未经过加密或哈希处理，攻击者通过窃取这些明文密码可以轻易提升权限、横向移动到其他服务、窃取敏感数据或完全控制服务器。该漏洞影响 Shambala Server 4.5 版本用户，攻击者无需复杂步骤即可利用明文存储的特性破坏系统的完整性、机密性和可用性。微软等主要供应商已发布安全补丁修复此问题，建议用户立即更新到已修复版本。"
published = "2000-12-19T05:00:00.000"
remediation = "建议立即更新Shambala Server至支持密码加密存储的更高版本或应用官方安全补丁。如无法立即更新，可首先通过修改配置文件禁用明文存储功能，并部署文件访问控制以限制本地用户读取密码文件作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "Evolvable Shambala Server 4.5 明文密码漏洞"
updated = "2026-06-16T21:52:50.810"

