[basic]
description = "Windows Telephony Service（TAPI）存在堆缓冲区溢出漏洞（CWE-122），远程攻击者可通过向目标系统发送特制请求触发该漏洞，在目标系统上以服务权限执行任意代码。该漏洞影响多个 Windows 10/11 及 Windows Server 版本，CVSS 评分 8.8，危害等级高危。利用该漏洞需要用户交互（如点击恶意链接或打开恶意文件），攻击复杂度低且无需身份认证。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:47Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新：Windows Server 2025 安装 KB5050009，Windows Server 23H2 安装 KB5049984，Windows Server 2022 安装 KB5049983，Windows 11 安装 KB5050021，Windows 10 安装 KB5049981。可通过 Windows Update 自动获取，或从 Microsoft Update Catalog 手动下载安装。如无法立即打补丁，建议在防火墙层面限制对 TAPI 服务的远程访问，并禁用不必要的电话服务（TapiSrv）作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:42:57Z"

