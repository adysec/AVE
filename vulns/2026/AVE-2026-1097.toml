[basic]
description = "Oracle VM VirtualBox 的 VMSVGA 显示设备组件存在权限管理不当漏洞，受影响的版本为 7.2.8。具有本地高权限且可登录运行 VirtualBox 所在基础设施的攻击者，可利用该漏洞提升权限并完全接管 Oracle VM VirtualBox。由于攻击发生在宿主基础设施层面，成功利用可能导致影响范围蔓延至同一宿主机上的其他产品（范围变更），造成机密性、完整性和可用性的全面丧失。该漏洞攻击路径为本地，利用难度较高，需要攻击者具备高权限登录条件，CVSS 3.1 评分为 7.5，危害等级为高。Oracle 已发布安全公告修复该漏洞，建议受影响用户升级至修复版本。"
published = "2026-06-17T10:54:05.017"
remediation = "请立即安装 Oracle VM VirtualBox 7.2.12 或更高版本的安全更新，这是 Oracle 2026 年 7 月关键补丁更新（CPU）中包含的正式补丁，修复了 VMSVGA 设备的漏洞问题。如果无法立即应用补丁，建议通过虚拟化管理器禁用 VMSVGA设备或将显卡类型降级为VMSVGA_1x1为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["zdi"]
title = "Oracle VM VirtualBox VMSVGA设备 权限管理不当漏洞"
updated = "2026-06-18T13:51:15.790"

