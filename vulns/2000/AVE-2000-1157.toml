[basic]
description = "Windows NT 4.0 和 Windows 2000 的 SMB 协议实现存在拒绝服务漏洞。远程未经身份认证的攻击者可通过向目标主机连续发送多个 SMBnegprots 协商请求但不读取响应数据，导致服务器缓冲区积压、连接资源耗尽，使合法用户无法建立新的网络连接。该漏洞影响 Windows NT 4.0 和 Windows 2000 系统，攻击者仅需在网络层面即可发起利用，无需任何凭据或用户交互，成功率极高。Microsoft 已发布安全补丁修复此漏洞，建议受影响系统升级至最新安全更新版本。"
published = "2000-12-31T05:00:00Z"
remediation = "建议立即安装 Windows 2000 Service Pack 4 (SP4)，该SP4修复了与SMBnegprots请求相关的处理缺陷。如果目标系统是 Windows NT 4.0，则应升级到 NT 4.0 Service Pack 7 或更高版本。如无法立即应用SP4，可通过修改注册表（禁用SMB协议的异常处理）作为临时缓解措施。升级后重新引导系统以确保修复生效。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows NT 4.0/2000 SMB 协议拒绝服务漏洞"
updated = "2026-06-16T21:53:25Z"

