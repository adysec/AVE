[basic]
description = "GIMP 在处理 XPM 图像文件时存在整数溢出漏洞，由于缺乏对用户输入数据的充分验证，攻击者可以构造恶意的 XPM 文件，在分配缓冲区前触发整数溢出，进而在当前进程上下文中执行任意代码。该漏洞影响 GIMP 2.8.22-1 之前版本，主要运行在 Linux/Unix 系统上，用户必须打开恶意文件或访问恶意页面才能触发利用，CVSS 评分 7.8，危害等级高。"
published = "2026-04-11T01:16:17Z"
remediation = "立即将 GIMP 升级至 3.2.4 或更高版本，该版本已包含对 XPM 文件解析整数溢出漏洞（CVE-2026-4154）的修复补丁（commit 2e7ed91793792d9e980b2df4c829e9aa60459253）。RHEL 用户可通过 yum update gimp 安装修复包（如 ELSA-2026:17533）。如暂无法升级，请勿打开来自不受信任来源的 XPM 图像文件，并在不需要 GIMP 时移除 gimp 软件包以降低攻击面。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "GIMP XPM文件解析整数溢出远程代码执行漏洞"
updated = "2026-07-15T02:22:39Z"

