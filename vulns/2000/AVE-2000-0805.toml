[basic]
description = "Microsoft Windows Media Player 7.0 版本存在缓冲区溢出漏洞。攻击者可通过构造恶意 Active Stream Redirector (.asx) 文件向受害者发送攻击向量，利用整数溢出或堆内存 corruption 等内存 corruption 技术触发溢出，获取对目标系统的控制权。该漏洞影响 Windows Media Player 7.0，攻击者无需任何身份验证即可远程发起攻击，CVSS 评分 7.5，威胁等级中危。该漏洞最早在 2001 年 1 月被披露，攻击者可利用该漏洞在目标计算机上执行任意代码，窃取敏感数据或进一步横向移动。"
published = "2001-01-09T05:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-090 提供的补丁：Windows Media Player 6.4 用户下载安装 KB280419 补丁（https://www.microsoft.com/download/details.aspx?FamilyId=9B94D3F0-9CF3-4A5F-8215-A221DDD923B0），Windows Media Player 7 用户下载安装对应补丁（https://www.microsoft.com/download/details.aspx?FamilyId=BAF62356-D717-4B8F-97E0-299A7697A083）。如无法打补丁，在 IE 安全设置中将 Internet 区域 ActiveX 控件和插件设为禁用，并配置为不自动打开 .ASX 文件；同时不要打开来源不明的 .ASX 文件或访问可疑网站。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "Microsoft Windows Media Player 7.0 .ASX 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:10.483"

