[basic]
description = "rclone 本地后端存在路径遍历漏洞，其依赖可配置的文件名编码器来防止远程文件名数据成为操作系统路径语法。当本地目标配置使用省略了 Dot 编码的编码方式（如 Slash、None、Raw）时，远程对象的标准编码双全角点组件会被解码为实际的父目录组件，filepath.Join 解析该组件后生成超出配置本地根目录的路径；在 Windows 上省略 BackSlash 编码时，远程文件名中的反斜杠还会转换为原生路径分隔符。该漏洞影响 rclone v1.51.0 至 v1.74.4 版本，默认配置不受影响。攻击者若能控制远程源（如 S3）中的对象名称并诱使受害者在配置了非默认编码的本地目标上执行 copy、sync 或 move 操作，即可在 rclone 进程权限下创建或覆盖目标目录外的文件，可能导致敏感文件被篡改或破坏。建议升级至 v1.75.0 修复。"
published = "2026-08-05T21:16:59Z"
remediation = "1. 升级 rclone 到 v1.75.0 或更高版本，该版本在 backend/local/local.go 中增加了本地路径独立校验机制，修复了基于编码配置的路径遍历缺陷。2. 如暂时无法升级，请勿使用 --local-encoding Slash、--local-encoding None 或 --local-encoding Raw 等非默认编码配置，确保本地目标使用包含 Dot 掩码的默认编码，以阻断全宽点号的解码路径遍历。3. 同时检查所有涉及本地目标 copy/sync/move 任务的脚本与调度配置，移除非必需的自定义编码参数。4. 在受控环境下验证修复后，建议使用包含 .. 组件的测试对象名执行同步操作，确认文件不会写入目标目录之外。"
score = 6.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "rclone 本地编码路径遍历漏洞"
updated = "2026-08-06T16:16:53Z"

