[basic]
description = "SquirrelMail 1.2.11 之前版本存在多处跨站脚本（XSS）漏洞，由于对用户输入的数据过滤不足，远程攻击者可通过构造恶意 URL 或电子邮件内容注入任意 HTML 代码和 JavaScript 脚本。当受害用户访问包含恶意载荷的页面时，脚本会在其浏览器上下文中执行，导致会话劫持、敏感信息窃取（如 Cookie、凭据）、钓鱼攻击或恶意操作执行。该漏洞影响所有未升级至 1.2.11 版本的 SquirrelMail Webmail 部署，CVSS 评分 5.8（中危），攻击向量为网络、攻击复杂度中等、无需身份认证，主要影响机密性和完整性。官方已在 1.2.11 版本中修复此问题，用户应尽快升级。"
published = "2003-04-02T05:00:00Z"
remediation = "建议立即升级 SquirrelMail 至 1.2.11 或更高版本。若无法立即升级，可在 Web 服务器层面配置输入过滤规则拦截包含脚本标签的恶意请求，或暂时禁用易受攻击的邮件阅读功能作为临时缓解措施。"
score = 5.8
severity = "MEDIUM"
sources = ["redhat"]
title = "SquirrelMail SquirrelMail 跨站脚本漏洞"
updated = "2026-06-16T22:01:40Z"

