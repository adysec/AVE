[basic]
description = "该漏洞存在于 Mozilla Firefox（4.0.1 及更早版本）、Thunderbird（3.1.11 及更早版本）及 SeaMonkey（2.0.14 及更早版本）中，由于浏览器引擎在解析 multipart/x-mixed-replace 类型图像时存在内存损坏缺陷。攻击者可构造恶意网页，当用户访问时触发该漏洞，导致应用程序崩溃或内存破坏，在特定条件下可能实现远程代码执行。该漏洞无需用户认证，仅需用户访问恶意页面即可触发，攻击复杂度低，主要影响客户端安全。Mozilla 已在后续版本中修复此漏洞，建议用户升级至 Firefox 3.6.18 或更高版本。"
published = "2011-06-30T16:55:05Z"
remediation = "将 Mozilla Firefox 升级至 3.6.18 或更高版本（3.6.x 分支），或升级至 4.0.1 及以上版本；将 Thunderbird 升级至 3.1.11 或更高版本；将 SeaMonkey 升级至 2.0.14 或更高版本。Linux 用户可通过系统包管理器执行更新命令（如 Ubuntu/Debian 使用 sudo apt-get upgrade thunderbird firefox seamonkey），Windows 用户通过 Firefox/Thunderbird 内置更新功能或官网下载最新安装包覆盖安装。若暂时无法升级，可禁用浏览器中 multipart/x-mixed-replace 图片加载功能，或在邮件客户端中关闭自动加载远程图片作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey multipart/x-mixed-replace图像内存损坏漏洞"
updated = "2026-06-16T23:31:13Z"

