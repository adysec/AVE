[basic]
description = "sqlite3-ruby 是 SQLite3 数据库的 Ruby 语言绑定库。在 2.9.4 及之前版本中，使用不同参数个数（arity）重新定义同名 SQLite 函数时，之前注册的函数处理器会被释放，但 SQLite 内部仍保留对该已释放内存的引用，从而触发释放后使用（Use-After-Free）漏洞。本地攻击者可通过特定的函数重定义操作，在垃圾回收后引发程序崩溃或内存读取异常。该漏洞 CVSS 评分为 2.0，危害等级低，建议升级至 v2.9.5 及以上版本修复。"
published = "2026-07-28T17:16:52Z"
remediation = "升级 sqlite3 gem 至 v2.9.5 或更高版本：在 Gemfile 中将 `gem 'sqlite3'` 版本约束改为 `>= 2.9.5` 后执行 `bundle update sqlite3`。若无法升级，避免对同一函数名使用不同参数个数（arity）多次调用 `create_function` 或 `define_function`。"
score = 2
severity = "LOW"
sources = ["ghsa"]
title = "sqlite3-ruby SQLite3 Ruby 绑定释放后使用漏洞"
updated = "2026-07-28T20:17:26Z"

