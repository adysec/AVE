[basic]
description = "Microsoft Windows 98/98SE 网络协议栈存在 ARP 洪水拒绝服务漏洞，远程未认证攻击者可发送大量源 IP 和 MAC 地址随机的畸形 ARP 请求包（如 ARPNuke 工具演示），导致目标系统 CPU 资源耗尽，引发拒绝服务。该漏洞影响 Windows 98 及 98SE 版本，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），属网络访问、低复杂度、无需认证、部分可用性影响的拒绝服务漏洞。攻击者仅需网络层访问权限即可发起攻击，无需用户交互。Microsoft 已发布补丁修复该漏洞，建议升级至修复版本或升级操作系统版本。"
published = "2001-07-30T04:00:00Z"
remediation = "建议将系统从 Windows 98/98SE 升级至 Windows XP SP3 或更高版本，微软已停止对旧系统的安全支持。若无法立即迁移，应在网络层启用交换机 Port Security 功能绑定合法 MAC 地址，并配置 ARP 速率限制规则以过滤异常 ARP 泛洪数据包。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Microsoft Windows 98 ARP 拒绝服务漏洞"
updated = "2026-06-16T21:55:29Z"

