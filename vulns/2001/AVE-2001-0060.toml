[basic]
description = "Solaris 7 和 Solaris 8 系统中的 ximp40 共享库（ximp40.so.2）存在缓冲区溢出漏洞。该库由 Openwin 软件包提供，多个链接该库的 SUID/SGID 程序（如 /usr/dt/bin/dtaction、/usr/dt/bin/dtprintinfo、/usr/openwin/bin/sys-suspend 等）在处理进程名称参数时未对输入长度进行有效边界检查。本地攻击者可通过向 arg0（进程名称）参数传入约 272 字节的超长字符串触发栈溢出，覆盖栈上变量包括程序返回地址，进而执行任意代码。根据利用的 SUID 程序不同，攻击者可获取 root 或 mail 用户权限。该漏洞影响 Solaris 7 及 Solaris 8 系统，CVSS 评分为 7.2，危害等级高。"
published = "2001-05-03T04:00:00Z"
remediation = "建议将 Solaris 7/8 系统升级至 Solaris 9 或更高版本。若必须维持旧版本运行，可通过移除或禁用受影响的 ximp40 共享库来消除风险，或严格限制本地非特权用户的进程执行权限以降低漏洞利用可能性。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Sun Solaris 7/8 ximp40 共享库本地缓冲区溢出提权漏洞"
updated = "2026-06-16T21:53:47Z"

