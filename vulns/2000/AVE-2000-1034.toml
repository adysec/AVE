[basic]
description = "MySQL 数据库引擎使用弱身份认证方法，在认证过程中会泄露密码哈希信息，远程攻击者无需身份认证即可通过网络嗅探或中间人攻击捕获认证数据包，进而通过离线暴力破解或字典攻击恢复明文密码。该漏洞影响 MySQL 所有版本，攻击者获取密码后可完全控制数据库系统，导致数据泄露、篡改或破坏。官方建议升级至新版本或使用更强的认证插件。"
published = "2000-12-19T05:00:00.000"
remediation = "升级 MySQL 至 4.0.0 及以上版本（该版本引入了新的安全认证协议，不再泄露密码哈希信息）；如无法升级，可在 MySQL 配置文件 my.cnf 中设置 old-passwords=0 并重启服务，强制使用新协议认证；同时限制数据库远程访问，通过防火墙仅允许可信 IP 连接 3306 端口。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "MySQL 数据库引擎弱认证信息泄露漏洞"
updated = "2026-06-16T21:52:54.300"

