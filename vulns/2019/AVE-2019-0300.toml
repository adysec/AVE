[basic]
description = "Atlassian Jira Server 与 Data Center 的 ContactAdministrators 和 SendBulkMail 功能中存在服务端模板注入（SSTI）漏洞。未经身份认证的远程攻击者可向受影响功能发送特制的邮件请求，利用 Velocity 模板引擎的注入缺陷在服务器端执行任意代码，从而完全控制目标系统。该漏洞影响 Jira Server/Data Center 4.4.0 至 7.6.14、7.7.0 至 7.13.5、8.0.0 至 8.0.3、8.1.0 至 8.1.2 及 8.2.0 至 8.2.3 等多个版本，CVSS 评分 9.8，危害等级严重。攻击者无需任何权限即可远程利用，且已有公开 PoC，实际威胁极高。"
published = "2019-08-09T20:15:11Z"
remediation = "升级 Jira Server/Data Center 至安全版本：7.6.14、7.13.5、8.0.3、8.1.2 或 8.2.3 及以上。如无法立即升级，可在反向代理或 WAF 层面添加规则，拦截对 /secure/ContactAdministrators.jspa 和 /secure/SendBulkMail.jspa 路径中携带模板语法的异常请求作为临时缓解。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Atlassian Jira 服务端模板注入远程代码执行漏洞"
updated = "2026-06-17T02:13:12Z"

