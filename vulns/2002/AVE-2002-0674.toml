[basic]
description = "ICQ for Mac OS X 2.6x 客户端存在缓冲区溢出漏洞，影响 Mac OS X 10.0 至 10.1.2 版本。远程攻击者无需身份验证，通过网络向运行 ICQ 客户端的目标系统发送超过 19000 个字符的超长请求即可触发该漏洞。ICQ for Mac OS X 客户端通常监听 TCP 49152 和 49159 端口，攻击者建立 TCP 连接后发送构造的超长数据包，导致缓冲区溢出，可造成客户端程序崩溃（拒绝服务），并有可能被进一步利用以执行任意代码。该漏洞利用门槛极低，攻击复杂度低，影响范围覆盖所有使用受影响版本的 ICQ for Mac OS X 用户。"
published = "2002-12-31T05:00:00Z"
remediation = "建议立即升级 ICQ for Mac OS X 客户端至 Mirabilis 官方发布的后续稳定版本（3.0 或更高），该版本已修复缓冲区溢出漏洞。如无法立即升级，可在系统防火墙中阻止外部主机对本地 49152 和 49159 端口的入站连接，并避免接收来自不可信来源的 ICQ 消息作为临时缓解措施。同时建议卸载 2.6x Beta 测试版本，使用正式发行版。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "ICQ Mac OS X 2.6 客户端缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:59:57Z"

