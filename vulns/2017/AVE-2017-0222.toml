[basic]
description = "Microsoft Outlook 存在安全功能绕过漏洞，由于 Outlook 对内存中对象的处理方式存在缺陷，攻击者可通过向目标用户发送特制的邮件或诱导用户打开恶意附件，利用 Outlook 对象模型（Object Model）绕过安全机制并执行任意命令。该漏洞影响 Outlook 2010 SP2、Outlook 2013 SP1/RT SP1 及 Outlook 2016 版本，已被 CISA 列入已知被利用漏洞目录（KEV），实际攻击中常被用于初始访问和权限提升。攻击需要用户交互（如点击邮件中的恶意链接或打开附件），CVSS 评分 7.8，危害等级高。"
published = "2017-10-13T13:29:00Z"
remediation = '立即安装 Microsoft 2017 年 9 月安全更新：Outlook 2016 安装 KB4011038，Outlook 2013 安装 KB4011039，Outlook 2010 安装 KB4011040。如无法立即打补丁，可通过组策略或注册表禁用 Outlook 主页功能：在 HKEY_CURRENT_USER\Software\Microsoft\Office\<版本>\Outlook\WebView 中将 DisableHomePage 设为 1，或通过组策略「关闭 Outlook 主页」启用此设置，阻止攻击者利用邮件预览触发任意命令执行。'
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Outlook 安全功能绕过漏洞"
updated = "2026-06-17T01:02:20Z"

