[info]
author = "AVE"
description = "Apache HTTP Server 1.3.11-1.3.20 mod_usertrack 模块生成的 Session ID 基于主机 IP、系统时间和进程 PID 等可预测因素，攻击者可推算并劫持会话。通过发送 HTTP 请求检测服务器是否设置了 mod_usertrack 的 Cookie。"
id = "POC-AVE-2001-0123"
name = "Apache HTTP Server mod_usertrack 可预测 Session ID 安全绕过漏洞 PoC"
severity = "low"
tags = [
    "cve-2001-1534",
    "apache",
    "mod_usertrack",
    "session-prediction",
]
vuln_id = [
    "CVE-2001-1534",
    "AVE-2001-0123",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = ["Set-Cookie"]
