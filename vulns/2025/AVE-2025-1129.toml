[basic]
description = "Linux内核SPU文件系统（spufs）中存在内存泄漏漏洞。当spufs_new_file()函数在创建文件失败时，虽然调用者会执行spufs_rmdir()清理已创建的资源，但问题dentry仍保持负状态（negative）未显式释放，导致内核内存泄漏。该漏洞影响Linux内核中支持SPU文件系统的PowerPC架构系统。攻击条件为本地低权限攻击者，无需用户交互，可通过触发spufs文件操作失败来利用此漏洞。攻击者可诱使spufs_new_file()函数反复调用失败，导致内核内存不断泄漏累积，最终可能引发系统可用性下降或拒绝服务（DoS）。"
published = "2025-04-16T15:16:01Z"
remediation = "升级 Linux 内核至包含 spufs_new_file() 泄漏修复的版本。Debian 12 用户请执行 apt update && apt install --only-upgrade linux-image-6.1 安装 6.1.0-25 或更高版本；Ubuntu 25.04 用户请安装 6.14.3-060403 或更新内核。升级后执行 reboot 重启加载新内核。如无法立即升级，可通过 rmmod spufs 临时卸载该模块阻止本地低权限用户触发资源耗尽，但会丧失 SPU 计算功能。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel SPUFS 内存泄漏漏洞"
updated = "2026-06-17T08:44:59Z"

