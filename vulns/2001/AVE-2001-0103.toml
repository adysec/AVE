[basic]
description = 'Gene6 G6 FTP Server 2.0（又名 BPFTP Server 2.10）存在文件存在性信息泄露漏洞。当服务器未启用"show relative paths"选项时，未经身份认证的远程攻击者可通过向 FTP 服务发送特制的 SIZE 或 MDTM 命令，读取 Web 根目录之外的任意文件属性信息，从而泄露文件是否存在、文件大小及最后修改时间等敏感信息。该漏洞影响 Gene6 BPFTP Server 2.0/2.10 版本，CVSS 评分为 7.5，危害等级为高。攻击者只需能够连接目标 FTP 服务即可利用此漏洞，无需有效凭据，利用条件简单，可能导致敏感文件信息泄露，为后续攻击提供信息支撑。'
published = "2001-06-18T04:00:00Z"
remediation = '建议将 Gene6 BPFTP Server 升级至官方修复版本，并在服务器配置中启用 "show relative paths" 选项，以阻止攻击者通过 SIZE 和 MDTM 命令探测 FTP 根目录外的文件属性。如暂时无法升级，可在防火墙或 FTP 服务器配置中限制匿名用户登录，并禁用 SIZE 和 MDTM 命令作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Gene6 G6 FTP Server 文件存在信息泄露漏洞"
updated = "2026-06-16T21:53:59Z"

