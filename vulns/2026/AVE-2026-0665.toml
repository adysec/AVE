[basic]
description = "该漏洞是一个不完整修复导致的Gitea安全缺陷。原始PR#38145修复了ListPublicMembers和IsPublicMember端点的安全问题，但忽略了ListMembers端点，导致任何已认证用户都能枚举私有组织中的所有成员，而非仅限于公开成员。漏洞根源在于routers/api/v1/org/member.go文件的ListMembers()函数中缺少HasOrgOrUserVisible权限验证。通过访问/privateorg/members等API端点，攻击者可以突破访问控制，获取私有组织的完整成员信息，包括用户名、邮箱等隐私数据。本漏洞影响所有≤v1.26.4版本（含最新版）和主分支，攻击者仅需拥有普通用户账户即可利用此漏洞，CVSS评分严重（9.8），需立即修复。"
published = "2026-01-01T00:00:00Z"
remediation = "升级 Gitea 至 v1.27.0 或更高版本，该版本通过 PR #38213 修复了 ListMembers() 接口中缺失的组织可见性检查。如无法立即升级，可通过反向代理（如 Nginx）临时限制对 `/api/v1/orgs/*/members` 端点的未授权访问，或审查并收紧私有组织的成员列表 API 访问权限。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Gitea 私有组织成员信息泄露漏洞"
updated = "2026-01-01T00:00:00Z"

