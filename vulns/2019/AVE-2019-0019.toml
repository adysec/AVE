[basic]
description = "Apple iOS 和 macOS Mojave 的 FaceTime 组件在处理群组 FaceTime 通话时存在逻辑缺陷，攻击者作为通话发起方可利用该漏洞强制接收方自动接听通话，导致接收方的音频和视频内容在未经用户确认的情况下被传输，造成敏感信息泄露。该漏洞无需用户交互即可远程触发，影响 iOS 12.1.4 之前版本及 macOS Mojave 10.14.3 补充更新之前版本。Apple 已通过改进状态管理修复此问题。"
published = "2019-03-05T16:29:02Z"
remediation = "立即将 iPhone/iPad 升级至 iOS 12.1.4 及以上版本，将 Mac 升级至 macOS Mojave 10.14.3 Supplemental Update (build 18D109) 及以上版本。可通过「设置→通用→软件更新」或「系统偏好设置→软件更新」完成升级。如无法立即更新，可在 FaceTime 设置中关闭「群组 FaceTime」功能作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Apple iOS和macOS Mojave FaceTime组件信息泄露漏洞"
updated = "2026-06-17T02:38:50Z"

