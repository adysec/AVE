[basic]
description = "tags.<value>guzzlehttp/guzzle 在 7.15.1 及之前版本中存在拒绝服务漏洞。该漏洞源于 CookieJar 组件对 Set-Cookie 响应头字段的大小缺乏限制，当 Guzzle 作为 HTTP 客户端连接至恶意服务器时，攻击者可返回大量超大 Cookie，导致 Guzzle 无限制地将其存储于内存中，引发内存过度消耗，同时生成的超长 Cookie 请求头也会导致下游处理器或目标服务器请求失败。该漏洞影响所有使用受影响版本 Guzzle 进行 HTTP 请求的应用程序，攻击者只需控制客户端所连接的服务器即可触发，无需身份认证，远程攻击复杂度低。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
