[basic]
description = "Linux 内核 IPv6 多播（mcast）子系统的 igmp6_send() 函数存在释放后使用（Use-After-Free）漏洞。该函数可在未持有 RTNL 锁或 RCU 保护的情况下被调用，导致网络命名空间指针被不安全地访问，从而触发释放后使用问题。拥有本地低权限访问的攻击者可通过触发该函数执行恶意操作，进而可能导致任意代码执行或系统拒绝服务。该漏洞影响支持 IPv6 多播功能的 Linux 内核版本，CVSS 评分 7.8，危害等级高，攻击者利用此漏洞可完全控制受影响系统。"
published = "2025-02-27T03:15:16.550"
remediation = "立即升级 Linux 内核至包含修复的稳定版本：Ubuntu 24.04 LTS 升级至 6.8.0-78.78 或更高，24.10 升级至 6.11.0-26.26 或更高；RHEL/CentOS 安装 2025 年 2 月内核安全更新（Bugzilla 2348596）；SUSE 升级至 SLE 15 SP6/SP7 对应内核版本。通用内核用户应升级至 6.6.79、6.12.16、6.13.4 或更新稳定版。容器化环境需同步更新宿主机内核并重启容器以加载新内核模块。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 IPv6 组播释放后使用漏洞"
updated = "2026-06-17T08:44:12.443"

