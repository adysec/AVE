[info]
author = "AVE"
description = "File Browser 存档构建器路径遍历漏洞验证。通过检查版本号判断是否在受影响范围（2.63.6 ≤ version < 2.63.17）"
id = "POC-AVE-2026-0923"
name = "CVE-2026-62843 PoC"
severity = "medium"
tags = ["ave-2026-0923"]
vuln_id = [
    "CVE-2026-62843",
    "AVE-2026-0923",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/api/version"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "2.63.6",
    "2.63.7",
    "2.63.8",
    "2.63.9",
    "2.63.10",
    "2.63.11",
    "2.63.12",
    "2.63.13",
    "2.63.14",
    "2.63.15",
    "2.63.16",
]
