[basic]
description = "Open WebUI 是一款可自托管的 AI 平台，在 0.5.0 至 0.11.0 版本中，其标准频道的消息更新与删除接口存在权限校验缺陷。当管理员启用频道功能（ENABLE_CHANNELS）后，标准频道的消息更新和删除处理器仅检查调用者是否拥有频道写入权限，而未验证消息是否由该调用者本人发送。由于写入权限是普通成员在频道中发言所需的相同权限，任何持有频道写入权限的认证用户均可修改或永久删除其他成员的消息，且消息仍归属于原作者，还可附加任意 data 和 meta 载荷。群组频道和私信频道则已正确执行作者身份校验，不受影响。攻击者可利用此缺陷篡改同事发言内容、伪造信息并销毁频道历史记录，对频道的完整性和可用性造成损害。该漏洞已在 0.11.0 版本中通过提交 c609ec411 修复。"
published = "2026-08-04T20:16:55Z"
remediation = "升级到 Open WebUI 0.11.0 或更高版本。该版本通过提交 c609ec411（PR #27197）修复了标准频道消息更新和删除接口的权限校验漏洞，修复后 handlers 会对操作者与消息作者身份进行匹配校验，无需额外配置变更即可彻底消除风险。如暂无法立即升级，可通过环境变量设置 `ENABLE_CHANNELS=false` 禁用频道功能作为临时缓解措施，或仅向受信任的管理员账号授予标准频道的写权限，限制普通成员访问。"
score = 5.4
severity = "MEDIUM"
sources = ["ghsa"]
title = "Open WebUI 标准频道消息越权编辑删除漏洞"
updated = "2026-08-05T15:17:09Z"

