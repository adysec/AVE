[basic]
description = "` tags.<value>Felix IRC 客户端是运行在 BeOS r5 pro 及更早版本上的即时通讯软件。该客户端存在拒绝服务漏洞，远程攻击者无需身份认证即可通过向目标用户发送包含超长 URL 的 IRC 消息触发该漏洞。当 Felix 客户端解析该消息中的 URL 时，因缺乏对 URL 长度的有效校验，导致应用程序崩溃或无法继续正常提供即时通讯服务。受影响范围包括 BeOS r5 pro 及更早版本中安装 Felix 2.3 IRC 客户端的用户。攻击者只需在 IRC 频道中向目标发送特制消息即可实施攻击，无需任何权限或交互，实现简单且影响直接。"
published = "2001-01-09T05:00:00Z"
remediation = "Felix IRC 客户端 2.3 及更早版本在处理包含超长 URL 的 IRC 消息时未对输入长度做适当限制，导致内存缓冲区溢出或资源耗尽，从而引发拒绝服务。建议立即升级 Felix IRC 客户端至修复了长 URL 处理问题的更新版本；如官方未发布补丁，可临时切换至其他维护中的 IRC 客户端，或在网络防火墙/IRC 网关层对包含异常长 URL 的消息进行过滤拦截。如条件允许，建议将操作系统升级至仍在接收安全更新的现代平台，以降低使用已停止维护软件带来的整体风险。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "BeOS Felix IRC 客户端 URL 拒绝服务漏洞"
updated = "2026-06-16T21:53:15Z"

