[basic]
description = "CouchCMS 2.0 及之前版本存在路径泄露漏洞。远程攻击者无需身份认证，直接向目标系统发送请求访问 includes/mysql2i/mysql2i.func.php 或 addons/phpmailer/phpmailer.php 文件即可触发该漏洞，导致服务器返回完整物理路径信息。该漏洞可被攻击者用于收集目标环境信息，为后续深入攻击提供线索，影响所有使用 CouchCMS 2.0 及更早版本的网站。"
published = "2018-03-04T23:29:00Z"
remediation = "升级 CouchCMS 到 v2.1 或更高版本以修复此路径泄露漏洞。如无法立即升级，可在 Web 服务器（Nginx/Apache）配置中禁止直接访问 includes/ 和 addons/ 目录下的 PHP 文件，或在 php.ini 中设置 display_errors = Off 以禁止 PHP 错误信息输出，防止物理路径泄露。"
score = 5.3
severity = "MEDIUM"
sources = ["nuclei"]
title = "Webzyme CouchCMS 路径泄露漏洞"
updated = "2026-06-17T02:03:29Z"

