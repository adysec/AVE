[basic]
description = "ypbind 3.3 存在缓冲区溢出漏洞，远程攻击者无需身份认证即可向目标系统发送特制请求触发该漏洞，成功利用后可获取 root 权限，完全控制受影响系统。该漏洞影响运行 ypbind 3.3 的 Linux 发行版（包括 SuSE、Caldera、Mandrake 等），CVSS v2 评分 10.0，攻击复杂度低，无需认证即可远程利用，可导致机密性、完整性和可用性完全丧失。各厂商已发布安全公告和补丁修复此漏洞。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级 ypbind 至修复版本（如 Caldera OpenLinux 的 ypbind 补丁包、SuSE Linux 对应安全更新、Mandrake Linux MDKSA-2000-064 更新）。如无需 NIS 服务，执行 `service ypbind stop && chkconfig ypbind off` 禁用该服务；若必须使用 NIS，在防火墙上限制仅允许受信任网段访问 ypbind（端口 111/TCP/UDP 及 32768-65535 动态端口）。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "NIS ypbind 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:01Z"

