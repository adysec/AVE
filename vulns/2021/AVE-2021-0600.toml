[basic]
description = "GitLab 的 CI Lint API 在处理 webhook 请求时存在服务端请求伪造（SSRF）漏洞，攻击者可通过发送包含恶意远程 include 配置的特制 YAML 请求到 `/api/v4/ci/lint` 接口，诱使 GitLab 服务器向内部网络发起任意请求。该漏洞影响 GitLab CE/EE 10.5 至 13.8.4 的所有版本，无需身份认证且无需用户交互，即使实例关闭了注册功能仍可被利用。成功利用后，未经授权的远程攻击者可探测并访问内网资源，导致敏感信息泄露或内网环境被进一步渗透。GitLab 已在后续版本中修复此漏洞，CISA 亦将其列入已知被利用漏洞目录。"
published = "2021-06-11T16:15:09Z"
remediation = '立即升级 GitLab 至安全版本：13.6.7、13.7.7 或 13.8.4（视当前所在版本分支选择对应修复版本）。若无法立即升级，可在 Admin Area 中禁用 webhook 对内网请求功能（Settings → Webhooks，取消勾选 "Allow requests to the local network from webhooks"），或通过防火墙/反向代理拦截 webhook 相关路径对内网地址的请求作为临时缓解措施。'
score = 6.8
severity = "MEDIUM"
sources = ["kev"]
title = "GitLab GitLab 服务端请求伪造漏洞"
updated = "2026-06-17T03:36:44Z"

