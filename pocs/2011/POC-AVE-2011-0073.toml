[info]
author = "ave"
description = "AVE-2011-0073 verification"
id = "POC-AVE-2011-0073"
name = "PoC for AVE-2011-0073"
severity = "medium"
tags = ["ave-2011-0073"]
vuln_id = ["AVE-2011-0073"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/imc/login.jsf"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "Intelligent Management Center",
    "iMC",
]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/imc/version.jsf"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["iMC"]
