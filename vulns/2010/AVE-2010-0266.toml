[basic]
description = "RealNetworks RealPlayer 多版本中存在多个 RealMedia 文件格式解析的堆缓冲区溢出漏洞，攻击者可通过诱导用户打开精心构造的恶意 RealMedia 文件触发堆溢出，导致远程代码执行。影响范围覆盖 RealPlayer 11.0-11.1、RealPlayer SP 1.0-1.1.4、RealPlayer Enterprise 2.1.2、Linux RealPlayer 11.0.2.1744 及可能受影响的 HelixPlayer 1.0.6 等版本。攻击条件为远程攻击者需诱导受害者打开恶意文件，利用方式为构造畸形 RealMedia 文件触发堆溢出实现远程代码执行，CVSS 9.3 严重级别，影响机密性、完整性与可用性均为完全级别。"
published = "2010-12-14T16:00:04Z"
remediation = "立即升级 RealPlayer 至 12.0.1.609 或更高版本（官网下载最新版）。若无法升级，建议卸载 RealPlayer 并改用其他播放器，或在防火墙层面禁止打开不可信的 .rm/.rmvb/.ram 文件作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer 堆缓冲区溢出漏洞"
updated = "2026-06-16T23:24:40Z"

