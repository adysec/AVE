[basic]
description = "ISC BIND 4.9.2 至 4.9.10 版本及衍生库（如 BSD libc、GNU glibc）中的 DNS 存根解析器库存在缓冲区溢出漏洞。远程攻击者可向目标系统发送特制的 DNS 服务器响应，触发 getnetbyname 或 getnetbyaddr 函数中的缓冲区溢出，导致任意代码执行。该漏洞影响大量使用上述库的 Unix/Linux 系统，CVSS 评分 7.5，危害等级高。"
published = "2002-11-29T05:00:00Z"
remediation = "立即升级 ISC BIND 至 4.9.11 或更高版本（4.9.10 及之前版本均受影响），或迁移至 BIND 8/9 系列。Linux 系统应更新 glibc 至包含 libresolv 补丁的版本（如 glibc 2.2.5+）。NetBSD 系统安装 SA2002-028 安全补丁，Apple Mac OS X 安装 2002 年 11 月安全更新，SGI IRIX 安装补丁 20021201-01-P。临时缓解措施可在 DNS 解析器侧过滤或验证 DNS 响应报文长度。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "ISC BIND DNS 解析库缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:56:37Z"

