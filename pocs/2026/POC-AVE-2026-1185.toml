[info]
author = "ave"
description = "验证GStreamer qtdemux组件在解析UncompressedFrameConfigBox结构时存在栈缓冲区溢出漏洞，通过构造恶意MOV/MP4媒体文件触发RCE"
id = "POC-AVE-2026-1185"
name = "CVE-2026-5056 PoC"
severity = "high"
tags = ["ave-2026-1185"]
vuln_id = [
    "CVE-2026-5056",
    "AVE-2026-1185",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/tmp/malformed_uncompressed_frame_config.mov"
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = [
    "crash",
    "buffer overflow",
    "stack smashing",
]
