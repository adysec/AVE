[basic]
description = "Allegra 的 downloadAttachment 方法存在跨站脚本（XSS）漏洞，由于对用户提交的数据缺乏充分的验证与过滤，导致攻击者可在当前用户上下文中注入并执行任意脚本。远程攻击者需具备低权限账户，并诱使目标用户访问恶意页面或打开恶意文件方可触发。成功利用可窃取会话凭证、篡改页面内容或发起进一步攻击。该漏洞影响 Allegra 相关版本，CVSS 评分 4.6，危害等级中危。"
published = "2026-06-13T00:16:24Z"
remediation = "建议立即升级到 Allegra 9.0.0 或更高版本（该版本已修复此漏洞）。如无法立即升级，可在应用服务器层面限制 SVG 文件的上传与下载，并配置 Content-Security-Policy 头以缓解 XSS 风险。同时建议审查并限制低权限用户的附件上传权限。"
score = 4.6
severity = "MEDIUM"
sources = ["zdi"]
title = "Allegra downloadAttachment 跨站脚本漏洞"
updated = "2026-07-23T09:10:00Z"

