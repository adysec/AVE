[basic]
description = "Raygun4WP 是 WordPress 的一个错误日志追踪插件，其 1.8.0 版本中的 sendtesterror.php 文件存在反射型跨站脚本（XSS）漏洞。该漏洞源于对 backurl 参数缺乏充分的输入过滤与输出编码，远程攻击者可通过构造恶意的 URL 链接，诱使用户点击后，在用户浏览器中执行任意 HTML 或 JavaScript 脚本，导致敏感信息泄露或会话劫持。攻击无需身份认证，但需要用户交互（点击链接）。该漏洞影响 Raygun4WP 1.8.0 及之前版本，CVSS 评分 6.1，危害等级中危。"
published = "2017-05-29T16:29:00Z"
remediation = "立即将 Raygun4WP 插件升级至 1.8.3 或更高版本（1.8.3 版本已移除 sendtesterror.php 中危险的 backurl 参数，改用硬编码返回链接）。如无法立即升级，可在 Web 应用防火墙（WAF）层面添加规则，对 backurl 参数进行过滤，拦截 <script> 等危险载荷；同时在 WordPress 管理员后台禁用「发送测试错误」功能作为临时缓解。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Raygun4WP 插件反射型跨站脚本漏洞"
updated = "2026-06-17T01:27:49Z"

