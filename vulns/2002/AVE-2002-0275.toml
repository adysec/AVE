[basic]
description = "GNU Mailman 2.0.12 之前版本存在跨站脚本（XSS）漏洞，远程攻击者可通过向 ml-name 功能的 adminpw 或 info 参数提交特制的订阅选项数据，在订阅者浏览器中执行恶意脚本，从而窃取会话凭证或实施钓鱼攻击。攻击者无需身份认证即可利用该漏洞，影响范围广泛。GNU 官方已在 Mailman 2.0.12 版本中修复此问题。"
published = "2002-09-05T04:00:00Z"
remediation = "升级 GNU Mailman 至 2.0.12 或更高版本，该版本修复了 adminpw 和 info 参数中的跨站脚本漏洞。如无法升级，可在 Web 服务器层面（如 Apache mod_security）对 adminpw 和 info 参数进行 HTML 实体编码过滤，阻止恶意脚本注入。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "GNU Mailman 跨站点脚本漏洞"
updated = "2026-06-16T21:58:16Z"

