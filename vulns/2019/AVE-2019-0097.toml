[basic]
description = "NETSAS Enigma NMS（网络管理系统）的 discover_and_manage CGI 脚本中存在操作系统命令注入漏洞。由于该脚本对 ip_address 变量中的 shell 元字符（如分号、管道符等）未进行有效中和处理，在 snmp_browser 操作中直接拼接并传递至系统命令执行，导致攻击者能够注入并执行任意系统命令。该漏洞影响 NETSAS Enigma NMS 65.0.0 及更早版本，任何可访问该 Web 接口的远程攻击者无需身份认证即可利用，攻击门槛极低。在成功利用后，攻击者可以完全接管目标网络管理系统，读取敏感网络配置信息、篡改管理数据或横向移动至受管设备，从而实现远程代码执行与对整体网络的持久控制。该漏洞 CVSS 评分为 9.8，危害等级严重，建议相关用户尽快升级至修复版本。"
published = "2020-03-20T00:17:08Z"
remediation = "建议立即将 NETSAS Enigma NMS 升级到已修复漏洞的最新版本（该漏洞影响 65.0.0 及更早版本，需联系厂商 NETSAS 获取含补丁的后续版本并完成升级）。若暂时无法升级，可采取以下缓解措施：1) 在网络边界防火墙或反向代理层阻断对 discover_and_manage CGI 脚本未授权的直接访问，仅允许可信管理系统网段访问；2) 在 WAF 层针对 snmp_browser 动作的 ip_address 参数添加规则，拦截含分号、管道符、$()、反引号等 shell 元字符的请求；3) 在应用层对 ip_address 输入进行严格校验，仅允许合法 IP 格式并拒绝特殊字符；4) 限制 NMS 管理账号权限并加强访问审计，及时排查异常命令执行记录。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "NETSAS Enigma NMS 操作系统命令注入漏洞"
updated = "2026-06-17T02:21:38Z"

