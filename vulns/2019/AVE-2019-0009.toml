[basic]
description = "Windows SMB 服务器在处理特定 SMB 请求时存在信息泄漏漏洞，未经身份认证的远程攻击者可通过向目标 SMB 服务发送特制的恶意请求，触发内存信息泄漏，导致敏感内存信息泄露。该漏洞影响 Windows SMB 服务组件，CVSS 3.1 评分 6.5（中危），攻击向量为网络（AV:N），攻击复杂度低（AC:L），需要低权限（PR:L），无需用户交互（UI:N），对机密性影响高（C:H），不影响完整性和可用性。攻击者可利用该漏洞泄露内存敏感信息，辅助后续攻击。Microsoft 已在 2019 年 4 月安全更新中修复此漏洞。"
published = "2019-04-09T00:29:00Z"
remediation = "建议立即安装 Microsoft 2019 年 4 月安全更新：Windows 7/Server 2008 R2 安装 KB4493472，Windows 10 1809/Server 2019 安装 KB4493509，Windows 10 1803 安装 KB4493464，Windows 10 1709 安装 KB4493441，Windows 10 1703 安装 KB4493474，Windows 10 1607/Server 2016 安装 KB4493470。如无法立即打补丁，可在防火墙层面封锁 445 端口或禁用 SMBv1 协议作为临时缓解措施，并建议限制 SMB 服务仅对可信网段开放。"
score = 6.5
severity = "MEDIUM"
sources = ["kev"]
title = "Microsoft Windows SMB 信息泄漏漏洞"
updated = "2026-06-17T02:08:43Z"

