[basic]
description = "Red Hat Linux 8.0 自带的 Gnome-lokkit 防火墙工具在生成 iptables 规则集时，未在 FORWARD 链中添加任何规则。当系统启用 IP 转发功能时，攻击者可以利用这一配置缺陷绕过防火墙的访问限制，使本应被过滤的网络流量直接通过目标系统。该漏洞影响 Red Hat Linux 8.0 及使用 Gnome-lokkit 的衍生系统，攻击者无需身份认证即可远程利用，可能导致信息泄露或进一步渗透内网。"
published = "2003-03-31T05:00:00Z"
remediation = "升级到 Red Hat Enterprise Linux 3 及以上版本，或手动编辑 gnome-lokkit 生成的 iptables 规则文件（/etc/sysconfig/iptables），在 FORWARD 链中添加默认拒绝规则（-A FORWARD -j DROP）并按需放行特定流量。如不需要路由转发功能，执行 echo 0 > /proc/sys/net/ipv4/ip_forward 禁用 IP 转发作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "Red Hat Linux Gnome-lokkit iptables 安全绕过漏洞"
updated = "2026-06-16T22:01:28Z"

