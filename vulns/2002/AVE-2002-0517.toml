[basic]
description = "Worldspan Res Manager 4.1 for Windows Gateway 存在拒绝服务漏洞。远程攻击者可通过向目标系统 TCP 端口 17990 发送特制的畸形数据包，触发服务程序处理异常导致崩溃，造成拒绝服务。该漏洞无需身份认证即可远程利用，攻击复杂度低，但仅影响服务可用性，不涉及数据机密性与完整性。Worldspan 官方未发布补丁，建议限制对 17990 端口的访问以缓解风险。"
published = "2002-10-04T04:00:00.000"
remediation = "升级 Worldspan Res Manager 至已修复的最新版本；如厂商已停止支持，应在防火墙层面限制 TCP 17990 端口的入站访问，仅允许受信任 IP 连接，或在非必要情况下直接禁用该服务以消除风险。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Worldspan Res Manager 4.1 拒绝服务漏洞"
updated = "2026-06-16T21:58:35.710"

