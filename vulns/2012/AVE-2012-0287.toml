[basic]
description = "Apple Safari 及其所依赖的 WebKit 渲染引擎在处理特制网页时存在内存破坏漏洞。攻击者可通过诱导用户访问精心构造的恶意网站，触发 WebKit 在解析 DOM、脚本执行或渲染流程中的内存访问错误，导致内存破坏和进程崩溃，从而造成拒绝服务，甚至可在目标系统上以当前用户权限执行任意代码。该漏洞属于无需认证的远程攻击，攻击者只需构造恶意网页并欺骗用户点击即可利用，攻击条件相对容易满足。该漏洞影响 Apple Safari 6.0 之前的所有版本，Apple 已于 2012 年 7 月 25 日发布安全更新（APPLE-SA-2012-07-25-1）予以修复，建议用户升级到 Safari 6.0 或更高版本以规避风险。"
published = "2012-07-25T20:55:02Z"
remediation = "建议立即将 Apple Safari 升级至 6.0 及以上版本，将 Apple iOS 升级至 6.0 及以上版本，将 Apple TV 升级至 5.1 及以上版本，以修复 WebKit 内存破坏漏洞。如无法立即升级，应通过家长控制或企业 MDM 策略禁止访问不受信任的网站，并关闭浏览器的自动填充密码功能以降低信息泄露风险。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit内存破坏远程代码执行漏洞"
updated = "2026-06-16T23:43:34Z"

