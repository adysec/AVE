[basic]
description = "Linux 内核 UBIFS 文件系统存在空指针解引用漏洞。在清除 slab 缓存时，所有内存中的 znode 被释放，导致 `c->zroot.znode` 被置为 NULL，此后若执行 TNC（Tree Node Cache）树的转储操作，程序将访问该空指针并触发内核空指针解引用。本地攻击者需具备本地低权限访问条件，可利用此漏洞导致内核拒绝服务（系统崩溃）。该漏洞影响使用 UBIFS 文件系统的 Linux 内核版本，CVSS 评分 5.5，危害等级中等。"
published = "2025-03-06T16:15:52Z"
remediation = "升级 Linux 内核至以下已修复版本之一：5.4.291、5.10.235、5.15.179、6.1.129、6.6.76、6.12.13 或 6.13.2 及以上。Ubuntu 用户可通过 apt upgrade linux-image-generic 安装最新内核，Debian 用户请参考 DLA-4178-1 和 DLA-4102-1 公告升级对应版本。若暂时无法升级内核，可避免在 UBIFS 挂载点上执行 slab cache 清理操作（如 echo 2 > /proc/sys/vm/drop_caches），以降低触发空指针解引用导致内核崩溃的风险。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux kernel UBIFS 空指针解引用漏洞"
updated = "2026-07-14T13:17:16Z"

