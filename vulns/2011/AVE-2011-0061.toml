[basic]
description = "PHP 5.3.4 之前版本中的 mt_rand 函数存在整数溢出漏洞。当应用程序向 mt_rand 函数传递超过 mt_getrandmax() 返回值的超大 max 参数时，会触发整数溢出，导致随机数生成范围被意外截断，使得攻击者能够更容易预测后续随机数返回值。该漏洞降低了随机数的不可预测性，可能被利用于绕过依赖随机数的安全机制（如 CSRF token 生成、密码重置令牌等），影响 PHP 5.3.0 至 5.3.3 版本。攻击者无需身份认证即可远程利用，但需要目标应用使用了可控的 max 参数调用 mt_rand 函数。"
published = "2011-02-02T22:00:02Z"
remediation = "升级 PHP 至 5.3.4 或更高版本，该版本已修复 mt_rand 函数中因大参数导致的整数溢出问题。如无法立即升级，可在调用 mt_rand 时限制 max 参数不超过 mt_getrandmax() 返回值，避免传入超出范围的数值。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "PHP mt_rand函数整数溢出漏洞"
updated = "2026-06-16T23:28:00Z"

