[basic]
description = "标签之间。<value>iCal 2.1 Patch 2 中的 csstart 程序在当前工作目录中搜索 cshttpd 程序时存在不安全的程序设计。本地攻击者可在某目录中创建名为 cshttpd 的特洛伊木马程序，并从该目录调用 csstart，从而执行恶意代码并获得 root 权限。该漏洞影响安装了 iCal 2.1 Patch 2 的系统，攻击条件为攻击者具备本地访问权限，CVSS 评分 7.2。"
published = "2000-12-11T05:00:00Z"
remediation = "升级到 iCal 2.1 Patch 3 或更高版本，该版本修复了 csstart 程序搜索 cshttpd 的路径遍历漏洞；若无法立即升级，可通过设置安全的 PATH 环境变量或移除当前工作目录的执行权限来防止特洛伊木马程序被执行；同时配置系统访问控制策略限制本地用户在可写目录中创建可执行文件。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "Apple iCal 本地权限提升漏洞"
updated = "2026-06-16T21:53:05Z"

