[basic]
description = "Mailman 2.0.1 及更早版本存在密码泄露漏洞。该漏洞源于程序在特定条件下以明文形式存储或传输用户密码，具有列表管理员权限的本地或远程攻击者可通过特定功能接口或配置页面获取订阅用户的明文密码。受影响版本包括 Mailman 2.0.1 及之前的所有版本，攻击者需要具备列表管理员身份认证才能利用此漏洞，成功利用后可导致用户敏感凭证泄露，进而威胁邮件列表系统的整体安全。"
published = "2001-05-03T04:00:00Z"
remediation = "立即升级到 Mailman 2.0.2 或更高版本以修复密码泄露漏洞。如暂无法升级，应临时限制列表管理员权限，仅授予可信账户，并审查现有管理员列表。"
score = 4.6
severity = "MEDIUM"
sources = ["cve"]
title = "GNU Mailman 用户密码泄露漏洞"
updated = "2026-06-16T21:54:02Z"

