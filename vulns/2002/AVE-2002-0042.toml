[basic]
description = "Analog 5.23 之前的版本中，anlgform.pl 脚本存在权限控制缺陷，未能对 PROGRESSFREQ 进度更新命令的访问进行有效限制。远程未经身份验证的攻击者可通过向该脚本发送特制请求，诱导系统以极高频率记录更新信息，导致 Web 服务器的错误日志迅速膨胀并填满磁盘空间，从而引发拒绝服务（DoS）攻击。该漏洞主要影响部署了受影响版本 Analog 的 Web 服务器，攻击条件简单，利用方式为发送特定指令触发日志溢出。"
published = "2002-10-11T04:00:00Z"
remediation = "建议将 Analog 升级到 5.23 或更高版本，以修复 anlgform.pl 对 PROGRESSFREQ 命令缺乏访问限制的问题。如无法立即升级，可通过配置 Web 服务器的日志轮转（Log Rotation）策略或限制请求频率来缓解磁盘空间被错误日志迅速填满的风险。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Analog Analog 拒绝服务漏洞"
updated = "2026-06-16T21:58:49Z"

