[basic]
description = "Google Chrome 的 V8 JavaScript 引擎存在侧信道信息泄露漏洞，该漏洞源于 V8 引擎在执行 JavaScript 代码时未能正确隔离不同来源的数据，导致攻击者可通过构造特制的 HTML 页面诱导用户访问，从而利用侧信道攻击技术窃取跨源敏感数据。攻击者无需身份认证即可远程发起攻击，但需要用户交互（如点击链接或访问恶意页面）。该漏洞影响 Google Chrome 140.0.7339.207 之前的所有版本，以及基于 Chromium 的 Microsoft Edge、Fedora 等衍生浏览器和软件。CVSS 评分 9.1，危害等级严重，可导致机密性和完整性均受到高影响。"
published = "2025-09-24T17:15:39Z"
remediation = "立即将 Google Chrome 升级至 140.0.7339.207 及以上版本，Microsoft Edge 升级至 140.0.3485.94 及以上版本，Fedora 用户更新至 chromium-140.0.7339.207。基于 Chromium 的浏览器（如 Opera、Brave 等）也应更新至对应修复版本。无法立即升级时，可禁用 V8 JIT 编译作为临时缓解措施（通过启动参数 --jitless），但会显著影响性能。"
score = 9.1
severity = "CRITICAL"
sources = ["msrc"]
title = "Google Chrome V8 侧信道信息泄露漏洞"
updated = "2026-06-17T08:29:13Z"

