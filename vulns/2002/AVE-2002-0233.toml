[basic]
description = "Apple QuickTime Player 5.01 和 5.02 版本在处理 HTTP 响应中的 Content-Type MIME 头时存在缓冲区溢出漏洞，远程攻击者可构造包含超长 Content-Type 头的恶意 HTTP 响应，诱导用户使用易受攻击的 QuickTime Player 访问恶意网站或媒体流，触发缓冲区溢出实现远程任意代码执行。该漏洞影响 Windows 和 Mac OS X 平台上的 QuickTime Player 5.01/5.02 版本，CVSS 评分 7.5（AV:N/AC:L/Au:N/C:P/I:P/A:P），属于高危漏洞。攻击者需诱导受害者访问恶意构造的 Web 页面或媒体流，无需用户交互即可触发漏洞，成功利用可导致任意代码执行，完全控制受害系统。Apple 已发布 QuickTime 6.0 修复该漏洞。"
published = "2002-05-29T04:00:00Z"
remediation = "立即完全卸载已弃用的QuickTime播放器，并使用现代浏览器（如Chrome、Edge或Firefox）播放网页视频。如果必须保留QuickTime，可找到官方安全更新版本（如QuickTime 7.6.8），并确保定期更新到最新支持版本，以彻底修复2002年CVE-2002-0252缓冲区溢漏洞。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Apple QuickTime Content-Type 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:57:04Z"

