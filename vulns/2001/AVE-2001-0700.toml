[basic]
description = "1st Up Mail Server 4.1 存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过发送超长的 MAIL FROM 命令触发该漏洞，导致拒绝服务并可能执行任意命令。该漏洞影响运行 1st Up Mail Server 4.1 的邮件服务器，攻击条件宽松，无需认证即可远程利用，CVSS 评分 10，危害等级极高。"
published = "2001-02-12T05:00:00.000"
remediation = "由于该软件版本过旧且厂商已停止维护，建议立即停止使用 1st Up Mail Server 4.1，迁移至主流且安全的邮件服务器（如 Postfix 或 Exim）。若必须临时运行，应在防火墙上严格限制 SMTP 端口（25）的访问来源，或在前端部署具有协议深度检查能力的 WAF/IPS 以拦截超长 MAIL FROM 指令。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "1st Up Mail Server 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:53:35.990"

