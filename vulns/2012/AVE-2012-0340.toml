[basic]
description = "Apple Safari 浏览器所依赖的 WebKit 渲染引擎存在内存破坏漏洞。远程攻击者可构造恶意网页，诱导用户访问后触发 WebKit 内存处理错误，从而在目标系统上执行任意代码或造成拒绝服务（应用崩溃）。该漏洞影响 Safari 6.0 之前的所有版本，涵盖 macOS 与 iOS 平台。CVSS 评分 9.3，危害等级严重。Apple 已于 2012 年 7 月发布安全更新修复此漏洞。"
published = "2012-07-25T20:55:04.180"
remediation = "立即将 Apple Safari 升级至 6.0 或更高版本，或将 iOS 升级至 iOS 6.0 及以上版本。macOS 用户可通过「系统偏好设置 → 软件更新」或访问 https://support.apple.com/kb/DL1548 获取 Safari 6.0 安装包。iOS 用户需通过 iTunes 连接设备后执行更新操作，或在设备「设置 → 通用 → 软件更新」中完成升级。更新前可临时缓解：在 Safari 中禁用 JavaScript（偏好设置 → 安全 → 取消勾选「启用 JavaScript」），或使用内容拦截器限制不受信任的网页内容加载。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari 浏览器 WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:41.210"

