[basic]
description = "Guild FTPd 0.9.7 存在路径遍历漏洞，远程攻击者可通过向 FTP 服务发送包含 `..`（点点）序列的目录请求，绕过 FTP 根目录限制访问服务器上的任意文件。由于服务器对存在和不存在的文件返回不同的错误信息，攻击者可利用此差异枚举目标系统上的文件是否存在，导致敏感信息泄露。该漏洞无需身份认证即可利用，攻击复杂度低，CVSS 评分 7.5，危害等级高。"
published = "2000-07-08T04:00:00Z"
remediation = '立即停止使用已停止维护的 Guild FTPd 0.9.7，迁移至仍受支持的 FTP 服务器软件（如 FileZilla Server、vsftpd 或 ProFTPD）。若无法立即迁移，在 FTP 服务器配置中禁用 `..` 路径遍历（如设置 `DenyFilter \\\.\\./`），并在防火墙层面限制 FTP 服务仅对可信 IP 开放。'
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "Guild FTPD 目录遍历漏洞"
updated = "2026-06-16T21:52:10Z"

