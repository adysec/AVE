[basic]
description = "Django 1.10.8之前版本及1.11.5之前版本的技术500调试页面模板中存在HTML自动转义被禁用的问题，当Django开启DEBUG=True模式时，攻击者可通过构造特制请求触发500错误页面，利用模板中未转义的输出注入恶意脚本，实现跨站脚本攻击（XSS）。该漏洞影响开启了调试模式的生产环境，攻击者无需身份认证即可实施攻击，窃取用户会话信息或执行恶意操作。建议用户关闭生产环境的DEBUG模式或升级至安全版本。"
published = "2017-09-07T13:29:00Z"
remediation = "升级 Django 至 1.10.8 或 1.11.5 及以上版本。生产环境务必关闭 DEBUG=False，禁止在线上开启调试模式。如无法立即升级，可在 Web 服务器（Nginx/Apache）层面拦截对 /technical_500/ 路径的访问作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Django 调试页面跨站脚本漏洞"
updated = "2026-06-17T01:03:56Z"

