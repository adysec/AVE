[basic]
description = "eXtremail 邮件服务器 1.1.9 及更早版本中存在格式化字符串漏洞，该漏洞位于 flog 日志记录函数中。远程攻击者无需身份认证即可在 SMTP 协议的 HELO、EHLO、MAIL FROM、RCPT TO 命令以及 POP3 协议的 USER 等命令中注入格式化字符串占位符（如 %x、%n），触发内存读写操作，最终导致攻击者获取目标系统的 root 最高权限。该漏洞 CVSS 评分 10.0，危害等级严重，影响所有运行受影响版本 eXtremail 的邮件服务器。"
published = "2001-06-21T04:00:00Z"
remediation = "eXtremail 已停止维护，官方未发布修复该格式字符串漏洞的补丁版本。建议立即迁移至其他受支持的邮件服务器软件（如 Postfix、Dovecot）。作为临时缓解措施，在防火墙上限制对 SMTP（25/TCP）和 POP3（110/TCP）端口的访问，仅允许可信 IP 连接，并监控日志中异常的格式说明符（%s、%n 等）输入。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "eXtremail 邮件服务器远程格式字符串漏洞"
updated = "2026-06-16T21:55:32Z"

