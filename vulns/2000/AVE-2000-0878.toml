[basic]
description = "Stalkerlab Mailers 1.1.2 中的 CGIMail.exe CGI 程序存在任意文件读取漏洞。远程攻击者可通过向该 CGI 程序发送特制的 HTTP 请求，在 $Attach$ 隐藏表单变量中指定目标文件路径，从而读取服务器上的任意文件内容。该漏洞利用条件较低，攻击者无需身份认证即可实施，但需要用户交互（如点击链接）。影响范围包括运行 Stalkerlab Mailers 1.1.2 的 Web 服务器，可能导致敏感信息泄露。"
published = "2000-10-20T04:00:00.000"
remediation = "立即停止使用 Stalkerlab Mailers 1.1.2，该产品已停止维护多年。删除或禁用 Web 目录下的 CGIMail.exe 文件，并迁移至受支持的现代邮件服务器软件（如 Postfix、Exim 等）。在 Web 服务器层面限制 .exe CGI 脚本的执行权限作为临时缓解措施。"
score = 2.6
severity = "LOW"
sources = ["epss"]
title = "Stalkerlab Mailers CGIMail.exe 任意文件读取漏洞"
updated = "2026-06-16T21:52:21.180"

