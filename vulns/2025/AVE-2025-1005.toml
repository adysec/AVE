[basic]
description = "Linux内核KVM子系统的x86虚拟化模块存在调试寄存器竞争条件漏洞。当访客虚拟机禁用调试寄存器拦截后，KVM在VM-Enter时将访客DR6值加载到硬件寄存器，但该加载操作位于.vcpu_run()核心循环内部，而保存操作却由通用代码在循环外部执行。在嵌套虚拟化场景（如KVM-on-KVM）下，若二级访客修改DR6后触发快速路径VM-Exit（例如VMX抢占计时器中断），KVM将用过时的宿主机DR6缓存值覆盖硬件寄存器，导致访客实际DR6值被破坏。该漏洞影响启用Intel VT-x或AMD-V嵌套虚拟化功能并运行受影响Linux内核版本的宿主机系统。攻击者需具备本地访客虚拟机中的低权限访问权限，无需用户交互即可利用。成功利用可能导致宿主机hypervisor调试状态紊乱、虚拟机崩溃或拒绝服务，CVSS评分7.3，危害等级为高。"
published = "2025-03-07T09:15:16Z"
remediation = "建议立即升级 Linux 内核到修复版本：Red Hat Enterprise Linux 9 升级至 kernel-5.14.0-570.17.1.el9_5 或更高版本（RHSA-2025:20518）；Debian 12 升级至 linux-image-6.1.123-1 或更高版本（DSA-5925）；SUSE Linux Enterprise 15 SP7 升级至 kernel-default-6.4.0-150600.23.30.1 或更高版本（SUSE-SU-2025:02997-1）；Ubuntu 22.04 LTS 升级至 linux-image-5.15.0-139-generic 或更高版本（USN-7686-1）。如无法立即升级，可暂时禁用嵌套虚拟化（在内核参数添加 kvm_intel.nested=0 kvm_amd.nested=0）作为临时缓解措施。"
score = 7.3
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 KVM x86 调试寄存器 DR6 状态覆盖漏洞"
updated = "2026-07-30T06:21:40Z"

