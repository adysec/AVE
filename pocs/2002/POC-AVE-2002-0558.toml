[info]
author = "AVE"
description = "向目标DNS服务器发送包含超大UDP负载(65535字节)的OPT资源记录(EDNS0)的DNS查询请求，触发BIND 8.3.0-8.3.3断言失败导致进程崩溃，造成拒绝服务。通过raw UDP socket构造并发送特制DNS报文。"
id = "POC-AVE-2002-0558"
name = "ISC BIND 8.3.x OPT Record Large UDP Denial of Service PoC"
severity = "medium"
tags = ["cve-2002-1220"]
vuln_id = [
    "CVE-2002-1220",
    "AVE-2002-0558",
]

[poc]
logic = "all"

[[poc.requests]]
dns_type = "A"
path = "{{Hostname}}"
protocol = "dns"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["response"]
