[basic]
description = "Windows 2000 Server、Advanced Server 及 Datacenter Server 的域控制器存在拒绝服务漏洞。该漏洞源于域控制器上核心服务未正确验证服务请求，攻击者可通过发送大量格式错误的请求数据包，触发服务执行资源密集型的无效处理而非直接丢弃，从而消耗目标系统大量CPU资源。此漏洞仅影响域控制器，不影响成员服务器或工作站。攻击者可导致域控制器无法正常响应合法请求，影响新用户登录、Kerberos票据签发及Active Directory查询。不过攻击不会导致系统崩溃，当攻击流量停止后服务会自动恢复。该漏洞可通过防火墙阻止外部直接访问域控制器来缓解。微软已在安全公告 MS01-011 中发布补丁 Q287397，后续被 MS01-024 取代，Windows 2000 Service Pack 3 已包含修复。"
published = "2001-07-21T00:00:00Z"
remediation = "安装 Microsoft 安全公告 MS01-011 补丁 Q287397（已包含于 Windows 2000 Service Pack 3），该补丁使域控制器服务能正确识别并丢弃畸形请求而非消耗 CPU 资源处理。由于 Windows 2000 已终止支持，建议迁移至 Windows Server 2019 或更高受支持版本。临时缓解措施：在防火墙中限制仅允许可信内网访问域控制器端口，部署多台域控制器分担负载，并在网络边缘部署 IDS 过滤畸形服务请求。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft Windows 2000 消息请求泛洪拒绝服务漏洞"
updated = "2001-07-21T00:00:00Z"

