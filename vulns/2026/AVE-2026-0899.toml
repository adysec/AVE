[basic]
description = "建伍（Kenwood）DNR1007XR 车载影音导航接收机存在 USB 文件系统挂载点默认权限设置不当漏洞。该漏洞由 FPT NightWolf 团队 TienPP 在 Pwn2Own 大赛中发现，源于产品对 USB 文件系统挂载点目录配置了不正确的默认权限，使本应受限的目录可被低权限用户访问。物理接触设备的攻击者在已获得低权限代码执行能力的前提下，可利用此权限缺陷读取、写入或修改受保护的系统文件，从而将权限提升至 root 并执行任意代码。该漏洞 CVSS 评分为 6.6，危害等级中等。"
published = "2026-01-01"
remediation = '''
立即将 Kenwood DNR1007XR（2020 款）固件升级至 2026-07-21 发布的安全更新版本（下载文件 S_V2_0_0003_1000.zip），从 Kenwood 官网固件更新页面（https://www.kenwood.com/cs/ce/mm/firmware/2020/2020f/eng.html）下载，并严格按照官方"2020 Navigation/Multimedia receiver Firmware Update Guide"说明安装，该版本已修复 Pwn2Own Automotive 2026 披露的本漏洞。在完成升级前，应限制对设备的物理访问，防止不可信人员接触设备及 USB 端口；如条件允许，可禁用非授权 USB 存储设备的挂载，或收紧 USB 文件系统挂载点目录的权限，避免低权限用户利用默认错误权限的目录提权至 root。"""
```

