[basic]
description = "Microsoft Office Visio 存在堆缓冲区溢出漏洞（CWE-122），攻击者可通过诱导用户打开特制的 Visio 文件触发该漏洞。成功利用此漏洞的攻击者可在当前用户上下文中执行任意代码，实现完全控制目标系统。该漏洞攻击复杂度低，无需特殊权限，但需要用户交互。影响范围涵盖受支持的 Microsoft Office Visio 版本。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:16:01.130"
remediation = "建议立即通过 Microsoft Update 或访问 https://aka.ms/OfficeSecurityReleases 安装 2025 年 1 月 Visio 安全更新。对于 Microsoft 365 订阅用户，确保已启用自动更新并重启 Office 应用。对于 Office LTSC 2019/2021/2024 用户，请运行 Windows Update 或手动下载对应版本的安全更新包进行安装。临时缓解措施：不要打开来自不可信来源的 Visio 文件（.vsd/.vsdx），并在组策略中禁用 Visio 中的 ActiveX 和宏执行。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Office Visio 远程代码执行漏洞"
updated = "2026-06-17T08:43:10.997"

