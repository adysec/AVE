[basic]
description = "Linux 内核 TPM（可信平台模块）子系统的 eventlog/acpi.c 文件中存在内存分配缺陷，原代码使用常规内存分配函数处理 ACPI 平台事件日志，当处理大块内存时可能导致分配失败，进而引发内核信息泄露或拒绝服务。该漏洞影响使用 Linux 内核 TPM 模块的系统，攻击者可通过本地触发特定 ACPI 事件日志操作，利用不恰当的内存分配机制造成内核内存访问异常。Red Hat 将该漏洞评为 Moderate 危害等级。Linux 内核社区已通过改用 kvalloc() 函数修复此问题，该函数支持大内存分配并自动回退到 vmalloc 机制。"
published = "2025-02-27T00:00:00Z"
remediation = "立即将 Linux 内核升级至 6.13.3、6.12.14 或 6.6.78 及以上版本；使用长期支持分支（5.10/5.15/6.1）的用户应升级至 5.10.235、5.15.179 或 6.1.130 及以上版本。Siemens SIMATIC S7-1500 MFP 用户请参考 Siemens 安全公告 SSA-503939 更新固件。如无法立即升级内核，可通过限制本地用户对 TPM 设备的访问权限作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux Kernel TPM 事件日志内存分配漏洞"
updated = "2025-02-27T00:00:00Z"

