[basic]
description = "Htgrep CGI 程序存在任意文件读取漏洞，远程攻击者无需身份认证即可通过向 hdr 参数传入目标文件的完整路径，读取服务器上的任意敏感文件（如 /etc/passwd、配置文件等），导致敏感信息泄露。该漏洞影响部署了 htgrep CGI 程序的 Web 服务器，攻击复杂度低，利用方式简单。"
published = "2000-11-14T05:00:00Z"
remediation = "立即删除或禁用服务器上的 htgrep CGI 脚本（通常位于 cgi-bin/htgrep），如业务需要可替换为有输入验证的替代方案。若无法删除，在 Web 服务器配置中限制 htgrep 脚本的访问来源 IP，并对 hdr 参数做严格的路径白名单过滤，禁止包含 `../` 等目录遍历字符。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Htgrep CGI 任意文件读取漏洞"
updated = "2026-06-16T21:52:33Z"

