[basic]
description = "DotNetNuke（DNN）9.2.0之前版本中的DnnImageHandler类存在服务端请求伪造（SSRF）漏洞。未经身份认证的远程攻击者可通过向目标系统发送特制的HTTP请求，利用ImageHandler组件发起内部网络资源探测，从而获取内网敏感信息。该漏洞影响所有DNN 9.2.0之前版本，CVSS评分7.5，危害等级高。官方已在9.2.0版本中修复此漏洞，建议用户及时升级。"
published = "2018-07-03T21:29:00Z"
remediation = "建议立即将 DotNetNuke (DNN) 升级至 9.2.0 或更高版本，该版本已修复 DnnImageHandler 类中的 SSRF 漏洞。如无法立即升级，可在 Web 应用防火墙 (WAF) 层面添加规则，阻止向内部网络地址（如 127.0.0.1、10.x.x.x、172.16-31.x.x、192.168.x.x）发起的出站请求，作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "DNN (DotNetNuke) DnnImageHandler 服务端请求伪造漏洞"
updated = "2026-06-17T00:58:32Z"

