[basic]
description = "DeltaScripts PHP Classifieds 6.0.5 存在跨站脚本（XSS）漏洞。由于该版本在处理 URL 参数时缺乏充分的输入过滤与输出编码，远程攻击者可将恶意的 JavaScript 脚本注入到参数中，诱使其他用户在浏览器中执行该脚本，从而冒充受害者实施会话劫持、窃取 Cookie 或篡改页面内容等操作。攻击需要诱导目标用户访问特制的恶意链接，且靶机需使用支持该参数的 Web 界面，属于中危漏洞，CVSS 评分 4.3。"
published = "2002-12-31T05:00:00Z"
remediation = "由于 DeltaScripts PHP Classifieds 6.0.5 已停止维护，首先建议升级到仍有维护的同类二手分类信息脚本或迁移至主流开源二手市场系统（如 osclass 等），从根源消除漏洞；同时升级至全新的 6.0.6 及以后修复版本。若无法升级，应在代码层对所有 `$_GET`、`$_POST`、`$_REQUEST` 等用户输入参数和输出前统一进行 HTML 实体编码（如 `htmlspecialchars($url, ENT_QUOTES)`）并校验 URL 参数仅允许 http/https 白名单协议，使用参数化处理；在网络层配置 WAF 规则拦截针对 URL 参数的跨站脚本（XSS）攻击载荷并对输入长度做限制，以降低被利用风险。"
score = 4.3
severity = "MEDIUM"
sources = ["exploitdb"]
title = "DeltaScripts PHP Classifieds 跨站脚本执行漏洞"
