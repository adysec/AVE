[basic]
description = "NetWin DMailWeb 和 CWMail 2.6g 版本的 POP 服务器存在安全配置缺陷，默认配置下信任所有 POP 服务器，导致远程攻击者无需有效认证即可绕过身份验证机制，向目标服务器发送恶意构造的 POP 请求，从而触发拒绝服务状态。该漏洞影响 NetWin DMailWeb 及 CWMail 2.6g 版本，攻击者无需任何权限即可通过网络远程利用，CVSS 评分 5.0，危害等级中等。目前厂商已发布相关修复建议，建议用户升级至最新版本或修改默认信任配置以降低风险。"
published = "2000-06-23T04:00:00Z"
remediation = "该产品已停止维护，官方不再提供安全更新。建议立即迁移至受支持的邮件服务器软件（如 Dovecot 或 Microsoft Exchange），并停用 dMailWeb/cwMail 服务。若无法立即迁移，可在 dMailWeb/cwMail 配置文件中将 trusted_pop_servers 参数设为空列表，仅允许本地认证，同时在防火墙限制仅信任的 POP 服务器 IP 访问 110 端口，以降低攻击面。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "NetWin dMailWeb/cwMail POP服务器默认信任配置拒绝服务漏洞"
updated = "2026-06-16T21:52:06Z"

