[basic]
description = "Balabit syslog-ng 1.4.6、1.4.7 及 1.4.8 版本存在拒绝服务漏洞。远程攻击者可通过向目标 syslog-ng 服务发送特制的畸形日志消息，该消息在优先级说明符中缺少闭合的 > 符号，导致服务解析异常崩溃，造成拒绝服务。攻击无需身份认证，通过网络即可触发，利用难度低，但仅影响系统可用性，不涉及机密性和完整性。受影响的 syslog-ng 版本需及时升级至 1.4.9 或更高版本以修复此漏洞。"
published = "2001-01-09T05:00:00.000"
remediation = "立即升级 syslog-ng 至 1.4.9 或更高版本（如 1.4.10）。FreeBSD 用户可通过 ports collection 更新或直接安装预编译包 syslog-ng-1.4.10.tgz。如无法升级，可删除 syslog-ng 改用系统自带 syslogd，或使用 watchdog 进程（如 daemontools/supervise）监控 syslog-ng 进程，在崩溃后自动重启作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Balabit syslog-ng 日志优先级解析拒绝服务漏洞"
updated = "2026-06-16T21:53:17.767"

