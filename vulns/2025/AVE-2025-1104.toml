[basic]
description = "Linux 内核跟踪（tracing）子系统存在释放后重用漏洞。当用户在 ftrace 功能图追踪器（function_graph）运行期间通过写入 current_tracer 文件切换到其他追踪器（如 timerlat）时，print_graph_function_flags() 函数中的 iter-&gt;private 指针在 graph_trace_close() 中被释放后未置为 NULL，导致后续旧追踪器的回调函数仍可能访问已释放的内存。具备本地低权限访问权限的攻击者可通过在 s_start() 中触发竞态条件（如在 mutex_unlock(&trace_types_lock) 后插入延迟），在读取 trace 文件的同时切换追踪器，从而利用该释放后重用漏洞实现任意代码执行或权限提升。该漏洞影响运行受影响内核版本的 Linux 系统，CVSS 评分为 7.8。"
published = "2025-04-16T15:15:56Z"
remediation = "建议立即升级 Linux 内核至修复版本：Ubuntu 25.04 升级至 6.14.0-22.22，Debian 11/12 分别应用 DLA-4178 和 DSA-5907 补丁，RHEL/CentOS 7 升级至 5.4.292-208.414，RHEL/CentOS 8 升级至 5.10.236-227.928，SUSE Linux Enterprise 15 SP7 应用 SUSE-SU-2025:02307-1。如无法立即重启，可临时通过 chmod 700 /sys/kernel/debug/tracing 限制普通用户访问 ftrace 接口，或禁用 function_graph 和 timerlat tracer 以缓解利用条件。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 tracing 释放后重用漏洞"
updated = "2026-06-17T08:44:53Z"

