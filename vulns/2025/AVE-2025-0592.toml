[basic]
description = "Google Chrome Android 版本 133.0.6943.126 之前及基于 Chromium 的 Microsoft Edge 133.0.3065.82 之前版本中，GPU 组件存在堆缓冲区溢出漏洞（CWE-122）。远程攻击者可通过诱导用户访问精心构造的恶意 HTML 页面，触发 GPU 进程中的堆缓冲区溢出导致堆内存损坏，进而可能实现远程代码执行。攻击向量为网络（AV:N），攻击复杂度低（AC:L），无需权限（PR:N）但需要用户交互（UI:R），CVSS 3.1 评分 8.8（HIGH），机密性/完整性/可用性影响均为高。影响范围涵盖 Android 版 Chrome 及基于 Chromium 的 Edge 浏览器，Google 已在 133.0.6943.126 版本中修复该漏洞。"
published = "2025-02-19T17:15:15Z"
remediation = '建议立即将 Android 版 Google Chrome 升级至 133.0.6943.126 或更高版本（通过 Google Play 商店更新）；Windows/macOS/Linux 用户同步升级 Chrome 至 133.0.6943.126 及以上版本；Microsoft Edge 用户升级至 133.0.3065.82 或更高版本。若无法立即更新，可暂时在浏览器设置中禁用 GPU 硬件加速（设置 → 系统 → 关闭"在可用时使用图形加速"），并避免访问不可信网页，作为临时缓解措施。'
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome GPU 堆缓冲区溢出漏洞"
updated = "2026-06-17T08:39:06Z"

