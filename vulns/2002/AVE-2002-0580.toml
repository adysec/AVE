[basic]
description = "tags.<value>FUDforum 的 tmp_view.php 脚本存在文件路径遍历漏洞，该脚本未对 file 参数进行充分验证和过滤，允许远程攻击者通过传入绝对路径名读取服务器上的任意文件。攻击者无需身份认证，只需向目标站点发送包含特制 file 参数的 HTTP 请求，即可获取配置文件、源代码等敏感信息。该漏洞影响 FUDforum 1.2.8、1.9.8、2.0.2 及之前版本，CVSS 评分 5.0，危害等级中等。"
published = "2003-04-11T04:00:00.000"
remediation = "升级到 FUDforum 2.2.0 或更高版本，该版本已修复 tmp_view.php 中因未校验 file 参数绝对路径导致的任意文件读取漏洞。对于无法立即升级的实例，可临时禁用或删除 tmp_view.php，并在 Web 服务器层面对其设置访问限制，同时检查并清理服务器上可能已遭泄漏的敏感配置文件。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "FUDForum 文件泄漏漏洞"
updated = "2026-06-16T21:59:18.087"

