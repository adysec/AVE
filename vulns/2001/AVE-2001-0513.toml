[basic]
description = "Linux 内核 2.2.19 之前版本中的分类器（classifier）代码存在未知漏洞，本地攻击者可通过向系统发送特制的网络数据包触发该漏洞，导致内核挂起，造成拒绝服务。该漏洞影响 Linux 内核 2.2.19 之前的所有版本，攻击者需要具备本地系统访问权限，无需身份认证即可利用，危害等级低。由于漏洞原理细节未公开，目前尚无官方补丁以外的缓解措施。"
published = "2001-04-17T04:00:00Z"
remediation = "升级 Linux 内核至 2.2.19 或更高版本，该版本修复了 classifier 代码中的未知漏洞。如无法立即升级，可禁用相关流量分类功能模块作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Linux Kernel 分类器代码拒绝服务漏洞"
updated = "2026-06-16T21:56:11Z"

