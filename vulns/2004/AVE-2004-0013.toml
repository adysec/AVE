[basic]
description = 'eXtropia Shopping Cart 的 web_store.cgi 脚本存在远程命令执行漏洞，由于未对用户输入进行充分过滤，攻击者可在 page 参数中注入 shell 元字符（如管道符"|"），从而在服务器上执行任意系统命令。该漏洞无需身份认证，攻击者只需通过网络访问目标服务器上的 web_store.cgi 脚本即可发起利用。ExploitDB 上公开了完整的利用代码，攻击者可通过构造包含反向 shell 的 HTTP 请求，将 Perl 反弹 shell 脚本写入服务器并执行，进而获得服务器的完整控制权限。该漏洞影响部署了 eXtropia Shopping Cart 的所有 Web 服务器，CVSS 评分为 7.5，危害等级高。'
published = "2004-07-27T04:00:00Z"
remediation = "由于 eXtropia Shopping Cart 项目已长期停止维护且无官方补丁，建议尽快将系统迁移至受持续支持的在线购物平台（如 osCommerce、Zen Cart 或 Magento），并确保目标版本不受类似命令注入漏洞影响。如短期内无法完成迁移，应立即在 Web 服务器层面对 web_store.cgi 的请求实施过滤规则，禁止 page 参数中包含管道符（|）、分号（;）、反引号（`）等 shell 元字符，或在 Apache/Nginx 配置中添加规则直接阻断对该 CGI 脚本的访问，同时建议将 web_store.cgi 的执行权限移除，改用静态页面替代，以彻底消除攻击面。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "eXtropia Shopping Cart 远程命令执行漏洞"
updated = "2026-06-16T22:06:15Z"

