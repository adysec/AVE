[basic]
description = "qDecoder 4.x/5.x 库存在远程缓冲区溢出漏洞。该库广泛应用于 CrazyWWWBoard、CrazySearch 及其他 CGI 程序中。未经身份认证的远程攻击者可以通过向目标 CGI 程序发送特制的 HTTP 请求，其中 MIME Content-Type 头部字段包含超长字符串，从而触发缓冲区溢出，覆盖返回地址并执行任意远程命令。该漏洞攻击条件极低，仅需网络访问即可触发，无需用户交互或认证。攻击者可利用此漏洞完全控制受影响服务器，导致机密性、完整性和可用性全部受损， CVSS 评分为 10.0（严重）。漏洞影响范围包括所有使用 qDecoder 5.08 及更早版本的基于 CGI 的 Web 应用程序。"
published = "2001-05-03T04:00:00.000"
remediation = "请立即升级到 qDecoder 5.0.9 或更高版本，该版本修复了 Content-Type 头部缓冲区溢出漏洞。若暂时无法升级，可在 Web 服务器或 WAF 层配置规则，限制 HTTP 请求中 Content-Type 头部的最大长度为 254 字符以下，并拒绝包含异常长字符串的请求，以阻断远程代码执行攻击。同时建议审查所有基于 qDecoder 的 CGI 程序（如 CrazyWWWBoard、CrazySearch）并替换为已修复版本的库文件。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "qDecoder 库 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:53:48.583"

