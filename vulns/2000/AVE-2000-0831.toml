[basic]
description = "Koules 1.4 的 Svgalib 图形库组件存在本地缓冲区溢出漏洞。攻击者可通过向程序提交超长的命令行参数触发缓冲区溢出，从而在目标系统上以当前用户权限执行任意代码。该漏洞需要攻击者拥有本地访问权限，利用难度较低，成功利用后可完全控制受影响系统。CVSS 评分 7.2，危害等级高。"
published = "2001-01-09T05:00:00Z"
remediation = "立即移除 koules.sndsrv.linux 二进制文件的 setuid root 权限：执行 `chmod u-s /usr/local/lib/koules/koules.sndsrv.linux` 或 `chmod 755 /usr/local/lib/koules/koules.sndsrv.linux`。如无需使用该游戏，直接卸载整个 koules 软件包。如需继续使用，改用 X11 版本（不依赖 svgalib 且无需 setuid），或升级到已修复此漏洞的 Koules 1.5 及以上版本。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Jan Hubicka Koules 1.4 Svgalib 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:53:19Z"

