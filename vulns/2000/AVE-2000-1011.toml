[basic]
description = "IMP（互联网邮件协议）Web 邮件系统 2.2 及更早版本存在任意文件读取与删除漏洞。攻击者可通过修改表单中的 attachment_name 隐藏字段值，诱使服务器将目标文件作为邮件附件发送给攻击者，从而实现任意文件读取。该漏洞源于对用户输入验证不充分，攻击者无需身份认证即可远程利用，导致敏感信息泄露。CVSS 评分 5.0，危害等级中危。"
published = "2000-12-19T05:00:00Z"
remediation = "升级 IMP 至 2.3 或更高版本，该版本已修复 attachment_name 隐藏表单变量未校验的问题。如无法升级，修改源代码中 attachment_name 处理逻辑，对用户提交的 attachment_name 值进行路径白名单校验，禁止包含 ../ 等目录遍历字符，并限制只能操作临时附件目录内的文件。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Horde IMP 任意文件读取和删除漏洞"
updated = "2026-06-16T21:52:44Z"

