[basic]
description = "tags.<value>Xconq 和 cconq 游戏程序存在缓冲区溢出漏洞，攻击者可通过设置过长的 USER 环境变量触发该漏洞。本地用户利用此漏洞可获取额外的系统权限，进而提升本地访问权限。该漏洞影响 Red Hat Linux 系统上的 Xconq 7.2.2 及 cconq 相关程序，CVSS 评分为 4.6，危害等级较低。利用条件为攻击者需具备本地用户身份，通过构造超长的 USER 环境变量值即可触发缓冲区溢出，实现本地权限提升。"
published = "2000-06-22T04:00:00.000"
remediation = "升级 xconq/cconq 至厂商修复版本，限制 USER 环境变量长度（如设为不超过 256 字节），或临时卸载 xconq 和 cconq 游戏程序以消除攻击面。"
score = 4.6
severity = "MEDIUM"
sources = ["epss"]
title = "Stanley T. Shebs Xconq 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:52:07.173"

