[basic]
description = 'CGIScript.net csNews 1.0 的 csNews.cgi 存在文件类型限制绕过漏洞。远程认证用户可通过在"高级设置"功能中向 pheader 或 pfooter 参数传入特制路径，绕过文件类型检查，读取服务器上的任意文件，并可能进一步获取系统权限。攻击者只需拥有合法用户凭据即可利用，无需其他特殊条件。该漏洞 CVSS 评分 7.5，危害等级高，影响运行 csNews 1.0 的 Web 服务器。'
published = "2002-10-04T04:00:00.000"
remediation = "厂商 CGIScript.net 已停止维护 csNews 1.0，建议立即停止使用该产品并迁移至其他仍在维护的新闻管理系统。如无法立即替换，应严格限制对 csNews 管理后台的访问权限，通过 Web 服务器（如 Apache/Nginx）配置仅允许可信 IP 访问 /cgi-bin/csNews.cgi 路径，同时在 Advanced Settings 中移除 pheader 和 pfooter 参数中的文件路径配置，避免传入任意文件路径。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "CGIScript.net csNews 1.0 文件读取与权限提升漏洞"
updated = "2026-06-16T21:58:23.830"

