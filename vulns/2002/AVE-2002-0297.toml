[basic]
description = "KDE 浏览器 Konqueror（版本 2.2.2 及 3.0 至 3.0.3）在处理子框架（sub-frames）和子内联框架（sub-iframes）时，未能正确初始化域名，导致其跨站脚本（XSS）防护机制失效。远程攻击者可以通过诱导用户访问特制的恶意网页，利用该漏洞在其他域名的子框架中执行任意脚本，从而实现窃取用户 Cookie 等敏感信息。该漏洞影响范围包括上述特定版本的 Konqueror 浏览器，攻击条件为用户访问受控页面。"
published = "2002-10-11T04:00:00Z"
remediation = "建议将 KDE 升级至 3.0.4 或更高版本，以修复 Konqueror 在处理子框架域初始化时的逻辑缺陷。对于无法立即升级的用户，建议临时禁用浏览器中不必要的框架加载功能，或切换至安全性更高的现代浏览器。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "KDE Konqueror 跨站脚本漏洞"
updated = "2026-06-16T21:58:49Z"

