[basic]
description = "LG N1A1 NAS 设备固件版本 3718.510 存在远程命令执行漏洞，攻击者可通过 HTTP POST 请求向设备发送特制参数，在未经身份认证的情况下远程执行任意系统命令。该漏洞源于设备未对用户输入进行有效过滤，导致 OS 命令注入（CWE-78）。攻击者无需任何权限即可利用，CVSS 评分 9.8，危害等级严重，可导致设备完全受控。建议用户立即升级固件或限制设备管理接口的网络访问。"
published = "2019-05-14T21:29:00Z"
remediation = "立即将 LG N1A1 NAS 固件升级至厂商发布的最新版本（高于 3718.510）。如无法升级，在防火墙上将 NAS 管理端口（80/443）仅限可信管理 IP 访问，禁止从公网直接访问 NAS Web 管理界面，并禁用不必要的 CGI 功能模块作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "LG N1A1 NAS 远程代码执行漏洞"
updated = "2026-06-17T01:41:44Z"

