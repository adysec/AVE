[basic]
description = "Dragonfly 调度器（scheduler）的 v1/v2 gRPC 服务存在未认证的服务端请求伪造（SSRF）漏洞。当 peer 报告 TINY 类型任务下载成功时，调度器会调用 `Peer.DownloadTinyFile()` 方法，向攻击者控制的 `PeerHost.Ip` 和 `PeerHost.DownPort` 字段指定的地址发起 HTTP GET 请求。由于 HTTP 客户端使用裸 `http.Transport` 且未对目标地址进行任何校验，远程未认证攻击者可强制调度器连接任意内网地址，包括 127.0.0.1（回环地址）、169.254.0.0/16（链路本地地址，如云元数据服务）及 RFC1918 私有地址。获取的响应内容被存储在 `Task.DirectPiece` 中，并可被其他 peer 获取，形成数据外泄路径。该漏洞影响 Dragonfly v2.4.4-rc.2 及之前版本，CVSS 评分 6.5，危害等级中危。官方修复方案为在 `DownloadTinyFile` 的 HTTP 传输层添加 `nethttp.NewSafeDialer().DialContext` 以拒绝非全局单播地址。"
published = "2026-01-01T00:00:00Z"
remediation = "升级 Dragonfly scheduler 至包含修复的版本（≥v2.4.5），或在 `scheduler/resource/standard/peer.go` 的 `DownloadTinyFile` 函数中将 `http.Transport` 的 `DialContext` 设置为 `nethttp.NewSafeDialer().DialContext` 以拒绝非全局单播地址。同时建议在 `scheduler/config/config.go` 中配置 `Server.TLS` 启用 mTLS 认证，并在 `storeHost` 函数中增加 `peerHost.Ip` 的地址校验，拒绝回环地址（127.0.0.0/8）和链路本地地址（169.254.0.0/16）。"
score = 5.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Dragonfly Scheduler gRPC 未授权服务端请求伪造漏洞"
updated = "2026-01-01T00:00:00Z"

