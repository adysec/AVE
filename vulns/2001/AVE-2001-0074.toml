[basic]
description = "man命令在处理-l参数时存在格式字符串漏洞，未经身份认证的本地攻击者可通过向man命令传递特制的-l参数触发该漏洞，进而实现权限提升并执行任意代码。该漏洞影响Debian 2.2、S.u.S.E 6.3/6.4/7.0等Linux发行版。攻击者需已登录目标系统并具备执行man命令的权限，通过构造包含格式说明符的恶意参数即可利用此漏洞覆盖内存中的关键数据，最终获取root权限并在受影响系统上执行任意指令。"
published = "2001-05-03T04:00:00Z"
remediation = "对于 Debian 2.2 系统，应立即升级 man-db 包至 2.3.17-3.1 或更高版本（Debian Security Advisory DSA-028）。对于 S.u.S.E 6.3/6.4/7.0 系统，应安装 SUSE 发布的安全更新补丁，将 man 程序升级至修复格式字符串漏洞的版本。如暂无法应用补丁，可通过临时移除 man 程序的 SUID 权限（执行 chmod u-s /usr/bin/man）作为缓解措施，但会丧失普通用户查看手册页的能力；更稳妥的临时方案是使用文件系统访问控制限制本地用户执行 man -l 参数，或升级至较新的 Linux 发行版以彻底消除该漏洞。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Debian SuSE Linux man 命令格式字符串漏洞"
updated = "2026-06-16T21:53:51Z"

