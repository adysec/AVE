[basic]
description = 'Oracle 8.1.6 中的 oidldapd 组件存在缓冲区溢出漏洞，本地用户可通过向 "connect" 命令行参数传递超长字符串触发该漏洞，成功利用后可获取目标系统的提升权限，实现机密性、完整性和可用性的部分破坏。该漏洞攻击复杂度低，无需身份认证，但需要本地访问权限。CVSS 评分 4.6，危害等级中危。Oracle 已在后续版本中修复此漏洞。'
published = "2000-12-19T05:00:00Z"
remediation = "Oracle 8.1.6 已停止支持，建议升级到受支持的 Oracle 数据库版本（如 19c 或 21c）。如无法升级，可移除 oidldapd 二进制文件的 setuid 权限（chmod u-s /path/to/oidldapd），或限制仅可信任用户执行该程序，同时通过本地防火墙和文件系统权限控制访问。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Oracle 8.1.6 oidldapd 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:55Z"

