[basic]
description = "SuSE Linux 6.3/6.4 默认 Apache 配置（httpd.conf）中为 /usr/doc 目录设置了别名映射，远程攻击者无需身份认证即可通过 HTTP 请求 /doc/packages URL 访问系统上的软件包文档，从而获取已安装软件列表、版本信息及系统配置细节。该信息泄露漏洞可被攻击者用于收集目标环境情报，为后续针对性攻击提供依据。攻击者只需向目标服务器发送特制 HTTP 请求即可利用，无需复杂前置条件。"
published = "2000-12-11T05:00:00.000"
remediation = "编辑 Apache 配置文件 httpd.conf，删除或注释掉 `Alias /doc/ /usr/doc/` 行，然后重启 Apache 服务。如无法立即修改配置，可在 `/usr/doc/` 目录下创建空白 index.html 或通过防火墙限制对 `/doc/` 路径的访问。建议升级到 SuSE Linux 7.0 或更高版本以彻底修复。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "SuSE Linux Apache 默认配置信息泄露漏洞"
updated = "2026-06-16T21:52:58.657"

