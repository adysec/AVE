[basic]
description = "McAfee Network Data Loss Prevention (NDLP) 9.3.x 版本的服务端存在 HTTP 头部跨站脚本 (XSS) 漏洞。该漏洞源于服务器对 HTTP 请求头部缺乏充分的输入验证与输出编码，远程攻击者可构造包含恶意脚本的 HTTP 请求头（如 User-Agent、Referer 等），诱导管理员访问受影响的 NDLP 管理控制台页面时触发脚本执行。成功利用可窃取管理员的会话 Cookie、会话令牌等敏感信息，进而劫持管理员会话、执行任意管理操作。攻击条件为：目标运行 NDLP 9.3.x、攻击者能发送 HTTP 请求到服务器、管理员需访问包含恶意头部的页面（需用户交互 UI:R）。CVSS 3.0 评分 6.1（中危），向量 AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N。影响范围限于 McAfee NDLP 9.3.x 系列产品。"
published = "2017-05-17T21:29:00Z"
remediation = '''升级到McAfee Network Data Loss Prevention 12.0或更高版本，应用2020-2022年度全部安全补丁包；修改NDLP服务器httpd.conf配置文件，启用XSS防护模块并配置安全策略HEADERS={'X-XSS-Protection':'1; mode=block','Content-Security-Policy':'default-src '\''self'\''; script-src '\''self'\'','X-Content-Type-Options':'nosniff'}；启用日志记录和告警功能，监控HTTP头中特殊字符注入尝试；定期更新Web应用防火墙规则集，拦截包含<script>alert(1)</script>等XSS载荷的请求作为临时缓解措施。'''
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "McAfee Network Data Loss Prevention 9.3.x HTTP Header 跨站脚本攻击漏洞"
updated = "2026-06-17T01:19:13Z"

