[basic]
description = "Lotus Notes R5 客户端 R5.0.5 及更早版本存在 S/MIME 邮件完整性验证缺陷，当接收经过篡改的 S/MIME 加密邮件时，客户端未能正确校验消息完整性并向用户发出警告。远程攻击者可在邮件传输过程中拦截并修改邮件内容（如正文、附件），受害者打开邮件时无法察觉被篡改，导致机密信息泄露、内容植入恶意代码或伪造发件人指令。该漏洞影响使用 Lotus Notes R5 进行安全邮件通信的企业用户，CVSS 评分 7.5（高危），攻击向量为网络、低复杂度、无需认证，可造成机密性、完整性、可用性部分受损。IBM/Lotus 后续版本已修复该缺陷，建议升级至 R5.0.6 或更高版本。"
published = "2001-01-09T05:00:00.000"
remediation = '建议立即升级 Lotus Notes 客户端至 R5.0.6 及以上版本（建议升级至 HCL Notes 12.0.2 或更高版本）。若无法立即升级，可在 Lotus Notes 客户端中禁用 S/MIME 功能（文件 > 首选项 > 邮件 > S/MIME 取消勾选 "启用 S/MIME"），或部署网关层 S/MIME 签名验证网关作为临时缓解措施。'
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "Lotus Notes R5 S/MIME邮件篡改漏洞"
updated = "2026-06-16T21:53:14.043"

