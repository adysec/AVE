[basic]
description = "OpenPLC ScadaBR 是一款工业监控和数据采集（SCADA）系统。该漏洞存在于 Web 页面生成过程中，对用户输入的转义处理不当，导致存储型跨站脚本（XSS）漏洞。攻击者可在 system_settings.shtm 页面中注入恶意脚本代码，当其他用户访问该页面时，恶意脚本将在受害者浏览器中执行。该漏洞影响 Linux 平台下 0.9.1 及之前版本的 ScadaBR，以及 Windows 平台下 1.12.4 及之前版本。成功利用此漏洞需要攻击者拥有低权限账户并能够登录系统，在特定页面中提交恶意输入，从而在管理员或其他用户的会话中执行任意 JavaScript 代码，可能导致会话劫持、敏感信息窃取或进一步的控制权获取。"
published = "2021-06-11T12:15:12Z"
remediation = "建议将 OpenPLC ScadaBR 升级至修复了 CVE-2021-26829 的最新版本（Linux 版高于 0.9.1、Windows 版高于 1.12.4）。如暂无法升级，应在 Web 服务器或反向代理层部署 WAF 规则，过滤 system_settings.shtm 页面请求中的 &lt;script&gt;、onerror、onload 等 XSS 特征载荷；同时修改应用程序代码，对 system_settings.shtm 中所有用户可控输入进行严格的 HTML 实体编码输出，并在输入侧增加长度与字符类型白名单校验。临时缓解措施可限制仅允许可信内网 IP 访问 system_settings.shtm 页面。"
score = 5.4
severity = "MEDIUM"
sources = ["kev"]
title = "OpenPLC ScadaBR 存储型跨站脚本漏洞"
updated = "2026-06-17T03:43:50Z"

