[basic]
description = "tags.<value>WebKit引擎存在内存破坏漏洞（CWE-119），Apple Safari 6.0之前版本及iOS 6.0之前版本受影响。未经身份认证的远程攻击者可通过访问特制网页触发内存越界写入，导致任意代码执行或拒绝服务（应用崩溃）。该漏洞利用难度中等，攻击者无需用户交互即可触发漏洞。"
published = "2012-07-25T20:55:04.007"
remediation = "立即将 Apple Safari 升级至 6.0 或更高版本，以修复 WebKit 内存破坏漏洞。升级前可临时禁用 JavaScript 或禁止加载不受信任的网页作为缓解措施。macOS 用户可通过「系统偏好设置 → 软件更新」安装 Apple 提供的安全更新，或从 Apple 官网下载最新版 Safari 安装包手动升级。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple Safari WebKit 内存破坏漏洞"
updated = "2026-06-16T23:43:40.277"

