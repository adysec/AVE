[basic]
description = "Linux 内核 Qualcomm socinfo 驱动中存在越界读取漏洞，源于对 SMEM 中 serial_num 字段的边界检查使用了 offsetof() 而非 offsetofend()，导致未能正确验证字段末尾是否在有效内存范围内。本地低权限攻击者可通过读取 sysfs 中的 serial_number 文件触发该漏洞，造成越界内存读取，泄露敏感内核内存数据，并可能导致系统崩溃。该漏洞影响使用 MSM8916 芯片组的 Qualcomm 设备，CVSS 评分 7.1，危害等级高。Linux 内核主线已提交修复补丁。"
published = "2025-02-27T03:15:11Z"
remediation = "立即更新 Linux 内核至修复版本：5.4.291+、5.10.235+、5.15.179+、6.1.129+、6.6.78+、6.12.14+ 或 6.13.3+。Ubuntu 用户安装 USN-7540-1 更新（linux-image-5.4.0-1129-raspi），Debian 用户应用 DLA-4178/DLA-4102 安全更新。无法立即升级时，可通过内核 livepatch 或禁用 sysfs 中 serial_number 节点的读取权限作为临时缓解。"
score = 7.1
severity = "HIGH"
sources = ["msrc"]
title = "Linux Kernel Qualcomm SoC socinfo 越界读取漏洞"
updated = "2026-06-17T08:14:25Z"

