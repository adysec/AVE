[basic]
description = "Windows Kerberos 存在信息泄露漏洞，攻击者需在特定网络条件下对 Kerberos 认证服务进行精心构造的查询，利用认证协议实现中的缺陷获取目标系统的敏感信息。该漏洞攻击复杂度较高（AC:H），但无需身份认证（PR:N）及用户交互（UI:N），远程网络触发（AV:N），影响机密性（C:H）。成功利用可能导致凭据或会话密钥等敏感数据泄露，进一步扩大攻击面。Microsoft 已在 2025 年 1 月安全更新中修复。"
published = "2025-01-14T18:15:39Z"
remediation = '立即安装 Microsoft 2025 年 1 月安全更新：Windows 10 22H2/21H2 安装 KB5049981（OS Build 19045.5371/19044.5371），Windows Server 2019 安装 KB5050008（OS Build 17763.6775），Windows 11 对应更新 KB5050021。可通过"设置→Windows 更新→检查更新"自动获取。如无法立即打补丁，建议在防火墙层面限制对 Kerberos 服务（TCP/UDP 88 端口）的访问，仅允许受信任网段连接，并启用 Kerberos 事件日志审计以监测异常请求。'
score = 5.9
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows Kerberos 信息泄露漏洞"
updated = "2026-06-17T08:42:52Z"

