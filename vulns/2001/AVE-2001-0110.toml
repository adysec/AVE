[basic]
description = "标签之间。<value>W3.org Anaya Web 开发服务器中的 sendtemp.pl 脚本存在目录遍历漏洞。未经身份认证的远程攻击者可通过向 templ 参数注入 .. (点号) 路径遍历序列，绕过目录访问限制，读取服务器上的任意文件内容。该漏洞利用条件简单，仅需目标服务器运行存在缺陷的 Anaya 开发版本并向外部暴露服务，攻击者即可通过构造恶意请求获取敏感文件信息，造成信息泄露风险。建议升级至修复版本或移除该开发服务器组件。"
published = "2001-05-03T04:00:00Z"
remediation = '升级到 Amaya 最新版本 11.4.4。如无法立即升级，应立即删除或禁用 Amaya 安装目录下 cgi-bin/sendtemp.pl 文件，并在 Web 服务器配置中禁止执行该目录的 CGI 程序。同时建议以低权限 chroot Jail 运行 Web 服务器进程，仅授予必要文件读取权限。临时缓解措施可在反向代理或 WAF 层拦截包含 "templ=.." 或 "templ=../" 特征的 HTTP 请求。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "W3.org Anaya Web开发服务器 目录遍历漏洞"
updated = "2026-06-16T21:54:00Z"

