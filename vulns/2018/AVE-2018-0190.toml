[basic]
description = 'Enhancesoft osTicket 1.10.1 及之前版本中存在跨站脚本（XSS）漏洞，位于 /ajax.php/form/help-topic 页面的 "message" 参数。远程攻击者无需身份认证即可向该参数注入恶意 Web 脚本或 HTML 代码，当管理员或其他用户访问被攻击的页面时，注入的脚本将在浏览器中执行，导致敏感信息泄露、会话劫持或钓鱼攻击。攻击条件低，仅需诱导用户点击恶意链接即可触发。该漏洞影响 osTicket 1.10.2 之前的所有版本。'
published = "2018-03-27T17:29:00Z"
remediation = "升级 osTicket 至 1.10.2 或更高版本，该版本已修复 /ajax.php/form/help-topic 接口中 message 参数的 XSS 过滤问题。如无法立即升级，可在 Web 应用防火墙（WAF）层面添加规则，对 message 参数中的 `<script>`、`onerror` 等 HTML 标签和事件处理器进行过滤拦截。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Enhancesoft osTicket 跨站脚本漏洞"
updated = "2026-07-10T18:20:35Z"

