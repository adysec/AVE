[basic]
description = "Opera 5.12 及 6.0 版本浏览器存在同源策略绕过漏洞。由于浏览器未能正确限制跨域框架（frame）的 location 属性访问，远程攻击者可以构造恶意网页，诱使用户访问后，通过操作内嵌框架的 location 对象绕过同源策略限制，从而读取或修改其他域下的页面内容，导致敏感信息泄露。攻击者无需任何身份认证，仅需用户使用受影响版本浏览器访问恶意页面即可触发。"
published = "2002-08-12T00:00:00Z"
remediation = "升级 Opera 浏览器至 6.01 或更高版本，该漏洞已在后续版本中修复。由于 Opera 5.12 和 6.0 均已停止支持，建议卸载旧版本并安装受支持的现代浏览器（如最新版 Chrome、Firefox 或 Edge）。如因特殊环境无法升级，可在浏览器设置中禁用 JavaScript 作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Opera 浏览器同源政策绕过漏洞"
updated = "2002-08-12T00:00:00Z"

