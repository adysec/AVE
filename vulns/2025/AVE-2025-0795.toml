[basic]
description = "Windows NTFS 文件系统存在访问控制不当漏洞（CWE-284），低权限本地攻击者可利用该漏洞读取本应受保护的文件内容，导致机密信息泄露。攻击者需具备本地系统访问权限及低权限用户身份，无需用户交互即可触发。该漏洞影响 Windows 10/11 多个版本及 Windows Server 2008/2012/2016/2019/2022/2025 等版本，CVSS 评分 3.3，危害等级低。Microsoft 已在 2025 年 2 月安全更新（KB5051974）中修复此漏洞。"
published = "2025-02-11T18:15:33Z"
remediation = "建议立即安装 Microsoft 2025 年 2 月安全更新 (KB5051974)，可通过 Windows Update 自动获取或从 Microsoft Update Catalog 手动下载。受影响版本包括 Windows 10/11 及 Windows Server 多版本，更新后对应版本号分别为：Win10 1507≥10.0.10240.20915、Win10 1607≥10.0.14393.7785、Win10 1809/Server 2019≥10.0.17763.6893、Win10 21H2≥10.0.19044.5487、Win10 22H2≥10.0.19045.5487、Win11 22H2≥10.0.22621.4890、Win11 23H2≥10.0.22631.4890、Win11 24H2/Server 2025≥10.0.26100.3194、Server 2016≥10.0.14393.7785、Server 2022≥10.0.20348.3207、Server 2022 23H2≥10.0.25398.1425。如无法立即打补丁，建议限制本地用户对 NTFS 卷的物理访问权限作为临时缓解措施。"
score = 3.3
severity = "LOW"
sources = ["msrc"]
title = "Microsoft Windows NTFS 特权提升漏洞"
updated = "2026-06-17T08:43:08Z"

