[basic]
description = "libXfont2 在解析 PCF 字体文件过程中，pcfReadFont() 函数未对字形边界进行充分校验，导致堆缓冲区溢出（CWE-122）。该漏洞影响 libXfont2 2.0.8 之前的所有版本。攻击者需先通过 X 客户端身份认证，再向 X 服务器提交特制的 PCF 字体文件即可触发该溢出漏洞，从而在 X Server 进程上下文中执行任意代码。由于攻击需要客户端认证且攻击复杂度较高，但一旦利用成功可完全控制 X 服务器，CVSS 评分 8.5，危害等级为高。"
published = "2026-07-08T10:16:23.327"
remediation = "将 libXfont2 升级至 2.0.8 或更高版本。该版本修复了 pcfReadFont() 中因缺失字形边界检查导致的堆缓冲区溢出漏洞（CVE-2026-56002），防止恶意 PCF 字体触发越界写入。对于无法立即升级的系统，可通过在 X 服务器配置中移除对 PCF 字体路径的支持，或仅加载受信任的字体目录作为临时缓解措施。"
score = 8.5
severity = "HIGH"
sources = ["zdi"]
title = "X.Org libXfont2 堆缓冲区溢出漏洞"
updated = "2026-07-13T13:57:14.900"

