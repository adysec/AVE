[basic]
description = "Cisco IOS 和 IOS XE 的 SNMP 实现存在缓冲区溢出漏洞（CWE-119），由于受影响代码区域对 SNMP 数据包处理不当导致。经过身份验证的远程攻击者通过向目标设备发送特制的 SNMP 数据包，可触发缓冲区溢出，导致设备重载或远程代码执行，从而完全控制目标系统。该漏洞影响 SNMP v1、v2c 和 v3 所有版本，攻击者需知道 SNMP 只读团体字符串（v2c 及更早版本）或用户凭据（SNMPv3）。仅定向发送到受影响系统的流量可用于利用此漏洞。CVSS 评分 8.8，危害等级高。"
published = "2017-07-17T21:29:00Z"
remediation = "升级 Cisco IOS/IOS XE 至 Cisco Security Advisory cisco-sa-20170629-snmp 中对应版本的第一修复版本（使用 Cisco IOS Software Checker 工具查询具体版本号）。如无法立即升级，可通过全局配置模式执行 snmp-server view NO_BAD_SNMP iso included 创建视图，逐一排除 ADSL-LINE-MIB、CISCO-AUTH-FRAMEWORK-MIB、CISCO-SLB-EXT-MIB 等受影响 MIB，并将该视图绑定到 SNMP 只读 community 字符串；同时限制仅允许可信管理站 IP 访问 SNMP 服务，定期更换 SNMP community 字符串。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS和IOS XE SNMP远程代码执行漏洞"
updated = "2026-06-17T01:22:56Z"

