[basic]
description = "Microsoft Office 在处理内存中的对象时存在远程代码执行漏洞（CWE-119 内存破坏）。攻击者可通过构造特制的 Office 文档（如 Word 文件），诱使用户打开后触发内存损坏，从而在当前用户权限下执行任意代码。该漏洞影响 Word 2007/2010/2013/2016、Office Web Apps Server 2010/2013、SharePoint Server 2010、Word Viewer 及 Office Online Server 等多个产品。攻击条件需要用户交互（打开恶意文档），已被发现在定向攻击中被利用。Microsoft 已于 2017 年 10 月安全更新中修复此漏洞。"
published = "2017-10-13T13:29:02Z"
remediation = "立即安装 Microsoft 2017 年 10 月安全更新：Word 2007 安装 KB4011038，Word 2010 安装 KB4011238，Word 2013 安装 KB4011239，Word 2016 安装 KB4011240，Office Online Server 安装 KB4011260。可通过 Windows Update 自动获取更新。如无法立即打补丁，建议在邮件网关层面拦截包含恶意 RTF 附件的邮件，并禁用用户在 Office 中从远程位置嵌入 OLE 对象的功能作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Office 内存破坏远程代码执行漏洞"
updated = "2026-06-17T01:02:26Z"

