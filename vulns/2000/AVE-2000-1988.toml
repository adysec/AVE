[basic]
description = "Netscape (iPlanet) 证书管理系统 4.2 和目录服务器 4.12 将管理员密码以明文形式存储，未经身份认证的远程攻击者可通过读取服务器配置文件或数据库获取管理员凭证，从而获得服务器的完全管理权限。该漏洞影响 Netscape Certificate Management System 和 Directory Server 产品，攻击条件宽松，仅需网络可达即可利用，CVSS 评分 10.0，危害等级严重。"
published = "2000-12-11T05:00:00.000"
remediation = "建议将受影响的软件升级到厂商发布的最新安全版本，或根据官方安全公告应用相应的安全补丁。如暂无补丁，建议采取临时缓解措施限制攻击面。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Netscape iPlanet 证书管理系统与目录服务器管理员密码明文存储漏洞"
