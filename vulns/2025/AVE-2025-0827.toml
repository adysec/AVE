[basic]
description = "Microsoft Office 存在远程代码执行漏洞（CWE-426 不可信搜索路径）。该漏洞源于 Office 在加载组件时未充分验证搜索路径中的文件，攻击者可通过诱导用户打开特制的恶意文件触发漏洞。攻击条件为本地访问且需用户交互（如点击打开恶意文档），无需任何用户权限。成功利用后攻击者可在当前用户上下文中执行任意代码，若用户以管理员权限运行则可完全控制系统。该漏洞影响 Microsoft 365 Apps for Enterprise 及 Office LTSC 2024 等产品，CVSS 评分 7.8，危害等级高危。Microsoft 已在 2025 年 1 月安全更新中修复。"
published = "2025-01-14T18:16:02Z"
remediation = "建议立即通过 Windows Update 自动更新功能安装 2025 年 1 月安全更新，或访问 Microsoft 安全响应中心 https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-21365 手动下载并安装补丁。受影响的 Microsoft 365 Apps 企业版及 Office LTSC 2024 用户应升级至最新版本。该漏洞为不可信搜索路径（CWE-426）导致的 DLL 劫持类远程代码执行，需用户交互触发；在无法立即打补丁期间，应避免从不受信任的来源打开 Office 文档，并在组策略中启用「阻止来自 Internet 的 Office 文件运行宏」作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Office 远程代码执行漏洞"
updated = "2026-06-17T08:43:12Z"

