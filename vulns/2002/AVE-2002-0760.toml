[basic]
description = "tags.<value>Compaq Tru64 4.0d 操作系统存在拒绝服务漏洞，未经身份认证的远程攻击者可通过发送特制的 TCP SYN 扫描数据包触发该漏洞，导致 telnet、FTP、ypbind、rpc.lockd、SNMP、ttdbserverd 等多个网络服务中断。攻击者无需任何凭据，只需使用 nmap 等扫描工具即可造成目标系统拒绝服务。CVSS 评分 5.0，危害等级中等。"
published = "2002-12-31T05:00:00Z"
remediation = "升级至 Compaq Tru64 UNIX 5.x 或更高版本以修复该内核 TCP 协议栈缺陷；如无法立即升级，应在边界防火墙或路由器上配置 ACL，阻止同时携带 SYN 和 FIN 标志的畸形 TCP 数据包进入，并禁用不必要的 telnet、FTP、ypbind、rpc.lockd、snmp、ttdbserverd 等网络服务以减少攻击面。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Compaq Tru64 多服务远程拒绝服务漏洞"
updated = "2026-06-16T22:00:36Z"

