[basic]
description = "Samsung Account（三星账户）存在输入验证不当漏洞，版本低于 15.5.01.1 的 Samsung Account 未能对用户输入进行充分校验，导致本地攻击者可利用该漏洞在目标设备上执行任意脚本。攻击者需具备本地访问权限，无需用户交互即可触发，影响用户账户数据的机密性。三星已在后续版本中修复此漏洞。"
published = "2025-12-02T02:15:48Z"
remediation = "立即将 Samsung Account 更新至 15.5.01.1 或更高版本，可通过 Galaxy Store → 菜单 → 更新 或 设置 → 应用 → Samsung Account → 检查更新 完成升级。如无法立即更新，可在设置中禁用 Samsung Account 的自动脚本执行权限作为临时缓解措施。"
score = 4
severity = "MEDIUM"
sources = ["zdi"]
title = "Samsung Account 输入验证不当漏洞"
updated = "2026-06-17T09:44:33Z"

