[basic]
description = 'Apple QuickTime Player 在 Mac OS X 至 10.6.8 版本中，"Save for Web"（保存为 Web）导出功能存在跨站脚本（XSS）漏洞。当用户使用该功能导出电影文件为 HTML 文档时，生成的 HTML 文件中包含指向远程脚本文件的 HTTP 链接，且该链接未使用 HTTPS 加密协议。攻击者通过中间人攻击手段劫持该 HTTP 请求，将脚本文件内容替换为恶意 JavaScript 代码。当用户在本地浏览器中打开导出的 HTML 文档时，浏览器会加载被劫持的脚本并执行其中的恶意代码，从而在用户浏览器上下文中窃取敏感信息、劫持用户会话或执行其他恶意操作。该漏洞利用条件要求攻击者能够对目标网络流量进行中间人拦截，且用户需在导出 HTML 后于本地浏览器中查看该文档。Apple 在 QuickTime 7.7.1 中修复了此问题，建议受影响用户升级至最新版本。该漏洞 CVSS 评分为 2.6，危害等级为低危。'
published = "2011-10-14T10:55:08Z"
remediation = '建议升级 QuickTime 至 7.7.1 或更高版本，同时安装 Mac OS X v10.6.8 或 OS X Lion v10.7.2 及安全性更新 2011-006。如无法立即更新，应避免使用 QuickTime Player 的"Save for Web"导出功能，且不要在本机浏览器中查看导出的 HTML 文件，以降低被中间人攻击者利用的风险。'
score = 2.6
severity = "LOW"
sources = ["tenable"]
title = "Apple Mac OS X QuickTime Player 跨站脚本攻击"
updated = "2026-06-16T23:32:54Z"

