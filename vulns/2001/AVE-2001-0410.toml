[basic]
description = "Sendmail 8.11.4 之前版本及 8.12.0.Beta10 之前版本中存在信号处理程序条件竞争漏洞。本地攻击者利用该漏洞可触发竞态条件，导致堆内存损坏和拒绝服务，并可能进一步实现本地权限提升。该漏洞攻击复杂度较高，需本地用户权限，CVSS 评分 3.7，危害等级低。"
published = "2001-05-28T04:00:00Z"
remediation = "建议升级 Sendmail 至 8.11.4 及以上版本，或 8.12.0.Beta10 及以上版本。该漏洞为信号处理程序中的条件竞争，攻击者需本地登录系统，因此可限制非授信用户对 sendmail 二进制文件的执行权限作为临时缓解。"
score = 3.7
severity = "LOW"
sources = ["redhat"]
title = "Sendmail Sendmail 信号处理器竞争条件漏洞"
updated = "2026-06-16T21:56:05Z"

