[info]
author = "ave"
description = "iPlanet Web Server 4.x 的 SHTML 日志记录功能存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过发送包含超长文件名的 .shtml 请求触发日志缓冲区溢出，从而在目标系统上执行任意命令。"
id = "POC-AVE-2000-1989"
name = "CVE-2000-1077 PoC"
severity = "critical"
tags = ["ave-2000-1989"]
vuln_id = [
    "CVE-2000-1077",
    "AVE-2000-1989",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}.shtml"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
status = [200]
type = "status"
