[basic]
description = "Adobe Flash Player 10.3.181.14 之前版本存在边界检查漏洞，攻击者可通过构造特制的 Flash 内容诱导用户访问触发该漏洞，导致远程代码执行。该漏洞影响 Windows、Mac OS X、Linux、Solaris 及 Android 平台上的 Flash Player，CVSS 评分 9.3，危害等级严重。Adobe 已在 2011 年 5 月发布安全更新修复此漏洞，建议用户升级至 10.3.181.14 及以上版本。"
published = "2011-05-13T22:55:01Z"
remediation = "Adobe 已于 2011 年 5 月发布安全公告 APSB11-12，建议立即将 Windows/Mac/Linux/Solaris 平台上的 Flash Player 升级至 10.3.181.14，Android 平台升级至 10.3.185.21。由于 Adobe Flash Player 已于 2020 年底停止支持，强烈建议彻底卸载 Flash Player 以彻底消除风险；如因业务兼容性必须保留，可在浏览器中启用 click-to-play 插件策略并禁用 Adobe Flash 的自动加载。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 边界检查远程代码执行漏洞"
updated = "2026-06-16T23:27:46Z"

