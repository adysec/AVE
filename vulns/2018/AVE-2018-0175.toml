[basic]
description = "Oracle WebLogic Server 的 WLS Web Services 组件（ws_utc）存在任意文件上传漏洞。未经身份认证的远程攻击者可通过 HTTP 协议访问 ws_utc 应用，利用其未对上传文件类型进行有效校验的缺陷，向服务器上传恶意 JSP 文件，从而获取服务器控制权。该漏洞影响 WebLogic Server 12.1.3.0、12.2.1.2 及 12.2.1.3 版本，CVSS 评分 9.8，危害等级严重。攻击无需任何权限，利用复杂度低，可导致机密性、完整性和可用性完全丧失。Oracle 已在 2018 年 7 月关键补丁更新中修复此漏洞，建议升级至最新版本或禁用 ws_utc 应用。"
published = "2018-07-18T13:29:00.663"
remediation = "升级 Oracle WebLogic Server 至 12.1.3.0.20180717 及以上补丁集，或 12.2.1.2.20180717、12.2.1.3.20180717 及以上版本。如无法升级，删除 `ws_utc/config.do` 和 `ws_utc/begin.do` 接口或限制 `/ws_utc/` 路径的访问权限，仅允许受信 IP 访问 Web 管理控制台。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Oracle WebLogic Server WLS Web Services 任意文件上传漏洞"
updated = "2026-06-17T01:56:34.250"

