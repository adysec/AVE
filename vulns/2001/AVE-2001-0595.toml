[basic]
description = 'Alt-N MDaemon 3.5.0 及更早版本中的 Webconfig、IMAP 及其他服务存在拒绝服务漏洞，远程攻击者可通过向目标服务发送一个以 "\r\n" 结尾的超长 URL 字符串，触发服务处理异常，导致目标服务崩溃或停止响应。攻击者无需身份认证即可利用该漏洞，攻击条件简单，仅需网络可达即可实施。该漏洞影响范围较广，可导致邮件服务中断，影响业务正常运行。'
published = "2001-02-12T05:00:00Z"
remediation = '升级 MDaemon 至 3.5.1 或更高版本，该版本已修复长 URL 导致的拒绝服务问题。如无法立即升级，可在网络边界防火墙或 IPS 设备上添加规则，拦截包含超长 URL 且以 "\r\n" 结尾的 HTTP/IMAP 请求，限制单个请求 URL 长度不超过 1024 字节，以降低被攻击风险。'
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Alt-N MDaemon 拒绝服务漏洞"
updated = "2026-06-16T21:53:35Z"

