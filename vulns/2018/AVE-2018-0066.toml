[basic]
description = "Cisco IOS 软件登录增强（Login Block）功能存在资源管理错误漏洞（CWE-399）。未经身份认证的远程攻击者可通过向受影响设备发送特制的登录请求，触发系统重载，导致拒绝服务（DoS）条件。该漏洞影响运行 Cisco IOS 软件版本 15.4(2)T、15.4(3)M 及 15.4(2)CG 及更高版本的设备。攻击复杂度较高（AC:H），无需用户交互，无需特权，成功利用可造成目标设备完全不可用。Cisco 已发布安全公告修复此漏洞。"
published = "2018-03-28T22:29:01Z"
remediation = "升级 Cisco IOS 至修复版本。受影响的版本包括 15.4(2)T、15.4(3)M、15.4(2)CG 及后续版本。请登录 Cisco Bug Search Tool 查询 CSCuz60599 获取对应平台的具体修复版本号，或通过 Cisco Software Checker 确认当前版本是否已修复。如无法立即升级，可考虑禁用 Login Block 功能（login block-for 配置）作为临时缓解，但该措施无法完全消除风险。CISA 已将该漏洞列入已知被利用漏洞目录（KEV），强烈建议在 2022 年 3 月 17 日前完成升级。"
score = 5.9
severity = "MEDIUM"
sources = ["kev"]
title = "Cisco IOS 登录增强功能拒绝服务漏洞"
updated = "2026-06-17T01:30:01Z"

