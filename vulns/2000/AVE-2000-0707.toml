[basic]
description = "iMesh 1.02 存在缓冲区溢出漏洞，远程攻击者可通过向 iMesh 服务端口发送超长字符串触发该漏洞，导致任意代码执行。该漏洞影响 iMesh 1.02 版本，攻击者无需身份认证即可远程利用，CVSS 评分 7.5，危害等级高。受影响用户应升级至最新版本以修复此漏洞。"
published = "2000-06-29T04:00:00Z"
remediation = "立即升级 iMesh 至 1.02 以上版本（官方下载页面 http://www.imesh.com/download/download.html），该版本已修复缓冲区溢出漏洞。如无法升级，建议在防火墙层面阻止外部对 iMesh 监听端口的访问，或彻底卸载 iMesh 改用其他安全的 P2P 文件共享软件。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "iMesh 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:05Z"

