[basic]
description = "Raptor GFX PGX32 配置工具中的 pgxconfig 程序存在缓冲区溢出漏洞，本地用户可通过向命令行选项传递超长参数触发缓冲区溢出，从而覆盖进程内存空间，实现权限提升。攻击者成功利用该漏洞后可获取系统最高权限，完全控制目标主机。该漏洞影响 Raptor GFX PGX32 2.3.1 及更早版本，攻击复杂度低，无需用户交互即可利用。"
published = "2000-10-20T04:00:00.000"
remediation = "立即移除 pgxconfig 的 setuid 权限位（chmod u-s /usr/sbin/pgxconfig），防止本地用户通过 PATH 环境变量劫持获取 root 权限。如业务需要该工具，可限制仅授权管理员通过 sudo 执行，或升级到 Tech-Source 官方修复版本（PGX32 2.3.1 之后）。"
score = 7.2
severity = "HIGH"
sources = ["epss"]
title = "Tech-Source Raptor GFX PGX32 pgxconfig 缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:52:17.183"

