[basic]
description = "Adobe Flash Player 10.3.183.5 之前版本中存在远程整数溢出漏洞，攻击者可通过向用户发送特制的 SWF 文件触发该漏洞，导致内存破坏和远程代码执行。用户只需在受影响浏览器中打开恶意构造的 Flash 内容即可被利用，影响 Windows、macOS、Linux 等多平台。Adobe 已在安全公告 APSB11-21 中发布更新修复此漏洞。"
published = "2011-08-11T00:00:00Z"
remediation = "立即升级 Adobe Flash Player 至 10.3.183.5 及以上版本（Windows/Mac/Linux/Solaris）或 10.3.186.3 及以上版本（Android），Adobe AIR 升级至 2.7.1 及以上版本。由于 Adobe Flash Player 已于 2020 年底停止支持并官方弃用，建议彻底卸载 Flash Player 组件，并迁移至 HTML5 等现代 Web 标准。对于必须使用 Flash 的遗留系统，可配置浏览器插件点击运行策略，限制 Flash 内容仅在受信任站点执行。"
score = 9.8
severity = "CRITICAL"
sources = ["tenable"]
title = "Adobe Flash Player 远程整数溢出漏洞"
updated = "2011-08-11T00:00:00Z"

