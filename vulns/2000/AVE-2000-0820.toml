[basic]
description = 'DCForum 1-6 版本的 cgforum.cgi CGI 脚本存在任意文件读取漏洞，远程攻击者可通过向该脚本发送特制的恶意 "forum" 参数，利用路径遍历技术读取服务器上任意文件，甚至可删除程序自身。该漏洞影响 DCForum 1-6 及可能更早版本，攻击无需身份认证，仅需通过网络发送精心构造的 HTTP 请求即可触发，危害中等。'
published = "2001-01-09T05:00:00.000"
remediation = "立即升级 DCForum 至 7.0 或更高版本（厂商已发布安全更新，详见 http://www.dcscripts.com/dcforum/dcfNews/124.html）。如无法升级，立即删除或禁用 cgforum.cgi 脚本，或通过 Web 服务器配置（如 Apache 的 <Location> 指令）限制对该脚本的访问，仅允许可信 IP 段访问。同时检查 Web 服务器以 nobody 权限运行，避免敏感文件被读取。"
score = 6.4
severity = "MEDIUM"
sources = ["epss"]
title = "DCForum cgforum.cgi 任意文件读取漏洞"
updated = "2026-06-16T21:53:13.103"

