[basic]
description = "phpGB 1.20 及更早版本中的 savesettings.php 脚本存在 PHP 代码注入漏洞。该脚本未对访问者进行身份认证，攻击者无需账号凭据即可直接调用 savesettings.php 修改配置文件 config.php，通过在请求中注入任意 PHP 代码实现远程代码执行，或通过篡改配置导致服务拒绝。该漏洞影响所有使用 phpGB 1.1/1.2/1.20 及以下版本的留言板系统，攻击者只需通过网络向目标站点发送特制的 HTTP POST 请求即可完成利用，利用门槛极低且无需交互，CVSS 评分 7.5，危害等级为高危。攻击者可完全控制受影响的 Web 服务器，造成数据泄露、网站篡改或服务器被进一步入侵等严重后果。"
published = "2003-04-22T04:00:00.000"
remediation = "立即升级 phpGB 至 1.21 或更高版本，该版本已修复 savesettings.php 的身份验证绕过漏洞。如暂无法升级，应立即删除或禁用 admin/savesettings.php 文件，或通过 Web 服务器配置（如 Apache .htaccess 或 Nginx location 规则）限制仅允许本地访问该文件。同时将 config.php 的文件权限设为只读（chmod 444），防止 Web 进程写入修改。若 guestbook 功能非必需，建议直接下线该应用。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "PHPGB 1.1/1.2 PHP 代码执行漏洞"
updated = "2026-06-16T21:59:24.533"

