[basic]
description = "libpng 在处理 PNG 图像时存在缓冲区溢出漏洞，由于程序对用户提供的 PNG 文件数据长度缺乏充分校验，攻击者可通过向目标系统提交特制的畸形 PNG 图像文件触发该漏洞，导致缓冲区溢出，进而造成拒绝服务或可能执行任意代码。该漏洞影响 Debian GNU/Linux 3.0 等系统上运行的 libpng 1.0.12-3.woody.2 及 libpng3 1.2.1-1.1.woody.2 版本，CVSS 评分 7.5，危害等级高。攻击者无需身份认证即可远程利用，攻击复杂度低。"
published = "2002-08-12T04:00:00Z"
remediation = "升级 libpng 至修复版本：Debian 用户升级 libpng 至 1.0.12-4、libpng3 至 1.2.1-2（参考 DSA-140）；Red Hat 用户安装 RHSA-2002:151 和 RHSA-2002:152 提供的更新包。其他系统用户应联系厂商获取对应补丁。如无法立即升级，建议在网络层面限制对受影响服务的访问以降低风险。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "libpng 缓冲区溢出漏洞"
updated = "2026-06-16T21:57:53Z"

