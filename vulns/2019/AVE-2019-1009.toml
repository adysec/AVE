[basic]
description = "Netis WF2419 路由器 Web 管理页面中的 tracert 诊断工具存在 OS 命令注入漏洞。由于对用户输入缺乏有效的过滤和净化处理，已登录 Web 管理页面的攻击者可通过向 tracert 功能提交特制的系统命令参数，以 root 权限在设备上执行任意系统命令。该漏洞影响固件版本 V1.2.31805 和 V2.2.36123，攻击者需先获取路由器管理凭据才能利用，CVSS 评分 7.5，危害等级高。成功利用可完全控制路由器设备，进而监听网络流量或发起进一步攻击。"
published = "2020-02-07T23:15:10Z"
remediation = "Netis 官方未发布修复该漏洞的固件更新（已知最后版本 V2.2.36123 仍受影响），建议立即停用 WF2419 路由器并更换为受支持的设备。作为临时缓解措施：在路由器管理界面禁用远程 Web 管理功能，将管理页面仅绑定到内网接口；修改默认管理员密码为强密码；在防火墙层面限制对路由器 80/443 端口的访问来源，仅允许受信任的管理 IP 连接。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "Netis WF2419 路由器远程代码执行漏洞"
updated = "2026-06-17T02:26:33Z"

