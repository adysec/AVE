[basic]
description = "Microsoft Windows Script Host 5.1及5.5版本中存在文件泄露漏洞，远程攻击者可通过Internet Explorer 5.5及更早版本，利用GetObject Javascript函数与htmlfile ActiveX对象，读取目标系统上的任意文件。攻击者只需诱使用户访问恶意网页即可触发该漏洞，无需任何身份认证。该漏洞可导致敏感信息泄露，影响Windows 98/Me/NT/2000等操作系统。微软已在后续安全更新中修复此漏洞。"
published = "2001-06-02T04:00:00Z"
remediation = "立即安装微软安全公告 MS01-015 提供的补丁，升级 Internet Explorer 至 5.5 Service Pack 2 或更高版本。如无法安装补丁，可在 Internet 区域禁用 Active Scripting 功能，或限制用户仅访问受信任站点以降低风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Microsoft Internet Explorer Windows Script Host 文件泄露漏洞"
updated = "2026-06-16T21:53:45Z"

