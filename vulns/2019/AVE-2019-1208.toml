[basic]
description = "WhatsApp VOIP 协议栈存在缓冲区溢出漏洞，攻击者可向目标手机号码发送特制的 RTCP 数据包序列触发漏洞，实现远程代码执行。该漏洞影响 WhatsApp Android 版 v2.19.134 前版本、WhatsApp Business Android 版 v2.19.44 前版本、WhatsApp iOS 版 v2.19.51 前版本、WhatsApp Business iOS 版 v2.19.51 前版本、WhatsApp Windows Phone 版 v2.18.348 前版本及 WhatsApp Tizen 版 v2.18.15 前版本。CVSS 评分 9.8（CRITICAL），属于 CWE-122 和 CWE-787 类型，无需用户交互即可远程利用，危害极大。"
published = "2019-05-14T20:29:03Z"
remediation = "建议立即升级 WhatsApp 至安全版本：Android 版升级至 v2.19.134 或更高，Android Business 版升级至 v2.19.44 或更高，iOS 版升级至 v2.19.51 或更高，iOS Business 版升级至 v2.19.51 或更高，Windows Phone 版升级至 v2.18.348 或更高，Tizen 版升级至 v2.18.15 或更高。通过 Google Play、App Store 或官方渠道更新应用。若无法立即更新，建议暂停使用 WhatsApp 语音通话功能，避免接听来自未知号码的通话。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Facebook WhatsApp 缓冲区溢出漏洞"
updated = "2026-06-17T02:35:14Z"

