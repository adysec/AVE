[basic]
description = "Microsoft Windows 95/98/98SE 系统的 NetBIOS 客户端存在拒绝服务漏洞。远程攻击者可通过修改文件共享服务的配置，使其返回未知的驱动程序类型，导致 NetBIOS 客户端在处理异常响应时崩溃，造成目标系统服务中断。该漏洞影响 Windows 95/98/98SE 等早期版本，攻击者无需身份认证即可远程触发，但利用复杂度较高。由于该漏洞仅导致客户端崩溃而非代码执行，危害等级较低。"
published = "2000-12-11T05:00:00.000"
remediation = '建议立即停止使用 Windows 95/98/98SE 并迁移至受支持的操作系统（如 Windows 10/11）。若必须保留，请在防火墙层面封锁 TCP/UDP 137、138、139、445 端口，并在网络适配器属性中禁用 "NetBIOS over TCP/IP" 以阻断攻击向量。'
score = 2.6
severity = "LOW"
sources = ["avd"]
title = "微软 Windows 95/98/98SE NetBIOS 客户端拒绝服务漏洞"
updated = "2026-06-16T21:52:57.060"

