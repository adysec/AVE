[basic]
description = "Oracle 8.1.5 数据库 Connection Manager Control 组件中的 cmctl 程序存在缓冲区溢出漏洞。该程序在处理用户传入的命令行参数时，将第一个参数（argv[1]）的内容复制到一块固定长度的缓冲区中，且未对输入长度进行边界检查。当攻击者提供一个超长的命令行参数时，超出缓冲区大小的数据会覆盖栈上其他数据（如返回地址），攻击者可在栈上植入 shellcode 并利用溢出覆盖返回地址使其跳转执行，从而以 cmctl 进程的有效权限运行任意代码。该漏洞影响 Oracle 8i（8.1.5）数据库管理系统，在 Linux 平台上均可被利用，攻击者成功利用后可获得 euid=oracle 和 egid=dba 的高权限，进一步控制整个数据库实例。该漏洞属于本地提权漏洞，攻击者需具备本地系统访问权限才能触发。"
published = "2001-01-09T05:00:00Z"
remediation = "立即将 Oracle 8.1.5 的 Connection Manager Control 二进制文件 /u01/app/oracle/product/8.1.5/bin/cmctl 的 setuid 位移除，执行命令 chmod -s /u01/app/oracle/product/8.1.5/bin/cmctl，阻止普通用户以 oracle 权限执行该程序。根本修复方案为升级至 Oracle 8i Release 3（8.1.7）或更高版本，该版本已修复命令行参数缺乏长度校验的缓冲区溢出问题。如无法立即升级，应通过 PAM 或操作系统级别的权限管控限制普通用户对 cmctl 程序的访问执行，仅允许授权 DBA 用户组运行。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "Oracle 8.x cmctl 缓冲区溢出漏洞"
updated = "2026-06-16T21:53:19Z"

