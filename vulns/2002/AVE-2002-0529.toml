[basic]
description = "ZyXEL Prestige 642R 路由器存在拒绝服务漏洞，远程攻击者可通过向目标设备的 Telnet、FTP 及 DHCP 服务发送同时设置了 SYN 和 ACK 标志位的特制 TCP 数据包，触发服务崩溃导致拒绝服务。该漏洞影响 ZyXEL Prestige 642R 型号路由器，攻击无需身份认证，CVSS 评分 5.0，危害等级中危。厂商已发布固件更新修复此漏洞。"
published = "2002-10-04T04:00:00.000"
remediation = "该设备已停止官方支持，建议立即更换为仍在维护周期内的新款路由器。如无法更换，可在上游防火墙或路由器上配置 ACL 规则，丢弃入站方向同时设置 SYN 和 ACK 标志位的异常 TCP 数据包；同时禁用路由器的 Telnet 和 FTP 服务（改用 SSH/SCP），并将 DHCP 服务迁移至内部专用服务器，以降低攻击面。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "ZyXEL Prestige 642R 畸形TCP包导致Telnet/FTP/DHCP服务拒绝服务漏洞"
updated = "2026-06-16T21:58:40.450"

