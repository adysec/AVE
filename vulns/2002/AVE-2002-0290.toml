[basic]
description = "Mozilla 1.1 及更早版本及其衍生浏览器（如 Netscape 和 Galeon）在加载新页面时，对文档 Referrer 字段的更新机制存在缺陷。当页面跳转时，浏览器会在 `onunload` 事件处理程序执行完毕前过早地设置 Referrer，使得恶意网页可以通过监听 `onunload` 事件，在用户离开当前页时获取其即将访问的下一个 URL 路径（包括用户手动输入的隐私地址）。攻击者只需诱导用户访问一个含有恶意脚本的网页，即可在用户跳转至其他页面时窃取其浏览轨迹，导致用户隐私信息泄露。"
published = "2002-09-24T04:00:00Z"
remediation = "建议将 Mozilla 浏览器及其衍生版本（如 Netscape, Galeon）升级至 1.2 或更高版本。对于无法升级的旧版环境，建议在浏览器设置中禁用 Referrer 发送，或安装现代的安全浏览器以替代旧版 Mozilla 浏览器。"
score = 2.6
severity = "LOW"
sources = ["redhat"]
title = "Mozilla 浏览器 OnUnload 事件处理程序远程信息泄露漏洞"
updated = "2026-06-16T21:58:46Z"

