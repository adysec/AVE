[basic]
description = "Gittensory 项目存在越权访问漏洞（CWE-284/IDOR），`GET /v1/contributors/:login/profile` 接口及 `gittensory_get_contributor_profile` MCP 工具未执行贡献者级别的访问控制检查，而同类接口均强制要求该检查。任何持有有效会话/API/MCP Token 的认证用户均可越权读取任意其他贡献者的个人资料，对于已确认的矿工将泄露 `hotkey`（REST 接口）、`alphaPerDay`、`taoPerDay`、`usdPerDay` 等敏感财务数据。该漏洞影响所有使用快照数据的矿工，攻击者无需额外授权即可远程枚举其他用户的日收益信息。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
severity = "MEDIUM"
sources = ["ghsa"]
title = "Gittensory 贡献者配置文件接口缺失访问控制导致矿工财务数据泄露漏洞"
