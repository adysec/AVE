[basic]
description = "Linux 内核 MPTCP sysctl 调度器代码通过 current->nsproxy 访问网络命名空间结构体，存在空指针解引用漏洞。当进程退出时 current->nsproxy 已被释放，内核仍尝试读取 current->nsproxy->netns 导致崩溃。本地低权限用户可通过调用 acct(2) 等触发 proc_sys 处理路径的系统调用利用此漏洞，造成系统拒绝服务。该漏洞影响 Linux 内核 6.13.0-rc5 及更早版本，CVSS v3.1 评分 5.5（MEDIUM）。"
published = "2025-01-19T11:15:09.757"
remediation = "升级 Linux 内核至 6.13 或更高版本，其中包含 mptcp 系统调用调度程序修复；或者在内核启动时通过配置 sysctl.mptcp.sched=1 启用修复机制，避免使用已退出的任务的网络命名空间结构；如无法立即升级，可临时禁用 mptcp 功能或限制敏感系统调用的访问权限以降低影响。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 MPTCP sysctl 调度器空指针解引用漏洞"
updated = "2026-06-17T08:43:54.957"

