[basic]
description = "Digilent DASYLab 在加载恶意构造的文件时存在越界读取漏洞（CWE-125），由于程序未对文件数据进行充分边界检查，导致内存损坏。本地攻击者可通过诱使用户打开特制文件触发该漏洞，成功利用可导致敏感信息泄露或任意代码执行。该漏洞影响 Digilent DASYLab 全版本，CVSS 评分 8.5，危害等级高。目前官方尚未发布修复补丁，建议用户避免打开来源不明的 DASYLab 文件。"
published = "2026-03-13T19:53:57Z"
remediation = "Digilent 官方确认目前无可用补丁。建议用户不要打开来自不可信来源或未知发件人的 DASYLab 文件（.dsa 格式），加强员工安全意识培训，防范社会工程诱导打开恶意文件。同时可考虑在文件传输链路上部署沙箱检测机制，对可疑 DSA 文件进行隔离分析后再打开。"
score = 8.5
severity = "HIGH"
sources = ["zdi"]
title = "Digilent DASYLab 文件解析越界读取漏洞"
updated = "2026-06-17T10:11:41Z"

