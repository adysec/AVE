[basic]
description = "Lucent VitalSuite 8.0 至 8.2 版本（包括 VitalNet、VitalEvent 及 VitalHelp/VitalAnalysis 组件）存在密码身份认证绕过漏洞。远程攻击者无需任何凭据，即可通过直接向目标服务器发送特制 HTTP 请求访问 VsSetCookie.exe 程序，该程序会返回指定用户的合法身份认证 cookie。攻击者获取该 cookie 后即可直接以目标用户身份登录系统，完全绕过密码验证机制，进而可能导致未授权访问敏感网络管理数据或执行管理操作。该漏洞利用条件简单，攻击复杂度低，危害严重。"
published = "2002-05-29T04:00:00Z"
remediation = "建议立即升级至 Lucent VitalSuite 8.3 或更高版本（若厂商已发布修复版本），或通过 Web 服务器配置禁用/限制对 VsSetCookie.exe 的直接访问。若无法升级，请在防火墙/WAF 层面拦截针对 /VsSetCookie.exe 的非预期 HTTP 请求，并强制要求 VPN/多因子认证访问管理界面。同时审计现有会话 Cookie，强制所有管理员重置密码并失效现有会话。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Lucent 8.x - VitalNet 密码身份认证绕过漏洞"
updated = "2026-06-16T21:57:03Z"

