[basic]
description = "XFree86 X11R6 3.3 及 3.3.3 版本中的 XDM（X Display Manager）在编译时启用了 HasXdmXauth 选项后，使用 gettimeofday() 生成会话 Cookie，导致 Cookie 值高度可预测。远程攻击者无需身份认证即可通过网络向目标 XDM 服务发起暴力破解攻击，通过枚举可能的 Cookie 值获取 X 显示器的未授权访问权限，进而可能控制目标系统的图形界面会话。该漏洞影响 XFree86 3.3 及 3.3.3 版本，CVSS 评分 7.5，危害等级高。"
published = "2001-07-04T04:00:00Z"
remediation = "升级 XFree86 至 4.0 及以上版本，该版本修复了 XDM cookie 生成算法中的可预测性问题。如无法升级，可禁用 XDM 服务（`/etc/init.d/xdm stop`）或使用 xhost 限制仅允许特定 IP 访问 X 显示，并在网络层面通过防火墙封锁 TCP 端口 6000 以阻止远程 X 连接。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "XFree86 X11R6 XDM 会话Cookie可猜测漏洞"
updated = "2026-06-16T21:55:33Z"

