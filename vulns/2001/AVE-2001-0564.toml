[basic]
description = "Windows 2000 和 Windows XP 系统中的 Win32k.sys（图形设备接口 GDI）存在拒绝服务漏洞。本地用户可通过在收到 WM_NCCREATE 消息后调用 ShowWindow 函数，触发内核模式下的空指针解引用，导致系统崩溃（蓝屏）。该漏洞攻击条件简单，无需特殊权限即可利用，但仅限于本地攻击场景，无法远程触发。"
published = "2001-12-31T05:00:00Z"
remediation = "Windows 2000 和 Windows XP 均已停止支持，微软不再提供安全更新。建议立即升级至 Windows 10/11 或 Windows Server 2019/2022 等受支持版本。如无法升级，可通过限制本地用户登录权限、禁用不受信任用户交互式登录来降低本地攻击面。"
score = 2.1
severity = "LOW"
sources = ["exploitdb"]
title = "Microsoft Windows 2000/XP GDI 拒绝服务漏洞"
updated = "2026-06-16T21:56:30Z"

