[basic]
description = "imwheel 包中的 imwheel-solo 程序存在符号链接（symlink）攻击漏洞，本地用户可通过创建指向目标文件的符号链接作为 .imwheelrc 配置文件，诱使程序在处理时向该文件写入内容，从而修改系统任意文件。该漏洞影响安装了 imwheel 软件的 Linux 系统，攻击条件为攻击者已在目标主机上拥有本地访问权限，无需额外身份认证即可利用。成功利用可导致文件完整性被破坏，进而可能用于提升权限或篡改系统配置。"
published = "2001-08-31T04:00:00Z"
remediation = "升级 imwheel 至已修复符号链接漏洞的版本，确保 imwheel-solo 在读取 ~/.imwheelrc 文件时不再跟随符号链接。临时缓解措施：删除 imwheel-solo 的 setuid 位（chmod -s /usr/bin/imwheel-solo），或使用符号链接保护机制（mount -o bind, nosuid, noexec 挂载 /tmp）防止攻击者利用 .imwheelrc 符号链接修改系统文件。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "imwheel imwheel-solo 符号链接本地文件篡改漏洞"
updated = "2026-06-16T21:53:20Z"

