[basic]
description = "该漏洞涉及 Gordano NTMail 5.0/6.0 Web 配置服务器的 HTTP 请求处理器存在处理缺陷，当攻击者向服务器发送一系列不完整的 HTTP 请求时，服务器将无法正确完成请求处理并进入异常状态，导致服务不可用和系统资源耗尽。该漏洞影响 Windows 和 Linux 平台运行 Gordano NTMail 的用户，CVSS 评分 5.0，危害等级中等。攻击者无需任何权限即可远程触发这一漏洞，通过不断向目标服务器发送不完整的 HTTP 请求，消耗服务器的处理资源，最终导致 Web 配置服务器服务瘫痪，无法正常响应请求。该漏洞最早于 2000 年 11 月 14 日被发现，至今仍存在一定的风险，需要对网络服务进行适当的安全配置和监控来防范此类攻击。"
published = "2000-11-14T05:00:00.000"
remediation = "升级到 Gordano NTMail 6.0 SP1 或更高版本，建议应用 2001 年 2 月发布的补丁包 NTMAIL-6.0-SP1-Fix。当无法立即更新时，可限制 Web 配置服务器端口访问，仅开放内部网络，此外应配置 HTTP 请求超时时间为 30 秒并启用请求长度验证以缓解攻击。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Gordano NTMail Web Configuration Server HTTP请求处理程序 拒绝服务漏洞"
updated = "2026-06-16T21:52:37.020"

