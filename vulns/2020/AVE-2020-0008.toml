[basic]
description = ".NET Framework 的 XOML 解析器在处理 SharePoint 工作流时存在代码注入漏洞，由于未能正确验证用户输入，导致攻击者可构造特制的 XOML 文件注入恶意代码。远程攻击者只需向目标 SharePoint 服务器发送包含恶意 XOML 的请求即可触发该漏洞，无需任何身份认证。成功利用后攻击者可实现远程代码执行，完全控制目标服务器。该漏洞影响 Microsoft .NET Framework 4.6/4.7/4.8 及 SharePoint 相关组件，CVSS 评分 9.8，危害等级严重。Microsoft 已在 2020 年 1 月安全更新中修复此漏洞。"
published = "2020-01-14T23:15:33.143"
remediation = "立即安装 Microsoft 2020 年 1 月安全更新，为受影响 Windows 版本上的 .NET Framework 4.6/4.7/4.8 打补丁，通过 Windows Update 或 Microsoft Update Catalog 获取更新。对于 SharePoint 环境，作为临时缓解措施，可在 Web.config 中禁用 Workflow XOML 解析功能，限制非信任用户提交工作流定义。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Microsoft SharePoint .NET Framework 远程代码执行漏洞"
updated = "2026-06-17T02:46:15.230"

