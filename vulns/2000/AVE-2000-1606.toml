[basic]
description = "Microsoft Word 的邮件合并（Mail Merge）功能在处理 Access 数据库时存在安全机制缺失漏洞。该功能在读取数据库中嵌入的 Visual Basic（VBA）脚本时，不会事先向用户弹出安全提示或请求确认，便直接执行脚本内容。攻击者可构造包含恶意 VBA 脚本的 Access 数据库文件，并诱导用户通过 Word 邮件合并功能打开，从而在用户环境中以当前用户权限执行任意命令，实现恶意代码植入、数据窃取或系统控制。该漏洞无需特殊认证条件即可触发，且攻击影响面较大，CVSS 评分为 10.0，危害等级为严重。受影响组件为旧版 Microsoft Word 的邮件合并工具，建议用户避免打开来源不明的数据库文件，并升级至已修复该问题的安全版本。"
published = "2000-10-20T04:00:00Z"
remediation = """
tags.

The vulnerability: Mail Merge tool in Microsoft Word executes VBA scripts in Access database without prompting. Corresponding to Microsoft advisory MS00-071 (the current TOML incorrectly says MS00-058, but the NVD references show ms00-071).

Let me check the references: NVD references include https://docs.microsoft.com/en-us/security-updates/securitybulletins/2000/ms00-071 — so it's MS00-071, not MS00-058. The CVE-2002-0619 is a variant of MS00-071.

So the remediation should reference MS00-071. For Word 2000, the patch was for Word 2000. Let me write a proper remediation.

Note: the requirement says output only the field value between <value> tags. The output must be Chinese, ≥20 chars, with actionable steps.

Let me craft:

建议立即安装微软安全公告 MS00-071 提供的补丁（Microsoft Word 2000），修复邮件合并功能打开 Access 数据库时自动执行 VBA 脚本的问题。如无法及时安装补丁，可采取以下缓解措施：一、在 Word 中将宏安全级别设置为"高"，并取消勾选"信任对 VBA 工程对象模型的访问"选项，使宏执行前强制提示或直接禁用；二、仅从可信来源获取邮件合并所需的 .mdb 数据库文件，不要打开来源不明的 Access 数据库，避免加载恶意 VBA 脚本；三、通过组策略或注册表禁用邮件合并自动运行宏，并保持 Office 安全更新为最新状态。同时开启附件和宏安全防护，限制从邮件或网页中打开此类文档。

That's good. Let me output it.<value>建议立即安装微软安全公告 MS00-071 提供的补丁（适用于 Microsoft Word 2000），修复邮件合并功能在打开 Access 数据库时未提示即自动执行 VBA 脚本的缺陷。如无法及时安装补丁，可采取以下缓解措施：一、在 Word 中将宏安全级别设置为"高"，并取消勾选"信任对 VBA 工程对象模型的访问"选项，使宏执行前强制弹出确认提示或直接禁用；二、设置邮件合并数据源时，仅从可信来源选择 .mdb 数据库文件，严禁打开来源不明的 Access 数据库，避免加载恶意 VBA 脚本；三、通过组策略或注册表策略限制邮件合并自动运行宏，同时警惕通过 Outlook、IE 或邮件附件诱导打开此类文档的投递方式，并保持安装最新版 Office 安全更新以彻底封堵该攻击路径。"""
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Microsoft Word 邮件合并功能代码执行漏洞"
