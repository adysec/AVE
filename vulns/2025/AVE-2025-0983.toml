[basic]
description = "Linux 内核 workqueue 子系统中存在释放后使用（use-after-free）漏洞。commit 68f83057b913 在收割普通工作线程时未正确处理救援线程（rescuer），并移除了 put_unbound_pool() 中等待救援线程的代码，导致攻击者在本地获得低权限后可通过触发 pool 释放后仍持有引用的方式利用该漏洞，实现本地权限提升。该漏洞影响运行受影响内核版本的 Linux 系统，攻击条件为攻击者需具有本地低权限访问权限，成功利用后可获得高权限执行代码，对系统机密性、完整性和可用性造成严重影响。CVSS 评分 7.8，危害等级高。"
published = "2025-02-27T03:15:19.450"
remediation = "立即升级 Linux 内核至已修复版本：主流发行版请升级至 RHEL 9 的 kernel-5.14.0-611.5.1.el9_7、Ubuntu 24.10 的 6.11.0-26.26、Debian trixie 的 6.12.94-1 或 sid 的 7.1.6-1，或上游稳定版 6.12.16、6.13.4 及后续版本。如暂无法升级，可临时通过 sysctl 限制 unbound workqueue 的使用，或禁用可能触发 rescuer 路径的内核模块作为缓解措施，但重启后需立即应用补丁内核。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 workqueue 释放后使用漏洞"
updated = "2026-06-17T08:44:16.453"

