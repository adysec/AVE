[basic]
description = "libpng 1.5.4 版本的 pngrutil.c 文件中 png_handle_cHRM 函数存在除零错误漏洞。当启用色彩校正支持时，远程攻击者可通过向目标系统提交包含特定零值 cHRM 数据块的畸形 PNG 图像触发除零异常，导致应用程序崩溃，造成拒绝服务。该漏洞影响使用 libpng 1.5.4 的应用程序及 Apple iOS 6.0 之前版本，攻击复杂度较高，需用户打开恶意构造的 PNG 文件。"
published = "2012-01-17T19:55:00Z"
remediation = "升级 libpng 至 1.5.5 或更高版本，该版本修复了 png_handle_cHRM 函数中除零错误的缺陷。对于使用 libpng 的应用程序（如 Apple iOS 设备），请升级至 iOS 6.0 及以上版本。如无法立即升级，可在应用中禁用 libpng 的色彩校正功能（关闭 PNG_COLOR_CORRECTION_SUPPORTED 编译选项）作为临时缓解措施。"
score = 2.6
severity = "LOW"
sources = ["tenable"]
title = "libpng cHRM 除零错误拒绝服务漏洞"
updated = "2026-06-16T23:33:05Z"

