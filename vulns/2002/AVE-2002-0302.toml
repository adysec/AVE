[basic]
description = "KON kon2 0.3.9b及更早版本中存在缓冲区溢出漏洞，本地用户可通过向 kon2 程序传递超长的 -Coding 命令行参数触发缓冲区溢出，导致任意代码执行。该漏洞影响 Linux/Unix 系统上使用 kon2 控制台工具的环境，攻击者需要本地系统访问权限，成功利用后可获取与目标进程相同的权限，实现本地权限提升。"
published = "2003-06-16T04:00:00.000"
remediation = "建议升级 kon2 至 0.3.9b 以上版本。Red Hat 用户安装 RHSA-2003:047/RHSA-2003:050 提供的更新包；Mandrake 用户安装 MDKSA-2003:064 补丁。如无法升级，移除 kon2 的 setuid 位以缓解提权风险：chmod u-s /usr/bin/kon。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "KON kon2 本地缓冲区溢出漏洞"
updated = "2026-06-16T21:58:49.640"

