[basic]
description = "Coder 工作区代理 API 存在重定向处理漏洞，`agentConn.apiClient()` 使用 `http.Client` 默认重定向行为，攻击者可通过构造恶意重定向将控制面客户端的 API 请求劫持至其他工作区代理。攻击者需具备工作区写入权限并控制被修改的工作区代理，利用 HTTP 307/308 等保持方法的重定向可重放写请求和进程启动请求，跨工作区和租户边界读取或写入受害代理的文件，甚至通过链式利用执行命令。受影响版本包括 2.34 之前、2.33 之前、2.32 之前及 2.29 ESR 之前的版本。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
score = 5
