[basic]
description = "tags.<value>VolanoChatPro 聊天服务器在安装时将配置文件设置为全局可读权限，并将服务器管理员密码以明文方式存储在本地的配置文件中。本地攻击者可利用此缺陷直接读取配置文件，获取管理员凭据后提升权限，从而以管理员身份控制服务器。该漏洞影响安装了 VolanoChatPro 的系统，CVSS 评分 7.5，危害等级为高危。攻击前提是攻击者需具备目标系统的本地访问权限。"
published = "2001-01-09T00:00:00Z"
remediation = "升级到 Volano Chat Server 最新版本（2.13.6）以修复明文存储管理员密码及配置文件权限过大的问题。如暂时无法升级，应立即修改 VolanoChatPro 安装目录下配置文件的权限为仅管理员可读写（chmod 600），将配置文件中明文保存的管理员密码替换为加密哈希值，并限制服务器本地非授权用户的访问权限。临时缓解措施还包括禁用本地用户登录或通过防火墙限制管理端口的远程访问。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Volano VolanoChat Pro 权限提升漏洞"
updated = "2001-01-09T00:00:00Z"

