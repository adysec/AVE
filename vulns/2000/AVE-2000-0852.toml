[basic]
description = "BEA WebLogic 5.1.x 存在源代码读取漏洞，远程攻击者可通过在 URL 中插入 `/*.shtml/` 路径遍历序列，触发 SSIServlet 解析机制，导致服务器返回 JSP、Servlet 等解析页面的原始源代码。攻击者无需身份认证即可利用，泄露的源代码可能包含数据库连接凭证、业务逻辑等敏感信息，进一步扩大攻击面。该漏洞影响 BEA WebLogic 5.1.x 系列版本。"
published = "2000-10-20T04:00:00.000"
remediation = "BEA 已于 2000 年发布安全公告（Security Alert 000728），建议立即升级 WebLogic Server 至 5.1.x 的补丁版本或更高版本。由于 BEA 已被 Oracle 收购，当前应升级至 Oracle WebLogic Server 12.2.1.4 或 14.1.1.0 等受支持版本。如无法升级，可在 Web 服务器或反向代理层配置规则，拦截包含 `/*.shtml/` 模式的 URL 请求作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "BEA WebLogic 源代码读取漏洞"
updated = "2026-06-16T21:52:15.643"

