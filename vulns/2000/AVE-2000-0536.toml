[basic]
description = "BEA WebLogic 5.1.x 版本存在 JSPServlet 访问控制缺陷，未对 JSPServlet 的访问权限进行严格限制。远程攻击者无需身份认证，可通过直接调用 JSPServlet 对任意源文件进行编译并执行 Java JSP 代码。由于该 Servlet 允许对服务器上的源文件进行编译执行，攻击者可利用此漏洞在目标系统上执行任意恶意代码，进而完全控制服务器。该漏洞 CVSS 评分 10.0，属于最高危级别，影响 WebLogic 5.1.x 全部版本。攻击者仅需能够访问 WebLogic 服务器的 HTTP 端口即可触发，无需任何特殊条件或认证凭据。建议立即升级 WebLogic 至安全版本以修复此漏洞。"
published = "2000-10-20T04:00:00Z"
remediation = "立即安装 BEA Systems 2000 年 7 月 31 日发布的安全补丁（参见 http://developer.bea.com/alerts/security_000731.html）。若无法获取原厂补丁，可在 WebLogic 5.1.x 的 web.xml 中为 JSPServlet 添加 <security-constraint> 配置，限制仅允许受信任的内部 IP 访问 /jsp/ 路径。同时升级至受支持的 Oracle WebLogic Server 版本（如 14c 或更高），因为 WebLogic 5.1.x 已于 2004 年终止支持。作为临时缓解措施，在网络边界防火墙上阻断外部对 JSP 页面的直接 HTTP 请求。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "BEA WebLogic JSPServlet 远程代码执行漏洞"
updated = "2026-06-16T21:52:15Z"

