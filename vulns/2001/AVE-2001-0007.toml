[basic]
description = "ISC BIND 8.2.x 的事务签名（TSIG）处理代码存在堆缓冲区溢出漏洞，远程攻击者无需身份认证即可通过向目标 DNS 服务器发送特制的 TSIG 请求触发该漏洞，成功利用可导致以 root 权限执行任意代码，完全控制目标系统。该漏洞影响所有 BIND 8.2.x 版本，CVSS 评分 10.0，危害等级严重。"
published = "2001-02-12T05:00:00Z"
remediation = "立即升级 BIND 至 8.2.3 或更高版本，该版本修复了 TSIG 事务签名处理中的缓冲区溢出漏洞。Red Hat 用户应安装 RHSA-2001:007 更新，Debian 用户应应用 DSA-026 安全公告。临时缓解措施可在防火墙层面限制对 DNS 服务器 53/TCP 端口的访问，仅允许可信来源。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "ISC BIND 8.2.x TSIG 远程堆栈缓冲区溢出漏洞"
updated = "2026-06-16T21:53:29Z"

