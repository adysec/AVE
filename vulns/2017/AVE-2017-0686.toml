[basic]
description = "Cisco IOS 和 IOS XE 软件的集群管理协议（CMP）处理代码存在远程代码执行漏洞。该漏洞源于两个因素：一是设备未能限制 CMP 专用 Telnet 选项仅用于集群成员间的内部通信，而是接受并处理任何 Telnet 连接中的此类选项；二是对畸形 CMP 专用 Telnet 选项的处理存在缺陷。未经身份认证的远程攻击者可通过与受影响设备建立 Telnet 会话时发送特制的 CMP 专用 Telnet 选项来利用此漏洞，成功利用可导致任意代码执行并获得设备的完全控制权，或造成设备重载。该漏洞影响 Catalyst 交换机、IE 工业以太网交换机、ME 4924-10GE 交换机等多种 Cisco 设备，CVSS 评分 9.8，危害等级严重。"
published = "2017-03-17T22:59:00.640"
remediation = '建议立即升级至 Cisco 发布的修复版本（IOS 15.2(4)E10 / 15.5(3)S4 / 15.6(2)S1 / 15.7(1)S1 / 16.3.6 / 16.5.3 / 16.6.1 及更高版本，具体视设备型号而定），参考 Cisco Security Advisory cisco-sa-20170317-cmp。若暂时无法升级，请在所有受影响设备上执行：1) 使用 "no ip telnet server" 禁用 Telnet 服务；2) 配置 ACL 限制仅允许受信管理 IP 访问 TCP 23 端口；3) 启用 SSH 替代 Telnet 进行远程管理。'
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Cisco IOS和IOS XE Software集群管理协议远程代码执行漏洞"
updated = "2026-06-17T01:19:06.913"

