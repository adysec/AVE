[basic]
description = "Apple QuickTime 7.7.1 之前版本在 Windows 平台上处理 PICT 图像文件时存在整数溢出漏洞。远程攻击者无需身份认证即可通过构造恶意的 PICT 文件触发该溢出，成功利用后可在目标系统上执行任意代码或导致应用程序崩溃拒绝服务。该漏洞源于文件解析过程中对图像尺寸数据缺乏边界检查，当处理包含超大尺寸值的特制 PICT 文件时发生整数溢出，进而引发内存损坏。CVSS 评分 9.3，危害等级严重。Apple 已在 QuickTime 7.7.1 版本中修复此问题。"
published = "2011-10-28T02:49:52Z"
remediation = "将 Windows 系统上的 QuickTime 升级至 7.7.1 或更高版本。该整数溢出漏洞仅影响 Windows 平台的 QuickTime，Mac OS X 系统不受影响。如无法立即升级，建议暂时卸载 QuickTime，或避免打开来源不可信的 PICT 文件作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple QuickTime PICT 文件整数溢出漏洞"
updated = "2026-06-16T23:32:57Z"

