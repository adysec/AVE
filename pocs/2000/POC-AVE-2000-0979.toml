[info]
author = "AVE"
description = "检测目标 Mailman 版本是否为 1.1，该版本存在 %(listname) 宏展开命令注入漏洞，列表管理员可通过包含 shell 元字符的列表名执行任意系统命令"
id = "POC-AVE-2000-0979"
name = "GNU Mailman 1.1 命令注入漏洞 PoC"
severity = "high"
tags = ["ave-2000-0979"]
vuln_id = [
    "CVE-2000-0861",
    "AVE-2000-0979",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/mailman/listinfo"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Mailman 1.1"]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi-bin/mailman/listinfo"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Mailman 1.1"]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/mailman/admin"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Mailman 1.1"]

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/cgi-bin/mailman/admin"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["Mailman 1.1"]
