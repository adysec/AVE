[info]
author = "ave"
description = "RealPlayer SMIL文件解析堆缓冲区溢出漏洞，远程攻击者可通过精心构造的SMIL文件触发smlpkt.cpp中的内存越界写入，无需认证即可在目标系统上执行任意代码。"
id = "POC-AVE-2009-0057"
name = "CVE-2009-4257 PoC"
severity = "critical"
tags = ["ave-2009-0057"]
vuln_id = [
    "CVE-2009-4257",
    "AVE-2009-0057",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/tmp/malicious.smil"
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["smlrender"]
