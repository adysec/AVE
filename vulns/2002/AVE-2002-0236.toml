[basic]
description = "libpng 库的渐进式读取器在处理 PNG 数据流时，未正确校验 IDAT 数据块的实际长度与 IHDR 头部声明长度是否一致，导致缓冲区溢出漏洞。该漏洞影响 libpng 1.2.x 版本（1.2.4 之前）及 1.0.x 版本（1.0.14 之前），广泛用于各类图像处理软件、浏览器及图形库中。远程未认证攻击者可通过网络传播恶意构造的 PNG 文件，使 IDAT 数据量超出 IHDR 声明长度，诱导受害者使用受影响库解析图片，触发缓冲区溢出导致程序崩溃，造成拒绝服务攻击。攻击无需用户交互即可触发，CVSS 评分 5.0（AV:N/AC:L/Au:N/C:N/I:N/A:P），影响可用性。升级至 libpng 1.2.4 或 1.0.14 及以上版本可修复该漏洞。"
published = "2002-08-12T04:00:00Z"
remediation = "建议立即升级 libpng 至 1.2.4 或更高版本（1.2.x 分支），或升级至 1.0.14 或更高版本（1.0.x 分支）。若无法立即升级，可在应用层禁用渐进式 PNG 解析功能，或配置图像处理库拒绝处理不受信的 PNG 文件作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "libpng libpng 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:58:01Z"

