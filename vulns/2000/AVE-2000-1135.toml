[basic]
description = "RideWay PN 代理服务器的 telnet 代理组件存在拒绝服务漏洞。远程攻击者无需身份验证即可向目标系统发送大量包含畸形请求的连接，由于代理服务对连接请求的校验机制不足，大量畸形连接请求可导致服务资源耗尽或进程异常终止，使合法用户无法正常使用代理服务。该漏洞影响部署了 RideWay PN 代理服务器的网络环境，攻击者可利用此漏洞造成服务中断。"
published = "2001-01-09T05:00:00Z"
remediation = "如无必要，请在 RideWay PN 代理服务器配置中禁用 telnet 代理功能。若需保留，应在代理配置中添加连接请求校验规则，拒绝包含畸形内容的请求，并设置单 IP 最大并发连接数限制与连接速率阈值；同时在网络边界防火墙中仅允许受信任网段访问 telnet 代理端口，阻断外部恶意连接流量。如厂商已发布补丁版本，应升级至最新安全版本。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "ITServ RideWayPN Telnet 代理 连接洪水拒绝服务漏洞"
updated = "2026-06-16T21:53:20Z"

