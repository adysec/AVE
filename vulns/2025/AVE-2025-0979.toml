remediation = "升级 Linux 内核至包含修复补丁的版本：上游 6.1.129、6.6.79、6.12.16、6.13.4 或 6.14 及以上版本；Ubuntu 22.04 LTS 用户升级至 5.15.0-171.181，Ubuntu 20.04 LTS 用户升级至 5.4.0-227.247，Ubuntu 24.04 LTS 用户升级至 6.8.0-78.78。如无法立即升级内核，可通过 chmod 限制 /sys/class/drm/card*/device/pp_table 的写入权限，仅允许 root 用户访问，作为临时缓解措施。各 Linux 发行版应尽快应用上游 stable 补丁 commit 1abb2648。"
