[basic]
description = "Apache HTTP Server 2.4.17 至 2.4.38 版本在使用 event、worker 或 prefork 多路处理模块（MPM）时，子进程或线程中执行的代码（包括脚本解释器执行的脚本）可通过操作 scoreboard 共享数据结构，以父进程（通常为 root）的权限执行任意代码。该漏洞仅影响类 Unix 系统，攻击者需要能够在 Web 服务器上下文中执行低权限代码，通过修改 scoreboard 中的特权标志位实现本地权限提升，进而完全控制目标服务器。Apache 官方已在 2.4.39 版本中修复此漏洞。"
published = "2019-04-08T22:29:00Z"
remediation = "立即将 Apache HTTP Server 升级到 2.4.39 或更高版本，该版本已修复 scoreboard 操纵导致的权限提升漏洞。如无法立即升级，应在 MPM event、worker 或 prefork 配置中禁用不必要的进程内脚本解释器模块（如 mod_lua、mod_php），限制低权限 Web 子进程对 scoreboard 的写入权限，仅允许 root 用户执行 apache2ctl graceful 以避免与 logrotate 触发竞争条件，并监控 httpd 子进程是否存在异常提权行为。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Apache HTTP Server 本地权限提升漏洞"
updated = "2026-06-17T02:07:58Z"

