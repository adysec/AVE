[basic]
description = "IBM HTTP Server 1.3.6（基于 Apache HTTP 服务器）在处理超长 HTTP GET 请求时存在缓冲区溢出漏洞。远程攻击者无需身份认证，即可通过向目标服务器发送精心构造的超长 GET 请求触发该漏洞。攻击者利用此漏洞可造成服务器拒绝服务，在特定条件下还可能在目标系统上执行任意命令。受影响版本为 IBM HTTP Server 1.3.6，CVSS v3 评分 7.5，危害等级为高。该漏洞攻击复杂度低且无需用户交互，威胁程度严重，建议受影响用户升级至安全版本并部署 Web 应用防火墙进行防护。"
published = "2001-01-09T05:00:00Z"
remediation = "立即将IBM HTTP Server从1.3.6升级至IHS 1.3.12版本，该版本已修复长GET请求导致的缓冲区溢出漏洞。在升级前，可在WebSphere Application Server的httpd.conf中设置LimitRequestLine指令限制GET请求行长度不超过8190字节作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "IBM HTTP Server 长GET请求拒绝服务漏洞"
updated = "2026-06-16T21:53:18Z"

