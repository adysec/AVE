[info]
author = "ave"
description = "验证目标是否存在同源策略绕过XSS漏洞：当SVG以application/octet-stream类型返回时，浏览器仍将其作为SVG渲染，导致跨站脚本执行"
id = "POC-AVE-2010-0124"
name = "CVE-2010-0162 PoC"
severity = "medium"
tags = ["ave-2010-0124"]
vuln_id = [
    "CVE-2010-0162",
    "AVE-2010-0124",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/vuln.svg"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["<svg"]
