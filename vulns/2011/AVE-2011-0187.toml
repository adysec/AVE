[basic]
description = "Google Chrome 17.0.963.65 之前版本存在 SVG 动画元素使用后释放漏洞，远程攻击者可通过诱导用户访问包含恶意 SVG 动画元素的网页触发该漏洞，导致浏览器崩溃造成拒绝服务，或可能执行任意代码。该漏洞源于 WebKit 渲染引擎在处理 SVG 动画元素时内存管理不当，释放内存后仍继续引用已释放对象。影响 Google Chrome 17.0.963.65 之前所有版本，攻击者需构造恶意网页诱导用户访问，CVSS 评分 6.8（中等），属于 CWE-416 使用后释放类型漏洞。"
published = "2012-03-05T19:55:01Z"
remediation = "建议立即将 Google Chrome 升级至 17.0.963.65 或更高版本，可通过 Chrome 菜单→帮助→关于 Google Chrome 自动检查更新并重启浏览器完成修复。若无法立即更新，可暂时禁用 SVG 动画或使用扩展禁用 SVG 渲染作为临时缓解措施，并尽快安排浏览器升级。建议同时开启 Chrome 自动更新功能，确保后续安全补丁及时获取。如在企业环境，可通过组策略或 Chrome Enterprise 策略强制推送更新至所有终端。"
score = 6.8
severity = "MEDIUM"
sources = ["tenable"]
title = "Google Chrome SVG 动画元素使用后释放漏洞"
updated = "2026-06-16T23:32:29Z"

