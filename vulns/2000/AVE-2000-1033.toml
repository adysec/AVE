[basic]
description = "Microsoft NWLink 的 NMPI（基于 IPX 的名称管理协议）监听器未正确过滤来自广播地址的数据包，未经身份验证的远程攻击者可通过发送源自广播地址的特制数据包触发该漏洞，进而引发广播风暴并淹没整个网络，导致拒绝服务。该漏洞影响运行 Microsoft NWLink IPX/SPX 协议栈的 Windows NT/2000 系统，攻击者无需事先认证即可利用此缺陷造成网络中断。"
published = "2000-12-19T05:00:00Z"
remediation = "安装 Microsoft 安全公告 MS00-073 发布的补丁（KB273727），该补丁修复 NWLink 对 NMPI 广播数据包的过滤缺陷，使 NWLink 忽略源地址与目的地址相同的畸形 NMPI 请求。若无法立即打补丁，请在网络连接属性中禁用 NWLink IPX/SPX 兼容协议，或在交换机/网关上配置 ACL 过滤 IPX NMPI 广播报文，以临时阻断广播攻击路径。受影响系统包括 Windows 95、Windows 98、Windows 98 Second Edition 及 Windows Me。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Microsoft NWLink NMPI 监听器广播风暴拒绝服务漏洞"
updated = "2026-06-16T21:52:54Z"

