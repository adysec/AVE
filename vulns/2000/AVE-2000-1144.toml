[basic]
description = "IBM HTTP Server SSL 模块 (IBMHSSSB) 1.0 版本中的 ikeyman 组件存在 CLASSPATH 环境变量配置不当漏洞。该组件将用户自定义的 CLASSPATH 目录置于系统目录之前，导致本地恶意用户可通过植入木马 Ikeyman 类文件，在以 root 权限运行 ikeyman 时实现任意代码执行并提权至 root。该漏洞影响 IBM HTTP Server SSL 模块 1.0 版本，CVSS 评分 7.2（高危），攻击向量为本地，需低权限用户交互，可完全破坏系统机密性、完整性和可用性。"
published = "2001-08-31T04:00:00Z"
remediation = "升级 IBM HTTP Server SSL Server Bundle (IBMHSSSB) 至修复版本或应用 IBM 官方安全补丁（参考 BID 1092/X-Force 4235），修正 ikeyman 组件的 CLASSPATH 环境变量排序问题，确保系统目录优先于用户目录；若无法立即升级，可通过限制本地用户写入权限、移除用户自定义 CLASSPATH 路径或禁用 ikeyman 服务作为临时缓解措施。"
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "IBM IBMHSSSB 1.0 代码执行漏洞"
updated = "2026-06-16T21:53:22Z"

