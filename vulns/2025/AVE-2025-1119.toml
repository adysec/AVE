[basic]
description = "标签中。<value>Linux 内核网络子系统的 dst_release 函数存在释放后使用漏洞。此前上游补丁将 dst 计数器递减操作从 dst_destroy 移至 dst_release，以避免网络命名空间（netns）dismantle 时访问已释放的内存数据；然而在启用 CONFIG_DST_CACHE 配置且使用 Open vSwitch 隧道（OvS+tunnels）的场景下，该修复不完整，缓存的 dst 条目在释放后仍可能被访问，导致内核页错误（Unable to handle kernel paging request）及内存损坏。具有本地访问权限的低权限攻击者，在系统使用 OvS 隧道并触发 netns dismantle 的条件下，可利用此漏洞导致内核崩溃、信息泄露或特权提升。该漏洞影响启用 DST 缓存特性的 Linux 内核版本，CVSS 评分 7.8。"
published = "2025-04-16T15:15:59Z"
remediation = "建议将 Linux 内核升级至已修复版本：6.6.87、6.12.23、6.13.11、6.14.2 或更高版本，或应用上游补丁 commit ccc331fd5bcae131d2627d5ef099d4a1f6540aea。各发行版用户应安装对应的安全更新包。如暂无法升级，可临时禁用内核配置 CONFIG_DST_CACHE 或关闭 Open vSwitch 隧道功能以降低被利用风险。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核网络子系统 dst_release 释放后使用漏洞"
updated = "2026-07-30T06:22:09Z"

