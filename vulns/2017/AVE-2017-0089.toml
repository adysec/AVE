[basic]
description = "WordPress visitors-online插件在1.0.0之前版本存在多个跨站脚本（XSS）漏洞（CWE-79）。该插件用于在WordPress网站上展示访客统计信息，但在处理用户输入时未进行充分的过滤、转义和验证，导致恶意JavaScript代码可被注入到生成的网页中。攻击者无需认证，通过网络发起低复杂度攻击，但需要用户交互——即诱使受害者点击包含恶意构造参数的链接。当用户访问被注入脚本的页面时，恶意代码在受害者的浏览器上下文中执行，可导致会话凭证窃取（Cookie劫持）、页面内容篡改、重定向至恶意网站或执行未经授权的操作。该漏洞影响所有安装了visitors-online插件1.0.0之前版本的WordPress站点，CVSS v3评分为6.1（中危）。开发者已在1.0.0版本中修复此问题，建议用户立即升级插件版本。"
published = "2019-08-21T12:15:10Z"
remediation = "立即将 WordPress visitors-online 插件升级至 1.0.0 或更高版本（当前最新为 1.1.6），该版本已修复多个跨站脚本漏洞。可通过 WordPress 后台「插件」页面点击「Visitors Online」插件的「更新」按钮完成升级，或手动从 WordPress.org 下载最新版覆盖 /wp-content/plugins/visitors-online/ 目录。若暂时无法升级，建议禁用并删除该插件作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress visitors-online 插件跨站脚本漏洞"
updated = "2026-06-17T01:13:03Z"

