[basic]
description = "Linux 内核的 CAN FD 控制器驱动（ctucanfd）中，错误中断处理函数 ctucan_err_interrupt() 在处理 skb 缓冲区分配失败时存在空指针解引用漏洞。当内核无法分配 socket 缓冲区（skb）时，指向 can_frame 结构体的指针为 NULL，而该函数中某处代码未对 NULL 指针进行检查就直接解引用，导致系统崩溃或拒绝服务。该漏洞影响 Linux 内核中集成了 CTU CAN FD 硬件支持的版本，需要攻击者已在目标系统上拥有本地低权限访问权限（PR:L）并具备一定的交互能力（UI:N），攻击向量为本地（AV:L）。成功利用该漏洞可导致系统不可用（A:H），但无法影响保密性或完整性（C:N/I:N）。该漏洞由 Linux Verification Center（linuxtesting.org）通过 SVACE 静态分析工具发现，已在后续内核版本中修复。"
published = "2025-02-27T03:15:18.167"
remediation = "升级 Linux 内核至已修复的版本。Ubuntu 24.04 LTS 用户请升级至 linux-image-6.8.0-78-generic 或更高版本（执行 apt update && apt upgrade linux-image-generic 后重启）；Debian 12 (bookworm) 用户请升级至 linux-image-6.1.129-1 或更高版本；Red Hat Enterprise Linux 用户请关注官方安全公告并安装对应内核补丁。如果无法立即升级内核，可通过 modprobe -r ctucanfd 临时卸载 ctucanfd 内核模块以缓解风险。也可通过 sysctl 限制本地用户对 CAN 设备的访问权限（如设置 net.core.somaxconn 并配置相应的 udev 规则）作为临时缓解措施，但最佳做法仍然是尽快应用内核安全更新。"
score = 5.5
severity = "MEDIUM"
sources = ["msrc"]
title = "Linux 内核 ctucanfd 空指针解引用漏洞"
updated = "2026-06-17T08:44:14.973"

