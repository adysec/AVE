[basic]
description = "opendreambox 2.0.0 的 webadmin 插件中 Script.py 文件存在操作系统命令注入漏洞，远程攻击者无需身份认证即可通过向 /script 接口的 command 参数注入 shell 元字符，执行任意操作系统命令。该漏洞影响运行 opendreambox 2.0.0 的设备，CVSS 评分 9.8，危害等级严重。攻击者利用此漏洞可完全控制目标系统，实现数据窃取、恶意软件植入等操作。建议升级至最新版本或限制 /script 接口的访问权限。"
published = "2017-09-04T23:29:00Z"
remediation = "立即升级 opendreambox 至 2.0.0 以上版本，或禁用 webadmin 插件（通过 Enigma2 插件管理界面移除或停用）。如无法升级，手动修复 Script.py：在 render 方法中对 command 参数进行输入验证，使用白名单机制仅允许执行 /usr/script 目录下的 .sh 脚本，并使用 subprocess 列表参数替代 shell=True 调用，彻底阻断 shell 元字符注入。临时缓解措施：在防火墙上限制对 webadmin 端口（如 80/8081/8880/10000）的访问来源 IP，仅允许受信任的管理网段访问。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "opendreambox webadmin 插件操作系统命令注入漏洞"
updated = "2026-06-17T01:05:39Z"

