[basic]
description = "Marconi ASX-1000 ASX 交换机（运行 Forethought 6.2 系统）的 Telnet 和 Web 管理接口存在拒绝服务漏洞。漏洞原理在于其 TCP/IP 协议栈未正确处理同时设置了 SYN-FIN 标志位和 More Fragments 属性的畸形网络数据包。远程攻击者无需身份认证，即可通过向设备发送特制的 TCP 数据包触发该漏洞，导致 Telnet 和 Web 管理服务异常或中断，影响网络设备的远程管理能力。该漏洞利用复杂度低，攻击者可从网络任意位置发起攻击，造成设备可用性部分丧失。"
published = "2001-05-03T04:00:00Z"
remediation = "该漏洞影响已停止支持的 Marconi ASX-1000 交换机 Forethought 6.2 固件，建议将设备固件升级至 Marconi 官方发布的安全修复版本。若官方已不再提供更新，应通过访问控制列表（ACL）或防火墙规则限制 Telnet（TCP 23）和 Web 管理接口的访问源地址，仅允许受信管理主机访问。同时建议在管理接口前部署入侵检测系统（IDS），监控并拦截带有异常 TCP SYN-FIN 标志组合和分片标志的数据包。如条件允许，应将运行该固件的 ASX-1000 交换机替换为受支持的设备型号，从根本上消除漏洞风险。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Marconi ASX-1000 交换机 Telnet/Web 管理接口拒绝服务漏洞"
updated = "2026-06-16T21:54:00Z"

