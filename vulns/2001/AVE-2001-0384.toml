[basic]
description = "Oracle9iAS Web Cache 2.0.0.1 版本在处理 HTTP GET 请求时存在缓冲区溢出漏洞，远程未经身份认证的攻击者可通过发送超长的 HTTP GET 请求触发栈缓冲区溢出，导致任意代码执行。该漏洞影响 Oracle9iAS Web Cache 2.0.0.1 版本，CVSS 评分 7.5（CVSS:AV:N/AC:L/Au:N/C:P/I:P/A:P），属于高危漏洞。攻击者无需身份认证即可远程发起攻击，通过构造超长的 HTTP GET 请求 URL 触发缓冲区溢出，进而控制程序执行流执行任意 Shellcode。ExploitDB (Exploit-DB-21121) 等公开渠道已有公开 Exploit 代码，攻击者可直接利用实现远程代码执行。Oracle 已发布补丁修复该漏洞，建议受影响用户尽快升级至修复版本或应用官方补丁。"
published = "2001-12-06T05:00:00Z"
remediation = "建议升级至 Oracle9iAS Web Cache 2.0.1.0 或更高版本（需联系 Oracle 获取补丁补丁集 Patchset 2.0.1.0 或更高版本）。若无法升级，建议在防火墙层面限制对 Web Cache 管理端口（默认 4000/4001/4002）和 HTTP 端口（默认 7777/7778）的访问，仅允许受信任 IP 访问；同时在 Web Cache 配置文件 webcache.xml 中限制最大 HTTP 请求长度（设置 <MAX_REQUEST_LENGTH> 限制 URL 长度），并禁用不必要的管理端口对外暴露。若业务允许，建议迁移至 Oracle Web Cache 10g/11g 或更高版本并及时应用 Oracle 官方安全补丁（参考 Oracle Critical Patch Update 补丁）。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Oracle 9iAS Web Cache 2.0 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:55:03Z"

