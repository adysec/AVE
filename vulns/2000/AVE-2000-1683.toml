[basic]
description = "Mobius DocumentDirect for the Internet 1.2 的 Web 授权表单存在缓冲区溢出漏洞，远程攻击者可通过向该表单提交超长用户名参数触发缓冲区溢出，导致目标系统拒绝服务或执行任意命令。该漏洞影响 Mobius DocumentDirect for the Internet 1.2 版本，CVSS 评分 10.0，危害等级严重。攻击者无需身份认证即可远程利用，攻击复杂度低。"
published = "2000-11-14T05:00:00Z"
remediation = "Mobius DocumentDirect for the Internet 1.2 已停止维护，官方不再提供安全补丁。建议立即迁移至受支持的替代产品；如无法迁移，在 Web 服务器或反向代理层对 username 输入字段实施严格的长度校验（限制不超过 64 字符），并过滤特殊字符（如 shell 元字符），同时在网络防火墙上限制仅允许可信 IP 访问该 Web 授权服务端口，以降低远程利用风险。"
score = 10
severity = "CRITICAL"
sources = ["avd"]
title = "Mobius DocumentDirect for the Internet 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:32Z"

