[basic]
description = "Gordano NTMail 5.0 和 6.0 版本的 Web 配置服务器存在拒绝服务漏洞。远程攻击者无需身份认证即可通过网络向目标服务器发送一系列不完整的 HTTP 请求，导致服务器资源耗尽或进程崩溃，从而使邮件服务不可用。该漏洞攻击复杂度低，仅需网络访问即可触发，影响 NTMail 5.0 及 6.0 版本。"
published = "2000-11-14T05:00:00Z"
remediation = "该产品已停止维护，厂商 Gordano 已停止运营，无官方补丁可用。建议立即迁移至其他受支持的邮件服务器软件（如 Exchange、Postfix 等）。若无法立即迁移，可在防火墙层面限制仅信任 IP 访问 NTMail Web 配置服务端口（默认 80/443），或直接禁用 Web 配置服务模块以消除攻击面。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Gordano NTMail Web Configuration Server HTTP请求处理拒绝服务漏洞"
updated = "2026-06-16T21:52:37Z"

