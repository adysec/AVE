[basic]
description = "Evolvable Shambala Server 4.5 的 Web 服务器组件存在拒绝服务漏洞。远程攻击者可通过向目标服务器发送特制的畸形 HTTP 请求，触发服务器处理异常导致崩溃，造成服务不可用。该漏洞无需身份认证即可远程利用，攻击复杂度低，但仅影响服务可用性，不涉及数据泄露或篡改。CVSS 评分 5.0，危害等级中危。目前已有公开的 PoC 利用代码。"
published = "2002-10-04T04:00:00Z"
remediation = 'Shambala Server 4.5 已停止维护且无官方补丁，建议立即迁移至 Apache 或 Nginx 等现代 Web 服务器。临时缓解措施：在网络边界防火墙或反向代理层面过滤包含异常字符（如单个 `!` 后跟 `\r\n`）的畸形 HTTP 请求，并限制仅允许可信 IP 访问服务器 80 端口。'
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "Evolvable Shambala Server 4.5 HTTP请求拒绝服务漏洞"
updated = "2026-06-16T21:58:18Z"

