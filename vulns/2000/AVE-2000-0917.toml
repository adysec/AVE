[basic]
description = "O'Reilly WebSite Pro 2.3.7 在安装时将 uploader.exe 程序设置为所有用户均可执行权限，远程攻击者无需任何身份认证即可直接调用该上传程序，向服务器上传任意恶意文件并执行，从而获取服务器的控制权限。该漏洞影响 O'Reilly WebSite Pro 2.3.7 版本，CVSS 评分 7.5，危害等级高，攻击复杂度低，且无需用户交互。"
published = "2000-10-20T04:00:00.000"
remediation = "立即删除或重命名 WebSite Pro 安装目录下的 uploader.exe 文件，或通过文件系统权限设置仅允许管理员执行该程序（如 chmod 700 uploader.exe）。同时在 Web 服务器配置中禁止直接访问 /uploader.exe 路径。建议升级到已修复此问题的最新版本或迁移至其他受支持的 Web 服务器软件。"
score = 7.5
severity = "HIGH"
sources = ["epss"]
title = "O'Reilly WebSite Pro 任意文件上传漏洞"
updated = "2026-06-16T21:52:26.580"

