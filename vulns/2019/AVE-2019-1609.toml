[basic]
description = "Kibana 5.6.15 之前及 6.6.1 之前的 Timelion 可视化组件存在代码注入漏洞，攻击者可构造包含恶意 JavaScript 代码的 Timelion 表达式请求，经服务器解析后触发任意代码执行，最终以 Kibana 进程权限在目标主机上执行任意系统命令。该漏洞影响所有使用受影响版本 Kibana 的 Elastic Stack 部署，CVSS 评分 10.0，危害等级严重。Elastic 已在 5.6.15 和 6.6.1 版本中修复该漏洞。"
published = "2019-03-25T19:29:02Z"
remediation = "立即将 Kibana 升级至 5.6.15、6.6.1 或更高版本（推荐直接升级至当前最新稳定版），以修复 Timelion 可视化编辑器中的原型链污染导致的任意代码执行漏洞。若使用 Red Hat OpenShift 容器平台，请应用 RHSA-2019:2860 安全更新（OpenShift 4.1.18）。如暂时无法完成版本升级，可通过 Kibana 配置文件 kibana.yml 中的 `xpack.security.enabled: true` 启用身份认证，并严格限制对 Timelion 应用的访问权限，仅允许受信任用户使用，作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["nuclei"]
title = "Elastic Kibana Timelion 远程代码执行漏洞"
updated = "2026-06-17T02:40:45Z"

