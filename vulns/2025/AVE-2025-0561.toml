[basic]
description = "Google Chrome 的 Google Updater 组件在实现上存在不恰当的处理逻辑，远程攻击者可通过构造恶意文件向目标发送特制载荷，触发该漏洞并实现权限提升。该漏洞影响 Mac 平台上 Google Chrome 143.0.7499.41 及之前版本，攻击者无需身份认证即可发起远程攻击，但需要用户交互才能完成利用流程。成功利用后，攻击者可获得系统级权限，完全影响目标系统的机密性、完整性和可用性，CVSS 评分为 8.8，危害等级高。Google 已在新版本中修复此漏洞。"
published = "2025-12-02T19:15:47Z"
remediation = "立即将 Google Chrome 升级至 143.0.7499.41 或更高版本，该版本已修复 Google Updater 中的权限提升漏洞。在 macOS 上，打开 Chrome 点击「关于 Google Chrome」触发自动更新，或通过终端执行 `google-chrome --version` 确认版本号。已部署环境可通过 MDM 策略强制推送更新。如暂时无法升级，可在终端中对 Google Updater 进程施加沙盒限制（`sandbox-exec` 配置文件禁止其写入敏感目录），并禁用非必要用户的 Chrome 自动更新权限以降低攻击面。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome Google Updater 权限提升漏洞"
updated = "2026-06-17T08:34:28Z"

