[basic]
description = "OpenSSH 2.9.9 之前版本在使用密钥对及 `~/.ssh/authorized_keys2` 文件中多种类型密钥时，未能正确处理与特定密钥关联的 `from` 选项（用于限制登录来源 IP）。远程攻击者可通过在已授权密钥文件中配置不同类型的多个密钥，绕过 `from` 选项的 IP 地址限制，从未经授权的 IP 地址成功登录目标系统，导致访问控制失效。该漏洞影响 OpenSSH 2.9.9 之前的所有版本，CVSS 评分 7.5，危害等级高。"
published = "2001-10-18T04:00:00Z"
remediation = "升级 OpenSSH 至 2.9.9 或更高版本。Red Hat 用户可安装 RHSA-2001-114 提供的更新包；Mandrake 用户安装 MDKSA-2001-081 更新；Immunix 用户安装 IMNX-2001-70-034-01 更新。如无法立即升级，可在 authorized_keys2 文件中避免在同一密钥行混用 from 选项与多类型密钥，或改用 authorized_keys 文件替代 authorized_keys2。"
score = 7.5
severity = "HIGH"
sources = ["redhat"]
title = "OpenBSD OpenSSH 基于源的密钥 IP 访问控制绕过漏洞"
updated = "2026-06-16T21:56:09Z"

