[basic]
description = "Mozilla Firefox 4.x至11.0、Firefox ESR 10.x至10.0.4、Thunderbird 5.0至11.0、Thunderbird ESR 10.x至10.0.4以及SeaMonkey 2.9之前版本中存在跨站脚本（XSS）漏洞。该漏洞源于多字节字符集编码处理缺陷，特定字节序列在多字节字符编码过程中会破坏后续字节，导致字符边界解析错误。远程攻击者可利用特制的多字节字符集编码数据，在目标用户浏览器中注入并执行任意HTML或JavaScript脚本，从而窃取Cookie、会话令牌等敏感信息，或发起钓鱼攻击。攻击需诱导用户访问恶意构造的页面，CVSS评分4.3，危害等级中。"
published = "2012-04-25T10:10:17Z"
remediation = "升级 Firefox 至 12.0 及以上版本、Firefox ESR 至 10.0.4 及以上版本、Thunderbird 至 12.0 及以上版本、Thunderbird ESR 至 10.0.4 及以上版本、SeaMonkey 至 2.9 及以上版本。无法立即升级时，可在 Web 应用中部署输入输出编码过滤（如 HTML实体编码）作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["tenable"]
title = "Mozilla Firefox/Thunderbird/SeaMonkey 多字节字符集跨站脚本漏洞"
updated = "2026-06-16T23:37:21Z"

