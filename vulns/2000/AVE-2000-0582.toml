[basic]
description = "CVE-2000-0766是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2000-10-20T04:00:00Z"
remediation = "立即停止使用已停止维护的 vqServer 1.4.49，替换为当前维护的 Web 服务器（如 nginx 或 Apache）。若因业务原因必须继续运行 vqServer，应在前方部署反向代理（如 nginx），并配置 client_max_body_size 和 large_client_header_buffers 限制 HTTP 请求体与头部大小，拒绝超过 8KB 的 GET 请求，以阻断缓冲区溢出攻击。同时在网络边界防火墙禁用对 vqServer 端口的公网访问，仅允许可信内部 IP 连接。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "vqSoft vqServer HTTP GET 请求缓冲区溢出拒绝服务漏洞"
