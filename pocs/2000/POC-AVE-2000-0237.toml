[info]
author = "AVE"
description = "Panda Security 3.0 禁用注册表编辑功能后，本地用户可通过直接执行 .reg 文件绕过限制修改注册表并提升权限。创建包含恶意注册表项的 .reg 文件并执行即可绕过保护。"
id = "POC-AVE-2000-0237"
name = "Panda Security 3.0 Registry Bypass PoC"
severity = "low"
tags = ["ave-2000-0237"]
vuln_id = [
    "CVE-2000-0264",
    "AVE-2000-0237",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/tmp/exploit.reg"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
regex = "REGEDIT4|Windows Registry Editor Version"
type = "regex"
