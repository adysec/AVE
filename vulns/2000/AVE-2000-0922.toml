[basic]
description = "Microsoft Windows 2000 存在本地安全策略破坏漏洞，攻击者可通过发送畸形的 RPC 通信数据包，利用本地访问权限篡改目标系统的本地安全策略配置，导致系统拒绝服务。该漏洞影响 Windows 2000 操作系统，CVSS 评分为 2.1，危害等级为低。攻击条件为攻击者需具备本地访问权限，无需远程网络访问即可触发。Microsoft 已发布安全补丁修复此漏洞。"
published = "2000-10-20T04:00:00.000"
remediation = "建议立即安装 Windows 2000 Service Pack 1（SP1），该版本已修复此漏洞且同时解决其他多个安全问题，相关信息可参考 Microsoft 安全公告 MS00-062（https://technet.microsoft.com/en-us/security/bulletin/ms00-062）及知识库文章 KB269609。若因兼容性原因暂时无法升级到 SP1，可先行安装 MS00-062 专用补丁程序（下载地址：https://www.microsoft.com/download/details.aspx?FamilyId=D1D6BB56-C4B2-4A9F-A82E-4305F7C22627&displaylang;=en），并按 KB269609 中的文件清单验证安装正确性。作为临时缓解措施，可在边界防火墙阻断端口 137、138、139、443 的 UDP 协议流量，阻止外部主机通过 RPC 发送恶意请求；同时禁止不提供网络服务的 Windows 2000 工作站启用 RPC Listener 服务，以降低内网攻击面。"
score = 2.1
severity = "LOW"
sources = ["epss"]
title = "微软 Windows 2000 拒绝服务漏洞"
updated = "2026-06-16T21:52:26.823"

