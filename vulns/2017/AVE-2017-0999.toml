[basic]
description = "Cisco IOS 和 IOS XE 软件的 SNMP 子系统存在缓冲区溢出漏洞。该漏洞源于 SNMP 协议处理组件对特制 SNMP 数据包的长度校验不足，导致内存破坏。远程认证攻击者可通过向目标设备发送特制的 SNMPv1/SNMPv2c/SNMPv3 数据包触发该漏洞，成功利用可导致任意代码执行或设备重载，从而完全控制受影响系统。攻击者若使用 SNMPv2c 及更早版本需知道只读团体字符串，使用 SNMPv3 需拥有用户凭据。该漏洞影响所有启用了 SNMP 且未排除受影响 MIB 或 OID 的 Cisco IOS/IOS XE 设备，CVSS 评分 8.8，危害等级高。"
published = "2017-07-17T21:29:00Z"
remediation = "建议立即升级至 Cisco 官方修复版本，通过 Cisco IOS Software Checker（https://tools.cisco.com/security/center/iosChecker）查询对应版本并升级至 First Fixed 版本。如无法立即升级，可在全局配置模式下使用 snmp-server view NO_BAD_SNMP iso included 创建视图，逐一排除受影响 MIB（ADSL-LINE-MIB、ALPS-MIB、CISCO-BSTUN-MIB 等 10 个 MIB），然后通过 snmp-server community mycomm view NO_BAD_SNMP RO 将视图绑定到 SNMP community 字符串，限制对受影响 MIB 的访问。同时限制 SNMP 访问仅允许可信管理站 IP，并使用 ACL 过滤 SNMP 流量（UDP 161/162）。"
score = 8.8
severity = "HIGH"
sources = ["kev"]
title = "Cisco IOS/IOS XE SNMP 子系统缓冲区溢出远程代码执行漏洞"
updated = "2026-06-17T01:22:55Z"

