[info]
author = "ave"
description = "RealNetworks RealPlayer Cook编解码器在初始化时存在堆内存破坏漏洞，攻击者可通过发送特制的媒体文件触发 codec 初始化错误，可能导致远程代码执行。由于该漏洞属于本地媒体文件处理类漏洞，无公开的网络协议级PoC验证方法。"
id = "POC-AVE-2010-0120"
name = "CVE-2010-0121 PoC"
severity = "critical"
tags = ["ave-2010-0120"]
vuln_id = [
    "CVE-2010-0121",
    "AVE-2010-0120",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/tmp/cve-2010-0121-crafty-media.rm"
protocol = "file"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["cook codec initialization error"]
