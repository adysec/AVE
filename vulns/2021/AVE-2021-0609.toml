[basic]
description = "Micro Focus Operations Bridge Reporter（OBR）10.40 版本的 AdminService 组件存在未授权远程代码执行漏洞。攻击者无需身份认证即可向 /AdminService/urest/v1/LogonResource 接口发送特制 JSON 请求，在 userName 参数中利用反引号注入操作系统命令，从而在 OBR 服务器上执行任意系统指令，完全控制服务器并窃取所有监控数据。该漏洞影响 OBR 10.40 版本，CVSS 评分 9.8，危害等级严重，已被 CISA 列入已知被利用漏洞目录。"
published = "2021-02-08T22:15:12Z"
remediation = "请立即访问 OpenText 官方支持站点 https://softwaresupport.softwaregrp.com/doc/KM03775947 下载并安装针对 CVE-2021-22502 的安全补丁，将 Micro Focus Operation Bridge Reporter 升级至已修复该漏洞的版本。如当前无法安装补丁，应通过防火墙或网络访问控制列表限制对 OBR Server 的 LogonResource 端口的未授权访问，仅允许可信管理网段连接，同时密切监控 OBR 服务器上的异常进程启动和出站网络连接行为。CISA 已将本漏洞纳入已知被利用漏洞目录，要求 2021 年 11 月 17 日前完成修复。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Micro Focus Operation Bridge Reporter 远程代码执行漏洞"
updated = "2026-06-17T03:37:20Z"

