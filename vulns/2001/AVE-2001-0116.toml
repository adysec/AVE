[basic]
description = "Sudo 1.5 和 1.6 版本（早于 1.6.3p6）的日志记录组件存在堆缓冲区溢出漏洞。当 sudo 将待记录的日志数据拆分为子字符串传递给 syslog() 时，若溢出发生在堆内存上（取决于调用 do_syslog() 的函数路径），则存在被利用的风险。攻击者需拥有目标系统的本地用户账户权限，可通过构造特制的环境变量或命令行参数触发该溢出漏洞，进而实现堆内存破坏并劫持程序执行流程，最终将普通用户权限提升至 root 权限，完全控制系统。该漏洞影响 Linux 等类 Unix 平台上使用受影响 sudo 版本的系统，CVSS v2 评分为 7.2（高危），危害等级严重。Exploit-DB 已公开本地利用代码，攻击者成功利用后可执行任意代码获得 root 权限。Sudo 官方已在 1.6.3p6 版本中修复该漏洞，建议用户升级至安全版本。"
published = "2001-05-03T04:00:00Z"
remediation = '立即将 sudo 升级到 1.6.3p6 或更高版本以修复堆缓冲区溢出漏洞。可通过系统包管理器安装对应发行版的安全更新（如 Debian 的 DSA-031、Red Hat 的 RHSA-2001-018），或从 https://www.sudo.ws/ 下载最新源码编译安装。若暂时无法升级，可通过 visudo 编辑 /etc/sudoers 文件，在 Defaults 行中添加 "requiretty" 选项限制仅允许有终端会话的用户执行 sudo，同时在防火墙或主机访问控制层面严格限制本地用户对 sudo 二进制文件的访问权限，作为临时缓解措施。'
score = 7.2
severity = "HIGH"
sources = ["cve"]
title = "Sudo 本地缓冲区溢出权限提升漏洞"
updated = "2026-06-16T21:54:01Z"

