[basic]
description = "RedHat Interchange 4.8.6、4.8.3 及之前版本在 INET 模式下存在任意文件读取漏洞。远程攻击者无需身份认证即可利用该漏洞，通过向目标服务器发送特制请求，读取系统上的任意文件，导致敏感信息泄露。该漏洞影响范围较广，攻击复杂度低，仅需网络访问即可触发，危害等级中等。目前官方已发布安全更新建议升级至最新版本修复此漏洞。"
published = "2002-09-05T04:00:00Z"
remediation = "立即升级 Interchange 至 4.8.7 或更高版本（Debian 系统参照 DSA-150 安全公告更新软件包）。如无法升级，将运行模式从 INET 切换为 UNIX 域套接字模式，并在反向代理层配置规则拦截包含 `../` 的 URL 请求路径。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "RedHat Interchange 任意文件读取漏洞"
updated = "2026-06-16T21:58:18Z"

