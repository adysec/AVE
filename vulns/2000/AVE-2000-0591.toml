[basic]
description = "X-Chat 1.4.2 及更早版本的 IRC 客户端在处理消息中的 URL 时，未对其中嵌入的 shell 元字符进行安全过滤，而是直接将其拼接进系统命令以启动 Web 浏览器。远程攻击者只需在 IRC 频道中发送包含特殊 shell 字符（如反引号、管道符等）的恶意 URL，并诱导受害用户使用受影响的 X-Chat 客户端打开该链接，即可在受害者主机上以当前用户权限执行任意命令。该漏洞无需认证即可远程触发，CVSS 评分为 7.5，危害程度较高，建议受影响用户升级至修复版本或升级浏览器调用方式。"
published = "2000-10-20T04:00:00Z"
remediation = '升级 XChat 至 1.4.3 及以上版本即可修复该漏洞；鉴于该项目已停止维护，建议迁移至 XChat 的后续维护分支或改用其他维护活跃的 IRC 客户端（如 HexChat）。作为缓解措施，可在 XChat 设置中将"点击 URL 自动打开浏览器"功能关闭，或手动将 URL 复制到浏览器地址栏，避免客户端将含 shell 元字符的链接直接交由系统浏览器启动命令。'
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "XChat IRC 客户端 URL 处理远程命令执行漏洞"
updated = "2026-06-16T21:52:28Z"

