[basic]
description = "WebKit浏览器引擎存在内存破坏漏洞，该漏洞作为CVE-2012-0620被记录在多个WebKit内存损坏问题之中。当Apple iOS 5.1之前版本或iTunes 10.6之前版本使用WebKit解析恶意构造的网页内容时，远程攻击者可触发内存破坏进而执行任意代码或导致应用程序崩溃拒绝服务。用户无需任何身份认证，仅需访问攻击者控制的恶意网站即可触发该漏洞。该漏洞属于CWE-119缓冲区溢出类问题，CVSS评分为9.3，危害等级严重。Apple已在安全更新公告APPLE-SA-2012-03-07中修复此问题。"
published = "2012-03-08T22:55:03Z"
remediation = "建议立即将 Safari 升级至 5.1.4 或更高版本，将 iOS 升级至 5.1 或更高版本，将 iTunes 升级至 10.6 或更高版本，以修复 WebKit 中的内存破坏漏洞。Apple 已于 2012 年 3 月 7 日发布安全更新（APPLE-SA-2012-03-07-1 和 APPLE-SA-2012-03-07-2），可通过系统软件更新或访问 Apple 官网下载相应补丁。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "Apple WebKit 内存损坏远程代码执行漏洞"
updated = "2026-06-16T23:37:57Z"

