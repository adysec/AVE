[info]
author = "ave"
description = "Google Chrome 20.0.1132.57 之前版本 WebKit 布局高度跟踪存在释放后使用，需构造特制 HTML 页面触发浏览器崩溃，无法通过网络协议无损验证"
id = "POC-AVE-2012-0256"
name = "CVE-2012-2843 Google Chrome WebKit 释放后使用漏洞 PoC"
severity = "high"
tags = ["ave-2012-0256"]
vuln_id = [
    "CVE-2012-2843",
    "AVE-2012-0256",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = false
part = "body"
type = "word"
words = ["Chrome/20."]
