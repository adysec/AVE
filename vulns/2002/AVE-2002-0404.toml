[basic]
description = "MyGuestbook 1.0 存在跨站脚本（XSS）漏洞，远程攻击者可通过在用户名称或评论等输入字段中注入恶意 HTML 或 JavaScript 代码触发该漏洞，导致受害者在浏览器中执行任意脚本。攻击无需身份认证，利用难度低，可造成信息泄露、会话劫持或页面篡改等危害。该漏洞影响 MyGuestbook 1.0 版本，CVSS 评分 7.5，危害等级高危。"
published = "2002-08-12T04:00:00Z"
remediation = """MyGuestbook 1.0 已停止维护，官方未发布安全补丁。建议立即升级至其他仍在维护的留言板程序（如 Serendipity 或 WordPress 评论系统）。如无法更换，需手动修改 `guestbook.cgi` 源码，对所有用户输入字段（用户名、评论内容等）进行 HTML 实体编码过滤，将 `<` `>` `"` `'` `&` 替换为 `&lt;` `&gt;` `&quot;` `&#x27;` `&amp;`，并设置 `Content-Type: text/html; charset=utf-8` 防止编码绕过。"""
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Levcgi.com MyGuestbook 1.0 跨站脚本注入漏洞"
updated = "2026-06-16T21:58:01Z"

