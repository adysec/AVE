[basic]
description = 'Allaire JRun 3.0 HTTP Servlet 服务器存在拒绝服务漏洞，远程攻击者可通过向目标服务器发送包含大量连续 "." 字符的恶意 URL 请求，导致服务器资源耗尽或进程崩溃，从而无法正常提供服务。该漏洞利用方式简单，无需身份认证即可触发，影响 JRun 3.0 版本。厂商已发布安全更新修复此问题。'
published = "2000-12-11T05:00:00Z"
remediation = "建议立即应用 Allaire 安全公告 ASB00-30 中提供的补丁，或升级 JRun 至 3.0 以上已修复版本。由于 JRun 3.0 已停止技术支持，强烈建议迁移至受支持的 Java 应用服务器（如 Apache Tomcat 或 WildFly）。临时缓解措施：在 Web 服务器或反向代理层限制对 `/servlet/` URL 前缀的访问，仅允许受信任 IP 来源请求。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Allaire JRun 3.0 HTTP Servlet 服务器拒绝服务漏洞"
updated = "2026-06-16T21:53:03Z"

