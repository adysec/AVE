[basic]
description = "WhitSoft SlimServe HTTPd 1.0 及 1.1 存在缓冲区溢出漏洞，未经身份认证的远程攻击者可通过向目标服务器发送超长的 HTTP GET 请求触发该溢出，导致服务拒绝，并可能进一步执行任意系统命令。该漏洞影响所有运行 SlimServe HTTPd 1.0/1.1 的 Windows 服务器，攻击者无需任何凭据或特殊权限，在网络可达的情况下即可利用此漏洞发起攻击，攻击条件简单且危害极大，CVSS 评分 10.0，危害等级严重。"
published = "2001-05-03T04:00:00Z"
remediation = "建议立即升级到更新的 HTTP 服务器软件（如 Apache、Nginx 或 IIS），WhitSoft SlimServe 已停止维护且无官方补丁。如暂无法替换，应在防火墙或反向代理层配置规则，限制 HTTP GET 请求行长度不超过 8192 字节以阻止超长请求触发的缓冲区溢出；同时限制来自单一源 IP 的并发连接数作为临时缓解措施，并尽快安排迁移至受支持的 Web 服务器。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "WhitSoft SlimServe HTTPd 缓冲区溢出拒绝服务漏洞"
updated = "2026-06-16T21:53:48Z"

