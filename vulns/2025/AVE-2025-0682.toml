[basic]
description = "Windows 电话服务（Telephony Service）存在堆缓冲区溢出漏洞（CWE-122），由于服务在处理特定远程过程调用（RPC）请求时未正确验证输入数据长度，导致堆内存越界写入。远程攻击者可通过诱导目标用户连接到恶意 RPC 服务器或访问特制网络资源触发该漏洞，成功利用可在目标系统上以电话服务权限执行任意代码，实现完全控制受影响的系统。该漏洞影响多个 Windows 版本，包括 Windows 10、Windows 11 及 Windows Server 系列，CVSS 评分 8.8，危害等级高危。Microsoft 已在 2025 年 1 月安全更新中发布补丁修复此漏洞。"
published = "2025-01-14T18:15:33Z"
remediation = "立即安装 Microsoft 2025 年 1 月安全更新 (KB5049984) 以修复 Windows Telephony Service 中的堆溢出漏洞。可通过 Windows Update 自动获取更新，或从 Microsoft Update Catalog 手动下载安装。对于无法立即打补丁的系统，建议限制 TAPI 服务对不可信网络的暴露，并在防火墙层面阻止未经授权的 RPC 流量到达电话服务组件作为临时缓解措施。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows 电话服务远程代码执行漏洞"
updated = "2026-06-17T08:42:49Z"

