[basic]
description = "Electron 框架在处理来自 iframe 的串口（serial-port）和媒体（摄像头/麦克风）权限检查时存在权限绕过漏洞。由于 `session.setPermissionCheckHandler` 回调函数接收到的 `requestingOrigin` 参数为顶层框架（main frame）的源地址而非实际请求的 iframe 源地址，攻击者可构造跨域 iframe 利用基于源地址的权限检查逻辑，获取仅授权给顶层框架的设备访问权限。该漏洞影响所有使用 `setPermissionCheckHandler` 并基于源地址进行权限判断且嵌入了跨域 iframe 的 Electron 应用。成功利用可导致敏感设备被未授权的跨域内容访问。Electron 已在 39.8.7、40.9.0、41.2.0 和 42.0.0-beta.1 版本中修复此问题，受影响用户应尽快升级至安全版本。"
published = "2026-08-05T16:17:03Z"
remediation = "tags.<value>升级 Electron 至修复版本 39.8.7、40.9.0、41.2.0 或 42.0.0-beta.1。如无法立即升级，可将 `session.setPermissionCheckHandler` 中的 `requestingOrigin` 替换为 `details.securityOrigin` 进行权限判断，或禁止将串口、摄像头、麦克风等设备权限委托给不受信任的跨域 iframe。"
score = 5.9
severity = "MEDIUM"
sources = ["ghsa"]
title = "Electron 跨域 iframe 设备权限授予漏洞"
updated = "2026-08-05T19:17:38Z"

