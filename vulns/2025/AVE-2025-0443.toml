[basic]
description = "libsoup HTTP 库的 cookie 日期处理逻辑存在越界读取漏洞。libsoup 是 GNOME 及其他应用程序广泛使用的 HTTP 通信库，在处理带有特制过期日期的 cookie 时，由于未对日期字符串进行充分边界检查，导致越界内存读取。远程攻击者无需身份认证即可通过向目标应用发送特制 cookie 触发该漏洞，可能导致进程内存中的敏感信息泄露。该漏洞影响使用 libsoup 库的各类 GNOME 应用及依赖该库的 Linux 发行版，CVSS 评分 7.5，危害等级高。"
published = "2025-09-26T09:15:31Z"
remediation = "升级 libsoup 至 3.6.5 或更高版本（修复合入于 commit 9e1a427d）。各发行版用户：Ubuntu 安装 `libsoup3` 更新包，Fedora/RHEL 运行 `dnf update libsoup3`，openSUSE 运行 `zypper update libsoup3`。如无法立即升级，可应用上游补丁（见 OpenIndiana oi-userland 仓库 12-CVE-2025-11021.patch）对 `soup-date-utils.c` 和 `soup-cookie.c` 添加 `soup_date_time_to_string()` 返回值空指针检查，避免越界读取。"
score = 7.5
severity = "HIGH"
sources = ["msrc"]
title = "GNOME libsoup HTTP库Cookie日期处理越界读取漏洞"
updated = "2026-06-29T21:16:31Z"

