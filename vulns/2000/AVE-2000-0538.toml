[basic]
description = "CGI Script Center 开发的 Subscribe Me Lite 2.0 邮件列表管理 CGI 程序存在认证绕过漏洞。该程序在调用 subscribe.pl 脚本处理管理员密码修改请求时，未对请求来源进行身份验证，任何远程攻击者无需登录即可直接向 subscribe.pl 发送带有 setpwd 参数的 POST 请求，任意设置管理员密码。成功利用后攻击者可获取 Account Manager 完全管理权限，包括添加、删除邮件列表订阅用户以及修改系统配置。攻击条件简单，仅需目标服务器运行 Subscribe Me Lite 2.0 且 CGI 脚本可被外部访问，无需任何前置认证。"
published = "2000-10-20T04:00:00Z"
remediation = "该产品已停止维护且厂商已不存在，建议立即停止使用 Subscribe Me Lite，迁移至其他受支持的邮件列表管理软件（如 Mailman、Sympa）。如无法立即替换，可在 Web 服务器层面限制对 subscribe.pl 的访问（如仅允许特定 IP 或添加认证），并移除 setpwd 参数的处理逻辑。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "CGI Script Center Subscribe Me Lite 2.0 管理密码未授权修改漏洞"
updated = "2026-06-16T21:52:16Z"

