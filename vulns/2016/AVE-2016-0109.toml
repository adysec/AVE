[basic]
description = "Netgear 多款无线设备（WN604、WN802Tv2、WNAP210v2、WNAP320、WNDAP350、WNDAP360、WNDAP660）的 boardData 系列 PHP 脚本（boardData102.php、boardData103.php、boardDataJP.php、boardDataNA.php、boardDataWW.php）存在命令注入漏洞。未经身份认证的远程攻击者可通过向受影响设备的 Web 管理界面发送特制 HTTP 请求，利用这些脚本对用户输入过滤不严的缺陷注入任意系统命令，导致远程代码执行。攻击者无需任何凭据即可完全控制目标设备，CVSS 评分 9.8，危害等级严重。Netgear 已在固件版本 3.3.3（WN604）和 3.5.5.0（其余型号）中修复此漏洞，Metasploit 框架已发布公开利用模块。"
published = "2017-04-21T15:59:00Z"
remediation = "立即将受影响设备固件升级至修复版本：WN604 升级至 v3.3.3 或更高版本；WN802Tv2、WNAP210v2、WNAP320、WNDAP350、WNDAP360、WNDAP660 升级至 v3.5.5.0 或更高版本。固件可从 NETGEAR 官方支持网站下载。如无法立即升级，可在网络边界防火墙限制对设备管理页面（boardData*.php）的未授权外部访问，并禁用 WAN 侧对设备 Web 管理端口的访问作为临时缓解措施。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Netgear 多款设备未授权远程命令执行漏洞"
updated = "2026-06-17T00:42:09Z"

