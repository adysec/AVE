[basic]
description = "phpMyChat-Plus 1.98 存在反射型跨站脚本（XSS）漏洞，攻击者可通过在密码重置 URL 的 pmc_username 参数中注入恶意 JavaScript 代码触发该漏洞。未经身份认证的远程攻击者只需诱使受害者点击构造好的恶意链接，即可在受害者浏览器中执行任意脚本代码，进而窃取用户会话凭证或进行钓鱼攻击。该漏洞影响 phpMyChat-Plus 1.98 版本，CVSS 评分为 6.1，危害等级中等。CWE-79 为跨站脚本漏洞类型。"
published = "2019-12-20T13:15:11.957"
remediation = "立即将 phpMyChat-Plus 从 1.98 升级至 1.99 版本（https://sourceforge.net/projects/phpmychat/files/phpMyChat_Plus/1.99/），该版本修复了 pass_reset.php 中 pmc_username 参数的反射型 XSS 漏洞。升级前作为临时缓解措施，可在 Web 服务器层面配置输入过滤规则，对 pmc_username 参数中的尖括号和 script 标签进行拦截或转义；同时建议在未打补丁期间限制外部用户对密码重置页面的访问。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "phpMyChat-Plus phpMyChat-Plus 跨站脚本漏洞"
updated = "2026-06-17T02:27:25.963"

