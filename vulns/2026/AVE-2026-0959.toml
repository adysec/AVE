[basic]
description = "Trend Micro Apex One 及 SEP 代理程序存在来源验证漏洞（CWE-346），由于进程间通信（IPC）机制未正确验证消息来源，本地低权限攻击者可通过向目标系统上的受影响代理服务发送特制的 IPC 消息触发该漏洞，导致权限提升至 SYSTEM 级别。攻击者需先获得目标系统的低权限代码执行能力方可利用。该漏洞与 CVE-2026-34927 类似但存在于不同的 IPC 通信机制中，CVSS 评分 7.8，危害等级高。"
published = "2026-05-21T14:16:45Z"
remediation = "立即将 Apex One (on-prem) 升级至 SP1 CP Build 18012（现有 SP1 用户）或全新安装 SP1 Build 17079，确保 Agent 版本 ≥ 14.0.0.17079；Apex One as a Service / Vision One SEP 用户升级 Security Agent 至 build 14.0.20731。补丁已可从 Trend Micro Download Center 获取。如无法立即升级，建议限制低权限用户对受影响主机的本地访问，并启用应用程序白名单策略作为临时缓解措施。"
score = 7.8
severity = "HIGH"
sources = ["zdi"]
title = "Trend Micro Apex One/SEP Agent 来源验证权限提升漏洞"
updated = "2026-07-23T16:10:00Z"

