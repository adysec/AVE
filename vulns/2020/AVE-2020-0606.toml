[basic]
description = "Oracle WebLogic Server 的 Console 组件存在远程代码执行漏洞，未经身份认证的远程攻击者可通过 HTTP 协议向受影响的 WebLogic Console 管理控制台发送特制请求，利用该漏洞绕过权限验证并执行任意代码，从而完全接管目标服务器。该漏洞影响 WebLogic Server 10.3.6.0.0、12.1.3.0.0、12.2.1.3.0、12.2.1.4.0 及 14.1.1.0.0 等多个版本，CVSS 评分 9.8，危害等级严重。攻击无需任何凭证，仅需网络访问即可触发，实际利用中常结合 CVE-2020-14750 认证绕过漏洞实现更稳定的远程代码执行。"
published = "2020-10-21T15:15:25.407"
remediation = "立即升级到 Oracle WebLogic Server 12.2.1.4.0 及以上版本的 2020 年 10 月关键补丁更新（CPU）。若无法升级，在 Web 服务器或防火墙层面限制对 /console/ 路径的访问，仅允许受信任 IP 访问管理控制台。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Oracle WebLogic Server Console 远程代码执行漏洞"
updated = "2026-06-17T02:55:44.510"

