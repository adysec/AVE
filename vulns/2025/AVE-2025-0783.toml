[basic]
description = "Windows 数字媒体组件存在越界读取漏洞（CWE-125）。具有物理访问权限的低权限攻击者可利用该漏洞，通过特制的数字媒体文件触发越界内存读取，从而获取系统权限并实现权限提升。成功利用后，攻击者可获得高机密性、高完整性和高可用性影响。该漏洞影响多个 Windows 版本，Microsoft 已在 2025 年 1 月安全更新（KB5050061）中修复。"
published = "2025-01-14T18:15:56Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新。Windows Server 2008 SP2 用户需先安装服务栈更新 KB5050682，再安装安全更新 KB5050061；其他 Windows 版本可通过 Windows Update 自动获取 2025 年 1 月累积更新。由于该漏洞需要物理访问才能利用，作为临时缓解措施，应限制对受影响系统的物理接触，并确保仅授权人员可登录系统。"
score = 6.6
severity = "MEDIUM"
sources = ["msrc"]
title = "Microsoft Windows 数字媒体特权提升漏洞"
updated = "2026-06-17T08:43:06Z"

