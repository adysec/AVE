[basic]
description = "Accellion 文件传输设备（FTA）9.12.370 及更早版本存在 SQL 注入漏洞，未经身份认证的远程攻击者可通过向 document_root.html 端点发送携带特制 Host 头的 HTTP 请求触发该漏洞。由于请求中的 Host 头未经过滤直接传入数据库查询，攻击者可利用 SQL 注入提取敏感数据，包括管理员凭据、系统配置及用户上传的文件内容，严重时可导致远程代码执行并完全控制服务器。该漏洞影响所有部署了受影响版本 Accellion FTA 的机构，CVSS 评分 9.8，危害等级严重，且已被 CISA 列入已知被利用漏洞目录。Accellion 已在 FTA_9_12_380 及后续版本中修复此问题，建议用户立即升级至安全版本并审查系统访问日志。"
published = "2021-02-16T21:15:13Z"
remediation = "将 Accellion FTA 升级至 9.12.380 或更高版本以修复该 SQL 注入漏洞。升级前请备份配置文件与数据库，通过管理控制台或命令行执行固件更新流程，完成后重启服务并验证版本号。如无法立即升级，可在反向代理或 WAF 层拦截对 document_root.html 的 Host 头异常请求，限制来源 IP，降低被利用风险。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "Accellion FTA Host Header SQL注入漏洞"
updated = "2026-06-17T03:44:17Z"

