[basic]
description = "Active Directory 域服务（AD DS）存在权限提升漏洞，由于对特权的访问控制措施不足，已通过身份验证的攻击者可利用该漏洞在目标系统上提升权限，从而获取对敏感资源的未授权访问。该漏洞影响多个 Windows Server 版本，攻击者需先获得低权限账户访问权，然后利用特制请求触发漏洞，实现权限提升。CVSS 评分 8.8，危害等级高。Microsoft 已在 2025 年 1 月安全更新中修复此漏洞。"
published = "2025-01-14T18:15:51Z"
remediation = "建议立即安装 Microsoft 2025 年 1 月安全更新 (KB5050004)，或通过 Windows Update 自动更新。对于无法立即打补丁的域控制器，可采取以下临时缓解措施：限制拥有域管理员权限的账户数量，启用高级安全审核策略监控异常权限提升行为，并在防火墙层面限制对域控制器的 LDAP/S 访问来源 IP。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Active Directory Domain Services 权限提升漏洞"
updated = "2026-06-17T08:43:01Z"

