[basic]
description = "re2 正则表达式库的 Node.js 绑定中，`String.prototype.match` 方法在处理全局匹配模式时存在无限循环漏洞。当使用可匹配空字符串的正则表达式（如 `a*`、`b?`、`(?:)` 等）进行全局匹配时，`lib/match.cc` 中的游标推进逻辑未处理零宽度匹配情况，导致匹配位置始终不变，同一空匹配被无限次追加到原生内存向量中，造成无限制的内存增长。该调用为同步原生代码，会阻塞整个事件循环，无法被 `try/catch`、`AbortController` 或内存限制中断，只能通过外部强制终止进程。攻击者若可控制正则表达式模式或输入字符串（如用户提供的正则表达式应用于用户输入的场景），即可远程触发拒绝服务，单次请求即可耗尽主机内存，影响整个服务。该漏洞影响 re2 1.25.2 之前的所有版本，已在 1.25.2 中修复。"
published = "2026-07-30T21:18:12Z"
remediation = "立即将 re2 升级至 1.25.2 或更高版本（`npm install re2@^1.25.2`）。如无法升级，避免对可匹配空字符串或受用户控制的正则表达式使用全局模式调用 `String.prototype.match`，改用 `matchAll` 或 `exec` 方法，或使用非全局模式。同时建议在应用层限制正则表达式输入长度和超时时间作为纵深防御。"
score = 6.2
severity = "MEDIUM"
sources = ["ghsa"]
title = "Google node-re2 拒绝服务漏洞"
updated = "2026-07-31T20:16:54Z"

