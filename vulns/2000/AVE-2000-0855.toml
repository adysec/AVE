[basic]
description = "OpenSSL 0.9.6 之前版本的 crypto/rsa/rsa_gen.c 文件在处理 RSA 密钥生成时，对超出表达式大小的 C 语言位位移操作处理不当，导致在 64 位 HP-UX 平台上生成的 RSA 密钥存在加密强度缺陷。远程攻击者可利用此漏洞，通过分析弱密钥降低加密保护机制的安全性，从而更容易破解加密通信。该漏洞影响 OpenSSL 0.9.6 之前版本，CVSS 评分 7.5，危害等级高，攻击者无需身份认证即可远程利用。"
published = "2016-05-05T01:59:00Z"
remediation = "升级 OpenSSL 至 0.9.6 或更高版本，该版本修复了 RSA 密钥生成中位移操作超出表达式大小的问题。如无法立即升级，在 64 位 HP-UX 平台上应避免使用 OpenSSL 生成 RSA 密钥，改用其他受信任的密钥生成工具作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "OpenSSL OpenSSL RSA密钥生成安全漏洞"
updated = "2026-06-16T21:53:27Z"

