[basic]
description = "RobinHood 1.1 Web 服务器运行于 BeOS r5 pro 及更早版本中，其 RHDaemon 组件在处理 HTTP 请求时缺乏对请求长度的充分验证。未经身份认证的远程攻击者可通过向目标服务器发送超长 HTTP 请求触发该漏洞，导致服务拒绝（Denial of Service），使 Web 服务停止响应或崩溃。该漏洞影响部署了 RobinHood 1.1 的 BeOS 系统，攻击者无需任何凭据即可在低复杂度条件下远程利用，仅造成部分可用性影响。"
published = "2001-01-09T05:00:00Z"
remediation = "建议立即迁移至现代受支持的操作系统（如 Linux、FreeBSD）并替换为维护中的 Web 服务器（nginx、Apache、Caddy 等）。若暂时无法迁移，可在网络边界部署反向代理（nginx 配置 client_max_body_size 1M 限制请求体大小，limit_req_zone 限制请求频率）或 WAF 规则拦截超长 HTTP 请求；同时在防火墙层面对目标端口仅允许可信 IP 访问，减少攻击面。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Joe Kloss Robinhood 拒绝服务漏洞"
updated = "2026-06-16T21:53:16Z"

