[info]
author = "ave"
description = "验证目标系统是否存在CVE-2021-1647 Microsoft Defender mpengine.dll堆缓冲区溢出漏洞。该漏洞在Windows Defender解压ASProtect打包的可执行文件时触发，通过构造特制的section table实现堆溢出，进而可获得远程代码执行权限。"
id = "POC-AVE-2021-0044"
name = "CVE-2021-1647 PoC"
severity = "high"
tags = ["cve-2021-1647"]
vuln_id = [
    "CVE-2021-1647",
    "AVE-2021-0044",
]

[poc]
logic = "all"

[[poc.requests]]
path = "/etc/passwd"
protocol = "file"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["root:"]
