[basic]
description = "用于 WordPress 的 Custom 404 Pro 插件 3.2.8 及更早版本存在基于 DOM 的反射型跨站脚本（XSS）漏洞。该插件在 WordPress 后台管理页面 wp-admin/admin.php?page=c4p-main 的搜索参数中未对用户输入进行充分的过滤和转义，攻击者可通过构造包含恶意 JavaScript 代码的 URL（如注入 svg onload 事件载荷）诱使具有插件访问权限的认证用户点击，从而在受害者浏览器上下文中执行任意脚本。该漏洞影响 Custom 404 Pro 插件低于 3.2.9 的所有版本，攻击者可借此窃取基于 Cookie 的身份验证凭据、劫持管理员会话，或在站点上下文中发起进一步攻击。官方已在 3.2.9 版本中通过补充输入过滤和输出转义修复此问题。"
published = "2019-08-15T16:15:12.257"
remediation = '将 Custom 404 Pro 插件升级到 3.2.9 或更高版本。登录 WordPress 后台，进入插件管理页面，点击 Custom 404 Pro 的"更新"按钮完成升级；若自动更新失败，可手动下载最新版本覆盖安装。升级后确保 wp-admin/admin.php?page=c4p-main 页面的 page 参数已正确过滤，不再反射用户输入。'
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "WordPress Custom 404 Pro 插件跨站脚本漏洞"
updated = "2026-06-17T02:19:01.093"

