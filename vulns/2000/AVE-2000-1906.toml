[basic]
description = "OpenBSD 及其他 BSD 衍生系统自带的 talkd 服务存在格式化字符串漏洞。远程攻击者无需身份认证，只需向目标系统的 talkd 服务发送包含格式化字符串（如 %n、%s 等）的恶意用户名，即可利用该漏洞执行任意代码，完全控制目标主机。该漏洞影响 OpenBSD 及多个 BSD 变种操作系统，CVSS 评分 10.0，危害等级严重。由于 talkd 默认监听 UDP 端口，攻击者可在网络可达条件下远程触发，无需用户交互。"
published = "2000-12-11T05:00:00Z"
remediation = "立即应用 OpenBSD 官方提供的 talkd 格式字符串漏洞补丁：下载 https://ftp.openbsd.org/pub/OpenBSD/patches/2.7/common/026_talkd.patch，以 root 执行 `cd /usr/src && patch -p0 < 026_talkd.patch && cd libexec/talkd && make obj && make depend && make && make install` 重新编译安装 talkd。如运行 OpenBSD 2.8 或更高版本，升级至包含该修复的 -stable 分支。临时缓解措施：在 inetd.conf 中注释掉 talk 行并重启 inetd 以禁用 talkd 服务。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "OpenBSD talkd 格式化字符串远程代码执行漏洞"
updated = "2026-06-16T21:52:57Z"

