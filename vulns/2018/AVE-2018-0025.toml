[basic]
description = "DirectX 图形内核（DXGKRNL）驱动程序在处理内存对象时存在不当操作，导致特权提升漏洞。攻击者在获得目标系统低权限账户后，可通过运行特制的恶意代码触发该漏洞，从而将权限提升至系统最高级别。该漏洞影响 Windows 10、Windows 8.1、Windows RT 8.1 及 Windows Server 2012 R2、2016 等多个版本，可导致系统完整性受损及敏感信息泄露。"
published = "2018-08-15T17:29:10Z"
remediation = "建议立即安装微软 2018 年 8 月发布的累积更新或月度汇总更新（如 Windows 10 对应的 KB4036441 等相关补丁），或通过 Windows Update 自动更新至最新版本，以修复 DirectX 图形内核驱动程序的内存处理缺陷。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Microsoft Windows DirectX 图形内核特权提升漏洞"
updated = "2026-06-17T02:04:47Z"

