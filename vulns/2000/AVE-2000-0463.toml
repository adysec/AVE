[basic]
description = "Check Point FireWall-1 4.0 及 4.1 版本的 SMTP Security Server 代理组件存在拒绝服务漏洞。远程攻击者无需身份认证，可通过向目标系统的 SMTP 代理发送大量无效命令（如二进制零字节流），导致 SMTP Security Server 资源耗尽而崩溃，从而中断正常的邮件服务。该漏洞影响 Check Point FireWall-1 4.0 和 4.1 版本，CVSS 评分 5.0，危害等级中危。目前已有公开的利用代码，攻击者可通过 ExploitDB 获取 PoC 实施攻击。"
published = "2000-06-30T04:00:00Z"
remediation = "该漏洞影响已停止支持的 Check Point FireWall-1 4.0/4.1，官方已不再提供补丁。建议立即升级到受支持的 FireWall-1/GAiA 版本（如 R80.40 及以上）；如无法升级，可在防火墙上限制仅允许可信源 IP 访问 SMTP Security Server 代理端口（默认 25），并配置 SMTP 代理的访问控制规则以丢弃异常流量。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Check Point FireWall-1 SMTP Security Server 代理 拒绝服务漏洞"
updated = "2026-06-16T21:52:02Z"

