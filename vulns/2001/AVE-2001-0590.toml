[basic]
description = "Cisco 600 系列路由器上运行的 CBOS 固件 2.4.1 及更早版本存在拒绝服务漏洞。远程攻击者无需身份认证即可通过向目标设备发送特制的大尺寸 ICMP Echo（Ping）数据包，导致路由器 CPU 资源耗尽或系统崩溃，造成网络服务中断。该漏洞攻击复杂度低，仅需构造异常大小的 ICMP 报文即可触发，影响范围涵盖 Cisco 600 系列路由器产品。"
published = "2001-02-16T05:00:00.000"
remediation = "升级 Cisco CBOS 至 2.4.2 或更高版本。Cisco 已发布安全公告 (http://www.cisco.com/warp/public/707/CBOS-multiple.shtml) 提供补丁。如无法立即升级，可在网络边界配置 ACL 限制 ICMP 报文大小或速率作为临时缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["cve"]
title = "Cisco CBOS ICMP Echo 拒绝服务漏洞"
updated = "2026-06-16T21:53:34.493"

