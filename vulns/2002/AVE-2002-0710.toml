[basic]
description = "SmartMail Server 2.0 存在拒绝服务漏洞，远程攻击者无需身份认证，即可通过向目标服务器的 SMTP 服务建立 TCP 连接并发送部分邮件数据后立即断开连接的方式触发该漏洞。由于服务器在数据未完全接收前未能正确处理连接异常关闭的情况，导致服务进程崩溃或停止响应，影响所有使用 SmartMail Server 2.0 的邮件系统用户。攻击者仅需具备基本的网络连通能力，即可实施攻击，造成邮件服务中断。"
published = "2002-12-31T05:00:00Z"
remediation = "建议升级至不受此漏洞影响的后续版本；如厂商已停止维护，建议迁移至 Microsoft Exchange、hMailServer 或 Zimbra 等主流邮件服务器替代。如短期内无法替换，可在边界防火墙或入侵防御系统上针对 SMTP 服务（TCP 25 端口）实施连接速率限制与异常断开检测规则，并在服务器端启用自动监控脚本，在检测到服务崩溃后立即重启 SmartMail 服务以缩短中断时间。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "SmartMail Server 2.0 关闭连接拒绝服务漏洞"
updated = "2026-06-16T22:00:11Z"

