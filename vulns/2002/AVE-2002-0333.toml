[basic]
description = 'Nortel CVX 1800 多业务接入交换机出厂时配置了默认的 SNMP 社区字符串 "public"，攻击者无需身份认证即可通过 SNMP 协议远程读取设备中的用户名和密码信息，并修改交换机的配置参数。该漏洞影响运行默认配置的设备，攻击条件宽松，仅需网络可达即可利用。利用者可通过发送特制的 SNMP GET/SET 请求获取敏感凭证并篡改设备配置，可能导致网络被接管或配置被恶意修改。Microsoft 或厂商应修改默认社区字符串并限制 SNMP 访问。'
published = "2002-07-03T04:00:00Z"
remediation = '建议将设备软件立即升级至 3.6.3P25 版本以修复该默认 SNMP 社区字符串漏洞。如暂无法升级，应立即将默认 SNMP 社区字符串从 "public" 修改为自定义的强密码字符串，并在设备上配置 SNMP 访问控制列表（ACL）以限制仅允许受信任的管理主机访问 SNMP 端口，同时通过防火墙或访问控制列表限制外部对 UDP 161 端口的访问，仅对授权网管主机开放。'
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "北电网络 CVX 1800 多业务接入交换机默认SNMP团体字符串漏洞"
updated = "2026-06-16T21:57:38Z"

