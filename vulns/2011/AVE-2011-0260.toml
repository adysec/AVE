[basic]
description = "Opera 浏览器 11.10 及更早版本存在未明确漏洞编号的拒绝服务漏洞。远程攻击者可通过构造包含特制内容的恶意网页，诱使用户在浏览器中打开该页面，触发浏览器处理嵌入 Java applet 或未知网页内容时发生错误，导致应用崩溃。该漏洞攻击条件简单，攻击者无需身份认证且攻击复杂度低，影响范围覆盖所有使用受影响版本的用户。成功利用可使 Opera 浏览器进程异常终止，造成服务不可用。Opera 官方已在 11.10 版本中修复此问题。"
published = "2011-07-01T10:55:03Z"
remediation = "将 Opera 浏览器升级至 11.10 或更高版本以修复该漏洞。临时缓解措施包括在浏览器设置中禁用 Java 插件，并避免访问包含嵌入式 Java applet 的可信度较低网页。"
score = 5
severity = "MEDIUM"
sources = ["tenable"]
title = "Opera 浏览器 远程拒绝服务漏洞"
updated = "2026-06-16T23:31:42Z"

