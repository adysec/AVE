[basic]
description = "HP-UX 10.20 至 11.11（11i）版本的 lp 子系统存在多个缓冲区溢出漏洞。本地攻击者可利用该漏洞通过向打印服务发送特制数据触发缓冲区溢出，造成拒绝服务，并可能执行任意代码提升至 root 权限。该漏洞影响 HP-UX 10.20、11.00 和 11.11 等主流版本，CVSS 评分为 4.6（MEDIUM），攻击条件要求攻击者具有本地访问权限。目前已存在 Metasploit 模块可对此漏洞进行利用，建议升级至 HP 官方发布的安全补丁版本以修复该漏洞。"
published = "2003-04-22T04:00:00Z"
remediation = "建议升级至 HP-UX 11.11i (September 2003) 或更高版本，并安装 HP 官方补丁 PHSS_29543 (HP-UX 11.00) 或 PHSS_29544 (HP-UX 11.11)。若无法立即升级，可临时禁用 LPD 服务：执行 /usr/sbin/lpshut 停止打印服务，并在 /etc/inetd.conf 中注释掉 printer 行后重启 inetd。同时限制本地用户权限，移除非必要的 lp 组成员。"
score = 4.6
severity = "MEDIUM"
sources = ["exploitdb"]
title = "HP-UX LPD 缓冲区溢出命令执行漏洞"
updated = "2026-06-16T21:59:23Z"

