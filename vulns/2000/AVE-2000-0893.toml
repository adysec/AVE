[basic]
description = "OpenLDAP 1.2.11 及更早版本在安装时对 `ud` 二进制文件的权限配置不当，错误地将其设置为组可写。这意味着属于该组的任何本地用户都可以用木马程序替换该二进制文件。当系统或高权限用户随后以提升权限执行被替换的 `ud` 时，攻击者即可借此实现权限提升或任意代码执行。该漏洞主要影响安装了上述版本 OpenLDAP 的系统，攻击前提是攻击者已经拥有目标主机上的本地用户账号并属于 `ud` 所属组的成员。"
published = "2000-10-20T04:00:00Z"
remediation = "立即将 OpenLDAP 升级至 1.2.12 或更高版本，该版本修复了 ud 二进制文件的组写权限问题；升级前可通过执行 chmod g-w /usr/libexec/openldap/ud （路径视安装位置而定）去除组写权限作为临时缓解"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "OpenLDAP ud 二进制文件权限提升漏洞"
updated = "2026-06-16T21:52:23Z"

