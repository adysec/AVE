[basic]
description = "Acrolinx Server for Windows 5.2.5 之前版本存在目录遍历漏洞（CWE-22）。未经身份认证的远程攻击者可通过向目标服务器发送特制的 HTTP 请求，利用路径遍历技术突破目录限制，读取服务器文件系统中的任意敏感文件（如配置文件、密码文件等）。该漏洞攻击复杂度低，无需用户交互，CVSS 评分 7.5，危害等级高。攻击者只需网络可达即可利用，影响运行 Acrolinx Server 5.2.5 以下版本的 Windows 系统。"
published = "2018-03-25T16:29:00Z"
remediation = "升级 Acrolinx Server 至 5.2.5 或更高版本，该版本已修复路径遍历漏洞。如无法立即升级，可在 Web 服务器层配置 URL 重写规则，拦截包含 `../` 等目录遍历特征的请求路径，并限制应用程序对文件系统的访问权限。同时建议将 Acrolinx Server 部署在内网，避免暴露在公网环境。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "Acrolinx Server for Windows 路径遍历漏洞"
updated = "2026-06-17T02:03:35Z"

