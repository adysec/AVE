[basic]
description = "Roundcube Webmail 在 1.1.10 之前版本、1.2.7 之前版本及 1.3.3 之前版本中存在访问控制漏洞。该漏洞源于文件附件插件在处理 `_task=settings&_action=upload-display&_from=timezone` 请求时未正确校验用户权限，导致已认证的攻击者能够读取服务器文件系统上的任意文件，包括配置文件等敏感信息。攻击者需拥有有效的用户名和密码以建立会话，无需其他特殊权限。该漏洞于 2017 年 11 月已被发现在野利用，危害严重，可能导致数据库凭据、邮件配置等敏感数据泄露，进而被用于进一步攻击。"
published = "2017-11-09T14:29:00Z"
remediation = "立即升级 Roundcube Webmail 至 1.1.10、1.2.7 或 1.3.3 及以上版本。如无法立即升级，可禁用文件附件插件（file-based attachment plugins）或限制 Web 应用对本地文件系统的访问权限。该漏洞已遭在野利用，应优先处理。"
score = 7.8
severity = "HIGH"
sources = ["kev"]
title = "Roundcube Webmail 任意文件读取漏洞"
updated = "2026-06-17T01:09:37Z"

