[basic]
description = "Mozilla Firefox 和 Thunderbird 的父进程与子进程之间通过 Prompt:Open IPC 消息传递参数时存在输入验证不足漏洞。攻击者可在子进程被攻陷后，利用该漏洞向非沙箱父进程发送特制的 Prompt:Open 消息，使父进程打开攻击者控制的 Web 内容，从而实现沙箱逃逸。结合其他漏洞利用链，攻击者可在用户系统上执行任意代码。该漏洞影响 Firefox ESR 60.7.2 之前版本、Firefox 67.0.4 之前版本及 Thunderbird 60.7.2 之前版本，CVSS 评分 10.0，危害等级严重。Mozilla 已在 2019 年 7 月安全更新中修复此漏洞。"
published = "2019-07-23T14:15:15Z"
remediation = "立即升级 Firefox 至 67.0.4 及以上版本、Firefox ESR 至 60.7.2 及以上版本、Thunderbird 至 60.7.2 及以上版本。如无法立即升级，可考虑在浏览器沙箱外额外启用应用隔离（如 Windows Sandbox 或 AppContainer）以限制子进程提权后的影响范围。"
score = 10
severity = "CRITICAL"
sources = ["kev"]
title = "Mozilla Firefox Prompt:Open IPC 沙箱逃逸漏洞"
updated = "2026-06-17T02:13:28Z"

