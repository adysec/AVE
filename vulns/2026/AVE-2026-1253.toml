[basic]
description = "undici 的 retry 拦截器在重试或恢复部分响应后，可能返回一个响应体长度与 Content-Length 头部不匹配的 HTTP 响应。恶意或故障上游服务器可返回带有错误帧头部的部分响应（如 Content-Range 与 Content-Length 不一致）并提前关闭连接，retry 拦截器会重新组装不同长度的响应体，但保留原始的 Content-Length 头部，导致下游 HTTP 响应去同步、连接挂起或响应损坏。该漏洞影响 undici 6.x 低于 6.28.0 版本、7.x 低于 7.29.0 版本以及 8.x 低于 8.9.0 版本。攻击条件为远程攻击者需控制上游服务器返回特制的部分响应，且目标应用启用了 retry 拦截器并作为代理或网关转发上游响应时，无需认证即可利用。该漏洞对应的 CWE 为 CWE-444（HTTP 响应分裂）。"
published = "2026-07-29T21:17:46.833"
remediation = "升级 undici 至 v6.28.0、v7.29.0 或 v8.9.0 及以上版本。若使用 interceptors.retry() 连接不可信上游，临时禁用该拦截器；转发上游响应前移除或重新计算 Content-Length 头部，确保与实际响应体长度一致，防止下游响应错位或连接挂起。"
score = 4.8
severity = "MEDIUM"
sources = ["ghsa"]
title = "Node.js undici HTTP 响应去同步漏洞"
updated = "2026-08-04T14:06:21.650"

