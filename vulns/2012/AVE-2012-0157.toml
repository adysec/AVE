[basic]
description = "RealNetworks RealPlayer 的 RV20 编解码器在处理帧大小数组时存在远程代码执行漏洞。攻击者可通过构造特制的 RV20 RealVideo 视频流文件，诱使用户在受影响的 RealPlayer 中打开该文件，触发数组处理缺陷，从而在目标系统上执行任意代码。该漏洞影响 RealPlayer 11.x、14.x、15.x（低于 15.02.71）及 RealPlayer SP 1.0 至 1.1.5 版本，CVSS 评分 9.3，危害严重。"
published = "2012-02-08T15:55:00.797"
remediation = "立即升级 RealPlayer 至 15.0.2.72 或更高版本，官方补丁地址：http://service.real.com/realplayer/security/02062012_player/en/。如无法升级，建议彻底卸载 RealPlayer 并改用 VLC 等仍在维护的媒体播放器，同时在浏览器中禁用 RealPlayer 插件，避免打开来源不明的 .rm/.rv 媒体文件。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer RV20帧大小远程代码执行漏洞"
updated = "2026-06-16T23:38:30.850"

