[basic]
description = "NetLicensing-MCP 在 HTTP 传输模式下存在身份认证缺失漏洞（CWE-306）。ApiKeyMiddleware 中间件在未检测到客户端 API 密钥时，未拒绝请求而是无条件放行至下游处理器，导致下游 HTTP 客户端回退使用服务器环境变量中的 NETLICENSING_API_KEY 进行上游 NetLicensing REST API 认证。未经身份认证的远程攻击者可通过向 /mcp 端点发送任意请求，以服务器操作员身份调用所有 MCP 工具，包括产品列表查询、许可证创建/修改及删除等操作，导致机密性（账户数据泄露）、完整性（许可证篡改）和可用性（批量删除）受损。该漏洞影响以 HTTP 模式部署且设置 NETLICENSING_API_KEY 环境变量的 netlicensing-mcp 版本，CVSS 评分 8.1，危害等级高。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级 netlicensing-mcp 至修复版本（≥0.1.6），该版本在 ApiKeyMiddleware 中增加了对缺失 API Key 请求的 401 拒绝逻辑。如无法升级，在 HTTP 传输模式下部署时，通过反向代理（如 Nginx）添加 `/mcp` 端点的客户端证书认证或 IP 白名单限制，并避免将 `NETLICENSING_API_KEY` 环境变量暴露给不可信网络。"
score = 7.5
severity = "HIGH"
sources = ["ghsa"]
title = "NetLicensing netlicensing-mcp HTTP 传输模式认证绕过漏洞"
updated = "2026-01-01T00:00:00Z"

