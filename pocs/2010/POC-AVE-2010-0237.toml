[info]
author = "ave"
description = "通过构造恶意网页调用RealPlayer ActiveX控件的RecordClip方法，注入双引号等特殊字符突破参数边界，远程下载执行任意程序。检测目标是否安装了受影响版本的RealPlayer浏览器插件。"
id = "POC-AVE-2010-0237"
name = "RealNetworks RealPlayer RecordClip Method Remote Code Execution PoC"
severity = "critical"
tags = ["ave-2010-0237"]
vuln_id = [
    "CVE-2010-3749",
    "AVE-2010-0237",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/"
protocol = "http"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["RealPlayer"]
