[basic]
description = "Recourse ManTrap 1.6 及 1.6.1 版本未能正确隐藏系统进程，远程攻击者可以通过对比 kill 命令返回结果与 /proc 文件系统中的进程列表信息，检测到隐藏进程的存在，从而判断当前系统为蜜罐（honeypot）环境。该漏洞影响 ManTrap 1.6/1.6.1，攻击者无需身份认证即可在本地或远程执行检测，导致蜜罐系统被识别和规避，安全监控失效。攻击者可通过发送特定 kill 信号并结合 /proc 文件系统查询，对比两次进程列表差异，发现蜜罐刻意隐藏的进程，进而确定系统真实用途并实施针对性攻击。"
published = "2001-01-09T05:00:00Z"
remediation = "升级到 Recourse ManTrap 2.0 或更高版本，该版本改进了内核模块对进程的隐藏机制，可防止通过 kill() 系统调用与 /proc 文件系统对比的方式检测蜜罐。如无法升级，应在 Solaris 内核层面禁用 /proc 文件系统中非特权用户可见的进程条目映射，并在蜜罐环境中额外部署基于网络行为的异常检测规则，以弥补进程隐藏机制被绕过的风险。同时建议评估迁移至当前仍在维护的蜜罐解决方案（如 Honeyd、Conpot 或 Kippo），以消除对已停止维护产品的依赖。"
score = 2.1
severity = "LOW"
sources = ["avd"]
title = "Recourse ManTrap 隐藏进程信息泄露漏洞"
updated = "2026-06-16T21:53:14Z"

