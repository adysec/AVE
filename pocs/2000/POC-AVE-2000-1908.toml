[info]
author = "ave"
description = "验证 eWave ServletExec UploadServlet 是否存在未授权访问漏洞。通过发送 HTTP GET 请求检查 UploadServlet 是否可在无需身份认证的情况下访问，若返回 200 状态码则说明存在未授权文件上传漏洞，攻击者可通过上传恶意文件实现远程代码执行。"
id = "POC-AVE-2000-1908"
name = "eWave ServletExec 未授权文件上传远程代码执行漏洞 PoC"
severity = "critical"
tags = ["ave-2000-1908"]
vuln_id = [
    "CVE-2000-1024",
    "AVE-2000-1908",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/servlet/UploadServlet"
protocol = "http"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
