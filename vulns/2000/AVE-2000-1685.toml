[basic]
description = "XMail POP3 服务器（版本 0.59 之前）存在缓冲区溢出漏洞。该漏洞源于 POP3 服务在处理 APOP 命令时未对输入长度进行充分校验，当攻击者发送超长 APOP 命令时，可导致缓冲区溢出，从而在目标服务器上以服务进程权限执行任意恶意代码。由于 APOP 命令仅需身份验证前即可触发，远程攻击者无需有效凭证即可利用此漏洞，CVSS 评分 10.0，属于最高危漏洞。利用方式为通过网络向目标 POP3 端口（默认 110）发送特制的超长 APOP 请求。该漏洞影响所有使用 XMail 0.59 之前版本的邮件服务器，可能导致邮件系统完全被接管。"
published = "2000-11-14T05:00:00.000"
remediation = "立即将 XMail POP3 服务器升级至 0.59 或更高版本，可从 XMail 官方站点（xmail.org）下载最新源码重新编译部署。如暂时无法升级，应在防火墙上禁用外部对 POP3 端口（110）的访问，仅允许内网连接，或直接关闭 POP3 服务改用 IMAP 替代，同时禁用 APOP 认证功能以消除触发溢出的入口。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "XMail POP3 服务器缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:34.717"

