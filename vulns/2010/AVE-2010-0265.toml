[basic]
description = "RealNetworks RealPlayer 及 RealPlayer SP 存在基于堆的缓冲区溢出漏洞，源于对 AAC 文件解析时未正确验证缓冲区边界。攻击者可构造恶意 AAC 文件，诱导用户使用受影响版本的 RealPlayer（11.0-11.1、SP 1.0-1.1.4、Enterprise 2.1.2 及 Mac 版 11.0-12.0.0.1444）播放，触发堆溢出导致远程代码执行。攻击需用户交互打开恶意文件，CVSS 9.3 分，RealPlayer 12.0.1.609 及更高版本已修复。"
published = "2010-12-14T16:00:04Z"
remediation = "建议立即升级 RealPlayer 至 12.0.1.609 或更高版本（可从 real.com 官网下载最新版）。若无法立即升级，请卸载 RealPlayer 或在受信任环境下禁止打开来源不明的 AAC 文件，改用 VLC 等替代播放器作为临时缓解措施。"
score = 9.3
severity = "CRITICAL"
sources = ["tenable"]
title = "RealNetworks RealPlayer AAC 堆缓冲区溢出漏洞"
updated = "2026-06-16T23:24:40Z"

