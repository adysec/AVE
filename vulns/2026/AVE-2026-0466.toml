[basic]
description = "Heimdall Data Database Proxy 的 generateFileContent 函数存在 CRLF 注入漏洞，经过身份认证的远程攻击者可通过向该函数提交特制的 CRLF 序列载荷，利用缺乏有效过滤的缺陷注入恶意内容，最终实现以 root 权限执行任意代码。该漏洞影响 Heimdall Data Database Proxy 多个版本，CVSS 评分 7.2，危害等级高。厂商已在 25.03.01.24 版本中修复此漏洞。"
published = "2026-01-01T00:00:00Z"
remediation = "立即升级 Heimdall Data Database Proxy 至 release build 25.03.01.24（2026年2月28日发布）或更高版本。该版本已修复 generateFileContent 函数中的 CRLF 注入问题。临时缓解措施：严格限制管理界面访问权限，仅允许受信 IP 和用户登录，因为该漏洞需要管理员权限才能利用。"
score = 5
severity = "MEDIUM"
sources = ["zdi"]
title = "Heimdall Data Database Proxy CRLF注入远程代码执行漏洞"
updated = "2026-01-01T00:00:00Z"

