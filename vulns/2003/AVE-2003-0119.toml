[basic]
description = "GNOME Display Manager（GDM）2.4.1.6 及更早版本的 X 显示管理器控制协议（XDMCP）实现对授权密钥名称长度缺乏有效校验，未经身份认证的远程攻击者可通过向目标系统发送特制的 XDMCP 认证请求包，在请求中携带极短的授权密钥名称，触发 GDM 守护进程发生段错误并崩溃，导致拒绝服务。该漏洞影响运行上述受影响版本 GDM 的 Linux/Unix 系统，攻击条件为目标系统开启了 XDMCP 远程登录服务，攻击者无需任何凭据即可在局域网或跨网络条件下实施攻击，只需发送一个构造的认证数据包即可使显示管理器宕机，用户图形登录会话中断且需手动重启服务才能恢复，存在影响系统可用性的风险。GNOME 官方在后续版本中修复了该问题。"
published = "2003-08-27T04:00:00Z"
remediation = "立即将 GDM 升级到 2.4.1.6 或更高版本（可从 http://ftp.gnome.org/pub/GNOME/sources/gdm/2.4/ 下载源码编译安装，或使用各发行版提供的安全更新包，如 Red Hat RHSA-2003-258/RHSA-2003-259）。如暂时无法升级，可在 /etc/X11/gdm/gdm.conf 中设置 [xdmcp] Enable=false 禁用 XDMCP 服务作为临时缓解措施；若业务确实需要 XDMCP，应将其限制在可信内网中使用，避免暴露于公网。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "GNOME GDM XDMCP 拒绝服务漏洞"
updated = "2026-06-16T22:02:25Z"

