[basic]
description = "HP-UX 11.00 中的 bdf 程序存在缓冲区溢出漏洞，本地攻击者可通过传递过长的 -t 选项参数触发栈缓冲区溢出，覆盖返回地址实现任意代码执行，从而提升至 root 权限。该漏洞影响 HP-UX 11.00 版本，CVSS 评分 7.2（AV:L/AC:L/Au:N/C:C/I:C/A:C），攻击向量为本地，需拥有系统普通用户权限即可利用。攻击者只需在本地执行特制的 bdf 命令即可完成权限提升，无需远程交互。HP 官方已发布补丁修复此漏洞，建议尽快升级至修复版本。"
published = "2000-10-20T04:00:00Z"
remediation = "立即更新HP-UX 11.00到11.04或更高版本，应用HP IR10242 HP-UX 11.00安全更新包，替换/bin/bdf程序文件，并禁用bdf命令对未知用户的访问权限。如果无法立即更新，可使用操作系统安全缓解工具(stack execution protection)和运行时堆栈溢出检测工具，并在/etc/security/secdefault中限制本地用户权限。"
score = 7.2
severity = "HIGH"
sources = ["avd"]
title = "HP HP-UX 缓冲区溢出漏洞"
updated = "2026-06-16T21:52:30Z"

