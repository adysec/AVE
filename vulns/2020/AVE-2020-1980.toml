[basic]
description = "DrayTek Vigor2960、Vigor3900 及 Vigor300B 系列路由器存在命令注入漏洞，攻击者无需身份认证即可通过向 cgi-bin/mainfunction.cgi URI 提交包含 shell 元字符的恶意请求，以 root 权限在目标设备上执行任意系统命令。该漏洞影响 Vigor2960 1.3.1_Beta、Vigor3900 1.4.4_Beta、Vigor300B 1.3.3_Beta、1.4.2.1_Beta 及 1.4.4_Beta 等固件版本，CVSS 评分 9.8，危害等级严重。攻击者可直接利用此漏洞获取设备完全控制权，进而篡改网络配置、窃取敏感数据或横向渗透内网。DrayTek 已在 Vigor3900/2960/300B v1.5.1 版本中修复此漏洞。"
published = "2020-02-01T13:15:12.623"
remediation = "立即将 DrayTek Vigor2960/3900/300B 固件升级至 v1.5.1 或更高版本，该版本已修复 cgi-bin/mainfunction.cgi 的命令注入漏洞。如无法立即升级，可在路由器防火墙规则中禁用对 cgi-bin/mainfunction.cgi URI 的外部访问，并关闭远程管理接口以临时缓解风险。"
score = 9.8
severity = "CRITICAL"
sources = ["kev"]
title = "DrayTek Vigor300B 命令注入漏洞"
updated = "2026-06-17T03:26:30.047"

