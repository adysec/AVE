[basic]
description = "Cisco IOS 12.4 至 15.6 版本中 Common Industrial Protocol (CIP) 功能实现存在多个漏洞，源于对特制 CIP 数据包的解析不当。未经身份认证的远程攻击者可通过向受影响设备发送精心构造的 CIP 数据包，触发设备重新加载，导致拒绝服务 (DoS) 状况。该漏洞影响运行上述版本 Cisco IOS 的网络设备，攻击无需用户交互且可远程利用，CVSS 3.1 评分 7.5 (HIGH)，攻击向量为网络 (AV:N)，攻击复杂度低 (AC:L)，无需权限 (PR:N)，可用性影响高 (A:H)。Cisco Bug ID: CSCuz95334。"
published = "2017-09-29T01:34:48Z"
remediation = "建议立即升级 Cisco IOS 至 15.6(3)M1 或更高版本（如 15.7(3)M、16.3.1 及以上版本），修复 CIP 协议解析漏洞。如暂时无法升级，请在防火墙或边界设备上配置 ACL 拒绝非信任源 IP 访问 UDP/44818 (CIP/EtherNet/IP) 端口，并限制设备仅接受受信网段的 CIP 流量，临时缓解 DoS 攻击风险。升级前请备份配置并参考 Cisco Security Advisory cisco-sa-20170927-cip 确认适用固件版本。"
score = 7.5
severity = "HIGH"
sources = ["kev"]
title = "思科 IOS 通用工业协议 CIP 包拒绝服务漏洞"
updated = "2026-06-17T01:02:56Z"

