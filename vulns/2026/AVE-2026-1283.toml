[basic]
description = "Ghost 是一个基于 Node.js 的内容管理系统，其公开的捐赠结算流程存在逻辑校验缺陷（CWE-472）。由于在捐赠结账时未对捐赠金额与会员价格进行严格的等价校验，未经身份认证的远程攻击者可控制捐赠结算元数据，通过捐赠功能以最低成本获得完整付费的礼品会员资格。影响版本为 v6.27.0 至 v6.43.1，该漏洞不涉及客户或会员数据泄露，也无法窃取站点或会员的资金，但其绕过定价逻辑的问题属逻辑缺陷。攻击者无需认证即可利用，网络可访问、复杂度低且无需交互，CVSS 3.1 评分 5.3（中危）。官方已于 v6.44.0 版本修复此问题。"
published = "2026-07-09T18:16:57Z"
remediation = "建议升级到 Ghost v6.44.0 或更高版本以修复该捐赠结算支付漏洞。托管自建环境：Docker 用户可拉取最新官方镜像重建容器（`docker pull ghost` 并重启）；Ghost-CLI 用户执行 `ghost update` 更新至最新版本。若无法立即升级，作为临时缓解措施，请在 Ghost Admin 的 Settings → Membership → Tips & donations 中暂时禁用捐赠（ donations）功能，切断公共捐赠结算路径，直至完成升级。"
score = 5.3
severity = "MEDIUM"
sources = ["ghsa"]
title = "Ghost 捐赠功能支付校验绕过漏洞"
updated = "2026-07-14T02:16:57Z"

