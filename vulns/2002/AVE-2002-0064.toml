[basic]
description = "Samba 2.2.2 至 2.2.6 版本在解密加密密码时，将 DOS 代码页字符串转换为小端序 UCS-2 Unicode 字符串的过程中存在缓冲区溢出漏洞。未经身份认证的远程攻击者可通过发送特制的加密密码触发溢出，导致拒绝服务甚至远程任意代码执行。该漏洞影响 Samba 2.2.2 至 2.2.6 版本，CVSS 评分 10.0（CVSS:AV:N/AC:L/Au:N/C:C/I:C/A:C），属严重级别，攻击者无需认证即可远程利用。攻击者可通过发送精心构造的加密密码数据包触发解密过程中的缓冲区溢出，进而导致服务崩溃或在目标系统上执行任意代码。建议升级至 Samba 2.2.7 或更高版本修复该漏洞。"
published = "2002-12-11T05:00:00Z"
remediation = "立即升级 Samba 至 2.2.7 或更高版本（建议升级至 3.0.0 以上稳定版）。若暂时无法升级，可在防火墙层面限制 139/445 端口仅允许可信 IP 访问，或在 smb.conf 中设置 `encrypt passwords = no` 禁用加密密码认证作为临时缓解措施，但这会降低认证安全性，务必尽快完成版本升级。"
score = 10
severity = "CRITICAL"
sources = ["redhat"]
title = "沙巴缓冲区溢出漏洞导致拒绝服务和任意代码执行"
updated = "2026-06-16T21:59:06Z"

