[basic]
description = "CVE-2025-21682是一个安全漏洞，影响相关产品的安全性。攻击者可能利用此漏洞执行任意代码或获取未授权访问。建议用户及时更新到最新版本以修复此问题。"
published = "2025-01-31T12:15:29Z"
remediation = '升级 Linux 内核至修复版本：6.1.167、6.6.130、6.12.11 或 6.13-rc8 及更高版本，具体取决于所用稳定分支。如使用 Ubuntu 22.04 LTS 等长期支持发行版，请安装内核供应商提供的最新安全更新包以包含该补丁。如无法立即升级内核，可在所有使用 bnxt 驱动的网卡上禁用 XDP 功能作为临时缓解措施，执行命令 "ip link set dev <interface> xdp off" 并避免在 bnxt 接口上加载 XDP 程序。同时限制对系统本地控制台和物理访问权限，因为该漏洞需要本地提权权限才能触发空指针解引用崩溃。'
score = 7.3
severity = "HIGH"
sources = ["msrc"]
title = "Linux 内核 bnxt 以太网驱动空指针解引用漏洞"
updated = "2026-07-30T06:18:52Z"

