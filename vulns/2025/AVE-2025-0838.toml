[basic]
description = "Windows Kernel Streaming WOW Thunk 服务驱动程序存在输入验证不当漏洞，导致权限提升。已获得低权限的本地攻击者可利用该漏洞，通过向受影响系统发送特制的 IOCTL 请求触发内核态内存操作异常，从而将自身权限提升至 SYSTEM 级别，实现完全控制目标系统。该漏洞影响多个 Windows 版本，Microsoft 已在 2025 年 2 月安全更新中修复。"
published = "2025-02-11T18:15:35.947"
remediation = "建议立即安装 Microsoft 2025 年 2 月安全更新 (KB5051974)，或通过 Windows Update 自动更新获取修复。该漏洞为本地提权，需攻击者已获得低权限访问，临时缓解措施可限制非授权用户登录系统并监控异常进程加载 ks.sys/ksproxy.ax 等内核流驱动模块的行为。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows Kernel Streaming WOW Thunk 服务驱动程序特权提升漏洞"
updated = "2026-06-17T08:43:13.683"

