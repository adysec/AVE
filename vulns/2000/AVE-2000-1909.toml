[basic]
description = 'Windows 2000 系统监视器(System Monitor)ActiveX 控件存在缓冲区溢出漏洞，远程攻击者可通过在 HTML 源码中构造超长的 LogFileName 参数触发该漏洞，导致任意代码执行。该漏洞又名"ActiveX 参数验证"漏洞，攻击者只需诱使用户访问恶意网页即可利用，无需任何身份认证。CVSS 评分 10.0，危害等级严重，可完全控制受影响的系统。'
published = "2000-12-11T05:00:00.000"
remediation = "立即安装 Microsoft 安全公告 MS00-085 提供的补丁，下载地址为 https://www.microsoft.com/download/details.aspx?FamilyId=19B2BF01-BA79-47D6-9372-79A9FFF9663B。如无法安装补丁，可在 Internet Explorer 安全设置中将 Internet 区域和受限站点区域的 ActiveX 控件和插件设为禁用，或应用 Outlook 安全更新将邮件移至受限站点区域以阻止 HTML 邮件调用 ActiveX 控件。"
score = 10
severity = "CRITICAL"
sources = ["cve"]
title = "Microsoft Windows 2000 System Monitor ActiveX 控件缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:00.920"

