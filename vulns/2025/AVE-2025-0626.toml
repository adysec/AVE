[basic]
description = "Google Chrome Android 版本在 134.0.6998.35 之前存在浏览器 UI 实现不当漏洞（CWE-1021），远程攻击者可通过构造特制的 HTML 页面在目标设备上执行 UI 欺骗攻击，诱导用户误认为正在与合法界面元素交互，从而执行非预期操作。该漏洞仅影响 Android 平台上的 Chrome 及基于 Chromium 的 Microsoft Edge 浏览器，攻击复杂度低，无需身份认证，但需要用户交互触发，CVSS 评分 4.3，危害等级中危。Google 已在 Chrome 134.0.6998.35 版本中修复此漏洞。"
published = "2025-03-05T04:15:11Z"
remediation = "升级 Google Chrome for Android 至 134.0.6998.35 或更高版本，可通过 Google Play 商店检查并安装更新。使用 Microsoft Edge 的用户应升级至 134.0.3124.51 或更高版本。如无法立即更新，可在浏览器设置中禁用 JavaScript 并避免点击不可信链接作为临时缓解措施。"
score = 4.3
severity = "MEDIUM"
sources = ["msrc"]
title = "Google Chrome Android 浏览器 UI 实现不当导致界面欺骗漏洞"
updated = "2026-06-17T08:40:20Z"

