[basic]
description = 'tags.<value>这是一个Netwin Netauth程序4.2e及更早版本的目录遍历漏洞。该系统在netauth.cgi程序中未能有效验证用户输入，导致攻击者能够使用路径遍历序列（.."dot dot"）绕过正常目录限制。通过发送包含路径遍历序列的特制HTTP请求，未经身份验证的远程攻击者可以读取目标服务器文件系统上的任意敏感文件。攻击影响包括暴露敏感系统文件、配置信息和认证凭证。该漏洞可通过简单的HTTP请求远程无损利用，无需身份验证，可能影响运行Netwin Netauth服务的网络服务器。成功利用后，攻击者可以获取机密信息，从而为对系统进行进一步攻击奠定基础。该漏洞反映了Web应用程序对用户输入验证和路径控制的不足，强调了实施严格输入验证和使用安全的文件访问函数的重要性。'
published = "2000-10-20T04:00:00Z"
remediation = '升级到 Netwin Netauth 4.2f 或更高版本以获取目录遍历修复；在 httpd 配置文件中禁用执行权限的目录访问；启用 Web 服务器 WAF 以阻止 ".." 路径模式；限制 netauth.cgi 进程的系统用户权限为低权限账户；定期应用安全补丁更新相关 Component 中文名：Netwin Netauth 4.2f 或更高版本'
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "NetWin Netauth 4.2 目录遍历漏洞"
updated = "2026-06-16T21:52:28Z"

