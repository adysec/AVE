[basic]
description = "libolm（Olm）加密库存在多个安全漏洞，包括AES密钥协商过程中的时序/侧信道泄露、Ed25519签名可伪造性缺陷以及base64解码中的时序信息泄漏。攻击者可利用这些漏洞在无需身份认证的情况下，通过远程发送特制加密消息或观察通信时序特征，破解密钥协商过程或伪造有效签名，从而窃取或篡改Matrix协议的端到端加密消息内容。该漏洞影响使用libolm依赖的matrix-commander（Python版本）等Matrix客户端与服务端软件，CVSS评分为5.0，危害等级为中等。建议升级至修复版本并关注官方安全公告。"
