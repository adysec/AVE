[basic]
description = "PHP 的 imap_open() 函数在调用 IMAP 扩展时，底层依赖的 University of Washington IMAP Toolkit 2007f 中 imap_rimap() 和 tcp_aopen() 函数会通过 rsh 命令建立连接，但未对 mailbox 参数进行有效过滤，导致参数注入漏洞。在 Debian/Ubuntu 等系统中 rsh 被符号链接指向 ssh 时，攻击者可利用包含 -oProxyCommand 参数的恶意 IMAP 服务器名注入任意系统命令。该漏洞影响 PHP 5.6.x、7.0.x、7.1.x、7.2.x 及 7.3.x 等多个版本，攻击者只需具备 Web 应用用户权限即可触发，CVSS 评分 7.5，危害等级高。官方已在 PHP 5.6.39、7.0.33、7.1.25、7.2.13 及 7.3.0 版本中修复此漏洞。"
published = "2018-11-25T10:29:00Z"
remediation = "升级 PHP 至 5.6.39、7.0.33、7.1.25 或 7.2.13 及以上版本（官方已修复 imap_open 参数注入问题）。如无法升级，在 php.ini 中禁用 imap 扩展（`extension=imap.so` 前加分号注释），或使用 `disable_functions=imap_open` 禁用该函数。同时避免将用户可控输入直接传递给 imap_open 的 mailbox 参数，并对 IMAP 服务器名做严格白名单校验。"
score = 7.5
severity = "HIGH"
sources = ["nuclei"]
title = "PHP IMAP 远程命令执行漏洞"
updated = "2026-06-17T01:49:25Z"

