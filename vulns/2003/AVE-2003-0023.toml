[basic]
description = "hanterm-xf 终端模拟器 2.0.5 之前版本中的 DEC UDK（用户定义键）处理功能存在拒绝服务漏洞。本地攻击者可通过向终端发送特制的转义序列，导致终端进入死循环，从而触发拒绝服务。该漏洞攻击条件要求本地访问权限，无需认证即可利用，影响系统可用性。CVSS 评分 2.1，危害等级低。"
published = "2003-03-03T05:00:00Z"
remediation = "升级 hanterm-xf 至 2.0.5 或更高版本，该版本已修复 DEC UDK 处理中的死循环缺陷。如无法升级，避免在终端中执行来源不明的转义序列，或考虑替换为其他终端模拟器（如 xterm、gnome-terminal）作为临时缓解措施。"
score = 2.1
severity = "LOW"
sources = ["redhat"]
title = "Hanterm hanterm-xf 终端模拟器拒绝服务漏洞"
updated = "2026-06-16T22:01:28Z"

