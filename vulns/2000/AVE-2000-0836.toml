[basic]
description = "Real Networks 开发的 RealServer 5.0、6.0 及 7.0 版本存在内存内容泄露漏洞。该漏洞的原理是服务器对 `/admin/includes/` 路径的访问控制存在缺陷，未经身份认证的远程攻击者无需任何凭据即可直接访问该路径，从而获取 RealServer 进程内存中的部分数据，其中可能包含敏感信息如会话令牌、配置文件内容或其他机密数据。该漏洞影响 RealServer 7.0 及更早版本，攻击条件极为简单，仅需目标服务器允许外部网络访问其管理相关路径即可实现利用，攻击者通过构造特定 HTTP 请求即可触发内存数据泄露，进而为后续进一步攻击提供信息基础。"
published = "2001-01-09T05:00:00Z"
remediation = "将 RealServer 升级至 7.0.1 或更高版本，以修复 /admin/includes/ 路径下的内存内容泄露漏洞。如无法立即升级，可通过防火墙或访问控制列表禁止外部访问 /admin/includes/ URL，并在 RealServer 配置中禁用不必要的管理接口。同时检查服务器日志中是否存在对该路径的异常访问记录，若发现可疑请求应立即重置受影响用户的会话凭证与密码，以防止泄露的内存数据中包含的用户名、密码或 Cookie 被利用。"
score = 5
severity = "MEDIUM"
sources = ["avd"]
title = "Real Networks RealServer 内存信息泄露漏洞"
updated = "2026-06-16T21:53:19Z"

