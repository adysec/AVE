[basic]
description = "ZOHO ManageEngine Firewall Analyzer 8.0 之前版本存在目录遍历漏洞（CWE-22），由于对用户提供的文件路径参数缺乏充分过滤和验证，具有低权限的认证攻击者可通过向受影响系统发送特制的 HTTP 请求，利用路径遍历序列（如 `../`）突破目录限制，读取服务器上任意敏感文件（如配置文件、系统日志等），导致机密信息泄露。该漏洞攻击复杂度低，无需用户交互，仅需网络访问和低权限认证即可利用。厂商已在 Firewall Analyzer 8.0 版本中修复此漏洞。"
published = "2017-06-27T20:29:00Z"
remediation = "立即将 ZOHO ManageEngine Firewall Analyzer 升级到 8.0 或更高版本。该漏洞存在于 8.0 之前的所有版本中，攻击者可利用目录遍历漏洞读取服务器任意文件。如无法立即升级，建议限制对 Firewall Analyzer Web 控制台的网络访问，仅允许可信 IP 通过防火墙规则访问管理端口。"
score = 6.5
severity = "MEDIUM"
sources = ["nuclei"]
title = "ZOHO ManageEngine Firewall Analyzer 目录遍历漏洞"
updated = "2026-06-17T00:33:07Z"

