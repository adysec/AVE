[basic]
description = "TOLIS Group Backup and Restore Utility (BRU) 17.0 的 setlicense 脚本在处理临时文件时存在不安全的符号链接漏洞。本地攻击者可通过在 /tmp/brutest.$$ 临时文件创建符号链接，利用该脚本的权限提升机制覆盖系统任意文件，导致权限提升或敏感数据破坏。攻击条件为拥有本地访问权限，无需身份认证即可利用，CVSS 评分 7.2，危害等级高。"
published = "2002-05-16T04:00:00Z"
remediation = "建议立即升级到 TOLIS Group BRU 的修复版本（17.0 之后版本）。如无法升级，可移除 setlicense 脚本的 setuid/setgid 权限，或限制仅受信任用户可执行该脚本。临时缓解措施包括使用 mktemp 等安全函数创建临时文件，避免使用可预测的 PID 作为文件名后缀。"
score = 7.2
severity = "HIGH"
sources = ["exploitdb"]
title = "TOLIS Group BRU 17.0 SetLicense脚本本地不安全临时文件符号链接漏洞"
updated = "2026-06-16T21:57:00Z"

