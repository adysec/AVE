[info]
author = "ave"
description = "KDE rlogin.protocol URL 处理漏洞允许攻击者通过构造恶意 URL 在目标系统上执行任意代码"
id = "POC-AVE-2002-0322"
name = "CVE-2002-1281 PoC"
severity = "high"
tags = ["ave-2002-0322"]
vuln_id = [
    "CVE-2002-1281",
    "AVE-2002-0322",
]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/{{BaseURL}}/rlogin.protocol"
protocol = "http"

[poc.requests.body]
content = ""
type = "raw"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["rlogin"]
