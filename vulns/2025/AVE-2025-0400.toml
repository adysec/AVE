[basic]
description = "趋势科技 Apex One（本地部署版）管理控制台存在操作系统命令注入漏洞，CVE-2025-54948 评分为 9.4，危害等级严重。未经身份认证的远程攻击者可通过向管理控制台上传特制恶意代码，在目标系统上以服务权限执行任意命令。该漏洞源于管理控制台对用户输入的命令参数过滤不严，导致 OS 命令注入（CWE-78）。攻击者无需任何凭据即可远程利用，成功利用后可完全控制受影响服务器，进而横向移动至内网其他主机。趋势科技已在安全公告中提供修复补丁，建议用户立即升级至最新版本。"
published = "2025-08-05T13:15:28Z"
remediation = "立即安装趋势科技官方发布的临时缓解工具 FixTool_Aug2025（SHA-256: a9f3de1e8d15b6128aadeb8b5d99dba0d1d08500ccb4a16d58280750c620bab0）以阻断已知利用途径，该工具会禁用远程安装代理功能但可完全防护已知漏洞。随后安装永久修复补丁 SP1 CP B14081（2025年8月15日发布）以恢复远程安装代理功能。如无法立即打补丁，应将管理控制台的 IP 地址限制在可信网络范围内，避免暴露在公网。"
score = 9.4
severity = "CRITICAL"
sources = ["zdi"]
title = "Trend Micro Apex One 管理控制台操作系统命令注入漏洞"
updated = "2026-06-17T09:40:58Z"

