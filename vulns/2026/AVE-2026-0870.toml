[basic]
description = "Mistune 是一款 Python Markdown 解析器，其 HTML 渲染器中的 `safe_url` 函数采用黑名单机制过滤危险 URL 协议，但仅拦截了 `javascript:`、`vbscript:`、`file:` 和 `data:` 四种协议，遗漏了 `feed:`、`view-source:`、`jar:`、`livescript:`、`mocha:`、`ms-its:`、`mk:` 和 `res:` 等历史遗留或可链式调用的协议。攻击者可在用户可控的 Markdown 内容中构造如 `feed:javascript:alert(1)` 的链接，当使用旧版 Firefox、Internet Explorer、Edge Legacy 或注册了自定义协议处理器的浏览器用户点击该链接时，链式协议会触发 JavaScript 执行，导致跨站脚本攻击（XSS），可窃取用户会话 Cookie 或冒充用户执行操作。该漏洞影响 3.3.0 之前的所有版本，攻击无需身份认证，但需要用户交互（点击链接）。"
published = "2026-07-08T17:17:28Z"
remediation = "立即将 mistune 升级至 3.3.0 或更高版本（`pip install --upgrade mistune`），该版本已将 URL 协议校验从黑名单模式改为白名单模式，仅允许 http:/https:/mailto: 等安全协议。如无法升级，可在应用层对所有用户输入的 Markdown 链接进行二次过滤，在渲染前检查 href 中是否包含非白名单协议前缀。"
score = 6.1
severity = "MEDIUM"
sources = ["ghsa"]
title = "Mistune Markdown 解析器 URL 方案过滤绕过导致跨站脚本攻击漏洞"
updated = "2026-07-09T19:29:01Z"

