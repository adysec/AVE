[basic]
description = "Open WebUI 的 OAuth 令牌交换端点存在身份认证绕过漏洞。当 `ENABLE_OAUTH_TOKEN_EXCHANGE=True` 时，`/oauth/{provider}/token/exchange` 接口接受攻击者提交的原始 OAuth 提供商访问令牌，仅通过调用提供商的 userinfo 端点验证令牌有效性，但未验证该令牌是由哪个 OAuth 客户端签发的。由于 userinfo 端点仅返回令牌是否有效而不返回签发客户端信息，任何持有同一提供商下任意客户端签发的访问令牌的攻击者，均可将其兑换为 Open WebUI 会话，实现对目标账户的完全接管。该漏洞影响 0.8.0 至 0.11.0 版本，攻击者可诱骗已注册用户在攻击者控制的第三方 OAuth 应用上登录以获取令牌，且无需受害者与 Open WebUI 交互。成功利用后攻击者可获得目标账户的全部权限，若目标为管理员则直接获得管理员会话。该漏洞已在 0.11.0 版本中通过 RFC 7662 令牌内省机制修复，部署时需同时设置 `OAUTH_TOKEN_EXCHANGE_TRUSTED_CLIENT_IDS` 环境变量以限制可信客户端。CVSS v3.1 评分为 8.1（高危）。"
published = "2026-08-04T20:16:55Z"
remediation = "立即将 Open WebUI 升级至 0.11.0 或更高版本，并在环境变量中设置 OAUTH_TOKEN_EXCHANGE_TRUSTED_CLIENT_IDS，仅允许受信任的 OAuth 客户端 ID 进行令牌交换；对于不支持 RFC 7662 令牌自省的服务提供商（如 Google、GitHub、Microsoft Entra ID、Feishu），必须将 ENABLE_OAUTH_TOKEN_EXCHANGE 设为 False 以彻底禁用令牌交换功能，无法通过管理界面动态修改该配置。"
score = 8.1
severity = "HIGH"
sources = ["ghsa"]
title = "Open WebUI OAuth令牌交换账户劫持漏洞"
updated = "2026-08-06T05:17:07Z"

