[basic]
description = "tags format.<value>Google Chrome 的 V8 JavaScript 引擎存在类型混淆漏洞（CVE-2025-13630，CWE-843）。未经身份认证的远程攻击者可通过诱导用户访问特制的 HTML 页面，利用该漏洞触发堆内存破坏，进而可能实现远程代码执行。该漏洞影响 Google Chrome 143.0.7499.41 之前的所有版本。Google 已在 Chrome 143.0.7499.41 版本中修复此漏洞，用户应及时更新浏览器以消除安全风险。"
published = "2025-12-02T19:15:46Z"
remediation = "立即将 Google Chrome 升级至 143.0.7499.41 或更高版本。Windows 用户可通过 Google Chrome 浏览器设置中的「关于 Chrome」自动检测并安装更新；Linux 用户请通过系统包管理器执行 `sudo apt update && sudo apt install chromium-browser`（Debian/Ubuntu）或 `sudo dnf update chromium`（Fedora/RHEL）更新至 143.0.7499.146 及以上版本。更新完成后重启浏览器。在补丁部署前，建议在浏览器设置中禁用 JavaScript 执行作为临时缓解措施，具体操作为：设置 → 隐私和安全 → 站点设置 → JavaScript → 阻止所有站点运行 JavaScript。确认更新后在地址栏输入 `chrome://version` 验证版本号已升至 143.0.7499.41 或以上。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "Google Chrome V8 类型混淆漏洞"
updated = "2026-06-17T08:34:28Z"

