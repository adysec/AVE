[basic]
description = "netfoil 在 Linux 平台拦截域名时使用 `0.0.0.0` 替代 `NXDOMAIN` 作为拦截响应地址。由于 Linux 系统中 `0.0.0.0` 会解析至本地回环地址（localhost）而非直接丢弃数据包，原本应被拦截的网络请求会被错误地重定向到本机。未经身份认证的远程攻击者可利用此漏洞将目标流量导向本地运行的服务，具体危害程度取决于目标系统上运行的服务类型及防火墙规则配置。该漏洞影响所有使用 netfoil 的 Linux 平台版本，攻击者无需任何凭据即可远程触发。"
published = ""
remediation = "请参考官方安全公告，及时安装安全更新或升级到最新版本。"
