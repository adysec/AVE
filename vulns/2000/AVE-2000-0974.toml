[basic]
description = "SunFTP build 9(1) 存在缓冲区溢出漏洞，远程攻击者可通过向 FTP 服务发送超长的 GET 请求触发缓冲区溢出，导致服务进程崩溃造成拒绝服务，或可能执行任意命令。该漏洞影响 SunFTP build 9(1) 版本，攻击者无需身份认证即可远程利用，CVSS 评分 7.5，危害等级高。目前尚无官方补丁发布，建议限制对 FTP 服务的访问权限以降低风险。"
published = "2000-11-14T05:00:00Z"
remediation = "SunFTP build 9(1) 已停止维护，厂商未提供安全补丁。建议立即停止使用 SunFTP，迁移至仍受支持的 FTP 服务器软件（如 vsftpd、ProFTPD）。若无法立即迁移，应在防火墙层面限制对 SunFTP 端口（默认 21）的访问来源，仅允许可信 IP 连接，并部署入侵检测规则监控超长 GET 请求作为临时缓解措施。"
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "xs4all SunFTP 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:52:36Z"

