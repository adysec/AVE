[basic]
description = "mICQ 是一款开源的 ICQ 即时通讯客户端软件。该漏洞存在于 mICQ 0.4.9 及更早版本中，远程攻击者可通过向目标系统发送缺少 0xFE 分隔符字符的畸形 ICQ 消息类型触发拒绝服务。漏洞原理在于 mICQ 在解析 ICQ 消息时未正确处理缺少 0xFE 分隔符的消息类型，导致程序异常终止。该漏洞可通过网络远程利用，无需身份认证，仅影响系统可用性（机密性与完整性不受影响），CVSS 评分为 5.0。利用条件简单：攻击者只需向使用受影响版本 mICQ 客户端的用户发送特制的畸形 ICQ 消息即可，触发后客户端将崩溃退出，无法继续接收和处理 ICQ 消息，从而造成服务中断，影响普通用户及企业内部通信效率。"
published = "2002-12-23T05:00:00Z"
remediation = "建议将 mICQ 升级至 0.4.9.4 或更高版本以修复该拒绝服务漏洞。Debian Woody 用户应安装 DSA-211 安全更新（micq 0.4.9-0woody3），Unstable 用户升级至 0.4.9.4-1。如暂时无法升级，可在防火墙上限制 ICQ 协议入站连接，或临时禁用自动接收陌生 ICQ 消息作为缓解措施。"
score = 5
severity = "MEDIUM"
sources = ["redhat"]
title = "Matthew Smith mICQ 0.4.9 及更早版本中存在拒绝服务漏洞"
updated = "2026-06-16T21:59:10Z"

