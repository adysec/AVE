[basic]
description = "Cyrus SASL 库 2.1.9 及更早版本存在多个缓冲区溢出漏洞，远程未经认证的攻击者可通过发送超长用户名规范化输入、LDAP 认证时需转义的特殊字符，或利用日志记录器的越界写入缺陷（未为字符串结束符分配空间），触发缓冲区溢出导致拒绝服务甚至任意代码执行。该漏洞影响使用 Cyrus SASL 进行身份认证的各类服务（如 SMTP、IMAP、LDAP 等），CVSS 评分 9.8 级别为严重，攻击无需用户交互且可远程利用。"
published = "2002-12-18T05:00:00Z"
remediation = "升级 Cyrus SASL 库至 2.1.10 或更高版本（官方已在 2.1.10 中修复此缓冲区溢出）。若暂时无法升级，可在应用层限制用户名/认证输入长度，并在防火墙层面阻断非必要的 SASL 认证端口（如 25、587、143、993、110、995 等）对外暴露，或临时禁用 saslauthd LDAP 认证模块以阻断攻击向量 (2)。"
score = 9.8
severity = "CRITICAL"
sources = ["redhat"]
title = "Cyrus SASL 库 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:59:08Z"

