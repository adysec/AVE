[basic]
description = "Heat-On HSWeb Web Server 2.0 存在路径信息泄露漏洞，未经身份认证的远程攻击者可通过向目标服务器发送指向 /cgi/ 目录的请求，利用目录浏览功能获取服务器的物理路径信息。该漏洞影响运行 HSWeb 2.0 的所有系统，攻击者无需任何凭据即可在网络上远程触发，利用方式简单直接，仅需构造普通的 HTTP 请求即可获得服务器真实文件系统路径，为后续进一步的攻击 reconnaissance 提供有价值的信息支撑。CVSS 评分 5.0，危害等级中等，建议关闭目录浏览功能或升级至安全版本。"
published = "2001-05-03T04:00:00Z"
remediation = "建议在服务器配置中禁用目录浏览（Directory Browsing）功能，防止 /cgi/ 等敏感目录泄露物理路径。由于该软件版本过旧且缺乏官方补丁，建议尽快迁移至 Apache 或 Nginx 等现代安全 Web 服务器。"
score = 5
severity = "MEDIUM"
sources = ["epss"]
title = "Heat-On HSWeb Web Server 2.0 路径泄露漏洞"
updated = "2026-06-16T21:53:52Z"

