[basic]
description = "Windows exFAT 文件系统驱动中存在堆缓冲区溢出漏洞（CWE-122），由于驱动程序在处理畸形 exFAT 文件系统映像时未正确验证堆内存边界，导致攻击者可通过特制的 exFAT 格式存储设备触发缓冲区溢出。本地攻击者需要诱使用户挂载或访问恶意构造的 exFAT 映像文件，成功利用后可获得目标系统的 SYSTEM 权限，实现权限提升并执行任意代码。该漏洞影响所有受支持的 Windows 10/11 及 Windows Server 版本，CVSS 评分 7.8，危害等级高。Microsoft 已在 2025 年 3 月安全更新中修复此漏洞。"
published = "2025-03-11T17:16:18Z"
remediation = "立即安装 Microsoft 2025 年 3 月安全更新。各版本对应修复版本号：Windows 10 1507 升级到 10.0.10240.20947 及以上、Windows 10 1607 升级到 10.0.14393.7876、Windows 10 1809 升级到 10.0.17763.7009、Windows 10 21H2 升级到 10.0.19044.5608、Windows 10 22H2 升级到 10.0.19045.5608、Windows 11 22H2/23H2 升级到 10.0.22621.5039 或 10.0.22631.5039、Windows 11 24H2 升级到 10.0.26100.3476、Windows Server 2016 升级到 10.0.14393.7876、Windows Server 2019 升级到 10.0.17763.7009、Windows Server 2022 升级到 10.0.20348.3270、Windows Server 2025 升级到 10.0.26100.3403。可通过 Windows Update 自动获取更新，或从 Microsoft Update Catalog 手动下载安装。临时缓解措施：限制用户对 exFAT 格式卷的写入权限，避免打开来自不可信来源的 exFAT 格式存储设备。"
score = 7.8
severity = "HIGH"
sources = ["msrc"]
title = "Microsoft Windows exFAT 文件系统远程代码执行漏洞"
updated = "2026-06-17T08:42:42Z"

