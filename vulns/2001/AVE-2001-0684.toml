[basic]
description = 'tags.<value>Easycom/Safecom 打印服务器（Print Server）的 Web 服务（版本 404.590 及更早版本）存在缓冲区溢出漏洞。该漏洞源于 Web 服务在处理 (1) 过长的 URL 或 (2) 过长的 HTTP 头字段（如 "Host:"）时未正确校验输入长度，导致数据写入超出分配缓冲区边界，从而触发缓冲区溢出。远程攻击者无需身份认证，只需向打印服务器 Web 管理接口发送包含超长 URL 或超长 HTTP 头字段的恶意请求即可触发漏洞，进而可执行任意系统命令，实现远程代码执行，可能完全控制受影响设备或造成拒绝服务。该漏洞影响范围广泛，且利用条件简单，危害较高。'
published = "2001-06-02T04:00:00Z"
remediation = "该漏洞影响 Easycom/Safecom Print Server Web service 404.590 及更早版本，该产品为早期嵌入式打印服务器固件，厂商已停止安全支持。立即将其固件升级至最新可用版本 404.600 或更高版本以修复 Web 服务缓冲区溢出。若无法升级，应将设备的 Web 管理端口（默认 HTTP 80/8080）限制在可信内部管理网段，并在防火墙/ACL 层面仅允许可信管理主机访问，同时禁用或修改默认管理员口令；对于易受攻击的旧固件，建议仅允许 HTTP（勿开启 HTTPS Web 管理），并对暴露公网的打印服务器端口进行访问控制，必要时不使用该旧设备并替换为支持安全更新的新型号。"
score = 7.5
severity = "HIGH"
sources = ["cve"]
title = "easycom_safecom_print_server 缓冲区溢出代码执行漏洞 漏洞"
updated = "2026-06-16T21:53:58Z"

