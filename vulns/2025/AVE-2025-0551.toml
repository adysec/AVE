[basic]
description = "Google Chrome 浏览器 V8 JavaScript 引擎存在类型混淆漏洞（CVE-2025-13224），攻击者可通过精心构建的 HTML 网页向目标发送恶意 JavaScript 代码，触发 V8 引擎对 JavaScript 对象类型的错误识别和处理漏洞。该漏洞导致堆内存控制信息被破坏，攻击者可利用该漏洞实现对浏览器进程的控制，从而在受害者机器上执行任意代码。该漏洞影响 Google Chrome 142.0.7444.175 及更早版本用户，攻击者无需任何权限即可远程发起攻击。漏洞的 CVSS 评分高达 8.8，评定为高危级别，给用户的数据安全和系统完整性带来了严重威胁。这类类型的混淆攻击需要攻击者掌握对 V8 内部工作机制的深刻理解，并需要不断尝试不同的输入方法来触发漏洞，最终导致堆内存控制信息的破坏，为攻击者控制浏览器进程创造了条件。漏洞的利用过程涉及到对浏览器内存布局、分配策略以及 V8 引擎垃圾回收机制的深入了解，需要精确控制数据的类型转换和内存访问以达到攻击目的。早在 2025 年 11 月 17 日，微软和 Chrome 安全团队就已经发布了紧急安全公告，指出该漏洞源于 V8 引擎在处理某些特定 JavaScript 数据类型时缺乏足够的类型检查，导致对堆内存控制信息的破坏，攻击者可通过网络远程发起攻击，在受害者浏览器中建立持久控制，为进一步的恶意活动创造了便利，威胁用户的系统安全和隐私信息的安全。"
published = "2025-11-17T23:15:47Z"
remediation = "立即通过 Chrome 浏览器菜单“帮助 → 关于 Google Chrome”检查并更新至 142.0.7444.175 或更高版本（已修复 V8 类型混淆漏洞），Chrome 默认自动更新，若无法自动更新可访问 https://www.google.com/chrome/ 下载最新安装包覆盖安装。企业环境可通过组策略配置 AutoUpdateCheckPeriodMinutes=0 强制更新，或临时在 chrome://settings/content/javascript 禁用 JavaScript 作为缓解措施（会导致部分网站无法正常使用），建议在 24 小时内完成全网终端升级并重启浏览器验证版本号。"
score = 8.8
severity = "HIGH"
sources = ["msrc"]
title = "谷歌 Chrome V8 类型混淆漏洞"
