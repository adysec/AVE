[basic]
description = "Apple iOS 5.0.1 之前版本（iPad 2）的 Passcode Lock 密码锁功能未正确实现锁定状态。当攻击者在电源关闭确认过程中打开 iPad 2 的 Smart Cover（智能保护盖）时，可绕过密码锁定的限制，从而获取设备上未加密的数据，构成未经授权的数据访问。该漏洞利用条件要求物理接触设备，且需在设备处于电源关闭确认过程中打开智能保护盖，属于本地物理访问场景，危害相对较低，CVSS 评分 1.2。攻击者无需任何认证即可通过该方式窃取设备中的数据。"
published = "2011-11-11T18:55:01Z"
remediation = "立即通过 iTunes 或设备“设置→通用→软件更新”将 Apple iPad 2 等受影响设备升级至 iOS 5.0.1 或更高版本，该版本已修复 Passcode Lock 的锁定状态实现缺陷，防止在关机确认阶段通过 Smart Cover 绕过密码读取数据。在无法立即升级时，作为临时缓解措施，请勿在公共场所使用 Smart Cover 搭配自动锁定开启状态，并设置较短的自动锁定等待时间增强密码锁定强度。"
score = 1.2
severity = "LOW"
sources = ["tenable"]
title = "Apple iOS 密码锁绕过漏洞"
updated = "2026-06-16T23:33:17Z"

