[basic]
description = "Django 的 CommonMiddleware 中间件存在开放重定向漏洞，当用户访问以斜杠结尾的 URL 时，Django 会自动将请求重定向到不带斜杠的 URL，但该过程中未对 HTTP Host 头进行充分验证，导致攻击者可通过构造恶意的 Host 头将用户重定向到任意外部网站。攻击者无需身份认证，仅需诱导用户点击特制链接即可实施钓鱼攻击。该漏洞影响 Django 1.11.15 之前版本及 2.0.8 之前版本，CVSS 评分 6.1，危害等级中危。官方已在 Django 1.11.15 和 2.0.8 版本中修复此漏洞。"
published = "2018-08-03T17:29:00Z"
remediation = "升级 Django 至 1.11.15 或 2.0.8 及以上版本，该版本修复了 CommonMiddleware 中未对 `next` 参数进行充分校验导致的任意 URL 跳转问题。如无法立即升级，可在 Nginx 反向代理层添加规则过滤包含可疑 `next` 参数的请求，或禁用 `django.middleware.common.CommonMiddleware` 中间件作为临时缓解措施。"
score = 6.1
severity = "MEDIUM"
sources = ["nuclei"]
title = "Django CommonMiddleware 开放重定向漏洞"
updated = "2026-06-17T01:41:12Z"

