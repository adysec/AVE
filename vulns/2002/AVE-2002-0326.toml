[basic]
description = "ISC INN (InterNetNews) 2.0/2.1/2.2.x 版本中的 inews 和 rnews 程序存在多个格式字符串漏洞。攻击者可通过构造包含格式字符串说明符（如 %n、%s、%x 等）的恶意 NNTP 响应，诱使 inews 或 rnews 在处理响应时发生格式字符串解析错误，进而实现任意内存读写，最终导致本地权限提升或远程代码执行。该漏洞影响 INN 2.2.3 及更早版本（含 2.0、2.1、2.2.x 系列），攻击向量包括本地用户和远程恶意 NNTP 服务器，攻击复杂度低、无需认证，CVSS 10.0 分（CRITICAL），影响机密性、完整性和可用性。攻击者可通过搭建恶意 NNTP 服务器或本地调用漏洞程序触发漏洞，最终获得系统最高权限。"
published = "2002-08-12T04:00:00Z"
remediation = "建议立即升级 INN (InterNetNews) 至 2.2.4 或更高版本（ISC 官网下载 inn-2.2.4.tar.gz 或更高版本编译安装），或升级至 INN 2.3.x 稳定分支。升级前务必备份 /etc/news/ 等配置目录与文章库。若暂时无法升级，可临时禁用 inews 和 rnews 的 setuid 位（chmod u-s /usr/bin/inews /usr/bin/rnews），并限制 NNTP 服务器仅允许受信 IP 连接（在 /etc/news/innfeed.conf 和 incoming.conf 中配置 peers 白名单），同时在防火墙层面限制 119 端口仅对受信新闻服务器开放，作为临时缓解措施。"
score = 10
severity = "CRITICAL"
sources = ["exploitdb"]
title = "ISC INN 本地格式字符串漏洞"
updated = "2026-06-16T21:57:36Z"

