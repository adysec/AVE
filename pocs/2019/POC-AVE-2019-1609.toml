[info]
author = "ave"
description = "通过向 Kibana Timelion API 发送 POST 请求验证原型链污染漏洞（CVE-2019-7609）是否存在。目标版本为 Kibana 5.6.15 之前及 6.6.1 之前，该漏洞允许未授权攻击者通过 Timelion 组件注入恶意 JavaScript 代码实现远程代码执行。"
id = "POC-AVE-2019-1609"
name = "Kibana Timelion 远程代码执行漏洞检测"
severity = "critical"
tags = ["ave-2019-1609"]
vuln_id = [
    "CVE-2019-7609",
    "AVE-2019-1609",
]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/api/timelion/run"
protocol = "http"

[poc.requests.body]
type = "raw"

[poc.requests.headers]
Content-Type = "application/json; charset=utf-8"

[[poc.requests.matchers]]
expect = true
part = "body"
type = "word"
words = ["seriesList"]

[[poc.requests.matchers]]
expect = true
part = "header"
type = "word"
words = ["application/json"]

[[poc.requests.matchers]]
expect = true
status = [200]
type = "status"
