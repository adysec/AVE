[basic]
description = "Helix GNOME Updater helix-update 0.5 及更早版本存在临时目录创建不当漏洞。该更新器在安装过程中未能正确创建和保护 /tmp 目录，导致本地用户可将空的系统配置文件写入 /etc/config.d/ 目录（如 bashrc、csh.cshrc）及 /etc/rc.config。当 Shell 初始化脚本读取这些空配置文件时，攻击者可借此嵌入恶意 Shell 代码，实现本地权限提升。攻击者仅需具备本地用户权限，无需网络访问或身份认证即可利用，影响使用 GNOME 桌面并安装 helix-update 的 Linux 系统，CVSS 评分 1.2（低危），主要影响系统完整性与可用性。"
published = "2000-10-20T04:00:00Z"
remediation = "建议立即升级 Helix GNOME Updater (helix-update) 至 0.5 以上版本（建议升级至最新稳定版）。若无法立即升级，可通过以下缓解措施降低风险：1) 设置 /tmp 目录粘滞位（chmod +t /tmp），防止普通用户创建/删除他人文件；2) 限制普通用户对 /etc/config.d/ 等系统配置目录的写入权限（chmod 755 /etc/config.d）；3) 限制本地非必要用户登录权限，降低本地攻击面。建议通过发行版包管理器（如 apt upgrade helix-gnome-updater 或 yum update helix-gnome-updater）获取官方修复补丁。"
score = 1.2
severity = "LOW"
sources = ["avd"]
title = "Helix GNOME Updater 临时目录创建不当导致系统配置文件覆盖漏洞"
updated = "2026-06-16T21:52:20Z"

