[basic]
description = "Zeroshell 3.9.0 及以下版本的 Web 应用在处理 HTTP 参数时未对输入进行充分过滤，导致操作系统命令注入漏洞。具体而言，位于 `/cgi-bin/kerbynet` 的 x509view 功能在解析 `x509type` 等参数时未对换行符等特殊字符进行转义，未经身份认证的远程攻击者可通过在参数中注入换行符（`%0A`）拼接并执行任意操作系统命令。此外，Apache 用户在 `/etc/sudoers` 中被配置为无需密码即可以 root 身份执行 `/bin/tar` 命令，攻击者可利用此配置结合 tar 的 `--checkpoint-action` 选项实现权限提升至 root。该漏洞影响所有暴露在互联网上的 Zeroshell 3.9.0 设备，CVSS v3 评分 9.8，危害等级严重。攻击者只需向目标发送特制的 HTTP GET 请求即可完成利用，无需任何凭据，且可利用 nuclei 模板或公开 exploit 脚本一键获取服务器 root 权限。"
published = "2019-07-19T23:15:10Z"
remediation = "建议立即将 Zeroshell 升级至 3.9.1 或更高版本，该版本已修复 x509view 脚本的 HTTP 参数注入漏洞。升级前请备份配置数据，升级后验证 Web 管理界面无法通过未授权参数执行系统命令。若无法立即升级，可在防火墙或反向代理层对 /cgi-bin/kerbynet 的 x509view 请求进行过滤，或临时限制 Web 管理界面的公网访问权限。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Zeroshell 3.9.0 x509view 远程命令执行漏洞"
updated = "2026-06-17T02:15:19Z"

