[basic]
description = "tags.<value>HP OpenView Network Node Manager (NNM) 6.1 及更早版本的数据库配置脚本存在不安全权限配置漏洞。本地攻击者可利用脚本文件权限设置不当的缺陷，通过篡改或执行特权脚本实现权限提升，从而获得更高权限访问系统资源。该漏洞影响 NNM 6.1 及之前版本，攻击向量为本地，需攻击者已具备本地账户访问权限，CVSS 评分 4.6（中等），主要影响系统的机密性、完整性和可用性。"
published = "2000-12-11T05:00:00.000"
remediation = "升级到 HP OpenView Network Node Manager 的最新修复版本，修改数据库配置脚本的文件权限，移除 setuid/setgid 位并限制仅授权用户可访问执行，同时检查数据库配置目录权限确保仅 root 用户可写。"
score = 4.6
severity = "MEDIUM"
sources = ["avd"]
title = "惠普 OpenView Network Node Manager 本地权限提升漏洞"
updated = "2026-06-16T21:53:04.020"

