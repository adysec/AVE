[basic]
description = "该漏洞属于存储型跨站脚本攻击（XSS）。DomainMOD 4.09.03 及以上版本（含 4.11.01）在“segments”页面的“Segment Name”字段中缺乏足够的输入过滤和输出编码。攻击者在拥有高权限的情况下，可以通过在段名称中注入恶意的 HTML 或 JavaScript 代码，使得任何访问该受影响页面的用户在浏览器中执行任意脚本。该漏洞影响 DomainMOD 4.09.03 及更高版本，攻击条件为受害者访问被注入的页面，可导致敏感信息泄露或账户被劫持。"
published = "2018-12-20T17:29:00Z"
remediation = "由于官方尚未发布针对此漏洞的正式补丁版本，建议管理员通过在 Web 应用防火墙（WAF）中配置对 Segment Name 字段的输入过滤规则来拦截恶意脚本。同时，建议开发者在代码层面对用户输入的 Segment Name 进行严格的 HTML 编码转义，确保所有输出至浏览器的内容均经过安全处理。"
score = 4.8
severity = "MEDIUM"
sources = ["nuclei"]
title = "DomainMOD DomainMOD 跨站脚本 (XSS) 漏洞"
updated = "2026-06-17T01:33:11Z"

