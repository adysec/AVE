[basic]
description = "TYPSoft FTP Server 0.78及更早版本中存在缓冲区溢出漏洞，远程攻击者可通过向FTP服务器发送超长的USER、PASS或CWD命令触发该漏洞，导致目标服务崩溃造成拒绝服务，甚至可能执行任意代码。攻击无需身份认证，仅需目标开放FTP端口（默认21）即可实施利用，危害严重。"
published = "2000-12-11T05:00:00Z"
remediation = "立即升级 TYPSoft FTP Server 至 0.79 或更高版本（如存在），该版本已修复 USER/PASS/CWD 命令缓冲区溢出问题。由于该软件已停止维护多年，强烈建议迁移至仍受支持的 FTP 服务器软件（如 FileZilla Server 或 vsftpd）。临时缓解措施：在防火墙层面限制对 FTP 端口（21/TCP）的访问来源 IP，仅允许可信网络段连接。"
score = 10
severity = "CRITICAL"
sources = ["epss"]
title = "TYPSoft FTP Server 缓冲区溢出远程代码执行漏洞"
updated = "2026-06-16T21:53:01Z"

