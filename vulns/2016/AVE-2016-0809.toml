[basic]
description = "Apache Tomcat 的 JmxRemoteLifecycleListener 组件存在远程代码执行漏洞，由于该监听器未与 Oracle CVE-2016-3427 补丁保持同步更新，导致对 JMX 认证凭据类型的校验不充分。远程攻击者可在无需认证的情况下访问 Tomcat 的 JMX 端口，通过构造恶意的序列化数据触发反序列化操作，从而在目标服务器上执行任意代码。该漏洞影响 Tomcat 6.0.48 之前、7.0.73 之前、8.0.39 之前、8.5.7 之前及 9.0.0.M12 之前版本，CVSS 评分 9.8，危害等级严重。"
published = "2017-04-06T21:59:00Z"
remediation = "升级 Apache Tomcat 至 6.0.48+、7.0.73+、8.0.39+、8.5.7+ 或 9.0.0.M12+ 版本。如无法立即升级，在 `conf/server.xml` 中移除或注释掉 `JmxRemoteLifecycleListener` 配置，并限制 JMX 端口仅对可信网络开放。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei"]
title = "Apache Tomcat JmxRemoteLifecycleListener 远程代码执行漏洞"
updated = "2026-06-17T00:54:54Z"

