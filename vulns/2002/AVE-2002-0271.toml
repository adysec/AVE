[basic]
description = "BPM Studio Pro 4.2 内置 HTTP 服务器存在目录遍历漏洞，远程未授权攻击者可在 HTTP 请求路径中构造 `../` 目录遍历序列，绕过目录限制读取服务器文件系统上的任意文件。该漏洞影响 BPM Studio Pro 4.2 版本，攻击者无需身份认证即可远程利用，通过发送包含目录遍历序列的 HTTP GET 请求即可窃取服务器敏感文件（如系统配置、源代码、数据库文件等），导致敏感信息泄露，CVSS 评分 5.0（中危），主要影响机密性。"
published = "2002-06-25T04:00:00Z"
remediation = "建议立即升级至 BPM Studio Pro 4.3 或更高版本（若已发布修复版本），或从官方渠道下载最新版本替换旧版本。若无法升级，请立即在防火墙层面禁止外部访问 HTTP 服务端口（默认 80/8080），仅允许可信内网 IP 访问。同时在 Web 服务器配置中禁用目录遍历功能，设置 Web 根目录权限为最小权限（只读、禁止目录遍历），并部署 WAF 规则拦截包含 ../ 等目录遍历载荷的 HTTP 请求作为临时缓解措施。若业务允许，建议彻底停用该 HTTP 服务并迁移至受支持的现代媒体播放软件。"
score = 5
severity = "MEDIUM"
sources = ["exploitdb"]
title = "BPM Studio BPM Studio Pro HTTP 服务目录遍历漏洞"
updated = "2026-06-16T21:57:13Z"

