[basic]
description = "tags.<value>Linux 内核 2.4 版本的 RPC 代码在创建套接字时设置了重用标志，导致本地低权限用户能够绑定到原本由特权服务（如 NFS 守护进程 nfsd）占用的 UDP 端口。由于内核未对套接字重用进行充分限制，攻击者可通过绑定这些端口劫持特权服务的网络通信，造成服务中断或潜在的信息泄露。该漏洞需要攻击者已在目标系统上拥有本地用户权限，影响运行 Linux 2.4 内核的系统。攻击者可利用此漏洞干扰 NFS 等关键网络服务的正常运行，进而影响系统可用性和数据完整性。"
published = "2003-08-27T04:00:00Z"
remediation = "建议将 Linux 内核升级至 2.4.22 或更高版本（该漏洞在 2.4.22-pre8 中已修复），补丁移除了 RPC 代码中创建 socket 时设置的 SO_REUSEADDR 标志，防止本地用户绑定到 nfsd 等特权服务使用的 UDP 端口。Ubuntu 用户可通过 apt 升级至内核 2.4.27-12 或更高版本，Red Hat 企业 Linux 用户应安装 RHSA-2003:238 安全更新。如无法立即升级内核，临时缓解措施为：通过 iptables 限制本地 UDP 端口的绑定权限，或禁用 nfsd 等 RPC 服务直至完成补丁安装。"
score = 4.6
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux kernel 2.4 RPC 套接字重用标志本地权限提升漏洞"
updated = "2026-06-16T22:02:15Z"

