[basic]
description = "muh 2.05d IRC 服务器的日志记录功能未正确过滤用户注入的格式化字符串，远程攻击者可通过向服务器发送特制的恶意昵称触发格式化字符串漏洞，导致拒绝服务或执行任意命令。该漏洞影响 muh 2.05d 及之前版本，CVSS 评分 7.5，危害等级高，攻击者无需认证即可远程利用，实现信息泄露、权限提升或服务崩溃。"
published = "2000-11-14T05:00:00Z"
remediation = '升级 muh 至 2.2a 或更高版本（SourceForge 已发布），或手动修改 muh.c 源码中第 1024 行附近，将 `irc_notice(&c_client, status.nickname, s)` 改为 `irc_notice(&c_client, status.nickname, "%s", s)` 后重新编译。临时缓解措施可关闭 muh 的日志记录功能（注释或删除配置中的 log 相关行）。'
score = 7.5
severity = "HIGH"
sources = ["avd"]
title = "muh IRC 服务器格式化字符串注入漏洞"
updated = "2026-06-16T21:52:36Z"

