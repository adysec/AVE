[basic]
description = "Apache mod_ssl 2.8.7 之前版本及 Apache-SSL 1.3.22+1.46 之前版本的 dbm 和 shm 会话缓存代码中，i2d_SSL_SESSION 函数未正确初始化内存，存在缓冲区溢出漏洞。远程攻击者可通过提交由受信任 CA 签名的超大客户端证书，生成超大的序列化会话数据触发该漏洞，导致远程代码执行。该漏洞影响运行 mod_ssl 的 Apache HTTP Server，CVSS 评分 7.5，危害等级高，攻击者无需身份认证即可远程利用。"
published = "2002-03-15T05:00:00Z"
remediation = "升级 Apache mod_ssl 至 2.8.7-1.3.23 及以上版本，或升级 Apache-SSL 至 1.3.22+1.46 及以上版本。如无法升级，在 Apache 配置中禁用客户端证书验证（将 SSLVerifyClient 设为 none）并限制可信 CA 签发的大证书以降低风险。"
score = 7.5
severity = "HIGH"
sources = ["exploitdb"]
title = "Apache mod_ssl 远程缓冲区溢出漏洞"
updated = "2026-06-16T21:56:44Z"

